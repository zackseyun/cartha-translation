  text: וַ/יֹּאמְר֖וּ נִקְרָ֣א לַֽ/נַּעֲרָ֑ וְ/נִשְׁאֲלָ֖ה אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പറഞ്ഞു: “നമുക്ക് ആ യുവതിയെ വിളിച്ച് അവളോടുതന്നെ ചോദിക്കാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവളുടെ വായ് ചോദിക്കാം”; അതായത്, അവളുടെ സ്വന്തം മറുപടി നേരിട്ട് കേൾക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ അവർ പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനക്രമം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നുപ്രകടിപ്പിക്കുന്നു.
- source_word: נִקְרָא
  choice: നമുക്ക് ... വിളിക്കാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ കൂട്ടായ നിർദേശം മലയാളത്തിൽ ‘നമുക്ക് ... വിളിക്കാം’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: לַנַּעֲרָ
  choice: ആ യുവതിയെ
  rationale: നַעֲרָה വിവാഹപ്രായത്തിലുള്ള റിബെക്കയെ സൂചിപ്പിക്കുന്നു; ‘യുവതി’ ആധുനികവും മാന്യവുമായ പദമാണ്. നിർദിഷ്ട വ്യക്തിയെ സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘ആ’ ചേർത്തു.
- source_word: וְנִשְׁאֲלָה
  choice: ചോദിക്കാം
  rationale: ആദ്യ കോഹോർട്ടേറ്റീവിനോടു ചേർന്ന രണ്ടാമത്തെ കൂട്ടായ നിർദേശം; ലളിതമായ ‘ചോദിക്കുക’ തന്നെയാണ് ഉചിതം.
- source_word: אֶת־פִּיהָ
  choice: അവളോടുതന്നെ
  rationale: അക്ഷരാർഥം ‘അവളുടെ വായ്’ എന്നാണെങ്കിലും, അവളുടെ സ്വന്തം മറുപടി നേരിട്ട് ചോദിച്ചറിയുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു പ്രയോഗത്തെ അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമാക്കാതെ, യുവതിയുടെ നേരിട്ടുള്ള സമ്മതം/മറുപടി ചോദിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
