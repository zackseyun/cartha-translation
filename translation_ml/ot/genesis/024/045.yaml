source:
  edition: WLC
  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: ml
  text: ഞാൻ എന്റെ ഹൃദയത്തോടു സംസാരിച്ചുതീരുന്നതിനുമുമ്പ്[a], ഇതാ, റിബെക്കാ തോളിൽ കുടം വച്ചുകൊണ്ട് പുറത്തുവന്നു. അവൾ നീരുറവയിലേക്കു[b] ഇറങ്ങി വെള്ളം കോരി. അപ്പോൾ ഞാൻ അവളോടു, ‘ദയവായി എനിക്ക് കുടിക്കാൻ തരൂ’ എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘എന്റെ ഹൃദയത്തോടു സംസാരിക്കുക’; ഉള്ളിലുള്ള സംസാരത്തെയോ പ്രാർഥനയെയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഉറവ’; എബ്രായപദം സാധാരണ ‘കിണർ’ എന്നതിനു ഉപയോഗിക്കുന്ന പദമല്ല, ഒരു സ്വാഭാവിക നീരുറവയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: തീരുന്നതിനുമുമ്പ്
  rationale: ടെരെം എന്നത് പരാമർശിക്കുന്ന സമയത്ത് പ്രവൃത്തി ഇനിയും പൂർത്തിയായിരുന്നില്ലെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ കാലബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: എന്റെ ഹൃദയത്തിൽ സംസാരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ ഹൃദയത്തോട് സംസാരിക്കുക’ എന്ന എബ്രായ പ്രയോഗം. ഇവിടെ ഉള്ളിലുള്ള സംസാരമോ പ്രാർഥനയോ ഉദ്ദേശിക്കാം; വ്യാഖ്യാനം ഒറ്റവിധം ഉറപ്പിക്കാതെ രൂപകം നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പെട്ടെന്നുള്ള സംഭവത്തെ സജീവമായി അവതരിപ്പിക്കുന്ന വ്യവഹാരകണത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: רִבְקָה
  choice: റിബെക്കാ
  rationale: എബ്രായ നാമമായ רִבְקָהയുടെ മലയാളത്തിൽ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: יֹצֵאת
  choice: പുറത്തുവന്നു
  rationale: הִנֵּהയ്ക്കു ശേഷമുള്ള കൃദന്തരൂപത്തിന്റെ ഉടനടിയുള്ള, സജീവമായ ആഖ്യാനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַדָּהּ
  choice: കുടവുമായി
  rationale: כַּד വെള്ളം കോരുന്നതിനുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്നു; ‘കുടം’ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദമാണ്.
- source_word: עַל־שִׁכְמָהּ
  choice: തോളിൽ
  rationale: ലളിതവും കൃത്യവുമായ സ്ഥാനസൂചന.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: നീരുറവയിലേക്കു ഇറങ്ങിച്ചെന്ന്
  rationale: עַיִן ഇവിടെ കിണറിനുള്ള പതിവുപദമായ בְּאֵר അല്ല, സ്വാഭാവിക നീരുറവയാണ്; ദിശാസൂചകാവസാനവും ירד എന്ന ഇറക്കപ്രവൃത്തിയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַתִּשְׁאָב
  choice: വെള്ളം കോരി
  rationale: ക്രിയയുടെ അർഥം വെള്ളം കോരുക എന്നതാണ്; മലയാളത്തിൽ കർമം വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: הַשְׁקִינִי נָא
  choice: ദയവായി എനിക്ക് കുടിക്കാൻ തരൂ
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം ‘കുടിക്കാൻ കൊടുക്കുക’ എന്നും נָא വിനയപൂർവമായ അപേക്ഷ എന്നും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഹൃദയത്തിലെ സംസാരത്തിന്റെ സ്വഭാവം
  choice: ‘എന്റെ ഹൃദയത്തിൽ സംസാരിച്ചു’ എന്ന ഉറവിടസന്നിഹിത പ്രയോഗം നിലനിർത്തി
  alternative: ‘മനസ്സിൽ പ്രാർഥിച്ചു’ / ‘സ്വയം പറഞ്ഞു’
  rationale: സന്ദർഭത്തിൽ ഇത് ഉള്ളിലുള്ള പ്രാർഥനയായിരിക്കാം; എങ്കിലും എബ്രായം അതിനെ സാങ്കേതികമായി ‘പ്രാർഥന’ എന്നു പേരിടുന്നില്ല. അതിനാൽ അർഥസാധ്യത ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനത്തിലെ ‘ഇതാ’ എന്ന സജീവതയും ‘ഹൃദയം’ എന്ന രൂപകവും നിലനിർത്തി; ‘നീരുറവ’ ഉപയോഗിച്ച് עַיִן എന്ന പദത്തെ ‘കിണർ’ എന്നതുമായി ലയിപ്പിച്ചില്ല.
