base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: ml
  text: അവൾ പറഞ്ഞു, “കുടിക്കൂ, അയ്യാ[a].” പിന്നെ അവൾ വേഗം തന്റെ കുടം കൈമേൽ ഇറക്കി അവനു കുടിക്കാൻ കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അയ്യാ” എന്നതിന് അക്ഷരാർഥം “എന്റെ പ്രഭോ” എന്നാണ്. ഇവിടെ ഇത് ഒരു പുരുഷനോടുള്ള ആദരപൂർവമായ സംബോധനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: കുടിച്ചാലും
  rationale: രണ്ടാം പുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ക്ഷണം മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇവിടെ ദൈവിക നാമമല്ല, ഒരു പുരുഷനോടുള്ള ആദരപൂർവമായ സംബോധനയാണ്. അക്ഷരാർഥമായ സാമൂഹിക ആദരം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദാസ്യബന്ധം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: וַתְמַהֵר
  choice: ഉടനെ
  rationale: അവൾ വേഗത്തിലും താമസമില്ലാതെയും പ്രവർത്തിച്ചതെന്ന ആഖ്യാന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: തന്റെ കുടം ... താഴ്ത്തി
  rationale: ചുമന്നിരുന്ന പാത്രം താഴേക്കു കൊണ്ടുവന്ന ശാരീരിക പ്രവൃത്തി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: עַל יָדָהּ
  choice: കൈയിലേക്കു
  rationale: ഹീബ്രുവിലെ ‘അവളുടെ കൈമേൽ/കൈയിലേക്കു’ എന്ന വ്യക്തമായ രൂപം സംരക്ഷിക്കുന്നു; ഈ വാക്യത്തിൽ പറയാത്ത ‘തോളിൽനിന്ന്’ എന്ന വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: וַתַּשְׁקֵהוּ
  choice: അവനു കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
