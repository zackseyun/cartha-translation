lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת־עֵינֶיהָ
  choice: കണ്ണുകളുയർത്തി
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നതോടൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַתֵּרֶא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ലളിതമായ ദൃശ്യഗ്രഹണം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת־יִצְחָק
  choice: യിസ്ഹാക്കിനെ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾരൂപത്തിൽ നൽകിയിരിക്കുന്നു; കർമവിഭക്തി വാക്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: ഒട്ടകപ്പുറത്തുനിന്ന് ഇറങ്ങി
  rationale: נפל എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വീഴുക’ എന്നാണെങ്കിലും ഈ സന്ദർഭത്തിൽ ഒട്ടകത്തിൽനിന്ന് ഇറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത. ‘ഇറങ്ങി’ അപകടമായി വീണെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കി സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וַתִּפֹּל എന്ന ക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭാർഥവും തമ്മിലുള്ള അനിശ്ചിതത്വം
  choice: പ്രധാനപാഠത്തിൽ ‘ഇറങ്ങി’
  alternative: ‘ഒട്ടകപ്പുറത്തുനിന്ന് വീണു’
  rationale: തുടർന്നുള്ള മാന്യമായ കൂടിക്കാഴ്ചയുടെ സന്ദർഭത്തിൽ ഇത് ഇറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന വായന കൂടുതൽ യോജിക്കുന്നു. എന്നിരുന്നാലും എബ്രായത്തിലെ ‘വീണു’ എന്ന രൂപം മായ്ച്ചുകളയാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി യഥാർഥ ഭാഷാപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കണ്ണുകളുയർത്തി’ എന്ന എബ്രായഭാവം സ്വാഭാവികമായി നിലനിർത്തി; ‘ഇറങ്ങി’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണ്.
