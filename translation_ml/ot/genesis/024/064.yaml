  text: റിബെക്ക കണ്ണുകൾ ഉയർത്തി യിസ്ഹാക്കിനെ കണ്ടു; അവൾ ഒട്ടകപ്പുറത്തുനിന്ന് ഇറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവൾ ഒട്ടകപ്പുറത്തുനിന്ന് വീണു.’ ഇവിടെ എബ്രായത്തിലെ ‘വീണു’ എന്ന പദം ഒട്ടകത്തിൽനിന്ന് ഇറങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമായിരിക്കാം.'
