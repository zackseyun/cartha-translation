translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ചോദ്യം, സാധ്യത, സ്ത്രീയുടെ സമ്മതം, ‘തിരികെ’ എന്ന ആശയം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു. പ്രധാനവാക്യത്തിൽ ഉപയോഗിച്ച ഏക അടിക്കുറിപ്പുചിഹ്നമായ [a] അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
