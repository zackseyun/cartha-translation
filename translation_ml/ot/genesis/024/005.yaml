  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: ml
  text: 'അപ്പോൾ ദാസൻ അവനോടു പറഞ്ഞു: “ഒരുപക്ഷേ ആ സ്ത്രീ എന്നെ അനുഗമിച്ച് ഈ ദേശത്തേക്കു വരാൻ തയ്യാറാകാതിരുന്നാൽ, അങ്ങനെയെങ്കിൽ നിന്റെ മകനെ ഞാൻ നീ വന്ന ദേശത്തേക്കു തിരികെ കൊണ്ടുപോകണമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘തിരികെ കൊണ്ടുപോകുക’ എന്ന ക്രിയ ഊന്നിപ്പറയുന്ന ഒരു വ്യാകരണഘടനയിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ‘നിന്റെ മകനെ ഞാൻ ശരിക്കും തിരികെ കൊണ്ടുപോകണമോ?’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ/സേവകൻ എന്നീ അർഥങ്ങളുണ്ട്. അബ്രാഹാമിന്റെ അധികാരത്തിൻ കീഴിലുള്ള ഗൃഹഭൃത്യന്റെ സാമൂഹികസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: സാധ്യതയോ അനിശ്ചിതത്വമോ അവതരിപ്പിക്കുന്ന പദമാണ്; ആഖ്യാനത്തിന്റെ മാന്യമായ ശൈലിക്ക് ‘ഒരുപക്ഷേ’ അനുയോജ്യം.
- source_word: לֹא תֹאבֶה
  choice: സമ്മതിക്കാതിരുന്നാൽ
  rationale: אָבָה സന്നദ്ധതയെയും സമ്മതത്തെയും സൂചിപ്പിക്കുന്നു. സാങ്കൽപ്പിക സാഹചര്യത്തിലുള്ള ഭാവിസാധ്യത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: എബ്രായപാഠം പ്രായമോ ഭാവിയിലെ ഭാര്യയെന്ന സ്ഥാനമോ ഇവിടെ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വിപുലീകരണമില്ലാത്ത നേരിട്ടുള്ള വിവർത്തനം നിലനിർത്തി.
- source_word: לָלֶכֶת אַחֲרַי
  choice: എന്നെ അനുഗമിച്ച് ... വരാൻ
  rationale: അക്ഷരാർഥം ‘എന്റെ പിന്നാലെ പോകാൻ’ എന്നാണ്. ലക്ഷ്യസ്ഥാനം സംസാരിക്കുന്നവരുടെ ഇപ്പോഴത്തെ ദേശമായതിനാൽ മലയാളത്തിൽ ‘അനുഗമിച്ച് ... വരാൻ’ സ്വാഭാവികമായി ദിശയും പിന്തുടരലും ഒരുമിച്ച് നൽകുന്നു.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തേക്ക്
  rationale: אֶרֶץ എന്നതിന് ദേശം/നാട് എന്നർഥമുണ്ട്. പിതൃപാരമ്പര്യ ആഖ്യാനത്തിലെ ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിന് ‘ദേശം’ യോജിക്കുന്നു.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: ഞാൻ തിരികെ കൊണ്ടുപോകണമോ?
  rationale: ശוב് എന്ന ധാതുവിന്റെ infinitive absolute + finite verb ഘടന പ്രവർത്തനത്തിന് ഊന്നൽ നൽകുന്നു. ചോദ്യം നിർബന്ധം പ്രഖ്യാപിക്കുന്നതല്ല, ചെയ്യേണ്ടതിനെക്കുറിച്ചുള്ള ആലോചനയാണ്; അതിനാൽ ‘കൊണ്ടുപോകണമോ?’ എന്ന് നൽകി, ഊന്നൽ സംബന്ധിച്ച വിവരം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֶת בִּנְךָ
  choice: നിന്റെ മകനെ
  rationale: നേരിട്ടും അവ്യക്തതയില്ലാതെയും ഉള്ള സമാനപദപ്രയോഗം.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: നീ പുറപ്പെട്ടുപോന്ന ദേശത്തേക്ക്
  rationale: יָצָא എന്നത് അക്ഷരാർഥത്തിൽ ‘പുറപ്പെടുക’ എന്നാണ്. ബന്ധവാക്യത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ഉറവിടദേശത്തെ സൂചിപ്പിക്കുന്നു.
