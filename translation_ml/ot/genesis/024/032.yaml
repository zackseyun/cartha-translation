source:
  edition: WLC
  text: וַ/יָּבֹ֤א הָ/אִישׁ֙ הַ/בַּ֔יְתָ/ה וַ/יְפַתַּ֖ח הַ/גְּמַלִּ֑ים וַ/יִּתֵּ֨ן תֶּ֤בֶן וּ/מִסְפּוֹא֙ לַ/גְּמַלִּ֔ים וּ/מַ֨יִם֙ לִ/רְחֹ֣ץ רַגְלָ֔י/ו וְ/רַגְלֵ֥י הָ/אֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: ml
  text: അങ്ങനെ ആ മനുഷ്യൻ വീട്ടിനകത്തു വന്നു. അവൻ ഒട്ടകങ്ങളുടെ കെട്ടുകൾ അഴിച്ചു[a]; ഒട്ടകങ്ങൾക്ക് വൈക്കോലും തീറ്റയും കൊടുത്തു. അവന്റെയും കൂടെയുണ്ടായിരുന്ന പുരുഷന്മാരുടെയും കാലുകൾ കഴുകാൻ വെള്ളവും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒട്ടകങ്ങളുടെ ചുമടിറക്കി” അല്ലെങ്കിൽ “ഒട്ടകങ്ങളെ അഴിച്ചുവിട്ടു.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഒട്ടകങ്ങളെ തുറന്നു” എന്നാണ്; യാത്രയ്ക്കുശേഷം അവയുടെ കെട്ടുകളോ സാമഗ്രികളോ അഴിക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: ആ മനുഷ്യൻ വീട്ടിനകത്തു വന്നു
  rationale: בואയും ദിശാസൂചകമായ הַבַּיְתָהയും വീട്ടിലേക്കോ വീട്ടിനകത്തേക്കോ ഉള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു. הָאִישׁ എന്നത് വ്യാഖ്യാനാത്മകമായി ‘ദാസൻ’ എന്നു മാറ്റാതെ ‘ആ മനുഷ്യൻ’ എന്നു തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: അവൻ ഒട്ടകങ്ങളുടെ കെട്ടുകൾ അഴിച്ചു
  rationale: פתח എന്നതിന്റെ അക്ഷരാർഥം ‘തുറക്കുക’ എന്നാണെങ്കിലും ഒട്ടകങ്ങളോടൊപ്പം വന്നപ്പോൾ അവയുടെ യാത്രാസാമഗ്രികളോ കെട്ടുകളോ അഴിച്ച് അവയെ ആശ്വസിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘കെട്ടുകൾ അഴിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലപ്രയോഗത്തിന്റെ ദൃശ്യബിംബത്തോട് അടുത്തതുമാണ്.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: വൈക്കോലും തീറ്റയും
  rationale: תֶּבֶן മൃഗങ്ങൾക്ക് ഉപയോഗിക്കുന്ന വൈക്കോൽ/ഉണങ്ങിയ തണ്ട് എന്നും מִסְפּוֹא മൃഗങ്ങളുടെ തീറ്റ എന്നും സൂചിപ്പിക്കുന്നു. ഈ രണ്ടിനുമിടയിലെ വ്യത്യാസം നിലനിർത്തി.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: അവന്റെ കാലുകൾ കഴുകാൻ വെള്ളം
  rationale: ലാമെദോടുകൂടിയ infinitive construct ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘കഴുകാൻ’ എന്നത് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: കൂടെയുണ്ടായിരുന്ന പുരുഷന്മാരുടെ കാലുകൾ
  rationale: אֲנָשִׁים എന്ന ബഹുവചനവും אֲשֶׁר אִתּוֹ എന്ന ബന്ധവാക്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: וַיְפַתַּח, וַיִּתֵּן എന്നീ ക്രിയകളുടെ കർത്താവ്
  choice: മൂലപാഠത്തിലെ തുടർച്ച അനുസരിച്ച് ‘അവൻ’ എന്നു നൽകി; വ്യക്തിയുടെ പേര് ചേർത്തില്ല
  alternative: സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘ലാബാൻ’ എന്നു വ്യക്തമായി ചേർക്കുക
  rationale: ക്രിയകൾ മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും ഈ വാക്യത്തിൽ ലാബാന്റെ പേര് ഇല്ല. മുൻവാക്യത്തിലെ കർത്താവായ ‘ആ മനുഷ്യൻ’ എന്നതിലേക്ക് വ്യാകരണപരമായി അവയെ ബന്ധിപ്പിക്കാം; അതേസമയം ആതിഥേയനായ ലാബാനെയോ അവന്റെ വീട്ടുകാരെയോ സന്ദർഭം സൂചിപ്പിക്കുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു. വിവർത്തനത്തിൽ പേരുചേർത്ത് ഈ യഥാർഥ അവ്യക്തത തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നീണ്ട ഏകവാക്യം സ്വാഭാവികമായ വായനയ്ക്കായി മൂന്ന് വാക്യങ്ങളാക്കി; സംഭവക്രമം മാറ്റിയിട്ടില്ല. ‘വൈക്കോൽ’, ‘തീറ്റ’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ച് പഴഞ്ചൻ ശബ്ദാവലി ഒഴിവാക്കി.
