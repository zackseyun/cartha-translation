  text: כִּ֧י אֶל אַרְצִ֛/י וְ/אֶל מוֹלַדְתִּ֖/י תֵּלֵ֑ךְ וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִ֥/י לְ/יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/004.yaml
  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: ml
  text: എന്നാൽ നീ എന്റെ ദേശത്തേക്കും എന്റെ ബന്ധുക്കളുടെയിടയിലേക്കും[a] പോയി, എന്റെ മകൻ യിസ്ഹാക്കിനുവേണ്ടി ഒരു ഭാര്യയെ എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ജന്മസ്ഥലത്തേക്ക്.” എബ്രായപദത്തിന് ജന്മസ്ഥലത്തെയോ ഒരാളുടെ ബന്ധുഗണത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം ബന്ധുക്കൾ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കനാന്യരിൽനിന്ന് ഭാര്യയെ എടുക്കരുതെന്ന വിലക്കിനോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל אַרְצִי
  choice: എന്റെ ദേശത്തേക്ക്
  rationale: אֶרֶץ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥം നിലനിർത്തുന്നു; ആധുനിക രാഷ്ട്രസങ്കൽപ്പം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: എന്റെ ബന്ധുക്കളുടെ അടുക്കലേക്ക്
  rationale: מוֹלֶדֶת ജന്മസ്ഥലത്തെയോ ബന്ധുഗണത്തെയോ സൂചിപ്പിക്കാം. ഭാര്യയെ കണ്ടെത്താനുള്ള ഈ സന്ദർഭത്തിൽ ബന്ധുഗണം എന്ന അർഥമാണ് കൂടുതൽ യോജിച്ചത്.
- source_word: תֵּלֵךְ
  choice: പോയി
  rationale: തുടർന്നുള്ള 'കൊണ്ടുവരണം' എന്ന നിർദേശത്തോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാർഥഘടന നൽകുന്നു.
- source_word: וְלָקַחְתָּ
  choice: കൊണ്ടുവരണം
  rationale: വിവാഹത്തിനായി ഭാര്യയെ കണ്ടെത്തി കൂട്ടിക്കൊണ്ടുവരുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; 'എടുക്കുക' എന്ന അക്ഷരാർഥം ഇവിടെ അസ്വാഭാവികമാകും.
- source_word: אִשָּׁה
  choice: ഒരു ഭാര്യ
  rationale: വിവാഹസന്ദർഭത്തിൽ אִשָּׁה എന്നത് 'സ്ത്രീ' എന്നതിലുപരി 'ഭാര്യ' എന്നാണ്.
- source_word: לִבְנִי לְיִצְחָק
  choice: എന്റെ മകൻ യിസ്ഹാക്കിനുവേണ്ടി
  rationale: ആവർത്തിച്ച לְ സൂചിപ്പിക്കുന്ന ഗുണഭോക്തൃ-അനുബന്ധ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ പ്രയോഗത്തിൽ നൽകുന്നു.
