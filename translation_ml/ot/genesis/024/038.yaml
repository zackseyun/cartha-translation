source:
  edition: WLC
  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: ml
  text: എന്നാൽ നീ എന്റെ പിതാവിന്റെ ഭവനത്തിലേക്കും എന്റെ ബന്ധുഗണത്തിന്റെ അടുക്കലേക്കും[a] പോയി എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ കുടുംബത്തിലേക്കും’ അല്ലെങ്കിൽ ‘എന്റെ ബന്ധുക്കളുടെ അടുക്കലേക്കും.’ എബ്രായപദം അടുത്ത കുടുംബത്തെ മാത്രമല്ല, വിശാലമായ ബന്ധുഗണത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: പകരം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിനോടു വിരുദ്ധമായി, പ്രതിജ്ഞാസന്ദർഭത്തിൽ ഈ പ്രയോഗം ശക്തമായ തിരുത്തൽ/വിരുദ്ധത സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പകരം’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּית אָבִי
  choice: എന്റെ പിതൃഭവനം
  rationale: ‘എന്റെ പിതാവിന്റെ വീട്’ എന്ന ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥലത്തെയും പിതാവിന്റെ കുടുംബഗൃഹത്തെയും സൂചിപ്പിക്കാവുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: תֵּלֵךְ
  choice: നീ ... പോയി
  rationale: ഇവിടെ അപൂർണ്ണക്രിയ പ്രതിജ്ഞയ്ക്കുള്ളിലെ നിർദേശം/ബാധ്യതയാണ്. തുടർന്നുള്ള ‘കൊണ്ടുവരണം’ എന്ന നിർദേശത്തോടു ചേർന്ന മലയാള വാക്യഘടനയിൽ ‘പോയി’ സ്വാഭാവികമാണ്.
- source_word: מִשְׁפַּחְתִּי
  choice: എന്റെ കുലം
  rationale: ഉടൻകുടുംബത്തേക്കാൾ വിശാലമായ ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്ന מִשְׁפָּחָה എന്ന പദത്തിന് ‘കുലം’ യോജിക്കുന്നു; സാധ്യതയുള്ള മറ്റർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: ഒരു ഭാര്യയെ കൊണ്ടുവരണം
  rationale: വിവാഹക്രമീകരണസന്ദർഭത്തിൽ לקח אשה എന്നത് മകനുവേണ്ടി ഭാര്യയെ കണ്ടെത്തി കൊണ്ടുവരുന്നതാണ്. അക്ഷരാർഥമായ ‘എടുക്കണം’ ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായതിനാൽ സന്ദർഭാർഥം നൽകി.
- source_word: לִבְנִי
  choice: എന്റെ മകനുവേണ്ടി
  rationale: לְ ഇവിടെ പ്രയോജനം/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘മകനുവേണ്ടി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
