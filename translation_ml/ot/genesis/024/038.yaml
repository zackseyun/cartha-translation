translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതൃഭവനം’ എന്നത് ഉറവിടത്തിലെ ‘പിതാവിന്റെ വീട്’ എന്ന രൂപത്തിന്റെ സാംസ്കാരിക ഭാവം നിലനിർത്തുന്നു; ‘കുലം’ എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
