id: GEN.24.33
reference: Genesis 24:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/יישם לְ/פָנָי/ו֙ לֶ/אֱכֹ֔ל וַ/יֹּ֨אמֶר֙ לֹ֣א אֹכַ֔ל עַ֥ד אִם דִּבַּ֖רְתִּי דְּבָרָ֑/י וַ/יֹּ֖אמֶר דַּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: ml
  text: 'അവന്റെ മുമ്പിൽ ഭക്ഷിക്കാനായി ഭക്ഷണം വെച്ചു. എന്നാൽ അവൻ പറഞ്ഞു: “എനിക്ക് പറയാനുള്ളത് പറഞ്ഞുകഴിയുന്നതുവരെ ഞാൻ ഭക്ഷിക്കുകയില്ല.” അപ്പോൾ അവൻ പറഞ്ഞു: “പറയൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: ശׂים എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വെക്കുക’ എന്നാണ്. ഹീബ്രുവിൽ കർത്താവ് വ്യക്തമായി പറയാത്തതിനാൽ മലയാളത്തിലും സന്ദർഭത്തിൽ സ്വാഭാവികമായ പൊതുകർത്തൃപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ
  rationale: ‘അവന്റെ സന്നിധിയിൽ/മുഖത്തിനു മുമ്പിൽ’ എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֶאֱכֹל
  choice: അവന് ഭക്ഷിക്കാൻ
  rationale: ל ചേർന്ന infinitive construct ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ഭക്ഷണം അവൻ ഭക്ഷിക്കാനായി വെച്ചതാണെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֹא אֹכַל
  choice: ഞാൻ ഭക്ഷിക്കുകയില്ല
  rationale: നിശ്ചയദാർഢ്യമുള്ള നിരാകരണവും ഭാവിസൂചനയും ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד אִם
  choice: വരെ
  rationale: ഭക്ഷിക്കാതിരിക്കുന്നതിനുള്ള സമയപരിധിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘അല്ലെങ്കിൽ’ എന്ന നിബന്ധനാർഥമല്ല.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: എനിക്ക് പറയാനുള്ളത് പറഞ്ഞുകഴിയുന്നതുവരെ
  rationale: അക്ഷരാർഥം ‘എന്റെ വാക്കുകൾ ഞാൻ സംസാരിക്കുന്നതുവരെ’ എന്നാണ്. മലയാളത്തിൽ അതേ ആശയം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: דַּבֵּר
  choice: പറയൂ
  rationale: דבר എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം. സംഭാഷണസന്ദർഭത്തിൽ ‘പറയൂ’ സംക്ഷിപ്തവും സ്വാഭാവികവും മാന്യവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘എന്റെ വാക്കുകൾ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം അതിന്റെ സന്ദർഭാർഥമായ ‘എനിക്ക് പറയാനുള്ളത്’ സ്വീകരിച്ചു; ഇതിൽ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
