  terminology: “ഭക്ഷണം,” “ഭക്ഷിക്കുകയില്ല,” and “പറയൂ” suit a modern standard narrative register. No theological terminology is at issue. No footnote is required in Malayalam, since the contextual expression “എനിക്ക് പറയാനുള്ളത്” is straightforward and does not conceal a materially disputed sense.
