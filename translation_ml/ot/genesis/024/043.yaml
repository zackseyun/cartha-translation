id: GEN.24.43
reference: Genesis 24:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וְ/הָיָ֤ה הָֽ/עַלְמָה֙ הַ/יֹּצֵ֣את לִ/שְׁאֹ֔ב וְ/אָמַרְתִּ֣י אֵלֶ֔י/הָ הַשְׁקִֽי/נִי נָ֥א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: ml
  text: 'ഇതാ, ഞാൻ നീരുറവയ്ക്കരികെ നിൽക്കുന്നു. ഇങ്ങനെ സംഭവിക്കട്ടെ: വെള്ളം കോരാൻ പുറത്തുവരുന്ന യുവതിയോട്[a] ഞാൻ, ‘ദയവായി നിന്റെ കുടത്തിൽനിന്ന് കുറച്ചു വെള്ളം എനിക്കു കുടിക്കാൻ തരൂ’ എന്നു പറയുമ്പോൾ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം വിവാഹപ്രായമായ ഒരു യുവതിയെ സൂചിപ്പിക്കുന്നു; അതിന് സ്വതവേ ‘കന്യക’ എന്ന അർഥം നിർബന്ധമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: രംഗത്തെ സജീവമായി മുന്നിൽ കൊണ്ടുവരുന്ന നിർദേശക കണികയെ സ്വാഭാവികവും അന്തസ്സുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: נִצָּב עַל עֵין הַמָּיִם
  choice: നീരുറവയ്ക്കരികെ നിൽക്കുന്നു
  rationale: עֵין ഇവിടെ കിണറിനെക്കാൾ കൃത്യമായി സ്വാഭാവിക ജലസ്രോതസ്സായ ഉറവയെ സൂചിപ്പിക്കുന്നു; വർത്തമാന കൃദന്തം തുടരുന്ന നിലപാടായി വിവർത്തനം ചെയ്തു.
- source_word: וְהָיָה
  choice: ഇങ്ങനെ സംഭവിക്കട്ടെ
  rationale: പ്രാർഥനാപരമായ ഈ അടയാളനിർണയത്തിൽ ആഗ്രഹമോ അഭ്യർഥനയോ സൂചിപ്പിക്കുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: הָעַלְמָה
  choice: യുവതി
  rationale: വിവാഹപ്രായമായ ഒരു യുവതിയെ സൂചിപ്പിക്കുന്ന പദമാണിത്; പദം തനിയെ കന്യകാത്വം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: വെള്ളം കോരാൻ പുറത്തുവരുന്ന
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന യുവതിയുടെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം സ്വാഭാവികമായ മലയാള ബന്ധവാക്യമായി നൽകി; സന്ദർഭവ്യക്തതയ്ക്കായി ‘വെള്ളം’ ചേർത്തു.
- source_word: הַשְׁקִינִי נָא מְעַט מַיִם מִכַּדֵּךְ
  choice: ദയവായി നിന്റെ കുടത്തിൽനിന്ന് കുറച്ചു വെള്ളം എനിക്കു കുടിക്കാൻ തരൂ
  rationale: ശקה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരകഭാവവും נָא എന്ന വിനയസൂചക കണികയും സ്വാഭാവിക മലയാള അഭ്യർഥനയായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: עַלְמָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യുവതി
  alternative: കന്യക / യുവകന്യക
  rationale: ഈ എബ്രായ പദം ഇവിടെ വിവാഹപ്രായമായ യുവതിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതുകൊണ്ടുമാത്രം കന്യകാത്വം നിർബന്ധമായി പ്രസ്താവിക്കപ്പെടുന്നില്ല. അതിനാൽ കഥാസന്ദർഭത്തിലേക്ക് പിന്നീടുള്ള ദൈവശാസ്ത്രവാദങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ പദത്തിന്റെ പരിധി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും അന്തസ്സുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി; ‘ഇങ്ങനെ സംഭവിക്കട്ടെ’ പ്രാർഥനാപരമായ നിബന്ധനാഭാവം വ്യക്തമാക്കുന്നു.
