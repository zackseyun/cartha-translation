id: GEN.24.3
reference: Genesis 24:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: ml
  text: 'സ്വർഗത്തിന്റെ ദൈവവും ഭൂമിയുടെ ദൈവവുമായ യഹ്‌വെയെ[a] സാക്ഷിയാക്കി ഞാൻ നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിക്കും: ഞാൻ പാർക്കുന്ന കനാന്യരുടെ പുത്രിമാരിൽനിന്ന് നീ എന്റെ മകനുവേണ്ടി ഭാര്യയെ എടുക്കരുത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: യഹ്‌വെ (YHWH), ഇസ്രായേലിന്റെ ദൈവനാമം.'
    reason: മൂലപാഠത്തിലെ ദൈവനാമത്തിന്റെ ലിപ്യന്തരണരീതി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: ഞാൻ നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിക്കും
  rationale: 'שׁבע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകബലം വ്യക്തമാക്കുന്നു: സംസാരിക്കുന്നവൻ ദാസനെക്കൊണ്ട് സത്യം ചെയ്യിക്കുന്നു.'
- source_word: בַּיהוָה
  choice: യഹോവയെക്കൊണ്ട്
  rationale: בְּ ഇവിടെ ശപഥം ആരെ സാക്ഷിയാക്കി ചെയ്യുന്നു എന്നു സൂചിപ്പിക്കുന്നു; יְהוָה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: സ്വർഗത്തിന്റെ ദൈവവും ഭൂമിയുടെ ദൈവവുമായ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചിരിക്കുന്ന രണ്ടു നിർമിതബന്ധങ്ങളും നിലനിർത്തുന്നു; സ്വർഗം–ഭൂമി എന്ന സമഗ്രമായ പ്രപഞ്ചപരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: നീ ... എടുക്കരുത്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കമായ ഉറച്ച നിരോധനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִשָּׁה לִבְנִי
  choice: എന്റെ മകനുവേണ്ടി ഭാര്യയെ
  rationale: വിവാഹസന്ദർഭത്തിൽ אִשָּׁה എന്നത് പൊതുവായ ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ എന്നാണ് ഉചിതം.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: കനാന്യരുടെ പുത്രിമാരിൽനിന്ന്
  rationale: ഒരു ജനവിഭാഗത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ‘പുത്രിമാർ’ എന്ന എബ്രായ പ്രയോഗചിത്രം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: ഞാൻ പാർക്കുന്ന
  rationale: ആ ജനത്തിന്റെ ഇടയിൽ താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു; പാഠത്തിലെ ഉടമ്പടിനാമത്തെ മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘സത്യം ചെയ്യിക്കും’ എന്നത് കാരകക്രിയ നിലനിർത്തുന്നു; ‘പുത്രിമാർ’ എന്നത് എബ്രായ ജനവിഭാഗപ്രയോഗത്തിന്റെ രൂപകൽപ്പന സംരക്ഷിക്കുന്നു.
