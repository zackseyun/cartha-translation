id: GEN.24.35
reference: Genesis 24:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: ml
  text: യഹോവ എന്റെ യജമാനനെ അത്യന്തം അനുഗ്രഹിച്ചിരിക്കുന്നു; അദ്ദേഹം മഹാനായിത്തീർന്നിരിക്കുന്നു. യഹോവ അദ്ദേഹത്തിന് ആടുമാടുകൾ, വെള്ളി, പൊന്ന്, ദാസന്മാർ, ദാസിമാർ,[a] ഒട്ടകങ്ങൾ, കഴുതകൾ എന്നിവ നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിമകളായ പുരുഷന്മാരും സ്ത്രീകളും.” എബ്രായപദങ്ങൾ സന്ദർഭമനുസരിച്ച് വീട്ടുസേവകരെയോ അടിമകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുവേ പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּרַךְ ... מְאֹד
  choice: അത്യന്തം അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: ക്രിയയോടൊപ്പമുള്ള ശക്തമായ തീവ്രതയും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനെ
  rationale: ഇവിടെ ദൈവിക സംബോധനയല്ല, ദാസന്റെ മനുഷ്യനായ അധികാരിയായ അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּגְדָּל
  choice: അദ്ദേഹം മഹാനായിത്തീർന്നിരിക്കുന്നു
  rationale: സമ്പത്ത് മാത്രമായി അർഥം ചുരുക്കാതെ പദത്തിന്റെ വിശാലമായ ‘മഹാനാകുക’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകൾ
  rationale: ചെറുകന്നുകാലികളെയും കന്നുകാലികളെയും ഉൾക്കൊള്ളുന്ന, സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തപ്രയോഗം.
- source_word: כֶּסֶף וְזָהָב
  choice: വെള്ളി, പൊന്ന്
  rationale: വിലയേറിയ ലോഹങ്ങളെ സൂചിപ്പിക്കുന്ന മൂലപദങ്ങളുടെ ദൃശ്യമായ അർഥം നിലനിർത്തുന്നു.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: ദാസന്മാർ, ദാസിമാർ
  rationale: ലിംഗവ്യത്യാസം നിലനിർത്തുകയും സേവകർ/അടിമകൾ എന്ന സന്ദർഭാധീനമായ അർഥവ്യാപ്തി പ്രധാനപാഠത്തിൽ അമിതമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: גְּמַלִּים וַחֲמֹרִים
  choice: ഒട്ടകങ്ങൾ, കഴുതകൾ
  rationale: രണ്ടു മൃഗനാമങ്ങളുടെയും നേരിട്ടുള്ള സ്വാഭാവിക മലയാള സമാനപദങ്ങൾ.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു മാറ്റി പേരിനെ പദവിയാക്കുന്നില്ല. മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ഉപയോഗിച്ചത്.
- issue: עֲבָדִם / שְׁפָחֹת എന്ന പദങ്ങളുടെ സാമൂഹിക അർഥം
  choice: ദാസന്മാർ, ദാസിമാർ
  alternative: അടിമകളായ പുരുഷന്മാരും സ്ത്രീകളും
  rationale: ഈ പദങ്ങൾ വീട്ടുസേവകരെയോ അടിമകളെയോ സൂചിപ്പിക്കാം. പട്ടികയിലെ സന്ദർഭം അടിമസ്ഥിതി സാധ്യമാക്കുന്നുവെങ്കിലും അതു നിർവിവാദമായി തീർപ്പാക്കാതെ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ആവർത്തിക്കുന്ന ദൈവിക കർത്താവിനെ രണ്ടാം വാക്യത്തിൽ വ്യക്തമാക്കിയത് സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാനാണ്; സമ്പത്തിനെ മാത്രം സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘മഹാനായി’ എന്നത് ചുരുക്കിയിട്ടില്ല.
