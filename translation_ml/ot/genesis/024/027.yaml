id: GEN.24.27
reference: Genesis 24:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ വാഴ്ത്തപ്പെടട്ടെ! എന്റെ യജമാനനോടുള്ള തന്റെ അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും[a] അവിടന്ന് ഉപേക്ഷിച്ചിട്ടില്ല. എന്നെ സംബന്ധിച്ചിടത്തോളം, യഹ്‌വേ എന്നെ വഴിയിൽ നയിച്ച് എന്റെ യജമാനന്റെ സഹോദരന്മാരുടെ[b] വീട്ടിലേക്ക് കൊണ്ടുവന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ദയയും സത്യവും.” ഈ എബ്രായ പദജോടി പലപ്പോഴും സ്ഥിരമായ സ്നേഹത്തിന്റെയും ബന്ധപരമായ വിശ്വസ്തതയുടെയും ആശയം വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “സഹോദരന്മാർ”; ഇവിടെ അബ്രാഹാമിന്റെ പുരുഷബന്ധുക്കളെയോ കുടുംബവംശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെടട്ടെ
  rationale: യഹ്‌വേയോടുള്ള സ്തുതിപൂർവമായ ആശീർവാദപ്രഖ്യാപനമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആരാധനാഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തപദക്രമത്തിന്റെ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: തന്റെ അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും
  rationale: ഈ പദജോടിയിലെ സ്ഥിരമായ സ്നേഹം, ബന്ധപരമായ വിശ്വസ്തത എന്നീ ആശയങ്ങൾ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ദയയും സത്യവും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מֵעִם אֲדֹנִי
  choice: എന്റെ യജമാനനോടുള്ള
  rationale: עָזַב എന്ന ക്രിയയോടൊപ്പം വന്ന ഈ പ്രയോഗം യജമാനനിൽനിന്ന് സ്നേഹവും വിശ്വസ്തതയും പിൻവലിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധത്തിന്റെ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אָנֹכִי
  choice: എന്നെയാകട്ടെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: വഴിയിൽ നയിച്ച്
  rationale: യാത്രാമധ്യേ യഹ്‌വേ നൽകിയ വ്യക്തിപരമായ മാർഗനിർദേശം സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ സഹോദരന്മാരുടെ വീട്ടിൽ
  rationale: בֵּית എന്നതിന്റെ ലക്ഷ്യസ്ഥാനാർഥവും אֲחֵי എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ അക്ഷരാർഥവും സംരക്ഷിക്കുന്നു; ഇവിടെ വിശാലമായ ബന്ധുജനസൂചനയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- issue: חֶסֶד וֶאֱמֶת എന്ന പദജോടിയുടെ ആശയം
  choice: അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും
  alternative: ദയയും സത്യവും
  rationale: ഉടമ്പടിയോടു ബന്ധപ്പെട്ടേക്കാവുന്ന വിശ്വസ്തസ്നേഹത്തിന്റെ ഭാരം സൂക്ഷിക്കുമ്പോഴും, ‘ഉടമ്പടി’ എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ അത് പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: אֲחֵי എന്ന ബന്ധുപദം
  choice: സഹോദരന്മാർ
  alternative: ബന്ധുക്കൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭത്തിലെ വിശാലമായ കുടുംബവംശസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദാസന്റെ സ്തുതിഭാവം നിലനിർത്താൻ ആദ്യവാക്യത്തിൽ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു. ‘അവിടന്ന്’ എന്ന ആദരസൂചക സർവനാമം യഹ്‌വേയെയാണ് സൂചിപ്പിക്കുന്നത്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ വെച്ചു.
