revisions:
- from: 'അവൻ പറഞ്ഞു: “എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ വാഴ്ത്തപ്പെടട്ടെ! എന്റെ യജമാനനോടുള്ള തന്റെ അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും[a] അവിടന്ന് ഉപേക്ഷിച്ചിട്ടില്ല. എന്നെയാകട്ടെ, യഹ്‌വേ വഴിയിൽ നയിച്ച് എന്റെ യജമാനന്റെ സഹോദരന്മാരുടെ[b] വീട്ടിലെത്തിച്ചിരിക്കുന്നു.”'
  to: 'അവൻ പറഞ്ഞു: “എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ വാഴ്ത്തപ്പെടട്ടെ! എന്റെ യജമാനനോടുള്ള തന്റെ അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും[a] അവിടന്ന് ഉപേക്ഷിച്ചിട്ടില്ല. എന്നെ സംബന്ധിച്ചിടത്തോളം, യഹ്‌വേ എന്നെ വഴിയിൽ നയിച്ച് എന്റെ യജമാനന്റെ സഹോദരന്മാരുടെ[b] വീട്ടിലേക്ക് കൊണ്ടുവന്നു.”'
