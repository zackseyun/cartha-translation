source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת רִבְקָ֥ה אֲחֹתָ֖/ם וְ/אֶת מֵנִקְתָּ֑/הּ וְ/אֶת עֶ֥בֶד אַבְרָהָ֖ם וְ/אֶת אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: ml
  text: 'അങ്ങനെ അവർ തങ്ങളുടെ സഹോദരിയായ റിബെക്കയെയും അവളുടെ ധാത്രിയെയും[a] അബ്രാഹാമിന്റെ ദാസനെയും അവന്റെ ആളുകളെയും യാത്രയാക്കി.


    [a] കൂടുതൽ വ്യക്തമായി, “അവളെ മുലയൂട്ടിയ ധാത്രി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമായി, “അവളെ മുലയൂട്ടിയ ധാത്രി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: യാത്രയാക്കി
  rationale: പീയേൽ രൂപം ഇവിടെ അവരെ പുറപ്പെടുവിച്ച് യാത്ര അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്രയാക്കി’ എന്നത് വെറും ‘അയച്ചു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ ഔപചാരിക യാത്രയയപ്പിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רִבְקָה
  choice: റിബെക്ക
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֲחֹתָם
  choice: തങ്ങളുടെ സഹോദരിയായ
  rationale: אָחוֹת എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘സഹോദരി’ എന്നാണ്; അടുത്ത കുടുംബസന്ദർഭവും അതിനെ പിന്തുണയ്ക്കുന്നു. ‘തങ്ങളുടെ’ എന്ന ആത്മവാചക സർവനാമം കർത്താവായ ‘അവർ’ എന്നതിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵנִקְתָּהּ
  choice: അവളുടെ ധാത്രി
  rationale: ינק-ൽ നിന്നുള്ള ഈ രൂപം കുഞ്ഞിനെ മുലയൂട്ടുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ‘ധാത്രി’ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്; കൂടുതൽ നിർദിഷ്ടമായ ‘അവളെ മുലയൂട്ടിയ ധാത്രി’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עֶבֶד אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ ദാസൻ
  rationale: എബ്രായത്തിലെ construct ബന്ധം സ്വാഭാവികമായി ഉടമസ്ഥബന്ധമായി പരിഭാഷപ്പെടുന്നു. עֶבֶד എന്നതിന് ‘അടിമ’ എന്നും അർഥമുണ്ടാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ വ്യക്തിയുടെ സേവകപദവിയാണ് മുൻനിൽക്കുന്നത്; അതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: אֲנָשָׁיו
  choice: അവന്റെ ആളുകൾ
  rationale: אֲנָשִׁים എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ആളുകൾ/പുരുഷന്മാർ’ നിലനിർത്തുന്നു. ഇവരുടെ കൃത്യമായ ചുമതല പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ദാസന്മാർ’ എന്ന് അധികമായി നിർവചിക്കുന്നില്ല; ഏകവചന സർവനാമം അബ്രാഹാമിന്റെ ദാസനിലേക്കാണ് മടങ്ങുന്നത്.
