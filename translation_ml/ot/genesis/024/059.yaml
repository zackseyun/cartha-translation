translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ וְ ഘടനയെ മലയാളത്തിലെ ‘-യെയും’ സമാന്തരപ്രയോഗത്തിലൂടെ നിലനിർത്തി; വ്യക്തമല്ലാത്ത സാമൂഹികപദവികൾ അധികമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
