source:
  edition: WLC
  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: ml
  text: ഇപ്പോൾ നിങ്ങൾ എന്റെ യജമാനനോടു ദയയും വിശ്വസ്തതയും[a] കാണിക്കാൻ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ, എന്നോടു പറയുക; അല്ലെങ്കിൽ, അതും എന്നോടു പറയുക; അങ്ങനെ ഞാൻ വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും.” ഈ എബ്രായ പദജോടി പലപ്പോഴും കൂറുള്ളതും ആശ്രയിക്കാവുന്നതുമായ ബന്ധത്തിലെ ദയയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ദാസന്റെ പ്രസംഗത്തിലെ അടിയന്തരമായ പ്രായോഗിക നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: നിങ്ങൾ ... കാണിക്കാൻ ഉദ്ദേശിക്കുന്നുവെങ്കിൽ
  rationale: ‘നിങ്ങളിൽ ചെയ്യുന്നതുണ്ടെങ്കിൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ കുടുംബത്തിന്റെ മുന്നോട്ടുള്ള ഉദ്ദേശ്യവും സന്നദ്ധതയും ചോദിക്കുന്നു; ക്രിയാവിശേഷണത്തിന്റെ ഭാവിനോക്കിയുള്ള സ്വരം ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: חֶסֶד וֶאֱמֶת
  choice: ദയയും വിശ്വസ്തതയും
  rationale: ബന്ധപരമായ കൂറ് പ്രവൃത്തിയിൽ ദയയായും ആശ്രയിക്കാവുന്ന വിശ്വസ്തതയായും പ്രകടമാകുന്നതിനെ ഈ ജോടി സൂചിപ്പിക്കുന്നു; സാങ്കേതിക ഉടമ്പടി-പദാവലി അടിച്ചേൽപ്പിക്കാതെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: אֶת אֲדֹנִי
  choice: എന്റെ യജമാനനോടു
  rationale: ഈ പ്രവൃത്തിയുടെ ലക്ഷ്യം അബ്രാഹാമാണെന്ന് മലയാളത്തിലെ സ്വാഭാവിക ദത്തിവിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: הַגִּידוּ לִי
  choice: എന്നോടു പറയുക
  rationale: നേരിട്ടുള്ള മറുപടി ആവശ്യപ്പെടുന്ന ആജ്ഞാരൂപത്തെ ലളിതവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְאִם לֹא
  choice: അല്ലെങ്കിൽ അതും
  rationale: അവർ അനുകൂലമായി പ്രവർത്തിക്കില്ലെങ്കിൽ അതും തുറന്നു പറയണമെന്ന വിരുദ്ധസാധ്യതയെ വ്യക്തമാക്കുന്നു; ‘അതും’ ആവർത്തിച്ചുള്ള മറുപടി അഭ്യർഥനയുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְאֶפְנֶה
  choice: അങ്ങനെ എനിക്ക് ... തിരിയാമല്ലോ
  rationale: കൂട്ടേറ്റീവ് രൂപത്തിലെ ഉദ്ദേശ്യവും തുടർനടപടിയുടെ ഫലബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: മറ്റൊരു പ്രവർത്തനമാർഗം സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ദിശാചിത്രം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തുന്നു.
