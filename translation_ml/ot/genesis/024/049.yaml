translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സംഭാഷണസന്ദർഭത്തിന് അനുയോജ്യവുമായ ശൈലി. ‘യജമാനൻ’ പുരാതന ഗൃഹദാസന്റെ സാഹചര്യത്തെ വ്യക്തമാക്കുന്നു. ദിശാസൂചക രൂപകം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
