translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണം. എബ്രായത്തിലെ രണ്ട് സമാന്തര സമയപ്രയോഗങ്ങൾ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളായി സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; സ്ത്രീലിംഗസൂചന മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
