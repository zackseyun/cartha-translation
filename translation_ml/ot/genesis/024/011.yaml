source:
  edition: WLC
  text: וַ/יַּבְרֵ֧ךְ הַ/גְּמַלִּ֛ים מִ/ח֥וּץ לָ/עִ֖יר אֶל בְּאֵ֣ר הַ/מָּ֑יִם לְ/עֵ֣ת עֶ֔רֶב לְ/עֵ֖ת צֵ֥את הַ/שֹּׁאֲבֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: ml
  text: അവൻ സന്ധ്യാസമയത്ത്, വെള്ളം കോരുന്ന സ്ത്രീകൾ പുറത്തിറങ്ങുന്ന നേരത്ത്, ഒട്ടകങ്ങളെ നഗരത്തിനു പുറത്തുള്ള കിണറിനരികെ മുട്ടുകുത്തിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ: ‘വെള്ളം കോരുന്ന സ്ത്രീകൾ പുറത്തിറങ്ങുന്ന സമയത്ത്.’ ‘വെള്ളം കോരുന്നവർ’ എന്ന പദം സ്ത്രീലിംഗ ബഹുവചനത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: മുട്ടുകുത്തിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒട്ടകങ്ങളെ മുട്ടുകുത്തിക്കുന്ന കാരണാർത്ഥക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മുട്ടുകുത്തിച്ചു’ സ്വാഭാവികവും ദൃശ്യവുമായ പ്രയോഗമാണ്.
- source_word: הַגְּמַלִּים
  choice: ഒട്ടകങ്ങളെ
  rationale: നിശ്ചയാർഥക ബഹുവചന നാമം; സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച യാത്രാസംഘത്തിലെ ഒട്ടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്ത്
  rationale: מִחוּץ എന്നതിന്റെ ‘പുറത്ത്’ എന്ന സ്ഥലാർത്ഥവും לָעִיר എന്നതിന്റെ ‘നഗരത്തിന്’ എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: കിണറിനരികെ
  rationale: אֶל അടിസ്ഥാനമായി കിണറിലേക്കുള്ള നീക്കം സൂചിപ്പിച്ചാലും, ഒട്ടകങ്ങളെ മുട്ടുകുത്തിച്ച ശേഷമുള്ള സ്ഥാനം മലയാളത്തിൽ ‘കിണറിനരികെ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം. ‘വെള്ളക്കിണർ’ എന്ന ആവർത്തനസ്വഭാവമുള്ള പ്രയോഗം ഒഴിവാക്കിയിരിക്കുന്നു.
- source_word: לְעֵת עֶרֶב
  choice: സന്ധ്യാസമയത്ത്
  rationale: സന്ധ്യ എന്ന സമയസൂചന വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: വെള്ളം കോരുന്ന സ്ത്രീകൾ പുറത്തിറങ്ങുന്ന നേരത്ത്
  rationale: הַשֹּׁאֲבֹת സ്ത്രീലിംഗ ബഹുവചന കൃതന്തമായതിനാൽ സ്ത്രീകളാണെന്ന വിവരം വ്യക്തമാക്കുന്നു; צֵאת എന്നത് അവർ പുറത്തിറങ്ങുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നു.
