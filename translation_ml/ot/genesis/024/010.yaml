translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായ ആഖ്യാനത്തിലെ ‘യാത്രതിരിച്ചു... എഴുന്നേറ്റ്... പോയി’ എന്ന അസാധാരണ ആവർത്തനം മിനുക്കിക്കളയാതെ നിലനിർത്തി; എന്നാൽ ആദ്യ ക്രിയ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമാക്കി.
