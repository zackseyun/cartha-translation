  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: ml
  text: അപ്പോൾ ആ ദാസൻ തന്റെ യജമാനന്റെ ഒട്ടകങ്ങളിൽനിന്ന് പത്തെണ്ണം എടുത്ത് യാത്രതിരിച്ചു. യജമാനന്റെ എല്ലാ നല്ല വസ്തുക്കളും അവന്റെ കൈവശമുണ്ടായിരുന്നു.[a] അവൻ എഴുന്നേറ്റ് അരാം-നഹരയീമിലേക്കു, നാഹോരിന്റെ നഗരത്തിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യജമാനന്റെ സകല നന്മയും അവന്റെ കൈയിൽ.” ഇത് യജമാനന്റെ സമ്പത്തിനെയോ, ദാസന്റെ ചുമതലയിലുണ്ടായിരുന്ന സമ്മാനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: ആ ദാസൻ
  rationale: ഈ ഗൃഹസന്ദർഭത്തിൽ עֶבֶד എന്നത് സ്വാഭാവികമായി ‘ദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്താം; വ്യക്തിയുടെ നിയമപരമായ അടിമസ്ഥിതി ഇവിടെ പ്രത്യേകം ഊന്നിപ്പറയുന്നില്ല.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ ഒട്ടകങ്ങളിൽനിന്ന് പത്തെണ്ണം
  rationale: מן സൂചിപ്പിക്കുന്ന കൂട്ടത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ
  choice: യാത്രതിരിച്ചു
  rationale: הלך എന്ന ക്രിയയുടെ യാത്രാസന്ദർഭം വ്യക്തമാക്കുകയും തുടർന്നുള്ള ‘എഴുന്നേറ്റ്... പോയി’ എന്ന എബ്രായ ആഖ്യാനക്രമത്തിലെ ആവർത്തനം പൂർണമായി ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: യജമാനന്റെ സകല വിലപിടിപ്പുള്ള വസ്തുക്കളും അവന്റെ കൈവശമുണ്ടായിരുന്നു
  rationale: טוּב ഇവിടെ അമൂർത്തമായ ‘നന്മ’യെക്കാൾ സമ്മാനങ്ങളായി കൊണ്ടുപോകാവുന്ന വിലപിടിപ്പുള്ള വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; בְּיָדוֹ എന്ന ‘അവന്റെ കൈയിൽ’ എന്ന പ്രയോഗത്തിന്റെ അധികാരം/കൈവശം എന്ന ഭാവം ‘കൈവശം’ എന്നു നൽകുന്നു.
- source_word: אֲרַם נַהֲרַיִם
  choice: അരാം-നഹരയീം
  rationale: പരമ്പരാഗതമായ ‘മെസൊപ്പൊത്താമ്യ’ എന്ന വ്യാഖ്യാനനാമത്തിനു പകരം എബ്രായ സ്ഥലനാമത്തിന്റെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עִיר נָחוֹר
  choice: നാഹോരിന്റെ നഗരം
  rationale: എബ്രായ construct ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; നഗരം നാഹോർ സ്ഥാപിച്ചതാണോ അദ്ദേഹവുമായി ബന്ധമുള്ളതാണോ എന്നു തീർപ്പാക്കുന്നില്ല.
