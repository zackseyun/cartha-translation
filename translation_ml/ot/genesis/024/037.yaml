translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളമാണ് ഉപയോഗിച്ചത്. ശപഥത്തിന്റെ ഗൗരവം നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എബ്രായത്തിലെ ഏകവചന സമൂഹനാമവും ഭൂമിയെ കേന്ദ്രീകരിച്ച ബന്ധവാക്യവും അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
