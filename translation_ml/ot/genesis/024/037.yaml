base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: ml
  text: 'എന്റെ യജമാനൻ എന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു പറഞ്ഞു: ‘ഞാൻ പാർക്കുന്ന ദേശത്തിലെ കനാന്യരുടെ പുത്രിമാരിൽനിന്ന്[a] എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ എടുക്കരുത്.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഞാൻ ആരുടെ ദേശത്തു പാർക്കുന്നുവോ, ആ കനാന്യന്റെ പുത്രിമാരിൽനിന്ന്.’ ‘കനാന്യൻ’ ഇവിടെ ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന സമൂഹനാമമാണ്. ഭാവാർഥമായി, ‘ഞാൻ ആരുടെ ഇടയിൽ പാർക്കുന്നുവോ’ എന്നും പറയാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: എന്നെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു
  rationale: שׁבע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറ്റൊരാളെക്കൊണ്ട് സത്യം ചെയ്യിക്കുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ഈ പ്രയോഗം ശപഥത്തിന്റെ നിർബന്ധസ്വഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ദാസൻ തന്റെ മനുഷ്യനായ അധികാരിയായ അബ്രാഹാമിനെക്കുറിച്ചാണ് പറയുന്നത്; അതിനാൽ ദൈവത്തെ സൂചിപ്പിക്കാവുന്ന ‘എന്റെ കർത്താവ്’ എന്നതിനെക്കാൾ ‘എന്റെ യജമാനൻ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ ‘പറഞ്ഞു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: לֹא תִקַּח
  choice: എടുക്കരുത്
  rationale: ശപഥത്തോടുകൂടിയ നിർദേശത്തിൽ ഈ രൂപത്തിന് നിരോധനാർഥമുണ്ട്. ‘എടുക്കരുത്’ ആ അർഥം നേരായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു ഭാര്യയെ
  rationale: വിവാഹത്തിനായി ഒരാളെ സ്വീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്ന പൊതുവായ അർഥമല്ല, ‘ഭാര്യ’ എന്നതാണ് ഉദ്ദേശ്യം.
- source_word: לִבְנִי
  choice: എന്റെ മകനുവേണ്ടി
  rationale: മൂലപാഠം മകന്റെ പേര് ചേർക്കാതെ ‘എന്റെ മകനുവേണ്ടി’ എന്നു മാത്രമാണ് പറയുന്നത്; അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: കനാന്യരുടെ പുത്രിമാരിൽനിന്ന്
  rationale: ‘കനാന്യസ്ത്രീകളിൽനിന്ന്’ എന്ന ലളിതമായ സാധ്യതയ്ക്കുപകരം, എബ്രായത്തിലെ കുടുംബ-ജനവിഭാഗ പ്രയോഗമായ ‘പുത്രിമാർ’ നിലനിർത്തുന്നു. ഏകവചന സമൂഹനാമത്തിന്റെ സവിശേഷത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: ഞാൻ പാർക്കുന്ന ദേശത്തിലെ
  rationale: ‘ഞാൻ അവന്റെ ദേശത്തു പാർക്കുന്നു’ എന്ന ഭൂമികേന്ദ്രിത ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘അവരുടെ ഇടയിൽ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: יֹשֵׁב
  choice: പാർക്കുന്ന
  rationale: വർത്തമാനത്തിൽ തുടരുന്ന താമസത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ അർഥം ‘പാർക്കുന്ന’ സ്വാഭാവികമായി നൽകുന്നു.
