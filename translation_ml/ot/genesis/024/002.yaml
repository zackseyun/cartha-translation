reference: Genesis 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: ml
  text: 'അബ്രാഹാം തന്റെ വീട്ടിലെ ഏറ്റവും മുതിർന്നവനും തനിക്കുള്ള സകലത്തിന്മേലും അധികാരമുള്ളവനുമായ തന്റെ ദാസനോടു പറഞ്ഞു: “ദയവായി നിന്റെ കൈ എന്റെ തുടയുടെ കീഴിൽ വെക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: തുടയുടെ കീഴിൽ കൈ വെക്കുന്നത് പുരാതനകാലത്ത് ശപഥം ചെയ്യുമ്പോൾ ഉപയോഗിച്ചിരുന്ന ഒരു ഗൗരവമുള്ള ചേഷ്ടയായിരുന്നു; അതിന്റെ കൃത്യമായ പ്രതീകാർഥം ഉറപ്പില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ തുടർച്ചാക്രിയ; മലയാളത്തിലെ സ്വാഭാവിക കഥനശൈലിയിൽ ലളിതമായ ഭൂതകാലം മതിയാകുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനോട്
  rationale: עבד എന്നതിന് ദാസൻ/അടിമ എന്നീ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും, ഇവിടെ വിശ്വസ്തനായ ഗൃഹകാര്യനിർവാഹകന്റെ ചുമതലയാണ് മുൻനിൽക്കുന്നത്; ‘ദാസൻ’ സന്ദർഭോചിതവും പദത്തിന്റെ സാമൂഹിക വ്യാപ്തി അനാവശ്യമായി നിർണയിക്കാത്തതുമാണ്.
- source_word: זְקַן בֵּיתוֹ
  choice: തന്റെ വീട്ടിലെ ഏറ്റവും മുതിർന്നവൻ
  rationale: זקן ഇവിടെ പ്രായത്തിലോ സേവനമൂപ്പിലോ മുതിർന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘ഏറ്റവും മുതിർന്നവൻ’ ഈ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: തനിക്കുള്ള സകലത്തിന്റെയും മേൽനോട്ടം വഹിക്കുന്നവൻ
  rationale: משל അധികാരത്തോടെ ഭരിക്കുക/കാര്യനിർവഹണം നടത്തുക എന്ന ആശയം നൽകുന്നു. ഈ ഗൃഹസന്ദർഭത്തിൽ ‘മേൽനോട്ടം വഹിക്കുക’ സ്വാഭാവികവും പദത്തിന്റെ ഭരണചുമതല വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: שִׂים נָא
  choice: ദയവായി ... വെക്കുക
  rationale: കല്പനാരൂപത്തോടുകൂടിയ נא വിനീതമായോ ഗൗരവമുള്ളതായോ അഭ്യർഥന സൂചിപ്പിക്കുന്നു; ‘ദയവായി’ ആ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: יָדְךָ
  choice: നിന്റെ കൈ
  rationale: നേരിട്ടുള്ള അർഥാനുവാദം.
- source_word: תַּחַת יְרֵכִי
  choice: എന്റെ തുടയുടെ കീഴിൽ
  rationale: സംസ്കാരവിശിഷ്ടമായ ശപഥചേഷ്ടയെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ ഹീബ്രായത്തിന്റെ ദൃശ്യഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തുടയുടെ കീഴിൽ കൈ വെക്കുക’ എന്ന ചേഷ്ടയുടെ കൃത്യമായ പ്രതീകാർഥം
  choice: പ്രധാനപാഠത്തിൽ ശാരീരിക ചേഷ്ട അക്ഷരാർഥത്തിൽ നിലനിർത്തി; അടിക്കുറിപ്പിൽ ഇത് പുരാതന ശപഥചേഷ്ടയാണെന്ന് മാത്രം വിശദീകരിച്ചു.
  alternative: സന്തതി, ജനനേന്ദ്രിയം, പരിച്ഛേദന, അല്ലെങ്കിൽ ഉടമ്പടി എന്നിവയിലൊന്നുമായി നിർണായകമായി ബന്ധപ്പെടുത്തി വിശദീകരിക്കുക.
  rationale: ചേഷ്ടയുടെ കൃത്യമായ പ്രതീകാർഥത്തെക്കുറിച്ച് ഉറപ്പില്ല. അതിനാൽ ഉറവിടത്തിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. നീണ്ട ഹീബ്രായ അനുബന്ധവാക്യം ആശയബന്ധം നഷ്ടപ്പെടാതെ ഡാഷുകൾ ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി. ‘മേൽനോട്ടം വഹിക്കുന്നവൻ’ എന്ന പ്രയോഗം അക്ഷരാർഥമായ ‘ഭരിക്കുന്നവൻ’ എന്നതിനെക്കാൾ ഗൃഹകാര്യനിർവാഹകസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
