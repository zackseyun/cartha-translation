reference: Genesis 24:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവമായ യഹ്‌വേ, ഇന്ന് എനിക്കു മുന്നിൽ അതു സംഭവിക്കുമാറാക്കണമേ[a]; എന്റെ യജമാനനായ അബ്രാഹാമിനോടു വിശ്വസ്തമായ സ്നേഹം കാണിക്കണമേ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “ഇന്ന് അത് എന്റെ മുമ്പിൽ സംഭവിപ്പിക്കണമേ” അല്ലെങ്കിൽ “ഇന്ന് എനിക്ക് അഭിമുഖമാക്കണമേ.” ആഗ്രഹിച്ച കൂടിക്കാഴ്ച ദൈവം നടത്തിക്കൊടുക്കണമെന്ന അപേക്ഷയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസ്തമായ സ്നേഹം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദം ദയ, വിശ്വസ്തമായ കരുണ, ഉടമ്പടിയോടുള്ള വിശ്വസ്തത എന്നീ അർഥഭാവങ്ങളും വഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: എന്റെ യജമാനനായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: സംസാരിക്കുന്നത് അബ്രാഹാമിന്റെ ദാസനായതിനാൽ אֲדֹנִי എന്നത് ഇവിടെ സ്വാഭാവികമായി ‘എന്റെ യജമാനൻ’ എന്നാണ്.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: ഇന്ന് എന്റെ മുമ്പിൽ കാര്യം അനുകൂലമായി നടത്തിത്തരണമേ
  rationale: קרה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ദൈവം ആഗ്രഹിച്ച സംഗതി സംഭവിക്കുകയോ അഭിമുഖീകരിക്കാൻ ഇടയാക്കുകയോ ചെയ്യണമെന്ന അപേക്ഷയാണ്. ‘വിജയം തരണമേ’ എന്ന സന്ദർഭാർഥം മാത്രം ഉറപ്പിക്കാതെ ദൈവിക നടത്തിപ്പും ഹീബ്രുവിലെ ‘എന്റെ മുമ്പിൽ’ എന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: נָא
  choice: -ണമേ
  rationale: അപേക്ഷയുടെ വിനയഭാവം മലയാളത്തിലെ പ്രാർഥനാസ്വഭാവമുള്ള വിനയപ്രത്യയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: വിശ്വസ്തസ്നേഹം കാണിക്കണമേ
  rationale: חֶסֶד എന്നത് സാധാരണ ദയയെക്കാൾ വിശ്വസ്തവും ഉറച്ചതുമായ സ്നേഹദയയെ സൂചിപ്പിക്കുന്നു; ‘കാണിക്കുക’ എന്നത് עשה חֶסֶד എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് വരുന്നതിനാൽ അത് മറയ്ക്കാതെ ലിപ്യന്തരിച്ചു.
- issue: חֶסֶד എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വസ്തസ്നേഹം
  alternative: ദയ; വിശ്വസ്തമായ കരുണ; ഉടമ്പടി വിശ്വസ്തത
  rationale: പദത്തിലെ വിശ്വസ്തതയുടെയും സ്നേഹദയയുടെയും മാനങ്ങൾ നിലനിർത്തുന്നു; എന്നാൽ ‘ഉടമ്പടി വിശ്വസ്തത’ എന്നു വിവർത്തനം ചെയ്ത് സന്ദർഭത്തിൽ വ്യക്തമല്ലാത്ത സാങ്കേതിക അർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: הַקְרֵה എന്ന അപേക്ഷയുടെ ലക്ഷ്യം
  choice: കാര്യം അനുകൂലമായി നടത്തിത്തരണമേ
  alternative: വിജയം തരണമേ; അത് സംഭവിപ്പിക്കണമേ; എനിക്ക് അഭിമുഖമാക്കണമേ
  rationale: ദാസൻ ആഗ്രഹിക്കുന്ന കൂടിക്കാഴ്ച ദൈവം ക്രമീകരിക്കണമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോഴും, ക്രിയയെ വെറും പൊതുവായ ‘വിജയം’ എന്ന ആശയത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാസ്വഭാവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘യജമാനൻ’ ദാസൻ–അബ്രാഹാം ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘നടത്തിത്തരണമേ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാകുകയും ദൈവിക ഇടപെടലിന്റെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
