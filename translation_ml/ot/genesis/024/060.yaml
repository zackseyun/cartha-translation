source:
  edition: WLC
  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: ml
  text: 'അവർ റിബെക്കയെ അനുഗ്രഹിച്ച് അവളോടു പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരീ, നീ പതിനായിരങ്ങളുടെ ആയിരങ്ങളായിത്തീരട്ടെ[a]; നിന്റെ സന്തതി നിന്റെ സന്തതിയെ വെറുക്കുന്നവരുടെ കവാടം കൈവശമാക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എണ്ണമറ്റ ജനസമൂഹമായിത്തീരട്ടെ”; അക്ഷരാർഥത്തിൽ “പതിനായിരങ്ങളുടെ ആയിരങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്റെ സന്തതിയുടെ ശത്രുക്കളുടെ കവാടം അവകാശമാക്കട്ടെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “നിന്റെ സന്തതിയെ വെറുക്കുന്നവരുടെ കവാടം കൈവശമാക്കട്ടെ” എന്നാണ്. ‘കവാടം’ ഒരു നഗരത്തിന്റെ ശക്തിയെയും അതിന്മേലുള്ള നിയന്ത്രണത്തെയും ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: അനുഗ്രഹിച്ചു
  rationale: പീയേൽ രൂപം റിബെക്കയുടെമേൽ അനുഗ്രഹവാക്ക് ഉച്ചരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അനുഗ്രഹിച്ചു’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: רִבְקָה
  choice: റിബെക്ക
  rationale: എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: אֲחֹתֵנוּ
  choice: ഞങ്ങളുടെ സഹോദരീ
  rationale: വിളിസംബോധന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘സഹോദരീ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: הֲיִי
  choice: ആയിത്തീരട്ടെ
  rationale: ഇത് ഒരു കല്പനയെന്നതിലുപരി അനുഗ്രഹാശംസയാണ്; ‘-ട്ടെ’ രൂപം ആ ആശംസാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְאַלְפֵי רְבָבָה
  choice: പതിനായിരങ്ങളുടെ ആയിരങ്ങൾ
  rationale: ‘ആയിരങ്ങൾ’ എന്നും ‘പതിനായിരം’ എന്നും വരുന്ന എബ്രായ സംഖ്യാചിത്രം നിലനിർത്തുന്നു; അതിന്റെ അതിശയോക്തിപരമായ സമൃദ്ധിസൂചന ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וְיִירַשׁ
  choice: കൈവശമാക്കട്ടെ
  rationale: ירש ഇവിടെ വിജയകരമായി സ്വന്തമാക്കുകയോ നിയന്ത്രണത്തിലാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൈവശമാക്കുക’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: זַרְעֵךְ
  choice: നിന്റെ സന്തതി
  rationale: ‘സന്തതി’ ഏകവചനരൂപത്തിലുള്ള സമൂഹനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ എബ്രായത്തിലെ collective singular സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: שַׁעַר
  choice: കവാടം
  rationale: കോട്ടകെട്ടിയ നഗരത്തിന്റെ പ്രവേശനവും അതുവഴി അധികാരവും നിയന്ത്രണവും സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: שֹׂנְאָיו
  choice: അതിനെ വെറുക്കുന്നവർ
  rationale: എബ്രായത്തിൽ ‘സന്തതി’യെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയമുണ്ട്. മലയാളത്തിൽ അനാവശ്യമായി പുരുഷലിംഗം ആരോപിക്കാതെ ആ ഏകവചനബന്ധം ‘അതിനെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സന്തതി’ എന്ന സമൂഹ ഏകവചനവും അതിലേക്കുള്ള ഏകവചന സൂചനയും
  choice: നിന്റെ സന്തതി ... അതിനെ വെറുക്കുന്നവർ
  alternative: നിന്റെ സന്തതികൾ ... അവരെ വെറുക്കുന്നവർ
  rationale: זֶרַע സമൂഹ ഏകവചനമാണ്; שֹׂנְאָיו എന്ന പദത്തിലെ പ്രത്യയവും വ്യാകരണപരമായി ഏകവചനമാണ്. അതിനാൽ പിതൃവാഗ്ദാനങ്ങളിലെ സാഹിത്യപ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട്, അതിനെ നിർബന്ധമായി ഒരു വ്യക്തിയെന്നോ അനേകരെന്നോ വ്യാഖ്യാനിക്കാതെ പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അനുഗ്രഹവാക്യശൈലി സ്വീകരിച്ചു. ‘പതിനായിരങ്ങളുടെ ആയിരങ്ങൾ’ എന്ന അല്പം കാവ്യാത്മകമായ പ്രയോഗം മൂലത്തിലെ സംഖ്യാചിത്രം സംരക്ഷിക്കാനാണ്; അതിന്റെ സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാചകഭാഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
