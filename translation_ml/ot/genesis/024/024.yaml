translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വംശബന്ധങ്ങൾ വ്യക്തമായി വായിക്കാനായി മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചെങ്കിലും എബ്രായത്തിലെ മാതൃകർത്താവും പിതാവിനെ സൂചിപ്പിക്കുന്ന ജനനസൂത്രവും സംരക്ഷിച്ചു.
