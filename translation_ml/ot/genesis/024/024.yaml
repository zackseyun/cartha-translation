lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: അവൾ അവനോടു പറഞ്ഞു
  rationale: തുടർന്നുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന wayyiqtol രൂപവും സംസാരത്തിന്റെ ദിശ വ്യക്തമാക്കുന്ന אֵלָיו എന്ന പദവും സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: ബെഥൂവേലിന്റെ മകളാണ് ഞാൻ
  rationale: ക്രിയയില്ലാത്ത എബ്രായ തിരിച്ചറിയൽവാക്യത്തെയും ഊന്നലുള്ള സ്വതന്ത്ര സർവനാമമായ אָנֹכִי-യെയും സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֶּן מִלְכָּה
  choice: മിൽക്കയുടെ മകനായ
  rationale: Construct ബന്ധം ബെഥൂവേലിനെ മിൽക്കയുടെ മകനായി തിരിച്ചറിയുന്നു; മലയാളത്തിൽ ബന്ധം അവ്യക്തമാകാതിരിക്കാൻ ‘മകനായ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: മിൽക്ക നാഹോരിനു പ്രസവിച്ച
  rationale: യָלְדָה എന്നതിന്റെ സ്ത്രീലിംഗ കർത്താവ് മിൽക്കയാണ്; לְנָחוֹר എന്ന ജനനസൂത്രത്തിലെ ലാമെദ് പിതാവായി നാഹോരിനെ തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ ‘നാഹോരിനു പ്രസവിച്ച’ എന്ന രൂപം ഈ ഘടന അടുത്തായി സൂക്ഷിക്കുന്നു.
- source_word: בְּתוּאֵל / מִלְכָּה / נָחוֹר
  choice: ബെഥൂവേൽ / മിൽക്ക / നാഹോർ
  rationale: വ്യക്തിനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
