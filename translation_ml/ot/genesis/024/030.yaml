source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: ml
  text: അവൻ തന്റെ സഹോദരിയുടെ കൈകളിലെ മൂക്കുത്തിയും വളകളും കണ്ടതും, “ആ മനുഷ്യൻ എന്നോട് ഇങ്ങനെയാണ് പറഞ്ഞത്” എന്നു തന്റെ സഹോദരി റിബെക്ക പറഞ്ഞതു കേട്ടതും, അവൻ ആ മനുഷ്യന്റെ അടുക്കൽ ചെന്നു. അതാ, അയാൾ ഒട്ടകങ്ങളുടെ അരികിൽ[a], നീരുറവയുടെ സമീപം[b] നിൽക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒട്ടകങ്ങളുടെ അടുത്ത്” എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു സ്ഥാനസൂചകം ഇവിടെ ഒട്ടകങ്ങൾക്കു സമീപമുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കിണറ്റിനരികിൽ” എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രു പദം കൂടുതൽ കൃത്യമായി “നീരുറവ്” അഥവാ “ജലസ്രോതസ്സ്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ וַיְהִי ആഖ്യാനത്തിലെ അടുത്ത സംഭവം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ദീർഘമായ കാലവാക്യത്തെ കൃത്രിമമാക്കുന്നതിനാൽ അതിന്റെ ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായ ക്രമവാക്യത്തിലൂടെ പ്രകടിപ്പിച്ചു.
- source_word: הַנֶּזֶם
  choice: മൂക്കുത്തി
  rationale: נֶזֶם പൊതുവിൽ ഒരു ആഭരണമോ വളയമോ സൂചിപ്പിക്കാമെങ്കിലും ഉല്പത്തി 24:47-ൽ അത് റിബെക്കയുടെ മൂക്കിൽ അണിയിച്ചതായി വ്യക്തമാകുന്നു; അതിനാൽ സന്ദർഭോചിതമായി ‘മൂക്കുത്തി’ തെരഞ്ഞെടുത്തു.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: തന്റെ സഹോദരിയുടെ കൈകളിലെ ... വളകൾ
  rationale: יָד എന്നതിന്റെ ‘കൈ’ എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട്, צְמִדִים എന്ന ജോഡിയായ കൈയാഭരണത്തെ സാധാരണ മലയാളത്തിൽ ‘വളകൾ’ എന്നു നൽകി.
- source_word: וּכְשָׁמְעוֹ אֶת דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: ‘...’ എന്നു തന്റെ സഹോദരി റിബെക്ക പറഞ്ഞതു കേട്ടപ്പോഴും
  rationale: לֵאמֹר നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു. ‘വാക്കുകൾ ... പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി ഹീബ്രു ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: ആ മനുഷ്യൻ എന്നോട് ഇങ്ങനെയാണ് പറഞ്ഞത്
  rationale: כֹּה എന്നതിന്റെ ‘ഇങ്ങനെ/ഇപ്രകാരം’ എന്ന സൂചനാശക്തി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: അവൻ ആ മനുഷ്യന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא אֶל ഇവിടെ ഒരാളുടെ അടുക്കലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; ‘അടുക്കൽ ചെന്നു’ മലയാള ആഖ്യാനത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ദൃശ്യാവതരണവും ആഖ്യാനസജീവതയും ആധുനിക മലയാളത്തിലെ ‘അതാ’ സംരക്ഷിക്കുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുകയായിരുന്നു
  rationale: പങ്കുപദം ലാബാൻ എത്തിയപ്പോൾ തുടരുകയായിരുന്ന നിലയെ സൂചിപ്പിക്കുന്നു; അപൂർണഭൂതകാലരൂപം ആ ദൈർഘ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל הַגְּמַלִּים
  choice: ഒട്ടകങ്ങളുടെ അരികിൽ
  rationale: עַל ഇവിടെ ഒട്ടകങ്ങളുടെ മുകളിൽ എന്നല്ല, അവയ്ക്കരികിലുള്ള സ്ഥാനം എന്ന അർത്ഥത്തിലാണ്.
- source_word: עַל הָעָיִן
  choice: നീരുറവയ്ക്കൽ
  rationale: עַיִן ഇവിടെ സ്വാഭാവിക ജലസ്രോതസ്സായ ഉറവയെ സൂചിപ്പിക്കുന്നു; ‘നീരുറവ’ അർത്ഥം കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ദീർഘകാലഘടന മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാക്കി; എന്നാൽ കണ്ടതും കേട്ടതും ലാബാൻ മനുഷ്യന്റെ അടുക്കൽ പോകാനുള്ള പശ്ചാത്തലമായിരുന്നുവെന്ന ബന്ധം നിലനിർത്തി. റിബെക്ക എന്ന പേരുരൂപവും ‘അതാ’ എന്ന ദൃശ്യാവതരണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ രീതിയിൽ ഉപയോഗിച്ചു.
