  to: അവൻ തന്റെ സഹോദരിയുടെ കൈകളിലെ മൂക്കുത്തിയും വളകളും കണ്ടതും, “ആ മനുഷ്യൻ എന്നോട് ഇങ്ങനെയാണ് പറഞ്ഞത്” എന്നു തന്റെ സഹോദരി റിബെക്ക പറഞ്ഞതു കേട്ടതും, അവൻ ആ മനുഷ്യന്റെ അടുക്കൽ ചെന്നു. അതാ, അയാൾ ഒട്ടകങ്ങളുടെ അരികിൽ[a], നീരുറവയുടെ സമീപം[b] നിൽക്കുകയായിരുന്നു.
