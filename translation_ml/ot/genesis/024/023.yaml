id: GEN.24.23
reference: Genesis 24:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നീ ആരുടെ മകളാണ്? ദയവായി എന്നോടു പറയൂ. ഞങ്ങൾക്കു രാത്രി തങ്ങാൻ നിന്റെ പിതാവിന്റെ വീട്ടിൽ ഇടമുണ്ടോ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങൾക്കു നിന്റെ പിതാവിന്റെ വീട്ടിൽ താമസിക്കാൻ സ്ഥലമുണ്ടോ?”
    reason: מָקוֹם (‘ഇടം/സ്ഥലം’) എന്നും לָלִין (‘രാത്രി തങ്ങുക/താമസിക്കുക’) എന്നും ഉള്ള പദങ്ങളുടെ സന്ദർഭോചിതമായ മറ്റൊരു അവതരണം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ ചോദിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അവൻ പറഞ്ഞു’ എന്നാണെങ്കിലും, തുടർന്നുവരുന്ന വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യങ്ങളായതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അവൻ ചോദിച്ചു’ എന്നു നൽകി; ഇത് സംഭാഷണപ്രവർത്തിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בַּת מִי אַתְּ
  choice: നീ ആരുടെ മകളാണ്?
  rationale: കുടുംബപരമായ തിരിച്ചറിയൽ അന്വേഷിക്കുന്ന ഹീബ്രു ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: הַגִּידִי נָא לִי
  choice: ദയവായി എന്നോടു പറയൂ
  rationale: נָא കല്പനയുടെ കാഠിന്യം കുറച്ച് വിനീതമായ അഭ്യർഥനയാക്കുന്നു; ‘ദയവായി’ ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: בֵּית אָבִיךְ
  choice: നിന്റെ പിതാവിന്റെ വീട്ടിൽ
  rationale: ‘പിതാവിന്റെ വീട്’ എന്ന കുടുംബ-ഗൃഹ പശ്ചാത്തലം നിലനിർത്തുന്നു; സന്ദർഭത്തിനനുസരിച്ച് സ്ഥലം സൂചിപ്പിക്കാൻ ‘വീട്ടിൽ’ എന്നു വിഭക്തി ചേർത്തു.
- source_word: מָקוֹם
  choice: സ്ഥലം
  rationale: താമസത്തിനുള്ള ഇടം അഥവാ സൗകര്യം എന്ന അർഥം നൽകുന്ന വിശാലവും നേരിട്ടുള്ളതുമായ പദം; പ്രത്യേക മുറിയുണ്ടെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: לָנוּ
  choice: ഞങ്ങൾക്കു
  rationale: ഒന്നാംപുരുഷ ബഹുവചനം അതേപടി നിലനിർത്തി; സംസാരിക്കുന്നവനെയും കൂടെയുള്ളവരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: לָלִין
  choice: രാത്രി താമസിക്കാൻ
  rationale: ലഭ്യമായ പാഠരൂപം ഇവിടെ രാത്രി തങ്ങുക എന്ന അർഥത്തിലാണ്; ആ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, മാന്യമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമാക്കുമ്പോഴും കുടുംബ-ഗൃഹ പശ്ചാത്തലവും ബഹുവചനവും സംരക്ഷിച്ചിരിക്കുന്നു.
