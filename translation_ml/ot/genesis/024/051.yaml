id: GEN.24.51
reference: Genesis 24:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: ml
  text: “ഇതാ, റിബെക്ക നിന്റെ മുമ്പിലുണ്ട്. അവളെ കൂട്ടിക്കൊണ്ടു പോകുക. യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ അവൾ നിന്റെ യജമാനന്റെ മകനു ഭാര്യയായിരിക്കട്ടെ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ യജമാനന്റെ മകനു ഭാര്യയാകട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ജസ്സീവ് ക്രിയാരൂപം ‘ആയിരിക്കട്ടെ’ എന്നും ‘ആകട്ടെ’ എന്നും അർത്ഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഉടൻ മുന്നിലുള്ള വ്യക്തിയിലേക്കും സാഹചര്യത്തിലേക്കും ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിർദ്ദേശകപദത്തിന്റെ സ്വാഭാവികവും പ്രൗഢവുമായ മലയാളരൂപം.
- source_word: רִבְקָה
  choice: റിബെക്ക
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിലുണ്ട്
  rationale: ‘നിന്റെ മുമ്പിൽ’ എന്ന മൂലാർത്ഥവും അവൾ അവിടെ സന്നിഹിതയും യാത്രയ്ക്കു സന്നദ്ധയുമാണെന്ന സന്ദർഭസൂചനയും നിലനിർത്തുന്നു.
- source_word: קַח וָלֵךְ
  choice: അവളെ കൂട്ടിക്കൊണ്ടു പോകുക
  rationale: തുടർച്ചയായ രണ്ട് കല്പനകളുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ കർമമായ റിബെക്കയെ ‘അവളെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וּתְהִי אִשָּׁה
  choice: ഭാര്യയായിരിക്കട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപത്തിലുള്ള അനുമതി/ആഗ്രഹഭാവം ‘ആയിരിക്കട്ടെ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ‘ഭാര്യയാകട്ടെ’ എന്ന സംഭവപ്രധാന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: നിന്റെ യജമാനന്റെ മകനു
  rationale: വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന לְ എന്ന ബന്ധവിഭക്തി മലയാളത്തിലെ ‘മകനു ഭാര്യ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രതിഫലിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: ദൈവത്തിന്റെ വാക്കിനോടുള്ള അനുരൂപത വ്യക്തമാക്കുകയും മലയാള ബൈബിൾ ഗദ്യത്തിന് യോജിച്ച ആദരസൂചക ക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ അതിനെ ലിപ്യന്തരം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം Yahweh എന്ന ഉച്ചാരണത്തെ സമീപിക്കുന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: וּתְהִי എന്ന ജസ്സീവ് രൂപത്തിന്റെ ഭാവം
  choice: ആയിരിക്കട്ടെ
  alternative: ആകട്ടെ
  rationale: വിവാഹബന്ധത്തിൽ അവൾ ‘ആയിരിക്കുക’ എന്ന നിലയും അതിലേക്കു ‘ആകുക’ എന്ന പ്രവേശനവും ഹീബ്രു രൂപത്തിൽ സാധ്യതകളാണ്; മുഖ്യപാഠത്തിൽ നിലപ്രധാന രൂപം സ്വീകരിച്ച് മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി. ‘അവളെ കൂട്ടിക്കൊണ്ടു പോകുക’ എന്നത് പദാനുപദമായ ‘എടുക്കുക, പോകുക’ എന്നതിനേക്കാൾ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
