  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: ml
  text: 'പിന്നെ അവനും അവനോടൊപ്പമുണ്ടായിരുന്ന ആളുകളും ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു; അവർ അവിടെ രാത്രി താമസിച്ചു. രാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ അവൻ പറഞ്ഞു: “എന്നെ എന്റെ യജമാനന്റെ അടുക്കലേക്ക് അയയ്ക്കുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ നാഥന്റെ അടുക്കലേക്ക് എന്നെ അയയ്ക്കുക.” എബ്രായയിലെ אֲדֹנִי എന്നതിന് “എന്റെ നാഥൻ” എന്നും “എന്റെ യജമാനൻ” എന്നും അർത്ഥമാകാം; ഇവിടെ അത് ദാസന്റെ മനുഷ്യനായ മേലധികാരി എബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: ഭക്ഷിക്കുക, കുടിക്കുക എന്നീ രണ്ടു ലളിതമായ ആഖ്യാനക്രിയകളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: അവനും കൂടെയുണ്ടായിരുന്ന ആളുകളും
  rationale: എബ്രാഹാമിന്റെ ദാസനെയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പുരുഷന്മാരെയും വ്യക്തമായി സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: וַיָּלִינוּ
  choice: അവർ അവിടെ രാത്രി കഴിച്ചു
  rationale: לון/לין എന്ന ക്രിയയുടെ ‘രാത്രി താമസിക്കുക’ എന്ന അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭസ്ഥലത്തെ ‘അവിടെ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּק֣וּמוּ בַבֹּקֶר
  choice: രാവിലെ അവർ എഴുന്നേറ്റപ്പോൾ
  rationale: രാത്രി കഴിച്ചതിനു പിന്നാലെയുള്ള ആഖ്യാനക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: שַׁלְּחֻנִי
  choice: എന്നെ യാത്രയാക്കുക
  rationale: പുറപ്പെടാൻ അനുമതി നൽകി അയയ്ക്കുക എന്ന സന്ദർഭാർഥം ‘യാത്രയാക്കുക’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്റെ അടുക്കലേക്ക്
  rationale: ഇവിടെ אָדוֹן ദാസന്റെ മനുഷ്യനായ മേലധികാരി എബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു; ‘യജമാനൻ’ ആ സാമൂഹികബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: എബ്രാഹാമിനെ സൂചിപ്പിക്കുന്ന אָדוֹן എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: എന്റെ യജമാനൻ
  alternative: എന്റെ നാഥൻ
  rationale: ദൈവിക അഭിസംബോധനയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, ദാസനും എബ്രാഹാമും തമ്മിലുള്ള സാമൂഹികബന്ധം ‘യജമാനൻ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; പദത്തിന്റെ മറ്റൊരു സാധുവായ അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘രാത്രി കഴിച്ചു,’ ‘യാത്രയാക്കുക,’ ‘യജമാനൻ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയുടെ സംക്ഷിപ്തതയും ബന്ധസൂചനകളും നിലനിർത്തുന്നു.
