id: GEN.24.36
reference: Genesis 24:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: ml
  text: എന്റെ യജമാനന്റെ ഭാര്യയായ സാറാ വാർധക്യത്തിലെത്തിയശേഷം[a] എന്റെ യജമാനന് ഒരു മകനെ പ്രസവിച്ചു; അദ്ദേഹം തനിക്കുള്ളതെല്ലാം അവനു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവളുടെ വാർധക്യത്തിനുശേഷം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ ഖാൽ വിവരണരൂപം; ഒരു സ്ത്രീ കുഞ്ഞിനു ജന്മം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ ഭാര്യയായ
  rationale: സംസാരിക്കുന്ന ദാസന്റെ ആദരപൂർവമായ ‘എന്റെ യജമാനൻ’ എന്ന പ്രയോഗവും സാറായുമായുള്ള ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵן
  choice: ഒരു മകനെ
  rationale: എബ്രായപദത്തിന് ഇവിടെ നിർദിഷ്ടത സൂചിപ്പിക്കുന്ന ഉപപദമില്ല; ജനനവിവരണത്തിന് യോജിച്ച അനിർദിഷ്ടരൂപം.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്
  rationale: ל എന്ന ഉപസർഗം ഇവിടെ ബന്ധം/പ്രയോജനം സൂചിപ്പിക്കുന്നു; ‘യജമാനന് ഒരു മകനെ പ്രസവിച്ചു’ എന്നത് ഉറവിടഘടനയെ അടുത്തായി പിന്തുടരുന്നു.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: വാർധക്യത്തിലെത്തിയശേഷം
  rationale: അക്ഷരാർഥം ‘അവളുടെ വാർധക്യത്തിനുശേഷം’ എന്നാണെങ്കിലും, സാറാ പ്രായാധിക്യത്തിലെത്തിയതിനുശേഷം എന്ന കാലസൂചന ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֶּן לוֹ
  choice: അദ്ദേഹം … അവനു കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ തുടർവിവരണ ഭൂതകാലം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘അദ്ദേഹം’ അബ്രാഹാമിനെയും ‘അവൻ’ പുത്രനെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: തനിക്കുള്ളതെല്ലാം
  rationale: അബ്രാഹാമിന്റെ സമസ്ത ഉടമസ്ഥതയും ഉൾക്കൊള്ളുന്ന എബ്രായപ്രയോഗത്തിന്റെ സമഗ്രത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
