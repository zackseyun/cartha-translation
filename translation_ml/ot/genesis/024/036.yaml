translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ദാസന്റെ ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ എന്ന ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്; ഉറവിടത്തിലെ ബന്ധങ്ങളും സർവനാമസൂചനകളും അനാവശ്യമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
