  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണം സ്വാഭാവികമാക്കിയെങ്കിലും ഹീബ്രുവിലെ വംശാവലിവിവരവും ആഭരണങ്ങളുടെ സ്ഥാനവും സംരക്ഷിച്ചു.
