  text: וָ/אֶשְׁאַ֣ל אֹתָ֗/הּ וָ/אֹמַר֮ בַּת מִ֣י אַתְּ֒ וַ/תֹּ֗אמֶר בַּת בְּתוּאֵל֙ בֶּן נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה לּ֖/וֹ מִלְכָּ֑ה וָ/אָשִׂ֤ם הַ/נֶּ֨זֶם֙ עַל אַפָּ֔/הּ וְ/הַ/צְּמִידִ֖ים עַל יָדֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: ml
  text: 'പിന്നെ ഞാൻ അവളോട് ചോദിച്ചു: “നീ ആരുടെ മകളാണ്?” അവൾ പറഞ്ഞു: “ഞാൻ നാഹോരിന്റെ മകനായ, മിൽക്ക നാഹോരിന് പ്രസവിച്ച ബെഥൂവേലിന്റെ മകളാണ്.” അപ്പോൾ ഞാൻ അവളുടെ മൂക്കിൽ മൂക്കുത്തിയും അവളുടെ കൈകളിൽ വളകളും അണിയിച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മൂക്കുത്തി അവളുടെ മൂക്കിന്മേലും വളകൾ അവളുടെ കൈകളിന്മേലും വെച്ചു.” ഇവിടെ “കൈകൾ” എന്നത് സന്ദർഭത്തിൽ കൂടുതൽ പ്രത്യേകമായി കൈമുട്ടുകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: പിന്നെ ഞാൻ അവളോട് ചോദിച്ചു
  rationale: തുടർച്ചയായ രണ്ട് ഹീബ്രു ക്രിയകൾ ചോദ്യം വാക്കുകളിലൂടെ ഉന്നയിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: בַּת מִי אַתְּ
  choice: നീ ആരുടെ മകളാണ്?
  rationale: ബന്ധുത്വത്തെക്കുറിച്ചുള്ള ഹീബ്രു ചോദ്യം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: ഞാൻ നാഹോരിന്റെ മകനായ ബെഥൂവേലിന്റെ മകളാണ്
  rationale: ഹീബ്രുവിലെ വംശാവലിബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാള സംഭാഷണത്തിൽ ആവശ്യമായ ഒന്നാംപുരുഷരൂപം ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: മിൽക്ക അവനെ നാഹോരിനു പ്രസവിച്ചു
  rationale: לוֹ എന്നത് നാഹോരിനെ സൂചിപ്പിക്കുന്നുവെന്ന ബന്ധം മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ പേര് ആവർത്തിച്ചു; മാതൃപരിചയവും സംരക്ഷിച്ചു.
- source_word: וָאָשִׂם
  choice: അപ്പോൾ ഞാൻ ... അണിയിച്ചു
  rationale: ആഭരണങ്ങളുടെ സാഹചര്യത്തിൽ 'വെച്ചു' എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളപ്രയോഗം; ആഖ്യാനത്തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: മൂക്കുത്തി അവളുടെ മൂക്കിൽ
  rationale: נֶזֶם പൊതുവെ ഒരു വളയാഭരണത്തെ സൂചിപ്പിക്കാമെങ്കിലും עַל אַפָּהּ അതിന്റെ സ്ഥാനം ഇവിടെ വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ 'മൂക്കുത്തി' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: വളകൾ അവളുടെ കൈകളിൽ
  rationale: צְמִידִים എന്നത് കൈയിൽ ധരിക്കുന്ന വളകളാണ്; יָדֶיהָ എന്ന ഹീബ്രു പദത്തിന്റെ വിശാല അർഥപരിധി കണക്കിലെടുത്ത് 'കൈകളിൽ' നിലനിർത്തി.
