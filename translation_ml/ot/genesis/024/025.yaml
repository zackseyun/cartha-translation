id: GEN.24.25
reference: Genesis 24:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו גַּם תֶּ֥בֶן גַּם מִסְפּ֖וֹא רַ֣ב עִמָּ֑/נוּ גַּם מָק֖וֹם לָ/לֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: ml
  text: 'പിന്നെ അവൾ അവനോടു പറഞ്ഞു: “ഞങ്ങളുടെ പക്കൽ വൈക്കോലും കാലിത്തീറ്റയും ധാരാളമുണ്ട്; രാത്രി താമസിക്കാൻ സ്ഥലവുമുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: പിന്നെ അവൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: പുരുഷ ഏകവചന സർവനാമപ്രത്യയത്തോടുകൂടിയ പൂർവപ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: גַּם ... גַּם ... גַּם
  choice: '...ഉം ...ഉം; ...വുമുണ്ട്'
  rationale: ആവർത്തിച്ചുള്ള גַּם നൽകുന്ന കൂട്ടിച്ചേർക്കലും ക്രമാനുഗത ഊന്നലും സ്വാഭാവിക മലയാള സമുച്ചയപ്രത്യയങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: תֶּבֶן
  choice: വൈക്കോൽ
  rationale: കന്നുകാലികളുടെ പരിപാലനസന്ദർഭത്തിൽ ‘straw’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מִסְפּוֹא
  choice: കാലിത്തീറ്റ
  rationale: മൃഗങ്ങൾക്കുള്ള തീറ്റയെ കൃത്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: רַב
  choice: ധാരാളം
  rationale: ലഭ്യമായ സാധനങ്ങളുടെ സമൃദ്ധി ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עִמָּנוּ
  choice: ഞങ്ങളുടെ പക്കൽ ... ഉണ്ട്
  rationale: അക്ഷരാർഥമായ ‘ഞങ്ങളോടുകൂടെ’ എന്ന ഉടമസ്ഥതാസൂചനയെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഞങ്ങളുടെ പക്കൽ ഉണ്ട്’ എന്ന പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: מָקוֹם
  choice: സ്ഥലം
  rationale: ‘മുറി’ എന്നു പരിമിതപ്പെടുത്താതെ മൂലപദത്തിന്റെ പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: לָלוּן
  choice: രാത്രി താമസിക്കാൻ
  rationale: രാത്രി കഴിക്കുകയോ തങ്ങുകയോ ചെയ്യുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
