translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ മലയാളത്തിലെ ‘-ഉം/-വും’ രൂപങ്ങളാൽ സൂക്ഷിച്ചിരിക്കുന്നു; ‘സ്ഥലം’ എന്ന പൊതുപദം ഉപയോഗിച്ച് അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കി.
