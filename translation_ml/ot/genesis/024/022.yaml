translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പുരാതന അളവുകളായ ‘ബേക്കാ’, ‘ശേക്കെൽ’ എന്നിവ നിലനിർത്തി. അടിക്കുറിപ്പ് [a] അതുമായി ബന്ധപ്പെട്ട ‘സ്വർണവളയം’ എന്ന പദത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്; [b] വാക്യത്തിലെ പുരാതന തൂക്കയൂണിറ്റുകളുടെ വിശദീകരണമായി അവസാനം നൽകിയിരിക്കുന്നു.
