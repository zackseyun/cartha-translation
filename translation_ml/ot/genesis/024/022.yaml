  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלּ֤וּ הַ/גְּמַלִּים֙ לִ/שְׁתּ֔וֹת וַ/יִּקַּ֤ח הָ/אִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑/וֹ וּ/שְׁנֵ֤י צְמִידִים֙ עַל יָדֶ֔י/הָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: ml
  text: ഒട്ടകങ്ങൾ കുടിച്ചു തീർന്നപ്പോൾ, ആ മനുഷ്യൻ ഒരു ബേക്കാ[b] തൂക്കമുള്ള സ്വർണവളയവും[a] അവളുടെ കൈകളിൽ ഇടാനുള്ള സ്വർണത്തിന്റെ പത്തു ശേക്കെൽ തൂക്കമുള്ള രണ്ടു കൈവളകളും എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം മൂക്കിലോ ചെവിയിലോ ധരിക്കുന്ന വളയത്തെ സൂചിപ്പിക്കാം; ഇവിടെ ‘സ്വർണമൂക്കുവളയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഒരു ബേക്കാ അര ശേക്കെലിനു തുല്യമായിരുന്ന ഒരു തൂക്കയൂണിറ്റാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: ഒട്ടകങ്ങൾ കുടിച്ചു തീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയും കുടിക്കുക എന്ന ധാതുവിന്റെ അനന്തക്രിയാരൂപവും ചേർന്ന് കുടിക്കൽ പൂർത്തിയായ സമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമാനുക്രമ അർഥം നൽകുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഇയാൾ അബ്രാഹാമിന്റെ ദാസനാണെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായപാഠം ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ് പറയുന്നത്; അതിനാൽ ഉറവിടപദം നിലനിർത്തുന്നു.
- source_word: נֶזֶם זָהָב
  choice: സ്വർണവളയം
  rationale: נֶזֶם മൂക്കിലോ ചെവിയിലോ ധരിക്കുന്ന വളയത്തെ സൂചിപ്പിക്കാം. ‘മോതിരം’ വിരലിൽ ധരിക്കുന്ന ആഭരണമെന്ന തെറ്റായ പ്രത്യേകീകരണം വരുത്തുന്നതിനാൽ, കൂടുതൽ വിശാലമായ ‘വളയം’ തെരഞ്ഞെടുത്തു; ധരിക്കുന്ന സ്ഥലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: ഒരു ബേക്കാ തൂക്കമുള്ള
  rationale: പുരാതന തൂക്കയൂണിറ്റായ בֶּקַע നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ മൂല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: അവളുടെ കൈകളിൽ ഇടാൻ ... രണ്ടു കൈവളകൾ
  rationale: രണ്ട് എന്ന സംഖ്യയും കൈകളുമായുള്ള ബന്ധവും നിലനിർത്തി, മലയാളത്തിൽ ആഭരണത്തിന്റെ ഉപയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഈ ഘട്ടത്തിൽ അവൻ അവ ധരിപ്പിച്ചു എന്ന് പറയുന്നില്ല.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: ആകെ പത്തു ശേക്കെൽ സ്വർണം തൂക്കമുള്ള
  rationale: രണ്ടു കൈവളകളുടെയും സംയുക്തഭാരം പത്ത് എന്നതാണ് വാക്യഘടന; സന്ദർഭത്തിൽ സൂചിതമായ തൂക്കയൂണിറ്റായ ശേക്കെൽ വ്യക്തതയ്ക്കായി ചേർക്കുന്നു.
