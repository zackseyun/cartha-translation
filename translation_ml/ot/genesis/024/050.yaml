id: GEN.24.50
reference: Genesis 24:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן לָבָ֤ן וּ/בְתוּאֵל֙ וַ/יֹּ֣אמְר֔וּ מֵ/יְהוָ֖ה יָצָ֣א הַ/דָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖י/ךָ רַ֥ע אוֹ טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാനും ബെഥൂവേലും മറുപടിയായി പറഞ്ഞു: “ഈ കാര്യം യഹോവയിൽനിന്ന് വന്നതാണ്; നിന്നോട് ചീത്തയോ നല്ലതോ പറയാൻ ഞങ്ങൾക്കാവില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചീത്തയോ നല്ലതോ പറയാൻ” എന്നത് യഹോവ നിശ്ചയിച്ച കാര്യത്തെ എതിർക്കാനോ മാറ്റാനോ തങ്ങൾക്ക് കഴിയില്ലെന്നർഥമുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ട് എബ്രായ ക്രിയകളുടെയും മറുപടി-പ്രസംഗ സൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מֵיְהוָה
  choice: യഹോവയിൽനിന്ന്
  rationale: מִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָצָא הַדָּבָר
  choice: ഈ കാര്യം ... ഉണ്ടായതാണ്
  rationale: ഇവിടെ דָּבָר ഒരു വാക്കിനെക്കാൾ ചർച്ചയിലുള്ള വിവാഹകാര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; יָצָא അതിന്റെ ദൈവിക ഉറവിടം വ്യക്തമാക്കുന്നു.
- source_word: לֹא נוּכַל
  choice: ഞങ്ങൾക്കാവില്ല
  rationale: കഴിവില്ലായ്മയെയോ അധികാരമില്ലായ്മയെയോ ലളിതമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: דַּבֵּר אֵלֶיךָ רַע אוֹ טוֹב
  choice: നിന്നോട് ചീത്തയോ നല്ലതോ പറയാൻ
  rationale: എബ്രായത്തിലെ ‘ചീത്തയോ നല്ലതോ’ എന്ന ക്രമവും ധ്രുവപദപ്രയോഗവും നിലനിർത്തുന്നു; ‘പറയാൻ’ മലയാളത്തിൽ അഭിസംബോധന ചെയ്ത് സംസാരിക്കുന്നതിന് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ ബിരുദമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: ‘ചീത്തയോ നല്ലതോ പറയാൻ കഴിയില്ല’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മൂലത്തിലെ ധ്രുവപദപ്രയോഗം പ്രധാന പാഠത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: യഹോവ നിശ്ചയിച്ചതിനെ എതിർക്കാനോ മാറ്റാനോ ഞങ്ങൾക്കാവില്ല
  rationale: വാക്യത്തിന്റെ യഥാർഥ രൂപവും അതിലുള്ള അർഥവ്യാപ്തിയും സംരക്ഷിച്ച്, വ്യാഖ്യാനം പ്രധാന പാഠത്തിൽ ചേർത്ത് തീർപ്പാക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ഔപചാരിക മറുപടി-സൂത്രം മലയാളത്തിൽ സ്വാഭാവികമാക്കി; ദൈവനാമവും ‘ചീത്തയോ നല്ലതോ’ എന്ന ഉറവിടക്രമവും സംരക്ഷിച്ചു.
