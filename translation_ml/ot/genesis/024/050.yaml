  to: 'അപ്പോൾ ലാബാനും ബെഥൂവേലും മറുപടിയായി പറഞ്ഞു: “ഈ കാര്യം യഹോവയിൽനിന്ന് വന്നതാണ്; നിന്നോട് ചീത്തയോ നല്ലതോ പറയാൻ ഞങ്ങൾക്കാവില്ല.”[a]'
  rationale: Only the rendering of יָצָא was adjusted from ‘ഉണ്ടായതാണ്’ to ‘വന്നതാണ്,’ preserving the source’s ‘come from’ idiom more precisely. The footnote anchor and its explanatory function are retained.
