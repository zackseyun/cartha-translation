revisions:
- from: എന്റെ പിതൃഭവനത്തിൽനിന്നും എന്റെ ജന്മദേശത്തുനിന്നും എന്നെ കൂട്ടിക്കൊണ്ടുവന്നവനും, എന്നോടു സംസാരിച്ചവനും, ‘നിന്റെ സന്തതിക്ക് ഞാൻ ഈ ദേശം കൊടുക്കും’ എന്ന് എന്നോടു ശപഥം ചെയ്തവനുമായ സ്വർഗത്തിന്റെ ദൈവമായ യഹ്‌വെ—അവിടുന്നുതന്നെ തന്റെ ദൂതനെ[a] നിനക്കു മുമ്പായി അയക്കും; അവിടെനിന്ന് നീ എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ കൊണ്ടുവരണം.
  to: എന്റെ പിതൃഭവനത്തിൽനിന്നും എന്റെ ജന്മദേശത്തുനിന്നും എന്നെ എടുത്തുകൊണ്ടുപോയവനും, എന്നോടു സംസാരിച്ചവനും, ‘നിന്റെ സന്തതിക്ക് ഞാൻ ഈ ദേശം കൊടുക്കും’ എന്ന് എന്നോടു ശപഥം ചെയ്തവനുമായ സ്വർഗത്തിന്റെ ദൈവമായ യഹ്‌വെ—അവൻ തന്നേ തന്റെ ദൂതനെ[a] നിനക്കു മുമ്പായി അയക്കും; അവിടെനിന്ന് നീ എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ എടുക്കണം.
