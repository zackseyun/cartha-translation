  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: ml
  text: എന്റെ പിതൃഭവനത്തിൽനിന്നും എന്റെ ജന്മദേശത്തുനിന്നും എന്നെ എടുത്തുകൊണ്ടുപോയവനും, എന്നോടു സംസാരിച്ചവനും, ‘നിന്റെ സന്തതിക്ക് ഞാൻ ഈ ദേശം കൊടുക്കും’ എന്ന് എന്നോടു ശപഥം ചെയ്തവനുമായ സ്വർഗത്തിന്റെ ദൈവമായ യഹ്‌വെ—അവൻ തന്നേ തന്റെ ദൂതനെ[a] നിനക്കു മുമ്പായി അയക്കും; അവിടെനിന്ന് നീ എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ എടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ സന്ദേശവാഹകനെ.” מַלְאָךְ എന്ന ഹീബ്രു പദത്തിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെയാണ് ഉദ്ദേശിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ലിപ്യന്തരണം മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: സ്വർഗത്തിന്റെ ദൈവം
  rationale: ഹീബ്രു ബന്ധപദപ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְקָחַנִי
  choice: എന്നെ കൂട്ടിക്കൊണ്ടുവന്നവൻ
  rationale: לקח എന്ന ക്രിയയുടെ ‘കൊണ്ടുപോകുക/കൊണ്ടുവരുക’ എന്ന അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു; അബ്രാഹാമിനെ പിതൃഭവനത്തിൽനിന്നും ജന്മദേശത്തുനിന്നും ദൈവം നയിച്ചതാണ് സൂചന.
- source_word: מִבֵּית אָבִי
  choice: എന്റെ പിതൃഭവനത്തിൽനിന്ന്
  rationale: കുടുംബ-ഗൃഹ പശ്ചാത്തലം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: എന്റെ ജന്മദേശത്തുനിന്ന്
  rationale: מוֹלֶדֶת എന്ന പദത്തിന്റെ ജന്മസ്ഥലം/സ്വദേശം എന്ന അർഥവ്യാപ്തിയിൽ, ബന്ധുജനങ്ങളെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: דִּבֶּר לִי
  choice: എന്നോടു സംസാരിച്ചവൻ
  rationale: വാഗ്ദാനത്തിന്റെ ഉള്ളടക്കം പിന്നാലെ വരുന്നതിനാൽ ക്രിയയെ ‘വാഗ്ദാനം ചെയ്തു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: נִשְׁבַּע לִי
  choice: എന്നോടു ശപഥം ചെയ്തവൻ
  rationale: ശപഥസന്ദർഭത്തിലെ ഹീബ്രു ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്ക്
  rationale: זֶרַע എന്ന കൂട്ടായ ഏകവചനത്തിന്റെ വിപുലത നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: ഞാൻ ഈ ദേശം കൊടുക്കും
  rationale: ഭൂവാഗ്ദാനത്തിന്റെ ലളിതമായ ഭാവികാലരൂപവും ‘ഈ ദേശം’ എന്ന നിർദ്ദേശാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: הוּא
  choice: അവിടുന്നുതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ ‘തന്നെ’ മുഖേന പ്രകടമാക്കുകയും ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള മലയാളരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: തന്റെ ദൂതനെ നിനക്കു മുമ്പായി അയക്കും
  rationale: מַלְאָךְ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ള സ്വർഗീയ ദൂതൻ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ‘സന്ദേശവാഹകൻ’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי מִשָּׁם
  choice: അവിടെനിന്ന് നീ എന്റെ മകനുവേണ്ടി ഒരു ഭാര്യയെ കൊണ്ടുവരണം
  rationale: ദാസനു നൽകിയ നിയോഗത്തിന്റെ നിർബന്ധസ്വരം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ഉറവിടസ്ഥലമായ ‘അവിടെനിന്ന്’ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: מַלְאָכוֹ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: തന്റെ ദൂതൻ
  alternative: തന്റെ സന്ദേശവാഹകൻ
  rationale: ദൈവിക നടത്തിപ്പിനെക്കുറിച്ചുള്ള ഈ പ്രസ്താവനയിൽ സ്വർഗീയ ദൂതനാണ് കൂടുതൽ സാധ്യത; എന്നാൽ ഹീബ്രുപദത്തിന് പൊതുവായ സന്ദേശവാഹകൻ എന്ന അർഥവും ഉള്ളതിനാൽ ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഹീബ്രു ബന്ധവാക്യത്തിന്റെ ഘടന കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി കോമകളും ഡാഷും ഉപയോഗിച്ചു. ‘പിതൃഭവനം,’ ‘സന്തതി,’ ‘ശപഥം’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത പുലർത്തുന്നു; എങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
