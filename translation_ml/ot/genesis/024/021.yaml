source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: ml
  text: യഹ്‌വേ ആ മനുഷ്യന്റെ യാത്ര വിജയകരമാക്കിയിട്ടുണ്ടോ ഇല്ലയോ എന്ന് അറിയാൻ, ആ മനുഷ്യൻ മൗനമായി അവളെ നോക്കിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേ ആ മനുഷ്യന്റെ വഴി സഫലമാക്കിയിട്ടുണ്ടോ ഇല്ലയോ എന്ന് അറിയാൻ, ആ മനുഷ്യൻ മൗനമായി അവളെ ഉറ്റുനോക്കി.”
    reason: מִשְׁתָּאֵה എന്ന പദത്തിന് ‘ഉറ്റുനോക്കുക/വിസ്മയത്തോടെ നോക്കുക’ എന്ന ഭാവവും, דֶּרֶךְ എന്നതിന് ‘വഴി’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ പരിഭാഷയും സാധ്യമാണ്.
lexical_decisions:
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ ദാസനാണെങ്കിലും, എബ്രായമൂലം ഇവിടെ സാധാരണ നാമമായ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ് പറയുന്നത്; അതിനാൽ സന്ദർഭപദവി ചേർക്കാതെ മൂലവാചകം നിലനിർത്തുന്നു.
- source_word: מִשְׁתָּאֵה
  choice: നോക്കിക്കൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായ, ശ്രദ്ധാപൂർവമായ നിരീക്ഷണമാണ് പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്നത്; വിസ്മയത്തിന്റെ സാധ്യതയുള്ള ഭാവം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: לָהּ
  choice: അവളെ
  rationale: അവന്റെ ശ്രദ്ധയുടെ ലക്ഷ്യം സ്ത്രീയാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַחֲרִישׁ
  choice: നിശ്ശബ്ദനായി
  rationale: חרשׁ എന്ന ധാതുവിന്റെ മൗനം പാലിക്കുക എന്ന അർഥം, നോക്കിയ രീതിയെ വിവരിക്കുന്ന സ്വാഭാവിക മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: לָדַעַת
  choice: അറിയാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: הַהִצְלִיחַ
  choice: വിജയിപ്പിച്ചോ
  rationale: צלח-ന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—വിജയിക്കുമാറാക്കിയോ—ചുരുക്കവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: דַּרְכּוֹ
  choice: തന്റെ യാത്ര
  rationale: דרך എന്നത് അക്ഷരാർഥത്തിൽ ‘വഴി’ എന്നാണെങ്കിലും, ഇവിടെ മനുഷ്യന്റെ യാത്രയെയും ഉദ്യമത്തെയും സൂചിപ്പിക്കുന്നു; ‘യാത്ര’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്. ‘തന്റെ’ എന്നത് മലയാളത്തിലെ പരാവർത്തിത കർത്തൃബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אִם לֹא
  choice: ഇല്ലയോ
  rationale: പരോക്ഷ ചോദ്യത്തിൽ ‘ചെയ്തോ ഇല്ലയോ’ എന്ന മലയാള ഘടന എബ്രായത്തിലെ ‘whether ... or not’ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലവാചകം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു ബിരുദം പകരാതെ ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ പങ്കാളിക്രിയകളുടെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘നോക്കിക്കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി; യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
