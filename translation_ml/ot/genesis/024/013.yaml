id: GEN.24.13
reference: Genesis 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: ml
  text: ഇതാ, ഞാൻ നീരുറവിനരികെ നിൽക്കുന്നു; പട്ടണത്തിലെ പുരുഷന്മാരുടെ പുത്രിമാർ വെള്ളം കോരാൻ പുറത്തേക്കു വരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സംസാരിക്കുന്നവന്റെ മുമ്പിലുള്ള സാഹചര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള സമാനപദം.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്രമായ ഒന്നാംപുരുഷ സർവനാമം വ്യക്തമായ സ്വയംപരാമർശം നൽകുന്നു; മലയാളത്തിൽ അധിക ഊന്നൽ ചേർക്കേണ്ടതില്ല.
- source_word: נִצָּב
  choice: നിൽക്കുന്നു
  rationale: നിഫാൽ കൃദന്തം സന്ദർഭത്തിൽ ഇപ്പോഴത്തെ നിലയെയോ ഭാവത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: עַל
  choice: അരികെ
  rationale: ജലസ്രോതസ്സുമായി ബന്ധപ്പെട്ട സ്ഥലസൂചനയിൽ ‘അരികെ’ എന്നത് സ്വാഭാവികമായ അർഥം നൽകുന്നു.
- source_word: עֵין הַמָּיִם
  choice: നീരുറവ്
  rationale: עַיִן ഇവിടെ കിണറിനേക്കാൾ സ്വാഭാവിക ജലസ്രോതസ്സായ ഉറവിനെ സൂചിപ്പിക്കുന്നു; ‘നീരുറവ്’ സംക്ഷിപ്തവും കൃത്യവുമാണ്.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: പട്ടണത്തിലെ പുരുഷന്മാരുടെ പുത്രിമാർ
  rationale: ഹീബ്രുവിലെ കുടുംബ-സാമൂഹിക പ്രയോഗവും പുരുഷലിംഗസൂചനയും അനാവശ്യമായി സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: יֹצְאֹת
  choice: പുറത്തേക്കു വരുന്നു
  rationale: സ്ത്രീലിംഗ ബഹുവചന കൃദന്തം നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ സംഭവിക്കുന്നതോ ആയ ചലനത്തെ പ്രസംഗകന്റെ ദൃഷ്ടികോണത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִשְׁאֹב מָיִם
  choice: വെള്ളം കോരാൻ
  rationale: ജലസ്രോതസ്സിൽനിന്ന് വെള്ളം എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
