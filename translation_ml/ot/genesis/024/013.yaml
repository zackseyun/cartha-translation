  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നീരുറവ്’ എന്നത് സാധാരണ കിണറിനെ സൂചിപ്പിക്കുന്ന בְּאֵר എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു; ‘പട്ടണത്തിലെ പുരുഷന്മാരുടെ പുത്രിമാർ’ എന്ന രൂപം മൂലത്തിലെ സാമൂഹിക-കുടുംബപ്രയോഗം സംരക്ഷിക്കുന്നു.
