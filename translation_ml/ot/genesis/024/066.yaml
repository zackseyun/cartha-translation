id: GEN.24.66
reference: Genesis 24:66
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְסַפֵּ֥ר הָ/עֶ֖בֶד לְ/יִצְחָ֑ק אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: ml
  text: ദാസൻ താൻ ചെയ്ത കാര്യങ്ങളെല്ലാം യിസ്ഹാക്കിനോടു വിവരിച്ചു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിവരങ്ങളെല്ലാം’, ‘വാക്കുകളെല്ലാം’; എബ്രായത്തിലെ דְּבָרִים എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അടിമ’; എബ്രായത്തിലെ עֶבֶד എന്ന പദത്തിന് ‘ദാസൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം. ഇവിടെ അയാളുടെ ബന്ധിതസ്ഥിതിയേക്കാൾ ദാസനെന്ന നിലയിലുള്ള പങ്കിനാണ് ആഖ്യാനം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: വിവരിച്ചു
  rationale: പീയേൽ രൂപം ഇവിടെ ദൗത്യത്തിൽ സംഭവിച്ചതും ചെയ്തതുമായ കാര്യങ്ങൾ ക്രമമായി അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിവരിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָעֶבֶד
  choice: ദാസൻ
  rationale: עֶבֶד എന്നതിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഈ സന്ദർഭത്തിൽ ബന്ധിതസ്ഥിതിയേക്കാൾ അബ്രാഹാമിന്റെ നിയോഗിത സേവകൻ എന്ന പങ്കാണ് മുൻനിൽക്കുന്നത്.
- source_word: לְיִצְחָק
  choice: യിസ്ഹാക്കിനോടു
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; לְ ഇവിടെ വിവരം അറിയിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: കാര്യങ്ങളെല്ലാം
  rationale: דְּבָרִים എന്നത് വാക്കുകൾ, കാര്യങ്ങൾ, സംഭവങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ ദാസന്റെ ദൗത്യവുമായി ബന്ധപ്പെട്ട പ്രവൃത്തികളും സംഭവവിവരങ്ങളും ഉൾപ്പെടുന്നതിനാൽ ‘കാര്യങ്ങളെല്ലാം’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: താൻ ചെയ്ത
  rationale: עָשָׂה പൂർത്തിയായ മുൻപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘താൻ ചെയ്ത’ എന്നത് ദാസനിലേക്കുള്ള കർത്തൃസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കാര്യങ്ങളെല്ലാം’ എന്ന പ്രയോഗം മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പദപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
