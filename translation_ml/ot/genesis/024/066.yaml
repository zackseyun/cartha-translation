  terminology: ‘ദാസൻ’ is contextually viable for הָעֶבֶד, while the footnote responsibly preserves ‘അടിമ’ as a lexical alternative. ‘കാര്യങ്ങളെല്ലാം’ preserves the contextual breadth of דְּבָרִים. The form ‘യിസ്ഹാക്ക്’ is a defensible direct transliteration of the Hebrew name.
