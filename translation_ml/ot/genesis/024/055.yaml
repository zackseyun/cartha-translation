source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אָחִ֨י/הָ֙ וְ/אִמָּ֔/הּ תֵּשֵׁ֨ב הַ/נַּעֲרָ֥ אִתָּ֛/נוּ יָמִ֖ים א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: ml
  text: 'എന്നാൽ അവളുടെ സഹോദരനും അമ്മയും പറഞ്ഞു: “യുവതി ഞങ്ങളോടൊപ്പം ഏതാനും ദിവസമോ പത്തു ദിവസമോ താമസിക്കട്ടെ; അതിനുശേഷം അവൾ പോകട്ടെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായയിൽ അക്ഷരാർഥം: “ദിവസങ്ങൾ, അല്ലെങ്കിൽ പത്ത്.” ഈ പ്രയോഗം “ഏതാനും ദിവസങ്ങൾ, അല്ലെങ്കിൽ പത്തു ദിവസം” എന്നായിരിക്കാം അർഥമാക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ദാസന്റെ അടിയന്തര അഭ്യർഥനയോടുള്ള പ്രതികൂലത ഇവിടെ ഉള്ളതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്. ഏകവചന ക്രിയ സംയുക്ത കർത്താവിനോടൊപ്പം വന്നിരിക്കുന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ ബഹുവചന ആശയത്തോടെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: അവളുടെ സഹോദരനും അമ്മയും
  rationale: ഹീബ്രായയിലെ ഏകവചനമായ ‘സഹോദരൻ’ നിലനിർത്തുകയും പദക്രമം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുകയും ചെയ്തു.
- source_word: תֵּשֵׁב
  choice: താമസിക്കട്ടെ
  rationale: യാത്ര പുറപ്പെടുന്നത് വൈകിപ്പിക്കണമെന്ന അഭ്യർഥനയുടെ സാഹചര്യത്തിൽ ‘ഇരിക്കുക/വസിക്കുക’ എന്നതിനെക്കാൾ ‘താമസിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്; ജസ്സീവ് ഭാവം ‘-ട്ടെ’ കൊണ്ട് അറിയിച്ചു.
- source_word: הַנַּעֲרָ
  choice: യുവതി
  rationale: നַעֲרָה ഒരു യുവതിയെ സൂചിപ്പിക്കുന്നു; ‘പെൺകുട്ടി’ എന്നതിനെക്കാൾ മാന്യവും ‘കന്യക’ എന്ന അനാവശ്യ അർത്ഥവിശേഷം ചേർക്കാത്തതുമായ ആധുനിക പ്രയോഗമാണ് ‘യുവതി’.
- source_word: אִתָּנוּ
  choice: ഞങ്ങളോടൊപ്പം
  rationale: സാന്നിധ്യവും കൂടെയിരിപ്പും സൂചിപ്പിക്കുന്ന മുൻപ്രത്യയപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: ഏതാനും ദിവസമോ പത്തു ദിവസമോ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങൾ, അല്ലെങ്കിൽ പത്ത്’ എന്നാണ്. സന്ദർഭത്തിലെ സാധ്യതയുള്ള പ്രയോഗാർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകി; മൂലത്തിലെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אַחַר תֵּלֵךְ
  choice: അതിനു ശേഷം അവൾ പോകട്ടെ
  rationale: אַחַר തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു. തֵּלֵךְ സന്ദർഭത്തിൽ യുവതിയെയാണ് സൂചിപ്പിക്കുന്നത്; അനുമതി/അഭ്യർഥനയുടെ ഭാവം ‘പോകട്ടെ’ നിലനിർത്തുന്നു.
