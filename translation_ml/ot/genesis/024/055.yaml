translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കുടുംബബന്ധവും അഭ്യർഥനാഭാവവും വ്യക്തമായി നിലനിർത്തി; മൂലത്തിലെ കാലപരിധിസംബന്ധിയായ അസ്പഷ്ടത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
