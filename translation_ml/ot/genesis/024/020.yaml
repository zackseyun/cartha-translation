source:
  edition: WLC
  text: וַ/תְּמַהֵ֗ר וַ/תְּעַ֤ר כַּדָּ/הּ֙ אֶל הַ/שֹּׁ֔קֶת וַ/תָּ֥רָץ ע֛וֹד אֶֽל הַ/בְּאֵ֖ר לִ/שְׁאֹ֑ב וַ/תִּשְׁאַ֖ב לְ/כָל גְּמַלָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: ml
  text: അവൾ വേഗം തന്റെ കുടത്തിലെ വെള്ളം തൊട്ടിയിലേക്ക് ഒഴിച്ചിട്ട്[a], വെള്ളം കോരാൻ വീണ്ടും കിണറ്റിലേക്ക് ഓടി; അവന്റെ എല്ലാ ഒട്ടകങ്ങൾക്കുമായി വെള്ളം കോരി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ കുടത്തിലെ വെള്ളം മൃഗങ്ങൾക്ക് വെള്ളം കൊടുക്കുന്ന തൊട്ടിയിലേക്ക് ഒഴിച്ചിട്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: അവൾ വേഗം
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന തിടുക്കവും ഉടനടിയുള്ള പ്രവർത്തനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַתְּעַר כַּדָּהּ
  choice: തന്റെ കുടത്തിലെ വെള്ളം ... ഒഴിച്ചിട്ട്
  rationale: ערה എന്നത് ഇവിടെ പാത്രത്തിലെ ഉള്ളടക്കം ഒഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കുടം ഒഴിച്ചു’ എന്നതിനെക്കാൾ വെള്ളം വ്യക്തമാക്കി പറയുന്നത് സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മവുമാണ്.
- source_word: הַשֹּׁקֶת
  choice: തൊട്ടി
  rationale: മൃഗങ്ങൾക്ക് വെള്ളം കൊടുക്കുന്ന പാത്രത്തെയോ സംഭരണിയെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പൊതുമലയാള പദം.
- source_word: וַתָּרָץ עוֹד
  choice: വീണ്ടും ... ഓടി
  rationale: רץ എന്നതിലെ ഓട്ടവും עוֹד നൽകുന്ന ആവർത്തനബോധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַבְּאֵר
  choice: കിണർ
  rationale: באר എന്ന പദത്തിന്റെ ഈ കഥാസന്ദർഭത്തിലെ സാധാരണ അർത്ഥം.
- source_word: לִשְׁאֹב
  choice: വെള്ളം കോരാൻ
  rationale: കിണറ്റിൽനിന്ന് വെള്ളം എടുക്കുന്ന പ്രവൃത്തിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം; സന്ദർഭത്തിൽ അന്തർലീനമായ ‘വെള്ളം’ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּשְׁאַב
  choice: വെള്ളം കോരി
  rationale: ഹീബ്രുവിലെ തുടർന്നുള്ള സമാപകക്രിയ നിലനിർത്തുന്നു; എല്ലാ ഒട്ടകങ്ങൾക്കും വേണ്ടിയുള്ള ആവർത്തിച്ചുള്ള കോരൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לְכָל גְּמַלָּיו
  choice: അവന്റെ എല്ലാ ഒട്ടകങ്ങൾക്കുമായി
  rationale: כָּל എന്ന സമഗ്രതയും വെള്ളം കോരിയതിന്റെ പ്രയോജനഭോക്താക്കളും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
