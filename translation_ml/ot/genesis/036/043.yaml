    rationale: ‘പ്രമുഖൻ’ എന്നത് ഒരു വ്യക്തിയുടെ പ്രാധാന്യം മാത്രമാണ് സൂചിപ്പിക്കുന്നത്; ഇവിടെ ഉദ്ദേശിക്കുന്ന ഗോത്ര/കുലനേതൃപദവി വ്യക്തമാക്കുന്നില്ല. സംഗ്രഹത്തിലെ ‘ഗോത്രത്തലവന്മാർ’ എന്നതുമായ പദസമന്വയവും ഇല്ല.
