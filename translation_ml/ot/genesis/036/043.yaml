source:
  edition: WLC
  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: ml
  text: ഗോത്രത്തലവൻ മഗ്ദീയേൽ, ഗോത്രത്തലവൻ ഈരാം. തങ്ങളുടെ അവകാശഭൂമിയിലെ വാസസ്ഥലങ്ങൾക്കനുസരിച്ച് ഇവരാണ് ഏദോമിലെ ഗോത്രത്തലവന്മാർ.[a] ഇവൻ ഏദോമിന്റെ പിതാവായ ഏശാവാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏദോമിലെ കുലത്തലവന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ നേതാവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ഏശാവ് ഏദോമ്യരുടെ പൂർവപിതാവാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף / אַלּוּפֵי
  choice: പ്രമുഖൻ / ഗോത്രത്തലവന്മാർ
  rationale: ഈ അധ്യായത്തിൽ പദം ഏദോമ്യ ഗോത്രങ്ങളുടെയോ കുലങ്ങളുടെയോ നേതാക്കളെ സൂചിപ്പിക്കുന്നു. പേരുകൾക്കുമുമ്പിൽ ആവർത്തിക്കുന്ന ഔപചാരിക പദവിക്ക് ‘പ്രമുഖൻ’ സ്വാഭാവികമാണ്; സംഗ്രഹവാക്യത്തിൽ കൂട്ടത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കാൻ ‘ഗോത്രത്തലവന്മാർ’ ഉപയോഗിച്ചു.
- source_word: מַגְדִּיאֵל
  choice: മഗ്ദീയേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עִירָם
  choice: ഈരാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לְמֹשְׁבֹתָם
  choice: തങ്ങളുടെ ... വാസസ്ഥലങ്ങൾക്കനുസരിച്ച്
  rationale: ഇവിടെയുള്ള לְ വർഗീകരണമോ ക്രമീകരണമോ സൂചിപ്പിക്കുന്നു; പട്ടിക വാസസ്ഥലങ്ങളുടെ അടിസ്ഥാനത്തിലാണെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: തങ്ങളുടെ അവകാശഭൂമിയിലെ
  rationale: אֲחֻזָּה സ്വന്തമായുള്ള ഭൂസ്വത്തെയോ അവകാശമായി കൈവശമുള്ള പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: הוּא עֵשָׂו
  choice: ഏശാവ് ഇവൻ തന്നെയാണ്
  rationale: മുൻപുള്ള വംശാവലി മുഴുവനെയും ഏശാവുമായി തിരിച്ചറിയിക്കുന്ന സമാപനപ്രസ്താവനയാണിത്. ‘ഇവൻ തന്നെയാണ്’ ഊന്നൽ നിലനിർത്തുകയും ഈരാമിനെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲבִי אֱדֹם
  choice: ഏദോമിന്റെ പിതാവ്
  rationale: אָב ഇവിടെ വംശപൂർവികനെ സൂചിപ്പിക്കുന്നു. ‘പിതാവ്’ എന്ന ഹീബ്രു വംശാവലിപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: ഏശാവിനെ ഏദോമിന്റെ വംശപൂർവികനായി വിശേഷിപ്പിക്കൽ
  choice: ഏദോമിന്റെ പിതാവ്
  alternative: ഏദോമ്യരുടെ പൂർവപിതാവ്
  rationale: മൂലത്തിലെ ‘പിതാവ്’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; ഇവിടെ ‘ഏദോം’ ജനതയായ ഏദോമ്യരെയും സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ വംശീയ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വംശാവലി-പട്ടികാശൈലി. പേരുകൾ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; ഉടമസ്ഥതയും വാസസ്ഥലക്രമവും സൂചിപ്പിക്കുന്ന മൂലത്തിലെ ഘടന സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു.
