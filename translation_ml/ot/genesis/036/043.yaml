  source_fidelity: മൂലഹീബ്രുവിലെ אַלּוּף എന്ന ഔപചാരിക ഗോത്ര/കുലനേതൃപദവി പേരുകൾക്കുമുമ്പിലും സംഗ്രഹവാക്യത്തിലും ഒരേവിധം പ്രതിഫലിപ്പിക്കണം. കരടിലെ ‘പ്രമുഖൻ’ പൊതുവായ വിശേഷണമായതിനാൽ പദവിയുടെ അർഥം മങ്ങുന്നു. ‘ഗോത്രത്തലവൻ’ സന്ദർഭത്തിനും മൂലത്തിനും കൂടുതൽ യോജിച്ചതാണ്.
  naturalness: ‘ഏദോമിന്റെ പിതാവായ ഏശാവ് ഇവൻ തന്നെയാണ്’ എന്ന നിലവിലെ പദക്രമം ആധുനിക മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്. ‘ഇവൻ ഏദോമിന്റെ പിതാവായ ഏശാവാണ്’ സ്വാഭാവികവും മൂലത്തിലെ തിരിച്ചറിയൽവാക്യവും നിലനിർത്തുന്നതുമാണ്.
  terminology: ‘ഗോത്രത്തലവൻ’ אַלּוּף-ന് സ്ഥിരതയുള്ള പരിഭാഷയാണ്. ‘അവകാശഭൂമിയിലെ വാസസ്ഥലങ്ങൾക്കനുസരിച്ച്’ לְמֹשְׁבֹתָם בְּאֶרֶץ אֲחֻזָּתָם എന്ന ഘടനയെ മതിയായ രീതിയിൽ നൽകുന്നു. ‘ഏദോമിന്റെ പിതാവ്’ എന്ന വംശാവലിപ്രയോഗവും, അടിക്കുറിപ്പിലെ ‘പൂർവപിതാവ്’ വിശദീകരണവും നിലനിർത്താം.
  issues:
