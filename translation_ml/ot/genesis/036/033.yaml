lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: മൂത് എന്ന ക്രിയയുടെ വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; വ്യക്തതയ്ക്കായി കർത്താവായ ബേലയുടെ പേര് നേരിട്ട് ചേർത്തിരിക്കുന്നു.
- source_word: בָּלַע
  choice: ബേല
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിന്തുടർച്ചയുടെ ഈ സൂത്രവാക്യത്തിൽ മാലഖ് എന്ന ക്രിയ രാജത്വം ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: മുൻ ഭരണാധികാരിയുടെ സ്ഥാനത്തേക്കുള്ള പിന്തുടർച്ചയെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן זֶרַח
  choice: സേരഹിന്റെ മകൻ
  rationale: യോബാബിനെ പിതൃനാമംകൊണ്ട് തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തഘടന നേരിട്ട് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: מִבָּצְרָה
  choice: ബൊസ്രായിൽനിന്നുള്ള
  rationale: മിൻ എന്ന ഉപസർഗത്തിന്റെ സാധാരണ ഉത്ഭവാർഥം നിലനിർത്തുന്നു; നഗരവുമായുള്ള ബന്ധം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
