translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
