id: GEN.36.26
reference: Genesis 36:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: ml
  text: 'ദീശാന്റെ പുത്രന്മാർ ഇവരാണ്: ഹെംദാൻ, എശ്ബാൻ, ഇത്രാൻ, കെരാൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വംശാവലിവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന וְ പട്ടികയുടെ തുടർച്ചയിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ ചേർത്തിട്ടില്ല.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ പേരെടുത്ത് പറയുന്ന നേരിട്ടുള്ള പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനു പകരം മൂലത്തോട് അടുത്ത ‘പുത്രന്മാർ’ സ്വീകരിച്ചു.
- source_word: דִישָׁן
  choice: ദീശാൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമം അതിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: חֶמְדָּן
  choice: ഹെംദാൻ
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളിലുള്ള ഹീബ്രായ നാമരൂപം മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: וְ/אֶשְׁבָּן
  choice: എശ്ബാൻ
  rationale: വ്യക്തിനാമം നേരിട്ട് ലിപ്യന്തരിച്ചു; മുൻപ്രത്യയമായ ബന്ധകത്തെ മലയാളപ്പട്ടികയിലെ കോമകൾ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: וְ/יִתְרָן
  choice: ഇത്രാൻ
  rationale: ഹീബ്രായ יתרן എന്ന വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וּ/כְרָן
  choice: കെരാൻ
  rationale: כ എന്ന അക്ഷരം ഇവിടെ ദാഗേഷ് ഇല്ലാത്തതിനാൽ ഘർഷധ്വനിയാണെങ്കിലും, മലയാള ബൈബിൾ പേരുകളുടെ വായനാസൗകര്യവും അടിസ്ഥാനനാമരൂപത്തിന്റെ തിരിച്ചറിയലും കണക്കിലെടുത്ത് ‘കെരാൻ’ സ്വീകരിച്ചു; ബന്ധകം പട്ടികയിലെ അവസാന കോമയിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
