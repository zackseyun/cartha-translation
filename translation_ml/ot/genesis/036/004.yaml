id: GEN.36.4
reference: Genesis 36:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד עָדָ֛ה לְ/עֵשָׂ֖ו אֶת אֱלִיפָ֑ז וּ/בָ֣שְׂמַ֔ת יָלְדָ֖ה אֶת רְעוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: ml
  text: ആദാ ഏശാവിന് എലീഫസിനെ പ്രസവിച്ചു; ബാസെമത്ത് രെയൂവേലിനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ ‘പ്രസവിക്കുക’ എന്ന അർഥം വംശാവലിയുടെ ചുരുക്കമായ ശൈലിയിൽ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: לְעֵשָׂו
  choice: ഏശാവിന്
  rationale: ילד എന്ന ക്രിയയോടൊപ്പമുള്ള לְ ഇവിടെ പിതാവുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഏശാവിന്’ എന്നത് അതിനെ ചുരുക്കമായും അതിവ്യാഖ്യാനം കൂടാതെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ കർമരൂപവും വാക്യക്രമവും അതിന്റെ ധർമം നിർവഹിക്കുന്നു.
- source_word: אֱלִיפָז
  choice: എലീഫസ്
  rationale: മസോരറ്റിക് എബ്രായത്തിലെ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בָשְׂמַת
  choice: ബാസെമത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജന-സ്വരഘടന മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: മസോരറ്റിക് പാഠത്തിലെ എബ്രായ ഉച്ചാരണഘടനയെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: וּ
  choice: ;
  rationale: എബ്രായത്തിലെ ലളിതമായ ഏകോപനബന്ധം മലയാളത്തിൽ രണ്ട് സമാന്തര ജനനവിവരങ്ങളെ ബന്ധിപ്പിക്കുന്ന അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലി വിവരണത്തിന് യോജിച്ച ചുരുക്കവും മാന്യവുമായ ശൈലി. മാതാക്കളെ കർത്താക്കളായി വ്യക്തമായി നിലനിർത്തുകയും എബ്രായ വാക്യത്തിന്റെ രണ്ട് സമാന്തര ഭാഗങ്ങൾ സംരക്ഷിക്കുകയും ചെയ്തു.
