  terminology: “പ്രഭുക്കന്മാർ” is an acceptable traditional rendering for Edomite אַלּוּפִים, and the footnote suitably clarifies that these are clan or tribal heads. Names and the genealogical term “പുത്രന്മാർ” are appropriate.
  issues:
