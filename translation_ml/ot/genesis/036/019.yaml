lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വംശാവലിസംഗ്രഹവാക്യത്തെ സ്വാഭാവികമായ മലയാള വർത്തമാനകാല തിരിച്ചറിയൽരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഈ വംശാവലിസന്ദർഭത്തിൽ പദം ഏശാവിന്റെ ആൺമക്കളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: ആദ്യത്തെ തിരിച്ചറിയൽവാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുന്നു; മലയാളത്തിൽ അർദ്ധവിരാമം ബന്ധകത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: אַלּוּפֵיהֶם
  choice: അവരുടെ പ്രഭുക്കന്മാർ
  rationale: ഏദോമിലെ ഗോത്രങ്ങളുടെയോ കുലങ്ങളുടെയോ അധികാരമുള്ള തലവന്മാരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാമൂഹിക-രാഷ്ട്രീയ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: അവൻ തന്നെയാണ്
  rationale: സർവനാമം ഏശാവിനെ വീണ്ടും എടുത്തുപറഞ്ഞ് ഏദോമുമായി തിരിച്ചറിയുന്നു; മലയാളത്തിൽ വ്യക്തിപരമായ തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: ഏശാവിനെയും അവനിൽനിന്നുണ്ടായ ജനതയെയും ദേശത്തെയും തിരിച്ചറിയിക്കുന്ന പേരിന്റെ പതിവ് മലയാള ലിപ്യന്തരണം.
