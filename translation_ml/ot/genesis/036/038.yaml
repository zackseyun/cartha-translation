lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ ഖാൽ വയ്യിഖ്തോൽ രൂപം; മരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനക്രിയയായതിനാൽ ഭംഗിവാക്കുകൾ ഒഴിവാക്കി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: שָׁאוּל
  choice: ശാഊൽ
  rationale: ഹീബ്രു പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിന്തുടർച്ചാവാക്യത്തിൽ מלך എന്ന ക്രിയ അധികാരമേറ്റ് രാജാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: തന്റെ മുൻഗാമിയുടെ സ്ഥാനം ഏറ്റെടുക്കുന്ന രാജകീയ പിന്തുടർച്ചയെ വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בַּעַל חָנָן
  choice: ബാൽ-ഹാനാൻ
  rationale: രണ്ടു ഘടകങ്ങളുള്ള ഹീബ്രു വ്യക്തിനാമം വായനാസൗകര്യത്തിനായി ഹൈഫനോടെ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഹീബ്രു നിർമിതരൂപം നേരിട്ടുള്ള പുത്രബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: עַכְבּוֹר
  choice: അക്ബോർ
  rationale: ഹീബ്രു പേരിന്റെ വ്യഞ്ജനരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം; പതിവുരൂപമായ ‘അഖ്ബോർ’ എന്നതിനു പകരം ക് ശബ്ദം നിലനിർത്തുന്നു.
