id: GEN.36.10
reference: Genesis 36:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: എലീഫസ്, ഏശാവിന്റെ ഭാര്യയായ ആദായുടെ മകൻ; രെയൂവേൽ, ഏശാവിന്റെ ഭാര്യയായ ബാസ്മത്തിന്റെ മകൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי עֵשָׂו
  choice: ഏശാവിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്
  rationale: പട്ടികയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ വാക്യഘടനയുടെ അവതരണഭാവം നിലനിർത്തുന്നു. בְּנֵי എന്ന പദത്തിന്റെ പുരുഷലിംഗ ബഹുവചന അർഥം വ്യക്തമാക്കാൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: אֱלִיפַז בֶּן עָדָה
  choice: ആദായുടെ മകൻ എലീഫസ്
  rationale: בֶּן സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മാതൃപുത്രബന്ധം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വംശാവലിശൈലിക്കായി ബന്ധവിവരണം പേരിനു മുമ്പായി ക്രമപ്പെടുത്തി.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ഏശാവിന്റെ ഭാര്യയായ
  rationale: ‘ഏശാവിന്റെ ഭാര്യ’ എന്ന ഉടമസ്ഥബന്ധം കൃത്യമായി നൽകുകയും മാതാവിന്റെ പേരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. മൂലപാഠത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
- source_word: רְעוּאֵל בֶּן בָּשְׂמַת
  choice: ബാസ്മത്തിന്റെ മകൻ രെയൂവേൽ
  rationale: പുത്രബന്ധം ആദ്യ ഘടകത്തോടു സമാന്തരമായി വിവർത്തനം ചെയ്തു; പേരുകൾ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. എബ്രായ വംശാവലിശൈലിയിലെ സമാന്തരതയും ‘ഏശാവിന്റെ ഭാര്യ’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
