revisions:
- from: 'ഏശാവിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: ഏശാവിന്റെ ഭാര്യയായ ആദായുടെ മകൻ എലീഫസ്; ഏശാവിന്റെ ഭാര്യയായ ബാസ്മത്തിന്റെ മകൻ രെയൂവേൽ.'
  to: 'ഏശാവിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: എലീഫസ്, ഏശാവിന്റെ ഭാര്യയായ ആദായുടെ മകൻ; രെയൂവേൽ, ഏശാവിന്റെ ഭാര്യയായ ബാസ്മത്തിന്റെ മകൻ.'
