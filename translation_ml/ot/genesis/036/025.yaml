id: GEN.36.25
reference: Genesis 36:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה בְנֵֽי עֲנָ֖ה דִּשֹׁ֑ן וְ/אָהֳלִיבָמָ֖ה בַּת עֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: ml
  text: 'അനയുടെ പുത്രന്മാർ ഇവരാണ്: ദീശോനും അനയുടെ മകളായ ഒഹൊലീബാമയും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: പദത്തിന്റെ സാധാരണ പുരുഷലിംഗ അർഥം നിലനിർത്തുന്നു; പിന്നാലെ ഒരു മകളുടെ പേര് വരുന്നതുകൊണ്ടുള്ള മൂലപാഠത്തിലെ ശ്രദ്ധേയമായ അസമത്വം ‘മക്കൾ’ എന്നു മാറ്റി മായ്ച്ചുകളയുന്നില്ല.
- source_word: דִּשֹׁן
  choice: ദീശോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം സ്വാഭാവികമായ മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി പകർത്തുന്നു.
- source_word: בַּת
  choice: മകൾ
  rationale: സ്ത്രീസന്തതിയെ വ്യക്തമാക്കുന്ന ഹീബ്രു ബന്ധപദത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions:
- issue: ‘പുത്രന്മാർ’ എന്നതിന് പിന്നാലെ ഒഹൊലീബാമയെ ‘മകൾ’ എന്നു വിളിക്കുന്ന പാഠത്തിലെ അസമത്വം
  choice: അസമത്വം അതേപടി നിലനിർത്തി
  alternative: ‘മക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി ലിംഗപരമായ അസമത്വം നീക്കുക
  rationale: വംശാവലിയുടെ മൂലപാഠത്തിലുള്ള ഭാഷാപരമായ പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന വിധം ക്രമീകരിച്ചെങ്കിലും വംശാവലിപദത്തിന്റെ പുരുഷലിംഗരൂപം നിലനിർത്തി.
