  text: אֵ֤לֶּה בְנֵֽי שֵׂעִיר֙ הַ/חֹרִ֔י יֹשְׁבֵ֖י הָ/אָ֑רֶץ לוֹטָ֥ן וְ/שׁוֹבָ֖ל וְ/צִבְע֥וֹן וַ/עֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: ml
  text: 'ഹോര്യനായ സേയീരിന്റെ ദേശനിവാസികളായ[a] പുത്രന്മാർ ഇവരാണ്: ലോത്താൻ, ശോബാൽ, സിബെയോൻ, അനാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശത്ത് വസിക്കുന്നവർ.”
    reason: יֹשְׁבֵי הָאָרֶץ എന്ന പ്രയോഗത്തിന്റെ പദാനുസൃതമായ മറ്റൊരു മലയാളരൂപം; ആങ്കർ അതേ പ്രയോഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
lexical_decisions:
- source_word: אֵלֶּה בְנֵי
  choice: പുത്രന്മാർ ഇവരാണ്
  rationale: വംശാവലിപ്പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളരൂപം.
- source_word: שֵׂעִיר הַחֹרִי
  choice: ഹോര്യനായ സേയീർ
  rationale: שֵׂעִיר വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; הַחֹרִי സേയീരിന്റെ വംശീയ തിരിച്ചറിയലായി വിശേഷണരൂപത്തിൽ നിലനിർത്തി.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശത്തു വസിച്ചിരുന്ന
  rationale: ബഹുവചന കർത്തൃവാചകപ്രയോഗം ആ ദേശത്തിലെ സ്ഥിരവാസത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കാൻ ബന്ധവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה
  choice: ലോത്താൻ, ശോബാൽ, സിബെയോൻ, അനാ
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
