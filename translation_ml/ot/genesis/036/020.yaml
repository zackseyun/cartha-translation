  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘ദേശത്തു വസിച്ചിരുന്ന’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ബഹുവചനത്തെ പേരുകളുടെ പട്ടികയുമായി ബന്ധിപ്പിക്കുന്നു; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
