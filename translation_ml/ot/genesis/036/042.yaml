  - marker: a
    text: ‘തലവൻ’ വരുന്ന ഓരോ ഇടത്തും ‘കുലത്തലവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: തലവൻ
  rationale: ഉല്പത്തി 36-ലെ എദോമ്യ ഗോത്ര/കുലനേതാവിനെ സൂചിപ്പിക്കുന്ന പദം. ‘തലവൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പട്ടികയുടെ ആവർത്തനഘടനയ്ക്ക് യോജിച്ചതുമാണ്; ‘കുലത്തലവൻ’ എന്നത് സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കുന്ന സാധ്യതയായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: קְנַז
  choice: കെനസ്
  rationale: വ്യക്തിയുടെയോ കുലത്തിന്റെയോ പേരായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: תֵּימָן
  choice: തേമാൻ
  rationale: മൂലധാതുവിന് ‘തെക്ക്’ എന്ന ആശയബന്ധമുണ്ടെങ്കിലും ഇവിടെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִבְצָר
  choice: മിബ്സാർ
  rationale: പേരായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മസൊററ്റിക് സ്വരീകരണവും മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണവും അനുസരിച്ച് നൽകി.
theological_decisions: []
