    issue: Succession phrase is slightly less idiomatic.
    rationale: ‘അവനു പകരം’ can be understood as ‘in exchange for him’; ‘അവന്റെ സ്ഥാനത്ത്’ directly reflects תחתיו in this regnal context.
  - severity: low
    issue: The lexical alternative for מִמַּשְׂרֵקָה is not retained.
    rationale: Although ‘മസ്രേക്കയിൽനിന്നുള്ള’ is an appropriate main-text rendering, מן can also mark association, ‘of Masrekah.’ A footnote anchored to the place phrase preserves this ambiguity; the English audit note’s attachment to ‘died’ is not an appropriate anchor.
