source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: ml
  text: ഹദദ് മരിച്ചു; അവന്റെ സ്ഥാനത്ത് മസ്രേക്കയിൽനിന്നുള്ള[a] സംലാ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മസ്രേക്കായിലെ.” ഹീബ്രു ഉപസർഗത്തിന് ഒരു സ്ഥലത്തുനിന്നുള്ള ഉത്ഭവമോ ആ സ്ഥലവുമായുള്ള ബന്ധമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ വയിഖ്തോൽ രൂപം സംഭവക്രമത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; രാജവംശാവലി സന്ദർഭത്തിൽ ‘മരിച്ചു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: הֲדָד
  choice: ഹദദ്
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: מלך ഇവിടെ രാജാധികാരത്തിലേക്കുള്ള പിൻതുടർച്ചയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാജാവായി’ എന്നത് ഈ രാജപ്പട്ടികാ സൂത്രവാക്യത്തിന് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: תחתיו മുൻരാജാവിന്റെ സ്ഥാനത്ത് വന്ന പിൻഗാമിയെ സൂചിപ്പിക്കുന്നു; വെറും കാലക്രമം പറയുന്ന ‘അവന്റെ ശേഷം’ എന്നതിനെക്കാൾ പകരംവരുന്ന അർഥം ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: שַׂמְלָה
  choice: സംലാ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപമായ שַׂמְלָה അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
- source_word: מִמַּשְׂרֵקָה
  choice: മസ്രേക്കയിൽനിന്നുള്ള
  rationale: מן എന്ന ഉപസർഗം ഇവിടെ സ്ഥലമൂലമോ സ്ഥലബന്ധമോ സൂചിപ്പിക്കുന്നു; പ്രധാന പാഠത്തിൽ ഉത്ഭവസ്ഥലം എന്ന സ്വാഭാവിക വായന സ്വീകരിച്ചു.
