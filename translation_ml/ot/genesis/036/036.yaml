translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും രാജപ്പട്ടികയുടെ സംക്ഷിപ്ത ശൈലിക്ക് യോജിച്ചതുമായ ഗൗരവമുള്ള ഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ מִן നേരിട്ട് പാഠത്തിൽ ‘യിൽനിന്നുള്ള’ എന്നു നൽകിയതിനാൽ ഇംഗ്ലീഷ് consultation layer-ലുള്ള വിയോജകക്കുറിപ്പ് ഇവിടെ ആവശ്യമില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് തെറ്റായി ‘Hadad died’ എന്ന ഭാഗത്തോട് ചേർന്നതായി തോന്നുന്നു.
