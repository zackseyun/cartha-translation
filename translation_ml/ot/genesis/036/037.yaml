translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അർഥവും പിൻഗാമിത്വസൂത്രവും നിലനിർത്തി.
