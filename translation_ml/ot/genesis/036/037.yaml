source:
  edition: WLC
  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: ml
  text: പിന്നെ സമ്ലാ മരിച്ചു; അവന്റെ സ്ഥാനത്ത് നദീതീരത്തുള്ള രെഹോബോത്തിൽനിന്നുള്ള ശൗൽ രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: പിന്നെ ... മരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: שַׂמְלָה
  choice: സമ്ലാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്തു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിൻഗാമിത്വസൂത്രത്തിൽ ക്രിയയ്ക്ക് രാജത്വം ഏറ്റെടുക്കുകയും ഭരിക്കുകയും ചെയ്യുന്ന അർഥമുണ്ട്; മലയാളത്തിൽ ‘രാജാവായി’ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: ഒരു ഭരണാധികാരിയുടെ സ്ഥാനത്ത് മറ്റൊരാൾ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന പിൻഗാമിത്വപ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: שָׁאוּל
  choice: ശൗൽ
  rationale: എബ്രായ שָׁאוּל എന്ന പേരിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מֵרְחֹבוֹת
  choice: രെഹോബോത്തിൽനിന്നുള്ള
  rationale: מִן ഉപസർഗം ഉത്ഭവസ്ഥലമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; രെഹോബോത്ത് ഇവിടെ സ്ഥലനാമമാണ്.
- source_word: הַנָּהָר
  choice: നദീതീരത്തെ
  rationale: നിശ്ചിതമായ ഒരു പ്രസിദ്ധ നദിയോടു ചേർന്ന രെഹോബോത്തിനെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
