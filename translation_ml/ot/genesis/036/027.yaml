  text: אֵ֖לֶּה בְּנֵי אֵ֑צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן וַ/עֲקָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/027.yaml
  text: 'These are the sons of Etser: Bilhan, Zaavan, and Akan.'
translation:
  language: ml
  text: 'ഏത്സെരിന്റെ പുത്രന്മാർ ഇവർ: ബിൽഹാൻ, സാവാൻ, അകാൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵצֶר
  choice: ഏസെർ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בִּלְהָן
  choice: ബിൽഹാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ അടുത്ത ശബ്ദരൂപം നിലനിർത്തി.
- source_word: זַעֲוָן
  choice: സാവാൻ
  rationale: എബ്രായ നാമത്തിലെ ആദ്യ വ്യഞ്ജനം മലയാളത്തിൽ 'സ'യായി, സ്വരക്രമം വായനാസൗകര്യത്തോടെ ലിപ്യന്തരിച്ചു.
- source_word: עֲקָן
  choice: അകാൻ
  rationale: ആദ്യ ആയിൻ പ്രത്യേകമായി അടയാളപ്പെടുത്താതെ, ആധുനിക മലയാള വായനയ്ക്ക് യോജിച്ച ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലി സന്ദർഭത്തിൽ പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ പദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലി പട്ടികയുടെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ 'Etser' എന്ന രൂപത്തെ നേരിട്ട് പകർത്താതെ WLC എബ്രായരൂപം അടിസ്ഥാനമാക്കി 'ഏസെർ' സ്വീകരിച്ചു.
