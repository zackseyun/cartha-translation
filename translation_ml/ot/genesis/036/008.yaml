id: GEN.36.8
reference: Genesis 36:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: ml
  text: അങ്ങനെ ഏശാവ് സേയീർ മലമ്പ്രദേശത്ത്[a] താമസമുറപ്പിച്ചു; ഏശാവാണ് ഏദോം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സേയീർ മലകളിൽ താമസിച്ചു’ അല്ലെങ്കിൽ ‘സേയീർ മലയിൽ പാർത്തു.’
    reason: הַר എന്ന പദം മലമ്പ്രദേശത്തെയോ മലകളെയോ ഒറ്റ മലയെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ ഭൂമിശാസ്ത്രപരമായ മറ്റു സാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസമാക്കി
  rationale: ישׁב എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം ഒരു പ്രദേശത്ത് വാസമുറപ്പിക്കുക എന്നതാണ്. കഥനത്തിന്റെ തുടർച്ചയും സ്ഥിരതാമസത്തിന്റെ ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇത് നൽകുന്നു.
- source_word: בְּהַר
  choice: മലനാട്ടിൽ
  rationale: הַר എന്നത് ഒറ്റ മലയെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. സേയീർ ഇവിടെ ഒരു പ്രദേശമായതിനാൽ ‘മലനാട്’ ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഒറ്റ കൊടുമുടി മാത്രമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: שֵׂעִיר
  choice: സേയീർ
  rationale: സ്ഥലനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: വ്യക്തിനാമം; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപം നിലനിർത്തുന്നു.
- source_word: הוּא אֱדוֹם
  choice: ഏശാവുതന്നെയാണ് ഏദോം
  rationale: ക്രിയയില്ലാത്ത എബ്രായ തിരിച്ചറിയൽവാക്യത്തിന്റെ നേരിട്ടുള്ള ഊന്നൽ നിലനിർത്തുന്നു. ‘അതായത്’ എന്ന വിശദീകരണപരമായ പദം ചേർക്കാതെ ഏശാവിനെയും ഏദോമിനെയും തിരിച്ചറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. കഥനശൈലിക്ക് ‘അങ്ങനെ’ എന്നും സ്ഥിരവാസത്തിന്റെ ഭാവത്തിന് ‘താമസമാക്കി’ എന്നും ഉപയോഗിച്ചു; സ്ഥലനാമങ്ങളിലും വ്യക്തിനാമങ്ങളിലും പരിചിതമായ മലയാളരൂപങ്ങൾ പാലിച്ചു.
