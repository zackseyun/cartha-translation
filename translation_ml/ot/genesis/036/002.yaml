id: GEN.36.2
reference: Genesis 36:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: ml
  text: 'ഏശാവ് കനാന്റെ പുത്രിമാരിൽനിന്ന് ഭാര്യമാരായി എടുത്തു: ഹിത്യനായ ഏലോന്റെ മകൾ ആദാ, ഹിവ്യനായ[a] സിബെയോന്റെ മകൾ അനായുടെ മകൾ ഒഹൊലീബാമാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “ഹിവ്യനായ.” ബന്ധപ്പെട്ട വംശാവലികളുമായി ഒത്തുചേർക്കുന്ന ചില വ്യാഖ്യാതാക്കൾ ഈ വംശബന്ധം വ്യത്യസ്തമായി മനസ്സിലാക്കുന്നു; “ഹോര്യനായ” എന്നതും അതിൽ ഉൾപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: സ്വീകരിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുത്തു/സ്വീകരിച്ചു’ എന്നത് നിലനിർത്തിക്കൊണ്ട്, ഭാര്യമാരെക്കുറിച്ചുള്ള ഈ വംശാവലിസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം നൽകുന്നു; ‘വിവാഹം കഴിച്ചു’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: נָשָׁיו
  choice: ഭാര്യമാരെ
  rationale: സന്ദർഭത്തിൽ ഇത് ‘സ്ത്രീകൾ’ എന്ന പൊതുവായ അർഥത്തിലല്ല, ഏശാവിന്റെ ഭാര്യമാരെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: കനാൻദേശത്തിലെ പുത്രിമാരിൽനിന്ന്
  rationale: ‘കനാന്റെ പുത്രിമാർ’ എന്ന എബ്രായ ശൈലിയുടെ ആശയം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ അത് ദേശത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּת
  choice: മകൾ
  rationale: പിതൃപുത്രിബന്ധം സൂചിപ്പിക്കുന്ന സംയുക്തരൂപം വംശാവലിയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: חִתִּי എന്ന ജനവിഭാഗനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ഏലോനെ വിശേഷിപ്പിക്കുന്ന വ്യാകരണബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַחִוִּי
  choice: ഹിവ്യനായ
  rationale: മസോരറ്റിക് പാഠത്തിലെ חִוִּי എന്ന വായന നേരിട്ട് പിന്തുടരുന്നു; ബന്ധപ്പെട്ട വംശാവലികളിൽ കാണുന്ന ‘ഹോര്യൻ’ എന്ന വ്യത്യസ്ത തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ വംശീയ തിരിച്ചറിയൽ
  choice: മസോരറ്റിക് പാഠം പിന്തുടർന്ന് ‘ഹിവ്യനായ’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുന്നു.
  alternative: ഉല്പത്തി 36:20 പോലുള്ള ബന്ധപ്പെട്ട വംശാവലികളുമായി ഒത്തുചേർക്കാൻ ചിലർ ‘ഹോര്യനായ’ എന്നു വായിക്കുകയോ വംശബന്ധം വേറിട്ടു മനസ്സിലാക്കുകയോ ചെയ്യുന്നു.
  rationale: ലഭ്യമായ എബ്രായ പാഠത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും വംശാവലികളിലെ യഥാർഥ പിരിമുറുക്കം നിശ്ശബ്ദമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിയുടെ ചുരുക്കസ്വഭാവം നിലനിർത്തുന്നു. ‘സ്വീകരിച്ചു’ എന്ന പ്രയോഗം എബ്രായ ക്രിയയോട് ചേർന്നുനിൽക്കുമ്പോഴും മലയാളത്തിൽ വിവാഹബന്ധത്തിന്റെ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
