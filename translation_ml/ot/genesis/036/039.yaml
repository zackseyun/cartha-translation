  source_fidelity: ഹീബ്രു പാഠത്തിലെ മരണവും അധികാരപിന്തുടർച്ചയും നഗരനാമവും ഭാര്യയുടെയും മാതൃവംശത്തിന്റെയും വിവരവും വിശ്വസ്തമായി പകർന്നിരിക്കുന്നു. בַּת מַטְרֵד בַּת מֵי־זָהָב എന്ന ആവർത്തിത വംശാവലിപ്രയോഗം മെഹേതബേൽ മത്രേദിന്റെ മകളും മത്രേദ് മേ-സാഹാബിന്റെ മകളും ആണെന്ന രീതിയിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
  naturalness: വാക്യങ്ങൾ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും മാന്യവുമാണ്. «അവനു പകരം ... രാജാവായി» എന്ന പ്രയോഗം പിന്തുടർച്ചയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
  terminology: പേരുകളുടെ ലിപ്യന്തരണവും രാജത്വ-വംശാവലി പദപ്രയോഗങ്ങളും യോജിച്ചതാണ്. പാഠഭേദങ്ങളായ ഹദദ്, പായി എന്നിവ മുഖ്യപാഠത്തിലേക്ക് കലർത്താതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
