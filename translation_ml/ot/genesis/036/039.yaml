reference: Genesis 36:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: ml
  text: അഖ്ബോരിന്റെ മകനായ ബാൽ-ഹാനാൻ മരിച്ചു. അവനു പകരം ഹദർ[a] രാജാവായി. അവന്റെ പട്ടണത്തിന്റെ പേര് പാവു[b] എന്നായിരുന്നു. അവന്റെ ഭാര്യയുടെ പേര് മെഹേതബേൽ എന്നായിരുന്നു; അവൾ മേ-സാഹാബിന്റെ മകളായ മത്രേദിന്റെ മകളായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ‘ഹദർ’; ചില പാഠപാരമ്പര്യങ്ങളിലും 1 ദിനവൃത്താന്തം 1:50-ലും ‘ഹദദ്’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ഹീബ്രു പാഠത്തിൽ ‘പാവു’; 1 ദിനവൃത്താന്തം 1:50-ൽ ‘പായി’ എന്നാണ്.
    reason: textual_variant
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘മത്രേദിന്റെ മകൾ, മേ-സാഹാബിന്റെ മകൾ.’ രണ്ടാമത്തെ ‘മകൾ’ മത്രേദിനെ വിശേഷിപ്പിക്കുന്ന വംശാവലിപ്രയോഗമായാണ് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നത്.'
    reason: genealogical_syntax
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികവും അലങ്കാരരഹിതവുമായി നൽകുന്നു.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: അഖ്ബോരിന്റെ മകനായ ബാൽ-ഹാനാൻ
  rationale: വംശബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം ... രാജാവായി
  rationale: מלך എന്നതിന്റെ രാജത്വവും תחתיו എന്നതിന്റെ പിൻഗാമിത്വവും സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֲדַר
  choice: ഹദർ
  rationale: നൽകിയിരിക്കുന്ന മസോററ്റിക് പാഠത്തിലെ രൂപം പിന്തുടരുന്നു; ഹദദ് എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: അവന്റെ പട്ടണത്തിന്റെ പേര് പാവു എന്നായിരുന്നു
  rationale: ഹീബ്രു നാമകരണസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: അവന്റെ ഭാര്യയുടെ പേര് മെഹേതബേൽ എന്നായിരുന്നു
  rationale: മൂലത്തിലെ ആവർത്തിത നാമകരണസൂത്രം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: മേ-സാഹാബിന്റെ മകളായ മത്രേദിന്റെ മകൾ
  rationale: തുടർച്ചയായ വംശാവലിപ്രയോഗം മെഹേതബേൽ മത്രേദിന്റെ മകളും മത്രേദ് മേ-സാഹാബിന്റെ മകളും ആണെന്ന ബന്ധമായി മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ വംശാവലിവിവരണത്തിന് യോജിച്ച മാന്യമായ മലയാളം. പേരുകൾ മൂലഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; പാഠഭേദങ്ങൾ അടിക്കുറിപ്പുകളിൽ മാത്രം നൽകി.
