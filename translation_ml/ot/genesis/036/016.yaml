  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. പട്ടികയുടെ ആവർത്തനഘടനയും രണ്ട് സമാപനവാക്യങ്ങളുടെയും സമാന്തരതയും സംരക്ഷിച്ചു.
