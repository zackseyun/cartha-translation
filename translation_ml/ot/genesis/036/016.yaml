  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: ml
  text: കോരഹ് പ്രഭു, ഗാതാം പ്രഭു, അമാലേക്ക് പ്രഭു—ഇവർ എദോംദേശത്തിലെ എലീഫാസിന്റെ പ്രഭുക്കന്മാർ; ഇവർ ആദായുടെ പുത്രന്മാർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: പ്രഭു
  rationale: എദോമ്യ ഗോത്രസംഘടനയിലെ നേതാവിനെയോ കുലത്തലവനെയോ സൂചിപ്പിക്കുന്ന പദം; പേരുകൾക്കു മുമ്പിലെ ആവർത്തനവും നേതൃപദവിയും നിലനിർത്തുന്നു.
- source_word: גַּעְתָּם
  choice: ഗാത്താം
  rationale: മസോററ്റിക് പാഠത്തിലെ Gaʿtam എന്ന പേരിന്റെ മലയാള ലിപ്യന്തരണം; ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ ‘Gaatham’ എന്ന രൂപത്തോടും യോജിക്കുന്നു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിലെ നേരിട്ടുള്ള ‘sons’ എന്ന അർഥം നിലനിർത്തുന്നു; വിശാലമായ ‘സന്തതികൾ’ എന്ന വ്യാഖ്യാനം ഇവിടെ അനാവശ്യമാണ്.
theological_decisions: []
