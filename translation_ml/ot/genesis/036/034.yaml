  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ രാജവംശാവലി ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിച്ചു; ഉറവിടത്തിലെ യഥാർഥ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
