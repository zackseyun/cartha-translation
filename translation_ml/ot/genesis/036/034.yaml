  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חֻשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ml
  text: യോബാബ് മരിച്ചു; അവനു പകരം തേമാന്യരുടെ ദേശത്തുനിന്നുള്ള ഹൂശാം[a] രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തേമാൻ ദേശത്തുനിന്നുള്ള ഹൂശാം” എന്നും “തേമാന്യന്റെ ദേശത്തുനിന്നുള്ള ഹൂശാം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ ജനനാമരൂപം തേമാനുമായി ബന്ധപ്പെട്ട പ്രദേശത്തെയോ അവിടത്തെ ജനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ wayyiqtol രൂപം തുടർച്ചയായ ആഖ്യാനത്തിലെ ലളിതമായ ഭൂതകാലസംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മരിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יוֹבָב
  choice: യോബാബ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദസാദൃശ്യമുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഈ രാജവാഴ്ചാവിവരണസൂത്രത്തിൽ מלך അധികാരമേറ്റ് രാജാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: തൽസ്ഥാനത്തെ രാജാവിനെ തുടർന്നുള്ള സ്ഥാനാരോഹണം/പകരംവരവ് വ്യക്തമാക്കുകയും ഹീബ്രുവിലെ substitution അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: חֻשָׁם
  choice: ഹൂശാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֵאֶרֶץ
  choice: ദേശത്തുനിന്നുള്ള
  rationale: מן + אֶרֶץ ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നു; ഹൂശാമിനെ വിശേഷിപ്പിക്കുന്ന മലയാളപ്രയോഗമായി ഇത് സ്വാഭാവികമാണ്.
- source_word: הַתֵּימָנִי
  choice: തേമാന്യരുടെ
  rationale: ഈ gentilic രൂപം തേമാനുമായി ബന്ധപ്പെട്ട ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതായി പ്രധാന പാഠത്തിൽ എടുത്തിരിക്കുന്നു; എന്നാൽ സ്ഥലപ്പേരായോ ഏകവചന ജനനാമമായോ ഗ്രഹിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
