  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַלּ֥וּף דִּשֹׁ֛ן אַלּ֥וּף אֵ֖צֶר אַלּ֣וּף דִּישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י לְ/אַלֻּפֵי/הֶ֖ם בְּ/אֶ֥רֶץ שֵׂעִֽיר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: ml
  text: ഗോത്രത്തലവൻ ദീശോൻ, ഗോത്രത്തലവൻ ഏസെർ, ഗോത്രത്തലവൻ ദീശാൻ—ഇവർ സേയീർദേശത്തെ ഹോര്യരുടെ ഗോത്രവിഭാഗങ്ങൾപ്രകാരമുള്ള ഗോത്രത്തലവന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ തലവന്മാർപ്രകാരം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഗോത്രത്തലവന്മാരെയോ അവർ നയിച്ചിരുന്ന ഗോത്രവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: ഗോത്രത്തലവൻ
  rationale: ഉല്പത്തി 36-ലെ എദോമ്യ-ഹോര്യ പശ്ചാത്തലത്തിൽ ഒരു ഗോത്രത്തിന്റെയോ വംശവിഭാഗത്തിന്റെയോ നേതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമായ പദമാണിത്; എബ്രായ പട്ടികയുടെ ആവർത്തനഘടനയും നിലനിർത്തുന്നു.
- source_word: דִּשֹׁן
  choice: ദീശോൻ
  rationale: എബ്രായ ഉച്ചാരണത്തെ പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു; ദീശാൻ എന്ന വ്യത്യസ്ത പേരിൽനിന്ന് വേർതിരിച്ചു.
- source_word: אֵצֶר
  choice: ഏസെർ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: דִּישָׁן
  choice: ദീശാൻ
  rationale: എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; ദീശോൻ എന്ന പേരുമായുള്ള വ്യത്യാസം നിലനിർത്തി.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: ഹോര്യരുടെ ഗോത്രത്തലവന്മാർ
  rationale: הַחֹרִי ഇവിടെ ഹോര്യർ എന്ന ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; אַלּוּפֵי അവരുടെ ഗോത്രനേതാക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: לְאַלֻּפֵיהֶם
  choice: അവരുടെ ഗോത്രവിഭാഗങ്ങൾപ്രകാരം
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ വർഗീകരണമോ വിഭജനമോ സൂചിപ്പിക്കുന്നതായി എടുത്തു. אַלּוּף നേതാവിനെയും ആ നേതാവ് പ്രതിനിധാനം ചെയ്യുന്ന വിഭാഗത്തെയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ, പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിക്കുകയും കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: സേയീർദേശത്തെ
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിന്റെ അർഥം പൂർണമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകളുടെ പട്ടികയിലെ എബ്രായ ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്. അവസാനത്തെ സംഗ്രഹവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രമീകരിച്ചിട്ടുണ്ടെങ്കിലും മൂലത്തിലെ വർഗീകരണഭാവവും പദാർഥത്തിലെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചിട്ടുണ്ട്.
