id: GEN.36.21
reference: Genesis 36:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/דִשׁ֥וֹן וְ/אֵ֖צֶר וְ/דִישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י בְּנֵ֥י שֵׂעִ֖יר בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: ml
  text: ദീശോനും ഏസെരും ദീശാനും. ഇവരാണ് ഏദോംദേശത്തുള്ള സേയീരിന്റെ പുത്രന്മാരായ ഹോര്യരുടെ തലവന്മാർ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുലത്തലവന്മാർ’.
    reason: אַלּוּפִים എന്ന എബ്രായപദം പ്രമുഖ വ്യക്തികളെ മാത്രമല്ല, സാമൂഹിക-രാഷ്ട്രീയ കൂട്ടങ്ങളുടെ നേതാക്കളെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: ദീശോൻ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; דִישָׁן എന്ന പേരിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: אֵצֶר
  choice: ഏസെർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ഉച്ചാരണരീതിക്കനുസരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: דִישָׁן
  choice: ദീശാൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; ദീശോൻ എന്ന മുൻപത്തെ പേരിൽനിന്നുള്ള സ്വരവ്യത്യാസം സംരക്ഷിച്ചു.
- source_word: אַלּוּפֵי
  choice: തലവന്മാർ
  rationale: ഏദോമ്യ-ഹോര്യ സാമൂഹിക ഘടനയിലെ അധികാരസ്ഥാനമുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം; കാലഹരണപ്പെട്ട രാജകീയ സ്ഥാനപ്പേരുകൾ ഒഴിവാക്കുന്നു.
- source_word: הַחֹרִי
  choice: ഹോര്യരുടെ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ഇവിടെ ജനവിഭാഗത്തെ സമാഹാരമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചന ജനനാമമായി നൽകി.
- source_word: בְּנֵי שֵׂעִיר
  choice: സേയീരിന്റെ പുത്രന്മാരായ
  rationale: വംശാവലിയുടെ ഔപചാരികമായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തി; ‘സന്തതികൾ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ഏദോംദേശത്തുള്ള
  rationale: ‘ഏദോം ദേശത്തിൽ’ എന്ന ഭൂമിശാസ്ത്രപരമായ പൂർണ ആശയം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രു പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ പേരുകളിൽ ‘-ഉം’ ചേർത്തു; തിരിച്ചറിയൽവാക്യത്തിലെ വംശപരവും ഭൂമിശാസ്ത്രപരവുമായ ഘടകങ്ങൾ നിലനിർത്തി.
