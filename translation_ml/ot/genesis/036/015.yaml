id: GEN.36.15
reference: Genesis 36:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ പുത്രന്മാരുടെ ഗോത്രത്തലവന്മാർ ഇവരാണ്: ഏശാവിന്റെ ആദ്യജാതനായ എലീഫസിന്റെ പുത്രന്മാർ: ഗോത്രത്തലവൻ തേമാൻ, ഗോത്രത്തലവൻ ഓമാർ, ഗോത്രത്തലവൻ സെഫോ, ഗോത്രത്തലവൻ കെനസ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: ഗോത്രത്തലവന്മാർ / ഗോത്രത്തലവൻ
  rationale: എദോമ്യ വംശാവലിപ്പട്ടികയിൽ ഈ പദം ഒരു ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. വെറും ‘തലവൻ’ എന്നതിനെക്കാൾ പശ്ചാത്തലം വ്യക്തമാക്കുകയും പദത്തെ ‘ഗോത്രങ്ങൾ’ എന്നു മാറ്റി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ / പുത്രന്മാരിൽ
  rationale: വംശാവലിയുടെ ഈ അടുത്ത സന്ദർഭത്തിൽ ആൺമക്കളെയാണ് പേരെടുത്ത് പറയുന്നത്; അതിനാൽ അക്ഷരാർഥത്തോടടുത്ത ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു. പട്ടിക സ്വാഭാവികമായി വായിക്കാൻ രണ്ടാം പ്രയോഗം ‘പുത്രന്മാരിൽ’ എന്നു നൽകി.
- source_word: בְּכוֹר
  choice: ആദ്യജാതൻ
  rationale: ജനനക്രമവും അതിനോടു ബന്ധപ്പെട്ടേക്കാവുന്ന സ്ഥാനവും അധികവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്ന പതിവായ ബൈബിൾപദം.
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ പരിചയവാക്യത്തിന് സ്വാഭാവികമായ മലയാള രൂപം.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֱלִיפַז
  choice: എലീഫസ്
  rationale: മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ നാമരൂപം.
- source_word: תֵּימָן
  choice: തേമാൻ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപവും മലയാളത്തിലെ പരിചിതരൂപവും പിന്തുടരുന്നു.
- source_word: אוֹמָר
  choice: ഓമാർ
  rationale: എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: צְפוֹ
  choice: സെഫോ
  rationale: എബ്രായ വ്യഞ്ജനരൂപത്തോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം.
- source_word: קְנַז
  choice: കെനസ്
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ പട്ടികാസ്വഭാവവും പദവിപോലെ ആവർത്തിക്കുന്ന אַלּוּף എന്ന പദവും നിലനിർത്തി. ആദ്യത്തെ പൊതുതലക്കെട്ടിനെയും എലീഫസിന്റെ പുത്രന്മാരുടെ ഉപപട്ടികയെയും കോളൺ ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു.
