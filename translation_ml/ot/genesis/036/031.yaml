  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെമേൽ ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ് എദോംദേശത്ത് വാണ രാജാക്കന്മാർ ഇവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കൾക്കുവേണ്ടി ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്.” എബ്രായത്തിൽ “ഇസ്രായേൽമക്കൾക്കായി” എന്നാണ്; സന്ദർഭത്തിൽ ഇത് അവരുടെമേലുള്ള രാജഭരണത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: പുതിയ പട്ടിക അവതരിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ സംയോജകമായ ‘וְ’ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: വാണ രാജാക്കന്മാർ
  rationale: מלך എന്ന ക്രിയയുടെ രാജാധികാരം പ്രയോഗിക്കുക എന്ന അർഥം ‘വാണ’ എന്ന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: എദോംദേശത്ത്
  rationale: ‘എദോമിന്റെ ദേശം’ എന്ന പ്രദേശസൂചന മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പ്
  rationale: ഇവിടെ വ്യക്തമായ കാലസൂചനയാണ്.
- source_word: מְלָךְ מֶלֶךְ
  choice: ഒരു രാജാവ് വാഴുന്നതിനുമുമ്പ്
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘ഒരു രാജാവ്’ നേരിട്ട് നിലനിർത്തി; ‘ഏതെങ്കിലും രാജാവ്’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെമേൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സ്രോതസ്സുരൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുകയും രാജഭരണബന്ധം വ്യക്തമാക്കാൻ ‘മേൽ’ ഉപയോഗിക്കുകയും ചെയ്തു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ജനസമൂഹനാമമാണെങ്കിലും, മൂലത്തിലെ കുടുംബബന്ധരൂപം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ സംരക്ഷിച്ചു.
- issue: לִ എന്ന ഉപസർഗത്തിന്റെ ഭരണബന്ധം
  choice: മേൽ
  alternative: വേണ്ടി
  rationale: രാജാവ് ജനത്തിനുവേണ്ടിയോ അവരുടെമേലോ വാണു എന്ന വ്യാകരണസാധ്യതയിൽ, സന്ദർഭം ഭരണാധികാരബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘മേൽ’ സ്വീകരിച്ചു; യഥാർഥ ഭാഷാപരമായ പര്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘വാണ’ എന്ന രൂപം രാജഭരണത്തിന് സ്വാഭാവികമാണ്; ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ ജനസമൂഹപ്രയോഗം സംരക്ഷിക്കുന്നു.
