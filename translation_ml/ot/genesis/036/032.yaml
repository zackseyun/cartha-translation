source:
  edition: WLC
  text: וַ/יִּמְלֹ֣ךְ בֶּ/אֱד֔וֹם בֶּ֖לַע בֶּן בְּע֑וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: ml
  text: ബെയോരിന്റെ മകനായ ബേല ഏദോമിൽ[a] രാജാവായി; അവന്റെ പട്ടണത്തിന്റെ പേര് ദിൻഹാബാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏദോമിന്മേൽ.’ ഹീബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഏദോമിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇത് രാജാവിന്റെ ഭരണപരിധിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: מלך എന്ന ക്രിയയുടെ ഈ രാജപ്പട്ടികാസന്ദർഭത്തിലെ രൂപം രാജസ്ഥാനാരോഹണം സൂചിപ്പിക്കുന്നു; ചുറ്റുമുള്ള വാക്യങ്ങളിലെ രാജാവകാശക്രമസൂത്രത്തിനും ‘രാജാവായി’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בֶּאֱדוֹם
  choice: ഏദോമിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള സ്ഥലാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഭരണപരിധി ഉദ്ദേശിക്കാമെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: בֶּלַע
  choice: ബേല
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן בְּעוֹר
  choice: ബെയോരിന്റെ മകനായ
  rationale: ഹീബ്രായ വംശബന്ധനിർമ്മിതി വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עִירוֹ
  choice: അവന്റെ പട്ടണം
  rationale: ഹീബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: דִּנְהָבָה
  choice: ദിൻഹാബാ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രായ ഉച്ചാരണത്തിന് സമീപമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ രാജപ്പട്ടികാശൈലി. മൂലത്തിലെ സ്ഥലാർഥമുള്ള ഉപസർഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ഭരണപരിധിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
