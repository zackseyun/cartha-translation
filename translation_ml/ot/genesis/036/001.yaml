id: GEN.36.1
reference: Genesis 36:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: ml
  text: ഏശാവിന്റെ തലമുറകൾ ഇവയാണ്; അവൻ ഏദോമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഏശാവിന്റെ തലമുറകൾ ഇവയാണ് (അതായത്, ഏദോം).”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവയാണ്
  rationale: വാക്യാരംഭത്തിലെ וְ ഒരു പുതിയ വിഭാഗത്തിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അധികമായ കാലസൂചന ചേർക്കാതെ സ്വാഭാവികമായ തലക്കെട്ടുരൂപമായി ‘ഇവയാണ്’ നൽകി.
- source_word: תֹּלְדֹוֹת
  choice: തലമുറകൾ
  rationale: ഉല്പത്തിപുസ്തകത്തിൽ ആവർത്തിക്കുന്ന ഘടനാപരമായ മുഖ്യപദത്തിന്റെ ഔപചാരിക ബന്ധം നിലനിർത്തുന്നു; ‘വിവരണം’ അല്ലെങ്കിൽ ‘സന്തതികൾ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: הוּא
  choice: അതായത്
  rationale: ഏശാവിനെ ഏദോം എന്നു തിരിച്ചറിയിക്കുന്ന വ്യാഖ്യാനാത്മക സമാനാധികരണമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; ‘അവൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: വ്യക്തിയെയും അവനുമായി ബന്ധപ്പെട്ട പേരിനെയും തിരിച്ചറിയിക്കുന്ന സംജ്ഞാനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ഉല്പത്തിപുസ്തകത്തിലെ തലക്കെട്ടുപദമായ תֹּלְדֹוֹת-ന്റെ പരിഭാഷ
  choice: തലമുറകൾ
  alternative: വിവരണം; സന്തതികൾ
  rationale: ഇത് പ്രധാനമായും സാഹിത്യഘടനാപരമായ തീരുമാനമാണ്. ആവർത്തിക്കുന്ന സൂത്രവാക്യത്തിന്റെ ബന്ധം നിലനിർത്തുകയും അർഥത്തെ വിവരണത്തിലേക്കോ ജൈവസന്തതികളിലേക്കോ മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: הוּא אֱדוֹם എന്ന തിരിച്ചറിയിക്കൽ
  choice: (അതായത്, ഏദോം)
  alternative: അവൻ ഏദോം ആണ്
  rationale: മൂലത്തിലെ സമാനാധികരണ/തിരിച്ചറിയിക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥമായ വാക്യഘടന അടിക്കുറിപ്പിൽ നൽകിയതിനാൽ യഥാർഥ വ്യാകരണസാധ്യത മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഉല്പത്തിപുസ്തകത്തിലെ ആവർത്തിത ഘടനാപദം തിരിച്ചറിയാവുന്നവിധം ഔപചാരികത നിലനിർത്തി; പ്രധാനവാക്യത്തിൽ സ്വാഭാവികമായ സമാനാധികരണവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥസാധ്യതയും നൽകി.
