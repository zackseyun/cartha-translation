id: GEN.36.7
reference: Genesis 36:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי הָיָ֧ה רְכוּשָׁ֛/ם רָ֖ב מִ/שֶּׁ֣בֶת יַחְדָּ֑ו וְ/לֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ לָ/שֵׂ֣את אֹתָ֔/ם מִ/פְּנֵ֖י מִקְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: ml
  text: അവരുടെ സമ്പത്ത് അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ കഴിയാത്തത്ര കൂടുതലായിരുന്നു; അവർ പരദേശവാസികളായി പാർത്തിരുന്ന ദേശത്തിന്[a] അവരുടെ കന്നുകാലികൾ നിമിത്തം അവരെ താങ്ങാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ പരദേശവാസത്തിന്റെ ദേശം.’ എബ്രായപ്രയോഗം അവർ അന്യദേശവാസികളായി താൽക്കാലികമായി പാർത്തിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന വാക്യബന്ധം (മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി പ്രത്യക്ഷ ബന്ധകമില്ലാതെ)
  rationale: മുൻവാക്യത്തിലെ വേർപിരിയലിന്റെ കാരണം ഈ വാക്യം വിശദീകരിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ആ വിശദീകരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רְכוּשָׁם
  choice: അവരുടെ സമ്പത്ത്
  rationale: ചലസ്വത്തും സമാഹരിച്ച വസ്തുവകകളും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം ഇവിടെ ‘സമ്പത്ത്’ സ്വാഭാവികമായി നൽകുന്നു; കന്നുകാലികളെ പിന്നീടുള്ള ഉപവാക്യം പ്രത്യേകം പരാമർശിക്കുന്നു.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: ഒരുമിച്ചു പാർക്കാൻ കഴിയാത്തവിധം വളരെ കൂടുതലായിരുന്നു
  rationale: מן സഹിതമുള്ള ക്രിയാനാമരൂപം സമ്പത്തിന്റെ ആധിക്യം ഒരുമിച്ചുള്ള താമസം അസാധ്യമാക്കിയെന്ന ഫലം സൂചിപ്പിക്കുന്നു. ‘പാർക്കുക’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: അവരുടെ പരദേശവാസത്തിന്റെ ദേശം
  rationale: מְגוּרִים എന്നത് താൽക്കാലികമായി അന്യദേശവാസികളായി പാർക്കുന്ന ആശയം വഹിക്കുന്നു; ‘പരദേശവാസം’ ആ പിതൃപുരുഷകഥയിലെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: לָשֵׂאת אֹתָם
  choice: അവരെ താങ്ങാൻ
  rationale: נשא എന്നതിന്റെ അടിസ്ഥാനമായ ‘വഹിക്കുക/താങ്ങുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് ദേശത്തിന്റെ വഹനശേഷി എന്ന സന്ദർഭാർത്ഥവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികൾ നിമിത്തം
  rationale: מִפְּנֵי ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; מִקְנֶה വിവിധ വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്നതിനാൽ ‘കന്നുകാലികൾ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘പരദേശവാസം’ എന്ന അല്പം ഔപചാരികമായ പദം മൂലഭാഷയിലെ താൽക്കാലിക അന്യദേശതാമസത്തിന്റെ ആശയം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; അതിന്റെ ലളിതമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
