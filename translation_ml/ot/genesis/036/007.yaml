    rationale: The Hebrew means the land where they were sojourning, not necessarily a land characterized as ‘exile.’ An explicit relative phrase expresses the intended relationship clearly without reducing the temporary/alien-residence nuance.
  revised_text: അവരുടെ സമ്പത്ത് അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ കഴിയാത്തത്ര കൂടുതലായിരുന്നു; അവർ പരദേശവാസികളായി പാർത്തിരുന്ന ദേശത്തിന്[a] അവരുടെ കന്നുകാലികൾ നിമിത്തം അവരെ താങ്ങാൻ കഴിഞ്ഞില്ല.
