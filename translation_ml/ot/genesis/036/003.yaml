translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ, ബന്ധസൂചക വിശേഷണങ്ങൾക്കുശേഷം പേര് നൽകി അവസാനം ‘-നെയും’ ചേർത്തിരിക്കുന്നു.
