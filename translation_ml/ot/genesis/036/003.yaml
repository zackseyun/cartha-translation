  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: ml
  text: ഇശ്മായേലിന്റെ മകളും നെബായോത്തിന്റെ[a] സഹോദരിയുമായ ബാസെമത്തിനെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'നെബായോത്ത്: ‘നെബാജോത്ത്’ എന്ന രൂപം ചില ഇംഗ്ലീഷ് പരിഭാഷകളിൽ പരമ്പരാഗതമായി കാണപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: -നെയും
  rationale: പട്ടികയിലെ മറ്റൊരു കർമത്തെ കൂട്ടിച്ചേർക്കുന്ന וְ എന്നതും വിവർത്തനം ചെയ്യാത്ത നേരിട്ടുള്ള കർമചിഹ്നമായ אֶת എന്നതും മലയാളത്തിലെ കർമവിഭക്തിയോടുകൂടിയ ‘-നെയും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בָּשְׂמַת
  choice: ബാസെമത്ത്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; വിഭക്തി ചേർന്ന വാക്യരൂപം ‘ബാസെമത്തിനെയും’.
- source_word: בַּת
  choice: മകൾ
  rationale: ഇശ്മായേലുമായുള്ള മാതാപിതൃബന്ധം സൂചിപ്പിക്കുന്ന construct നാമം; മലയാളത്തിൽ ‘ഇശ്മായേലിന്റെ മകൾ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: יִשְׁמָעֵאל
  choice: ഇശ്മായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടത്തോട് ചേർന്നതുമായ ലിപ്യന്തരണം.
- source_word: אֲחוֹת
  choice: സഹോദരി
  rationale: നെബായോത്തുമായുള്ള സഹോദരബന്ധം സൂചിപ്പിക്കുന്ന construct നാമം; ലിംഗം വ്യക്തമാക്കുന്ന ‘സഹോദരി’ ഉപയോഗിച്ചു.
- source_word: נְבָיוֹת
  choice: നെബായോത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിലെ ചില പാരമ്പര്യങ്ങളിൽ കാണുന്ന ‘നെബായോത്ത്/നെബായോത്’ വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
