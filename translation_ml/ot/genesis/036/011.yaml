  text: וַ/יִּהְי֖וּ בְּנֵ֣י אֱלִיפָ֑ז תֵּימָ֣ן אוֹמָ֔ר צְפ֥וֹ וְ/גַעְתָּ֖ם וּ/קְנַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: ml
  text: എലീഫാസിന്റെ പുത്രന്മാർ തേമാൻ, ഓമാർ, സെഫോ[a], ഗതാം, കെനസ് എന്നിവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിൽ ഈ പേര് ‘സെപ്പോ’ എന്ന വ്യത്യസ്ത രൂപത്തിൽ കാണുന്നു. ഇവിടെയുള്ള മസോരറ്റിക് എബ്രായ പാഠത്തിന്റെ സ്വരചിഹ്നങ്ങൾ ‘സെഫോ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയിൽ היה എന്ന ക്രിയ ഇവിടെ വ്യക്തികളെ പരിചയപ്പെടുത്തുന്ന ലളിതമായ സംയോജകപ്രയോഗമാണ്; ‘ആയിത്തീർന്നു’ എന്നത് ഇല്ലാത്ത വികാസാർഥം നൽകും.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: എബ്രായപദം പുരുഷലിംഗ ബഹുവചനത്തിൽ ‘പുത്രന്മാർ’ എന്ന് വ്യക്തമായി പറയുന്നു; അതിനാൽ ‘മക്കൾ’ എന്ന് ലിംഗനിരപേക്ഷമാക്കുന്നില്ല.
- source_word: אֱלִיפָז
  choice: എലീഫാസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണത്തിന് അടുത്തായി നൽകിയിരിക്കുന്നു.
- source_word: תֵּימָן
  choice: തേമാൻ
  rationale: ഈ വംശാവലിസന്ദർഭത്തിൽ വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: אוֹמָר
  choice: ഓമാർ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തിന് അനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: צְפוֹ
  choice: സെഫോ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ രൂപം ṣəfō ആയതിനാൽ ‘സെഫോ’ എന്നു ലിപ്യന്തരിച്ചു; ചില പാരമ്പര്യങ്ങളിൽ കാണുന്ന വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: גַעְתָּם
  choice: ഗാത്താം
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: קְנַז
  choice: കെനസ്
  rationale: വ്യക്തിനാമം സ്വാഭാവികമായ മലയാള ലിപ്യന്തരണത്തിൽ നൽകി; അവസാനത്തെ ז ന്റെ ശബ്ദം ‘സ്’ കൊണ്ട് പ്രതിനിധീകരിച്ചു.
