base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: ml
  text: ഗോത്രത്തലവൻ ഒഹൊലീബാമാ[a], ഗോത്രത്തലവൻ ഏലാ, ഗോത്രത്തലവൻ പീനോൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കുലത്തലവൻ’; אַלּוּף എന്ന എബ്രായപദം എദോമ്യ ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: ഗോത്രത്തലവൻ
  rationale: ഉല്പത്തി 36-ലെ എദോമ്യ പട്ടികയിൽ ഈ പദം ഒരു ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ തലവനെ സൂചിപ്പിക്കുന്നു. വെറും ‘തലവൻ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമാക്കുകയും പട്ടികയുടെ ആവർത്തനശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമാ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֵלָה
  choice: ഏലാ
  rationale: ഇവിടെ വിവരണപദമല്ല, പേരായതിനാൽ എബ്രായത്തിൽനിന്ന് നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: פִּינֹן
  choice: പീനോൻ
  rationale: എബ്രായ പേരിന്റെ സ്വരഘടന പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പട്ടികാശൈലി. എബ്രായമൂലത്തിലെ ‘אַלּוּף’ എന്ന പദത്തിന്റെ മൂന്നുതവണത്തെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തിയിരിക്കുന്നു; പേരുകൾ മൂലഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
