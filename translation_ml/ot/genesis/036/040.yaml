translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. ‘ഗോത്രത്തലവൻ’ എന്ന രൂപം ചരിത്രപരമായ സാമൂഹിക പദവിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] ഏശാവിനോടു ചേർന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം തിമ്നാ എന്ന പേരിനെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അടയാളം തിമ്നായോടു ചേർത്തു.
