id: GEN.36.40
reference: Genesis 36:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ ഗോത്രത്തലവന്മാരുടെ പേരുകൾ ഇവയാണ്—അവരുടെ കുലങ്ങൾക്കനുസരിച്ചും സ്ഥലങ്ങൾക്കനുസരിച്ചും, പേരുപേരായും: ഗോത്രത്തലവൻ തിമ്നാ[a], ഗോത്രത്തലവൻ അൽവാ[b], ഗോത്രത്തലവൻ യെതേത്.


    [a] തിമ്നാ എന്ന പേര് “തിമ്നാഹ്” എന്നും ലിപ്യന്തരണം ചെയ്യാം.

    [b] എബ്രായപാഠത്തിൽ “അൽവാ”; 1 ദിനവൃത്താന്തം 1:51-ലെ ബന്ധമുള്ള രൂപമായ “അലിയാ” താരതമ്യം ചെയ്യുക.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: തിമ്നാ എന്ന പേര് “തിമ്നാഹ്” എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ “അൽവാ”; 1 ദിനവൃത്താന്തം 1:51-ലെ ബന്ധമുള്ള രൂപമായ “അലിയാ” താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: പേരുകൾ ഇവയാണ്
  rationale: പട്ടികയെ മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ സംയോജകത്തിന്റെയും പട്ടിക-ആമുഖത്തിന്റെയും പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: ഗോത്രത്തലവന്മാർ / ഗോത്രത്തലവൻ
  rationale: ഉലൂഫ് എന്ന പദം ഇവിടെ ഏദോമ്യ കുല-ഗോത്ര വിഭാഗങ്ങളുടെ നേതാക്കളെ സൂചിപ്പിക്കുന്നു. ‘പ്രഭു’ പോലുള്ള പദവിയെക്കാൾ സാമൂഹിക പശ്ചാത്തലം വ്യക്തമായി അറിയിക്കുകയും ആധുനിക വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: മിഷ്പാഹാ ഇവിടെ വീട്ടുകുടുംബത്തെക്കാൾ വിശാലമായ വംശീയ-സാമൂഹിക കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
- source_word: לִמְקֹמֹתָם
  choice: സ്ഥലങ്ങൾക്കനുസരിച്ച്
  rationale: മാഖോം എന്ന പദത്തിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘സ്ഥലം’ നിലനിർത്തുന്നു; ‘വാസസ്ഥലങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: בִּשְׁמֹתָם
  choice: പേരുപേരായി
  rationale: ഓരോ തലവനെയും പേരനുസരിച്ച് നിരത്തുന്ന പട്ടികാസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ നാമരൂപം.
- source_word: תִּמְנָע
  choice: തിമ്നാ
  rationale: എബ്രായനാമത്തിന്റെ ലളിതമായ മലയാള ലിപ്യന്തരണം; ‘തിമ്നാഹ്’ എന്ന മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַלְוָה
  choice: അൽവാ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠരൂപത്തെ നേരിട്ട് പിന്തുടരുന്നു; 1 ദിനവൃത്താന്തം 1:51-ലെ ബന്ധമുള്ള വ്യത്യസ്ത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְתֵת
  choice: യെതേത്
  rationale: ഈ വാക്യത്തിലെ എബ്രായരൂപത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം; സമാനമായ മറ്റു പേരുകളോട് ഏകീകരിക്കുന്നില്ല.
