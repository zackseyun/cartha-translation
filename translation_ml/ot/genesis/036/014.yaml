id: GEN.36.14
reference: Genesis 36:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: ml
  text: 'അനയുടെ മകളും സിബെയോന്റെ മകളുമായ ഏശാവിന്റെ ഭാര്യ ഒഹൊലീബാമയുടെ പുത്രന്മാർ ഇവരായിരുന്നു: അവൾ ഏശാവിനു യെയൂശ്, യാലാം, കോരഹ് എന്നിവരെ പ്രസവിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: ഇവരായിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: പേരെടുത്തിരിക്കുന്നവർ പുരുഷന്മാരായതിനാൽ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: അനയുടെ മകളും സിബെയോന്റെ മകളുമായ
  rationale: മൂലപാഠത്തിലെ ‘മകൾ’ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തി വംശബന്ധത്തിന്റെ രൂപപരമായ അസ്പഷ്ടത പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ഏശാവിന്റെ ഭാര്യ
  rationale: ബന്ധസൂചക നിർമാണത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: അവൾ ഏശാവിനു ... പ്രസവിച്ചു
  rationale: לְ എന്ന ബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രസവബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: יעיש
  choice: യെയൂശ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יַעְלָם
  choice: യാലാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: בַת צִבְעוֹן എന്ന വംശബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘സിബെയോന്റെ മകൾ’ എന്ന മൂലപാഠരൂപം നിലനിർത്തി
  alternative: ‘സിബെയോന്റെ പേരക്കുട്ടി’ എന്നു വ്യക്തമാക്കുക
  rationale: ഹീബ്രു പാഠം בַת (‘മകൾ’) എന്നു തന്നെ ആവർത്തിക്കുന്നു; വംശപരമായ അർത്ഥം വിവർത്തനത്തിൽ നിശ്ചയിച്ച് ചുരുക്കുന്നത് ഒഴിവാക്കി യഥാർഥ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പേരുകൾ ഹീബ്രു ശബ്ദരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; അനാവശ്യമായ പഴയകാല ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
