source:
  edition: WLC
  text: וְ/אָהֳלִֽיבָמָה֙ יָֽלְדָ֔ה אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹ֑רַח אֵ֚לֶּה בְּנֵ֣י עֵשָׂ֔ו אֲשֶׁ֥ר יֻלְּדוּ ל֖/וֹ בְּ/אֶ֥רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: ml
  text: ഒഹൊലീബാമാ യെയൂശിനെയും യാലാമിനെയും കോരഹിനെയും പ്രസവിച്ചു. കനാൻദേശത്ത് ഏശാവിനു ജനിച്ച പുത്രന്മാർ ഇവരാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: ഒഹൊലീബാമാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: മാതാവിനെ കർത്താവായി നിലനിർത്തുന്ന വംശാവലിസന്ദർഭത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יעיש
  choice: യെയൂശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദസവിശേഷതകൾ കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: יַעְלָם
  choice: യാലാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: അവസാനത്തെ ഹീബ്രു ഘർഷധ്വനിയെ മലയാളത്തിൽ ‘ഹ്’ ഉപയോഗിച്ച് സൂചിപ്പിക്കുന്ന പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ പേരെടുത്തുപറയുന്നത് പുരുഷസന്തതികളെയായതിനാൽ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തി.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: ഏശാവിനു ജനിച്ച
  rationale: ഹീബ്രുവിലെ നിഷ്ക്രിയരൂപവും לוֹ എന്ന ബന്ധസൂചനയും ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ഈ ഉപവാക്യത്തിൽ മാതാവിനെ വീണ്ടും വ്യക്തമാക്കുന്നില്ല.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു.
