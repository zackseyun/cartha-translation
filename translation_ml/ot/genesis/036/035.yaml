lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; സൗമ്യവൽക്കരണം ഒഴിവാക്കുന്നു.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: അവനു പകരം ... രാജാവായി
  rationale: מלך സൂചിപ്പിക്കുന്ന രാജത്വവും תחתיו സൂചിപ്പിക്കുന്ന അധികാരപിന്തുടർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֲדַד בֶּן בְּדַד
  choice: ബെദദിന്റെ മകനായ ഹദദ്
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും בן എന്ന ബന്ധം സ്വാഭാവിക മലയാള ജനനാവലി ശൈലിയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: മിദ്യാനെ തോൽപ്പിച്ചവൻ
  rationale: נכה എന്ന ഹിഫീൽ കൃദന്തരൂപം ഹദദിനെ ശ്രദ്ധേയമായ സൈനിക പ്രവൃത്തിയാൽ തിരിച്ചറിയിക്കുന്നു. ‘അടിച്ചവൻ’ എന്ന അത്യന്തം പദാനുപദ രൂപത്തേക്കാൾ സന്ദർഭത്തിൽ ‘തോൽപ്പിച്ചവൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; മൂലത്തിലെ വിശാലത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: മോവാബിന്റെ പ്രദേശത്തുവെച്ച്
  rationale: שׂדה എന്നത് അക്ഷരാർഥത്തിൽ ‘വയൽ’ ആണെങ്കിലും ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ തുറന്ന നാട്/പ്രദേശം എന്നർഥം വരാം. യുദ്ധസന്ദർഭത്തിൽ ‘പ്രദേശം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְשֵׁם עִירוֹ
  choice: അവന്റെ നഗരത്തിന്റെ പേര് ... എന്നായിരുന്നു
  rationale: എബ്രായ നാമകരണസൂത്രം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עֲוִית
  choice: അവീത്ത്
  rationale: സ്ഥലനാമം എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തെ അനുസരിച്ച് മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്യുന്നു.
