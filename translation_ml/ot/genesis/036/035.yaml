  text: ഹൂശാം മരിച്ചു; അവനു പകരം ബെദദിന്റെ മകനായ ഹദദ് രാജാവായി; അവൻ മോവാബിന്റെ വയലിൽ മിദ്യാനെ അടിച്ചവനായിരുന്നു[a]; അവന്റെ നഗരത്തിന്റെ പേര് അവീത്ത് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടിച്ചവൻ” എന്നതിന് “പ്രഹരിച്ചവൻ” എന്നും പരിഭാഷപ്പെടുത്താം; അത് മിദ്യാനെ തോൽപ്പിച്ചു എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല. “മോവാബിന്റെ വയൽ” എന്നത് “മോവാബിന്റെ നാട്ടിൻപ്രദേശം” അല്ലെങ്കിൽ “മോവാബിന്റെ പ്രദേശം” എന്നും അർഥമാക്കാം.
