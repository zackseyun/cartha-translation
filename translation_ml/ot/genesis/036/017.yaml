- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: രെയൂവേലിന്റെ തലവന്മാർ ഇവരാണ്
  rationale: മുൻപുള്ള പട്ടികയെ സംഗ്രഹിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
