base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ മകനായ രെയൂവേലിന്റെ പുത്രന്മാർ ഇവരാണ്: തലവൻ[a] നഹത്ത്, തലവൻ സേരഹ്, തലവൻ ശമ്മാ, തലവൻ മിസ്സാ. ഏദോംദേശത്തുണ്ടായിരുന്ന രെയൂവേലിന്റെ തലവന്മാർ ഇവരാണ്. ഇവർ ഏശാവിന്റെ ഭാര്യയായ ബാസമത്തിന്റെ പുത്രന്മാരാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കുലത്തലവൻ’; ആവർത്തിച്ചു വരുന്ന എബ്രായപദം ഏദോമ്യ ഗോത്രത്തിന്റെയോ കുലത്തിന്റെയോ നേതാവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: വംശാവലിയുടെ അടുത്ത ഘടകം പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: പേരെടുത്ത് പറയുന്ന പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: ഏശാവിന്റെ മകനായ രെയൂവേൽ
  rationale: എബ്രായത്തിലെ വംശപരമായ അനുബന്ധത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַלּוּף
  choice: തലവൻ
  rationale: ഏദോമ്യ ഗോത്ര-കുലസംവിധാനത്തിലെ നേതാവിനെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, അനാവശ്യമായി പദവി നിർണ്ണയിക്കാത്ത പരിഭാഷ.
- source_word: נַחַת
  choice: നഹത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: זֶרַח
  choice: സേരഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שַׁמָּה
  choice: ശമ്മാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിലെ ഇരട്ട വ്യഞ്ജനവും അവസാന സ്വരവും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
