id: GEN.36.12
reference: Genesis 36:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: ml
  text: ഏശാവിന്റെ മകനായ എലീഫാസിന്റെ ഉപഭാര്യയായിരുന്നു തിമ്നാ. അവൾ എലീഫാസിന് അമാലേക്കിനെ പ്രസവിച്ചു. ഇവരാണ് ഏശാവിന്റെ ഭാര്യയായ ആദായുടെ പുത്രന്മാർ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുത്രന്മാർ” എന്ന എബ്രായ പദത്തിന് ഇവിടെ കൊച്ചുമക്കൾ ഉൾപ്പെടെയുള്ള സന്തതികളെയും സൂചിപ്പിക്കാനാകാം.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְתִמְנַע
  choice: തിമ്നാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ നാമലിപ്യന്തരണരീതിയിൽ നൽകി; ആരംഭത്തിലെ വാവിനെ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: הָיְתָה
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה തിമ്നായുടെ നില വിവരിക്കുന്ന സാധാരണ ബന്ധകക്രിയയാണ്; ‘ആയിത്തീർന്നു’ എന്ന മാറ്റത്തിന്റെ അർഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- source_word: פִילֶגֶשׁ
  choice: ഉപഭാര്യ
  rationale: അംഗീകൃതമായിരുന്നെങ്കിലും പ്രധാന ഭാര്യയേക്കാൾ താഴ്ന്ന സാമൂഹിക നിലയിലുള്ള വൈവാഹികബന്ധത്തെ സൂചിപ്പിക്കുന്നു; ആ വ്യത്യാസം മാന്യവും ഗ്രാഹ്യവുമായി നിലനിർത്തുന്നു.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: ഏശാവിന്റെ മകനായ എലീഫാസിന്റെ
  rationale: ബന്ധവും പിതൃവംശവും സ്വാഭാവികമായ മലയാള ഷഷ്ഠീവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: അവൾ എലീഫാസിന് അമാലേക്കിനെ പ്രസവിച്ചു
  rationale: ילד എന്ന പ്രസവക്രിയയും പിതാവിനെ സൂചിപ്പിക്കുന്ന לְ എന്ന എബ്രായ വംശാവലിഘടനയും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: ഇവരാണ് ... ആദായുടെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിലെ സൂത്രവാക്യവും בְּנֵי എന്ന മൂലപദവും നേരിട്ട് നിലനിർത്തുന്നു; പദത്തിന്റെ വിശാലമായ വംശപരമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ഏശാവിന്റെ ഭാര്യയായ
  rationale: ആദായെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: 'ആദായോടുള്ള വംശബന്ധം: ‘പുത്രന്മാർ’ അതോ ‘കൊച്ചുമക്കൾ/സന്തതികൾ’'
  choice: മുഖ്യവാചകത്തിൽ ‘പുത്രന്മാർ’ നിലനിർത്തി, വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘കൊച്ചുമക്കൾ’ അല്ലെങ്കിൽ ‘സന്തതികൾ’ എന്ന് മുഖ്യവാചകത്തിൽ നൽകുക.
  rationale: എബ്രായത്തിലെ בְּנֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാർ’ ആണെങ്കിലും വംശാവലികളിൽ പിന്നത്തെ തലമുറകളെയും സൂചിപ്പിക്കാം. സമീപസന്ദർഭത്തിൽ ഇവർ ആദായുടെ മകൻ എലീഫാസിന്റെ മക്കളായതിനാൽ ‘കൊച്ചുമക്കൾ’ എന്ന ബന്ധം പ്രസക്തമാണ്; എന്നാൽ മൂലത്തിലെ രൂപം വ്യാഖ്യാനിച്ച് മാറ്റാതെ അതിന്റെ സംഘർഷവും അർഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി ഉപയോഗിച്ചു. ‘ഉപഭാര്യ’ സാമൂഹിക-നിയമപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു; നിന്ദാസൂചനയുള്ളതോ അത്യന്തം പുരാതനമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
