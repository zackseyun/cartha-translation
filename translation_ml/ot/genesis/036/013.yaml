id: GEN.36.13
reference: Genesis 36:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: ml
  text: 'രെയൂവേലിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു: നഹത്ത്, സേരഹ്, ശമ്മാ, മിസ്സാ. ഇവർ ഏശാവിന്റെ ഭാര്യയായ ബാസമത്തിന്റെ പുത്രന്മാരായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “പുത്രന്മാർ” എന്നതിന് “സന്തതികൾ” എന്നും അർത്ഥമാകാം. 36:10 പ്രകാരം ഇവർ ബാസമത്തിന്റെ കൊച്ചുമക്കളാണ്.
    reason: בְּנֵי എന്ന എബ്രായ പദത്തിന് നേരിട്ടുള്ള പുത്രന്മാർ എന്നതിലുപരി സന്തതികൾ എന്ന വിശാല അർത്ഥവും ഉണ്ടാകാം; ഉടനെയുള്ള വംശാവലി സന്ദർഭം കൃത്യബന്ധം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְאֵלֶּה בְּנֵי רְעוּאֵל
  choice: രെയൂവേലിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു
  rationale: വംശാവലിയുടെ അടുത്ത ഘടകം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി. പേരെടുത്തവർ രെയൂവേലിന്റെ നേരിട്ടുള്ള ആൺമക്കളായതിനാൽ בְּנֵי എന്നതിന് ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: നഹത്ത്, സേരഹ്, ശമ്മാ, മിസ്സാ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പതിവ് ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് യോജിച്ച് നൽകി; പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി കോമകൾ ഉപയോഗിച്ചു.
- source_word: אֵלֶּה הָיוּ
  choice: ഇവർ ... ആയിരുന്നു
  rationale: היה എന്ന ഭൂതകാല ക്രിയയും ബഹുവചന സൂചകവും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי בָשְׂמַת
  choice: ബാസമത്തിന്റെ പുത്രന്മാർ
  rationale: മൂലപാഠം בְּנֵי എന്ന അതേ പദം ആവർത്തിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ‘പുത്രന്മാർ’ നിലനിർത്തി. എബ്രായത്തിൽ ഈ പദം വിശാലമായി സന്തതികളെയും സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; അതുവഴി മൂലത്തിലെ പ്രയോഗവും വംശാവലി ബന്ധവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ഏശാവിന്റെ ഭാര്യയായ
  rationale: ബന്ധസൂചകമായ എബ്രായ നിർമാണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: ബാസമത്തോടുള്ള വംശാവലി ബന്ധത്തിൽ בְּנֵי എന്ന പദത്തിന്റെ പരിധി
  choice: പ്രധാന പാഠത്തിൽ ‘പുത്രന്മാർ’; അടിക്കുറിപ്പിൽ ‘സന്തതികൾ’ എന്ന വിശാല അർത്ഥവും ഇവർ കൊച്ചുമക്കളാണെന്ന സന്ദർഭവിവരവും
  alternative: പ്രധാന പാഠത്തിൽ നേരിട്ട് ‘കൊച്ചുമക്കൾ’
  rationale: ഉല്പത്തി 36:10 പ്രകാരം രെയൂവേൽ ബാസമത്തിന്റെ മകനായതിനാൽ ഇവിടെ പേരെടുത്തവർ അവളുടെ കൊച്ചുമക്കളാണ്. എങ്കിലും മൂലപാഠം ബന്ധം പ്രത്യേകമായി ‘കൊച്ചുമക്കൾ’ എന്നു പറയാതെ בְּנֵי ആവർത്തിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനപരമായ കൃത്യത അടിക്കുറിപ്പിലാക്കി, മൂലത്തിലെ പദപ്രയോഗവും അർത്ഥവ്യാപ്തിയും പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലി പട്ടികയുടെ സംക്ഷിപ്തത നിലനിർത്തി; പേരുകൾ പരിചിതമായ മലയാള ബൈബിൾ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു.
