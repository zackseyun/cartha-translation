  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: ml
  text: ഏശാവ് തന്റെ ഭാര്യമാരെയും പുത്രന്മാരെയും പുത്രിമാരെയും തന്റെ വീട്ടിലുള്ള എല്ലാവരെയും തന്റെ കന്നുകാലികളെയും സകല മൃഗങ്ങളെയും കനാൻദേശത്തുവെച്ച് സമ്പാദിച്ച സകല സ്വത്തുക്കളെയും കൂട്ടിക്കൊണ്ട്, തന്റെ സഹോദരനായ യാക്കോബ് നിമിത്തം ഒരു ദേശത്തേക്കു[a] പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “ഒരു ദേശത്തേക്ക്.” ചില കൈയെഴുത്തുപ്രതികളും പുരാതന പരിഭാഷകളും “സേയീർദേശത്തേക്ക്” എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; സന്ദർഭം കണക്കിലെടുത്ത് പല പരിഭാഷകളും “മറ്റൊരു ദേശത്തേക്ക്” എന്നു വിവർത്തനം ചെയ്യുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ കുടുംബാംഗങ്ങളെയും സമ്പത്തിനെയും ഒപ്പം കൊണ്ടുള്ള കുടിയേറ്റമാണ് സൂചിപ്പിക്കുന്നത്; ‘കൂട്ടിക്കൊണ്ട്’ ആ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָשָׁיו
  choice: തന്റെ ഭാര്യമാരെ
  rationale: ഇവിടെ אִשָּׁה എന്ന പദത്തിന്റെ ബഹുവചനം ഏശാവിന്റെ ഭാര്യമാരെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: തന്റെ വീട്ടിലുള്ള എല്ലാവരെയും
  rationale: נֶפֶשׁ ഇവിടെ ‘ആത്മാവ്’ എന്ന സൈദ്ധാന്തിക അർഥത്തിലല്ല, വീട്ടിലുൾപ്പെട്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִקְנֵהוּ
  choice: തന്റെ കന്നുകാലികളെ
  rationale: מִקְנֶה വളർത്തുമൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ സാധാരണ മലയാളത്തിൽ അനുയോജ്യമായ സമാനപദമാണ്.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: സകല മൃഗങ്ങളെയും
  rationale: בְּהֵמָה വിശാലമായി മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള מִקְנֶהയിൽനിന്നുള്ള പദവ്യത്യാസം ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: സമ്പാദിച്ച സകല സ്വത്തുക്കളെയും
  rationale: קִנְיָן കൈവശമുള്ള സ്വത്തിനെയും רכשׁ അതിന്റെ സമ്പാദനത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സംയോജനം സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുവെച്ച്
  rationale: ‘കനാൻദേശം’ ഭൂമിശാസ്ത്രപരമായ ഔപചാരികത നിലനിർത്തുകയും ‘-ത്തുവെച്ച്’ സമ്പാദനം നടന്ന സ്ഥലത്തെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל אֶרֶץ
  choice: ഒരു ദേശത്തേക്ക്
  rationale: മസൊററ്റിക് പാഠത്തിലുള്ള അനിശ്ചിതമായ ‘ഒരു ദേശത്തേക്ക്’ എന്ന രൂപം, സന്ദർഭത്തിൽനിന്ന് ‘മറ്റൊരു’ എന്നു ചേർക്കാതെ, അതേപടി നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: തന്റെ സഹോദരനായ യാക്കോബ് നിമിത്തം
  rationale: מִפְּנֵי എന്നത് ഇവിടെ കാരണാർഥത്തിൽ വായിക്കാവുന്നതാണ്; അടുത്ത വാക്യത്തിലെ സഹവാസപ്രശ്നം ഈ വായനയെ പിന്തുണയ്ക്കുന്നു. അതേസമയം ദിശാബോധം വാചകത്തിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: מִפְּנֵי എന്നതിന്റെ കാരണാർഥമോ സ്ഥലാർഥമോ
  choice: യാക്കോബ് നിമിത്തം
  alternative: യാക്കോബിൽനിന്ന് അകലെ
  rationale: ഈ പദത്തിന് ‘മുമ്പിൽനിന്ന്/അകലെ’ എന്നും ‘നിമിത്തം’ എന്നും അർഥസാധ്യതയുണ്ട്. ഉല്പത്തി 36:7 നൽകുന്ന കാരണം പരിഗണിച്ച് കാരണാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പാഠം വ്യക്തമാക്കാത്ത ലക്ഷ്യസ്ഥാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ നീണ്ട പട്ടികയും പുത്രന്മാർ/പുത്രിമാർ, കന്നുകാലികൾ/മൃഗങ്ങൾ എന്നീ വ്യത്യാസങ്ങളും നിലനിർത്തി; ആവശ്യമില്ലാത്ത സിദ്ധാന്തപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
