  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വംശാവലിപ്പട്ടികാ സൂത്രത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പിന്നാലെ പറയുന്ന വ്യക്തികളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചനരൂപമാണ്.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ പേരെടുത്തുപറയുന്ന രണ്ട് പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: דִישָׁן
  choice: ദീശാൻ
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עוּץ
  choice: ഊസ്
  rationale: വ്യക്തിനാമമായ עוּץ എന്നതിന്റെ സ്രോതസ്സുഭാഷാധിഷ്ഠിത മലയാള ലിപ്യന്തരണം.
- source_word: וַאֲרָן
  choice: അരാനും
  rationale: ו എന്ന സംയോജകത്തെ മലയാളത്തിലെ പട്ടികാസമന്വയരൂപമായ ‘-ഉം’കൊണ്ട് നൽകി, אֲרָן എന്ന വ്യക്തിനാമം ‘അരാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
