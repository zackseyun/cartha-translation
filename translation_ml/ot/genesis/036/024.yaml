source:
  edition: WLC
  text: וְ/אֵ֥לֶּה בְנֵֽי צִבְע֖וֹן וְ/אַיָּ֣ה וַ/עֲנָ֑ה ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א אֶת הַ/יֵּמִם֙ בַּ/מִּדְבָּ֔ר בִּ/רְעֹת֥/וֹ אֶת הַ/חֲמֹרִ֖ים לְ/צִבְע֥וֹן אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: ml
  text: 'സിബെയോന്റെ പുത്രന്മാർ ഇവരാണ്: അയ്യാവും അനാവും. ഈ അനാ തന്റെ അപ്പനായ സിബെയോന്റെ കഴുതകളെ മരുഭൂമിയിൽ മേയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ യെമീം[a] കണ്ടെത്തിയവനാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ ‘യെമീം’ എന്നതിന്റെ അർഥം അനിശ്ചിതമാണ്. ‘ചൂടുറവകൾ’ എന്നും ചില പുരാതനവും പിൽക്കാലത്തേതുമായ വ്യാഖ്യാനങ്ങളിൽ ‘കോവർകഴുതകൾ’ എന്നും ഇതിനെ മനസ്സിലാക്കിയിട്ടുണ്ട്. പദാർഥം നിർണയിക്കാനുള്ള തെളിവുകൾ അപര്യാപ്തമായതിനാൽ മുഖ്യപാഠത്തിൽ എബ്രായപദം ലിപ്യന്തരിച്ചു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഈ സന്ദർഭത്തിൽ ആൺമക്കളെ നേരിട്ട് സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ പദം.
- source_word: צִבְעוֹן
  choice: സിബെയോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַיָּה
  choice: അയ്യാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണസമീപമായ മലയാള ലിപ്യന്തരണം.
- source_word: עֲנָה
  choice: അനാ
  rationale: വംശാവലിയിലുടനീളം സ്ഥിരമായി ഉപയോഗിക്കാവുന്ന എബ്രായ വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: הוּא עֲנָה
  choice: ഈ അനാ ... കണ്ടെത്തിയവനാണ്
  rationale: ഒരേ പേരുള്ളവരിൽ ഈ പ്രത്യേക അനായെ തിരിച്ചറിയിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מָצָא
  choice: കണ്ടെത്തി
  rationale: സാധാരണ അർഥമായ ‘കണ്ടെത്തുക’ നേരിട്ട് നൽകുന്നു.
- source_word: הַיֵּמִם
  choice: യെമീം
  rationale: അത്യപൂർവവും അർഥം അനിശ്ചിതവുമായ എബ്രായ പദമായതിനാൽ വിവാദമായ ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: മനുഷ്യവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന מִדְבָּר എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാള തുല്യം.
- source_word: בִּרְעֹתוֹ
  choice: മേയിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: സമകാലികമായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഘടനയും മൃഗങ്ങളെ മേയ്ക്കുക എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപവും നിലനിർത്തുന്നു.
- source_word: הַחֲמֹרִים
  choice: കഴുതകളെ
  rationale: മൃഗനാമത്തിന്റെ വ്യക്തവും ആധുനികവുമായ മലയാള തുല്യം.
- source_word: לְצִבְעוֹן אָבִיו
  choice: തന്റെ അപ്പനായ സിബെയോന്റെ
  rationale: കഴുതകൾ പിതാവായ സിബെയോനുമായി ബന്ധപ്പെട്ടവയാണെന്ന അർഥവും പിതൃബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
