translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിക്ക് യോജിച്ച ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ ഹീബ്രു ശബ്ദരൂപത്തോട് ചേർന്നാണ് ലിപ്യന്തരം ചെയ്തത്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ പ്രധാനവാചകത്തിൽ ചേർത്തു.
