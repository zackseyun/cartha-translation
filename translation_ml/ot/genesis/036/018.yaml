source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בְּנֵ֤י אָהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אָֽהֳלִיבָמָ֛ה בַּת עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: ml
  text: 'ഏശാവിന്റെ ഭാര്യയായ ഒഹൊലീബാമയുടെ പുത്രന്മാർ ഇവർ: ഗോത്രത്തലവനായ യെയൂശ്, ഗോത്രത്തലവനായ യാലാം, ഗോത്രത്തലവനായ കോരഹ്. ഇവരായിരുന്നു അനായുടെ മകളും ഏശാവിന്റെ ഭാര്യയുമായ ഒഹൊലീബാമയുടെ ഗോത്രത്തലവന്മാർ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗോത്രത്തലവന്മാർ” എന്നതിന് “കുടുംബത്തലവന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം എദോമ്യ കൂട്ടങ്ങളുടെയോ വംശകുടുംബങ്ങളുടെയോ നേതാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: പേരെടുത്തുപറയുന്ന പുരുഷസന്താനങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പുല്ലിംഗ ബഹുവചനത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: אֵשֶׁת עֵשָׂו
  choice: ഏശാവിന്റെ ഭാര്യ
  rationale: ഹീബ്രു സമാസബന്ധം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥപ്രയോഗത്തിൽ നൽകി; രണ്ടു സ്ഥാനങ്ങളിലും ഒരേ രീതിയിൽ നിലനിർത്തി.
- source_word: אַלּוּף
  choice: ഗോത്രത്തലവൻ
  rationale: ഉല്പത്തി 36-ലെ എദോമ്യ കുടുംബ-ഗോത്രവിഭാഗങ്ങളുടെ നേതാവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. വെറും ‘തലവൻ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമാക്കുകയും ‘പ്രഭു’ പോലുള്ള അസ്പഷ്ടമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יְעוּשׁ
  choice: യെയൂശ്
  rationale: ഹീബ്രു നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: יַעְלָם
  choice: യാലാം
  rationale: ഹീബ്രു നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: ഹീബ്രു നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אֵלֶּה אַלּוּפֵי אָהֳלִיבָמָה
  choice: ഇവരായിരുന്നു ... ഒഹൊലീബാമയിൽനിന്നുള്ള ഗോത്രത്തലവന്മാർ
  rationale: മുൻപറഞ്ഞ പുത്രന്മാരെ സംഗ്രഹിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വംശജർ’ എന്ന കൂടുതൽ വ്യാപകമായ അർത്ഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: בַּת עֲנָה
  choice: അനായുടെ മകൾ
  rationale: ഹീബ്രു സമാസത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: ഇവർ ... ഇവരായിരുന്നു
  rationale: ആവർത്തിച്ച സൂചകപദങ്ങൾ വംശാവലിയുടെ ഔപചാരിക ഘടന നിലനിർത്തുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
