id: GEN.36.9
reference: Genesis 36:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: ml
  text: സേയീർ മലനാട്ടിലുള്ള[a] ഏദോമിന്റെ പിതാവായ ഏശാവിന്റെ വംശാവലി ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേയീർ പർവതത്തിൽ” അല്ലെങ്കിൽ “സേയീർ പർവതനിരകളിൽ.”
    reason: הַר എന്ന പദം ഒറ്റ പർവതത്തെയോ പർവതപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഭൂമിശാസ്ത്രപരമായ ഈ അവ്യക്തത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇതാണ്
  rationale: വംശാവലിവിഭാഗം പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം. ഹീബ്രായിലെ וְ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘ഇതാണ്’ എന്നു പറയുന്നത് ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: תֹּלְדוֹת
  choice: വംശാവലി
  rationale: ഉല്പത്തിയിലെ ആവർത്തിത ഘടനാപദത്തിന്റെ വംശപരമ്പരാസംബന്ധമായ അർഥം വ്യക്തമായും സംക്ഷിപ്തമായും നൽകുന്നു; ‘തലമുറകൾ’ എന്ന യാന്ത്രിക പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֲבִי
  choice: പിതാവായ
  rationale: ഹീബ്രായിലെ നേരിട്ടുള്ള ബന്ധപദം സംരക്ഷിക്കുന്നു; ഇവിടെ ഏദോമ്യരുടെ പൂർവപിതാവ് എന്ന ആശയവും ഉൾക്കൊള്ളുന്നു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: ജനതയെയും ദേശനാമത്തെയും സൂചിപ്പിക്കുന്ന പേരിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בְּ/הַר
  choice: മലനാട്ടിൽ താമസിച്ചിരുന്ന
  rationale: הַר ഇവിടെ ഒറ്റ കൊടുമുടിയേക്കാൾ സേയീരിന്റെ പർവതപ്രദേശത്തെ സൂചിപ്പിക്കാം. സ്ഥലം വാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘താമസിച്ചിരുന്ന’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שֵׂעִיר
  choice: സേയീർ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഉല്പത്തിയിലെ വംശാവലി-ആമുഖസൂത്രം സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; സ്ഥലസൂചനയിലെ യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
