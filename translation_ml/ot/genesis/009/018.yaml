id: GEN.9.18
reference: Genesis 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: ml
  text: പെട്ടകത്തിൽനിന്ന് പുറത്തുവന്ന നോഹയുടെ പുത്രന്മാർ ശേം, ഹാം, യാഫെത്ത് എന്നിവരായിരുന്നു; ഹാം കനാന്റെ പിതാവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയാരൂപം അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്നതല്ല; വിഷയത്തെയും വിധേയത്തെയും ബന്ധിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗമാണ്.
- source_word: בְנֵי נֹחַ
  choice: നോഹയുടെ പുത്രന്മാർ
  rationale: ഹീബ്രു സംയുക്തപദത്തിന്റെ കുടുംബബന്ധം നേരിട്ട് സൂക്ഷിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: പെട്ടകത്തിൽനിന്ന് പുറത്തുവന്ന
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം നോഹയുടെ പുത്രന്മാരെ വിശേഷിപ്പിക്കുന്നു; מן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽ 'പെട്ടകത്തിൽനിന്ന് പുറത്തുവന്ന' എന്നതിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: ശേം, ഹാം, യാഫെത്ത്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും ഹീബ്രു പേരുകളോട് അടുത്തുനിൽക്കുന്നതുമായ ലിപ്യന്തരണങ്ങളാണ് ഉപയോഗിച്ചത്.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: ഹാം കനാന്റെ പിതാവായിരുന്നു
  rationale: ഹാമിനെ കനാനുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയിക്കുന്ന നാമവാക്യം നേരിട്ടും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു; തുടർന്നുള്ള വിവരണത്തിന് ആവശ്യമായ പശ്ചാത്തലസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഹാമിനെയും കനാനെയും ബന്ധിപ്പിക്കുന്ന വംശാവലിക്കുറിപ്പ്
  choice: '''ഹാം കനാന്റെ പിതാവായിരുന്നു'' എന്ന വാക്യം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നിലനിർത്തി.'
  alternative: ഇത് വെറും അനുബന്ധവിവരമായി കണ്ട് ശൈലിപരമായി പ്രാധാന്യം കുറയ്ക്കുക.
  rationale: ഹീബ്രു പാഠം ഹാമിന്റെ കനാനുമായുള്ള ബന്ധം വ്യക്തമായി എടുത്തുപറഞ്ഞ് തുടർന്നുള്ള സംഭവത്തിന് പശ്ചാത്തലം ഒരുക്കുന്നു. അതിനപ്പുറമുള്ള വംശീയമോ ദൈവശാസ്ത്രപരമോ ആയ നിഗമനങ്ങൾ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. 'മക്കൾ' എന്നതിനെക്കാൾ മൂലത്തിലെ בְנֵי എന്ന പുരുഷലിംഗസൂചന വ്യക്തമായി നൽകാൻ 'പുത്രന്മാർ' തിരഞ്ഞെടുത്തു. അനാവശ്യ വ്യാഖ്യാനമോ വിഭാഗീയ പദപ്രയോഗമോ ഒഴിവാക്കി.
