id: GEN.9.25
reference: Genesis 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കനാൻ ശപിക്കപ്പെട്ടവൻ; തന്റെ സഹോദരന്മാർക്ക് അവൻ അടിമകളുടെ അടിമയായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ കഥനക്രമത്തിൽ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ രൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ കഥനശൈലി.
- source_word: אָרוּר
  choice: ശപിക്കപ്പെട്ടവൻ
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു വിധേയപ്രയോഗത്തിന്റെ പ്രഖ്യാപനസ്വഭാവം നിലനിർത്തുന്നു; കനാനെ അഭിസംബോധന ചെയ്യുന്ന ശാപവാക്യമെന്നതിനേക്കാൾ അവനെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വായിക്കാൻ ഇട നൽകുന്നു.
- source_word: כְּנָעַן
  choice: കനാൻ
  rationale: മൂലപാഠത്തിൽ ശപിക്കപ്പെട്ടവനായി വ്യക്തമായി പേരെടുത്തിരിക്കുന്നത് കനാനെയാണ്, ഹാമിനെയല്ല.
- source_word: עֶבֶד עֲבָדִים
  choice: അടിമകളുടെ അടിമ
  rationale: അത്യന്തം താഴ്ന്ന അടിമസ്ഥിതി സൂചിപ്പിക്കുന്ന തീവ്രതയുള്ള ഹീബ്രു ആവർത്തനഘടനയെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരിക്കും
  rationale: ശാപപ്രഖ്യാപനത്തിനുള്ളിലെ ഭാവിഫലത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְאֶחָיו
  choice: തന്റെ സഹോദരന്മാർക്ക്
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ‘അവന്റെ സഹോദരന്മാർക്ക്’ എന്ന അർഥം; മലയാളത്തിൽ പ്രതിഫലനരൂപം ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: നോഹയുടെ ശാപത്തിന്റെ ലക്ഷ്യം
  choice: കനാനെയാണ് ശപിക്കപ്പെട്ടവനായി പേരെടുത്തിരിക്കുന്നത്.
  alternative: ശാപം നേരിട്ട് ഹാമിന്മേലാണെന്ന വ്യാഖ്യാനം
  rationale: ഹീബ്രു പാഠം വ്യക്തമായി കനാനെ പേരെടുക്കുന്നു; വ്യാഖ്യാനപാരമ്പര്യം ഉപയോഗിച്ച് ലക്ഷ്യം ഹാമിലേക്കു മാറ്റുന്നില്ല.
- issue: അടിമത്തഭാഷയുടെ പരിഭാഷ
  choice: ‘അടിമകളുടെ അടിമ’ എന്ന ശക്തമായ പ്രയോഗം
  alternative: ‘ദാസന്മാരുടെ ദാസൻ’ അല്ലെങ്കിൽ ‘ഏറ്റവും താഴ്ന്ന അടിമ’
  rationale: ബന്ധിതമായ അധീനാവസ്ഥയുടെയും മൂലത്തിലെ തീവ്ര ആവർത്തനത്തിന്റെയും കാഠിന്യം കാത്തുസൂക്ഷിക്കുന്നു; ‘ഏറ്റവും താഴ്ന്ന’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യത്തിന്റെ പ്രഖ്യാപനസ്വഭാവവും ‘അടിമകളുടെ അടിമ’ എന്ന തീവ്രതയുള്ള പ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
