  naturalness: '‘അവൻ പറഞ്ഞു: “കനാൻ ശപിക്കപ്പെട്ടവൻ; തന്റെ സഹോദരന്മാർക്ക് അവൻ അടിമകളുടെ അടിമയായിരിക്കും.”’ ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും വായനാസുഗമവുമാണ്. ‘ശപിക്കപ്പെട്ടവൻ’ എന്ന കോപ്പുലയില്ലാത്ത പ്രഖ്യാപനപ്രയോഗം ഈ ശാപവാക്യത്തിന്റെ സംക്ഷിപ്തവും ഔപചാരികവുമായ സ്വരത്തിന് യോജിക്കുന്നു.'
