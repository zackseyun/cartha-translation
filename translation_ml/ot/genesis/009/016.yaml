  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: ml
  text: വില്ല് മേഘത്തിൽ ഉണ്ടാകും[a]; ദൈവവും ഭൂമിയിലുള്ള ജഡമുള്ള സകല ജീവജാലങ്ങളും തമ്മിലുള്ള ശാശ്വത ഉടമ്പടി ഓർക്കാൻ ഞാൻ അതു കാണും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഴവില്ല്.’ എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘വില്ല്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: കാണപ്പെടും
  rationale: ഭാവികാല ദൈവവചനത്തിന്റെ തുടർച്ച വ്യക്തമാക്കുകയും, ആകാശത്തിലെ വില്ല് മേഘത്തിൽ ദൃശ്യമാകുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: הַקֶּשֶׁת
  choice: വില്ല്
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥമായ ‘വില്ല്’ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മഴവില്ല് എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּעָנָן
  choice: മേഘത്തിൽ
  rationale: നിശ്ചയാർഥ ഏകവചന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  choice: ഞാൻ അതു കാണുമ്പോൾ ... ഓർക്കും
  rationale: കാണലും ഓർക്കലും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ദൈവിക ഓർമ്മയെ വിശദീകരിച്ച് മാറ്റുന്നില്ല.
- source_word: בְּרִית עוֹלָם
  choice: ശാശ്വത ഉടമ്പടി
  rationale: ദീർഘകാലം നിലനിൽക്കുന്ന ഉടമ്പടിയെന്ന עוֹלָם എന്ന പദത്തിന്റെ കാലവ്യാപ്തി വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: സകല ജഡജീവികൾക്കും
  rationale: നֶפֶשׁ ഇവിടെ മനുഷ്യന്റെ ‘ആത്മാവ്’ മാത്രമല്ല, സകല ജീവികളെയും സൂചിപ്പിക്കുന്നു; בְּכָל בָּשָׂר അതിനെ ജഡമുള്ള ജീവികളായി വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിലെ സംയുക്തപ്രയോഗം ആവർത്തനം ഒഴിവാക്കി ഇരുഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: ഭൂമിയിലുള്ള
  rationale: സാർവത്രികമായ സന്ദർഭത്തിൽ ‘ദേശത്ത്’ എന്നതിനെക്കാൾ ‘ഭൂമിയിൽ’ എന്ന അർഥം യോജിക്കുന്നു.
theological_decisions:
- issue: ദൈവം ഓർക്കുന്നു എന്ന മനുഷ്യസദൃശ പ്രയോഗം
  choice: ‘ഞാൻ ... ഓർക്കും’ എന്നു നേരിട്ട് നിലനിർത്തി
  alternative: ‘എന്റെ ഉടമ്പടിക്കനുസരിച്ച് പ്രവർത്തിക്കും’ എന്ന് വ്യാഖ്യാനിച്ചു പരിഭാഷപ്പെടുത്തുക
  rationale: ദൈവിക ഉടമ്പടി-ഓർമ്മയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ഭാഷയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശദീകരിച്ച് നീക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള ശൈലി. ‘ഉടമ്പടി’, ‘ശാശ്വതം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; മൂലത്തിലെ ‘വില്ല്’ എന്ന രൂപകം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
