id: GEN.9.15
reference: Genesis 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: ml
  text: എനിക്കും നിങ്ങൾക്കും സകല ജഡത്തിലുമുള്ള ഓരോ ജീവജന്തുവിനും മധ്യേയുള്ള എന്റെ ഉടമ്പടി ഞാൻ ഓർക്കും; സകല ജഡത്തെയും നശിപ്പിക്കുന്ന പ്രളയമായി വെള്ളം ഇനി ഒരിക്കലും മാറുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: ഞാൻ ഓർക്കും
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിപരമായ ഓർമയെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഭാവികാലമാണ്.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ബന്ധപരവും വാഗ്ദാനപരവുമായ ഔപചാരിക അർഥം സൂക്ഷിക്കുന്ന സ്ഥിരമായ മലയാളപദം.
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: സകല ജഡത്തിലുമുള്ള ഓരോ ജീവജന്തു
  rationale: נֶפֶשׁ חַיָּהയെ ഈ സന്ദർഭത്തിൽ ജീവിക്കുന്ന സൃഷ്ടിയായി അവതരിപ്പിക്കുകയും בְּכָל בָּשָׂר എന്ന വർഗസൂചകവും സർവവ്യാപകവുമായ പരിധി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: പ്രളയമായി വെള്ളം ഇനി ഒരിക്കലും മാറുകയില്ല
  rationale: עוֹד കൂടിയ നിഷേധത്തിന്റെ സ്ഥിരമായ അനാവർത്തനവും לְמַבּוּל എന്ന ഫല/പ്രവർത്തനബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: സകല ജഡത്തെയും നശിപ്പിക്കുന്ന
  rationale: പ്രളയത്തിന്റെ ഫലം/ഉദ്ദേശ്യം സൂക്ഷിക്കുകയും כָּל בָּשָׂר എന്ന ആവർത്തനം മനുഷ്യരിൽ മാത്രം ഒതുക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവം ഓർക്കുന്നു എന്ന മനുഷ്യസദൃശ ഭാഷ
  choice: ഞാൻ ഓർക്കും
  alternative: എന്റെ ഉടമ്പടിപ്രകാരം ഞാൻ പ്രവർത്തിക്കും
  rationale: മൂലപാഠം ഓർമയുടെ ഭാഷ തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ പ്രവർത്തനപരമായ വ്യാഖ്യാനമാക്കി മാറ്റാതെ ഉടമ്പടിപരമായ ദൈവസ്മരണയുടെ അർഥസമ്മർദം നിലനിർത്തുന്നു.
- issue: സകല ജഡം എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: സകല ജഡം
  alternative: എല്ലാ ജീവജാലങ്ങളും
  rationale: ഉടമ്പടിയിൽ മൃഗങ്ങളും ഉൾപ്പെടുന്ന വിശാലപരിധിയും വാക്യത്തിനുള്ളിലെ ആവർത്തനവും സംരക്ഷിക്കാൻ മൂലഭാഷയുടെ ദേഹധാരികളായ ജീവികളുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘മധ്യേയുള്ള’ എന്ന ഘടന ഉടമ്പടിയുടെ കക്ഷികളെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ‘ജഡം’ എന്ന ബൈബിൾപരമായ പദം സന്ദർഭത്തിലെ മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിശാലതയ്ക്കായി നിലനിർത്തി.
