id: GEN.9.10
reference: Genesis 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: ml
  text: നിങ്ങളോടുകൂടെയുള്ള സകല ജീവജന്തുക്കളോടും—പക്ഷികൾ, കന്നുകാലികൾ, നിങ്ങളോടുകൂടെയുള്ള സകല വന്യമൃഗങ്ങൾ എന്നിവയോടും—അതായത് പെട്ടകത്തിൽനിന്നു പുറത്തുവന്ന സകല ജീവികളോടും, ഭൂമിയിലെ സകല വന്യമൃഗങ്ങളോടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അവസാനഭാഗം എബ്രായയിൽ ദുഷ്കരമാണ്. കൂടുതൽ പദാനുപദമായി: ‘പെട്ടകത്തിൽനിന്നു പുറത്തുവന്ന സകലത്തിൽനിന്നും, ഭൂമിയിലെ സകല വന്യമൃഗങ്ങൾക്കും.’'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: ജീവജന്തുക്കൾ
  rationale: സന്ദർഭത്തിൽ ഈ പദസമുച്ചയം മൃഗങ്ങളായ സജീവജീവികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ജീവജന്തുക്കൾ’ സ്വാഭാവികവും വ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: בָּעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף പറക്കുന്ന ജീവികളെ സൂചിപ്പിക്കാമെങ്കിലും ഈ പട്ടികയിൽ ‘പക്ഷികൾ’ വ്യക്തവും സാധാരണവുമായ പ്രയോഗമാണ്.
- source_word: בַּבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള വന്യമൃഗങ്ങളിൽനിന്നുള്ള വ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: חַיַּת הָאָרֶץ
  choice: ഭൂമിയിലെ വന്യമൃഗങ്ങൾ
  rationale: കന്നുകാലികളിൽനിന്ന് വേർതിരിച്ചുള്ള കാട്ടുമൃഗങ്ങളുടെ വിഭാഗമാണിവിടെ; ‘വന്യമൃഗങ്ങൾ’ ആ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: അതായത് പെട്ടകത്തിൽനിന്നു പുറത്തുവന്ന സകലതിനോടും
  rationale: מן ഇവിടെ മുൻപറഞ്ഞ ജീവികളെ കൂടുതൽ വ്യക്തമാക്കുന്ന അർഥത്തിൽ എടുക്കുന്നു; ‘അതായത്’ മലയാളത്തിൽ ആ specifying ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: ഭൂമിയിലെ സകല വന്യമൃഗങ്ങളോടും
  rationale: അവസാനത്തെ לְ-വാക്യഘടകം ആവർത്തനാത്മകമായോ സംഗ്രഹാത്മകമായോ വായിക്കാം; മുഖ്യവാചകത്തിൽ ആവർത്തനം നിലനിർത്തി ദുഷ്കരമായ ഘടന മറച്ചുവെക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടിയിൽ ഉൾപ്പെടുന്ന മൃഗജീവന്റെ വ്യാപ്തിയും അവസാന വാക്യഘടകത്തിന്റെ ബന്ധവും
  choice: പക്ഷികൾ, കന്നുകാലികൾ, വന്യമൃഗങ്ങൾ എന്നിവ ഉൾപ്പെടെ പെട്ടകത്തിൽനിന്നിറങ്ങിയ ജീവികളെ മുഴുവൻ ഉൾക്കൊള്ളുന്നതായി വിവർത്തനം ചെയ്തു; അവസാനത്തെ ആവർത്തനം നിലനിർത്തി.
  alternative: അവസാനഭാഗം ‘ഭൂമിയിലെ സകല വന്യമൃഗങ്ങൾക്കുവേണ്ടിയും’ എന്നു കൃത്യരൂപത്തിൽ നൽകാം; അല്ലെങ്കിൽ അതിനെ വെറും സമാപനവിശദീകരണമായി ലയിപ്പിക്കാം.
  rationale: എബ്രായ വാക്യഘടന ചുരുങ്ങിയതും ആവർത്തനമുള്ളതുമാണ്. ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ജീവജാലങ്ങളുടെ വിശാലമായ ഉൾപ്പെടുത്തലും മൂലപാഠത്തിലെ വാക്യഘടനാപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കന്നുകാലികൾ’ എന്നും ‘വന്യമൃഗങ്ങൾ’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ വിഭാഗവ്യത്യാസം സൂക്ഷിച്ചു; ആവർത്തനം പൂർണമായി മിനുക്കിമാറ്റാതെ ഒരു അടിക്കുറിപ്പിലൂടെ വാക്യഘടനാപരമായ അനിശ്ചിതത്വം രേഖപ്പെടുത്തി.
