  rationale: പരിഷ്കരണം നָפְצָהയുടെ ചിതറൽ/വ്യാപനം എന്ന അടിസ്ഥാനസൂചന മുഖ്യവാചകത്തിൽത്തന്നെ നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘ഭൂമി ചിതറിപ്പാർത്തു’ എന്നു പറയുന്നത് അസ്വാഭാവികമായതിനാൽ, എബ്രായത്തിലെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയും മനുഷ്യവാസത്തിന്റെ സന്ദർഭവും വ്യക്തമായി പ്രകടമാക്കാൻ ‘ഭൂമിയാകെ ജനങ്ങൾ ചിതറിപ്പാർത്തു’ എന്നു നൽകി. അടിക്കുറിപ്പ് സ്വാഭാവികമായ ഒരു പര്യായവും മൂലപാഠത്തിന്റെ വ്യാകരണപരമായ രൂപവും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
