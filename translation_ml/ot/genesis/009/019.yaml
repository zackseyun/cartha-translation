reference: Genesis 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: ml
  text: ഇവർ മൂവരും നോഹയുടെ പുത്രന്മാരായിരുന്നു; ഇവരിൽനിന്ന് ഭൂമിയാകെ ജനങ്ങൾ ചിതറിപ്പാർത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇവരിൽനിന്ന് ഭൂമിയാകെ ജനങ്ങൾ പരന്നുപാർത്തു.” മൂലത്തിൽ ഭൂമി ‘ചിതറിപ്പരന്നു’ എന്നു പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: ഇവർ മൂവരും
  rationale: മുൻനിരയിൽ വരുന്ന എബ്രായ നാമവാക്യത്തിന്റെ ഊന്നലും നിർദേശകഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי נֹחַ
  choice: നോഹയുടെ പുത്രന്മാരായിരുന്നു
  rationale: എബ്രായത്തിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; വിവരണത്തിന്റെ ഭൂതകാലസന്ദർഭത്തിനനുസരിച്ച് മലയാളത്തിൽ ‘ആയിരുന്നു’ ചേർത്തു. ‘പുത്രന്മാർ’ ഗൗരവമുള്ളതും എളുപ്പം മനസ്സിലാകുന്നതുമായ നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: וּמֵאֵלֶּה
  choice: ഇവരിൽനിന്നാണ്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും മുമ്പ് പറഞ്ഞ മൂന്നു പുത്രന്മാരുമായുള്ള വ്യക്തമായ ബന്ധവും നിലനിർത്തുന്നു; ‘ആണ്’ ഫലത്തിന്റെ ഉറവിടത്തിന് സ്വാഭാവിക ഊന്നൽ നൽകുന്നു.
- source_word: נָפְצָה
  choice: ജനങ്ങളാൽ നിറഞ്ഞത്
  rationale: נפץ എന്ന ക്രിയയുടെ അടിസ്ഥാന ആശയം ചിതറുക/പരക്കുക എന്നതാണ്. ഇവിടെ പ്രളയാനന്തര വംശവ്യാപനമാണ് സന്ദർഭാർഥം; അതിനാൽ വായനാസൗകര്യത്തിനായി ‘ജനങ്ങളാൽ നിറഞ്ഞത്’ ഉപയോഗിച്ചു, കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כָל הָאָרֶץ
  choice: ഭൂമി മുഴുവൻ
  rationale: പ്രളയാനന്തര സർവമാനവസന്ദർഭത്തിൽ אֶרֶץ എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു; כָל നൽകുന്ന സമഗ്രത ‘മുഴുവൻ’കൊണ്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പ്രളയാനന്തര ജനതാവിവരണത്തിൽ הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമി മുഴുവൻ
  alternative: ദേശം മുഴുവൻ
  rationale: നോഹയുടെ പുത്രന്മാരിൽനിന്നുള്ള മനുഷ്യവംശവ്യാപനത്തെ സംഗ്രഹിക്കുന്ന സന്ദർഭം പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ സർവലോകവ്യാപകമായ ‘ഭൂമി’യെ പിന്തുണയ്ക്കുന്നു.
- issue: נָפְצָה എന്ന ക്രിയയുടെ രൂപകവും സന്ദർഭാർഥവും
  choice: ജനങ്ങളാൽ നിറഞ്ഞത്
  alternative: ചിതറിപ്പാർത്തു / വ്യാപിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാനത്തിൽ ചിതറലോ വ്യാപനമോ അടങ്ങിയിട്ടുണ്ടെങ്കിലും, വാക്യത്തിന്റെ സന്ദർഭത്തിൽ അവരുടെ സന്തതികളിലൂടെ ഭൂമി ജനവാസമുള്ളതായി എന്ന ഫലമാണ് ഉദ്ദേശിക്കുന്നത്. അടിസ്ഥാനരൂപകം നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇവർ മൂവരും’ എന്ന പ്രയോഗം എബ്രായത്തിലെ മുൻനിര ഊന്നൽ നിലനിർത്തുന്നു. മുഖ്യവാചകം സന്ദർഭാർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പ് മൂലക്രിയയിലെ ചിതറൽ/വ്യാപനം എന്ന സത്യസന്ധമായ അർഥസാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
