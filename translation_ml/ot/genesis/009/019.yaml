  naturalness: ‘ഇവർ മൂവരും നോഹയുടെ പുത്രന്മാരായിരുന്നു’ സ്വാഭാവികമായ നിലവാരമലയാളമാണ്. ‘ഇവരിൽനിന്നാണ് ഭൂമി മുഴുവൻ ജനങ്ങളാൽ നിറഞ്ഞത്’ വായനാസൗകര്യമുള്ളതാണെങ്കിലും, പരിഷ്കരിച്ച രൂപം മൂലക്രിയയുടെ അർഥം കൂടുതൽ നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
