id: GEN.9.5
reference: Genesis 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ രക്തത്തെ—നിങ്ങളുടെ ജീവനുവേണ്ടി—ഞാൻ തീർച്ചയായും കണക്കു ചോദിക്കും.[a][b] എല്ലാ മൃഗങ്ങളുടെയും കൈയിൽനിന്ന് അതിനെക്കുറിച്ച് ഞാൻ കണക്കു ചോദിക്കും; മനുഷ്യന്റെ കൈയിൽനിന്നും—ഓരോ മനുഷ്യന്റെയും സഹോദരന്റെ കൈയിൽനിന്നും—മനുഷ്യന്റെ ജീവനുവേണ്ടി ഞാൻ കണക്കു ചോദിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘നിങ്ങളുടെ രക്തം, നിങ്ങളുടെ ജീവനുവേണ്ടി.’ രക്തവും ജീവനും തമ്മിലുള്ള ബന്ധമാണ് ഹീബ്രു പ്രയോഗം എടുത്തുകാട്ടുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അതിന്റെ കണക്ക് ഞാൻ ആവശ്യപ്പെടും.’ ആവർത്തിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് രക്തച്ചൊരിച്ചിലിനെക്കുറിച്ച് കണക്ക് ആവശ്യപ്പെടുന്ന ന്യായവിധിഭാവമുണ്ട്.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘മനുഷ്യന്റെ കൈയിൽനിന്നും, ഓരോ മനുഷ്യന്റെയും സഹോദരന്റെ കൈയിൽനിന്നും, മനുഷ്യന്റെ ജീവനുവേണ്ടി ഞാൻ കണക്കു ചോദിക്കും.’ മറ്റൊരു മനുഷ്യന്റെ ജീവനോടുള്ള വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തെ ഈ പ്രയോഗം ഊന്നിപ്പറയുന്നു.'
    reason: syntax_clarification
lexical_decisions:
- source_word: וְאַךְ
  choice: എന്നാൽ ... തീർച്ചയായും
  rationale: וְ എന്ന ബന്ധകത്തെയും אַךְ എന്ന പദത്തിന്റെ ഊന്നലും നിയന്ത്രണഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: നിങ്ങളുടെ ജീവരക്തത്തിന്
  rationale: രക്തവും ജീവനും തമ്മിലുള്ള അടുത്ത ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രുവിലെ രണ്ടു വ്യത്യസ്ത പദങ്ങളുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶדְרֹשׁ
  choice: കണക്കു ചോദിക്കും
  rationale: രക്തച്ചൊരിച്ചിലിന് ഉത്തരവാദിത്വം ആവശ്യപ്പെടുന്ന ന്യായവിധിസംബന്ധമായ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִיַּד
  choice: കൈയിൽനിന്നും
  rationale: ഉത്തരവാദിയായ കർത്താവിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിലെ ‘കൈ’ എന്ന പ്രതീകം ആവർത്തനത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: כָּל חַיָּה
  choice: ഓരോ മൃഗം
  rationale: ഇവിടെ മനുഷ്യനോട് വിരുദ്ധമായി പറയുന്ന ജന്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ജീവി’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: אִישׁ אָחִיו
  choice: ഓരോരുത്തൻ ... അവന്റെ സഹോദരൻ
  rationale: മറ്റൊരു മനുഷ്യന്റെ ജീവനോടുള്ള വ്യക്തിപരമായ ഉത്തരവാദിത്വവും മൂലപാഠത്തിലെ ബന്ധുത്വഭാഷയും നിലനിർത്തുന്നു.
- source_word: נֶפֶשׁ הָאָדָם
  choice: അവന്റെ സഹോദരന്റെ ജീവന്
  rationale: ഈ രക്തച്ചൊരിച്ചിൽസന്ദർഭത്തിൽ נֶפֶשׁ എന്നത് ശരീരരഹിതമായ ആത്മാവിനേക്കാൾ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ആവർത്തിച്ച ‘മനുഷ്യൻ’ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധപദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രക്തച്ചൊരിച്ചിൽസന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: വാക്യം രക്തത്തെയും മനുഷ്യജീവൻ എടുത്തതിനുള്ള കണക്കിനെയും ബന്ധിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠം മുൻനിർത്താത്ത ശരീര–ആത്മ ദ്വൈതധാരണ സൂചിപ്പിച്ചേക്കാം.
- issue: മനുഷ്യനും ‘സഹോദരനും’ തമ്മിലുള്ള ബന്ധം
  choice: സഹോദരൻ എന്ന മൂലരൂപകം നിലനിർത്തുക
  alternative: സഹമനുഷ്യൻ
  rationale: ‘സഹമനുഷ്യൻ’ അർഥം വ്യക്തമാക്കുമെങ്കിലും, אִישׁ אָחִיו എന്ന പദസമുച്ചയത്തിലെ ബന്ധുത്വഭാവം നഷ്ടപ്പെടുത്തും.
- issue: മൃഗത്തിന്റെയും മനുഷ്യന്റെയും ഉത്തരവാദിത്വം
  choice: രണ്ടിടത്തും ‘കൈയിൽനിന്നും’ എന്നും ‘കണക്കു ചോദിക്കും’ എന്നും നൽകുക
  alternative: മൃഗത്തെയും മനുഷ്യനെയും ശിക്ഷിക്കും
  rationale: മൂലപാഠം ശിക്ഷയുടെ കൃത്യരൂപം പറയാതെ കണക്കു ചോദിക്കുന്ന ന്യായവിധിഭാവം മാത്രം വ്യക്തമാക്കുന്നു; അതിനാൽ അതിലധികം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘കണക്കു ചോദിക്കും’ എന്നത് ന്യായവിധിഭാവം സ്വാഭാവികമായി നൽകുന്നു. ‘മൃഗത്തിന്റെ കൈ’ മലയാളത്തിൽ അപൂർവമായിരുന്നാലും, ഹീബ്രുവിലെ ആവർത്തിച്ച നിയമരൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു.
