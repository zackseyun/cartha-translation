id: GEN.9.28
reference: Genesis 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי נֹ֖חַ אַחַ֣ר הַ/מַּבּ֑וּל שְׁלֹ֤שׁ מֵאוֹת֙ שָׁנָ֔ה וַֽ/חֲמִשִּׁ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/028.yaml
  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: ml
  text: പ്രളയത്തിനുശേഷം നോഹ മുന്നൂറ്റമ്പത് വർഷം ജീവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: חיה എന്ന ക്രിയയുടെ വയിഖ്തോൽ രൂപം പ്രളയത്തിനുശേഷമുള്ള നോഹയുടെ ആയുസ്സിന്റെ ദൈർഘ്യം വിവരിക്കുന്നു. ‘ജീവിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്; ‘അതിജീവിച്ചു’ എന്നു പറഞ്ഞാൽ രക്ഷപ്പെട്ട സംഭവത്തിനാണ് അനാവശ്യമായ ഊന്നൽ ലഭിക്കുക.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: אַחַר
  choice: ശേഷം
  rationale: പിന്നീടുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന കാലിക അവ്യയം; ‘പ്രളയത്തിനുശേഷം’ എന്ന സംയുക്തരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַמַּבּוּל
  choice: പ്രളയം
  rationale: മുൻവിവരണത്തിൽ അറിയപ്പെടുന്ന മഹാപ്രളയത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടനാമം. മലയാളത്തിൽ ‘പ്രളയം’ വ്യക്തവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: മുന്നൂറ്റമ്പത് വർഷം
  rationale: ‘മുന്നൂറും അമ്പതും വർഷം’ എന്ന ഹീബ്രായ സംഖ്യാഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തസംഖ്യയായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. മൂലപാഠത്തിന്റെ കാലക്രമവും ആയുസ്സുസംബന്ധിയായ പ്രസ്താവനയും സംക്ഷിപ്തമായി നിലനിർത്തി; അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
