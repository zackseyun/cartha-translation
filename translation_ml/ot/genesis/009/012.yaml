  to: 'ദൈവം പറഞ്ഞു: “ഞാനും നിങ്ങളും നിങ്ങളോടൊപ്പമുള്ള സകല ജീവജന്തുക്കളും തമ്മിൽ തലമുറതലമുറകളിലേക്കായി ഞാൻ നൽകുന്ന ഉടമ്പടിയുടെ അടയാളം ഇതാണ്:”'
  rationale: The revision replaces the deontic wording “നിലനിൽക്കേണ്ട” with “തലമുറതലമുറകളിലേക്കായി,” which conveys the enduring generational scope of לְדֹרֹת עוֹלָם without adding an obligation. The possessive construction “ഉടമ്പടിയുടെ അടയാളം” naturally represents “the sign of the covenant,” while the following “ഞാൻ നൽകുന്ന” continues to qualify the covenant in a natural Malayalam word order.
