id: GEN.9.12
reference: Genesis 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “ഞാനും നിങ്ങളും നിങ്ങളോടൊപ്പമുള്ള സകല ജീവജന്തുക്കളും തമ്മിൽ തലമുറതലമുറകളിലേക്കായി ഞാൻ നൽകുന്ന ഉടമ്പടിയുടെ അടയാളം ഇതാണ്:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ വാക്യക്രമം തന്നെയാണ് ഈ തുടർച്ച സ്വാഭാവികമായി അറിയിക്കുന്നത്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: നോഹയോടു സംസാരിക്കുന്ന ഏകദൈവമാണ് സന്ദർഭത്തിലെ സൂചിതൻ; ആധുനിക നിലവാര മലയാളത്തിലെ പതിവായ രൂപം.
- source_word: אוֹת
  choice: അടയാളം
  rationale: കാണാവുന്ന സൂചനയെയോ ചിഹ്നത്തെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള മഴവില്ലിന്റെ സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: הַבְּרִית
  choice: ഉടമ്പടി
  rationale: ഉല്പത്തിയിലെ പ്രധാന ഉടമ്പടിപദത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള പരിഭാഷ.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ഞാൻ നൽകുന്ന
  rationale: നֹתֵן എന്ന എബ്രായ വർത്തമാന കൃദന്തരൂപത്തിന്റെ ‘നൽകുന്നു’ എന്ന അർത്ഥവും തുടരുന്ന പ്രവർത്തനഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: ഞാനും നിങ്ങളും ... തമ്മിൽ
  rationale: എബ്രായത്തിലെ ആവർത്തിതമായ ‘ഇടയിൽ’ എന്ന ഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ സഹപങ്കാളി-‘തമ്മിൽ’ ഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: സകല ജീവജന്തുക്കളും
  rationale: ഇവിടെ മനുഷ്യാത്മാവല്ല, നോഹയോടൊപ്പമുള്ള ജീവികളാണ് പരിധിയിൽ; ‘ജീവജന്തുക്കൾ’ ആ വ്യാപ്തി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പമുള്ള
  rationale: നോഹയോടും കുടുംബത്തോടും കൂടെയുള്ള ജീവികളെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നു.
- source_word: לְדֹרֹת עוֹלָם
  choice: തലമുറതലമുറയായി എന്നേക്കും നിലനിൽക്കേണ്ട
  rationale: דֹרֹת എന്ന തലമുറാഭാവവും עוֹלָם എന്ന ദീർഘകാല/നിരന്തരതാഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ഇത് അടയാളത്തേക്കാൾ ഉടമ്പടിയുടെ ദൈർഘ്യത്തോടാണ് സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നത്.
theological_decisions:
- issue: നֹתֵן എന്ന ഉടമ്പടിസന്ദർഭത്തിലെ ക്രിയ
  choice: ഞാൻ നൽകുന്ന
  alternative: ഞാൻ സ്ഥാപിക്കുന്ന
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘നൽകുന്ന’ എന്നാണ്. മലയാളത്തിൽ ഇതു മനസ്സിലാക്കാവുന്നതിനാൽ ‘സ്ഥാപിക്കുന്ന’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലത്തിലെ രൂപകം നിലനിർത്തി.
- issue: נֶפֶשׁ חַיָּה എന്നതിന്റെ വ്യാപ്തി
  choice: സകല ജീവജന്തുക്കളും
  alternative: സകല ജീവനുള്ള ആത്മാക്കളും
  rationale: നോഹയുടെ സന്ദർഭത്തിൽ മൃഗങ്ങളും ഉൾപ്പെടുന്നു; ‘ആത്മാക്കൾ’ എന്നു പറഞ്ഞാൽ മൂലവാക്യം ഉദ്ദേശിക്കാത്ത മനുഷ്യശാസ്ത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ ധാരണ കടന്നുവരാം.
- issue: לְדֹרֹת עוֹלָם എന്ന കാലവ്യാപ്തി
  choice: തലമുറതലമുറയായി എന്നേക്കും നിലനിൽക്കേണ്ട
  alternative: എല്ലാ തലമുറകളിലും
  rationale: തലമുറകളുടെ തുടർച്ചയും ദീർഘസ്ഥായിത്വവും രണ്ടും നിലനിർത്തുന്നു; കാലപരിധിയെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു നിലനിർത്തി. സാങ്കേതികമോ സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
