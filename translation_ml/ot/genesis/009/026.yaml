id: GEN.9.26
reference: Genesis 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ശേമിന്റെ ദൈവമായ യഹോവ വാഴ്ത്തപ്പെട്ടവൻ! കനാൻ അവരുടെ[a] ദാസനായിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവന്റെ.” എബ്രായപദം രൂപപരമായി “അവരുടെ” എന്നാണ്; ഇവിടെ അത് ആരെ സൂചിപ്പിക്കുന്നു എന്നതിൽ അവ്യക്തതയുണ്ട്.'
    reason: לָמוֹ എന്ന രൂപം ബഹുവചനമായിരുന്നാലും കാവ്യപ്രയോഗത്തിൽ ഏകവചനമായി വ്യാഖ്യാനിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ മൂലത്തിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ദൈവത്തെ അനുഗൃഹീതനായി പ്രഖ്യാപിക്കുന്ന എബ്രായ സ്തുതിപ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ പൊതുപദമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: ഇവിടെ കീഴ്പ്പെട്ട സേവകസ്ഥിതിയെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ സമാനപദം.
- source_word: לָמוֹ
  choice: അവരുടെ
  rationale: രൂപപരമായി മൂന്നാം പുരുഷ ബഹുവചനസൂചകമായതിനാൽ അതിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം സന്ദർഭത്തിലെ പരാമർശവ്യക്തതക്കുറവ് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുഗ്രഹവാക്ക് ശേമിനെയോ യഹോവയെയോ ലക്ഷ്യമാക്കുന്നതാണോ
  choice: “ശേമിന്റെ ദൈവമായ യഹോവ വാഴ്ത്തപ്പെട്ടവൻ”
  alternative: “യഹോവ ശേമിനെ അനുഗ്രഹിക്കട്ടെ”
  rationale: എബ്രായ വ്യാകരണത്തിൽ בָּרוּךְ എന്ന വിശേഷണം യഹോവയോടാണ് ചേരുന്നത്; അതിനാൽ ദൈവത്തോടുള്ള സ്തുതിയായി വിവർത്തനം ചെയ്തു.
- issue: לָמוֹ എന്ന സർവനാമപ്രത്യയത്തിന്റെ എണ്ണംയും സൂചനയും
  choice: “അവരുടെ”
  alternative: “അവന്റെ”
  rationale: മസോററ്റിക് പാഠത്തിലെ പ്രത്യയം രൂപപരമായി ബഹുവചനമാണ്. എന്നാൽ ചില സന്ദർഭങ്ങളിൽ ഇത് കാവ്യാത്മക ഏകവചനമായി മനസ്സിലാക്കപ്പെടുന്നതിനാൽ പര്യാപ്തവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. പ്രവചനാത്മക ആശംസയുടെ ഭാവം ‘ആയിരിക്കട്ടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
