id: GEN.9.27
reference: Genesis 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: ml
  text: ദൈവം യാഫെത്തിന് വിശാലത നൽകട്ടെ; അവൻ ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ[a]; കനാൻ അവർക്കു അടിമയായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ”; മറ്റൊരു സാധ്യത, “യാഫെത് ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ.” ‘വസിക്കട്ടെ’ എന്ന ക്രിയയുടെ കർത്താവ് എബ്രായപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: വിശാലത നൽകട്ടെ
  rationale: ഇവിടെയുള്ള ക്രിയയ്ക്ക് ‘വിശാലമാക്കുക/ഇടം വർധിപ്പിക്കുക’ എന്ന ആശയമാണ്. യാഫെത് എന്ന പേരുമായുള്ള എബ്രായ ശബ്ദക്രീഡ മലയാളത്തിൽ പൂർണമായി പുനരാവിഷ്കരിക്കാനാകാത്തതിനാൽ അർത്ഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപപരമായി ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഏകവചന ക്രിയാസന്ദർഭവും ഇവിടെ സൂചിപ്പിക്കുന്ന ഏകദൈവവും കാരണം ഏകവചനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְיֶפֶת
  choice: യാഫെത്തിന്
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ഗുണഭോക്തൃഭാവം ‘യാഫെത്തിന്’ എന്ന ദത്തിവിഭക്തിയിലൂടെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְיִשְׁכֹּן
  choice: അവൻ ... വസിക്കട്ടെ
  rationale: ആശംസാസൂചകമായ ജസ്സീവ് ഭാവം ‘വസിക്കട്ടെ’ എന്ന് നൽകി. ‘അവൻ’ ദൈവത്തെയോ യാഫെത്തിനെയോ സൂചിപ്പിക്കാമെന്ന മൂലപാഠത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: ശേമിന്റെ കൂടാരങ്ങളിൽ
  rationale: സ്ഥലസൂചകമായ പ്രയോഗവും ‘കൂടാരങ്ങൾ’ എന്ന ദൃശ്യബിംബവും അക്ഷുണ്ണമായി നിലനിർത്തുന്നു.
- source_word: וִיהִי
  choice: ആയിരിക്കട്ടെ
  rationale: അനുഗ്രഹ/ശാപപ്രഖ്യാപനത്തിലെ ജസ്സീവ് ഭാവം സ്വാഭാവികമായ മലയാള ആശംസാരൂപത്തിൽ നൽകുന്നു.
- source_word: כְנַעַן
  choice: കനാൻ
  rationale: വ്യക്തിയെയും അവന്റെ വംശരേഖയെയും സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: ഇവിടെ കീഴ്പ്പെടുത്തപ്പെട്ട ബന്ധിതപദവി പ്രധാനമായതിനാൽ അർത്ഥം മൃദൂകരിക്കുന്ന ‘ദാസൻ/ശുശ്രൂഷകൻ’ എന്നതിനു പകരം ‘അടിമ’ ഉപയോഗിക്കുന്നു.
- source_word: לָמוֹ
  choice: അവർക്ക്
  rationale: ഇവിടെയുള്ള സർവനാമരൂപം സാധാരണയായി ബഹുവചനമായി മനസ്സിലാക്കപ്പെടുകയും സന്ദർഭത്തിൽ ശേമിനെയും യാഫെത്തിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ’ എന്നതിലെ കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ’ എന്ന് നൽകി, കർത്താവ് ദൈവമാണോ യാഫെത്താണോ എന്നു നിർണ്ണയിക്കാതെ വിടുന്നു.
  alternative: ‘ദൈവം ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ’ അല്ലെങ്കിൽ ‘യാഫെത് ശേമിന്റെ കൂടാരങ്ങളിൽ വസിക്കട്ടെ.’
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗ ക്രിയയ്ക്ക് വ്യക്തമായ കർത്താവ് രേഖപ്പെടുത്തിയിട്ടില്ല; സന്ദർഭത്തിൽ ദൈവവും യാഫെത്തും വ്യാകരണപരമായി സാധ്യതകളാണ്. അതിനാൽ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആശംസാപരമായ ജസ്സീവ് രൂപങ്ങൾ ‘നൽകട്ടെ,’ ‘വസിക്കട്ടെ,’ ‘ആയിരിക്കട്ടെ’ എന്ന സമാന്തരഘടനയിൽ നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ കൂടാരബിംബവും കർത്തൃഅനിശ്ചിതത്വവും സംരക്ഷിച്ചിട്ടുണ്ട്.
