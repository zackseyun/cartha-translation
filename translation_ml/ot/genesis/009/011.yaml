id: GEN.9.11
reference: Genesis 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളുമായി എന്റെ ഉടമ്പടി സ്ഥാപിക്കും: ഇനിയൊരിക്കലും പ്രളയജലത്താൽ സകല ജീവജാലങ്ങളും നശിപ്പിക്കപ്പെടുകയില്ല[a][b]; ഭൂമിയെ നശിപ്പിക്കാൻ ഇനിയൊരിക്കലും ഒരു പ്രളയം ഉണ്ടാകുകയുമില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നശിപ്പിക്കപ്പെടുകയില്ല’ എന്നതിനു ‘ഛേദിക്കപ്പെടുകയില്ല’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘ഛേദിക്കപ്പെടുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സകല ജീവജാലങ്ങളും’ എന്നത് എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘സകല ജഡവും’ എന്ന പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു; അത് മനുഷ്യരെ മാത്രം അല്ല, ജീവജാലങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ഞാൻ ... സ്ഥാപിക്കും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഉടമ്പടിയോടൊപ്പം ‘സ്ഥാപിക്കുക/ഉറപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു. വാഗ്ദാനസന്ദർഭത്തിലെ ഭാവികാലവും ഉടമ്പടിയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ഉല്പത്തിയിൽ ആവർത്തിക്കുന്ന പ്രാമാണിക ഉടമ്പടിപദമാണ്; സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടുള്ള
  rationale: ബഹുവചന അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִכָּרֵת
  choice: ഛേദിക്കപ്പെടുകയില്ല
  rationale: כרת എന്ന ക്രിയയുടെ അക്ഷരാർഥമായ ‘ഛേദിക്കപ്പെടുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അത് നാശത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്കായി പാദക്കുറിപ്പിൽ വ്യാഖ്യാനം നൽകുന്നു.
- source_word: כָּל בָּשָׂר
  choice: സകല ജഡവും
  rationale: മനുഷ്യരിൽ മാത്രം ഒതുക്കാതെ ജീവജാലങ്ങളെ വിശാലമായി ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: עוֹד
  choice: ഇനിയൊരിക്കലും
  rationale: നിഷേധത്തോടു ചേർന്ന ആവർത്തനപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מִמֵּי הַמַּבּוּל
  choice: പ്രളയജലത്താൽ
  rationale: מן ഇവിടെ നാശത്തിന്റെ മാർഗമോ കാരണമോ സൂചിപ്പിക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: מַבּוּל
  choice: പ്രളയം
  rationale: നോഹയുടെ വിവരണത്തിലെ പ്രത്യേക മഹാപ്രളയത്തിന് മലയാളത്തിൽ പതിവായ പദം.
- source_word: לְשַׁחֵת
  choice: നശിപ്പിക്കാൻ
  rationale: שׁחת സൂചിപ്പിക്കുന്ന വിനാശകരമായ പ്രവർത്തനം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ഭൂമിയെ
  rationale: പ്രളയസന്ദർഭത്തിലെ വിശാലമായ വ്യാപ്തിക്ക് ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു; പ്രാദേശികമെന്ന വ്യാഖ്യാനം വിവർത്തനത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടിവാഗ്ദാനത്തിലെ ‘സകല ജഡവും’ എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരെ മാത്രം സൂചിപ്പിക്കാതെ ‘സകല ജഡവും’ എന്ന് വിശാലമായി നിലനിർത്തി.
  alternative: സകല മനുഷ്യരും / സകല ജീവജാലങ്ങളും
  rationale: പ്രളയാനന്തര ഉടമ്പടിയിൽ മനുഷ്യരും മൃഗങ്ങളും ഉൾപ്പെടുന്നു. ഉറവിടത്തിലെ രൂപവും അർഥവ്യാപ്തിയും നിലനിർത്തുകയും അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: קום ഉപയോഗിച്ചുള്ള ഉടമ്പടിപ്രയോഗം
  choice: ‘എന്റെ ഉടമ്പടി സ്ഥാപിക്കും’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: എന്റെ ഉടമ്പടി ഉറപ്പിക്കും / നിലനിർത്തും
  rationale: ഉടമ്പടി പുതുതായി ഏർപ്പെടുത്തുന്നതാണോ ഔപചാരികമായി സ്ഥിരീകരിക്കുന്നതാണോ എന്ന സൂക്ഷ്മത വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കാതെ, ഗൗരവമുള്ളതും സമതുലിതവുമായ പ്രയോഗം നൽകുന്നു.
- issue: הָאָרֶץ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘ഭൂമി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ദേശം
  rationale: പ്രളയവിവരണത്തിന്റെയും ഉടമ്പടിവാഗ്ദാനത്തിന്റെയും വിശാലമായ ഭാഷയ്ക്ക് ‘ഭൂമി’ യോജിക്കുന്നു; എങ്കിലും ഈ ഒറ്റ പദത്തെ ആശ്രയിച്ച് പിന്നീടുള്ള ഭൂമിശാസ്ത്രവാദങ്ങളെ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ഉടമ്പടിശൈലി നിലനിർത്തി. ‘സകല ജഡവും’, ‘ഛേദിക്കപ്പെടുക’ എന്നീ ഉറവിടസന്നിഹിത പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് അല്പം ഔപചാരികമായതിനാൽ പാദക്കുറിപ്പുകൾ ചേർത്തു. പ്രധാനവാക്യത്തിലെ പാദക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദക്രമത്തിൽ [a][b] ആയി നൽകിയിരിക്കുന്നു.
