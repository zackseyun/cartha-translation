revisions:
- from: 'ഞാൻ നിങ്ങളോടുള്ള എന്റെ ഉടമ്പടി സ്ഥാപിക്കും: ഇനിയൊരിക്കലും പ്രളയജലത്താൽ സകല ജഡവും ഛേദിക്കപ്പെടുകയില്ല[a][b]; ഭൂമിയെ നശിപ്പിക്കാൻ ഇനിയൊരിക്കലും ഒരു പ്രളയം ഉണ്ടാകുകയുമില്ല.'
  to: 'ഞാൻ നിങ്ങളുമായി എന്റെ ഉടമ്പടി സ്ഥാപിക്കും: ഇനിയൊരിക്കലും പ്രളയജലത്താൽ സകല ജീവജാലങ്ങളും നശിപ്പിക്കപ്പെടുകയില്ല[a][b]; ഭൂമിയെ നശിപ്പിക്കാൻ ഇനിയൊരിക്കലും ഒരു പ്രളയം ഉണ്ടാകുകയുമില്ല.'
  rationale: The revision corrects the covenant relation to ‘with you’ and replaces two formally literal but awkward Malayalam expressions with idiomatic equivalents. The footnotes retain the Hebrew lexical imagery and scope, so the translation neither narrows ‘all flesh’ to humanity nor suppresses the ‘cut off’ wording.
