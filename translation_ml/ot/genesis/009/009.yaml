id: GEN.9.9
reference: Genesis 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: ml
  text: ഞാനോ, ഇതാ, നിങ്ങളോടും നിങ്ങൾക്കുശേഷമുള്ള നിങ്ങളുടെ സന്തതിയോടും[a] എന്റെ ഉടമ്പടി സ്ഥാപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സന്തതി’ എന്ന എബ്രായപദം കൂട്ടായ അർഥത്തിൽ പിൻതലമുറക്കാരെയോ വംശജരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ഞാനോ
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ ഈ പ്രയോഗത്തിലെ നേരിയ ഊന്നലും പ്രഭാഷണത്തിലെ ശ്രദ്ധാമാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ
  rationale: തുടർന്നുള്ള ദൈവിക പ്രഖ്യാപനത്തിലേക്കു ഗൗരവപൂർവം ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചകത്തിന്റെ ധ്വനി നിലനിർത്തുന്നു.
- source_word: מֵקִים
  choice: സ്ഥാപിക്കുന്നു
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഉടമ്പടി നിലവിൽ വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥിരീകരിക്കുന്നു’ എന്നു വിവർത്തനം ചെയ്താൽ മുൻപുണ്ടായിരുന്ന ഉടമ്പടി വീണ്ടും ഉറപ്പിക്കുന്നു എന്ന അധികസൂചന വരാം.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ദൈവവും മനുഷ്യരും തമ്മിലുള്ള ഔപചാരിക ബന്ധത്തെ സൂചിപ്പിക്കുന്ന בְּרִית എന്ന പ്രധാന ബൈബിൾപദത്തിന്റെ സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടും
  rationale: ഉടമ്പടിയിൽ നോഹയും കൂടെയുള്ളവരും ഉൾപ്പെടുന്ന ബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאֶת זַרְעֲכֶם
  choice: നിങ്ങളുടെ സന്തതിയോടും
  rationale: זֶרַע എന്ന കൂട്ടായ ഏകവചനപദത്തിന്റെ ‘സന്തതി/പിൻതലമുറ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വിത്ത്’ ഇവിടെ ആധുനിക മലയാളത്തിൽ അനാവശ്യമായ അസ്വാഭാവികത സൃഷ്ടിക്കും.
- source_word: אַחֲרֵיכֶם
  choice: നിങ്ങൾക്കുശേഷമുള്ള
  rationale: തുടർന്നുവരുന്ന തലമുറകളെ സൂചിപ്പിക്കുന്ന ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവ-മനുഷ്യ ബന്ധത്തിലെ בְּרִית എന്ന പദം
  choice: എന്റെ ഉടമ്പടി
  alternative: എന്റെ കരാർ
  rationale: ‘ഉടമ്പടി’ ബൈബിൾസന്ദർഭത്തിലെ പ്രത്യേക ബന്ധവിഭാഗം നിലനിർത്തുന്നു; ‘കരാർ’ അതിനെ സാധാരണ നിയമപരമോ വാണിജ്യപരമോ ആയ ഇടപാടായി ചുരുക്കാൻ ഇടയുണ്ട്.
- issue: זֶרַע എന്ന കൂട്ടായ പദത്തിന്റെ വ്യാപ്തി
  choice: നിങ്ങളുടെ സന്തതി
  alternative: നിങ്ങളുടെ വംശജർ
  rationale: ‘സന്തതി’ എബ്രായത്തിലെ കൂട്ടായ ഏകവചനസ്വഭാവവും തുടർതലമുറകളിലേക്കുള്ള തുറന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു; ‘വംശജർ’ അർഥം വ്യക്തമാക്കുന്ന സാധുവായ മറ്റൊരു വായനയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഞാനോ, ഇതാ’ എന്ന ക്രമം മൂലപാഠത്തിലെ ഊന്നലും ഉടമ്പടിപ്രഖ്യാപനത്തിന്റെ ഔന്നത്യവും നിലനിർത്തുന്നു.
