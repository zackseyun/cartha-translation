source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: ml
  text: എന്നാൽ മാംസം അതിന്റെ ജീവനോടുകൂടെ—അതായത്, അതിന്റെ രക്തത്തോടുകൂടെ—നിങ്ങൾ തിന്നരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്നാൽ ജീവനോടുകൂടിയ മാംസം—അതിന്റെ രക്തം—നിങ്ങൾ തിന്നരുത്.”'
    reason: ഹീബ്രുവിലെ സംക്ഷിപ്തമായ സമാനാധികരണ പദക്രമം കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന പരിഭാഷാമാർഗം.
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മൃഗങ്ങളെ ആഹാരമായി അനുവദിക്കുന്ന മുൻവാക്യത്തിന് ഒരു നിയന്ത്രണം അവതരിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികമായ വൈരുധ്യസൂചകമായി ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: בָּשָׂר
  choice: മാംസം
  rationale: ഇവിടെ ഭക്ഷിക്കപ്പെടുന്ന ജന്തുവിന്റെ flesh എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ‘മാംസം’ നൽകുന്നു.
- source_word: בְּנַפְשׁוֹ
  choice: അതിന്റെ ജീവനോടുകൂടെ
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ജീവനെ സൂചിപ്പിക്കുന്നു; בְ എന്ന ഉപസർഗത്തിന്റെ സഹവർത്തിത്വഭാവവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: דָמוֹ
  choice: അതിന്റെ രക്തത്തോടുകൂടെ
  rationale: דָם എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘രക്തം’ നിലനിർത്തി; ‘ജീവരക്തം’ എന്നു വ്യാഖ്യാനിച്ച് രണ്ടു പദങ്ങളെയും ലയിപ്പിച്ചില്ല.
- source_word: לֹא תֹאכֵלוּ
  choice: നിങ്ങൾ തിന്നരുത്
  rationale: ബഹുവചന അഭിസംബോധനയും നിയമപരമായ വിലക്കും വ്യക്തമായി, എന്നാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: נֶפֶשׁ എന്ന പദവും രക്തവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘അതായത്’ ഉപയോഗിച്ച് രക്തത്തെ വിശദീകരണാത്മക സമാനാധികരണമായി അവതരിപ്പിച്ചു.
  alternative: ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ ‘ജീവരക്തം’ എന്ന ഒറ്റപദസമാനമായ ആശയത്തിൽ ലയിപ്പിക്കുക.
  rationale: സന്ദർഭത്തിൽ נֶפֶשׁ ജീവശക്തിയെയോ ജീവനെയോ സൂചിപ്പിക്കുന്നു. ‘ആത്മാവ്’ എന്നത് പാഠം ആവശ്യപ്പെടാത്ത പിൽക്കാല ദൈവശാസ്ത്രപരമായ അർഥം കൊണ്ടുവരാം. അതേസമയം, ഹീബ്രു പദക്രമത്തിലെ ജീവൻ–രക്തം ബന്ധം മായ്ച്ചുകളയാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തിന്നരുത്’ വിലക്കിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; ‘അതായത്’ ഹീബ്രുവിലെ ദുഷ്കരമായ ചേർത്തുവെപ്പിനെ വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കുന്നു.
