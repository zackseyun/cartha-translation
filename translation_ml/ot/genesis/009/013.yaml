source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: ml
  text: ഞാൻ എന്റെ വില്ല് മേഘത്തിൽ വെച്ചിരിക്കുന്നു[a]; അത് എനിക്കും ഭൂമിക്കും ഇടയിലുള്ള ഉടമ്പടിയുടെ അടയാളമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ മഴവില്ല്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ വില്ല്’ എന്നാണ്; ആയുധമായ വില്ലിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം തന്നെയാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്. മേഘത്തിലുള്ള വില്ല് എന്ന ഈ സന്ദർഭത്തിൽ അത് മഴവില്ലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: എന്റെ വില്ല്
  rationale: קֶשֶׁת എന്നത് സാധാരണയായി വില്ല്, പ്രത്യേകിച്ച് ആയുധമായ വില്ല്, എന്നാണ്. മേഘത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് മഴവില്ലാണെങ്കിലും, എബ്രായത്തിലെ ദൃശ്യബിംബം നിലനിർത്താൻ പ്രധാന പാഠത്തിൽ ‘എന്റെ വില്ല്’ എന്നും സന്ദർഭപരമായ അർഥം അടിക്കുറിപ്പിലും നൽകിയിരിക്കുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ സ്ഥാപിച്ചിരിക്കുന്നു
  rationale: נתן എന്നതിന് കൊടുക്കുക, വെക്കുക, സ്ഥാപിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. മേഘത്തിൽ വില്ലിനെ വെച്ചിരിക്കുന്ന പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ഈ രൂപം യോജിക്കുന്നു.
- source_word: בֶּעָנָן
  choice: മേഘത്തിൽ
  rationale: മൂലപാഠത്തിൽ നാമം ഏകവചനത്തിലാണ്. അതിനാൽ പൊതുവായ അർഥത്തിൽ ‘മേഘത്തിൽ’ എന്ന നേരിട്ടുള്ള പരിഭാഷ സ്വീകരിച്ചു.
- source_word: וְהָיְתָה
  choice: അത് ... ആയിരിക്കും
  rationale: 'ഈ സന്ദർഭത്തിൽ സംയോജകത്തോടുകൂടിയ ക്രിയാരൂപം ഭാവി/ഫലസൂചന നൽകുന്നു: സ്ഥാപിച്ച വില്ല് ഉടമ്പടിയുടെ അടയാളമായി പ്രവർത്തിക്കും.'
- source_word: לְאוֹת בְּרִית
  choice: ഉടമ്പടിയുടെ അടയാളം
  rationale: אוֹת എന്നത് അടയാളം അഥവാ ചിഹ്നം എന്നും בְּרִית എന്നത് ഉടമ്പടി എന്നും അർഥമാക്കുന്നു. സമീപസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന നിർദിഷ്ട ഉടമ്പടിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: എനിക്കും ഭൂമിക്കും ഇടയിലുള്ള
  rationale: אֶרֶץ എന്നതിന് ദേശം എന്നും ഭൂമി എന്നും അർഥമാകാം. പ്രളയവിവരണത്തിലെ സാർവലൗകിക വ്യാപ്തി പരിഗണിച്ച് ‘ഭൂമി’ സ്വീകരിച്ചു.
theological_decisions:
- issue: ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ קַשְׁתִּי എന്നതിന്റെ സൂചിതാർഥം
  choice: പ്രധാന പാഠത്തിൽ അക്ഷരാർഥമായ ‘വില്ല്’ നിലനിർത്തി; സന്ദർഭത്തിൽ അത് മഴവില്ലിനെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: എന്റെ മഴവില്ല്
  rationale: മൂല എബ്രായം സാധാരണ ‘വില്ല്’ എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിലെ ആയുധ-വില്ലിന്റെ ദൃശ്യബിംബവും സാധ്യതയുള്ള ആശയപിരിമുറുക്കവും നിലനിർത്താൻ ‘വില്ല്’ പ്രധാന പാഠത്തിൽ സൂക്ഷിച്ചു; ആകാശത്തിലെ പ്രതിഭാസം ഉദ്ദേശിക്കുന്നതെന്ന് വായനക്കാരന് വ്യക്തമാക്കാൻ പകരംവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വില്ല്’ എന്ന മൂലബിംബം സംരക്ഷിച്ചുകൊണ്ട്, ‘മഴവില്ല്’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
