source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: ml
  text: അപ്പോൾ ശേമും യാഫെത്തും ആ വസ്ത്രം[a] എടുത്ത് ഇരുവരുടെയും തോളുകളിൽ ഇട്ടു; അവർ പിന്നോക്കം നടന്ന് തങ്ങളുടെ പിതാവിന്റെ നഗ്നത മൂടി. അവരുടെ മുഖങ്ങൾ പിന്നോക്കമായിരുന്നു; അവർ തങ്ങളുടെ പിതാവിന്റെ നഗ്നത കണ്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേലങ്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദം നോഹയെ മൂടാൻ ഉപയോഗിച്ച ഒരു പുറംവസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാള ക്രിയാനുക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; ഏകവചനരൂപം സംയുക്ത കർത്താവിനോടുകൂടിയ ഹീബ്രായ പ്രയോഗമായി നിലനിൽക്കുന്നതിനാൽ മലയാളത്തിൽ അർഥപരമായി സ്വാഭാവികമാക്കി.
- source_word: שֵׁם וָיֶפֶת
  choice: ശേമും യാഫെത്തും
  rationale: ഹീബ്രായ പേരുകളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: הַשִּׂמְלָה
  choice: ആ പുറങ്കുപ്പായം
  rationale: שׂמלה ഒരു പുറംവസ്ത്രത്തെയോ മേലങ്കിയെയോ സൂചിപ്പിക്കുന്നു. നിർദ്ദിഷ്ടപദത്തിലെ article മുമ്പത്തെ സാഹചര്യത്തിൽ അറിയപ്പെടുന്ന വസ്തുവാണെന്ന സൂചന നൽകുന്നതിനാൽ ‘ആ’ ചേർത്തു; വസ്ത്രത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കാൻ ‘പുറങ്കുപ്പായം’ തിരഞ്ഞെടുത്തു.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: ഇരുവരുടെയും തോളുകളിൽ വെച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവർ രണ്ടുപേരുടെയും തോൾമേൽ വെച്ചു’ എന്ന ആശയം, വസ്ത്രം ഇരുവരും ചേർന്ന് വഹിച്ചതായി മനസ്സിലാകുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֲחֹרַנִּית
  choice: പിന്നോട്ടു / പിന്നോട്ടായിരുന്നു
  rationale: പിന്നോട്ടുള്ള ചലനവും മുഖങ്ങളുടെ ദിശയും സൂചിപ്പിക്കുന്ന ഒരേ ഹീബ്രായ പദത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ഒരേ മൂലപദം ഉപയോഗിച്ച് സംരക്ഷിച്ചു.
- source_word: וַיְכַסּוּ
  choice: മൂടി
  rationale: כסה എന്ന ക്രിയയുടെ ഈ സാഹചര്യത്തിലെ നേരിട്ടുള്ള അർഥം.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: തങ്ങളുടെ അപ്പന്റെ നഗ്നത
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും നഗ്നാവസ്ഥയുമായി ബന്ധപ്പെട്ട മാന-ലജ്ജാഭാവവും സംരക്ഷിക്കുന്നു. ആവർത്തനം മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: അവരുടെ മുഖങ്ങൾ പിന്നോട്ടായിരുന്നു
  rationale: ഹീബ്രായത്തിലെ ക്രിയാരഹിത വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും മുഖങ്ങൾ മറുദിശയിലായിരുന്നുവെന്ന ആശയം മാത്രം നൽകുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לֹא רָאוּ
  choice: കണ്ടില്ല
  rationale: ראה എന്ന ക്രിയയുടെ ലളിതമായ നിഷേധരൂപം; ‘നോക്കിയില്ല’ എന്ന ഉദ്ദേശ്യകേന്ദ്രിതമായ അധികനിറം ചേർക്കാതെ കാഴ്ചയുടെ അഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘അപ്പന്റെ നഗ്നത’ എന്നതിന്റെ അർഥം
  choice: നോഹയുടെ തുറന്നുകിടന്ന ശരീരത്തെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: പിന്നീടുള്ള ലേവ്യപുസ്തക പ്രയോഗങ്ങളെ അടിസ്ഥാനമാക്കി ലൈംഗികമായ യൂഫെമിസമായി വ്യക്തമാക്കുക
  rationale: ഈ വാക്യത്തിലെ വസ്ത്രം എടുക്കൽ, പിന്നോട്ടു നടക്കൽ, മൂടൽ, കാണാതിരിക്കൽ എന്നീ മൂർത്തമായ പ്രവൃത്തികൾ ശരീരത്തിന്റെ നഗ്നാവസ്ഥയിലേക്കാണ് നേരിട്ട് വിരൽചൂണ്ടുന്നത്. അതേസമയം വിവർത്തനം വ്യാഖ്യാനപരമായി കൂടുതൽ പ്രത്യേകമായ അർഥം അടിച്ചേൽപ്പിക്കാതെ ഹീബ്രായത്തിലെ ‘നഗ്നത’ എന്ന പദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിലെ കുടുംബബന്ധത്തിന് അനുയോജ്യവുമാണ്. ഹീബ്രായത്തിലെ ആവർത്തനവും പിന്നോട്ടുള്ള ദിശയ്ക്കുള്ള ഊന്നലും പരമാവധി സംരക്ഷിച്ചു.
