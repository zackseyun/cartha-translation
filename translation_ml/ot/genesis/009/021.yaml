  text: അവൻ വീഞ്ഞിൽനിന്ന് കുടിച്ചു[a], മത്തുപിടിച്ചു, തന്റെ കൂടാരത്തിനുള്ളിൽ സ്വയം അനാവൃതനായി[b].
  philosophy: optimal-equivalence
