  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: ml
  text: കനാന്റെ പിതാവായ ഹാം തന്റെ അപ്പന്റെ നഗ്നത[a] കണ്ടു; പുറത്ത് തന്റെ രണ്ടു സഹോദരന്മാരോടു അത് പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ അപ്പന്റെ നഗ്നത.’ പഴയനിയമത്തിലെ ചില സന്ദർഭങ്ങളിൽ ഈ പ്രയോഗം ലൈംഗിക സൂചകപ്രയോഗമായി വരാം. ഇവിടെ അക്ഷരാർഥം നിലനിർത്തി, ആ വ്യാഖ്യാനസാധ്യത തുറന്നുവെച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം ‘കണ്ടു’ എന്നാണ്; ‘തുറിച്ചുനോക്കി’ പോലുള്ള ശക്തമായ വ്യാഖ്യാനം മൂലപദം മാത്രം ന്യായീകരിക്കുന്നില്ല.
- source_word: חָם
  choice: ഹാം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲבִי כְנַעַן
  choice: കനാന്റെ അപ്പനായ
  rationale: ഹാമിനെ ‘കനാന്റെ അപ്പൻ’ എന്നു തിരിച്ചറിയിക്കുന്ന ഹീബ്രു സംയുക്തപദബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֶרְוַת אָבִיו
  choice: തന്റെ അപ്പന്റെ നഗ്നത
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; സന്ദർഭം വ്യക്തമാക്കുന്നതിലധികം പ്രത്യേകമായ ലൈംഗിക പ്രവൃത്തി വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַיַּגֵּד
  choice: പറഞ്ഞു
  rationale: נגד എന്ന ഹിഫീൽ ക്രിയയുടെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥത്തിന് ഇവിടെ സ്വാഭാവികമായ ആഖ്യാനപരിഭാഷ ‘പറഞ്ഞു’ ആണ്.
- source_word: לִשְׁנֵי אֶחָיו
  choice: തന്റെ രണ്ടു സഹോദരന്മാരോടു
  rationale: മൂലത്തിലെ ‘രണ്ട്’ എന്ന സംഖ്യ വ്യക്തമായി നിലനിർത്തി, ദാതൃസൂചകമായ לְ മലയാളത്തിലെ ‘-ഓടു’ രൂപത്തിൽ നൽകി.
- source_word: בַּחוּץ
  choice: പുറത്തുണ്ടായിരുന്ന
  rationale: ‘പുറത്ത്’ എന്ന സ്ഥലസൂചന സഹോദരന്മാരോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; കൂടാരത്തിനകത്തുള്ള നോഹയുടെ നിലയോടുള്ള വൈരുധ്യവും വ്യക്തമാകുന്നു.
theological_decisions:
- issue: ഈ വിവരണത്തിലെ ‘അപ്പന്റെ നഗ്നത’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: നോഹയുടെ നഗ്നാവസ്ഥ കണ്ടതിലധികം ഒരു പ്രത്യേക ലൈംഗിക പ്രവൃത്തി വ്യക്തമാക്കാതെ ‘തന്റെ അപ്പന്റെ നഗ്നത’ എന്ന് അക്ഷരാർഥത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: പിന്നീടുള്ള നിയമഭാഷയുടെ വെളിച്ചത്തിൽ കൂടുതൽ ഗുരുതരമായ ലൈംഗിക കുറ്റത്തെയോ മാതാവുമായുള്ള അഗമ്യഗമനത്തെയോ സൂചിപ്പിക്കുന്ന ശിഷ്ടോക്തിയായി വ്യാഖ്യാനിക്കുക.
  rationale: ചില പഴയനിയമ സന്ദർഭങ്ങളിൽ ഈ പ്രയോഗത്തിന് ലൈംഗിക ശിഷ്ടോക്തിയുടെ സ്വഭാവമുണ്ടാകാം. എന്നാൽ ഈ വാക്യം ഹാം ‘കണ്ടു’, തുടർന്ന് സഹോദരന്മാരോടു ‘പറഞ്ഞു’ എന്നാണ് നേരിട്ട് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനസാധ്യത അടച്ചുകളയാതെ അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ എന്നത് കുടുംബബന്ധത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു; വാക്യഘടന മൂലപാഠത്തിന്റെ ക്രമവും അർഥസമ്മർദവും സാധ്യമായത്ര കാത്തുസൂക്ഷിക്കുന്നു.
