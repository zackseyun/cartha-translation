source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: ml
  text: നിങ്ങളോടുള്ള പേടിയും ഭീതിയും ഭൂമിയിലെ സകല മൃഗങ്ങൾക്കും ആകാശത്തിലെ[a] സകല പക്ഷികൾക്കും നിലത്ത് ഇഴയുന്ന സകല ജീവികൾക്കും സമുദ്രത്തിലെ സകല മത്സ്യങ്ങൾക്കും ഉണ്ടാകും. അവയെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ആകാശങ്ങൾ’; ‘വാനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു’ എന്നത് അവയെ നിങ്ങളുടെ അധികാരത്തിൽ ആക്കിയിരിക്കുന്നു എന്നർത്ഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: idiom_explanation
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: നിങ്ങളോടുള്ള പേടിയും ഭീതിയും
  rationale: രണ്ട് സമാന്തര പദങ്ങളുടെയും തീവ്രത നിലനിർത്തിക്കൊണ്ട്, ജീവികൾ മനുഷ്യരെ ഭയപ്പെടും എന്ന ജനിറ്റീവ് അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חַיַּת הָאָרֶץ
  choice: ഭൂമിയിലെ സകല മൃഗങ്ങൾക്കും
  rationale: ഈ സന്ദർഭത്തിൽ חַיָּה കരയിലെ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; കാട്ടുമൃഗങ്ങൾക്കു മാത്രമായി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ സകല പക്ഷികൾക്കും
  rationale: עוֹף എന്നതിന് സന്ദർഭോചിതമായി ‘പക്ഷികൾ’ എന്നും שָׁמַיִם എന്നതിന് സാധാരണ മലയാളത്തിൽ ‘ആകാശം’ എന്നും നൽകി.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: നിലത്ത് ഇഴയുന്ന സകല ജീവികൾക്കും
  rationale: רמשׂ എന്നതിലെ നിലത്തുകൂടി ഇഴയുകയോ ചെറുതായി സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ജീവികളുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; അർത്ഥപൂർണമായ മലയാളത്തിനായി ‘ജീവികൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: דְּגֵי הַיָּם
  choice: സമുദ്രത്തിലെ സകല മത്സ്യങ്ങൾക്കും
  rationale: നിർമാണബന്ധത്തെയും ചുറ്റുമുള്ള സമഗ്രവ്യാപ്തിയെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: അവയെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: മനുഷ്യരുടെ അധികാരത്തിലാക്കപ്പെട്ടിരിക്കുന്നു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപകവും നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രളയാനന്തരം മൃഗങ്ങളിന്മേലുള്ള മനുഷ്യാധികാരം
  choice: മൃഗങ്ങൾ മനുഷ്യരെ ഭയപ്പെടുമെന്നും അവ മനുഷ്യരുടെ കൈയിൽ ഏല്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും വാക്യം പറയുന്നത്രമാത്രം അവതരിപ്പിച്ചു.
  alternative: ‘അവ നിങ്ങൾക്കു കീഴ്പ്പെട്ടിരിക്കും’ എന്ന് വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക, അല്ലെങ്കിൽ അധികാരത്തിന്റെ ആശയം മയപ്പെടുത്തുക.
  rationale: ‘നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചു’ എന്ന പ്രയോഗം യഥാർഥ അധികാരത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ ഒരു വിപുലമായ ദാർശനികമോ നൈതികമോ ആയ അവകാശവാദമാക്കി വികസിപ്പിക്കാതെ മൂലരൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പഴയ പ്രയോഗങ്ങളായ ‘ഭയം നിങ്ങളിന്മേൽ ഇരിക്കും’ എന്ന അക്ഷരാർഥരൂപം ഒഴിവാക്കി, ഹീബ്രു ആശയവും സമാന്തരഘടനയും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
