id: GEN.9.7
reference: Genesis 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: ml
  text: നിങ്ങളോ[a], സന്താനസമൃദ്ധരാകുവിൻ; ഭൂമിയിൽ സമൃദ്ധമായി പെരുകുവിൻ, അതിൽ പെരുകുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളാകട്ടെ.’ സ്വതന്ത്ര സർവനാമം ഇവിടെ ഊന്നലും മുൻസന്ദർഭത്തിൽനിന്നുള്ള പുനരാരംഭവും നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: എന്നാൽ നിങ്ങൾ
  rationale: സംയോജകവും സ്വതന്ത്ര സർവനാമവും മുൻസന്ദർഭത്തോടുള്ള ഊന്നിയ വ്യത്യാസവും പുനരാരംഭവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നാൽ നിങ്ങൾ’ അത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: פְּרוּ
  choice: സന്താനസമൃദ്ധിയുള്ളവരായി
  rationale: പ്രജനനവും ഫലപ്രാപ്തിയും സൂചിപ്പിക്കുന്ന കല്പനയാണ്; സസ്യഫലത്തെക്കുറിച്ചെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി മനുഷ്യസന്താനവർധന വ്യക്തമാക്കുന്നു.
- source_word: וּרְבוּ
  choice: പെരുകുവിൻ
  rationale: എണ്ണത്തിൽ വർധിക്കുക എന്ന അർഥം നിലനിർത്തുകയും ആവർത്തനത്തിന് അനുയോജ്യമായ ഗൗരവമുള്ള കല്പനാരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: שִׁרְצוּ
  choice: നിറഞ്ഞുപെരുകുവിൻ
  rationale: കൂട്ടമായി അത്യധികം വർധിച്ച് വ്യാപിക്കുക എന്ന ശക്തമായ ദൃശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; ‘ഇഴജന്തുക്കളെപ്പോലെ പെരുകുക’ എന്ന അനാവശ്യ ഭാവം ഒഴിവാക്കുന്നു.
- source_word: בָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പ്രളയാനന്തര മനുഷ്യവർധനയുടെ വ്യാപ്തിസ്ഥലമായി ഭൂമിയെ സൂചിപ്പിക്കുന്നു; בְ എന്ന ഉപസർഗത്തിന്റെ അർഥവും തുടർന്നുള്ള בָהּ-യുമായുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: וּרְבוּ בָהּ
  choice: അതിൽ പെരുകുവിൻ
  rationale: רבה എന്ന ക്രിയയുടെ ആവർത്തനവും אֶרֶץ-നെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ ബന്ധവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടികല്പനയോടും പ്രളയാനന്തര അനുഗ്രഹത്തോടുമുള്ള ബന്ധം
  choice: നോഹയോടും അവന്റെ പുത്രന്മാരോടുമുള്ള പുതുക്കിയ ദൈവിക കല്പന/അനുഗ്രഹത്തിന്റെ ഭാഷ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ഉല്പത്തി 1:28-ന്റെ വെറും ആവർത്തനമായി അവതരിപ്പിക്കുക, അല്ലെങ്കിൽ വിപുലമായ ഉടമ്പടിസിദ്ധാന്തപരമായ പദങ്ങൾ ചേർക്കുക.
  rationale: എബ്രായവാക്യം ഉല്പത്തി 1:28-നോട് സമാന്തരമായ കല്പനാഭാഷ ഉപയോഗിക്കുന്നു; ആ അനുരണനം നിലനിർത്തണം, എന്നാൽ വാചകത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തനിഗമനങ്ങൾ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. കല്പനാഭാവത്തിന് ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു. שׁרץ എന്ന ശക്തമായ പ്രജനനദൃശ്യത്തെ അസ്വാഭാവികമായ ജീവിവാചകമില്ലാതെ ‘നിറഞ്ഞുപെരുകുവിൻ’ എന്നു പകർന്നു.
