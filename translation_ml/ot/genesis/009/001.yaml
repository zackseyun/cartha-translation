id: GEN.9.1
reference: Genesis 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: ml
  text: 'ദൈവം നോഹയെയും അവന്റെ പുത്രന്മാരെയും അനുഗ്രഹിച്ചു; അവരോടു പറഞ്ഞു: “നിങ്ങൾ സന്താനപുഷ്ടിയുള്ളവരായി പെരുകി ഭൂമിയെ നിറയ്ക്കുവിൻ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭൂമിയെ’ എന്നതിന് ‘ദേശത്തെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ പ്രളയാനന്തര സന്ദർഭവും ഉല്പത്തി 1:28-ലെ പ്രതിധ്വനിയും കണക്കിലെടുക്കുമ്പോൾ ഇവിടെ ‘ഭൂമിയെ’ എന്നതാണ് കൂടുതൽ യോജിച്ചത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: പീയേൽ രൂപം വെറും ആശംസയല്ല, അനുഗ്രഹം നൽകുന്നതാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും ഉടമ്പടിസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ഏക സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു പൊതുവായ ‘മക്കൾ’ എന്നല്ല, പ്രത്യേകമായി പുത്രന്മാർ എന്നാണ് പറയുന്നത്.
- source_word: וַיֹּאמֶר לָהֶם
  choice: അവരോടു പറഞ്ഞു
  rationale: അധിക വ്യാഖ്യാനബലം ചേർക്കാതെ ആഖ്യാനത്തിലെ സാധാരണ സംഭാഷണാമുഖം നിലനിർത്തുന്നു.
- source_word: פְּרוּ
  choice: സന്താനപുഷ്ടിയുള്ളവരാകുവിൻ
  rationale: മനുഷ്യരോടുള്ള കല്പനയിൽ ഫലവത്താകുക എന്ന ആശയത്തെ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ഉല്പത്തി 1:28-ലെ പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וּרְבוּ
  choice: പെരുകുവിൻ
  rationale: എണ്ണത്തിൽ വർധിക്കുക എന്ന അർഥം ഈ കൂട്ടുപ്രയോഗത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וּמִלְאוּ
  choice: നിറയുവിൻ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘നിറയ്ക്കുക/നിറയുക’ എന്നതാണ്; പുനർനിറയ്ക്കൽ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: പ്രളയാനന്തര ലോകവ്യാപക സന്ദർഭവും ഉല്പത്തി 1:28-ലെ പ്രതിധ്വനിയും കണക്കിലെടുക്കുമ്പോൾ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 1:28-ലെ സൃഷ്ടികല്പനയുമായുള്ള ബന്ധം
  choice: ‘സന്താനപുഷ്ടിയുള്ളവരായി പെരുകി ഭൂമിയിൽ നിറയുവിൻ’ എന്ന സമാന്തര ഭാഷ നിലനിർത്തി.
  alternative: ‘ധാരാളം മക്കളുണ്ടായി ഭൂമിയാകെ ജനവാസമുള്ളതാക്കുവിൻ’ എന്ന കൂടുതൽ വിശദീകരണാത്മക രൂപം.
  rationale: ഹീബ്രു സൃഷ്ടിയിലുണ്ടായിരുന്ന അനുഗ്രഹ-കല്പനയുടെ ഭാഷ ആവർത്തിക്കുന്നു. അതിനാൽ വ്യാഖ്യാനം ചേർക്കാതെ പ്രളയാനന്തര മനുഷ്യരാശിയും ആദിമ സൃഷ്ടിദൗത്യവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ തുടർച്ച സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനയുടെ ബഹുവചനഭാവം വ്യക്തമായി സൂക്ഷിച്ചു; പരമ്പരാഗത വേദഭാഷയുടെ പ്രതിധ്വനി നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
