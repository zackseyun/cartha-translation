revisions:
- from: 'ദൈവം നോഹയെയും അവന്റെ പുത്രന്മാരെയും അനുഗ്രഹിച്ച് അവരോടു പറഞ്ഞു: “നിങ്ങൾ സന്താനപുഷ്ടിയുള്ളവരായി പെരുകി ഭൂമിയിൽ നിറയുവിൻ.”[a]'
  to: 'ദൈവം നോഹയെയും അവന്റെ പുത്രന്മാരെയും അനുഗ്രഹിച്ചു; അവരോടു പറഞ്ഞു: “നിങ്ങൾ സന്താനപുഷ്ടിയുള്ളവരായി പെരുകി ഭൂമിയെ നിറയ്ക്കുവിൻ.”[a]'
  rationale: The revision corrects the object relationship of ‘fill’ while preserving the source sequence, plural commands, scope ambiguity as noted in the footnote, and the deliberate echo of Genesis 1:28.
