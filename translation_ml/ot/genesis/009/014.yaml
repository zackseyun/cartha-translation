id: GEN.9.14
reference: Genesis 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: ml
  text: ഞാൻ ഭൂമിക്കുമീതെ മേഘങ്ങൾ വരുത്തുമ്പോൾ, മേഘത്തിൽ വില്ല്[a] ദൃശ്യമാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മഴവില്ല്.’ എബ്രായപാഠത്തിൽ സാധാരണ വില്ലിനെ സൂചിപ്പിക്കുന്ന പദമാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്; ഈ സന്ദർഭത്തിൽ അത് ഉടമ്പടിയുടെ അടയാളമായ മഴവില്ലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: …വരുത്തുമ്പോൾ
  rationale: ഈ ഘടന ഭാവികാലത്തിലെ ഒരു സാഹചര്യത്തെ കാലസൂചകമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘…വരുത്തുമ്പോൾ’ എന്നത് അതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּעַנְנִי עָנָן
  choice: ഞാൻ … മേഘങ്ങൾ വരുത്തുമ്പോൾ
  rationale: ענן എന്ന ധാതുവിന്റെ ഇവിടെ ഉള്ള കാരണാർഥം ‘മേഘംകൊണ്ട് മൂടുക/മേഘങ്ങൾ വരുത്തുക’ എന്നാണ്. ഏകവചനമായ עָנָן-ന് ഇവിടെ സമൂഹവാചകബലം ഉള്ളതിനാൽ മലയാളത്തിൽ ‘മേഘങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിക്കുമീതെ
  rationale: പ്രളയത്തിനുശേഷമുള്ള ഉടമ്പടിയുടെ വിശാലമായ പശ്ചാത്തലത്തിൽ הָאָרֶץ എന്നത് ‘ഭൂമി’ എന്നാണ് എടുത്തത്; עַל എന്നതിന്റെ സ്ഥാനാർഥം ‘മീതെ’ വ്യക്തമാക്കുന്നു.
- source_word: וְנִרְאֲתָה
  choice: ദൃശ്യമാകും
  rationale: ראה-യുടെ നിഫാൽ രൂപത്തിലുള്ള ‘കാണപ്പെടുക/പ്രത്യക്ഷമാകുക’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ‘ദൃശ്യമാകും’ എന്നു നൽകി.
- source_word: הַקֶּשֶׁת
  choice: വില്ല്
  rationale: קֶשֶׁת എന്ന സാധാരണ എബ്രായപദത്തിന്റെ അടിസ്ഥാനാർഥം ‘വില്ല്’ എന്നാണ്. ഇവിടെ അത് ഉടമ്പടിയുടെ അടയാളമായ മഴവില്ലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപദത്തിലെ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: בֶּעָנָן
  choice: മേഘത്തിൽ
  rationale: നിശ്ചയാർഥക ഏകവചനത്തെ അടുത്തായി പിന്തുടർന്ന് ‘മേഘത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: നോഹയോടുള്ള ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ קֶשֶׁת-ന്റെ പരിഭാഷ
  choice: വില്ല്
  alternative: മഴവില്ല്
  rationale: മൂലപാഠം ആയുധമായ വില്ലിനും മഴവില്ലിനും ഉപയോഗിക്കുന്ന അതേ പദമാണ് നൽകുന്നത്. അതിലെ ഉടമ്പടി-രൂപകം നഷ്ടപ്പെടാതിരിക്കാൻ ‘വില്ല്’ നിലനിർത്തുകയും സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മേഘങ്ങൾ വരുത്തുമ്പോൾ’ എന്ന പ്രയോഗം ദൈവത്തിന്റെ പ്രവർത്തനത്തെ വ്യക്തമാക്കുന്നു; ‘വില്ല്’ എന്നത് മൂലഭാഷയിലെ ദൃശ്യരൂപവും അർഥസമ്മർദവും സംരക്ഷിക്കുന്നു.
