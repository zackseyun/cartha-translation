    rationale: In Hebrew, כְּיֶרֶק עֵשֶׂב (‘like/as the green vegetation’) precedes ‘I have given you everything’ (אֶת־כֹּל). The object is not explicitly restricted to the animals in the preceding clause. Moving the comparative phrase before the verb and using ‘എല്ലാം’ preserves the unqualified scope and avoids an added pronoun.
