source:
  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: ml
  text: ജീവനുള്ള സകല ചരജന്തുക്കളും[a] നിങ്ങൾക്കു ആഹാരമായിരിക്കും. പച്ചസസ്യങ്ങളെ നിങ്ങൾക്കു നൽകിയതുപോലെ, എല്ലാം ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവനോടെ ഇഴയുന്ന സകലതും നിങ്ങൾക്ക് ആഹാരമായിരിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ רֶמֶשׂ പലപ്പോഴും ഇഴയുന്നതോ കൂട്ടമായി സഞ്ചരിക്കുന്നതോ ആയ ജീവികളെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ സന്ദർഭത്തിൽ അതിന് വിശാലമായ അർഥമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: സകല ചരജന്തുക്കളും
  rationale: רֶמֶשׂ ഇഴയുന്നതോ കൂട്ടമായി സഞ്ചരിക്കുന്നതോ ആയ ജീവികളെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആഹാരത്തിനായുള്ള വിശാലമായ അനുമതിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ചരജന്തുക്കൾ’ ചലിക്കുന്ന ജീവികൾ എന്ന വ്യാപക അർഥം സ്വാഭാവികമായി നൽകുന്നു; כָּל-ന്റെ സമഗ്രത ‘സകല’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הוּא חַי
  choice: ജീവനുള്ള
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി, ജീവിച്ചിരിക്കുന്ന ജീവികളെയാണ് പരാമർശിക്കുന്നതെന്ന വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: നിങ്ങൾക്ക് ആഹാരമായിരിക്കും
  rationale: ദൈവിക അനുമതിയും ആഹാരമായി ലഭിക്കുന്ന അവസ്ഥയും അർഥവ്യത്യാസമില്ലാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: പച്ചസസ്യങ്ങളെപ്പോലെ
  rationale: יֶרֶק עֵשֶׂב സസ്യലോകത്തെ സമാഹാരമായി സൂചിപ്പിക്കുന്നു. ‘പച്ചസസ്യങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഉല്പത്തി 1-ലെ മുൻകാല ആഹാരദാനത്തോടുള്ള താരതമ്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: അവയെല്ലാം ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  rationale: നിലവിൽ പ്രാബല്യമുള്ള പൂർത്തിയായ ദാനത്തെ ‘തന്നിരിക്കുന്നു’ പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി כֹּל സൂചിപ്പിക്കുന്ന ജീവികളെ ‘അവയെല്ലാം’ എന്നു നൽകി.
theological_decisions:
- issue: പ്രളയാനന്തര ആഹാരാനുമതിയുടെ വ്യാപ്തി
  choice: ജീവനുള്ള ചരജന്തുക്കളെ സമഗ്രമായി ഉൾക്കൊള്ളുന്ന വിശാലമായ ആഹാരാനുമതി
  alternative: רֶמֶשׂ എന്ന പദത്തെ അടിസ്ഥാനമാക്കി ഇഴജന്തുക്കൾക്കോ ചെറുജീവികൾക്കോ മാത്രമായി ചുരുക്കിയ അനുമതി
  rationale: רֶמֶשׂ ചില സന്ദർഭങ്ങളിൽ ഇഴയുന്നവയെയോ കൂട്ടമായി സഞ്ചരിക്കുന്നവയെയോ സൂചിപ്പിക്കാം. എന്നാൽ ഇവിടെ כָּל എന്ന സമഗ്രപദവും അവസാനം വരുന്ന אֶת כֹּל എന്ന ഉറപ്പിക്കലും പരാമർശത്തെ വിശാലമാക്കുന്നു. അതിനാൽ മുഖ്യവാചകം വ്യാപകത നിലനിർത്തുന്നു; പദത്തിന്റെ ഇടുങ്ങിയ സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ചരജന്തു’ അല്പം സാഹിത്യപരമാണെങ്കിലും ‘ചലിക്കുന്ന സകല ജീവികളും’ എന്ന ദീർഘരൂപത്തേക്കാൾ സംക്ഷിപ്തവും വ്യാപകവുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
