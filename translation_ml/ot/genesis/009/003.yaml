  terminology: ‘ആഹാരം,’ ‘പച്ചസസ്യങ്ങൾ,’ and ‘ചരജന്തുക്കൾ’ are suitable. The lexical footnote appropriately records the narrower possible sense of רֶמֶשׂ while the main text retains the contextual breadth.
