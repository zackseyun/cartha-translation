source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: ml
  text: 'ദൈവം നോഹയോടു പറഞ്ഞു: “എനിക്കും ഭൂമിയിലുള്ള സകല ജഡത്തിനും[a] ഇടയിൽ ഞാൻ സ്ഥാപിച്ച ഉടമ്പടിയുടെ അടയാളം ഇതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സകല ജീവജാലങ്ങൾക്കും” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായയിൽ അക്ഷരാർഥം “സകല ജഡത്തിനും”; ഈ സന്ദർഭത്തിൽ ഭൂമിയിലെ ജീവജാലങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം തന്നെ ഈ തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ നോഹയോടു സംസാരിക്കുന്ന ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ പ്രമാണിക പദമാണ് ‘ദൈവം’.
- source_word: אֶל נֹחַ
  choice: നോഹയോടു
  rationale: אֶל ഇവിടെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നു; ‘നോഹയോടു’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: ഉടമ്പടിയുടെ അടയാളം ഇതാണ്
  rationale: എബ്രായ തിരിച്ചറിയൽവാക്യത്തിന്റെ അർഥവും ഊന്നലും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു. אוֹת എന്നതിന് ഈ ദൃശ്യസന്ദർഭത്തിൽ ‘അടയാളം’ വ്യക്തമാണ്.
- source_word: הֲקִמֹתִי
  choice: ഞാൻ സ്ഥാപിച്ച
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഉടമ്പടിയോടൊപ്പം വരുമ്പോൾ ‘സ്ഥാപിക്കുക/ഉറപ്പിക്കുക’ എന്നർഥം നൽകുന്നു; പൂർത്തിയായ പ്രവൃത്തി ബന്ധവാക്യമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בֵּינִי וּבֵין
  choice: എനിക്കും ... ഇടയിൽ
  rationale: ഉടമ്പടിയിലെ രണ്ടു ബന്ധകക്ഷികളെ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כָּל בָּשָׂר
  choice: സകല ജഡത്തിനും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘all flesh’ എന്ന വിശാലമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ മനുഷ്യരെ മാത്രമല്ല, ഭൂമിയിലെ ജീവജാലങ്ങളെയാകെ ഉൾക്കൊള്ളുന്നു.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: ഭൂമിയിലുള്ള
  rationale: ‘സകല ജഡത്തെയും’ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; സാർവത്രികമായ ഈ സന്ദർഭത്തിൽ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
theological_decisions:
- issue: നോഹയോടുള്ള ഉടമ്പടിയിൽ כָּל בָּשָׂר എന്നതിന്റെ വ്യാപ്തി
  choice: സകല ജഡത്തിനും
  alternative: സകല ജീവജാലങ്ങൾക്കും; എല്ലാ മനുഷ്യർക്കും
  rationale: ഉല്പത്തി 9-ൽ ഈ പ്രയോഗം മനുഷ്യരിൽ ഒതുങ്ങാതെ ഭൂമിയിലെ ജീവികളെയാകെ ഉൾക്കൊള്ളുന്നു. ‘സകല ജഡം’ എന്ന രൂപം മൂലപാഠത്തിന്റെ വിശാലതയും ബൈബിൾ ഭാഷയിലെ അർഥസാന്ദ്രതയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ സന്ദർഭോചിത അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി,’ ‘അടയാളം,’ ‘സകല ജഡം’ എന്നീ ബൈബിൾപ്രധാന പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന ‘സകല ജഡത്തിനും’ എന്ന പദപ്രയോഗത്തിനരികിലാണ് നൽകിയിരിക്കുന്നത്.
