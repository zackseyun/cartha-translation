id: GEN.9.6
reference: Genesis 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: ml
  text: ആരെങ്കിലും ഒരു മനുഷ്യന്റെ രക്തം ചൊരിയുന്നുവെങ്കിൽ, മനുഷ്യനാൽ അവന്റെ രക്തം ചൊരിയപ്പെടും; കാരണം ദൈവം മനുഷ്യനെ തന്റെ സ്വരൂപത്തിൽ ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: ചൊരിയുന്നവൻ
  rationale: കാലാതീതവും പൊതുവുമായ നിയമപ്രസ്താവനയായി പ്രവർത്തിക്കുന്ന ഹീബ്രു കർത്തൃവാചക വിശേഷണരൂപത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: דַּם
  choice: രക്തം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന ജീവഹിംസയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ / മനുഷ്യന്റെ / മനുഷ്യനെ
  rationale: אָדָם ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. വിഭക്തിക്കനുസരിച്ചുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് മൂലത്തിലെ ആവർത്തനം പരമാവധി നിലനിർത്തുന്നു.
- source_word: בָּאָדָם
  choice: മനുഷ്യനാൽ
  rationale: בְּ എന്ന മുൻപ്രത്യയത്തെ ഇവിടെ കർത്തൃസാധനാർഥത്തിൽ എടുത്ത്, രക്തം മനുഷ്യൻ മുഖാന്തരം ചൊരിയപ്പെടുന്നു എന്ന വാക്യഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: അവന്റെ രക്തം ചൊരിയപ്പെടും
  rationale: നിപ്ഹാൽ അപൂർണക്രിയയുടെ കർമണിപ്രയോഗവും പ്രതികാരസമാന്തരവും നിലനിർത്തുന്നു; നിർബന്ധാർഥം അതിരുകടന്ന് ചേർക്കുന്നില്ല.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയുടെ അടിസ്ഥാനകാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: ദൈവത്തിന്റെ സ്വരൂപത്തിൽ
  rationale: ഹീബ്രുവിന്റെ വ്യക്തമായ പദക്രമവും ദൈവസാദൃശ്യത്തെക്കുറിച്ചുള്ള ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ‘ഉണ്ടാക്കുക’ എന്ന അർഥം നൽകുന്നു; ഇവിടെ ഇല്ലാത്ത ברא എന്ന ‘സൃഷ്ടിക്കുക’ പദത്തിന്റെ പ്രത്യേകത ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ ഏകവചനപ്രയോഗം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യവർഗം
  rationale: വാക്യത്തിലെ വ്യക്തിയെയും മുഴുവൻ മനുഷ്യകുലത്തെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ ഏകവചനശക്തിയും ആവർത്തനവും ‘മനുഷ്യൻ’ കൂടുതൽ നന്നായി സൂക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല.
- issue: בָּאָדָם മനുഷ്യനിലൂടെയുള്ള നീതിനിർവഹണമാണോ എന്നത്
  choice: മനുഷ്യനാൽ ചൊരിയപ്പെടും
  alternative: മനുഷ്യരുടെ ഇടയിൽ അവന്റെ രക്തം ചൊരിയപ്പെടും
  rationale: മുൻപ്രത്യയത്തിന്റെ കർത്തൃസാധനാർഥ വായനയാണ് ഈ നിയമസൂക്തത്തിന്റെ വാക്യഘടനയ്ക്ക് ഏറ്റവും സ്വാഭാവികം. എന്നാൽ അതിൽനിന്ന് വികസിപ്പിച്ച ശിക്ഷാസിദ്ധാന്തം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ദൈവസ്വരൂപവാക്യത്തിന്റെ പദക്രമം
  choice: ദൈവത്തിന്റെ സ്വരൂപത്തിൽ അവൻ മനുഷ്യനെ ഉണ്ടാക്കി
  alternative: ദൈവം മനുഷ്യനെ തന്റെ സ്വരൂപത്തിൽ ഉണ്ടാക്കി
  rationale: മൂലഹീബ്രുവിന്റെ ഊന്നലും പദക്രമവും കൂടുതൽ നേരിട്ട് സൂക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ അർഥം വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ നിയമസൂക്തശൈലി. ‘രക്തം ചൊരിയുക’ എന്ന സ്ഥാപിത പ്രയോഗം നിലനിർത്തി; അതിരുകടന്ന നിയമശാസ്ത്രപരമായ വിശദീകരണം ഒഴിവാക്കി.
