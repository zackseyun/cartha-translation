revisions:
- from: മനുഷ്യന്റെ[a] രക്തം ചൊരിയുന്നവന്റെ രക്തം മനുഷ്യനാൽ[b] ചൊരിയപ്പെടും; കാരണം ദൈവത്തിന്റെ സ്വരൂപത്തിൽ അവൻ മനുഷ്യനെ ഉണ്ടാക്കി.
  to: ആരെങ്കിലും ഒരു മനുഷ്യന്റെ രക്തം ചൊരിയുന്നുവെങ്കിൽ, മനുഷ്യനാൽ അവന്റെ രക്തം ചൊരിയപ്പെടും; കാരണം ദൈവം മനുഷ്യനെ തന്റെ സ്വരൂപത്തിൽ ഉണ്ടാക്കി.
  rationale: The revision preserves the Hebrew's generic proverbial force, repeated אדם wordplay as far as natural Malayalam permits, the agentive/instrumental sense of בָּאָדָם, and the passive יִשָּׁפֵךְ. It makes God explicitly the subject of ‘made’ and removes an avoidable ambiguity in the opening clause. Footnote anchors remain attached to the first and second occurrences corresponding to אדם/בָּאָדָם.
