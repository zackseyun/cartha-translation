  language: en
  yaml_path: translation/ot/genesis/009/029.yaml
  text: So all the days of Noah were nine hundred and fifty years, and he died.
translation:
  language: ml
  text: നോഹയുടെ ആയുഷ്കാലം ആകെ തൊള്ളായിരത്തി അമ്പത് വർഷമായിരുന്നു; പിന്നെ അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: നോഹയുടെ ആയുഷ്കാലം ആകെ ... ആയിരുന്നു
  rationale: ഹീബ്രായ ഭാഷയിലെ ‘നോഹയുടെ എല്ലാ ദിവസങ്ങളും’ എന്ന ആയുഷ്കാലസംഗ്രഹ ശൈലി മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു; ‘ആകെ’ സമ്പൂർണ കാലയളവ് സൂചിപ്പിക്കുന്നു.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: തൊള്ളായിരത്തി അമ്പത് വർഷം
  rationale: ഹീബ്രായത്തിലെ രണ്ട് സംയോജിത സംഖ്യാഭാഗങ്ങളെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വാക്യത്തിലെ തുടർച്ചാസൂചകമായ וַ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി ആയുഷ്കാലസംഗ്രഹത്തിന്റെ സമാപനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സർവനാമം നോഹയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, ഉല്പത്തിയിലെ വംശാവലി-ആയുഷ്കാല സമാപനസൂത്രത്തിന്റെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു.
