id: GEN.9.20
reference: Genesis 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: ml
  text: മണ്ണിൽ പണിയെടുക്കുന്നവനായ നോഹ മുന്തിരിത്തോട്ടം നട്ടുതുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മണ്ണിൽ പണിയെടുക്കുന്നവനായ നോഹ മുന്തിരിത്തോട്ടം നട്ട ആദ്യത്തെ ആളായിരുന്നു.” എബ്രായ വാക്യം ചുരുക്കിയ ഘടനയിലുള്ളതിനാൽ “തുടങ്ങി” എന്നതിനെ ചിലർ “ആദ്യമായി ചെയ്തു” എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: തുടങ്ങി
  rationale: ഹിഫീൽ രൂപത്തിന് ഇവിടെ സ്വാഭാവികമായ അർഥം ‘തുടങ്ങി’ എന്നതാണ്. തുടർന്നുവരുന്ന ‘നട്ടു’ എന്ന ക്രിയയുമായി ചേർത്ത് മലയാളത്തിൽ ‘നട്ടുതുടങ്ങി’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אִישׁ הָאֲדָמָה
  choice: മണ്ണിൽ പണിയെടുക്കുന്നവൻ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മണ്ണിന്റെ മനുഷ്യൻ’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ഈ പ്രയോഗത്തിലെ കാർഷികബന്ധം വ്യക്തമായി പകർന്നുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַיִּטַּע
  choice: നട്ടു
  rationale: נטע എന്ന നടീൽക്രിയയുടെ നേരായ മലയാളരൂപം; וַיָּחֶל എന്നതിനോടു ചേർന്ന് ‘നട്ടുതുടങ്ങി’ ആയി വരുന്നു.
- source_word: כָּרֶם
  choice: മുന്തിരിത്തോട്ടം
  rationale: മുന്തിരി കൃഷിചെയ്യുന്ന തോട്ടം എന്ന കൃത്യവും പ്രചാരമുള്ളതുമായ മലയാളപദം.
theological_decisions:
- issue: וַיָּחֶל ... וַיִּטַּע എന്ന ചുരുക്കിയ ക്രിയാശ്രേണി എങ്ങനെ വ്യാഖ്യാനിക്കണം
  choice: മുന്തിരിത്തോട്ടം നട്ടുതുടങ്ങി
  alternative: മുന്തിരിത്തോട്ടം നട്ട ആദ്യത്തെ ആളായിരുന്നു
  rationale: ‘തുടങ്ങി’ എന്ന അർഥം അടുത്ത ക്രിയയിലേക്കു നീളുന്നതായി കാണുന്നത് എബ്രായ ആഖ്യാനത്തിന്റെ സാധാരണ ഒഴുക്കിനും മലയാളത്തിന്റെ സ്വാഭാവിക പ്രയോഗത്തിനും യോജിക്കുന്നു. ‘ആദ്യത്തെ ആളായിരുന്നു’ എന്നത് സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും മൂലപാഠത്തിൽ അത് വ്യക്തമായി പറഞ്ഞിട്ടില്ല; അതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മണ്ണിൽ പണിയെടുക്കുന്നവൻ’ എന്നത് אִישׁ הָאֲדָמָה എന്ന പ്രയോഗത്തിന്റെ കാർഷിക അർഥം സ്വാഭാവികമായി പകരുന്നു; ക്രിയാശ്രേണി ‘നട്ടുതുടങ്ങി’ എന്നു ചേർത്തത് മലയാളത്തിൽ ഒഴുക്കുള്ളതാണ്.
