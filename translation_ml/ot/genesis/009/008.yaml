id: GEN.9.8
reference: Genesis 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל נֹ֔חַ וְ/אֶל בָּנָ֥י/ו אִתּ֖/וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം നോഹയോടും അവനോടുകൂടെ ഉണ്ടായിരുന്ന അവന്റെ പുത്രന്മാരോടും പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മാന്യവും പരിചിതവുമായ ക്രിയയാണ് ‘അരുളിച്ചെയ്തു’.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ നോഹയോടു സംസാരിക്കുന്ന ഏക സത്യദൈവത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സാധാരണവും സന്ദർഭോചിതവുമായ വിവർത്തനം ‘ദൈവം’ ആണ്.
- source_word: אֶל־נֹחַ
  choice: നോഹയോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തി ഉപയോഗിച്ചു; പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി.
- source_word: וְאֶל־בָּנָיו
  choice: അവന്റെ പുത്രന്മാരോടും
  rationale: സംയോജകഘടന രണ്ടാമത്തെ അഭിസംബോധിതരെയും ഉൾപ്പെടുത്തുന്നു. בָּנִים ഇവിടെ പുരുഷസന്തതിയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ‘പുത്രന്മാർ’ നിലനിർത്തി.
- source_word: אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: നോഹയുടെ പുത്രന്മാർ അവനോടൊപ്പം ഉണ്ടായിരുന്നുവെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: ഈ അനന്തരക്രിയാരൂപം തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ അതിന്റെ പ്രഭാഷണ-ആമുഖ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർത്ത് വാക്യം ഭാരപ്പെടുത്തുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്തു’ മാന്യമായ ബൈബിൾപ്രയോഗമാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; അതിരുകടന്ന പുരാതന വാക്യഘടന ഒഴിവാക്കി.
