id: GEN.21.11
reference: Genesis 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: ml
  text: തന്റെ മകനെക്കുറിച്ചുള്ള ആ കാര്യം അബ്രാഹാമിന് വളരെ അനിഷ്ടമായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘തന്റെ മകനെക്കുറിച്ച് ആ കാര്യം അബ്രാഹാമിന്റെ കണ്ണുകളിൽ വളരെ മോശമായിരുന്നു.’ ‘തന്റെ മകനെക്കുറിച്ച്’ എന്നതിന് ‘തന്റെ മകന്റെ നിമിത്തം’ എന്നും അർഥമാകാം.'
    reason: എബ്രായത്തിലെ ‘അബ്രാഹാമിന്റെ കണ്ണുകളിൽ’ എന്ന ശൈലിയും עַל אֹדוֹת എന്നതിന്റെ ‘കുറിച്ച്/നിമിത്തം’ എന്ന അർഥസാധ്യതയും കാണിക്കുന്നു.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: വളരെ അനിഷ്ടമായി
  rationale: רעע എന്ന ക്രിയയും בְּעֵינֵי എന്ന പ്രയോഗവും ചേർന്ന്, ഒരു കാര്യം ഒരാൾക്ക് മോശമായോ അസ്വീകാര്യമായോ തോന്നിയെന്ന ആശയം നൽകുന്നു. ‘അനിഷ്ടമായി’ എന്നത് ഈ സന്ദർഭത്തിലെ വികാരപരവും വിലയിരുത്തൽപരവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַדָּבָר
  choice: ഈ കാര്യം
  rationale: דבר എന്ന പദത്തിന് ‘കാര്യം’, ‘വസ്തു’, ‘വാക്ക്’ തുടങ്ങിയ വിശാലമായ അർഥങ്ങളുണ്ട്. ഇവിടെ മുൻവാക്യത്തിലെ സാറായുടെ ആവശ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഈ കാര്യം’ സന്ദർഭബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְאֹד
  choice: വളരെ
  rationale: തീവ്രത സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയാവിശേഷണം; ലളിതവും കൃത്യവുമായ മലയാള സമാനപദം.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: അബ്രാഹാമിന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അബ്രാഹാമിന്റെ കണ്ണുകളിൽ’ എന്നാണെങ്കിലും, ഇത് ഒരാളുടെ വിലയിരുത്തലോ അനുഭവമോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. മലയാളത്തിൽ ‘അബ്രാഹാമിന് ... അനിഷ്ടമായി’ എന്ന് പറയുന്നത് അതേ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַל אֹדוֹת
  choice: സംബന്ധിച്ച
  rationale: ഈ ഘടനയ്ക്ക് ‘നിമിത്തം’, ‘കുറിച്ച്’, ‘സംബന്ധിച്ച്’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ അബ്രാഹാമിന്റെ അസന്തോഷത്തിന്റെ വിഷയവും കാരണവും അവന്റെ മകനാണെന്ന ഇരട്ടസൂചന നിലനിർത്താൻ ‘സംബന്ധിച്ച’ തിരഞ്ഞെടുത്തു.
- source_word: בְּנוֹ
  choice: തന്റെ മകൻ
  rationale: בן എന്നത് വ്യക്തമായി ‘മകൻ’ എന്നാണ്. പ്രതിഫലനസൂചകമായ ‘തന്റെ’ എന്ന പ്രയോഗം മകൻ അബ്രാഹാമിന്റേതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മുഖ്യവാചകത്തിൽ എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; ഉറവിടത്തിലെ ദൃശ്യരൂപവും കാരണ/വിഷയ അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
