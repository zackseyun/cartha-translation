id: GEN.21.10
reference: Genesis 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ അബ്രാഹാമിനോടു പറഞ്ഞു: “ഈ അടിമസ്ത്രീയെയും അവളുടെ മകനെയും പുറത്താക്കുക[a]. കാരണം ഈ അടിമസ്ത്രീയുടെ മകൻ എന്റെ മകനായ യിസ്ഹാക്കിനോടൊപ്പം അവകാശം പ്രാപിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആട്ടിയോടിക്കുക.”
    reason: גרשׁ എന്ന ക്രിയ സാധാരണ പുറത്താക്കലിനേക്കാൾ ശക്തമായ, ബലപ്രയോഗത്തോടെയുള്ള ഓടിച്ചുവിടലിനെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: പുറത്താക്കുക
  rationale: ഗ്രശ് എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ബലമായ പുറത്താക്കലിനെ സൂചിപ്പിക്കുന്നു. ‘അയച്ചുകളയുക’ എന്ന മൃദുവായ പ്രയോഗത്തെക്കാൾ ‘പുറത്താക്കുക’ മൂലത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: הָאָמָה
  choice: അടിമസ്ത്രീ
  rationale: ആമാ താഴ്ന്ന സാമൂഹിക-നിയമപദവിയിലുള്ള സ്ത്രീ അടിമയെയോ ബന്ധിത സേവികയെയോ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ അവളുടെ ബന്ധിത പദവി പ്രസക്തമായതിനാൽ ‘അടിമസ്ത്രീ’ വ്യക്തവും ചരിത്രപരമായി യോജിച്ചതുമാണ്.
- source_word: בְּנָהּ
  choice: അവളുടെ മകൻ
  rationale: മൂലത്തിലെ ലളിതമായ ഉടമസ്ഥതാസംബന്ധം വികസിപ്പിക്കാതെയും പരാവർത്തനം ചെയ്യാതെയും നിലനിർത്തുന്നു.
- source_word: כִּי לֹא יִירַשׁ
  choice: കാരണം ... അവകാശം പ്രാപിക്കുകയില്ല
  rationale: כִּי ആവശ്യത്തിന്റെ കാരണം നൽകുന്നു; יירשׁ അവകാശം ലഭിക്കുക അഥവാ അവകാശിയാകുക എന്നർത്ഥം വഹിക്കുന്നു. ഭാവിസൂചനയുള്ള നിഷേധം മലയാളത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: ഈ അടിമസ്ത്രീയുടെ മകൻ
  rationale: ആവർത്തിക്കുന്ന നിർദ്ദേശകവും നാമപദസമുച്ചയവും സാറായുടെ അകൽച്ചയും നിന്ദാസൂചനയും പ്രകടമാക്കുന്നു; അത് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: എന്റെ മകനോടൊപ്പം, യിസ്ഹാക്കിനോടൊപ്പം
  rationale: ‘യിസ്ഹാക്ക്’ എന്നതിനുമുമ്പ് עִם ആവർത്തിക്കുന്ന മൂലത്തിലെ ഊന്നലും സമാനാധികരണ സ്വഭാവവും മലയാളത്തിലും ആവർത്തനത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: അപ്പോൾ അവൾ അബ്രാഹാമിനോടു പറഞ്ഞു
  rationale: കഥനത്തിലെ וַ തുടർച്ചയും സന്ദർഭത്തിൽ നിന്നുള്ള ഫലക്രമവും സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള കഥനബന്ധമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘അടിമസ്ത്രീ’ ചരിത്രപരമായ സാമൂഹിക-നിയമപദവി മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു. അവസാന ഭാഗത്തിലെ എബ്രായ ആവർത്തനം അല്പം അടയാളപ്പെടുത്തിയ മലയാളഘടനയിലൂടെ മനപ്പൂർവം നിലനിർത്തി.
