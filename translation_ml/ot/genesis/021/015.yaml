translation:
  language: ml
  text: തോൽക്കുടത്തിലെ വെള്ളം തീർന്നപ്പോൾ, അവൾ ബാലനെ ഒരു കുറ്റിച്ചെടിയുടെ ചുവട്ടിൽ എറിഞ്ഞിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എറിഞ്ഞിട്ടു’ എന്നതിനു ‘വലിച്ചെറിഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ വെറും ‘കിടത്തി’ എന്നതിനെക്കാൾ ശക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם
  choice: വെള്ളം തീർന്നപ്പോൾ
  rationale: כלה ഇവിടെ വെള്ളം മുഴുവനായി തീർന്നുപോയതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വെള്ളം തീർന്നു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִן הַחֵמֶת
  choice: തോൽക്കുടത്തിലെ
  rationale: חֵמֶת മൃഗത്തോൽകൊണ്ടുണ്ടാക്കിയ ദ്രാവകപാത്രമാണ്. ‘തോൽക്കുടം’ പാത്രത്തിന്റെ സ്വഭാവവും സന്ദർഭത്തിലെ ഉപയോഗവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַתַּשְׁלֵךְ
  choice: എറിഞ്ഞിട്ടു
  rationale: שלך എന്ന ക്രിയ ‘എറിയുക/വലിച്ചെറിയുക’ എന്ന ശക്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; വെറും ‘കിടത്തി’ എന്നതിനെക്കാൾ മൂലഭാഷയിലെ തീവ്രത ഇത് നിലനിർത്തുന്നു.
- source_word: אֶת הַיֶּלֶד
  choice: ബാലനെ
  rationale: יֶלֶד ആൺകുട്ടിയെയോ ബാലനെയോ സൂചിപ്പിക്കുന്നു. ‘ബാലൻ’ മാന്യവും ആധുനിക വിവരണശൈലിക്ക് യോജിച്ചതുമാണ്.
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: കുറ്റിച്ചെടികളിലൊന്നിന്റെ ചുവട്ടിലേക്ക്
  rationale: താഴെയുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന תַּחַת-നെയും കുറ്റിച്ചെടി/ചെടി എന്ന שִׂיחַ-നെയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ചലനക്രിയയോടൊപ്പം ‘ചുവട്ടിലേക്ക്’ യോജിക്കുന്നു.
