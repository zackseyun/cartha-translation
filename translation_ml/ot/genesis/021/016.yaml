translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കഥയുടെ ദുഃഖഭാവം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ സ്ഥലസൂചനയും ആവർത്തനവും സംരക്ഷിച്ചു.
