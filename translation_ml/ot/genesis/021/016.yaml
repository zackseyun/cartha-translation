source:
  edition: WLC
  text: וַ/תֵּלֶךְ֩ וַ/תֵּ֨שֶׁב לָ֜/הּ מִ/נֶּ֗גֶד הַרְחֵק֙ כִּ/מְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל אֶרְאֶ֖ה בְּ/מ֣וֹת הַ/יָּ֑לֶד וַ/תֵּ֣שֶׁב מִ/נֶּ֔גֶד וַ/תִּשָּׂ֥א אֶת קֹלָ֖/הּ וַ/תֵּֽבְךְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: ml
  text: പിന്നെ അവൾ പോയി, അവന് എതിർവശത്ത്, ഏകദേശം ഒരു അമ്പെയ്ത്തിന്റെ ദൂരം അകലെ, തനിയെ ഇരുന്നു. “കുട്ടി മരിക്കുന്നത് ഞാൻ കാണേണ്ടിവരരുതേ,” എന്ന് അവൾ പറഞ്ഞു. അങ്ങനെ അവൾ അവന് എതിർവശത്ത് ഇരുന്ന് ശബ്ദം ഉയർത്തി കരഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: അവന് എതിർവശത്ത്
  rationale: മുഖാമുഖമായോ എതിർവശത്തായോ അകന്നു നിൽക്കുന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു. ആവർത്തനം നിലനിർത്തുന്നത് എബ്രായവാക്യത്തിന്റെ ഘടനയും ദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: הַרְחֵק
  choice: അകലെ
  rationale: רחק എന്ന ധാതുവിന്റെ ക്രിയാവിശേഷണപ്രയോഗം ദൂരം ഊന്നിപ്പറയുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: ഏകദേശം ഒരു അമ്പെയ്ത്തുദൂരം
  rationale: വില്ലിൽനിന്ന് അമ്പ് എത്തുന്ന ദൂരത്തെ സൂചിപ്പിക്കുന്ന ഏകദേശ ദൂരപ്രയോഗം സംക്ഷിപ്തമായും ദൃശ്യാത്മകമായും നിലനിർത്തുന്നു.
- source_word: הַיֶּלֶד
  choice: കുട്ടി
  rationale: ילד ബാലനെയോ കുട്ടിയെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ മാതൃബന്ധവും ദുഃഖവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കുട്ടി’ അനുയോജ്യം; നിർദ്ദിഷ്ട പ്രായം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: אַל־אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: കുട്ടി മരിക്കുന്നത് ഞാൻ കാണേണ്ടിവരരുതേ
  rationale: ആദ്യപുരുഷ നിഷേധാത്മക ആഗ്രഹവും മരണത്തിന് സാക്ഷിയാകാതിരിക്കാനുള്ള വേദനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പദാനുപദമായ ‘കുട്ടിയുടെ മരണത്തിൽ’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: ഉറക്കെ കരഞ്ഞു
  rationale: ശബ്ദം ഉയർത്തുക എന്ന എബ്രായ പ്രയോഗവും പിന്നാലെയുള്ള കരച്ചിലും മലയാളത്തിൽ ഒരൊറ്റ സ്വാഭാവിക വിലാപപ്രയോഗമായി നൽകുന്നു; പ്രവർത്തിയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
