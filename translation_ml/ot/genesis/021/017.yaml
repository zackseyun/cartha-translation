base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: ml
  text: 'ദൈവം ബാലന്റെ ശബ്ദം[a] കേട്ടു; ദൈവത്തിന്റെ ദൂതൻ സ്വർഗ്ഗത്തിൽനിന്ന് ഹാഗാറിനെ വിളിച്ച് അവളോടു പറഞ്ഞു: “ഹാഗാറേ, നിനക്ക് എന്തുപറ്റി? ഭയപ്പെടേണ്ടാ; ബാലൻ ഉള്ളിടത്ത് അവന്റെ ശബ്ദം ദൈവം കേട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടിടത്തുമുള്ള “ബാലന്റെ ശബ്ദം” എന്നതിന് “ബാലന്റെ നിലവിളി” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ കോൽ എന്ന പദത്തിന് ദുരിതത്തിൽ ഉയരുന്ന കേൾക്കാവുന്ന നിലവിളിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: ദൈവം ... കേട്ടു
  rationale: שׁמע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; ‘ഉത്തരം നൽകി’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: ബാലന്റെ ശബ്ദം / അവന്റെ ശബ്ദം
  rationale: קוֹל എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ശബ്ദം’ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘നിലവിളി’ എന്നും മനസ്സിലാക്കാം; അത് അടിക്കുറിപ്പിൽ നൽകുന്നു. ആവർത്തനത്തിലെ രണ്ടാമത്തെ പ്രയോഗത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി ‘അവന്റെ’ ഉപയോഗിച്ചു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: ഇവിടെ യിശ്മായേലിനെ സൂചിപ്പിക്കുന്ന നַעַר എന്ന പദത്തിന് ആധുനികവും മാന്യവുമായ യോജിച്ച മലയാളം.
- source_word: מַלְאַךְ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതൻ
  rationale: എബ്രായ ഘടന നേരിട്ട് സംരക്ഷിക്കുകയും ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ ചർച്ച മുൻകൂട്ടി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: സ്ഥാനസൂചകമായ പ്രയോഗത്തിന് സ്വാഭാവിക മലയാളം; ദൂതൻ മുകളിൽനിന്ന് വിളിച്ചതെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്തുപറ്റി?
  rationale: ‘നിനക്ക് എന്താണ്?’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം; ശാസനാഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ടാ
  rationale: സ്ത്രീലിംഗ ഏകവചന നിരോധനാജ്ഞയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: ദൈവം കേട്ടിരിക്കുന്നു
  rationale: പൂർണക്രിയയുടെ ഇപ്പോഴത്തെ ഫലസൂചന മലയാളത്തിൽ ‘കേട്ടിരിക്കുന്നു’ എന്ന രൂപത്തിൽ നന്നായി പ്രകടമാകുന്നു.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: ബാലൻ ഇപ്പോൾ എവിടെയാണോ അവിടെനിന്നുള്ള
  rationale: കേൾക്കപ്പെട്ട ശബ്ദത്തോട് ഈ സ്ഥാനസൂചക വാക്യഭാഗത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘ഇപ്പോൾ’ മൂലത്തിലെ അവന്റെ നിലവിലെ സ്ഥിതി/സ്ഥാനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു, പുതിയ കാലവിവരം ചേർക്കാനല്ല.
theological_decisions:
- issue: മַלְאַךְ אֱלֹהִים എന്ന ദൂതന്റെ ദൈവത്തോടുള്ള ബന്ധവും വ്യക്തിത്വവും
  choice: ദൈവത്തിന്റെ ദൂതൻ
  alternative: ഒരു ദൈവദൂതൻ; ദൈവദൂതൻ
  rationale: മൂലപദപ്രയോഗം നിലനിർത്തി, ദൂതനെ ദൈവത്തോട് പൂർണമായി തുല്യപ്പെടുത്തുകയോ വെറും സൃഷ്ടദൂതനായി നിർവചിക്കുകയോ ചെയ്യാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ മുറിപ്പ് സംരക്ഷിക്കുന്നു.
- issue: ബാലന്റെ קוֹל ദുഃഖനിലവിളിയാണോ സാധാരണ ശബ്ദമാണോ
  choice: ശബ്ദം
  alternative: നിലവിളി
  rationale: അടിസ്ഥാന ലെക്സിക്കൽ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സന്ദർഭസാധ്യമായ ‘നിലവിളി’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. ‘ബാലൻ’, ‘ദൈവത്തിന്റെ ദൂതൻ’, ‘ഭയപ്പെടേണ്ടാ’ എന്നീ രൂപങ്ങൾ ഔപചാരികതയും സ്വാഭാവികതയും തുലനം ചെയ്യുന്നു. മുഖ്യവാചകത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
