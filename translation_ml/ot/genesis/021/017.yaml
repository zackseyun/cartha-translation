  to: 'ദൈവം ബാലന്റെ ശബ്ദം[a] കേട്ടു; ദൈവത്തിന്റെ ദൂതൻ സ്വർഗ്ഗത്തിൽനിന്ന് ഹാഗാറിനെ വിളിച്ച് അവളോടു പറഞ്ഞു: “ഹാഗാറേ, നിനക്ക് എന്തുപറ്റി? ഭയപ്പെടേണ്ടാ; ബാലൻ ഉള്ളിടത്ത് അവന്റെ ശബ്ദം ദൈവം കേട്ടിരിക്കുന്നു.”'
  rationale: The revision restores the Hebrew locative sense without adding a temporal element or treating the phrase as an adjective modifying ‘voice.’ It also uses the standard biblical Malayalam term for ‘heaven.’ The second occurrence of ‘his voice’ remains a natural anaphoric rendering while retaining the repeated reference to the boy through “ബാലൻ ഉള്ളിടത്ത്.”
