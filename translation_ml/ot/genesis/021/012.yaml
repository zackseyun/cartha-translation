id: GEN.21.12
reference: Genesis 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: ml
  text: 'എന്നാൽ ദൈവം അബ്രാഹാമിനോടു പറഞ്ഞു: “ആ ബാലനെയും നിന്റെ അടിമസ്ത്രീയെയും കുറിച്ച് നിനക്കു വിഷമം തോന്നരുത്.[a] സാറാ നിന്നോടു പറയുന്നതെല്ലാം അവളുടെ വാക്ക് കേൾക്കുക.[b] കാരണം, യിസ്ഹാക്കിലൂടെയാണ് നിന്റെ സന്തതി വിളിക്കപ്പെടുക.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ആ ബാലനെയും നിന്റെ അടിമസ്ത്രീയെയും കുറിച്ച് നിന്റെ കാഴ്ചയിൽ അനിഷ്ടമായിരിക്കരുത്”; അഥവാ, അവരെക്കുറിച്ച് ദുഃഖിക്കുകയോ അനിഷ്ടം തോന്നുകയോ അരുത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവളുടെ ശബ്ദം കേൾക്കുക”; അഥവാ, സാറാ പറയുന്നത് ചെവിക്കൊള്ളുക.
    reason: lexical_alternative
  - marker: c
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “യിസ്ഹാക്കിൽ നിന്റെ സന്തതി വിളിക്കപ്പെടും.” ഇതിന്, അബ്രാഹാമിന്റേതായി തിരിച്ചറിയപ്പെടുന്ന വാഗ്ദത്തവംശം യിസ്ഹാക്കിലൂടെ വരും എന്നർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: നിനക്കു വിഷമം തോന്നരുത്
  rationale: ‘നിന്റെ കണ്ണുകളിൽ ദോഷമായിരിക്കരുത്’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ ദുഃഖമോ മനോവിഷമമോ തോന്നുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുമ്പോഴും വികാരത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ആ ബാലൻ
  rationale: ഇവിടെ യിശ്മായേലിനെ സൂചിപ്പിക്കുന്ന נַעַר എന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും പ്രായസൂചന നിലനിർത്തുന്നതുമായ പരിഭാഷ.
- source_word: אֲמָתֶךָ
  choice: നിന്റെ അടിമസ്ത്രീ
  rationale: אָמָה സൂചിപ്പിക്കുന്ന ബന്ധിതവും കീഴാളവുമായ സാമൂഹികപദവി ‘ദാസി’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു; ഹാഗാറിന്റെ അവസ്ഥയെ മൃദൂകരിക്കുന്നില്ല.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: അവളുടെ വാക്കു കേൾക്കുക
  rationale: അക്ഷരാർഥത്തിലെ ‘അവളുടെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം ഭാഗികമായി നിലനിർത്തുകയും ‘അവൾ പറയുന്നത് ചെവിക്കൊള്ളുക’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּיִצְחָק
  choice: യിസ്ഹാക്കിലൂടെ
  rationale: בְ എന്ന ഉപസർഗം ഇവിടെ വംശപരമ്പര നിർണയിക്കപ്പെടുന്ന മാർഗമോ രേഖയോ സൂചിപ്പിക്കുന്നു. ‘യിസ്ഹാക്കിലൂടെ’ അത് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘യിസ്ഹാക്കിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: ‘നിന്റെ സന്തതി’ എന്നു വിളിക്കപ്പെടുക
  rationale: קרא എന്ന ക്രിയയിലെ ‘വിളിക്കുക/നാമകരണം ചെയ്യുക’ എന്ന ഭാവം നിലനിർത്തിക്കൊണ്ട്, അബ്രാഹാമിന്റേതായി അംഗീകരിക്കപ്പെടുന്ന വാഗ്ദത്തവംശത്തെ സൂചിപ്പിക്കുന്നു. ‘കണക്കാക്കപ്പെടുക’ എന്നു വ്യാഖ്യാനിച്ച് തീർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
- source_word: זָרַע
  choice: സന്തതി
  rationale: കൂട്ടവാചക ഏകവചനമായ זֶרַע എന്ന പദത്തിന്റെ വംശപരമായ അർഥവും ഏകവചനരൂപവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: എന്നാൽ ദൈവം ... പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ അബ്രാഹാമിന്റെ വിഷമത്തോടുള്ള ആശയവൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഹാഗാറിന്റെ സാമൂഹികപദവി
  choice: നിന്റെ അടിമസ്ത്രീ
  alternative: നിന്റെ ദാസി / നിന്റെ വേലക്കാരി
  rationale: പാഠം ഹാഗാറിന്റെ ബന്ധിതവും കീഴാളവുമായ നില വ്യക്തമാക്കുന്നു. അതിനെ മൃദൂകരിക്കാതെ, ഇന്നത്തെ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം പരിഭാഷപ്പെടുത്തി.
- issue: വാഗ്ദത്തസന്തതി യിസ്ഹാക്കിലൂടെ വിളിക്കപ്പെടുന്നു എന്ന വാക്യം
  choice: യിസ്ഹാക്കിലൂടെയുള്ളവരായിരിക്കും ‘നിന്റെ സന്തതി’ എന്നു വിളിക്കപ്പെടുക
  alternative: യിസ്ഹാക്കിൽ നിനക്കു സന്തതി വിളിക്കപ്പെടും / യിസ്ഹാക്കിലൂടെയുള്ളവർ നിന്റെ സന്തതിയായി കണക്കാക്കപ്പെടും
  rationale: വാക്യം അബ്രാഹാമിന്റെ വാഗ്ദത്തവംശം യിസ്ഹാക്കിലൂടെ തിരിച്ചറിയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ യിശ്മായേലുമായുള്ള ജൈവബന്ധം നിഷേധിക്കുന്നതായി അതിനെ വിശദീകരിച്ചു തീർക്കുന്നില്ല. ‘വിളിക്കപ്പെടുക’ എന്ന മൂലരൂപം നിലനിർത്തി ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ ശൈലിയുടെ അസ്വാഭാവികത പ്രധാനവാചകത്തിൽ മിതമായി സ്വാഭാവികമാക്കി; പ്രധാനപ്പെട്ട അക്ഷരാർഥരൂപങ്ങളും അർഥവൈകല്യസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
