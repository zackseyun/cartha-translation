  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മലയാളം. വാക്യത്തിന്റെ കഥനലാളിത്യം നിലനിർത്തുകയും വിവാഹക്രമീകരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്തു.
