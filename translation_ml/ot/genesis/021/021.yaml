  text: וַ/יֵּ֖שֶׁב בְּ/מִדְבַּ֣ר פָּארָ֑ן וַ/תִּֽקַּֽח ל֥/וֹ אִמּ֛/וֹ אִשָּׁ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: ml
  text: അവൻ പാരാൻ മരുഭൂമിയിൽ താമസിച്ചു; അവന്റെ അമ്മ ഈജിപ്തുദേശത്തുനിന്ന് അവനുവേണ്ടി ഒരു ഭാര്യയെ കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവന്റെ അമ്മ ഈജിപ്തുദേശത്തുനിന്ന് അവനുവേണ്ടി ഒരു സ്ത്രീയെ എടുത്തു”; സന്ദർഭം വിവാഹക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ “ഭാര്യയെ കൊണ്ടുവന്നു” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയ്ക്ക് ഇരിക്കുക, വസിക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ സ്ഥിരമായി കുടിയേറി എന്ന ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ വാസത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘താമസിച്ചു’ ഉപയോഗിച്ചു.
- source_word: בְּמִדְבַּר פָּארָן
  choice: പാരാൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെയോ വനാന്തരത്തെയോ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു; פָּארָן സ്ഥലനാമമായി ‘പാരാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַתִּקַּח
  choice: കണ്ടെത്തി
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ לוֹ אִשָּׁה എന്ന വിവാഹക്രമീകരണസന്ദർഭത്തിൽ അമ്മ അവനുവേണ്ടി ഭാര്യയെ ഏർപ്പെടുത്തിയതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കണ്ടെത്തി’ എന്നു നൽകി. മൂലത്തിലെ പ്രവർത്തകത്വം നിലനിൽക്കുന്നു.
- source_word: לוֹ
  choice: അവനുവേണ്ടി
  rationale: ל പ്രത്യയത്തോടുകൂടിയ രൂപം ഇവിടെ പ്രയോജനമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; വിവാഹപങ്കാളിയെ ക്രമീകരിക്കുന്ന സന്ദർഭത്തിന് ‘അവനുവേണ്ടി’ യോജിക്കുന്നു.
- source_word: אִמּוֹ
  choice: അവന്റെ അമ്മ
  rationale: മൂലത്തിലെ വ്യക്തമായ ബന്ധസൂചന അതേപടി നിലനിർത്തി.
- source_word: אִשָּׁה
  choice: ഒരു ഭാര്യ
  rationale: אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. അവനുവേണ്ടി സ്ത്രീയെ കൊണ്ടുവരുന്ന ഈ സന്ദർഭം വിവാഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ ‘ഭാര്യ’ ഉപയോഗിച്ചു; പദാർത്ഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: എബ്രായത്തിൽ אֶרֶץ (‘ദേശം’) വ്യക്തമായി ഉള്ളതിനാൽ ‘ഈജിപ്തിൽനിന്ന്’ എന്നു ചുരുക്കാതെ പൂർണപ്രയോഗം നിലനിർത്തി.
