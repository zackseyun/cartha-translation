- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: ശപഥം നടന്ന സ്ഥലത്തെ ഊന്നിപ്പറയുന്ന സ്വാഭാവിക മലയാള സ്ഥാനസൂചകം.
- source_word: נִשְׁבְּעוּ
  choice: സത്യം ചെയ്തിരുന്നു
