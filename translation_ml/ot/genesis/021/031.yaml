  text: അതുകൊണ്ട് അവൻ ആ സ്ഥലത്തിന് ബേർ-ശേബ[a] എന്നു പേരിട്ടു; കാരണം അവിടെ അവർ ഇരുവരും ശപഥം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബേർ-ശേബ” എന്ന പേര് ഹീബ്രുവിൽ “ഏഴിന്റെ കിണർ” എന്നും “ശപഥത്തിന്റെ കിണർ” എന്നും അർഥമുള്ള പ്രയോഗങ്ങളുമായി ബന്ധപ്പെട്ടതാണ്; ഇവിടെ നൽകിയിരിക്കുന്ന വിശദീകരണം ഈ പേരിനെ പ്രത്യേകമായി അവിടെ ചെയ്ത ശപഥവുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
