source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖/י אֱלֹהִ֑ים כָּל הַ/שֹּׁמֵ֖עַ יִֽצְחַק לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: ml
  text: 'സാറാ പറഞ്ഞു: “ദൈവം എനിക്കു ചിരി വരുത്തിയിരിക്കുന്നു; ഇത് കേൾക്കുന്ന എല്ലാവരും എന്നോടൊപ്പം ചിരിക്കും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത് കേൾക്കുന്ന എല്ലാവരും എന്നെച്ചൊല്ലി ചിരിക്കും” എന്നും “എനിക്കായി ചിരിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഈ അർഥസൂക്ഷ്മതകൾ അനുവദിക്കുന്നുവെങ്കിലും, സന്ദർഭത്തിൽ സാറായോടൊപ്പം സന്തോഷത്തോടെ ചിരിക്കുക എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു നയിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കഥാചലനം നൽകാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: שָׂרָה
  choice: സാറാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: צְחֹק
  choice: ചിരി
  rationale: നാമരൂപം നിലനിർത്തുകയും തുടർന്നുള്ള יִצְחַק എന്ന ക്രിയയുമായും യിസ്ഹാക്കിന്റെ പേരുമായുമുള്ള പദവിനോദം കഴിയുന്നത്ര സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עָשָׂה לִי
  choice: എനിക്കായി ... ഉണ്ടാക്കിയിരിക്കുന്നു
  rationale: ‘എനിക്കായി ഉണ്ടാക്കി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ മൂർത്തത സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ സാറായ്ക്കുവേണ്ടി പ്രവർത്തിക്കുന്ന ഏകദൈവത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: ഇതു കേൾക്കുന്ന എല്ലാവരും
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമെങ്കിലും അർഥം വിതരണാത്മകമാണ്. സന്ദർഭത്തിൽ കേൾക്കുന്നത് ഈ വാർത്തയാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: יִצְחַק
  choice: ചിരിക്കും
  rationale: צְחֹק എന്ന നാമത്തോടും യിസ്ഹാക്കിന്റെ പേരോടുമുള്ള ഒരേ മൂലപദബന്ധം നിലനിർത്താൻ ‘ചിരിക്കും’ തെരഞ്ഞെടുത്തു.
- source_word: לִי
  choice: എന്നോടൊപ്പം
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്ക്/എനിക്കായി’ എന്നാകാമെങ്കിലും, സന്ദർഭത്തിൽ സാറായുടെ സന്തോഷത്തിൽ പങ്കുചേരുന്ന ചിരിയാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: അവസാന പ്രയോഗമായ יִצְחַק לִי എന്നതിന്റെ അർഥം
  choice: 'പങ്കിട്ട സന്തോഷചിരി: ‘എന്നോടൊപ്പം ചിരിക്കും’'
  alternative: ‘എന്നെച്ചൊല്ലി ചിരിക്കും’ അല്ലെങ്കിൽ ‘എനിക്കായി ചിരിക്കും’
  rationale: യിസ്ഹാക്കിന്റെ ജനനത്തെക്കുറിച്ചുള്ള സാറായുടെ ആനന്ദമാണ് സന്ദർഭം; അതിനാൽ പരിഹാസത്തേക്കാൾ അവളുടെ സന്തോഷത്തിൽ പങ്കുചേരുന്നതാണ് മുഖ്യവായന. എങ്കിലും എബ്രായ ദാതിവിഭക്തി ഒന്നിലധികം സൂക്ഷ്മാർഥങ്ങൾ അനുവദിക്കുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി. ‘ചിരി/ചിരിക്കും’ എന്ന ആവർത്തനം മൂലഭാഷയിലെ പദവിനോദം സംരക്ഷിക്കുന്നു; യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
