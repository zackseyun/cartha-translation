id: GEN.21.4
reference: Genesis 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: ml
  text: അബ്രാഹാം തന്റെ മകനായ യിസ്ഹാക്കിനെ എട്ടു ദിവസം പ്രായമുള്ളപ്പോൾ[a] പരിച്ഛേദനം ചെയ്തു; ദൈവം തന്നോടു കല്പിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എട്ടു ദിവസത്തിന്റെ മകൻ.’'
    reason: ഹീബ്രുവിലെ പ്രായസൂചക പ്രയോഗത്തിന്റെ അക്ഷരാർഥം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיָּמָל
  choice: പരിച്ഛേദനം ചെയ്തു
  rationale: מול എന്ന ക്രിയ പ്രത്യേകമായി പരിച്ഛേദനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ കൃത്യവും മാന്യവുമായ പതിവുപദപ്രയോഗമാണിത്.
- source_word: אֶת יִצְחָק
  choice: യിസ്ഹാക്കിന്
  rationale: നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടിയ വ്യക്തിനാമം; മലയാള വാക്യഘടനയിൽ ‘പരിച്ഛേദനം ചെയ്തു’ എന്ന പ്രയോഗത്തോട് സ്വാഭാവികമായി ചേരാൻ ദത്തിവിഭക്തി ഉപയോഗിച്ചു.
- source_word: בְּנוֹ
  choice: തന്റെ മകനായ
  rationale: യിസ്ഹാക്ക് അബ്രാഹാമിന്റെ മകനാണെന്ന കുടുംബബന്ധത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; കർത്താവിലേക്കു തിരിച്ചുനിൽക്കുന്നതിനാൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: എട്ടു ദിവസം പ്രായമായപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘എട്ടു ദിവസത്തിന്റെ മകൻ’ എന്ന ഹീബ്രു പ്രായസൂചക ശൈലി; അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: അബ്രാഹാമിന്റെ പ്രവൃത്തി ദൈവകല്പനയോട് കൃത്യമായി ഒത്തിരുന്നുവെന്ന താരതമ്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה אֹתוֹ
  choice: തന്നോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പന അബ്രാഹാമിനോടായിരുന്നുവെന്ന് വ്യക്തമാക്കുകയും, മുൻപുണ്ടായ ദൈവകല്പനയോടുള്ള അനുസരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭോചിതമായ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions:
- issue: ദൈവകല്പനയുടെ മുൻകാലസ്വഭാവം
  choice: ‘ദൈവം തന്നോടു കല്പിച്ചതുപോലെതന്നെ’ എന്ന ഉപവാക്യം പ്രവൃത്തിക്കു മുമ്പായി നൽകി
  alternative: ‘ദൈവം തന്നോടു കല്പിച്ചതുപോലെ’ എന്ന് വാക്യാവസാനത്തിൽ നൽകുക
  rationale: ഹീബ്രുവിലെ ക്രിയാരൂപം സ്വതന്ത്രമായി മുൻകാലപൂർണത നിർബന്ധിക്കുന്നില്ല. മലയാളത്തിൽ ഉപവാക്യത്തിന്റെ സ്ഥാനവും സന്ദർഭവും കല്പന മുമ്പുണ്ടായിരുന്നുവെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ബൈബിൾ വായനയിൽ പരിചിതമായ ‘അബ്രാഹാം,’ ‘യിസ്ഹാക്ക്,’ ‘പരിച്ഛേദനം,’ ‘കല്പിച്ചു’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രു വാക്യത്തിന്റെ കുടുംബബന്ധവും കല്പനയോടുള്ള കൃത്യമായ അനുസരണവും നിലനിർത്തി.
