id: GEN.21.27
reference: Genesis 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാഹാം ആടുമാടുകളെ എടുത്ത് അബീമേലെക്കിനു കൊടുത്തു; അവർ ഇരുവരും ഒരു ഉടമ്പടി ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഒരു ഉടമ്പടി മുറിച്ചു”; ഔപചാരികമായി ഉടമ്പടി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുകയും തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകളെ
  rationale: ചെറുകന്നുകാലികളെയും കന്നുകാലികളെയും സൂചിപ്പിക്കുന്ന ഈ പദജോടിക്ക് മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ സമുച്ചയപ്രയോഗമാണ് ‘ആടുമാടുകൾ’. צֹאן ആടിനെയും കോലാടിനെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ‘ചെമ്മരിയാടുകൾ’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: അബീമേലെക്കിനു കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ‘കൊടുക്കുക’ എന്ന അർഥവും ל എന്ന ദിശാസൂചകവും നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁנֵיהֶם
  choice: അവർ ഇരുവരും
  rationale: ഉടമ്പടിയിലെ രണ്ടു കക്ഷികളെയും എബ്രായപാഠം വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്നതിനാൽ ആ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ സ്വാഭാവികമല്ല; എബ്രായ ശൈലിയുടെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: നിയമപരവും ബന്ധപരവുമായ പ്രതിബദ്ധത ഉൾക്കൊള്ളുന്ന പ്രധാന ബൈബിൾപദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ തുല്യപദമാണ്.
theological_decisions:
- issue: כרת ברית എന്ന ഉടമ്പടി-ശൈലിയുടെ പരിഭാഷ
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  alternative: ഒരു ഉടമ്പടി മുറിച്ചു
  rationale: അക്ഷരാർഥമായ ‘മുറിച്ചു’ എബ്രായത്തിലെ പതിവുശൈലി സംരക്ഷിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം. അതിനാൽ മുഖ്യപാഠത്തിൽ അർഥം സ്വാഭാവികമായി നൽകി, ഉറവിടഭാഷയിലെ രൂപം അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അങ്ങനെ’ മുൻസന്ദർഭത്തിലെ പ്രവർത്തനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; അർദ്ധവിരാമം സമ്മാനം നൽകലും ഉടമ്പടി ചെയ്യലും തമ്മിലുള്ള അടുത്ത ബന്ധം വ്യക്തമാക്കുന്നു.
