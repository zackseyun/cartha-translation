id: GEN.21.7
reference: Genesis 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר מִ֤י מִלֵּל֙ לְ/אַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי יָלַ֥דְתִּי בֵ֖ן לִ/זְקֻנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “സാറാ മക്കളെ മുലയൂട്ടുമെന്ന് അബ്രാഹാമിനോട് ആർ പറഞ്ഞേനെ?[a] കാരണം, അവന്റെ വാർധക്യത്തിൽ ഞാൻ ഒരു മകനെ പ്രസവിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സാറാ പുത്രന്മാരെ മുലയൂട്ടുമെന്ന് അബ്രാഹാമിനോട് ആർ പറഞ്ഞിരുന്നു?” ഹീബ്രുവിൽ അക്ഷരാർഥം “പുത്രന്മാരെ” എന്നാണ്; സന്ദർഭത്തിൽ സ്വാഭാവികമായി “മക്കളെ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: വയിക്തോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സ്ത്രീലിംഗ കർത്താവ് സന്ദർഭത്തിൽ സാറായാണ്.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: അബ്രാഹാമിനോട് ആർ പറയുമായിരുന്നു?
  rationale: പ്രതീക്ഷിക്കാനാവാത്ത സംഭവത്തെക്കുറിച്ചുള്ള വിസ്മയം പ്രകടിപ്പിക്കുന്ന അലങ്കാരചോദ്യം നിലനിർത്തുന്നു.
- source_word: הֵינִיקָה
  choice: മുലയൂട്ടുമെന്ന്
  rationale: ינק എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ‘മുലയൂട്ടുക’ എന്ന മാതൃപ്രവൃത്തിയെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: בָנִים
  choice: മക്കളെ
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്ന ബഹുവചനമാണെങ്കിലും, മുലയൂട്ടലുമായി ചേർന്ന പ്രയോഗത്തിൽ മലയാളത്തിലെ ‘മക്കൾ’ സ്വാഭാവികമാണ്; അടുത്ത വാക്യഭാഗം ശിശു ഒരു മകനാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: എന്നിട്ടും
  rationale: മുൻപത്തെ വിസ്മയചോദ്യത്തിനു പിന്നാലെ യാഥാർഥ്യമായ അത്ഭുതഫലം ഊന്നിപ്പറയുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഇതിന്റെ വിശദീകരണാർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יָלַדְתִּי בֵן
  choice: ഞാൻ ഒരു മകനെ പ്രസവിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും בֵן എന്നതിന്റെ വ്യക്തമായ പുരുഷലിംഗ അർഥവും കൃത്യമായി നൽകുന്നു.
- source_word: לִזְקֻנָיו
  choice: അവന്റെ വാർധക്യത്തിൽ
  rationale: അബ്രാഹാമിന്റെ പ്രായാധിക്യകാലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ വിശദീകരണപരമോ ഊന്നൽ/വൈരുധ്യപരമോ ആയ ഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘എന്നിട്ടും’
  alternative: ‘കാരണം’ / ‘എന്തെന്നാൽ’
  rationale: ഹീബ്രു כִּי വിശദീകരണത്തിന് വഴിയൊരുക്കുമ്പോഴും ഇവിടെ സാറായുടെ വിസ്മയം മലയാളത്തിൽ വ്യക്തമായി കേൾപ്പിക്കാൻ ‘എന്നിട്ടും’ തെരഞ്ഞെടുത്തു; യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയതിനാൽ ദ്വയാർഥം മായ്ച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ വിസ്മയം നിലനിർത്തി; ‘മുലയൂട്ടുക’, ‘പ്രസവിക്കുക’, ‘വാർധക്യം’ എന്നീ സാധാരണവും ഗൗരവമുള്ളതുമായ പദങ്ങൾ ഉപയോഗിച്ചു.
