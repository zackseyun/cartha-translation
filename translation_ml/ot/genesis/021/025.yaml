id: GEN.21.25
reference: Genesis 21:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹכִ֥חַ אַבְרָהָ֖ם אֶת אֲבִימֶ֑לֶךְ עַל אֹדוֹת֙ בְּאֵ֣ר הַ/מַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: ml
  text: അബീമേലെക്കിന്റെ ദാസന്മാർ പിടിച്ചെടുത്ത ആ കിണറിനെക്കുറിച്ച് അബ്രാഹാം അബീമേലെക്കിനെ ശാസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: ശാസിച്ചു
  rationale: הוכיח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തെറ്റ് ചൂണ്ടിക്കാട്ടി നേരിടുക, ശാസിക്കുക എന്ന അർഥം നൽകുന്നു; സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: עַל אֹדוֹת
  choice: യെക്കുറിച്ച്
  rationale: വിഷയം അഥവാ കാര്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: בְּאֵר הַמַּיִם
  choice: ഒരു നീരുറവ
  rationale: באר എന്നത് ഭൂമിയിൽ കുഴിച്ചുണ്ടാക്കിയ കിണറിനെയോ ജലസ്രോതസ്സിനെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘നീരുറവ’ തിരഞ്ഞെടുത്തു. ഹീബ്രുവിലെ നിർദ്ദിഷ്ടത മലയാളത്തിൽ സാഹചര്യത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ അനിശ്ചിതരൂപം സ്വാഭാവികമാണ്.
- source_word: גָּזְלוּ
  choice: പിടിച്ചെടുത്തിരുന്ന
  rationale: ബലമായോ അന്യായമായോ കൈവശപ്പെടുത്തുക എന്ന ക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു; മുൻപ് നടന്ന പ്രവൃത്തിയാണെന്ന കാലബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: അബീമേലെക്കിന്റെ ദാസന്മാർ
  rationale: സേവകർ, ഉദ്യോഗസ്ഥർ, അടിയാർ എന്നിവയെ ഉൾക്കൊള്ളാവുന്ന עבד എന്ന പദത്തിന് ഈ രാജകീയ സാഹചര്യത്തിൽ പരമ്പരാഗതവും വ്യക്തവുമായ ‘ദാസന്മാർ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യം. മൂലത്തിലെ കുറ്റാരോപണത്തിന്റെ ശക്തി ‘ശാസിച്ചു’, ‘പിടിച്ചെടുത്തിരുന്ന’ എന്നീ പദങ്ങളിൽ നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
