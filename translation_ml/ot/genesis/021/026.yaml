source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: ml
  text: 'അബീമേലെക്ക് പറഞ്ഞു: “ഈ കാര്യം[a] ചെയ്തത് ആരാണെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു. നീയും എന്നോട് പറഞ്ഞില്ല; എനിക്കും ഇന്നുവരെ ഇതിനെക്കുറിച്ച് കേട്ടിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ സംഭവം” എന്നോ “ഈ പ്രവൃത്തി” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ ദാവാർ ഒരു കാര്യത്തെയോ, സംഭവത്തെയോ, പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘പറഞ്ഞു’ മതിയായും വ്യക്തമായും അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: לֹא יָדַעְתִּי
  choice: എനിക്ക് അറിയില്ലായിരുന്നു
  rationale: സംസാരസമയത്തിനു മുമ്പുള്ള അബീമേലെക്കിന്റെ അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ഭൂതകാലപ്രയോഗമാണിത്.
- source_word: מִי עָשָׂה
  choice: ചെയ്തത് ആരാണെന്ന്
  rationale: പ്രവൃത്തിയുടെ അജ്ഞാതനായ കർത്താവിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന്റെ ‘കാര്യം, സംഭവം, പ്രവൃത്തി’ എന്നീ അർഥസാധ്യതകളിൽ, തർക്കവിഷയമായ സംഭവത്തെ സൂചിപ്പിക്കാൻ ‘ഈ കാര്യം’ വിശാലവും സ്വാഭാവികവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְגַם אַתָּה
  choice: നീയും
  rationale: גַּם നൽകുന്ന ഉൾപ്പെടുത്തലും ഊന്നലും മലയാളത്തിലെ ‘-യും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: എന്നോട് പറഞ്ഞില്ല
  rationale: הגיד എന്ന ക്രിയയുടെ ‘അറിയിക്കുക/പറയുക’ എന്ന ആശയം സംഭാഷണസന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְגַם אָנֹכִי
  choice: ഞാൻ തന്നെയും
  rationale: גַּם എന്ന ഉൾപ്പെടുത്തലും אָנֹכִי എന്ന പൂർണ സർവനാമരൂപത്തിന്റെ സാധ്യതയുള്ള ഊന്നലും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לֹא שָׁמַעְתִּי
  choice: ഇതിനെക്കുറിച്ച് കേട്ടിരുന്നില്ല
  rationale: ഇവിടെ ‘കേൾക്കുക’ എന്നത് ഈ സംഭവത്തെക്കുറിച്ചുള്ള വിവരം ലഭിക്കുക എന്ന അർഥത്തിലാണ്; സൂചിതമായ വിഷയം മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: בִּלְתִּי הַיּוֹם
  choice: ഇന്നുവരെ
  rationale: ഈ ദിവസംവരെ വിവരം ലഭിച്ചിരുന്നില്ല എന്ന സമയപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിച്ചുള്ള גַּם എന്ന ഊന്നൽ ‘നീയും’, ‘ഞാൻ തന്നെയും’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി; അസ്വാഭാവികമായ വാക്ക്-വാക്കായ ഘടന ഒഴിവാക്കി.
