  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: ml
  text: അബ്രാഹാമിന് തന്റെ മകൻ യിസ്ഹാക്ക് ജനിച്ചപ്പോൾ നൂറു വയസ്സായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിൽ അക്ഷരാർഥം: “തന്റെ മകൻ യിസ്ഹാക്ക് അവന് ജനിച്ചപ്പോൾ അബ്രാഹാം നൂറു വർഷത്തിന്റെ മകനായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: അബ്രാഹാമിന്
  rationale: വാക്യബന്ധകമായ וְ മലയാളത്തിലെ സ്വാഭാവികമായ തുടർച്ചയിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു; അബ്രാഹാം എന്ന പേര് പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകി.
- source_word: בֶּן מְאַת שָׁנָה
  choice: നൂറു വയസ്സായിരുന്നു
  rationale: ‘നൂറു വർഷങ്ങളുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം പ്രായം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: בְּ/הִוָּלֶד
  choice: ജനിച്ചപ്പോൾ
  rationale: בְ ചേർന്ന നിഫാൽ infinitive construct സമയസാഹചര്യവും കർമണിപ്രയോഗവും സൂചിപ്പിക്കുന്നു; ‘ജനിച്ചപ്പോൾ’ രണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ל֔/וֹ
  choice: അബ്രാഹാമിന്
  rationale: മകൻ ആർക്കാണ് ജനിച്ചതെന്ന് സൂചിപ്പിക്കുന്ന ‘അവന്’ എന്ന അർഥം ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേരിലൂടെ വ്യക്തമാക്കി.
- source_word: אֵת יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: אֵת സ്വതന്ത്രമായി വിവർത്തനം ചെയ്യേണ്ടതില്ല; יִצְחָק എന്ന പേര് പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപത്തിൽ നൽകി.
- source_word: בְּנֽ/וֹ
  choice: തന്റെ മകൻ
  rationale: അബ്രാഹാമുമായുള്ള പുത്രബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു; ‘സ്വന്തം’ എന്ന അധിക ഊന്നൽ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ പ്രായസൂചക പ്രയോഗം മുഖ്യവാക്യത്തിൽ മലയാളശൈലിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
