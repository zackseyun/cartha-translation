translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ രണ്ട് സമാന്തര സംഭവവാക്യങ്ങളും തുടർന്ന് വരുന്ന ആഘോഷവും വ്യക്തമായി നിലനിർത്തി; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനവിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
