translation:
  language: ml
  text: കുട്ടി വളർന്നു, മുലകുടി മാറി. യിസ്ഹാക്കിന്റെ മുലകുടി മാറിയ ദിവസം അബ്രാഹാം ഒരു വലിയ വിരുന്നൊരുക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: വളർന്നു
  rationale: גדל എന്ന ക്രിയയ്ക്ക് കുട്ടിയുടെ വളർച്ചയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം ‘വളർന്നു’ എന്നാണ്.
- source_word: הַיֶּלֶד
  choice: കുട്ടി
  rationale: יֶלֶד എന്നത് ആൺകുട്ടിയെയോ പൊതുവായി കുട്ടിയെയോ സൂചിപ്പിക്കാം. ലിംഗം പേരിലൂടെ വ്യക്തമാകുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘കുട്ടി’ എന്നു നൽകി.
- source_word: וַיִּגָּמַל
  choice: മുലകുടി മാറി
  rationale: גמל എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ മുലയൂട്ടൽ അവസാനിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘മുലകുടി മാറി’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּעַשׂ
  choice: ഒരുക്കി
  rationale: עשה എന്നതിന് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാലാർഥമുണ്ടെങ്കിലും വിരുന്നിനോടൊപ്പം മലയാളത്തിൽ ‘വിരുന്നൊരുക്കി’ എന്നാണ് സ്വാഭാവികം.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ഒരു വലിയ വിരുന്ന്
  rationale: מִשְׁתֶּה ആഘോഷപരമായ വിരുന്നിനെയും പാനീയസൽക്കാരത്തെയും സൂചിപ്പിക്കാം; גָדוֹל എന്ന വിശേഷണം ‘വലിയ’ എന്നു നേരിട്ട് നിലനിർത്തി.
- source_word: בְּיוֹם הִגָּמֵל אֶת יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ മുലകുടി മാറിയ ദിവസം
  rationale: ഹീബ്രു പ്രയോഗം യിസ്ഹാക്കിന്റെ മുലയൂട്ടൽ അവസാനിച്ച സംഭവദിവസത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്തൃപ്രയോഗമോ കാരകനെ ചേർക്കലോ ഒഴിവാക്കി സംഭവത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
