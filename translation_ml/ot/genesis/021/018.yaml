id: GEN.21.18
reference: Genesis 21:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: ml
  text: എഴുന്നേൽക്കൂ; ബാലനെ എടുത്തുയർത്തി നിന്റെ കൈകൊണ്ട് അവനെ മുറുകെ താങ്ങിപ്പിടിക്കൂ[a]. കാരണം ഞാൻ അവനെ ഒരു വലിയ ജനതയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിന്റെ കൈ അവനിൽ ബലപ്പെടുത്തുക’ എന്നതിനടുത്തതാണ്; ഇവിടെ ഉറച്ചുപിടിച്ച് പിന്തുണയ്ക്കുക എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: എഴുന്നേൽക്കൂ
  rationale: ഹാഗാറിനോടുള്ള സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയാണ്. മലയാളത്തിൽ ലിംഗഭേദം പ്രകടമാകാത്ത സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: שְׂאִ֣י
  choice: എടുത്തുയർത്തി
  rationale: നשׂא എന്ന ക്രിയ ഇവിടെ ബാലനെ കിടന്നിടത്തുനിന്ന് ഉയർത്തുക എന്ന ദൃശ്യഭാവം നൽകുന്നു; തുടർച്ചയായി ചുമക്കുക എന്ന അർഥത്തിലേക്ക് അതിരുകടക്കാതെ അത് നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ബാലനെ
  rationale: נַעַר ബാലനെയോ യുവാവിനെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിന് യോജിക്കുന്നതും പ്രായം അനാവശ്യമായി കൃത്യപ്പെടുത്താത്തതുമായ പദമാണ് ‘ബാലൻ’.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: നിന്റെ കൈകൊണ്ട് അവനെ മുറുകെ താങ്ങിപ്പിടിക്കൂ
  rationale: החזיק എന്ന ക്രിയയും കൈയെക്കുറിച്ചുള്ള പ്രയോഗവും ഉറച്ച പിടിയും പിന്തുണയും സൂചിപ്പിക്കുന്നു. ‘താങ്ങിപ്പിടിക്കുക’ സന്ദർഭത്തിലെ സഹായാർഥം വ്യക്തമാക്കുകയും ‘മുറുകെ’ ക്രിയയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള ആജ്ഞകൾക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി നേരിട്ടും സ്വാഭാവികമായും പ്രവർത്തിക്കുന്നു.
- source_word: לְגוֹי גָּדוֹל
  choice: ഒരു വലിയ ജനതയാക്കും
  rationale: לְ എന്ന മുൻപ്രത്യയവും שׂים എന്ന ക്രിയയും ചേർന്ന് ഫലമോ ആക്കിത്തീർക്കലോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשִׂימֶנּוּ
  choice: ഞാൻ അവനെ ... ആക്കും
  rationale: שׂים എന്ന ക്രിയയുടെ ‘ആക്കുക’ എന്ന സന്ദർഭാർഥം ദേശീയ ഭാവിയെക്കുറിച്ചുള്ള വാഗ്ദാനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യിശ്മായേലിന്റെ ഭാവിയെക്കുറിച്ചുള്ള ദൈവിക വാഗ്ദാനം
  choice: ദൈവം ബാലനെ ഒരു വലിയ ജനതയാക്കുമെന്ന നേരിട്ടുള്ള വാഗ്ദാനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: വാഗ്ദാനത്തിന്റെ ഉടമ്പടിപരമായ സ്വഭാവം വിശദീകരിക്കുന്നതോ പരിമിതപ്പെടുത്തുന്നതോ ആയ വ്യാഖ്യാനം ചേർക്കുക.
  rationale: എബ്രായപാഠം ബാലന്റെ ദേശീയ ഭാവിയെക്കുറിച്ചുള്ള വാഗ്ദാനം വ്യക്തമായി പ്രസ്താവിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ വർഗ്ഗീകരണം വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ വിവർത്തനം അത് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ദൃശ്യഭാവം നിലനിർത്താൻ ‘എടുത്തുയർത്തി’ എന്നും, ഉറച്ച പിന്തുണയുടെ ആശയം വ്യക്തമാക്കാൻ ‘മുറുകെ താങ്ങിപ്പിടിക്കൂ’ എന്നും തിരഞ്ഞെടുത്തു.
