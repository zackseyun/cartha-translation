  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: ml
  text: യഹോവ താൻ പറഞ്ഞതുപോലെ സാറയെ സന്ദർശിച്ചു[a]; യഹോവ താൻ അരുളിച്ചെയ്തതുപോലെ സാറയ്ക്കുവേണ്ടി ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാറയെ കടാക്ഷിച്ചു.’ ഇവിടെ എബ്രായക്രിയ ദൈവം ഒരാളിലേക്കു ശ്രദ്ധതിരിച്ച് അയാൾക്കുവേണ്ടി പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: פָּקַד
  choice: ഓർത്തു പ്രവർത്തിച്ചു
  rationale: ഇവിടെ ക്രിയ വെറും സന്ദർശനമല്ല, സാറയിലേക്കു ദൈവം അനുകൂലമായി ശ്രദ്ധതിരിച്ച് അവൾക്കുവേണ്ടി ഫലപ്രദമായി പ്രവർത്തിച്ചതാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രവർത്തനസൂചന നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר אָמָר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: മുമ്പുണ്ടായ ദൈവവചനത്തിലേക്കുള്ള സൂചനയും ദൈവത്തിന്റെ വാക്കെന്ന ആദരപൂർവമായ ഭാവവും നൽകുന്നു.
- source_word: וַיַּעַשׂ ... לְשָׂרָה
  choice: സാറയ്ക്കുവേണ്ടി ചെയ്തു
  rationale: മൂലത്തിലെ പൊതുവായ ‘ചെയ്തു’ എന്ന ക്രിയയും לְ എന്നതിന്റെ ഗുണഭോക്തൃഭാവവും അനാവശ്യമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: പറഞ്ഞതുപോലെ
  rationale: ആദ്യ ഉപവാക്യത്തിലെ אָמַר-ൽനിന്നുള്ള ശൈലീപരമായ വ്യത്യാസം മലയാളത്തിൽ ഭാഗികമായി നിലനിർത്തുകയും വാഗ്ദാനനിവൃത്തിയുടെ പശ്ചാത്തലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാള വായനക്കാർക്കു സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: פָּקַד എന്ന ക്രിയയിലെ ദൈവിക ഇടപെടലിന്റെ സ്വഭാവം
  choice: ഓർത്തു പ്രവർത്തിച്ചു
  alternative: സന്ദർശിച്ചു; ശ്രദ്ധിച്ചു
  rationale: ദൈവം മുമ്പ് മറന്നിരുന്നുവെന്നോ വെറും സ്ഥലപരമായ സന്ദർശനം നടത്തിയെന്നോ നിർബന്ധിക്കാതെ, സാറയിലേക്കുള്ള അനുകൂല ശ്രദ്ധയും അവൾക്കുവേണ്ടിയുള്ള പ്രവർത്തനവും ഒരുമിച്ച് അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ സമാന്തരഘടനയും ആവർത്തിച്ച ദൈവനാമവും നിലനിർത്തി; വാക്യാരംഭത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകപദം ചേർത്തിട്ടില്ല.
