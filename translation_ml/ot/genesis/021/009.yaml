source:
  edition: WLC
  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: ml
  text: ഈജിപ്തുകാരിയായ ഹാഗാർ അബ്രാഹാമിന് പ്രസവിച്ച മകൻ ചിക്കുന്നത്[a] സാറാ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പരിഹസിക്കുന്നത്” അഥവാ “കളിക്കുന്നത്.” ഈ എബ്രായ participle-ന് “ചിരിക്കുക,” “കളിക്കുക,” അല്ലെങ്കിൽ “പരിഹസിക്കുക” എന്നിങ്ങനെ അർഥമാകാം; സന്ദർഭം ശത്രുതാപരമായ ഒരു സൂക്ഷ്മാർഥം സൂചിപ്പിച്ചേക്കാം.
    reason: מְצַחֵק എന്ന പദത്തിന്റെ നിഷ്പക്ഷമായ അടിസ്ഥാന അർഥവും സന്ദർഭത്തിൽ സാധ്യമായ പ്രതികൂല അർഥവും നിലനിർത്താൻ.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: സാറാ കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ ലളിതമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ ‘സാറാ കണ്ടു’ എന്നു നൽകി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത വിരുദ്ധഭാവം ചേർത്തിട്ടില്ല.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: ഈജിപ്തുകാരിയായ ഹാഗാർ ... പ്രസവിച്ച മകൻ
  rationale: ഹാഗാറിനെ അവളുടെ ഈജിപ്തീയ തിരിച്ചറിയലോടുകൂടെ അവതരിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകി.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: ഹാഗാർ അബ്രാഹാമിനു പ്രസവിച്ച
  rationale: ബന്ധവാക്യത്തിലെ സ്ത്രീലിംഗ കർത്താവ് ഹാഗാർ ആണെന്നത് മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു. לְ ഇവിടെ ‘അബ്രാഹാമിനു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מְצַחֵק
  choice: ചിരിക്കുന്നതു
  rationale: צחק എന്ന ക്രിയയുടെ participle രൂപം ചിരിക്കുക, കളിക്കുക, പരിഹസിക്കുക എന്നീ സൂക്ഷ്മാർഥങ്ങൾക്കു വഴിയൊരുക്കുന്നു. കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ പ്രതികൂല അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കാതെ വിശാലമായ ‘ചിരിക്കുന്നതു’ തിരഞ്ഞെടുത്തു; സന്ദർഭസാധ്യമായ മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: മְצַחֵק എന്ന പദത്തിൽ ഇശ്മായേലിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ നിഷ്പക്ഷമായി ‘ചിരിക്കുന്നതു’
  alternative: ‘പരിഹസിക്കുന്നതു’ അല്ലെങ്കിൽ ‘കളിക്കുന്നതു’
  rationale: ഈ വാക്യത്തിലെ എബ്രായ participle-ന് വ്യക്തമായ കർമമില്ല; അതിനാൽ പ്രവൃത്തി ശത്രുതാപരമായിരുന്നുവെന്ന് പദം മാത്രം നിർണ്ണയിക്കുന്നില്ല. വിശാലസന്ദർഭവും പിൽക്കാല വ്യാഖ്യാനവും ‘പരിഹസിക്കുക’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കാമെങ്കിലും, യഥാർഥമായ വ്യാഖ്യാനസന്ദിഗ്ധത മുഖ്യവാചകത്തിൽ നിലനിർത്തി മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഈജിപ്തുകാരിയായ’ എന്ന പ്രയോഗം ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തമാണ്; ബന്ധവാക്യം ഹാഗാറാണ് പ്രസവിച്ചതെന്ന് ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കുന്നു.
