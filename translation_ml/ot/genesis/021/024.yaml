lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ ചേർക്കാതെ ‘പറഞ്ഞു’ എന്നു നൽകുന്നത് മതിയാകുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിനെ വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്നു; മലയാളത്തിൽ ‘ഞാൻ’ എന്നു നൽകുന്നത് സ്വാഭാവികവും ആവശ്യമായ ഊന്നൽ നിലനിർത്തുന്നതുമാണ്.
- source_word: אִשָּׁבֵעַ
  choice: സത്യം ചെയ്യാം
  rationale: שבע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘ശപഥം ചെയ്യുക/സത്യം ചെയ്യുക’ എന്നാണ്. അബീമേലെക്കിന്റെ അഭ്യർഥനയ്ക്കുള്ള സമ്മതപ്രതികരണമായതിനാൽ ‘സത്യം ചെയ്യാം’ എന്നത് ഇവിടെ ഭാവി/സന്നദ്ധതാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
