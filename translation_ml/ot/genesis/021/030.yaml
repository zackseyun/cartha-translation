  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഈ ഏഴ് പെൺകുഞ്ഞാടുകളെ നീ എന്റെ കൈയിൽനിന്ന് ഏറ്റുവാങ്ങണം; ഞാൻ ഈ കിണർ കുഴിച്ചതാണെന്നതിന് അത് എനിക്കുവേണ്ടി സാക്ഷിയായിരിക്കേണ്ടതിനാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവ എനിക്കുവേണ്ടി സാക്ഷിയായിരിക്കേണ്ടതിനാണ്.” ഹീബ്രു ക്രിയ ഏകവചനത്തിലാണ്; എന്നാൽ അടുത്തുള്ള നാമപദം ഏഴ് പെൺകുഞ്ഞാടുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ഏകവചനം അവയെ ഒരു കൂട്ടമായി കാണുന്നതോ അവയെ ഏറ്റുവാങ്ങുന്ന പ്രവൃത്തിയെയോ ക്രമീകരണത്തെയോ സാക്ഷിയായി സൂചിപ്പിക്കുന്നതോ ആകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സമയക്രമത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: ഈ ഏഴ് പെൺകുഞ്ഞാടുകളെ നീ ... ഏറ്റുവാങ്ങണം
  rationale: כְּבָשֹׂת പെൺലിംഗത്തിലുള്ള ആട്ടിൻകുഞ്ഞുങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. തൊട്ടുമുമ്പ് വേർതിരിച്ചുവെച്ചവയെ ചൂണ്ടിക്കാണിക്കുന്ന സാഹചര്യത്തിൽ ‘ഈ’ സ്വാഭാവികമാണ്. תִּקַּח-ന്റെ നിർദേശാത്മക ശക്തി ‘ഏറ്റുവാങ്ങണം’ വ്യക്തമാക്കുന്നു.
- source_word: מִיָּדִי
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: ഔപചാരികമായ കൈമാറ്റത്തിന്റെ മൂർത്തമായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു പ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്നു.
- source_word: בַּעֲבוּר תִּהְיֶה לִּי לְעֵדָה
  choice: അങ്ങനെ ... അത് എനിക്കുവേണ്ടി സാക്ഷിയായിരിക്കും
  rationale: בַּעֲבוּר ഇവിടെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു. ഏകവചന ക്രിയയായ תִּהְיֶה മാനിച്ച്, കുഞ്ഞാടുകളെ ഏറ്റുവാങ്ങുന്ന ക്രമീകരണത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന ‘അത്’ ഉപയോഗിച്ചു; മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: ഞാൻ ഈ കിണർ കുഴിച്ചതാണെന്നതിന്
  rationale: ഇവിടത്തെ כִּי സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘കുഴിച്ചതാണെന്നതിന്’ അബ്രാഹാമിന്റെ അവകാശവാദത്തിന്റെ തെളിവ് എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഏഴ് പെൺകുഞ്ഞാടുകളും ഏകവചന സാക്ഷ്യക്രിയയും തമ്മിലുള്ള വ്യാകരണബന്ധം
  choice: ‘അത് ... സാക്ഷിയായിരിക്കും’ എന്ന് നൽകി, ഏറ്റുവാങ്ങൽ/ക്രമീകരണം ഒന്നായി സാക്ഷ്യമാകുന്നു എന്ന സാധ്യത നിലനിർത്തി.
  alternative: ‘അവ ... സാക്ഷിയായിരിക്കും’ എന്ന് നൽകി കുഞ്ഞാടുകളെത്തന്നെ ബഹുവചന വിഷയമാക്കാം.
  rationale: ഹീബ്രുവിലെ תִּהְיֶה വ്യക്തമായി സ്ത്രീലിംഗ ഏകവചനമാണ്. എന്നാൽ അടുത്തുള്ള നാമപദം ഏഴ് പെൺകുഞ്ഞാടുകളെന്ന ബഹുവചനമായതിനാൽ, ഏകവചനം അവയെ ഒരു കൂട്ടമായോ മുഴുവൻ ഇടപാടിനെയോ സൂചിപ്പിക്കാം. പാഠത്തിൽ ഏകവചനം സംരക്ഷിക്കുകയും യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെൺകുഞ്ഞാടുകൾ’ ലിംഗവിശദാംശം കൃത്യമായി സൂക്ഷിക്കുന്നു; ‘ഏറ്റുവാങ്ങണം’ വാങ്ങൽവില എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കി ഔപചാരിക കൈമാറ്റം വ്യക്തമാക്കുന്നു. ഹീബ്രുവിലെ ഏകവചന-ബഹുവചന സംഘർഷം പാഠത്തിലും അടിക്കുറിപ്പിലും തുറന്നുവെച്ചിരിക്കുന്നു.
