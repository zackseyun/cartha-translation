  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: ml
  text: അപ്പോൾ ദൈവം അവളുടെ കണ്ണുകൾ തുറന്നു; അവൾ ഒരു വെള്ളക്കിണർ കണ്ടു. അവൾ ചെന്ന് തോൽക്കുടത്തിൽ[a] വെള്ളം നിറച്ച് ബാലനു കുടിക്കാൻ കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തോൽപാത്രത്തിൽ.’ എബ്രായപദം ദ്രാവകം കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന തോൽകൊണ്ടുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: തുറന്നു
  rationale: פקח എന്ന ക്രിയയുടെ ‘തുറക്കുക’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തുന്നു; ദൈവം അവളെ കാണാൻ പ്രാപ്തയാക്കി എന്ന ഫലം വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടെ വരുന്ന ഈ പദം വിവരണത്തിലെ ഏക ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֵינֶיהָ
  choice: അവളുടെ കണ്ണുകൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ നേരായതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַתֵּרֶא
  choice: അവൾ ... കണ്ടു
  rationale: ראה എന്ന സാധാരണ ദർശനക്രിയയും സംഭവക്രമവും ലളിതമായി പകരുന്നു.
- source_word: בְּאֵר מָיִם
  choice: ഒരു വെള്ളക്കിണർ
  rationale: ‘വെള്ളത്തിന്റെ കിണർ’ എന്ന ഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֵּלֶךְ
  choice: അവൾ ചെന്ന്
  rationale: തുടർച്ചയായ ആഖ്യാനചലനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַתְּמַלֵּא
  choice: നിറച്ച്
  rationale: מלא എന്ന ക്രിയയുടെ സാധാരണ അർഥം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: הַחֵמֶת
  choice: തോൽക്കുടത്തിൽ
  rationale: חֵמֶת ദ്രാവകം കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന തോൽകൊണ്ടുള്ള പാത്രമാണ്; ‘തോൽക്കുടം’ വസ്തുവിന്റെ സ്വഭാവവും ഉപയോഗവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: നിറച്ച ദ്രാവകത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וַתַּשְׁקְ
  choice: കുടിക്കാൻ കൊടുത്തു
  rationale: שׁקה-യുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന കാരകാർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַנַּעַר
  choice: ബാലന്
  rationale: സന്ദർഭത്തിൽ ഹാഗാറിന്റെ മകനായ യിശ്മായേലിനെ സൂചിപ്പിക്കുന്ന נַעַר എന്ന പദത്തിന് മാന്യവും പ്രായസൂചനയുള്ളതുമായ സാധാരണ മലയാളം.
theological_decisions:
- issue: ‘ദൈവം അവളുടെ കണ്ണുകൾ തുറന്നു’ എന്നത് നേരിട്ടുള്ള ദൈവിക പ്രവർത്തനമായി നിലനിർത്തണമോ, നിലവിലുണ്ടായിരുന്ന കിണർ അവൾ ശ്രദ്ധിച്ചതായി വ്യാഖ്യാനിക്കണമോ
  choice: ദൈവം അവളുടെ കണ്ണുകൾ തുറന്നു
  alternative: ദൈവം അവളെ കിണർ കാണാൻ പ്രാപ്തയാക്കി / കിണർ ശ്രദ്ധിക്കാൻ ഇടയാക്കി
  rationale: എബ്രായപാഠം കണ്ണുകൾ തുറന്ന പ്രവർത്തനം വ്യക്തമായി ദൈവത്തിനാണ് ചുമത്തുന്നത്. അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ ദൈവിക പ്രവർത്തനവും അർഥതീവ്രതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അർധവിരാമവും ക്രിയാവിന്യാസവും ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് consultation text-ലുള്ള അടിക്കുറിപ്പടയാളം ‘eyes’ എന്നതിന് ശേഷം നൽകിയിട്ടുണ്ടെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം חֵמֶת എന്ന തോൽപ്പാത്രത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ അടയാളം ‘തോൽക്കുടത്തിൽ’ എന്ന പദത്തോടു ചേർത്തു.
