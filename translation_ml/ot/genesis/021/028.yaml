source:
  edition: WLC
  text: וַ/יַּצֵּ֣ב אַבְרָהָ֗ם אֶת שֶׁ֛בַע כִּבְשֹׂ֥ת הַ/צֹּ֖אן לְ/בַדְּ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/028.yaml
  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: ml
  text: അബ്രാഹാം ആട്ടിൻകൂട്ടത്തിലെ ഏഴ് പെൺകുഞ്ഞാടുകളെ തനിച്ചുനിർത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആട്ടിൻകൂട്ടത്തിലെ ഏഴ് പെൺകുഞ്ഞാടുകളെ വേർതിരിച്ചുവെച്ചു.” ഹീബ്രു ക്രിയയ്ക്ക് അവയെ ഒരു പ്രത്യേക സ്ഥാനത്ത് നിർത്തുക എന്ന ആശയം സൂചിപ്പിക്കാം; ഉടമ്പടിയുടെ സാക്ഷ്യത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ആ വേർതിരിക്കൽ പ്രാധാന്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: നിർത്തി
  rationale: നצב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ എന്തിനെയെങ്കിലും ഒരു പ്രത്യേക സ്ഥാനത്ത് നിർത്തുകയോ വെക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ വേർതിരിക്കൽ പ്രകടമാക്കിക്കൊണ്ട് പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതിരിക്കാൻ ‘നിർത്തി’ ഉപയോഗിച്ചു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഹീബ്രു നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ സ്വതന്ത്രമായ പദസമാനതയില്ല; വാക്യഘടനയിലൂടെ അർഥം പ്രകടമാകുന്നു.
- source_word: שֶׁבַע
  choice: ഏഴ്
  rationale: തുടർന്നുവരുന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന വ്യക്തമായ സംഖ്യാവാചകം.
- source_word: כִּבְשֹׂת
  choice: പെൺകുഞ്ഞാടുകൾ
  rationale: ഈ പദം പ്രത്യേകിച്ച് പെൺലിംഗത്തിലുള്ള ഇളം ആടുകളെ സൂചിപ്പിക്കുന്നു; ‘പെൺകുഞ്ഞാടുകൾ’ ലിംഗവും പ്രായസൂചനയും നിലനിർത്തുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിലെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്. ഇവിടെ പെൺകുഞ്ഞാടുകളോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിനായി ‘ആട്ടിൻകൂട്ടത്തിലെ’ എന്നു നൽകി.
- source_word: לְבַדְּהֶן
  choice: തനിച്ചു
  rationale: ഈ ഏഴ് പെൺകുഞ്ഞാടുകളെ ശേഷിച്ച കൂട്ടത്തിൽനിന്ന് വേർതിരിച്ചുവെച്ചതായി സൂചിപ്പിക്കുന്നു; ‘തനിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവർത്തനം. ‘പെൺകുഞ്ഞാടുകൾ’ മൂലഭാഷയിലെ ലിംഗ-പ്രായസൂചന നിലനിർത്തുന്നു; ‘തനിച്ചുനിർത്തി’ എന്ന പ്രയോഗം ഭൗതികമായി വേർതിരിച്ചുവെച്ച പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
