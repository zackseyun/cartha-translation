source:
  edition: WLC
  text: וַ/יְהִ֧י אֱלֹהִ֛ים אֶת הַ/נַּ֖עַר וַ/יִּגְדָּ֑ל וַ/יֵּ֨שֶׁב֙ בַּ/מִּדְבָּ֔ר וַ/יְהִ֖י רֹבֶ֥ה קַשָּֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: ml
  text: ദൈവം ബാലനോടൊപ്പമുണ്ടായിരുന്നു; അവൻ വളർന്നു. അവൻ മരുഭൂമിയിൽ താമസിച്ചു; വില്ലാളിയായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വില്ലുകൊണ്ട് അമ്പെയ്യുന്നവനായിത്തീർന്നു.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ വില്ലുമായി എയ്യുന്ന ഒരാളെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: ദൈവം ബാലനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: היה את എന്ന പ്രയോഗം സാന്നിധ്യത്തെയോ പിന്തുണയെയോ സൂചിപ്പിക്കുന്നു. ദൈവിക പരിപാലനം വ്യക്തമാക്കിക്കൊണ്ട് അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം വികസിപ്പിക്കാതെ ഈ പരിഭാഷ മൂലപാഠത്തിന്റെ ലാളിത്യവും നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: נַעַר എന്നത് ബാലനെയോ യുവാവിനെയോ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘ബാലൻ’ സ്വാഭാവികവും ആധുനിക വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: וַיִּגְדָּל
  choice: അവൻ വളർന്നു
  rationale: גדל ഇവിടെ ശാരീരിക വളർച്ചയെയും പക്വതയിലേക്കുള്ള പുരോഗതിയെയും സൂചിപ്പിക്കുന്നു. ‘വളർന്നു’ എന്നത് സംക്ഷിപ്തവും മൂലപാഠത്തോടടുത്തതുമാണ്.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: അവൻ മരുഭൂമിയിൽ പാർത്തു
  rationale: ישב ഇവിടെ തുടർന്നുള്ള വാസത്തെ സൂചിപ്പിക്കുന്നു; מִדְבָּר ജനവാസം കുറഞ്ഞ വനാന്തരമോ മരുഭൂമിയോ ആകാം. മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ ‘മരുഭൂമിയിൽ പാർത്തു’ എന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: വില്ലാളിയായിത്തീർന്നു
  rationale: ഈ ദുഷ്കരമായ സംയുക്തപ്രയോഗം വില്ലുകൊണ്ട് എയ്യുന്ന ഒരാളായിത്തീർന്നു എന്ന അർഥം നൽകുന്നു. ‘വില്ലാളി’ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ തുല്യപദമാണ്.
theological_decisions:
- issue: യിശ്മായേലിനോടുള്ള ദൈവസാന്നിധ്യത്തിന്റെ പ്രസ്താവന
  choice: ദൈവം ബാലനോടുകൂടെ ഉണ്ടായിരുന്നു
  alternative: ദൈവം ബാലനെ സഹായിച്ചു / ദൈവം ബാലന്റെ പക്ഷത്തായിരുന്നു
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സാന്നിധ്യവും പിന്തുണയും ഉറപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ പ്രത്യാഘാതങ്ങൾ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രസ്താവനയുടെ ശക്തിയും തുറന്ന നിലയും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പാർത്തു’ എന്നത് അല്പം ഔപചാരികമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് പരിചിതവും തിരുവെഴുത്തിന്റെ ആഖ്യാനശൈലിക്ക് യോജിച്ചതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
