  to: 'അബീമേലെക്ക് അബ്രാഹാമിനോടു ചോദിച്ചു: “നീ വേറിട്ടു നിർത്തിയിരിക്കുന്ന ഈ ഏഴ് പെൺകുഞ്ഞാടുകൾ എന്താണ്?”[a]'
