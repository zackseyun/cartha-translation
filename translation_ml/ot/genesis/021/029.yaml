reference: Genesis 21:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה הֵ֗נָּה שֶׁ֤בַע כְּבָשֹׂת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר הִצַּ֖בְתָּ לְ/בַדָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: ml
  text: 'അബീമേലെക്ക് അബ്രാഹാമിനോടു ചോദിച്ചു: “നീ വേറിട്ടു നിർത്തിയിരിക്കുന്ന ഈ ഏഴ് പെൺകുഞ്ഞാടുകൾ എന്താണ്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ പ്രത്യേകം വെച്ചിരിക്കുന്ന ഈ ഏഴ് പെൺകുഞ്ഞാടുകൾ എന്താണ്?” എബ്രായ ക്രിയയ്ക്ക് “നിർത്തുക,” “വയ്ക്കുക” എന്നീ അർഥങ്ങളുണ്ട്; സന്ദർഭത്തിൽ ഇവയെ മറ്റുള്ളവയിൽനിന്ന് പ്രത്യേകം വെച്ചതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു
  rationale: പറഞ്ഞു എന്ന അടിസ്ഥാന അർഥം നിലനിൽക്കുന്നുവെങ്കിലും, നേരിട്ട് ചോദ്യം തുടരുമെന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; വാവ് തുടർച്ചയായ ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: אֶל־אַבְרָהָם
  choice: അബ്രാഹാമിനോട്
  rationale: സംഭാഷണം അഭിമുഖീകരിക്കുന്ന ആളെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന് സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מָה הֵנָּה
  choice: എന്തിനാണ്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇവ എന്താണ്?’ എന്നാണെങ്കിലും, ഇവിടെ അബീമേലെക്ക് കുഞ്ഞാടുകളെ തിരിച്ചറിയാനല്ല, അവയെ വേറിട്ടു നിർത്തിയതിന്റെ അർഥമോ ഉദ്ദേശ്യമോ ചോദിക്കുകയാണ്. അതിനാൽ സന്ദർഭത്തിലെ ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്തിനാണ്?’ എന്ന് നൽകി; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത സൂചിപ്പിച്ചു.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: ഈ ഏഴ് പെൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשֹׂת സ്ത്രീലിംഗ ബഹുവചനമായതിനാൽ കുഞ്ഞാടുകളുടെ പെൺലിംഗസവിശേഷത വ്യക്തമാക്കി.
- source_word: הִצַּבְתָּ
  choice: നീ ... നിർത്തിയിരിക്കുന്ന
  rationale: נצב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘നിർത്തുക/വയ്ക്കുക’ എന്ന അർഥം നൽകുന്നു. പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבַדָּנָה
  choice: വേറിട്ടു
  rationale: മറ്റുള്ളവയിൽനിന്നുള്ള വേർതിരിവാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘വേറിട്ടു’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും, מָה എന്ന പദത്തിന്റെ അക്ഷരാർഥവും הִצַּבְתָּ എന്ന ക്രിയയുടെ വിശാല അർഥപരിധിയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
