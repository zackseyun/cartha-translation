  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാഹാം അതിരാവിലെ എഴുന്നേറ്റ് അപ്പവും വെള്ളം നിറച്ച ഒരു തുകൽക്കുടവും എടുത്ത് ഹാഗാറിനു കൊടുത്തു; അവ അവളുടെ തോളിൽ വെച്ച്, ബാലനെയും അവളോടുകൂടെ പറഞ്ഞയച്ചു.[a] അവൾ പോയി ബേർശേബാ മരുഭൂമിയിൽ അലഞ്ഞുനടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥമായി: “അവളുടെ തോളിൽ [അത്/അവ] വെച്ച്, ബാലനെയും.” വാക്യഘടന സങ്കുചിതമാണ്; “അവളുടെ തോളിൽ അവ വെക്കുകയും ബാലനെ [അവൾക്കു കൊടുക്കുകയും] ചെയ്തു” എന്നും ഗ്രഹിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന അർഥവും പ്രഭാതകാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ചേർത്തുപറയുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: സന്ദർഭത്തിൽ കൂടുതൽ പൊതുവായ ‘ഭക്ഷണം’ എന്നതിലേക്കു വിപുലീകരിക്കാതെ എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: חֵמַת מַיִם
  choice: ഒരു തുകൽക്കുടം വെള്ളം
  rationale: ദ്രാവകം സൂക്ഷിക്കുന്ന മൃഗത്തോൽപാത്രമാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക കുപ്പിയെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: അവളുടെ തോളിൽ അവ വെച്ചശേഷം
  rationale: അപ്പവും വെള്ളമുള്ള തുകൽക്കുടവും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം ചേർത്ത് പ്രവർത്തിയുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת הַיֶּלֶד
  choice: ബാലനെയും അവളോടൊപ്പം അയച്ചു
  rationale: സങ്കുചിതമായ എബ്രായവാക്യഘടന ബാലനെയും തോളിൽ വെച്ചുവെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാതിരിക്കാനായി, അവൻ ഹാഗാറിനൊപ്പം അയക്കപ്പെട്ടു എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; മൂലത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וַיְשַׁלְּחֶהָ
  choice: അവൻ അവളെ പറഞ്ഞയച്ചു
  rationale: שלח എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ‘അയച്ചുകളയുക/പറഞ്ഞയക്കുക’ എന്ന ഗൗരവമുള്ള അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַתֵּתַע
  choice: അലഞ്ഞുനടന്നു
  rationale: വഴിതെറ്റിയെന്നോ ഉദ്ദേശ്യമില്ലാതെ സഞ്ചരിച്ചെന്നോ അന്തിമമായി നിർണയിക്കാതെ ‘അലയുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: ബേർശേബാ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വനാന്തരപ്രദേശത്തെയും സൂചിപ്പിക്കാം; മലയാള ബൈബിൾശൈലിയിൽ പരിചിതവും ഇവിടെ സ്വാഭാവികവുമായ ‘മരുഭൂമി’ സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ബാലൻ’ എന്ന പദവും ‘അവളുടെ തോളിൽ വെച്ചു’ എന്ന വാക്യഭാഗവും തമ്മിലുള്ള വാക്യഘടനാപരമായ ബന്ധം
  choice: സാധനങ്ങൾ ഹാഗാറിന്റെ തോളിൽ വെച്ചു; ബാലനെ അവളോടൊപ്പം അയച്ചു.
  alternative: സാധനങ്ങളും ബാലനെയും ഹാഗാറിന്റെ തോളിൽ വെച്ചു; അല്ലെങ്കിൽ സാധനങ്ങൾക്കൊപ്പം ബാലനെയും അവൾക്കു ഏല്പിച്ചു.
  rationale: എബ്രായവാക്യം സങ്കുചിതവും വ്യാകരണപരമായി ചർച്ചചെയ്യപ്പെട്ടതുമാണ്. വിശാലസന്ദർഭത്തിലെ ബാലന്റെ പ്രായം കണക്കിലെടുക്കുമ്പോൾ അവനെ ശാരീരികമായി തോളിൽ വെച്ചുവെന്ന ഭാഷാന്തരം വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിച്ചേക്കാം. അതിനാൽ പ്രധാനവാചകം ഏറ്റവും സ്വാഭാവികമായ ബന്ധം നൽകുകയും യഥാർഥ വാക്യഘടനാ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമം ‘ബേർശേബാ’ എന്നു ലിപ്യന്തരിച്ചു. വാക്യഘടനയിലെ യഥാർഥ അനിശ്ചിതത്വം പ്രധാനവാചകത്തെ അസ്വാഭാവികമാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
