source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: ml
  text: 'ആ കാലത്ത് അബീമേലെക്കും അവന്റെ സൈന്യാധിപനായ ഫീക്കോലും അബ്രാഹാമിനോടു പറഞ്ഞു: “നീ ചെയ്യുന്ന എല്ലാറ്റിലും ദൈവം[a] നിന്നോടുകൂടെയുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവം” എന്നതിന് പകരം, ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവാണെങ്കിലും, “ഒരു ദൈവം” എന്നും മനസ്സിലാക്കാം. എബ്രായത്തിലെ אֱלֹהִים എന്ന പദം ചില സന്ദർഭങ്ങളിൽ വ്യത്യസ്തമായി ഗ്രഹിക്കാവുന്നതാണ്; എന്നാൽ ഇവിടെ അബ്രാഹാമിനെ അനുഗ്രഹിക്കുന്ന ദൈവത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: ആ കാലത്ത്
  rationale: പുതിയ രംഗം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനസൂത്രത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യമായ ഭാരമുണ്ടാക്കും.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וּפִיכֹל
  choice: ഫീക്കോലും
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; സംയോജകപ്രത്യയം കൂട്ടുകർത്താവിനെ വ്യക്തമാക്കുന്നു.
- source_word: שַׂר צְבָאוֹ
  choice: അവന്റെ സൈന്യാധിപനായ
  rationale: שַׂר എന്നത് ഇവിടെ സൈനിക അധികാരിയെയും צָבָא സൈന്യത്തെയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: അബ്രാഹാമിനോടു പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയയ്ക്ക് പിന്നാലെ സംയുക്തകർത്താവുണ്ടെങ്കിലും അർത്ഥം ഇരുവരെയും ഉൾക്കൊള്ളുന്നു. לֵאמֹר എന്ന വാക്യാരംഭസൂത്രം മലയാളത്തിൽ വേർതിരിച്ചു പരിഭാഷപ്പെടുത്താതെ നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദ്ധ്യതയുള്ള പദമാണെങ്കിലും, അബ്രാഹാമിനൊപ്പമുള്ള ദൈവിക അനുഗ്രഹത്തെ തിരിച്ചറിയുന്ന ഈ സന്ദർഭത്തിൽ ഏകവചനമായ ‘ദൈവം’ ഏറ്റവും സ്വാഭാവികം.
- source_word: עִמְּךָ
  choice: നിന്നോടുകൂടെയുണ്ട്
  rationale: സാന്നിധ്യവും പിന്തുണയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും പരമ്പരാഗത ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: നീ ചെയ്യുന്ന എല്ലാറ്റിലും
  rationale: സമഗ്രമായ വ്യാപ്തിയും വർത്തമാനകാലത്തിലെ പൊതുവായ പ്രവർത്തനവും കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബീമേലെക്കിന്റെ വാക്കുകളിലെ אֱלֹהִים എന്ന പദത്തിന്റെ സൂചന
  choice: ദൈവം
  alternative: ഒരു ദേവൻ; ദേവന്മാർ
  rationale: പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ബഹുവചനമോ അനിശ്ചിതമായ അർത്ഥമോ സാധ്യമാണെങ്കിലും, ഇവിടെ അബ്രാഹാമിനെ അനുഗ്രഹിക്കുകയും അവനോടുകൂടെ ഇരിക്കുകയും ചെയ്യുന്ന ദൈവത്തെയാണ് ആഖ്യാനസന്ദർഭം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. വ്യത്യസ്ത സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തനപരമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന സൂത്രം ഒഴിവാക്കി നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിച്ചു. പ്രധാന പാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
