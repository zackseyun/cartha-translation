  source_fidelity: ഹീബ്രു വാക്യത്തിലെ കൂട്ടിച്ചേർക്കൽ (וְגַם), ‘അടിമസ്ത്രീയുടെ മകൻ,’ അവനെ ഒരു ജനതയാക്കുമെന്ന ഫലാർഥം, കാരണസൂചകമായ כִּי, അബ്രാഹാമുമായുള്ള വംശബന്ധം എന്നിവ പരിഭാഷ കൃത്യമായി നിലനിർത്തുന്നു. ‘അടിമസ്ത്രീയുടെ മകനെയും’ എന്നത് എബ്രായത്തിലെ ‘also the son of the slave woman’ എന്ന ഊന്നലും കൂട്ടിച്ചേർക്കലും സ്വാഭാവികമായി നൽകുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘ഒരു ജനതയാക്കും’യും ‘നിന്റെ സന്തതിയാണ്’യും ഈ ഔപചാരിക-വിവരണാത്മക സന്ദർഭത്തിന് യോജിച്ച രജിസ്റ്ററാണ്.
  terminology: אָמָהയ്ക്ക് ‘അടിമസ്ത്രീ’ എന്ന തിരഞ്ഞെടുപ്പ് ഹാഗാറിന്റെ സാമൂഹികസ്ഥാനത്തെ മയപ്പെടുത്താതെ വ്യക്തമായി അറിയിക്കുന്നു. זַרְעֲךָയ്ക്ക് ‘നിന്റെ സന്തതി’ യോജിച്ചതാണ്; ഈ സന്ദർഭത്തിലെ ഏകവചന വ്യക്തിയെ ഉൾക്കൊള്ളുന്ന വംശബന്ധം അതു സംരക്ഷിക്കുന്നു.
