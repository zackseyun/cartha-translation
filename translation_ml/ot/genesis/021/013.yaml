id: GEN.21.13
reference: Genesis 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: ml
  text: അടിമസ്ത്രീയുടെ മകനെയും ഞാൻ ഒരു ജനതയാക്കും[a]; കാരണം അവൻ നിന്റെ സന്തതിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അടിമസ്ത്രീയുടെ മകനെ ഒരു ജനതയായി തീർക്കും.”
    reason: ഫലത്തെ സൂചിപ്പിക്കുന്ന לְגוֹי אֲשִׂימֶנּוּ എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷാവികല്പം.
lexical_decisions:
- source_word: וְגַם
  choice: …യെയും ഞാൻ
  rationale: വാക്യത്തിന്റെ തുടർച്ചയും കൂട്ടിച്ചേർക്കൽഭാവവും മലയാളത്തിലെ ‘-യെയും’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת בֶּן הָאָמָה
  choice: അടിമസ്ത്രീയുടെ മകനെ
  rationale: בֶּן ‘മകൻ’ എന്നും אָמָה ബന്ധിത സാമൂഹിക നിലയിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നതുമായതിനാൽ, സാമൂഹിക യാഥാർഥ്യം മയപ്പെടുത്താതെ ‘അടിമസ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְגוֹי
  choice: ഒരു ജനതയാക്കും
  rationale: שׂים എന്ന ക്രിയയോടുകൂടിയ לְ ഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു ജനതയാക്കും’ എന്നത് ആ ഫലഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשִׂימֶנּוּ
  choice: ഞാൻ … ആക്കും
  rationale: ഈ സന്ദർഭത്തിൽ שׂים എന്നത് ഒരാളെ ഒരു ജനതയായി രൂപപ്പെടുത്തുക/ആക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: ദൈവത്തിന്റെ വാഗ്ദാനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന വ്യക്തമായ കാരണസൂചകമാണ്.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഇവിടെ അബ്രാഹാമിൽനിന്നുള്ള വംശബന്ധത്തെ ഏകവചന പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ അർഥവ്യാപ്തിയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: הוּא
  choice: അവൻ … ആണ്
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ സർവനാമം നിലനിർത്തി; അധിക ഊന്നൽ ചേർക്കാതെ സ്വാഭാവിക മലയാള വാക്യഘടന ഉപയോഗിച്ചു.
theological_decisions:
- issue: אָמָה സൂചിപ്പിക്കുന്ന സാമൂഹിക നില
  choice: അടിമസ്ത്രീ
  alternative: ദാസി / പരിചാരിക
  rationale: ഹാഗാറിന്റെ ബന്ധിത സാമൂഹിക നില കഥാസന്ദർഭത്തിൽ പ്രസക്തമാണ്; ‘പരിചാരിക’ അതിനെ അനാവശ്യമായി മയപ്പെടുത്തും. ‘ദാസി’ സാധ്യമായെങ്കിലും ആധുനിക സാധാരണ വായനക്കാർക്ക് ‘അടിമസ്ത്രീ’ കൂടുതൽ സുതാര്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ബന്ധിത സാമൂഹിക നില വ്യക്തമാക്കാൻ ‘അടിമസ്ത്രീ’ ഉപയോഗിച്ചു; ദൈവിക വാഗ്ദാനത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘ജനത’, ‘സന്തതി’ എന്നീ പദങ്ങൾ തിരഞ്ഞെടുത്തു.
