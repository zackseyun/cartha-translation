id: GEN.21.32
reference: Genesis 21:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרְת֥וּ בְרִ֖ית בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יָּ֣קָם אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ וַ/יָּשֻׁ֖בוּ אֶל אֶ֥רֶץ פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: ml
  text: അങ്ങനെ അവർ ബേർ-ശേബയിൽവെച്ച് ഒരു ഉടമ്പടി ചെയ്തു.[a] അബീമേലെക്കും അവന്റെ സൈന്യാധിപനായ ഫീക്കോലും എഴുന്നേറ്റ് ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരു ഉടമ്പടി മുറിച്ചു”; ഉടമ്പടി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: അവർ ഒരു ഉടമ്പടി ചെയ്തു
  rationale: എബ്രായത്തിലെ പദാനുപദ പ്രയോഗം ‘ഉടമ്പടി മുറിച്ചു’ എന്നാണെങ്കിലും, അതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്തു’ എന്നു വ്യക്തമാക്കുന്നു; മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בִּבְאֵר שָׁבַע
  choice: ബേർ-ശേബയിൽവെച്ച്
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗം സന്ദർഭത്തിൽ ‘-യിൽവെച്ച്’ എന്നു നൽകിയാൽ ഉടമ്പടി നടന്ന സ്ഥലമെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാകുന്നു; സംയുക്ത സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എഴുന്നേൽക്കുക’ നിലനിർത്തുകയും തുടർന്നുള്ള മടങ്ങിപ്പോക്കിലേക്കുള്ള ആഖ്യാനചലനം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וּפִיכֹל
  choice: അബീമേലെക്കും ... ഫീക്കോലും
  rationale: എബ്രായത്തിലെ ലളിതമായ ‘ഉം/യും’ ബന്ധം മലയാളത്തിൽ ഇരട്ട ‘-ഉം’ ഘടനയിലൂടെ നിലനിർത്തുന്നു; തുടർന്നുള്ള ബഹുവചനക്രിയയുടെ കർത്താക്കൾ വ്യക്തമാണ്.
- source_word: שַׂר צְבָאוֹ
  choice: അവന്റെ സൈന്യാധിപനായ
  rationale: שַׂר എന്നത് നേതാവിനെയോ അധിപനെയോ, צָבָא സൈന്യത്തെയോ സൈനികശക്തിയെയോ സൂചിപ്പിക്കുന്നു; ‘സൈന്യാധിപൻ’ സംക്ഷിപ്തവും മാന്യവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וַיָּשֻׁבוּ
  choice: മടങ്ങിപ്പോയി
  rationale: שׁוּב ഇവിടെ തിരികെ പോകുക എന്നർഥത്തിലാണ്; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള ആഖ്യാനരൂപമാണ് ‘മടങ്ങിപ്പോയി’.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശത്തേക്കു
  rationale: ‘ഫെലിസ്ത്യരുടെ ദേശത്തേക്ക്’ എന്ന എബ്രായ ജനവിഭാഗ-ഭൂമിശാസ്ത്ര ഘടന ഔപചാരികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. എബ്രായ ആഖ്യാനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തകർത്തൃഘടനയും ക്രിയാബന്ധവും ഉപയോഗിച്ചു.
