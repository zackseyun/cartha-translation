id: GEN.21.23
reference: Genesis 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: ml
  text: 'ഇപ്പോൾ ഇവിടെ ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക: എന്നോടോ എന്റെ സന്തതിയോടോ എന്റെ പിൻതലമുറക്കാരോടോ നീ വഞ്ചന കാണിക്കുകയില്ലെന്ന്.[a] ഞാൻ നിന്നോടു കാണിച്ച ദയപോലെ നീ എന്നോടും നീ പരദേശിയായി പാർത്ത ദേശത്തോടും ദയ കാണിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, “നീ എന്നോടോ എന്റെ സന്തതിയോടോ എന്റെ പിൻതലമുറക്കാരോടോ വഞ്ചന കാണിച്ചാൽ...” എന്നാണ്. ഇത് ശാപഫലം തുറന്നു പറയാതെ വിടുന്ന ഒരു ശപഥരീതിയാണ്.
    reason: മൂലഭാഷയിലെ אִם ഉൾക്കൊള്ളുന്ന അപൂർണ നിബന്ധനാരൂപവും അതിന്റെ ശപഥപരമായ പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ അടുത്ത അഭ്യർഥനയിലേക്കുള്ള മാറ്റവും ‘ഇപ്പോൾ’ എന്ന കാലസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: ദൈവത്തെച്ചൊല്ലി എന്നോടു സത്യം ചെയ്യുക
  rationale: ദൈവത്തെ സാക്ഷിയാക്കി സത്യം ചെയ്യുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: נִינִי וּלְנֶכְדִּי
  choice: എന്റെ മക്കളോടോ എന്റെ പിൻതലമുറക്കാരോടോ
  rationale: രണ്ട് ബന്ധപദങ്ങളുടെയും തലമുറാപരമായ വ്യത്യാസം അമിതമായി കൃത്യമാക്കാതെ, മക്കളെയും തുടർന്നുള്ള വംശജരെയും സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുന്നു.
- source_word: חֶסֶד
  choice: ദയ
  rationale: ഈ സന്ദർഭത്തിൽ മുൻപ് കാണിച്ച വിശ്വസ്തമായ നന്മയെയും അനുകൂല പെരുമാറ്റത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: גַּרְתָּה
  choice: പരദേശിയായി താമസിച്ചുവരുന്ന
  rationale: גּוּר എന്ന ക്രിയയിലെ സ്ഥിരാവകാശമില്ലാത്ത പരദേശവാസത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശപഥവാക്യത്തിലെ אִם എന്ന നിബന്ധനാരൂപം
  choice: ‘വഞ്ചന കാണിക്കുകയില്ലെന്ന്’ എന്ന മലയാള ശപഥരൂപം
  alternative: ‘നീ വഞ്ചന കാണിച്ചാൽ...’ എന്ന അക്ഷരാർഥ നിബന്ധനാരൂപം
  rationale: എബ്രായത്തിൽ אִם ഉപയോഗിച്ച അപൂർണ ശപഥസൂത്രം നിഷേധാത്മക പ്രതിജ്ഞയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ ആശയവും ഗൗരവവും വ്യക്തമായി നൽകുന്നു, എന്നാൽ അടങ്ങിയിരിക്കുന്ന ശാപഫലം കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നേരിട്ടുള്ള അഭ്യർഥനയുടെ ഗൗരവം നിലനിർത്തി; പരദേശവാസം, തലമുറകൾ, പരസ്പരദയ എന്നീ ആശയങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിച്ചു.
