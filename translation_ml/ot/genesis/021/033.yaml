  verdict: revise
  source_fidelity: The draft correctly preserves the actions, location, divine name, and worship formula. However, «പുളിമരം» denotes tamarind, not the Hebrew אֶשֶׁל, which is most plausibly a tamarisk. The botanical term must therefore be corrected without replacing it with a different species.
