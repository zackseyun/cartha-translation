  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: ml
  text: അവൻ ബേർഷേബയിൽ ഒരു താമരിസ്ക് വൃക്ഷം നട്ടു. അവിടെ അവൻ നിത്യനായ ദൈവമായ[b] യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ അവൻ യഹ്‌വേയുടെ നാമം പ്രഖ്യാപിച്ചു” അല്ലെങ്കിൽ “അവിടെ അവൻ യഹ്‌വേയുടെ നാമം വിളിച്ചു.” ആരാധനയുടെ പശ്ചാത്തലത്തിൽ ഈ എബ്രായ പ്രയോഗത്തിന് പ്രഖ്യാപനത്തിന്റെയും ആഹ്വാനത്തിന്റെയും അർഥം വഹിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ശാശ്വതനായ ദൈവം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: നട്ടു
  rationale: נטע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘നടുക’ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶשֶׁל
  choice: പുളിമരം
  rationale: ഏകവചനത്തിലുള്ള אֶשֶׁל സാധാരണയായി tamarisk എന്ന പ്രത്യേക വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘മരം’ എന്നതിനെക്കാൾ ‘പുളിമരം’ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: בִּבְאֵר שָׁבַע
  choice: ബേർഷേബയിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ב־യെ മലയാളത്തിൽ സ്വാഭാവികമായ അധികരണവിഭക്തിയാൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: അവിടെ ... നാമം വിളിച്ചപേക്ഷിച്ചു
  rationale: ഈ എബ്രായ ആരാധനാപ്രയോഗം ദൈവത്തോടുള്ള അഭ്യർഥനയെയും അവന്റെ നാമത്തിന്റെ പ്രഖ്യാപനത്തെയും ഉൾക്കൊള്ളാം. ‘വിളിച്ചപേക്ഷിച്ചു’ പ്രധാനമായ ആഹ്വാനാർഥം നൽകുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵל עוֹלָם
  choice: നിത്യനായ ദൈവം
  rationale: עוֹלָם ഇവിടെ ദൈവത്തിന്റെ ശാശ്വതതയെ വിശേഷിപ്പിക്കുന്നു; ‘നിത്യനായ ദൈവം’ ആ പദവിസദൃശ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ യഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: קרא בשם יהוה എന്ന ആരാധനാപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  alternative: യഹ്‌വേയുടെ നാമം പ്രഖ്യാപിച്ചു; യഹ്‌വേയുടെ നാമം വിളിച്ചു
  rationale: ഉല്പത്തിയിൽ ഈ പ്രയോഗം ആരാധനാപൂർവമായ ആഹ്വാനത്തെ സാധാരണ സൂചിപ്പിച്ചാലും പ്രഖ്യാപനത്തിന്റെ നിഴലർഥവും സാധ്യമാണ്; പ്രധാന പാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: אֵל עוֹלָם എന്ന വിശേഷണത്തിന്റെ കാലാതീതത
  choice: നിത്യനായ ദൈവം
  alternative: ശാശ്വതനായ ദൈവം
  rationale: ദൈവത്തിന്റെ അവസാനമില്ലാത്ത നിലനിൽപ്പിനെ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പകരം വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ രണ്ട് തുടർച്ചാക്രിയകൾ മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി സ്വാഭാവിക ഒഴുക്ക് നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
