id: GEN.21.2
reference: Genesis 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: ml
  text: അങ്ങനെ സാറ ഗർഭം ധരിച്ച്, അബ്രാഹാമിന്റെ വാർധക്യത്തിൽ അവന് ഒരു മകനെ പ്രസവിച്ചു—ദൈവം അവനോടു പറഞ്ഞിരുന്ന നിശ്ചിത സമയത്ത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ച്
  rationale: הרה ഗർഭിണിയാകുക/ഗർഭം ധരിക്കുക എന്നർഥം നൽകുന്നു; തുടർന്നുള്ള പ്രസവവുമായി സ്വാഭാവികമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: Qal രൂപത്തിലുള്ള ילד ഇവിടെ കുഞ്ഞിനെ പ്രസവിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: ഏകവചന നാമത്തിന്റെ അർഥവും മലയാളത്തിലെ സ്വാഭാവിക അനിശ്ചിതപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: לִזְקֻנָיו
  choice: അബ്രാഹാമിന്റെ വാർധക്യത്തിൽ
  rationale: ഈ പ്രയോഗം ഉദ്ദേശ്യമല്ല, അബ്രാഹാമിന്റെ പ്രായാധിക്യമെന്ന കാലസാഹചര്യമാണ് സൂചിപ്പിക്കുന്നത്; സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ പേര് ആവർത്തിച്ചു.
- source_word: לַמּוֹעֵד
  choice: നിശ്ചിത സമയത്തുതന്നെ
  rationale: מוֹעֵד മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു; ‘തന്നെ’ വാഗ്ദത്തം കൃത്യസമയത്ത് നിറവേറിയെന്ന വാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: ദൈവം അവനോടു പറഞ്ഞിരുന്ന
  rationale: ബന്ധവാക്യം നിശ്ചിത സമയത്തെ വിശേഷിപ്പിക്കുന്നു; മുൻപ് ദൈവം അറിയിച്ച വാക്കിലേക്കുള്ള സൂചന ഭൂതകാലപൂർണതയോടെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെയുള്ള പൊതുവായ ദൈവനാമത്തിന് മലയാളത്തിലെ നേരിട്ടുള്ള സമാനപദം.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക വാഗ്ദത്തത്തിൽനിന്ന് അതിന്റെ നിറവേറലിലേക്കുള്ള ആഖ്യാനപരവും ഫലസൂചകവുമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ മുൻവാക്കും അതിന്റെ നിശ്ചിതസമയത്തെ നിറവേറലും അധിക വ്യാഖ്യാനം ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: ദൈവം അവനോടു പറഞ്ഞിരുന്ന നിശ്ചിത സമയത്തുതന്നെ
  alternative: ദൈവം അവനോടു പറഞ്ഞ ആ നിശ്ചിത സമയത്ത്
  rationale: എബ്രായ ബന്ധവാക്യം מועד എന്ന ‘നിശ്ചിത സമയത്തെ’ വിശേഷിപ്പിക്കുന്നു. തെരഞ്ഞെടുത്ത രൂപം ദൈവത്തിന്റെ മുൻപ്രഖ്യാപനവും അതിന്റെ സമയബന്ധിത നിറവേറലും സംരക്ഷിക്കുമ്പോൾ വാക്യത്തിൽ ഇല്ലാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമത്തിന്റെ പ്രധാന ഘടകങ്ങൾ നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അബ്രാഹാമിന്റെ’ എന്നു പേര് ആവർത്തിച്ചു; ദീർഘവാക്യത്തിലെ നിറവേറൽ-ഊന്നൽ വ്യക്തമാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു.
