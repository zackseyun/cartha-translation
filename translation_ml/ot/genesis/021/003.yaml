  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: ml
  text: അബ്രാഹാം തനിക്കു ജനിച്ചവനും സാറാ തനിക്കു ജന്മം നൽകിയവനുമായ തന്റെ മകന് യിസ്ഹാക്ക് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת־שֶׁם
  choice: പേരിട്ടു
  rationale: ‘പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം ‘പേരിട്ടു’ എന്നാണ്; പേരിടുന്ന പ്രവൃത്തി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּנוֹ
  choice: തന്റെ മകനു
  rationale: പ്രത്യയം മകൻ അബ്രാഹാമിന്റേതാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ പരാവർത്തക സർവനാമം കർത്താവുമായുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנּוֹלַד לוֹ
  choice: തനിക്കു ജനിച്ചവനും
  rationale: പങ്കാളിത്തരൂപം മകനെ വിശേഷിപ്പിക്കുന്നു; לוֹ എന്ന ബന്ധസൂചക ദാതിവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: സാറാ തനിക്കുവേണ്ടി പ്രസവിച്ചവനുമായ
  rationale: സാറയാണ് പ്രസവിച്ചതെന്നും ആ മകൻ അബ്രാഹാമിനുവേണ്ടി/അവനു ലഭിച്ചതാണെന്നും ആവർത്തിക്കുന്ന എബ്രായ ദാതിവിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറച്ചതുമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന സ്വീകരിച്ചെങ്കിലും, ‘തനിക്കു ജനിച്ച’ എന്നും ‘സാറാ തനിക്കുവേണ്ടി പ്രസവിച്ച’ എന്നും വരുന്ന ആവർത്തനത്തിലൂടെ എബ്രായ മൂലത്തിലെ ബന്ധപരമായ ഊന്നൽ നിലനിർത്തി. ശൈലി ലളിതവും ഗൗരവമുള്ളതുമാണ്.
