id: GEN.12.6
reference: Genesis 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: ml
  text: അബ്രാം ദേശത്തുകൂടി കടന്ന് ശെഖേം എന്ന സ്ഥലത്തോളം, മോരെയിലെ വലിയ വൃക്ഷത്തോളം[a] എത്തി. അക്കാലത്ത് കനാന്യർ[b] ദേശത്തുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ഒരു വലിയ വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ഇനം അനിശ്ചിതമാണ്. ‘മോരെയിലെ ഓക്കുമരം’ എന്നോ ‘മോരെയിലെ ടെറിബിന്ത് മരം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘കനാന്യൻ’ എന്ന ഏകവചനരൂപമാണ്; ഇവിടെ അത് കനാന്യജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: കടന്ന്
  rationale: עבר എന്ന ക്രിയ ഇവിടെ അബ്രാം ദേശത്തിലൂടെ സഞ്ചരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. യാത്രയുടെ രീതിയോ വഴിയോ അനാവശ്യമായി നിർണയിക്കാതെ ചലനത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്തുകൂടി / ദേശത്ത്
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് കനാൻദേശമാണ്. ആദ്യപ്രയോഗത്തിൽ സഞ്ചാരപഥവും രണ്ടാമത്തേതിൽ വാസസാന്നിധ്യവും വ്യക്തമാക്കാൻ മലയാളത്തിലെ യോജിച്ച വിഭക്തികൾ ഉപയോഗിച്ചു.
- source_word: עַד
  choice: …ത്തോളം
  rationale: യാത്രയുടെ എത്തിച്ചേരൽപരിധി സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מְקוֹם שְׁכֶם
  choice: ശെഖേം എന്ന സ്ഥലം
  rationale: מקום എന്ന പൊതുനാമവും ശെഖേം എന്ന സ്ഥലനാമവും നിലനിർത്തുന്നു; ഇത് പിൽക്കാലത്ത് പൂർണമായി വികസിച്ച നഗരമായിരുന്നുവെന്ന് മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: אֵלוֹן מוֹרֶה
  choice: മോരെയിലെ വലിയ വൃക്ഷം
  rationale: אֵלוֹן സൂചിപ്പിക്കുന്ന വൃക്ഷയിനം കൃത്യമായി ഉറപ്പില്ലാത്തതിനാൽ ‘ഓക്ക്’ അല്ലെങ്കിൽ ‘ടെറിബിന്ത്’ എന്ന് ഏകപക്ഷീയമായി നിർണയിക്കാതെ വലിയ വൃക്ഷം എന്നു നൽകി; ‘മോരെ’ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְהַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: എബ്രായത്തിൽ ഏകവചന ജനവിഭാഗനാമമാണെങ്കിലും അത് സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘കനാന്യൻ’ എന്നു നൽകിയാൽ ഒരൊറ്റ വ്യക്തിയെന്ന തെറ്റിദ്ധാരണ വരാനിടയുള്ളതിനാൽ സമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: אָז
  choice: അക്കാലത്ത്
  rationale: വിവരണത്തിലുള്ള ചരിത്രസാഹചര്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: וְהַכְּנַעֲנִי എന്ന ജനവിഭാഗനാമത്തിന്റെ വചനം
  choice: സമൂഹവാചക അർത്ഥം വ്യക്തമാക്കുന്ന ‘കനാന്യർ’
  alternative: എബ്രായ ഏകവചനരൂപത്തെ അനുകരിക്കുന്ന ‘കനാന്യൻ’
  rationale: മൂലപാഠത്തിലെ ഏകവചനം ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കാം. മലയാളത്തിലെ ഏകവചനം ഒറ്റ വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി എളുപ്പം ഗ്രഹിക്കപ്പെടുന്നതിനാൽ ബഹുവചനം അർത്ഥം കൂടുതൽ കൃത്യമായി എത്തിക്കുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശെഖേം’, ‘മോരെ’ എന്നീ പേരുകൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർന്നവയാണ്. വൃക്ഷയിനത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
