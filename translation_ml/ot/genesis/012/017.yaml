id: GEN.12.17
reference: Genesis 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെ അബ്രാമിന്റെ ഭാര്യയായ സാറായി നിമിത്തം ഫറവോനെയും അവന്റെ വീട്ടുകാരെയും കഠിനമായ ബാധകൾ ഏൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഫറവോനെയും അവന്റെ വീട്ടുകാരെയും വലിയ ബാധകൾ ഏൽപ്പിച്ചു.” ഹീബ്രുവിലെ ക്രിയയ്ക്ക് ‘പ്രഹരിക്കുക/ബാധിക്കുക’ എന്നും അതിനോടു ചേർന്ന നാമത്തിന് ‘പ്രഹരങ്ങൾ/ബാധകൾ’ എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: പീഡിപ്പിച്ചു
  rationale: നגע എന്ന ക്രിയയുടെ ഹിഫ്ഈൽ രൂപം ഇവിടെ ദോഷകരമായ ബാധകൾ വരുത്തുക എന്ന കാരകാർഥത്തിലാണ്. പിന്നാലെയുള്ള נְגָעִים എന്ന നാമവുമായി ചേർന്ന് സ്വാഭാവികമായ മലയാളത്തിൽ ‘പീഡിപ്പിച്ചു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണമായ ‘യഹ്‌വെ’ എന്നു നൽകി.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്ക് ആധുനിക മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: נְגָעִים גְּדֹלִים
  choice: കഠിനമായ ബാധകളാൽ
  rationale: נְגָעִים എന്നത് ബാധകൾ, പ്രഹരങ്ങൾ, വ്യാധികൾ എന്നീ അർഥങ്ങൾ വഹിക്കാം; גְּדֹלִים ഇവിടെ വലിപ്പത്തേക്കാൾ തീവ്രത സൂചിപ്പിക്കുന്നതിനാൽ ‘കഠിനമായ ബാധകൾ’ എന്നു നൽകി.
- source_word: וְאֶת בֵּיתוֹ
  choice: അവന്റെ വീട്ടിലുള്ളവരെയും
  rationale: בֵּיתוֹ ഇവിടെ കെട്ടിടത്തെക്കാൾ ഫറവോന്റെ ഗൃഹവൃത്തത്തിലുള്ള ആളുകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: עַל דְּבַר
  choice: നിമിത്തം
  rationale: ഈ പ്രയോഗം ഇവിടെ ബാധകളുടെ കാരണം അറിയിക്കുന്നു. ‘നിമിത്തം’ ചുരുക്കവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: അബ്രാമിന്റെ ഭാര്യയായ സാറായി
  rationale: ഹീബ്രു സമാനാധികരണ ഘടന സാറായിയെ അബ്രാമിന്റെ ഭാര്യയായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ സംരക്ഷിച്ചു. മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണമായി ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: സാറായി നിമിത്തം ബാധകൾ വന്നതിന്റെ കാരണബന്ധം
  choice: ‘സാറായി നിമിത്തം’ എന്ന മൂലപാഠത്തിലെ സംക്ഷിപ്ത കാരണപ്രയോഗം നിലനിർത്തി
  alternative: ഫറവോൻ സാറായിയെ എടുത്തതുകൊണ്ട്; സാറായിക്ക് സംഭവിച്ചതിനാൽ
  rationale: עַל דְּבַר שָׂרַי കാരണം സൂചിപ്പിക്കുന്നുവെങ്കിലും കുറ്റത്തിന്റെ സ്വഭാവം ഈ വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല. അതിനാൽ കഥാസന്ദർഭത്തിൽ നിന്നുള്ള വ്യാഖ്യാനം വാക്യത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീട്ടിലുള്ളവർ’ എന്ന രൂപം ‘ഭവനം’ എന്ന കെട്ടിടാർഥത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു. മൂലത്തിലെ ക്രിയ-നാമ പദപ്രയോഗത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
