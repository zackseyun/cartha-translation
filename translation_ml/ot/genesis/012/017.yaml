  to: എന്നാൽ യഹ്‌വെ അബ്രാമിന്റെ ഭാര്യയായ സാറായി നിമിത്തം ഫറവോനെയും അവന്റെ വീട്ടുകാരെയും കഠിനമായ ബാധകൾ ഏൽപ്പിച്ചു.[a]
