translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അപേക്ഷാഭാവം, രണ്ട് കാരണപ്രയോഗങ്ങളുടെ ആവർത്തിച്ച ഊന്നൽ, נֶפֶשׁ എന്ന പദത്തിന്റെ ജീവൻ/സ്വയം എന്ന സന്ദർഭാർഥം എന്നിവ സംരക്ഷിച്ചു.
