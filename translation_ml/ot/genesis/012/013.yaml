  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: ml
  text: “നീ എന്റെ സഹോദരിയാണെന്ന് ദയവായി പറയുക; അങ്ങനെ നിന്റെ നിമിത്തം[a] എനിക്ക് നന്മ ഉണ്ടാകാനും നിന്റെ കാരണത്താൽ എന്റെ ജീവൻ രക്ഷപ്പെടാനും[b] കഴിയേണ്ടതിന്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “നിന്റെ നിമിത്തം” എന്നും “നിന്റെ കാരണത്താൽ” എന്നും വിവർത്തനം ചെയ്തിരിക്കുന്ന രണ്ട് പ്രയോഗങ്ങൾ അടുത്ത അർഥമുള്ളവയാണ്. സാറായിയുമായുള്ള അവകാശപ്പെട്ട ബന്ധം മുഖേന തനിക്ക് അനുകൂല പരിഗണനയും സുരക്ഷയും ലഭിക്കുമെന്നാണ് അബ്രാം പ്രതീക്ഷിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ നെഫെശ് ജീവിക്കേണ്ടതിന്.” ഇവിടെ നെഫെശ് അബ്രാമിന്റെ ജീവനെ അഥവാ അദ്ദേഹത്തെത്തന്നെ സൂചിപ്പിക്കുന്നു; ദേഹാതീതമായ ആത്മാവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: ദയവായി പറയുക
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא അപേക്ഷയുടെ ഭാവം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘ദയവായി പറയുക’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲחֹתִי אָתְּ
  choice: നീ എന്റെ സഹോദരിയാണെന്ന്
  rationale: ‘നീ എന്റെ സഹോദരിയാണ്’ എന്ന വിധേയപ്രയോഗം ‘പറയുക’ എന്ന ക്രിയയ്ക്കു പിന്നാലെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണാർഥക രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: לְמַעַן
  choice: അപ്പോൾ … വരികയും … നിലനിൽക്കുകയും ചെയ്യും
  rationale: ഇവിടെ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ ഘടന സന്ദർഭത്തിലെ ഫലപ്രതീക്ഷ വ്യക്തമായി നൽകുന്നു.
- source_word: יִיטַב לִי
  choice: എനിക്ക് നന്മ വരിക
  rationale: ‘എനിക്ക് നല്ലതു സംഭവിക്കുക/കാര്യങ്ങൾ നന്നാകുക’ എന്ന വിശാലമായ ഹീബ്രു പ്രയോഗത്തെ അനുകൂലമായ പെരുമാറ്റം എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בַעֲבוּרֵךְ
  choice: നിന്റെ നിമിത്തം
  rationale: സാറായിയുമായുള്ള അവകാശപ്പെട്ട ബന്ധം മൂലം അബ്രാമിന് ലഭിക്കുമെന്നു കരുതുന്ന അനുകൂല ഫലത്തിന്റെ കാരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: എന്റെ ജീവൻ നിലനിൽക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ നെഫെശ് ജീവിക്കും’; ഇവിടെ נֶפֶשׁ അബ്രാമിന്റെ ജീവൻ/സ്വയം എന്ന അർഥത്തിലുള്ളതിനാൽ ദേഹാതീതമായ ‘ആത്മാവ്’ എന്ന് തെറ്റായി പ്രത്യേകീകരിക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
- source_word: בִּגְלָלֵךְ
  choice: നീ കാരണം
  rationale: മുൻപുള്ള בַעֲבוּרֵךְ-നോടു അടുത്ത അർഥമുള്ള രണ്ടാമത്തെ കാരണപ്രയോഗം; മലയാളത്തിൽ കൃത്രിമമായ പദാവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് ആവർത്തിച്ച ഊന്നൽ നിലനിർത്തുന്നു.
