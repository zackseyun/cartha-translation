id: GEN.12.2
reference: Genesis 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: ml
  text: ഞാൻ നിന്നെ ഒരു വലിയ ജനതയാക്കും; നിന്നെ അനുഗ്രഹിക്കും; നിന്റെ പേര് മഹത്തരമാക്കും; നീ ഒരു അനുഗ്രഹമായിരിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ഒരു അനുഗ്രഹമായിത്തീരും.” എബ്രായത്തിലെ ക്രിയാരൂപം ആജ്ഞാർഥമാണെങ്കിലും, മുൻപുള്ള ദൈവിക വാഗ്ദാനങ്ങളുടെ ഫലത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: ഞാൻ നിന്നെ ഒരു വലിയ ജനതയാക്കും
  rationale: עשה എന്ന ക്രിയയും לְגוֹי എന്ന പൂരകവും ചേർന്ന് അബ്രാമിനെ ഒരു വലിയ ജനതയായി രൂപപ്പെടുത്തുമെന്ന അർഥം നൽകുന്നു. ജാതി എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ ജാതിവ്യവസ്ഥയുമായി ബന്ധപ്പെട്ട അർഥം വരാവുന്നതിനാൽ גּוֹי എന്നതിന് ഇവിടെ സ്വാഭാവികമായ ‘ജനത’ ഉപയോഗിച്ചു.
- source_word: וַאֲבָרֶכְךָ
  choice: നിന്നെ അനുഗ്രഹിക്കും
  rationale: പീയേൽ രൂപത്തിലുള്ള ברך നേരിട്ട് ‘അനുഗ്രഹിക്കുക’ എന്നാണ്; രണ്ടാം പുരുഷ ഏകവചന കർമപ്രത്യയം ‘നിന്നെ’ എന്നു വ്യക്തമാക്കി.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: നിന്റെ പേര് മഹത്തരമാക്കും
  rationale: גדל എന്നതിന്റെ കാരണാർഥമായ ‘മഹത്തരമാക്കുക’ നിലനിർത്തുന്നു. שֵׁם എന്നതിന് ‘പ്രശസ്തി’ എന്ന ആശയസൂചനയുണ്ടെങ്കിലും മൂലപദത്തോടുള്ള സുതാര്യതയ്ക്കായി ‘പേര്’ സ്വീകരിച്ചു.
- source_word: וֶהְיֵה
  choice: നീ … ആയിരിക്കുക
  rationale: ഇത് היה എന്ന ക്രിയയുടെ രണ്ടാം പുരുഷ പുല്ലിംഗ ഏകവചന ആജ്ഞാർഥരൂപമാണ്. അതിനാൽ സാധാരണ ഭാവികാലമായി മാറ്റാതെ ആജ്ഞാർഥം പ്രധാന പാഠത്തിൽ നിലനിർത്തി.
- source_word: בְּרָכָה
  choice: ഒരു അനുഗ്രഹം
  rationale: ഏകവചന നാമത്തിന്റെ അനിശ്ചിതത്വവും അബ്രാം അനുഗ്രഹത്തിന്റെ ഉറവിടമോ വാഹകനോ ആകണമെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה എന്നതിന്റെ വ്യാകരണബലവും വാഗ്ദാനപരമ്പരയുമായുള്ള ബന്ധവും
  choice: 'ആജ്ഞാർഥം: ‘നീ ഒരു അനുഗ്രഹമായിരിക്കുക’'
  alternative: 'ഫലസൂചകമോ പ്രവചനാത്മകമോ: ‘നീ ഒരു അനുഗ്രഹമായിത്തീരും’'
  rationale: എബ്രായ ക്രിയാരൂപം വ്യക്തമായി ആജ്ഞാർഥമാണെന്നതിനാൽ പ്രധാന പാഠത്തിൽ അതു നിലനിർത്തി. എന്നാൽ ദൈവിക വാഗ്ദാനങ്ങളുടെ പരമ്പരയ്ക്കുള്ളിൽ വരുന്നതിനാൽ അതിനെ വാഗ്ദാനത്തിന്റെ ഫലമായി മനസ്സിലാക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘വലിയ ജനത’, ‘പേര് മഹത്തരമാക്കും’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിന്റെ രൂപകൽപ്പനയും നിലനിർത്തുന്നു. അവസാന ഭാഗത്തിലെ ആജ്ഞാർഥമാറ്റം വ്യക്തമാക്കാൻ കർത്താവായ ‘നീ’ ചേർത്തു; എബ്രായത്തിലെ ബന്ധകങ്ങളുടെ തുടർച്ച അർധവിരാമങ്ങളിലൂടെ സൂചിപ്പിച്ചു.
