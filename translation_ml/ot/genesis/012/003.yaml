reference: Genesis 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: ml
  text: നിന്നെ അനുഗ്രഹിക്കുന്നവരെ ഞാൻ അനുഗ്രഹിക്കും; നിന്നെ നിസ്സാരമായി കാണുന്നവനെ ഞാൻ ശപിക്കും[a]. നിന്നിൽ ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നെ ശപിക്കുന്നവനെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ (קלל) നിസ്സാരമായി കാണുക, അപമാനിക്കുക, അല്ലെങ്കിൽ ശപിക്കുക എന്നിങ്ങനെ അർഥമാക്കാം; തുടർന്ന് ‘ഞാൻ ശപിക്കും’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയെക്കാൾ (ארר) ഇത് ശക്തി കുറഞ്ഞതാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്നെ ആധാരമാക്കി ഭൂമിയിലെ സകല കുടുംബങ്ങളും തങ്ങൾക്കായി അനുഗ്രഹം ആശംസിക്കും’ എന്നോ ‘നിന്നിലൂടെ ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായരൂപം കർമണിയാണോ പ്രത്യാവർത്തക/മധ്യമാർഥമാണോ എന്നതിൽ വ്യത്യസ്ത വായനകൾക്ക് ഇടയുണ്ട്; ഉപസർഗത്തിന് കരണാർഥവും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: ഞാൻ അനുഗ്രഹിക്കും
  rationale: ברך എന്ന ക്രിയയുടെ ഖാൽ ഒന്നാംപുരുഷ ഏകവചനരൂപം ദൈവിക വാഗ്ദാനത്തിന്റെ ഭാവാർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഞാൻ അനുഗ്രഹിക്കും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מְבָרְכֶיךָ
  choice: നിന്നെ അനുഗ്രഹിക്കുന്നവരെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചന കൃദന്തരൂപം ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּמְקַלֶּלְךָ
  choice: നിന്നെ നിസ്സാരനായി കാണുന്നവനെ
  rationale: קלל എന്നത് നിസ്സാരമായി കാണുക, അപമാനിക്കുക, ശപിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം; തുടർന്നുള്ള ശക്തമായ ארר എന്ന ക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം ഈ വിവർത്തനം സംരക്ഷിക്കുന്നു. എബ്രായത്തിലെ ഏകവചനവും നിലനിർത്തുന്നു.
- source_word: אָאֹר
  choice: ഞാൻ ശപിക്കും
  rationale: ארר എന്ന ശക്തമായ ശാപക്രിയയുടെ ഖാൽ ഒന്നാംപുരുഷ ഏകവചനരൂപത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യപ്രയോഗം.
- source_word: וְנִבְרְכוּ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ברך എന്നതിന്റെ നിഫാൽ മൂന്നാംപുരുഷ ബഹുവചനരൂപത്തെ മുഖ്യപാഠത്തിൽ കർമണിപ്രയോഗമായി നൽകുന്നു; പ്രത്യാവർത്തക/മധ്യമാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּךָ
  choice: നിന്നിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള ‘യിൽ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘നിന്നിലൂടെ’ എന്ന കരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: ഭൂമിയിലെ സകല കുടുംബങ്ങളും
  rationale: מִשְׁפְּחֹת കുടുംബങ്ങൾ/കുലങ്ങൾ എന്ന കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു; ഈ സാർവത്രിക വാഗ്ദാനസന്ദർഭത്തിൽ הָאֲדָמָה എന്നതിന് ‘ഭൂമി’ സ്വാഭാവികവും വിശാലവുമാണ്.
theological_decisions:
- issue: וְנִבְרְכוּ בְךָ എന്ന അബ്രാഹാമിക അനുഗ്രഹവാക്യത്തിന്റെ അർഥം
  choice: 'കർമണി: ‘നിന്നിൽ ... അനുഗ്രഹിക്കപ്പെടും’'
  alternative: 'പ്രത്യാവർത്തക/മധ്യമാർഥം: ‘നിന്നെ ആധാരമാക്കി തങ്ങൾക്കായി അനുഗ്രഹം ആശംസിക്കും’; കരണാർഥം: ‘നിന്നിലൂടെ ... അനുഗ്രഹിക്കപ്പെടും’'
  rationale: നിഫാൽ രൂപം കർമണിയായോ പ്രത്യാവർത്തക/മധ്യമാർഥമായോ മനസ്സിലാക്കാവുന്നതാണ്; בְּ ഉപസർഗത്തിന് കരണാർഥവും സാധ്യമാണ്. മുഖ്യപാഠം നേരിട്ടുള്ള കർമണിവായന സ്വീകരിക്കുമ്പോൾ യഥാർഥ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിസ്സാരനായി കാണുക’ എന്ന പ്രയോഗം മനുഷ്യന്റെ קלל എന്ന പ്രവൃത്തിയും ദൈവത്തിന്റെ ശക്തമായ ארר എന്ന പ്രതികരണവും തമ്മിലുള്ള പദഭേദം തെളിയിക്കുന്നു. ബഹുവചനമായ ‘അനുഗ്രഹിക്കുന്നവർ’ എന്നും ഏകവചനമായ ‘നിസ്സാരനായി കാണുന്നവൻ’ എന്നും ഉള്ള എബ്രായ വ്യത്യാസവും സംരക്ഷിച്ചിട്ടുണ്ട്.
