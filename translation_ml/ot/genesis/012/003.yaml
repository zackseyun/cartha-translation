  source_fidelity: മുഖ്യപാഠം എബ്രായത്തിലെ ബഹുവചനമായ מְבָרְכֶיךָ (‘അനുഗ്രഹിക്കുന്നവർ’)യും ഏകവചനമായ וּמְקַלֶּלְךָ (‘നിസ്സാരമായി കാണുന്നവൻ/അപമാനിക്കുന്നവൻ’)യും ശരിയായി വേർതിരിക്കുന്നു. קלל-നും കൂടുതൽ ശക്തമായ ארר-നും ഇടയിലെ പദഭേദവും, וְנִבְרְכוּ בְךָ എന്നതിന്റെ കർമണിവായനയും അടിക്കുറിപ്പിലെ ബദൽവായനകളും വിശ്വസ്തമായി സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
  naturalness: ‘നിന്നെ നിസ്സാരനായി കാണുന്നവനെ’ മനസ്സിലാക്കാവുന്നതാണ്; എങ്കിലും ആധുനിക സ്വാഭാവിക മലയാളത്തിൽ ‘നിന്നെ നിസ്സാരമായി കാണുന്നവനെ’ എന്നാണ് ഒരാളെ നിസ്സാരമായി/ലാഘവത്തോടെ പരിഗണിക്കുന്ന പ്രവൃത്തിയെ കൂടുതൽ നേരിട്ട് വ്യക്തമാക്കുന്നത്.
  terminology: ‘അനുഗ്രഹിക്കും,’ ‘ശപിക്കും,’ ‘ഭൂമിയിലെ സകല കുടുംബങ്ങളും’ എന്നിവ ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളത്തിന് യോജിച്ചവയാണ്. ‘നിസ്സാരമായി കാണുക’ קלל-ന്റെ ‘treat lightly/dishonor’ എന്ന അർഥവും ארר-ന്റെ ശക്തമായ ശാപക്രിയയുമായുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
