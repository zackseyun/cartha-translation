  to: നിന്നെ അനുഗ്രഹിക്കുന്നവരെ ഞാൻ അനുഗ്രഹിക്കും; നിന്നെ നിസ്സാരമായി കാണുന്നവനെ ഞാൻ ശപിക്കും[a]. നിന്നിൽ ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും[b].
