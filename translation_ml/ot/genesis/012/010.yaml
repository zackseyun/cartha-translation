  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: ml
  text: ദേശത്ത് ക്ഷാമമുണ്ടായി. അബ്രാം അവിടെ പരദേശിയായി താമസിക്കാൻ[a] ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി; കാരണം, ദേശത്തെ ക്ഷാമം കഠിനമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പരദേശിയായി താമസിക്കാൻ” എന്നത് അവിടെ അന്യദേശക്കാരനായി താൽക്കാലികമായി വസിക്കുക എന്നർഥം.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: കഥയിലെ പുതിയ സംഭവവികാസത്തെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകപദം ചേർക്കുന്നില്ല.
- source_word: רָעָב
  choice: ക്ഷാമം
  rationale: വ്യക്തിപരമായ വിശപ്പിനെയല്ല, പ്രദേശത്തെ ഭക്ഷ്യക്ഷാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത് / ദേശത്തെ
  rationale: ഇവിടെ אֶרֶץ ലോകമൊട്ടാകെയല്ല, അബ്രാം പാർത്തിരുന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആവർത്തനം മൂലപാഠത്തെ പിന്തുടരുന്നു.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിപ്പോയി
  rationale: ഈജിപ്തിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിലെ ‘താഴേക്കു പോകുക’ എന്ന ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ പ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരം വ്യക്തമാക്കുന്നു.
- source_word: לָגוּר
  choice: കുറച്ചുകാലം അവിടെ പരദേശിയായി താമസിക്കാൻ
  rationale: גור എന്ന പദത്തിലെ താൽക്കാലിക വാസത്തിന്റെയും അന്യദേശവാസിയെന്ന നിലയുടെയും ആശയങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന് നേരിട്ടുള്ള സ്വാഭാവിക തർജമ.
- source_word: כִּי
  choice: ആയിരുന്നതിനാൽ
  rationale: അബ്രാം ഈജിപ്തിലേക്കു പോയതിന്റെ കാരണം വ്യക്തമാക്കുന്നു.
- source_word: כָבֵד
  choice: കഠിനമായ
  rationale: അക്ഷരാർഥമായ ‘ഭാരമുള്ള’ എന്നതിനു പകരം ക്ഷാമത്തിന്റെ തീവ്രത മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
