  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: ml
  text: അപ്പോൾ ഫറവോൻ അബ്രാമിനെക്കുറിച്ച് ആളുകൾക്കു കല്പിച്ചു[a][b]. അവർ അവനെയും അവന്റെ ഭാര്യയെയും അവനുള്ള സകലത്തെയും[c] അയച്ചുവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്പോൾ ഫറവോൻ അബ്രാമിനെ സംബന്ധിച്ച് ആളുകളോടു ആജ്ഞാപിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായമൂലത്തിൽ “ആളുകൾ” എന്നാണ്. സന്ദർഭത്തിൽ അവർ ഫറവോന്റെ പരിചാരകരോ പ്രതിനിധികളോ ആയിരിക്കാം; എന്നാൽ അവരുടെ കൃത്യമായ ചുമതല വ്യക്തമാക്കിയിട്ടില്ല.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “അവനുണ്ടായിരുന്നതെല്ലാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പന നൽകി
  rationale: צוה എന്ന ക്രിയയുടെ ‘കല്പിക്കുക/ആജ്ഞ നൽകുക’ എന്ന ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלָיו
  choice: അബ്രാമിനെക്കുറിച്ച്
  rationale: צוה-യോടൊപ്പമുള്ള עַל ഇവിടെ അബ്രാമിനെ സംബന്ധിച്ച നിർദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സർവനാമത്തിന്റെ വ്യക്തമായ സൂചിതപദം മലയാളത്തിൽ ചേർത്തു.
- source_word: אֲנָשִׁים
  choice: തന്റെ ആളുകൾ
  rationale: മൂലപദം ‘പുരുഷന്മാർ/ആളുകൾ’ എന്നാണ്; സന്ദർഭത്തിൽ അവർ ഫറവോന്റെ കീഴിലുള്ളവരാണെന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, എന്നാൽ അവരുടെ ഔദ്യോഗിക പദവി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיְשַׁלְּחוּ
  choice: അയച്ചുകളഞ്ഞു
  rationale: שלח എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘പറഞ്ഞയയ്ക്കുക/വിട്ടയയ്ക്കുക’ എന്ന അർഥവും പുറത്തേക്കുള്ള യാത്രയുടെ ഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: അബ്രാമിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയെ
  rationale: വൈവാഹിക സന്ദർഭത്തിലെ אשה എന്ന പദത്തിന്റെ സാധാരണ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: അവനുള്ള സകലത്തെയും
  rationale: അബ്രാമിന്റെ എല്ലാ സ്വത്തുക്കളെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും ഔപചാരികവുമായ പ്രതിഫലനം.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള പ്രചാരത്തിലുള്ള മലയാളരൂപം.
