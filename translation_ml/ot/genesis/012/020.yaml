  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ പ്രവർത്തകരെയും ക്രിയാക്രമത്തെയും വ്യക്തമായി നിലനിർത്തി; ‘തന്റെ ആളുകൾ’ എന്നത് അവരുടെ പദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഫറവോനോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു.
