source:
  edition: WLC
  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ അബ്രാമിന് പ്രത്യക്ഷനായി പറഞ്ഞു: “നിന്റെ സന്തതിക്ക്[a] ഞാൻ ഈ ദേശം കൊടുക്കും.” തനിക്ക് പ്രത്യക്ഷനായ യഹ്‌വെക്കായി അബ്രാം അവിടെ ഒരു യാഗപീഠം പണിതു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിത്തിന്.” എബ്രായപദം രൂപത്തിൽ ഏകവചനമാണ്; എന്നാൽ ഒരു സമൂഹമായ പിൻതലമുറയെ സൂചിപ്പിക്കുന്ന കൂട്ടാർഥത്തിലും അത് ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ അബ്രാമിനുണ്ടായ ദൃശ്യമായ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל־אַבְרָם
  choice: അബ്രാമിന്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ദാതൃപ്രയോഗം ഉപയോഗിച്ച് പ്രത്യക്ഷതയുടെ സ്വീകർത്താവിനെ വ്യക്തമാക്കുന്നു.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്ക്
  rationale: זֶרַע രൂപത്തിൽ ഏകവചനമാണെങ്കിലും കൂട്ടമായ പിൻതലമുറയെ സൂചിപ്പിക്കാം; ‘സന്തതി’ ആ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֶתֵּן
  choice: ഞാൻ ... കൊടുക്കും
  rationale: അപൂർണക്രിയ ഇവിടെ ഭാവിയിലെ വാഗ്ദാനത്തെ പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: ഗോത്രപിതാക്കന്മാരോടുള്ള ദേശവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ אֶרֶץ എന്നതിന് ‘ദേശം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: അബ്രാം അവിടെ ഒരു യാഗപീഠം പണിതു
  rationale: കഥയുടെ തുടർച്ചയും സ്ഥലസൂചനയും നിലനിർത്തുന്നു; മലയാളത്തിൽ വിഷയം വീണ്ടും വ്യക്തമാക്കുന്നത് സ്വാഭാവികത വർധിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെക്കായി
  rationale: ലാമെദ് ഇവിടെ യാഗപീഠത്തിന്റെ സമർപ്പണം അല്ലെങ്കിൽ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ‘-ക്കായി’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: തനിക്ക് പ്രത്യക്ഷനായ
  rationale: നിർദ്ദിഷ്ട കർത്തൃവാചക കൃതന്തം യഹ്‌വെയെ അബ്രാമിന് പ്രത്യക്ഷനായവനായി തിരിച്ചറിയുന്നു; മുൻപ് നടന്ന സംഭവബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ ആധുനിക പണ്ഡിതസമ്മതമായ ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമാണ്.
- issue: זֶרַע എന്ന പദത്തിന്റെ കൂട്ടാർഥം
  choice: സന്തതി
  alternative: വിത്ത്; പിൻതലമുറക്കാർ
  rationale: എബ്രായപദം രൂപത്തിൽ ഏകവചനവും പ്രയോഗത്തിൽ കൂട്ടാർഥമുള്ളതുമാണ്. ‘സന്തതി’ വ്യക്തിയെയോ സമൂഹത്തെയോ മുൻകൂട്ടി പരിമിതപ്പെടുത്താതെ ആ ദൈവശാസ്ത്രപരമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യാഗപീഠം’ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവും കൃത്യവുമാണ്; വാക്യഘടന എബ്രായത്തിന്റെ അർത്ഥക്രമം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാക്കിയിരിക്കുന്നു.
