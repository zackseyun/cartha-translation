source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: ml
  text: 'യഹ്‌വെ അബ്രാമിനോട് പറഞ്ഞു: “നിന്റെ ദേശത്തുനിന്നും നിന്റെ ബന്ധുജനങ്ങളിൽനിന്നും നിന്റെ പിതാവിന്റെ ഭവനത്തിൽനിന്നും പുറപ്പെട്ട്, ഞാൻ നിനക്കു കാണിച്ചുതരുന്ന ദേശത്തേക്കു പോകുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു പാഠത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മറയ്ക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നൽകി.
- source_word: לֶךְ־לְךָ
  choice: പുറപ്പെട്ട് ... പോകുക
  rationale: സന്ദർഭത്തിൽ ജന്മദേശം, ബന്ധുജനം, പിതൃഭവനം എന്നിവ വിട്ടുപോകാനുള്ള ശക്തമായ ആഹ്വാനം വ്യക്തമാക്കുന്നു; പ്രതിഫലക സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ പ്രത്യേകമായി ആവർത്തിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ പുറപ്പെടുക എന്ന ക്രിയയിലൂടെ ഭാവം കൈമാറി.
- source_word: מִמּוֹלַדְתְּךָ
  choice: നിന്റെ ബന്ധുജനങ്ങളിൽനിന്നും
  rationale: ഈ സന്ദർഭത്തിൽ ജന്മസ്ഥലം മാത്രമല്ല, വംശബന്ധമുള്ള സമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പദം; തുടർന്നുള്ള ‘പിതാവിന്റെ ഭവനം’ എന്നതിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ബന്ധുജനം എന്നു നൽകി.
- source_word: מִבֵּית אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ ഭവനത്തിൽനിന്നും
  rationale: בית אב എന്നത് കെട്ടിടം മാത്രമല്ല, പിതാവിന്റെ കുടുംബഗൃഹത്തെയും കുടുംബഘടനയെയും സൂചിപ്പിക്കാം; ‘ഭവനം’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אַרְאֶךָּ
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരുന്ന
  rationale: ഹീബ്രു അപൂർണ്ണക്രിയയുടെ ഭാവികാല അർഥം നിലനിർത്തുകയും ലക്ഷ്യദേശം ഇനിയും വെളിപ്പെടുത്തപ്പെടാനുള്ളതാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായ יהוה എന്ന വ്യക്തിനാമം പരമ്പരാഗത സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിച്ചു.
- issue: ലക്ഷ്യദേശത്തിന്റെ മുൻകൂട്ടിയുള്ള അറിവ്
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരുന്ന ദേശം
  alternative: ഞാൻ നിനക്കു കാണിച്ച ദേശം
  rationale: ഹീബ്രുവിലെ ക്രിയ ഭാവിയിൽ ദൈവം കാണിച്ചുകൊടുക്കുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അബ്രാമിന് ദേശം ഇതിനകം വെളിപ്പെട്ടിരുന്നു എന്നു വരുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രു വാക്യാരംഭത്തിലെ וַיֹּאמֶר എന്ന ആഖ്യാനബന്ധകത്തിന് പ്രത്യേകമായി ‘അപ്പോൾ/ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. മൂന്ന് വേർപാടുകളുടെയും ആവർത്തനഘടന ‘നിന്നും’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി.
