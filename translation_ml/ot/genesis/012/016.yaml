  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: ml
  text: അവൾ നിമിത്തം[a] അവൻ അബ്രാമിനോടു നന്നായി പെരുമാറി. അങ്ങനെ അബ്രാമിന് ആടുമാടുകളും ആൺകഴുതകളും അടിമകളും അടിമസ്ത്രീകളും പെൺകഴുതകളും ഒട്ടകങ്ങളും ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾക്കുവേണ്ടി.” ഹീബ്രു പ്രയോഗം ഇരു രീതിയിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: നന്നായി പെരുമാറി
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഒരാളോടു നന്മ ചെയ്യുക അഥവാ അനുകൂലമായി പെരുമാറുക എന്നർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തിബന്ധപ്രയോഗമാണിത്.
- source_word: בַּעֲבוּרָהּ
  choice: അവൾ നിമിത്തം
  rationale: കാരണത്തെയോ സന്ദർഭഹേതുവിനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഗുണഭോക്തൃഭാവം നിർബന്ധമായി ചുമത്താതെ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וַיְהִי לוֹ
  choice: അങ്ങനെ അബ്രാമിന് ... ലഭിച്ചു
  rationale: അവന്റെ കൈവശം ഇവ വന്നുചേർന്നതെന്ന ഫലപരമായ ആഖ്യാനഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകൾ
  rationale: צֹאן ചെറുകന്നുകാലികളെയും בָקָר കന്നുകാലികളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പതിവായ സംയുക്തപ്രയോഗം പട്ടികയുടെ സ്വാഭാവികത കാക്കുന്നു.
- source_word: חֲמֹרִים
  choice: ആൺകഴുതകൾ
  rationale: തുടർന്നുള്ള אֲתֹנֹת എന്ന പെൺലിംഗപദത്തോടുള്ള വ്യത്യാസം നിലനിർത്താൻ ലിംഗം വ്യക്തമാക്കുന്നു.
- source_word: עֲבָדִים
  choice: അടിമകൾ
  rationale: സ്വത്തുക്കളുടെ പട്ടികയിൽ വരുന്ന ഈ പദത്തിന്റെ ബന്ധിത സാമൂഹികപദവി മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: שְׁפָחֹת
  choice: അടിമസ്ത്രീകൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനവും അടിമസ്ഥിതിയും ഒരുപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲתֹנֹת
  choice: പെൺകഴുതകൾ
  rationale: ഹീബ്രു പദത്തിലെ പെൺലിംഗവിശേഷത ആധുനിക മലയാളത്തിൽ നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: גְמַלִּים
  choice: ഒട്ടകങ്ങൾ
  rationale: പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ മലയാളസമാനപദം.
