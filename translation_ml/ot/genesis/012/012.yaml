id: GEN.12.12
reference: Genesis 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: ml
  text: ഈജിപ്തുകാർ നിന്നെ കാണുമ്പോൾ, ‘ഇവൾ അവന്റെ ഭാര്യയാണ്’ എന്നു പറഞ്ഞ് എന്നെ കൊല്ലുകയും നിന്നെ ജീവനോടെ വിടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …കാണുമ്പോൾ, …ചെയ്യും
  rationale: ഭാവിയിൽ സംഭവിക്കുമെന്ന് അബ്രാം മുൻകൂട്ടി പറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു; വേറൊരു കൃത്രിമമായ ആമുഖവാക്യം ചേർക്കുന്നില്ല.
- source_word: יִרְאוּ אֹתָךְ
  choice: നിന്നെ കാണുമ്പോൾ
  rationale: ראה എന്ന സാധാരണ ദർശനക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; כִּי സഹിതമുള്ള സാഹചര്യകാലബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: הַמִּצְרִים
  choice: ഈജിപ്തുകാർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നിലവാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: וְאָמְרוּ
  choice: എന്നു പറഞ്ഞ്
  rationale: തുടർന്നുണ്ടാകുമെന്ന് പ്രതീക്ഷിക്കുന്ന പ്രവൃത്തികളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ‘പറയും’ എന്ന അർഥം നഷ്ടപ്പെടുന്നില്ല.
- source_word: אִשְׁתּוֹ זֹאת
  choice: ഇവൾ അവന്റെ ഭാര്യയാണ്
  rationale: ശബ്ദക്രമത്തിൽ ‘അവന്റെ ഭാര്യ—ഇവൾ’ എന്ന എബ്രായ നാമവാക്യത്തെ, זאת എന്ന സൂചനാബോധം നിലനിർത്തി, സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהָרְגוּ אֹתִי
  choice: എന്നെ കൊല്ലുകയും
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കൊലപ്പെടുത്തുക’ എന്നതിനെക്കാൾ ഇവിടെ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: നിന്നെ ജീവനോടെ വിടുകയും ചെയ്യും
  rationale: חיה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ജീവിക്കാൻ വിടുക/ജീവനോടെ നിലനിർത്തുക’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; മുൻപുള്ള ‘എന്നെ കൊല്ലും’ എന്നതിനോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി തെളിയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ പ്രവചനാത്മകമായ ക്രിയാശൃംഖല ഒറ്റ സ്വാഭാവിക മലയാളവാക്യമായി നൽകിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായോ സഭാവിഭാഗപരമായോ ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
