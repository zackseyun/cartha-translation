id: GEN.12.18
reference: Genesis 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ അബ്രാമിനെ വിളിച്ച് പറഞ്ഞു: “നീ എന്നോട് ചെയ്ത ഈ കാര്യം എന്താണ്? അവൾ നിന്റെ ഭാര്യയാണെന്ന് നീ എന്നോട് പറയാതിരുന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: קרא എന്ന ക്രിയയ്ക്ക് לְ ചേർന്ന് ഒരാളെ വിളിക്കുക അഥവാ വരുത്തുക എന്ന അർഥമുണ്ട്. സന്ദർഭത്തിന് അനാവശ്യമായ ശക്തി കൂട്ടാതെ സ്വാഭാവികമായി ‘വിളിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കായി മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: לְאַבְרָם
  choice: അബ്രാമിനെ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ക്രിയ ആവശ്യപ്പെടുന്ന കർമവിഭക്തി ചേർത്തു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരായ പരിഭാഷ. തുടർന്ന് ചോദ്യങ്ങൾ വന്നാലും ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: നീ എന്നോട് ചെയ്ത ഈ കാര്യം എന്താണ്?
  rationale: מַה זֹּאת എന്ന പ്രദർശകഭാവവും עָשִׂיתָ לִּי എന്ന വ്യക്തിപരമായ പരാതിയും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: നീ എന്നോട് പറയാതിരുന്നത് എന്തുകൊണ്ട്?
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പറയുക’കൊണ്ട് നൽകി.
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: അവൾ നിന്റെ ഭാര്യയാണെന്ന്
  rationale: כִּי ഇവിടെ വെളിപ്പെടുത്താതിരുന്ന വിവരത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ഹീബ്രു നാമവാക്യത്തിന്റെ വർത്തമാനബന്ധം നിലനിർത്തി.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായി നൽകുന്നു.
