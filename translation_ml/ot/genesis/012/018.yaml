translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. ഫറവോന്റെ ശാസനാഭാവം നിലനിർത്തിയെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത കുറ്റാരോപണഭാഷ ചേർത്തിട്ടില്ല.
