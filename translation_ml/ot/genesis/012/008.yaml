id: GEN.12.8
reference: Genesis 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: ml
  text: അവിടെനിന്ന് അവൻ ബേഥേലിനു കിഴക്കുള്ള മലനാട്ടിലേക്കു നീങ്ങി. പടിഞ്ഞാറ് ബേഥേലും കിഴക്ക് ഹായിയും ആയിരിക്കെ അവൻ തന്റെ കൂടാരം സ്ഥാപിച്ചു. അവിടെ അവൻ യഹോവയ്ക്ക്[a] ഒരു യാഗപീഠം പണിത് യഹോവയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായമൂലത്തിൽ “YHWH”; പരമ്പരാഗതമായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യഹോവയുടെ നാമം പ്രഖ്യാപിച്ചു.” എബ്രായപ്രയോഗത്തിന് ആരാധനയിൽ യഹോവയെ വിളിച്ചപേക്ഷിക്കുക എന്നോ അവന്റെ നാമം പരസ്യമായി പ്രഖ്യാപിക്കുക എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: നീങ്ങി
  rationale: സ്ഥലം മാറിപ്പോകുക എന്ന ക്രിയയുടെ ആഖ്യാനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: הָהָרָה
  choice: മലനാട്ടിലേക്ക്
  rationale: ദിശാസൂചകപ്രത്യയം അവിടേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ബേഥേലിനടുത്തുള്ള വിശാലമായ കുന്നിൻപ്രദേശത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: ബേഥേലിനു കിഴക്കുള്ള
  rationale: קֶדֶם ഇവിടെ ബേഥേലിനെ ആധാരമാക്കിയുള്ള കിഴക്കൻ സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּט אָהֳלֹה
  choice: തന്റെ കൂടാരം സ്ഥാപിച്ചു
  rationale: കൂടാരം നിവർത്തി താമസമുറപ്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: מִיָּם
  choice: പടിഞ്ഞാറ്
  rationale: יָם എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കടൽ’ എന്നുണ്ടെങ്കിലും ദിശാസൂചനയിൽ ഇത് പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהָעַי מִקֶּדֶם
  choice: കിഴക്ക് ഹായി
  rationale: പാളയത്തിന്റെ കിഴക്കുവശത്ത് ഹായി ഉണ്ടായിരുന്നുവെന്ന സ്ഥലവിവരം സമാന്തരഘടനയിൽ നൽകുന്നു.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: യാഗത്തിനും ആരാധനയ്ക്കുമായി ഉപയോഗിച്ചിരുന്ന പീഠത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה വ്യക്തിനാമമായി നേരിട്ട് പകർത്തുന്നു.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  rationale: ആരാധനയിൽ ദൈവനാമം വിളിച്ച് അഭയം തേടുകയോ പ്രാർഥിക്കുകയോ ചെയ്യുന്ന മുഖ്യസന്ദർഭാർഥം നൽകുന്നു; പരസ്യമായി നാമം പ്രഖ്യാപിക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  alternative: യഹോവയുടെ നാമം പ്രഖ്യാപിച്ചു
  rationale: ഈ ആരാധനാസന്ദർഭത്തിൽ ദൈവത്തെ വിളിച്ചപേക്ഷിക്കുക എന്നതാണ് കൂടുതൽ നേരിട്ടുള്ള അർഥം; എന്നാൽ എബ്രായപ്രയോഗത്തിന് പരസ്യപ്രഖ്യാപനം എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ‘ബേഥേൽ’, ‘ഹായി’ എന്നും ദൈവനാമം ‘യഹോവ’ എന്നും നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ഭൂമിശാസ്ത്രസമാന്തരതയും അർഥദ്വയസാധ്യതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
