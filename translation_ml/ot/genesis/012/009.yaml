lexical_decisions:
- source_word: וַיִּסַּע
  choice: യാത്ര തുടർന്നു
  rationale: കാലാൾ പിഴുത് മുന്നോട്ടു യാത്ര ചെയ്യുക എന്ന נסע എന്ന ക്രിയയുടെ അർഥവും ആഖ്യാനത്തിലെ തുടർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പാളയം പിരിച്ചെന്ന വിശദാംശം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: നീങ്ങിക്കൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായോ ക്രമേണയോ നടന്ന യാത്രയെ സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയാസംയോജനത്തിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘ഘട്ടംഘട്ടമായി’ എന്നത് മൂലത്തിൽ ഉറപ്പില്ലാത്ത വിശദീകരണം ചേർക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: הַנֶּגְבָּה
  choice: നെഗെബിലേക്ക്
  rationale: നിർദ്ദേശകപ്രത്യയമുള്ള രൂപം ദിശയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ തെക്കൻ ഭൂപ്രദേശമായ നെഗെബിനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന സാധ്യത ശക്തമായതിനാൽ ഭൂനാമം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
