  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: ml
  text: അബ്രാം നെഗെബിലേക്കു തുടർന്നും യാത്ര ചെയ്തു.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തെക്കോട്ട്.” എബ്രായപദം നെഗെബ് എന്ന തെക്കൻ പ്രദേശത്തെയോ തെക്കുദിശയെയോ സൂചിപ്പിക്കാം; ഇവിടെ പ്രദേശത്തെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: “തുടർന്നും യാത്ര ചെയ്തു” എന്നതിന് “യാത്ര തുടർന്നു, നെഗെബിലേക്കു നീങ്ങിക്കൊണ്ടിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
