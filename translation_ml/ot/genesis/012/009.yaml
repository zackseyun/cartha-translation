revisions:
- from: അബ്രാം യാത്ര തുടർന്നു; നെഗെബിലേക്കു നീങ്ങിക്കൊണ്ടിരുന്നു.[a][b]
  to: അബ്രാം നെഗെബിലേക്കു തുടർന്നും യാത്ര ചെയ്തു.[b][a]
  rationale: The revision retains the narrative movement and the durative/progressive force of הָלוֹךְ וְנָסוֹעַ in a single natural Malayalam clause. It avoids over-specifying travel by stages or camp-breaking, preserves the directional reference to the Negev, and keeps both footnoted alternatives anchored to the relevant wording.
