source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: ml
  text: അബ്രാം തന്റെ ഭാര്യയായ സാറായിയെയും തന്റെ സഹോദരന്റെ മകനായ ലോത്തിനെയും അവർ സമ്പാദിച്ച സകല വസ്തുവകകളെയും ഹാരാനിൽ അവർ നേടിയ ആളുകളെയും[a] കൂട്ടിക്കൊണ്ടു; കനാൻദേശത്തേക്കു പോകാൻ അവർ പുറപ്പെട്ടു, കനാൻദേശത്ത് എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹാരാനിൽ അവർ നേടിയ ആളുകൾ” എന്നതിന് എബ്രായത്തിൽ അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം “ഹാരാനിൽ അവർ ഉണ്ടാക്കിയ ജീവൻ/വ്യക്തികൾ” എന്നാണ്. ഈ എബ്രായ പ്രയോഗം അവിടെ അവർ നേടിയതോ തങ്ങളുടെ വീട്ടുസമൂഹത്തിൽ ചേർത്തതോ ആയ ആളുകളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടു
  rationale: ഈ യാത്രാസന്ദർഭത്തിൽ നേരിട്ടുള്ള കർമങ്ങളോടുകൂടിയ לקח എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ടു’ എന്നു വ്യക്തമാക്കാം.
- source_word: אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ
  rationale: വിവാഹസന്ദർഭത്തിൽ אשה എന്ന പദം പ്രത്യയത്തോടുകൂടി വ്യക്തമായി ‘അവന്റെ ഭാര്യ’ എന്നാണ്; മലയാളത്തിലെ പരാവർത്തനസൂചനയ്ക്കായി ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: בֶּן אָחִיו
  choice: സഹോദരന്റെ മകനായ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചനയായ ‘അവന്റെ സഹോദരന്റെ മകൻ’ എന്ന രൂപം ‘അനന്തരവൻ’ എന്നു പൊതുവാക്കാതെ സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: അവർ സമ്പാദിച്ച സകല വസ്തുവകകളെയും
  rationale: רכוש എന്നത് സ്വത്തുക്കളെയോ വസ്തുവകകളെയോ സൂചിപ്പിക്കുന്നു; רכשׁ എന്ന ക്രിയയുടെ നേടിയെടുക്കൽ എന്ന ആശയം ‘സമ്പാദിച്ച’ എന്നു നൽകുന്നു.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: അവർ നേടിയ ആളുകളെയും
  rationale: נפש ഇവിടെ വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; עשה ഉൾപ്പെടുന്ന ദുഷ്കരമായ പ്രയോഗം വീട്ടംഗങ്ങളായി നേടിയോ ചേർത്തോ ആളുകളെ സൂചിപ്പിക്കാം. അസ്വാഭാവികമായ അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: പോകാൻ അവർ പുറപ്പെട്ടു
  rationale: പുറപ്പെടലും ലക്ഷ്യബോധമുള്ള യാത്രയും ഉൾക്കൊള്ളുന്ന എബ്രായ ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַרְצָה כְּנַעַן
  choice: കനാൻദേശത്തേക്ക്
  rationale: ദിശാസൂചകമായ രൂപവും ‘ദേശം’ എന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנַעַן
  choice: കനാൻദേശത്ത് എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തെത്തിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും എബ്രായത്തിലെ കനാൻദേശത്തിന്റെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘അവർ നേടിയ ആളുകൾ’ എന്ന നിഷ്പക്ഷമായ സാമൂഹിക-ഗൃഹസംബന്ധ അർഥം
  alternative: ‘അവർ ഉണ്ടാക്കിയ ആത്മാക്കൾ’ അല്ലെങ്കിൽ ‘അവർ ചേർത്ത ആളുകൾ’
  rationale: ‘ആത്മാക്കളെ ഉണ്ടാക്കി’ എന്ന അക്ഷരാർഥം തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം; ‘ദാസർ’ എന്നു പ്രത്യേകീകരിക്കാൻ പാഠത്തിൽ മതിയായ തെളിവില്ല. അതിനാൽ ആളുകളെ നേടിയെന്ന വിശാലമായ പ്രയോഗം സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായത്തിലെ ബന്ധസൂചനയും ‘കനാൻദേശം’ എന്ന ആവർത്തനവും നിലനിർത്തി; ദുഷ്കരമായ נפש/עשה പ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
