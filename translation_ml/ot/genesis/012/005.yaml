  to: അബ്രാം തന്റെ ഭാര്യയായ സാറായിയെയും തന്റെ സഹോദരന്റെ മകനായ ലോത്തിനെയും അവർ സമ്പാദിച്ച സകല വസ്തുവകകളെയും ഹാരാനിൽ അവർ നേടിയ ആളുകളെയും[a] കൂട്ടിക്കൊണ്ടു; കനാൻദേശത്തേക്കു പോകാൻ അവർ പുറപ്പെട്ടു, കനാൻദേശത്ത് എത്തി.
  rationale: പ്രധാന വിവർത്തനത്തിന്റെ നിഷ്പക്ഷത നിലനിർത്തിക്കൊണ്ട്, ദുഷ്കരമായ נֶפֶשׁ/עָשׂוּ പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സാദ്ധ്യമായ ഗൃഹസമൂഹ-സൂചനയും അടിക്കുറിപ്പിൽ കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമായി വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അതിന്റെ യഥാർഥ ആങ്കറിലേക്ക് മാറ്റി; അബ്രാമുമായുള്ള ബന്ധസൂചനയും വ്യക്തമാക്കി.
