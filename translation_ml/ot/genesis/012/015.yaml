translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. കർമണിരൂപവും ‘ആ സ്ത്രീ’ എന്ന മൂലപാഠസവിശേഷതയും നിലനിർത്തി; ‘കൊട്ടാരം’ പോലുള്ള വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കി.
