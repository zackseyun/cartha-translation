id: GEN.12.15
reference: Genesis 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: ml
  text: ഫറവോന്റെ ഉദ്യോഗസ്ഥർ അവളെ കണ്ടപ്പോൾ, അവർ ഫറവോനോട് അവളെ പുകഴ്ത്തിപ്പറഞ്ഞു[a]. ആ സ്ത്രീ ഫറവോന്റെ ഭവനത്തിലേക്കു കൊണ്ടുപോകപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഫറവോനോട് അവളെ ശുപാർശ ചെയ്തു” / “അവർ ഫറവോനോട് അവളെക്കുറിച്ച് നല്ലതു പറഞ്ഞു.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ “ഭവനം”; ഇത് കെട്ടിടത്തെ മാത്രമല്ല, ഫറവോന്റെ രാജകീയ ഭവനവ്യവസ്ഥയെയും സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: ഫറവോന്റെ ഉദ്യോഗസ്ഥർ
  rationale: ശָׂרִים എന്ന പദം ഭരണാധികാരികളെയോ ഉന്നത ഉദ്യോഗസ്ഥരെയോ പ്രഭുക്കന്മാരെയോ സൂചിപ്പിക്കാം. രാജസഭയുടെ ഈ പശ്ചാത്തലത്തിൽ, രാജപുത്രന്മാർ എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കി പദവിയും അധികാരവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: അവർ ഫറവോനോട് അവളെ പുകഴ്ത്തിപ്പറഞ്ഞു
  rationale: הלל എന്ന ക്രിയയുടെ പിയേൽ രൂപത്തിന് ഇവിടെ പുകഴ്ത്തുക, അനുകൂലമായി വിവരിക്കുക എന്ന അർഥമാണ്. ഫറവോന്റെ മുമ്പാകെ അവളെ പ്രശംസിച്ചുവെന്ന ആഖ്യാനസന്ദർഭം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וַתֻּקַּח
  choice: കൊണ്ടുപോകപ്പെട്ടു
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും പ്രവർത്തകൻ ആരെന്നു മൂലപാഠം വ്യക്തമാക്കാത്തത് അതേപടി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ഭവനത്തിലേക്കുള്ള നീക്കത്തിന് ‘കൊണ്ടുപോകപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: ഹീബ്രു പാഠം ഇവിടെ ‘സ്ത്രീ’ എന്നു മാത്രമാണ് പറയുന്നത്. ‘ഭാര്യ’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതെ മൂലപാഠത്തിന്റെ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിലേക്ക്
  rationale: בַּיִת എന്നത് വീടിനെയോ ഭവനവ്യവസ്ഥയെയോ സൂചിപ്പിക്കാം. ‘കൊട്ടാരം’ എന്നു നിർണ്ണയിച്ച് വ്യാഖ്യാനിക്കാതെ, dignified Malayalam ആയ ‘ഭവനം’ ഉപയോഗിച്ച് അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: അവളെ കണ്ടപ്പോൾ
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന അർഥം വികസിപ്പിക്കാതെ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
