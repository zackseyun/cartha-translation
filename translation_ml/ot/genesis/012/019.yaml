reference: Genesis 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: ml
  text: “‘അവൾ എന്റെ സഹോദരിയാണ്’ എന്നു നീ പറഞ്ഞതെന്തിന്? അങ്ങനെ ഞാൻ അവളെ എനിക്കു ഭാര്യയായി സ്വീകരിച്ചു.[a] ഇപ്പോൾ ഇതാ, നിന്റെ ഭാര്യ. അവളെ കൂട്ടിക്കൊണ്ടു പോകുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഞാൻ അവളെ എനിക്കായി ഭാര്യയായി എടുത്തു.”'
    reason: ഹീബ്രു לִי לְאִשָּׁה എന്ന ഘടനയുടെ കൂടുതൽ ഔപചാരികമായ രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: നീ പറഞ്ഞതെന്തിന്?
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ കുറ്റപ്പെടുത്തുന്ന സ്വരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲחֹתִי הִוא
  choice: അവൾ എന്റെ സഹോദരിയാണ്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു വാക്യം ഉദ്ധരിച്ച അവകാശവാദമായി വർത്തമാനകാലത്തിൽ നിലനിർത്തുന്നു.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: അങ്ങനെ ഞാൻ അവളെ എനിക്കു ഭാര്യയായി സ്വീകരിച്ചല്ലോ
  rationale: വാവ് സൂചിപ്പിക്കുന്ന സംഭവക്രമവും സന്ദർഭത്തിലെ ഫലബന്ധവും ‘അങ്ങനെ’ വഴി പ്രകടമാക്കുന്നു. ‘എനിക്കു’ എന്നത് לִי-യുടെ വ്യക്തിപരമായ താത്പര്യം നിലനിർത്തുന്നു; ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്നത് വിവാഹബന്ധത്തിലേക്കു കൊണ്ടുവരുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളമാണ്.
- source_word: וְעַתָּה הִנֵּה
  choice: ഇപ്പോൾ ഇതാ
  rationale: ശാസനയിൽനിന്ന് കല്പനയിലേക്കുള്ള മാറ്റവും הִנֵּה എന്ന ശ്രദ്ധാകർഷക പദത്തിന്റെ ദൃശ്യസൂചനയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: קַח וָלֵךְ
  choice: അവളെ കൂട്ടിക്കൊണ്ടു പോകുക
  rationale: രണ്ട് കല്പനകളുടെയും സംയുക്ത അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘അവളെ’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാമിന്റെ വാക്കും ഫറവോന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന പദത്തിലൂടെ ഫലബന്ധം സൂചിപ്പിച്ചു
  alternative: ‘പിന്നെ ഞാൻ’ എന്നു വെറും സംഭവക്രമമായി വിവർത്തനം ചെയ്യുക
  rationale: ഹീബ്രു וָאֶקַּח വ്യാകരണപരമായി തുടർച്ച സൂചിപ്പിച്ചാലും, ഫറവോന്റെ കുറ്റപ്പെടുത്തലിൽ അബ്രാമിന്റെ പ്രസ്താവന തന്റെ നടപടിയിലേക്കു നയിച്ചുവെന്ന ആശയം സന്ദർഭം നൽകുന്നു. ‘അങ്ങനെ’ ഈ ബന്ധം സൂചിപ്പിക്കുന്നു; ഉദ്ദേശ്യബന്ധമായി അതിനെ കടുപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും കഥാസന്ദർഭത്തിലെ രാജകീയ ശാസനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ഭാഷ. ‘സ്വീകരിച്ചു’ എന്നത് ‘എടുത്തു’ എന്ന കഠിന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികമാണ്; അടിക്കുറിപ്പിൽ പദാനുപദസാധ്യത നിലനിർത്തി.
