id: GEN.12.4
reference: Genesis 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: ml
  text: അങ്ങനെ, യഹ്‌വെ അബ്രാമിനോടു പറഞ്ഞതുപോലെ അബ്രാം പോയി; ലോത്തും അവനോടൊപ്പം പോയി. അബ്രാം ഹാരാനിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ അവന് എഴുപത്തഞ്ചു വയസ്സായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപം സാധാരണ ഭൂതകാല ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘പോയി’ എന്നത് സ്വാഭാവികവും മൂലപാഠത്തോട് ചേർന്നതുമാണ്; ‘യാത്ര തിരിച്ചു’ എന്നു പറഞ്ഞാൽ യാത്രയുടെ ആരംഭത്തിന് മൂലപാഠത്തിലില്ലാത്ത ഊന്നൽ വരാം.
- source_word: כַּאֲשֶׁר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: അബ്രാമിന്റെ പ്രവൃത്തി യഹ്‌വെയുടെ മുൻവചനത്തോട് യോജിച്ചിരുന്നുവെന്ന താരതമ്യവും അനുസരണവും ‘പോലെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דִּבֶּר אֵלָיו
  choice: തന്നോടു അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ മാന്യവും സാധാരണ മലയാള ബൈബിൾ ഗദ്യത്തിന് യോജിച്ചതുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു. മുൻപ് നടന്ന വാക്കിനെ സംബന്ധവാക്യരൂപം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: ‘അവനോടുകൂടെ’ എന്നതിനെക്കാൾ ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി കൂട്ടായ സഞ്ചാരം സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: എഴുപത്തഞ്ചു വയസ്സായിരുന്നു
  rationale: ഹീബ്രു പ്രായപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പദാനുപദമായ ‘അഞ്ചും എഴുപതും വർഷങ്ങളുടെ മകൻ’ എന്ന രൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּצֵאתוֹ
  choice: പുറപ്പെടുമ്പോൾ
  rationale: ב ചേർന്ന infinitive construct ഇവിടെ സമയബന്ധം അടയാളപ്പെടുത്തുന്നു. ‘പുറപ്പെടുമ്പോൾ’ ആ ബന്ധവും സ്ഥലവിടലും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מֵחָרָן
  choice: ഹാരാനിൽനിന്നു
  rationale: מִן എന്നതിന്റെ ഉറവിടാർഥം ‘നിന്നു’കൊണ്ട് നേരിട്ട് നൽകുകയും സ്ഥലനാമം മലയാളത്തിൽ ‘ഹാരാൻ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിപരമായ ദൈവനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു. ‘യഹ്‌വെ’ ലഭ്യമായ ശാസ്ത്രീയ പുനർനിർമാണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവിക സംസാരത്തിന് യോജിച്ച ഔന്നത്യം നൽകുന്നു; ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന രീതിയിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
