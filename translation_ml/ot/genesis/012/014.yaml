source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: ml
  text: അബ്രാം ഈജിപ്തിൽ പ്രവേശിച്ചപ്പോൾ, ആ സ്ത്രീ അതിസുന്ദരിയാണെന്ന് ഈജിപ്തുകാർ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ഭാര്യ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ אִשָּׁה എന്ന പദത്തിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം; ഇവിടെ മൂലവാക്യത്തിലെ പൊതുവായ പദപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: പ്രവേശിച്ചപ്പോൾ
  rationale: היה എന്ന ആഖ്യാനസൂത്രവും כְּ ചേർന്ന ക്രിയാനാമവും അടുത്ത സംഭവം സംഭവിച്ച സമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രവേശിച്ചപ്പോൾ’ എന്നത് സ്വാഭാവികമായി ആ സമയബന്ധവും ഈജിപ്തിലേക്കുള്ള പ്രവേശനവും അറിയിക്കുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിൽ
  rationale: ദിശാസൂചകമായ ה ഈജിപ്തിലേക്കുള്ള ചലനത്തെ കാണിക്കുന്നു; ‘പ്രവേശിക്കുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്ഥലസൂചകമായ ‘ഈജിപ്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיִּרְאוּ
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; ‘ശ്രദ്ധിച്ചു’ എന്നതിനെക്കാൾ വ്യാഖ്യാനം കുറവാണ്.
- source_word: הַמִּצְרִים
  choice: ഈജിപ്തുകാർ
  rationale: നിശ്ചിത ബഹുവചന ജനവിഭാഗനാമത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: אִשָּׁה എന്ന പദത്തിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഈ വാക്യത്തിലെ പൊതുവായ പദപ്രയോഗം നിലനിർത്താൻ ‘ആ സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: יָפָה
  choice: സുന്ദരി
  rationale: ശാരീരിക സൗന്ദര്യത്തെ സൂചിപ്പിക്കുന്ന വിശേഷണത്തിന് വ്യക്തവും ആധുനികവുമായ മലയാളപദം.
- source_word: הִוא
  choice: ആണ്
  rationale: ഹീബ്രു നാമവാക്യത്തിലെ സ്ത്രീലിംഗ ഏകവചന സർവനാമത്തിന്റെ പങ്ക് മലയാളത്തിലെ ഉദ്ധരണഘടനയിൽ ‘ആണ്’ എന്ന കോപ്പുല സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: מְאֹד
  choice: അതി-
  rationale: വിശേഷണത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന מְאֹד എന്ന പദം ‘അതിസുന്ദരി’ എന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
