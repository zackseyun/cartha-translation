id: GEN.12.11
reference: Genesis 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: ml
  text: 'അവൻ ഈജിപ്തിലേക്കു പ്രവേശിക്കാൻ അടുത്തപ്പോൾ തന്റെ ഭാര്യ സാറായിയോടു പറഞ്ഞു: “നോക്കൂ, നീ കാഴ്ചയിൽ സുന്ദരിയായ സ്ത്രീയാണെന്ന് എനിക്കറിയാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാണാൻ സുന്ദരിയായ സ്ത്രീ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: അവൻ ... പ്രവേശിക്കാറായപ്പോൾ
  rationale: ഇവിടെ וַיְהִי തുടർന്നുള്ള സംഭവത്തെ അവതരിപ്പിക്കുന്ന ആഖ്യാനരൂപമാണ്; כַּאֲשֶׁר കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ രണ്ടും ചേർത്ത് സ്വാഭാവികമായ കാലവാക്യമായി നൽകി.
- source_word: הִקְרִיב לָבוֹא
  choice: പ്രവേശിക്കാറായപ്പോൾ
  rationale: קרב എന്ന ഹിഫീൽ രൂപവും בוא എന്ന ക്രിയാനാമവും ചേർന്ന് പ്രവേശനം അടുത്തെത്തിയതും ഉടൻ സംഭവിക്കാനിരിക്കുന്നതും സൂചിപ്പിക്കുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള ദിശാസൂചകപ്രത്യയം ഈജിപ്തിലേക്കുള്ള നീക്കം കാണിക്കുന്നു; ‘പ്രവേശിക്കുക’ എന്ന മലയാളക്രിയയോടൊപ്പം ‘ഈജിപ്തിൽ’ സ്വാഭാവികമാണ്.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യ സാറായിയോടു
  rationale: സാറായി എന്ന വ്യക്തിനാമവും അവളുടെ ഭാര്യാഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
- source_word: הִנֵּה נָא
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭാഷണത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന സംയുക്തപ്രയോഗം; പുരാതനശൈലിയില്ലാതെ സംഭാഷണസഹജമായി നൽകി.
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: പൂർണ്ണക്രിയാരൂപം ഇവിടെ ഇപ്പോഴത്തെ അറിവിന്റെ നില സൂചിപ്പിക്കുന്നു.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: നീ കാഴ്ചയിൽ സുന്ദരിയായ സ്ത്രീയാണ്
  rationale: אִשָּׁה എന്നത് ഇവിടെ വൈവാഹികപദവിയേക്കാൾ സ്ത്രീയെന്ന അർഥത്തിലാണ്; יְפַת מַרְאֶה ദൃശ്യമായ സൗന്ദര്യത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായ കാലവാക്യത്തിലൂടെ അറിയിച്ചു; ‘ഇതാ’ പോലുള്ള അല്പം ഔപചാരികമായ രൂപത്തിനു പകരം സംഭാഷണസഹജമായ ‘നോക്കൂ’ ഉപയോഗിച്ചു.
