revisions:
- from: 'അവൻ ഈജിപ്തിൽ പ്രവേശിക്കാറായപ്പോൾ തന്റെ ഭാര്യ സാറായിയോടു പറഞ്ഞു: “നോക്കൂ, നീ കാഴ്ചയിൽ സുന്ദരിയായ സ്ത്രീയാണെന്ന് എനിക്കറിയാം.[a]”'
  to: 'അവൻ ഈജിപ്തിലേക്കു പ്രവേശിക്കാൻ അടുത്തപ്പോൾ തന്റെ ഭാര്യ സാറായിയോടു പറഞ്ഞു: “നോക്കൂ, നീ കാഴ്ചയിൽ സുന്ദരിയായ സ്ത്രീയാണെന്ന് എനിക്കറിയാം.”[a]'
