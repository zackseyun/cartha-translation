id: GEN.39.13
reference: Genesis 39:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: ml
  text: അവൻ തന്റെ വസ്ത്രം അവളുടെ കൈയിൽ ഉപേക്ഷിച്ച് പുറത്തേക്ക് ഓടിപ്പോയെന്ന് അവൾ കണ്ടപ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ കാലവാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ וַיְהִי ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ ‘...കണ്ടപ്പോൾ’ എന്ന ഘടന തന്നെ ആ പ്രവർത്തനം നിർവഹിക്കുന്നു.
- source_word: כִּרְאוֹתָהּ
  choice: അവൾ കണ്ടപ്പോൾ
  rationale: כְּ + infinitive construct + 3fs suffix ഇവിടെ കാലസംബന്ധമായ അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗമാണിത്.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവൾ കണ്ടതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഘടകമായി മലയാളത്തിൽ ‘എന്ന്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָזַב
  choice: ഉപേക്ഷിച്ച്
  rationale: ഇവിടെ വസ്ത്രം അവളുടെ കൈയിൽ വിട്ടുപോയെന്ന ആശയം വ്യക്തമാക്കുന്നു. ‘വിട്ട്’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ മനഃപൂർവമായ വിട്ടൊഴിയൽ ‘ഉപേക്ഷിച്ച്’ വ്യക്തമാക്കുന്നു; ‘ത്യജിച്ച്’ അനാവശ്യമായി ഉയർന്ന ശൈലിയാകും.
- source_word: בִּגְדוֹ
  choice: തന്റെ വസ്ത്രം
  rationale: בגד പൊതുവായി വസ്ത്രമോ ഉടുപ്പോ സൂചിപ്പിക്കുന്നു; ‘മേലങ്കി’ എന്നു പ്രത്യേകവൽക്കരിക്കാൻ എബ്രായപദം നിർബന്ധിക്കുന്നില്ല. വിഷയം യോസേഫായതിനാൽ മലയാളത്തിൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: בְּיָדָהּ
  choice: അവളുടെ കൈയിൽ
  rationale: മൂലപാഠത്തിലെ സാക്ഷാൽ ദൃശ്യബിംബം കൃത്യമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയെന്ന്
  rationale: נוס അടിയന്തരമായി രക്ഷപ്പെടുന്നതിനെയോ ഓടിപ്പോകുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ‘ഓടിപ്പോയി’ സ്വാഭാവികമാണ്; സന്ദർഭം രക്ഷപ്പെടലിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הַחוּצָה
  choice: പുറത്തേക്ക്
  rationale: directional ה സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള ചലനം ‘പുറത്തേക്ക്’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന കാലവാക്യമായതിനാൽ അവസാനം കോമ നിലനിർത്തി. ‘വസ്ത്രം’ എന്ന പൊതുപദം ഉപയോഗിച്ച് മൂലത്തിലെ lexical breadth സംരക്ഷിച്ചു; പ്രത്യേക അടിക്കുറിപ്പ് അനിവാര്യമല്ല.
