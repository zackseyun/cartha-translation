base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Joseph and said, “Lie with me.”
translation:
  language: ml
  text: ഈ സംഭവങ്ങൾക്കുശേഷം, അവന്റെ യജമാനന്റെ ഭാര്യ യോസേഫിന്റെമേൽ കണ്ണുവെച്ചു[a]. അവൾ അവനോട്, “എന്നോടുകൂടെ ശയിക്കുക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘യോസേഫിലേക്കു തന്റെ കണ്ണുകൾ ഉയർത്തി’; ഇവിടെ മോഹത്തോടെയുള്ള കേന്ദ്രീകൃത ശ്രദ്ധയെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവവികാസത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം. പദാനുപദമായ ‘ഈ കാര്യങ്ങൾക്കുശേഷം’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ഈ സംഭവങ്ങൾക്കുശേഷം’ അർഥം നൽകുന്നു.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: യോസേഫിന്റെമേൽ കണ്ണുവെച്ചു
  rationale: അക്ഷരാർഥം ‘യോസേഫിലേക്കു തന്റെ കണ്ണുകൾ ഉയർത്തി’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് വെറും നോട്ടമല്ല, മോഹത്തോടെയുള്ള കേന്ദ്രീകൃത ശ്രദ്ധയാണ്; മലയാളത്തിലെ ‘കണ്ണുവെച്ചു’ എന്ന പ്രയോഗം അതു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: അവന്റെ യജമാനന്റെ ഭാര്യ
  rationale: സ്ത്രീയെ യോസേഫിന്റെ യജമാനനോടുള്ള ബന്ധത്തിലൂടെ തിരിച്ചറിയുന്ന എബ്രായ സംയുക്തപ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: שִׁכְבָה עִמִּי
  choice: എന്നോടുകൂടെ ശയിക്കുക
  rationale: നേരിട്ടുള്ള ലൈംഗിക ക്ഷണമാണ്. ‘ശയിക്കുക’ മൂലത്തിലെ ‘കിടക്കുക’ എന്ന ക്രിയയോടു ചേർന്നുനിൽക്കുകയും സന്ദർഭത്തിലെ ലൈംഗിക അർഥം മാന്യമായും വ്യക്തമായും അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ത്രീയുടെ ഉദ്ദേശ്യം സന്ദർഭം വ്യക്തമാക്കുന്നതുപോലെ സൂചിപ്പിച്ചെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
