  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: ml
  text: 'എന്നാൽ അവൻ വിസമ്മതിച്ച് തന്റെ യജമാനന്റെ ഭാര്യയോടു പറഞ്ഞു: “നോക്കൂ, വീട്ടിൽ എന്താണുള്ളതെന്ന് എന്റെ യജമാനൻ ശ്രദ്ധിക്കുന്നില്ല[a]; തനിക്കുള്ളതെല്ലാം അദ്ദേഹം എന്റെ കൈയിൽ തന്നിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്നോടൊപ്പം അറിയുന്നില്ല.” വീട്ടിലെ കാര്യങ്ങൾ യോസേഫിന്റെ മേൽനോട്ടത്തിൽ വിട്ടതിനാൽ യജമാനൻ അവയെക്കുറിച്ച് ശ്രദ്ധിക്കുകയോ ഇടപെടുകയോ ചെയ്യുന്നില്ല എന്ന അർഥമുള്ള പ്രയോഗമാണിത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു.” ഹീബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ കൈയിൽ തന്നിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: എന്നാൽ അവൻ വിസമ്മതിച്ച്
  rationale: മുൻവാക്യത്തിലെ പ്രലോഭനത്തോടുള്ള യോസേഫിന്റെ എതിർപ്പ് സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ וַ־യ്ക്ക് വൈരുധ്യസൂചകമായ ‘എന്നാൽ’ നൽകി; מָאֵן എന്ന ക്രിയയുടെ നിരാകരണഭാവം ‘വിസമ്മതിച്ചു’ കൃത്യമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ ഭാര്യയോടു പറഞ്ഞു
  rationale: ഹീബ്രായ സംയുക്തബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; אֲדֹנָיו വീട്ടിലെ അധികാരബന്ധത്തിൽ ‘തന്റെ യജമാനൻ’ എന്നാണ്.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന വാക്കുകളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരധർമ്മം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יָדַע אִתִּי
  choice: എന്നോടു അന്വേഷിക്കാറില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘എന്നോടൊപ്പം അറിയുന്നില്ല’ മലയാളത്തിൽ അവ്യക്തമാണ്. വീട്ടുകാര്യങ്ങൾ യോസേഫിന്റെ മേൽനോട്ടത്തിൽ വിട്ടതിനാൽ യജമാനൻ അവയെക്കുറിച്ച് പരിശോധിക്കുകയോ അന്വേഷിക്കുകയോ ചെയ്യുന്നില്ല എന്ന സന്ദർഭാർഥം നൽകുന്നു; അടിയുറപ്പിലുള്ള അക്ഷരാർഥം കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מַה בַּבָּיִת
  choice: വീട്ടിലുള്ള കാര്യങ്ങളെക്കുറിച്ച്
  rationale: വീട്ടിനകത്തെ വസ്തുക്കൾ മാത്രമല്ല, വീട്ടുകാര്യങ്ങളും സ്വത്തും ഉൾക്കൊള്ളാവുന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: തനിക്കുള്ളതെല്ലാം
  rationale: യജമാനന്റെ സമസ്ത ഉടമസ്ഥതയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: נָתַן בְּיָדִי
  choice: എന്റെ കൈയിൽ തന്നിരിക്കുന്നു
  rationale: അധികാരവും ചുമതലയും ഏൽപ്പിക്കുക എന്ന ഹീബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ മുഖ്യവാചകത്തിൽ നിലനിർത്തി; വ്യക്തമായ അർഥം കുറിപ്പിൽ നൽകുന്നു.
