translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. യജമാനൻ–ദാസൻ എന്ന സാമൂഹികബന്ധം ‘യജമാനൻ’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. മുഖ്യവാചകം ഹീബ്രായ പ്രയോഗങ്ങളുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; അവയുടെ അക്ഷരാർഥവും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
