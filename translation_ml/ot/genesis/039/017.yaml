  to: 'അപ്പോൾ അവൾ അവനോട് ഇപ്രകാരം പറഞ്ഞു: “നീ ഞങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുവന്ന ആ എബ്രായ അടിമ എന്നെ പരിഹസിക്കാനായി എന്റെ അടുക്കൽ വന്നു.[a]”'
