source:
  edition: WLC
  text: וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו כַּ/דְּבָרִ֥ים הָ/אֵ֖לֶּה לֵ/אמֹ֑ר בָּֽא אֵלַ֞/י הָ/עֶ֧בֶד הָֽ/עִבְרִ֛י אֲשֶׁר הֵבֵ֥אתָ לָּ֖/נוּ לְ/צַ֥חֶק בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ അവനോട് ഇപ്രകാരം പറഞ്ഞു: “നീ ഞങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുവന്ന ആ എബ്രായ അടിമ എന്നെ പരിഹസിക്കാനായി എന്റെ അടുക്കൽ വന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ കളിയാക്കാൻ”; സന്ദർഭത്തിൽ ഇതിന് ലൈംഗികമോ അധിക്ഷേപപരമോ ആയ സൂചന ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: പിന്നെ അവൾ അവനോട് ... സംസാരിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; പുരുഷലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിലെ ഭർത്താവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു.
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: 'ഇതേ രീതിയിൽ സംസാരിച്ചു:'
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: ആ എബ്രായ അടിമ
  rationale: עבד ഇവിടെ ബന്ധിതമായ ഗൃഹദാസ്യപദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ മൃദുവായ ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമായി നൽകുന്നു; הָעִבְרִי വംശീയ വിശേഷണമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: നീ നമ്മുടെ അടുക്കൽ കൊണ്ടുവന്ന
  rationale: ഭർത്താവിനെ കുറ്റപ്പെടുത്തുന്ന അവളുടെ വാക്കുകളുടെ ഭാവവും ഒന്നാംപുരുഷ ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: בָּא אֵלַי
  choice: എന്റെ അടുക്കൽ വന്നു
  rationale: בוא + אל എന്നത് അവളുടെ ദിശയിലേക്കുള്ള വരവാണ് സൂചിപ്പിക്കുന്നത്; മൂലത്തിൽ ഉള്ളതിലധികം ലൈംഗിക സൂചന ചേർക്കുന്നില്ല.
- source_word: לְצַחֶק בִּי
  choice: എന്നെ പരിഹസിക്കാൻ
  rationale: צחק എന്ന പദത്തിന്റെ പരിഹാസപരമായ ബലം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ ലൈംഗികമോ അധിക്ഷേപപരമോ ആയ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
