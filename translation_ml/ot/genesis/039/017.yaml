translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആരോപണത്തിന്റെ അസ്പഷ്ടത മുഖ്യവാചകത്തിൽ അതിവ്യക്തമാക്കാതെ അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
