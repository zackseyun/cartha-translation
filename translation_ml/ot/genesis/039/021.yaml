  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെ യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു. അവിടുന്ന് അവനോട് അചഞ്ചലമായ സ്നേഹം[a] കാണിക്കുകയും കാരാഗൃഹാധിപന്റെ ദൃഷ്ടിയിൽ അവന് പ്രീതി നൽകുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തസ്നേഹം” അഥവാ “ദയ.” എബ്രായത്തിലെ חָסֶד എന്ന പദം സ്ഥിരതയുള്ള, വിശ്വസ്തമായ സ്നേഹത്തെയും കരുണയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיְהִי ... אֶת
  choice: യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: സാന്നിധ്യവും കൂട്ടായ്മയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: חָסֶד
  choice: അചഞ്ചലമായ സ്നേഹം
  rationale: ഈ സന്ദർഭത്തിൽ വെറും ദയയെക്കാൾ വിശ്വസ്തവും നിലനിൽക്കുന്നതുമായ സ്നേഹപൂർവക അനുഗ്രഹമാണ് പദം സൂചിപ്പിക്കുന്നത്; ഔപചാരികമായ ഒരു ഉടമ്പടി ഇവിടെ വ്യക്തമായി പരാമർശിക്കാത്തതിനാൽ ‘ഉടമ്പടി വിശ്വസ്തത’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിപ്പറഞ്ഞില്ല.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: അവനോട് അചഞ്ചലമായ സ്നേഹം കാണിച്ചു
  rationale: נָטָה എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ‘നീട്ടുക/ചായിക്കുക’ എന്നാണെങ്കിലും, ഈ പദസമുച്ചയം ഒരാളോട് സ്നേഹപൂർവമായ വിശ്വസ്തത പ്രകടിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘കാണിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: חִנּוֹ
  choice: അവന് പ്രീതി
  rationale: חֵן ഇവിടെ മറ്റൊരാളുടെ അനുകൂലമായ അംഗീകാരത്തെയും മനോഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘പ്രീതി’ ഈ ഭരണപരമായ സന്ദർഭത്തിൽ യോജിക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ’ എന്ന എബ്രായ ഭാഷാശൈലിയുടെ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: കാരാഗൃഹാധിപൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘തടവറയുടെ തലവൻ’ എന്ന പദസമുച്ചയത്തെ, പദവിയും ചുമതലയും വ്യക്തമായി അറിയിക്കുന്ന സമകാലിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ യോസേഫിന്റെ തടവിലാക്കലിനും ഇവിടെ വിവരിക്കുന്ന യഹ്‌വെയുടെ സാന്നിധ്യത്തിനും ഇടയിലെ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חָסֶד എന്ന പദത്തിലെ ദൈവിക വിശ്വസ്തസ്നേഹം
  choice: അചഞ്ചലമായ സ്നേഹം
  alternative: ഉടമ്പടിപരമായ വിശ്വസ്തത; വിശ്വസ്തസ്നേഹം; ദയ
  rationale: പദത്തിന്റെ സ്ഥിരതയും ബന്ധപരമായ വിശ്വസ്തതയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ ഔപചാരിക ഉടമ്പടി നേരിട്ട് പറയാത്തതിനാൽ അതിനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല. പ്രധാന പദവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ ആധുനിക മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിന്റെ ആവർത്തിച്ച ‘വ-’ ഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; അർഥബന്ധം നിലനിർത്തി. ‘കാരാഗൃഹാധിപൻ’ സമകാലിക വായനക്കാർക്ക് വ്യക്തമായ പദവിനാമമാണ്.
