  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ തന്റെ വീട്ടിലെ പുരുഷന്മാരെ വിളിച്ച് അവരോടു പറഞ്ഞു: “നോക്കൂ, നമ്മെ കളിയാക്കാൻ അവൻ ഒരു എബ്രായനായ പുരുഷനെ നമ്മുടെ അടുക്കൽ കൊണ്ടുവന്നിരിക്കുന്നു.[a] അവൻ എന്നോടുകൂടെ കിടക്കാൻ എന്റെ അടുക്കൽ വന്നു; ഞാൻ ഉച്ചത്തിൽ വിളിച്ചുകൂവി.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നമ്മെ പരിഹസിക്കാൻ,” “നമ്മെ കളിയാക്കാൻ,” അല്ലെങ്കിൽ “നമ്മോടു അപമാനകരമായി പെരുമാറാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ഈ അർഥവ്യാപ്തിയുണ്ട്; ഈ ആരോപണത്തിന്റെ സന്ദർഭത്തിൽ ലൈംഗിക അപമാനത്തിന്റെ സൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വലിയ ശബ്ദത്തിൽ ഞാൻ വിളിച്ചു.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: അപ്പോൾ അവൾ തന്റെ വീട്ടിലെ പുരുഷന്മാരെ വിളിച്ച്
  rationale: വַ തുടർന്നുള്ള കഥാക്രമം സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. אַנְשֵׁי എന്നതിന്റെ പുരുഷലിംഗ ബഹുവചന അർഥം ‘പുരുഷന്മാർ’ എന്നു വ്യക്തമാക്കുന്നു; בֵיתָהּ ഇവിടെ വീട്ടിലെ ആളുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: അദ്ദേഹം ഒരു എബ്രായപുരുഷനെ നമ്മുടെ അടുക്കൽ കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: הֵבִיא എന്ന കാരണക ക്രിയയുടെ ‘കൊണ്ടുവരുക’ എന്ന അർഥവും לָנוּ എന്നതിലെ കൂട്ടായ അഭിസംബോധനയും നിലനിർത്തുന്നു. ഭർത്താവിനെപ്പറ്റിയുള്ള പരാമർശമായതിനാൽ ‘അദ്ദേഹം’ സ്വാഭാവികമാണ്.
- source_word: לְצַחֶק בָּנוּ
  choice: നമ്മെ പരിഹാസപാത്രമാക്കാൻ
  rationale: צחק ഇവിടെ പരിഹസിക്കുക, കളിയാക്കുക, അപമാനകരമായി പെരുമാറുക എന്നീ അർഥവ്യാപ്തിയുള്ളതാണ്. സന്ദർഭത്തിലെ ലൈംഗിക അപമാനസൂചന നിർബന്ധമായി ഒരൊറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: അവൻ എന്നോടുകൂടെ കിടക്കാൻ എന്റെ അടുക്കൽ വന്നു
  rationale: ‘കൂടെ കിടക്കുക’ എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ ഔപചാരികസമീപമായ മലയാളരൂപമാണ്; ‘എന്റെ അടുക്കൽ വന്നു’ בָּא אֵלַיയെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: അപ്പോൾ ഞാൻ ഉറക്കെ നിലവിളിച്ചു
  rationale: അപകടസന്ദർഭത്തിൽ קראയ്ക്ക് ‘നിലവിളിച്ചു’ സ്വാഭാവികമാണ്; בְּקוֹל גָּדוֹל എന്നത് ‘ഉറക്കെ’ എന്നായി സുതാര്യമായി നൽകുന്നു. വַയെ അനാവശ്യമായ വിരോധസൂചനയില്ലാതെ കഥാക്രമമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: לְצַחֶק בָּנוּ എന്ന പ്രയോഗത്തിന്റെ ലൈംഗികവും അപമാനപരവുമായ അർഥവ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘നമ്മെ പരിഹാസപാത്രമാക്കാൻ’ എന്നും അടിക്കുറിപ്പിൽ മറ്റ് സാധ്യതകളും നൽകുന്നു
  alternative: ‘നമ്മെ ലൈംഗികമായി അപമാനിക്കാൻ’
  rationale: മൂലക്രിയയ്ക്ക് പരിഹാസം, കളിയാക്കൽ, ദുരുപയോഗം തുടങ്ങിയ വ്യാപ്തിയുണ്ട്. സന്ദർഭം ലൈംഗിക ആരോപണമാണെങ്കിലും മൂലത്തിലെ അർഥവ്യാപ്തി ചുരുക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ആരോപണത്തിലെ നാടകീയത നിലനിർത്തിയെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
