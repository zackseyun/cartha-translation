source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Joseph day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: ml
  text: അവൾ യോസേഫിനോടു ദിവസംതോറും സംസാരിച്ചുകൊണ്ടിരുന്നെങ്കിലും, അവൻ അവൾ പറയുന്നതിനോടു വഴങ്ങി അവളുടെ അരികിൽ കിടക്കാനോ[a] അവളോടൊപ്പം ആയിരിക്കാനോ തയ്യാറായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളോടൊപ്പം കിടക്കാനോ.’ ഇവിടെ ‘കിടക്കുക’ എന്ന ഹീബ്രായ ക്രിയയ്ക്ക് ലൈംഗികബന്ധത്തിന്റെ അർഥവും വരാം. ‘അവളുടെ അരികിൽ കിടക്കുക’ എന്ന പരിഭാഷ മൂലപദങ്ങളുടെ സ്ഥലസംബന്ധമായ ഭാവം നിലനിർത്തുകയും പിന്നാലെയുള്ള ‘അവളോടൊപ്പം ആയിരിക്കുക’ എന്ന പ്രയോഗത്തിന്റെ പ്രത്യേക ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: പറഞ്ഞുകൊണ്ടിരുന്നിട്ടും
  rationale: വַיְהִי എന്ന ആഖ്യാനരൂപവും כְּ എന്ന കാലസൂചക ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായ ഒരു തുടർച്ചാവാക്യമായി ചേർത്തിരിക്കുന്നു. יוֹם יוֹם നൽകുന്ന ആവർത്തനഭാവം കണക്കിലെടുത്ത് ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു നൽകി; സന്ദർഭത്തിലെ വിരുദ്ധഫലം വ്യക്തമാക്കാൻ ‘-ിട്ടും’ ഉപയോഗിച്ചു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്കിടയിൽ സുപരിചിതവും ഹീബ്രായ പേരിനോട് അടുത്തതുമായ രൂപം.
- source_word: יוֹם יוֹם
  choice: ദിവസംതോറും
  rationale: നാമത്തിന്റെ ആവർത്തനം സൂചിപ്പിക്കുന്ന നിരന്തരമായ ദൈനംദിന സമ്മർദം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שָׁמַע אֵלֶיהָ
  choice: അവളുടെ വാക്കു കേട്ട് … കൂട്ടാക്കിയില്ല
  rationale: ഇവിടെ שׁמע എന്നത് കേൾക്കുക എന്നതിലുപരി പറയുന്നതിന് വഴങ്ങുക/ചെവികൊടുക്കുക എന്ന അർഥം വഹിക്കുന്നു. ‘വാക്കു കേട്ട് … കൂട്ടാക്കിയില്ല’ ആ നിരാകരണം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: അവളുടെ അരികിൽ കിടക്കാൻ
  rationale: אֵצֶל എന്നതിന്റെ സ്ഥലസംബന്ധമായ ‘അരികിൽ’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശയിക്കുക എന്ന ക്രിയയ്ക്കുള്ള ലൈംഗിക സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִהְיוֹת עִמָּהּ
  choice: അവളോടൊപ്പം ഇരിക്കാൻ
  rationale: ലൈംഗിക പ്രവൃത്തിയിൽ മാത്രം ഒതുക്കാതെ അവളുടെ സാന്നിധ്യത്തിൽ തുടരുന്നതിനെയും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ היה עם എന്ന വിശാലപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായ വാക്യത്തിന്റെ ആവർത്തനഭാവവും യോസേഫിന്റെ തുടർച്ചയായ നിരാകരണവും സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; ലൈംഗിക സൂചന മുഖ്യവാചകത്തിൽ അതിവ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
