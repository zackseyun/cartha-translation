  text: So she kept his garment beside her until his master came home.
translation:
  language: ml
  text: അങ്ങനെ, അവന്റെ യജമാനൻ വീട്ടിലെത്തുന്നതുവരെ അവൾ അവന്റെ വസ്ത്രം തന്റെ അരികിൽ വെച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: വെച്ചിരുന്നു
  rationale: ഹീബ്രായ ക്രിയയുടെ ‘വെക്കുക/വച്ചേക്കുക’ എന്ന അർഥവും, യജമാനൻ വരുന്നതുവരെ വസ്ത്രം അവളുടെ കൈവശം തുടർന്നുവെന്ന സന്ദർഭസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בִּגְדוֹ
  choice: അവന്റെ വസ്ത്രം
  rationale: בֶּגֶד എന്ന പദത്തിന്റെ പൊതുവായ അർഥമായ ‘വസ്ത്രം’ നിലനിർത്തുന്നു; ഏതു പ്രത്യേക വസ്ത്രമാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: אֶצְלָהּ
  choice: തന്റെ അരികിൽ
  rationale: ‘അവളുടെ സമീപത്ത്/കൈവശം’ എന്ന സ്ഥല-കൈവശ സൂചന സംരക്ഷിക്കുന്നു; മലയാളത്തിലെ പ്രത്യാവർത്തക പ്രയോഗം കർത്താവായ സ്ത്രീയിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עַד בּוֹא אֲדֹנָיו
  choice: അവന്റെ യജമാനൻ ... വരുന്നതുവരെ
  rationale: ‘അവന്റെ യജമാനന്റെ വരവ് വരെ’ എന്ന ഹീബ്രായ ഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ കാലവാക്യമായി നൽകുന്നു.
- source_word: אֶל־בֵּיתוֹ
  choice: വീട്ടിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ വീട്ടിലേക്കു/വീട്ടിനകത്തേക്ക്’ എന്ന ആശയം മലയാളത്തിൽ ‘വീട്ടിൽ വരുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു; ‘വീട്ടിലെത്തി’ എന്നും സാധ്യമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠം പറയാത്ത വസ്ത്രത്തിന്റെ തരം, സ്ത്രീയുടെ ഉദ്ദേശ്യം തുടങ്ങിയ വിവരങ്ങൾ ചേർത്തിട്ടില്ല.
