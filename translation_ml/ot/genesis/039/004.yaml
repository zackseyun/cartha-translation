translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ സർവനാമക്രമം സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും കർമസ്ഥാനത്ത് ‘യോസേഫിനെ’ ആവർത്തിച്ച് അനാവശ്യമായ മലയാളസർവനാമക്കുഴപ്പം കുറച്ചു. മൂലത്തിലെ ‘ദൃഷ്ടി’, ‘വീട്’, ‘കൈ’ എന്നീ പ്രധാന രൂപങ്ങൾ സംരക്ഷിച്ചു.
