  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: ml
  text: യോസേഫിന് അവന്റെ പ്രീതി ലഭിച്ചു; അവൻ അവനെ ശുശ്രൂഷിച്ചു. അവൻ യോസേഫിനെ തന്റെ വീട്ടുകാര്യങ്ങളുടെ മേൽനോട്ടക്കാരനായി[a] നിയമിക്കുകയും തനിക്കുള്ളതെല്ലാം അവന്റെ കൈയിൽ[b] ഏൽപ്പിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘വീട്’ എന്നത് കെട്ടിടം മാത്രമല്ല, കുടുംബഗൃഹത്തെയും അതിന്റെ കാര്യനിർവഹണത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ കൈയിൽ’ എന്നത് യോസേഫിന്റെ അധികാരത്തിനും പരിപാലനത്തിനും കീഴിൽ ഏൽപ്പിച്ചു എന്നർത്ഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: അവന്റെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചു
  rationale: ‘ഒരാളുടെ ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: അവനെ ശുശ്രൂഷിച്ചു
  rationale: ഇവിടെ שׁרת യജമാനനോടുള്ള വ്യക്തിപരമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു; ‘ശുശ്രൂഷിച്ചു’ ഗൗരവമുള്ളതും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: യോസേഫിനെ തന്റെ വീട്ടിന്മേൽ അധികാരിയായി നിയമിച്ചു
  rationale: פקד എന്ന ക്രിയയുടെ ഭരണപരമായ നിയമനവും മേൽനോട്ടാധികാരവും വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ സർവനാമക്കുഴപ്പം കുറയ്ക്കാൻ കർമസ്ഥാനത്ത് ‘യോസേഫിനെ’ ആവർത്തിച്ചു; കർത്താവായ ‘അവൻ’ എന്ന മൂലരൂപം നിലനിർത്തി.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്ടിന്മേൽ
  rationale: ‘വീട്’ എന്നത് കെട്ടിടം മാത്രമല്ല, കുടുംബഗൃഹവും അതിന്റെ കാര്യനിർവഹണവും ഉൾക്കൊള്ളാം; മുഖ്യപാഠത്തിൽ മൂലപദത്തിന്റെ രൂപം നിലനിർത്തി കുറിപ്പിൽ വ്യാപ്തി വ്യക്തമാക്കി.
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: തനിക്കുള്ളതെല്ലാം
  rationale: പോത്തീഫറിന്റെ സമ്പത്തും ഉടമസ്ഥതയിലുള്ള സകലവും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: נָתַן בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ ഏൽപ്പിച്ചു
  rationale: അധികാരത്തിനും പരിപാലനത്തിനുമായി കൈമാറുക എന്ന എബ്രായ ശൈലിയിലെ ‘കൈ’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘ഏൽപ്പിച്ചു’ ഉദ്ദേശ്യാർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
