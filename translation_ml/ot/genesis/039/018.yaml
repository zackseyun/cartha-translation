translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ആരോപണം ഉന്നയിക്കുന്ന സ്ത്രീയുടെ നേരിട്ടുള്ള പ്രസ്താവന എന്ന സ്വരം നിലനിർത്തിയിട്ടുണ്ട്; മൂലപാഠം വ്യക്തമാക്കാത്ത വസ്ത്രത്തിന്റെ ഇനം നിർണ്ണയിച്ചിട്ടില്ല.
