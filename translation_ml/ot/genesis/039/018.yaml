  yaml_path: translation/ot/genesis/039/018.yaml
  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: ml
  text: ഞാൻ ശബ്ദമുയർത്തി നിലവിളിച്ചപ്പോൾ, അവൻ തന്റെ വസ്ത്രം[a] എന്റെ അരികിൽ ഉപേക്ഷിച്ച് പുറത്തേക്ക് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മേലങ്കി.’ എബ്രായത്തിലെ בֶּגֶד എന്നത് വസ്ത്രത്തിനുള്ള പൊതുപദമാണ്; ഏതു പ്രത്യേക വസ്ത്രമാണെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: ഞാൻ … ഉയർത്തി …പ്പോൾ
  rationale: וַיְהִי ഇവിടെ തുടർന്നുവരുന്ന സംഭവത്തിന് കാലസംബന്ധമായ ഉപവാക്യം അവതരിപ്പിക്കുന്നു; כַּהֲרִימִי ‘ഞാൻ ഉയർത്തിയപ്പോൾ’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി ചേർത്തു.
- source_word: קוֹלִי
  choice: ശബ്ദം
  rationale: ഇവിടെ קוֹל ‘ശബ്ദം/സ്വരം’ എന്നാണ്; ‘ശബ്ദമുയർത്തുക’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: וָאֶקְרָא
  choice: നിലവിളിച്ചു
  rationale: קרא എന്നതിന് വിളിക്കുക, വിളിച്ചുപറയുക, നിലവിളിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. അപകടസൂചന നൽകുന്ന ഈ സന്ദർഭത്തിൽ ‘നിലവിളിച്ചു’ അടിയന്തരത വ്യക്തമാക്കുന്നു, എന്നാൽ വാക്കുകളുടെ ഉള്ളടക്കം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיַּעֲזֹב
  choice: ഉപേക്ഷിച്ച്
  rationale: עזב ഇവിടെ വസ്ത്രം അവളുടെ അരികിൽ വിട്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉപേക്ഷിച്ച്’ സംഭവത്തിന്റെ പെട്ടെന്നുള്ള വിട്ടുപോകൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בִּגְדוֹ
  choice: തന്റെ വസ്ത്രം
  rationale: בֶּגֶד ഒരു പൊതുവായ വസ്ത്രപദമാണ്; പ്രത്യേകിച്ച് മേലങ്കിയോ അങ്കിയോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പൊതുപദം നിലനിർത്തി.
- source_word: אֶצְלִי
  choice: എന്റെ അരികിൽ
  rationale: אצל സാമീപ്യം സൂചിപ്പിക്കുന്നു. ‘എന്റെ അരികിൽ’ സ്ഥലസംബന്ധമായ അർഥം വ്യക്തമായി നൽകുന്നു; ഉടമസ്ഥത എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: נוס ഓടി രക്ഷപ്പെടുക/പലായനം ചെയ്യുക എന്ന അടിയന്തര ചലനത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַחוּצָה
  choice: പുറത്തേക്ക്
  rationale: ദിശാസൂചകമായ ה ചേർന്ന ഈ രൂപം പുറത്തേക്കുള്ള ചലനമാണ് സൂചിപ്പിക്കുന്നത്; ‘പുറത്തേക്ക്’ അത് കൃത്യമായി നൽകുന്നു.
