source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: ml
  text: അവൻ തന്റെ വീടിന്റെയും തനിക്കുള്ള സകലത്തിന്റെയും ചുമതല യോസേഫിനെ ഏൽപ്പിച്ചതുമുതൽ[a], യഹ്വേ യോസേഫ് നിമിത്തം ആ മിസ്രയീമ്യന്റെ ഭവനത്തെ അനുഗ്രഹിച്ചു. വീട്ടിലും വയലിലും അവനുണ്ടായിരുന്ന സകലത്തിന്മേലും യഹ്വേയുടെ അനുഗ്രഹം ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അന്നുമുതൽ—അവൻ തന്റെ വീടിന്റെയും തനിക്കുള്ള സകലത്തിന്റെയും ചുമതല യോസേഫിനെ ഏൽപ്പിച്ചപ്പോൾ—”.'
    reason: מֵאָז എന്ന സമയപ്രയോഗവും പിന്നാലെയുള്ള ക്രിയാഭാഗവും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ ഇങ്ങനെ വേറൊരു ഘടനയിലും അവതരിപ്പിക്കാം.
  - marker: b
    text: 'അഥവാ: “വീട്ടിലും വയലിലുമുള്ള അവന്റെ സകലത്തിലും യഹ്വേയുടെ അനുഗ്രഹം ഉണ്ടായിരുന്നു.”'
    reason: בְּ എന്ന ഉപസർഗം അനുഗ്രഹം നിലകൊള്ളുന്ന മേഖലയെ ‘മേൽ’ എന്നോ ‘ഇൽ’ എന്നോ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ അനുവദിക്കുന്നു; വീട്ടും വയലും ‘സകലത്തിന്റെ’ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: מֵאָז
  choice: ചുമതലപ്പെടുത്തിയതുമുതൽ
  rationale: തുടർന്നുവരുന്ന അവസ്ഥ ആരംഭിച്ച സമയബിന്ദുവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ ഈ ക്രിയാസംബന്ധിയായ രൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הִפְקִיד
  choice: ചുമതലപ്പെടുത്തി
  rationale: ഹിഫീൽ രൂപം ഇവിടെ മേൽനോട്ടവും ഭരണച്ചുമതലയും ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗിക നിയമനം എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ־לוֹ
  choice: തന്റെ വീട്ടിനും തനിക്കുള്ള സകലത്തിനും മേൽ
  rationale: സ്ഥലമാത്രമല്ല, യോസേഫിന് ഏൽപ്പിച്ച അധികാരപരിധിയാണ് ഉദ്ദേശിക്കുന്നത്; ‘മേൽ’ രണ്ടു ഘടകങ്ങളെയും നിയന്ത്രിക്കുന്നു.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; അതിന്റെ ഫലം സമൃദ്ധിയായാലും ‘സമൃദ്ധനാക്കി’ എന്ന് മാത്രം പറഞ്ഞ് ദൈവിക അനുഗ്രഹത്തിന്റെ ആശയം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בֵּית הַמִּצְרִי
  choice: ആ മിസ്രയീമ്യന്റെ ഭവനം
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിക്കപ്പെട്ട മിസ്രയീമ്യനായ പോത്തീഫറിന്റെ വീടും കുടുംബവ്യവസ്ഥയും ഉൾക്കൊള്ളുന്ന ഘടകമാണ്; ‘ഭവനം’ ഈ വിപുലമായ അർഥം സൂക്ഷിക്കുന്നു.
- source_word: בִּגְלַל יוֹסֵף
  choice: യോസേഫ് നിമിത്തം
  rationale: בגלל സൂചിപ്പിക്കുന്ന കാരണബന്ധം വ്യക്തവും ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִּרְכַּת יְהוָה
  choice: യഹ്വേയുടെ അനുഗ്രഹം
  rationale: സംയുക്തപദബന്ധം സ്വാഭാവിക മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുകയും അനുഗ്രഹത്തിന്റെ ഉറവിടം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּכָל אֲשֶׁר יֶשׁ־לוֹ בַּבַּיִת וּבַשָּׂדֶה
  choice: വീട്ടിലും വയലിലും അവനുണ്ടായിരുന്ന സകലത്തിന്മേലും
  rationale: അനുഗ്രഹത്തിന്റെ സമഗ്രവ്യാപ്തിയും വീട്ടിലെയും വയലിലെയും രണ്ടു മേഖലകളും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; മൂലത്തിലെ ദൃശ്യപ്രതീകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പാരമ്പര്യ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരം ചെയ്ത് നിലനിർത്തുന്നു.
- issue: അനുഗ്രഹം എന്നതിന്റെ സ്വഭാവം
  choice: അനുഗ്രഹിച്ചു / യഹ്വേയുടെ അനുഗ്രഹം
  alternative: സമൃദ്ധമാക്കി / അഭിവൃദ്ധി
  rationale: സന്ദർഭത്തിൽ ഭൗതിക അഭിവൃദ്ധി ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ברך എന്ന മൂലപദത്തിന്റെ ദൈവിക അനുഗ്രഹാർഥം അതിലേക്കു മാത്രം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ചുമതലപ്പെടുത്തി’ ഭരണാധികാരം വ്യക്തമാക്കുന്നു; ‘ഭവനം’ ഇവിടെ കെട്ടിടം മാത്രമല്ല, മിസ്രയീമ്യന്റെ ഗൃഹവ്യവസ്ഥയെയും സൂചിപ്പിക്കാൻ തെരഞ്ഞെടുത്തു. വാക്യത്തിന്റെ നീളം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും എബ്രായത്തിലെ കാരണ-ഫലക്രമം നിലനിർത്തി.
