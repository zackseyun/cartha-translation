  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: ml
  text: അങ്ങനെയൊരു ദിവസം, തന്റെ ജോലി ചെയ്യാൻ അവൻ വീട്ടിലേക്കു ചെന്നു; വീട്ടിലെ പുരുഷന്മാരിൽ ആരും ആ വീട്ടിൽ ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּהַיּוֹם הַזֶּה
  choice: അങ്ങനെയൊരു ദിവസം
  rationale: വിവരണത്തിന്റെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്ന וַיְהִי എന്ന സൂത്രപ്രയോഗവും, ഒരു പ്രത്യേക അവസരത്തെ സൂചിപ്പിക്കുന്ന כְּהַיּוֹם הַזֶּה എന്ന പ്രയോഗവും ചേർത്ത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: അവൻ വീട്ടിനകത്തു ചെന്നു
  rationale: ദിശാസൂചകമായ ה־ ഉൾപ്പെടുന്നതിനാൽ വീട്ടിന്റെ അകത്തേക്കുള്ള ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: തന്റെ ജോലി ചെയ്യാൻ
  rationale: מְלָאכָה ഇവിടെ യോസേഫിന്റെ പതിവ് ജോലി അഥവാ ചുമതലയെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭം ആവശ്യപ്പെടാത്ത പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: വീട്ടിലെ പുരുഷന്മാരിൽ ആരും ... ഉണ്ടായിരുന്നില്ല
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗബഹുവചനം നിലനിർത്തുകയും നിഷേധാത്മക അസ്തിത്വപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: שָׁם בַּבָּיִת
  choice: അവിടെ വീട്ടിനകത്ത്
  rationale: שָׁם എന്ന ‘അവിടെ’യും בַּבָּיִת എന്ന ‘വീട്ടിനകത്ത്’ എന്ന സ്ഥാനസൂചനയും ഒഴിവാക്കാതെ, എബ്രായത്തിലെ ആവർത്തിച്ച ഊന്നൽ സംരക്ഷിക്കുന്നു.
