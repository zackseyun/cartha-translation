translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘വീട്’ എന്ന പദത്തിന്റെ ആവർത്തനവും ‘പുരുഷന്മാർ’ എന്ന ലിംഗസൂചനയും നിലനിർത്തിയിട്ടുണ്ട്.
