id: GEN.39.12
reference: Genesis 39:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּתְפְּשֵׂ֧/הוּ בְּ/בִגְד֛/וֹ לֵ/אמֹ֖ר שִׁכְבָ֣/ה עִמִּ֑/י וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ בְּ/יָדָ֔/הּ וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: ml
  text: അപ്പോൾ അവൾ അവന്റെ വസ്ത്രത്തിൽ[a] പിടിച്ച്, “എന്നോടൊപ്പം കിടക്കൂ!”[b] എന്നു പറഞ്ഞു. എന്നാൽ അവൻ തന്റെ വസ്ത്രം അവളുടെ കൈയിൽ വിട്ടിട്ട് ഓടി പുറത്തേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വസ്ത്രം’ എന്ന പൊതുപദം സന്ദർഭമനുസരിച്ച് ‘മേലങ്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്നോടൊപ്പം ഉറങ്ങൂ!” ലൈംഗികബന്ധത്തിനുള്ള ഹീബ്രു പരോക്ഷപ്രയോഗത്തിൽ അക്ഷരാർഥത്തിൽ ‘കിടക്കുക’ എന്നാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: അവൾ ... പിടിച്ച്
  rationale: תפשׂ ഉറച്ചുപിടിക്കുന്ന പെട്ടെന്നുള്ള ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പിടിച്ച്’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: അവന്റെ വസ്ത്രത്തിൽ / തന്റെ വസ്ത്രം
  rationale: בגד ഒരു പ്രത്യേകതരം മേലങ്കിയെ നിർബന്ധമായി സൂചിപ്പിക്കാത്ത, വസ്ത്രത്തിനുള്ള പൊതുപദമാണ്. അതിനാൽ ‘വസ്ത്രം’ എന്നത് മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്ന ഹീബ്രു രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: שִׁכְבָה עִמִּי
  choice: എന്നോടൊപ്പം കിടക്കൂ!
  rationale: שׁכב עם ഇവിടെ ലൈംഗികബന്ധത്തിനുള്ള പരോക്ഷപ്രയോഗമാണ്. ‘കിടക്കൂ’ മൂലത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും സന്ദർഭത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעֲזֹב
  choice: വിട്ടിട്ട്
  rationale: עזב ഇവിടെ വസ്ത്രം അവളുടെ കൈവശം ശേഷിക്കാൻ വിട്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിട്ടിട്ട്’ മലയാളത്തിലെ സംഭവക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיָדָהּ
  choice: അവളുടെ കൈയിൽ
  rationale: יד എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥമായ ‘കൈ’ നിലനിർത്തുന്നു; വസ്ത്രം അവളുടെ ശാരീരിക പിടിയിൽ ശേഷിച്ചതും വ്യക്തമാകുന്നു.
- source_word: וַיָּנָס
  choice: ഓടി
  rationale: נוס അടിയന്തരമായി രക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. പിന്നാലെയുള്ള ‘പുറത്തേക്കു പോയി’ എന്ന ക്രിയയോടൊപ്പം ‘ഓടി’ മലയാളത്തിൽ പ്രവൃത്തിയുടെ വേഗവും സ്വാഭാവികമായ ആഖ്യാനവും നൽകുന്നു.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: പുറത്തേക്കു പോയി
  rationale: അകത്തുനിന്ന് പുറത്തേക്കുള്ള ദിശാപരമായ ചലനം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ലൈംഗിക നിർദേശം മറച്ചുവയ്ക്കാതെയും അനാവശ്യമായി തുറന്നുപറയാതെയും ഹീബ്രു പരോക്ഷപ്രയോഗത്തിന്റെ സാഹിത്യസ്വഭാവം നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് അക്ഷരങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാളത്തിൽ വാചകത്തിലെ പ്രത്യക്ഷക്രമമനുസരിച്ച് [a] വസ്ത്രത്തിനും [b] ‘കിടക്കൂ’ എന്ന പ്രയോഗത്തിനും നൽകിയിരിക്കുന്നു.
