  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: ml
  text: യോസേഫിന്റെ ചുമതലയിലുണ്ടായിരുന്ന യാതൊന്നിനെക്കുറിച്ചും കാരാഗൃഹാധികാരി ശ്രദ്ധിച്ചില്ല[a]; കാരണം യാഹ്‌വെ അവനോടുകൂടെ ഉണ്ടായിരുന്നു. യോസേഫ് ചെയ്യുന്നതെന്തും യാഹ്‌വെ വിജയിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈയിലുണ്ടായിരുന്ന ഒന്നും കണ്ടില്ല.’ ഇവിടെ ‘കൈയിൽ’ എന്നത് യോസേഫിന്റെ നിയന്ത്രണത്തിൽ ഏൽപ്പിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ഒന്നിനെക്കുറിച്ചും ഉത്കണ്ഠപ്പെട്ടില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: കാരാഗൃഹാധികാരി
  rationale: שַׂר എന്നത് വെറും കാവൽക്കാരനെയല്ല, മേൽനോട്ടവും അധികാരവുമുള്ള ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്; ആ ഭരണപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: ഒന്നിനെക്കുറിച്ചും ... ശ്രദ്ധിക്കേണ്ടിവന്നില്ല
  rationale: അക്ഷരാർഥമായ ‘ഒന്നും കണ്ടില്ല’ എന്നതിനെക്കാൾ, യോസേഫിനെ ഏൽപ്പിച്ച കാര്യങ്ങൾ പരിശോധിക്കുകയോ അവയെക്കുറിച്ച് ഉത്കണ്ഠപ്പെടുകയോ വേണ്ടിവന്നില്ല എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בְּיָדוֹ
  choice: യോസേഫിന്റെ ചുമതലയിലുണ്ടായിരുന്ന
  rationale: ‘അവന്റെ കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗം നിയന്ത്രണത്തിനോ ചുമതലയ്ക്കോ ഏൽപ്പിക്കപ്പെട്ട കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; സർവനാമത്തിന്റെ സൂചകം വ്യക്തമായി നൽകാൻ യോസേഫിന്റെ പേര് ഉപയോഗിച്ചു.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: കാരണം യാഹ്‌വെ അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: בַּאֲשֶׁר ഇവിടെ കാരണബന്ധം പ്രകടിപ്പിക്കുന്നു; ‘കാരണം’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: അവൻ ചെയ്യുന്നതെന്തും
  rationale: യോസേഫിന്റെ എല്ലാ പ്രവൃത്തികളെയും ഉൾക്കൊള്ളുന്ന ബന്ധവാക്യത്തിന്റെ വ്യാപകത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַצְלִיחַ
  choice: വിജയിപ്പിച്ചു
  rationale: צלח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—വിജയം ഉണ്ടാക്കുക—സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: യോസേഫിന്റെ വിജയത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തനകാരണം
  choice: യാഹ്‌വെ വിജയിപ്പിച്ചു
  alternative: അവൻ ചെയ്തതെല്ലാം വിജയിച്ചു
  rationale: מַצְלִיחַ എന്ന കാരണാർഥ ക്രിയ യാഹ്‌വെയെ വിജയത്തിന്റെ പ്രവർത്തകകാരണമായി അവതരിപ്പിക്കുന്നതിനാൽ ആ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കാരാഗൃഹാധികാരി’ ഭരണപരമായ സ്ഥാനം വ്യക്തമാക്കുന്നു; ‘ശ്രദ്ധിക്കേണ്ടിവന്നില്ല’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു. ദൈവനാമം ‘യാഹ്‌വെ’യായി നിലനിർത്തി.
