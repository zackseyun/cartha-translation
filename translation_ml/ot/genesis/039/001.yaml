id: GEN.39.1
reference: Genesis 39:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: ml
  text: യോസേഫിനെ ഈജിപ്തിലേക്കു കൊണ്ടുപോയിരുന്നു; ഫറവോന്റെ ഉദ്യോഗസ്ഥൻ[a]യും അംഗരക്ഷകസേനയുടെ തലവനുമായ ഈജിപ്തുകാരൻ പോത്തിഫർ, അവനെ അവിടേക്കു കൊണ്ടുപോയ യിശ്മായേല്യരിൽനിന്ന് അവനെ വാങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉദ്യോഗസ്ഥൻ” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഹീബ്രുപദത്തിന് “ഷണ്ഡൻ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: കൊണ്ടുപോയിരുന്നു
  rationale: ירד എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം കാരണാർഥക നിഷ്ക്രിയത സൂചിപ്പിക്കുന്നു; യോസേഫ് സ്വമേധയാ പോയതല്ല, കൊണ്ടുപോകപ്പെട്ടതാണ്. വാങ്ങലിനു മുമ്പുണ്ടായ പ്രവൃത്തിയെന്ന ബന്ധം ‘കൊണ്ടുപോയിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ -ָה പ്രത്യയം ഈജിപ്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקְנֵהוּ
  choice: അവനെ വിലയ്ക്കു വാങ്ങി
  rationale: അടിമവ്യാപാരസന്ദർഭത്തിൽ קנה എന്നത് വാങ്ങുക എന്ന ഇടപാടിന്റെ അർഥത്തിലാണ്; ‘വിലയ്ക്കു’ എന്നത് മലയാളത്തിൽ ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: סְרִיס פַּרְעֹה
  choice: ഫറവോന്റെ ഒരു ഉദ്യോഗസ്ഥൻ
  rationale: סְרִיס രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥനെയോ ഷണ്ഡനെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ ഔദ്യോഗിക അർഥം മുഖ്യപാഠത്തിൽ നൽകി, മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שַׂר הַטַּבָּחִים
  choice: അംഗരക്ഷകസേനയുടെ തലവൻ
  rationale: രാജകീയ കാവൽക്കാരുടെയോ വധനിർവാഹകരുടെയോ മേൽനോട്ടക്കാരനെ സൂചിപ്പിക്കുന്ന പദവിയാണിത്. തർക്കവിധേയമായ വധനിർവാഹക സൂക്ഷ്മത നിർബന്ധിക്കാതെ പദവിയുടെ സൈനിക-രാജകീയ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ מִצְרִי
  choice: ഈജിപ്തുകാരൻ
  rationale: പോത്തിഫറിന്റെ ജനതാപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; אִישׁ പ്രത്യേകം ‘പുരുഷൻ’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യവും അസ്വാഭാവികവുമാണ്.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: യിശ്മായേല്യരിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന ഹീബ്രു പ്രയോഗം വാങ്ങൽസന്ദർഭത്തിൽ മലയാളത്തിൽ ലളിതമായി ‘നിന്ന്’ എന്നു നൽകുന്നതാണ് സ്വാഭാവികം.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: അവനെ അവിടേക്കു കൊണ്ടുപോയ
  rationale: യിശ്മായേല്യരിലേക്കു ബന്ധപ്പെടുന്ന ആപേക്ഷികവാക്യവും ירד എന്ന ധാതുവിന്റെ ആവർത്തനവും ‘അവിടെ’ എന്ന സ്ഥലസൂചനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പോത്തിഫറിന്റെ പദവിയിലെ סְרִיס എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഉദ്യോഗസ്ഥൻ’
  alternative: ‘ഷണ്ഡൻ’ അഥവാ ‘കൊട്ടാരത്തിലെ ഷണ്ഡൻ’
  rationale: ഈ ഹീബ്രുപദത്തിന് ഔദ്യോഗിക പദവിയും ശാരീരികാവസ്ഥയും സൂചിപ്പിക്കാനാകും. വിവരണം ശാരീരിക അർഥം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വിശാലമായ ഔദ്യോഗിക അർഥം മുഖ്യപാഠത്തിലും യഥാർഥ പദസന്ദിഗ്ധത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. ദീർഘമായ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘കൊണ്ടുപോയ’ പ്രമേയവും എല്ലാ പ്രധാന വിവരങ്ങളും നിലനിർത്തി.
