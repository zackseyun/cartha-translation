translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. പേരിന് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകമായ ‘യോസേഫ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ കാരാഗൃഹ-ആവർത്തനവും אסר മൂലത്തിന്റെ ശൈലീപരമായ ആവർത്തനവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
