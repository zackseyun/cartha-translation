source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: ml
  text: യോസേഫിന്റെ യജമാനൻ അവനെ എടുത്ത്, രാജാവിന്റെ തടവുകാർ തടവിലാക്കപ്പെട്ടിരുന്ന[b] സ്ഥലമായ കാരാഗൃഹത്തിൽ[a] ആക്കി. അവൻ അവിടെ കാരാഗൃഹത്തിൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘സോഹറിന്റെ വീട്’; തടവറയെയോ തടങ്കൽസ്ഥലത്തെയോ സൂചിപ്പിക്കുന്ന ഈ പദം ഒരു ഈജിപ്ഷ്യൻ പദമാണെന്ന് കരുതപ്പെടുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘ബന്ധിക്കുക/തടവിലാക്കുക’ എന്നർഥമുള്ള ഒരേ എബ്രായ മൂലം ഇവിടെ ആവർത്തിക്കുന്നു; അക്ഷരാർഥത്തിൽ, ‘രാജാവിന്റെ തടവുകാർ തടവിലാക്കപ്പെട്ടിരുന്ന സ്ഥലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: യോസേഫിന്റെ യജമാനൻ
  rationale: സന്ദർഭത്തിൽ אֲדֹנֵי എന്നത് ദൈവിക പദവിയല്ല, യോസേഫിന്റെ മനുഷ്യയജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ സ്വാഭാവികവും ചരിത്രസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַיִּקַּח
  choice: പിടിച്ച്
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നർത്ഥമുണ്ടെങ്കിലും, ഒരാളെ കസ്റ്റഡിയിലെടുത്ത് കാരാഗൃഹത്തിലാക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പിടിച്ച്’ സ്വാഭാവികമാണ്; ‘ബലമായി പിടിച്ചെടുത്തു’ എന്ന അതിശക്തമായ ഭാവം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: കാരാഗൃഹത്തിൽ ആക്കി
  rationale: נתן + אֶל ഇവിടെ ഒരാളെ ഒരു സ്ഥലത്തിനകത്ത് ഇടുക/ആക്കുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘കാരാഗൃഹത്തിൽ ആക്കി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֵּית הַסֹּהַר
  choice: കാരാഗൃഹം
  rationale: അക്ഷരാർഥത്തിൽ ‘സോഹറിന്റെ വീട്’ എന്ന ഘടനയായിട്ടുണ്ടെങ്കിലും, പദം തടവുശാലയെ സൂചിപ്പിക്കുന്നു. ‘കാരാഗൃഹം’ ആധുനികവും മാന്യവുമായ വ്യക്തമായ സമാനപദമാണ്.
- source_word: מְקוֹם אֲשֶׁר
  choice: സ്ഥലത്ത്
  rationale: കാരാഗൃഹം രാജാവിന്റെ തടവുകാർ പാർപ്പിക്കപ്പെട്ട സ്ഥലമാണെന്ന് വിശദീകരിക്കുന്ന അനുബന്ധഘടന മലയാളത്തിൽ ഡാഷിനുശേഷമുള്ള ‘സ്ഥലത്ത്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: രാജാവിന്റെ തടവുകാർ തടവിലാക്കപ്പെട്ടിരുന്ന
  rationale: אסר എന്ന മൂലത്തിന്റെ ആവർത്തനം—‘തടവുകാർ ... തടവിലാക്കപ്പെട്ടിരുന്നു’—മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; ഇതിലൂടെ മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  choice: അവൻ അവിടെ കാരാഗൃഹത്തിൽ കഴിഞ്ഞു
  rationale: היה + שם അവന്റെ അവിടെയുള്ള സാന്നിധ്യം സൂചിപ്പിക്കുന്നു. ‘കഴിഞ്ഞു’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ നിലയെ പ്രകടിപ്പിക്കുന്നു; കാരാഗൃഹം എന്ന ആവർത്തനവും മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തുന്നു.
