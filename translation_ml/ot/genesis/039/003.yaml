source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: ml
  text: തന്റെ യജമാനൻ യഹോവ അവനോടുകൂടെ ഉണ്ടെന്നും, അവൻ ചെയ്യുന്നതെല്ലാം യഹോവ അവന്റെ കൈയിൽ വിജയിപ്പിക്കുന്നുവെന്നും[a] കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവൻ മുഖാന്തരം” അല്ലെങ്കിൽ “അവന്റെ മേൽനോട്ടത്തിൽ”; എബ്രായത്തിൽ അക്ഷരാർഥം “അവന്റെ കൈയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; ഇവിടെ തെളിവുകളിൽനിന്നുള്ള തിരിച്ചറിവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֲדֹנָיו
  choice: തന്റെ യജമാനൻ
  rationale: പോത്തീഫറിനോടുള്ള യോസേഫിന്റെ ഗൃഹദാസബന്ധം സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ ചതുരക്ഷര ദൈവനാമത്തെ മലയാളത്തിലെ വ്യാപകമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടെന്നും
  rationale: യോസേഫിനൊപ്പമുള്ള ദൈവസാന്നിധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: അവൻ ചെയ്യുന്നതെല്ലാം
  rationale: ഹീബ്രു വർത്തമാനകൃതന്തത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവവും സമഗ്രതയും ചുരുക്കമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: מַצְלִיחַ
  choice: വിജയിപ്പിക്കുന്നുവെന്നും
  rationale: צלח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം നിലനിർത്തി, വിജയത്തിന്റെ കർത്താവ് യഹോവയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בְּיָדוֹ
  choice: അവന്റെ കൈയിൽ
  rationale: ഹീബ്രുവിലെ മൂർത്തമായ പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ഉപകരണം, നിർവഹണം, ചുമതലയുടെ പരിധി എന്നീ സാധ്യതകളെ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- issue: בְּיָדוֹ എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തി
  choice: അവന്റെ കൈയിൽ
  alternative: അവൻ മുഖാന്തരം / അവന്റെ മേൽനോട്ടത്തിൽ
  rationale: ഉപകരണം, പ്രവർത്തനമേഖല, ചുമതല എന്നിവയ്ക്കിടയിലെ മൂലപാഠത്തിന്റെ യഥാർഥ അർഥതുറവ് പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവന്റെ കൈയിൽ’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പോടെ നിലനിർത്തിയിരിക്കുന്നു.
