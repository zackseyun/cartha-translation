id: GEN.39.19
reference: Genesis 39:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: ml
  text: അവന്റെ യജമാനൻ, “നിന്റെ അടിമ എന്നോട് ഇങ്ങനെയാണ് ചെയ്തത്” എന്നു തന്റെ ഭാര്യ തന്നോടു പറഞ്ഞ വാക്കുകൾ കേട്ടപ്പോൾ അവന്റെ കോപം ജ്വലിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ ആഖ്യാനക്രമത്തിൽ ഉൾപ്പെടുത്തി]'
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവതുടർച്ച സൂചിപ്പിക്കുന്ന രൂപം; മലയാളത്തിൽ ‘അപ്പോൾ/സംഭവിച്ചത്’ ചേർക്കാതെ കാലവാക്യത്തോടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: כִשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: കാലസാഹചര്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֲדֹנָיו
  choice: അവന്റെ യജമാനൻ
  rationale: യോസേഫിന്മേലുള്ള ഉടമസ്ഥ-ഗൃഹാധികാരബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: തന്റെ ഭാര്യ തന്നോടു പറഞ്ഞ വാക്കുകൾ
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാളക്രമത്തിലാക്കി, ‘വാക്കുകൾ’ എന്ന മൂലപദത്തിന്റെ സവിശേഷത നിലനിർത്തുന്നു.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ഇങ്ങനെയൊക്കെയാണ്
  rationale: ‘ഇത്തരം കാര്യങ്ങൾ/ഈ വാക്കുകൾക്കൊത്തവിധം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുകയും ആരോപണത്തിന്റെ കൃത്യവിവരം കൂട്ടിച്ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עַבְדְּךָ
  choice: നിന്റെ അടിമ
  rationale: עבד എന്നതിന് ‘ദാസൻ/അടിമ’ രണ്ടും സാധ്യമെങ്കിലും, പോത്തിഫറിന്റെ വീട്ടിലെ യോസേഫിന്റെ ബന്ധിതസ്ഥിതി ഇവിടെ ‘അടിമ’യെ പിന്തുണയ്ക്കുന്നു.
- source_word: עָשָׂה לִי
  choice: എന്നോട് ... ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയയും לִי എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; ‘എനിക്കെതിരെ’ എന്ന് വ്യാഖ്യാനം ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: וַיִּחַר אַפּוֹ
  choice: അവന്റെ കോപം ജ്വലിച്ചു
  rationale: കോപം കത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആരോപണത്തിലെ ഹീബ്രു അസ്പഷ്ടത ‘ഇങ്ങനെയൊക്കെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; യജമാനന്റെ കോപം ആരോടാണെന്നു മൂലവാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും അത് നിർണ്ണയിക്കുന്നില്ല.
