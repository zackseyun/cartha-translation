  to: കാരാഗൃഹാധികാരി കാരാഗൃഹത്തിലുണ്ടായിരുന്ന സകല തടവുകാരെയും യോസേഫിന്റെ ചുമതലയിൽ ഏൽപ്പിച്ചു; അവിടെ ചെയ്യപ്പെട്ടിരുന്നതെല്ലാം യോസേഫ് തന്നെയായിരുന്നു ചെയ്തിരുന്നത്.[a]
  rationale: അവസാനഭാഗം ഹീബ്രുവിലെ അനിശ്ചിത ബഹുവചന ‘ചെയ്യുന്നു/ചെയ്തിരുന്നു’ എന്ന പ്രയോഗത്തെയും, യോസേഫിനെ ഊന്നിപ്പറയുന്ന സർവനാമത്തെയും, തുടരുന്ന പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ക്രിയാരൂപത്തെയും കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നവിധം പരിഷ്കരിച്ചു. ‘ചുമതലയിൽ ഏൽപ്പിച്ചു’ എന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം നിലനിർത്തി.
