reference: Genesis 39:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Joseph’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: ml
  text: കാരാഗൃഹാധികാരി കാരാഗൃഹത്തിലുണ്ടായിരുന്ന സകല തടവുകാരെയും യോസേഫിന്റെ ചുമതലയിൽ ഏൽപ്പിച്ചു; അവിടെ ചെയ്യപ്പെട്ടിരുന്നതെല്ലാം യോസേഫ് തന്നെയായിരുന്നു ചെയ്തിരുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവിടെ നടക്കുന്നതെല്ലാം യോസേഫ് തന്നെയായിരുന്നു ചെയ്തുകൊണ്ടിരുന്നത്.” ഹീബ്രു പ്രയോഗം യോസേഫിന്റെ സജീവമായ മേൽനോട്ടവും ഉത്തരവാദിത്വവും ഊന്നിപ്പറയുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: കാരാഗൃഹാധികാരി
  rationale: കാരാഗൃഹത്തിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന ശַׂר എന്ന പദത്തിന് സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളം.
- source_word: בְּיַד יוֹסֵף
  choice: യോസേഫിന്റെ ചുമതലയിൽ ഏല്പിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘യോസേഫിന്റെ കയ്യിൽ’ എന്നാണെങ്കിലും, ഇവിടെ നിയന്ത്രണവും ഉത്തരവാദിത്വവും ഏല്പിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הָאֲסִירִם
  choice: സകല തടവുകാരെയും
  rationale: ബന്ധിക്കപ്പെട്ടവരെയോ തടവിലാക്കപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് ഈ സാഹചര്യത്തിൽ ‘തടവുകാർ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: അവിടെ നടന്നിരുന്ന എല്ലാ കാര്യങ്ങളുടെയും
  rationale: עֹשִׂים എന്ന അനിശ്ചിത ബഹുവചന കർത്തൃപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും അവിടത്തെ എല്ലാ പ്രവർത്തനങ്ങളെയും ഉൾക്കൊള്ളുന്നു.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: നടത്തിപ്പ് യോസേഫിനായിരുന്നു
  rationale: הוּא എന്ന ഊന്നലും היה + participle സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനവും ഉത്തരവാദിത്വവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം.
theological_decisions:
- issue: യോസേഫ് എല്ലാം നേരിട്ട് ചെയ്തുവോ, അതോ മേൽനോട്ടം വഹിച്ചുവോ
  choice: എല്ലാ കാര്യങ്ങളുടെയും നടത്തിപ്പ് യോസേഫിനായിരുന്നു
  alternative: അവിടെ ചെയ്തിരുന്നതെല്ലാം അവൻ തന്നെയായിരുന്നു ചെയ്തിരുന്നത്
  rationale: ഹീബ്രു വാചകം യോസേഫിന്റെ ഊന്നിപ്പറയപ്പെട്ട സജീവ ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നു; ഓരോ പ്രവൃത്തിയും വ്യക്തിപരമായി അവൻ മാത്രമാണ് ചെയ്തതെന്ന് അനാവശ്യമായി ചുരുക്കാതെ പ്രവർത്തനനിർവഹണത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ‘കയ്യിൽ കൊടുത്തു’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗത്തിനു പകരം ലക്ഷ്യഭാഷയിൽ വ്യക്തമായ ‘ചുമതലയിൽ ഏല്പിച്ചു’ ഉപയോഗിച്ചു; അക്ഷരസമീപമായ അവസാനവാക്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
