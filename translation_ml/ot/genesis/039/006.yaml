id: GEN.39.6
reference: Genesis 39:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: ml
  text: അങ്ങനെ അവൻ തനിക്കുള്ളതെല്ലാം യോസേഫിന്റെ കൈയിൽ ഏൽപ്പിച്ചു[a]. താൻ കഴിക്കുന്ന ഭക്ഷണമല്ലാതെ, യോസേഫിന്റെ ചുമതലയിലുള്ള മറ്റൊന്നിനെക്കുറിച്ചും അവൻ അന്വേഷിച്ചില്ല[b]. യോസേഫ് നല്ല ശരീരവടിവും സുന്ദരമായ രൂപവുമുള്ളവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യോസേഫിന്റെ കൈയിൽ വിട്ടു.” ഇവിടെ “കൈ” അധികാരത്തെയോ ചുമതലയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: hebrew_idiom
  - marker: b
    text: 'അക്ഷരാർഥം: “അവനോടുകൂടെ യാതൊന്നും അറിഞ്ഞില്ല.” മറ്റൊരു പരിഭാഷ: “യോസേഫിന്റെ പക്കലുള്ള യാതൊന്നിനെക്കുറിച്ചും അവൻ അറിഞ്ഞില്ല.” “ഭക്ഷണം” എന്നതിന്റെ അക്ഷരാർഥം “അപ്പം” എന്നാണ്.'
    reason: genuine_ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב כָּל אֲשֶׁר לוֹ בְּיַד יוֹסֵף
  choice: തനിക്കുള്ളതെല്ലാം യോസേഫിന്റെ കൈയിൽ ഏൽപ്പിച്ചു
  rationale: עזב എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വിട്ടു’ എന്നാണെങ്കിലും, ഭരണച്ചുമതല യോസേഫിനെ ഭരമേൽപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ഏൽപ്പിച്ചു’ സ്വാഭാവികമായി അർഥം വ്യക്തമാക്കുന്നു. ‘കൈയിൽ’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ അധികാരത്തിന്റെയും ചുമതലയുടെയും ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: യോസേഫിന്റെ ചുമതലയിലുള്ള മറ്റൊന്നിനെക്കുറിച്ചും അവൻ അന്വേഷിച്ചില്ല
  rationale: അക്ഷരാർഥം ‘അവനോടുകൂടെ യാതൊന്നും അറിഞ്ഞില്ല’ എന്നതാണെങ്കിലും അത് മലയാളത്തിൽ അവ്യക്തമാണ്. സന്ദർഭത്തിൽ പോത്തീഫർ യോസേഫിന്റെ മേൽനോട്ടത്തിലുള്ള കാര്യങ്ങൾ പരിശോധിക്കുകയോ അവയിൽ ശ്രദ്ധ ചെലുത്തുകയോ ചെയ്തില്ല എന്ന ആശയം ‘അന്വേഷിച്ചില്ല’ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: താൻ കഴിക്കുന്ന ഭക്ഷണം
  rationale: לֶחֶם എന്നത് അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ പൊതുവായി ഭക്ഷണത്തെയോ ആഹാരത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഭക്ഷണം’ ഉപയോഗിക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: יְפֵה תֹאַר וִיפֵה מַרְאֶה
  choice: നല്ല ശരീരവടിവും സുന്ദരമായ രൂപവും
  rationale: ആദ്യപ്രയോഗം ശരീരഘടനയെയും രണ്ടാമത്തേത് ദൃശ്യരൂപത്തെയും സൂചിപ്പിക്കുന്നു. ഈ വ്യത്യാസവും എബ്രായ സമാന്തരഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
