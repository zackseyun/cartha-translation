translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘യോസേഫിന്റെ കൈയിൽ’ എന്ന മൂലഭാഷാചിത്രം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമാക്കി; ദുഷ്കരമായ എബ്രായ വാക്യഘടനയുടെ അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
