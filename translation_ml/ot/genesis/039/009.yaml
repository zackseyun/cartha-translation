  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: ml
  text: “ഈ വീട്ടിൽ എന്നെക്കാൾ വലിയവൻ ആരുമില്ല[a]; നീ അദ്ദേഹത്തിന്റെ ഭാര്യയായതുകൊണ്ട് നിന്നെയൊഴികെ മറ്റൊന്നും അദ്ദേഹം എനിക്കു നൽകാതെ വെച്ചിട്ടില്ല. അങ്ങനെയിരിക്കെ ഞാൻ എങ്ങനെ ഈ വലിയ തിന്മ[b] ചെയ്ത് ദൈവത്തിനെതിരെ പാപം ചെയ്യും?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ വീട്ടിൽ ആരും എന്നെക്കാൾ വലിയവനല്ല.” എബ്രായവാക്യം ഈ വീട്ടിനുള്ളിൽ യോസേഫിനെക്കാൾ വലിയ ഒരാൾ ഉണ്ടെന്നത് നിഷേധിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഈ മഹാദോഷം” അഥവാ “ഈ വലിയ ദുഷ്ടത.” എബ്രായത്തിലെ רָעָה എന്ന പദത്തിന് തിന്മ, ദോഷം, ദുഷ്ടത എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: ഈ വീട്ടിൽ എന്നെക്കാൾ വലിയവനായി ആരുമില്ല
  rationale: אֵין ചേർന്ന ഈ ഘടന, യോസേഫിനെക്കാൾ വലിയ ഒരാളുടെ അസ്തിത്വം നിഷേധിക്കുന്നു. ‘വലിയവൻ’ ഇവിടെ വീട്ടിലെ സ്ഥാനത്തെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ താരതമ്യഘടന ഉപയോഗിച്ചു.
- source_word: בַּבַּיִת הַזֶּה
  choice: ഈ വീട്ടിൽ
  rationale: בַּיִת എന്നതിന് വീടെന്ന ഭൗതിക അർഥവും വീട്ടുകാരും ഭരണപരിധിയും ഉൾപ്പെടുന്ന വിശാല അർഥവും ഉണ്ടാകാം. ‘വീട്’ എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിലെ കുടുംബ-ഭരണപരിധിയും ഉൾക്കൊള്ളുന്നു.
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: മറ്റൊന്നും അദ്ദേഹം എന്നിൽനിന്നു വിലക്കിവെച്ചിട്ടില്ല
  rationale: חָשַׂךְ എന്നത് തടഞ്ഞുവെക്കുക അഥവാ വിലക്കിവെക്കുക എന്നാണ്. നിഷേധത്തോടുകൂടിയ מְאוּמָה ‘ഒന്നും’ എന്ന അർഥം നൽകുന്നു.
- source_word: כִּי אִם אוֹתָךְ
  choice: നിന്നെയല്ലാതെ
  rationale: 'നിഷേധവാക്യത്തിനു ശേഷമുള്ള כִּי אִם വ്യക്തമായ അപവാദം സൂചിപ്പിക്കുന്നു: ‘നിന്നെ ഒഴികെ’.'
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: നീ അദ്ദേഹത്തിന്റെ ഭാര്യയായതുകൊണ്ട്
  rationale: ഈ ഘടന അപവാദത്തിന്റെ കാരണം വ്യക്തമാക്കുന്നു. ആദരസൂചകമായ ‘അദ്ദേഹം’ മലയാളത്തിലെ സ്വാഭാവിക പരാമർശമാണ്; അത് മൂലപാഠത്തിൽ ഇല്ലാത്ത പദവിപ്പേര് ചേർക്കുന്നില്ല.
- source_word: וְאֵיךְ
  choice: അങ്ങനെയിരിക്കെ, ഞാൻ എങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള ധാർമിക നിഗമനമാണ് ഇവിടെ ചോദ്യംരൂപത്തിൽ വരുന്നത്. ‘അങ്ങനെയിരിക്കെ’ ആ അനുമാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: ഈ മഹാദോഷം
  rationale: רָעָה ദോഷം, തിന്മ, ദുഷ്ടത എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘മഹാദോഷം’ പ്രവൃത്തിയുടെ ഗുരുതരമായ ധാർമിക സ്വഭാവവും എബ്രായത്തിലെ വിശേഷണബലവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: ദൈവത്തിനെതിരെ പാപം ചെയ്യും
  rationale: חטא + ל ഇവിടെ ഒരാളിനെതിരെ പാപം ചെയ്യുക എന്ന ബന്ധം പ്രകടിപ്പിക്കുന്നു. ‘ദൈവത്തിനെതിരെ’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ വാക്കുകളിലെ אֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ദൈവം
  alternative: ഒരു ദൈവം
  rationale: ഉല്പത്തി വിവരണത്തിലെ യോസേഫിന്റെ ദൈവപരാമർശങ്ങളും ഈ വാക്യത്തിലെ ധാർമിക പ്രസ്താവനയും പരിഗണിക്കുമ്പോൾ, ഇവിടെ അവൻ ആരാധിക്കുന്ന ഏക ദൈവത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ വ്യക്തിനാമസദൃശമായ ‘ദൈവം’ യോജിക്കുന്നു.
- issue: കുറ്റത്തിന്റെ ദ്വിമുഖ സ്വഭാവം
  choice: ‘മഹാദോഷം’ ചെയ്യുന്നതും ‘ദൈവത്തിനെതിരെ പാപം’ ചെയ്യുന്നതും ഏക പ്രവൃത്തിയുടെ സാമൂഹികവും ദൈവസംബന്ധവുമായ ഗൗരവം ഒരുമിച്ച് നിലനിർത്തുന്നു
  alternative: ഇത് യജമാനനോടുള്ള കുറ്റം മാത്രമായോ ദൈവത്തോടുള്ള പാപം മാത്രമായോ ചുരുക്കുക
  rationale: മൂലപാഠം രണ്ടുഭാഗങ്ങളും ബന്ധിപ്പിക്കുന്നു; ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കാതെ പരിഭാഷയിൽ രണ്ടും സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘വീട്’ എന്ന എബ്രായരൂപകം നിലനിർത്തി; അതിന്റെ ഭരണപരമായ അർഥം സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്. അതിപുരാതനമോ പ്രത്യേക സഭാവിഭാഗപരമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
