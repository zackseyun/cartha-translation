revisions:
- from: യഹ്‌വേ യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു; അതുകൊണ്ട് അവൻ കാര്യസിദ്ധിയുള്ളവനായി[a]. അവൻ തന്റെ ഈജിപ്തുകാരനായ യജമാനന്റെ വീട്ടിൽ ആയിരുന്നു.
  to: യഹ്‌വേ യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു; അവൻ വിജയിയായ മനുഷ്യനായി; അവൻ തന്റെ ഈജിപ്തുകാരനായ യജമാനന്റെ വീട്ടിലായിരുന്നു.
