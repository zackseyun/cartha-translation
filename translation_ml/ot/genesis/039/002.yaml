id: GEN.39.2
reference: Genesis 39:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: ml
  text: യഹ്‌വേ യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു; അവൻ വിജയിയായ മനുഷ്യനായി; അവൻ തന്റെ ഈജിപ്തുകാരനായ യജമാനന്റെ വീട്ടിലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת יוֹסֵף
  choice: യോസേഫിനോടുകൂടെ
  rationale: ദൈവസാന്നിധ്യവും അനുഗ്രഹവും സൂചിപ്പിക്കുന്ന ‘യോസേഫിനോടുകൂടെ’ എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ מַצְלִיחַ
  choice: കാര്യസിദ്ധിയുള്ളവൻ
  rationale: സാമ്പത്തിക സമൃദ്ധിയിൽ മാത്രം അർഥം ചുരുക്കാതെ, അവന്റെ പ്രവർത്തനങ്ങൾ വിജയിക്കുന്ന ഒരാൾ എന്ന വിശാലമായ ആശയം നൽകുന്നു.
- source_word: בְּבֵית אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ വീട്ടിൽ
  rationale: ‘വീട്ടിൽ’ എന്ന സ്ഥലസൂചനയും യോസേഫിന്മേലുള്ള യജമാനന്റെ അധികാരബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַמִּצְרִי
  choice: ഈജിപ്തുകാരനായ
  rationale: യജമാനനെ ഈജിപ്തുകാരനായി വിശേഷിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ attributive force സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: ഉണ്ടായിരുന്നു ... ആയി ... ആയിരുന്നു
  rationale: ആവർത്തിക്കുന്ന היה രൂപങ്ങളുടെ ഘടന കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു പദവി പകരംവയ്ക്കാതെ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യോസേഫിന്റെ വിജയവും യഹ്‌വേയുടെ സാന്നിധ്യവും തമ്മിലുള്ള ബന്ധം
  choice: അതുകൊണ്ട്
  alternative: ബന്ധസൂചക പദമില്ലാതെ ‘അവൻ കാര്യസിദ്ധിയുള്ളവനായി’
  rationale: തുടർച്ചയായ വാക്യങ്ങൾ ദൈവസാന്നിധ്യവും യോസേഫിന്റെ വിജയവും ബന്ധിപ്പിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ ആ ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ വിജയത്തിന്റെ കൃത്യരീതി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കാര്യസിദ്ധിയുള്ളവൻ’ സാമ്പത്തിക സമൃദ്ധി മാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നിലനിർത്തുന്നു.
