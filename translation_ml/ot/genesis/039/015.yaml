- from: ഞാൻ ശബ്ദമുയർത്തി നിലവിളിച്ചതുകേട്ടപ്പോൾ[a], അവൻ തന്റെ വസ്ത്രം എന്റെ അരികിൽ[b] ഉപേക്ഷിച്ച് ഓടി പുറത്തേക്കുപോയി.”
  to: ഞാൻ ശബ്ദമുയർത്തി നിലവിളിച്ചതായി[a] അവൻ കേട്ടപ്പോൾ, അവൻ തന്റെ വസ്ത്രം എന്റെ അരികിൽ[b] ഉപേക്ഷിച്ച് ഓടി പുറത്തേക്കു പോയി.”
