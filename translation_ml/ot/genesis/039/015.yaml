id: GEN.39.15
reference: Genesis 39:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: ml
  text: ഞാൻ ശബ്ദമുയർത്തി നിലവിളിച്ചതായി[a] അവൻ കേട്ടപ്പോൾ, അവൻ തന്റെ വസ്ത്രം എന്റെ അരികിൽ[b] ഉപേക്ഷിച്ച് ഓടി പുറത്തേക്കു പോയി.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ എന്റെ ശബ്ദമുയർത്തി വിളിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ പക്കൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: കേട്ടപ്പോൾ
  rationale: וַיְהִי ചേർന്ന കാലസൂചക ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമായി നൽകുന്നു; സംഭവക്രമവും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: -ത്
  rationale: അവൻ കേട്ടതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഘടകമായി മലയാളത്തിലെ നാമവത്കൃത ക്രിയാരൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: ഞാൻ ശബ്ദമുയർത്തി
  rationale: ‘എന്റെ ശബ്ദം ഉയർത്തി’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וָאֶקְרָא
  choice: നിലവിളിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ קרא സഹായത്തിനോ മുന്നറിയിപ്പിനോ വേണ്ടിയുള്ള ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ അടിയന്തരത വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: അവൻ തന്റെ വസ്ത്രം ഉപേക്ഷിച്ച്
  rationale: בגד എന്ന ഏകവചനത്തെ ‘വസ്ത്രം’ എന്നു നിലനിർത്തുകയും עזב-ന്റെ ഉപേക്ഷിച്ചുപോകൽ എന്ന ഭാവം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶצְלִי
  choice: എന്റെ അരികിൽ
  rationale: സമീപസ്ഥിതി സൂചിപ്പിക്കുന്ന പ്രധാന അർഥം നൽകുന്നു; ‘എന്റെ പക്കൽ’ എന്നത് കൈവശം എന്ന അർഥവും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיָּנָס
  choice: ഓടി
  rationale: נוס-ന്റെ പെട്ടെന്നുള്ള പലായനഭാവം തുടർന്നുള്ള ‘പുറത്തേക്കുപോയി’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: പുറത്തേക്കുപോയി
  rationale: വീടിനു പുറത്തേക്കുള്ള ദിശാഗതിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ആരോപണവാക്കിന്റെ നേരിട്ടുള്ള ഉദ്ധരണി അവസാനിക്കുന്നതിനാൽ അവസാന ഉദ്ധരണിച്ചിഹ്നം ചേർത്തിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു തൊട്ടുപിന്നിൽ നൽകിയിരിക്കുന്നു.
