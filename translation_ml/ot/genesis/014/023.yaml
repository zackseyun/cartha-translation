  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: ml
  text: ഒരു നൂൽ മുതൽ ചെരിപ്പിന്റെ വാറ് വരെ, നിനക്കുള്ള യാതൊന്നും ഞാൻ എടുക്കുകയില്ല; ‘ഞാനാണ് അബ്രാമിനെ സമ്പന്നനാക്കിയത്’ എന്നു നീ പറയാതിരിക്കാനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: ഞാൻ എടുക്കുകയില്ല
  rationale: മുൻവാക്യത്തിൽ കൈ ഉയർത്തി ചെയ്ത ശപഥത്തിന്റെ തുടർച്ചയായതിനാൽ, എബ്രായത്തിലെ അപൂർണമായ אִם-ശപഥപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം നിഷേധരൂപത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: מִחוּט
  choice: ഒരു നൂൽമുതൽ
  rationale: חוּט എന്ന പദത്തിന്റെ മൂർത്തമായ ‘നൂൽ’ എന്ന അർഥവും ഏറ്റവും നിസ്സാരമായ വസ്തുവെന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: ചെരിപ്പിന്റെ വാറുവരെ
  rationale: പുരാതന പാദരക്ഷയിലെ കെട്ടുവാറിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചെരിപ്പിന്റെ വാർ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും കാലസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: אֶקַּח
  choice: ഞാൻ എടുക്കുകയില്ല
  rationale: ശപഥസന്ദർഭത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്ന ഉറച്ച നിരാകരണം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: നിനക്കുള്ള യാതൊന്നും
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും לָךְ എന്നതിന്റെ ഉടമസ്ഥതാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא תֹאמַר
  choice: എന്നു നീ പറയാതിരിക്കേണ്ടതിനുതന്നെ
  rationale: അബ്രാം സാധനങ്ങൾ നിരസിക്കുന്നതിന്റെ നിഷേധാത്മക ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ‘തന്നെ’ ഊന്നൽ നൽകുന്നു, പുതിയ ആശയം ചേർക്കുന്നില്ല.
- source_word: הֶעֱשַׁרְתִּי
  choice: ഞാനാണ് ... സമ്പന്നനാക്കിയത്
  rationale: עשר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപമായ ‘സമ്പന്നനാക്കുക’ എന്ന കാരണാർഥം നിലനിർത്തുന്നു; സാധ്യതയുള്ള അവകാശവാദത്തിന്റെ ഊന്നലും പ്രകടമാക്കുന്നു.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: പേരിന്റെ പരമ്പരാഗതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: അപൂർണമായ ശപഥവാക്യഘടന
  choice: 'വാക്യം ശപഥപൂർവമായ സമ്പൂർണ നിരാകരണമായി അവതരിപ്പിച്ചു: ‘ഞാൻ എടുക്കുകയില്ല.’'
  alternative: ‘ഒരു നൂൽമുതൽ ... എങ്കിൽ, നിനക്കുള്ളതിൽനിന്ന് ഞാൻ എടുത്താൽ ...’ എന്നിങ്ങനെ എബ്രായഘടന അക്ഷരാർഥത്തിൽ അപൂർണമായി നിലനിർത്തുക.
  rationale: אִם ... וְאִם എന്നത് ഇവിടെ സാധാരണ വ്യവസ്ഥാവാക്യമല്ല; 22-ാം വാക്യത്തിലെ ശപഥത്തിന്റെ തുടർച്ചയായ, ശിക്ഷാഫലം പറയാതെ വിട്ടിരിക്കുന്ന ശപഥസൂത്രമാണ്. അതിന്റെ യഥാർഥ ആശയം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നിഷേധമായി വ്യക്തമാക്കി, ശപഥത്തിന്റെ ഉള്ളടക്കത്തിൽ ഒന്നും കൂട്ടിച്ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ദൃശ്യമായ ചെറുവസ്തുക്കളുടെ പ്രയോഗം നിലനിർത്തി; ശപഥത്തിന്റെ അപൂർണ എബ്രായഘടന മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമാക്കി, അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
