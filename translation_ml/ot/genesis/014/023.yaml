revisions:
- from: ഒരു നൂൽമുതൽ ചെരിപ്പിന്റെ വാറുവരെ[a], നിനക്കുള്ള യാതൊന്നും ഞാൻ എടുക്കുകയില്ല; ‘ഞാനാണ് അബ്രാമിനെ സമ്പന്നനാക്കിയത്’ എന്നു നീ പറയാതിരിക്കേണ്ടതിനുതന്നെ.
  to: ഒരു നൂൽ മുതൽ ചെരിപ്പിന്റെ വാറ് വരെ, നിനക്കുള്ള യാതൊന്നും ഞാൻ എടുക്കുകയില്ല; ‘ഞാനാണ് അബ്രാമിനെ സമ്പന്നനാക്കിയത്’ എന്നു നീ പറയാതിരിക്കാനായി.
