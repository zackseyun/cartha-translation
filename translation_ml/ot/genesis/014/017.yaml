translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. ഹീബ്രുവിലെ സർവനാമം മലയാളത്തിൽ തെറ്റായ മുൻപദവുമായി ബന്ധിപ്പിക്കപ്പെടാതിരിക്കാൻ മുൻസന്ദർഭത്തിലെ ‘അബ്രാം’ വ്യക്തമായി ചേർത്തു.
