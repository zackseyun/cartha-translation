  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: ml
  text: കെദോർലായോമെരിനെയും അവനോടൊപ്പമുണ്ടായിരുന്ന രാജാക്കന്മാരെയും തോൽപ്പിച്ച് അബ്രാം മടങ്ങിവന്നശേഷം, സൊദോമിലെ രാജാവ് അവനെ കണ്ടുമുട്ടാൻ ശാവേ താഴ്വരയിലേക്കു[a] പുറപ്പെട്ടു. അതായത്, രാജാവിന്റെ താഴ്വര.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശാവേ താഴ്വരയിൽ.’ ഇവിടെ ഹീബ്രുവിലെ മുൻവാക്യം ദിശയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ശാവേ താഴ്വരയിലേക്ക്’ എന്നാണ് വിവർത്തനം ചെയ്തിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമം വാക്യഘടനയിലൂടെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കേണ്ടതില്ല.
- source_word: מֶלֶךְ סְדֹם
  choice: സൊദോംരാജാവ്
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ കാണാനായി
  rationale: ഒരാളെ എതിരേറ്റുചെല്ലുക/കണ്ടുമുട്ടുക എന്ന ലക്ഷ്യത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: അബ്രാം മടങ്ങിവന്നശേഷം
  rationale: ഹീബ്രുവിൽ ‘അവൻ മടങ്ങിവന്നശേഷം’ എന്ന സർവനാമരൂപമാണെങ്കിലും, ഒറ്റവാക്യമായി മലയാളത്തിൽ നൽകിയാൽ അത് കെദോർലായോമെരിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം. മുൻസന്ദർഭത്തിൽ വ്യക്തമായ അബ്രാമിനെ പേരെടുത്ത് പറയുന്നത് സന്ദർഭാധിഷ്ഠിതമായ വ്യക്തീകരണമാണ്.
- source_word: מֵהַכּוֹת
  choice: തോൽപ്പിച്ച്
  rationale: נכה എന്ന ക്രിയയുടെ ഈ സൈനികസന്ദർഭത്തിലെ അർഥം വെറും ‘അടിക്കുക’ എന്നതല്ല, യുദ്ധത്തിൽ പരാജയപ്പെടുത്തുക എന്നതാണ്.
- source_word: כְּדָרלָעֹמֶר
  choice: കെദോർലായോമെർ
  rationale: ഹീബ്രു നാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: അവനോടൊപ്പമുണ്ടായിരുന്ന രാജാക്കന്മാരെയും
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ കെദോർലായോമെരിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: ശാവേ താഴ്വരയിലേക്ക്
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചകശക്തി ‘-യിലേക്ക്’ വഴി സംരക്ഷിക്കുന്നു; ശാവേ സ്ഥലനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: അതാണു രാജാവിന്റെ താഴ്വര
  rationale: സ്ഥലത്തെ തിരിച്ചറിയിക്കുന്ന ഹീബ്രു വിശദീകരണം പ്രത്യേക വാക്യമായി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
