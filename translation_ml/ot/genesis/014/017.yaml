  terminology: അബ്രാം, സൊദോം, കെദോർലായോമെർ, ശാവേ എന്നീ പേരുകൾ സ്ഥിരതയുള്ള മലയാള ലിപ്യന്തരണത്തിലാണ്. ‘രാജാവിന്റെ താഴ്വര’ എന്നത് עֵמֶק הַמֶּלֶךְ എന്നതിന്റെ നേരിയതും അസന്ദിഗ്ധവുമായ വിവർത്തനമാണ്.
