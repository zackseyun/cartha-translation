base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: ml
  text: 'ശിനാർരാജാവായ അമ്രാഫെലിന്റെയും എലാസാർരാജാവായ അര്യോക്കിന്റെയും ഏലാംരാജാവായ കെദോർലായോമെരിന്റെയും ജനതകളുടെ രാജാവായ തിദാലിന്റെയും[a] കാലത്ത് ഇങ്ങനെ സംഭവിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗോയീംരാജാവായ തിദാൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗּוֹיִם (ഗോയീം) എന്ന ഹീബ്രായപദത്തിന് സാധാരണയായി “ജനതകൾ” എന്നാണ് അർഥം; എന്നാൽ ഈ വാക്യത്തിലെ മറ്റു രാജപദവികളുടെ മാതൃകയനുസരിച്ച് ഇവിടെ അത് ഒരു സ്ഥലനാമമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ചയും തുടർന്നുവരുന്ന സംഭവത്തിലേക്കുള്ള അവതരണവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പഴഞ്ചൻ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: בִּימֵי
  choice: കാലത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ദിവസങ്ങളിൽ’ എന്നതിനെക്കാൾ രാജാക്കന്മാരുടെ ഭരണകാലത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘കാലത്ത്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַמְרָפֶל מֶלֶךְ שִׁנְעָר
  choice: ശിനാർരാജാവായ അമ്രാഫെൽ
  rationale: വ്യക്തിനാമവും സ്ഥലനാമവും ലിപ്യന്തരണം ചെയ്ത്, ഹീബ്രായത്തിലെ രാജപദവി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַרְיוֹךְ מֶלֶךְ אֶלָּסָר
  choice: എലാസാർരാജാവായ അര്യോക്ക്
  rationale: പേരുകളും രാജപദവിയും മൂലപാഠത്തിലെ സമാന്തര ഘടന അനുസരിച്ച് നൽകുന്നു.
- source_word: כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם
  choice: ഏലാംരാജാവായ കെദോർലായോമെർ
  rationale: ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത ലിപ്യന്തരണവും രാജപദവിയുടെ വ്യക്തമായ ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: ജനതകളുടെ രാജാവായ തിദാൽ
  rationale: גּוֹיִם എന്ന പദത്തിന്റെ സാധാരണ നിഘണ്ടുർഥമായ ‘ജനതകൾ’ മുഖ്യപാഠത്തിൽ നൽകുന്നു; ഇത് സ്ഥലനാമമായിരിക്കാമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
