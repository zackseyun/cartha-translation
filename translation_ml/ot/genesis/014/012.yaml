id: GEN.14.12
reference: Genesis 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת ל֧וֹט וְ/אֶת רְכֻשׁ֛/וֹ בֶּן אֲחִ֥י אַבְרָ֖ם וַ/יֵּלֵ֑כוּ וְ/ה֥וּא יֹשֵׁ֖ב בִּ/סְדֹֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: ml
  text: അവർ അബ്രാമിന്റെ സഹോദരപുത്രനായ ലോത്തിനെയും[a] അവന്റെ സമ്പത്തിനെയും കൊണ്ടുപോയി. അവൻ സൊദോമിൽ താമസിച്ചുവരികയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അബ്രാമിന്റെ സഹോദരന്റെ മകൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: അവർ ... കൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്നാണ്. കൊള്ളയുടെയും തടവിന്റെയും പശ്ചാത്തലത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; ‘പിടിച്ചെടുത്തു’ എന്നത് മൂലക്രിയയെക്കാൾ ശക്തമായ വ്യാഖ്യാനമാകും.
- source_word: רְכֻשׁוֹ
  choice: അവന്റെ സമ്പത്ത്
  rationale: רְכוּשׁ ചലസ്വത്തും കൈവശമുള്ള വസ്തുക്കളും സൂചിപ്പിക്കുന്നു. ‘സമ്പത്ത്’ ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: അബ്രാമിന്റെ സഹോദരപുത്രനായ
  rationale: എബ്രായത്തിലെ ‘അബ്രാമിന്റെ സഹോദരന്റെ മകൻ’ എന്ന ബന്ധസൂചന മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി ‘സഹോദരപുത്രൻ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַיֵּלֵכוּ
  choice: കൊണ്ടുപോയി
  rationale: הלך ഇവിടെ സാധാരണയായി ‘പോയി’ എന്നാണ്. മലയാളത്തിൽ ‘എടുത്തു ... പോയി’ എന്ന സംയുക്തക്രിയയെ ‘കൊണ്ടുപോയി’ എന്നു നൽകുന്നത് ആവർത്തനം ഒഴിവാക്കി സംഭവത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: അവൻ സൊദോമിൽ താമസിച്ചുവരികയായിരുന്നു
  rationale: ഈ ഖണ്ഡം ലോത്തിന്റെ അന്നത്തെ വാസസ്ഥലം പശ്ചാത്തലവിവരമായി നൽകുന്നു. יֹשֵׁב എന്നതിന്റെ തുടർച്ചാഭാവം ‘താമസിച്ചുവരികയായിരുന്നു’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בֶּן אֲחִי אַבְרָם എന്ന ബന്ധപദത്തിന്റെ അവതരണം
  choice: സഹോദരപുത്രൻ എന്ന കൃത്യമായ ബന്ധപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: മരുമകൻ / അനന്തരവൻ
  rationale: ‘മരുമകൻ’ തെറ്റായ ബന്ധം സൂചിപ്പിക്കാം; ‘അനന്തരവൻ’ ചില വായനക്കാർക്ക് അസ്പഷ്ടമാണ്. ‘സഹോദരപുത്രൻ’ മൂലപാഠത്തിലെ ബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. എബ്രായ വാക്യക്രമം മൂലമുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ബന്ധസൂചന ലോത്തിനോട് ചേർത്തിരിക്കുന്നു; പശ്ചാത്തലവിവരം വേറൊരു വാക്യമായി നിലനിർത്തിയിരിക്കുന്നു.
