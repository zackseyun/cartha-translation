revisions:
- from: ശാലേംരാജാവായ മെൽക്കീസേദെക്ക് അപ്പവും വീഞ്ഞും കൊണ്ടുവന്നു. അവൻ അത്യുന്നതനായ ദൈവത്തിന്റെ പുരോഹിതനായിരുന്നു.
  to: ശാലേമിലെ രാജാവായ മെൽക്കീസേദെക്ക് അപ്പവും വീഞ്ഞും പുറത്തുകൊണ്ടുവന്നു. അവൻ അത്യുന്നതനായ ദൈവത്തിന്റെ പുരോഹിതനായിരുന്നു.
  rationale: The revision makes the royal apposition idiomatic in modern Malayalam and more fully represents the concrete ‘brought out’ action. It retains the source’s two clauses, its simple reference to bread and wine, and its designation of Melchizedek as priest of God Most High, without theological expansion.
