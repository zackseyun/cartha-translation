id: GEN.14.18
reference: Genesis 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: ml
  text: ശാലേമിലെ രാജാവായ മെൽക്കീസേദെക്ക് അപ്പവും വീഞ്ഞും പുറത്തുകൊണ്ടുവന്നു. അവൻ അത്യുന്നതനായ ദൈവത്തിന്റെ പുരോഹിതനായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: മെൽക്കീസേദെക്ക്
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֶלֶךְ שָׁלֵם
  choice: ശാലേംരാജാവായ
  rationale: מֶלֶךְ എന്നത് ‘രാജാവ്’ എന്നും שָׁלֵם എന്ന സ്ഥലനാമം ‘ശാലേം’ എന്നും നൽകി; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: הוֹצִיא
  choice: കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ ക്രിയയുടെ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗം.
- source_word: לֶחֶם וָיָיִן
  choice: അപ്പവും വീഞ്ഞും
  rationale: ഭക്ഷ്യവസ്തുക്കളെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദങ്ങൾ; പിന്നീടുള്ള ആചാരപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: כֹהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാപരമായ ശുശ്രൂഷകനെ സൂചിപ്പിക്കുന്ന പദം; പിന്നീടുള്ള ഇസ്രായേല്യ പുരോഹിതക്രമത്തിന്റെ പ്രത്യേകതകൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: אֵל עֶלְיוֹן
  choice: അത്യുന്നതനായ ദൈവം
  rationale: ദൈവിക സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്തു; ‘എൽ എല്യോൻ’ എന്ന അപരിചിത ലിപ്യന്തരണം ഒഴിവാക്കി.
- source_word: וְהוּא
  choice: അവൻ ... ആയിരുന്നു
  rationale: പുതിയ ഉപവാക്യത്തിൽ മെൽക്കീസേദെക്കിന്റെ പദവി വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല നാമവാക്യമായി നൽകി.
theological_decisions:
- issue: അപ്പവും വീഞ്ഞും കൊണ്ടുവന്നതിൽ പിന്നീടുള്ള കൂദാശാപരമായ അർഥം മുൻനിർത്തണമോ
  choice: ചരിത്രവിവരണത്തിന്റെ ലളിതമായ വാക്കുകൾ മാത്രം നിലനിർത്തി
  alternative: കർത്തൃഭോജനത്തെ മുൻകൂട്ടി സൂചിപ്പിക്കുന്ന തരത്തിലുള്ള പദപ്രയോഗം ഉപയോഗിക്കുക
  rationale: ഉല്പത്തി 14:18 ഇവിടെ അപ്പവും വീഞ്ഞും കൊണ്ടുവന്നതായി മാത്രം പറയുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്ര വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കരുത്.
- issue: אֵל עֶלְיוֹן എന്നത് പേരായി ലിപ്യന്തരണം ചെയ്യണമോ സ്ഥാനപ്പേരായി വിവർത്തനം ചെയ്യണമോ
  choice: അത്യുന്നതനായ ദൈവം
  alternative: എൽ എല്യോൻ
  rationale: ഈ പ്രയോഗത്തിന്റെ ദൈവിക സ്ഥാനപ്പേരായ അർഥം മലയാള വായനക്കാർക്ക് നേരിട്ട് വ്യക്തമാക്കുന്നു; മൂലത്തിലെ അർഥബലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ടു ഉപവാക്യങ്ങൾ രണ്ടു വാക്യങ്ങളായി നിലനിർത്തി. വിശദീകരണപരമോ വിഭാഗീയമോ ആയ പദങ്ങൾ ചേർത്തിട്ടില്ല.
