id: GEN.14.2
reference: Genesis 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: ml
  text: അവർ സൊദോമിന്റെ രാജാവായ ബേരാവിനോടും, ഗൊമോരയുടെ രാജാവായ ബിർശാവിനോടും, അദ്മായുടെ രാജാവായ ശിനാബിനോടും, സെബോയീമിന്റെ രാജാവായ ശെമേബെരിനോടും, ബേലായുടെ രാജാവിനോടും (ബേലാ, അതായത് സോവർ) യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: യുദ്ധം ചെയ്തു
  rationale: ‘യുദ്ധം ചെയ്യുക’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ ഘടനയും അർഥവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת ... וְאֶת
  choice: …യോടും
  rationale: ഈ സന്ദർഭത്തിൽ കർമസൂചകം യുദ്ധത്തിന്റെ എതിർപക്ഷങ്ങളെ അവതരിപ്പിക്കുന്നു. ഓരോ രാജാവിനോടും ‘-യോടും/-നോടും’ ചേർത്തത് അഞ്ചുപേരും ഒരേ ക്രിയയുടെ സമാന്തര കർമങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בֶּרַע
  choice: ബേരാ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ סְדֹם
  choice: സൊദോംരാജാവായ
  rationale: രാജപദവിയും സ്ഥലനാമവും മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപത്തിൽ നൽകി.
- source_word: בִּרְשַׁע
  choice: ബിർശാ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: עֲמֹרָה
  choice: ഗൊമോര
  rationale: മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: שִׁנְאָב
  choice: ശിനാബ്
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: אַדְמָה
  choice: അദ്മാ
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: שֶׁמְאֵבֶר
  choice: ശെമേബെർ
  rationale: വ്യക്തിനാമത്തിലെ സ്വരക്രമം കഴിയുന്നത്ര നിലനിർത്തി മലയാളലിപിയിൽ നൽകി.
- source_word: צביים
  choice: സെബോയീം
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമരൂപത്തിന്റെ സ്വരവിന്യാസം പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: מֶלֶךְ בֶּלַע
  choice: ബേലാരാജാവ്
  rationale: അവസാന രാജാവിന്റെ വ്യക്തിനാമം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ നഗരംകൊണ്ടുള്ള തിരിച്ചറിയൽ അതേപടി നിലനിർത്തി.
- source_word: הִיא צֹעַר
  choice: ബേലാ സോവർ തന്നെയാണ്
  rationale: ബേലായെ സോവറുമായി തിരിച്ചറിയുന്ന വിശദീകരണസ്വഭാവമുള്ള വാക്യഘടകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിൽ കർമസൂചകം ആദ്യ രണ്ടു പേരുകൾക്കു മാത്രമായി ആവർത്തിച്ചാലും, അഞ്ചു രാജാക്കന്മാരും യുദ്ധത്തിന്റെ എതിർപക്ഷങ്ങളാണെന്ന സമാന്തര പട്ടികാസ്വഭാവം മലയാളത്തിൽ ഓരോ പേരോടും വിഭക്തി ചേർത്ത് വ്യക്തമാക്കി. പാഠത്തിൽ ഇല്ലാത്ത അവസാന രാജാവിന്റെ വ്യക്തിനാമം ചേർത്തിട്ടില്ല.
