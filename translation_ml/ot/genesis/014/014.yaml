id: GEN.14.14
reference: Genesis 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: ml
  text: തന്റെ സഹോദരൻ[a] തടവിലാക്കപ്പെട്ടിരിക്കുന്നു എന്നു അബ്രാം കേട്ടപ്പോൾ, തന്റെ വീട്ടിൽ ജനിച്ചവരായ പരിശീലനം ലഭിച്ച മുന്നൂറ്റിപ്പതിനെട്ടു പേരെ അദ്ദേഹം അണിനിരത്തി[b], ദാൻവരെ അവരെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “അവന്റെ സഹോദരൻ”; ഈ പദം അനന്തരവൻപോലുള്ള അടുത്ത പുരുഷബന്ധുവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ എബ്രായക്രിയയ്ക്ക് “പുറത്തിറക്കി,” “നയിച്ചുപുറത്തിറക്കി,” അല്ലെങ്കിൽ ഒരുപക്ഷേ “ആയുധമണിയിച്ചു” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: തടവുകാരനായി കൊണ്ടുപോയി
  rationale: നിഫാൽ രൂപം യുദ്ധത്തിൽ പിടിച്ചുകൊണ്ടുപോകപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സൈനികസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אָחִיו
  choice: തന്റെ സഹോദരനെ
  rationale: ലോത്ത് അനന്തരവനായിരുന്നെങ്കിലും, എബ്രായത്തിലെ אָח അടുത്ത പുരുഷബന്ധുവിനെയും സൂചിപ്പിക്കാം. മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ബന്ധപദം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וַיָּרֶק
  choice: അണിനിരത്തി
  rationale: വിവാദമുള്ള ഈ ക്രിയ ഇവിടെ ആളുകളെ പിന്തുടരലിനായി സജ്ജരാക്കുകയോ പുറപ്പെടുവിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. 'അണിനിരത്തി' സൈനികസന്ദർഭത്തിന് യോജിക്കുകയും 'ആയുധമണിയിച്ചു' എന്ന പ്രത്യേക അർത്ഥത്തിൽ അമിതമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חֲנִיכָיו
  choice: പരിശീലനം ലഭിച്ച ... പേരെ
  rationale: അബ്രാമിന്റെ അധികാരത്തിൻകീഴിൽ പരിശീലിപ്പിക്കപ്പെട്ട പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി എണ്ണം ചേർത്ത് അവതരിപ്പിച്ചു.
- source_word: יְלִידֵי בֵיתוֹ
  choice: തന്റെ വീട്ടിൽ ജനിച്ചവരായ
  rationale: വീട്ടിൽ ജനിച്ച ആശ്രിതരെന്ന സാമൂഹികസ്ഥിതി ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: മുന്നൂറ്റിപ്പതിനെട്ടുപേരെ
  rationale: എബ്രായത്തിലെ പൂർണ്ണ സംഖ്യ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיִּרְדֹּף
  choice: പിന്തുടർന്നു
  rationale: ഇവിടെ സൈനികമായ പിന്തുടരലാണ്; കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി 'അവരെ' എന്നു ചേർത്തു.
- source_word: עַד דָּן
  choice: ദാൻവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന പിന്തുടരലിന്റെ പരിധി സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
theological_decisions:
- issue: ലോത്തിനുള്ള ബന്ധപദം
  choice: പ്രധാനപാഠത്തിൽ 'സഹോദരൻ' നിലനിർത്തുക
  alternative: ബന്ധു / അടുത്ത പുരുഷബന്ധു
  rationale: എബ്രായപാഠം אָחִיו എന്നു പറയുന്നു; അത് സഹോദരനല്ലാത്ത അടുത്ത പുരുഷബന്ധുവിനെയും സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിന്റെ രൂപവും അതിലെ ബന്ധപരമായ തീവ്രതയും വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നിലനിർത്തുന്നു.
- issue: וַיָּרֶק എന്ന ക്രിയയുടെ അനിശ്ചിതത്വം
  choice: '''അണിനിരത്തി'' എന്നു പരിഭാഷപ്പെടുത്തി പകരർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുക'
  alternative: പുറത്തിറക്കി / ആയുധമണിയിച്ചു
  rationale: ക്രിയയുടെ കൃത്യമായ സൂക്ഷ്മാർഥം വിവാദവിധേയമാണ്. സന്ദർഭോചിതമായ പൊതുവായ സൈനികപ്രയോഗം മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ബന്ധപദമായ 'സഹോദരൻ' മൂലപാഠാനുസൃതമായി നിലനിർത്തി; വിവാദക്രിയയ്ക്ക് സ്വാഭാവികമായെങ്കിലും അതിവിശദമല്ലാത്ത സൈനികപ്രയോഗം തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
