  to: തന്റെ സഹോദരൻ[a] തടവിലാക്കപ്പെട്ടിരിക്കുന്നു എന്നു അബ്രാം കേട്ടപ്പോൾ, തന്റെ വീട്ടിൽ ജനിച്ചവരായ പരിശീലനം ലഭിച്ച മുന്നൂറ്റിപ്പതിനെട്ടു പേരെ അദ്ദേഹം അണിനിരത്തി[b], ദാൻവരെ അവരെ പിന്തുടർന്നു.
  rationale: വാക്യത്തിന്റെ അർഥം മാറ്റാതെ നിഷ്ക്രിയക്രിയയുടെ രൂപം കൂടുതൽ കൃത്യമായി പരിഭാഷപ്പെടുത്തി. ‘സഹോദരൻ’ എന്ന മൂലപാഠാനുസൃത മുഖ്യവായന നിലനിർത്തി, അതിന്റെ സന്ദർഭാനുസൃത വിശാലബന്ധുസാധ്യതയെ പുതിയ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി. וַיָּרֶק-ന്റെ വിവാദസൂക്ഷ്മാർഥം മുഖ്യപാഠത്തിലെ പൊതുവായ സൈനികപ്രയോഗവും വേറിട്ട അടിക്കുറിപ്പും വഴി നിലനിർത്തി.
