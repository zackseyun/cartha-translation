  source_fidelity: മുഖ്യപാഠത്തിലെ ‘സഹോദരൻ’ എബ്രായ אָחִיו-യുടെ നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തുന്നു; എങ്കിലും ലോത്ത് അബ്രാമിന്റെ അനന്തരവനാണെന്ന സന്ദർഭവും אָח-ന്റെ വിശാലബന്ധു-പ്രയോഗവും അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കണം. נִשְׁבָּה-യുടെ നിഷ്ക്രിയമായ ‘തടവിലാക്കപ്പെട്ടു’ എന്ന രൂപം ‘തടവുകാരനായി കൊണ്ടുപോയി’ എന്നതിനെക്കാൾ മൂലപാഠത്തോടു കൂടുതൽ അടുത്തതാണ്. וַיָּרֶק-ന്റെ അനിശ്ചിതത്വം ‘അണിനിരത്തി’ എന്ന മുഖ്യവാചകവും അടിക്കുറിപ്പും യോജ്യമായി സംരക്ഷിക്കുന്നു.
  naturalness: ‘തടവിലാക്കപ്പെട്ടിരിക്കുന്നു എന്നു’യും ക്രമബദ്ധമായ ഏകവാക്യഘടനയും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ള ആഖ്യാനരജിസ്റ്ററിനൊത്തതുമാണ്. ‘ദാൻവരെ’ സ്വാഭാവികമാണ്.
