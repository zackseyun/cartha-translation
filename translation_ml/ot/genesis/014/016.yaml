source:
  edition: WLC
  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: ml
  text: അവൻ സമ്പത്തെല്ലാം തിരികെ കൊണ്ടുവന്നു; തന്റെ ബന്ധുവായ[a] ലോത്തിനെയും അവന്റെ സമ്പത്തിനെയും സ്ത്രീകളെയും ജനത്തെയും കൂടി അവൻ തിരികെ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ ബന്ധു” എന്നതിന്റെ എബ്രായപദം അക്ഷരാർഥത്തിൽ “തന്റെ സഹോദരൻ” എന്നാണ്. ഇവിടെ അത് അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; കഥയനുസരിച്ച് ലോത്ത് അബ്രാമിന്റെ സഹോദരപുത്രനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: തിരികെ കൊണ്ടുവന്നു
  rationale: ശൂബ് എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപങ്ങൾ ഇവിടെ വസ്തുക്കളെയും ആളുകളെയും മടക്കിക്കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തനം എബ്രായവാക്യത്തിലെ രണ്ടു പ്രധാന ക്രിയകളെയും നിലനിർത്തുന്നു.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: സമ്പത്തെല്ലാം / അവന്റെ സമ്പത്ത്
  rationale: רְכוּשׁ ചലനീയമായ സ്വത്തുക്കൾ, വസ്തുവകകൾ, സമ്പത്ത് എന്നിവയെ വ്യാപകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സമ്പത്ത്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְגַם
  choice: -യും ... -യുംകൂടി
  rationale: രണ്ടുതവണ വരുന്ന കൂട്ടിച്ചേർക്കൽശക്തി മലയാളത്തിലെ സമുച്ചയപ്രത്യയങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לוֹט אָחִיו
  choice: തന്റെ ബന്ധുവായ ലോത്ത്
  rationale: אָחִיו അക്ഷരാർഥത്തിൽ ‘അവന്റെ സഹോദരൻ’ എന്നാണെങ്കിലും വിശാലമായ ബന്ധുത്വവും സൂചിപ്പിക്കാം; കഥയിൽ ലോത്ത് അബ്രാമിന്റെ സഹോദരപുത്രനായതിനാൽ ‘ബന്ധു’ കൃത്യമാണ്.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകൾ
  rationale: ഈ പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ഭാര്യമാർ’ എന്ന് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: הָעָם
  choice: ജനം
  rationale: പിടിച്ചുകൊണ്ടുപോയ മുഴുവൻ ആളുകളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ രണ്ടു ക്രിയാഖണ്ഡങ്ങളും ‘തിരികെ കൊണ്ടുവന്നു’ എന്ന ആവർത്തനത്തിലൂടെ സൂക്ഷിച്ചു; പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമപ്പെടുത്തി.
