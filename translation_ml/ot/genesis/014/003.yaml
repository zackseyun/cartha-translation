  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: ml
  text: ഇവരെല്ലാവരും സിദ്ദീം താഴ്‌വരയിൽ ഒന്നിച്ചുകൂടി; അതാണ് ഉപ്പുകടൽ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, പിന്നീട് അറിയപ്പെട്ട പേരിൽ, ചാവുകടൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ഇവരെല്ലാവരും
  rationale: כָּל എന്ന സമഗ്രതാസൂചക പദവും אֵלֶּה എന്ന സൂചകസർവനാമവും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായി ‘ഇവരെല്ലാവരും’ എന്നു പരിഭാഷപ്പെടുത്തി. സന്ദർഭത്തിൽ രാജാക്കന്മാരെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, എബ്രായത്തിൽ ഇല്ലാത്ത ‘രാജാക്കന്മാർ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: חָבְרוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: חבר എന്ന ക്രിയയുടെ ഖാൽ രൂപം ഒന്നുചേരുക, കൂട്ടംചേരുക എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു. സൈനിക-രാഷ്ട്രീയ സഖ്യം എന്ന ആശയം സാധ്യമാണെങ്കിലും ‘സഖ്യമുണ്ടാക്കി’ എന്നു പറഞ്ഞ് അതിനെ അനാവശ്യമായി ശക്തമാക്കിയിട്ടില്ല.
- source_word: אֶל
  choice: -യിൽ
  rationale: אֶל സാധാരണയായി ദിശ സൂചിപ്പിക്കുന്നുവെങ്കിലും, കൂടിച്ചേരൽ സൂചിപ്പിക്കുന്ന ക്രിയയോടും സ്ഥലനാമത്തോടും ചേർന്ന ഇവിടെ കൂട്ടംചേർന്ന സ്ഥലം വ്യക്തമാക്കാൻ മലയാളത്തിൽ സ്ഥലവിഭക്തിയായ ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: സിദ്ദീം താഴ്‌വര
  rationale: עֵמֶק എന്നത് ‘താഴ്‌വര’ എന്നും הַשִּׂדִּים എന്ന സ്ഥലനാമം ‘സിദ്ദീം’ എന്നും നൽകി; മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമം പിന്തുടർന്നു.
- source_word: הוּא
  choice: അതാണു്
  rationale: മുൻപറഞ്ഞ സ്ഥലത്തെ മറ്റൊരു പേരിലൂടെ തിരിച്ചറിയിക്കുന്ന വിശദീകരണസർവനാമത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഉപ്പുകടൽ’ എന്നാണ്. പിന്നീട് പ്രചാരത്തിലായ ‘ചാവുകടൽ’ എന്ന പേര് മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ അടിക്കുറിപ്പിൽ നൽകി.
