  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ നിലനിർത്തി.
