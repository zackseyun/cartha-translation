id: GEN.14.22
reference: Genesis 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: ml
  text: 'എന്നാൽ അബ്രാം സൊദോമിലെ രാജാവിനോട് പറഞ്ഞു: “ആകാശത്തിന്റെയും ഭൂമിയുടെയും ഉടമയായ അത്യുന്നത ദൈവമായ യാഹ്‌വേയോടു ഞാൻ കൈ ഉയർത്തിയിരിക്കുന്നു[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൈ ഉയർത്തുക എന്നത് സത്യപ്രതിജ്ഞ ചെയ്യുമ്പോഴുള്ള ഒരു എബ്രായ ആംഗ്യമാണ്; ഇവിടെ അബ്രാം സത്യം ചെയ്യുകയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ആകാശത്തിന്റെയും ഭൂമിയുടെയും സ്രഷ്ടാവായ.” എബ്രായ പദത്തിന് ‘ഉടമ’, ‘കൈവശമുള്ളവൻ’, അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ ‘സ്രഷ്ടാവ്’ എന്നർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; തൊട്ടുമുമ്പുള്ള സൊദോംരാജാവിന്റെ നിർദേശത്തോടുള്ള അബ്രാമിന്റെ പ്രതികരണം വൈരുധ്യമുള്ളതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ סְדֹם
  choice: സൊദോംരാജാവ്
  rationale: നിർമാണബന്ധത്തെ സന്ദർഭാനുസൃതമായ സ്വാഭാവിക മലയാള സംയുക്തപദമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הֲרִימֹתִי יָדִי
  choice: ഞാൻ കൈ ഉയർത്തിയിരിക്കുന്നു
  rationale: ‘ഞാൻ സത്യം ചെയ്തിരിക്കുന്നു’ എന്നു വ്യാഖ്യാനിച്ചു മാറ്റാതെ, സത്യപ്രതിജ്ഞയുടെ മൂർത്തമായ എബ്രായ ആംഗ്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: אֵל עֶלְיוֹן
  choice: അത്യുന്നത ദൈവം
  rationale: പദവി ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥം പരിഭാഷപ്പെടുത്തുന്നു; עֶלְיוֹן എന്നതിന്റെ ഉയർച്ചയും പരമോന്നതത്വവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קֹנֵה
  choice: ഉടമയായ
  rationale: קנה എന്ന ധാതുവിന്റെ കർത്തൃവാചക രൂപം സ്വന്തമാക്കുന്നവൻ, കൈവശമുള്ളവൻ, ഉടമ, ചില സന്ദർഭങ്ങളിൽ സ്രഷ്ടാവ് എന്നീ അർത്ഥങ്ങൾ അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ ഉടമസ്ഥതയുടെ പ്രാഥമിക അർത്ഥം സൂക്ഷിച്ച് ‘സ്രഷ്ടാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: ആകാശത്തിന്റെയും ഭൂമിയുടെയും
  rationale: സൃഷ്ടിസമഗ്രതയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദ്വന്ദപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം നിലനിർത്തുന്നു.
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: ആകാശത്തിന്റെയും ഭൂമിയുടെയും ഉടമ
  alternative: ആകാശത്തിന്റെയും ഭൂമിയുടെയും സ്രഷ്ടാവ്
  rationale: എബ്രായ പദത്തിന് ഉടമസ്ഥതയും സൃഷ്ടികർത്തൃത്വവും ഉൾപ്പെടുന്ന അർത്ഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ ‘ഉടമ’ സ്വീകരിക്കുകയും യഥാർത്ഥമായ മറ്റൊരു വായനയായ ‘സ്രഷ്ടാവ്’ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ സത്യപ്രതിജ്ഞാ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും קֹנֵה എന്ന പദത്തിന്റെ അർത്ഥദ്വയവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
