  to: 'എന്നാൽ അബ്രാം സൊദോമിലെ രാജാവിനോട് പറഞ്ഞു: “ആകാശത്തിന്റെയും ഭൂമിയുടെയും ഉടമയായ അത്യുന്നത ദൈവമായ യാഹ്‌വേയോടു ഞാൻ കൈ ഉയർത്തിയിരിക്കുന്നു[a][b].”'
