  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: ml
  text: പിന്നെ അവർ ഏൻ-മിശ്പാത്ത്[a], അതായത് കാദേശ്, എന്ന സ്ഥലത്തേക്കു മടങ്ങിയെത്തി; അവർ അമാലേക്യരുടെ പ്രദേശം മുഴുവനും[b], ഹസസോൻ-താമാറിൽ താമസിച്ചിരുന്ന അമോര്യരെയും ആക്രമിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏൻ-മിശ്പാത്ത്’ എന്നതിന്റെ അർഥം ‘ന്യായവിധിയുടെ ഉറവ്’ എന്നാണ്.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അമാലേക്യരുടെ വയൽ/ദേശം മുഴുവനും.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘അമാലേക്യന്റെ വയൽ മുഴുവനും’ എന്നാണ്; അമാലേക്യർ അധിവസിച്ചിരുന്ന പ്രദേശമായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: 2 ദിനവൃത്താന്തം 20:2-ൽ ഹസസോൻ-താമാർ ഏൻ-ഗെദിയുമായി തിരിച്ചറിയപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: പിന്നെ അവർ മടങ്ങി
  rationale: ശൂബ് എന്ന ക്രിയയുടെ ദിശാമാറ്റവും തുടർച്ചയായ ആഖ്യാനക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: എത്തി
  rationale: ഒരു സ്ഥലത്തേക്കുള്ള സഞ്ചാരത്തിന്റെ പൂർത്തീകരണം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עֵין מִשְׁפָּט
  choice: ഏൻ-മിശ്പാത്ത്[a]
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הִוא קָדֵשׁ
  choice: അതായത് കാദേശിൽ
  rationale: രണ്ടു സ്ഥലനാമങ്ങളെയും തിരിച്ചറിയിക്കുന്ന ഹീബ്രു വിശദീകരണം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּכּוּ
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, ആക്രമിക്കുക, തോൽപ്പിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഫലം പൂർണവിജയമായി അതിരുകടന്ന് വ്യക്തമാക്കാതെ സന്ദർഭോചിതമായ ക്രിയ തിരഞ്ഞെടുത്തു.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: അമാലേക്യരുടെ പ്രദേശം മുഴുവനും
  rationale: שׂדה അക്ഷരാർഥത്തിൽ വയൽ എന്നാണെങ്കിലും ഇവിടെ ഒരു ജനവിഭാഗം അധിവസിച്ചിരുന്ന ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സമൂഹവാചിയായ ഏകവചന ജാതിനാമം മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: അമോര്യരെയും
  rationale: וְגַם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ '-യെയും' എന്ന രൂപത്തിൽ സ്വാഭാവികമായി സംരക്ഷിച്ചു; ജാതിനാമം സമൂഹവാചിയായി ബഹുവചനത്തിൽ നൽകി.
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: ഹസസോൻ-താമാറിൽ താമസിച്ചിരുന്ന
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ സ്ഥിരവാസ അർഥവും בְ എന്ന സ്ഥലസൂചക അവ്യയവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
