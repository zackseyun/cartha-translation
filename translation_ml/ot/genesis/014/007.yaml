  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. ഹീബ്രുവിലെ ക്രിയാപുനരാവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
