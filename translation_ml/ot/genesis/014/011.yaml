translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ രണ്ടു തുടർച്ചാക്രിയകൾ മലയാളത്തിൽ സ്വാഭാവികമായ ‘എടുത്തുകൊണ്ടുപോയി’ എന്ന ഒറ്റ ക്രിയാസംയോജനമായി നൽകിയെങ്കിലും, എടുത്തതും അവിടെനിന്നു പോയതുമായ രണ്ടു ഘടകങ്ങളും സംരക്ഷിച്ചിട്ടുണ്ട്.
