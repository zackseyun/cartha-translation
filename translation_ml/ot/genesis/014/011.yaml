id: GEN.14.11
reference: Genesis 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: ml
  text: പിന്നെ അവർ സൊദോമിലെയും ഗൊമോറയിലെയും സകല സ്വത്തുവകകളും അവരുടെ സകല ഭക്ഷണവും[a] എടുത്ത് പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഭക്ഷണസാധനങ്ങൾ.’ എബ്രായപദം പൊതുവായ ഭക്ഷണത്തെയോ യാത്രയ്‌ക്കോ സൈനികനീക്കത്തിനോ വേണ്ട സാധനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: എടുത്തുകൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ എന്നത് നിലനിർത്തുന്നു; കൊള്ളയുമായി അവർ സ്ഥലംവിട്ടു എന്ന സന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ അവസാനത്തെ וַיֵּלֵכוּ എന്ന ക്രിയയോടു ചേർത്ത് വിവർത്തനം ചെയ്തു.
- source_word: כָּל
  choice: സകല / മുഴുവനും
  rationale: എബ്രായപാഠത്തിൽ ആവർത്തിക്കുന്ന സമഗ്രതാസൂചകത്തെ രണ്ടു നാമപദങ്ങളോടും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: רְכֻשׁ
  choice: സ്വത്തുവകകൾ
  rationale: കൊള്ളയടിക്കാവുന്ന വസ്തുക്കളും സമ്പത്തും ഉൾപ്പെടുന്ന ചലസ്വത്തിന്റെ വിശാലമായ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סְדֹם וַעֲמֹרָה
  choice: സൊദോം, ഗൊമോറ
  rationale: സ്ഥലനാമങ്ങളുടെ മലയാളത്തിൽ പരിചിതവും മൂലഭാഷയോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: אָכְלָם
  choice: അവരുടെ ഭക്ഷണം
  rationale: אֹכֶל എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഭക്ഷണം’ എന്നാണ്; 3-ാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം ‘അവരുടെ’ എന്നു പ്രകടമാക്കുന്നു. സന്ദർഭത്തിൽ ‘ഭക്ഷണസാധനങ്ങൾ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיֵּלֵכוּ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ ‘പോകുക/സ്ഥലംവിടുക’ എന്ന അർഥം, ‘എടുത്തുകൊണ്ടുപോയി’ എന്ന സ്വാഭാവിക മലയാള ക്രിയാസംയോജനത്തിൽ ഉൾപ്പെടുത്തി.
