source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: ml
  text: ഏലാമിലെ രാജാവായ കെദൊർലായോമെർ, ഗോയീമിലെ രാജാവായ തിദാൽ[a], ശിനാരിലെ രാജാവായ അമ്രാഫെൽ, എലാസാരിലെ രാജാവായ അര്യോക്ക്—നാല് രാജാക്കന്മാർ ആ അഞ്ചുപേർക്കെതിരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ജനതകളുടെ രാജാവായ തിദാൽ.’ എബ്രായപദമായ ‘ഗോയീം’ എന്നതിന് ‘ജനതകൾ’ എന്നും അർഥമുണ്ട്; ഇവിടെ അത് ഒരു സ്ഥലനാമവുമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: എതിരെ പോരാടി
  rationale: ആദ്യത്തെ אֵת മുൻവാക്യത്തിലെ യുദ്ധക്രിയയുമായി പേരുകളുടെ പട്ടികയെ ബന്ധിപ്പിക്കുന്നു; അവസാനത്തെ אֶת യുദ്ധത്തിലെ എതിർപക്ഷത്തെ സൂചിപ്പിക്കുന്നു. സ്വതന്ത്രമായി വായിക്കാവുന്ന മലയാളവാക്യത്തിനായി സന്ദർഭത്തിൽ നിന്നുള്ള ‘പോരാടി’ ചേർത്ത് ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כְּדָרְלָעֹמֶר
  choice: കെദൊർലായോമെർ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֶלֶךְ עֵילָם
  choice: ഏലാംരാജാവായ
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നൽകി.
- source_word: תִדְעָל
  choice: തിദാൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: גּוֹיִם
  choice: ഗോയീം
  rationale: രാജകീയ സ്ഥാനപ്പേരിന്റെ ഭാഗമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; ‘ജനതകൾ’ എന്ന പൊതുനാമവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַמְרָפֶל
  choice: അമ്രാഫെൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁנְעָר
  choice: ശിനാർ
  rationale: ബാബിലോണിയ എന്ന ചരിത്രപരമായ തിരിച്ചറിയൽ പാഠത്തിൽ കൊണ്ടുവരാതെ എബ്രായ സ്ഥലനാമം നിലനിർത്തി.
- source_word: אַרְיוֹךְ
  choice: അര്യോക്ക്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶלָּסָר
  choice: എലാസാർ
  rationale: മറ്റൊരു പ്രദേശവുമായി അനുമാനപരമായി തിരിച്ചറിയാതെ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַרְבָּעָה מְלָכִים
  choice: ഈ നാലു രാജാക്കന്മാർ
  rationale: പട്ടികയിലെ നാലുപേരെ തിരിച്ചുസൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഈ’ ചേർത്തു.
- source_word: הַחֲמִשָּׁה
  choice: ആ അഞ്ചുപേർ
  rationale: എബ്രായത്തിൽ ‘അഞ്ചുപേർ’ എന്നു മാത്രം പറഞ്ഞ് ‘രാജാക്കന്മാർ’ അധ്യാഹരിക്കുന്നു; അതേ സംക്ഷിപ്തത മലയാളത്തിലും നിലനിർത്തി.
