translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾ മൂലഭാഷയെ ആശ്രയിച്ച് ലിപ്യന്തരണം ചെയ്തു. ഒറ്റയ്ക്ക് വായിക്കുമ്പോൾ വാക്യം പൂർണമാകാൻ മുൻവാക്യത്തിൽ അധ്യാഹരിച്ചിരിക്കുന്ന യുദ്ധക്രിയ ‘പോരാടി’ എന്നു വ്യക്തമാക്കി.
