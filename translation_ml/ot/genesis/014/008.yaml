id: GEN.14.8
reference: Genesis 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: ml
  text: അപ്പോൾ സൊദോമിലെ രാജാവും ഗൊമോറയിലെ രാജാവും അദ്മയിലെ രാജാവും സെബോയീമിലെ രാജാവും ബേലയിലെ രാജാവും (അതായത്, സോവാർ) പുറപ്പെട്ടു. അവർ സിദ്ദീം താഴ്വരയിൽ അവരുമായി[a] യുദ്ധത്തിനായി അണിനിരന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കെതിരെ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അവരുമായി യുദ്ധം” എന്നാണ്; സന്ദർഭത്തിൽ ഇതിന് “അവർക്കെതിരെ യുദ്ധം” എന്ന അർഥവും വരാം.
    reason: אִתָּם എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപമായ ‘അവരുമായി’ മുഖ്യപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട്, യുദ്ധസന്ദർഭത്തിൽ സാധ്യമായ ‘അവർക്കെതിരെ’ എന്ന വ്യാഖ്യാനാർഥം കുറിപ്പിൽ നൽകുന്നു.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: അപ്പോൾ ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ക്രിയ എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും പിന്നാലെയുള്ള സംയുക്ത കർത്താവ് രാജാക്കന്മാരുടെ പട്ടികയായതിനാൽ മലയാളത്തിൽ കൂട്ടമായ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ ഭരണാധികാരിയുടെയും പദവിക്കുള്ള പതിവായ മലയാളരൂപം; എബ്രായത്തിലെ ആവർത്തനം സംയുക്തപദങ്ങളിലൂടെ നിലനിർത്തി.
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: സൊദോം / ഗൊമോറാ / അദ്മാ / സെബോയീം
  rationale: എബ്രായ സ്ഥലനാമങ്ങളുടെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണങ്ങൾ.
- source_word: בֶּלַע הִוא צֹעַר
  choice: ബേലാ എന്നത് സോവാർ
  rationale: ബേലയെ സോവാർ എന്നു തിരിച്ചറിയിക്കുന്ന വിശദീകരണ ഉപവാക്യം ഡാഷുകൾക്കിടയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעַרְכוּ
  choice: അണിനിരന്നു
  rationale: സൈനികസന്ദർഭത്തിൽ ערך സേനയെ യുദ്ധക്രമത്തിൽ നിരത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അണിനിരന്നു’ സ്വാഭാവികവും സൈനികഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: אִתָּם מִלְחָמָה
  choice: അവരുമായി യുദ്ധത്തിന്
  rationale: אִתָּם എന്നതിലെ ‘അവരുമായി/അവരോടുകൂടെ’ എന്ന രൂപം സംരക്ഷിക്കുമ്പോഴും ‘യുദ്ധത്തിന്’ എന്ന സന്ദർഭം വൈരുദ്ധ്യബന്ധം വ്യക്തമാക്കുന്നു; ‘അവർക്കെതിരെ’ എന്നു മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: സിദ്ദീം താഴ്വരയിൽ
  rationale: עֵמֶק എന്നതിന് സമകാലിക മലയാളത്തിലെ സ്വാഭാവിക പദം ‘താഴ്വര’; സിദ്ദീം സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. രാജാക്കന്മാരുടെ ആവർത്തിത പട്ടികയുടെ ഔപചാരിക താളം സംരക്ഷിച്ചു; അതേസമയം വാക്യം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി.
