reference: Genesis 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/פָּלִ֔יט וַ/יַּגֵּ֖ד לְ/אַבְרָ֣ם הָ/עִבְרִ֑י וְ/הוּא֩ שֹׁכֵ֨ן בְּ/אֵֽלֹנֵ֜י מַמְרֵ֣א הָ/אֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַ/אֲחִ֣י עָנֵ֔ר וְ/הֵ֖ם בַּעֲלֵ֥י בְרִית אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: ml
  text: അപ്പോൾ രക്ഷപ്പെട്ട ഒരാൾ വന്ന് എബ്രായനായ അബ്രാമിനെ വിവരം അറിയിച്ചു. അന്നു അബ്രാം അമോര്യനായ മമ്രേയുടെ കരുവേലകങ്ങൾക്കരികെ[a] താമസിക്കുകയായിരുന്നു. മമ്രേ എശ്കോലിന്റെയും ആനേരിന്റെയും സഹോദരനായിരുന്നു[b]. ഇവർ അബ്രാമുമായി ഉടമ്പടിയിൽ ഏർപ്പെട്ട സഖ്യകക്ഷികളായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മമ്രേയുടെ ടെറിബിന്ത് വൃക്ഷങ്ങൾക്കരികെ.” എബ്രായപദം വലിയ വൃക്ഷങ്ങളെ സൂചിപ്പിക്കാം; അവയെ ഓക്ക് അല്ലെങ്കിൽ ടെറിബിന്ത് എന്നും തിരിച്ചറിയാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എശ്കോലിന്റെയും ആനേരിന്റെയും ബന്ധു.” ‘സഹോദരൻ’ എന്ന എബ്രായപദം വിശാലമായ കുടുംബബന്ധത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അബ്രാമുമായി ഒരു ഉടമ്പടിയുടെ ഉടമകൾ/അധിപന്മാർ”; അതായത് ഉടമ്പടിയാൽ അവനോടു ബന്ധിക്കപ്പെട്ടവർ.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: രക്ഷപ്പെട്ട ഒരാൾ
  rationale: യുദ്ധത്തിൽനിന്നോ അപകടത്തിൽനിന്നോ ഒഴിഞ്ഞുമാറി രക്ഷപ്പെട്ട വ്യക്തിയെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: וַיַּגֵּד
  choice: വിവരം അറിയിച്ചു
  rationale: സംഭവം അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക എന്ന ലളിതമായ ആഖ്യാനാർഥം വ്യക്തമാക്കുന്നു.
- source_word: הָעִבְרִי
  choice: എബ്രായനായ
  rationale: അബ്രാമിനോടു ചേർന്നുനിൽക്കുന്ന വംശീയമോ സാമൂഹികമോ ആയ വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שֹׁכֵן
  choice: താമസിക്കുകയായിരുന്നു
  rationale: ആ സമയത്ത് തുടർന്നിരുന്ന വാസത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: മമ്രേയുടെ കരുവേലകങ്ങൾക്കരികെ
  rationale: אֵלוֹן വലിയ വൃക്ഷത്തെ, സാധാരണയായി ഓക്കിനെയോ ടെറിബിന്തിനെയോ, സൂചിപ്പിക്കാം. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘കരുവേലകം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് സസ്യശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യനായ
  rationale: മമ്രേയെ വിശേഷിപ്പിക്കുന്ന ജനവിഭാഗനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: എശ്കോലിന്റെയും ആനേരിന്റെയും സഹോദരൻ
  rationale: אָח എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘സഹോദരൻ’ നിലനിർത്തുന്നു; വിശാലമായ ബന്ധുത്വസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּעֲלֵי בְרִית
  choice: ഉടമ്പടിയിൽ ഏർപ്പെട്ട സഖ്യകക്ഷികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടിയുടെ ഉടമകൾ/അധിപന്മാർ’ എന്ന പ്രയോഗം ഉടമ്പടിയാൽ ബന്ധിക്കപ്പെട്ട കൂട്ടാളികളെ സൂചിപ്പിക്കുന്നു. ‘ഉടമ്പടി’ എന്ന ആശയം നഷ്ടപ്പെടുത്താതെ ആ രാഷ്ട്രീയബന്ധം വ്യക്തമായി പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ വംശീയവിശേഷണം, വാസത്തിന്റെ തുടർച്ച, ബന്ധുത്വത്തിലെ അനിശ്ചിതത്വം, ഉടമ്പടി-സഖ്യത്തിന്റെ ആശയം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
