translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അപരിചിതമായ വ്യക്തി-, ജന-, സ്ഥലനാമങ്ങൾ ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; രണ്ട് എബ്രായ ക്രിയാക്രമങ്ങളെ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
