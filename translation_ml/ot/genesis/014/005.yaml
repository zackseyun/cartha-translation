  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: ml
  text: പതിനാലാം വർഷത്തിൽ കെദോർലായോമെർ[a] തന്നോടൊപ്പമുണ്ടായിരുന്ന രാജാക്കന്മാരുമായി വന്നു. അവർ അഷ്ടെരോത്ത്-കർനായീമിൽ രെഫായീമ്യരെയും[b], ഹാമിൽ സൂസീമ്യരെയും, ശാവേ-കിര്യാത്തയീമിൽ[c] ഏമീമ്യരെയും തോൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കെദോർലായോമെർ എന്നത് എബ്രായ വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരമാണ്.
    reason: lexical_alternative
  - marker: b
    text: രെഫായീമ്യരെ ചിലർ ‘ഭീമന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ഇവിടെ അത് ഒരു ജനവിഭാഗത്തിന്റെ പേരായി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ശാവേ-കിര്യാത്തയീം എന്നത് ‘കിര്യാത്തയീമിന്റെ സമതലം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: പതിനാലാം വർഷത്തിൽ
  rationale: വാക്യാരംഭത്തിലെ ו narratival ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നിർബന്ധമായി ‘അപ്പോൾ/കൂടാതെ’ ചേർക്കാതെ സ്വാഭാവികമായ കാലസൂചനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: בָּא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ വിശാലമായ ‘വരുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സൈനികസന്ദർഭമുണ്ടെങ്കിലും ‘പടയെടുത്തു വന്നു’ എന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: כְדָרְלָעֹמֶר
  choice: കെദോർലായോമെർ
  rationale: എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: തന്നോടൊപ്പമുണ്ടായിരുന്ന രാജാക്കന്മാരുമായി
  rationale: രാജാക്കന്മാർ കെദോർലായോമെരിന്റെ കൂട്ടാളികളായി കൂടെ വന്നുവെന്ന അനുഗമനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכּוּ
  choice: അവർ ... തോൽപ്പിച്ചു
  rationale: נכה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അടിക്കുക’ എന്നുണ്ടെങ്കിലും, ഇവിടെ ജനവിഭാഗങ്ങൾക്കെതിരായ സൈനികവിജയം വിവരിക്കുന്നതിനാൽ ‘തോൽപ്പിച്ചു’ സന്ദർഭോചിതമാണ്.
- source_word: רְפָאִים
  choice: രെഫായീമ്യർ
  rationale: ഇവിടെ ഒരു ജനവിഭാഗത്തിന്റെ പേരായതിനാൽ ‘ഭീമന്മാർ’ എന്ന് വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: അഷ്ടെരോത്ത്-കർനയീമിൽ
  rationale: യുദ്ധസ്ഥലത്തിന്റെ സംയുക്ത സ്ഥാനനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: הַזּוּזִים
  choice: സൂസ്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേര് മലയാളവായനയ്ക്ക് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּהָם
  choice: ഹാമിൽ
  rationale: הם ഇവിടെ സ്ഥാനനാമമായി മനസ്സിലാക്കി ലിപ്യന്തരിച്ചു.
- source_word: הָאֵימִים
  choice: ഏമ്യർ
  rationale: ജനവിഭാഗത്തിന്റെ പേര് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: ശാവേ-കിര്യാത്തയീമിൽ
  rationale: പട്ടികയിലെ മറ്റു ഭൂമിശാസ്ത്രനാമങ്ങളുടെ മാതൃകയിൽ സംയുക്ത സ്ഥാനനാമമായി നിലനിർത്തി; שָׁוֵהയെ നിർബന്ധമായി ‘സമതലം’ എന്നു വിവർത്തനം ചെയ്തില്ല.
