id: GEN.14.20
reference: Genesis 14:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: ml
  text: നിന്റെ ശത്രുക്കളെ നിന്റെ കൈയിൽ ഏല്പിച്ച അത്യുന്നതനായ ദൈവം വാഴ്ത്തപ്പെടട്ടെ! അവൻ അവന് സകലത്തിൽനിന്നും പത്തിലൊന്ന് കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ അബ്രാമിനെയും ‘അവന്’ എന്നു പറയുന്നത് മെൽക്കീസേദെക്കിനെയും സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. എന്നാൽ ‘കൊടുത്തു’ എന്ന ക്രിയയുടെ കർത്താവിനെ എബ്രായപാഠം വീണ്ടും വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: വാഴ്ത്തപ്പെടട്ടെ
  rationale: ആശീർവാദപ്രഖ്യാപനമായ നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളാവിഷ്കാരം.
- source_word: אֵל עֶלְיוֹן
  choice: അത്യുന്നതനായ ദൈവം
  rationale: אֵל എന്നത് ‘ദൈവം’ എന്നും עֶלְיוֹן എന്ന ദൈവിക വിശേഷണം ‘അത്യുന്നതനായ’ എന്നും അർത്ഥസുതാര്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִגֵּן
  choice: ഏല്പിച്ച
  rationale: ഈ ക്രിയ ഇവിടെ ‘കൈമാറിക്കൊടുക്കുക/അധികാരത്തിൽ ഏല്പിക്കുക’ എന്ന സൈനികസന്ദർഭത്തിലെ അർത്ഥത്തിലാണ്; ‘പരിചയായ’ എന്ന അർത്ഥമല്ല.
- source_word: צָרֶיךָ
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചനം; ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പൊതുപദം.
- source_word: בְיָדֶךָ
  choice: നിന്റെ കൈയിൽ
  rationale: മറ്റൊരാളുടെ അധികാരത്തിലാക്കുക എന്ന എബ്രായ ശൈലി ദൃശ്യസാന്ദ്രതയോടെ നിലനിർത്തുന്നു.
- source_word: וַיִּתֶּן
  choice: അവൻ ... കൊടുത്തു
  rationale: ലളിതമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു; എബ്രായത്തിൽ കർത്താവ് വീണ്ടും വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ വ്യക്തിനാമം ചേർത്തിട്ടില്ല.
- source_word: מַעֲשֵׂר
  choice: പത്തിലൊന്ന്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം; പിൽക്കാല സ്ഥാപനപരമായ ധ്വനികൾ സൃഷ്ടിക്കാവുന്ന ‘ദശാംശം’ എന്ന പാരമ്പര്യപദത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: מִכֹּל
  choice: സകലത്തിൽനിന്നും
  rationale: മുഴുവൻ വസ്തുക്കളിൽനിന്നെടുത്ത പത്തിലൊന്ന് എന്ന ആശയം, മൂലപാഠത്തിലെ ‘നിന്ന്’ എന്ന ബന്ധം ഉൾപ്പെടെ, സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: וַיִּתֶּן എന്നതിന്റെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: 'മൂലത്തിലെ സർവനാമപരമായ അവ്യക്തത നിലനിർത്തി: ‘അവൻ അവന് ... കൊടുത്തു.’ സന്ദർഭത്തിൽ അബ്രാം മെൽക്കീസേദെക്കിന് കൊടുത്തുവെന്നാണ് ഏറ്റവും സ്വാഭാവികമായ വായന.'
  alternative: മെൽക്കീസേദെക്ക് അബ്രാമിന് കൊടുത്തു എന്ന വ്യാകരണപരമായി സാധ്യമായെങ്കിലും സന്ദർഭത്തിൽ സാധ്യത കുറഞ്ഞ വായന.
  rationale: എബ്രായവാക്യം കർത്താവിനെ പേരെടുത്ത് ആവർത്തിക്കുന്നില്ല. സന്ദർഭം അബ്രാമിനെ ശക്തമായി സൂചിപ്പിച്ചാലും പരിഭാഷയിൽ പേര് ചേർത്ത് യഥാർത്ഥമായ വ്യാകരണാവ്യക്തത ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ ആരാധനാപരമായ ഗൗരവം പുലർത്തുന്ന മലയാളം. ‘കൈയിൽ ഏല്പിച്ചു’ എന്ന ബൈബിൾസവിശേഷമായ ദൃശ്യശൈലി നിലനിർത്തി; ‘പത്തിലൊന്ന്’ എന്ന സുതാര്യമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
