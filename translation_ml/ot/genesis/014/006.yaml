revisions:
- from: സേയീർ എന്ന അവരുടെ മലനാട്ടിലെ ഹോര്യരെയും മരുഭൂമിക്കരികെയുള്ള ഏൽ-പാരാൻവരെയും ആക്രമിച്ചു.[a]
  to: സേയീരിലെ അവരുടെ പർവതപ്രദേശത്തുള്ള ഹോര്യരെയും, മരുഭൂമിക്കരികെയുള്ള ഏൽ-പാരാൻവരെ, അടിച്ചുതോൽപ്പിച്ചു.[a]
  rationale: The revision restores the force of the inherited military verb, corrects the grammatical expression of the endpoint introduced by עַד, and revises the lexical alternative in the footnote. It leaves El-paran transliterated in the main text so that the uncertain analysis of אֵיל is not imposed.
  reviewer_model: gpt-5.6-terra
