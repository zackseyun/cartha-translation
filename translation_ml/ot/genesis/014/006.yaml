translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന ക്രിയ വായനാസൗകര്യത്തിനായി പൂരിപ്പിച്ചിരിക്കുന്നു; സ്ഥലനാമങ്ങളുടെ അനിശ്ചിത വ്യുത്പത്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
