source:
  edition: WLC
  text: וְ/אֶת הַ/חֹרִ֖י בְּ/הַרְרָ֣/ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל הַ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: ml
  text: സേയീരിലെ അവരുടെ പർവതപ്രദേശത്തുള്ള ഹോര്യരെയും, മരുഭൂമിക്കരികെയുള്ള ഏൽ-പാരാൻവരെ, അടിച്ചുതോൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏൽ പാരാൻ’ എന്നും വായിക്കാം; ഇതിനെ സ്ഥിരമായ സ്ഥലനാമമായല്ല, വ്യുത്പത്തിപരമായി മനസ്സിലാക്കുന്നെങ്കിൽ ‘പാരാനിലെ ഓക്ക്/തെരബിന്ത് വൃക്ഷം’ എന്നായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֹרִי
  choice: ഹോര്യരെയും ആക്രമിച്ചു
  rationale: വാക്യം 5-ൽ നിന്നു തുടരുന്ന നേരിട്ടുള്ള കർമത്തെ ‘-യെയും’കൊണ്ട് അടയാളപ്പെടുത്തി; മുൻസന്ദർഭത്തിൽനിന്നുള്ള ‘ആക്രമിച്ചു’ എന്ന ക്രിയ സ്വാഭാവികമായ മലയാളത്തിനായി പൂരിപ്പിച്ചു.
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: സേയീർ എന്ന അവരുടെ മലനാട്ടിലെ
  rationale: ‘അവരുടെ മലകൾ’ എന്ന അക്ഷരാർഥത്തെ പ്രദേശസൂചകമായി സ്വാഭാവികമാക്കുമ്പോഴും 3-ാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവരുടെ’ എന്നു നിലനിർത്തുന്നു; സേയീറിനെ സ്ഥലനാമമായി സംരക്ഷിക്കുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: സൈനികമുന്നേറ്റത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പരിധി മലയാളത്തിൽ ചുരുക്കമായും കൃത്യമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֵיל פָּארָן
  choice: ഏൽ-പാരാൻ
  rationale: ഇത് സ്ഥിരമായ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നത് אֵיל എന്ന പദത്തിന് സാധ്യതയുള്ള ‘വൻവൃക്ഷം/കരുവേലം’ എന്ന വ്യുത്പത്തിയെ മുഖ്യപാഠത്തിൽ അനാവശ്യമായി തീരുമാനിച്ചുകളയുന്നത് ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: മരുഭൂമിക്കരികെയുള്ള
  rationale: עַל എന്നതിന്റെ വിശാലമായ സ്ഥലബന്ധം ഇവിടെ ‘അരികിൽ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ബന്ധവാക്യം മലയാളത്തിൽ വിശേഷണരൂപത്തിലാക്കി.
