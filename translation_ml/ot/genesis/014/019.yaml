reference: Genesis 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: ml
  text: 'അവൻ അവനെ അനുഗ്രഹിച്ചു പറഞ്ഞു: “ആകാശത്തിന്റെയും ഭൂമിയുടെയും[b] ഉടമയായ[a] അത്യുന്നതനായ ദൈവത്താൽ അബ്രാം അനുഗൃഹീതനാകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സ്രഷ്ടാവായ.” ഹീബ്രായ കൃദന്തത്തിന് “ഉടമ,” “കൈവശമുള്ളവൻ,” അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ “സ്രഷ്ടാവ്” എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ആകാശങ്ങളുടെയും ഭൂമിയുടെയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: അവൻ അവനെ അനുഗ്രഹിച്ചുകൊണ്ട്
  rationale: മൂന്നാം പുരുഷ ഏകവചന കർത്താവും പുരുഷലിംഗ ഏകവചന കർമപ്രത്യയവും ഉള്ള തുടർച്ചാനിവേദനരൂപം. കർമം ആരെന്നത് മൂലപാഠംപോലെ സർവനാമമായി നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്കുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അനുഗ്രഹിച്ചുകൊണ്ട്’ ഉപയോഗിച്ചു.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ തുടർച്ചയായ ക്രിയയെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בָּרוּךְ
  choice: അനുഗൃഹീതനാകട്ടെ
  rationale: ആശീർവാദസൂത്രത്തിലെ കർമണിപ്രയോഗവും ആശംസാത്മക ഭാവവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: ഈ ഘട്ടത്തിൽ പേര് അബ്രാഹാം എന്നു മാറ്റപ്പെട്ടിട്ടില്ലാത്തതിനാൽ അബ്രാം എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: לְאֵל
  choice: ദൈവത്താൽ
  rationale: ആശീർവാദത്തിന്റെ ഉറവിടം ദൈവമാണെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ഇവിടെ לְ എന്ന ഉപസർഗത്തിന്റെ സാധ്യമായ ആശീർവാദസൂത്രപ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֵל עֶלְיוֹן
  choice: അത്യുന്നതനായ ദൈവം
  rationale: നാമവും വിശേഷണവും ചേർന്ന ദൈവിക സ്ഥാനപ്പേരിനെ വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കലില്ലാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ പകരുന്നു.
- source_word: קֹנֵה
  choice: ഉടമയായ
  rationale: קנה എന്ന ധാതുവിന്റെ ‘കൈവശമുള്ളവൻ/ഉടമ’ എന്ന അടിസ്ഥാന അർഥപരിധി നിലനിർത്തുന്നു. ‘സ്രഷ്ടാവ്’ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: ആകാശത്തിന്റെയും ഭൂമിയുടെയും
  rationale: സകല സൃഷ്ടിയെയും സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദജോടി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. שָׁמַיִם എന്ന പദത്തിന്റെ രൂപപരമായ ബഹുവചനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: קֹנֵה എന്ന പദത്തിന്റെ ദൈവിക സ്ഥാനപ്പേരിലെ അർഥം
  choice: ആകാശത്തിന്റെയും ഭൂമിയുടെയും ഉടമ
  alternative: ആകാശത്തിന്റെയും ഭൂമിയുടെയും സ്രഷ്ടാവ്
  rationale: קנה എന്ന പദത്തിന് കൈവശം വയ്ക്കുക/ഉടമയായിരിക്കുക എന്നും ചില സന്ദർഭങ്ങളിൽ സൃഷ്ടിക്കുക എന്നും അർഥമാകാം. മൂലപാഠത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ ‘ഉടമ’ എന്നും ‘സ്രഷ്ടാവ്’ എന്ന സാധ്യവായന അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ആശീർവാദവാക്യത്തിന്റെ ഗൗരവം ‘അനുഗൃഹീതനാകട്ടെ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തി. ഹീബ്രായത്തിലെ ‘അവനെ’ എന്ന സർവനാമം അബ്രാം എന്നു തുറന്നെഴുതി പരിഹരിക്കാതെ മൂലപാഠത്തിലെ പരാമർശരീതി സംരക്ഷിച്ചു.
