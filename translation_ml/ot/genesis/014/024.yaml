  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: ml
  text: യുവാക്കൾ കഴിച്ചതും എന്നോടുകൂടെ പോയ അനേർ, എശ്കോൽ, മമ്രെ എന്നിവരുടെ ഓഹരിയും ഒഴികെ, മറ്റൊന്നും ഞാൻ എടുക്കുകയില്ല. അവർ തങ്ങളുടെ ഓഹരി എടുത്തുകൊള്ളട്ടെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുവാക്കൾ” എന്നതിന് “സേവകർ” അല്ലെങ്കിൽ “അനുചരന്മാർ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “അവർ തങ്ങളുടെ ഓഹരി എടുക്കും” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ സന്ദർഭം അനുമതിയെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: എനിക്കായി ഒന്നും വേണ്ട; ... മാത്രം ... ഒഴികെ
  rationale: മുൻവാക്യത്തിലെ അബ്രാമിന്റെ നിരാകരണം സന്ദർഭത്തിൽനിന്ന് പൂർത്തിയാക്കി, בִּלְעָדַי എന്ന ഒഴിവാക്കൽഭാവവും רַק എന്ന നിയന്ത്രണ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: യുവാക്കൾ കഴിച്ചതു
  rationale: נְעָרִים എന്നത് യുവാക്കളെയോ സേവകരെയോ അനുചരന്മാരെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘യുവാക്കൾ’ നിലനിർത്തി, സന്ദർഭസാധ്യമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: എന്നോടൊപ്പം പോയ പുരുഷന്മാരുടെ ഓഹരി
  rationale: חֵלֶק എന്നതിന്റെ കൊള്ളവിഭജനസന്ദർഭത്തിലെ സ്വാഭാവിക അർഥം ‘ഓഹരി’ എന്നാണ്; הלך എന്ന സഞ്ചാരഭാവം ‘പോയ’ എന്നു നിലനിർത്തുന്നു.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: ആനേർ, എശ്കോൽ, മമ്രേ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ മൂലോച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: അവർ തങ്ങളുടെ ഓഹരി എടുത്തുകൊള്ളട്ടെ
  rationale: ഇവിടത്തെ അപൂർണ്ണക്രിയ സന്ദർഭത്തിൽ അനുമതി/അവകാശം സൂചിപ്പിക്കുന്നതായി വായിക്കാം; മലയാളത്തിലെ ‘എടുത്തുകൊള്ളട്ടെ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മുൻവാക്യത്തിൽനിന്നുള്ള നിരാകരണക്രിയയുടെ സൂചന
  choice: ‘എനിക്കായി ഒന്നും വേണ്ട’ എന്നു ക്രിയാഭാവം വ്യക്തമാക്കി
  alternative: ‘യുവാക്കൾ കഴിച്ചതു മാത്രം ഒഴികെ...’ എന്ന അപൂർണ്ണ വാക്യഘടന
  rationale: എബ്രായവാക്യം മുൻവാക്യത്തിലെ നിരാകരണത്തെ ആശ്രയിക്കുന്നു. മലയാളത്തിൽ ആശയം പൂർണ്ണമാക്കുന്നത് അബ്രാമിന്റെ നിലപാട് വ്യക്തമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: יִקְחוּ എന്നതിന്റെ ഭാവം
  choice: 'അനുമതി: ‘എടുത്തുകൊള്ളട്ടെ’'
  alternative: 'സാധാരണ ഭാവികാലം: ‘അവർ തങ്ങളുടെ ഓഹരി എടുക്കും’'
  rationale: സന്ദർഭത്തിൽ അബ്രാം കൂട്ടാളികളുടെ ഓഹരി അനുവദിക്കുകയാണ്; എങ്കിലും വ്യാകരണപരമായ ഭാവികാലവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കൊള്ളവിഭജനസന്ദർഭത്തിൽ ‘ഓഹരി’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ച നിയന്ത്രണഭാവം അസ്വാഭാവികമാകാതെ ‘മാത്രം ... ഒഴികെ’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തു.
