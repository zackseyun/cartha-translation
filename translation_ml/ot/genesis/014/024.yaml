- from: എനിക്കായി ഒന്നും വേണ്ട; യുവാക്കൾ കഴിച്ചതു മാത്രം, എന്നോടൊപ്പം പോയ പുരുഷന്മാരായ ആനേർ, എശ്കോൽ, മമ്രേ എന്നിവരുടെ ഓഹരിയും ഒഴികെ. അവർ തങ്ങളുടെ ഓഹരി എടുത്തുകൊള്ളട്ടെ.[a][b]
