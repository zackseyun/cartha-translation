id: GEN.14.21
reference: Genesis 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: ml
  text: 'അപ്പോൾ സൊദോംരാജാവ് അബ്രാമിനോടു പറഞ്ഞു: “ആളുകളെ[a] എനിക്കു തരുക; വസ്തുവകകൾ[b] നീ എടുത്തുകൊള്ളുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘പ്രാണനെ’ അഥവാ ‘വ്യക്തിയെ’ എന്ന ഏകവചനരൂപം; ഇവിടെ ആളുകളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സാധനങ്ങൾ’ അല്ലെങ്കിൽ ‘സ്വത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; അതിന്റെ ക്രമാനുഗത ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ סְדֹם
  choice: സൊദോംരാജാവ്
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶל אַבְרָם
  choice: അബ്രാമിനോടു
  rationale: אֶל എന്ന ബന്ധസൂചകത്തിന്റെ സംസാരക്രിയയോടൊപ്പമുള്ള സ്വാഭാവിക മലയാളരൂപമാണിത്; പേരിന് പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: תֶּן לִי
  choice: എനിക്കു തരുക
  rationale: ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ദാതൃസൂചനയും നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הַנֶּפֶשׁ
  choice: ആളുകളെ
  rationale: נֶפֶשׁ ഏകവചനത്തിലാണെങ്കിലും ഇവിടെ വീണ്ടെടുത്ത മനുഷ്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ആത്മാവിനെ’ എന്ന അക്ഷരാർഥരൂപം സന്ദർഭത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കുമെന്നതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְהָרְכֻשׁ
  choice: വസ്തുവകകൾ
  rationale: רְכוּשׁ ചലസ്വത്ത്, സാധനങ്ങൾ, സമ്പത്ത് എന്നിവയെ സൂചിപ്പിക്കുന്നു; മനുഷ്യരോടുള്ള വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് ഈ അർഥപരിധി സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: קַח לָךְ
  choice: നീ എടുത്തുകൊള്ളുക
  rationale: ആജ്ഞയും לָךְ നൽകുന്ന സ്വന്തം പ്രയോജനത്തിനോ കൈവശത്തിനോ ഉള്ള ഭാവവും ‘എടുത്തുകൊള്ളുക’ എന്ന മലയാളപ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; ‘നീ’ ഊന്നലും വ്യക്തതയും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആജ്ഞകളുടെ നേരിട്ടുള്ള ഭാവവും ആളുകളും വസ്തുവകകളും തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവ്യതിയാനം മൂലഭാഷാ വിവരത്തിന് അനുസൃതമായി തിരുത്തി: [a] ‘ആളുകളെ’ എന്നതിനും [b] ‘വസ്തുവകകൾ’ എന്നതിനും ചേർത്തു.'
