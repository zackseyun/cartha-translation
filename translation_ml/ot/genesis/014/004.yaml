id: GEN.14.4
reference: Genesis 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: ml
  text: പന്ത്രണ്ടു വർഷം അവർ കെദൊർലായോമെരിന് കീഴിൽ സേവിച്ചു; എന്നാൽ പതിമൂന്നാം വർഷം അവർ കലാപം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: പന്ത്രണ്ടു വർഷം
  rationale: എബ്രായത്തിലെ ദൈർഘ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഇതേ രൂപത്തിൽ നൽകുന്നു.
- source_word: עָבְדוּ
  choice: കീഴടങ്ങി സേവിച്ചു
  rationale: രാഷ്ട്രീയസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് സാധാരണ സേവനം മാത്രമല്ല, ഒരു മേലധികാരിയുടെ അധീനതയിലുള്ള സാമന്തരാജ്യസേവനം എന്ന അർഥവുമുണ്ട്; ഈ ഇരട്ടഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: കെദൊർലായോമെരിനു
  rationale: എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: എന്നാൽ പതിമൂന്നാം വർഷം
  rationale: അക്ഷരാർഥത്തിൽ ‘പതിമൂന്ന് വർഷം’ എന്നുണ്ടെങ്കിലും, പന്ത്രണ്ടു വർഷത്തെ അധീനസേവനത്തിനു പിന്നാലെയുള്ള പതിമൂന്നാം വർഷമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: מָרָדוּ
  choice: മത്സരിച്ചു
  rationale: מרד രാഷ്ട്രീയാധികാരത്തിനെതിരായ കലാപമോ മത്സരമോ സൂചിപ്പിക്കുന്നു; ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ച dignified Malayalam ആയി ‘മത്സരിച്ചു’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആഖ്യാനത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. പേരിന്റെ ലിപ്യന്തരണം എബ്രായ ഉച്ചാരണരൂപത്തെ മുൻനിർത്തുന്നു.
