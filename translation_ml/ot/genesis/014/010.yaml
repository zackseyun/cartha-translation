    rationale: ഹീബ്രുവിലെ ആവർത്തനം കുഴികളുടെ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ബിറ്റുമെൻ കുഴികൾ നിറഞ്ഞിരുന്നു’ എന്നതാണ് അതിനെ കൂടുതൽ സ്വാഭാവികമായും നേരിട്ടും അവതരിപ്പിക്കുന്നത്.
