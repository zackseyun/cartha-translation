  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: ml
  text: സിദ്ദീം താഴ്‌വര ബിറ്റുമെൻ കുഴികൾ നിറഞ്ഞിരുന്നു[a]. സൊദോമിലെയും ഗൊമോറയിലെയും രാജാക്കന്മാർ ഓടിപ്പോയി അവിടെ വീണു[b]; ശേഷിച്ചവർ മലനാട്ടിലേക്ക് ഓടിപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കീൽക്കുഴികൾ’ അല്ലെങ്കിൽ ‘അസ്ഫാൽറ്റ് കുഴികൾ’; ഹീബ്രു ബിറ്റുമെൻ എന്ന പ്രകൃതിദത്ത പദാർഥത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവർ സിദ്ദീം താഴ്‌വരയിൽ വീണു; ഒരുപക്ഷേ ബിറ്റുമെൻ കുഴികളിൽ വീണതായിരിക്കാം. എന്നാൽ ഹീബ്രുവിൽ കുഴികൾ എന്ന കർമ്മം ഇവിടെ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: ambiguity_preservation
  - marker: c
    text: അഥവാ ‘മലകളിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: സിദ്ദീം താഴ്‌വര
  rationale: עֵמֶק എന്നത് ‘താഴ്‌വര’ എന്നും הַשִּׂדִּים സ്ഥലനാമമായ ‘സിദ്ദീം’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: എല്ലായിടത്തും കീൽക്കുഴികളായിരുന്നു
  rationale: ‘കുഴികൾ, കുഴികൾ’ എന്ന ആവർത്തനം കുഴികളുടെ ബാഹുല്യം സൂചിപ്പിക്കുന്നു. חֵמָר പ്രകൃതിദത്തമായ ബിറ്റുമെൻ/അസ്ഫാൽറ്റ് സ്വഭാവമുള്ള കീൽപ്പദാർത്ഥമാണ്; സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ‘കീൽ’ തിരഞ്ഞെടുത്തു.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: സൊദോമിലെയും ഗൊമോറയിലെയും രാജാക്കന്മാർ
  rationale: מֶלֶךְ രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ബഹുവചന ക്രിയകളും കഥാസന്ദർഭവും ഓരോ നഗരത്തിനും ഓരോ രാജാവാണെന്ന് കാണിക്കുന്നു.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: അവിടെ വീണു
  rationale: നפל എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു. അവർ കുഴികളിലേക്കാണ് വീണതെന്നത് സാധ്യതയുള്ളതെങ്കിലും ഹീബ്രുവിൽ കർമ്മം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: וְהַנִּשְׁאָרִים
  choice: ശേഷിച്ചവർ
  rationale: മറ്റുള്ളവർക്കു സംഭവിച്ചതിനുശേഷം ബാക്കിയായവരെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֶרָה
  choice: മലനാട്ടിലേക്ക്
  rationale: הַר എന്ന പദത്തോടു ചേർന്ന ദിശാസൂചക പ്രത്യയം മലപ്രദേശത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മലനാട്ടിലേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: וַיָּנֻסוּ / נָסוּ
  choice: ഓടിപ്പോയി
  rationale: യുദ്ധത്തിൽനിന്നുള്ള പലായനത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: രാജാക്കന്മാർ എവിടെയാണ് വീണത് എന്നതിന്റെ അനിശ്ചിതത്വം
  choice: അവിടെ വീണു
  alternative: കീൽക്കുഴികളിൽ വീണു
  rationale: സന്ദർഭം കീൽക്കുഴികളെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും മൂലപാഠം ‘അവിടെ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ കുഴികളിലേക്കെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യഘടന ഹീബ്രു ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാക്കി. ‘ബിറ്റുമെൻ’ എന്ന സാങ്കേതിക പദത്തിന് പകരം മുഖ്യപാഠത്തിൽ ‘കീൽ’ ഉപയോഗിച്ച് കൃത്യമായ പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
