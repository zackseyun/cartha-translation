  to: സിദ്ദീം താഴ്‌വര ബിറ്റുമെൻ കുഴികൾ നിറഞ്ഞിരുന്നു[a]. സൊദോമിലെയും ഗൊമോറയിലെയും രാജാക്കന്മാർ ഓടിപ്പോയി അവിടെ വീണു[b]; ശേഷിച്ചവർ മലനാട്ടിലേക്ക് ഓടിപ്പോയി[c].
