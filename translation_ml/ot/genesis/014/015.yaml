source:
  edition: WLC
  text: וַ/יֵּחָלֵ֨ק עֲלֵי/הֶ֧ם לַ֛יְלָה ה֥וּא וַ/עֲבָדָ֖י/ו וַ/יַּכֵּ֑/ם וַֽ/יִּרְדְּפֵ/ם֙ עַד חוֹבָ֔ה אֲשֶׁ֥ר מִ/שְּׂמֹ֖אל לְ/דַמָּֽשֶׂק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: ml
  text: രാത്രിയിൽ അവനും അവന്റെ ദാസന്മാരും അവർക്കെതിരെ വിഭാഗങ്ങളായി പിരിഞ്ഞ് അവരെ അടിച്ചു; ദമസ്കൊസിന് വടക്കുള്ള ഹോബാവരെ അവരെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה
  choice: രാത്രിയിൽ ... അവർക്കെതിരെ പല സംഘങ്ങളായി പിരിഞ്ഞ്
  rationale: חלק എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധതന്ത്രപരമായി സംഘങ്ങളായി വിഭജിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രാത്രിയിൽ’ എന്നത് לילהയുടെ കാലസൂചന സ്വാഭാവിക മലയാളക്രമത്തിൽ മുന്നിൽ നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അബ്രാമിന്റെ വീട്ടിൽപ്പെട്ട സായുധ സേവകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּכֵּם
  choice: അവരെ തോൽപ്പിച്ചു
  rationale: נכה എന്ന ക്രിയയ്ക്ക് ‘അടിച്ചു/വെട്ടിവീഴ്ത്തി’ എന്ന അക്ഷരാർഥമുണ്ടെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ ‘തോൽപ്പിച്ചു’ എന്നത് ഫലം സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാതെയും അറിയിക്കുന്നു.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: ദമസ്കൊസിന് വടക്കുള്ള
  rationale: ശാബ്ദികമായി ‘ദമസ്കൊസിന്റെ ഇടത്തുവശത്ത്’; കിഴക്കോട്ടു മുഖംതിരിക്കുന്ന പുരാതന ദിശാബോധത്തിൽ ഇടത് വടക്കിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ പ്രവർത്തനക്രമവും രാത്രിയിലെ സംഘവിഭജനമെന്ന യുദ്ധതന്ത്രവും വ്യക്തമായി നിലനിർത്തി.
