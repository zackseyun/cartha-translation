source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: ml
  text: 'ഹമോർ അവരോടു സംസാരിച്ചു: “എന്റെ മകൻ ശെഖേമിന്റെ മനസ്സ് നിങ്ങളുടെ മകളോടു വല്ലാതെ ചേർന്നിരിക്കുന്നു.[a] ദയവായി അവളെ അവനു ഭാര്യയായി കൊടുക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ നിങ്ങളുടെ മകളെ അതിയായി ആഗ്രഹിക്കുന്നു.”
    reason: חָשְׁקָה נַפְשׁוֹ എന്ന ഹീബ്രായ പ്രയോഗം ശക്തമായ മാനസിക അടുപ്പത്തെയോ ആഗ്രഹത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם
  choice: അവരോടു സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അർഥവും אִתָּם എന്നതിലെ ‘അവരോടൊപ്പം/അവരോട്’ എന്ന സംവാദഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁכֶם בְּנִי
  choice: എന്റെ മകൻ ശെഖേം
  rationale: ഹീബ്രായിയിലെ സമാനാധികരണബന്ധം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: മനസ്സ് ... വല്ലാതെ ചേർന്നിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ജീവൻ/ആത്മാവ് ചേർന്നിരിക്കുന്നു’ എന്ന ശക്തമായ ആഗ്രഹവും മാനസിക അടുപ്പവും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. മലയാളത്തിൽ ‘മനസ്സ് ... ചേർന്നിരിക്കുന്നു’ എന്നത് ആ രൂപകവും വികാരതീവ്രതയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: בְּבִתְּכֶם
  choice: നിങ്ങളുടെ മകളോടു
  rationale: സംബോധിതരെ സൂചിപ്പിക്കുന്ന പ്രത്യയം ബഹുവചനമാണെങ്കിലും ‘മകൾ’ ഏകവചനമാണ്; ഇവിടെ കുടുംബത്തിന്റെ മകളായ ദീനയെ ഉദ്ദേശിക്കുന്നു.
- source_word: תְּנוּ נָא
  choice: ദയവായി ... കൊടുക്കുക
  rationale: കല്പനാരൂപത്തോടു ചേർന്ന נָא വിനയപൂർവമായ അപേക്ഷ പ്രകടിപ്പിക്കുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിനായി സ്ത്രീയെ നൽകുക എന്ന പതിവ് ഹീബ്രായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
