base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: ml
  text: 'ഈ ഒരു വ്യവസ്ഥയിൽ മാത്രമേ ആ പുരുഷന്മാർ നമ്മോടു സമ്മതിക്കുകയുള്ളൂ[a]: നമ്മോടൊപ്പം താമസിക്കാനും ഒരൊറ്റ ജനമായിത്തീരാനും, അവർ പരിച്ഛേദനം ഏറ്റിരിക്കുന്നതുപോലെ നമ്മുടെ ഇടയിലുള്ള എല്ലാ ആണുങ്ങളും പരിച്ഛേദനം ഏൽക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നമ്മോടു സമ്മതം നൽകുകയുള്ളൂ” അല്ലെങ്കിൽ “നമ്മോടു സന്നദ്ധരാകുകയുള്ളൂ”; എബ്രായ ക്രിയ സമ്മതമോ സന്നദ്ധതയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: ഈ ഒരു വ്യവസ്ഥയിൽ മാത്രമേ
  rationale: אַךְ എന്നതിന്റെ പരിമിതിപ്പെടുത്തുന്ന ബലവും בְּזֹאת അവതരിപ്പിക്കുന്ന നിബന്ധനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: יֵאֹתוּ לָנוּ
  choice: നമ്മോടു സമ്മതിക്കുകയുള്ളൂ
  rationale: Niphal രൂപം സമ്മതം, അനുകൂല മനോഭാവം, സന്നദ്ധത എന്നിവ സൂചിപ്പിക്കുന്നു; ചർച്ചയുടെ സന്ദർഭത്തിൽ ‘സമ്മതിക്കുക’ ഏറ്റവും സ്വാഭാവികമാണ്, എന്നാൽ പദത്തിന്റെ വ്യത്യസ്ത നിഴലുകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: കഥാസന്ദർഭത്തിലെ നിർദ്ദിഷ്ട പുരുഷസംഘത്തെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: നമ്മോടൊപ്പം താമസിച്ച്
  rationale: ישב എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ സഹവാസ/താമസ ആശയം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: ഒരൊറ്റ ജനമായിത്തീരാൻ
  rationale: ഒരു ഏകീകൃത സാമൂഹിക ജനവിഭാഗമായി മാറുന്നതിന്റെ ഫലാർഥം ‘ആയിത്തീരാൻ’ വ്യക്തമാക്കുന്നു; ഗോത്രസന്ദർഭത്തിൽ ‘രാഷ്ട്രം’ എന്നതിനെക്കാൾ ‘ജനം’ അനുയോജ്യമാണ്.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: നമ്മുടെ ഇടയിലുള്ള എല്ലാ ആണുങ്ങൾക്കും പരിച്ഛേദനം ചെയ്യണം
  rationale: בְּ ചേർന്ന infinitive construct നിബന്ധനയെ സൂചിപ്പിക്കുന്നു. זָכָר പ്രായപൂർത്തിയായ പുരുഷന്മാർക്ക് മാത്രമല്ലാത്തതിനാൽ ‘ആണുങ്ങൾ’ എന്നത് ‘പുരുഷന്മാർ’ എന്നതിനെക്കാൾ വ്യാപ്തി കൃത്യമായി സൂക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: അവർക്കു പരിച്ഛേദനം ചെയ്തിരിക്കുന്നതുപോലെ
  rationale: താരതമ്യബലവും അവരുടെ നിലവിലുള്ള പരിച്ഛേദിതാവസ്ഥയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. വാക്യത്തിലെ ഏക നിബന്ധനയുടെ ഊന്നൽ ‘മാത്രമേ’ എന്നതിലൂടെ സൂക്ഷിച്ചു; ദീർഘമായ പ്രസ്താവന വായിക്കാൻ സൗകര്യമാക്കാൻ ഡാഷും കോളനും ഉപയോഗിച്ചു.
