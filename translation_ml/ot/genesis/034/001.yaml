id: GEN.34.1
reference: Genesis 34:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: ml
  text: ലേയാ യാക്കോബിനു പ്രസവിച്ച മകളായ ദീനാ, ദേശത്തിലെ പുത്രിമാരെ കാണാൻ[a] പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശത്തിലെ സ്ത്രീകളെ സന്ദർശിക്കാൻ.” ഹീബ്രായിൽ അക്ഷരാർഥത്തിൽ “ദേശത്തിലെ പുത്രിമാരെ കാണാൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം പുറത്തേക്കു പോകുന്ന കഥാഗതിയെ സൂചിപ്പിക്കുന്നു. സ്ഥലം വ്യക്തമാക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അത് ‘പുറപ്പെട്ടു’ എന്നു നൽകി.
- source_word: דִינָה
  choice: ദീനാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בַּת לֵאָה
  choice: ലേയാ ... പ്രസവിച്ച മകളായ
  rationale: ദീനായെ മാതൃവംശബന്ധത്തിലൂടെ തിരിച്ചറിയിക്കുന്ന ഘടകമാണ്. തുടർന്നുള്ള ബന്ധവാക്യവുമായി സ്വാഭാവികമായി ചേർത്ത് മലയാളത്തിൽ നൽകി.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: ലേയാ യാക്കോബിനു പ്രസവിച്ച
  rationale: ബന്ധവാക്യത്തിന്റെ കർത്താവ് ലേയാ തന്നെയാണെന്നു മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ചു; לְיַעֲקֹב എന്നത് പിതൃത്വബന്ധം സൂചിപ്പിക്കുന്ന ‘യാക്കോബിനു’ എന്നു നൽകി.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: ראה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കാണുക’ ആണ്. സന്ദർശിക്കുക എന്ന സാമൂഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: ദേശത്തിലെ പുത്രിമാരെ
  rationale: ഹീബ്രായിലെ ‘ദേശത്തിന്റെ പുത്രിമാർ’ എന്ന പ്രയോഗത്തിന്റെ രൂപകൽപ്പന സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികമായ വിഭക്തിബന്ധം ഉപയോഗിച്ചു; ഇത് ദേശത്തിലെ സ്ത്രീകളെയോ പെൺകുട്ടികളെയോ സൂചിപ്പിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രായിലെ ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വാക്യത്തിന്റെ തുടക്കത്തിൽ ക്രമപ്പെടുത്തി. മുഖ്യപാഠത്തിലെ ‘കാണാൻ’ എന്ന നേരിട്ടുള്ള അർഥവും സാമൂഹിക സന്ദർശനസാധ്യതയും തമ്മിലുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
