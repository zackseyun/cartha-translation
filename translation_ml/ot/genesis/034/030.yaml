source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് ശിമെയോനോടും ലേവിയോടും പറഞ്ഞു: “നിങ്ങൾ എനിക്കു കഷ്ടം വരുത്തി; ഈ ദേശവാസികളായ കനാന്യരുടെയും പെരിസ്യരുടെയും ഇടയിൽ എന്നെ നാറ്റമുള്ളവനാക്കി.[a] ഞാൻ എണ്ണത്തിൽ കുറവായിരിക്കെ, അവർ എനിക്കെതിരെ ഒന്നിച്ചുകൂടി[b] എന്നെ അടിച്ചുവീഴ്ത്തും. അങ്ങനെ ഞാനും എന്റെ വീട്ടുകാരും നശിച്ചുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘എന്നെ വെറുപ്പിന് പാത്രമാക്കി’ അഥവാ ‘എന്നെ അരോചകനാക്കി’ എന്നും അർഥമാക്കാം.
    reason: എബ്രായത്തിലെ ‘നാറ്റമുണ്ടാക്കുക’ എന്ന ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ആലങ്കാരിക സാമൂഹിക അർഥം വ്യക്തമാക്കാൻ.
  - marker: b
    text: ‘അവർ എനിക്കെതിരെ കൂട്ടംചേരും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: നിഫാൽ രൂപത്തിലുള്ള ശത്രുതയോടെയുള്ള ഒന്നിച്ചുകൂടൽ എന്ന അർഥസൂക്ഷ്മത സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: നിങ്ങൾ എനിക്കു കഷ്ടം വരുത്തി
  rationale: മറ്റൊരാളുടെമേൽ കഷ്ടമോ ദുരന്തമോ വരുത്തുക എന്ന ക്രിയയുടെ കുറ്റാരോപണഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְהַבְאִישֵׁנִי
  choice: എന്നെ നാറ്റമുള്ളവനാക്കി
  rationale: ‘നാറ്റമുണ്ടാക്കുക’ എന്ന എബ്രായത്തിലെ ശക്തമായ ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ അത് സമൂഹത്തിന്റെ വെറുപ്പിനും അരോചകതയ്ക്കും പാത്രമാക്കുക എന്ന ആലങ്കാരിക അർഥത്തിലാണ്.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: ഈ ദേശവാസികളുടെ ഇടയിൽ
  rationale: കൂട്ടായ ഏകവചനപ്രയോഗം ദേശത്തിലെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: കനാന്യരുടെയും പെരിസ്യരുടെയും ഇടയിൽ
  rationale: യാക്കോബിന്റെ പേര് മോശമായിത്തീർന്ന സാമൂഹികവലയം എന്ന ആശയം ‘ഇടയിൽ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מְתֵי מִסְפָּר
  choice: എന്റെ ആളുകൾ എണ്ണത്തിൽ കുറവായതിനാൽ
  rationale: വാക്കുതോറുമുള്ള രൂപം യാക്കോബിനെ തന്നെ ‘എണ്ണത്തിലെ ആളുകൾ’ എന്നു വിശേഷിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്; അവന്റെ സംഘത്തിനോ വീട്ടാർക്കോ ആളുകൾ കുറവാണെന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: അവർ എനിക്കെതിരെ ഒന്നിച്ചുകൂടി
  rationale: ശത്രുതയോടെ കൂട്ടംചേരുന്നതും പരസ്പരം ഒന്നിക്കുന്നതുമായ നിഫാൽ രൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִכּוּנִי
  choice: എന്നെ അടിച്ചുവീഴ്ത്തും
  rationale: അക്രമിച്ച് തകർക്കുക എന്ന സൈനികസന്ദർഭത്തിലെ ശക്തി നിലനിർത്തുന്നു; ‘കൊല്ലും’ എന്നു വിവർത്തനം ചെയ്ത് ഫലം അനാവശ്യമായി മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: וְנִשְׁמַדְתִּי
  choice: ഞാനും ... നശിച്ചുപോകും
  rationale: സമ്പൂർണ നാശത്തിന്റെ ഭീഷണി നേരിട്ട് അറിയിക്കുന്നു; തുടർന്നുള്ള ‘എന്റെ കുടുംബവും’ എന്ന ഘടകത്തോടൊപ്പം മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: בֵּיתִי
  choice: എന്റെ കുടുംബം
  rationale: ഇവിടെ കെട്ടിടമല്ല, യാക്കോബിനോടു ബന്ധപ്പെട്ട കുടുംബ-ഗൃഹസമൂഹമാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് ‘കുടുംബം’ വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യാക്കോബിന്റെ ഭയം പ്രകടമാക്കുന്ന ചെറുവാക്യക്രമം നിലനിർത്തി. എബ്രായത്തിലെ ‘നാറ്റം’ എന്ന തീവ്രമായ ആലങ്കാരിക ചിത്രം മിനുക്കിക്കളയാതെ, അതിന്റെ സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
