id: GEN.34.11
reference: Genesis 34:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁכֶם֙ אֶל אָבִ֣י/ה וְ/אֶל אַחֶ֔י/הָ אֶמְצָא חֵ֖ן בְּ/עֵינֵי/כֶ֑ם וַ/אֲשֶׁ֥ר תֹּאמְר֛וּ אֵלַ֖/י אֶתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: ml
  text: 'പിന്നെ ശെഖേം അവളുടെ അപ്പനോടും അവളുടെ സഹോദരന്മാരോടും പറഞ്ഞു: “നിങ്ങളുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ[a]. നിങ്ങൾ എന്നോട് എന്തു പറഞ്ഞാലും[b] ഞാൻ തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ കാഴ്ചയിൽ എനിക്കു പ്രീതി ലഭിക്കട്ടെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങൾ എന്നോട് എന്തു ചോദിച്ചാലും ഞാൻ തരാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: അവളുടെ അപ്പനോടും അവളുടെ സഹോദരന്മാരോടും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל രണ്ടിടത്തും ‘-ഓട്’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിച്ചു; אַחֶיהָ എന്നത് പുരുഷലിംഗ ബഹുവചനമായതിനാൽ ‘സഹോദരന്മാർ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אֶמְצָא חֵן
  choice: എനിക്കു പ്രീതി ലഭിക്കട്ടെ
  rationale: സ്വീകാര്യതയോ അനുകൂലമനോഭാവമോ അഭ്യർഥിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ ദൃഷ്ടിയിൽ
  rationale: ‘നിങ്ങളുടെ കണ്ണുകളിൽ’ എന്ന മൂലരൂപകത്തിന്റെ അർഥം നിലനിർത്തുന്ന, മലയാളത്തിൽ പതിവായ പ്രയോഗം.
- source_word: וַאֲשֶׁר
  choice: എന്തു ... ആയാലും
  rationale: അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ തുറന്ന അർഥവ്യാപ്തി മലയാളത്തിൽ ‘എന്തു ... ആയാലും’ എന്ന ഘടനയിലൂടെ നൽകി.
- source_word: תֹּאמְרוּ אֵלַי
  choice: നിങ്ങൾ എന്നോട് എന്തു പറഞ്ഞാലും
  rationale: אָמַר אֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പറയുക’ നിലനിർത്തി; സന്ദർഭമനുസരിച്ചുള്ള ‘എന്നോട് എന്തു ചോദിച്ചാലും’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
- source_word: אֶתֵּן
  choice: ഞാൻ തരാം
  rationale: נָתַן എന്ന ക്രിയയുടെ വിശാലമായ ‘കൊടുക്കുക’ എന്ന അർഥം നിലനിർത്തി; വിവാഹവിലയുടെ സന്ദർഭത്തിലേക്ക് ചുരുക്കുന്ന ‘നൽകാം/അടയ്ക്കാം’ എന്ന അർഥം നിർബന്ധിച്ചില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. എബ്രായത്തിലെ അഭ്യർഥനാഭാവവും ‘പറയുക’/‘ചോദിക്കുക’ എന്ന സന്ദർഭസാധ്യമായ അർഥവ്യത്യാസവും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
