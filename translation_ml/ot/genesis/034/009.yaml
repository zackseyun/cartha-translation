id: GEN.34.9
reference: Genesis 34:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: ml
  text: 'ഞങ്ങളുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക: നിങ്ങളുടെ പുത്രിമാരെ ഞങ്ങൾക്കു വിവാഹം കഴിച്ചുകൊടുക്കുക; ഞങ്ങളുടെ പുത്രിമാരെ നിങ്ങൾ വിവാഹം കഴിക്കുക.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: ഞങ്ങളുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: חתן എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം പരസ്പരം വിവാഹബന്ധങ്ങൾ സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ പരസ്പരതയും കുടുംബങ്ങൾ തമ്മിലുള്ള ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രിമാരെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ ബഹുവചന സംയുക്തരൂപത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: תִּתְּנוּ לָנוּ
  choice: ഞങ്ങൾക്കു വിവാഹം കഴിച്ചുതരുക
  rationale: ഈ സന്ദർഭത്തിൽ נתן എന്നത് പുത്രിമാരെ വിവാഹത്തിന് നൽകുന്നതാണ്. മലയാളത്തിൽ വെറും ‘തരുക’ എന്നത് തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ വിവാഹാർഥം വാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: ഞങ്ങളുടെ പുത്രിമാരെ നിങ്ങൾ വിവാഹം കഴിക്കുക
  rationale: לקח എന്ന ക്രിയയ്ക്ക് ഇവിടെ വിവാഹം ചെയ്യുക എന്ന സന്ദർഭാർഥമുണ്ട്. എബ്രായത്തിലെ ‘നിങ്ങൾക്കായി എടുക്കുക’ എന്ന പദാനുക്രമം മലയാളത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമായതിനാൽ ഉദ്ദേശ്യം നേരിട്ട് നൽകി; വാക്യത്തിലെ പരസ്പര ഘടന നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി. ‘പുത്രിമാർ’ എന്ന പദം ബൈബിൾ ഗദ്യത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു. വിവാഹസന്ദർഭം ‘തരുക’, ‘എടുക്കുക’ എന്നീ എബ്രായ പ്രയോഗങ്ങളിൽ അന്തർലീനമായതിനാൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.
