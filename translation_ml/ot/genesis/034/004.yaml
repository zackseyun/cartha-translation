  text: And Shechem said to Hamor his father, “Get me this girl as a wife.”
translation:
  language: ml
  text: 'ശെഖേം തന്റെ അപ്പനായ ഹാമോറിനോട് പറഞ്ഞു: “ഈ പെൺകുട്ടിയെ എനിക്ക് ഭാര്യയായി നേടിത്തരൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לִי
  choice: എനിക്ക് ... നേടിത്തരണമേ
  rationale: ഇവിടെ לקח എന്ന ക്രിയയുടെ പദാനുപദമായ ‘എടുക്കുക’ എന്നതിലുപരി, പിതാവ് വിവാഹം ക്രമീകരിച്ച് പെൺകുട്ടിയെ മകനുവേണ്ടി ഭാര്യയായി നേടിക്കൊടുക്കണം എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: ഈ പെൺകുട്ടിയെ
  rationale: יַלְדָּה ഇവിടെ ഒരു യുവതിയെ സൂചിപ്പിക്കുന്നു; ‘ഈ പെൺകുട്ടി’ എന്നത് മൂലപാഠത്തിലെ നേരിട്ടുള്ളതും വസ്തുവൽക്കരണസ്വഭാവമുള്ളതുമായ പ്രയോഗം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധത്തിന്റെ ഉദ്ദേശ്യം സംക്ഷിപ്തമായും കൃത്യമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനായ
  rationale: ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തുകയും സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ശെഖേമിന്റെ കല്പനാത്മക അഭ്യർഥനയും ‘ഈ പെൺകുട്ടി’ എന്ന മൂലപാഠത്തിന്റെ കഠിനമായ ഭാവവും മൃദൂകരിച്ചിട്ടില്ല.
