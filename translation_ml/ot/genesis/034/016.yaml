  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: ml
  text: അപ്പോൾ ഞങ്ങൾ ഞങ്ങളുടെ പുത്രിമാരെ നിങ്ങൾക്കു തരുകയും നിങ്ങളുടെ പുത്രിമാരെ ഞങ്ങൾക്കായി എടുക്കുകയും ചെയ്യും; ഞങ്ങൾ നിങ്ങളോടൊപ്പം താമസിക്കുകയും ഒരു ജനമായിത്തീരുകയും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ ഒരു ജനമായിരിക്കും.” എബ്രായവാചകം അക്ഷരാർഥത്തിൽ “ഞങ്ങൾ ഒരു ജനമായിരിക്കും” എന്നാണ്; അതിനെ ഫലമായി ഉണ്ടാകുന്ന അവസ്ഥയായോ (“ഒരു ജനമായിത്തീരും”), കൂടുതൽ രൂപാനുസൃതമായി സ്ഥിരാവസ്ഥയായോ (“ഒരു ജനമായിരിക്കും”) വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: അപ്പോൾ ഞങ്ങൾ ... തരും
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥ നിറവേറ്റിയാൽ ഉണ്ടാകുന്ന ഫലമാണ് ഇവിടെ പറയുന്നത്; അതിനാൽ വാവോടുകൂടിയ ഖാൽ പൂർണക്രിയയെ സന്ദർഭാനുസൃതമായ ഭാവികാലത്തിൽ ‘അപ്പോൾ ... തരും’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: בְּנֹתֵינוּ
  choice: ഞങ്ങളുടെ പുത്രിമാരെ
  rationale: കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കു
  rationale: കൊടുക്കൽക്രിയയുടെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּנֹתֵיכֶם
  choice: നിങ്ങളുടെ പുത്രിമാരെ
  rationale: പരസ്പര വിവാഹക്രമീകരണത്തിൽ ഉപയോഗിച്ച കുടുംബബന്ധപദം അതേപടി നിലനിർത്തുന്നു.
- source_word: נִקַּח
  choice: എടുക്കും
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണ്. സന്ദർഭം വിവാഹത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘വിവാഹം കഴിക്കും’ എന്ന് വ്യാഖ്യാനം ചേർക്കാതെ എബ്രായപ്രയോഗം നിലനിർത്തി.
- source_word: לָנוּ
  choice: ഞങ്ങൾക്കായി
  rationale: എടുക്കുന്നവർക്കുള്ള പ്രയോജനമോ സ്വന്തമാക്കലോ സൂചിപ്പിക്കുന്ന ദാതൃഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְיָשַׁבְנוּ
  choice: ഞങ്ങൾ ... താമസിച്ച്
  rationale: ישב എന്നതിന് ‘വസിക്കുക, താമസിക്കുക, പാർക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; ഈ സാമൂഹിക സഹവാസസന്ദർഭത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: സഹവാസം സൂചിപ്പിക്കുന്ന പൂർവപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള മലയാളസമാനത.
- source_word: וְהָיִינוּ
  choice: ആയിത്തീരും
  rationale: അക്ഷരാർഥം ‘ആയിരിക്കും’ എന്നാണെങ്കിലും, വിവാഹബന്ധത്തിന്റെയും സഹവാസത്തിന്റെയും ഫലമായി ഉണ്ടാകുന്ന അവസ്ഥയെ മലയാളത്തിൽ ‘ആയിത്തീരും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לְעַם אֶחָד
  choice: ഒരു ജനമായി
  rationale: עַם ഒരു ആധുനിക രാഷ്ട്രീയ രാഷ്ട്രത്തേക്കാൾ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഒരു ജനമായി’ എന്നത് യോജിക്കുന്നു.
theological_decisions:
- issue: וְהָיִינוּ לְעַם אֶחָד എന്നതിലെ ഫലാവസ്ഥയും സ്ഥിരാവസ്ഥയും തമ്മിലുള്ള അർഥസാധ്യത
  choice: ഒരു ജനമായിത്തീരും
  alternative: ഒരു ജനമായിരിക്കും
  rationale: സന്ദർഭത്തിലെ വിവാഹബന്ധത്തിന്റെയും ഒരുമിച്ചുള്ള താമസത്തിന്റെയും ഫലം ഊന്നിക്കാണിക്കാൻ മുഖ്യവാചകത്തിൽ ‘ആയിത്തീരും’ സ്വീകരിച്ചു; എന്നാൽ എബ്രായപ്രയോഗം ‘ആയിരിക്കും’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനവും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വിവാഹസന്ദർഭം വ്യക്തമാണെങ്കിലും ‘എടുക്കുക’ എന്ന മൂലക്രിയയ്ക്ക് വ്യാഖ്യാനപരമായ വിപുലീകരണം ചേർത്തിട്ടില്ല. പരസ്പരതയും വ്യവസ്ഥയുടെ ഫലസൂചനയും വ്യക്തമായി നിലനിർത്തി.
