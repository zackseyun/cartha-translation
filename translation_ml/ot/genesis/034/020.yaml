id: GEN.34.20
reference: Genesis 34:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: ml
  text: 'അങ്ങനെ ഹമോരും അവന്റെ മകനായ ശെഖേമും തങ്ങളുടെ നഗരവാതിൽക്കലേക്കു വന്നു; അവർ തങ്ങളുടെ നഗരത്തിലെ പുരുഷന്മാരോടു ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ മുന്നേറ്റം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വന്നു/പോയി’ എന്ന ദൃഷ്ടികോണഭേദം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: חֲמוֹר
  choice: ഹമോർ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: അവന്റെ മകനായ ശെഖേമും
  rationale: പിതൃപുത്രബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
- source_word: אֶל שַׁעַר עִירָם
  choice: തങ്ങളുടെ നഗരവാതിൽക്കൽ
  rationale: ശബ്‌ദാർഥമായ ‘അവരുടെ നഗരത്തിന്റെ വാതിൽക്കൽ’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പുരാതന നഗരത്തിലെ പൊതുചർച്ചാസ്ഥലം എന്ന പശ്ചാത്തലവും ‘നഗരവാതിൽ’ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרוּ
  choice: സംസാരിച്ചു
  rationale: דבר אֶל എന്നത് ‘ആരോടു സംസാരിക്കുക/അഭിസംബോധന ചെയ്യുക’ എന്നാണ്; പൊതുസമ്മേളനസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: നഗരത്തിലെ പുരുഷന്മാരോടു
  rationale: אַנְשֵׁי എന്നതിലെ പുരുഷലിംഗസൂചന സംരക്ഷിക്കുന്നു; നഗരവാതിൽക്കൽ പൗരകാര്യങ്ങൾ ചർച്ചചെയ്യാൻ കൂടിയിരുന്ന പുരുഷന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള സംഭാഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നതിന് കോളനോടുകൂടിയ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ നഗരവാതിൽ എന്ന പൗരസന്ദർഭവും ‘പുരുഷന്മാർ’ എന്ന ലിംഗസൂചനയും നിലനിർത്തി; വാക്യാവസാനം തുടർവചനത്തിലെ പ്രസംഗത്തിലേക്ക് നയിക്കുന്ന കോളൻ ഉപയോഗിച്ചു.
