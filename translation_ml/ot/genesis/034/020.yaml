revisions:
- from: 'അങ്ങനെ ഹമോരും അവന്റെ മകനായ ശെഖേമും തങ്ങളുടെ നഗരവാതിൽക്കൽ എത്തി, നഗരത്തിലെ പുരുഷന്മാരോടു സംസാരിച്ചു പറഞ്ഞു:'
  to: 'അങ്ങനെ ഹമോരും അവന്റെ മകനായ ശെഖേമും തങ്ങളുടെ നഗരവാതിൽക്കലേക്കു വന്നു; അവർ തങ്ങളുടെ നഗരത്തിലെ പുരുഷന്മാരോടു ഇങ്ങനെ പറഞ്ഞു:'
  rationale: 'The revision preserves every source element while replacing an awkward duplicated speech expression with a natural Malayalam speech introducer and representing movement toward the gate more explicitly. No footnote is required: the civic function of the gate is contextual and should not be added to the translated text.'
