source:
  edition: WLC
  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: ml
  text: യാക്കോബിന്റെ പുത്രന്മാർ കൊല്ലപ്പെട്ടവരുടെ അടുക്കൽ വന്ന് നഗരം കൊള്ളയടിച്ചു; കാരണം, അവിടെ അവരുടെ സഹോദരി അശുദ്ധയാക്കപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവർ അവരുടെ സഹോദരിയെ അശുദ്ധയാക്കിയ നഗരം.’ എബ്രായവാക്യം ചുരുക്കപ്പെട്ടതാണ്; ‘അവർ’ എന്നത് നഗരവുമായി ബന്ധപ്പെട്ട പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു. ‘കൊല്ലപ്പെട്ടവരുടെ മേൽ വന്നു’ എന്നും ആദ്യഭാഗം പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക ഘടന നേരിട്ട് നിലനിർത്തുന്നു; കുടുംബബന്ധത്തിനുള്ള ആഖ്യാന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: കൊല്ലപ്പെട്ടവരുടെ അടുക്കൽ വന്ന്
  rationale: חֲלָלִים എന്നത് അക്രമത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. בָּאוּ עַל ഇവിടെ അവരുടെ അടുത്തേക്കോ അവരുടെ മേലേക്കോ വന്നതെന്ന അർഥം നൽകാം; മലയാളത്തിൽ അനാവശ്യമായി പുതിയ ആക്രമണം സൂചിപ്പിക്കാതിരിക്കാൻ ‘അടുക്കൽ വന്ന്’ സ്വീകരിച്ചു.
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: നഗരം കൊള്ളയടിച്ചു
  rationale: בזז യുദ്ധാനന്തര കൊള്ളയെയും സ്വത്തുക്കൾ അപഹരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു; ‘കൊള്ളയടിച്ചു’ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളമാണ്.
- source_word: אֲשֶׁר
  choice: കാരണം, അവിടെ
  rationale: അക്ഷരാർഥത്തിൽ ബന്ധസൂചകമായ ‘അത്/ഏത്’ എന്ന ഘടകമാണെങ്കിലും, ചുരുക്കപ്പെട്ട എബ്രായ വാക്യഘടനയിൽ നഗരം കൊള്ളയടിച്ചതിന്റെ കാരണവും സ്ഥലബന്ധവും സൂചിപ്പിക്കുന്നു. ‘അവിടെ’ കർത്താവിനെ തെറ്റായി യാക്കോബിന്റെ പുത്രന്മാരായി വായിക്കുന്ന അപകടം ഒഴിവാക്കുന്നു.
- source_word: טִמְּאוּ
  choice: അശുദ്ധയാക്കപ്പെട്ടിരുന്നു
  rationale: പീയേൽ രൂപം അശുദ്ധമാക്കുക/കളങ്കപ്പെടുത്തുക എന്ന ധാർമ്മികവും സാമൂഹികവുമായ വ്യാപ്തി വഹിക്കുന്നു. കർത്തൃവാചകത്തിലെ വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവിനെ തെറ്റായി തിരിച്ചറിയാതിരിക്കാൻ മലയാളത്തിൽ കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: אֲחוֹתָם
  choice: അവരുടെ സഹോദരി
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധവും ഉടമസ്ഥസർവനാമവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സഹോദരിയെ അശുദ്ധയാക്കിയവരുടെ തിരിച്ചറിയൽ
  choice: കർമണിപ്രയോഗമായ ‘അവരുടെ സഹോദരി അശുദ്ധയാക്കപ്പെട്ടിരുന്നു’
  alternative: ‘അവർ അവരുടെ സഹോദരിയെ അശുദ്ധയാക്കിയിരുന്നു’
  rationale: എബ്രായത്തിലെ ബഹുവചന കർത്താവ് സന്ദർഭത്തിൽ നഗരവുമായി ബന്ധപ്പെട്ട പുരുഷന്മാരെയാണു സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവർ’ ഉപയോഗിച്ചാൽ സമീപസ്ഥ പ്രധാനകർത്താവായ യാക്കോബിന്റെ പുത്രന്മാരെ തെറ്റായി സൂചിപ്പിക്കാം. കർമണിപ്രയോഗം ആ തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും മൂലത്തിലെ ചുരുക്കം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം. ‘പുത്രന്മാർ’, ‘അശുദ്ധയാക്കപ്പെട്ടിരുന്നു’ എന്നിവ മൂലത്തിലെ കുടുംബപരവും ധാർമ്മിക-സാമൂഹികവുമായ ഭാവങ്ങൾ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മൂലവാക്യത്തിലെ ഘടനാപരമായ ദ്വയാർഥസാധ്യത രേഖപ്പെടുത്തുന്നു.
