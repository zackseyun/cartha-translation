lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: സ്വീകാര്യമായി
  rationale: יִטב എന്ന ക്രിയയും בְּעֵינֵי എന്ന പ്രയോഗവും ചേർന്ന് ഇവിടെ അംഗീകാരമോ പ്രസാദമോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ വിലയിരുത്തൽ അറിയിക്കാൻ ‘സ്വീകാര്യമായി’ എന്നു നൽകി.
- source_word: דִבְרֵיהֶם
  choice: അവരുടെ വാക്കുകൾ
  rationale: דָּבָר എന്ന പദത്തിന്റെ ബഹുവചനരൂപവും മൂന്നാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് നിലനിർത്തുന്നു; ‘നിർദേശം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകവും സങ്കുചിതവുമാകും.
- source_word: בְּעֵינֵי
  choice: ഹമോരിനും ... ശെഖേമിനും
  rationale: അക്ഷരാർഥത്തിൽ ‘കണ്ണുകളിൽ’ എന്നാണെങ്കിലും ഇവിടെ അഭിപ്രായമോ അംഗീകാരമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്. മലയാളത്തിൽ ദാതൃവിഭക്തിയോടുകൂടിയ ഈ രൂപം അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֲמוֹר
  choice: ഹമോർ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; വാക്യത്തിലെ വിഭക്തിരൂപം ‘ഹമോരിന്’ എന്നാണ്.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; വാക്യത്തിലെ വിഭക്തിരൂപം ‘ശെഖേമിന്’ എന്നാണ്.
- source_word: בֶּן חֲמוֹר
  choice: ഹമോരിന്റെ മകനായ
  rationale: പിതൃപുത്രബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
