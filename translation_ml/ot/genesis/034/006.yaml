language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֛א חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם אֶֽל יַעֲקֹ֑ב לְ/דַבֵּ֖ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/006.yaml
  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: ml
  text: പിന്നെ ശെഖേമിന്റെ അപ്പനായ ഹമോർ യാക്കോബിന്റെ അടുക്കലേക്കു യാക്കോബിനോടു സംസാരിക്കാനായി പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനസൂചന നിലനിർത്തിക്കൊണ്ട്, കഥനത്തിലെ ലളിതമായ ഭൂതകാലപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: חֲמוֹר
  choice: ഹമോർ
  rationale: എബ്രായ വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲבִי שְׁכֶם
  choice: ശെഖേമിന്റെ അപ്പനായ
  rationale: എബ്രായത്തിലെ ബന്ധനിർമാണം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל יַעֲקֹב
  choice: യാക്കോബിന്റെ അടുക്കലേക്കു
  rationale: אֶל സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശയും സമീപനവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְדַבֵּר אִתּוֹ
  choice: അവനോടു സംസാരിക്കാൻ
  rationale: ലാമെദ് ചേർന്ന infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; אִתּוֹ സംഭാഷണപരമായ ‘അവനോടു’ എന്ന അർഥം നൽകുന്നു. സർവനാമം ഏറ്റവും സ്വാഭാവികമായി അടുത്ത് പറഞ്ഞ യാക്കോബിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַ
  choice: പിന്നെ
  rationale: വാവ് കഥയിലെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പുറപ്പെട്ടു’ എന്നത് മൂലത്തിലെ ദിശാസൂചന നിലനിർത്തുന്നു; ‘അവനോടു സംസാരിക്കാൻ’ സംഭാഷണപരമായ ഭാവം സംരക്ഷിക്കുന്നു.
