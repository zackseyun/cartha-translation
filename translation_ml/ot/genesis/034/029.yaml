id: GEN.34.29
reference: Genesis 34:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת כָּל חֵילָ֤/ם וְ/אֶת כָּל טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם שָׁב֖וּ וַ/יָּבֹ֑זּוּ וְ/אֵ֖ת כָּל אֲשֶׁ֥ר בַּ/בָּֽיִת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: ml
  text: അവരുടെ സമ്പത്തെല്ലാം, കുഞ്ഞുങ്ങളെയെല്ലാം[a], ഭാര്യമാരെയും അവർ പിടിച്ചുകൊണ്ടുപോയി; വീട്ടിലുണ്ടായിരുന്നതെല്ലാം[b] കൊള്ളയടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ കുട്ടികളെയെല്ലാം’ അല്ലെങ്കിൽ ‘അവരുടെ ആശ്രിതരെയെല്ലാം’; ടַף എന്ന ഹീബ്രുപദം സാധാരണയായി ചെറിയ കുട്ടികളെയോ വീട്ടിലെ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വീട്ടുകാർക്കുണ്ടായിരുന്നതെല്ലാം’; ‘വീട്’ എന്ന ഹീബ്രുപദം ചിലപ്പോൾ വീട്ടുകാരെയും അവരുടെ സ്വത്തുക്കളെയും ഉൾക്കൊള്ളുന്ന അർഥത്തിൽ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: അവരുടെ സമ്പത്തെല്ലാം
  rationale: חַיִל ഇവിടെ സൈനികശക്തിയെയല്ല, സ്വത്ത്, വിഭവങ്ങൾ, സമ്പത്ത് എന്നിവയെ സൂചിപ്പിക്കുന്നു. ഒരു പ്രത്യേകതരം വസ്തുവിലേക്കു അർഥം ചുരുക്കാതെ ‘സമ്പത്ത്’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: טַפָּם
  choice: കുഞ്ഞുങ്ങളെയെല്ലാം
  rationale: טַף സാധാരണയായി ചെറിയ കുട്ടികളെയോ വീട്ടിലെ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘കുഞ്ഞുങ്ങൾ’ സ്വാഭാവികവും പ്രാഥമിക അർഥത്തോട് അടുത്തതുമാണ്.
- source_word: נְשֵׁיהֶם
  choice: ഭാര്യമാരെയും
  rationale: אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടെങ്കിലും, കുടുംബാംഗങ്ങളുടെ ഈ പട്ടികയിൽ ബന്ധസൂചകമായ ‘ഭാര്യമാർ’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: שָׁבוּ
  choice: പിടിച്ചുകൊണ്ടുപോയി
  rationale: שָׁבָה യുദ്ധത്തിൽ ആളുകളെ ബന്ദികളായി പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിടിച്ചുകൊണ്ടുപോയി’ ആ ബലപ്രയോഗവും കൊണ്ടുപോകലും സ്വാഭാവികമായി അറിയിക്കുന്നു; ഹീബ്രുവിലെ സംയുക്ത കർമപ്പട്ടികയിലെ അസാധാരണതയും പൂർണമായി മായ്ച്ചുകളയുന്നില്ല.
- source_word: וַיָּבֹזּוּ
  choice: കൊള്ളയടിച്ചു
  rationale: בזז കൊള്ളയിടുക, യുദ്ധമുതലായി കൈവശപ്പെടുത്തുക എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു. ‘കൊള്ളയടിച്ചു’ ആ ഹിംസാത്മക ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: വീട്ടിലുണ്ടായിരുന്നതെല്ലാം
  rationale: ബൈബിള്‍ ഹീബ്രുവിൽ בַּיִת എന്നത് വീടിനെയോ വിശാലമായി വീട്ടുകാരെയും വീട്ടുസ്വത്തിനെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകം സ്ഥലാർഥത്തോട് ചേർന്ന് നിൽക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഹീബ്രു വാക്യത്തിലെ കർമങ്ങളുടെ ക്രമം നിലനിർത്തിയിട്ടുണ്ട്. ആളുകളെയും സമ്പത്തിനെയും ഒരേ ക്രിയയോടു ചേർക്കുന്ന ഉറവിടവാക്യത്തിന്റെ അസാധാരണത അമിതമായി വ്യാഖ്യാനിച്ച് പരിഹരിക്കാതെ, ‘പിടിച്ചുകൊണ്ടുപോയി’ എന്ന വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
