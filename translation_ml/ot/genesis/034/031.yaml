  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֑וּ הַ/כְ/זוֹנָ֕ה יַעֲשֶׂ֖ה אֶת אֲחוֹתֵֽ/נוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: ml
  text: 'എന്നാൽ അവർ പറഞ്ഞു[a]: “അവൻ വേശ്യയെപ്പോലെ ഞങ്ങളുടെ സഹോദരിയെ പരിഗണിക്കണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ ഞങ്ങളുടെ സഹോദരിയെ വേശ്യയെപ്പോലെ ആക്കണമോ?” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘ചെയ്യുക/ആക്കുക’ എന്നാണ്; എന്നാൽ ഇവിടെ ‘പരിഗണിക്കുക’ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: എന്നാൽ അവർ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ യാക്കോബിന്റെ ശാസനയ്ക്കുള്ള എതിർസ്വഭാവമുള്ള മറുപടിയാണ് ഇവിടെ; അതിനാൽ waw-consecutive-ന്റെ സന്ദർഭപരമായ adversative ഭാവം ‘എന്നാൽ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַכְזוֹנָה
  choice: ഒരു വേശ്യയോടെന്നപോലെ
  rationale: ചോദ്യസൂചകമായ ה, ഉപമാസൂചകമായ כ, ‘വേശ്യ’ എന്നർഥമുള്ള זונה എന്നിവയുടെ ഘടന സംരക്ഷിച്ച് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יַעֲשֶׂה
  choice: പെരുമാറണമോ
  rationale: עשה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ചെയ്യുക/ആക്കുക’ എന്നാണെങ്കിലും, വ്യക്തിയെ നേരിട്ടുള്ള കർമമായി സ്വീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പെരുമാറുക’ എന്നത് ഉദ്ദേശിച്ച അർഥം സ്വാഭാവികമായി നൽകുന്നു; imperfect ഇവിടെ ആക്ഷേപാത്മകമായ rhetorical question ആയി വരുന്നു.
- source_word: אֶת אֲחוֹתֵנוּ
  choice: ഞങ്ങളുടെ സഹോദരിയോട്
  rationale: אֶת നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാളത്തിലെ ‘പെരുമാറുക’ എന്ന ക്രിയയോടൊപ്പം ആവശ്യമായ ‘-യോട്’ വിഭക്തിയിലൂടെ അതിന്റെ വാക്യഘടനാപരമായ പങ്ക് പ്രകടമാക്കുന്നു. אֲחוֹתֵנוּ എന്നതിന്റെ കുടുംബബന്ധവും ഉടമസ്ഥതയും ‘ഞങ്ങളുടെ സഹോദരി’ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. സഹോദരന്മാരുടെ ആക്ഷേപാത്മക ചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; മൂലത്തിലെ ‘ചെയ്യുക/ആക്കുക’ എന്ന ക്രിയയുടെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
