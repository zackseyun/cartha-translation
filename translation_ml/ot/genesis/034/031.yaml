  source_fidelity: The draft correctly renders the adversative narrative reply, the rhetorical force of the imperfect, the familial possessive, and the comparison expressed by הַכְזוֹנָה. However, the Malayalam construction with ‘പെരുമാറുക’ and ‘ഒരു വേശ്യയോടെന്നപോലെ’ is somewhat heavy and can obscure that the sister herself is being compared to a prostitute.
  naturalness: ‘വേശ്യയെപ്പോലെ ഞങ്ങളുടെ സഹോദരിയെ പരിഗണിക്കണമോ?’ is more idiomatic modern Malayalam and gives the rhetorical protest a clear, direct form. It also avoids the stacked postpositions in ‘സഹോദരിയോട് ഒരു വേശ്യയോടെന്നപോലെ.’
  terminology: ‘വേശ്യ’ is an accurate, current equivalent for זֹנָה in this context. ‘പരിഗണിക്കുക’ appropriately conveys the contextual sense of עשה without importing a doctrinal or interpretive claim.
  issues:
