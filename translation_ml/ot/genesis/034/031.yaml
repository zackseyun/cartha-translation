  - severity: low
    issue: The footnote's alternative can be phrased more precisely in Malayalam.
    rationale: Using ‘ആക്കുക’ with ‘വേശ്യയെപ്പോലെ’ more directly reflects the literal ‘do/make’ alternative and makes clear that the comparison modifies ‘our sister.’
