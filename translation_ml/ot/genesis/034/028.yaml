source:
  edition: WLC
  text: אֶת צֹאנָ֥/ם וְ/אֶת בְּקָרָ֖/ם וְ/אֶת חֲמֹרֵי/הֶּ֑ם וְ/אֵ֧ת אֲשֶׁר בָּ/עִ֛יר וְ/אֶת אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה לָקָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: ml
  text: അവരുടെ ആട്ടിൻപറ്റങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും കഴുതകളെയും നഗരത്തിലുണ്ടായിരുന്നതൊക്കെയും വയലിൽ[a] ഉണ്ടായിരുന്നതൊക്കെയും അവർ എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാട്ടിൻപ്രദേശത്ത്.’
    reason: שָׂדֶה എന്ന പദത്തിന് വയൽ മാത്രമല്ല, തുറന്ന നാട്ടിൻപ്രദേശം എന്ന വിശാലാർഥവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: צֹאנָם
  choice: അവരുടെ ആട്ടിൻപറ്റങ്ങൾ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ആട്ടിൻപറ്റങ്ങൾ’ ഈ കൂട്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּקָרָם
  choice: അവരുടെ കന്നുകാലിക്കൂട്ടങ്ങൾ
  rationale: בָּקָר സാധാരണയായി പശുവർഗത്തിലെ വലിയ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ കൂട്ടാർഥം നിലനിർത്തുകയും צֹאן എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חֲמֹרֵיהֶם
  choice: അവരുടെ കഴുതകൾ
  rationale: חֲמוֹר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, ആധുനിക മലയാള രൂപം ‘കഴുത’യാണ്.
- source_word: אֲשֶׁר בָּעִיר
  choice: നഗരത്തിലുണ്ടായിരുന്നതൊക്കെയും
  rationale: אֲשֶׁר എന്ന ആപേക്ഷിക പ്രയോഗത്തിന്റെ വിശാലവും അനിശ്ചിതവുമായ പരിധി ‘ഉണ്ടായിരുന്നതൊക്കെയും’ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: വയലിൽ ഉണ്ടായിരുന്നതൊക്കെയും
  rationale: שָׂדֶה എന്നതിന് വയൽ എന്നും തുറന്ന നാട്ടിൻപ്രദേശം എന്നും അർഥമാകാം. ഇവിടെ ‘വയൽ’ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷയാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לָקָחוּ
  choice: അവർ എടുത്തു
  rationale: לָקַח എന്ന സാധാരണ ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണ്. കൊള്ളയുടെ സന്ദർഭം കഥയിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ‘പിടിച്ചെടുത്തു’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. എബ്രായത്തിലെ പട്ടികാക്രമവും ആവർത്തിച്ചുള്ള സമഗ്രതയും നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനനുസരിച്ച് മുഖ്യക്രിയ അവസാനം വെച്ചിരിക്കുന്നു.
