  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: ml
  text: ദേശത്തിന്റെ പ്രഭുവായ ഹിവ്യനായ ഹമോരിന്റെ മകൻ ശെഖേം അവളെ കണ്ടപ്പോൾ, അവളെ പിടിച്ച് അവളോടു ശയിച്ച് അവളെ അപമാനിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ ലംഘിച്ചു” അല്ലെങ്കിൽ “അവളെ പീഡിപ്പിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് പീഡിപ്പിക്കുക, താഴ്ത്തുക, അപമാനിക്കുക, ലംഘിക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഈ സന്ദർഭത്തിൽ അത് ലൈംഗിക അതിക്രമത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ പല പരിഭാഷകളും “അവളെ ബലാത്സംഗം ചെയ്തു” എന്നു കൂടുതൽ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: അവളെ കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കാണുക’ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: ഹിവ്യനായ ഹമോരിന്റെ മകൻ ശെഖേം
  rationale: വ്യക്തിനാമങ്ങളും ജനവിഭാഗനാമവും മലയാളത്തിലെ പതിവനുസരിച്ച് ലിപ്യന്തരിച്ചു; ബന്ധം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി.
- source_word: נְשִׂיא הָאָרֶץ
  choice: ദേശത്തിന്റെ പ്രഭു
  rationale: נָשִׂיא എന്നത് നേതാവ്, പ്രഭു, പ്രധാനി എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. രാജകുമാരൻ എന്ന വംശപരമായ അർഥം അനാവശ്യമായി ചുമത്താതെ സാമൂഹിക-രാഷ്ട്രീയ പദവി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקַּח אֹתָהּ
  choice: അവളെ പിടിച്ചുകൊണ്ടുപോയി
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ ബലപ്രയോഗപരമായ തുടർച്ച സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; അന്തിമക്രിയയാണ് അതിന്റെ ലൈംഗിക അതിക്രമസ്വഭാവം നിർണയിക്കുന്നത്.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: അവളോടുകൂടെ ശയിച്ച്
  rationale: ലൈംഗികബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ ഗൗരവവും ക്രമവും നിലനിർത്തുന്ന മലയാളപ്രയോഗം.
- source_word: וַיְעַנֶּהָ
  choice: അവളെ മാനഭംഗപ്പെടുത്തി
  rationale: പിയേൽ രൂപത്തിലുള്ള ענה പീഡിപ്പിക്കുക, അപമാനിക്കുക, ലംഘിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ഇവിടെ ലൈംഗിക അതിക്രമവും അപമാനവും ഒരുമിച്ച് വ്യക്തമാക്കുന്ന, എന്നാൽ ക്രിയ ഒറ്റയ്ക്ക് പറയുന്നതിലധികം നിയമപരമായ പ്രത്യേകത ചുമത്താത്ത പ്രയോഗമാണിത്.
theological_decisions:
- issue: ലൈംഗിക അതിക്രമം മയപ്പെടുത്താതെയും എബ്രായത്തേക്കാൾ അധികം നിർവചിക്കാതെയും അവതരിപ്പിക്കൽ
  choice: ‘അവളെ പിടിച്ചുകൊണ്ടുപോയി അവളോടുകൂടെ ശയിച്ച് അവളെ മാനഭംഗപ്പെടുത്തി’
  alternative: ‘അവളെ പിടിച്ചുകൊണ്ടുപോയി ബലാത്സംഗം ചെയ്തു’
  rationale: മൂന്നു എബ്രായ ക്രിയകളുടെ ആഖ്യാനക്രമം നിലനിർത്തുന്നു. അവസാനത്തെ ענהയുടെ അപമാനം/ലംഘനം എന്ന അർഥവ്യാപ്തിയും സന്ദർഭത്തിലെ നിർബന്ധിത ലൈംഗിക അതിക്രമവും ‘മാനഭംഗപ്പെടുത്തി’ വ്യക്തമാക്കുന്നു; ‘ബലാത്സംഗം ചെയ്തു’ സന്ദർഭപരമായി ന്യായമായ കൂടുതൽ നേരിട്ടുള്ള വ്യാഖ്യാനമാണെന്ന് അടിക്കുറിപ്പ് അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. അതിക്രമത്തെ മയപ്പെടുത്തുന്ന യൂഫെമിസം ഒഴിവാക്കിയെങ്കിലും എബ്രായത്തിലെ ക്രിയാക്രമവും വാക്കിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകൾക്കും മുഖ്യപാഠത്തിൽ അടയാളമുണ്ട്.
