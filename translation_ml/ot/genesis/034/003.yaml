id: GEN.34.3
reference: Genesis 34:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: ml
  text: അവന്റെ ഉള്ളം യാക്കോബിന്റെ മകളായ ദീനയോടു പറ്റിച്ചേർന്നു; അവൻ ആ യുവതിയെ സ്നേഹിച്ചു, അവളുടെ ഹൃദയത്തോടു സംസാരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹൃദയത്തോടു സംസാരിച്ചു” എന്നത് സ്നേഹപൂർവമായോ ദയാപൂർവമായോ ആശ്വാസകരമായോ സംസാരിക്കുക എന്നർഥമുള്ള ഒരു എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: അവന്റെ ഉള്ളം ... പറ്റിച്ചേർന്നു
  rationale: דבק എന്നത് പറ്റിച്ചേരുക/മുറുകെ ചേർന്നുനിൽക്കുക എന്ന ശക്തമായ ബന്ധഭാവം നൽകുന്നു; נפש ഇവിടെ വ്യക്തിയുടെ ഉള്ളം അഥവാ അന്തരാത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ എബ്രായ പ്രയോഗത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: בְּדִינָה בַּת יַעֲקֹב
  choice: യാക്കോബിന്റെ മകളായ ദീനയോടു
  rationale: דבק + ב എന്ന ഘടന മലയാളത്തിൽ ‘ദീനയോടു പറ്റിച്ചേർന്നു’ എന്നു സ്വാഭാവികമായി വരുന്നു; ബന്ധസൂചനയും നിലനിർത്തുന്നു.
- source_word: וַיֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: אהב എന്ന സാധാരണ ‘സ്നേഹിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; മോഹമോ പ്രണയാവസ്ഥയോ എന്നു അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הַנַּעֲרָ
  choice: ആ യുവതിയെ / അവളുടെ
  rationale: נַעֲרָה എന്നത് പെൺകുട്ടി അഥവാ യുവതി എന്നാകാം; ഈ സന്ദർഭത്തിൽ ആധുനികവും മാന്യവുമായ ‘യുവതി’ അനുയോജ്യം. രണ്ടാം ആവർത്തനം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സർവനാമമാക്കി.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: അവളുടെ ഹൃദയത്തോടു സംസാരിച്ചു
  rationale: ‘ഹൃദയത്തോടു സംസാരിക്കുക’ എന്ന എബ്രായ രൂപകം സംരക്ഷിക്കുന്നു; സ്നേഹപൂർവം, ആശ്വാസകരമായി, അല്ലെങ്കിൽ അനുനയത്തോടെ സംസാരിച്ചു എന്ന സാധ്യതകളിൽ ഒന്നിനെ മാത്രം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: മുൻസന്ദർഭത്തിലെ അതിക്രമത്തിനു ശേഷമുള്ള ശെഖേമിന്റെ വികാരവിവരണം
  choice: ഈ വാക്യം പറയുന്ന അടുപ്പം, സ്നേഹം, സംസാരം എന്നിവ നേരായ ഭാഷയിൽ നിലനിർത്തുക
  alternative: മുഖ്യപാഠത്തിൽ തന്നെ പ്രതികൂലമായ നൈതിക വിശേഷണം ചേർക്കുക, അല്ലെങ്കിൽ സംഭവത്തെ പ്രണയാത്മകമാക്കുക
  rationale: എബ്രായ വാക്യം ഇവിടെ ശെഖേമിന്റെ വികാരങ്ങളെയും വാക്കുകളെയും വിവരിക്കുന്നു. മുൻപുണ്ടായ തെറ്റിനെ ന്യായീകരിക്കാതെയും വാക്യത്തിൽ ഇല്ലാത്ത വിധിനിർണയം ചേർക്കാതെയും വിവരണം നിലനിർത്തണം.
- issue: דבר על־לב എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: രൂപകത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി അർഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക
  alternative: ‘സ്നേഹപൂർവം സംസാരിച്ചു’ അല്ലെങ്കിൽ ‘ആശ്വസിപ്പിച്ചു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: പ്രയോഗം ആർദ്രമായോ ദയാപൂർവമായോ ആശ്വാസകരമായോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കാം; കൃത്യമായ ഭാവം സന്ദർഭത്തിൽ പൂർണമായി നിർണ്ണയിക്കാത്തതിനാൽ യഥാർഥ ആശയവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആത്മാവ്’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ കുറച്ച് സാങ്കേതികവും കൂടുതൽ സ്വാഭാവികവുമായ ‘ഉള്ളം’ തിരഞ്ഞെടുത്തു. എബ്രായത്തിലെ ആവർത്തനം അർഥനഷ്ടമില്ലാതെ മലയാളത്തിൽ സർവനാമം ഉപയോഗിച്ച് മൃദുവാക്കി.
