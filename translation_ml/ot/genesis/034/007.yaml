  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: ml
  text: യാക്കോബിന്റെ പുത്രന്മാർ ഈ വിവരം കേട്ടപ്പോൾ വയലിൽനിന്ന് വന്നു. അവർ ദുഃഖിക്കുകയും അത്യന്തം കോപിക്കുകയും ചെയ്തു. കാരണം, യാക്കോബിന്റെ മകളോടുകൂടെ ശയിച്ചതിലൂടെ അവൻ ഇസ്രായേലിൽ ഒരു നീചകൃത്യം ചെയ്തിരുന്നു; അത്തരമൊരു കാര്യം ചെയ്യാൻ പാടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְבָלָה
  choice: നീചകൃത്യം
  rationale: ധാർമികമായി അത്യന്തം ഹീനവും സമൂഹത്തെ അപമാനിക്കുന്നതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദം; വെറും ‘ലജ്ജാകരമായ കാര്യം’ എന്നതിനെക്കാൾ എബ്രായപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: לִשְׁכַּב אֶת
  choice: ഓടുകൂടെ ശയിച്ചതിലൂടെ
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ മാന്യവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: അത്തരമൊരു കാര്യം ചെയ്യാൻ പാടില്ല
  rationale: ഇത് അംഗീകരിക്കാനാവാത്ത പ്രവൃത്തിയാണെന്ന ശക്തമായ മാനദണ്ഡപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: കഥയുടെ കാലക്രമത്തിൽ പേര് വ്യക്തിയെയോ രൂപംകൊള്ളുന്ന സമൂഹത്തെയോ സൂചിപ്പിക്കാവുന്ന അസ്പഷ്ടത വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേലിൽ’ എന്ന പ്രയോഗത്തിന്റെ കാലാനുസൃതമല്ലാത്തതുപോലെ തോന്നാവുന്ന സാമൂഹിക അർഥം
  choice: ഇസ്രായേലിൽ
  alternative: ഇസ്രായേലിന്റെ കുടുംബത്തിൽ
  rationale: മൂലപാഠത്തിലെ בְיִשְׂרָאֵל എന്ന സംക്ഷിപ്തവും ഭാരം നിറഞ്ഞതുമായ പ്രയോഗം നിലനിർത്തി, വ്യക്തി/കുടുംബം/ജനസമൂഹം എന്ന സാധ്യതകളിൽ ഒന്ന് മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നില്ല.
- issue: അവസാന വാക്യത്തിന്റെ ശക്തി
  choice: ചെയ്യാൻ പാടില്ല
  alternative: ചെയ്യപ്പെടാറില്ല
  rationale: לֹא יֵעָשֶׂה ഇവിടെ സാധാരണ പതിവിന്റെ വിവരണത്തേക്കാൾ ശക്തമായ നിരോധനമോ ധാർമിക അസ്വീകാര്യതയോ പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വിവരണശൈലി. ‘പുരുഷന്മാർ’ എന്നത് ഹാ-അനാഷീം എന്ന പദത്തെ പിന്തുടർന്ന് യാക്കോബിന്റെ പുത്രന്മാരെ വീണ്ടും സൂചിപ്പിക്കുന്നു. അത്യന്തം നീണ്ട ഒറ്റവാക്യം ഒഴിവാക്കി വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; കാരണബന്ധവും ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
