translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ക്ഷണ-ആജ്ഞാ ശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘നിങ്ങളുടെ മുമ്പിൽ’ എന്ന പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
