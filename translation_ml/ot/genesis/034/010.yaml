id: GEN.34.10
reference: Genesis 34:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: ml
  text: “നിങ്ങൾ ഞങ്ങളോടൊപ്പം താമസിക്കാം; ദേശം നിങ്ങളുടെ മുമ്പിലായിരിക്കും.[a] അതിൽ പാർക്കുക, വ്യാപാരം നടത്തുക, അതിൽ സ്വത്ത് സ്വന്തമാക്കുക.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശം നിങ്ങൾക്കു ലഭ്യമായിരിക്കും”; അക്ഷരാർഥം, “ദേശം നിങ്ങളുടെ മുമ്പിലായിരിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അതിൽ കൈവശാവകാശം നേടുക” അല്ലെങ്കിൽ “അതിൽ സ്വത്ത് കൈവശമാക്കുക.” എബ്രായപ്രയോഗം ഭൂസ്വത്തോ അതിന്മേലുള്ള അവകാശമോ നേടുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: നിങ്ങൾ ഞങ്ങളോടൊപ്പം താമസിക്കാം
  rationale: יָשַׁב എന്ന ക്രിയയ്ക്ക് ‘താമസിക്കുക, പാർക്കുക, കുടിയേറുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ക്ഷണവും അനുമതിയും അടങ്ങിയിരിക്കുന്നതിനാൽ ‘താമസിക്കാം’ സ്വാഭാവികമാണ്.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: ദേശം നിങ്ങളുടെ മുമ്പിലായിരിക്കും
  rationale: എബ്രായത്തിലെ ‘നിങ്ങളുടെ മുമ്പിൽ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദേശം അവർക്ക് ലഭ്യമായിരിക്കും എന്ന ആശയവും സൂചിപ്പിക്കുന്നു.
- source_word: שְׁבוּ
  choice: അതിൽ പാർക്കുക
  rationale: יָשַׁב എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം. മുൻവാക്യത്തിലെ ‘താമസിക്കാം’ എന്നതിൽനിന്ന് സ്വാഭാവികമായ ശൈലിവ്യത്യാസം നൽകിക്കൊണ്ട് താമസമുറപ്പിക്കുക എന്ന ആശയം അറിയിക്കുന്നു.
- source_word: וּסְחָרוּהָ
  choice: വ്യാപാരം നടത്തുക
  rationale: סחר ഇവിടെ വാണിജ്യപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘വ്യാപാരം നടത്തുക’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: സ്വത്ത് സമ്പാദിക്കുക
  rationale: אָחַז എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ദേശത്തിൽ ഭൂസ്വത്തോ സ്ഥിരമായ കൈവശാവകാശമോ നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും ഭൗതികമായി പിടിച്ചെടുക്കുക എന്നല്ല.
