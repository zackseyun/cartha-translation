  terminology: ‘ദേശം,’ ‘വ്യാപാരം നടത്തുക,’ and ‘സ്വത്ത് സ്വന്തമാക്കുക’ are suitable modern-standard terms. ‘സ്വത്ത് സ്വന്തമാക്കുക’ better expresses property acquisition than the broader ‘സ്വത്ത് സമ്പാദിക്കുക.’ The footnotes appropriately preserve the literal idiom and lexical uncertainty.
