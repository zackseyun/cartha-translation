  source_fidelity: 'The verse’s sequence and force are retained: an invitation to reside with them, the land being ‘before’ them, followed by plural imperatives to settle, conduct trade, and obtain a holding. The final Malayalam phrase ‘സ്വത്ത് സമ്പാദിക്കുക’ can suggest earning or accumulating wealth generally, whereas the Niphal of אָחַז in this context concerns obtaining property/holding rights in the land.'
