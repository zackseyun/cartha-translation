  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: ml
  text: യാക്കോബിന്റെ പുത്രന്മാർ ശെഖേമിനോടും അവന്റെ പിതാവായ ഹമോരിനോടും വഞ്ചനയോടെ ഉത്തരം പറഞ്ഞു[a]; ശെഖേം അവരുടെ സഹോദരിയായ ദീനയെ അശുദ്ധയാക്കിയിരുന്നതുകൊണ്ട്[b] അവർ ഇങ്ങനെ സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വഞ്ചനാപൂർവം ഉത്തരം പറഞ്ഞു.’ ഹീബ്രായത്തിൽ അക്ഷരാർഥം ‘വഞ്ചനയോടെ’ എന്ന നാമപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശെഖേം അവരുടെ സഹോദരിയായ ദീനയെ ലൈംഗികമായി അതിക്രമിച്ചിരുന്നതുകൊണ്ട്.’ ഹീബ്രായത്തിൽ ‘അശുദ്ധയാക്കി’ എന്നാണ്; അതിന്റെ നൈതികവും ശുദ്ധിവ്യവസ്ഥാപരവുമായ ഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
