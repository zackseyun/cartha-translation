- source_word: וַיְדַבֵּרוּ
  choice: അവർ അങ്ങനെ സംസാരിച്ചത്
  rationale: דבר എന്ന ‘സംസാരിക്കുക’ എന്ന ക്രിയയെ നിലനിർത്തുന്നു; മലയാളത്തിലെ ആവർത്തനക്കുഴപ്പം ഒഴിവാക്കാൻ മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ‘അങ്ങനെ’ ചേർത്തിരിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: കൊണ്ടാണ്
  rationale: സന്ദർഭത്തിൽ ഈ ഘടകം അവരുടെ വഞ്ചനാപരമായ സംസാരത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: טִמֵּא
  choice: അശുദ്ധയാക്കിയിരുന്നു
  rationale: ടിമ്മേ എന്ന ക്രിയയുടെ ‘അശുദ്ധമാക്കുക/മലിനമാക്കുക’ എന്ന നൈതിക-ശുദ്ധിവ്യവസ്ഥാപരമായ പദമേഖല സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ ലൈംഗിക അതിക്രമം മൃദൂകരിക്കാതെ പദത്തിന്റെ രൂപകൽപ്പന നിലനിർത്തുന്നു.
- source_word: אֲחֹתָם
  choice: അവരുടെ സഹോദരിയായ
  rationale: സഹോദരബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രതികരണത്തിന്റെ കുടുംബപരമായ പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: טִמֵּא എന്നതിന്റെ നൈതിക-ശുദ്ധിവ്യവസ്ഥാപരമായ ഭാഷ
  choice: അശുദ്ധയാക്കിയിരുന്നു
  alternative: അവളെ അപമാനിച്ചിരുന്നു / അവളെ ലൈംഗികമായി അതിക്രമിച്ചിരുന്നു
  rationale: മൂലപദത്തിന്റെ ‘അശുദ്ധമാക്കുക’ എന്ന ആശയപരിധി നിലനിർത്തുന്നു. സന്ദർഭം ലൈംഗിക അതിക്രമമാണെന്ന് വ്യക്തമാണെങ്കിലും വിവർത്തനം അതിനെ മറ്റൊരു പദമേഖലയിലേക്കു മാറ്റുന്നില്ല; പകരം വായനസഹായമായി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രന്മാർ’ എന്നത് തിരുവെഴുത്തുപരമായ ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാണ്. കാരണവാക്യം അവസാനം സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു; മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ നൽകിയിട്ടുണ്ട്.
