- source_word: בְנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രായ നിർമിതിയുടെ കുടുംബബന്ധം കൃത്യമായി നിലനിർത്തുന്ന, dignified modern Malayalam രൂപം.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: ശെഖേമിനോടും അവന്റെ അപ്പനായ ഹമോരിനോടും
  rationale: രണ്ട് പരോക്ഷ കർമങ്ങളെയും വ്യക്തമായി കാണിക്കുകയും ‘അവന്റെ അപ്പൻ’ എന്നത് ഹമോരിനെ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּמִרְמָה
