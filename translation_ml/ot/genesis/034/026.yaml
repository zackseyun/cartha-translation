source:
  edition: WLC
  text: וְ/אֶת חֲמוֹר֙ וְ/אֶת שְׁכֶ֣ם בְּנ֔/וֹ הָרְג֖וּ לְ/פִי חָ֑רֶב וַ/יִּקְח֧וּ אֶת דִּינָ֛ה מִ/בֵּ֥ית שְׁכֶ֖ם וַ/יֵּצֵֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: ml
  text: അവർ ഹമോറിനെയും അവന്റെ മകനായ ശെഖേമിനെയും വാളാൽ[a] കൊന്നു. ദീനയെ ശെഖേമിന്റെ വീട്ടിൽനിന്ന് കൂട്ടിക്കൊണ്ട് അവർ പുറത്തുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം, ‘വാളിന്റെ വായാൽ’; വാളാൽ കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: അവർ ഹമോരിനെയും അവന്റെ മകൻ ശെഖേമിനെയും
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നങ്ങൾ രണ്ടു പേരെയും ക്രിയയുടെ കർമങ്ങളായി വ്യക്തമാക്കുന്നു. ബְּנוֹ എന്നത് ശെഖേമിനെ ഹമോരിന്റെ മകനായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ ബന്ധം നിലനിർത്തി.
- source_word: הָרְגוּ
  choice: കൊന്നു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, ആധുനിക ആഖ്യാനപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לְפִי חָרֶב
  choice: വാളുകൊണ്ട്[a]
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന എബ്രായ പ്രയോഗം വാൾ ഉപയോഗിച്ചു കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകി.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: ദീനയെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח അടിസ്ഥാനമായി ‘എടുക്കുക/കൊണ്ടുപോകുക’ എന്നാണ്. ഇവിടെ തുടർന്നുള്ള പുറപ്പെടൽ ഉൾപ്പെടുന്ന സാഹചര്യത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്നത് ദീനയെ അവിടെനിന്ന് കൊണ്ടുപോയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘പിടിച്ചെടുത്തു’ എന്ന അധിക ബലപ്രയോഗഭാവം ചേർക്കുന്നില്ല.
- source_word: מִבֵּית שְׁכֶם
  choice: ശെഖേമിന്റെ വീട്ടിൽനിന്ന്
  rationale: בית ഇവിടെ ഉടൻ പ്രസക്തമായ ഭൗതിക വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി ഏറ്റവും സ്വാഭാവികം; ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵאוּ
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: יצאയുടെ ‘പുറത്തുപോകുക’ എന്ന ചലനം മുൻക്രിയയോടു ചേർത്ത് മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തപ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി. ഇതിലൂടെ വീട്ടിൽനിന്നുള്ള പുറപ്പെടൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
