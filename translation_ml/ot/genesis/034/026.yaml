translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ ഹമോർ, ശെഖേം, ദീന എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. എബ്രായ വാക്യത്തിലെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി; അവസാനത്തെ ‘പുറത്തുപോയി’ എന്ന ആശയം ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്ന പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
