id: GEN.34.14
reference: Genesis 34:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵי/הֶ֗ם לֹ֤א נוּכַל֙ לַ/עֲשׂוֹת֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לָ/תֵת֙ אֶת אֲחֹתֵ֔/נוּ לְ/אִ֖ישׁ אֲשֶׁר ל֣/וֹ עָרְלָ֑ה כִּֽי חֶרְפָּ֥ה הִ֖וא לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: ml
  text: 'അവർ അവരോടു പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരിയെ അഗ്രചർമമുള്ള ഒരു പുരുഷനു കൊടുക്കുക എന്ന ഈ കാര്യം ഞങ്ങൾക്കു ചെയ്യാൻ കഴിയില്ല; കാരണം, അത് ഞങ്ങൾക്ക് അപമാനമാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “പരിച്ഛേദന ചെയ്യാത്ത ഒരു പുരുഷനു.” അക്ഷരാർഥം: “അഗ്രചർമമുള്ള ഒരു പുരുഷനു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: അവർ അവരോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘പറഞ്ഞു’ നിലനിർത്തുകയും, ബഹുവചന പരോക്ഷകർമമായ אֲלֵיהֶם ‘അവരോടു’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא נוּכַל
  choice: ഞങ്ങൾക്കു ചെയ്യാൻ കഴിയില്ല
  rationale: יכל സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം ... ചെയ്യാൻ
  rationale: עשה + דבר എന്ന പ്രയോഗത്തിലെ דבר എന്ന നാമം ‘കാര്യം’ എന്നു നിലനിർത്തി, മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിക്കുന്നു.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: ഞങ്ങളുടെ സഹോദരിയെ ... കൊടുക്കുക
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; വിവാഹത്തിനായി കൊടുക്കുക എന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ മുഖ്യവാചകത്തിൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: לְאִישׁ
  choice: ഒരു പുരുഷനു
  rationale: איש എന്ന സാധാരണ പദത്തെ ‘പുരുഷൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ഭർത്താവ്’ എന്ന സന്ദർഭവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: അഗ്രചർമമുള്ള
  rationale: ‘അഗ്രചർമം ഉള്ളവൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശരീരഘടനാപരമായ രൂപം മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ‘പരിച്ഛേദന ചെയ്യാത്ത’ എന്ന അർത്ഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: കാരണം, അത് ഞങ്ങൾക്ക് അപമാനമാണ്
  rationale: חרפה എന്നതിലെ സാമൂഹിക നിന്ദയും മാനഹാനിയും ‘അപമാനം’ എന്ന സാധാരണ മലയാളപദത്തിലൂടെ വ്യക്തമാക്കുന്നു; വാചകത്തിലെ പ്രസ്താവനാത്മക ഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള ശരീരഘടനാപരമായ പ്രയോഗം അതിന്റെ തീവ്രത നഷ്ടപ്പെടുത്താതെ നിലനിർത്തിയിരിക്കുന്നു.
