id: GEN.34.24
reference: Genesis 34:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: ml
  text: അവന്റെ നഗരകവാടത്തിലൂടെ പുറത്തുവരുന്ന എല്ലാവരും[a] ഹമോറിന്റെയും അവന്റെ മകനായ ശെഖേമിന്റെയും വാക്കു കേട്ടു[b]. അവന്റെ നഗരകവാടത്തിലൂടെ പുറത്തുവരുന്ന എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനയേറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ നഗരകവാടത്തിലൂടെ പുറത്തുവരുന്ന എല്ലാവരും.’ നഗരത്തിന്റെ പൊതുജീവിതത്തിൽ പങ്കെടുത്ത പുരുഷപ്രജകളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ഹമോറിന്റെയും ശെഖേമിന്റെയും വാക്ക് അംഗീകരിച്ചു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗം കേൾക്കുന്നതോടൊപ്പം അവരുടെ നിർദേശം അനുകൂലമായി സ്വീകരിക്കുന്നതും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: വാക്കു കേട്ടു
  rationale: שׁמע אל എന്ന പ്രയോഗം ഒരാളുടെ വാക്കു ശ്രദ്ധിക്കുകയും അതിനോട് അനുകൂലമായി പ്രതികരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ സമ്മതം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ‘അനുസരിച്ചു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി അർത്ഥം അതിയായി നിർണയിക്കാതെ സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: അവന്റെ നഗരകവാടത്തിലൂടെ പുറത്തുവരുന്ന എല്ലാവരും
  rationale: എബ്രായത്തിലെ മൂർത്തമായ നഗരകവാടപ്രയോഗവും വാക്യത്തിലെ അതിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു. പൊതുജീവിതത്തിൽ പങ്കെടുത്ത നഗരത്തിലെ പുരുഷപ്രജകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: ശെഖേമിനെ ഹമോറിന്റെ മകനായി നേരിട്ട് വിശേഷിപ്പിക്കുന്ന ബന്ധപദം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: וַיִּמֹּלוּ
  choice: പരിച്ഛേദനയേറ്റു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമ്മണി/ആത്മനിഷ്ഠ ഭാവം നിലനിർത്തുന്നു; അവർ സ്വയം പരിച്ഛേദിച്ചു എന്നതിനെക്കാൾ, പരിച്ഛേദനയ്ക്ക് വിധേയരായി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ പുരുഷന്മാരും
  rationale: זָכָר എന്നതിന്റെ അടിസ്ഥാന അർത്ഥം ‘ആൺ’ എന്നാണെങ്കിലും, നഗരകവാടത്തിൽ പൊതുജീവിതത്തിൽ പങ്കെടുത്ത മനുഷ്യരെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘എല്ലാ പുരുഷന്മാരും’ എന്നത് കൃത്യവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: שַׁעַר עִירוֹ
  choice: അവന്റെ നഗരകവാടം
  rationale: പൊതുസമ്മേളനത്തിന്റെയും തീരുമാനങ്ങളുടെയും ഇടമായിരുന്ന നഗരകവാടത്തെ വ്യാഖ്യാനപരമായി ‘പൗരന്മാർ’ എന്നാക്കി മാറ്റാതെ മൂലത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘നഗരകവാടം’ എന്ന പ്രയോഗവും അതിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു; എന്നാൽ മലയാളത്തിൽ അനാവശ്യമായി ദുഷ്കരമാകാതിരിക്കാൻ വാക്യഘടന സ്വാഭാവികമാക്കി.
