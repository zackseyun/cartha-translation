id: GEN.34.15
reference: Genesis 34:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: ml
  text: 'ഈ ഒരു വ്യവസ്ഥയിൽ മാത്രമേ ഞങ്ങൾ നിങ്ങളോടു യോജിക്കൂ: നിങ്ങളിലുള്ള എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ഏൽക്കുന്നതിലൂടെ നിങ്ങൾ ഞങ്ങളെപ്പോലെയായാൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: ഈ ഒരു വ്യവസ്ഥയിൽ മാത്രമേ
  rationale: אַךְ ഇവിടെ സമ്മതത്തിനുള്ള ഏക വ്യവസ്ഥയെ പരിമിതപ്പെടുത്തുന്നു; בְּזֹאת സന്ദർഭത്തിൽ വ്യവസ്ഥയെ പരിചയപ്പെടുത്തുന്നു. ഈ മലയാളപ്രയോഗം രണ്ടിന്റെയും അർഥം സ്വാഭാവികമായി ചേർത്തു നൽകുന്നു.
- source_word: נֵאוֹת לָכֶם
  choice: ഞങ്ങൾ നിങ്ങളോടു സമ്മതിക്കുകയുള്ളൂ
  rationale: Niphal രൂപം സന്നദ്ധതയെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു. ചർച്ചയുടെ സന്ദർഭത്തിൽ ‘നിങ്ങളോടു സമ്മതിക്കുക’ സ്വാഭാവികവും ബന്ധസൂചകവുമാണ്.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: നിങ്ങൾ ഞങ്ങളെപ്പോലെയാകണം
  rationale: വ്യവസ്ഥാഖണ്ഡത്തിലെ היה ഒരു പുതിയ നിലയിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യവസ്ഥയുടെ നിർബന്ധസ്വഭാവം ‘ആകണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: നിങ്ങളിലുള്ള എല്ലാ പുരുഷന്മാരും പരിച്ഛേദനം ഏൽക്കുന്നതിലൂടെ
  rationale: 'Niphal infinitive രൂപം കർമണി അർഥമുള്ളതാണ്: ഓരോ പുരുഷനും പരിച്ഛേദനം ഏൽക്കുക. ‘-തിലൂടെ’ എന്നത് അവർ എങ്ങനെ ‘ഞങ്ങളെപ്പോലെ’ ആകുമെന്ന മാർഗബന്ധം വ്യക്തമാക്കുന്നു; כָּל זָכָר എന്ന വിതരണാർഥവും നിലനിർത്തുന്നു.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ചർച്ചാഭാഷ ഉപയോഗിച്ചു. ‘പരിച്ഛേദനം ഏൽക്കുക’ എന്ന കർമണി പ്രയോഗം എബ്രായ Niphal രൂപം സംരക്ഷിക്കുന്നു; പ്രധാനവാക്യത്തിൽ വ്യവസ്ഥയും അതിന്റെ മാർഗവും വ്യക്തമായി വേർതിരിച്ചു.
