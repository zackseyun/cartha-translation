source:
  edition: WLC
  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: ml
  text: എന്നാൽ, പരിച്ഛേദനം ഏൽക്കണമെന്ന ഞങ്ങളുടെ വാക്ക് നിങ്ങൾ കേൾക്കാതിരുന്നാൽ, ഞങ്ങൾ ഞങ്ങളുടെ മകളെ കൂട്ടിക്കൊണ്ടുപോകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻപത്തെ നിർദേശത്തോടുള്ള വ്യവസ്ഥാപരമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: ഞങ്ങളുടെ വാക്ക് നിങ്ങൾ കേൾക്കുക
  rationale: שׁמע + אֶל എന്നത് ‘കേൾക്കുക/ചെവിക്കൊള്ളുക’ എന്നാണ്; ‘അനുസരിക്കുക’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: לְ/הִמּוֹל
  choice: പരിച്ഛേദനം ഏൽക്കണമെന്ന
  rationale: നിഫാൽ infinitive construct ആയതിനാൽ പരിച്ഛേദനം സ്വീകരിക്കുന്നതിന്റെ കർമണാർഥം നിലനിർത്തുന്നു; കേൾക്കേണ്ട വാക്കിന്റെ ഉള്ളടക്കമായും ഇതിനെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: ഞങ്ങൾ ഞങ്ങളുടെ മകളെ കൂട്ടിക്കൊണ്ടു
  rationale: לקח എന്നതിന്റെ ‘എടുക്കുക/കൂട്ടിക്കൊണ്ടുപോകുക’ എന്ന അർഥം സാഹചര്യത്തിന് യോജിച്ച മലയാളത്തിൽ നൽകുന്നു; ‘ഞങ്ങളുടെ മകൾ’ എന്ന ഉടമസ്ഥപ്രയോഗം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: וְ/הָלָכְנוּ
  choice: പോകും
  rationale: വ്യവസ്ഥയുടെ ഫലമായി വരാനിരിക്കുന്ന പുറപ്പെടലിനെ ലളിതവും നേരിട്ടുമായ ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
