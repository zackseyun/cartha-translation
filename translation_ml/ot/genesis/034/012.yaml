  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: ml
  text: “എന്നിൽനിന്ന് വളരെ വലിയ വധൂവില[a]യും സമ്മാനവും ആവശ്യപ്പെടുക; നിങ്ങൾ എന്നോടു പറയുന്നതെന്തും ഞാൻ തരാം. ആ യുവതിയെ എനിക്ക് ഭാര്യയായി തരുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്ത്രീധനം’; എബ്രായ מֹהַר പ്രത്യേകിച്ച് വരനോ വരന്റെ കുടുംബമോ വധുവിന്റെ കുടുംബത്തിന് നൽകുന്ന വിവാഹത്തുകയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: എന്നിൽനിന്ന് വളരെ വലിയ ... ആവശ്യപ്പെടുക
  rationale: רבה എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപവും עָלַי എന്ന പ്രയോഗവും ചേർന്ന്, വലിയൊരു തുക തന്റെമേൽ ചുമത്താൻ കേൾവിക്കാരോട് പറയുന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ഇടപാടിന്റെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֹהַר
  choice: വധൂവില
  rationale: വരനോ വരന്റെ കുടുംബമോ വധുവിന്റെ കുടുംബത്തിന് നൽകുന്ന വിവാഹത്തുകയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. വധുവിന്റെ ഭാഗത്തുനിന്നുള്ള സ്ത്രീധനം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘വധൂവില’ ഉപയോഗിച്ചു.
- source_word: וּמַתָּן
  choice: സമ്മാനം
  rationale: വിവാഹത്തുകയോടൊപ്പം നൽകുന്ന അധിക ദാനത്തെയോ ഉപഹാരത്തെയോ സൂചിപ്പിക്കുന്നു; ഏകവചനം മൂലപാഠത്തോട് യോജിക്കുന്നു.
- source_word: וְאֶתְּנָה
  choice: ഞാൻ തരാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം സംസാരിക്കുന്നവന്റെ ഉറച്ച സന്നദ്ധത പ്രകടിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഞാൻ തരാം’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: നിങ്ങൾ എന്നോടു പറയുന്നതെന്തും
  rationale: അവർ നിശ്ചയിക്കുന്ന ഏതു തുകയോ നിബന്ധനയോ അംഗീകരിക്കുമെന്ന തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וּתְנוּ לִי
  choice: എനിക്ക് ... തന്നാൽ മതി
  rationale: മുൻപുള്ള വാഗ്ദാനത്തിനു ശേഷമുള്ള പ്രധാന അഭ്യർഥനയുടെ ഉച്ചസ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വാവിന് സന്ദർഭത്തിലുള്ള അഭ്യർഥനാത്മക ഊന്നൽ നൽകുന്നു.
- source_word: הַנַּעֲרָ
  choice: ആ യുവതി
  rationale: വിവാഹപ്രായത്തിലുള്ള യുവസ്ത്രീയെ സൂചിപ്പിക്കുന്ന മാന്യവും സമകാലികവുമായ പ്രയോഗം.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി പകരുന്നു.
