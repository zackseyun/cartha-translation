translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഇടപാടുസംബന്ധിയായ സാംസ്കാരിക പദത്തിന് കൃത്യമായ ‘വധൂവില’ തിരഞ്ഞെടുത്തു; ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്ന ‘സ്ത്രീധനം’ ഒഴിവാക്കി.
