base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: ml
  text: മൂന്നാം ദിവസം[a], അവർ വേദനയിലായിരിക്കുമ്പോൾ, യാക്കോബിന്റെ പുത്രന്മാരിൽ രണ്ടുപേരായ, ദീനയുടെ സഹോദരന്മാരായ ശിമെയോനും ലേവിയും ഓരോരുത്തൻ അവനവന്റെ വാൾ എടുത്ത്, സുരക്ഷിതമാണെന്നു കരുതി ജാഗ്രതയില്ലാതിരുന്ന നഗരത്തിന്മേൽ ചെന്നു[b], ആണുങ്ങളെയെല്ലാം കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മൂന്നാം ദിവസം, അവർ വേദനയിലായിരുന്നപ്പോൾ, ഇങ്ങനെ സംഭവിച്ചു:’'
    reason: previous_rendering
  - marker: b
    text: 'അഥവാ: ‘നഗരത്തിന്മേൽ നിർഭയമായി ചെന്നു.’ בֶּטַח എന്ന ഹീബ്രുപദം ആക്രമികൾ ചെന്ന രീതിയെയോ നഗരം ജാഗ്രതയില്ലാതെ സുരക്ഷിതമായി കഴിഞ്ഞ അവസ്ഥയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവത്തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയവാക്യം മുന്നിൽ നിർത്തി അവതരിപ്പിക്കുന്നു; וַיְהִי എന്നതിനു വേറൊരു ഭാരമുള്ള പദപ്രയോഗം ചേർക്കുന്നില്ല.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: അവർ വേദനയിലായിരിക്കുമ്പോൾ
  rationale: സമകാലികമായ സാഹചര്യം വ്യക്തമാക്കുന്നു; സന്ദർഭം പരിച്ഛേദന മൂലമുള്ള വേദന സൂചിപ്പിച്ചാലും മൂലപാഠം ഇവിടെ കാരണം ആവർത്തിക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാരിൽ രണ്ടുപേർ
  rationale: യാക്കോബിന്റെ പുത്രന്മാരിൽനിന്നുള്ള രണ്ടു പേരാണെന്ന ഭാഗിക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: ശിമെയോനും ലേവിയും
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപങ്ങൾ.
- source_word: אֲחֵי דִינָה
  choice: ദീനയുടെ സഹോദരന്മാർ
  rationale: ശിമെയോനെയും ലേവിയെയും ദീനയോടുള്ള ബന്ധംകൊണ്ട് വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אִישׁ חַרְבּוֹ
  choice: ഓരോരുത്തൻ അവനവന്റെ വാൾ എടുത്ത്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥവും ഉടമസ്ഥപ്രത്യയത്തിന്റെ ‘സ്വന്തം’ എന്ന ആശയവും വ്യക്തമായി പകരുന്നു.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: നഗരത്തിന്മേൽ ചെന്നു
  rationale: בוא על എന്ന ശത്രുതാപരമായ നീക്കം മൂലപാഠത്തിന്റെ ദൃശ്യരൂപം അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: בֶּטַח
  choice: സുരക്ഷിതമാണെന്നു കരുതി ജാഗ്രതയില്ലാതിരുന്ന
  rationale: സന്ദർഭത്തിൽ നഗരത്തിന്റെ സുരക്ഷാബോധത്തെയും അപ്രതീക്ഷിതാവസ്ഥയെയും സൂചിപ്പിക്കുന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ആക്രമികൾ നിർഭയമായി ചെന്നുവെന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: ആണുങ്ങളെയെല്ലാം കൊന്നു
  rationale: הרג എന്ന സാധാരണ ‘കൊല്ലുക’ എന്ന ക്രിയയും זָכָר എന്ന ലിംഗസൂചക നാമവും പകരുന്നു; ‘പുരുഷന്മാർ’ എന്നു പറഞ്ഞ് പ്രായപരിധി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: בֶּטַח ആരെ വിശേഷിപ്പിക്കുന്നു എന്ന അനിശ്ചിതത്വം
  choice: നഗരം സുരക്ഷിതമാണെന്നു കരുതി ജാഗ്രതയില്ലാതിരുന്നു
  alternative: ശിമെയോനും ലേവിയും നിർഭയമായി അഥവാ സുരക്ഷിതമായി നഗരത്തിന്മേൽ ചെന്നു
  rationale: പദത്തിന്റെ സ്ഥാനവും സന്ദർഭവും ഇരുവായനകൾക്കും ഇട നൽകുന്നു. മുഖ്യപാഠത്തിൽ നഗരത്തിന്റെ അപ്രതീക്ഷിത സുരക്ഷാബോധം സ്വീകരിച്ചെങ്കിലും മറ്റുവായന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; ധാർമികമോ ദൈവശാസ്ത്രപരമോ ആയ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൊന്നുകളഞ്ഞു’ എന്നതിനെക്കാൾ മൂലക്രിയയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്ന ‘കൊന്നു’ സ്വീകരിച്ചു. സമാനാധികരണ ഘടന വായിക്കാൻ എളുപ്പമാക്കുകയും മൂലപാഠത്തിലെ വിവരക്രമം പരമാവധി നിലനിർത്തുകയും ചെയ്തു.
