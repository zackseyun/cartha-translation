source:
  edition: WLC
  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: ml
  text: തന്റെ മകളായ ദീനയെ അവൻ അശുദ്ധയാക്കിയെന്ന് യാക്കോബ് കേട്ടു.[a] എന്നാൽ യാക്കോബിന്റെ പുത്രന്മാർ അവന്റെ ആടുമാടുകളോടൊപ്പം വയലിലായിരുന്നു; അതുകൊണ്ട് അവർ വരുന്നതുവരെ യാക്കോബ് മൗനം പാലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ മകളായ ദീനയെ അവൻ അപമാനിച്ചെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘അശുദ്ധയാക്കി’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ദീനയ്ക്കുണ്ടായ ലൈംഗിക അപമാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: കേട്ടു
  rationale: വിവരം കേട്ടറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: כִּי
  choice: എന്ന്
  rationale: യാക്കോബ് കേട്ട വിവരത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: טִמֵּא
  choice: അശുദ്ധയാക്കി
  rationale: പീയേൽ രൂപത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘അശുദ്ധമാക്കുക’ എന്നത് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദീനയ്ക്കുണ്ടായ ലൈംഗിക അപമാനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായപദത്തേക്കാൾ കൂടുതൽ പ്രത്യേകമായ അർഥം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בִתּוֹ
  choice: തന്റെ മകളായ
  rationale: ദീന യാക്കോബിന്റെ മകളാണെന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבָנָיו
  choice: എന്നാൽ യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: വാവ് ബന്ധകത്തിന്റെ ഇവിടെ അനുഭവപ്പെടുന്ന നേരിയ വൈരുധ്യവും, പുത്രന്മാർ സ്ഥലത്തില്ലായിരുന്നുവെന്ന ആഖ്യാനപിരിമുറുക്കവും വ്യക്തമാക്കുന്നു; സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നു.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: അവന്റെ ആടുമാടുകളോടൊപ്പം വയലിലായിരുന്നു
  rationale: അവർ മൃഗങ്ങളെ മേയ്ക്കുകയായിരുന്നു എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രവൃത്തി ചേർക്കാതെ, അവരുടെ സ്ഥാനം സ്വാഭാവികമായി പറയുന്നു.
- source_word: מִקְנֵהוּ
  choice: അവന്റെ ആടുമാടുകൾ
  rationale: കന്നുകാലികൾ എന്നതിനെക്കാൾ വിവിധ വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ വിശാലപ്രയോഗം.
- source_word: וְהֶחֱרִשׁ
  choice: മൗനം പാലിച്ചു
  rationale: സംസാരിക്കാതെയോ പ്രതികരിക്കാതെയോ സ്വയം അടക്കിനിർത്തിയെന്ന ഹിഫീൽ രൂപത്തിന്റെ ഭാവം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד בֹּאָם
  choice: അവർ വരുന്നതുവരെ
  rationale: ‘അവരുടെ വരവുവരെ’ എന്ന ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം; ‘മടങ്ങിവരുക’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലപാഠത്തിൽ വ്യക്തമല്ല.
