translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ലൈംഗിക അപമാനത്തിന്റെ ഗൗരവം മറയ്ക്കാതെ, ക്രിയയെ ‘ബലാത്സംഗം ചെയ്തു’ എന്ന് അതിവ്യക്തമാക്കാതിരിക്കാൻ അക്ഷരാർഥത്തോട് ചേർന്ന പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
