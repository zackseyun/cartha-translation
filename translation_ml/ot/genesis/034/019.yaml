source:
  edition: WLC
  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: ml
  text: ആ കാര്യം ചെയ്യാൻ ആ യുവാവ് ഒട്ടും താമസിച്ചില്ല; കാരണം, യാക്കോബിന്റെ മകളെ അവൻ ആഗ്രഹിച്ചിരുന്നു.[a] തന്റെ പിതാവിന്റെ കുടുംബത്തിലെ ഏറ്റവും ആദരിക്കപ്പെട്ടവനായിരുന്നു അവൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാക്കോബിന്റെ മകളെ അവൻ അതിയായി ഇഷ്ടപ്പെട്ടിരുന്നു” അല്ലെങ്കിൽ “യാക്കോബിന്റെ മകളിൽ അവൻ ആനന്ദിച്ചിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ പിതാവിന്റെ കുടുംബത്തിലെ എല്ലാവരെക്കാളും കൂടുതൽ ആദരിക്കപ്പെട്ടവനായിരുന്നു അവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: ഒട്ടും താമസിച്ചില്ല
  rationale: ക്രിയയുടെ പ്രാഥമികമായ കാലസംബന്ധിയായ അർഥം ‘വൈകുക, താമസിക്കുക’ എന്നതാണ്. സന്ദർഭത്തിൽ യുവാവ് ആവശ്യപ്പെട്ട കാര്യം ഉടൻ ചെയ്തുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ ഇത് വ്യക്തമാക്കുന്നു.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: ശെഖേമിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ പ്രായപൂർത്തിയായോ വിവാഹപ്രായത്തിലുള്ളോ പുരുഷനെ സൂചിപ്പിക്കാൻ ‘യുവാവ്’ സ്വാഭാവികമാണ്.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: ആ കാര്യം ചെയ്യാൻ
  rationale: മുൻസന്ദർഭത്തിൽ ആവശ്യപ്പെട്ട നടപടിയിലേക്കാണ് ഈ പ്രയോഗം വിരൽചൂണ്ടുന്നത്. എബ്രായ പ്രയോഗത്തിന്റെ നിർദ്ദേശസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: חָפֵץ בְּבַת יַעֲקֹב
  choice: യാക്കോബിന്റെ മകളെ അവൻ അതിയായി ഇഷ്ടപ്പെട്ടിരുന്നു
  rationale: חָפֵץ എന്നത് ശക്തമായ ഇഷ്ടമോ ആഗ്രഹമോ സന്തോഷമോ സൂചിപ്പിക്കാം. ഇവിടെ വിവാഹാഭിലാഷം ഉൾപ്പെടുന്നുവെങ്കിലും അതിനെ ലൈംഗിക ആഗ്രഹമായി മാത്രം ചുരുക്കാതെ, വികാരത്തിന്റെ തീവ്രത പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളമാണ് തെരഞ്ഞെടുത്തത്.
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  choice: തന്റെ പിതാവിന്റെ കുടുംബത്തിലെ ഏറ്റവും ആദരിക്കപ്പെട്ടവൻ
  rationale: נִכְבָּד ആദരിക്കപ്പെട്ടവൻ അല്ലെങ്കിൽ മാന്യൻ എന്ന ആശയം നൽകുന്നു; מִכֹּל എന്ന താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായ അതിശയോക്തിരൂപത്തിൽ അവതരിപ്പിച്ചു. ‘പിതാവിന്റെ കുടുംബം’ എന്നത് ഇവിടെ ഭവനത്തെക്കാൾ വീട്ടുകാരെയും കുടുംബസംഘത്തെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: חָפֵץ എന്ന ക്രിയയിലെ ഇഷ്ടം–ആഗ്രഹം അർഥവ്യാപ്തി
  choice: അതിയായി ഇഷ്ടപ്പെട്ടിരുന്നു
  alternative: ആഗ്രഹിച്ചിരുന്നു / അവളിൽ ആനന്ദിച്ചിരുന്നു
  rationale: സന്ദർഭത്തിലെ വിവാഹാഭിലാഷം മറച്ചുവയ്ക്കാതെയും, ക്രിയയെ ശാരീരിക മോഹമായി മാത്രം പരിമിതപ്പെടുത്താതെയും വിശാലമായ വികാരാർഥം നിലനിർത്തുന്നു.
- issue: נִכְבָּד מִכֹּל എന്ന താരതമ്യത്തിന്റെ അവതരണം
  choice: ഏറ്റവും ആദരിക്കപ്പെട്ടവൻ
  alternative: എല്ലാവരെക്കാളും കൂടുതൽ ആദരിക്കപ്പെട്ടവൻ
  rationale: എബ്രായത്തിലെ വിശേഷണം + מִכֹּל ഘടനയ്ക്ക് അതിശയോക്തിയും താരതമ്യവും അർഥപരമായി സാധ്യമാണ്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ മലയാള അതിശയോക്തിരൂപവും അടിക്കുറിപ്പിൽ താരതമ്യരൂപവും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിതൃഭവനം’ പോലുള്ള സാഹിത്യഭാരം കൂടിയ പദത്തിനു പകരം കൂട്ടുകുടുംബം/വീട്ടുകാർ എന്ന അർഥം നൽകുന്ന ‘പിതാവിന്റെ കുടുംബം’ ഉപയോഗിച്ചു. വാക്യക്രമം എബ്രായത്തിന്റെ കാരണബന്ധവും അവസാനത്തെ സാമൂഹിക പദവിവിവരണവും വ്യക്തമായി നിലനിർത്തുന്നു.
