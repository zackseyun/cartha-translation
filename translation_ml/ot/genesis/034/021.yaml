id: GEN.34.21
reference: Genesis 34:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: ml
  text: ഈ മനുഷ്യർ നമ്മോടു സമാധാനത്തിലാണ്[a]. അവർ ഈ ദേശത്തു താമസിച്ച് ഇവിടെ വ്യാപാരം നടത്തട്ടെ[b]; ഇതാ, ദേശം അവർക്കു വേണ്ടത്ര വിശാലമാണ്[c]. അവരുടെ പുത്രിമാരെ നമുക്കു ഭാര്യമാരായി എടുക്കാം; നമ്മുടെ പുത്രിമാരെ അവർക്കു കൊടുക്കുകയും ചെയ്യാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മോടു സൗഹാർദത്തിലാണ്” / “നമ്മോടു നല്ല ബന്ധത്തിലാണ്.”
    reason: lexical_alternative
  - marker: b
    text: “ഇവിടെ വ്യാപാരം നടത്തുക” എന്നതിന് “ഈ ദേശത്തിലൂടെ വ്യാപാരം നടത്തുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: 'പദശഃ: “ഇതാ, ദേശം അവരുടെ മുമ്പിൽ കൈകൾക്കു വിശാലമാണ്”; ദേശത്ത് അവർക്കു ധാരാളം ഇടമുണ്ടെന്നർഥമുള്ള ഒരു പ്രയോഗം.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: സമാധാനത്തിലാണ്
  rationale: ശׁלם എന്ന പദത്തിന്റെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ബന്ധപരമായ അർഥം—വൈരമില്ലാതെ നല്ല നിലയിൽ കഴിയുക—സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അടുപ്പമുള്ള സൗഹൃദം എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וְיֵשְׁבוּ
  choice: താമസിച്ച് ... നടത്തട്ടെ
  rationale: രൂപത്തിൽ imperfect ആയിരുന്നാലും പ്രസംഗസന്ദർഭത്തിൽ ഇത് നഗരവാസികളോടുള്ള അനുമതി/ആഹ്വാനമാണ്; അതിനാൽ ‘താമസിക്കട്ടെ’ എന്ന ആശയം സംയുക്തക്രിയയിൽ നിലനിർത്തി.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: ഇവിടെ വ്യാപാരം നടത്തട്ടെ
  rationale: סחר വാണിജ്യപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ സർവനാമം ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഇവിടെ’ ദേശത്തെ വ്യാപാരത്തിന്റെ മേഖലയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു, എന്നാൽ ‘അതിലൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള കാരണത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു സംവാദസൂചകത്തെ മാന്യവും ഇപ്പോഴും ഉപയോഗത്തിലുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: അവർക്കു വേണ്ടത്ര വിശാലമാണ്
  rationale: ‘കൈകളിൽ വിശാലം’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ മതിയായ സ്ഥലലഭ്യതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ അർഥവ്യക്തതയ്ക്കായി ആശയപരമായി പരിഭാഷപ്പെടുത്തി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: നമുക്കു ഭാര്യമാരായി എടുക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന imperfect ഈ സന്ദർഭത്തിൽ നിർദേശം/ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. לָנוּ എന്ന ‘നമുക്ക്’ എന്ന ഘടകവും വിവാഹപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: נִתֵּן לָהֶם
  choice: അവർക്കു കൊടുക്കുകയും ചെയ്യാം
  rationale: മുൻ നിർദേശത്തോടു സമാന്തരമായ പരസ്പരവിവാഹ നിർദേശമാണ്; ‘കൊടുക്കുക’ എന്ന മൂലപാഠത്തിലെ വിവാഹപ്രയോഗം മയപ്പെടുത്താതെ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. പ്രസംഗത്തിലെ പ്രേരണാത്മക ഭാവം ‘നടത്തട്ടെ’ എന്നും പരസ്പരവിവാഹ നിർദേശം ‘എടുക്കാം/കൊടുക്കാം’ എന്നും നൽകി. അപൂർവമായ ഹീബ്രു ഇടപ്രയോഗം പ്രധാനവാചകത്തിൽ ആശയപരമായി വ്യക്തമാക്കി, അതിന്റെ പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
