- from: അവരുടെ ആടുമാടുകളും സ്വത്തുക്കളും എല്ലാ വളർത്തുമൃഗങ്ങളും നമ്മുടേതായിത്തീരുകയില്ലേ? നാം അവരോട് സമ്മതിക്കുക മാത്രം ചെയ്യുക; അപ്പോൾ അവർ നമ്മോടുകൂടെ പാർക്കും.
