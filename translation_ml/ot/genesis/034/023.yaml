id: GEN.34.23
reference: Genesis 34:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: ml
  text: അവരുടെ കന്നുകാലികളും സ്വത്തുക്കളും അവരുടെ എല്ലാ മൃഗങ്ങളും നമ്മുടേതായിത്തീരുകയില്ലേ? നാം അവരോടു യോജിച്ചാൽ മതി; അവർ നമ്മോടുകൂടെ പാർക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: അവരുടെ ആടുമാടുകൾ
  rationale: מִקְנֶה എന്നത് പൊതുവേ സാമ്പത്തിക മൂല്യമുള്ള കന്നുകാലിക്കൂട്ടത്തെയോ വളർത്തുമൃഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആടുമാടുകൾ’ സ്വാഭാവികവും വിശാലവുമായ പ്രയോഗമാണ്.
- source_word: קִנְיָנָם
  choice: അവരുടെ സ്വത്തുക്കൾ
  rationale: קִנְיָן സമ്പാദിച്ച സ്വത്തിനെയോ ഉടമസ്ഥതയിലുള്ള വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു; ‘സ്വത്തുക്കൾ’ അതിന്റെ ഭൗതിക-സാമ്പത്തിക അർഥം നിലനിർത്തുന്നു.
- source_word: כָל בְּהֶמְתָּם
  choice: എല്ലാ വളർത്തുമൃഗങ്ങളും
  rationale: בְּהֵמָה മൃഗങ്ങളെ, പ്രത്യേകിച്ച് മനുഷ്യരുടെ അധീനതയിലുള്ള വളർത്തുമൃഗങ്ങളെ, വിശാലമായി സൂചിപ്പിക്കുന്നു. മുമ്പത്തെ מִקְנֶהയിൽനിന്നുള്ള വ്യത്യാസം വായനയിൽ വ്യക്തമാക്കാൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: നമ്മുടേതായിത്തീരുകയില്ലേ?
  rationale: הֲלוֹא അനുകൂലമായ മറുപടി പ്രതീക്ഷിക്കുന്ന പ്രേരണാത്മകമായ അലങ്കാരചോദ്യമാണ്. സന്ദർഭത്തിലെ ഭാവിയിലേക്കുള്ള കൈവശപ്പെടുത്തൽ ഉദ്ദേശവും മലയാളത്തിലെ ചോദ്യശൈലിയും ഈ പരിഭാഷ പ്രകടമാക്കുന്നു.
- source_word: אַךְ
  choice: മാത്രം
  rationale: 'ഇവിടെ אַךְ നിബന്ധനാപരമായ പരിമിതി നൽകുന്നു: ഇതൊന്നുമാത്രം ചെയ്താൽ മതിയെന്ന ആശയം.'
- source_word: נֵאֹותָה לָהֶם
  choice: നാം അവരോട് സമ്മതിക്കുക
  rationale: אוה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം സമ്മതിക്കുക, മനസ്സാകുക, വഴങ്ങുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ നിർദേശത്തോടുള്ള സമ്മതമാണ് സന്ദർഭത്തിന് യോജിച്ചത്.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: അപ്പോൾ അവർ നമ്മോടുകൂടെ പാർക്കും
  rationale: יָשַׁב താമസിക്കുക, പാർക്കുക, കുടിയേറുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ‘പാർക്കും’ സ്ഥിരതാമസത്തിന്റെ സൂചന നിലനിർത്തുന്നു; ‘അപ്പോൾ’ നിബന്ധനയുടെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. വാക്യത്തിലെ വഞ്ചനാപരമായ സാമ്പത്തിക ഉദ്ദേശ്യം വിശദീകരിക്കാതെ, മൂലത്തിലെ അലങ്കാരചോദ്യവും നിബന്ധനാപരമായ പ്രേരണയും അതേപടി നിലനിർത്തി.
