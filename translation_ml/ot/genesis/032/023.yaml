id: GEN.32.23
reference: Genesis 32:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קָם בַּ/לַּ֣יְלָה ה֗וּא וַ/יִּקַּ֞ח אֶת שְׁתֵּ֤י נָשָׁי/ו֙ וְ/אֶת שְׁתֵּ֣י שִׁפְחֹתָ֔י/ו וְ/אֶת אַחַ֥ד עָשָׂ֖ר יְלָדָ֑י/ו וַֽ/יַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: ml
  text: ആ രാത്രിയിൽ അവൻ എഴുന്നേറ്റ് തന്റെ രണ്ടു ഭാര്യമാരെയും രണ്ടു ദാസിമാരെയും[a] പതിനൊന്നു മക്കളെയും കൂട്ടിക്കൊണ്ട് യബ്ബോക്കിന്റെ കടവ് കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിമസ്ത്രീകളെയും.” എബ്രായപദം കീഴാള ഗൃഹപദവിയിലുള്ള സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; അതിൽ അടിമപ്പദവിയും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ഖാൽ ആഖ്യാനരൂപം എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ തുടർപ്രവൃത്തികളുടെ സ്വാഭാവിക ഒഴുക്കിനായി '-എറ്റ്' രൂപം ഉപയോഗിച്ചു.
- source_word: בַּלַּיְלָה הוּא
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചനയും ഹീബ്രുവിലെ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: അടിസ്ഥാന അർഥം 'എടുക്കുക' എന്നാണെങ്കിലും, കുടുംബാംഗങ്ങളെ യാത്രയിൽ ഒപ്പം കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ 'കൂട്ടിക്കൊണ്ട്' സ്വാഭാവികവും അർഥസൂക്ഷ്മതയുള്ളതുമാണ്.
- source_word: שְׁתֵּי נָשָׁיו
  choice: തന്റെ രണ്ടു ഭാര്യമാരെയും
  rationale: ഈ സന്ദർഭത്തിൽ נָשִׁים യാക്കോബിന്റെ ഭാര്യമാരെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: രണ്ടു ദാസിമാരെയും
  rationale: שִׁפְחָה കീഴാള ഗൃഹപദവിയിലുള്ള സ്ത്രീദാസിയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കാം. 'ദാസിമാർ' വായനാസൗകര്യമുള്ള മുഖ്യപാഠരൂപമാണ്; കൂടുതൽ കടുപ്പമുള്ള സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: പതിനൊന്നു മക്കളെയും
  rationale: יְלָדִים എന്നത് ലിംഗനിർണ്ണയം ചെയ്യാതെ മക്കൾ/കുട്ടികൾ എന്നാണ്; വ്യാഖ്യാനപരമായി 'പുത്രന്മാർ' എന്ന് മാറ്റാതെ മൂലപദത്തിന്റെ വ്യാപ്തി സംരക്ഷിച്ചു.
- source_word: וַיַּעֲבֹר
  choice: കടന്നു
  rationale: യാത്രാസന്ദർഭത്തിൽ עבר ഒരു സ്ഥലമോ ജലധാരയോ കുറുകെ കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: യബ്ബോക്ക് കടവു
  rationale: מַעֲבַר നദിയിലെ കടക്കാവുന്ന സ്ഥലമായ കടവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലനാമത്തിനു പിന്നാലെ 'കടവ്' ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: יַבֹּק
  choice: യബ്ബോക്ക്
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം.
