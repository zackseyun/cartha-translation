translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ചയായ പ്രവർത്തനങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയാവിശേഷണരൂപങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പിലെ [a] ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
