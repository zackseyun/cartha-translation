  register: ആധുനിക നിലവാരമലയാളത്തിൽ, മൃഗങ്ങളുടെ ഇനവും ലിംഗവും വ്യക്തമായി കാണിക്കുന്ന ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. ഇംഗ്ലീഷിലെ footnote ക്രമക്കേടും പ്രസക്തമല്ലാത്ത lexical alternatives-ഉം പിന്തുടരാതെ എബ്രായ മൂലപാഠത്തിന്റെ നാല് വ്യക്തമായ വിഭാഗങ്ങൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
