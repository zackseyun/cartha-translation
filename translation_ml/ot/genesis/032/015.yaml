  language: ml
  text: ഇരുനൂറ് പെൺകോലാടുകൾ, ഇരുപത് ആൺകോലാടുകൾ, ഇരുനൂറ് പെൺചെമ്മരിയാടുകൾ, ഇരുപത് ആൺചെമ്മരിയാടുകൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: പെൺകോലാടുകൾ
  rationale: ഇത് കോലാടുകളെ സൂചിപ്പിക്കുന്നു; പിന്നാലെ ആൺകോലാടുകൾ വരുന്നതിനാൽ ഈ പ്രജനനമൃഗപ്പട്ടികയിൽ ലിംഗവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: מָאתַיִם
  choice: ഇരുനൂറ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: תְיָשִׁים
  choice: ആൺകോലാടുകൾ
  rationale: ആൺലിംഗത്തിലുള്ള കോലാടുകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗം.
- source_word: עֶשְׂרִים
  choice: ഇരുപത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: רְחֵלִים
  choice: പെൺചെമ്മരിയാടുകൾ
  rationale: പെൺലിംഗത്തിലുള്ള ചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ആൺചെമ്മരിയാടുകളുമായുള്ള ലിംഗവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: אֵילִים
  choice: ആൺചെമ്മരിയാടുകൾ
  rationale: ആൺലിംഗത്തിലുള്ള ചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും പൊതുവേ മനസ്സിലാക്കാവുന്നതുമായ രൂപം.
theological_decisions: []
