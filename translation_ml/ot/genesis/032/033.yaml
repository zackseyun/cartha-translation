  source_fidelity: മുഖ്യപാഠത്തിലെ ‘ഞരമ്പ്’ ഗീദ് (גִּיד) എന്ന വിശാലവും കൃത്യമായി തിരിച്ചറിയപ്പെടാത്തതുമായ പദത്തെ അനാവശ്യമായി ‘നാഡി’ എന്ന അർഥത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നു. കൂടാതെ അവസാനത്തെ ‘ആ ഞരമ്പിന്റെ ഭാഗത്ത്’ എന്ന പ്രയോഗം മൂലത്തിലെ ആവർത്തിക്കപ്പെടുന്ന ഗീദ് ഹന്നാശെഹിനെ കുറച്ചുകൂടി അസ്പഷ്ടമായി പുനരാവിഷ്കരിക്കുന്നു. ‘സ്നായു’ എന്നത് ഇവിടെ കൂടുതൽ സൂക്ഷ്മമായ പൊതുപദമാണ്; കുറിപ്പിൽ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം നിലനിർത്താം.
  naturalness: ‘തുടയുടെ സന്ധിക്കുഴി’ ‘തുടസന്ധിക്കുഴി’യേക്കാൾ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘അവൻ ... തൊട്ടതുകൊണ്ടാണ്’ എന്ന അവസാനഘടന മലയാളത്തിൽ കാരണബന്ധവും വാക്യത്തിന്റെ സമാപനവും തെളിമയോടെ നൽകുന്നു.
  terminology: גִּיד הַנָּשֶׁה രണ്ടിടത്തും ‘സ്നായു’ എന്നു ഒരേപോലെ വിവർത്തനം ചെയ്തിരിക്കുന്നു. ‘സയാറ്റിക് നാഡി’ എന്ന പ്രത്യേക തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി കുറിപ്പിൽ സാധ്യതയായി മാത്രം സൂചിപ്പിക്കുന്നു. ‘അവൻ’ എന്ന സർവനാമം മൂലപാഠവും മുൻസന്ദർഭവും അനുവദിക്കുന്ന വ്യാഖ്യാനവൈവിധ്യം സംരക്ഷിക്കുന്നു.
  issues:
