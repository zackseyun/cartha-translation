  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇന്നുവരെയും ഇസ്രായേൽമക്കൾ തുടയുടെ സന്ധിക്കുഴിയിലുള്ള സ്നായു[a] ഭക്ഷിക്കുന്നില്ല; അവൻ യാക്കോബിന്റെ തുടയുടെ സന്ധിക്കുഴിയിൽ ആ സ്നായുവിൽ തൊട്ടതുകൊണ്ടാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം ഇടുപ്പ്-തുട പ്രദേശത്തെ ഒരു പ്രത്യേക സ്നായുവിനെയോ തന്തുവിനെയോ സൂചിപ്പിക്കുന്നു. ഇതിനെ ചിലർ സയാറ്റിക് നാഡിയെന്നോ അതിനോടു ബന്ധപ്പെട്ട സ്നായുവെന്നോ തിരിച്ചറിയുന്നു.
    reason: lexical_and_anatomical_uncertainty
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: തുടർന്നുവരുന്ന ആചാരത്തിന്റെ കാരണം വ്യക്തമാക്കുന്ന എബ്രായ കാരണ-ഫല പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പതിവും ഗ്രാഹ്യവുമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: גִּיד הַנָּשֶׁה
  choice: ഞരമ്പ്
  rationale: גִּיד എന്നത് ഞരമ്പ്, നാഡി, സ്നായു എന്നിവയെ സൂചിപ്പിക്കാവുന്ന വിശാലമായ ശരീരഘടനാപദമാണ്; הַנָּשֶׁהയുടെ കൃത്യമായ അർഥവും അനിശ്ചിതമായതിനാൽ മുഖ്യപാഠത്തിൽ അതിരുകടന്ന സാങ്കേതിക നിർവചനം ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: തുടസന്ധിക്കുഴിയിലുള്ള
  rationale: כַּף എന്നതിന്റെ കുഴി/സന്ധിക്കുഴി എന്ന ദൃശ്യബോധവും יָרֵךְ എന്നതിന്റെ തുട-ഇടുപ്പ് പ്രദേശസൂചനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: ആചാരം വിവരണകർത്താവിന്റെ കാലംവരെ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּי נָגַע
  choice: കാരണം, അവൻ ... തൊട്ടിരുന്നു
  rationale: נגעയുടെ അടിസ്ഥാന അർഥമായ ‘തൊടുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ശക്തമായ ഫലം കണക്കിലെടുത്ത് ‘അടിച്ചു’ എന്ന അർഥം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: ആ ഞരമ്പിന്റെ ഭാഗത്ത്
  rationale: בְ എന്ന സ്ഥലസൂചകബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും മുമ്പ് പറഞ്ഞ ശരീരഭാഗത്തോടുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: തൊട്ട വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: അവൻ
  alternative: ദൈവം / ആ മനുഷ്യൻ
  rationale: എബ്രായപാഠം ഇവിടെ മൂന്നാംപുരുഷ ഏകവചന സർവനാമരൂപം മാത്രമാണ് ഉപയോഗിക്കുന്നത്. മുൻസന്ദർഭത്തിന്റെ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതിരിക്കാൻ ഈ പരാമർശരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ശരീരഘടനയെ അനാവശ്യമായി സാങ്കേതികമാക്കാതെ, മൂലപാഠത്തിലെ ആവർത്തനവും കാരണബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
