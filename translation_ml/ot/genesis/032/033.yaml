  to: അതുകൊണ്ട് ഇന്നുവരെയും ഇസ്രായേൽമക്കൾ തുടയുടെ സന്ധിക്കുഴിയിലുള്ള സ്നായു[a] ഭക്ഷിക്കുന്നില്ല; അവൻ യാക്കോബിന്റെ തുടയുടെ സന്ധിക്കുഴിയിൽ ആ സ്നായുവിൽ തൊട്ടതുകൊണ്ടാണ്.
