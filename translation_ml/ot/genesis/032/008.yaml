  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് വളരെ ഭയപ്പെടുകയും വ്യാകുലനാകുകയും ചെയ്തു. തന്നോടൊപ്പമുണ്ടായിരുന്ന ആളുകളെയും ആട്ടിൻകൂട്ടങ്ങളെയും കന്നുകാലിക്കൂട്ടങ്ങളെയും ഒട്ടകങ്ങളെയും അവൻ രണ്ടു പാളയങ്ങളായി[a] വിഭജിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘രണ്ടു സംഘങ്ങളായി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ഒരു പാളയത്തെയോ ക്രമീകരിച്ച സംഘത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא מְאֹד
  choice: വളരെ ഭയപ്പെടുകയും
  rationale: ירא എന്നത് ഭയത്തെ സൂചിപ്പിക്കുന്നു; מְאֹד അതിന്റെ തീവ്രത വർധിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ രണ്ടിന്റെയും ശക്തി ചേർത്ത് നൽകുന്നു.
- source_word: וַיֵּצֶר לוֹ
  choice: വ്യാകുലനാകുകയും ചെയ്തു
  rationale: ഈ പ്രയോഗം ഉള്ളിലെ ഞെരുക്കമോ കടുത്ത മനോവിഷമമോ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക ഘടന ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּחַץ
  choice: തിരിച്ചു
  rationale: חצה എന്ന ധാതു വിഭജിക്കുക, രണ്ടാക്കുക എന്ന ബോധം നൽകുന്നു; ഇവിടെ യാക്കോബിന്റെ ആസൂത്രിത നടപടിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: തന്നോടൊപ്പമുണ്ടായിരുന്ന ആളുകളെ
  rationale: ഇവിടെ עָם ഒരു ജനതയെയല്ല, യാക്കോബിനൊപ്പമുള്ള യാത്രാസംഘത്തിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַצֹּאן
  choice: ആട്ടിൻപറ്റങ്ങൾ
  rationale: צֹאן സാധാരണയായി ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ കൂട്ടനാമം ഉപയോഗിച്ചു.
- source_word: הַבָּקָר
  choice: കന്നുകാലിക്കൂട്ടങ്ങൾ
  rationale: בָּקָר കന്നുകാലികളെ കൂട്ടമായാണ് സൂചിപ്പിക്കുന്നത്; צֹאן എന്നതിനോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: הַגְּמַלִּים
  choice: ഒട്ടകങ്ങൾ
  rationale: ഹീബ്രു പദത്തിന്റെ നേരിട്ടും വ്യക്തവുമായ വിവർത്തനം.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: രണ്ടു പാളയങ്ങളായി
  rationale: מַחֲנֶה എന്നത് പാളയത്തെയോ പാളയമടിച്ച സംഘത്തെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള വിവരണത്തിലെ പദസംബന്ധം നിലനിർത്താൻ ‘പാളയങ്ങൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പട്ടികാസമാന്തരത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വിഭക്തിസമന്വയം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദത്തോടു ചേർന്നാണ് [a] നൽകിയിരിക്കുന്നത്.
