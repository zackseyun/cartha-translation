  text: וַ/יִּקָּחֵ֔/ם וַ/יַּֽעֲבִרֵ֖/ם אֶת הַ/נָּ֑חַל וַֽ/יַּעֲבֵ֖ר אֶת אֲשֶׁר ל/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: ml
  text: അവൻ അവരെ എടുത്ത് നീരൊഴുക്ക്[a] കടത്തി; തനിക്കുള്ളതെല്ലാം[b] മറുകരയിലേക്കു കടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തോട്,’ ‘മലയിടുക്ക്,’ അല്ലെങ്കിൽ ‘കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന ചാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ נחל ഒരു നീരൊഴുക്കിനെയോ മലയിടുക്കിനെയോ കാലിക ജലപാതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവനുള്ളത്’; അതായത്, അവന്റെ വസ്തുവകകൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: അവൻ അവരെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ മുമ്പ് പരാമർശിച്ചവരെ നദിക്കരയിലേക്കു നയിക്കുന്ന പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കാൻ ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്നു നൽകി.
- source_word: וַיַּעֲבִרֵם
  choice: കടത്തി
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകാർഥം—അവരെ കടക്കാൻ ഇടയാക്കുക—ചുരുക്കമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: הַנָּחַל
  choice: നീരൊഴുക്ക്
  rationale: נחל എന്നത് ഒഴുകുന്ന തോടിനെയോ, മിക്കപ്പോഴും കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന ചാലിനെയോ താഴ്വരയെയോ സൂചിപ്പിക്കാം. ‘നീരൊഴുക്ക്’ കടന്നുപോകുന്ന ഈ സന്ദർഭത്തിൽ വ്യക്തവും ആധുനികവുമാണ്; പദത്തിന്റെ വിശാലമായ ഭൂപ്രകൃത്യാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבֵר
  choice: മറുകരയിലേക്കു കടത്തി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകാർഥം നിലനിർത്തുന്നു. മലയാളത്തിൽ ഉദ്ദേശിച്ച ദിശ വ്യക്തമാക്കാൻ സന്ദർഭസിദ്ധമായ ‘മറുകരയിലേക്കു’ ചേർത്തിരിക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുള്ളതെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനുള്ളത്’ എന്ന ബന്ധപ്രയോഗമാണിത്. സന്ദർഭത്തിൽ യാക്കോബിന്റെ വസ്തുവകകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തനിക്കുള്ളതെല്ലാം’ സ്വാഭാവികവും മൂലഘടനയോട് അടുത്തതുമാണ്.
