revisions:
- from: 'അവൻ ഓരോ കൂട്ടത്തെയും പ്രത്യേകം പ്രത്യേകം തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏൽപ്പിച്ചു[a]. പിന്നെ അവൻ ദാസന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ എനിക്കു മുമ്പായി കടന്നുപോകുക; ഓരോ കൂട്ടത്തിനും ഇടയിൽ അകലം ഇടുക.”'
  to: 'അവൻ ഓരോ മൃഗക്കൂട്ടത്തെയും വേർവേറെ തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏൽപ്പിച്ചു[a]. അവൻ തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ എനിക്കു മുമ്പായി കടന്നുപോകുക; ഒരു മൃഗക്കൂട്ടത്തിനും മറ്റൊരു മൃഗക്കൂട്ടത്തിനുമിടയിൽ അകലം ഇടുക.”'
  rationale: The revision preserves the Hebrew’s distributive arrangement (‘each herd separately’) and its explicit instruction to leave space from one group to the next, while using idiomatic modern standard Malayalam. The existing footnote anchor is retained and its explanation is lightly polished without altering its meaning.
