  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּן֙ בְּ/יַד עֲבָדָ֔י/ו עֵ֥דֶר עֵ֖דֶר לְ/בַדּ֑/וֹ וַ֤/יֹּאמֶר אֶל עֲבָדָי/ו֙ עִבְר֣וּ לְ/פָנַ֔/י וְ/רֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּ/בֵ֥ין עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: ml
  text: 'അവൻ ഓരോ മൃഗക്കൂട്ടത്തെയും വേർവേറെ തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏൽപ്പിച്ചു[a]. അവൻ തന്റെ ദാസന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ എനിക്കു മുമ്പായി കടന്നുപോകുക; ഒരു മൃഗക്കൂട്ടത്തിനും മറ്റൊരു മൃഗക്കൂട്ടത്തിനുമിടയിൽ അകലം ഇടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ ദാസന്മാരുടെ കൈയിൽ കൊടുത്തു.” ഈ എബ്രായ പ്രയോഗം അവരെ അവരുടെ ചുമതലയിലോ നിയന്ത്രണത്തിലോ ഏൽപ്പിച്ചു എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: കൈയിൽ ഏൽപ്പിച്ചു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ ചുമതലയിലോ നിയന്ത്രണത്തിലോ ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈയിൽ ഏൽപ്പിച്ചു’ എന്നത് ദൃശ്യരൂപവും സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന് ‘അടിമ’ എന്നും ‘ദാസൻ’ എന്നും അർഥമാകാം. ഇവിടെ യാക്കോബിന്റെ നിർദേശം നടപ്പാക്കുന്ന ഗൃഹപരിചാരകരാണ് പ്രസക്തർ; അവരുടെ നിയമപരമായ അടിമസ്ഥിതി വാക്യത്തിന്റെ ശ്രദ്ധാകേന്ദ്രമല്ല.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: ഓരോ കൂട്ടത്തെയും പ്രത്യേകം പ്രത്യേകം
  rationale: പദത്തിന്റെ ആവർത്തനം വിതരണാർഥം നൽകുന്നു—ഓരോ മൃഗക്കൂട്ടവും മറ്റുള്ളവയിൽനിന്ന് വേർതിരിച്ച്. ‘പ്രത്യേകം പ്രത്യേകം’ ആ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: עִבְרוּ לְפָנַי
  choice: എനിക്കു മുമ്പായി കടന്നുപോകുക
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടന്നുപോകുക/മുന്നോട്ടു നീങ്ങുക’ എന്ന ചലനാർഥവും לְפָנַי എന്നതിന്റെ ‘എന്റെ മുമ്പിൽ/മുമ്പായി’ എന്ന അർഥവും നിലനിർത്തുന്നു; നിർബന്ധമായി ഒരു നദി കടക്കുന്നതായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: רֶוַח
  choice: അകലം
  rationale: רֶוַח ഇവിടെ മൃഗക്കൂട്ടങ്ങൾക്കിടയിലെ ഇടവേളയെയോ സ്ഥലവ്യത്യാസത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അകലം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: ഓരോ കൂട്ടത്തിനും ഇടയിൽ
  rationale: 'എബ്രായത്തിലെ ആവർത്തനഘടനയുടെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു: ഒരു കൂട്ടത്തിനും അടുത്ത കൂട്ടത്തിനും ഇടയിൽ അകലം വേണം.'
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കൂട്ടം’ ആടുകളെയും കോലാടുകളെയും കന്നുകാലികളെയും ഒട്ടകങ്ങളെയും കഴുതകളെയും ഉൾക്കൊള്ളുന്ന വ്യത്യസ്ത മൃഗവിഭാഗങ്ങൾക്ക് ചേരുന്ന പൊതുപദമായി ഉപയോഗിച്ചു. മൂലത്തിലെ വിതരണാത്മക ആവർത്തനം ആദ്യ ഉപവാക്യത്തിൽ ‘പ്രത്യേകം പ്രത്യേകം’ എന്നും അവസാനത്തിൽ സ്വാഭാവികമായ ‘ഓരോ കൂട്ടത്തിനും ഇടയിൽ’ എന്നും പകർന്നു.
