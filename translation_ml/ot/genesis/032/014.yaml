source:
  edition: WLC
  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ ആ രാത്രി അവിടെ തങ്ങി; തന്റെ കൈയിൽ വന്നതിൽനിന്ന്[a] അവൻ തന്റെ സഹോദരനായ ഏശാവിന് ഒരു സമ്മാനം എടുത്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ സ്വാഭാവികമായി: ‘തന്റെ കൂടെയുണ്ടായിരുന്നതിൽനിന്ന്’ അഥവാ ‘തന്റെ കൈവശമുണ്ടായിരുന്നതിൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: തങ്ങി
  rationale: ലൂൻ എന്ന ക്രിയ രാത്രി താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങി’ എന്നത് സന്ദർഭത്തിൽ രാത്രി അവിടെ ചെലവഴിച്ചുവെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാള തുല്യം.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രി
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ രാത്രിയിൽ’; മലയാളത്തിൽ ‘ആ രാത്രി’ സ്വാഭാവികവും കാലസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: ലാഖഖ് സാധാരണയായി ‘എടുക്കുക’ എന്നാണ്. ഇവിടെ യാക്കോബ് സമ്മാനമായി നൽകേണ്ടവ വേർതിരിച്ചെടുക്കുന്ന പ്രവൃത്തിയെ വിശാലവും വിശ്വസ്തവുമായി ഈ പദം അവതരിപ്പിക്കുന്നു.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: തന്റെ കൈയിൽ വന്നതിൽനിന്ന്
  rationale: ‘തന്റെ കൈയിൽ വന്നതിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ഉദ്ദേശപൂർവമായ ചിത്രഭാഷയും കഴിയുന്നത്ര നിലനിർത്തുന്നു. കൈവശമുണ്ടായിരുന്നതിൽനിന്ന് എന്ന കൂടുതൽ സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִנְחָה
  choice: ഒരു സമ്മാനം
  rationale: ഈ വ്യക്തിബന്ധപരമായ സന്ദർഭത്തിൽ മിൻഖാ ആരാധനാർപ്പണത്തേക്കാൾ ഏശാവിനെ ആദരിക്കാനോ അനുനയിപ്പിക്കാനോ നൽകുന്ന സമ്മാനമാണ്. ‘സമ്മാനം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: לְעֵשָׂו אָחִיו
  choice: തന്റെ സഹോദരനായ ഏശാവിന്
  rationale: ലാമെദ് സ്വീകർത്താവിനെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ ബന്ധസൂചനയും ഏശാവ് സ്വീകർത്താവാണെന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടർന്നുവരുന്ന സമ്മാനപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്നതിനാൽ വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിനരികെ [a] ചേർത്തിരിക്കുന്നു.
