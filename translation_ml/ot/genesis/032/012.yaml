  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: ml
  text: എന്റെ സഹോദരന്റെ കൈയിൽനിന്ന്, ഏശാവിന്റെ കൈയിൽനിന്ന്, ദയവായി എന്നെ വിടുവിക്കണമേ. കാരണം, ഞാൻ അവനെ ഭയപ്പെടുന്നു; അവൻ വന്ന് എന്നെയും അമ്മയെയും മക്കളെയും അടിക്കുമോ എന്നു ഞാൻ ഭയപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “മക്കളുടെമേൽ അമ്മ”; അമ്മയെയും മക്കളെയും ഒരുമിച്ച് ആക്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: ദയവായി എന്നെ വിടുവിക്കണമേ
  rationale: നצל എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം അപകടത്തിൽനിന്നുള്ള വിടുതലിനെ സൂചിപ്പിക്കുന്നു; נָא അപേക്ഷയുടെ വിനയസ്വരം നൽകുന്നു. മലയാളത്തിലെ പ്രാർഥനാഭാഷയിൽ ഈ രൂപം സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: എന്റെ സഹോദരന്റെ കൈയിൽനിന്ന്, ഏശാവിന്റെ കൈയിൽനിന്ന്
  rationale: ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യരൂപകം എതിരാളിയുടെ അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ ഉള്ള വിടുതൽ എന്ന എബ്രായ പ്രയോഗത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; ‘സഹോദരൻ’ എന്ന ആവർത്തനാത്മക തിരിച്ചറിയൽ കുടുംബബന്ധത്തിലെ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: എനിക്ക് അവനെ ഭയമാണ്
  rationale: യാക്കോബിന്റെ ഇപ്പോഴത്തെ വ്യക്തിപരമായ ഭയം സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּן יָבוֹא
  choice: അവൻ വന്ന് … മോ എന്നു ഞാൻ ഭയപ്പെടുന്നു
  rationale: פֶּן ഭയപ്പെടുന്ന സാധ്യതയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-മോ എന്നു ഭയപ്പെടുന്നു’ എന്ന ഘടന ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִכַּנִי
  choice: എന്നെയും … അടിച്ചുവീഴ്ത്തുമോ
  rationale: נכה എന്ന ക്രിയയിലെ ആക്രമിച്ചു വീഴ്ത്തുന്ന ശക്തി നിലനിർത്തുന്നു; സന്ദർഭം മരണകരമായ ആക്രമണം സൂചിപ്പിച്ചാലും ‘കൊല്ലുക’ എന്നു വ്യക്തമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: אֵם עַל בָּנִים
  choice: അമ്മമാരെയും മക്കളെയും
  rationale: അക്ഷരാർഥം ‘മക്കളുടെമേൽ അമ്മ’ എന്നാണ്; കുടുംബങ്ങളെ ഒരുമിച്ച് നശിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്. യാക്കോബിന്റെ കുടുംബത്തിൽ ഒന്നിലധികം അമ്മമാർ ഉള്ളതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടാർഥം ഉപയോഗിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് മൂലരൂപത്തിലെ ഏകവചനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֵם עַל בָּנִים എന്ന ഹിംസാത്മക പ്രയോഗത്തിന്റെ പരിധി
  choice: അമ്മമാരെയും മക്കളെയും
  alternative: മക്കളോടുകൂടെ അമ്മയെയും
  rationale: ഇത് യാക്കോബിനെ ‘അമ്മ’ എന്നു വിശേഷിപ്പിക്കുന്ന സമാസമല്ല; ആക്രമണം അവനെയും കുടുംബത്തിലെ അമ്മമാരെയും കുട്ടികളെയും ഒരുമിച്ച് ബാധിക്കുമെന്ന ഭയമാണ്. എന്നാൽ എബ്രായത്തിലെ ഏകവചന ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- issue: וְהִכַּנִי എന്നതിൽ മരണത്തെ വ്യക്തമാക്കണമോ
  choice: അടിച്ചുവീഴ്ത്തുമോ
  alternative: കൊന്നുകളയുമോ
  rationale: സന്ദർഭം കൂട്ടക്കൊലയുടെ ഭീഷണി ശക്തമായി സൂചിപ്പിക്കുന്നു; എങ്കിലും ക്രിയയുടെ വിശാലമായ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന അർഥം കണക്കിലെടുത്ത് മരണത്തെ വ്യാഖ്യാനമായി നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രാർഥനാശൈലി. ‘കൈയിൽനിന്ന്’ എന്ന സ്രോതസ്സിലെ ദൃശ്യരൂപവും വാക്യത്തിലെ കുടുംബപരമായ സംഘർഷവും നിലനിർത്തി; ദുഷ്കരമായ അവസാന പ്രയോഗം മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമാക്കി അടിക്കുറിപ്പിൽ അക്ഷരരൂപം രേഖപ്പെടുത്തി.
