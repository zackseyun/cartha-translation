reference: Genesis 32:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: ml
  text: 'എന്നാൽ നീ പറഞ്ഞുവല്ലോ: “ഞാൻ നിനക്കു നിശ്ചയമായും നന്മ ചെയ്യും[a]; അനവധി ആയതിനാൽ എണ്ണാനാവാത്ത കടൽമണൽപോലെ നിന്റെ സന്തതിയെ[b] ആക്കും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ തീർച്ചയായും നിനക്കു നന്മ ചെയ്യും.” ഹീബ്രായത്തിൽ ഊന്നലിനായി ക്രിയയുടെ ഒരു പ്രത്യേക രൂപം സമാപികക്രിയയോടൊപ്പം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിന്റെ പിൻതലമുറയെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദം ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “എണ്ണാനാവാത്ത.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: എന്നാൽ നീ അരുളിച്ചെയ്തല്ലോ
  rationale: വാവ് സഹിതമുള്ള സ്വതന്ത്ര സർവനാമം യാക്കോബിന്റെ അപേക്ഷയിൽ ദൈവവാഗ്ദാനത്തെയും ഇപ്പോഴത്തെ അപകടത്തെയും തമ്മിൽ പ്രത്യക്ഷമായി നിരത്തുന്നു. ‘എന്നാൽ’ ഈ വൈരുധ്യഭാവം നൽകുന്നു; ദൈവത്തോടുള്ള പ്രാർഥനാസന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തല്ലോ’ ആദരവോടെയും സ്വാഭാവികമായും മുൻവാഗ്ദാനം ഓർമിപ്പിക്കുന്നു.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: ഞാൻ നിനക്കു നിശ്ചയമായും നന്മ ചെയ്യും
  rationale: ക്രിയാനാമത്തിന്റെ നിർവികാരരൂപവും സമാപികക്രിയയും ചേർന്ന ഘടനയിലെ ഊന്നൽ ‘നിശ്ചയമായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു. היטיב עם എന്ന പ്രയോഗം ഒരാളോടു നന്മ ചെയ്യുക എന്ന അർഥത്തിലാണ്; ഐശ്വര്യം മാത്രം എന്ന് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְשַׂמְתִּי
  choice: ആക്കും
  rationale: സന്തതിയുടെ സംഖ്യയെ കടൽമണലിനോടു താരതമ്യം ചെയ്യുന്ന സന്ദർഭത്തിൽ שׂים എന്നതിന് അക്ഷരാർഥമായ ‘വെക്കും’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ അർഥം ‘ആക്കും’ ആണ്.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഒരു സമൂഹവാചക ഏകവചനമാണ്. മലയാളത്തിലെ ‘സന്തതി’ ആ കൂട്ടായ ഏകവചനഭാവം നിലനിർത്തുകയും ‘വിത്ത്’ എന്ന അസ്വാഭാവിക അക്ഷരാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כְּחוֹל הַיָּם
  choice: കടൽമണൽപോലെ
  rationale: ഹീബ്രായ ഉപമയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കടലിനോടു ബന്ധപ്പെട്ട മണൽ എന്ന ദൃശ്യരൂപം നിലനിൽക്കുന്നു.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: പെരുപ്പംനിമിത്തം എണ്ണാനാവാത്ത
  rationale: നിഫാൽ അപൂർണക്രിയ എണ്ണപ്പെടാനാകാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; מֵרֹב അതിന്റെ കാരണം പെരുപ്പമാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളരൂപം രണ്ടും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച ആദരവും ഗൗരവവും നിലനിർത്തി. അതേസമയം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന പദക്രമവും പദാവലിയും തെരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
