source:
  edition: WLC
  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: ml
  text: “എനിക്കു കാളകളും കഴുതകളും ആട്ടിൻപറ്റങ്ങളും ദാസന്മാരും ദാസിമാരും[a] ഉണ്ട്. യജമാനനായ അങ്ങയെ അറിയിക്കാനായി ഞാൻ ദൂതന്മാരെ അയച്ചിരിക്കുന്നു; അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കേണ്ടതിന്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരുഷ അടിമകളും സ്ത്രീ അടിമകളും.” എബ്രായപദങ്ങൾ ബന്ധിതരായ വീട്ടുവേലക്കാരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: എനിക്കു … ഉണ്ട്
  rationale: היה + ל എന്ന എബ്രായ പ്രയോഗം ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു. യാക്കോബിന്റെ ഇപ്പോഴത്തെ സമ്പത്ത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു.
- source_word: שׁוֹר וַחֲמוֹר
  choice: കാളകളും കഴുതകളും
  rationale: രണ്ടു നാമങ്ങളും ഇവിടെ ഓരോ മൃഗവിഭാഗത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: צֹאן
  choice: ആടുമാടുകൾ
  rationale: ഈ കൂട്ടനാമം പ്രധാനമായും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആടുമാടുകൾ’ പട്ടികാസന്ദർഭത്തിൽ സ്വാഭാവികമായ കൂട്ടപദമാണ്.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: ദാസന്മാരും ദാസിമാരും
  rationale: പുരുഷ-സ്ത്രീ വ്യത്യാസം നിലനിർത്തുകയും വീട്ടുസേവകരെയോ ബന്ധിതവേലക്കാരെയോ സൂചിപ്പിക്കാവുന്ന മൂലപദങ്ങളുടെ അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു. അടിമസ്ഥിതിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: അറിയിക്കാനായി ഞാൻ ആളയച്ചിരിക്കുന്നു
  rationale: യാക്കോബ് സന്ദേശവാഹകരെ അയച്ച ഉടൻ പറയുന്ന റിപ്പോർട്ടായതിനാൽ പൂർത്തിയായെങ്കിലും ഇപ്പോഴത്തെ സാഹചര്യവുമായി ബന്ധപ്പെട്ട പ്രവൃത്തി ‘ആളയച്ചിരിക്കുന്നു’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לַאדֹנִי
  choice: യജമാനനായ അങ്ങയെ
  rationale: ഇത് ഏശാവിനോടുള്ള വിനയപൂർവമായ സാമൂഹിക അഭിസംബോധനയാണ്, ദൈവിക പദവിയല്ല. ‘അങ്ങ്’ ആദരവും ‘യജമാനൻ’ മൂലപദത്തിന്റെ ബന്ധസൂചനയും നിലനിർത്തുന്നു.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിക്കേണ്ടതിന്
  rationale: അനുകൂലമായ പരിഗണന ലഭിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും ‘കണ്ണുകളിൽ/ദൃഷ്ടിയിൽ’ എന്ന രൂപകവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വീട്ടുസമ്പത്തിന്റെ പട്ടികയിൽ עֶבֶד / שִׁפְחָה എന്ന പദങ്ങളുടെ വിവർത്തനം
  choice: ദാസന്മാരും ദാസിമാരും
  alternative: അടിമകളും അടിമസ്ത്രീകളും
  rationale: ഈ പദങ്ങൾ ബന്ധിതമായ വീട്ടുവേലക്കാരെ സൂചിപ്പിക്കാം; എന്നാൽ അവരുടെ കൃത്യമായ നിയമസ്ഥിതി വാക്യം നിർവചിക്കുന്നില്ല. അതിനാൽ ലിംഗവ്യത്യാസം നിലനിർത്തുന്ന പരമ്പരാഗതവും വായനാസൗകര്യമുള്ളതുമായ പദങ്ങൾ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച് ശക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരസൂചകവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ഏശാവിനോടുള്ള യാക്കോബിന്റെ വിനയം പ്രകടമാക്കാൻ ‘യജമാനനായ അങ്ങ്’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ അനുകൂലദൃഷ്ടിയുടെ രൂപകം ‘അങ്ങയുടെ ദൃഷ്ടിയിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
