  text: וַ/יְצַ֞ו גַּ֣ם אֶת הַ/שֵּׁנִ֗י גַּ֚ם אֶת הַ/שְּׁלִישִׁ֔י גַּ֚ם אֶת כָּל הַ/הֹ֣לְכִ֔ים אַחֲרֵ֥י הָ/עֲדָרִ֖ים לֵ/אמֹ֑ר כַּ/דָּבָ֤ר הַ/זֶּה֙ תְּדַבְּר֣וּ/ן אֶל עֵשָׂ֔ו בְּ/מֹצַאֲ/כֶ֖ם אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: ml
  text: 'അവൻ രണ്ടാമനോടും മൂന്നാമനോടും മൃഗക്കൂട്ടങ്ങളുടെ പിന്നാലെ പോകുന്ന എല്ലാവരോടും ഇങ്ങനെ കൽപ്പിച്ചു: “നിങ്ങൾ ഏശാവിനെ കണ്ടെത്തുമ്പോൾ ഈ വാക്കനുസരിച്ച്[a] അവനോടു സംസാരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങൾ ഏശാവിനെ കണ്ടുമുട്ടുമ്പോൾ ഇങ്ങനെ അവനോടു പറയണം.” എബ്രായ പ്രയോഗം ഇങ്ങനെ കൂടുതൽ സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്താം; മുഖ്യപാഠം യാക്കോബ് നിർദേശിച്ച സന്ദേശത്തിന്റെ വാചകരൂപത്തോടുള്ള ബന്ധം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ പിയേൽ രൂപം അധികാരപൂർവമായ നിർദേശം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ നിർദേശബലം നിലനിർത്തുന്നു.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: രണ്ടാമനോടും മൂന്നാമനോടും
  rationale: ഇവ നാമമായി ഉപയോഗിച്ച ക്രമസംഖ്യകളാണ്. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ദാസൻ’ എന്ന നാമം ചേർക്കാതെ, സന്ദർഭത്തിലെ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: כָּל הַהֹלְכִים
  choice: പോകുന്ന എല്ലാവരോടും
  rationale: כל കൂടിയ വർത്തമാന കൃദന്തരൂപം പിന്നാലെ സഞ്ചരിച്ചിരുന്ന മുഴുവൻ ആളുകളെയും സൂചിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי הָעֲדָרִים
  choice: മൃഗക്കൂട്ടങ്ങളുടെ പിന്നാലെ
  rationale: עדרים ഓടിച്ചുകൊണ്ടുപോകുന്ന മൃഗങ്ങളുടെ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു. ആടുകളിലേക്കോ കന്നുകാലികളിലേക്കോ മാത്രം അർഥം ചുരുക്കാതിരിക്കാൻ ‘മൃഗക്കൂട്ടങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: כַּדָּבָר הַזֶּה
  choice: ഈ വാക്കുപോലെ
  rationale: അക്ഷരാർഥം ‘ഈ വാക്ക്/കാര്യം അനുസരിച്ച്’ എന്നാണ്; യാക്കോബ് മുമ്പ് നിർദേശിച്ച സന്ദേശത്തിന്റെ വാചകരൂപവുമായി ഉള്ള ബന്ധം ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: תְּדַבְּרוּן
  choice: സംസാരിക്കണം
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും നിർദേശാത്മക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: നിങ്ങൾ ഏശാവിനെ കണ്ടെത്തുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘കണ്ടെത്തുമ്പോൾ’ מצאയുടെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘കണ്ടുമുട്ടുമ്പോൾ’ എന്നും സാധ്യമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ദാസൻ’ പോലുള്ള മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത നാമങ്ങൾ ചേർത്തിട്ടില്ല; ആവർത്തനഘടന മലയാളത്തിൽ ‘-ഓടും’ എന്ന സമാന്തരരൂപത്തിലൂടെ നിലനിർത്തി.
