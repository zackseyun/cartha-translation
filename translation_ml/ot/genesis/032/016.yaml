translation:
  language: ml
  text: കുഞ്ഞുങ്ങളോടുകൂടിയ മുലയൂട്ടുന്ന ഒട്ടകങ്ങൾ മുപ്പത്, പശുക്കൾ നാല്പത്, കാളകൾ പത്ത്, പെൺകഴുതകൾ ഇരുപത്, കഴുതക്കുട്ടികൾ പത്ത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആൺകഴുതകൾ പത്ത്.’ എബ്രായപദം ഇളംപ്രായമുള്ള കഴുതകളെയോ ആൺകഴുതകളെയോ സൂചിപ്പിക്കാം; ഈ കന്നുകാലിപ്പട്ടികയിൽ പെൺകഴുതകളോടു ചേർത്തുപറയുന്നതിനാൽ ‘ആൺകഴുതകൾ’ എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: മുലയൂട്ടുന്ന ഒട്ടകങ്ങൾ
  rationale: מֵינִיקוֹת എന്ന സ്ത്രീലിംഗ ബഹുവചന കൃദന്തം കുഞ്ഞുങ്ങൾക്ക് പാൽ കൊടുക്കുന്ന പെൺഒട്ടകങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘മുലയൂട്ടുന്ന’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וּבְנֵיהֶם
  choice: അവയുടെ കുഞ്ഞുങ്ങളും
  rationale: പദശഃ ‘അവയുടെ മക്കൾ’; മൃഗങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ‘കുഞ്ഞുങ്ങൾ’ എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: פָּרוֹת
  choice: പശുക്കൾ
  rationale: സ്ത്രീലിംഗ കന്നുകാലികളെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: וּפָרִים
  choice: കാളകൾ
  rationale: പട്ടികയിലെ പെൺകന്നുകാലികളോടു വേർതിരിച്ചുള്ള ആൺകന്നുകാലികളെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲתֹנֹת
  choice: പെൺകഴുതകൾ
  rationale: എബ്രായപദം കഴുതകളുടെ സ്ത്രീലിംഗം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നതിനാൽ ലിംഗവ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: וַעְיָרִם
  choice: കഴുതക്കുട്ടികൾ
  rationale: עַיִר ഇളംപ്രായമുള്ള കഴുതയെ, പ്രത്യേകിച്ച് കഴുതക്കുട്ടിയെ, സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ആൺകഴുതകൾ എന്ന അർഥസാധ്യതയും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
