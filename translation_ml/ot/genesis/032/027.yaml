source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്നെ വിട്ടയക്കൂ[a]; പുലരി ഉദിച്ചിരിക്കുന്നു[b].” എന്നാൽ അവൻ പറഞ്ഞു[c]: “നീ എന്നെ അനുഗ്രഹിക്കാതെ ഞാൻ നിന്നെ വിട്ടയക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ വിടൂ” അല്ലെങ്കിൽ “എന്നെ അയച്ചയക്കൂ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നേരം പുലരുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: ഈ വാക്യത്തിൽ സംസാരിക്കുന്നവർ ആരെന്ന് എബ്രായപാഠം നേരിട്ട് വ്യക്തമാക്കുന്നില്ല; ചുറ്റുമുള്ള വിവരണത്തിൽനിന്നാണ് അവരുടെ തിരിച്ചറിയൽ അനുമാനിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: എന്നെ വിട്ടയക്കൂ
  rationale: שׁלח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന രൂപം ‘എന്നെ അയയ്ക്കുക/വിടുക’ എന്നാണ്. മല്ലയുദ്ധത്തിന്റെ സാഹചര്യത്തിൽ ‘എന്നെ വിട്ടയക്കൂ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: പുലരി ഉദിച്ചിരിക്കുന്നു
  rationale: כִּי കാരണബന്ധം സൂചിപ്പിക്കുന്നു; עָלָה (‘ഉയർന്നു/ഉദിച്ചു’)യും הַשָּׁחַר (‘പുലരി’)യും ചേർന്ന ദൃശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: ഞാൻ നിന്നെ വിട്ടയക്കുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ ഉറച്ച നിരാകരണം പ്രകടിപ്പിക്കുന്നു. ആദ്യ വാക്യത്തിലെ അതേ ക്രിയയ്ക്ക് ‘വിട്ടയക്കുക’ ആവർത്തിച്ച് ഉപയോഗിക്കുന്നത് എബ്രായത്തിലെ പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: ഈ കണികാസംയോജനം വ്യവസ്ഥാപരമായ ഒഴിവിനെ സൂചിപ്പിക്കുന്നു. ‘അല്ലാതെ’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: בֵּרַכְתָּנִי
  choice: നീ എന്നെ അനുഗ്രഹിച്ചാൽ
  rationale: വ്യവസ്ഥാപരമായ സന്ദർഭത്തിൽ പൂർത്തിക്രിയ, അനുഗ്രഹം ലഭിക്കാതെ വിട്ടയക്കില്ലെന്ന ആവശ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അനുഗ്രഹിച്ചാൽ’ ഈ വ്യവസ്ഥ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു ... എന്നാൽ അവൻ പറഞ്ഞു
  rationale: എബ്രായത്തിൽ ഇരുവട്ടവും ഒരേ ‘അവൻ പറഞ്ഞു’ രൂപമാണ്. രണ്ടാമത്തെ മറുപടിയുടെ വിരുദ്ധഭാവം സ്വാഭാവിക മലയാളത്തിനായി ‘എന്നാൽ’ കൊണ്ടു വ്യക്തമാക്കുന്നു; സംസാരിക്കുന്നവരുടെ പേരുകൾ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സംസാരിക്കുന്നവരുടെ തിരിച്ചറിയൽ
  choice: വാക്യത്തിൽ ഇരുവർക്കും ‘അവൻ’ എന്ന പൊതുസർവനാമം നിലനിർത്തി; പേരുകളോ ‘ദൈവം/ദൂതൻ’ എന്ന തിരിച്ചറിയലോ ചേർത്തില്ല.
  alternative: ആദ്യ സംസാരിക്കുന്നവനെ ‘ആ മനുഷ്യൻ/ദൂതൻ’ എന്നും രണ്ടാമനെ ‘യാക്കോബ്’ എന്നും വ്യക്തമാക്കുക.
  rationale: എബ്രായ വാക്യത്തിൽ കർത്താക്കൾ പ്രത്യേകം നാമകരണം ചെയ്യപ്പെട്ടിട്ടില്ല; മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന ക്രിയാരൂപങ്ങൾ മാത്രമാണ്. ചുറ്റുമുള്ള വിവരണത്തിൽനിന്നുള്ള തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ആഖ്യാനത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘പുലരി ഉദിച്ചിരിക്കുന്നു’ മൂലത്തിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ ഓരോ അടിക്കുറിപ്പു ചിഹ്നവും അനുയോജ്യമായ സ്ഥാനത്ത് നൽകിയിരിക്കുന്നു.
