id: GEN.32.10
reference: Genesis 32:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: ml
  text: 'യാക്കോബ് പറഞ്ഞു: “എന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവമേ, എന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവമേ, ‘നിന്റെ ദേശത്തേക്കും നിന്റെ ബന്ധുജനങ്ങളുടെ അടുത്തേക്കും മടങ്ങിപ്പോകുക; ഞാൻ നിനക്കു നന്മ ചെയ്യും’ എന്ന് എന്നോടു പറഞ്ഞ യാഹ്‌വേ,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: യാക്കോബ് പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിന് ‘പറഞ്ഞു’ മതിയാകുന്നു.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: എന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവമേ, എന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവമേ
  rationale: സംയുക്തനാമഘടനയും പ്രാർഥനയിലെ സംബോധനഭാവവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലും സംബോധനരൂപത്തിലും നൽകുന്നു.
- source_word: הָאֹמֵר אֵלַי
  choice: എന്ന് എന്നോടു പറഞ്ഞ
  rationale: നിശ്ചയാർഥക കർത്തൃവാചകത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: שׁוּב לְאַרְצְךָ
  choice: നിന്റെ ദേശത്തേക്ക് ... മടങ്ങിപ്പോകുക
  rationale: שׁוּב എന്ന കല്പനയുടെ ഭൂമിശാസ്ത്രപരമായ മടങ്ങിവരവ് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: നിന്റെ ബന്ധുജനങ്ങളുടെ അടുക്കലേക്ക്
  rationale: מוֹלֶדֶת എന്നത് ജന്മദേശം, ജന്മസ്ഥലം, ബന്ധുവർഗം എന്നീ അർഥങ്ങൾ വഹിക്കാം; ഈ സന്ദർഭത്തിലെ കുടുംബ-ഉത്ഭവബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: ഞാൻ നിനക്കു നന്മ ചെയ്യും
  rationale: ഹിഫീൽ രൂപവും עִם-ഉം ചേർന്ന പ്രയോഗത്തിന്റെ ഗുണകരമായി പെരുമാറുക/നന്മ വരുത്തുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വെ’ മറ്റൊരു സാധുവായ ലിപ്യന്തരണമാണ്.
- issue: מוֹלֶדֶת എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ബന്ധുജനങ്ങൾ
  alternative: ജന്മദേശം / ജന്മസ്ഥലം
  rationale: യാക്കോബിന്റെ മടങ്ങിവരവിന്റെ കുടുംബപരമായ ദിശ ഈ തിരഞ്ഞെടുപ്പ് വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലപദത്തിന് സ്വദേശമോ ഉത്ഭവസ്ഥാനമോ സൂചിപ്പിക്കാനും കഴിയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പ്രാർഥനാഭാവത്തിന് യോജിച്ച മാന്യമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമമല്ല, കോമയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. മൂലത്തിൽ ഇല്ലാത്ത അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
