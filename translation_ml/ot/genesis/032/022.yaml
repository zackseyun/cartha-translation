  text: וַ/תַּעֲבֹ֥ר הַ/מִּנְחָ֖ה עַל פָּנָ֑י/ו וְ/ה֛וּא לָ֥ן בַּ/לַּֽיְלָה הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: ml
  text: അങ്ങനെ സമ്മാനം[a] അവനു മുമ്പായി കടന്നുപോയി; എന്നാൽ അവൻതന്നെ ആ രാത്രി പാളയത്തിൽ തങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാഴ്ച.’ എബ്രായപദമായ מִנְחָה സമ്മാനം, കപ്പം, അല്ലെങ്കിൽ വഴിപാട് എന്നിവയെ സൂചിപ്പിക്കാം; ഇവിടെ ഏശാവിനായി യാക്കോബ് മുമ്പേ അയച്ച സമ്മാനമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയയുടെ കഥനരൂപം ഇവിടെ സമ്മാനം യാക്കോബിനെക്കാൾ മുമ്പായി മുന്നോട്ടു നീങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: הַמִּנְחָה
  choice: സമ്മാനം
  rationale: מִנְחָה എന്നതിന് സമ്മാനം, കാഴ്ച, കപ്പം, യാഗവഴിപാട് എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഏശാവിനായി യാക്കോബ് അയച്ച സമ്മാനമാണ് ഉദ്ദേശിക്കുന്നത്; ആരാധനാപരമായ വഴിപാട് അല്ല.
- source_word: עַל־פָּנָיו
  choice: അവനു മുമ്പായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്ന ഈ പ്രയോഗം സന്ദർഭത്തിൽ യാക്കോബിനെക്കാൾ മുന്നിൽ, അവനു മുമ്പായി എന്ന അർഥം നൽകുന്നു.
- source_word: וְהוּא
  choice: എന്നാൽ അവൻതന്നെ
  rationale: പ്രകടമായി ചേർത്തിരിക്കുന്ന സർവനാമം മുന്നോട്ടുപോയ സമ്മാനത്തെയും പിന്നിൽ തങ്ങിയ യാക്കോബിനെയും തമ്മിൽ വേർതിരിച്ചു കാണിക്കുന്നു; ‘അവൻതന്നെ’ ഈ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: לָן
  choice: തങ്ങി
  rationale: לון/לין എന്ന ക്രിയ രാത്രി പാർക്കുക, താമസിക്കുക എന്നതാണ്; ‘ആ രാത്രി’ എന്ന കാലസൂചനയോടൊപ്പം ‘തങ്ങി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രി
  rationale: എബ്രായത്തിലെ സമയസൂചനയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിൽ
  rationale: מַחֲנֶה എന്നത് ആളുകളോ സംഘമോ തങ്ങുന്ന പാളയത്തെ സൂചിപ്പിക്കുന്നു; ‘പാളയം’ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപദമാണ്.
