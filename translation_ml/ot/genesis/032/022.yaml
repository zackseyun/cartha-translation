  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സമ്മാനം മുന്നോട്ടുപോകുന്നതും യാക്കോബ് പിന്നിൽ തങ്ങുന്നതും തമ്മിലുള്ള എബ്രായത്തിലെ വൈരുധ്യവും സർവനാമത്തിലെ ഊന്നലും നിലനിർത്തി.
