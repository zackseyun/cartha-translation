id: GEN.32.7
reference: Genesis 32:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: ml
  text: 'സന്ദേശവാഹകർ യാക്കോബിന്റെ അടുക്കൽ മടങ്ങിവന്ന്[a] പറഞ്ഞു: “ഞങ്ങൾ അങ്ങയുടെ സഹോദരനായ ഏശാവിന്റെ അടുക്കൽ ചെന്നു. അയാളും അങ്ങയെ എതിരേൽക്കാൻ വരുന്നു; നാനൂറു പുരുഷന്മാരും അയാളോടൊപ്പമുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവാണെങ്കിലും, “ദൈവദൂതന്മാർ യാക്കോബിന്റെ അടുക്കൽ മടങ്ങിവന്ന്.” എബ്രായത്തിലെ מַלְאָכִים എന്ന പദത്തിന് “സന്ദേശവാഹകർ” എന്നും “ദൈവദൂതന്മാർ” എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ യാക്കോബ് ഏശാവിന്റെ അടുക്കലേക്ക് അയച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: മടങ്ങിവന്ന്
  rationale: שוב എന്ന ക്രിയയുടെ പൂർത്തിയായ ഭൂതകാല ആഖ്യാനപ്രയോഗം; അയക്കപ്പെട്ടവർ യാക്കോബിന്റെ അടുക്കൽ തിരിച്ചെത്തിയതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמַּלְאָכִים
  choice: സന്ദേശവാഹകർ
  rationale: מַלְאָךְ എന്ന പദത്തിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്നും ‘ദൈവദൂതൻ’ എന്നും അർഥമാകാം. തൊട്ടുമുമ്പ് യാക്കോബ് ഏശാവിന്റെ അടുക്കലേക്ക് അയച്ച മനുഷ്യരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ സമാപകക്രിയയായി നൽകി.
- source_word: בָּאנוּ
  choice: ഞങ്ങൾ ... ചെന്നു
  rationale: בוא എന്ന ക്രിയ സംസാരിക്കുന്നവരുടെ യാത്രയെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്ര മലയാളത്തിൽ ‘ചെന്നു’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: אָחִיךָ אֶל־עֵשָׂו
  choice: അങ്ങയുടെ സഹോദരനായ ഏശാവിന്റെ അടുക്കൽ
  rationale: ‘നിന്റെ സഹോദരൻ’ ആരെന്നു ‘ഏശാവ്’ എന്ന പുനർനിർദ്ദേശം വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘സഹോദരനായ ഏശാവ്’ ഈ appositional ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: അയാളും അങ്ങയെ എതിരേൽക്കാൻ വരുന്നു
  rationale: גם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ ‘അയാളും’ നിലനിർത്തുന്നു; participle ആയ הֹלֵךְ തുടരുന്ന പ്രവൃത്തിയായി ‘വരുന്നു’ എന്നും לִקְרָאתְךָ നിഷ്പക്ഷമായി ‘എതിരേൽക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: നാനൂറു പുരുഷന്മാരും അയാളോടൊപ്പമുണ്ട്
  rationale: אִישׁ ഇവിടെ ഏശാവിനോടൊപ്പം സഞ്ചരിക്കുന്ന പുരുഷസംഘത്തെ സൂചിപ്പിക്കുന്നു. גם-ന്റെ ആശയപരമായ കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ‘-ഉം’ വഴി സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യാക്കോബിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു; ‘എതിരേൽക്കാൻ’ എന്നത് കൂടിക്കാഴ്ചയുടെ ഉദ്ദേശ്യം സൗഹൃദപരമോ ശത്രുതാപരമോ എന്ന് മുൻകൂട്ടി തീരുമാനിക്കാതെ മൂലത്തിലെ സംഘർഷഭരിതമായ നിഷ്പക്ഷത നിലനിർത്തുന്നു.
