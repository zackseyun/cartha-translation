  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: ml
  text: 'അപ്പോൾ നീ പറയണം: “അങ്ങയുടെ ദാസനായ യാക്കോബിൽനിന്നുള്ള ഒരു സമ്മാനമാണ് ഇത്; എന്റെ പ്രഭുവായ ഏശാവിന് അയച്ചതാണ്. ഇതാ, അവനും ഞങ്ങളുടെ പിന്നിലുണ്ട്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അല്ലെങ്കിൽ “അവൻ ഞങ്ങളുടെ പിന്നാലെ വരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: അപ്പോൾ നീ പറയണം
  rationale: തുടർന്നുവരുന്ന യാക്കോബിന്റെ നിർദേശത്തെ സ്വാഭാവികമായ മലയാള ക്രമത്തിലും നിർബന്ധസ്വഭാവത്തിലും അവതരിപ്പിക്കുന്നു.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: അങ്ങയുടെ ദാസനായ യാക്കോബിന്റെ
  rationale: ഏശാവിനോടുള്ള യാക്കോബിന്റെ വിനയപൂർവമായ സ്വയംവിശേഷണം നിലനിർത്തുകയും സന്ദർഭത്തിലെ ഉടമസ്ഥബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִנְחָה
  choice: സമ്മാനം
  rationale: ഇവിടെ ആരാധനാകർമത്തിലെ വഴിപാടല്ല, ഏശാവിനെ അനുനയിപ്പിക്കാൻ അയച്ച സമ്മാനമാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദമാണിത്.
- source_word: שְׁלוּחָה
  choice: അയച്ചതാണ്
  rationale: സമ്മാനം അയയ്ക്കപ്പെട്ടിരിക്കുന്നു എന്ന നിഷ്ക്രിയ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: എന്റെ യജമാനനായ ഏശാവിന്
  rationale: ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ എന്ന അഭിസംബോധനയും ഏശാവിനെ അതിന്റെ വിശദീകരണമായി തിരിച്ചറിയിക്കുന്ന ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുള്ള വിവരത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരസൂചകത്തെ ഗൗരവമുള്ളതും ഇന്നും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: גַּם הוּא
  choice: അവനും
  rationale: സമ്മാനത്തിനു പുറമേ യാക്കോബ് തന്നെയും പിന്നാലെയുണ്ടെന്ന കൂട്ടിച്ചേർക്കൽ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵינוּ
  choice: ഞങ്ങളുടെ പിന്നിലുണ്ട്
  rationale: യാക്കോബ് കൂട്ടങ്ങളുടെ പിന്നിലാണെന്ന സ്ഥാനസൂചന നേരിട്ട് നൽകുന്നു; ‘ഞങ്ങളുടെ പിന്നാലെ വരുന്നു’ എന്ന ചലനാർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. ഏശാവിനോടുള്ള യാക്കോബിന്റെ വിനയഭാവം ‘അങ്ങയുടെ ദാസൻ’, ‘എന്റെ യജമാനൻ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി; മൂലത്തിലെ സ്ഥാനാർഥവും ചലനാർഥവും തമ്മിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
