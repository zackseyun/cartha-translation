  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഏശാവ് ആ പാളയങ്ങളിൽ ഒന്നിലേക്ക് വന്ന് അതിനെ ആക്രമിച്ചാൽ, ശേഷിക്കുന്ന പാളയം രക്ഷപ്പെടും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശേഷിക്കുന്ന പാളയം രക്ഷപ്പെടാനുള്ളതായിരിക്കും”; അതായത്, അത് അതിജീവിക്കുകയോ നാശത്തിൽനിന്ന് രക്ഷപ്പെടുകയോ ചെയ്യും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനരൂപം സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ നൽകി; ബന്ധകമായ וַ സ്വതന്ത്രമായി വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: യാക്കോബിന്റെ ആലോചനയിലെ നിബന്ധനയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: יָבֹא
  choice: വന്ന്
  rationale: בוא എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വരുക’ നിലനിർത്തുന്നു; ശത്രുതാപരമായ പ്രവൃത്തി തുടർന്നുള്ള ക്രിയയിലാണ്.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: ഒരു പാളയത്തിന്റെ നേരെ
  rationale: ഇവിടെ രണ്ടായി വിഭജിച്ച പാളയങ്ങളിൽ ഒന്നിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആക്രമണസന്ദർഭത്തിൽ אֶל സ്വാഭാവികമായി ‘നേരെ’ എന്നു നൽകി.
- source_word: וְהִכָּהוּ
  choice: അതിനെ ആക്രമിച്ചാൽ
  rationale: נכהയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം ഒരു കൂട്ടമായ പാളയത്തെ സംബന്ധിക്കുമ്പോൾ ‘ആക്രമിക്കുക’ എന്നത് സ്വാഭാവികം; പുരുഷ ഏകവചന പ്രത്യയം കൂട്ടവാചിയായ പാളയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: ശേഷിക്കുന്ന പാളയം
  rationale: נשאר സൂചിപ്പിക്കുന്ന ശേഷിക്കൽ ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: לִפְלֵיטָה
  choice: രക്ഷപ്പെടും
  rationale: פְלֵיטָה എന്ന നാമപദപ്രയോഗത്തെ മലയാളത്തിൽ ഫലസൂചകമായ ക്രിയയായി സ്വാഭാവികമാക്കി; രക്ഷപ്പെടൽ/നാശത്തിൽനിന്നുള്ള ശേഷിപ്പ് എന്ന ആശയം നിലനിർത്തുന്നു.
