  text: וַ/יֹּ֕אמֶר אִם יָב֥וֹא עֵשָׂ֛ו אֶל הַ/מַּחֲנֶ֥ה הָ/אַחַ֖ת וְ/הִכָּ֑/הוּ וְ/הָיָ֛ה הַ/מַּחֲנֶ֥ה הַ/נִּשְׁאָ֖ר לִ/פְלֵיטָֽה־־׃
base_translation:
