id: GEN.32.18
reference: Genesis 32:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֥ו אֶת הָ/רִאשׁ֖וֹן לֵ/אמֹ֑ר כִּ֣י יִֽפְגָּשְׁ/ךָ֞ עֵשָׂ֣ו אָחִ֗/י וִ/שְׁאֵֽלְ/ךָ֙ לֵ/אמֹ֔ר לְ/מִי אַ֨תָּה֙ וְ/אָ֣נָה תֵלֵ֔ךְ וּ/לְ/מִ֖י אֵ֥לֶּה לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: ml
  text: 'അവൻ ആദ്യത്തവനോട് ആജ്ഞാപിച്ചു: “എന്റെ സഹോദരനായ ഏശാവ് നിന്നെ കണ്ടുമുട്ടി, ‘നീ ആരുടെ ആളാണ്? എവിടേക്കാണ് പോകുന്നത്? നിന്റെ മുമ്പിലുള്ള ഇവ ആരുടേതാണ്?’ എന്നു ചോദിച്ചാൽ...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: മുമ്പിൽ പോയവൻ
  rationale: സന്ദർഭത്തിൽ കൂട്ടങ്ങളിൽ ആദ്യം പോകുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഒന്നാമൻ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְמִי אַתָּה
  choice: നീ ആരുടെ ആളാണ്?
  rationale: അക്ഷരാർഥം ‘നീ ആരുടേതാണ്?’ എന്നാണെങ്കിലും, ദാസന്റെ യജമാനൻ ആരെന്ന് ചോദിക്കുന്ന ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി അതേ ബന്ധം നിലനിർത്തുന്നു.
- source_word: וְאָנָה תֵלֵךְ
  choice: എവിടേക്കാണ് പോകുന്നത്?
  rationale: ദിശയെയും ലക്ഷ്യസ്ഥാനത്തെയും ചോദിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിലുള്ള ഇവ ആരുടേതാണ്?
  rationale: മുമ്പോട്ടു നയിക്കപ്പെടുന്ന മൃഗക്കൂട്ടങ്ങളുടെ ഉടമസ്ഥതയെക്കുറിച്ചുള്ള ചോദ്യം; ഹീബ്രുവിലെ ഉടമസ്ഥതാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וִשְׁאֵלְךָ לֵאמֹר
  choice: എന്നു ചോദിച്ചാൽ
  rationale: ‘ചോദിച്ച് ഇപ്രകാരം പറഞ്ഞാൽ’ എന്ന ഹീബ്രു ഉദ്ധരണി-സൂത്രം ആധുനിക മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുമെന്നതിനാൽ അവസാനം മൂന്നു പുള്ളി നിലനിർത്തി.
