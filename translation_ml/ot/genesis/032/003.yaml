  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: ml
  text: യാക്കോബ് അവരെ കണ്ടപ്പോൾ, “ഇത് ദൈവത്തിന്റെ പാളയമാണ്” എന്നു പറഞ്ഞു. അങ്ങനെ അവൻ ആ സ്ഥലത്തിന് മഹനയീം[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മഹനയീം” എന്ന പേര് “രണ്ടു പാളയങ്ങൾ” അഥവാ “ഇരട്ട പാളയം” എന്നതുപോലെ കേൾക്കുന്നു; “ഇത് ദൈവത്തിന്റെ പാളയമാണ്” എന്ന യാക്കോബിന്റെ വാക്കുകളുമായി ഇതിന് പദപ്രയോഗബന്ധമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നു പറഞ്ഞു
  rationale: אָמַר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ആരോടാണ് പറഞ്ഞതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കി.
- source_word: כַּאֲשֶׁר רָאָם
  choice: അവരെ കണ്ടപ്പോൾ
  rationale: כַּאֲשֶׁר ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; רָאָם എന്നതിലെ മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം മുൻവാക്യത്തിലെ ദൈവദൂതന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: ദൈവത്തിന്റെ പാളയം
  rationale: Construct ബന്ധത്തെ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകി; מַחֲנֶה എന്നതിലെ ‘പാളയം’ എന്ന അർഥവും സ്ഥലനാമത്തോടുള്ള പദപ്രയോഗബന്ധവും നിലനിർത്തുന്നു.
- source_word: זֶה
  choice: ഇത്
  rationale: പ്രഖ്യാപനത്തിലെ നിർദ്ദേശകസർവനാമം; മലയാളത്തിൽ ‘ആണ്’ ചേർത്ത് വിധേയപ്രയോഗം സ്വാഭാവികമാക്കി.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: അതുകൊണ്ട് അവൻ ആ സ്ഥലത്തിന് … എന്നു പേരിട്ടു
  rationale: ‘പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സംഭവഫലബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַחֲנָיִם
  choice: മഹനയീം
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അതിന്റെ ദ്വിവചനസാദ്ധ്യതയും പദപ്രയോഗവും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
