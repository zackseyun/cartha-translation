    issue: ‘അതുകൊണ്ട്’ adds a potentially stronger causal sense.
    rationale: The waw preceding ‘he called’ advances the narrative and may imply consequence in context, but it does not require the explicit inferential force commonly conveyed by ‘അതുകൊണ്ട്.’ ‘അങ്ങനെ’ preserves the sequence without over-specifying the relation.
  - severity: low
    issue: Footnote wording ‘ഇരട്ടപ്പാളയം’ is stylistically awkward.
    rationale: Writing it as ‘ഇരട്ട പാളയം’ is more natural modern Malayalam while retaining the stated lexical association.
