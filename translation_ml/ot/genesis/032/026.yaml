source:
  edition: WLC
  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: ml
  text: തനിക്ക് അവനെ ജയിക്കാനാകുന്നില്ലെന്നു കണ്ടപ്പോൾ[a], അവൻ അവന്റെ തുടയുടെ സന്ധിക്കുഴിയിൽ[b][c] തൊട്ടു; അവനോടു മല്ലിടുന്നതിനിടെ യാക്കോബിന്റെ തുടയുടെ സന്ധി തെറ്റിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തനിക്ക് അവനെ കീഴടക്കാനാകുന്നില്ലെന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായം അക്ഷരാർഥത്തിൽ ‘അവന്റെ തുടയുടെ കുഴി/സന്ധിക്കുഴി’; പരമ്പരാഗതമായി ‘അവന്റെ തുടയുടെ കുഴി.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിലെ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് അവ്യക്തമായി തുടരുന്നു; യാക്കോബിന്റെ എതിരാളി ആരാണെന്ന് ഈ വാക്യം വീണ്ടും വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സന്ദർഭത്തിലെ കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יָכֹל לוֹ
  choice: തനിക്ക് അവനെ ജയിക്കാനാകുന്നില്ല
  rationale: יכל + ל എതിരാളിക്കുമേൽ മേൽക്കൈ നേടാനുള്ള കഴിയില്ലായ്മ സൂചിപ്പിക്കുന്നു. മല്ലിടൽസന്ദർഭത്തിൽ ‘ജയിക്കുക’ സ്വാഭാവികമാണ്; സമ്പൂർണ ശക്തിയില്ലായ്മ എന്ന അതിരുകടന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: וַיִּגַּע
  choice: തൊട്ടു
  rationale: נגע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘തൊടുക’ നിലനിർത്തുന്നു; ഫലം ശക്തമായിരുന്നാലും മൂലപാഠം പ്രഹരിക്കുക എന്നു പറയുന്നില്ല.
- source_word: בְּכַף יְרֵכוֹ
  choice: അവന്റെ തുടയെല്ലിന്റെ സന്ധിക്കുഴിയിൽ
  rationale: כף + ירך ഇവിടെ തുടയെല്ല് ചേരുന്ന കുഴിഞ്ഞ സന്ധിപ്രദേശം സൂചിപ്പിക്കുന്നു. ‘സന്ധിക്കുഴി’ ആ ശരീരഘടനയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַתֵּקַע
  choice: സന്ധി തെറ്റിപ്പോയി
  rationale: ഈ സന്ദർഭത്തിൽ സന്ധി സ്ഥാനത്തുനിന്നു മാറിയ ഫലമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: യാക്കോബിന്റെ തുടയെല്ലിന്റെ സന്ധി
  rationale: യാക്കോബിന്റെ പേര് മൂലപാഠംപോലെ വ്യക്തമായി നൽകുകയും മുമ്പത്തെ ശരീരഭാഗവിവരണവുമായി പദസമന്വയം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: അവനോടു മല്ലിടുന്നതിനിടെ
  rationale: മുൻപ്രത്യയത്തോടുകൂടിയ infinitive construct സമകാലികമായ പ്രവൃത്തി സൂചിപ്പിക്കുന്നു; സർവനാമത്തിന്റെ അവ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മല്ലിടുന്ന രംഗത്തിലെ ‘അവൻ/അവനെ’ എന്നീ സർവനാമങ്ങളുടെ സൂചിതർ
  choice: എതിരാളിയെ ഈ വാക്യത്തിൽ പേരിട്ടു തിരിച്ചറിയാതെ എബ്രായപാഠത്തിലെ സർവനാമപരമായ അവ്യക്തത നിലനിർത്തി.
  alternative: വിഷയത്തെ മനുഷ്യൻ, ദൂതൻ, അല്ലെങ്കിൽ ദൈവിക വ്യക്തി എന്നു ഈ വാക്യത്തിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: ഉടനെയുള്ള എബ്രായപാഠം വിഷയത്തിന്റെ തിരിച്ചറിയൽ വീണ്ടും പ്രസ്താവിക്കുന്നില്ല. തുടർന്നുള്ള ഭാഗം ആ വ്യക്തിയുടെ പ്രാധാന്യം ക്രമേണ വെളിപ്പെടുത്തുന്നതിനാൽ പരിഭാഷ മൂലപാഠത്തേക്കാൾ കൂടുതൽ തീർപ്പുകൽപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തൊട്ടു’ എന്ന ലഘുവായ ക്രിയയും അതിന്റെ ശക്തമായ ഫലവും തമ്മിലുള്ള മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തി. സർവനാമങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ അല്പം സങ്കീർണമെങ്കിലും ഉദ്ദേശ്യപൂർവം സൂക്ഷിച്ചു; എതിരാളിയുടെ തിരിച്ചറിയൽ അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
