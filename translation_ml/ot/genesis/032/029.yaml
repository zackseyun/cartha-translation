id: GEN.32.29
reference: Genesis 32:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇനി നിന്റെ പേര് യാക്കോബ് എന്നല്ല, ഇസ്രായേൽ എന്നു വിളിക്കപ്പെടും; കാരണം നീ ദൈവത്തോടും[a] മനുഷ്യരോടും[b] പൊരുതി ജയിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദിവ്യജീവിയോടും’ അല്ലെങ്കിൽ ‘ദിവ്യജീവികളോടും’; אֱלֹהִים എന്ന ഹീബ്രു പദം സന്ദർഭമനുസരിച്ച് ദൈവം, ദേവന്മാർ, ദിവ്യജീവികൾ എന്നിവയെ സൂചിപ്പിക്കാം. കഥാസന്ദർഭം പരിഗണിച്ച് പ്രധാനവാചകത്തിൽ ‘ദൈവം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘ആളുകളോടും’ അല്ലെങ്കിൽ ‘പുരുഷന്മാരോടും’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: വിളിക്കപ്പെടും
  rationale: പേരിടൽ പ്രഖ്യാപനത്തിലെ אמר എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വിളിക്കപ്പെടും’ എന്നു നൽകാം.
- source_word: עוֹד
  choice: ഇനി ... എന്നല്ല
  rationale: പഴയ പേര് തുടർന്നുപയോഗിക്കപ്പെടുകയില്ലെന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי אִם
  choice: എന്നല്ല, ... എന്നു
  rationale: പഴയ പേരിനും പുതിയ പേരിനും ഇടയിലുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാള പേരിടൽശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്ഥിരപ്രയോഗമനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു; പേരിലെ ശബ്ദവിനോദം തുടർന്നുള്ള കാരണവാക്യം സൂചിപ്പിക്കുന്നു.
- source_word: שָׂרִיתָ
  choice: പൊരുതി
  rationale: ഈ ക്രിയയിലെ മല്ലിടൽ, പോരാട്ടം, എതിർത്ത് നിലകൊള്ളൽ എന്നീ അർത്ഥവ്യാപ്തികൾ ഉൾക്കൊള്ളുന്ന ലളിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: കഥാസന്ദർഭത്തിൽ ഏകവചന ദൈവമാണ് മുഖ്യസൂചന; എങ്കിലും ഹീബ്രു പദത്തിന്റെ വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים
  choice: മനുഷ്യർ
  rationale: ദൈവത്തോടുള്ള വൈരുധ്യത്തിൽ മനുഷ്യരെയാകെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ഹീബ്രു ബഹുവചനത്തിന്റെ അർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: וַתּוּכָל
  choice: ജയിച്ചിരിക്കുന്നു
  rationale: יכל ഇവിടെ പോരാട്ടത്തിൽ വിജയകരമായി നിലനിന്നതിനെ സൂചിപ്പിക്കുന്നു; സമ്പൂർണമായി കീഴടക്കി എന്ന അതിശയോക്തി ഒഴിവാക്കി വിജയത്തിന്റെ ആശയം നൽകുന്നു.
theological_decisions:
- issue: പേരിടൽ വിശദീകരണത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതൻ
  choice: ദൈവം
  alternative: ദിവ്യജീവി / ദിവ്യജീവികൾ
  rationale: സമീപകഥാസന്ദർഭം ഈ നിഗൂഢമായ മല്ലിടലിനെ ദൈവവുമായുള്ള സാക്ഷാത്കാരമായി അവതരിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ ‘ദൈവം’ എന്നു നൽകുന്നത് ആ ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നു; രൂപത്തിന്റെ നിഗൂഢത പരിഹരിക്കാതെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: אֲנָשִׁים എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യർ
  alternative: ആളുകൾ / പുരുഷന്മാർ
  rationale: ഇവിടെ ദൈവവും മനുഷ്യരും തമ്മിലുള്ള വാചകവൈരുധ്യമാണ് മുഖ്യം. ‘മനുഷ്യർ’ ആ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഹീബ്രു രൂപം ചില സന്ദർഭങ്ങളിൽ ‘പുരുഷന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രഖ്യാപനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ പേരുമാറ്റത്തിന്റെ ഔപചാരികതയും ‘പൊരുതി ജയിച്ചു’ എന്ന കാരണബന്ധവും നിലനിർത്തി; നിഗൂഢമായ ദൈവസാക്ഷാത്കാരത്തെ അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
