reference: Genesis 32:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: ml
  text: ലാബാൻ അതിരാവിലെ എഴുന്നേറ്റ് തന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും[a] ചുംബിക്കുകയും അവരെ അനുഗ്രഹിക്കുകയും ചെയ്തു. പിന്നെ ലാബാൻ പുറപ്പെട്ട് തന്റെ സ്ഥലത്തേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “അവന്റെ പുത്രന്മാരും പുത്രിമാരും” എന്നാണ്; ഇവിടെ ഇവ ലാബാന്റെ സന്തതികളെ, അതായത് കൊച്ചുമക്കളെ, സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന അർഥം നൽകുന്നു; בַּבֹּקֶר ചേർന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിരാവിലെ എഴുന്നേറ്റ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיְנַשֵּׁק
  choice: ചുംബിക്കുകയും
  rationale: കുടുംബാംഗങ്ങളോടുള്ള യാത്രപറച്ചിലിന്റെ ചുംബനമാണ് സന്ദർഭം; ‘ചുംബിക്കുക’ മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: തന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായപാഠത്തിലെ ലിംഗനിർദിഷ്ട ബന്ധപദങ്ങൾ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അവ സന്തതികളെയോ കൊച്ചുമക്കളെയോ ഉൾക്കൊള്ളാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: അവരെ അനുഗ്രഹിക്കുകയും ചെയ്തു
  rationale: ברך എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു; യാത്രപറച്ചിൽ മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַיֵּלֶךְ
  choice: അവിടെനിന്നു പുറപ്പെട്ട്
  rationale: തുടർന്നുള്ള ‘മടങ്ങി’ എന്ന ക്രിയയോടു ചേർന്ന് യാത്രയുടെ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പുറപ്പെട്ടു’ എന്നു നൽകി; ‘അവിടെനിന്നു’ സന്ദർഭസൂചന മാത്രമാണ്.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: സ്വസ്ഥലത്തേക്കു മടങ്ങി
  rationale: שׁוב എന്നതിന്റെ ‘മടങ്ങുക’ എന്ന അർഥവും מקום എന്നതിന്റെ ‘സ്ഥലം’ എന്ന പൊതുവായ അർഥവും നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വീട്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ലിംഗനിർദിഷ്ട ബന്ധപദങ്ങൾ
  choice: തന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും
  alternative: തന്റെ മക്കളെ / തന്റെ കൊച്ചുമക്കളെ
  rationale: മൂലപാഠം ആൺ-പെൺ ബന്ധപദങ്ങൾ പ്രത്യേകം ഉപയോഗിക്കുന്നതിനാൽ അവയെ പൊതുവായ ‘മക്കൾ’ എന്നാക്കി സമതലപ്പെടുത്തുന്നില്ല. എന്നാൽ ഇവ സന്തതികളെ സൂചിപ്പിക്കാമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രന്മാർ/പുത്രിമാർ’ എന്നത് ബന്ധപദങ്ങളിലെ ഉറവിടവ്യത്യാസം നിലനിർത്തുന്നു; ‘സ്വസ്ഥലം’ എന്നത് ‘വീട്’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
