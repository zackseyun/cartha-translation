reference: Genesis 32:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: ml
  text: 'അവൻ അവരോട് കൽപിച്ചു: “നിങ്ങൾ എന്റെ യജമാനനായ ഏശാവിനോട് ഇങ്ങനെ പറയണം: ‘അങ്ങയുടെ ദാസനായ യാക്കോബ്[b] ഇപ്രകാരം പറയുന്നു: ഞാൻ ലാബാനോടുകൂടെ പരദേശിയായി പാർത്തു[a]; ഇതുവരെ അവിടെ താമസിച്ചിരിക്കുന്നു[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലാബാനോടുകൂടെ ഒരു പരദേശിയായി ജീവിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് അന്യദേശക്കാരനായി വസിക്കുക എന്ന അർഥസൂക്ഷ്മതയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “അങ്ങയുടെ ദാസൻ” എന്നത് ഏശാവിനോടുള്ള വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്; യാക്കോബ് അക്ഷരാർഥത്തിൽ ഏശാവിന്റെ അടിമയായിരുന്നു എന്ന് ഇത് നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: cultural_note
  - marker: c
    text: “ഇതുവരെ വൈകി” എന്നും വിവർത്തനം ചെയ്യാം. എന്നാൽ സന്ദർഭത്തിൽ യാക്കോബ് ഇപ്പോഴോളം ലാബാന്റെ അടുക്കൽ താമസിച്ചു/തുടർന്നു എന്ന അർഥമാണ് മുൻപന്തിയിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി നിലനിർത്തുന്നു; ‘നിർദേശിച്ചു’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: כֹּה תֹאמְרוּן
  choice: ഇങ്ങനെ പറയണം
  rationale: ദൂതന്മാർ കൃത്യമായി അറിയിക്കേണ്ട സന്ദേശം അവതരിപ്പിക്കുന്ന സൂത്രവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: എന്റെ യജമാനനായ ഏശാവിനോടു
  rationale: ഇവിടെ אֲדֹנִי ദൈവിക സംബോധനയല്ല, ഏശാവിനോടുള്ള ആദരസൂചകമായ സാമൂഹിക അഭിസംബോധനയാണ്.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ
  rationale: അടിമത്തം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, നയതന്ത്രപരമായ വിനയസ്വയംവിശേഷണം പ്രകടമാക്കുന്നു.
- source_word: גַּרְתִּי
  choice: പരദേശിയായി പാർത്തു
  rationale: גור എന്ന ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന, സ്വന്തദേശത്തിനു പുറത്തുള്ള ഒരാളായി വസിക്കുക എന്ന സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: וָאֵחַר עַד עָתָּה
  choice: ഇപ്പോൾവരെ അവിടെ താമസിച്ചു
  rationale: ഇപ്പോഴോളം അവിടെ തുടർന്നുകഴിഞ്ഞു എന്ന സന്ദർഭോചിതമായ ദീർഘകാല അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘വൈകി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദാസൻ’ എന്ന സ്വയംവിശേഷണത്തിന്റെ സ്വഭാവം
  choice: ഏശാവിനോടുള്ള വിനയപൂർവമായ ആദരപ്രയോഗമായി വിവർത്തനം ചെയ്തു
  alternative: അക്ഷരാർഥത്തിലുള്ള അടിമസ്ഥിതി സൂചിപ്പിക്കുന്നതായി വായിക്കുക
  rationale: ഈ ദൂതസന്ദേശത്തിന്റെ നയതന്ത്രപരമായ പശ്ചാത്തലം വിനയപ്രയോഗത്തെയാണ് മുൻനിർത്തുന്നത്; എങ്കിലും עבד എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായ ദൂതസൂത്രവാക്യത്തിന്റെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും ഉദ്ധരണിഘടന കോളൺ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ ക്രമപ്പെടുത്തി. ‘അങ്ങയുടെ’ ആദരപ്രയോഗം ഏശാവിനോടുള്ള യാക്കോബിന്റെ വിനയം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
