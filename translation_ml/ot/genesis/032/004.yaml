  text: וַ/יִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְ/פָנָ֔י/ו אֶל עֵשָׂ֖ו אָחִ֑י/ו אַ֥רְצָ/ה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: ml
  text: യാക്കോബ് തനിക്കു മുമ്പായി സന്ദേശവാഹകരെ തന്റെ സഹോദരനായ ഏശാവിന്റെ അടുക്കലേക്ക്, സേയീർദേശമായ ഏദോംപ്രദേശത്തേക്ക്[a], അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഏദോമിന്റെ വയൽ’; ഇവിടെ ഇത് ഏദോമിന്റെ നാട് അഥവാ ഭൂപ്രദേശം എന്ന അർഥത്തിലുള്ള പ്രാദേശിക വിശേഷണമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനഭൂതകാല അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַלְאָכִים
  choice: സന്ദേശവാഹകരെ
  rationale: ഈ സന്ദർഭത്തിൽ യാക്കോബ് ഏശാവിന്റെ അടുക്കലേക്ക് അയച്ചത് മനുഷ്യപ്രതിനിധികളെയാണ്; ‘ദൂതന്മാർ’ എന്നതിലുള്ള മാലാഖമാർ എന്ന സാധ്യതയുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: לְפָנָיו
  choice: തനിക്കു മുമ്പായി
  rationale: യാക്കോബ് എത്തുന്നതിനു മുമ്പേ അവരെ മുന്നോട്ടയച്ചു എന്ന സ്ഥലകാലസൂചന നിലനിർത്തുന്നു.
- source_word: עֵשָׂו אָחִיו
  choice: തന്റെ സഹോദരനായ ഏശാവ്
  rationale: പേരും സഹോദരബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַרְצָה שֵׂעִיר
  choice: സേയീർദേശത്തേക്ക്
  rationale: ദിശാസൂചക പ്രത്യയം ഉൾപ്പെടെ ‘സേയീർദേശം ലക്ഷ്യമാക്കി’ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שְׂדֵה אֱדֹם
  choice: ഏദോംപ്രദേശത്തേക്ക്
  rationale: അക്ഷരാർഥം ‘ഏദോമിന്റെ വയൽ’ എന്നാണെങ്കിലും ഇവിടെ അത് ഒരു പ്രാദേശിക ഭൂപേരായി പ്രവർത്തിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രദേശം’ എന്നു വിവർത്തനം ചെയ്യുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
