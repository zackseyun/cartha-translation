source:
  edition: WLC
  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് അവനോട് ചോദിച്ചു: “ദയവായി, നിന്റെ പേര് എന്നോടു പറയൂ.” എന്നാൽ അവൻ പറഞ്ഞു: “നീ എന്റെ പേര് ചോദിക്കുന്നത് എന്തിന്?” അവിടെവെച്ച് അവൻ യാക്കോബിനെ അനുഗ്രഹിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: അപ്പോൾ യാക്കോബ് അവനോട് ചോദിച്ചു
  rationale: എബ്രായത്തിലെ ‘ചോദിച്ചു, പറഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചോദിച്ചു’ എന്നു ചുരുക്കി; സംഭാഷണസന്ദർഭം ‘പറഞ്ഞു’ എന്ന ആശയവും വ്യക്തമാക്കുന്നു. പരോക്ഷ കർമമായ ‘അവനോട്’ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി ചേർത്തു.
- source_word: הַגִּידָה נָּא
  choice: ദയവായി ... എന്നോടു പറയണമേ
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ‘അറിയിക്കുക/പറയുക’ എന്നർത്ഥം നൽകുന്നു; נָא അപേക്ഷയുടെ വിനയഭാവം സൂചിപ്പിക്കുന്നു. ‘ദയവായി ... പറയണമേ’ അത് മാന്യവും സ്വാഭാവികവുമായി പകർന്നു നൽകുന്നു.
- source_word: שְׁמֶךָ
  choice: അങ്ങയുടെ പേര്
  rationale: ‘നിന്റെ പേര്’ എന്നതാണ് നേരിട്ടുള്ള അർത്ഥം. യാക്കോബിന്റെ വിനയപൂർവമായ അപേക്ഷയ്ക്ക് യോജിക്കുന്ന ആധുനിക ആദരസൂചക ഏകവചനമായി ‘അങ്ങയുടെ’ തിരഞ്ഞെടുത്തു; ദൈവിക തിരിച്ചറിയൽ വാചകത്തിൽ മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: നീ എന്റെ പേര് ചോദിക്കുന്നത് എന്തിന്?
  rationale: לָמָּה זֶּה എന്ന ഊന്നലുള്ള ചോദ്യപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ‘... എന്തിന്?’ എന്ന രൂപത്തിൽ നൽകി. ‘എന്റെ പേര് ചോദിക്കുക’ എന്ന വാചകഘടന മൂലപാഠത്തിന്റെ ശ്രദ്ധാകേന്ദ്രം നിലനിർത്തുന്നു.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: അവിടെവെച്ച് അവൻ യാക്കോബിനെ അനുഗ്രഹിച്ചു
  rationale: ‘അവിടെവെച്ച്’ שָׁם എന്ന സ്ഥലസൂചനയുടെ കഥാപരമായ ഊന്നൽ നിലനിർത്തുന്നു. ഒട്ടേറെ പുരുഷലിംഗ സർവനാമങ്ങൾ ഉണ്ടാക്കാവുന്ന മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ കർമത്തെ ‘യാക്കോബിനെ’ എന്നു വ്യക്തമാക്കി; അനുഗ്രഹിച്ചവന്റെ തിരിച്ചറിയൽ ‘അവൻ’ എന്നുതന്നെ അവ്യക്തമായി സൂക്ഷിച്ചു.
theological_decisions:
- issue: പേര് വെളിപ്പെടുത്താൻ വിസമ്മതിക്കുകയും യാക്കോബിനെ അനുഗ്രഹിക്കുകയും ചെയ്യുന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: വിഷയത്തെ ‘അവൻ’ എന്ന സർവനാമത്തിൽ നിലനിർത്തുക
  alternative: ‘ആ മനുഷ്യൻ’, ‘ദൈവം’, അല്ലെങ്കിൽ ‘ദൂതൻ’ എന്നു വ്യക്തമാക്കുക
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം കർത്താവിനെ പേരിട്ട് തിരിച്ചറിയിക്കുന്നില്ല. വിപുലമായ സന്ദർഭം വിവിധ തിരിച്ചറിയലുകൾക്ക് ഇട നൽകുന്നുവെങ്കിലും, വാക്യം തുറന്നുവെക്കുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
- issue: യാക്കോബ് സംസാരിക്കുന്ന വ്യക്തിയെ അഭിസംബോധന ചെയ്യുന്ന ആദരനില
  choice: ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക ഏകവചനം ഉപയോഗിക്കുക
  alternative: ‘നിന്റെ’ എന്ന പരിചിത ഏകവചനം ഉപയോഗിക്കുക
  rationale: נָא സൂചിപ്പിക്കുന്ന വിനയപൂർവമായ അപേക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ഇത് ആ വ്യക്തിയെ ദൈവമെന്നോ ദൂതനെന്നോ നിർണ്ണയിക്കുന്നില്ല; സംഭാഷണത്തിന്റെ മാന്യഭാവം മാത്രമാണ് നൽകുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായത്തിലെ ആവർത്തകമായ ‘ചോദിച്ചു, പറഞ്ഞു’ എന്ന സൂത്രപ്രയോഗം സ്വാഭാവിക മലയാളത്തിനായി ചുരുക്കി. വാക്യത്തിലെ തിരിച്ചറിയൽ-അവ്യക്തത നിലനിർത്തിയെങ്കിലും, അവസാനത്തെ ‘അവനെ’ ആരെയാണ് സൂചിപ്പിക്കുന്നത് എന്ന മലയാളത്തിലെ അനാവശ്യ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യാക്കോബിനെ’ എന്നു വ്യക്തമാക്കി. പാഠത്തിൽ അടിക്കുറിപ്പ് മാർക്കറുകളൊന്നുമില്ല; അതിനാൽ അടിക്കുറിപ്പുകളും നൽകിയിട്ടില്ല.
