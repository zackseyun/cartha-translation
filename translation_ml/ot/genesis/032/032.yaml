translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. ‘മുടന്തിനടക്കുകയായിരുന്നു’ തുടർന്നുകൊണ്ടിരുന്ന ശാരീരികാവസ്ഥ വ്യക്തമാക്കുന്നു. സ്ഥലനാമത്തിന്റെ ഈ വാക്യത്തിലെ പ്രത്യേക എബ്രായരൂപവും עַל יְרֵכוֹ എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
