source:
  edition: WLC
  text: וַ/יִּֽזְרַֽח ל֣/וֹ הַ/שֶּׁ֔מֶשׁ כַּ/אֲשֶׁ֥ר עָבַ֖ר אֶת פְּנוּאֵ֑ל וְ/ה֥וּא צֹלֵ֖עַ עַל יְרֵכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: ml
  text: അവൻ പെനൂവേൽ[a] കടന്നുപോകുമ്പോൾ സൂര്യൻ അവന്റെമേൽ ഉദിച്ചു; അവൻ തന്റെ തുട നിമിത്തം മുടന്തിനടക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിൽ എബ്രായപാഠം സ്ഥലനാമം “പെനൂവേൽ” എന്നാണ് എഴുതുന്നത്; മറ്റിടങ്ങളിൽ “പെനിയേൽ” എന്ന രൂപവും കാണപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “തന്റെ തുടമേൽ.” ഇവിടെ അതിന്റെ അർഥം തുടയ്ക്കേറ്റ പരിക്ക് കാരണം അവൻ മുടന്തിനടന്നു എന്നാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അവന്റെമേൽ ഉദിച്ചു
  rationale: זרח എന്ന ക്രിയയ്ക്ക് സൂര്യൻ കർത്താവായതിനാൽ ‘ഉദിച്ചു’ സ്വാഭാവികമാണ്; לוֹ എന്നത് ദൃശ്യകോണിനെ നിലനിർത്താൻ ‘അവന്റെമേൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר עָבַר
  choice: കടന്നുപോകുമ്പോൾ
  rationale: כַּאֲשֶׁר ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; עבר സ്ഥലത്തെ കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ചേർന്ന മലയാളപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: אֶת פְּנוּאֵל
  choice: പെനൂവേൽ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് രൂപം פְּנוּאֵל ആയതിനാൽ അതിനെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; മറ്റിടത്തെ പെനിയേൽ എന്ന രൂപവുമായി ഒത്താക്കിച്ചേർത്തില്ല.
- source_word: וְהוּא צֹלֵעַ
  choice: അവൻ … മുടന്തിനടക്കുകയായിരുന്നു
  rationale: ക്രിയാവിശേഷണരൂപം തുടരുന്ന അവസ്ഥയെയോ പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്നു; ‘മുടന്തിനടക്കുകയായിരുന്നു’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַל יְרֵכוֹ
  choice: തന്റെ തുട കാരണം
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ തുടമേൽ’ എന്നാകാമെങ്കിലും മലയാളത്തിൽ അത് അവ്യക്തവും അസ്വാഭാവികവുമാണ്. עַל എന്നതിന്റെ കാരണാർഥസാധ്യതയും സന്ദർഭവും പരിഗണിച്ച് ‘തുട കാരണം’ എന്നു നൽകി; ‘തുട’ എന്ന പദം നിലനിർത്തി മുൻവാക്യത്തിലെ കൂടുതൽ നിർദിഷ്ടമായ ശരീരഘടന ഇവിടെ ഇറക്കുമതി ചെയ്തില്ല.
