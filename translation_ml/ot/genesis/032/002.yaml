base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ വഴിക്കു പോയി; ദൈവത്തിന്റെ ദൂതന്മാർ അവനെ കണ്ടുമുട്ടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കണ്ടുമുട്ടി’ എന്നതിന് ‘അവനെ നേരിട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: യാക്കോബ്
  rationale: וְ എന്ന ആഖ്യാനബന്ധകത്തെ പ്രത്യേകമായി ‘പിന്നെ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ശക്തിപ്പെടുത്താതെ, മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യക്രമത്തിലും അർധവിരാമബന്ധത്തിലും ഉൾക്കൊള്ളുന്നു.
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: തന്റെ വഴിക്കു പോയി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തന്റെ വഴിയിലേക്ക് പോയി’ എന്നതിനെക്കാൾ, യാത്ര തുടർന്നുവെന്ന ആശയം സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: അവനെ കണ്ടുമുട്ടി
  rationale: פגע + ב എന്ന പ്രയോഗത്തിന് ‘കണ്ടുമുട്ടുക/നേരിടുക’ എന്ന അർഥമുണ്ട്. സന്ദർഭം ആവശ്യപ്പെടാത്ത ശത്രുതയോ യാദൃച്ഛികതയോ ചേർക്കാതെ ‘കണ്ടുമുട്ടി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതന്മാർ
  rationale: מַלְאָךְ എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ദൂതൻ’ ആണ്; ഇവിടെ അടുത്ത വാക്യത്തിലെ ‘ദൈവത്തിന്റെ പാളയം’ എന്ന പരാമർശം സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൈവത്തിന്റെ’ എന്ന ഘടന എബ്രായ സംയുക്തപദബന്ധം തെളിമയോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים എന്നതിന്റെ സൂചിതർ
  choice: ദൈവത്തിന്റെ സ്വർഗീയ ദൂതന്മാർ എന്ന അർഥത്തിൽ ‘ദൈവത്തിന്റെ ദൂതന്മാർ’
  alternative: ദൈവം അയച്ച മനുഷ്യസന്ദേശവാഹകർ
  rationale: מַלְאָךְ മനുഷ്യദൂതനെയും സ്വർഗീയ ദൂതനെയും സൂചിപ്പിക്കാം. എന്നാൽ അടുത്ത വാക്യത്തിൽ യാക്കോബ് ആ സ്ഥലത്തെ ‘ദൈവത്തിന്റെ പാളയം’ എന്നു വിളിക്കുന്നതിനാൽ ഇവിടെ സ്വർഗീയ ദൂതന്മാരാണ് ശക്തമായ സന്ദർഭസൂചന.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവദൂതന്മാർ’ എന്ന ഒറ്റപ്പദത്തിനു പകരം ‘ദൈവത്തിന്റെ ദൂതന്മാർ’ എന്നു നൽകി എബ്രായത്തിലെ construct ബന്ധം സുതാര്യമാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
