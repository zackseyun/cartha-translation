  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: ml
  text: അങ്ങ് അടിയനോടു കാണിച്ച സകല അചഞ്ചല സ്നേഹത്തിനും സകല വിശ്വസ്തതയ്ക്കും ഞാൻ അർഹനല്ല[a]. എന്റെ വടിയുമായി ഞാൻ ഈ യോർദ്ദാൻ കടന്നുപോയി; ഇപ്പോഴോ ഞാൻ രണ്ടു പാളയങ്ങളായിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “സകല അചഞ്ചല സ്നേഹത്തെയും സകല വിശ്വസ്തതയെയും അപേക്ഷിച്ച് ഞാൻ ചെറുതാണ്.” ദൈവം നൽകിയ നന്മകൾക്കുമുമ്പിലുള്ള വിനയത്തെയാണ് ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: ഞാൻ അർഹനല്ല
  rationale: പദശഃ ‘ഞാൻ ചെറുതായിരിക്കുന്നു’ എന്നാണെങ്കിലും, ദൈവത്തിന്റെ ഉദാരമായ നന്മകളുടെ മുമ്പിലുള്ള വിനയവും താൻ അവയ്ക്ക് അർഹനല്ലെന്ന ബോധവുമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַחֲסָדִים
  choice: സകല അചഞ്ചലസ്നേഹം
  rationale: חסד ദൈവത്തിന്റെ ഉറച്ചതും വിശ്വസ്തവുമായ സ്നേഹദയയെ സൂചിപ്പിക്കുന്നു. ബഹുവചനം പല പ്രകടനങ്ങളെയും ഉൾക്കൊള്ളുന്നുവെങ്കിലും, כֹּל-നോടുകൂടിയ ഈ പ്രയോഗത്തിൽ മലയാളത്തിൽ സമാഹാര ഏകവചനം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: הָאֱמֶת
  choice: സകല വിശ്വസ്തത
  rationale: חסד-നോടു ചേർന്നുവരുമ്പോൾ אמת അമൂർത്തമായ ‘സത്യം’ എന്നതിലുപരി ബന്ധപരമായ വിശ്വാസ്യതയെയും വാക്കുപാലിക്കലിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: അങ്ങ് അടിയനോടു കാണിച്ച
  rationale: പദശഃ ‘അടിയനോടു ചെയ്ത’ എന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. സ്നേഹവും വിശ്വസ്തതയും ഒരാളോടു ‘കാണിക്കുക’ എന്നത് അർത്ഥം സ്വാഭാവികമായി പകരുന്നു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: בְמַקְלִי
  choice: എന്റെ വടിയുമായി
  rationale: ‘എന്റെ വടിയോടുകൂടെ’ എന്ന അടിസ്ഥാന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു. ‘വടി മാത്രം കൈയിൽ’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ‘മാത്രം’ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: ഞാൻ ഈ യോർദ്ദാൻ കടന്നുപോയി
  rationale: הַזֶּה എന്ന സൂചകത്തിന്റെ ‘ഈ’ എന്ന അടുപ്പബോധവും കടന്നുപോകൽ എന്ന ലളിതമായ പ്രവർത്തിയും നിലനിർത്തുന്നു.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: ഞാൻ രണ്ടു പാളയങ്ങളായിത്തീർന്നിരിക്കുന്നു
  rationale: യാക്കോബിന്റെ കുടുംബവും സമ്പത്തും ഇപ്പോൾ രണ്ടു പാളയങ്ങളായി വിഭജിക്കപ്പെട്ടിരിക്കുന്നുവെന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു. വർത്തമാനഫലമുള്ള സമ്പൂർണാവസ്ഥ മലയാളത്തിൽ ‘ആയിത്തീർന്നിരിക്കുന്നു’ എന്നു നൽകി.
theological_decisions:
- issue: חסד, אמת എന്നീ പദങ്ങളുടെ ദൈവബന്ധപരമായ അർത്ഥം
  choice: അചഞ്ചലസ്നേഹം, വിശ്വസ്തത
  alternative: ദയ, സത്യം; ഉടമ്പടിവിശ്വസ്തത, വിശ്വസ്തത
  rationale: ഈ പദജോടി ദൈവത്തിന്റെ ഉറച്ച സ്നേഹത്തെയും വിശ്വാസ്യതയെയും വേർതിരിച്ചെങ്കിലും പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങളായി അവതരിപ്പിക്കുന്നു. ‘ഉടമ്പടി’ എന്നു മൂലവാക്യത്തിൽ ഇല്ലാത്ത പദം നേരിട്ട് ചേർക്കാതെയും, രണ്ടു എബ്രായപദങ്ങളെയും ഒരേ മലയാളപദംകൊണ്ട് മങ്ങിക്കളയാതെയും വിവർത്തനം ചെയ്തു.
- issue: קָטֹנְתִּי എന്ന വിനയപ്രകടനത്തിന്റെ സ്വഭാവം
  choice: ഞാൻ അർഹനല്ല
  alternative: ഞാൻ വളരെ ചെറുതാണ്; ഇവയെല്ലാറ്റിലും ഞാൻ ചെറുതാണ്
  rationale: വാക്യം ദൈവകൃപയ്ക്കുമുമ്പിലുള്ള അയോഗ്യതാബോധം പ്രകടിപ്പിക്കുന്നു; എന്നാൽ യാക്കോബിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള സമഗ്രമായ ദൈവശാസ്ത്രവിധിയായി അതിനെ വികസിപ്പിക്കുന്നില്ല. പദശഃ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർത്ഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അങ്ങ്/അടിയൻ’ എന്ന അഭിസംബോധന വിനയവും ആദരവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ‘പാളയം’ ചുറ്റുപാടിലെ കഥാവിവരണവുമായി ബന്ധപ്പെടുന്ന ദൃശ്യപദമായി നിലനിർത്തി.
