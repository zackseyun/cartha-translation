translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നിന്റെ പേര് എന്താണ്?” അവൻ പറഞ്ഞു: “യാക്കോബ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു
  rationale: ആദ്യത്തെ אמר സാധാരണയായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ ആ പ്രസംഗപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: אֶל എന്ന ദിശാസൂചക പൂർവപ്രത്യയവും മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനോടു’ എന്നു വരുന്നു.
- source_word: מַה שְּׁמֶךָ
  choice: നിന്റെ പേര് എന്താണ്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ പേര് എന്ത്?’; ആധുനിക സാധാരണ മലയാളത്തിലെ പൂർണവും സ്വാഭാവികവുമായ ചോദ്യരൂപം തിരഞ്ഞെടുത്തു.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: രണ്ടാമത്തെ אמר-ന്റെ അടിസ്ഥാന അർഥമായ ‘പറയുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് മറുപടിയാണെങ്കിലും ‘ഉത്തരം പറഞ്ഞു’ എന്ന വിശദീകരണം കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ വ്യുത്പത്തിപരമായ അർഥം ഇവിടെ വിവർത്തനം ചെയ്തിട്ടില്ല.
