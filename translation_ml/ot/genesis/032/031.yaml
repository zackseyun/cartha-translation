id: GEN.32.31
reference: Genesis 32:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: ml
  text: 'യാക്കോബ് ആ സ്ഥലത്തിന് പെനിയേൽ[a] എന്നു പേരിട്ടു; കാരണം: “ഞാൻ ദൈവത്തെ മുഖാമുഖം കണ്ടു; എന്റെ ജീവൻ രക്ഷിക്കപ്പെട്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പെനിയേൽ’ എന്ന പേരിന് ‘ദൈവത്തിന്റെ മുഖം’ എന്ന അർഥമുണ്ട്; “ഞാൻ ദൈവത്തെ മുഖാമുഖം കണ്ടു” എന്ന വിശദീകരണത്തിലെ പദകളിയുമായി ഇത് ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: ആ സ്ഥലത്തിന് ... എന്നു പേരിട്ടു
  rationale: സ്ഥലത്തിന് പേരിടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമകരണപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פְּנִיאֵל
  choice: പെനിയേൽ
  rationale: ഇവിടത്തെ എബ്രായ രൂപം ലിപ്യന്തരണം ചെയ്യുകയും ‘ദൈവത്തിന്റെ മുഖം’ എന്ന പദവിന്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: רָאִיתִי אֱלֹהִים
  choice: ഞാൻ ദൈവത്തെ ... കണ്ടിട്ടും
  rationale: സന്ദർഭത്തിൽ אֱלֹהִים ദൈവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; ക്രിയയുടെ ഒന്നാംപുരുഷരൂപവും നിലനിർത്തുന്നു.
- source_word: פָּנִים אֶל פָּנִים
  choice: മുഖാമുഖം
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; പെനിയേൽ എന്ന പേരുമായുള്ള ‘മുഖം’ എന്ന പദബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: എന്റെ ജീവൻ രക്ഷിക്കപ്പെട്ടുവല്ലോ
  rationale: נֶפֶשׁ ഇവിടെ ശരീരാതീതമായ ‘ആത്മാവ്’ എന്നതിലുപരി ജീവൻ/സ്വയം എന്ന അർഥത്തിലാണ്; נצל എന്ന ക്രിയയുടെ രക്ഷപ്പെടുക/സംരക്ഷിക്കപ്പെടുക എന്ന ഫലസൂചനയും നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ഒരു ദിവ്യജീവി
  rationale: പേരിടലിന്റെ വിശദീകരണവും മല്ലിടൽവിവരണത്തിന്റെ പശ്ചാത്തലവും ദൈവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന വായനയ്ക്ക് മുൻതൂക്കം നൽകുന്നു; എങ്കിലും മൂലപദത്തിന്റെ വിശാലസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ദൈവത്തെ മുഖാമുഖം കണ്ടിട്ടും ജീവിച്ചിരുന്നതിലെ സംഘർഷം
  choice: ‘കണ്ടിട്ടും ... രക്ഷിക്കപ്പെട്ടു’ എന്ന ആശ്ചര്യഭാവം നിലനിർത്തി
  alternative: ‘കണ്ടതിനാൽ എന്റെ ജീവൻ രക്ഷിക്കപ്പെട്ടു’ എന്ന കാരണവായന
  rationale: വാക്യസന്ദർഭത്തിൽ ദൈവത്തെ നേരിട്ട് കണ്ട ശേഷവും യാക്കോബ് ജീവനോടെ ശേഷിച്ചതാണ് ആശ്ചര്യകരമായ ഫലം; മലയാളത്തിൽ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിൽ ഉദ്ധരണി സൂചിപ്പിക്കുന്ന പ്രത്യേക ക്രിയ ഇല്ലെങ്കിലും, മലയാളത്തിൽ സംസാരിക്കുന്നവന്റെ മാറുന്ന ഒന്നാംപുരുഷവാക്യം വ്യക്തമായി വായിക്കാൻ ഉദ്ധരണിചിഹ്നവും ‘എന്നു പറഞ്ഞു’വും ചേർത്തിരിക്കുന്നു; ആശയപരമായ പുതുവിവരം ചേർത്തിട്ടില്ല.
