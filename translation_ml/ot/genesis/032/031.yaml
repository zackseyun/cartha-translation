  to: 'യാക്കോബ് ആ സ്ഥലത്തിന് പെനിയേൽ[a] എന്നു പേരിട്ടു; കാരണം: “ഞാൻ ദൈവത്തെ മുഖാമുഖം കണ്ടു; എന്റെ ജീവൻ രക്ഷിക്കപ്പെട്ടു.”'
  rationale: The revision removes the unsupported speech tag, avoids making the Hebrew’s conjunction explicitly adversative, and retains the direct first-person explanation through punctuation. The cultural footnote is made idiomatic and explicit. Footnote b remains available for the alternative sense of ‘God’ and the lexical range of ‘my life,’ although neither alternative needs an in-text anchor beyond the verse’s existing explanatory-note structure.
