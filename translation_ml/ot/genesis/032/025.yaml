  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: ml
  text: യാക്കോബ് തനിച്ചായി അവശേഷിച്ചു. പുലരി ഉദിക്കുംവരെ[a] ഒരു മനുഷ്യൻ[b] അവനോടു മല്ലിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുലരുവോളം’; അക്ഷരാർഥം, ‘പുലരി ഉദിക്കുന്നതുവരെ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ‘ഒരു മനുഷ്യൻ’ എന്നാണ് പറയുന്നത്; തുടർന്നുള്ള സന്ദർഭവും ഹോശേയ 12:4-ഉം ഈ വ്യക്തിയെ കൂടുതൽ പൂർണമായി തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: അവശേഷിച്ചു
  rationale: നിഫാൽ രൂപത്തിന് ഇവിടെ ‘ശേഷിച്ചു/അവശേഷിച്ചു’ എന്ന അർഥമാണ്. ‘വിട്ടേക്കപ്പെട്ടു’ എന്ന കൃത്യമായ കർമണി പ്രയോഗം മലയാളത്തിൽ അനാവശ്യമായി ഒരു പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നതുപോലെ കേൾക്കാം; ‘അവശേഷിച്ചു’ സന്ദർഭവും യാക്കോബിന്റെ ഏകാന്തതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְבַדּוֹ
  choice: തനിച്ചായി
  rationale: യാക്കോബ് മറ്റാരുമില്ലാതെ ഒറ്റയ്ക്കായിരുന്നുവെന്ന വിവരണാത്മക ഊന്നൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיֵּאָבֵק
  choice: മല്ലിട്ടു
  rationale: അപൂർവമായ ഈ എബ്രായ ക്രിയ ശരീരങ്ങൾ ചേർന്നുള്ള മല്ലിടലിനെയോ പിടിപോരിനെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘പോരാടി’ എന്നതിനെക്കാൾ ‘മല്ലിട്ടു’ കൃത്യമാണ്.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: ഈ വാക്യം ആ അജ്ഞാത വ്യക്തിയെ നേരിട്ട് ‘ഒരു മനുഷ്യൻ’ എന്നാണ് അവതരിപ്പിക്കുന്നത്. തുടർന്നുള്ള സന്ദർഭത്തിൽ ലഭിക്കുന്ന തിരിച്ചറിയൽ മുൻകൂട്ടി ചേർക്കാതെ ആഖ്യാനത്തിലെ ദുരൂഹത നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടു
  rationale: മനുഷ്യൻ യാക്കോബുമായി മല്ലിട്ടുവെന്ന പരസ്പരബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: പുലരി ഉദിക്കുംവരെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പുലരിയുടെ ഉദയംവരെ’ എന്ന ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപമാണ്.
theological_decisions:
- issue: മല്ലിട്ട വ്യക്തിയായ אִישׁ എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ ‘ഒരു മനുഷ്യൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘ഒരു ദൂതൻ’ അല്ലെങ്കിൽ ‘മനുഷ്യരൂപത്തിൽ പ്രത്യക്ഷനായ ദൈവം/യഹോവ’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ആ വ്യക്തിയെ ‘ഒരു മനുഷ്യൻ’ എന്നു മാത്രമാണ് വിളിക്കുന്നത്. ഹോശേയ 12:4-ഉം തുടർന്നുള്ള ആഖ്യാനസന്ദർഭവും കൂടുതൽ വ്യാഖ്യാനത്തിന് വഴിയൊരുക്കുന്നുവെങ്കിലും, പരിഭാഷ ഈ ഘട്ടത്തിൽ തിരിച്ചറിയൽ തീർപ്പാക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മല്ലിട്ടു’ എന്ന പദം ശരീരസമരത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു; അജ്ഞാത വ്യക്തിയുടെ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ മുൻകൂട്ടി തീർപ്പാക്കിയിട്ടില്ല.
