reference: Genesis 32:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: ml
  text: 'നിങ്ങൾ ഇതും പറയണം: ‘ഇതാ, അങ്ങയുടെ ദാസനായ യാക്കോബ് ഞങ്ങളുടെ പിന്നാലെയുണ്ട്.’ എന്തെന്നാൽ, അവൻ പറഞ്ഞു: ‘എന്റെ മുമ്പിൽ പോകുന്ന ഈ സമ്മാനംകൊണ്ട് ഞാൻ അവനെ അനുനയിപ്പിക്കും[a]. അതിനുശേഷം ഞാൻ അവന്റെ മുഖം കാണും; ഒരുപക്ഷേ അവൻ എന്നെ സ്വീകരിച്ചേക്കാം[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുഖം അനുനയിപ്പിക്കും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ പ്രായശ്ചിത്തഭാഷയുമായി ബന്ധമുള്ളതാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ സമ്മാനംകൊണ്ട് ഏശാവിന്റെ കോപം ശമിപ്പിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ ഭാഷാശൈലിയിൽ അക്ഷരാർഥത്തിൽ ‘അവൻ എന്റെ മുഖം ഉയർത്തും’; അതായത്, ‘അവൻ എന്നെ സ്വീകരിക്കും’ അല്ലെങ്കിൽ ‘എന്നോട് പ്രീതി കാണിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഏശാവിനോടുള്ള നയതന്ത്രപരവും വിനയപൂർവവുമായ സ്വയംതാഴ്ത്തൽ വ്യക്തമാക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരകണത്തിന്റെ തൽക്ഷണഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֲרֵינוּ
  choice: ഞങ്ങളുടെ പിന്നാലെയുണ്ട്
  rationale: സന്ദേശവാഹകരെ പിന്തുടർന്ന് യാക്കോബ് വരുന്നതെന്ന സ്ഥാനബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲכַפְּרָה פָנָיו
  choice: ഞാൻ അവനെ അനുനയിപ്പിക്കും
  rationale: כפר എന്ന ക്രിയ ഇവിടെ ആരാധനാക്രമപരമായ പ്രായശ്ചിത്തത്തെയല്ല, സമ്മാനംകൊണ്ട് ഏശാവിന്റെ കോപം ശമിപ്പിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികമായ മുഖ്യപാഠത്തോടൊപ്പം പദബന്ധം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מִנְחָה
  choice: സമ്മാനം
  rationale: ഇവിടെ യാക്കോബ് ഏശാവിന് അയക്കുന്ന അനുരഞ്ജനസമ്മാനമാണ് ഉദ്ദേശ്യം; ‘വഴിപാട്’ ആരാധനാക്രമപരമായ തെറ്റായ ധ്വനി സൃഷ്ടിച്ചേക്കാം.
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: എന്റെ മുമ്പിൽ പോകുന്ന
  rationale: സമ്മാനം യാക്കോബിന് മുന്നിലായി നീങ്ങുന്നതെന്ന തുടരുന്ന പ്രവർത്തനം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֶרְאֶה פָנָיו
  choice: ഞാൻ അവന്റെ മുഖം കാണും
  rationale: വാക്യത്തിലെ ആവർത്തിതമായ ‘മുഖം’ എന്ന സാഹിത്യരൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: יִשָּׂא פָנַי
  choice: അവൻ എന്നെ സ്വീകരിച്ചേക്കാം
  rationale: ‘എന്റെ മുഖം ഉയർത്തുക’ എന്ന എബ്രായ ഭാഷാശൈലിയുടെ സന്ദർഭോചിതമായ അർഥം അനുകൂലമായി സ്വീകരിക്കുക എന്നതാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: യാക്കോബിന്റെ പ്രത്യാശയോടുകൂടിയ അനിശ്ചിതത്വം മാന്യമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യർ തമ്മിലുള്ള സാഹചര്യത്തിൽ כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഞാൻ അവനെ അനുനയിപ്പിക്കും
  alternative: ഞാൻ അവന്റെ മുമ്പിൽ പ്രായശ്ചിത്തം ചെയ്യും
  rationale: ക്രിയയ്ക്ക് പ്രായശ്ചിത്തഭാഷയുമായി ബന്ധമുണ്ടെങ്കിലും ഇവിടെ ലക്ഷ്യം ഏശാവിന്റെ ‘മുഖം’ ആണ്; മാർഗം സമ്മാനവും. അതിനാൽ ആരാധനാക്രമപരമായ അർഥം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ വ്യക്തിബന്ധത്തിലെ അനുനയമാണ് നൽകുന്നത്; പദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ഏശാവിനെ അഭിസംബോധന ചെയ്യുമ്പോഴുള്ള വിനയസൂചകതയ്ക്കായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ‘മുഖം’ എന്ന ആവർത്തിത രൂപകം സാധ്യമായിടത്ത് നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമാകുന്ന രണ്ട് എബ്രായ ഭാഷാശൈലികൾ സ്വാഭാവികമായി വിവർത്തനം ചെയ്ത് അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
