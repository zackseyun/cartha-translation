  source_fidelity: മൂലഎബ്രായത്തിലെ വിനയസൂചകമായ ‘അങ്ങയുടെ ദാസൻ,’ ദൂതന്മാരുടെ പിന്നാലെ വരുന്ന യാക്കോബ്, സമ്മാനംകൊണ്ടുള്ള അനുനയം, ‘മുഖം’ എന്ന ആവർത്തനം, ഒടുവിലെ അനുകൂലസ്വീകരണത്തിന്റെ ഭാഷാശൈലി എന്നിവ കരട് വിശ്വസ്തമായി നൽകുന്നു. എന്നാൽ גַּם എന്ന ‘കൂടി/ഇതും’ എന്ന ഘടകത്തിന് ‘ഇങ്ങനെയും’ എന്നത് അല്പം അവ്യക്തമാണ്; ‘ഇതും’ കൂടുതൽ നേരിട്ടാണ്.
  naturalness: വാക്യനിർമ്മാണവും ആദരസൂചക അഭിസംബോധനയും ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘നിങ്ങൾ ഇതും പറയണം’ എന്ന ചെറിയ ഭേദഗതി ദൂതന്മാർ പറയേണ്ട അധികവിവരത്തെ കൂടുതൽ തെളിച്ചത്തോടെ അവതരിപ്പിക്കുന്നു.
