  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: ml
  text: ഞാൻ നിന്റെ സന്തതിയെ ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ പെരുപ്പിക്കും; ഈ ദേശങ്ങളെല്ലാം നിന്റെ സന്തതിക്കു നൽകും; നിന്റെ സന്തതിയിൽ ഭൂമിയിലെ സകല ജനതകളും അനുഗ്രഹിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഭൂമിയിലെ സകല ജനതകളും നിന്റെ സന്തതിയെ ചൊല്ലി തങ്ങൾക്കായി അനുഗ്രഹം ആശംസിക്കും.” ഹീബ്രു ക്രിയയെ പ്രത്യാവർത്തകമായി മനസ്സിലാക്കാം; എങ്കിലും ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിന് നിഷ്ക്രിയ അർഥം നന്നായി യോജിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: ഞാൻ ... പെരുപ്പിക്കും
  rationale: רבה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സംഖ്യയിൽ വർധിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനം വ്യക്തമാക്കുന്നു; ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ ശൈലിക്കും ‘പെരുപ്പിക്കും’ യോജിക്കുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഒരു സമൂഹവാചക ഏകവചനമാണ്; ‘സന്തതി’ അതിന്റെ ഏകവചനരൂപവും സന്താനപരമ്പരയെ സൂചിപ്പിക്കുന്ന വിശാലതയും നിലനിർത്തുന്നു.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: כְּ എന്ന വ്യക്തമായ ഉപമ നിലനിർത്തുന്നു; שָׁמַיִם എന്നതിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ആകാശം’ ഉപയോഗിക്കുന്നു.
- source_word: וְנָתַתִּי
  choice: നൽകും
  rationale: נתן എന്ന സാധാരണ ‘കൊടുക്കുക/നൽകുക’ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്കു
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന זֶרַע എന്ന പദം ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി ആശയബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ഈ ദേശങ്ങളെല്ലാം
  rationale: אֲרָצוֹת ഇവിടെ ഭൂപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; הָאֵל എന്ന സൂചനാപദം ‘ഈ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְהִתְבָּרֲכוּ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: പിതൃപുരുഷ ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ നിഷ്ക്രിയ അർഥം സ്വാഭാവികമാണ്; എങ്കിലും ഹിത്പയേൽ രൂപത്തിന്റെ പ്രത്യാവർത്തക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְזַרְעֲךָ
  choice: നിന്റെ സന്തതിയിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘യിൽ’ നിലനിർത്തി, ഉപാധി/മാധ്യമം എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം സംരക്ഷിക്കുന്നു.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: גּוֹיִם എന്നത് ജനവിഭാഗങ്ങളെയും ജനതകളെയും സൂചിപ്പിക്കുന്നു; ‘സകല ജനതകളും’ സമഗ്രതയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ എന്ന അനുഗ്രഹസൂത്രത്തിന്റെ അർഥം
  choice: നിന്റെ സന്തതിയിൽ ഭൂമിയിലെ സകല ജനതകളും അനുഗ്രഹിക്കപ്പെടും
  alternative: ഭൂമിയിലെ സകല ജനതകളും നിന്റെ സന്തതിയെ ചൊല്ലി തങ്ങൾക്കായി അനുഗ്രഹം ആശംസിക്കും
  rationale: ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലം നിഷ്ക്രിയ വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഹീബ്രു ഹിത്പയേൽ രൂപം പ്രത്യാവർത്തകമായി മനസ്സിലാക്കാനും കഴിയുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഉടമ്പടി-വാഗ്ദാന ശൈലി. ‘സന്തതി’ എന്ന സമൂഹവാചക ഏകവചനം മൂന്നു പ്രാവശ്യം ഒരേപോലെ നിലനിർത്തിയിരിക്കുന്നു; ‘യിൽ’ എന്നത് ഹീബ്രു ഉപസർഗത്തിന്റെ അർഥപരമായ തുറന്നത്വം സംരക്ഷിക്കുന്നു.
