  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: ml
  text: അവന്റെ പിതാവായ അബ്രാഹാമിന്റെ കാലത്ത് അവന്റെ പിതാവിന്റെ ദാസന്മാർ[a] കുഴിച്ചിരുന്ന എല്ലാ കിണറുകളും ഫെലിസ്ത്യർ അടച്ചുകളയുകയും അവയിൽ മണ്ണ്[b] നിറയ്ക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അടിമകൾ.’ എബ്രായ പദമായ עֶבֶד സന്ദർഭമനുസരിച്ച് ദാസനെയോ അടിമയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പദമായ עָפָר എന്നതിന് സന്ദർഭമനുസരിച്ച് മണ്ണ്, പൊടി, ധൂളി എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: കിണറുകളെല്ലാം
  rationale: כָל എന്നതിന്റെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു. തുടക്കത്തിലെ וְ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നതാണെങ്കിലും ഈ വാക്യത്തിൽ പ്രത്യേകം ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר חָפְרוּ
  choice: കുഴിച്ചിരുന്ന
  rationale: കിണറുകൾ കുഴിച്ചത് ഫെലിസ്ത്യരുടെ പ്രവൃത്തിക്ക് മുമ്പാണെന്ന കാലബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: עַבְדֵי אָבִיו
  choice: അവന്റെ അപ്പന്റെ ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ, സേവകൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ബന്ധിത അടിമത്തത്തിന് പ്രത്യേക ഊന്നൽ ഇല്ലാത്തതിനാൽ ‘ദാസന്മാർ’ തിരഞ്ഞെടുത്തു; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: അവന്റെ അപ്പനായ അബ്രാഹാമിന്റെ കാലത്ത്
  rationale: ‘അവന്റെ അപ്പനായ അബ്രാഹാം’ എന്ന ആവർത്തിച്ച ബന്ധസൂചനയും ‘കാലത്ത്’ എന്ന സമയചട്ടക്കൂടും സംരക്ഷിക്കുന്നു.
- source_word: סִתְּמוּם
  choice: അടച്ചുകളയുകയും
  rationale: കിണറുകളെ തടസ്സപ്പെടുത്തി ഉപയോഗശൂന്യമാക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְמַלְאוּם עָפָר
  choice: അവയിൽ മണ്ണ് നിറയ്ക്കുകയും ചെയ്തു
  rationale: ക്രിയയോടു ചേർന്ന ബഹുവചന കർമപ്രത്യയം ‘അവയിൽ’ എന്നു വ്യക്തമാക്കി നിലനിർത്തുന്നു. עָפָר എന്നത് ഈ സന്ദർഭത്തിൽ കിണറുകളിൽ നിറച്ച മണ്ണിനെ സൂചിപ്പിക്കുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിനുള്ള പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിക്കുന്നു.
