  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പിതൃബന്ധത്തിന്റെ ആവർത്തനം ഒഴിവാക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്; എന്നാൽ ഇംഗ്ലീഷിലെ കൃത്രിമമായ തുടക്കവാക്കായ ‘Now’ അനുകരിച്ചിട്ടില്ല.
