source:
  edition: WLC
  text: וַֽ/יַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַ/יָּרִ֖יבוּ גַּם עָלֶ֑י/הָ וַ/יִּקְרָ֥א שְׁמָ֖/הּ שִׂטְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: ml
  text: പിന്നെ അവർ മറ്റൊരു കിണർ കുഴിച്ചു. അതിനെച്ചൊല്ലിയും അവർ വഴക്കിട്ടു. അതുകൊണ്ട് അവൻ അതിന് സിത്നാ[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സിത്നാ” എന്ന പേര് ശത്രുതയോ എതിർപ്പോ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു പദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ בְּאֵר אַחֶרֶת
  choice: അവർ മറ്റൊരു കിണർ കുഴിച്ചു
  rationale: חפר എന്ന സാധാരണ ക്രിയയുടെ അർഥം ‘കുഴിക്കുക’ എന്നാണ്; בְּאֵר אַחֶרֶת എന്നത് സ്വാഭാവികമായി ‘മറ്റൊരു കിണർ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: അതിനെച്ചൊല്ലിയും അവർ വഴക്കിട്ടു
  rationale: ריב ഇവിടെ തർക്കിക്കുകയോ വഴക്കിടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അതിനെച്ചൊല്ലിയും’ എന്ന പ്രയോഗം גַּם (‘കൂടി/യും’), עַל (‘അതിനെക്കുറിച്ച്/അതിന്റെ പേരിൽ’) എന്നിവയുടെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: അവൻ അതിന് … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥം ‘അവൻ അതിന്റെ പേര് വിളിച്ചു’ എന്നാണെങ്കിലും, പേരിടൽസന്ദർഭത്തിൽ ‘പേരിട്ടു’ എന്നത് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שִׂטְנָה
  choice: സിത്നാ
  rationale: കിണറിന്റെ പേരായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു പേരിന്റെ ലിപ്യന്തരണം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു; പേരിലെ അർഥബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
