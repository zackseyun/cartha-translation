  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ വാക്യക്രമം ചെറുവാക്യങ്ങളിലൂടെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു; ‘അതുകൊണ്ട്’ പേരിടലിന്റെ സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു.
