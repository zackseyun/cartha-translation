  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ ഹീബ്രായ മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; ഏകവചനവും രണ്ടു പേരുകളും തമ്മിലുള്ള മൂലപാഠത്തിലെ അസാധാരണത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
