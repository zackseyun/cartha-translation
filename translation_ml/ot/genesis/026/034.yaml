source:
  edition: WLC
  text: וַ/יְהִ֤י עֵשָׂו֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה וַ/יִּקַּ֤ח אִשָּׁה֙ אֶת יְהוּדִ֔ית בַּת בְּאֵרִ֖י הַֽ/חִתִּ֑י וְ/אֶת בָּ֣שְׂמַ֔ת בַּת אֵילֹ֖ן הַֽ/חִתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: ml
  text: ഏശാവിന് നാല്പതു വയസ്സായപ്പോൾ, അവൻ ഹിത്യനായ ബെയേരിയുടെ മകൾ യെഹൂദിത്തിനെയും ഹിത്യനായ ഏലോന്റെ മകൾ ബാസെമത്തിനെയും ഭാര്യമാരായി സ്വീകരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ ഒരു ഭാര്യയെ സ്വീകരിച്ചു: ... യെഹൂദിത്തിനെയും ... ബാസെമത്തിനെയും.” രണ്ടു സ്ത്രീകളെ പേരെടുത്തുപറയുന്നുണ്ടെങ്കിലും ഹീബ്രായത്തിൽ “സ്ത്രീ/ഭാര്യ” എന്ന പദം ഏകവചനത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן אַרְבָּעִים שָׁנָה
  choice: ഏശാവിന് നാല്പതു വയസ്സായപ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ കാലസാഹചര്യവും പ്രായം സൂചിപ്പിക്കുന്ന പതിവുശൈലിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַיִּקַּח אִשָּׁה
  choice: ഭാര്യമാരായി സ്വീകരിച്ചു
  rationale: ക്രിയയ്ക്ക് വിവാഹബന്ധത്തിലേക്ക് സ്വീകരിക്കുക എന്ന അർഥമുണ്ട്. ഹീബ്രായത്തിൽ ‘സ്ത്രീ/ഭാര്യ’ ഏകവചനമാണെങ്കിലും പിന്നാലെ രണ്ടു സ്ത്രീകളെ പേരെടുത്തുപറയുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു; മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: יְהוּדִית
  choice: യെഹൂദിത്ത്
  rationale: ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּאֵרִי
  choice: ബെയേരി
  rationale: ഹീബ്രായ നാമത്തിന്റെ സ്വരഘടന പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: നിശ്ചയാർഥക ഘടകമുള്ള ജനവിഭാഗനാമം, ബെയേരിയെയും ഏലോനെയും വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בָּשְׂמַת
  choice: ബാസെമത്ത്
  rationale: ഹീബ്രായ നാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֵילֹן
  choice: ഏലോൻ
  rationale: ഹീബ്രായ നാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
