id: GEN.26.25
reference: Genesis 26:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: ml
  text: അവൻ അവിടെ ഒരു യാഗപീഠം പണിതു; യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു[a]. അവിടെ അവൻ തന്റെ കൂടാരം അടിച്ചു. യിസ്ഹാക്കിന്റെ ദാസന്മാർ അവിടെ ഒരു കിണർ കുഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ നാമം പ്രഖ്യാപിച്ചു.” ഈ എബ്രായ പ്രയോഗത്തിന് വിളിച്ചപേക്ഷിക്കുക എന്നും പ്രഖ്യാപിക്കുക എന്നും അർഥമാകാം; ഇവിടെ യാഗപീഠത്തിന്റെ പശ്ചാത്തലം വിളിച്ചപേക്ഷിക്കുക എന്ന അർഥത്തിനാണ് കൂടുതൽ അനുകൂലം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: നിർമാണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ആരാധനയ്ക്കും യാഗാർപ്പണത്തിനുമുള്ള ഘടനയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ മലയാളപദം.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  rationale: ബലിപീഠത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ എബ്രായ പ്രയോഗം ആരാധനാപൂർവമായ അഭ്യർഥനയെയോ പ്രാർത്ഥനയെയോ പ്രധാനമായി സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചപേക്ഷിച്ചു’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവികനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: അവിടെ അവൻ തന്റെ കൂടാരം അടിച്ചു
  rationale: കൂടാരം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം; മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘തന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: עַבְדֵי יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ ദാസന്മാർ
  rationale: ഈ വീട്ടുജോലിക്കാരുടെ നിയമപരമായ പദവി വാക്യം വ്യക്തമാക്കാത്തതിനാൽ, עבד എന്ന പദത്തിന് സന്ദർഭോചിതമായ വിശാല അർഥമുള്ള ‘ദാസന്മാർ’ തെരഞ്ഞെടുത്തു.
- source_word: וַיִּכְרוּ ... בְּאֵר
  choice: ഒരു കിണർ കുഴിച്ചു
  rationale: കിണർ നിർമ്മിക്കുന്ന പ്രവൃത്തിക്കുള്ള നേരിട്ടും സാധാരണവുമായ മലയാളപ്രയോഗം.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ ഊന്നിപ്പറയുന്ന എബ്രായ ആവർത്തനം മൂന്നു സന്ദർഭങ്ങളിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവികനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  alternative: യഹ്‌വേയുടെ നാമം പ്രഖ്യാപിച്ചു
  rationale: പ്രയോഗത്തിന് അഭ്യർഥനയെന്നും പ്രഖ്യാപനമെന്നും അർഥസാധ്യതകളുണ്ട്. ഇവിടെ യാഗപീഠം പണിത സന്ദർഭം ആരാധനാപൂർവമായ വിളിച്ചപേക്ഷിക്കലിനാണ് കൂടുതൽ അനുകൂലം; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ പ്രവൃത്തികളും ‘അവിടെ’ എന്ന സ്ഥലസൂചനയുടെ ആവർത്തനവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
