source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “യഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന് ഞങ്ങൾ വ്യക്തമായി കണ്ടിരിക്കുന്നു. അതിനാൽ ഞങ്ങൾ പറഞ്ഞു: ‘ദയവായി, നമുക്കിടയിൽ—ഞങ്ങൾക്കും നിനക്കും ഇടയിൽ—ഒരു ശപഥം ഉണ്ടായിരിക്കട്ടെ[a]; ഞങ്ങൾ നിന്നോടു ഒരു ഉടമ്പടി ചെയ്യട്ടെ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശാപശപഥം”; ലംഘിക്കുന്നവന്റെമേൽ ശാപം വരണമെന്ന ആഹ്വാനം ഉൾപ്പെട്ട ശപഥത്തെയും ഈ ഹീബ്രു പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള ആഖ്യാനപ്രവാഹം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; പ്രത്യേകം കാലക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: רָאוֹ רָאִינוּ
  choice: ഞങ്ങൾ വ്യക്തമായി കണ്ടിരിക്കുന്നു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപിക ക്രിയയും ചേർന്നുള്ള ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: യഹ്‌വെ നിന്നോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന്
  rationale: הָיָה സൂചിപ്പിക്കുന്ന ഭൂതകാലാവസ്ഥ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അതിന് ഇപ്പോഴത്തെ പ്രസക്തിയുണ്ടെങ്കിലും ‘ഉണ്ട്’ എന്ന് മാറ്റി അനിശ്ചിതത്വം തീർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോൺ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַנֹּאמֶר
  choice: അതുകൊണ്ട് ഞങ്ങൾ ഇങ്ങനെ വിചാരിച്ചു
  rationale: മുൻ നിരീക്ഷണത്തിൽനിന്ന് നിർദേശം ഉദിക്കുന്ന ബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ നിർദേശം രൂപപ്പെടുത്തുന്നതിനു മുമ്പുള്ള ആലോചനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תְּהִי נָא
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: ജസ്സീവ് രൂപത്തിന്റെ വിനീതമായ അഭ്യർഥനാഭാവം മലയാളത്തിലെ അനുവദനീയ/ആഗ്രഹാർഥ രൂപത്തിൽ നൽകുന്നു; നָאയുടെ വിനയം സന്ദർഭവും രൂപവും ചേർന്ന് വഹിക്കുന്നു.
- source_word: אָלָה
  choice: ഒരു ശപഥം
  rationale: ഉടമ്പടി സന്ദർഭത്തിലെ അടിസ്ഥാന അർഥം നൽകുന്നു; ലംഘിച്ചാൽ ശാപം വരുത്തിവെക്കുന്ന ശപഥം എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: നമുക്കിടയിൽ—ഞങ്ങൾക്കും നിനക്കും ഇടയിൽ
  rationale: ഹീബ്രുവിലെ ഔപചാരികമായ ആവർത്തനം മുഴുവനായി നീക്കാതെ, മലയാളത്തിൽ വ്യക്തവും വായനാസൗകര്യമുള്ളതുമായ സമാനാധികരണ ഘടന നൽകുന്നു.
- source_word: וְנִכְרְתָה בְרִית
  choice: ഞങ്ങൾ നിന്നോടു ഒരു ഉടമ്പടി ചെയ്യട്ടെ
  rationale: അക്ഷരാർഥമായ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിനു പകരം മലയാളത്തിൽ പതിവായ ‘ഉടമ്പടി ചെയ്യുക’ ഉപയോഗിക്കുന്നു; ഒന്നാംപുരുഷ ബഹുവചന ആഹ്വാനരൂപം നിലനിർത്തുന്നു.
- source_word: עִמָּךְ
  choice: നിന്നോടു
  rationale: യിസ്ഹാക്കിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനരൂപം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റോൺ ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אָלָה എന്ന പദത്തിലെ ശാപസഹിത ശപഥത്തിന്റെ സാധ്യത
  choice: മുഖ്യപാഠത്തിൽ ‘ശപഥം’; ശാപസൂചന അടിക്കുറിപ്പിൽ
  alternative: ശാപശപഥം
  rationale: ഉടമ്പടി നിർദേശത്തിൽ ‘ശപഥം’ സ്വാഭാവികവും വ്യക്തവുമാണ്; എന്നാൽ സ്വയംശാപം ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ ശക്തി നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഊന്നലും ഔപചാരിക ആവർത്തനവും വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
