id: GEN.26.10
reference: Genesis 26:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: ml
  text: 'അബീമേലെക്ക് പറഞ്ഞു: “നീ ഞങ്ങളോടു ചെയ്ത ഈ കാര്യം എന്താണ്? ജനത്തിലെ ഒരാൾ നിന്റെ ഭാര്യയോടുകൂടെ എളുപ്പത്തിൽ ശയിക്കുമായിരുന്നല്ലോ[a]; അങ്ങനെ നീ ഞങ്ങളുടെമേൽ കുറ്റബാധ്യത വരുത്തുമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ “ഏതാണ്ട്”: “ജനത്തിലെ ഒരാൾ നിന്റെ ഭാര്യയോടുകൂടെ ഏതാണ്ട് ശയിച്ചുപോയേനെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: നീ ഞങ്ങളോട് ഈ ചെയ്തത് എന്താണ്?
  rationale: മַה זֹּאת എന്ന ആശ്ചര്യവും ശാസനയും കലർന്ന എബ്രായ പ്രയോഗവും, לָּנוּ എന്ന സമൂഹത്തെ ബാധിക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּמְעַט
  choice: എളുപ്പത്തിൽ ... കിടന്നുപോകുമായിരുന്നല്ലോ
  rationale: സംഭവം നടക്കാതെ വളരെ അടുത്തെത്തിയ അപകടസാധ്യതയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ‘ഏതാണ്ട്’ എന്ന കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: നിന്റെ ഭാര്യയോടുകൂടെ ... കിടന്നുപോകുക
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മാന്യവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; അനാവശ്യമായി വൈദ്യശാസ്ത്രപരമോ സംസാരഭാഷാപരമോ ആക്കുന്നില്ല.
- source_word: אַחַד הָעָם
  choice: ജനത്തിൽ ഒരാൾ
  rationale: ‘ജനത്തിൽ ഒരാൾ’ എന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; സന്ദർഭം പുരുഷനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠത്തേക്കാൾ അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: നീ ഞങ്ങളുടെമേൽ കുറ്റം വരുത്തുമായിരുന്നു
  rationale: אָשָׁם ഇവിടെ വെറും അപകീർത്തിയല്ല, സമൂഹത്തിന്മേൽ വന്നുചേരുന്ന ധാർമിക കുറ്റബാധ്യതയാണ്; ‘കുറ്റം’ അതിനെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക് പറഞ്ഞു
  rationale: എബ്രായ കഥനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ബന്ധകപദം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: אָשָׁם എന്നതിന്റെ സ്വഭാവം
  choice: കുറ്റം
  alternative: പഴി / അപരാധം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് സാമൂഹികമായ പഴി മാത്രമല്ല, അറിയാതെയായാലും ലൈംഗികപാപം മൂലം ജനത്തിന്മേൽ വരുന്ന യാഥാർഥ ധാർമിക കുറ്റബാധ്യതയാണ്. അതേസമയം, പിന്നീടുള്ള യാഗസംബന്ധമായ സാങ്കേതിക അർഥം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവവും മാന്യതയും പുലർത്തുന്ന മലയാളം. ലൈംഗികസൂചന തുറന്ന അശ്ലീലതയില്ലാതെ മൂലപാഠത്തിന്റെ ശൈലിക്ക് അടുത്തായി നൽകിയിരിക്കുന്നു.
