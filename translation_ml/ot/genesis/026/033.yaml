lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: അവൻ അതിന് … എന്നു പേരിട്ടു
  rationale: കרא എന്ന ക്രിയയ്ക്ക് ഈ നാമകരണസന്ദർഭത്തിൽ ‘പേരിടുക’ എന്ന അർഥമാണ്; സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻസന്ദർഭത്തിലെ കിണറിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അചേതനവസ്തുവിനെ സ്വാഭാവികമായി ‘അതിന്’ എന്നു പറയുന്നു.
- source_word: שִׁבְעָה
  choice: ശിബാ
  rationale: ഇത് കിണറിന് നൽകിയ പേരായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ‘ഏഴ്’, ‘ശപഥം’ എന്നിവയുമായുള്ള ഹീബ്രു പദകളി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: കിണറിന്റെ പേരിനെയും നഗരത്തിന്റെ പേരിനെയും ബന്ധിപ്പിക്കുന്ന വിശദീകരണനിഗമനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שֵׁם הָעִיר
  choice: ആ നഗരത്തിന് … എന്നു പേര്
  rationale: ഹീബ്രുവിലെ ‘നഗരത്തിന്റെ പേര്’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക നാമകരണപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: בְּאֵר שֶׁבַע
  choice: ബേർശേബ
  rationale: സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു; പേരിലെ സാധ്യതയുള്ള ഇരട്ട അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: ഹീബ്രു കാലപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
