lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; യാത്രാവിവരണത്തിൽ ഉയർന്ന പ്രദേശത്തേക്കുള്ള നീക്കത്തെയും സൂചിപ്പിക്കാം.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുൻപ് പരാമർശിച്ച സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּאֵר שָׁבַע
  choice: ബേർ-ശേബ
  rationale: സ്ഥലനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രൂ ഉച്ചാരണത്തോടടുത്ത് ലിപ്യന്തരണം ചെയ്യുന്നു.
