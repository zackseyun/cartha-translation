    text: എബ്രായഭാഷയിൽ ‘കയറിപ്പോയി’; യാത്രയെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമായിരിക്കാം, അതോടൊപ്പം ഉയർന്ന പ്രദേശത്തേക്കുള്ള കയറ്റവും അർഥമാക്കാം.
