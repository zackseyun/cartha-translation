  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വീണ്ടും കുഴിച്ചു’ എന്നത് ഹീബ്രു ഘടനയുടെ പുനരാരംഭസൂചന വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
