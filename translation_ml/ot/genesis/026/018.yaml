  text: וַ/יָּ֨שָׁב יִצְחָ֜ק וַ/יַּחְפֹּ֣ר אֶת בְּאֵרֹ֣ת הַ/מַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּ/ימֵי֙ אַבְרָהָ֣ם אָבִ֔י/ו וַ/יְסַתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַ/יִּקְרָ֤א לָ/הֶן֙ שֵׁמ֔וֹת כַּ/שֵּׁמֹ֕ת אֲשֶׁר קָרָ֥א לָ/הֶ֖ן אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: ml
  text: പിന്നെ യിസ്ഹാക്ക് തന്റെ പിതാവായ അബ്രാഹാമിന്റെ കാലത്ത് കുഴിച്ചിരുന്നതും അബ്രാഹാമിന്റെ മരണശേഷം ഫെലിസ്ത്യർ അടച്ചുകളഞ്ഞതുമായ ജലക്കിണറുകൾ വീണ്ടും കുഴിച്ചു[a]. തന്റെ പിതാവ് അവയ്ക്ക് നൽകിയിരുന്ന അതേ പേരുകൾ അവൻ അവയ്ക്ക് നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘യിസ്ഹാക്ക് മടങ്ങി കുഴിച്ചു.’ ഇവിടെ ‘മടങ്ങുക’ എന്നർഥമുള്ള ഹീബ്രു ക്രിയ, കുഴിക്കൽ വീണ്ടും ചെയ്തുവെന്ന ആശയം സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: വീണ്ടും കുഴിച്ചു
  rationale: שוב എന്ന ക്രിയയും തുടർന്നുള്ള חפר എന്ന ക്രിയയും ചേർന്ന് ഇവിടെ കുഴിക്കൽ പുനരാരംഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു. യാത്രചെയ്ത് മടങ്ങിയെന്ന ധാരണ അനാവശ്യമായി വരാതിരിക്കാനാണ് സ്വാഭാവികമായ ‘വീണ്ടും കുഴിച്ചു’ സ്വീകരിച്ചത്.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: ജലക്കിണറുകൾ
  rationale: ഹീബ്രുവിലെ ‘വെള്ളത്തിന്റെ കിണറുകൾ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവും ജലസ്രോതസ്സുകളെന്ന ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: തന്റെ പിതാവായ അബ്രാഹാമിന്റെ കാലത്ത് കുഴിച്ചിരുന്നതും
  rationale: ഹീബ്രുവിലെ ബഹുവചനക്രിയയ്ക്ക് നിർദിഷ്ട കർത്താവില്ല; അതിനാൽ മലയാളത്തിൽ കർത്തൃനിരപേക്ഷമായ രൂപം ഉപയോഗിച്ചു. בימי എന്നത് സ്വാഭാവികമായി ‘കാലത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיְסַתְּמוּם
  choice: അടച്ചുകളഞ്ഞ
  rationale: סתם എന്നത് കിണറുകൾ അടയ്ക്കുക അഥവാ തടസ്സപ്പെടുത്തുക എന്നാണ്. ഏതു വസ്തു ഉപയോഗിച്ചു എന്ന് മൂലപാഠം പറയാത്തതിനാൽ അത് വ്യക്തമാക്കാതെ ‘അടച്ചുകളഞ്ഞ’ എന്നു നൽകി.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ജനവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾനാമരൂപം.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ മരണശേഷം
  rationale: കാലബന്ധം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: അവൻ അവയ്ക്കു ... പേരുകൾ ... വിളിച്ചു
  rationale: קרא എന്ന ‘വിളിക്കുക’ എന്ന ക്രിയയെ അടുത്തായി പിന്തുടരുകയും കിണറുകൾക്ക് പേരിടുന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: തന്റെ പിതാവ് അവയ്ക്കു നൽകിയിരുന്ന പേരുകൾതന്നെ
  rationale: כ എന്ന ഉപസർഗം ഇവിടെ മുൻപ് നൽകിയ പേരുകളോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്നു; ‘പേരുകൾതന്നെ’ അതേ പേരുകളാണെന്നത് വ്യക്തമായി അറിയിക്കുന്നു.
