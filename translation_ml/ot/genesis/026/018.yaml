  to: പിന്നെ യിസ്ഹാക്ക് തന്റെ പിതാവായ അബ്രാഹാമിന്റെ കാലത്ത് കുഴിച്ചിരുന്നതും അബ്രാഹാമിന്റെ മരണശേഷം ഫെലിസ്ത്യർ അടച്ചുകളഞ്ഞതുമായ ജലക്കിണറുകൾ വീണ്ടും കുഴിച്ചു[a]. തന്റെ പിതാവ് അവയ്ക്ക് നൽകിയിരുന്ന അതേ പേരുകൾ അവൻ അവയ്ക്ക് നൽകി.
