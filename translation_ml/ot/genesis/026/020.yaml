source:
  edition: WLC
  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: ml
  text: അപ്പോൾ ഗെരാറിലെ ഇടയന്മാർ യിസ്ഹാക്കിന്റെ ഇടയന്മാരുമായി വഴക്കിട്ട്, “ഈ വെള്ളം ഞങ്ങളുടേതാണ്” എന്നു പറഞ്ഞു. അതുകൊണ്ട് അവൻ ആ കിണറിന് ഏസെക്ക്[a] എന്നു പേരിട്ടു; കാരണം അവർ അവനോടു തർക്കിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഏസെക്ക്” എന്ന പേര് “തർക്കം” അഥവാ “അവകാശത്തർക്കം” എന്നർഥമുള്ള ഹീബ്രായ പദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: പേരും ‘തർക്കിച്ചിരുന്നു’ എന്ന തുടർന്നുള്ള ക്രിയയും തമ്മിലുള്ള ഹീബ്രായ പദപ്രയോഗബന്ധം മലയാള ലിപ്യന്തരത്തിൽ നേരിട്ട് വ്യക്തമാകാത്തതിനാൽ.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: വഴക്കിട്ട്
  rationale: ריב ഇവിടെ കിണറിലെ വെള്ളത്തിന്റെ അവകാശത്തെച്ചൊല്ലിയുള്ള നേരിട്ടുള്ള കലഹത്തെയും വാക്കുതർക്കത്തെയും സൂചിപ്പിക്കുന്നു; ‘വഴക്കിട്ട്’ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: רֹעֵי גְרָר
  choice: ഗെരാറിലെ ഇടയന്മാർ
  rationale: רֹעִים ആടുമാടുകളെ മേയ്ക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘ഇടയന്മാർ’ പിതൃകാല പശ്ചാത്തലത്തിന് യോജിക്കുന്ന പൊതുവായ മലയാള പദമാണ്.
- source_word: עִם רֹעֵי יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ ഇടയന്മാരുമായി
  rationale: മൂലത്തിലെ സമാന്തര ഘടനയും ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: “ഈ വെള്ളം ഞങ്ങളുടേതാണ്” എന്നു പറഞ്ഞു
  rationale: അക്ഷരാർഥത്തിൽ ‘വെള്ളം ഞങ്ങൾക്കുള്ളത്’ എന്ന സംക്ഷിപ്ത ഹീബ്രായ പ്രയോഗം അവകാശവാദമാണ്; സന്ദർഭത്തിലെ നിർദിഷ്ട ജലസ്രോതസ്സ് വ്യക്തമാക്കാൻ ‘ഈ വെള്ളം’ ഉപയോഗിച്ചു.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: അതുകൊണ്ട് അവൻ ആ കിണറിന് … എന്നു പേരിട്ടു
  rationale: ‘പേര് വിളിച്ചു’ എന്ന ഹീബ്രായ ശൈലിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘പേരിട്ടു’ എന്നു നൽകി; സംഭവഫലബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: עֵשֶׂק
  choice: ഏസെക്ക്
  rationale: കിണറിന്റെ പേരായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന ലിപ്യന്തരണം നൽകി; പദപ്രയോഗബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: കാരണം അവർ അവനുമായി തർക്കിച്ചിരുന്നു
  rationale: התעשקו എന്ന ക്രിയ ഏസെക്ക് എന്ന പേരിനോട് ശബ്ദ-ധാതുബന്ധമുള്ളതാണ്. ‘തർക്കിച്ചിരുന്നു’ ഈ ബന്ധത്തിന്റെ അർഥഘടകം പ്രകടമാക്കുന്നു; ഏകവചന സർവനാമം സന്ദർഭത്തിൽ യിസ്ഹാക്കിനെ സൂചിപ്പിക്കുന്നു.
