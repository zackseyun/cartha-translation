  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ കാലത്ത് ഉണ്ടായ ആദ്യത്തെ ക്ഷാമത്തിനു പുറമേ, ദേശത്ത് ഒരു ക്ഷാമമുണ്ടായി. അപ്പോൾ യിസ്ഹാക്ക് ഗെരാറിലെ[a] ഫെലിസ്ത്യരുടെ രാജാവായ അബീമേലെക്കിന്റെ അടുക്കൽ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗെരാറിലേക്ക്.” ‘ഗെരാരാ’ എന്ന ഹീബ്രു രൂപത്തിലെ ദിശാസൂചക അന്ത്യപ്രത്യയം ഗെരാറിലേക്കുള്ള സഞ്ചാരത്തെ വ്യക്തമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: ദേശത്ത് മറ്റൊരു ക്ഷാമമുണ്ടായി
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാഹചര്യാവതരണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. മִלְּבַד കൊണ്ടുള്ള മുൻക്ഷാമത്തോടുള്ള താരതമ്യം കണക്കിലെടുത്ത് ‘മറ്റൊരു’ എന്നു ചേർത്തത് ആവർത്തിച്ചുണ്ടായ ക്ഷാമമാണെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: ആദ്യത്തെ ക്ഷാമത്തിനു പുറമേ
  rationale: מִלְּבַד എന്നതിന്റെ ‘പുറമേ/കൂടാതെ’ എന്ന അർഥവും רִאשׁוֹן എന്ന ക്രമസൂചകത്തിന്റെ ‘ആദ്യത്തെ’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ കാലത്തുണ്ടായ
  rationale: ‘അബ്രാഹാമിന്റെ നാളുകളിൽ’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥസമവുമായ പ്രയോഗം.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: അതിനാൽ യിസ്ഹാക്ക് ... പോയി
  rationale: വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന wayyiqtol രൂപവും ക്ഷാമസാഹചര്യത്തെ തുടർന്നുള്ള യാത്രയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; യാത്രയുടെ ഉദ്ദേശ്യം ഇതിലപ്പുറം നിർവചിക്കുന്നില്ല.
- source_word: אֲבִימֶּלֶךְ מֶלֶךְ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ രാജാവായ അബീമേലെക്ക്
  rationale: ഹീബ്രു construct ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും പേരുകളും ജനനാമവും മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: גְּרָרָה
  choice: ഗെരാറിലെ
  rationale: പ്രധാന വാക്യത്തിൽ അബീമേലെക്കിന്റെ സ്ഥലം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം. ഹീബ്രുവിലെ ദിശാസൂചക -ָה കാരണം ‘ഗെരാറിലേക്ക്’ എന്ന വായനയും സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പְּלִשְׁתִּים എന്ന ചരിത്ര-ജനവിഭാഗനാമം
  choice: ഫെലിസ്ത്യർ
  alternative: ഫെലിസ്ത്യ ജനത
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ വിശേഷണമല്ല, ആഖ്യാനത്തിലെ സാധാരണ ജനവിഭാഗ-രാഷ്ട്രീയ നാമമാണ്; മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ മുൻക്ഷാമത്തോടുള്ള താരതമ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു. സ്ഥലസൂചനയിലെ യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
