lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: അങ്ങനെ … താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം കഴിഞ്ഞകാല ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മുൻവാക്യത്തിലെ ദൈവകല്പനയോടുള്ള യിസ്ഹാക്കിന്റെ പ്രതികരണമാണ് സന്ദർഭം; അതിനാൽ וַ എന്നതിന്റെ പരിണതിഫലം ‘അങ്ങനെ’ എന്നും, ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ പാർപ്പ്/വസിപ്പ് എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘താമസിച്ചു’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: בִּגְרָר
  choice: ഗെരാരിൽ
  rationale: בְּ സ്ഥലസൂചകമാണ്; മലയാളത്തിലെ ‘-ഇൽ’ വിഭക്തി ‘ഗെരാർ എന്ന സ്ഥലത്ത്’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു. സ്ഥലനാമം ഉറവിടഭാഷയെ പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു.
