- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: അവനോട് അസൂയപ്പെട്ടു
  rationale: קנא ഇവിടെ യിസ്ഹാക്കിന്റെ സമൃദ്ധിയെച്ചൊല്ലിയുള്ള അസൂയയാണ് സൂചിപ്പിക്കുന്നത്; ‘അസൂയപ്പെട്ടു’ ആ അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: ഈ ജനവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
