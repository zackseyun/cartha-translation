  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: ml
  text: അവർ അതിരാവിലെ എഴുന്നേറ്റ് പരസ്പരം ശപഥം ചെയ്തു. പിന്നെ യിസ്ഹാക്ക് അവരെ യാത്രയാക്കി; അവർ അവന്റെ അടുക്കൽനിന്ന് സമാധാനത്തോടെ പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; בַבֹּקֶר-നോടൊപ്പം ‘അതിരാവിലെ എഴുന്നേറ്റ്’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: וַיִּשָּׁבְעוּ
  choice: ശപഥം ചെയ്തു
  rationale: שׁבע എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് ‘ശപഥം ചെയ്യുക’ എന്നാണ് ഇവിടെ അർഥം; ഉടമ്പടി ഉറപ്പിക്കുന്ന ഔപചാരിക ഭാവം ഇത് നിലനിർത്തുന്നു.
- source_word: אִישׁ לְאָחִיו
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥം ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട്’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഇരുപക്ഷവും അന്യോന്യം ശപഥം ചെയ്തുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ് ‘പരസ്പരം’.
- source_word: וַיְשַׁלְּחֵם
  choice: അവരെ യാത്രയാക്കി
  rationale: שׁלח എന്ന പീയേൽ രൂപം ഇവിടെ അതിഥികളെ പറഞ്ഞയയ്ക്കുക/യാത്രയാക്കുക എന്ന അർഥത്തിലാണ്; ‘യാത്രയാക്കി’ വിടവാങ്ങൽസന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: അവർ അവന്റെ അടുക്കൽനിന്ന് ... പോയി
  rationale: הלך കൂടെ מֵאֵת വരുന്നത് ഒരാളുടെ സന്നിധിയിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: שָׁלוֹם ഇവിടെ സൗഹൃദപരമായ ബന്ധവും സുരക്ഷിതമായ യാത്രപുറപ്പെടലും ഉൾക്കൊള്ളുന്നു; ‘സമാധാനത്തോടെ’ ഈ ഇരട്ടഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ אִישׁ לְאָחִיו എന്ന പരസ്പരപ്രയോഗം അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു; പ്രത്യേക പാഠക്കുറിപ്പ് ആവശ്യമില്ല.
