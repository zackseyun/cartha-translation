  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: ml
  text: 'ഇസ്ഹാക്ക് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്നെ വെറുക്കുകയും നിങ്ങളുടെ ഇടയിൽനിന്ന് എന്നെ പറഞ്ഞയയ്ക്കുകയും ചെയ്തിട്ടും എന്തിനാണ് എന്റെ അടുക്കൽ വന്നത്?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ എന്നെ വെറുക്കുകയും നിങ്ങളുടെ ഇടയിൽനിന്ന് എന്നെ പറഞ്ഞയയ്ക്കുകയും ചെയ്തു; പിന്നെ എന്തിനാണ് എന്റെ അടുക്കൽ വന്നത്?” എബ്രായത്തിലെ സംയോജകപദം കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഉം/പിന്നെ” എന്നു പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് വിരോധമോ സാഹചര്യബന്ധമോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: ഇസ്ഹാക്ക് അവരോടു പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തിലെ സാധാരണ സംസാരപരിചയപ്പെടുത്തലായി אמר-നെ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി; אֲלֵהֶם അഭിസംബോധിതരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: ഇപ്പോൾ എന്തിനാണ് എന്റെ അടുക്കൽ വന്നത്?
  rationale: מַדּוּעַ എന്ന കാരണചോദ്യത്തിന് ‘എന്തിനാണ്’ സ്വാഭാവികമാണ്. സന്ദർശകർ അപ്പോൾ എത്തിയിരിക്കുന്ന സന്ദർഭഫലം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഇപ്പോൾ’ ചേർത്തു; ‘എന്റെ അടുക്കൽ’ אֵלַי-യുടെ ബന്ധദിശ നിലനിർത്തുന്നു.
- source_word: וְאַתֶּם
  choice: …ചെയ്തിട്ടും
  rationale: וְ ഇവിടെ വെറും സംയോജകമായ ‘ഉം’ എന്നതിലുപരി, അവരുടെ മുൻകാല ശത്രുതയ്ക്കും ഇപ്പോഴത്തെ വരവിനുമിടയിലെ വിരോധം സൂചിപ്പിക്കാം. ‘ചെയ്തിട്ടും’ ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שְׂנֵאתֶם אֹתִי
  choice: നിങ്ങൾ എന്നെ വെറുക്കുകയും
  rationale: שנא-യുടെ ശക്തമായ സാധാരണ അർഥമായ ‘വെറുക്കുക’ മൃദൂകരിക്കാതെ നിലനിർത്തി.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: എന്നെ പറഞ്ഞയയ്ക്കുകയും
  rationale: ഈ സന്ദർഭത്തിൽ שׁלח എന്നത് ഒരാളെ അവിടെനിന്ന് അയച്ചുകളയുന്നതാണ്. ‘പറഞ്ഞയയ്ക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘ഓടിച്ചുകളയുക’ മൂലക്രിയ ആവശ്യപ്പെടുന്നതിലധികം ശക്തമാകാം.
- source_word: מֵאִתְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: അവരുടെ സാന്നിധ്യത്തിൽനിന്നും സമൂഹത്തിൽനിന്നുമുള്ള വേർപാടിന്റെ ഭാവം ‘നിങ്ങളുടെ ഇടയിൽനിന്ന്’ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘അങ്ങ്’ പോലുള്ള അധിക ഔപചാരികതയും ‘ഓടിച്ചുകളഞ്ഞു’ പോലുള്ള അനാവശ്യ ശക്തീകരണവും ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
