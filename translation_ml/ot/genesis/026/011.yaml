    text: അക്ഷരാർഥത്തിൽ, “ഈ മനുഷ്യനെയോ അവന്റെ ഭാര്യയെയോ തൊടുന്നയാൾ.”
    reason: The Hebrew uses a definite singular participle, literally ‘the one who touches’; the main text uses the equally faithful generic Malayalam expression “തൊടുന്നവൻ.”
  revision_rationale: 'The revision retains the original’s concise legal proclamation while making the death-sentence formula more exact: it is emphatic, passive, and judicial rather than merely an obligation to undergo punishment. It also uses more idiomatic plural wording for the addressed populace and supplies an anchored lexical note corresponding to the audit-trail alternative for the generic participle.'
