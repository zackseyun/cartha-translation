id: GEN.26.11
reference: Genesis 26:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: ml
  text: 'അബീമേലെക്ക് സകല ജനങ്ങളോടും ഇങ്ങനെ കൽപ്പിച്ചു: “ഈ മനുഷ്യനെയോ അവന്റെ ഭാര്യയെയോ തൊടുന്നവൻ[a] നിശ്ചയമായും വധിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈ മനുഷ്യനെയോ അവന്റെ ഭാര്യയെയോ തൊടുന്നയാൾ.”
    reason: The Hebrew uses a definite singular participle, literally ‘the one who touches’; the main text uses the equally faithful generic Malayalam expression “തൊടുന്നവൻ.”
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: പീയേൽ രൂപം അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: സകല ജനത്തോടും
  rationale: അബീമേലെക്കിന്റെ അധികാരത്തിൻ കീഴിലുള്ള ജനസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഒരു വംശീയ ‘ജനത’ എന്ന അർഥം നിർബന്ധമല്ല.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഉദ്ധരണിസൂചക ക്രിയാനാമത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ കർത്തൃവാചക രൂപം പൊതുവായ ‘തൊടുന്നവൻ/ആരെങ്കിലും തൊട്ടാൽ’ എന്ന അർഥം നൽകുന്നു; അക്രമിക്കുക എന്ന ശക്തമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: בָּאִישׁ הַזֶּה
  choice: ഈ മനുഷ്യനെ
  rationale: נגע എന്ന ക്രിയയോടുള്ള ב സ്പർശിക്കപ്പെടുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ കർമവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: וּבְאִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയെയോ
  rationale: സന്ദർഭത്തിൽ אשה എന്നത് ഭാര്യയെ സൂചിപ്പിക്കുന്നു; ו conjunction ഇവിടെ പര്യായമായി സംരക്ഷിക്കപ്പെടുന്ന രണ്ടാമത്തെ വ്യക്തിയെ ബന്ധിപ്പിക്കുന്നതിനാൽ ‘-യെയോ’ ഉപയോഗിച്ചു.
- source_word: מוֹת יוּמָת
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ക്രിയാനാമത്തിന്റെ ഊന്നലോടുകൂടിയ ഹോഫാൽ രൂപം ഉറപ്പായ, അധികാരികൾ നടപ്പാക്കുന്ന മരണദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; വെറും സ്വാഭാവിക മരണമെന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: מוֹת יוּמָת എന്നതിലെ ശിക്ഷാവിധിയും ഊന്നലും
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  alternative: നിശ്ചയമായും കൊല്ലപ്പെടും
  rationale: ഹോഫാൽ രൂപത്തിന്റെ കാരണിത-കർമണി സ്വഭാവവും നിയമപരമായ ശിക്ഷാവിധിയും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; എന്നാൽ ശിക്ഷ നടപ്പാക്കുന്ന വ്യക്തിയെ പാഠത്തിൽ ഇല്ലാത്തവിധം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ പൊതുവായ കർത്തൃപ്രയോഗമായ ‘തൊടുന്നവൻ’ നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാന വികസനം ഒഴിവാക്കി.
