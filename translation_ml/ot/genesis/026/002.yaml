id: GEN.26.2
reference: Genesis 26:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ അവനു പ്രത്യക്ഷനായി പറഞ്ഞു: “ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോകരുത്. ഞാൻ നിന്നോടു പറയുന്ന ദേശത്തു താമസിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: നിഫാൽ രൂപം ഇവിടെ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു; പ്രത്യക്ഷതയുടെ രീതി അനാവശ്യമായി നിർവചിക്കാതെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אַל תֵּרֵד
  choice: ഇറങ്ങിപ്പോകരുത്
  rationale: אַל സഹിതമുള്ള അപൂർണക്രിയയുടെ നിരോധനാർഥവും ഈജിപ്തിലേക്കുള്ള യാത്രയെ ‘ഇറങ്ങുക’ എന്നു പറയുന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചക പ്രത്യയം ഈജിപ്തിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁכֹן
  choice: താമസിക്കുക
  rationale: שׁכן എന്ന ആജ്ഞാരൂപത്തിന്റെ പാർക്കുക/വസിക്കുക എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്തു
  rationale: ഇവിടെ אֶרֶץ ഭൂമിയെ മുഴുവനായി അല്ല, യിസ്ഹാക്ക് താമസിക്കേണ്ട പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറയുന്ന
  rationale: എബ്രായ അപൂർണക്രിയയ്ക്ക് സന്ദർഭത്തിൽ വരാനിരിക്കുന്ന ദൈവിക നിർദേശം എന്ന ഭാവമുണ്ടെങ്കിലും, ‘പറയുന്ന’ എന്ന രൂപം മൂലവാക്യത്തിന്റെ തുറന്ന കാലഭാവവും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹ്‌വെ’ നിലവിലെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: אֹמַר എന്ന അപൂർണക്രിയയുടെ കാലഭാവം
  choice: ഞാൻ നിന്നോടു പറയുന്ന
  alternative: ഞാൻ നിന്നോടു പറയാനിരിക്കുന്ന
  rationale: സന്ദർഭം ഭാവിയിലെ മാർഗനിർദേശത്തെ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായ രൂപം അതിനെ പൂർണമായി നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികവും താരതമ്യേന തുറന്നതുമായ രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഇറങ്ങിപ്പോകരുത്’ എന്നത് എബ്രായ യാത്രാപ്രയോഗം നിലനിർത്തുന്നു; ‘താമസിക്കുക’ അനാവശ്യമായ പുരാതനഭാഷാഭാവം ഒഴിവാക്കുന്നു.
