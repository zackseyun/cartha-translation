  to: 'അപ്പോൾ അബീമേലെക്ക് യിസ്ഹാക്കിനെ വിളിച്ചു പറഞ്ഞു: “അവൾ നിന്റെ ഭാര്യതന്നെയാണല്ലോ! പിന്നെ എങ്ങനെയാണ് ‘അവൾ എന്റെ സഹോദരിയാണ്’ എന്നു നീ പറഞ്ഞത്?” യിസ്ഹാക്ക് അവനോട് പറഞ്ഞു: “അവൾ നിമിത്തം ഞാൻ മരിച്ചുപോകുമോ എന്നു ഞാൻ പറഞ്ഞതുകൊണ്ടാണ്[a].”'
  rationale: The revision restores the explicit speech verb in Isaac’s explanation, preserves the apprehensive force of פֶּן with ‘മരിച്ചുപോകുമോ,’ and refines the footnote so that it explains the causal phrase and the contextual implication without expanding the main text.
