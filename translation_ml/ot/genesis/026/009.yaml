  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/יִצְחָ֗ק וַ/יֹּ֨אמֶר֙ אַ֣ךְ הִנֵּ֤ה אִשְׁתְּ/ךָ֙ הִ֔וא וְ/אֵ֥יךְ אָמַ֖רְתָּ אֲחֹ֣תִ/י הִ֑וא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יִצְחָ֔ק כִּ֣י אָמַ֔רְתִּי פֶּן אָמ֖וּת עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: ml
  text: 'അപ്പോൾ അബീമേലെക്ക് യിസ്ഹാക്കിനെ വിളിച്ചു പറഞ്ഞു: “അവൾ നിന്റെ ഭാര്യതന്നെയാണല്ലോ! പിന്നെ എങ്ങനെയാണ് ‘അവൾ എന്റെ സഹോദരിയാണ്’ എന്നു നീ പറഞ്ഞത്?” യിസ്ഹാക്ക് അവനോട് പറഞ്ഞു: “അവൾ നിമിത്തം ഞാൻ മരിച്ചുപോകുമോ എന്നു ഞാൻ പറഞ്ഞതുകൊണ്ടാണ്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവളെച്ചൊല്ലി ഞാൻ മരിക്കുമോ എന്ന്.” ‘അവൾ നിമിത്തം’ എന്നത് അവളെ കാരണം അല്ലെങ്കിൽ അവളെച്ചൊല്ലി എന്ന അർഥം നൽകുന്നു; അവളെ സ്വന്തമാക്കാൻ മറ്റുള്ളവർ തന്നെ കൊല്ലുമോ എന്ന ഭയമാണ് സന്ദർഭസൂചന.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: യിസ്ഹാക്കിനെ വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന לְ-യും ഇവിടെ ‘വിളിക്കുക’ അഥവാ ‘വരുത്തുക’ എന്ന അർഥം നൽകുന്നു. ‘വിളിച്ചു’ ആഖ്യാനത്തിന്റെ ലാളിത്യം നിലനിർത്തുന്നു.
- source_word: אַךְ הִנֵּה
  choice: ഭാര്യതന്നെയാണല്ലോ
  rationale: ഈ രണ്ട് കണങ്ങളും ചേർന്ന് അബീമേലെക്കിന്റെ ഉറച്ച തിരിച്ചറിവിനും ആശ്ചര്യത്തിനും ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ ‘തന്നെ... അല്ലോ’ എന്ന പ്രയോഗം അവയെ സ്വാഭാവികമായി ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ചോദ്യം ഇതിലൂടെ ചേർക്കുന്നില്ല.
- source_word: וְאֵיךְ
  choice: പിന്നെ എങ്ങനെയാണ്
  rationale: ബന്ധകവും ചോദ്യപദവും ചേർന്ന് കുറ്റപ്പെടുത്തലോടുകൂടിയ അതിശയചോദ്യം അവതരിപ്പിക്കുന്നു. ‘പിന്നെ എങ്ങനെയാണ്’ ആ ബന്ധവും ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲחֹתִי הִוא
  choice: അവൾ എന്റെ സഹോദരിയാണ്
  rationale: אחות എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘സഹോദരി’ നിലനിർത്തുന്നു; ഇവിടെ അതിനെ വിശാലമായ ബന്ധുപദമാക്കി മാറ്റേണ്ട സാഹചര്യമില്ല.
- source_word: כִּי אָמַרְתִּי
  choice: എന്നു കരുതിയാണ്
  rationale: വാചികമായി ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും, സ്വന്തം മനസ്സിൽ പറഞ്ഞതോ വിചാരിച്ചതോ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘കരുതി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്. כִּי നൽകുന്ന കാരണബന്ധം ‘-യാണ്’ എന്ന ഘടനയിൽ പ്രകടമാണ്.
- source_word: פֶּן אָמוּת
  choice: ഞാൻ മരിച്ചുപോയേക്കുമല്ലോ
  rationale: פֶּן ഭയപ്പെട്ടേക്കാവുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു. ‘മരിച്ചുപോയേക്കും’ സാധ്യതയും ‘-ല്ലോ’ ഉള്ളിലെ ആശങ്കയും പ്രകടമാക്കുന്നു; ‘കൊല്ലപ്പെടും’ എന്ന് മുഖ്യവാചകത്തിൽ പറഞ്ഞ് മൂലത്തിലെ ‘മരിക്കുക’ എന്നതിനെ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: עָלֶיהָ
  choice: അവൾ നിമിത്തം
  rationale: עַל ഇവിടെ കാരണം അഥവാ അവസരം സൂചിപ്പിക്കുന്നു. ‘അവൾ നിമിത്തം’ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്; ആരാണ് കൊല്ലുക എന്നത് മുഖ്യവാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. אַךְ הִנֵּה എന്ന ഊന്നൽ ‘ഭാര്യതന്നെയാണല്ലോ’ എന്നതിലൂടെ നൽകിയിരിക്കുന്നു. ദൈവശാസ്ത്രപരമായ പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല; യിസ്ഹാക്കിന്റെ ഭയത്തിന്റെ സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കിയിരിക്കുന്നു.
