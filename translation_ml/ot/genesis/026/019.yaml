source:
  edition: WLC
  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: ml
  text: പിന്നെ യിസ്ഹാക്കിന്റെ ദാസന്മാർ ആ നീർച്ചാലിൽ[a] കുഴിച്ചു; അവിടെ ജീവജലത്തിന്റെ[b] ഒരു കിണർ കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താഴ്‌വരയിൽ’ അല്ലെങ്കിൽ ‘നീർച്ചാലിന്റെ തടത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം പലപ്പോഴും കാലാവസ്ഥാനുസരിച്ച് വെള്ളമൊഴുകുന്ന ഒരു നീർച്ചാലിനെയോ അതിന്റെ തടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ജീവിക്കുന്ന വെള്ളം’; അതായത്, കെട്ടിക്കിടക്കുന്ന വെള്ളത്തിനു പകരം ഉറവിൽനിന്നുള്ള പുതുവെള്ളമോ ഒഴുകുന്ന വെള്ളമോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: കുഴിച്ചപ്പോൾ
  rationale: חפר എന്ന സാധാരണ ‘കുഴിക്കുക’ എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; തുടർന്നുള്ള കണ്ടെത്തലുമായി കഥാക്രമം സുഗമമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: עַבְדֵי יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ ദാസന്മാർ
  rationale: യിസ്ഹാക്കിന്റെ സേവനത്തിലുള്ളവരെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ അവരുടെ നിയമപരമായ അടിമസ്ഥിതി ഊന്നിപ്പറയുന്നില്ലാത്തതിനാൽ ‘ദാസന്മാർ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בַּנָּחַל
  choice: ആ നീർച്ചാലിൽ[a]
  rationale: נחל സാധാരണയായി കാലാനുസൃതമായി വെള്ളമൊഴുകുന്ന ചാലിനെയോ അതിന്റെ തടത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നീർച്ചാൽ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭൂമിശാസ്ത്രപരമായ സമാനപദമാണ്; അർത്ഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: അവിടെ … കണ്ടെത്തി
  rationale: שָׁם എന്ന സ്ഥലസൂചന നിലനിർത്തിക്കൊണ്ട് ലളിതമായ കഥാഖ്യാനശൈലി നൽകുന്നു.
- source_word: בְּאֵר
  choice: ഒരു കിണർ
  rationale: ഈ നാമത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘കിണർ’ ആണ്; അതിലെ വെള്ളത്തിന്റെ സ്വഭാവം തുടർന്നുള്ള പദസമുച്ചയം വ്യക്തമാക്കുന്നു.
- source_word: מַיִם חַיִּים
  choice: ജീവജലമുള്ള[b]
  rationale: ‘ജീവിക്കുന്ന വെള്ളം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകാത്മക ശക്തിയും പിന്നീടുള്ള വേദപുസ്തകപ്രതിധ്വനിയും ‘ജീവജലം’ സംരക്ഷിക്കുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് കെട്ടിക്കിടക്കുന്ന വെള്ളമല്ല, ഉറവിൽനിന്നുള്ള പുതുതോ ഒഴുകുന്നതോ ആയ വെള്ളമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
