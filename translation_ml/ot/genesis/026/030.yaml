id: GEN.26.30
reference: Genesis 26:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: ml
  text: അവൻ അവർക്കായി ഒരു വിരുന്നു ഒരുക്കി[a]; അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആഘോഷവിരുന്ന്’; എബ്രായപദം കുടിപാനത്തിന് ശ്രദ്ധേയമായ സ്ഥാനമുള്ള ഒരു വിരുന്നിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഒരുക്കി
  rationale: עשה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കി/ചെയ്തു’ എന്നാണെങ്കിലും, מִשְׁתֶּה എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ ഒരു വിരുന്നു സജ്ജമാക്കുകയോ ഏർപ്പെടുത്തുകയോ ചെയ്തുവെന്ന അർഥം സ്വാഭാവികമായി നൽകാൻ ‘ഒരുക്കി’ യോജിക്കുന്നു.
- source_word: לָהֶם
  choice: അവർക്കായി
  rationale: ഇവിടെ ל പ്രവർത്തിയുടെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക മലയാളത്തിൽ ‘അവർക്കായി’ വ്യക്തമായി നൽകുന്നു.
- source_word: מִשְׁתֶּה
  choice: വിരുന്നു
  rationale: ഈ പദം ഭക്ഷണത്തോടൊപ്പം മദ്യപാനത്തിനും പ്രാധാന്യമുള്ള ആഘോഷവിരുന്നിനെയോ സദ്യയെയോ സൂചിപ്പിക്കാം. തുടർന്ന് ‘ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു’ എന്നു വരുന്നതിനാൽ ‘വിരുന്നു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַיֹּאכְלוּ
  choice: അവർ ഭക്ഷിക്കുകയും
  rationale: אכל എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; അടുത്ത ഏകോപിത ക്രിയയുമായി ചേരാൻ ‘-ഉകയും’ ഘടന ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁתּוּ
  choice: കുടിക്കുകയും ചെയ്തു
  rationale: שתה എന്ന ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും, ഹീബ്രു വാക്യത്തിലെ തുടർച്ചയായ പ്രവർത്തനം മലയാളത്തിലെ സ്വാഭാവിക ഏകോപിത ക്രിയാഘടനയിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
