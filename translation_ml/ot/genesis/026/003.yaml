  terminology: ‘പരദേശിയായി താമസിക്കൂ,’ ‘സന്തതി,’ ‘അനുഗ്രഹിക്കും,’ and ‘സത്യം ... ഉറപ്പിക്കും’ are suitable and preserve the source’s theological and legal force without unnecessary interpretation.
