source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: ml
  text: ഈ ദേശത്ത് പരദേശിയായി താമസിക്കൂ[a]. ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും; നിന്നെ അനുഗ്രഹിക്കും. കാരണം, നിനക്കും നിന്റെ സന്തതിക്കും[b] ഈ ദേശങ്ങളെല്ലാം ഞാൻ തരും; നിന്റെ പിതാവായ അബ്രാഹാമിനോടു ഞാൻ ചെയ്ത സത്യം ഞാൻ ഉറപ്പിക്കും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ദേശത്ത് താൽക്കാലിക നിവാസിയായി പാർക്കൂ.’ ഹീബ്രായ ക്രിയയ്ക്ക് പരദേശിയോ താൽക്കാലിക നിവാസിയോ ആയി താമസിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിത്ത്’; ഇവിടെ ഈ പദം കൂട്ടമായി സന്തതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്ഥിരീകരിക്കും’ അല്ലെങ്കിൽ ‘നിറവേറ്റും.’
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: പരദേശിയായി താമസിക്കൂ
  rationale: ക്രിയയ്ക്ക് ഒരു ദേശത്ത് വിദേശിയോ താൽക്കാലിക നിവാസിയോ ആയി പാർക്കുക എന്ന സൂക്ഷ്മാർഥമുണ്ട്. സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്ത്
  rationale: വാഗ്ദത്തത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പശ്ചാത്തലത്തിൽ אֶרֶץ എന്നതിന് ‘ദേശം’ യോജിക്കുന്നു.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: ഞാൻ നിന്നോടുകൂടെ ഇരുന്നു
  rationale: ദൈവസാന്നിധ്യത്തിന്റെ നേരിട്ടുള്ള വാഗ്ദാനം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וַאֲבָרְכֶךָ
  choice: നിന്നെ അനുഗ്രഹിക്കും
  rationale: മുൻപുള്ള ദൈവിക വാഗ്ദാനത്തിന്റെ തുടർച്ചയായി ഭാവികാലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കും അനുഗ്രഹവാഗ്ദാനത്തിനും അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: നിനക്കും നിന്റെ സന്തതിക്കും
  rationale: זֶרַע ഇവിടെ കൂട്ടമായ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ ഏകവചനരൂപത്തിൽ ആ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ഈ ദേശങ്ങളെല്ലാം
  rationale: അടുത്തടുത്തായി പരിഗണിക്കപ്പെടുന്ന പ്രദേശങ്ങളുടെ ബഹുവചനവും മുൻപുള്ള ‘ദേശം’ എന്ന പദവുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וַהֲקִמֹתִי
  choice: ഞാൻ ഉറപ്പിക്കും
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ഇവിടെ മുമ്പ് ചെയ്ത സത്യത്തെ പ്രാബല്യത്തിൽ ഉറപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; ‘നിറവേറ്റും’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: ഞാൻ ചെയ്ത സത്യം
  rationale: ‘സത്യം ചെയ്യുക’ എന്നത് മലയാളത്തിൽ solemn oath എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രായിലെ നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകാതിരിക്കാൻ ചുരുക്കുന്നു.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: നിന്റെ പിതാവായ അബ്രാഹാമിനോടു
  rationale: ഇസഹാക്കുമായുള്ള ബന്ധവും വാഗ്ദത്തത്തിന്റെ തുടർച്ചയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടു ചെയ്ത സത്യത്തെ സ്ഥാപിക്കുന്നതിന്റെ അർഥം
  choice: ഞാൻ ചെയ്ത സത്യം ഞാൻ ഉറപ്പിക്കും
  alternative: ഞാൻ ചെയ്ത സത്യം ഞാൻ നിറവേറ്റും
  rationale: ഹീബ്രായിലെ വാക്ക് സത്യത്തെ സ്ഥാപിക്കുക, സ്ഥിരീകരിക്കുക, പ്രാബല്യത്തിൽ വരുത്തുക എന്നീ അർഥങ്ങൾക്ക് ഇടം നൽകുന്നു. മുഖ്യപാഠത്തിലെ ‘ഉറപ്പിക്കും’ ആ വ്യാപ്തി നിലനിർത്തുന്നു; നിറവേറ്റലെന്ന ആശയം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: זֶרַע എന്ന പദത്തിന്റെ കൂട്ടാർഥം
  choice: സന്തതി
  alternative: വിത്ത്; പിൻതലമുറക്കാർ
  rationale: ഈ വാക്യത്തിൽ ഇസഹാക്കിന്റെ വംശപരമ്പരയാണ് പ്രാഥമിക സൂചന. ‘സന്തതി’ കൂട്ടാർഥവും ഏകവചനരൂപവും സംരക്ഷിച്ച് അനാവശ്യമായ വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഏകവചന ‘നീ’ രൂപങ്ങൾ ഉപയോഗിച്ചു. ‘പരദേശിയായി’ എന്ന പദം മൂലക്രിയയിലെ താൽക്കാലിക/വിദേശനിവാസ സൂക്ഷ്മാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
