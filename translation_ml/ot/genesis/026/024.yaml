reference: Genesis 26:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: ml
  text: 'ആ രാത്രിയിൽ യഹ്‌വെ അവന് പ്രത്യക്ഷനായി അരുളിച്ചെയ്തു: “ഞാൻ നിന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവമാണ്. ഭയപ്പെടേണ്ടാ; ഞാൻ നിന്നോടുകൂടെ ഉണ്ട്. എന്റെ ദാസനായ അബ്രാഹാമിന്റെ നിമിത്തം ഞാൻ നിന്നെ അനുഗ്രഹിക്കുകയും നിന്റെ സന്തതിയെ വർധിപ്പിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֵּרָא אֵלָיו
  choice: അവനു പ്രത്യക്ഷനായി
  rationale: നിഫാൽ രൂപം സൂചിപ്പിക്കുന്ന ദൃശ്യമായ പ്രത്യക്ഷത നേരിട്ടും സ്വാഭാവികമായും പകർത്തുന്നു.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചനയും നിർദ്ദേശകപദത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: ഞാൻ നിന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവമാണ്
  rationale: അബ്രാഹാമിനെ യിസ്ഹാക്കിന്റെ പിതാവായി തിരിച്ചറിയിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ അവതരിപ്പിക്കുന്നു.
- source_word: אַל תִּירָא
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക കല്പനയുടെ ആശ്വാസകരമായ ശക്തി dignified, പൊതുവായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: ഞാൻ നിന്നോടുകൂടെ ഉണ്ട്
  rationale: ഭയപ്പെടാതിരിക്കാനുള്ള കാരണം സൂചിപ്പിക്കുന്ന כִּי മലയാളത്തിലെ വിരാമചിഹ്നവും തുടർവാക്യവും വഴി വ്യക്തമാണ്.
- source_word: וּבֵרַכְתִּיךָ
  choice: ഞാൻ നിന്നെ അനുഗ്രഹിക്കുകയും
  rationale: വാഗ്ദാനസന്ദർഭത്തിലെ ക്രിയയെ ഭാവികാല അർത്ഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: നിന്റെ സന്തതിയെ വർധിപ്പിക്കുകയും ചെയ്യും
  rationale: רבה എന്നതിന്റെ കാരണാത്മക അർത്ഥവും זרע എന്നതിന്റെ സമൂഹവാചകമായ വംശപരമ്പര അർത്ഥവും ഒരുമിച്ച് പകർത്തുന്നു.
- source_word: בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: എന്റെ ദാസനായ അബ്രാഹാമിനെപ്രതി
  rationale: അബ്രാഹാമിനെ ആധാരമാക്കിയുള്ള വാഗ്ദാനത്തിന്റെ കാരണ/ബന്ധപരമായ അടിസ്ഥാനം ചുരുക്കമായും ദൈവശാസ്ത്രപരമായ വിപുലീകരണമില്ലാതെയും നിലനിർത്തുന്നു.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസനായ
  rationale: ഇവിടെ അടിമത്തത്തിന്റെ സാമൂഹിക നിലയേക്കാൾ ദൈവവുമായുള്ള ഉടമ്പടിബന്ധവും സേവകസ്ഥാനവും മുൻനിൽക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ ലഭ്യമായ ഭാഷാശാസ്ത്ര തെളിവുകളോട് കൂടുതൽ ചേർന്ന രൂപമാണ്.
- issue: בַּעֲבוּר אַבְרָהָם עַבְדִּי എന്നതിലെ വാഗ്ദാനത്തിന്റെ അടിസ്ഥാനം
  choice: എന്റെ ദാസനായ അബ്രാഹാമിനെപ്രതി
  alternative: എന്റെ ദാസനായ അബ്രാഹാം നിമിത്തം
  rationale: ദൈവം യിസ്ഹാക്കിനു നൽകുന്ന അനുഗ്രഹത്തെ അബ്രാഹാമുമായുള്ള മുൻബന്ധത്തോട് ചേർക്കുന്നു; അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്ര പ്രവർത്തനം പാഠത്തിനു പുറത്തേക്ക് വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനസന്ദർഭത്തിന് യോജിച്ച മാന്യരൂപമായി ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കി. ഈ വാക്യത്തിൽ പ്രസിദ്ധീകരണത്തിന് ആവശ്യമായ യഥാർത്ഥ പാഠവ്യത്യാസമോ നിർബന്ധമായ വിശദീകരണക്കുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
