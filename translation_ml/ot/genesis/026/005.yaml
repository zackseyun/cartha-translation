source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: ml
  text: അബ്രാഹാം എന്റെ വാക്കു കേട്ടനുസരിക്കുകയും ഞാൻ ഏൽപ്പിച്ച ചുമതല[a], എന്റെ കൽപ്പനകൾ, എന്റെ ചട്ടങ്ങൾ, എന്റെ ഉപദേശങ്ങൾ[b] എന്നിവ പാലിക്കുകയും ചെയ്തതുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ കാത്തുപാലിക്കേണ്ട ചുമതല.’ എബ്രായപദം കാത്തുപാലിക്കാൻ ഏൽപ്പിച്ച കടമയെയോ ഉത്തരവാദിത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ നിയമങ്ങൾ.’ എബ്രായത്തിലെ ‘തോരാ’ എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ഉപദേശം, നിർദേശം, നിയമം എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: ചെയ്തതുകൊണ്ട്
  rationale: ഈ വാക്യം ചുറ്റുപാടിലുള്ള വാഗ്ദാനത്തിന്റെ കാരണം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: എന്റെ വാക്കു കേട്ടനുസരിക്കുകയും
  rationale: എബ്രായ പ്രയോഗത്തിലെ കേൾവിയുടെ രൂപകവും അനുസരണത്തിന്റെ അർത്ഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁמֹר
  choice: പാലിക്കുകയും
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ തുടർന്നുള്ള പദങ്ങളോടൊപ്പം ‘സൂക്ഷിക്കുക/ആചരിക്കുക’ എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְׁמַרְתִּי
  choice: ഞാൻ ഏൽപ്പിച്ച ചുമതല
  rationale: കാത്തുപാലിക്കാൻ ഏൽപ്പിച്ച ഉത്തരവാദിത്വം എന്ന സവിശേഷ അർത്ഥം സംരക്ഷിക്കുകയും തുടർന്നുള്ള ‘കല്പനകൾ’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ
  rationale: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിൽ സുതാര്യവും പതിവുമായ മലയാള പദമാണ്.
- source_word: חֻקּוֹתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: കല്പനകളിൽനിന്നും ഉപദേശങ്ങളിൽനിന്നും പദവ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന നിയമപരമായ പദം നൽകുന്നു.
- source_word: וְתוֹרֹתַי
  choice: എന്റെ ഉപദേശങ്ങൾ
  rationale: തോരാ എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘നിർദേശം/പഠിപ്പിക്കൽ’ എന്ന അർത്ഥം ഇവിടെ ബഹുവചനത്തിൽ നിലനിർത്തുന്നു; നിയമങ്ങൾ എന്ന വിവർത്തനവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
theological_decisions:
- issue: സീനായിക്ക് മുമ്പുള്ള ഉടമ്പടി-നിയമ പദസമുച്ചയത്തിന്റെ വിവർത്തനം
  choice: ചുമതല, കല്പനകൾ, ചട്ടങ്ങൾ, ഉപദേശങ്ങൾ എന്നീ വ്യത്യസ്ത പദങ്ങൾ നിലനിർത്തി.
  alternative: പട്ടികയെ ‘എന്റെ നിബന്ധനകളും നിയമങ്ങളും’ എന്നതുപോലെ ചുരുക്കുക; അല്ലെങ്കിൽ תורותי എന്നത് ‘നിയമങ്ങൾ’ എന്നു നൽകുക.
  rationale: അബ്രാഹാമിന്റെ സമഗ്രമായ അനുസരണം ഊന്നിപ്പറയുന്ന സമീപാർഥപദങ്ങളുടെ നിര മൂലപാഠത്തിൽ ഉണ്ട്. സീനായിക്ക് മുമ്പുള്ള അനുസരണവും പിന്നീട് കാണുന്ന തോരാ വിഭാഗങ്ങളും തമ്മിലുള്ള ബന്ധം ഒരു പ്രത്യേക സിദ്ധാന്തപ്രകാരം വിശദീകരിക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ നിയമപരമായ പദനിരയുടെ വ്യത്യാസവും ‘കേൾക്കുക’ എന്ന രൂപകത്തിലെ അനുസരണാർഥവും സംരക്ഷിച്ചിരിക്കുന്നു.
