  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: ml
  text: അവൻ അവിടെ താമസിച്ചിട്ട് ഏറെ നാളായപ്പോൾ, ഫെലിസ്ത്യരുടെ രാജാവായ അബീമേലെക്ക് ജനാലയിലൂടെ പുറത്തേക്കു നോക്കി. അപ്പോൾ ഇതാ, യിസ്ഹാക്ക് തന്റെ ഭാര്യയായ റിബെക്കയോടു കളിച്ചുകൊണ്ടിരിക്കുന്നത്[a] അവൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചിരിച്ചുകൊണ്ടിരിക്കുന്നത്,’ ‘സ്നേഹത്തോടെ കൊഞ്ചുന്നത്,’ അല്ലെങ്കിൽ ‘തഴുകുന്നത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ക്രിയ യിസ്ഹാക്കിന്റെ പേരുമായി പദബന്ധമുള്ളതും കളിതമാശയോ അടുപ്പമുള്ള പെരുമാറ്റമോ സൂചിപ്പിക്കാവുന്നതുമാണ്. റിബെക്ക തന്റെ ഭാര്യയാണെന്ന് വെളിപ്പെടുത്തുന്ന തരത്തിലുള്ള പെരുമാറ്റമാണ് ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: …ആയപ്പോൾ
  rationale: ഈ ഹീബ്രായ പ്രയോഗം തുടർന്നുവരുന്ന മുഖ്യസംഭവത്തിന്റെ കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി; വേറിട്ടു ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: അവൻ അവിടെ താമസിച്ചിട്ട് ഏറെ നാളായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനുവേണ്ടി അവിടത്തെ ദിവസങ്ങൾ നീണ്ടു’ എന്നാണെങ്കിലും, ദീർഘകാലത്തെ താമസമാണ് ഉദ്ദേശ്യം. അതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וַיַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: ജനാലയിലൂടെ പുറത്തേക്കു നോക്കി
  rationale: ഒരു സ്ഥാനത്തുനിന്ന് ജനാലയിലൂടെ പുറത്തേക്കു നോക്കുന്നതാണ് പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം; ‘താഴേക്കു നോക്കി’ എന്നു നിർബന്ധമായി വ്യക്തമാക്കേണ്ടതില്ല.
- source_word: וַיַּרְא וְהִנֵּה
  choice: അപ്പോൾ ഇതാ, … അവൻ കണ്ടു
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധയും കണ്ടെത്തലിന്റെ സജീവതയും ‘ഇതാ’ നിലനിർത്തുന്നു; മലയാള വാക്യക്രമത്തിനനുസരിച്ച് ‘കണ്ടു’ അവസാനം വെച്ചു.
- source_word: מְצַחֵק
  choice: ചിരിച്ചുകളിക്കുന്നത്
  rationale: צחק എന്ന ധാതുവിന്റെ ‘ചിരിക്കുക/കളിക്കുക’ എന്ന പദബന്ധം നിലനിർത്തുകയും, യിസ്ഹാക്കിന്റെ പേരുമായുള്ള ശബ്ദാർഥബന്ധം ഭാഗികമായി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. സന്ദർഭത്തിൽ ഭാര്യാഭർത്തൃബന്ധം വെളിപ്പെടുത്തുന്ന സ്നേഹപൂർവമോ അടുപ്പമുള്ളതോ ആയ പെരുമാറ്റമാണിത്; പ്രധാനവാചകത്തിൽ അതിനെ അതിരുകടന്ന് നിർവചിച്ചിട്ടില്ല.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയായ റിബെക്കയോടൊപ്പം
  rationale: മְצַחֵק എന്ന ക്രിയയുടെ പരസ്പര/സഹചാരസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘യോടൊപ്പം’ ഉപയോഗിച്ചു; ‘തന്റെ ഭാര്യയായ’ എന്നത് ഹീബ്രായത്തിലെ അനുബന്ധ തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
