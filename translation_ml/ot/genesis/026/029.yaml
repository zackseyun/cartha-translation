source:
  edition: WLC
  text: אִם תַּעֲשֵׂ֨ה עִמָּ֜/נוּ רָעָ֗ה כַּ/אֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּ/ךָ וְ/כַ/אֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּ/ךָ֙ רַק ט֔וֹב וַ/נְּשַׁלֵּֽחֲ/ךָ֖ בְּ/שָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: ml
  text: നീ ഞങ്ങൾക്കു ദോഷം ചെയ്യുകയില്ലെന്ന്[a]—ഞങ്ങൾ നിന്നെ തൊടാതിരുന്നതുപോലെയും, നിനക്കു നന്മമാത്രം ചെയ്യുകയും നിന്നെ സമാധാനത്തോടെ പറഞ്ഞയക്കുകയും ചെയ്തതുപോലെയും. നീ ഇപ്പോൾ യാഹ്‌വെയാൽ അനുഗ്രഹിക്കപ്പെട്ടവനാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “നീ ഞങ്ങൾക്കു ദോഷം ചെയ്താൽ.” ഇവിടെ אִם (“എങ്കിൽ”) ആവശ്യപ്പെടുന്ന ശപഥത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ചെയ്യുകയില്ലെന്ന്
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉടമ്പടി-ശപഥത്തിന്റെ ഉള്ളടക്കം ഇവിടെ തുടരുന്നതിനാൽ, എബ്രായത്തിലെ വ്യവസ്ഥാസൂചകമായ പദം മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ എന്ന രൂപത്തിൽ നൽകി. അക്ഷരാർഥമായ ‘എങ്കിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: നീ ഞങ്ങൾക്കു ദോഷം ചെയ്യുകയില്ല
  rationale: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ רָעָה എന്നത് പൊതുവായ തിന്മയെക്കാൾ മറ്റൊരാൾക്കു വരുത്തുന്ന ദോഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്. നിഷേധം മുൻവാക്യത്തിലെ ശപഥാഭ്യർഥനയിൽനിന്ന് മനസ്സിലാകുന്നു.
- source_word: לֹא נְגַעֲנוּךָ
  choice: ഞങ്ങൾ നിന്നെ തൊട്ടിട്ടില്ല
  rationale: נגע എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ദൃശ്യാർഥം നിലനിർത്തി; ഈ സന്ദർഭത്തിൽ ‘ഉപദ്രവിച്ചിട്ടില്ല’ എന്ന വിപുലാർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: നിനക്കു നന്മമാത്രം ചെയ്ത്
  rationale: רַק എന്ന ഊന്നൽ ‘മാത്രം’ എന്നതിലൂടെ കാത്തുസൂക്ഷിക്കുകയും സ്വാഭാവികമായ മലയാള ക്രിയാക്രമം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: നിന്നെ സമാധാനത്തോടെ പറഞ്ഞയച്ചതുപോലെയും
  rationale: שלח എന്നത് ഇവിടെ വെറുതെ പോകാൻ അനുവദിക്കുക എന്നതിലുപരി അയച്ചുവിടുക എന്ന അർഥത്തിലാണ്. בְּשָׁלוֹם എന്നതിന്റെ സുരക്ഷയും സമാധാനബന്ധവും ‘സമാധാനത്തോടെ’ നിലനിർത്തുന്നു.
- source_word: בְּרוּךְ יְהוָה
  choice: യാഹ്‌വെയാൽ അനുഗ്രഹിക്കപ്പെട്ടവൻ
  rationale: בְּרוּךְ എന്ന നിഷ്ക്രിയ കൃദന്തരൂപവും അനുഗ്രഹത്തിന്റെ കർത്താവായ ദൈവനാമവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പദവിയായി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: അബീമേലെക്കിന്റെ മുൻകാല പെരുമാറ്റത്തെക്കുറിച്ചുള്ള അവകാശവാദം
  choice: അവരുടെ വാക്കുകൾ അവകാശവാദമായി അതേപടി നിലനിർത്തി
  alternative: മുൻസംഭവങ്ങളോട് പൊരുത്തപ്പെടുത്താൻ വാക്കുകൾ മൃദൂകരിക്കുക
  rationale: ‘നന്മമാത്രം ചെയ്തു’ എന്ന പ്രസ്താവന സംസാരിക്കുന്നവരുടെ അവകാശവാദമാണ്; കഥയിലെ മുമ്പത്തെ സംഘർഷത്തിന്റെ വെളിച്ചത്തിൽ ഉണ്ടാകുന്ന സംഘർഷം പരിഭാഷകൻ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉടമ്പടി-ശപഥാഭ്യർഥനയുടെ തുടർച്ചയായതിനാൽ ആദ്യഭാഗത്തിന്റെ ആശ്രിതവാക്യസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു. ‘നന്മമാത്രം’, ‘സമാധാനത്തോടെ’ എന്നീ പദങ്ങൾ എബ്രായത്തിലെ ഊന്നലും ഉടമ്പടി-ബന്ധപരമായ ഭാവവും സംരക്ഷിക്കുന്നു.
