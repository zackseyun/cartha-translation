source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: ml
  text: യിസ്ഹാക്ക് ആ ദേശത്ത് വിതച്ചു; ആ വർഷം അവന് നൂറുമടങ്ങ് വിളവ് ലഭിച്ചു[a]. യഹ്‌വെ അവനെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നൂറ് അളവുകൾ ലഭിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അവൻ നൂറ് שְׁעָרִים കണ്ടെത്തി” എന്നാണ്; അസാധാരണമായി സമൃദ്ധമായ വിളവിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
