  choice: വിതച്ചു
  rationale: കൃഷിസന്ദർഭത്തിൽ זרע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം വിത്തു വിതയ്ക്കുക എന്നതാണ്; മലയാളത്തിൽ സ്വാഭാവികവും കൃഷിചിത്രം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: בָּאָרֶץ הַהִוא
  choice: ആ ദേശത്ത്
  rationale: אֶרֶץ ഇവിടെ യിസ്ഹാക്ക് പാർത്തിരുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ അർഥം അമിതമായി നൽകാതെ 'ദേശം' സ്ഥലസൂചന വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמְצָא
  choice: ലഭിച്ചു
  rationale: מצא എന്നതിന്റെ അടിസ്ഥാനാർഥം 'കണ്ടെത്തുക' ആണെങ്കിലും, വിളവിന്റെ അളവോടുകൂടിയ ഈ കൃഷിസന്ദർഭത്തിൽ 'ലഭിച്ചു' എന്നത് ഫലം കൈവന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; 'കൊയ്തു' എന്നതിലധികം മൂലക്രിയയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ആ വർഷം
  rationale: എബ്രായത്തിലെ ലളിതമായ കാലസൂചനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: מֵאָה שְׁעָרִים
  choice: നൂറുമടങ്ങ് വിളവ്
  rationale: ഈ അപൂർവ കൃഷിപ്രയോഗം അസാധാരണമായ വിളവിനെ സൂചിപ്പിക്കുന്നു. 'വിളവ്' ചേർക്കുന്നത് മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു; എന്നാൽ കൃത്യമായ പുരാതന അളവാണോ മടങ്ങാണോ എന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְבָרֲכֵהוּ
  choice: അവനെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന പതിവ് ദൈവശാസ്ത്രപദത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം; ഭൗതിക സമൃദ്ധിയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ഉച്ചാരണലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാളത്തിലെ ആധുനിക ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
- issue: യിസ്ഹാക്കിന്റെ കാർഷികഫലം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: അവന് നൂറുമടങ്ങ് വിളവ് ലഭിച്ചു
  alternative: അവൻ നൂറുമടങ്ങ് കണ്ടെത്തി; അവൻ നൂറ് അളവ് നേടി; അവൻ നൂറുമടങ്ങ് കൊയ്തു
  rationale: מצא എന്ന ക്രിയയുടെ 'ലഭിക്കുക/കണ്ടെത്തുക' എന്ന സ്വഭാവവും കൃഷിസന്ദർഭത്തിലെ ഫലവും ഒരുമിച്ചു നൽകുന്നു. സമൃദ്ധിയുടെ ഉറവിടം അടുത്ത വാക്യഭാഗം യഹ്‌വെയുടെ അനുഗ്രഹമായി തന്നെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 'നൂറുമടങ്ങ് വിളവ് ലഭിച്ചു' എന്ന രൂപം മൂലത്തിലെ അപൂർവ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; പകരവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
