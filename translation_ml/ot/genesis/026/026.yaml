  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: ml
  text: പിന്നെ അബീമേലെക്ക് ഗെരാരിൽനിന്ന് അവന്റെ അടുക്കലേക്ക് തന്റെ സുഹൃത്തായ അഹൂസ്സത്തിനെയും[a] തന്റെ സൈന്യത്തിന്റെ സൈന്യാധിപനായ ഫീക്കോലിനെയും കൂട്ടിക്കൊണ്ടു ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തന്റെ കൂട്ടുകാരനായ അഹൂസ്സത്ത്.’ എബ്രായ പദത്തിന് വ്യക്തിപരമായ സുഹൃത്ത് എന്നും സഹചാരി അല്ലെങ്കിൽ അടുത്ത അനുയായി എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: പിന്നെ അബീമേലെക്ക്
  rationale: കഥനക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്ന waw-നെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പിന്നെ’ എന്നു നൽകി; വ്യക്തിനാമം മലയാള ബൈബിൾ പാരമ്പര്യത്തിന് യോജിച്ച വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָלַךְ אֵלָי/ו
  choice: അവന്റെ അടുക്കൽ ചെന്നു
  rationale: הלך എന്നത് പോകുക/നടക്കുക എന്ന അടിസ്ഥാനാർത്ഥമുള്ളതെങ്കിലും, ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടുക്കൽ ചെന്നു’ എന്നു പ്രകടമാകുന്നു; സർവനാമം മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: מִ/גְּרָר
  choice: ഗെരാരിൽനിന്ന്
  rationale: מן എന്ന ഉറവിടസൂചക വിഭക്തിയെ ‘-ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: וַ/אֲחֻזַּת מֵֽרֵעֵ/הוּ
  choice: അവന്റെ സുഹൃത്തായ അഹൂസ്സത്ത്
  rationale: מֵרֵעֵהוּ ഇവിടെ വ്യക്തിപരമായ സുഹൃത്തിനെയോ കൂട്ടാളിയെയോ സൂചിപ്പിക്കാം. ഉറപ്പില്ലാത്ത ഔദ്യോഗിക ‘ഉപദേഷ്ടാവ്’ എന്ന അർത്ഥം മുഖ്യവാചകത്തിൽ ചുമത്താതെ കൂടുതൽ നേരിട്ടുള്ള ‘സുഹൃത്ത്’ സ്വീകരിച്ചു.
- source_word: וּ/פִיכֹל שַׂר צְבָא/וֹ
  choice: സൈന്യാധിപനായ ഫീക്കോൽ
  rationale: שַׂר צְבָא എന്ന സൈനിക പദവിക്ക് വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാളം ‘സൈന്യാധിപൻ’ ആണ്; അവന്റെ സൈന്യമെന്ന ബന്ധം സന്ദർഭത്തിൽ അബീമേലെക്കിനോടുള്ള പദവിയിലൂടെ വ്യക്തമാണ്.
