translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ സർവനാമപരാമർശം നിലനിർത്തുകയും, അനുഗമിച്ചവരുടെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘അവനോടൊപ്പം ... ഉണ്ടായിരുന്നു’ എന്ന ഘടനയിൽ നൽകുകയും ചെയ്തു.
