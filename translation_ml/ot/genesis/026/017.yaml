id: GEN.26.17
reference: Genesis 26:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ מִ/שָּׁ֖ם יִצְחָ֑ק וַ/יִּ֥חַן בְּ/נַֽחַל גְּרָ֖ר וַ/יֵּ֥שֶׁב שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: ml
  text: അങ്ങനെ യിസ്ഹാക്ക് അവിടെനിന്ന് പോയി ഗെരാർ താഴ്‌വരയിൽ[a] പാളയമടിച്ചു; അവിടെ താമസമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഗെരാർ വാദിയിൽ.” എബ്രായപദം കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന നീർച്ചാൽ, മലയിടുക്ക്, അല്ലെങ്കിൽ താഴ്‌വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: അവിടെനിന്ന് പോയി
  rationale: കഥാസന്ദർഭത്തിലെ മുൻ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּחַן
  choice: പാളയമടിച്ചു
  rationale: חנה എന്ന ക്രിയയുടെ പാളയം സ്ഥാപിക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּנַחַל גְּרָר
  choice: ഗെരാർ താഴ്‌വരയിൽ
  rationale: נחל എന്ന പദത്തിന് കാലിക നീരൊഴുക്കിന്റെ ചാൽ, മലയിടുക്ക്, താഴ്‌വര എന്നീ അർഥസാധ്യതകളുണ്ട്; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭൂമിശാസ്ത്രപദമായി ‘താഴ്‌വര’ തിരഞ്ഞെടുത്തു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיֵּשֶׁב שָׁם
  choice: അവിടെ താമസമാക്കി
  rationale: പാളയമടിച്ചതിനുശേഷം അവിടെ പാർപ്പുറപ്പിച്ചതെന്ന ആഖ്യാന പുരോഗതി ישב എന്ന പദത്തിന്റെ അർഥപരിധിക്കുള്ളിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഭൂമിശാസ്ത്രപരമായ നחל എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
