source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַ/יַּגִּ֣דוּ ל֔/וֹ עַל אֹד֥וֹת הַ/בְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַ/יֹּ֥אמְרוּ ל֖/וֹ מָצָ֥אנוּ מָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: ml
  text: ആ ദിവസം[a] യിസ്ഹാക്കിന്റെ ദാസന്മാർ[b] വന്ന്, തങ്ങൾ കുഴിച്ച കിണറിനെക്കുറിച്ച് അവനോടു അറിയിച്ചു. അവർ അവനോടു, “ഞങ്ങൾ വെള്ളം കണ്ടെത്തിയിരിക്കുന്നു” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആ ദിവസം” എന്നതിന് “അതേ ദിവസം” എന്നും അർഥമാക്കാം; മുൻപറഞ്ഞ ഉടമ്പടി നടന്ന ദിവസം തന്നെയാണെന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ദാസന്മാർ” എന്നതിനു “അടിമകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രായ പദത്തിന് അടിമത്തബന്ധത്തിലുള്ള വീട്ടുജോലിക്കാരെയും സൂചിപ്പിക്കാനാകും. എന്നാൽ ഇവിടെ ആ സാമൂഹിക വശത്തിന് പ്രത്യേക ഊന്നൽ ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: അന്നുതന്നെ
  rationale: ഹീബ്രായ ആഖ്യാനസൂത്രവും കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; മുൻസംഭവങ്ങൾ നടന്ന അതേ ദിവസമാണെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: עַבְדֵי יִצְחָק
  choice: യിസ്ഹാക്കിന്റെ ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ വീട്ടുസേവകരോ തൊഴിലാളികളോ എന്ന പ്രവർത്തനപരമായ പശ്ചാത്തലമാണ് മുൻനിൽക്കുന്നത്, അതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു.
- source_word: וַיַּגִּדוּ לוֹ
  choice: അവനോട് അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: തങ്ങൾ കുഴിച്ച കിണറിനെക്കുറിച്ച്
  rationale: ബന്ധവാക്യത്തിലെ കർത്താവ് യിസ്ഹാക്കിന്റെ ദാസന്മാരാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കാനും, കുഴിക്കൽ റിപ്പോർട്ടിന് മുമ്പ് നടന്നതാണെന്ന ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാനും ‘തങ്ങൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: അവർ അവനോട് … എന്നു പറഞ്ഞു
  rationale: മൂലത്തിലെ രണ്ടാമത്തെ വ്യക്തമായ വാക്യപ്രവേശകം നിലനിർത്തുന്നു.
- source_word: מָצָאנוּ מָיִם
  choice: ഞങ്ങൾ വെള്ളം കണ്ടെത്തിയിരിക്കുന്നു
  rationale: കിണറ്റിൽ വെള്ളം ലഭിച്ചതിന്റെ ഇപ്പോഴും പ്രസക്തമായ ഫലം മലയാളത്തിലെ പൂർത്തകാലരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അളവിനെക്കുറിച്ച് മൂലത്തിൽ ഇല്ലാത്ത സൂചന ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രായത്തിലെ ആവർത്തിച്ചുള്ള സംസാരപ്രവേശകം നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
