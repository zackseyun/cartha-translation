  yaml_path: translation/ot/genesis/026/035.yaml
  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: ml
  text: അവർ യിസ്ഹാക്കിനും റിബെക്കയ്ക്കും മനോവ്യഥയ്ക്കു കാരണമായി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ യിസ്ഹാക്കിനും റിബെക്കയ്ക്കും മനോവ്യഥയായി.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ആത്മാവിന്റെ കയ്പ്”; ആഴമുള്ള മനോവിഷമത്തെയോ ദുഃഖത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: അവർ ... കാരണമായി
  rationale: മുൻവാക്യത്തിലെ ഏശാവിന്റെ ഭാര്യമാരെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ബഹുവചന ക്രിയയാണിത്. היה ഇവിടെ ഒരു അവസ്ഥയിലായിരുന്നതോ അങ്ങനെ ആയിത്തീർന്നതോ സൂചിപ്പിക്കാം; മലയാളത്തിൽ ‘കാരണമായി’ എന്ന പ്രയോഗം വാക്യബന്ധത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מֹרַת רוּחַ
  choice: മനോവ്യഥ
  rationale: അക്ഷരാർഥത്തിൽ ‘ആത്മാവിന്റെ കയ്പ്’ എന്ന എബ്രായ ശൈലി ആഴമുള്ള മനോവിഷമമോ ദുഃഖമോ പ്രകടിപ്പിക്കുന്നു. ‘മനോവ്യഥ’ അതിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: യിസ്ഹാക്കിനും റിബെക്കയ്ക്കും
  rationale: ആവർത്തിച്ച לְ ബാധിക്കപ്പെട്ട രണ്ടു വ്യക്തികളെയും പ്രത്യേകം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ സമാന്തര ദത്തിവിഭക്തി അത് വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം പ്രധാനവാചകത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർഥം ‘മനോവ്യഥ’യായി നൽകി; രൂപസവിശേഷത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
