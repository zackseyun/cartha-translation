id: GEN.26.16
reference: Genesis 26:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל יִצְחָ֑ק לֵ֚ךְ מֵֽ/עִמָּ֔/נוּ כִּֽי עָצַֽמְתָּ מִמֶּ֖/נּוּ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: ml
  text: 'അപ്പോൾ അബീമേലെക്ക് യിസ്ഹാക്കിനോടു പറഞ്ഞു: “ഞങ്ങളുടെ അടുത്തുനിന്ന് പോയിക്കൊൾക; കാരണം നീ ഞങ്ങളെക്കാൾ വളരെ ശക്തനായിത്തീർന്നിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞങ്ങളോടു താരതമ്യപ്പെടുത്തുമ്പോൾ നീ വളരെ പ്രബലനായിത്തീർന്നിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אֲבִימֶלֶךְ
  choice: അബീമേലെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֶל יִצְחָק
  choice: യിസ്ഹാക്കിനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; യിസ്ഹാക്ക് എന്നത് പരിചിതമായ മലയാള ലിപ്യന്തരണമാണ്.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: ഞങ്ങളുടെ അടുത്തുനിന്ന് പോയിക്കൊൾക
  rationale: ലֵךְ എന്ന ആജ്ഞയും ‘ഞങ്ങളോടൊപ്പമുള്ളിടത്തുനിന്ന്/ഞങ്ങളുടെ അടുത്തുനിന്ന്’ എന്ന വേർപാടിന്റെ അർഥമുള്ള מֵעִמָּנוּവും ഒരുമിച്ചു സ്വാഭാവികമായി പകർന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അബീമേലെക്കിന്റെ ആജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും നേരിട്ടുള്ളതുമായ ബന്ധപദം.
- source_word: עָצַמְתָּ
  choice: ശക്തനായിത്തീർന്നിരിക്കുന്നു
  rationale: עצם എന്ന ക്രിയയുടെ ശക്തനാകുക/പ്രബലനാകുക എന്ന അർഥവും സംഭവിച്ച വളർച്ചയുടെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയും പകർന്നു.
- source_word: מִמֶּנּוּ מְאֹד
  choice: ഞങ്ങളെക്കാൾ വളരെ
  rationale: מן എന്നതിന്റെ താരതമ്യപ്രയോഗവും מְאֹד നൽകുന്ന തീവ്രതയും യഥാക്രമം ‘ഞങ്ങളെക്കാൾ’, ‘വളരെ’ എന്നു പകർന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘പോയിക്കൊൾക’ ആജ്ഞയുടെ ഉറപ്പ് നിലനിർത്തുന്നു; ‘കാരണം’ സമകാലിക വായനക്കാർക്ക് കാരണംബന്ധം വ്യക്തമായി നൽകുന്നു. താരതമ്യത്തിന്റെ ബലവും ക്രിയയിലെ ‘ശക്തനായിത്തീരുക’ എന്ന ആശയവും മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചു.
