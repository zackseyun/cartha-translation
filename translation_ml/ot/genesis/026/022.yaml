id: GEN.26.22
reference: Genesis 26:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: ml
  text: 'അവൻ അവിടെനിന്ന് മാറി മറ്റൊരു കിണർ കുഴിച്ചു. അതിനെച്ചൊല്ലി അവർ വഴക്കുണ്ടാക്കിയില്ല. അതുകൊണ്ട് അവൻ അതിന് രെഹോബോത്ത്[a] എന്നു പേരിട്ടു പറഞ്ഞു: “ഇപ്പോൾ യഹോവ നമുക്കു വിശാലമായ ഇടം ഒരുക്കിയിരിക്കുന്നു; നാം ദേശത്ത് ഫലവത്താകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രെഹോബോത്ത്” എന്നത് “വിശാലമായ ഇടങ്ങൾ” എന്നർഥമുള്ള ഹീബ്രു പദമാണ്. “യഹോവ നമുക്കു വിശാലമായ ഇടം ഒരുക്കിയിരിക്കുന്നു” എന്ന യിസ്ഹാക്കിന്റെ വാക്കുകൾ ഈ പേരിനെ ആസ്പദമാക്കിയുള്ള പദപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: അവൻ അവിടെനിന്ന് മാറി
  rationale: עתק എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് മറ്റൊരിടത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മാറി’ സ്വാഭാവികവും അനാവശ്യമായ വിശദീകരണം ചേർക്കാത്തതുമാണ്.
- source_word: בְּאֵר אַחֶרֶת
  choice: മറ്റൊരു കിണർ
  rationale: ഹീബ്രു നാമപദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: അതിനെച്ചൊല്ലി അവർ വഴക്കുണ്ടാക്കിയില്ല
  rationale: ריב ഇവിടെ കിണറിന്റെ അവകാശത്തെച്ചൊല്ലിയുള്ള തർക്കം അല്ലെങ്കിൽ വഴക്ക് സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപ്രയോഗമാണിത്.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: അവൻ അതിന് രെഹോബോത്ത് എന്നു പേരിട്ട്
  rationale: ഹീബ്രു പേരിടൽസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: רְחֹבוֹת
  choice: രെഹോബോത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു; רחב എന്ന മൂലപദവുമായുള്ള പദപ്രയോഗബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: ഇപ്പോൾ യഹോവ നമുക്ക് ഇടം വിശാലമാക്കിയിരിക്കുന്നു
  rationale: רחב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘ഇടം വിശാലമാക്കുക/ഇടമൊരുക്കുക’ എന്ന ആശയം നൽകുന്നു. ‘ഇടം വിശാലമാക്കിയിരിക്കുന്നു’ എന്നത് രെഹോബോത്ത് എന്ന പേരുമായുള്ള ഹീബ്രു പദപ്രയോഗം ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു ബിരുദമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: നാം ഈ ദേശത്ത് ഫലസമൃദ്ധരാകും
  rationale: פרה എന്നത് ഫലവത്താകുക, വർധിക്കുക എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. ‘ഫലസമൃദ്ധരാകും’ എന്നത് അതിന്റെ രൂപകവും വർധനയുടെ സൂചനയും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ നിർദ്ദിഷ്ട ദേശം വ്യക്തമാക്കാൻ ‘ഈ ദേശത്ത്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ‘കർത്താവ്’ എന്ന ബിരുദംകൊണ്ട് പകരാതെ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: וּפָרִינוּ എന്നതിലെ അനുഗ്രഹ-വർധന സൂചന
  choice: ഫലസമൃദ്ധരാകും
  alternative: വർധിക്കും
  rationale: פרה എന്ന ക്രിയയുടെ ‘ഫലവത്താകുക’ എന്ന അടിസ്ഥാനരൂപകവും ഉല്പത്തിയിലെ അനുഗ്രഹഭാഷയുമായുള്ള സാധ്യതയുള്ള അനുരണനവും നിലനിർത്തുന്നു; അതിനെ വെറും സാമ്പത്തിക അഭിവൃദ്ധിയായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പേരും അതിന്റെ വ്യാഖ്യാനവും തമ്മിലുള്ള പദപ്രയോഗബന്ധം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
