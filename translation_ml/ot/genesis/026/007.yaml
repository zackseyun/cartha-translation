revisions:
- from: ആ സ്ഥലത്തെ പുരുഷന്മാർ അവന്റെ ഭാര്യയെക്കുറിച്ച് ചോദിച്ചപ്പോൾ, “അവൾ എന്റെ സഹോദരിയാണ്” എന്ന് അവൻ പറഞ്ഞു. “അവൾ എന്റെ ഭാര്യയാണ്” എന്നു പറയാൻ അവൻ ഭയപ്പെട്ടു. എന്തെന്നാൽ, “റിബെക്ക കാഴ്ചയ്ക്കു സുന്ദരിയായതിനാൽ ആ സ്ഥലത്തെ പുരുഷന്മാർ അവൾ നിമിത്തം എന്നെ കൊന്നുകളഞ്ഞേക്കാം” എന്ന് അവൻ കരുതി.[a]
  to: ആ സ്ഥലത്തെ പുരുഷന്മാർ അവന്റെ ഭാര്യയെക്കുറിച്ച് ചോദിച്ചപ്പോൾ, “അവൾ എന്റെ സഹോദരിയാണ്” എന്ന് അവൻ പറഞ്ഞു. “അവൾ എന്റെ ഭാര്യയാണ്” എന്നു പറയാൻ അവൻ ഭയപ്പെട്ടു; റിബെക്ക കാഴ്ചയ്ക്കു സുന്ദരിയായിരുന്നതിനാൽ ആ സ്ഥലത്തെ പുരുഷന്മാർ അവളെച്ചൊല്ലി തന്നെ കൊന്നുകളയുമോ എന്ന ഭയത്താൽ.
  rationale: 'The revision removes the unsupported explicit clause “എന്ന് അവൻ കരുതി” and its associated footnote. It retains the Hebrew sequence and rationale: Isaac called Rebekah his sister because he feared that the men of the place might kill him on account of her beauty. No footnote is needed for this straightforward rendering.'
