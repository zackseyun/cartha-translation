  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: ml
  text: ആ സ്ഥലത്തെ പുരുഷന്മാർ അവന്റെ ഭാര്യയെക്കുറിച്ച് ചോദിച്ചപ്പോൾ, “അവൾ എന്റെ സഹോദരിയാണ്” എന്ന് അവൻ പറഞ്ഞു. “അവൾ എന്റെ ഭാര്യയാണ്” എന്നു പറയാൻ അവൻ ഭയപ്പെട്ടു; റിബെക്ക കാഴ്ചയ്ക്കു സുന്ദരിയായിരുന്നതിനാൽ ആ സ്ഥലത്തെ പുരുഷന്മാർ അവളെച്ചൊല്ലി തന്നെ കൊന്നുകളയുമോ എന്ന ഭയത്താൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: ചോദിച്ചപ്പോൾ
  rationale: שׁאל എന്ന സാധാരണ ക്രിയയുടെ നേരായ അർഥമായ ‘ചോദിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; wayyiqtol രൂപത്തിന്റെ ആഖ്യാനക്രമം മലയാളത്തിലെ സമയോപവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: ആ സ്ഥലത്തെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്നതിലെ പുരുഷലിംഗസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ പ്രാദേശികബന്ധം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְאִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയെക്കുറിച്ച്
  rationale: שׁאל എന്ന ക്രിയയോടൊപ്പമുള്ള לְ ഇവിടെ അന്വേഷണത്തിന്റെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘യെക്കുറിച്ച്’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: אֲחֹתִי הִוא
  choice: അവൾ എന്റെ സഹോദരിയാണ്
  rationale: ഹീബ്രു തിരിച്ചറിയൽവാക്യം സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ, നേരിട്ടുള്ള സംഭാഷണമായി നൽകുന്നു.
- source_word: כִּי יָרֵא
  choice: എന്തെന്നാൽ … അവൻ ഭയപ്പെട്ടു
  rationale: כִּי മുൻപ്രസ്താവനയുടെ കാരണം നൽകുന്നു; ירא-യുടെ അർഥം ലളിതവും നിലവാരമുള്ളതുമായ ‘ഭയപ്പെട്ടു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר אִשְׁתִּי
  choice: “അവൾ എന്റെ ഭാര്യയാണ്” എന്നു പറയാൻ
  rationale: ഹീബ്രുവിൽ ‘എന്റെ ഭാര്യ’ മാത്രമാണെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിക്കായി സൂചിതമായ കർത്താവും വിധേയക്രിയയും ചേർക്കുന്നു.
- source_word: פֶּן יַהַרְגֻנִי
  choice: എന്നെ കൊന്നുകളഞ്ഞേക്കാം
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെട്ട സാധ്യതയെ ‘-േക്കാം’ പ്രകടിപ്പിക്കുന്നു; הרג-യ്ക്ക് നിയമപരമോ ധാർമികമോ ആയ അധിക അർഥം ചുമത്താതെ ‘കൊന്നുകളയുക’ ഉപയോഗിക്കുന്നു.
- source_word: עַל רִבְקָה
  choice: റിബെക്ക … അവൾ നിമിത്തം
  rationale: עַל ഇവിടെ കാരണം അഥവാ അവസരം സൂചിപ്പിക്കുന്നു. പേര് ആദ്യം നൽകി പിന്നെ സർവനാമം ഉപയോഗിക്കുന്നത് ആവർത്തനം കുറച്ച് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: טוֹבַת מַרְאֶה
  choice: കാഴ്ചയ്ക്കു സുന്ദരി
  rationale: ബാഹ്യരൂപം കാണാൻ മനോഹരമാണെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം, പഴഞ്ചൻ ഭാഷ ഒഴിവാക്കി, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רִבְקָה
  choice: റിബെക്ക
  rationale: ഹീബ്രു നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
