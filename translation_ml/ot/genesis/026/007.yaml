translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണവും യിസ്ഹാക്കിന്റെ ഉള്ളിലെ ഭയവും വേർതിരിക്കാൻ വാക്യവിഭജനം ഉപയോഗിച്ചു; മൂലത്തിലെ കാരണബന്ധവും ഒന്നാംപുരുഷ ചിന്തയും നിലനിർത്തി.
