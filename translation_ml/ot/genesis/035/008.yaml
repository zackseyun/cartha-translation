base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: ml
  text: റിബെക്കയെ മുലയൂട്ടി പരിചരിച്ച ദെബോറാ മരിച്ചു; അവളെ ബേഥേലിനു താഴെ, ഓക്കുമരത്തിന്റെ[a] ചുവട്ടിൽ അടക്കം ചെയ്തു. അതിന് അല്ലോൻ-ബാഖൂത്ത്[b] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ אַלּוֹן എന്ന വൃക്ഷപദം ‘ഓക്ക്’ എന്നോ ‘ടെറിബിന്ത്’ എന്നോ അർഥമാക്കാം; കൃത്യമായ വൃക്ഷയിനം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അല്ലോൻ-ബാഖൂത്ത്’ എന്നതിന് സാധ്യതയുള്ള അർഥം ‘വിലാപത്തിന്റെ ഓക്കുമരം’ എന്നാണ്; אַלּוֹן ‘ടെറിബിന്ത്’ എന്ന അർഥത്തിൽ എടുക്കുന്നുവെങ്കിൽ, ‘വിലാപത്തിന്റെ ടെറിബിന്ത്’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: പരിചാരിക
  rationale: ഈ പദം മുലയൂട്ടുകയും കുഞ്ഞിനെ പരിപാലിക്കുകയും ചെയ്യുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. ദെബോറയുടെ ദീർഘകാല പരിചരണപങ്ക് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കാൻ ‘പരിചാരിക’ തിരഞ്ഞെടുത്തു; ‘മുലയൂട്ടിയ പരിചാരിക’ കൂടുതൽ നിർദിഷ്ടമായ വിവർത്തനമാണ്.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: ബേഥേലിനു താഴെ
  rationale: ബേഥേലിനെക്കാൾ താഴ്ന്ന സ്ഥലമെന്ന സ്ഥാനസൂചന നിലനിർത്തുന്നു; ‘തെക്ക്’ എന്ന ദിശാസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: תַּחַת הָאַלּוֹן
  choice: കരുവേലകത്തിന്റെ ചുവട്ടിൽ
  rationale: תַּחַת എന്നതിന്റെ ‘ചുവട്ടിൽ/കീഴിൽ’ എന്ന അർഥവും אַלּוֹן എന്ന വൃക്ഷപദത്തിന്റെ സാധാരണ ‘oak’ എന്ന തിരിച്ചറിവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. കൃത്യമായ വൃക്ഷയിനം അനിശ്ചിതമായതിനാൽ പേരിന്റെ അർഥവിശദീകരണത്തിൽ ബദൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: എബ്രായ ക്രിയ മൂന്നാംപുരുഷ ഏകവചന കർത്തൃരൂപത്തിലാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല. മലയാളത്തിലെ കർത്താവിനെ പറയാത്ത സജീവപ്രയോഗം ആ അനിശ്ചിതത്വം നിലനിർത്തുകയും ‘അതിന്’ എന്നത് വൃക്ഷത്തെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: אַלּוֹן בָּכוּת
  choice: അല്ലോൻ-ബാഖൂത്ത്
  rationale: സ്ഥലനാമം മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; സുതാര്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַתִּקָּבֵר
  choice: അവളെ … അടക്കം ചെയ്തു
  rationale: നിഫാൽ രൂപത്തിന്റെ സംസ്കരിക്കപ്പെടുക എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവിക കർത്താവില്ലാ പ്രയോഗത്തിൽ നൽകുന്നു; അടക്കം ചെയ്ത വ്യക്തികളെ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: וַתָּמָת
  choice: മരിച്ചു
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു.
