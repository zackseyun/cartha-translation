  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ml
  text: 'ലേയയുടെ പുത്രന്മാർ: യാക്കോബിന്റെ ആദ്യജാതനായ[a] രൂബേൻ, ശിമെയോൻ, ലേവി, യെഹൂദാ, യിസ്സാഖാർ, സെബൂലൂൻ.'
