reference: Genesis 35:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/בֵּ֣ית אֵ֔ל וַֽ/יְהִי ע֥וֹד כִּבְרַת הָ/אָ֖רֶץ לָ/ב֣וֹא אֶפְרָ֑תָה וַ/תֵּ֥לֶד רָחֵ֖ל וַ/תְּקַ֥שׁ בְּ/לִדְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: ml
  text: അവർ ബേഥേലിൽനിന്ന് യാത്ര തിരിച്ചു. എഫ്രാത്തയിൽ എത്താൻ ഇനിയും കുറച്ചു ദൂരം ശേഷിക്കുമ്പോൾ റാഹേൽ പ്രസവിച്ചു; അവളുടെ പ്രസവം ദുഷ്കരമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൾ പ്രസവത്തിൽ കഷ്ടപ്പെട്ടു.”'
    reason: ഹീബ്രു പ്രയോഗം പ്രസവം ദുഷ്കരമായിരുന്നു എന്നോ പ്രസവത്തിൽ അവൾ കഷ്ടപ്പെട്ടു എന്നോ സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര തിരിച്ചു
  rationale: נסע എന്ന ക്രിയ ഇവിടെ പാളയം പിരിച്ച് തുടർയാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מִבֵּית אֵל
  choice: ബേഥേലിൽനിന്ന്
  rationale: സ്ഥലനാമമായ בֵּית אֵל മലയാളത്തിൽ പരിചിതമായ ‘ബേഥേൽ’ എന്ന ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: ഇനിയും കുറച്ചു ദൂരം ശേഷിക്കുമ്പോൾ
  rationale: അപൂർവമായ כִּבְרַת הָאָרֶץ എന്ന പ്രയോഗം കൃത്യമായ അളവ് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു നിർദിഷ്ട അളവ് ചേർക്കാതെ ശേഷിച്ചിരുന്ന ദൂരം എന്ന ആശയം നിലനിർത്തി.
- source_word: לָבוֹא אֶפְרָתָה
  choice: എഫ്രാത്തയിൽ എത്താൻ
  rationale: לോടുകൂടിയ infinitive ലക്ഷ്യസ്ഥാനത്തെത്താനുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു; മുൻപ്രയോഗത്തോട് ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: אֶפְרָתָה
  choice: എഫ്രാത്ത
  rationale: ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- source_word: וַתֵּלֶד רָחֵל
  choice: റാഹേൽ പ്രസവിച്ചു
  rationale: സ്ത്രീ കർത്താവായുള്ള Qal രൂപത്തിലെ ילד പ്രസവിക്കുക എന്നാണ്; സംക്ഷിപ്തവും നേരിട്ടുള്ളതുമായ വിവർത്തനം.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: അവളുടെ പ്രസവം ദുഷ്കരമായിരുന്നു
  rationale: קשה പ്രസവപ്രക്രിയയിലെ കഠിനതയെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിൽ ഇല്ലാത്ത വൈദ്യശാസ്ത്രപരമായ വിശദാംശങ്ങൾ ചേർക്കാതെ അത് വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അപൂർവമായ ദൂരപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും പ്രസവത്തിന്റെ കഠിനത നേരിട്ട് വ്യക്തമാക്കുകയും ചെയ്തു.
