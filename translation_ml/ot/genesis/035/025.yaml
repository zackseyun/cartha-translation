id: GEN.35.25
reference: Genesis 35:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֤י בִלְהָה֙ שִׁפְחַ֣ת רָחֵ֔ל דָּ֖ן וְ/נַפְתָּלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: ml
  text: 'റാഹേലിന്റെ ദാസിയായ ബിൽഹയുടെ പുത്രന്മാർ[a]: ദാനും നഫ്താലിയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘റാഹേലിന്റെ പരിചാരിക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ഹീബ്രായപദം താഴ്ന്ന സാമൂഹികനിലയിലുള്ള ഒരു സ്ത്രീസേവികയെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ ‘സ്ത്രീ അടിമ’ എന്ന അർഥവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്നത് בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്; ഇവിടെ വംശാവലിപ്പട്ടികയിലെ അടുത്ത വിഭാഗത്തെ അവതരിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ നേരിട്ടും സന്ദർഭോചിതവുമാണ്. മുൻവാക്യങ്ങളിൽനിന്നുള്ള പട്ടികയുടെ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിലൂടെ പ്രകടമാണ്.
- source_word: בִלְהָה
  choice: ബിൽഹ
  rationale: വ്യക്തിനാമം; മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁפְחַת
  choice: ദാസിയായ
  rationale: שִׁפְחָה താഴ്ന്ന സാമൂഹികനിലയിലുള്ള സ്ത്രീസേവികയെയോ സ്ത്രീ അടിമയെയോ സൂചിപ്പിക്കാം. ‘ദാസിയായ’ എന്നത് സ്ത്രീലിംഗസൂചനയും സാമൂഹിക ആശ്രിതാവസ്ഥയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പദത്തിന്റെ സാധ്യതാവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: רָחֵל
  choice: റാഹേലിന്റെ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്ത് ഹീബ്രായ സംയുക്തബന്ധം മലയാളത്തിലെ സംബന്ധികരൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: דָּן
  choice: ദാൻ
  rationale: വ്യക്തിനാമം; മൂല ഉച്ചാരണത്തോട് അടുത്ത ലിപ്യന്തരണം.
- source_word: וְ/נַפְתָּלִי
  choice: നഫ്താലിയും
  rationale: വ്യക്തിനാമത്തോടു ചേർന്ന ഹീബ്രായ സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് പട്ടികയുടെ ലളിതമായ ഏകോപനമായി നൽകി.
