translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-പട്ടികാശൈലി. മൂലത്തിലെ നാമപദപ്രധാനമായ ഘടനയും കൊളോൺ സൂചിപ്പിക്കുന്ന പട്ടികാവതരണവും നിലനിർത്തി; ശִׁפְחָה എന്ന പദത്തിന്റെ സാമൂഹിക അർഥവ്യാപ്തി മുഖ്യവാചകത്തിൽ അതിയായി നിർണ്ണയിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
