  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് തന്റെ വീട്ടുകാരോടും തന്നോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരോടും പറഞ്ഞു: “നിങ്ങളുടെ ഇടയിലുള്ള അന്യദേവന്മാരെ നീക്കിക്കളയുക[a]; നിങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കുക[b]; നിങ്ങളുടെ വസ്ത്രങ്ങൾ മാറ്റുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യദേവന്മാർ’ എന്നതിന് ‘അന്യജനങ്ങളുടെ ദേവന്മാർ’ അല്ലെങ്കിൽ ‘വിദേശ ദേവന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കുക’ എന്നത് ദൈവത്തെ സമീപിക്കുന്നതിനുള്ള ഒരുക്കമായ ആചാരപരമായ ശുദ്ധീകരണത്തെ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: തന്റെ കുടുംബത്തോട്
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ വീട്’ എന്നാണെങ്കിലും, ഇവിടെ ഭൗതിക കെട്ടിടമല്ല യാക്കോബിന്റെ ഗൃഹസമൂഹമാണ് ഉദ്ദേശ്യം; ‘കുടുംബം’ ആ സാമൂഹിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: തന്നോടുകൂടെ ഉണ്ടായിരുന്ന എല്ലാവരോട്
  rationale: യാക്കോബിനോടൊപ്പം സഞ്ചരിച്ചിരുന്ന ആളുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ഈ പ്രയോഗം വ്യക്തികളെ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: הָסִרוּ
  choice: നീക്കിക്കളയുക
  rationale: അവരുടെ ഇടയിൽ ഉണ്ടായിരുന്ന അന്യദേവന്മാരെ ഉപേക്ഷിച്ച് അകറ്റണമെന്ന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: അന്യദേവന്മാർ
  rationale: വിദേശികളുടെയോ അന്യാരാധനയുടെയോ ദേവന്മാർ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അപരിചിത ദേവന്മാർ’ എന്ന പരിമിത അർഥം ഒഴിവാക്കുന്നു.
- source_word: בְּתֹכְכֶם
  choice: നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: ‘നിങ്ങളുടെ മധ്യേ’ എന്ന മൂലാർഥം നിലനിർത്തുകയും സമൂഹത്തിലെ സാന്നിധ്യവും കൈവശമുണ്ടായിരുന്നതും ഉൾക്കൊള്ളാവുന്ന വിശാലത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִטַּהֲרוּ
  choice: നിങ്ങളെത്തന്നെ ശുദ്ധീകരിച്ച്
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനിർദ്ദേശക ഭാവം പ്രകടമാക്കുകയും ദൈവസന്നിധിയിലേക്കുള്ള ഒരുക്കവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ ശുദ്ധീകരണസാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהַחֲלִיפוּ
  choice: മാറ്റുക
  rationale: വസ്ത്രങ്ങളോടൊപ്പം ഉപയോഗിക്കുമ്പോൾ ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുമുള്ള മലയാള തുല്യപദമാണിത്.
- source_word: שִׂמְלֹתֵיכֶם
  choice: വസ്ത്രങ്ങൾ
  rationale: പുറങ്കുപ്പായങ്ങളെയോ ഉടുപ്പുകളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന് ആധുനികവും മാന്യവുമായ പൊതുമലയാള പദം.
theological_decisions:
- issue: ശുദ്ധീകരണ ആജ്ഞയുടെ സ്വഭാവം
  choice: ആചാരപരമോ ഉടമ്പടിസംബന്ധമോ ആയ ശുദ്ധീകരണസാധ്യത തുറന്നുവയ്ക്കുന്ന ‘നിങ്ങളെത്തന്നെ ശുദ്ധീകരിച്ച്’ എന്ന പരിഭാഷ
  alternative: പൊതുവായ അർഥം മാത്രം മുൻനിർത്തുന്ന ‘നിങ്ങളെത്തന്നെ വൃത്തിയാക്കുക’
  rationale: വിഗ്രഹങ്ങൾ നീക്കുന്നതും ദൈവത്തെ സമീപിക്കാനുള്ള ഒരുക്കവും സന്ദർഭത്തിലുണ്ട്. അതിനാൽ മൂലപാഠം വ്യക്തമാക്കുന്നതിലധികം ആചാരക്രമം ചേർക്കാതെ ശുദ്ധീകരണത്തിന്റെ ദൈവാരാധനാസംബന്ധമായ ഭാരം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആജ്ഞകളുടെ ശക്തിയും മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും നിലനിർത്തി; ‘ശുദ്ധീകരിക്കുക’ എന്ന പ്രയോഗത്തിൽ ഉള്ള ആചാരപരമായ സാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
