  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: ml
  text: അപ്പോൾ അവർ തങ്ങളുടെ കൈവശമുണ്ടായിരുന്ന സകല അന്യദേവന്മാരെയും കാതുകളിലുണ്ടായിരുന്ന വളയങ്ങളെയും[a] യാക്കോബിനു കൊടുത്തു. യാക്കോബ് അവയെ ശെഖേമിനടുത്തുള്ള ടെരെബിന്ത് വൃക്ഷത്തിന്റെ[b] കീഴിൽ ഒളിപ്പിച്ചുവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കമ്മലുകളെയും’. എബ്രായപദം ശരീരത്തിന്റെ വ്യത്യസ്ത ഭാഗങ്ങളിൽ ധരിക്കുന്ന വളയങ്ങളെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ തുടർന്നുള്ള വാക്കുകൾ അവ കാതുകളിലായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഓക്കുമരത്തിന്റെ’. എബ്രായപദം കൂടുതൽ കൃത്യമായി ടെരെബിന്ത് വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: അപ്പോൾ അവർ ... യാക്കോബിനു കൊടുത്തു
  rationale: വയ്യിഖ്തോൽ രൂപത്തിന്റെ ആഖ്യാനക്രമം ‘അപ്പോൾ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; אֶל പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യാക്കോബിനു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: സകല അന്യദേവന്മാരെയും
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് യാക്കോബിന്റെ കുടുംബം ഉപേക്ഷിക്കേണ്ട അന്യാരാധനയുമായി ബന്ധപ്പെട്ട ദേവന്മാരെയാണ്; ‘അന്യദേവന്മാർ’ വ്യക്തവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: אֲשֶׁר בְּיָדָם
  choice: തങ്ങളുടെ കൈവശമുണ്ടായിരുന്ന
  rationale: അക്ഷരാർഥം ‘അവരുടെ കൈയിൽ ഉണ്ടായിരുന്ന’ എന്നാണ്. മലയാളത്തിൽ ഉടമസ്ഥതയെയും യഥാർഥ കൈവശത്തെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളാൻ ‘കൈവശമുണ്ടായിരുന്ന’ എന്നു നൽകി.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: കാതുകളിലുണ്ടായിരുന്ന വളയങ്ങളെയും
  rationale: נְזָמִים എന്ന പദത്തിന് മൂക്കിലോ കാതിലോ ധരിക്കുന്ന വളയങ്ങൾ എന്നർഥമാകാം; തുടർന്നുള്ള വാക്യഭാഗം കാതുകളിലാണ് അവ ഉണ്ടായിരുന്നതെന്ന് വ്യക്തമാക്കുന്നതിനാൽ പൊതുവായ ‘വളയങ്ങൾ’ നിലനിർത്തി.
- source_word: וַיִּטְמֹן אֹתָם
  choice: അവയെ ... ഒളിപ്പിച്ചുവച്ചു
  rationale: טמן എന്ന ക്രിയയ്ക്ക് ഒളിപ്പിക്കുക, മറച്ചുവയ്ക്കുക, കുഴിച്ചിടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. വസ്തുക്കൾ മണ്ണിൽ കുഴിച്ചിട്ടുവെന്ന് പാഠം നിർബന്ധമായി പറയാത്തതിനാൽ വിശാലമായ അർഥമുള്ള ‘ഒളിപ്പിച്ചുവച്ചു’ തിരഞ്ഞെടുത്തു.
- source_word: תַּחַת הָאֵלָה
  choice: ടെരെബിന്ത് വൃക്ഷത്തിന്റെ കീഴിൽ
  rationale: אֵלָה സാധാരണയായി ഓക്കിനേക്കാൾ പ്രത്യേകമായി ടെരെബിന്ത് വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു. സസ്യനാമം മലയാളലിപിയിൽ നൽകിയതോടൊപ്പം പാദക്കുറിപ്പിൽ പരമ്പരാഗത വ്യത്യസ്ത വിവർത്തനം സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: ശെഖേമിനടുത്തുള്ള
  rationale: സ്ഥലനാമത്തോടൊപ്പം עִם ഇവിടെ സാമീപ്യം സൂചിപ്പിക്കുന്നു; ‘ശെഖേമിനടുത്തുള്ള’ എന്നത് സ്വാഭാവികമായ മലയാള സ്ഥലവിവരണമാണ്.
theological_decisions:
- issue: വളയങ്ങൾക്ക് വിഗ്രഹാരാധനാപരമായ സ്വഭാവമുണ്ടായിരുന്നോ എന്ന ചോദ്യം
  choice: അന്യദേവന്മാരെയും വളയങ്ങളെയും വേർതിരിച്ച വസ്തുക്കളായി മാത്രം പരാമർശിച്ചു; വളയങ്ങളുടെ മതപരമായ ഉപയോഗം നിർണയിച്ചില്ല.
  alternative: വളയങ്ങൾ തായത്തുകളോ വിഗ്രഹാരാധനാ ചിഹ്നങ്ങളോ ആയിരുന്നുവെന്ന് വ്യക്തമാക്കുക.
  rationale: അന്യദേവന്മാരെ പാഠം വ്യക്തമായി തിരിച്ചറിയുന്നുണ്ടെങ്കിലും വളയങ്ങൾ സ്വതവേ വിഗ്രഹാരാധനാപരമായിരുന്നോ, മുൻകാല ആചാരങ്ങളുമായി ബന്ധപ്പെട്ട ആഭരണങ്ങൾ മാത്രമായിരുന്നോ എന്ന് വിശദീകരിക്കുന്നില്ല. ആ അനിശ്ചിതത്വം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. അപരിചിതമായ സസ്യനാമത്തിന് ‘വൃക്ഷം’ ചേർത്ത് അർഥം വ്യക്തമാക്കുകയും വ്യത്യസ്ത തിരിച്ചറിയൽ പാദക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. മൂലപാഠം പറയാത്ത വിധത്തിൽ വളയങ്ങളുടെ മതപരമായ പ്രാധാന്യമോ വസ്തുക്കൾ കുഴിച്ചിട്ട രീതിയോ വിശദീകരിച്ചിട്ടില്ല.
