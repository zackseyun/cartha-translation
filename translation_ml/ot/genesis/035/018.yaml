  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: ml
  text: അവളുടെ ജീവൻ വിട്ടുപോകുമ്പോൾ—അവൾ മരിക്കുകയായിരുന്നു—അവൾ അവന് ബെൻ-ഓനി[a] എന്നു പേരിട്ടു; എന്നാൽ അവന്റെ അപ്പൻ അവന് ബെന്യാമീൻ[b] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബെൻ-ഓനി എന്ന പേരിന് ‘എന്റെ ദുഃഖത്തിന്റെ മകൻ’ എന്നോ ‘എന്റെ കഷ്ടതയുടെ മകൻ’ എന്നോ അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ബെന്യാമീൻ എന്ന പേരിന് ‘വലങ്കൈയുടെ മകൻ’ എന്നായിരിക്കാം അർഥം; ചിലർ അതിനെ ‘തെക്കിന്റെ മകൻ’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: അവളുടെ ജീവൻ വിട്ടുപോകുമ്പോൾ
  rationale: മരണസന്ദർഭത്തിൽ נֶפֶשׁ എന്നത് ‘ജീവൻ’ എന്ന അർഥത്തിൽ സ്വാഭാവികമാണ്; ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി സാങ്കേതികമായ മനുഷ്യശാസ്ത്രധാരണ അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു. בְ + infinitive construct കാലസംബന്ധമായി ‘...പോകുമ്പോൾ’ എന്നു നൽകി.
- source_word: כִּי מֵתָה
  choice: അവൾ മരിക്കുകയായിരുന്നു
  rationale: മുൻപ്രയോഗത്തെ വിശദീകരിക്കുന്ന ഈ വാക്യം പേരിടൽ നടന്നുകൊണ്ടിരുന്ന മരണവേളയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സമകാലികമായ പുരോഗമനഭാവം നിലനിർത്തി.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: ഹീബ്രായ പേരിടൽശൈലിയുടെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: בֶּן אוֹנִי
  choice: ബെൻ-ഓനി
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു; കഥയിൽ പ്രസക്തമായ അതിന്റെ സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: എന്നാൽ അവന്റെ അപ്പൻ അവന് ... എന്നു പേരിട്ടു
  rationale: וְ ഇവിടെ അമ്മ നൽകിയ പേരിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി; ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בִנְיָמִין
  choice: ബെന്യാമീൻ
  rationale: സ്ഥിരപ്രചാരമുള്ള മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു; വ്യുത്പത്തിയിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: മരണസന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ജീവൻ’ എന്നു നൽകി
  alternative: ‘ആത്മാവ്’
  rationale: നֶפֶשׁ ജീവൻ, ജീവിക്കുന്ന വ്യക്തി, അല്ലെങ്കിൽ ജീവശ്വാസം എന്നിവയെ സൂചിപ്പിക്കാം. ‘ജീവൻ’ എന്നത് കഥാസന്ദർഭം കൃത്യമായി അറിയിക്കുകയും ശരീരത്തിൽനിന്ന് അഭൗതിക ആത്മാവ് വേർപെടുന്നതിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾ പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അവയുടെ വ്യുത്പത്തിയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പേരുകൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
