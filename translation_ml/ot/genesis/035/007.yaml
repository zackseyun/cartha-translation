source:
  edition: WLC
  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: ml
  text: അവിടെ അവൻ ഒരു യാഗപീഠം പണിതു; ആ സ്ഥലത്തിന് ഏൽ-ബേഥേൽ[a] എന്നു പേരിട്ടു. കാരണം, അവൻ തന്റെ സഹോദരനിൽനിന്ന് ഓടിപ്പോയപ്പോൾ അവിടെ ദൈവം അവനു പ്രത്യക്ഷപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏൽ-ബേഥേൽ’ എന്നതിന് ‘ബേഥേലിന്റെ ദൈവം’ എന്നായിരിക്കാം അർത്ഥം.
    reason: സ്ഥലനാമമായി ലിപ്യന്തരിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സാദ്ധ്യമായ അർത്ഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: അവിടെ അവൻ ഒരു യാഗപീഠം പണിതു
  rationale: സ്ഥലസൂചകമായ שָׁםയും സാധാരണ ആഖ്യാനക്രിയയായ וַיִּבֶןയും വ്യക്തമായി നിലനിർത്തുന്നു; מִזְבֵּחַ എന്നതിന് സ്വാഭാവികമായ മലയാള ബൈബിൾപദം ‘യാഗപീഠം’ ആണ്.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: ആ സ്ഥലത്തിന് ... എന്നു പേരിട്ടു
  rationale: പേരിടൽസന്ദർഭത്തിലെ קרא + לְ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: אֵל בֵּית אֵל
  choice: ഏൽ-ബേഥേൽ
  rationale: ഇത് ആ സ്ഥലത്തിനു നൽകിയ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ സാദ്ധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപറഞ്ഞ പേരിടലിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁם נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: അവിടെ ദൈവം അവനു തന്നെത്താൻ വെളിപ്പെടുത്തിയിരുന്നു
  rationale: ദൈവിക സ്വയംവെളിപ്പെടുത്തലിന്റെ ഭാവം നിലനിർത്തുന്നു. മുൻകാല സംഭവത്തെ വിശദീകരിക്കുന്നതിനാൽ ‘വെളിപ്പെടുത്തിയിരുന്നു’ എന്നു നൽകി.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: അവൻ തന്റെ സഹോദരന്റെ അടുക്കൽനിന്ന് ഓടിപ്പോയപ്പോൾ
  rationale: בְּ + infinitive construct എന്ന സമയബന്ധം ‘പ്പോൾ’കൊണ്ട് സ്വാഭാവികമായി നൽകി; מִפְּנֵי എന്നത് ഇവിടെ ഒരാളിൽനിന്ന് രക്ഷപ്പെട്ടോടുന്ന അർത്ഥത്തിലാണ്.
theological_decisions:
- issue: אֱלֹהִים എന്ന രൂപത്തോടൊപ്പം ബഹുവചനക്രിയയായ נִגְלוּ വന്നിരിക്കുന്നത്
  choice: ദൈവം ... തന്നെത്താൻ വെളിപ്പെടുത്തിയിരുന്നു
  alternative: ദൈവം അവനു പ്രത്യക്ഷനായിരുന്നു; ദേവന്മാർ അവനു വെളിപ്പെട്ടിരുന്നു
  rationale: രൂപപരമായി ക്രിയ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിലെ സൂച്യം യാക്കോബിനു ബേഥേലിൽ സ്വയം വെളിപ്പെടുത്തിയ ഏകദൈവമാണ്. അതിനാൽ ബഹുദൈവസൂചന സൃഷ്ടിക്കാതെ ഏകവചനമായി പരിഭാഷപ്പെടുത്തി; എന്നാൽ സ്വയംവെളിപ്പെടുത്തലിന്റെ ആശയം നിലനിർത്തി.
- issue: אֵל בֵּית אֵל എന്നത് വിവർത്തനം ചെയ്യണമോ ലിപ്യന്തരണം ചെയ്യണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഏൽ-ബേഥേൽ’
  alternative: ‘ബേഥേലിന്റെ ദൈവം’
  rationale: വാക്യത്തിൽ ഇത് സ്ഥലത്തിനു നൽകിയ പേരാണ്. അതിനാൽ നാമരൂപം പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുകയും അതിന്റെ സാദ്ധ്യമായ അർത്ഥം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അടുക്കൽനിന്ന്’ എന്ന പ്രയോഗം ഓട്ടത്തിന്റെ വ്യക്തിപരമായ ഭീഷണിസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; വാക്യത്തിലെ രണ്ടാമത്തെ שָׁם ‘അവിടെ’ എന്നായി ആവർത്തിച്ചു.
