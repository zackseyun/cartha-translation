reference: Genesis 35:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: ml
  text: ദൈവം യാക്കോബിനോടു അവിടെ സംസാരിച്ച ആ സ്ഥലത്തിന് യാക്കോബ് ബേഥേൽ[a] എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേഥേൽ എന്ന പേരിന് ‘ദൈവത്തിന്റെ ഭവനം’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: പേരിട്ടു
  rationale: ‘പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം ‘പേരിട്ടു’ എന്നാണ്.
- source_word: הַמָּקוֹם
  choice: ആ സ്ഥലം
  rationale: നേരത്തേ സൂചിപ്പിച്ച സ്ഥലത്തെയാണ് നിർദ്ദിഷ്ടപദത്തോടുകൂടിയ രൂപം പരാമർശിക്കുന്നത്; മലയാളത്തിൽ ‘ആ സ്ഥലം’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: ദൈവം യാക്കോബിനോടു സംസാരിച്ച ആ സ്ഥലം
  rationale: אִתּוֹ എന്നത് ‘അവനോടു’ എന്ന അർഥത്തിൽ വരുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യാക്കോബിനോടു’ എന്നു വ്യക്തമാക്കി. שָׁם എന്ന സ്ഥലസൂചന മലയാളത്തിലെ ‘ആ സ്ഥലത്തിന്’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ക്രിയയും സന്ദർഭവും ഏകവചനത്തിലുള്ള ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു; പദാർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: אֱלֹהִים എന്ന രൂപത്തിന്റെ വചനാർഥം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: ഇവിടെ ദൈവം യാക്കോബിനോടു സംസാരിച്ചതെന്ന ഏകവചനപരമായ സന്ദർഭമാണ്; ബഹുവചന വിവർത്തനം വിവരണത്തെ തെറ്റിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘ആ സ്ഥലത്തിന്റെ പേര് വിളിച്ചു’ എന്ന പ്രയോഗം പദാനുപദമായി ആവർത്തിക്കാതെ ‘ആ സ്ഥലത്തിന് ... എന്നു പേരിട്ടു’ എന്ന് മലയാളീകരിച്ചു; שָׁם എന്ന സ്ഥലസൂചനയും ഇതിൽ നിലനിർത്തി.
