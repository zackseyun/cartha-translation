    rationale: The Hebrew says, literally, 'the place where God spoke with him there.' Although the construction is somewhat pleonastic, Malayalam can preserve it naturally with ‘അവിടെ’ in the relative clause.
  revised_text: ദൈവം യാക്കോബിനോടു അവിടെ സംസാരിച്ച ആ സ്ഥലത്തിന് യാക്കോബ് ബേഥേൽ[a] എന്നു പേരിട്ടു.
