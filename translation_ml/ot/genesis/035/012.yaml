id: GEN.35.12
reference: Genesis 35:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: ml
  text: ഞാൻ അബ്രാഹാമിനും യിസ്ഹാക്കിനും നൽകിയ[a] ദേശം നിനക്കു നൽകും; നിനക്കുശേഷം നിന്റെ സന്തതിക്കും[b] ഞാൻ ആ ദേശം നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അബ്രാഹാമിനും യിസ്ഹാക്കിനും നൽകിയിട്ടുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സന്തതി’ എന്നത് സമൂഹവാചക ഏകവചനത്തിന്റെ പരിഭാഷയാണ്; ‘വിത്ത്’ എന്നോ ‘പിൻതലമുറക്കാർ’ എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: പിതാക്കന്മാർക്കുള്ള വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ אֶרֶץ എന്നത് ഭൂമി മുഴുവനെയല്ല, നിർദിഷ്ടമായ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദേശം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: נָתַתִּי
  choice: നൽകിയ
  rationale: ഹീബ്രു ഖാതൽ രൂപം അബ്രാഹാമിനും യിസ്ഹാക്കിനും മുമ്പ് നൽകിയ ദാനത്തെയോ വാഗ്ദാനത്തെയോ സൂചിപ്പിക്കുന്ന ഭൂതകാലമായി നിലനിർത്തുന്നു.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: നിനക്കു നൽകും
  rationale: ക്രിയയോടു ചേർന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ദേശം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിൽ ആ കർമ്മം വീണ്ടും ആവർത്തിക്കാതെ സ്വാഭാവികമായി അർഥം വ്യക്തമാകുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע സമൂഹവാചക ഏകവചനമാണ്. ‘സന്തതി’ അതിന്റെ കൂട്ടായ ഏകവചനഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אַחֲרֶיךָ
  choice: നിനക്കുശേഷം
  rationale: കാലപരവും പിൻതലമുറയെ സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: ഞാൻ ആ ദേശം നൽകും
  rationale: ഹീബ്രുവിലെ ‘നൽകും’, ‘ദേശം’ എന്നീ പദങ്ങളുടെ ആവർത്തനം സന്തതിക്കുള്ള വാഗ്ദാനം പ്രത്യേകം വീണ്ടും ഉറപ്പിക്കുന്നതിനാൽ അത് പരിഭാഷയിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാക്കന്മാർക്കുള്ള ദേശവാഗ്ദാനത്തിലെ ഭൂതകാല-ഭാവികാല ബന്ധം
  choice: നָתַתִּי എന്നത് ‘നൽകിയ’ എന്നും തുടർന്നുള്ള ക്രിയകൾ ‘നൽകും’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: നָתַתִּי എന്നത് ‘നൽകിയിട്ടുണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി വാഗ്ദാനത്തിന്റെ ഇപ്പോഴും തുടരുന്ന സാധുതയ്ക്ക് ഊന്നൽ നൽകാം.
  rationale: ദൈവം മുമ്പ് നൽകിയ ദാനത്തെയും യാക്കോബിനും അവന്റെ സന്തതിക്കും ഭാവിയിൽ നൽകുമെന്ന ഉറപ്പിനെയും ഹീബ്രു ചേർത്തുവയ്ക്കുന്നു. അവയ്ക്കിടയിലെ കാലപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ വാക്യക്രമത്തിന്റെ ഊന്നൽ കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി സർവനാമപ്രത്യയം പ്രത്യേകം ആവർത്തിച്ചിട്ടില്ല. ‘സന്തതി’ ഉടമ്പടി-സന്ദർഭത്തിന് യോജിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ സമൂഹവാചക പദമാണ്.
