source:
  edition: WLC
  text: וַ/יָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָ/ה אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית אֵ֑ל ה֖וּא וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: ml
  text: അങ്ങനെ യാക്കോബും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനവും കനാൻദേശത്തുള്ള ലൂസിൽ—അതായത് ബേഥേലിൽ[a]—എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠം ‘ലൂസ് … അതായത് ബേഥേൽ’ എന്നു പറഞ്ഞ് പഴയ സ്ഥലനാമവും പിന്നീട് കൂടുതൽ അറിയപ്പെട്ട തിരിച്ചറിയലും ഒരുമിച്ചു നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാള ആഖ്യാനത്തിൽ ‘എത്തി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לוּזָה
  choice: ലൂസിൽ
  rationale: ‘ലൂസ്’ എന്ന സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം രേഖപ്പെടുത്തുന്നു. ‘എത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്ഥലത്തെ ‘ലൂസിൽ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തുള്ള
  rationale: ലൂസിന്റെ ഭൂമിശാസ്ത്രസ്ഥാനം വ്യക്തമാക്കുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִוא בֵּית אֵל
  choice: അതായത് ബേഥേൽ
  rationale: ലൂസ് എന്ന പഴയ സ്ഥലനാമത്തെ ബേഥേൽ എന്നു തിരിച്ചറിയിക്കുന്ന വിശദീകരണപരമായ സമാനാധികരണ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: הוּא
  choice: അവനും
  rationale: യാക്കോബിനെ വീണ്ടും എടുത്തുപറയുന്ന resumptive/emphatic സർവനാമത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ‘അവനും’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനവും
  rationale: ഇവിടെ עָם യാക്കോബിനോടൊപ്പമുള്ള മുഴുവൻ സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ദേശീയ അർഥം നിർബന്ധമാക്കാതെ മൂലത്തിന്റെ കൂട്ടായ പ്രയോഗം നിലനിർത്തുന്നു.
