revisions:
- from: അങ്ങനെ യാക്കോബ് കനാൻദേശത്തുള്ള ലൂസിൽ—അതായത് ബേഥേലിൽ[a]—എത്തി; അവനും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനവും അവിടെ എത്തി.
  to: അങ്ങനെ യാക്കോബും അവനോടുകൂടെ ഉണ്ടായിരുന്ന സകല ജനവും കനാൻദേശത്തുള്ള ലൂസിൽ—അതായത് ബേഥേലിൽ[a]—എത്തി.
