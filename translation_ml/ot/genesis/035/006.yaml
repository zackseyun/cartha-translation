  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സ്ഥലപ്പേരിന്റെ വിശദീകരണവും യാക്കോബിനെയും കൂടെയുള്ള സംഘത്തെയും വീണ്ടും എടുത്തുപറയുന്ന ഘടനയും വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
