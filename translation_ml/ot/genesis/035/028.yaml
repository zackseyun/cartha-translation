  text: And the days of Isaac were one hundred and eighty years[a].
translation:
  language: ml
  text: യിസ്ഹാക്കിന്റെ ആയുഷ്കാലം നൂറ്റിയെൺപത് വർഷമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘യിസ്ഹാക്കിന്റെ ദിവസങ്ങൾ നൂറ്റിയെൺപത് വർഷമായിരുന്നു’; ഇവിടെ ‘ദിവസങ്ങൾ’ എന്നത് ആയുഷ്കാലത്തെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയയുടെ വിവരണാത്മക ഭൂതകാലരൂപം യിസ്ഹാക്കിന്റെ ആയുഷ്കാലത്തിന്റെ ആകെ ദൈർഘ്യം പ്രസ്താവിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: יְמֵי
  choice: ആയുഷ്കാലം
  rationale: ‘ദിവസങ്ങൾ’ എന്ന പദം ഇവിടെ ഒരാളുടെ മുഴുവൻ ജീവിതദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. പദാനുപദമായ ‘ദിവസങ്ങൾ’ എന്നതിനെക്കാൾ അർത്ഥം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളമാണ് ‘ആയുഷ്കാലം’.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: നൂറ്റിയെട്ടുപത് വർഷം
  rationale: എബ്രായത്തിലെ ‘നൂറ് വർഷവും എൺപത് വർഷവും’ എന്ന സംഖ്യാഘടനയെ സ്വാഭാവികമായ മലയാള ആകെസംഖ്യയായി അവതരിപ്പിക്കുന്നു.
- source_word: שָׁנָה
  choice: വർഷം
  rationale: സംഖ്യയ്ക്കുശേഷം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനരൂപമായ ‘വർഷം’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായ ശൈലിപ്രയോഗത്തിന്റെ അർത്ഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകി; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
