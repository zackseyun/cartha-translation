source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: ml
  text: യാക്കോബ് പദ്ദൻ-അരാമിൽനിന്നു വന്നപ്പോൾ ദൈവം വീണ്ടും അവനു പ്രത്യക്ഷനായി[a]; അവനെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവം വീണ്ടും യാക്കോബിന് സ്വയം വെളിപ്പെടുത്തി.’ എബ്രായക്രിയയ്ക്ക് ‘പ്രത്യക്ഷനാകുക’ എന്നോ ‘സ്വയം ദൃശ്യമാക്കുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ കാണപ്പെടുക അഥവാ സ്വയം ദൃശ്യമാക്കുക എന്ന അർഥത്തിലാണ്. ‘പ്രത്യക്ഷനായി’ എന്നത് ദൈവിക വെളിപ്പെടലിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ക്രിയയുടെ ഏകവചനരൂപവും വിവരണസന്ദർഭവും ഇതു ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: മുമ്പുണ്ടായ ദൈവിക പ്രത്യക്ഷതയുടെ ആവർത്തനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּבֹאוֹ
  choice: വന്നപ്പോൾ
  rationale: בְ + സർവനാമപ്രത്യയമുള്ള infinitive construct ഇവിടെ കാലസംബന്ധം പ്രകടിപ്പിക്കുന്നു; ‘വന്നപ്പോൾ’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפַּדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽനിന്നു
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു; prefixed מִן-ന്റെ ഉറവിടാർഥം ‘-ൽനിന്നു’ നൽകുന്നു.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: അവനെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന പീയേൽ ക്രിയയുടെ അർഥം ‘അനുഗ്രഹിക്കുക’ എന്നാണ്. മലയാളത്തിൽ മുൻവാക്യത്തിലെ ദൈവം തന്നെയാണ് കർത്താവെന്ന് വ്യക്തമായതിനാൽ കർത്തൃസർവനാമം ആവർത്തിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ സ്വഭാവം
  choice: ദൈവം യാക്കോബിനു വീണ്ടും ‘പ്രത്യക്ഷനായി’ എന്നു നേരിട്ട് അവതരിപ്പിക്കുക.
  alternative: ദൈവം വീണ്ടും യാക്കോബിനു തന്നെത്താൻ വെളിപ്പെടുത്തി / ദൈവത്തെ യാക്കോബ് വീണ്ടും കണ്ടു.
  rationale: വാക്യം യഥാർഥമായ ഒരു ദൈവിക വെളിപ്പെടൽ രേഖപ്പെടുത്തുന്നുവെങ്കിലും അതിന്റെ മാധ്യമമോ രീതിയോ വ്യക്തമാക്കുന്നില്ല. ‘പ്രത്യക്ഷനായി’ ആ അവ്യക്തത നിലനിർത്തുന്നു; അതിനെ വെറും ദർശനമെന്നോ ശാരീരിക ദൃശ്യതയെന്നോ നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ടാം ഉപവാക്യത്തിൽ വ്യക്തമായ കർത്തൃസർവനാമം ആവർത്തിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
