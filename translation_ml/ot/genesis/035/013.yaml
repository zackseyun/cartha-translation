source:
  edition: WLC
  text: וַ/יַּ֥עַל מֵ/עָלָ֖י/ו אֱלֹהִ֑ים בַּ/מָּק֖וֹם אֲשֶׁר דִּבֶּ֥ר אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: ml
  text: അവനോടു സംസാരിച്ച സ്ഥലത്ത് ദൈവം അവനിൽനിന്ന് മുകളിലേക്കു പോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിൽനിന്ന് മുകളിലേക്കു കയറി.’ ഈ കൂടിക്കാഴ്ചയിൽനിന്നുള്ള ദൈവത്തിന്റെ പിരിയലിനെ എബ്രായപാഠം മുകളിലേക്കുള്ള ചലനമായി അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: മുകളിലേക്കു പോയി
  rationale: കാൽ രൂപത്തിലുള്ള עלה ഇവിടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന അർഥം നൽകുന്നു. ‘പിരിഞ്ഞുപോയി’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷയെക്കാൾ എബ്രായത്തിലെ ഉയർന്നുപോകുന്ന ദൃശ്യഭാവം ഇത് നിലനിർത്തുന്നു.
- source_word: מֵעָלָיו
  choice: അവനെ വിട്ട്
  rationale: പദശഃ ‘അവന്റെ മുകളിൽനിന്ന്’ എന്ന ആശയം ഉണ്ടെങ്കിലും മലയാളത്തിൽ അത് ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമാണ്. ‘അവനെ വിട്ട്’ വേർപാടിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു; മുകളിലേക്കുള്ള ചലനം ക്രിയയിൽ നിലനിൽക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമാണെങ്കിലും ഇവിടെ ഏകവചന ക്രിയയോടുകൂടെ കഥയിലെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמָּקוֹם
  choice: സ്ഥലത്തുനിന്ന്
  rationale: בְּ സ്ഥലം സൂചിപ്പിക്കുന്നു. മലയാളവാക്യഘടനയിൽ ദൈവത്തിന്റെ പുറപ്പെടലിനെ ആ സ്ഥലവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘സ്ഥലത്തുനിന്ന്’ ഉപയോഗിച്ചു; സ്ഥലം തന്നെയാണ് ദൈവം യാക്കോബിനോടു സംസാരിച്ച ഇടം.
- source_word: אֲשֶׁר
  choice: —ച്ച
  rationale: ‘സ്ഥലം’ എന്ന മുൻപദത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ ‘സംസാരിച്ച സ്ഥലം’ എന്ന സ്വാഭാവിക കൃതന്തഘടനയായി നൽകി.
- source_word: דִּבֶּר אִתּוֹ
  choice: അവനോടു സംസാരിച്ച
  rationale: דבר എന്ന ക്രിയ אֵת സഹിതം ‘ഒരാളോടു സംസാരിക്കുക’ എന്നാണ്. ദൈവമാണ് സംസാരിക്കുന്നവനും യാക്കോബാണ് അഭിസംബോധിതനും എന്നു സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പുറപ്പെടലിനെ സ്ഥലപരവും മനുഷ്യസദൃശവുമായി വിവരിക്കുന്നത്
  choice: ‘മുകളിലേക്കു പോയി’ എന്ന സ്ഥലപരമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘പിരിഞ്ഞുപോയി’ അല്ലെങ്കിൽ ‘മറഞ്ഞുപോയി’
  rationale: എബ്രായപാഠം സാധാരണ ഉയർച്ചാസൂചകമായ ക്രിയയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് ദൈവപ്രത്യക്ഷത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുകയും ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ദാർശനിക വിശദീകരണം പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മുകളിലേക്കു പോയി’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘അവനെ വിട്ട്’ മലയാളത്തിലെ സ്വാഭാവികത ഉറപ്പാക്കുന്നു.
