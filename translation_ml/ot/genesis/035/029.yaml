  text: וַ/יִּגְוַ֨ע יִצְחָ֤ק וַ/יָּ֨מָת֙ וַ/יֵּאָ֣סֶף אֶל עַמָּ֔י/ו זָקֵ֖ן וּ/שְׂבַ֣ע יָמִ֑ים וַ/יִּקְבְּר֣וּ אֹת֔/וֹ עֵשָׂ֥ו וְ/יַעֲקֹ֖ב בָּנָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: ml
  text: അങ്ങനെ യിസ്ഹാക്ക് അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു; തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു[a]. അവൻ വൃദ്ധനും ആയുസ്സ് തികഞ്ഞവനും ആയിരുന്നു. അവന്റെ പുത്രന്മാരായ ഏശാവും യാക്കോബും അവനെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ പൂർവികരോടോ ബന്ധുക്കളോടോ ചേർക്കപ്പെട്ടു.” ഈ എബ്രായ പ്രയോഗം മരണത്തെക്കുറിച്ചുള്ള ഒരു പതിവ് സൂത്രവാക്യമാണ്; ശാരീരികമായ അടക്കത്തേക്കാൾ അധികം ഇതു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: അന്ത്യശ്വാസം വലിച്ചു
  rationale: മരണവിവരണങ്ങളിൽ גוע ജീവൻ വിടുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘മരിച്ചു’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും ആവർത്തനത്തിന്റെ ശക്തിയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന സാധാരണ മരണക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു
  rationale: എബ്രായത്തിലെ പതിവ് മരണസൂത്രവാക്യം ഏറെ നേരിട്ട് നിലനിർത്തുന്നു; ഇത് ശവസംസ്കാരമോ പൂർവികരോടുള്ള മരണാനന്തര ചേരലോ മാത്രമാണെന്ന് നിർണയിക്കുന്നില്ല.
- source_word: זָקֵן וּשְׂבַע יָמִים
  choice: വാർധക്യം പ്രാപിച്ച് ആയുസ്സു തികഞ്ഞവനായിരുന്ന
  rationale: ‘വൃദ്ധനും ദിവസങ്ങൾ നിറഞ്ഞവനും’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിന്റെ ആശയവും പിതൃപുരുഷ മരണവിവരണത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: קבר എന്നത് അടക്കം ചെയ്യുക എന്നാണ്; മലയാളത്തിൽ മരണവിവരണത്തിന് വ്യക്തവും മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: അവന്റെ പുത്രന്മാരായ ഏശാവും യാക്കോബും
  rationale: പുത്രബന്ധവും പേരുകളുടെ എബ്രായ ക്രമവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ഘടന.
theological_decisions:
- issue: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്ന മരണസൂത്രവാക്യത്തിന്റെ അർഥം
  choice: അർഥം വിശദീകരിച്ചു തീർക്കാതെ സൂത്രവാക്യം നേരിട്ട് നിലനിർത്തി.
  alternative: കുടുംബക്കല്ലറയിൽ അടക്കം ചെയ്യപ്പെട്ടു; പൂർവികരോടു മരണാനന്തരം ഒന്നിച്ചു; ബന്ധുക്കളോടു ചേർന്നു.
  rationale: എബ്രായ പ്രയോഗം ശാരീരിക അടക്കത്തേക്കാൾ അധികം സൂചിപ്പിക്കാമെങ്കിലും അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അന്തർലീനമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു’ എന്ന ഇരട്ടക്രിയ എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത മരണക്രിയകളുടെ ക്രമം സൂക്ഷിക്കുന്നു. ‘ആയുസ്സു തികഞ്ഞവൻ’ എന്നത് അക്ഷരാർഥത്തിലുള്ള ‘ദിവസങ്ങൾ നിറഞ്ഞവൻ’ എന്ന പ്രയോഗത്തെ അസ്വാഭാവികമാക്കാതെ അതിന്റെ നിറവിന്റെ ഭാവം കൈമാറുന്നു.
