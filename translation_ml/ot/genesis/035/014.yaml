id: GEN.35.14
reference: Genesis 35:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: ml
  text: ദൈവം തന്നോടു സംസാരിച്ച സ്ഥലത്ത് യാക്കോബ് ഒരു ശിലാസ്തംഭം നാട്ടി; അതിന്മേൽ പാനീയയാഗം ഒഴിച്ചു, അതിന്മേൽ എണ്ണയും പകർന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: നാട്ടി
  rationale: ഹിഫീൽ രൂപം ഒരു വസ്തുവിനെ നിവർത്തിനിർത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കൽത്തൂൺ സ്ഥാപിക്കുന്ന ദൃശ്യമായ പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘നാട്ടി’ എന്നു വ്യക്തമാക്കാം.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: കൽത്തൂൺ
  rationale: ഇവിടെ പദം നിവർത്തിവെച്ച കല്ലുകൊണ്ടുള്ള തൂണിനെയോ ശിലാസ്തംഭത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കൽത്തൂൺ’ സംക്ഷിപ്തവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്; ‘സ്മാരകശില’ എന്നു പറഞ്ഞാൽ വാക്യം വ്യക്തമാക്കാത്ത ഉദ്ദേശ്യം ചേർന്നുപോകും.
- source_word: בַּמָּקוֹם
  choice: സ്ഥലത്ത്
  rationale: എബ്രായത്തിലെ സ്ഥലസൂചന നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: ദൈവം തന്നോടു സംസാരിച്ച
  rationale: എബ്രായത്തിൽ കർത്താവും കർമവും സർവനാമങ്ങളായാണ് വരുന്നത്; മുൻസന്ദർഭത്തിൽ സംസാരിച്ചത് ദൈവവും കേട്ടത് യാക്കോബുമാണ്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭസൂചിതമായ കർത്താവിനെ വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ സർവനാമഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: പാനീയയാഗം ഒഴിച്ചു
  rationale: ക്രിയയും അതിന്റെ നാമരൂപത്തിലുള്ള കർമവും ചേർന്ന് ആചാരപരമായ ദ്രവാർപ്പണം ഒഴിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് ‘ലിബേഷൻ’ എന്ന സാങ്കേതികപദത്തേക്കാൾ വ്യക്തമാണ്.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: എണ്ണയും പകർന്നു
  rationale: രണ്ടാമത്തെ ക്രിയ എണ്ണ ഒഴിക്കുന്ന പ്രവൃത്തിയാണ്. മൂലപാഠം ‘ഒലിവെണ്ണ’ എന്നു പ്രത്യേകമായി പറയാത്തതിനാൽ ‘എണ്ണ’ എന്നതിൽ നിൽക്കുന്നു.
theological_decisions:
- issue: കൽത്തൂണിന്മേലുള്ള യാക്കോബിന്റെ പ്രവൃത്തികളുടെ അർഥം
  choice: കൽത്തൂൺ നാട്ടിയതും പാനീയയാഗവും എണ്ണയും അതിന്മേൽ ഒഴിച്ചതും വിവരണാത്മകമായി മാത്രം അവതരിപ്പിച്ചു.
  alternative: ഇത് കൽത്തൂണിന്റെ പ്രതിഷ്ഠയോ ദൈവസന്ദർശനത്തിന്റെ സ്മാരകസ്ഥാപനമോ ആണെന്ന് വിവർത്തനത്തിൽ തന്നെ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം പ്രവൃത്തികളെ വിവരിക്കുന്നുവെങ്കിലും അവയുടെ ദൈവശാസ്ത്രപരമായ ലക്ഷ്യം നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം ചേർക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: സംസാരിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: മുൻസന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘ദൈവം’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, മൂലത്തിലെ സർവനാമരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘അവൻ തന്നോടു സംസാരിച്ച’ എന്ന സർവനാമാധിഷ്ഠിത രൂപം മാത്രം ഉപയോഗിക്കുക.
  rationale: എബ്രായത്തിൽ തിരിച്ചറിയൽ സർവനാമങ്ങളിലൂടെയാണെങ്കിലും മുൻസന്ദർഭം ദൈവത്തെയും യാക്കോബിനെയും വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘അവൻ തന്നോടു’ എന്ന രൂപം അനാവശ്യമായ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാം; അടിക്കുറിപ്പ് മൂലരൂപം സുതാര്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘കൽത്തൂൺ’, ‘പാനീയയാഗം’ എന്നിവ സാങ്കേതികതയും വായനാസൗകര്യവും സമതുലിതമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ആചാരപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
