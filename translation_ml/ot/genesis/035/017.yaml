source:
  edition: WLC
  text: וַ/יְהִ֥י בְ/הַקְשֹׁתָ֖/הּ בְּ/לִדְתָּ֑/הּ וַ/תֹּ֨אמֶר לָ֤/הּ הַ/מְיַלֶּ֨דֶת֙ אַל תִּ֣ירְאִ֔י כִּֽי גַם זֶ֥ה לָ֖/ךְ בֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: ml
  text: 'അവളുടെ പ്രസവവേദന കഠിനമായപ്പോൾ, പ്രസവസഹായിക അവളോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ട; കാരണം ഇതും നിനക്കൊരു മകനാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: അവളുടെ പ്രസവം ദുഷ്കരമായപ്പോൾ
  rationale: പ്രസവിക്കുന്നതിലെ കഠിനത സൂചിപ്പിക്കുന്ന എബ്രായ സമയസാഹചര്യത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַמְיַלֶּדֶת
  choice: സൂതികർമ്മിണി
  rationale: പ്രസവസഹായം ചെയ്യുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നേരിട്ടുള്ള ആശ്വാസനിഷേധത്തെ സ്വാഭാവികമായ മലയാള ആജ്ഞാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ കാരണം/വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിലെ വിരാമചിഹ്നവും തുടർന്നുള്ള വാക്യവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പ്രത്യേക ബന്ധപദം ചേർക്കേണ്ടതില്ല.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: ഇതും നിനക്ക് ഒരു മകനാണ്
  rationale: גַּם זֶה എന്ന ‘ഇതും’ എന്ന ഊന്നലും לָךְ בֵּן എന്ന ദാതൃ/ബന്ധസൂചനയും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും നേരിട്ടുള്ള ആശ്വാസവാക്കും നിലനിർത്തിയിരിക്കുന്നു.
