id: GEN.35.11
reference: Genesis 35:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: ml
  text: 'ദൈവം അവനോടു പറഞ്ഞു: “ഞാൻ സർവശക്തനായ ദൈവം[a] ആകുന്നു. സന്താനസമൃദ്ധിയുള്ളവനായിരിക്കുക; പെരുകുക. ഒരു ജനതയും ജനതകളുടെ ഒരു സമൂഹവും[b] നിന്നിൽനിന്ന് ഉത്ഭവിക്കും; നിന്റെ വംശത്തിൽനിന്ന് രാജാക്കന്മാർ ഉദ്ഭവിക്കും.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “ഏൽ ശദ്ദായി”; പരമ്പരാഗതമായി “സർവശക്തനായ ദൈവം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ജനതകളുടെ ഒരു കൂട്ടം” അല്ലെങ്കിൽ “ജനതകളുടെ ഒരു സഭ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം ഒന്നിച്ചുകൂടിയ ജനതകളുടെ ഒരു സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “നിന്റെ അരയിൽനിന്ന്”; സ്വന്തം ശരീരത്തിൽനിന്നുള്ള വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയാരൂപവും സന്ദർഭവും ഇത് ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന ദൈവിക പദവിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֵל שַׁדַּי
  choice: സർവശക്തനായ ദൈവം
  rationale: ദൈവിക പദവിയുടെ പരമ്പരാഗതവും അർഥവത്തുമായ മലയാള പരിഭാഷ; ഗൗരവമുള്ള സ്വയംവെളിപ്പെടുത്തൽ നിലനിർത്തുന്നു.
- source_word: פְּרֵה וּרְבֵה
  choice: സന്താനപുഷ്ടിയുള്ളവനായി പെരുകുക
  rationale: സൃഷ്ടിയിലും പിതൃപുരുഷന്മാർക്കുള്ള അനുഗ്രഹത്തിലും കാണുന്ന സന്താനവർധനയുടെ ആശയം രണ്ട് ആജ്ഞാരൂപങ്ങളോടും ചേർന്ന് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גּוֹי
  choice: ജനത
  rationale: ഇവിടെ ഒരു ജനവിഭാഗം രാഷ്ട്രസ്വഭാവമുള്ള ജനതയായി രൂപപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: קְהַל גּוֹיִם
  choice: ജനതകളുടെ ഒരു സമൂഹം
  rationale: ഒന്നിച്ചുകൂടിയ ജനതകളുടെ കൂട്ടം എന്ന קהל എന്ന പദത്തിന്റെ അർഥം സഭ എന്ന പദത്തിന്റെ പ്രത്യേക മതപരമായ ധ്വനി ഒഴിവാക്കി നൽകുന്നു.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: നിന്നിൽനിന്ന് ഉണ്ടാകും
  rationale: അക്ഷരാർഥമായ ‘നിന്നിൽനിന്ന് ആയിരിക്കും’ എന്നതിനെക്കാൾ വംശപരമായ ഉത്ഭവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מְלָכִים
  choice: രാജാക്കന്മാർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം തന്നെയാണ്.
- source_word: מֵחֲלָצֶיךָ
  choice: നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്ന്
  rationale: ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יֵצֵאוּ
  choice: ജനിച്ചുവരും
  rationale: സ്ഥലപരമായ ‘പുറപ്പെടും’ എന്നതിനു പകരം വംശപരമ്പരയിൽനിന്നുള്ള ഉദ്ഭവം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֵל שַׁדַּי എന്ന ദൈവിക പദവിയുടെ പരിഭാഷ
  choice: സർവശക്തനായ ദൈവം
  alternative: ഏൽ ശദ്ദായി
  rationale: പേര് എന്നതിലുപരി ദൈവിക പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥം പരിഭാഷപ്പെടുത്തുന്നു; പരമ്പരാഗത അർഥം നിലനിർത്തുമ്പോഴും ലിപ്യന്തരണത്തെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: വാഗ്ദാനത്തിലെ ശാരീരിക വംശപരമ്പരയുടെ ദൃശ്യത
  choice: നിന്റെ സ്വന്തം ശരീരത്തിൽനിന്ന് ജനിച്ചുവരും
  alternative: നിന്റെ അരയിൽനിന്ന് പുറപ്പെടും
  rationale: വംശപരമ്പരയുടെ ശാരീരിക യാഥാർഥ്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ തെറ്റിദ്ധാരണയ്ക്കോ അസ്വാഭാവികതയ്ക്കോ ഇടയാക്കാവുന്ന പദാനുപദ രൂപം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സന്താനപുഷ്ടിയുള്ളവനായി’ എന്നത് പിതൃപുരുഷ അനുഗ്രഹസൂത്രത്തിന്റെ ഭാവം നിലനിർത്തുന്നു. ‘സമൂഹം’ എന്നത് קהל എന്ന പദത്തിന്റെ കൂട്ടായ്മാഭാവം നൽകുകയും ‘സഭ’ എന്ന പദത്തിനുണ്ടാകാവുന്ന പ്രത്യേക സഭാപരമായ ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
