base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ അപ്പനായ യിസ്ഹാക്കിന്റെ അടുക്കൽ മമ്രേയിൽ, കിര്യത്ത്-അർബയിൽ—അതായത് ഹെബ്രോനിൽ—എത്തി. അവിടെ അബ്രാഹാമും യിസ്ഹാക്കും പരദേശികളായി പാർത്തിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരദേശികളായോ സ്ഥിരാവകാശമില്ലാത്ത താമസക്കാരായോ പാർത്തിരുന്നു.” എബ്രായ ക്രിയ വെറുതെ ഒരു സ്ഥലത്ത് താമസിക്കുന്നതിനേക്കാൾ, അവിടെ പരദേശിയായോ സ്ഥിരാവകാശമില്ലാത്ത താമസക്കാരനായോ കഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: എത്തി
  rationale: בוא എന്ന ആഖ്യാനക്രിയ ഇവിടെ യിസ്ഹാക്ക് ഉണ്ടായിരുന്ന സ്ഥലത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘എത്തി’ സ്വാഭാവികവും ദിശാസംബന്ധമായ അനാവശ്യ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: אֶל יִצְחָק אָבִיו
  choice: തന്റെ അപ്പനായ യിസ്ഹാക്കിന്റെ അടുക്കൽ
  rationale: ബന്ധവും ദിശയും വ്യക്തമായി നിലനിർത്തുന്നു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ പദമാണ്.
- source_word: מַמְרֵא
  choice: മമ്രേ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: קִרְיַת הָאַרְבַּע
  choice: കിര്യത്ത്-അർബ
  rationale: സ്ഥലനാമത്തെ അർഥവിവർത്തനം ചെയ്യാതെ ശബ്ദാനുസൃതമായി നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യഭാഗം അതിനെ ഹെബ്രോൻ എന്നു തിരിച്ചറിയിക്കുന്നു.
- source_word: הִוא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോൻ എന്ന
  rationale: ഈ തിരിച്ചറിയൽവാക്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിശദീകരണപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר ... שָׁם
  choice: അവിടെയാണ് ... പാർത്തിരുന്നത്
  rationale: സ്ഥലത്തെ സംബന്ധിക്കുന്ന എബ്രായ ആപേക്ഷികവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി വേറൊരു വാക്യമായി അവതരിപ്പിച്ചെങ്കിലും അതിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: גָּר
  choice: പരദേശികളായി പാർത്തിരുന്നത്
  rationale: גור വെറും താമസത്തെയല്ല, സ്വന്തം സ്ഥിരദേശമല്ലാത്ത സ്ഥലത്ത് പരദേശിയോ താത്കാലിക താമസക്കാരനോ ആയി കഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പരദേശികളായി പാർക്കുക’ ആ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: അബ്രാഹാമും യിസ്ഹാക്കും
  rationale: വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ശബ്ദരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
