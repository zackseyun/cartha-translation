translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും സ്ഥലനാമങ്ങളുടെ പരസ്പര തിരിച്ചറിയലും גור എന്ന ക്രിയയുടെ പരദേശവാസസൂക്ഷ്മതയും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചിക അതുമായി ബന്ധപ്പെട്ട ‘പരദേശികളായി പാർത്തിരുന്നത്’ എന്ന പ്രയോഗത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
