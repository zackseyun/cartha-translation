source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: ml
  text: 'ദൈവം അവനോടു പറഞ്ഞു: “നിന്റെ പേര് യാക്കോബ് എന്നാണ്. ഇനി നിന്റെ പേര് യാക്കോബ് എന്നു വിളിക്കപ്പെടുകയില്ല; ഇസ്രായേൽ എന്നായിരിക്കും നിന്റെ പേര്.” അങ്ങനെ അവിടുന്ന് അവന് ഇസ്രായേൽ എന്നു പേരിട്ടു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവിടുന്ന് അവന്റെ പേര് ഇസ്രായേൽ എന്നു വിളിച്ചു.” മറ്റൊരു പരിഭാഷ: “അവിടുന്ന് അവനെ ഇസ്രായേൽ എന്നു വിളിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയാരൂപത്തോടുകൂടി ഇവിടെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ഏകവചന രൂപം സ്വീകരിച്ചു.
- source_word: שִׁמְךָ יַעֲקֹב
  choice: നിന്റെ പേര് യാക്കോബ് എന്നാണ്
  rationale: പേരിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: ഇനി ... വിളിക്കപ്പെടുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ עוֹד പഴയ പേരിന്റെ ഉപയോഗം ഇനിമുതൽ അവസാനിക്കുന്നതായി പ്രഖ്യാപിക്കുന്നു; ഹീബ്രുവിലെ നിഷ്പ്രയോകരൂപവും നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: എന്നാൽ
  rationale: പഴയ പേരിനു പകരം പുതിയ പേര് സ്ഥാപിക്കുന്ന ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: ഇസ്രായേൽ എന്നായിരിക്കും നിന്റെ പേര്
  rationale: പുതിയ പേരായ ‘ഇസ്രായേൽ’ എന്നതിന് ഹീബ്രു നൽകുന്ന മുൻനിലയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: അങ്ങനെ അവിടന്ന് അവന് ഇസ്രായേൽ എന്നു പേരിട്ടു
  rationale: ഹീബ്രുവിലെ പേരിടൽ സൂത്രവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ കർത്താവ് ദൈവമാണെന്ന് ആദരസൂചക സർവനാമം വ്യക്തമാക്കുന്നു.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: യാക്കോബ് / ഇസ്രായേൽ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപങ്ങൾ സ്വീകരിച്ചു.
theological_decisions:
- issue: പഴയ പേര് പിന്നീടുള്ള വിവരണത്തിൽ വീണ്ടും ഉപയോഗിക്കപ്പെടുന്നതിനെ പരിഗണിച്ച് പേരുമാറ്റ പ്രഖ്യാപനത്തിന്റെ ശക്തി കുറയ്ക്കണമോ
  choice: ഇനി നിന്റെ പേര് യാക്കോബ് എന്നു വിളിക്കപ്പെടുകയില്ല
  alternative: ഇനി സാധാരണയായി നിന്നെ യാക്കോബ് എന്നു വിളിക്കുകയില്ല
  rationale: ഹീബ്രു സമ്പൂർണമായ ഔപചാരിക പേരുമാറ്റ പ്രഖ്യാപനമാണ് നൽകുന്നത്. പിന്നീടും ‘യാക്കോബ്’ ഉപയോഗിക്കപ്പെടുന്നുവെന്ന സംഘർഷം വിശദീകരിച്ച് മയപ്പെടുത്താതെ മൂലവാക്യത്തിന്റെ ശക്തി നിലനിർത്തി.
- issue: അവസാന ക്രിയയുടെ കർത്താവ്
  choice: അവിടന്ന് (ദൈവം) അവന് ഇസ്രായേൽ എന്നു പേരിട്ടു
  alternative: അവൻ തന്റെ പേര് ഇസ്രായേൽ എന്നു വിളിച്ചു
  rationale: അടുത്തുള്ള ഏകവചന കർത്താവായ ദൈവം തന്നെയാണ് സ്വാഭാവിക കർത്താവ്; എന്നാൽ ഹീബ്രുവിലെ ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന പദപ്രയോഗം അടിക്കുറിപ്പിൽ സുതാര്യമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പേരിട്ടു’ സ്വാഭാവിക മലയാള പേരിടൽ പ്രയോഗമായി മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടന്ന്’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു.
