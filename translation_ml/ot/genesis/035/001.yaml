id: GEN.35.1
reference: Genesis 35:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം യാക്കോബിനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ബേഥേലിലേക്കു കയറിച്ചെന്ന് അവിടെ പാർക്കുക; നിന്റെ സഹോദരനായ ഏശാവിൽനിന്ന്[a] നീ ഓടിപ്പോയപ്പോൾ നിനക്കു പ്രത്യക്ഷനായ ദൈവത്തിന് അവിടെ ഒരു യാഗപീഠം പണിയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ സഹോദരനായ ഏശാവിന്റെ മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഏകവചന ക്രിയയും സന്ദർഭവും ഇവിടെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: קוּם עֲלֵה
  choice: എഴുന്നേറ്റ് ... കയറിച്ചെന്ന്
  rationale: തുടർച്ചയായ രണ്ട് ആജ്ഞകളെയും ദിശാസൂചനയെയും നിലനിർത്തുന്നു; ബേഥേലിലേക്കുള്ള ഉയർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമം അർത്ഥം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְשֶׁב שָׁם
  choice: അവിടെ പാർക്കുക
  rationale: ישב എന്നതിന്റെ താമസിക്കുക/വസിക്കുക എന്ന അർത്ഥം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: അവിടെ ഒരു യാഗപീഠം പണിയുക
  rationale: עשה പൊതുവിൽ ‘ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും യാഗപീഠത്തോടൊപ്പം ‘പണിയുക’ എന്നത് സ്വാഭാവിക മലയാള പ്രയോഗമാണ്.
- source_word: לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: നിനക്കു പ്രത്യക്ഷനായ ദൈവത്തിന്
  rationale: ל സമർപ്പണലക്ഷ്യം സൂചിപ്പിക്കുന്നു; നിഫാൽ രൂപം ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായ’ എന്ന് നേരിട്ട് നൽകുന്നു.
- source_word: בְּבָרְחֲךָ
  choice: നീ ഓടിപ്പോയപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct-ന്റെ കാലസാഹചര്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִפְּנֵי עֵשָׂו אָחִיךָ
  choice: നിന്റെ സഹോദരനായ ഏശാവിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘മുഖം/സന്നിധി മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്നവിധം നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്നതിന്റെ പരാമർശം
  choice: യാക്കോബിനോടു സംസാരിക്കുന്ന ഏകദൈവം
  alternative: ദൈവങ്ങൾ
  rationale: ഏകവചന ക്രിയയും ആഖ്യാനസന്ദർഭവും ഏകദൈവത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- issue: בֵּית אֵל എന്ന സ്ഥലനാമത്തിന്റെ അവതരണം
  choice: ബേഥേൽ എന്ന് ലിപ്യന്തരണം
  alternative: ദൈവത്തിന്റെ ഭവനം എന്ന് അർത്ഥവിവർത്തനം
  rationale: ഇവിടെ ഇത് സ്ഥാപിതമായ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യുന്നത് പേരിന്റെ സ്വഭാവം മറയ്ക്കും.
- issue: לָאֵל എന്ന നിർമാണത്തിലെ നിർദ്ദേശാർഥം
  choice: ദൈവത്തിന് ഒരു യാഗപീഠം
  alternative: ദൈവത്തിനുവേണ്ടി ഒരു യാഗപീഠം
  rationale: യാഗപീഠത്തിന്റെ സമർപ്പണലക്ഷ്യം പ്രകടമാക്കുന്നു; അധികമായ ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുല്യമായി പാലിച്ചു. ദൈവിക ആജ്ഞയുടെ നേരിട്ടുള്ള ഭാവം സൂക്ഷിച്ചു; എബ്രായത്തിലെ מִפְּנֵי എന്ന പ്രയോഗം ‘മുമ്പിൽനിന്ന്’ എന്ന് അല്പം ഔപചാരികമായി നിലനിർത്തി.
