source:
  edition: WLC
  text: וַ/יַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל קְבֻרָתָ֑/הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת רָחֵ֖ל עַד הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: ml
  text: യാക്കോബ് അവളുടെ കല്ലറയ്ക്കുമീതെ ഒരു സ്മാരകശില സ്ഥാപിച്ചു[a]. അതാണ് ഇന്നുവരെ റാഹേലിന്റെ കല്ലറയുടെ സ്മാരകശില.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു ശിലാസ്തംഭം’; അല്ലെങ്കിൽ ‘അവളുടെ കല്ലറ അടയാളപ്പെടുത്തുന്ന ഒരു ശില’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപം ഒരു വസ്തു നാട്ടിനിർത്തുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: מַצֵּבָה
  choice: സ്മാരകശില
  rationale: ഈ നാമം നാട്ടിനിർത്തിയ ശിലയെയോ തൂണിനെയോ സൂചിപ്പിക്കുന്നു. ശവകുടീരസന്ദർഭത്തിൽ ‘സ്മാരകശില’ വ്യക്തവും സ്വാഭാവികവുമാണ്; എന്നാൽ ‘ശിലാസ്തംഭം’ എന്ന കൂടുതൽ രൂപപരമായ വിവർത്തനവും സാധ്യമാണ്.
- source_word: עַל
  choice: കല്ലറയ്ക്കുമീതെ
  rationale: കല്ലറയോടുള്ള സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘മീതെ’ ഇവിടെ യോജിക്കുന്നു.
- source_word: קְבֻרָתָהּ
  choice: അവളുടെ കല്ലറ
  rationale: קבורה ഇവിടെ അടക്കസ്ഥലം അഥവാ കല്ലറയെ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അവളുടെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: הִוא
  choice: അതാണു്
  rationale: മുമ്പു പറഞ്ഞ സ്മാരകശിലയെ തിരിച്ചറിയിക്കുന്ന വിശദീകരണപ്രയോഗമായി സർവനാമം നിലനിർത്തുന്നു.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: റാഹേലിന്റെ കല്ലറയുടെ സ്മാരകശില
  rationale: എബ്രായത്തിലെ സംയുക്ത നാമബന്ധം സുതാര്യമായി നിലനിർത്തുന്നു; ‘റാഹേലിന്റെ കല്ലറ അടയാളപ്പെടുത്തുന്ന ശില’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: עַד הַיּוֹם
  choice: ഇന്നുവരെ
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാളസമാനമാണ്.
