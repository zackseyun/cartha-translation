translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അതിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വിവർത്തനം ചെയ്യാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
