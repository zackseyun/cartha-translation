  text: וַ/יִּסַּ֖ע יִשְׂרָאֵ֑ל וַ/יֵּ֣ט אָֽהֳלֹ֔/ה מֵ/הָ֖לְאָה לְ/מִגְדַּל עֵֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: ml
  text: പിന്നെ ഇസ്രായേൽ യാത്ര തുടർന്നു; മിഗ്ദാൽ-ഏദെരിന് അപ്പുറം തന്റെ കൂടാരം അടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മിഗ്ദാൽ-ഏദെർ എന്ന പേരിന്റെ അർഥം ‘ആട്ടിൻകൂട്ടത്തിന്റെ ഗോപുരം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: യാത്ര തുടർന്നു
  rationale: נסע എന്ന ക്രിയ ഇവിടെ ആഖ്യാനക്രമത്തിൽ പാളയം വിട്ട് മുന്നോട്ടു യാത്ര ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘യാത്ര തുടർന്നു’ എന്നത് അതിന്റെ തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായപാഠത്തിൽ ‘യാക്കോബ്’ എന്നതിനു പകരം ‘ഇസ്രായേൽ’ എന്നാണ് ഉള്ളത്; അതിനാൽ അതേ പേര് നിലനിർത്തുന്നു.
- source_word: וַיֵּט
  choice: അടിച്ചു
  rationale: കൂടാരം എന്ന കർമത്തോടൊപ്പം נטה എന്നത് ‘കൂടാരം അടിക്കുക/സ്ഥാപിക്കുക’ എന്ന പ്രയോഗാർഥത്തിലാണ്; ‘കൂടാരം അടിച്ചു’ സാധാരണവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: אָהֳלֹה
  choice: തന്റെ കൂടാരം
  rationale: אֹהֶל എന്നത് ‘കൂടാരം’ എന്നും മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം ‘അവന്റെ/തന്റെ’ എന്നും അർഥമാക്കുന്നു; വാക്യത്തിലെ കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചനയ്ക്ക് ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: מֵהָלְאָה
  choice: അപ്പുറം
  rationale: הלאה ഇവിടെ ഒരു സ്ഥലചിഹ്നത്തെ കടന്ന് കൂടുതൽ അകലെയുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘അപ്പുറം’ ഈ സ്ഥലബന്ധം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לְמִגְדַּל עֵדֶר
  choice: മിഗ്ദാൽ-ഏദെർ
  rationale: ഇവിടെ ഈ പദസമുച്ചയം സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ പദാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
