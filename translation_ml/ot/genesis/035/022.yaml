  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: ml
  text: ഇസ്രായേൽ ആ ദേശത്ത് പാർത്തിരുന്നപ്പോൾ, രൂബേൻ ചെന്ന് തന്റെ അപ്പന്റെ ഉപഭാര്യയായ ബിൽഹയോടുകൂടെ ശയിച്ചു. ഇസ്രായേൽ അതു കേട്ടു.[a] യാക്കോബിന്റെ പുത്രന്മാർ പന്ത്രണ്ടുപേരായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽ കേട്ടു’ എന്നാണ്; എന്തു കേട്ടു എന്നു വ്യക്തമാക്കിയിട്ടില്ല. രൂബേന്റെ പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ വ്യക്തതയ്ക്കായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘യാക്കോബിന്റെ പുത്രന്മാർ പന്ത്രണ്ടുപേരായിരുന്നു.’ ഈ വാക്യഭാഗം തുടർന്നുവരുന്ന പുത്രന്മാരുടെ പട്ടികയിലേക്കുള്ള ഒരു മാറിച്ചെല്ലലായിരിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: പാർത്തിരുന്നപ്പോൾ
  rationale: ב prefixed to the infinitive construct marks the temporal setting, and the imperfective sense is naturally expressed in Malayalam by ‘പാർത്തിരുന്നപ്പോൾ.’ The introductory וַיְהִי is represented through the narrative construction rather than by an awkward explicit formula such as ‘സംഭവിച്ചതെന്തെന്നാൽ.’
- source_word: בָּאָרֶץ הַהִוא
  choice: ആ ദേശത്തു
  rationale: Here אֶרֶץ denotes the local land or region. ‘ദേശം’ communicates that sense naturally without suggesting the whole earth.
- source_word: וַיֵּלֶךְ
  choice: ചെന്ന്
  rationale: Retains the distinct motion verb in the Hebrew sequence ‘went and lay with’ while fitting natural Malayalam syntax.
- source_word: וַיִּשְׁכַּב אֶת
  choice: കൂടെ ശയിച്ചു
  rationale: This is the standard Hebrew sexual idiom. The Malayalam expression remains direct and dignified without becoming either vague or clinically explicit.
- source_word: פִּילֶגֶשׁ
  choice: ഉപഭാര്യ
  rationale: This denotes a woman with a recognized but lesser marital status in the ancient household. ‘ഉപഭാര്യ’ is more precise and dignified in modern standard Malayalam than a potentially pejorative colloquial equivalent.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: ഇസ്രായേൽ അതു കേട്ടു
  rationale: The Hebrew leaves the object unstated, but it plainly refers to Reuben’s act. Malayalam naturally supplies ‘അതു’ while preserving the brevity of the statement.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: യാക്കോബിന്റെ പുത്രന്മാർ പന്ത്രണ്ടുപേരായിരുന്നു
  rationale: A straightforward numerical statement that also serves as the transition to the following list. No reaction by Israel is inferred.
theological_decisions:
- issue: ലൈംഗിക പ്രയോഗം അതിയായി മയപ്പെടുത്താതെയും അനാവശ്യമായി വിശദമാക്കാതെയും പരിഭാഷപ്പെടുത്തൽ
  choice: ബിൽഹയോടുകൂടെ ശയിച്ചു
  alternative: ബിൽഹയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടു
  rationale: The chosen wording preserves the Hebrew idiom’s gravity and directness while avoiding a clinical expansion.
- issue: ഇസ്രായേൽ കേട്ടശേഷമുള്ള പ്രതികരണം
  choice: ഇസ്രായേൽ അതു കേട്ടു എന്നുമാത്രം രേഖപ്പെടുത്തുന്നു
  alternative: ഇസ്രായേലിന്റെ മൗനത്തിൽനിന്നോ പ്രതികരണത്തിൽനിന്നോ നൈതികമോ ന്യായവിധിപരമോ ആയ അർഥം അനുമാനിക്കുക
  rationale: The source states only that Israel heard. The translation does not add an unstated response or doctrinal conclusion.
- issue: അവസാന വാക്യഭാഗത്തിന്റെ ആഖ്യാനപരമായ പങ്ക്
  choice: തുടർന്നുള്ള പുത്രന്മാരുടെ പട്ടികയിലേക്കുള്ള ലളിതമായ മാറിച്ചെല്ലൽ
  alternative: രൂബേന്റെ പ്രവൃത്തിയോടു നേരിട്ട് ചേർത്ത ദൈവശാസ്ത്രപരമായ പ്രസ്താവനയായി കാണുക
  rationale: The clause counts Jacob’s sons and most naturally introduces the list that follows, while its simple juxtaposition is preserved.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഉപഭാര്യ’ പുരാതന കുടുംബഘടനയിലെ പദവിയെ സൂചിപ്പിക്കുന്നു; ‘കൂടെ ശയിച്ചു’ മൂലഭാഷയിലെ ലൈംഗിക പ്രയോഗത്തിന്റെ ഗൗരവവും നിയന്ത്രിതമായ നേരിട്ടുതനവും നിലനിർത്തുന്നു. എബ്രായത്തിലെ ആദ്യത്തെ സംഭവാവതരണ സൂത്രവാക്യം മലയാളത്തിലെ കാലസൂചക ഉപവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
