translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ തുടർച്ചാസൂചകമായ וַ־യ്ക്ക് ‘അങ്ങനെ’ ഉപയോഗിച്ചു. വിശദീകരണഭാഗം പരാന്തസിസിൽ നിലനിർത്തി; എല്ലാ വ്യക്തി-സ്ഥലനാമങ്ങളും മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള വിധത്തിൽ ലിപ്യന്തരിച്ചു.
