  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: ml
  text: അവർ യാത്ര പുറപ്പെട്ടു. അപ്പോൾ ദൈവത്തിൽനിന്നുള്ള ഒരു ഭീതി[a] അവരുടെ ചുറ്റുമുള്ള പട്ടണങ്ങളുടെമേൽ വീണു; അവ യാക്കോബിന്റെ പുത്രന്മാരെ പിന്തുടർന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ദൈവത്തിന്റെ ഭീതി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: അവർ യാത്ര പുറപ്പെട്ടു
  rationale: נסע യാത്രയ്ക്കായി പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർച്ചയായ കഥനത്തിന്റെ മുന്നേറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי ... עַל
  choice: മേൽ വീണു
  rationale: היה എന്നതിന്റെ സംഭവാത്മക ഭാവവും עַל എന്നതിന്റെ ദിശാസൂചനയും ചേർന്ന് ഭീതി പട്ടണങ്ങളെ ബാധിച്ചതായി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: חִתַּת אֱלֹהִים
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ഭീതി
  rationale: חִתַּת ഭീതി അഥവാ നടുക്കം എന്നാണ്; construct ബന്ധം ഇവിടെ ഭീതിയുടെ ഉറവിടം ദൈവമാണെന്ന സ്വാഭാവിക സന്ദർഭാർഥത്തിൽ പരിഭാഷപ്പെടുത്തി. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: അവരുടെ ചുറ്റുമുള്ള
  rationale: യാക്കോബിന്റെ സംഘത്തെ ചുറ്റിയുണ്ടായിരുന്ന സമീപപട്ടണങ്ങളെയാണ് ഈ ബന്ധവാക്യം സൂചിപ്പിക്കുന്നത്.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: അതുകൊണ്ട് ... പിന്തുടർന്നില്ല
  rationale: മുൻപറഞ്ഞ ദൈവദത്തമായ ഭീതിയുടെ ഫലമായാണ് പിന്തുടരാതിരുന്നത്; മലയാളത്തിൽ ആ ഫലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചന കുടുംബബന്ധം ലിംഗനിഷ്ഠമായി സംരക്ഷിക്കുന്നു.
- source_word: הֶעָרִים ... לֹא רָדְפוּ
  choice: ആ പട്ടണങ്ങളിലുള്ളവർ ... പിന്തുടർന്നില്ല
  rationale: പട്ടണങ്ങളെ അവയിലെ നിവാസികൾക്കായി ഉപയോഗിക്കുന്ന എബ്രായത്തിലെ ലാക്ഷണിക പ്രയോഗം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: חִתַּת אֱלֹהִים എന്ന construct പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു ഭീതി
  alternative: ദൈവത്തിന്റെ ഭീതി; അതിഭയങ്കരമായ ഒരു ഭീതി
  rationale: സന്ദർഭത്തിൽ ഇത് യാക്കോബിന്റെ കുടുംബത്തെ സംരക്ഷിക്കുന്നതിനായി ദൈവത്തിൽനിന്ന് ഉണ്ടായ ഭീതിയെന്ന വായനയ്ക്കാണ് കൂടുതൽ സാധ്യത. എങ്കിലും construct രൂപം ‘ദൈവത്തിന്റെ ഭീതി’ എന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വായനയും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; വെറും തീവ്രതാസൂചകമായി മാത്രം പരിഭാഷപ്പെടുത്തുന്നത് ദൈവിക പ്രവർത്തനത്തെ മറച്ചേക്കാം.
- issue: בְּנֵי יַעֲקֹב എന്നതിലെ ലിംഗസൂചന
  choice: യാക്കോബിന്റെ പുത്രന്മാർ
  alternative: യാക്കോബിന്റെ മക്കൾ
  rationale: ഇവിടെ എബ്രായം പുരുഷസന്തതികളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിഷ്പക്ഷമായ പൊതുപദം ഉപയോഗിക്കാതെ ആ സൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ പട്ടണങ്ങളുടെ personification മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ആ പട്ടണങ്ങളിലുള്ളവർ’ എന്നു വ്യക്തമാക്കി; ദൈവിക ഉറവിടത്തെക്കുറിച്ചുള്ള യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
