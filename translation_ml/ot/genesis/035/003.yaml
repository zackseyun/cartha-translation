source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: ml
  text: നമുക്ക് എഴുന്നേറ്റ് ബേഥേലിലേക്കു കയറിപ്പോകാം. എന്റെ കഷ്ടതയുടെ നാളിൽ എനിക്ക് ഉത്തരം നൽകിയ[a] ദൈവത്തിന് അവിടെ ഞാൻ ഒരു യാഗപീഠം നിർമിക്കും; ഞാൻ പോയ വഴിയിൽ അവിടുന്ന് എന്നോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എനിക്ക് ഉത്തരം നൽകുന്ന.” എബ്രായത്തിലെ ഈ ക്രിയാരൂപം ദൈവത്തിന്റെ പൊതുവായതോ തുടരുന്നതോ ആയ പ്രവർത്തനത്തെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: നമുക്ക് എഴുന്നേറ്റ്
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנַעֲלֶה
  choice: കയറിപ്പോകാം
  rationale: עלה എന്ന ക്രിയയിലെ ഉയരത്തിലേക്കുള്ള സഞ്ചാരസൂചനയും ആഹ്വാനഭാവവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: അവിടെ ഞാൻ ഒരു യാഗപീഠം നിർമിക്കും
  rationale: עשה എന്നതിന്റെ വിശാലമായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ എന്ന അർത്ഥം, യാഗപീഠത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളപ്രയോഗമായ ‘നിർമിക്കും’ എന്നു നൽകി.
- source_word: לָאֵל
  choice: ദൈവത്തിന്
  rationale: לְ എന്ന ഉപസർഗത്തിലെ സമർപ്പണദിശ ‘-ത്തിന്’ എന്ന വിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള വിശേഷണവാക്യം ഏത് ദൈവമെന്ന് നിർവചിക്കുന്നു.
- source_word: הָעֹנֶה אֹתִי
  choice: എനിക്ക് ഉത്തരം നൽകിയ
  rationale: പങ്കാളിക്രിയാരൂപം ഒരു നിർവചനാത്മക ഉപവാക്യമായി നൽകി. സന്ദർഭം മുൻകാലത്തെ പ്രത്യേക ദൈവിക പ്രതികരണത്തെ ഓർക്കുന്നതിനാൽ ഭൂതകാലം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; തുടരുന്ന സ്വഭാവസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בְּיוֹם צָרָתִי
  choice: എന്റെ കഷ്ടദിവസത്തിൽ
  rationale: ‘എന്റെ കഷ്ടതയുടെ ദിവസത്തിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘ദിവസം’ എന്ന ദൃശ്യതയും ദുരിതത്തിന്റെ അർത്ഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי עִמָּדִי
  choice: അവിടുന്ന് എന്നോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: കഥനത്തിലെ ലളിതഭൂതകാലവും ദൈവസാന്നിധ്യത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയും സംരക്ഷിക്കുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: ഞാൻ പോയ വഴിയിൽ
  rationale: דרך, הלך എന്നിവയിലെ മൂർത്തമായ ‘വഴി/പോകുക’ എന്ന ദൃശ്യഭാഷ സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ വാക്കുകളിലെ אֵל എന്നതിന്റെ നിർദേശം
  choice: തുടർന്നുള്ള നിർവചനവാക്യത്തോടുകൂടിയ ‘ദൈവത്തിന്’
  alternative: ‘ആ ദൈവത്തിന്’
  rationale: എബ്രായത്തിലെ നിർവചനസൂചനയെ തുടർന്നുള്ള ‘എനിക്ക് ഉത്തരം നൽകിയ’ എന്ന ഉപവാക്യം മലയാളത്തിൽ മതിയായ വിധം വ്യക്തമാക്കുന്നു. ‘ആ’ ചേർക്കാതെ സ്വാഭാവികത നിലനിർത്തുമ്പോഴും യാക്കോബ് തന്റെ അനുഭവത്തിലൂടെ ദൈവത്തെ പ്രത്യേകമായി തിരിച്ചറിയുന്നതു സംരക്ഷിക്കുന്നു.
- issue: הָעֹנֶה എന്ന പങ്കാളിക്രിയയുടെ കാലസൂചന
  choice: എനിക്ക് ഉത്തരം നൽകിയ
  alternative: എനിക്ക് ഉത്തരം നൽകുന്ന
  rationale: സന്ദർഭം യാക്കോബിന്റെ മുൻകാല കഷ്ടതയിലെ പ്രത്യേക മറുപടിയെ ഓർക്കുന്നു. എന്നാൽ പങ്കാളിക്രിയ ദൈവത്തിന്റെ പൊതുവായോ തുടരുന്നതായോ ഉള്ള സ്വഭാവം സൂചിപ്പിക്കാമെന്ന യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കയറിപ്പോകാം,’ ‘യാഗപീഠം,’ ‘എന്നോടുകൂടെ’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ സ്ഥലപരവും ആരാധനാപരവും ബന്ധപരവുമായ സൂചനകൾ നിലനിർത്തുന്നു. വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും ആശയക്രമം സംരക്ഷിച്ചിട്ടുണ്ട്.
