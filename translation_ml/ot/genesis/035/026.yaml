source:
  edition: WLC
  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: ml
  text: 'ലേയയുടെ ദാസിയായ[a] സില്പയുടെ പുത്രന്മാർ: ഗാദും ആശേരും. ഇവരാണ് പദ്ദൻ-അരാമിൽ യാക്കോബിനു ജനിച്ച പുത്രന്മാർ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസി’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രായപദത്തിന് ‘പരിചാരിക’ എന്നും, സാമൂഹിക പദവിയെ കൂടുതൽ വ്യക്തമായി സൂചിപ്പിക്കാൻ ‘അടിമസ്ത്രീ’ എന്നും പരിഭാഷ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യം പുത്രന്മാർ യാക്കോബിനു ‘പദ്ദൻ-അരാമിൽ’ ജനിച്ചു എന്നു പറയുന്നു. എന്നാൽ 16–18 വാക്യങ്ങൾ ബെന്യാമീൻ പിന്നീട് കനാനിൽ ജനിച്ചതായി പറയുന്നു. ഈ പിരിമുറുക്കത്തെ എങ്ങനെ മനസ്സിലാക്കണമെന്നതിൽ വ്യാഖ്യാനഭേദമുണ്ട്; ചിലർ ഈ പ്രസ്താവനയെ യാക്കോബിന്റെ പദ്ദൻ-അരാം കുടുംബകാലത്തിന്റെ സംഗ്രഹമായി കാണുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: സില്പയുടെ പുത്രന്മാർ
  rationale: בְנֵי എന്നത് ഈ വംശാവലിപ്പട്ടികയിൽ പ്രത്യേകമായി ‘പുത്രന്മാർ’ എന്നാണ്; זִלְפָּה എന്ന വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שִׁפְחַת לֵאָה
  choice: ലേയയുടെ ദാസിയായ
  rationale: ശിഫ്ഹാ ഒരു സ്ത്രീദാസിയെയോ അടിമസ്ത്രീയെയോ സൂചിപ്പിക്കാം. ‘ദാസിയായ’ എന്നത് സ്ത്രീലിംഗവും സാമൂഹിക അധീനതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; പദത്തിന്റെ കൂടുതൽ കടുത്ത സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: גָּד וְאָשֵׁר
  choice: ഗാദും ആശേരും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾരൂപങ്ങളിൽ നൽകി; וְ എന്ന സംയോജകം ‘-ഉം ... -ഉം’ എന്ന സ്വാഭാവിക പട്ടികാരൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: ഇവരാണ് ... യാക്കോബിന്റെ പുത്രന്മാർ
  rationale: സംഗ്രഹപ്രസ്താവനയിലെ אֵלֶּהയ്ക്ക് ഊന്നൽ നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം; בְּנֵי എന്നതിന്റെ പുരുഷസന്താനസൂചന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: യാക്കോബിനു ജനിച്ച
  rationale: ഹീബ്രായ നിഷ്ക്രിയക്രിയയും לוֹ എന്ന പരോക്ഷബന്ധവും ‘അവനു ജനിച്ച’ എന്ന അർഥത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി; ഇല്ലാത്ത സ്ത്രീകർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: בְּפַדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽ
  rationale: സ്ഥലനാമം വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു; സംയുക്ത സ്ഥലനാമം ഹൈഫനോടെ നൽകി.
theological_decisions:
- issue: എല്ലാ പുത്രന്മാരും പദ്ദൻ-അരാമിൽ ജനിച്ചു എന്നതായി തോന്നുന്ന സമഗ്രപ്രസ്താവനയും ബെന്യാമീന്റെ കനാൻജനനവും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: മൂലവാക്യത്തിലെ ‘പദ്ദൻ-അരാമിൽ യാക്കോബിനു ജനിച്ച പുത്രന്മാർ’ എന്ന പൊതുവായ പ്രസ്താവന മാറ്റാതെ നിലനിർത്തി.
  alternative: ബെന്യാമീനെ ഒഴിവാക്കുന്നതായി മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക, അല്ലെങ്കിൽ ‘പദ്ദൻ-അരാം കാലഘട്ടവുമായി ബന്ധപ്പെട്ട’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഉല്പത്തി 35:16–18 ബെന്യാമീൻ കനാനിൽ ജനിച്ചതായി പറയുന്നു. എന്നാൽ ഈ വാക്യത്തിലെ സ്ഥലസൂചനയെ പരിഭാഷയിൽ തിരുത്തുകയോ ചുരുക്കുകയോ ചെയ്യുന്നത് ഹീബ്രായത്തിലെ യഥാർഥ പിരിമുറുക്ക് ഇല്ലാതാക്കും; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-ശൈലി ഉപയോഗിച്ചു. ‘ദാസിയായ’ എന്ന രൂപം വായനാസൗകര്യം നൽകുമ്പോഴും ഹീബ്രായപദത്തിലെ സാമൂഹിക അധീനത പൂർണമായി മൃദൂകരിക്കാതിരിക്കാൻ പര്യായം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
