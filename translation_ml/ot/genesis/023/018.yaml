lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: അബ്രാഹാമിന്
  rationale: നിയമപരമായ കൈമാറ്റത്തിന്റെ സ്വീകർത്താവിനെ לְ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദത്തിവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: לְמִקְנָה
  choice: അവകാശമായി
  rationale: മִקְנָה വാങ്ങിയെടുത്ത സ്വത്ത് അഥവാ കൈവശാവകാശം സൂചിപ്പിക്കുന്നു; ഇവിടെ ഇടപാടിന്റെ ഫലമായ ഉടമസ്ഥാവകാശമാണ് പ്രധാനം.
- source_word: לְעֵינֵי
  choice: കൺമുമ്പിൽ
  rationale: പരസ്യമായ ദൃശ്യസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְנֵי חֵת
  choice: ഹേത്തിന്റെ മക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബ-വംശീയ സംജ്ഞ നിലനിർത്തുന്നു; സന്ദർഭോചിതമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּכֹל בָּאֵי
  choice: പ്രവേശിച്ച എല്ലാവരുടെയും മുമ്പിൽ
  rationale: ഇടപാടിന് സാക്ഷികളായ മുഴുവൻ പൊതുസമൂഹത്തെയും പങ്കാളികൃത്തിൽനിന്നുള്ള ബന്ധവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שַׁעַר עִירוֹ
  choice: അവന്റെ നഗരകവാടത്തിൽ
  rationale: നഗരകവാടമെന്ന പൊതുവും നിയമപരവുമായ ഇടം വ്യക്തമായി നൽകുന്നു; עִירוֹയിലെ പുരുഷലിംഗ ഏകവചന സർവനാമത്തിന്റെ അവ്യക്തമായ സൂചന സംരക്ഷിക്കുന്നു.
