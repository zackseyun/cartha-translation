  language: ml
  text: അബ്രാഹാമിന് സ്വന്തമായി ഉറപ്പിക്കപ്പെട്ടു—ഹേത്തിന്റെ മക്കളുടെ[a] കൺമുമ്പിലും അവന്റെ നഗരകവാടത്തിൽ പ്രവേശിച്ച എല്ലാവരുടെയും മുമ്പിലും.
