  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ സ്വത്തുക്കളുടെ നിയമപരമായ സ്ഥിരീകരണം പൂർത്തിയാക്കുന്നതിനാൽ മലയാളത്തിൽ സമ്പൂർണ്ണതയ്ക്കായി “ഉറപ്പിക്കപ്പെട്ടു” ചേർത്തിരിക്കുന്നു; ഉറവിടഭാഷയിൽ ക്രിയ മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്.
