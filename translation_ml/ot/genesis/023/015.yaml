  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പുരാതന വിലപേശലിലെ ആദരപൂർവമായ സംഭാഷണഭാവം സൂക്ഷിക്കാൻ ‘അങ്ങ്’ രൂപങ്ങൾ ഉപയോഗിച്ചു; ‘ശേക്കെൽ’ എന്ന അളവുപേര് ലിപ്യന്തരണം ചെയ്തു.
