base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: ml
  text: '“യജമാനനേ, ഞാൻ പറയുന്നത് കേൾക്കണമേ: നാനൂറു ശേക്കെൽ വെള്ളി വിലയുള്ള ഒരു ഭൂമിത്തുണ്ട്—എനിക്കും അങ്ങേക്കും ഇടയിൽ അതെന്താണ്? അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്യുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഭൂമി—നാനൂറു ശേക്കെൽ വെള്ളി—എനിക്കും അങ്ങേക്കും ഇടയിൽ അതെന്താണ്?” എബ്രായപ്രയോഗം വാക്കുകൾ ലോപിച്ച സംക്ഷിപ്തമായ ആലങ്കാരിക ചോദ്യമാണ്; വിലപേശലിനിടെ തുക നിസ്സാരമാണെന്ന ഭാവം അതു നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ദൈവിക സ്ഥാനപ്പേരല്ല, എഫ്രോനോടുള്ള ആദരപൂർവമായ ഏകവചന സംബോധനയാണ്; സാമൂഹിക ബഹുമാനം നിലനിർത്തുന്നു.
- source_word: שְׁמָעֵנִי
  choice: ഞാൻ പറയുന്നത് കേൾക്കണമേ
  rationale: വിനയപൂർവമായ അഭ്യർഥനയുടെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶרֶץ
  choice: ഒരു തുണ്ട് ഭൂമി
  rationale: ഭൂമിയെ പൊതുവായി അല്ല, ഇടപാടിലുള്ള നിർദിഷ്ട സ്ഥലഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: നാനൂറു ശേക്കെൽ വെള്ളി വിലയുള്ള
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ വിലപ്രയോഗം അർഥം കൂട്ടിച്ചേർക്കാതെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: בֵּינִי וּבֵינְךָ
  choice: എനിക്കും അങ്ങേക്കും ഇടയിൽ
  rationale: ഒന്നാംപുരുഷ-രണ്ടാംപുരുഷ ഏകവചനങ്ങളുടെ വ്യക്തിപരവും ആദരപൂർവവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: מַה הִוא
  choice: അത് എന്തുള്ളൂ?
  rationale: വിലയെ നിസ്സാരമാക്കി കാണിക്കുന്ന വിലപേശൽസന്ദർഭത്തിലെ ആലങ്കാരിക ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: അങ്ങയുടെ മരിച്ചവളെ അടക്കം ചെയ്തുകൊള്ളുക
  rationale: സാറായെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അന്തിമ ആജ്ഞയുടെ നേരിട്ടുള്ള ഭാവവും ആദരസൂചക അഭിസംബോധനയും നിലനിർത്തുന്നു.
