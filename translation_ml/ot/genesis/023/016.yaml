- from: അങ്ങനെ അബ്രാഹാം എഫ്രോന്റെ വാക്കു കേട്ടു. ഹേത്തിന്റെ പുത്രന്മാർ[a] കേൾക്കെ എഫ്രോൻ പറഞ്ഞ തുകയായ, വ്യാപാരികൾക്കിടയിൽ പ്രചാരത്തിലുണ്ടായിരുന്ന നാനൂറു ശേക്കെൽ വെള്ളി[b] അബ്രാഹാം അവനു തൂക്കിക്കൊടുത്തു.
