source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָהָם֮ אֶל עֶפְרוֹן֒ וַ/יִּשְׁקֹ֤ל אַבְרָהָם֙ לְ/עֶפְרֹ֔ן אֶת הַ/כֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/אָזְנֵ֣י בְנֵי חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַ/סֹּחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: ml
  text: അങ്ങനെ അബ്രാഹാം എഫ്രോന്റെ വാക്കു കേട്ടു. ഹേത്തിന്റെ പുത്രന്മാർ[a] കേൾക്കെ എഫ്രോൻ പറഞ്ഞതുപോലെ, വ്യാപാരത്തിൽ അംഗീകരിക്കപ്പെട്ടിരുന്ന നാനൂറു ശേക്കെൽ വെള്ളി[b] അബ്രാഹാം അവനു തൂക്കിക്കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹിത്യർ’; അക്ഷരാർഥം ‘ഹേത്തിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വ്യാപാരിക്ക് സ്വീകാര്യമായ’ അല്ലെങ്കിൽ ‘വ്യാപാരികളുടെ നിലവാരത്തൂക്കപ്രകാരമുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: അബ്രാഹാം എഫ്രോന്റെ വാക്കു കേട്ടു
  rationale: שׁמע אל എന്ന പ്രയോഗം ഇവിടെ എഫ്രോന്റെ വിലനിർദേശം കേട്ട് അത് സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘വാക്കു കേട്ടു’ എന്നത് സമ്മതം എന്ന ആശയം അതിരുകടന്ന് ചേർക്കാതെ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׁקֹל
  choice: തൂക്കിക്കൊടുത്തു
  rationale: നാണയപ്രചാരത്തിനു മുമ്പ് വെള്ളി തൂക്കി പണമടച്ചിരുന്ന ചരിത്രപരമായ ഇടപാട് ഈ പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַכֶּסֶף אֲשֶׁר דִּבֶּר
  choice: പറഞ്ഞ തുകയായ ... വെള്ളി
  rationale: അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞ വെള്ളി’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ എഫ്രോൻ പറഞ്ഞ തുകയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘പറഞ്ഞ തുകയായ ... വെള്ളി’ എന്നു നൽകി.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: ‘ചെവികളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പൊതുസാക്ഷ്യസ്വഭാവം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാർ
  rationale: വംശപരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; പരിചിതമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: നാനൂറു ശേക്കെൽ വെള്ളി
  rationale: പുരാതന തൂക്കഘടകവും വെള്ളി എന്ന വസ്തുവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: עֹבֵר לַסֹּחֵר
  choice: വ്യാപാരികൾക്കിടയിൽ പ്രചാരത്തിലുണ്ടായിരുന്ന
  rationale: വ്യാപാരത്തിൽ അംഗീകരിക്കപ്പെട്ടതോ നിലവാരമുള്ള തൂക്കത്തിലുള്ളതോ ആയ വെള്ളി എന്ന വാണിജ്യാർഥം നൽകുന്നു; മൂലത്തിലെ പ്രയോഗപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ‘ശേക്കെൽ’, ‘വെള്ളി’, ‘തൂക്കിക്കൊടുത്തു’ എന്നീ പദങ്ങൾ പുരാതന വാണിജ്യസന്ദർഭം സംരക്ഷിക്കുന്നു; മൂലത്തിലെ ആവർത്തനം അമിതമായി കടുപ്പമാകാതിരിക്കാൻ വാക്യം രണ്ടായി ക്രമപ്പെടുത്തി.
