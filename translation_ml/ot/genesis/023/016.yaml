  terminology: ‘ശേക്കെൽ,’ ‘വെള്ളി,’ and ‘ഹേത്തിന്റെ പുത്രന്മാർ’ are suitable. The lexical-alternative footnotes are well anchored and useful. The commercial phrase should avoid implying minted or circulating currency.
  issues:
