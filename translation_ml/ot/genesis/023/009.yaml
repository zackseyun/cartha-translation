  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: ml
  text: അവനു സ്വന്തമായ, അവന്റെ വയലിന്റെ അറ്റത്തുള്ള മഖ്പേലാ ഗുഹ അവൻ എനിക്കു തരട്ടെ. മുഴുവൻ വില വെള്ളിയായി നൽകി[a], നിങ്ങളുടെ മധ്യേ, കല്ലറയ്ക്കുള്ള ഒരു അവകാശസ്വത്തായി[b] അവൻ അത് എനിക്കു തരട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘പൂർണ വെള്ളിക്ക്’; മുഴുവൻ വില വെള്ളിയായി നൽകുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശവസംസ്കാരത്തിനുള്ള ഒരു അവകാശസ്വത്തായി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം വെറും ഉപയോഗാവകാശത്തേക്കാൾ നിയമപരമായ കൈവശാവകാശത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: തരാൻ അവനോട് പറയുക
  rationale: അഭ്യർഥനയുടെ പശ്ചാത്തലത്തിലുള്ള യുസ്സീവ് ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: മഖ്പേലാ ഗുഹ
  rationale: മഖ്പേലാ എന്ന പേരിനെ ലിപ്യന്തരണം ചെയ്ത്, നിർമാണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: അവനു സ്വന്തമായതുമായ
  rationale: ഉടമസ്ഥതയും ഇടപാടിലെ നിയമപരമായ സൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: അവന്റെ വയലിന്റെ അറ്റത്തുള്ളതും
  rationale: קצה എന്ന പദത്തിന്റെ അറ്റം/അരിക് എന്ന സ്ഥലസൂചനയിൽ ‘അറ്റം’ തിരഞ്ഞെടുത്തെങ്കിലും അതിനെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: בְּכֶסֶף מָלֵא
  choice: അതിന്റെ മുഴുവൻ വിലയും വെള്ളിയായി കൊടുത്ത്
  rationale: ‘പൂർണ വെള്ളി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പൂർണവില നൽകുക എന്ന വാണിജ്യാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; വെള്ളി എന്ന പണമാധ്യമവും നിലനിർത്തുന്നു.
- source_word: יִתְּנֶנָּה
  choice: അവൻ അത് എനിക്കു തരട്ടെ
  rationale: വിലകൊടുത്തുള്ള കൈമാറ്റമാണെങ്കിലും נתן എന്ന ‘തരുക’ എന്ന ക്രിയയുടെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: בְּתוֹכְכֶם
  choice: നിങ്ങളുടെ മധ്യേ
  rationale: ഹിത്യസമൂഹത്തിനുള്ളിൽ, അവരുടെ അംഗീകാരസാന്നിധ്യത്തിൽ നടക്കുന്ന ഇടപാട് എന്ന ഇരട്ടസൂചന സംരക്ഷിക്കുന്നു.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: ഒരു ശ്മശാനസ്വത്തായി
  rationale: അടക്കത്തിനുള്ള താൽക്കാലിക ഉപയോഗസ്ഥലം മാത്രമല്ല, നിയമപരമായി കൈവശമുള്ള സ്വത്ത് എന്ന אֲחֻזָּהയുടെ ഭാവം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മഖ്പേലാ’ എന്ന രൂപം എബ്രായ നാമത്തിന്റെ ലിപ്യന്തരണം; ‘ശ്മശാനസ്വത്ത്’ നിയമപരമായ ഉടമസ്ഥതയുടെ ഭാവം ചുരുക്കമായി അറിയിക്കുന്നു.
