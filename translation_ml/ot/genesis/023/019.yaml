source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: ml
  text: ഇതിനുശേഷം അബ്രാഹാം തന്റെ ഭാര്യ സാറയെ കനാൻദേശത്ത് മമ്രേയ്ക്ക് അഭിമുഖമായുള്ള[a] മക്പേലാ വയലിലെ ഗുഹയിൽ അടക്കം ചെയ്തു. മമ്രേ തന്നെയാണ് ഹെബ്രോൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മമ്രേയ്ക്ക് എതിർവശത്തുള്ള.’ എബ്രായപ്രയോഗം മമ്രേയുടെ മുമ്പിലോ അതിന് അഭിമുഖമായോ ഉള്ള ഒരു സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ഇതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ കാലക്രമം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനസംക്രമണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קָבַר
  choice: അടക്കം ചെയ്തു
  rationale: ശവസംസ്കാരസന്ദർഭത്തിൽ ‘അടക്കം ചെയ്തു’ എന്നത് വ്യക്തവും മാന്യവും സാധാരണവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യ സാറയെ
  rationale: എബ്രായത്തിലെ ബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: אֶל מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: മക്പേലാ വയലിലെ ഗുഹയിൽ
  rationale: אֶל എന്നത് അടക്കം ചെയ്യലിന്റെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്ഥലാധികരണമായ ‘ഗുഹയിൽ’ സ്വാഭാവികമാണ്; construct ബന്ധം വായനാസൗകര്യത്തിനായി ‘വയലിലെ ഗുഹ’ എന്നു നൽകുന്നു.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: മമ്രേയ്ക്ക് അഭിമുഖമായുള്ള
  rationale: മമ്രേയുടെ മുമ്പിൽ അഥവാ അതിന് എതിർവശത്ത് എന്ന സ്ഥലബന്ധം ദിശയെ അനാവശ്യമായി കൂടുതൽ കൃത്യമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הִוא חֶבְרוֹן
  choice: മമ്രേ തന്നെയാണ് ഹെബ്രോൻ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം സമീപസ്ഥമായ മമ്രേയെ ഹെബ്രോൻ എന്നു തിരിച്ചറിയിക്കുന്നതായി നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘കനാൻദേശത്തിൽ’ എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രസ്താവന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
