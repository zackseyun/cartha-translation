  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ സാധാരണ മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു; എബ്രായത്തിലെ സ്ഥലബന്ധത്തിന്റെ യഥാർഥ വ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
