id: GEN.23.8
reference: Genesis 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: ml
  text: 'അവൻ അവരോടു സംസാരിച്ചു: “എന്റെ മരിച്ചയാളെ എന്റെ കൺമുന്നിൽനിന്ന് അടക്കം ചെയ്യാൻ നിങ്ങൾക്കു മനസ്സുണ്ടെങ്കിൽ, എന്റെ വാക്കു കേൾക്കുക; എനിക്കുവേണ്ടി സോഹറിന്റെ മകനായ എഫ്രോനോട് അഭ്യർഥിക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എനിക്കുവേണ്ടി എഫ്രോനെ സമീപിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ഒരാളെ സമീപിക്കുക എന്നും ഒരാളോടു മറ്റൊരാൾക്കുവേണ്ടി അഭ്യർഥിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: 'അവൻ അവരോടു സംസാരിച്ചു:'
  rationale: דבר with אִתָּם is represented as speaking with/to them, while the colon naturally introduces the direct speech expressed by לֵאמֹר in modern Malayalam.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: നിങ്ങൾക്കു മനസ്സുണ്ടെങ്കിൽ
  rationale: The Hebrew idiom involving נֶפֶשׁ expresses desire or willingness here. This Malayalam idiom is natural and retains the volitional sense.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: എന്റെ മരിച്ചയാളെ ... അടക്കം ചെയ്യാൻ
  rationale: The singular expression is retained without inserting the interpretive noun ‘wife.’ ‘മരിച്ചയാൾ’ is dignified and understandable in the burial context.
- source_word: מִלְּפָנַי
  choice: എന്റെ കൺമുന്നിൽനിന്ന്
  rationale: This preserves the image ‘from before me’ while communicating removal from Abraham’s sight/presence through burial.
- source_word: שְׁמָעוּנִי
  choice: എന്റെ വാക്കു കേൾക്കുക
  rationale: In this appeal, the imperative means to listen or heed. The chosen Malayalam is natural and carries both hearing and attending to the request.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: എനിക്കുവേണ്ടി ... എഫ്രോനോട് അഭ്യർഥിക്കുക
  rationale: In this negotiation context, פגע with ב and the benefactive לִי conveys making an appeal to Ephron on Abraham’s behalf. The rendering is clear without implying a technical religious form of intercession.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: സോഹറിന്റെ മകനായ എഫ്രോൻ
  rationale: The names are transliterated, and the filial relationship is stated transparently in idiomatic Malayalam.
theological_decisions:
- issue: Whether to identify the deceased explicitly as Abraham’s wife Sarah
  choice: എന്റെ മരിച്ചയാളെ
  alternative: എന്റെ മരിച്ച ഭാര്യയെ / സാറയെ
  rationale: The Hebrew says only ‘my dead/deceased one.’ The translation does not import the contextual identification into the wording of this verse.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വാക്യത്തിന്റെ അപേക്ഷാഭാവവും ‘എന്റെ മരിച്ചയാൾ’ എന്ന ഉദ്ദേശപൂർവമായ അസ്പഷ്ടതയും നിലനിർത്തിയിരിക്കുന്നു.
