  rationale: The revision removes the unnecessarily master-servant nuance of “യജമാനനേ” and replaces an awkwardly literal rendering of the community-witness idiom with natural modern Malayalam. It preserves the Hebrew’s repeated performative “I give,” its public nature, and its unspecific expression for the deceased person.
