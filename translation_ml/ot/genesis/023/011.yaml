  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. അബ്രാഹാമിനോടുള്ള വിനയം ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ‘കേൾക്കണമേ’ എന്നും പ്രകടമാക്കി; നിയമപരമായ സ്വത്തുകൈമാറ്റത്തിന്റെ ആവർത്തനവും പൊതുസാക്ഷ്യത്തിന്റെ ഭാവവും നിലനിർത്തി.
