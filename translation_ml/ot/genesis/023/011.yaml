source:
  edition: WLC
  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: ml
  text: “അല്ല[a], പ്രഭോ, എന്റെ വാക്കു കേൾക്കണമേ. വയൽ ഞാൻ അങ്ങേക്കു തരുന്നു; അതിലുള്ള ഗുഹയും അങ്ങേക്കു തരുന്നു. എന്റെ ജനത്തിലെ ആളുകളുടെ കൺമുമ്പിൽവെച്ച്[b] ഞാൻ അത് അങ്ങേക്കു തരുന്നു. അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്തുകൊള്ളുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അങ്ങനെയല്ല, പ്രഭോ; എന്റെ വാക്കു കേൾക്കണമേ.”'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “എന്റെ ജനത്തിന്റെ മക്കളുടെ കണ്ണുകൾക്കു മുമ്പിൽ”; തന്റെ സമൂഹത്തിലെ സാക്ഷികളുടെ സാന്നിധ്യത്തിൽ പരസ്യമായി എന്നർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: അല്ല
  rationale: അബ്രാഹാമിന്റെ നിർദേശം വിനയത്തോടെ നിരസിക്കുകയോ തിരുത്തുകയോ ചെയ്യുന്ന പ്രയോഗമാണിത്; വെറും നിഷേധമായി മാത്രം വായിക്കേണ്ടതില്ല.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഇവിടെ ദൈവിക നാമമല്ല, അബ്രാഹാമിനോടുള്ള ആദരസൂചകമായ സംബോധനയാണ്. ആ സാമൂഹിക വിനയം നിലനിർത്തുന്നു.
- source_word: שְׁמָעֵנִי
  choice: എന്റെ വാക്കു കേൾക്കണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ അഭ്യർഥനാഭാവവും ആദരമുള്ള സംഭാഷണശൈലിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയൽ
  rationale: സ്വത്തുകൈമാറ്റത്തിന്റെ പശ്ചാത്തലത്തിൽ തുറന്ന ഭൂവിഭാഗം/വയൽ എന്ന നേരിട്ടുള്ള അർഥം യോജിക്കുന്നു.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: ഞാൻ അങ്ങേക്കു തരുന്നു
  rationale: ഹീബ്രു പൂർണ്ണക്രിയ ഇവിടെ സംസാരത്തിലൂടെ ഇപ്പോൾ നടപ്പാക്കുന്ന കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാനകാലം ആ നിർവഹണബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: അതിലുള്ള ഗുഹ
  rationale: ഗുഹ വയലിനുള്ളിലാണെന്ന സ്ഥലബന്ധം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: എന്റെ ജനത്തിന്റെ മക്കളുടെ കൺമുമ്പിൽവെച്ച്
  rationale: ‘എന്റെ ജനത്തിന്റെ മക്കളുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം പൊതുസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; രൂപവും അർഥവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: קְבֹר מֵתֶךָ
  choice: അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്തുകൊള്ളുക
  rationale: നേരിട്ടുള്ള ആജ്ഞ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സാറായെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിലെ ‘നിന്റെ മരിച്ചയാൾ’ എന്ന പ്രയോഗത്തെ പേരിട്ട് കൂടുതൽ നിർവചിക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
