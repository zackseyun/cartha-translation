lexical_decisions:
- source_word: וַיָּקָם
  choice: അപ്പോൾ അബ്രാഹാം എഴുന്നേറ്റ്
  rationale: קום എന്ന ധാതുവിന്റെ ഖാൽ വയ്യിഖ്തോൽ രൂപം എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർച്ചയായ വാവ് ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായി ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: שׁחה എന്ന ക്രിയ ആദരസൂചകമായി കുനിയുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. ഇവിടെ പൂർണ സാഷ്ടാംഗപ്രണാമം നിർബന്ധമാക്കാതെ ദൃശ്യമായ ആദരപ്രകടനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
- source_word: לְעַם הָאָרֶץ
  choice: ദേശവാസികളുടെ മുമ്പിൽ
  rationale: പദശഃ ‘ദേശത്തിലെ ജനങ്ങൾ.’ ഇവിടെ പ്രാദേശിക നിവാസികളെയാണ് ഉദ്ദേശിക്കുന്നത്; നമസ്കാരത്തിന്റെ ദിശയെയോ അഭിമുഖീകരിച്ചവരെയോ സൂചിപ്പിക്കുന്ന לְ മലയാളത്തിൽ ‘മുമ്പിൽ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: לִבְנֵי חֵת
  choice: ഹേതിന്റെ പുത്രന്മാരുടെ മുമ്പിൽ
  rationale: പദശഃ ‘ഹേതിന്റെ പുത്രന്മാർ.’ എബ്രായത്തിലെ വംശാവലിപരമായ ജനവിഭാഗനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ആവർത്തിച്ച לְ എന്ന ഘടന മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: חֵת
  choice: ഹേത്
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണത്തിൽ നൽകി.
