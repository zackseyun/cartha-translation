revisions:
- from: അപ്പോൾ അബ്രാഹാം എഴുന്നേറ്റ് ദേശവാസികളുടെ മുമ്പിൽ—ഹേതിന്റെ പുത്രന്മാരുടെ മുമ്പിൽ—കുനിഞ്ഞു നമസ്കരിച്ചു.[a]
  to: അപ്പോൾ അബ്രാഹാം എഴുന്നേറ്റു, ദേശത്തെ ജനങ്ങളായ ഹേതിന്റെ പുത്രന്മാരുടെ മുമ്പിൽ വണങ്ങി.[a]
  rationale: 'The revision retains all source elements while expressing the apposition naturally: the people of the land are the sons of Heth. “വണങ്ങി” conveys the physical act of respectful bowing without over-specifying full prostration or religious worship. The footnote is corrected to distinguish the Hebrew ethnic expression from the Malayalam relational wording required by the verb.'
  reviewer_model: gpt-5.6-terra
