translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആദരസൂചകമായ ശാരീരിക കുനിയൽ വ്യക്തമാക്കാൻ ‘കുനിഞ്ഞു നമസ്കരിച്ചു’ ഉപയോഗിച്ചു; ദേശവാസികളും ഹേതിന്റെ പുത്രന്മാരും ഒരേ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന അനുബന്ധപ്രയോഗമാണെന്നത് ഇടയ്ക്കുള്ള ദീർഘവിരാമങ്ങളിലൂടെ വ്യക്തമാക്കി.
