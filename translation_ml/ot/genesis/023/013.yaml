id: GEN.23.13
reference: Genesis 23:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: ml
  text: 'അവൻ ദേശവാസികൾ കേൾക്കെ എഫ്രോനോടു പറഞ്ഞു: “എന്നാൽ, എന്റെ വാക്കു കേൾക്കണമേ. വയലിനുള്ള വെള്ളി ഞാൻ തരുന്നു[a]; അത് എന്നിൽനിന്ന് സ്വീകരിക്കൂ, അവിടെ എന്റെ മരിച്ചവളെ അടക്കം ചെയ്യാനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ “വയലിനുള്ള വെള്ളി ഞാൻ തന്നിരിക്കുന്നു” എന്നാണ്; ഈ ഇടപാടിൽ അത് ഔപചാരികമായ വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നതാകാം. “ഞാൻ തരും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: דבר എന്നത് ഔപചാരികമായി സംസാരിക്കുന്നതിനെയും സൂചിപ്പിക്കാം; എന്നാൽ ഈ ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘പറഞ്ഞു’ ആണ്.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: ദേശവാസികൾ കേൾക്കെ
  rationale: ‘ദേശത്തിലെ ജനങ്ങളുടെ ചെവികളിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പൊതുസാക്ഷ്യത്തിലുള്ള സംഭാഷണം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: ദയവായി ഞാൻ പറയുന്നത് കേൾക്കണമേ
  rationale: അല്പം അപൂർണ്ണവും ഊന്നലുള്ളതുമായ ഹീബ്രു അഭ്യർഥനയുടെ വിനയപൂർവമായ ഭാവം ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: വയലിന്റെ വിലയായ വെള്ളി ഞാൻ തരുന്നു
  rationale: പൂർണ്ണക്രിയാരൂപം ഇവിടെ ഇടപാടിലെ ഔപചാരികമായ ഇപ്പോഴത്തെ വാഗ്ദാനമായി പ്രവർത്തിക്കാം. ‘വെള്ളി’ മൂലപദത്തിന്റെ ദൃശ്യമായ സാമ്പത്തിക ഭാഷ നിലനിർത്തുന്നു; ‘വിലയായ’ ബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: קַח מִמֶּנִּי
  choice: അത് എന്നിൽനിന്ന് സ്വീകരിക്കൂ
  rationale: സന്ദർഭത്തിൽ അപ്രത്യക്ഷമായ കർമം വെള്ളിയാണ്. ഇടപാടിന്റെ സാഹചര്യത്തിൽ ‘സ്വീകരിക്കൂ’ എന്നത് മലയാളത്തിൽ ‘എടുക്കൂ’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: וְאֶקְבְּרָה
  choice: അങ്ങനെ ... അടക്കം ചെയ്യാൻ എനിക്കാകട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ ഉദ്ദേശ്യവും ആഗ്രഹഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: מֵתִי
  choice: എന്റെ മരിച്ചവളെ
  rationale: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘എന്റെ മരിച്ചവൾ/മരിച്ചയാൾ’ എന്നാണ്; സന്ദർഭത്തിലെ സാറായുടെ സ്ത്രീലിംഗം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു, എന്നാൽ പേര് ചേർക്കുന്നില്ല.
- source_word: שָׁמָּה
  choice: അവിടെ
  rationale: സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തർജമ.
theological_decisions:
- issue: נָתַתִּי എന്ന പൂർണ്ണക്രിയാരൂപത്തിന്റെ കാലവും ഇടപാടുസ്വഭാവവും
  choice: ഞാൻ തരുന്നു
  alternative: ഞാൻ തന്നിരിക്കുന്നു / ഞാൻ തരും
  rationale: ഇവിടെ അബ്രാഹാം പണം കൈമാറാനുള്ള ഔപചാരിക വാഗ്ദാനം നടത്തുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു. പൂർത്തിയായ പണമടവ് എന്നു നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ പ്രകടനാത്മകമായ വർത്തമാനാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; രൂപപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരവും പൊതുസാക്ഷ്യത്തിലുള്ളതുമായ ഇടപാടിന്റെ ഭാവം നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം വാക്യം അത്യന്തം അക്ഷരാർഥപരമാക്കി അസ്വാഭാവികമാക്കിയിട്ടില്ല.
