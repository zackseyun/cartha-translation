source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: ml
  text: 'എഫ്രോൻ ഹേത്തിന്റെ പുത്രന്മാരുടെ ഇടയിൽ ഇരിക്കുകയായിരുന്നു[a]; ഹിത്യനായ എഫ്രോൻ, ഹേത്തിന്റെ പുത്രന്മാർ കേൾക്കെ, തന്റെ നഗരകവാടത്തിൽ[b] പ്രവേശിച്ച എല്ലാവരുടെയും മുമ്പാകെ അബ്രാഹാമിനോടു ഇങ്ങനെ മറുപടി പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹേത്തിന്റെ പുത്രന്മാർ’ എന്നതിന് ‘ഹിത്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം; രണ്ട് സ്ഥലത്തും എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ ‘ഹേത്തിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘നഗരകവാടം’ എന്നത് സാക്ഷികളുടെ മുമ്പിൽ നിയമപരവും വാണിജ്യപരവുമായ കാര്യങ്ങൾ നടത്തിയിരുന്ന പൊതുസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനസന്ദർഭത്തിൽ എഫ്രോന്റെ തുടരുന്ന നിലയെയോ സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ
  choice: ഇടയിൽ
  rationale: കൂടിയിരുന്ന സമൂഹത്തിനുള്ളിൽ എഫ്രോൻ സന്നിഹിതനായിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ വംശപരമായ രൂപം നിലനിർത്തുകയും പിന്നീട് വരുന്ന ‘ഹിത്യൻ’ എന്ന ജനവിഭാഗനാമത്തിൽനിന്ന് അതിനെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലുള്ള ענה എന്ന ക്രിയയുടെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: הַחִתִּי
  choice: ഹിത്യനായ
  rationale: എഫ്രോനെ തിരിച്ചറിയിക്കുന്ന നിർദിഷ്ട ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּאָזְנֵי
  choice: കേൾക്കെ
  rationale: അവർ കേൾക്കുന്നവിധം പരസ്യമായി പറഞ്ഞുവെന്ന എബ്രായ ഭാഷാശൈലിയുടെ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: തന്റെ നഗരകവാടത്തിൽ പ്രവേശിച്ച എല്ലാവരുടെയും മുമ്പാകെ
  rationale: നഗരകവാടത്തിലെ പൊതുസാക്ഷികളുടെ സാന്നിധ്യവും ഇടപാടിന്റെ പരസ്യസ്വഭാവവും നിലനിർത്തുന്നു; ‘തന്റെ’ എന്നത് എഫ്രോനിലേക്കുള്ള പ്രത്യാവർത്തകബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ ... പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള ആഖ്യാനപരമായ അവതാരിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ പൊതുസാക്ഷ്യത്തിന്റെ ഭാവം നിലനിർത്തി; വാക്യാരംഭത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമോ വ്യവഹാരസൂചകമോ ചേർത്തിട്ടില്ല.
