lexical_decisions:
- source_word: וַיָּקָם
  choice: സ്ഥിരീകരിക്കപ്പെട്ടു
  rationale: വിൽപ്പനയുടെ ഈ നിയമപരമായ സന്ദർഭത്തിൽ קום എന്ന ക്രിയ സ്വത്ത് ഇടപാട് ഉറപ്പിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘എഴുന്നേറ്റു’ എന്ന ഭൗതിക അർഥമല്ല.
- source_word: שְׂדֵה עֶפְרוֹן
  choice: എഫ്രോന്റെ നിലം
  rationale: ഹീബ്രു construct chain സ്വാഭാവികമായ മലയാളത്തിൽ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: בַּמַּכְפֵּלָה
  choice: മക്പേലയിലെ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് നിലത്തിന്റെ സ്ഥാനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי מַמְרֵא
  choice: മമ്രേയുടെ മുമ്പിലുള്ള
  rationale: കൃത്യമായ ദിശ അനുമാനിക്കാതെ ‘മുമ്പിൽ/അഭിമുഖമായി’ എന്ന മൂലപദത്തിന്റെ സ്ഥലസംബന്ധിയായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: ആ നിലവും അതിലുള്ള ഗുഹയും
  rationale: സ്വത്തിന്റെ ഘടകങ്ങളെ നിയമപരമായ പട്ടികപോലെ വേർതിരിച്ചു പറയുന്ന മൂലവാക്യത്തിന്റെ ഘടന വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: സകല വൃക്ഷങ്ങളും
  rationale: כָל കൂടിയ ഏകവചന സമാഹാരനാമത്തെ മലയാളത്തിൽ സമഗ്രത സൂചിപ്പിക്കുന്ന ബഹുവചനമായി നൽകുന്നു.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: നിലത്തിന്റെ അതിരിനുള്ളിൽ ചുറ്റുമുണ്ടായിരുന്ന
  rationale: സ്വത്തിന്റെ മുഴുവൻ പരിധിക്കുള്ളിലുള്ള വൃക്ഷങ്ങളെയാണ് ഉൾപ്പെടുത്തുന്നതെന്ന നിയമപരമായ സമഗ്രത വ്യക്തമാക്കുന്നു.
