  text: അങ്ങനെ മക്പേലയിലെ എഫ്രോന്റെ നിലം, മമ്രേയുടെ മുമ്പിലുള്ളത്—ആ നിലവും അതിലുള്ള ഗുഹയും, നിലത്തിലുണ്ടായിരുന്നതും അതിന്റെ ചുറ്റുമുള്ള മുഴുവൻ അതിർത്തിപരിധിയിലും ഉൾപ്പെട്ടിരുന്നതുമായ സകല വൃക്ഷങ്ങളും—സ്ഥിരീകരിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിയമപരമായി സ്ഥാപിതമായി” അല്ലെങ്കിൽ “കൈമാറ്റം ചെയ്യപ്പെട്ടു”; വിൽപ്പനയുടെ ഈ സന്ദർഭത്തിൽ ഹീബ്രു ക്രിയയ്ക്ക് സ്വത്തവകാശം നിയമപരമായി സ്ഥിരീകരിക്കുന്ന അർഥമുണ്ടാകാം.
