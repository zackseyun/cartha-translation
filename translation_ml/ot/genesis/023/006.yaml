  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: ml
  text: “യജമാനനേ, ഞങ്ങളുടെ വാക്കു കേൾക്കണമേ. അങ്ങ് ഞങ്ങളുടെ ഇടയിൽ ദൈവത്തിന്റെ ഒരു പ്രഭുവാണ്.[a] ഞങ്ങളുടെ ഏറ്റവും നല്ല കല്ലറകളിലൊന്നിൽ അങ്ങയുടെ മരിച്ച വ്യക്തിയെ അടക്കം ചെയ്താലും. അങ്ങയുടെ മരിച്ച വ്യക്തിയെ അടക്കം ചെയ്യുന്നതിൽനിന്ന് അങ്ങയെ തടയുന്ന വിധത്തിൽ, ഞങ്ങളിൽ ആരും തന്റെ കല്ലറ അങ്ങേക്കു നിഷേധിക്കുകയില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളുടെ ഇടയിലെ ഒരു മഹാപ്രഭുവാണ്.” “ദൈവത്തിന്റെ ഒരു പ്രഭു” എന്ന എബ്രായ പ്രയോഗം അതിശയോക്തിപരമായ മഹത്ത്വം സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: ഞങ്ങളുടെ വാക്കു കേട്ടാലും
  rationale: ആജ്ഞാരൂപത്തോടുകൂടിയ നേരിട്ടുള്ള അഭ്യർഥനയെ ആധുനിക മലയാളത്തിലെ ആദരപൂർവമായ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: അബ്രാഹാമിനോടുള്ള സാമൂഹിക ആദരവും ഔപചാരിക അഭിസംബോധനയും നിലനിർത്തുന്നു; ഇവിടെ ദൈവനാമത്തെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: נְשִׂיא אֱלֹהִים
  choice: ദൈവത്തിന്റെ ഒരു പ്രഭു
  rationale: ‘ദൈവത്തിന്റെ പ്രഭു’ എന്ന എബ്രായ ഘടന പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; അതിന് അതിശയോക്തിപരമായ ‘മഹാപ്രഭു’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּתוֹכֵנוּ
  choice: ഞങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹത്തിനകത്തെ അബ്രാഹാമിന്റെ സ്ഥാനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: ഞങ്ങളുടെ ഏറ്റവും നല്ല കല്ലറകളിലൊന്നിൽ
  rationale: מבחר എന്നതിന്റെ ‘തിരഞ്ഞെടുത്തത്/ഏറ്റവും നല്ലത്’ എന്ന ഗുണസൂചനയും ബഹുവചനത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പും വ്യക്തമാക്കുന്നു.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്താലും
  rationale: മലയാളത്തിൽ ‘മരിച്ചയാൾ’ എന്ന ഏകവചനരൂപം സാറായെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു; ആജ്ഞയെ ആദരപൂർവമായ അനുമതി/ക്ഷണമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ מִמֶּנּוּ
  choice: ഞങ്ങളിൽ ആരും
  rationale: 'നിഷേധവാക്യത്തിലെ വിതരണാർഥം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു: ‘ഞങ്ങളിൽ ഒരാളും ... ഇല്ല’.'
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: തന്റെ കല്ലറ അങ്ങേക്കു വിട്ടുതരാതിരിക്കുകയില്ല
  rationale: ‘തടഞ്ഞുവെക്കുക/നിഷേധിക്കുക’ എന്ന സന്ദർഭാർഥം മലയാളത്തിലെ ഇരട്ടനിഷേധ ഘടനയിലൂടെ വ്യക്തമായി നൽകുന്നു.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്യുന്നതിൽനിന്ന് അങ്ങയെ തടയാൻ
  rationale: מן + infinitive ഘടനയിലെ തടയൽ/പ്രതിരോധ അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ ഒരു പ്രഭു
  alternative: ഞങ്ങളുടെ ഇടയിലെ ഒരു മഹാപ്രഭു
  rationale: ഈ ഘടന ദൈവവുമായി ഏതെങ്കിലും ബന്ധസൂചന നൽകാമെങ്കിലും, എബ്രായത്തിൽ അതിശയോക്തിപരമായ ഉന്നതതാസൂചനയായും പ്രവർത്തിക്കാം. പ്രധാനവാചകം ഔപചാരിക രൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു യഥാർഥ സാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘അങ്ങ്/അങ്ങയുടെ/അങ്ങേക്കു’ എന്ന ആദരസൂചക രൂപങ്ങൾ ഹിത്യരുടെ വിനയപൂർവമായ അഭിസംബോധന നിലനിർത്തുന്നു. അവസാന വാക്യത്തിലെ എബ്രായ തടയൽഘടന വാക്കുതോറുമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി അർഥം വ്യക്തമായി അവതരിപ്പിച്ചു.
