- from: “യജമാനനേ, ഞങ്ങളുടെ വാക്കു കേട്ടാലും. അങ്ങ് ഞങ്ങളുടെ ഇടയിൽ ദൈവത്തിന്റെ ഒരു പ്രഭുവാണ്.[a] ഞങ്ങളുടെ ഏറ്റവും നല്ല കല്ലറകളിലൊന്നിൽ അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്താലും. അങ്ങയുടെ മരിച്ചയാളെ അടക്കം ചെയ്യുന്നതിൽനിന്ന് അങ്ങയെ തടയാൻ ഞങ്ങളിൽ ആരും തന്റെ കല്ലറ അങ്ങേക്കു വിട്ടുതരാതിരിക്കുകയില്ല.”
  to: “യജമാനനേ, ഞങ്ങളുടെ വാക്കു കേൾക്കണമേ. അങ്ങ് ഞങ്ങളുടെ ഇടയിൽ ദൈവത്തിന്റെ ഒരു പ്രഭുവാണ്.[a] ഞങ്ങളുടെ ഏറ്റവും നല്ല കല്ലറകളിലൊന്നിൽ അങ്ങയുടെ മരിച്ച വ്യക്തിയെ അടക്കം ചെയ്താലും. അങ്ങയുടെ മരിച്ച വ്യക്തിയെ അടക്കം ചെയ്യുന്നതിൽനിന്ന് അങ്ങയെ തടയുന്ന വിധത്തിൽ, ഞങ്ങളിൽ ആരും തന്റെ കല്ലറ അങ്ങേക്കു നിഷേധിക്കുകയില്ല.”
