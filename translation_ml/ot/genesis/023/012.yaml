  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: ml
  text: അപ്പോൾ അബ്രാഹാം ദേശത്തെ ജനങ്ങളുടെ മുമ്പിൽ വണങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശത്തെ ജനങ്ങളുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: ശׁחה എന്ന ക്രിയയുടെ ഈ രൂപം ആദരവോ വിനയമോ പ്രകടിപ്പിച്ചുകൊണ്ട് ശരീരം കുനിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹിത്യരുമായുള്ള സാമൂഹിക ഇടപാടിന്റെ പശ്ചാത്തലത്തിൽ ദൈവാരാധന എന്ന ധ്വനി ഒഴിവാക്കി ശാരീരികമായ ആദരസൂചക പ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ‘സന്നിധിയിൽ’ അഥവാ ‘മുമ്പിൽ’ എന്ന ബന്ധാർഥം നൽകുന്ന പ്രയോഗം; ഇവിടെ ‘മുമ്പിൽ’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: עַם
  choice: ജനങ്ങൾ
  rationale: ഇടപാടിന് സാക്ഷികളായ പ്രാദേശിക ജനസമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: הָאָרֶץ
  choice: ദേശത്തിലെ
  rationale: עַם הָאָרֶץ എന്ന ഘടനയിൽ ആ പ്രദേശത്തെ നിവാസികളെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വാവോടുകൂടിയ wayyiqtol ആഖ്യാനത്തിലെ തുടർച്ചയായ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ശׁחה എന്ന പദം ആരാധനയായി വ്യാഖ്യാനിക്കാനുള്ള സാധ്യത
  choice: ആദരസൂചകമായ കുനിയൽ എന്ന സാമൂഹിക അർഥം
  alternative: ആരാധിച്ചു
  rationale: സന്ദർഭം ഭൂമി വാങ്ങുന്നതുമായി ബന്ധപ്പെട്ട പൊതുവായ ചർച്ചയാണ്; അതിനാൽ ദൈവിക ആരാധന സൂചിപ്പിക്കുന്ന പരിഭാഷ തെറ്റിദ്ധരിപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കുനിഞ്ഞു നമസ്കരിച്ചു’ എന്നത് ആദരസൂചകമായ ശരീരഭാവം വ്യക്തമാക്കുന്നു; കൂടുതൽ ശക്തമായ ‘സാഷ്ടാംഗം വീണു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
