  text: וַ/יַּ֧עַן עֶפְר֛וֹן אֶת אַבְרָהָ֖ם לֵ/אמֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/014.yaml
  text: And Ephron answered Abraham, saying to him,
translation:
  language: ml
  text: 'എഫ്രോൻ അബ്രാഹാമിനോട് ഇങ്ങനെ മറുപടി പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന ענה എന്ന ക്രിയയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പരിഭാഷയാണിത്.
- source_word: עֶפְרוֹן
  choice: എഫ്രോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സാധാരണ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֶת אַבְרָהָם
  choice: അബ്രാഹാമിനോട്
  rationale: אֶת ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ദിശാസൂചക വിഭക്തിയോടുകൂടിയ ഈ പ്രയോഗം അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר לוֹ
  choice: ഇങ്ങനെ ... പറഞ്ഞു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനോടു പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടനയാണെങ്കിലും, പിന്നാലെ വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്താൻ ‘ഇങ്ങനെ’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘അബ്രാഹാമിനോട്’ എന്നതിലൂടെ לוֹയുടെ ബന്ധവും പ്രകടമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള സംഭാഷണം ആരംഭിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തിരിക്കുന്നു.
