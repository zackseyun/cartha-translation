  choice: അബ്രാഹാമിനോട്
  rationale: לְ എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയവും സൂചിപ്പിക്കുന്ന അഭിസംബോധിതനെ മലയാളവാക്യത്തിൽ പേരോടു ചേർത്ത ദാതൃരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
