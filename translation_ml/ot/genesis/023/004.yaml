source:
  edition: WLC
  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ ഇടയിൽ ഒരു പരദേശിയും താമസക്കാരനുമാണ്. എന്റെ മരിച്ചയാളെ എന്റെ മുമ്പിൽനിന്ന് അടക്കം ചെയ്യേണ്ടതിന്, നിങ്ങളുടെ ഇടയിൽ എനിക്ക് അടക്കത്തിനുള്ള ഒരു ഭൂസ്വത്ത്[a] തരിക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശ്മശാനസ്ഥലം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗത്തിൽ വെറും കുഴിമാടത്തിനുള്ള ഇടം മാത്രമല്ല, കൈവശാവകാശമുള്ള ഭൂസ്വത്ത് എന്ന ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: പരദേശി
  rationale: സ്വന്തം കുലദേശത്തിനു പുറത്തു പൂർണ ഭൂവുടമസ്ഥാവകാശമില്ലാതെ കഴിയുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പരദേശി’ അബ്രാഹാമിന്റെ പുറംനാട്ടുകാരൻ എന്ന നില സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְתוֹשָׁב
  choice: താമസക്കാരൻ
  rationale: അവിടെ വസിക്കുന്നുവെങ്കിലും സ്വദേശിയുടെയോ ഭൂവുടമയുടെയോ പൂർണ പദവി ഇല്ലെന്ന അർത്ഥം നൽകുന്നു; ഗֵּר എന്ന പദത്തോടുള്ള വ്യത്യാസവും ബന്ധവും നിലനിർത്തുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങളോടുകൂടെ’ എന്നതിനെക്കാൾ ഈ സാമൂഹിക സാഹചര്യത്തിൽ സമൂഹത്തിനിടയിലെ വാസം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; രണ്ട് പ്രയോഗങ്ങളുടെയും ആശയം ഉൾക്കൊള്ളുന്നു.
- source_word: תְּנוּ לִי
  choice: എനിക്ക് ... തരിക
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആജ്ഞാരൂപം ലളിതവും മാന്യവുമായി പകർന്നു നൽകുന്നു.
- source_word: אֲחֻזַּת קֶבֶר
  choice: ഒരു ശ്മശാനാവകാശം
  rationale: אֲחֻזָּה വെറും കുഴിമാടസ്ഥലമല്ല, കൈവശാവകാശമുള്ള ഭൂസ്വത്തെയോ അവകാശത്തെയോ സൂചിപ്പിക്കാം. അധ്യായത്തിലെ നിയമപരമായ ഭൂസ്വത്ത്-ഭാവം ‘ശ്മശാനാവകാശം’ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְאֶקְבְּרָה
  choice: അടക്കം ചെയ്യേണ്ടതിന്
  rationale: അപേക്ഷയ്ക്കു പിന്നാലെയുള്ള cohortative ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടന ഉപയോഗിച്ചു.
- source_word: מֵתִי
  choice: എന്റെ മരിച്ചവളെ
  rationale: ഹീബ്രുവിലെ ഏകവചനരൂപം മരിച്ച കുടുംബാംഗത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സാറയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്, അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സ്ത്രീലിംഗരൂപം ഉപയോഗിച്ചെങ്കിലും പേര് ചേർത്തിട്ടില്ല.
- source_word: מִלְּפָנַי
  choice: എന്റെ കൺമുന്നിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘എന്റെ മുമ്പിൽനിന്ന്’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ സാമൂഹിക പദവിയായ גֵּר וְתוֹשָׁב എന്ന ഇരട്ടപ്രയോഗം
  choice: പരദേശിയും താമസക്കാരനും
  alternative: പ്രവാസിയും താൽക്കാലിക താമസക്കാരനും
  rationale: അബ്രാഹാം അവിടെ യഥാർഥത്തിൽ വസിക്കുന്നുവെങ്കിലും സ്വദേശിയുടെയോ ഭൂവുടമയുടെയോ പൂർണ പദവി ഇല്ലെന്ന പിരിമുറുക്ക് നിലനിർത്തുന്നു; ‘താൽക്കാലിക’ എന്ന കാലപരിധി മൂലപാഠം നിർബന്ധമായി പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നിയമപരമായ ഭൂവകാശസൂചന നിലനിർത്താൻ ‘ശ്മശാനാവകാശം’ തെരഞ്ഞെടുത്തു; ഹീബ്രുവിന്റെ ആവർത്തനം ഒഴിവാക്കാതെ ആശയം സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ ചേർത്തു.
