    issue: ‘ശ്മശാനാവകാശം’ renders a right of burial rather than a burial property/holding.
    rationale: אֲחֻזָּה concerns a possession or landed holding. The chapter’s ensuing purchase makes this legal-property nuance important.
  - severity: low
    issue: ‘എന്റെ മരിച്ചവളെ’ adds feminine gender.
    rationale: The immediate context concerns Sarah, but the Hebrew expression itself does not name her or explicitly mark the referent feminine; a gender-neutral Malayalam expression better preserves the source wording.
  - severity: low
    issue: The footnote anchor is placed at the end of the sentence rather than on the burial-property expression it explains.
    rationale: Moving the anchor to ‘ഭൂസ്വത്ത്’ makes the lexical note’s referent clear.
