translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമ-ആഖ്യാന ശൈലി. ‘അവകാശസ്വത്ത്’ എന്ന പദം ഉടമസ്ഥാവകാശത്തിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു; പദാനുപദമായ രൂപങ്ങളും വംശനാമത്തിന്റെ സന്ദർഭപരമായ പകരവും അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
