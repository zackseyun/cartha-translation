source:
  edition: WLC
  text: וַ/יָּ֨קָם הַ/שָּׂדֶ֜ה וְ/הַ/מְּעָרָ֧ה אֲשֶׁר בּ֛/וֹ לְ/אַבְרָהָ֖ם לַ/אֲחֻזַּת קָ֑בֶר מֵ/אֵ֖ת בְּנֵי חֵֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: ml
  text: അങ്ങനെ, വയലും അതിലുണ്ടായിരുന്ന ഗുഹയും ഹേത്തിന്റെ പുത്രന്മാരിൽനിന്ന് അബ്രാഹാമിന് ശവസംസ്കാരത്തിനുള്ള സ്വത്തായി നിയമപരമായി കൈമാറ്റം ചെയ്യപ്പെട്ടു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹിത്യരിൽ നിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അബ്രാഹാമിന് ശവസംസ്കാരത്തിനുള്ള സ്വത്തായി സ്ഥിരപ്പെട്ടു.” ഇവിടെ എബ്രായ ക്രിയ സ്വത്തിന്റെ ഉടമസ്ഥാവകാശം നിയമപരമായി അബ്രാഹാമിന് സ്ഥിരപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: നിയമപരമായി ഉറപ്പിക്കപ്പെട്ടു
  rationale: ഈ ഭൂമിവാങ്ങൽസന്ദർഭത്തിൽ קום സ്വത്തിന്റെ ഉടമസ്ഥാവകാശം അബ്രാഹാമിന് നിയമപരമായി സ്ഥിരപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം, ‘സ്ഥാപിക്കപ്പെട്ടു’ എന്ന കൂടുതൽ പദാനുപദമായ സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׂדֶה
  choice: വയൽ
  rationale: വാങ്ങിയ ഭൂഭാഗത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: അതിലുണ്ടായിരുന്ന ഗുഹയും
  rationale: ബന്ധവാക്യവും, വയലിനെ തിരിച്ചുസൂചിപ്പിക്കുന്ന בּוֹ എന്ന സർവനാമപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְאַבְרָהָם
  choice: അബ്രാഹാമിന്
  rationale: നിയമപരമായ കൈമാറ്റത്തിന്റെ സ്വീകർത്താവും ഉടമയും അബ്രാഹാമാണെന്ന് ദാതൃവിഭക്തി വ്യക്തമാക്കുന്നു.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: ശവസംസ്കാരത്തിനുള്ള ഒരു അവകാശസ്വത്തായി
  rationale: אֲחֻזָּה എന്നതിലെ കൈവശാവകാശത്തിന്റെയും നിയമപരമായ സ്വത്തിന്റെയും ആശയവും קָבֶר എന്നതിലെ ശവസംസ്കാരലക്ഷ്യവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: מֵאֵת
  choice: നിന്ന്
  rationale: ഇടപാടിൽ സ്വത്ത് ആരിൽനിന്ന് ലഭിച്ചു എന്ന ഉറവിടം മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: בְּנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ വംശനാമപ്രയോഗത്തിന്റെ രൂപം സുതാര്യമായി നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘ഹിത്യർ’ എന്ന പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
