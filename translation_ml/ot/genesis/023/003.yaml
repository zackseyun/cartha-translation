  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ ക്രമവും ‘ഹേത്തിന്റെ പുത്രന്മാർ’ എന്ന വംശപരമായ പ്രയോഗവും നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക പ്രസംഗരീതിക്കായി അവസാനത്തെ לֵאמֹר ദ്വിബിന്ദുവിലൂടെ പ്രകടമാക്കി.
