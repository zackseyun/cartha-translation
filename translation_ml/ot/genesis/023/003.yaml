  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാഹാം തന്റെ മരിച്ച ഭാര്യയുടെ അരികിൽനിന്ന് എഴുന്നേറ്റ് ഹേത്തിന്റെ പുത്രന്മാരോട്[a] സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ഹിത്യരോട്’; ഹീബ്രുവിൽ: ‘ഹേത്തിന്റെ പുത്രന്മാരോട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അപ്പോൾ ... എഴുന്നേറ്റ്
  rationale: വയിക്തോൽ രൂപം കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനക്രമവും ‘എഴുന്നേറ്റ്’ പ്രവർത്തിയും നിലനിർത്തുന്നു.
- source_word: מֵעַל פְּנֵי
  choice: അരികിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖസന്നിധിയിൽനിന്ന്’ എന്ന ആശയമുള്ള ഈ പ്രയോഗം ഇവിടെ മൃതദേഹത്തിന്റെ സമീപത്തുനിന്ന് മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അരികിൽനിന്ന്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מֵתוֹ
  choice: മരിച്ചുകിടന്ന തന്റെ ഭാര്യയുടെ
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘അവന്റെ മരിച്ചവൾ/മരിച്ചയാൾ’ എന്നാണ്; സന്ദർഭത്തിൽ സാറയാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ലിംഗവും ബന്ധവും വ്യക്തമാക്കുന്നത് സ്വാഭാവികമായതിനാൽ ‘തന്റെ ഭാര്യ’ എന്നു നൽകിയെങ്കിലും, മരിച്ച ശരീരത്തിന്റെ സന്നിധിയിൽനിന്നാണ് എഴുന്നേൽക്കുന്നതെന്ന ദൃശ്യഭാവം ‘മരിച്ചുകിടന്ന’ നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר אֶל എന്ന ഘടനയുടെ സാധാരണ അർഥമായ ‘അവരോട് സംസാരിച്ചു’ എന്നത് നിലനിർത്തുന്നു; പിന്നാലെയുള്ള לֵאמֹר പ്രസംഗത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ ‘ഹേത്തിന്റെ പുത്രന്മാർ’ എന്ന രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ജനവിഭാഗനാമമായ ‘ഹിത്യർ’ എന്നത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'സംസാരിച്ചു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പരിചയപ്പെടുത്താൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു; പ്രത്യേകമായി ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് അനാവശ്യ ആവർത്തനമാകും.
