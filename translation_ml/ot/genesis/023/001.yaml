  yaml_path: translation/ot/genesis/023/001.yaml
  text: Sarah lived one hundred twenty-seven years; these were the years of Sarah’s life.
translation:
  language: ml
  text: സാറാ നൂറ്റിയിരുപത്തേഴു വർഷം ജീവിച്ചു; ഇതായിരുന്നു സാറായുടെ ആയുഷ്കാലം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ חַיֵּי שָׂרָה
  choice: സാറാ ... വർഷം ജീവിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘സാറായുടെ ജീവിതവർഷങ്ങൾ ആയിരുന്നു’ എന്നാണെങ്കിലും, വ്യക്തിയുടെ ആകെ ആയുസ്സ് അറിയിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമായി ക്രിയാത്മകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵאָה שָׁנָה וְעֶשְׂרִים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: നൂറ്റിയിരുപത്തേഴു വർഷം
  rationale: എബ്രായത്തിലെ 100 + 20 + 7 എന്ന ആവർത്തനാത്മക സംഖ്യാരൂപം കൃത്യമായ മൂല്യം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള സംയുക്തസംഖ്യയായി നൽകി.
- source_word: שְׁנֵי חַיֵּי שָׂרָה
  choice: സാറായുടെ ആയുഷ്കാലം
  rationale: ‘സാറായുടെ ജീവിതത്തിന്റെ വർഷങ്ങൾ’ എന്ന സമാപനപുനരുക്തിയുടെ അർഥവും ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ സമാപനപുനരുക്തി സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനമോ മതവിഭാഗപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
