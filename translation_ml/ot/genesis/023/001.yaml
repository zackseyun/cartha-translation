  text: וַ/יִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְ/עֶשְׂרִ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃
base_translation:
