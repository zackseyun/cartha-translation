  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: ml
  text: സാറാ കനാൻദേശത്തെ കിര്യത്ത്-അർബയിൽ—അതായത് ഹെബ്രോനിൽ[a]—മരിച്ചു. സാറായെച്ചൊല്ലി വിലപിക്കാനും അവളെച്ചൊല്ലി കരയാനും അബ്രാഹാം വന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കിര്യത്ത്-അർബയെ ഇവിടെ ഹെബ്രോനുമായി തിരിച്ചറിയുന്നു.
    reason: cross_reference
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘സാറായെക്കുറിച്ചു വിലപിക്കാനും അവൾക്കുവേണ്ടി കരയാനും വന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: മരിച്ചു
  rationale: מות മരണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിന്റെ ലളിതവും മറയില്ലാത്തതുമായ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബയിൽ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; എബ്രായ സംയുക്തനാമത്തിന്റെ ഘടന സൂചിപ്പിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: הִוא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോനിൽ
  rationale: കിര്യത്ത്-അർബ ഹെബ്രോൻ തന്നെയാണെന്ന വിശദീകരണാത്മക സമാനാധികരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തിലെ
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ അർഥം ഒഴിവാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ ‘കനാൻദേശം’ എന്നു നൽകി.
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് ‘വരുക/പോകുക’ എന്ന ദൃഷ്ടികോണാധീനമായ അർഥവ്യാപ്തിയുണ്ട്; ആഖ്യാനത്തിന്റെ അവതരണരീതിയോട് ചേർന്ന് ‘വന്നു’ യോജിക്കുന്നു.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: സാറായെക്കുറിച്ചു വിലപിക്കാൻ
  rationale: ספד ശവദുഃഖാചരണത്തിലെ വിലാപത്തെ സൂചിപ്പിക്കുന്നു; ‘വിലപിക്കുക’ അതിന്റെ പ്രത്യേക ഭാവം ‘ദുഃഖിക്കുക’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: וְלִבְכֹּתָהּ
  choice: അവൾക്കുവേണ്ടി കരയാൻ
  rationale: בכה എന്നത് കരയുക എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അവൾക്കുവേണ്ടി’ എന്ന് വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മരണവും ദുഃഖാചരണവും സംബന്ധിച്ച എബ്രായ പദങ്ങളുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
