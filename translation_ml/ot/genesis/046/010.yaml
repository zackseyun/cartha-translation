source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֧ל וְ/יָמִ֛ין וְ/אֹ֖הַד וְ/יָכִ֣ין וְ/צֹ֑חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: ml
  text: 'ശിമെയോന്റെ പുത്രന്മാർ: യെമൂവേൽ, യാമീൻ, ഓഹദ്, യാഖീൻ, സോഹർ, കനാന്യസ്ത്രീയുടെ മകനായ ശാവൂൽ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത രൂപം: ‘ശൗൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പട്ടികാശൈലി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. വാക്യാരംഭത്തിലെ וּ മുൻപത്തെ പട്ടികയുമായുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ നിർബന്ധമായി ‘കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: יְמוּאֵל
  choice: യെമൂവേൽ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וְיָמִין
  choice: യാമീൻ
  rationale: പട്ടികയിലെ സംയോജകമായ וְ മലയാളത്തിലെ കോമയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; നാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְאֹהַד
  choice: ഓഹദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וְיָכִין
  choice: യാഖീൻ
  rationale: כ എന്ന വ്യഞ്ജനത്തിന്റെ ഘർഷധ്വനി ‘ഖ’യിലൂടെ സൂചിപ്പിച്ച് എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: וְצֹחַר
  choice: സോഹർ
  rationale: മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായിരിക്കെ എബ്രായ നാമത്തിന്റെ ഏകദേശ ശബ്ദരൂപം സംരക്ഷിക്കുന്നു.
- source_word: וְשָׁאוּל
  choice: ശാവൂൽ
  rationale: שָׁאוּל എന്ന എബ്രായ നാമത്തിന്റെ സ്വരഘടന കൂടുതൽ സുതാര്യമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം; പരിചിതമായ മലയാള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: കനാന്യസ്ത്രീയുടെ മകനായ
  rationale: സ്ത്രീലിംഗ ഏകവചന ജനവിഭാഗനാമത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ശാവൂലിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
