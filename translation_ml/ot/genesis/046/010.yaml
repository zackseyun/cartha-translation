  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. വ്യക്തിനാമങ്ങളിൽ എബ്രായ ശബ്ദരൂപത്തിന് മുൻഗണന നൽകിയിട്ടുണ്ട്; അതേസമയം വായനാസൗകര്യവും പരിഗണിച്ചു.
