- from: യാക്കോബിനോടുകൂടെ ഈജിപ്തിലേക്കു വന്നവരിൽ, അവനിൽനിന്നു ജനിച്ചവർ[a]—യാക്കോബിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരെ കൂടാതെ—ആകെ അറുപത്താറു പേർ[b] ആയിരുന്നു.
