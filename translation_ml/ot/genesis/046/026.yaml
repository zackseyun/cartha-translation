base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: ml
  text: യാക്കോബിനുള്ളവരായി ഈജിപ്തിലേക്കു വന്നവരെല്ലാം, അവന്റെ സന്തതികളായവർ[a]—യാക്കോബിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരെ കൂടാതെ—ആകെ അറുപത്താറു പേർ[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘അവന്റെ തുടയിൽനിന്നു പുറപ്പെട്ടവർ’; ഇത് ജൈവസന്തതികളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദശഃ ‘ആത്മാക്കൾ’; ഇവിടെ വ്യക്തികളെ എണ്ണുന്നതിനുള്ള എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: വന്നവരിൽ
  rationale: נֶפֶשׁ ഇവിടെ വംശാവലി-കണക്കെടുപ്പ് സന്ദർഭത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആത്മാക്കൾ’ എന്നു പദാനുപദമായി പറയുന്നതിനെക്കാൾ ‘വന്നവർ’ സ്വാഭാവികമായി വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: യാക്കോബിനോടുകൂടെ ഈജിപ്തിലേക്കു വന്നവരിൽ
  rationale: לְיַעֲקֹב എന്ന ബന്ധസൂചനയെ സന്ദർഭാനുസൃതമായി യാക്കോബിനോടുകൂടെ യാത്രചെയ്ത കുടുംബസംഘമായി അവതരിപ്പിക്കുന്നു; ‘ഈജിപ്തിലേക്കു’ എന്നത് ദിശാസൂചകമായ מִצְרַיְמָהയെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: അവനിൽനിന്നു ജനിച്ചവർ
  rationale: ‘അവന്റെ തുടയിൽനിന്നു പുറപ്പെട്ടവർ’ എന്ന എബ്രായ ശരീരാധിഷ്ഠിത പ്രയോഗം ജൈവസന്തതികളെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ അർത്ഥം സ്വാഭാവികമായി നൽകി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: מִלְּבַד נְשֵׁי בְנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാരുടെ ഭാര്യമാരെ കൂടാതെ
  rationale: മൊത്തം എണ്ണത്തിൽ ഉൾപ്പെടാത്ത വിഭാഗത്തെ מִלְּבַד വ്യക്തമാക്കുന്നു; ‘കൂടാതെ’ ഈ ഒഴിവാക്കൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: ആകെ അറുപത്താറു പേർ
  rationale: נֶפֶשׁ വ്യക്തികളെ എണ്ണുന്ന പ്രയോഗമായതിനാൽ ‘പേർ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ആകെ’ സമഗ്രസംഖ്യയെ വ്യക്തമാക്കുന്നു.
