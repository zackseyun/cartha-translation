translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് ദേഹാധിഷ്ഠിത പ്രയോഗങ്ങളുടെ അർത്ഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, അവയുടെ പദശഃ രൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
