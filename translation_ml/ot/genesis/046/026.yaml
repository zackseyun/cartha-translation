  rationale: 'The revision preserves the Hebrew census syntax and scope more closely: the group is identified as belonging to Jacob, rather than necessarily accompanying him physically, and the descent idiom is rendered as ‘his descendants’ rather than direct births. The two lexical notes retain the literal imagery and the counting sense without introducing an inaccurate Malayalam alternative.'
