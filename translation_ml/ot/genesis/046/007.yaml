  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בָּנָ֞י/ו וּ/בְנֵ֤י בָנָי/ו֙ אִתּ֔/וֹ בְּנֹתָ֛י/ו וּ/בְנ֥וֹת בָּנָ֖י/ו וְ/כָל זַרְע֑/וֹ הֵבִ֥יא אִתּ֖/וֹ מִצְרָֽיְמָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: ml
  text: തന്നോടൊപ്പമുണ്ടായിരുന്ന തന്റെ പുത്രന്മാരെയും പുത്രന്മാരുടെ പുത്രന്മാരെയും, തന്റെ പുത്രിമാരെയും പുത്രന്മാരുടെ പുത്രിമാരെയും, തന്റെ സന്തതിയെ മുഴുവനും[a] അവൻ തന്നോടൊപ്പം ഈജിപ്തിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ പിൻതലമുറയെ മുഴുവനും”; അക്ഷരാർഥത്തിൽ, “തന്റെ വിത്തിനെ മുഴുവനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരെ
  rationale: പിന്നീട് പുത്രിമാരെ പ്രത്യേകം പറയുന്നതിനാൽ ഇവിടെ ആൺമക്കളെ സൂചിപ്പിക്കുന്ന ‘പുത്രന്മാർ’ എന്ന നിർദിഷ്ട പദം യോജിക്കുന്നു.
- source_word: וּבְנֵי בָנָיו
  choice: പുത്രന്മാരുടെ പുത്രന്മാരെ
  rationale: ‘അവന്റെ പുത്രന്മാരുടെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വംശാവലിപരമായ കൃത്യത നിലനിർത്തുന്നു; ‘കൊച്ചുമക്കൾ’ എന്നു പറഞ്ഞാൽ ലിംഗവ്യത്യാസവും പുത്രന്മാരിലൂടെയുള്ള ബന്ധവും മങ്ങാം.
- source_word: אִתּוֹ
  choice: തന്നോടൊപ്പം
  rationale: അകമ്പടിയെയും ഒരുമിച്ചുള്ള യാത്രയെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֹתָיו
  choice: തന്റെ പുത്രിമാരെ
  rationale: പുത്രന്മാരിൽനിന്ന് വേർതിരിച്ചു പറയുന്ന സ്ത്രീസന്തതിയെ കൃത്യമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: וּבְנוֹת בָּנָיו
  choice: പുത്രന്മാരുടെ പുത്രിമാരെ
  rationale: ‘അവന്റെ പുത്രന്മാരുടെ പുത്രിമാർ’ എന്ന മൂലപാഠത്തിന്റെ നിർദിഷ്ട ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וְכָל זַרְעוֹ
  choice: തന്റെ സന്തതിയെ മുഴുവനും
  rationale: זֶרַע എന്ന സമാഹാരപദത്തിന്റെ കുടുംബവംശപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥമായ ‘വിത്ത്’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הֵבִיא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘വരുത്തുക/കൊണ്ടുവരുക’ എന്ന കാരണാർഥം സാഹചര്യത്തിന് യോജിച്ച രീതിയിൽ നൽകുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ -ה അന്ത്യപ്രത്യയം പ്രകടിപ്പിക്കുന്ന ഈജിപ്തിലേക്കുള്ള ഗതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘കൊച്ചുമക്കൾ’ എന്ന പൊതുപദത്തിനു പകരം മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസവും പുത്രന്മാരിലൂടെയുള്ള വംശബന്ധവും നിലനിർത്താൻ ‘പുത്രന്മാരുടെ പുത്രന്മാർ’, ‘പുത്രന്മാരുടെ പുത്രിമാർ’ എന്നീ രൂപങ്ങൾ സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘തന്നോടൊപ്പം’ എന്ന ആവർത്തനവും വാക്യത്തിൽ സംരക്ഷിച്ചു.
