  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വംശാവലി ഭാഷയിലെ ‘പുത്രന്മാർ’, ‘പുത്രിമാർ’ എന്നീ കൃത്യമായ ബന്ധപദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ ജനസംഖ്യാ-പ്രയോഗം വായനാസൗകര്യത്തിനായി ‘ആകെ ... പേർ’ എന്നു നൽകി.
