source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: ml
  text: പദ്ദൻ-അരാമിൽ ലേയാ യാക്കോബിന് പ്രസവിച്ച പുത്രന്മാർ ഇവരാണ്; യാക്കോബിന്റെ മകൾ ദീനയും ഇവരിൽ ഉൾപ്പെടുന്നു. അവന്റെ പുത്രന്മാരും പുത്രിമാരും ആകെ മുപ്പത്തിമൂന്നു പേർ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവന്റെ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും എല്ലാ വ്യക്തികളും’; ഇവിടെ ഇത് ആളുകളുടെ ആകെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: ലേയാ ... പ്രസവിച്ച പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നാണ്; ദീനയെ പിന്നീട് പ്രത്യേകം ചേർക്കുന്നതിനാൽ വംശാവലിയുടെ ശീർഷകസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: ലേയാ യാക്കോബിനു പ്രസവിച്ച
  rationale: സ്ത്രീ കർത്താവായുള്ള יָלַד എന്ന ക്രിയയുടെ ‘പ്രസവിക്കുക’ എന്ന മാതൃസംബന്ധിയായ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּפַדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽവെച്ച്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ‘-ൽവെച്ച്’ സ്ഥലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: യാക്കോബിന്റെ മകൾ ദീനയും ഇവരോടൊപ്പമുണ്ടായിരുന്നു
  rationale: ദീനയെ പുത്രന്മാരുടെ പട്ടികയോടു കൂട്ടിച്ചേർക്കുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സാധ്യതയുള്ള അവ്യക്തത ഒഴിവാക്കാൻ യാക്കോബിന്റെ പേര് ആവർത്തിക്കുന്നു.
- source_word: כָּל נֶפֶשׁ
  choice: ആകെ ... പേർ
  rationale: ജനസംഖ്യാ/വംശാവലി സന്ദർഭത്തിൽ נֶפֶשׁ ‘ആത്മാക്കൾ’ എന്നല്ല, വ്യക്തികളുടെ ആകെ എണ്ണം എന്ന അർഥത്തിലാണ്.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: യാക്കോബിന്റെ പുത്രന്മാരും പുത്രിമാരുമായി
  rationale: മൂലപാഠം പുത്രന്മാരെയും പുത്രിമാരെയും വേർതിരിച്ചു പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിലേക്കു ചുരുക്കിയില്ല.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: മുപ്പത്തിമൂന്നു
  rationale: എബ്രായ സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
