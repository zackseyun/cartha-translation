id: GEN.46.2
reference: Genesis 46:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: ml
  text: 'ദൈവം രാത്രിയിലെ ദർശനങ്ങളിൽ ഇസ്രായേലിനോടു പറഞ്ഞു: “യാക്കോബേ, യാക്കോബേ!” അപ്പോൾ അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഇവിടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: സംസാരിച്ചു / വിളിച്ചു / പറഞ്ഞു
  rationale: אָמַר എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പറയുക’ എന്നാണ്. ഒരേ വാക്യത്തിലെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യത്തേത് ‘സംസാരിച്ചു’ എന്നും നേരിട്ടുള്ള അഭിസംബോധനയെ ‘വിളിച്ചു’ എന്നും യാക്കോബിന്റെ മറുപടിയെ ‘പറഞ്ഞു’ എന്നും നൽകി; സംസാരസംഭവവും അതിന്റെ ഉള്ളടക്കവും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: സന്ദർഭത്തിൽ ഏകവചനക്രിയയോടുകൂടെ ഏകസത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനോട്
  rationale: ആഖ്യാനത്തിൽ മൂലപാഠം ‘ഇസ്രായേൽ’ എന്ന പേരാണ് ഉപയോഗിക്കുന്നത്; തുടർന്നുള്ള അഭിസംബോധനയിലെ ‘യാക്കോബ്’ എന്ന പേരുമായി അതിനെ ഏകീകരിച്ചിട്ടില്ല.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: രാത്രിയിലെ ദർശനങ്ങളിൽ
  rationale: מַרְאוֹת എന്ന ബഹുവചനം ‘ദർശനങ്ങൾ’ എന്നും הַלַּיְלָה എന്ന രാത്രിസൂചനയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: യാക്കോബേ, യാക്കോബേ
  rationale: ആവർത്തിച്ചുള്ള വ്യക്തിപരവും ഊന്നലുള്ളതുമായ വിളി അതേപടി നിലനിർത്തി; മലയാളത്തിലെ സംബോധനപ്രത്യയം ചേർത്തു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: സന്നദ്ധതയും സാന്നിധ്യവും അറിയിക്കുന്ന പതിവ് മറുപടിയുടെ ഭാവം നിലനിർത്തുന്ന, ഗൗരവമുള്ള സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: ഇസ്രായേൽ / യാക്കോബ് എന്ന പേരുകളുടെ മാറിയുള്ള പ്രയോഗം
  choice: ആഖ്യാനത്തിൽ ‘ഇസ്രായേൽ’; ദൈവിക അഭിസംബോധനയിൽ ‘യാക്കോബ്’
  alternative: സ്ഥിരതയ്ക്കായി രണ്ടിടത്തും ഒരേ പേര് ഉപയോഗിക്കുക
  rationale: എബ്രായപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ പേരുമാറ്റം സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷത്തോടെ നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായി ഏകീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ബന്ധകക്രമവും ആവർത്തിച്ച אָמַר ക്രിയകളും വാക്കുതോറും പകർത്താതെ സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അർഥസമ്പൂർണമായി നൽകി.
