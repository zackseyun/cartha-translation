translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഫറവോൻ’, ‘കനാൻദേശം’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി. മൂലത്തിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാഭാവം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ രാജസന്നിധിയിലേക്കുള്ള ഗമനം ‘അടുക്കൽ ചെന്ന്’ എന്നു നൽകി; കുടുംബം/ഭവനം എന്ന ശാബ്ദിക വ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
