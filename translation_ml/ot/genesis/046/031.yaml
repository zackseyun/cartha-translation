source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് തന്റെ സഹോദരന്മാരോടും തന്റെ പിതാവിന്റെ കുടുംബത്തോടും[a] പറഞ്ഞു: “ഞാൻ ഫറവോന്റെ അടുക്കലേക്കു കയറിച്ചെന്ന് അറിയിക്കും; അദ്ദേഹത്തോടു, ‘കനാൻദേശത്തായിരുന്ന എന്റെ സഹോദരന്മാരും എന്റെ പിതാവിന്റെ കുടുംബവും എന്റെ അടുക്കൽ വന്നിരിക്കുന്നു’ എന്നു പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ പിതാവിന്റെ ഭവനത്തോടും”; എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “തന്റെ പിതാവിന്റെ വീട്” എന്നാണ്. ഇവിടെ അത് കെട്ടിടത്തെയല്ല, കുടുംബഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോട്
  rationale: സന്ദർഭത്തിൽ യോസേഫിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְאֶל בֵּית אָבִיו
  choice: പിതാവിന്റെ കുടുംബത്തോട്
  rationale: בַּיִת ഇവിടെ ഭൗതികമായ വീടിനേക്കാൾ പിതാവിന്റെ കുടുംബഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶעֱלֶה
  choice: ഞാൻ ... അടുക്കൽ ചെന്ന്
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കയറിച്ചെല്ലുക/മുകളിലേക്കു പോകുക’ ആണെങ്കിലും, ഫറവോന്റെ സന്നിധിയിലേക്കുള്ള ഗമനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടുക്കൽ ചെല്ലുക’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ ചെന്ന് വിവരം അറിയിക്കും
  rationale: ഹിഫിൽ രൂപമായ נגד വിവരം ഔദ്യോഗികമായി അറിയിക്കുന്നതിന്റെ ഭാവം നൽകുന്നു; രാജസന്നിധിയുടെ പശ്ചാത്തലത്തിൽ ‘വിവരം അറിയിക്കും’ യോജിക്കുന്നു.
- source_word: וְאֹמְרָה אֵלָיו
  choice: എന്ന് ഞാൻ അദ്ദേഹത്തോടു പറയും
  rationale: യോസേഫ് ഉദ്ദേശിക്കുന്ന അടുത്ത പ്രവൃത്തി ഒന്നാംപുരുഷത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ഫറവോനെ ആദരസൂചകമായി ‘അദ്ദേഹം’ എന്നു പരാമർശിക്കുന്നു.
- source_word: אַחַי וּבֵית אָבִי
  choice: എന്റെ സഹോദരന്മാരും എന്റെ പിതാവിന്റെ കുടുംബവും
  rationale: അחַי യഥാർത്ഥ സഹോദരന്മാരെയും בֵּית אָבִי പിതാവിന്റെ വിപുലമായ കുടുംബഘടകത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തായിരുന്ന
  rationale: ഹീബ്രുവിൽ വ്യക്തമായ ക്രിയ ഇല്ലെങ്കിലും, പിന്നാലെയുള്ള പൂർത്തിയായ വരവിനുമുമ്പുള്ള താമസസ്ഥലം മലയാളത്തിൽ ഭൂതകാലമായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בָּאוּ אֵלַי
  choice: എന്റെ അടുക്കൽ വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ വരവിനെ മലയാളത്തിലെ ‘വന്നിരിക്കുന്നു’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
