translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. തൊഴിൽസൂചന വ്യക്തമാക്കുകയും ഹീബ്രു ക്രിയാരൂപങ്ങളുടെ കാലസംബന്ധിയായ വഴക്കം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
