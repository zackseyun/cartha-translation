id: GEN.46.32
reference: Genesis 46:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: ml
  text: ആ പുരുഷന്മാർ ആട്ടിടയന്മാരാണ്; കാരണം അവർ കന്നുകാലികളെ വളർത്തുന്നവരായിരുന്നു.[a] അവർ തങ്ങളുടെ ആടുമാടുകളെയും തങ്ങൾക്കുള്ള സകലത്തെയും കൊണ്ടുവന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കന്നുകാലികളെ വളർത്തുന്നവരായിരുന്നു; ... കൊണ്ടുവന്നു.” ഹീബ്രുവിലെ പൂർണക്രിയാരൂപങ്ങൾ ഇവിടെ സാധാരണ ഭൂതകാലമായും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: സംഭാഷണത്തിൽ ഇതിനകം പരാമർശിക്കപ്പെട്ട യോസേഫിന്റെ സഹോദരന്മാരെയാണ് നിർദിഷ്ട ബഹുവചനം സൂചിപ്പിക്കുന്നത്; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: רֹעֵי צֹאן
  choice: ആട്ടിടയന്മാർ
  rationale: അക്ഷരാർഥത്തിൽ ചെറുകന്നുകാലികളെ മേയ്ക്കുന്നവർ എന്ന തൊഴിൽസൂചനയുള്ള പ്രയോഗം; ആടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക തൊഴിൽനാമം ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: അവർ ആട്ടിടയന്മാരാണെന്ന പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: കന്നുകാലികളെ വളർത്തുന്നവർ
  rationale: മൃഗസംരക്ഷണം തൊഴിലാക്കിയവരെ സൂചിപ്പിക്കുന്നു; מִקְנֶהയെ പശുക്കളിൽ മാത്രം ഒതുക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הָיוּ
  choice: ആയിരുന്നു
  rationale: ഹീബ്രു perfect അവരുടെ സ്ഥിരപ്പെട്ട തൊഴിൽപശ്ചാത്തലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്, എന്നാൽ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: തങ്ങളുടെ ആടുമാടുകളെയും
  rationale: צֹאן എന്ന ചെറുകന്നുകാലിവർഗത്തെയും בָּקָר എന്ന പശുവർഗത്തെയും മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രയോഗമായ ‘ആടുമാടുകൾ’ കൊണ്ട് സംക്ഷിപ്തമായി ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: തങ്ങൾക്കുള്ള സകലത്തെയും
  rationale: അവരുടെ എല്ലാ സ്വത്തുക്കളെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി അടുത്തായി നിലനിർത്തുന്നു.
- source_word: הֵבִיאוּ
  choice: കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി—അവർ കൊണ്ടുവന്നവ ഇപ്പോൾ ഇവിടെ ഉണ്ടെന്ന ആശയം—മലയാളത്തിലെ പൂർണവർത്തമാനസദൃശ രൂപത്തിൽ പ്രകടമാക്കുന്നു.
