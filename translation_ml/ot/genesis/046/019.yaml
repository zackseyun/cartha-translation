source:
  edition: WLC
  text: בְּנֵ֤י רָחֵל֙ אֵ֣שֶׁת יַֽעֲקֹ֔ב יוֹסֵ֖ף וּ/בִנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: ml
  text: 'യാക്കോബിന്റെ ഭാര്യയായ റാഹേലിന്റെ പുത്രന്മാർ: യോസേഫും ബെന്യാമീനും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: ഇത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള בֵּן എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്. ഇവിടെ റാഹേലിന്റെ നേരിട്ടുള്ള രണ്ട് ആൺമക്കളെയാണ് പേരെടുത്ത് പറയുന്നത്; അതിനാൽ ‘മക്കൾ’ എന്ന വിശാലപദത്തേക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: רָחֵל
  choice: റാഹേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אֵשֶׁת
  choice: ഭാര്യയായ
  rationale: יַעֲקֹב എന്ന പേരുമായി ചേർന്ന സംയുക്തഘടനയിൽ ഈ പദം ‘യാക്കോബിന്റെ ഭാര്യ’ എന്ന ബന്ധമാണ് വ്യക്തമാക്കുന്നത്. സ്വാഭാവികമായ മലയാള വാക്യഘടനയ്ക്കായി ‘ഭാര്യയായ’ എന്നു നൽകി.
- source_word: יַעֲקֹב
  choice: യാക്കോബിന്റെ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി; ‘യാക്കോബിന്റെ ഭാര്യ’ എന്ന സംയുക്തബന്ധം ഷഷ്ഠിവിഭക്തിയിലൂടെ പ്രകടമാക്കി.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
- source_word: וּ/בִנְיָמִן
  choice: ബെന്യാമീനും
  rationale: വാവ് സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് പ്രകടമാക്കി. വ്യക്തിനാമം പരിചിതമായ മലയാളരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
