translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും എബ്രായത്തിലെ നേരിട്ടുള്ള ബന്ധസൂചനയും നിലനിർത്തുന്നു.
