  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: ml
  text: ഈജിപ്തിൽ യോസേഫിനു ജനിച്ച പുത്രന്മാർ രണ്ടുപേർ[a] ആയിരുന്നു. ഈജിപ്തിലേക്കു വന്ന യാക്കോബിന്റെ ഭവനത്തിലെ എല്ലാവരും ആകെ എഴുപതുപേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ജീവൻ’ എന്ന പദം ഉപയോഗിച്ചിരിക്കുന്നു; ഇവിടെ അത് കുടുംബാംഗങ്ങളെ എണ്ണുമ്പോൾ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാർ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പേരെടുത്ത മനശ്ശെയും എഫ്രയീമും എന്ന യോസേഫിന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: ഈജിപ്തിൽ യോസേഫിനു ജനിച്ച
  rationale: ילד എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും לֹו എന്ന ഘടനയും സ്വാഭാവികമായി ‘അവനു ജനിച്ച’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യോസേഫിനു’ ആവർത്തിച്ചു.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: രണ്ടുപേർ
  rationale: വംശാവലി-എണ്ണൽ സന്ദർഭത്തിൽ נֶפֶשׁ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘രണ്ട് ആത്മാക്കൾ’ എന്ന പദാനുപദ വിവർത്തനം ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
- source_word: כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב
  choice: യാക്കോബിന്റെ ഭവനത്തിലെ എല്ലാവരും
  rationale: בֵּית יַעֲקֹב കുടുംബത്തെയും കുടുംബഗണത്തെയും കോർപ്പറേറ്റ് അർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ബൈബിൾപരമായ പ്രതിധ്വനി നിലനിർത്താൻ ‘ഭവനം’ ഉപയോഗിച്ചു; כָּל הַנֶּפֶשׁ സ്വാഭാവിക മലയാളത്തിൽ ‘എല്ലാവരും’ എന്നു നൽകി.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു വന്ന
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ഈജിപ്തിലേക്കുള്ള ഗതിയെ വ്യക്തമാക്കുന്നു; ആർട്ടിക്കിളോടുകൂടിയ participle മലയാളത്തിൽ ബന്ധവാക്യമായി സ്വാഭാവികമായി നൽകി.
- source_word: שִׁבְעִים
  choice: ആകെ എഴുപതുപേർ
  rationale: ക്രിയയില്ലാത്ത എബ്രായ സംഖ്യാവാക്യം മൊത്തം എണ്ണം പ്രസ്താവിക്കുന്നു. ‘ആകെ’ സംഗ്രഹസ്വഭാവം വ്യക്തമാക്കുകയും ‘പേർ’ വ്യക്തികളുടെ എണ്ണമാണെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വംശാവലി എണ്ണലിൽ נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പേർ / എല്ലാവരും
  alternative: ആത്മാക്കൾ
  rationale: ഇവിടെ പദം മനുഷ്യന്റെ ആത്മാവിനെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ പ്രസ്താവനയല്ല, കുടുംബാംഗങ്ങളെ എണ്ണുന്ന പ്രയോഗമാണ്. അതിനാൽ മലയാളത്തിലെ വ്യക്തിഗണനയ്ക്കുള്ള ‘പേർ’ അർഥം കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യാക്കോബിന്റെ ഭവനം’ എന്നത് കുടുംബ-ഗൃഹസമൂഹ അർഥമുള്ള ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു. ആദ്യവാക്യത്തിലെ ‘യോസേഫിനു’ എന്ന ആവർത്തനം മലയാളത്തിൽ സൂചന വ്യക്തമായി നിർത്തുന്നു.
