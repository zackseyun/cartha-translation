source:
  edition: WLC
  text: וּ/בְנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֣רַח אֲחֹתָ֑/ם וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: ml
  text: 'ആശേരിന്റെ പുത്രന്മാർ: യിമ്നാ[a], യിശ്വാ, യിശ്വി, ബെരീയാ; അവരുടെ സഹോദരി സെരഹും[b]. ബെരീയായുടെ പുത്രന്മാർ: ഹെബെരും മൽകീയേലും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യിമ്നാ എന്ന പേര് ചില പരമ്പരാഗത പരിഭാഷകളിൽ ‘ജിമ്നാ’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: സെരഹ് എന്ന പേര് ‘സെരഖ്’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: ആശേരിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള ബന്ധരൂപമാണ്. വംശാവലിയുടെ പട്ടികാശൈലിക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു; ആദ്യത്തെ וְ പ്രത്യേകമായി വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: יִמְנָה
  choice: യിമ്നാ
  rationale: എബ്രായത്തിലെ ആദ്യാക്ഷരമായ യോദിനെ ‘യ’ ആയി നിലനിർത്തുന്ന നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: וְיִשְׁוָה
  choice: യിശ്വാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം; മുൻചേർന്ന സംയോജകത്തെ പട്ടികയുടെ ഘടനയിലൂടെ പ്രകടമാക്കി.
- source_word: וְיִשְׁוִי
  choice: യിശ്വി
  rationale: എബ്രായ ഉച്ചാരണഘടനയോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: וּבְרִיעָה
  choice: ബെരീയാ
  rationale: വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: അവരുടെ സഹോദരി സെരഹും
  rationale: എബ്രായത്തിലെ ക്രിയയില്ലാത്ത സമാനാധികരണഘടന (‘അവരുടെ സഹോദരി’) നിലനിർത്തി; וְ എന്ന സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: וּבְנֵי בְרִיעָה
  choice: ബെരീയായുടെ പുത്രന്മാർ
  rationale: പുതിയ ഉപപട്ടികയായി വ്യക്തമായി അവതരിപ്പിച്ചു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി വേർതിരിച്ച് നൽകേണ്ടതില്ല.
- source_word: חֶבֶר
  choice: ഹെബെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וּמַלְכִּיאֵל
  choice: മൽകീയേൽ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; അവസാനത്തെ וְ എന്ന സംയോജകം പേരിൽ ചേർത്ത ‘-ഉം’ വഴി പ്രകടമാക്കി.
