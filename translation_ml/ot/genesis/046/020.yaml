revisions:
- from: ഈജിപ്തുദേശത്ത് യോസേഫിനു മനശ്ശെയും എഫ്രയീമും ജനിച്ചു; ഓനിലെ[a] പുരോഹിതനായ പോത്തിഫേറയുടെ മകൾ ആസ്നത്താണ് അവരെ അവനു പ്രസവിച്ചത്.
  to: ഈജിപ്തുദേശത്ത് യോസേഫിന് മനശ്ശെയും എഫ്രയീമും ജനിച്ചു; ഓൻ നഗരത്തിലെ പുരോഹിതനായ പോത്തിഫേരയുടെ മകൾ ആസ്നത്ത് അവന് പ്രസവിച്ചവർ.
