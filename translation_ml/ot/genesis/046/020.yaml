reference: Genesis 46:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ml
  text: ഈജിപ്തുദേശത്ത് യോസേഫിന് മനശ്ശെയും എഫ്രയീമും ജനിച്ചു; ഓൻ നഗരത്തിലെ പുരോഹിതനായ പോത്തിഫേരയുടെ മകൾ ആസ്നത്ത് അവന് പ്രസവിച്ചവർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: യോസേഫിനു … ജനിച്ചു
  rationale: നിഫാൽ ക്രിയയുടെ നിഷ്ക്രിയമായ ജനനാർഥവും לְ സൂചിപ്പിക്കുന്ന ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ക്രിയ എബ്രായത്തിൽ ഏകവചനരൂപത്തിലാണെങ്കിലും പിന്നാലെ പറയുന്ന രണ്ടു പുത്രന്മാരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: അവരെ അവനു പ്രസവിച്ചത്
  rationale: ബന്ധവാക്യം രണ്ടു പുത്രന്മാരെ സൂചിപ്പിക്കുന്നതും മാതാവിന്റെ പ്രസവപ്രവൃത്തി വ്യക്തമാക്കുന്നതുമായ വിധത്തിൽ വിവർത്തനം ചെയ്യുന്നു.
- source_word: אָסְנַת
  choice: ആസ്നത്ത്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: പോത്തിഫേറയുടെ മകൾ
  rationale: ആസ്നത്തിന്റെ പിതാവിനെ തിരിച്ചറിയിക്കുന്ന സംയുക്തപദബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כֹּהֵן אֹן
  choice: ഓനിലെ പുരോഹിതൻ
  rationale: כֹּהֵן എന്നത് ‘പുരോഹിതൻ’ എന്നും സ്ഥലനാമമായ אֹן ലിപ്യന്തരിച്ചു ‘ഓൻ’ എന്നും നൽകുന്നു.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: മനശ്ശെയും എഫ്രയീമും
  rationale: രണ്ടു പുത്രന്മാരുടെയും പേരുകൾ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകുന്നു; നേരിട്ടുള്ള കർമചിഹ്നങ്ങൾ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ജനനസ്ഥലം, പിതാവുമായുള്ള ബന്ധം, മാതാവിന്റെ പ്രസവപ്രവൃത്തി എന്നിവ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
