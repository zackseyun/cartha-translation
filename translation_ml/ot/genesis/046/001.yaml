  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ തനിക്കുള്ള സകലവുമായി[a] പുറപ്പെട്ട് ബേർശേബയിലെത്തി; തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവത്തിന് യാഗങ്ങൾ അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തനിക്കുണ്ടായിരുന്ന സകലവുമായി.’ എബ്രായ പ്രയോഗം അദ്ദേഹത്തിന്റെ കുടുംബഗൃഹത്തിലെ ആളുകളും വസ്തുവകകളും ഉൾപ്പെടെ തനിക്കുള്ളതെല്ലാം വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയ ഇവിടെ പാളയം പിരിച്ച് യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ എന്നത് ഈ ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായ പാഠത്തിൽ ‘യാക്കോബ്’ എന്നല്ല, ഉടമ്പടിനാമമായ ‘ഇസ്രായേൽ’ എന്നാണ്; അതിനാൽ ആ നാമതിരഞ്ഞെടുപ്പ് അതേപടി നിലനിർത്തുന്നു.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: തനിക്കുള്ള സകലവുമായി
  rationale: ഈ പ്രയോഗം ഭൗതിക സ്വത്തുക്കൾക്കു മാത്രം ഒതുങ്ങാതെ അദ്ദേഹത്തിന്റെ കുടുംബഗൃഹത്തിലെ ആളുകളെയും വസ്തുവകകളെയും വിശാലമായി ഉൾക്കൊള്ളാം. മലയാളത്തിൽ അതിനെ അനാവശ്യമായി ചുരുക്കാതെ ‘തനിക്കുള്ള സകലവുമായി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַיָּבֹא בְּאֵרָה שָּׁבַע
  choice: ബേർശേബയിലെത്തി
  rationale: בוא എന്ന ക്രിയയും ദിശാസൂചക രൂപവും ചേർന്ന് ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘ബേർശേബയിലെത്തി’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: യാഗങ്ങൾ അർപ്പിച്ചു
  rationale: ഒരേ ധാതുവിലുള്ള ക്രിയയും നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തെ വാക്കിന് വാക്കായി ആവർത്തിക്കാതെ, അർഥം കൃത്യമായി നൽകുന്ന സ്വാഭാവിക മലയാള യാഗഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: לֵאלֹהֵי אָבִיו יִצְחָק
  choice: തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവത്തിന്
  rationale: ലാമെദ് യാഗത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; ‘പിതാവായ യിസ്ഹാക്ക്’ എന്ന രൂപം യിസ്ഹാക്കിനെ ഇസ്രായേലിന്റെ പിതാവായി വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ ‘തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവം’ എന്നു പ്രത്യേകമായി വിശേഷിപ്പിക്കുന്നത്
  choice: തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൈവത്തിന്
  alternative: തന്റെ പിതാക്കന്മാരുടെ ദൈവത്തിന്
  rationale: എബ്രായ പാഠം യിസ്ഹാക്കിനെ മാത്രം വ്യക്തമായി പേരെടുത്ത് പറയുന്നു. അതിനാൽ അതിനെ പൊതുവാക്കി ‘പിതാക്കന്മാർ’ എന്നാക്കാതെയും വ്യാഖ്യാനപരമായി വിപുലീകരിക്കാതെയും പ്രത്യേക പിതൃപുരുഷബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘ഇസ്രായേൽ,’ ‘ബേർശേബ,’ ‘യിസ്ഹാക്ക്’ എന്നീ ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി; എബ്രായ വാക്യത്തിന്റെ അനുക്രമവും പ്രത്യേക ദൈവവിശേഷണവും സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹം ഉറപ്പാക്കി.
