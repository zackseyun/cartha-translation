source:
  edition: WLC
  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: ml
  text: ഞാൻതന്നെ നിന്നോടുകൂടെ ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോകും; ഞാൻതന്നെ നിന്നെ തീർച്ചയായും മുകളിലേക്കു കൊണ്ടുപോകുകയും ചെയ്യും. യോസേഫ് നിന്റെ കണ്ണുകളിന്മേൽ തന്റെ കൈ വെക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “യോസേഫ് നിന്റെ കണ്ണുകൾ അടയ്ക്കും”; യാക്കോബ് മരിക്കുമ്പോൾ യോസേഫ് അടുത്തുണ്ടായിരിക്കുമെന്നു സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: ഞാൻതന്നെ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: നിന്നോടുകൂടെ ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോകും
  rationale: ഈജിപ്തിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള എബ്രായ ദിശാപ്രയോഗമായ ‘ഇറങ്ങുക’ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַעַלְךָ גַם עָלֹה
  choice: നിന്നെ തീർച്ചയായും മടക്കിക്കൊണ്ടുവരും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥവും infinitive absolute നൽകുന്ന ഉറപ്പും വ്യക്തമാക്കുന്നു; ‘മടക്കി’ എന്നത് ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള ‘കയറ്റിക്കൊണ്ടുവരൽ’ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְיוֹסֵף
  choice: യോസേഫ്
  rationale: പേരിന്റെ അംഗീകൃത ആധുനിക മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകളുടെമേൽ തന്റെ കൈ വെക്കും
  rationale: മരണസമയത്ത് കണ്ണുകൾ അടയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിന്നെ മടക്കിക്കൊണ്ടുവരും’ എന്ന വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: യാക്കോബിനെ മടക്കിക്കൊണ്ടുവരുമെന്ന വിശാലമായ വാക്കുകൾ നിലനിർത്തി; അത് ജീവനോടെ മടങ്ങുന്നതോ, സംസ്കാരത്തിനായി ശരീരം കൊണ്ടുവരുന്നതോ, സന്തതിയുടെ പുറപ്പാടോ എന്ന് പാഠത്തിൽ നിർണ്ണയിച്ചില്ല.
  alternative: യാക്കോബിന്റെ ശരീരം കനാനിൽ സംസ്കരിക്കാനായി കൊണ്ടുവരുമെന്ന് വ്യക്തമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ അവന്റെ സന്തതിയുടെ പുറപ്പാടായി വ്യക്തമാക്കുക.
  rationale: ഹീബ്രു വാചകം സംക്ഷിപ്തവും ഒന്നിലധികം പൂർത്തീകരണതലങ്ങൾ ഉൾക്കൊള്ളാൻ കഴിയുന്നതുമാണ്; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: യോസേഫ് കൈ കണ്ണുകളുടെമേൽ വെക്കുന്നതിന്റെ അർഥം
  choice: രൂപകൽപ്പന മുഖ്യപാഠത്തിൽ അക്ഷരാർഥസമീപമായി നിലനിർത്തി, മരണസമയത്തെ കണ്ണടയ്ക്കൽ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘യോസേഫ് നിന്റെ കണ്ണുകൾ അടയ്ക്കും’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലത്തിലെ ദൃശ്യഭാഷ സംരക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഉദ്ദേശിച്ച ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞാൻതന്നെ’ എന്ന ആവർത്തനം ദൈവിക വാഗ്ദാനത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘ഇറങ്ങിപ്പോകും’ എന്നത് എബ്രായ ദിശാപ്രയോഗം നിലനിർത്തുന്നു.
