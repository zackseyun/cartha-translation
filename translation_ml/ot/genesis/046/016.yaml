lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: ഗാദിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ בְּנֵי എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം ‘പുത്രന്മാർ’ എന്നാണ്. മുൻവാക്യങ്ങളോടുള്ള ബന്ധം മലയാളത്തിൽ പട്ടികയുടെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ וּ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: צִפְיוֹן
  choice: സിഫ്യോൻ
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് സ്വരരൂപമായ צִפְיוֹן നെ അടുത്തായി പ്രതിനിധീകരിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְחַגִּי
  choice: ഹഗ്ഗി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം; ദ്വിത്വവ്യഞ്ജനം നിലനിർത്തുന്നു.
- source_word: שׁוּנִי
  choice: ശൂനി
  rationale: ഹീബ്രു ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וְאֶצְבֹּן
  choice: എസ്ബോൻ
  rationale: എബ്രായ צ വ്യഞ്ജനത്തിന് മലയാളത്തിൽ പ്രായോഗികമായ ‘സ’ ഉപയോഗിച്ച് പേരിന്റെ മസോററ്റിക് സ്വരരൂപം പ്രതിനിധീകരിച്ചു.
- source_word: עֵרִי
  choice: ഏരി
  rationale: ദീർഘസ്വരം നിലനിർത്തുന്ന അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַאֲרוֹדִי
  choice: അരോദി
  rationale: ഹീബ്രു വ്യക്തിനാമം അതിന്റെ സ്വരക്രമം നിലനിർത്തി ലിപ്യന്തരിച്ചു.
- source_word: וְאַרְאֵלִי
  choice: അരേലി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
