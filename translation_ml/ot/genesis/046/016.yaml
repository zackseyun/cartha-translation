  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: ml
  text: 'ഗാദിന്റെ പുത്രന്മാർ: സിഫ്യോൻ[a], ഹഗ്ഗി, ശൂനി, എസ്ബോൻ, ഏരി, അരോദി, അരേലി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായപാഠത്തിലെ צִפְיוֹן എന്ന പേര് ‘സിഫ്യോൻ’ എന്നു നൽകിയിരിക്കുന്നു; സംഖ്യാപുസ്തകം 26:15-ൽ കാണുന്ന മറ്റൊരു പരമ്പരാഗത രൂപത്തെ പിന്തുടർന്ന് ചില പരിഭാഷകളിൽ ‘സെഫോൻ’ എന്നു കാണാം.
