  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തി; ‘നפש’ എന്ന പദത്തിന്റെ ജീവൻ/വ്യക്തി എന്ന പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
