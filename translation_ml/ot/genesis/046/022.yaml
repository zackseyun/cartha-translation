lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: സംഗ്രഹപ്രസ്താവനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; എബ്രായത്തിലെ സൂചകപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בְּנֵי רָחֵל
  choice: റാഹേലിന്റെ പുത്രന്മാർ
  rationale: ‘റാഹേലിന്റെ പുത്രന്മാർ’ എന്ന ഉറവിടത്തിലെ ലിംഗസൂചകവും വംശാവലിസന്ദർഭവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: യാക്കോബിനു ജനിച്ച
  rationale: ילד എന്ന ക്രിയയുടെ പാസീവ് അർഥവും לְ സൂചിപ്പിക്കുന്ന മാതാപിതൃബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל נֶפֶשׁ
  choice: ആകെ ... പേർ
  rationale: വംശാവലി/എണ്ണൽസന്ദർഭത്തിൽ נֶפֶשׁ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഇവിടെ അനാവശ്യമായ ദൈവശാസ്ത്രാർഥം സൃഷ്ടിക്കാം.
- source_word: אַרְבָּעָה עָשָׂר
  choice: പതിനാലു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം; ‘പേർ’ ചേർത്ത് വ്യക്തികളുടെ ആകെ എണ്ണം വ്യക്തമാക്കുന്നു.
