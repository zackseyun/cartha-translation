  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: ml
  text: യാക്കോബിനു ജനിച്ച റാഹേലിന്റെ പുത്രന്മാർ ഇവരാണ്—ആകെ പതിനാലുപേർ.[a]
  philosophy: optimal-equivalence
  footnotes:
