  text: אֵ֚לֶּה בְּנֵ֣י רָחֵ֔ל אֲשֶׁ֥ר יֻלַּ֖ד לְ/יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ אַרְבָּעָ֥ה עָשָֽׂר־׃
