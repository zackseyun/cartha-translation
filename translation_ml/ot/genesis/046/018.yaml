  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: ml
  text: 'ലാബാൻ തന്റെ മകൾ ലേയയ്ക്കു കൊടുത്ത സിൽപ്പയുടെ പുത്രന്മാർ ഇവരാണ്: അവൾ യാക്കോബിന് പ്രസവിച്ചവർ ആകെ പതിനാറു പേർ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പതിനാറു ആത്മാക്കൾ.” ഇവിടെ എബ്രായത്തിലെ നെഫെഷ് എന്ന പദം ആളുകളെ എണ്ണുന്നതിനുള്ള ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: സിൽപ്പയുടെ പുത്രന്മാർ ഇവരാണ്
  rationale: വംശാവലിപ്പട്ടികയെ സംഗ്രഹിച്ച് ചൂണ്ടിക്കാണിക്കുന്ന אֵלֶּה എന്ന പദവും, ലിംഗസൂചനയുള്ള בְּנֵי എന്ന പദവും നേരിട്ട് നിലനിർത്തുന്നു. പട്ടികയിൽ തുടർന്നുള്ള സന്തതികളും ഉൾപ്പെടുന്നുണ്ടെങ്കിലും ‘പുത്രന്മാർ’ എന്നത് എബ്രായരൂപത്തിന്റെ സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: ലാബാൻ തന്റെ മകൾ ലേയയ്ക്കു കൊടുത്ത
  rationale: ബന്ധവാക്യം സിൽപ്പയെ വിശേഷിപ്പിക്കുന്നതായിത്തന്നെ നിലനിർത്തുകയും, בִתּוֹ എന്ന ബന്ധം സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: അവൾ യാക്കോബിനു പ്രസവിച്ച ഇവർ
  rationale: ילד എന്ന പ്രസവക്രിയയും לְיַעֲקֹב സൂചിപ്പിക്കുന്ന പിതൃബന്ധവും സംക്ഷിപ്തമായ വംശാവലി ശൈലിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: ആകെ പതിനാറു പേർ
  rationale: נֶפֶשׁ ഇവിടെ മനുഷ്യരെ എണ്ണുന്നതിനുള്ള എബ്രായ പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ തെറ്റായ ശരീരം–ആത്മാവ് വ്യത്യാസം സൂചിപ്പിക്കാതെ അർഥം നൽകാൻ ‘പേർ’ ഉപയോഗിച്ചു; സംഗ്രഹസംഖ്യയാണെന്ന് വ്യക്തമാക്കാൻ സ്വാഭാവികമായി ‘ആകെ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വംശാവലി ശൈലി നിലനിർത്താൻ ‘പുത്രന്മാർ’, ‘പ്രസവിച്ച’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ ഉപയോഗിച്ചു; എണ്ണൽപ്രയോഗം സ്വാഭാവികമാക്കാൻ ‘പേർ’ തിരഞ്ഞെടുത്തു.
