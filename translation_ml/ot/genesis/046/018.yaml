    rationale: ‘അവൾ യാക്കോബിനു പ്രസവിച്ച ഇവർ’ is understandable but not natural as a genealogical summary. Reordering to ‘അവൾ യാക്കോബിന് പ്രസവിച്ചവർ’ makes the referent and relation clear without changing meaning.
