id: GEN.46.12
reference: Genesis 46:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: ml
  text: യെഹൂദായുടെ പുത്രന്മാർ ഏർ, ഓനാൻ, ശേലാ, പെരെസ്, സേരഹ് എന്നിവരായിരുന്നു. എന്നാൽ ഏരും ഓനാനും കനാൻദേശത്തുവെച്ച് മരിച്ചു. പെരെസിന്റെ പുത്രന്മാർ ഹെസ്രോനും ഹാമൂലും ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: യെഹൂദായുടെ പുത്രന്മാർ
  rationale: സന്ധിബന്ധമായ വംശാവലിപ്പട്ടികയിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം; തുടക്കത്തിലെ וּ-യുടെ ബന്ധകഭാവം വാക്യക്രമത്തിൽ നിലനിൽക്കുന്നു.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: ഏർ, ഓനാൻ, ശേലാ, പേരെസ്, സേരഹ്
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: ക്രിയ എബ്രായത്തിൽ ഏകവചനരൂപത്തിലാണെങ്കിലും പിന്നാലെ വരുന്ന സംയുക്തകർത്താവായ ‘ഏരും ഓനാനും’ രണ്ടുപേരെയും സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ വാക്യഘടനയാണ്; മലയാളത്തിൽ ‘മരിച്ചു’ എന്ന രൂപം ഏകവചന-ബഹുവചന വ്യത്യാസമില്ലാതെ സ്വാഭാവികമാണ്.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തുവെച്ച്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ ഘടകം സംരക്ഷിച്ചുകൊണ്ട് മരണത്തിന്റെ സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: പേരെസിന്റെ പുത്രന്മാർ … ആയിരുന്നു
  rationale: വംശാവലിയിൽ היה എന്ന ക്രിയ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്നു; ‘ആയിരുന്നു’ അതിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: ഹെസ്രോനും ഹാമൂലും
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം പിന്തുടർന്നുള്ള മലയാള ലിപ്യന്തരണം.
