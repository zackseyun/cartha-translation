translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായത്തിലെ ആവർത്തിക്കുന്ന ബന്ധകങ്ങൾ മലയാളപ്പട്ടികയുടെ സ്വാഭാവികതയ്ക്കനുസരിച്ച് വിരാമചിഹ്നങ്ങളും അവസാനത്തെ ‘എന്നിവർ’/‘-ഉം’ ഘടനയും ഉപയോഗിച്ച് അവതരിപ്പിച്ചു.
