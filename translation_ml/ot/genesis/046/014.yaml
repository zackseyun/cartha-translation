  text: וּ/בְנֵ֖י זְבוּלֻ֑ן סֶ֥רֶד וְ/אֵל֖וֹן וְ/יַחְלְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: ml
  text: 'സെബൂലൂന്റെ പുത്രന്മാർ: സെരെദ്, ഏലോൻ, യഹ്ലെയേൽ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ചില ലിപ്യന്തരണരീതികളിൽ ‘യഹലേൽ’ എന്നും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രൻ’ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്; വംശാവലിപ്പട്ടികയിൽ ‘പുത്രന്മാർ’ എന്നതാണ് സ്വാഭാവികം. മുൻപുള്ള וְ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതാണെങ്കിലും, മലയാളത്തിൽ ഈ ഒറ്റവാക്യത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കാതെ തന്നെയും ആ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ നാമരൂപത്തോടൊത്തും ലിപ്യന്തരിച്ചു.
- source_word: סֶרֶד
  choice: സെരെദ്
  rationale: വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു സ്വര-വ്യഞ്ജനക്രമത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְ/אֵלוֹן
  choice: ഏലോൻ
  rationale: ഇവിടെ אֵלוֹן ഒരു വ്യക്തിനാമമാണ്; അതിനാൽ സമാനരൂപമുള്ള സാധാരണ നാമത്തിന്റെ അർത്ഥം വിവർത്തനം ചെയ്യാതെ പേരായി ലിപ്യന്തരിച്ചു. പട്ടികയിലെ ബന്ധം മലയാളത്തിലെ കോമകൾകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וְ/יַחְלְאֵל
  choice: യഹ്ലെയേൽ
  rationale: ആദ്യാക്ഷരമായ י നെ ‘യ’ എന്നും ח നെ ‘ഹ്’ എന്നും പ്രതിനിധീകരിച്ച് ഹീബ്രു നാമത്തോട് അടുത്ത രൂപം സ്വീകരിച്ചു; മുൻപുള്ള וְ അവസാന പട്ടികാംഗത്തിന്റെ ബന്ധം സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിപ്പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ പേരുകളുടെ ക്രമവും ‘പുത്രന്മാർ’ എന്ന ബന്ധവും അതേപടി നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തിത സംയോജകങ്ങൾ ഒഴിവാക്കി.
