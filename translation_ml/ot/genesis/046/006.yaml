id: GEN.46.6
reference: Genesis 46:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ കന്നുകാലികളെയും കനാൻദേശത്ത് സമ്പാദിച്ച സ്വത്തുക്കളെയും എടുത്ത് ഈജിപ്തിലേക്കു വന്നു—യാക്കോബും അവനോടുകൂടെ അവന്റെ സന്തതി[a] മുഴുവനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വംശജർ.’ എബ്രായപദത്തിന് ‘വിത്ത്,’ ‘സന്തതി,’ ‘വംശജർ’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: അവർ ... എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘വന്നു’ എന്ന ക്രിയയുമായി ചേർത്ത് സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലി നൽകുന്നു.
- source_word: מִקְנֵיהֶם
  choice: തങ്ങളുടെ കന്നുകാലികളെ
  rationale: מִקְנֶה വിവിധതരം വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്നതിനാൽ ‘കന്നുകാലികൾ’ ഈ കുടിയേറ്റസന്ദർഭത്തിന് യോജിച്ച വിശാലമായ പദമാണ്.
- source_word: רְכוּשָׁם
  choice: സ്വത്തുക്കളെ
  rationale: רְכוּשׁ ഇവിടെ കൈവശമുള്ള സാധനസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള കന്നുകാലികളിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: സമ്പാദിച്ച
  rationale: ഈ സ്വത്തുക്കൾ യാത്രയ്ക്കുമുമ്പ് കനാൻദേശത്ത് നേടിയവയാണെന്ന ആപേക്ഷിക ഉപവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘കനാൻദേശം’ എന്ന പ്രയോഗം ഭൂമിശാസ്ത്രപരമായ വ്യക്തതയോടൊപ്പം אֶרֶץ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു വന്നു
  rationale: מִצְרָיְמָהയിലെ ദിശാസൂചകപ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘വന്നു’ בואയുടെ ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: യാക്കോബും അവനോടുകൂടെ അവന്റെ സന്തതി മുഴുവനും
  rationale: זֶרַע എന്ന പദത്തിന്റെ കുടുംബപരമ്പരയെ സൂചിപ്പിക്കുന്ന വിശാലത ‘സന്തതി’ നിലനിർത്തുന്നു; അന്ത്യത്തിലുള്ള വിശദീകരണഘടന മൂലപാഠത്തിന്റെ ഊന്നൽ പിന്തുടരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ അവസാന വിശദീകരണമായ ‘യാക്കോബും ... സന്തതി മുഴുവനും’ എന്ന ഘടന ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി.
