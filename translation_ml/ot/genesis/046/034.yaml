  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ ഇങ്ങനെ പറയണം: ‘അങ്ങയുടെ ദാസന്മാർ ചെറുപ്പംമുതൽ ഇന്നുവരെ വളർത്തുമൃഗങ്ങളെ പരിപാലിക്കുന്നവരാണ്—ഞങ്ങളും ഞങ്ങളുടെ പിതാക്കന്മാരും.’ അങ്ങനെ നിങ്ങൾക്ക് ഗോഷെൻ ദേശത്ത് പാർക്കാം; കാരണം ആടുകളുടെ ഓരോ ഇടയനും ഈജിപ്തുകാർക്ക് അറപ്പാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി: “ആടുകളുടെ ഓരോ ഇടയനും ഈജിപ്തുകാർക്ക് മ്ലേച്ഛനാണ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: അപ്പോൾ നിങ്ങൾ ഇങ്ങനെ പറയണം
  rationale: മുൻനിർദേശത്തിന്റെ തുടർച്ചയും നിർദേശകശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: കന്നുകാലികളെ വളർത്തുന്നവർ
  rationale: മൃഗപരിപാലനം ഉപജീവനമാക്കിയവരെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഒരു പ്രത്യേക മൃഗവർഗത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഫറവോനോടുള്ള ആദരപൂർവമായ സ്വയംപരാമർശമാണ്; അടിമത്തം ഊന്നിപ്പറയുന്നില്ല.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: ചെറുപ്പംമുതൽ ഇന്നുവരെ
  rationale: ആദ്യകാലംമുതലുള്ള തുടർച്ച ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: ഞങ്ങളും ഞങ്ങളുടെ പിതാക്കന്മാരും
  rationale: രണ്ടുതലമുറകളെയും ഊന്നുന്ന ആവർത്തിത גַּם എന്നതിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: അങ്ങനെ നിങ്ങൾക്കു ... പാർക്കാം
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ബന്ധവും ישב എന്നതിന്റെ താമസിക്കുക എന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോഷെൻ ദേശത്ത്
  rationale: മൂലത്തിലെ ‘ദേശം’ എന്ന ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: ഈജിപ്തുകാർക്ക് അറപ്പുളവാക്കുന്നവൻ
  rationale: תוֹעֵבָהയുടെ ശക്തമായ വെറുപ്പ്/അറപ്പ് എന്ന ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആചാരപരമായോ മതപരമായോ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: כָּל רֹעֵה צֹאן
  choice: ആടുകളെ മേയ്ക്കുന്ന ഏവനും
  rationale: צֹאן എന്ന ആട്/ചെമ്മരിയാട്-കോലാട് കൂട്ടത്തെ സംബന്ധിച്ച ഘടകം ഒഴിവാക്കാതെ തൊഴിൽ സ്വാഭാവികമായി വിവരിക്കുന്നു.
theological_decisions:
- issue: תוֹעֵבָה എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അറപ്പുളവാക്കുന്നവൻ
  alternative: മ്ലേച്ഛൻ / വെറുക്കപ്പെട്ടവൻ
  rationale: ഈജിപ്തുകാരുടെ ശക്തമായ സാമൂഹിക-സാംസ്കാരിക വിരക്തി പ്രകടമാക്കുന്നു; തെളിവില്ലാതെ പ്രത്യേക മതാചാരപരമായ അശുദ്ധി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഫറവോനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ഉദ്ദേശ്യബന്ധവും തലമുറകളിലൂടെയുള്ള തൊഴിൽതുടർച്ചയും നിലനിർത്തി.
