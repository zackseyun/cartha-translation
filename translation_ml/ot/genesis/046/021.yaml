- source_word: גֵּרָא
  choice: ഗേരാ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: נַעֲמָן
  choice: നയമാൻ
  rationale: ഹീബ്രു നാമത്തിലെ സ്വരവിരാമം മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്ന വിധം പ്രതിനിധീകരിക്കുന്ന, പരിചിതമായ ലിപ്യന്തരണം.
- source_word: אֵחִי
  choice: ഏഹി
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠത്തിലുള്ള പേരിനെ തന്നെയാണ് ലിപ്യന്തരം ചെയ്തത്; സമാന്തര വംശാവലിയിലെ വ്യത്യസ്ത പേര് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: רֹאשׁ
  choice: രോഷ്
