- source_word: חֻפִּים
  choice: ഹുപ്പീം
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אָרְדְּ
  choice: ആർദ്
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് പാഠം പിന്തുടർന്നു; സമാന്തര വംശാവലിയിലെ ബന്ധമുള്ള വ്യത്യസ്ത നാമരൂപം അടിക്കുറിപ്പിൽ നൽകി.
