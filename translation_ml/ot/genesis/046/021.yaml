translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. വംശാവലിയുടെ പട്ടികാശൈലി ചുരുക്കമായി നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു പാഠത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണങ്ങളായി നൽകി. പാഠാന്തരങ്ങളും സമാന്തര വംശാവലികളിലെ വ്യത്യാസങ്ങളും മുഖ്യപാഠത്തിൽ ലയിപ്പിക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
