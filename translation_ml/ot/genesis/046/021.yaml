  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാർ: ബേല, ബെകെർ[a], അശ്ബേൽ, ഗേരാ, നയമാൻ, ഏഹി[b], രോഷ്, മുപ்பീം[c], ഹുപ്പീം, ആർദ്[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പല പരമ്പരാഗത ഇംഗ്ലീഷ് വിവർത്തനങ്ങളിലും ഈ പേര് “Becher” എന്നു ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: സംഖ്യാപുസ്തകം 26:38-ലെ സമാന്തര ബെന്യാമീൻ വംശാവലിയിൽ ഈ വാക്യത്തിലെ “ഏഹി” എന്നതിനു പകരം “അഹീരാം” എന്നാണ്.
    reason: cross_reference
  - marker: c
    text: ചില സമാന്തര വംശാവലി പാരമ്പര്യങ്ങളിൽ “മുപ്പീം” എന്നതിനു പകരം “ശുപ്പീം” പോലുള്ള വ്യത്യസ്ത രൂപമുണ്ട്; ഇവിടെ മസോററ്റിക് പാഠമാണ് പിന്തുടരുന്നത്.
    reason: textual_variant
  - marker: d
    text: 1 ദിനവൃത്താന്തം 8:3-ലെ ബെന്യാമീൻ വംശാവലിയിൽ ബന്ധമുള്ള “അദ്ദാർ” എന്ന നാമരൂപമുണ്ട്; ഈ വാക്യത്തിൽ “ആർദ്” എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ ബഹുവചന നിർമാണരൂപമാണിത്. വംശാവലിപ്പട്ടികയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ പേരിന് ശേഷം പട്ടിക തുടങ്ങുന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ളതും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: בֶּלַע
  choice: ബേല
  rationale: പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: בֶּכֶר
  choice: ബെക്കർ
  rationale: ഹീബ്രു വ്യഞ്ജനങ്ങളെയും ഉച്ചാരണത്തെയും അടുത്ത് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം; പരമ്പരാഗത ഇംഗ്ലീഷ് രൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: אַשְׁבֵּל
