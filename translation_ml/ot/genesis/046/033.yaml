review_pass:
  verdict: revise
  source_fidelity: The temporal-contingency construction is conveyed well by the Malayalam subordinate clause, and ‘നിങ്ങളുടെ തൊഴിൽ എന്താണ്?’ accurately communicates מַה־מַּעֲשֵׂיכֶם in context. However, וְאָמַר is ‘and says,’ introducing the direct question; rendering it as ‘ചോദിക്കുമ്പോൾ’ slightly replaces the source’s speech verb with an interpretive verb.
  naturalness: The wording is clear, modern, and appropriately formal. ‘എന്നു പറയുമ്പോൾ’ remains natural in Malayalam when followed by a quoted question, while preserving the source’s speech verb. The final comma appropriately retains the verse’s dependence on the following verse.
  terminology: ‘ഫറവോൻ’ is the established Malayalam form, and ‘തൊഴിൽ’ is an apt contextual equivalent for the brothers’ occupation/work.
  issues:
  - severity: low
    issue: The draft renders וְאָמַר (‘and says’) as ‘ചോദിക്കുമ്പോൾ’ (‘when ... asks’).
    rationale: Although the quoted words are a question and ‘asks’ is contextually understandable, the Hebrew uses the general speech verb אמר. Retaining ‘പറയുമ്പോൾ’ better reflects both the original and the English audit trail without sacrificing naturalness.
  revised_text: ഫറവോൻ നിങ്ങളെ വിളിച്ച്, ‘നിങ്ങളുടെ തൊഴിൽ എന്താണ്?’ എന്നു പറയുമ്പോൾ,
  revised_footnotes: []
