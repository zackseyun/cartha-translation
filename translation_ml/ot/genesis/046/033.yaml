  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: ml
  text: ഫറവോൻ നിങ്ങളെ വിളിച്ച്, ‘നിങ്ങളുടെ തൊഴിൽ എന്താണ്?’ എന്നു പറയുമ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ചോദിക്കുമ്പോൾ
  rationale: ഈ എബ്രായ പ്രയോഗം ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന ഒരു സന്ദർഭത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചനയായി ‘-ുമ്പോൾ’ ഉപയോഗിച്ചു; വാക്യത്തിലെ וְאָמַר എന്നതും ചോദ്യം തന്നെയായതിനാൽ അതിനോടു ചേർത്തു.
- source_word: יִקְרָא לָכֶם
  choice: നിങ്ങളെ വിളിച്ച്
  rationale: קרא എന്ന ക്രിയയ്ക്ക് ל ചേർന്നപ്പോൾ ‘വിളിക്കുക/വരുത്തുക’ എന്ന അർത്ഥമുണ്ട്. രാജസദസ്സിന്റെ പശ്ചാത്തലം സൂചിപ്പിച്ചാലും ‘ഹാജരാകാൻ കൽപ്പിക്കുക’ എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപം.
- source_word: וְאָמַר
  choice: എന്നു ചോദിക്കുമ്പോൾ
  rationale: മൂലത്തിൽ അക്ഷരാർഥം ‘പറയുക’ എന്നാണെങ്കിലും തുടർന്ന് നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കുക’ സ്വാഭാവികമാണ്. ഇത് പ്രസംഗക്രിയയുടെ സന്ദർഭപരമായ അർത്ഥം നൽകുന്നു.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: നിങ്ങളുടെ തൊഴിൽ എന്താണ്?
  rationale: מַעֲשֶׂה ഇവിടെ പൊതുവായ ‘പ്രവൃത്തി’ എന്നതിലുപരി ഉപജീവനത്തിനായുള്ള ജോലി അഥവാ തൊഴിൽ സൂചിപ്പിക്കുന്നു. ‘തൊഴിൽ’ ആ സന്ദർഭാർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. അടുത്ത വാക്യത്തിലേക്ക് നയിക്കുന്ന ഉപവാക്യമാണെന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി.
