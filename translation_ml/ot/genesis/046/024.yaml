source:
  edition: WLC
  text: וּ/בְנֵ֖י נַפְתָּלִ֑י יַחְצְאֵ֥ל וְ/גוּנִ֖י וְ/יֵ֥צֶר וְ/שִׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: ml
  text: 'നഫ്താലിയുടെ പുത്രന്മാർ: യഹ്‌സെയേൽ[a], ഗൂനി, യേസെർ, ശില്ലേം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ചില പരിഭാഷകളിൽ ‘യഹ്‌സീയേൽ’ അല്ലെങ്കിൽ ‘യഹ്‌സേൽ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്ന അർഥമുള്ള നിർമിത ബഹുവചനരൂപമാണ്. വംശാവലിപ്പട്ടികയിൽ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു; വാക്യാരംഭത്തിലെ ו പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതായതിനാൽ മലയാളത്തിൽ നിർബന്ധമായി വേറൊരു ‘കൂടാതെ’ ചേർത്തില്ല.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יַחְצְאֵל
  choice: യഹ്‌സെയേൽ
  rationale: എബ്രായത്തിലെ യോദ്, ഹേത്, സാദേ, അലേഫ് എന്നീ ഘടകങ്ങൾ തിരിച്ചറിയാവുന്ന വിധത്തിലുള്ള മലയാള ലിപ്യന്തരണം; ഹേത് സൂചിപ്പിക്കാൻ ‘ഹ്’, സാദേയ്ക്കായി ‘സ’ ഉപയോഗിച്ചു.
- source_word: וְגוּנִי
  choice: ഗൂനി
  rationale: പ്രത്യയമായ ו പട്ടികയിലെ ബന്ധമായി വിരാമചിഹ്നങ്ങളിലൂടെ ഉൾക്കൊണ്ട്, വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיֵצֶר
  choice: യേസെർ
  rationale: ആദ്യ യോദ് ‘യ’യായും സാദേ ‘സ’യായും പ്രതിഫലിപ്പിക്കുന്ന, എബ്രായരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְשִׁלֵּם
  choice: ശില്ലേം
  rationale: ശിൻ ‘ശ’യായും ദാഗേഷ് സൂചിപ്പിക്കുന്ന ലാമെദിന്റെ ഇരട്ടിപ്പ് ‘ല്ല’യായും നിലനിർത്തിയ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; വ്യക്തിനാമങ്ങൾ ഇംഗ്ലീഷ് പരമ്പരയെ യാന്ത്രികമായി പിന്തുടരാതെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
