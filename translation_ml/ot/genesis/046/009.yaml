  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; പേരുകൾ മലയാളത്തിലെ പരിചിതരൂപങ്ങളും എബ്രായ ശബ്ദരൂപവും തമ്മിൽ സന്തുലിതമാക്കി.
