translation:
  language: ml
  text: 'രൂബേന്റെ പുത്രന്മാർ: ഹാനോക്ക്, പല്ലൂ, ഹെസ്രോൻ, കർമി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: בְנֵי എന്ന സംയുക്ത ബഹുവചനരൂപം വംശാവലിയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. വാക്യാരംഭത്തിലെ ו പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ഈ ഭാഗം സ്വതന്ത്രമായി വായിക്കുമ്പോൾ ‘എന്നാൽ/കൂടാതെ’ ചേർക്കുന്നത് കൃത്രിമമായതിനാൽ ചിഹ്നവിന്യാസത്തിലൂടെ പട്ടികാശൈലി നിലനിർത്തി.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ളതും ഉറവിടോച്ചാരണത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: എബ്രായ חֲנוֹךְ എന്ന പേരിന്റെ ശബ്ദരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു; മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ കാണുന്ന ‘ഹാനോക്ക്’ വായനക്കാർക്ക് പരിചിതവുമാണ്.
- source_word: וּ/פַלּוּא
  choice: പല്ലൂ
  rationale: പേരിലെ ദ്വിത്വവ്യഞ്ജനവും ദീർഘസ്വരവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിച്ച് ‘പല്ലൂ’ എന്നു ലിപ്യന്തരിച്ചു; മുൻപ്രത്യയമായ ו പട്ടികയുടെ ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וְ/חֶצְרוֹן
  choice: ഹെസ്രോൻ
  rationale: എബ്രായ പേരിന്റെ പ്രചാരമുള്ള മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു. ח എന്ന ധ്വനിക്ക് ഇവിടെ വായനാസൗകര്യവും നിലവിലുള്ള പേരുപയോഗവും കണക്കിലെടുത്ത് ‘ഹ’ ഉപയോഗിച്ചു.
- source_word: וְ/כַרְמִי
  choice: കർമി
  rationale: എബ്രായ כַרְמִי എന്ന വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കർമി’ എന്നു ലിപ്യന്തരിച്ചു; മുൻപ്രത്യയമായ ו പട്ടികാക്രമത്തിൽ ഉൾക്കൊള്ളുന്നു.
