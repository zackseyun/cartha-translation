id: GEN.46.8
reference: Genesis 46:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: ml
  text: 'ഈജിപ്തിലേക്കു വന്ന ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: യാക്കോബും അവന്റെ പുത്രന്മാരും. യാക്കോബിന്റെ ആദ്യജാതൻ രൂബേൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: വംശാവലിപ്പട്ടികയുടെ ആമുഖമായി സ്വാഭാവികമായ മലയാളം; וְ എന്ന ബന്ധകത്തിന്റെ പ്രഭാഷണപരമായ ബലം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേകം ‘എന്നാൽ/ഇനി’ ചേർത്തിട്ടില്ല.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: ബഹുവചന നിർമാണരൂപത്തിന്റെ നേരായ അർഥം; തുടർന്ന് വരുന്ന പേരുകളുടെ പട്ടികയെ പരിചയപ്പെടുത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ ഉടൻ പട്ടികപ്പെടുത്തുന്നത് യാക്കോബിന്റെ ആൺമക്കളായതിനാൽ ‘മക്കൾ’ എന്ന വിശാലപദത്തേക്കാൾ ലിംഗസൂചനയുള്ള ‘പുത്രന്മാർ’ കൃത്യമാണ്; ഇസ്രായേൽ എന്ന വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു വന്ന
  rationale: നിശ്ചയാർഥക കൃദന്തരൂപം ഭൂതകാല വിവരണമായി നൽകി; ദിശാസൂചകമായ ־ָה പ്രത്യയം ‘ഈജിപ്തിലേക്ക്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: יַעֲקֹב וּבָנָיו
  choice: യാക്കോബും അവന്റെ പുത്രന്മാരും
  rationale: മുൻപറഞ്ഞ സംഘത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗം; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְּכֹר יַעֲקֹב
  choice: യാക്കോബിന്റെ ആദ്യജാതൻ
  rationale: നിർമാണബന്ധവും ജനനക്രമത്തിലെ മുൻതൂക്കവും കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: ബൈബിൾ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. എബ്രായത്തിലെ സമാനാധികരണ ഘടനയും പട്ടികയിലേക്കുള്ള നീക്കവും വ്യക്തമാക്കാൻ ദീർഘവിരാമവും ദ്വിബിന്ദുവും ഉപയോഗിച്ചു.
