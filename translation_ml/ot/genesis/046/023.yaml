lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: וּ എന്ന സംയോജകം വംശാവലിപ്പട്ടികയിലെ തുടർച്ച സൂചിപ്പിക്കുന്നു; എന്നാൽ സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ പ്രത്യേകമായി ‘പിന്നെ/കൂടാതെ’ ചേർക്കാതെ കോളൻ ഉപയോഗിച്ചുതന്നെ ആ ബന്ധം വ്യക്തമാണ്. בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ ബഹുവചന നിർമാണരൂപമായതിനാൽ അതേപടി നിലനിർത്തി.
- source_word: דָן
  choice: ദാൻ
  rationale: എബ്രായ വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: חֻשִׁים
  choice: ഹൂശീം
  rationale: ഇവിടെ ഇത് വ്യക്തിനാമമാണ്. രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും വാക്യത്തിൽ ദാന്റെ ഏക വംശജനെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലത്തിലെ ഹ്രസ്വവും ക്രിയാരഹിതവുമായ ശൈലി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തി.
