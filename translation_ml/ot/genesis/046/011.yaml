base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/011.yaml
  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: ml
  text: 'ലേവിയുടെ പുത്രന്മാർ: ഗേർശോൻ, കെഹാത്ത്, മെരാരി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർ
  rationale: בְנֵי എന്ന നിർമാണബഹുവചനം വംശാവലിപ്പട്ടികയിലെ വ്യക്തമായ പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു നൽകി. വാക്യാരംഭത്തിലെ ו പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ ആ തുടർച്ച നിലനിർത്താം.
- source_word: גֵּרְשׁוֹן
  choice: ഗേർശോൻ
  rationale: ഇവിടെയുള്ള പേര് גֵּרְשׁוֹן ആണ്; സമാനമായ ഗേർശോം എന്ന പേരിൽനിന്ന് വേർതിരിച്ചും ഹീബ്രു രൂപത്തോട് ചേർന്നും ലിപ്യന്തരിച്ചു.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: ഹീബ്രു ഉച്ചാരണഘടനയോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- source_word: וּ/מְרָרִי
  choice: മെരാരി
  rationale: പേര് ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരിച്ചു. പട്ടികയിലെ അവസാന അംഗമാണെന്നത് മലയാളത്തിലെ കോമക്രമം കൊണ്ടു സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘എന്നിവർ’ ചേർത്തില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത നാമാവലി ഘടന നിലനിർത്തി; അനാവശ്യമായ വിശദീകരണപദങ്ങൾ ചേർത്തിട്ടില്ല.
