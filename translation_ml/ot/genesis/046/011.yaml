  naturalness: '“ലേവിയുടെ പുത്രന്മാർ: ഗേർശോൻ, കെഹാത്ത്, മെരാരി.” എന്നത് ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വംശാവലിപ്പട്ടികയ്ക്ക് യോജിച്ചതുമായ രൂപമാണ്. കോളണും കോമക്രമവും പേരുകളുടെ പട്ടിക വ്യക്തമായി അവതരിപ്പിക്കുന്നു.'
