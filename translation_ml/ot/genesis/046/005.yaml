source:
  edition: WLC
  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് ബേർ-ശേബയിൽനിന്ന് പുറപ്പെട്ടു.[a] ഫറവോൻ യാക്കോബിനെ കൊണ്ടുപോകാൻ അയച്ച വണ്ടികളിൽ ഇസ്രായേലിന്റെ പുത്രന്മാർ തങ്ങളുടെ പിതാവായ യാക്കോബിനെയും തങ്ങളുടെ കുഞ്ഞുങ്ങളെയും ഭാര്യമാരെയും കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ബേർ-ശേബയിൽനിന്ന് എഴുന്നേറ്റു.’ യാത്രാസന്ദർഭത്തിൽ എബ്രായക്രിയ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: പുറപ്പെട്ടു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘എഴുന്നേറ്റു’ എന്നാണെങ്കിലും, מן + സ്ഥലനാമം വരുന്ന യാത്രാസന്ദർഭത്തിൽ അത് ഒരു സ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִבְּאֵר שָׁבַע
  choice: ബേർ-ശേബയിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; prefixed מן-ന്റെ അർഥം ‘യിൽനിന്ന്’ എന്നു നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּשְׂאוּ
  choice: കയറ്റിക്കൊണ്ടുപോയി
  rationale: נשׂא എന്നതിന് ‘വഹിക്കുക/കൊണ്ടുപോകുക’ എന്നർഥമുണ്ട്; ഇവിടെ ആളുകളെ വണ്ടികളിൽ കൊണ്ടുപോകുന്നതായതിനാൽ സ്വാഭാവികമായ മലയാള പ്രയോഗം സ്വീകരിച്ചു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ ‘ഇസ്രായേൽ’ യാക്കോബിനെയും ‘പുത്രന്മാർ’ അദ്ദേഹത്തിന്റെ ആൺമക്കളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗം ഒഴിവാക്കി.
- source_word: אֲבִיהֶם
  choice: തങ്ങളുടെ പിതാവായ
  rationale: യാക്കോബ് പുത്രന്മാരുടെ പിതാവാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: טַפָּם
  choice: തങ്ങളുടെ കുഞ്ഞുങ്ങളെ
  rationale: טַף പ്രത്യേകിച്ച് ചെറിയ കുട്ടികളെയോ കുടുംബത്തിലെ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു; ഈ കുടുംബസന്ദർഭത്തിൽ ‘കുഞ്ഞുങ്ങൾ’ അതിന്റെ പ്രധാന സൂക്ഷ്മാർഥം നിലനിർത്തുന്നു.
- source_word: נְשֵׁיהֶם
  choice: ഭാര്യമാരെ
  rationale: കുടുംബയാത്രയുടെ ഈ സന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്നതാണ് വ്യക്തവും സ്വാഭാവികവുമായ അർഥം.
- source_word: בָּעֲגָלוֹת
  choice: വണ്ടികളിൽ
  rationale: עֲגָלוֹת ചരക്കോ ആളുകളെയോ കൊണ്ടുപോകുന്ന വണ്ടികളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വണ്ടികൾ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: ഫറവോൻ അയച്ച
  rationale: ബന്ധവാക്യത്തിന്റെ കാലക്രമം മലയാളത്തിൽ ലളിതമായ ഭൂതകാലരൂപംകൊണ്ട് സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: לָשֵׂאת אֹתוֹ
  choice: കൊണ്ടുപോകാൻ
  rationale: ഉദ്ദേശ്യസൂചക infinitive-നെ ‘കൊണ്ടുപോകാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഏകവചന പ്രത്യയം പ്രധാനമായി യാക്കോബിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാള വാക്യഘടനയിൽ ആവർത്തനം ഒഴിവാക്കുന്നു.
