translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നു നൽകി യാക്കോബിന്റെ ആൺമക്കളെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നതെന്ന് നിലനിർത്തി. വണ്ടികളിൽ കയറ്റി കൊണ്ടുപോകുന്ന ദൃശ്യസന്ദർഭം സ്വാഭാവികമാക്കാൻ ‘കയറ്റിക്കൊണ്ടുപോയി’ ഉപയോഗിച്ചു.
