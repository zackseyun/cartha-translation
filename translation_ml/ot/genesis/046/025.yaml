source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י בִלְהָ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/רָחֵ֣ל בִּתּ֑/וֹ וַ/תֵּ֧לֶד אֶת אֵ֛לֶּה לְ/יַעֲקֹ֖ב כָּל נֶ֥פֶשׁ שִׁבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: ml
  text: ലാബാൻ തന്റെ മകളായ റാഹേലിന് നൽകിയ ബിൽഹയുടെ പുത്രന്മാർ ഇവരാണ്; അവൾ ഇവരെ യാക്കോബിന് പ്രസവിച്ചു. ആകെ ഏഴുപേർ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, ‘എല്ലാ ജീവൻ, ഏഴ്’; ആകെ ഏഴുപേരെ സൂചിപ്പിക്കുന്ന ആളെണ്ണൽ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: ബിൽഹയുടെ പുത്രന്മാർ ഇവരാണ്
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്നത് പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി; തിരിച്ചറിയൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന ക്രമത്തിൽ നൽകി.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: ലാബാൻ തന്റെ മകളായ റാഹേലിന് നൽകിയ
  rationale: ബന്ധവാക്യം ബിൽഹയെ വിശേഷിപ്പിക്കുന്നു. בִּתּוֹയിലെ സർവനാമപ്രത്യയം വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘തന്റെ മകളായ’ എന്നു നൽകി.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: അവൾ യാക്കോബിന് പ്രസവിച്ച ഇവർ
  rationale: יַלד എന്ന പ്രസവക്രിയയുടെയും സ്ത്രീലിംഗ കർത്താവായ ബിൽഹയുടെയും ബന്ധം നിലനിർത്തി; לְיַעֲקֹב പിതൃബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ ‘യാക്കോബിന്’ എന്നു നൽകി.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: ആകെ ഏഴുപേർ
  rationale: ഇവിടെ נֶפֶשׁ ആളുകളെ എണ്ണുന്ന എബ്രായ പ്രയോഗമാണ്. അക്ഷരാർഥമായ ‘ആത്മാക്കൾ’ എന്നതിനു പകരം കണക്കിന്റെ അർഥം വ്യക്തമായി നൽകുന്ന ‘പേർ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി ഉപയോഗിച്ചു. പേരുകൾ ‘ബിൽഹ’, ‘റാഹേൽ’, ‘യാക്കോബ്’, ‘ലാബാൻ’ എന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദപ്രയോഗത്തിനരികെ [a] സ്ഥാപിച്ചു.
