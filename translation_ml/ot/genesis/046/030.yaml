  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ യോസേഫിനോടു പറഞ്ഞു: “നിന്റെ മുഖം കണ്ടശേഷം, നീ ഇപ്പോഴും ജീവനോടെയിരിക്കുന്നതിനാൽ, ഇനി എനിക്കു മരിക്കാം.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “ഇപ്പോൾ, നിന്റെ മുഖം കണ്ടശേഷം, നീ ഇപ്പോഴും ജീവനോടെയിരിക്കുന്നതിനാൽ, ഞാൻ മരിക്കട്ടെ.” ഹീബ്രു വാക്യം ചുരുക്കവും പ്രയോഗസവിശേഷതയുള്ളതുമാണ്; മുഖ്യപാഠം അതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമസൂചന സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: മൂലപാഠം ‘യാക്കോബ്’ എന്നല്ല, ‘ഇസ്രായേൽ’ എന്ന പേരാണ് വ്യക്തമായി ഉപയോഗിക്കുന്നത്; അതുതന്നെ നിലനിർത്തി.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָמ֣וּתָה
  choice: എനിക്ക് മരിക്കാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം ഇവിടെ മരണത്തിനുള്ള അനുമതി ചോദിക്കുന്നതല്ല; യോസേഫിനെ ജീവനോടെ കണ്ടശേഷം താൻ ഇനി സംതൃപ്തനായി മരിക്കാമെന്ന ഇസ്രായേലിന്റെ വികാരനിർഭരമായ സന്നദ്ധതയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַפָּעַם
  choice: ഇനി
  rationale: അക്ഷരാർഥമായ ‘ഈ പ്രാവശ്യം’ എന്നതിനെക്കാൾ, ദീർഘദുഃഖത്തിനുശേഷമുള്ള ഇപ്പോഴത്തെ മാറിയ സാഹചര്യം ‘ഇനി’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי רְאוֹתִי אֶת־פָּנֶיךָ
  choice: നിന്റെ മുഖം കാണുകയും ... ചെയ്തതിനാൽ
  rationale: ‘നിന്റെ മുഖം’ എന്ന ദൃശ്യവും വ്യക്തിപരവുമായ ഹീബ്രു പ്രയോഗം നിലനിർത്തി; אַחֲרֵיയുടെ കാലിക-കാരണപരമായ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: כִּי עוֹדְךָ חָי
  choice: നീ ഇപ്പോഴും ജീവനോടെയുണ്ടെന്ന് അറിയുകയും
  rationale: כִּי ഇവിടെ യോസേഫ് ഇപ്പോഴും ജീവനോടെയുണ്ടെന്ന തിരിച്ചറിവിനെ അവതരിപ്പിക്കുന്നു. ‘അറിയുകയും’ എന്നത് മുഖം കണ്ടതിലൂടെ ലഭിച്ച തിരിച്ചറിവ് മലയാളത്തിൽ വ്യക്തമാക്കുന്ന പരിമിതമായ പരോക്ഷപൂരണമാകുന്നു.
theological_decisions:
- issue: אָמ֣וּתָה എന്ന കോഹോർട്ടേറ്റീവിന്റെ ഭാവം
  choice: എനിക്ക് മരിക്കാം
  alternative: ഞാൻ മരിക്കട്ടെ / ഞാൻ മരിക്കും
  rationale: ‘ഞാൻ മരിക്കട്ടെ’ അനുമതി ചോദിക്കുന്നതോ മരണത്തെ അഭ്യർഥിക്കുന്നതോ ആയ ഭാവം അനാവശ്യമായി വരുത്താം; ‘ഞാൻ മരിക്കും’ ഉറച്ച ഭാവിപ്രവചനമായി തോന്നാം. സന്ദർഭത്തിലെ സംതൃപ്തിയും സന്നദ്ധതയും ‘എനിക്ക് മരിക്കാം’ നന്നായി വഹിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നിന്റെ മുഖം’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗവും ‘ഇസ്രായേൽ’ എന്ന മൂലപാഠനാമവും നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
