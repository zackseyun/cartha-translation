  text: וְ/אֶת יְהוּדָ֞ה שָׁלַ֤ח לְ/פָנָי/ו֙ אֶל יוֹסֵ֔ף לְ/הוֹרֹ֥ת לְ/פָנָ֖י/ו גֹּ֑שְׁנָ/ה וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה גֹּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: ml
  text: അവൻ യെഹൂദയെ തനിക്കു മുമ്പായി യോസേഫിന്റെ അടുക്കലേക്ക് അയച്ചു, അവന്നു മുമ്പായി ഗോശെനിലേക്കു വഴികാണിക്കേണ്ടതിന്[a]. അങ്ങനെ അവർ ഗോശെൻ ദേശത്ത് എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതും വ്യാഖ്യാനത്തിൽ ചില അവ്യക്തതയുള്ളതുമാണ്. ‘അവന്നു മുമ്പായി ഗോശെനിലേക്കു വഴികാട്ടേണ്ടതിന്,’ ‘അവനെ ഗോശെനിലേക്കു നയിക്കേണ്ടതിന്,’ അല്ലെങ്കിൽ ‘ഗോശെനിലേക്കുള്ള നിർദേശം ലഭിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: അയച്ചു
  rationale: ‘അയയ്ക്കുക’ എന്ന സാധാരണ അർഥം സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: לְפָנָיו
  choice: തനിക്കു മുമ്പായി
  rationale: യാക്കോബ് എത്തുന്നതിനു മുമ്പേ യെഹൂദയെ അയച്ചുവെന്ന സ്ഥലകാല മുൻഗണന വ്യക്തമാക്കുന്നു.
- source_word: לְהוֹרֹת
  choice: വഴി കാണിക്കാൻ
  rationale: ירה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘നിർദേശിക്കുക’, ‘വഴികാട്ടുക’, ‘കാണിച്ചുകൊടുക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; യാത്രാസന്ദർഭത്തിൽ ‘വഴി കാണിക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: גֹּשְׁנָה
  choice: ഗോശെനിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹאוּ
  choice: അങ്ങനെ അവർ ... എത്തി
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും ലക്ഷ്യസ്ഥാനത്തെത്തിയതും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַרְצָה גֹּשֶׁן
  choice: ഗോശെൻ ദേശത്ത്
  rationale: ഗോശെൻ ഒരു പ്രദേശമാണെന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് അതിലേക്കുള്ള പ്രവേശനം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: യെഹൂദ / യോസേഫ് / ഗോശെൻ
  rationale: വ്യക്തിനാമങ്ങളും സ്ഥലനാമവും മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: לְהוֹרֹת לְפָנָיו എന്ന ചുരുക്കമുള്ള പ്രയോഗത്തിൽ വഴികാണിക്കുന്നയാൾ ആരെന്നത്
  choice: പ്രധാനവാക്യത്തിൽ കർത്താവിനെ തുറന്നുപറയാതെ ‘വഴി കാണിക്കാൻ’ എന്നു നൽകി അവ്യക്തത നിലനിർത്തി
  alternative: യെഹൂദ മുന്നിൽനിന്ന് യാക്കോബിനെ നയിച്ചു / യോസേഫിൽനിന്ന് വഴിനിർദേശം ലഭിക്കാൻ യെഹൂദയെ അയച്ചു
  rationale: എബ്രായവാക്യം വ്യാകരണപരമായി ചുരുക്കമുള്ളതും വ്യത്യസ്തമായി ഗ്രഹിക്കാവുന്നതുമാണ്. ആരാണ് നിർദേശം നൽകുന്നതെന്നത് ഉറപ്പിച്ച് ചേർക്കുന്നത് മൂലപാഠത്തിലെ യഥാർഥ അവ്യക്തത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യത്തെ ‘അവൻ’ മുൻസന്ദർഭത്തിലെ യാക്കോബിനെ സൂചിപ്പിക്കുന്നു. വിവാദമായ ചുരുക്കപ്രയോഗത്തിന്റെ അവ്യക്തത പ്രധാനവാക്യത്തിൽ സംരക്ഷിച്ച് വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
