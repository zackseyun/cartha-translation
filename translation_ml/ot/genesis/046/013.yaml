lexical_decisions:
- source_word: וּ/בְנֵי יִשָׂשכָר
  choice: യിസ്സാഖാരിന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം വംശാവലിപ്പട്ടികയിൽ ‘പുത്രന്മാർ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി. തുടക്കത്തിലെ וּ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: תּוֹלָע
  choice: തോലാ
  rationale: വംശാവലിയിലെ വ്യക്തിനാമമായതിനാൽ അർത്ഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/פֻוָּה
  choice: പൂവാ
  rationale: വ്യക്തിനാമം എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പ്രചാരത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְ/י֥וֹב
  choice: യോബ്
  rationale: മസോററ്റിക് പാഠത്തിലെ יוֹב എന്ന പേരിനെ പ്രതിഫലിപ്പിക്കുന്നു. 1 ദിനവൃത്താന്തം 7:1-ലെ വ്യത്യസ്ത നാമരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְ/שִׁמְרֽוֹן
  choice: ശിമ്രോൻ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; പട്ടികയിലെ അവസാനത്തെ וְ മലയാളത്തിലെ വിരാമചിഹ്നക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
