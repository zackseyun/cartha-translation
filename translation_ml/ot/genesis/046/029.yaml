id: GEN.46.29
reference: Genesis 46:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔/וֹ וַ/יַּ֛עַל לִ/קְרַֽאת יִשְׂרָאֵ֥ל אָבִ֖י/ו גֹּ֑שְׁנָ/ה וַ/יֵּרָ֣א אֵלָ֗י/ו וַ/יִּפֹּל֙ עַל צַוָּארָ֔י/ו וַ/יֵּ֥בְךְּ עַל צַוָּארָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: ml
  text: അപ്പോൾ യോസേഫ് തന്റെ രഥം കെട്ടിയൊരുക്കി, തന്റെ അപ്പനായ യിസ്രായേലിനെ കാണാൻ ഗോഷെനിലേക്കു പോയി. അവൻ അപ്പന്റെ മുമ്പിൽ പ്രത്യക്ഷനായി[a], അപ്പന്റെ കഴുത്തിൽ വീണു, അപ്പന്റെ കഴുത്തിൽ ചേർന്ന് ഏറെനേരം കരഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അപ്പനു പ്രത്യക്ഷനായി” / “അവൻ അപ്പനു തന്നെത്തന്നെ കാണിച്ചു.”
    reason: ראה എന്ന എബ്രായ ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ‘പ്രത്യക്ഷപ്പെടുക’ എന്നോ ‘സ്വയം കാണിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്താം.
  - marker: b
    text: ശാബ്ദികമായി, “അപ്പന്റെ കഴുത്തിന്മേൽ കരഞ്ഞു; ഇനിയും/തുടർന്നും.” ഇവിടെ അവസാനത്തെ എബ്രായപദം കരച്ചിൽ നീണ്ടുനിന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: עוֹד എന്ന പദത്തിന് ‘ഇനിയും,’ ‘തുടർന്നും,’ ‘വീണ്ടും’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഈ സന്ദർഭത്തിൽ ദൈർഘ്യമാണ് ഏറ്റവും സ്വാഭാവികം.
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: തന്റെ രഥം കെട്ടിയൊരുക്കി
  rationale: אָסַר എന്നതിന് അടിസ്ഥാനമായി ‘കെട്ടുക’ എന്നർഥമുണ്ട്; രഥത്തോടൊപ്പം വരുമ്പോൾ യാത്രയ്ക്കായി കുതിരകളെ കെട്ടി രഥം ഒരുക്കുന്നതാണ് സൂചന. ‘കെട്ടിയൊരുക്കി’ ഈ ദൃശ്യവും പ്രവർത്തനവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיַּעַל ... גֹּשְׁנָה
  choice: ഗോഷെനിലേക്കു പോയി
  rationale: עלה എന്നതിന്റെ ശാബ്ദിക അർഥം ‘കയറിപ്പോയി’ എന്നാണെങ്കിലും ഇവിടെ മലയാളത്തിൽ ഭൂപ്രകൃതിസംബന്ധിയായ ഉയർച്ച വ്യക്തമല്ല; ദിശാസൂചകമായ ה־ സഹിതമുള്ള ഗോഷെനിലേക്കുള്ള യാത്ര സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: തന്റെ അപ്പനായ യിസ്രായേലിനെ കാണാൻ
  rationale: לִקְרַאת കൂടിക്കാഴ്ചയ്ക്കായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘യിസ്രായേൽ’ എന്ന പേര് നിലനിർത്തുകയും אָבִיו എന്ന ബന്ധം വ്യക്തമായി പറയുകയും ചെയ്തു.
- source_word: וַיֵּרָא אֵלָיו
  choice: അപ്പന്റെ മുമ്പിൽ പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ‘അവനു പ്രത്യക്ഷനായി/സ്വയം കാണിച്ചു’ എന്നർഥം അനുവദിക്കുന്നു. ആരെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത് എന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ലക്ഷ്യവ്യക്തിയെ ‘അപ്പന്റെ മുമ്പിൽ’ എന്നു വ്യക്തമാക്കി; വ്യത്യസ്ത ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: അപ്പന്റെ കഴുത്തിൽ വീണു കെട്ടിപ്പിടിച്ച്
  rationale: ശാബ്ദിക ദൃശ്യം ‘കഴുത്തിൽ വീഴുക’ എന്നതാണ്; പ്രസംഗസന്ദർഭത്തിലെ ആലിംഗനഭാവം മലയാളവായനക്കാർക്ക് വ്യക്തമാകാൻ ‘കെട്ടിപ്പിടിച്ച്’ ചേർത്തു.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: അപ്പന്റെ കഴുത്തിൽ വീണു കെട്ടിപ്പിടിച്ച് ഏറെനേരം കരഞ്ഞു
  rationale: ആവർത്തിച്ച עַל צַוָּארָיו ആലിംഗനത്തിന്റെ തുടർച്ചയെ സൂചിപ്പിക്കുന്നു. עוֹד ഇവിടെ കരച്ചിൽ നീണ്ടുനിന്നുവെന്ന ആശയം നൽകുന്നതിനാൽ ‘ഏറെനേരം’ എന്നു വിവർത്തനം ചെയ്തു; കൂടുതൽ ശാബ്ദിക സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അപ്പൻ’ കുടുംബസംഗമത്തിന്റെ അടുപ്പം സ്വാഭാവികമായി നൽകുന്നു; ‘യിസ്രായേൽ,’ ‘ഗോഷെൻ’ എന്നീ പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി. പ്രധാനപാഠത്തിൽ ആവശ്യമായ [a], [b] അടിക്കുറിപ്പുസൂചകങ്ങൾ ഉൾപ്പെടുത്തി.
