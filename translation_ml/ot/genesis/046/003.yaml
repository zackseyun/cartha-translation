id: GEN.46.3
reference: Genesis 46:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ ദൈവം, നിന്റെ പിതാവിന്റെ ദൈവം. ഈജിപ്തിലേക്കു ഇറങ്ങിച്ചെല്ലാൻ ഭയപ്പെടരുത്; അവിടെ ഞാൻ നിന്നെ ഒരു വലിയ ജനതയാക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: ദൈവം
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ പദം സംസാരിക്കുന്നവനെ ഊന്നിപ്പറഞ്ഞ് ദൈവമായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ഞാൻ ദൈവം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: നിന്റെ പിതാവിന്റെ ദൈവം
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘നിന്റെ പിതാവ്’ നിലനിർത്തുകയും പിതൃപരമ്പരയോടുള്ള ഉടമ്പടിബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אַל תִּירָא מֵרְדָה
  choice: ഇറങ്ങിച്ചെല്ലാൻ ഭയപ്പെടേണ്ടാ
  rationale: ירא എന്ന ഭയത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം מן ചേർന്ന ക്രിയാനാമം ഇവിടെ ‘ചെയ്യാൻ ഭയപ്പെടുക’ എന്ന അർഥം നൽകുന്നു. ‘ഇറങ്ങിച്ചെല്ലുക’ എന്നത് ഈജിപ്തിലേക്കുള്ള ദിശയെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചക പ്രത്യയം ഈജിപ്തിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘ഈജിപ്തിലേക്കു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: ഞാൻ നിന്നെ ഒരു വലിയ ജനതയാക്കും
  rationale: 'שׂים + לְ എന്ന ഘടന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു: യാക്കോബിനെ ഒരു വലിയ ജനതയായി രൂപപ്പെടുത്തുക. മലയാളത്തിൽ ഈ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.'
- source_word: שָׁם
  choice: അവിടെ
  rationale: വാഗ്ദാനം നിറവേറുന്ന സ്ഥലമായി ഈജിപ്തിനെ വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ സ്വയംപരിചയപ്പെടുത്തലിലെ പിതൃസൂചന
  choice: നിന്റെ പിതാവിന്റെ ദൈവം
  alternative: നിന്റെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: മൂലപാഠത്തിലെ ഏകവചനം നിലനിർത്തി യാക്കോബിന്റെ പിതാവുമായുള്ള തത്സമയ പിതൃപരവും ഉടമ്പടിപരവുമായ ബന്ധം സംരക്ഷിക്കുന്നു; വ്യാഖ്യാനപരമായി ബഹുവചനമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘ഇറങ്ങിച്ചെല്ലുക’ എന്ന ഭൂമിശാസ്ത്ര-ദിശാസൂചക ഭാഷ നിലനിർത്തി; അനാവശ്യമായി പഴമയോ സഭാവിഭാഗീയ പദപ്രയോഗങ്ങളോ ചേർത്തിട്ടില്ല.
