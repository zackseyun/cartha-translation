  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: ml
  text: നീ ഗോശെൻ ദേശത്ത് താമസിക്കും; നീ എന്റെ അടുത്തായിരിക്കും—നീയും നിന്റെ പുത്രന്മാരും നിന്റെ പുത്രന്മാരുടെ പുത്രന്മാരും നിന്റെ ആട്ടിൻപറ്റങ്ങളും കന്നുകാലിക്കൂട്ടങ്ങളും നിനക്കുള്ള സകലവും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: താമസിക്കും
  rationale: ישׁב ഇവിടെ ഒരു പ്രദേശത്ത് സ്ഥിരമായി പാർക്കുക എന്ന അർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ ‘താമസിക്കും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻ ദേശത്തു
  rationale: אֶרֶץ എന്ന ഭൂമിശാസ്ത്രപരമായ പദവും ഗോശെൻ എന്ന സ്ഥലനാമവും സംരക്ഷിക്കുന്നു.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: എന്റെ അടുത്തായിരിക്കും
  rationale: היה + קָרוֹב എന്ന ഘടന സൂചിപ്പിക്കുന്ന ഭൗതികസാമീപ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരും
  rationale: בנים എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: וּבְנֵי בָנֶיךָ
  choice: നിന്റെ പുത്രന്മാരുടെ പുത്രന്മാരും
  rationale: എബ്രായത്തിലെ ‘നിന്റെ പുത്രന്മാരുടെ പുത്രന്മാർ’ എന്ന കൃത്യമായ പുരുഷവംശപരാമർശം സംരക്ഷിക്കുന്നു; ‘കൊച്ചുമക്കൾ’ എന്ന പൊതുലിംഗ പദത്തിലേക്ക് വിപുലീകരിക്കുന്നില്ല.
- source_word: וְצֹאנְךָ
  choice: നിന്റെ ആട്ടിൻപറ്റങ്ങളും
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംക്ഷിപ്തവും പരിചിതവുമായ കൂട്ടനാമം ഉപയോഗിച്ചു.
- source_word: וּבְקָרְךָ
  choice: കന്നുകാലിക്കൂട്ടങ്ങളും
  rationale: בקר വലിയ വളർത്തുമൃഗങ്ങളായ കന്നുകാലികളെ സൂചിപ്പിക്കുന്നു; צֹאן എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: നിനക്കുള്ള സകലവും
  rationale: ഉടമസ്ഥതയിലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ എബ്രായ പ്രയോഗം dignified, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ പട്ടികയും പുരുഷവംശപരമായ കൃത്യതയും സൂക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
