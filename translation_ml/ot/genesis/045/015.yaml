  yaml_path: translation/ot/genesis/045/015.yaml
  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: ml
  text: അവൻ തന്റെ എല്ലാ സഹോദരന്മാരെയും ചുംബിച്ചു; അവരുടെമേൽ കരഞ്ഞു. അതിനുശേഷം അവന്റെ സഹോദരന്മാർ അവനോടു സംസാരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ സഹോദരന്മാർ അവനുമായി സംസാരിച്ചു.’ എബ്രായപ്രയോഗം ‘അവനോടു സംസാരിച്ചു’ എന്നും പരസ്പര സംഭാഷണത്തെ കൂടുതൽ വ്യക്തമാക്കുന്ന ‘അവനുമായി സംസാരിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַשֵּׁק לְכָל אֶחָיו
  choice: തന്റെ എല്ലാ സഹോദരന്മാരെയും ചുംബിച്ച്
  rationale: പീയേൽ രൂപത്തിലുള്ള נשׁק സ്നേഹത്തിന്റെയും അനുരഞ്ജനത്തിന്റെയും ചുംബനത്തെ സൂചിപ്പിക്കുന്നു. ആവർത്തനഭാവം അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ പ്രവർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: അവരെ ചേർത്തുപിടിച്ചുകൊണ്ട് കരഞ്ഞു
  rationale: ബכה എന്നത് കരയുക എന്നാണ്; עַל ഇവിടെ അടുത്ത ശാരീരിക സമ്പർക്കത്തിന്റെ ദൃശ്യം നൽകുന്നു. അക്ഷരാർഥമായ ‘അവരുടെമേൽ കരഞ്ഞു’ എന്നതിനെക്കാൾ ‘ചേർത്തുപിടിച്ചുകൊണ്ട്’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം കൈമാറുന്നു.
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ കാലക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: അവന്റെ സഹോദരന്മാർ അവനോടു സംസാരിച്ചു
  rationale: דבר + אֵת സംഭാഷണപരമായ ‘കൂടെ/ഒപ്പം സംസാരിക്കുക’ എന്ന അർഥം വഹിക്കാമെങ്കിലും, ‘അവനോടു സംസാരിച്ചു’ മലയാളത്തിൽ സ്വാഭാവികവും പരസ്പര സംഭാഷണത്തിനും ഏകപക്ഷീയ അഭിസംബോധനയ്ക്കും തുറന്നതുമായ പ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വികാരഭരിതമായ അനുരഞ്ജനരംഗം സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോൾ അവസാന ക്രിയയിലെ എബ്രായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
