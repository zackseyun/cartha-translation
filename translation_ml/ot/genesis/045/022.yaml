base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: ml
  text: അവരിൽ ഓരോരുത്തനും മാറ്റി ധരിക്കാനുള്ള ഒരു കൂട്ടം വസ്ത്രങ്ങൾ അവൻ നൽകി.[b] എന്നാൽ ബെന്യാമിന് വെള്ളിയുടെ മുന്നൂറ് കഷണങ്ങളും[a] മാറ്റി ധരിക്കാനുള്ള അഞ്ചു കൂട്ടം വസ്ത്രങ്ങളും നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘മുന്നൂറു വെള്ളി’ എന്നാണ്; പ്രത്യേക നാണയമോ തൂക്കഘടകമോ പറഞ്ഞിട്ടില്ല. അതിനാൽ ‘ശേക്കെൽ’ പോലുള്ള കൂടുതൽ നിർദ്ദിഷ്ടമായ പദം ഉപയോഗിച്ചിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവർക്കെല്ലാവർക്കും, ഓരോരുത്തനും, അവൻ നൽകി.’'
    reason: previous_rendering
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: അവരിൽ ഓരോരുത്തനും
  rationale: ഇരട്ട വിതരണപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ഒറ്റ പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു; എല്ലാവർക്കും വ്യക്തിപരമായി സമ്മാനം ലഭിച്ചതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: נָתַן
  choice: അവൻ നൽകി
  rationale: സമ്മാനം നൽകുന്ന ഈ ആഖ്യാനസന്ദർഭത്തിൽ ലളിതവും നേരിട്ടുമുള്ള തർജമ.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: മാറ്റി ധരിക്കാനുള്ള ... കൂട്ടം വസ്ത്രങ്ങൾ
  rationale: മാറ്റിയുടുക്കാവുന്ന വസ്ത്രസമുച്ചയം എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ആദ്യ ഭാഗത്തിലെ വിതരണാർഥവും അവസാന ഭാഗത്തിലെ അഞ്ചെന്ന എണ്ണവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וּלְבִנְיָמִן
  choice: എന്നാൽ ബെന്യാമിന്
  rationale: മറ്റുള്ളവർക്കു ലഭിച്ചതും ബെന്യാമിന് ലഭിച്ച പ്രത്യേക സമ്മാനവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: മുന്നൂറു വെള്ളിക്കാശ്
  rationale: മൂലപാഠം വെള്ളിയുടെ പ്രത്യേക തൂക്കമോ നാണയഘടകമോ പറയാത്തതിനാൽ ‘ശേക്കെൽ’ എന്നു നിർണ്ണയിക്കാതെ പൊതുവായ ധനപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: മാറ്റി ധരിക്കാനുള്ള അഞ്ചു കൂട്ടം വസ്ത്രങ്ങൾ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ വസ്ത്രപ്രയോഗവുമായി ഏകീകരണം പാലിച്ചുകൊണ്ട് അഞ്ചെന്ന സംഖ്യ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ വിതരണാർഥം സ്വാഭാവികമാക്കി; വെള്ളിയുടെ അളവുഘടകം അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
