    rationale: '''ഇനിയും അഞ്ചുവർഷം ... ഉണ്ടാകുകയില്ല'' is understandable, but ''അഞ്ചു വർഷങ്ങൾ ശേഷിക്കുന്നു'' directly expresses that five years remain.'
