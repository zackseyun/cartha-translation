source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: ml
  text: കാരണം, ഈ രണ്ടു വർഷമായി ദേശത്തിന്റെ നടുവിൽ ക്ഷാമമുണ്ട്[a]; ഇനിയും ഉഴവും കൊയ്ത്തും ഇല്ലാത്ത അഞ്ചു വർഷങ്ങൾ ശേഷിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്ത്’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദേശത്തിന്റെ നടുവിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിലം ഉഴുകയോ വിള കൊയ്യുകയോ ഇല്ലാത്ത അഞ്ചു വർഷങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ വിശദീകരണം തുടരുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ കാലസൂചനയോടു ചേർത്ത് അവതരിപ്പിച്ചു; കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: זֶה שְׁנָתַיִם
  choice: രണ്ടുവർഷമായി
  rationale: ഇതിനകം കഴിഞ്ഞുകൊണ്ടിരിക്കുന്ന രണ്ടുവർഷത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ വരുന്നു.
- source_word: הָרָעָב
  choice: ക്ഷാമം
  rationale: വിവരണത്തിൽ ഇതിനകം പരാമർശിക്കപ്പെട്ട പ്രത്യേക ക്ഷാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ദേശത്തിന്റെ നടുവിൽ
  rationale: בְּקֶרֶב എന്നതിന്റെ ‘നടുവിൽ/മധ്യേ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; ഇവിടെ הָאָרֶץ പ്രാദേശികമായ ‘ദേശം’ ആണ്.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: ഇനിയും അഞ്ചുവർഷം
  rationale: ഇപ്പോഴത്തെ സമയബിന്ദുവിൽനിന്ന് അഞ്ചുവർഷം ശേഷിക്കുന്നുവെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר אֵין
  choice: ഉണ്ടാകുകയില്ല
  rationale: വരാനിരിക്കുന്ന അഞ്ചുവർഷത്തെ വിവരിക്കുന്നതിനാൽ മലയാളത്തിൽ ഭാവികാലം സ്വാഭാവികമാണ്.
- source_word: חָרִישׁ
  choice: ഉഴവ്
  rationale: നിലം ഉഴുന്ന പ്രവൃത്തിയെയോ കൃഷിയൊരുക്കത്തെയോ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പദം.
- source_word: קָצִיר
  choice: കൊയ്ത്ത്
  rationale: ധാന്യം കൊയ്യുന്നതിനെയും വിളവെടുപ്പിനെയും സൂചിപ്പിക്കുന്ന, ഉഴവിനോടു സ്വാഭാവികമായി ചേരുന്ന പദം.
