  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ കൃഷിപദങ്ങളുടെ സമാന്തരതയും ‘ദേശത്തിന്റെ നടുവിൽ’ എന്ന അക്ഷരാർഥ രൂപവും നിലനിർത്തി.
