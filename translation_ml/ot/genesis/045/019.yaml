id: GEN.45.19
reference: Genesis 45:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: ml
  text: 'നിനക്കു കൽപ്പന ലഭിച്ചിരിക്കുന്നു: “ഇതു ചെയ്യുവിൻ: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കും ഭാര്യമാർക്കും വേണ്ടി ഈജിപ്തുദേശത്തുനിന്ന് വണ്ടികൾ എടുത്തുകൊൾവിൻ; നിങ്ങളുടെ പിതാവിനെ കയറ്റി വരുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: നിനക്കു കല്പന ലഭിച്ചിരിക്കുന്നു
  rationale: പുഅൽ നിഷ്ക്രിയരൂപം കല്പന ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ഫറവോൻ യോസേഫിനോടു കല്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: זֹאת עֲשׂוּ
  choice: ഇതു ചെയ്യുക
  rationale: എബ്രായ നിർദേശസൂത്രത്തിന്റെ സംക്ഷിപ്തതയും ആജ്ഞാശക്തിയും നിലനിർത്തുന്നു.
- source_word: קְחוּ לָכֶם
  choice: എടുത്തുകൊൾവിൻ
  rationale: לָכֶם എന്ന ഗുണഭോക്തൃ/പ്രതിഫല സൂക്ഷ്മത മലയാളത്തിലെ ‘കൊൾവിൻ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന്
  rationale: אֶרֶץ എന്ന പദം ഒഴിവാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: עֲגָלוֹת
  choice: വണ്ടികൾ
  rationale: ആളുകളെയും സാധനങ്ങളെയും കൊണ്ടുപോകുന്ന വാഹനങ്ങൾ എന്ന വിശാലവും സന്ദർഭോചിതവുമായ അർഥം നൽകുന്നു.
- source_word: לְטַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കു വേണ്ടി
  rationale: טַף ഇവിടെ ചെറിയ കുട്ടികളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ‘കുഞ്ഞുങ്ങൾ’ ആ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: וְלִנְשֵׁיכֶם
  choice: ഭാര്യമാർക്കും വേണ്ടി
  rationale: കുടുംബയാത്രയുടെ സന്ദർഭത്തിൽ נָשִׁים എന്നതിന്റെ ബന്ധപരമായ അർഥം ‘ഭാര്യമാർ’ ആണ്.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: നിങ്ങളുടെ അപ്പനെ കയറ്റിക്കൊണ്ടുവരുവിൻ
  rationale: נשא എന്ന ക്രിയയുടെ ‘ചുമക്കുക/വഹിക്കുക’ എന്ന ഭാവം യാത്രാവാഹനത്തിന്റെ സന്ദർഭത്തിൽ ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבָאתֶם
  choice: കൊണ്ടുവരുവിൻ
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ‘വരുക’ എന്നാണ്; മലയാളത്തിൽ മുൻക്രിയയോടു ചേർത്ത ‘കൊണ്ടുവരുവിൻ’ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, എന്നാൽ ‘തിരികെ’ എന്ന വ്യക്തമല്ലാത്ത ഘടകം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഏകവചനമായ ‘നിനക്കു’ യോസേഫിനോടുള്ള കല്പനയും ബഹുവചന ക്രിയകൾ സഹോദരന്മാരോടുള്ള നിർദേശവും വേർതിരിച്ചു നിലനിർത്തുന്നു. മൂലത്തിലെ നേരിട്ടുള്ള വാക്കിന്റെ ഘടന സംരക്ഷിച്ചിരിക്കുന്നു.
