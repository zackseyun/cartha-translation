  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֤/נִי אֱלֹהִים֙ לִ/פְנֵי/כֶ֔ם לָ/שׂ֥וּם לָ/כֶ֛ם שְׁאֵרִ֖ית בָּ/אָ֑רֶץ וּ/לְ/הַחֲי֣וֹת לָ/כֶ֔ם לִ/פְלֵיטָ֖ה גְּדֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: ml
  text: ദൈവം നിങ്ങളെക്കാൾ മുമ്പേ എന്നെ അയച്ചത് ദേശത്ത് നിങ്ങൾക്കായി ഒരു ശേഷിപ്പിനെ നിലനിർത്താനും[a] മഹത്തായ ഒരു രക്ഷയ്ക്കായി നിങ്ങളെ ജീവനോടെ കാക്കാനും[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശത്ത് നിങ്ങൾക്കായി അതിജീവിച്ചവരെയോ പിൻതലമുറയെയോ നിലനിർത്താനും.” ഹീബ്രു പദത്തിന് ‘ശേഷിപ്പ്,’ ‘അതിജീവിച്ചവർ,’ ‘പിൻതലമുറ’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വലിയൊരു രക്ഷപ്പെടലിനായി” അല്ലെങ്കിൽ “അനേകം അതിജീവിച്ചവർ നിലനിൽക്കേണ്ടതിനായി.” ഹീബ്രു പ്രയോഗം രക്ഷപ്പെടൽ എന്ന സംഭവത്തെയോ അതിന്റെ ഫലമായ അതിജീവിച്ചവരെയോ ഊന്നാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: എന്നെ അയച്ചത്
  rationale: വയ്യക്ഷോൽ രൂപം കഴിഞ്ഞകാല ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ഈ ഉദ്ദേശ്യവാക്യഘടന സ്വാഭാവികമാണ്.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങളെക്കാൾ മുമ്പേ
  rationale: യോസേഫ് സഹോദരന്മാർക്കുമുമ്പ് ഈജിപ്തിലെത്തിയ കാലപരമായ മുൻഗാമിത്വം വ്യക്തമാക്കുന്നു.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: നിങ്ങൾക്കായി ഒരു ശേഷിപ്പിനെ നിലനിർത്താൻ
  rationale: שׂים എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും, ശേഷിക്കുന്നവരെ സംരക്ഷിക്കുന്ന സന്ദർഭാർഥവും ‘നിലനിർത്തുക’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: שְׁאֵרִית
  choice: ശേഷിപ്പ്
  rationale: അവശേഷിക്കുന്നവർ, അതിജീവിച്ചവർ, പിൻതലമുറ എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന ഹീബ്രു പദത്തിന്റെ വിശാലതയും ബൈബിളിലെ പദപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ഇവിടെ אֶרֶץ എന്നത് വിശാലമായ ‘ഭൂമി’യെക്കാൾ സന്ദർഭത്തിലെ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: നിങ്ങളെ ജീവനോടെ കാക്കാൻ
  rationale: חיה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ജീവൻ നിലനിർത്തുക എന്ന കാരണാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: മഹത്തായ ഒരു രക്ഷയിലൂടെ
  rationale: פְּלֵיטָה രക്ഷപ്പെടൽ, രക്ഷ, അതിജീവിച്ചവർ എന്നിവ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ വലിയ രക്ഷാഫലം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ പദത്തിലെ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: שְׁאֵרִית എന്നത് ‘ശേഷിപ്പ്’ എന്നോ ‘അതിജീവിച്ചവർ/പിൻതലമുറ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: ശേഷിപ്പ്
  alternative: അതിജീവിച്ചവർ; പിൻതലമുറ
  rationale: ‘ശേഷിപ്പ്’ മൂലപദത്തിന്റെ അടിസ്ഥാനാർഥവും ബൈബിളിലുടനീളമുള്ള പദബന്ധവും നിലനിർത്തുന്നു; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: לִפְלֵיטָה גְּדֹלָה രക്ഷാപ്രവൃത്തിയെയോ അതിന്റെ ഫലമായ അനേകം അതിജീവിച്ചവരെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മഹത്തായ ഒരു രക്ഷയിലൂടെ
  alternative: വലിയൊരു രക്ഷപ്പെടലിനായി; അനേകം അതിജീവിച്ചവരായി
  rationale: സമാന്തരമായ ‘ജീവനോടെ കാക്കാൻ’ എന്ന പ്രയോഗത്തിൽ വലിയ രക്ഷാഫലം യോജിക്കുന്നു; വ്യക്തികളെയാണോ സംഭവത്തെയാണോ ഊന്നുന്നത് എന്ന യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശേഷിപ്പ്’ എന്ന മുഖ്യപദം മൂലഭാഷയിലെ പദപ്രതിധ്വനി കാക്കുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
