  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: ml
  text: 'ഇതാ, നിങ്ങളുടെ കണ്ണുകളും എന്റെ സഹോദരനായ ബെന്യാമീന്റെ കണ്ണുകളും കാണുന്നുവല്ലോ: നിങ്ങളോടു സംസാരിക്കുന്നത് എന്റെ വായാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇതാ, നിങ്ങളുടെ കണ്ണുകളും എന്റെ സഹോദരനായ ബെന്യാമീന്റെ കണ്ണുകളും കാണുന്നു—നിങ്ങളോടു സംസാരിക്കുന്നത് എന്റെ വായാണെന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും നേരിട്ടുള്ള ദൃശ്യസ്ഥിരീകരണത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: നിങ്ങളുടെ കണ്ണുകൾ കാണുന്നുവല്ലോ
  rationale: ‘കണ്ണുകൾ’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു; വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള ഗ്രഹണവും സന്ദർഭത്തിലെ ഉറപ്പുനൽകുന്ന ഭാവവും ‘കാണുന്നുവല്ലോ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: എന്റെ സഹോദരനായ ബെന്യാമീന്റെയും കണ്ണുകൾ
  rationale: ‘നിങ്ങളുടെ കണ്ണുകൾ’ എന്നതിനോടുള്ള സമാന്തരഘടനയും ബെന്യാമീനെ യോസേഫിന്റെ സഹോദരനായി തിരിച്ചറിയുന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: '—എന്ന് / :'
  rationale: കണ്ണുകൾ സ്ഥിരീകരിക്കുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി മനസ്സിലാക്കി; മലയാളത്തിൽ ഇരട്ടപ്പുള്ളിക്കുശേഷമുള്ള വാക്യഘടന അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פִי
  choice: എന്റെ സ്വന്തം വായ്തന്നെ
  rationale: ഇടനിലക്കാരനിലൂടെയല്ല, യോസേഫ് നേരിട്ട് സംസാരിക്കുന്നു എന്ന ഊന്നൽ നിലനിർത്താൻ ‘വായ്’ എന്ന മൂർത്തമായ ഹീബ്രു പ്രയോഗം സംരക്ഷിച്ചു; ‘സ്വന്തം…തന്നെ’ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: നിങ്ങളോടു സംസാരിക്കുന്നത്
  rationale: നിർദ്ദിഷ്ട കർത്തൃവാചക പങ്കാളിയെ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ participle-ന്റെ വർത്തമാനവും നേരിട്ടുള്ള പ്രവർത്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
