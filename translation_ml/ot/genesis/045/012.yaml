translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കണ്ണുകൾ’ എന്നും ‘വായ്’ എന്നും വരുന്ന ഹീബ്രു ശരീരാവയവപ്രയോഗങ്ങൾ ദൃശ്യസ്ഥിരീകരണവും നേരിട്ടുള്ള സംസാരവും ഊന്നിപ്പറയുന്നതിനാൽ നിലനിർത്തി. പ്രധാനവാചകത്തിലെ [a] അടയാളം അനുബന്ധ പദാനുപദ വിവർത്തനക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
