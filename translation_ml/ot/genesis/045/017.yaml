id: GEN.45.17
reference: Genesis 45:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אֱמֹ֥ר אֶל אַחֶ֖י/ךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת בְּעִ֣ירְ/כֶ֔ם וּ/לְכוּ בֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “നിന്റെ സഹോദരന്മാരോടു പറയുക: ‘ഇങ്ങനെ ചെയ്യുക: നിങ്ങളുടെ മൃഗങ്ങളിൽ ചുമടുകയറ്റി പുറപ്പെട്ട് കനാൻദേശത്ത് എത്തുക.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ … പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ അടുത്ത സംഭവത്തിലേക്കു നയിക്കുന്നു; ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരോടു പറയുക
  rationale: പറയാനുള്ള നേരിട്ടുള്ള കല്പനയെ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: זֹאת עֲשׂוּ
  choice: ഇങ്ങനെ ചെയ്യുക
  rationale: തുടർന്ന് നൽകുന്ന നിർദേശങ്ങളെ സൂചിപ്പിക്കുന്ന demonstrative-ന്റെ മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: טַעֲנוּ אֶת־בְּעִירְכֶם
  choice: നിങ്ങളുടെ മൃഗങ്ങളിൽ ചുമടുകയറ്റി
  rationale: בְּעִיר ഇവിടെ യാത്രയ്ക്കായി ചുമടുകയറ്റുന്ന വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘മൃഗങ്ങൾ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു, ക്രിയ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וּלְכוּ בֹאוּ
  choice: പുറപ്പെട്ട് … എത്തുക
  rationale: ‘പോകുക/പുറപ്പെടുക’, ‘വരുക/എത്തുക’ എന്നീ തുടർച്ചയായ രണ്ട് കല്പനകളെയും അസ്വാഭാവികമായ പദാനുപദരൂപമില്ലാതെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אַרְצָה כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ദിശാസൂചകമായ രൂപവും ‘ദേശം’ എന്ന നാമവും ലക്ഷ്യസ്ഥാനമായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണിക്കുള്ളിലെ കല്പനകളുടെ ബഹുവചനഭാവം സന്ദർഭവും ‘നിങ്ങളുടെ’ എന്ന രൂപവും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ക്രിയകൾ ആദര/ബഹുവചന കല്പനയായി പ്രത്യേകം ഭാരപ്പെടുത്താതെ നൽകിയിരിക്കുന്നു.
