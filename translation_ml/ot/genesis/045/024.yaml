source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח אֶת אֶחָ֖י/ו וַ/יֵּלֵ֑כוּ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַֽל תִּרְגְּז֖וּ בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ സഹോദരന്മാരെ അയച്ചുവിട്ടു; അവർ പുറപ്പെട്ടു. അവൻ അവരോടു, “വഴിയിൽ കലഹിക്കരുത്[a],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്ഷോഭിക്കരുത്,” “കോപിക്കരുത്,” അല്ലെങ്കിൽ “ഭയപ്പെടരുത്.” എബ്രായ ക്രിയയ്ക്ക് പലതരത്തിലുള്ള വൈകാരിക അസ്വസ്ഥതകളെ സൂചിപ്പിക്കാനാകും. യോസേഫിന്റെ വെളിപ്പെടുത്തലിനുശേഷം സഹോദരന്മാർ ഒരുമിച്ചു യാത്രചെയ്യുന്ന തൊട്ടടുത്ത സന്ദർഭത്തിൽ “കലഹിക്കരുത്” യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: യാത്രയാക്കി
  rationale: പീയേൽ രൂപം അവരെ തന്റെ സന്നിധിയിൽനിന്ന് പോകാൻ അയച്ചുവെന്ന ആശയം നൽകുന്നു; ‘യാത്രയാക്കി’ ആ സന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת־אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പദം ആഖ്യാനസന്ദർഭത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיֵּלֵכוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: הלך എന്നതിന്റെ വിശാലമായ അർഥം ‘പോകുക’ എന്നാണെങ്കിലും, യാത്രയാക്കിയതിനു പിന്നാലെയുള്ള പുറപ്പാട് ഇവിടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവൻ അവരോട് ... എന്നു പറഞ്ഞു
  rationale: സാധാരണ എബ്രായ സംഭാഷണസൂത്രം സുതാര്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַל
  choice: അരുത്
  rationale: നിഷേധാത്മക ആജ്ഞയുടെ ശക്തി മലയാളത്തിലെ സ്വാഭാവിക വിലക്കുരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: תִּרְגְּזוּ
  choice: കലഹിക്കരുത്
  rationale: רגז വികാരക്ഷോഭം, കോപം, ഭയം, വിറയൽ എന്നിവ സൂചിപ്പിക്കാം. യോസേഫിന്റെ വെളിപ്പെടുത്തലിനുശേഷം സഹോദരന്മാർ ഒരുമിച്ച് മടങ്ങുന്ന ഉടൻസന്ദർഭത്തിൽ പരസ്പരം കുറ്റപ്പെടുത്തി കലഹിക്കരുതെന്ന അർഥം യോജിക്കുന്നു; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּדָּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: കനാനിലേക്കുള്ള മടക്കയാത്രയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
