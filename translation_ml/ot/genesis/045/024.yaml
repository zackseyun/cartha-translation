  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കലഹിക്കരുത്’ സന്ദർഭോചിതമായ മുഖ്യവായനയാണ്; മൂലപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
