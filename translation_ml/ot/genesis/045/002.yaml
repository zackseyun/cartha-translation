  source_fidelity: The Malayalam accurately conveys the Hebrew idiom וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי as audible/loud weeping. It preserves both clauses of hearing, correctly takes מִצְרַיִם with the plural verb as the Egyptians, and renders בֵּית פַּרְעֹה as people belonging to Pharaoh’s household rather than merely a building.
