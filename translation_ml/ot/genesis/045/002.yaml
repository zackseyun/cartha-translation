id: GEN.45.2
reference: Genesis 45:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֶת קֹל֖/וֹ בִּ/בְכִ֑י וַ/יִּשְׁמְע֣וּ מִצְרַ֔יִם וַ/יִּשְׁמַ֖ע בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: ml
  text: അവൻ ഉറക്കെ കരഞ്ഞു[a]. ഈജിപ്തുകാർ അതു കേട്ടു[b]; ഫറവോന്റെ ഭവനത്തിലുള്ളവരും[c] കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ കരച്ചിലിൽ തന്റെ ശബ്ദം നൽകി’; അവൻ ഉച്ചത്തിൽ കരഞ്ഞു എന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈജിപ്ത് കേട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ബഹുവചനക്രിയ ‘ഈജിപ്തുകാർ’ എന്ന കൂട്ടായ വ്യക്തിസൂചനയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഫറവോന്റെ ഭവനം’ എന്നോ, വിപുലമായ അർഥത്തിൽ ‘ഫറവോന്റെ രാജസദസ്സ്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: അവൻ ഉറക്കെ കരഞ്ഞു
  rationale: അക്ഷരാർഥത്തിൽ ‘കരച്ചിലിൽ തന്റെ ശബ്ദം നൽകി’ എന്നായിരുന്നാലും, ഇത് ഉച്ചത്തിൽ കേൾക്കത്തക്കവിധം കരഞ്ഞു എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉറക്കെ കരഞ്ഞു’ ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁמְעוּ
  choice: കേട്ടു
  rationale: ഇവിടെ שׁמע അനുസരിക്കുക എന്നോ ശ്രദ്ധിച്ചു കേൾക്കുക എന്നോ അല്ല, ശബ്ദം കേൾക്കുക എന്ന ലളിതമായ ഇന്ദ്രിയഗ്രഹണമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: പദത്തിന് ‘ഈജിപ്ത്’ എന്നും അർഥമാകാമെങ്കിലും, അതിനോടു ചേർന്ന ക്രിയ ബഹുവചനത്തിലാണ്. അതിനാൽ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ‘ഈജിപ്തുകാർ’ സന്ദർഭത്തിനും വ്യാകരണത്തിനും യോജിക്കുന്നു.
- source_word: בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിലുള്ളവർ
  rationale: എബ്രായത്തിലെ ‘വീട്/ഭവനം’ രാജകുടുംബത്തെയോ രാജസദസ്സിനെയോ രാജകീയ സ്ഥാപനത്തിലെ ആളുകളെയോ സൂചിപ്പിക്കാം. ‘ഭവനത്തിലുള്ളവർ’ ആളുകളെയാണ് ശബ്ദം കേട്ടവരായി വ്യക്തമാക്കുന്നത്; ‘കൊട്ടാരം’ എന്നു പറഞ്ഞാൽ സ്ഥലത്തിന് അനാവശ്യമായ ഊന്നൽ വരും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിച്ച ‘കേട്ടു’ നിലനിർത്തി; അർഥവ്യക്തതയ്ക്കായി ആദ്യത്തേതിനൊപ്പം ‘അതു’ ചേർത്തു. ‘കുടുംബം’ എന്നത് രക്തബന്ധുക്കളിലേക്ക് അർഥം ചുരുക്കാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
