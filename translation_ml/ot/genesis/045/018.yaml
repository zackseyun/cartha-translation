  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ ആജ്ഞാക്രമവും വാഗ്ദാനവും വിശ്വസ്തമായി കൈമാറിയിട്ടുണ്ട്: പിതാവിനെയും വീട്ടുകുടുംബങ്ങളെയും കൂട്ടി വരാൻ പറയുന്നതും, ഈജിപ്തുദേശത്തിലെ ഏറ്റവും നല്ലത് നൽകുമെന്ന ഉറപ്പും, ദേശത്തിന്റെ സമൃദ്ധമായ വിഭവങ്ങൾ ലഭിക്കുമെന്ന പ്രയോഗാർഥവും നിലനിൽക്കുന്നു. ‘കുടുംബങ്ങൾ’ ഇവിടെ בָּתֵּיכֶם എന്ന സന്ദർഭാനുസൃതമായ ‘households’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. ‘അനുഭവിക്കും’ ഹീബ്രു പ്രയോഗമായ ‘ദേശത്തിന്റെ മേദസ്സ് ഭക്ഷിക്കും’ എന്നതിന്റെ അർഥം ഉചിതമായി വ്യക്തമാക്കുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.'
