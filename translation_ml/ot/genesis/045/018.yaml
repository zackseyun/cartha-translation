  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: ml
  text: നിങ്ങളുടെ അപ്പനെയും നിങ്ങളുടെ കുടുംബങ്ങളെയും കൂട്ടിക്കൊണ്ട് എന്റെ അടുക്കൽ വരുവിൻ. ഞാൻ നിങ്ങൾക്കു ഈജിപ്തുദേശത്തിലെ ഏറ്റവും നല്ലതു തരും; നിങ്ങൾ ദേശത്തിന്റെ സമൃദ്ധി അനുഭവിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്റെ മേദസ്സ് ഭക്ഷിക്കും’; ഈ ഹീബ്രു പ്രയോഗം ദേശത്തിലെ ഏറ്റവും മികച്ചതും സമൃദ്ധവുമായ വിഭവങ്ങൾ അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אֶת אֲבִיכֶם וְאֶת בָּתֵּיכֶם
  choice: നിങ്ങളുടെ അപ്പനെയും നിങ്ങളുടെ കുടുംബങ്ങളെയും കൂട്ടിക്കൊണ്ട്
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും യാത്രാസന്ദർഭവും ചേർത്ത് ‘കൂട്ടിക്കൊണ്ട്’ എന്നു നൽകി. בָּתִּים ഇവിടെ കെട്ടിടങ്ങളെയല്ല, കുടുംബാംഗങ്ങളും ആശ്രിതരും ഉൾപ്പെടുന്ന കുടുംബഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבֹאוּ אֵלָי
  choice: എന്റെ അടുക്കൽ വരുവിൻ
  rationale: בוא എന്ന ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘മടങ്ങിവരുക’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וְאֶתְּנָה לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു ... തരും
  rationale: ആജ്ഞകൾക്കു പിന്നാലെയുള്ള ഈ രൂപം സന്ദർഭത്തിൽ വാഗ്ദാനമോ ഉറപ്പോ അറിയിക്കുന്നു.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ ഏറ്റവും നല്ലതു
  rationale: טוּב ഇവിടെ ദേശത്തിലെ വിശിഷ്ടമായ ഭാഗവും വിഭവസമൃദ്ധിയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְאִכְלוּ אֶת חֵלֶב הָאָרֶץ
  choice: നിങ്ങൾ ദേശത്തിന്റെ സമൃദ്ധി അനുഭവിക്കും
  rationale: חֵלֶב הָאָרֶץ എന്നത് അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്റെ മേദസ്സ്’ എന്നാണെങ്കിലും, ദേശത്തിലെ ഏറ്റവും സമൃദ്ധവും മികച്ചതുമായ വിഭവങ്ങൾ അനുഭവിക്കുക എന്ന ഹീബ്രു പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
