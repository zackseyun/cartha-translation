translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വരുവിൻ’ എന്ന ആദരപൂർവ ബഹുവചന ആജ്ഞ ബൈബിൾ ഗദ്യത്തിന്റെ മാന്യത നിലനിർത്തുന്നു; അപരിചിതമായ ‘ദേശത്തിന്റെ മേദസ്സ്’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അതിന്റെ പ്രയോഗാർഥം നൽകി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
