    issue: The English audit-trail footnote anchors appear reversed.
    rationale: In the supplied English text, [a] follows “brothers,” but its note concerns “were dismayed”; [b] follows “answer him,” but its note concerns the Hebrew expression for “at his presence.” The Malayalam draft has no footnotes or anchors, so this does not create a defect in the Malayalam verse itself.
  revised_text: 'അപ്പോൾ യോസേഫ് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “ഞാൻ യോസേഫാണ്. എന്റെ അപ്പൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ?” എന്നാൽ അവന്റെ സന്നിധിയിൽ അവർ പരിഭ്രാന്തരായതിനാൽ അവനോടു മറുപടി പറയാൻ സഹോദരന്മാർക്കു കഴിഞ്ഞില്ല.'
