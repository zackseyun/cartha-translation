id: GEN.45.3
reference: Genesis 45:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “ഞാൻ യോസേഫാണ്. എന്റെ അപ്പൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ?” എന്നാൽ അവന്റെ സന്നിധിയിൽ അവർ പരിഭ്രാന്തരായതിനാൽ അവനോടു മറുപടി പറയാൻ സഹോദരന്മാർക്കു കഴിഞ്ഞില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടു
  rationale: യോസേഫിന്റെ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷകർമരൂപം.
- source_word: אֲנִי יוֹסֵף
  choice: ഞാൻ യോസേഫാണ്
  rationale: ഊന്നലോടെയുള്ള നേരിട്ടുള്ള സ്വയംവെളിപ്പെടുത്തൽ നിലനിർത്തുന്നു.
- source_word: הַעוֹד אָבִי חָי
  choice: എന്റെ അപ്പൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ?
  rationale: നില തുടരുന്നുണ്ടോ എന്ന ചോദ്യം ‘ഇപ്പോഴും’ കൊണ്ട് വ്യക്തമാക്കുന്നു; ‘അപ്പൻ’ കുടുംബസംഭാഷണത്തിന് സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: എന്നാൽ ... അവനോടു മറുപടി പറയാൻ ... കഴിഞ്ഞില്ല
  rationale: വെളിപ്പെടുത്തലിനും സഹോദരന്മാരുടെ പ്രതികരണത്തിനുമിടയിലെ വൈരുധ്യവും അവരുടെ അശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: נִבְהֲלוּ
  choice: പരിഭ്രാന്തരായതിനാൽ
  rationale: നിഫാൽ രൂപം പ്രകടിപ്പിക്കുന്ന പെട്ടെന്നുള്ള ഭയം, ഞെട്ടൽ, അസ്വസ്ഥത എന്നിവയെ അതിരുകടക്കാതെ ഉൾക്കൊള്ളുന്നു.
- source_word: מִפָּנָיו
  choice: അവന്റെ സന്നിധിയിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവന്റെ മുഖത്തിനു മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സാന്നിധ്യസൂചന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. വാക്യത്തിലെ കാരണബന്ധവും യോസേഫിന്റെ സാന്നിധ്യത്തിൽ സഹോദരന്മാർ അനുഭവിച്ച പരിഭ്രാന്തിയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
