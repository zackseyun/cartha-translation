id: GEN.45.5
reference: Genesis 45:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: ml
  text: ഇപ്പോൾ, നിങ്ങൾ എന്നെ ഇവിടെ വിറ്റതിനെച്ചൊല്ലി ദുഃഖിക്കുകയോ[a] നിങ്ങളോടുതന്നെ കോപിക്കുകയോ[b] അരുത്. ജീവൻ നിലനിർത്താൻ[c] ദൈവം എന്നെ നിങ്ങൾക്കു മുമ്പേ അയച്ചതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മനോവിഷമപ്പെടുകയോ’.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ കണ്ണുകളിൽ കത്തരുത്’; കോപമോ അതൃപ്തിയോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ജീവന്റെ സംരക്ഷണത്തിനായി’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: യോസേഫിന്റെ ഇപ്പോഴത്തെ അഭ്യർഥനയിലേക്കുള്ള സംഭാഷണപരമായ മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു; ഹീബ്രായയിലെ ബന്ധകശക്തി പ്രസംഗസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אַל תֵּעָצְבוּ
  choice: ദുഃഖിക്കുകയോ അരുത്
  rationale: עצב എന്ന ക്രിയ ഇവിടെ മാനസികവേദനയെയോ ദുഃഖത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദുഃഖിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: നിങ്ങളോടുതന്നെ കോപിക്കുകയോ അരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ കണ്ണുകളിൽ കത്തരുത്’ എന്ന ആശയമുള്ള ഹീബ്രായ പ്രയോഗം കോപമോ അതൃപ്തിയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സഹോദരന്മാരുടെ സ്വയംകുറ്റപ്പെടുത്തലാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ഈ മലയാളരൂപം പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: നിങ്ങൾ എന്നെ ഇവിടെ വിറ്റതിനെച്ചൊല്ലി
  rationale: സഹോദരന്മാരുടെ ദുഃഖത്തിന്റെയും കോപത്തിന്റെയും കാരണം വ്യക്തമാക്കുന്നു; הֵנָּה എന്നതിലെ ‘ഇവിടേക്ക്/ഇവിടെ’ എന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
- source_word: לְמִחְיָה
  choice: ജീവൻ നിലനിർത്താൻ
  rationale: מחיה ജീവസംരക്ഷണമോ അതിജീവനമോ സൂചിപ്പിക്കുന്നു. ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതോടൊപ്പം ജീവൻ കാത്തുസൂക്ഷിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: ദൈവം എന്നെ അയച്ചതാണ്
  rationale: ഹീബ്രായ പൂർണ്ണക്രിയയെ കഴിഞ്ഞ സംഭവമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ദൈവത്തിന്റെ സജീവമായ പരിപാലനപ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങൾക്കു മുമ്പേ
  rationale: സഹോദരന്മാർ എത്തുന്നതിനുമുമ്പ് യോസേഫ് അയക്കപ്പെട്ടു എന്ന കാലപരവും സ്ഥാനപരവുമായ മുൻഗാമിത്വം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവപരിപാലനവും മനുഷ്യരുടെ പ്രവർത്തനവും
  choice: ‘നിങ്ങൾ എന്നെ ഇവിടെ വിറ്റു’ എന്ന സഹോദരന്മാരുടെ ഉത്തരവാദിത്വവും ‘ദൈവം എന്നെ അയച്ചു’ എന്ന ദൈവിക ഉദ്ദേശ്യവും ഒരുപോലെ നിലനിർത്തി.
  alternative: സഹോദരന്മാരുടെ പ്രവൃത്തിയെ ‘എന്നെ അയച്ചുകളഞ്ഞു’ എന്നു മയപ്പെടുത്തുകയോ ദൈവത്തിന്റെ പ്രവൃത്തിയെ വെറും അനുവദിക്കലായി അവതരിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: ഹീബ്രായ പാഠം മനുഷ്യരുടെ കുറ്റകരമായ പ്രവൃത്തിയെയും ദൈവത്തിന്റെ ജീവസംരക്ഷകമായ ഉദ്ദേശ്യത്തെയും നേരിട്ട് ചേർത്തുവയ്ക്കുന്നു. പാഠത്തിലെ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സഹോദരന്മാരുടെ സ്വയംകുറ്റപ്പെടുത്തലും ദൈവത്തിന്റെ പരിപാലനപരമായ പ്രവർത്തനവും ലളിതമായി വായിക്കാവുന്ന വാക്യഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു.
