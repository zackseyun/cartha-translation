revisions:
- from: “യോസേഫിന്റെ സഹോദരന്മാർ വന്നിരിക്കുന്നു” എന്ന വാർത്ത ഫറവോന്റെ ഭവനത്തിൽ അറിഞ്ഞു. അതു ഫറവോനും അവന്റെ ദാസന്മാർക്കും പ്രസാദകരമായി.
  to: “യോസേഫിന്റെ സഹോദരന്മാർ വന്നിരിക്കുന്നു” എന്ന വാർത്ത ഫറവോന്റെ ഭവനത്തിൽ കേൾക്കപ്പെട്ടു; അത് ഫറവോനും അവന്റെ ദാസന്മാർക്കും ഇഷ്ടമായി.
  rationale: The revision corrects the Malayalam subject-verb relation by rendering the reported news as “was heard,” corresponding to the Hebrew passive form. It also replaces an awkward expression with a natural Malayalam equivalent for the Hebrew idiom that the news was pleasing to Pharaoh and his servants. The quoted report and the completed-yet-present sense of “വന്നിരിക്കുന്നു” are retained.
