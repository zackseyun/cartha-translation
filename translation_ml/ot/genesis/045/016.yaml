id: GEN.45.16
reference: Genesis 45:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/קֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵ/אמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַ/יִּיטַב֙ בְּ/עֵינֵ֣י פַרְעֹ֔ה וּ/בְ/עֵינֵ֖י עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: ml
  text: “യോസേഫിന്റെ സഹോദരന്മാർ വന്നിരിക്കുന്നു” എന്ന വാർത്ത ഫറവോന്റെ ഭവനത്തിൽ കേൾക്കപ്പെട്ടു; അത് ഫറവോനും അവന്റെ ദാസന്മാർക്കും ഇഷ്ടമായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: എന്ന വാർത്ത ... അറിഞ്ഞു
  rationale: הַקֹּל എന്നതിന്റെ അക്ഷരാർഥം ‘ശബ്ദം/സ്വരം’ എന്നാണെങ്കിലും, പിന്നാലെ വരുന്ന വാർത്തയുടെ ഉള്ളടക്കം കണക്കിലെടുത്ത് ‘വാർത്ത’ എന്നാണ് സന്ദർഭോചിതമായ അർഥം. נִשְׁמַע എന്ന നിഫാൽ രൂപത്തിന്റെ ‘കേൾക്കപ്പെട്ടു/അറിയപ്പെട്ടു’ എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘അറിഞ്ഞു’ എന്നു നൽകി.
- source_word: בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിൽ
  rationale: ‘ഫറവോന്റെ വീട്/ഭവനം’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘രാജസദസ്സ്’ എന്നു വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കുന്നില്ല.
- source_word: לֵאמֹר
  choice: ഉദ്ധരണിയിലൂടെ ഉൾക്കൊള്ളിച്ചു
  rationale: വാർത്തയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂചകം മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിയാൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കി.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: യോസേഫിന്റെ സഹോദരന്മാർ വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ സംഭവത്തിന്റെയും ഇപ്പോഴത്തെ സാന്നിധ്യത്തിന്റെയും പ്രസക്തി ‘വന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: പ്രസാദകരമായി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കണ്ണുകളിൽ നല്ലതായി’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: രാജസേവകരെയോ ഉദ്യോഗസ്ഥരെയോ ഉൾക്കൊള്ളാവുന്ന עֶבֶד എന്ന പദത്തിന്റെ വിശാലത ‘ദാസന്മാർ’ നിലനിർത്തുന്നു; പദവിയെ അതിയായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വേദപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യഘടനയുടെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കി അർഥവും സംഭവക്രമവും സംരക്ഷിച്ചു.
