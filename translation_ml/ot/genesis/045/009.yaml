reference: Genesis 45:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: ml
  text: 'വേഗം എന്റെ അപ്പന്റെ അടുക്കലേക്കു കയറിപ്പോയി അദ്ദേഹത്തോടു പറയുവിൻ: ‘നിന്റെ മകൻ യോസേഫ് ഇപ്രകാരം പറയുന്നു: ദൈവം എന്നെ ഈജിപ്ത് മുഴുവന്റെയും അധിപനാക്കിയിരിക്കുന്നു. എന്റെ അടുക്കലേക്ക് ഇറങ്ങിവരുക; താമസിക്കരുത്[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങിനിൽക്കരുത്’; കൂടുതൽ പദശഃ, ‘നിൽക്കരുത്.’
    reason: עמד എന്ന ക്രിയയുടെ പദശഃ അർത്ഥവും ഈ സന്ദർഭത്തിലെ ‘വൈകരുത്’ എന്ന പ്രയോഗാർഥവും ഒരുമിച്ച് അറിയിക്കാൻ.
lexical_decisions:
- source_word: מַהֲרוּ
  choice: വേഗം
  rationale: ബഹുവചന ആജ്ഞയുടെ അടിയന്തരത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַעֲלוּ אֶל אָבִי
  choice: എന്റെ അപ്പന്റെ അടുക്കലേക്കു കയറിച്ചെന്ന്
  rationale: കനാനിലേക്കുള്ള യാത്രയെ ‘കയറിപ്പോകുക’ എന്നു വിശേഷിപ്പിക്കുന്ന എബ്രായ ദിശാബോധം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ യാത്രാപ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: അദ്ദേഹത്തോടു പറയുക
  rationale: മുൻ ആജ്ഞയുടെ തുടർച്ചയായ നിർദേശം ലളിതവും ആദരസൂചകവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ദൂതസന്ദേശത്തിന്റെ ഔപചാരിക ആമുഖസൂത്രം സംരക്ഷിക്കുന്നു.
- source_word: בִּנְךָ יוֹסֵף
  choice: നിന്റെ മകൻ യോസേഫ്
  rationale: എബ്രായ പദക്രമവും മകനെന്ന ബന്ധത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: ദൈവം എന്നെ ... ആക്കിയിരിക്കുന്നു
  rationale: שׂים ഇവിടെ ഒരു അധികാരസ്ഥാനത്തു നിയമിക്കുക എന്ന അർത്ഥത്തിലാണ്; ‘ആക്കിയിരിക്കുന്നു’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: ഈജിപ്ത് മുഴുവന്റെയും അധിപൻ
  rationale: אָדוֹן സൂചിപ്പിക്കുന്ന അധികാരം ‘അധിപൻ’ എന്ന പദം അനാവശ്യമായി പ്രത്യേക രാഷ്ട്രീയപദവി നിർണ്ണയിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: רְדָה אֵלַי
  choice: എന്റെ അടുക്കലേക്ക് ഇറങ്ങിവരുക
  rationale: ഈജിപ്തിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ ഇറക്കം നിലനിർത്തുകയും സംസാരിക്കുന്ന യോസേഫാണ് ലക്ഷ്യസ്ഥാനം എന്നത് ‘വരുക’ വഴി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אַל תַּעֲמֹד
  choice: താമസിക്കരുത്
  rationale: പദശഃ ‘നിൽക്കരുത്’ എന്നാണെങ്കിലും, ഈ സാഹചര്യത്തിൽ വൈകുകയോ തങ്ങിനിൽക്കുകയോ ചെയ്യരുത് എന്ന ആജ്ഞയാണ്; ‘താമസിക്കരുത്’ ആ അടിയന്തരത സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ പ്രസ്താവനയിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ഒരു ദേവൻ
  rationale: ക്രിയയും സന്ദർഭവും ഏകവചനത്തിലുള്ള ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; യോസേഫ് തന്റെ അവസ്ഥ ദൈവത്തിന്റെ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്ന സന്ദർഭസാക്ഷ്യത്തോടും ഇത് യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുറംവിവരണത്തിൽ യാക്കോബിനെക്കുറിച്ച് ‘അദ്ദേഹം’ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും ഉദ്ധരിച്ച മകന്റെ നേരിട്ടുള്ള സന്ദേശത്തിൽ എബ്രായത്തിലെ ഏകവചന അടുപ്പമുള്ള ‘നിന്റെ’ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന ‘താമസിക്കരുത്’ എന്ന വാക്യഭാഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
