source:
  edition: WLC
  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: ml
  text: നിങ്ങളുടെ സാധനസാമഗ്രികളെക്കുറിച്ച് വിഷമിക്കേണ്ടാ[a]; കാരണം ഈജിപ്തുദേശം മുഴുവനിലുമുള്ള ഏറ്റവും നല്ലതെല്ലാം നിങ്ങളുടേതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിങ്ങളുടെ കണ്ണ് നിങ്ങളുടെ സാധനസാമഗ്രികളോട് കനിവു കാണിക്കരുത്.’ അതായത്, അവ ഉപേക്ഷിക്കുന്നതിൽ ഖേദിക്കുകയോ അവയെക്കുറിച്ച് ഉത്കണ്ഠപ്പെടുകയോ അരുത്.'
    reason: മൂല എബ്രായത്തിലെ ദൃശ്യപ്രയോഗവും അതിന്റെ സന്ദർഭാർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל תָּחֹס עַל
  choice: വിഷമിക്കേണ്ടാ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ കണ്ണ് ... കനിവു കാണിക്കരുത്’ എന്ന എബ്രായ പ്രയോഗം, ഉപേക്ഷിച്ചുപോകുന്ന വസ്തുക്കളെക്കുറിച്ച് ഖേദമോ ഉത്കണ്ഠയോ തോന്നരുത് എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം പകരാൻ ‘വിഷമിക്കേണ്ടാ’ എന്നു പരിഭാഷപ്പെടുത്തി; മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: כְּלֵיכֶם
  choice: നിങ്ങളുടെ സാധനസാമഗ്രികൾ
  rationale: כְּלִי എന്ന പദത്തിന് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, വസ്തുക്കൾ, വീട്ടുസാധനങ്ങൾ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. യാത്രാസന്ദർഭത്തിൽ കൊണ്ടുപോകേണ്ട അവരുടെ വസ്തുവകകളെ പൊതുവായി സൂചിപ്പിക്കാൻ ‘സാധനസാമഗ്രികൾ’ സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിർദേശത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധപദം.
- source_word: טוּב כָּל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശം മുഴുവനിലുമുള്ള ഏറ്റവും നല്ലതെല്ലാം
  rationale: טוּב ഇവിടെ അമൂർത്തമായ ‘നന്മ’യെക്കാൾ ദേശം നൽകുന്ന മികച്ച വിഭവങ്ങളെയും വസ്തുക്കളെയും സൂചിപ്പിക്കുന്നു. כָּל אֶרֶץ എന്നതിന്റെ വ്യാപ്തിയും മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: לָכֶם הוּא
  choice: നിങ്ങളുടേതാണ്
  rationale: ലാമെദ് ചേർന്ന സർവനാമവും הוּאയും ഇവിടെ ഉടമസ്ഥതയും ഉറപ്പും പ്രകടിപ്പിക്കുന്നു; ‘നിങ്ങളുടേതാണ്’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി. മൂലത്തിലെ അസ്വാഭാവികമായി തോന്നാവുന്ന ‘കണ്ണ് കനിവു കാണിക്കുക’ എന്ന പ്രയോഗം മുഖ്യവാക്യത്തിൽ അർഥസമാനമായി നൽകി, അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സൂക്ഷിച്ചു.
