  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫിന് തന്റെ അരികിൽ നിന്നിരുന്ന എല്ലാവരുടെയും സാന്നിധ്യത്തിൽ തന്നെത്തന്നെ നിയന്ത്രിച്ചുനിർത്താൻ കഴിഞ്ഞില്ല. അവൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “എല്ലാവരെയും എന്റെ അടുത്തുനിന്ന് പുറത്താക്കൂ!” യോസേഫ് തന്റെ സഹോദരന്മാർക്കു തന്നെ വെളിപ്പെടുത്തിയപ്പോൾ മറ്റാരും അവനോടൊപ്പം അവിടെ ഉണ്ടായിരുന്നില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം: “ഒരു മനുഷ്യനും അവനോടൊപ്പം നിന്നില്ല”; ഇവിടെ അർഥം, മറ്റാരും അവിടെ സന്നിഹിതരായിരുന്നില്ല എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהִתְאַפֵּק
  choice: സ്വയം നിയന്ത്രിക്കാൻ
  rationale: ഹിത്പായേൽ രൂപത്തിലെ ആത്മനിയന്ത്രണത്തിന്റെ പ്രത്യാവർത്തക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വികാരത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: തന്റെ ചുറ്റും നിന്നിരുന്ന എല്ലാവരുടെയും മുമ്പിൽ
  rationale: നിൽക്കുക/അരികിൽ സന്നിഹിതരായിരിക്കുക എന്ന പങ്കാളിക്രിയയുടെ അർഥവും സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവും നിലനിർത്തുന്നു; ഇവർ ഉദ്യോഗസ്ഥരാണെന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: וַיִּקְרָא
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: ശബ്ദമുയർത്തി വിളിക്കുക എന്ന ക്രിയയുടെ ശക്തി സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: എല്ലാവരെയും എന്റെ അടുക്കൽനിന്ന് പുറത്താക്കൂ
  rationale: ബഹുവചന കാരണാർഥക ആജ്ഞയും ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന כָל אִישׁ എന്ന പ്രയോഗവും വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: മറ്റാരും അവനോടൊപ്പം അവിടെ ഉണ്ടായിരുന്നില്ല
  rationale: അക്ഷരാർഥമായ ‘നിന്നില്ല’ എന്നതിനു പകരം, സന്ദർഭത്തിലെ ‘സന്നിഹിതനായി ശേഷിച്ചില്ല’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: യോസേഫ് തന്റെ സഹോദരന്മാർക്കു തന്നെ വെളിപ്പെടുത്തിയപ്പോൾ
  rationale: ידע എന്ന ക്രിയയുടെ ഹിത്പായേൽ രൂപത്തിലുള്ള ‘സ്വയം അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന പ്രത്യാവർത്തക അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പരിചാരകർ’ പോലുള്ള വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി മൂലപാഠത്തിലെ പൊതുവായ പരാമർശം നിലനിർത്തി. ആജ്ഞയുടെ കാരണാർഥകത ‘പുറത്താക്കൂ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
