id: GEN.45.4
reference: Genesis 45:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് തന്റെ സഹോദരന്മാരോട് പറഞ്ഞു: “ദയവായി എന്റെ അടുത്തേക്ക് വരൂ.” അവർ അടുത്തേക്ക് വന്നു. അപ്പോൾ അവൻ പറഞ്ഞു: “ഞാൻ നിങ്ങളുടെ സഹോദരനായ യോസേഫാണ്; നിങ്ങൾ എന്നെ ഈജിപ്തിലേക്കു വിറ്റു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אֶל־אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോട്
  rationale: אָח എന്ന പദത്തിന്റെ ബഹുവചനവും മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘അവന്റെ സഹോദരന്മാർ’ എന്നർഥം നൽകുന്നു; മലയാള ആഖ്യാനത്തിൽ കർത്താവിലേക്കുള്ള മടക്കസൂചനയ്ക്ക് ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: ദയവായി എന്റെ അടുത്തേക്ക് വരൂ
  rationale: נגשׁ അടുത്തേക്കു വരുക/സമീപിക്കുക എന്നർഥമുള്ളതാണ്; נָא അഭ്യർഥനയുടെ വിനയഭാവം നൽകുന്നതിനാൽ ‘ദയവായി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּגָּשׁוּ
  choice: അവർ അടുത്തേക്ക് വന്നു
  rationale: മുൻ കല്പനയിലെ נגשׁ എന്ന അതേ ധാതുവിന്റെ ആവർത്തനം നിലനിർത്താൻ ‘അടുത്തേക്ക്’ വീണ്ടും ഉപയോഗിച്ചു.
- source_word: אֲנִי יוֹסֵף
  choice: യോസേഫാണ് ഞാൻ
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത തിരിച്ചറിയൽവാക്യം സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാള വാക്യക്രമത്തിൽ നൽകി.
- source_word: אֲחִיכֶם
  choice: നിങ്ങളുടെ സഹോദരനായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ ഏകവചനരൂപം യോസേഫിനെ അവരുടെ സഹോദരനായി തിരിച്ചറിയിക്കുന്നു; ബന്ധവാചകത്തോട് സ്വാഭാവികമായി ചേരുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: നിങ്ങൾ ... വിറ്റ
  rationale: ബന്ധവാക്യത്തിന്റെ നേരിട്ടുള്ള കുറ്റാരോപണസ്വഭാവം മൃദൂകരിക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִצְרָיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘ഈജിപ്തിലേക്കു’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗְּשׁוּ/וַיִּגָּשׁוּ എന്ന ധാതുവാവർത്തനം ‘അടുത്തേക്ക് വരൂ/അടുത്തേക്ക് വന്നു’ എന്നായി സംരക്ഷിച്ചു; യോസേഫിന്റെ നേരിട്ടുള്ള തിരിച്ചറിയലും സഹോദരന്മാരോടുള്ള കുറ്റാരോപണവും മൃദൂകരിച്ചിട്ടില്ല.
