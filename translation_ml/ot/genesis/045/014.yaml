translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കഴുത്തിൽ വീണു’ എന്ന മൂർത്തപ്രയോഗം സ്രോതസ്സിനോടുള്ള അടുപ്പം നിലനിർത്തുന്നു. രണ്ടാമത്തെ ഘടകത്തിൽ ‘വീണു’ ചേർത്തത് മലയാളത്തിൽ ആലിംഗനസന്ദർഭം വ്യക്തവും സ്വാഭാവികവുമാക്കാനാണ്; അത് എബ്രായത്തിലെ ആവർത്തിക്കാത്ത ക്രിയയിൽ ഉൾക്കൊള്ളുന്ന അർഥത്തിന്റെ പ്രസക്തീകരണമാണ്.
