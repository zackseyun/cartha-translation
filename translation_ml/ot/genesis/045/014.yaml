  edition: WLC
  text: וַ/יִּפֹּ֛ל עַל צַוְּארֵ֥י בִנְיָמִֽן אָחִ֖י/ו וַ/יֵּ֑בְךְּ וּ/בִנְיָמִ֔ן בָּכָ֖ה עַל צַוָּארָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/014.yaml
  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ സഹോദരനായ ബെന്യാമീന്റെ കഴുത്തിൽ വീണു കരഞ്ഞു[a]; ബെന്യാമീൻ അവന്റെ കഴുത്തിൽ കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, “തന്റെ സഹോദരനായ ബെന്യാമീന്റെ കഴുത്തുകളിൽ വീണു … ബെന്യാമീൻ അവന്റെ കഴുത്തിൽ കരഞ്ഞു.” “കഴുത്തുകൾ” എന്ന ബഹുവചനരൂപം കഴുത്തിൽ ചുറ്റിപ്പിടിച്ചുള്ള ആലിംഗനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: പിന്നെ അവൻ ... വീണു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; נפל എന്ന മൂർത്തമായ ‘വീഴുക’ എന്ന ക്രിയ നിലനിർത്തിക്കൊണ്ട് ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: עַל
  choice: കഴുത്തിൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ/മുകളിൽ’ എന്ന ബന്ധം ഈ ആലിംഗനസന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കഴുത്തിൽ വീഴുക’ എന്നു വരുന്നു.
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: കഴുത്തിൽ / അവന്റെ കഴുത്തിൽ
  rationale: ആദ്യരൂപം വ്യാകരണപരമായി ബഹുവചന/ദ്വിവചനസദൃശമാണെങ്കിലും, കഴുത്തിൽ ചുറ്റിപ്പിടിച്ചുള്ള ആലിംഗനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. സ്വാഭാവിക മലയാളത്തിൽ ഏകവചനം ഉപയോഗിച്ചു; സ്രോതസ്സിലെ രൂപവിശേഷം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: אָחִיו
  choice: തന്റെ സഹോദരനായ
  rationale: ബെന്യാമീൻ യോസേഫിന്റെ സഹോദരനാണെന്ന സ്രോതസ്സിലെ വ്യക്തമായ ബന്ധസൂചന സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: കരഞ്ഞു
  rationale: בכה കരയുകയോ കണ്ണീരൊഴുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ ‘കരഞ്ഞു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; രണ്ടു പ്രയോഗങ്ങൾക്കും ഒരേ പദം നിലനിർത്തി.
- source_word: וּבִנְיָמִן
  choice: ബെന്യാമീനും
  rationale: സംയോജകമായ וּ മലയാളത്തിലെ ‘-ഉം’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; പരസ്പരപ്രവർത്തനം വ്യക്തമാക്കുന്നതിനൊപ്പം അനാവശ്യ ഊന്നൽ ചേർക്കുന്നില്ല.
