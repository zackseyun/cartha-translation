id: GEN.45.21
reference: Genesis 45:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ പുത്രന്മാർ അങ്ങനെ ചെയ്തു. ഫറവോന്റെ കല്പനപ്രകാരം[a] യോസേഫ് അവർക്കു വണ്ടികൾ കൊടുത്തു; യാത്രയ്ക്കുള്ള സാധനങ്ങളും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഫറവോന്റെ വായ്പ്രകാരം”; “ഫറവോന്റെ കല്പനപ്രകാരം” എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അങ്ങനെ ചെയ്തു
  rationale: മുമ്പ് വിവരിച്ച നിർദേശമനുസരിച്ച് അവർ പ്രവർത്തിച്ചു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ യാക്കോബ്/ഇസ്രായേലിന്റെ ആൺമക്കളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിർദിഷ്ടമായ മൂലപദം നിലനിർത്തുന്നു.
- source_word: עֲגָלֹות
  choice: വണ്ടികൾ
  rationale: ആളുകളെയും സാധനങ്ങളെയും കൊണ്ടുപോകാനുള്ള ചക്രമുള്ള വാഹനങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: עַל פִּי פַרְעֹה
  choice: ഫറവോന്റെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഫറവോന്റെ വായ്പ്രകാരം’ എന്നാണെങ്കിലും, അധികാരപൂർവമായ കല്പന അനുസരിച്ച് എന്നതാണ് എബ്രായ ശൈലിയുടെ സന്ദർഭാർഥം.
- source_word: צֵדָה
  choice: സാധനങ്ങൾ
  rationale: യാത്രയ്ക്കാവശ്യമായ ഭക്ഷണം ഉൾപ്പെടെയുള്ള കരുതൽസാധനങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്; ‘യാത്രയ്ക്കുള്ള’ എന്ന സന്ദർഭവിശേഷണം അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לַדָּרֶךְ
  choice: യാത്രയ്ക്കുള്ള
  rationale: വഴിയിലേക്കെന്ന അക്ഷരാർഥത്തേക്കാൾ, യാത്രയുടെ ആവശ്യത്തിനായി എന്ന ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ തുടർച്ചയായ ‘അവൻ കൊടുത്തു’ എന്ന ഘടന ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി രണ്ട് വാക്യഘടകങ്ങൾ ഉപയോഗിച്ചു.
