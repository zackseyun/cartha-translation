  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Joseph that he had spoken to them[a], and he saw the wagons that Joseph had sent to carry him[b], and the spirit of their father Jacob revived.
translation:
  language: ml
  text: അവർ യോസേഫ് തങ്ങളോടു പറഞ്ഞ വാക്കുകളെല്ലാം അവനോടു പറഞ്ഞു. തന്നെ കൊണ്ടുപോകാൻ യോസേഫ് അയച്ച വണ്ടികൾ[a] അവൻ കണ്ടപ്പോൾ, അവരുടെ പിതാവായ യാക്കോബിന്റെ മനസ്സിന് വീണ്ടും ജീവൻ വന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈവണ്ടികൾ’ അഥവാ ‘വാഹനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ആളുകളെയോ സാധനങ്ങളെയോ കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന ചക്രവാഹനങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ പിതാവായ യാക്കോബിന്റെ ആത്മാവ് വീണ്ടും ജീവിച്ചു.’ പുതുക്കപ്പെട്ട ജീവചൈതന്യമോ ഉന്മേഷമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: സഹോദരന്മാർ യാക്കോബിനോട് വിവരം അറിയിക്കുന്ന സന്ദർഭത്തിൽ ‘പറഞ്ഞു’ എന്നത് സ്വാഭാവികവും മൂലത്തിലെ സംസാരപ്രവൃത്തിയോട് വിശ്വസ്തവുമാണ്.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: യോസേഫ് തങ്ങളോടു പറഞ്ഞ വാക്കുകളെല്ലാം
  rationale: דִּבְרֵי എന്ന വ്യക്തമായ ‘വാക്കുകൾ’ എന്ന നാമരൂപവും דִּבֶּר എന്ന ‘പറഞ്ഞ’ എന്ന ക്രിയയും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: הָעֲגָלוֹת
  choice: വണ്ടികൾ
  rationale: ആളുകളെയോ സാധനങ്ങളെയോ കൊണ്ടുപോകുന്ന ചക്രവാഹനങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ‘വണ്ടികൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും കാലസന്ദർഭത്തിന് ചേരുന്നതുമാണ്.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: തന്നെ കൊണ്ടുപോകാൻ യോസേഫ് അയച്ച
  rationale: לָשֵׂאת എന്നതിലെ വഹിക്കുക/കൊണ്ടുപോകുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തന്നെ’ എന്നത് യാക്കോബിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַתְּחִי רוּחַ
  choice: ഉള്ളം വീണ്ടും ഉണർന്നു
  rationale: അക്ഷരാർഥത്തിലെ ജീവൻപ്രാപിക്കൽ ഭാഷ നിലനിർത്തിക്കൊണ്ട്, പുതുക്കപ്പെട്ട ഉന്മേഷവും ധൈര്യവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: അവരുടെ പിതാവായ യാക്കോബ്
  rationale: ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; ‘യാക്കോബ്’ മലയാള ബൈബിൾ വായനയിൽ സ്ഥാപിതമായ പേരുരൂപമാണ്.
theological_decisions:
- issue: רוּחַ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ഉള്ളം
  alternative: ആത്മാവ്
  rationale: ഇവിടെ മനുഷ്യന്റെ പുതുക്കപ്പെട്ട ജീവചൈതന്യവും ഉന്മേഷവുമാണ് പ്രയോഗത്തിന്റെ മുഖ്യസൂചന. ‘ഉള്ളം’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ ‘ആത്മാവ്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יַעֲקֹב എന്ന പിതാമഹന്റെ പേരിന്റെ രൂപം
  choice: യാക്കോബ്
  alternative: യാക്കോവ്
  rationale: മൂലപേരിനെ തിരിച്ചറിയാവുന്ന വിധത്തിൽ സൂക്ഷിക്കുമ്പോഴും മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു; ഇതിൽ പാഠവ്യത്യാസമോ സിദ്ധാന്തപരമായ നിർണ്ണയമോ ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട എബ്രായ സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമവും ബന്ധങ്ങളും മാറ്റിയിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ സൂചകങ്ങൾ ആശയങ്ങളോട് പൊരുത്തപ്പെടാതിരുന്നതിനാൽ [a] ‘വണ്ടികൾ’ എന്നതിനു ശേഷവും [b] അവസാനത്തെ പ്രയോഗത്തിനു ശേഷവും വെച്ചു.
