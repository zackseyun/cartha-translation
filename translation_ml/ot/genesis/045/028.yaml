  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד יוֹסֵ֥ף בְּנִ֖/י חָ֑י אֵֽלְכָ֥ה וְ/אֶרְאֶ֖/נּוּ בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: ml
  text: 'യിസ്രായേൽ പറഞ്ഞു[a]: “മതി! എന്റെ മകൻ യോസേഫ് ഇപ്പോഴും ജീവനോടെയുണ്ട്. ഞാൻ മരിക്കുന്നതിനുമുമ്പ് പോയി അവനെ കാണും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത്രയും മതി.” ഇവിടെ എബ്രായത്തിലെ רַב ‘മതിയാകുന്നു’ എന്ന അർഥമുള്ള ഒരു ഉദ്ഗാരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യിഖ്തോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കഥാഗതിക്കായി ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: יִשְׂרָאֵל
  choice: യിസ്രായേൽ
  rationale: എബ്രായപാഠം ‘യാക്കോബ്’ എന്നതിനു പകരം വ്യക്തമായി ‘യിസ്രായേൽ’ എന്നാണ് ഉപയോഗിക്കുന്നത്; അതുതന്നെ നിലനിർത്തി.
- source_word: רַב
  choice: മതി!
  rationale: ഈ വികാരഭരിതമായ സന്ദർഭത്തിൽ പദം മതിപ്പിനെയോ പര്യാപ്തതയെയോ പ്രഖ്യാപിക്കുന്ന ഉദ്ഗാരമായി പ്രവർത്തിക്കുന്നു; ‘മതി!’ അതിന്റെ ചുരുക്കവും ശക്തിയും സ്വാഭാവികമായി പകരുന്നു.
- source_word: עוֹד
  choice: ഇപ്പോഴും
  rationale: חָי എന്നതിനൊപ്പം തുടർന്നും ജീവനോടിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: സ്വത്തുബന്ധവും കുടുംബപരമായ ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: חָי
  choice: ജീവനോടെയുണ്ട്
  rationale: ജീവിച്ചിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵלְכָה
  choice: ഞാൻ ... പോയി
  rationale: കോഹോർട്ടേറ്റീവ് രൂപം ഉറച്ച തീരുമാനത്തെ പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയയുമായി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
- source_word: וְאֶרְאֶנּוּ
  choice: അവനെ കാണും
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ‘കാണുക’ എന്ന ലളിതക്രിയ നേരിട്ട് പകരുന്നു.
- source_word: בְּטֶרֶם
  choice: മരിക്കുന്നതിനുമുമ്പ്
  rationale: ഇനിയും സംഭവിക്കാത്ത മരണത്തിന് മുമ്പുള്ള സമയബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אָמֽוּת
  choice: ഞാൻ മരിക്കുന്ന
  rationale: ഒന്നാം പുരുഷ ഏകവചനമായ ‘ഞാൻ മരിക്കുക’ എന്ന അർഥം മലയാളത്തിലെ കാലവാക്യഘടനയ്ക്കനുസരിച്ച് പകരുന്നു.
