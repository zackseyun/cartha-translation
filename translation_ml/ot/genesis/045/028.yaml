  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വികാരഭരിതമായ ഉദ്ഗാരത്തിന്റെ ചുരുക്കം നിലനിർത്തുകയും, എബ്രായപാഠത്തിലെ ‘യിസ്രായേൽ’ എന്ന നാമം മാറ്റമില്ലാതെ സൂക്ഷിക്കുകയും ചെയ്തു.
