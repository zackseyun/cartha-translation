source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ, എന്നെ ഇവിടെ അയച്ചത് നിങ്ങളല്ല, ദൈവമാണ്; ദൈവം എന്നെ ഫറവോന് പിതാവായും[a] അവന്റെ സകല ഭവനത്തിനും അധിപനായും ഈജിപ്തുദേശം മുഴുവനും ഭരിക്കുന്നവനായും ആക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഫറവോന് ഒരു പിതാവിനെപ്പോലെ’; അതായത്, മുഖ്യ രക്ഷാധികാരിയോ ഉപദേഷ്ടാവോ ഹിതകാരിയോ ആയി.
    reason: ‘പിതാവ്’ എന്ന എബ്രായ രൂപകത്തിന്റെ സാധ്യതയുള്ള പ്രവർത്തനപരമായ അർഥങ്ങൾ വ്യക്തമാക്കുന്ന പദവികൽപം.
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞതിൽനിന്നുള്ള യോസേഫിന്റെ നിഗമനത്തെയും ഇപ്പോഴത്തെ പ്രസംഗഘട്ടത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: എന്നെ ഇവിടെ അയച്ചത് നിങ്ങളല്ല
  rationale: മൂലഭാഷയിലെ ‘നിങ്ങൾ’ എന്നതിനുള്ള ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവികമായ വിഭക്തവാക്യഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: כִּי הָאֱלֹהִים
  choice: ദൈവമാണ്
  rationale: നിഷേധത്തിനു ശേഷമുള്ള ശക്തമായ വൈരുധ്യം—‘നിങ്ങളല്ല, ദൈവം’—വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְשִׂימֵנִי
  choice: ദൈവം എന്നെ ... ആക്കിയിരിക്കുന്നു
  rationale: ദൈവത്തിന്റെ മുൻകാല പ്രവർത്തനത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം മലയാളത്തിലെ പൂർത്തികാലപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לְאָב לְפַרְעֹה
  choice: ഫറവോന് ഒരു പിതാവായി
  rationale: പ്രധാന രക്ഷാധികാരി, ഉപദേഷ്ടാവ്, ഹിതകാരി എന്നിവയുടെ ആശയം ഉൾക്കൊള്ളുന്ന ‘പിതാവ്’ എന്ന മൂലരൂപകം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: അവന്റെ സകല ഭവനത്തിനും അധിപനായി
  rationale: ‘ഭവനം’ എന്നത് കുടുംബത്തെയും ഭരണഗൃഹത്തെയും സ്വത്തുവകകളെയും ഉൾക്കൊള്ളാവുന്ന വിശാലതയോടെ നിലനിർത്തുന്നു; ‘അധിപൻ’ ഏല്പിക്കപ്പെട്ട അധികാരം സൂചിപ്പിക്കുന്നു.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവനും ഭരിക്കുന്നവനായി
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ തുടർച്ചയായ ഭരണപദവിയും ദേശമൊട്ടാകെയുള്ള അധികാരപരിധിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പരമാധികാരവും സഹോദരന്മാരുടെ മാനുഷിക പ്രവർത്തനവും
  choice: ‘എന്നെ ഇവിടെ അയച്ചത് നിങ്ങളല്ല, ദൈവമാണ്’ എന്ന ശക്തമായ വൈരുധ്യം അതേപടി നിലനിർത്തി.
  alternative: സഹോദരന്മാരുടെ പങ്ക് മൃദൂകരിക്കുകയോ ദൈവപരിപാലനത്തെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനമായി വിശദീകരിക്കുകയോ ചെയ്യുക.
  rationale: ഈ വാക്യത്തിൽ യോസേഫ് ദൈവത്തിന്റെ നിർണായക ഉദ്ദേശ്യത്തിന് ഊന്നൽ നൽകുന്നു; എന്നാൽ സഹോദരന്മാരുടെ യഥാർഥ പ്രവൃത്തിയെ സന്ദർഭം നിഷേധിക്കുന്നില്ല. വിവർത്തനം ഈ സംഘർഷം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടികയിലെ ആവർത്തിച്ചുള്ള എബ്രായ സംയോജകങ്ങൾ ‘-യും’ രൂപങ്ങളിലൂടെ പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
