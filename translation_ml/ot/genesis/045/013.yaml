  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: ml
  text: ഈജിപ്തിൽ എനിക്കുള്ള എല്ലാ ബഹുമാനത്തെക്കുറിച്ചും നിങ്ങൾ കണ്ടതെല്ലാം എന്റെ അപ്പനോടു പറയണം.[a] വേഗം എന്റെ അപ്പനെ ഇവിടേക്കു ഇറക്കിക്കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈജിപ്തിൽ എനിക്കുള്ള എല്ലാ മഹത്ത്വവും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ כָּבוֹד എന്ന പദത്തിന് ബഹുമാനം, മഹത്ത്വം, പ്രതാപം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അത് ഈജിപ്തിലെ യോസേഫിന്റെ ഉന്നത സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
