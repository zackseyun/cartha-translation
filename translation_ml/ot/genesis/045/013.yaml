  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. എബ്രായത്തിലെ രണ്ടു സമാന്തര കർമങ്ങളെ മലയാളത്തിലെ സുതാര്യമായ ക്രമത്തിൽ അവതരിപ്പിച്ചു; ‘ഇറക്കിക്കൊണ്ടുവരണം’ എന്നതിലൂടെ മൂലത്തിലെ ദിശാസൂചന സംരക്ഷിച്ചു.
