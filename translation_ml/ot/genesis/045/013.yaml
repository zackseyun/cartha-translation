lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: പറയണം
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥത്തിലാണ്; നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘പറയണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כָּל כְּבוֹדִי
  choice: എനിക്കുള്ള എല്ലാ ബഹുമാനവും
  rationale: כבוד എന്നതിന് ബഹുമാനം, മഹത്ത്വം, പ്രതാപം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ യോസേഫിന് ഈജിപ്തിൽ ലഭിച്ച ഉന്നത സ്ഥാനവും മാന്യതയുമാണ് സൂചന; അതിനാൽ ‘ബഹുമാനം’ പ്രസക്തമാണ്.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: നിങ്ങൾ കണ്ടതെല്ലാം
  rationale: സഹോദരന്മാർ നേരിട്ട് കണ്ട എല്ലാ കാര്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מִהַרְתֶּם
  choice: വേഗം പോയി
  rationale: ക്രിയയിലെ അടിയന്തരത മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; അടുത്ത കല്പനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הוֹרַדְתֶּם
  choice: ഇറക്കിക്കൊണ്ടുവരണം
  rationale: ירד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘താഴേക്കു കൊണ്ടുവരുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; ഈജിപ്തിലേക്കുള്ള യാത്രയെ ഉല്പത്തിയിൽ പതിവായി ‘ഇറങ്ങുക’ എന്നു ചിത്രീകരിക്കുന്നു.
- source_word: הֵנָּה
  choice: ഇവിടെ
  rationale: സംസാരിക്കുന്ന യോസേഫിന്റെ സ്ഥലത്തേക്കുള്ള ലക്ഷ്യസൂചന സ്വാഭാവികമായി നൽകുന്നു.
