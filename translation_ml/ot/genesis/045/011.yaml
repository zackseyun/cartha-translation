id: GEN.45.11
reference: Genesis 45:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: ml
  text: അവിടെ ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്തും; കാരണം ക്ഷാമത്തിന് ഇനിയും അഞ്ചു വർഷം ശേഷിക്കുന്നു. നീയും നിന്റെ കുടുംബവും നിനക്കുള്ള സകലവും നഷ്ടപ്പെട്ട് നിർധനനാകാതിരിക്കേണ്ടതിന് അങ്ങനെ ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്തും
  rationale: כלכל എന്ന ക്രിയ ഇവിടെ ആഹാരവും ആവശ്യവസ്തുക്കളും നൽകി സംരക്ഷിക്കുക എന്ന അർഥത്തിലാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുവരുന്ന ക്ഷാമം യോസേഫ് അവിടെവെച്ച് പോറ്റിപ്പുലർത്തുന്നതിനുള്ള കാരണമായി അവതരിപ്പിക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ആശങ്കയോടുകൂടിയ പ്രതികൂല ഫലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: תִּוָּרֵשׁ
  choice: ദാരിദ്ര്യത്തിലായിപ്പോകും
  rationale: നിഫാൽ രൂപം ഇവിടെ വസ്തുവകകൾ നഷ്ടപ്പെട്ട് നിർധനാവസ്ഥയിലാകുക എന്ന ആശയം നൽകുന്നു.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: നിനക്കുള്ളതൊക്കെയും
  rationale: വ്യക്തിയുടെ എല്ലാ സ്വത്തും അവകാശവുമെന്ന വിശാലത സംക്ഷിപ്തമായും കൃത്യമായും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധവും വരാനിരിക്കുന്ന ദാരിദ്ര്യത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പും നിലനിർത്തിയിരിക്കുന്നു.
