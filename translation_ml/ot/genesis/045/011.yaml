revisions:
- from: അവിടെ ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്തും; കാരണം ഇനിയും അഞ്ചു വർഷം ക്ഷാമം ഉണ്ടാകും. അല്ലെങ്കിൽ നീയും നിന്റെ കുടുംബവും നിനക്കുള്ളതൊക്കെയും ദാരിദ്ര്യത്തിലായിപ്പോകും.
  to: അവിടെ ഞാൻ നിന്നെ പോറ്റിപ്പുലർത്തും; കാരണം ക്ഷാമത്തിന് ഇനിയും അഞ്ചു വർഷം ശേഷിക്കുന്നു. നീയും നിന്റെ കുടുംബവും നിനക്കുള്ള സകലവും നഷ്ടപ്പെട്ട് നിർധനനാകാതിരിക്കേണ്ടതിന് അങ്ങനെ ചെയ്യും.
  rationale: The revision retains the natural promise 'പോറ്റിപ്പുലർത്തും,' specifies that five famine years remain, and renders the prevention force of פֶּן without treating possessions as independently becoming poor. It preserves the source's inclusive reference to the addressee, household, and possessions.
