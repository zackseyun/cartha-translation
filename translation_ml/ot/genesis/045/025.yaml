  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲל֖וּ מִ/מִּצְרָ֑יִם וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ כְּנַ֔עַן אֶֽל יַעֲקֹ֖ב אֲבִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഈജിപ്തിൽനിന്ന് കയറി കനാൻദേശത്ത് തങ്ങളുടെ പിതാവായ യാക്കോബിന്റെ അടുക്കൽ എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറി
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറുക’ എന്ന അടിസ്ഥാനാർഥവും ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള എബ്രായ ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מִן പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; മִצְרַיִם എന്ന സ്ഥലനാമത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ‘ഈജിപ്ത്’ ആണ്.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്നതിന് ‘വരുക/എത്തുക’ എന്നർഥമുണ്ട്; യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്ത് വന്നെത്തിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എത്തി’ എന്നു പറയുന്നു.
- source_word: אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം
  rationale: മൂലത്തിലെ ‘കനാന്റെ ദേശം’ എന്ന ഘടനയിലെ אֶרֶץ (‘ദേശം’) വ്യക്തമായി നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: തങ്ങളുടെ പിതാവായ യാക്കോബിന്റെ അടുക്കൽ
  rationale: אֶל വ്യക്തിയിലേക്കുള്ള ദിശയും אֲבִיהֶם എന്നതിന്റെ ‘അവരുടെ പിതാവ്’ എന്ന നേരിട്ടുള്ള കുടുംബബന്ധവും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കയറി’ എന്ന പ്രയോഗം മലയാളത്തിൽ അല്പം എബ്രായശൈലി അനുഭവിപ്പിച്ചാലും, ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയുടെ മൂലഭാഷയിലെ ദിശാസൂചന ഉദ്ദേശപൂർവം സംരക്ഷിക്കുന്നു.
