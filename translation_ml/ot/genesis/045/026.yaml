  text: וַ/יַּגִּ֨דוּ ל֜/וֹ לֵ/אמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְ/כִֽי ה֥וּא מֹשֵׁ֖ל בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם וַ/יָּ֣פָג לִבּ֔/וֹ כִּ֥י לֹא הֶאֱמִ֖ין לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “യോസേഫ് ഇപ്പോഴും ജീവനോടെയുണ്ട്; അവൻ ഈജിപ്തുദേശം മുഴുവൻ ഭരിക്കുന്നു.” എന്നാൽ യാക്കോബിന്റെ ഹൃദയം മരവിച്ചുപോയി[a]; കാരണം അവൻ അവരെ വിശ്വസിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൃദയം തളർന്നുപോയി.” ഈ ഹീബ്രു പ്രയോഗം വാർത്ത കേട്ടപ്പോൾ യാക്കോബിനുണ്ടായ അമ്പരപ്പും ഉള്ളിലെ ശക്തിക്ഷയവും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: നגד എന്ന ക്രിയയുടെ ഹിഫ്ഈൽ രൂപം അറിയിക്കുക/പറയുക എന്നർഥം നൽകുന്നു. לֵאמֹר എന്ന ഹീബ്രു വാക്യാരംഭസൂത്രം മലയാളത്തിലെ സ്വാഭാവികമായ പ്രത്യക്ഷവാക്യരചനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: עוֹד יוֹסֵף חַי
  choice: യോസേഫ് ഇപ്പോഴും ജീവനോടെയുണ്ട്
  rationale: עוֹד തുടർന്നുനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; חַי ഇവിടെ ‘ജീവനോടെ’ എന്ന വിധേയവിശേഷണമാണ്.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: അവൻ ... ഭരിക്കുന്നു
  rationale: מֹשֵׁל എന്ന കർത്തൃവാചക കൃദന്തം ഭരണാധികാരം പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഒരു പ്രത്യേക ഈജിപ്ഷ്യൻ ഔദ്യോഗികപദവി ചുമത്താതെ ‘ഭരിക്കുന്നു’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവൻ
  rationale: מֹשֵׁל എന്നതിനോടുകൂടിയ בְ ഭരണത്തിന്റെ അധികാരമേഖലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയയോടൊപ്പം ‘ഈജിപ്തുദേശം മുഴുവൻ ഭരിക്കുന്നു’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: וַיָּפָג לִבּוֹ
  choice: യാക്കോബിന്റെ ഹൃദയം മരവിച്ചുപോയി
  rationale: פוג ദുർബലമാകുക, തളരുക, മരവിക്കുക എന്നീ അർഥസാധ്യതകൾ വഹിക്കുന്നു. അമ്പരപ്പും ഉള്ളിലെ ശക്തിക്ഷയവും ചേർന്ന പ്രതികരണം രൂപകമായി നിലനിർത്താൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു; ഉടമസർവനാമത്തിന്റെ സൂചിതപാത്രം വ്യക്തതയ്ക്കായി ‘യാക്കോബ്’ എന്നു വ്യക്തമാക്കി.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: കാരണം അവൻ അവരെ വിശ്വസിച്ചില്ല
  rationale: כִּי ഇവിടെ മുൻപ്രതികരണത്തിന്റെ കാരണം നൽകുന്നു; ‘കാരണം’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
