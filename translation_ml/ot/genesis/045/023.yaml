id: GEN.45.23
reference: Genesis 45:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: ml
  text: 'തന്റെ അപ്പന് അവൻ ഇങ്ങനെ അയച്ചു: ഈജിപ്തിലെ ഏറ്റവും നല്ല വസ്തുക്കളിൽ ചിലത്[a] ചുമന്ന പത്ത് കഴുതകളെയും, യാത്രയ്ക്കായി തന്റെ അപ്പന് ധാന്യവും അപ്പവും ഭക്ഷണസാധനങ്ങളും ചുമന്ന പത്ത് പെൺകഴുതകളെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈജിപ്തിലെ ഏറ്റവും നല്ല വസ്തുക്കളിൽ ചിലത്’ എന്നതിന് ‘ഈജിപ്തിലെ സമൃദ്ധിയിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזֹאת
  choice: ഇങ്ങനെ
  rationale: അയച്ച സാധനങ്ങളുടെ പട്ടിക അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: חֲמֹרִים
  choice: കഴുതകൾ
  rationale: ആധുനിക സാധാരണ മലയാളത്തിലെ വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: נֹשְׂאִים
  choice: ചുമന്ന
  rationale: മൃഗങ്ങൾ സാധനങ്ങൾ വഹിച്ചുകൊണ്ടിരുന്നതിനെ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു; ‘കയറ്റിയ’ എന്നതിലധികം മൂലരൂപത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: מִטּוּב מִצְרַיִם
  choice: ഈജിപ്തിലെ ഏറ്റവും നല്ല വസ്തുക്കളിൽ ചിലത്
  rationale: מִן എന്ന ഭാഗസൂചകത്തിന്റെ അർഥം ‘ചിലത്’ എന്നതിലൂടെ നിലനിർത്തുകയും טוּב സൂചിപ്പിക്കുന്ന മേന്മയെ അനാവശ്യമായി പ്രത്യേക ഉൽപ്പന്നങ്ങളായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲתֹנֹת
  choice: പെൺകഴുതകൾ
  rationale: ആദ്യത്തെ പൊതുവായ/ആൺലിംഗരൂപത്തിൽനിന്ന് വ്യത്യസ്തമായി ഹീബ്രുവിലുള്ള സ്ത്രീലിംഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּר
  choice: ധാന്യം
  rationale: ഗോതമ്പ് എന്നൊരൊറ്റ ധാന്യമായി പരിമിതപ്പെടുത്താതെ പൊതുവായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: സാധാരണ അർഥമായ അപ്പം നിലനിർത്തുന്നു; പൊതുവായി ‘ഭക്ഷണം’ എന്നു മാറ്റുന്നില്ല.
- source_word: מָזוֹן
  choice: ഭക്ഷണസാധനങ്ങൾ
  rationale: യാത്രയ്ക്കുള്ള ആഹാരശേഖരത്തെ സൂചിപ്പിക്കുകയും ഇതിനുമുമ്പുള്ള ‘അപ്പം’ എന്ന പ്രത്യേക ഇനത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לַדָּרֶךְ
  choice: യാത്രയ്ക്കായി
  rationale: വഴിയിൽ ഉപയോഗിക്കാനുള്ള സാധനങ്ങൾ എന്ന അർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അപ്പൻ’ എന്ന ബന്ധപദവും ‘അപ്പം’ എന്ന പദവും വാക്യത്തിന്റെ ബൈബിൾസഹജമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ഇന്നത്തെ വായനക്കാർക്ക് സ്വാഭാവികമായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആദ്യ പട്ടികയിനത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
