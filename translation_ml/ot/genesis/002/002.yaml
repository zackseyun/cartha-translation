  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: ml
  text: ഏഴാം ദിവസമാകുമ്പോഴേക്കും ദൈവം താൻ ചെയ്ത പ്രവൃത്തി പൂർത്തിയാക്കിയിരുന്നു[a]. താൻ ചെയ്ത സകല പ്രവൃത്തിയിൽനിന്നും ഏഴാം ദിവസം അവിടുന്ന് വിശ്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഏഴാം ദിവസം ദൈവം താൻ ചെയ്ത പ്രവൃത്തി പൂർത്തിയാക്കി.” എബ്രായവാക്യം പലപ്പോഴും ഇങ്ങനെയാണ് പരിഭാഷപ്പെടുത്തപ്പെടുന്നത്; സന്ദർഭത്തിലെ സാധ്യതയേറിയ അർഥം പ്രകടിപ്പിക്കാനാണ് മുഖ്യപാഠത്തിൽ “ഏഴാം ദിവസമാകുമ്പോഴേക്കും” എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: പൂർത്തിയാക്കിയിരുന്നു
  rationale: כלה എന്ന ക്രിയയ്ക്ക് ‘പൂർത്തിയാക്കുക’, ‘അവസാനിപ്പിക്കുക’ എന്നർഥമുണ്ട്. ഏഴാം ദിവസത്തെ വിശ്രമത്തിന് മുമ്പേ പ്രവൃത്തി പൂർത്തിയായിരുന്നുവെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഭൂതകാലപൂർണരൂപം ഉപയോഗിച്ചു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ബഹുവചനരൂപമുള്ള പദത്തോടൊപ്പം ഏകവചനക്രിയയാണ് വരുന്നത്; ഉല്പത്തി 1–2-ന്റെ സന്ദർഭത്തിൽ ഇത് ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം ആയപ്പോഴേക്കും
  rationale: പദാനുപദമായി ‘ഏഴാം ദിവസം’ എന്നാണ്. എന്നാൽ തുടർന്നുതന്നെ ദൈവം ഏഴാം ദിവസം വിശ്രമിച്ചുവെന്ന് പറയുന്നതിനാൽ, പ്രവൃത്തി അന്നേക്കു പൂർത്തിയായിരുന്നുവെന്ന സാധ്യതയേറിയ സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ പ്രകടമാക്കി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מְלַאכְתּוֹ
  choice: താൻ ചെയ്ത പ്രവൃത്തി / സകല പ്രവൃത്തി
  rationale: מְלָאכָה ജോലി, അധ്വാനം, നിർവഹിച്ച പ്രവൃത്തി എന്നിവയെ സൂചിപ്പിക്കുന്നു. സൃഷ്ടിവിവരണത്തിൽ ‘പ്രവൃത്തി’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സമാനപദമാണ്.
- source_word: אֲשֶׁר עָשָׂה
  choice: താൻ ചെയ്ത
  rationale: עשה എന്നത് ‘ചെയ്യുക’ എന്നും ‘ഉണ്ടാക്കുക’ എന്നും അർഥമുള്ള വിശാലക്രിയയാണ്. ‘ചെയ്ത’ എന്നത് അതിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുകയും മലയാളത്തിൽ ആവർത്തനം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁבֹּת
  choice: വിശ്രമിച്ചു
  rationale: שבת എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘നിർത്തുക’, ‘വിരമിക്കുക’ എന്നതാണ്. ഇവിടെ സൃഷ്ടിപ്രവൃത്തിയിൽനിന്നുള്ള വിരാമത്തെ സൂചിപ്പിക്കാൻ പതിവും സന്ദർഭോചിതവുമായ ‘വിശ്രമിച്ചു’ ഉപയോഗിച്ചു; ക്ഷീണത്തിൽനിന്നുള്ള വീണ്ടെടുപ്പ് ഇതിലൂടെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: מִכָּל
  choice: സകല ...യിൽനിന്നും
  rationale: מן + כָּל എന്ന ഘടന ദൈവത്തിന്റെ മുഴുവൻ പ്രവൃത്തിയിൽനിന്നുള്ള വിരാമം സൂചിപ്പിക്കുന്നു; ‘സകല ...യിൽനിന്നും’ അത് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവം ഏഴാം ദിവസത്തിൽ പ്രവൃത്തി ചെയ്തുവോ എന്ന ചോദ്യം
  choice: ‘ഏഴാം ദിവസം ആയപ്പോഴേക്കും ... പൂർത്തിയാക്കിയിരുന്നു’ എന്ന മുഖ്യവായന
  alternative: ‘ഏഴാം ദിവസം ദൈവം ... പൂർത്തിയാക്കി’ എന്ന കൂടുതൽ പദാനുപദമായ വായന
  rationale: എബ്രായപാഠം പദാനുപദമായി ‘ഏഴാം ദിവസം’ എന്നു പറയുന്നു; എന്നാൽ അടുത്ത വാക്യഭാഗം അതേ ദിവസം ദൈവം വിശ്രമിച്ചുവെന്ന് പറയുന്നു. മുഖ്യവായന സന്ദർഭത്തിലെ സാധ്യതയേറിയ കാലബന്ധം വ്യക്തമാക്കുന്നു; അതേസമയം എബ്രായത്തിന്റെ യഥാർഥ ഘടനയും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ തുടർന്നുള്ള പരാമർശത്തിൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനം സാധ്യമായത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി സർവനാമബന്ധം ക്രമപ്പെടുത്തി.
