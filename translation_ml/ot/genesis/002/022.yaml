id: GEN.2.22
reference: Genesis 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: ml
  text: യഹോവയായ ദൈവം മനുഷ്യനിൽനിന്ന് എടുത്ത വാരിയെല്ലിനെ ഒരു സ്ത്രീയായി പണിതു; അവളെ മനുഷ്യന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: യഹോവയായ ദൈവം
  rationale: ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നും אֱלֹהִיםനെ ‘ദൈവം’ എന്നും നൽകി സംയുക്തനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: הַצֵּלָע
  choice: വാരിയെല്ല്
  rationale: സന്ദർഭത്തിൽ മനുഷ്യനിൽനിന്ന് എടുത്ത ശരീരഭാഗം സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: וַיִּבֶן ... לְאִשָּׁה
  choice: ഒരു സ്ത്രീയായി പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ ‘പണിയുക/നിർമിക്കുക’ എന്ന ദൃശ്യബലം നിലനിർത്തുകയും לְ എന്ന ഘടനയെ ‘സ്ത്രീയായി’ എന്ന് സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ വ്യക്തിനാമമായി മാത്രം നിർബന്ധിച്ച് വായിക്കാതെ ‘മനുഷ്യൻ’ എന്ന പൊതുവായ അർത്ഥവും ഹീബ്രു പദത്തിലെ പദപ്രയോഗബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם
  choice: അവളെ മനുഷ്യന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: സ്ത്രീയെ മനുഷ്യന്റെ അടുത്തേക്ക് കൊണ്ടുവരുന്ന പ്രവൃത്തി നേരിട്ടും മാന്യമായും പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ സൃഷ്ടിയെ വിവരിക്കുന്ന בנה എന്ന ക്രിയയുടെ രൂപകം
  choice: പണിതു
  alternative: ഉണ്ടാക്കി / രൂപപ്പെടുത്തി
  rationale: മൂലപാഠത്തിലെ വ്യത്യസ്തവും ഉദ്ദേശ്യപൂർവവുമായ ‘പണിതു’ എന്ന ഭാഷയെ മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം വായനക്കാരനുവേണ്ടി തീർപ്പാക്കുന്നില്ല.
- issue: הָאָדָם എന്നതിനെ വ്യക്തിനാമമോ പൊതുനാമമോ ആയി നൽകൽ
  choice: മനുഷ്യൻ
  alternative: ആദാം
  rationale: ഈ ഭാഗത്തെ ഹീബ്രു പദം നിർദേശപദത്തോടുകൂടിയ ‘മനുഷ്യൻ’ എന്ന രൂപത്തിലാണ്; അതിനാൽ വ്യക്തിനാമമായി മാത്രം നിർണ്ണയിക്കാതെ യഥാർത്ഥ ഭാഷയിലെ അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമം മലയാളത്തിൽ കൃത്രിമമാകാതെ ക്രമപ്പെടുത്തി; എന്നാൽ ‘വാരിയെല്ല്’, ‘പണിതു’, ‘മനുഷ്യൻ’ എന്നീ പ്രധാന സ്രോതസ്സ്-സവിശേഷതകൾ സംരക്ഷിച്ചു.
