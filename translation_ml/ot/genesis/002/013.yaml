source:
  edition: WLC
  text: וְ/שֵֽׁם הַ/נָּהָ֥ר הַ/שֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַ/סּוֹבֵ֔ב אֵ֖ת כָּל אֶ֥רֶץ כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: ml
  text: രണ്ടാമത്തെ നദിയുടെ പേര് ഗീഹോൻ ആണ്; കൂശ് ദേശം മുഴുവനും ചുറ്റി ഒഴുകുന്നത് അതാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂശ് ദേശം മുഴുവനും ചുറ്റിയിരിക്കുന്നത് അതാണ്.’
    reason: lexical_alternative
  - marker: b
    text: ‘കൂശ്’ പരമ്പരാഗതമായി ഈജിപ്തിന്റെ തെക്കുള്ള പ്രദേശങ്ങളുമായി ബന്ധപ്പെടുത്തപ്പെടുന്ന ഒരു സ്ഥലനാമമാണ്; ഹീബ്രു പാഠം പുരാതന നാമം തന്നെ നിലനിർത്തുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: പേര്
  rationale: വാക്യാരംഭത്തിലെ וְ മുൻവിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തി. שֵׁם എന്നത് നേരിട്ട് ‘പേര്’ എന്നാണ്.
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: രണ്ടാമത്തെ നദിയുടെ
  rationale: നദികളുടെ ക്രമത്തിലുള്ള രണ്ടാമത്തേതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: גִּיחוֹן
  choice: ഗീഹോൻ
  rationale: പുരാതന നദിയുടെ പേര് അർത്ഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הוּא
  choice: അതാണു്
  rationale: മുൻപ് പേരെടുത്ത നദിയെ തുടർന്നുള്ള വിവരണവുമായി തിരിച്ചറിയിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘അതാണു്’ എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: הַ/סּוֹבֵב
  choice: ചുറ്റി ഒഴുകുന്നത്
  rationale: סבב എന്ന പദത്തിന്റെ ‘ചുറ്റുക/ചുറ്റിപ്പോകുക’ എന്ന പങ്കാളിവിശേഷണാർഥം നദിയെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഒഴുകുന്നത്’ സന്ദർഭസൂചിതമാണ്, എന്നാൽ പൂർണമായി വളയുന്നു എന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: אֵת כָּל אֶרֶץ
  choice: ദേശം മുഴുവനും
  rationale: כָּל אֶרֶץ എന്നത് ഭൂപ്രദേശത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്നു; ‘ദേശം മുഴുവനും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כּוּשׁ
  choice: കൂശ്
  rationale: പുരാതന സ്ഥലനാമം തന്നെ മലയാളലിപിയിൽ നിലനിർത്തുന്നു; ‘എത്യോപ്യ’ എന്നു നൽകുന്നത് കാല-ഭൂമിശാസ്ത്രപരമായ വ്യാഖ്യാനം അനാവശ്യമായി നിർണ്ണയിച്ചേക്കാം.
