  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ നിർബന്ധിക്കാതെ പുരാതന പേരുകൾ ലിപ്യന്തരിച്ചു; ഹീബ്രു പങ്കാളിവിശേഷണത്തിന്റെ തുടർച്ചയായ വിവരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു.
