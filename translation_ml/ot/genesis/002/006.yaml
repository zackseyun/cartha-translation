id: GEN.2.6
reference: Genesis 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֖ד יַֽעֲלֶ֣ה מִן הָ/אָ֑רֶץ וְ/הִשְׁקָ֖ה אֶֽת כָּל פְּנֵֽי הָֽ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: ml
  text: എന്നാൽ ഭൂമിയിൽനിന്ന് ഒരു മൂടൽമഞ്ഞ് ഉയർന്ന് നിലത്തിന്റെ ഉപരിതലം മുഴുവൻ നനയ്ക്കുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീരൊഴുക്ക്’ എന്നോ ‘ഒഴുക്ക്’ എന്നോ ആകാം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം അപൂർവമാണ്. വായുവിലെ മൂടൽമഞ്ഞിനേക്കാൾ, ഭൂമിയിൽനിന്ന് ഉറവുപോലെ പൊങ്ങിവരുന്ന വെള്ളത്തെയാകാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: എന്നാൽ ... ഒരു മൂടൽമഞ്ഞ്
  rationale: וְ മുൻവാക്യത്തിലെ മഴയില്ലായ്മയോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. അപൂർവവും അർഥവിവാദമുള്ളതുമായ אֵד-ന്, ഭൂമിയിൽനിന്ന് ഉയരുന്നു എന്ന ക്രിയയോട് സ്വാഭാവികമായി ചേരുന്ന ‘മൂടൽമഞ്ഞ്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റു ജലപ്രവാഹസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יַעֲלֶה
  choice: ഉയർന്നുവന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ കാൽ അപൂർണ്ണരൂപം കഴിഞ്ഞകാല പശ്ചാത്തലത്തിലെ പതിവായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള നനയ്ക്കൽപ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഉയർന്നുവന്ന്’ ഉപയോഗിച്ചു.
- source_word: מִן הָ/אָ֑רֶץ
  choice: ഭൂമിയിൽനിന്ന്
  rationale: സൃഷ്ടിവിവരണത്തിന്റെ വിശാല പശ്ചാത്തലത്തിൽ אֶרֶץ-ന് ‘ഭൂമി’ യോജിക്കുന്നു; അതേ വാക്യത്തിലെ אֲדָמָה-യിൽനിന്നുള്ള പദവ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: וְ/הִשְׁקָה
  choice: നനച്ചിരുന്നു
  rationale: שקה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘വെള്ളം കൊടുക്കുക/നനയ്ക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; കഴിഞ്ഞകാലത്തിലെ പതിവോ തുടർച്ചയോ സൂചിപ്പിക്കാൻ ‘നനച്ചിരുന്നു’ എന്നു പ്രയോഗിച്ചു.
- source_word: אֶת כָּל פְּנֵי
  choice: ഉപരിതലം മുഴുവൻ
  rationale: ‘മുഖം മുഴുവൻ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്ഥലപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഉപരിതലം മുഴുവൻ’ എന്നു നൽകി.
- source_word: הָֽ/אֲדָמָֽה
  choice: നിലത്തിന്റെ
  rationale: אֲדָמָה കൃഷിയോഗ്യമായ നിലത്തെയോ മണ്ണിനെയോ സൂചിപ്പിക്കുന്നു. ‘നിലം’ എന്നത് സ്വാഭാവികവും, മുൻപുള്ള אֶרֶץ-ന് നൽകിയ ‘ഭൂമി’യിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: אֵד എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: മൂടൽമഞ്ഞ്
  alternative: അരുവി, ഉറവുപോലെ പൊങ്ങിവരുന്ന ജലപ്രവാഹം
  rationale: אֵד അപൂർവവും അർഥം അനിശ്ചിതവുമായ പദമാണ്. ‘ഉയരുക’ എന്ന ക്രിയയോട് ‘മൂടൽമഞ്ഞ്’ നേരിട്ട് യോജിക്കുന്നതിനാൽ അത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഭൂമിയിൽനിന്ന് വെള്ളം പൊങ്ങിവരുന്ന പ്രവാഹമാകാമെന്ന ജലശാസ്ത്രപരമായ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ച് അനിശ്ചിതത്വം മറച്ചുവച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ഭൂമി’ (אֶרֶץ), ‘നിലം’ (אֲדָמָה) എന്നീ പദങ്ങൾ വേർതിരിച്ചു. ‘ഉയർന്നുവന്ന് ... നനച്ചിരുന്നു’ എന്ന ഘടന കഴിഞ്ഞകാലത്തിലെ പതിവായ/സ്വഭാവസവിശേഷമായ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
