id: GEN.2.24
reference: Genesis 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: ml
  text: അതുകൊണ്ട് ഒരു പുരുഷൻ തന്റെ അപ്പനെയും അമ്മയെയും വിട്ട് ഭാര്യയോടു പറ്റിച്ചേരും[a]; അവർ ഏകശരീരമായിത്തീരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുറുകെപ്പറ്റുക’ അല്ലെങ്കിൽ ‘ചേർന്നുനിൽക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയ ദൃഢമായ അടുപ്പത്തെയോ പറ്റിച്ചേരലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഏകശരീരം’ എന്ന എബ്രായപ്രയോഗത്തിൽ ശാരീരിക ഐക്യവും ഒരു പുതിയ ബന്ധുത്വത്തിന്റെ രൂപീകരണവും ഉൾപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനവും കാരണബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַעֲזָב
  choice: വിട്ട്
  rationale: ഇവിടെ ഉപേക്ഷിച്ചുകളയുക എന്ന ശക്തമായ അർഥമല്ല, പുതിയ കുടുംബബന്ധം രൂപപ്പെടുമ്പോൾ മാതാപിതാക്കളിൽനിന്നു വേർപെടുക എന്ന പൊതുതത്ത്വമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ഏകവചനത്തെ പ്രതിനിധാനപരമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָבִיו ... אִמּוֹ
  choice: തന്റെ അപ്പനെയും അമ്മയെയും
  rationale: എബ്രായം മാതാപിതാക്കളെ ഓരോരുത്തരായും പരാമർശിക്കുന്നതിനാൽ രണ്ടും പ്രത്യേകം നിലനിർത്തുന്നു; ‘തന്റെ’ എന്നത് ഇരുവരോടുമുള്ള ബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְדָבַק
  choice: പറ്റിച്ചേരും
  rationale: ദൃഢമായി ചേർന്നുനിൽക്കുക, മുറുകെപ്പിടിക്കുക എന്നീ ആശയങ്ങളുള്ള דבק എന്ന ക്രിയയുടെ ശക്തമായ ബന്ധഭാവം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: בְּאִשְׁתּוֹ
  choice: ഭാര്യയോട്
  rationale: ഈ വിവാഹസന്ദർഭത്തിൽ אִשָּׁה എന്ന പദം ‘സ്ത്രീ’ എന്ന പൊതുവർഗത്തെയല്ല, ഭാര്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָיוּ לְבָשָׂר אֶחָד
  choice: അവർ ഏകശരീരമായിത്തീരും
  rationale: ഇരുവരും ഒരു പുതിയ ഏകതയിലേക്കു വരുന്നതെന്ന ഫലഭാവം ‘ആയിത്തീരും’ വ്യക്തമാക്കുന്നു; ‘ഏകശരീരം’ ശാരീരിക ഐക്യത്തെയും പുതിയ ബന്ധുത്വബന്ധത്തെയും അതിവ്യാഖ്യാനം ചെയ്യാതെ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: വിവാഹസൂത്രത്തിലെ ലിംഗസൂചകമായ പ്രതിനിധാനഭാഷ
  choice: ഒരു പുരുഷൻ
  alternative: ഒരു വ്യക്തി / ഒരാൾ
  rationale: മൂലപാഠത്തിലെ אִישׁ വ്യക്തമായി പുല്ലിംഗ ഏകവചനമാണ്; അതിനെ ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ പ്രതിനിധാനപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- issue: പ്രസ്താവനയുടെ സ്വഭാവം
  choice: പൊതുവായതും മാനദണ്ഡസ്വഭാവമുള്ളതുമായ തത്ത്വമായി ഭാവികാലരൂപത്തിൽ വിവർത്തനം ചെയ്യുക
  alternative: നേരിട്ടുള്ള കല്പനയായി അല്ലെങ്കിൽ പഴയ ആചാരത്തിന്റെ വിവരണമായി വിവർത്തനം ചെയ്യുക
  rationale: എബ്രായ ക്രിയാരൂപങ്ങൾ സൃഷ്ടിവിവരണത്തിൽ അധിഷ്ഠിതമായ ഒരു പൊതുതത്ത്വം അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത നേരിട്ടുള്ള ആജ്ഞ ചേർക്കുന്നില്ല.
- issue: ‘ഏകശരീരം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: പ്രയോഗത്തെ സംക്ഷിപ്തമായി നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുക
  alternative: പ്രധാനവാക്യത്തിൽ തന്നെ ലൈംഗിക ഐക്യം അല്ലെങ്കിൽ വിവാഹബന്ധം എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക
  rationale: മൂലപ്രയോഗം ശാരീരിക ഐക്യവും പുതിയ ബന്ധുത്വബന്ധവും ഉൾക്കൊള്ളുന്നു; അവയിൽ ഒന്നായി മാത്രം ചുരുക്കുന്നത് പാഠത്തിന്റെ സമൃദ്ധിയും ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തിയും കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പറ്റിച്ചേരും’ എന്നത് דבק എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; ‘ഏകശരീരം’ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗമായി സൂക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
