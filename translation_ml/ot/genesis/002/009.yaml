id: GEN.2.9
reference: Genesis 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: ml
  text: യഹ്‌വെ ദൈവം നിലത്തുനിന്ന് കാഴ്ചയ്ക്ക് മനോഹരവും[a] ഭക്ഷിക്കാൻ നല്ലതുമായ എല്ലാ വൃക്ഷങ്ങളും മുളപ്പിച്ചു. തോട്ടത്തിന്റെ നടുവിൽ ജീവവൃക്ഷവും നന്മതിന്മകളെക്കുറിച്ചുള്ള അറിവിന്റെ വൃക്ഷവും[b] അവൻ മുളപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാണാൻ ആകർഷകവും.”
    reason: lexical_alternative
  - marker: b
    text: “നന്മതിന്മകളെക്കുറിച്ചുള്ള അറിവ്” എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. ഇത് ധാർമിക വിവേചനത്തെയോ പക്വതയെയോ സമഗ്രജ്ഞാനത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന കാര്യത്തിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ ഭിന്നാഭിപ്രായമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: മുളപ്പിച്ചു
  rationale: צמח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമായതിനാൽ, ദൈവം വൃക്ഷങ്ങളെ വളരാൻ ഇടയാക്കി എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വെ ദൈവം
  rationale: יהוה എന്ന ദൈവനാമത്തെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്ത് വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; אֱלֹהִים എന്നത് ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מִן הָאֲדָמָה
  choice: നിലത്തുനിന്ന്
  rationale: ഇവിടെ אֲדָמָה സസ്യങ്ങൾ മുളച്ചുവരുന്ന മണ്ണിനെയോ നിലത്തെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘നിലത്തുനിന്ന്’ സ്വാഭാവികമാണ്.
- source_word: כָּל עֵץ
  choice: എല്ലാ വൃക്ഷങ്ങളും
  rationale: כָּל-നോടുകൂടിയ ഏകവചന സമാഹാരപ്രയോഗത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: കാഴ്ചയ്ക്ക് മനോഹരം
  rationale: കാണുമ്പോൾ ആനന്ദകരവും ആകർഷകവുമായ രൂപഭംഗി എന്ന അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְטוֹב לְמַאֲכָל
  choice: ഭക്ഷിക്കാൻ നല്ലത്
  rationale: ഭക്ഷ്യയോഗ്യതയെയും ഭക്ഷണമെന്ന നിലയിലെ ഗുണത്തെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക പരിഭാഷയാണ്.
- source_word: וְעֵץ הַחַיִּים
  choice: ജീവവൃക്ഷം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ പരമ്പരാഗതവും സുതാര്യവുമായ മലയാളരൂപം.
- source_word: בְּתוֹךְ הַגָּן
  choice: തോട്ടത്തിന്റെ നടുവിൽ
  rationale: בְּתוֹךְ എന്നതിന്റെ മധ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: നന്മതിന്മകളെക്കുറിച്ചുള്ള അറിവിന്റെ വൃക്ഷം
  rationale: ‘നന്മയും തിന്മയും അറിയുക’ എന്ന എബ്രായപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, അറിവിന്റെ വിഷയമായി നന്മതിന്മകളെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം പദവിനാമമായി മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ സമീപിക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: ‘നന്മതിന്മകളെക്കുറിച്ചുള്ള അറിവ്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ മൂലപ്രയോഗം നിലനിർത്തുക
  alternative: ധാർമിക വിവേചനം / പക്വത / സമഗ്രജ്ഞാനം
  rationale: ഈ പ്രയോഗത്തിന്റെ കൃത്യമായ വ്യാപ്തിയെക്കുറിച്ച് വ്യാഖ്യാതാക്കൾക്കിടയിൽ ഭിന്നതയുള്ളതിനാൽ, മുഖ്യപാഠം ഒരു പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. നീണ്ട എബ്രായ ഏകവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ ‘അവൻ മുളപ്പിച്ചു’ മൂലപാഠത്തിലെ അതേ ക്രിയയുടെ ആശയം ആവർത്തിച്ച് ബന്ധം വ്യക്തമാക്കുന്നു.
