revisions:
- from: പിന്നെ യഹ്‌വേ ദൈവം മനുഷ്യനെ എടുത്ത് ഏദെൻ തോട്ടത്തിൽ പാർപ്പിച്ചു[b]; തോട്ടം കൃഷിചെയ്യാനും അതിനെ കാത്തുസൂക്ഷിക്കാനുമായിരുന്നു അത്[a].
