  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: ml
  text: പിന്നെ യഹ്‌വേ ദൈവം മനുഷ്യനെ എടുത്ത് ഏദെൻ തോട്ടത്തിൽ പാർപ്പിച്ചു[b]; അതിൽ വേല ചെയ്യാനും അതിനെ കാത്തുസൂക്ഷിക്കാനുമായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനെ കൃഷിചെയ്യാനും അതിന് കാവൽനിൽക്കാനും.’ ഹീബ്രായ ക്രിയകൾക്ക് ‘വേലചെയ്യുക/കൃഷിചെയ്യുക’, ‘സൂക്ഷിക്കുക/കാവൽനിൽക്കുക/പരിപാലിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പാർപ്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ക്രിയയ്ക്ക് ‘വിശ്രമിപ്പിച്ചു’ എന്നോ ‘കുടിയിരുത്തി’ എന്നോ അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമവും പൊതുവായ ദൈവിക സ്ഥാനപ്പേരും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് സൃഷ്ടിക്കപ്പെട്ട ഏക മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: וַיַּנִּחֵהוּ
  choice: പാർപ്പിച്ചു
  rationale: തോട്ടത്തിൽ സ്ഥാപിക്കുക/കുടിയിരുത്തുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വിശ്രമിപ്പിച്ചു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְּגַן עֵדֶן
  choice: ഏദെൻ തോട്ടത്തിൽ
  rationale: ഹീബ്രായ സംയുക്തപദപ്രയോഗത്തിന്റെ സ്വാഭാവികവും പരിചിതവുമായ മലയാളരൂപം.
- source_word: לְעָבְדָהּ
  choice: തോട്ടം കൃഷിചെയ്യാനും
  rationale: עבד എന്ന പദത്തിന് വേലചെയ്യുക, സേവിക്കുക, കൃഷിചെയ്യുക എന്നീ അർഥങ്ങളുണ്ട്; തോട്ടം എന്ന കർമത്തോടൊപ്പം കൃഷിചെയ്യുക സന്ദർഭോചിതമാണ്, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּלְשָׁמְרָהּ
  choice: അതിനെ കാത്തുസൂക്ഷിക്കാനും
  rationale: שמר എന്നതിലെ സംരക്ഷിക്കുക, കാവൽനിൽക്കുക, ശ്രദ്ധയോടെ പരിപാലിക്കുക എന്നീ ഭാവങ്ങൾ മലയാളത്തിൽ വിശാലമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഏദെനിലെ മനുഷ്യന്റെ ചുമതലയുടെ സ്വഭാവം
  choice: തോട്ടം കൃഷിചെയ്യുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്ന ചുമതലയായി അവതരിപ്പിച്ചു.
  alternative: ഇത് മുഖ്യമായി പുരോഹിതശുശ്രൂഷയുടെയും വിശുദ്ധസ്ഥല കാവലിന്റെയും സാങ്കേതിക ഭാഷയാണെന്നോ, കാർഷികവേല മാത്രം ആണെന്നോ വ്യക്തമാക്കാമായിരുന്നു.
  rationale: עבד, שמר എന്നീ ക്രിയകൾക്ക് കാർഷികവും സേവന/കാവൽ ഭാവങ്ങളുമുണ്ട്. വാക്യം തന്നെ ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ആ പിരിമുറുക്കം വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
