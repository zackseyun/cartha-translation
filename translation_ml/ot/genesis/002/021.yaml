  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയായ ദൈവം മനുഷ്യന്റെ മേൽ ഗാഢനിദ്ര വരുത്തി; അവൻ ഉറങ്ങി. പിന്നെ അവന്റെ വാരിയെല്ലുകളിൽ ഒന്ന് എടുത്ത്, അതിന്റെ സ്ഥാനത്ത് മാംസം അടച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ വശങ്ങളിൽ ഒന്ന്.” എബ്രായപദത്തിന് വശം, പാർശ്വഭാഗം, അല്ലെങ്കിൽ വാരിയെല്ല് എന്നിങ്ങനെ അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: വരുത്തി
  rationale: נפל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമാണ്; ഗാഢനിദ്ര മനുഷ്യന്റെമേൽ വരാൻ ദൈവം ഇടയാക്കി എന്ന എബ്രായ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹോവയായ ദൈവം
  rationale: ദൈവനാമമായ יהוהയെ ‘യഹോവ’ എന്നും אֱלֹהִיםനെ ‘ദൈവം’ എന്നും നൽകി, സംയുക്ത ശീർഷകം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: תַּרְדֵּמָה
  choice: ഗാഢനിദ്ര
  rationale: സാധാരണ ഉറക്കത്തെക്കാൾ ആഴമുള്ള, ഇവിടെ ദൈവം വരുത്തുന്ന നിദ്രയെയാണ് ഈ നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി അല്ല, തുടർന്നുള്ള സംഭവത്തിലെ നിർദിഷ്ട മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഈ വ്യക്തിപരവും പുരുഷലിംഗപരവുമായ സന്ദർഭം നിലനിർത്തുന്നു.
- source_word: וַיִּישָׁן
  choice: അവൻ ഉറങ്ങിപ്പോയി
  rationale: സംഭവക്രമത്തിൽ ഗാഢനിദ്ര വന്നതിന്റെ ഫലമായി അവൻ ഉറങ്ങി എന്നത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקַּח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ്-തുടർച്ച സൂചിപ്പിക്കുന്ന അടുത്ത സംഭവത്തെ മലയാള കഥനക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: അവന്റെ വാരിയെല്ലുകളിൽ ഒന്ന്
  rationale: צֵלָעയ്ക്ക് ‘വശം’ എന്നും ‘വാരിയെല്ല്’ എന്നും അർത്ഥമാകാം. മാംസം അടയ്ക്കുന്ന ശരീരഘടനാപരമായ സന്ദർഭത്തിൽ ‘വാരിയെല്ല്’ സ്വാഭാവികമാണ്; മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: മാംസം അടച്ചു
  rationale: סגר എന്നത് ‘അടയ്ക്കുക’ എന്നാണ്; എടുത്ത ശരീരഭാഗത്തിന്റെ സ്ഥലം മാംസത്താൽ അടച്ചുവെന്ന ദൃശ്യത്തെ ചുരുക്കവും നേരിട്ടും നൽകുന്നു.
- source_word: תַּחְתֶּנָּה
  choice: അതിന്റെ സ്ഥാനത്ത്
  rationale: പദശഃ ‘അതിന്റെ കീഴിൽ’ എന്നാകാമെങ്കിലും, ഇവിടെ എടുത്ത ശരീരഭാഗം ഉണ്ടായിരുന്ന സ്ഥലത്തെയാണ് സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: הָאָדָם എന്ന പദത്തിന്റെ സന്ദർഭപരമായ അർത്ഥം
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യജീവി / ആദാം
  rationale: അടുത്ത വാക്യത്തിൽ സ്ത്രീയെ രൂപപ്പെടുത്തുന്നതിനായി ശരീരഭാഗം എടുക്കപ്പെടുന്ന നിർദിഷ്ട പുരുഷനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഈ ഘട്ടത്തിൽ എബ്രായം വ്യക്തിനാമരൂപമല്ലാതെ നിർദേശകപദത്തോടെയുള്ള ‘മനുഷ്യൻ’ എന്നാണ് പറയുന്നത്; അതിനാൽ ‘ആദാം’ എന്ന് മാറ്റിയില്ല.
- issue: צֵלָע എന്ന പദത്തിന്റെ അർത്ഥം
  choice: വാരിയെല്ല്
  alternative: വശം / പാർശ്വഭാഗം
  rationale: ശരീരത്തിൽനിന്ന് ഒരു ഭാഗം എടുത്തശേഷം മാംസം അടയ്ക്കുന്ന വിവരണം ശരീരഘടനാപരമായ ‘വാരിയെല്ല്’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ‘വശം’ എന്നത് യഥാർത്ഥവും വ്യാഖ്യാനപരമായി പ്രധാനവുമായ മറ്റൊരു അർത്ഥമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഗാഢനിദ്ര’, ‘വാരിയെല്ല്’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ പ്രധാന പദാർത്ഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
