- from: അതുകൊണ്ട് ദൈവം ഏഴാം ദിവസത്തെ അനുഗ്രഹിച്ച് അതിനെ വിശുദ്ധമാക്കി[a]. കാരണം, സൃഷ്ടിച്ചുണ്ടാക്കുന്നതിനായി ദൈവം ചെയ്ത തന്റെ സകല പ്രവൃത്തിയിൽനിന്നും ആ ദിവസം അവിടുന്ന് വിശ്രമിച്ചു[b][c].
  to: ദൈവം ഏഴാം ദിവസത്തെ അനുഗ്രഹിക്കുകയും അതിനെ വിശുദ്ധമാക്കുകയും ചെയ്തു[a]. കാരണം, ആ ദിവസം ദൈവം സൃഷ്ടിക്കുകയും ഉണ്ടാക്കുകയും ചെയ്ത തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും അവൻ വിശ്രമിച്ചു[b][c].
