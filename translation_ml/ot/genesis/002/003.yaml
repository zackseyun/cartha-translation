source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ אֱלֹהִים֙ אֶת י֣וֹם הַ/שְּׁבִיעִ֔י וַ/יְקַדֵּ֖שׁ אֹת֑/וֹ כִּ֣י ב֤/וֹ שָׁבַת֙ מִ/כָּל מְלַאכְתּ֔/וֹ אֲשֶׁר בָּרָ֥א אֱלֹהִ֖ים לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: ml
  text: ദൈവം ഏഴാം ദിവസത്തെ അനുഗ്രഹിക്കുകയും അതിനെ വിശുദ്ധമാക്കുകയും ചെയ്തു[a]. കാരണം, ആ ദിവസം ദൈവം സൃഷ്ടിക്കുകയും ഉണ്ടാക്കുകയും ചെയ്ത തന്റെ സകല പ്രവൃത്തികളിൽനിന്നും അവൻ വിശ്രമിച്ചു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അതിനെ വിശുദ്ധമായി വേർതിരിച്ചു” അല്ലെങ്കിൽ “അതിനെ വിശുദ്ധീകരിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: “വിശ്രമിച്ചു” എന്ന ഹീബ്രു ക്രിയയ്ക്ക് “നിർത്തി” അല്ലെങ്കിൽ “വിരമിച്ചു” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: അവസാനത്തെ ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്. അക്ഷരാർഥത്തോട് അടുത്ത്, “ദൈവം ചെയ്യുന്നതിനായി സൃഷ്ടിച്ച” എന്നാണ്. “ദൈവം സൃഷ്ടിച്ചു ചെയ്ത” അല്ലെങ്കിൽ “ദൈവം സൃഷ്ടിച്ചുണ്ടാക്കിയ” എന്നും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: പിയേൽ രൂപം ദിവസത്തിന്മേൽ അനുഗ്രഹം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ തുല്യപദം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടെ ഇവിടെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: നാമവും നിർദ്ദിഷ്ട ക്രമസംഖ്യയും നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: അതിനെ വിശുദ്ധമാക്കി
  rationale: പിയേൽ രൂപത്തിന്റെ വിശുദ്ധമാക്കുക/വിശുദ്ധമായി വേർതിരിക്കുക എന്ന ഫലാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ദിവസത്തെ അനുഗ്രഹിക്കുകയും വിശുദ്ധമാക്കുകയും ചെയ്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: בּוֹ
  choice: ആ ദിവസം
  rationale: അക്ഷരാർഥമായ 'അതിൽ' എന്നതിനെക്കാൾ ഒരു ദിവസത്തെ സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שָׁבַת
  choice: വിശ്രമിച്ചു
  rationale: ക്രിയയ്ക്ക് 'നിർത്തി/വിരമിച്ചു' എന്ന അർഥവും ഉണ്ടെങ്കിലും, സൃഷ്ടിവിവരണത്തിലെ ശബ്ബത്ത് ബന്ധം നിലനിർത്തുന്ന സ്ഥാപിതവും യോജിച്ചതുമായ പരിഭാഷയാണ്.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: തന്റെ സകല പ്രവൃത്തിയിൽനിന്നും
  rationale: מְלָאכָה എന്നതിന്റെ വിശാലമായ പ്രവൃത്തി/വേല എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: സൃഷ്ടിച്ചുണ്ടാക്കുന്നതിനായി ദൈവം ചെയ്ത
  rationale: അവസാനത്തെ ദുഷ്കരമായ ലേഅസോത് ഘടനയെ പൂർണമായി വ്യാഖ്യാനിച്ച് തീർക്കാതെ, ברא-עשה എന്നീ വ്യത്യസ്ത ക്രിയകളുടെ സാന്നിധ്യം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: שָׁבַת എന്ന ക്രിയയും ശബ്ബത്ത് ദൈവശാസ്ത്രവുമായുള്ള ബന്ധവും
  choice: വിശ്രമിച്ചു
  alternative: നിർത്തി / വിരമിച്ചു
  rationale: '''വിശ്രമിച്ചു'' എന്നത് ശബ്ബത്തുമായുള്ള കാനോനിക ബന്ധം നിലനിർത്തുന്നു; അതേസമയം ഈ ക്രിയ ദൈവത്തിന് ക്ഷീണം ഉണ്ടായിരുന്നുവെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. ശബ്ദാർഥത്തിലെ ''നിർത്തുക'' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.'
- issue: וַיְקַדֵּשׁ אֹתוֹ എന്നതിന്റെ പരിഭാഷ
  choice: അതിനെ വിശുദ്ധമാക്കി
  alternative: അതിനെ വിശുദ്ധമായി വേർതിരിച്ചു
  rationale: വിശുദ്ധിയുടെ ഭാഷയും ദിവസത്തിന്റെ പ്രത്യേക സമർപ്പണവും നിലനിർത്തുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദപ്രയോഗം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת എന്ന ദുഷ്കരമായ അവസാന ഘടന
  choice: സൃഷ്ടിച്ചുണ്ടാക്കുന്നതിനായി ദൈവം ചെയ്ത
  alternative: ദൈവം സൃഷ്ടിച്ചു ചെയ്ത / ദൈവം സൃഷ്ടിച്ചുണ്ടാക്കിയ
  rationale: ഹീബ്രുവിലെ ഉദ്ദേശ്യസൂചക അനന്തക്രിയയുടെ അസാധാരണതയും ברא, עשה എന്നീ രണ്ടു ക്രിയകളും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; ഒറ്റ നിർവചനത്തിലേക്ക് ദൈവശാസ്ത്രപരമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം സാധാരണ വായനക്കാരന് സ്വാഭാവികമായി ഉപയോഗിച്ചു. മുഖ്യവാക്യത്തിലെ ദുഷ്കരമായ അവസാന ഘടന വായനാസൗകര്യത്തിനായി മിതമായി ക്രമപ്പെടുത്തി; മൂലഭാഷയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പ് [c]-യിൽ വ്യക്തമാക്കി.
