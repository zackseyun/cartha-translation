id: GEN.2.16
reference: Genesis 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: ml
  text: 'യഹ്‌വേ ദൈവം ആ മനുഷ്യനോടു കല്പിച്ചു: “തോട്ടത്തിലെ ഓരോ വൃക്ഷത്തിൽനിന്നും നിനക്കു തീർച്ചയായും കഴിക്കാം.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കഴിക്കുക’ എന്ന ക്രിയയുടെ ഇൻഫിനിറ്റീവ് രൂപവും പരിമിതക്രിയാരൂപവും ചേർത്ത് ഊന്നൽ നൽകുന്നു. അല്ലെങ്കിൽ, “നിനക്കു ഇഷ്ടംപോലെ കഴിക്കാം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർവമായ ആജ്ഞാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവനാമമായ יהוהയെ ശീർഷകംകൊണ്ട് പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും, אֱלֹהִים എന്നത് ‘ദൈവം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: עַל הָאָדָם
  choice: മനുഷ്യനോടു
  rationale: സന്ദർഭത്തിൽ പുതുതായി സൃഷ്ടിക്കപ്പെട്ട ഏക മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘മനുഷ്യനോടു’ വ്യക്തിപരമായ ഏകവചനസൂചന നിലനിർത്തുകയും ‘ആ മനുഷ്യനോടു’ എന്നതിലേക്കാൾ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: 'കല്പിച്ചു:'
  rationale: നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന എബ്രായ ഉദ്ധരണിസൂചകത്തെ മലയാളത്തിൽ പ്രത്യേകമായി ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കാതെ കോളൻകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: തോട്ടത്തിലെ എല്ലാ വൃക്ഷങ്ങളിൽനിന്നും
  rationale: מן എന്ന ഉറവിട/തിരഞ്ഞെടുപ്പ് ആശയവും כֹּל എന്ന സമഗ്രതയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אָכֹל תֹּאכֵל
  choice: നിനക്കു ഇഷ്ടംപോലെ ഭക്ഷിക്കാം
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് + പരിമിതക്രിയ എന്ന ഊന്നൽഘടന ഇവിടെ നിർബന്ധമല്ല, വിശാലമായ അനുവാദമാണ്. ‘ഇഷ്ടംപോലെ ഭക്ഷിക്കാം’ അനുവാദവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ശീർഷകമാക്കി മാറ്റാതെ സാധാരണമായി അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הָאָדָם എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: മനുഷ്യൻ
  alternative: ആദാം; മനുഷ്യവർഗം
  rationale: ഇവിടെ കഥയിലെ ഏക വ്യക്തിയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; എന്നാൽ ഈ ഘട്ടത്തിൽ പദത്തെ നിർബന്ധമായി വ്യക്തിനാമമാക്കാതെ അതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- issue: אָכֹל תֹּאכֵל എന്ന ഘടനയുടെ ഭാവം
  choice: അനുവാദത്തോടുകൂടിയ ഊന്നൽ
  alternative: ഭക്ഷിക്കണമെന്ന കല്പന; ‘തീർച്ചയായും ഭക്ഷിക്കും’ എന്ന പ്രവചനം
  rationale: സന്ദർഭം തോട്ടത്തിലെ വൃക്ഷങ്ങളിൽനിന്ന് ഭക്ഷിക്കാനുള്ള സമൃദ്ധമായ സ്വാതന്ത്ര്യം നൽകുന്നതാണ്; ആജ്ഞയോ പ്രവചനമോ ആയി തീർപ്പാക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും ലാളിത്യവും സംയോജിപ്പിച്ചു. ‘കല്പിച്ചു’ എന്നത് അധികാരഭാവം നിലനിർത്തുന്നു; ഉദ്ധരണിസൂചകമായ לֵאמֹר കോളൻകൊണ്ട് സ്വാഭാവികമാക്കി. ‘ഇഷ്ടംപോലെ ഭക്ഷിക്കാം’ എന്ന പ്രയോഗം അനുമതിയെയും എബ്രായ ഊന്നലിനെയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
