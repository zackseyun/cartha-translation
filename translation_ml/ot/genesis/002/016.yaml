  to: 'യഹ്‌വേ ദൈവം ആ മനുഷ്യനോടു കല്പിച്ചു: “തോട്ടത്തിലെ ഓരോ വൃക്ഷത്തിൽനിന്നും നിനക്കു തീർച്ചയായും കഴിക്കാം.[a]”'
