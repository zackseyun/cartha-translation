id: GEN.2.20
reference: Genesis 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: ml
  text: മനുഷ്യൻ എല്ലാ വളർത്തുമൃഗങ്ങൾക്കും ആകാശത്തിലെ പക്ഷികൾക്കും വയലിലെ എല്ലാ വന്യമൃഗങ്ങൾക്കും പേരിട്ടു. എന്നാൽ മനുഷ്യന് അവനോടു പൊരുത്തപ്പെടുന്ന ഒരു സഹായി കണ്ടെത്തപ്പെട്ടില്ല.[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ആദാം എല്ലാ വളർത്തുമൃഗങ്ങൾക്കും ... പേരിട്ടു. എന്നാൽ ആദാമിന് അവനോടു പൊരുത്തപ്പെടുന്ന ഒരു സഹായി കണ്ടെത്തപ്പെട്ടില്ല.”'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “മനുഷ്യന് അവന് അനുയോജ്യമായ ഒരു സഹായി കണ്ടെത്തപ്പെട്ടില്ല.”'
    reason: lexical_alternative
  - marker: c
    text: 'ഹീബ്രുവിൽ: “അവൻ കണ്ടെത്തിയില്ല”; ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം: “എന്നാൽ മനുഷ്യൻ അവനോടു പൊരുത്തപ്പെടുന്ന ഒരു സഹായിയെ കണ്ടെത്തിയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: മനുഷ്യൻ / മനുഷ്യന്
  rationale: നിശ്ചയാർഥകപ്രത്യയമുള്ള ആദ്യ പ്രയോഗവും പിന്നീട് അതിലേക്കു തിരിച്ചുപോകുന്ന പ്രയോഗവും തോട്ടത്തിലെ വ്യക്തിയായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘മനുഷ്യൻ’ എന്നത് പൊതുനാമസ്വഭാവം നിലനിർത്തുകയും ഈ സന്ദർഭത്തിലെ പുരുഷവ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: പേരിട്ടു
  rationale: പേരുകൾ നൽകുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണിത്.
- source_word: הַבְּהֵמָה
  choice: വളർത്തുമൃഗങ്ങൾ
  rationale: ഇവിടെ വീട്ടിൽ വളർത്തപ്പെടുന്ന മൃഗങ്ങളുടെ വർഗമാണ് ഉദ്ദേശിക്കുന്നത്; തുടർന്ന് വരുന്ന വന്യമൃഗങ്ങളിൽനിന്നുള്ള വ്യത്യാസവും ഈ പദം വ്യക്തമാക്കുന്നു.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: ഹീബ്രു ദൃശ്യഭാവം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: വയലിലെ എല്ലാ വന്യമൃഗങ്ങൾ
  rationale: ‘വയലിലെ ജീവികൾ’ എന്ന മൂലരൂപത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട്, വളർത്തുമൃഗങ്ങൾക്ക് വിപരീതമായി സ്വതന്ത്രമായി ജീവിക്കുന്ന കരമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֵזֶר
  choice: സഹായി
  rationale: സഹായം നൽകുന്ന ഒരാളെ ഇവിടെ ഉദ്ദേശിക്കുന്നതിനാൽ വ്യക്തിവാചകമായ ‘സഹായി’ യോജിക്കുന്നു. ഈ പദം സ്വതവേ അധീനതയെയോ താഴ്ന്ന നിലയെയോ സൂചിപ്പിക്കുന്നില്ല.
- source_word: כְּנֶגְדּוֹ
  choice: അവനോടു പൊരുത്തപ്പെടുന്ന
  rationale: ‘അവന്റെ മുമ്പിൽ/അവനു തുല്യമായി അനുയോജ്യമായ’ എന്ന ബന്ധപരമായ ആശയം നിലനിർത്തുന്നു; വെറും പ്രയോജനപരമായ അനുയോജ്യതയായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: לֹא מָצָא
  choice: കണ്ടെത്തപ്പെട്ടില്ല
  rationale: ഹീബ്രുവിൽ കർത്തരി രൂപമായ ‘അവൻ കണ്ടെത്തിയില്ല’ എന്നാണ്. ഇവിടെ തിരച്ചിലിന്റെ ഫലമായി യോജിച്ച സഹായി ഇല്ലായിരുന്നു എന്നതിൽ ഊന്നൽ നൽകാൻ മലയാളത്തിൽ കർമണി രൂപം സ്വാഭാവികമാണ്; കർത്തരി രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 2:20-ലെ אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യൻ
  alternative: ആദാം
  rationale: ഈ ഘട്ടത്തിൽ പദത്തിന്റെ പൊതുനാമമായ ‘മനുഷ്യൻ’ എന്ന അർഥം ശക്തമാണ്, എങ്കിലും വ്യക്തിനാമമായി വായിക്കാനും കഴിയും. മുഖ്യപാഠം പൊതുനാമസ്വഭാവം നിലനിർത്തുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: כְּנֶגְדּוֹ എന്നതിലെ ബന്ധപരമായ ആശയം
  choice: അവനോടു പൊരുത്തപ്പെടുന്ന
  alternative: അവന് അനുയോജ്യമായ
  rationale: ഹീബ്രു പദം നേരെ മുന്നിലുള്ളതും അനുരൂപമായതുമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘പൊരുത്തപ്പെടുന്ന’ എന്നത് ഈ പരസ്പര അനുരൂപത നിലനിർത്തുന്നു; ‘അനുയോജ്യമായ’ സാധുവെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- issue: לֹא מָצָא എന്ന ക്രിയയുടെ കർത്താവ്
  choice: കണ്ടെത്തപ്പെട്ടില്ല
  alternative: അവൻ കണ്ടെത്തിയില്ല
  rationale: മൂലഭാഷയിലെ വ്യാകരണരൂപം കർത്തരിയാണെങ്കിലും, ആരാണ് തിരഞ്ഞത് എന്നതിൽ സാധ്യതയുള്ള വ്യാഖ്യാനഭാരം ചുമത്താതെ ഫലം പ്രകടിപ്പിക്കാൻ മുഖ്യപാഠത്തിൽ കർമണി രൂപം ഉപയോഗിച്ചു. മൂലരൂപത്തോട് നേരിട്ടുള്ള വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മൃഗം’, ‘പക്ഷി’, ‘സഹായി’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ പൊതുനാമ/വ്യക്തിനാമ അനിശ്ചിതത്വവും കർത്തരി/കർമണി സാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
