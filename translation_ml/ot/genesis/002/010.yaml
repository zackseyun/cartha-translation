translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജലസേചനം ചെയ്യുക’ എന്ന സാങ്കേതിക പ്രയോഗത്തിനു പകരം ‘നനയ്ക്കുക’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘ശാഖകളായി’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
