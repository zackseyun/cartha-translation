source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: ml
  text: ഒരു നദി ഏദെനിൽനിന്ന് പുറപ്പെട്ട് തോട്ടത്തെ നനയ്ക്കാൻ ഒഴുകി; അവിടെനിന്ന് അത് പിരിഞ്ഞ് നാല് ശാഖകളായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നാല് തലകൾ”; ഇവിടെ എബ്രായപദം നദിയുടെ നാല് പ്രധാന വിഭജനങ്ങളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: ഒരു നദി
  rationale: נָהָר എന്നത് ‘നദി’ എന്നാണ്. തുടക്കത്തിലെ וְ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം ആരംഭിക്കാം.
- source_word: יֹצֵא
  choice: ഒഴുകി
  rationale: יצא എന്ന കൃതന്തം തുടർച്ചയായി പുറത്തേക്കു പോകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; നദിയുടെ സന്ദർഭത്തിൽ ‘ഒഴുകി’ സ്വാഭാവികമാണ്. ‘നനച്ചിരുന്നു’ എന്നതോടു ചേർന്ന് തുടരുന്ന ഭാവം ലഭിക്കുന്നു.
- source_word: מֵעֵדֶן
  choice: ഏദെനിൽനിന്ന്
  rationale: מִן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ‘ഏദെനിൽനിന്ന്’ അതിനെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: לְהַשְׁקוֹת
  choice: തോട്ടത്തെ നനച്ചിരുന്നു
  rationale: שׁקהയുടെ ഹിഫീൽ അനന്തരൂപം ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു—തോട്ടത്തിനു വെള്ളം നൽകുക. മലയാളത്തിൽ ‘നനയ്ക്കാൻ’ എന്നതും സാധ്യമെങ്കിലും, നദിയുടെ തുടരുന്ന പ്രവർത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘നനച്ചിരുന്നു’ തെരഞ്ഞെടുത്തു.
- source_word: אֶת־הַגָּן
  choice: തോട്ടത്തെ
  rationale: നിർദ്ദിഷ്ട പ്രത്യക്ഷകർമമായ ‘തോട്ടം’ മലയാളത്തിൽ കർമവിഭക്തിയോടെ നൽകിയിരിക്കുന്നു.
- source_word: וּמִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: നദിയുടെ ഗതിയിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: יִפָּרֵד
  choice: അത് പിരിഞ്ഞ്
  rationale: פרדയുടെ നിഫാൽ രൂപം ‘പിരിയുക’ അഥവാ ‘വിഭജിക്കപ്പെടുക’ എന്നർഥം നൽകുന്നു. നദിയെ കർത്താവാക്കി ‘പിരിഞ്ഞ്’ എന്നു നൽകിയതിലൂടെ മൂലത്തിലെ മധ്യ/അകർമക സാധ്യത നിലനിർത്തുന്നു.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: നാല് ശാഖകളായി
  rationale: היה + לְ ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. רָאשִׁים അക്ഷരാർഥത്തിൽ ‘തലകൾ’ ആണെങ്കിലും ഇവിടെ നദിയുടെ പ്രധാന വിഭജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ശാഖകൾ’ ഉപയോഗിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
