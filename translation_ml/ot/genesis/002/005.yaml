id: GEN.2.5
reference: Genesis 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: ml
  text: വയലിലെ ഒരു കുറ്റിച്ചെടിയും അപ്പോഴും ഭൂമിയിൽ ഉണ്ടായിരുന്നില്ല[a]; വയലിലെ ഒരു ചെടിയും അപ്പോഴും മുളച്ചിരുന്നില്ല; കാരണം യഹോവ ദൈവം ഭൂമിയിൽ മഴ പെയ്യിച്ചിരുന്നില്ല[b], നിലം കൃഷി ചെയ്യാൻ ഒരു മനുഷ്യനും ഉണ്ടായിരുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വയലിലെ കുറ്റി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹോവ ദൈവം’; ചില പരിഭാഷകളിൽ ‘കർത്താവായ ദൈവം.’
    reason: alternative_reading
  - marker: c
    text: ‘നിലം പണിയാൻ ഒരു മനുഷ്യനും ഉണ്ടായിരുന്നില്ല’; അല്ലെങ്കിൽ, ‘മണ്ണ് കൃഷി ചെയ്യാൻ ഒരു മനുഷ്യനും ഉണ്ടായിരുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: വയലിലെ കുറ്റിച്ചെടി
  rationale: שִׂיחַ എന്നത് പൊതുവായ സസ്യമല്ല, കുറ്റിച്ചെടി/കുറ്റിക്കാട് വിഭാഗത്തിലുള്ള ചെടിയെയാണ് സൂചിപ്പിക്കുന്നത്. അടുത്ത ഭാഗത്തിലെ עֵשֶׂב എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: അന്നുവരെ ഭൂമിയിൽ ഉണ്ടായിരുന്നില്ല
  rationale: טֶרֶם എന്നതിന്റെ ‘ഇനിയും ഉണ്ടായിട്ടില്ല/അതുവരെ ഉണ്ടായിട്ടില്ല’ എന്ന കാലാർഥവും, בָאָרֶץ എന്നതിന്റെ സൃഷ്ടിവിവരണസന്ദർഭത്തിലെ ‘ഭൂമിയിൽ’ എന്ന വിശാലാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: വയലിലെ ചെടി
  rationale: עֵשֶׂב സസ്യവർഗത്തെ വിശാലമായി സൂചിപ്പിക്കാം. ‘ചെടി’ എന്നത് ആധുനിക മലയാളത്തിൽ ലളിതമാണ്; അതേസമയം שִׂיחַ-നു നൽകിയ ‘കുറ്റിച്ചെടി’യിൽനിന്നുള്ള വ്യത്യാസം കാക്കുന്നു.
- source_word: טֶרֶם יִצְמָח
  choice: അന്നുവരെ മുളച്ചിരുന്നില്ല
  rationale: צמח എന്നതിലെ മുളയ്ക്കുക/വളർന്നുവരുക എന്ന ആശയം ‘മുളച്ചിരുന്നില്ല’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ כִּי മുൻപറഞ്ഞ അവസ്ഥയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു; ആ കാരണബന്ധം ആധുനിക മലയാളത്തിൽ ‘കാരണം’ വ്യക്തമായി നൽകുന്നു.
- source_word: הִמְטִיר
  choice: മഴ പെയ്യിച്ചിരുന്നില്ല
  rationale: מטר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം—മഴ പെയ്യിക്കുക—നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹോവ ദൈവം
  rationale: ദൈവനാമമായ יהוה-യെ പേരായി ‘യഹോവ’ എന്നു നൽകുകയും אֱלֹהִים-നെ ‘ദൈവം’ എന്നു നൽകുകയും ചെയ്യുന്നു; ഹീബ്രുവിലെ സംയുക്തനാമത്തിന്റെ ഘടന അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ കാക്കുന്നു.
- source_word: וְאָדָם אַיִן
  choice: മനുഷ്യനും ഉണ്ടായിരുന്നില്ല
  rationale: ഇവിടെ אָדָם ഒരു വ്യക്തിനാമമായി നിർബന്ധമായും വായിക്കേണ്ടതില്ല; നിലം കൃഷിചെയ്യുന്ന മനുഷ്യന്റെ അഭാവമാണ് സന്ദർഭം. ‘മനുഷ്യൻ’ ഏകവചനവും മനുഷ്യവർഗസൂചനയും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: നിലം കൃഷിചെയ്യാൻ
  rationale: עבד-ന്റെ ജോലി ചെയ്യുക/കൃഷിചെയ്യുക എന്ന സന്ദർഭാർഥവും אֲדָמָה-യുടെ മണ്ണ്/നിലം എന്ന അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: ഭൂമി / നിലം
  rationale: אֶרֶץ എന്ന വിശാലമായ ഭൂമി/ദേശം എന്ന പദവും, കൃഷിയുമായി ബന്ധപ്പെട്ട אֲדָמָה എന്ന നിലം/മണ്ണ് എന്ന പദവും തമ്മിലുള്ള ഹീബ്രു വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് ഒരു ബിരുദമാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു; പതിവനുസരിച്ചുള്ള ‘കർത്താവ്’ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: אָדָם എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: മനുഷ്യൻ
  alternative: ആൺമനുഷ്യൻ / ആദാം
  rationale: ഈ വാക്യത്തിൽ പ്രത്യേക വ്യക്തിയുടെ പേര് എന്നതിലുപരി നിലം കൃഷിചെയ്യുന്ന മനുഷ്യന്റെ അഭാവമാണ് മുൻനിരയിൽ. ‘മനുഷ്യൻ’ ലിംഗം അനാവശ്യമായി ചുരുക്കാതെ പ്രതിനിധാന ഏകവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭൂമി/നിലം’, ‘കുറ്റിച്ചെടി/ചെടി’ എന്നീ പദജോടികളിലൂടെ മൂലപാഠത്തിലെ പ്രധാന നിഘണ്ടുവ്യത്യാസങ്ങൾ നിലനിർത്തി. ‘യാതൊരു…യും … ഇല്ല’ എന്ന ഘടന ഹീബ്രുവിലെ സമഗ്ര നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
