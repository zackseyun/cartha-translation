id: GEN.2.8
reference: Genesis 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: ml
  text: യഹ്‌വേ ദൈവം ഏദെനിൽ, കിഴക്കുഭാഗത്ത്[a], ഒരു തോട്ടം നട്ടു; താൻ രൂപപ്പെടുത്തിയ മനുഷ്യനെ അവിടെ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കിഴക്കോട്ട്.” ഹീബ്രു പ്രയോഗം സ്ഥലത്തെ (“കിഴക്കുഭാഗത്ത്”) അല്ലെങ്കിൽ ദിശയെ/അഭിമുഖതയെ (“കിഴക്കോട്ട്”) സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: നട്ടു
  rationale: נטע എന്ന ക്രിയ സസ്യങ്ങൾ നട്ടുവളർത്തുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; തോട്ടത്തിന്റെ സന്ദർഭത്തിൽ ‘നട്ടു’ ലളിതവും കൃത്യവുമാണ്.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: יְהוָה എന്ന ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്ത്, אֱלֹהִים എന്നത് ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: גַּן
  choice: ഒരു തോട്ടം
  rationale: גן കൃഷിചെയ്തോ പരിപാലിച്ചോ ഉള്ള തോട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തോട്ടം’ വ്യക്തവും സ്വാഭാവികവുമാണ്. ഹീബ്രുവിൽ അനിശ്ചിത ആർട്ടിക്കിൾ ഇല്ലെങ്കിലും മലയാളവാക്യത്തിൽ പുതിയ പരാമർശം സ്വാഭാവികമാക്കാൻ ‘ഒരു’ ചേർത്തു.
- source_word: בְעֵדֶן
  choice: ഏദെനിൽ
  rationale: עֵדֶן ഇവിടെ സ്ഥലനാമമായതിനാൽ മലയാളത്തിൽ ‘ഏദെൻ’ എന്നു ലിപ്യന്തരണം ചെയ്ത് സ്ഥാനവിഭക്തി ചേർത്തു.
- source_word: מִקֶּדֶם
  choice: കിഴക്കുഭാഗത്ത്
  rationale: സന്ദർഭത്തിൽ ഇത് തോട്ടത്തിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്നതായി വായിക്കാം. എന്നാൽ ദിശയെയോ അഭിമുഖതയെയോ സൂചിപ്പിക്കുന്ന ‘കിഴക്കോട്ട്’ എന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיָּשֶׂם שָׁם
  choice: അവിടെ ആക്കി
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ ‘വെക്കുക/ആക്കുക’ എന്ന അർഥവും שָׁם എന്ന സ്ഥലസൂചനയും ലളിതമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ
  rationale: നേരത്തേ രൂപപ്പെടുത്തിയ നിർദിഷ്ട മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മനുഷ്യൻ’ ഹീബ്രുവിലെ אָדָם എന്ന പദത്തിന്റെ മനുഷ്യസ്വഭാവവും വ്യക്തിപരമായ പരാമർശവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָצָר
  choice: താൻ രൂപപ്പെടുത്തിയ
  rationale: יצר എന്നത് ‘രൂപപ്പെടുത്തുക’ എന്നാണ്; ബന്ധവാക്യത്തിലെ കർത്താവ് യഹ്‌വേ ദൈവമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘താൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റൺ നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: הָאָדָם എന്നതിന്റെ അർഥപരിധി
  choice: മനുഷ്യൻ
  alternative: പുരുഷൻ; ആദാം
  rationale: ഇവിടെ നിർദിഷ്ടമായി മുമ്പ് രൂപപ്പെടുത്തിയ മനുഷ്യവ്യക്തിയാണ് ഉദ്ദേശ്യം. എന്നാൽ ഈ ഘട്ടത്തിൽ ഹീബ്രു പദത്തെ വ്യക്തിനാമമായ ‘ആദാം’ എന്നു നിർബന്ധമായി വായിക്കേണ്ടതില്ല; ‘മനുഷ്യൻ’ എന്നത് പദപ്രയോഗത്തിലെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഹീബ്രു വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി; מִקֶּדֶם എന്നതിലെ യഥാർത്ഥ ദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
