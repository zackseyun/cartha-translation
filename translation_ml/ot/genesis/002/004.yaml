source:
  edition: WLC
  text: אֵ֣לֶּה תוֹלְד֧וֹת הַ/שָּׁמַ֛יִם וְ/הָ/אָ֖רֶץ בְּ/הִבָּֽרְאָ֑/ם בְּ/י֗וֹם עֲשׂ֛וֹת יְהוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְ/שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: ml
  text: 'ആകാശത്തിന്റെയും ഭൂമിയുടെയും ഉത്ഭവവിവരം[a] ഇതാണ്: അവ സൃഷ്ടിക്കപ്പെട്ടപ്പോൾ, യാഹ്‌വെ ദൈവം[c] ഭൂമിയും ആകാശവും ഉണ്ടാക്കിയ നാളിൽ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ തൊലെദോത്ത് എന്ന പദത്തിന് അക്ഷരാർഥത്തിൽ ‘തലമുറകൾ’ എന്നു പറയാം; ഉല്പത്തി പുസ്തകത്തിലെ വിഭാഗശീർഷകങ്ങളിൽ അത് ‘വിവരണം’, ‘ചരിത്രം’, ‘ഉത്ഭവം’ എന്നീ അർത്ഥങ്ങളിലും വരാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ‘ബെയോം’ (‘നാളിൽ’) എന്ന പ്രയോഗം ഇവിടെ ‘അപ്പോൾ’, ‘ആ സമയത്ത്’, ‘എപ്പോൾ’ എന്ന കാലസൂചനയായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠത്തിലെ ദൈവനാമം יהוה (YHWH) ആണ്. അതിന്റെ ഉച്ചാരണം സാധാരണയായി ‘യാഹ്‌വെ’ എന്നു പുനർനിർമിക്കുന്നു; പാരമ്പര്യമായി ‘കർത്താവ്’ എന്നും ‘യഹോവ’ എന്നും നൽകാറുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇതാണ്
  rationale: എബ്രായത്തിലെ ബഹുവചന സൂചകപദം ഒരു വിഭാഗശീർഷകം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇവയാണ്’ എന്നതിനെക്കാൾ ‘ഇതാണ്’ എന്ന ഏകവചനപ്രയോഗം ‘ഉത്പത്തിവിവരം’ എന്ന സമാഹാരനാമത്തോടു സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: תּוֹלְדוֹת
  choice: ഉത്പത്തിവിവരം
  rationale: ഉത്ഭവിച്ചതെന്ത്, തുടർന്നുവന്ന ചരിത്രം, വംശപരമ്പര എന്നിവയെ സൂചിപ്പിക്കാവുന്ന ഉല്പത്തി പുസ്തകത്തിലെ ആവർത്തിത ഘടനാപദമാണിത്. ആകാശത്തിന്റെയും ഭൂമിയുടെയും പശ്ചാത്തലത്തിൽ ‘തലമുറകൾ’ അസ്വാഭാവികമായതിനാൽ ‘ഉത്പത്തിവിവരം’ വ്യക്തതയും പദത്തിന്റെ വിശാലതയും ചേർത്ത് നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: ആകാശവും ഭൂമിയും
  rationale: സൃഷ്ടലോകത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പരിചിതമായ പദജോടി. שָׁמַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ആ അർത്ഥവ്യാപ്തി മലയാളത്തിലെ സമാഹാരനാമമായ ‘ആകാശം’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בְּהִבָּרְאָם
  choice: സൃഷ്ടിക്കപ്പെട്ടപ്പോഴുള്ള
  rationale: בְּ ചേർന്ന നിഫാൽ infinitive construct കാലസംബന്ധമായ അർത്ഥവും കർമണിപ്രയോഗവും നൽകുന്നു. ഈ രൂപം ‘when they were created’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּיוֹם
  choice: നാളിൽ
  rationale: മൂലത്തിലെ ‘ദിവസത്തിൽ/നാളിൽ’ എന്ന സാഹിത്യരൂപം സൂക്ഷിക്കുന്നു. ഇത് ഒരു ഇരുപത്തിനാലുമണിക്കൂർ ദിവസത്തെ നിർബന്ധമായി സൂചിപ്പിക്കാതെ ‘അപ്പോൾ/ആ സമയത്ത്’ എന്ന കാലസൂചനയായിരിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עֲשׂוֹת
  choice: ഉണ്ടാക്കിയ
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളസമാനപദം; בְּיוֹם എന്നതിനോടൊപ്പം കാലവാക്യം രൂപപ്പെടുത്തുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യാഹ്‌വെ ദൈവം
  rationale: വ്യക്തിനാമമായ יהוה-യെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהִים ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: ഭൂമിയും ആകാശവും
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ക്രമം മറിച്ചുള്ള എബ്രായ പദക്രമം സാഹിത്യപ്രഭാവത്തിനായി മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ നാലക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലെന്നും പാരമ്പര്യപരമായ മറ്റു രൂപങ്ങൾ ഉണ്ടെന്നും അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: בְּיוֹם എന്നത് സൃഷ്ടിയുടെ ഒരു നിർദ്ദിഷ്ട ഇരുപത്തിനാലുമണിക്കൂർ ദിവസമെന്നോ കാലസൂചനയെന്നോ വായിക്കുന്നത്
  choice: മൂലരൂപം പ്രതിഫലിപ്പിക്കുന്ന ‘നാളിൽ’ നിലനിർത്തി, പ്രയോഗത്തിന്റെ കാലസൂചനാ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ‘ഉണ്ടാക്കിയപ്പോൾ’
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യരൂപം മായ്ക്കാതെയും അതിനെ നിർബന്ധമായി കർശന കാലദൈർഘ്യമായി വ്യാഖ്യാനിക്കാതെയും ഇരിക്കാൻ ഈ രൂപം സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉത്പത്തിവിവരം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി തെരഞ്ഞെടുത്തപ്പോൾ תּוֹלְדוֹת എന്ന ഘടനാപദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ആദ്യത്തെ ‘ആകാശവും ഭൂമിയും’ എന്ന ക്രമവും അവസാനത്തെ ‘ഭൂമിയും ആകാശവും’ എന്ന മറുക്രമവും മനപ്പൂർവം നിലനിർത്തി.
