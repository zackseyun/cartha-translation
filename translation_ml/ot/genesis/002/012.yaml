id: GEN.2.12
reference: Genesis 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/זֲהַ֛ב הָ/אָ֥רֶץ הַ/הִ֖וא ט֑וֹב שָׁ֥ם הַ/בְּדֹ֖לַח וְ/אֶ֥בֶן הַ/שֹּֽׁהַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: ml
  text: ആ ദേശത്തിലെ സ്വർണം നല്ലതാണ്; അവിടെ ബെഡെല്ലിയവും[a] ഒനിക്സ് കല്ലും[b] ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെഡെല്ലിയം’ എന്നതിനുപകരം ‘സുഗന്ധമുള്ള റെസിൻ’ എന്നും ആകാം; എബ്രായപദം സൂചിപ്പിക്കുന്ന വസ്തു കൃത്യമായി ഏതാണെന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഒനിക്സ്’ എന്നതിനുപകരം ‘ബെറിൽ’ പോലെയുള്ള മറ്റൊരു വിലയേറിയ കല്ലായിരിക്കാം; എബ്രായത്തിലെ שֹׁהַם എന്ന പദം സൂചിപ്പിക്കുന്ന കല്ല് കൃത്യമായി ഏതാണെന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: സ്വർണം
  rationale: വാവ് മുൻവാക്യത്തിലെ ദേശവിവരണവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകമായ ‘കൂടാതെ’ ചേർക്കാതെ അർഥബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു. זָהָב എന്നതിന് നേരിട്ടുള്ള അർഥം ‘സ്വർണം’ ആണ്.
- source_word: הָאָרֶץ הַהִוא
  choice: ആ ദേശത്തിലെ
  rationale: אֶרֶץ ഇവിടെ ഹവീലാ എന്ന മുൻപരാമർശിത പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദേശം’ യോജിക്കുന്നു; הַהִוא എന്ന ദൂരസൂചകം ‘ആ’ എന്നു നിലനിർത്തുന്നു.
- source_word: טוֹב
  choice: നല്ലതാണ്
  rationale: സ്വർണത്തിന്റെ ഗുണനിലവാരത്തെക്കുറിച്ചുള്ള ലളിതമായ വിലയിരുത്തൽ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ഹവീലാ ദേശത്തേക്കുള്ള സ്ഥലസൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַבְּדֹלַח
  choice: ബെഡോലിയം
  rationale: പദം സൂചിപ്പിക്കുന്ന വസ്തുവിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണം ഉപയോഗിച്ച് തെറ്റായ കൃത്യത ഒഴിവാക്കുന്നു.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: ഒനിക്സ് കല്ലും
  rationale: אֶבֶן എന്ന ‘കല്ല്’ വ്യക്തമാക്കുകയും שֹׁהַם എന്ന രത്നനാമത്തിന് പരമ്പരാഗതമായ ‘ഒനിക്സ്’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു; കൃത്യമായ ധാതു തിരിച്ചറിയൽ അനിശ്ചിതമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. അപൂർവ വസ്തുനാമങ്ങൾ അനാവശ്യമായി വിശദീകരിക്കാതെ ലിപ്യന്തരിച്ചു; അവയുടെ യഥാർഥ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
