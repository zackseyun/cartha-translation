  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: ml
  text: ഒന്നാമത്തെ നദിയുടെ പേര് പീശോൻ; അത് സ്വർണമുള്ള ഹവീലാദേശം മുഴുവനും ചുറ്റിപ്പോകുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് ഹവീലാദേശം മുഴുവനും ചുറ്റുന്നു” അല്ലെങ്കിൽ “വലയം ചെയ്യുന്നു.” എബ്രായ ക്രിയാരൂപത്തിന് “ചുറ്റുന്നു,” “വലയം ചെയ്യുന്നു,” അല്ലെങ്കിൽ നദിയെ ഉദ്ദേശിച്ചുള്ള വിശദീകരണമായി “ചുറ്റി ഒഴുകുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: ഒന്നാമത്തെ നദിയുടെ പേര്
  rationale: നാല് നദികളുടെ പട്ടികയിൽ הָאֶחָד ക്രമസൂചകമായി ‘ഒന്നാമത്തേത്’ എന്നു പ്രവർത്തിക്കുന്നു. സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെട്ട ‘നദി’ മലയാളത്തിൽ ചേർക്കുന്നത് അർഥം സ്വാഭാവികവും വ്യക്തവുമാക്കുന്നു.
- source_word: פִּישׁוֹן
  choice: പീശോൻ
  rationale: നദിയുടെ പേരായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַסֹּבֵב
  choice: ചുറ്റി ഒഴുകുന്നു
  rationale: סבב എന്ന ധാതുവിന് ‘ചുറ്റുക, വലയം ചെയ്യുക’ എന്ന അർഥമുണ്ട്. വിഷയം നദിയായതിനാൽ ‘ചുറ്റി ഒഴുകുന്നു’ സ്വാഭാവികമായ മലയാളമാണ്; എങ്കിലും ‘ഒഴുകുന്നു’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള വ്യക്തമാക്കലായതിനാൽ പദത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: ഹവീലാദേശം മുഴുവനും
  rationale: אֶרֶץ ഇവിടെ പേരുള്ള ഒരു പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; כָּל എന്നതിന്റെ സമഗ്രത ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: സ്വർണമുള്ള
  rationale: ‘അവിടെ സ്വർണമുണ്ട്’ എന്ന സ്ഥലസൂചക ബന്ധവാക്യത്തെ മലയാളത്തിൽ ‘സ്വർണമുള്ള ഹവീലാദേശം’ എന്നു സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു; സ്വർണത്തിന്റെ സാന്നിധ്യം എന്ന അർഥം നിലനിൽക്കുന്നു.
