    issue: The main text adds “ഒഴുകുന്നു” (‘flows’).
    rationale: Although Pishon is a river in context and the addition is understandable, הַסֹּבֵב itself means ‘going around/encircling’ and does not explicitly say ‘flowing.’ A neutral main-text rendering better reflects the Hebrew and retains the source’s lexical precision.
  revised_text: ഒന്നാമത്തെ നദിയുടെ പേര് പീശോൻ; അത് സ്വർണമുള്ള ഹവീലാദേശം മുഴുവനും ചുറ്റിപ്പോകുന്നു[a].
