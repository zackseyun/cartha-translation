translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിന്റെ വാക്യബന്ധം അർധവിരാമത്തിലൂടെ നിലനിർത്തിയപ്പോൾ, സന്ദർഭത്തിൽ മാത്രം വ്യക്തമാകുന്ന ‘നദി’ വായനാസൗകര്യത്തിനായി ചേർത്തു.
