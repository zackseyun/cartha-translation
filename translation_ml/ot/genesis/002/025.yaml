    issue: Unwarranted adversative conjunction
    rationale: The Hebrew begins the final clause with simple וְ (“and”), not a contrastive marker. Malayalam ‘എന്നാൽ’ adds a ‘however/but’ nuance. A semicolon followed by ‘അവർ’ preserves the linked narrative clauses without adding contrast.
