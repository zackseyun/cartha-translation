  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: ml
  text: ആ പുരുഷനും അവന്റെ ഭാര്യയും ഇരുവരും നഗ്നരായിരുന്നു[a]; അവർ ലജ്ജിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവർ രണ്ടുപേരും … നഗ്നരായിരുന്നു’; ആ ജോഡിയിലെ രണ്ടുപേരും വസ്ത്രമില്ലാത്തവരായിരുന്നു എന്നതിന് ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഈ ആഖ്യാനരൂപം ഇവിടെ അവസ്ഥ സൂചിപ്പിക്കുന്നു; ഭൂതകാലത്തിലെ നില സ്വാഭാവികമായി മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁנֵיהֶם
  choice: ഇരുവരും
  rationale: ഈ അവസ്ഥ ദമ്പതികളിൽ രണ്ടുപേർക്കും ഒരുപോലെ ബാധകമാണെന്ന എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: עֲרוּמִּים
  choice: നഗ്നരായിരുന്നു
  rationale: വസ്ത്രമില്ലാത്ത അവസ്ഥയെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: הָאָדָם
  choice: ആ പുരുഷൻ
  rationale: ഇവിടെ ‘അവന്റെ ഭാര്യ’യോടു ചേർത്തു പറയുന്ന വ്യക്തിയായ പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ മനുഷ്യവർഗത്തെ അല്ല.
- source_word: וְאִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയും
  rationale: മൂന്നാംപുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയമുള്ള אִשָּׁה ഇവിടെ വിവാഹബന്ധം വ്യക്തമാക്കി ‘അവന്റെ ഭാര്യ’ എന്നാണ്.
- source_word: לֹא
  choice: ഇല്ല
  rationale: നിഷേധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יִתְבֹּשָׁשׁוּ
  choice: ലജ്ജ തോന്നിയില്ല
  rationale: בוש എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ലജ്ജാനുഭവം അറിയിക്കുന്നു; വെറും അസൗകര്യമോ നാണക്കേടോ എന്ന ദുർബല അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സന്ദർഭത്തിൽ הָאָדָם എന്നതിന്റെ വിവർത്തനം
  choice: ആ പുരുഷൻ
  alternative: ആ മനുഷ്യൻ / മനുഷ്യൻ
  rationale: വാക്യം ആ വ്യക്തിയെ ‘അവന്റെ ഭാര്യ’യോടൊപ്പം പരാമർശിക്കുന്നതിനാൽ ഇവിടെ പൊതുവായ മനുഷ്യവർഗമല്ല, പുരുഷനായ വ്യക്തിയാണ് സന്ദർഭോചിതമായ അർഥം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. ‘ആ പുരുഷൻ’ എന്നത് മുൻസന്ദർഭത്തിലെ നിർദ്ദിഷ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ‘ഇരുവരും’ എന്ന ഊന്നൽ സംരക്ഷിച്ചിരിക്കുന്നു; അർദ്ധവിരാമം രണ്ടു ബന്ധപ്പെട്ട അവസ്ഥകളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
