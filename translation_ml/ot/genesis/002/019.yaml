  revised_text: യഹോവയായ ദൈവം മണ്ണിൽനിന്ന് എല്ലാ കാട്ടുമൃഗങ്ങളെയും ആകാശത്തിലെ എല്ലാ പക്ഷികളെയും രൂപപ്പെടുത്തി[a]. മനുഷ്യൻ അവയ്ക്ക് എന്തു പേരിടുമെന്നു കാണാൻ അവയെ മനുഷ്യന്റെ അടുക്കൽ കൊണ്ടുവന്നു. മനുഷ്യൻ ഓരോ ജീവിക്കും എന്തു പേരിട്ടോ, അതുതന്നെയായിരുന്നു അതിന്റെ പേര്[b].
