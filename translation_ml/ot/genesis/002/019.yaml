id: GEN.2.19
reference: Genesis 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: ml
  text: യഹോവയായ ദൈവം മണ്ണിൽനിന്ന് എല്ലാ കാട്ടുമൃഗങ്ങളെയും ആകാശത്തിലെ എല്ലാ പക്ഷികളെയും രൂപപ്പെടുത്തി[a]. മനുഷ്യൻ അവയ്ക്ക് എന്തു പേരിടുമെന്നു കാണാൻ അവയെ മനുഷ്യന്റെ അടുക്കൽ കൊണ്ടുവന്നു. മനുഷ്യൻ ഓരോ ജീവിക്കും എന്തു പേരിട്ടോ, അതുതന്നെയായിരുന്നു അതിന്റെ പേര്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “രൂപപ്പെടുത്തിയിരുന്നു.” ഹീബ്രു ക്രിയ സാധാരണ ഭൂതകാലമായി വിവർത്തനം ചെയ്യാം; സന്ദർഭത്തിൽ മൃഗങ്ങളെ രൂപപ്പെടുത്തിയ പ്രവൃത്തി അവയെ മനുഷ്യന്റെ അടുക്കൽ കൊണ്ടുവരുന്നതിനു മുമ്പുള്ളതാണെന്ന് കാണിക്കാൻ മുൻകാലപൂർണരൂപവും ഉപയോഗിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “മനുഷ്യൻ” എന്നതിന് പകരം “ആദാം” എന്നും വായിക്കാം. ഹീബ്രുവിൽ ഹാ-ആദാം എന്നത് അക്ഷരാർഥത്തിൽ “ആ മനുഷ്യൻ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: രൂപപ്പെടുത്തി
  rationale: ഹീബ്രു wayyiqtol രൂപത്തിന്റെ സാധാരണ ആഖ്യാനമൂല്യം ലളിതമായ ഭൂതകാലമാണ്. മുൻകാലപൂർണതയും സന്ദർഭത്തിൽ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהִים
  choice: യഹോവയായ ദൈവം
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, സംയുക്ത ശീർഷകം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִן הָאֲדָמָה
  choice: മണ്ണിൽനിന്ന്
  rationale: אֲדָמָה എന്നത് മണ്ണ്/നിലം എന്നർഥം നൽകുന്നു; സമീപസന്ദർഭത്തിലെ മനുഷ്യന്റെ മണ്ണുമായുള്ള ബന്ധവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: എല്ലാ കാട്ടുമൃഗങ്ങളെയും
  rationale: തുറസ്സായ പ്രദേശത്തെയോ വയലിലെയോ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളം.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ എല്ലാ പക്ഷികളെയും
  rationale: עוֹף ഇവിടെ പറക്കുന്ന ജീവികളിൽ പ്രധാനമായി പക്ഷികളെ സൂചിപ്പിക്കുന്നു; 'ആകാശത്തിലെ പക്ഷികൾ' സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമാണ്.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: അവയെ അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: മുൻപുള്ള സമാഹാരനാമങ്ങളുടെ ബഹുവചനസൂചന മലയാളത്തിൽ 'അവയെ' എന്നു വ്യക്തമാക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ הָאָדָם സർവനാമമായി തിരിച്ചുപറയുന്നു.
- source_word: מַה יִּקְרָא לוֹ
  choice: അവയ്ക്ക് എന്തു പേരിടുമെന്നു
  rationale: קרא ל ഇവിടെ പേരിടുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ഉദ്ദേശ്യവും ഭാവികാലപരമായ പരോക്ഷചോദ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: נֶפֶשׁ חַיָּה
  choice: ജീവി
  rationale: ഈ സന്ദർഭത്തിൽ സജീവജീവിയെ സൂചിപ്പിക്കുന്നു; 'ജീവാത്മാവ്' പോലുള്ള പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്രപരമായ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ലളിതമായി നൽകുന്നു.
- source_word: הוּא שְׁמוֹ
  choice: അതുതന്നെയായിരുന്നു അതിന്റെ പേര്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ഭൂതകാല കോപുലയോടെ നൽകുന്നു; ഊന്നൽ 'അതുതന്നെ' സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וַיִּצֶר എന്ന ക്രിയയുടെ കാലമൂല്യവും ഉല്പത്തി 1-ലെ സൃഷ്ടിക്രമവുമായുള്ള ബന്ധവും
  choice: ലളിതമായ ഭൂതകാലമായി 'രൂപപ്പെടുത്തി'
  alternative: മുൻകാലപൂർണമായി 'രൂപപ്പെടുത്തിയിരുന്നു'
  rationale: ഹീബ്രു ക്രിയാരൂപം സ്വതവേ മുൻകാലപൂർണത അടയാളപ്പെടുത്തുന്നില്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ സാധാരണ ആഖ്യാനഭൂതകാലം നിലനിർത്തുകയും സന്ദർഭപരമായി സാധ്യമായ മുൻകാലപൂർണ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: הָאָדָם പൊതുനാമമാണോ വ്യക്തിനാമമാണോ
  choice: '''മനുഷ്യൻ'' എന്ന പൊതുനാമം'
  alternative: '''ആദാം'' എന്ന വ്യക്തിനാമം'
  rationale: നിർദ്ദേശക ഉപപദമുള്ള രൂപം അക്ഷരാർഥത്തിൽ 'ആ മനുഷ്യൻ' എന്നാണ്; സമീപസന്ദർഭത്തിലെ אָדָם–אֲדָמָה പദബന്ധവും പൊതുനാമവായനയെ പിന്തുണയ്ക്കുന്നു. പരമ്പരാഗത വ്യക്തിനാമവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ ശൈലി. ഉറവിടത്തിലെ കാലസംബന്ധമായ അനിശ്ചിതത്വവും הָאָדָם എന്ന പദത്തിന്റെ പൊതുനാമ/വ്യക്തിനാമ സാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
