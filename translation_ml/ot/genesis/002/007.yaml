language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേ ദൈവം നിലത്തിലെ പൊടിയിൽനിന്ന് മനുഷ്യനെ രൂപപ്പെടുത്തി. അവന്റെ നാസാരന്ധ്രങ്ങളിലേക്കു ജീവന്റെ ശ്വാസം ഊതി; അങ്ങനെ മനുഷ്യൻ ജീവനുള്ള ഒരു ജീവിയായിത്തീർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവനുള്ള ഒരാളായിത്തീർന്നു”; പരമ്പരാഗതമായി, “ജീവനുള്ള ആത്മാവായിത്തീർന്നു.”
    reason: נֶפֶשׁ חַיָּה എന്ന പ്രയോഗത്തിന്റെ സാധ്യമായ വിവർത്തനങ്ങൾ രേഖപ്പെടുത്തുന്നു; ഇതു ശരീരത്തിൽനിന്ന് വേറിട്ട ഒരു ആത്മാവിനെ അനിവാര്യമായി സൂചിപ്പിക്കുന്നില്ല.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുകയും אֱלֹהִים എന്ന പൊതുപദവി ‘ദൈവം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיִּיצֶר
  choice: രൂപപ്പെടുത്തി
  rationale: കുശവൻ രൂപം കൊടുക്കുന്നതുപോലുള്ള കൈകൊണ്ടുള്ള നിർമ്മാണത്തിന്റെ മൂർത്തമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ / മനുഷ്യൻ
  rationale: ഇവിടെ കഥയിൽ രൂപപ്പെടുത്തപ്പെടുന്ന വ്യക്തിയായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മനുഷ്യവർഗം’ എന്ന അമൂർത്തമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: നിലത്തെ പൊടിയിൽനിന്ന്
  rationale: עָפָר എന്നതിന്റെ ‘പൊടി’ എന്ന മൂർത്തചിത്രവും אֲדָמָה എന്നതിന്റെ ‘നിലം’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: בְּאַפָּיו
  choice: അവന്റെ മൂക്കിൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ ശരീരാവയവപ്രയോഗം ഉപയോഗിച്ച് ദൈവം ശ്വാസം ഊതുന്ന മൂർത്തമായ പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: נִשְׁמַת חַיִּים
  choice: ജീവശ്വാസം
  rationale: ‘ജീവന്റെ ശ്വാസം’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; חַיִּים എന്ന ഹീബ്രു ബഹുവചനത്തെ മലയാളത്തിൽ കൃത്രിമമായി അനുകരിക്കുന്നില്ല.
- source_word: וַיְהִי ... לְנֶפֶשׁ חַיָּה
  choice: ജീവനുള്ള ഒരു ജീവിയായിത്തീർന്നു
  rationale: היה + לְ സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം ‘ആയിത്തീർന്നു’ എന്നു നൽകുന്നു. נֶפֶשׁ ഇവിടെ ശരീരത്തിൽനിന്ന് വേറിട്ട അമൂർത്ത ആത്മാവെന്ന ആശയം നിർബന്ധിക്കാതെ മുഴുവൻ സജീവജീവിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: הָאָדָם എന്ന പദത്തിന്റെ വ്യക്തിപരവും പ്രതിനിധിപരവുമായ അർഥസാധ്യത
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യവർഗം
  rationale: ഈ ഘട്ടത്തിൽ കഥ ഒരു വ്യക്തിയെ രൂപപ്പെടുത്തുന്നതായി അവതരിപ്പിക്കുന്നു. എങ്കിലും ‘മനുഷ്യൻ’ എന്ന മലയാളപദത്തിന് മനുഷ്യകുലത്തെ പ്രതിനിധീകരിക്കുന്ന വിശാലധ്വനിയും സ്വാഭാവികമായി ഉണ്ടാകാം.
- issue: לְנֶפֶשׁ חַיָּה എന്നതിന്റെ വിവർത്തനം
  choice: ജീവനുള്ള ഒരു ജീവി
  alternative: ജീവനുള്ള ഒരാൾ; പരമ്പരാഗതമായി, ജീവനുള്ള ആത്മാവ്
  rationale: ഈ പ്രയോഗം മുഴുവൻ സജീവമായ അസ്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ശരീരത്തിൽനിന്നു വേർപെട്ട ആത്മാവെന്ന പിൽക്കാല ആശയം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. അതേസമയം മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘യഹ്‌വേ’ എന്ന ദൈവനാമം മറച്ചുവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു. ഹീബ്രുവിലെ אָדָם/אֲדָמָה ശബ്ദകളി മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കാൻ കഴിയാത്തതിനാൽ കൃത്രിമപദപ്രയോഗം ഒഴിവാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ്-സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാതെ മറിഞ്ഞിരുന്നതിനാൽ, നിലത്തെ പൊടിയുമായി ബന്ധപ്പെട്ട വ്യത്യാസം [a]-യിലും נֶפֶשׁ חַיָּה-യുമായി ബന്ധപ്പെട്ട വ്യത്യാസം [b]-യിലും യുക്തിയായി ചേർത്തു.
