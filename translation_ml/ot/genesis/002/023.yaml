id: GEN.2.23
reference: Genesis 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: ml
  text: 'അപ്പോൾ മനുഷ്യൻ പറഞ്ഞു: “ഇതാ, ഒടുവിൽ—എന്റെ അസ്ഥികളിൽനിന്നുള്ള അസ്ഥിയും എന്റെ മാംസത്തിൽനിന്നുള്ള മാംസവും! ഇവൾക്ക് ‘സ്ത്രീ’ എന്നു പേരാകും[a]; കാരണം പുരുഷനിൽനിന്നാണ് ഇവൾ എടുക്കപ്പെട്ടത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘സ്ത്രീ’ (ഇഷ്ഷാ), ‘പുരുഷൻ’ (ഈഷ്) എന്നീ പദങ്ങൾ തമ്മിൽ ശബ്ദസാമ്യമുണ്ട്; മലയാളത്തിൽ ആ പദപ്രയോഗം അതേപടി പുനരാവിഷ്കരിക്കാനാവില്ല.
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ആദ്യ പരാമർശത്തിൽ ഹീബ്രു אָדָם എന്ന പദത്തിന്റെ ‘മനുഷ്യൻ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള אִישׁ / אִשָּׁה വ്യത്യാസം ‘പുരുഷൻ / സ്ത്രീ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: זֹאת הַפַּעַם
  choice: ഇതാ, ഒടുവിൽ
  rationale: പദാനുപദമായ ‘ഈ പ്രാവശ്യം’ എന്നതിനെക്കാൾ, സന്ദർഭത്തിലെ തിരിച്ചറിവിന്റെയും പൂർത്തീകരണത്തിന്റെയും ആശ്ചര്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: എന്റെ അസ്ഥികളിൽനിന്നുള്ള അസ്ഥിയും എന്റെ മാംസത്തിൽനിന്നുള്ള മാംസവും
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന ഉത്ഭവസൂചനയും ഹീബ്രു സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: לְזֹאת יִקָּרֵא אִשָּׁה
  choice: ഇവൾക്ക് ‘സ്ത്രീ’ എന്നു പേരാകും
  rationale: പ്രകടമായ സ്ത്രീലിംഗ സൂചകമായ זֹאת നു ‘ഇവൾ’ എന്നും, നാമകരണസൂത്രത്തിന് സ്വാഭാവികമായ ‘പേരാകും’ എന്നും നൽകുന്നു.
- source_word: אִשָּׁה / אִישׁ
  choice: സ്ത്രീ / പുരുഷൻ
  rationale: അർഥവ്യത്യാസം കൃത്യമായി നൽകുന്നു; എന്നാൽ ഹീബ്രുവിലെ ശബ്ദസാമ്യം മലയാളത്തിൽ അതേപടി പുനരാവിഷ്കരിക്കാൻ കഴിയാത്തതിനാൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֻקֳחָה זֹאת
  choice: ഇവൾ എടുക്കപ്പെട്ടത്
  rationale: സ്ത്രീലിംഗ ഏകവചന നിഷ്ക്രിയക്രിയയും അവസാനത്തെ demonstrative-ന്റെ ഊന്നലും ‘ഇവൾ’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്നതിന്റെ സന്ദർഭാനുസൃത വിവർത്തനം
  choice: മനുഷ്യൻ
  alternative: ആ പുരുഷൻ
  rationale: ഈ വാക്യത്തിന്റെ തുടക്കത്തിൽ אָדָם എന്ന പദം വരുന്നു; പിന്നീട് അർഥവ്യത്യാസമുള്ള אִישׁ വരുന്നതിനാൽ രണ്ടും ഒരേ മലയാളപദമാക്കി ലയിപ്പിക്കാതെ മൂലപാഠത്തിലെ പദമാറ്റം സംരക്ഷിക്കുന്നു. ഇതിലൂടെ വിശാലമായ മനുഷ്യശാസ്ത്രപരമായ നിഗമനം നിർബന്ധിക്കുന്നില്ല.
- issue: אִישׁ / אִשָּׁה പദപ്രയോഗം
  choice: പുരുഷൻ / സ്ത്രീ; ശബ്ദകളി അടിക്കുറിപ്പിൽ
  alternative: ഭർത്താവ് / ഭാര്യ
  rationale: ഇവിടെ പൊതുവായ ലിംഗപദങ്ങളാണ് യോജിച്ചത്; ‘ഭർത്താവ്/ഭാര്യ’ എന്നു നൽകുന്നത് ഈ വാക്യത്തിൽ ഇല്ലാത്ത വിവാഹബന്ധത്തിന്റെ പ്രത്യേക അർഥം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. കവിതാസദൃശമായ സമാന്തരത നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി. പ്രധാനവാചകത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
