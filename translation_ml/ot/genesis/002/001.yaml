id: GEN.2.1
reference: Genesis 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: ml
  text: അങ്ങനെ ആകാശവും ഭൂമിയും അവയിലെ സകല ഗണങ്ങളും[b] പൂർത്തിയായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമാപ്തിയിലെത്തി.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഗണങ്ങൾ’ എന്നു പറയുന്നത് ആകാശത്തെയും ഭൂമിയെയും നിറയ്ക്കുന്ന സൃഷ്ടികളുടെ മുഴുവൻ നിരയെയുമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: പൂർത്തിയായി
  rationale: כלה എന്ന ധാതുവിന്റെ നിഷ്ക്രിയവും ഫലാവസ്ഥ സൂചിപ്പിക്കുന്നതുമായ രൂപം സൃഷ്ടിക്രമം സമാപ്തിയിലെത്തി എന്ന ആശയം നൽകുന്നു. ‘പൂർത്തിയായി’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשָּׁמַיִם
  choice: ആകാശം
  rationale: സൃഷ്ടിവിവരണത്തിൽ שָׁמַיִם ഭൂമിക്കു മുകളിലുള്ള സൃഷ്ടിമണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ജോടിപ്രയോഗത്തിൽ ‘ആകാശം’ സ്വാഭാവികവും വിശാലമായ പ്രപഞ്ചാർഥം വഹിക്കാൻ ശേഷിയുള്ളതുമാണ്.
- source_word: וְהָאָרֶץ
  choice: ഭൂമിയും
  rationale: ഇവിടെ אֶרֶץ ഒരു പ്രാദേശിക ദേശമല്ല, സൃഷ്ടിയിലെ ഭൗമമണ്ഡലമാണ്; അതിനാൽ ‘ഭൂമി’ യോജിക്കുന്നു. וְ എന്ന സംയോജകം ‘-യും’ ആയി നിലനിർത്തി.
- source_word: וְכָל
  choice: സകല
  rationale: כָל നൽകുന്ന സമഗ്രത ‘സകല’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മുൻപുള്ള ഘടകങ്ങളോടുള്ള וְ-യുടെ ബന്ധം ‘ഗണങ്ങളും’ എന്നതിലെ ‘-ഉം’ വഴി നിലനിർത്തി.
- source_word: צְבָאָם
  choice: അവയിലെ സകല ഗണങ്ങളും
  rationale: צָבָא സൈന്യം, ക്രമീകരിച്ച സമൂഹം, സമ്പൂർണ നിര എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ആകാശത്തെയും ഭൂമിയെയും നിറയ്ക്കുന്ന സൃഷ്ടികളുടെ മുഴുവൻ സമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഗണങ്ങൾ’ ക്രമബദ്ധമായ സമാഹാരത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘അവയിലെ’ എന്നത് ബഹുവചന പ്രത്യയത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘അവയിലെ സകല ഗണങ്ങളും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ആകാശത്തിലും ഭൂമിയിലും ഉൾപ്പെടുന്ന സൃഷ്ടികളുടെ സമ്പൂർണ നിരയെ സൂചിപ്പിക്കുന്ന വിശാലമായ വായന
  alternative: പ്രധാനമായും നക്ഷത്രങ്ങളെയോ സ്വർഗീയ സൈന്യത്തെയോ മാത്രം സൂചിപ്പിക്കുന്ന ഇടുങ്ങിയ വായന
  rationale: ഈ വാക്യം മുഴുവൻ സൃഷ്ടിക്രമത്തിന്റെ പൂർത്തീകരണം സംഗ്രഹിക്കുന്നു. צָבָא എന്ന പദത്തിന് നക്ഷത്രനിരയുടെയോ സൈന്യത്തിന്റെയോ ഭാവം ഉണ്ടാകാമെങ്കിലും, ‘ആകാശവും ഭൂമിയും’ എന്ന സമഗ്രജോടിയോടുള്ള ബന്ധം വിശാലമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു. പരിഭാഷ ‘ഗണങ്ങൾ’ എന്ന പദത്തിലൂടെ ദൃശ്യബിംബം നിലനിർത്തുകയും അടിക്കുറിപ്പിലൂടെ വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആകാശവും ഭൂമിയും’ എന്ന പരിചിതമായ പ്രപഞ്ചജോടി നിലനിർത്തി; അപരിചിതവും സൈനികാർഥം അധികമായി ഉണർത്തുന്നതുമായ ‘സൈന്യം’ ഒഴിവാക്കി, മൂലത്തിലെ ക്രമബദ്ധമായ സമാഹാരത്തിന്റെ ഭാവം ‘ഗണങ്ങൾ’ വഴി സംരക്ഷിച്ചു.
