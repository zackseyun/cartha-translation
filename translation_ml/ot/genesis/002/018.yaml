source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ ദൈവം പറഞ്ഞു: “ആ മനുഷ്യൻ തനിച്ചായിരിക്കുന്നത് നല്ലതല്ല. അവനു യോജിക്കുന്ന ഒരു സഹായിയെ[a] ഞാൻ ഉണ്ടാക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനു തക്ക ഒരു സഹായി,” “അവനോട് പൊരുത്തപ്പെടുന്ന ഒരു സഹായി,” അല്ലെങ്കിൽ “അവനു നേർക്കുനേർ ഉള്ള ഒരു സഹായി.” ഹീബ്രു പ്രയോഗം വെറുമൊരു താഴ്ന്ന പദവിയിലുള്ള സഹായിയെ മാത്രമല്ല, അവനുമായി അനുരൂപമായി ബന്ധപ്പെട്ടിരിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: യഹ്‌വേ ദൈവം
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമവും പൊതുവായ ദൈവപദവിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച സൂചിപ്പിക്കുന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: മനുഷ്യൻ തനിച്ചായിരിക്കുന്നത് നല്ലതല്ല
  rationale: ഹീബ്രു വിലയിരുത്തലും ഏകാന്താവസ്ഥയും നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ הָאָדָם തോട്ടത്തിലെ പ്രത്യേക മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: ഞാൻ അവനുവേണ്ടി ഉണ്ടാക്കും
  rationale: ഒന്നാംപുരുഷ അപൂർണ്ണക്രിയയിലെ ദൈവിക ഉദ്ദേശവും לּוֹ എന്ന ഗുണഭോക്തൃബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵזֶר
  choice: സഹായി
  rationale: സഹായം നൽകുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാളപദം; സ്വതവേ താഴ്ന്ന പദവി അർത്ഥമാക്കുന്നില്ല.
- source_word: כְּנֶגְדּוֹ
  choice: അവനോട് ഒത്തുനിൽക്കുന്ന
  rationale: അവന്റെ മുമ്പിൽ/അവനോടു നേർക്കുനേർ നിന്നുകൊണ്ട് അവനോട് യോജിച്ചു പൊരുത്തപ്പെടുന്ന വ്യക്തി എന്ന ബന്ധപരമായ ആശയം വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הָאָדָם എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃത വിവർത്തനം
  choice: മനുഷ്യൻ
  alternative: പുരുഷൻ; മനുഷ്യവർഗം
  rationale: ഇവിടെ തോട്ടത്തിൽ സൃഷ്ടിക്കപ്പെട്ട ഏക വ്യക്തിയാണ് ഉദ്ദേശ്യം. മലയാളത്തിലെ “മനുഷ്യൻ” ആ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുകയും “മനുഷ്യവർഗം” എന്ന അമൂർത്ത അർത്ഥത്തിലേക്ക് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: עֵזֶר כְּנֶגְדּוֹ എന്നതിലെ പദവിക്രമസംബന്ധിയായ സാധ്യത
  choice: അവനോട് ഒത്തുനിൽക്കുന്ന ഒരു സഹായി
  alternative: അവന് യോജിച്ച ഒരു സഹായി; അവനു തക്ക ഒരു സഹായി
  rationale: ഹീബ്രു പ്രയോഗം സഹായവും പരസ്പര അനുരൂപതയും സൂചിപ്പിക്കുന്നു; മേന്മയോ അധമത്വമോ വാക്യം പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ അത്തരം സാമൂഹികമോ ദൈവശാസ്ത്രപരമോ ആയ നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. “യഹ്‌വേ” എന്ന ലിപ്യന്തരണം ദൈവനാമം സംരക്ഷിക്കുന്നു; “ഒത്തുനിൽക്കുന്ന” എന്ന പ്രയോഗം ഔപചാരിക കൃത്യതയും സാധാരണ വായനാസൗകര്യവും തമ്മിൽ തുലനം ചെയ്യുന്നു.
