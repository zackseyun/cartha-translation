translation:
  language: ml
  text: എന്നാൽ നന്മതിന്മകളുടെ അറിവിന്റെ വൃക്ഷത്തിൽനിന്നു നീ തിന്നരുത്[a]; കാരണം, നീ അതിൽനിന്നു തിന്നുന്ന നാളിൽ[b] നീ തീർച്ചയായും മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
