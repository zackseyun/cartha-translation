    reason: source_structure
  - marker: b
    text: എബ്രായത്തിലെ ഈ പ്രയോഗം ‘നീ അതിൽനിന്നു തിന്നുമ്പോൾ’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: എന്നാൽ ... വൃക്ഷത്തിൽനിന്നു
  rationale: וְ എന്ന സംയോജകം ഇവിടെ മുൻവാക്യത്തിലെ സ്വാതന്ത്ര്യവും ഇപ്പോഴത്തെ വിലക്കും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്; מִן എന്ന മുൻപ്രത്യയത്തിന്റെ അർഥം ‘വൃക്ഷത്തിൽനിന്നു’ എന്നു നിലനിർത്തി.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: നന്മതിന്മകളുടെ അറിവ്
  rationale: דַּעַת എന്ന നാമത്തിന്റെ ‘അറിവ്’ എന്ന അർഥവും טוֹב וָרָע എന്ന കൂട്ടിന്റെ ധാർമികവും അർഥവ്യാപ്തിയുള്ളതുമായ ഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לֹא תֹאכַל
  choice: നീ തിന്നരുത്
  rationale: നിഷേധത്തോടുകൂടിയ അപൂർണക്രിയ ഇവിടെ വിലക്കാണ്; ആധുനിക മലയാളത്തിൽ ‘തിന്നരുത്’ അതിന്റെ വ്യക്തവും ഗൗരവമുള്ളതുമായ സ്വാഭാവിക രൂപമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: ഈ സംയോജകം വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: בְּיוֹם אֲכָלְךָ
  choice: നീ ... തിന്നുന്ന നാളിൽ
  rationale: ‘തിന്നുന്ന നാളിൽ’ എന്നത് എബ്രായത്തിലെ സമയപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുകയും, അതിനെ വെറും ‘തിന്നുമ്പോൾ’ എന്ന് മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מוֹת תָּמוּת
  choice: നീ തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ മരണത്തിന്റെ ഉറപ്പിനെ സൂചിപ്പിക്കുന്നു; ‘തീർച്ചയായും’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘നീ തിന്നുന്ന നാളിൽ’ എന്ന സമയപ്രയോഗവും മരണത്തിന്റെ നിറവേറലും തമ്മിലുള്ള ബന്ധം
  choice: ‘തിന്നുന്ന നാളിൽ’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘നീ അതിൽനിന്നു തിന്നുമ്പോൾ’ എന്നു ചലനാത്മകമായി പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ അന്നുതന്നെയുള്ള ശാരീരികമരണം എന്നു വ്യാഖ്യാനിക്കുക
  rationale: ഈ പ്രയോഗം അന്നുതന്നെയുള്ള മരണം, മരണാവസ്ഥയുടെ ആരംഭം, അല്ലെങ്കിൽ മരണവിധിയുടെ ഉറപ്പ് എന്നിവയിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല. മൂലപാഠത്തിലെ വ്യാഖ്യാനാത്മക പിരിമുറുക്കം അതേപടി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘നന്മതിന്മകൾ’, ‘തിന്നരുത്’, ‘തീർച്ചയായും മരിക്കും’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ഊന്നലും സംരക്ഷിക്കുന്നു.
