revisions:
- from: മൂന്നാമത്തെ നദിയുടെ പേര് ഹിദ്ദേക്കെൽ[a] എന്നാണ്; അത് അശ്ശൂരിന്[b] കിഴക്കുകൂടി ഒഴുകുന്നു. നാലാമത്തെ നദി യൂഫ്രട്ടീസ് ആണ്.
  to: മൂന്നാമത്തെ നദിയുടെ പേര് ഹിദ്ദേക്കെൽ[a] എന്നാണ്; അശ്ശൂരിന് കിഴക്കായി ഒഴുകുന്നത് അതാണ്[b]. നാലാമത്തെ നദി യൂഫ്രട്ടീസ് ആണ്.
