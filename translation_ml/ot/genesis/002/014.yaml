id: GEN.2.14
reference: Genesis 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: ml
  text: മൂന്നാമത്തെ നദിയുടെ പേര് ഹിദ്ദേക്കെൽ[a] എന്നാണ്; അശ്ശൂരിന് കിഴക്കായി ഒഴുകുന്നത് അതാണ്[b]. നാലാമത്തെ നദി യൂഫ്രട്ടീസ് ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹിദ്ദേക്കെൽ പരമ്പരാഗതമായി ടൈഗ്രിസ് നദിയാണെന്ന് തിരിച്ചറിയപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അശ്ശീര്യയുടെ കിഴക്കായി”; എബ്രായത്തിൽ “അശ്ശൂരിന് കിഴക്കായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: പേര്
  rationale: പേരിനെ സൂചിപ്പിക്കുന്ന സാധാരണ അർഥം; നദിയുടെ പേരെന്ന സൂത്രവാക്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נָּהָר
  choice: നദി
  rationale: സന്ദർഭത്തിന് യോജിച്ച, സാധാരണ മലയാള പദം.
- source_word: שְּׁלִישִׁי
  choice: മൂന്നാമത്തെ
  rationale: ക്രമസംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: חִדֶּקֶל
  choice: ഹിദ്ദേക്കെൽ
  rationale: എബ്രായ പേരിന്റെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു; ടൈഗ്രിസ് എന്ന പരമ്പരാഗത തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: הוּא הַהֹלֵךְ
  choice: അത് ... ഒഴുകുന്നു
  rationale: הלך എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘പോകുക’ ആണെങ്കിലും നദിയെക്കുറിച്ചുള്ള മലയാള പ്രയോഗത്തിൽ ‘ഒഴുകുന്നു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: קִדְמַת
  choice: കിഴക്കുകൂടി
  rationale: ഭൂമിശാസ്ത്രപരമായ കിഴക്കൻ സ്ഥാനം/ദിശ സൂചിപ്പിക്കുന്നു; നദിയുടെ ഗതിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: എബ്രായ സംജ്ഞാനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; അത് അശ്ശീര്യ ദേശത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: רְבִיעִי
  choice: നാലാമത്തെ
  rationale: ക്രമസംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: פְרָת
  choice: യൂഫ്രട്ടീസ്
  rationale: ഈ നദിയുടെ ആധുനിക മലയാളത്തിൽ സുപരിചിതമായ പരമ്പരാഗത നാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: אַשּׁוּר ഒരു വ്യക്തി/സ്ഥലം എന്ന പേരാണോ അശ്ശീര്യ ദേശമാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘അശ്ശൂർ’
  alternative: ‘അശ്ശീര്യ’
  rationale: മൂലത്തിലെ സംജ്ഞാനാമം നിലനിർത്തിക്കൊണ്ട് ഭൂമിശാസ്ത്രപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നത് യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകളിൽ മൂലഭാഷയുടെ രൂപം സാധ്യമായിടത്ത് നിലനിർത്തുകയും സുപരിചിതമായ നദിനാമമായ യൂഫ്രട്ടീസ് ഉപയോഗിക്കുകയും ചെയ്തു.
