revisions:
- from: അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ ദേശത്തിനു അവരെ താങ്ങാൻ കഴിഞ്ഞില്ല; കാരണം, അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ കഴിയാത്തത്ര അവരുടെ സമ്പത്ത് വർധിച്ചിരുന്നു.
  to: അവർ ഒരുമിച്ചു പാർക്കാൻ ദേശത്തിന് അവരെ ഉൾക്കൊള്ളാനായില്ല; കാരണം, അവരുടെ സമ്പത്ത് വളരെ അധികമായിരുന്നതിനാൽ അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ കഴിഞ്ഞില്ല.
