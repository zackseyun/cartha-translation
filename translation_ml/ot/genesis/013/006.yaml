  yaml_path: translation/ot/genesis/013/006.yaml
  text: And the land could not support them living together, because their possessions were too great for them to live together.
translation:
  language: ml
  text: അവർ ഒരുമിച്ചു പാർക്കാൻ ദേശത്തിന് അവരെ ഉൾക്കൊള്ളാനായില്ല; കാരണം, അവരുടെ സമ്പത്ത് വളരെ അധികമായിരുന്നതിനാൽ അവർക്ക് ഒരുമിച്ചു പാർക്കാൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא
  choice: താങ്ങാൻ
  rationale: ഭൂമിക്ക് ഇരുകൂട്ടരെയും അവരുടെ കന്നുകാലികളും സമ്പത്തും ഉൾപ്പെടെ നിലനിർത്താൻ ആവശ്യമായ ശേഷിയില്ലായിരുന്നു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לָשֶׁבֶת יַחְדָּו
  choice: ഒരുമിച്ചു പാർക്കാൻ
  rationale: ‘ഒരുമിച്ച് താമസിക്കുക/വസിക്കുക’ എന്ന ആവർത്തിത ഹീബ്രു പ്രയോഗത്തെ ഒരേ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: רְכוּשָׁם רָב
  choice: അവരുടെ സമ്പത്ത് വർധിച്ചിരുന്നു
  rationale: רַב എന്നത് ഇവിടെ അവരുടെ സ്വത്ത് വളരെ അധികമായിരുന്നു എന്ന അളവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ കാരണഘടനയും ‘ഒരുമിച്ചു പാർക്കാൻ’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചിട്ടുണ്ട്.
