  rationale: ദൈവനാമം ഇംഗ്ലീഷ് POB audit trail-ലെ Yahweh തീരുമാനത്തിന് അനുസൃതമായി ‘യാഹ്‌വേ’ എന്നു ഏകീകരിച്ചു. שָׁם-നെ സമയസൂചനയാക്കാതിരിക്കാൻ ‘ഇപ്പോഴുള്ള’ ഒഴിവാക്കി. עֵינֶיךָയുടെ ഉടമസ്ഥസൂചനയും നിലനിർത്തി; ദിശാവാചകങ്ങളുടെ ക്രമവും ദിശാഭാവവും സംരക്ഷിച്ചു.
