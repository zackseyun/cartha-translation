  revised_text: 'ലോത്ത് അബ്രാമിൽനിന്ന് വേർപിരിഞ്ഞശേഷം യാഹ്‌വേ[a] അബ്രാമിനോടു പറഞ്ഞു: “നീ ഉള്ള സ്ഥലത്തുനിന്ന് നിന്റെ കണ്ണുകൾ ഉയർത്തി വടക്കോട്ടും തെക്കോട്ടും കിഴക്കോട്ടും പടിഞ്ഞാറോട്ടും നോക്കുക.”'
