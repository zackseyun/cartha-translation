id: GEN.13.14
reference: Genesis 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: ml
  text: 'ലോത്ത് അബ്രാമിൽനിന്ന് വേർപിരിഞ്ഞശേഷം യാഹ്‌വേ[a] അബ്രാമിനോടു പറഞ്ഞു: “നീ ഉള്ള സ്ഥലത്തുനിന്ന് നിന്റെ കണ്ണുകൾ ഉയർത്തി വടക്കോട്ടും തെക്കോട്ടും കിഴക്കോട്ടും പടിഞ്ഞാറോട്ടും നോക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: יהוה (YHWH), ദൈവത്തിന്റെ പ്രത്യേക നാമം. ഇതിന്റെ പുരാതന ഉച്ചാരണം കൃത്യമായി ഉറപ്പില്ല; ‘യാഹ്‌വേ’ വ്യാപകമായി പുനർനിർമിക്കപ്പെടുന്ന രൂപമാണ്.'
    reason: ഹീബ്രു ദൈവനാമം മുഖ്യപാഠത്തിൽ പ്രതിനിധീകരിച്ചിരിക്കുന്നതും അതിന്റെ പുരാതന ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: വാക്യത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് പ്രതിനിധീകരിക്കാൻ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ‘യഹോവ’ ഉപയോഗിച്ചു; വാക്യാരംഭത്തിലെ וַ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രത്യേകം ‘അപ്പോൾ/കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: אָמַר אֶל־אַבְרָם
  choice: അബ്രാമിനോടു പറഞ്ഞു
  rationale: ഹീബ്രു സംസാരപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: ലോത്ത് അബ്രാമിനെ വിട്ടുപിരിഞ്ഞശേഷം
  rationale: Niphal രൂപം ഇവിടെ വേർപിരിയുക എന്ന അകർമക അർഥത്തിലാണ്; മֵעִמּוֹയിലെ സർവനാമത്തിന്റെ സൂചിതനായ അബ്രാമിനെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: കണ്ണുകളുയർത്തി
  rationale: ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു. נָא കല്പനയെ മൃദുവാക്കുന്ന ഘടകമാണെങ്കിലും ദൈവിക നിർദേശത്തിൽ മലയാളത്തിലെ ‘ദയവായി’ അസ്വാഭാവികമായതിനാൽ കല്പനയുടെ സ്വാഭാവിക മൃദുത്വത്തിലൂടെ സൂചന നൽകി.
- source_word: וּרְאֵה
  choice: നോക്കുക
  rationale: കാഴ്ച ഒരു ദിശയിലേക്ക് തിരിക്കാനുള്ള കല്പനയായതിനാൽ ‘കാണുക’ എന്നതിനെക്കാൾ ‘നോക്കുക’ സന്ദർഭോചിതമാണ്.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר־אַתָּה שָׁם
  choice: നീ ഇപ്പോഴുള്ള സ്ഥലത്തുനിന്ന്
  rationale: שָׁם എന്ന സ്ഥലസൂചന ‘ഇപ്പോഴുള്ള’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; ‘നിൽക്കുന്ന’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത വരും.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: വടക്കോട്ടും തെക്കോട്ടും കിഴക്കോട്ടും പടിഞ്ഞാറോട്ടും
  rationale: ദിശാസൂചകമായ -ה അവസാനപ്രത്യയത്തിന്റെ ചലന/ദിശാഭാവം ‘-ഓട്ട്’ കൊണ്ട് നിലനിർത്തി; ആവർത്തിക്കുന്ന ബന്ധകങ്ങളെയും ‘-ഉം’ വഴി പ്രതിഫലിപ്പിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം പൊതുവായ ‘കർത്താവ്’ എന്ന പദമല്ല, നിയമബന്ധത്തിലെ പ്രത്യേക ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അത് മറയ്ക്കാതെ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ മുഖ്യപാഠത്തിൽ നൽകി; ഉച്ചാരണവുമായി ബന്ധപ്പെട്ട അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ ദിശാപട്ടികയും കണ്ണുകളുയർത്തുന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
