id: GEN.13.10
reference: Genesis 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: ml
  text: 'ലോത്ത് കണ്ണുയർത്തി യോർദ്ദാൻ സമതലം മുഴുവനും കണ്ടു[a]: യഹ്‌വെ സൊദോമിനെയും ഗൊമോറയെയും നശിപ്പിക്കുന്നതിനുമുമ്പ്, അതെല്ലാം യഹ്‌വെയുടെ തോട്ടംപോലെയും[b] ഈജിപ്തുദേശംപോലെയും വെള്ളം സമൃദ്ധമായി ലഭിച്ചിരുന്ന പ്രദേശമായിരുന്നു, സോവാറിലേക്കുള്ള ദിശയിൽ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോർദ്ദാൻ താഴ്‌വര മുഴുവനും’ എന്നും, കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘യോർദ്ദാന്റെ വൃത്തപ്രദേശം മുഴുവനും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെയുടെ തോട്ടം’ എന്നത് ഏദെൻതോട്ടവുമായി ബന്ധപ്പെട്ട പച്ചപ്പും സമൃദ്ധിയും ഓർമിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
  - marker: c
    text: ‘സോവാറിലേക്കു ചെല്ലുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം സോവാറിലേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: കണ്ണുയർത്തി
  rationale: ദൃഷ്ടി ഒരു ദിക്കിലേക്കു തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആഖ്യാനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: യോർദ്ദാൻ സമതലം മുഴുവനും
  rationale: כִּכָּר വൃത്താകാരമായ പ്രദേശത്തെയോ സമതലപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിലെ ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമായി നൽകാൻ ‘സമതലം’ സ്വീകരിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: ആ പ്രദേശമെല്ലാം ... നന്നായി ജലസമൃദ്ധമായിരുന്നു
  rationale: പ്രദേശം മുഴുവൻ ധാരാളം വെള്ളം ലഭിച്ചിരുന്നതെന്ന വിവരണശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: യഹ്‌വെ ... നശിപ്പിക്കുന്നതിനുമുമ്പ്
  rationale: לִפְנֵי സമയപരമായ ‘മുമ്പ്’ എന്ന അർഥവും שׁחת നഗരങ്ങളുടെ നാശവും ഇവിടെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: כְּגַן יְהוָה
  choice: യഹ്‌വെയുടെ തോട്ടംപോലെ
  rationale: എബ്രായ ഉപമ നിലനിർത്തുകയും ഏദെൻതോട്ടത്തോടുള്ള സാധ്യതയുള്ള അനുരണനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശംപോലെ
  rationale: אֶרֶץ എന്ന ‘ദേശം’ നിലനിർത്തി കാർഷികവും ഭൂമിശാസ്ത്രപരവുമായ താരതമ്യം സംരക്ഷിക്കുന്നു.
- source_word: בֹּאֲכָה צֹעַר
  choice: സോവാറിലേക്കു പോകുന്ന ദിക്കുവരെ
  rationale: രണ്ടാംപുരുഷ രൂപം മലയാളത്തിൽ അനാവശ്യമായി നേരിട്ടുള്ള അഭിസംബോധനയായി തോന്നാതിരിക്കാനും, പ്രയോഗത്തിന്റെ ദിശാസൂചന വ്യക്തമായി നൽകാനും ഇങ്ങനെ വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ‘Yahweh’ എന്ന പരമ്പരാഗതമായി പുനർനിർമിച്ച ഉച്ചാരണത്തിന്റെ മലയാളരൂപം സ്വീകരിച്ചു.
- issue: ‘യഹ്‌വെയുടെ തോട്ടം’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: ഉപമ അതേപടി നിലനിർത്തി; ഏദെൻ സൂചന അടിക്കുറിപ്പിൽ മാത്രം നൽകി
  alternative: ‘ഏദെൻതോട്ടംപോലെ’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: മൂലപാഠത്തിൽ ‘ഏദെൻ’ എന്നു നേരിട്ട് പറയാത്തതിനാൽ സാധ്യതയുള്ള അന്തർപാഠബന്ധം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായ ആഖ്യാനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ജലസമൃദ്ധിയെ വിവരിക്കുന്ന ഉപവാക്യം രണ്ടാം വാക്യമായി ക്രമപ്പെടുത്തി. സ്ഥലനാമങ്ങൾ ‘യോർദ്ദാൻ’, ‘സൊദോം’, ‘ഗൊമോറ’, ‘സോവാർ’ എന്ന പരിചിതമായ മലയാളരൂപങ്ങളിൽ നൽകി.
