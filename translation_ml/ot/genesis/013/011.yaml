- from: അങ്ങനെ ലോത്ത് യോർദാൻ സമതലം മുഴുവനും തനിക്കായി തിരഞ്ഞെടുത്തു. ലോത്ത് കിഴക്കോട്ട്[a] യാത്ര പുറപ്പെട്ടു; അവർ പരസ്പരം വേർപിരിഞ്ഞു.
  to: അങ്ങനെ ലോത്ത് യോർദാൻതാഴ്വര മുഴുവനും തനിക്കായി തിരഞ്ഞെടുത്തു. ലോത്ത് കിഴക്കോട്ട്[a] യാത്രയായി; അവർ പരസ്പരം വേർപിരിഞ്ഞു.
