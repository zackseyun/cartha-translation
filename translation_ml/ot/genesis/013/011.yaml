id: GEN.13.11
reference: Genesis 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: ml
  text: അങ്ങനെ ലോത്ത് യോർദാൻതാഴ്വര മുഴുവനും തനിക്കായി തിരഞ്ഞെടുത്തു. ലോത്ത് കിഴക്കോട്ട്[a] യാത്രയായി; അവർ പരസ്പരം വേർപിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിഴക്കുനിന്ന്.’ ഹീബ്രു പ്രയോഗം യാത്രയുടെ ദിശയെയോ പുറപ്പെട്ട സ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: തനിക്കായി തിരഞ്ഞെടുത്തു
  rationale: בחר എന്ന ക്രിയയുടെ ‘തിരഞ്ഞെടുക്കുക’ എന്ന അർഥവും לוֹ എന്ന ദാതൃസർവനാമത്തിന്റെ സ്വഹിതസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: യോർദാൻ സമതലം മുഴുവനും
  rationale: כִּכָּר എന്നത് അക്ഷരാർഥത്തിൽ വൃത്താകൃതിയിലുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ യോർദാനോടു ചേർന്ന നിരപ്പായ ഭൂപ്രദേശമാണ് ഉദ്ദേശ്യം. ‘സമതലം’ ഭൂമിശാസ്ത്രപരമായ ആശയം ലളിതമായി നൽകുന്നു.
- source_word: וַיִּסַּע
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: נסע പാളയം പൊളിച്ച് യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; ‘യാത്ര പുറപ്പെട്ടു’ ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִקֶּדֶם
  choice: കിഴക്കോട്ട്
  rationale: സന്ദർഭത്തിൽ യാത്രയുടെ ദിശയായ ‘കിഴക്കോട്ട്’ എന്ന വായനയാണ് കൂടുതൽ യോജിക്കുന്നത്; എങ്കിലും ഹീബ്രു രൂപത്തിന് ‘കിഴക്കുനിന്ന്’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיִּפָּרְדוּ
  choice: വേർപിരിഞ്ഞു
  rationale: פרד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം പരസ്പരമായ വേർപിരിയലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ מֵעַל אָחִיו
  choice: പരസ്പരം
  rationale: ഹീബ്രുവിലെ ‘ഓരോരുത്തൻ തന്റെ സഹോദരനിൽനിന്ന്’ എന്ന വിതരണാത്മക ബന്ധുപദപ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ മലയാളരൂപം. അബ്രാമും ലോത്തും തമ്മിൽ വേർപിരിഞ്ഞുവെന്ന പരസ്പരാർഥം അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനമില്ലാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: מִקֶּדֶם എന്നതിലെ ദിശാസംബന്ധമായ ദ്വയാർഥത
  choice: കിഴക്കോട്ട്
  alternative: കിഴക്കുനിന്ന്
  rationale: അബ്രാമിന്റെയും ലോത്തിന്റെയും യാത്രാസന്ദർഭത്തിൽ കിഴക്കോട്ടുള്ള സഞ്ചാരമാണ് കൂടുതൽ യോജിച്ച വായന. എന്നാൽ വ്യാകരണരൂപം ആരംഭസ്ഥലത്തെയും സൂചിപ്പിക്കാമെന്നതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: אִישׁ מֵעַל אָחִיו എന്ന ബന്ധുപദപ്രയോഗം
  choice: പരസ്പരം
  alternative: ഓരോരുത്തൻ തന്റെ സഹോദരനിൽനിന്ന്
  rationale: ‘സഹോദരൻ’ എന്ന ഹീബ്രു പദം ഇവിടെ ബന്ധുവിനെയോ കൂട്ടാളിയെയോ ഉൾക്കൊള്ളുന്ന പ്രയോഗമാണ്. മലയാളത്തിലെ പദാനുപദരൂപം തെറ്റിദ്ധാരണയ്ക്കോ കൃത്രിമമായ ശൈലിക്കോ ഇടയാക്കുന്നതിനാൽ പരസ്പര വേർപിരിയലെന്ന അർഥം നേരിട്ട് നൽകുന്നു; പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂമിശാസ്ത്രപദം വായനാസൗകര്യത്തിന് ചുരുക്കി നൽകിയിരിക്കുന്നു; ഹീബ്രുവിലെ യഥാർഥ ദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
