translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ഉടമസ്ഥതാസൂചക അസ്തിത്വഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഉണ്ടായിരുന്നു’ എന്ന രൂപത്തിൽ നൽകി; കന്നുകാലിവർഗങ്ങളുടെ പരിധി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
