source:
  edition: WLC
  text: וְ/גַם לְ/ל֔וֹט הַ/הֹלֵ֖ךְ אֶת אַבְרָ֑ם הָיָ֥ה צֹאן וּ/בָקָ֖ר וְ/אֹהָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: ml
  text: അബ്രാമിനോടൊപ്പം പോയ ലോത്തിനും ആട്ടിൻപറ്റങ്ങളും കന്നുകാലിക്കൂട്ടങ്ങളും കൂടാരങ്ങളും ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആട്ടിൻപറ്റങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടെയുള്ള ചെറിയ വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം പശുവർഗത്തിൽപ്പെട്ട വളർത്തുമൃഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: ലോത്തിനും
  rationale: സംയോജകവും ചേർക്കൽസൂചകമായ അവ്യയവും ചേർന്ന്, അബ്രാമിനെപ്പോലെ ലോത്തിനും സമ്പത്തുണ്ടായിരുന്നുവെന്ന ആശയം നൽകുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഈ ചേർക്കൽഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְלוֹט ... הָיָה
  choice: ലോത്തിനും ... ഉണ്ടായിരുന്നു
  rationale: ഇവിടെ לְ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന അസ്തിത്വഘടനയുടെ ഭാഗമാണ്; മലയാളത്തിൽ ‘ലോത്തിന് ... ഉണ്ടായിരുന്നു’ എന്നതാണ് സ്വാഭാവികമായ അവതരണം.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: അബ്രാമിനോടൊപ്പം പോയ
  rationale: വർത്തമാന കൃദന്തം ലോത്തിനെ അബ്രാമിന്റെ സഹയാത്രികനായി വിശേഷിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ യാത്രയെ മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: צֹאן
  choice: ആട്ടിൻപറ്റങ്ങൾ
  rationale: ഈ എബ്രായപദം പ്രധാനമായും ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ആട്ടിൻപറ്റങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבָקָר
  choice: കന്നുകാലിക്കൂട്ടങ്ങൾ
  rationale: പദം പശുവർഗത്തിൽപ്പെട്ട വലിയ വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ צֹאן എന്നതിനോടുള്ള സമാന്തരതയും കൂട്ടമായുള്ള അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: וְאֹהָלִים
  choice: കൂടാരങ്ങൾ
  rationale: ബഹുവചനനാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷയാണിത്.
