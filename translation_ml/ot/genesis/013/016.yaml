source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: ml
  text: ഞാൻ നിന്റെ സന്തതിയെ[a] ഭൂമിയിലെ പൊടിപോലെ ആക്കും. ഭൂമിയിലെ പൊടി എണ്ണാൻ ഒരാൾക്കു[b] കഴിയുമെങ്കിൽ, നിന്റെ സന്തതിയെയും എണ്ണാൻ കഴിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വിത്ത്” അല്ലെങ്കിൽ “നിന്റെ വംശജർ”; എബ്രായത്തിലെ זֶרַע പിൻതലമുറയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ഏകവചനരൂപത്തിലുള്ള നാമമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ഒരു പുരുഷൻ”; ഇവിടെ പുല്ലിംഗ ഏകവചനരൂപം പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: ഞാൻ ... ആക്കും
  rationale: שׂוּם എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, കർമത്തോടും ഉപമയോടും ചേർന്ന ഈ പ്രയോഗത്തിൽ ‘ആക്കുക’ എന്നത് സ്വാഭാവികമായി കാരണാർഥം നൽകുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഇവിടെ അബ്രാമിന്റെ വരുംതലമുറകളെ ഒരൊറ്റ സമൂഹമായി സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണ്. ‘സന്തതി’ ആ കൂട്ടാർഥവും ഏകവചനരൂപവും നിലനിർത്തുന്നു.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: ഭൂമിയിലെ പൊടിപോലെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ഉപമയും എണ്ണാനാവാത്ത പെരുപ്പത്തിന്റെ ദൃശ്യബിംബവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אִם
  choice: '... കഴിയുമെങ്കിൽ'
  rationale: തുടർന്നുള്ള വ്യവസ്ഥാപരമായ താരതമ്യം മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; പൊടി എണ്ണാനാകുമെങ്കിൽ സന്തതിയെയും എണ്ണാനാകും എന്ന സാങ്കൽപ്പിക ബന്ധം നിലനിൽക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: ഇവിടെ പുല്ലിംഗ ഏകവചനമായ אִישׁ പൊതുവായ അർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. മലയാളത്തിലെ ‘ഒരാൾ’ ആ പൊതുവായ പ്രയോഗം കൃത്യമായി നൽകുന്നു; വ്യാകരണരൂപത്തെക്കുറിച്ചുള്ള വിവരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לִמְנוֹת / יִמָּנֶה
  choice: എണ്ണാൻ / എണ്ണാൻ കഴിയും
  rationale: מנה എന്ന ധാതുവിന്റെ എണ്ണുക, തിട്ടപ്പെടുത്തുക എന്ന അർഥവും വ്യവസ്ഥാവാക്യത്തിലെ സാധ്യതാഭാവവും ലളിതമായി നൽകുന്നു.
- source_word: גַּם
  choice: -യും
  rationale: പൊടിയും സന്തതിയും തമ്മിലുള്ള അനുരൂപത മലയാളത്തിലെ ചേർക്കൽപ്രത്യയമായ ‘-യും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിക വാഗ്ദാനത്തിലെ זֶרַע എന്ന കൂട്ടനാമത്തിന്റെ വിവർത്തനം
  choice: നിന്റെ സന്തതി
  alternative: നിന്റെ വിത്ത്; നിന്റെ വംശജർ
  rationale: ഈ വാക്യം അബ്രാമിന്റെ എണ്ണമറ്റ പിൻതലമുറകളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ കൂട്ടനാമത്തിന്റെ ഏകവചനഭാവം നിലനിർത്തുകയും, ഇവിടെ തന്നെയില്ലാത്ത പ്രത്യേക മശീഹാ-ഏകവചന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: אִישׁ എന്ന പദത്തിലെ പൊതുവായ പുല്ലിംഗപ്രയോഗം
  choice: ഒരാൾ
  alternative: ഒരു മനുഷ്യൻ; ആർക്കെങ്കിലും
  rationale: എബ്രായരൂപം പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ അതിന് പൊതുവായ അർഥമാണ്. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘ഒരാൾ’ ഉപയോഗിച്ചു; രൂപപരമായ വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: എണ്ണപ്പെടുക എന്ന പ്രസ്താവനയുടെ സാങ്കൽപ്പിക സ്വഭാവം
  choice: എണ്ണാൻ കഴിയും
  alternative: എണ്ണപ്പെടും
  rationale: יִמָּנֶה വ്യവസ്ഥാവാക്യത്തിന്റെ ഫലഭാഗത്താണ്. അതിനാൽ ഇത് ഭാവിയിലെ യഥാർഥ പ്രവചനമായി അല്ല, പൊടി എണ്ണാനാകുമെങ്കിൽ സന്തതിയെയും എണ്ണാനാകും എന്ന സാങ്കൽപ്പിക സാധ്യതയായി വിവർത്തനം ചെയ്തു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ പൊടിയുടെ ദൃശ്യബിംബം, കൂട്ടനാമമായ ‘സന്തതി’, വ്യവസ്ഥാപരമായ താരതമ്യം എന്നിവ നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി: സന്തതിയെക്കുറിച്ചുള്ള കുറിപ്പ് [a] ആ പദത്തോടും, പൊതുവായ പുല്ലിംഗപ്രയോഗത്തെക്കുറിച്ചുള്ള കുറിപ്പ് [b] ‘ഒരാൾ’ എന്ന പദത്തോടും ചേർത്തു.'
