id: GEN.13.7
reference: Genesis 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: ml
  text: അബ്രാമിന്റെ കന്നുകാലികളെ മേയിച്ചിരുന്നവരും ലോത്തിന്റെ കന്നുകാലികളെ മേയിച്ചിരുന്നവരും തമ്മിൽ കലഹമുണ്ടായി. അക്കാലത്ത് കനാന്യരും പെരിസ്യരും ആ ദേശത്ത് പാർത്തിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘കനാന്യനും പെരിസ്യനും’ എന്ന് ഏകവചന ജനനാമങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവ ഇവിടെ ആ ജനവിഭാഗങ്ങളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: കഥയിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്ന היה എന്ന ക്രിയയുടെ അസ്തിത്വാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רִיב
  choice: കലഹം
  rationale: കൂട്ടങ്ങൾ തമ്മിലുള്ള തർക്കവും സംഘർഷവും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: רֹעֵי
  choice: മേയിച്ചിരുന്നവർ
  rationale: ആടുകൾ മാത്രമല്ല, വിശാലമായ അർഥത്തിലുള്ള കന്നുകാലികളെയാണ് ഇവർ പരിപാലിച്ചത്; അതിനാൽ ‘ഇടയന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מִקְנֵה
  choice: കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בֵּין ... וּבֵין
  choice: …വരും …വരും തമ്മിൽ
  rationale: സംഘർഷത്തിലേർപ്പെട്ട രണ്ടു വ്യത്യസ്ത വിഭാഗങ്ങളെ എബ്രായ ഘടനയ്ക്കൊത്തവിധം വ്യക്തമാക്കുന്നു.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: കനാന്യരും പെരിസ്യരും
  rationale: എബ്രായത്തിലെ ഏകവചന ജനനാമങ്ങൾ ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനം അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אָז
  choice: അക്കാലത്ത്
  rationale: കഥാസന്ദർഭത്തോടനുബന്ധിച്ച സമയസൂചനയെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יֹשֵׁב
  choice: പാർത്തിരുന്നു
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ തുടർച്ചയായ വാസസ്ഥിതിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאָרֶץ
  choice: ആ ദേശത്ത്
  rationale: സന്ദർഭത്തിൽ പരാമർശിക്കപ്പെട്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ഭൂമിശാസ്ത്രപരവും സാധ്യതയുള്ള ഉടമ്പടിസംബന്ധവുമായ അനുരണനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָאָרֶץ എന്ന പദത്തിന്റെ സാധ്യതയുള്ള ഉടമ്പടിസംബന്ധമായ അനുരണനം
  choice: ആ ദേശത്ത്
  alternative: ആ നാട്ടിൽ
  rationale: ‘ദേശം’ ഭൂമിശാസ്ത്രപരമായ അർഥത്തോടൊപ്പം ഉല്പത്തിയിലെ വിശാലമായ ദൈവിക വാഗ്ദാനസന്ദർഭത്തിന്റെ സാധ്യതയുള്ള അനുരണനവും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കഥനശൈലി. എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി; അതിന്റെ രൂപഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
