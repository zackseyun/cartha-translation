  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാം തന്റെ ഭാര്യയെയും തനിക്കുണ്ടായിരുന്നതെല്ലാം ലോത്തിനെയും കൂട്ടിക്കൊണ്ട് ഈജിപ്തിൽനിന്ന് കയറിപ്പോയി[a] നെഗെബിലേക്കു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “കയറിപ്പോയി” എന്നത് ഈജിപ്തിൽനിന്ന് കനാൻദേശത്തേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗമാണ്. “നെഗെബിലേക്കു” എന്നതിന് “തെക്കോട്ട്” എന്നും പരിഭാഷപ്പെടുത്താം; നെഗെബ് എന്ന എബ്രായപദം ഒരു തെക്കൻ പ്രദേശത്തെയോ പൊതുവായി തെക്ക്/തെക്കൻ നാടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ട് ... പോയി
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കയറിപ്പോകുക’ എന്നാണെങ്കിലും, ഈ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിനായി പുറപ്പെടലും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയും ചേർത്ത് അവതരിപ്പിക്കുന്നു. ഈജിപ്തിൽനിന്ന് ദേശത്തേക്കു ‘കയറിപ്പോകുന്ന’ ബൈബിൾ ഭൂമിശാസ്ത്രപ്രയോഗം വാചകത്തിൽ കൃത്രിമമായി തോന്നാതിരിക്കാനാണ് ഈ രൂപം.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מן എന്ന ബന്ധകത്തിന്റെയും സ്ഥലനാമത്തിന്റെയും നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയോടും ... കൂടെ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവായ അബ്രാമിനെ വീണ്ടും ഊന്നുന്നു; മലയാളത്തിൽ കർത്താവ് ഇതിനകം വ്യക്തമാകുന്നതിനാൽ കൂട്ടയാത്രയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന രൂപം സ്വീകരിച്ചു.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: തനിക്കുണ്ടായിരുന്ന സകലത്തോടും
  rationale: വസ്തുവകകളിൽ മാത്രം അർഥം ചുരുക്കാതെ, അബ്രാമിനുണ്ടായിരുന്നതെല്ലാം ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: וְלוֹט עִמּוֹ
  choice: ലോത്തും അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ലോത്തിനെ യാത്രാസംഘത്തിലെ അനുയാത്രികനായി പിന്നീട് ചേർത്തുപറയുന്ന എബ്രായ വാക്യക്രമവും അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: הַנֶּגְבָּה
  choice: നെഗെബിലേക്കു
  rationale: נֶגֶב ഇവിടെ തെക്കൻ ഭൂവിഭാഗത്തിന്റെ സ്ഥലനാമമായി മനസ്സിലാക്കാം; ദിശാസൂചകമായ -ָה പ്രത്യയം ‘-ലേക്കു’ എന്നു നൽകി. ‘തെക്കോട്ട്’ എന്ന പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
