source:
  edition: WLC
  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: ml
  text: ദേശം മുഴുവനും നിന്റെ മുമ്പിലില്ലയോ? ദയവായി എന്നിൽനിന്ന് വേർപിരിയുക. നീ ഇടത്തോട്ടു പോയാൽ[a], ഞാൻ വലത്തോട്ടു പോകാം; നീ വലത്തോട്ടു പോയാൽ, ഞാൻ ഇടത്തോട്ടു പോകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'നിബന്ധനാവാക്യങ്ങളിൽ എബ്രായം സംക്ഷിപ്തമാണ്; അക്ഷരാർഥത്തിൽ: “ഇടത്തേക്കെങ്കിൽ, ഞാൻ വലത്തോട്ടു പോകാം; വലത്തേക്കെങ്കിൽ, ഞാൻ ഇടത്തോട്ടു പോകാം.” വ്യക്തതയ്ക്കായി പരിഭാഷയിൽ “നീ … പോയാൽ” എന്നു ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ഇല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָל הָאָרֶץ
  choice: ദേശം മുഴുവനും
  rationale: ഇവിടെ אָרֶץ എന്നത് ഭൂമി മുഴുവനെയല്ല, താമസത്തിനായി മുമ്പിലുള്ള ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: ലോത്തിന്റെ മുമ്പിൽ ദേശം തുറന്നുകിടക്കുന്നു എന്ന എബ്രായ സ്ഥലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: ദയവായി എന്നിൽനിന്ന് വേർപിരിയുക
  rationale: നിഫാൽ ആജ്ഞാരൂപത്തിന്റെ വേർപിരിയൽ എന്ന അർത്ഥവും נָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: אִם הַשְּׂמֹאל
  choice: നീ ഇടത്തോട്ടു പോയാൽ
  rationale: എബ്രായത്തിൽ ക്രിയ ലോപിച്ചിരിക്കുന്നെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്നുള്ള ‘പോകുക’ ചേർക്കുന്നു.
- source_word: וְאֵימִנָה
  choice: ഞാൻ വലത്തോട്ടു പോകാം
  rationale: വലത്തോട്ടുള്ള ചലനം സൂചിപ്പിക്കുന്ന ദിശാരൂപവും അബ്രാമിന്റെ പ്രതികരണസന്നദ്ധതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְאִם הַיָּמִין
  choice: നീ വലത്തോട്ടു പോയാൽ
  rationale: ആദ്യ നിബന്ധനയോടുള്ള സമാന്തരത കാത്തുകൊണ്ട് ലോപിച്ച ക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: וְאַשְׂמְאִילָה
  choice: ഞാൻ ഇടത്തോട്ടു പോകാം
  rationale: ഇടത്തോട്ടുള്ള ചലനവും നിർദേശത്തിന്റെ സന്തുലിത ഘടനയും നിലനിർത്തുന്നു.
