base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: ml
  text: അവൻ യാത്രാഘട്ടങ്ങളായി നെഗെവിൽനിന്ന് ബേഥേൽവരെ യാത്രചെയ്തു[a], ആദ്യം തന്റെ കൂടാരം ഉണ്ടായിരുന്ന, ബേഥേലിനും ഹായിക്കും ഇടയിലുള്ള സ്ഥലത്തേക്ക്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ യാത്രകൾക്കനുസരിച്ച്”; അതായത്, ഓരോ പാളയസ്ഥലത്തുനിന്നും അടുത്തതിലേക്കുള്ള തുടർച്ചയായ യാത്രാഘട്ടങ്ങളിലൂടെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവൻ ... യാത്രചെയ്തു
  rationale: הלך എന്ന സാധാരണ സഞ്ചാരക്രിയ ഇവിടെ യാത്രാമാർഗവും ലക്ഷ്യസ്ഥാനവും വിവരിക്കുന്നതിനാൽ ‘യാത്രചെയ്തു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְמַסָּעָיו
  choice: പാളയമിറക്കി പാളയമിറക്കിയായി
  rationale: מַסָּע യാത്രയിലെ ഘട്ടത്തെയും പാളയം മാറ്റുന്നതിനെയും സൂചിപ്പിക്കുന്നു. തുടർച്ചയായ താവളങ്ങളിലൂടെയുള്ള യാത്ര എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: מִנֶּגֶב
  choice: നെഗെവിൽനിന്ന്
  rationale: നിർദ്ദിഷ്ടമായ ഭൂമിശാസ്ത്രപ്രദേശം ഉദ്ദേശിക്കുന്നതിനാൽ ‘തെക്ക്’ എന്ന പൊതുദിശയ്ക്കു പകരം സ്ഥലനാമമായ ‘നെഗെവ്’ നിലനിർത്തി.
- source_word: וְעַד בֵּית אֵל
  choice: ബേഥേൽവരെ
  rationale: עַד യാത്രയുടെ പരിധിയോ അന്തിമസ്ഥാനമോ അടയാളപ്പെടുത്തുന്നു; ‘-വരെ’ അത് മലയാളത്തിൽ സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
- source_word: עַד הַמָּקוֹם
  choice: '... സ്ഥലത്തേക്ക്'
  rationale: രണ്ടാമത്തെ עַד ലക്ഷ്യത്തെ കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നു. മലയാളത്തിൽ ‘വരെ’ ആവർത്തിക്കുന്നതിനെക്കാൾ ‘സ്ഥലത്തേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: തന്റെ കൂടാരം ഉണ്ടായിരുന്ന
  rationale: അബ്രാമിന്റെ മുൻകാല കൂടാരസ്ഥാനം തിരിച്ചറിയിക്കുന്ന ഉപവാക്യം; ‘അവിടെ’ എന്ന שָׁם ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בַּתְּחִלָּה
  choice: ആദ്യം
  rationale: മുമ്പത്തെ പാളയസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന കാലപരാമർശം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: ബേഥേലിനും ഹായിക്കും ഇടയിലുള്ള
  rationale: בֵּין ... וּבֵין എന്ന സ്ഥലബന്ധം മലയാളത്തിലെ ‘-നും -ക്കും ഇടയിൽ’ എന്ന ഘടനയിൽ കൃത്യമായി നൽകി; הָעָי സ്ഥലനാമമായി പരിഭാഷപ്പെടുത്തി.
