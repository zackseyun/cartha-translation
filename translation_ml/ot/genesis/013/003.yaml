translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘നെഗെവ്’, ‘ബേഥേൽ’, ‘ഹായി’ എന്നീ സ്ഥലനാമങ്ങൾ നിലനിർത്തി. לְמַסָּעָיו എന്നതിലെ യാത്രാഘട്ടം/പാളയംമാറ്റം എന്ന ഭാവം മുഖ്യവാചകത്തിലും പദശഃ സാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
