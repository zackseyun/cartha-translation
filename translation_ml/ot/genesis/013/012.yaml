id: GEN.13.12
reference: Genesis 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַבְרָ֖ם יָשַׁ֣ב בְּ/אֶֽרֶץ כְּנָ֑עַן וְ/ל֗וֹט יָשַׁב֙ בְּ/עָרֵ֣י הַ/כִּכָּ֔ר וַ/יֶּאֱהַ֖ל עַד סְדֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: ml
  text: അബ്രാം കനാൻദേശത്തു താമസിച്ചു; ലോത്ത് സമതലത്തിലെ പട്ടണങ്ങളിൽ താമസിച്ചു, സൊദോംവരെ കൂടാരമടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൊദോംവരെ തന്റെ കൂടാരം നീക്കി.” എബ്രായ ക്രിയയ്ക്ക് കൂടാരം അടിക്കുക അല്ലെങ്കിൽ കൂടാരത്തിൽ വസിക്കുക എന്നർഥം വരാം. ഈ ഘട്ടത്തിൽ ലോത്ത് സൊദോം പട്ടണത്തിനകത്ത് താമസിച്ചുവെന്നല്ല, മറിച്ച് അവന്റെ പാളയം സൊദോമിന്റെ ദിശയിലേക്ക് അവിടെവരെ വ്യാപിച്ചുവെന്നാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: താമസിച്ചു
  rationale: താമസിക്കുക, പാർക്കുക എന്ന സാധാരണ സ്ഥിതിവാചക അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തു
  rationale: אֶרֶץ എന്ന ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: സമതലത്തിലെ പട്ടണങ്ങളിൽ
  rationale: ഈ സന്ദർഭത്തിൽ כִּכָּר യോർദ്ദാൻ പ്രദേശത്തെ സമതലത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചന ഘടനയും നിലനിർത്തുന്നു.
- source_word: וַיֶּאֱהַל
  choice: കൂടാരമടിച്ചുകൊണ്ടു നീങ്ങി
  rationale: ക്രിയയ്ക്ക് കൂടാരം അടിക്കുക/കൂടാരവാസം നടത്തുക എന്ന അർഥമുണ്ട്. עַד סְדֹם എന്ന ദിശാപരമായ പരിധിയോടൊപ്പം, പാളയം സൊദോമിലേക്കു വ്യാപിപ്പിച്ച നീക്കം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד סְדֹם
  choice: സൊദോംവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ പരിധി സംരക്ഷിക്കുന്നു; ഈ ഘട്ടത്തിൽ പട്ടണത്തിനകത്ത് താമസമാക്കിയെന്ന് നിർബന്ധമായി പറയുന്നില്ല.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לוֹט
  choice: ലോത്ത്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: סְדֹם
  choice: സൊദോം
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
