translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പാർത്തു’ പോലുള്ള കൂടുതൽ പരമ്പരാഗത രൂപത്തിനു പകരം ‘താമസിച്ചു’ ഉപയോഗിച്ചു. കൂടാരക്രിയയിലെ ചലനവും സ്ഥലപരിധിയും ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിച്ചെങ്കിലും, സൊദോമിനകത്തു പ്രവേശിച്ചെന്ന നിഗമനം ഒഴിവാക്കി.
