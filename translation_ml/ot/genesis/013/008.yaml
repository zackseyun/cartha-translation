id: GEN.13.8
reference: Genesis 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാം ലോത്തിനോട് പറഞ്ഞു: “ദയവായി, എനിക്കും നിനക്കും ഇടയിലും എന്റെ കന്നുകാലിപാലകർക്കും നിന്റെ കന്നുകാലിപാലകർക്കും ഇടയിലും കലഹം ഉണ്ടാകരുത്; കാരണം നമ്മൾ ബന്ധുക്കളാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “നാം സഹോദരന്മാരായ പുരുഷന്മാരാണ്.” ഇവിടെ “സഹോദരന്മാർ” എന്ന എബ്രായ പ്രയോഗം ഒരേ മാതാപിതാക്കളുടെ മക്കളെ മാത്രമല്ല, വിശാലമായ കുടുംബബന്ധത്തെയും സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ സ്വാഭാവിക ക്രമം ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: ദയവായി ... കലഹം ഉണ്ടാകരുത്
  rationale: אַל + ജസ്സീവ് രൂപം വിനയപൂർവമായ നിഷേധാഭ്യർഥനയാണ്; נָא അതിനെ മയപ്പെടുത്തുന്നു. ‘ദയവായി’ ആ സൗമ്യതയും ‘കലഹം ഉണ്ടാകരുത്’ തർക്കം ഒഴിവാക്കാനുള്ള അഭ്യർഥനയും നൽകുന്നു.
- source_word: בֵּינִי וּבֵינֶיךָ ... וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  choice: എനിക്കും നിനക്കും ഇടയിലും എന്റെ കന്നുകാലിപാലകർക്കും നിന്റെ കന്നുകാലിപാലകർക്കും ഇടയിലും
  rationale: ആവർത്തിക്കുന്ന בֵּין ഘടനയും ഇരട്ട ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: എന്റെ കന്നുകാലിപാലകർ ... നിന്റെ കന്നുകാലിപാലകർ
  rationale: רעה എന്ന ധാതുവിലെ പങ്കാളിത്തരൂപം മൃഗസമ്പത്തിനെ മേയ്ക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ വിവിധതരം കന്നുകാലികളുള്ളതിനാൽ ‘ഇടയന്മാർ’ എന്നതിനെക്കാൾ ‘കന്നുകാലിപാലകർ’ വിശാലവും കൃത്യവുമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: അബ്രാമിന്റെ അഭ്യർഥനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഘടകത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: നമ്മൾ ബന്ധുക്കളാണ്
  rationale: ഇവിടെ אַחִים ഒരേ മാതാപിതാക്കളുടെ മക്കൾ എന്ന പരിമിത അർഥത്തിലല്ല; അബ്രാമും ലോത്തും അടുത്ത കുടുംബബന്ധമുള്ളവരാണ്. ‘ബന്ധുക്കൾ’ എന്നത് ഈ സന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അബ്രാമും ലോത്തും സംബന്ധിച്ച് אַחִים എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ബന്ധുക്കൾ’
  alternative: ‘സഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘നാം സഹോദരന്മാരായ പുരുഷന്മാരാണ്’
  rationale: ലോത്ത് അബ്രാമിന്റെ സഹോദരപുത്രനായതിനാൽ ഇവിടെ എബ്രായ ‘സഹോദരന്മാർ’ വിശാലമായ കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘ബന്ധുക്കൾ’ തെറ്റായ ജൈവസഹോദരബന്ധ ധാരണ ഒഴിവാക്കുകയും വാചകത്തിന്റെ ഐക്യത്തിനായുള്ള അഭ്യർഥന നിലനിർത്തുകയും ചെയ്യുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അബ്രാമിന്റെ വിനയപൂർവമായ അഭ്യർഥനയും എബ്രായത്തിലെ ആവർത്തിത ‘ഇടയിൽ’ ഘടനയും സംരക്ഷിച്ചു; ദുർഗ്രാഹ്യമായ അക്ഷരാനുകരണം ഒഴിവാക്കി യഥാർഥ കുടുംബബന്ധത്തിന്റെ അർഥം പ്രധാനവാചകത്തിൽ നൽകി.
