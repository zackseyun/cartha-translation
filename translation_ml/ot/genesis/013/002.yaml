translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ സമ്പത്തിന്റെ മൂന്നു വിഭാഗങ്ങളും ആവർത്തനസമാന്തരതയോടെ നിലനിർത്തി; അർഥം വ്യക്തമാക്കാൻ ആവശ്യമില്ലാത്ത വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
