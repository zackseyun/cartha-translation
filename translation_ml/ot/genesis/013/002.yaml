  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַבְרָ֖ם כָּבֵ֣ד מְאֹ֑ד בַּ/מִּקְנֶ֕ה בַּ/כֶּ֖סֶף וּ/בַ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: ml
  text: അബ്രാം കന്നുകാലികളിലും വെള്ളിയിലും പൊന്നിലും വളരെ സമ്പന്നനായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: അബ്രാം
  rationale: വാക്യാരംഭത്തിലെ ו കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതാണ്; മലയാളത്തിൽ സന്ദർഭം തന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു. പേര് ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: כָּבֵד מְאֹד
  choice: വളരെ സമ്പന്നനായിരുന്നു
  rationale: כָּבֵד എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘ഭാരമുള്ള’ എന്നാണെങ്കിലും, ഇവിടെ പിന്നാലെ സമ്പത്തിന്റെ ഇനങ്ങൾ വരുന്നതിനാൽ ‘സമ്പന്നൻ’ എന്നതാണ് സന്ദർഭോചിതമായ പ്രയോഗാർഥം. מְאֹד-ന്റെ തീവ്രത ‘വളരെ’ എന്നു നിലനിർത്തി.
- source_word: בַּ/מִּקְנֶה
  choice: കന്നുകാലികളാലും
  rationale: מִקְנֶה ഇവിടെ ആടുമാടുകൾ ഉൾപ്പെടുന്ന വളർത്തുമൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പൊതുപദമായി ‘കന്നുകാലികൾ’ തിരഞ്ഞെടുത്തു; בְּ സമ്പത്തിന്റെ മേഖല/അടിസ്ഥാനം സൂചിപ്പിക്കുന്നതായി ‘-ആൽ’ രൂപത്തിൽ നൽകി.
- source_word: בַּ/כֶּסֶף
  choice: വെള്ളിയാലും
  rationale: כֶּסֶף ഇവിടെ സമ്പത്തിന്റെ ഒരു ഇനമായ വെള്ളിയെയാണ് സൂചിപ്പിക്കുന്നത്. പട്ടികയുടെ സമാന്തരഘടന മലയാളത്തിലെ ‘-ആലും’ രൂപത്തിൽ നിലനിർത്തി.
- source_word: וּ/בַ/זָּהָב
  choice: പൊന്നിനാലും
  rationale: זָהָב എന്നതിന് സാധാരണവും സ്വാഭാവികവുമായ മലയാളപദം ‘പൊന്ന്’ ആണ്. ഹീബ്രു പട്ടികയിലെ അവസാന സംയോജനം മലയാളത്തിൽ ‘-ഉം’ ചേർത്ത് പ്രകടമാക്കി.
