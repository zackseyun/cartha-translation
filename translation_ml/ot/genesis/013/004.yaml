id: GEN.13.4
reference: Genesis 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: ml
  text: ആദ്യം അവൻ അവിടെ പണിത യാഗപീഠത്തിന്റെ സ്ഥലത്തേക്ക്. അവിടെ അബ്രാം യഹ്‌വെയുടെ[a] നാമത്തിൽ വിളിച്ചപേക്ഷിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; ഇവിടെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു. പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും മറ്റൊരു ലിപ്യന്തരത്തിൽ ‘യഹോവ’ എന്നും നൽകാറുണ്ട്.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘യഹ്‌വെയുടെ നാമം പ്രഖ്യാപിച്ചു’ / ‘യഹ്‌വെയെ നാമം ചൊല്ലി വിളിച്ചു.’ എബ്രായപ്രയോഗത്തിന് വിളിച്ചപേക്ഷിക്കൽ, നാമം ചൊല്ലിയുള്ള വിളി, പ്രഖ്യാപനം എന്നീ അർഥഭാവങ്ങൾ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ സ്ഥലം
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനപദവും ആരാധനയ്ക്കുള്ള പീഠത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടപദവും സ്വാഭാവികവും കൃത്യവുമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָשָׂה שָׁם
  choice: അവൻ അവിടെ പണിത
  rationale: עשה എന്നത് അക്ഷരാർഥത്തിൽ ‘ഉണ്ടാക്കി’ എന്നാണെങ്കിലും, യാഗപീഠത്തെ സംബന്ധിച്ച് ‘പണിത’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בָּרִאשֹׁנָה
  choice: ആദ്യം
  rationale: അബ്രാം മുമ്പ് ഈ സ്ഥലത്തെത്തിയതും അവിടെ യാഗപീഠം പണിതതുമായ ആദ്യസന്ദർഭത്തിലേക്കുള്ള കാലസൂചന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: എബ്രായപാഠത്തിലെ സ്ഥലസൂചനയും അതിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചപേക്ഷിച്ചു
  rationale: קרא בשם എന്ന പ്രയോഗത്തിലെ ആരാധനാപരമായ വിളിയും അപേക്ഷയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പ്രഖ്യാപനം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּשֵׁם יְהוָה
  choice: യഹ്‌വെയുടെ നാമം
  rationale: ‘നാമം’ എന്ന ഘടകം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് ദൈവനാമമായ יהוה ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സാധാരണ ലിപ്യന്തരണം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗതവും മറ്റൊരു ലിപ്യന്തരവുമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: קרא בשם יהוה എന്ന ആരാധനാപരമായ പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ നാമം വിളിച്ചപേക്ഷിച്ചു
  alternative: യഹ്‌വെയുടെ നാമം പ്രഖ്യാപിച്ചു; യഹ്‌വെയെ നാമം ചൊല്ലി വിളിച്ചു
  rationale: ഈ എബ്രായപ്രയോഗത്തിൽ പ്രാർഥനാപരമായ വിളി, നാമം ചൊല്ലിയുള്ള അഭയം, പൊതുപ്രഖ്യാപനം എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം. മുഖ്യപാഠം സാധാരണ സന്ദർഭാർത്ഥം നൽകുന്നു; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ആദ്യഭാഗം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന എബ്രായഘടനയായതിനാൽ, മൂലത്തിൽ ഇല്ലാത്ത ഒരു ക്രിയ ചേർക്കാതെ അതിന്റെ ഖണ്ഡവാക്യരൂപം നിലനിർത്തിയിരിക്കുന്നു.
