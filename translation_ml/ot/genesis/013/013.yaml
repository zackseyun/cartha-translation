revisions:
- from: സൊദോമിലെ പുരുഷന്മാർ അത്യന്തം ദുഷ്ടരും യഹ്‌വേക്കെതിരെ ഏറെ പാപികളുമായിരുന്നു.[a]
  to: സൊദോമിലെ പുരുഷന്മാർ യഹ്‌വേക്കെതിരെ അത്യന്തം ദുഷ്ടരും പാപികളുമായിരുന്നു.[a]
