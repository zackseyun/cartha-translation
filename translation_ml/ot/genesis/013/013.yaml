id: GEN.13.13
reference: Genesis 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: ml
  text: സൊദോമിലെ പുരുഷന്മാർ യഹ്‌വേക്കെതിരെ അത്യന്തം ദുഷ്ടരും പാപികളുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ മുമ്പാകെ.”
    reason: לַיהוָה എന്ന പ്രയോഗത്തിന് ‘യഹ്‌വേക്കെതിരെ’ എന്നും ‘യഹ്‌വേയുടെ മുമ്പാകെ’ എന്നും അർഥസാധ്യതയുണ്ട്.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי סְדֹם
  choice: സൊദോമിലെ പുരുഷന്മാർ
  rationale: אַנְשֵׁי എന്നത് אִישׁ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണ്; ഇവിടെ സൊദോമിലെ പുരുഷനിവാസികളെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യാരംഭത്തിലെ וְ സന്ദർഭബന്ധം നൽകുന്നുവെങ്കിലും മലയാളത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
- source_word: רָעִים
  choice: ദുഷ്ടർ
  rationale: ഈ ധാർമികസന്ദർഭത്തിൽ പദം കേവലം മോശം എന്നതിലുപരി നൈതികതിന്മയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְ/חַטָּאִים
  choice: പാപികൾ
  rationale: רָעִים എന്നതിനോടു സമാന്തരമായ ബഹുവചന വിധേയനാമരൂപം; പാപം സ്വഭാവമാക്കിയവരെന്ന ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַ/יהוָה
  choice: യഹ്‌വേക്കെതിരെ
  rationale: חטא എന്ന പാപസംബന്ധിയായ പദത്തോടൊപ്പം ל കുറ്റം ആരോടു ചെയ്തുവെന്ന അർഥം നൽകാം. ദൈവനാമം יהוה ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מְאֹד
  choice: അത്യന്തം … ഏറെ
  rationale: മുഴുവൻ വിധേയപ്രസ്താവനയുടെയും ശക്തമായ തീവ്രത സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ രണ്ടു സമാന്തര വിശേഷണങ്ങളോടും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ഈ പ്രയോഗം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള നിയമനാമം പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- issue: חַטָּאִים לַיהוָה എന്നതിലെ ל-യുടെ അർഥം
  choice: യഹ്‌വേക്കെതിരെ പാപികൾ
  alternative: യഹ്‌വേയുടെ സന്നിധിയിൽ പാപികൾ
  rationale: പാപം ദൈവത്തിനെതിരായ കുറ്റമാണെന്ന ബന്ധപരമായ അർഥം മുഖ്യവായനയിൽ നൽകുന്നു; ദൈവത്തിന്റെ മുമ്പിൽ/ദൃഷ്ടിയിൽ എന്ന സാധുവായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അതികഠിനമായ ദുഷ്ടർ’ പോലുള്ള അസ്വാഭാവിക പദസമുച്ചയം ഒഴിവാക്കി സമാന്തര വിധേയഘടന നിലനിർത്തി.
