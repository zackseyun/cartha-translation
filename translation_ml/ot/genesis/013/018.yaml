  text: וַ/יֶּאֱהַ֣ל אַבְרָ֗ם וַ/יָּבֹ֛א וַ/יֵּ֛שֶׁב בְּ/אֵלֹנֵ֥י מַמְרֵ֖א אֲשֶׁ֣ר בְּ/חֶבְר֑וֹן וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാം തന്റെ കൂടാരം മാറ്റി, ഹെബ്രോനിലുള്ള മമ്രേയുടെ ഓക്ക് മരങ്ങൾക്കരികിൽ[a] വന്നു താമസിച്ചു. അവിടെ അവൻ യാഹ്‌വേയ്ക്ക് ഒരു യാഗപീഠം പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മമ്രേയുടെ ടെറിബിന്ത് മരങ്ങൾക്കരികിൽ”; ഹീബ്രു പദം ഓക്ക് മരങ്ങളെയോ ടെറിബിന്തുകളെയോ പോലെയുള്ള വലിയ മരങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: തന്റെ കൂടാരം മാറ്റി
  rationale: കൂടാരമടിച്ചു സഞ്ചരിക്കുക എന്ന ആശയം സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള വരവും പാർപ്പും ആവർത്തിക്കാതിരിക്കുന്നു.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: വന്നു പാർത്തു
  rationale: ഹീബ്രു വിവരണത്തിലെ തുടർച്ചയായ വരവും താമസമുറപ്പിക്കലും സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: മമ്രേയുടെ കരുവേലകങ്ങളുടെ സമീപത്തു
  rationale: אֵלוֹנֵי എന്ന പദം സൂചിപ്പിക്കുന്ന വലിയ മരങ്ങൾക്ക് സാധാരണമായ മലയാളപരിഭാഷയായി ‘കരുവേലകങ്ങൾ’ സ്വീകരിക്കുന്നു; കൃത്യമായ വൃക്ഷവർഗം അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: ഹെബ്രോനിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: അവിടെ അവൻ ഒരു യാഗപീഠം പണിതു
  rationale: שָׁם എന്ന സ്ഥലസൂചനയും מִזְבֵּחַ എന്ന പതിവ് ആരാധനാപദവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: വ്യക്തിനാമമായ יהוה മലയാളത്തിൽ പരിചിതവും ഉച്ചരിക്കാവുന്നതുമായ ‘യഹോവ’ എന്ന് ലിപ്യന്തരം ചെയ്യുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു. പുരാതന ഉച്ചാരണത്തിന്റെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം കാരണം ‘യാഹ്‌വേ’യും സാധുവായ ലിപ്യന്തരസാധ്യതയാണ്.
- issue: אֵלֹנֵי എന്ന പദത്തിലെ വൃക്ഷവർഗം
  choice: കരുവേലകങ്ങൾ
  alternative: ടെരെബിന്ത് മരങ്ങൾ / വലിയ മരങ്ങൾ
  rationale: പദം കരുവേലകങ്ങളെയോ ടെരെബിന്തുകളെയോ പോലുള്ള വലിയ മരങ്ങളെ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ വായനാസൗകര്യമുള്ള ഒരു സാധ്യത സ്വീകരിച്ച് യഥാർഥമായ ശബ്ദാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ‘ഹെബ്രോൻ’, ‘മമ്രേ’ എന്നീ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
