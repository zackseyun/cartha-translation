id: GEN.13.17
reference: Genesis 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: ml
  text: എഴുന്നേൽക്കുക; ദേശത്തുകൂടി അതിന്റെ നീളത്തിലും വീതിയിലും സഞ്ചരിക്കുക; കാരണം ഞാൻ അത് നിനക്കു തരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: എഴുന്നേൽക്കുക
  rationale: קום എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ടുള്ള കല്പനയാണ്. ‘എഴുന്നേൽക്കുക’ ആ കല്പനാഭാവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִתְהַלֵּ֣ךְ
  choice: നടന്നുനോക്കുക
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പഅേൽ ആജ്ഞാരൂപം ദേശത്തിനകത്ത് ചുറ്റിനടക്കുകയോ അതിലൂടെ സഞ്ചരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ദേശത്തിന്റെ വ്യാപ്തിയിലൂടെ നടക്കുക എന്ന ആശയം ‘നടന്നുനോക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്തിന്റെ … അതിലൂടെ
  rationale: אֶרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, അബ്രാമിനു വാഗ്ദാനം ചെയ്ത ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളവാക്യക്രമത്തിൽ സ്ഥലം ‘അതിലൂടെ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ‘ദേശത്തിന്റെ’ എന്ന രൂപം തുടർന്നുള്ള അളവുപദങ്ങളുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: ദേശത്തിന്റെ നീളത്തിലും വീതിയിലും
  rationale: ‘അതിന്റെ നീളത്തിലും അതിന്റെ വീതിയിലും’ എന്ന യഥാരൂപ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഈ ജോടി ദേശത്തിന്റെ സമ്പൂർണ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּ֥י
  choice: കാരണം
  rationale: മുൻ കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְךָ֖
  choice: നിനക്കു
  rationale: נתן എന്ന ക്രിയയോടൊപ്പം ദാനത്തിന്റെ സ്വീകർത്താവായ അബ്രാമിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: אֶתְּנֶֽנָּה
  choice: ഞാൻ അതു … തരും
  rationale: נתן എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ഏകവചന അപൂർണരൂപവും സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും ചേർന്ന് ഭാവിയിലെ വാഗ്ദാനമായി ‘ഞാൻ അതു തരും’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു; ‘അതു’ ദേശത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֶתְּנֶנָּה എന്നതിലെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയത്തിന്റെ സൂചിതപദം
  choice: ‘അതു’ എന്നത് ദേശത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘ഈ ദേശം’ എന്നു സൂചിതപദം തുറന്നുപറയുക
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സ്വാഭാവികമായി אֶרֶץ എന്ന മുൻപദത്തിലേക്കാണ് മടങ്ങുന്നത്. ‘അതു’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ സർവനാമഘടന നിലനിർത്തുകയും അധിക വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ നേരിട്ടുള്ള കല്പനയും അതിനോടു ചേർന്ന വാഗ്ദാനകാരണവും നിലനിർത്തി. ‘നീളത്തിലും വീതിയിലും’ എന്ന ജോടിയിലൂടെ ദേശത്തിന്റെ മുഴുവൻ വ്യാപ്തി സൂചിപ്പിച്ചിരിക്കുന്നു.
