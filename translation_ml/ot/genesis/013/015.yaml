id: GEN.13.15
reference: Genesis 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: ml
  text: കാരണം, നീ കാണുന്ന ദേശം മുഴുവനും ഞാൻ നിനക്കും നിന്റെ സന്തതിക്കും[a] എന്നേക്കുമായി കൊടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ വിത്തിനും.’ എബ്രായത്തിലെ זֶרַע (സെറാ) എന്നത് ‘വിത്ത്,’ ‘സന്തതി,’ അല്ലെങ്കിൽ ‘പിൻതലമുറക്കാർ’ എന്നർഥം വരാവുന്ന ഒരു സമാഹാരനാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: മുൻവാക്യത്തിലെ കല്പനയ്ക്കു പിന്നാലെ വരുന്ന വാഗ്ദാനത്തെ ബന്ധിപ്പിക്കുന്ന ഘടകമാണിത്. മലയാളത്തിൽ ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നത് കൃത്രിമമായി തോന്നാം; അതിനാൽ ബന്ധം സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ നിലനിർത്തി.
- source_word: כָּל הָאָרֶץ אֲשֶׁר אַתָּה רֹאֶה
  choice: നീ കാണുന്ന ദേശം മുഴുവനും
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും אֶרֶץ എന്നതിന്റെ ‘ദേശം’ എന്ന അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ഞാൻ നിനക്ക് ... കൊടുക്കും
  rationale: נתן എന്ന ക്രിയയുടെ ഭാവിവാഗ്ദാനസ്വഭാവവും לְךָ സൂചിപ്പിക്കുന്ന സ്വീകർത്താവിനെയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּלְזַרְעֲךָ
  choice: നിന്റെ സന്തതിക്കും
  rationale: זֶרַע ഒരു സമാഹാരനാമമായി ‘വിത്ത്,’ ‘സന്തതി,’ ‘പിൻതലമുറക്കാർ’ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘സന്തതി’ അതിന്റെ സമാഹാരസ്വഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കുമായി
  rationale: ദീർഘവും അവസാനമില്ലാത്തതുമായ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; പ്രത്യേകമായ അന്ത്യകാല വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദേശവാഗ്ദാനത്തിലെ עַד עוֹלָם എന്ന കാലദൈർഘ്യപ്രയോഗം
  choice: എന്നേക്കുമായി
  alternative: എക്കാലത്തേക്കും; ഒരു യുഗത്തോളം
  rationale: ഈ സന്ദർഭത്തിൽ പദപ്രയോഗത്തിന്റെ സാധാരണവും ശക്തവുമായ അർഥം ‘എന്നേക്കുമായി’ എന്നാണ്. വാഗ്ദാനത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ നിയമപരമോ അന്ത്യകാലപരമോ ആയ പൂർത്തീകരണം പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
- issue: זֶרַע എന്ന സമാഹാരനാമത്തിന്റെ ഏകവചന-ബഹുവചന തുറന്ന നില
  choice: സന്തതി
  alternative: വിത്ത്; പിൻതലമുറക്കാർ
  rationale: ‘സന്തതി’ വ്യക്തിയെയോ സമാഹാരത്തെയോ സൂചിപ്പിക്കാവുന്ന തുറന്ന നില ഒരു പരിധിവരെ നിലനിർത്തുന്നു; ‘പിൻതലമുറക്കാർ’ നിർബന്ധമായി ബഹുവചനമാക്കും, ‘വിത്ത്’ മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസരിച്ചിരിക്കുന്നു; മൂലപാഠത്തിലെ വാഗ്ദാനഭാവവും സമഗ്രതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
