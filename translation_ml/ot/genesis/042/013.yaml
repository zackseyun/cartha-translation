  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്; കനാൻദേശത്ത് ഒരേ പിതാവിന്റെ പുത്രന്മാരാണ്. ഇതാ, ഏറ്റവും ഇളയവൻ ഇന്ന് ഞങ്ങളുടെ പിതാവിനോടൊപ്പമുണ്ട്; ഒരുവൻ ഇല്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരുവൻ ഇല്ല.” ഒരാൾ പോയിരിക്കുന്നു എന്നോ മരിച്ചിരിക്കുന്നു എന്നോ സൂചിപ്പിക്കാവുന്ന ഒരു മൃദൂക്തിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ അവർ പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപത്തിന്റെ കഥാഖ്യാന പുരോഗതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; കർശനമായ കാലക്രമവ്യാഖ്യാനം ചുമത്തുന്നില്ല.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ
  rationale: സഹോദരന്മാർ ഒരു ഈജിപ്ത്യൻ ഭരണാധികാരിയോടു വിനയപൂർവം സ്വയം പരാമർശിക്കുന്ന സന്ദർഭമാണിത്; യഥാർഥ അടിമസ്ഥിതി എന്നതിലുപരി രാജസഭാസംബന്ധമായ വിനയഭാഷയാണ്.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്
  rationale: സംഖ്യയും സഹോദരബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ഒരേ പിതാവിന്റെ പുത്രന്മാർ
  rationale: പന്ത്രണ്ടുപേർക്കും ഒരേ പുരുഷനാണ് പിതാവ് എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും മൂലപാഠത്തിലെ പുരുഷലിംഗ ബന്ധപദം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുള്ള
  rationale: മൂലപാഠത്തിലെ ‘ദേശം’ എന്ന നാമം നിലനിർത്തി, പിതാവിനെക്കുറിച്ചുള്ള സ്ഥാനസൂചനയായി ഹീബ്രു ഘടനയോട് ചേർന്ന് വായിക്കാവുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ഹിന്നേയുടെ അവതരണാത്മകവും ശ്രദ്ധ ക്ഷണിക്കുന്നതുമായ ശക്തി മലയാളത്തിലെ ഗൗരവമുള്ള സാധാരണ പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: הַקָּטֹן
  choice: ഇളയവൻ
  rationale: കുടുംബസന്ദർഭത്തിൽ ഏറ്റവും ഇളയ സഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചെറിയവൻ’ എന്ന പ്രായമോ ശരീരവലിപ്പമോ മുൻനിർത്തുന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: אֶת אָבִינוּ
  choice: ഞങ്ങളുടെ പിതാവിനോടൊപ്പമുണ്ട്
  rationale: ഇവിടെ אֶת കർമചിഹ്നമല്ല, സഹവാസം സൂചിപ്പിക്കുന്ന പദമാണ്; മലയാളത്തിൽ ‘ഒപ്പമുണ്ട്’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള കാലസൂചന അതേപടി നിലനിർത്തുന്നു.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: ഒരുവൻ ഇപ്പോൾ ഇല്ല
  rationale: ‘ഒരുവൻ ഇല്ല’ എന്ന ഹീബ്രു മൃദൂക്തിയുടെ അഭാവം/നഷ്ടം/മരണം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുന്നു; ‘ഇപ്പോൾ’ മലയാളത്തിൽ നിലവിലെ അവസ്ഥ വ്യക്തമാക്കുന്നു, എന്നാൽ മരണം ഉറപ്പിച്ചു പറയുന്നില്ല.
theological_decisions:
- issue: ലിംഗസൂചകമായ കുടുംബബന്ധഭാഷ
  choice: ഒരേ പിതാവിന്റെ പുത്രന്മാർ
  alternative: ഒരാളുടെ മക്കൾ
  rationale: ഹീബ്രു പാഠം പുരുഷസന്തതിയെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ഈ കഥയിൽ യാക്കോബിന്റെ പുത്രന്മാരെ ഉദ്ദേശിക്കുകയും ചെയ്യുന്നതിനാൽ ലിംഗനിഷ്പക്ഷമാക്കാതെ നിലനിർത്തി.
- issue: ‘ഒരുവൻ ഇല്ല’ എന്നതിലെ യോസേഫിന്റെ നിലയെക്കുറിച്ചുള്ള അവ്യക്തത
  choice: ഒരുവൻ ഇപ്പോൾ ഇല്ല
  alternative: ഒരുവൻ മരിച്ചുപോയി
  rationale: സഹോദരന്മാരുടെ ഭാഷ അഭാവത്തെയോ നഷ്ടത്തെയോ സൂചിപ്പിക്കുന്ന മൃദൂക്തിയാണ്; മരണം വ്യക്തമായി പ്രഖ്യാപിക്കാത്തതിനാൽ ആ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചുകളഞ്ഞിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ഭരണാധികാരിയോടുള്ള വിനയം കാണിക്കാൻ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ‘ഇതാ’ ഹീബ്രു അവതരണപദത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അവസാന വാക്യത്തിലെ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
