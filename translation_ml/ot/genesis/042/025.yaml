source:
  edition: WLC
  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: ml
  text: അപ്പോൾ യോസേഫ് അവരുടെ പാത്രങ്ങളിൽ[a] ധാന്യം നിറയ്ക്കാനും, ഓരോരുത്തന്റെ വെള്ളി[b] അവനവന്റെ ചാക്കിൽ തിരികെ വെക്കാനും, യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ അവർക്കു കൊടുക്കാനും കല്പിച്ചു. അങ്ങനെ അവർക്കുവേണ്ടി ചെയ്യപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാത്രങ്ങളിൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം പൊതുവായതാണ്; പിന്നീട് ‘ചാക്ക്’ എന്നതിന് മറ്റൊരു പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വെള്ളി’ എന്നത് ഈ സന്ദർഭത്തിൽ ‘പണം’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവൻ അവർക്കുവേണ്ടി അങ്ങനെ ചെയ്തു.’ എബ്രായവാക്യം കർത്താവിനെ പേരെടുത്ത് പറയുന്നില്ല.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה ഒരു ആജ്ഞ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുവരുന്ന ക്രിയകളെ ഒരൊറ്റ കല്പനയുടെ ഉള്ളടക്കമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘കല്പിച്ചു’ യോജിക്കുന്നു.
- source_word: כְּלֵיהֶם
  choice: അവരുടെ സംഭരണപാത്രങ്ങളിൽ
  rationale: כְּלִי എന്നത് പൊതുവായി പാത്രം അഥവാ സാധനങ്ങൾ സൂക്ഷിക്കുന്ന ഉപകരണം എന്നർഥമുള്ളതാണ്. വാക്യത്തിൽ പിന്നീട് വരുന്ന שַׂק (‘ചാക്ക്’) എന്ന പ്രത്യേക പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘സംഭരണപാത്രങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בָּר
  choice: ധാന്യം
  rationale: ക്ഷാമകാലത്തെ ഈജിപ്തിന്റെ പശ്ചാത്തലത്തിൽ בָּר ധാന്യവിളയെ സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക ധാന്യവർഗമായി ചുരുക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: അവരുടെ വെള്ളി തിരികെ വെക്കാനും
  rationale: כֶּסֶף എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വെള്ളി’ ആണെങ്കിലും സന്ദർഭത്തിൽ അത് പണമായി ഉപയോഗിച്ച വെള്ളിയെയാണ് സൂചിപ്പിക്കുന്നത്. തുടർന്നുള്ള വിവരണത്തിലെ മൂർത്തമായ പരാമർശം നിലനിർത്താൻ ‘വെള്ളി’ സ്വീകരിച്ചു.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: ഓരോരുത്തന്റെയും വെള്ളി അവനവന്റെ ചാക്കിൽ
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നാണ്; שַׂק എന്ന പ്രത്യേക പദം ‘ചാക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അവനവന്റെ’ ഉപയോഗിച്ചു.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ അവർക്കു കൊടുക്കാനും
  rationale: צֵדָה യാത്രയ്ക്കായി കരുതുന്ന ഭക്ഷണമോ വിഭവങ്ങളോ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘ഭക്ഷണസാധനങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: അങ്ങനെ അവർക്കുവേണ്ടി ചെയ്യപ്പെട്ടു
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനത്തിലാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല. നിർവഹിച്ച വ്യക്തിയെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ കല്പന നടപ്പായെന്ന ആശയം നിലനിർത്താൻ കർമണിപ്രയോഗം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘സംഭരണപാത്രങ്ങൾ’ എന്നും ‘ചാക്ക്’ എന്നും വേർതിരിച്ച് മൂലപാഠത്തിലെ പദവ്യത്യാസം നിലനിർത്തി; അവസാന ക്രിയയിലെ അനിശ്ചിത കർത്താവിനെ കർമണിപ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
