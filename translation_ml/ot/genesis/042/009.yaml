  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַ/חֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָ/הֶ֑ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִ/רְא֛וֹת אֶת עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് അവരെക്കുറിച്ച് താൻ കണ്ട സ്വപ്നങ്ങൾ ഓർത്തു. അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ ചാരന്മാരാണ്; ദേശത്തിന്റെ നഗ്നത[a] കാണാനാണ് നിങ്ങൾ വന്നിരിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദേശത്തിന്റെ തുറന്നുകിടക്കുന്ന, ദുർബല ഭാഗങ്ങൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ദേശത്തിന്റെ നഗ്നത”; ആക്രമണത്തിന് എളുപ്പമുള്ള പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: ഓർത്തു
  rationale: זכר എന്ന ക്രിയയുടെ ഈ കഥനരൂപം ആ നിമിഷത്തിൽ യോസേഫ് സ്വപ്നങ്ങൾ ഓർത്തതിനെ നേരായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: കണ്ട സ്വപ്നങ്ങൾ
  rationale: മലയാളത്തിൽ സ്വപ്നം ‘കാണുക’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം; എബ്രായത്തിലെ സമാനപദാവർത്തനം വാക്കിന് വാക്കായി പകർത്താതെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָהֶם
  choice: അവരെക്കുറിച്ചു
  rationale: സന്ദർഭത്തിൽ സ്വപ്നങ്ങൾ യോസേഫിന്റെ സഹോദരന്മാരെ സംബന്ധിച്ചവയാണ്; ‘അവരെക്കുറിച്ചു’ ഈ ബന്ധാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാർ
  rationale: ഇവിടെ רגל എന്ന ധാതുവിൽനിന്നുള്ള രൂപം രഹസ്യമായി വിവരശേഖരണം നടത്തുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘ചാരന്മാർ’ വ്യക്തവും സാധാരണവുമായ മലയാള പദമാണ്.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: ഇൻഫിനിറ്റീവിന്റെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; നിരീക്ഷിച്ച് ദൗർബല്യം കണ്ടെത്തുക എന്ന ആശയം ആരോപണത്തിന്റെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: עֶרְוַת הָאָרֶץ
  choice: ദേശത്തിന്റെ നഗ്നത
  rationale: എബ്രായത്തിലെ സജീവമായ രൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ആക്രമണത്തിന് തുറന്നുകിടക്കുന്ന ദുർബല ഭാഗങ്ങൾ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּאתֶם
  choice: നിങ്ങൾ വന്നിരിക്കുന്നത്
  rationale: അവരുടെ വരവിന്റെ ഉദ്ദേശ്യത്തെ ഇപ്പോഴത്തെ ആരോപണവുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ രൂപകത്തിന്റെ ശക്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
