id: GEN.42.21
reference: Genesis 42:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ തമ്മിൽ പറഞ്ഞു: “നമ്മുടെ സഹോദരന്റെ കാര്യത്തിൽ നാം തീർച്ചയായും കുറ്റക്കാരാണ്. അവൻ ഞങ്ങളോടു കേണപേക്ഷിച്ചപ്പോൾ അവൻ അനുഭവിച്ച അഗാധമായ കഷ്ടത[a] നാം കണ്ടിട്ടും അവന്റെ അപേക്ഷ ചെവിക്കൊണ്ടില്ല. അതുകൊണ്ടാണ് ഈ കഷ്ടത[b] നമുക്കു വന്നിരിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അവന്റെ പ്രാണന്റെ കഷ്ടത.” ഈ എബ്രായപ്രയോഗം അവൻ അനുഭവിച്ച അഗാധമായ വ്യക്തിപരമായ കഷ്ടതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യോസേഫിന്റെ “കഷ്ടത”യെയും സഹോദരന്മാരുടെ ഇപ്പോഴത്തെ “കഷ്ടത”യെയും സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ഒരേ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അവരുടെ മുൻകാല ക്രൂരതയും ഇപ്പോഴത്തെ ദുരിതവും ഇതിലൂടെ ബന്ധിപ്പിക്കപ്പെടുന്നു.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: അപ്പോൾ അവർ തമ്മിൽ പറഞ്ഞു
  rationale: പരസ്പരം സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ വിതരണപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കഥാഖ്യാനത്തിലെ waw-നെ ‘അപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: אֲבָל
  choice: തീർച്ചയായും
  rationale: ഇവിടെ വൈരുധ്യമല്ല, കുറ്റസമ്മതത്തിന് ഊന്നൽ നൽകുന്ന പ്രയോഗമാണ്.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: നമ്മുടെ സഹോദരന്റെ കാര്യത്തിൽ നാം ... കുറ്റക്കാരാണ്
  rationale: കുറ്റബാധ്യതയും അതിന്റെ വിഷയവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘സഹോദരനെതിരായി’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: צָרַת נַפְשׁוֹ
  choice: അവന്റെ ഉള്ളിലെ കഠിനവേദന
  rationale: ‘അവന്റെ ജീവൻ/ആത്മാവിന്റെ കഷ്ടത’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ആഴമുള്ള വ്യക്തിപരമായ വേദനയായി നൽകുന്നു.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: അവൻ ഞങ്ങളോടു കേണപേക്ഷിച്ചപ്പോൾ
  rationale: חנן എന്ന ക്രിയാരൂപത്തിലെ തീവ്രമായ യാചനാഭാവം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത ‘കരുണയ്ക്കായി’ എന്ന കർമം ചേർക്കുന്നില്ല.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: അവന്റെ അപേക്ഷ ചെവിക്കൊണ്ടില്ല
  rationale: കേവലം ശബ്ദം കേൾക്കാതിരുന്നതല്ല, അപേക്ഷ അനുസരിക്കാതിരുന്നതാണ് സന്ദർഭാർഥം. ‘അപേക്ഷ’ സന്ദർഭത്തിൽ നിന്ന് വ്യക്തമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ഉപയോഗിക്കുന്നു.
- source_word: עַל־כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻകാല പ്രവൃത്തിയും ഇപ്പോഴത്തെ ഫലവും തമ്മിലുള്ള കാരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: ഈ കഷ്ടത നമുക്കു വന്നിരിക്കുന്നത്
  rationale: എബ്രായത്തിലെ വരിക എന്ന രൂപകം നിലനിർത്തുന്നു. മുമ്പത്തെ צָרַת-നോടുള്ള പദമൂലബന്ധം മലയാളത്തിൽ ഒരേ പദംകൊണ്ട് പൂർണമായി പുനരാവിഷ്കരിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘ആത്മാവിന്റെ കഷ്ടത’ എന്ന കൃത്രിമമായ പദാനുപദരൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ‘ഉള്ളിലെ കഠിനവേദന’ ഉപയോഗിച്ചു; മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്കുകൾക്കരികിൽ സ്ഥാപിച്ചു.
