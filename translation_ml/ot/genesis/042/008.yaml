lexical_decisions:
- source_word: וַיַּכֵּר
  choice: തിരിച്ചറിഞ്ഞു
  rationale: נכר എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപം ഇവിടെ മുമ്പ് അറിയാവുന്ന ഒരാളെ തിരിച്ചറിയുക എന്നർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗമാണിത്.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: אֶת־אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ אָח, മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടി, ഈ സന്ദർഭത്തിൽ യോസേഫിന്റെ ആൺസഹോദരന്മാരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പുനർനിർദ്ദേശത്തിനായി ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: וְהֵם
  choice: എന്നാൽ അവർ
  rationale: ו സാധാരണയായി ‘ഉം/കൂടാതെ’ എന്ന ബന്ധം നൽകാമെങ്കിലും ഇവിടെ രണ്ടു വിഭാഗങ്ങളുടെ തിരിച്ചറിവിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ അനുയോജ്യം.
- source_word: לֹא
  choice: ഇല്ല
  rationale: മലയാളത്തിലെ ഭൂതകാല നിഷേധക്രിയയായ ‘തിരിച്ചറിഞ്ഞില്ല’ എന്ന രൂപത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: הִכִּרֻהוּ
  choice: അവനെ തിരിച്ചറിഞ്ഞില്ല
  rationale: ആദ്യ ഉപവാക്യത്തിലെ അതേ נכר ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും കർമപ്രത്യയം യോസേഫിനെ സൂചിപ്പിക്കുന്ന ‘അവനെ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
