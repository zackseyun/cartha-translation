id: GEN.42.31
reference: Genesis 42:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נֹּ֥אמֶר אֵלָ֖י/ו כֵּנִ֣ים אֲנָ֑חְנוּ לֹ֥א הָיִ֖ינוּ מְרַגְּלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: ml
  text: 'ഞങ്ങൾ അവനോട് പറഞ്ഞു: “ഞങ്ങൾ സത്യസന്ധരാണ്[a]; ഞങ്ങൾ ചാരന്മാരായിരുന്നില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ നേരുള്ളവരാണ്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങൾ ചാരപ്രവർത്തനം നടത്തുകയായിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: ഞങ്ങൾ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ ‘ഞങ്ങൾ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: אֶל എന്ന പൂർവപ്രത്യയവും മൂന്നാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയവും ചേർന്ന രൂപത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: כֵּנִים
  choice: സത്യസന്ധരാണ്
  rationale: ചാരന്മാരാണെന്ന ആരോപണത്തിന് എതിരായി, തങ്ങൾ വിശ്വസിക്കാവുന്നവരും കപടമില്ലാത്തവരുമാണെന്ന് സഹോദരന്മാർ അവകാശപ്പെടുന്നു. ‘സത്യസന്ധരാണ്’ ആ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘നേരുള്ളവരാണ്’ എന്നതും സാധ്യമാണ്.
- source_word: אֲנָחְנוּ
  choice: ഞങ്ങൾ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിന് ഊന്നൽ നൽകുന്നു; മലയാളത്തിലെ വ്യക്തമായ ‘ഞങ്ങൾ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לֹא הָיִינוּ
  choice: ആയിരുന്നില്ല
  rationale: നിഷേധിക്കപ്പെട്ട היה രൂപം ഭൂതകാലത്തിലെ അവസ്ഥയെയോ തുടർന്ന പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന കർത്തൃവാചക നാമത്തോടൊപ്പം ‘ആയിരുന്നില്ല’ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാർ
  rationale: רגל എന്ന ധാതുവിന്റെ ബഹുവചന participle ഇവിടെ ചാരന്മാരായി പ്രവർത്തിക്കുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘ചാരന്മാർ’ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘സത്യസന്ധർ/നേരുള്ളവർ’ എന്ന പദാർഥവ്യാപ്തിയും ‘ചാരന്മാർ ആയിരിക്കുക/ചാരപ്രവർത്തനം നടത്തുക’ എന്ന ഘടനാപരമായ സാധ്യതയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
