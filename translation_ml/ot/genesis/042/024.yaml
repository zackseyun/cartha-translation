source:
  edition: WLC
  text: וַ/יִּסֹּ֥ב מֵֽ/עֲלֵי/הֶ֖ם וַ/יֵּ֑בְךְּ וַ/יָּ֤שָׁב אֲלֵ/הֶם֙ וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם וַ/יִּקַּ֤ח מֵֽ/אִתָּ/ם֙ אֶת שִׁמְע֔וֹן וַ/יֶּאֱסֹ֥ר אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: ml
  text: അവൻ അവരിൽനിന്ന് തിരിഞ്ഞുമാറി കരഞ്ഞു. പിന്നെ അവരുടെ അടുക്കൽ മടങ്ങിവന്ന് അവരോടു സംസാരിച്ചു. അവൻ അവരിൽനിന്ന് ശിമെയോനെ എടുത്ത് അവരുടെ കൺമുമ്പിൽവെച്ച് ബന്ധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: അവരിൽനിന്ന് തിരിഞ്ഞുമാറി
  rationale: סבב എന്ന ക്രിയയും വേർപാടിനെ സൂചിപ്പിക്കുന്ന מֵעֲלֵיהֶם എന്ന പ്രയോഗവും ചേർന്ന്, യോസേഫ് അവരുടെ സാന്നിധ്യത്തിൽനിന്ന് മാറിനിന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തിരിഞ്ഞുമാറി’ ശാരീരികമായി തിരിയുന്നതും അവരിൽനിന്ന് അകലുന്നതും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיֵּבְךְּ
  choice: കരഞ്ഞു
  rationale: בכה എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം കണ്ണീരോടെ കരയുക എന്നതാണ്; ആധുനിക മലയാളത്തിൽ ‘കരഞ്ഞു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: അവരുടെ അടുക്കൽ മടങ്ങിവന്ന്
  rationale: שׁוב മടങ്ങിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; אֲלֵהֶם ലക്ഷ്യദിശയായി ‘അവരുടെ അടുക്കൽ’ എന്നു കൃത്യമായി പകരുന്നു.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: അവരോടു സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സംസാരിക്കുക’ എന്നതാണ്. ഉള്ളടക്കം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: וַיִּקַּח מֵאִתָּם אֶת־שִׁמְעוֹן
  choice: അവരുടെ ഇടയിൽനിന്ന് ശിമെയോനെ പിടിച്ച്
  rationale: מֵאִתָּם കൂട്ടത്തിൽനിന്നുള്ള വേർതിരിച്ചെടുക്കലിനെ സൂചിപ്പിക്കുന്നു. ഈ സാഹചര്യത്തിൽ לקח വെറും ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്നതിലുപരി കാവലിലാക്കാൻ പിടിക്കുന്ന പ്രവൃത്തിയായതിനാൽ ‘പിടിച്ച്’ സ്വാഭാവികമാണ്.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: ബന്ധിച്ചു
  rationale: אסר അടിസ്ഥാനപരമായി കെട്ടുക അഥവാ ബന്ധിക്കുക എന്നാണ്; ‘തടവിലാക്കി’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: לְעֵינֵיהֶם
  choice: അവരുടെ കൺമുമ്പിൽവെച്ച്
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരുടെ കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന ദൃശ്യവും പരസ്യവുമായ പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a], [b] കുറിപ്പുകൾ ഹീബ്രു പാഠത്തിൽ യഥാർഥമായ പാഠഭേദമോ അർത്ഥദ്വയമോ രേഖപ്പെടുത്തുന്നില്ല; പ്രത്യേകിച്ച് [a] തെറ്റായ സ്ഥാനത്തുള്ളതായി തോന്നുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
