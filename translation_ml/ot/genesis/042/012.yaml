source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “അല്ല, നിങ്ങൾ ദേശത്തിന്റെ നഗ്നത[a] കാണാൻ വന്നവരാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്തിന്റെ തുറന്നുകിടക്കുന്ന അല്ലെങ്കിൽ പ്രതിരോധമില്ലാത്ത ഭാഗങ്ങൾ.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്റെ നഗ്നത’ എന്നാണ്; അധിനിവേശികൾക്കോ ചാരന്മാർക്കോ മുതലെടുക്കാവുന്ന ദുർബലപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ഒരു രൂപകമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ചാരപ്പണി നടത്താൻ.’ ഹീബ്രു ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ അവർ രഹസ്യമായി ദേശം നിരീക്ഷിക്കാൻ വന്നവരാണെന്ന് യോസേഫ് ആരോപിക്കുകയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: എന്നാൽ അവൻ അവരോടു പറഞ്ഞു
  rationale: വാവ് തുടർന്നുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നുവെങ്കിലും, മുൻവാക്യത്തിലെ അവരുടെ നിഷേധത്തോടുള്ള എതിർപ്രതികരണമായതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לֹא
  choice: അല്ല
  rationale: സഹോദരന്മാരുടെ അവകാശവാദത്തെ പെട്ടെന്ന് തള്ളിക്കളയുന്ന ഹീബ്രു നിഷേധത്തിന്റെ ചുരുക്കവും ശക്തവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: ; … തന്നെയാണ്
  rationale: ഇവിടെ ഈ പദം നിഷേധത്തിനു പിന്നാലെ തിരുത്തിക്കൊണ്ടുള്ള ആരോപണം അവതരിപ്പിക്കുന്നു. അർദ്ധവിരാമവും ‘തന്നെയാണ്’ എന്ന ഊന്നലും ആ തിരുത്തൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֶרְוַת הָאָרֶץ
  choice: ദേശത്തിന്റെ നഗ്നത
  rationale: ഹീബ്രുവിലെ ദൃശ്യരൂപകം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദേശത്തിന്റെ തുറന്നുകിടക്കുന്ന അഥവാ പ്രതിരോധമില്ലാത്ത ദുർബലഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּאתֶם
  choice: നിങ്ങൾ വന്നത്
  rationale: അവരുടെ വരവിന്റെ ഉദ്ദേശ്യത്തെ ഇപ്പോഴത്തെ ആരോപണവുമായി ബന്ധിപ്പിക്കുന്ന ഹീബ്രു പൂർണ്ണക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ നൽകുന്നു.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർത്ഥമായ ‘കാണുക’ നിലനിർത്തുന്നു. സന്ദർഭം ചാരനിരീക്ഷണത്തെ സൂചിപ്പിച്ചാലും, മൂലപാഠം പതിവായി ‘ചാരവൃത്തി ചെയ്യുക’ എന്നർത്ഥം നൽകുന്ന പ്രത്യേക ക്രിയ ഉപയോഗിക്കുന്നില്ല.
