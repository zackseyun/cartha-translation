source:
  edition: WLC
  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: ml
  text: എന്നാൽ, യോസേഫിന് അവർ പറയുന്നത് മനസ്സിലാകുന്നുണ്ടെന്ന് അവർ അറിഞ്ഞില്ല[a]; കാരണം അവർക്കിടയിൽ പരിഭാഷകൻ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യോസേഫ് കേൾക്കുന്നുണ്ടെന്ന്.” ഇവിടെ അവർ പറയുന്നത് അദ്ദേഹത്തിന് മനസ്സിലാകുന്നു എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: എന്നാൽ ... അവർ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ആഖ്യാനപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രത്യക്ഷമായ കർത്താവിനെയും നിലനിർത്തുന്നു.
- source_word: לֹא יָדְעוּ
  choice: അറിഞ്ഞില്ല
  rationale: അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ידע എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: כִּי
  choice: എന്ന്
  rationale: ആദ്യ כִּי അവർ അറിയാതിരുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: שֹׁמֵעַ
  choice: തങ്ങൾ പറയുന്നത് മനസ്സിലാക്കുന്നുണ്ടെന്ന്
  rationale: שׁמע എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കേൾക്കുക’ എന്നാണെങ്കിലും, പരിഭാഷകൻ സന്നിഹിതനായിരുന്ന ഈ സന്ദർഭത്തിൽ യോസേഫിന് അവരുടെ ഭാഷ ഗ്രഹിക്കാമായിരുന്നു എന്നതാണ് ആശയം. ‘തങ്ങൾ പറയുന്നത്’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: כִּי
  choice: കാരണം
  rationale: രണ്ടാമത്തെ כִּי അവർക്ക് കാര്യം അറിയാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: הַמֵּלִיץ
  choice: ഒരു പരിഭാഷകൻ
  rationale: ഈ സന്ദർഭത്തിൽ കക്ഷികൾക്കിടയിൽ ഭാഷ കൈമാറുന്ന ഇടനിലക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്. ഹീബ്രുവിലെ നിർദിഷ്ടരൂപം പ്രവർത്തനപരമായി തിരിച്ചറിയപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ അനിർദിഷ്ടരൂപം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: בֵּינֹתָם
  choice: അവർക്കിടയിൽ
  rationale: യോസേഫിനും സഹോദരന്മാർക്കും ഇടയിലെ പരിഭാഷകന്റെ മധ്യസ്ഥസ്ഥാനം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതമായ ‘മനസ്സിലാക്കുക’ സ്വീകരിച്ചെങ്കിലും, שֹׁמֵעַ എന്ന പദത്തിന്റെ അക്ഷരാർഥവും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
