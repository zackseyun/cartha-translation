base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: ml
  text: യോസേഫ് ആ ദേശത്തിന്റെ ഭരണാധികാരിയായിരുന്നു; ദേശത്തിലെ സകല ജനങ്ങൾക്കും ധാന്യം വിറ്റിരുന്നത് അവൻതന്നെയായിരുന്നു. യോസേഫിന്റെ സഹോദരന്മാർ വന്ന് അവന്റെ മുമ്പിൽ മുഖം നിലത്തോടു ചേർത്ത് കുമ്പിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവന്റെ മുമ്പിൽ ആഴത്തിൽ കുനിഞ്ഞു.” എബ്രായ ക്രിയ ആദരസൂചകമായി ആഴത്തിൽ കുനിയുന്നതിനെയോ നിലംതൊടുന്ന പ്രണിപാതത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: ഭരണാധികാരി
  rationale: ദേശത്തിന്മേൽ അധികാരം പ്രയോഗിക്കുന്നവൻ എന്ന അർഥം സ്വാഭാവികവും പദവിയെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാത്തതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ആ ദേശത്തിന്റെ
  rationale: ഇവിടെ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, സന്ദർഭത്തിലുള്ള ദേശമായ ഈജിപ്തിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉടമസ്ഥബന്ധമുള്ള പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: הַמַּשְׁבִּיר
  choice: ധാന്യം വിറ്റിരുന്നതും
  rationale: ക്ഷാമസന്ദർഭത്തിൽ שׁבר എന്ന ഹിഫീൽ പങ്കാളിപദം ധാന്യം വിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അന്തർലീനമായ കർമം വ്യക്തമാക്കുന്നു.
- source_word: לְכָל עַם הָאָרֶץ
  choice: ദേശത്തിലെ സകല ജനങ്ങൾക്കും
  rationale: עַם എന്ന സമൂഹവാചക ഏകവചനത്തിന്റെ അർഥം നിലനിർത്തുന്നു; הָאָרֶץ പ്രാദേശികമായി ഗ്രഹിക്കുന്നു.
- source_word: אֲחֵי יוֹסֵף
  choice: യോസേഫിന്റെ സഹോദരന്മാർ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിന് സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപം.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു
  rationale: വന്ദനസൂചകമായ ആഴത്തിലുള്ള കുനിയൽ അഥവാ പ്രണിപാതം എന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുന്നു; ദൈവാരാധന എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: אַפַּיִם אָרְצָה
  choice: മുഖം നിലത്തോടു ചേർത്ത്
  rationale: പൂർണ പ്രണിപാതത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְ
  choice: പ്രത്യേക പദമായി നൽകിയിട്ടില്ല
  rationale: വാക്യബന്ധവും ആഖ്യാനതുടർച്ചയും മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാണ്; സ്രോതസ്സിലില്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോസേഫിന്റെ സഹോദരന്മാർ അവന്റെ മുമ്പിൽ ചെയ്ത പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീണു
  alternative: അവനെ ആരാധിച്ചു
  rationale: ഈ രംഗം സാമൂഹിക കീഴടങ്ങലും ആദരവും പ്രകടിപ്പിക്കുന്ന പ്രണിപാതമാണ്; ദൈവാരാധനയാണെന്ന് പാഠം പറയുന്നില്ല. അതേസമയം യോസേഫിന്റെ മുൻകാല സ്വപ്നങ്ങളുമായുള്ള ബന്ധം വ്യക്തമാകുന്ന ശാരീരിക ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭരണാധികാരി’, ‘ധാന്യം വിറ്റിരുന്നു’ എന്നിവ ഭരണപരവും ക്ഷാമസന്ദർഭപരവുമായ അർഥം വ്യക്തമായി നൽകുന്നു. ‘സാഷ്ടാംഗം വീണു’ എന്നത് ഇന്നും ഗ്രാഹ്യമായ ഔപചാരിക പ്രയോഗമാണ്; അതിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
