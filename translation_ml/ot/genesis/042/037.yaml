translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പിതാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. എബ്രായ പ്രയോഗത്തിന്റെ കൈ-ദൃശ്യരൂപം മുഖ്യവാചകത്തിൽ ഭാഗികമായി നിലനിർത്തി, പൂർണ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
