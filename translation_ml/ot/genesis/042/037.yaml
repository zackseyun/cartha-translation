source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: ml
  text: 'അപ്പോൾ രൂബേൻ തന്റെ അപ്പനോടു പറഞ്ഞു: “ഞാൻ അവനെ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവരുന്നില്ലെങ്കിൽ, അങ്ങ് എന്റെ രണ്ടു പുത്രന്മാരെ കൊന്നുകളയുക. അവനെ എന്റെ കൈയിൽ ഏൽപ്പിക്കൂ[a]; ഞാൻ തന്നെ അവനെ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവനെ എന്റെ കൈമേൽ വെക്കൂ”; അഥവാ, “അവനെ എന്നെ വിശ്വസിച്ച് ഏൽപ്പിക്കൂ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബോധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶל אָבִיו
  choice: തന്റെ അപ്പനോടു
  rationale: ബന്ധത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘തന്റെ’ എന്നത് വിഷയമായ രൂബേനിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: എന്റെ രണ്ടു പുത്രന്മാരെയും അങ്ങേക്കു കൊല്ലാം
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് രൂബേൻ പിതാവിന് നൽകുന്ന അതിരൂക്ഷമായ ഉറപ്പായതിനാൽ അനുവാദസൂചകമായ ‘അങ്ങേക്കു കൊല്ലാം’ ഉപയോഗിച്ചു.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: ഞാൻ അവനെ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവരുന്നില്ലെങ്കിൽ
  rationale: നിഷേധാത്മക നിബന്ധന നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭം ബെന്യാമീന്റെ മടങ്ങിവരവായതിനാൽ בוא എന്നതിൽ ‘തിരികെ’ ചേർത്തു.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: അവനെ എന്റെ കൈയിൽ ഏൽപ്പിക്കൂ
  rationale: ‘എന്റെ കൈമേൽ/കൈയിൽ വെക്കുക’ എന്ന എബ്രായ ദൃശ്യരൂപവും ‘എന്നെ ഏൽപ്പിക്കുക’ എന്ന പ്രയോഗാർത്ഥവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַאֲנִי
  choice: ഞാൻതന്നെ
  rationale: വ്യക്തമായ സർവനാമം നൽകുന്ന ഊന്നൽ ‘തന്നെ’കൊണ്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: അവനെ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവരും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ കൊണ്ടുവരുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു.
