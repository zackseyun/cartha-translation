source:
  edition: WLC
  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: ml
  text: പിന്നെ അവർ കനാൻദേശത്തുള്ള തങ്ങളുടെ അപ്പനായ യാക്കോബിന്റെ അടുക്കൽ വന്ന്, തങ്ങൾക്ക് സംഭവിച്ചതെല്ലാം അദ്ദേഹത്തോട് അറിയിച്ചു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: “തങ്ങളുടെ അപ്പനായ യാക്കോബിന്റെ അടുക്കൽ, കനാൻദേശത്തേക്ക്.” മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി “കനാൻദേശത്തുള്ള തങ്ങളുടെ അപ്പനായ യാക്കോബിന്റെ അടുക്കൽ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: പിന്നെ അവർ ... വന്നു
  rationale: വയീഖ്തോൽ രൂപം കഥയിലെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ആ ക്രമാനുഗതത്വം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: തങ്ങളുടെ അപ്പനായ യാക്കോബിന്റെ അടുക്കൽ
  rationale: אֶל എന്ന ദിശാസൂചക അവ്യയവും ‘അവരുടെ അപ്പൻ’ എന്ന ബന്ധവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אַרְצָה כְּנָעַן
  choice: കനാൻദേശത്തുള്ള
  rationale: ഹീബ്രായത്തിലെ ദിശാസൂചക രൂപം കനാൻദേശത്തേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഇരട്ട ലക്ഷ്യപ്രയോഗം ഒഴിവാക്കി യാക്കോബിന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּגִּידוּ לוֹ
  choice: അദ്ദേഹത്തോടു വിവരിച്ചുപറഞ്ഞു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അറിയിക്കുക/വിവരിക്കുക എന്ന ആശയം നൽകുന്നു; സംഭവങ്ങളെ വിശദമായി അറിയിച്ചതെന്ന സന്ദർഭസൂചനയും ആദരസൂചക സർവനാമവും ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: തങ്ങൾക്ക് സംഭവിച്ചതെല്ലാം
  rationale: קרה എന്നതിൽനിന്നുള്ള രൂപം അവർക്കു സംഭവിച്ച കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു; മൊത്തത്തെയും ‘എല്ലാം’ നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: 'വിവരിച്ചുപറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സുലഭവും ഈ കുടുംബസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; യാക്കോബിനെ പരാമർശിക്കുമ്പോൾ ‘അദ്ദേഹം’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു.
