id: GEN.42.27
reference: Genesis 42:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: ml
  text: താവളത്തിൽവെച്ച്[a] അവരിൽ ഒരാൾ തന്റെ കഴുതയ്ക്കു തീറ്റ കൊടുക്കാൻ ചാക്ക് തുറന്നു. അപ്പോൾ അവൻ തന്റെ വെള്ളിപ്പണം[b] കണ്ടു; അതാ, അത് അവന്റെ സഞ്ചിയുടെ വായ്ക്കൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യാത്രയ്ക്കിടെ രാത്രി തങ്ങുന്ന സ്ഥലത്ത്.
    reason: lexical_clarification
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വെള്ളി’; ഇവിടെ അവൻ ധാന്യത്തിനു വിലയായി കൊടുത്ത പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: തുറന്നു
  rationale: פתח എന്ന സാധാരണ ക്രിയയുടെ നേരായ വിവർത്തനം; ചാക്ക് തുറക്കുന്നതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָאֶחָד
  choice: അവരിൽ ഒരാൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ ഒരാൾ’; സന്ദർഭത്തിൽ സഹോദരന്മാരിൽ ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരിൽ ഒരാൾ’ എന്നു നൽകി.
- source_word: שַׂקּוֹ
  choice: തന്റെ ചാക്ക്
  rationale: שַׂק സാധാരണയായി ധാന്യം മുതലായവ കൊണ്ടുപോകുന്ന ചാക്കിനെ സൂചിപ്പിക്കുന്നു; പിന്നീടുള്ള אַמְתַּחַת എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: לָתֵת מִסְפּוֹא
  choice: തീറ്റ കൊടുക്കാൻ
  rationale: מִסְפּוֹא മൃഗങ്ങൾക്കുള്ള തീറ്റയാണ്; ആധുനിക മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: לַחֲמֹרוֹ
  choice: തന്റെ കഴുതയ്ക്കു
  rationale: ലാമെദ് ഇവിടെ തീറ്റ ലഭിക്കുന്ന മൃഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കഴുതയ്ക്കു തീറ്റ കൊടുക്കാൻ’ എന്നത് സ്വാഭാവികമായ മലയാളഘടനയാണ്.
- source_word: בַּמָּלוֹן
  choice: താവളത്തിൽവെച്ച്
  rationale: מָלוֹן യാത്രയ്ക്കിടെ രാത്രി തങ്ങുന്ന സ്ഥലത്തെയോ ഇടത്താവളത്തെയോ സൂചിപ്പിക്കുന്നു; വാണിജ്യസത്രമെന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: അവൻ തന്റെ വെള്ളിപ്പണം കണ്ടു
  rationale: כֶּסֶף അക്ഷരാർഥത്തിൽ വെള്ളിയാണെങ്കിലും ഇവിടെ കൊടുത്ത വിലപ്പണമാണ്; ‘വെള്ളിപ്പണം’ വസ്തുവും സാമ്പത്തിക അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അപ്രതീക്ഷിതമായ കണ്ടെത്തലിനെയും വിവരണത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകേന്ദ്രമാറ്റത്തെയും മലയാളത്തിൽ സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: അവന്റെ സഞ്ചിയുടെ വായ്ക്കൽ
  rationale: ‘വായിൽ/വായ്ക്കൽ’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ഒരു സഞ്ചിയുടെ തുറന്ന ഭാഗമാണ് ഉദ്ദേശ്യമെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. שַׂק എന്നതിന് ‘ചാക്ക്’ എന്നും אַמְתַּחַת എന്നതിന് ‘സഞ്ചി’ എന്നും നൽകി മൂലപാഠത്തിലെ രണ്ടു പാത്രപദങ്ങളുടെ വ്യത്യാസം സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] അടിക്കുറിപ്പ് അതിന്റെ സ്ഥാനവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപാഠത്തിലെ בַּמָּלוֹן എന്ന പദത്തിന്റെ അർഥം വ്യക്തമാക്കുന്ന ഉറവിടാധിഷ്ഠിത കുറിപ്പായി തിരുത്തി.
