  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: ml
  text: 'മൂന്നാം ദിവസം യോസേഫ് അവരോടു പറഞ്ഞു: “ഇതു ചെയ്യുവിൻ; ജീവിച്ചിരിക്കുവിൻ[a]. ഞാൻ ദൈവത്തെ ഭയപ്പെടുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഇതു ചെയ്യുവിൻ; അപ്പോൾ നിങ്ങൾ ജീവിച്ചിരിക്കും.” എബ്രായപ്രയോഗം നേരിട്ടുള്ള ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഫലത്തെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: യോസേഫ് അവരോടു പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം ‘പറഞ്ഞു’ എന്നും אֲלֵהֶם പരോക്ഷകർമമായി ‘അവരോട്’ എന്നും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: എബ്രായ കാലസൂചകപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: זֹאת עֲשׂוּ
  choice: ഇതു ചെയ്യുവിൻ
  rationale: സൂചകസർവനാമവും ബഹുവചന ആജ്ഞാരൂപവും നേരിട്ട് നിലനിർത്തുന്നു; പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ ബഹുവചന ആജ്ഞയാണ് ‘ചെയ്യുവിൻ’.
- source_word: וִחְיוּ
  choice: ജീവിച്ചിരിക്കുവിൻ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഈ രൂപം നേരിട്ടുള്ള ആജ്ഞയായോ അനുസരണത്തിന്റെ ഫലമായോ ഗ്രഹിക്കാം. മുഖ്യപാഠം എബ്രായത്തിന്റെ ചുരുക്കവും ആജ്ഞാസ്വഭാവവും കാത്തുസൂക്ഷിക്കുന്നു; സാധ്യതയുള്ള ഫലാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶת הָאֱלֹהִים
  choice: ദൈവത്തെ
  rationale: സന്ദർഭത്തിൽ ഇത് ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കർമവിഭക്തിയോടെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֲנִי יָרֵא
  choice: ഞാൻ ... ഭയപ്പെടുന്നു
  rationale: വ്യക്തമായ സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക പങ്കാളിത്തരൂപം യോസേഫിന്റെ സ്ഥിരമായ ദൈവഭക്തിയെയും ഭയഭക്തിയെയും സൂചിപ്പിക്കുന്നു; ‘ഭയപ്പെടുന്നു’ എന്നത് അതിനെ അധികവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֶת הָאֱלֹהִים אֲנִי יָרֵא എന്ന യോസേഫിന്റെ പ്രഖ്യാപനത്തിന്റെ അർഥം
  choice: “ഞാൻ ദൈവത്തെ ഭയപ്പെടുന്നു” എന്നു ലളിതമായി പരിഭാഷപ്പെടുത്തി; യോസേഫിന്റെ നീതിപൂർവമായ പെരുമാറ്റത്തിന് ദൈവഭയം അടിസ്ഥാനമാണെന്ന സന്ദർഭസൂചന നിലനിർത്തുന്നു.
  alternative: ഈജിപ്ത്യൻ രാജസഭാസന്ദർഭത്തിലെ പൊതുവായ ദൈവഭയം എന്ന നിലയിൽ കൂടുതൽ അനിശ്ചിതമായി അവതരിപ്പിക്കുക.
  rationale: ഉല്പത്തി ഗ്രന്ഥത്തിന്റെ വിശാലസന്ദർഭം യോസേഫിനെ തന്റെ പിതാക്കന്മാരുടെ ദൈവത്തെ സേവിക്കുന്നവനായി ചിത്രീകരിക്കുന്നു. എന്നാൽ മുഖ്യപാഠത്തിൽ വിശദീകരണം ചേർക്കാതെ എബ്രായത്തിലെ ‘ദൈവം’ എന്ന പ്രയോഗം അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിലെ ബഹുവചന ആജ്ഞയ്ക്ക് ‘ചെയ്യുവിൻ/ജീവിച്ചിരിക്കുവിൻ’ ഉപയോഗിച്ചു; ഇത് സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമാകുന്നതോടൊപ്പം വാക്യത്തിന്റെ ഔപചാരിക ഗൗരവവും നിലനിർത്തുന്നു.
