source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരാളെ അയയ്ക്കുക; അവൻ നിങ്ങളുടെ സഹോദരനെ കൂട്ടിക്കൊണ്ടുവരട്ടെ.[a] നിങ്ങൾ തടങ്കലിൽ കഴിയുക.[b] സത്യം നിങ്ങളോടുകൂടെ ഉണ്ടോ എന്ന് നിങ്ങളുടെ വാക്കുകൾ പരിശോധിക്കപ്പെടട്ടെ.[c] അങ്ങനെയല്ലെങ്കിൽ, ഫറവോന്റെ ജീവനാണേ, നിങ്ങൾ ചാരന്മാർതന്നെ.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൻ നിങ്ങളുടെ സഹോദരനെ എടുക്കട്ടെ.” ഇവിടെ അവനെ പോയി കൂട്ടിക്കൊണ്ടുവരുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങൾ ബന്ധിക്കപ്പെടുക” അല്ലെങ്കിൽ “കാവലിൽ കഴിയുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “സത്യം നിങ്ങളോടുകൂടെ ഉണ്ടോ എന്ന്”; അതായത്, നിങ്ങൾ സത്യമാണോ പറയുന്നത് എന്ന്.
    reason: lexical_alternative
  - marker: d
    text: “ഫറവോന്റെ ജീവനാണേ” എന്നത് ഫറവോന്റെ ജീവനെ ചൊല്ലിയുള്ള ഒരു ശപഥപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: നിങ്ങളിൽ ഒരാളെ അയയ്ക്കുക
  rationale: מן ചേർന്ന സംഖ്യ കൂട്ടത്തിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു; കല്പനാരൂപത്തിന്റെ നേരിട്ടുള്ള ബലവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: അവൻ നിങ്ങളുടെ സഹോദരനെ കൂട്ടിക്കൊണ്ടുവരട്ടെ
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ സഹോദരനെ പോയി യോസേഫിന്റെ അടുക്കൽ കൊണ്ടുവരുന്നതാണ് സന്ദർഭാർഥം; ‘കൂട്ടിക്കൊണ്ടുവരുക’ ആ ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: നിങ്ങൾ തടങ്കലിൽ കഴിയുക
  rationale: אסר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ബന്ധിക്കപ്പെടുകയോ കാവലിൽ തടഞ്ഞുവെക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തടങ്കലിൽ കഴിയുക’ കസ്റ്റഡിയിലുള്ള അവസ്ഥയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: നിങ്ങൾ പറഞ്ഞത് ... പരിശോധിക്കപ്പെടട്ടെ
  rationale: בחן എന്നത് പരിശോധിക്കുക/പരീക്ഷിക്കുക എന്നർഥം നൽകുന്നു. ‘നിങ്ങളുടെ വാക്കുകൾ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ ‘നിങ്ങൾ പറഞ്ഞത്’ തിരഞ്ഞെടുത്തു; കർമണിപ്രയോഗം മൂലരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: സത്യമാണോ
  rationale: അക്ഷരാർഥം ‘സത്യം നിങ്ങളോടുകൂടെ ഉണ്ടോ’ എന്നാണ്; സന്ദർഭത്തിൽ അവരുടെ പ്രസ്താവന സത്യമാണോ എന്നതാണ് ഉദ്ദേശ്യം. പ്രധാനവാചകത്തിൽ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിൽ മൂലഭാഷാ രൂപകവും നൽകുന്നു.
- source_word: וְאִם לֹא
  choice: അല്ലെങ്കിൽ
  rationale: പരിശോധനയിൽ വാക്കുകൾ സത്യമല്ലെന്നു വന്നാൽ ഉണ്ടാകുന്ന വിപരീത ഫലം അവതരിപ്പിക്കുന്നു.
- source_word: חֵי פַרְעֹה
  choice: ഫറവോന്റെ ജീവനാണെ
  rationale: ഫറവോന്റെ ജീവനെ ആധാരമാക്കിയ ശപഥസൂത്രം മലയാളത്തിലെ ഗൗരവമുള്ള ശപഥപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: നിങ്ങൾ ചാരന്മാർതന്നെ
  rationale: כִּי ഇവിടെ ഉറപ്പിച്ചുപറയുന്ന ബലം വഹിക്കുന്നു; ‘തന്നെ’ ആ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കല്പനകളുടെ നേരിട്ടുള്ള സ്വരവും ശപഥത്തിന്റെ സാംസ്കാരിക രൂപവും നിലനിർത്തി. മൂലഹീബ്രുവിലെ അക്ഷരാർഥപരമായ സാധ്യതകൾ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
