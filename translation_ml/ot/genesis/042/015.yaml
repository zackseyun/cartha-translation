source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: ml
  text: 'ഇതിലൂടെ നിങ്ങളെ പരീക്ഷിക്കും: ഫറവോന്റെ ജീവനാണേ[a], നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരൻ ഇവിടേക്കു വരാതെ നിങ്ങൾ ഈ സ്ഥലം വിട്ടുപോകുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിങ്ങൾ ഇവിടെനിന്ന് പുറപ്പെട്ടാൽ.” എന്നാൽ ഈ ശപഥഘടനയിൽ “എങ്കിൽ” എന്ന പദം ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു: “നിങ്ങൾ ഇവിടെനിന്ന് പുറപ്പെടുകയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: ഇതിലൂടെ
  rationale: ഉപാധിയോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്ന בְּയും സൂചകസർവനാമവും ചേർന്ന പ്രയോഗം; പരീക്ഷണത്തിന്റെ മാർഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תִּבָּחֵנוּ
  choice: നിങ്ങളെ പരീക്ഷിക്കും
  rationale: בחן എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം പരിശോധിക്കപ്പെടുക/പരീക്ഷിക്കപ്പെടുക എന്ന അർഥം നൽകുന്നു; സഹോദരന്മാരുടെ അവകാശവാദം പരിശോധിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: חֵי פַרְעֹה
  choice: ഫറവോന്റെ ജീവനാണേ
  rationale: ഫറവോന്റെ ജീവനെ ആധാരമാക്കിയ ശപഥസൂത്രത്തിന്റെ ശക്തി മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശപഥപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: നിങ്ങൾ ഈ സ്ഥലം വിട്ടുപോകുകയില്ല
  rationale: ശപഥവാക്യത്തിനു പിന്നാലെയുള്ള אִם ശക്തമായ നിഷേധം സൂചിപ്പിക്കുന്നു; מִזֶּה സന്ദർഭാനുസൃതമായി ‘ഈ സ്ഥലം വിട്ട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: כִּי אִם
  choice: വരാതെ
  rationale: മുൻപുള്ള നിഷേധത്തിന് ഏക അപവാദമോ നിബന്ധനയോ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വരാതെ ... ഇല്ല’ എന്ന ഘടന സ്വാഭാവികമായി ‘unless’ എന്ന ആശയം നൽകുന്നു.
- source_word: בְּבוֹא
  choice: വരാതെ
  rationale: בְּ ചേർന്ന infinitive construct, അവർക്ക് പോകാനാകുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാള നിഷേധ-നിബന്ധനാ ഘടനയിൽ സംയോജിപ്പിച്ചു.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: നിങ്ങളുടെ ഇളയ സഹോദരൻ
  rationale: സഹോദരബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ הַקָּטֹן പ്രായത്തിൽ ഇളയവനെ, ഇവിടെ ബെന്യാമീനെ, സൂചിപ്പിക്കുന്നു.
- source_word: הֵנָּה
  choice: ഇവിടെ
  rationale: ലക്ഷ്യദിശയോടുകൂടിയ ‘ഇവിടേക്ക്’ എന്ന അർഥം മലയാളത്തിലെ ചലനക്രിയയായ ‘വരുക’യോടൊപ്പം ‘ഇവിടെ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: ഫറവോന്റെ ജീവനെച്ചൊല്ലിയുള്ള ശപഥസൂത്രം
  choice: ഫറവോന്റെ ജീവനാണേ
  alternative: ഫറവോൻ ജീവിച്ചിരിക്കുന്നതുപോലെ
  rationale: വാചകത്തെ മതശാസ്ത്രപരമായി മൃദൂകരിക്കാതെ, യോസേഫ് ഉപയോഗിച്ച രാജകീയ ശപഥത്തിന്റെ യഥാർഥ ശക്തിയും സാംസ്കാരിക അസ്വസ്ഥതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. എബ്രായ ശപഥസൂത്രത്തിന്റെ ശക്തി നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാർഥ നിബന്ധനയ്ക്ക് പകരം അതിന്റെ നിഷേധബലം മുഖ്യവാചകത്തിൽ നൽകി.
