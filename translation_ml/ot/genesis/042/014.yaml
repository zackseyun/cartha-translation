id: GEN.42.14
reference: Genesis 42:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵ/כֶ֛ם לֵ/אמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: ml
  text: 'യോസേഫ് അവരോടു പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറഞ്ഞത് ഇതുതന്നെയാണ്: ‘നിങ്ങൾ ചാരന്മാരാണ്.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: യോസേഫ് അവരോടു പറഞ്ഞു
  rationale: വയിഖ്തോൽ ആഖ്യാനരൂപം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലത്തിൽ നൽകി; אֲלֵהֶם എന്ന സംബോധനബന്ധം ‘അവരോടു’ എന്നു നേരിട്ട് സൂചിപ്പിച്ചു.
- source_word: הוּא אֲשֶׁר
  choice: ഇതുതന്നെയാണ്
  rationale: മുൻപ് പറഞ്ഞ കാര്യത്തെ ഊന്നിപ്പറയുന്ന ഹീബ്രു ഘടനയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞത്
  rationale: דבר എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ധരിച്ച വാക്കുകളോടുള്ള പ്രയോഗം കണക്കിലെടുത്ത് ‘സംസാരിച്ചത്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ ‘പറഞ്ഞത്’ തിരഞ്ഞെടുത്തു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്നു യാന്ത്രികമായി ആവർത്തിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: מְרַגְּלִים אַתֶּם
  choice: നിങ്ങൾ ചാരന്മാരാണ്
  rationale: ഭൂമി രഹസ്യമായി നിരീക്ഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയാരൂപത്തെ മലയാളത്തിലെ സാധാരണ നാമമായ ‘ചാരന്മാർ’ കൊണ്ടും ആവശ്യമായ വിധേയബന്ധത്തോടെക്കൂടിയും നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അതേസമയം ഗൗരവമുള്ള ആഖ്യാനശൈലിയിലും വിവർത്തനം ചെയ്തു. ലֵאמֹר എന്ന ഹീബ്രു ഉദ്ധരണിസൂത്രത്തിന്റെ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ അറിയിച്ചു; അർത്ഥമില്ലാത്ത പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
