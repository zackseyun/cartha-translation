  to: 'അവൻ തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “എന്റെ വെള്ളി തിരിച്ചുകിട്ടിയിരിക്കുന്നു; ഇതാ, അത് എന്റെ ചാക്കിൽത്തന്നെയുണ്ട്!” അപ്പോൾ അവരുടെ ധൈര്യം നഷ്ടപ്പെട്ടു[a]. അവർ വിറച്ചുകൊണ്ട് പരസ്പരം[b] പറഞ്ഞു: “ദൈവം നമ്മോടു ചെയ്ത ഈ കാര്യം എന്താണ്?”'
