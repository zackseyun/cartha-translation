id: GEN.42.28
reference: Genesis 42:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: ml
  text: 'അവൻ തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “എന്റെ വെള്ളി തിരിച്ചുകിട്ടിയിരിക്കുന്നു; ഇതാ, അത് എന്റെ ചാക്കിൽത്തന്നെയുണ്ട്!” അപ്പോൾ അവരുടെ ധൈര്യം നഷ്ടപ്പെട്ടു[a]. അവർ വിറച്ചുകൊണ്ട് പരസ്പരം[b] പറഞ്ഞു: “ദൈവം നമ്മോടു ചെയ്ത ഈ കാര്യം എന്താണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവരുടെ ഹൃദയം പുറത്തുപോയി”; അഥവാ, “അവരുടെ ധൈര്യം അവരെ വിട്ടുപോയി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ഓരോരുത്തൻ തന്റെ സഹോദരനോട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: തിരികെ വെച്ചിരിക്കുന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം പണം ആരോ തിരികെ വെച്ചതാണെന്ന കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്നു. കണ്ടെത്തിയപ്പോഴുള്ള നിലവിലെ അവസ്ഥയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כַּסְפִּי
  choice: എന്റെ വെള്ളി
  rationale: כֶּסֶף എന്നത് ഇവിടെ പണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ചരിത്രപരമായ മൂർത്തമായ ‘വെള്ളി’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: אַמְתַּחַת
  choice: ചാക്ക്
  rationale: ധാന്യമോ യാത്രാസാധനങ്ങളോ കൊണ്ടുപോകുന്ന സഞ്ചിയെ സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിന് ‘ചാക്ക്’ യോജിക്കുന്നു.
- source_word: וְגַם הִנֵּה
  choice: ഇതാ, അത് ... തന്നെയുണ്ട്
  rationale: הִנֵּהയുടെ ചൂണ്ടിക്കാട്ടലും גַם നൽകുന്ന അതിശയത്തോടുകൂടിയ ഊന്നലും മലയാളത്തിലെ ‘ഇതാ’യും ‘തന്നെ’യും ചേർത്ത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: וַיֵּצֵא לִבָּם
  choice: അവരുടെ ധൈര്യം ചോർന്നുപോയി
  rationale: അക്ഷരാർഥം ‘അവരുടെ ഹൃദയം പുറത്തുപോയി’ എന്നാണ്; സന്ദർഭത്തിൽ ധൈര്യം നഷ്ടപ്പെടുകയും ഉള്ളം തളരുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וַיֶּחֶרְדוּ
  choice: അവർ വിറച്ചു
  rationale: חרד ഭയമോ ഉത്കണ്ഠയോ നിമിത്തമുള്ള വിറയലിനെ സൂചിപ്പിക്കുന്നു; ശാരീരികവും മാനസികവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: אִישׁ אֶל אָחִיו
  choice: പരസ്പരം
  rationale: അക്ഷരാർഥം ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട്’ എന്നാണെങ്കിലും, വിതരണാത്മകമായ പരസ്പരസംഭാഷണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מַה זֹּאת
  choice: ഈ കാര്യം എന്താണ്?
  rationale: വിശദീകരണം തേടുന്ന നേരിട്ടുള്ള ആശ്ചര്യചോദ്യം നിലനിർത്തുന്നു; ‘എന്തുകൊണ്ട്’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: വ്യാകരണരൂപം ബഹുവചനസാദൃശ്യമുള്ളതായിരുന്നാലും ഏകവചന ക്രിയയും ആഖ്യാനസന്ദർഭവും ഏകദൈവസൂചനയെ പിന്തുണയ്ക്കുന്നു.
theological_decisions:
- issue: സഹോദരന്മാരുടെ ഭയഭരിതമായ ചോദ്യത്തിലെ אֱלֹהִים
  choice: ദൈവം
  alternative: ദേവൻ / ദേവന്മാർ
  rationale: ഏകവചന ക്രിയയായ עָשָׂהയും ആഖ്യാനസന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ എന്ന വായന ഉറപ്പിക്കുന്നു; എന്നാൽ ദൈവത്തിന്റെ ഉദ്ദേശ്യം എന്തെന്നു വാക്യം വിശദീകരിക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള ചോദ്യം
  choice: “ദൈവം നമ്മോട് ചെയ്തിരിക്കുന്ന ഈ കാര്യം എന്താണ്?”
  alternative: “ദൈവം എന്തുകൊണ്ടാണ് നമ്മോട് ഇങ്ങനെ ചെയ്തത്?”
  rationale: മൂലത്തിലെ מַה ‘എന്ത്’ എന്ന ചോദ്യം തന്നെയാണ്; അതിനെ കാരണചോദ്യമായ ‘എന്തുകൊണ്ട്’ എന്നു മാറ്റാതെ ദൈവിക പ്രവർത്തനത്തെക്കുറിച്ചുള്ള അവരുടെ ഭയവും ആശയക്കുഴപ്പവും നിലനിർത്തുന്നു.
- issue: אִישׁ אֶל אָחִיו എന്ന പുരുഷലിംഗ ബന്ധപദം
  choice: പ്രധാനവാചകത്തിൽ ‘പരസ്പരം’; അടിക്കുറിപ്പിൽ ‘ഓരോരുത്തൻ തന്റെ സഹോദരനോട്’
  alternative: ഓരോരുത്തൻ തന്റെ സഹോദരനോട്
  rationale: ഇവിടെ സംസാരിക്കുന്നവർ സഹോദരന്മാരാണെന്ന് മുൻവാക്യം വ്യക്തമാക്കുന്നു. പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായ പരസ്പരപ്രയോഗവും അടിക്കുറിപ്പിൽ മൂലത്തിലെ പുരുഷലിംഗ ബന്ധരൂപവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വെള്ളി’, ‘ചാക്ക്’ എന്നിവ ചരിത്രസന്ദർഭം നിലനിർത്തുന്നു. ഹൃദയത്തിന്റെ അക്ഷരചിത്രം പ്രധാനവാചകത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അർത്ഥസമാനമായ ‘ധൈര്യം ചോർന്നുപോയി’ ഉപയോഗിച്ച് അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
