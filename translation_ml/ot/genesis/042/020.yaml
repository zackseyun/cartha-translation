  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇളയ സഹോദരനെ എന്റെ അടുക്കൽ കൊണ്ടുവരണം. അപ്പോൾ നിങ്ങളുടെ വാക്കുകൾ സ്ഥിരീകരിക്കപ്പെടും[a]; നിങ്ങൾ മരിക്കുകയുമില്ല.” അവർ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ വാക്കുകൾ ഉറപ്പിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘വിശ്വസിക്കപ്പെടും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ഒരു കാര്യം സത്യമെന്ന് സ്ഥാപിക്കപ്പെടുക എന്നോ വിശ്വസനീയമെന്ന് അംഗീകരിക്കപ്പെടുക എന്നോ അർഥമാകാം; ഈ സന്ദർഭത്തിൽ പരിശോധനയിലൂടെ സ്ഥിരീകരിക്കപ്പെടുക എന്ന അർഥത്തിനാണ് കൂടുതൽ യോജിപ്പ്.
