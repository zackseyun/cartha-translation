lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: നിങ്ങളുടെ ഇളയ സഹോദരനെ
  rationale: הַקָּטֹן എന്നത് അക്ഷരാർഥത്തിൽ ‘ചെറിയവൻ/പ്രായം കുറഞ്ഞവൻ’ എന്നാണ്. ബെന്യാമീനെക്കുറിച്ചുള്ള സഹോദരസന്ദർഭത്തിൽ ‘ഇളയ സഹോദരൻ’ സ്വാഭാവികവും ജനനക്രമസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: תָּבִיאוּ אֵלַי
  choice: എന്റെ അടുക്കൽ കൊണ്ടുവരണം
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക’ എന്നർഥം നൽകുന്നു; אֵלַי നേരിട്ട് ‘എന്റെ അടുക്കൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: וְיֵאָמְנוּ
  choice: സത്യമാണെന്ന് സ്ഥിരീകരിക്കപ്പെടും
  rationale: אמן എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ വാക്കുകൾ സത്യമെന്ന് സ്ഥാപിക്കപ്പെടുകയോ വിശ്വസനീയമെന്ന് അംഗീകരിക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. യോസേഫ് സഹോദരന്മാരുടെ അവകാശവാദം പരിശോധിക്കുന്ന സന്ദർഭത്തിൽ ‘സ്ഥിരീകരിക്കപ്പെടും’ യോജിക്കുന്നു; യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דִבְרֵיכֶם
  choice: നിങ്ങളുടെ വാക്കുകൾ
  rationale: ബഹുവചന ഘടനയുടെ നേരിട്ടുള്ള പരിഭാഷയാണ്; അവരുടെ മുൻ അവകാശവാദങ്ങളുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְלֹא תָמֻתוּ
  choice: നിങ്ങൾ മരിക്കേണ്ടിവരികയുമില്ല
  rationale: അനുസരണത്തിന്റെ ഫലമായ ഉറപ്പും അതിനുള്ളിലെ ഭീഷണിയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഹീബ്രുവിലെ സംയോജനബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അവർ അങ്ങനെ ചെയ്തു
  rationale: അനുസരണം സൂചിപ്പിക്കുന്ന ഹീബ്രു ആഖ്യാനസൂത്രത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
