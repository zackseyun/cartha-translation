  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോസേഫിന്റെ നിർദേശവും അതോടൊപ്പമുള്ള ജീവരക്ഷാ ഉറപ്പ്/ഭീഷണിയും സംക്ഷിപ്തമായി നിലനിർത്തി.
