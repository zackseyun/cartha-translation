source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: ml
  text: “നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരനെ എന്റെ അടുക്കൽ കൊണ്ടുവരുവിൻ; അതുവഴി നിങ്ങൾ ചാരന്മാരല്ല, സത്യസന്ധരാണെന്ന് ഞാൻ അറിയും. നിങ്ങളുടെ സഹോദരനെ ഞാൻ നിങ്ങൾക്കു തിരികെ ഏൽപ്പിക്കും; നിങ്ങൾക്കു ദേശത്തു വ്യാപാരം നടത്തുകയും ചെയ്യാം[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കു ദേശത്തുകൂടെ സഞ്ചരിക്കാം.” എബ്രായ ക്രിയയ്ക്ക് ചുറ്റിസഞ്ചരിക്കുക എന്ന വിശാലമായ അർത്ഥവും വരാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ “വ്യാപാരം നടത്തുക” എന്ന വാണിജ്യാർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: കൊണ്ടുവരുവിൻ
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം; നേരിട്ടുള്ള കല്പനയുടെ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: നിങ്ങളുടെ ഇളയ സഹോദരനെ
  rationale: സഹോദരബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ הַקָּטֹן പ്രായം കുറഞ്ഞ സഹോദരനെ സൂചിപ്പിക്കുന്നു. എബ്രായം നിർബന്ധമായും ‘ഏറ്റവും ഇളയവൻ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ ‘ഇളയ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאֵדְעָה
  choice: അപ്പോൾ ... ഞാൻ അറിയും
  rationale: കല്പനയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന cohortative ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാർ
  rationale: ഇവിടെ രഹസ്യമായി വിവരങ്ങൾ ശേഖരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: כֵנִים
  choice: സത്യസന്ധർ
  rationale: വിശ്വസനീയരും വഞ്ചനയില്ലാത്തവരുമെന്ന അർത്ഥം നൽകുകയും ‘ചാരന്മാർ’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: നിങ്ങളുടെ സഹോദരനെ ഞാൻ നിങ്ങൾക്കു തിരികെ ഏല്പിക്കും
  rationale: തടഞ്ഞുവെച്ച സഹോദരനെ വിട്ടുനൽകുന്നതാണ് സന്ദർഭാർഥം; ‘തിരികെ ഏല്പിക്കും’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: നിങ്ങൾക്കു ദേശത്ത് വ്യാപാരം നടത്തുകയും ചെയ്യാം
  rationale: סחר എന്ന ക്രിയയുടെ വാണിജ്യാർഥം ക്ഷാമകാലത്ത് ധാന്യം വാങ്ങുന്ന ഈ സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; വിശാലമായ സഞ്ചാരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ആജ്ഞയ്ക്ക് ഗൗരവം നൽകാൻ ‘കൊണ്ടുവരുവിൻ’ ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യങ്ങളിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ രൂപങ്ങൾ തിരഞ്ഞെടുത്തു.
