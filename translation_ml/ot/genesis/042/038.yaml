  to: 'എന്നാൽ അവൻ പറഞ്ഞു: “എന്റെ മകൻ നിങ്ങളോടൊപ്പം താഴേക്കു പോകുകയില്ല. കാരണം, അവന്റെ സഹോദരൻ മരിച്ചിരിക്കുന്നു; അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ. നിങ്ങൾ പോകുന്ന വഴിയിൽവെച്ച് അവന് എന്തെങ്കിലും ആപത്ത് സംഭവിച്ചാൽ, നിങ്ങൾ എന്റെ നരച്ച തല ദുഃഖത്തോടെ ഷെയോലിലേക്ക്[a] ഇറക്കും.”'
