id: GEN.42.38
reference: Genesis 42:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “എന്റെ മകൻ നിങ്ങളോടൊപ്പം താഴേക്കു പോകുകയില്ല. കാരണം, അവന്റെ സഹോദരൻ മരിച്ചിരിക്കുന്നു; അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ. നിങ്ങൾ പോകുന്ന വഴിയിൽവെച്ച് അവന് എന്തെങ്കിലും ആപത്ത് സംഭവിച്ചാൽ, നിങ്ങൾ എന്റെ നരച്ച തല ദുഃഖത്തോടെ ഷെയോലിലേക്ക്[a] ഇറക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഷെയോൽ” മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പദമാണ്; സന്ദർഭാനുസരണം “കല്ലറ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: താഴേക്കു പോകുകയില്ല
  rationale: כנാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള യാത്രയെ ഉല്പത്തിയിൽ ‘താഴേക്കു പോകുക’ എന്നു പതിവായി വിശേഷിപ്പിക്കുന്നതിനാൽ ירד എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകൻ
  rationale: בן എന്ന പദവും ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് സൂചിപ്പിക്കുന്ന അർഥം.
- source_word: אָחִיו מֵת
  choice: അവന്റെ സഹോദരൻ മരിച്ചുപോയി
  rationale: യോസേഫ് മരിച്ചവനാണെന്ന യാക്കോബിന്റെ ധാരണയും അതിന്റെ ഇപ്പോഴത്തെ ഫലസ്ഥിതിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְהוּא לְבַדּוֹ נִשְׁאָר
  choice: അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ
  rationale: לְבַדּוֹ നൽകുന്ന ഊന്നലും ശേഷിച്ചിരിക്കുന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: അവന് എന്തെങ്കിലും ആപത്ത് സംഭവിച്ചാൽ
  rationale: אָסוֹן ഗുരുതരമായ ദോഷം, അനർഥം, ആപത്ത് എന്നിവ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ സോപാധിക അർഥം മലയാളത്തിൽ ‘സംഭവിച്ചാൽ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: നിങ്ങൾ പോകുന്ന വഴിയിൽവെച്ച്
  rationale: דרך എന്നതിന്റെ വ്യക്തമായ ‘വഴി’ എന്ന ദൃശ്യവും സ്രോതസ്സിലെ ‘നിങ്ങൾ പോകുന്ന’ എന്ന ഘടനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהוֹרַדְתֶּם
  choice: നിങ്ങൾ ... ഇറക്കും
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘താഴേക്ക് ഇറക്കുക’ എന്ന കാരണാർഥമുണ്ട്; സോപാധിക ഫലം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: שֵׂיבָתִי
  choice: എന്റെ നരച്ച തല
  rationale: വാർധക്യത്തെ സൂചിപ്പിക്കുന്ന നരയുടെ ദൃശ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; ‘നരച്ച മുടി’യെക്കാൾ ഒരാളെത്തന്നെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം ഇവിടെ പ്രസന്നമാണ്.
- source_word: בְּיָגוֹן
  choice: ദുഃഖത്തോടെ
  rationale: יגון സൂചിപ്പിക്കുന്ന ദുഃഖവും വ്യസനവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁאֹלָה
  choice: പാതാളത്തിലേക്ക്
  rationale: മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന שְׁאוֹל എന്ന എബ്രായ ആശയം ‘കല്ലറ’യായി ചുരുക്കാതെ മലയാള ബൈബിൾഭാഷയിൽ ഗ്രഹിക്കാവുന്ന ‘പാതാളം’കൊണ്ട് നൽകുന്നു.
theological_decisions:
- issue: שְׁאוֹל എന്നത് കല്ലറയോ മരിച്ചവരുടെ ലോകമോ ആയി വിവർത്തനം ചെയ്യുക
  choice: പാതാളത്തിലേക്ക്
  alternative: കല്ലറയിലേക്ക്; മരിച്ചവരുടെ ലോകത്തിലേക്ക്
  rationale: ശാരീരിക കല്ലറ മാത്രം എന്നു നിർണയിക്കാതെ, മരിച്ചവരുടെ ലോകം എന്ന വിശാലവും ഭാഗികമായി അനിശ്ചിതവുമായ എബ്രായ ആശയം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘താഴേക്കു പോകുക’, ‘നരച്ച തല’, ‘ഇറക്കുക’ എന്നീ സ്രോതസ്സ്-ദൃശ്യങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
