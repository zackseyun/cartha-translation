translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനയുടെ ഔപചാരിക ബഹുവചനഭാവത്തിന് ‘കൊണ്ടുപോകുവിൻ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഊന്നിയ ‘നിങ്ങൾ’ എന്ന പ്രതിവിരുദ്ധത ‘നിങ്ങളാകട്ടെ’ എന്നു നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷകൾ പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി ആവശ്യമായിടത്ത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
