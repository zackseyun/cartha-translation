source:
  edition: WLC
  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: ml
  text: നിങ്ങൾ സത്യസന്ധരാണെങ്കിൽ,[a] നിങ്ങളുടെ സഹോദരന്മാരിൽ ഒരുവൻ നിങ്ങൾ കാവലിൽ പാർപ്പിക്കപ്പെട്ടിരിക്കുന്ന സ്ഥലത്ത്[b] തടവിലാക്കപ്പെടട്ടെ; നിങ്ങളാകട്ടെ, പോയി നിങ്ങളുടെ വീട്ടുകാരുടെ പട്ടിണിക്കുള്ള ധാന്യം കൊണ്ടുപോകുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ സത്യം പറയുന്നവരാണെങ്കിൽ.” എബ്രായ വിശേഷണം കൂടുതൽ അക്ഷരാർഥത്തിൽ “സത്യമായവർ” എന്നോ “സത്യം പറയുന്നവർ” എന്നോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നിങ്ങളുടെ കാവലിന്റെ വീട്ടിൽ.” അതായത്, നിങ്ങളെ തടങ്കലിൽ പാർപ്പിച്ചിരിക്കുന്ന സ്ഥലത്ത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: സത്യസന്ധർ
  rationale: സഹോദരന്മാർ പറയുന്നത് സത്യമാണോ എന്ന യോസേഫിന്റെ പരിശോധനയാണ് സന്ദർഭം. ‘സത്യസന്ധർ’ എന്നത് സ്വാഭാവികവും മൂലപദത്തിലെ സത്യനിഷ്ഠ/സത്യവാക്ക് എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: אֲחִיכֶם אֶחָד
  choice: നിങ്ങളുടെ സഹോദരന്മാരിൽ ഒരാൾ
  rationale: സഹോദരന്മാരുടെ കൂട്ടത്തിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്ന ഭാഗികബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֵאָסֵר
  choice: തടവിലിടട്ടെ
  rationale: നിഫാൽ രൂപം ബന്ധിക്കപ്പെടുകയോ തടങ്കലിലാക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കാവൽസ്ഥലത്തിന്റെ പരാമർശം ഇവിടെ തടങ്കൽ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: നിങ്ങളെ കാവലിൽ പാർപ്പിച്ചിരിക്കുന്ന സ്ഥലത്ത്
  rationale: അക്ഷരാർഥം ‘നിങ്ങളുടെ കാവലിന്റെ വീട്ടിൽ’ എന്നാണ്. പ്രതിഷ്ഠിതമായ ജയിൽസംവിധാനം അനാവശ്യമായി സൂചിപ്പിക്കാതെ, അവർ ഇപ്പോൾ കാവലിൽ കഴിയുന്ന സ്ഥലമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְאַתֶּם לְכוּ
  choice: നിങ്ങളാകട്ടെ, പോയി
  rationale: അവിടെ ശേഷിക്കുന്ന ഒരാളും പോകുന്ന മറ്റുള്ളവരും തമ്മിലുള്ള ഊന്നിയ വ്യത്യാസം സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ കല്പനയിൽ ഉണ്ട്; ‘നിങ്ങളാകട്ടെ’ അത് മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָבִיאוּ
  choice: കൊണ്ടുപോകുവിൻ
  rationale: വാങ്ങിയ ധാന്യം വീട്ടിലുള്ളവരിലേക്കു എത്തിക്കുക എന്ന ഗമ്യദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഹിഫ്ഇൽ രൂപത്തിലെ കൈമാറ്റാർഥവും നിലനിൽക്കുന്നു.
- source_word: שֶׁבֶר
  choice: ധാന്യം
  rationale: യോസേഫിന്റെ കഥാസന്ദർഭത്തിൽ ക്ഷാമകാലത്ത് വാങ്ങുന്ന ധാന്യത്തെയാണ് പതിവായി സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ഭക്ഷണം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: നിങ്ങളുടെ വീട്ടുകാരുടെ പട്ടിണിക്കുള്ള
  rationale: ‘നിങ്ങളുടെ വീടുകളുടെ ക്ഷാമം’ എന്ന കടുപ്പമുള്ള അക്ഷരപരിഭാഷ ഒഴിവാക്കി, വീട്ടിലുള്ളവർ അനുഭവിക്കുന്ന പട്ടിണിക്ക് വേണ്ട ധാന്യം എന്ന ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ‘വീടുകൾ’ എന്നത് ഇവിടെ കുടുംബാംഗങ്ങളടങ്ങുന്ന വീട്ടുകാരെ സൂചിപ്പിക്കുന്നു.
