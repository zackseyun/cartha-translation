  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: ml
  text: 'അപ്പോൾ ദേശത്തിന്റെ അധിപനായ ആ മനുഷ്യൻ ഞങ്ങളോടു പറഞ്ഞു: “നിങ്ങൾ സത്യസന്ധരാണെന്ന് ഇതിലൂടെ ഞാൻ അറിയും: നിങ്ങളുടെ സഹോദരന്മാരിൽ ഒരാളെ എന്റെ അടുക്കൽ വിട്ടേക്കുക; നിങ്ങളുടെ കുടുംബങ്ങളെ ബാധിച്ചിരിക്കുന്ന ക്ഷാമത്തിനുവേണ്ട ധാന്യം[a] എടുത്തുകൊണ്ടു പോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ കുടുംബങ്ങളുടെ ക്ഷാമം എടുക്കുക.” കുടുംബങ്ങളെ ബാധിച്ച ക്ഷാമത്തിനായി ധാന്യമോ മറ്റു ഭക്ഷ്യസാധനങ്ങളോ കൊണ്ടുപോകുക എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: ദേശത്തിന്റെ അധിപനായ ആ മനുഷ്യൻ
  rationale: הָאִישׁ എന്ന സാധാരണ നാമവും അതിനെ വിശദീകരിക്കുന്ന אֲדֹנֵי הָאָרֶץ എന്ന സ്ഥാനവിവരണവും നിലനിർത്തുന്നു. ‘അധിപൻ’ ഇവിടെ ഉയർന്ന ഭരണാധികാരത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּזֹאת
  choice: ഇതിലൂടെ
  rationale: അവരുടെ സത്യസന്ധത തിരിച്ചറിയാനുള്ള പരിശോധനയെയോ മാനദണ്ഡത്തെയോ സൂചിപ്പിക്കുന്ന ב പ്രയോഗത്തിന്റെ ഉപാധിപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵדַע
  choice: ഞാൻ അറിയും
  rationale: സഹോദരന്മാർ നിർദേശം അനുസരിച്ചാൽ ഉണ്ടാകുന്ന ഭാവിഫലമാണ് ഈ സന്ദർഭത്തിലെ yiqtol രൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: כֵנִים
  choice: സത്യസന്ധർ
  rationale: ഇവർ ചാരന്മാരല്ല, നേരായി സംസാരിക്കുന്ന വിശ്വസനീയരായ ആളുകളാണ് എന്ന കഥാസന്ദർഭത്തിലെ സാമൂഹിക-ന്യായപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: നിങ്ങളുടെ സഹോദരന്മാരിൽ ഒരാളെ
  rationale: കൂട്ടത്തിൽനിന്ന് ഒരു സഹോദരനെ തിരഞ്ഞെടുത്ത് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַנִּיחוּ אִתִּי
  choice: എന്റെ അടുക്കൽ വിട്ടേക്കുക
  rationale: Hiphil രൂപത്തിലുള്ള הניח ഇവിടെ ഒരാളെ തനിക്കൊപ്പം ശേഷിക്കാൻ വിടുക എന്ന അർഥത്തിലാണ്.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: നിങ്ങളുടെ കുടുംബങ്ങളെ ബാധിച്ചിരിക്കുന്ന ക്ഷാമത്തിനുവേണ്ട ധാന്യം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ വീടുകളുടെ ക്ഷാമം എടുക്കുക’ എന്ന ദീർഘവൃത്തപ്രയോഗമാണ്. ഈജിപ്തിൽനിന്ന് ധാന്യം വാങ്ങുന്ന ഉടൻസന്ദർഭം പരിഗണിച്ച് ‘ധാന്യം’ വ്യക്തമാക്കുകയും בָּתִּים എന്നത് ഇവിടെ വീടുകളെക്കാൾ വീട്ടുകാരെയോ കുടുംബങ്ങളെയോ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: קְחוּ וָלֵכוּ
  choice: എടുത്തുകൊണ്ടു പോകുക
  rationale: ‘എടുക്കുക, പോകുക’ എന്ന രണ്ടു ആജ്ഞകളുടെ ക്രമവും ലളിതമായ ശക്തിയും മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തക്രിയയിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ദീർഘവൃത്തപ്രയോഗം പ്രധാനവാചകത്തിൽ അർഥവ്യക്തതയ്ക്കായി തുറന്നുപറഞ്ഞെങ്കിലും അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
