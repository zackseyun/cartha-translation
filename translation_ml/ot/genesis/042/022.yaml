source:
  edition: WLC
  text: וַ/יַּעַן֩ רְאוּבֵ֨ן אֹתָ֜/ם לֵ/אמֹ֗ר הֲ/לוֹא֩ אָמַ֨רְתִּי אֲלֵי/כֶ֧ם לֵ/אמֹ֛ר אַל תֶּחֶטְא֥וּ בַ/יֶּ֖לֶד וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/גַם דָּמ֖/וֹ הִנֵּ֥ה נִדְרָֽשׁ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: ml
  text: 'അപ്പോൾ രൂബേൻ അവരോടു പറഞ്ഞു: “ബാലനോടു പാപം ചെയ്യരുത് എന്നു ഞാൻ നിങ്ങളോടു പറഞ്ഞില്ലേ? എന്നാൽ നിങ്ങൾ കേട്ടില്ല. അവന്റെ രക്തത്തിനും ഇതാ, കണക്കു ചോദിക്കപ്പെടുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... לֵאמֹר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: ഹീബ്രായ കഥനശൈലിയിലെ ‘ഉത്തരം പറഞ്ഞ് പറഞ്ഞു’ എന്ന ആവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ലളിതമാക്കി; പ്രതികരണത്തിന്റെ ഭാവം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: תֶּחֶטְאוּ בַיֶּלֶד
  choice: ബാലനോടു പാപം ചെയ്യരുത്
  rationale: חטא എന്നതിന്റെ നൈതിക-ദൈവശാസ്ത്രപരമായ ‘പാപം ചെയ്യുക’ എന്ന അർഥവും ב എന്ന ബന്ധസൂചനയുടെ ‘എതിരായി/നോടു’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: דָּמוֹ ... נִדְרָשׁ
  choice: അവന്റെ രക്തത്തിന് കണക്കു ചോദിക്കപ്പെടുന്നു
  rationale: דרשׁ דם എന്ന ഹീബ്രായ പ്രയോഗം രക്തച്ചൊരിച്ചിലിനുള്ള ഉത്തരവാദിത്വവും പ്രതികണക്കെടുപ്പും സൂചിപ്പിക്കുന്നു; വെറും ‘രക്തം ആവശ്യപ്പെടുന്നു’ എന്ന അസ്വാഭാവിക അക്ഷരാർഥം ഒഴിവാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഇപ്പോഴത്തെ പരിണതഫലത്തെ ഊന്നിപ്പറയുകയും ചെയ്യുന്ന ഹീബ്രായ സൂചന സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: രക്തത്തിന് കണക്കു ചോദിക്കപ്പെടുന്നതിലെ പ്രവർത്തകന്റെ അനിശ്ചിതത്വം
  choice: കർമണിപ്രയോഗമായ ‘കണക്കു ചോദിക്കപ്പെടുന്നു’ നിലനിർത്തി
  alternative: ‘ദൈവം അവന്റെ രക്തത്തിന് നമ്മോടു കണക്കു ചോദിക്കുന്നു’
  rationale: മൂലപാഠം പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. ദൈവിക പ്രതികണക്കെടുപ്പ് സൂചിപ്പിക്കപ്പെടാമെങ്കിലും ‘ദൈവം’ എന്നും ‘നമ്മോടു’ എന്നും നേരിട്ട് ചേർക്കുന്നത് വ്യാഖ്യാനപരമായ വ്യക്തമാക്കലായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ഊന്നലും നിയമപരമായ രക്തക്കുറ്റബോധവും സംരക്ഷിച്ചു; അനാവശ്യ ഹീബ്രായ ആവർത്തനം ഒഴിവാക്കി.
