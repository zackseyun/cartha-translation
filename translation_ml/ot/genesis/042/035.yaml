source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ചാക്കുകൾ ഒഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അതാ, ഓരോരുത്തരുടെയും വെള്ളിയുടെ കെട്ട് അവരവരുടെ ചാക്കിൽ ഉണ്ടായിരുന്നു.[a] അവരും അവരുടെ പിതാവും തങ്ങളുടെ വെള്ളിയുടെ കെട്ടുകൾ കണ്ടു; അവർ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെള്ളിയുടെ കെട്ട്’ എന്നത് കെട്ടിപ്പൊതിഞ്ഞ വെള്ളിയെയോ വെള്ളിപ്പണത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: അവർ ... ഒഴിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: היה എന്ന ആഖ്യാനസൂചക ക്രിയയും തുടർന്നുള്ള കർത്തൃവാചക പങ്കാളിക്രിയയും ചേർന്ന് സമകാലിക പശ്ചാത്തലം നൽകുന്നു. മലയാളത്തിൽ പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ ‘-കൊണ്ടിരിക്കുമ്പോൾ’ എന്നു നൽകുന്നത് അർഥവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: שַׂקֵּיהֶם
  choice: തങ്ങളുടെ ചാക്കുകൾ
  rationale: שַׂק ധാന്യമോ സാധനങ്ങളോ സൂക്ഷിക്കുന്ന ചാക്കിനെ സൂചിപ്പിക്കുന്നു; ‘സഞ്ചികൾ’ എന്ന പൊതുപദത്തേക്കാൾ പുരാതന വസ്തുസാഹചര്യം ‘ചാക്കുകൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള കണ്ടെത്തലും അതിശയവും സൂചിപ്പിക്കുന്ന הִנֵּהയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ മലയാള സമാനപദം.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: ഓരോരുത്തരുടെയും വെള്ളിക്കെട്ട്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും צְרוֹר ബന്ധിച്ചോ പൊതിഞ്ഞോ വെച്ച കെട്ട് എന്നും വരുന്നു. כֶּסֶף വെള്ളിയെയും വെള്ളിനാണയമായ പണത്തെയും സൂചിപ്പിക്കാമെന്നതിനാൽ ‘വെള്ളിക്കെട്ട്’ മൂലരൂപത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: בְּשַׂקּוֹ
  choice: അവരവരുടെ ചാക്കിൽ
  rationale: ഓരോ സഹോദരനോടും ബന്ധപ്പെട്ട ഏകവചന ഉടമസ്ഥത മലയാളത്തിൽ സ്വാഭാവികമായി വിതരണാർഥമുള്ള ‘അവരവരുടെ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם
  choice: തങ്ങളുടെ വെള്ളിക്കെട്ടുകൾ കണ്ടപ്പോൾ
  rationale: കൂട്ടായ കണ്ടെത്തലിലെ ബഹുവചനവും മൂലത്തിലെ വ്യക്തമായ കെട്ടുകളുടെ ദൃശ്യതയും സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ അവസാന പ്രതികരണവുമായി ‘കണ്ടപ്പോൾ’ എന്നു ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: അവരും അവരുടെ അപ്പനും
  rationale: കണ്ടവരും ഭയപ്പെട്ടവരും സഹോദരന്മാരും അവരുടെ പിതാവുമാണെന്ന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּירָאוּ
  choice: ഭയപ്പെട്ടു
  rationale: കണ്ടെത്തലിനോടുള്ള അവരുടെ ഭയപ്രതികരണം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
