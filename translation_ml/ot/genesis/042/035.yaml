  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ കണ്ടെത്തലിന്റെ അപ്രതീക്ഷിതത്വം നിലനിർത്തുന്നു; ‘വെള്ളിക്കെട്ട്’ എന്നത് വെള്ളി പണമായി ഉപയോഗിക്കപ്പെട്ട പശ്ചാത്തലവും צְרוֹר എന്ന ബന്ധിച്ച കെട്ടിന്റെ ദൃശ്യരൂപവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
