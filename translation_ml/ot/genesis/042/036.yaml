source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവരുടെ അപ്പനായ യാക്കോബ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്നെ മക്കളെ നഷ്ടപ്പെട്ടവനാക്കി[a]. യോസേഫ് ഇല്ല; ശിമെയോനും ഇല്ല; ഇപ്പോൾ ബെന്യാമീനെയും നിങ്ങൾ കൊണ്ടുപോകും. ഇതെല്ലാം എനിക്കെതിരായി വന്നിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്നെ മക്കളില്ലാത്തവനാക്കി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇവയെല്ലാം എനിക്കെതിരായിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: എന്നെ മക്കളെ നഷ്ടപ്പെട്ടവനാക്കി
  rationale: പിയേൽ രൂപം ഒരാളെ മക്കളുടെ നഷ്ടം അനുഭവിക്കുന്നവനാക്കുക എന്ന കാരകവും വൈകാരികവുമായ അർഥം നൽകുന്നു. സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֵינֶנּוּ
  choice: ഇല്ലാതായി
  rationale: ഇവിടെ വെറും അസ്തിത്വനിഷേധമല്ല, യാക്കോബിന്റെ കാഴ്ചയിൽ നഷ്ടവും അഭാവവും സൂചിപ്പിക്കുന്ന വിലാപപ്രയോഗമാണ്.
- source_word: תִּקָּחוּ
  choice: ഇപ്പോൾ ... നിങ്ങൾ കൊണ്ടുപോകും
  rationale: അപൂർണക്രിയാരൂപം സന്ദർഭത്തിൽ നിർദേശിക്കപ്പെട്ടിരിക്കുന്ന അടുത്ത നടപടിയെക്കുറിച്ചുള്ള യാക്കോബിന്റെ പ്രതിഷേധമായി വായിക്കുന്നു; ‘ഇപ്പോൾ’ സന്ദർഭഗതമായ സമീപഭാവി വ്യക്തമാക്കുന്നു.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: ഇതെല്ലാം എനിക്കെതിരായിരിക്കുന്നു
  rationale: עָלַי എന്നതിന്റെ പ്രതികൂലബലവും സംഭവങ്ങളുടെ സഞ്ചിതഭാരവും നിലനിർത്തുന്നു; വാക്യം സൂചിപ്പിക്കാവുന്ന വ്യത്യസ്ത സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֹתִי
  choice: എന്നെ
  rationale: ഹീബ്രുവിലെ മുൻനിരപ്പെടുത്തൽ യാക്കോബിന്മേലുള്ള വ്യക്തിപരമായ ആഘാതം ഊന്നുന്നു; മലയാളത്തിലും കർമരൂപം വ്യക്തമായി നിലനിർത്തി.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: അവരുടെ അപ്പനായ യാക്കോബ്
  rationale: മൂലത്തിലെ ബന്ധസൂചന വ്യക്തമായി നൽകുന്ന, ആഖ്യാനശൈലിക്ക് യോജിച്ച സ്വാഭാവിക മലയാളം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ ഉല്പത്തി വിവരണത്തിന്റെ കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്. നഷ്ടത്തിന്റെ വികാരഭാരം നിലനിർത്തിയെങ്കിലും മക്കൾ യഥാർഥത്തിൽ മരിച്ചുവെന്ന് വിവർത്തനം അധികമായി നിർണ്ണയിക്കുന്നില്ല; അവസാന വാക്യത്തിലെ പ്രതികൂലതയും സംഭവങ്ങൾ തന്റെമേൽ പതിച്ചുവെന്ന അർഥസാധ്യതയും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
