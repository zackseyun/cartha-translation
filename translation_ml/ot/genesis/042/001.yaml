id: GEN.42.1
reference: Genesis 42:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: ml
  text: 'ഈജിപ്തിൽ ധാന്യം ഉണ്ടെന്ന് യാക്കോബ് കണ്ടപ്പോൾ, അവൻ തന്റെ പുത്രന്മാരോട് ചോദിച്ചു: “നിങ്ങൾ എന്തിനാണ് പരസ്പരം നോക്കിക്കൊണ്ടിരിക്കുന്നത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: അറിഞ്ഞപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കാണുക’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഈജിപ്തിൽ ധാന്യം ലഭ്യമാണെന്ന വിവരം യാക്കോബ് മനസ്സിലാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വാക്കുകളുമായുള്ള കാലബന്ധവും ‘അറിഞ്ഞപ്പോൾ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי יֶשׁ
  choice: ലഭ്യമാണെന്ന്
  rationale: יֵשׁ സൂചിപ്പിക്കുന്ന അസ്തിത്വവും വാങ്ങാൻ ധാന്യം ഉണ്ടെന്ന സന്ദർഭാർഥവും ചേർത്ത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שֶׁבֶר
  choice: ധാന്യം
  rationale: യോസേഫിന്റെ കഥാസന്ദർഭത്തിൽ ഈ പദം ക്ഷാമകാലത്ത് വാങ്ങാൻ ലഭിക്കുന്ന ധാന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ഭക്ഷണം’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
- source_word: בְּמִצְרַיִם
  choice: ഈജിപ്തിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക അവ്യയത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: לְבָנָיו
  choice: തന്റെ പുത്രന്മാരോട്
  rationale: ഇവിടെ בָּנִים യാക്കോബിന്റെ ആൺമക്കളെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്. ‘പുത്രന്മാർ’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: לָמָּה
  choice: എന്തിനാണ്
  rationale: നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּתְרָאוּ
  choice: ഇങ്ങനെ അന്യോന്യം നോക്കിക്കൊണ്ടിരിക്കുന്നത്
  rationale: ראה എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ സഹോദരന്മാർ മടിച്ചുനിന്ന് പരസ്പരം നോക്കുന്നതായി മനസ്സിലാക്കുന്നതാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്. ‘നോക്കിക്കൊണ്ടിരിക്കുന്നത്’ തുടരുന്ന നിഷ്ക്രിയതയെ പ്രകടമാക്കുന്നു; ‘ഇങ്ങനെ’ മലയാളത്തിൽ ശാസനയുടെ ഭാവം സ്വാഭാവികമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘എന്തിനാണ് ഇങ്ങനെ’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ‘യാക്കോബ്’ മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കാൻ രണ്ടാമത്തെ സ്ഥാനത്ത് ‘അവൻ’ എന്നു നൽകി.
