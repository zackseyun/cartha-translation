revisions:
- from: 'ഈജിപ്തിൽ ധാന്യം ലഭ്യമാണെന്ന് യാക്കോബ് അറിഞ്ഞപ്പോൾ[a], അവൻ തന്റെ പുത്രന്മാരോട് ചോദിച്ചു: “നിങ്ങൾ എന്തിനാണ് ഇങ്ങനെ അന്യോന്യം നോക്കിക്കൊണ്ടിരിക്കുന്നത്?”'
  to: 'ഈജിപ്തിൽ ധാന്യം ഉണ്ടെന്ന് യാക്കോബ് കണ്ടപ്പോൾ, അവൻ തന്റെ പുത്രന്മാരോട് ചോദിച്ചു: “നിങ്ങൾ എന്തിനാണ് പരസ്പരം നോക്കിക്കൊണ്ടിരിക്കുന്നത്?”'
