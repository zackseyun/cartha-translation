id: GEN.42.2
reference: Genesis 42:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇതാ, ഈജിപ്തിൽ ധാന്യം ഉണ്ടെന്ന് ഞാൻ കേട്ടിരിക്കുന്നു. അവിടേക്ക് ഇറങ്ങിച്ചെന്ന് അവിടെനിന്ന് നമുക്കുവേണ്ടി ധാന്യം വാങ്ങുക; അങ്ങനെ നാം ജീവിക്കാനും മരിക്കാതിരിക്കാനും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്ന് പറയുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ സജീവതയും ഗൗരവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: ലഭിച്ച വിവരം ഇപ്പോഴും പ്രസക്തമാണെന്ന പൂർത്തികൃതക്രിയയുടെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֶׁבֶר
  choice: ധാന്യം
  rationale: ക്ഷാമത്തിന്റെ ഈ പശ്ചാത്തലത്തിൽ പദം പൊതുവായ ഭക്ഷണമല്ല, വാങ്ങാൻ ലഭ്യമായ ധാന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: רְדוּ
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: കനാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള യാത്രയെ ‘ഇറങ്ങുക’ എന്നു ചിത്രീകരിക്കുന്ന ഹീബ്രു ദിശാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: שָׁמָּה / מִשָּׁם
  choice: അവിടേക്ക് / അവിടെനിന്ന്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയും അവിടെനിന്ന് വാങ്ങുന്നതും എന്ന ഹീബ്രുവിലെ രണ്ടു വ്യത്യസ്ത സ്ഥാനസൂചനകളും നിലനിർത്തുന്നു.
- source_word: וְשִׁבְרוּ
  choice: ധാന്യം വാങ്ങുക
  rationale: ഈ സന്ദർഭത്തിൽ ശׁבר എന്ന ക്രിയയ്ക്ക് പ്രത്യേകമായി ‘ധാന്യം വാങ്ങുക’ എന്ന വാണിജ്യാർഥമാണുള്ളത്; മലയാളത്തിൽ ആശയം വ്യക്തമായി പറയാൻ കർമം ആവർത്തിക്കുന്നു.
- source_word: לָנוּ
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രയോജനസ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: അങ്ങനെ നാം ജീവിച്ചിരിക്കട്ടെ, മരിക്കാതിരിക്കട്ടെ
  rationale: ജീവിക്കണമെന്ന ആഗ്രഹത്തെയും അതിന്റെ നിഷേധാത്മക സമാന്തരമായ മരിക്കാതിരിക്കണമെന്ന അടിയന്തരതയെയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: וְנִחְיֶה എന്ന രൂപത്തിലെ ഉദ്ദേശ്യ/ആഗ്രഹഭാവം
  choice: അങ്ങനെ നാം ജീവിച്ചിരിക്കട്ടെ, മരിക്കാതിരിക്കട്ടെ
  alternative: അപ്പോൾ നാം ജീവിക്കും, മരിക്കുകയില്ല
  rationale: വെറും ഉറപ്പുള്ള ഭാവിഫലമായി മാറ്റാതെ, ഹീബ്രുവിലെ ആഗ്രഹാത്മകവും ഉദ്ദേശ്യപരവുമായ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇറങ്ങിച്ചെന്ന്’ എന്നത് ഹീബ്രുവിലെ ഭൂമിശാസ്ത്രപരമായ ദിശാഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന ക്രിയാന്തങ്ങൾ ഒഴിവാക്കി.
