  text: וַ/יַּ֥רְא יוֹסֵ֛ף אֶת אֶחָ֖י/ו וַ/יַּכִּרֵ֑/ם וַ/יִּתְנַכֵּ֨ר אֲלֵי/הֶ֜ם וַ/יְדַבֵּ֧ר אִתָּ֣/ם קָשׁ֗וֹת וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֵ/אַ֣יִן בָּאתֶ֔ם וַ/יֹּ֣אמְר֔וּ מֵ/אֶ֥רֶץ כְּנַ֖עַן לִ/שְׁבָּר אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: ml
  text: 'യോസേഫ് തന്റെ സഹോദരന്മാരെ കണ്ടപ്പോൾ അവരെ തിരിച്ചറിഞ്ഞു. എന്നാൽ അവൻ അവരോട് അപരിചിതനെപ്പോലെ പെരുമാറി[a], അവരോട് പരുഷമായി സംസാരിച്ചു. അവൻ അവരോട്, “നിങ്ങൾ എവിടെനിന്നാണ് വന്നത്?” എന്നു ചോദിച്ചു. അവർ പറഞ്ഞു: “ഞങ്ങൾ കനാൻദേശത്തുനിന്ന് ഭക്ഷണം[b] വാങ്ങാൻ വന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവർക്കു തിരിച്ചറിയാനാകാത്തവിധം സ്വയം അവതരിപ്പിച്ചു.” എബ്രായപ്രയോഗം അവർക്കുമുന്നിൽ അന്യനോ അറിയാത്തവനോ ആയി പെരുമാറുന്നതിനെ സൂചിപ്പിക്കാം; ശാരീരികമായി വേഷംമാറിയെന്നത് നിർബന്ധമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ധാന്യം വാങ്ങാൻ.” ക്ഷാമത്തിന്റെ ഈ സന്ദർഭത്തിൽ എബ്രായ ക്രിയ പലപ്പോഴും ധാന്യം വാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന നാമം കൂടുതൽ വിശാലമായ “ഭക്ഷണം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... אֶת־אֶחָיו
  choice: യോസേഫ് തന്റെ സഹോദരന്മാരെ കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ചയിലെ സംഭവക്രമം സ്വാഭാവികമായ മലയാള കാലബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു; אֶחָיו സന്ദർഭത്തിൽ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּכִּרֵם
  choice: അവരെ തിരിച്ചറിഞ്ഞു
  rationale: נכר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ തിരിച്ചറിയുക എന്ന അർഥത്തിലാണ്.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: അവരോട് അപരിചിതനെപ്പോലെ പെരുമാറി
  rationale: ഹിത്പയേൽ രൂപം അവർക്കുമുന്നിൽ അന്യനോ അറിയാത്തവനോ ആയി സ്വയം അവതരിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; വേഷംമാറിയെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: അവരോട് പരുഷമായി സംസാരിച്ചു
  rationale: קָשׁוֹת സംസാരത്തിന്റെ കടുപ്പമുള്ള രീതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: מֵאַיִן בָּאתֶם
  choice: നിങ്ങൾ എവിടെനിന്നാണ് വന്നത്?
  rationale: ഉത്ഭവസ്ഥലത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തുനിന്നു
  rationale: אֶרֶץ כְּנַעַן എന്ന ഔപചാരിക ഭൂമിശാസ്ത്രപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לִשְׁבָּר אֹכֶל
  choice: ഭക്ഷണം വാങ്ങാൻ
  rationale: שבר ക്ഷാമസന്ദർഭത്തിൽ ധാന്യം വാങ്ങുന്നതിനെ പലപ്പോഴും സൂചിപ്പിച്ചാലും, אֹכֶל എന്ന നാമം വിശാലമായി ‘ഭക്ഷണം’ എന്നാണ്; അതിനാൽ മുഖ്യപാഠം അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
