  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അപരിചിതനെപ്പോലെ പെരുമാറി’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ബന്ധപരമായ അന്യത്വം സംരക്ഷിക്കുകയും ‘വേഷംമാറി’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
