  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ അർഥം സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കി.
