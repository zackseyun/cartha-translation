  language: ml
  text: ദേശത്തിന്റെ അധിപനായ ആ മനുഷ്യൻ ഞങ്ങളോടു പരുഷമായി സംസാരിച്ചു; ഞങ്ങളെ ദേശം ഒറ്റുനോക്കുന്ന ചാരന്മാരായി കണക്കാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: ദേശത്തിന്റെ അധിപൻ
  rationale: ഭൂവിഭാഗത്തിന്മേൽ അധികാരമുള്ള ഭരണാധികാരി എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִתָּנוּ קָשׁוֹת
  choice: ഞങ്ങളോടു കഠിനമായി സംസാരിച്ചു
  rationale: കഠിനമായ കാര്യങ്ങൾ സംസാരിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן אֹתָנוּ
  choice: ഞങ്ങളെ ... ആയി കണക്കാക്കി
  rationale: ഇവിടെ נָתַן എന്ന ക്രിയയ്ക്ക് ഒരാളെ ഒരു നിലയിൽ കാണുക അഥവാ പരിഗണിക്കുക എന്ന സന്ദർഭോചിത അർഥമുണ്ട്.
- source_word: כִּמְרַגְּלִים אֶת־הָאָרֶץ
  choice: ദേശം ഒറ്റുനോക്കാൻ വന്നവരായി
  rationale: മְרַגְּלִים എന്നത് രഹസ്യമായി ദേശം നിരീക്ഷിക്കുന്ന ചാരന്മാരെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യബോധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
