- from: ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്, ഒരേ അപ്പന്റെ മക്കൾ. ഒരാൾ ഇപ്പോൾ ഇല്ല[a]; ഇളയവൻ ഇന്ന് കനാൻദേശത്ത് ഞങ്ങളുടെ അപ്പനോടൊപ്പമുണ്ട്.
  to: ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്, ഞങ്ങളുടെ പിതാവിന്റെ പുത്രന്മാർ. ഒരാൾ ഇല്ല[a]; ഏറ്റവും ഇളയവൻ ഇന്ന് കനാൻദേശത്ത് ഞങ്ങളുടെ പിതാവിനോടൊപ്പമുണ്ട്.
