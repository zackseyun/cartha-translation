source:
  edition: WLC
  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: ml
  text: ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്, ഞങ്ങളുടെ പിതാവിന്റെ പുത്രന്മാർ. ഒരാൾ ഇല്ല[a]; ഏറ്റവും ഇളയവൻ ഇന്ന് കനാൻദേശത്ത് ഞങ്ങളുടെ പിതാവിനോടൊപ്പമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരാൾ ഇല്ല.” ഈ എബ്രായ പ്രയോഗത്തിന് ഒരാൾ കാണാതായിരിക്കുന്നു, പോയിരിക്കുന്നു, അല്ലെങ്കിൽ മരിച്ചെന്നു കരുതപ്പെടുന്നു എന്നൊക്കെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: ഞങ്ങൾ പന്ത്രണ്ട് സഹോദരന്മാരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ആണ്’ ചേർത്ത് അവതരിപ്പിക്കുന്നു; אַחִים ഇവിടെ ഒരേ കുടുംബത്തിലെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי אָבִינוּ
  choice: ഒരേ അപ്പന്റെ മക്കൾ
  rationale: അവർ എല്ലാവരും ഒരേ പിതാവിന്റെ പുത്രന്മാരാണെന്ന അനുബന്ധ വിശദീകരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: ഒരാൾ ഇപ്പോൾ ഇല്ല
  rationale: אֵינֶנּוּ എന്ന പ്രയോഗം ആൾ കാണാതായിരിക്കുന്നു, പോയിരിക്കുന്നു, അല്ലെങ്കിൽ മരിച്ചെന്നു കരുതപ്പെടുന്നു എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു. ‘ഇല്ല’ ആ സന്ദർഭപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ‘ഇപ്പോൾ’ മലയാളത്തിൽ ഇപ്പോഴത്തെ അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: וְהַקָּטֹן
  choice: ഇളയവൻ
  rationale: സഹോദരന്മാരുടെ പട്ടികയിൽ קָטֹן പ്രായത്തിൽ ഏറ്റവും ഇളയവനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: എബ്രായ കാലസൂചകപദം നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ഇളയവന്റെ ഇപ്പോഴത്തെ സ്ഥിതി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת אָבִינוּ
  choice: ഞങ്ങളുടെ അപ്പനോടൊപ്പം
  rationale: ഇവിടെ אֶת കർമചിഹ്നമല്ല, സഹവാസത്തെ സൂചിപ്പിക്കുന്ന പദമാണ്.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘കനാൻദേശം’ എന്ന പ്രയോഗം אֶרֶץ כְּנָעַן എന്ന സ്ഥലനാമഘടന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ അവസ്ഥയെക്കുറിച്ചുള്ള സഹോദരന്മാരുടെ പ്രസ്താവന
  choice: ഒരാൾ ഇപ്പോൾ ഇല്ല
  alternative: ഒരാൾ മരിച്ചുപോയി
  rationale: മൂലഭാഷ മരണം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല. കാണാതാകൽ, അഭാവം, മരിച്ചെന്ന ധാരണ എന്നിവയ്ക്കിടയിലെ അർഥവ്യാപ്തി പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കുടുംബഭാഷ ഉപയോഗിച്ചു. ‘പിതാവ്’ എന്നതിനെക്കാൾ സംഭാഷണസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘അപ്പൻ’ തിരഞ്ഞെടുത്തു; വാക്യഘടന മൂലപാഠത്തിന്റെ ആവർത്തനവും അർഥഭാരവും നിലനിർത്തുന്നു.
