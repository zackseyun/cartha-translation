  - severity: medium
    issue: ‘ഇളയവൻ’ underspecifies הַקָּטֹן
    rationale: In this sibling sequence, הַקָּטֹן denotes the youngest, not simply a younger one. ‘ഏറ്റവും ഇളയവൻ’ states this naturally and accurately.
