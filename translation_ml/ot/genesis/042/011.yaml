  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: ml
  text: ഞങ്ങളെല്ലാവരും ഒരേ പിതാവിന്റെ പുത്രന്മാരാണ്. ഞങ്ങൾ സത്യസന്ധരാണ്[a]; അങ്ങയുടെ ദാസന്മാർ ചാരന്മാരായിരുന്നിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സത്യസന്ധർ’ എന്നതിന് ‘നേരുള്ളവർ’ എന്നോ ‘വിശ്വസനീയർ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ചാരന്മാരാണെന്ന ആരോപണത്തിന് വിപരീതമായി, തങ്ങൾ കപടമില്ലാത്തവരും വിശ്വസിക്കാവുന്നവരുമാണെന്നാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അങ്ങയുടെ ദാസന്മാർ ചാരന്മാരല്ല’ എന്നോ ‘അങ്ങയുടെ ദാസന്മാർ ചാരന്മാരായിരുന്നില്ല’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ നിർമാണം മലയാളത്തിൽ ഈ വ്യത്യസ്ത സ്വാഭാവിക രീതികളിൽ അവതരിപ്പിക്കാവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: ഞങ്ങളെല്ലാവരും
  rationale: സംസാരിക്കുന്ന സംഘത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സമഗ്രതയും എബ്രായത്തിലെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: ഒരേ മനുഷ്യന്റെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു മനുഷ്യന്റെ പുത്രന്മാർ’; ഇവിടെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു. ഒരേ പിതാവിൽനിന്നുള്ളവരെന്ന ആശയം ‘ഒരേ മനുഷ്യന്റെ’ എന്നു സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: ഞങ്ങളെല്ലാവരും … ഞങ്ങൾ
  rationale: എബ്രായത്തിലെ സ്വതന്ത്ര സർവനാമങ്ങളുടെ ഊന്നലും രണ്ടാം വാക്യത്തിലെ ആവർത്തനവും മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: כֵּנִים
  choice: സത്യസന്ധർ
  rationale: ചാരപ്രവർത്തനമെന്ന ആരോപണത്തിനെതിരെ തങ്ങൾ വിശ്വസനീയരും കപടമില്ലാത്തവരുമാണെന്ന അവകാശവാദം സന്ദർഭോചിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഇവിടെ עבד അടിമത്തസ്ഥിതിയെ ഊന്നുന്നതിലുപരി ഒരു അധികാരിയോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ്. അതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു; ‘അങ്ങയുടെ’ ആദരസൂചകമാണ്.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ രഹസ്യമായി വിവരശേഖരണം നടത്തുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ചാരന്മാർ’ വ്യക്തവും സാധാരണവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: ചാരന്മാരായിരുന്നിട്ടില്ല
  rationale: היה എന്ന ക്രിയയും കർത്തൃവാചക രൂപവും ചേർന്ന എബ്രായ നിർമാണത്തെ, അവർ അത്തരത്തിൽ പ്രവർത്തിച്ചിട്ടില്ലെന്ന നിഷേധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കാലസൂചനയിലെ പരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
