  to: ഞങ്ങളെല്ലാവരും ഒരേ പിതാവിന്റെ പുത്രന്മാരാണ്. ഞങ്ങൾ സത്യസന്ധരാണ്[a]; അങ്ങയുടെ ദാസന്മാർ ചാരന്മാരായിരുന്നിട്ടില്ല[b].
