  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യോസേഫ് അധികാരസ്ഥാനത്തുള്ളതിനാൽ ഏകവചനത്തിലെ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലഭാഷയിലെ പുരുഷലിംഗസൂചന ‘പുത്രന്മാർ’ എന്നതിലൂടെ നിലനിർത്തി; അനാവശ്യ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
