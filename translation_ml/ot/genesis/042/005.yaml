id: GEN.42.5
reference: Genesis 42:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: ml
  text: അങ്ങനെ, കനാൻദേശത്ത് ക്ഷാമം ഉണ്ടായിരുന്നതിനാൽ, ധാന്യം വാങ്ങാൻ വന്നവരുടെ കൂട്ടത്തിൽ ഇസ്രായേലിന്റെ പുത്രന്മാരും വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ തുടർകഥനരൂപം അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ഈജിപ്തിലെത്തുന്ന കാഴ്ചപ്പാടിൽ മലയാളത്തിൽ ‘വന്നു’ സ്വാഭാവികമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽ എന്ന യാക്കോബിന്റെ ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘ഇസ്രായേൽമക്കൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: לִשְׁבֹּר
  choice: ധാന്യം വാങ്ങാൻ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വാങ്ങുക’ എന്നാണെങ്കിലും, ക്ഷാമത്തെക്കുറിച്ചുള്ള യോസേഫ് കഥാസന്ദർഭത്തിൽ വാങ്ങുന്നത് ധാന്യം/ഭക്ഷ്യധാന്യമാണ്; മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: വന്നവരുടെ കൂട്ടത്തിൽ
  rationale: בְּתוֹךְ ഒരു കൂട്ടത്തിന്റെ നടുവിലോ കൂട്ടത്തിലോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; הַבָּאִים ‘വന്നുകൊണ്ടിരുന്നവർ/വന്നവർ’ എന്നാണ്. ‘വന്നവരുടെ കൂട്ടത്തിൽ’ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כִּי
  choice: ആയിരുന്നതിനാൽ
  rationale: അവരുടെ വരവിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ കാരണവാചകമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָיָה הָרָעָב
  choice: ക്ഷാമം ഉണ്ടായിരുന്നു
  rationale: അറിയപ്പെടുന്ന ക്ഷാമത്തിന്റെ നിലനിൽപ്പ് സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടനയെ വ്യക്തമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘കനാൻദേശം’ എന്ന ഉറച്ച മലയാള പ്രയോഗം ഹീബ്രുവിലെ ‘കനാൻ ദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പരാമർശം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നത് ഇവിടെ യാക്കോബിന്റെ ആൺമക്കളെ കൃത്യമായി തിരിച്ചറിയിക്കുന്നു. ഹീബ്രുവിലെ בוא എന്ന ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിൽ ‘വന്നവരുടെ… വന്നു’ എന്ന രൂപത്തിൽ നിലനിൽക്കുന്നുവെങ്കിലും വാക്യം സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിലാണ്.
