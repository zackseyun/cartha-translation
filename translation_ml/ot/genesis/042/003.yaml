source:
  edition: WLC
  text: וַ/יֵּרְד֥וּ אֲחֵֽי יוֹסֵ֖ף עֲשָׂרָ֑ה לִ/שְׁבֹּ֥ר בָּ֖ר מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: ml
  text: അങ്ങനെ യോസേഫിന്റെ പത്ത് സഹോദരന്മാർ ഈജിപ്തിൽനിന്ന് ധാന്യം വാങ്ങാൻ ഇറങ്ങിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിൽ ധാന്യം വാങ്ങാൻ.” എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഈജിപ്തിൽനിന്ന് ധാന്യം വാങ്ങാൻ” എന്നു പറയുന്നു; ഇത് ധാന്യത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്കു പോകുക’ എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി യാത്രയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: യോസേഫിന്റെ പത്തു സഹോദരന്മാർ
  rationale: എബ്രായ ഘടനയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: לִשְׁבֹּר
  choice: വാങ്ങാൻ
  rationale: ക്ഷാമവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ שׁבר ധാന്യം വിലകൊടുത്തു സമ്പാദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള בָּר അതിന്റെ കർമം വ്യക്തമാക്കുന്നു.
- source_word: בָּר
  choice: ധാന്യം
  rationale: ധാന്യവിളകളെ പൊതുവായി സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദമാണ്.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ സാധാരണ ഉറവിടാർഥമായ ‘നിന്ന്’ സംരക്ഷിക്കുന്നു; ധാന്യത്തിന്റെ ഉറവിടം ഈജിപ്താണെന്ന ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇറങ്ങിച്ചെന്നു’ എന്നത് ഈജിപ്തിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘അവിടേക്കു’ ചേർത്തത് ‘ഈജിപ്തിൽനിന്ന്’ എന്ന ഉറവിടപ്രയോഗത്തോടൊപ്പം ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കാനാണ്.
