  revised_text: പിന്നെ അവർ തങ്ങളുടെ ധാന്യം തങ്ങളുടെ കഴുതകളുടെ പുറത്ത് കയറ്റി അവിടെനിന്ന് പുറപ്പെട്ടു.[a]
