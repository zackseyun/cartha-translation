source:
  edition: WLC
  text: וַ/יִּשְׂא֥וּ אֶת שִׁבְרָ֖/ם עַל חֲמֹרֵי/הֶ֑ם וַ/יֵּלְכ֖וּ מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: ml
  text: പിന്നെ അവർ തങ്ങളുടെ ധാന്യം തങ്ങളുടെ കഴുതകളുടെ പുറത്ത് കയറ്റി അവിടെനിന്ന് പുറപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ ഭക്ഷ്യസാധനങ്ങൾ’ എന്നോ ‘തങ്ങൾ വാങ്ങിയ ധാന്യം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഭക്ഷ്യസാധനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഈജിപ്തിൽനിന്ന് വാങ്ങിയ ധാന്യത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: കയറ്റി
  rationale: נשׂא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഉയർത്തുക/ചുമക്കുക’ എന്നാണെങ്കിലും, ചരക്ക് മൃഗങ്ങളുടെമേൽ വെക്കുന്ന ഈ യാത്രാസന്ദർഭത്തിൽ ‘കയറ്റി’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שִׁבְרָם
  choice: തങ്ങളുടെ ധാന്യം
  rationale: യോസേഫിന്റെ കഥയിലെ ക്ഷാമസന്ദർഭത്തിൽ שֶׁבֶר സാധാരണയായി വാങ്ങിയ ധാന്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ധാന്യം’ സംക്ഷിപ്തവും സന്ദർഭത്തിൽ കൃത്യവുമാണ്; പദത്തിനുള്ള വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל חֲמֹרֵיהֶם
  choice: കഴുതകളുടെമേൽ
  rationale: കയറ്റുന്ന പ്രവൃത്തിയോടൊപ്പം עַל വസ്തു മൃഗങ്ങളുടെമേൽ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കഴുതകളുടെമേൽ’ മൂലപാഠത്തിന്റെ ഘടനയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: וַיֵּלְכוּ
  choice: പുറപ്പെട്ടു
  rationale: הלך ഒരു സാധാരണ ഗമനക്രിയയാണ്; מִשָּׁם എന്നതിനൊപ്പം ഇവിടെ ആ സ്ഥലത്തുനിന്നുള്ള യാത്രതിരിക്കലാണ് ഉദ്ദേശിക്കുന്നത്. ‘പുറപ്പെട്ടു’ അനാവശ്യമായ ദിശയോ ലക്ഷ്യസ്ഥാനമോ ചേർക്കാതെ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്നു
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘അവിടെനിന്നു’ എന്നത് വ്യക്തവും ആധുനികവുമായ നേരിട്ടുള്ള തർജമയാണ്.
