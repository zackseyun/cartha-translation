translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ തുടർച്ച സൂചിപ്പിക്കാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു; ‘കയറ്റി ... പുറപ്പെട്ടു’ എന്ന ക്രിയാശൃംഖല സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
