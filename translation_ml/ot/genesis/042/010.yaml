id: GEN.42.10
reference: Genesis 42:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ അവനോടു പറഞ്ഞു: “അങ്ങനെയല്ല, യജമാനനേ; അങ്ങയുടെ ദാസന്മാർ ഭക്ഷണം[a] വാങ്ങാൻ വന്നതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ധാന്യം.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “ഭക്ഷണം” എന്നാണ്; എന്നാൽ ക്ഷാമത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ധാന്യമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: എന്നാൽ അവർ പറഞ്ഞു
  rationale: തുടർന്നുള്ള വാവ് ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ യോസേഫിന്റെ ആരോപണത്തോടുള്ള എതിർപ്പ് വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: אֶל എന്ന പദത്തിന്റെ സർവനാമപ്രത്യയത്തോടുകൂടിയ രൂപം, മറുപടി യോസേഫിനോടാണ് പറഞ്ഞതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: לֹא
  choice: അങ്ങനെയല്ല
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിൽ ശക്തമായ നിഷേധമായി പ്രവർത്തിക്കുന്നു; ‘അല്ല’ എന്നതിനെക്കാൾ ഇവിടെ ആരോപണം തള്ളിക്കളയുന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഉന്നത ഉദ്യോഗസ്ഥനോടുള്ള ആദരവും സാമൂഹിക അധീനതയും നിലനിർത്തുന്ന അഭിസംബോധനയാണ്; ‘സാർ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഭാവം നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: וַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: עֶבֶד അടിമയെയോ ദാസനെയോ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ബന്ധിത അടിമത്തമല്ല, വിനയപൂർവമായ രാജസഭാഭാഷയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בָּאוּ
  choice: വന്നതാണ്
  rationale: അവരുടെ വരവിന്റെ ഉദ്ദേശ്യവും ഇപ്പോഴത്തെ സാന്നിധ്യവുമായി അതിനുള്ള ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִשְׁבָּר
  choice: വാങ്ങാൻ
  rationale: ക്ഷാമകാലത്തെ ധാന്യമോ ഭക്ഷണമോ വിലയ്ക്കു സമ്പാദിക്കുക എന്നതാണ് സന്ദർഭത്തിലെ അർഥം; പിന്നാലെ കർമ്മം വരുന്നതിനാൽ ‘വാങ്ങാൻ’ മതിയാകുന്നു.
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: אֹכֶל എന്നത് പൊതുവായി ഭക്ഷണം എന്നാണ്; ക്ഷാമസന്ദർഭത്തിൽ ധാന്യം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ വിശാലമായ മൂലപദാർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണം. ‘യജമാനനേ’, ‘അങ്ങയുടെ ദാസന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ സഹോദരന്മാരുടെ വിനയവും സാമൂഹിക അധീനതയും നിലനിർത്തുന്നു; അതേസമയം അനാവശ്യമായി പുരാതനമോ വിഭാഗീയമോ ആയ ഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
