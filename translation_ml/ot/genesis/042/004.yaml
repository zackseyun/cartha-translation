id: GEN.42.4
reference: Genesis 42:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: ml
  text: എന്നാൽ യോസേഫിന്റെ സഹോദരനായ ബെന്യാമീനെ യാക്കോബ് അവന്റെ സഹോദരന്മാരോടൊപ്പം അയച്ചില്ല. “അവന് എന്തെങ്കിലും ആപത്ത് സംഭവിച്ചേക്കാം,” എന്ന് അവൻ പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവന് ദുരന്തം നേരിട്ടേക്കാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ മറ്റു പുത്രന്മാർ പോയതും ഇവിടെ ബെന്യാമീൻ പോകാതിരുന്നതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; אֶת എന്ന കർമസൂചകത്തിന് പ്രത്യേകം പരിഭാഷയില്ല.
- source_word: בִּנְיָמִין
  choice: ബെന്യാമീൻ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: אֲחִי יוֹסֵף
  choice: യോസേഫിന്റെ സഹോദരനായ
  rationale: നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ബെന്യാമീനെ യോസേഫുമായുള്ള ബന്ധത്തിലൂടെ പ്രത്യേകം തിരിച്ചറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא שָׁלַח
  choice: അയച്ചില്ല
  rationale: שׁלח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അയയ്ക്കുക’ ആഖ്യാനസന്ദർഭത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: אֶת אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരോടൊപ്പം
  rationale: ബെന്യാമീനെ മറ്റു സഹോദരന്മാരോടൊപ്പം അയച്ചില്ല എന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי אָמַר
  choice: എന്ന് അവൻ പറഞ്ഞു
  rationale: കാരണമായി അവതരിപ്പിച്ച യാക്കോബിന്റെ നേരിട്ടുള്ള വാക്കുകൾ നിലനിർത്തുന്നു; ‘ചിന്തിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ മാറ്റം ഒഴിവാക്കുന്നു.
- source_word: פֶּן
  choice: സംഭവിച്ചേക്കാം
  rationale: פֶּן സൂചിപ്പിക്കുന്ന ഭയപ്പെട്ട സാധ്യതയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാരൂപത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: יִקְרָאֶנּוּ
  choice: അവന് ... സംഭവിച്ചേക്കാം
  rationale: ആപത്ത് ഒരാളെ ബാധിക്കുകയോ അയാൾക്ക് സംഭവിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവിക മലയാളസമാനത.
- source_word: אָסוֹן
  choice: ആപത്ത്
  rationale: ഗുരുതരമായ ദോഷം, ദുരന്തം, അനിഷ്ടസംഭവം എന്നീ സാധ്യതകൾ പ്രത്യേകത നിർബന്ധിക്കാതെ ഉൾക്കൊള്ളുന്ന പദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എന്നാൽ’ വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘ആപത്ത് സംഭവിച്ചേക്കാം’ എന്നത് ഭയപ്പെട്ട സാധ്യതയെ പഴഞ്ചൊല്ലുഭാവമില്ലാതെ അവതരിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
