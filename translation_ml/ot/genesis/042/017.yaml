translation:
  language: ml
  text: അവൻ അവരെ മൂന്നു ദിവസത്തേക്ക് കാവലിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ അവരെ മൂന്നു ദിവസത്തേക്ക് കാവലിൽ തടഞ്ഞുവെച്ചു.’ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘കൂട്ടിച്ചേർത്തു/ശേഖരിച്ചു’ എന്നാണ്; എന്നാൽ ഇവിടെ അത് കാവലിൽ വെക്കുക എന്ന വ്യവഹാരിക അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: പാർപ്പിച്ചു
  rationale: אָסַף എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൂട്ടിച്ചേർക്കുക/ശേഖരിക്കുക’ എന്നാണെങ്കിലും, אֶל מִשְׁמָר എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ ആരെയെങ്കിലും കാവലിൽ അടയ്ക്കുക അഥവാ പാർപ്പിക്കുക എന്ന വ്യവഹാരിക അർഥമാണ്. ‘പാർപ്പിച്ചു’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: യോസേഫിന്റെ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ബഹുവചന കർമസർവനാമം.
- source_word: אֶל
  choice: -യിൽ
  rationale: സാധാരണയായി ‘അടുക്കലേക്ക്/അകത്തേക്ക്’ എന്ന ചലനാർഥമുള്ള പദമാണെങ്കിലും, ‘കാവലിൽ പാർപ്പിച്ചു’ എന്ന മലയാളപ്രയോഗത്തിൽ കാവൽസ്ഥിതിയിലേക്കുള്ള പ്രവേശനം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁמָר
  choice: കാവൽ
  rationale: കാക്കപ്പെടുന്ന സ്ഥലം അല്ലെങ്കിൽ അവസ്ഥയാണ് പദം സൂചിപ്പിക്കുന്നത്. എബ്രായപദം നിർബന്ധമായി ഔപചാരിക തടവറയെ സൂചിപ്പിക്കാത്തതിനാൽ ‘ജയിൽ’ എന്നതിനെക്കാൾ ‘കാവൽ’ യോജിക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തേക്ക്
  rationale: കാലദൈർഘ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ശൈലി. ‘കാവൽ’ എന്ന പദം തടങ്കൽ എന്ന ആശയം നൽകുമ്പോഴും മൂലപാഠം ആവശ്യപ്പെടാത്ത ‘ജയിൽ’ എന്ന അധികവിശദീകരണം ഒഴിവാക്കുന്നു.
