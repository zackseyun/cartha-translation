reference: Genesis 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: ml
  text: യാഹ്‌വെയുടെ ദൂതൻ[a] മരുഭൂമിയിൽ ഒരു നീരുറവയ്ക്കരികെ അവളെ കണ്ടെത്തി; ശൂരിലേക്കുള്ള വഴിയിലുണ്ടായിരുന്ന ആ നീരുറവയ്ക്കരികെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാഹ്‌വെയുടെ സന്ദേശവാഹകൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: അവളെ കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തുന്നു; സ്ത്രീലിംഗ ഏകവചന കർമപ്രത്യയം ഹാഗാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്; ദൈവിക ദൂതനെയോ സന്ദേശവാഹകനെയോ സൂചിപ്പിക്കാവുന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: עַל עֵין הַמַּיִם
  choice: ഒരു നീരുറവയ്ക്കരികെ
  rationale: עַיִן ഇവിടെ ജലസ്രോതസ്സായ ‘നീരുറവ’ എന്നാണ്; עַל സ്ഥലബന്ധത്തിൽ ‘അരികെ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലെ
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് ‘മരുഭൂമി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל הָעַיִן
  choice: ആ നീരുറവയ്ക്കരികെ
  rationale: നിശ്ചയാർഥക ഘടകം മുമ്പ് പറഞ്ഞ അതേ നീരുറവയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ’ ചേർത്ത് ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: ശൂരിലേക്കുള്ള വഴിയിലുള്ള
  rationale: דֶּרֶךְ എന്നതിന്റെ പാത/വഴി എന്ന ഭൂപ്രദേശപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; שׁוּר ‘ശൂർ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ ദൈവിക ദൂതൻ/സന്ദേശവാഹകൻ അർഥവ്യാപ്തി
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: പ്രധാനവാചകത്തിൽ പതിവും സന്ദർഭോചിതവുമായ ‘ദൂതൻ’ ഉപയോഗിക്കുന്നു; എന്നാൽ മൂലപദത്തിലെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ നീരുറവയെക്കുറിച്ചുള്ള ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചിരിക്കുന്നു.
