source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ ദൂതൻ അവളോടു പറഞ്ഞു: “നിന്റെ യജമാനത്തിയുടെ അടുക്കലേക്കു മടങ്ങിച്ചെന്ന് അവളുടെ കൈക്കീഴിൽ സ്വയം താഴ്ത്തുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അവളുടെ കൈക്കീഴിൽ സ്വയം താഴ്ത്തുക.” “അവളുടെ കൈക്കീഴിൽ” എന്നത് അവളുടെ അധികാരത്തിൻ കീഴിൽ എന്ന എബ്രായ പ്രയോഗമാണ്. ക്രിയയ്ക്ക് “കീഴ്പ്പെടുക” അല്ലെങ്കിൽ “കഷ്ടത സഹിക്കുക” എന്ന ധ്വനിയും ഉണ്ടാകാം.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്ന പദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഈ ദൈവികസന്ദർശന പശ്ചാത്തലത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; പദത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധികമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: שׁוּבִי אֶל גְּבִרְתֵּךְ
  choice: നിന്റെ യജമാനത്തിയുടെ അടുക്കലേക്കു മടങ്ങിച്ചെന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ബലം നിലനിർത്തുന്നു. גְּבֶרֶת സൂചിപ്പിക്കുന്ന സ്ത്രീ മേലധികാരിയെ ‘യജമാനത്തി’ എന്നു വ്യക്തമാക്കി.
- source_word: וְהִתְעַנִּי
  choice: കീഴടങ്ങുക
  rationale: ענה എന്ന ക്രിയയുടെ ഹിത്പായേൽ ആജ്ഞ ഇവിടെ സ്വയം താഴ്ത്തി അധീനസ്ഥാനം സ്വീകരിക്കുക എന്ന സാമൂഹിക-ബന്ധപരമായ ആശയം നൽകുന്നു. ‘കീഴടങ്ങുക’ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പീഡനം സ്വമേധയാ തേടണം എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: תַּחַת יָדֶיהָ
  choice: അവളുടെ അധികാരത്തിനു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ കൈക്കീഴിൽ’ എന്ന എബ്രായ പ്രയോഗം അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ എന്ന അർഥത്തിലാണ്. മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തമായി നൽകി, മൂലചിത്രം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു.
- issue: מַלְאַךְ എന്ന പദം ദൂതനോ സന്ദേശവാഹകനോ എന്നത്
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: ഈ ദൈവികസന്ദർശന സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമായ വായനയാണ്; എന്നാൽ ആ ദൂതന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സ്വത്വം വാചകം നിർണയിക്കുന്നതായി അവതരിപ്പിക്കുന്നില്ല.
- issue: וְהִתְעַנִּי എന്ന ആജ്ഞയുടെ അർഥവ്യാപ്തി
  choice: അവളുടെ അധികാരത്തിനു കീഴടങ്ങുക
  alternative: അവളുടെ കൈക്കീഴിൽ നിന്നെത്തന്നെ താഴ്ത്തുക; അവളുടെ അധികാരത്തിൻ കീഴിലെ കഷ്ടത ഏറ്റുകൊൾക
  rationale: ക്രിയയ്ക്ക് സ്വയം താഴ്ത്തുക, കീഴ്പ്പെടുക, കഷ്ടതയ്ക്ക് വിധേയയാകുക എന്നീ പരസ്പരം ബന്ധമുള്ള ധ്വനികളുണ്ട്. സന്ദർഭത്തിലെ അധികാരബന്ധം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ കഠിനത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യജമാനത്തി’ സാമൂഹിക മേൽക്കോയ്മയെ വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ‘കൈക്കീഴിൽ’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി ‘അധികാരത്തിനു’ എന്നു നൽകി, യഥാർഥ രൂപവും അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
