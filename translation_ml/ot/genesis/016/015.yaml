  to: ഹാഗാർ അബ്രാമിന് ഒരു മകനെ പ്രസവിച്ചു; അബ്രാം ഹാഗാർ പ്രസവിച്ച തന്റെ മകന് യിശ്മായേൽ എന്നു പേരിട്ടു.
