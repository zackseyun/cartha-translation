id: GEN.16.15
reference: Genesis 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: ml
  text: ഹാഗാർ അബ്രാമിന് ഒരു മകനെ പ്രസവിച്ചു; അബ്രാം ഹാഗാർ പ്രസവിച്ച തന്റെ മകന് യിശ്മായേൽ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: Qal രൂപത്തിൽ സ്ത്രീ കർത്താവായിരിക്കുമ്പോൾ ילד എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘പ്രസവിക്കുക’ എന്നാണ് അർഥം; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְאַבְרָם
  choice: അബ്രാമിന്
  rationale: לְ ഇവിടെ ബന്ധം/പ്രയോജനഭോക്തൃത്വം സൂചിപ്പിക്കുന്നു—കുഞ്ഞ് അബ്രാമിന്റെ മകനായി ജനിച്ചു. മലയാളത്തിലെ ദത്തിവിഭക്തി ഈ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: നിർദ്ദേശകോപപദമില്ലാത്ത בֵּן എന്ന നാമത്തിന്റെ അനിശ്ചിതത്വം ‘ഒരു’ കൊണ്ടു വ്യക്തമാക്കുന്നു; ക്രിയയുടെ കർമമായതിനാൽ ‘മകനെ’ എന്നു നൽകി.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: പേരിട്ടു
  rationale: കൃത്യമായ ഹീബ്രു ശൈലി ‘പേര് വിളിച്ചു’ എന്നാണെങ്കിലും, ഒരാൾക്കു നാമം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം ‘പേരിട്ടു’ ആണ്.
- source_word: בְּנוֹ
  choice: തന്റെ മകന്
  rationale: സർവനാമപ്രത്യയം അബ്രാമിന്റെ ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവിലേക്കു മടങ്ങുന്ന ‘തന്റെ’ എന്ന രൂപം അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: ഹാഗാർ പ്രസവിച്ച
  rationale: ബന്ധവാക്യം മകനെ വിശേഷിപ്പിക്കുകയും ഹാഗാറിനെ വീണ്ടും വ്യക്തമായി പരാമർശിക്കുകയും ചെയ്യുന്നു; മലയാളത്തിൽ മുൻസ്ഥാപിത വിശേഷണവാക്യം സ്വാഭാവികമാണ്.
- source_word: יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: ഹീബ്രു പേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ ഹാഗാറിന്റെ ആവർത്തിച്ചുള്ള പരാമർശവും അബ്രാമിന്റെ പിതൃത്വബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ קרא שם എന്ന പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘പേരിട്ടു’ എന്നു സ്വാഭാവികമാക്കി.
