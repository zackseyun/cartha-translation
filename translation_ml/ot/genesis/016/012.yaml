id: GEN.16.12
reference: Genesis 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: ml
  text: അവൻ കാട്ടുകഴുതയെപ്പോലെയുള്ള ഒരു മനുഷ്യനായിരിക്കും[a]; അവന്റെ കൈ എല്ലാവർക്കും എതിരായിരിക്കും, എല്ലാവരുടെയും കൈ അവന് എതിരായിരിക്കും. അവൻ തന്റെ എല്ലാ സഹോദരന്മാരുടെയും എതിർവശത്ത് പാർക്കും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കാട്ടുകഴുത-മനുഷ്യൻ.’ ഹീബ്രു പ്രയോഗം അവനെ കാട്ടുകഴുതയോട് ഉപമിക്കുന്നു; ഇത് വെറും ‘കാട്ടാളൻ’ എന്നു പറയുന്നതിനെക്കാൾ മെരുക്കപ്പെടാത്ത സ്വാതന്ത്ര്യത്തിന്റെ ചിത്രം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘മുമ്പിൽ,’ ‘സന്നിധിയിൽ,’ അല്ലെങ്കിൽ ‘എതിർവശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. അവൻ തന്റെ സഹോദരന്മാരുടെ എതിർവശത്തോ അവരുടെ മുമ്പിലോ അവരോട് എതിർനിലയിലോ പാർക്കും എന്ന അർഥം ഹീബ്രു പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘സഹോദരന്മാർ’ എന്നത് സ്വന്തം സഹോദരന്മാരെ മാത്രമല്ല, അടുത്ത ബന്ധുക്കളെയോ ബന്ധുജനങ്ങളെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: കാട്ടുകഴുതയെപ്പോലെയുള്ള ഒരു മനുഷ്യൻ
  rationale: פֶּרֶא എന്നത് വെറും ‘കാട്ടാളൻ’ എന്നല്ല, കാട്ടുകഴുതയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ഹീബ്രുവിലെ സജീവമായ മൃഗോപമയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ ഈ പദം പൊതുവായ മനുഷ്യവർഗത്തെയല്ല, ഇശ്മായേൽ എന്ന പുരുഷവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָדוֹ בַכֹּל
  choice: അവന്റെ കൈ എല്ലാവർക്കും എതിരായിരിക്കും
  rationale: ‘കൈ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന ശത്രുതയോ എതിർപ്പോ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְיַד כֹּל בּוֹ
  choice: എല്ലാവരുടെയും കൈ അവന് എതിരായിരിക്കും
  rationale: മുൻവാക്യഭാഗത്തോടുള്ള സമാന്തരതയും പരസ്പര എതിർപ്പും നിലനിർത്തുന്നു.
- source_word: וְעַל־פְּנֵי
  choice: അഭിമുഖമായി
  rationale: പദപ്രയോഗത്തിന് ‘മുമ്പിൽ’, ‘സന്നിധിയിൽ’, ‘എതിരായി’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘അഭിമുഖമായി’ എന്നത് സ്ഥലപരവും ബന്ധപരവുമായ അവ്യക്തതയെ അനാവശ്യമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: כָּל־אֶחָיו
  choice: തന്റെ എല്ലാ സഹോദരന്മാർക്കും
  rationale: אָח എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘സഹോദരൻ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ബന്ധുക്കളിലേക്കോ ബന്ധുജനങ്ങളിലേക്കോ വ്യാപിക്കാവുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשְׁכֹּן
  choice: പാർക്കും
  rationale: שׁכן എന്നതിന്റെ ‘വസിക്കുക, പാർക്കുക, താമസമാക്കുക’ എന്ന അർഥം പ്രവചനാത്മക ഭാവത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: פֶּרֶא אָדָם എന്ന പ്രയോഗത്തിലെ ഇശ്മായേലിന്റെ ചിത്രീകരണം
  choice: മൃഗോപമ വ്യക്തമായി നിലനിർത്തി ‘കാട്ടുകഴുതയെപ്പോലെയുള്ള ഒരു മനുഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘കാട്ടാളനായ മനുഷ്യൻ’ അല്ലെങ്കിൽ ‘വന്യനായ മനുഷ്യൻ’
  rationale: ഹീബ്രു പാഠത്തിലെ ഉപമയെ പൊതുവായ സ്വഭാവവിവരണമായി മയപ്പെടുത്താതെയും അതിൽ ഇല്ലാത്ത അധിക ധാർമികവിധി ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ കാട്ടുകഴുതയുടെ ഉപമയും ‘കൈ’ എന്ന സമാന്തര ദൃശ്യരൂപവും നിലനിർത്തി; וְעַל־פְּנֵי എന്നതിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
