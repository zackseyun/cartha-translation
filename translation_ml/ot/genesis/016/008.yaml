id: GEN.16.8
reference: Genesis 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സാറായിയുടെ അടിമസ്ത്രീയായ[a] ഹാഗാറേ, നീ എവിടെനിന്നാണ് വന്നത്? എവിടേക്കാണ് പോകുന്നത്?” അവൾ പറഞ്ഞു: “എന്റെ യജമാനത്തിയായ സാറായിയുടെ സാന്നിധ്യത്തിൽനിന്ന്[b] ഞാൻ ഓടിപ്പോകുകയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാസിയായ” അല്ലെങ്കിൽ “സ്ത്രീ അടിമയായ” എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുപദം സാറായിയുടെ അധീനതയിലുള്ള ഒരു സ്ത്രീയുടെ അടിമപ്പദവിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ, ‘മുഖം/സാന്നിധ്യം’ എന്ന ആശയത്തിൽനിന്നുള്ള പ്രയോഗം: “എന്റെ യജമാനത്തിയായ സാറായിയുടെ സാന്നിധ്യത്തിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: അടിമസ്ത്രീയായ
  rationale: שִׁפְחָה ഒരു സ്ത്രീയുടെ അടിമ/സേവിക എന്ന അധീന സാമൂഹികപദവിയെ സൂചിപ്പിക്കുന്നു. ‘അടിമസ്ത്രീ’ ലിംഗവും ബന്ധിതമായ അധീനപദവിയും മയപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: אֵי מִזֶּה בָאת
  choice: നീ എവിടെനിന്നാണ് വന്നത്?
  rationale: ഉത്ഭവസ്ഥാനത്തെക്കുറിച്ചുള്ള ചോദ്യമാണിത്; ഹീബ്രു പൂർണക്രിയയുടെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: וְאָנָה תֵלֵכִי
  choice: എവിടേക്കാണ് പോകുന്നത്?
  rationale: אָנָה ലക്ഷ്യസ്ഥാനത്തെ ചോദിക്കുന്നു; സന്ദർഭത്തിൽ പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന യാത്രയെ മലയാളത്തിലെ വർത്തമാനരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִפְּנֵי
  choice: സാന്നിധ്യത്തിൽനിന്ന്
  rationale: പദശഃ ‘മുഖത്തുനിന്ന്/സാന്നിധ്യത്തിൽനിന്ന്’ എന്ന ആശയം വരുന്നു. ഒരാളുടെ സന്നിധിയിൽനിന്നുള്ള വേർപാടും രക്ഷപ്പെടലും ഈ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גְּבִרְתִּי
  choice: എന്റെ യജമാനത്തിയായ
  rationale: സ്ത്രീലിംഗരൂപം ഹാഗാറിനുമേൽ അധികാരമുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ‘യജമാനത്തി’ ആ സാമൂഹികബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֹּרַחַת
  choice: ഞാൻ ഓടിപ്പോകുകയാണ്
  rationale: സ്ത്രീലിംഗ വർത്തമാന കൃദന്തരൂപം തുടരുന്ന രക്ഷപ്പെടൽ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഓടിപ്പോകുകയാണ്’ അതിന്റെ പുരോഗമനസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ കർത്താവിനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ഈ വാക്യത്തിൽ ദൂതന്റെ പദവി വീണ്ടും ചേർക്കാതെ ഹീബ്രുവിന്റെ ലഘുരൂപം നിലനിർത്തുന്നു.
- source_word: שָׂרַי
  choice: സാറായി
  rationale: പേരിന്റെ ഹീബ്രു ഉച്ചാരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הָגָר
  choice: ഹാഗാർ
  rationale: പേരിന്റെ ഹീബ്രു ഉച്ചാരണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: ഹാഗാറിന്റെ സാമൂഹികപദവി എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അടിമസ്ത്രീ
  alternative: ദാസി / വേലക്കാരി
  rationale: വാക്യം ഹാഗാറിനെ സാറായിയുടെ അധീനതയിലുള്ള സ്ത്രീയായി വ്യക്തമാക്കുന്നു. ‘അടിമസ്ത്രീ’ ആ ബന്ധിതപദവിയെ മയപ്പെടുത്താതെ പ്രകടമാക്കുന്നു.
- issue: സംസാരിക്കുന്നത് യഹോവയുടെ ദൂതനാണെന്ന് ഈ വാക്യത്തിൽ വീണ്ടും വ്യക്തമാക്കണമോ
  choice: അവൻ പറഞ്ഞു
  alternative: യഹോവയുടെ ദൂതൻ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിൽ കർത്താവ് വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിലെ ഹീബ്രു പദവി ആവർത്തിക്കുന്നില്ല. അതിനാൽ ഇവിടെ ഇല്ലാത്ത തിരിച്ചറിയൽ പ്രധാനപാഠത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- issue: מִפְּנֵי എന്ന പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തണമോ
  choice: സാറായിയുടെ സാന്നിധ്യത്തിൽനിന്ന്
  alternative: സാറായിയിൽനിന്ന് / സാറായിയെ വിട്ട്
  rationale: ‘സാന്നിധ്യത്തിൽനിന്ന്’ എന്നത് ഹീബ്രുവിലെ ‘മുഖം/സാന്നിധ്യം’ എന്ന ഘടകം നിലനിർത്തുന്നു; അതേസമയം ഹാഗാർ സാറായിയുടെ അടുത്തുനിന്ന് രക്ഷപ്പെടുന്നതെന്ന അർഥവും വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ഹാഗാറേ’ എന്ന സംബോധനരൂപം ഹീബ്രുവിലെ നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു. സാമൂഹിക അധീനതയെ മയപ്പെടുത്താതിരിക്കാനായി ‘അടിമസ്ത്രീ’യും സ്ത്രീ അധികാരിയെ സൂചിപ്പിക്കാൻ ‘യജമാനത്തി’യും ഉപയോഗിച്ചു.
