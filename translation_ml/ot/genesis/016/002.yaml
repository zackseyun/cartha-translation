review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative sequence, Sarai's attribution of her childlessness to Yahweh, the euphemistic invitation concerning her enslaved woman, the tentative force of אוּלַי, and Abram's response. However, the attention-getting הִנֵּה נָא is underrepresented by «ഇതാ» alone, and «ഞാൻ പണിയപ്പെടും» is overly opaque in modern Malayalam without an explicit familial complement.
  naturalness: «എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക» is an acceptable Malayalam biblical-style euphemism. «എനിക്ക് ഒരു കുടുംബം പണിയപ്പെടും» is substantially more natural than saying that Sarai herself will be built, while preserving the Hebrew building metaphor.
  terminology: «യഹോവ», «അടിമസ്ത്രീ», and the names «സാറായി» and «അബ്രാം» are appropriate. The revised rendering retains the unsoftened status term and the source's euphemistic register.
  issues:
  - severity: low
    issue: ഹִנֵּה נָא is rendered only as «ഇതാ».
    rationale: «ഇതാ» can introduce an assertion, but it does not fully convey the source's direct attention-getting appeal. «നോക്കൂ» is natural modern Malayalam and better represents the discourse force.
  - severity: medium
    issue: «ഒരുപക്ഷേ അവളിലൂടെ ഞാൻ പണിയപ്പെടും» is unnaturally literal in Malayalam.
    rationale: Although the Hebrew Niphal metaphor literally concerns Sarai being built up, Malayalam does not idiomatically speak of a person being built in this familial sense. Adding «എനിക്ക് ഒരു കുടുംബം» preserves the building imagery and communicates the contextual sense without asserting more than the Hebrew implies.
  revised_text: 'അപ്പോൾ സാറായി അബ്രാമിനോടു പറഞ്ഞു: “നോക്കൂ, യഹോവ എന്നെ മക്കളെ പ്രസവിക്കുന്നതിൽനിന്ന് തടഞ്ഞിരിക്കുന്നു. ദയവായി എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക; ഒരുപക്ഷേ അവളിലൂടെ എനിക്ക് ഒരു കുടുംബം പണിയപ്പെടും[a].” അബ്രാം സാറായിയുടെ വാക്കു കേട്ടു.'
