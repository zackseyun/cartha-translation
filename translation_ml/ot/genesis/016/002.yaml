id: GEN.16.2
reference: Genesis 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: ml
  text: 'അപ്പോൾ സാറായി അബ്രാമിനോടു പറഞ്ഞു: “നോക്കൂ, യഹോവ എന്നെ മക്കളെ പ്രസവിക്കുന്നതിൽനിന്ന് തടഞ്ഞിരിക്കുന്നു. ദയവായി എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക; ഒരുപക്ഷേ അവളിലൂടെ എനിക്ക് ഒരു കുടുംബം പണിയപ്പെടും[a].” അബ്രാം സാറായിയുടെ വാക്കു കേട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഒരുപക്ഷേ അവളിലൂടെ ഞാൻ പണിയപ്പെടും.” എബ്രായത്തിൽ ‘പണിയപ്പെടുക’ എന്നത് കുടുംബം സ്ഥാപിക്കപ്പെടുക അല്ലെങ്കിൽ മക്കളിലൂടെ വളരുക എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.'
    reason: മലയാളത്തിൽ സ്വാഭാവികമല്ലാത്ത അക്ഷരാർഥരൂപകവും അതിന്റെ കുടുംബം/സന്തതി സംബന്ധിയായ സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; נָאയുടെ വിനയഭാവം തുടർന്നുള്ള ‘ദയവായി’ എന്നതിലും വ്യക്തമാകുന്നു.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: യഹോവ എന്നെ മക്കളെ പ്രസവിക്കുന്നതിൽനിന്ന് തടഞ്ഞിരിക്കുന്നു
  rationale: സാറായി തന്റെ വന്ധ്യതയെ യഹോവയുടെ പ്രവർത്തനമായി നേരിട്ട് വിശേഷിപ്പിക്കുന്നതിനെ മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു; ילדയുടെ പ്രസവസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בֹּא נָא אֶל
  choice: ദയവായി ... അടുക്കൽ ചെല്ലുക
  rationale: ലൈംഗികബന്ധത്തിനുള്ള എബ്രായ സൗമ്യോക്തി നേരിട്ട് വിശദീകരിക്കാതെ അതിന്റെ ഭാവവും സന്ദർഭത്തിലെ ഗ്രാഹ്യതയും നിലനിർത്തുന്നു.
- source_word: שִׁפְחָתִי
  choice: എന്റെ അടിമസ്ത്രീ
  rationale: שִׁפְחָה സൂചിപ്പിക്കുന്ന ബന്ധിതവും താഴ്ന്നതുമായ സാമൂഹികപദവി ‘വേലക്കാരി’ എന്ന മൃദൂകരണത്തിലേക്ക് മാറ്റാതെ വ്യക്തമാക്കുന്നു.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: ഒരുപക്ഷേ അവളിലൂടെ ഞാൻ പണിയപ്പെടും
  rationale: בנהയുടെ ‘പണിയുക’ എന്ന രൂപകം നിലനിർത്തുകയും מִמֶּנָּהയെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘അവളിലൂടെ’ എന്നു നൽകുകയും ചെയ്യുന്നു; കുടുംബം/സന്തതി ലഭിക്കുക എന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי
  choice: അബ്രാം സാറായിയുടെ വാക്കു കേട്ടു
  rationale: ‘ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അനുസരിക്കുക/ചെവികൊടുക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അബ്രാമിന്റെ പ്രതികരണം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: സാറായിയുടെ വന്ധ്യതയിൽ യഹോവയുടെ പങ്ക്
  choice: യഹോവ എന്നെ ... തടഞ്ഞിരിക്കുന്നു
  alternative: യഹോവ എന്നെ പ്രസവിക്കാൻ അനുവദിച്ചിട്ടില്ല
  rationale: മൂലപാഠം യഹോവയുടെ പ്രവർത്തനത്തെ നേരിട്ട് ചുമത്തുന്നു. അതിനെ മയപ്പെടുത്തുകയോ വിപുലമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുകയോ ചെയ്തിട്ടില്ല.
- issue: ലൈംഗികബന്ധത്തിനുള്ള സൗമ്യോക്തിയുടെ വ്യക്തത
  choice: എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക
  alternative: എന്റെ അടിമസ്ത്രീയുമായി ബന്ധപ്പെടുക
  rationale: മൂലപാഠത്തിന്റെ സൗമ്യോക്തിപരമായ ശൈലി സംരക്ഷിക്കുന്നു; സന്ദർഭം അർഥം ഗ്രഹിക്കാൻ മതിയായതാണ്.
- issue: אִבָּנֶה എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ഞാൻ പണിയപ്പെടും
  alternative: എനിക്ക് അവളിലൂടെ മക്കളുണ്ടാകും
  rationale: കുടുംബം പണിയപ്പെടുക എന്ന എബ്രായ രൂപകവും അതിലെ അർഥസാന്ദ്രതയും നിലനിർത്തുന്നു; സാധ്യമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അടിമസ്ത്രീ’ സാമൂഹിക യാഥാർഥ്യം മയപ്പെടുത്തുന്നില്ല; ‘അടുക്കൽ ചെല്ലുക’ മൂലത്തിലെ സൗമ്യോക്തി നിലനിർത്തുന്നു. ദൈവനാമം יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
