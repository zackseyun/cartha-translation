revisions:
- from: 'അപ്പോൾ സാറായി അബ്രാമിനോടു പറഞ്ഞു: “ഇതാ, യഹോവ എന്നെ മക്കളെ പ്രസവിക്കുന്നതിൽനിന്ന് തടഞ്ഞിരിക്കുന്നു. ദയവായി എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക; ഒരുപക്ഷേ അവളിലൂടെ ഞാൻ പണിയപ്പെടും[a].” അബ്രാം സാറായിയുടെ വാക്കു കേട്ടു.'
  to: 'അപ്പോൾ സാറായി അബ്രാമിനോടു പറഞ്ഞു: “നോക്കൂ, യഹോവ എന്നെ മക്കളെ പ്രസവിക്കുന്നതിൽനിന്ന് തടഞ്ഞിരിക്കുന്നു. ദയവായി എന്റെ അടിമസ്ത്രീയുടെ അടുക്കൽ ചെല്ലുക; ഒരുപക്ഷേ അവളിലൂടെ എനിക്ക് ഒരു കുടുംബം പണിയപ്പെടും[a].” അബ്രാം സാറായിയുടെ വാക്കു കേട്ടു.'
  rationale: The revision improves the rendering of the opening appeal and makes the Hebrew building metaphor intelligible in modern standard Malayalam. It does not alter Sarai's tentative hope, the euphemistic sexual expression, or the social reality denoted by «അടിമസ്ത്രീ».
  reviewer_model: gpt-5.6-terra
