id: GEN.16.10
reference: Genesis 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ ദൂതൻ അവളോട് പറഞ്ഞു[a]: “ഞാൻ നിന്റെ സന്തതിയെ അത്യന്തം വർധിപ്പിക്കും; അതിന്റെ പെരുപ്പം നിമിത്തം അതിനെ എണ്ണാനാവുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹ്‌വേയുടെ സന്ദേശവാഹകൻ.”
    reason: מַלְאַךְ എന്ന എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്നർഥമുണ്ട്; ഈ ഉല്പത്തി പ്രയോഗത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികവും പരമ്പരാഗതവുമാണ്. ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ യഹ്‌വേ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: הַרְבָּה אַרְבֶּה
  choice: അത്യന്തം വർധിപ്പിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും പരിധിക്രിയയും ചേർന്ന ഘടന പ്രവർത്തിയുടെ അളവിനെ ശക്തിപ്പെടുത്തുന്നു; ‘അത്യന്തം’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: זַרְעֵךְ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഏകവചനരൂപത്തിലുള്ള സമൂഹപദമാണ്; ‘സന്തതി’ അതിന്റെ കൂട്ടായ അർഥവും ഏകവചനസൂചനയും നിലനിർത്തുന്നു.
- source_word: וְלֹא יִסָּפֵר
  choice: അതിനെ എണ്ണാൻ കഴിയുകയില്ല
  rationale: നിഫാൽ രൂപം ഇവിടെ എണ്ണപ്പെടുക എന്ന ആശയമാണ് നൽകുന്നത്; സന്ദർഭത്തിൽ എണ്ണാനാവാത്തത്ര പെരുപ്പം എന്ന അർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מֵרֹב
  choice: പെരുപ്പംനിമിത്തം
  rationale: מִן + רֹב വലിയ സംഖ്യ കാരണമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പെരുപ്പംനിമിത്തം’ ആ കാരണബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു ശീർഷകമായി പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ തിരിച്ചറിയൽസൂക്ഷ്മത
  choice: യഹ്‌വേയുടെ ദൂതൻ
  alternative: യഹ്‌വേയുടെ സന്ദേശവാഹകൻ
  rationale: മൂലപദത്തിന്റെ ദൂതൻ/സന്ദേശവാഹകൻ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു; ദൂതന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ നിഗമനം വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആഖ്യാനശൈലി ലളിതമായി സൂക്ഷിക്കുകയും മൂലത്തിലെ ഊന്നലും സമൂഹ ഏകവചനവും നിലനിർത്തുകയും ചെയ്തു.
