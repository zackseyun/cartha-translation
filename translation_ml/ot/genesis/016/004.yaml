source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: ml
  text: അവൻ ഹാഗാറിന്റെ അടുക്കൽ ചെന്നു; അവൾ ഗർഭം ധരിച്ചു. താൻ ഗർഭം ധരിച്ചെന്നു കണ്ടപ്പോൾ, അവളുടെ യജമാനത്തി ഹാഗാറിന്റെ കണ്ണിൽ നിസ്സാരയായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളുടെ യജമാനത്തി ഹാഗാറിന്റെ ദൃഷ്ടിയിൽ നിന്ദ്യയായി.” എബ്രായ പ്രയോഗം സാറായി ഹാഗാറിന്റെ വിലയിരുത്തലിൽ നിസ്സാരയായിത്തീർന്നു എന്നോ, ഹാഗാർ അവളെ നിന്ദിച്ചു എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: അവൻ ഹാഗാറിന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא אל എന്നത് ഈ സന്ദർഭത്തിൽ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മാന്യമായ പ്രയോഗമാണ്. മലയാളത്തിലെ ‘അടുക്കൽ ചെന്നു’ എന്ന പ്രയോഗം അർഥം സന്ദർഭത്തിൽ വ്യക്തമാക്കിക്കൊണ്ട് എബ്രായ വിവരണത്തിന്റെ മിതത്വവും പരോക്ഷതയും നിലനിർത്തുന്നു.
- source_word: הָגָר
  choice: ഹാഗാർ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ പരിചിതവും മൂലോച്ചാരണത്തോട് അടുത്തതുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַתַּהַר / הָרָתָה
  choice: ഗർഭം ധരിച്ചു / ഗർഭം ധരിച്ചെന്നു
  rationale: הרה എന്ന ക്രിയയുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ആദ്യത്തേത് സംഭവത്തെയും രണ്ടാമത്തേത് ഹാഗാർ തന്റെ അവസ്ഥ തിരിച്ചറിഞ്ഞതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַתֵּרֶא כִּי
  choice: കണ്ടപ്പോൾ
  rationale: ראה כי ഇവിടെ അവസ്ഥ മനസ്സിലാക്കുകയോ തിരിച്ചറിയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കണ്ടപ്പോൾ’ മൂലത്തിലെ ദൃശ്യബിംബവും ആഖ്യാനത്തിന്റെ കാലക്രമവും നിലനിർത്തുന്നു.
- source_word: וַתֵּקַל
  choice: നിന്ദ്യയായി
  rationale: קלל എന്ന ക്രിയ ഇവിടെ വിലകുറഞ്ഞവളായി കണക്കാക്കപ്പെടുക, നിസ്സാരയാകുക, നിന്ദിക്കപ്പെടുക എന്നീ അർഥസാധ്യതകൾ വഹിക്കുന്നു. ‘നിന്ദ്യയായി’ ഹാഗാറിന്റെ വിലയിരുത്തലിലെ മാറ്റം പ്രകടമാക്കുന്നു; ഇത് യജമാനത്തിയുടെ യഥാർഥ ഗുണമാറ്റമാണെന്ന് നിർബന്ധിക്കുന്നില്ല.
- source_word: גְּבִרְתָּהּ
  choice: അവളുടെ യജമാനത്തി
  rationale: גברת ഒരു സ്ത്രീ മേലധികാരിയെയോ യജമാനത്തിയെയോ സൂചിപ്പിക്കുന്നു. സാമൂഹികബന്ധം വ്യക്തമായി നൽകാൻ ‘യജമാനത്തി’ തെരഞ്ഞെടുത്തു.
- source_word: בְּעֵינֶיהָ
  choice: അവളുടെ കണ്ണിൽ
  rationale: മൂലത്തിലെ ‘അവളുടെ കണ്ണുകളിൽ’ എന്ന വിലയിരുത്തൽസൂചകമായ പ്രയോഗം സ്വാഭാവിക മലയാള ഏകവചന ശൈലിയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഹാഗാറിന്റെ മനോഭാവമോ സാറായിയോടുള്ള പ്രവർത്തിയോ
  choice: അവളുടെ യജമാനത്തി അവളുടെ കണ്ണിൽ നിന്ദ്യയായി
  alternative: അവൾ തന്റെ യജമാനത്തിയെ നിന്ദിച്ചു
  rationale: എബ്രായ വാക്യത്തിൽ ‘യജമാനത്തി’ വ്യാകരണകർത്താവായതിനാൽ, ഹാഗാറിന്റെ വിലയിരുത്തലിൽ അവളുടെ സ്ഥാനം താഴ്ന്നതായി പറയുന്ന ഘടന നിലനിർത്തുന്നു. ഹാഗാർ പ്രകടമായി അപമാനകരമായി പെരുമാറിയെന്ന് വാചകം കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലത്തിലെ പരോക്ഷപ്രയോഗം സംരക്ഷിച്ചു; അവസാന ഉപവാക്യത്തിലെ വ്യാകരണപരവും അർഥപരവുമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
