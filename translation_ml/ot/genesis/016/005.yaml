id: GEN.16.5
reference: Genesis 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: ml
  text: 'അപ്പോൾ സാറായി അബ്രാമിനോടു പറഞ്ഞു: “എനിക്കു നേരിട്ട അനീതിയുടെ ഉത്തരവാദിത്വം നിനക്കാണ്.[a] ഞാൻ എന്റെ അടിമസ്ത്രീയെ നിന്റെ മാറിടത്തിലേക്കു തന്നു;[b] അവൾ ഗർഭം ധരിച്ചെന്നു കണ്ടപ്പോൾ ഞാൻ അവളുടെ കണ്ണിൽ നിന്ദ്യയായി. യഹ്‌വെ എനിക്കും നിനക്കും മധ്യേ വിധിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എന്റെ അനീതി നിന്റെമേൽ.” ഇവിടെ സാറായി തനിക്കു നേരിട്ട അനീതിയുടെ ഉത്തരവാദിത്വം അബ്രാമിന്മേൽ ചുമത്തുന്നതായിരിക്കാം അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നിന്റെ മടിയിലേക്കു/മാറിടത്തിലേക്കു”; ഇവിടെ അടുപ്പമുള്ള ദാമ്പത്യസ്വീകരണത്തെ സൂചിപ്പിക്കുന്ന മിതഭാഷാപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: എനിക്കു നേരിട്ട അനീതിയുടെ ഉത്തരവാദിത്വം നിനക്കാണ്
  rationale: חָמָס ഇവിടെ അക്രമം എന്നതിലുപരി നേരിട്ട അനീതി/ദ്രോഹം സൂചിപ്പിക്കുന്നു; עָלֶיךָ അബ്രാമിന്മേൽ ഉത്തരവാദിത്വം ചുമത്തുന്നു. സാറായി സ്വന്തം തെറ്റ് സമ്മതിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് കുറ്റാരോപണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: שִׁפְחָתִי
  choice: എന്റെ അടിമസ്ത്രീയെ
  rationale: שִׁפְחָה സ്ത്രീയുടെ സേവകസ്ഥാനം മാത്രമല്ല, ബന്ധിതമായ സാമൂഹിക പദവിയും സൂചിപ്പിക്കുന്നു; ‘അടിമസ്ത്രീ’ അത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּחֵיקֶךָ
  choice: നിന്റെ മാറിടത്തിലേക്കു
  rationale: חֵיק എന്നതിന്റെ ശരീരരൂപകം നിലനിർത്തുകയും ഈ സന്ദർഭത്തിലെ ദാമ്പത്യ/ലൈംഗിക സ്വീകരണത്തിന്റെ മിതഭാഷ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָרָתָה
  choice: ഗർഭം ധരിച്ചെന്നു
  rationale: പൂർത്തിയായ ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്ന perfect രൂപത്തിന്റെ കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: അവളുടെ കണ്ണിൽ ഞാൻ നിന്ദ്യയായി
  rationale: קלל രൂപം വിലകുറഞ്ഞവളായി/നിന്ദ്യയായി കണക്കാക്കപ്പെട്ട ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘അവളുടെ കണ്ണിൽ’ എന്നത് എബ്രായ വിലയിരുത്തൽപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: יִשְׁפֹּט יְהוָה
  choice: യഹ്‌വെ ... വിധിക്കട്ടെ
  rationale: יִשְׁפֹּט എന്ന jussive ദൈവിക വിധിക്കായുള്ള അഭ്യർഥനയായി നൽകുന്നു; יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: എനിക്കും നിനക്കും മധ്യേ
  rationale: രണ്ടു വ്യക്തമായ കക്ഷികൾക്കിടയിൽ യഹ്‌വെയെ ന്യായാധിപനായി അഭ്യർഥിക്കുന്ന നേരിട്ടുള്ള ഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദിവ്യനാമം പൊതുവായ പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും പ്രചാരമുള്ളതുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: സാറായിയുടെ കുറ്റാരോപണത്തിൽ ഉത്തരവാദിത്വം ആരുടേതെന്ന വ്യാഖ്യാനം
  choice: തനിക്കു നേരിട്ട അനീതിയുടെ ഉത്തരവാദിത്വം അബ്രാമിനാണെന്ന കുറ്റാരോപണം
  alternative: ‘എന്റെ തെറ്റ് നിന്റെമേൽ വരട്ടെ’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള വായന
  rationale: חֲמָסִי എന്ന ഉടമസ്ഥപ്രത്യയം വ്യാകരണപരമായി രണ്ടുവിധത്തിൽ കേൾക്കാവുന്നതാണ്. സന്ദർഭം സാറായി അനുഭവിച്ച അപമാനത്തെ മുൻനിർത്തുന്നതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ കുറ്റാരോപണവായന സ്വീകരിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ഗദ്യശൈലി. കുറ്റാരോപണത്തിന്റെ തീക്ഷ്ണതയും എബ്രായത്തിലെ ശരീരരൂപകവും ദൈവിക ന്യായവിധിക്കായുള്ള അഭ്യർഥനയും നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
