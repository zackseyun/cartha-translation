source:
  edition: WLC
  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: ml
  text: അതുകൊണ്ട് ആ കിണറിന് ബേർ-ലഹയ്-രോയി[a] എന്നു പേരായി. ഇതാ, അത് കാദേശിനും ബേരെദിനും ഇടയിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേർ-ലഹയ്-രോയി എന്നതിന് “എന്നെ കാണുന്ന ജീവനുള്ളവന്റെ കിണർ” എന്നോ “എന്നെ കാണുന്നവന്റെ കിണർ—അവൻ ജീവിക്കുന്നു” എന്നോ അർത്ഥമാകാം.
    reason: ഹീബ്രായ സ്ഥലപ്പേരിന്റെ വാക്കർത്ഥവും അതിലെ യഥാർത്ഥ അർത്ഥസാധ്യതയും വായനക്കാരന് ലഭ്യമാക്കാൻ.
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: പേരിടലിനെ മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം സ്വാഭാവികമായി പകർന്നു.
- source_word: קָרָא לַבְּאֵר
  choice: ആ കിണറിന് ... എന്നു പേരായി
  rationale: ഹീബ്രായ ക്രിയയുടെ കർത്താവ് ഇവിടെ വ്യക്തമല്ല; കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ കർമണാർഥ രൂപം സ്വീകരിച്ചു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: സ്ഥലവിവരത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ സൂചകത്തിന്റെ ശക്തി നിലനിർത്തി.
- source_word: בֵּין ... וּבֵין
  choice: '...നും ...നും ഇടയിൽ'
  rationale: രണ്ട് സ്ഥലങ്ങൾക്കിടയിലെ സ്ഥാനം വ്യക്തമാക്കുന്ന ഹീബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: בְּאֵר לַחַי רֹאִי എന്ന പേരിന്റെ അർത്ഥസാധ്യത
  choice: പ്രധാനവാചകത്തിൽ സ്ഥലപ്പേര് ലിപ്യന്തരണം ചെയ്ത്, അർത്ഥം അടിക്കുറിപ്പിൽ നൽകി
  alternative: ‘എന്നെ കാണുന്ന ജീവനുള്ളവന്റെ കിണർ’ എന്ന അർത്ഥവിവർത്തനം പ്രധാനവാചകത്തിൽ നൽകുക
  rationale: ഇത് ഒരു സ്ഥലപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം വായനയിൽ യോജിക്കുന്നു; അതേസമയം ഹീബ്രായ പേരിന്റെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു. സർവ്വനാമബന്ധത്തിലെ സൂക്ഷ്മമായ അർത്ഥവൈവിധ്യം ഏകപക്ഷീയമായി തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കാദേശ്, ബേരെദ് എന്നീ പേരുകൾ ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു; ‘ഇതാ’ എന്നത് ശ്രദ്ധാകർഷകമായ הִנֵּה സംരക്ഷിക്കുന്നു.
