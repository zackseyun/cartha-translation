id: GEN.16.3
reference: Genesis 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: ml
  text: അബ്രാം കനാൻദേശത്ത് വസിച്ചിട്ട് പത്തു വർഷം കഴിഞ്ഞപ്പോൾ[a], അബ്രാമിന്റെ ഭാര്യയായ സാറായി തന്റെ അടിമസ്ത്രീയായ ഈജിപ്തുകാരി ഹാഗാറിനെ എടുത്ത്, അവളെ തന്റെ ഭർത്താവായ അബ്രാമിന് ഭാര്യയായി കൊടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അബ്രാം കനാൻദേശത്ത് വസിച്ചു പത്തു വർഷം പൂർത്തിയായപ്പോൾ.’'
    reason: കാലസൂചകമായ എബ്രായപ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത നൽകുന്നു.
  - marker: b
    text: 'എബ്രായപാഠം: ‘അവന് ഭാര്യയായി’; അതേ വാക്യം ഹാഗാറിനെ സാറായിയുടെ അടിമസ്ത്രീയായും തിരിച്ചറിയിക്കുന്നു.'
    reason: ഹാഗാറിന്റെ ഭാര്യപദവിയും അടിമസ്ഥിതിയും പാഠത്തിൽ ഒരുമിച്ചു നിലനിൽക്കുന്നതു വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; തുടർന്ന് ‘കൊടുത്തു’ എന്ന ക്രിയയുമായി ഉറവിടത്തിലെ എടുത്തു–കൊടുത്തു ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: അബ്രാമിന്റെ ഭാര്യ സാറായി
  rationale: സാറായിയെ അബ്രാമുമായുള്ള ബന്ധത്തിലൂടെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמִּצְרִית
  choice: ഈജിപ്തുകാരി
  rationale: ഹാഗാറിന്റെ ദേശീയ/വംശീയ തിരിച്ചറിയൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁפְחָתָהּ
  choice: തന്റെ അടിമയായ
  rationale: שִׁפְחָה സൂചിപ്പിക്കുന്ന ബന്ധിത അടിമസ്ഥിതി ‘ദാസി’ പോലുള്ള മൃദുവായ പരമ്പരാഗത പദത്താൽ മറയ്ക്കാതെ വ്യക്തമാക്കുന്നു; സ്ത്രീലിംഗം ‘ഈജിപ്തുകാരി’യിലും ഹാഗാർ എന്ന വ്യക്തിയിലും വ്യക്തമാണ്.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: അബ്രാം കനാൻദേശത്ത് താമസിച്ചുതുടങ്ങി പത്തു വർഷം കഴിഞ്ഞപ്പോൾ
  rationale: പത്തു വർഷത്തെ കാലയളവ് പൂർത്തിയായ ശേഷമുള്ള സമയബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְאַבְרָם אִישָׁהּ
  choice: തന്റെ ഭർത്താവായ അബ്രാമിന്
  rationale: אִישָׁהּ എന്നത് ഇവിടെ ‘അവളുടെ ഭർത്താവ്’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לוֹ לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഉറവിടം വെപ്പാട്ടി എന്ന പ്രത്യേക പദമല്ല, אִשָּׁה എന്ന ‘ഭാര്യ/സ്ത്രീ’ പദമാണ് ഉപയോഗിക്കുന്നത്; ലക്ഷ്യസ്ഥിതി മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാമിനോടുള്ള ഹാഗാറിന്റെ പദവി
  choice: ഹാഗാറിനെ സാറായിയുടെ ‘അടിമ’ എന്നും അബ്രാമിന് ‘ഭാര്യയായി’ കൊടുത്തവൾ എന്നും ഒരുപോലെ വിവർത്തനം ചെയ്തു.
  alternative: ‘വെപ്പാട്ടിയായി’ അല്ലെങ്കിൽ ‘ദാസിയായി’ എന്നു മാത്രം നൽകുക.
  rationale: എബ്രായപാഠം ഹാഗാറിന്റെ അടിമസ്ഥിതിയും അവളെ ഭാര്യയായി നൽകിയതും ഒരുമിച്ച് പറയുന്നു. ഈ സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. പരമ്പരാഗതമായെങ്കിലും അടിമസ്ഥിതി മൃദൂകരിക്കുന്ന ‘ദാസി’ ഒഴിവാക്കി ‘അടിമ’ ഉപയോഗിച്ചു; ഉറവിടത്തിലെ എടുത്തു–കൊടുത്തു ക്രിയാക്രമം കഴിയുന്നത്ര നിലനിർത്തി.
