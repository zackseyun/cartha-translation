id: GEN.16.11
reference: Genesis 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയുടെ ദൂതൻ അവളോടു പറഞ്ഞു[a]: “ഇതാ, നീ ഗർഭിണിയാണ്; നീ ഒരു മകനെ പ്രസവിക്കും. അവന് യിശ്മായേൽ എന്നു പേരിടണം; കാരണം യഹോവ നിന്റെ കഷ്ടത കേട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹോവയുടെ സന്ദേശവാഹകൻ.”
    reason: מַלְאַךְ എന്ന പദത്തിന്റെ ‘ദൂതൻ’, ‘സന്ദേശവാഹകൻ’ എന്നീ അർഥസാധ്യതകൾ സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ അഥവാ ‘സന്ദേശവാഹകൻ’ എന്നർഥമാകാം. ഈ വിവരണസന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ‘ദൂതൻ’ ആണ്; പദത്തിന്റെ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: הִנָּךְ הָרָה
  choice: ഇതാ, നീ ഗർഭിണിയാണ്
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രഖ്യാപനകണമാണ്; ‘ഇതാ’ അതിന്റെ ഗൗരവവും സൂചനാശക്തിയും നിലനിർത്തുന്നു. הָרָהയെ വ്യക്തവും ആധുനികവുമായ ‘ഗർഭിണി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: നീ ഒരു മകനെ പ്രസവിക്കും
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന പ്രസവത്തെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וְקָרָאת שְׁמוֹ
  choice: അവന് … എന്നു പേരിടണം
  rationale: എബ്രായയിലെ ‘അവന്റെ പേര് വിളിക്കുക’ എന്ന നാമകരണസൂത്രത്തെ അർഥനിഷ്ഠവും സ്വാഭാവികവുമായ മലയാള നാമകരണപ്രയോഗമായി നൽകി; നിർദേശാത്മക ഭാവം ‘പേരിടണം’ എന്നതിൽ നിലനിർത്തി.
- source_word: יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം; പേരിന്റെ അർഥബന്ധം തുടർന്നുള്ള കാരണവാക്യം വ്യക്തമാക്കുന്നു.
- source_word: כִּי שָׁמַע יְהוָה
  choice: കാരണം യഹോവ … കേട്ടിരിക്കുന്നു
  rationale: כִּי നാമകരണത്തിനുള്ള കാരണം നൽകുന്നു. പൂർത്തിക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘കേട്ടിരിക്കുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָנְיֵךְ
  choice: നിന്റെ കഷ്ടത
  rationale: עֳנִי പീഡനം, ദുരിതം, താഴ്ത്തപ്പെട്ട അവസ്ഥ എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘കഷ്ടത’ ഈ അർഥവ്യാപ്തിയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരരൂപത്തിൽ സംരക്ഷിച്ചു.
- issue: מַלְאַךְ יְהוָהയുടെ വ്യക്തിത്വം
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ സന്ദേശവാഹകൻ
  rationale: മൂലപ്രയോഗം അതേപടി നിലനിർത്തി; ഈ ദൂതനെക്കുറിച്ച് വാക്യം നേരിട്ട് പറയുന്നതിലധികമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രഖ്യാപനത്തിന്റെ ഗൗരവം ‘ഇതാ’ എന്നതിലൂടെ നിലനിർത്തുകയും, എബ്രായ വാക്യത്തിന്റെ ആശയം സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്തു.
