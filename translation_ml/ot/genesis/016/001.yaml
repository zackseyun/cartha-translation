  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: ml
  text: അബ്രാമിന്റെ ഭാര്യയായ സാറായി അവനു മക്കളെ പ്രസവിച്ചിരുന്നില്ല. അവൾക്ക് ഹാഗാർ എന്നു പേരുള്ള ഒരു ഈജിപ്തുകാരി അടിമസ്ത്രീ[a] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘ദാസി’ അല്ലെങ്കിൽ ‘വേലക്കാരി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ שִׁפְחָה വീട്ടിലെ ഒരു സ്ത്രീ അടിമയെ സൂചിപ്പിക്കുന്നു; ആ ബന്ധിത സാമൂഹികപദവി നിലനിർത്താനാണ് ഇവിടെ ‘അടിമസ്ത്രീ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: സാറായി
  rationale: വാക്യാരംഭത്തിലെ ו പുതിയ വിവരണഘട്ടത്തെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു. വ്യക്തിനാമം ‘സാറായി’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֵשֶׁת אַבְרָם
  choice: അബ്രാമിന്റെ ഭാര്യയായ
  rationale: ഹീബ്രു സമാസഘടനയിലെ ‘അബ്രാമിന്റെ ഭാര്യ’ എന്ന ബന്ധം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לֹא יָלְדָה לוֹ
  choice: അവനു മക്കളെ പ്രസവിച്ചിരുന്നില്ല
  rationale: ഭർത്താവിനുവേണ്ടി/അവന് സന്തതിയെ പ്രസവിക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മക്കളെ’ ചേർത്തു; പശ്ചാത്തലാവസ്ഥ സൂചിപ്പിക്കാൻ ‘പ്രസവിച്ചിരുന്നില്ല’ ഉപയോഗിച്ചു.
- source_word: וְלָהּ
  choice: അവൾക്ക് ... ഉണ്ടായിരുന്നു
  rationale: ‘അവൾക്കു [ഒരുവൾ] ഉണ്ടായിരുന്നു’ എന്ന ഹീബ്രു ഉടമസ്ഥതാഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שִׁפְחָה
  choice: അടിമസ്ത്രീ
  rationale: വീട്ടിലെ ബന്ധിത സാമൂഹികപദവി മറച്ചുവയ്ക്കാതെ സൂചിപ്പിക്കുന്നു; വെറും ‘ദാസി’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സാമൂഹിക യാഥാർഥ്യം വ്യക്തമാണ്.
- source_word: מִצְרִית
  choice: ഈജിപ്തുകാരി
  rationale: സ്ത്രീയുടെ ഈജിപ്ത്യൻ വംശദേശീയതയെ സ്വാഭാവികമായ മലയാള നാമവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: וּשְׁמָהּ הָגָר
  choice: ഹാഗാർ എന്നു പേരുള്ള
  rationale: പേര് വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന ഹീബ്രു ഉപവാക്യത്തെ മലയാളത്തിൽ സുഗമമായി സംയോജിപ്പിക്കുന്നു.
