  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: ml
  text: ഹാഗാർ അബ്രാമിന് യിശ്മായേലിനെ പ്രസവിച്ചപ്പോൾ അബ്രാമിന് എൺപത്താറ് വയസ്സായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അബ്രാമിനുവേണ്ടി.’ ഈ സന്ദർഭത്തിൽ എബ്രായത്തിലെ ഉപസർഗം രണ്ടുവിധത്തിലും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: അബ്രാം
  rationale: പേരിന്റെ എബ്രായരൂപം ആധുനിക മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בֶּן
  choice: വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘മകൻ’ എന്നല്ല; മലയാളത്തിലെ സ്വാഭാവിക പ്രായപ്രയോഗമായി വിവർത്തനം ചെയ്തു.
- source_word: שְׁמֹנִים שָׁנָה וְשֵׁשׁ שָׁנִים
  choice: എൺപത്തിയാറു വയസ്സ്
  rationale: എബ്രായത്തിലെ ‘എൺപതു വർഷവും ആറു വർഷവും’ എന്ന സംയുക്തസംഖ്യയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള സംഖ്യാരൂപത്തിൽ നൽകി.
- source_word: בְּ/לֶדֶת
  choice: പ്രസവിച്ചപ്പോൾ
  rationale: בְ ചേർന്ന infinitive construct ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘പ്രസവിച്ചപ്പോൾ’ എന്ന് സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הָגָר
  choice: ഹാഗാർ
  rationale: പേര് എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന, മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶת יִשְׁמָעֵאל
  choice: യിശ്മായേലിനെ
  rationale: אֶת നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു; അതിനാൽ പേരിന് മലയാളത്തിലെ കർമവിഭക്തി ചേർത്തു.
- source_word: לְ/אַבְרָם
  choice: അബ്രാമിന്
  rationale: לְ സൂചിപ്പിക്കുന്ന ബന്ധം മലയാളത്തിൽ ‘അബ്രാമിന്’ എന്ന് സ്വാഭാവികമായി നൽകാം; ഇത് ‘അബ്രാമിനുവേണ്ടി’ എന്ന അർഥവും സന്ദർഭത്തിൽ അനുവദിക്കുന്നു.
