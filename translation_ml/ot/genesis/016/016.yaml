translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ കാലബന്ധവും പ്രായസൂത്രവും സ്വാഭാവിക മലയാളത്തിൽ പുനഃക്രമീകരിച്ചു; לְ എന്നതിലെ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
