source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാം സാറായിയോടു പറഞ്ഞു: “നോക്കൂ, നിന്റെ അടിമസ്ത്രീ നിന്റെ കൈയിലാണ്; നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നത് അവളോടു ചെയ്യുക.” സാറായി അവളെ പീഡിപ്പിച്ചു[a]; അവൾ സാറായിയിൽനിന്ന് ഓടിപ്പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവളോടു കഠിനമായി പെരുമാറി” / “അവളെ അപമാനിച്ചു.” എബ്രായക്രിയയ്ക്ക് പീഡിപ്പിക്കുക, അപമാനിക്കുക, കഠിനമായി പെരുമാറുക എന്നീ അർഥങ്ങളുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: അബ്രാമിന്റെ വാക്കിലെ ശ്രദ്ധ ക്ഷണിക്കുന്ന സൂചനാഭാവം പഴഞ്ചൻ ശൈലിയില്ലാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁפְחָתֵךְ
  choice: നിന്റെ അടിമസ്ത്രീ
  rationale: ഹാഗാറിന്റെ ബന്ധിതമായ സാമൂഹികപദവിയും ഈ വാക്യത്തിലെ അധികാരബന്ധവും മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: בְּיָדֵךְ
  choice: നിന്റെ കൈയിലാണ്
  rationale: നിയന്ത്രണവും അധികാരവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַטּוֹב בְּעֵינַיִךְ
  choice: നിന്റെ കണ്ണിൽ നല്ലതെന്നു തോന്നുന്നത്
  rationale: ‘കണ്ണിൽ നല്ലത്’ എന്ന മൂലഭാഷാ രൂപകം സൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കുന്നു.
- source_word: וַתְּעַנֶּהָ
  choice: അവളെ പീഡിപ്പിച്ചു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന യഥാർഥ കഷ്ടപ്പെടുത്തലും അധിക്ഷേപകരമായ കഠിനപെരുമാറ്റവും ഗൗരവത്തോടെ നൽകുന്നു; കൃത്യമായ രീതി വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: וַתִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ഭീഷണിയോ കഠിനസാഹചര്യമോ മൂലം രക്ഷപ്പെടുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: מִפָּנֶיהָ
  choice: സാറായിയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ‘അവളുടെ മുമ്പിൽനിന്ന്/സാന്നിധ്യത്തിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുകയും സർവനാമത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഹാഗാറിന്റെ സാമൂഹികപദവിയുടെ വിവർത്തനം
  choice: അടിമസ്ത്രീ
  alternative: ദാസി / വേലക്കാരി
  rationale: ഗൃഹത്തിലെ അധികാരക്രമത്തിൽ ഹാഗാറിന്റെ ബന്ധിതാവസ്ഥ പ്രസക്തമായതിനാൽ അതിനെ സാധാരണ സേവനമായി മൃദൂകരിക്കാതിരിക്കുന്നു.
- issue: וַתְּעַנֶּהָ എന്നതിൽ സാറായിയുടെ പെരുമാറ്റത്തിന്റെ കാഠിന്യം
  choice: പീഡിപ്പിച്ചു
  alternative: അവളോടു കഠിനമായി പെരുമാറി / അവളെ ദുഷ്പെരുമാറ്റത്തിന് ഇരയാക്കി
  rationale: എബ്രായപദം പീഡനം, അപമാനിക്കൽ, കഠിനമായ പെരുമാറ്റം എന്നിവ സൂചിപ്പിക്കാം. ‘പീഡിപ്പിച്ചു’ അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ പീഡനത്തിന്റെ കൃത്യരൂപം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിന്റെ കൈയിലാണ്’, ‘നിന്റെ കണ്ണിൽ നല്ലത്’, ‘സന്നിധിയിൽനിന്ന്’ എന്നീ മൂലഭാഷാ പ്രയോഗങ്ങൾ അർഥവ്യക്തത നഷ്ടപ്പെടാതെ സൂക്ഷിച്ചിരിക്കുന്നു.
