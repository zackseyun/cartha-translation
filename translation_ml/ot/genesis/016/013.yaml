id: GEN.16.13
reference: Genesis 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: ml
  text: 'അതിനാൽ തന്നോടു സംസാരിച്ച യഹ്‌വേയ്ക്ക് അവൾ ഇങ്ങനെ പേരിട്ടു: “അങ്ങ് എന്നെ കാണുന്ന ദൈവമാണ്.”[a] കാരണം അവൾ പറഞ്ഞു: “ഞാൻ ഇവിടെയും എന്നെ കാണുന്നവനെ കണ്ടശേഷം കണ്ടുവോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അങ്ങ് കാണുന്ന ദൈവമാണ്” എന്നും “അങ്ങ് കാണലിന്റെ ദൈവമാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അവസാന വാക്യഭാഗത്തിന്റെ എബ്രായപാഠം ദുഷ്കരമാണ്. “എന്നെ കണ്ടവനെ ഇവിടെ കണ്ടിട്ടും ഞാൻ ജീവനോടിരിക്കുന്നുവോ?” എന്നായിരിക്കാം അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: യഹോവയ്ക്ക് അവൾ ഇങ്ങനെ പേരിട്ടു
  rationale: קרא שם എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ ഹാഗാർ ദൈവത്തിന് ഒരു വിശേഷണനാമം നൽകുകയാണ്, ദൈവനാമം ഉച്ചരിക്കുകയല്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: തന്നോടു സംസാരിച്ച
  rationale: ഹാഗാറിനോട് സംസാരിച്ചവനായി യഹോവയെ തിരിച്ചറിയിക്കുന്ന കർത്തൃവാചകത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַתָּה אֵל רֳאִי
  choice: അങ്ങ് എന്നെ കാണുന്ന ദൈവമാണ്
  rationale: רֳאִי എന്ന ദുഷ്കരരൂപത്തെ സന്ദർഭാനുസൃതമായി ‘എന്നെ കാണുന്ന’ എന്നു നൽകുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: הֲגַם הֲלֹם
  choice: ഇവിടെ യഥാർഥത്തിൽ ... വോ
  rationale: ചോദ്യകണങ്ങളിലെ ആശ്ചര്യവും ഊന്നലും മലയാള ചോദ്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: എന്നെ കാണുന്നവനെ കണ്ടശേഷവും ഞാൻ ... കണ്ടുവോ
  rationale: വാക്യഭാഗത്തിലെ ‘കാണുക’, ‘ശേഷം’ എന്നീ ഘടകങ്ങൾ പരമാവധി നിലനിർത്തി, ‘ജീവിച്ചിരുന്നുവോ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ ദുഷ്കരത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֵל רֳאִי എന്ന ദൈവവിശേഷണത്തിന്റെ അർഥം
  choice: എന്നെ കാണുന്ന ദൈവം
  alternative: കാണുന്ന ദൈവം / ദർശനത്തിന്റെ ദൈവം
  rationale: ഹാഗാറിനെ ദൈവം ശ്രദ്ധയോടെ കാണുന്നു എന്ന തൊട്ടുമുമ്പുള്ള സന്ദർഭവുമായി യോജിക്കുന്നു; മറ്റ് സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: അവസാനത്തെ ദുഷ്കരമായ എബ്രായവാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: കണ്ടശേഷവും ... കണ്ടുവോ?
  alternative: എന്നെ കണ്ടവനെ കണ്ടിട്ടും ഞാൻ ജീവനോടിരിക്കുന്നുവോ?
  rationale: മൂലത്തിലെ സംക്ഷിപ്തതയും ദൈവത്തെ കാണുന്നതിനെ ചുറ്റിയുള്ള സംഘർഷവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘ജീവനോടെ ശേഷിച്ചു’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്ക് മാറ്റുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ ദുഷ്കരത പൂർണമായി മിനുക്കിമാറ്റാതെ, ആവശ്യമായ വ്യാഖ്യാനഭേദങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
