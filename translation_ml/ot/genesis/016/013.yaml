  to: 'അതിനാൽ തന്നോടു സംസാരിച്ച യഹ്‌വേയ്ക്ക് അവൾ ഇങ്ങനെ പേരിട്ടു: “അങ്ങ് എന്നെ കാണുന്ന ദൈവമാണ്.”[a] കാരണം അവൾ പറഞ്ഞു: “ഞാൻ ഇവിടെയും എന്നെ കാണുന്നവനെ കണ്ടശേഷം കണ്ടുവോ?”[b]'
