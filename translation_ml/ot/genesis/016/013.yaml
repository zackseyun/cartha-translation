    rationale: നിലവിലെ ‘കണ്ടശേഷവും ... കണ്ടുവോ’ പ്രയോഗത്തിൽ രണ്ടാമത്തെ ‘കാണുക’യുടെ ബന്ധം ഗ്രഹിക്കാനാകുന്നില്ല. എബ്രായത്തിലെ ദുഷ്കരത സംരക്ഷിക്കണം, പക്ഷേ വാക്യം മലയാള വ്യാകരണത്തിൽ പ്രവർത്തിക്കണം.
