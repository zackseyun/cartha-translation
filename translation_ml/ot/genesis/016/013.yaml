    issue: ദൈവനാമം ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
    rationale: നൽകിയിരിക്കുന്ന English POB നയവും ഉറവിട-തീരുമാനവും יְהוָהയെ ‘Yahweh’ ആയി നൽകുന്നു. മലയാളത്തിൽ ‘യഹ്‌വേ’ അതിനൊത്ത ലിപ്യന്തരണമാണ്; ‘യഹോവ’ സാധാരണയായി ‘Jehovah’യെ പ്രതിനിധീകരിക്കുന്നു.
  - severity: medium
