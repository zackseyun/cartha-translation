translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തിയിരിക്കുന്നു; സന്ദർഭത്തിൽ നിന്നുള്ള അനാവശ്യ വിശദീകരണങ്ങളോ പ്രത്യേക മതവിഭാഗപരമായ പദപ്രയോഗങ്ങളോ ചേർത്തിട്ടില്ല.
