id: GEN.44.1
reference: Genesis 44:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ വീടിന്റെ ചുമതലക്കാരനോട് ഇങ്ങനെ കല്പിച്ചു: “ആ പുരുഷന്മാർക്കു ചുമക്കാവുന്നത്ര ആഹാരം അവരുടെ ചാക്കുകളിൽ നിറയ്ക്കുക; ഓരോരുത്തന്റെയും വെള്ളി അവനവന്റെ ചാക്കിന്റെ വായിൽ[a] വെക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപദപ്രയോഗം: ‘ചാക്കിന്റെ വായിൽ’; അതായത്, ചാക്കിന്റെ തുറക്കുന്ന ഭാഗത്ത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: പിന്നെ അവൻ … കല്പിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ക്രമാനുഗതതയും ‘കല്പിച്ചു’ ആജ്ഞയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: തന്റെ വീടിന്റെ ചുമതലക്കാരൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ വീടിന്മേൽ ഉണ്ടായിരുന്നവൻ’; യോസേഫിന്റെ ഗൃഹകാര്യങ്ങൾ കൈകാര്യം ചെയ്ത ഉദ്യോഗസ്ഥനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു, പ്രത്യേക പദവിപ്പേര് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מַלֵּא
  choice: നിറയ്ക്കുക
  rationale: מלא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: אַמְתְּחֹת
  choice: ചാക്കുകൾ
  rationale: യാത്രയിൽ ധാന്യമോ ഭക്ഷ്യസാധനങ്ങളോ കൊണ്ടുപോകുന്ന വലിയ സഞ്ചികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ചാക്കുകൾ’ പുരാതന ഗതാഗതസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട ബഹുവചനത്തെ നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ നേരിട്ട് പറയാത്ത ‘സഹോദരന്മാർ’ എന്ന സന്ദർഭപരമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: אֹכֶל
  choice: ആഹാരം
  rationale: אֹכֶל പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു; വിപുലമായ സന്ദർഭത്തിൽ ധാന്യമാണെങ്കിലും ഈ വാക്യത്തിലെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: ചുമക്കാവുന്നത്ര
  rationale: കഴിവിനെയും ചുമക്കുന്നതിനെയും ചേർത്തുള്ള എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְשִׂים
  choice: വെക്കുക
  rationale: שים എന്ന സാധാരണ ക്രിയയുടെ ആജ്ഞാർഥത്തിന് പ്രസക്തമായ സ്വാഭാവിക മലയാളം.
- source_word: כֶּסֶף אִישׁ
  choice: ഓരോരുത്തന്റെയും വെള്ളി
  rationale: איש എന്ന പദത്തിന്റെ വിതരണാർഥവും כסף എന്നതിന്റെ ‘വെള്ളി’ എന്ന പദാർഥവും നിലനിർത്തുന്നു; പണം എന്നു വ്യാഖ്യാനിച്ച് മുഖ്യപാഠത്തിൽ അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: അവനവന്റെ ചാക്കിന്റെ വായിൽ
  rationale: ‘ചാക്കിന്റെ വായ്’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതും സ്വാഭാവികവുമാണ്; അതിന്റെ ഉദ്ദേശ്യമായ ‘തുറക്കുന്ന ഭാഗം’ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
