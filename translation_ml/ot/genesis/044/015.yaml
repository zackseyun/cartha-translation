base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: ml
  text: 'യോസേഫ് അവരോടു പറഞ്ഞു: “നിങ്ങൾ ചെയ്ത ഈ പ്രവൃത്തി എന്താണ്? എന്നെപ്പോലെയുള്ള ഒരാൾ തീർച്ചയായും ശകുനം നോക്കുമെന്ന് നിങ്ങൾ അറിഞ്ഞില്ലേ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തീർച്ചയായും ശകുനം നോക്കുന്നവനാണെന്ന്,” “ശകുനം നോക്കി തീർച്ചയായും കണ്ടെത്തുമെന്ന്,” അല്ലെങ്കിൽ “ഇത്തരം കാര്യങ്ങൾ തീർച്ചയായും കണ്ടെത്താനാകുമെന്ന്.” എബ്രായത്തിൽ ‘ശകുനം നോക്കുക’ എന്ന ധാതുവിന്റെ ആവർത്തനത്തിലൂടെ ഊന്നൽ പ്രകടമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: നിങ്ങൾ ചെയ്ത ഈ പ്രവൃത്തി എന്താണ്?
  rationale: מַעֲשֶׂה എന്നത് പ്രവൃത്തി/ചെയ്തി എന്ന അർഥം വഹിക്കുന്നു. കുറ്റപ്പെടുത്തലിന്റെ ധാർമിക ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ‘പ്രവൃത്തി’ തിരഞ്ഞെടുത്തു.
- source_word: עֲשִׂיתֶם
  choice: നിങ്ങൾ ചെയ്ത
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെയും ഇപ്പോഴത്തെ കുറ്റാരോപണത്തോടുള്ള അതിന്റെ പ്രസക്തിയെയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: നിങ്ങൾ അറിഞ്ഞില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: തീർച്ചയായും ശകുനം നോക്കും
  rationale: ഒരേ ധാതുവിലുള്ള infinitive absolute-ഉം finite verb-ഉം ചേർന്നുള്ള ഊന്നൽ ‘തീർച്ചയായും’ കൊണ്ട് പ്രകടമാക്കുന്നു. נחש എന്ന ധാതുവിന്റെ ശകുനവിദ്യ/ദിവ്യജ്ഞാനം തേടൽ എന്ന അർഥം ‘ശകുനം നോക്കുക’ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യോസേഫ് യഥാർഥത്തിൽ അത് ചെയ്തോ എന്നത് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: എന്നെപ്പോലെയുള്ള ഒരാൾ
  rationale: എബ്രായത്തിലെ ഏകവചന പൊതുപ്രയോഗം കൃത്യമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
theological_decisions:
- issue: യോസേഫിന്റെ ശകുനവിദ്യയെക്കുറിച്ചുള്ള വാക്കുകൾ യഥാർഥ അവകാശവാദമായോ വെറും അഭിനയമായോ വ്യാഖ്യാനിക്കണമോ
  choice: 'അദ്ദേഹത്തിന്റെ പ്രസ്താവന നേരിട്ട് വിവർത്തനം ചെയ്യുക: ‘എന്നെപ്പോലെയുള്ള ഒരാൾ തീർച്ചയായും ശകുനം നോക്കും’'
  alternative: ‘എന്നെപ്പോലെയുള്ള ഒരാൾക്ക് ഇത്തരം കാര്യങ്ങൾ തീർച്ചയായും കണ്ടെത്താനാകും’
  rationale: എബ്രായം נחש എന്ന ശകുനവിദ്യയെ സൂചിപ്പിക്കുന്ന ധാതു ഊന്നിപ്പറയുന്നു. യോസേഫ് യഥാർഥത്തിൽ ശകുനവിദ്യ അഭ്യസിച്ചിരുന്നോ, ഈജിപ്തുകാരന്റെ വേഷത്തിൽ തന്ത്രപരമായി സംസാരിച്ചോ എന്നത് പാഠം ഇവിടെ തീർപ്പാക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. കുറ്റപ്പെടുത്തലിന്റെ ശക്തിയും ശകുനവിദ്യയെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ഉദ്ദേശപൂർവമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചിരിക്കുന്നു.
