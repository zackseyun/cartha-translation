id: GEN.44.2
reference: Genesis 44:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: ml
  text: “എന്റെ പാനപാത്രം, ആ വെള്ളിപ്പാനപാത്രം, ഇളയവന്റെ ചാക്കിന്റെ വായിൽ അവന്റെ ധാന്യത്തിനുള്ള വെള്ളിയോടൊപ്പം വെക്കുക.” യോസേഫ് പറഞ്ഞ വാക്കുപോലെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: എന്റെ പാനപാത്രം, ആ വെള്ളിപ്പാനപാത്രം
  rationale: גְּבִיעַ എന്നത് പാനപാത്രം/കോപ്പ എന്നർഥം നൽകുന്നു. ആവർത്തനത്തിലൂടെ വരുന്ന ഊന്നൽ നിലനിർത്താൻ സമാനാധികരണ ഘടന സംരക്ഷിച്ചു.
- source_word: תָּשִׂים
  choice: വെക്കുക
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בְּפִי אַמְתַּחַת
  choice: ചാക്കിന്റെ വായിൽ
  rationale: പാത്രത്തിന്റെയോ ചാക്കിന്റെയോ തുറവിനെ ‘വായ്’ എന്നു വിളിക്കുന്ന എബ്രായ ദൃശ്യഭാഷ മലയാളത്തിലും സ്വാഭാവികമായതിനാൽ അതേപടി നിലനിർത്തി.
- source_word: הַקָּטֹן
  choice: ഇളയവന്റെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെറിയവൻ/ഇളയവൻ’; സന്ദർഭത്തിൽ സഹോദരന്മാരിൽ ഇളയവനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘സഹോദരൻ’ ചേർത്തില്ല.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: അവന്റെ ധാന്യത്തിനുള്ള വെള്ളി
  rationale: כֶּסֶף എന്ന ‘വെള്ളി’യും ക്ഷാമകഥാസന്ദർഭത്തിൽ שֶׁבֶר നൽകുന്ന വാങ്ങിയ ധാന്യം എന്ന ആശയവും സംരക്ഷിക്കുന്നു; ഇത് ധാന്യത്തിനു നൽകിയ വെള്ളിയാണെന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: യോസേഫ് പറഞ്ഞ വാക്കുപോലെ അവൻ ചെയ്തു
  rationale: എബ്രായത്തിലെ ‘യോസേഫിന്റെ വാക്കുപ്രകാരം, അവൻ പറഞ്ഞത്’ എന്ന ആശയം അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കല്പന’ എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി. എബ്രായത്തിലെ പാനപാത്രത്തിന്റെ ആവർത്തന ഊന്നലും ‘ചാക്കിന്റെ വായ്’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി. പ്രത്യേകമായി വിശദീകരിക്കേണ്ട പാഠഭേദമോ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ നൽകിയിട്ടില്ല.
