id: GEN.44.22
reference: Genesis 44:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞങ്ങൾ എന്റെ യജമാനനോടു പറഞ്ഞു: “ബാലന് തന്റെ അപ്പനെ വിട്ടുപോകാൻ കഴിയില്ല; അവൻ അപ്പനെ വിട്ടുപോയാൽ, അപ്പൻ മരിച്ചുപോകും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ തന്റെ അപ്പനെ വിട്ടുപോകുന്നു; അവൻ മരിക്കുന്നു.” “മരിക്കുന്നു” എന്ന ക്രിയയുടെ കർത്താവിനെ എബ്രായപാഠം പ്രത്യേകം പറയുന്നില്ല; സന്ദർഭം അപ്പനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: അപ്പോൾ ഞങ്ങൾ പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം കഥയിലെ തുടർച്ചയായ സംഭവക്രമം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ പ്രവാഹം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל אֲדֹנִי
  choice: എന്റെ യജമാനനോട്
  rationale: യോസേഫിനോടുള്ള യെഹൂദയുടെ ആദരപൂർവമായ അഭിസംബോധനയാണ്; ‘യജമാനൻ’ രാജസഭാസന്ദർഭത്തിലെ വിനയഭാവം നിലനിർത്തുന്നു.
- source_word: לֹא יוּכַל
  choice: കഴിയില്ല
  rationale: יכל കഴിവിനെയോ പ്രാപ്തിയെയോ സൂചിപ്പിക്കുന്നു; ആ അശക്തി ലളിതമായ ആധുനിക മലയാളത്തിൽ ‘കഴിയില്ല’ എന്ന് വ്യക്തമായി വരുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: נער എന്നത് ബാലനെയോ യുവാവിനെയോ സൂചിപ്പിക്കാം; പിതാവിനോടുള്ള ആശ്രിതബന്ധം മുൻനിർത്തുന്ന ഈ സന്ദർഭത്തിൽ ‘ബാലൻ’ യോജിക്കുന്നു.
- source_word: לַעֲזֹב
  choice: വിട്ടുപോകാൻ
  rationale: עזב ഇവിടെ ധാർമികമായി ഉപേക്ഷിക്കുക എന്നതിലുപരി ഒരാളെ വിട്ട് അകന്നുപോകുക എന്ന അർഥത്തിലാണ്.
- source_word: אָבִיו
  choice: തന്റെ അപ്പൻ / അപ്പൻ
  rationale: കുടുംബസംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അപ്പൻ’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
- source_word: וְעָזַב
  choice: വിട്ടുപോയാൽ
  rationale: ഔപചാരികമായി സംയോജകത്തോടുകൂടിയ പൂർണ്ണക്രിയയായിരുന്നാലും സന്ദർഭത്തിൽ ഇത് വ്യവസ്ഥ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ആൽ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וָמֵת
  choice: അപ്പൻ മരിച്ചുപോകും
  rationale: ക്രിയയുടെ കർത്താവ് എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. വിശാലസന്ദർഭം പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനാൽ പ്രധാനപാഠത്തിൽ ‘അപ്പൻ’ വ്യക്തമാക്കി; മൂലത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: וָמֵת എന്ന ക്രിയയുടെ പരോക്ഷകർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ ‘അപ്പൻ മരിച്ചുപോകും’
  alternative: ‘അവൻ മരിച്ചുപോകും’
  rationale: ഉല്പത്തി 44-ലെ പ്രസംഗസന്ദർഭം ബെന്യാമീൻ പിതാവിനെ വിട്ടുപോയാൽ പിതാവാണ് ദുഃഖത്താൽ മരിക്കുക എന്നു സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും എബ്രായത്തിലെ സർവനാമരഹിത ക്രിയ മാത്രം നോക്കുമ്പോൾ കർത്താവ് വ്യക്തമായി നാമകരണം ചെയ്തിട്ടില്ല; അതിനാൽ ആ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജസഭയിലെ ആദരഭാവത്തിനായി ‘യജമാനൻ’ എന്നും കുടുംബബന്ധത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അപ്പൻ’ എന്നും ഉപയോഗിച്ചു. എബ്രായത്തിലെ കർത്തൃസന്ദിഗ്ധത പ്രധാനപാഠത്തിൽ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
