source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר עַבְדְּ/ךָ֥ אָבִ֖/י אֵלֵ֑י/נוּ אַתֶּ֣ם יְדַעְתֶּ֔ם כִּ֥י שְׁנַ֖יִם יָֽלְדָה לִּ֥/י אִשְׁתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: ml
  text: 'അപ്പോൾ അങ്ങയുടെ ദാസനായ എന്റെ അപ്പൻ ഞങ്ങളോടു പറഞ്ഞു: ‘എന്റെ ഭാര്യ എനിക്ക് രണ്ടുപേരെ പ്രസവിച്ചുവെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘എന്റെ ഭാര്യ എനിക്ക് രണ്ടുപേരെ പ്രസവിച്ചു’ എന്നാണ്; ‘പുത്രന്മാർ’ എന്നത് സന്ദർഭത്തിൽനിന്നു മനസ്സിലാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: עַבְדְּךָ אָבִי
  choice: അങ്ങയുടെ ദാസനായ എന്റെ അപ്പൻ
  rationale: യൂദാ യോസേഫിനോടു പ്രകടിപ്പിക്കുന്ന ആദരപൂർവമായ കീഴ്വഴക്കവും സംസാരവിഷയം തന്റെ അപ്പനാണെന്ന തിരിച്ചറിയലും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: אֵלֵינוּ
  choice: ഞങ്ങളോടു
  rationale: ഹീബ്രായയിലെ സാധാരണ ദിശാസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: പ്രകടമായ ബഹുവചന സർവനാമം നൽകുന്ന ഊന്നൽ ‘അല്ലോ’ വഴി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുകയും ഉദ്ധരിച്ച സംഭാഷണത്തിൽ ഇപ്പോഴും പ്രസക്തമായ അറിവിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: അറിയപ്പെടുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ‘എന്ന്’ യോജിക്കുന്നു.
- source_word: שְׁנַיִם
  choice: രണ്ടുപേരെ
  rationale: ഹീബ്രായം ‘രണ്ട്’ എന്നു മാത്രമാണ് പറയുന്നത്. വ്യക്തികളെ എണ്ണുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായ ‘രണ്ടുപേർ’ ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ സന്ദർഭാർത്ഥം നൽകുന്നു.
- source_word: יָלְדָה לִּי
  choice: എനിക്ക് ... പ്രസവിച്ചു
  rationale: പരോക്ഷ കർമസൂചകത്തോടുകൂടിയ ילד എന്ന ക്രിയയുടെ അർത്ഥം സ്വാഭാവികവും വിശ്വസ്തവുമായി നൽകുന്നു.
- source_word: אִשְׁתִּי
  choice: എന്റെ ഭാര്യ
  rationale: ഈ സന്ദർഭത്തിൽ אִשָּׁה എന്ന പദം ഒന്നാംപുരുഷ പ്രത്യയത്തോടെ ‘എന്റെ ഭാര്യ’ എന്നാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. യോസേഫിനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ ‘രണ്ട്’ എന്ന രൂപത്തോട് അടുത്തുനിൽക്കാൻ മുഖ്യപാഠത്തിൽ ‘രണ്ടുപേരെ’ നിലനിർത്തി; സന്ദർഭത്തിൽ പുത്രന്മാരാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
