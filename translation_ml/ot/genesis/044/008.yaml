  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സംസാരയോഗ്യവുമായ ശൈലി. ഉദ്യോഗസ്ഥനോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘ചാക്കുകളുടെ വായ്ക്കൽ’ എന്ന രൂപകം മലയാളത്തിൽ വ്യക്തമായതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
