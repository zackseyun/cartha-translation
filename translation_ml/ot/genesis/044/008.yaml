source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: ml
  text: നോക്കൂ, ഞങ്ങളുടെ ചാക്കുകളുടെ വായിൽ[a] ഞങ്ങൾ കണ്ടെത്തിയ വെള്ളി കനാൻദേശത്തുനിന്ന് ഞങ്ങൾ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവന്നല്ലോ. പിന്നെ അങ്ങയുടെ യജമാനന്റെ വീട്ടിൽനിന്ന് വെള്ളിയോ സ്വർണമോ ഞങ്ങൾ എങ്ങനെ മോഷ്ടിക്കാനാകും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഞങ്ങളുടെ ചാക്കുകളുടെ വായിൽ’; ഇത് ചാക്കിന്റെ തുറവിനെയോ മുകൾഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: നോക്കൂ
  rationale: തുടർന്നുവരുന്ന വാദത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽസൂചകമാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: כֶּסֶף
  choice: വെള്ളി
  rationale: സന്ദർഭത്തിൽ പണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും എബ്രായത്തിലെ മൂർത്തമായ പദം നിലനിർത്തുന്നു; വാക്യാവസാനത്തിലെ സ്വർണവുമായുള്ള ജോടിയും സംരക്ഷിക്കുന്നു.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: ഞങ്ങളുടെ ചാക്കുകളുടെ വായ്ക്കൽ
  rationale: പാത്രത്തിന്റെ തുറന്ന ഭാഗത്തെ ‘വായ്’ എന്നു വിളിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും സ്വാഭാവികമായി ഗ്രഹിക്കാം; ചാക്കുകൾ എന്നത് ധാന്യയാത്രയുടെ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: ഞങ്ങൾ അങ്ങയുടെ അടുക്കൽ തിരികെ കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘മടക്കിക്കൊണ്ടുവരുക’ എന്ന കാരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുനിന്ന്
  rationale: ഭൂമിശാസ്ത്രനാമത്തിന്റെ സാധാരണ മലയാളരൂപം ഉപയോഗിച്ച് ഉറവിടത്തിലെ ‘ദേശത്തുനിന്ന്’ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְאֵיךְ נִגְנֹב
  choice: പിന്നെ ... ഞങ്ങൾ എങ്ങനെ മോഷ്ടിക്കും?
  rationale: മുൻവാക്യത്തെ അടിസ്ഥാനമാക്കിയുള്ള അസാധ്യതാവാദവും വാചാടോപചോദ്യത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: അങ്ങയുടെ യജമാനന്റെ വീട്ടിൽനിന്ന്
  rationale: ഇവിടെ אדון ദൈവിക സംബോധനയല്ല, കാര്യസ്ഥന്റെ യജമാനനായ യോസേഫിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്’ എന്ന ഉറവിടരൂപവും നിലനിർത്തുന്നു.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: വെള്ളിയോ സ്വർണമോ
  rationale: എബ്രായത്തിലെ മൂർത്തമായ പദജോടിയും ആദ്യഭാഗത്തെ ‘വെള്ളി’യുമായുള്ള ആവർത്തനവും സംരക്ഷിക്കുന്നു.
