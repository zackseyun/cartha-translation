id: GEN.44.34
reference: Genesis 44:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: ml
  text: എന്നോടൊപ്പം ബാലൻ ഇല്ലെങ്കിൽ, ഞാൻ എങ്ങനെ എന്റെ അപ്പന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെല്ലും? അല്ലെങ്കിൽ, എന്റെ അപ്പന് സംഭവിക്കുന്ന ദുരന്തം ഞാൻ കാണേണ്ടിവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה אֶל אָבִי
  choice: എന്റെ അപ്പന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെല്ലും
  rationale: ‘കയറിച്ചെല്ലുക’ എന്ന മൂലരൂപം നിലനിർത്തുന്നത് മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമാണ്; സന്ദർഭത്തിലെ ഈജിപ്തിൽനിന്നുള്ള മടക്കയാത്ര സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: ബെന്യാമീനെ സൂചിപ്പിക്കുന്ന ‘യുവാവ്/ബാലൻ’ എന്ന പദത്തിന് സന്ദർഭോചിതവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: בָרָע אֲשֶׁר יִמְצָא אֶת אָבִי
  choice: എന്റെ അപ്പനു വന്നുഭവിക്കുന്ന ദുരന്തം
  rationale: רע എന്നത് ഇവിടെ ധാർമ്മിക തിന്മയല്ല, അപ്പനെ ബാധിക്കുന്ന അനർഥം/ദുരന്തമാണ്; מצא എന്നതിലെ ‘സംഭവിക്കുക, ബാധിക്കുക’ എന്ന ആശയം ‘വന്നുഭവിക്കുക’ വഴി നൽകുന്നു.
theological_decisions:
- issue: פֶּן എന്ന നിരോധക/ആശങ്കാസൂചക ഘടകത്തിന്റെ അർത്ഥം
  choice: ഞാൻ കാണേണ്ടിവരരുതല്ലോ
  alternative: അല്ലെങ്കിൽ ... ഞാൻ കാണേണ്ടിവരും
  rationale: ഹീബ്രു വാക്യം യെഹൂദയുടെ ഭയവും അത്തരം കാഴ്ച ഒഴിവാക്കാനുള്ള ആഗ്രഹവും പ്രകടിപ്പിക്കുന്നു. ഫലത്തെ ഉറപ്പുള്ള പ്രവചനമായി ശക്തിപ്പെടുത്താതെ ആ വികാരപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വാചിക സ്വാഭാവികതയും ചേർന്ന മലയാളം. യെഹൂദയുടെ അപേക്ഷയിലെ വികാരതീവ്രത ചോദ്യവും ആശങ്കാഭാവമുള്ള അവസാനവാക്യവും വഴി സംരക്ഷിച്ചു.
