- from: 'അവർ അവനോടു പറഞ്ഞു: “യജമാനൻ ഇങ്ങനെയുള്ള വാക്കുകൾ പറയുന്നത് എന്തിന്? അങ്ങനെയൊരു കാര്യം ചെയ്യുന്നത് അങ്ങയുടെ ദാസന്മാർക്ക് ചിന്തിക്കാനുപോലും കഴിയാത്തതാണ്.”'
  to: 'അവർ അവനോടു പറഞ്ഞു: “യജമാനൻ ഇങ്ങനെയുള്ള വാക്കുകൾ പറയുന്നത് എന്തിന്? അങ്ങയുടെ ദാസന്മാർ അങ്ങനെയൊരു കാര്യം ചെയ്യുന്നത് ഒരിക്കലും ഉണ്ടാകരുതേ.”'
  rationale: The revision retains the draft’s natural modern Malayalam and respectful register while rendering the emphatic repudiation חָלִילָה more directly. It removes the added notion of being unable even to think of the act and preserves the source focus on the servants’ not doing it.
