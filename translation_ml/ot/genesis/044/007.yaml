source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו לָ֚/מָּה יְדַבֵּ֣ר אֲדֹנִ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה חָלִ֨ילָ/ה֙ לַ/עֲבָדֶ֔י/ךָ מֵ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “യജമാനൻ ഇങ്ങനെയുള്ള വാക്കുകൾ പറയുന്നത് എന്തിന്? അങ്ങയുടെ ദാസന്മാർ അങ്ങനെയൊരു കാര്യം ചെയ്യുന്നത് ഒരിക്കലും ഉണ്ടാകരുതേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും യോസേഫിന്റെ കാര്യസ്ഥനോടുള്ള നേരിട്ടുള്ള മറുപടിയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക അഭിസംബോധനയല്ല, മേലധികാരിയോടുള്ള ആദരപൂർവമായ മാനുഷിക അഭിസംബോധനയാണ്. മലയാളത്തിൽ മൂന്നാംപുരുഷ ആദരപ്രയോഗം സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ഇങ്ങനെയുള്ള വാക്കുകൾ
  rationale: ‘ഇത്തരം/ഇങ്ങനെയുള്ള വാക്കുകൾ’ എന്ന അർഥം നിലനിർത്തുകയും ആരോപണം വാക്കുകളായി അവതരിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർക്ക് ചിന്തിക്കാനുപോലും കഴിയാത്തതാണ്
  rationale: ശക്തമായ നിഷേധവും അത്തരമൊരു പ്രവൃത്തി തങ്ങളിൽനിന്ന് അസംഭവ്യമാണെന്ന ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ദൈവം വിലക്കട്ടെ’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത ദൈവപരാമർശം ഒഴിവാക്കുന്നു.
- source_word: כַּדָּבָר הַזֶּה
  choice: അങ്ങനെയൊരു കാര്യം
  rationale: മുമ്പ് ഉന്നയിച്ച ആരോപിത പ്രവൃത്തിയിലേക്കുള്ള സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കാര്യസ്ഥനോടുള്ള ആദരം ‘യജമാനൻ/അങ്ങയുടെ’ എന്ന പ്രയോഗങ്ങളിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു; അതേസമയം അത്യന്തം പുരാതനമോ സഭാഭാഷാപരമോ ആയ ശൈലി ഒഴിവാക്കി.
