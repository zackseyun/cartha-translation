  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: ml
  text: അപ്പോൾ അവർ തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി[a]. ഓരോരുത്തനും തന്റെ കഴുതപ്പുറത്ത് ചുമടു കയറ്റി; അവർ പട്ടണത്തിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ പുറംവസ്ത്രങ്ങൾ.’ എബ്രായപദം പൊതുവായി വസ്ത്രങ്ങളെയും പ്രത്യേകിച്ച് പുറംവസ്ത്രങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: കീറി
  rationale: קרע എന്ന ക്രിയ വസ്ത്രം കീറുക എന്ന മൂർത്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് ദുഃഖം, ഞെട്ടൽ, അല്ലെങ്കിൽ കടുത്ത മനോവ്യഥ പ്രകടിപ്പിക്കുന്ന പതിവായ പ്രവൃത്തിയാണ്.
- source_word: שִׂמְלֹתָם
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ
  rationale: שִׂמְלָה പൊതുവായി വസ്ത്രത്തെയോ പുറംവസ്ത്രത്തെയോ സൂചിപ്പിക്കാം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യാപകവുമായ പദമാണ് ‘വസ്ത്രങ്ങൾ’.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: ഓരോരുത്തനും തന്റെ കഴുതപ്പുറത്ത് ചുമടു കയറ്റി
  rationale: עמס എന്നത് ഭാരം അഥവാ ചുമട് കയറ്റുക എന്നാണ്. ഏകവചനമായ אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ വരുന്നതിനാൽ ‘ഓരോരുത്തനും’ എന്ന് പരിഭാഷപ്പെടുത്തി; എന്താണ് കയറ്റിയതെന്ന് ക്രിയയിൽ അന്തർലീനമായതിനാൽ ‘ചുമടു’ ചേർക്കുന്നത് മലയാളത്തിൽ പ്രവൃത്തി വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: ഈ കൂട്ടത്തിലെ ഓരോ പുരുഷനെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഓരോരുത്തനും’ സ്വാഭാവികമാണ്; സന്ദർഭത്തിൽ എല്ലാവരും പുരുഷന്മാരാണെന്നത് ഇതിനകം വ്യക്തമായതിനാൽ ‘ഓരോ പുരുഷനും’ എന്നു ഭാരപ്പെടുത്തേണ്ടതില്ല.
- source_word: חֲמֹרוֹ
  choice: തന്റെ കഴുതപ്പുറത്ത്
  rationale: חֲמוֹר എന്നത് സാധാരണയായി കഴുതയാണ്. עַל എന്ന ബന്ധപദത്തോടൊപ്പം ചുമട് മൃഗത്തിന്റെ മേൽ കയറ്റുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കഴുതപ്പുറത്ത്’ എന്നു പറയുന്നു.
- source_word: וַיָּשֻׁבוּ
  choice: അവർ ... മടങ്ങി
  rationale: שׁוּב എന്നത് മടങ്ങുക അഥവാ തിരിച്ചുപോകുക എന്നാണ്. ‘മടങ്ങി’ ആഖ്യാനശൈലിക്ക് യോജിച്ച, സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: הָעִירָה
  choice: പട്ടണത്തിലേക്കു
  rationale: ദിശാസൂചകമായ ה־ പട്ടണത്തിലേക്കുള്ള ചലനം രേഖപ്പെടുത്തുന്നു. עִיר ഈ സന്ദർഭത്തിൽ ‘പട്ടണം’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
