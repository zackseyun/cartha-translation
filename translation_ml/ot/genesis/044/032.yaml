  naturalness: The draft is generally clear modern Malayalam. “എന്തെന്നാൽ” provides a natural discourse link here, while “ആ ബാലനുവേണ്ടി ... ഉത്തരവാദിത്വം ഏറ്റെടുത്തിരുന്നു” is idiomatic and avoids making the main text unnecessarily technical.
