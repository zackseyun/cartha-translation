  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അങ്ങയുടെ ദാസനായ ഞാൻ ആ ബാലനുവേണ്ടി എന്റെ അപ്പനോടു ഉത്തരവാദിത്വം ഏറ്റെടുത്തിരുന്നു[a]. ഞാൻ പറഞ്ഞു: ‘അവനെ അപ്പന്റെ അടുക്കൽ തിരികെ കൊണ്ടുവന്നില്ലെങ്കിൽ, ജീവിതകാലം മുഴുവൻ ഞാൻ അപ്പനോടു കുറ്റക്കാരനായിരിക്കും[b].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ ബാലനുവേണ്ടി ഞാൻ ജാമ്യം നിന്നിരുന്നു” അല്ലെങ്കിൽ “ആ ബാലനുവേണ്ടി ഞാൻ എന്നെത്തന്നെ പണയപ്പെടുത്തിയിരുന്നു.” എബ്രായക്രിയ ജാമ്യക്കാരനായി ഉത്തരവാദിത്വം ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ജീവിതകാലം മുഴുവൻ ഞാൻ എന്റെ അപ്പനോടു പാപം ചെയ്യും” അഥവാ “പാപം ചെയ്തതായി വരും.” ഇവിടെ ജീവിതകാലം മുഴുവൻ നിലനിൽക്കുന്ന കുറ്റബാധ്യതയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഈ വാക്യം മുൻപുള്ള അപേക്ഷയുടെ വിശദീകരണമായി വരുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പ്രഭാഷണത്തിൽ കാരണബന്ധം വാക്യക്രമത്തിലൂടെ വ്യക്തമായതിനാൽ ‘എന്തെന്നാൽ’ ചേർക്കാതെ വിടുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: മേലധികാരിയോടുള്ള യെഹൂദയുടെ വിനയപൂർവമായ സ്വയംപരാമർശം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘അടിമ’ എന്നു പറയുന്നത് ഉദ്ദേശിച്ചതിലധികം ഉടമസ്ഥാവകാശഭാവം നൽകാം.
- source_word: עָרַב אֶת־הַנַּעַר
  choice: ആ ബാലന്റെ ഉത്തരവാദിത്വം ... ഏറ്റെടുത്തിരുന്നു
  rationale: עָרַב എന്ന ക്രിയയിലെ ജാമ്യക്കാരനായി ഉത്തരവാദിത്വം ഏറ്റെടുക്കുന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הַנַּעַר
  choice: ആ ബാലൻ
  rationale: ബെന്യാമീനെ കുടുംബബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്ന പദം. പ്രായം കൃത്യമായി നിർണയിക്കാതെ എബ്രായപ്രയോഗത്തിന്റെ കാഴ്ചപ്പാട് നിലനിർത്തുന്നു.
- source_word: מֵעִם אָבִי
  choice: എന്റെ അപ്പനോടു
  rationale: עָרַב എന്ന ക്രിയയോടൊപ്പം, യെഹൂദ ആരോടാണ് ഉറപ്പുനൽകിയതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഉപസർഗം അക്ഷരാർഥത്തിൽ പകർത്താതെ ബന്ധത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: അവനെ അപ്പന്റെ അടുക്കൽ തിരികെ കൊണ്ടുവന്നില്ലെങ്കിൽ
  rationale: നിബന്ധന വ്യക്തമായി നൽകുന്നു. ഉദ്ധരണിക്കുള്ളിലെ אֵלֶיךָ യാക്കോബിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അപ്പന്റെ അടുക്കൽ’ എന്നു വ്യക്തമാക്കി; ‘തിരികെ’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന മടക്കിക്കൊണ്ടുവരൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְחָטָאתִי לְאָבִי
  choice: ഞാൻ അപ്പനോടു കുറ്റക്കാരനായിരിക്കും
  rationale: ‘ഞാൻ പാപം ചെയ്തിരിക്കും’ എന്ന അക്ഷരാർഥത്തെയും ഈ ഉത്തരവാദിത്വസന്ദർഭത്തിലെ സ്ഥിരമായ കുറ്റബാധ്യതയെയും തമ്മിൽ ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; പാദക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
- source_word: כָּל־הַיָּמִים
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: ‘എല്ലാ ദിവസങ്ങളും’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ ആയുഷ്കാലം നീളുന്ന ബാധ്യത എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: וְחָטָאתִי എന്നതിലെ പാപം/കുറ്റബാധ്യതയുടെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കുറ്റക്കാരനായിരിക്കും’
  alternative: ‘പാപം ചെയ്തവനായിരിക്കും’
  rationale: ഇവിടെ പിതാവിനോടു നൽകിയ ഉറപ്പ് ലംഘിച്ചതിന്റെ ഉത്തരവാദിത്വമാണ് മുൻനിരയിൽ. എങ്കിലും ക്രിയയുടെ നൈതികമായ ‘പാപം ചെയ്യുക’ എന്ന ശക്തി നഷ്ടപ്പെടാതിരിക്കാൻ അത് പാദക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അങ്ങനെ വാചകത്തിലെ നൈതിക സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യോസേഫിനോടുള്ള രാജസഭാസദൃശമായ വിനയഭാവത്തിന് ‘അങ്ങയുടെ ദാസനായ ഞാൻ’ എന്നും, യാക്കോബുമായുള്ള കുടുംബബന്ധത്തിന് ‘അപ്പൻ’ എന്നും ഉപയോഗിച്ചു. നിയമസാങ്കേതികത മാത്രം തോന്നിക്കുന്ന ‘ജാമ്യം’ പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി അർഥം നേരിട്ട് വ്യക്തമാക്കി; അത് പാദക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
