source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָֽ/אֶחָד֙ מֵֽ/אִתִּ֔/י וָ/אֹמַ֕ר אַ֖ךְ טָרֹ֣ף טֹרָ֑ף וְ/לֹ֥א רְאִיתִ֖י/ו עַד הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: ml
  text: ഒരുവൻ എന്നെ വിട്ടുപോയി; ‘അവൻ തീർച്ചയായും കീറിപ്പറിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു ഞാൻ പറഞ്ഞു. ഇന്നുവരെ ഞാൻ അവനെ കണ്ടിട്ടില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: ഒരുവൻ എന്നെ വിട്ടുപോയി
  rationale: വാച്യമായി ‘ഒരുവൻ എന്റെ അടുക്കൽനിന്ന് പുറപ്പെട്ടു’; സന്ദർഭത്തിൽ യാക്കോബിന്റെ പുത്രന്മാരിൽ ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നെ വിട്ടുപോയി’ എന്നു നൽകി. ‘ഒരുവൻ’ എന്നത് ഹീബ്രായത്തിലെ നിർദേശപരമായെങ്കിലും പേരുപറയാത്ത രൂപം നിലനിർത്തുന്നു.
- source_word: אַךְ טָרֹף טֹרָף
  choice: അവനെ തീർച്ചയായും കീറിപ്പറിച്ചിരിക്കുന്നു
  rationale: אַךְ എന്ന ഉറപ്പും, infinitive absolute + finite verb എന്ന ഊന്നൽഘടനയും ‘തീർച്ചയായും’ വഴി പ്രകടമാക്കി. കാട്ടുമൃഗം കീറിക്കൊന്നെന്ന ആശയം അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കാതെ ഹീബ്രായത്തിലെ രൂപകം നിലനിർത്തി.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: ഇന്നുവരെ ഞാൻ അവനെ കണ്ടിട്ടില്ല
  rationale: עַד הֵנָּה എന്നത് സമയപരമായി ‘ഇന്നുവരെ/ഇതുവരെ’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഇന്നുവരെ’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണം. പിതാവിന്റെ ദുഃഖഭരിതമായ ഉറപ്പും യോസേഫിന്റെ വിധിയെക്കുറിച്ചുള്ള അദ്ദേഹത്തിന്റെ അനുമാനവും അതേപടി നിലനിർത്തുന്നു; പേരോ മരണത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
