source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: ml
  text: അപ്പോൾ[a], ബാലൻ ഇല്ലെന്നു അവൻ കാണുമ്പോൾ, അവൻ മരിക്കും; അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ അങ്ങയുടെ ദാസനായ ഞങ്ങളുടെ അപ്പന്റെ നരച്ച മുടി ദുഃഖത്തോടെ ശീയോളിലേക്കു ഇറക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ശീയോൾ’ എന്നത് ‘കല്ലറ’ അല്ലെങ്കിൽ ‘മരിച്ചവരുടെ ലോകം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം: ‘ശീയോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥയുടെ ഫലം അവതരിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വ്യവഹാരബന്ധകമായി നൽകുന്നു.
- source_word: כִּרְאוֹתוֹ כִּי אֵין הַנַּעַר
  choice: ബാലൻ കൂടെയില്ലെന്ന് അവൻ കാണുമ്പോൾ
  rationale: ഇൻഫിനിറ്റീവ് ഘടനയുടെ കാലസാഹചര്യം ‘കാണുമ്പോൾ’ എന്നും, אֵין എന്നത് സന്ദർഭാനുസൃതമായി പ്രതീക്ഷിച്ച സംഘത്തിൽ ബാലൻ ഇല്ലെന്ന അർഥത്തിൽ ‘കൂടെയില്ല’ എന്നും വ്യക്തമാക്കുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: നַעַר എന്ന പദത്തിന്റെ യുവാവ്/ബാലൻ എന്ന അർഥപരിധിയിൽ, കുടുംബസന്ദർഭവും യെഹൂദയുടെ ബെന്യാമീനോടുള്ള സമീപനവും ‘ബാലൻ’ യോജിച്ചവിധം പ്രകടിപ്പിക്കുന്നു.
- source_word: וָמֵת
  choice: അവൻ മരിച്ചുപോകും
  rationale: ഫലക്രമത്തിൽ ഭാവികാല അർഥം നൽകുന്നു; ബെന്യാമീൻ കൂടെയില്ലെന്നു കണ്ടാൽ യാക്കോബ് മരിക്കുമെന്ന സന്ദർഭം സംരക്ഷിക്കുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: അധികാരിയോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ്; അടിമസ്ഥിതിക്ക് അനാവശ്യ ഊന്നൽ നൽകാതെ രാജസഭാ വിനയം നിലനിർത്തുന്നു.
- source_word: וְהוֹרִידוּ
  choice: ഇറക്കിക്കളയും
  rationale: ירד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘താഴേക്ക് ഇറക്കുക’ എന്ന കാരണാർഥവും മരണലോകത്തിലേക്കുള്ള ദിശാബിംബവും നിലനിർത്തുന്നു.
- source_word: שֵׂיבַת
  choice: നരച്ച തല
  rationale: അക്ഷരാർഥമായ ‘നര’ എന്ന ദൃശ്യബിംബം മലയാളത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; വെറും ‘വാർധക്യം’ എന്ന അമൂർത്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: അങ്ങയുടെ ദാസനായ ഞങ്ങളുടെ അപ്പന്റെ
  rationale: യാക്കോബിനെ ഒരേസമയം ‘അങ്ങയുടെ ദാസൻ’ എന്നും ‘ഞങ്ങളുടെ അപ്പൻ’ എന്നും വിളിക്കുന്ന അനുബന്ധഘടന സംരക്ഷിക്കുന്നു.
- source_word: בְּיָגוֹן
  choice: ദുഃഖത്തോടെ
  rationale: יָגוֹן എന്നതിന്റെ ദുഃഖം/വ്യസനം എന്ന അർഥം മരണത്തിലേക്കിറങ്ങുന്നതോടൊപ്പം വരുന്ന നിലയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁאֹלָה
  choice: ശീയോളിലേക്കു
  rationale: ‘കല്ലറ’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ, മരിച്ചവരുടെ ലോകം ഉൾപ്പെടുന്ന ഹീബ്രായ പദത്തിന്റെ വിശാല അർഥപരിധി ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: שְׁאוֹל എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ശീയോൾ
  alternative: കല്ലറ; മരിച്ചവരുടെ ലോകം
  rationale: ഹീബ്രായ പദത്തെ ‘കല്ലറ’യായി മാത്രം ചുരുക്കുന്നതോ ഒരു പ്രത്യേക പരലോകസിദ്ധാന്തമായി വിശദീകരിക്കുന്നതോ ഒഴിവാക്കി, അതിന്റെ പുരാതനവും വിശാലവുമായ ആശയപരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യോസേഫിനോടുള്ള വിനയഭാഷയ്ക്കായി ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ ‘നര’യും ‘താഴേക്ക് ഇറക്കുക’ എന്ന ദൃശ്യബിംബവും കഴിയുന്നത്ര നിലനിർത്തി.
