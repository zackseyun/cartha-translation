  to: 'അപ്പോൾ അങ്ങ് അങ്ങയുടെ ദാസന്മാരോടു പറഞ്ഞു: ‘അവനെ എന്റെ അടുക്കലേക്കു കൊണ്ടുവരുവിൻ; ഞാൻ അവനെ നോക്കിക്കാണട്ടെ[a].’'
