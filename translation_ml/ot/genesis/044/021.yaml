source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ הוֹרִדֻ֖/הוּ אֵלָ֑/י וְ/אָשִׂ֥ימָה עֵינִ֖/י עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: ml
  text: 'അപ്പോൾ അങ്ങ് അങ്ങയുടെ ദാസന്മാരോടു പറഞ്ഞു: ‘അവനെ എന്റെ അടുക്കലേക്കു കൊണ്ടുവരുവിൻ; ഞാൻ അവനെ നോക്കിക്കാണട്ടെ[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവന്റെമേൽ എന്റെ കണ്ണുവെക്കട്ടെ.” എബ്രായപ്രയോഗത്തിന് അവനെ കാണുക, പരിശോധിക്കുക, അല്ലെങ്കിൽ അവനോടു പ്രത്യേക ശ്രദ്ധ കാണിക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ അങ്ങ് ... പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപത്തിന്റെ ആഖ്യാനക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; യോസേഫിനോടുള്ള നേരിട്ടുള്ള ആദരസംബോധനയും നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: രാജസഭാസന്ദർഭത്തിൽ עבד ബന്ധപരവും ഔദ്യോഗികവുമായ ‘ദാസൻ/സേവകൻ’ എന്ന അർഥമാണ് മുൻനിൽക്കുന്നത്; അടിമത്തസ്ഥിതി നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: הוֹרִדֻהוּ
  choice: അവനെ ... കൊണ്ടുവരുവിൻ
  rationale: ഹിഫീൽ ബഹുവചന ആജ്ഞയുടെ കാരകഭാവം വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ‘താഴേക്കു’ എന്ന ദിശാസൂചന മലയാളത്തിൽ ഇവിടെ അക്ഷരാർഥമായി ചേർത്താൽ അസ്വാഭാവികമാകുന്നതിനാൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് സ്വാഭാവികമായി പറയുന്നു.
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: യോസേഫിന്റെ അടുത്തേക്കുള്ള ചലനം നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: ഞാൻ അവനെ നേരിൽ കാണട്ടെ
  rationale: അക്ഷരാർഥം ‘ഞാൻ എന്റെ കണ്ണ് അവന്റെമേൽ വെക്കട്ടെ’ എന്നാണ്. മലയാളത്തിൽ ആ ചിത്രം അക്ഷരാർഥമായി നൽകിയാൽ തെറ്റിദ്ധാരണയ്ക്കിടയാകുന്നതിനാൽ കാണുക/പരിശോധിക്കുക എന്ന അടിസ്ഥാനസന്ദർഭാർഥം നൽകുന്നു; പ്രത്യേക ശ്രദ്ധയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. യോസേഫിനോടുള്ള രാജസഭാപരമായ ആദരസംബോധനയ്ക്കായി ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു; ഉദ്ധരണിക്കുള്ളിൽ ബഹുവചന ആജ്ഞയ്ക്ക് ‘കൊണ്ടുവരുവിൻ’ നിലനിർത്തി.
