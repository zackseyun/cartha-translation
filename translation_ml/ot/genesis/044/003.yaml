    issue: The main verb is rendered as active («യാത്രയാക്കി») without an expressed subject.
    rationale: The Hebrew Pual שֻׁלְּחוּ is passive, 'were sent away.' Malayalam can naturally preserve this with «പറഞ്ഞയക്കപ്പെട്ടു».
  - severity: low
    issue: The object-marked coordination («പുരുഷന്മാരെയും ... കഴുതകളെയും») depends on the active construction.
    rationale: With the required passive verb, the men and their donkeys should be rendered as the coordinated grammatical subject.
