  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: ml
  text: പ്രഭാതം വെളുത്തപ്പോൾ[a], ആ പുരുഷന്മാരും അവരുടെ കഴുതകളും പറഞ്ഞയക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രഭാതം പുലർന്നപ്പോൾ” അല്ലെങ്കിൽ “രാവിലെ വെളിച്ചമായപ്പോൾ.”
    reason: אוֹר എന്ന ക്രിയയ്ക്കും എബ്രായ സമയവാക്യഘടനയ്ക്കും സാധ്യമായ സ്വാഭാവിക പകരരൂപങ്ങൾ.
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: പ്രഭാതത്തിൽ വെളിച്ചമായ ഉടനെ
  rationale: പ്രഭാതത്തിൽ വെളിച്ചം പ്രത്യക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സമയവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. സന്ദർഭത്തിലെ ഉടനടിയുള്ള പുറപ്പെടലും ഇതിൽ വ്യക്തമാകുന്നു.
- source_word: וְהָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരെ
  rationale: മുമ്പ് പരാമർശിച്ച നിർദിഷ്ട പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കർമസ്ഥാനത്തിന് അനുയോജ്യമായി രൂപപ്പെടുത്തി.
- source_word: שֻׁלְּחוּ
  choice: യാത്രയാക്കി
  rationale: שלח എന്ന ക്രിയയുടെ Pual നിഷ്ക്രിയരൂപം ഇവിടെ അനുമതി നൽകി പറഞ്ഞയയ്ക്കുക എന്ന സന്ദർഭാർഥം വഹിക്കുന്നു. മലയാളത്തിലെ കർമണി പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായി സംഭവം അറിയിക്കുന്നു.
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: അവരെയും അവരുടെ കഴുതകളെയും
  rationale: പുരുഷന്മാരും അവരുടെ കഴുതകളും ഒരുമിച്ച് പറഞ്ഞയക്കപ്പെട്ടു എന്ന എബ്രായ ഏകോപനം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ സമയസൂചനയും പുരുഷന്മാരുടെയും കഴുതകളുടെയും ഏകോപനവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന സ്വീകരിച്ചു.
