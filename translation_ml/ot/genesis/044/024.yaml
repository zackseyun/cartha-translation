  to: ഞങ്ങൾ അങ്ങയുടെ ദാസനായ എന്റെ അപ്പന്റെ അടുക്കലേക്കു കയറിച്ചെന്നപ്പോൾ, എന്റെ യജമാനന്റെ വാക്കുകൾ ഞങ്ങൾ അദ്ദേഹത്തോടു പറഞ്ഞു.[a]
