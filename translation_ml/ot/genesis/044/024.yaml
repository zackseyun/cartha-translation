source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: ml
  text: ഞങ്ങൾ അങ്ങയുടെ ദാസനായ എന്റെ അപ്പന്റെ അടുക്കലേക്കു കയറിച്ചെന്നപ്പോൾ, എന്റെ യജമാനന്റെ വാക്കുകൾ ഞങ്ങൾ അദ്ദേഹത്തോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘എന്റെ അപ്പനായ അങ്ങയുടെ ദാസന്റെ അടുക്കലേക്കു.’ എബ്രായ പദക്രമം അക്ഷരാർഥത്തിൽ ‘അങ്ങയുടെ ദാസൻ, എന്റെ അപ്പൻ’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ചെന്നപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ സംഭവക്രമബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ കാലവാക്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന് യാന്ത്രികമായി ചേർക്കുന്നില്ല.
- source_word: עָלִינוּ
  choice: കയറിച്ചെന്നപ്പോൾ
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭൂമിശാസ്ത്രപരമായ വീക്ഷണം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയാണ്.
- source_word: עַבְדְּךָ אָבִי
  choice: അങ്ങയുടെ ദാസനായ എന്റെ അപ്പന്റെ
  rationale: യൂദാ യോസേഫിനോടു കാണിക്കുന്ന ആദരവും യാക്കോബിനെ ‘അങ്ങയുടെ ദാസൻ’ എന്നു വിശേഷിപ്പിക്കുന്ന എബ്രായ ക്രമവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַנַּגֶּד לוֹ
  choice: ഞങ്ങൾ അദ്ദേഹത്തെ അറിയിച്ചു
  rationale: Hiphil രൂപത്തിന്റെ ‘അറിയിക്കുക/പറയുക’ എന്ന അർഥം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ’ എന്ന ഔപചാരിക സാമ്യം നിലനിർത്തുകയും אֲדֹנִי ഇവിടെ ദൈവനാമമല്ല, ആദരസൂചകമായ മാനുഷിക സ്ഥാനപ്പേരാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യോസേഫിനോടുള്ള ആദരം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’, ‘യജമാനൻ’ എന്നിവയും യാക്കോബിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ എന്ന ആദരരൂപവും ഉപയോഗിച്ചു.
