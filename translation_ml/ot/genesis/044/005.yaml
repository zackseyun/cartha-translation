source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: ml
  text: ‘എന്റെ യജമാനൻ കുടിക്കാനും ഇത് ഉപയോഗിച്ച് തീർച്ചയായും ശകുനം നോക്കാനും ഉപയോഗിക്കുന്ന പാനപാത്രം ഇതല്ലേ? ഇത് ചെയ്തതിലൂടെ നിങ്ങൾ തിന്മ ചെയ്തിരിക്കുന്നു.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇത് ഉപയോഗിച്ച് അദ്ദേഹം തീർച്ചയായും ശകുനം നോക്കുന്നു.’ എബ്രായത്തിൽ ഊന്നലിനായി ഒരേ ക്രിയയുടെ അനന്തക്രിയാരൂപവും സമാപകക്രിയാരൂപവും ചേർത്തുപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ ചെയ്തതിൽ നിങ്ങൾ തിന്മ ചെയ്തിരിക്കുന്നു.’
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: ഇതല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; זֶה ഇവിടെ പാനപാത്രത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: എന്റെ യജമാനൻ കുടിക്കാൻ ഉപയോഗിക്കുന്നത്
  rationale: בּוֹ എന്നതിന്റെ പാത്രസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. അֲדֹנִי സാമൂഹികബന്ധത്തിലെ പദവിയായതിനാൽ ‘എന്റെ യജമാനൻ’ എന്നു നൽകി.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: ശകുനം നോക്കാൻ അദ്ദേഹം ഉപയോഗിക്കുന്നത്
  rationale: נחש എന്ന ക്രിയയുടെ ദിവ്യജ്ഞാന/ശകുനനിർണയ അർഥവും בּוֹയുടെ ഉപകരണാർഥവും സംരക്ഷിക്കുന്നു. ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന ഊന്നൽ മുഖ്യവാചകത്തിൽ ഭാരമാകാതിരിക്കാൻ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֲרֵעֹתֶם
  choice: നിങ്ങൾ തിന്മ പ്രവർത്തിച്ചിരിക്കുന്നു
  rationale: רעע ഹിഫ്ഈലിന്റെ ധാർമിക ഗൗരവം ‘തെറ്റ് ചെയ്തു’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: ഇതു ചെയ്തതിലൂടെ
  rationale: പ്രവൃത്തിയെ നിർദിഷ്ടമാക്കുന്ന ബന്ധവാക്യം ആവർത്തനമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യോസേഫ് യഥാർഥത്തിൽ ശകുനം നോക്കിയിരുന്നുവോ, അതോ പരീക്ഷണത്തിന്റെ ഭാഗമായി കാര്യസ്ഥൻ അങ്ങനെ പറഞ്ഞതോ
  choice: 'കാര്യസ്ഥന്റെ വാക്കിലെ അവകാശവാദം നേരിട്ട് വിവർത്തനം ചെയ്തു: ‘ശകുനം നോക്കാൻ അദ്ദേഹം ഉപയോഗിക്കുന്നത്.’'
  alternative: യോസേഫിന്റെ യഥാർഥ ആചാരത്തെക്കുറിച്ചുള്ള അവകാശവാദം മയപ്പെടുത്തി, ‘ശകുനം നോക്കാൻ കഴിയുന്നത്’ എന്നോ വെറും നടിപ്പായി വ്യാഖ്യാനിച്ചോ നൽകുക.
  rationale: എബ്രായ വാചകം പ്രസംഗത്തിനുള്ളിൽ ശകുനനിർണയം നേരിട്ട് അവകാശപ്പെടുന്നു. യോസേഫിന്റെ യഥാർഥ വിശ്വാസമോ പ്രവൃത്തിയോ സംബന്ധിച്ച കഥാസന്ദർഭത്തിലെ സംഘർഷം വിവർത്തനം സ്വയം പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘യജമാനൻ’ കഥാസന്ദർഭത്തിലെ സാമൂഹിക പദവിയെ സൂചിപ്പിക്കുന്നു; ദൈവിക അർഥം അനാവശ്യമായി വരാതിരിക്കാൻ ‘കർത്താവ്’ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
