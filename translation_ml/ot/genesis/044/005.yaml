  source_fidelity: മുഖ്യവാചകത്തിലെ ‘ശകുനം നോക്കാൻ അദ്ദേഹം ഉപയോഗിക്കുന്നതും’ എന്ന പ്രയോഗം പാനപാത്രം ശകുനനിർണയത്തിനുള്ള ഉപകരണമാണെന്ന അർഥം നൽകുന്നുവെങ്കിലും, נַחֵשׁ יְנַחֵשׁ എന്ന ഊന്നലും ‘ഇത് ഉപയോഗിച്ച്’ എന്ന ഉപകരണബന്ധവും കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കണം. ‘കുടിക്കാൻ ഉപയോഗിക്കുന്നതും’ എന്നത് പാനപാത്രത്തെ സൂചിപ്പിക്കുന്നതിൽ അല്പം അവ്യക്തവുമാണ്.
