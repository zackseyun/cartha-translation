  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: ml
  text: 'എന്നാൽ ഞങ്ങൾ പറഞ്ഞു: “ഞങ്ങൾക്കു താഴേക്കു പോകാൻ കഴിയില്ല. ഞങ്ങളുടെ ഇളയ സഹോദരൻ ഞങ്ങളോടുകൂടെ ഉണ്ടെങ്കിൽ ഞങ്ങൾ താഴേക്കു പോകും; കാരണം, ഞങ്ങളുടെ ഇളയ സഹോദരൻ ഞങ്ങളോടുകൂടെ ഇല്ലെങ്കിൽ ആ മനുഷ്യന്റെ മുഖം കാണാൻ[a] ഞങ്ങൾക്കു കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “ആ മനുഷ്യന്റെ മുഖം കാണുക”; അദ്ദേഹത്തിന്റെ മുമ്പിൽ ഹാജരാകുക, അഥവാ അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ ചെല്ലുക എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: എന്നാൽ ഞങ്ങൾ പറഞ്ഞു
  rationale: വാവ് ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻപ് ഉന്നയിച്ച ആവശ്യത്തോടുള്ള മറുപടിയിലെ നേരിയ വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാക്കാൻ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: ഞങ്ങൾക്കു താഴേക്കു പോകാൻ കഴിയില്ല
  rationale: יכל കഴിവിനെ സൂചിപ്പിക്കുന്നു. ירד എന്നതിന്റെ ‘താഴേക്കു പോകുക’ എന്ന ഭൂമിശാസ്ത്രപരമായ ദൃശ്യഭാവം ഈജിപ്തിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: ഞങ്ങളുടെ ഇളയ സഹോദരൻ ഞങ്ങളോടുകൂടെ ഉണ്ടെങ്കിൽ
  rationale: ഇവിടെ אם വ്യക്തമായ അനുകൂല നിബന്ധനയാണ്. הקטן കുടുംബസന്ദർഭത്തിൽ ശരീരവലുപ്പമല്ല, സഹോദരന്മാരിൽ ഇളയവൻ എന്ന അർഥമാണ് നൽകുന്നത്.
- source_word: וְיָרַדְנוּ
  choice: ഞങ്ങൾ താഴേക്കു പോകാം
  rationale: മുൻ നിബന്ധനയുടെ ഫലമാണ് ഈ ഖണ്ഡം. മലയാളത്തിലെ ‘പോകാം’ നിബന്ധന പൂർത്തിയായാൽ അവർ പോകുമെന്ന സന്നദ്ധതയും ഭാവിസാധ്യതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അവർ പോകാൻ വിസമ്മതിച്ചതിന്റെ കാരണം ഈ പദം അവതരിപ്പിക്കുന്നു.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: ആ മനുഷ്യന്റെ മുഖം കാണാൻ
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘മുഖം കാണുക’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ഇതിന് ഒരാളുടെ സന്നിധിയിൽ ചെല്ലുക എന്ന പ്രയോഗാർഥമുണ്ട്.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മൂലപദം ഔദ്യോഗിക പദവിയല്ലാതെ ലളിതമായി ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നാണ്; സന്ദർഭത്തിൽ യോസേഫിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: ഞങ്ങളുടെ ഇളയ സഹോദരൻ ഞങ്ങളോടുകൂടെ ഇല്ലെങ്കിൽ
  rationale: എബ്രായം വാവ് ഉപയോഗിച്ച് ഖണ്ഡത്തെ ബന്ധിപ്പിച്ചിട്ടുണ്ടെങ്കിലും, അർഥബന്ധം ഇളയ സഹോദരന്റെ അഭാവം എന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന നിബന്ധനാത്മകമാണ്; മലയാളത്തിൽ ‘ഇല്ലെങ്കിൽ’ അത് വ്യക്തമായി നൽകുന്നു.
