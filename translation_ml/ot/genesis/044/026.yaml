  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായ വാക്യത്തിന്റെ രണ്ട് ഘട്ടങ്ങളായ വിസമ്മതവും അനുകൂല നിബന്ധനയും വേർതിരിച്ചു; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
