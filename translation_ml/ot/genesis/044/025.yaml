source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָבִ֑י/נוּ שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞങ്ങളുടെ അപ്പൻ പറഞ്ഞു[a]: ‘വീണ്ടും പോയി നമുക്കുവേണ്ടി കുറച്ച് ഭക്ഷണം വാങ്ങുവിൻ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തിരിച്ചുപോയി നമുക്കുവേണ്ടി കുറച്ച് ധാന്യം വാങ്ങുവിൻ.’ എബ്രായത്തിൽ പൊതുവായ ‘ഭക്ഷണം’ എന്ന പദമാണുള്ളത്; എങ്കിലും വിശാലസന്ദർഭം ധാന്യത്തെക്കുറിച്ചാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אָבִינוּ
  choice: ഞങ്ങളുടെ അപ്പൻ
  rationale: ഇവിടെ യാക്കോബിനെ, സഹോദരന്മാരുടെ സ്വന്തം പിതാവിനെ, സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം കൃത്യവും നേരിട്ടുള്ളതുമാണ്.
- source_word: שֻׁבוּ
  choice: വീണ്ടും പോയി
  rationale: കല്പനാരൂപം മുമ്പ് പോയ സ്ഥലത്തേക്ക് വീണ്ടും പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള സംഭാഷണത്തിന് സ്വാഭാവികമാണ്.
- source_word: שִׁבְרוּ
  choice: വാങ്ങിക്കൊണ്ടുവരുവിൻ
  rationale: യോസേഫിന്റെ ആഖ്യാനത്തിൽ ഈ ക്രിയ ധാന്യമോ ഭക്ഷണമോ വാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യസ്ഥാനത്തേക്ക് പോയി കുടുംബത്തിനായി വാങ്ങി മടങ്ങിവരുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לָנוּ
  choice: നമുക്കായി
  rationale: ലാമെദ് ഉപസർഗത്തിന്റെ ഗുണഭോക്തൃഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְעַט
  choice: കുറച്ച്
  rationale: ചെറിയ അളവിനെ ആധുനിക മലയാളത്തിൽ ലളിതമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: സന്ദർഭം ധാന്യത്തെക്കുറിച്ചാണെങ്കിലും എബ്രായപദം പൊതുവായി ‘ഭക്ഷണം’ എന്നാണ്; അതിനാൽ അർത്ഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
