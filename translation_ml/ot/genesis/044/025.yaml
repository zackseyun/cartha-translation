translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പിതാവിന്റെ കല്പനയായതിനാൽ ബഹുവചന ആദര/കല്പനാരൂപമായ ‘വരുവിൻ’ നിലനിർത്തി.
