id: GEN.44.18
reference: Genesis 44:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ അവന്റെ അടുത്തേക്കു ചെന്നു പറഞ്ഞു: “എന്റെ യജമാനനേ, ദയവായി, അങ്ങയുടെ ദാസൻ അങ്ങയുടെ കേൾവിയിൽ[a] ഒരു വാക്കു പറയട്ടെ. അങ്ങയുടെ ദാസനെതിരെ അങ്ങയുടെ കോപം ജ്വലിക്കരുതേ;[b] കാരണം അങ്ങ് ഫറവോനെപ്പോലെയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എന്റെ യജമാനന്റെ ചെവികളിൽ.” ശ്രദ്ധിച്ചു കേൾക്കണമെന്ന വിനയപൂർവമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ “അങ്ങയുടെ ദാസനോട് കോപിക്കരുതേ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ കോപം അങ്ങയുടെ ദാസനെതിരെ ജ്വലിക്കരുതേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: അവന്റെ അടുത്തുചെന്ന്
  rationale: നגשׁ സൂചിപ്പിക്കുന്ന യെഹൂദായുടെ നേരിട്ടുള്ള സമീപനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സർവനാമം സന്ദർഭത്തിൽ യോസേഫിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בִּי אֲדֹנִי
  choice: യജമാനനേ, ദയവായി
  rationale: בִּי എന്ന വിനയപൂർവമായ അപേക്ഷാഭാവവും אֲדֹנִי എന്ന ബഹുമാനസംബോധനയും ആധുനികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ പകർത്തുന്നു.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: അങ്ങയുടെ ദാസൻ ... ഒരു വാക്ക് പറയാൻ അനുവദിക്കണമേ
  rationale: സ്വയം ‘ദാസൻ’ എന്നു വിളിക്കുന്ന രാജസദസ്സിലെ വിനയഭാവവും דָבָר എന്ന ഏകവചനവും അപേക്ഷാരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: അങ്ങയോടു
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ യജമാനന്റെ ചെവികളിൽ’ എന്ന എബ്രായ പ്രയോഗം കേൾക്കത്തക്കവിധം നേരിട്ട് പറയുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘അങ്ങയോടു പറയുക’ സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസനോട് അങ്ങയുടെ കോപം ജ്വലിക്കരുതേ
  rationale: חרה אף എന്ന കോപം ജ്വലിക്കുന്നതിന്റെ എബ്രായ രൂപകം വായിക്കാവുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: അങ്ങ് ഫറവോനെപ്പോലെയല്ലോ
  rationale: യോസേഫിന്റെ അധികാരസ്ഥാനത്തെ ഫറവോനോടു താരതമ്യം ചെയ്യുന്ന വാക്യം അധികവ്യാഖ്യാനം കൂടാതെ നേരിട്ട് പകർത്തുന്നു.
theological_decisions:
- issue: ഫറവോനോടുള്ള താരതമ്യത്തിന്റെ വ്യാപ്തി
  choice: അങ്ങ് ഫറവോനെപ്പോലെയല്ലോ
  alternative: അങ്ങ് ഫറവോനു തുല്യനാണല്ലോ
  rationale: മൂലത്തിലെ כָמוֹךָ כְּפַרְעֹה ഒരു താരതമ്യം വ്യക്തമാക്കുന്നു; ‘തുല്യൻ’ എന്നു പറഞ്ഞാൽ പദവിയിലോ അധികാരത്തിലോ പൂർണസമത്വം അനാവശ്യമായി ഉറപ്പിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള രാജസദസ്സ്-സംഭാഷണ ശൈലി സ്വീകരിച്ചു. ‘അങ്ങ്/അങ്ങയുടെ’ എന്ന ബഹുമാനരൂപം യെഹൂദായുടെ വിനയവും യോസേഫിന്റെ ഉയർന്ന സ്ഥാനവും വ്യക്തമാക്കുന്നു. മൂലത്തിലെ ആവർത്തിച്ച ‘യജമാനൻ/ദാസൻ’ ബന്ധഭാഷ കഴിയുന്നത്ര നിലനിർത്തി.
