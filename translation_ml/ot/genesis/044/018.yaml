  to: 'അപ്പോൾ യെഹൂദാ അവന്റെ അടുത്തേക്കു ചെന്നു പറഞ്ഞു: “എന്റെ യജമാനനേ, ദയവായി, അങ്ങയുടെ ദാസൻ അങ്ങയുടെ കേൾവിയിൽ[a] ഒരു വാക്കു പറയട്ടെ. അങ്ങയുടെ ദാസനെതിരെ അങ്ങയുടെ കോപം ജ്വലിക്കരുതേ;[b] കാരണം അങ്ങ് ഫറവോനെപ്പോലെയാണ്.”'
