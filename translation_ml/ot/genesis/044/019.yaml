id: GEN.44.19
reference: Genesis 44:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲדֹנִ֣/י שָׁאַ֔ל אֶת עֲבָדָ֖י/ו לֵ/אמֹ֑ר הֲ/יֵשׁ לָ/כֶ֥ם אָ֖ב אוֹ אָֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: ml
  text: '“എന്റെ യജമാനൻ തന്റെ ദാസന്മാരോടു ചോദിച്ചു: ‘നിങ്ങൾക്കു പിതാവോ സഹോദരനോ ഉണ്ടോ?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ഉൾപ്പെട്ട ആദരപൂർവമായ അഭിസംബോധനയാണ്; ഭരണാധികാരിയോടുള്ള വിനയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁאַל
  choice: ചോദിച്ചു
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സാഹചര്യത്തിൽ ‘ചോദിച്ചു’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരോടു
  rationale: സഹോദരന്മാർ ഭരണാധികാരിയുടെ മുമ്പിൽ തങ്ങളെത്തന്നെ വിനയപൂർവം വിശേഷിപ്പിക്കുന്ന രാജസദസ്സിലെ പ്രയോഗമാണിത്; ഈ സന്ദർഭത്തിൽ ‘ദാസന്മാർ’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: 'ചോദിച്ചു:'
  rationale: സംസാരത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു രൂപം മലയാളത്തിൽ ഉദ്ധരണിക്കുമുമ്പുള്ള വിരാമചിഹ്നത്തിലൂടെയും ‘ചോദിച്ചു’ എന്ന ക്രിയയിലൂടെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് അനാവശ്യ ആവർത്തനമാകും.
- source_word: הֲיֵשׁ לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടോ?
  rationale: യֵשׁ + לְ എന്ന അസ്തിത്വ-ഉടമസ്ഥതാ ഘടനയുടെ സ്വാഭാവിക മലയാള സമാനരൂപമാണിത്.
- source_word: אָב
  choice: പിതാവ്
  rationale: കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമം; ഗൗരവമുള്ള ആഖ്യാനശൈലിക്ക് ‘പിതാവ്’ യോജിക്കുന്നു.
- source_word: אָח
  choice: സഹോദരൻ
  rationale: ഹീബ്രുവിലെ ഏകവചനം നിലനിർത്തുകയും പിതാവിനോടുള്ള സമാന്തര ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്സ്-സംഭാഷണ ശൈലി. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഹീബ്രു സംസാരപരിചയ സൂത്രം പദാനുപദമായി ആവർത്തിക്കാതെ, മലയാളത്തിലെ സ്വാഭാവികമായ ‘ചോദിച്ചു:’ എന്ന ഘടന ഉപയോഗിച്ചു.
