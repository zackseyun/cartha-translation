id: GEN.44.10
reference: Genesis 44:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇപ്പോഴും, നിങ്ങൾ പറഞ്ഞതുപോലെതന്നെ ആകട്ടെ. ആരുടെ പക്കൽ അതു കണ്ടെത്തുന്നുവോ, അവൻ എനിക്ക് അടിമയായിരിക്കും; നിങ്ങളോ കുറ്റവിമുക്തരായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: ഇപ്പോഴും
  rationale: ഗַּם എന്ന ഊന്നലും עַתָּה എന്ന വർത്തമാനകാലസൂചനയും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: നിങ്ങൾ പറഞ്ഞതുപോലെതന്നെ ആകട്ടെ
  rationale: അവരുടെ വാക്കുകളോടുള്ള ഉടനെയുള്ള പ്രതികരണവും സമ്മതസൂചനയും പ്രകടമാക്കുന്നു; അതിന് ശേഷമുള്ള വിധി അവരുടെ നിർദേശത്തിന്റെ കൃത്യമായ ആവർത്തനമല്ലെന്ന് പ്രധാന വിരാമംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: ആരുടെ പക്കൽ അതു കണ്ടെത്തുന്നുവോ
  rationale: വസ്തു ആരുടെ കൈവശം കണ്ടെത്തപ്പെടുന്നു എന്ന എബ്രായ ആപേക്ഷികവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: അവൻ എനിക്ക് അടിമയായിരിക്കും
  rationale: עֶבֶד ഇവിടെ ശിക്ഷയായി ഏർപ്പെടുന്ന നിർബന്ധിത അധീനപദവിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ സന്ദർഭത്തിന് യോജിക്കുന്നു. יִהְיֶה എന്നത് ലളിതമായ ഭാവികാലമായി വിവർത്തനം ചെയ്തു.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: എന്നാൽ നിങ്ങൾ കുറ്റവിമുക്തരായിരിക്കും
  rationale: נָקִי ഇവിടെ കുറ്റത്തിൽനിന്നും ബാധ്യതയിൽനിന്നും ഒഴിവുള്ള നിലയാണ്. മുൻവാക്യത്തോടുള്ള വ്യത്യാസം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ പ്രധാന വിരാമം മാനിച്ച് രണ്ട് വാക്യങ്ങളാക്കി; ഇതിലൂടെ സഹോദരന്മാരുടെ മുൻ നിർദേശം മുഴുവനായി ആവർത്തിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
