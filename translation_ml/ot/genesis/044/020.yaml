- from: 'അപ്പോൾ ഞങ്ങൾ യജമാനനോടു പറഞ്ഞു: ‘ഞങ്ങൾക്ക് വൃദ്ധനായ ഒരു അപ്പനുണ്ട്; അദ്ദേഹത്തിന്റെ വാർധക്യത്തിൽ ജനിച്ച ഒരു ഇളയ മകനുമുണ്ട്.[a] അവന്റെ സഹോദരൻ മരിച്ചുപോയി. അവന്റെ അമ്മയുടെ മക്കളിൽ അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ.[b] അവന്റെ അപ്പൻ അവനെ സ്നേഹിക്കുന്നു.’'
  to: 'അപ്പോൾ ഞങ്ങൾ എന്റെ യജമാനനോടു പറഞ്ഞു: ‘ഞങ്ങൾക്ക് വൃദ്ധനായ ഒരു അപ്പനുണ്ട്; അദ്ദേഹത്തിന്റെ വാർധക്യത്തിൽ ജനിച്ച ചെറുപ്പക്കാരനായ ഒരു മകനുമുണ്ട്.[a] അവന്റെ സഹോദരൻ മരിച്ചുപോയി. അവന്റെ അമ്മയുടെ മക്കളിൽ അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ.[b] അവന്റെ അപ്പൻ അവനെ സ്നേഹിക്കുന്നു.’'
  rationale: The revision preserves the source’s familial and relational claims while making the youth indicated by קָטָן explicit without suggesting that Benjamin is merely a comparatively younger son. It also retains the possessive respect of ‘my lord’ and improves the Malayalam wording of the explanatory footnote.
