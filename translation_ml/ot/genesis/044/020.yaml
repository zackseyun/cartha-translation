source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞങ്ങൾ എന്റെ യജമാനനോടു പറഞ്ഞു: ‘ഞങ്ങൾക്ക് വൃദ്ധനായ ഒരു അപ്പനുണ്ട്; അദ്ദേഹത്തിന്റെ വാർധക്യത്തിൽ ജനിച്ച ചെറുപ്പക്കാരനായ ഒരു മകനുമുണ്ട്.[a] അവന്റെ സഹോദരൻ മരിച്ചുപോയി. അവന്റെ അമ്മയുടെ മക്കളിൽ അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ.[b] അവന്റെ അപ്പൻ അവനെ സ്നേഹിക്കുന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വാർധക്യത്തിലെ ഒരു ചെറിയ കുട്ടി.” പിതാവിന് പ്രായമേറിയപ്പോൾ ജനിച്ച, ഇപ്പോഴും ചെറുപ്പക്കാരനായ മകനെയാണ് ഈ ഹീബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ അമ്മയ്ക്ക് അവൻ മാത്രമേ ശേഷിച്ചുള്ളൂ”; അതായത്, അമ്മയുടെ മക്കളിൽ ശേഷിച്ചിരിക്കുന്ന ഏക മകൻ അവനാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: യജമാനൻ
  rationale: ഉന്നതസ്ഥാനത്തുള്ള യോസേഫിനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയും സാമൂഹികബന്ധവും നിലനിർത്തുന്നു; ‘സാർ’ എന്നതിനെക്കാൾ ആഖ്യാനത്തിന്റെ ഭാവത്തിന് യോജിക്കുന്നു.
- source_word: זָקֵן
  choice: വൃദ്ധനായ
  rationale: പിതാവിന്റെ പ്രായാധിക്യം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: അദ്ദേഹത്തിന്റെ വാർധക്യത്തിൽ ജനിച്ച ഒരു ഇളയ മകൻ
  rationale: ‘വാർധക്യത്തിലെ കുട്ടി’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും קָטָן സൂചിപ്പിക്കുന്ന പ്രായക്കുറവ് ‘ഇളയ’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְאָחִיו מֵת
  choice: അവന്റെ സഹോദരൻ മരിച്ചുപോയി
  rationale: സഹോദരന്റെ മരണം ഇപ്പോഴത്തെ സാഹചര്യത്തിന് കാരണമാണെന്ന ഫലസ്ഥിതി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: അവന്റെ അമ്മയുടെ മക്കളിൽ അവൻ മാത്രമേ ശേഷിച്ചിട്ടുള്ളൂ
  rationale: ‘അമ്മയോടുള്ള ബന്ധത്തിൽ അവൻ മാത്രം ശേഷിച്ചു’ എന്ന ഹീബ്രായ ബന്ധസൂചനയെ, അമ്മയുടെ ജീവിച്ചിരിക്കുന്ന ഏക മകനാണ് അവൻ എന്ന സന്ദർഭാർഥത്തോടെ വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: അവന്റെ അപ്പൻ അവനെ സ്നേഹിക്കുന്നു
  rationale: אהב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും യാക്കോബിന്റെ ബെന്യാമീനോടുള്ള സ്നേഹവും അധിക വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
