translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആഖ്യാനത്തിന് യോജിച്ച മാന്യമായ ശൈലി. കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘അപ്പൻ’ ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ ബന്ധസൂചകമായ לְאִמּוֹ പ്രധാനവാചകത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ച് അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
