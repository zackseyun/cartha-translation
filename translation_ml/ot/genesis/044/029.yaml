  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: ml
  text: നിങ്ങൾ ഇവനെയും എന്നിൽനിന്ന് കൊണ്ടുപോകുകയും, അവന് ആപത്ത് സംഭവിക്കുകയും ചെയ്താൽ, നിങ്ങൾ എന്റെ നരച്ച തല ദുഃഖത്തോടെ ശെഓലിലേക്കു[a] ഇറക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കല്ലറയിലേക്ക്” അഥവാ “മരിച്ചവരുടെ ലോകത്തിലേക്ക്.”
    reason: שְׁאֹל എന്ന പദത്തിന്റെ പ്രധാന അർഥവികല്പങ്ങൾ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: കൊണ്ടുപോകുകയും ... ചെയ്താൽ
  rationale: വാവ് ചേർന്ന പൂർണക്രിയ ഇവിടെ നിബന്ധനാത്മകമായ വാക്യക്രമം തുടരുന്നു; മലയാളത്തിൽ ‘ചെയ്താൽ’ എന്ന അവസാനഘടന സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: גַּם
  choice: ഇവനെയും
  rationale: മുമ്പുണ്ടായ നഷ്ടത്തോടു മറ്റൊരാളെക്കൂടി ചേർക്കുന്ന അർഥം ‘-യും’ വ്യക്തമാക്കുന്നു.
- source_word: מֵעִם פָּנַי
  choice: എന്റെ അടുക്കൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ സാന്നിധ്യഭാവം നിലനിർത്തിക്കൊണ്ട് വേർപെടുത്തലിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וְקָרָהוּ אָסוֹן
  choice: അവന് എന്തെങ്കിലും ആപത്ത് സംഭവിക്കുകയും
  rationale: קרה എന്ന ‘സംഭവിക്കുക’ എന്ന ക്രിയയും אסון എന്ന ഗുരുതര ദുരന്തം/ആപത്ത് എന്ന അർഥവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהוֹרַדְתֶּם
  choice: നിങ്ങൾ ... ഇറക്കും
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥം സംരക്ഷിക്കുന്നു.
- source_word: שֵׂיבָתִי
  choice: എന്റെ നരച്ച തല
  rationale: ‘എന്റെ നര’ എന്ന എബ്രായ രൂപകം മലയാളത്തിൽ മനസ്സിലാകുന്ന ‘നരച്ച തല’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; ഇത് വൃദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּרָעָה
  choice: ദുഃഖത്തോടെ
  rationale: ഇവിടെ ധാർമ്മിക തിന്മയല്ല, ദുരിതം/ദുഃഖം നിറഞ്ഞ അവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: שְׁאֹלָה
  choice: പാതാളത്തിലേക്ക്
  rationale: മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന ശെഓലിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വെറും കല്ലറയേക്കാൾ വിശാലവുമായ തത്തുല്യപദം.
theological_decisions:
- issue: שְׁאֹל എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാതാളം
  alternative: ശെഓൽ; കല്ലറ; മരിച്ചവരുടെ ലോകം
  rationale: ‘പാതാളം’ വെറും സംസ്കാരസ്ഥലമായി അർഥം ചുരുക്കാതെ പഴയനിയമത്തിലെ മരിച്ചവരുടെ അധോലോകസങ്കൽപ്പം സൂക്ഷിക്കുന്നു. പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സിദ്ധാന്താർഥങ്ങൾ ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നിബന്ധനാക്രമവും ‘നരച്ച തല ഇറക്കുക’ എന്ന രൂപകവും നിലനിർത്തി; ‘പാതാളം’ എന്നതിന് അടിക്കുറിപ്പിലൂടെ യഥാർഥ പദവും അർഥവികല്പങ്ങളും നൽകി.
