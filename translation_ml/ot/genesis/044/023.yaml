id: GEN.44.23
reference: Genesis 44:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: ml
  text: 'നീ നിന്റെ ദാസന്മാരോടു പറഞ്ഞു: ‘നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരൻ നിങ്ങളോടൊപ്പം ഇറങ്ങിവരുന്നില്ലെങ്കിൽ, നിങ്ങൾ ഇനി എന്റെ മുഖം കാണുകയില്ല[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പ്രയോഗസഹജമായി: “നിങ്ങൾ ഇനി എന്റെ മുമ്പാകെ വരരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: നീ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനക്രമം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്. മുൻവാക്യബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ നിർബന്ധിതമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാരോട്
  rationale: രാജസദസ്സിലെ വിനയപൂർവമായ സ്വയംപരാമർശമാണിത്. അടിമത്തത്തിന്റെ ആശയം അനാവശ്യമായി മുൻനിർത്താതെ עבד എന്ന പദത്തിന്റെ ഔപചാരിക ഭാവം ‘ദാസന്മാർ’ നിലനിർത്തുന്നു.
- source_word: אִם לֹא
  choice: '... ഇല്ലെങ്കിൽ'
  rationale: നിഷേധാത്മക നിബന്ധനയെ മലയാളത്തിൽ സുതാര്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֵרֵד
  choice: ഇറങ്ങിവരുന്നില്ലെങ്കിൽ
  rationale: ירד എന്നതിന്റെ ദിശാസൂചനയായ ‘ഇറങ്ങുക’ നിലനിർത്തുകയും ഈജിപ്തിലുള്ള പ്രഭാഷകന്റെ കാഴ്ചപ്പാട് ‘വരുക’കൊണ്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരൻ
  rationale: הקטן ഇവിടെ സഹോദരന്മാരിൽ ഏറ്റവും ഇളയവനെ തിരിച്ചറിയിക്കുന്നു; ‘ഏറ്റവും ഇളയ’ എന്നത് ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: കൂടെ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: לֹא תֹסִפוּן
  choice: നിങ്ങൾ ഇനി ... കാണുകയില്ല
  rationale: יסף + infinitive എന്ന ഘടന ഇനി വീണ്ടും അങ്ങനെ ചെയ്യുകയില്ലെന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘ഇനി ... ഇല്ല’ സ്വാഭാവികമായി തുടർന്നുള്ള അവസരങ്ങൾ നിഷേധിക്കുന്നു.
- source_word: לִרְאוֹת פָּנָי
  choice: എന്റെ മുഖം കാണുക
  rationale: എബ്രായത്തിലെ ദൃശ്യമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭോചിതമായ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
