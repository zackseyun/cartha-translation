translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യോസേഫിനോടുള്ള യൂദായുടെ ആദരസൂചകമായ രാജസദസ്സ് ഭാഷ നിലനിർത്താൻ ‘ദാസന്മാർ’ ഉപയോഗിച്ചു. ‘എന്റെ മുഖം കാണുക’ എന്ന എബ്രായ പ്രയോഗം അക്ഷരസമീപമായി സൂക്ഷിച്ച് അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകി.
