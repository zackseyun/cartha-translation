source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: ml
  text: 'യെഹൂദാ പറഞ്ഞു: “എന്റെ യജമാനനോട് ഞങ്ങൾ എന്തു പറയേണ്ടു? എന്തു സംസാരിക്കേണ്ടു? ഞങ്ങൾ എങ്ങനെ ഞങ്ങളെത്തന്നെ നീതീകരിക്കും?[a] ദൈവം അങ്ങയുടെ ദാസന്മാരുടെ കുറ്റം കണ്ടെത്തിയിരിക്കുന്നു.[b] ഇതാ, ഞങ്ങളും ആരുടെ കൈവശം പാനപാത്രം കണ്ടെത്തപ്പെട്ടോ അവനും എന്റെ യജമാനന്റെ അടിമകളാണ്.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ ശരിയാണെന്ന് എങ്ങനെ തെളിയിക്കും?” എബ്രായക്രിയയ്ക്ക് ഒരാൾ താൻ ശരിയാണെന്നു തെളിയിക്കുക, അഥവാ തന്നെത്തന്നെ നീതീകരിക്കുക എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവം അങ്ങയുടെ ദാസന്മാരുടെ അകൃത്യം വെളിപ്പെടുത്തിയിരിക്കുന്നു.” ‘കുറ്റം’ എന്ന എബ്രായപദത്തിന് അകൃത്യം, കുറ്റബാധ്യത, അതിന്റെ ശിക്ഷാഫലം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: ആദ്യത്തെ ‘ദാസന്മാർ’ മേലധികാരിയുടെ മുമ്പിലുള്ള ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; പിന്നീട് വരുന്ന ‘അടിമകൾ’ സഹോദരന്മാർ ഏറ്റെടുക്കാമെന്നു പറയുന്ന ബന്ധിതദാസ്യസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനനോട് / എന്റെ യജമാനന്റെ
  rationale: ഇവിടെ אָדוֹן ദൈവിക വിശേഷണമല്ല, അധികാരസ്ഥാനത്തുള്ള യോസേഫിനോടുള്ള ആദരപൂർവമായ സംബോധനയാണ്. ‘യജമാനൻ’ ആ അധികാരബന്ധവും എബ്രായത്തിലെ ഒന്നാംപുരുഷ ഉടമസൂചനയും നിലനിർത്തുന്നു.
- source_word: נֹּאמַר / נְּדַבֵּר
  choice: എന്തു പറയേണ്ടു? എന്തു സംസാരിക്കേണ്ടു?
  rationale: അടുത്തടുത്തുള്ള രണ്ടു ക്രിയകളുടെ വ്യത്യാസവും യെഹൂദായുടെ നിസ്സഹായമായ വാഗ്വിന്യാസവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: נִּצְטַדָּק
  choice: ഞങ്ങളെത്തന്നെ നീതീകരിക്കും
  rationale: צדק എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം തങ്ങൾ ശരിയാണെന്നു തെളിയിക്കുക അഥവാ തങ്ങളെത്തന്നെ നീതീകരിക്കുക എന്ന അർഥം നൽകുന്നു; അതിന്റെ നിയമപരവും നൈതികവുമായ ഭാവം ഈ പദം സൂക്ഷിക്കുന്നു.
- source_word: מָצָא אֶת עֲוֺן
  choice: കുറ്റം കണ്ടെത്തിയിരിക്കുന്നു
  rationale: മറഞ്ഞിരുന്ന കുറ്റബാധ്യത ദൈവം കണ്ടെത്തി പുറത്തുകൊണ്ടുവന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു; ‘കുറ്റം’ എന്നത് പ്രവൃത്തിയെയും കുറ്റബാധ്യതയെയും ഇവിടെ ഉൾക്കൊള്ളാൻ കഴിയും.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: അങ്ങയുടെ ദാസന്മാർ / യജമാനന്റെ അടിമകൾ
  rationale: ആദ്യത്തേത് മേലധികാരിയോടുള്ള വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്; രണ്ടാമത്തേത് അവർ ഏറ്റെടുക്കുന്ന യഥാർഥ ബന്ധിതദാസ്യസ്ഥിതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അടിമകൾ’ എന്നു വേർതിരിച്ചു.
- source_word: הִנֶּנּוּ
  choice: ഇതാ, ഞങ്ങൾ
  rationale: കീഴടങ്ങിക്കൊണ്ട് തങ്ങളെത്തന്നെ മുന്നോട്ടുവയ്ക്കുന്ന presentational particle-ന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: ഞങ്ങളും പാനപാത്രം ആരുടെ കൈവശം കണ്ടെത്തിയോ അവനും
  rationale: ഇരട്ട גַּם സഹോദരന്മാരെയും പാനപാത്രം കണ്ടെത്തപ്പെട്ട വ്യക്തിയെയും ഒരുപോലെ ഉൾപ്പെടുത്തുന്നു. ‘കൈവശം’ എന്നത് എബ്രായത്തിലെ ‘കൈയിൽ’ എന്ന നിയമപരമായ കണ്ടെത്തൽഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַגָּבִיעַ
  choice: പാനപാത്രം
  rationale: പ്രത്യേകതയുള്ള കുടിപ്പാത്രത്തെ സൂചിപ്പിക്കുന്നതും ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദമാണ്.
theological_decisions:
- issue: הָאֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ദൈവം തന്നെയാണ് അവരുടെ മറഞ്ഞിരുന്ന കുറ്റം കണ്ടെത്തിയതെന്ന് യെഹൂദാ സമ്മതിക്കുന്നു.
  alternative: ഏതെങ്കിലും ദൈവിക ശക്തി അവരുടെ തെറ്റ് വെളിപ്പെടുത്തി.
  rationale: ഉല്പത്തി പുസ്തകത്തിന്റെ ആഖ്യാനസന്ദർഭത്തിൽ നിർദിഷ്ടരൂപത്തിലുള്ള אֱלֹהִים ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ അനിശ്ചിതമോ ബഹുവചനമോ ആയ വിവർത്തനം സന്ദർഭത്തിന് യോജിക്കില്ല.
- issue: עָוֹן എന്ന പദത്തിലെ കുറ്റം–അകൃത്യം–കുറ്റഫലം വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കുറ്റം’ എന്നു നൽകി, ദൈവം അതു കണ്ടെത്തിയതായി പറഞ്ഞു.
  alternative: ‘അകൃത്യം വെളിപ്പെടുത്തിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘പാപം കണ്ടെത്തിയിരിക്കുന്നു’.
  rationale: ഇവിടെ യെഹൂദാ പാനപാത്രവുമായി ബന്ധപ്പെട്ട ആരോപണം മാത്രം ഏറ്റുപറയുന്നു എന്ന് നിർബന്ധമായി വ്യക്തമാക്കാതെ, സഹോദരന്മാരുടെ ആഴത്തിലുള്ള കുറ്റബാധ്യതയിലേക്കുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘എന്റെ യജമാനൻ’ രാജസഭാസദൃശമായ ആദരവും അധികാരബന്ധവും നിലനിർത്തുന്നു; ആവർത്തിച്ച ചോദ്യങ്ങൾ എബ്രായത്തിലെ വാഗ്വിന്യാസവും യെഹൂദായുടെ നിസ്സഹായതയും സംരക്ഷിക്കുന്നു.
