id: GEN.44.30
reference: Genesis 44:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹאִ/י֙ אֶל עַבְדְּ/ךָ֣ אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתָּ֑/נוּ וְ/נַפְשׁ֖/וֹ קְשׁוּרָ֥ה בְ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: ml
  text: ഇപ്പോൾ ഞാൻ അങ്ങയുടെ ദാസനായ എന്റെ അപ്പന്റെ അടുക്കൽ ചെല്ലുമ്പോൾ, ബാലൻ ഞങ്ങളോടുകൂടെ ഇല്ലാതിരിക്കെ—അപ്പന്റെ ജീവൻ ബാലന്റെ ജീവനോടു ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: യെഹൂദയുടെ അപേക്ഷയിലെ അടുത്ത സാഹചര്യത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വാവിന്റെ ബന്ധകശക്തി വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: כְּבֹאִי
  choice: ഞാൻ ... ചെല്ലുമ്പോൾ
  rationale: כְּ + ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള infinitive construct ഭാവിയിലെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: അങ്ങയുടെ ദാസനായ എന്റെ അപ്പന്റെ അടുക്കൽ
  rationale: യോസേഫിനോടുള്ള ആദരസൂചകമായ ‘അങ്ങയുടെ ദാസൻ’ എന്ന വിശേഷണവും ‘എന്റെ അപ്പൻ’ എന്ന ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: നַעַר ഇവിടെ ബെന്യാമീനെ കുടുംബപരവും വികാരനിർഭരവുമായി പരാമർശിക്കുന്നു; ‘ബാലൻ’ ആ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: ഞങ്ങളോടുകൂടെ ഇല്ലെങ്കിൽ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുകയും തുടർന്നുവരുന്ന 31-ാം വാക്യവുമായി ബന്ധിപ്പിക്കുന്ന നിബന്ധനാഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְנַפְשׁוֹ
  choice: അപ്പന്റെ ജീവൻ
  rationale: נֶפֶשׁ ഇവിടെ സാങ്കേതികമായ ‘ആത്മാവ്’ എന്നതിലുപരി ജീവനും വ്യക്തിത്വവും സൂചിപ്പിക്കുന്നു; സർവനാമത്തിന്റെ പിതാവെന്ന സൂചന വ്യക്തമാക്കുന്നു.
- source_word: קְשׁוּרָה
  choice: ബന്ധിക്കപ്പെട്ടിരിക്കുകയാൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന passive participle ആയ രൂപം ദൃഢമായ ബന്ധത്തിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു; സാഹചര്യവാക്യത്തിന്റെ വ്യാകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: בְנַפְשׁוֹ
  choice: ബാലന്റെ ജീവനോടു
  rationale: അവസാന പ്രത്യയത്തിന്റെ സന്ദർഭപരമായ സൂചന ബെന്യാമീനാണ്; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ആ സൂചന തുറന്നുപറയുന്നു.
theological_decisions:
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഇവിടെ പിതാവിന്റെ ജീവനും വികാരപരമായ അസ്തിത്വവും മകനുമായി ചേർന്നിരിക്കുന്നതാണു പ്രസക്തം; ശരീരം–ആത്മാവ് സംബന്ധിച്ച സാങ്കേതിക മതശാസ്ത്രാർഥം അടിച്ചേൽപ്പിക്കരുത്.
- issue: അവസാന וְ-വാക്യത്തിന്റെ ബന്ധം
  choice: സാഹചര്യപരവും വിശദീകരണാത്മകവുമായി ‘ബന്ധിക്കപ്പെട്ടിരിക്കുകയാൽ’
  alternative: സ്വതന്ത്ര കാരണവാക്യമായി ‘കാരണം ... ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു’
  rationale: ഹീബ്രു participial ഘടന വിശദീകരണപരമായ സാഹചര്യത്തെ അനുവദിക്കുന്നു; വ്യക്തമായ കാരണബന്ധം അതിരുകടന്ന് ഉറപ്പിക്കാതെ മലയാളത്തിലെ വാക്യപ്രവാഹം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. യോസേഫിനോടുള്ള ആദരത്തിന് ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. വാക്യം 31-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി; അപ്പനും ബാലനും സൂചിപ്പിക്കുന്ന ഒരേ രൂപത്തിലുള്ള ഹീബ്രു സർവനാമങ്ങൾ മലയാളത്തിൽ തുറന്നുപറഞ്ഞു.
