    text: അല്ലെങ്കിൽ, ‘അവൻ അവരെ എത്തിപ്പിടിച്ചു ഈ വാക്കുകൾ അവരോടു പറഞ്ഞു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: അവരെ പിന്തുടർന്നു ചെന്നെത്തി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള נשׂג എന്ന ക്രിയയ്ക്ക് ഇവിടെ വഴിയിൽ മുന്നേ പോയവരെ പിന്നാലെ ചെന്ന് എത്തുക എന്ന അർഥമാണ്. സന്ദർഭത്തിലെ പിന്തുടരലും എത്തിച്ചേരലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: דבר എന്നത് സാധാരണയായി ‘സംസാരിക്കുക’ എന്നാണ്; എന്നാൽ ‘ഈ വാക്കുകൾ’ എന്ന കർമത്തോടൊപ്പം മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നത് കൂടുതൽ സ്വാഭാവികവും ഹീബ്രു ആശയം വിശ്വസ്തമായി നൽകുന്നതുമാണ്.
- source_word: אֲלֵהֶם
  choice: അവരോടു
  rationale: אֶל ഇവിടെ അഭിസംബോധനയുടെ ദിശ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അവരോടു പറഞ്ഞു’ എന്ന പ്രയോഗം അതിന്റെ സ്വാഭാവിക സമാനരൂപമാണ്.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈ വാക്കുകൾ’; പിന്നാലെ വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നതിനാൽ ഇതുതന്നെ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പിന്തുടർന്ന് എത്തുക എന്ന ചലനസന്ദർഭം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുകയും נשׂג എന്ന ക്രിയയുടെ ‘overtake’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
