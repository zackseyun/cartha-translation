id: GEN.44.9
reference: Genesis 44:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസന്മാരിൽ ആരുടെ പക്കൽ അതു കണ്ടെത്തിയാലും[a], അവൻ മരിക്കട്ടെ[b]; ഞങ്ങളും എന്റെ യജമാനന് അടിമകളായിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസന്മാർ’ എന്നും പിന്നീട് വരുന്ന ‘അടിമകൾ’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന പദങ്ങൾ എബ്രായത്തിൽ ഒരേ പദമൂലത്തിൽനിന്നുള്ളവയാണ്. ഇവിടെ ആദ്യത്തേത് ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; രണ്ടാമത്തേത് യഥാർഥ അടിമത്തത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവൻ മരിക്കണം.’'
    reason: translation_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരിൽ ആരുടെ പക്കൽ അതു കണ്ടെത്തിയാലും
  rationale: അനിശ്ചിത ബന്ധവാക്യവും מן എന്നതിന്റെ കൂട്ടത്തിൽനിന്നുള്ള ഒരാൾ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. മുൻസന്ദർഭത്തിലെ പാനപാത്രത്തെയാണ് ‘അതു’ സൂചിപ്പിക്കുന്നത്; אִתּוֹ കൈവശം എന്ന അർഥത്തിൽ ‘പക്കൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וָמֵת
  choice: അവൻ മരിക്കട്ടെ
  rationale: ശിക്ഷാനിർദേശത്തിന്റെ പ്രതിജ്ഞാസദൃശമായ ഫലം സൂചിപ്പിക്കുന്ന ക്രിയാബലം മലയാളത്തിലെ വിധിപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: ഞങ്ങളും ... ആയിത്തീരും
  rationale: וְגַם എന്നതിലെ അധികഫലത്തിന്റെ ഊന്നലും היה സൂചിപ്പിക്കുന്ന പുതിയ അവസ്ഥയിലേക്കുള്ള പ്രവേശനവും വ്യക്തമാക്കുന്നു.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയവും മനുഷ്യാധികാരിയോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയും സംരക്ഷിക്കുന്നു; ദൈവിക പദവിയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘യജമാനൻ’ തിരഞ്ഞെടുത്തു.
- source_word: עבד / לַעֲבָדִים
  choice: ദാസന്മാർ / അടിമകൾ
  rationale: ആദ്യത്തേത് അധികാരിയുടെ മുമ്പിലെ വിനയപൂർവമായ സ്വയംവിശേഷണം ആയതിനാൽ ‘ദാസന്മാർ’; രണ്ടാമത്തേത് യഥാർഥ ബന്ധനാവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അടിമകൾ’.
theological_decisions:
- issue: ഒരേ עבד മൂലപദത്തിന്റെ രണ്ട് സന്ദർഭങ്ങളിലെ വിവർത്തനം
  choice: ആദ്യത്തേത് ‘ദാസന്മാർ’, രണ്ടാമത്തേത് ‘അടിമകൾ’
  alternative: രണ്ടിടത്തും ‘ദാസന്മാർ’ അല്ലെങ്കിൽ രണ്ടിടത്തും ‘അടിമകൾ’
  rationale: ആദ്യപ്രയോഗത്തിൽ രാജസഭാസദൃശമായ വിനയഭാഷയാണ് മുൻനിൽക്കുന്നത്; രണ്ടാമത്തേതിൽ ശിക്ഷയായി ഏൽക്കുന്ന യഥാർഥ അടിമത്തമാണ് മുൻനിൽക്കുന്നത്. പദമൂലത്തിലെ ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וָמֵת എന്നതിന്റെ നിർദേശാത്മക ബലം
  choice: ‘അവൻ മരിക്കട്ടെ’
  alternative: ‘അവൻ മരിക്കും’
  rationale: ഇത് വെറും ഭാവിപ്രവചനമല്ല, സഹോദരന്മാർ മുന്നോട്ടുവയ്ക്കുന്ന ശിക്ഷാനിബന്ധനയാണ്; അതിനാൽ നിർദേശാത്മക രൂപം യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അങ്ങയുടെ’ എന്നും ‘എന്റെ യജമാനന്’ എന്നും ഉപയോഗിച്ച് രാജസഭാപരമായ ആദരം നിലനിർത്തി; ബന്ധനാവസ്ഥ വ്യക്തമാക്കാൻ രണ്ടാം עבד പ്രയോഗത്തിൽ ‘അടിമകൾ’ ഉപയോഗിച്ചു.
