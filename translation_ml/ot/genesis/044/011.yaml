  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְמַהֲר֗וּ וַ/יּוֹרִ֛דוּ אִ֥ישׁ אֶת אַמְתַּחְתּ֖/וֹ אָ֑רְצָ/ה וַֽ/יִּפְתְּח֖וּ אִ֥ישׁ אַמְתַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: ml
  text: അപ്പോൾ അവർ തിടുക്കപ്പെട്ടു; ഓരോരുത്തനും തന്റെ ചാക്ക് നിലത്തിറക്കി[b][a]; ഓരോരുത്തനും തന്റെ ചാക്ക് തുറന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘ഓരോരുത്തൻ’ എന്ന ആശയം ചാക്ക് നിലത്തിറക്കുന്നതിനും തുറക്കുന്നതിനും ആവർത്തിക്കുന്നു; ഓരോരുത്തനും സ്വന്തം ചാക്ക് ഇറക്കുകയും തുറക്കുകയും ചെയ്തുവെന്നതിന് ഇതു ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവർ വേഗം ചെയ്തു; ഓരോരുത്തനും തന്റെ ചാക്ക് നിലത്തിറക്കി.’'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: വേഗം
  rationale: מהר എന്ന ധാതു സൂചിപ്പിക്കുന്ന ഉടനടിയുള്ള, തിടുക്കപ്പെട്ട പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיּוֹרִדוּ
  choice: നിലത്തിറക്കി
  rationale: ירד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘താഴേക്കിറക്കുക’ എന്ന കാരകാർഥം, ചാക്ക് നിലത്തേക്കിറക്കുന്ന ഈ സന്ദർഭത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: ഓരോരുത്തരും ... താന്താന്റെ ചാക്ക്
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥവും ഓരോ സഹോദരനും സ്വന്തം ചാക്കിൽ ചെയ്ത പ്രവൃത്തിയെന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: אַמְתַּחַת
  choice: ചാക്ക്
  rationale: ധാന്യമോ യാത്രാസാധനങ്ങളോ കൊണ്ടുപോകുന്ന സഞ്ചിയെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദമാണ് ‘ചാക്ക്’.
- source_word: אָרְצָה
  choice: നിലത്ത്
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ ദിശാസൂചക രൂപം ഇവിടെ നിലത്തേക്കുള്ള താഴോട്ടുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּפְתְּחוּ
  choice: തുറന്നു
  rationale: פתח എന്ന ധാതുവിന്റെ നേരിട്ടുള്ള അർഥം അനാവശ്യമായ വിശദീകരണമില്ലാതെ നൽകുന്നു.
