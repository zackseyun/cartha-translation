translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ബഹുവചന ക്രിയയും വിതരണാർഥമുള്ള אִישׁ എന്ന പദവും തമ്മിലുള്ള ബന്ധം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
