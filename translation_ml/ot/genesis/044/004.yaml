  to: 'അവർ പട്ടണത്തിൽനിന്ന് പുറപ്പെട്ടിട്ട് അധികം ദൂരം പോയിരുന്നില്ല; അപ്പോൾ യോസേഫ് തന്റെ വീട്ടുകാര്യസ്ഥനോട്[a] പറഞ്ഞു: “എഴുന്നേറ്റ് ആ പുരുഷന്മാരെ പിന്തുടരുക. അവരെ എത്തിപ്പിടിക്കുമ്പോൾ അവരോട്, ‘നന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്തത് എന്തിന്?’ എന്നു ചോദിക്കുക.”'
