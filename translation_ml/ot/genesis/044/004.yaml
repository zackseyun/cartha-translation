id: GEN.44.4
reference: Genesis 44:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: ml
  text: 'അവർ പട്ടണത്തിൽനിന്ന് പുറപ്പെട്ടിട്ട് അധികം ദൂരം പോയിരുന്നില്ല; അപ്പോൾ യോസേഫ് തന്റെ വീട്ടുകാര്യസ്ഥനോട്[a] പറഞ്ഞു: “എഴുന്നേറ്റ് ആ പുരുഷന്മാരെ പിന്തുടരുക. അവരെ എത്തിപ്പിടിക്കുമ്പോൾ അവരോട്, ‘നന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്തത് എന്തിന്?’ എന്നു ചോദിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ ഭവനത്തിനു മേലുള്ളവനോട്”; അഥവാ, “തന്റെ ഗൃഹവിചാരകനോട്” അല്ലെങ്കിൽ “വീട്ടുകാര്യസ്ഥനോട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר
  choice: അവർ പട്ടണത്തിൽനിന്നു പുറപ്പെട്ടിരുന്നു
  rationale: യָצָא എന്നത് ഇവിടെ പട്ടണത്തിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള യോസേഫിന്റെ കല്പനയ്ക്കു മുമ്പുള്ള സംഭവമെന്ന ആഖ്യാനക്രമം വ്യക്തമാക്കാൻ പൂർവകാലപൂർണരൂപം ഉപയോഗിച്ചു.
- source_word: לֹא הִרְחִיקוּ
  choice: അധികം ദൂരം പോയിരുന്നില്ല
  rationale: רחק എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ദൂരെയാകുക അഥവാ ഏറെ ദൂരം പോകുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: തന്റെ വീട്ടിന്റെ മേൽനോട്ടക്കാരനോട്
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ വീടിന്റെ മേൽ ഉണ്ടായിരുന്നവനോട്’ എന്നാണ്. വീട്ടുകാര്യങ്ങളുടെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നതിനാൽ പദവിയുടെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്ന പ്രയോഗം സ്വീകരിച്ചു.
- source_word: קוּם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ആജ്ഞ പ്രവർത്തനത്തിലേക്കുള്ള അടിയന്തരമായ എഴുന്നേൽപ്പിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘പിന്തുടരുക’ എന്ന കല്പനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരെ പിന്തുടരുക
  rationale: רדף אחרי എന്നത് പിന്നാലെ ചെന്നു പിടിക്കാനായി പിന്തുടരുക എന്നാണ്. אֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: וְהִשַּׂגְתָּם
  choice: അവരെ എത്തിപ്പിടിക്കുമ്പോൾ
  rationale: נשׂג എന്ന ഹിഫീൽ രൂപത്തിന് എത്തിച്ചേരുക, മറികടക്കുക, എത്തിപ്പിടിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. അടുത്ത കല്പനയ്ക്കു മുമ്പുള്ള ക്രമബന്ധം ‘എപ്പോൾ’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോട് … എന്നു ചോദിക്കുക
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘അവരോട് പറയുക’ എന്നാണെങ്കിലും പിന്നാലെയുള്ളത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കുക’ എന്നത് സ്വാഭാവികവും അർഥസമാനവുമാണ്.
- source_word: לָמָּה שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: നന്മയ്ക്കു പകരം തിന്മ ചെയ്തത് എന്തിന്?
  rationale: שׁלם എന്ന പീയേൽ രൂപം ചെയ്തതിന് പ്രതിഫലമായി മടക്കിനൽകുക എന്ന ആശയം വഹിക്കുന്നു. മലയാളത്തിൽ ‘നന്മയ്ക്കു പകരം തിന്മ ചെയ്യുക’ എന്നത് ആരോപണത്തിന്റെ ധാർമിക വിരോധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ആഖ്യാനത്തിന്റെ കാലക്രമവും കല്പനകളുടെ അടിയന്തരതയും നിലനിർത്തി; ഔദ്യോഗിക ചുമതല സൂചിപ്പിക്കുന്ന അപൂർവമായ ഹീബ്രു പ്രയോഗം അടിക്കുറിപ്പിൽ അക്ഷരാർഥത്തോടെ സംരക്ഷിച്ചു.
