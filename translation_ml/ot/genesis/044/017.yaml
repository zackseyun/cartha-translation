  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “എനിക്ക് അങ്ങനെ ചെയ്യുക ഒരിക്കലും പാടില്ല! അവന്റെ കൈവശം പാനപാത്രം കണ്ടെത്തപ്പെട്ടവൻ തന്നേ എനിക്ക് അടിമയായിരിക്കും; നിങ്ങളോ സമാധാനത്തോടെ നിങ്ങളുടെ അപ്പന്റെ അടുക്കലേക്കു കയറിപ്പോകുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: എനിക്ക് ചിന്തിക്കാനുപോലും കഴിയില്ല
  rationale: ശക്തമായ നിരാകരണവും ധാർമിക വെറുപ്പും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ആധുനികവുമായ മലയാള തുല്യം.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: അങ്ങനെ ചെയ്യുന്നത്
  rationale: നിരസിക്കപ്പെടുന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ഇത്’ എന്നതിനു പകരം ‘അങ്ങനെ’ ഉപയോഗിച്ചു.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: ആരുടെ കൈവശമാണോ പാനപാത്രം കണ്ടെത്തിയത്
  rationale: ‘അവന്റെ കൈയിൽ’ എന്ന എബ്രായ രൂപകത്തിന്റെ ഉടമസ്ഥതാ/കൈവശ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: അവൻതന്നെ എനിക്ക് അടിമയായിരിക്കട്ടെ
  rationale: עָבֶד എന്ന പദത്തിന് ദാസൻ, അടിമ എന്നീ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും, ഇവിടെ മോഷണത്തിനുള്ള ശിക്ഷയായി നിർബന്ധിത ബന്ധനം ഏർപ്പെടുത്തുന്നതുകൊണ്ട് ‘അടിമ’ സന്ദർഭശക്തി കൂടുതൽ കൃത്യമായി നൽകുന്നു.
- source_word: וְאַתֶּם עֲלוּ
  choice: നിങ്ങളോ ... മടങ്ങിപ്പോകുവിൻ
  rationale: ശിക്ഷിക്കപ്പെടുന്ന ഒരാളെയും വിട്ടയക്കപ്പെടുന്ന സഹോദരന്മാരെയും തമ്മിലുള്ള വൈരുധ്യം ‘നിങ്ങളോ’ വ്യക്തമാക്കുന്നു. കനാനിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന ‘കയറിപ്പോകുക’ എന്ന എബ്രായ പ്രയോഗം ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികമായി ‘മടങ്ങിപ്പോകുക’ എന്നു നൽകി.
- source_word: לְשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: തടസ്സമോ ശിക്ഷയോ കൂടാതെ സുരക്ഷിതമായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ലളിതമായ മലയാള തുല്യം.
- source_word: אֶל אֲבִיכֶם
  choice: നിങ്ങളുടെ അപ്പന്റെ അടുക്കലേക്കു
  rationale: ബന്ധത്തിന്റെ അടുപ്പം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാള രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോസേഫിന്റെ ശക്തമായ നിരാകരണവും കുറ്റക്കാരനായി കണ്ടെത്തപ്പെട്ട ഒരാൾക്കു മാത്രമുള്ള ശിക്ഷയും മറ്റുള്ളവർക്ക് നൽകുന്ന സമാധാനപൂർവമായ വിടുതലും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
