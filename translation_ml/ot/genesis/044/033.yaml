  rationale: The revision removes the unsupported ‘this’ and ‘here,’ and uses ‘പ്രഭു’ for the respectful human title ‘my lord.’ Footnote a is retained as the stated lexical alternative, but its marker is placed after ‘ബാലനു പകരം,’ the phrase to which it pertains.
