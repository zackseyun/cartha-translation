revisions:
- from: അതിനാൽ ഇപ്പോൾ, ദയവായി, ഈ ബാലനു പകരം[a] അങ്ങയുടെ ദാസനായ ഞാൻ എന്റെ യജമാനന് അടിമയായി ഇവിടെ കഴിയട്ടെ; ബാലൻ തന്റെ സഹോദരന്മാരോടൊപ്പം കയറിപ്പോകട്ടെ[b].
