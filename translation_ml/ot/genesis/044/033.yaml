  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: ml
  text: അതിനാൽ ഇപ്പോൾ, ദയവായി, അങ്ങയുടെ ദാസനായ ഞാൻ ബാലനു പകരം എന്റെ പ്രഭുവിന് അടിമയായി കഴിയട്ടെ; ബാലൻ തന്റെ സഹോദരന്മാരോടൊപ്പം കയറിപ്പോകട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: എബ്രായത്തിൽ ‘കയറിപ്പോകുക.’ ഈജിപ്തിൽനിന്ന് കനാനിലേക്കുള്ള യാത്രയെ വിവരിക്കാൻ സാധാരണ ഉപയോഗിച്ചിരുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതിനാൽ ഇപ്പോൾ
  rationale: വാക്യത്തിന്റെ ബന്ധകവും യെഹൂദയുടെ അപേക്ഷയിലെ നിർണായകമായ നിഗമനസ്വഭാവവും സമയസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֵשֶׁב נָא
  choice: ദയവായി ... ഇവിടെ കഴിയട്ടെ
  rationale: נָא ചേർന്ന അപേക്ഷാഭാവമുള്ള രൂപം വിനീതമായ അഭ്യർഥനയാണ്. സന്ദർഭത്തിൽ ‘ഇവിടെ കഴിയുക’ എന്നത് ബെന്യാമീന്റെ സ്ഥാനത്ത് ഈജിപ്തിൽ ശേഷിക്കുന്നതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: യെഹൂദ സ്വന്തം നില താഴ്ത്തി യോസേഫിനോടു നടത്തുന്ന ആദരപൂർവമായ അഭിസംബോധനയാണ്; ഇവിടെ നിർബന്ധിത അടിമത്തത്തെക്കാൾ രാജസദസ്സിലെ വിനയപ്രയോഗമാണ് മുൻനിൽക്കുന്നത്.
- source_word: תַּחַת הַנַּעַר
  choice: ഈ ബാലനു പകരം
  rationale: תַּחַת ഇവിടെ സ്ഥലപരമായ ‘കീഴിൽ’ എന്നല്ല, ഒരാളുടെ സ്ഥാനത്ത് മറ്റൊരാൾ എന്ന പകരക്കാരന്റെ അർഥത്തിലാണ്.
- source_word: הַנַּעַר
  choice: ഈ ബാലൻ
  rationale: בִּנְיָמִין പ്രായപൂർത്തിയാകാത്ത കൊച്ചുകുട്ടിയാണെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കാതെ, യെഹൂദയുടെ സംരക്ഷണാത്മകവും വികാരഭരിതവുമായ അവതരണം നിലനിർത്തുന്നു.
- source_word: עֶבֶד
  choice: അടിമയായി
  rationale: മുമ്പത്തെ ആദരസൂചകമായ ‘ദാസൻ’ എന്ന സ്വയംവിശേഷണത്തിൽനിന്ന് വ്യത്യസ്തമായി, ഇവിടെ യോസേഫിന്റെ വീട്ടിൽ യഥാർഥ ബന്ധിതസേവനത്തിൽ തുടരാനുള്ള സന്നദ്ധതയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לַאדֹנִי
  choice: എന്റെ യജമാനന്
  rationale: യോസേഫിനെ അഭിസംബോധന ചെയ്യുന്ന മാനുഷിക അധികാരപദവിയാണ്; ദൈവിക അർഥം വരുത്താതെ സാമൂഹിക ആദരം സംരക്ഷിക്കുന്നു.
- source_word: וְהַנַּעַר יַעַל
  choice: ബാലൻ ... കയറിപ്പോകട്ടെ
  rationale: അപേക്ഷാഭാവം തുടരുകയും עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന രൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘മടങ്ങിപ്പോകുക’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ആശയം ചേർക്കും.
- source_word: עִם אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടൊപ്പം
  rationale: കുടുംബബന്ധത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും വികാരഗൗരവമുള്ളതുമായ അപേക്ഷാശൈലി സ്വീകരിച്ചു. עבד എന്ന ഒരേ എബ്രായപദത്തിന്റെ സന്ദർഭാനുസൃതമായ രണ്ടു ഭാവങ്ങൾ വേർതിരിക്കാൻ ആദരസൂചക സ്വയംവിശേഷണത്തിൽ ‘ദാസൻ’ എന്നും യഥാർഥ ബന്ധിതനിലയിൽ ‘അടിമ’ എന്നും ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനങ്ങൾ അവയുടെ യഥാർഥ വിഷയങ്ങളോട് പൊരുത്തപ്പെടുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
