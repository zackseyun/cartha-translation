  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: ml
  text: അവൻ മൂത്തവനിൽ തുടങ്ങി ഇളയവനിൽ അവസാനിപ്പിച്ച് തിരച്ചിൽ നടത്തി; പാനപാത്രം ബെന്യാമീന്റെ ചാക്കിൽ കണ്ടെത്തപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കോപ്പ.” എബ്രായപദം ഒരു പാനപാത്രത്തെയോ കോപ്പയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: തിരച്ചിൽ നടത്തി
  rationale: സഹോദരന്മാരുടെ ചാക്കുകൾ ക്രമമായി പരിശോധിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: בַּגָּדוֹל הֵחֵל
  choice: മൂത്തവനിൽ തുടങ്ങി
  rationale: കുടുംബസന്ദർഭത്തിൽ גָּדוֹל പ്രായത്തിൽ മൂത്തവനെ സൂചിപ്പിക്കുന്നു; הֵחֵל തിരച്ചിലിന്റെ ആരംഭബിന്ദു വ്യക്തമാക്കുന്നു.
- source_word: וּבַקָּטֹן כִּלָּה
  choice: ഇളയവനിൽ അവസാനിപ്പിച്ച്
  rationale: മൂത്തവനോടുള്ള വൈരുധ്യത്തിൽ קָטֹן ഇളയവനെയാണ് സൂചിപ്പിക്കുന്നത്; כִּלָּה ക്രമപ്പെടുത്തിയ തിരച്ചിലിന്റെ അവസാനബിന്ദു നൽകുന്നു.
- source_word: וַיִּמָּצֵא
  choice: കണ്ടെത്തപ്പെട്ടു
  rationale: ഹീബ്രു നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു; ആരാണ് കണ്ടെത്തിയതെന്ന് സജീവവാക്യമായി അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: הַגָּבִיעַ
  choice: പാനപാത്രം
  rationale: പാനീയത്തിനുള്ള പ്രത്യേക പാത്രത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പദം; ‘പാനപാത്രം’ എന്നത് cup/goblet എന്നീ അർത്ഥവ്യാപ്തികളെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: בְּאַמְתַּחַת
  choice: ചാക്കിൽ
  rationale: ധാന്യവും യാത്രാസാധനങ്ങളും കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന സഞ്ചിയെ ഈ സന്ദർഭത്തിൽ ‘ചാക്ക്’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּנְיָמִן
  choice: ബെന്യാമീന്റെ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
