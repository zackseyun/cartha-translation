id: GEN.44.14
reference: Genesis 44:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: ml
  text: യഹൂദയും അവന്റെ സഹോദരന്മാരും യോസേഫിന്റെ വീട്ടിലേക്കു വന്നു. യോസേഫ് അപ്പോഴും അവിടെത്തന്നെ ഉണ്ടായിരുന്നു. അവർ അവന്റെ മുമ്പിൽ നിലംപറ്റെ വീണു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: നിരന്തര ആഖ്യാനത്തിലെ ലളിതമായ ഭൂതകാലപ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു; രംഗത്തിന്റെ ദൃഷ്ടികോണവും നിലനിർത്തുന്നു.
- source_word: יְהוּדָה וְאֶחָיו
  choice: യഹൂദയും സഹോദരന്മാരും
  rationale: യഹൂദയെ മുഖ്യവ്യക്തിയായി പ്രത്യേകം പേരെടുത്തുപറയുകയും കുടുംബബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בֵּיתָה יוֹסֵף
  choice: യോസേഫിന്റെ വീട്ടിലേക്കു
  rationale: בֵּיתָה എന്ന ദിശാസൂചക രൂപം വീട്ടിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പ്രവേശനം ഉൾക്കൊള്ളാമെങ്കിലും, എബ്രായത്തിലെ ദിശാഭാവം അമിതമായി നിർണയിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: യോസേഫ് അപ്പോഴും അവിടെത്തന്നെ ഉണ്ടായിരുന്നു
  rationale: עוֹדֶנּוּ സൂചിപ്പിക്കുന്ന തുടർച്ച ‘അപ്പോഴും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സർവനാമത്തിനു പകരം യോസേഫിന്റെ പേര് ആവർത്തിക്കുന്നു.
- source_word: וַיִּפְּלוּ
  choice: വീണു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘അവന്റെ മുമ്പിൽ നിലംപറ്റെ’ എന്ന പ്രയോഗം ആദരപൂർവമായ സാഷ്ടാംഗഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ
  rationale: ‘അവന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യം.
- source_word: אָרְצָה
  choice: നിലംപറ്റെ
  rationale: നിലത്തേക്കുള്ള താഴോട്ടുള്ള ചലനവും ശരീരം നിലത്തോടു ചേർന്ന ഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
