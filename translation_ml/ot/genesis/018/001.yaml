  source_fidelity: The draft correctly renders the visible appearance (וַיֵּרָא), the divine name, the reference to Abraham, the tent entrance, and the daytime heat. Its generic rendering of אֵלֹנֵי appropriately preserves the uncertain tree species, with alternatives in the footnote. However, “അപ്പോൾ” introduces a sequential sense not expressed by the Hebrew background clause וְהוּא יֹשֵׁב.
