source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: ml
  text: മമ്രേയിലെ വലിയ വൃക്ഷങ്ങൾക്കരികെ യഹ്‌വെ അവന് പ്രത്യക്ഷനായി.[a] അവൻ ദിവസത്തിന്റെ ചൂടിൽ കൂടാരവാതിൽക്കൽ ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മമ്രേയിലെ ഓക്ക് മരങ്ങൾക്കരികെ’ അഥവാ ‘മമ്രേയിലെ ടെറിബിന്ത് മരങ്ങൾക്കരികെ.’ എബ്രായപദം ഓക്ക്, ടെറിബിന്ത് എന്നിവ പോലുള്ള വലിയ വൃക്ഷങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൃശ്യമായ പ്രത്യക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെ എബ്രായത്തിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֵלָיו
  choice: അവന്
  rationale: മുൻസന്ദർഭത്തിലെ അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്ന മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ പൂർവപ്രത്യയം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּאֵלֹנֵי
  choice: വലിയ വൃക്ഷങ്ങൾക്കരികെവെച്ച്
  rationale: אֵלוֹן എന്ന പദം ഓക്ക് അഥവാ ടെറിബിന്ത് പോലുള്ള വലിയ വൃക്ഷങ്ങളെ സൂചിപ്പിക്കാം. ഇനം അനിശ്ചിതമായതിനാൽ പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ നൽകുകയും സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מַמְרֵא
  choice: മമ്രേ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְהוּא יֹשֵׁב
  choice: അപ്പോൾ അവൻ ... ഇരിക്കുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ നൽകുന്ന പശ്ചാത്തലസാഹചര്യം മലയാളത്തിലെ തുടർച്ചാഭൂതകാലരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരവാതിൽക്കൽ
  rationale: കൂടാരത്തിന്റെ തുറവിടം അഥവാ പ്രവേശനസ്ഥലം എന്ന മൂർത്തമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כְּחֹם הַיּוֹם
  choice: പകലിന്റെ ചൂടുസമയത്ത്
  rationale: ദിവസത്തിലെ ചൂടേറിയ സമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു; കൃത്യമായി ഉച്ചയെന്ന് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവികൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; 'യഹോവ' എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ സ്രോതസ്സിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്ത രൂപം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വൃക്ഷയിനത്തെക്കുറിച്ചുള്ള മൂലഭാഷയിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പൊതുപദം ഉപയോഗിച്ചും അടിക്കുറിപ്പിൽ പ്രത്യേക സാധ്യതകൾ നൽകിയുമാണ് സംരക്ഷിച്ചിരിക്കുന്നത്.
