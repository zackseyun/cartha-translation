  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: ml
  text: പിന്നെ അവൻ തൈരും പാലും താൻ തയ്യാറാക്കിയ കാളക്കുട്ടിയെയും എടുത്ത് അവരുടെ മുമ്പിൽ വെച്ചു. അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ അവൻ മരത്തിൻ കീഴെ അവരുടെ അടുത്ത് നിന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ മീതെ നിന്നു’; ഇവിടെ ഈ പ്രയോഗം ആതിഥേയനായി അവരുടെ അടുത്തുനിന്ന് അവരെ പരിചരിച്ചതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: തൈര്
  rationale: പുരാതന ഇടയജീവിതത്തിന്റെ പശ്ചാത്തലത്തിൽ കട്ടിയുള്ള പാൽവിഭവത്തെ സൂചിപ്പിക്കുന്ന പദമാണിത്. ആധുനിക മേശവെണ്ണ എന്ന ധാരണ ഒഴിവാക്കി, പാലിനോടൊപ്പം സ്വാഭാവികമായി വായിക്കാവുന്ന ‘തൈര്’ തിരഞ്ഞെടുത്തു.
- source_word: חָלָב
  choice: പാൽ
  rationale: പാൽ എന്ന സാധാരണ നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וּבֶן הַבָּקָר
  choice: കാളക്കുട്ടിയിറച്ചി
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിക്കൂട്ടത്തിലെ കുട്ടി’; മുൻവാക്യത്തിൽ തയ്യാറാക്കിയ മൃഗം ഭക്ഷണമായി മുന്നിൽ വെച്ചതായതിനാൽ മലയാളത്തിൽ ‘കാളക്കുട്ടിയിറച്ചി’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: താൻ തയ്യാറാക്കിയ
  rationale: עשה എന്നതിന് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന വിശാലമായ അർഥമുണ്ടെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ ‘തയ്യാറാക്കിയ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ വെച്ചു
  rationale: അതിഥികളുടെ മുമ്പിൽ ഭക്ഷണം കൊണ്ടുവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: അവൻ ... അവരുടെ സമീപത്ത് നിന്നു
  rationale: ആതിഥേയനായി അടുത്തുനിന്ന് അവരെ പരിചരിക്കുന്ന ആശയം നൽകുന്നു; ‘അവരുടെ മീതെ’ എന്ന അക്ഷരാർഥപരിഭാഷ മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കും.
- source_word: תַּחַת הָעֵץ
  choice: മരത്തിൻകീഴെ
  rationale: പൂർവപ്രത്യയവാക്യത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וַיֹּאכֵלוּ
  choice: അവർ ഭക്ഷിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: അവർ ഭക്ഷിക്കുന്ന സമയത്ത് അബ്രാഹാം സമീപത്ത് നിന്നു എന്ന കാലബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സന്ദർശകരുടെ പിന്നീടുള്ള ക്രിസ്തുശാസ്ത്രപരമോ ത്രിത്വപരമോ ആയ വ്യാഖ്യാനം ഈ വാക്യത്തിൽ മുൻനിരയിൽ കൊണ്ടുവരണമോ എന്നത്
  choice: വാക്യത്തെ അബ്രാഹാമിന്റെ ആതിഥ്യമര്യാദ വിവരിക്കുന്ന സാധാരണ ആഖ്യാനമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സന്ദർശകരുടെ ദൈവിക പദവി സൂചിപ്പിക്കുന്നവിധം പരിചരണഭാഷയ്ക്ക് കൂടുതൽ മഹത്ത്വഭാവം നൽകുക.
  rationale: എബ്രായവാക്യം ഇവിടെ അബ്രാഹാം അതിഥികൾക്ക് ഭക്ഷണം വിളമ്പി സമീപത്ത് നിൽക്കുന്നതാണ് വിവരിക്കുന്നത്; വാക്യത്തിൽ വ്യക്തമല്ലാത്ത പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. חֶמְאָה എന്ന പദത്തിന്റെ കൃത്യമായ പാൽവിഭവം അനിശ്ചിതമാണെങ്കിലും മുഖ്യപാഠത്തിൽ ‘തൈര്’ ഉപയോഗിച്ചു. ‘അവരുടെ സമീപത്ത്’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
