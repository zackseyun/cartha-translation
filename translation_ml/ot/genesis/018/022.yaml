id: GEN.18.22
reference: Genesis 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: ml
  text: അപ്പോൾ ആ പുരുഷന്മാർ അവിടെനിന്ന് തിരിഞ്ഞ് സൊദോമിലേക്കു പോയി; എന്നാൽ അബ്രാഹാം അപ്പോഴും യഹോവയുടെ മുമ്പിൽ നിൽക്കുകയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പുരാതന പാഠസാക്ഷ്യങ്ങളിൽ അവസാന ഭാഗം, “യഹോവ അപ്പോഴും അബ്രാഹാമിന്റെ മുമ്പിൽ നിൽക്കുകയായിരുന്നു” എന്നു വായിക്കുന്നു. എബ്രായ മസോററ്റിക് പാഠത്തിൽ, “അബ്രാഹാം അപ്പോഴും യഹോവയുടെ മുമ്പിൽ നിൽക്കുകയായിരുന്നു” എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: തിരിഞ്ഞ്
  rationale: പנה എന്ന ക്രിയ ഇവിടെ ദിശ മാറ്റി പുറപ്പെടുന്ന കഥാഗതിയെ സൂചിപ്പിക്കുന്നു; ‘തിരിഞ്ഞ്’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലസൂചകമായ പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇവരുടെ സ്വഭാവത്തെക്കുറിച്ച് കൂടുതൽ അർത്ഥസൂചനകളുണ്ടെങ്കിലും എബ്രായപദം നേരിട്ട് ‘പുരുഷന്മാർ’ എന്നാണ്; വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ഗമനക്രിയയ്ക്ക് കഥാഖ്യാനത്തിൽ സ്വാഭാവികമായ മലയാളപരിഭാഷ.
- source_word: סְדֹמָה
  choice: സൊദോമിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന directional he ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്നു; ‘-ലേക്കു’ ആ സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: עוֹדֶנּוּ
  choice: അപ്പോഴും
  rationale: തുടർച്ചയായ നിലയെ സൂചിപ്പിക്കുന്ന പദം; മുൻസംഭവത്തോടുള്ള ബന്ധവും അവസ്ഥ തുടരുന്നതും ‘അപ്പോഴും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ തുടർന്നുകൊണ്ടിരുന്ന നിലയെ വിവരിക്കുന്നു; മലയാളത്തിലെ അപൂർണഭൂതരൂപം ആ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ‘മുന്നിൽ/സാന്നിധ്യത്തിൽ’ എന്ന സ്ഥലപരവും ബന്ധപരവുമായ അർത്ഥങ്ങൾ സംരക്ഷിക്കുന്ന സംക്ഷിപ്ത രൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ നാമരൂപം സ്വീകരിച്ചു.
- issue: അവസാന ഉപവാക്യത്തിന്റെ പാഠരൂപം
  choice: അബ്രാഹാം അപ്പോഴും യഹോവയുടെ മുമ്പിൽ നിൽക്കുകയായിരുന്നു
  alternative: യഹോവ അപ്പോഴും അബ്രാഹാമിന്റെ മുമ്പിൽ നിൽക്കുകയായിരുന്നു
  rationale: നൽകിയിരിക്കുന്ന WLC മസോററ്റിക് പാഠം അബ്രാഹാമാണ് യഹോവയുടെ മുമ്പിൽ നിൽക്കുന്നതെന്ന് വായിക്കുന്നു. ചില പുരാതന സാക്ഷ്യങ്ങളിലെ വിപരീതവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥാഖ്യാനശൈലി. ‘ആ പുരുഷന്മാർ’ എന്നത് മൂലപാഠത്തിന്റെ ഉപരിതലവാചകം സംരക്ഷിക്കുന്നു; ‘നിൽക്കുകയായിരുന്നു’ തുടർന്നുനിന്ന അവസ്ഥ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട ചലനവാക്യത്തിന്റെ അവസാനം നൽകിയെങ്കിലും കുറിപ്പ് വാക്യത്തിന്റെ അവസാന ഉപവാക്യത്തിലെ പാഠഭേദം വിശദീകരിക്കുന്നു.
