id: GEN.18.33
reference: Genesis 18:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: ml
  text: യാഹ്‌വേ അബ്രാഹാമിനോടു സംസാരിച്ചു തീർന്നപ്പോൾ പോയി[a]; അബ്രാഹാം തന്റെ സ്ഥലത്തേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH.’ ഈ ദൈവനാമം ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവിടെനിന്നു പോയി
  rationale: הלך ഇവിടെ കൂടിക്കാഴ്ച അവസാനിപ്പിച്ചുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവിടെനിന്നു പോയി’ എന്നത് ചലനവും സന്ദർഭത്തിലെ വിടവാങ്ങലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: പ്പോൾ
  rationale: ഇവിടെ പുറപ്പെടലിന്റെ സമയസാഹചര്യമാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പ്പോൾ’ അതിന്റെ കാലികബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּלָּה לְדַבֵּר
  choice: സംസാരിച്ചു തീർന്നപ്പോൾ
  rationale: כלה കൂടിയുള്ള ക്രിയാനാമരൂപം സംസാരപ്രവൃത്തി പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു; ‘സംസാരിച്ചു തീർന്നു’ ആ പൂർത്തീകരണം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶל אַבְרָהָם
  choice: അബ്രാഹാമിനോട്
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചന മലയാളത്തിലെ സംസാരക്രിയയോടു സ്വാഭാവികമായ ‘-നോട്’ രൂപത്തിൽ നൽകി.
- source_word: שָׁב
  choice: മടങ്ങി
  rationale: שׁוב ഇവിടെ മുമ്പുണ്ടായിരുന്ന ഇടത്തേക്കുള്ള തിരിച്ചുപോക്കിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങി’ സംക്ഷിപ്തവും കൃത്യവുമാണ്.
- source_word: לִמְקֹמוֹ
  choice: തന്റെ സ്ഥലത്തേക്ക്
  rationale: מקום എന്നതിനെ ‘വീട്’ എന്നു പ്രത്യേകീകരിക്കാതെ അതിന്റെ പൊതുവായ അർത്ഥമായ ‘സ്ഥലം’ നിലനിർത്തി. പ്രതിഫലനസൂചന വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ ഒരു ബിരുദമല്ല, YHWH എന്ന വ്യക്തിനാമമാണ്. മലയാളത്തിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ ലിപ്യന്തരണം ‘യഹോവ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റൊരു ശാസ്ത്രീയ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തന്റെ സ്ഥലം’ എന്ന മൂലപാഠത്തിലെ പൊതുവായ പ്രയോഗം നിലനിർത്തി; ‘വീട്’ എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
