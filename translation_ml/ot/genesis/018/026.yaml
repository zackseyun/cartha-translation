revisions:
- from: 'യഹ്വേ പറഞ്ഞു: “സൊദോമിൽ, നഗരത്തിനുള്ളിൽ, നീതിമാന്മാരായ അമ്പതുപേരെ ഞാൻ കണ്ടെത്തിയാൽ, അവരെപ്രതി ആ സ്ഥലം മുഴുവനെയും ഞാൻ വെറുതെവിടും[a].”'
  to: 'യഹ്വേ പറഞ്ഞു: “സൊദോം നഗരത്തിൽ നീതിമാന്മാരായ അമ്പതുപേരെ ഞാൻ കണ്ടെത്തിയാൽ, അവരുടെ നിമിത്തം ആ സ്ഥലം മുഴുവനെയും ഞാൻ ഒഴിവാക്കും[a].”'
  rationale: The revision retains the Hebrew conditional structure, the fifty righteous persons, the divine name, and the comprehensive scope of ‘the whole place.’ It uses more natural modern Malayalam for the urban setting, the beneficiaries, and especially the contextual sense of withholding judgment, while retaining the forgiveness sense in the footnote.
