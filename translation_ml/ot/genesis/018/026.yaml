  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: ml
  text: 'യഹ്വേ പറഞ്ഞു: “സൊദോം നഗരത്തിൽ നീതിമാന്മാരായ അമ്പതുപേരെ ഞാൻ കണ്ടെത്തിയാൽ, അവരുടെ നിമിത്തം ആ സ്ഥലം മുഴുവനെയും ഞാൻ ഒഴിവാക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ നിമിത്തം ആ സ്ഥലം മുഴുവനോടും ഞാൻ ക്ഷമിക്കും.” ഹീബ്രു ക്രിയയ്ക്ക് കുറ്റം നീക്കുക, ക്ഷമിക്കുക, അല്ലെങ്കിൽ വിധി നടപ്പാക്കാതിരിക്കുക എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം; ഇവിടെ സന്ദർഭം കണക്കിലെടുത്ത് “ഒഴിവാക്കും” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വാക്യാരംഭത്തിൽ നിർബന്ധമല്ലാത്ത ‘അപ്പോൾ/എന്നിട്ട്’ ചേർത്തിട്ടില്ല.
- source_word: אִם אֶמְצָא
  choice: ഞാൻ കണ്ടെത്തിയാൽ
  rationale: നിബന്ധനയുടെ നേരിട്ടുള്ള അർഥവും ഒന്നാംപുരുഷ കർത്താവും നിലനിർത്തുന്നു.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: സൊദോമിൽ, നഗരത്തിനുള്ളിൽ
  rationale: സൊദോമിനെയും നഗരത്തിന്റെ അകത്തളത്തെയും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രണ്ടു സ്ഥാനപ്രയോഗങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: നീതിമാന്മാരായ അമ്പതുപേരെ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ ലിംഗം അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְנָשָׂאתִי
  choice: ഞാൻ വെറുതെവിടും
  rationale: נשא എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ വഹിക്കുക/എടുത്തുകൊണ്ടുപോകുക എന്ന പരിധിയിൽ നിന്ന്, ഇവിടെ ന്യായവിധി നടപ്പാക്കാതിരിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ക്ഷമിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְכָל הַמָּקוֹם
  choice: ആ സ്ഥലം മുഴുവനെയും
  rationale: വിധിക്കു വിധേയമായ മുഴുവൻ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בַּעֲבוּרָם
  choice: അവരെപ്രതി
  rationale: നീതിമാന്മാരെ പരിഗണിച്ചുകൊണ്ട്/അവരുടെ നിമിത്തം എന്ന കാരണപരവും പ്രയോജനപരവുമായ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וְנָשָׂאתִי എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ഞാൻ വെറുതെവിടും
  alternative: ഞാൻ ക്ഷമിക്കും
  rationale: സൊദോമിനെ നശിപ്പിക്കാതിരിക്കുന്നതിനെക്കുറിച്ചുള്ള സംഭാഷണത്തിൽ ‘വെറുതെവിടും’ എന്നത് വിധി തടഞ്ഞുവയ്ക്കുന്ന ഭാവം വ്യക്തമാക്കുന്നു; കുറ്റക്ഷമയുടെ സാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സൊദോമിൽ, നഗരത്തിനുള്ളിൽ’ എന്ന ആവർത്തനസദൃശ ഘടന മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ സംരക്ഷിച്ചു; ദൈവനാമം ‘യഹ്വേ’ എന്നു നൽകി.
