translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ വേഗതയേറിയ പ്രവർത്തനക്രമവും ‘അവൻ’ എന്ന കർത്താവിലെ സ്വാഭാവിക സന്ദർഭബന്ധവും നിലനിർത്തി.
