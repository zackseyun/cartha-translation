  text: וְ/אֶל הַ/בָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַ/יִּקַּ֨ח בֶּן בָּקָ֜ר רַ֤ךְ וָ/טוֹב֙ וַ/יִּתֵּ֣ן אֶל הַ/נַּ֔עַר וַ/יְמַהֵ֖ר לַ/עֲשׂ֥וֹת אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: ml
  text: അബ്രാഹാം കന്നുകാലികളുടെ കൂട്ടത്തിലേക്ക് ഓടിച്ചെന്ന്, മൃദുവും നല്ലതുമായ ഒരു കിടാവിനെ എടുത്ത് യുവാവിന്[a] കൊടുത്തു. യുവാവ് അത് ഒരുക്കാൻ തിടുക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസൻ’ എന്നോ ‘ബാലൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ הַנַּעַר സന്ദർഭമനുസരിച്ച് ഒരു യുവാവിനെയോ ബാലനെയോ ദാസനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: കന്നുകാലിക്കൂട്ടം
  rationale: ഈ പദം ഇവിടെ ഒറ്റ മൃഗത്തെയല്ല, പശുവർഗത്തിൽപ്പെട്ട വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കന്നുകാലിക്കൂട്ടം’ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רָץ
  choice: ഓടിച്ചെന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ഓട്ടം നിലനിർത്തുകയും അബ്രാഹാമിന്റെ ആതിഥ്യമര്യാദയിലെ തിടുക്കം സജീവമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בֶּן־בָּקָר
  choice: ഒരു കിടാവ്
  rationale: അക്ഷരാർഥത്തിൽ ‘കന്നുകാലിയുടെ മകൻ’ എന്ന ഈ എബ്രായ പ്രയോഗം ഒരു ഇളം പശുവർഗമൃഗത്തെ സൂചിപ്പിക്കുന്നു; ഭക്ഷണം ഒരുക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘കിടാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: רַךְ וָטוֹב
  choice: ഇളംതും നല്ലതുമായ
  rationale: רַךְ സൂചിപ്പിക്കുന്ന മൃദുത്വം/ഇളംപ്രായം ‘ഇളം’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; טוֹב ഗുണമേന്മയെയും അനുയോജ്യതയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘നല്ല’ എന്ന് നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: യുവാവ്
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, ദാസൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭം സേവകനെ സൂചിപ്പിക്കാമെങ്കിലും, പ്രധാനവാചകത്തിൽ ‘യുവാവ്’ എന്നത് അടിസ്ഥാന പദാർഥം നിലനിർത്തുകയും വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמַהֵר
  choice: തിടുക്കപ്പെട്ടു
  rationale: വേഗത്തിൽ പ്രവർത്തിച്ചു എന്ന അർഥവും ആതിഥ്യമൊരുക്കുന്നതിലെ അടിയന്തരതയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: അതിനെ പാകംചെയ്യാൻ
  rationale: עשה സാധാരണയായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, ഭക്ഷണം ഒരുക്കുന്ന സന്ദർഭത്തിൽ മൃഗത്തെ ഭക്ഷണത്തിനായി തയ്യാറാക്കുക എന്ന അർഥമാണ്; ‘പാകംചെയ്യാൻ’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
