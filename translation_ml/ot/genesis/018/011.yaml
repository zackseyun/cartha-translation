  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: ml
  text: അബ്രാഹാമും സാറയും വൃദ്ധരായിരുന്നു; അവർ പ്രായം വളരെ ചെന്നവരായിരുന്നു. സ്ത്രീകൾക്കുള്ള പതിവ് സാറയ്ക്ക് നിലച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘സ്ത്രീകളുടെ വഴി’; സാറയ്ക്ക് ഇനി ആർത്തവമുണ്ടായിരുന്നില്ലെന്ന് സൂചിപ്പിക്കുന്ന മാന്യമായ പരോക്ഷപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: വൃദ്ധരായിരുന്നു
  rationale: വാർധക്യത്തിലെത്തിയവരെന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: בָּאִים בַּיָּמִים
  choice: പ്രായം വളരെ ചെന്നവരായിരുന്നു
  rationale: ‘ദിവസങ്ങളിൽ ചെന്നവർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വാർധക്യസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: חָדַל לִהְיוֹת
  choice: നിലച്ചിരുന്നു
  rationale: മുമ്പുണ്ടായിരുന്നത് അവസാനിച്ചുവെന്ന חָדַל എന്ന ക്രിയയുടെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֹרַח כַּנָּשִׁים
  choice: സ്ത്രീകൾക്കുള്ള പതിവ്
  rationale: ആർത്തവത്തെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ മാന്യമായ പരോക്ഷപ്രയോഗം മലയാളത്തിലും പരോക്ഷമായി നിലനിർത്തുന്നു.
- source_word: לְשָׂרָה
  choice: സാറയ്ക്ക്
  rationale: ഈ അവസ്ഥ സാറയുടെ കാര്യത്തിൽ ഇനി ഉണ്ടായിരുന്നില്ലെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
