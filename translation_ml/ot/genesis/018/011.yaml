translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാർധക്യത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തനവും ആർത്തവത്തെക്കുറിച്ചുള്ള മൂലഭാഷയുടെ പരോക്ഷതയും സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
