source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: ml
  text: 'അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: “എന്റെ കർത്താവേ[a], ദയവായി കോപിക്കരുതേ; ഞാൻ ഇനിയും സംസാരിക്കട്ടെ. ഒരുപക്ഷേ മുപ്പതുപേർ അവിടെ കണ്ടെത്തപ്പെടുന്നുണ്ടെങ്കിൽ?” അവിടുന്ന് പറഞ്ഞു: “അവിടെ മുപ്പതുപേരെ കണ്ടെത്തിയാൽ ഞാൻ അതു ചെയ്യുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ യജമാനനേ.” ഹീബ്രു പദം ആദരപൂർവമായ ഒരു അഭിസംബോധനയായും വായിക്കാം; ഈ സന്ദർഭത്തിൽ അഭിസംബോധിതൻ കർത്താവാണെന്ന് മനസ്സിലാക്കുന്നതിനാലാണ് ഇവിടെ “എന്റെ കർത്താവേ” എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: ദയവായി കോപിക്കരുതേ
  rationale: നിഷേധകണമായ אַל, വിനയപൂർവമായ അപേക്ഷ സൂചിപ്പിക്കുന്ന נָא, കോപം ജ്വലിക്കുക എന്ന ആശയമുള്ള חרה എന്നിവ ചേർന്ന പ്രയോഗത്തിന്റെ അപേക്ഷാഭാവവും അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַאדֹנָי
  choice: എന്റെ കർത്താവേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ആദരസൂചക അഭിസംബോധനയാണ്. സന്ദർഭത്തിൽ അബ്രാഹാം ദൈവിക സംവാദിയെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; എങ്കിലും പദം ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ സാധ്യതയുള്ള സാധാരണ ആദരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַאֲדַבֵּרָה
  choice: ഞാൻ ഇനിയും സംസാരിക്കട്ടെ
  rationale: ഹീബ്രു cohortative വിനയപൂർവം തുടർന്നു സംസാരിക്കാനുള്ള അഭ്യർഥനയെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘സംസാരിക്കട്ടെ’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭസൂചനയ്ക്കായി ‘ഇനിയും’ ചേർത്തിരിക്കുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: അബ്രാഹാമിന്റെ സൂക്ഷ്മവും വിനയപൂർവവുമായ സങ്കൽപ്പപ്രസ്താവനയുടെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: יִמָּצְאוּן
  choice: കണ്ടെത്തിയേക്കാം
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘കാണപ്പെടുക/കണ്ടെത്തപ്പെടുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ സാധ്യതാപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാള തുല്യം.
- source_word: שְׁלֹשִׁים
  choice: മുപ്പതുപേർ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; സന്ദർഭത്തിൽ എണ്ണപ്പെടുന്നത് മനുഷ്യരായതിനാൽ മലയാളത്തിൽ വ്യക്തിസൂചകമായ ‘പേർ’ ചേർക്കുന്നു.
- source_word: לֹא אֶעֱשֶׂה
  choice: ഞാൻ അതു ചെയ്യുകയില്ല
  rationale: ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; മുൻസന്ദർഭത്തിലെ നഗരനാശത്തെ സൂചിപ്പിക്കുന്നതായിരുന്നാലും അതിനെ തുറന്നു വിശദീകരിക്കാതെ ‘അത്’ എന്നു നൽകി മൂലത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: אִם אֶמְצָא
  choice: കണ്ടെത്തിയാൽ
  rationale: സാധാരണ ഉപാധിവാക്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ അഭിസംബോധനയിലെ אֲדֹנָי എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ കർത്താവേ
  alternative: എന്റെ യജമാനനേ / പ്രഭോ
  rationale: ദൈവിക സംവാദിയാണ് ഇവിടെ അഭിസംബോധിതൻ എന്നു സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘കർത്താവേ’ സ്വീകരിച്ചു. എന്നാൽ ഹീബ്രു രൂപം ആദരസൂചകമായി ഒരു മനുഷ്യ മേലധികാരിയെയും അഭിസംബോധന ചെയ്യാൻ കഴിയുന്നതിനാൽ ആ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ ഇല്ലാത്ത ദൈവനാമം വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. അബ്രാഹാമിന്റെ വിനയവും അപേക്ഷാഭാവവും ‘ദയവായി’, ‘സംസാരിക്കട്ടെ’ എന്നിവയിലൂടെ പ്രകടമാക്കി. ദൈവത്തിന്റെ മറുപടിയിൽ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചെങ്കിലും ഹീബ്രു പാഠത്തിന്റെ സംക്ഷിപ്തതയും നാശത്തെ നേരിട്ട് വിശദീകരിക്കാത്ത സ്വഭാവവും നിലനിർത്തി.
