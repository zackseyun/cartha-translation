  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട്, “നിന്റെ ഭാര്യ സാറാ എവിടെ?” എന്നു ചോദിച്ചു. അവൻ പറഞ്ഞു: “അതാ, അവൾ കൂടാരത്തിൽ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ അവർ ... ചോദിച്ചു
  rationale: ബഹുവചന കർത്താവിനെയും തുടർച്ചയായ ആഖ്യാനക്രമത്തെയും നിലനിർത്തുന്നു. നേരിട്ടുള്ള ചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ ഉപയോഗിച്ചു.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: אֶל എന്ന ദിശാസൂചക പദവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַיֵּה
  choice: എവിടെ?
  rationale: സ്ഥാനം അന്വേഷിക്കുന്ന ചോദ്യം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: שָׂרָה
  choice: സാറാ
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു രൂപമായ שָׂרָהയെ അനുസരിച്ചുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: אִשְׁתֶּךָ
  choice: നിന്റെ ഭാര്യ
  rationale: ‘ഭാര്യ’ എന്ന ബന്ധാർത്ഥവും രണ്ടാംപുരുഷ പുല്ലിംഗ ഏകവചന ഉടമസ്ഥപ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ബഹുവചനമായ മുൻവാക്യത്തിൽനിന്ന് അബ്രാഹാമിന്റെ ഏകവചന മറുപടിയിലേക്കുള്ള മാറ്റം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ഒരു സ്ഥലത്തേക്കു തിരിക്കുന്ന ദൈക്തിക ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; വ്യക്തമല്ലാത്ത കർത്താവും ക്രിയയും അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: בָאֹהֶל
  choice: കൂടാരത്തിൽ
  rationale: നിശ്ചിത കൂടാരത്തിനുള്ളിലാണെന്ന സ്ഥലാർഥം ലളിതമായി നൽകുന്നു; മലയാളത്തിൽ സന്ദർഭം നിശ്ചിതത്വം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക നിർദേശകം ആവശ്യമില്ല.
