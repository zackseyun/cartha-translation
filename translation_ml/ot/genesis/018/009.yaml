translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്ത മറുപടിയും הִנֵּהയുടെ ദൈക്തിക ഊന്നലും ‘അതാ, കൂടാരത്തിൽ’ എന്നു സംരക്ഷിച്ചു.
