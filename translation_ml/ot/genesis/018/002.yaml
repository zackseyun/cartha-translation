source:
  edition: WLC
  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: ml
  text: അവൻ കണ്ണുകൾ ഉയർത്തി നോക്കി; അതാ, മൂന്നു പുരുഷന്മാർ അവന്റെ അടുത്ത് നിന്നിരുന്നു.[a] അവരെ കണ്ടപ്പോൾ, അവൻ കൂടാരവാതിൽക്കൽനിന്ന് അവരെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന് നിലത്തേക്കു കുനിഞ്ഞു വണങ്ങി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ തൊട്ടരികിൽ’; എബ്രായ ബന്ധപദം വളരെ അടുത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിലംവരെ സാഷ്ടാംഗം വീണു.’ ഈ ക്രിയ ആഴമായ ആദരവിന്റെ ഒരു ശാരീരികഭാവത്തെ വിവരിക്കുന്നു; അതിന് സ്വതവേ ‘ആരാധിച്ചു’ എന്ന അർഥം നിർബന്ധമില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: അവൻ കണ്ണുകളുയർത്തി നോക്കി
  rationale: എബ്രായഭാഷയിലെ ദൃശ്യമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കഥനത്തിൽ പെട്ടെന്നുള്ള ശ്രദ്ധയും സജീവമായ അവതരണവും സൂചിപ്പിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: മൂന്നു പുരുഷന്മാർ
  rationale: മൂലപാഠം വ്യക്തമായി ‘പുരുഷന്മാർ’ എന്നു പറയുന്നതിനാൽ ലിംഗനിർണ്ണയം മങ്ങിയതാക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: נִצָּבִים עָלָיו
  choice: അവന്റെ അടുത്ത് നിൽക്കുന്നു
  rationale: עַל എന്ന ബന്ധപദം ഇവിടെ അടുത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കാം; ‘മുകളിൽ’ എന്ന പരിഭാഷ സന്ദർഭത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാവുന്നതിനാൽ സ്വാഭാവികമായ സമീപ്യാർഥം സ്വീകരിച്ചു.
- source_word: וַיַּרְא
  choice: അവരെ കണ്ടപ്പോൾ
  rationale: രണ്ടാമത്തെ ദർശനക്രിയ അബ്രാഹാമിന്റെ തുടർന്നുള്ള പ്രതികരണത്തിലേക്കുള്ള സമയബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: അവരെ എതിരേൽക്കാൻ ഓടിച്ചെന്ന്
  rationale: ക്രിയയുടെ വ്യക്തമായ ‘ഓടുക’ എന്ന അർഥവും അബ്രാഹാമിന്റെ ഉത്സാഹമുള്ള പ്രതികരണവും സംരക്ഷിക്കുന്നു.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: കൂടാരവാതിൽക്കൽനിന്ന്
  rationale: കൂടാരത്തിന്റെ പ്രവേശനസ്ഥലത്തെ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: നിലംവരെ കുനിഞ്ഞു വണങ്ങി
  rationale: ആഴമായ ആദരവിന്റെ ശാരീരികഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ ക്രിയയ്ക്ക് സ്വതവേ ഇല്ലാത്ത ‘ആരാധിച്ചു’ എന്ന പ്രത്യേക മതപരമായ അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ വണക്കം ദൈവാരാധനയായി പരിഭാഷപ്പെടുത്തണമോ
  choice: നിലംവരെ കുനിഞ്ഞു വണങ്ങി
  alternative: ആരാധിച്ചു
  rationale: എബ്രായക്രിയ മനുഷ്യരുടെയോ ദൈവത്തിന്റെയോ മുമ്പിലുള്ള ആദരപൂർവമായ സാഷ്ടാംഗവണക്കത്തെ സൂചിപ്പിക്കാം. ഈ വാക്യത്തിൽ സന്ദർശകർ ‘മൂന്നു പുരുഷന്മാർ’ എന്നാണു അവതരിപ്പിക്കപ്പെടുന്നത്; അതിനാൽ ‘ആരാധിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് പാഠം ഇനിയും വ്യക്തമായി തീർപ്പാക്കാത്ത ദൈവശാസ്ത്രപരമായ ചോദ്യത്തിന് മുൻകൂട്ടി ഉത്തരം നൽകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘അതാ’ എന്നത് മൂലപാഠത്തിന്റെ സജീവമായ അവതരണം നിലനിർത്തുന്നു; ‘വണങ്ങി’ എന്നത് മതപരമായ വ്യാഖ്യാനം മുൻകൂട്ടി നിർണ്ണയിക്കാതെ ആദരസൂചകമായ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
