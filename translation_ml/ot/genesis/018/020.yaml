id: GEN.18.20
reference: Genesis 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വെ പറഞ്ഞു: “സൊദോമിനും ഗൊമോറയ്ക്കും എതിരെയുള്ള നിലവിളി വലിയതാണ്[a]; അവരുടെ പാപം അത്യന്തം ഗുരുതരമാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സൊദോമിന്റെയും ഗൊമോറയുടെയും നിലവിളി വലിയതാണ്.” ഹീബ്രു പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; പ്രധാനപാഠം ആ നിലവിളി അവർക്കെതിരായി ഉയർന്നതാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവരുടെ പാപം അത്യന്തം ഭാരമുള്ളതാണ്.” ഹീബ്രുവിൽ അക്ഷരാർഥം ‘വളരെ ഭാരമുള്ളത്’ എന്നാണ്; പാപത്തിന്റെ അതിഗൗരവത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: സൊദോമിനും ഗൊമോറയ്ക്കും എതിരെയുള്ള നിലവിളി
  rationale: זַעֲקָה ഗുരുതരമായ അനീതിയെയോ പീഡനത്തെയോ കുറിച്ച് ഉയരുന്ന നിലവിളിയെ സൂചിപ്പിക്കാം. ബന്ധരൂപം അക്ഷരാർഥത്തിൽ ‘സൊദോമിന്റെയും ഗൊമോറയുടെയും നിലവിളി’ എന്നാകാമെങ്കിലും, സന്ദർഭത്തിലെ അവർക്കെതിരായ പരാതിയുടെ ആശയം പ്രധാനപാഠം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי רָבָּה
  choice: വലിയതാണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന ക്രിയാവിശേഷണം ‘നിലവിളി’യുടെ വ്യാപ്തിയോ തീവ്രതയോ വലുതാണെന്ന് പറയുന്നു; ‘വലിയതാണ്’ അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: וְחַטָּאתָם
  choice: അവരുടെ പാപം
  rationale: חַטָּאת ഇവിടെ ജനങ്ങളുടെ ദുഷ്പ്രവൃത്തിയെ സമാഹാര ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നു; ‘അവരുടെ പാപം’ അത് നേരിട്ട് പകരുന്നു.
- source_word: כִּי כָבְדָה מְאֹד
  choice: അത്യന്തം ഗുരുതരമാണ്
  rationale: כבד എന്നതിന്റെ അടിസ്ഥാന ആശയം ‘ഭാരമുള്ളത്’ എന്നാണെങ്കിലും, നൈതിക-ന്യായവിധി സന്ദർഭത്തിൽ പാപത്തിന്റെ അതിഗൗരവം സൂചിപ്പിക്കുന്നു. ‘അത്യന്തം ഗുരുതരമാണ്’ ആ പ്രയോഗാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: സൊദോമിന്റെയും ഗൊമോറയുടെയും ‘നിലവിളി’ ആരെ സംബന്ധിച്ചതാണ്
  choice: അവർക്കെതിരെയുള്ള നിലവിളി
  alternative: അവരുടെ നിലവിളി
  rationale: ഹീബ്രു ബന്ധരൂപം വ്യാകരണപരമായി രണ്ടുവിധത്തിൽ മനസ്സിലാക്കാനാകാം. സന്ദർഭം നഗരങ്ങളിലെ ദുഷ്ടതയെക്കുറിച്ച് ഉയർന്ന പരാതിയെ പിന്തുണയ്ക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ ‘എതിരെയുള്ള’ എന്നു വ്യക്തമാക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിലവിളി’, ‘പാപം’, ‘ഗുരുതരം’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ബന്ധരൂപത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
