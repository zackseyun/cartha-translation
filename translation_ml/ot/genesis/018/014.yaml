id: GEN.18.14
reference: Genesis 18:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: ml
  text: “യഹ്‌വേക്കു പ്രയാസകരമായ എന്തെങ്കിലും ഉണ്ടോ?[a] നിശ്ചിത സമയത്ത് ഞാൻ നിന്റെ അടുക്കൽ മടങ്ങിവരും—അടുത്ത വർഷം ഇതേ കാലത്ത്; സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹ്‌വേക്കു അത്ഭുതകരമായ എന്തെങ്കിലും ഉണ്ടോ?” എബ്രായക്രിയയ്ക്ക് അസാധാരണമോ അത്ഭുതകരമോ ഒരാളുടെ കഴിവിന് അതീതമോ ആയത് എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא מֵיְהוָה דָּבָר
  choice: യഹ്‌വേക്കു ചെയ്യാൻ കഴിയാത്തതായി എന്തെങ്കിലും ഉണ്ടോ?
  rationale: പלא എന്ന ക്രിയയുടെ നിഫാൽ രൂപം അത്ഭുതകരമോ അസാധാരണമോ ഒരാളുടെ കഴിവിന് അതീതമോ ആയതിനെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ വാഗ്‌ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘ചെയ്യാൻ കഴിയാത്തതായി’ എന്നു നൽകി; ‘അസാധ്യം’ എന്നതിനെക്കാൾ ഇത് എബ്രായത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല. പദത്തിന്റെ ‘അത്ഭുതകരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ഉറവിടത്തിൽ ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לַמּוֹעֵד
  choice: നിശ്ചയിച്ച സമയത്ത്
  rationale: מוֹעֵד ഇവിടെ മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു. ഈ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: ഞാൻ നിന്റെ അടുക്കൽ മടങ്ങിവരും
  rationale: שׁוּב എന്നതിന്റെ മടങ്ങിവരുക എന്ന അടിസ്ഥാനാർഥവും אֵלֶיךָ എന്ന ഏകവചന പുരുഷസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: כָּעֵת חַיָּה
  choice: അടുത്ത വർഷം ഇതേ കാലത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ദുഷ്കരമായ ‘ജീവന്റെ സമയം’ എന്ന എബ്രായ ശൈലി ഈ സന്ദർഭത്തിൽ അടുത്ത വർഷത്തിലെ ഇതേ കാലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രധാനവാചകത്തിൽ വ്യക്തമായ കാലസൂചന നൽകി, മൂലശൈലി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וּלְשָׂרָה בֵן
  choice: സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും
  rationale: എബ്രായത്തിൽ ക്രിയയില്ലാത്ത ഈ ഉപവാക്യം സന്ദർഭത്തിൽ ഭാവിയിലെ വാഗ്ദത്തഫലമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയവാക്യമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: ദൈവനാമം יְהוָה എങ്ങനെ നൽകണം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം പൊതുനാമമല്ല, ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ വ്യക്തിനാമത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്ന ‘യഹ്‌വേ’ സ്വീകരിച്ചു.
- issue: വാഗ്‌ചോദ്യത്തിലെ פלא എന്ന ക്രിയയുടെ ശക്തി
  choice: യഹ്‌വേക്കു ചെയ്യാൻ കഴിയാത്തതായി എന്തെങ്കിലും ഉണ്ടോ?
  alternative: യഹ്‌വേക്കു അത്ഭുതകരമായത് എന്തെങ്കിലും ഉണ്ടോ? / യഹ്‌വേക്കു അസാധ്യമായി എന്തെങ്കിലും ഉണ്ടോ?
  rationale: ചോദ്യം വാഗ്ദത്തം നിറവേറ്റാനുള്ള യഹ്‌വേയുടെ കഴിവിനെ ഊന്നുന്നു. ‘കഴിയാത്തതായി’ എന്ന പ്രയോഗം ആ ആശയം വ്യക്തമാക്കുമ്പോഴും ‘അസാധ്യം’ എന്ന ദാർശനികമായി കൂടുതൽ ശക്തമായ പദം മൂലത്തിൽ അനാവശ്യമായി ചുമത്തുന്നില്ല; ‘അത്ഭുതകരം’ എന്ന യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക പ്രസംഗത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നതിനൊപ്പം ദുഷ്കരമായ എബ്രായ ശൈലികൾ പ്രധാനവാചകത്തിൽ വ്യക്തമായി നൽകി; യഥാർഥ പദവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
