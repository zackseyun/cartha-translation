    rationale: ഇത് മലയാളത്തിൽ ‘ഒരു പ്രവൃത്തി ചെയ്യാൻ കഴിയാത്തത്’ എന്നതിലേക്കു ചുരുങ്ങുന്നു; דָּבָר എന്ന വിശാലമായ ‘കാര്യം/എന്തെങ്കിലും’ എന്ന ആശയവും פלאയുടെ ‘പ്രയാസകരം, കഴിവിന് അതീതം’ എന്ന ഭാവവും ‘പ്രയാസകരമായ എന്തെങ്കിലും’ എന്നതിൽ സ്വാഭാവികമായി വരുന്നു.
