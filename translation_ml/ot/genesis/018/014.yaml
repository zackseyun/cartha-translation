- from: “യഹ്‌വേക്കു ചെയ്യാൻ കഴിയാത്തതായി എന്തെങ്കിലും ഉണ്ടോ?[a] നിശ്ചയിച്ച സമയത്ത്, അടുത്ത വർഷം ഇതേ കാലത്ത്[b], ഞാൻ നിന്റെ അടുക്കൽ മടങ്ങിവരും; സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.”
  to: “യഹ്‌വേക്കു പ്രയാസകരമായ എന്തെങ്കിലും ഉണ്ടോ?[a] നിശ്ചിത സമയത്ത് ഞാൻ നിന്റെ അടുക്കൽ മടങ്ങിവരും—അടുത്ത വർഷം ഇതേ കാലത്ത്; സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.”
  rationale: പുനഃപരിശോധന פלאയുടെ വാഗ്‌ചോദ്യശക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രയാസകരമായ എന്തെങ്കിലും’ എന്നു നൽകി; ‘അസാധ്യം’ എന്ന കൂടുതൽ ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കി. ദുഷ്കരമായ כָּעֵת חַיָּה ശൈലിക്ക് മുഖ്യവാചകത്തിൽ സന്ദർഭസഹജമായ അർഥം നൽകിയിട്ടും, അടിക്കുറിപ്പിൽ അതിന്റെ ശാബ്ദിക അനിശ്ചിതത്വം സംരക്ഷിച്ചു. ശָׂרָהയ്ക്ക് യോജിച്ച ‘സാറാ’ രൂപവും സ്വീകരിച്ചു.
