source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: ml
  text: 'അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: “ദയവായി, എന്റെ നാഥാ, കോപിക്കരുതേ. ഈ ഒരു പ്രാവശ്യം കൂടി ഞാൻ സംസാരിക്കട്ടെ. ഒരുപക്ഷേ അവിടെ പത്തുപേർ കാണപ്പെട്ടേക്കാം.” അദ്ദേഹം പറഞ്ഞു: “ആ പത്തുപേരുടെ നിമിത്തം ഞാൻ നശിപ്പിക്കുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, “ആ പത്തുപേരുടെ നിമിത്തം ഞാൻ നശിപ്പിക്കുകയില്ല” എന്നാണ്; എന്തിനെ നശിപ്പിക്കുകയില്ലെന്ന കർമം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: ദയവായി, എന്റെ നാഥൻ കോപിക്കരുതേ
  rationale: נָאയുടെ വിനീതമായ അപേക്ഷ ‘ദയവായി’ എന്നും, חרהയുടെ കോപം ജ്വലിക്കുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി ‘കോപിക്കുക’ എന്നും നൽകി. לַאדֹנָיയെ ദൈവനാമമായ യഹോവ എന്നു നിർണയിക്കാതെ ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയായി ‘എന്റെ നാഥൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: ഈ ഒരു പ്രാവശ്യംകൂടി ഞാൻ സംസാരിക്കട്ടെ
  rationale: cohortative രൂപത്തിലെ അപേക്ഷാനുവാദവും אַךְ നൽകുന്ന ‘ഇനി ഇത്രമാത്രം’ എന്ന പരിമിതിയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: ഒരുപക്ഷേ അവിടെ പത്തുപേരെ കണ്ടെത്തിയേക്കാം
  rationale: אוּלַיയുടെ സാധ്യതാഭാവവും מצאയുടെ നിഫാൽ രൂപത്തിലെ ‘കണ്ടെത്തപ്പെടുക’ എന്ന ആശയവും മലയാളത്തിൽ സ്വാഭാവികമായ സാധ്യതാപ്രയോഗത്തോടെ നൽകുന്നു. ആളുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ ‘പത്തുപേർ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לֹא אַשְׁחִית
  choice: ഞാൻ നശിപ്പിക്കുകയില്ല
  rationale: שׁחתയുടെ ഹിഫീൽ രൂപം ‘നശിപ്പിക്കുക’ എന്നാണ്. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിലും അത് ചേർക്കാതെ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നവിധം നിലനിർത്തി.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: ആ പത്തുപേരെ ഓർത്ത്
  rationale: പത്ത് നീതിമാന്മാരെ പരിഗണിച്ചുകൊണ്ട് നഗരം നശിപ്പിക്കില്ലെന്ന മധ്യസ്ഥതയുടെ ആശയം സാധാരണ മലയാളത്തിലെ ‘ഓർത്ത്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു; നിർദ്ദിഷ്ടത ‘ആ’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ അഭിസംബോധനയായ אֲדֹנָיയുടെ സൂചിതവ്യക്തിയും ദൈവിക പദവിയും
  choice: എന്റെ നാഥൻ
  alternative: കർത്താവേ / എന്റെ യജമാനനേ
  rationale: സന്ദർഭം ദൈവിക പ്രത്യക്ഷതയുമായി ബന്ധപ്പെട്ടിരുന്നാലും ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത് യഹോവ എന്ന ഉടമ്പടിനാമമല്ല. ‘എന്റെ നാഥൻ’ ആദരവും വിനയവും നിലനിർത്തുമ്പോൾ ദൈവിക തിരിച്ചറിയലിനെ വിവർത്തനത്തിൽ അമിതമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. സംഭാഷണത്തിലെ വിനയവും ആവർത്തിച്ചുള്ള മധ്യസ്ഥതയുടെ തീവ്രതയും നിലനിർത്തി. ഇരുവാക്യങ്ങളിലുമുള്ള എബ്രായത്തിലെ ‘അദ്ദേഹം പറഞ്ഞു’ എന്ന രൂപം പ്രസംഗകരെ പേരുപറഞ്ഞ് വ്യക്തമാക്കാതെ സംരക്ഷിച്ചു.
