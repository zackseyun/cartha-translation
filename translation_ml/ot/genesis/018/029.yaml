id: GEN.18.29
reference: Genesis 18:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֜וֹד לְ/דַבֵּ֤ר אֵלָי/ו֙ וַ/יֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם אַרְבָּעִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּ/עֲב֖וּר הָ/אַרְבָּעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: ml
  text: 'അവൻ വീണ്ടും അവനോടു പറഞ്ഞു: “ഒരുപക്ഷേ അവിടെ നാല്പതുപേർ കാണപ്പെട്ടാലോ?” അവൻ പറഞ്ഞു: “ആ നാല്പതുപേരെ കരുതി ഞാൻ അതു ചെയ്യുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ നാല്പതുപേരെ കരുതി ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല.” എബ്രായപാഠത്തിൽ “ഞാൻ ചെയ്യുകയില്ല” എന്നു മാത്രമേയുള്ളൂ; ചെയ്യാത്ത പ്രവൃത്തി എന്താണെന്ന് സന്ദർഭത്തിൽനിന്നാണ് മനസ്സിലാകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: വീണ്ടും ... പറഞ്ഞു
  rationale: יסף + עוד + infinitive എന്ന പ്രയോഗത്തിലെ ആവർത്തനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്ന തുടർച്ചാഭാവത്തേക്കാൾ സന്ദർഭത്തിലെ വീണ്ടും ചോദിക്കൽ ഇതിൽ നന്നായി പ്രതിഫലിക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖദിശ മലയാളത്തിലെ ‘അവനോടു’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: അബ്രാഹാമിന്റെ മധ്യസ്ഥതയിലെ മടിച്ചുനിൽക്കുന്ന സാധ്യതാഭാവം മാന്യവും സാധാരണവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: יִמָּצְאוּן
  choice: കാണപ്പെട്ടാലോ
  rationale: מצא എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ ‘കാണപ്പെടുക’ എന്ന കർമണിഭാവവും സാങ്കൽപ്പിക വ്യവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചകത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אַרְבָּעִים
  choice: നാല്പതുപേർ
  rationale: സന്ദർഭത്തിൽ എണ്ണപ്പെടുന്നത് ആളുകളായതിനാൽ മലയാളത്തിൽ വ്യക്തിസൂചകമായ ‘പേർ’ ചേർത്തിരിക്കുന്നു.
- source_word: לֹא אֶעֱשֶׂה
  choice: ഞാൻ അതു ചെയ്യുകയില്ല
  rationale: എബ്രായത്തിൽ പ്രവൃത്തിയുടെ കർമം വ്യക്തമാക്കാതെ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടവിധം വിട്ടിരിക്കുന്നു. ‘അതു’ എന്നത് മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കുമ്പോഴും ‘നശിപ്പിക്കുക’ എന്ന് അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: ആ നാല്പതുപേരെ കരുതി
  rationale: ‘അവർക്കുവേണ്ടി/അവരുടെ നിമിത്തം’ എന്ന മധ്യസ്ഥതാഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: לֹא אֶעֱשֶׂה എന്നതിൽ ദൈവിക പ്രവൃത്തിയുടെ വ്യക്തമാക്കാത്ത കർമം
  choice: ‘ഞാൻ അതു ചെയ്യുകയില്ല’ എന്ന് കർമത്തെ പൊതുവായി നിലനിർത്തുക
  alternative: ‘ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല’
  rationale: എബ്രായമൂലം ‘ചെയ്യുകയില്ല’ എന്നു മാത്രമാണ് പറയുന്നത്; ഉദ്ദേശിക്കുന്ന പ്രവൃത്തി മുൻസന്ദർഭത്തിൽനിന്നാണ് മനസ്സിലാകുന്നത്. പ്രധാന പാഠത്തിൽ ‘നശിപ്പിക്കുക’ എന്നു ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: രണ്ടാമത്തെ וַיֹּאמֶר എന്നതിന്റെ കർത്താവ്
  choice: ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യരൂപമായ ‘അവിടന്ന് പറഞ്ഞു’
  alternative: ‘അവൻ പറഞ്ഞു’
  rationale: എബ്രായത്തിൽ സർവനാമകർത്താവ് മാത്രമാണെങ്കിലും മുൻസംഭാഷണത്തിൽ മറുപടി പറയുന്നത് യഹോവയാണെന്ന് വ്യക്തമാണ്. മലയാളത്തിൽ രണ്ട് ‘അവൻ’ രൂപങ്ങൾ തുടർച്ചയായി വരുന്നതിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ മാന്യരൂപം ഉപയോഗിച്ചു; അധികമായ ദൈവശാസ്ത്രവിവരം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ദൈവത്തിന്റെ മറുപടിയിൽ ആവശ്യമായ ആദരസൂചകഭാവം നിലനിർത്തി.
