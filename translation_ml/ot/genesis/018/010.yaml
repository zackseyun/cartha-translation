- from: 'അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ കാലത്ത് ഞാൻ തീർച്ചയായും നിന്റെ അടുക്കൽ മടങ്ങിവരും[a]. അപ്പോൾ ഇതാ, നിന്റെ ഭാര്യ സാറയ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.” സാറ കൂടാരത്തിന്റെ വാതിൽക്കൽ കേട്ടുകൊണ്ടിരുന്നു; ആ വാതിൽ അവന്റെ പിന്നിലായിരുന്നു[b].'
  to: 'അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ കാലത്ത് ഞാൻ തീർച്ചയായും നിന്റെ അടുക്കൽ മടങ്ങിവരും[a]. ഇതാ, നിന്റെ ഭാര്യ സാറയ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.” സാറ കൂടാരത്തിന്റെ വാതിൽക്കൽ കേട്ടുകൊണ്ടിരുന്നു; ആ വാതിൽ അവന്റെ പിന്നിലായിരുന്നു[b].'
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥം മാറ്റാതെ, וְהִנֵּה-യുടെ പ്രഖ്യാപനപരമായ ശക്തി ‘ഇതാ’ എന്നതിലൂടെ നേരിട്ട് നിലനിർത്തി. [a] അടിക്കുറിപ്പ് ഹീബ്രു പ്രയോഗത്തിന്റെ അപൂർവതയും സന്ദർഭാനുസൃത അർഥവും അറിയിക്കുമ്പോൾ തെറ്റിദ്ധരിപ്പിക്കുന്ന പദാനുപദ വ്യാഖ്യാനം ഒഴിവാക്കുന്നവിധം തിരുത്തി. [b]യിലെ അനിശ്ചിതത്വം നിലനിർത്തിയിട്ടുണ്ട്.
