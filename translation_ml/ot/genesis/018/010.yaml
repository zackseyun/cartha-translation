  revised_text: 'അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ കാലത്ത് ഞാൻ തീർച്ചയായും നിന്റെ അടുക്കൽ മടങ്ങിവരും[a]. ഇതാ, നിന്റെ ഭാര്യ സാറയ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.” സാറ കൂടാരത്തിന്റെ വാതിൽക്കൽ കേട്ടുകൊണ്ടിരുന്നു; ആ വാതിൽ അവന്റെ പിന്നിലായിരുന്നു[b].'
