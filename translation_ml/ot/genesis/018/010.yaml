id: GEN.18.10
reference: Genesis 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അടുത്ത വർഷം ഇതേ കാലത്ത് ഞാൻ തീർച്ചയായും നിന്റെ അടുക്കൽ മടങ്ങിവരും[a]. ഇതാ, നിന്റെ ഭാര്യ സാറയ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും.” സാറ കൂടാരത്തിന്റെ വാതിൽക്കൽ കേട്ടുകൊണ്ടിരുന്നു; ആ വാതിൽ അവന്റെ പിന്നിലായിരുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥമായി ‘ജീവന്റെ/ജീവിക്കുന്ന സമയത്തിന്റെ കാലത്തെപ്പോലെ’ എന്ന അസാധാരണ പ്രയോഗം; സന്ദർഭത്തിൽ ‘അടുത്ത വർഷം ഇതേ കാലത്ത്’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ പദാനുപദമായി ‘അത്/അവൻ അവന്റെ പിന്നിലായിരുന്നു’ എന്നു വായിക്കാം. സർവനാമങ്ങൾ വളരെ ചുരുക്കമായതിനാൽ, ‘അത്’ കൂടാരത്തിന്റെ പ്രവേശനതുറവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; മറ്റൊരു വായനയിൽ ഒരു പുരുഷനെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ പറയാത്ത പ്രഭാഷകന്റെ വ്യക്തിത്വം പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: שׁוֹב אָשׁוּב
  choice: ഞാൻ തീർച്ചയായും ... മടങ്ങിവരും
  rationale: ക്രിയയുടെ infinitive absolute + imperfect ഘടന നൽകുന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്ന പദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തെ കൃത്യമായി നിലനിർത്തുന്നു; അബ്രാഹാം എന്ന പേര് മൂലപാഠത്തിൽ ഇവിടെ ആവർത്തിക്കാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: כָּעֵת חַיָּה
  choice: അടുത്ത വർഷം ഇതേ കാലത്ത്
  rationale: അടുത്ത വർഷത്തെ ഇതേ കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു കണികയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: നിന്റെ ഭാര്യ സാറയ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും
  rationale: לְ നൽകുന്ന കൈവശം/ലഭ്യത എന്ന ആശയം മലയാളത്തിലെ ജനനവാഗ്ദാനത്തിന് യോജിച്ച സ്വാഭാവിക ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שָׂרָה שֹׁמַעַת
  choice: സാറ ... കേട്ടുകൊണ്ടിരുന്നു
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവം ‘കേട്ടുകൊണ്ടിരുന്നു’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ വാതിൽക്കൽ
  rationale: കൂടാരത്തിന്റെ തുറവിടം/പ്രവേശനസ്ഥലം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהוּא אַחֲרָיו
  choice: ആ വാതിൽ അവന്റെ പിന്നിലായിരുന്നു
  rationale: പുരുഷലിംഗ സർവനാമത്തിന് മുമ്പുള്ള പുരുഷലിംഗ നാമമായ פֶּתַח (‘വാതിൽ/തുറവിടം’) antecedent ആകാമെന്ന വ്യാകരണസാധ്യത പിന്തുടരുന്നു; ഹീബ്രുവിലെ ചുരുക്കവും സാധ്യതയുള്ള മറ്റൊരു വായനയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പ്രഭാഷകന്റെ വ്യക്തിത്വം
  choice: ‘അവൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘യഹോവ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘ആ പുരുഷന്മാരിൽ ഒരാൾ പറഞ്ഞു’
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു ക്രിയയ്ക്ക് വ്യക്തമായ നാമവിഷയം ഇല്ല. വിശാലസന്ദർഭത്തിൽനിന്ന് ഒരു പ്രത്യേക തിരിച്ചറിയൽ ഇവിടെ ചേർക്കാതെ മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: അവസാന പുരുഷലിംഗ സർവനാമത്തിന്റെ സൂചകം
  choice: കൂടാരവാതിലിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നൽകി
  alternative: ‘അവൻ അവന്റെ പിന്നിലായിരുന്നു’ എന്ന കൂടുതൽ പദാനുപദ വായന
  rationale: פֶּתַח എന്ന പുരുഷലിംഗ നാമം അടുത്ത antecedent ആയതിനാലും ദൃശ്യത്തിന്റെ സ്ഥലബന്ധം ഇതിലൂടെ വ്യക്തമാകുന്നതിനാലും ഈ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; വ്യാകരണപരമായ ചുരുക്കത്തിൽ നിന്നുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘നിന്റെ അടുക്കൽ’ എന്നീ പ്രയോഗങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും ഹീബ്രു പ്രഖ്യാപനഭാവവും നിലനിർത്തുന്നു; അപൂർവമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
