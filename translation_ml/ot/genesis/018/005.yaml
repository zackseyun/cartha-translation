  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: ml
  text: 'ഞാൻ ഒരല്പം അപ്പം കൊണ്ടുവരട്ടെ[a]. അതു കഴിച്ച് നിങ്ങൾ ഉന്മേഷം പ്രാപിച്ച്[b], അതിനുശേഷം യാത്ര തുടരാം. ഇതിനായിട്ടാണല്ലോ നിങ്ങൾ അടിയന്റെ അരികിലൂടെ കടന്നുവന്നത്.” അവർ പറഞ്ഞു: “അതെ, നീ പറഞ്ഞതുപോലെ ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, “ഒരു കഷണം അപ്പം.” ആതിഥ്യമര്യാദയുടെ ഈ സന്ദർഭത്തിൽ ഹീബ്രു പ്രയോഗം വിനയപൂർവമായ ലഘൂകരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “നിങ്ങളുടെ ഹൃദയത്തെ താങ്ങുക” അഥവാ “ബലപ്പെടുത്തുക.” ഭക്ഷണം കഴിച്ച് ഉന്മേഷം വീണ്ടെടുക്കുന്നതിനെയാണ് ഈ ഹീബ്രു ശൈലി സൂചിപ്പിക്കുന്നത്.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: ഞാൻ ... കൊണ്ടുവരട്ടെ
  rationale: לקח എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ cohortative രൂപം വിനയപൂർവമായ സ്വയംസന്നദ്ധതയെയോ അനുവാദാഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു; ‘കൊണ്ടുവരട്ടെ’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פַת לֶחֶם
  choice: കുറച്ച് അപ്പം
  rationale: പദശഃ ‘ഒരു കഷണം അപ്പം’ എന്നാണെങ്കിലും ആതിഥ്യമര്യാദയുടെ പശ്ചാത്തലത്തിൽ ഇത് അബ്രാഹാമിന്റെ വിനയപൂർവമായ ലഘൂകരണമാണ്; ‘കുറച്ച് അപ്പം’ ആ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: അതു കഴിച്ച് നിങ്ങൾ ഉന്മേഷം പ്രാപിച്ചശേഷം
  rationale: പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ ഹൃദയത്തെ താങ്ങുക/ബലപ്പെടുത്തുക’ എന്നാണ്; ഇവിടെ ഭക്ഷണം കഴിച്ച് ശക്തിയും ഉന്മേഷവും വീണ്ടെടുക്കുന്നതാണ് ഉദ്ദേശ്യം. ഭക്ഷണബന്ധം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: യാത്ര തുടരാം
  rationale: עבר ഇവിടെ അതിഥികൾ തങ്ങളുടെ യാത്ര തുടരുമെന്ന അർഥത്തിലാണ്; ‘യാത്ര തുടരാം’ ലക്ഷ്യഭാഷയിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי עַל כֵּן
  choice: ഇതിനായിട്ടാണല്ലോ
  rationale: അബ്രാഹാമിന്റെ ക്ഷണത്തിന് കാരണം നൽകുന്ന ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ വിശദീകരണഭാവവും ഊന്നലും ‘ആണല്ലോ’ എന്ന രൂപം പകരുന്നു.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: നിങ്ങൾ അടിയന്റെ അരികിലൂടെ കടന്നുവന്നത്
  rationale: അതിഥികൾ അബ്രാഹാം ഇരുന്ന സ്ഥലത്തിനരികിലൂടെ വന്നതിനെ עבר സൂചിപ്പിക്കുന്നു. ‘കടന്നുവന്നത്’ ചലനവും ആതിഥ്യസന്ദർഭവും നിലനിർത്തുന്നു; ‘അടിയൻ’ വിനയപൂർവമായ സ്വയംപരാമർശമാണ്.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: നീ പറഞ്ഞതുപോലെ ചെയ്യുക
  rationale: അതിഥികളുടെ ചുരുക്കമായ സമ്മതം മലയാളത്തിൽ ഇതിലൂടെ നേരിട്ട് പ്രകടമാകുന്നു; כֵּן എന്ന സമ്മതഭാവം മുഴുവൻ വാക്യനിർമ്മിതിയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
