translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആദരവുള്ള മലയാളം ഉപയോഗിച്ചു. അബ്രാഹാമിന്റെ ആതിഥ്യമര്യാദയും വിനയപൂർവമായ ‘അടിയൻ’ എന്ന സ്വയംപരാമർശവും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
