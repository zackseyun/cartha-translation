id: GEN.18.24
reference: Genesis 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: ml
  text: ഒരുപക്ഷേ നഗരത്തിനുള്ളിൽ അമ്പത് നീതിമാന്മാർ ഉണ്ടെങ്കിൽ, നീ അതിനെ ശരിക്കും തുടച്ചുനീക്കുമോ? അതിലുള്ള അമ്പത് നീതിമാന്മാരുടെ നിമിത്തം ആ സ്ഥലത്തെ വെറുതെ വിടുകയില്ലയോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ സ്ഥലത്തോടു ക്ഷമിക്കുകയില്ലയോ?”'
    reason: נשא എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘വെറുതെ വിടുക’ എന്നും ‘ക്ഷമിക്കുക’ എന്നും മനസ്സിലാക്കാവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: ഒരുപക്ഷേ … ഉണ്ടെങ്കിൽ
  rationale: അബ്രാഹാമിന്റെ സാങ്കൽപ്പികവും മടിച്ചുനിൽക്കുന്നതുമായ അഭ്യർഥന മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: അമ്പതു നീതിമാന്മാർ
  rationale: ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ നീതിയുള്ള വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּתוֹךְ הָעִיר
  choice: നഗരത്തിനുള്ളിൽ
  rationale: നഗരത്തിന്റെ അതിരുകൾക്കുള്ളിലെ സ്ഥാനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַאַף תִּסְפֶּה
  choice: നീ അതിനെ ശരിക്കും തുടച്ചുനീക്കുമോ?
  rationale: הַאַף എന്ന ഊന്നലും ספָה എന്ന ന്യായവിധിയിൽ പൂർണമായി നീക്കിക്കളയുന്ന ദൃശ്യാർഥവും നിലനിർത്തുന്നു.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: ആ സ്ഥലത്തെ വെറുതെ വിടുകയില്ലയോ?
  rationale: നഗരത്തെ നശിപ്പിക്കാതെ വിടുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ക്ഷമിക്കുക’ എന്ന പരിമിതമായ ദൈവശാസ്ത്രാർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: לְמַעַן
  choice: ഓർത്ത്
  rationale: നീതിമാന്മാർ നിമിത്തം സ്ഥലത്തെ നശിപ്പിക്കാതിരിക്കണമെന്ന അഭ്യർഥനയുടെ കാരണം മലയാളത്തിൽ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: അതിലുള്ള
  rationale: മൂലത്തിലെ ബന്ധവാക്യവും നഗരത്തിനകത്തെ സ്ഥാനവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: נשא എന്ന ക്രിയയുടെ അർഥം
  choice: സ്ഥലത്തെ വെറുതെ വിടുക
  alternative: സ്ഥലത്തോടു ക്ഷമിക്കുക
  rationale: തൽക്ഷണ സന്ദർഭത്തിലെ വൈരുധ്യം നഗരത്തെ തുടച്ചുനീക്കുന്നതും നീതിമാന്മാർ നിമിത്തം അതിനെ നശിപ്പിക്കാതെ വിടുന്നതും തമ്മിലാണ്. അതിനാൽ ‘വെറുതെ വിടുക’ ന്യായവിധി മാറ്റിവയ്ക്കുന്ന ആശയം നൽകുന്നു; ക്ഷമയെക്കുറിച്ചുള്ള കൂടുതൽ സങ്കുചിതമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നീ’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ വാദാത്മക ഊന്നലും മൂലത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
