id: GEN.18.12
reference: Genesis 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: ml
  text: 'അപ്പോൾ സാറാ ഉള്ളിൽ ചിരിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഞാൻ ജീർണിച്ചുകഴിഞ്ഞശേഷം, എന്റെ യജമാനനും വൃദ്ധനായിരിക്കെ, എനിക്ക് ആനന്ദം ലഭിക്കുമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് സുഖം ലഭിക്കുമോ?” ലൈംഗികസുഖമോ വീണ്ടും ലഭിക്കുന്ന യൗവനചൈതന്യമോ എന്ന സൂചനയും ഇതിൽ ഉണ്ടായിരിക്കാം.
    reason: עֶדְנָה എന്ന അപൂർവപദത്തിന്റെ വിശാലമായ അർഥവും സന്ദർഭത്തിൽ സാധ്യതയുള്ള ദാമ്പത്യ-ശാരീരിക സൂക്ഷ്മാർഥങ്ങളും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: ചിരിച്ചു
  rationale: צחק എന്ന ക്രിയയുടെ ഖാൽ രൂപത്തിന്റെ സാധാരണ അർഥം ‘ചിരിക്കുക’ എന്നാണ്; ഇവിടെ സാറായുടെ ഉള്ളിലുള്ള പ്രതികരണമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּקִרְבָּהּ
  choice: ഉള്ളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ ഉള്ളിൽ’; സാറായുടെ ചിരിയും തുടർന്നുള്ള വാക്കുകളും ആന്തരികമായിരുന്നുവെന്ന് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: ഉദ്ധരിച്ച വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു രൂപം; ആന്തരികത ‘ഉള്ളിൽ’ എന്നതിലൂടെ ഇതിനകം വ്യക്തമാകുന്നു.
- source_word: אַחֲרֵי בְלֹתִי
  choice: ഞാൻ ജീർണിച്ചുകഴിഞ്ഞശേഷം
  rationale: בלה എന്നത് പഴകുക, ക്ഷയിക്കുക, ജീർണിക്കുക എന്ന ശാരീരിക ഭാവം വഹിക്കുന്നു; അബ്രാഹാമിന്റെ വാർധക്യം വേറെയും പറയുന്നതിനാൽ ‘വയസ്സായശേഷം’ എന്നതിനെക്കാൾ ഈ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: എനിക്ക് ആനന്ദം ഉണ്ടാകുമോ
  rationale: അപൂർവമായ עֶדְנָה എന്ന പദത്തിന്റെ വിശാലമായ ‘ആനന്ദം/സുഖം’ എന്ന അർഥം നിലനിർത്തുകയും ലൈംഗികസുഖമോ പുതുക്കപ്പെട്ട യൗവനശക്തിയോ എന്ന് മുഖ്യവാചകത്തിൽ പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַאדֹנִי
  choice: എന്റെ ഭർത്താവ്
  rationale: ഇവിടെ സാറാ അബ്രാഹാമിനെ ആദരപൂർവം വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്റെ യജമാനൻ’ എന്ന് നൽകിയാൽ ദൈവികമോ ഉടമസ്ഥതാപരമോ ആയ തെറ്റായ ധ്വനി ഉണ്ടാകാം; സന്ദർഭത്തിലെ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്റെ ഭർത്താവ്’ ഉപയോഗിച്ചു.
- source_word: זָקֵן
  choice: വൃദ്ധനായിരിക്കെ
  rationale: അബ്രാഹാമിന്റെ വാർധക്യം നേരിട്ട് സൂചിപ്പിക്കുകയും വാക്യത്തിലെ സാഹചര്യപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: עֶדְנָה എന്ന പദത്തിലെ അർഥവ്യാപ്തി
  choice: ആനന്ദം
  alternative: ലൈംഗികസുഖം; വീണ്ടും യൗവനചൈതന്യം
  rationale: സാറായുടെ ശരീരാവസ്ഥയും ദാമ്പത്യസന്ദർഭവും കൂടുതൽ നിർദിഷ്ടമായ സൂചനകൾ അനുവദിച്ചാലും, ഹീബ്രു പദം അവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ വിശാലമായ പദവും അടിക്കുറിപ്പിൽ സാധ്യതയുള്ള സൂക്ഷ്മാർഥങ്ങളും നിലനിർത്തി.
- issue: וַאדֹנִי എന്ന ആദരസംബോധന
  choice: എന്റെ ഭർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: ഇത് ദൈവത്തെ സൂചിപ്പിക്കുന്ന ശീർഷകമല്ല, അബ്രാഹാമിനെക്കുറിച്ചുള്ള സാറായുടെ ആദരസൂചക പരാമർശമാണ്. ആധുനിക മലയാളത്തിൽ ബന്ധവും ഉദ്ദേശ്യവും തെറ്റിദ്ധാരണ കൂടാതെ നൽകാൻ ‘ഭർത്താവ്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജീർണിച്ചുകഴിഞ്ഞശേഷം’ മൂലപാഠത്തിലെ ശാരീരിക ക്ഷയത്തിന്റെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു; ‘ആനന്ദം’ വ്യാഖ്യാനം അനാവശ്യമായി ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
