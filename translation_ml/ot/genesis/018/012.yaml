    rationale: בְּקִרְבָּהּ സാറായുടെ പ്രതികരണം ആന്തരികമാണെന്ന് പറയുന്നു. ഉള്ളിലെ ചിന്തയുടെ രൂപത്തിൽ ഉദ്ധരണി അവതരിപ്പിക്കുന്നത് ഇതു കൂടുതൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
