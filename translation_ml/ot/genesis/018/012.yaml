revisions:
- from: 'അപ്പോൾ സാറാ ഉള്ളിൽ ചിരിച്ചുകൊണ്ട് പറഞ്ഞു: “ഞാൻ ജീർണിച്ചുകഴിഞ്ഞശേഷം, എന്റെ ഭർത്താവും വൃദ്ധനായിരിക്കെ, എനിക്ക് ആനന്ദം ഉണ്ടാകുമോ?[a]”'
  to: 'അപ്പോൾ സാറാ ഉള്ളിൽ ചിരിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഞാൻ ജീർണിച്ചുകഴിഞ്ഞശേഷം, എന്റെ യജമാനനും വൃദ്ധനായിരിക്കെ, എനിക്ക് ആനന്ദം ലഭിക്കുമോ?[a]”'
  rationale: മൂലഹീബ്രുവിലെ വַאדֹנִיയുടെ ആദരസൂചക അർഥം ‘എന്റെ യജമാനൻ’ എന്നതിലൂടെ പുനഃസ്ഥാപിച്ചു. സാറായുടെ ചിരിയും വാക്കുകളും ആന്തരികമാണെന്ന സൂചന മലയാളത്തിൽ കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ വാക്യഘടന ചെറുതായി പരിഷ്കരിച്ചു. עֶדְנָהയുടെ വിശാലവും സന്ദർഭാനുസൃതമായി ദാമ്പത്യശാരീരിക സൂചനകൾ ഉൾക്കൊള്ളാവുന്നതുമായ അർഥം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
