revisions:
- from: 'എന്തെന്നാൽ, ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു[a]—അവൻ തന്റെ പുത്രന്മാരോടും[b] തനിക്കുശേഷമുള്ള തന്റെ വീട്ടിലുള്ളവരോടും കല്പിക്കാനും, അവർ നീതിയും ന്യായവും പ്രവർത്തിച്ചുകൊണ്ട് യഹോവയുടെ വഴി[c] പാലിക്കാനും, അങ്ങനെ യഹോവ അബ്രാഹാമിനെക്കുറിച്ച് അരുളിച്ചെയ്തത്[d] അവനു വരുത്താനും വേണ്ടിയാണ്.


    [a] അഥവാ, “ഞാൻ അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.” എബ്രായ ക്രിയയുടെ സാധാരണ അർഥം “അറിയുക” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രത്യേകമായി അംഗീകരിക്കുക, തിരഞ്ഞെടുക്കുക എന്ന ആശയവും അതിനുണ്ടാകാം.

    [b] എബ്രായപദം പുല്ലിംഗ ബഹുവചനമാണ്; അതിന്റെ നേരിട്ടുള്ള അർഥം “അവന്റെ പുത്രന്മാർ” എന്നാണ്. തുടർന്ന് വരുന്ന “തന്റെ വീട്ടിലുള്ളവർ” എന്ന പ്രയോഗം ഇതിന്റെ പരിധി കൂടുതൽ വിശാലമാക്കുന്നു.

    [c] അതായത്, യഹോവ ആവശ്യപ്പെടുന്ന ജീവിതരീതി.

    [d] അഥവാ, “അവനോടു വാഗ്ദാനം ചെയ്തത്.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അവനെക്കുറിച്ച് അരുളിച്ചെയ്തത്” എന്നാണ്.'
  to: 'എന്തെന്നാൽ, തനിക്കുശേഷം തന്റെ പുത്രന്മാരോടും[b] തന്റെ കുടുംബത്തിലുള്ളവരോടും നീതിയും ന്യായവും പ്രവർത്തിച്ചുകൊണ്ട് യഹോവയുടെ വഴി[c] പാലിക്കാൻ അവൻ കൽപ്പിക്കേണ്ടതിനായി ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു[a]; അങ്ങനെ, യഹോവ അബ്രാഹാമിനെക്കുറിച്ച് അരുളിച്ചെയ്തത്[d] അവനു വരുത്തേണ്ടതിന്.


    [a] അഥവാ, “ഞാൻ അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.” എബ്രായ ക്രിയയുടെ സാധാരണ അർഥം “അറിയുക” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രത്യേക പരിഗണനയുടെയോ തിരഞ്ഞെടുപ്പിന്റെയോ ആശയവും അതിനുണ്ടാകാം.


    [b] എബ്രായപദം പുല്ലിംഗ ബഹുവചനമാണ്; അതിന്റെ നേരിട്ടുള്ള അർഥം “അവന്റെ പുത്രന്മാർ” എന്നാണ്. “കുടുംബത്തിലുള്ളവർ” എന്ന പ്രയോഗം ഇതിന്റെ പരിധി പുത്രന്മാരിൽ മാത്രം ഒതുങ്ങുന്നതല്ലെന്ന് കാണിക്കുന്നു.


    [c] അതായത്, യഹോവ ആവശ്യപ്പെടുന്ന ജീവിതരീതി.


    [d] അഥവാ, “അവനോടു വാഗ്ദാനം ചെയ്തത്.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അവനെക്കുറിച്ച് അരുളിച്ചെയ്തത്” എന്നാണ്.'
