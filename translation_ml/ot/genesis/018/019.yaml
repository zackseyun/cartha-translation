source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: ml
  text: 'എന്തെന്നാൽ, തനിക്കുശേഷം തന്റെ പുത്രന്മാരോടും[b] തന്റെ കുടുംബത്തിലുള്ളവരോടും നീതിയും ന്യായവും പ്രവർത്തിച്ചുകൊണ്ട് യഹോവയുടെ വഴി[c] പാലിക്കാൻ അവൻ കൽപ്പിക്കേണ്ടതിനായി ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു[a]; അങ്ങനെ, യഹോവ അബ്രാഹാമിനെക്കുറിച്ച് അരുളിച്ചെയ്തത്[d] അവനു വരുത്തേണ്ടതിന്.


    [a] അഥവാ, “ഞാൻ അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.” എബ്രായ ക്രിയയുടെ സാധാരണ അർഥം “അറിയുക” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രത്യേക പരിഗണനയുടെയോ തിരഞ്ഞെടുപ്പിന്റെയോ ആശയവും അതിനുണ്ടാകാം.


    [b] എബ്രായപദം പുല്ലിംഗ ബഹുവചനമാണ്; അതിന്റെ നേരിട്ടുള്ള അർഥം “അവന്റെ പുത്രന്മാർ” എന്നാണ്. “കുടുംബത്തിലുള്ളവർ” എന്ന പ്രയോഗം ഇതിന്റെ പരിധി പുത്രന്മാരിൽ മാത്രം ഒതുങ്ങുന്നതല്ലെന്ന് കാണിക്കുന്നു.


    [c] അതായത്, യഹോവ ആവശ്യപ്പെടുന്ന ജീവിതരീതി.


    [d] അഥവാ, “അവനോടു വാഗ്ദാനം ചെയ്തത്.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അവനെക്കുറിച്ച് അരുളിച്ചെയ്തത്” എന്നാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു.” എബ്രായ ക്രിയയുടെ സാധാരണ അർഥം “അറിയുക” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രത്യേക പരിഗണനയുടെയോ തിരഞ്ഞെടുപ്പിന്റെയോ ആശയവും അതിനുണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായപദം പുല്ലിംഗ ബഹുവചനമാണ്; അതിന്റെ നേരിട്ടുള്ള അർഥം “അവന്റെ പുത്രന്മാർ” എന്നാണ്. “കുടുംബത്തിലുള്ളവർ” എന്ന പ്രയോഗം ഇതിന്റെ പരിധി പുത്രന്മാരിൽ മാത്രം ഒതുങ്ങുന്നതല്ലെന്ന് കാണിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, യഹോവ ആവശ്യപ്പെടുന്ന ജീവിതരീതി.
    reason: cultural_note
  - marker: d
    text: അഥവാ, “അവനോടു വാഗ്ദാനം ചെയ്തത്.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അവനെക്കുറിച്ച് അരുളിച്ചെയ്തത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിനുള്ള കാരണം വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְדַעְתִּיו
  choice: ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു
  rationale: ידע എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ തിരഞ്ഞെടുപ്പിന്റെ സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְמַעַן אֲשֶׁר
  choice: വേണ്ടിയാണ്
  rationale: എബ്രായത്തിലെ ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְצַוֶּה
  choice: കല്പിക്കാനും
  rationale: പീയേൽ രൂപത്തിലുള്ള ശക്തമായ ‘കല്പിക്കുക/ചുമതലപ്പെടുത്തുക’ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരോട്
  rationale: മൂലപദത്തിന്റെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; വിശാലമായ ഗൃഹപരിധി അടുത്ത പദത്തിൽ വ്യക്തമാകുന്നു.
- source_word: בֵּיתוֹ
  choice: തന്റെ വീട്ടിലുള്ളവർ
  rationale: ഭൗതികമായ വീട് എന്നതിലുപരി അബ്രാഹാമിന്റെ ഗൃഹസമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: וְשָׁמְרוּ
  choice: പാലിക്കാനും
  rationale: ‘വഴി’യോടൊപ്പം വരുമ്പോൾ വിശ്വസ്തമായി അനുസരിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: דֶּרֶךְ יְהוָה
  choice: യഹോവയുടെ വഴി
  rationale: യഹോവ ആവശ്യപ്പെടുന്ന ധാർമിക ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: നീതിയും ന്യായവും പ്രവർത്തിച്ചുകൊണ്ട്
  rationale: രണ്ട് വ്യത്യസ്ത എബ്രായ ധാർമിക-ന്യായ പദങ്ങളും വേർതിരിച്ച് നിലനിർത്തുകയും പ്രവൃത്തിയിലൂടെയാണ് വഴി പാലിക്കുന്നത് എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: അബ്രാഹാമിനെക്കുറിച്ച് അരുളിച്ചെയ്തത്
  rationale: ‘അവനെക്കുറിച്ച് പറഞ്ഞത്’ എന്ന മൂലവാക്യത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു; ‘വാഗ്ദാനം’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ידע എന്ന ക്രിയയെ തിരഞ്ഞെടുപ്പിന്റെ അർഥത്തിൽ വിവർത്തനം ചെയ്യണമോ
  choice: ഞാൻ അവനെ അറിഞ്ഞിരിക്കുന്നു
  alternative: ഞാൻ അവനെ തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: ദൈവിക അംഗീകാരത്തിന്റെയും ഉദ്ദേശ്യത്തിന്റെയും സൂചന സന്ദർഭത്തിലുണ്ടെങ്കിലും ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘അറിയുക’ എന്നാണ്; അതിനാൽ വ്യാഖ്യാനാത്മകമായ അർഥം പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: ദൈവം അരുളിച്ചെയ്തതിനെ ‘വാഗ്ദാനം’ എന്ന് വ്യക്തമാക്കണമോ
  choice: അബ്രാഹാമിനെക്കുറിച്ച് അരുളിച്ചെയ്തത്
  alternative: അവനോടു വാഗ്ദാനം ചെയ്തത്
  rationale: മൂലത്തിലെ ‘പറഞ്ഞത്/അരുളിച്ചെയ്തത്’ എന്ന വിശാല പ്രയോഗം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും സന്ദർഭസാധ്യമായ ‘വാഗ്ദാനം’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘അരുളിച്ചെയ്തത്’ ദൈവിക പ്രസ്താവനയ്ക്ക് യോജിച്ച മാന്യഭാഷയായി ഉപയോഗിച്ചു; അമിതമായി പുരാതനമായ വാക്യഘടന ഒഴിവാക്കി. മൂലത്തിലെ ഉദ്ദേശ്യവാക്യങ്ങളുടെ ബന്ധവും ‘അറിയുക/തിരഞ്ഞെടുക്കുക’ എന്ന അർഥതൻഷനും നിലനിർത്തി.
