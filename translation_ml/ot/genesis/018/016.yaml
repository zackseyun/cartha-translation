source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: ml
  text: അപ്പോൾ ആ പുരുഷന്മാർ അവിടെനിന്ന് എഴുന്നേറ്റ് സൊദോമിലേക്കു താഴോട്ടു നോക്കി[a]. അവരെ യാത്രയയക്കാൻ[b] അബ്രാഹാം അവരോടൊപ്പം നടന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൊദോമിന്റെ നേരേ നോക്കി.’ എബ്രായക്രിയ ഉയർന്ന സ്ഥാനത്തുനിന്ന് പുറത്തേക്കോ താഴേക്കോ നോക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരെ യാത്രയാക്കാൻ കൂടെച്ചെന്നു.’ പുറപ്പെടുന്ന അതിഥികളെ അനുഗമിച്ച് യാത്രയയക്കുന്ന പതിവിനെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എഴുന്നേൽക്കുക’ നിലനിർത്തുകയും മുൻദൃശ്യത്തിൽനിന്നുള്ള ആഖ്യാനനീക്കം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലമാറ്റം നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്ന പ്രയോഗം.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: എബ്രായപാഠം സാധാരണയായ ‘പുരുഷന്മാർ’ എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്; ‘ദൂതന്മാർ’ എന്നു വ്യാഖ്യാനിച്ച് അവരുടെ തിരിച്ചറിയൽ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: וַיַּשְׁקִפוּ
  choice: താഴോട്ടു നോക്കി
  rationale: שׁקף ഉയർന്ന സ്ഥാനത്തുനിന്നുള്ള നോട്ടത്തെ സാധാരണ സൂചിപ്പിക്കുന്നു; ‘താഴോട്ടു’ എന്നത് ഈ ഭൂപ്രകൃതിസൂചന നിലനിർത്തുന്നു.
- source_word: עַל־פְּנֵי סְדֹם
  choice: സൊദോമിലേക്കു
  rationale: സൊദോമിന്റെ ദിശയിലേക്കുള്ള നോട്ടം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; താഴോട്ടുള്ള ഭാവം മുൻക്രിയയിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: הֹלֵךְ עִמָּם
  choice: അവരോടൊപ്പം നടന്നുപോയി
  rationale: കൃ dan participle സൂചിപ്പിക്കുന്ന തുടർച്ചയായ അനുഗമനപ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: לְשַׁלְּחָם
  choice: അവരെ യാത്രയയക്കാൻ
  rationale: പുറപ്പെടുന്ന അതിഥികളെ കുറച്ചുദൂരം അനുഗമിച്ച് യാത്രയാക്കുന്ന ആതിഥ്യമര്യാദയെ സംക്ഷിപ്തമായും വ്യക്തമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: הָאֲנָשִׁים എന്നവരുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘ആ പുരുഷന്മാർ’
  alternative: ‘ആ സന്ദർശകർ’ അല്ലെങ്കിൽ ‘ദൂതന്മാർ’
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം സാധാരണ നാമമായ ‘പുരുഷന്മാർ’ എന്നാണ് പറയുന്നത്. അതിനാൽ ആഖ്യാനത്തിലെ തിരിച്ചറിയൽസംബന്ധമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുരുഷന്മാർ’ എന്ന നേരിട്ടുള്ള പദം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആഖ്യാനപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; അതിഥിസൽക്കാരത്തിന്റെ ഭാവം ‘യാത്രയയക്കാൻ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
