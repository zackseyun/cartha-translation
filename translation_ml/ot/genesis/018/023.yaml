source:
  edition: WLC
  text: וַ/יִּגַּ֥שׁ אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הַ/אַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാഹാം അടുത്തുചെന്ന് പറഞ്ഞു: “അങ്ങ് തീർച്ചയായും നീതിമാനെയും ദുഷ്ടനോടുകൂടെ തുടച്ചുനീക്കുമോ[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നശിപ്പിക്കുമോ” അല്ലെങ്കിൽ “മുടിച്ചുകളയുമോ”; ഹീബ്രു ക്രിയ ന്യായവിധിയിൽ നീക്കിക്കളയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുചെന്ന്
  rationale: נגשׁ എന്ന ക്രിയയുടെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അബ്രാഹാമിന്റെ ശാരീരികവും വാക്ചാതുര്യപരവുമായ മുന്നോട്ടുവരവ് നിലനിർത്തുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാള തർജമ.
- source_word: הַאַף
  choice: —മോ
  rationale: ഹീബ്രുവിലെ ശക്തിപ്പെടുത്തിയ ചോദ്യം മലയാളത്തിലെ ഊന്നലുള്ള ചോദ്യംരൂപംകൊണ്ട് പ്രകടമാക്കുന്നു; പ്രത്യേകമായി ‘വാസ്തവമായും’ ചേർത്താൽ ഉണ്ടാകാവുന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: תִּסְפֶּה
  choice: തുടച്ചുനീക്കുമോ
  rationale: സפה സൂചിപ്പിക്കുന്ന ന്യായവിധിയിലെ സമൂലമായ നീക്കിക്കളയൽ എന്ന സജീവ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: צַדִּיק
  choice: നീതിമാനെയും
  rationale: ഏകവചനരൂപം ഒരു നൈതിക വിഭാഗത്തിന്റെ പ്രതിനിധിയായി പൊതുവായ അർഥത്തിൽ പ്രവർത്തിക്കുന്നു; അതേ ഏകവചനശക്തി മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: עִם
  choice: ദുഷ്ടനോടൊപ്പം
  rationale: ഒരേ ന്യായവിധിഫലത്തിൽ പങ്കുചേരുക എന്ന ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: רָשָׁע
  choice: ദുഷ്ടനോടൊപ്പം
  rationale: רָשָׁע എന്ന നൈതിക വിഭാഗത്തിന് സുതാര്യമായ മലയാളരൂപം; ഹീബ്രുവിലെ പൊതുവായി പ്രയോഗിച്ച ഏകവചനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൊതുവായ അർഥത്തിൽ ഉപയോഗിച്ച ഏകവചന നൈതിക വിഭാഗങ്ങൾ
  choice: צַדִּיק, רָשָׁע എന്നിവയെ ‘നീതിമാൻ’, ‘ദുഷ്ടൻ’ എന്ന ഏകവചന പൊതുവിഭാഗങ്ങളായി നൽകുന്നു.
  alternative: ‘നീതിമാന്മാരെ’, ‘ദുഷ്ടന്മാരോടൊപ്പം’ എന്നു ബഹുവചനമാക്കുക.
  rationale: ഹീബ്രു ഏകവചനം ഓരോ വിഭാഗത്തിന്റെയും പ്രതിനിധിയെ മുൻനിർത്തി ദൈവനീതിയെക്കുറിച്ചുള്ള പൊതുതത്ത്വം ഉന്നയിക്കുന്നു. മലയാളത്തിലെ ഏകവചനവും ആ പ്രതിനിധാനശക്തി സ്വാഭാവികമായി വഹിക്കുന്നു.
- issue: അബ്രാഹാമിന്റെ ചോദ്യത്തിലെ ഊന്നൽ
  choice: മലയാളത്തിലെ ‘—മോ?’ എന്ന നേരിട്ടുള്ള, ആശ്ചര്യവും അഭ്യർഥനയും നിറഞ്ഞ ചോദ്യംരൂപം ഉപയോഗിക്കുന്നു.
  alternative: ‘അങ്ങ് വാസ്തവമായും...?’ അല്ലെങ്കിൽ ‘അങ്ങ് ശരിക്കും...?’
  rationale: הַאַף ചോദ്യത്തിന് ശക്തി നൽകുന്നു. മലയാളത്തിൽ ‘വാസ്തവമായും’ എന്ന പദം നിർബന്ധമായി ചേർക്കാതെ തന്നെ സന്ദർഭവും ചോദ്യംരൂപവും ആ ഊന്നൽ വഹിക്കുന്നു; ദൈവത്തിന്റെ ഉദ്ദേശത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ചോദ്യത്തിന്റെ നാടകീയതയും നീതിമാൻ–ദുഷ്ടൻ എന്ന നൈതിക വൈരുധ്യവും നിലനിർത്തി.
