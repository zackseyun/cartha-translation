id: GEN.18.6
reference: Genesis 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמַהֵ֧ר אַבְרָהָ֛ם הָ/אֹ֖הֱלָ/ה אֶל שָׂרָ֑ה וַ/יֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַ/עֲשִׂ֥י עֻגֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: ml
  text: 'അബ്രാഹാം വേഗം കൂടാരത്തിലേക്കു സാറയുടെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “വേഗം! നല്ലതരം മാവിന്റെ മൂന്നു സേയാ[a][b] കുഴച്ച് അപ്പങ്ങൾ ഉണ്ടാക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേയാ’ ധാന്യങ്ങൾക്കുള്ള പുരാതന അളവാണ്. മൂന്നു സേയാ ഏകദേശം 20–22 ലിറ്റർ വരും.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നല്ലതരം മാവിന്റെ മൂന്ന് അളവുകൾ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: വേഗം … ചെന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന തിടുക്കം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: കൂടാരത്തിനകത്ത് സാറയുടെ അടുത്തേക്കു
  rationale: ദിശാസൂചകമായ הָ- കൂടാരത്തിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സാറയുടെ അടുത്തേക്കു അകത്തേക്കു ചെല്ലുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: מַהֲרִי
  choice: വേഗം!
  rationale: സാറയോടു പറയുന്ന സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയുടെ തിടുക്കം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשׁ סְאִים
  choice: മൂന്നു സേയാ
  rationale: പുരാതനമായ നിർദിഷ്ട അളവുപദം പൊതുവായ ‘അളവ്’ എന്നാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; അർഥവിവരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: קֶמַח סֹלֶת
  choice: നേർത്ത മാവ്
  rationale: നന്നായി പൊടിച്ച ഉയർന്ന ഗുണമുള്ള മാവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം ലളിതവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לוּשִׁי
  choice: കുഴച്ച്
  rationale: വെറും കലക്കലല്ല, മാവ് കുഴയ്ക്കുന്നതിനെത്തന്നെ സൂചിപ്പിക്കുന്ന കൃത്യമായ പദം.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: അപ്പങ്ങൾ ഉണ്ടാക്കൂ
  rationale: עֻגוֹת ഇവിടെ വേഗം തയ്യാറാക്കാവുന്ന വട്ടത്തിലുള്ള അപ്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കേക്ക്’ എന്നു പറഞ്ഞാൽ മധുരപലഹാരമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. സംഭാഷണത്തിലെ തിടുക്കം ആവർത്തിച്ച ‘വേഗം’ എന്ന പദത്തിലൂടെ സംരക്ഷിച്ചു; പുരാതന അളവുപദം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
