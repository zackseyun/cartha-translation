    reason: lexical_alternative
  revision_rationale: The revision avoids adding an explicit ‘inside the tent’ location, sharpens the rendering of fine flour, and preserves the urgent register, ancient measure, and bread-cake sense of the Hebrew. Footnote anchors remain directly after the measure expression and the footnotes clarify the retained unit and lexical alternative.
