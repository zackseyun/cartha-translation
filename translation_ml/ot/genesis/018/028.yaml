id: GEN.18.28
reference: Genesis 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: ml
  text: 'അമ്പത് നീതിമാന്മാരിൽ അഞ്ചുപേർ കുറവാണെങ്കിൽ, അഞ്ചുപേർ കുറവായതുകൊണ്ട് അങ്ങ് നഗരം മുഴുവനും നശിപ്പിക്കുമോ? അവിടുന്ന് പറഞ്ഞു: “അവിടെ നാല്പത്തഞ്ച് നീതിമാന്മാരെ കണ്ടെത്തിയാൽ ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: ആയാലോ?
  rationale: അബ്രാഹാമിന്റെ സാങ്കൽപ്പികവും സൂക്ഷ്മവുമായ ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: അമ്പത് നീതിമാന്മാരുടെ എണ്ണത്തിൽ അഞ്ചുപേർ കുറവായാലോ?
  rationale: അമ്പത് എന്ന ആവശ്യമായ എണ്ണത്തിൽ അഞ്ചിന്റെ കുറവുണ്ടെന്ന എബ്രായ ആശയം വ്യക്തമാക്കുന്നു; അഞ്ചു നിർദിഷ്ട വ്യക്തികൾ കാണാതായെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַצַּדִּיקִם
  choice: നീതിമാന്മാർ
  rationale: പദത്തിന്റെ ധാർമികവും ന്യായപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന പതിവ് മലയാള പ്രയോഗം.
- source_word: הֲתַשְׁחִית
  choice: അങ്ങ് നശിപ്പിക്കുമോ?
  rationale: ഹിഫിൽ ക്രിയയുടെ നശിപ്പിക്കുക എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന ആദരസൂചക രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּחֲמִשָּׁה
  choice: ആ അഞ്ചുപേരുടെ കുറവുനിമിത്തം
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ കാരണാർഥം വ്യക്തമാക്കുന്നു; നഗരനാശത്തിന് കാരണം അഞ്ചുപേർ തന്നെയല്ല, അമ്പതിൽ അഞ്ചിന്റെ കുറവാണെന്ന ആശയം കൃത്യമാക്കുന്നു.
- source_word: אֶת כָּל הָעִיר
  choice: നഗരം മുഴുവനും
  rationale: നഗരത്തിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֹא אַשְׁחִית
  choice: ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല
  rationale: ചോദ്യത്തിലും മറുപടിയിലും ഒരേ ക്രിയയുടെ ആവർത്തനം സംരക്ഷിക്കുന്നു; ‘അതിനെ’ നഗരം എന്ന മുൻപദത്തെ വ്യക്തമാക്കുന്നു.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: അവിടെ നാല്പത്തഞ്ചുപേരെ കണ്ടെത്തിയാൽ
  rationale: വ്യവസ്ഥയും സ്ഥലസൂചനയും സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: צַדִּיקִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതിമാന്മാർ
  alternative: ന്യായവാന്മാർ
  rationale: ഈ മധ്യസ്ഥപ്രാർത്ഥനയുടെ പശ്ചാത്തലത്തിൽ ധാർമികവും ന്യായപരവുമായ അർഥഭാരം ഒരുപോലെ നിലനിർത്താൻ ‘നീതിമാന്മാർ’ കൂടുതൽ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്നും വിവരണത്തിൽ ‘അവിടുന്ന്’ എന്നും ആദരസൂചക രൂപങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ സംഖ്യക്കുറവിന്റെ ആശയം ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കിയിട്ടുണ്ട്.
