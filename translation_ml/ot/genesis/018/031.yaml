source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: ml
  text: 'പിന്നെ അബ്രാഹാം പറഞ്ഞു: “ഇതാ, എന്റെ കർത്താവിനോടു സംസാരിക്കാൻ ഞാൻ തുനിഞ്ഞിരിക്കുന്നു.[a] ഒരുപക്ഷേ അവിടെ ഇരുപതുപേർ കാണപ്പെട്ടേക്കാം.” അവിടുന്ന് പറഞ്ഞു: “ആ ഇരുപതുപേരുടെ നിമിത്തം ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ കർത്താവിനോടു സംസാരിക്കാൻ ഞാൻ ധൈര്യപ്പെട്ടിരിക്കുന്നു.”
    reason: הוֹאַלְתִּי എന്ന ക്രിയയ്ക്ക് ‘തുനിയുക’, ‘ധൈര്യപ്പെടുക’, ‘സംസാരിക്കാനുള്ള സ്വാതന്ത്ര്യം എടുക്കുക’ എന്നീ അടുത്ത അർഥനിറങ്ങൾ ഉണ്ട്.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതോടൊപ്പം വിനയവും സൂചിപ്പിക്കുന്ന ഈ ദ്വികണത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ഇതാ’ എന്നു നൽകി; ‘ദയവായി നോക്കണമേ’ എന്ന അക്ഷരാർഥം ഇവിടെ കൃത്രിമമായി തോന്നും.
- source_word: הוֹאַלְתִּי
  choice: ഞാൻ ധൈര്യപ്പെട്ടിരിക്കുന്നു
  rationale: സംസാരിക്കാനുള്ള സ്വാതന്ത്ര്യം വിനയത്തോടെ എടുക്കുക, അതിനു തുനിയുക എന്നീ അർഥനിറങ്ങൾ സന്ദർഭത്തിൽ ഉണ്ട്. ‘ധൈര്യപ്പെട്ടിരിക്കുന്നു’ അബ്രാഹാമിന്റെ മടിയും സാഹസവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: എന്റെ കർത്താവിനോടു സംസാരിക്കാൻ
  rationale: ഹീബ്രു വാക്യഘടന നേരിട്ട് നിലനിർത്തുന്നു. ‘കർത്താവ്’ ഇവിടെ ദൈവിക അഭിസംബോധനയായ പദവിയാണ്; യഹോവ എന്ന ദൈവനാമം ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: ഒരുപക്ഷേ അവിടെ ഇരുപതുപേരെ കണ്ടേക്കാം
  rationale: אוּלַיയുടെ അനിശ്ചിതവും ആദരപൂർവവുമായ ഭാവം ‘ഒരുപക്ഷേ’ നിലനിർത്തുന്നു. מצאയുടെ നിഫാൽരൂപത്തിലെ ‘കാണപ്പെടുക/കണ്ടെത്തപ്പെടുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിലെ അനിശ്ചിത പ്രയോഗമായ ‘കണ്ടേക്കാം’ വഴി നൽകുന്നു.
- source_word: לֹא אַשְׁחִית
  choice: ഞാൻ അതിനെ നശിപ്പിക്കുകയില്ല
  rationale: ക്രിയയുടെ ഹിഫീൽ അർഥം ‘നശിപ്പിക്കുക’ എന്നു നൽകി. ഹീബ്രുവിൽ വെളിപ്പെടുത്താത്ത കർമത്തെ, മുമ്പ് ചർച്ചയായ സ്ഥലത്തെയോ നഗരത്തെയോ സൂചിപ്പിക്കുന്ന ‘അതിനെ’ എന്നു മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: ആ ഇരുപതുപേരെപ്രതി
  rationale: നിർദ്ദിഷ്ടമായ ഇരുപതുപേരെ കണക്കിലെടുത്ത് സ്ഥലം ഒഴിവാക്കുമെന്ന മധ്യസ്ഥയുക്തി സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു; ഹീബ്രുവിലെ നിർദ്ദിഷ്ട സൂചന ‘ആ’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ അഭിസംബോധനയിലെ אֲדֹנָי
  choice: എന്റെ കർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: ഉടൻമുമ്പുള്ള വിവരണസന്ദർഭത്തിൽ അഭിസംബോധിതൻ ദൈവിക വ്യക്തിയാണെന്ന് സൂചനയുള്ളതിനാൽ ‘കർത്താവ്’ ഉചിതമാണ്. എന്നാൽ മൂലപാഠത്തിൽ ഇവിടെ יהוה എന്ന ദൈവനാമമല്ല, പദവിയാണ്; അതിനാൽ ദൈവനാമം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: നശിപ്പിക്കപ്പെടുന്ന കർമം
  choice: അതിനെ
  alternative: കർമം പറയാതെ ‘ഞാൻ നശിപ്പിക്കുകയില്ല’
  rationale: ഹീബ്രു കർമം പരാമർശിക്കാതെ വിടുന്നു; മലയാളത്തിൽ ‘അതിനെ’ ചേർക്കുന്നത് സന്ദർഭത്തിലെ സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്, അതിന്റെ പരിധി നഗരം മാത്രമോ പ്രദേശമോ എന്നു നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ദൈവിക അഭിസംബോധനയെ ‘കർത്താവ്’ എന്നു നൽകി; മലയാളത്തിൽ വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ സന്ദർഭമാണ് ദൈവിക സൂചന നൽകുന്നത്. മൂലപാഠത്തിൽ ‘നീതിമാന്മാർ’ എന്ന പദം ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
