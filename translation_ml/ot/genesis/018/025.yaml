id: GEN.18.25
reference: Genesis 18:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: ml
  text: അങ്ങ് ഇങ്ങനെയൊരു കാര്യം ചെയ്യുന്നത് ഒരിക്കലും അരുതേ—നീതിമാനെ ദുഷ്ടനോടൊപ്പം കൊല്ലുകയും, നീതിമാനും ദുഷ്ടനെപ്പോലെയാകുന്നവിധം പ്രവർത്തിക്കുകയും ചെയ്യുന്നത്! അങ്ങയിൽനിന്ന് അത് ഒരിക്കലും അരുതേ! സർവഭൂമിയുടെ ന്യായാധിപൻ നീതി നടത്താതിരിക്കുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സർവഭൂമിയുടെ ന്യായാധിപൻ നീതിയായതു ചെയ്യാതിരിക്കുമോ?”
    reason: മִשְׁפָּט ഇവിടെ ‘നീതി’ അഥവാ ‘നീതിയായത്’ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: חָלִילָה לְּךָ
  choice: അങ്ങ് ചെയ്യുന്നത് ഒരിക്കലും ഉണ്ടാകരുതേ / അങ്ങയിൽനിന്ന് അത് ഒരിക്കലും ഉണ്ടാകരുതേ
  rationale: חָלִילָה ശക്തമായ നിരാകരണവും ധാർമികമായ വെറുപ്പും പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണ്. അക്ഷരാർഥത്തിലുള്ള ‘അശുദ്ധമായിരിക്കട്ടെ’ എന്നതിനു പകരം, ദൈവത്തോടുള്ള ആദരസൂചകമായ അഭിസംബോധനയോടുകൂടി അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: ഇങ്ങനെയൊരു കാര്യം ... ചെയ്യുന്നത്
  rationale: ‘ഈ കാര്യം ചെയ്യുന്നതിൽനിന്ന്’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ, חָלִילָה എന്ന നിരാകരണപ്രയോഗത്തിനു പിന്നാലെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണിത്.
- source_word: לְהָמִית
  choice: കൊന്നുകളഞ്ഞ്
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരകഭാവം ശക്തമായി അറിയിക്കുന്നു; ഇവിടെ ‘മരണത്തിന് ഏൽപ്പിക്കുക’ എന്ന കൃത്രിമരൂപത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: צַדִּיק עִם רָשָׁע
  choice: ദുഷ്ടനോടൊപ്പം നീതിമാനെയും
  rationale: രണ്ടു ഏകവചനരൂപങ്ങളും പ്രതിനിധിപരമായ വർഗവ്യത്യാസം സൂചിപ്പിക്കുന്നു. ‘നീതിമാൻ’–‘ദുഷ്ടൻ’ എന്ന വിരോധം ധാർമികവും ന്യായപരവുമായ അർഥങ്ങൾ നിലനിർത്തുന്നു.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: നീതിമാനെ ദുഷ്ടനെപ്പോലെ ആക്കുന്നത്
  rationale: ഈ പ്രവൃത്തിയുടെ അസഹ്യമായ ഫലം വ്യക്തമാക്കുകയും כ എന്ന താരതമ്യഘടകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: സർവഭൂമിയുടെയും ന്യായാധിപൻ
  rationale: പങ്കാളിത്തരൂപം ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി ഉപയോഗിച്ചിരിക്കുന്നു. כָּל הָאָרֶץ എന്നതിന്റെ സർവവ്യാപക പരിധി ‘സർവഭൂമി’ നിലനിർത്തുന്നു.
- source_word: מִשְׁפָּט
  choice: നീതി
  rationale: ഇവിടെ വെറും ന്യായവിധിക്രിയയേക്കാൾ നീതിയനുസരിച്ചുള്ള പ്രവർത്തനമാണ് ഊന്നൽ. ‘നീതി നടത്തുക’ ന്യായപരവും ധാർമികവുമായ ഭാവങ്ങൾ ഒരുമിച്ച് നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ നീതിയെക്കുറിച്ചുള്ള അബ്രാഹാമിന്റെ ധീരമായ വാഗ്വാദചോദ്യം
  choice: സർവഭൂമിയുടെയും ന്യായാധിപൻ നീതി നടത്താതിരിക്കുമോ?
  alternative: സർവഭൂമിയുടെയും ന്യായാധിപൻ നീതിയായതു ചെയ്യാതിരിക്കുമോ?
  rationale: הֲ...לֹא എന്ന ഘടന അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാഗ്വാദചോദ്യമാണ്. വിവർത്തനം അബ്രാഹാമിന്റെ ധീരത മയപ്പെടുത്താതെയും ദൈവത്തിന്റെ നീതിമാനായ സ്വഭാവത്തിലേക്കുള്ള അഭ്യർഥന നിലനിർത്തിയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ആവർത്തിച്ച חָלִילָהയുടെ ശക്തിയും അവസാനത്തെ വാഗ്വാദചോദ്യത്തിന്റെ ധീരതയും നിലനിർത്തി.
