  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: ml
  text: ദയവായി കുറച്ച് വെള്ളം കൊണ്ടുവരട്ടെ[a]; നിങ്ങളുടെ കാലുകൾ കഴുകുകയും ആ മരത്തിന്റെ ചുവട്ടിൽ വിശ്രമിക്കുകയും ചെയ്യുവിൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കുറച്ച് വെള്ളം എടുക്കപ്പെടട്ടെ”; ഇവിടെ വെള്ളം കൊണ്ടുവരാനുള്ള വിനയപൂർവമായ അഭ്യർഥനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ചാരിയിരിക്കുവിൻ” അല്ലെങ്കിൽ “ചാഞ്ഞിരിക്കുവിൻ.” എബ്രായക്രിയയ്ക്ക് ചാരുക, ചാഞ്ഞിരിക്കുക എന്ന അർഥമുണ്ട്; ഇവിടെ മരത്തണലിൽ വിശ്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: കൊണ്ടുവരട്ടെ
  rationale: לקח എന്ന ക്രിയയുടെ നിഷ്ക്രിയ യുസ്സീവ് രൂപവും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു നൽകുന്നു; വെള്ളം മറ്റൊരാൾ കൊണ്ടുവരുമെന്ന നിഷ്ക്രിയ ആശയം നിലനിർത്തുന്നു.
- source_word: מְעַט מַיִם
  choice: കുറച്ചു വെള്ളം
  rationale: ചെറിയ അളവിലുള്ള വെള്ളം എന്ന അർഥവും അബ്രാഹാമിന്റെ എളിയ ആതിഥ്യവാഗ്ദാനത്തിന്റെ ഭാവവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: നിങ്ങളുടെ കാലുകൾ കഴുകി
  rationale: രണ്ടാം പുരുഷ ബഹുവചന നിർദേശത്തെയും കാലുകൾ കഴുകുന്ന പുരാതന ആതിഥ്യമര്യാദയെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהִשָּׁעֲנוּ
  choice: വിശ്രമിക്കുവിൻ
  rationale: שען എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിന് ചാരി ഇരിക്കുക, ചാഞ്ഞിരിക്കുക എന്ന കൂടുതൽ അക്ഷരാർഥമുണ്ടെങ്കിലും, ഇവിടെ തണലിൽ വിശ്രമിക്കാൻ ക്ഷണിക്കുന്ന ആതിഥ്യസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּחַת הָעֵץ
  choice: ആ മരത്തിന്റെ ചുവട്ടിൽ
  rationale: നിശ്ചിതമായ ഒരു മരത്തെ സൂചിപ്പിക്കുന്ന നിർദേശകത നിലനിർത്തുന്നു; മലയാളത്തിൽ മരത്തിന്റെ തണലിലുള്ള സ്ഥലം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
