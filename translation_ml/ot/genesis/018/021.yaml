  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: ml
  text: ഞാൻ ഇപ്പോൾ ഇറങ്ങിച്ചെന്ന്, എന്നിലേക്കു വന്ന അതിന്റെ നിലവിളിയോടു പൂർണമായി ഒത്തതാണോ അവർ ചെയ്തിരിക്കുന്നത് എന്നു നോക്കും[a]; അങ്ങനെയല്ലെങ്കിൽ, ഞാൻ അറിയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നിലേക്കു വന്ന അതിന്റെ നിലവിളിക്കൊത്തവണ്ണം അവർ മുഴുവനായും പ്രവർത്തിച്ചിട്ടുണ്ടോ.” ‘ചെയ്യുക’ എന്നും ‘പൂർണത’ എന്നും ചേർന്ന ഹീബ്രു പ്രയോഗം, അവരുടെ പ്രവൃത്തികൾ ആ നിലവിളിയോടു പൂർണമായി പൊരുത്തപ്പെടുന്നുണ്ടോ എന്ന ആശയം നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അങ്ങനെ അല്ലെങ്കിൽ, ഞാൻ അറിയും.”'
    reason: clarity
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: ഞാൻ ഇപ്പോൾ ഇറങ്ങിച്ചെന്ന്
  rationale: ആദ്യപുരുഷ കോഹോർട്ടേറ്റീവ് സംസാരിക്കുന്നവന്റെ ദൃഢനിശ്ചയത്തെയും ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കുന്നു; נָא ഇവിടെ മറ്റൊരാളോടുള്ള അപേക്ഷയല്ല, ഉടനടിത്തം അടയാളപ്പെടുത്തുന്നു.
- source_word: וְאֶרְאֶה
  choice: എന്നു നോക്കും
  rationale: ראה ഇവിടെ വെറുതെ കാണുക എന്നതിലുപരി പരിശോധിച്ച് നിജസ്ഥിതി മനസ്സിലാക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിലെ ‘നോക്കും’ ആ സ്വാഭാവിക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַכְּצַעֲקָתָהּ
  choice: അതിന്റെ നിലവിളിക്കൊത്തവിധം
  rationale: צעקה ഗുരുതരമായ അനീതിയിൽനിന്നുയരുന്ന മുറവിളിയെയോ നിലവിളിയെയോ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നഗരത്തെയോ പ്രദേശത്തെയോ പരാമർശിക്കുന്നു; അതിനെ ‘അതിന്റെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: הַבָּאָה אֵלַי
  choice: എന്റെയടുക്കൽ എത്തിയിരിക്കുന്ന
  rationale: പാർട്ടിസിപ്പിൾ ‘നിലവിളി’യെ വിശേഷിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עָשׂוּ כָּלָה
  choice: അവർ പൂർണമായി ചെയ്തിട്ടുണ്ടോ
  rationale: עשׂוּ כָּלָה എന്ന ദുഷ്കരമായ പ്രയോഗം കേട്ട നിലവിളിയുമായി അവരുടെ പ്രവൃത്തികൾ പൂർണമായി പൊരുത്തപ്പെടുന്നുണ്ടോ എന്ന ആശയം നൽകുന്നു. ‘ചെയ്തിട്ടുണ്ടോ’ ഹീബ്രുവിലെ അനിശ്ചിത ബഹുവചന കർത്താവിനെ നിലനിർത്തുന്നു.
- source_word: וְאִם לֹא
  choice: ഇല്ലെങ്കിൽ
  rationale: വ്യവസ്ഥാപരമായ വിപരീതസാധ്യത മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֵדָעָה
  choice: ഞാൻ അറിയും
  rationale: ידע എന്നതിന്റെ നേരിട്ടുള്ള ‘അറിയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കണ്ടെത്തും’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ മനുഷ്യസദൃശമായി ഇറങ്ങിച്ചെന്നു നോക്കുന്നവനായി ചിത്രീകരിക്കൽ
  choice: ‘ഞാൻ ഇപ്പോൾ ഇറങ്ങിച്ചെന്ന് ... നോക്കും’ എന്ന ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘ഞാൻ പരിശോധിക്കും’ അല്ലെങ്കിൽ ‘ഞാൻ വിധിക്കും’ എന്നു ദൈവത്തിന്റെ സർവജ്ഞതയുമായി പൊരുത്തപ്പെടുത്തുന്ന വിധത്തിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു വിവരണം ദൈവത്തെ മനുഷ്യാനുഭവത്തിന് അനുയോജ്യമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു. അതിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ വിശദീകരിച്ചോ ലഘൂകരിച്ചോ ഇല്ലാതാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ താരതമ്യഘടന മുഖ്യപാഠത്തിൽ സാധ്യമായത്ര നിലനിർത്തുകയും വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
