id: GEN.18.18
reference: Genesis 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: ml
  text: അബ്രാഹാം നിശ്ചയമായും വലിയതും പ്രബലവുമായ ഒരു ജനതയായിത്തീരും; ഭൂമിയിലെ സകല ജനതകളും അവനിൽ അനുഗ്രഹിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “ഭൂമിയിലെ സകല ജനതകളും അവനെ മുൻനിർത്തി തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും.” എബ്രായ ക്രിയാരൂപത്തെ ഇങ്ങനെയും മനസ്സിലാക്കാം; പ്രധാന പാഠത്തിൽ അതിനെ കർമണിരൂപമായി വിവർത്തനം ചെയ്തിരിക്കുന്നു: “അവനിൽ അനുഗ്രഹിക്കപ്പെടും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָי֧וֹ יִֽהְיֶ֛ה
  choice: നിശ്ചയമായും ... ആയിത്തീരും
  rationale: ക്രിയയുടെ ധാതുരൂപവും അതേ ക്രിയയുടെ അപൂർണരൂപവും ചേർന്ന പ്രയോഗം ഭാവികാലക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ ‘നിശ്ചയമായും ... ആയിത്തീരും’ എന്നത് ആ ഊന്നലും മാറ്റത്തിന്റെ ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְ/ג֥וֹי
  choice: ഒരു ... ജനത
  rationale: גוי ഒരു ജനസമൂഹത്തെയോ രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ അബ്രാഹാമിൽനിന്ന് രൂപംകൊള്ളുന്ന ജനത്തെപ്പറ്റിയുള്ള വാഗ്ദാനമായതിനാലും വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്തിലെ ജനതകളുമായുള്ള പദബന്ധം നിലനിർത്തുന്നതിനാലും ‘ജനത’ തിരഞ്ഞെടുത്തു.
- source_word: גָּד֖וֹל וְ/עָצ֑וּם
  choice: വലിയതും പ്രബലവുമായ
  rationale: גָּדוֹל വലിപ്പവും മഹത്ത്വവും ഉൾക്കൊള്ളുന്നു; עָצוּם ശക്തി, ബലം, പ്രാബല്യം എന്നിവ സൂചിപ്പിക്കുന്നു. ‘വലിയതും പ്രബലവുമായ’ എന്ന കൂട്ടുകെട്ട് രണ്ടിന്റെയും വ്യത്യസ്ത ഊന്നലുകൾ നിലനിർത്തുന്നു.
- source_word: וְ/נִ֨בְרְכוּ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: 'ברך എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തെ പ്രധാന പാഠത്തിൽ കർമണിപ്രയോഗമായി എടുത്തിരിക്കുന്നു: ജനതകൾ അനുഗ്രഹത്തിന്റെ സ്വീകർത്താക്കളാകുന്നു. സാധ്യമായ ആത്മനേപദാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.'
- source_word: ב֔/וֹ
  choice: അവനിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള ബന്ധ/മണ്ഡലാർഥം സംരക്ഷിക്കുന്നു. ‘അവനിലൂടെ’ എന്നത് സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും എബ്രായപാഠത്തേക്കാൾ കാരണോപാധിയുടെ ആശയം വ്യക്തമായി ചേർക്കും.
- source_word: כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: ഇത് ഉല്പത്തിയിലെ സാർവത്രിക വ്യാപ്തിയുള്ള പ്രയോഗമാണ്. ‘സകല’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്; ‘ഭൂമി’ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനേക്കാൾ ഈ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിക അനുഗ്രഹവാക്യത്തിലെ נברכו എന്ന രൂപത്തിന്റെ അർഥം
  choice: ജനതകൾ അബ്രാഹാമിൽ അനുഗ്രഹിക്കപ്പെടുന്നവരായി ചിത്രീകരിക്കപ്പെടുന്നു.
  alternative: ജനതകൾ അബ്രാഹാമിനെ മുൻനിർത്തി തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും.
  rationale: നിഫാൽ രൂപത്തിന് ഇവിടെ കർമണിയർഥവും ആത്മനേപദാർഥവും നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്. വിശാലമായ വാഗ്ദാനസന്ദർഭത്തോട് കർമണിവായന നന്നായി ചേരുന്നതിനാൽ അത് പ്രധാന പാഠത്തിൽ സ്വീകരിച്ചു; എന്നാൽ സാധ്യമായ മറ്റൊരു വായനയെ ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആയിത്തീരും’ വാഗ്ദാനത്തിലെ ഭാവികാലമാറ്റം വ്യക്തമാക്കുന്നു; ‘സകല’ വാക്യത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
