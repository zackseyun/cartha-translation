id: GEN.18.3
reference: Genesis 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “എന്റെ യജമാനനേ, അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി അങ്ങയുടെ ദാസനെ കടന്നുപോകരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “കർത്താവേ”; അബ്രാഹാമിന്റെ സംബോധന സന്ദർശകനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയെന്നതിനു പകരം പ്രത്യേകമായി ദൈവത്തോടുള്ളതാണെന്ന വായന.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള വിവരണശൈലിയിൽ അവതരിപ്പിക്കുന്നു; ക്രമബന്ധം അനാവശ്യമായി കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אֲדֹנָי
  choice: എന്റെ യജമാനനേ
  rationale: ആദരപൂർവമായ ഏകവചന സംബോധന നിലനിർത്തുകയും, ഇത് ദൈവിക വിശേഷണമാണോ സന്ദർശകനോടുള്ള ബഹുമാനസംബോധനയാണോ എന്ന സന്ദർഭത്തിലെ അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אִם נָא
  choice: എങ്കിൽ
  rationale: വിനയപൂർവമായ അപേക്ഷയുടെ സോപാധിക ഘടന നൽകുന്നു; נָא സൂചിപ്പിക്കുന്ന വിനയം പിന്നീട് ‘ദയവായി’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: അനുകൂല പരിഗണന ലഭിക്കുക എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാഷ കഴിയുന്നത്ര നിലനിർത്തുന്നു; ഇവിടെ ആവശ്യമില്ലാത്ത സിദ്ധാന്തപരമായ അർത്ഥങ്ങൾ ‘കൃപ’ എന്ന പദത്തിലൂടെ ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- source_word: אַל נָא
  choice: ദയവായി ... അരുതേ
  rationale: നിഷേധാത്മക അപേക്ഷയോടൊപ്പമുള്ള വിനയവും അഭ്യർഥനാഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַעֲבֹר מֵעַל
  choice: കടന്നുപോകരുതേ
  rationale: ഒരാളെ പിന്നിലാക്കി മുന്നോട്ടുപോകുക എന്ന അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസനെ
  rationale: ശ്രേഷ്ഠനായ ഒരാളോടോ ആദരണീയനായ അതിഥിയോടോ ഉള്ള വിനയപൂർവ സ്വയംപരാമർശമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്; ‘അടിമ’ എന്നു പറയുന്നത് പ്രസക്തിയിലില്ലാത്ത സാമൂഹിക അർത്ഥഭാരം നൽകും.
theological_decisions:
- issue: אֲדֹנָי എന്നത് ദൈവിക വിശേഷണമായാണോ ആദരപൂർവമായ സംബോധനയായാണോ പരിഭാഷപ്പെടുത്തേണ്ടത്
  choice: എന്റെ യജമാനനേ
  alternative: കർത്താവേ
  rationale: ഉല്പത്തി 18-ൽ യഹോവ അബ്രാഹാമിനു പ്രത്യക്ഷനാകുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ പ്രസംഗം സന്ദർശകരിൽ ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ഒരാളോടാണ്. ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധന എന്ന വായന സാധ്യമാണെങ്കിലും വാക്യം അതിനെ നിർബന്ധിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം അവ്യക്തത നിലനിർത്തുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘അങ്ങ്’ എന്ന ആദരസൂചക ഏകവചനരൂപം തുടർന്നുള്ള 2ms സൂചനകളെ പ്രതിഫലിപ്പിക്കുന്നു. ‘എന്റെ യജമാനനേ’ ഉയർന്ന ആദരം നൽകുമ്പോഴും മുഖ്യപാഠത്തിൽ ദൈവിക തിരിച്ചറിയൽ തീർപ്പാക്കുന്നില്ല.
