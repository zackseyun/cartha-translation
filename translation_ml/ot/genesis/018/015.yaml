id: GEN.18.15
reference: Genesis 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: ml
  text: 'എന്നാൽ സാറാ ഭയപ്പെട്ടതിനാൽ, “ഞാൻ ചിരിച്ചില്ല” എന്നു പറഞ്ഞ് അത് നിഷേധിച്ചു.[a] അപ്പോൾ അവൻ പറഞ്ഞു: “അല്ല; നീ ചിരിച്ചു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാറാ കള്ളം പറഞ്ഞു’ എന്നും, ലളിതമായി ‘സാറാ നിഷേധിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായ ക്രിയയ്ക്ക് നിഷേധം അല്ലെങ്കിൽ വ്യാജം എന്ന ആശയം വരാം; ഇവിടെ അവൾ ചിരിച്ചുവെന്ന കാര്യം നിഷേധിക്കുന്നതിനെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉപവാക്യത്തിൽ സംസാരിക്കുന്നവന്റെ പേര് വ്യക്തമായി പറയുന്നില്ല; ചുറ്റുമുള്ള വിവരണസന്ദർഭം അവനെ യഹോവയുമായി തിരിച്ചറിയുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: അത് നിഷേധിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള כחשׁ എന്ന ക്രിയയ്ക്ക് ‘നിഷേധിക്കുക’ എന്നും ‘വ്യാജമായി പെരുമാറുക/കള്ളം പറയുക’ എന്നും അർഥമാകാം. ഇവിടെ സാറാ താൻ ചിരിച്ചുവെന്ന പ്രസ്താവന നിഷേധിക്കുന്നതിനാൽ, മുഖ്യപാഠത്തിൽ ‘അത് നിഷേധിച്ചു’ എന്നത് സന്ദർഭത്തിന് സ്വാഭാവികവും ധാർമ്മിക വിലയിരുത്തൽ അനാവശ്യമായി ശക്തമാക്കാത്തതുമാണ്.
- source_word: לֵאמֹר
  choice: എന്നു പറഞ്ഞ്
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം; മലയാളത്തിൽ മുൻവരുന്ന സംഭാഷണത്തെ പ്രധാനക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לֹא צָחַקְתִּי
  choice: ഞാൻ ചിരിച്ചില്ല
  rationale: നിഷേധരൂപത്തിലുള്ള ഒന്നാംപുരുഷ ഏകവചന സമാപ്തക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: כִּי יָרֵאָה
  choice: ഭയപ്പെട്ടതിനാൽ
  rationale: כִּי ഇവിടെ സാറായുടെ നിഷേധത്തിനുള്ള കാരണം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കാരണാർഥക രൂപം ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാരൂപം കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമാക്കുന്നു; ‘അവൻ’ എന്നത് മൂലത്തിലെ പരോക്ഷ കർത്തൃസൂചനയെക്കാൾ അധികം വ്യക്തത ചേർക്കുന്നില്ല.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: അല്ല; നീ ചിരിച്ചു
  rationale: ആദ്യത്തെ לֹא സാറായുടെ നിഷേധത്തെ തള്ളുന്നു; כִּי പിന്നാലെയുള്ള വാക്കിനെ പ്രതിവാദപരമായി ഉറപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമത്തോടെയുള്ള ചുരുക്കിയ മറുപടി ഈ ശക്തമായ തിരുത്തൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: וַיֹּאמֶר എന്നതിലെ സംസാരിക്കുന്നവന്റെ വ്യക്തിത്വം
  choice: ‘അവൻ പറഞ്ഞു’ എന്ന് പൊതുവായി നിലനിർത്തുന്നു.
  alternative: ‘യഹോവ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘ആ പുരുഷന്മാരിൽ ഒരാൾ പറഞ്ഞു’
  rationale: ഈ ഉപവാക്യത്തിൽ കർത്താവിന്റെ നാമം വീണ്ടും പറയാതെ പുരുഷലിംഗ ഏകവചന ക്രിയ മാത്രമാണ് ഉള്ളത്. ചുറ്റുപാടിലുള്ള വിവരണം സംസാരിക്കുന്നവനെ യഹോവയുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം നൽകുന്നതിലധികം വ്യക്തത മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കാൻ സർവനാമം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഞാൻ ചിരിച്ചില്ല’ എന്ന സംസാരഭാഷാസ്വാഭാവികതയും ‘അല്ല; നീ ചിരിച്ചു’ എന്ന ഉറച്ച പ്രതിവാദവും നിലനിർത്തി. ദൈവനാമം ഈ ഉപവാക്യത്തിൽ പുതുതായി ചേർത്തിട്ടില്ല.
