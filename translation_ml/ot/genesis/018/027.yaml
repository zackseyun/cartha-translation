  terminology: “എന്റെ കർത്താവ്” appropriately reflects the contextual divine identification while the footnote preserves the lexical possibility “എന്റെ യജമാനൻ.” “പൊടിയും ചാരവും” is the established Malayalam equivalent of the Hebrew idiom.
