id: GEN.18.27
reference: Genesis 18:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാഹാം മറുപടിയായി പറഞ്ഞു: “ഇതാ, പൊടിയും ചാരവും മാത്രമായ ഞാൻ എന്റെ കർത്താവിനോടു[a] സംസാരിക്കാൻ തുനിഞ്ഞിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ യജമാനനോടു.” ഈ ഹീബ്രു രൂപം ആദരപൂർവമായ അഭിസംബോധനയായിരിക്കാം; എന്നാൽ ചുറ്റുപാടിലുള്ള വിവരണം അബ്രാഹാം അഭിസംബോധന ചെയ്യുന്നവനെ യഹോവയുമായി തിരിച്ചറിയുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ടു ക്രിയകളുടെയും മറുപടി-പ്രസംഗ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ഇരട്ടപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: הִנֵּה נָא
  choice: ഇതാ
  rationale: הִנֵּהയുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ധർമ്മം നിലനിർത്തുന്നു. נָא നൽകുന്ന വിനയഭാവം വാക്യത്തിലെ മുഴുവൻ ആദരപൂർവമായ അഭിസംബോധനയിലും ‘തുനിഞ്ഞിരിക്കുന്നു’ എന്ന പ്രയോഗത്തിലും പ്രകടമാണ്; ‘ദയവായി’ ഇവിടെ മലയാളത്തിൽ അസ്വാഭാവികമാകും.
- source_word: הוֹאַלְתִּי
  choice: തുനിഞ്ഞിരിക്കുന്നു
  rationale: സ്വയം ധൈര്യപ്പെട്ട് ഒരു കാര്യം ഏറ്റെടുക്കുക എന്ന അർഥവും അബ്രാഹാമിന്റെ വിനയത്തോടു ചേർന്ന ധീരതയും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: לְדַבֵּר
  choice: സംസാരിക്കാൻ
  rationale: דבר എന്ന ക്രിയയുടെ പൊതുവായ ‘സംസാരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל־אֲדֹנָי
  choice: എന്റെ കർത്താവിനോടു
  rationale: പ്രത്യയത്തിലുള്ള ‘എന്റെ’ നിലനിർത്തുകയും ആദരപൂർവമായ അഭിസംബോധന നൽകുകയും ചെയ്യുന്നു; ദൈവികമോ മാനുഷികമോ ആയ അഭിസംബോധന എന്ന രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְאָנֹכִי עָפָר וָאֵפֶר
  choice: പൊടിയും ചാരവും മാത്രമായ ഞാൻ
  rationale: വാക്യസന്ദർഭത്തിലെ വിരുദ്ധതയും ആത്മതാഴ്മയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പൊടിയും ചാരവും’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲדֹנָי എന്ന അഭിസംബോധനയുടെ തിരിച്ചറിയൽ
  choice: എന്റെ കർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: ചുറ്റുപാടിലുള്ള വിവരണം അഭിസംബോധിതനെ യഹോവയുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘കർത്താവ്’ യോജിക്കുന്നു. എങ്കിലും ഹീബ്രു രൂപം ആദരപൂർവമായ മാനുഷിക അഭിസംബോധനയും ആകാമെന്ന യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘ഇതാ’ എന്നത് ഔപചാരിക ശ്രദ്ധാകർഷകമായി ഉപയോഗിച്ചു; ‘തുനിഞ്ഞിരിക്കുന്നു’ അബ്രാഹാമിന്റെ ധീരതയും ആത്മതാഴ്മയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട അഭിസംബോധനയ്ക്കുശേഷം വാക്യത്തിനുള്ളിൽ നൽകിയിരിക്കുന്നു.
