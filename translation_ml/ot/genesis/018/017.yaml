source:
  edition: WLC
  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: ml
  text: 'യഹ്‌വേ പറഞ്ഞു[a]: “ഞാൻ ചെയ്യുന്നത് അബ്രാഹാമിൽനിന്ന് മറച്ചുവെക്കണമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ ചെയ്യുന്നത് അബ്രാഹാമിൽനിന്ന് മറച്ചുവെക്കുകയാണോ?”'
    reason: ചോദ്യകണത്തോടുകൂടിയ הַמְכַסֶּה എന്ന രൂപത്തെ ആലോചനാത്മകമായോ പുരോഗമനമായോ വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וַֽ/יהֹוָ֖ה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אָמָ֑ר
  choice: പറഞ്ഞു
  rationale: വയിക്തോൽ രൂപം കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാല ക്രിയയാണ്; ഇവിടെ പൂർവഭൂതകാലം ആവശ്യമില്ല.
- source_word: הַֽ/מְכַסֶּ֤ה
  choice: മറച്ചുവെക്കണമോ
  rationale: ചോദ്യകണത്തോടുകൂടിയ കർത്തൃവാചക രൂപം സ്വയം ആലോചിക്കുന്ന ചോദ്യമായി വായിക്കാം; മലയാളത്തിൽ ‘മറച്ചുവെക്കണമോ?’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵֽ/אַבְרָהָ֔ם
  choice: അബ്രാഹാമിൽനിന്ന്
  rationale: ‘മറയ്ക്കുക’ എന്ന ക്രിയയോടൊപ്പം מִן സൂചിപ്പിക്കുന്ന വേർതിരിവ് മലയാളത്തിൽ ‘-യിൽനിന്ന്’ എന്നുപറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁ֖ר
  choice: എന്തോ അത് / ചെയ്യുന്നത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യാതൊന്ന്’ എന്നതിനു പകരം, അനുബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഞാൻ ചെയ്യുന്നത്’ എന്നു ചേർത്തു.
- source_word: אֲנִ֥י עֹשֶֽׂה
  choice: ഞാൻ ചെയ്യുന്നത്
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ പുരോഗമനപരമോ സമീപഭാവികമോ ആയ സാധ്യത മുൻകൂട്ടി തീർപ്പാക്കാതെ, നേരിട്ടുള്ള ‘ഞാൻ ചെയ്യുന്നത്’ എന്ന രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ദൈവത്തിന്റെ ചോദ്യം ഇപ്പോഴത്തെ പ്രവൃത്തിയെയോ ആലോചനാത്മക തീരുമാനത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘മറച്ചുവെക്കണമോ?’ എന്ന ആലോചനാത്മക ചോദ്യം
  alternative: ‘മറച്ചുവെക്കുകയാണോ?’ എന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പുരോഗമന ചോദ്യം
  rationale: ചോദ്യകണത്തോടുകൂടിയ participle ഇവിടെ ആലോചനാത്മകമായ അലങ്കാരചോദ്യമായി സ്വാഭാവികമായി മനസ്സിലാക്കാം; എന്നാൽ രൂപപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ‘മറച്ചുവെക്കണമോ’ എന്നത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കുമ്പോഴും ഹീബ്രുവിലെ ആലോചനാത്മക ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
