id: GEN.18.13
reference: Genesis 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: ml
  text: 'യഹോവ അബ്രാഹാമിനോടു പറഞ്ഞു: “സാറ, ‘ഞാൻ വയസ്സായിരിക്കെ, എനിക്ക് ശരിക്കും ഒരു കുഞ്ഞിനെ പ്രസവിക്കാനാകുമോ?’ എന്നു പറഞ്ഞ് ചിരിച്ചതെന്തിന്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റണിനെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: הַאַף אֻמְנָם אֵלֵד
  choice: ശരിക്കും ഒരു കുഞ്ഞിനെ പ്രസവിക്കാനാകുമോ?
  rationale: הַאַף אֻמְנָם നൽകുന്ന ആശ്ചര്യവും അവിശ്വാസഭാവവും സ്വാഭാവിക മലയാള ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു; אֵלֵד എന്നതിന്റെ പ്രസവിക്കുക എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: വയസ്സായ എനിക്ക്
  rationale: ‘ഞാൻ വൃദ്ധയായിരിക്കുന്നു’ എന്ന ആശയം ഉദ്ധരിച്ച ചോദ്യത്തിനുള്ളിൽ സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ പദവിയല്ല, יהוה എന്ന വ്യക്തിനാമമാണ്; അതിനാൽ പേരിന്റെ സ്വഭാവം നിലനിർത്തി.
- issue: സാറയുടെ ചോദ്യത്തിന്റെ ഭാവം
  choice: ‘ശരിക്കും ... ആകുമോ?’
  alternative: ‘തീർച്ചയായും ... പ്രസവിക്കുമോ?’
  rationale: സാറയുടെ ആശ്ചര്യവും സംശയവും നിലനിർത്തുന്നു; ഉറപ്പിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാവുന്ന രൂപം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലത്തിലെ ദൈവിക ചോദ്യം, സാറയുടെ ചിരി, വാർധക്യത്തെ അടിസ്ഥാനമാക്കിയുള്ള അവളുടെ സംശയം എന്നിവ സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
