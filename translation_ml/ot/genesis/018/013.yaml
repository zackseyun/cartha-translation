revisions:
- from: 'അപ്പോൾ യഹോവ അബ്രാഹാമിനോടു പറഞ്ഞു: “സാറ ചിരിച്ചുകൊണ്ട്, ‘വയസ്സായ എനിക്ക് ശരിക്കും ഒരു കുഞ്ഞിനെ പ്രസവിക്കാനാകുമോ?’ എന്നു പറഞ്ഞത് എന്തുകൊണ്ട്?”'
  to: 'യഹോവ അബ്രാഹാമിനോടു പറഞ്ഞു: “സാറ, ‘ഞാൻ വയസ്സായിരിക്കെ, എനിക്ക് ശരിക്കും ഒരു കുഞ്ഞിനെ പ്രസവിക്കാനാകുമോ?’ എന്നു പറഞ്ഞ് ചിരിച്ചതെന്തിന്?”'
  rationale: A small revision removes an unsupported temporal connective and avoids portraying the laughter as necessarily concurrent with speech. The wording retains the divine name, Sarah’s incredulous question, her first-person old age, and the implied object of bearing a child.
