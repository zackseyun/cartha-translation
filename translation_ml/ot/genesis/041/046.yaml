  terminology: ‘യോസേഫ്,’ ‘ഫറവോൻ,’ and ‘സന്നിധി’ are appropriate in a dignified modern biblical register. Repeating ‘സന്നിധി’ appropriately reflects the repeated לפני / מִלִּפְנֵי expression.
