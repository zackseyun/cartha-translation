id: GEN.41.46
reference: Genesis 41:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יוֹסֵף֙ בֶּן שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּ/עָמְד֕/וֹ לִ/פְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יֵּצֵ֤א יוֹסֵף֙ מִ/לִּ/פְנֵ֣י פַרְעֹ֔ה וַֽ/יַּעְבֹ֖ר בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: ml
  text: ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ സന്നിധിയിൽ നിന്നപ്പോൾ യോസേഫിന് മുപ്പത് വയസ്സായിരുന്നു. യോസേഫ് ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ട് ഈജിപ്തുദേശമെങ്ങും സഞ്ചരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: മുപ്പതു വയസ്സായിരുന്നു
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: ഫറവോന്റെ സന്നിധിയിൽ നിന്നപ്പോൾ
  rationale: കാലബന്ധവും രാജസന്നിധിയിൽ ഹാജരാകുന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോൻ
  rationale: ഫറവോനെ ഈജിപ്തിന്റെ രാജാവായി തിരിച്ചറിയിക്കുന്ന സമാനാധികരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ സന്നിധിയിൽനിന്നു പുറപ്പെട്ടു
  rationale: יצא എന്ന പുറപ്പെടലും לפני എന്ന സന്നിധി-പ്രയോഗത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവൻ സഞ്ചരിച്ചു
  rationale: രാജ്യമെങ്ങുമുള്ള വ്യാപകമായ സഞ്ചാരം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഭരണപരമായ ഉദ്ദേശ്യം പാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: וְ
  choice: വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ആദ്യത്തെ וְ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ ബന്ധം പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സന്നിധി’ രാജസഭാപരമായ לפני എന്ന പ്രയോഗം ഇരുവിടത്തും നിലനിർത്തുന്നു; എന്നാൽ പഴഞ്ചനായ വാക്യഘടന ഒഴിവാക്കുന്നു.
