translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കരുതൽശേഖരം’ ഭരണപരമായ സംഭരണസന്ദർഭം വ്യക്തമാക്കുന്നു. മൂലഭാഷയിലെ כרת എന്ന രൂപകം മുഖ്യവാചകത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ സന്ദർഭാർഥം നൽകിയിട്ടും അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിച്ചിട്ടുണ്ട്.
