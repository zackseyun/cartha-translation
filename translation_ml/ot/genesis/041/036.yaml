source:
  edition: WLC
  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: ml
  text: ആ ഭക്ഷണം ഈജിപ്തുദേശത്തുണ്ടാകാനിരിക്കുന്ന ക്ഷാമത്തിന്റെ ഏഴു വർഷങ്ങൾക്കായി ദേശത്തിന് ഒരു കരുതൽശേഖരമായിരിക്കും[a]; അങ്ങനെ ക്ഷാമം മൂലം ദേശം നശിച്ചുപോകാതിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സംഭരണത്തിനായി” അഥവാ “ഒരു ശേഖരം.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം, “ദേശം ഛേദിക്കപ്പെടാതിരിക്കാൻ” എന്നാണ്; ഇവിടെ ക്ഷാമം മൂലം രാജ്യം നശിക്കുകയോ തകർന്നുപോകുകയോ ചെയ്യാതിരിക്കുക എന്നാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ആയിരിക്കണം
  rationale: സംഭരിക്കൽനയത്തിന്റെ ഉദ്ദേശിച്ച ഫലത്തെ വിവരിക്കുന്ന ഭാവി/നിർദേശാത്മക സന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאֹכֶל
  choice: ആ ഭക്ഷണം
  rationale: മുൻവാക്യത്തിൽ ശേഖരിക്കാൻ പറഞ്ഞ വിളവിനെ ചൂണ്ടിക്കാണിക്കുന്നു; ‘ധാന്യം’ എന്നതിനെക്കാൾ വിശാലമായ മൂലപദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: לְפִקָּדוֹן
  choice: കരുതൽശേഖരം
  rationale: ഭാവിയിലെ ആവശ്യത്തിനായി സുരക്ഷിതമായി സൂക്ഷിക്കുന്ന സംഭാരം എന്ന ഭരണപരമായ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: ക്ഷാമത്തിന്റെ ഏഴു വർഷത്തേക്കായി
  rationale: നേരത്തേ വ്യക്തമാക്കിയ പ്രത്യേക ഏഴു ക്ഷാമവർഷങ്ങളെ സൂചിപ്പിക്കുകയും അവയ്ക്കുവേണ്ടിയുള്ള കരുതൽ എന്ന ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുണ്ടാകാനിരിക്കുന്ന
  rationale: ക്ഷാമവർഷങ്ങളുടെ ഭാവിസംഭവവും അവയുടെ സ്ഥലവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: അങ്ങനെ ... ദേശം നശിച്ചുപോകാതിരിക്കും
  rationale: כרת എന്ന പദത്തിന്റെ അക്ഷരാർഥചിത്രം ‘ഛേദിക്കപ്പെടുക’ എന്നാണെങ്കിലും, ക്ഷാമംമൂലം രാജ്യം തകർന്നുപോകാതിരിക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בָּרָעָב
  choice: ക്ഷാമംമൂലം
  rationale: ക്ഷാമത്തെ നാശത്തിന്റെ കാരണമായി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
