id: GEN.41.12
reference: Genesis 41:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: ml
  text: അവിടെ ഞങ്ങളോടൊപ്പം കാവൽപ്പടയുടെ തലവന്റെ അടിമയായ ഒരു എബ്രായ യുവാവ് ഉണ്ടായിരുന്നു. ഞങ്ങൾ അവനോടു ഞങ്ങളുടെ സ്വപ്നങ്ങൾ വിവരിച്ചു; അവൻ അവ വ്യാഖ്യാനിച്ചുതന്നു—ഓരോരുത്തന്റെയും സ്വപ്നത്തിന് അനുസരിച്ച് അവൻ വ്യാഖ്യാനം നൽകി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: യുവാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ബാലൻ എന്നതിനെക്കാൾ പ്രായപൂർത്തിയിലേക്കെത്തിയ ചെറുപ്പക്കാരനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപദം.
- source_word: עִבְרִי
  choice: എബ്രായ
  rationale: വംശീയ തിരിച്ചറിയലിനുള്ള പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: עֶבֶד
  choice: അടിമ
  rationale: യോസേഫിന്റെ ബന്ധിതാവസ്ഥയും മറ്റൊരാളുടെ ഉടമസ്ഥതയിലുള്ള സ്ഥിതിയും മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: שַׂר הַטַּבָּחִים
  choice: കാവൽപ്പടത്തലവൻ
  rationale: പദശഃ വധകരുടെ തലവൻ എന്ന സാധ്യതയുണ്ടെങ്കിലും, ഉല്പത്തിയിലെ ഈജിപ്ഷ്യൻ ഔദ്യോഗികസ്ഥാനത്തിന് സന്ദർഭോചിതവും വായനാസൗകര്യമുള്ളതുമായ രൂപം.
- source_word: וַנְּסַפֶּר לוֹ
  choice: ഞങ്ങൾ അവനോടു ഞങ്ങളുടെ സ്വപ്നങ്ങൾ വിവരിച്ചു
  rationale: ספר എന്ന ക്രിയയുടെ വിവരിക്കുക/പറഞ്ഞുകൊടുക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യസന്ദർഭത്തിൽ സ്വപ്നങ്ങൾ എന്ന കർമം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: അവൻ അവ വ്യാഖ്യാനിച്ചുതന്നു
  rationale: സ്വപ്നസന്ദർഭത്തിലെ פתר എന്ന ക്രിയയുടെ വ്യാഖ്യാനിക്കുക എന്ന അർഥവും לָנוּ എന്ന ഉപകാരാർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: ഓരോരുത്തന്റെയും സ്വപ്നത്തിന് അനുസരിച്ച് അവൻ വ്യാഖ്യാനം നൽകി
  rationale: ഓരോ വ്യക്തിക്കും അയാളുടെ പ്രത്യേക സ്വപ്നത്തിനനുസരിച്ചുള്ള വ്യാഖ്യാനം ലഭിച്ചു എന്ന വിതരണാത്മക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ അവസാന ഉപവാക്യം വ്യക്തിഗത വ്യാഖ്യാനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്ന വിധത്തിൽ രൂപപ്പെടുത്തി.
