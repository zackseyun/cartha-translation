  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഫറവോന്റെ പരമാധികാരപ്രഖ്യാപനവും യോസേഫിന് നൽകിയ ഭരണാധികാരവും വ്യക്തമായി നിലനിർത്തുന്നു; എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യപാഠത്തിലും അർഥവിവരണം അടിക്കുറിപ്പിലും നൽകുന്നു.
