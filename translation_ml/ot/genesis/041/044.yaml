source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “ഞാൻ ഫറവോനാണ്; നിന്നെ കൂടാതെ[a] ഈജിപ്തുദേശത്തെങ്ങും ആരും കൈയോ കാലോ ഉയർത്തുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ അനുമതിയില്ലാതെ.” ഈജിപ്തിൽ യോസേഫിന്റെ അധികാരത്തിൽനിന്ന് വേറിട്ട് ആർക്കും പ്രവർത്തിക്കാനാവില്ലെന്ന ആശയമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം “കൈയോ കാലോ ഉയർത്തുകയില്ല”; എന്തെങ്കിലും ചെയ്യുകയോ ഒരു നീക്കം നടത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֲנִי פַרְעֹה
  choice: ഞാൻ ഫറവോനാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിന്റെ ഊന്നലോടെയുള്ള രാജകീയ സ്വയംപ്രഖ്യാപനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבִלְעָדֶיךָ
  choice: നിന്റെ അനുമതിയില്ലാതെ
  rationale: പദത്തിന് ‘നിന്നെ കൂടാതെ’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, ഈ അധികാരപ്രഖ്യാപനത്തിന്റെ സാഹചര്യത്തിൽ യോസേഫിന്റെ അനുമതിയോ അധികാരമോ കൂടാതെ എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יָרִים
  choice: ഉയർത്തുകയില്ല
  rationale: רוּם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘ഉയർത്തുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുകയും രാജകല്പനയുടെ ഭാവാർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: אִישׁ
  choice: ആരും
  rationale: ഇവിടെ ഏകവചന പുല്ലിംഗപദം പൊതുവായ നിഷേധാർഥത്തിൽ വരുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ആരും’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: കൈയോ കാലോ
  rationale: നിഷേധവാക്യത്തിൽ യാതൊരു പ്രവൃത്തിയും നീക്കവും നടത്തുക എന്ന പ്രയോഗാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഓ...ഓ’ ഉപയോഗിക്കുന്നു; കൈയും കാലും എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: ‘ഈജിപ്തുദേശം മുഴുവനിലും’ എന്ന പ്രദേശവ്യാപകമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
