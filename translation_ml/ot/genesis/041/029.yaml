  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ശൈലി. ഹീബ്രുവിലെ ശ്രദ്ധാകർഷകമായ തുടക്കവും ‘വരുന്നു’ എന്ന കൃതന്തരൂപത്തിന്റെ സജീവതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
