id: GEN.41.37
reference: Genesis 41:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י פַרְעֹ֑ה וּ/בְ/עֵינֵ֖י כָּל עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: ml
  text: ആ കാര്യം ഫറവോന്റെ കണ്ണിലും അവന്റെ എല്ലാ ദാസന്മാരുടെയും കണ്ണിലും നല്ലതായി തോന്നി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: നല്ലതായി തോന്നി
  rationale: יטב എന്ന ക്രിയ בְּעֵינֵי എന്ന പ്രയോഗത്തോടൊപ്പം ഒരു കാര്യം സ്വീകാര്യമായോ പ്രസാദകരമായോ വിലയിരുത്തപ്പെട്ടുവെന്ന് സൂചിപ്പിക്കുന്നു. ‘നല്ലതായി തോന്നി’ എന്നത് ആ വിലയിരുത്തൽഭാവവും വാക്യത്തിലെ വിഷയമായി ‘കാര്യം’ തന്നെയുമുള്ള ഘടനയും നിലനിർത്തുന്നു.
- source_word: הַדָּבָר
  choice: ആ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന് ‘വാക്ക്’, ‘കാര്യം’, ‘വിഷയം’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. സന്ദർഭത്തിൽ ഇത് യോസേഫ് പറഞ്ഞ നിർദേശത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘ആ കാര്യം’ എന്നത് മൂലപദത്തിന്റെ വിശാലത ചുരുക്കാതെ സമീപസന്ദർഭത്തിലെ നിർദിഷ്ട പരാമർശം വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: കണ്ണിൽ
  rationale: ‘കണ്ണിൽ’ എന്ന മലയാളപ്രയോഗം എബ്രായത്തിലെ ‘ഒരാളുടെ കണ്ണിൽ’ എന്ന വിലയിരുത്തൽസൂചക ശൈലി സ്വാഭാവികമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: രാജപദവിക്കുള്ള മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: כָּל עֲבָדָיו
  choice: അവന്റെ എല്ലാ ദാസന്മാർ
  rationale: עֲבָדִים എന്നത് ദാസന്മാരെയോ രാജസേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. ‘ദാസന്മാർ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച בְּעֵינֵי ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഒരൊറ്റ ‘കണ്ണിൽ’ എന്നതിനു കീഴിൽ സംയോജിപ്പിച്ചെങ്കിലും, ഫറവോനും അവന്റെ എല്ലാ ദാസന്മാരും എന്ന രണ്ടു വിലയിരുത്തൽവിഭാഗങ്ങളും വ്യക്തമായി നിലനിർത്തി.
