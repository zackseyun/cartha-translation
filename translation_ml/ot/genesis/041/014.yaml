  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: ml
  text: അപ്പോൾ ഫറവോൻ ആളയച്ച് യോസേഫിനെ വിളിപ്പിച്ചു. അവർ അവനെ കുഴിയിൽനിന്ന്[a] വേഗത്തിൽ പുറത്തുകൊണ്ടുവന്നു[b]. അവൻ ക്ഷൗരം ചെയ്ത് വസ്ത്രങ്ങൾ മാറ്റി ഫറവോന്റെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തടവറയിൽനിന്ന്.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “കുഴി” എന്നാണ്; കുഴിപോലുള്ള തടവിടത്തെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ അവനെ കുഴിയിൽനിന്ന് തിടുക്കത്തിൽ പുറത്തുകൊണ്ടുവന്നു.” എബ്രായക്രിയ യോസേഫിനെ വേഗത്തിൽ നീക്കിയതിന്റെ അടിയന്തരത സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: ആളയച്ച് യോസേഫിനെ വിളിപ്പിച്ചു
  rationale: രണ്ട് എബ്രായ ക്രിയകളെയും പ്രതിഫലിപ്പിക്കുമ്പോൾത്തന്നെ, യോസേഫിനെ കൊണ്ടുവരാൻ ഫറവോൻ കല്പിച്ചു എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְרִיצֻהוּ
  choice: അവർ അവനെ ... വേഗത്തിൽ പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപം യോസേഫിനെ വേഗത്തിൽ നീങ്ങാൻ ഇടയാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. പ്രവർത്തകരായി രാജസേവകരെ സൂചിപ്പിക്കുന്ന ബഹുവചനവും പ്രവൃത്തിയുടെ അടിയന്തരതയും ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִן הַבּוֹר
  choice: കുഴിയിൽനിന്ന്
  rationale: בּוֹר എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കുഴി’ എന്നാണ്; സന്ദർഭത്തിൽ അത് കുഴിപോലുള്ള തടവിടത്തെയും സൂചിപ്പിക്കാം. മുമ്പത്തെ യോസേഫ് കഥയുമായുള്ള പദബന്ധവും ‘കുഴി’ നിലനിർത്തുന്നു.
- source_word: וַיְגַלַּח
  choice: ക്ഷൗരം ചെയ്ത്
  rationale: സജീവവും സംക്ഷിപ്തവുമായ എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം; രാജസന്നിധിയിൽ പ്രവേശിക്കുന്നതിന് മുമ്പുള്ള ശരീരപരിചരണം എന്നതിനപ്പുറം വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: വസ്ത്രം മാറി
  rationale: സ്വന്തം വസ്ത്രങ്ങൾ മാറ്റി എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ ലളിതമായി നൽകുന്നു.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: ഫറവോന്റെ അടുക്കൽ ചെന്നു
  rationale: בוא אל എന്ന പ്രയോഗത്തിന്റെ ദിശയും രാജാവിന്റെ സന്നിധിയിലേക്കുള്ള വരവും അധിക വ്യാഖ്യാനം കൂടാതെ വ്യക്തമാക്കുന്നു.
