translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘ആളയച്ച് ... വിളിപ്പിച്ചു’ എന്ന പ്രയോഗം മൂലത്തിലെ രണ്ടു ക്രിയകളെയും അനാവശ്യമായ ആവർത്തനമില്ലാതെ നിലനിർത്തുന്നു; ‘ക്ഷൗരം’ സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ ശരീരപരിചരണപദമായി ഉപയോഗിച്ചു.
