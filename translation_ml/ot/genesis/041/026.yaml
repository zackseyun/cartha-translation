id: GEN.41.26
reference: Genesis 41:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: ml
  text: നല്ല ഏഴു പശുക്കൾ ഏഴു വർഷങ്ങളാണ്; നല്ല ഏഴു ധാന്യക്കതിരുകളും ഏഴു വർഷങ്ങളാണ്. ഇത് ഒരൊറ്റ സ്വപ്നമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: പശുക്കൾ
  rationale: ഫറവോന്റെ സ്വപ്നത്തിലെ പെൺകന്നുകാലികളെയാണ് ഈ പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ തത്തുല്യപദം ‘പശുക്കൾ’ ആണ്.
- source_word: הַטֹּבֹת
  choice: നല്ല
  rationale: ഹീബ്രു വിശേഷണത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുകയും അവയുടെ രൂപമോ ആരോഗ്യനിലയോ മാത്രം ഉദ്ദേശിക്കുന്നതായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׁנִים
  choice: വർഷങ്ങൾ
  rationale: സ്വപ്നത്തിലെ പ്രതീകങ്ങൾക്ക് വാചകം നേരിട്ട് നൽകുന്ന വ്യാഖ്യാനമാണ് ‘വർഷങ്ങൾ’.
- source_word: שִׁבֳּלִים
  choice: ധാന്യക്കതിരുകൾ
  rationale: ധാന്യം നിറഞ്ഞ തണ്ടിന്റെ മുകൾഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ധാന്യക്കതിരുകൾ’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: ഇത് ഒരൊറ്റ സ്വപ്നമാണ്
  rationale: രണ്ടു പ്രതീകപരമ്പരകളും ഏകീകൃതമായ ഒരു സ്വപ്നസന്ദേശമാണെന്ന ഹീബ്രുവിലെ ഏകവചന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֵנָּה
  choice: ആണ്
  rationale: ഹീബ്രുവിലെ സ്ത്രീലിംഗ ബഹുവചന സർവനാമം ഇവിടെ സംയോജകക്രിയയുടെ ധർമത്തിലാണ്; മലയാളത്തിൽ ‘ആണ്’ എന്ന രൂപം സ്വാഭാവികമാണ്.
