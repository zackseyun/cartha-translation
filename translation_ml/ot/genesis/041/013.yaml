source:
  edition: WLC
  text: וַ/יְהִ֛י כַּ/אֲשֶׁ֥ר פָּֽתַר לָ֖/נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛/י הֵשִׁ֥יב עַל כַּנִּ֖/י וְ/אֹת֥/וֹ תָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: ml
  text: 'അവൻ ഞങ്ങൾക്കു വ്യാഖ്യാനിച്ചതുപോലെതന്നെ സംഭവിച്ചു: എന്നെ എന്റെ സ്ഥാനത്ത് പുനഃസ്ഥാപിച്ചു; അവനെയോ തൂക്കിക്കൊന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: വ്യാഖ്യാനിച്ചുതന്നതുപോലെതന്നെ സംഭവിച്ചു
  rationale: പ്രവചനവ്യാഖ്യാനവും അതിന്റെ കൃത്യമായ നിറവേറലും തമ്മിലുള്ള പൊരുത്തം ആവർത്തനം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: פָּתַר לָנוּ
  choice: ഞങ്ങൾക്കു വ്യാഖ്യാനിച്ചുതന്നു
  rationale: സ്വപ്നസന്ദർഭത്തിൽ פתר എന്നത് സ്വപ്നത്തിന്റെ അർഥം വ്യാഖ്യാനിക്കുക എന്നർഥമാണ്; ദാതൃപ്രയോഗമായ לָנוּ മലയാളത്തിൽ ‘ഞങ്ങൾക്കു ... തന്നു’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: എന്നെ എന്റെ സ്ഥാനത്തേക്കു തിരികെ നിയമിച്ചു
  rationale: വാക്യാരംഭത്തിലെ ‘എന്നെ’ എതിർഫലത്തോടുള്ള ഊന്നൽ നിലനിർത്തുന്നു. עַל כַּנִּי മുൻ ഔദ്യോഗികസ്ഥാനത്തേക്കുള്ള പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരികെ നിയമിച്ചു’ എന്നു നൽകി.
- source_word: וְאֹתוֹ תָלָה
  choice: അവനെയോ തൂക്കിക്കൊന്നു
  rationale: മുന്നിലുള്ള പുനഃസ്ഥാപനത്തോട് കടുത്ത വൈരുധ്യം കാണിക്കാൻ ‘അവനെയോ’ ഉപയോഗിച്ചു. ന്യായവിധിസന്ദർഭത്തിലെ תלה വധത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ വെറും തൂക്കിയിടൽ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘തൂക്കിക്കൊന്നു’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘എന്നെ/അവനെ’ എന്ന വിരുദ്ധ ഊന്നൽ നിലനിർത്തിയിട്ടുണ്ട്; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
