  naturalness: ‘ഈജിപ്ത് ദേശത്തുണ്ടായ ഏഴു വർഷങ്ങളിലെ’ എന്നും ‘ഓരോ പട്ടണത്തെ ചുറ്റിയുള്ള വയലിലെ’ എന്നും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘പട്ടണത്തിനുള്ളിൽ’ എന്നതിനു പകരം ‘പട്ടണത്തിൽ’ മുഖ്യവാചകത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; ‘അതിനുള്ളിൽ’ എന്ന പദാനുസൃത ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കാം.
