  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: ml
  text: അവൻ ഈജിപ്ത് ദേശത്തുണ്ടായ ഏഴു വർഷങ്ങളിലെ ആഹാരമെല്ലാം ശേഖരിച്ച് പട്ടണങ്ങളിൽ വെച്ചു. ഓരോ പട്ടണത്തെ ചുറ്റിയുള്ള വയലിലെ ആഹാരം അതതു പട്ടണത്തിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “പട്ടണത്തിനു ചുറ്റുമുള്ള വയലിലെ ആഹാരം അതിനുള്ളിൽ വെച്ചു.” എബ്രായമൂലത്തിൽ ‘ആഹാരം’ എന്ന പദം ആവർത്തിക്കുന്നു; രണ്ടാം വാക്യഭാഗം പുനരാരംഭിച്ച് അതേ പട്ടണത്തിൽ വെച്ചുവെന്ന് ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ശേഖരിച്ചു
  rationale: קבץ എന്ന ക്രിയയുടെ ‘ഒരുമിച്ചുകൂട്ടുക/ശേഖരിക്കുക’ എന്ന അർഥം ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל אֹכֶל
  choice: ആഹാരമെല്ലാം
  rationale: אֹכֶל എന്നത് ധാന്യത്തിൽ മാത്രം ഒതുങ്ങാത്ത പൊതുവായ ‘ആഹാരം’ എന്ന പദമാണ്; അതിനാൽ സന്ദർഭം കണക്കിലെടുത്ത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുണ്ടായ സമൃദ്ധിയുടെ ഏഴു വർഷങ്ങൾ
  rationale: ‘ഏഴു വർഷങ്ങൾ’ എന്ന് പദശഃ പറയുന്നുവെങ്കിലും 41:47-ലെ സമൃദ്ധിവർഷങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഉണ്ടായ’ എന്നത് היה-യുടെ ലളിതത്വം നിലനിർത്തുന്നു; ‘സമൃദ്ധിയുടെ’ എന്നത് സന്ദർഭസൂചന വ്യക്തമാക്കി കാലഘട്ടത്തിലെ എല്ലാ ഭക്ഷണവും ശേഖരിച്ചു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: ആഹാരം പട്ടണങ്ങളിൽ വെച്ചു
  rationale: נתן ഇവിടെ ‘വെച്ചു’ എന്നാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. ‘സംഭരിച്ചു’ എന്നത് സന്ദർഭോചിതമാണെങ്കിലും മൂലത്തിലെ പൊതുവായ ക്രിയയെക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: ഓരോ പട്ടണത്തിനും ചുറ്റുമുള്ള വയലുകളിൽനിന്നുള്ള ആഹാരം
  rationale: സംബന്ധവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; ഓരോ പട്ടണത്തെയും ചുറ്റിയ വയലുകളിൽനിന്നുള്ള വിളവാണ് അതതു പട്ടണത്തിൽ വെച്ചതെന്ന വിതരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: נָתַן בְּתוֹכָהּ
  choice: അതതു പട്ടണത്തിനുള്ളിൽ വെച്ചു
  rationale: ‘അതിനുള്ളിൽ വെച്ചു’ എന്ന എബ്രായ പുനരാരംഭഘടനയുടെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
