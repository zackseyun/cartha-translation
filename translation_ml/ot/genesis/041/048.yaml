  to: അവൻ ഈജിപ്ത് ദേശത്തുണ്ടായ ഏഴു വർഷങ്ങളിലെ ആഹാരമെല്ലാം ശേഖരിച്ച് പട്ടണങ്ങളിൽ വെച്ചു. ഓരോ പട്ടണത്തെ ചുറ്റിയുള്ള വയലിലെ ആഹാരം അതതു പട്ടണത്തിൽ വെച്ചു.[a]
