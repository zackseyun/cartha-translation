  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആഹാരം’, ‘പട്ടണം’, ‘വയൽ’ തുടങ്ങിയ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആവർത്തനം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, കൂടുതൽ പദാനുസൃതമായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
