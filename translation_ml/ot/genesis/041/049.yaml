translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും ബൈബിൾസഹജമായ ഉപമയും നിലനിർത്തിയിരിക്കുന്നു. ‘കടലിലെ മണൽ’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തിനു പകരം സ്വാഭാവികമായ ‘കടൽപ്പുറം’ ഉപയോഗിച്ചു.
