  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: ml
  text: യോസേഫ് കടലിലെ മണൽപോലെ വളരെ അധികം ധാന്യം സംഭരിച്ചുവച്ചു, അവൻ എണ്ണുന്നത് നിർത്തുന്നതുവരെ; കാരണം അതിന് എണ്ണമില്ലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘കാരണം അതിന് എണ്ണമില്ലായിരുന്നു’; അതായത്, അത് എണ്ണിത്തീർക്കാനാവാത്തത്രയായിരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: സംഭരിച്ചുവച്ചു
  rationale: צבר എന്ന ക്രിയയ്ക്ക് കൂമ്പാരമാക്കുക, ശേഖരിച്ചുവയ്ക്കുക എന്ന അർഥമുണ്ട്. സമൃദ്ധിവർഷങ്ങളിലെ ഭരണപരമായ ധാന്യശേഖരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘സംഭരിച്ചുവച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: בָּר
  choice: ധാന്യം
  rationale: ഇവിടെ ഒരു പ്രത്യേക ധാന്യവർഗമല്ല, പൊതുവായ ധാന്യവിളവാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: כְּחוֹל הַיָּם
  choice: കടൽപ്പുറംപോലെ
  rationale: അളവറ്റ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഉപമ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הַרְבֵּה מְאֹד
  choice: വളരെ അധികം
  rationale: ഉറവിടത്തിലെ ഇരട്ട ശക്തീകരണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַד כִּי
  choice: ഒടുവിൽ
  rationale: ശേഖരണം എണ്ണൽ നിർത്തേണ്ട പരിധിവരെ എത്തിയെന്ന ഫലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חָדַל לִסְפֹּר
  choice: അവൻ അതു എണ്ണുന്നത് നിർത്തി
  rationale: ഏകവചന ക്രിയയുടെ കർത്താവായി യോസേഫിനെ സ്വാഭാവികമായി ഗ്രഹിക്കുകയും ധാന്യത്തെ സൂചിപ്പിക്കാൻ ‘അതു’ ചേർത്ത് മലയാളത്തിൽ വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
- source_word: כִּי אֵין מִסְפָּר
  choice: കാരണം അതിന് കണക്കില്ലായിരുന്നു
  rationale: ‘എണ്ണമില്ല’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തിക്കൊണ്ട് അളവ് എണ്ണിത്തീർക്കാനാവാത്തതായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
