  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: ml
  text: ഈ വരാനിരിക്കുന്ന നല്ല വർഷങ്ങളിലെ എല്ലാ ഭക്ഷ്യസാധനങ്ങളും അവർ ശേഖരിക്കട്ടെ; ഫറവോന്റെ അധികാരത്തിൻകീഴിൽ[a] ധാന്യം പട്ടണങ്ങളിൽ ഭക്ഷണമായി സംഭരിക്കട്ടെ; അതു കാത്തുസൂക്ഷിക്കട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഫറവോന്റെ കൈക്കീഴിൽ’; അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതു കാക്കട്ടെ’ അല്ലെങ്കിൽ ‘സംരക്ഷിക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: അവർ ശേഖരിക്കട്ടെ
  rationale: യോസേഫിന്റെ നിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ അപൂർണക്രിയയ്ക്ക് നിർദേശാത്മക ഭാവമുണ്ട്; മലയാളത്തിലെ ‘-ട്ടെ’ രൂപം അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל אֹכֶל
  choice: ഭക്ഷ്യവിളയെല്ലാം
  rationale: אֹכֶל എന്നത് പൊതുവേ ഭക്ഷണം/ഭക്ഷ്യവസ്തു എന്നാണ്; സമൃദ്ധിവർഷങ്ങളിലെ വിളവ് ശേഖരിക്കുന്ന സന്ദർഭത്തിൽ ‘ഭക്ഷ്യവിള’ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: വരാനിരിക്കുന്ന ഈ നല്ല വർഷങ്ങളിലെ
  rationale: വിശേഷണം, വർത്തമാനകൃതന്തം, സൂചകസർവനാമം എന്നിവയുടെ ബലം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְיִצְבְּרוּ
  choice: സൂക്ഷിച്ചുവെക്കട്ടെ
  rationale: വലിയ അളവിൽ കൂട്ടിവെക്കുക/സംഭരിക്കുക എന്ന അർഥം ഭരണപരമായ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בָר
  choice: ധാന്യം
  rationale: בָר ഇവിടെ മെതിച്ച ധാന്യത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക ധാന്യവർഗമായി ചുരുക്കുന്നില്ല.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: ഫറവോന്റെ അധികാരത്തിൻകീഴിൽ
  rationale: ‘ഫറവോന്റെ കൈക്കീഴിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിയന്ത്രണം/അധികാരം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֹכֶל בֶּעָרִים
  choice: പട്ടണങ്ങളിൽ ഭക്ഷ്യശേഖരമായി
  rationale: ധാന്യം പട്ടണങ്ങളിൽ ഭാവിയിലെ ഭക്ഷണത്തിനുള്ള ശേഖരമായി വയ്ക്കണമെന്ന അനുബന്ധ/പ്രയോജനാർഥ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁמָרוּ
  choice: അവർ അതു കാത്തുസൂക്ഷിക്കട്ടെ
  rationale: שׁמר എന്ന ക്രിയയിലെ കാക്കുക, സുരക്ഷിതമായി നിലനിർത്തുക എന്നീ അർഥങ്ങൾ സംഭരിച്ച ധാന്യത്തിന്റെ സന്ദർഭത്തിൽ സംയോജിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നിർദേശാത്മക ക്രിയകൾക്ക് ‘-ട്ടെ’ രൂപം ഉപയോഗിച്ചു. ‘ഭക്ഷ്യവിള’യും ‘ഭക്ഷ്യശേഖരം’യും സന്ദർഭം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ അധികാരപ്രയോഗവും שׁמר എന്ന ക്രിയയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
