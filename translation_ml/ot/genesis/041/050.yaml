  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ml
  text: ക്ഷാമവർഷം വരുന്നതിനുമുമ്പ്[a], യോസേഫിന് രണ്ടു പുത്രന്മാർ ജനിച്ചു. ഓനിലെ പുരോഹിതനായ പോത്തീഫേരായുടെ മകൾ ആസ്നത്ത് അവരെ അവനു പ്രസവിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്ഷാമത്തിന്റെ വർഷം വരുന്നതിനുമുമ്പ്.’ ഇവിടെ എബ്രായപാഠത്തിൽ ‘വർഷം’ ഏകവചനത്തിലാണ്; ക്ഷാമകാലത്തിന്റെ ആരംഭത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഓൻ ഒരു ഈജിപ്ത്യൻ നഗരമായിരുന്നു; പിന്നീട് ഗ്രീക്കിൽ അത് ഹേലിയോപൊലിസ് എന്നറിയപ്പെട്ടു.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד
  choice: ജനിച്ചു
  rationale: രണ്ടു പുത്രന്മാർ എന്ന ബഹുവചന കർത്താവിനോടൊപ്പം നിഷ്ക്രിയ ജനനപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּ/לְ/יוֹסֵף
  choice: യോസേഫിന്
  rationale: ജനനസന്ദർഭത്തിലെ לְ ബന്ധം മലയാളത്തിൽ ദാതൃവിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּ/טֶרֶם
  choice: വരുന്നതിനുമുമ്പ്
  rationale: തുടർന്നുള്ള സംഭവത്തിനു മുൻപുള്ള സമയബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: ക്ഷാമവർഷം വരുക
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘വർഷം’ എന്നും ‘വരുക’ എന്ന ക്രിയാചിത്രവും നിലനിർത്തുന്നു.
- source_word: שְׁנֵי בָנִים
  choice: രണ്ടു പുത്രന്മാർ
  rationale: വംശാവലി-കുടുംബസന്ദർഭത്തിനു യോജിച്ച, മാന്യവും കൃത്യവുമായ പദപ്രയോഗം.
- source_word: יָלְדָה לּוֹ
  choice: അവരെ അവനു പ്രസവിച്ചു
  rationale: ബന്ധവാക്യത്തിലെ രണ്ടു പുത്രന്മാരെയാണ് ‘അവരെ’ സൂചിപ്പിക്കുന്നത്; לּוֹ എന്ന ഘടകവും ‘അവനു’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: אָסְנַת
  choice: ആസ്നത്ത്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: പോത്തിഫേരയുടെ മകൾ
  rationale: എബ്രായ സംയുക്തബന്ധം സ്വാഭാവിക മലയാള ഷഷ്ഠീവിഭക്തിയിൽ നൽകുന്നു.
- source_word: כֹּהֵן אֽוֹן
  choice: ഓനിലെ പുരോഹിതൻ
  rationale: כֹּהֵן എന്നത് ‘പുരോഹിതൻ’ എന്നും സ്ഥലബന്ധം ‘ഓനിലെ’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
