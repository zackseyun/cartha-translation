source:
  edition: WLC
  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: ml
  text: അപ്പോൾ അതാ, കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞുപോയ[a] മെലിഞ്ഞ ഏഴു ധാന്യക്കതിരുകൾ അവയ്ക്കു പിന്നാലെ മുളച്ചുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിഴക്കൻ കാറ്റേറ്റ് വാടിപ്പോയ.’
    reason: שְׁדוּפֹת എന്ന പദം കാറ്റേറ്റ് കരിഞ്ഞതോ വാടിപ്പോയതോ എന്ന നാശാവസ്ഥയെ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ അതാ
  rationale: പുതിയ സ്വപ്നദൃശ്യം പെട്ടെന്ന് മുന്നിലെത്തിക്കുന്ന സജീവമായ ആഖ്യാനസൂചകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֶׁבַע
  choice: ഏഴു
  rationale: മൂലപാഠത്തിലെ സംഖ്യ നേരിട്ട് നൽകുന്നു.
- source_word: שִׁבֳּלִים
  choice: ധാന്യക്കതിരുകൾ
  rationale: മുഴുവൻ തണ്ടിനെയല്ല, ധാന്യമണികൾ നിറയുന്ന കതിരിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: דַּקּוֹת
  choice: മെലിഞ്ഞ
  rationale: കതിരുകളുടെ കനംകുറഞ്ഞ, ശുഷ്കമായ രൂപം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞുപോയ
  rationale: ചൂടും നാശകരവുമായ കിഴക്കൻ കാറ്റിന്റെ ആഘാതത്തിൽ കതിരുകൾ ഉണങ്ങി നശിച്ചതെന്ന ആശയം വ്യക്തമാക്കുന്നു; ‘വാടിപ്പോയ’ എന്ന സാദ്ധ്യമായ ഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: צֹמְחוֹת
  choice: മുളച്ചുവന്നു
  rationale: സ്വപ്നദൃശ്യത്തിൽ കതിരുകൾ ഉയർന്നുവരുന്ന സജീവപ്രവർത്തനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַחֲרֵיהֶן
  choice: അവയ്ക്കു പിന്നാലെ
  rationale: മുൻവാക്യത്തിലെ ഏഴു കതിരുകളെ സൂചിപ്പിക്കുകയും കാലക്രമത്തിന്റെയും ദൃശ്യത്തിലെ സ്ഥാനക്രമത്തിന്റെയും സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
