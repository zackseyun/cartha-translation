  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ ദൃശ്യത്തിന്റെ പെട്ടെന്നുള്ള അവതരണം നിലനിർത്തുന്നു; കാർഷികചിത്രത്തിന് കൃത്യമായി ‘ധാന്യക്കതിരുകൾ’ ഉപയോഗിച്ചു.
