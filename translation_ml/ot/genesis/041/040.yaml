source:
  edition: WLC
  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: ml
  text: “നീ എന്റെ ഭവനത്തിന് അധികാരിയായിരിക്കും; നിന്റെ കൽപ്പനപ്രകാരം എന്റെ ജനമെല്ലാം അനുസരിക്കും.[a] സിംഹാസനത്തിന്റെ കാര്യത്തിൽ മാത്രമേ ഞാൻ നിന്നെക്കാൾ വലിയവനായിരിക്കൂ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “നിന്റെ വായനുസരിച്ച് എന്റെ ജനമെല്ലാം ചുംബിക്കും.” ഇവിടെ ഈ പ്രയോഗം സാധാരണയായി യോസേഫിന്റെ കൽപ്പന അനുസരിക്കുകയോ അവന് ആദരം അർപ്പിക്കുകയോ ചെയ്യുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: എന്റെ ഭവനത്തിന്മേൽ അധികാരിയായിരിക്കും
  rationale: עַל ഇവിടെ മേൽനോട്ടവും അധികാരവും സൂചിപ്പിക്കുന്നു. ‘ഭവനം’ എന്നത് ഫറവോന്റെ ഗൃഹത്തെയും രാജധാനി ഭരണസംവിധാനത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന, മൂലത്തോടടുത്ത പദമാണ്; ‘അധികാരിയായിരിക്കും’ അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל־פִּיךָ
  choice: നിന്റെ കൽപ്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ വായനുസരിച്ച്’ എന്നാണെങ്കിലും, ഇവിടെ യോസേഫിന്റെ വാക്കാലുള്ള ഭരണനിർദേശം ഉദ്ദേശിക്കുന്നു. ‘കൽപ്പനപ്രകാരം’ ആ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർത്ഥം നൽകുന്നു.
- source_word: יִשַּׁק
  choice: അനുസരിക്കും
  rationale: נשׁק എന്ന ക്രിയയുടെ സാധാരണ അർത്ഥം ‘ചുംബിക്കുക’ എന്നാണ്. എന്നാൽ ഈ സന്ദർഭത്തിൽ യോസേഫിന്റെ അധികാരത്തിന് വിധേയരായി അവന്റെ കൽപ്പന അനുസരിക്കുക എന്ന ആശയമാണ് സാധാരണയായി മനസ്സിലാക്കപ്പെടുന്നത്. അക്ഷരാർഥവും അതിലുള്ള ആദരസൂചനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל עַמִּי
  choice: എന്റെ ജനമെല്ലാം
  rationale: עַם ഒരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘എന്റെ ജനമെല്ലാം’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: רַק
  choice: മാത്രമേ
  rationale: רַק ഒരു പരിമിതിയോ ഏക അപവാദമോ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘മാത്രമേ’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכִּסֵּא
  choice: സിംഹാസനം
  rationale: כִּסֵּא എന്നത് അക്ഷരാർഥത്തിൽ ‘സിംഹാസനം’ ആണ്; ഇവിടെ അത് ഫറവോന്റെ രാജപദവിയെയും പരമാധികാരത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: ഞാൻ നിന്നെക്കാൾ വലിയവനായിരിക്കൂ
  rationale: גדל എന്ന ക്രിയ מן എന്ന ഉപസർഗത്തോടുകൂടെ മേന്മയെയോ ഉയർന്ന സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. സിംഹാസനത്തെ സംബന്ധിച്ചുള്ള സ്ഥാനപരമായ മേന്മയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; പരിഭാഷ മൂലവാക്യത്തിന്റെ രൂപവും അർത്ഥവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം’, ‘സിംഹാസനം’ എന്നീ പദങ്ങൾ രാജകീയ സന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. അപൂർവമായ എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം പ്രധാനവാചകത്തെ അസ്വാഭാവികമാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
