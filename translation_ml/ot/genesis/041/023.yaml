id: GEN.41.23
reference: Genesis 41:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: ml
  text: അതാ, മെലിഞ്ഞതും കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞതുമായ ഏഴ് ധാന്യക്കതിരുകൾ അവയ്ക്കു പിന്നാലെ വളർന്നുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നവിവരണത്തിൽ പുതിയൊരു ദൃശ്യം സജീവമായി ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ഏഴ് ധാന്യക്കതിരുകൾ
  rationale: שִׁבֳּלִים എന്നത് ധാന്യച്ചെടിയുടെ കതിരുകളെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘തണ്ടുകൾ’ എന്നതിനെക്കാൾ കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: צְנֻמוֹת
  choice: ഉണങ്ങിച്ചുരുങ്ങിയതും
  rationale: അപൂർവമായ ഈ പദം ക്ഷയിച്ച് ചുരുങ്ങിയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള דַּקּוֹת എന്ന വിശേഷണത്തിൽനിന്ന് ഇതിനെ വേർതിരിച്ച്, മൂലത്തിലെ അടുക്കിയ വിവരണങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: דַּקּוֹת
  choice: മെലിഞ്ഞതും
  rationale: ‘നേർത്ത/മെലിഞ്ഞ’ എന്ന ഭൗതികഗുണം നേരിട്ട് നൽകുകയും മുൻ വിശേഷണത്തിന്റെ അർഥം ആവർത്തിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁדֻפוֹת קָדִים
  choice: കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞതുമായ
  rationale: ചൂടും വരൾച്ചയും നിറഞ്ഞ കിഴക്കൻ കാറ്റ് ധാന്യക്കതിരുകൾക്ക് വരുത്തിയ നാശം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: צֹמְחוֹת
  choice: വളർന്നുവന്നു
  rationale: സ്വപ്നദൃശ്യത്തിൽ കതിരുകൾ ഉയർന്നുവരുന്ന പുരോഗമനപ്രവർത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കതിരുകൾ തന്നെ ‘മുളച്ചു’ എന്നു പറയുന്നതിലുള്ള അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: אַחֲרֵיהֶם
  choice: അവയ്ക്കു പിന്നാലെ
  rationale: മുമ്പ് പറഞ്ഞ നല്ല കതിരുകൾക്കു ശേഷം ഇവ പ്രത്യക്ഷപ്പെട്ട ക്രമവും ദൃശ്യബന്ധവും സംരക്ഷിക്കുന്നു.
