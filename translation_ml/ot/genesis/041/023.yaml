translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ മൂന്ന് പ്രതികൂല വിവരണഘടകങ്ങളും ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
