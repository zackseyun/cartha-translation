source:
  edition: WLC
  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: ml
  text: 'ഞാൻ ഫറവോനോടു പറഞ്ഞ കാര്യം ഇതുതന്നെയാണ്: ദൈവം ചെയ്യാനിരിക്കുന്നതു ഫറവോന് കാണിച്ചിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം ചെയ്യുന്നതു.” ഹീബ്രു കൃദന്തം ഇപ്പോൾ നടക്കുന്നതോ ഉടൻ നടക്കാനിരിക്കുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; സ്വപ്നവ്യാഖ്യാനത്തിന്റെ ഈ സന്ദർഭത്തിൽ “ചെയ്യാനിരിക്കുന്നതു” വരാനിരിക്കുന്ന സംഭവങ്ങളെ കൂടുതൽ വ്യക്തമായി അറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: കാര്യം ഇതുതന്നെയാണ്
  rationale: തിരിച്ചറിയൽ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; הַדָּבָר ഇവിടെ സ്വപ്നത്തിന്റെ അർഥവുമായി ബന്ധപ്പെട്ട ‘കാര്യം’ ആണ്.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: ഞാൻ ഫറവോനോടു പറഞ്ഞ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യമായി പരിഭാഷപ്പെടുത്തി; דבר എന്ന ക്രിയയുടെ സംസാരിക്കൽ/പറയൽ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: നിർദ്ദിഷ്ട ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പ്രയോഗം; ഹീബ്രുവിലെ നിർദേശക ഉപപദം വേറിട്ട് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: עֹשֶׂה
  choice: ചെയ്യാനിരിക്കുന്നതു
  rationale: ഹീബ്രു കൃദന്തത്തിന് വർത്തമാനമോ ആസന്നഭാവിയോ സൂചിപ്പിക്കാം; വരാനിരിക്കുന്ന സംഭവങ്ങളെ വ്യാഖ്യാനിക്കുന്ന ഈ സന്ദർഭത്തിൽ ആസന്നഭാവി പ്രധാന പാഠത്തിൽ സ്വാഭാവികമാണ്, യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: അവിടന്ന് ഫറവോനു കാണിച്ചിരിക്കുന്നു
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കാണിച്ചിരിക്കുന്നു’ എന്ന് നൽകുന്നു; മലയാളത്തിൽ സ്വീകരിക്കുന്നവനെ ‘ഫറവോനു’ എന്ന് വ്യക്തമാക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമം സ്വാഭാവിക മലയാളശൈലി നൽകുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ വാക്കുകളിൽ הָאֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: ആ ദൈവം
  rationale: ഇവിടെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ എന്ന സാധാരണ രൂപം മതിയാകുന്നു; ‘ആ ദൈവം’ അനാവശ്യമായ വേർതിരിവോ ഊന്നലോ സൃഷ്ടിച്ചേക്കാം.
- issue: עֹשֶׂה എന്ന കൃദന്തത്തിന്റെ കാലസൂചന
  choice: ചെയ്യാനിരിക്കുന്നതു
  alternative: ചെയ്യുന്നതു
  rationale: സ്വപ്നം വെളിപ്പെടുത്തുന്ന വരാനിരിക്കുന്ന സംഭവങ്ങളാണ് സന്ദർഭം. എന്നാൽ കൃദന്തത്തിന്റെ വർത്തമാന/ആസന്നഭാവി ദ്വയാർഥം അടിക്കുറിപ്പിലൂടെ പരസ്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രു വാക്യത്തിന്റെ തിരിച്ചറിയൽ ഘടനയും ദൈവിക വെളിപ്പെടുത്തലും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിച്ചു.
