  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פַּרְעֹ֖ה קָצַ֣ף עַל עֲבָדָ֑י/ו וַ/יִּתֵּ֨ן אֹתִ֜/י בְּ/מִשְׁמַ֗ר בֵּ֚ית שַׂ֣ר הַ/טַּבָּחִ֔ים אֹתִ֕/י וְ/אֵ֖ת שַׂ֥ר הָ/אֹפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: ml
  text: ഫറവോൻ തന്റെ ദാസന്മാരോടു കോപിച്ചു; എന്നെയും അപ്പക്കാരുടെ മേധാവിയെയും കാവൽസേനാധിപന്റെ[b] വീട്ടിൽ തടങ്കലിലാക്കി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാവലിൽ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദം കാവലോടുകൂടിയ തടഞ്ഞുവെക്കലിനെ സൂചിപ്പിക്കുന്നു, എന്നാൽ അത് ഔപചാരികമായ ഒരു കാരാഗൃഹകെട്ടിടമായിരുന്നുവെന്ന് നിർബന്ധമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘കാവൽസേനാധിപൻ’ എന്നത് ഒരു രാജസഭാപദവിയാണ്; കൂടുതൽ അക്ഷരാർഥത്തിൽ അത് ‘അറവുകാരുടെ/വധകരുടെ തലവൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: കോപിച്ചു
  rationale: കോപം അഥവാ ക്രോധം സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കാതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അർഥം നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാർ
  rationale: ഇവിടെ പാനപാത്രവാഹകനും അപ്പക്കാരുടെ മേധാവിയും പോലുള്ള രാജസേവകരെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ദാസന്മാർ’ എന്നത് എബ്രായപദത്തിന്റെ ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; ‘അടിമകൾ’ എന്ന് വിവർത്തനം ചെയ്താൽ സന്ദർഭത്തിൽ മുൻനിരയിലില്ലാത്ത ബന്ധിതാവസ്ഥയുടെ ആശയം അമിതമായി വരാം.
- source_word: בְּמִשְׁמַר
  choice: തടങ്കലിൽ
  rationale: കാവലോടുകൂടിയ തടഞ്ഞുവെക്കലാണ് പദം സൂചിപ്പിക്കുന്നത്; ഔപചാരികമായ ഒരു കാരാഗൃഹകെട്ടിടം തന്നെയെന്ന് അനാവശ്യമായി നിർണയിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: കാവൽസേനാധിപന്റെ വീട്ടിൽ
  rationale: യോസേഫ് ആഖ്യാനത്തിലെ ഈ രാജസഭാപദവി ഫറവോന്റെ കാവൽസേനയുടെ തലവനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു. പദത്തിന്റെ അക്ഷരാർഥപരമായ പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: שַׂר הָאֹפִים
  choice: അപ്പക്കാരുടെ മേധാവി
  rationale: അപ്പമുണ്ടാക്കുന്ന രാജസേവകരുടെ തലവൻ എന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: എന്നെയും അപ്പക്കാരുടെ മേധാവിയെയും
  rationale: രണ്ടുപേരെയും തടങ്കലിലാക്കിയെന്ന എബ്രായത്തിലെ സമന്വിത കർമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ രണ്ട് ഘടകങ്ങൾ അർദ്ധവിരാമംകൊണ്ട് ബന്ധിപ്പിക്കുകയും ആവർത്തിച്ച കർമചിഹ്നങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്നെയും … മേധാവിയെയും’ എന്ന ഘടനയാക്കുകയും ചെയ്തു. അടിക്കുറിപ്പുകളുടെ സൂചനകൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗത്തോടു ചേർത്ത് സ്ഥാപിച്ചു.
