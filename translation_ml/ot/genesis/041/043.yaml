- from: അവൻ യോസേഫിനെ തനിക്കുണ്ടായിരുന്ന രണ്ടാം രഥത്തിൽ കയറ്റി. അവന്റെ മുമ്പിൽ ആളുകൾ, “അബ്രേക്ക്!”[a] എന്നു വിളിച്ചുപറഞ്ഞു. ഇങ്ങനെ അവൻ യോസേഫിനെ ഈജിപ്തുദേശം മുഴുവന്റെയും മേൽ അധികാരിയായി നിയമിച്ചു.
  to: അവൻ യോസേഫിനെ തനിക്കുണ്ടായിരുന്ന രണ്ടാമത്തെ രഥത്തിൽ കയറ്റി. യോസേഫിന്റെ മുമ്പിൽ അവർ, “അബ്രേക്ക്!”[a] എന്നു വിളിച്ചുപറഞ്ഞു. അവൻ യോസേഫിനെ ഈജിപ്തുദേശം മുഴുവനും ഭരിക്കാനായി നിയമിച്ചു.
