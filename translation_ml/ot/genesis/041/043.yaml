  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: ml
  text: അവൻ യോസേഫിനെ തനിക്കുണ്ടായിരുന്ന രണ്ടാമത്തെ രഥത്തിൽ കയറ്റി. യോസേഫിന്റെ മുമ്പിൽ അവർ, “അബ്രേക്ക്!”[a] എന്നു വിളിച്ചുപറഞ്ഞു. അവൻ യോസേഫിനെ ഈജിപ്തുദേശം മുഴുവനും ഭരിക്കാനായി നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അബ്രേക്ക്” എന്നത് അർഥം ഉറപ്പില്ലാത്ത ദുഷ്കരമായ ഒരു പദമാണ്. ഇത് ഈജിപ്ഷ്യൻ ഭാഷയിലെയോ എബ്രായ ഭാഷയിലെയോ ഒരു ബഹുമാനഘോഷമായിരിക്കാം. “മുട്ടുകുത്തുക!” എന്നതുപോലുള്ള അർഥമാണ് ഇതിന് എന്നു പലരും കരുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: കയറ്റി
  rationale: רכב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം മറ്റൊരാളെ രഥത്തിൽ കയറ്റിക്കുന്ന കാരകാർഥം നൽകുന്നു; മലയാളത്തിൽ ‘കയറ്റി’ സ്വാഭാവികമായി ആ അർഥം അറിയിക്കുന്നു.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: തനിക്കുണ്ടായിരുന്ന രണ്ടാം രഥത്തിൽ
  rationale: മִשְׁנֶה ഇവിടെ രണ്ടാം സ്ഥാനമോ പദവിയോ സൂചിപ്പിക്കുന്നു; ഫറവോന്റെ സ്വന്തം രഥത്തിനു തൊട്ടടുത്ത സ്ഥാനമുള്ള രഥം എന്ന ആശയം ‘രണ്ടാം രഥം’ നിലനിർത്തുന്നു. אֲשֶׁר־לוֹ എന്ന ബന്ധവാക്യവും വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ ആളുകൾ … എന്നു വിളിച്ചുപറഞ്ഞു
  rationale: קרא ഇവിടെ ഘോഷയാത്രയ്ക്കു മുമ്പിൽ നടത്തുന്ന പരസ്യവിളിയാണ്. ഹീബ്രുവിലെ അനിശ്ചിത ബഹുവചനകർത്താവിനെ സ്വാഭാവിക മലയാളത്തിനായി ‘ആളുകൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: אַבְרֵךְ
  choice: അബ്രേക്ക്
  rationale: ഈ പദത്തിന്റെ അർഥവും ഭാഷാപശ്ചാത്തലവും അനിശ്ചിതമാണ്; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ ലിപ്യന്തരണം നൽകി, സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְנָתוֹן אֹתוֹ
  choice: ഇങ്ങനെ അവൻ യോസേഫിനെ … അധികാരിയായി നിയമിച്ചു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ട് ഇവിടെ പൂർത്തിയായ നിയമനത്തെ ഊന്നുന്നു. അധികാരസ്ഥാനത്താക്കുന്ന സന്ദർഭത്തിൽ ‘അധികാരിയായി നിയമിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവന്റെയും മേൽ
  rationale: עַל അധികാരപരിധിയെയും אֶרֶץ ഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; ഈ രണ്ടു ഘടകങ്ങളും പരിഭാഷയിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. അർഥം അനിശ്ചിതമായ אַבְרֵךְ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ‘അബ്രേക്ക്’ എന്നു ലിപ്യന്തരിച്ചു. വ്യക്തതയ്ക്കായി യോസേഫിന്റെ പേര് ആവർത്തിച്ചു.
