  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: ml
  text: ഭൂമിയിലെല്ലായിടത്തുനിന്നുമുള്ള ആളുകൾ ധാന്യം വാങ്ങാൻ ഈജിപ്തിലേക്കു യോസേഫിന്റെ അടുക്കൽ വന്നു[a]; കാരണം, ഭൂമിയിലെങ്ങും ക്ഷാമം അതികഠിനമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ ദേശവും’ / ‘സർവലോകവും.’ എബ്രായ പദമായ אֶרֶץ എന്നതിന് ‘ഭൂമി,’ ‘ദേശം,’ ‘രാജ്യം’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ക്ഷാമം ബാധിച്ച ദേശങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: ഭൂമിയിലെല്ലായിടത്തുനിന്നും ആളുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘സകല ഭൂമിയും’ എന്നാണെങ്കിലും, വരുന്നത് ദേശങ്ങൾ തന്നെയല്ല അവിടത്തെ ജനങ്ങളാണ്. സ്വാഭാവിക മലയാളത്തിൽ ഈ അന്തർലീന കർത്താവിനെ വ്യക്തമാക്കുമ്പോഴും אֶרֶץ എന്ന പദത്തിന്റെ വിശാലമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בָּאוּ מִצְרַיְמָה
  choice: ഈജിപ്തിൽ ... വന്നു
  rationale: מִצְרַיְמָהയിലെ ദിശാസൂചകപ്രത്യയം ഈജിപ്തിലേക്കുള്ള സഞ്ചാരം സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തെ ആസ്പദമാക്കിയുള്ള ‘വന്നു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לִשְׁבֹּר
  choice: ധാന്യം വാങ്ങാൻ
  rationale: ക്ഷാമത്തിന്റെ പശ്ചാത്തലത്തിൽ שׁבר പൊതുവായ വാങ്ങലല്ല, ധാന്യം വിലയ്ക്കു നേടുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിന്റെ അടുക്കൽ
  rationale: ‘യോസേഫിന്റെ അടുത്തേക്ക്’ എന്ന ദിശാസൂചന സംരക്ഷിക്കുന്നു; ‘യോസേഫിൽനിന്ന്’ എന്നു മാറ്റി ഉറവിടഭാഷയിലെ ബന്ധത്തെ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: כִּי חָזַק הָרָעָב
  choice: കാരണം, ... ക്ഷാമം അതികഠിനമായിരുന്നു
  rationale: כִּיയുടെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു. חָזַק എന്നതിന്റെ അക്ഷരാർഥമായ ‘ശക്തമായിരുന്നു’ എന്നതിനുപകരം ക്ഷാമത്തോടു ചേരുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: בְּכָל הָאָרֶץ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ആവർത്തിക്കുന്ന אֶרֶץ എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി സർവവ്യാപകത പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകല ഭൂമിയും വന്നു’ എന്ന കടുത്ത അക്ഷരാനുവാദം ഒഴിവാക്കി, എബ്രായത്തിലെ വ്യക്തിവൽക്കരിച്ച പ്രയോഗത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കിയിരിക്കുന്നു; അടിക്കുറിപ്പിലൂടെ പദത്തിന്റെ യഥാർഥ വ്യാപ്തിയും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
