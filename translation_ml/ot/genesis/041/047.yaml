  text: וַ/תַּ֣עַשׂ הָ/אָ֔רֶץ בְּ/שֶׁ֖בַע שְׁנֵ֣י הַ/שָּׂבָ֑ע לִ/קְמָצִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: ml
  text: സമൃദ്ധിയുടെ ഏഴു വർഷങ്ങളിൽ ദേശം കൈനിറയെ വിളവു നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കൈപ്പിടികളായി’ അഥവാ ‘മുഷ്ടിനിറയെ.’ എബ്രായപദം ദേശം നൽകിയ വിളവിന്റെ സമൃദ്ധിയെ ഒരു കൈപ്പിടി എന്ന ദൃശ്യബിംബത്തിലൂടെ വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: വിളവു നൽകി
  rationale: עשה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, ദേശം കർത്താവായുള്ള ഈ കാർഷിക സന്ദർഭത്തിൽ ‘വിളവു നൽകുക’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ മുഴുവൻ ഭൂമിയെയല്ല, ഈജിപ്തിലെ കൃഷിഭൂമിയുൾപ്പെടുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദേശം’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: സമൃദ്ധിയുടെ ഏഴു വർഷങ്ങളിൽ
  rationale: שׂבע സൂചിപ്പിക്കുന്ന ധാരാളിത്തവും സമൃദ്ധിയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
- source_word: לִקְמָצִים
  choice: കൈനിറയെ
  rationale: קְמָץ എന്ന നാമം ‘ഒരു കൈപ്പിടി/മുഷ്ടിനിറയെ’ എന്നർഥം നൽകുന്നു. ഇവിടെ വിളവിന്റെ അസാധാരണ സമൃദ്ധി വിവരിക്കുന്ന ക്രിയാവിശേഷണസദൃശ പ്രയോഗമായതിനാൽ ‘കൈനിറയെ’ ദൃശ്യബിംബവും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കൈനിറയെ’ എന്ന സ്വാഭാവിക പ്രയോഗം മൂലഭാഷയിലെ കൈപ്പിടി എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു.
