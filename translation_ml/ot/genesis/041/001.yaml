    issue: The draft renders חֹלֵם as ‘ഒരു സ്വപ്നം കണ്ടു.’
    rationale: The Hebrew participle depicts Pharaoh in the act/state of dreaming. ‘സ്വപ്നം കാണുകയായിരുന്നു’ naturally preserves this ongoing dream-frame and avoids adding an unnecessary indefinite object.
  - severity: low
