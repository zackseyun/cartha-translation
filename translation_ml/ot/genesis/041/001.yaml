source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: ml
  text: രണ്ടു പൂർണ വർഷങ്ങൾ[a] കഴിഞ്ഞപ്പോൾ, ഫറവോൻ സ്വപ്നം കാണുകയായിരുന്നു; അതാ, അവൻ നൈൽനദിയുടെ തീരത്ത് നിൽക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ദിവസങ്ങളായ രണ്ടു വർഷം’; പൂർണമായ രണ്ടു വർഷക്കാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നദി’; ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ ഇത് നൈൽനദിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: പുതിയ ആഖ്യാനസംഭവം അവതരിപ്പിക്കുന്ന וַיְהִיയും ഒരു കാലയളവിന്റെ അന്ത്യബിന്ദു സൂചിപ്പിക്കുന്ന מִקֵּץയും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാള കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנָתַיִם יָמִים
  choice: രണ്ടു പൂർണവർഷം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളായ രണ്ടു വർഷം’ എന്ന എബ്രായ പ്രയോഗം കാലയളവിന്റെ പൂർണത ഊന്നിപ്പറയുന്നു.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജപദവിക്കുള്ള മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: חֹלֵם
  choice: ഒരു സ്വപ്നം കണ്ടു
  rationale: പങ്ക്തിപ്രത്യയരൂപത്തിന് ദൃശ്യത്തിന്റെ പുരോഗമനസ്വഭാവം ഉണ്ടെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി സ്വപ്നസംഭവം അറിയിക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നത്തിൽ പെട്ടെന്നു തെളിയുന്ന ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന അടയാളപ്പെടുത്തിയ ആഖ്യാനപ്രയോഗത്തിന്റെ സാഹിത്യശക്തി നിലനിർത്തുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുന്നു
  rationale: സ്വപ്നത്തിനുള്ളിലെ നടന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യം മലയാളത്തിലെ വർത്തമാനരൂപത്തിൽ സജീവമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל הַיְאֹר
  choice: നൈൽനദിയുടെ തീരത്ത്
  rationale: עַל ഇവിടെ നദിക്കരികിലെ സ്ഥാനം സൂചിപ്പിക്കുന്നു; ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ הַיְאֹר നൈൽനദിയെയാണ് പരാമർശിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്ന പദം הִנֵּהയുടെ ശ്രദ്ധാകർഷകവും ദൃശ്യാത്മകവുമായ ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
