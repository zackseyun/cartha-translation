  source_fidelity: 'വിവർത്തനം എബ്രായ മൂലപാഠത്തിലെ ക്രമവും മുഖ്യപ്രതിച്ഛായയും വിശ്വസ്തമായി പകരുന്നു: മെലിഞ്ഞ കതിരുകൾ ഏഴു പുഷ്ടിയുള്ളതും നിറഞ്ഞതുമായ കതിരുകളെ വിഴുങ്ങുന്നു; ഫറവോൻ ഉണരുന്നു; തുടർന്ന് അതൊരു സ്വപ്നമാണെന്ന പെട്ടെന്നുള്ള തിരിച്ചറിവ് വരുന്നു. ‘വിഴുങ്ങി,’ ‘മെലിഞ്ഞ,’ ‘പുഷ്ടിയുള്ള,’ ‘നിറഞ്ഞ,’ ‘ഉണർന്നു’ എന്നിവ മൂലത്തിലെ അർഥപരിധിക്കുള്ളിലാണ്.'
