reference: Genesis 41:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: ml
  text: മെലിഞ്ഞ കതിരുകൾ പുഷ്ടിയുള്ളതും നിറഞ്ഞതുമായ ഏഴു കതിരുകളെ[a] വിഴുങ്ങി. അപ്പോൾ ഫറവോൻ ഉണർന്നു; അതാ, അതൊരു സ്വപ്നമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കതിരുകൾ’ എന്നത് ധാന്യം വഹിക്കുന്ന കതിരുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മുഴുവൻ തണ്ടുകളെയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: വിഴുങ്ങി
  rationale: בלע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വിഴുങ്ങുക’ നിലനിർത്തുന്നു; സ്വപ്നത്തിലെ അസ്വാഭാവികവും സജീവവുമായ ദൃശ്യം ഇതിലൂടെ വ്യക്തമായി ലഭിക്കുന്നു.
- source_word: הַשִּׁבֳּלִים
  choice: കതിരുകൾ
  rationale: ഇവിടെ שִׁבֹּלֶת എന്നത് മുഴുവൻ തണ്ടിനെയല്ല, ധാന്യം വഹിക്കുന്ന കതിരിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കതിരുകൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַדַּקּוֹת
  choice: മെലിഞ്ഞ
  rationale: ധാന്യക്കതിരുകളുടെ നേർത്തതോ ശുഷ്കമായതോ ആയ അവസ്ഥയെ നേരിട്ട് അറിയിക്കുന്നു; പശുക്കളെ വിവരിക്കുന്ന ഭാഷ അനാവശ്യമായി ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: שֶׁבַע
  choice: ഏഴു
  rationale: മൂലപാഠത്തിലെ സംഖ്യ നേരിട്ട് പകരുന്നു.
- source_word: הַבְּרִיאוֹת
  choice: പുഷ്ടിയുള്ള
  rationale: ഈ വിശേഷണം ആരോഗ്യകരമായ, നന്നായി വളർന്ന, സമൃദ്ധമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ധാന്യക്കതിരുകളെക്കുറിച്ച് ‘പുഷ്ടിയുള്ള’ എന്നത് സ്വാഭാവികമാണ്; ‘തടിച്ച’ എന്നതിനെക്കാൾ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: וְהַמְּלֵאוֹת
  choice: നിറഞ്ഞതുമായ
  rationale: מלא എന്ന മൂലത്തിന്റെ ‘നിറഞ്ഞ’ എന്ന അർഥം നിലനിർത്തി, കതിരുകൾ ധാന്യംകൊണ്ട് നിറഞ്ഞിരുന്നുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּיקַץ
  choice: ഉണർന്നു
  rationale: ഉറക്കത്തിൽനിന്ന് ഉണരുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധാകേന്ദ്രവും തിരിച്ചറിവിന്റെ ഭാവവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: חֲלוֹם
  choice: അതൊരു സ്വപ്നമായിരുന്നു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ‘അതാ—ഒരു സ്വപ്നം’ എന്ന ഘടനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയ ചേർത്തിരിക്കുന്നു; ഫറവോന്റെ തിരിച്ചറിവ് ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. സ്വപ്നത്തിലെ വിചിത്ര ദൃശ്യം മൃദൂകരിക്കാതെ ‘വിഴുങ്ങി’ എന്നും, הִנֵּהയുടെ സാഹിത്യശക്തി നിലനിർത്താൻ ‘അതാ’ എന്നും നൽകിയിരിക്കുന്നു.
