source:
  edition: WLC
  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: ml
  text: 'ഫറവോൻ ഇങ്ങനെ ചെയ്യട്ടെ: ദേശത്തുടനീളം ഉദ്യോഗസ്ഥരെ നിയമിക്കട്ടെ; സമൃദ്ധിയുള്ള ഏഴു വർഷങ്ങളിൽ ഈജിപ്തുദേശത്തിലെ വിളവിന്റെ അഞ്ചിലൊന്ന് ശേഖരിക്കട്ടെ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തുദേശത്തിൽനിന്ന് അഞ്ചിലൊന്ന് ഈടാക്കട്ടെ.” എബ്രായ ക്രിയയെ സമൃദ്ധിയുടെ വർഷങ്ങളിൽ അഞ്ചിലൊന്ന് ഈടാക്കുകയോ ശേഖരിക്കുകയോ ചെയ്യുക എന്ന അർഥത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: ഫറവോൻ ഇങ്ങനെ ചെയ്യട്ടെ
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയ ഇവിടെ യോസേഫിന്റെ ഉപദേശമായി വരുന്നതിനാൽ, സന്ദർഭത്തിൽ സൂചിതമായ കർമം ചേർത്ത് നിർദേശാത്മക ഭാവം സ്വാഭാവികമായി പകർന്നു.
- source_word: וְיַפְקֵד
  choice: നിയമിക്കുകയും ചെയ്യട്ടെ
  rationale: פקד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഉത്തരവാദിത്വമുള്ള സ്ഥാനത്തേക്ക് ആളുകളെ നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: פְּקִדִים
  choice: മേൽവിചാരകന്മാർ
  rationale: നിയോഗിക്കപ്പെട്ട ഭരണനിർവഹണ ഉദ്യോഗസ്ഥരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മേൽനോട്ടാധികാരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന പദമാണിത്.
- source_word: עַל הָאָרֶץ
  choice: ദേശത്തിന്മേൽ
  rationale: ഇവിടെ אָרֶץ ഭൂമി മുഴുവനെയല്ല, ഫറവോന്റെ ഭരണത്തിലുള്ള ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; עַל എന്നതിന്റെ ഭരണപരമായ മേൽനോട്ടഭാവവും നിലനിർത്തുന്നു.
- source_word: וְחִמֵּשׁ
  choice: അഞ്ചിലൊന്ന് ശേഖരിക്കുകയും ചെയ്യട്ടെ
  rationale: חמשׁ എന്ന പീയേൽ ക്രിയയെ ഈ സന്ദർഭത്തിൽ വിളവിന്റെ അഞ്ചിലൊന്ന് ഈടാക്കുക അഥവാ ശേഖരിക്കുക എന്നായി മനസ്സിലാക്കുന്നതാണ് ഏറ്റവും യോജ്യം; ക്രിയയിലെ അപൂർവത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ വിളവിന്റെ
  rationale: അഞ്ചിലൊന്ന് ദേശഭൂമിയിൽ നിന്നല്ല, അതിന്റെ ഉൽപ്പാദനത്തിൽ നിന്നാണ് എടുക്കുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘വിളവ്’ ചേർത്തു.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: സമൃദ്ധിയുടെ ഏഴു വർഷങ്ങളിൽ
  rationale: שָׂבָע നിറവ് അഥവാ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്നു; ഈ വിവരണത്തിൽ സമൃദ്ധമായ വിളവുള്ള കാലഘട്ടമാണ് ഉദ്ദേശ്യം.
