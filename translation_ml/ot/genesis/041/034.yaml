translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിർദേശഭാവം ഉപയോഗിച്ചു. ഭരണപരമായ സന്ദർഭം വ്യക്തമാക്കാൻ ‘മേൽവിചാരകന്മാർ’ എന്നും, ഭൂമിയുടെ വിഹിതമല്ല വിളവിന്റെ വിഹിതമാണെന്ന് വ്യക്തമാക്കാൻ ‘വിളവിന്റെ അഞ്ചിലൊന്ന്’ എന്നും നൽകി. മൂലത്തിലെ അപൂർവമായ חמשׁ എന്ന ക്രിയയുടെ അർഥവൈകല്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
