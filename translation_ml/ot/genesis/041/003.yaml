id: GEN.41.3
reference: Genesis 41:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: ml
  text: അതാ, അവയ്ക്കു പിന്നാലെ കാഴ്ചയ്ക്കു വിരൂപവും ശരീരം മെലിഞ്ഞവയുമായ[b] വേറെ ഏഴു പശുക്കൾ നൈൽ നദിയിൽനിന്ന്[a] കയറിവന്നു; അവ നൈൽ നദിയുടെ കരയിൽ ആ പശുക്കളുടെ അരികിൽ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നദി’ (יְאֹר); ഈജിപ്തിലെ ഈ സന്ദർഭത്തിൽ നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘കാഴ്ചയ്ക്കു മോശവും മാംസത്തിൽ മെലിഞ്ഞവയുമായ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നരംഗത്തിലെ പെട്ടെന്നുള്ള ദൃശ്യാവിഷ്കാരവും ആഖ്യാനത്തിലെ ശ്രദ്ധാകർഷകശക്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פָּרוֹת
  choice: പശുക്കൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനം പെൺകന്നുകാലികളെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രായം വ്യക്തമല്ലാത്തതിനാൽ കൂടുതൽ പ്രത്യേകമായ പദം ഒഴിവാക്കി.
- source_word: אֲחֵרוֹת
  choice: വേറെ
  rationale: ആദ്യത്തെ ഏഴിൽനിന്നു വ്യത്യസ്തമായ രണ്ടാമത്തെ കൂട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עֹלוֹת
  choice: കയറിവന്നു
  rationale: നദിയിൽനിന്ന് കരയിലേക്കു മുകളിലേക്കു വരുന്നതെന്ന സന്ദർഭോചിതമായ ചലനം വ്യക്തമാക്കുന്നു.
- source_word: אַחֲרֵיהֶן
  choice: അവയ്ക്കു പിന്നാലെ
  rationale: രണ്ടാമത്തെ കൂട്ടം ആദ്യത്തെ കൂട്ടത്തിനു ശേഷം പ്രത്യക്ഷപ്പെടുന്ന ക്രമം നിലനിർത്തുന്നു; ‘പിന്നിൽ’ എന്ന സ്ഥലപരമായ അർഥവും നിർബന്ധമായി തള്ളിക്കളയുന്നില്ല.
- source_word: הַיְאֹר
  choice: നൈൽ നദി
  rationale: ഈജിപ്തിലെ പശ്ചാത്തലത്തിൽ יְאֹר നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്; വായനക്കാരന് ഉദ്ദേശ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: רָעוֹת מַרְאֶה
  choice: കാഴ്ചയ്ക്കു വിരൂപം
  rationale: רָעוֹת എന്നത് ഇവിടെ ധാർമികമായ തിന്മയല്ല, മോശമായ/അരോചകമായ രൂപമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: דַקּוֹת בָּשָׂר
  choice: ശരീരം മെലിഞ്ഞവ
  rationale: ‘മാംസത്തിൽ മെലിഞ്ഞ’ എന്ന എബ്രായ ദേഹചിത്രം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: וַתַּעֲמֹדְנָה
  choice: നിന്നു
  rationale: ലളിതമായ ആഖ്യാനക്രിയയെ അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֵצֶל
  choice: അരികിൽ
  rationale: അടുത്തുള്ള സ്ഥാനം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: שְׂפַת הַיְאֹר
  choice: നൈൽ നദിയുടെ കരയിൽ
  rationale: അക്ഷരാർഥമായ ‘നദിയുടെ ചുണ്ട്/അറ്റം’ എന്ന പ്രയോഗത്തിന് മലയാളത്തിലെ സന്ദർഭോചിതമായ തുല്യരൂപമാണ് ‘കര’.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് മൂലത്തിലെ ദൃശ്യതീവ്രത നിലനിർത്തുന്നു. എബ്രായ പദക്രമം യാന്ത്രികമായി പകർത്താതെ വിശേഷണങ്ങളെ മലയാളത്തിൽ സുഗമമായി കൂട്ടിച്ചേർത്തിരിക്കുന്നു.
