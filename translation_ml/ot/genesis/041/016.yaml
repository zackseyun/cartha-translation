  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: ml
  text: 'യോസേഫ് ഫറവോനോടു മറുപടി പറഞ്ഞു: “അത് എന്നിൽനിന്നല്ല; ഫറവോന്റെ ക്ഷേമത്തിനായുള്ള മറുപടി ദൈവം നൽകും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാനല്ല; ഫറവോന് ശുഭകരമായ മറുപടി ദൈവം നൽകും.” ഇവിടെ “ക്ഷേമം” എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിന് സമാധാനം, നന്മ, അനുകൂലഫലം എന്നീ അർഥങ്ങളും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹסֵף אֶת־פַּרְעֹה לֵאמֹר
  choice: യോസേഫ് ഫറവോനോടു മറുപടി പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ മറുപടി-പ്രസംഗ സൂത്രവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; לֵאמֹר എന്നതിനെ വേറിട്ട് ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്ത് വാക്യം ഭാരപ്പെടുത്തുന്നില്ല.
- source_word: בִּלְעָדָי
  choice: അത് എന്നിൽനിന്നല്ല
  rationale: വ്യാഖ്യാനം നൽകാനുള്ള കഴിവിന്റെയോ ഉത്തരത്തിന്റെയോ ഉറവിടം യോസേഫ് അല്ലെന്ന നിഷേധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ‘ഞാനല്ല’ എന്നതിനെക്കാൾ ഉറവിടത്തെക്കുറിച്ചുള്ള സൂചന ഇതിൽ വ്യക്തമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇവിടെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനമായ ‘ദൈവം’ ഉപയോഗിക്കുന്നു.
- source_word: יַעֲנֶה
  choice: മറുപടി നൽകും
  rationale: സ്വപ്നത്തിന്റെ അർഥത്തെക്കുറിച്ചുള്ള നിർണായക ഉത്തരം ദൈവം നൽകുമെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; וַיַּעַן എന്ന ആദ്യക്രിയയുമായുള്ള മറുപടി എന്ന ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: אֶת־שְׁלוֹם פַּרְעֹה
  choice: ഫറവോന്റെ ക്ഷേമത്തിനായുള്ള
  rationale: שָׁלוֹם എന്നതിന്റെ സമാധാനം, ക്ഷേമം, അനുകൂലഫലം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാല അർഥപരിധിയിൽ ഇവിടെ പ്രസക്തമായ ‘ക്ഷേമം’ സ്വീകരിക്കുന്നു. ദൈവത്തിന്റെ മറുപടി ഫറവോന്റെ ക്ഷേമവുമായി ബന്ധപ്പെട്ടതാണെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം അനാവശ്യമായി നിർണയിക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: വ്യാഖ്യാനത്തിന്റെയും ഉത്തരത്തിന്റെയും ഉറവിടം
  choice: യോസേഫ് ഉത്തരം തന്നിൽനിന്നല്ലെന്നു നിഷേധിക്കുകയും അത് ദൈവത്തിൽനിന്നാണെന്നു പറയുകയും ചെയ്യുന്നു.
  alternative: ‘ഞാനല്ല; ദൈവംതന്നെ ഉത്തരം നൽകും’ എന്ന കൂടുതൽ സംക്ഷിപ്ത രൂപം.
  rationale: בִּלְעָדָי എന്ന നിഷേധത്തിനും אֱלֹהִים יַעֲנֶה എന്ന ഉറപ്പിനുമിടയിലെ ദൈവശാസ്ത്രപരമായ വൈരുധ്യം നിലനിർത്തുന്നു; യോസേഫിന്റെ വിനയത്തെക്കുറിച്ചോ വെളിപ്പാടിന്റെ രീതിയെക്കുറിച്ചോ പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ മറുപടി അനുകൂലമായിരിക്കുമോ എന്നത്
  choice: ‘ഫറവോന്റെ ക്ഷേമത്തിനായുള്ള മറുപടി’ എന്നു നൽകി ക്ഷേമസൂചന നിലനിർത്തുന്നു, എന്നാൽ ഫലം നിർബന്ധമായും അനുകൂലമാണെന്നു തീർപ്പാക്കുന്നില്ല.
  alternative: ‘ഫറവോന് ശുഭകരമായ മറുപടി’ അഥവാ ‘സമാധാനത്തിന്റെ മറുപടി’.
  rationale: שְׁלוֹם അനുകൂലഫലത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ അസാധാരണ ക്രിയ-കർമ പ്രയോഗം ഫറവോന്റെ ക്ഷേമത്തെ സംബന്ധിക്കുന്ന ഉത്തരം എന്ന നിലയിലും ഗ്രഹിക്കാം. മൂലപാഠത്തിലെ ഈ സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഫറവോൻ’, ‘യോസേഫ്’ എന്നീ സുപരിചിത ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. മുഖ്യവാക്യം സുതാര്യമായി വായിക്കാവുന്നതാക്കി, שְׁלוֹם എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
