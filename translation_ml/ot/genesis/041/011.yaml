  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: ml
  text: ഒരു രാത്രിയിൽ ഞാനും അവനും സ്വപ്നം കണ്ടു; ഓരോരുത്തനും തന്റെ സ്വപ്നത്തിന്റെ വ്യാഖ്യാനത്തിന് ഒത്തവിധം സ്വപ്നം കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഒരു രാത്രിയിൽ ഞാനും അവനും ഒരു സ്വപ്നം കണ്ടു; ഓരോരുത്തനും തന്റെ സ്വപ്നത്തിന്റെ വ്യാഖ്യാനത്തിന് ഒത്തവിധം ഞങ്ങൾ സ്വപ്നം കണ്ടു.”'
    reason: ഹീബ്രുവിലെ ‘സ്വപ്നം കണ്ടു’ എന്ന ആവർത്തനവും അവസാനത്തെ ബഹുവചന ക്രിയയും മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളമാക്കുമ്പോൾ വിതരണാർഥമായി നൽകിയിരിക്കുന്നു.
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: ഞങ്ങൾ രണ്ടുപേരും ഓരോ സ്വപ്നം കണ്ടു
  rationale: חָלַם എന്ന ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള കർമപദവും ചേർന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ്വപ്നം കണ്ടു’ എന്നു നൽകി; ദ്വിവചനസന്ദർഭവും വിതരണാർഥവും വ്യക്തമാക്കാൻ ‘രണ്ടുപേരും ഓരോ’ ചേർത്തു.
- source_word: בְּלַיְלָה אֶחָד
  choice: അന്നു രാത്രി
  rationale: അക്ഷരാർഥം ‘ഒരു രാത്രിയിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ ഇരുവരും ഒരേ രാത്രിയിൽ സ്വപ്നം കണ്ടുവെന്ന കാലസമാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘അന്നു രാത്രി’ വ്യക്തമാക്കുന്നു.
- source_word: אֲנִי וָהוּא
  choice: ഞങ്ങൾ രണ്ടുപേരും
  rationale: ‘ഞാനും അവനും’ എന്ന വ്യക്തമായ ഇരുപങ്കാളിത്തത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഓരോരുത്തന്റെയും
  rationale: ഇവിടെ אִישׁ വിതരണാർഥത്തിലാണ്; ഓരോ വ്യക്തിയുടെയും സ്വന്തം സ്വപ്നത്തെയും അതിന്റെ വ്യാഖ്യാനത്തെയും വേർതിരിച്ചു സൂചിപ്പിക്കുന്നു.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: ഓരോരുത്തന്റെയും സ്വപ്നം അതതിന്റെ വ്യാഖ്യാനത്തിന് ഒത്തതായിരുന്നു
  rationale: כְּ സൂചിപ്പിക്കുന്ന പൊരുത്തബന്ധം ‘ഒത്തതായിരുന്നു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; സ്വപ്നവും പിന്നീട് ലഭിച്ച വ്യാഖ്യാനവും തമ്മിലുള്ള correspondence നിലനിർത്തുന്നു.
