id: GEN.41.45
reference: Genesis 41:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: ml
  text: ഫറവോൻ യോസേഫിന് സാഫ്നത്ത്-പനേയഹ്[a] എന്നു പേരിട്ടു. ഓനിലെ[b] പുരോഹിതനായ പോത്തിഫെരയുടെ മകൾ ആസ്നത്തിനെ അവനു ഭാര്യയായി കൊടുത്തു. പിന്നെ യോസേഫ് ഈജിപ്തുദേശത്തിലൂടെ യാത്ര പുറപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാഫ്നത്ത്-പാനേയഹ്’ എന്നും ലിപ്യന്തരം ചെയ്യാം. ഈ ഈജിപ്ഷ്യൻ പേരിന്റെ അർഥം അനിശ്ചിതമാണ്; നിർദേശിക്കപ്പെട്ട അർഥങ്ങൾ വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: പിന്നീട് ഗ്രീക്കിൽ ഹെലിയോപൊലിസ് എന്നു വിളിക്കപ്പെട്ട ഈജിപ്ഷ്യൻ നഗരമാണ് ഓൻ.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘ഈജിപ്തുദേശത്താകെ സഞ്ചരിച്ചു.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: യോസേഫിന് ... എന്നു പേരിട്ടു
  rationale: קרא + שׁם എന്ന പേരിടൽ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘യോസേഫിന്റെ പേര് ... എന്നു വിളിച്ചു’ എന്ന കൃത്രിമമായ പദാനുപദ ഘടന ഒഴിവാക്കുന്നു.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: സാഫ്നത്ത്-പനേയഹ്
  rationale: അർഥവും ഈജിപ്ഷ്യൻ വ്യുത്പത്തിയും അനിശ്ചിതമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּתֶּן לוֹ
  choice: അവനു ... കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയും പരോക്ഷ കർമസർവനാമവും മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אָסְנַת
  choice: ആസ്നത്ത്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: പോത്തിഫെരയുടെ മകൾ
  rationale: ബന്ധസൂചക ഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; പേരിന്റെ രണ്ട് ഹീബ്രു ഘടകങ്ങൾ മലയാളത്തിൽ ഒറ്റ പേരായി ചേർത്തു.
- source_word: כֹּהֵן אֹן
  choice: ഓനിലെ പുരോഹിതൻ
  rationale: כֹּהֵן എന്നത് സാധാരണ അർഥമായ ‘പുരോഹിതൻ’ എന്നും אֹן എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ‘ഓൻ’ എന്നും നൽകി.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹബന്ധം സ്ഥാപിക്കുന്ന ഹീബ്രു പ്രയോഗത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֵּצֵא ... עַל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തിലൂടെ യാത്ര പുറപ്പെട്ടു
  rationale: יצא എന്ന ‘പുറപ്പെടുക’ എന്ന ആശയവും עַל സൂചിപ്പിക്കുന്ന ദേശവ്യാപക സഞ്ചാരവും നിലനിർത്തുന്നു; ‘ദേശത്താകെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ ഈജിപ്തുദേശത്തിലൂടെയുള്ള പുറപ്പെടലിൽ സഞ്ചാരമോ അധികാരപരമായ മേൽനോട്ടമോ പ്രധാനമാണോ
  choice: ഈജിപ്തുദേശത്തിലൂടെ യാത്ര പുറപ്പെട്ടു
  alternative: ഈജിപ്തുദേശത്താകെ സഞ്ചരിച്ചു
  rationale: עַל എന്ന പൂർവപ്രത്യയത്തിന് ഇവിടെ ദേശത്തിലൂടെയുള്ള സഞ്ചാരവും പുതിയ അധികാരപരിധിയിലൂടെയുള്ള പര്യടനവും സൂചിപ്പിക്കാനാകാം. മുഖ്യപാഠം സഞ്ചാരത്തെ വ്യക്തമാക്കുമ്പോഴും അധികാരപരമായ സൂചനയെ അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല; ദേശവ്യാപകതയുടെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. പേരുകൾ മൂലഹീബ്രു രൂപത്തെ ആശ്രയിച്ച് ലിപ്യന്തരം ചെയ്തു. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ പേരിടൽ, വിവാഹക്രമീകരണം, ദേശസഞ്ചാരം എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളവാക്യങ്ങളാക്കി; അവസാന പ്രയോഗത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
