source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: ml
  text: അതാ, നൈൽ നദിയിൽനിന്ന്[a] ശരീരപുഷ്ടിയുള്ളവയും[b] ആകാരഭംഗിയുള്ളവയുമായ ഏഴു പശുക്കൾ കയറിവന്നു; അവ ചതുപ്പുനിലത്തെ പുല്ലിൽ[c] മേയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നദിയിൽനിന്ന്’; ഈജിപ്‌ത് പശ്ചാത്തലത്തിൽ ഹീബ്രുപദം ഏറ്റവും സ്വാഭാവികമായി നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തടിച്ച ശരീരമുള്ളവ’ അല്ലെങ്കിൽ ‘നന്നായി തീറ്റ ലഭിച്ചവ’; ഹീബ്രു പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ശരീരത്തിന്റെ പുഷ്ടിയെയോ ആരോഗ്യത്തെയോ വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഞാങ്ങണകൾക്കിടയിൽ’ അല്ലെങ്കിൽ ‘ചതുപ്പിലെ പുല്ലിൽ’; ഹീബ്രുപദം നൈൽതീരത്തെ ഈർപ്പനില സസ്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നദൃശ്യം പെട്ടെന്ന് കൺമുന്നിൽ കൊണ്ടുവരുന്ന ഹീബ്രു വ്യവഹാരസൂചകം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: מִן הַיְאֹר
  choice: നൈൽ നദിയിൽനിന്ന്
  rationale: ഈജിപ്‌ത് പശ്ചാത്തലത്തിൽ יְאֹר ഒരു പൊതുനദിയെയല്ല, നൈലിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: עֹלֹת
  choice: കയറിവന്നു
  rationale: നദിയിൽനിന്ന് കരയിലേക്കു കയറിവരുന്ന പശുക്കളുടെ ദൃശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഹീബ്രു കൃദന്തരൂപത്തിലെ ദൃശ്യാത്മകതയും നിലനിർത്തുന്നു.
- source_word: שֶׁבַע פָּרוֹת
  choice: ഏഴു പശുക്കൾ
  rationale: פָּרוֹת പെൺകന്നുകാലികളെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: ശരീരപുഷ്ടിയുള്ളവ
  rationale: ശരീരത്തിന്റെ ആരോഗ്യവും നിറവും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം ‘തടിച്ച’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וִיפֹת תֹּאַר
  choice: ആകാരഭംഗിയുള്ളവ
  rationale: മനോഹരമായ രൂപമോ ആകൃതിയോ എന്ന ഹീബ്രു ആശയം സംക്ഷിപ്തവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וַתִּרְעֶינָה
  choice: മേയാൻ തുടങ്ങി
  rationale: തുടർന്നുണ്ടായ മേയൽപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּאָחוּ
  choice: ചതുപ്പുനിലത്തെ പുല്ലിൽ
  rationale: നൈൽതീരത്തെ ഈർപ്പനില സസ്യപ്രദേശമാണ് പദം സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘പുൽമേട്’ എന്നതിനെക്കാൾ ഈ വിവർത്തനം ആ ഭൂപ്രകൃതി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അതാ’ സ്വപ്നവിവരണത്തിന്റെ ദൃശ്യസജീവത നിലനിർത്തുന്നു; അപരിചിതമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി നൈൽതീര ചതുപ്പുനിലയുടെ അർഥം വ്യക്തമായി നൽകിയിരിക്കുന്നു.
