  text: പിന്നീട് വരുന്ന ആ ക്ഷാമം നിമിത്തം ദേശത്തുണ്ടായിരുന്ന സമൃദ്ധി അറിയപ്പെടുകയില്ല[a]; കാരണം, ആ ക്ഷാമം അതികഠിനമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരിച്ചറിയപ്പെടുകയില്ല’ അല്ലെങ്കിൽ ‘ശ്രദ്ധിക്കപ്പെടുകയില്ല’; ഈ ഹീബ്രു ക്രിയയ്ക്ക് അറിയപ്പെടുക, തിരിച്ചറിയപ്പെടുക, ശ്രദ്ധിക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּדַע
  choice: അറിയപ്പെടുകയില്ല
  rationale: ידע എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന്റെ അടിസ്ഥാനമായ നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ മുൻകാല സമൃദ്ധി തിരിച്ചറിയാനോ ശ്രദ്ധിക്കാനോ കഴിയാത്തവിധം മറഞ്ഞുപോകുന്നതും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: הַשָּׂבָע
  choice: സമൃദ്ധി
  rationale: യോസേഫിന്റെ വിവരണത്തിലെ സമൃദ്ധമായ വിളവും ഭക്ഷ്യലഭ്യതയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ഇവിടെ ആഗോള ഭൂമിയെക്കാൾ ക്ഷാമബാധിതമായ പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: സമൃദ്ധി അറിയപ്പെടാതാകുന്നതിനുള്ള കാരണമായി ക്ഷാമത്തെ അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: പിന്നീട് വരുന്ന ആ ക്ഷാമം
  rationale: കാലക്രമവും ഹീബ്രുവിലെ നിർദ്ദേശകമായ ‘ആ’ എന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: കാരണം, ആ ക്ഷാമം അതികഠിനമായിരിക്കും
  rationale: כבד എന്നതിന്റെ അക്ഷരാർഥം ‘ഭാരമുള്ളത്’ ആണെങ്കിലും ക്ഷാമത്തെക്കുറിച്ച് അത് അതിന്റെ അത്യന്തം കഠിനമായ സ്വഭാവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
