- from: മെലിഞ്ഞ കതിരുകൾ നല്ല ഏഴു കതിരുകളെയും വിഴുങ്ങിക്കളഞ്ഞു.[a] ഞാൻ ഇതു മന്ത്രവാദികളോടു പറഞ്ഞു;[b] എന്നാൽ എനിക്കതു വ്യാഖ്യാനിച്ചുതരാൻ ആരും ഉണ്ടായിരുന്നില്ല.[c]
  to: മെലിഞ്ഞ കതിരുകൾ ഏഴ് നല്ല കതിരുകളെ വിഴുങ്ങിക്കളഞ്ഞു.[a] ഞാൻ അത് മന്ത്രവാദികളോടു പറഞ്ഞു;[b] പക്ഷേ, അതിന്റെ അർഥം എനിക്കു പറഞ്ഞുതരാൻ ആർക്കും കഴിഞ്ഞില്ല.[c]
