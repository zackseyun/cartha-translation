  text: וַ/תִּבְלַ֨עְןָ֙ הָ/שִׁבֳּלִ֣ים הַ/דַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽ/שִׁבֳּלִ֖ים הַ/טֹּב֑וֹת וָֽ/אֹמַר֙ אֶל הַֽ/חַרְטֻמִּ֔ים וְ/אֵ֥ין מַגִּ֖יד לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: ml
  text: മെലിഞ്ഞ കതിരുകൾ ഏഴ് നല്ല കതിരുകളെ വിഴുങ്ങിക്കളഞ്ഞു.[a] ഞാൻ അത് മന്ത്രവാദികളോടു പറഞ്ഞു;[b] പക്ഷേ, അതിന്റെ അർഥം എനിക്കു പറഞ്ഞുതരാൻ ആർക്കും കഴിഞ്ഞില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധാന്യത്തിന്റെ തലകൾ.”
    reason: lexical_alternative
  - marker: b
    text: “മന്ത്രവാദികൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ഈജിപ്ഷ്യൻ ആചാരവിദഗ്ധരെയോ സ്വപ്നവ്യാഖ്യാതാക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “എനിക്ക് അതിന്റെ അർഥം അറിയിച്ചുതരാൻ ആർക്കും കഴിഞ്ഞില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: വിഴുങ്ങിക്കളഞ്ഞു
  rationale: בלע എന്ന ക്രിയയുടെ സജീവമായ സ്വപ്നദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׁבֳּלִים
  choice: കതിരുകൾ
  rationale: ധാന്യത്തിന്റെ കതിരുകളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַדַּקֹּת
  choice: മെലിഞ്ഞ
  rationale: ‘നേർത്ത/മെലിഞ്ഞ’ എന്ന അടിസ്ഥാനാർഥം കതിരുകളുടെ ദയനീയാവസ്ഥയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: הַטֹּבוֹת
  choice: നല്ല
  rationale: טוב എന്ന പദത്തിന്റെ വിശാലമായ ‘നല്ല’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘നിറഞ്ഞ’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וָאֹמַר אֶל
  choice: ഞാൻ ഇതു ... പറഞ്ഞു
  rationale: മുൻപറഞ്ഞ സ്വപ്നവിവരണം അവരോടു പറഞ്ഞുവെന്ന സന്ദർഭസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: הַחַרְטֻמִּים
  choice: മന്ത്രവാദികൾ
  rationale: ഈജിപ്ഷ്യൻ രാജസഭയിലെ ആചാരവിദഗ്ധരെയും സ്വപ്നവ്യാഖ്യാതാക്കളെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ മലയാളപദം; സാംസ്കാരിക വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאֵין מַגִּיד לִי
  choice: എനിക്കതു വ്യാഖ്യാനിച്ചുതരാൻ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: נגד എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ അർഥം സ്വപ്നത്തിന്റെ അർഥം അറിയിക്കുക/വ്യാഖ്യാനിക്കുക എന്നതാണ്; ശേഷിയെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
