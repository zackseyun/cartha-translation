translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. സ്വപ്നദൃശ്യത്തിന്റെ സജീവതയ്ക്കായി ‘വിഴുങ്ങിക്കളഞ്ഞു’ ഉപയോഗിച്ചു; സാംസ്കാരികമായി പ്രത്യേകമായ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
