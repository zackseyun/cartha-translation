reference: Genesis 41:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֵ֖רֶא בַּ/חֲלֹמִ֑/י וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּ/קָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: ml
  text: 'എന്റെ സ്വപ്നത്തിൽ ഞാൻ കണ്ടു: ഇതാ, നിറഞ്ഞതും നല്ലതുമായ ഏഴു ധാന്യക്കതിരുകൾ[a] ഒരൊറ്റ തണ്ടിൽ വളർന്നുവരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ധാന്യത്തിന്റെ ഏഴു കതിര്‍ത്തലകൾ.’ എബ്രായപദം ധാന്യത്തിന്റെ കതിരിനെയോ കതിര്‍ത്തലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: ഞാൻ കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം ഫറവോന്റെ ഒന്നാംപുരുഷ വിവരണം തുടരുന്നു; ‘ഞാൻ കണ്ടു’ എന്നത് അതിന്റെ ആഖ്യാനക്രമം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּחֲלֹמִי
  choice: എന്റെ സ്വപ്നത്തിൽ
  rationale: പൂർവപ്രത്യയവും ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള നാമവും ചേർന്ന രൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ഹിന്നേ സ്വപ്നദൃശ്യത്തെ സജീവമായും പെട്ടെന്നുള്ള ശ്രദ്ധാകേന്ദ്രമായും അവതരിപ്പിക്കുന്നു; ‘ഇതാ’ ആ പ്രഭാവം നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: ഏഴു ധാന്യക്കതിരുകൾ
  rationale: שִׁבֹּלֶת ഇവിടെ ധാന്യത്തിന്റെ കതിരിനെയോ കതിര്‍ത്തലയെയോ സൂചിപ്പിക്കുന്നു; ‘ധാന്യക്കതിരുകൾ’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עֹלֹת
  choice: വളർന്നുവരുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം സ്വപ്നത്തിലെ തുടരുന്ന, ദൃശ്യമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ധാന്യക്കതിരുകളുടെ സന്ദർഭത്തിൽ ‘വളർന്നുവരുന്നു’ സ്വാഭാവികമായി ആ ഭാവം നൽകുന്നു.
- source_word: בְּקָנֶה אֶחָד
  choice: ഒരൊറ്റ തണ്ടിൽ
  rationale: קָנֶה ഇവിടെ ധാന്യത്തിന്റെ തണ്ടാണ്; ഒരേ തണ്ടിൽ പല കതിരുകൾ കാണപ്പെടുന്ന ദൃശ്യത്തെ ‘ഒരൊറ്റ തണ്ടിൽ’ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: מְלֵאֹת
  choice: നിറഞ്ഞതും
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘നിറഞ്ഞ’ എന്ന ആശയം നിലനിർത്തുകയും കതിരിലെ ധാന്യസമൃദ്ധി സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְטֹבוֹת
  choice: നല്ലതുമായ
  rationale: טוֹב എന്ന പദത്തിന്റെ വിശാലമായ ‘നല്ല’ എന്ന അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ കതിരുകളുടെ അനുകൂലമായ ഗുണമാണ് സൂചിപ്പിക്കുന്നത്.
