translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് സ്വപ്നവിവരണത്തിന്റെ സജീവത നിലനിർത്തുന്നു; പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് എബ്രായത്തിലെ വിശേഷണങ്ങളും തുടരുന്ന പ്രവർത്തനഭാവവും സംരക്ഷിച്ചു.
