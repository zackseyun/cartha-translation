translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജകീയ അധികാരമേൽപ്പിക്കൽ സൂചിപ്പിക്കുന്ന ഔപചാരികത നിലനിർത്തിയിട്ടുണ്ട്. മൂലപാഠത്തിന്റെ ക്രമം പൊതുവേ പാലിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു; യഥാർഥമായ ശബ്ദാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
