  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: ml
  text: അപ്പോൾ ഫറവോൻ തന്റെ കൈയിൽനിന്ന് മുദ്രമോതിരം[a] ഊരി യോസേഫിന്റെ കൈയിൽ അണിയിച്ചു. അവനെ നല്ല ലിനൻ വസ്ത്രങ്ങൾ[b] ധരിപ്പിക്കുകയും അവന്റെ കഴുത്തിൽ ഒരു സ്വർണച്ചങ്ങല[c] ഇടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മോതിരം.’ ഹീബ്രുപദം പൊതുവായി ഒരു മോതിരത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ഈ രാജകീയ സന്ദർഭത്തിൽ ഇത് അധികാരം ഏൽപ്പിക്കുന്നതിന്റെ അടയാളമായ ഫറവോന്റെ മുദ്രമോതിരമായിരിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘നല്ല ലിനൻ വസ്ത്രങ്ങൾ’ എന്നത് സമ്പത്തോടും ബഹുമാനത്തോടും ബന്ധപ്പെട്ടിരുന്ന ഉന്നത നിലവാരമുള്ള ലിനൻ തുണിക്കുള്ള שֵׁשׁ എന്ന ഹീബ്രുപദത്തിന്റെ പരിഭാഷയാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘സ്വർണമാല’ അല്ലെങ്കിൽ ‘സ്വർണകണ്ഠാഭരണം.’ ഹീബ്രുപദം സൂചിപ്പിക്കുന്ന കഴുത്താഭരണത്തിന്റെ കൃത്യമായ രൂപം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: ഊരി
  rationale: കൈയിൽ അണിഞ്ഞിരുന്ന മോതിരം നീക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഹീബ്രു ക്രിയയുടെ ‘നീക്കുക/ഊരുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: טַבַּעְתּוֹ
  choice: തന്റെ മുദ്രമോതിരം
  rationale: പദത്തിന് പൊതുവായി ‘മോതിരം’ എന്നർഥമുണ്ടെങ്കിലും രാജകീയ ഭരണസന്ദർഭത്തിൽ അധികാരം ഏൽപ്പിക്കുന്ന മുദ്രമോതിരമാണ് ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യത.
- source_word: מֵעַל יָדוֹ
  choice: തന്റെ കൈയിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ സ്ഥലബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: യോസേഫിന്റെ കൈയിൽ അണിയിച്ചു
  rationale: נתן അടിസ്ഥാനമായി ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും മോതിരവും ‘കൈയിൽ’ എന്ന പ്രയോഗവും ചേർന്നപ്പോൾ അണിയിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ സ്വാഭാവികം.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: അവനെ ... ധരിപ്പിക്കുകയും
  rationale: മറ്റൊരാളെ വസ്ത്രം അണിയിക്കുന്ന ഔപചാരിക പ്രവൃത്തി വ്യക്തമാക്കുകയും സ്ഥാനാരോഹണസദൃശമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: നേർത്ത ചണവസ്ത്രങ്ങൾ
  rationale: שֵׁשׁ ഉന്നത നിലവാരമുള്ള നേർത്ത ലിനൻ തുണിയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളരൂപമാണിത്.
- source_word: רְבִד הַזָּהָב
  choice: ഒരു സ്വർണച്ചങ്ങല
  rationale: കഴുത്തിൽ ധരിക്കുന്ന ആഭരണത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ‘സ്വർണച്ചങ്ങല’യും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും നൽകുന്നു.
- source_word: עַל צַוָּארוֹ
  choice: അവന്റെ കഴുത്തിൽ
  rationale: ആഭരണം കഴുത്തിൽ ഇടുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഹീബ്രുവിലെ ‘കഴുത്തിന്മേൽ’ എന്ന സ്ഥലബന്ധം സംരക്ഷിക്കുന്നു.
