  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: ml
  text: പ്രഭാതമായപ്പോൾ ഫറവോന്റെ മനസ്സ് അസ്വസ്ഥമായി. അവൻ ആളയച്ച് ഈജിപ്തിലെ സകല മന്ത്രവാദികളെയും ഈജിപ്തിലെ സകല ജ്ഞാനികളെയും വിളിച്ചുവരുത്തി. ഫറവോൻ തന്റെ സ്വപ്നം അവരോടു വിവരിച്ചു; എന്നാൽ അവയെ ഫറവോനു വ്യാഖ്യാനിച്ചുകൊടുക്കാൻ ആർക്കും കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘സ്വപ്നം’ ഏകവചനമാണെങ്കിലും ‘വ്യാഖ്യാനിക്കുക’ എന്നതിന്റെ കർമം ബഹുവചനത്തിലാണ് (‘അവയെ’). ഇത് സ്വപ്നത്തിന്റെ വിവിധ ഭാഗങ്ങളെയോ ഘടകങ്ങളെയോ സൂചിപ്പിക്കാം. ചില പരിഭാഷകൾ ഇതിനെ ‘അത് വ്യാഖ്യാനിക്കാൻ’ എന്നു ഏകവചനമാക്കുന്നു.
