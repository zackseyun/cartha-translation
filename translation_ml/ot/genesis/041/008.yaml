lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: പ്രഭാതമായപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനത്തിലെ കാലക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: ഫറവോന്റെ മനസ്സ് അസ്വസ്ഥമായി
  rationale: רוּחַ അക്ഷരാർഥത്തിൽ ‘ആത്മാവ്’ എന്നാകാമെങ്കിലും ഇവിടെ ഉള്ളിലെ മാനസിക കലക്കം സൂചിപ്പിക്കുന്നു; ‘മനസ്സ് അസ്വസ്ഥമായി’ സാധാരണ മലയാളത്തിൽ പ്രസക്തമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: അവൻ ആളയച്ച് ... വിളിച്ചുവരുത്തി
  rationale: രണ്ടു തുടർച്ചയായ ക്രിയകളെയും മലയാളത്തിലെ സ്വാഭാവികമായ രാജകീയ വിളിച്ചുവരുത്തൽ പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ഈജിപ്തിലെ സകല മന്ത്രവാദികളെയും
  rationale: ഈജിപ്തിലെ രഹസ്യവിദ്യകളോടും സ്വപ്നവ്യാഖ്യാനത്തോടും ബന്ധപ്പെട്ട വിദഗ്ധരെയാണ് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘മന്ത്രവാദികൾ’ വ്യക്തവും പരിചിതവുമായ പദമാണ്.
- source_word: כָּל חֲכָמֶיהָ
  choice: സകല ജ്ഞാനികളെയും
  rationale: പ്രത്യയം ഈജിപ്തിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലം മുൻവാക്യഘടകത്തിൽ വ്യക്തമാകുന്നതിനാൽ ആവർത്തനം കൂടാതെ അർഥം നിലനിൽക്കുന്നു.
- source_word: וַיְסַפֵּר פַרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: ഫറവോൻ തന്റെ സ്വപ്നം അവരോടു വിവരിച്ചു
  rationale: മസോററ്റിക് പാഠത്തിലെ ഏകവചനമായ חֲלֹמוֹ (‘തന്റെ സ്വപ്നം’) അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: എന്നാൽ അവ ഫറവോനുവേണ്ടി വ്യാഖ്യാനിക്കാൻ ആർക്കും കഴിഞ്ഞില്ല
  rationale: פתר എന്നത് സ്വപ്നം വ്യാഖ്യാനിക്കുക എന്ന അർഥത്തിൽ വരുന്നു. മുൻപുള്ള ഏകവചന നാമത്തിനു പിന്നാലെയുള്ള ബഹുവചന സർവനാമത്തിന്റെ യഥാർഥ പാഠഭേദമല്ലാത്ത വ്യാകരണത്തീവ്രത ‘അവ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഏകവചനമായ ‘സ്വപ്നം’ എന്നതിനുശേഷമുള്ള ബഹുവചന കർമസർവനാമം
  choice: പ്രധാനപാഠത്തിൽ ‘തന്റെ സ്വപ്നം ... അവ ... വ്യാഖ്യാനിക്കാൻ’ എന്നു രണ്ടും നിലനിർത്തി
  alternative: ‘തന്റെ സ്വപ്നങ്ങൾ ... അവ’ എന്നോ ‘തന്റെ സ്വപ്നം ... അത്’ എന്നോ ഒത്തുചേർക്കുക
  rationale: WLC-യിൽ സ്വപ്നം ഏകവചനവും അതിനെ സൂചിപ്പിക്കുന്ന കർമസർവനാമം ബഹുവചനവുമാണ്. സ്വപ്നത്തിന്റെ വിവിധ ഭാഗങ്ങളെയോ സ്വപ്നാനുഭവത്തിന്റെ ഘടകങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന സാദ്ധ്യത പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ആത്മാവ് കലങ്ങി’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ളെങ്കിലും അസ്വാഭാവികമായ പ്രയോഗത്തിനു പകരം സന്ദർഭോചിതമായി ‘മനസ്സ് അസ്വസ്ഥമായി’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഏകവചന–ബഹുവചന സംഘർഷം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
