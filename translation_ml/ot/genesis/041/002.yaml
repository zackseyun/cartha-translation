  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, ദൃശ്യാത്മകവും മാന്യവുമായ മലയാളം. ‘ഇതാ’ എന്ന കൂടുതൽ ഔപചാരിക രൂപത്തിന് പകരം ‘അപ്പോൾ നോക്കൂ’ ഉപയോഗിച്ച് സ്വപ്നവിവരണത്തിന്റെ സജീവത നിലനിർത്തി.
