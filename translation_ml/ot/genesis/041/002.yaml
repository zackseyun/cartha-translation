source:
  edition: WLC
  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: ml
  text: ഇതാ, നൈൽനദിയിൽനിന്ന് കാഴ്ചയ്ക്കു ഭംഗിയുള്ളതും തടിച്ചുകൊഴുത്തതുമായ ഏഴു പശുക്കൾ കയറിവന്നു; അവ ചതുപ്പുപുല്ലിൽ മേഞ്ഞുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാങ്ങണകൾക്കിടയിൽ’ അല്ലെങ്കിൽ ‘ചതുപ്പിലെ പുല്ലിനിടയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ നോക്കൂ
  rationale: സ്വപ്നദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന സജീവമായ വ്യവഹാരസൂചകം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַיְאֹר
  choice: നൈൽനദി
  rationale: ഈജിപ്തിലെ പശ്ചാത്തലത്തിൽ יְאֹר പൊതുവായ ഒരു നദിയെയല്ല, പ്രത്യേകിച്ച് നൈൽനദിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֹלֹת
  choice: കയറിവന്ന്
  rationale: നദിയിൽനിന്ന് മുകളിലേക്കു വരുന്ന ദൃശ്യചലനം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള മേച്ചിലുമായി ക്രിയയെ ബന്ധിപ്പിക്കുന്നു.
- source_word: פָּרוֹת
  choice: പശുക്കൾ
  rationale: സ്ത്രീലിംഗ ഗോവുകളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടും സാധാരണവുമായ മലയാളരൂപം.
- source_word: יְפוֹת מַרְאֶה
  choice: കാഴ്ചയ്ക്ക് ഭംഗിയുള്ള
  rationale: ബാഹ്യരൂപത്തിന്റെ ആകർഷകത്വം വ്യക്തവും മാന്യവുമായ ആധുനിക ഭാഷയിൽ നൽകുന്നു.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: തടിച്ചുകൊഴുത്ത
  rationale: ശരീരത്തിന്റെ നിറവും പുഷ്ടിയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം പൊതുവായ ‘ആരോഗ്യമുള്ള’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַתִּרְעֶינָה
  choice: മേഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ദൃശ്യത്തിൽ തുടരുന്ന മേച്ചിൽപ്രവർത്തനം ഭൂതകാല തുടർച്ചാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּאָחוּ
  choice: ചതുപ്പിലെ പുല്ലിനിടയിൽ
  rationale: നൈൽതീരത്തെ ചതുപ്പുസസ്യങ്ങളെയോ ഞാങ്ങണപ്പുല്ലിനെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പരിസ്ഥിതിസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
