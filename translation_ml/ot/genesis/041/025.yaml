id: GEN.41.25
reference: Genesis 41:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് ഫറവോനോടു പറഞ്ഞു: “ഫറവോന്റെ സ്വപ്നം ഒന്നുതന്നെയാണ്[a]; ദൈവം ചെയ്യുന്നതെന്തെന്ന്[b] അവിടുന്ന് ഫറവോനെ അറിയിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘സ്വപ്നം’ ഏകവചനത്തിലാണ്. സന്ദർഭത്തിൽ ഫറവോന്റെ രണ്ടു സ്വപ്നങ്ങളും ഒരൊറ്റ സന്ദേശമാണെന്നാണു യോസേഫ് പറയുന്നത്; അതിനാൽ ‘ഫറവോന്റെ സ്വപ്നങ്ങൾ ഒന്നുതന്നെയാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവം ചെയ്യാനിരിക്കുന്നതെന്തെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ കൃദന്തരൂപം ‘ചെയ്യുന്നത്’ എന്നോ, ഈ സന്ദർഭത്തിൽ സമീപഭാവിയെ സൂചിപ്പിച്ച് ‘ചെയ്യാനിരിക്കുന്നത്’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: אֶל־פַּרְעֹה
  choice: ഫറവോനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ദത്തിവ് രൂപം.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: ഫറവോന്റെ സ്വപ്നം ഒന്നുതന്നെയാണ്
  rationale: എബ്രായത്തിലെ ഏകവചനമായ ‘സ്വപ്നം’ നിലനിർത്തുകയും, രണ്ടു സ്വപ്നങ്ങളും ഒരൊറ്റ സന്ദേശമാണെന്ന ഊന്നൽ ‘ഒന്നുതന്നെയാണ്’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֵת אֲשֶׁר
  choice: എന്തെന്ന്
  rationale: തുടർന്നുവരുന്ന പ്രവൃത്തിയെ അറിയിപ്പിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടന.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ നിർദിഷ്ടമായി ദൈവത്തെ സൂചിപ്പിക്കുന്ന എബ്രായരൂപത്തിന് സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: עֹשֶׂה
  choice: ചെയ്യുന്നത്
  rationale: എബ്രായ വർത്തമാന കൃദന്തരൂപത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സമീപഭാവിക അർഥം സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הִגִּיד
  choice: അറിയിച്ചിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർഥവും പൂർത്തിയായ അറിയിപ്പിന്റെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְפַרְעֹה
  choice: ഫറവോനെ
  rationale: ‘അറിയിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം അറിയിപ്പ് ലഭിച്ച വ്യക്തിയെ കർമരൂപത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: הָאֱלֹהִים എന്നതിന്റെ നിർദിഷ്ട പരാമർശം
  choice: ദൈവം
  alternative: ആ ദൈവം
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട ആർട്ടിക്കിൾ ഉണ്ടായിട്ടും ഇവിടെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ നിർദിഷ്ട നാമപ്രയോഗമാണ്; ‘ആ ദൈവം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മലയാളത്തിൽ അനാവശ്യമായ വിരുദ്ധതയോ അകലമോ സൃഷ്ടിക്കും.
- issue: עֹשֶׂה എന്ന കൃദന്തരൂപത്തിന്റെ കാലഭാവം
  choice: ചെയ്യുന്നത്
  alternative: ചെയ്യാനിരിക്കുന്നത്
  rationale: മൂലരൂപത്തിലെ കാലപരമായ തുറന്ന നില പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു. വരാനിരിക്കുന്ന സംഭവങ്ങളിലേക്കുള്ള സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു; അതുവഴി ഭാവിക അർഥം പൂർണമായി ഒഴിവാക്കുകയോ നിർബന്ധമായി ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഒന്നുതന്നെയാണ്’ എന്ന പ്രയോഗം മൂലത്തിലെ ‘ഒന്ന്’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു. ദൈവത്തെ വീണ്ടും പേരെടുത്ത് ആവർത്തിക്കുന്നതിനുപകരം ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചിരിക്കുന്നു.
