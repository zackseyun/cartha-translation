translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് ദൃശ്യത്തിന്റെ സജീവത നിലനിർത്തുന്നു; കൃഷിസംബന്ധമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായവയായി തിരഞ്ഞെടുത്തു.
