  - severity: low
    issue: ‘ഒരേ തണ്ടിൽ’ can imply ‘on the same stalk.’
    rationale: The Hebrew emphasizes one/single stalk. ‘ഒരു തണ്ടിൽ’ conveys this plainly and naturally.
