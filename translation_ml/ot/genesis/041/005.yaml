  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: ml
  text: പിന്നെ അവൻ ഉറങ്ങി; രണ്ടാം പ്രാവശ്യം സ്വപ്നം കണ്ടു. ഇതാ, ഒരു തണ്ടിൽ ഏഴ് ധാന്യക്കതിരുകൾ[a] വളർന്നുവരുന്നുണ്ടായിരുന്നു; അവ മുഴുത്തവയും[b] നല്ലവയും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ധാന്യത്തിന്റെ ഏഴ് തലകൾ.’ ഹീബ്രുപദം ധാന്യം വഹിക്കുന്ന കതിരിനെയോ അതിന്റെ തലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പുഷ്ടിയുള്ളവയും’ അല്ലെങ്കിൽ ‘നിറഞ്ഞവയും.’ ആദ്യ വിശേഷണം കതിരുകൾ ധാന്യം നിറഞ്ഞ് മുഴുത്തവയായിരുന്നു എന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
