id: GEN.41.41
reference: Genesis 41:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: ml
  text: 'ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “നോക്കൂ, ഈജിപ്തുദേശം മുഴുവന്റെയും മേൽ ഞാൻ നിന്നെ അധികാരപ്പെടുത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഗദ്യത്തിൽ പ്രത്യേകിച്ച് ‘അപ്പോൾ’ ചേർക്കാതെ ക്രിയയിലൂടെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; יוֹסֵף എന്ന പേരിന് ‘യോസേഫ്’ എന്ന സ്ഥിരപ്രയോഗരൂപം സ്വീകരിക്കുന്നു.
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: പ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഏകവചന ആജ്ഞ; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: ഞാൻ നിന്നെ അധികാരപ്പെടുത്തിയിരിക്കുന്നു
  rationale: נתן എന്നത് അക്ഷരാർഥത്തിൽ ‘നൽകുക’ എന്നാണെങ്കിലും עַל സഹിതമുള്ള ഈ ഭരണസന്ദർഭത്തിൽ ഒരാളെ ഒരു മേഖലയ്ക്കുമേൽ നിയമിച്ച് അധികാരം ഏൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശം മുഴുവന്റെയും മേൽ
  rationale: כָּל എന്നതിന്റെ സമഗ്രവ്യാപ്തിയും אֶרֶץ എന്നതിന്റെ ‘ദേശം’ എന്ന ആശയവും നിലനിർത്തി, മലയാളത്തിൽ അധികാരപരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ രാജകീയ പ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ. മൂലത്തിലെ ഭരണാധികാരസൂചന നേരിട്ട് പദാനുപദമായി അസ്വാഭാവികമാക്കാതെ ‘അധികാരപ്പെടുത്തിയിരിക്കുന്നു’ എന്നു നൽകി.
