id: GEN.41.32
reference: Genesis 41:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: ml
  text: സ്വപ്നം ഫറവോന് രണ്ടുതവണ ആവർത്തിക്കപ്പെട്ടത്, ആ കാര്യം ദൈവം സ്ഥിരമായി നിശ്ചയിച്ചിരിക്കുന്നു[a] എന്നും ദൈവം അതു വേഗത്തിൽ നടപ്പാക്കും[b] എന്നും സൂചിപ്പിക്കുന്നതിനാലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ കാര്യം ദൈവത്താൽ ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവം അത് നടപ്പാക്കാൻ തിടുക്കപ്പെടുന്നു” അല്ലെങ്കിൽ “ദൈവം അത് നടപ്പാക്കാനിരിക്കുകയാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: അതിന്റെ കാരണം ഇതാണ്
  rationale: ആവർത്തിച്ച സ്വപ്നത്തെക്കുറിച്ചുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന പ്രയോഗം; ഹീബ്രുവിലെ കാരണസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: സ്വപ്നം ... ആവർത്തിക്കപ്പെട്ടത്
  rationale: നിഷ്ക്രിയമായ ക്രിയാഭാവം നിലനിർത്തിക്കൊണ്ട് ആ സ്വപ്നം വീണ്ടും ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: ഫറവോന് ... രണ്ടുതവണ
  rationale: സ്വപ്നം ഫറവോന് ലഭിച്ചതും അത് രണ്ടു പ്രാവശ്യം സംഭവിച്ചതും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: נָכוֹן הַדָּבָר
  choice: ആ കാര്യം ... ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: נָכוֹן സൂചിപ്പിക്കുന്ന സ്ഥിരതയും നിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു; ‘കാര്യം’ ദൈവം അറിയിച്ച സംഭവത്തെ വിശാലമായി ഉൾക്കൊള്ളുന്നു.
- source_word: מֵעִם הָאֱלֹהִים
  choice: ദൈവത്തിൽനിന്ന്
  rationale: מֵעִם എന്നതിന്റെ ഉറവിടസൂചന ഔപചാരികമായി നിലനിർത്തുന്നു; ദൈവിക നിർണയമെന്ന ആശയം അനാവശ്യമായി കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: ദൈവം ... തിടുക്കപ്പെടുകയും ചെയ്യുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ അടിയന്തരതയും വേഗവും നിലനിർത്തുന്നു.
- source_word: לַעֲשֹׂתוֹ
  choice: അത് നടപ്പാക്കാൻ
  rationale: മുൻപറഞ്ഞ കാര്യം യാഥാർഥ്യമാക്കുന്നതാണ് സന്ദർഭാർഥം; മലയാളത്തിൽ ‘ചെയ്യാൻ’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവും.
theological_decisions:
- issue: הָאֱלֹהִים എന്ന പദത്തിന്റെ വചനം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: പദം രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുള്ളതാണെങ്കിലും ഏകവചന ക്രിയാരൂപങ്ങളും യോസേഫിന്റെ പ്രസംഗസന്ദർഭവും ഏക ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: נָכוֹן ... מֵעִם הָאֱלֹהִים എന്നതിലെ ദൈവിക നിർണയത്തിന്റെ സ്വഭാവം
  choice: ആ കാര്യം ദൈവത്തിൽനിന്ന് ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ആ കാര്യം ദൈവം ഉറപ്പിച്ചിരിക്കുന്നു
  rationale: ഉറവിടവും ദൈവിക സ്ഥിരീകരണവും സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന സംരക്ഷിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അധികനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ കാരണബന്ധം വ്യക്തമായി അവതരിപ്പിക്കുകയും, ദൈവത്തിൽനിന്നുള്ള ഉറപ്പും സംഭവത്തിന്റെ ആസന്നതയും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്തു.
