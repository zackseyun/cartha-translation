    rationale: വാക്യഘടന ഹീബ്രു വിശദീകരണബന്ധം എത്തിക്കുന്നുണ്ടെങ്കിലും ആധുനിക മലയാളത്തിൽ ഭാരമുള്ളതാണ്. ആവർത്തനത്തെ വിഷയമാക്കി നേരിട്ട് വിശദീകരിക്കുന്ന രൂപം കൂടുതൽ സ്വാഭാവികമാണ്.
