- from: 'ഫറവോന് സ്വപ്നം രണ്ടുതവണ ആവർത്തിക്കപ്പെട്ടതിന്റെ കാരണം ഇതാണ്: ആ കാര്യം ദൈവത്തിൽനിന്ന് ഉറപ്പിക്കപ്പെട്ടിരിക്കുന്നു[a]; ദൈവം അത് നടപ്പാക്കാൻ തിടുക്കപ്പെടുകയും ചെയ്യുന്നു[b].'
  to: സ്വപ്നം ഫറവോന് രണ്ടുതവണ ആവർത്തിക്കപ്പെട്ടത്, ആ കാര്യം ദൈവം സ്ഥിരമായി നിശ്ചയിച്ചിരിക്കുന്നു[a] എന്നും ദൈവം അതു വേഗത്തിൽ നടപ്പാക്കും[b] എന്നും സൂചിപ്പിക്കുന്നതിനാലാണ്.
  rationale: പരിഷ്കാരം ഹീബ്രുവിന്റെ വിശദീകരണഘടനയും ‘രണ്ടുതവണ’ എന്ന ആവർത്തനവും നിലനിർത്തുന്നു. נָכוֹן ... מֵעִם הָאֱלֹהִים-നെ സ്വാഭാവിക മലയാളത്തിൽ ദൈവിക നിശ്ചയമായി വ്യക്തമാക്കി; വേഗത/ആസന്നത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും യഥാക്രമം കൈകാര്യം ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ സൂചിപ്പിക്കുന്ന വാചകഭാഗങ്ങളോടു ബന്ധിപ്പിച്ചിരിക്കുന്നു.
