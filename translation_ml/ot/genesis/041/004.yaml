    rationale: ‘കാഴ്ചയിൽ വിരൂപവും മെലിഞ്ഞവയുമായ’ directly and smoothly reflects the paired Hebrew descriptors without introducing the somewhat heavier ‘മെലിഞ്ഞ ശരീരവുമുള്ള.’
