  language: ml
  text: അപ്പോൾ കാഴ്ചയിൽ വിരൂപവും മെലിഞ്ഞവയുമായ പശുക്കൾ, കാഴ്ചയിൽ സുന്ദരവും തടിച്ചവയായ[a] ആ ഏഴു പശുക്കളെ തിന്നു. പിന്നെ ഫറവോൻ ഉണർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാഴ്ചയിൽ മോശമായ ... ആരോഗ്യമുള്ള/പുഷ്ടിയുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദങ്ങൾക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘മോശം’ എന്നും ‘ആരോഗ്യമുള്ള/പുഷ്ടിയുള്ള’ എന്നും അർഥങ്ങളുണ്ട്; എന്നാൽ സന്ദർഭം വിരൂപവും മെലിഞ്ഞതുമായ പശുക്കളും സുന്ദരവും തടിച്ചതുമായ പശുക്കളും തമ്മിലുള്ള ശാരീരിക വൈരുധ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
