    issue: ‘തിന്നുകളഞ്ഞു’ overstates the source verb.
    rationale: The Hebrew אכל means ‘ate.’ Its wayyiqtol form advances the narrative but does not itself add the completive or destructive force commonly conveyed by ‘-കളഞ്ഞു.’
  - severity: medium
    issue: Footnote anchor is attached to ‘തിന്നുകളഞ്ഞു’ rather than to ‘തടിച്ചവയായ.’
    rationale: The note discusses the lexical alternatives for בְּרִיאוֹת (‘healthy/plump’), not the verb ‘ate’; anchoring it at the relevant rendering is necessary for accurate note linkage.
  - severity: low
