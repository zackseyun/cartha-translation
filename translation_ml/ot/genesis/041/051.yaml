source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: ml
  text: യോസേഫ് തന്റെ ആദ്യജാതന് മനശ്ശെ[a] എന്നു പേരിട്ടു. “ദൈവം എന്റെ സകല കഷ്ടപ്പാടുകളും എന്റെ പിതാവിന്റെ ഭവനം മുഴുവനും മറക്കാൻ ഇടയാക്കി” എന്ന് അവൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനശ്ശെ” എന്ന പേര് “മറക്കാൻ ഇടയാക്കുക” എന്നർഥമുള്ള എബ്രായ പദത്തോടു ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: പേരിട്ടു
  rationale: പേരിടുന്ന സന്ദർഭത്തിൽ ‘പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַבְּכוֹר
  choice: തന്റെ ആദ്യജാതന്
  rationale: മൂലപാഠത്തിലെ ‘ആദ്യജാതൻ’ എന്ന വ്യക്തമായ പരാമർശം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യവിഭക്തിയോടെ സ്വാഭാവികമാക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം; തുടർന്നുള്ള ‘മറക്കാൻ ഇടയാക്കി’ എന്ന ക്രിയയുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: എന്ന് അവൻ പറഞ്ഞു
  rationale: പേരിടലിന്റെ കാരണം യോസേഫിന്റെ വാക്കുകളായി അവതരിപ്പിക്കുന്ന അന്തർനിഹിത ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: נַשַּׁנִי
  choice: മറക്കാൻ ഇടയാക്കി
  rationale: ക്രിയയുടെ കാരണാർത്ഥം നേരിട്ട് നിലനിർത്തുകയും മനശ്ശെ എന്ന പേരുമായുള്ള പദപ്രയോഗത്തിന് അടിത്തറ നൽകുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയും സന്ദർഭവും സൂചിപ്പിക്കുന്ന ഏകവചന ദൈവപരാമർശത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: כָּל עֲמָלִי
  choice: എന്റെ സകല കഷ്ടപ്പാടുകളും
  rationale: עָמָל സൂചിപ്പിക്കുന്ന ദുരിതം, അധ്വാനം, ക്ലേശം എന്നിവയിൽ ഈ സന്ദർഭത്തിലെ വിശാലമായ കഷ്ടാനുഭവം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: എന്റെ പിതൃഭവനം മുഴുവനും
  rationale: ‘പിതാവിന്റെ വീട്’ എന്ന എബ്രായ ബന്ധുകുടുംബ പ്രയോഗത്തിന്റെ കുടുംബ-ഭവന അർഥം നിലനിർത്തുന്നു; വ്യക്തികളെ മാത്രം ഉദ്ദേശിക്കുന്നതായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യോസേഫ് തന്റെ പിതൃഭവനം ‘മറന്നു’ എന്നതിന്റെ സാധ്യതയുള്ള അർഥം
  choice: ദൈവം തന്റെ കഷ്ടപ്പാടുകളും പിതൃഭവനം മുഴുവനും മറക്കാൻ ഇടയാക്കിയെന്ന യോസേഫിന്റെ പ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: പിതൃഭവനവുമായി ബന്ധപ്പെട്ട വേദന മാത്രം ദൈവം മായിച്ചുവെന്നോ ഇത് അതിശയോക്തിയാണെന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും മാനസികവുമായ സംഘർഷം വിശദീകരണപരമായ പരാവർത്തനത്തിലൂടെ പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിതൃഭവനം’ കുടുംബത്തെയും കുടുംബഗൃഹത്തെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാന്ദ്രത സംരക്ഷിക്കുന്നു. പ്രധാന പാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
