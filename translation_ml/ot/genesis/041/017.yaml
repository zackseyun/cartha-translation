translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ ദൃശ്യസജീവത നിലനിർത്തുന്നു.
