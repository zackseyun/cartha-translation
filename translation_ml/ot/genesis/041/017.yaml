  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “എന്റെ സ്വപ്നത്തിൽ, അതാ, ഞാൻ നൈൽ നദിയുടെ[a] തീരത്ത് നിൽക്കുകയായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “നദി.” ഉല്പത്തിയിലെ ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ ഈ പദം സാധാരണയായി നൈൽ നദിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം ആരംഭിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പറഞ്ഞു’ എന്നത് സ്വാഭാവികവും ആഖ്യാനധർമ്മം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപം.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בַּחֲלֹמִי
  choice: എന്റെ സ്വപ്നത്തിൽ
  rationale: പൂർവപ്രത്യയവും ഏകവചന ഒന്നാംപുരുഷ പ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവികമായ പരിഭാഷ.
- source_word: הִנְנִי
  choice: അതാ, ഞാൻ
  rationale: സ്വപ്നവിവരണത്തിന്റെ ദൃശ്യസജീവത നിലനിർത്തുന്ന presentative പ്രയോഗം; ഭൂതകാലസന്ദർഭം തുടർന്നുള്ള ക്രിയയിൽ പ്രകടമാകുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുകയായിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചകത്തിന്റെ തുടരുന്ന നിലയും സ്വപ്നം വിവരിക്കുന്ന ഭൂതകാലസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל שְׂפַת
  choice: തീരത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘അരികിൽ/ചുണ്ടിൽ’ എന്ന ആശയം നദീസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘തീരത്ത്’ എന്നു വരുന്നു.
- source_word: הַיְאֹר
  choice: നൈൽ നദി
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘നദി’ എന്നാണെങ്കിലും ഉല്പത്തിയിലെ ഈജിപ്ഷ്യൻ പശ്ചാത്തലത്തിൽ അത് സാധാരണയായി നൈൽ നദിയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തതയ്ക്കായി സന്ദർഭപരമായ പേര് മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
