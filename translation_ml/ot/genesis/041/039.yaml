id: GEN.41.39
reference: Genesis 41:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “ദൈവം ഇതെല്ലാം നിനക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നതിനാൽ[a], നിന്നെപ്പോലെ വിവേകവും ജ്ഞാനവുമുള്ള മറ്റാരുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ദൈവം ഇതെല്ലാം നിനക്കു വെളിപ്പെടുത്തിയശേഷം.” എബ്രായ പദം കൂടുതൽ പദാനുപദമായി “ശേഷം” എന്നു പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ഫറവോന്റെ നിഗമനത്തിനുള്ള അടിസ്ഥാനവും അതു സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: אַחֲרֵי
  choice: '...തിനാൽ'
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ശേഷം’ എന്നാണെങ്കിലും, ഇവിടെ ഫറവോന്റെ നിഗമനത്തിനുള്ള അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു; കാരണാർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘...തിനാൽ’ ഉപയോഗിച്ചു.
- source_word: הוֹדִיעַ
  choice: വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ידע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക/അറിയാൻ ഇടയാക്കുക’ എന്നാണ്; സ്വപ്നങ്ങളുടെ അർഥം ദൈവം യോസേഫിനു അറിയിച്ച സന്ദർഭത്തിൽ ‘വെളിപ്പെടുത്തുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ക്രിയാരൂപവും സന്ദർഭവും ഏകവചന ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶת כָּל זֹאת
  choice: ഇതെല്ലാം
  rationale: യോസേഫ് വ്യാഖ്യാനിച്ചും വിശദീകരിച്ചും പറഞ്ഞ മുഴുവൻ കാര്യത്തെയും ചുരുക്കമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵין
  choice: മറ്റാരുമില്ല
  rationale: നിഷേധാത്മക അസ്തിത്വപ്രയോഗത്തെ താരതമ്യവാക്യത്തിൽ സ്വാഭാവികമായ മലയാളമായി അവതരിപ്പിക്കുന്നു.
- source_word: נָבוֹן
  choice: വിവേകം
  rationale: കാര്യങ്ങൾ ഗ്രഹിച്ചറിയാനുള്ള ഉൾക്കാഴ്ചയും തിരിച്ചറിവും സൂചിപ്പിക്കുന്നു.
- source_word: וְחָכָם
  choice: ജ്ഞാനം
  rationale: חכם എന്നതിന്റെ സാധാരണ അർഥമായ ജ്ഞാനത്തെ നിലനിർത്തുകയും נבון എന്നതിനോടുള്ള ദ്വന്ദ്വം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּמוֹךָ
  choice: നിന്നെപ്പോലെ
  rationale: നിഷേധാത്മക താരതമ്യത്തിൽ സ്വാഭാവികമായ മലയാളരൂപം.
theological_decisions:
- issue: ഫറവോന്റെ വാക്കുകളിലെ אֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: אֱלֹהִים ചില സന്ദർഭങ്ങളിൽ രൂപപരമായി ബഹുവചനമായി വരാമെങ്കിലും, ഇവിടെ ഏകവചന ക്രിയയും യോസേഫിനു കാര്യം അറിയിച്ച ദൈവത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിവേകവും ജ്ഞാനവുമുള്ള’ എന്ന കൂട്ടുപ്രയോഗം എബ്രായത്തിലെ രണ്ട് ഗുണപദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മൂലപദത്തിലെ കാലാർഥ–കാരണാർഥ സാധ്യത സംരക്ഷിക്കുന്നു.
