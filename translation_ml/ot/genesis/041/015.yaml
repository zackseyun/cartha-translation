id: GEN.41.15
reference: Genesis 41:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: ml
  text: 'ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു: “ഞാൻ ഒരു സ്വപ്നം കണ്ടു; അതിനെ വ്യാഖ്യാനിക്കാൻ ആരുമില്ല. എന്നാൽ ഒരു സ്വപ്നം കേട്ടാൽ നിനക്ക് അതിനെ വ്യാഖ്യാനിക്കാൻ കഴിയുമെന്ന് നിന്നെക്കുറിച്ച് ഞാൻ കേട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: ഞാൻ ഒരു സ്വപ്നം കണ്ടു
  rationale: ഹീബ്രായയിലെ ഒരേ ധാതുവിൽ നിന്നുള്ള നാമവും ക്രിയയും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: അതിനെ വ്യാഖ്യാനിക്കാൻ ആരുമില്ല
  rationale: സ്വപ്നത്തിന്റെ അർഥം വെളിപ്പെടുത്തുക എന്ന സന്ദർഭാർഥത്തിൽ פֹתֵר എന്ന പദത്തിന് ‘വ്യാഖ്യാനിക്കുക’ യോജിക്കുന്നു; ഹീബ്രായയിലെ അസ്തിത്വനിഷേധവും നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: നിന്നെക്കുറിച്ച് ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: ‘പറഞ്ഞുകൊണ്ട്/എന്നു’ എന്ന ഹീബ്രായ ഘടനയുടെ റിപ്പോർട്ടീവ് സ്വഭാവം തുടർന്നുള്ള ആശ്രിതവാക്യത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: ഒരു സ്വപ്നം കേട്ടാൽ നിനക്ക് അതിനെ വ്യാഖ്യാനിക്കാൻ കഴിയും
  rationale: അക്ഷരാർഥത്തിലെ ‘സ്വപ്നം കേൾക്കുക, അതിനെ വ്യാഖ്യാനിക്കാനായി’ എന്ന ഘടന സംരക്ഷിക്കുമ്പോഴും, സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന കഴിവ് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള നേരിട്ടുള്ള സംഭാഷണശൈലി. മൂലത്തിലെ ‘സ്വപ്നം കേൾക്കുക’ എന്ന പ്രത്യേക പ്രയോഗം ലളിതമാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
