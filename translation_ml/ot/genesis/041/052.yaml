reference: Genesis 41:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: ml
  text: രണ്ടാമത്തെ മകന് അവൻ എഫ്രയീം[a] എന്നു പേരിട്ടു; എന്തെന്നാൽ, “എന്റെ കഷ്ടതയുടെ ദേശത്ത് ദൈവം എന്നെ ഫലവാനാക്കിയിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എഫ്രയീം’ എന്ന പേര് എബ്രായയിലെ ‘എന്നെ ഫലവാനാക്കിയിരിക്കുന്നു’ എന്ന പ്രയോഗവുമായി ശബ്ദത്തിലും പദബന്ധത്തിലും ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: എഫ്രയീം എന്ന പേരും הִפְרַנִי എന്ന പേരിടൽവിശദീകരണവും തമ്മിലുള്ള എബ്രായ പദകളി മലയാളത്തിൽ നേരിട്ട് പ്രകടമാകുന്നില്ല.
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי
  choice: രണ്ടാമത്തവന് അവൻ … എന്നു പേരിട്ടു
  rationale: പദാനുപദമായി ‘രണ്ടാമത്തവന്റെ പേര്’ എന്ന ഘടനയാണെങ്കിലും, പേരിടൽ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ഇത് നൽകിയിരിക്കുന്നു. മുൻവാക്യത്തോടുള്ള ബന്ധം വാക്യക്രമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: קָרָא
  choice: പേരിട്ടു
  rationale: ഒരു ശിശുവിന് പേര് നൽകുന്ന സന്ദർഭത്തിൽ ‘വിളിച്ചു’ എന്നതിനെക്കാൾ കൃത്യവും സ്വാഭാവികവുമാണ് ‘പേരിട്ടു’.
- source_word: אֶפְרָיִם
  choice: എഫ്രയീം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: പേരിടലിന്റെ കാരണം വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הִפְרַנִי
  choice: എന്നെ ഫലവാനാക്കിയിരിക്കുന്നു
  rationale: פרה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ഫലവാനാക്കുക’ എന്ന കാരണാർഥം സംരക്ഷിക്കുന്നു; എഫ്രയീം എന്ന പേരുമായുള്ള പദബന്ധവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ക്രിയ ഏകവചനത്തിലായതിനാൽ ഇവിടെ ഏകവചനമായ ‘ദൈവം’ യോജിക്കുന്നു.
- source_word: בְּאֶרֶץ
  choice: ദേശത്ത്
  rationale: ഭൗമിക സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: עָנְיִי
  choice: എന്റെ കഷ്ടത
  rationale: കഷ്ടപ്പാട്, ദുരിതം, പീഡനം എന്നീ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ പേരിടൽ വിശദീകരണത്തിന്റെ അർഥം
  choice: ദൈവമാണ് തന്നെ ഫലവാനാക്കിയതെന്ന് യോസേഫ് സമ്മതിക്കുമ്പോഴും, ഈജിപ്തിനെ ‘എന്റെ കഷ്ടതയുടെ ദേശം’ എന്നു വിശേഷിപ്പിക്കുന്ന പിരിമുറുക്കം നിലനിർത്തി.
  alternative: ‘കഷ്ടത’ എന്നത് ഈജിപ്തിലെത്തുന്നതിനു മുമ്പുള്ള ദുരിതങ്ങൾക്കു മാത്രമോ കുടുംബത്തിൽനിന്നുള്ള വേർപാടുൾപ്പെടെയുള്ള വിശാല അനുഭവത്തിനോ ബാധകമാണെന്ന് വ്യക്തമാക്കുക.
  rationale: കഷ്ടതയുടെ കൃത്യമായ കാലപരിധി വാക്യം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ദൈവം നൽകിയ ഫലസമൃദ്ധിയും ഓർമയിൽ തുടരുന്ന കഷ്ടതയും ഒരുമിച്ച്, വ്യാഖ്യാനപരമായി ചുരുക്കാതെ, സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പേരിടൽ വിശദീകരണത്തിലെ ഒന്നാംപുരുഷഭാവവും ദൈവിക പ്രവർത്തനവും കഷ്ടതയുടെ ഓർമയും നിലനിർത്തി; പദകളി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
