id: GEN.41.27
reference: Genesis 41:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שֶׁ֣בַע הַ֠/פָּרוֹת הָֽ/רַקּ֨וֹת וְ/הָ/רָעֹ֜ת הָ/עֹלֹ֣ת אַחֲרֵי/הֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִׁבֳּלִים֙ הָ/רֵק֔וֹת שְׁדֻפ֖וֹת הַ/קָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: ml
  text: അവയ്ക്കു പിന്നാലെ കയറിവന്ന മെലിഞ്ഞതും മോശമായതുമായ ഏഴ് പശുക്കൾ ഏഴ് വർഷങ്ങളാണ്. കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞുപോയ, മണിയില്ലാത്ത ഏഴ് കതിരുകൾ ക്ഷാമത്തിന്റെ ഏഴ് വർഷങ്ങളായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: മെലിഞ്ഞ
  rationale: പശുക്കളുടെ ക്ഷീണിച്ച ശരീരാവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהָרָעֹת
  choice: മോശമായ
  rationale: ഇവിടെ ധാർമിക തിന്മയല്ല, പശുക്കളുടെ മോശമായ അവസ്ഥയും രൂപവുമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ അർഥമുള്ള ഈ പദം തിരഞ്ഞെടുത്തു.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: അവയ്ക്കു പിന്നാലെ കയറിവന്ന
  rationale: സ്വപ്നത്തിൽ പശുക്കൾ ആദ്യം വന്നവയ്ക്കുശേഷം വെള്ളത്തിൽനിന്ന് കയറിവന്ന ക്രമം നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: ഏഴ് വർഷങ്ങളാണ്
  rationale: സ്വപ്നചിഹ്നങ്ങളെ വർഷങ്ങളായി തിരിച്ചറിയിക്കുന്ന യോസേഫിന്റെ വ്യാഖ്യാനം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: הַשִׁבֳּלִים הָרֵקוֹת
  choice: മണിയില്ലാത്ത ഏഴ് കതിരുകൾ
  rationale: ധാന്യക്കതിരുകൾ നിറവില്ലാതെ ശൂന്യമായിരിക്കുന്ന കാർഷികചിത്രം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: കിഴക്കൻ കാറ്റേറ്റ് കരിഞ്ഞുപോയ
  rationale: ചൂടുള്ള കിഴക്കൻ കാറ്റുമൂലം കതിരുകൾക്കുണ്ടായ നാശം സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יִהְיוּ שֶׁבַע שְׁנֵי רָעָב
  choice: ക്ഷാമത്തിന്റെ ഏഴ് വർഷങ്ങളായിരിക്കും
  rationale: അപൂർണ്ണക്രിയയുടെ ഭാവിസൂചനയും רָעָב എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ ‘ക്ഷാമം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിലും വിവരണത്തിന്റെ ഗൗരവം നിലനിർത്തിയും തയ്യാറാക്കി. മൂലപാഠത്തിലെ രണ്ടു സമാന്തര സ്വപ്നചിഹ്നങ്ങളെയും അവയുടെ കാലസൂചനയെയും വ്യക്തമായി സൂക്ഷിച്ചു.
