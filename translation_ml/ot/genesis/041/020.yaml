- from: മെലിഞ്ഞതും വിരൂപവുമായ പശുക്കൾ ആദ്യം വന്ന ആരോഗ്യമുള്ള ഏഴു പശുക്കളെ തിന്നുകളഞ്ഞു.[a]
  to: മെലിഞ്ഞതും കാണാൻ മോശമായതുമായ പശുക്കൾ ആദ്യത്തെ ഏഴു ആരോഗ്യമുള്ള പശുക്കളെ തിന്നുകളഞ്ഞു.[a]
