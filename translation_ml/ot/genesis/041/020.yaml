  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּאכַ֨לְנָה֙ הַ/פָּר֔וֹת הָ/רַקּ֖וֹת וְ/הָ/רָע֑וֹת אֵ֣ת שֶׁ֧בַע הַ/פָּר֛וֹת הָ/רִאשֹׁנ֖וֹת הַ/בְּרִיאֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: ml
  text: മെലിഞ്ഞതും കാണാൻ മോശമായതുമായ പശുക്കൾ ആദ്യത്തെ ഏഴു ആരോഗ്യമുള്ള പശുക്കളെ തിന്നുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മെലിഞ്ഞതും വിരൂപമായതുമായ പശുക്കൾ ... ആദ്യത്തെ ഏഴു തടിച്ച പശുക്കളെ.’
    reason: רָעוֹת എന്നതിന് ‘വിരൂപമായ’ എന്നും בְּרִיאוֹת എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘തടിച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: തിന്നുകളഞ്ഞു
  rationale: אכל എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘തിന്നുക’ എന്നാണ്. സ്വപ്നത്തിലെ പശുക്കൾ മറ്റുള്ളവയെ പൂർണമായി ഭക്ഷിക്കുന്ന സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കാൻ ‘തിന്നുകളഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַפָּרוֹת
  choice: പശുക്കൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനം പെൺകന്നുകാലികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘കന്നുകാലികൾ’ എന്നതിനെക്കാൾ ‘പശുക്കൾ’ കൃത്യമാണ്.
- source_word: הָרַקּוֹת
  choice: മെലിഞ്ഞ
  rationale: ഈ വിശേഷണം ക്ഷീണിച്ച ശരീരാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മെലിഞ്ഞ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהָרָעוֹת
  choice: വിരൂപമായ
  rationale: ഇവിടെ רעות ധാർമ്മിക തിന്മയെയല്ല, മോശമായ ബാഹ്യരൂപത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിരൂപമായ’ ആ ദൃശ്യാർഥം മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ഏഴു പശുക്കളെ
  rationale: നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടിയ സംഖ്യയും നാമവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഏഴു പശുക്കളെ’ എന്നു നൽകി.
- source_word: הָרִאשֹׁנוֹת
  choice: ആദ്യം വന്ന
  rationale: സ്വപ്നത്തിൽ മുമ്പ് പ്രത്യക്ഷപ്പെട്ട കൂട്ടത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. ‘ആദ്യം വന്ന’ എന്നത് മലയാളത്തിൽ ക്രമബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבְּרִיאֹת
  choice: ആരോഗ്യമുള്ള
  rationale: ഈ പദം തടിച്ചോ പുഷ്ടമായോ ഉള്ള അവസ്ഥയെ സൂചിപ്പിക്കാം; എന്നാൽ മെലിഞ്ഞ പശുക്കളോടുള്ള വിപരീതതയിൽ ‘ആരോഗ്യമുള്ള’ എന്നത് പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ക്രമവും വിവരണാത്മക വൈരുധ്യവും നിലനിർത്തിയിട്ടുണ്ട്; അടിക്കുറിപ്പ് സൂചകം പ്രധാനവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
