  terminology: ‘ഫറവോൻ’ and ‘യോസേഫ്’ are established Malayalam biblical forms. ‘അപ്പം,’ ‘ജനം,’ and ‘നിലവിളിച്ചു’ fit the context and preserve the source's sense. No doctrinally loaded terminology has been introduced.
