id: GEN.41.55
reference: Genesis 41:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: ml
  text: 'ഈജിപ്തുദേശം മുഴുവൻ വിശപ്പിലായി; ജനം അപ്പത്തിനായി ഫറവോനോടു നിലവിളിച്ചു. അപ്പോൾ ഫറവോൻ എല്ലാ ഈജിപ്തുകാരോടും പറഞ്ഞു: “യോസേഫിന്റെ അടുക്കൽ ചെല്ലുക; അവൻ നിങ്ങളോടു പറയുന്നത് ചെയ്യുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: വിശപ്പിലായി
  rationale: רעב എന്ന ക്രിയ വിശപ്പ് അനുഭവപ്പെടുന്നതിന്റെ ആരംഭവും അവസ്ഥയും സൂചിപ്പിക്കുന്നു. ‘വിശപ്പിലായി’ ആഖ്യാനത്തിലെ പുരോഗതി നിലനിർത്തുന്നു; ‘ക്ഷാമം ബാധിച്ചു’ എന്നത് സന്ദർഭോചിതമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശം മുഴുവൻ
  rationale: എബ്രായത്തിലെ ‘ഈജിപ്തിന്റെ ദേശം മുഴുവൻ’ എന്ന ഘടനയിലെ אֶרֶץ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളക്രമം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּצְעַק הָעָם
  choice: ജനം ... നിലവിളിച്ചു
  rationale: צעק ദുരിതത്തിൽനിന്നുള്ള ശക്തമായ സഹായവിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ അടിയന്തരത സ്വാഭാവികമായി പകരുന്നു.
- source_word: לַלָּחֶם
  choice: അപ്പത്തിനായി
  rationale: לֶחֶם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ എന്നാണ്; സന്ദർഭത്തിൽ ഭക്ഷ്യധാന്യത്തെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും മൂലപദത്തിന്റെ സുതാര്യതയ്ക്കായി ‘അപ്പം’ നിലനിർത്തുന്നു.
- source_word: לְכָל מִצְרַיִם
  choice: എല്ലാ ഈജിപ്തുകാരോടും
  rationale: സ്ഥലനാമമായ ‘ഈജിപ്ത്’ ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എല്ലാ ഈജിപ്തിനോടും’ അസ്വാഭാവികമായതിനാൽ അർഥം തുറന്നുപറയുന്ന ‘എല്ലാ ഈജിപ്തുകാരോടും’ തെരഞ്ഞെടുത്തു.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: യോസേഫിന്റെ അടുക്കൽ ചെല്ലുക
  rationale: ആജ്ഞാരൂപവും אֶל എന്ന ദിശാസൂചകവും വ്യക്തമായി പകരുന്നു; ‘യോസേഫ്’ മലയാളത്തിലെ സ്ഥാപിത ബൈബിൾ നാമരൂപമാണ്.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: അവൻ നിങ്ങളോടു പറയുന്നത് ചെയ്യുക
  rationale: മൂലത്തിലെ മുൻനിറുത്തിയ ബന്ധവാക്യത്തിന്റെ അർഥവും ആജ്ഞയുടെ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ആഖ്യാനക്രമവും ശക്തമായ സഹായവിളിയും നിലനിർത്തി; മലയാളത്തിൽ അസ്വാഭാവികമായ സ്ഥലനാമ-സമൂഹപ്രയോഗം മാത്രം വ്യക്തമായി തുറന്നുപറഞ്ഞു. നൽകിയ ഇംഗ്ലീഷ് കുറിപ്പിലെ [a] അടയാളവും കുറിപ്പും തമ്മിൽ പൊരുത്തക്കേടുണ്ട്: കുറിപ്പ് വാക്യത്തിന്റെ അവസാന ഭാഗത്തെ പദക്രമവികൽപത്തെക്കുറിച്ചാണ്, എന്നാൽ അടയാളം ആദ്യവാക്യത്തിൽ നൽകിയിരിക്കുന്നു. മലയാളത്തിൽ അവസാന കല്പന സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തിയതിനാൽ ആ കുറിപ്പ് ആവശ്യമില്ല.'
