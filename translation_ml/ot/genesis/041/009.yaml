  text: וַ/יְדַבֵּר֙ שַׂ֣ר הַ/מַּשְׁקִ֔ים אֶת פַּרְעֹ֖ה לֵ/אמֹ֑ר אֶת חֲטָאַ֕/י אֲנִ֖י מַזְכִּ֥יר הַ/יּֽוֹם־־׃
