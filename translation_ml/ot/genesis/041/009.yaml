  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: ml
  text: 'അപ്പോൾ മുഖ്യ പാനപാത്രവാഹകൻ ഫറവോനോടു പറഞ്ഞു: “ഇന്ന് ഞാൻ എന്റെ കുറ്റങ്ങൾ[a] ഓർക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാപങ്ങൾ” അല്ലെങ്കിൽ “തെറ്റുകൾ.” എബ്രായപദത്തിന് ധാർമ്മികമോ ഔദ്യോഗികമോ ആയ തെറ്റുകൾ ഉൾപ്പെടെ, വിശാലമായ തെറ്റായ പ്രവൃത്തികളെ സൂചിപ്പിക്കാൻ കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ സ്വാഭാവികമായി ആ പുരോഗതി അറിയിക്കുന്നു. דבר ഇവിടെ സംസാരിച്ചതിനെ പരിചയപ്പെടുത്തുന്നു.
- source_word: שַׂר הַמַּשְׁקִים
  choice: പാനപാത്രവാഹകരുടെ തലവൻ
  rationale: ഫറവോന്റെ പാനീയസേവനത്തിന്റെ ചുമതലയുള്ള കൊട്ടാര ഉദ്യോഗസ്ഥനെയാണ് ഈ പദവി സൂചിപ്പിക്കുന്നത്. ‘പാനപാത്രവാഹകരുടെ തലവൻ’ പദവിയുടെ കൂട്ടായ/മേൽനോട്ട സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: אֶת־פַּרְעֹה
  choice: ഫറവോനോടു
  rationale: אֶת നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നുവെങ്കിലും, ‘പറഞ്ഞു’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ അഭിസംബോധിതനെ ‘-ഓട്’ ഉപയോഗിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: ഇത് പ്രസംഗാരംഭം സൂചിപ്പിക്കുന്ന സാധാരണ അനന്തക്രിയാരൂപമാണ്. മുൻക്രിയയോടു ചേർത്ത് ഒറ്റ ‘പറഞ്ഞു’ എന്നും ദ്വിബിന്ദുവും ഉപയോഗിക്കുന്നത് മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: אֶת חֲטָאַי
  choice: എന്റെ കുറ്റങ്ങൾ
  rationale: חטא എന്നത് പാപങ്ങൾ, കുറ്റങ്ങൾ, തെറ്റുകൾ എന്നിവ സൂചിപ്പിക്കാം. രാജാവിനോടുള്ള മുൻകാല തെറ്റിന്റെ കൊട്ടാരസന്ദർഭത്തിൽ ‘കുറ്റങ്ങൾ’ ധാർമ്മികവും ഔദ്യോഗികവുമായ തെറ്റുകളുടെ വ്യാപ്തി നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲנִי מַזְכִּיר
  choice: ഞാൻ ... ഓർക്കുന്നു
  rationale: זכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘ഓർമിപ്പിക്കുക’, ‘പരാമർശിക്കുക’, ‘ഓർമയിലേക്കു കൊണ്ടുവരുക’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഇവിടെ തന്റെ മുൻകാല കുറ്റങ്ങൾ ഫറവോന്റെ മുമ്പിൽ ഓർത്തുപറയുന്ന സന്ദർഭത്തിൽ ‘ഓർക്കുന്നു’ സ്വാഭാവികമാണ്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലപരമായ ഊന്നൽ നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. കൊട്ടാരപദവി സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു; חטא എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
