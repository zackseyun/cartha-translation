  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: ml
  text: ആ വർഷങ്ങൾക്കു ശേഷം ഏഴു വർഷം ക്ഷാമം വരും. മിസ്രയീംദേശത്തെ സമൃദ്ധിയെല്ലാം[a] മറക്കപ്പെടും; ആ ക്ഷാമം ദേശത്തെ വിഴുങ്ങിക്കളയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ധാരാളിത്തമെല്ലാം.’ ഹീബ്രായപദം ക്ഷാമത്തിനു വിപരീതമായ നിറവിനെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദേശത്തെ നശിപ്പിച്ചുകളയും.’ ഈ ക്രിയയ്ക്ക് പൂർണമായി തീർത്തുകളയുക അല്ലെങ്കിൽ നാശത്തിലാക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: വരും
  rationale: തുടർന്നുണ്ടാകുന്ന ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്ന പ്രവചനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം; ‘ഉയർന്നുവരും’ എന്ന ഹീബ്രായ ദൃശ്യഭാവം നിർബന്ധമായി പകർത്താതെ സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: ഏഴു ക്ഷാമവർഷങ്ങൾ
  rationale: ഹീബ്രായ സംയുക്തപദത്തിന്റെ അർത്ഥം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു; רָעָב ഇവിടെ വ്യക്തിപരമായ വിശപ്പിനേക്കാൾ വ്യാപകമായ ക്ഷാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אַחֲרֵיהֶן
  choice: അവയ്ക്കുശേഷം
  rationale: സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം മുൻവാക്യത്തിലെ സമൃദ്ധിയുടെ ഏഴു വർഷങ്ങളിലേക്കാണ് തിരിഞ്ഞുനിൽക്കുന്നത്; മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: וְנִשְׁכַּח
  choice: മറന്നുപോകും
  rationale: שׁכח എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലുള്ള ‘ഓർമയിൽനിന്ന് മാഞ്ഞുപോകുക/മറക്കപ്പെടുക’ എന്ന അർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל הַשָּׂבָע
  choice: സമൃദ്ധിയെല്ലാം
  rationale: שָׂבָע സൂചിപ്പിക്കുന്ന നിറവ്, ധാരാളിത്തം, സമൃദ്ധി എന്നിവയിൽ ഈ കാർഷിക-സാമ്പത്തിക സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ പദം; ധാന്യശേഖരത്തിലേക്ക് മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: മിസ്രയീംദേശത്തിലെ
  rationale: ഹീബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുകയും ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכִלָּה
  choice: വിഴുങ്ങിക്കളയും
  rationale: כלה എന്ന ക്രിയയുടെ പൂർണമായി തീർത്തുകളയുക, നശിപ്പിക്കുക, ക്ഷയിപ്പിക്കുക എന്നീ തീവ്രഭാവങ്ങൾ ക്ഷാമത്തെ കർത്താവാക്കി പറയുന്ന രൂപകത്തിലൂടെ പകർത്തുന്നു.
- source_word: הָרָעָב
  choice: ആ ക്ഷാമം
  rationale: മുമ്പു പറഞ്ഞ ക്ഷാമത്തെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിലെ ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: אֶת הָאָרֶץ
  choice: ദേശത്തെ
  rationale: אָרֶץ ഇവിടെ മിസ്രയീം എന്ന രാജ്യഭൂമിയെ സൂചിപ്പിക്കുന്നു; മുൻപത്തെ ‘മിസ്രയീംദേശം’ എന്ന പ്രയോഗവുമായി ബന്ധം നിലനിർത്തുന്നു.
