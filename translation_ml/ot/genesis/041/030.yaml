translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രായത്തിലെ സംഭവക്രമവും ക്ഷാമത്തെ സജീവ കർത്താവായി അവതരിപ്പിക്കുന്ന രൂപകവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുകുറികൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാളത്തിൽ [a] ‘സമൃദ്ധി’യോടും [b] ‘വിഴുങ്ങിക്കളയും’ എന്ന ക്രിയയോടും ചേർത്തു.
