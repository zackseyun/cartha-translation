source:
  edition: WLC
  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: ml
  text: “അതാ, അവയ്ക്കു പിന്നാലെ വേറെ ഏഴു പശുക്കൾ കയറിവന്നു. അവ ശോഷിച്ചവയും കാഴ്ചയിൽ വളരെ വിരൂപമായവയും മാംസം കുറഞ്ഞവയും ആയിരുന്നു. ഇത്ര മോശമായ പശുക്കളെ[a] ഈജിപ്തുദേശത്തെങ്ങും ഞാൻ കണ്ടിട്ടില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത്ര വിരൂപമായ പശുക്കളെ”; എബ്രായപ്രയോഗം അവയുടെ അത്യന്തം മോശമായ രൂപത്തെയും ദയനീയമായ ശാരീരികാവസ്ഥയെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നവിവരണത്തിലെ അടുത്ത ദൃശ്യം സജീവമായി അവതരിപ്പിക്കുന്ന ശ്രദ്ധാകർഷക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: വേറെ ഏഴു പശുക്കൾ
  rationale: പെൺകന്നുകാലികളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പശുക്കൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: അവയ്ക്കു പിന്നാലെ ... കയറിവന്നു
  rationale: നദിയിൽനിന്ന് ഉയർന്നുവരുന്ന പശ്ചാത്തലചലനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דַּלּוֹת
  choice: ശോഷിച്ചവ
  rationale: ദുർബലവും പോഷണമില്ലാത്തതുമായ അവസ്ഥ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘മാംസം കുറഞ്ഞവ’ എന്ന വിവരണവുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: കാഴ്ചയിൽ വളരെ വിരൂപമായവ
  rationale: ഇവിടെ רָעוֹת ധാർമികമായ തിന്മയെയല്ല, മോശമായ ബാഹ്യരൂപത്തെയാണ് വിശേഷിപ്പിക്കുന്നത്.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: മാംസം കുറഞ്ഞവ
  rationale: എബ്രായത്തിലെ ശാരീരിക ക്ഷീണവും മെലിവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: അവയെപ്പോലെ ... ഞാൻ കണ്ടിട്ടില്ല
  rationale: തുല്യത നിഷേധിക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തെങ്ങും
  rationale: ദേശമൊട്ടാകെയുള്ള വ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לָרֹעַ
  choice: ദയനീയമായവയെ
  rationale: രൂപവൈരൂപ്യത്തിൽ മാത്രം ഒതുക്കാതെ പശുക്കളുടെ അത്യന്തം മോശമായ രൂപവും ശാരീരികാവസ്ഥയും ഉൾക്കൊള്ളുന്ന വിശാലമായ വിലയിരുത്തൽ സംരക്ഷിക്കുന്നു.
