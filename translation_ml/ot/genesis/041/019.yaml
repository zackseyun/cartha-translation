translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള സ്വപ്നവിവരണശൈലി നിലനിർത്തി. സമാന്തരമായ മൂന്ന് ശാരീരിക വിവരണങ്ങളും വേർതിരിച്ചുപറഞ്ഞു; അവസാനത്തെ എബ്രായ വിലയിരുത്തലിന്റെ വിശാലത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
