  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. എബ്രായത്തിന്റെ ദൃശ്യമായ ‘അപ്പം’ മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചുകൊണ്ട് അതിന്റെ വിശാലമായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
