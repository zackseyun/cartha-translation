  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: ml
  text: യോസേഫ് പറഞ്ഞതുപോലെതന്നെ, ക്ഷാമത്തിന്റെ ഏഴു വർഷങ്ങൾ വന്നുതുടങ്ങി. എല്ലാ ദേശങ്ങളിലും ക്ഷാമമുണ്ടായി; എന്നാൽ ഈജിപ്ത് ദേശത്തെങ്ങും അപ്പം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണമുണ്ടായിരുന്നു”; “അപ്പം” എന്ന എബ്രായപദം വിശാലമായ അർഥത്തിൽ ഭക്ഷണത്തെയോ ആഹാരസാധനങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: വന്നുതുടങ്ങി
  rationale: ആരംഭത്തെയും ‘വരുക’ എന്ന എബ്രായ പ്രയോഗത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: ക്ഷാമത്തിന്റെ ഏഴു വർഷങ്ങൾ
  rationale: എബ്രായത്തിലെ construct ബന്ധം വ്യക്തമായും സ്വാഭാവികമായും പകർത്തുന്നു.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: യോസേഫ് പറഞ്ഞതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന കൃത്യമായ പൊരുത്തം ‘പോലെതന്നെ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: וַיְהִי רָעָב
  choice: ക്ഷാമമുണ്ടായി
  rationale: അസ്തിത്വസൂചകമായ היהയെ മലയാള കഥനശൈലിയിൽ ലളിതവും നേരിട്ടുമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: എല്ലാ ദേശങ്ങളിലും
  rationale: אֲרָצוֹת എന്ന ബഹുവചനത്തിന്റെ വിശാല അർഥം നിലനിർത്തുകയും ആധുനിക രാഷ്ട്രസങ്കൽപ്പം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: എന്നാൽ ഈജിപ്ത് ദേശത്തെങ്ങും
  rationale: וְ ഔപചാരികമായി ‘കൂടാതെ/ഉം’ എന്നായാലും, മുൻവാക്യത്തിലെ ക്ഷാമവും ഈജിപ്തിലെ ലഭ്യതയും തമ്മിലുള്ള വ്യക്തമായ വിരുദ്ധത മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָיָה לָחֶם
  choice: അപ്പമുണ്ടായിരുന്നു
  rationale: לֶחֶם എന്ന മൂർത്തപദത്തിന്റെ ‘അപ്പം’ എന്ന അടിസ്ഥാനാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശാലമായ ‘ഭക്ഷണം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
