id: GEN.41.33
reference: Genesis 41:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: ml
  text: ഇപ്പോൾ ഫറവോൻ വിവേകവും ജ്ഞാനവുമുള്ള ഒരു മനുഷ്യനെ അന്വേഷിച്ച് കണ്ടെത്തി[a] അവനെ ഈജിപ്തുദേശത്തിന്മേൽ നിയമിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോൻ വിവേകവും ജ്ഞാനവുമുള്ള ഒരു മനുഷ്യനെ കാണുകയോ, കണ്ടെത്തുകയോ, തിരഞ്ഞെടുക്കുകയോ ചെയ്യട്ടെ.” സന്ദർഭത്തിൽ എബ്രായ ക്രിയയ്ക്ക് കാണുക, കണ്ടെത്തുക, തിരഞ്ഞെടുക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സ്വപ്നവ്യാഖ്യാനത്തിൽനിന്ന് പ്രായോഗിക ഉപദേശത്തിലേക്കുള്ള യോസേഫിന്റെ മാറ്റം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֵרֶא
  choice: അന്വേഷിച്ച് കണ്ടെത്തട്ടെ
  rationale: ראה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപം ഇവിടെ വെറുതെ കാണുക എന്നതിലുപരി യോഗ്യനായ ആളെ കണ്ടെത്തുകയോ തിരഞ്ഞെടുക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭോചിത അർഥം വഹിക്കുന്നു.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനെ
  rationale: എബ്രായപദം വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; സന്ദർഭത്തിൽ ഒരു പുരുഷ ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָבוֹן
  choice: വിവേകമുള്ള
  rationale: ഭരണപരമായ സന്ദർഭത്തിനു ചേരുന്ന ഉൾക്കാഴ്ചയും കാര്യബോധവും പ്രകടമാക്കുന്നു.
- source_word: וְחָכָם
  choice: ജ്ഞാനമുള്ള
  rationale: നല്ല വിധിനിർണയത്തിനും കാര്യപ്രാപ്തിക്കും ആവശ്യമായ ജ്ഞാനം സൂചിപ്പിക്കുന്നു; വിവേകം എന്നതിനോടൊപ്പം സ്വാഭാവികമായി ചേരുന്നു.
- source_word: וִישִׁיתֵהוּ
  choice: അവനെ ... നിയമിക്കട്ടെ
  rationale: ശാബ്ദികമായി വെക്കുക/സ്ഥാപിക്കുക എന്നാണെങ്കിലും ഭരണാധികാരം ഏൽപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘നിയമിക്കുക’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തിനുമേൽ
  rationale: עַל അധികാരപരിധിയെ സൂചിപ്പിക്കുന്നു; אֶרֶץ מִצְרַיִם എന്ന പദപ്രയോഗത്തിലെ ‘ദേശം’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉപദേശാത്മകമായ ജസ്സീവ് ഭാവം ‘-ട്ടെ’ രൂപത്തിൽ നിലനിർത്തി.
