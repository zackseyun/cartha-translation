  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ സ്ത്രീലിംഗ ബഹുവചന സർവനാമങ്ങൾ മലയാളത്തിൽ ഒരേ രൂപമായതിനാൽ ഉണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ, വിഴുങ്ങപ്പെട്ട നല്ല പശുക്കൾക്ക് ‘അവ’ എന്നും വിഴുങ്ങിയ മെലിഞ്ഞ പശുക്കൾക്ക് ‘ഇവ’ എന്നും ഉപയോഗിച്ചു.
