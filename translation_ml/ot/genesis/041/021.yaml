  text: וַ/תָּבֹ֣אנָה אֶל קִרְבֶּ֗/נָה וְ/לֹ֤א נוֹדַע֙ כִּי בָ֣אוּ אֶל קִרְבֶּ֔/נָה וּ/מַרְאֵי/הֶ֣ן רַ֔ע כַּ/אֲשֶׁ֖ר בַּ/תְּחִלָּ֑ה וָ/אִיקָֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: ml
  text: അവ ഇവയുടെ വയറ്റിനുള്ളിലേക്കു ചെന്നു[a]. എന്നാൽ അവ ഇവയുടെ വയറ്റിനുള്ളിലേക്കു ചെന്നതായി തിരിച്ചറിയാനായില്ല; ഇവയുടെ രൂപം തുടക്കത്തിലേതുപോലെതന്നെ മോശമായിരുന്നു. അപ്പോൾ ഞാൻ ഉണർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവയുടെ അകഭാഗത്തിലേക്ക്’; സ്വപ്നത്തിന്റെ സന്ദർഭത്തിൽ ‘വയറ്റിനുള്ളിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: അവ ... ചെന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ബഹുവചനരൂപം സ്വപ്നവിവരണത്തിലെ തുടർച്ചയായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽ വിഴുങ്ങപ്പെട്ട നല്ല പശുക്കളാണ് ഇവിടെ കർത്താവ്; ലളിതമായ ആഖ്യാനക്രമം നിലനിർത്താൻ ‘ചെന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל קִרְבֶּנָה
  choice: ഇവയുടെ വയറ്റിനുള്ളിലേക്കു
  rationale: קֶרֶב എന്നത് അകഭാഗം/ഉൾഭാഗം എന്നർഥമുള്ളതാണ്. പശുക്കൾ പശുക്കളെ വിഴുങ്ങുന്ന സ്വപ്നസന്ദർഭത്തിൽ ‘വയറ്റിനുള്ളിലേക്ക്’ എന്നത് ദൃശ്യത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘അവ’ വിഴുങ്ങപ്പെട്ട നല്ല പശുക്കളെയും ‘ഇവ’ മെലിഞ്ഞ പശുക്കളെയും സൂചിപ്പിച്ച് മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: וְלֹא נוֹדַע
  choice: എന്നാൽ ... അറിയാനായില്ല
  rationale: ידע എന്ന ക്രിയയുടെ നിഫാൽ രൂപം സംഭവം ദൃശ്യമായി തിരിച്ചറിയാനോ ഗ്രഹിക്കാനോ കഴിഞ്ഞില്ലെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ നിഷ്പക്ഷ പ്രയോഗമാണിത്.
- source_word: כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: അവ വയറ്റിനുള്ളിൽ ചെന്നതായി
  rationale: כִּי അറിയപ്പെടാതിരുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. എബ്രായത്തിലെ ആവർത്തനം പിന്തുടർന്ന് വയറ്റിനുള്ളിൽ ചെന്ന കാര്യം വീണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: וּמַרְאֵיהֶן רַע
  choice: ഇവയുടെ രൂപം ... മോശമായിരുന്നു
  rationale: מַרְאֶה ദൃശ്യരൂപത്തെയും רַע ഇവിടെ മോശമായ രൂപത്തെയും സൂചിപ്പിക്കുന്നു. ‘വിരൂപം’ അല്ലെങ്കിൽ ‘വിരൂപമായിരുന്നു’ എന്ന് കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: തുടക്കത്തിലേതുപോലെതന്നെ
  rationale: ഭക്ഷിച്ചതിനുശേഷമുള്ള രൂപം സ്വപ്നത്തിന്റെ തുടക്കത്തിലെ രൂപവുമായി താരതമ്യം ചെയ്യുന്നതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וָאִיקָץ
  choice: അപ്പോൾ ഞാൻ ഉണർന്നു
  rationale: יקץ എന്ന ക്രിയയുടെ ഒന്നാം പുരുഷ ഏകവചന വയ്യിഖ്തോൽ രൂപം സ്വപ്നവിവരണത്തിന്റെ സമാപനസംഭവം അറിയിക്കുന്നു. ‘അപ്പോൾ’ ആഖ്യാനക്രമം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
