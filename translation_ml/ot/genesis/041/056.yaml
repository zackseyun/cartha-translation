source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: ml
  text: ക്ഷാമം ഭൂമിയിലാകെ[a] വ്യാപിച്ചിരുന്നു. യോസേഫ് എല്ലാ ശേഖരശാലകളും[b] തുറന്ന് ഈജിപ്തുകാർക്കു ധാന്യം വിറ്റു. ഈജിപ്തുദേശത്ത് ക്ഷാമം കൂടുതൽ രൂക്ഷമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഭൂമിയുടെ/ദേശത്തിന്റെ മുഖമെങ്ങും.’ אֶרֶץ എന്ന പദത്തിന് ‘ഭൂമി’ എന്നും ‘ദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘അവയിലുള്ളതെല്ലാം തുറന്നു.’ ‘അവ’ എന്നതിന്റെ മുൻപദം വാചകത്തിൽ വ്യക്തമല്ല; സന്ദർഭത്തിൽ അത് ധാന്യം സൂക്ഷിച്ചിരുന്ന ശേഖരശാലകളെയോ കലവറകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: implicit_antecedent
lexical_decisions:
- source_word: הָרָעָב
  choice: ക്ഷാമം
  rationale: റָעָב കടുത്ത വിശപ്പിനെയോ ക്ഷാമത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ വിവരണസന്ദർഭത്തിൽ പ്രദേശവ്യാപകമായ ഭക്ഷ്യക്ഷാമമാണ് ഉദ്ദേശ്യം.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: ദേശമെങ്ങും
  rationale: പദാനുപദമായി ‘ദേശത്തിന്റെ/ഭൂമിയുടെ മുഖമെങ്ങും’ എന്ന എബ്രായ പ്രയോഗം. ഇവിടെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യാപ്തി വ്യക്തമാക്കാൻ ‘ദേശമെങ്ങും’ എന്നു നൽകി; אֶרֶץ എന്ന പദത്തിന്റെ ‘ദേശം/ഭൂമി’ എന്ന ഇരട്ടസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: ശേഖരശാലകളെല്ലാം തുറന്ന്
  rationale: എബ്രായവാക്യം അർഥലോപമുള്ളതാണ്; സംഭരണസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന മുൻപദം വ്യക്തമല്ല. സന്ദർഭം അനുസരിച്ച് ധാന്യശേഖരങ്ങൾ തുറന്നുവെന്ന അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: ഈജിപ്തുകാർക്കു ധാന്യം വിറ്റു
  rationale: ശׁבר എന്ന ക്രിയ ഈ സന്ദർഭത്തിൽ ധാന്യമോ ഭക്ഷ്യവസ്തുക്കളോ വിൽക്കുക എന്നർഥമുള്ള പ്രയോഗമാണ്. לְמִצְרַיִם ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈജിപ്തുകാർക്ക്’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: ക്ഷാമം അതികഠിനമായി
  rationale: חזק അക്ഷരാർഥത്തിൽ ‘ശക്തമായി’ എന്നാണെങ്കിലും, ക്ഷാമത്തെക്കുറിച്ച് പറയുമ്പോൾ അതിന്റെ തീവ്രത വർധിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: ‘ഈജിപ്തുദേശത്ത്’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ പൂർണരൂപവും ഉല്പത്തി പുസ്തകത്തിന്റെ ആഖ്യാനശൈലിക്കും യോജിച്ചതുമാണ്.
