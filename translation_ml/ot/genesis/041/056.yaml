  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി; ഉറവിടത്തിലെ ‘ദേശം/ഭൂമി’ എന്ന അർഥസാധ്യതയും ‘അവ’ എന്നതിന്റെ അപ്രകടമായ മുൻപദവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
