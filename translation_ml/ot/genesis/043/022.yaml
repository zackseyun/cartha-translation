id: GEN.43.22
reference: Genesis 43:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: ml
  text: ഭക്ഷണം[c] വാങ്ങാൻ വേറെ പണവും[a] ഞങ്ങളുടെ കൈയിൽ[b] കൊണ്ടുവന്നിട്ടുണ്ട്. ഞങ്ങളുടെ പണം ചാക്കുകളിൽ വെച്ചത് ആരാണെന്ന് ഞങ്ങൾക്കറിയില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പണം’ എന്നതിന് പകരം ‘വെള്ളി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം വെള്ളി എന്ന ലോഹത്തെയും നാണയമായി ഉപയോഗിക്കുന്ന പണത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഞങ്ങളുടെ കൈയിൽ’.'
    reason: source_idiom
  - marker: c
    text: ‘ഭക്ഷണം’ എന്നതിന് പകരം ‘ധാന്യം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയാപ്രയോഗം പ്രത്യേകിച്ച് ധാന്യം വാങ്ങുന്നതിനെ സൂചിപ്പിക്കാം, എന്നാൽ അതിന്റെ കർമപദം കൂടുതൽ വിശാലമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף ... כַּסְפֵּ/נוּ
  choice: പണവും ... ഞങ്ങളുടെ പണം
  rationale: כֶּסֶף എന്നത് വെള്ളി എന്ന ലോഹത്തെയും വിനിമയത്തിനുള്ള പണത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ ധാന്യം വാങ്ങാനുള്ള തുകയെക്കുറിച്ചായതിനാൽ ‘പണം’ സാധാരണ മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്; ഒരേ എബ്രായപദത്തിന്റെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തുന്നു.
- source_word: אַחֵר
  choice: വേറെ
  rationale: മുമ്പ് തിരികെ ലഭിച്ച തുകയ്ക്കു പുറമേ കൊണ്ടുവന്ന മറ്റൊരു തുകയാണെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹרַדְנוּ
  choice: കൊണ്ടുവന്നിട്ടുണ്ട്
  rationale: ഹിഫിൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘താഴേക്കു കൊണ്ടുവന്നു’ എന്നാണ്. കനാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള യാത്രയുടെ ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ കൃത്രിമമാകുന്നതിനാൽ, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
- source_word: בְ/יָדֵ/נוּ
  choice: ഞങ്ങൾ കൈയിൽ
  rationale: ‘ഞങ്ങളുടെ കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ കൈ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: ഭക്ഷണം വാങ്ങാൻ
  rationale: שׁבר ഇവിടെ സാധനങ്ങളോ ധാന്യമോ വാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; אֹכֶל എന്ന വിശാലമായ നാമത്തിന് ‘ഭക്ഷണം’ കൃത്യമായ സമതുലിത പദമാണ്.
- source_word: לֹא יָדַעְנוּ
  choice: ഞങ്ങൾക്കറിയില്ല
  rationale: ഭൂതകാലത്തിൽ ആരംഭിച്ച അജ്ഞത ഇപ്പോഴും തുടരുന്ന അവസ്ഥയായി പ്രസംഗസന്ദർഭം അവതരിപ്പിക്കുന്നതിനാൽ വർത്തമാനരൂപം സ്വാഭാവികമാണ്.
- source_word: מִי שָׂם
  choice: വെച്ചത് ആരാണെന്ന്
  rationale: മലയാളത്തിലെ പരോക്ഷചോദ്യത്തിന്റെ സ്വാഭാവിക ക്രമത്തിൽ ‘ആരാണ് വെച്ചത്’ എന്ന അർഥം നൽകുന്നു.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: ഞങ്ങളുടെ ചാക്കുകളിൽ
  rationale: אַמְתַּחַת ധാന്യവും യാത്രാസാധനങ്ങളും വഹിക്കുന്ന ചാക്കിനെയോ സഞ്ചിയെയോ സൂചിപ്പിക്കുന്നു; ഈ കഥാസന്ദർഭത്തിൽ ‘ചാക്ക്’ ഏറ്റവും യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. എബ്രായത്തിലെ ആവർത്തനം ‘പണം’ എന്ന പദത്തിലൂടെ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ രേഖപ്പെടുത്തി.
