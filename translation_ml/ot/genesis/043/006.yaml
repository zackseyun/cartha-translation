translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഇസ്രായേലിന്റെ കുറ്റപ്പെടുത്തലിന്റെ മൂർച്ച നിലനിർത്തിയെങ്കിലും הֲרֵעֹתֶם എന്നത് ധാർമിക ദുഷ്ടതയായി അതിവ്യാഖ്യാനിച്ചിട്ടില്ല; ‘മറ്റൊരു’ എന്ന സന്ദർഭസൂചനയുടെ ഔപചാരിക ബദൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
