  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל לָ/מָ֥ה הֲרֵעֹתֶ֖ם לִ֑/י לְ/הַגִּ֣יד לָ/אִ֔ישׁ הַ/ע֥וֹד לָ/כֶ֖ם אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ പറഞ്ഞു: “നിങ്ങൾക്ക് ഇനിയും മറ്റൊരു സഹോദരൻ[a] ഉണ്ടെന്ന് ആ മനുഷ്യനോടു പറഞ്ഞ് നിങ്ങൾ എനിക്ക് ദോഷം വരുത്തിയത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ ഔപചാരികമായി: “നിങ്ങൾക്ക് ഇനിയും ഒരു സഹോദരൻ ഉണ്ടെന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായ പാഠം ഇവിടെ ‘യാക്കോബ്’ എന്നതിനുപകരം ‘ഇസ്രായേൽ’ എന്ന പേരാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ആഖ്യാതാവിന്റെ നാമതിരഞ്ഞെടുപ്പ് നിലനിർത്തുന്നു.
- source_word: לָמָה
  choice: എന്തിന്
  rationale: കാരണം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הֲרֵעֹתֶם לִי
  choice: നിങ്ങൾ എനിക്ക് ദോഷം വരുത്തിയത്
  rationale: רעע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ദോഷമോ ഹാനിയോ വരുത്തുക എന്ന കാരണാർത്ഥം നൽകുന്നു. സന്ദർഭത്തിൽ ധാർമിക ദുഷ്ടതയെക്കാൾ തനിക്കുണ്ടായ അനർഥത്തെക്കുറിച്ചുള്ള ഇസ്രായേലിന്റെ പരാതിയാണ് ഉദ്ദേശ്യം.
- source_word: לְהַגִּיד
  choice: പറഞ്ഞ്
  rationale: ദോഷം വരുത്തിയ മാർഗമോ സാഹചര്യബന്ധമോ സൂചിപ്പിക്കുന്ന ക്രിയാനാമത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ പൂർവകാല വിനയെച്ചരൂപം വ്യക്തമാക്കുന്നു.
- source_word: לָאִישׁ
  choice: ആ മനുഷ്യനോട്
  rationale: കഥയിൽ മുമ്പേ അറിയപ്പെടുന്ന ഈജിപ്തിലെ അധികാരിയെയാണ് നിർദിഷ്ട പദപ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ മനുഷ്യൻ’ ഈ പരാമർശം സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: הַעוֹד לָכֶם אָח
  choice: നിങ്ങൾക്ക് മറ്റൊരു സഹോദരൻകൂടി ഉണ്ടെന്ന്
  rationale: സഹോദരന്മാർ ഇതിനകം ഉള്ള സാഹചര്യത്തിൽ ഇനിയും ഒരാൾ ഉണ്ടെന്ന ആശയം ‘മറ്റൊരു സഹോദരൻകൂടി’ സ്വാഭാവികമായി നൽകുന്നു. ‘മറ്റൊരു’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള വ്യക്തമാക്കലായതിനാൽ കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
