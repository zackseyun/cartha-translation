id: GEN.43.14
reference: Genesis 43:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: ml
  text: സർവശക്തനായ ദൈവം ആ മനുഷ്യന്റെ മുമ്പാകെ നിങ്ങൾക്കു കരുണ ലഭിക്കുമാറാക്കട്ടെ[a]; അങ്ങനെ അവൻ നിങ്ങളുടെ മറ്റേ സഹോദരനെയും[b] ബെന്യാമീനെയും നിങ്ങൾക്കു മടക്കി അയയ്ക്കട്ടെ. ഞാനോ, എനിക്കു മക്കളെ നഷ്ടപ്പെടേണ്ടിവന്നാൽ, നഷ്ടപ്പെട്ടതുതന്നെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങൾക്കു കരുണ ലഭിക്കുമാറാക്കട്ടെ” എന്നതിന് “നിങ്ങൾക്കു അനുകമ്പ നൽകുമാറാക്കട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം. റഹമീം (רַחֲמִים) എന്ന ഹീബ്രു പദത്തിന് കരുണ, അനുകമ്പ, ആർദ്രദയ എന്നീ അർത്ഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “മറ്റേ സഹോദരൻ” എന്നത് ഈജിപ്തിൽ തടഞ്ഞുവെച്ചിരുന്ന ശിമെയോനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “എനിക്കു മക്കളെ നഷ്ടമായാൽ, നഷ്ടമായതുതന്നെ.” ഒരേ ഹീബ്രു ക്രിയയുടെ ആവർത്തനം യാക്കോബിന്റെ ദുഃഖഭരിതമായ രാജിയെ ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: സർവശക്തനായ ദൈവം
  rationale: ദൈവിക സ്ഥാനപ്പേര് ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥസഹിതമായി പരിഭാഷപ്പെടുത്തി; ആഹ്വാനത്തിലെ ശക്തിയുടെയും അനുഗ്രഹത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: ആ മനുഷ്യന്റെ മുമ്പാകെ നിങ്ങളോടു കരുണ തോന്നുമാറാക്കട്ടെ
  rationale: רַחֲמִים എന്നത് കരുണ, അനുകമ്പ, ആർദ്രദയ എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ദൈവം ആ അധികാരിയിൽ സഹോദരന്മാരോടുള്ള കരുണ ഉളവാക്കണമെന്ന പ്രാർഥനാഭാവമാണ്; לִפְנֵי എന്നതിന്റെ ‘മുമ്പാകെ’ എന്ന രൂപവും സംരക്ഷിച്ചു.
- source_word: וְשִׁלַּח לָכֶם
  choice: നിങ്ങളോടൊപ്പം മടക്കി അയയ്ക്കട്ടെ
  rationale: മുൻപുള്ള ആശംസാപ്രാർഥനയുടെ തുടർച്ചയായി ക്രിയയെ ആശംസാരൂപത്തിൽ നൽകി. സന്ദർഭത്തിൽ തടഞ്ഞുവെച്ച സഹോദരനെ വിട്ടയച്ച് ഇവരോടൊപ്പം തിരിച്ചയയ്ക്കുക എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: നിങ്ങളുടെ മറ്റേ സഹോദരനെ
  rationale: אַחֵר എന്ന വിശേഷണം ‘മറ്റേ’ എന്നു സ്വാഭാവികമായി നൽകി; സന്ദർഭത്തിൽ ഇത് ശിമെയോനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲנִי
  choice: ഞാനോ
  rationale: മുൻനിരയിൽ വന്ന സർവനാമത്തിന്റെ ഊന്നലും യാക്കോബിന്റെ വ്യക്തിപരമായ വിധേയത്വത്തിലേക്കുള്ള ഭാവമാറ്റവും ചുരുക്കമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: മക്കളെ നഷ്ടപ്പെടേണ്ടിവന്നാൽ നഷ്ടപ്പെടട്ടെ
  rationale: שׁכל എന്ന ക്രിയയുടെ ആവർത്തനം പ്രകടിപ്പിക്കുന്ന ദുഃഖഭരിതമായ വിധേയത്വം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നഷ്ടം മക്കളെ സംബന്ധിച്ചതാണെന്ന അർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֵל שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സർവശക്തനായ ദൈവം
  alternative: ഏൽ ശദ്ദായി
  rationale: വ്യക്തിനാമമെന്നതിലുപരി ദൈവിക സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ വായനക്കാർക്ക് അർത്ഥം വ്യക്തമാകുന്ന പരമ്പരാഗത പരിഭാഷ സ്വീകരിച്ചു; ഹീബ്രു പദത്തിന്റെ വ്യുത്പത്തി പൂർണമായി ഉറപ്പില്ലെങ്കിലും സ്ഥാനപ്പേരിന്റെ അംഗീകൃത അർത്ഥപരമ്പര ഇതിനെ പിന്തുണയ്ക്കുന്നു.
- issue: യാക്കോബിന്റെ അവസാന വാക്കിലെ കാലവും ഭാവവും
  choice: മക്കളെ നഷ്ടപ്പെടേണ്ടിവന്നാൽ നഷ്ടപ്പെടട്ടെ
  alternative: മക്കളെ നഷ്ടപ്പെട്ടതുപോലെ ഞാൻ നഷ്ടപ്പെട്ടിരിക്കുന്നു
  rationale: ഹീബ്രു രൂപം അക്ഷരാർഥത്തിൽ വ്യത്യസ്തമായി ഗ്രഹിക്കാവുന്നതാണെങ്കിലും സന്ദർഭവും ആവർത്തനവും ഭാവിയിലെ സാധ്യതയുള്ള നഷ്ടത്തെക്കുറിച്ചുള്ള വിധേയത്വം സൂചിപ്പിക്കുന്നു. അതിനെ നിർണിത പ്രവചനമോ ദൈവനിശ്ചയത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപ്രസ്താവനയോ ആക്കാതെ നിബന്ധനാഭാവത്തിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രാർഥനാഭാവത്തിന് ‘-ട്ടെ’ രൂപവും യാക്കോബിന്റെ ഊന്നലിന് ‘ഞാനോ’ എന്ന രൂപവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
