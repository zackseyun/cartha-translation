revisions:
- from: സർവശക്തനായ ദൈവം ആ മനുഷ്യന്റെ മുമ്പാകെ നിങ്ങളോടു കരുണ തോന്നുമാറാക്കട്ടെ[a]; അങ്ങനെ അവൻ നിങ്ങളുടെ മറ്റേ സഹോദരനെയും[b] ബെന്യാമീനെയും നിങ്ങളോടൊപ്പം മടക്കി അയയ്ക്കട്ടെ. ഞാനോ, മക്കളെ നഷ്ടപ്പെടേണ്ടിവന്നാൽ നഷ്ടപ്പെടട്ടെ[c].
  to: സർവശക്തനായ ദൈവം ആ മനുഷ്യന്റെ മുമ്പാകെ നിങ്ങൾക്കു കരുണ ലഭിക്കുമാറാക്കട്ടെ[a]; അങ്ങനെ അവൻ നിങ്ങളുടെ മറ്റേ സഹോദരനെയും[b] ബെന്യാമീനെയും നിങ്ങൾക്കു മടക്കി അയയ്ക്കട്ടെ. ഞാനോ, എനിക്കു മക്കളെ നഷ്ടപ്പെടേണ്ടിവന്നാൽ, നഷ്ടപ്പെട്ടതുതന്നെ[c].
  rationale: പ്രധാനപാഠം ഹീബ്രുവിലെ ആശംസാരൂപവും ‘നിങ്ങൾക്കു കരുണ’ എന്ന ദാതൃബന്ധവും കൂടുതൽ നേരിട്ടു പ്രതിഫലിപ്പിക്കുന്നവിധം തിരുത്തി. ‘നിങ്ങൾക്കു മടക്കി അയയ്ക്കട്ടെ’ എന്നത് ലാഖേമിന്റെ ‘നിങ്ങൾക്കു/നിങ്ങൾക്കായി’ എന്ന ബന്ധം നിലനിർത്തുകയും ബെന്യാമീനോടു ബന്ധപ്പെടുത്തി അനാവശ്യമായി ‘നിങ്ങളോടൊപ്പം’ എന്നു ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. അവസാനവാക്യത്തിൽ ആവർത്തനത്തിലൂടെ വരുന്ന രാജിഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിച്ചു; ഇത് വിവാദമുള്ള കാല/ഭാവസൂക്ഷ്മതയെ നിർണിത സിദ്ധാന്തവ്യാഖ്യാനമാക്കുന്നില്ല.
