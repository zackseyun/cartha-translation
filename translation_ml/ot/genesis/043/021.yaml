  text: וַֽ/יְהִ֞י כִּי בָ֣אנוּ אֶל הַ/מָּל֗וֹן וַֽ/נִּפְתְּחָ/ה֙ אֶת אַמְתְּחֹתֵ֔י/נוּ וְ/הִנֵּ֤ה כֶֽסֶף אִישׁ֙ בְּ/פִ֣י אַמְתַּחְתּ֔/וֹ כַּסְפֵּ֖/נוּ בְּ/מִשְׁקָל֑/וֹ וַ/נָּ֥שֶׁב אֹת֖/וֹ בְּ/יָדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: ml
  text: ഞങ്ങൾ രാത്രി തങ്ങുന്ന സ്ഥലത്തെത്തി ചാക്കുകൾ തുറന്നപ്പോൾ, അതാ, ഓരോരുത്തരുടെയും വെള്ളി അവനവന്റെ ചാക്കിന്റെ വായിൽ ഉണ്ടായിരുന്നു[a]—ഞങ്ങളുടെ വെള്ളി അതിന്റെ മുഴുവൻ തൂക്കത്തിൽതന്നെ. അതു ഞങ്ങൾ ഞങ്ങളുടെ കൈയിൽ തിരികെ കൊണ്ടുവന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവനവന്റെ ചാക്കിന്റെ വായിൽ.’ അതായത്, ചാക്കിന്റെ തുറവിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: രാത്രി തങ്ങുന്ന സ്ഥലം
  rationale: യാത്രാമധ്യേ രാത്രി കഴിച്ചുകൂട്ടുന്ന സ്ഥലത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക അർഥത്തിലുള്ള വാണിജ്യസത്രമെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַנִּפְתְּחָה
  choice: തുറന്നപ്പോൾ
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള തുടർനടപടി മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: ചാക്കുകൾ / ചാക്ക്
  rationale: ധാന്യമോ യാത്രാസാധനങ്ങളോ വഹിക്കുന്ന ചാക്ക് എന്ന സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അപ്രതീക്ഷിതമായ കണ്ടെത്തലിന്റെ സജീവമായ ആഖ്യാനബലം നിലനിർത്തുന്നു.
- source_word: כֶסֶף אִישׁ
  choice: ഓരോരുത്തന്റെയും വെള്ളി
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥവും כֶסֶף എന്നതിന്റെ ‘വെള്ളി’ എന്ന വ്യക്തമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: അവനവന്റെ ചാക്കിന്റെ വായിൽ
  rationale: പാത്രത്തിന്റെ തുറവിനെ ‘വായ്’ എന്നു വിളിക്കുന്ന എബ്രായ ദൃശ്യരൂപം മലയാളത്തിലും സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: כַּסְפֵּנוּ
  choice: ഞങ്ങളുടെ വെള്ളി
  rationale: ‘പണം’ എന്നു പൊതുവാക്കാതെ മൂലപാഠത്തിലെ വെള്ളി എന്ന പദം നിലനിർത്തുന്നു.
- source_word: בְּמִשְׁקָלוֹ
  choice: തൂക്കത്തിൽ ഒട്ടും കുറവില്ലാതെതന്നെ
  rationale: തൂക്കിയ അതേ മുഴുവൻ അളവും തിരികെ ലഭിച്ചുവെന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וַנָּשֶׁב אֹתוֹ
  choice: അതു ഞങ്ങൾ തിരികെ കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: മുമ്പത്തെ കണ്ടെത്തലിനുശേഷം വെള്ളി ഇപ്പോൾ അവരുടെ കൈവശം കൊണ്ടുവന്നിരിക്കുന്നുവെന്ന നേരിട്ടുള്ള സംഭാഷണസന്ദർഭം മലയാളത്തിലെ പൂർത്തീകൃത വർത്തമാനരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְּיָדֵנוּ
  choice: കൈയിൽ
  rationale: ‘ഞങ്ങളുടെ കൈയിൽ’ എന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി, അവരുടെ കൈവശം തന്നെയുണ്ടെന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘ചാക്കിന്റെ വായ്’, ‘വെള്ളി’ എന്നീ ദൃശ്യവും പദസവിശേഷതയും സംരക്ഷിച്ചിരിക്കുന്നു; എന്നാൽ ‘തൂക്കത്തിൽ’ എന്ന ആശയം വ്യക്തതയ്ക്കായി സ്വാഭാവിക മലയാളത്തിൽ വികസിപ്പിച്ചിരിക്കുന്നു.
