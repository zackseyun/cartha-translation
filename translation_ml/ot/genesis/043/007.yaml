  to: 'അവർ പറഞ്ഞു: “ആ മനുഷ്യൻ ഞങ്ങളെക്കുറിച്ചും ഞങ്ങളുടെ കുടുംബത്തെക്കുറിച്ചും വിശദമായി ചോദിച്ചു: ‘നിങ്ങളുടെ അപ്പൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ? നിങ്ങൾക്ക് മറ്റൊരു സഹോദരനുണ്ടോ?’ ഈ കാര്യങ്ങൾക്കു മറുപടിയായി ഞങ്ങൾ അവനോടു പറഞ്ഞു. ‘നിങ്ങളുടെ സഹോദരനെ താഴേക്കു കൊണ്ടുവരൂ’ എന്ന് അവൻ പറയുമെന്ന് ഞങ്ങൾ എങ്ങനെ അറിയുമായിരുന്നു?”'
