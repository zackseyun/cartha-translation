source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ שָׁא֣וֹל שָֽׁאַל הָ֠/אִישׁ לָ֣/נוּ וּ/לְ/מֽוֹלַדְתֵּ֜/נוּ לֵ/אמֹ֗ר הַ/ע֨וֹד אֲבִי/כֶ֥ם חַי֙ הֲ/יֵ֣שׁ לָ/כֶ֣ם אָ֔ח וַ/נַ֨גֶּד ל֔/וֹ עַל פִּ֖י הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/יָד֣וֹעַ נֵדַ֔ע כִּ֣י יֹאמַ֔ר הוֹרִ֖ידוּ אֶת אֲחִי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ആ മനുഷ്യൻ ഞങ്ങളെക്കുറിച്ചും ഞങ്ങളുടെ കുടുംബത്തെക്കുറിച്ചും വിശദമായി ചോദിച്ചു: ‘നിങ്ങളുടെ അപ്പൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ? നിങ്ങൾക്ക് മറ്റൊരു സഹോദരനുണ്ടോ?’ ഈ കാര്യങ്ങൾക്കു മറുപടിയായി ഞങ്ങൾ അവനോടു പറഞ്ഞു. ‘നിങ്ങളുടെ സഹോദരനെ താഴേക്കു കൊണ്ടുവരൂ’ എന്ന് അവൻ പറയുമെന്ന് ഞങ്ങൾ എങ്ങനെ അറിയുമായിരുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: വിശദമായി ചോദിച്ചു
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനം ചോദ്യംചെയ്യലിന്റെ തീവ്രത ഊന്നിപ്പറയുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘വിശദമായി ചോദിച്ചു’ അത് പ്രകടമാക്കുന്നു.
- source_word: מוֹלַדְתֵּנוּ
  choice: ഞങ്ങളുടെ കുടുംബം
  rationale: ഇവിടെ ജനനം, ബന്ധുക്കൾ, കുടുംബപശ്ചാത്തലം എന്നിവ ഉൾക്കൊള്ളുന്ന അർഥത്തിൽ വരുന്നു; സന്ദർഭത്തിൽ ‘കുടുംബം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: ആ ചോദ്യങ്ങൾക്കനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈ വാക്കുകൾക്കനുസരിച്ച്’; മുൻപുള്ള ചോദ്യംചെയ്യലിനോടുള്ള മറുപടിയാണ് ഉദ്ദേശ്യം, അതിനാൽ മലയാളത്തിൽ സന്ദർഭാർഥം വ്യക്തമാക്കി.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: ഞങ്ങൾ എങ്ങനെ അറിയുമായിരുന്നു?
  rationale: അനന്തക്രിയയും സമാപികക്രിയയും ചേർന്ന ഊന്നൽ അസാധ്യത സൂചിപ്പിക്കുന്ന വാചാടോപചോദ്യമാണ്; മലയാളത്തിലെ ഈ രൂപം അതു നിലനിർത്തുന്നു.
- source_word: הוֹרִידוּ
  choice: ഇവിടെ കൊണ്ടുവരൂ
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘താഴേക്ക് കൊണ്ടുവരുക’; കനാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള ദിശയാണ്. ലക്ഷ്യസ്ഥാനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ഇവിടെ കൊണ്ടുവരൂ’ തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സഹോദരന്മാരുടെ പ്രതിരോധാത്മകമായ വാചാടോപചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി.
