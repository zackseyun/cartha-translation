id: GEN.43.15
reference: Genesis 43:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת הַ/מִּנְחָ֣ה הַ/זֹּ֔את וּ/מִשְׁנֶה כֶּ֛סֶף לָקְח֥וּ בְ/יָדָ֖/ם וְ/אֶת בִּנְיָמִ֑ן וַ/יָּקֻ֨מוּ֙ וַ/יֵּרְד֣וּ מִצְרַ֔יִם וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יוֹסֵֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: ml
  text: അങ്ങനെ ആ പുരുഷന്മാർ ഈ സമ്മാനവും ഇരട്ടി പണവും കൈയിൽ എടുത്തു, ബെന്യാമീനെയും കൂട്ടിക്കൊണ്ടു. പിന്നെ അവർ പുറപ്പെട്ട് ഈജിപ്തിലേക്കു ഇറങ്ങിച്ചെന്ന് യോസേഫിന്റെ മുമ്പിൽ നിന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּנְחָה הַזֹּאת
  choice: ഈ സമ്മാനം
  rationale: ഇവിടെ מִנְחָה ആരാധനാപരമായ യാഗമല്ല; മേലധികാരിയുടെ പ്രസാദം നേടാൻ കൊണ്ടുപോകുന്ന സമ്മാനമാണ്.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: ഇരട്ടിപ്പണം
  rationale: മുമ്പത്തെ തുകയെ അപേക്ഷിച്ച് ഇരട്ടി പണം എന്ന അളവുസൂചന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: כֶּסֶף
  choice: പണം
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘വെള്ളി’ ആണെങ്കിലും, ഈ ഇടപാടുസന്ദർഭത്തിൽ അത് പണമെന്ന അർഥത്തിലാണ്.
- source_word: בְיָדָם
  choice: കൈയിൽ
  rationale: ‘അവരുടെ കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗം കൈവശം വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലും ‘കൈയിൽ’ സ്വാഭാവികമാണ്.
- source_word: וְאֶת־בִּנְיָמִן
  choice: ബെന്യാമീനെയും കൂട്ടിക്കൊണ്ടു
  rationale: ബെന്യാമീൻ ഒരു വസ്തുവെന്ന തോന്നൽ ഒഴിവാക്കി, അതേ לקח ക്രിയയുടെ വ്യക്തിയെ സംബന്ധിച്ച സ്വാഭാവിക മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: וַיָּקֻמוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണത്തിൽ ‘എഴുന്നേറ്റു’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യാർഥമായ ‘പുറപ്പെട്ടു’ സ്വാഭാവികമാണ്; തുടർന്നുള്ള യാത്രാക്രമം വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: ഈജിപ്തിലേക്കു ഇറങ്ങിച്ചെന്നു
  rationale: കനാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള യാത്രയെ ‘ഇറങ്ങുക’ എന്നു പറയുന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ മുമ്പിൽ നിന്നു
  rationale: ഭരണാധികാരിയുടെ സന്നിധിയിൽ ഹാജരായി നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ അവർ സഹോദരന്മാരാണെങ്കിലും, മൂലപാഠം ഉപയോഗിക്കുന്ന ‘പുരുഷന്മാർ’ എന്ന വിശേഷണം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള לקח എന്ന ക്രിയയെ മലയാളത്തിൽ ‘എടുത്തു; ... കൂട്ടിക്കൊണ്ടു’ എന്ന സ്വാഭാവിക വ്യത്യാസത്തോടെ അവതരിപ്പിച്ചു. ‘ഇറങ്ങിച്ചെന്നു’ എന്നത് മൂലത്തിലെ ഭൂമിശാസ്ത്രപരമായ ഭാഷ സംരക്ഷിക്കുന്നു.
