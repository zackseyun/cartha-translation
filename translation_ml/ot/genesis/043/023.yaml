base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിങ്ങൾക്കു സമാധാനം. ഭയപ്പെടേണ്ട. നിങ്ങളുടെ ദൈവവും നിങ്ങളുടെ പിതാവിന്റെ ദൈവവും നിങ്ങളുടെ ചാക്കുകളിൽ ഒരു നിധി[a] തന്നിരിക്കുന്നു. നിങ്ങളുടെ വെള്ളി[b] എന്റെ അടുക്കൽ വന്നു.” പിന്നെ അവൻ ശിമെയോനെ അവരുടെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒളിഞ്ഞ നിധി.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘നിങ്ങളുടെ പണം.’ എബ്രായത്തിൽ ‘വെള്ളി’ എന്ന പദം പലപ്പോഴും പണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: നിങ്ങൾക്കു സമാധാനം
  rationale: ആശ്വാസം നൽകുന്ന അഭിവാദ്യത്തിന്റെ സ്വഭാവവും שָׁלוֹם എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַל תִּירָאוּ
  choice: ഭയപ്പെടേണ്ട
  rationale: നിഷേധാത്മക ആജ്ഞയെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: നിങ്ങളുടെ ദൈവവും നിങ്ങളുടെ പിതാവിന്റെ ദൈവവും
  rationale: ഇവിടെ ദൈവത്തെ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നതും אָבִיכֶם എന്ന ഏകവചനമായ ‘നിങ്ങളുടെ പിതാവ്’ എന്ന രൂപവും കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: נָתַן לָכֶם
  choice: തന്നിരിക്കുന്നു
  rationale: നിധി ഇപ്പോൾ അവരുടെ ചാക്കുകളിൽ ഉള്ളതിന്റെ ഫലാവസ്ഥയും വിശദീകരണഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַטְמוֹן
  choice: ഒരു നിധി
  rationale: ഒളിപ്പിച്ചോ സൂക്ഷിച്ചോ വെച്ച വിലപ്പെട്ട വസ്തു എന്ന ആശയം ‘നിധി’ സ്വാഭാവികമായി നൽകുന്നു; ‘ഒളിഞ്ഞ നിധി’ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: നിങ്ങളുടെ ചാക്കുകളിൽ
  rationale: ധാന്യം കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന ചാക്കുകളുടെ പുരാതന സന്ദർഭത്തിന് യോജിച്ച വ്യക്തമായ പദപ്രയോഗമാണ്.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: നിങ്ങളുടെ വെള്ളി എന്റെ അടുക്കൽ വന്നു
  rationale: כֶּסֶף എന്നതിന്റെ മൂർത്തമായ ‘വെള്ളി’ എന്ന അർഥവും ‘എന്റെ അടുക്കൽ വന്നു’ എന്ന എബ്രായ പ്രയോഗവും വ്യാഖ്യാനിച്ച് മിനുക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: പിന്നെ അവൻ ശിമെയോനെ അവരുടെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന ദിശാസൂചന നിലനിർത്തുകയും തുടർസംഭവം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കാര്യസ്ഥന്റെ വാക്കുകളിൽ ദൈവത്തെക്കുറിച്ചുള്ള പരാമർശം
  choice: സഹോദരന്മാരുടെ ദൈവത്തെയും അവരുടെ പിതാവിന്റെ ദൈവത്തെയും കുറിച്ചുള്ള വാക്കുകളായി നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; കാര്യസ്ഥന്റെ വ്യക്തിപരമായ വിശ്വാസത്തെക്കുറിച്ച് ഒന്നും കൂട്ടിച്ചേർക്കുന്നില്ല.
  alternative: ഇത് വെറും നയതന്ത്രപരമായ അനുകൂലവാക്കുകളായി കാണുക, അല്ലെങ്കിൽ കാര്യസ്ഥന്റെ പൂർണ വിശ്വാസസമ്മതമായി കാണുക.
  rationale: എബ്രായ പാഠം കാര്യസ്ഥന്റെ വാക്കുകൾ രേഖപ്പെടുത്തുന്നു, എന്നാൽ അവന്റെ ഉള്ളിലെ വിശ്വാസത്തെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ ആശ്വാസഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെട്ടിരുന്നില്ല; ഉറവിടപദങ്ങളായ מַטְמוֹן, כֶּסֶף എന്നിവയ്ക്കു പിന്നാലെ യഥാക്രമം [a], [b] ചേർത്തിരിക്കുന്നു.
