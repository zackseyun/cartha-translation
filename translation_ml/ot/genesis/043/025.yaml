translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിന്റെ കാരണം–ഉള്ളടക്കം ബന്ധം നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഭക്ഷണം കഴിക്കുക’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
