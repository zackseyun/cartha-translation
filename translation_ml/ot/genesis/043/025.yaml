  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Joseph came at noon[a], because they had heard that they would eat bread there.
translation:
  language: ml
  text: അവർ ഉച്ചയ്ക്ക് യോസേഫ് വരുന്നതുവരെ ആ സമ്മാനം ഒരുക്കിവെച്ചു; കാരണം, അവിടെവെച്ച് ഭക്ഷണം കഴിക്കുമെന്നു[a] അവർ കേട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അപ്പം കഴിക്കുക’; ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: ഒരുക്കിവെച്ചു
  rationale: כון എന്ന ധാതുവിന്റെ ഹിഫിൽ രൂപം ഇവിടെ ഒരു വസ്തു തയ്യാറാക്കി സജ്ജമാക്കുക എന്നർഥം നൽകുന്നു; ‘ഒരുക്കിവെച്ചു’ എന്നത് വരവിനായി സമ്മാനം തയ്യാറാക്കിയ നിലയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּנְחָה
  choice: ആ സമ്മാനം
  rationale: യോസേഫിനായി സഹോദരന്മാർ കൊണ്ടുവന്ന ഉപഹാരമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആരാധനാപരമായ ‘വഴിപാട്’ എന്ന അർഥമല്ല. മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സമ്മാനത്തെ നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കാൻ ‘ആ’ ചേർത്തു.
- source_word: עַד בּוֹא יוֹסֵף
  choice: യോസേഫ് വരുന്നതുവരെ
  rationale: עַד + infinitive construct യോസേഫിന്റെ വരവ് വരെയുള്ള കാലപരിധി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: בַּצָּהֳרָיִם
  choice: ഉച്ചയ്ക്ക്
  rationale: പദം മധ്യാഹ്നം/ഉച്ചയെ സൂചിപ്പിക്കുന്നു; ആധുനിക സാധാരണ മലയാളത്തിൽ ‘ഉച്ചയ്ക്ക്’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: כִּי שָׁמְעוּ
  choice: കാരണം ... അവർ കേട്ടിരുന്നു
  rationale: ആദ്യ כִּי കാരണസൂചകമാണ്. ഒരുക്കുന്നതിനു മുമ്പേ ലഭിച്ച വിവരമെന്ന ആഖ്യാനക്രമം ‘കേട്ടിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: כִּי שָׁם
  choice: അവിടെവെച്ച് ... എന്ന്
  rationale: രണ്ടാമത്തെ כִּי കേട്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; שָׁם സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക പരോക്ഷവാക്യക്രമമാണ് സ്വീകരിച്ചത്.
- source_word: יֹאכְלוּ לָחֶם
  choice: ഭക്ഷണം കഴിക്കുമെന്ന്
  rationale: അക്ഷരാർഥം ‘അപ്പം കഴിക്കുക’ എന്നാണെങ്കിലും, എബ്രായത്തിൽ ഇത് ഒരു ഭക്ഷണവേള പങ്കിടുക/ഭക്ഷണം കഴിക്കുക എന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ‘അപ്പം കഴിക്കുക’ എന്ന് നൽകിയാൽ അപ്പം മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണയ്ക്കിടയാകാം.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ സ്ഥിരരൂപം.
