id: GEN.43.12
reference: Genesis 43:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: ml
  text: ഇരട്ടി പണം കൈയിൽ എടുത്തുകൊള്ളുവിൻ; നിങ്ങളുടെ ചാക്കുകളുടെ വായിൽ തിരികെ വെക്കപ്പെട്ട പണവും കൈയിൽ തിരികെ കൊണ്ടുപോകുവിൻ. ഒരുപക്ഷേ അതൊരു പിഴവായിരിക്കാം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: ഇരട്ടിപ്പണം
  rationale: מִשְׁנֶה എന്ന പദത്തിന്റെ ഇരട്ട അളവ് എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; മുമ്പത്തെ വിലയുടെ കൃത്യമായ ഇരട്ടിയോ അതിനു തുല്യമായ അധികത്തുകയോ എന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: קְחוּ בְיֶדְכֶם
  choice: കൈയിൽ എടുത്തുകൊള്ളുവിൻ
  rationale: ‘കൈയിൽ’ എന്ന എബ്രായ ദൃശ്യഭാവം നിലനിർത്തുകയും കൊണ്ടുപോകാനുള്ള നിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: തിരികെ വെച്ചിരുന്ന പണം
  rationale: שוב എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലെ നിഷ്ക്രിയഭാവം വ്യക്തമാക്കുന്നു; സഹോദരന്മാർ തന്നെ പണം മടക്കിയെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: നിങ്ങളുടെ ചാക്കുകളുടെ വായിൽ
  rationale: പാത്രത്തിന്റെ തുറപ്പിനെ ‘വായ്’ എന്നു വിളിക്കുന്ന മൂലഭാഷയിലെ സജീവമായ പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: കൈയിൽ കൊണ്ടുപോകുവിൻ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘തിരികെ കൊണ്ടുപോകുക’ എന്ന അർത്ഥം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു; അതോടൊപ്പം ആവർത്തിക്കുന്ന ‘കൈയിൽ’ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: അനിശ്ചിതത്വം മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: מִשְׁגֶּה
  choice: പിഴവ്
  rationale: വഞ്ചനയോ ധാർമിക കുറ്റമോ സൂചിപ്പിക്കാതെ അബദ്ധം/തെറ്റ് എന്ന വാണിജ്യസന്ദർഭത്തിലെ അർത്ഥം നൽകുന്നു.
