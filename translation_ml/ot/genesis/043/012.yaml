translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ വിവരണശൈലി. മൂലത്തിലെ ‘കൈയിൽ’ എന്ന ആവർത്തനവും ‘ചാക്കുകളുടെ വായിൽ’ എന്ന ദൃശ്യപ്രയോഗവും പരമാവധി നിലനിർത്തിയിട്ടുണ്ട്.
