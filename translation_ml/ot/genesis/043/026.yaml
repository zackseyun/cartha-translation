source:
  edition: WLC
  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: ml
  text: യോസേഫ് വീട്ടിനകത്തേക്കു വന്നപ്പോൾ, അവർ തങ്ങളുടെ കൈവശമുണ്ടായിരുന്ന സമ്മാനം വീട്ടിനകത്തേക്കു അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു; പിന്നെ അവർ അവന്റെ മുമ്പിൽ നിലംവരെ കുനിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: വീട്ടിലേക്കു വന്നപ്പോൾ
  rationale: בוא എന്ന ക്രിയയും ദിശാസൂചകമായ ה ചേർന്ന בית എന്ന പദവും ചേർന്ന് വീട്ടിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു. മലയാള ആഖ്യാനത്തിൽ ‘വീട്ടിലേക്കു വന്നപ്പോൾ’ സ്വാഭാവികവും ഉറവിടത്തോട് ചേർന്നതുമാണ്.
- source_word: וַיָּבִיאוּ לוֹ
  choice: കൊണ്ടുവന്ന് അവനു നൽകി
  rationale: Hiphil രൂപമായ בוא ഇവിടെ ‘കൊണ്ടുവരുക’ എന്നാണ്. സന്ദർഭത്തിൽ സമ്മാനം യോസേഫിന്റെ അടുക്കൽ എത്തിച്ചു സമർപ്പിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കൊണ്ടുവന്ന് അവനു നൽകി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַמִּנְחָה
  choice: സമ്മാനം
  rationale: מִנְחָה എന്നതിന് സമ്മാനം, കാഴ്ച, കപ്പം, വഴിപാട് എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ആരാധനാക്രമത്തിലെ വഴിപാടല്ല, യോസേഫിനായി കൊണ്ടുവന്ന നയതന്ത്രപരമായ സമ്മാനമാണ്; അതിനാൽ ‘സമ്മാനം’ ഏറ്റവും വ്യക്തമാണ്.
- source_word: אֲשֶׁר בְּיָדָם
  choice: തങ്ങളുടെ കൈവശമുണ്ടായിരുന്ന
  rationale: അക്ഷരാർഥം ‘അവരുടെ കൈയിൽ ഉണ്ടായിരുന്ന’ എന്നാണ്. ‘കൈവശമുണ്ടായിരുന്ന’ എന്നത് ആ ഹീബ്രു ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: הַבָּיְתָה
  choice: വീട്ടിനകത്തേക്ക്
  rationale: രണ്ടാമത്തെ ദിശാസൂചക രൂപം സമ്മാനം വീടിനകത്തേക്ക് കൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കുന്നു. ആദ്യത്തെ ആവർത്തനവുമായി അർഥവ്യത്യാസം വ്യക്തമാക്കാൻ സ്വാഭാവികമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: അവന്റെ മുമ്പിൽ നിലംവരെ കുനിഞ്ഞു
  rationale: שׁחה എന്ന രൂപം ആദരസൂചകമായി ആഴത്തിൽ കുനിയുന്നതും אָרְצָה നിലത്തേക്കുള്ള ദിശയും സൂചിപ്പിക്കുന്നു. ‘നിലംവരെ കുനിഞ്ഞു’ ശരീരഭാവം വ്യക്തമായി പകരുന്നു; ആരാധന എന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോസേഫിന്റെ മുമ്പിലെ കുനിയലിന്റെ സ്വഭാവം
  choice: ആദരസൂചകമായ ശരീരഭാവമായി ‘അവന്റെ മുമ്പിൽ നിലംവരെ കുനിഞ്ഞു’
  alternative: ‘അവനെ നമസ്കരിച്ചു’
  rationale: ഹീബ്രു പദം സന്ദർഭാനുസരണം ആദരം, കീഴടങ്ങൽ, അല്ലെങ്കിൽ ആരാധന സൂചിപ്പിക്കാം. ഇവിടെ ഭരണാധികാരിയുടെ മുമ്പിലുള്ള ആദരപ്രകടനമാണ്; ‘നമസ്കരിച്ചു’ മതപരമായ അർഥം നിർബന്ധിച്ചേക്കാമെന്നതിനാൽ കൂടുതൽ ദൃശ്യവും നിഷ്പക്ഷവുമായ ഭാഷ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ വീട്ടിലേക്കുള്ള ദിശ രണ്ടിടത്തും നിലനിർത്തി; എന്നാൽ മലയാളത്തിലെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കാൻ ‘വീട്ടിലേക്കു’ എന്നും ‘വീട്ടിനകത്തേക്ക്’ എന്നും വ്യത്യസ്തമായി രൂപപ്പെടുത്തി.
