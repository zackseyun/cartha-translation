  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: ml
  text: ആ മനുഷ്യൻ ആ പുരുഷന്മാരെ[a] യോസേഫിന്റെ വീട്ടിനകത്തേക്കു കൂട്ടിക്കൊണ്ടുവന്നു; അവർക്കു വെള്ളം കൊടുത്തു; അവർ തങ്ങളുടെ കാലുകൾ കഴുകി. പിന്നെ അവൻ അവരുടെ കഴുതകൾക്കു തീറ്റ കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ആ മനുഷ്യൻ’, ‘ആ പുരുഷന്മാർ’ എന്നാണ്. സന്ദർഭത്തിൽ ആ മനുഷ്യൻ യോസേഫിന്റെ ഗൃഹകാര്യസ്ഥനും ആ പുരുഷന്മാർ യോസേഫിന്റെ സഹോദരന്മാരുമാണെന്ന് വ്യക്തമാകുന്നുവെങ്കിലും ഈ വാക്യം അവരെ അങ്ങനെ പ്രത്യേകം തിരിച്ചറിയിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അവരെ വീട്ടിനകത്തേക്കു പ്രവേശിപ്പിച്ച ചലനം സൂചിപ്പിക്കുന്നു. ‘കൂട്ടിക്കൊണ്ടുവന്നു’ എന്നത് ഈ കാരകഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: ആ മനുഷ്യൻ / ആ പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ആദ്യത്തെയാൾ യോസേഫിന്റെ ഗൃഹകാര്യസ്ഥനും മറ്റുള്ളവർ യോസേഫിന്റെ സഹോദരന്മാരുമാണെങ്കിലും, ഈ വാക്യം ഉപയോഗിക്കുന്ന പൊതുവായ പദങ്ങൾ തന്നെയാണ് പരിഭാഷയിൽ നിലനിർത്തിയത്.
- source_word: בֵּיתָה יוֹסֵף
  choice: യോസേഫിന്റെ വീട്ടിനകത്തേക്ക്
  rationale: בֵּיתָה എന്ന രൂപത്തിലെ ദിശാസൂചക പ്രത്യയം വീടിന്റെ അകത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתֶּן מַיִם
  choice: അവർക്കു വെള്ളം കൊടുത്തു
  rationale: ‘അവർക്ക്’ എന്ന പരോക്ഷകർമം ഹീബ്രുവിൽ പ്രകടമല്ലെങ്കിലും സന്ദർഭത്തിൽ വ്യക്തമാണ്; സ്വാഭാവിക മലയാളത്തിനായി അത് ചേർത്തിരിക്കുന്നു.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: അവർ തങ്ങളുടെ കാലുകൾ കഴുകി
  rationale: ക്രിയ സജീവ ബഹുവചനത്തിലാണ്. അതിനാൽ ആതിഥ്യമര്യാദയുടെ പശ്ചാത്തലം കണക്കിലെടുത്ത് കർമണി പ്രയോഗമാക്കാതെ, അവർ തന്നെയാണ് കാലുകൾ കഴുകിയതെന്ന വ്യാകരണരൂപം നിലനിർത്തി.
- source_word: מִסְפּוֹא
  choice: തീറ്റ
  rationale: മൃഗങ്ങൾക്കുള്ള ആഹാരത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘തീറ്റ’ ആ അർഥം നൽകുന്ന സാധാരണ ആധുനിക മലയാളപദമാണ്.
- source_word: לַחֲמֹרֵיהֶם
  choice: അവരുടെ കഴുതകൾക്കു
  rationale: לְ എന്ന ഉപസർഗം തീറ്റ ലഭിക്കുന്ന മൃഗങ്ങളെ പരോക്ഷകർമമായി അടയാളപ്പെടുത്തുന്നു.
