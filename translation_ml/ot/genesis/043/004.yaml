lexical_decisions:
- source_word: אִם
  choice: എങ്കിൽ
  rationale: നിബന്ധന അവതരിപ്പിക്കുന്ന എബ്രായ കണികയുടെ സ്വാഭാവികവും ഊന്നൽ കൂട്ടാത്തതുമായ മലയാള പരിഭാഷ.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: അയയ്ക്കുമെങ്കിൽ
  rationale: יֵשׁ, രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം, കർത്തൃവാചക ക്രിയാനാമം എന്നിവ ചേർന്ന പ്രയോഗം അയയ്ക്കാനുള്ള സന്നദ്ധതയെയോ അയയ്ക്കുന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപം ഉപയോഗിച്ച് അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת אָחִינוּ
  choice: ഞങ്ങളുടെ സഹോദരനെ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ നാമത്തിന്റെ കുടുംബബന്ധപരമായ ഊന്നൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אִתָּנוּ
  choice: ഞങ്ങളോടൊപ്പം
  rationale: ബെന്യാമീൻ അവരോടുകൂടെ യാത്ര ചെയ്യണമെന്ന സഹയാത്രയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: נֵרְדָה
  choice: ഞങ്ങൾ ഇറങ്ങിച്ചെന്ന്
  rationale: ഒന്നാംപുരുഷ ബഹുവചന cohortative രൂപം നിബന്ധന നിറവേറിയാൽ അവർ സ്വീകരിക്കുന്ന ഉദ്ദേശ്യപ്പെട്ട നടപടിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ ‘ഇറങ്ങുക’ നിലനിർത്തുന്നു.
- source_word: וְנִשְׁבְּרָה
  choice: വാങ്ങിക്കൊണ്ടുവരാം
  rationale: ഈ സാധനശേഖരണസന്ദർഭത്തിൽ שׁבר എന്ന ക്രിയയ്ക്ക് ‘വാങ്ങുക’ എന്ന അർഥമാണ്. മലയാളത്തിൽ യാത്രയുടെ ഉദ്ദേശ്യവും ഫലവും സ്വാഭാവികമായി അറിയിക്കാൻ ‘വാങ്ങിക്കൊണ്ടുവരാം’ ഉപയോഗിച്ചു.
- source_word: לְךָ
  choice: അങ്ങേക്കുവേണ്ടി
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നു. പിതാവിനോടുള്ള സംഭാഷണത്തിന് യോജിച്ച ആദരസൂചക രൂപം ഉപയോഗിച്ചു.
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: സന്ദർഭം ധാന്യത്തെക്കുറിച്ചാണെങ്കിലും മൂലപദം പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ അതിനെ അനാവശ്യമായി ‘ധാന്യം’ എന്നു ചുരുക്കുന്നില്ല.
