  yaml_path: translation/ot/genesis/043/004.yaml
  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: ml
  text: “ഞങ്ങളുടെ സഹോദരനെ ഞങ്ങളോടൊപ്പം അയയ്ക്കുമെങ്കിൽ[a], ഞങ്ങൾ ഇറങ്ങിച്ചെന്ന് അങ്ങേക്കുവേണ്ടി ഭക്ഷണം വാങ്ങാം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞങ്ങളുടെ സഹോദരനെ ഞങ്ങളോടൊപ്പം അയയ്ക്കാൻ അങ്ങേക്കു സമ്മതമാണെങ്കിൽ.” יֵשׁ എന്ന പദവും കർത്തൃവാചക ക്രിയാനാമവും ചേർന്ന എബ്രായ പ്രയോഗം സന്നദ്ധതയെയോ അയയ്ക്കുന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം.'
