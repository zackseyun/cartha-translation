translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. യെഹൂദാ പിതാവിനോടു സംസാരിക്കുന്നതിനാൽ ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം സ്വീകരിച്ചു. മുഖ്യവാചകത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
