  naturalness: ‘ആദ്യജാതൻ’ സ്വാഭാവികമായ ബൈബിൾ-രജിസ്റ്ററിലുള്ള പദമാണ്; എന്നാൽ ഈ പ്രത്യേക ഇരിപ്പിടവിവരണത്തിൽ ‘മൂത്തവൻ’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ആ പുരുഷന്മാർ’ മൂലപാഠത്തോട് ചേർന്നുനിൽക്കുന്നു, പക്ഷേ മലയാള ആഖ്യാനത്തിൽ ‘ആ മനുഷ്യർ’ കുറച്ച് കൂടുതൽ സാധാരണമാണ്; എന്നിരുന്നാലും ‘പുരുഷന്മാർ’ തെറ്റല്ല. ‘ആശ്ചര്യത്തോടെ പരസ്പരം നോക്കി’ സ്വാഭാവികമാണ്.
  terminology: בכור/בכורהയുടെ ജനന-സ്ഥാനബന്ധം ‘മൂത്തവൻ ... മൂപ്പനുസരിച്ച്’ എന്നതിലൂടെ ഈ സന്ദർഭത്തിൽ വ്യക്തമായി വരുന്നു; നിയമപരമായ ‘ജന്മാവകാശം’ എന്ന അർഥം മുഖ്യവാക്യത്തിൽ കൊണ്ടുവരേണ്ടതില്ല. צעיר/צעירהയുടെ സമാന്തരം ‘ഇളയവൻ ... ഇളമനുസരിച്ച്’ എന്നതിലൂടെ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് a-യിൽ ‘ആദ്യജാതസ്ഥാനമനുസരിച്ച്’ എന്ന വ്യാഖ്യാനം സുരക്ഷിതമായ ബദലാണ്, എന്നാൽ ‘യഥാക്രമം’ എന്ന ഘടകം ഉൾപ്പെടുത്തുന്നത് ഇരുത്തൽക്രമം വ്യക്തമാക്കും.
