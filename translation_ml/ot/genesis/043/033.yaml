  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: ml
  text: അവർ അവന്റെ മുമ്പിൽ ഇരുന്നു—മൂത്തവൻ തന്റെ മൂപ്പനുസരിച്ചും ഇളയവൻ തന്റെ ഇളമനുസരിച്ചും.[a] ആ പുരുഷന്മാർ ആശ്ചര്യത്തോടെ പരസ്പരം നോക്കി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂത്തവൻ തന്റെ ജനനസ്ഥാനമനുസരിച്ചും ഇളയവൻ തന്റെ ഇളമനുസരിച്ചും.” ഇരിപ്പിടക്രമം വിവരിക്കുമ്പോൾ എബ്രായപാഠം മൂത്തവന്റെ ജനനസ്ഥാനത്തെയും ഇളയവന്റെ ഇളമയെയും സമാന്തരമായി ചേർക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ആ പുരുഷന്മാർ പരസ്പരം കണ്ട് അതിശയിച്ചു.” എബ്രായക്രിയ വിസ്മയത്തെ സൂചിപ്പിക്കുന്നു; “ഓരോരുത്തൻ തന്റെ കൂട്ടുകാരന്റെ നേരെ” എന്ന പ്രയോഗത്തിൽ പരസ്പരപ്രതികരണം അടങ്ങിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: അവർ ... ഇരുന്നു
  rationale: ישׁב എന്ന ക്രിയയുടെ സജീവ ആഖ്യാനരൂപം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭം ഇരിപ്പിടങ്ങൾ ക്രമീകരിക്കപ്പെട്ടതായി സൂചിപ്പിച്ചാലും എബ്രായരൂപം കർമണിയല്ല.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ
  rationale: യോസേഫിനോടുള്ള സ്ഥാനബന്ധം സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: ആദ്യജാതൻ തന്റെ ജനനക്രമമനുസരിച്ച്
  rationale: בכור എന്നതിലെ ആദ്യജാതസ്ഥാനവും בכורה എന്നതിലെ ജനനമുൻഗണനയും സൂക്ഷിക്കുന്നു; ഈ ഇരിപ്പിടസന്ദർഭത്തിൽ പ്രായോഗിക അർഥം ജനനക്രമമാണ്.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: ഇളയവൻ തന്റെ പ്രായക്രമമനുസരിച്ച്
  rationale: ആദ്യജാതനിൽനിന്ന് ഏറ്റവും ഇളയവനിലേക്കുള്ള ആപേക്ഷിക പ്രായക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പദശഃ ഉള്ള ‘യൗവനം/ഇളമ’ എന്ന ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתְמְהוּ
  choice: ആശ്ചര്യത്തോടെ ... നോക്കി
  rationale: תמה സൂചിപ്പിക്കുന്ന വിസ്മയം നിലനിർത്തുകയും തുടർന്നുള്ള പരസ്പരപ്രയോഗത്തിന്റെ ദൃശ്യമായ പ്രതികരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ അവർ യോസേഫിന്റെ സഹോദരന്മാരാണെങ്കിലും മൂലപാഠത്തിലെ ‘പുരുഷന്മാർ’ എന്ന പരാമർശം സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: പരസ്പരം
  rationale: ‘ഓരോരുത്തൻ തന്റെ കൂട്ടുകാരന്റെ നേരെ’ എന്ന എബ്രായ പരസ്പരപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
