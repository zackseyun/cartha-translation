  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ആദ്യജാതൻ’ എന്നത് ജനനസ്ഥാനത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു; ‘പ്രായക്രമം’ ഇരിപ്പിടക്രമത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
