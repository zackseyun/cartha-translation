source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר יוֹסֵ֗ף כִּֽי נִכְמְר֤וּ רַחֲמָי/ו֙ אֶל אָחִ֔י/ו וַ/יְבַקֵּ֖שׁ לִ/בְכּ֑וֹת וַ/יָּבֹ֥א הַ/חַ֖דְרָ/ה וַ/יֵּ֥בְךְּ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: ml
  text: അപ്പോൾ യോസേഫ് വേഗപ്പെട്ടു[a]; തന്റെ സഹോദരനോടുള്ള വാത്സല്യം അദ്ദേഹത്തിന്റെ ഉള്ളിൽ പൊങ്ങിവന്നതിനാൽ, കരയാൻ അദ്ദേഹം ഒരു സ്ഥലം തേടി[b]. അദ്ദേഹം മുറിയിൽ കടന്ന് അവിടെ കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വേഗപ്പെട്ടു’ അല്ലെങ്കിൽ ‘തിടുക്കപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘കരയാൻ തേടി.’ സന്ദർഭത്തിൽ കരയാൻ ഒരു സ്വകാര്യസ്ഥലം തേടിയെന്ന ആശയം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: വേഗത്തിൽ അവിടെനിന്നു മാറി
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വേഗപ്പെട്ടു’ എന്നാണ്. തുടർന്നുള്ള സന്ദർഭത്തിൽ സ്വകാര്യ മുറിയിലേക്കുള്ള പെട്ടെന്നുള്ള പിന്മാറ്റം സൂചിപ്പിക്കപ്പെടുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘അവിടെനിന്നു മാറി’ എന്നു വ്യക്തമാക്കി; ഈ സന്ദർഭപൂരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: വാത്സല്യം ഉള്ളിൽ തിങ്ങിവന്നു
  rationale: ‘കരുണകൾ/അന്തരംഗം ചൂടുപിടിച്ചു, ഇളകി’ എന്ന എബ്രായ ശാരീരിക വികാരപ്രയോഗത്തിന്റെ തീവ്രതയും സ്നേഹാർദ്രതയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: אֶל אָחִיו
  choice: സഹോദരനോടുള്ള
  rationale: വികാരത്തിന്റെ ദിശയെയും വിഷയത്തെയും സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ബെന്യാമീൻ’ എന്ന പേര് ചേർത്തിട്ടില്ല.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: കരയാൻ ഒരിടം തേടി
  rationale: അക്ഷരാർഥം ‘കരയാൻ അന്വേഷിച്ചു/തേടി’ എന്നാണ്. സ്വകാര്യതയ്ക്കായി മുറിയിൽ കടക്കുന്നതെന്ന സന്ദർഭത്തിൽ അന്വേഷിച്ചതിന്റെ സൂചിതമായ ലക്ഷ്യം ‘ഒരിടം’ എന്നു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הַחַדְרָה
  choice: മുറിയിൽ
  rationale: ഹീബ്രു നാമം ഒരു മുറിയെയോ അകത്തെ അറയെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം തിരഞ്ഞെടുത്തു.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: അവിടെവെച്ചു കരഞ്ഞു
  rationale: കരയുക എന്ന ക്രിയയും שָׁמָּה എന്ന സ്ഥലസൂചനയുടെ ഊന്നലും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വികാരപ്രയോഗം യാന്ത്രികമായ ശരീരഭാഷയായി മാറ്റാതെ അതിന്റെ തീവ്രത സംരക്ഷിച്ചു; സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയ ഘടകങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
