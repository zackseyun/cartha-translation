  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אֲחִי/כֶ֖ם קָ֑חוּ וְ/ק֖וּמוּ שׁ֥וּבוּ אֶל הָ/אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: ml
  text: നിങ്ങളുടെ സഹോദരനെയും കൂട്ടിക്കൊണ്ട്[a] എഴുന്നേറ്റ് ആ മനുഷ്യന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെല്ലുവിൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ സഹോദരൻ’; സന്ദർഭത്തിൽ ഇത് ബെന്യാമീനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
  - marker: b
    text: 'അഥവാ: ‘എഴുന്നേൽക്കുവിൻ; ആ മനുഷ്യന്റെ അടുക്കലേക്കു മടങ്ങുവിൻ.’'
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם קָחוּ
  choice: നിങ്ങളുടെ സഹോദരനെയും കൂട്ടിക്കൊണ്ട്
  rationale: വസ്തുസൂചകമായ אֵת മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. וְ യുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-നെയും’ കൊണ്ടും, לקח എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ‘കൂടെ കൊണ്ടുപോകുക’ എന്ന അർഥം ‘കൂട്ടിക്കൊണ്ട്’ കൊണ്ടും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֲחִי/כֶם
  choice: നിങ്ങളുടെ സഹോദരൻ
  rationale: എബ്രായപാഠം പേര് ചേർക്കാതെ ‘നിങ്ങളുടെ സഹോദരൻ’ എന്നു മാത്രമാണ് പറയുന്നത്. സന്ദർഭത്തിൽ ബെന്യാമീനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ആ പേര് മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְ/ק֖וּמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ബഹുവചന കല്പനയുടെ അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള യാത്രാകല്പനയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: שׁ֥וּבוּ
  choice: മടങ്ങിച്ചെല്ലുവിൻ
  rationale: שוב ഇവിടെ യാത്രാസന്ദർഭത്തിൽ ‘തിരികെ പോകുക/മടങ്ങുക’ എന്നാണ്. ‘മടങ്ങിച്ചെല്ലുവിൻ’ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തിരിച്ചുപോക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֶל הָ/אִישׁ
  choice: ആ മനുഷ്യന്റെ അടുക്കലേക്ക്
  rationale: אֶל എന്നത് ലക്ഷ്യദിശയും הָאִישׁ സന്ദർഭത്തിൽ നേരത്തേ പരാമർശിക്കപ്പെട്ട മനുഷ്യനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആ മനുഷ്യന്റെ അടുക്കലേക്ക്’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബഹുവചന കല്പനയ്ക്ക് ബൈബിൾ ഗദ്യത്തിൽ പരിചിതമായ ‘-വിൻ’ രൂപം നിലനിർത്തി; എബ്രായത്തിലെ തുടർച്ചയായ കല്പനകൾ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി അവതരിപ്പിച്ചു.
