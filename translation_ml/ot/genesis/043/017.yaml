source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/אִ֔ישׁ כַּֽ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֥יתָ/ה יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: ml
  text: അങ്ങനെ ആ മനുഷ്യൻ യോസേഫ് പറഞ്ഞതുപോലെ ചെയ്തു; ആ മനുഷ്യൻ ആ പുരുഷന്മാരെ യോസേഫിന്റെ വീട്ടിലേക്കു കൊണ്ടുചെന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആ പുരുഷന്മാരെ യോസേഫിന്റെ വീട്ടിലേക്കു നയിച്ചു.”
    reason: വַיָּבֵא എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ‘കൊണ്ടുചെന്നു’ എന്നതിനോടൊപ്പം ‘നയിച്ചു’ എന്ന വിവർത്തനസാധ്യതയും ഉണ്ട്.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയ ഇവിടെ ഒരു നിർദേശം അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞതുപോലെ ചെയ്തു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: എബ്രായപാഠം അയാളുടെ ഔദ്യോഗിക സ്ഥാനം വ്യക്തമാക്കാതെ ‘ആ മനുഷ്യൻ’ എന്നു മാത്രമാണ് പറയുന്നത്; ‘കാര്യസ്ഥൻ’ എന്ന വ്യാഖ്യാനം ചേർക്കാതിരിക്കാൻ ഇതു നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: യോസേഫ് പറഞ്ഞതുപോലെ
  rationale: യോസേഫിന്റെ നിർദേശത്തോടുള്ള അനുസരണമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּבֵא
  choice: കൊണ്ടുചെന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്ന കാരണാർഥമുണ്ട്. വിവരണത്തിന്റെ ദൃഷ്ടികോണത്തിൽ യോസേഫിന്റെ വീട്ടിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കാൻ ‘കൊണ്ടുചെന്നു’ സ്വാഭാവികമാണ്.
- source_word: הָאֲנָשִׁים
  choice: അവരെ
  rationale: എബ്രായത്തിൽ ‘ആ പുരുഷന്മാർ’ എന്നാണ്; എന്നാൽ തൊട്ടുമുമ്പത്തെ വാക്യങ്ങളിൽ വ്യക്തമായിരിക്കുന്ന സംഘത്തെ മലയാളത്തിൽ വീണ്ടും ‘ആ പുരുഷന്മാരെ’ എന്നു പറയുന്നതിനെക്കാൾ ‘അവരെ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്, സഹോദരന്മാർ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നുമില്ല.
- source_word: בֵּיתָה יוֹסֵף
  choice: യോസേഫിന്റെ വീട്ടിലേക്കു
  rationale: בֵּיתָהയിലെ ദിശാസൂചകമായ -ה വീടിന്റെ ദിശയിലേക്കുള്ള നീക്കത്തെ വ്യക്തമാക്കുന്നു. ‘വീട്ടിലേക്കു’ ഈ അർഥം കൃത്യമായി നിലനിർത്തുന്നു; പ്രവേശനം നിർബന്ധമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
