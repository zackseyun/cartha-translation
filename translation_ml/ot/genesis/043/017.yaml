  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ‘ആ മനുഷ്യൻ’ എന്ന ആവർത്തനം ഭാഗികമായി നിലനിർത്തിയിട്ടുണ്ട്; രണ്ടാമത്തെ ‘ആ പുരുഷന്മാരെ’ സ്വാഭാവികമായ ‘അവരെ’ എന്നാക്കി. ഈ വാക്യത്തിന് അനിവാര്യമായ പാഠഭേദമോ ദൈവശാസ്ത്രപരമായ വിശദീകരണകുറിപ്പോ ഇല്ല.
