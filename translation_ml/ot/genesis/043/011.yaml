source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവരുടെ അപ്പനായ ഇസ്രായേൽ അവരോടു പറഞ്ഞു: “അങ്ങനെയേ പറ്റൂ എങ്കിൽ, ഇതു ചെയ്യുക: ദേശത്തിലെ വിശിഷ്ട ഉൽപ്പന്നങ്ങളിൽനിന്ന്[a] കുറച്ച് നിങ്ങളുടെ പാത്രങ്ങളിൽ എടുത്ത് ആ മനുഷ്യന് സമ്മാനമായി താഴേക്കു കൊണ്ടുപോകുക—കുറച്ച് ഔഷധക്കറ, കുറച്ച് തേൻ[b], സുഗന്ധപ്പശയും മൂറും[c], പിസ്താക്കുരുവും ബദാമും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദേശത്തിലെ ഏറ്റവും നല്ല ഉൽപ്പന്നങ്ങളിൽനിന്ന്” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം പഴങ്ങൾ മാത്രമല്ല, ദേശത്തിലെ വിശിഷ്ട ഉൽപ്പന്നങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “തേൻ” എന്ന പദം ചില സന്ദർഭങ്ങളിൽ തേനീച്ചത്തേനിനു പകരം പഴച്ചാറിൽനിന്നുള്ള മധുരസിറപ്പിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “സുഗന്ധപ്പശ”, “മൂർ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു പദങ്ങൾ സൂചിപ്പിക്കുന്ന വസ്തുക്കളുടെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; ട്രാഗാകാന്ത് പശ, ലാദനം തുടങ്ങിയ വിവിധ സുഗന്ധസസ്യക്കറകൾ നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: അവരുടെ അപ്പനായ ഇസ്രായേൽ
  rationale: ‘ഇസ്രായേൽ’ എന്ന ആഖ്യാനനാമവും ‘അവരുടെ അപ്പൻ’ എന്ന സമാനാധികരണബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִם כֵּן אֵפוֹא
  choice: അങ്ങനെയേ പറ്റൂ എങ്കിൽ
  rationale: സാഹചര്യത്തിനു വഴങ്ങുന്ന മനസ്സില്ലാത്ത സമ്മതമാണ് ഈ പ്രയോഗത്തിൽ; വെറും ‘അങ്ങനെയെങ്കിൽ’ എന്നതിനെക്കാൾ അതിന്റെ ഭാവം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: זֹאת עֲשׂוּ
  choice: ഇതു ചെയ്യുക
  rationale: ഹീബ്രു കല്പനയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ രൂപം നിലനിർത്തുന്നു.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: ദേശത്തിലെ വിശിഷ്ട വിളവിൽനിന്ന് കുറച്ച്
  rationale: പഴങ്ങൾ മാത്രമല്ല, ദേശത്തിന്റെ തിരഞ്ഞെടുത്തതോ വിലയേറിയതോ ആയ ഉൽപ്പന്നങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: בִּכְלֵיכֶם
  choice: നിങ്ങളുടെ പാത്രങ്ങളിൽ
  rationale: ഏതു തരത്തിലുള്ള സഞ്ചിയോ പാത്രമോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ പദം ഉപയോഗിക്കുന്നു.
- source_word: וְהוֹרִידוּ לָאִישׁ
  choice: ആ മനുഷ്യന്റെ അടുക്കലേക്ക് ... കൊണ്ടുപോകുക
  rationale: ഈജിപ്തിലേക്കുള്ള യാത്രയെ ഹീബ്രു ‘താഴേക്കു കൊണ്ടുപോകുക’ എന്നു ഭൂമിശാസ്ത്രപരമായി ചിത്രീകരിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യഗതി ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: מִנְחָה
  choice: സമ്മാനമായി
  rationale: ഇവിടെ ആരാധനാപരമായ വഴിപാടല്ല, അനുകൂലത നേടാൻ കൊണ്ടുപോകുന്ന സമ്മാനമാണ് ഉദ്ദേശ്യം.
- source_word: מְעַט צֳרִי
  choice: കുറച്ച് ഔഷധക്കറ
  rationale: ചികിത്സയ്ക്കോ സുഗന്ധത്തിനോ ഉപയോഗിച്ചിരുന്ന ബാൽസംപോലുള്ള സസ്യക്കറയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് അർത്ഥഗ്രാഹ്യമായ വിവരണപദം തിരഞ്ഞെടുത്തു.
- source_word: וּמְעַט דְּבַשׁ
  choice: കുറച്ച് തേൻ
  rationale: דְּבַשׁ എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥം ‘തേൻ’ ആണ്; മധുരസിറപ്പാകാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נְכֹאת וָלֹט
  choice: സുഗന്ധപ്പശയും മൂറും
  rationale: രണ്ടും സുഗന്ധമുള്ള സസ്യക്കറകളായി മനസ്സിലാക്കപ്പെടുന്നു; കൃത്യമായ സസ്യതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ പരിചിതവും പൊതുവുമായ പദങ്ങൾ നൽകി അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: പിസ്താക്കുരുവും ബദാമും
  rationale: സസ്യോൽപ്പന്നങ്ങളുടെ അംഗീകരിക്കപ്പെട്ട തിരിച്ചറിയൽ വ്യക്തവും ആധുനിക മലയാളത്തിൽ സാധാരണവുമായ പേരുകളിൽ നൽകുന്നു.
