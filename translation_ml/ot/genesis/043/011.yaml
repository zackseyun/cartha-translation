  revision_rationale: ‘വിളവ്’ എന്ന ഏകവചനവും കൃഷിവിളവിലേക്കു ചുരുങ്ങാവുന്ന അർത്ഥവും ഒഴിവാക്കി, മൂലപാഠത്തിലെ വിശാലമായ ‘തിരഞ്ഞെടുക്കപ്പെട്ട ദേശോൽപ്പന്നങ്ങൾ’ എന്ന ആശയം നിലനിർത്തി. കൂടാതെ ഹീബ്രുവിലെ താഴോട്ടുള്ള യാത്രാസൂചന വ്യക്തമായി ചേർത്തു. മറ്റെല്ലാ പദങ്ങളും അടിക്കുറിപ്പുകളും മൂലപാഠത്തിലെ സസ്യ-റെസിൻ തിരിച്ചറിയലുകളുടെ അനിശ്ചിതത്വം യഥോചിതമായി സംരക്ഷിക്കുന്നു.
