  terminology: ‘സമ്മാനം’, ‘തേൻ’, ‘സുഗന്ധപ്പശ’, ‘മൂർ’, ‘പിസ്താക്കുരു’, ‘ബദാം’ എന്നിവ യോജിച്ചതാണ്. ഔഷധക്കറ എന്നത് צֳרִיയുടെ പൊതുവായ ബാൽസം/റെസിൻ സ്വഭാവം അറിയിക്കുന്നു; കൃത്യതിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
