  revised_text: 'അപ്പോൾ അവരുടെ അപ്പനായ ഇസ്രായേൽ അവരോടു പറഞ്ഞു: “അങ്ങനെയേ പറ്റൂ എങ്കിൽ, ഇതു ചെയ്യുക: ദേശത്തിലെ വിശിഷ്ട ഉൽപ്പന്നങ്ങളിൽനിന്ന്[a] കുറച്ച് നിങ്ങളുടെ പാത്രങ്ങളിൽ എടുത്ത് ആ മനുഷ്യന് സമ്മാനമായി താഴേക്കു കൊണ്ടുപോകുക—കുറച്ച് ഔഷധക്കറ, കുറച്ച് തേൻ[b], സുഗന്ധപ്പശയും മൂറും[c], പിസ്താക്കുരുവും ബദാമും.”'
