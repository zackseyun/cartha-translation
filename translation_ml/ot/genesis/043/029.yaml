  to: 'അവൻ കണ്ണുകൾ ഉയർത്തി തന്റെ സഹോദരനും തന്റെ അമ്മയുടെ മകനുമായ ബെന്യാമീനെ കണ്ടു; അവൻ പറഞ്ഞു: “നിങ്ങൾ എന്നോടു പറഞ്ഞ നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരൻ ഇവനാണോ?” പിന്നെ അവൻ പറഞ്ഞു: “എന്റെ മകനേ, ദൈവം നിന്നോടു കൃപ കാണിക്കട്ടെ.”'
  rationale: പരിഷ്കരണം അർഥം മാറ്റുന്നില്ല. ‘കണ്ണുകൾ ഉയർത്തി’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘തന്റെ സഹോദരനും തന്റെ അമ്മയുടെ മകനുമായ’ എന്നത് ബെന്യാമീൻ യോസേഫിന്റെ അതേ അമ്മയിൽ ജനിച്ച സഹോദരനാണെന്ന ഊന്നൽ വ്യാഖ്യാനചുരുക്കമില്ലാതെ വ്യക്തമാക്കുന്നു. ‘ഏറ്റവും ഇളയ’ എന്നത് സന്ദർഭത്തിലെ superlative അർഥം കൃത്യമായി നൽകുന്നു. ഈ വിശദീകരണം മുഖ്യപാഠത്തിലായതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
