reference: Genesis 43:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֞רְא אֶת בִּנְיָמִ֣ין אָחִי/ו֮ בֶּן אִמּ/וֹ֒ וַ/יֹּ֗אמֶר הֲ/זֶה֙ אֲחִי/כֶ֣ם הַ/קָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑/י וַ/יֹּאמַ֕ר אֱלֹהִ֥ים יָחְנְ/ךָ֖ בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: ml
  text: 'അവൻ കണ്ണുകൾ ഉയർത്തി തന്റെ സഹോദരനും തന്റെ അമ്മയുടെ മകനുമായ ബെന്യാമീനെ കണ്ടു; അവൻ പറഞ്ഞു: “നിങ്ങൾ എന്നോടു പറഞ്ഞ നിങ്ങളുടെ ഏറ്റവും ഇളയ സഹോദരൻ ഇവനാണോ?” പിന്നെ അവൻ പറഞ്ഞു: “എന്റെ മകനേ, ദൈവം നിന്നോടു കൃപ കാണിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: അവൻ കണ്ണുകളുയർത്തി
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת בִּנְיָמִין
  choice: ബെന്യാമീനെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സാധാരണ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: തന്റെ അമ്മയുടെ മകനായ സഹോദരൻ
  rationale: ബെന്യാമീൻ യോസേഫിന്റെ അതേ അമ്മയിൽ ജനിച്ച സഹോദരനാണെന്ന മൂലപാഠത്തിലെ ഊന്നൽ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: നിങ്ങളുടെ ഇളയ സഹോദരൻ
  rationale: הַקָּטֹן ഇവിടെ ശരീരവലുപ്പമല്ല, സഹോദരന്മാരിൽ പ്രായം കുറഞ്ഞവൻ എന്ന സന്ദർഭാർഥമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: നിങ്ങൾ എന്നോടു പറഞ്ഞ
  rationale: എബ്രായ വാക്യഘടനയോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ വ്യക്തവുമായ രൂപം.
- source_word: אֱלֹהִים יָחְנְךָ
  choice: ദൈവം നിന്നോടു കൃപ കാണിക്കട്ടെ
  rationale: ജസ്സീവ് ആശംസാഭാവവും חנן എന്ന ക്രിയയിലെ കൃപാപൂർവമായ അനുകൂലതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിലുള്ള സ്നേഹപൂർവമായ സംബോധന കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֱלֹהִים ഉപയോഗിച്ചിരിക്കുന്ന അനുഗ്രഹാശംസയുടെ അവതരണം
  choice: ദൈവം നിന്നോടു കൃപ കാണിക്കട്ടെ
  alternative: ദൈവം നിനക്കു കൃപ നൽകട്ടെ
  rationale: മൂലപാഠത്തിലെ പ്രാർഥനാപൂർവമായ ആശംസാഭാവം ‘കാണിക്കട്ടെ’ എന്ന രൂപം വ്യക്തമാക്കുന്നു; ദൈവനാമമോ അധിക ദൈവശാസ്ത്രപരമായ ആശയമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘തന്റെ അമ്മയുടെ മകനായ സഹോദരൻ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ തന്നെ നിലനിർത്തിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
