  terminology: ‘ബെന്യാമീൻ,’ ‘ദൈവം,’ ‘കൃപ കാണിക്കട്ടെ,’ ‘എന്റെ മകനേ’ എന്നിവ ഉചിതമാണ്. ‘ഏറ്റവും ഇളയ സഹോദരൻ’ മൂലസന്ദർഭത്തിനും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ തീരുമാനത്തിനും യോജിക്കുന്നു.
