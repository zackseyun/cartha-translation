  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: ml
  text: 'അവൻ അവരുടെ സുഖവിവരം അന്വേഷിച്ചു; പിന്നെ പറഞ്ഞു: “നിങ്ങൾ പറഞ്ഞ നിങ്ങളുടെ വൃദ്ധനായ അപ്പൻ സുഖമായിരിക്കുന്നുവോ? അദ്ദേഹം ഇപ്പോഴും ജീവനോടെയുണ്ടോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: അവൻ അവരുടെ സുഖവിവരം അന്വേഷിച്ചു
  rationale: ശാലോം എന്ന പദം ഇവിടെ വെറും ‘സമാധാനം’ എന്നല്ല, പൊതുവായ ക്ഷേമമോ സുഖസ്ഥിതിയോ സൂചിപ്പിക്കുന്ന ആശംസാന്വേഷണ പ്രയോഗമാണ്. ‘സുഖവിവരം അന്വേഷിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: הֲשָׁלוֹם
  choice: സുഖമായിരിക്കുന്നുവോ
  rationale: പിതാവിന്റെ പൊതുവായ ക്ഷേമസ്ഥിതിയെക്കുറിച്ചുള്ള ചോദ്യമാണിത്; ‘ആരോഗ്യവാനാണോ’ എന്നത് അർഥം അനാവശ്യമായി ആരോഗ്യത്തിലേക്ക് മാത്രം ചുരുക്കും.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: നിങ്ങളുടെ വൃദ്ധനായ അപ്പൻ
  rationale: הַזָּקֵן പിതാവിന്റെ പ്രായാധിക്യത്തെ സൂചിപ്പിക്കുന്നു. ‘വൃദ്ധനായ’ അർഥം കൃത്യമായി നിലനിർത്തുന്നു; കുടുംബസംഭാഷണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അപ്പൻ’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: നിങ്ങൾ പറഞ്ഞിരുന്ന
  rationale: സഹോദരന്മാർ മുമ്പ് പരാമർശിച്ച പിതാവിനെയാണ് ബന്ധവാക്യം ചൂണ്ടിക്കാണിക്കുന്നത്. ‘പറഞ്ഞിരുന്ന’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַעוֹדֶנּוּ חָי
  choice: അദ്ദേഹം ഇപ്പോഴും ജീവനോടെയുണ്ടോ
  rationale: עוֹד എന്നതിലെ തുടർച്ചയുടെ അർഥം ‘ഇപ്പോഴും’ എന്നും חָי എന്നത് ‘ജീവനോടെ’ എന്നും നേരിട്ട് നിലനിർത്തുന്നു.
