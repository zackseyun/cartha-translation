translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യത്തിലെ ശാലോം എന്ന പദത്തിന്റെ ആവർത്തനം മലയാളത്തിൽ ‘സുഖവിവരം/സുഖമായി’ എന്ന ബന്ധമുള്ള പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തി. പ്രസാധനവാചകത്തിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
