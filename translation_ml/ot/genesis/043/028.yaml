id: GEN.43.28
reference: Genesis 43:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു[a]: “അങ്ങയുടെ ദാസനായ ഞങ്ങളുടെ അപ്പൻ സുഖമായിരിക്കുന്നു; അദ്ദേഹം ഇപ്പോഴും ജീവനോടെയുണ്ട്.” പിന്നെ അവർ കുനിഞ്ഞ് സാഷ്ടാംഗം നമസ്കരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “സമാധാനം” (ശാലോം); ഇവിടെ സുഖക്ഷേമം എന്ന അർഥത്തിൽ പ്രയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: സുഖമായിരിക്കുന്നു
  rationale: പിതാവിന്റെ ക്ഷേമത്തെക്കുറിച്ചുള്ള ചോദ്യത്തിനുള്ള മറുപടിയിൽ ഈ നാമം ‘സമാധാനം’ എന്ന അക്ഷരാർഥത്തിലല്ല, സുഖക്ഷേമം സൂചിപ്പിക്കുന്ന പ്രയോഗമായാണ് വരുന്നത്.
- source_word: לְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ
  rationale: യോസേഫിനോടുള്ള ആദരപൂർവമായ വിനയപ്രയോഗമാണിത്; അടിമസ്ഥിതി അനാവശ്യമായി സൂചിപ്പിക്കാതെ സാമൂഹിക ഭാവം നിലനിർത്തുന്നു.
- source_word: לְאָבִינוּ
  choice: ഞങ്ങളുടെ അപ്പൻ
  rationale: സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കുടുംബബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: עוֹדֶנּוּ חָי
  choice: അദ്ദേഹം ഇപ്പോഴും ജീവനോടെയുണ്ട്
  rationale: עוֹד എന്ന പദത്തിന്റെ തുടർച്ചാസൂചനയും חָי എന്നതിന്റെ ജീവിച്ചിരിക്കുന്ന അവസ്ഥയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקְּדוּ
  choice: കുനിഞ്ഞ്
  rationale: ശരീരം താഴ്ത്തി വണങ്ങുന്ന ആദ്യ ചലനം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וישתחו
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  rationale: മേലധികാരിയുടെ മുമ്പിൽ നിലംപറ്റി വണങ്ങുന്ന ശാരീരിക ആദരപ്രകടനം വ്യക്തമാക്കുന്നു; ദൈവാരാധനയെന്ന അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: וישתחו എന്ന ആദരപ്രകടന ക്രിയയുടെ വിവർത്തനം
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  alternative: ആരാധിച്ചു / വണങ്ങി
  rationale: സന്ദർഭം യോസേഫിന്റെ മുമ്പിലുള്ള സാമൂഹിക ആദരവാണ്, ദൈവാരാധനയല്ല. അതിനാൽ ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുകയും അനാവശ്യമായ ദൈവശാസ്ത്ര അവകാശവാദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. യോസേഫിനോടുള്ള ആദരസൂചകമായി “അങ്ങയുടെ” എന്നും പ്രായമായ പിതാവിനെ പരാമർശിക്കാൻ “അദ്ദേഹം” എന്നും ഉപയോഗിച്ചു. “കുനിഞ്ഞ് സാഷ്ടാംഗം നമസ്കരിച്ചു” എന്ന ക്രമം മൂലത്തിലെ രണ്ട് ശാരീരിക ആദരപ്രകടന ക്രിയകളെയും സംരക്ഷിക്കുന്നു.
