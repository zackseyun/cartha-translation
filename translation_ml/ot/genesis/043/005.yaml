translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘മുഖം കാണുക’ എന്ന ശൈലി പ്രധാനവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘him’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും കുറിപ്പ് לֹא תִרְאוּ פָנַי എന്ന പ്രയോഗത്തെയാണ് വിശദീകരിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തോടു ചേർത്തു.
