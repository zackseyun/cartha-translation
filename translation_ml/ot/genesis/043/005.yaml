  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ അവനെ അയയ്ക്കുന്നില്ലെങ്കിൽ ഞങ്ങൾ ഇറങ്ങിപ്പോകുകയില്ല. കാരണം ആ മനുഷ്യൻ ഞങ്ങളോടു പറഞ്ഞു: “നിങ്ങളുടെ സഹോദരൻ നിങ്ങളോടുകൂടെ ഇല്ലെങ്കിൽ നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല.’ ഒരാളുടെ മുമ്പാകെ ഹാജരാകുക, അയാളുടെ സന്നിധിയിൽ ചെല്ലുക എന്ന അർഥമുള്ള ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ഇല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ സമ്മതവ്യവസ്ഥയ്ക്കു വിപരീതമായ വ്യവസ്ഥ അവതരിപ്പിക്കുന്നതിനാൽ, സന്ദർഭത്തിലെ വൈരുധ്യഭാവം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: നിങ്ങൾ അവനെ അയയ്ക്കുന്നില്ലെങ്കിൽ
  rationale: നിഷേധത്തോടുകൂടിയ കർത്തൃവാചക രൂപം ഉദ്ദേശിച്ച നിരസനത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ അത് ബെന്യാമീനായതിനാൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അവനെ’ ചേർത്തു.
- source_word: לֹא נֵרֵד
  choice: ഞങ്ങൾ ഇറങ്ങിപ്പോകുകയില്ല
  rationale: കനാനിൽനിന്ന് ഈജിപ്തിലേക്കുള്ള യാത്രയെ ‘ഇറങ്ങുക’ എന്നു വിവരിക്കുന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അവർ ഇറങ്ങിപ്പോകാത്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സംസാരിക്കുന്ന സഹോദരന്മാർക്ക് യോസേഫിന്റെ യഥാർഥ തിരിച്ചറിവ് ഇനിയും അറിയാത്തതിനാൽ, മൂലപാഠത്തിലെ പൊതുവായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: אָמַר אֵלֵינוּ
  choice: ഞങ്ങളോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കു നയിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: לֹא תִרְאוּ פָנַי
  choice: നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല
  rationale: ‘എന്റെ സന്നിധിയിൽ വരിക’ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന എബ്രായ ശൈലി അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: בִּלְתִּי
  choice: ഇല്ലെങ്കിൽ
  rationale: സഹോദരൻ കൂടെയുണ്ടാകണം എന്ന അനിവാര്യവ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲחִיכֶם
  choice: നിങ്ങളുടെ സഹോദരൻ
  rationale: മൂലപാഠം ബെന്യാമീനെ പേരെടുത്ത് പറയാത്തതിനാൽ അതേ പൊതുവായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടുകൂടെ
  rationale: സഹോദരൻ അവരോടൊപ്പം ഉണ്ടായിരിക്കണമെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
