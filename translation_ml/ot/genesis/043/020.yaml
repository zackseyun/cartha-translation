source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑/י יָרֹ֥ד יָרַ֛דְנוּ בַּ/תְּחִלָּ֖ה לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “യജമാനനേ,[a] ദയവായി, ഞങ്ങൾ ആദ്യതവണ ഭക്ഷണം വാങ്ങാൻ തീർച്ചയായും ഇറങ്ങിവന്നതാണ്.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യജമാനനേ” എന്നത് ഇവിടെ ഉന്നതസ്ഥാനത്തുള്ള ഒരു മനുഷ്യനോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയാണ്; ദൈവിക ബിരുദമല്ല.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ ക്രിയാനാമവും സമാപികാക്രിയയും ഒരുമിച്ച് ഉപയോഗിച്ച് വരവിന് ഊന്നൽ നൽകുന്നു. “ഞങ്ങൾ ആദ്യതവണ ഭക്ഷണം വാങ്ങാൻ ഇറങ്ങിവന്നതാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ സാധാരണ ആഖ്യാനരൂപം. മലയാളത്തിൽ സ്വാഭാവികമായ കഥാപ്രവാഹത്തിനായി ‘അവർ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: בִּי
  choice: ദയവായി കേൾക്കണമേ
  rationale: അക്ഷരാർഥത്തിലുള്ള മുൻനിലപ്രയോഗമല്ല, വിനയപൂർവമായ അപേക്ഷയാണ്. തുടർന്നുള്ള അഭിസംബോധനയോടൊപ്പം സ്വാഭാവികമായ മലയാള അപേക്ഷയായി നൽകി.
- source_word: אֲדֹנִי
  choice: യജമാനനേ
  rationale: ഉന്നതസ്ഥാനത്തുള്ള ഒരു മനുഷ്യനോടുള്ള ആദരപൂർവമായ അഭിസംബോധന. ദൈവിക ബിരുദമായി തെറ്റിദ്ധരിക്കാതിരിക്കാനുള്ള കുറിപ്പ് ചേർത്തു.
- source_word: יָרֹד יָרַדְנוּ
  choice: വന്നത് … തന്നെയാണ്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഘടനയിലെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കി. ‘ഇറങ്ങിവന്നു’ എന്ന ഭൗമദിശാസൂചന സാധ്യമെങ്കിലും ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ ‘വന്നു’ എന്ന് നൽകി.
- source_word: בַּתְּחִלָּה
  choice: ആദ്യത്തെ പ്രാവശ്യം
  rationale: കഥാസന്ദർഭത്തിൽ ഒരു പൊതുവായ ‘ആരംഭം’ അല്ല, അവരുടെ മുമ്പത്തെ യാത്രയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִשְׁבָּר
  choice: വാങ്ങാൻ
  rationale: ഭക്ഷ്യസാധനങ്ങൾ വിലകൊടുത്തു സമ്പാദിക്കുക എന്ന സന്ദർഭാർഥം ലളിതമായി നൽകുന്നു.
- source_word: אֹכֶל
  choice: ഭക്ഷണം
  rationale: സന്ദർഭം ധാന്യത്തെക്കുറിച്ചാണെങ്കിലും മൂലപദം പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല.
theological_decisions:
- issue: אֲדֹנִי എന്ന അഭിസംബോധനയുടെ സ്വഭാവം
  choice: മനുഷ്യനായ ഉന്നതാധികാരിയോടുള്ള ‘യജമാനനേ’
  alternative: ദൈവിക ബിരുദമായി വായിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ സഹോദരന്മാർ യോസേഫിന്റെ ഭവനവിചാരകനോടാണ് സംസാരിക്കുന്നത്; അതിനാൽ ഇത് ദൈവത്തെ സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. മൂലത്തിലെ വിനയവും യָרֹד יָרַדְנוּ എന്ന ഊന്നലും സംരക്ഷിച്ചു; ‘ഇറങ്ങിവന്നു’ എന്ന കൂടുതൽ രൂപസാദൃശ്യമുള്ള വിവർത്തനം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
