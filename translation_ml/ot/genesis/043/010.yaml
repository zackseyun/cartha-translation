source:
  edition: WLC
  text: כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: ml
  text: കാരണം, നാം താമസിച്ചില്ലായിരുന്നെങ്കിൽ[a], ഇപ്പോഴേക്കും രണ്ടുതവണ മടങ്ങിയെത്തിയേനെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം വൈകിയില്ലായിരുന്നെങ്കിൽ’ അല്ലെങ്കിൽ ‘നാം മടിച്ചുനിന്നില്ലായിരുന്നെങ്കിൽ.’ ഹീബ്രു ക്രിയയ്ക്ക് താമസിക്കുക, വൈകുക, മടിച്ചുനിൽക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇപ്പോഴേക്കും നാം ഇത് രണ്ടുതവണ മടങ്ങിയെത്തിയേനെ.’ ഹീബ്രുവിലെ പ്രയോഗം ഇവിടെ ‘രണ്ടുതവണ’ എന്നർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിൽ എന്ന വ്യവസ്ഥയുടെ പ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ആദ്യത്തെ כִּי യെ വേർതിരിച്ച് ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നതിനെക്കാൾ, മലയാളത്തിൽ പ്രത്യയവിരുദ്ധ വ്യവസ്ഥ നേരിട്ട് ആരംഭിക്കുന്നത് സ്വാഭാവികവും യെഹൂദയുടെ ന്യായവാദത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: לוּלֵא
  choice: ഇരുന്നില്ലെങ്കിൽ
  rationale: കഴിഞ്ഞകാലത്തിൽ സംഭവിക്കാതിരുന്ന ഒരു കാര്യത്തെക്കുറിച്ചുള്ള പ്രത്യയവിരുദ്ധ വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִתְמַהְמָהְנוּ
  choice: നാം താമസിച്ചിരുന്നില്ലെങ്കിൽ
  rationale: ഹിത്പാൽപേൽ രൂപം വൈകുക, താമസിക്കുക, മടിച്ചുനിൽക്കുക എന്നീ അർത്ഥങ്ങൾ ഉൾക്കൊള്ളാം; യാത്ര പുറപ്പെടുന്നത് നീണ്ടുപോയ പശ്ചാത്തലത്തിൽ ‘താമസിക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי עַתָּה
  choice: ഇപ്പോഴേക്കും
  rationale: പ്രത്യയവിരുദ്ധ വ്യവസ്ഥയുടെ ഫലം ഈ സമയത്തിനകം സംഭവിച്ചേനെയെന്ന അർത്ഥം മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: שַׁבְנוּ
  choice: പോയി മടങ്ങിവരുമായിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർത്ഥം ‘മടങ്ങിവരുക’ എന്നതാണ്. എന്നാൽ ‘രണ്ടുതവണ’ എന്നത് രണ്ട് പൂർണ്ണ യാത്രകൾ എന്ന സാഹചര്യാർഥം വഹിക്കുന്നതിനാൽ, മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ലക്ഷ്യസ്ഥാനത്തേക്കു പോയി തിരിച്ചെത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: זֶה פַעֲמָיִם
  choice: രണ്ടുതവണ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ സാഹചര്യാർഥം ‘രണ്ട് പ്രാവശ്യം’ എന്നാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘രണ്ടുതവണ’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പോയി മടങ്ങിവരുമായിരുന്നു’ എന്ന വികസിത പ്രയോഗം, രണ്ട് പൂർണ്ണ യാത്രകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത് എന്നു സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
