translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. വീട്ടുചുമതലയുള്ള ഉദ്യോഗസ്ഥന്റെ പദവി അതിയായി സാങ്കേതികമാക്കാതെ മൂലപദത്തിന്റെ പ്രവർത്തനാർഥം നിലനിർത്തി; ഹീബ്രായ അറുക്കൽ-പ്രയോഗത്തിന്റെ സാംസ്കാരിക സ്വഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
