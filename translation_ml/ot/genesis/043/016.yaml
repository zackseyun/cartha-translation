source:
  edition: WLC
  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: ml
  text: 'യോസേഫ് അവരോടൊപ്പം ബെന്യാമീനെ കണ്ടപ്പോൾ, തന്റെ ഭവനത്തിന്റെ ചുമതലയുള്ളവനോട്[a] പറഞ്ഞു: “ആ പുരുഷന്മാരെ വീട്ടിനകത്തേക്കു കൊണ്ടുപോകുക; ഒരു മൃഗത്തെ അറുത്ത് ഭക്ഷണം ഒരുക്കുക[b]. ഉച്ചയ്ക്ക്[c] ആ പുരുഷന്മാർ എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തന്റെ വീടിന്റെ മേലുള്ളവനോട്”; അതായത് തന്റെ ഭവനത്തിന്റെ ചുമതലയുള്ളവനോട്.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായ ഭാഷാശൈലിയിൽ അക്ഷരാർഥം “ഒരു അറുക്കൽ അറുക്കുക”; ഭക്ഷണത്തിനായി ഒരു മൃഗത്തെ അറുത്തൊരുക്കുക എന്നാണ് അർഥം.
    reason: cultural_note
  - marker: c
    text: അഥവാ “മധ്യാഹ്നത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയ ഇവിടെ യോസേഫ് ബെന്യാമീന്റെ സാന്നിധ്യം ശ്രദ്ധിച്ചതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധം നൽകാൻ ‘കണ്ടപ്പോൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: പ്രത്യയത്തോടുകൂടിയ אֵת എന്ന പദം ബെന്യാമീൻ സഹോദരന്മാരുടെ കൂടെയുണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: തന്റെ വീട്ടുകാര്യങ്ങളുടെ മേൽനോട്ടക്കാരനോട്
  rationale: അക്ഷരാർഥം ‘തന്റെ വീടിന്റെ മേലുള്ളവനോട്’ എന്നാണ്; വ്യക്തിയുടെ ചുമതല വ്യക്തമാക്കിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: ഈ പുരുഷന്മാരെ വീട്ടിനകത്തേക്കു കൊണ്ടുപോകുക
  rationale: הַבָּיְתָה എന്ന ദിശാസൂചക രൂപം വീട്ടിലേക്കോ വീട്ടിനകത്തേക്കോ ഉള്ള ചലനം വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ പുരുഷന്മാരെ ചൂണ്ടിക്കാണിക്കാൻ ‘ഈ’ ചേർത്തു.
- source_word: וּטְבֹחַ טֶבַח וְהָכֵן
  choice: ഒരു മൃഗത്തെ അറുത്ത് ഭക്ഷണം ഒരുക്കുക
  rationale: ‘അറുക്കൽ അറുക്കുക’ എന്ന ഹീബ്രായ ക്രിയ-നാമ പ്രയോഗം ഭക്ഷണത്തിനായി ഒരു മൃഗത്തെ അറുത്തൊരുക്കുക എന്നർഥമുള്ളതാണ്; വംശം വ്യക്തമല്ലാത്തതിനാൽ ‘ഒരു മൃഗം’ എന്നും, וְהָכֵן ഭക്ഷണസജ്ജീകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭക്ഷണം ഒരുക്കുക’ എന്നും നൽകി.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: അവർ എന്നോടൊപ്പം ഭക്ഷണം കഴിക്കും
  rationale: כִּי കല്പനയുടെ കാരണം നൽകുന്നു; മുൻവാക്യത്തിൽ പുരുഷന്മാർ വ്യക്തമായതിനാൽ ആവർത്തനം ഒഴിവാക്കി ‘അവർ’ എന്നു നൽകി.
- source_word: בַּצָּהֳרָיִם
  choice: ഉച്ചയ്ക്ക്
  rationale: ഈ പദം മധ്യാഹ്നം/ഉച്ചസമയം സൂചിപ്പിക്കുന്നു; ‘ഉച്ചയ്ക്ക്’ സാധാരണ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപമാണ്.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: ഹീബ്രായ പദം ഇവിടെ യോസേഫിന്റെ സഹോദരന്മാരും അവരുടെ കൂട്ടവും ഉൾപ്പെടുന്ന വ്യക്തമായ പുരുഷസംഘത്തെ സൂചിപ്പിക്കുന്നു.
