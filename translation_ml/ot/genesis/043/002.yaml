id: GEN.43.2
reference: Genesis 43:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: ml
  text: 'അവർ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന ധാന്യം തിന്നുതീർന്നപ്പോൾ, അവരുടെ അപ്പൻ അവരോടു പറഞ്ഞു: “വീണ്ടും പോയി നമുക്കുവേണ്ടി കുറച്ച് ആഹാരം വാങ്ങുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ തുടർച്ചയും സമയബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഹീബ്രായ ആഖ്യാനസൂത്രം വാക്കിന് വാക്കായി പകർത്തുന്നില്ല.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: തിന്നുതീർന്നപ്പോൾ
  rationale: כלה + לֶאֱכֹל എന്ന പൂർത്തീകരണപ്രയോഗത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַשֶּׁבֶר
  choice: ധാന്യം
  rationale: ക്ഷാമകാലത്ത് വാങ്ങിയ ധാന്യത്തെയാണ് യോസേഫിന്റെ കഥാസന്ദർഭത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ആഹാരം’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്ന
  rationale: ധാന്യം മുമ്പ് ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നതാണെന്ന മുൻകാലബന്ധം മലയാളത്തിലെ കൃതന്തഘടന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲבִיהֶם
  choice: അവരുടെ അപ്പൻ
  rationale: ഹീബ്രായത്തിലെ ബന്ധപദം തന്നെയാണ് നിലനിർത്തുന്നത്; ഇവിടെ യാക്കോബ് എന്ന പേര് ചേർക്കുന്നില്ല. ‘അപ്പൻ’ സാധാരണക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: שֻׁבוּ
  choice: വീണ്ടും പോയി
  rationale: മുമ്പ് പോയ സ്ഥലത്തേക്കുള്ള മടക്കയാത്രയാണ് കല്പനയുടെ അർഥം; മലയാളത്തിൽ ‘വീണ്ടും പോയി’ സ്വാഭാവികമാണ്.
- source_word: שִׁבְרוּ
  choice: വാങ്ങിക്കൊണ്ടുവരുവിൻ
  rationale: ഈ സന്ദർഭത്തിൽ ധാന്യമോ ഭക്ഷ്യസാധനങ്ങളോ വാങ്ങുക എന്നർഥം; കുടുംബത്തിനായി മടങ്ങിവരാനുള്ള യാത്രാസന്ദർഭം മലയാളപ്രയോഗത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לָנוּ
  choice: നമുക്കുവേണ്ടി
  rationale: ഹീബ്രായ ദാതൃകാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְעַט אֹכֶל
  choice: കുറച്ച് ആഹാരം
  rationale: אֹכֶל എന്ന പൊതുവായ ‘ഭക്ഷണം/ആഹാരം’ എന്ന പദവും מְעַט എന്ന ചെറിയ അളവും കൃത്യമായി സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, മാന്യമായ മലയാളം. ആദ്യ ഭാഗത്തിലെ പ്രത്യേക ‘ധാന്യം’ എന്നും കല്പനയിലെ പൊതുവായ ‘ആഹാരം’ എന്നും ഉള്ള ഹീബ്രായ പദവ്യത്യാസം നിലനിർത്തിയിരിക്കുന്നു. അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങളില്ല.
