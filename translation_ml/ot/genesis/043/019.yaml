- from: അങ്ങനെ അവർ യോസേഫിന്റെ ഭവനത്തിന്റെ ചുമതലയുണ്ടായിരുന്ന ആ മനുഷ്യന്റെ അടുത്തുചെന്ന് ഭവനത്തിന്റെ പ്രവേശനകവാടത്തിൽവെച്ച്[a] അവനോടു സംസാരിച്ചു.
  to: അങ്ങനെ അവർ യോസേഫിന്റെ ഭവനത്തിന്റെ ചുമതല വഹിച്ചിരുന്ന ആ മനുഷ്യന്റെ അടുത്ത് ചെന്നു, വീടിന്റെ വാതിൽക്കൽവെച്ച്[a] അവനോടു സംസാരിച്ചു.
