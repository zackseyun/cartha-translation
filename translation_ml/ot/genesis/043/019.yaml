source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: ml
  text: അങ്ങനെ അവർ യോസേഫിന്റെ ഭവനത്തിന്റെ ചുമതല വഹിച്ചിരുന്ന ആ മനുഷ്യന്റെ അടുത്ത് ചെന്നു, വീടിന്റെ വാതിൽക്കൽവെച്ച്[a] അവനോടു സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വീടിന്റെ പ്രവേശനസ്ഥലത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: അടുത്തുചെന്ന്
  rationale: നגשׁ എന്ന ക്രിയയുടെ ഒരാളുടെ അടുത്തേക്ക് നീങ്ങുന്ന ദിശാബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ അയാൾ ഭവനകാര്യ മേൽനോട്ടക്കാരനാണെങ്കിലും എബ്രായപാഠം ഇവിടെ തൊഴിൽപദവിയല്ല, ലളിതമായി ‘മനുഷ്യൻ’ എന്നാണ് പറയുന്നത്.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനത്തിന്റെ ചുമതലയുണ്ടായിരുന്ന
  rationale: עַל ഇവിടെ അധികാരവും മേൽനോട്ടവും സൂചിപ്പിക്കുന്നു; ‘ചുമതലയുണ്ടായിരുന്ന’ എന്നത് ആ ഭരണപരമായ ഉത്തരവാദിത്വം സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘ഭവനം’ കെട്ടിടം മാത്രമല്ല, ഗാർഹിക സ്ഥാപനവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദമാണ്.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: അവനോടു സംസാരിച്ചു
  rationale: דבר אֶל എന്ന ഘടനയുടെ ‘ഒരാളോടു സംസാരിക്കുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സംസാരത്തിന്റെ ഉള്ളടക്കം അടുത്ത വാക്യത്തിൽ വരുന്നു.
- source_word: פֶּתַח הַבָּיִת
  choice: ഭവനത്തിന്റെ പ്രവേശനകവാടത്തിൽവെച്ച്
  rationale: פֶּתַח ഒരു തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ വാതിൽക്കലിനെയോ സൂചിപ്പിക്കുന്നു. അകത്തേക്കു പൂർണമായി പ്രവേശിക്കുന്നതിനുമുമ്പുള്ള രംഗം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആ മനുഷ്യൻ’ എന്ന മൂലപാഠത്തിലെ പൊതുവായ പരാമർശവും פֶּתַח എന്ന പദത്തിന്റെ സ്ഥാനപരമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
