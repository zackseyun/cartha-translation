translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ മൂന്നു തവണയുള്ള വേർതിരിവ് ആവർത്തനത്തിലൂടെ നിലനിർത്തി; സാമൂഹിക വിലക്കിന്റെ കാരണം അതിലധികം വിശദീകരിക്കാതെ അതിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിച്ചു.
