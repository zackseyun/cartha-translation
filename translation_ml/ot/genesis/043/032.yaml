  text: וַ/יָּשִׂ֥ימוּ ל֛/וֹ לְ/בַדּ֖/וֹ וְ/לָ/הֶ֣ם לְ/בַדָּ֑/ם וְ/לַ/מִּצְרִ֞ים הָ/אֹכְלִ֤ים אִתּ/וֹ֙ לְ/בַדָּ֔/ם כִּי֩ לֹ֨א יוּכְל֜וּ/ן הַ/מִּצְרִ֗ים לֶ/אֱכֹ֤ל אֶת הָֽ/עִבְרִים֙ לֶ֔חֶם כִּי תוֹעֵבָ֥ה הִ֖וא לְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവന് പ്രത്യേകം, അവന്റെ സഹോദരന്മാർക്ക് പ്രത്യേകം, അവനോടൊപ്പം ഭക്ഷണം കഴിച്ചിരുന്ന ഈജിപ്തുകാർക്ക് പ്രത്യേകം ഭക്ഷണം വിളമ്പി. ഈജിപ്തുകാർക്ക് എബ്രായരോടൊപ്പം അപ്പം കഴിക്കാൻ[a] കഴിയുമായിരുന്നില്ല; കാരണം അത് ഈജിപ്തുകാർക്ക് അറപ്പുളവാക്കുന്ന കാര്യമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ, ‘എബ്രായരോടൊപ്പം അപ്പം കഴിക്കുക’; ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുക എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: ഭക്ഷണം വിളമ്പി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വെച്ചു’ എന്നാണെങ്കിലും, ഭക്ഷണസന്ദർഭത്തിൽ ഓരോ കൂട്ടത്തിനും ഭക്ഷണം വെച്ചുകൊടുക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘ഭക്ഷണം വിളമ്പി’ എന്നു പറയുന്നു.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: തനിച്ചും / തനിച്ചും
  rationale: മൂന്നു വിഭാഗങ്ങളെയും വേർതിരിച്ചു നിർത്തുന്ന എബ്രായ ആവർത്തനം നിലനിർത്തുന്നു; വ്യക്തിക്ക് ‘തനിച്ച്’, കൂട്ടങ്ങൾക്ക് അതേ രൂപം സന്ദർഭാനുസൃതമായി പ്രയോഗിച്ചിരിക്കുന്നു.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: അവനോടൊപ്പം ഭക്ഷണം കഴിച്ചിരുന്ന
  rationale: എബ്രായ കർത്തൃവാചക രൂപത്തിന്റെ നടന്നുകൊണ്ടിരുന്ന സാഹചര്യാർഥം സ്വാഭാവികമായ ആഖ്യാനമലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לֹא יוּכְלוּן
  choice: കഴിയുമായിരുന്നില്ല
  rationale: ശാരീരിക അശക്തിയെന്നു ചുരുക്കാതെ, സാമൂഹികമോ ആചാരപരമോ ആയ അസാധ്യതയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന മൂലപാഠത്തിന്റെ വിധിസൂചക ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: എബ്രായരോടൊപ്പം അപ്പം ഭക്ഷിക്കാൻ
  rationale: ‘അപ്പം ഭക്ഷിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട്, ‘ഒരുമിച്ച് ഭക്ഷണം കഴിക്കുക’ എന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תוֹעֵבָה
  choice: അറപ്പുള്ള കാര്യം
  rationale: സാംസ്കാരികമായോ ആചാരപരമായോ വെറുപ്പുളവാക്കുന്ന ശക്തമായ വിലയിരുത്തൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രത്യേക മതസാങ്കേതിക അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: הַמִּצְרִים / הָעִבְרִים
  choice: ഈജിപ്തുകാർ / എബ്രായർ
  rationale: രണ്ടു ജനവിഭാഗങ്ങൾക്കിടയിലെ സാമൂഹിക അതിർത്തി വ്യക്തമായി നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മലയാള ജനനാമങ്ങൾ ഉപയോഗിക്കുന്നു.
