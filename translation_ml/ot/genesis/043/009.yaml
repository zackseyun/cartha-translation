source:
  edition: WLC
  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: ml
  text: അവനുവേണ്ടി ഞാൻ തന്നെ ജാമ്യം നിൽക്കും. അവനെ എന്റെ കൈയിൽനിന്ന് അങ്ങേക്ക് ആവശ്യപ്പെടാം. ഞാൻ അവനെ അങ്ങയുടെ അടുക്കൽ കൊണ്ടുവന്ന് അങ്ങയുടെ മുമ്പിൽ നിർത്തിയില്ലെങ്കിൽ, ജീവിതകാലം മുഴുവൻ ഞാൻ അങ്ങയോടു കുറ്റക്കാരനായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: “ജീവിതകാലം മുഴുവൻ ഞാൻ അങ്ങയോടു പാപം ചെയ്തവനായിരിക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: ഞാൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി യെഹൂദാ വ്യക്തിപരമായി ഉത്തരവാദിത്വം ഏറ്റെടുക്കുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: אֶעֶרְבֶנּוּ
  choice: അവന് ... ജാമ്യം നിൽക്കും
  rationale: ערב എന്ന ക്രിയയിലെ ഉറപ്പുകാരൻ/ജാമ്യക്കാരൻ ആകുന്ന നിയമപരവും ബന്ധപരവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: അവനെ എന്റെ കൈയിൽനിന്ന് അങ്ങേക്കു ചോദിക്കാം
  rationale: എബ്രായത്തിലെ ‘എന്റെ കൈയിൽനിന്ന്’ എന്ന ഉത്തരവാദിത്വദൃശ്യവും בקש എന്നതിന്റെ തിരികെ ആവശ്യപ്പെടുന്ന ഭാവവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: അവനെ അങ്ങയുടെ അടുക്കൽ കൊണ്ടുവന്ന്
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘തിരികെ’ ചേർക്കുന്നില്ല.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: അങ്ങയുടെ മുമ്പിൽ നിർത്തിയില്ലെങ്കിൽ
  rationale: יצג എന്നതിന്റെ നിർത്തുക/ഹാജരാക്കുക എന്ന ദൃശ്യമായ അർഥവും לְפָנֶיךָ എന്ന ‘മുമ്പിൽ’ എന്ന പ്രയോഗവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וְחָטָאתִי לְךָ
  choice: ഞാൻ അങ്ങയോടു കുറ്റക്കാരനായിരിക്കും
  rationale: חטא എന്നതിലെ ധാർമിക കുറ്റബോധവും ഈ വ്യക്തിബന്ധപരമായ പ്രതിജ്ഞയിലെ ഉത്തരവാദിത്വവും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: ജീവിതകാലം മുഴുവൻ
  rationale: എല്ലാ ദിവസങ്ങളും എന്ന പദശഃ രൂപത്തിന്റെ ആയുഷ്കാലവ്യാപകമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വ്യക്തിബന്ധപരമായ സാഹചര്യത്തിൽ וְחָטָאתִי לְךָ എന്നതിന്റെ വിവർത്തനം
  choice: ഞാൻ അങ്ങയോടു കുറ്റക്കാരനായിരിക്കും
  alternative: ഞാൻ അങ്ങയോടു പാപം ചെയ്തവനായിരിക്കും
  rationale: മൂലക്രിയ സാധാരണയായി ‘പാപം ചെയ്യുക’ എന്നാണ്; എന്നാൽ ഇവിടെ യെഹൂദാ പിതാവിനോടുള്ള സ്ഥിരമായ കുറ്റബാധ്യത ഏറ്റെടുക്കുകയാണ്. മുഖ്യപാഠം ഈ സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ഗൗരവമുള്ളതുമാണ്; ‘ജാമ്യം നിൽക്കുക’ ഉത്തരവാദിത്വത്തിന്റെ നിയമപരമായ ഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
