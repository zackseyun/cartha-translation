  rationale: אמתחת യാത്രയ്ക്കും ധാന്യത്തിനുമായി ഉപയോഗിക്കുന്ന ചാക്കാണ്; בתחלה ഈ സന്ദർഭത്തിൽ അവരുടെ ആദ്യ യാത്രയെ സൂചിപ്പിക്കുന്നു.
