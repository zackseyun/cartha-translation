    rationale: הַשָּׁב is passive/resultative in context. “തിരികെ ലഭിച്ച പണം” naturally conveys that the money had come back to them without specifying who returned it.
  - severity: medium
    issue: “തങ്ങളെ കൊണ്ടുവന്നതുകൊണ്ട്” is syntactically awkward and does not naturally express the passive causal clause.
    rationale: The Hophal הוּבְאוּ means that they were brought in. “യോസേഫിന്റെ വീട്ടിലേക്കു കൊണ്ടുവരപ്പെട്ടതിനാൽ” is a more natural and faithful Malayalam passive construction.
