  rationale: על דבר ഇവിടെ വിഷയത്തെക്കാൾ കാരണത്തെ സൂചിപ്പിക്കുന്നു. השב എന്നതിന്റെ ഫലാവസ്ഥയെ ‘തിരികെ വന്നിരുന്ന’ എന്നു നൽകുന്നത് പണം ആരാണ് വെച്ചതെന്നത് ഈ വാക്യത്തിൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
