base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: ml
  text: 'യോസേഫിന്റെ വീട്ടിലേക്കു കൊണ്ടുവരപ്പെട്ടതിനാൽ ആ പുരുഷന്മാർ ഭയപ്പെട്ടു. അവർ പറഞ്ഞു: “ആദ്യത്തെ പ്രാവശ്യം നമ്മുടെ ചാക്കുകളിൽ തിരികെ ലഭിച്ച പണത്തിന്റെ പേരിലാണ് നമ്മെ ഇങ്ങോട്ട് കൊണ്ടുവന്നിരിക്കുന്നത്; നമുക്കെതിരെ ഒരു കാരണം കെട്ടിച്ചമയ്ക്കാനും[a] നമ്മെ ആക്രമിക്കാനും നമ്മെ അടിമകളാക്കാനും നമ്മുടെ കഴുതകളെ പിടിച്ചെടുക്കാനുമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമുക്കെതിരെ ഒരു അവസരം തേടാനും.” ഇവിടെയുള്ള ഹീബ്രു പ്രയോഗം ഒരു ഇടിയമാണ്; അതിന്റെ കൃത്യമായ അർഥം ദുഷ്കരമാണ്.
    reason: lexical_alternative
