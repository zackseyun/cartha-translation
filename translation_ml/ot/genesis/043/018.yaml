  terminology: “അടിമകളാക്കുക” accurately represents the bonded status of לַעֲבָדִים. “കഴുതകൾ” is correct. The difficult idiom לְהִתְגֹּלֵל עָלֵינוּ should remain qualified by a footnote; “ഒരു കാരണം കെട്ടിച്ചമയ്ക്കുക” is a clear contextual rendering, while the note retains the alternative sense of seeking an occasion.
  issues:
