  rationale: בוא എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലുള്ള കർമണി-കാരണഭാവവും ഭയത്തിന്റെ കാരണവും സംരക്ഷിക്കുന്നു.
- source_word: עַל דְּבַר הַכֶּסֶף הַשָּׁב
