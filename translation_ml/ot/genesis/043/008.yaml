reference: Genesis 43:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: ml
  text: 'യഹൂദാ തന്റെ അപ്പനായ യിസ്രായേലിനോടു പറഞ്ഞു: “ആ യുവാവിനെ[a] എന്നോടുകൂടെ അയയ്ക്കുക. നാം എഴുന്നേറ്റു പുറപ്പെട്ടുപോകാം; അങ്ങനെ ഞങ്ങളും അങ്ങയും ഞങ്ങളുടെ കുഞ്ഞുങ്ങളും മരിക്കാതെ ജീവിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആ ബാലനെ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ נַעַר എന്ന പദം ചെറിയ കുട്ടിയെ മാത്രമല്ല, ഒരു യുവാവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ വാക്യക്രമം തന്നെ ഈ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ അധിക സംയോജകം ആവശ്യമില്ല.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: തന്റെ അപ്പനായ യിസ്രായേലിനോടു
  rationale: എബ്രായത്തിലെ ‘യിസ്രായേൽ’ എന്ന പേര് നിലനിർത്തുകയും പിതാവെന്ന ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: שִׁלְחָה
  choice: അയയ്ക്കുക
  rationale: നേരിട്ടുള്ള അഭ്യർഥന/ആജ്ഞയായ ക്രിയാരൂപം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַנַּעַר
  choice: ആ യുവാവിനെ
  rationale: നַעַר ബാലനെയോ യുവാവിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ബെന്യാമീൻ ചെറിയ കുട്ടിയല്ലാത്തതിനാൽ ‘യുവാവ്’ പ്രായസന്ദർഭത്തിന് യോജിക്കുന്നു, എന്നാൽ പകരംവിവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אִתִּי
  choice: എന്നോടുകൂടെ
  rationale: യഹൂദാ തന്നെ ബെന്യാമീനോടൊപ്പം പോകുമെന്ന വ്യക്തിപരമായ ഉത്തരവാദിത്വം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: നാം എഴുന്നേറ്റു പോകാം
  rationale: രണ്ട് cohortative ക്രിയകളുടെയും സംയുക്തപ്രവർത്തനത്തിനുള്ള ആഹ്വാനവും ഉടൻ പുറപ്പെടുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: മരിക്കാതെ ജീവിച്ചിരിക്കും
  rationale: യാത്രയുടെ ലക്ഷ്യം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ജീവിക്കുക–മരിക്കുക എന്ന എബ്രായ വിരോധം നിലനിർത്തുന്നു.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: ഞങ്ങളും അപ്പനും ഞങ്ങളുടെ കുഞ്ഞുങ്ങളും
  rationale: ആവർത്തിക്കുന്ന גַּם ഉൾക്കൊള്ളുന്ന മൂന്നു കൂട്ടരെയും മലയാളത്തിലെ ‘-ഉം’ എന്ന ആവർത്തനത്തിലൂടെ ഊന്നിപ്പറയുന്നു; പിതാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അപ്പനും’ സ്വാഭാവികമാണ്.
- source_word: טַפֵּנוּ
  choice: ഞങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: ടഫ് കുടുംബത്തിലെ ചെറുകുട്ടികളെയും ആശ്രിതരായ ദുർബല അംഗങ്ങളെയും സൂചിപ്പിക്കുന്നു; ‘കുഞ്ഞുങ്ങൾ’ അതിന്റെ സ്നേഹവും ദുർബലതയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘യിസ്രായേൽ’ എന്ന പേരും ‘എഴുന്നേറ്റു പോകാം’ എന്ന ഇരട്ടക്രിയയും മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തി; ആവർത്തിച്ചുള്ള ഉൾപ്പെടുത്തൽ മലയാളത്തിലെ ‘-ഉം’ ഘടനയിലൂടെ പുനരാവിഷ്കരിച്ചു.
