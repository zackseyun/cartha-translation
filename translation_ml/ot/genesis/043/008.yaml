  to: 'യഹൂദാ തന്റെ അപ്പനായ യിസ്രായേലിനോടു പറഞ്ഞു: “ആ യുവാവിനെ[a] എന്നോടുകൂടെ അയയ്ക്കുക. നാം എഴുന്നേറ്റു പുറപ്പെട്ടുപോകാം; അങ്ങനെ ഞങ്ങളും അങ്ങയും ഞങ്ങളുടെ കുഞ്ഞുങ്ങളും മരിക്കാതെ ജീവിക്കേണ്ടതിന്.”'
