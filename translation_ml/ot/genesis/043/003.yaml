  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ അവനോടു പറഞ്ഞു: “ആ മനുഷ്യൻ ഞങ്ങൾക്ക് കർശനമായി മുന്നറിയിപ്പു നൽകി[a]: ‘നിങ്ങളുടെ സഹോദരൻ നിങ്ങളോടുകൂടെ ഇല്ലെങ്കിൽ നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്ക് വളരെ വ്യക്തമായി മുന്നറിയിപ്പു നൽകി.” ക്രിയയുടെ ആശയത്തെ ഊന്നിപ്പറയുന്ന ഒരു എബ്രായ വ്യാകരണഘടനയാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, “നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല.” ഈ പ്രയോഗത്തിന് “നിങ്ങൾ എന്റെ മുമ്പാകെ വരുകയില്ല” എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനായ യാക്കോബിനെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: הָעֵד הֵעִד
  choice: കർശനമായി മുന്നറിയിപ്പു നൽകി
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപക ക്രിയയും ചേർന്ന പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു; ഇവിടെ നിയമസാക്ഷ്യം എന്നതിലുപരി ഗൗരവമുള്ള കർശന മുന്നറിയിപ്പാണ് സന്ദർഭസാരം.
- source_word: בָּנוּ
  choice: ഞങ്ങൾക്ക്
  rationale: മുന്നറിയിപ്പ് ലഭിച്ചവരെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിഭക്തിപ്രയോഗം.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് കണ്ട ഈജിപ്ത്യൻ അധികാരിയെ സാധാരണ നാമത്തിൽ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֹא תִרְאוּ פָנַי
  choice: നിങ്ങൾ എന്റെ മുഖം കാണുകയില്ല
  rationale: എബ്രായത്തിലെ സജീവമായ മുഖപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘എന്റെ മുമ്പാകെ വരിക’ എന്ന അർഥവും ഇതിനുണ്ട്.
- source_word: בִּלְתִּי
  choice: ഇല്ലെങ്കിൽ
  rationale: സഹോദരൻ കൂടെയുണ്ടാകണമെന്ന നിബന്ധന സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲחִיכֶם
  choice: നിങ്ങളുടെ സഹോദരൻ
  rationale: ബഹുവചന ഉടമസ്ഥപ്രത്യയമുള്ള ഏകവചന നാമം; സന്ദർഭത്തിൽ ബെന്യാമീനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടുകൂടെ
  rationale: കൂടെ ഉണ്ടായിരിക്കണമെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘ഇല്ലെങ്കിൽ’ എന്നതിൽ ആവശ്യമായ നിലനിൽപ്പുക്രിയ ഉൾക്കൊള്ളുന്നു.
