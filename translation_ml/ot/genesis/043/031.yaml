source:
  edition: WLC
  text: וַ/יִּרְחַ֥ץ פָּנָ֖י/ו וַ/יֵּצֵ֑א וַ/יִּ֨תְאַפַּ֔ק וַ/יֹּ֖אמֶר שִׂ֥ימוּ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: ml
  text: പിന്നെ അവൻ മുഖം കഴുകി പുറത്തുവന്നു. സ്വയം നിയന്ത്രിച്ച് അവൻ, “ഭക്ഷണം[a] വിളമ്പൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘അപ്പം’; ഇവിടെ വിളമ്പുന്ന ഭക്ഷണത്തെയോ ഊണിനെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: അവൻ മുഖം കഴുകി
  rationale: רחץ എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘കഴുകുക’ എന്നാണ്. കരഞ്ഞശേഷം സ്വകാര്യ മുറിയിൽനിന്ന് മടങ്ങിവരുന്ന സന്ദർഭത്തിൽ മുഖം കഴുകിയെന്ന സ്വാഭാവിക അർഥം ഇതു നൽകുന്നു. פָּנִים രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഒരാളുടെ മുഖത്തെ സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ ഏകവചനമാണ് സ്വാഭാവികം.
- source_word: וַיֵּצֵא
  choice: പുറത്തുവന്നു
  rationale: יצא എന്നത് ‘പുറത്തുപോകുക/പുറത്തുവരുക’ എന്നർഥം നൽകുന്നു. യോസേഫ് സ്വകാര്യസ്ഥലത്തുനിന്ന് വിരുന്നിലേക്കു മടങ്ങുന്ന കഥനസന്ദർഭത്തിൽ ‘പുറത്തുവന്നു’ സ്വാഭാവികമാണ്.
- source_word: וַיִּתְאַפַּק
  choice: സ്വയം നിയന്ത്രിച്ചുകൊണ്ട്
  rationale: אפק എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ശക്തമായ വികാരത്തെ അടക്കിനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംസാരവുമായി ക്രിയയുടെ അടുത്ത ബന്ധം നിലനിർത്താൻ ‘സ്വയം നിയന്ത്രിച്ചുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שִׂימוּ
  choice: വിളമ്പൂ
  rationale: പദശഃ ‘വെക്കൂ’ എന്നാണെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ ഭക്ഷണം മുന്നിൽ വെക്കുകയോ വിളമ്പുകയോ ചെയ്യാനുള്ള കല്പനയാണ്. ആ സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ ‘വിളമ്പൂ’ വ്യക്തമായി നൽകുന്നു.
- source_word: לָחֶם
  choice: ഭക്ഷണം
  rationale: לֶחֶם എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘അപ്പം’ ആണെങ്കിലും ഭക്ഷണം അല്ലെങ്കിൽ ഊണ് എന്ന വിശാലാർഥത്തിൽ ഇത് പതിവായി ഉപയോഗിക്കുന്നു. ഇവിടെ വിരുന്ന് വിളമ്പുന്ന സന്ദർഭമായതിനാൽ ‘ഭക്ഷണം’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഹീബ്രു ക്രിയാനിരയുടെ ചലനം നിലനിർത്തിക്കൊണ്ട് അമിതമായ പദശഃപരിഭാഷ ഒഴിവാക്കി. ഇവിടെ לָחֶם എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം അടിക്കുറിപ്പ് ആവശ്യമില്ല.
