  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. വിരുന്നുസന്ദർഭം വ്യക്തമാക്കാൻ ‘ഭക്ഷണവിഹിതങ്ങൾ’ ഉപയോഗിച്ചു. ‘മത്തുപിടിച്ചു’ എന്നത് മൂലപദത്തിന്റെ ശക്തി മൃദൂകരിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
