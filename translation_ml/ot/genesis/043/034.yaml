  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: ml
  text: അവൻ തന്റെ മുമ്പിൽനിന്ന് അവർക്കു ഭക്ഷണവിഹിതങ്ങൾ കൊടുത്തയച്ചു[a]. എന്നാൽ ബെന്യാമീന്റെ വിഹിതം മറ്റുള്ളവരിൽ ഓരോരുത്തരുടെയും വിഹിതത്തിന്റെ അഞ്ചിരട്ടിയായിരുന്നു[b]. അവർ അവനോടൊപ്പം കുടിച്ച് മത്തുപിടിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ മുമ്പിൽനിന്ന്”; യോസേഫ് ഇരുന്നിരുന്ന സ്ഥലത്തുനിന്നോ അവന്റെ മേശയിൽനിന്നോ എന്നാണ് സാധ്യത.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അഞ്ച് കൈകൾ”; അഞ്ചിരട്ടി അളവ് എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: ഈ എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം “മത്തുപിടിച്ചു” എന്നാണ്; “ആഹ്ലാദിച്ചു” എന്നും ചിലർ മൃദുവായി വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: ഭക്ഷണവിഹിതങ്ങൾ കൊടുത്തയച്ചു
  rationale: വിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയയും നാമവും ചേർന്ന് ഭക്ഷണവിഹിതങ്ങൾ അതിഥികൾക്കു കൊടുത്തയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചുമന്നു’ എന്ന അക്ഷരാർഥം ഇവിടെ യോജിക്കില്ല.
- source_word: מֵאֵת פָּנָיו
  choice: തന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘അവന്റെ മുഖത്തിന്റെ മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; യോസേഫിന്റെ സ്വന്തം ഇരിപ്പിടത്തിൽനിന്നോ മേശയിൽനിന്നോ എന്നാണ് സന്ദർഭസൂചന.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: ബെന്യാമീന്റെ വിഹിതം
  rationale: ഭക്ഷണസന്ദർഭത്തിലെ מַשְׂאַת എന്ന പദത്തിന് ‘വിഹിതം’ വ്യക്തവും മാന്യവുമായ മലയാളമാണ്.
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: മറ്റുള്ള എല്ലാവരുടെയും വിഹിതത്തെക്കാൾ അഞ്ചിരട്ടിയായിരുന്നു
  rationale: ‘അഞ്ച് കൈകൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അളവുസംബന്ധിയായ താരതമ്യബലം വ്യക്തമായി നൽകുന്നു; כֻּלָּם എന്നത് മറ്റുള്ള എല്ലാവരുടെയും വിഹിതങ്ങളുമായുള്ള താരതമ്യമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּשְׁתּוּ
  choice: അവർ ... കുടിച്ച്
  rationale: വിരുന്നിൽ പാനീയം കുടിച്ചതിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: וַיִּשְׁכְּרוּ
  choice: മത്തുപിടിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലഹരിപിടിക്കുക/മദ്യപിച്ച് മത്താകുക എന്നതാണ്; ‘സന്തോഷിച്ചു’ എന്നു മൃദൂകരിക്കാതെ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം
  rationale: മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് യോസേഫിനെ സൂചിപ്പിക്കുന്നു.
