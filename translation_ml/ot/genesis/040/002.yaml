id: GEN.40.2
reference: Genesis 40:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: ml
  text: ഫറവോൻ തന്റെ രണ്ടു ഉദ്യോഗസ്ഥരോട്—മുഖ്യ പാനപാത്രവാഹകനോടും മുഖ്യ അപ്പക്കാരനോടും—കോപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ രണ്ടു കൊട്ടാര ഉദ്യോഗസ്ഥരോട്” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ചില സന്ദർഭങ്ങളിൽ “ഷണ്ഡന്മാർ” എന്നും അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: കോപിച്ചു
  rationale: קצף കോപം സൂചിപ്പിക്കുന്നു. ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികവും തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കാത്തതുമായ മലയാളപ്രയോഗമാണ് ‘കോപിച്ചു’.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കായി മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ രൂപം.
- source_word: שְׁנֵי סָרִיסָיו
  choice: തന്റെ രണ്ടു ഉദ്യോഗസ്ഥർ
  rationale: סָרִיס എന്നതിന് കൊട്ടാര ഉദ്യോഗസ്ഥൻ എന്നും ചില സന്ദർഭങ്ങളിൽ ഷണ്ഡൻ എന്നും അർഥമാകാം. ഇവിടെ പിന്നാലെ പറയുന്ന രാജസേവന പദവികൾ കണക്കിലെടുത്ത് ശാരീരികസ്ഥിതി അനുമാനിക്കാതെ ‘ഉദ്യോഗസ്ഥർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שַׂר הַמַּשְׁקִים
  choice: മുഖ്യ പാനപാത്രവാഹകൻ
  rationale: ശַׂר തലവനെയും מַשְׁקִים പാനം വിളമ്പുന്നവരെയും സൂചിപ്പിക്കുന്നു; രാജാവിന് പാനപാത്രം നൽകുന്ന വിഭാഗത്തിന്റെ തലവൻ എന്ന പദവി സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: שַׂר הָאֹפִים
  choice: മുഖ്യ അപ്പക്കാരൻ
  rationale: ശַׂר തലവനെയും אֹפִים ചുട്ടുണ്ടാക്കുന്നവരെയോ അപ്പക്കാരെയോ സൂചിപ്പിക്കുന്നു; തൊഴിൽപദവിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עַל ... עַל ... וְעַל
  choice: …രോട്—…നോടും …നോടും—
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ മലയാളത്തിൽ ‘-രോട്/-നോട് കോപിച്ചു’ എന്നു സ്വാഭാവികമായി പറയുന്നു. ആവർത്തിക്കുന്ന עַל രണ്ടു ഉദ്യോഗസ്ഥരെ അവരുടെ പദവികളാൽ വിശദീകരിക്കുന്ന ഘടനയായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ടു ഉദ്യോഗസ്ഥർ തന്നെയാണ് തുടർന്ന് പേരെടുത്ത് പറയുന്ന മുഖ്യ പാനപാത്രവാഹകനും മുഖ്യ അപ്പക്കാരനും എന്ന സമാനാധികരണബന്ധം ദീർഘവിരാമചിഹ്നങ്ങളിലൂടെ വ്യക്തമാക്കി; എബ്രായത്തിലെ പദാവർത്തനവും മലയാളത്തിൽ കഴിയുന്നത്ര സൂക്ഷിച്ചു.
