revisions:
- from: 'അവർ അവനോട് പറഞ്ഞു: “ഞങ്ങൾ ഓരോ സ്വപ്നം കണ്ടു; എന്നാൽ അവ വ്യാഖ്യാനിക്കാൻ ആരുമില്ല.” യോസേഫ് അവരോട് പറഞ്ഞു: “വ്യാഖ്യാനങ്ങൾ ദൈവത്തിനുള്ളവയല്ലയോ?[a] ദയവായി ആ സ്വപ്നങ്ങൾ എന്നോട് പറയൂ.”'
  to: 'അവർ അവനോട് പറഞ്ഞു: “ഞങ്ങൾ ഓരോരുത്തരും ഒരു സ്വപ്നം കണ്ടു; എന്നാൽ അത് വ്യാഖ്യാനിക്കാൻ ആരുമില്ല.” യോസേഫ് അവരോട് പറഞ്ഞു: “വ്യാഖ്യാനങ്ങൾ ദൈവത്തിന്റേതല്ലയോ?[a] ദയവായി നിങ്ങളുടെ സ്വപ്നങ്ങൾ എന്നോടു പറയൂ.”'
  rationale: The revision replaces an unidiomatic distributive construction with standard Malayalam and uses the natural possessive form ‘ദൈവത്തിന്റേത്’ for the Hebrew לְ expression. It preserves the plural ‘വ്യാഖ്യാനങ്ങൾ,’ the rhetorical force of הֲלוֹא, and the polite force of נָא. ‘നിങ്ങളുടെ സ്വപ്നങ്ങൾ’ makes explicit the contextual referent of the Hebrew’s unstated object without altering the sense.
