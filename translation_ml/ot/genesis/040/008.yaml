reference: Genesis 40:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: ml
  text: 'അവർ അവനോട് പറഞ്ഞു: “ഞങ്ങൾ ഓരോരുത്തരും ഒരു സ്വപ്നം കണ്ടു; എന്നാൽ അത് വ്യാഖ്യാനിക്കാൻ ആരുമില്ല.” യോസേഫ് അവരോട് പറഞ്ഞു: “വ്യാഖ്യാനങ്ങൾ ദൈവത്തിന്റേതല്ലയോ?[a] ദയവായി നിങ്ങളുടെ സ്വപ്നങ്ങൾ എന്നോടു പറയൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യാഖ്യാനങ്ങൾ ദൈവത്തിനുള്ളവയല്ലയോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: ഞങ്ങൾ ഓരോ സ്വപ്നം കണ്ടു
  rationale: എബ്രായത്തിലെ ഏകവചന സമാനപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഒരു സ്വപ്നം ഞങ്ങൾ സ്വപ്നം കണ്ടു’ എന്നാണ്. ഇവിടെ രണ്ടു വ്യക്തികളും ഓരോ സ്വപ്നം കണ്ടതാണെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: എന്നാൽ അവ വ്യാഖ്യാനിക്കാൻ ആരുമില്ല
  rationale: പֹתֵר എന്ന കർത്തൃവാചക പങ്കുപദം ‘വ്യാഖ്യാനിക്കുന്നവൻ/വ്യാഖ്യാതാവ്’ എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ ക്രിയാരൂപം സ്വാഭാവികമാണ്; ‘അവ’ രണ്ടു പേരുടെയും സ്വപ്നങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: הֲלוֹא לֵאלֹהִים פִּתְרֹנִים
  choice: വ്യാഖ്യാനങ്ങൾ ദൈവത്തിനുള്ളവയല്ലയോ?
  rationale: הֲלוֹא സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. לֵאלֹהִים എന്നത് ഉടമസ്ഥതയെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ פִּתְרֹנִים അതേപടി നിലനിർത്തുന്നു.
- source_word: סַפְּרוּ נָא לִי
  choice: ദയവായി ആ സ്വപ്നങ്ങൾ എന്നോട് പറയൂ
  rationale: നָאയുടെ വിനയഭാവം ‘ദയവായി’ എന്നതിലൂടെ നിലനിർത്തുന്നു. എബ്രായത്തിൽ പ്രത്യക്ഷ കർമമില്ലെങ്കിലും സന്ദർഭത്തിൽ രണ്ടു പേരുടെയും സ്വപ്നങ്ങൾ പറയാനാണ് ആവശ്യപ്പെടുന്നത്.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
theological_decisions:
- issue: אֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ദൈവം
  alternative: ഒരു ദൈവം / ദേവന്മാർ
  rationale: യോസേഫ് കഥയുടെ സന്ദർഭത്തിൽ സ്വപ്നവ്യാഖ്യാനത്തിന്റെ ഉറവിടമായി യോസേഫ് അംഗീകരിക്കുന്ന ഏക സത്യദൈവത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- issue: വ്യാഖ്യാനങ്ങൾ ‘ദൈവത്തിനുള്ളവ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ഉടമസ്ഥത/അധികാരം/ഉറവിടം തുറന്ന നിലയിൽ സൂക്ഷിക്കുക
  alternative: ദൈവം മാത്രമേ വ്യാഖ്യാനിക്കൂ
  rationale: לְ ഘടനയെ കൂടുതൽ നിർവചിച്ച് ഏകാധികാരപ്രസ്താവനയാക്കാതെ, മൂലഭാഷയിലെ സംക്ഷിപ്തമായ ദൈവശാസ്ത്രപരമായ പ്രസ്താവന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ടു തടവുകാരും ഓരോ സ്വപ്നം കണ്ടുവെന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കിയിട്ടുണ്ട്; അലങ്കാരചോദ്യവും ‘വ്യാഖ്യാനങ്ങൾ’ എന്ന ബഹുവചനവും നിലനിർത്തിയിരിക്കുന്നു.
