id: GEN.40.21
reference: Genesis 40:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: ml
  text: അവൻ മുഖ്യ പാനപാത്രവാഹകനെ അവന്റെ ചുമതലയിൽ പുനഃസ്ഥാപിച്ചു; ആ പാനപാത്രവാഹകൻ പാനപാത്രം ഫറവോന്റെ കൈയിൽ വെച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: വീണ്ടും ... നിയമിച്ചു
  rationale: שוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ മുൻസ്ഥാനത്തേക്കോ മുൻചുമതലയിലേക്കോ തിരിച്ചുനിയമിക്കുന്നതു സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שַׂר הַמַּשְׁקִים
  choice: പാനപാത്രവാഹകരുടെ മേധാവി
  rationale: שַׂר എന്നത് മേധാവിയായ ഉദ്യോഗസ്ഥനെയും מַשְׁקִים രാജസന്നിധിയിൽ പാനീയം വിളമ്പുന്നവരെയും സൂചിപ്പിക്കുന്നു; രാജസഭാ പശ്ചാത്തലത്തിനു യോജിച്ച ഔദ്യോഗിക പദപ്രയോഗമാണിത്.
- source_word: עַל מַשְׁקֵהוּ
  choice: തന്റെ ചുമതലയിൽ
  rationale: അക്ഷരാർഥത്തിൽ പാനീയം വിളമ്പുന്ന സേവനത്തിലേക്ക് എന്ന ആശയമാണെങ്കിലും, മലയാളത്തിൽ ഔദ്യോഗിക പുനർനിയമനം സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കാൻ ‘തന്റെ ചുമതലയിൽ’ എന്നു നൽകി.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ എന്നാണ്; ഫറവോന്റെ കൈയിൽ പാനപാത്രം ഏൽപ്പിക്കുന്ന രാജസഭാ സേവനം ഇവിടെ അതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הַכּוֹס
  choice: പാനപാത്രം
  rationale: പാനീയം വിളമ്പാൻ ഉപയോഗിക്കുന്ന പാത്രത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַל כַּף פַּרְעֹה
  choice: ഫറവോന്റെ കൈയിൽ
  rationale: כַּף അക്ഷരാർഥത്തിൽ കൈപ്പത്തി എന്നാണെങ്കിലും, വസ്തു ഒരാളുടെ കൈയിൽ ഏൽപ്പിക്കുന്ന പ്രയോഗത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക തുല്യം ‘കൈയിൽ’ ആണ്.
