translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. രണ്ടാം ക്രിയയുടെ ഹീബ്രു കർത്താവ് വ്യാകരണപരമായി പരസ്യമായി ആവർത്തിക്കാത്തതിനാൽ, ഫറവോൻ സ്വന്തം കൈയിൽ പാത്രം വെച്ചുവെന്ന അസ്വാഭാവിക ധാരണ ഒഴിവാക്കാനും സന്ദർഭത്തിലെ പ്രവർത്തകനെ വ്യക്തമാക്കാനും ‘അയാൾ’ എന്നു നൽകി.
