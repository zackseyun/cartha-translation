source:
  edition: WLC
  text: וְ/אֵ֛ת שַׂ֥ר הָ/אֹפִ֖ים תָּלָ֑ה כַּ/אֲשֶׁ֥ר פָּתַ֛ר לָ/הֶ֖ם יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: ml
  text: എന്നാൽ പ്രധാന അപ്പക്കാരനെ തൂക്കിയിട്ടു[a]—യോസേഫ് അവർക്കു വ്യാഖ്യാനിച്ചിരുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തൂക്കി.” ഹീബ്രു ക്രിയയ്ക്ക് തൂക്കുക എന്നർഥമുണ്ട്; ചില സന്ദർഭങ്ങളിൽ ഇതു കുത്തിനാട്ടിയുള്ള വധത്തെയോ വധശേഷം ശരീരം തൂക്കിയുള്ള പ്രദർശനത്തെയോ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാതാക്കൾ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പാനപാത്രവാഹകനെ സ്ഥാനത്ത് പുനഃസ്ഥാപിച്ചതിനോടുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; אֵת എന്ന കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല.
- source_word: שַׂר הָאֹפִים
  choice: അപ്പക്കാരുടെ മേലധികാരി
  rationale: ശാരീരികമായി അപ്പം ചുടുന്നയാൾ എന്നതിലുപരി രാജസദസ്സിലെ അപ്പക്കാരുടെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെയാണ് ശീർഷകം സൂചിപ്പിക്കുന്നത്.
- source_word: תָּלָה
  choice: തൂക്കിക്കൊന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘തൂക്കുക’ എന്നതാണ്; ഈ സന്ദർഭത്തിൽ അത് വധത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ തൂക്കിലേറ്റി കൊന്നതോ, കുത്തിനാട്ടിയതോ, വധശേഷം പ്രദർശിപ്പിച്ചതോ എന്ന കൃത്യരീതി ഉറപ്പിക്കുന്നില്ല; അതിനാൽ അടിക്കുറിപ്പിൽ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: സംഭവം യോസേഫിന്റെ മുൻവ്യാഖ്യാനത്തോട് കൃത്യമായി പൊരുത്തപ്പെട്ടുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: פָּתַר
  choice: വ്യാഖ്യാനിച്ചിരുന്നത്
  rationale: സ്വപ്നസന്ദർഭത്തിൽ פתר എന്നത് ‘വ്യാഖ്യാനിക്കുക’ എന്നാണ്; മലയാളത്തിലെ പൂർവകാലരൂപം വ്യാഖ്യാനം സംഭവത്തിനു മുമ്പായിരുന്നുവെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לָהֶם
  choice: അവർക്ക്
  rationale: ബഹുവചന സർവനാമം രണ്ടു ഉദ്യോഗസ്ഥരെയും ഒരുമിച്ച് പരാമർശിക്കുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തോടുള്ള വൈരുധ്യത്തിന് ‘എന്നാൽ’ ഉപയോഗിച്ചു. വധരീതിയെക്കുറിച്ചുള്ള ഹീബ്രു പദത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
