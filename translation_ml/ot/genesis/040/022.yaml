revisions:
- from: എന്നാൽ അപ്പക്കാരുടെ മേലധികാരിയെ തൂക്കിക്കൊന്നു[a]—യോസേഫ് അവർക്കു വ്യാഖ്യാനിച്ചിരുന്നതുപോലെതന്നെ.
  to: എന്നാൽ പ്രധാന അപ്പക്കാരനെ തൂക്കിയിട്ടു[a]—യോസേഫ് അവർക്കു വ്യാഖ്യാനിച്ചിരുന്നതുപോലെതന്നെ.
