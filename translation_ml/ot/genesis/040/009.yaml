translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഇതാ’ എന്നത് മൂലപാഠത്തിലെ ദൃശ്യസജീവത സംരക്ഷിക്കുന്നു; ‘പാനപാത്രവാഹകരുടെ തലവൻ’ രാജസദസ്സിലെ ഔദ്യോഗിക ചുമതല വ്യക്തമാക്കുന്നു.
