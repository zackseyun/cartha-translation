base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: ml
  text: 'അപ്പോൾ മുഖ്യ പാനപാത്രവാഹകൻ തന്റെ സ്വപ്നം യോസേഫിനോടു വിവരിച്ചുപറഞ്ഞു; അവനോടു പറഞ്ഞു: “എന്റെ സ്വപ്നത്തിൽ, ഇതാ, എന്റെ മുമ്പിൽ ഒരു മുന്തിരിവള്ളി ഉണ്ടായിരുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എന്റെ സ്വപ്നത്തിൽ, ഇതാ, എന്റെ മുമ്പിൽ ഒരു മുന്തിരിവള്ളി.’ എബ്രായയിലെ ‘ഇതാ’ (וְהִנֵּה) സ്വപ്നദൃശ്യത്തിലേക്കു സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: വിവരിച്ചുപറഞ്ഞു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ സ്വപ്നം വിവരിച്ചുപറയുക, വിവരിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു.
- source_word: שַׂר הַמַּשְׁקִים
  choice: പാനപാത്രവാഹകരുടെ തലവൻ
  rationale: രാജാവിനു പാനീയം വിളമ്പുന്ന ഉദ്യോഗസ്ഥരുടെ മേധാവിയെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ചരിത്രപരമായ ചുമതല വ്യക്തമാക്കുന്ന മാന്യവും മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: אֶת חֲלֹמוֹ
  choice: തന്റെ സ്വപ്നം
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം കർത്താവിലേക്കുതന്നെ മടങ്ങുന്നതിനാൽ മലയാളത്തിൽ ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: לְיוֹסֵף
  choice: യോസേഫിനോടു
  rationale: לְ ഇവിടെ വിവരിക്കൽ അഭിമുഖീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘യോസേഫിനോടു’ സ്വാഭാവികമായ മലയാള പ്രയോഗമാണ്.
- source_word: וַיֹּאמֶר לוֹ
  choice: പറഞ്ഞു
  rationale: മുൻപുള്ള ‘യോസേഫിനോടു’ എന്നത് ആരോടാണ് പറഞ്ഞതെന്ന് ഇതിനകം വ്യക്തമാക്കുന്നതിനാൽ ‘അവനോടു’ വീണ്ടും ചേർക്കാതെ മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി; വാക്കിന്റെ ആശയം നിലനിൽക്കുന്നു.
- source_word: בַּחֲלוֹמִי
  choice: എന്റെ സ്വപ്നത്തിൽ
  rationale: സ്വപ്നവിവരണത്തിന് തുടക്കമിടുന്ന ഈ പദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: സ്വപ്നത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ദൃശ്യത്തിലേക്ക് സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന സൂചകത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാള തുല്യം.
- source_word: גֶפֶן
  choice: ഒരു മുന്തിരിവള്ളി
  rationale: സന്ദർഭത്തിൽ മുന്തിരിവള്ളിയെയാണ് גֶפֶן സൂചിപ്പിക്കുന്നത്; വെറും ‘വള്ളി’ എന്നതിനെക്കാൾ ആധുനിക വായനക്കാരന് വ്യക്തമാണ്.
- source_word: לְפָנַי
  choice: എന്റെ മുമ്പിൽ
  rationale: ‘എന്റെ മുമ്പിൽ’ എന്ന നേരിട്ടുള്ള സ്ഥലസൂചന; הִנֵּה സഹിതമുള്ള നാമവാക്യത്തിൽ മലയാളത്തിന് പ്രത്യേകം ക്രിയ ആവശ്യമില്ല.
