  naturalness: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ശൈലി പൊതുവേ നല്ലതാണ്. ‘നിന്റെ മേൽനിന്ന് നിന്റെ തല ഉയർത്തും’ എന്ന ക്രമം ഉദ്ദേശ്യബോധത്തോടെ അസാധാരണമായി കേൾക്കുകയും, ‘നിന്റെ തല നിന്റെ മേൽനിന്ന് ഉയർത്തും’ എന്നതിനെക്കാൾ ഗ്രഹിക്കാവുന്നതാകുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പിലെ ‘ശബ്ദകളി’ക്കു പകരം സാധാരണമായ ‘പദകളി’ ഉചിതമാണ്.
