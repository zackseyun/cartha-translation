source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: ml
  text: ഇനി മൂന്നു ദിവസം കഴിയുമ്പോൾ, ഫറവോൻ നിന്റെ മേൽനിന്ന് നിന്റെ തല ഉയർത്തും[a]; പിന്നെ നിന്നെ ഒരു മരത്തിന്മേൽ തൂക്കും[b]. പക്ഷികൾ നിന്റെ മാംസം നിന്റെ മേൽനിന്ന് തിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിന്റെ മേൽനിന്ന് നിന്റെ തല ഉയർത്തും.’ പാനപാത്രവാഹകന്റെ സ്വപ്നവ്യാഖ്യാനത്തിൽ അനുകൂലമായി ഉപയോഗിച്ച അതേ പ്രയോഗത്തെ ഇവിടെ ഭീകരമായ പദകളിയായി ഉപയോഗിച്ചിരിക്കാം; ഇവിടെ തല നീക്കിക്കളയുന്നതാണ് സൂചന.'
    reason: lexical_alternative
  - marker: b
    text: '‘നിന്നെ മരത്തിന്മേൽ തൂക്കും’ എന്നതിന് ‘നിന്നെ മരക്കുറ്റിയിൽ തൂക്കും’ അഥവാ ‘മരക്കമ്പിൽ കുത്തിനിർത്തും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു മരത്തിന്മേൽ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ഇനി മൂന്നു ദിവസം കഴിയുമ്പോൾ
  rationale: ശേഷിക്കുന്ന മൂന്നു ദിവസത്തെ ഇടവേളയ്ക്കുശേഷം സംഭവം നടക്കുമെന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ
  choice: നിന്റെ തല ... ഉയർത്തും
  rationale: മൂലഭാഷയിലെ ‘തല ഉയർത്തുക’ എന്ന പ്രയോഗവും പാനപാത്രവാഹകനെക്കുറിച്ചുള്ള അനുകൂല വ്യാഖ്യാനത്തോടുള്ള ഭീകരമായ ശബ്ദകളിയും നിലനിർത്തുന്നു.
- source_word: מֵעָלֶיךָ
  choice: നിന്റെ മേൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ അസാധാരണവും നിർണായകവുമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഇവിടെ തല ശരീരത്തിൽനിന്ന് നീക്കപ്പെടുന്നതിന്റെ സൂചനയുണ്ട്. വാക്യാവസാനത്തിലെ ആവർത്തനവും അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: നിന്നെ ഒരു മരത്തിന്മേൽ തൂക്കും
  rationale: תלה എന്നതിന്റെ സാധാരണ അർഥമായ ‘തൂക്കുക’ എന്നും עֵץ എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മരം’ എന്നും നിലനിർത്തുന്നു; കുന്തത്തിലേറ്റൽ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ വധരീതി പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: וְאָכַל הָעוֹף
  choice: പക്ഷികൾ ... തിന്നും
  rationale: ഏകവചന സമാഹാരനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകുന്നു; אכל എന്നതിന്റെ ലളിതമായ അർഥം അതിശയോക്തിയില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֶת בְּשָׂרְךָ
  choice: നിന്റെ മാംസം
  rationale: בשר എന്നതിന്റെ മൂർത്തവും കഠിനവുമായ അർഥം മയപ്പെടുത്താതെ നൽകുന്നു.
theological_decisions:
- issue: വിധിപ്രഖ്യാപനത്തിലെ വധദൃശ്യവും സാഹിത്യപരമായ ശബ്ദകളിയും മയപ്പെടുത്താതെ അവതരിപ്പിക്കൽ
  choice: ‘നിന്റെ തല നിന്റെ മേൽനിന്ന് ഉയർത്തും’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ഫറവോൻ നിന്നെ ശിരഛേദം ചെയ്ത് നിന്റെ ശരീരം ഒരു മരക്കുറ്റിയിൽ തൂക്കും’ എന്ന് വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വ്യാഖ്യാനാത്മക രൂപം സംഭവത്തിന്റെ സാധ്യതയുള്ള രീതി വ്യക്തമാക്കുമെങ്കിലും, മുൻവാക്യത്തിലെ അനുകൂലമായ ‘തല ഉയർത്തുക’ എന്ന പ്രയോഗത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ വിരോധവും മൂലപാഠത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിന്റെ കഠിനമായ വധദൃശ്യവും ആവർത്തനവും നിലനിർത്തിയിട്ടുണ്ട്; അസാധാരണമായ ‘നിന്റെ മേൽനിന്ന്’ എന്ന ഘടന സാഹിത്യപരമായ ശബ്ദകളി സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
