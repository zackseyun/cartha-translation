  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾക്കുശേഷം[a], ഈജിപ്തുരാജാവിന്റെ പാനപാത്രവാഹകനും അപ്പക്കാരനും തങ്ങളുടെ യജമാനനായ ഈജിപ്തുരാജാവിനോടു പാപം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ സംഭവങ്ങൾക്കുശേഷം.’ എബ്രായ ആഖ്യാനപ്രയോഗം കൂടുതൽ പദാനുപദമായി ‘ഈ കാര്യങ്ങൾക്കുശേഷം ഇങ്ങനെ സംഭവിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഇവയ്ക്കുശേഷം
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ സംക്രമണപ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; കൂടുതൽ പദാനുപദമായ ‘ഈ കാര്യങ്ങൾക്കുശേഷം സംഭവിച്ചതെന്തെന്നാൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חָטְאוּ
  choice: പാപം ചെയ്തു
  rationale: לְ ചേർന്നിരിക്കുന്നതിനാൽ ഒരാളോടു തെറ്റുചെയ്യുക/പാപംചെയ്യുക എന്ന ബന്ധപരവും ധാർമികവുമായ ശക്തി നിലനിർത്തുന്നു; ‘അപരാധം ചെയ്തു’ എന്നും സാധ്യമെങ്കിലും അത് നിയമപരമായ അർഥത്തിലേക്ക് ചുരുങ്ങാൻ ഇടയുണ്ട്.
- source_word: מַשְׁקֵה
  choice: പാനപാത്രവാഹകൻ
  rationale: രാജാവിന്റെ പാനീയം വിളമ്പുന്ന ഔദ്യോഗിക സേവകനെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘മുഖ്യ’ എന്ന പദവി ചേർക്കുന്നില്ല.
- source_word: הָאֹפֶה
  choice: അപ്പക്കാരൻ
  rationale: നിശ്ചയാർഥമുള്ള കർത്തൃവാചക രൂപം ‘അപ്പക്കാരൻ’ എന്നാണ്; മൂലത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമമോ ‘മുഖ്യ’ എന്ന പദവിയോ ചേർക്കുന്നില്ല.
- source_word: לַאֲדֹנֵיהֶם
  choice: തങ്ങളുടെ യജമാനനായ
  rationale: ഇവിടെ אֲדֹנִים ദൈവിക നാമമല്ല, ഇരുവരുടെയും മാനുഷിക മേലധികാരിയായ രാജാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യജമാനൻ’ രാജസേവകരുടെ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: ഈജിപ്തുരാജാവിനോടു
  rationale: ‘തങ്ങളുടെ യജമാനൻ’ ആരെന്ന് വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗം നിലനിർത്തുകയും, എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: חָטְאוּ എന്ന ക്രിയയുടെ ധാർമിക ശക്തി
  choice: പാപം ചെയ്തു
  alternative: തെറ്റു ചെയ്തു / അപരാധം ചെയ്തു
  rationale: പദത്തിന് ഇവിടെ രാജാവിനെതിരായ കുറ്റം എന്ന അർഥവും ഉണ്ടായേക്കാം; എങ്കിലും ‘പാപം ചെയ്തു’ എന്നത് മൂലപദത്തിന്റെ ധാർമിക-ബന്ധപരമായ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു. കുറ്റത്തിന്റെ സ്വഭാവം വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാനപാത്രവാഹകൻ’ രാജസഭയിലെ ഉദ്യോഗത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘അപ്പക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദമാണ്. മൂലത്തിലെ ആവർത്തനവും കുറ്റത്തിന്റെ വ്യക്തമാക്കാത്ത സ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
