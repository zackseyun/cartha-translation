  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: ml
  text: ഈജിപ്തുരാജാവിന്റെ പാനപാത്രവാഹകനും അപ്പക്കാരനും കാരാഗൃഹത്തിൽ തടവിലായിരുന്ന അവർ രണ്ടുപേരും ഒരേ രാത്രിയിൽ ഓരോരുത്തനും തന്റെ സ്വപ്നം കണ്ടു; ഓരോ സ്വപ്നത്തിനും അതിന്റേതായ വ്യാഖ്യാനമുണ്ടായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഓരോരുത്തനും തന്റെ സ്വപ്നത്തിന്റെ വ്യാഖ്യാനത്തിനൊത്തവണ്ണം സ്വപ്നം കണ്ടു.” ഓരോ സ്വപ്നത്തിനും അതിനനുയോജ്യമായ വേറിട്ട വ്യാഖ്യാനം ഉണ്ടായിരുന്നു എന്നതാണ് ഹീബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: അവർ രണ്ടുപേരും ... ഓരോ സ്വപ്നം കണ്ടു
  rationale: ഹീബ്രായയിലെ ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകും. ‘രണ്ടുപേരും’ എന്നത് שְׁנֵיהֶם എന്നതിന്റെ ദ്വിത്വം വ്യക്തമാക്കുന്നു; പിന്നാലെയുള്ള വിതരണാർഥത്തോട് ചേർന്ന് ‘ഓരോ സ്വപ്നം’ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: בְּלַיְלָה אֶחָד
  choice: ഒരേ രാത്രിയിൽ
  rationale: അക്ഷരാർഥമായ ‘ഒരു രാത്രിയിൽ’ സാധ്യമെങ്കിലും, ഇരുവരും പങ്കിട്ട അതേ രാത്രിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘ഒരേ രാത്രിയിൽ’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אִישׁ חֲלֹמוֹ ... אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: ഓരോ സ്വപ്നം ... ഓരോരുത്തന്റെയും സ്വപ്നത്തിന് അതതിന്റെ അർഥം ഉണ്ടായിരുന്നു
  rationale: אִישׁ എന്നതിന്റെ ആവർത്തനം നൽകുന്ന വിതരണാർഥവും כְּ സൂചിപ്പിക്കുന്ന ഓരോ സ്വപ്നത്തിനും യോജിച്ച വ്യത്യസ്ത വ്യാഖ്യാനമുണ്ടെന്ന ആശയവും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַמַּשְׁקֶה
  choice: പാനപാത്രവാഹകൻ
  rationale: രാജാവിന് പാനം വിളമ്പുന്ന ഔദ്യോഗിക ചുമതലയുള്ള ആളെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘മുഖ്യ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: הָאֹפֶה
  choice: അപ്പക്കാരൻ
  rationale: ചുട്ട ഭക്ഷണം, പ്രത്യേകിച്ച് അപ്പം, തയ്യാറാക്കുന്ന രാജസേവകനെ സൂചിപ്പിക്കുന്ന ലളിതവും ഗ്രാഹ്യവുമായ പദം; ‘മുഖ്യ’ എന്നത് മൂലപാഠത്തിൽ ഇല്ല.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവിന്റെ ... ആയ
  rationale: לְ സൂചിപ്പിക്കുന്ന രാജാവിനോടുള്ള ഔദ്യോഗിക ബന്ധം മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപത്തിലൂടെ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു; ഇവർ രാജാവിന്റെ സേവനത്തിൽപ്പെട്ട ഉദ്യോഗസ്ഥരാണെന്നത് പദവിനാമങ്ങളിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: കാരാഗൃഹത്തിൽ തടവിലായിരുന്നു
  rationale: אסר എന്നതിന്റെ ബന്ധിക്കപ്പെട്ട/തടവിലാക്കപ്പെട്ട എന്ന അർഥവും בֵּית הַסֹּהַר എന്ന കാരാഗൃഹസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: כְּפִתְרוֹן എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഓരോരുത്തന്റെയും സ്വപ്നത്തിന് അതതിന്റെ അർഥം ഉണ്ടായിരുന്നു
  alternative: ഓരോരുത്തനും തന്റെ സ്വപ്നത്തിന്റെ വ്യാഖ്യാനത്തിനനുസരിച്ച് സ്വപ്നം കണ്ടു
  rationale: സ്വപ്നവും അതിന്റെ പ്രത്യേക വ്യാഖ്യാനവും തമ്മിലുള്ള പൊരുത്തം നിലനിർത്തുന്നു; വ്യാഖ്യാനം സ്വപ്നം കാണുന്ന പ്രവൃത്തിയെ കാരണപരമായി നിയന്ത്രിച്ചു എന്ന അധിക ആശയം ചേർക്കുന്നില്ല. ‘അർഥം’ എന്നത് ഇവിടെ സ്വപ്നത്തിന്റെ വ്യാഖ്യാനാർഥത്തിലാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ഹീബ്രായ വാക്യഘടനയിലെ വിതരണാർഥം സംരക്ഷിച്ചെങ്കിലും, മലയാളത്തിൽ അസ്വാഭാവികമായ ധാതു-നാമ ആവർത്തനം ഒഴിവാക്കി. ‘കാരാഗൃഹം’ ഔപചാരികവും വ്യക്തവുമാണ്; രാജകീയ പദവികൾക്ക് സന്ദർഭോചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു.
