source:
  edition: WLC
  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: ml
  text: അങ്ങനെ അകമ്പടിസേനയുടെ തലവൻ യോസേഫിനെ അവർക്കായി നിയോഗിച്ചു[a]; അവൻ അവരെ പരിചരിച്ചു. അവർ കുറെക്കാലം തടങ്കലിൽ കഴിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോസേഫിനെ അവരുടെ മേൽ നിയമിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് ഉത്തരവാദിത്വത്തിലേക്ക് നിയമിക്കുക എന്ന അർഥമുണ്ട്; യോസേഫ് അവരെ പരിചരിക്കുന്നതിനായോ അവരുടെ മേൽനോട്ടം വഹിക്കുന്നതിനായോ നിയോഗിക്കപ്പെട്ടതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പദാനുപദമായി, “അവർ തടങ്കലിൽ ദിവസങ്ങളായി ഉണ്ടായിരുന്നു”; അവർ അവിടെ ഒരു കാലയളവ് തുടർന്നു എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: ചുമതലപ്പെടുത്തി
  rationale: פקד ഇവിടെ ഒരാളെ ഒരു ഉത്തരവാദിത്വത്തിനായി നിയമിക്കുകയോ ഏൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്ന് വരുന്ന സേവനവുമായി ഇത് സ്വാഭാവികമായി ബന്ധപ്പെടുന്നു; മേൽനോട്ടമെന്ന ശക്തമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: שַׂר הַטַּבָּחִים
  choice: അകമ്പടിസേനയുടെ തലവൻ
  rationale: പദാനുപദമായി വധകർ/അറവുകാർ എന്നിവരുടെ തലവൻ എന്നാണെങ്കിലും, ഉല്പത്തിയിലെ രാജസുരക്ഷാ ഉദ്യോഗസ്ഥന്റെ ഔദ്യോഗിക പദവിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ഈ പരിഭാഷ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: യോസേഫിനെ അവരോടൊപ്പം
  rationale: യോസേഫിനെ ആ തടവുകാരുമായി ബന്ധപ്പെടുത്തി ചുമതലപ്പെടുത്തിയെന്ന വാക്യഘടന സംരക്ഷിക്കുന്നു. 'അവരുടെ മേൽ' എന്ന ഭരണപരമായ അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: അവരെ ശുശ്രൂഷിച്ചു
  rationale: שרת എന്നത് സേവിക്കുക, പരിചരിക്കുക, ആവശ്യങ്ങൾ നോക്കുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ മതപരമായ സാങ്കേതിക അർഥമല്ല, തടവുകാരെ പരിചരിക്കുന്ന സേവനമാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്.
- source_word: וַיִּהְיוּ יָמִים
  choice: കുറെക്കാലം കഴിഞ്ഞു
  rationale: പദാനുപദമായി 'അവർ ദിവസങ്ങൾ ആയിരുന്നു' എന്ന എബ്രായ പ്രയോഗം ഒരു നിർവചിക്കാത്ത കാലയളവ് അവിടെ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּמִשְׁמָר
  choice: കാവലിൽ
  rationale: מִשְׁמָר തടവ്, കാവൽ, സംരക്ഷിത തടങ്കൽ എന്നിവ സൂചിപ്പിക്കുന്നു. 'കാവലിൽ' എന്നത് ജയിലിടം മാത്രമല്ല, കാവൽനിലയിലുള്ള തടങ്കലും ഉൾക്കൊള്ളുന്നു.
