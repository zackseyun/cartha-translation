revisions:
- from: അങ്ങനെ അകമ്പടിസേനയുടെ തലവൻ യോസേഫിനെ അവരോടൊപ്പം ചുമതലപ്പെടുത്തി[a]; അവൻ അവരെ ശുശ്രൂഷിച്ചു. അവർ കുറെക്കാലം കാവലിൽ കഴിഞ്ഞു[b].
  to: അങ്ങനെ അകമ്പടിസേനയുടെ തലവൻ യോസേഫിനെ അവർക്കായി നിയോഗിച്ചു[a]; അവൻ അവരെ പരിചരിച്ചു. അവർ കുറെക്കാലം തടങ്കലിൽ കഴിഞ്ഞു[b].
  rationale: The revision removes an ambiguity in the assignment clause, uses a clearer custodial term, and improves the idiomatic Malayalam of the temporal footnote. It preserves the source’s paratactic narration and leaves the possible oversight nuance in a footnote rather than imposing it in the main text.
