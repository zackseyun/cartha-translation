translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ മൂലത്തിലെ പരമ്പരാഗത വാക്യബന്ധം നിലനിർത്തിയപ്പോൾ, സമയസൂചകമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. പദവിക്കും തടങ്കൽസ്ഥിതിക്കും സന്ദർഭോചിതവും മതവിഭാഗനിരപേക്ഷവുമായ പദങ്ങൾ തിരഞ്ഞെടുത്തു.
