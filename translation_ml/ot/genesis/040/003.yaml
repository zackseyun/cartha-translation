translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ അടുക്കിയ സ്ഥാനസൂചനകൾ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നതിനായി മുഖ്യവാക്യത്തിൽ സംയോജിപ്പിച്ചെങ്കിലും അവയുടെ ഘടനാപരമായ അനിശ്ചിതത്വം [c] അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
