  to: അവൻ അവരെ അംഗരക്ഷകസേനാധിപന്റെ[a] വീട്ടിലെ തടവറയിൽ[b] കാവലിൽ വെച്ചു[c], അതായത് യോസേഫ് തടവിലായിരുന്ന സ്ഥലത്ത്.
