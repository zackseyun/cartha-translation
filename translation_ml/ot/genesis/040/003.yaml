id: GEN.40.3
reference: Genesis 40:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: ml
  text: അവൻ അവരെ അംഗരക്ഷകസേനാധിപന്റെ[a] വീട്ടിലെ തടവറയിൽ[b] കാവലിൽ വെച്ചു[c], അതായത് യോസേഫ് തടവിലായിരുന്ന സ്ഥലത്ത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അംഗരക്ഷകസേനാധിപൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വധകരുടെ തലവൻ’ അല്ലെങ്കിൽ ‘അറവുകാരുടെ തലവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘കാരാഗൃഹം’ അല്ലെങ്കിൽ ‘തടങ്കൽഗൃഹം’.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായ വാക്യഘടനയെ കൂടുതൽ ഔപചാരികമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം: ‘അവരെ അംഗരക്ഷകസേനാധിപന്റെ വീട്ടിൽ കാവലിൽ വെച്ചു, തടവറയിലേക്കു—യോസേഫ് അവിടെ തടവിലായിരുന്ന സ്ഥലത്തേക്കു.’ ‘അംഗരക്ഷകസേനാധിപന്റെ വീട്’ എന്നും ‘തടവറ’ എന്നും ഒരേ സമുച്ചയത്തെ പടിപടിയായി വ്യക്തമാക്കുന്നതായും വായിക്കാം.'
    reason: structural_ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കാവലിലാക്കി
  rationale: ഇവിടെ נָתַן എന്നതിന് അക്ഷരാർഥമായ ‘കൊടുത്തു’ എന്നതല്ല, ഒരാളെ കാവലിലോ തടങ്കലിലോ ആക്കുക എന്ന സന്ദർഭോചിതമായ അർഥമാണ്. തുടർന്നുള്ള בְּמִשְׁמַר എന്ന പദത്തോടു ചേർത്ത് ‘കാവലിലാക്കി’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: אֹתָם
  choice: അവരെ
  rationale: മുൻസന്ദർഭത്തിലെ രണ്ടു രാജകാര്യസ്ഥന്മാരെയാണ് ബഹുവചന കർമസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: בְּמִשְׁמַר
  choice: കാവലിൽ
  rationale: מִשְׁמָר എന്നതിന് കാവൽ, തടങ്കൽ, കസ്റ്റഡി എന്നീ അർഥങ്ങളുണ്ട്. തടവിന്റെ നിയമപരവും ഭൗതികവുമായ ഭാവം ലളിതമായി അറിയിക്കാൻ ‘കാവൽ’ അനുയോജ്യമാണ്.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: അംഗരക്ഷകസേനാധിപന്റെ വീട്
  rationale: ഉല്പത്തിയിലെ ഈ രാജകീയ ഉദ്യോഗപദവിക്ക് ‘അംഗരക്ഷകസേനാധിപൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളമാണ്; എന്നാൽ പദത്തിന്റെ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: കാരാഗൃഹത്തിൽ
  rationale: בֵּית הַסֹּהַר തടവിടത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘കാരാഗൃഹം’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ പദമാണ്.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: യോസേഫ് തടവിലായിരുന്നതും അവിടെയായിരുന്നു
  rationale: אָסוּר എന്നത് അക്ഷരാർഥത്തിൽ ‘ബന്ധിക്കപ്പെട്ട’ എന്നും സന്ദർഭത്തിൽ ‘തടവിലാക്കപ്പെട്ട’ എന്നും വരാം. ‘തടവിലായിരുന്നു’ കാരാഗൃഹസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; שָׁם എന്നത് ‘അവിടെ’ എന്നു പ്രകടമായി നിലനിർത്തുന്നു.
