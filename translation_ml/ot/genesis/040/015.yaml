source:
  edition: WLC
  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: ml
  text: എന്തെന്നാൽ, എബ്രായരുടെ ദേശത്തുനിന്ന് എന്നെ തീർച്ചയായും തട്ടിക്കൊണ്ടുപോയി[a]; ഇവിടെയും എന്നെ ഈ കുഴിയിൽ[b] ഇടാൻ തക്കതായ യാതൊന്നും ഞാൻ ചെയ്തിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഞാൻ തീർച്ചയായും മോഷ്ടിക്കപ്പെട്ടു’ അല്ലെങ്കിൽ ‘എന്നെ മോഷ്ടിച്ചുകൊണ്ടുപോയി.’ എബ്രായത്തിൽ ക്രിയാനാമവും സമാപികാക്രിയയും ഒരുമിച്ച് ഉപയോഗിച്ച് ആശയത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കുഴി’ എന്ന പദം ഈ സന്ദർഭത്തിൽ ഭൂഗർഭത്തടവറയെയോ തടവുമുറിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: യോസേഫ് തന്റെ അഭ്യർഥനയ്ക്കു നൽകുന്ന വിശദീകരണവും കാരണവും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: എന്നെ തീർച്ചയായും തട്ടിക്കൊണ്ടുപോയതാണ്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’ കൊണ്ടു നിലനിർത്തുന്നു; ഒരു വ്യക്തിയെ ബലമായി കൊണ്ടുപോയെന്ന ആശയം ‘തട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: എബ്രായരുടെ ദേശത്തുനിന്ന്
  rationale: വംശനാമം നിലനിർത്തുകയും നിർദിഷ്ടമായ ഒരു രാഷ്ട്രീയ ഭൂപ്രദേശം അനാവശ്യമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְגַם פֹּה
  choice: ഇവിടെയും
  rationale: മുമ്പുണ്ടായ അനീതിക്കു പുറമേ ഈ സ്ഥലത്തും താൻ നിരപരാധിയാണെന്ന കൂട്ടിച്ചേർക്കൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: ഞാൻ ഒന്നും ചെയ്തിട്ടില്ല
  rationale: പൂർണമായ നിഷേധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: എന്നെ ... ഇടാൻ തക്കതായി
  rationale: തടവിലാക്കാൻ ന്യായമായ കാരണമാകുന്ന യാതൊന്നും താൻ ചെയ്തിട്ടില്ലെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; എബ്രായത്തിലെ כִּי ഇവിടെ ഫലമോ ന്യായീകരണമോ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നു.
- source_word: בַּבּוֹר
  choice: ഈ കുഴിയിൽ
  rationale: בּוֹר എന്നതിന്റെ അടിസ്ഥാന ദൃശ്യമായ ‘കുഴി’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് തടവറയെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തിയപ്പോൾ, ‘കുഴി’ എന്ന മൂലദൃശ്യം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകി.
