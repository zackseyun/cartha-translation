source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יוֹסֵ֖ף בַּ/בֹּ֑קֶר וַ/יַּ֣רְא אֹתָ֔/ם וְ/הִנָּ֖/ם זֹעֲפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: ml
  text: രാവിലെ യോസേഫ് അവരുടെ അടുക്കൽ വന്നു; അവരെ കണ്ടു; ഇതാ, അവർ വിഷണ്ണരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനം കലങ്ങിയവരായി,’ ‘മ്ലാനരായി,’ അല്ലെങ്കിൽ ‘മുഖം വാടിയവരായി.’ എബ്രായപദം പുറമേ പ്രകടമായ അസ്വസ്ഥമോ വിഷണ്ണമോ ആയ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: അവരുടെ അടുക്കൽ വന്നു
  rationale: בוא എന്ന ക്രിയയോടുകൂടിയ אֲלֵיהֶם ദിശയും വ്യക്തികളിലേക്കുള്ള സമീപനവും സൂചിപ്പിക്കുന്നു. ‘അവരുടെ അടുക്കൽ വന്നു’ എന്നത് ആ ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: നിശ്ചിതമായ പ്രഭാതസമയത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘രാവിലെ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: וַיַּרְא אֹתָם וְהִנָּם
  choice: അവരെ കണ്ടപ്പോൾ, ... അവൻ ശ്രദ്ധിച്ചു
  rationale: ראה എന്നത് നേരിട്ടുള്ള കാഴ്ചയും הִנָּם യോസേഫിന്റെ ശ്രദ്ധയിൽപ്പെട്ട അവസ്ഥയിലേക്കുള്ള അവതരണബലവും നൽകുന്നു. മലയാളത്തിൽ ‘കണ്ടപ്പോൾ ... ശ്രദ്ധിച്ചു’ എന്ന് പറഞ്ഞത് ഇരുവരുടെയും പ്രവർത്തനം സ്വാഭാവികമായി പകരുന്നു; എന്നാൽ പ്രത്യേകമായ ഒരു ഉറ്റുനോട്ടം മൂലപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: זֹעֲפִים
  choice: വിഷണ്ണരായിരിക്കുന്നതായി
  rationale: ഈ പദം മുഖഭാവത്തിൽ പ്രകടമായ അസ്വസ്ഥത, മ്ലാനത, മനോവിഷമം എന്നിവ ഉൾക്കൊള്ളാം. സന്ദർഭത്തിൽ ‘വിഷണ്ണർ’ ഈ വിശാലമായ വികാരാവസ്ഥയെ സ്വാഭാവികമായി പകരുന്നു; സാധ്യതയുള്ള മറ്റ് സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
