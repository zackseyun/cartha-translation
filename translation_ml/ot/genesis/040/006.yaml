translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള കഥനശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവപരമ്പരയും യോസേഫ് ശ്രദ്ധിച്ച ദൃശ്യാവസ്ഥയും നിലനിർത്തിയിരിക്കുന്നു.
