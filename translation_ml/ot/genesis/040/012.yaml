id: GEN.40.12
reference: Genesis 40:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑/וֹ שְׁלֹ֨שֶׁת֙ הַ/שָּׂ֣רִגִ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് അവനോടു പറഞ്ഞു: “ഇതിന്റെ വ്യാഖ്യാനം ഇതാണ്: ആ മൂന്നു ശാഖകൾ മൂന്നു ദിവസങ്ങളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ക്രമസൂചന നിലനിർത്തുന്നു.
- source_word: לוֹ
  choice: അവനോടു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ സർവനാമപദം നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ പാനപാത്രവാഹകൻ എന്നു വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: פִּתְרֹנוֹ
  choice: ഇതിന്റെ വ്യാഖ്യാനം
  rationale: സ്വപ്നദൃശ്യത്തിന്റെ അർത്ഥവിവരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പുരുഷലിംഗ ഏകവചന പ്രത്യയം മലയാളത്തിൽ സന്ദർഭോചിതമായി ‘ഇതിന്റെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: שְׁלֹשֶׁת הַשָּׂרִגִים
  choice: ആ മൂന്നു ശാഖകൾ
  rationale: നിശ്ചിതത്വവും ആവർത്തിച്ചിരിക്കുന്ന ‘മൂന്ന്’ എന്ന സംഖ്യയും സംരക്ഷിക്കുന്നു; ശാഖകൾ എന്നത് മുന്തിരിവള്ളിയുടെ ഭാഗങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יָמִים
  choice: ദിവസങ്ങൾ
  rationale: കാലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു.
- source_word: הֵם
  choice: ആണ്
  rationale: എബ്രായത്തിലെ ഊന്നിയ സമീകരണത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിധേയഘടനയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. എബ്രായവാക്യത്തിന്റെ വിശദീകരണഘടനയും ‘മൂന്ന്’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ [a] അടയാളം ‘to him’ എന്നതിനുശേഷം തെറ്റായി സ്ഥിതിചെയ്യുന്നതായി തോന്നുന്നതിനാലും അതിന്റെ കുറിപ്പ് ‘branches’ എന്ന പദത്തിന്റെ lexical alternative ആണെങ്കിലും മലയാളത്തിൽ ‘ശാഖകൾ’ വ്യക്തവും ആവശ്യത്തിന് വിശാലവുമായതിനാലും അനാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
