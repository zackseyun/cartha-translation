translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം മാന്യവുമായ മലയാളം. യോസേഫിന്റെ വിനീതവും അടിയന്തരവുമായ അഭ്യർഥന ‘ഓർക്കണമേ’, ‘ദയവായി’, ‘ചെയ്യണമേ’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി.
