id: GEN.40.14
reference: Genesis 40:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: ml
  text: എന്നാൽ നിനക്കു നന്മ വരുമ്പോൾ എന്നെ ഓർക്കണമേ[a]. ദയവായി എന്നോടു ദയ കാണിച്ച്, ഫറവോനോട് എന്നെക്കുറിച്ചു പറയുകയും ഈ വീട്ടിൽനിന്ന്[b] എന്നെ പുറത്തുകൊണ്ടുവരുകയും ചെയ്യണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എന്നെ നിന്നോടൊപ്പം ഓർക്കണമേ’; ഇവിടെ അതിന്റെ അർഥം ‘എന്നെ മനസ്സിൽ സൂക്ഷിക്കണമേ’ എന്നാണ്.
    reason: lexical_nuance
  - marker: b
    text: ഹീബ്രുവിൽ ‘വീട്’; ഇവിടെ തടവിലാക്കിയിരിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘ഈ തടവറയിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിനു പിന്നാലെ യോസേഫിന്റെ അഭ്യർഥന അവതരിപ്പിക്കുന്ന വിരുദ്ധഭാവം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള കാലസൂചക ഉപവാക്യം നിബന്ധനയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: എന്നെ ഓർക്കണമേ
  rationale: זכר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ഓർക്കുക’ എന്നാണ്. אִתְּךָ അക്ഷരാർഥത്തിൽ ‘നിന്നോടൊപ്പം’ എന്നാണെങ്കിലും ഇവിടെ ഓർമയിൽ സൂക്ഷിക്കുക എന്ന ആശയത്തെ ഊന്നുന്ന ഹീബ്രു പ്രയോഗമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ചേർത്താൽ അസ്വാഭാവികമാകും.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: നിനക്കു നന്മ വരുമ്പോൾ
  rationale: പാനപാത്രവാഹകന്റെ സ്ഥിതി വീണ്ടും മെച്ചപ്പെടുകയും അവന് ക്ഷേമം വരുകയും ചെയ്യുന്ന സമയത്തെയാണ് ഈ വാക്കുകൾ സൂചിപ്പിക്കുന്നത്.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: ദയവായി എന്നോടു ദയ കാണിച്ച്
  rationale: נָא അഭ്യർഥനയുടെ വിനയം ‘ദയവായി’ എന്നു പ്രകടമാക്കുന്നു. חֶסֶד ഇവിടെ ഔപചാരിക ഉടമ്പടിപദത്തേക്കാൾ യോസേഫ് അഭ്യർഥിക്കുന്ന പ്രായോഗിക ദയയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: ഫറവോനോട് എന്നെക്കുറിച്ചു പറയുകയും
  rationale: זכר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ യോസേഫിനെ ഫറവോന്റെ ശ്രദ്ധയിൽപ്പെടുത്തുക, അഥവാ അവനെക്കുറിച്ചു പറയുക എന്ന അർഥത്തിലാണ്.
- source_word: וְהוֹצֵאתַנִי
  choice: എന്നെ പുറത്തുകൊണ്ടുവരുകയും
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം ‘പുറത്തുവരാൻ ഇടയാക്കുക’ എന്നാണ്; ‘പുറത്തുകൊണ്ടുവരുക’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִן הַבַּיִת הַזֶּה
  choice: ഈ വീട്ടിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ בַּיִת എന്ന ‘വീട്’ എന്ന പദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് തടവിലാക്കിയിരിക്കുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
