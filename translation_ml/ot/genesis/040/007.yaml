  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: ml
  text: അപ്പോൾ അവൻ, തന്റെ യജമാനന്റെ വീട്ടിൽ തന്നോടൊപ്പം തടങ്കലിൽ ആയിരുന്ന ഫറവോന്റെ ഉദ്യോഗസ്ഥരോട്[a], “ഇന്ന് നിങ്ങളുടെ മുഖം വാടിയിരിക്കുന്നത് എന്തുകൊണ്ട്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഫറവോന്റെ ഷണ്ഡന്മാരോട്”; എബ്രായപദം യഥാർഥ ഷണ്ഡന്മാരെയോ പൊതുവായി രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: അപ്പോൾ ... ചോദിച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: סְרִיסֵי פַרְעֹה
  choice: ഫറവോന്റെ ഉദ്യോഗസ്ഥർ
  rationale: סָרִיס എന്ന പദം ഷണ്ഡന്മാരെയോ രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം. ഇവിടെ അവരുടെ ഔദ്യോഗിക സ്ഥാനം മുൻനിൽക്കുന്നതിനാൽ പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ നൽകി, കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: തന്നോടൊപ്പം കാവലിൽ കഴിഞ്ഞിരുന്ന
  rationale: പ്രസംഗസന്ദർഭത്തിൽ സർവനാമം യോസേഫിനെ സൂചിപ്പിക്കുന്നു. ‘കാവലിൽ’ തടങ്കലിലായിരുന്ന അവസ്ഥയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּית אֲדֹנָיו
  choice: തന്റെ യജമാനന്റെ വീട്ടിൽ
  rationale: אָדוֹן ഇവിടെ യോസേഫിന്റെ യജമാനനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വീട്’ എന്നത് ആ ഭവനപരിസരത്തിലെ തടവുസ്ഥലവും ഉൾക്കൊള്ളാം.
- source_word: לֵאמֹר
  choice: എന്നു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള ഉദ്ധരണിചിഹ്നമാണ് ‘എന്നു’.
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים הַיּוֹם
  choice: ഇന്ന് നിങ്ങളുടെ മുഖം വാടിയിരിക്കുന്നത് എന്തുകൊണ്ട്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ മുഖങ്ങൾ മോശമായിരിക്കുന്നു’ എന്ന പ്രയോഗം ദുഃഖമോ വിഷാദമോ മുഖത്ത് പ്രകടമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മുഖം വാടിയിരിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പദക്രമം നിർബന്ധമായി അനുകരിക്കാതെ അതിന്റെ ബന്ധങ്ങളും അർഥവ്യാപ്തിയും നിലനിർത്തി.
