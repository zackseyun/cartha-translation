id: GEN.40.17
reference: Genesis 40:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: ml
  text: ഏറ്റവും മുകളിലുള്ള കൊട്ടയിൽ ഫറവോനുവേണ്ടിയുള്ള എല്ലാത്തരം ഭക്ഷണസാധനങ്ങളും—അപ്പക്കാരൻ തയ്യാറാക്കിയവ—ഉണ്ടായിരുന്നു; എന്റെ തലയ്ക്കു മുകളിലുള്ള ആ കൊട്ടയിൽനിന്ന് പക്ഷികൾ അവ തിന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: ഏറ്റവും മുകളിലുള്ള കൊട്ടയിൽ
  rationale: עֶלְיוֹן എന്നത് ഇവിടെയുള്ള കൊട്ടകളിൽ ഏറ്റവും മുകളിലുള്ളതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ആ സ്ഥാനബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: ഫറവോനുവേണ്ടിയുള്ള സകലവിധ ഭക്ഷണവും
  rationale: מִכֹּל എന്നതും ഏകവചനമായ കൂട്ടനാമം מַאֲכַל എന്നതും ചേർന്ന് ഭക്ഷണത്തിന്റെ വൈവിധ്യം സൂചിപ്പിക്കുന്നു; 'വേണ്ടിയുള്ള' എന്നത് Pharaoh-നായി ഒരുക്കിയതെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: അപ്പക്കാരൻ ഉണ്ടാക്കിയവ
  rationale: അക്ഷരാർഥത്തിൽ 'അപ്പക്കാരന്റെ പ്രവൃത്തി'; സന്ദർഭത്തിൽ അപ്പക്കാരൻ തയ്യാറാക്കിയ ഭക്ഷണവസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. അമിതമായി പ്രത്യേകീകരിക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: וְהָעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף ഇവിടെ പറവജാതിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ബഹുവചനം അനുയോജ്യമാണ്.
- source_word: אֹכֵל
  choice: തിന്നുകൊണ്ടിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക രൂപം സ്വപ്നരംഗത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ ചിത്രീകരിക്കുന്നു.
- source_word: אֹתָם
  choice: അവ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം കൊട്ടയിലെ ഭക്ഷണവസ്തുക്കളിലേക്കാണ് തിരിഞ്ഞുനിൽക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സർവനാമം ഉപയോഗിച്ചു.
- source_word: מִן הַסַּל
  choice: ആ കൊട്ടയിൽനിന്ന്
  rationale: מן ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; നേരത്തേ പറഞ്ഞ മുകളിലെ കൊട്ടയാണെന്ന് 'ആ' വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל רֹאשִׁי
  choice: എന്റെ തലയ്ക്കു മുകളിലുള്ള
  rationale: מֵעַל തലയുടെ മുകളിലുള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; കൊട്ട തലയിൽ സ്പർശിച്ചിരുന്നുവെന്ന് നിർബന്ധമായി പറയാതെ യഥാർഥ സ്ഥലബന്ധം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ ക്രിയാരഹിത ആദ്യഖണ്ഡത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായി 'ഉണ്ടായിരുന്നു' ചേർത്തു. מַעֲשֵׂה אֹפֶה എന്ന പ്രയോഗം അർഥവ്യക്തതയ്ക്കായി 'അപ്പക്കാരൻ ഉണ്ടാക്കിയവ' എന്നു നൽകി; അങ്ങനെ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് പ്രധാനവാചകത്തിനുള്ളിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
