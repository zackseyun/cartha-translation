  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: ml
  text: 'അപ്പക്കാരുടെ തലവൻ അവൻ നല്ലവിധം വ്യാഖ്യാനിച്ചതായി കണ്ടപ്പോൾ യോസേഫിനോടു പറഞ്ഞു: “ഞാനും ഒരു സ്വപ്നം കണ്ടു. അതാ, എന്റെ തലയിൽ വെളുത്ത അപ്പത്തിന്റെ മൂന്നു കൊട്ടകൾ ഉണ്ടായിരുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചുട്ട പലഹാരങ്ങളുടെ മൂന്നു കൊട്ടകൾ.’ חֹרִי എന്ന എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. അത് വെളുത്ത അപ്പം/അപ്പക്കഷണങ്ങൾ പോലുള്ള കൊട്ടകളിലെ സാധനങ്ങളെയോ, ദ്വാരങ്ങളുള്ളതോ നെയ്തതോ ആയ കൊട്ടകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: അപ്പക്കാരുടെ തലവൻ
  rationale: שַׂר ഒരു മുഖ്യ ഉദ്യോഗസ്ഥനെയും הָאֹפִים അപ്പം ചുടുന്നവരെയും സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം പദവിയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי טוֹב פָּתָר
  choice: അവൻ നല്ലവിധം വ്യാഖ്യാനിച്ചതായി
  rationale: യോസേഫിന്റെ വ്യാഖ്യാനം നല്ലതോ വിജയകരമോ ആയി തോന്നിയെന്ന അർഥം നിലനിർത്തുന്നു; ‘അനുകൂലമായി’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: ഞാനും ഒരു സ്വപ്നം കണ്ടു
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തവും ക്രിയാരഹിതവുമായ സ്വപ്നവിവരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുകയും אַף אֲנִי എന്നതിലെ കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: സ്വപ്നദൃശ്യം സജീവമായി അവതരിപ്പിക്കുന്ന ശ്രദ്ധാകർഷക വ്യവഹാരചിഹ്നം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: വെളുത്ത അപ്പത്തിന്റെ മൂന്നു കൊട്ടകൾ
  rationale: חֹרִי എന്ന അനിശ്ചിത പദത്തിന്റെ പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ‘വെളുത്ത അപ്പം’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַל רֹאשִׁי
  choice: എന്റെ തലയിൽ
  rationale: ലളിതമായ സ്ഥാനസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: ഹീബ്രു ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന സാധാരണ മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്വപ്നവിവരണത്തിന്റെ സജീവത നിലനിർത്താൻ ‘അതാ’ ഉപയോഗിച്ചു; അപൂർവമായ חֹרִי എന്ന പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
