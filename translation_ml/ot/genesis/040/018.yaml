  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן יוֹסֵף֙ וַ/יֹּ֔אמֶר זֶ֖ה פִּתְרֹנ֑/וֹ שְׁלֹ֨שֶׁת֙ הַ/סַּלִּ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: ml
  text: 'യോസേഫ് ഉത്തരം പറഞ്ഞു: “ഇതാണ് അതിന്റെ വ്യാഖ്യാനം: ആ മൂന്ന് കൊട്ടകൾ മൂന്ന് ദിവസങ്ങളാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ഉത്തരം പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ഇരട്ട സംഭാഷണസൂത്രം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു; മറുപടിയെന്ന ആശയവും സംസാരക്രിയയും നിലനിർത്തുന്നു.
- source_word: פִּתְרֹנוֹ
  choice: അതിന്റെ വ്യാഖ്യാനം
  rationale: സ്വപ്നസന്ദർഭത്തിൽ ഈ പദം സ്വപ്നത്തിന്റെ വ്യാഖ്യാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അർഥം’ എന്നതിനെക്കാൾ സന്ദർഭസൂക്ഷ്മമാണ്.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: ആ മൂന്ന് കൊട്ടകൾ
  rationale: סַל എന്ന പൊതുപദത്തിന് ‘കൊട്ട’ യോജിക്കുന്നു; നിർദ്ദിഷ്ടത സൂചിപ്പിക്കുന്ന article മുൻപറഞ്ഞ സ്വപ്നത്തിലെ കൊട്ടകളെ ചൂണ്ടിക്കാണിക്കുന്ന ‘ആ’യിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: മൂന്ന് ദിവസങ്ങളാണ്
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതമായ തിരിച്ചറിയൽവാക്യത്തിന്റെ നേരിട്ടുള്ള പ്രതീകസമത്വം നിലനിർത്തുന്നു; ‘അർഥമാക്കുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ സംഭാഷണസൂത്രത്തിലെ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ഉത്തരം പറഞ്ഞു’ എന്നു ചുരുക്കി; പ്രതീകപരമായ തിരിച്ചറിയൽ നേരിട്ട് നിലനിർത്തി.
