reference: Genesis 40:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: ml
  text: ഫറവോന്റെ പാനപാത്രം എന്റെ കൈയിലുണ്ടായിരുന്നു. ഞാൻ മുന്തിരിപ്പഴങ്ങൾ എടുത്ത് ഫറവോന്റെ പാനപാത്രത്തിലേക്കു പിഴിഞ്ഞൊഴിച്ചു. പിന്നെ ആ പാനപാത്രം ഫറവോന്റെ കൈയിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഫറവോന്റെ ഉള്ളംകൈമേൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: പാനപാത്രം
  rationale: കുടിക്കാനുള്ള പാത്രം എന്ന സാധാരണ അർഥം സ്വാഭാവികമായും രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിന് യോജിച്ചും നൽകുന്നു.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയിലുണ്ടായിരുന്നു
  rationale: സ്വപ്നവിവരണത്തിലെ ദൃശ്യസവിശേഷത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וָאֶקַּח
  choice: ഞാൻ ... എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ ആഖ്യാനപരമായ തർജമ.
- source_word: הָעֲנָבִים
  choice: മുന്തിരിപ്പഴങ്ങൾ
  rationale: നിശ്ചിതമായ മുന്തിരിപ്പഴങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാളസമാനപദം.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: ഫറവോന്റെ പാനപാത്രത്തിലേക്കു പിഴിഞ്ഞൊഴിച്ചു
  rationale: שׂחט ഇവിടെ മുന്തിരിയിൽനിന്ന് നീര് ഞെക്കിപ്പിഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിഴിഞ്ഞൊഴിച്ചു’ എന്നത് നീര് പാത്രത്തിലേക്കു വീഴുന്ന പ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וָאֶתֵּן
  choice: വെച്ചു
  rationale: נתן പലപ്പോഴും ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ തുടർന്നുവരുന്ന കൈയെക്കുറിച്ചുള്ള വാക്യഭാഗം ഒരു വസ്തു കൈയിൽ വെക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: עַל כַּף פַּרְעֹה
  choice: ഫറവോന്റെ കൈയിൽ
  rationale: כַּף അക്ഷരാർഥത്തിൽ ഉള്ളംകൈയാണ്; പാനപാത്രം കൈമാറുന്ന സന്ദർഭത്തിൽ ‘കൈയിൽ’ എന്നത് സ്വാഭാവികമായ മലയാളരൂപമാണ്.
