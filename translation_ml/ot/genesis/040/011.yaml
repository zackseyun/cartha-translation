translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ പ്രവൃത്തികളെ മലയാളത്തിൽ മൂന്ന് ഹ്രസ്വവാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘അപ്പോൾ/ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
