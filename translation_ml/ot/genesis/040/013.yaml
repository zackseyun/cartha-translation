  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: ml
  text: ഇനി മൂന്നു ദിവസം കഴിഞ്ഞാൽ ഫറവോൻ നിന്റെ തല ഉയർത്തുകയും നിന്നെ നിന്റെ സ്ഥാനത്ത് പുനഃസ്ഥാപിക്കുകയും ചെയ്യും[a]. നീ മുമ്പ് അവന്റെ പാനപാത്രവാഹകനായിരുന്നപ്പോഴത്തെ പതിവുപോലെ ഫറവോന്റെ പാനപാത്രം അവന്റെ കൈയിൽ കൊടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “നിന്റെ തല ഉയർത്തും.” ഇവിടെ ഈ പ്രയോഗം അനുകൂലമായ പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു; 19-ാം വാക്യത്തിലെ വിപരീതമായ ഉപയോഗത്തിനും ഇതേ വാക്കുകൾ പശ്ചാത്തലമൊരുക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: ഇനി മൂന്നു ദിവസം കഴിയുമ്പോൾ
  rationale: ശേഷിക്കുന്ന സമയത്തിനു ശേഷം സംഭവം നടക്കുമെന്ന മുന്നോട്ടുള്ള കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: നിന്റെ തല ഉയർത്തി
  rationale: എബ്രായയിലെ അക്ഷരാർഥ പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് അനുകൂല പരിഗണനയെയും പുനഃസ്ഥാപനത്തെയും സൂചിപ്പിക്കുന്നു, കൂടാതെ 19-ാം വാക്യത്തിലെ വിപരീത പ്രയോഗവുമായി സാഹിത്യബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: നിന്നെ നിന്റെ സ്ഥാനത്ത് പുനഃസ്ഥാപിക്കും
  rationale: כֵּן ഇവിടെ രാജസദസ്സിലെ മുൻ സ്ഥാനത്തെയോ ചുമതലയെയോ സൂചിപ്പിക്കുന്നു; ‘സ്ഥാനം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: നീ ഫറവോന്റെ പാനപാത്രം അവന്റെ കൈയിൽ കൊടുക്കും
  rationale: נתן എന്ന ക്രിയയുടെ ‘കൊടുക്കുക/വയ്ക്കുക’ എന്ന അർഥവും പാനപാത്രവാഹകന്റെ മൂർത്തമായ പ്രവൃത്തിയും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: മുമ്പ് ... ചെയ്തിരുന്ന പതിവുപോലെ
  rationale: מִשְׁפָּט ഇവിടെ നിയമവിധിയല്ല, മുമ്പുണ്ടായിരുന്ന സ്ഥിരമായ സേവനരീതിയാണ്; ‘പതിവുപോലെ’ സന്ദർഭത്തിന് യോജിച്ച ആധുനിക മലയാളമാണ്.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: നീ അവന്റെ പാനപാത്രവാഹകനായിരുന്നപ്പോൾ
  rationale: מַשְׁקֶה എന്നത് പാനം നൽകുന്ന പ്രവൃത്തി മാത്രമല്ല, രാജസദസ്സിലെ ഔദ്യോഗിക പാനപാത്രവാഹകന്റെ പദവിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ മൂലത്തിലെ ‘തല ഉയർത്തുക’ എന്ന സാഹിത്യപ്രയോഗം അടിക്കുറിപ്പോടെ നിലനിർത്തി; രാജസദസ്സിലെ ഔദ്യോഗിക പദവിക്ക് ‘പാനപാത്രവാഹകൻ’ ഉപയോഗിച്ചു.
