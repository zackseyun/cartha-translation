translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. സ്വപ്നത്തിലെ അതിവേഗ സസ്യവളർച്ചയുടെ ദൃശ്യം നിലനിർത്തിയിട്ടുണ്ട്; അർഥവ്യത്യാസമുള്ള സസ്യശാസ്ത്രപദങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
