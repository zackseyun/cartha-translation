  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ ഘടനയും ദൃശ്യക്രമവും വിശ്വസ്തമായി നൽകുന്നു: മുന്തിരിവള്ളിയിലെ മൂന്ന് ശാഖകൾ, തളിർക്കുന്ന ഘട്ടം, പൂക്കളുടെ ഉദയം/വിരിയൽ, തുടർന്ന് കുലകൾ മുന്തിരിപ്പഴങ്ങളായി പഴുക്കൽ. ‘പൂക്കൾ വിരിഞ്ഞു’ എന്നത് עָלְתָה נִצָּהּ (‘അതിന്റെ പുഷ്പം/പുഷ്പവളർച്ച ഉയർന്നു/വന്നു’) എന്ന ദൃശ്യത്തിന്റെ സ്വാഭാവിക മലയാളീകരണമാണ്. ‘മുന്തിരിപ്പഴങ്ങളായി പഴുത്തു’ എന്ന പ്രയോഗം കുലകൾ പാകമാകുന്ന ഫലത്തിലേക്ക് എത്തുന്നതെന്ന എബ്രായ പ്രതിപാദ്യത്തെ സംരക്ഷിക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വാചകം സുഗമവും വ്യക്തവുമാണ്. സ്വപ്നവിവരണത്തിന്റെ ദ്രുതസസ്യവളർച്ചാ ക്രമം ‘തളിർക്കുന്നതിനിടെ ... വിരിഞ്ഞു; ... പഴുത്തു’ എന്ന തുടർച്ചയിൽ നന്നായി കേൾക്കുന്നു.
  terminology: ‘മുന്തിരിവള്ളി,’ ‘ശാഖകൾ,’ ‘തളിർക്കുക,’ ‘കുലകൾ,’ ‘മുന്തിരിപ്പഴങ്ങൾ’ എന്നിവ പൊതുവായും യോജിച്ചതുമായ പദങ്ങളാണ്. അടിക്കുറിപ്പ് a-യിൽ ശാഖകൾക്കുള്ള നിയമാനുസൃതമായ ലെക്സിക്കൽ വ്യത്യസ്തതകൾ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് b എബ്രായത്തിന്റെ സംക്ഷിപ്തവും ചിലവണ്ണം അസാധാരണവുമായ രൂപം വിശദീകരിക്കുകയും മുഖ്യപാഠത്തിലേക്ക് അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
