  yaml_path: translation/ot/genesis/040/010.yaml
  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: ml
  text: മുന്തിരിവള്ളിയിൽ മൂന്നു ശാഖകൾ ഉണ്ടായിരുന്നു[a]. അതു തളിർക്കുന്നതിനിടെ അതിന്റെ പൂക്കൾ വിരിഞ്ഞു[b]; അതിന്റെ കുലകൾ മുന്തിരിപ്പഴങ്ങളായി പഴുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂന്നു തളിരുകൾ’ അല്ലെങ്കിൽ ‘മൂന്നു വള്ളിക്കൊമ്പുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: ‘അതു തളിർക്കുന്നതുപോലെ, അതിന്റെ പുഷ്പം മുകളിലേക്കു വന്നു.’ തളിർപ്പിൽനിന്ന് പൂവിലേക്കുള്ള വള്ളിയുടെ ദ്രുതമായ വളർച്ചയാണ് ഈ വാക്യം വിവരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: മുന്തിരിവള്ളിയിൽ
  rationale: വള്ളിയിൽ വളരുന്ന ശാഖകളെ സൂചിപ്പിക്കുന്നതിനാൽ, ബന്ധകത്തെ മലയാളത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ സ്ഥാനാർഥം സ്വാഭാവികമായി നൽകി.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: മൂന്നു ശാഖകൾ
  rationale: שָׂרִיגִם മുന്തിരിവള്ളിയുടെ ശാഖകളെയോ തളിരുകളെയോ സൂചിപ്പിക്കാം; പൊതുവായി മനസ്സിലാകുന്ന ‘ശാഖകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: כְפֹרַחַת
  choice: അതു തളിർക്കുന്നതിനിടെ
  rationale: כְ എന്ന ഉപസർഗവും കർത്തൃവാചക രൂപവും സൂചിപ്പിക്കുന്ന പുരോഗമിക്കുന്ന ഘട്ടവും സമയബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עָלְתָה נִצָּהּ
  choice: അതിന്റെ പൂക്കൾ വിരിഞ്ഞു
  rationale: പുഷ്പം പുറത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യത്തെ മലയാളത്തിലെ സ്വാഭാവിക സസ്യവിവരണമായി അവതരിപ്പിക്കുന്നു; ഏകവചനരൂപത്തിന് ഇവിടെ സമൂഹാർഥമുണ്ട്.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: അതിന്റെ കുലകൾ മുന്തിരിപ്പഴങ്ങളായി പഴുത്തു
  rationale: കുലകൾ മുന്തിരിപ്പഴങ്ങളായി പാകമാകുന്ന ദ്രുതവളർച്ചാക്രമം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
