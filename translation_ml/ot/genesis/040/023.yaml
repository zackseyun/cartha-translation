  text: וְ/לֹֽא זָכַ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת יוֹסֵ֖ף וַ/יִּשְׁכָּחֵֽ/הוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: ml
  text: എന്നാൽ മുഖ്യ പാനപാത്രവാഹകൻ യോസേഫിനെ ഓർത്തില്ല[a]; അവൻ അവനെ മറന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുഖ്യ പാനപാത്രവാഹകൻ യോസേഫിനെ ഓർത്തില്ല; അവൻ അവനെ മറന്നു.”
    reason: ഹീബ്രു וְ എന്ന ബന്ധകത്തെ ഇവിടെ സന്ദർഭവിരുദ്ധത സൂചിപ്പിക്കുന്ന ‘എന്നാൽ’ എന്നോ സാധാരണ ബന്ധമായി എന്നോ മനസ്സിലാക്കാം; പാദക്കുറിപ്പ് കുറവ് വ്യാഖ്യാനമുള്ള വായന നൽകുന്നു.
lexical_decisions:
- source_word: וְ/לֹא
  choice: എന്നാൽ ... ഓർത്തില്ല
  rationale: മുൻവാക്യത്തിലെ സംഭവവുമായി ബന്ധിപ്പിക്കുമ്പോഴും യോസേഫിന്റെ പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായ വഴിത്തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ, ലളിതമായ ‘അങ്ങനെ/പിന്നെ’ എന്നതിനെക്കാൾ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: זָכַר
  choice: ഓർത്തില്ല
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഓർക്കുക’ നിലനിർത്തുന്നു; യോസേഫിനുവേണ്ടി പ്രവർത്തിച്ചില്ല എന്ന ആശയം വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- source_word: שַׂר הַמַּשְׁקִים
  choice: പാനപാത്രവാഹകരുടെ തലവൻ
  rationale: ഫറവോന്റെ പാനീയശുശ്രൂഷയുടെ ചുമതലയുള്ള ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന രാജസഭാപദവി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת יוֹסֵף
  choice: യോസേഫിനെ
  rationale: നേരിട്ടുള്ള കർമത്തെ മലയാളത്തിലെ ‘-നെ’ വിഭക്തിയാൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: അവൻ അവനെ മറന്നുകളഞ്ഞു
  rationale: ‘മറക്കുക’ എന്ന മൂലാർഥവും യോസേഫിനെ സൂചിപ്പിക്കുന്ന പുരുഷ ഏകവചന പ്രത്യയവും നിലനിർത്തുന്നു; ‘-കളഞ്ഞു’ എന്ന പ്രയോഗം മുൻപത്തെ നിഷേധത്തെ ഊന്നിപ്പറയുന്ന ആവർത്തനത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
