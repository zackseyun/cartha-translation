  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: ml
  text: മൂന്നാം ദിവസം[a], ഫറവോന്റെ ജന്മദിനത്തിൽ, അവൻ തന്റെ സേവകർക്കെല്ലാവർക്കും ഒരു വിരുന്നു നടത്തി; തന്റെ സേവകരുടെ ഇടയിൽ അവൻ പാനപാത്രവാഹകരുടെ തലവന്റെയും അപ്പക്കാരുടെ തലവന്റെയും തല ഉയർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “അവൻ അവരെ പ്രത്യേകം പരിഗണിച്ചു” അഥവാ “അവരുടെ കാര്യം എടുത്തു.” എബ്രായയിൽ അക്ഷരാർഥം “തല ഉയർത്തി” എന്നാണ്. തുടർന്നുള്ള ആഖ്യാനത്തിൽ ഈ പ്രയോഗം രണ്ടു ഉദ്യോഗസ്ഥർക്കും വ്യത്യസ്ത ഫലങ്ങളോടെ ഉപയോഗിക്കുന്നതിനാൽ അത് ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം ... ആയിരുന്നു
  rationale: തുടർച്ചയായ ആഖ്യാനസംഭവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കാലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: ഫറവോന്റെ ജന്മദിനം
  rationale: ‘ഫറവോൻ ജനിച്ച ദിവസം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള തുല്യം.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: ഒരു വിരുന്നു നടത്തി
  rationale: പാനീയവും ഉൾപ്പെടാവുന്ന ഔദ്യോഗിക സദ്യ/വിരുന്നിനെയാണ് מִשְׁתֶּה സൂചിപ്പിക്കുന്നത്; ‘വിരുന്നു നടത്തി’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לְכָל עֲבָדָיו
  choice: തന്റെ സകല ദാസന്മാർക്കും
  rationale: עֶבֶד രാജസഭാ പശ്ചാത്തലത്തിൽ സേവകർ, ഉദ്യോഗസ്ഥർ, പരിചാരകർ എന്നിവരെ വിശാലമായി സൂചിപ്പിക്കാം; മൂലത്തിന്റെ വിശാലത സംരക്ഷിക്കാൻ ‘ദാസന്മാർ’ തെരഞ്ഞെടുത്തു.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: തല അവൻ ഉയർത്തി
  rationale: ഈ പദപ്രയോഗം 13, 19 വാക്യങ്ങളിലെ വ്യത്യസ്ത ഫലങ്ങളോടുള്ള ഉദ്ദേശ്യപൂർവമായ വാക്കുകളി നിലനിർത്തുന്നതിനായി അക്ഷരാർഥത്തോട് ചേർന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: שַׂר הַמַּשְׁקִים
  choice: പാനപാത്രവാഹകരുടെ തലവൻ
  rationale: രാജാവിന്റെ പാനീയസേവനത്തിന്റെ മേൽനോട്ടം വഹിക്കുന്ന ഉദ്യോഗസ്ഥന്റെ പദവി; ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔദ്യോഗിക രൂപം.
- source_word: שַׂר הָאֹפִים
  choice: അപ്പക്കാരുടെ തലവൻ
  rationale: അപ്പം/ചുട്ടഭക്ഷണം ഒരുക്കുന്നവരുടെ മേൽനോട്ടക്കാരനായ രാജസഭാ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന സമാന്തര പദവി.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: തന്റെ ദാസന്മാരുടെ മധ്യേവെച്ച്
  rationale: രാജസേവകരുടെ സാന്നിധ്യത്തിൽ പരസ്യമായി നടന്ന നടപടിയെന്ന സ്ഥല-സാമൂഹിക അർഥം നിലനിർത്തുന്നു.
