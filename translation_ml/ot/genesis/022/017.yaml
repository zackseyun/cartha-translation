  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: ml
  text: ഞാൻ നിന്നെ നിശ്ചയമായും അനുഗ്രഹിക്കും; നിന്റെ സന്തതിയെ[a] ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെയും കടൽത്തീരത്തുള്ള മണലിനെപ്പോലെയും അത്യന്തം വർധിപ്പിക്കും. നിന്റെ സന്തതി തന്റെ ശത്രുക്കളുടെ കവാടം കൈവശമാക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘നിന്റെ വിത്ത്’. ഈ ഹീബ്രുപദം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും സന്തതികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ സന്തതികൾ അവരുടെ ശത്രുക്കളുടെ കവാടം കൈവശമാക്കും’ എന്നും അർഥമാക്കാം. എന്നാൽ ഹീബ്രുവിൽ ‘സന്തതി/വിത്ത്’ എന്നതും ‘തന്റെ’ എന്നതും വ്യാകരണപരമായി ഏകവചനത്തിലാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ തുടർന്നുള്ള ഉറപ്പുള്ള പ്രഖ്യാപനത്തിൽ അതിന്റെ ഊന്നൽ ഉൾപ്പെടുത്തി
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച സത്യപ്രതിജ്ഞയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമാണിത്. ഒറ്റപ്പെട്ട മലയാളവാക്യത്തിൽ ‘എന്ന്’ എന്നു തുടങ്ങുന്നത് അസ്വാഭാവികമായതിനാൽ, അതിന്റെ ഉറപ്പിന്റെ ഭാവം ‘നിശ്ചയമായും’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: ഞാൻ നിന്നെ നിശ്ചയമായും അനുഗ്രഹിക്കും
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും സമാപികാക്രിയയും ചേർന്ന ഹീബ്രു പ്രയോഗം പ്രവൃത്തിക്ക് ശക്തമായ ഊന്നൽ നൽകുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘നിശ്ചയമായും’ അത് നിലനിർത്തുന്നു.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: അത്യന്തം വർധിപ്പിക്കും
  rationale: ഇവിടെയും ആവർത്തനഘടന തീവ്രത സൂചിപ്പിക്കുന്നു. ‘അത്യന്തം’ വർധനയുടെ അളവിലുള്ള ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע വ്യാകരണപരമായി ഏകവചനവും അർഥത്തിൽ കൂട്ടത്തെയും സൂചിപ്പിക്കാവുന്നതുമാണ്. ‘സന്തതി’ ഈ കൂട്ട ഏകവചനസ്വഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: ആകാശത്തിലെ നക്ഷത്രങ്ങളെപ്പോലെ
  rationale: മലയാളത്തിൽ ‘ആകാശത്തിലെ’ എന്നത് സ്വാഭാവികമാണ്; ഹീബ്രുവിലെ താരതമ്യചിത്രം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: കടൽത്തീരത്തുള്ള മണലിനെപ്പോലെ
  rationale: אֲשֶׁר עַל എന്ന ബന്ധവാക്യത്തിന്റെ അർഥം ‘-ത്തുള്ള’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; שְׂפַת הַיָּם എന്നത് സന്ദർഭത്തിൽ ‘കടൽത്തീരം’ എന്നാണ്.
- source_word: וְיִרַשׁ
  choice: കൈവശമാക്കും
  rationale: יָרַשׁ അവകാശമാക്കുക, കൈവശപ്പെടുത്തുക, കൈവശമാക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ശത്രുക്കളുടെ കവാടത്തെ സംബന്ധിക്കുന്ന ഇവിടെ സജീവമായ അധീനതയും നിയന്ത്രണവും ‘കൈവശമാക്കും’ വ്യക്തമാക്കുന്നു.
- source_word: שַׁעַר
  choice: കവാടം
  rationale: മൂലത്തിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷയാണ്. പട്ടണത്തിന്മേലുള്ള അധികാരത്തിന്റെ സൂചന വായനക്കാരൻ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: אֹיְבָיו
  choice: തന്റെ ശത്രുക്കളുടെ
  rationale: ഹീബ്രുവിലെ പ്രത്യയം ഏകവചനമാണ്; കൂട്ട ഏകവചനമായ ‘സന്തതി’യോടു ചേർന്ന് ‘തന്റെ’ എന്ന രൂപം ആ വ്യാകരണപരവും അർഥപരവുമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
theological_decisions:
- issue: זֶרַע എന്ന കൂട്ട ഏകവചനവും അവസാന ഉപവാക്യത്തിലെ ഏകവചന സർവനാമപ്രത്യയവും
  choice: ‘നിന്റെ സന്തതി … തന്റെ ശത്രുക്കളുടെ’ എന്ന കൂട്ട ഏകവചനരൂപം
  alternative: ‘നിന്റെ സന്തതികൾ … അവരുടെ ശത്രുക്കളുടെ’
  rationale: മൂലപാഠം സന്തതിയെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുമ്പോഴും വ്യാകരണപരമായി ഏകവചനം പാലിക്കുന്നു. മലയാളത്തിലെ ‘സന്തതി … തന്റെ’ ഈ പിരിമുറുക്ക് നിലനിർത്തുന്നു; അതിനെ നിർബന്ധമായി ഒരൊറ്റ വ്യക്തിയിലേക്കോ വെറും ബഹുവചന സമൂഹത്തിലേക്കോ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ഊന്നൽ മലയാളത്തിലെ ക്രിയാവിശേഷണങ്ങളിലൂടെ അറിയിച്ചു; കൂട്ട ഏകവചനത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില ‘സന്തതി … തന്റെ’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
