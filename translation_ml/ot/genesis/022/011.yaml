id: GEN.22.11
reference: Genesis 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: ml
  text: 'എന്നാൽ യഹ്‌വെയുടെ ദൂതൻ[a] സ്വർഗത്തിൽനിന്ന്[b] അവനെ വിളിച്ചുപറഞ്ഞു: “അബ്രാഹാം, അബ്രാഹാം!” അവൻ പറഞ്ഞു: “ഇതാ, ഞാൻ ഇവിടെ ഉണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ מַלְאָךְ എന്ന പദത്തിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഇവിടെ സ്വർഗീയ പശ്ചാത്തലം ‘ദൂതൻ’ എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘സ്വർഗങ്ങളിൽനിന്ന്’; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായി ‘സ്വർഗത്തിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ קרא ഒരാളെ ശബ്ദമുയർത്തി അഭിസംബോധന ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചു’ സ്വാഭാവികവും നേരിട്ടുമാണ്.
- source_word: אֵלָיו
  choice: അവനെ
  rationale: אֶל എന്ന പൂർവപ്രത്യയം ഇവിടെ വിളിയുടെ ലക്ഷ്യം അബ്രാഹാമാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘അവനെ വിളിച്ചു’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ/മാലാഖ’ എന്നും അർഥമാകാം. സ്വർഗീയ പശ്ചാത്തലത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; അതേസമയം ഈ മലയാളപദം സന്ദേശവാഹകൻ എന്ന അടിസ്ഥാനധ്വനിയും നിലനിർത്തുന്നു. יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: שָׁמַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ ദൈവിക/സ്വർഗീയ മേഖലയെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്; ‘ആകാശത്തുനിന്ന്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ സംസാരക്രിയയ്ക്ക് നേരിട്ടുള്ള സ്വാഭാവിക മലയാളസമാനപദമാണ് ‘പറഞ്ഞു’.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: അബ്രാഹാം, അബ്രാഹാം!
  rationale: പേരിന്റെ ആവർത്തനം അടിയന്തരതയും വ്യക്തിപരമായ അഭിസംബോധനയും പ്രകടമാക്കുന്നു; ആശ്ചര്യചിഹ്നം വിളിയുടെ ശക്തി സൂചിപ്പിക്കുന്നു.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ!
  rationale: הִנֵּנִי സാന്നിധ്യവും പ്രതികരിക്കാനുള്ള സന്നദ്ധതയും അറിയിക്കുന്ന പതിവ് മറുപടിയാണ്; ‘ഇതാ, ഞാൻ!’ അതിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗം യഹ്‌വെയുടെ സ്വയംപ്രത്യക്ഷതയായി വ്യാഖ്യാനിക്കണമോ
  choice: യഹ്‌വെയുടെ ദൂതൻ
  alternative: യഹ്‌വെ തന്നെയുള്ള ഒരു പ്രത്യക്ഷത; യഹ്‌വെയുടെ സന്ദേശവാഹകൻ
  rationale: മൂലപാഠം സംസാരിക്കുന്നയാളെ ‘യഹ്‌വെയുടെ ദൂതൻ’ എന്നാണ് വിളിക്കുന്നത്. അതിലുപരി ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർക്കാതെ പ്രയോഗത്തിന്റെ യഥാർത്ഥ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സംഭാഷണം ലളിതമായി സൂക്ഷിക്കുകയും മൂലത്തിലെ ആവർത്തനവും ഹ്രസ്വമായ മറുപടിയും നിലനിർത്തുകയും ചെയ്തു.
