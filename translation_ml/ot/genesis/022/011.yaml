    rationale: ദൂതൻ ‘വിളിച്ചു’ എന്നതും ‘പറഞ്ഞു’ എന്നതും മൂലത്തിൽ വേറിട്ട ക്രിയകളാണ്. ‘വിളിച്ചുപറഞ്ഞു’ എന്ന് നൽകുന്നത് രണ്ടും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
