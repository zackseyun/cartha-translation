    rationale: ഈ സന്ദർഭത്തിലെ הַשָּׁמַיִם സ്വർഗീയ മേഖലയെ സൂചിപ്പിക്കുന്നു; ‘സ്വർഗത്തിൽനിന്ന്’ മലയാളത്തിൽ കൂടുതൽ കൃത്യമാണ്.
