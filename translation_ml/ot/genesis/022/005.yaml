  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: ml
  text: 'അബ്രാഹാം തന്റെ യുവാക്കളോടു പറഞ്ഞു: “നിങ്ങൾ കഴുതയോടൊപ്പം ഇവിടെത്തന്നെ തങ്ങുക. ഞാനും ബാലനും അങ്ങോട്ടു പോകും; ഞങ്ങൾ ആരാധിക്കുകയും നിങ്ങളുടെ അടുക്കലേക്കു മടങ്ങിവരുകയും ചെയ്യും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുമ്പിടുക’; എബ്രായ ക്രിയ ആരാധനയിൽ ഒരാൾ കുനിയുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്നതിനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: തന്റെ യുവാക്കളോട്
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, സേവകൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ കൂടെ വന്ന രണ്ടു പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പദത്തിന്റെ പ്രാഥമിക അർഥം നിലനിർത്തുന്ന ‘യുവാക്കൾ’ തിരഞ്ഞെടുത്തു.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: നിങ്ങൾ ഇവിടെ ഇരിക്കുക
  rationale: יָשַׁב എന്നത് അക്ഷരാർഥത്തിൽ ‘ഇരിക്കുക’ എന്നും സന്ദർഭാനുസരണം ‘തങ്ങുക’ എന്നും അർഥമാക്കാം. മുന്നോട്ടു പോകരുതെന്ന നിർദേശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഇവിടെ ഇരിക്കുക’ മതിയാകുന്നു.
- source_word: עִם הַחֲמוֹר
  choice: കഴുതയോടൊപ്പം
  rationale: חֲמוֹר എന്ന സാധാരണ എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷയാണ് ‘കഴുത’.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: ഞാനും ബാലനും
  rationale: ഇവിടെ נַעַר യിസ്ഹാക്കിനെ സൂചിപ്പിക്കുന്നു. ‘ബാലൻ’ അബ്രാഹാമിന്റെ കാഴ്ചപ്പാടും ആഖ്യാനത്തിന്റെ ഭാവവും നൽകുന്നു; പ്രായം കൃത്യമായി നിർണയിക്കുന്നില്ല.
- source_word: נֵלְכָה עַד כֹּה
  choice: അങ്ങോട്ടു പോകും
  rationale: അടുത്തെങ്കിലും വേറിട്ട ഒരു സ്ഥലത്തേക്കുള്ള ഉദ്ദേശ്യപൂർവമായ നീക്കമാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘അങ്ങോട്ട്’ അതിന്റെ ദിശാസൂചന സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: ഞങ്ങൾ ആരാധിച്ച്
  rationale: שָׁחָה അടിസ്ഥാനമായി കുമ്പിടുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൈവാരാധനയുടെ സന്ദർഭത്തിൽ ‘ആരാധിക്കുക’ മുഖ്യാർഥം വ്യക്തമായി നൽകുന്നു. ശാരീരിക ഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: നിങ്ങളുടെ അടുക്കലേക്കു മടങ്ങിവരും
  rationale: שׁוּב എന്നത് ‘മടങ്ങുക’ എന്നാണ്. എബ്രായത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനം നിലനിർത്താൻ ‘ഞങ്ങൾ’ വ്യക്തമായി ചേർത്തു; ‘പിന്നെ’ പോലുള്ള ഉറവിടത്തിൽ ഇല്ലാത്ത പദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: അബ്രാഹാം മടങ്ങിവരുന്നതിനെക്കുറിച്ച് ഉപയോഗിച്ച ബഹുവചനം
  choice: ‘ഞങ്ങൾ ... മടങ്ങിവരും’ എന്ന വ്യക്തമായ ബഹുവചനം നിലനിർത്തി.
  alternative: ഇത് അബ്രാഹാമിന്റെ മറച്ചുവെക്കലായോ, ഇരുവരും മടങ്ങിവരുമെന്ന വിശ്വാസപ്രഖ്യാപനമായോ വ്യാഖ്യാനിക്കുക.
  rationale: ആരാധിക്കുന്നതിനും മടങ്ങിവരുന്നതിനും എബ്രായം ഒന്നാംപുരുഷ ബഹുവചന രൂപങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അബ്രാഹാം തന്റെ ഉദ്ദേശ്യം മറച്ചുവെച്ചതാണോ, ദൈവത്തിന്റെ കരുതലിൽ പ്രത്യാശ പ്രകടിപ്പിച്ചതാണോ, അതോ ഉദ്ദേശപൂർവം അവ്യക്തമായി സംസാരിച്ചതാണോ എന്ന് വാക്യം വിശദീകരിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കി; എന്നാൽ എബ്രായത്തിലെ ബഹുവചനവും വ്യാഖ്യാനപരമായ അവ്യക്തതയും കാത്തുസൂക്ഷിച്ചു.
