source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: ml
  text: നിന്റെ സന്തതിയിൽ ഭൂമിയിലെ സകല ജനതകളും അനുഗ്രഹിക്കപ്പെടും[a]; കാരണം നീ എന്റെ വാക്ക് അനുസരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും.’ ഇവിടെ ഹീബ്രു ക്രിയയെ പ്രത്യാവർത്തക അർഥത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ברך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ നിഷ്ക്രിയ/പ്രത്യാവർത്തക അർഥസാധ്യതയുള്ളതാണ്. പിതൃവാഗ്ദാനത്തിന്റെ സന്ദർഭത്തിൽ ‘അനുഗ്രഹിക്കപ്പെടും’ എന്നത് സ്വാഭാവികവും വാഗ്ദാനത്തിന്റെ ഫലഭാവം നിലനിർത്തുന്നതുമാണ്; പ്രത്യാവർത്തക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בְזַרְעֲךָ
  choice: നിന്റെ സന്തതിയിൽ
  rationale: זֶרַע ഒരു സമൂഹവാചക നാമമായി സന്തതി/വംശജർ എന്ന അർഥം നൽകുന്നു. ‘സന്തതി’ ഏകവചനരൂപത്തോടൊപ്പം സമൂഹവാചകമായ അവ്യക്തതയും നിലനിർത്തുന്നു. בְ എന്ന ഉപസർഗം ഉപകരണാർഥമായി അമിതമായി നിർണ്ണയിക്കാതെ ‘യിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: גּוֹיִם എന്നതിന് സന്ദർഭോചിതമായ നേരിട്ടുള്ള പദം ‘ജനതകൾ’ ആണ്. ‘ഭൂമിയിലെ’ എന്നത് വാഗ്ദാനത്തിന്റെ ആഗോള വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: עֵקֶב אֲשֶׁר
  choice: കാരണം
  rationale: ഈ പദസംയോജനം വാഗ്ദാനം വീണ്ടും ഉറപ്പിക്കുന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ആ കാരണാർഥം ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: നീ എന്റെ വാക്ക് അനുസരിച്ചു
  rationale: שׁמע בקול എന്ന പ്രയോഗം കേൾവി മാത്രമല്ല, പ്രതികരണപരമായ അനുസരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘എന്റെ വാക്ക് അനുസരിച്ചു’ ഈ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ברך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിലുള്ള അബ്രാഹാമിക വാഗ്ദാനത്തിന്റെ അർഥം
  choice: ജനതകൾ അബ്രാഹാമിന്റെ സന്തതിയിൽ അനുഗ്രഹം പ്രാപിക്കുന്നവരായി വിവരിക്കപ്പെടുന്നു (‘അനുഗ്രഹിക്കപ്പെടും’).
  alternative: ജനതകൾ അബ്രാഹാമിന്റെ സന്തതിയെ മാതൃകയാക്കി തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും, അഥവാ അനുഗ്രഹാശംസ നടത്തും.
  rationale: ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ സന്ദർഭം നിഷ്ക്രിയ/ഫലസൂചക വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഹീബ്രു രൂപത്തിന്റെ പ്രത്യാവർത്തക സാധ്യത യഥാർഥമായതിനാൽ അതിനെ മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്തതി’ എന്ന സമൂഹവാചക പദവും ‘നിന്റെ സന്തതിയിൽ’ എന്ന ഘടനയും മൂലത്തിലെ അർഥവ്യാപ്തിയും ഉപസർഗത്തിന്റെ അവ്യക്തതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
