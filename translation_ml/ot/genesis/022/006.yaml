id: GEN.22.6
reference: Genesis 22:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: ml
  text: അബ്രാഹാം ഹോമയാഗത്തിനുള്ള വിറകെടുത്ത് തന്റെ മകനായ യിസ്ഹാക്കിന്റെ മേൽ വെച്ചു. അവൻ തന്റെ കൈയിൽ തീയും കത്തിയും എടുത്തു. അവർ ഇരുവരും ഒരുമിച്ചു നടന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: ഹോമയാഗത്തിനുള്ള വിറക്
  rationale: നിർമാണം അക്ഷരാർഥത്തിൽ ‘ഹോമയാഗത്തിന്റെ വിറക്’ എന്നാണെങ്കിലും, യാഗത്തിനായി ഉപയോഗിക്കുന്ന വിറക് എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘ഹോമയാഗത്തിനുള്ള വിറക്’ എന്നു വ്യക്തമായി വരുന്നു. עֹלָה ഇവിടെ മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּשֶׂם עַל
  choice: ചുമലിൽ വെച്ചു
  rationale: ശീം + അൽ എന്നത് ഒരാളുടെമേൽ വയ്ക്കുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ വിറക് ഒരാളുടെമേൽ ചുമത്തുന്നതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ചുമലിൽ വെച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ചുമൽ’ ഉറവിടത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ലെങ്കിലും ലക്ഷ്യഭാഷയിലെ സ്വാഭാവിക ദേഹസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: יִצְחָק בְּנוֹ
  choice: തന്റെ മകനായ യിസ്ഹാക്ക്
  rationale: ഹീബ്രായ ക്രമം ‘യിസ്ഹാക്ക്, അവന്റെ മകൻ’ എന്നാണ്. ആ ബന്ധം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം സ്വീകരിച്ചു.
- source_word: בְּיָדוֹ
  choice: കൈയിൽ
  rationale: ഹീബ്രായ ഏകവചനമായ ‘അവന്റെ കൈയിൽ’ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הָאֵשׁ
  choice: തീ
  rationale: മൂലപാഠം തീ കൊണ്ടുപോയ ഉപകരണമോ പാത്രമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ‘തീപ്പാത്രം’ പോലുള്ള അനുമാനം ചേർക്കാതെ ‘തീ’ എന്നു തന്നെയാക്കി.
- source_word: הַמַּאֲכֶלֶת
  choice: കത്തി
  rationale: പദം അറുക്കുന്നതിനുള്ള കത്തിയെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭം യാഗപരമായ ഉപയോഗം വ്യക്തമാക്കുന്നതിനാൽ പൊതുവായും സ്വാഭാവികവുമായ ‘കത്തി’ മതി.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: അവർ ഇരുവരും ഒരുമിച്ചു നടന്നു
  rationale: ‘ഇരുവരും’ ദ്വയത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഒരുമിച്ചു’ יַחְדָּוയുടെ ഐക്യമായ സഞ്ചാരഭാവം സംരക്ഷിക്കുന്നു; הלך ഇവിടെ ‘നടന്നു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
theological_decisions:
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ വിവർത്തനം
  choice: ഹോമയാഗം
  alternative: ദഹനയാഗം / ആരോഹണയാഗം
  rationale: ഈ സന്ദർഭത്തിൽ പദം തീയിൽ മുഴുവനായി ദഹിപ്പിക്കുന്ന സ്ഥാപിത യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ ഭാഷയിൽ സാധാരണക്കാർക്ക് തിരിച്ചറിയാവുന്ന ‘ഹോമയാഗം’ ആ ആചാരപരമായ അർഥം ചുരുക്കമായി നൽകുന്നു; പദോത്ഭവത്തെ മാത്രം മുൻനിർത്തിയ ‘ആരോഹണയാഗം’ സന്ദർഭത്തെ മങ്ങിയാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ദീർഘമായ ഹീബ്രായ വാക്യത്തെ വായനാസൗകര്യത്തിനായി മൂന്നു ചെറുവാക്യങ്ങളാക്കി. മൂലപാഠത്തിൽ ഇല്ലാത്ത തീപ്പാത്രം പോലുള്ള വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
