source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: ml
  text: അബ്രാഹാം അതിരാവിലെ എഴുന്നേറ്റ് തന്റെ കഴുതയ്ക്കു ജീനം കെട്ടി. തന്റെ രണ്ടു യുവാക്കളെയും തന്റെ മകൻ യിസ്ഹാക്കിനെയും കൂടെ കൂട്ടി, ഹോമയാഗത്തിനുള്ള വിറകു കീറി. പിന്നെ അവൻ എഴുന്നേറ്റ് ദൈവം തന്നോടു പറഞ്ഞ സ്ഥലത്തേക്കു പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: അബ്രാഹാം അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: השכים എന്ന ക്രിയ വെറും ഉണരുന്നതല്ല, നേരത്തേ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അതിരാവിലെ എഴുന്നേറ്റ്’ ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: തന്റെ കഴുതയ്ക്കു ജീനം കെട്ടി
  rationale: യാത്രയ്ക്കായി കഴുതയെ സജ്ജമാക്കുന്ന പ്രവൃത്തിയാണ് חבש ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ജീനം കെട്ടി’ വ്യക്തവും കൃത്യവുമാണ്.
- source_word: שְׁנֵי נְעָרָיו
  choice: തന്റെ യുവാക്കളിൽ രണ്ടുപേരെയും
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, ഭൃത്യൻ, പരിചാരകൻ എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രധാന പാഠത്തിൽ പ്രായസൂചന നിലനിർത്തുകയും ഭൃത്യസ്ഥാനം അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יִצְחָק בְּנוֹ
  choice: തന്റെ മകൻ യിസ്ഹാക്കിനെയും
  rationale: പുത്രബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: ഹോമയാഗത്തിനുള്ള വിറകു കീറി
  rationale: בקע പിളർക്കുക അല്ലെങ്കിൽ കീറുക എന്ന പ്രവൃത്തിയെയും עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; ‘ഹോമയാഗം’ മലയാളത്തിലെ സ്ഥാപിതമായ യാഗപദമാണ്.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: പിന്നെ അവൻ എഴുന്നേറ്റ് ... പോയി
  rationale: എഴുന്നേൽക്കുകയും പോകുകയും ചെയ്തുവെന്ന രണ്ട് തുടർച്ചയായ എബ്രായ ക്രിയകളും നിലനിർത്തുന്നു; ‘പിന്നെ’ ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: ദൈവം തന്നോടു പറഞ്ഞ സ്ഥലത്തേക്കു
  rationale: മുൻപ് ദൈവം നിർദേശിച്ച സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: ഹോമയാഗം
  alternative: സർവാംഗദഹനയാഗം
  rationale: പ്രത്യേക യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദമാണ് ‘ഹോമയാഗം’; പാഠത്തിൽ ഇല്ലാത്ത അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: נְעָרָיו എന്നതിലെ സാമൂഹികസ്ഥാനത്തിന്റെ അനിശ്ചിതത്വം
  choice: തന്റെ യുവാക്കൾ
  alternative: തന്റെ ഭൃത്യന്മാർ / തന്റെ പരിചാരകർ
  rationale: എബ്രായപദം പ്രായത്തെയും സേവകസ്ഥാനത്തെയും സൂചിപ്പിക്കാം. ഉടൻ വരുന്ന സന്ദർഭം അവരുടെ ഭൃത്യസ്ഥാനം നിർബന്ധമായി ഉറപ്പിക്കാത്തതിനാൽ പ്രധാന പാഠം അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; പ്രവൃത്തികളുടെ ക്രമവും ആവർത്തിച്ചുള്ള ‘എഴുന്നേറ്റ്’ എന്ന പ്രയോഗവും നിലനിർത്തി.
