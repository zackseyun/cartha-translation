  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֻּגַּ֥ד לְ/אַבְרָהָ֖ם לֵ/אמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה גַם הִ֛וא בָּנִ֖ים לְ/נָח֥וֹר אָחִֽי/ךָ־׃
base_translation:
