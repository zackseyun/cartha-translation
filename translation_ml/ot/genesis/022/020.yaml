  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: ml
  text: 'ഈ സംഭവങ്ങൾക്കുശേഷം അബ്രാഹാമിന് ഇങ്ങനെ വാർത്ത ലഭിച്ചു: “ഇതാ, മിൽക്കയും നിന്റെ സഹോദരനായ നാഹോരിന് പുത്രന്മാരെ പ്രസവിച്ചിരിക്കുന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: ഹീബ്രു കഥനസൂത്രത്തിലെ וַיְהִי പ്രത്യേകം ‘ഇപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്യാതെ, אַחֲרֵי הַדְּבָרִים הָאֵלֶּה എന്ന സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: അബ്രാഹാമിന് ഇങ്ങനെ വാർത്ത ലഭിച്ചു
  rationale: നിഷ്ക്രിയമായ ‘അറിയിക്കപ്പെട്ടു’ എന്ന അർഥവും לֵאמֹר അവതരിപ്പിക്കുന്ന സന്ദേശവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ചേർത്ത് നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകത്തിന്റെ ശക്തി നിലനിർത്തുന്ന സാധാരണ സാഹിത്യപ്രയോഗം.
- source_word: יָלְדָה ... בָּנִים
  choice: പുത്രന്മാരെ പ്രസവിച്ചിരിക്കുന്നു
  rationale: പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്ന בָּנִים എന്നതും പൂർത്തിയായ പ്രസവസംഭവത്തിന്റെ നിലവിലുള്ള പ്രസക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: לְנָחוֹר אָחִיךָ
  choice: നിന്റെ സഹോദരനായ നാഹോരിന്
  rationale: ബന്ധസൂചന അബ്രാഹാമിനെ അഭിസംബോധന ചെയ്യുന്നതാണെന്ന് വ്യക്തമായി, എന്നാൽ മൂലപാഠത്തിന്റെ ബന്ധക്രമം നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
