  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּשֶׂד
  choice: കെസെദ്
  rationale: വംശാവലിപ്പട്ടികയിലെ വ്യക്തിനാമമായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֲזוֹ
  choice: ഹസോ
  rationale: വ്യക്തിനാമം; ח എന്ന അക്ഷരത്തിന് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളരൂപമായി ‘ഹ’ ഉപയോഗിച്ചു.
- source_word: פִּלְדָּשׁ
  choice: പിൽദാശ്
  rationale: വ്യക്തിനാമം നേരിട്ട് മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തു; ദീർഘസ്വരവും അവസാനത്തെ ശ് ശബ്ദവും നിലനിർത്തി.
- source_word: יִדְלָף
  choice: യിദ്‌ലാഫ്
  rationale: ആദ്യത്തെ ഹീബ്രു യോദ് ശബ്ദം ഇംഗ്ലീഷ് പരമ്പരാഗത J-രൂപം പിന്തുടരാതെ കൂടുതൽ ശബ്ദസമീപമായി ‘യി’ എന്നു നൽകി.
- source_word: בְּתוּאֵל
  choice: ബെഥൂവേൽ
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു ഘടന തിരിച്ചറിയാവുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶת / וְאֵת
  choice: എന്നിവരെയും
  rationale: ആവർത്തിക്കുന്ന വാവ് സഹിതമുള്ള നേരിട്ടുള്ള കർമചിഹ്നം ഓരോ പേരിനെയും മുൻവാക്യത്തിലെ ക്രിയയുടെ കർമമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ പട്ടികാശൈലിയിൽ ആവർത്തനം ഒഴിവാക്കി അവസാനത്തിൽ ‘എന്നിവരെയും’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽ ആരംഭിച്ച പേരുകളുടെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ‘എന്നിവരെയും’ ഉപയോഗിച്ചു. പേരുകളിൽ ഇംഗ്ലീഷ് രൂപങ്ങളെ യാന്ത്രികമായി പകർത്താതെ ഹീബ്രു ശബ്ദരൂപത്തിന് മുൻഗണന നൽകി.
