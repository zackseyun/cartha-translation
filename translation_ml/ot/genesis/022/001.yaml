  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾക്കുശേഷം ദൈവം അബ്രാഹാമിനെ പരീക്ഷിച്ചു.[a] ദൈവം അവനോട്, “അബ്രാഹാമേ!” എന്നു പറഞ്ഞു. അവൻ, “ഇതാ, ഞാൻ ഇവിടെ,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അബ്രാഹാമിനെ പരീക്ഷണത്തിന് വിധേയനാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഈ കാര്യങ്ങൾക്കുശേഷം
  rationale: וַיְהִי ഇവിടെ കഥയിലെ ഒരു പുതിയ ഘട്ടത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള കാലസൂചനയോടൊപ്പം അത് മലയാളത്തിൽ വേറിട്ട് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. דְּבָרִים എന്ന വിശാലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്താൻ ‘കാര്യങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: സന്ദർഭത്തിൽ ഇത് ഏകസത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഇവിടെ ദൈവനാമമായ יהוה അല്ല ഉള്ളത്.
- source_word: נִסָּה
  choice: പരീക്ഷിച്ചു
  rationale: Piel രൂപത്തിലുള്ള נסה പരിശോധിക്കുക, തെളിയിക്കുക എന്ന അർഥത്തിലാണ്. ‘പ്രലോഭിപ്പിച്ചു’ എന്നത് തിന്മയിലേക്കു വശീകരിക്കുന്നുവെന്ന തെറ്റായ ധ്വനി നൽകും.
- source_word: וַיֹּאמֶר אֵלָיו אַבְרָהָם
  choice: ദൈവം അവനോട്, “അബ്രാഹാമേ!” എന്നു വിളിച്ചു
  rationale: ആവർത്തിച്ചുള്ള ‘പറഞ്ഞു’ ഒഴിവാക്കി, പേരെടുത്തുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വിളിച്ചു’ ഉപയോഗിച്ചു; ഇതിൽ അധികമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: הִנֵּנִי
  choice: ഇതാ, ഞാൻ ഇവിടെ
  rationale: ശ്രദ്ധാപൂർവമായ സാന്നിധ്യവും പ്രതികരിക്കാനുള്ള സന്നദ്ധതയും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവം കർത്താവായുള്ള נסה എന്ന ക്രിയയുടെ അർഥം
  choice: ദൈവം അബ്രാഹാമിനെ പരീക്ഷിച്ചു
  alternative: ദൈവം അബ്രാഹാമിനെ പ്രലോഭിപ്പിച്ചു
  rationale: ഈ സന്ദർഭത്തിലെ ക്രിയ പരീക്ഷിക്കുകയോ തെളിയിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തിന്മയിലേക്കു പ്രേരിപ്പിക്കുന്നുവെന്ന ആശയം വാചകത്തിൽ ഇല്ല. അതേസമയം പരീക്ഷണത്തിന്റെ ഗൗരവവും കഥയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ, ഞാൻ ഇവിടെ’ എന്ന രൂപം എബ്രായപ്രയോഗത്തിന്റെ സന്നദ്ധതാഭാവം സൂക്ഷിക്കുന്നു; അനാവശ്യമായ പഴഞ്ചൊല്ല് ശൈലി ഒഴിവാക്കി.
