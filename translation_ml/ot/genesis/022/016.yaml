reference: Genesis 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ എന്നെക്കൊണ്ടുതന്നെ സത്യം ചെയ്തിരിക്കുന്നു—യഹ്‌വേയുടെ അരുളപ്പാട്—നീ ഈ കാര്യം ചെയ്തതിനാലും നിന്റെ മകനെ, നിന്റെ ഏകമകനെ[a], തടഞ്ഞുവെക്കാതിരുന്നതിനാലും[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ അതുല്യനായവനെ.” എബ്രായപദത്തിന് ‘ഏക’ എന്നും ‘അതുല്യ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “രക്ഷിക്കാതിരുന്നതിനാലും.” എബ്രായക്രിയയ്ക്ക് ‘പിടിച്ചുവെക്കുക,’ ‘തടഞ്ഞുവെക്കുക,’ അല്ലെങ്കിൽ ഈ സന്ദർഭത്തിൽ ‘രക്ഷിക്കുക’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയിലുള്ള ക്രിയ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ വ്യക്തമായ കർത്താവിനെ ചേർക്കുന്നത് സ്വാഭാവികമായ ആഖ്യാനശൈലി നൽകുന്നു.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: ഞാൻ എന്നെക്കൊണ്ടുതന്നെ സത്യം ചെയ്തിരിക്കുന്നു
  rationale: ഇത് സംസാരിക്കുന്നവൻ സ്വന്തം നാമത്തിൽ ചെയ്യുന്ന സത്യപ്രതിജ്ഞയാണ്. പൂർത്തിയായ സത്യപ്രതിജ്ഞയുടെ ഇപ്പോഴത്തെ പ്രാബല്യവും ഗൗരവവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: נְאֻם יְהוָה
  choice: യഹ്‌വേയുടെ അരുളപ്പാട്
  rationale: נְאֻם എന്ന ഔദ്യോഗിക ദൈവിക പ്രഖ്യാപനസൂത്രത്തിന്റെ ഗൗരവവും യഹ്‌വേ എന്ന വ്യക്തിനാമവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: ചെയ്തതിനാലും … പിടിച്ചുവെക്കാതിരുന്നതിനാലും
  rationale: ഊന്നലുള്ള കാരണബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ കാരണപ്രത്യയങ്ങളാൽ പ്രകടമാക്കുന്നു.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: നീ ഈ കാര്യം ചെയ്തതിനാലും
  rationale: דָּבָר ഇവിടെ അബ്രാഹാമിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കാര്യം’ യോജിച്ചതാണ്; നിർദ്ദേശകമായ ‘ഈ’യും നിലനിർത്തുന്നു.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: വിട്ടുകൊടുക്കാതെ പിടിച്ചുവെക്കാതിരുന്നതിനാലും
  rationale: חָשַׂךְ എന്നതിന്റെ ‘തടഞ്ഞുവെക്കുക/വിട്ടുകൊടുക്കാതിരിക്കുക’ എന്ന അർഥം സന്ദർഭത്തിന് അനുയോജ്യമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഒഴിവാക്കുക’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: നിന്റെ മകനെ, നിന്റെ ഏകമകനെ
  rationale: മൂലത്തിലെ സമാനാധികരണ ആവർത്തനവും יָחִיד എന്ന പദത്തിന്റെ ഏകത്വ/അതുല്യതാ ഊന്നലും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- issue: יְחִידְךָ എന്നതിലെ ‘ഏക/അതുല്യ’ ഊന്നൽ
  choice: നിന്റെ ഏകമകനെ
  alternative: നിന്റെ ഏകനായവനെ
  rationale: ‘മകൻ’ മുമ്പേ വന്നിട്ടുണ്ടെങ്കിലും മലയാളത്തിൽ ‘ഏകമകൻ’ എന്ന ആവർത്തനം വ്യക്തവും സ്വാഭാവികവും ആണ്; പിന്നീട് ഉണ്ടായേക്കാവുന്ന ദൈവശാസ്ത്രപരമായ അനുരണനം അധികമായി ഉയർത്താതെ എബ്രായത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയ്ക്കായി ‘അരുളപ്പാട്’ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസദൃശമായ തുടർച്ച കോമയാൽ നിലനിർത്തി.
