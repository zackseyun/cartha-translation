source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ml
  text: പിന്നെ അബ്രാഹാം തന്റെ കണ്ണുകൾ ഉയർത്തി നോക്കി. അതാ, പിന്നിൽ[a] ഒരു ആട്ടുകൊറ്റൻ കൊമ്പുകളാൽ കുറ്റിക്കാട്ടിൽ കുടുങ്ങിക്കിടന്നു. അബ്രാഹാം ചെന്ന് ആട്ടുകൊറ്റനെ എടുത്ത് തന്റെ മകനു പകരം[b] ഹോമയാഗമായി അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ പിന്നിൽ.” എബ്രായപദം ഇവിടെ സ്ഥലസൂചകമായി മനസ്സിലാക്കാം; എന്നാൽ “അവന്റെ” എന്ന പദം മൂലപാഠത്തിൽ വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തന്റെ മകന്റെ സ്ഥാനത്ത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: കണ്ണുകളുയർത്തി
  rationale: നോട്ടം ഉയർത്തുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיַּרְא
  choice: നോക്കി
  rationale: മുൻപുള്ള ‘കണ്ണുകളുയർത്തി’ എന്ന പ്രയോഗത്തോടും തുടർന്നുള്ള ശ്രദ്ധയാകർഷകമായ ‘അതാ’ എന്നതിനോടും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കഥനത്തിൽ പെട്ടെന്ന് ശ്രദ്ധ തിരിക്കുന്ന എബ്രായ സൂചകപദത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: אַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: യാഗസന്ദർഭത്തിലെ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന കൃത്യവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം.
- source_word: אַחַר
  choice: പിന്നിൽ
  rationale: ഇവിടെ സ്ഥലസൂചക ക്രിയാവിശേഷണമായി വായിക്കുന്നത് സന്ദർഭോചിതമാണ്; മൂലപാഠത്തിൽ ‘അവന്റെ’ എന്ന സർവനാമം വ്യക്തമല്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: נֶאֱחַז
  choice: കുടുങ്ങിയ നിലയിൽ
  rationale: മൃഗം ഇതിനകം കുടുങ്ങിക്കിടക്കുന്നു എന്ന കർമണിപരവും ഫലാവസ്ഥാപരവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בַּסְּבַךְ
  choice: കുറ്റിക്കാട്ടിൽ
  rationale: ഇടതൂർന്നും കെട്ടുപിണഞ്ഞും കിടക്കുന്ന സസ്യവളർച്ചയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּקַרְנָיו
  choice: അതിന്റെ കൊമ്പുകൾ
  rationale: ആട്ടുകൊറ്റൻ കൊമ്പുകളുടെ ഭാഗത്താണ് കുടുങ്ങിയതെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: ഹോമയാഗമായി അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിലെ ക്രിയയും עֹלָה എന്ന യാഗപദവും ചേർന്ന അർഥം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַּחַת בְּנוֹ
  choice: തന്റെ മകനു പകരം
  rationale: ഇവിടെ תַּחַת വ്യക്തമാക്കുന്ന പകരംവയ്ക്കൽ അർഥം നിലനിർത്തുന്നു; വാക്യത്തിനപ്പുറമുള്ള ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: תַּחַת בְּנוֹ എന്നതിലെ പകരംവയ്ക്കൽ ആശയം
  choice: തന്റെ മകനു പകരം
  alternative: തന്റെ മകന്റെ സ്ഥാനത്ത്
  rationale: ആട്ടുകൊറ്റനെ മകനു പകരമായി അർപ്പിച്ചു എന്ന കഥാസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട ഉപദേശപരമായ വിശദീകരണങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. കഥനത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്താൻ ‘കണ്ണുകളുയർത്തി’, ‘അതാ’ എന്നിവ സംരക്ഷിച്ചു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത സർവനാമം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
