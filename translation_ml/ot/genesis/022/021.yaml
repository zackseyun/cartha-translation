theological_decisions:
- issue: אֲבִי אֲרָם എന്ന വംശാവലിപ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: അരാമിന്റെ പിതാവായ കെമൂവേൽ
  alternative: അരാമിന്റെ പൂർവികനായ കെമൂവേൽ
  rationale: ഹീബ്രായ ഘടനയുടെ ഏറ്റവും നേരിട്ടുള്ള അർഥം ‘അരാമിന്റെ പിതാവ്’ എന്നാണ്. എന്നാൽ വംശാവലികളിൽ ‘പിതാവ്’ പൂർവികനെയോ വംശസ്ഥാപകനെയോ സൂചിപ്പിക്കാം; ആ യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പേരുപട്ടികയുടെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ വിഷയം ‘അരാമിന്റെ പിതാവ്’ എന്ന പ്രയോഗമായതിനാൽ [a] അതിനോടു ചേർത്തു.
