id: GEN.22.14
reference: Genesis 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: ml
  text: അബ്രാഹാം ആ സ്ഥലത്തിന് “യഹോവ കരുതും” എന്നു പേരിട്ടു. അതുകൊണ്ട് ഇന്നും, “യഹോവയുടെ പർവതത്തിൽ കാണപ്പെടും” എന്നു പറയപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ഈ പേരിന്റെ പദശഃ അർഥം “യഹോവ കാണും” എന്നാണ്; സന്ദർഭത്തിൽ അതിന് “യഹോവ കരുതും/ഒരുക്കും” എന്ന അർഥവുമുണ്ട്. അവസാന വാക്യഭാഗം പദശഃ “യഹോവയുടെ പർവതത്തിൽ കാണപ്പെടും” എന്നാണ്; “യഹോവ പ്രത്യക്ഷനാകും” എന്നും “കരുതിക്കൊള്ളപ്പെടും” എന്നും വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: ראה എന്ന മൂലപദത്തിന്റെ കാണുക/കരുതുക എന്ന പദപ്രയോഗവും יֵרָאֶה എന്ന നിഫാൽ രൂപത്തിന്റെ വ്യാകരണപരവും വ്യാഖ്യാനപരവുമായ തുറന്ന നിലയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: יְהוָה יִרְאֶה
  choice: യഹോവ കരുതിക്കൊള്ളും
  rationale: പദശഃ ‘യഹോവ കാണും’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ‘കാണുക’ എന്ന ക്രിയ ആവശ്യമായതു കണ്ടറിഞ്ഞ് ഒരുക്കുക/നൽകുക എന്ന അർഥം വഹിക്കുന്നു; 22:8-ലെ ദൈവം യാഗമൃഗത്തെ ‘കണ്ടുകൊള്ളും’ എന്ന പ്രയോഗവുമായും ഇത് ബന്ധപ്പെടുന്നു.
- source_word: בְּהַר יְהוָה
  choice: യഹോവയുടെ പർവതത്തിൽ
  rationale: ബന്ധസൂചക ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יֵרָאֶה
  choice: കരുതിക്കൊള്ളപ്പെടും
  rationale: നിഫാൽ രൂപത്തിന്റെ ‘കാണപ്പെടും/പ്രത്യക്ഷനാകും’ എന്ന ഭാഷാപരമായ ദ്വയാർഥത സന്ദർഭത്തിലെ ഒരുക്കിനൽകൽ ആശയവുമായി ബന്ധിപ്പിച്ച് കർമണിപ്രയോഗമായി പരിഭാഷപ്പെടുത്തി; യഹോവയാണ് കരുതുന്നവൻ എന്ന സൂചന നിലനിൽക്കുന്നു.
- source_word: עַד־הַיּוֹם
  choice: ഇന്നുവരെയും
  rationale: ഈ ചൊല്ല് ആഖ്യാതാവിന്റെ കാലംവരെ നിലനിന്നിരുന്നു എന്ന കാലസൂചന സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമമായ יהוה-യെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ראה എന്ന മൂലപദത്തിലെ ‘കാണുക/കരുതുക’ ബന്ധം
  choice: പ്രധാനവാചകത്തിൽ ‘കരുതിക്കൊള്ളും’; അടിക്കുറിപ്പിൽ പദശഃ അർഥവും സാധ്യതയും
  alternative: ‘യഹോവ കാണും’ / ‘യഹോവ പ്രത്യക്ഷനാകും’
  rationale: സംഭവസന്ദർഭത്തിൽ ദൈവം യാഗത്തിനുള്ള ആട്ടുകൊറ്റനെ ഒരുക്കുന്നതാണ് ഉദ്ദേശ്യം; എന്നാൽ ഹീബ്രുവിലെ പദപ്രയോഗവും രണ്ടാം വാക്യഭാഗത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വവും മറയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമകരണം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ആവർത്തനഘടന നിലനിർത്തുകയും ചെയ്തു.
