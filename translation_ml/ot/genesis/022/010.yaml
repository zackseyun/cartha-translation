id: GEN.22.10
reference: Genesis 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אַבְרָהָם֙ אֶת יָד֔/וֹ וַ/יִּקַּ֖ח אֶת הַֽ/מַּאֲכֶ֑לֶת לִ/שְׁחֹ֖ט אֶת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: ml
  text: അപ്പോൾ അബ്രാഹാം കൈ നീട്ടി, തന്റെ മകനെ അറുക്കാൻ കത്തി എടുത്തു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ കൈ മുന്നോട്ടു നീട്ടി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അറുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ ക്രിയ പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ സവിശേഷമാണ്; അതിന് യാഗാർപ്പണവുമായി ബന്ധപ്പെട്ട ധ്വനിയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: കൈ നീട്ടി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ കൈ അയയ്ക്കുക എന്നല്ല, കൈ മുന്നോട്ടു നീട്ടുക എന്ന ദൃശ്യപ്രവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יָדוֹ
  choice: കൈ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥത മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ കർത്താവായ അബ്രാഹാമിൽനിന്ന് വ്യക്തമാണ്; അതിനാൽ പ്രത്യേകം ‘തന്റെ’ ചേർക്കേണ്ടതില്ല.
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: സാധാരണ കഥനക്രമത്തിൽ ‘എടുക്കുക’ എന്ന അർഥം നേരായും സ്വാഭാവികമായും നൽകുന്നു; പിടിച്ചടക്കിയെന്ന അധിക ഭാവം ചേർക്കുന്നില്ല.
- source_word: הַמַּאֲכֶלֶת
  choice: കത്തി
  rationale: അറുക്കാൻ ഉപയോഗിക്കുന്ന മുറിക്കൽ ഉപകരണത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: לִשְׁחֹט
  choice: അറുക്കാൻ
  rationale: പൊതുവായ ‘കൊല്ലാൻ’ എന്നതിനെക്കാൾ പ്രത്യേകമായി കഴുത്തറുത്തുള്ള വധത്തെ സൂചിപ്പിക്കുകയും യാഗസന്ദർഭത്തിലെ ഭാരം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּנוֹ
  choice: തന്റെ മകനെ
  rationale: പ്രത്യയത്തിലുള്ള ഉടമസ്ഥത വ്യക്തമാക്കി, പ്രവർത്തിയുടെ ദാരുണമായ വ്യക്തിബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: שָׁחַט എന്ന ക്രിയയുടെ യാഗസംബന്ധിയായ ഭാവം പരിഭാഷയിൽ നിലനിർത്തണമോ
  choice: അറുക്കാൻ
  alternative: കൊല്ലാൻ
  rationale: ഈ ക്രിയ പൊതുവായ കൊലപാതകത്തെക്കാൾ അറവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുകയും യാഗാർപ്പണങ്ങളിൽ പതിവായി ഉപയോഗിക്കപ്പെടുകയും ചെയ്യുന്നു. ‘അറുക്കാൻ’ എന്നത് പിന്നീട് രൂപപ്പെട്ട ഒരു പ്രത്യേക സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതെ ഈ സന്ദർഭത്തിന്റെ ആചാരപരവും വൈകാരികവുമായ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായ കഥനത്തിന്റെ ചുരുക്കവും പ്രവർത്തനക്രമവും നിലനിർത്തിയിരിക്കുന്നു.
