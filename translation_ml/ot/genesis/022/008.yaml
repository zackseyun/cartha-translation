  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: ml
  text: 'അബ്രാഹാം പറഞ്ഞു: “എന്റെ മകനേ, ഹോമയാഗത്തിനുള്ള ആട്ടിൻകുട്ടിയെ ദൈവം തനിക്കായി ഒരുക്കും[a].” അങ്ങനെ അവർ ഇരുവരും ഒരുമിച്ച് മുന്നോട്ടുപോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ദൈവം തനിക്കായി ഹോമയാഗത്തിനുള്ള ആട്ടിൻകുട്ടിയെ കാണും.” ഹീബ്രു ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ “കാണുക” എന്നാണ്; എന്നാൽ ഇവിടെ പ്രയോഗാർഥത്തിൽ “ഒരുക്കുക” അല്ലെങ്കിൽ “കരുതിവെക്കുക” എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സന്ദർഭക്രമം സ്വാഭാവികമായതിനാൽ ലളിതമായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: അബ്രാഹാമിന്റെ വാക്കുകളിൽ സത്യദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: יִרְאֶה לּוֹ
  choice: തനിക്കായി ഒരുക്കും
  rationale: ראה എന്നതിന്റെ അക്ഷരാർഥം ‘കാണുക’ ആണെങ്കിലും ഇവിടെ ‘കണ്ടെത്തി ഒരുക്കുക/കരുതുക’ എന്ന പ്രയോഗാർഥമാണ്. לּוֹ എന്ന ദത്തിവാചകത്തിന്റെ സൂക്ഷ്മത ‘തനിക്കായി’ നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ ഒരു പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: הַשֶּׂה
  choice: ആട്ടിൻകുട്ടിയെ
  rationale: שֶׂה ചെമ്മരിയാടിനെയോ കോലാടിനെയോ ഉൾക്കൊള്ളാവുന്ന ചെറിയ കന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. ഈ യാഗസന്ദർഭത്തിലും മുൻചോദ്യത്തിലും ‘ആട്ടിൻകുട്ടി’ സ്വാഭാവികമാണ്; ഇനത്തെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: לְעֹלָה
  choice: ഹോമയാഗത്തിനുള്ള
  rationale: עֹלָה മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിന്റെ സ്ഥിരമായ പദമാണ്; ‘ഹോമയാഗം’ മലയാള ബൈബിൾ-മതഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
- source_word: בְּנִי
  choice: എന്റെ മകനേ
  rationale: നേരിട്ടുള്ള സ്നേഹപൂർവമായ സംബോധനയും പിതൃപുത്രബന്ധത്തിന്റെ വികാരഭാരവും നിലനിർത്തുന്നു.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: പിന്നെ അവർ ഇരുവരും ഒരുമിച്ച് മുന്നോട്ടുപോയി
  rationale: ‘ഇരുവരും’ എന്നും ‘ഒരുമിച്ച്’ എന്നും ഉള്ള ഹീബ്രു ആവർത്തന ഊന്നൽ നിലനിർത്തുകയും യാത്ര തുടരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള അബ്രാഹാമിന്റെ പ്രസ്താവനയുടെ അർഥം
  choice: ദൈവം തനിക്കായി ആട്ടിൻകുട്ടിയെ ഒരുക്കും
  alternative: ദൈവം തനിക്കായി ആട്ടിൻകുട്ടിയെ കാണും / അതിന്റെ കാര്യം നോക്കും
  rationale: സന്ദർഭത്തിൽ ‘ഒരുക്കുക’ എന്ന പ്രയോഗാർഥം ഏറ്റവും സ്വാഭാവികമാണ്; എന്നാൽ അടിക്കുറിപ്പിൽ ‘കാണുക’ എന്ന അക്ഷരാർഥം സൂചിപ്പിച്ച് ഹീബ്രുവിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു. അബ്രാഹാം ഒഴിഞ്ഞുമാറി സംസാരിക്കുകയാണോ, പ്രവചനപരമായി സംസാരിക്കുകയാണോ, രണ്ടും കൂടിയാണോ എന്ന ആഖ്യാനസംഘർഷം പരിഭാഷ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഹോമയാഗം’ എന്ന പരിചിതമായ യാഗപദം നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരീതിക്കനുസരിച്ച് ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
