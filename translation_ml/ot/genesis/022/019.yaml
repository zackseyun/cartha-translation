id: GEN.22.19
reference: Genesis 22:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַבְרָהָם֙ אֶל נְעָרָ֔י/ו וַ/יָּקֻ֛מוּ וַ/יֵּלְכ֥וּ יַחְדָּ֖ו אֶל בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֥שֶׁב אַבְרָהָ֖ם בִּ/בְאֵ֥ר שָֽׁבַע־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: ml
  text: അങ്ങനെ അബ്രാഹാം തന്റെ യുവാക്കളുടെ അടുക്കൽ മടങ്ങിവന്നു[a]. അവർ എഴുന്നേറ്റ് ഒരുമിച്ച് ബേർഷേബയിലേക്കു പോയി. അബ്രാഹാം ബേർഷേബയിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “അബ്രാഹാം തന്റെ യുവാക്കളുടെ അടുക്കൽ മടങ്ങിവന്നു.” തൊട്ടുമുമ്പുള്ള വിവരണത്തിൽ യിസ്ഹാക്ക് ഉണ്ടെങ്കിലും ഈ വാക്യഭാഗത്തിൽ അദ്ദേഹത്തെ പരാമർശിക്കുന്നില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ ഖാൽ ആഖ്യാനരൂപം ഇവിടെ നേരിട്ട് ‘മടങ്ങിവരുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: נְעָרָיו
  choice: തന്റെ യുവാക്കൾ
  rationale: נַעַר എന്ന പദത്തിന് യുവാവ്, സേവകൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. സന്ദർഭത്തിൽ ഇവർ അബ്രാഹാമിനോടൊപ്പമുണ്ടായിരുന്ന സേവകരാണെങ്കിലും, ‘യുവാക്കൾ’ എന്നത് എബ്രായപദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וַיָּקֻמוּ
  choice: അവർ എഴുന്നേറ്റ്
  rationale: קום ആഖ്യാനത്തിൽ അടുത്ത പ്രവർത്തനത്തിന്റെ ആരംഭം സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: ഒരുമിച്ച് ... പോയി
  rationale: הלך കൂടാതെ יחדו എന്ന സംയോജനം കൂട്ടായ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; സഞ്ചാരരീതി അധികമായി നിർണ്ണയിക്കാതെ ‘ഒരുമിച്ച് പോയി’ അത് വ്യക്തമാക്കുന്നു.
- source_word: בְּאֵר שָׁבַע
  choice: ബേർഷേബ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്നതിന് ഇരിക്കുക, വസിക്കുക, താമസിക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സ്ഥലത്തെ തുടർന്നുള്ള വാസത്തെ സൂചിപ്പിക്കാൻ ‘താമസിച്ചു’ സ്വാഭാവികമാണ്; പുതുതായി സ്ഥിരതാമസം സ്ഥാപിച്ചു എന്ന അധികസൂചന ഇതിൽ ഇല്ല.
theological_decisions:
- issue: മുൻവിവരണത്തിൽ യിസ്ഹാക്ക് ഉണ്ടായിരുന്നെങ്കിലും മലയിൽനിന്ന് യുവാക്കളുടെ അടുക്കൽ മടങ്ങിയതായി അബ്രാഹാമിനെ മാത്രമാണ് പറയുന്നത്
  choice: പ്രധാനവാചകത്തിൽ യിസ്ഹാക്കിനെ ചേർക്കാതെ എബ്രായപാഠത്തിലുള്ളതുപോലെ അബ്രാഹാമിനെ മാത്രം പരാമർശിച്ചു
  alternative: യിസ്ഹാക്കും മടങ്ങിയെന്ന് അനുമാനിച്ച് അദ്ദേഹത്തെ പ്രധാനവാചകത്തിൽ ചേർക്കുക
  rationale: എബ്രായപാഠം മടങ്ങിവരുന്ന വ്യക്തിയായി അബ്രാഹാമിനെ മാത്രമേ വ്യക്തമായി നാമകരണം ചെയ്യുന്നുള്ളൂ. കഥയിലെ ഈ മൗനവും അതുണ്ടാക്കുന്ന വ്യാഖ്യാനപരമായ സംഘർഷവും പരിഹരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. തുടർച്ചയായ എബ്രായ wayyiqtol രൂപങ്ങളെ മലയാളത്തിൽ ചെറുവാക്യങ്ങളാക്കി, സംഭവക്രമം വ്യക്തമായി നിലനിർത്തി.
