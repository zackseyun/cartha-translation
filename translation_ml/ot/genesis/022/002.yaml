    issue: “നിന്റെ ഏകനെ” is syntactically and idiomatically awkward in Malayalam.
    rationale: Although it follows the English audit trail’s “your only one,” Malayalam normally requires an explicit noun or a more clearly substantivized expression here. As written, it can sound as though Isaac is Abraham’s only person rather than highlighting his singular status as son.
  - severity: low
    issue: The footnote’s phrase “അതുല്യസ്ഥാനം” slightly interprets the lexical emphasis.
    rationale: The Hebrew can denote only/unique/singular status, but the note should describe the lexical range without specifying the nature of Isaac’s status.
