  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി, നിന്റെ മകനെ—നീ സ്നേഹിക്കുന്ന നിന്റെ ഏകമകനായ യിസ്ഹാക്കിനെ—കൊണ്ടുപോയി മോറിയാ ദേശത്തേക്കു പോകുക. അവിടെ ഞാൻ നിന്നോടു പറയുന്ന മലകളിൽ ഒന്നിന്മേൽ അവനെ ദഹനയാഗമായി അർപ്പിക്കുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ ഏകനെ” എന്നും പരിഭാഷപ്പെടുത്താം. യְחִידְךָ എന്ന ഹീബ്രു പദം ‘ഏകമായവൻ’ അല്ലെങ്കിൽ ‘അനന്യനായവൻ’ എന്ന ഊന്നൽ നൽകാം; ഇവിടെ അത് യിസ്ഹാക്കിന്റെ സവിശേഷതയെ ഊന്നിക്കാട്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: ദയവായി
  rationale: ആജ്ഞയോടൊപ്പമുള്ള അപേക്ഷയുടെയോ വിനയത്തിന്റെയോ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; കാലസൂചനയായ ‘ഇപ്പോൾ’ എന്ന് തെറ്റിദ്ധരിപ്പിക്കുന്നില്ല.
- source_word: בִּנְךָ
  choice: നിന്റെ മകനെ
  rationale: בֵּן എന്ന പദത്തിന്റെയും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തിന്റെയും നേരിട്ടുള്ള സ്വാഭാവിക വിവർത്തനം.
- source_word: יְחִידְךָ
  choice: നിന്റെ ഏകനെ
  rationale: ‘ഏകനായ/അതുല്യനായ വ്യക്തി’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു. ഇശ്മായേലിന്റെ അസ്തിത്വത്തെ നിഷേധിക്കാതെ, ഈ കല്പനയിൽ യിസ്ഹാക്കിനുള്ള അനന്യസ്ഥാനത്തെ തുറന്ന നിലയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: നീ സ്നേഹിക്കുന്ന
  rationale: അബ്രാഹാമിന് യിസ്ഹാക്കിനോടുള്ള നിലനിൽക്കുന്ന സ്നേഹത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלֶךְ לְךָ
  choice: പോകുക
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ മുഖ്യ ആജ്ഞ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നിനക്കായി പോകുക’ പോലുള്ള അസ്വാഭാവികമായ അതിവാച്യ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: മോറിയാ ദേശം
  rationale: സ്ഥലനാമവും אֶרֶץ എന്നതിന്റെ ‘ദേശം/പ്രദേശം’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהַעֲלֵהוּ
  choice: അവനെ ... അർപ്പിക്കുക
  rationale: לְעֹלָה എന്ന യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ‘യാഗമായി അർപ്പിക്കുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: לְעֹלָה
  choice: ദഹനയാഗമായി
  rationale: עֹלָה എന്ന സാങ്കേതിക യാഗപദത്തിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാള തുല്യം.
- source_word: עַל אַחַד הֶהָרִים
  choice: മലകളിൽ ഒന്നിന്മേൽ
  rationale: ഇനിയും നിർദിഷ്ടമാക്കാത്ത പല മലകളിൽ ഒന്നെന്ന ആശയം കൃത്യമായി നൽകുന്നു.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറയുന്ന
  rationale: אמר എന്ന ക്രിയയെ ‘പറയുക’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘കാണിച്ചുതരുക’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഇശ്മായേൽ ഉണ്ടായിരിക്കെ യിസ്ഹാക്കിനെ יְחִידְךָ എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: നിന്റെ ഏകനെ
  alternative: നിന്റെ ഏകമകനെ; നിന്റെ അതുല്യനായ മകനെ
  rationale: ‘നിന്റെ ഏകനെ’ എന്നത് യിസ്ഹാക്കിന്റെ അനന്യമായ ബന്ധപരമോ വാഗ്ദത്തപരമോ ആയ സ്ഥാനം ഊന്നിക്കാട്ടുമ്പോഴും, അത് ജൈവികമോ ഉടമ്പടിസംബന്ധമോ വാത്സല്യസംബന്ധമോ എന്നത് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല. പരമ്പരാഗതവും സന്ദർഭത്തിൽ സാധ്യവുമായ ‘നിന്റെ ഏകമകൻ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദഹനയാഗം’ എന്ന സ്ഥാപിത ബൈബിൾ-യാഗപദം നിലനിർത്തി. പ്രധാന വാക്യത്തിലെ ‘നിന്റെ ഏകനെ’ ഹീബ്രുവിലെ ബന്ധപരമായ ഊന്നലും വ്യാഖ്യാനതുറപ്പും സംരക്ഷിക്കുന്നു.
