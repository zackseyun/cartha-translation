  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: ml
  text: ബെഥൂവേൽ റിബെക്കയെ ജനിപ്പിച്ചു. ഈ എട്ടുപേരെ മിൽക്കാ അബ്രാഹാമിന്റെ സഹോദരനായ നാഹോരിന് പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: ബെഥൂവേൽ
  rationale: വംശാവലിയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ വാവ് പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; പേര് മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: പുരുഷൻ കർത്താവായ ഈ വംശാവലിസന്ദർഭത്തിൽ ജനനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת רִבְקָה
  choice: റിബെക്കയുടെ
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമചിഹ്നത്തിന് മലയാളത്തിൽ പ്രത്യേക പരിഭാഷ ആവശ്യമില്ല; വാക്യം സ്വാഭാവികമാക്കാൻ പേരിനെ സംബന്ധികരൂപത്തിൽ നൽകി.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: ഈ എട്ടുപേരെ
  rationale: ഹീബ്രായിലെ സംഖ്യാത്മക ഊന്നൽ നിലനിർത്തുകയും വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: יָלְדָה
  choice: പ്രസവിച്ചു
  rationale: മിൽക്ക സ്ത്രീകർത്താവായതിനാൽ യָלַד എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനപദം.
- source_word: מִלְכָּה
  choice: മിൽക്ക
  rationale: ഹീബ്രായ പേരിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: לְנָחוֹר
  choice: നാഹോരിനു
  rationale: ലְ എന്ന ബന്ധസൂചകത്തെ ഈ വംശാവലിസൂത്രത്തിൽ സ്വാഭാവികമായ ദാതൃവിഭക്തിയിലൂടെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֲחִי אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ സഹോദരനായ
  rationale: നാഹോരിനെ വിശേഷിപ്പിക്കുന്ന ഹീബ്രായ സംയുക്തബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
