  text: בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/יִּשָּׂ֨א אַבְרָהָ֧ם אֶת עֵינָ֛י/ו וַ/יַּ֥רְא אֶת הַ/מָּק֖וֹם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: ml
  text: മൂന്നാം ദിവസം അബ്രാഹാം കണ്ണുകൾ ഉയർത്തി, ദൂരെനിന്ന് ആ സ്ഥലം കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അകലെനിന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: നിശ്ചിത ആർട്ടിക്കിളോടുകൂടിയ കാലസൂചക പദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ; ‘യാത്രയുടെ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ
  rationale: ‘തന്റെ കണ്ണുകൾ ഉയർത്തി’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം നൽകി; തുടർന്നുള്ള കാഴ്ചയുമായി വാക്യബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം; ക്രമത്തിൽ സംഭവിച്ച കാഴ്ചയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַמָּקוֹם
  choice: ആ സ്ഥലം
  rationale: നിശ്ചിതമായ, മുമ്പേ സൂചിപ്പിക്കപ്പെട്ട ലക്ഷ്യസ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘ആ സ്ഥലം’ സന്ദർഭാനുസൃതമായി കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: מֵרָחֹק
  choice: ദൂരെ
  rationale: ദൂരത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗം; ‘അകലെനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം, അതിനാൽ പദവികൽപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ വ്യാപകമായി അംഗീകരിച്ച വ്യക്തിനാമലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘കണ്ണുകൾ ഉയർത്തുക’ എന്ന പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ‘കണ്ണുകളുയർത്തി നോക്കിയപ്പോൾ’ എന്നു നൽകി.
