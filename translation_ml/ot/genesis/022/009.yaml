source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: ml
  text: ദൈവം അവനോടു പറഞ്ഞിരുന്ന സ്ഥലത്ത് അവർ എത്തി.[a] അവിടെ അബ്രാഹാം യാഗപീഠം[b] പണിത് വിറകുകൾ ക്രമമായി അടുക്കിവെച്ചു. പിന്നെ തന്റെ മകനായ യിസ്ഹാക്കിനെ ബന്ധിച്ച് യാഗപീഠത്തിന്മേൽ വിറകുകളുടെ മുകളിൽ[c] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ദൈവം അവനോടു പറഞ്ഞ സ്ഥലത്ത്.” ഇവിടെ പറഞ്ഞത് അവർ എത്തുന്നതിനു മുമ്പുള്ള ദൈവിക നിർദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “ആ യാഗപീഠം” എന്നാണ്; ഈ യാഗത്തിനായി ഒരുക്കുന്ന നിർദിഷ്ട പീഠത്തെ അത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “വിറകുകൾക്കു മീതെ”; അതായത് അടുക്കിവെച്ച വിറകുകളുടെ മുകളിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അവർ എത്തി
  rationale: ബഹുവചന കർത്താവിനെ നിലനിർത്തുകയും തുടർച്ചയായ ആഖ്യാനചലനം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: ദൈവം അവനോടു പറഞ്ഞിരുന്ന
  rationale: അവർ എത്തുന്നതിനു മുമ്പുണ്ടായ ദൈവിക നിർദേശം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിലെ പൂർവകാലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പറഞ്ഞ’ എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിക്കായി പണിയുന്ന altar എന്ന ആശയം സാധാരണ മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തമായി നൽകുന്നു. ഹീബ്രുവിലെ നിർദിഷ്ടത മലയാളത്തിൽ പ്രത്യേക article ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: വിറകുകൾ ക്രമമായി അടുക്കിവെച്ചു
  rationale: ערך എന്ന ക്രമപ്പെടുത്തി ഒരുക്കുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു; വെറും ‘വെച്ചു’ എന്നതിനെക്കാൾ യാഗത്തിനുള്ള ഒരുക്കത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: וַיַּעֲקֹד
  choice: ബന്ധിച്ച്
  rationale: עקד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു; ‘കെട്ടിയിട്ട്’ എന്ന കൂടുതൽ സംസാരഭാഷാപരമായ രൂപത്തേക്കാൾ ഗൗരവമുള്ളതും സ്വാഭാവികവുമാണ്.
- source_word: יִצְחָק בְּנוֹ
  choice: തന്റെ മകനായ യിസ്ഹാക്കിനെ
  rationale: പുത്രബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: וַיָּשֶׂם אֹתוֹ
  choice: വെച്ചു
  rationale: שׂים എന്ന പൊതുവായ സ്ഥാനപ്പെടുത്തൽക്രിയയെ ‘കിടത്തി’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: מִמַּעַל לָעֵצִים
  choice: വിറകുകളുടെ മുകളിൽ
  rationale: ക്രമമായി വെച്ച വിറകുകൾക്കു മീതെയുള്ള സ്ഥാനം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠത്തിന്റെ നിർദിഷ്ടത
  choice: മുഖ്യവാചകത്തിൽ ‘യാഗപീഠം’; ഹീബ്രുവിലെ നിർദിഷ്ടരൂപം അടിക്കുറിപ്പിൽ
  alternative: ‘ആ യാഗപീഠം’
  rationale: ഹീബ്രുവിൽ definite article ഉണ്ടെങ്കിലും മലയാളത്തിൽ ആദ്യപരാമർശത്തിൽ ‘ആ’ ചേർക്കുന്നത് മുൻപ് നിലവിലുണ്ടായിരുന്ന ഒരു പീഠത്തെ തെറ്റായി സൂചിപ്പിക്കാം. അതിനാൽ മൂലത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: യിസ്ഹാക്കിനെ ബന്ധിച്ച പ്രവൃത്തി
  choice: ബന്ധിച്ച്
  alternative: കെട്ടിയിട്ട്
  rationale: മൂലക്രിയയുടെ ശക്തി മൃദൂകരിക്കാതെയും പരമ്പരാഗത വ്യാഖ്യാനഭാരം അധികമായി ചേർക്കാതെയും നേരിട്ട് നൽകുന്നു.
- issue: യിസ്ഹാക്കിനെ യാഗപീഠത്തിൽ സ്ഥാനപ്പെടുത്തിയത്
  choice: വെച്ചു
  alternative: കിടത്തി
  rationale: മൂലത്തിലെ പൊതുവായ שׂים എന്ന ക്രിയ ശരീരത്തിന്റെ കൃത്യമായ നില വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പരിഭാഷയും ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ആഖ്യാനത്തിന്റെ ഗൗരവം കാത്തും രചിച്ചു. ‘യാഗപീഠം’, ‘ബന്ധിച്ച്’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ശരീരനില ‘കിടത്തി’ എന്നു നിർണ്ണയിക്കാതെ ‘വെച്ചു’ എന്നു നിലനിർത്തി.
