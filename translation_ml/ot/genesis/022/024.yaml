  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: ml
  text: അവന്റെ ഉപഭാര്യയായ റെയൂമയും തെബഹ്, ഗഹം, തഹശ്, മാഖാ എന്നിവരെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: അവന്റെ ഉപഭാര്യ
  rationale: פִּילֶגֶשׁ എന്നത് ഭാര്യയിൽനിന്ന് വ്യത്യസ്തമായ സാമൂഹിക-കുടുംബസ്ഥാനമുള്ള concubine/secondary wife-നെ സൂചിപ്പിക്കുന്നു. ആ വ്യത്യാസം ചുരുക്കമായും മാന്യമായും നിലനിർത്താൻ ‘ഉപഭാര്യ’ ഉപയോഗിച്ചു.
- source_word: וּשְׁמָהּ
  choice: പേര് ... എന്നായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ പേര്’ എന്നാണ്; സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ മുൻപുള്ള സ്ത്രീയോടുള്ള ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: רְאוּמָה
  choice: രെയൂമാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: ഈ വംശാവലി സന്ദർഭത്തിൽ ילד എന്ന ക്രിയയ്ക്ക് ‘പ്രസവിക്കുക’ എന്നാണ് നേരിട്ടും സ്വാഭാവികവുമായ അർഥം.
- source_word: גַּם הִוא
  choice: അവളും
  rationale: ‘അവളും/അവളുംകൂടെ’ എന്ന എബ്രായ ഊന്നൽ വ്യക്തമായ സർവനാമത്തോടുകൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: אֶת טֶבַח וְאֶת גַּחַם וְאֶת תַּחַשׁ וְאֶת מַעֲכָה
  choice: തേബഹ്, ഗഹം, തഹശ്, മയഖാ എന്നിവരെ
  rationale: നാല് വ്യക്തിനാമങ്ങളും എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരിച്ചു; കർമസൂചകമായ ‘എന്നിവരെ’ പട്ടികയെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
