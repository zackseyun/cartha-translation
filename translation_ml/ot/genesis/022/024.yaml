translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. എബ്രായത്തിലെ സമന്വയഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും גַּם הִוא എന്ന ഊന്നൽ ‘അവളും’ എന്നു തുറന്നുവെക്കുകയും ചെയ്തു.
