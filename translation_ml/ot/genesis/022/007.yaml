  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: ml
  text: 'ഇസഹാക്ക് തന്റെ പിതാവായ അബ്രാഹാമിനോട്, “അപ്പാ!” എന്നു പറഞ്ഞു. അബ്രാഹാം, “ഞാനിതാ, മകനേ,” എന്നു പറഞ്ഞു. ഇസഹാക്ക് ചോദിച്ചു: “ഇതാ, തീയും വിറകുമുണ്ട്; എന്നാൽ ദഹനയാഗത്തിനുള്ള ആട്[a] എവിടെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഹീബ്രായ പദം ചെമ്മരിയാടുകളുടെയോ കോലാടുകളുടെയോ കൂട്ടത്തിൽപ്പെട്ട ഒരു ചെറിയ മൃഗത്തെ വിശാലമായി സൂചിപ്പിക്കാം; അത് നിർബന്ധമായും ഒരു കുഞ്ഞാടിനെ മാത്രം അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു / ചോദിച്ചു
  rationale: אמר എന്ന സാധാരണ ആഖ്യാനക്രിയയെ ‘പറഞ്ഞു’ എന്നു നിലനിർത്തി; അവസാന വാക്യം വ്യക്തമായ ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകി.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനായ
  rationale: മൂലത്തിലെ ബന്ധസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; ‘അപ്പൻ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഈ സന്ദർഭത്തിൽ ഗൗരവം നഷ്ടപ്പെടുത്താത്തതുമാണ്.
- source_word: אָבִי
  choice: അപ്പാ!
  rationale: ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള നേരിട്ടുള്ള സംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി ‘അപ്പാ’ എന്നു വരുന്നു.
- source_word: הִנֶּנִי
  choice: ഞാനിതാ
  rationale: ഹീബ്രായിലെ സന്നദ്ധ സാന്നിധ്യപ്രഖ്യാപനം ചുരുക്കമായും സാഹിത്യപ്രതിധ്വനി നിലനിർത്തിയും നൽകുന്നു; വെറും ‘എന്താ?’ എന്നതിലേക്കു ചുരുക്കിയിട്ടില്ല.
- source_word: בְּנִי
  choice: മകനേ
  rationale: ഉടമസ്ഥതയും വാത്സല്യമുള്ള നേരിട്ടുള്ള സംബോധനയും മലയാളത്തിലെ വിഭക്തിരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: കാണാവുന്ന വസ്തുക്കളിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായികണം നേരിട്ട്, സ്വാഭാവികമായി പകരുന്നു.
- source_word: הָאֵשׁ
  choice: തീ
  rationale: മലയാളത്തിൽ ഈ പട്ടികയിൽ നിർദേശക സർവനാമത്തോടൊപ്പം ‘തീ’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: הָעֵצִים
  choice: വിറക്
  rationale: ഹീബ്രായിൽ ബഹുവചനമാണെങ്കിലും യാഗത്തിനായി കൊണ്ടുവന്ന കത്തിക്കാനുള്ള മരക്കഷണങ്ങളെ മലയാളത്തിൽ ‘വിറക്’ എന്ന ദ്രവ്യനാമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַשֶּׂה
  choice: ആട്
  rationale: שֶׂה എന്നത് ചെമ്മരിയാടിനെയോ കോലാടിനെയോ ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആട്’ സന്ദർഭത്തിൽ സ്വാഭാവികവും ‘കുഞ്ഞാട്’ എന്നതിലേക്കു അർഥം അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്; കൃത്യമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְעֹלָה
  choice: ദഹനയാഗത്തിനുള്ള
  rationale: עֹלָה എന്ന മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ വ്യക്തവും മതവിഭാഗനിരപേക്ഷവുമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന הַשֶּׂה എന്ന പദത്തിന്റെ പരിധി
  choice: ആട്
  alternative: കുഞ്ഞാട് / ചെമ്മരിയാട് / ആട്ടിൻകുട്ടി
  rationale: മൂലപദം ഒരു കുഞ്ഞാടിനെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ചെമ്മരിയാടോ കോലാടോ ആയ കൂട്ടമൃഗത്തെ സൂചിപ്പിക്കാം. അതിനാൽ ക്രിസ്തീയ മുൻസൂചനയുടെ വെളിച്ചത്തിൽ പദത്തെ ‘കുഞ്ഞാട്’ എന്നു ചുരുക്കാതെ മൂലത്തിലെ വിശാലത സംരക്ഷിച്ചു.
- issue: הִנֶּנִי എന്ന പ്രതികരണത്തിന്റെ ഭാവം
  choice: ഞാനിതാ
  alternative: എന്താ? / ഞാൻ ഇവിടെയുണ്ട്
  rationale: ഇത് സ്ഥാനം അറിയിക്കുന്ന മറുപടി മാത്രമല്ല, ശ്രദ്ധയോടെയും സന്നദ്ധതയോടെയും പ്രതികരിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘ഞാനിതാ’ അതിന്റെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനി മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ രംഗത്തിന്റെ ഗൗരവവും പിതാപുത്രസംഭാഷണത്തിലെ വാത്സല്യവും നിലനിർത്തുന്ന ശൈലി. ആവർത്തിച്ചുള്ള ഹീബ്രായി ‘പറഞ്ഞു’ എന്ന ഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരുകൾ വീണ്ടും ചേർത്തും അവസാനത്തേത് ‘ചോദിച്ചു’ എന്നും സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘ആട്’ എന്ന പദത്തിനരികിൽ വെച്ചു.
