id: GEN.22.12
reference: Genesis 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ബാലന്റെമേൽ കൈവെക്കരുത്; അവനോട് ഒന്നും ചെയ്യരുത്. നീ ദൈവത്തെ ഭയപ്പെടുന്നവനാണെന്ന് ഇപ്പോൾ എനിക്കറിയാം. കാരണം, നിന്റെ മകനെ—നിന്റെ ഏകമകനെ—എനിക്കു തരാതെ നീ പിടിച്ചുവെച്ചില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: മേൽ കൈവെക്കരുത്
  rationale: ഹീബ്രു പ്രയോഗം ഇവിടെ ബാലനെ ആക്രമിക്കുകയോ ഉപദ്രവിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മേൽ കൈവെക്കുക’ അതിന്റെ പ്രയോഗാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַנַּעַר
  choice: ബാലൻ
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ് എന്നീ അർഥങ്ങൾ വരാം; ഈ രംഗത്തിലെ ആഖ്യാനശൈലിക്ക് ‘ബാലൻ’ യോജിക്കുന്നു.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: അവനോട് ഒന്നും ചെയ്യരുത്
  rationale: മുഴുവൻ വിലക്കും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַתָּה יָדַעְתִּי
  choice: ഇപ്പോൾ ഞാൻ അറിഞ്ഞിരിക്കുന്നു
  rationale: ദൈവികജ്ഞാനത്തെക്കുറിച്ചുള്ള വാക്യത്തിലെ നേരിട്ടുള്ള ഭാഷ മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; perfect രൂപത്തിന്റെ ഫലാവസ്ഥയും വ്യക്തമാക്കുന്നു.
- source_word: יְרֵא אֱלֹהִים
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവൻ
  rationale: ‘ഭയപ്പെടുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ഭക്തൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: חָשַׂכְתָּ
  choice: തരാതെ നീ പിടിച്ചുവെച്ചില്ല
  rationale: מן ചേർന്ന ഘടനയിൽ ‘എന്നിൽനിന്ന് തടഞ്ഞുവെച്ചില്ല’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘ഒഴിവാക്കിയില്ല’ എന്നതിനെക്കാൾ യാഗപരീക്ഷയുടെ സന്ദർഭം നിഷ്പക്ഷമായി സൂക്ഷിക്കുന്നു.
- source_word: יְחִידְךָ
  choice: നിന്റെ ഏകമകൻ
  rationale: മുൻപുള്ള ‘നിന്റെ മകൻ’ എന്നതോടുള്ള ഊന്നൽ നിറഞ്ഞ സമാനാധികരണത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പ്രിയപ്പെട്ടവൻ’ എന്ന സന്ദർഭസൂചന പദാർത്ഥത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: מִמֶּנִּי
  choice: എനിക്കു
  rationale: അക്ഷരാർഥം ‘എന്നിൽനിന്ന്’ ആണെങ്കിലും, പിടിച്ചുവെക്കുക എന്ന മലയാളഘടനയിൽ ലക്ഷ്യസ്വീകർത്താവിനെ ‘എനിക്കു’ എന്നു നൽകുന്നത് ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഇപ്പോൾ ഞാൻ അറിഞ്ഞിരിക്കുന്നു’ എന്നതിലെ ദൈവജ്ഞാനത്തിന്റെ മാനുഷരൂപക അവതരണം
  choice: വാചകത്തിന്റെ നേരിട്ടുള്ള പ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: ‘ഇപ്പോൾ അത് വെളിവായിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ ഞാൻ കണ്ടിരിക്കുന്നു’
  rationale: ഹീബ്രു പാഠം ‘ഇപ്പോൾ ഞാൻ അറിഞ്ഞു’ എന്നു തന്നെയാണ് പറയുന്നത്. ദൈവത്തിന്റെ സർവജ്ഞതയെക്കുറിച്ചുള്ള ഒരു സിദ്ധാന്തവുമായി ഒത്തുചേരാൻ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിച്ചിട്ടില്ല.
- issue: יְחִידְךָ എന്നതിന്റെ ബന്ധപരമായ അർഥം
  choice: ‘നിന്റെ ഏകമകൻ’
  alternative: ‘നിന്റെ ഏകവൻ’ അല്ലെങ്കിൽ ‘നിന്റെ പ്രിയമകൻ’
  rationale: ഇവിടെ ഇസഹാക്ക് ഉടമ്പടിസന്ദർഭത്തിലെ ഏകമകനാണ്; ‘പ്രിയ’ എന്നത് സാധ്യമായ സന്ദർഭനിറമെങ്കിലും പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. മൂലത്തിൽ വ്യക്തമായിട്ടില്ലാത്ത പ്രസംഗകന്റെ തിരിച്ചറിയൽ ഈ ഒറ്റവാക്യത്തിൽ വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
