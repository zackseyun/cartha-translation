  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: ml
  text: യഹോവയുടെ ദൂതൻ സ്വർഗത്തിൽനിന്ന് അബ്രാഹാമിനെ രണ്ടാം പ്രാവശ്യം വിളിച്ചു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ സന്ദേശവാഹകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: വാവു-തുടർച്ചയുള്ള ക്രിയ കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രവൃത്തിയാണ്; ഇവിടെ קרא നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതായതിനാൽ ‘വിളിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ അല്ലെങ്കിൽ ‘സന്ദേശവാഹകൻ’ എന്നർഥമാകാം. ഈ ആവർത്തിതമായ ഉല്പത്തി പ്രയോഗത്തിൽ സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമായി ‘ദൂതൻ’ സ്വീകരിച്ചു; വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രനിഗമനം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: אֶל אַבְרָהָם
  choice: അബ്രാഹാമിനെ
  rationale: אֶל ഇവിടെ വിളിയുടെ അഭിസംബോധിതനെ അടയാളപ്പെടുത്തുന്നു; ‘അബ്രാഹാമിനെ വിളിച്ചു’ എന്നത് സ്വാഭാവികമായ മലയാള പ്രയോഗമാണ്.
- source_word: שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ‘വീണ്ടും’ എന്നതിനെക്കാൾ എബ്രായത്തിലെ വ്യക്തമായ ക്രമസംഖ്യാഭാവം ‘രണ്ടാം പ്രാവശ്യം’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: שָׁמַיִם രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ ദൈവിക വിളിയുടെ ഉറവിടം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള സമാനപദം ‘ആകാശത്തുനിന്ന്’ ആണ്.
theological_decisions:
- issue: מַלְאַךְ יְהוָה എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യഹോവയുടെ ദൂതൻ
  alternative: യഹോവയുടെ സന്ദേശവാഹകൻ
  rationale: ഈ പദപ്രയോഗത്തെ അതിന്റെ നിഘണ്ടുപരമായ അർഥത്തിൽ വിവർത്തനം ചെയ്യുന്നു; ദൂതൻ സൃഷ്ടിക്കപ്പെട്ട സ്വർഗീയജീവിയാണോ ദൈവത്തിന്റെ പ്രത്യേക പ്രത്യക്ഷതയാണോ എന്ന വിശാലമായ ദൈവശാസ്ത്രവിവാദം വാക്യത്തിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സ്വാഭാവിക മലയാളക്രമം ഉപയോഗിച്ചു; വാക്യാവസാനത്തിലെ തുടർച്ചാസൂചകമായ ദ്വിബിന്ദു നിലനിർത്തി.
