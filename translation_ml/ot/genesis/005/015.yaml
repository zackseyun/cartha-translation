source:
  edition: WLC
  text: וַֽ/יְחִ֣י מַֽהֲלַלְאֵ֔ל חָמֵ֥שׁ שָׁנִ֖ים וְ/שִׁשִּׁ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת יָֽרֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: ml
  text: മഹലലേൽ അറുപത്തഞ്ചു വർഷം ജീവിച്ചു; തുടർന്ന് യാരെദിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിയുടെ സൂത്രവാക്യത്തിൽ ഈ ക്രിയ അടുത്ത സംഭവത്തിനു മുമ്പുള്ള ആയുസ്സുകാലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ജീവിച്ചശേഷം’ എന്നു നൽകി.
- source_word: מַהֲלַלְאֵל
  choice: മഹലലേൽ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: അറുപത്തഞ്ചു വർഷം
  rationale: എബ്രായത്തിലെ ‘അഞ്ചും അറുപതും’ എന്ന സംഖ്യാക്രമം സ്വാഭാവിക ആധുനിക മലയാളക്രമത്തിലാക്കി, കൃത്യമായ മൂല്യം നിലനിർത്തി.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശാവലിയിൽ ילד പിതാവായി സന്താനത്തെ ജനിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶת יָרֶד
  choice: യാരെദിനെ
  rationale: אֶת നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ കർമവിഭക്തിയിലൂടെ അത് പ്രകടമാക്കി, പേര് എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. എബ്രായ പദക്രമം യാന്ത്രികമായി പകർത്താതെ കാലബന്ധവും കർമബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
