source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: ml
  text: 'അവൻ അവന് നോഹ[a] എന്നു പേരിട്ടു: “യാഹ്‌വേ ശപിച്ച നിലം നിമിത്തമുള്ള നമ്മുടെ വേലയിൽനിന്നും നമ്മുടെ കൈകളുടെ വേദനാജനകമായ അധ്വാനത്തിൽനിന്നും ഇവൻ നമ്മെ ആശ്വസിപ്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നോഹ” എന്ന പേര് “വിശ്രമം” എന്ന ആശയത്തോടു ശബ്ദസാമ്യമുള്ളതാണ്. ഇവിടെ “ആശ്വസിപ്പിക്കും” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായക്രിയയുമായും ഒരു പദപ്രയോഗമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: അവൻ അവന് ... എന്നു പേരിട്ടു
  rationale: പേരിടൽ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: זֶה
  choice: ഇവൻ
  rationale: കുഞ്ഞിനെ ചൂണ്ടിക്കാണിക്കുന്ന പുരുഷലിംഗ ഏകവചന സൂചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְנַחֲמֵנוּ
  choice: നമ്മെ ആശ്വസിപ്പിക്കും
  rationale: נחם എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ആശ്വസിപ്പിക്കുക എന്നത് നിലനിർത്തുന്നു; നോഹ എന്ന പേരുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: מִמַּעֲשֵׂנוּ
  choice: നമ്മുടെ വേലയിൽനിന്നും
  rationale: ഇവിടെ മַעֲשֶׂה ധാർമിക പ്രവൃത്തികളെയല്ല, മനുഷ്യാധ്വാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: നമ്മുടെ കൈകളുടെ കഠിനാധ്വാനത്തിൽനിന്നും
  rationale: ഉല്പത്തി 3:17-നെ പ്രതിധ്വനിപ്പിക്കുന്ന വേദനയും അധ്വാനക്ലേശവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു; കൈകളുടെ എന്ന ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: מִן־הָאֲדָמָה
  choice: ഈ മണ്ണിൽനിന്നുള്ള
  rationale: ശാപം ലഭിച്ച കൃഷിഭൂമിയുമായുള്ള അധ്വാനത്തിന്റെ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുകയും אֲדָמָהയുടെ മണ്ണ്/നിലം എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: നോഹ എന്ന പേരും יְנַחֲמֵנוּ എന്ന ക്രിയയും തമ്മിലുള്ള പദപ്രയോഗം
  choice: മുഖ്യവാചകത്തിൽ “ആശ്വസിപ്പിക്കും”; അടിക്കുറിപ്പിൽ വിശ്രമം/ആശ്വാസം എന്ന ശബ്ദബന്ധം
  alternative: “നമുക്ക് ആശ്വാസം നൽകും” അല്ലെങ്കിൽ “നമുക്ക് വിശ്രമം നൽകും”
  rationale: ക്രിയയുടെ സാധാരണ അർഥം ‘ആശ്വസിപ്പിക്കുക’ എന്നതാണ്; എന്നാൽ പേരായ נֹחַ ‘വിശ്രമം’ എന്ന ആശയവുമായി ശബ്ദസാമ്യം പുലർത്തുന്നു. കർശനമായ വ്യുത്പത്തി അവകാശപ്പെടാതെ രണ്ടും സംരക്ഷിക്കുന്നു.
- issue: മണ്ണിൽനിന്ന് ലഭിക്കുന്ന ആശ്വാസത്തിന്റെ വാക്യബന്ധം
  choice: “യഹോവ ശപിച്ച ഈ മണ്ണിൽനിന്നുള്ള നമ്മുടെ വേലയിൽനിന്നും...”
  alternative: “യഹോവ ശപിച്ച മണ്ണ് നിമിത്തമുള്ള...”
  rationale: מן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന രൂപം നിലനിർത്തുമ്പോഴും, ആശ്വാസം മണ്ണിൽനിന്നല്ല മറിച്ച് അതുമായി ബന്ധപ്പെട്ട അധ്വാനക്ലേശത്തിൽനിന്നാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ പേരിടൽസൂത്രവും ‘കൈകളുടെ’ എന്ന ദൃശ്യഭാഷയും ദൈവനാമവും സംരക്ഷിച്ചു; അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
