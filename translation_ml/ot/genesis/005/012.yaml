- from: കേനാൻ എഴുപതു വയസ്സുവരെ ജീവിച്ചശേഷം മഹലലേലിനു ജന്മം നൽകി.[a]
  to: കേനാൻ എഴുപതു വയസ്സായപ്പോൾ മഹലലേലിന് പിതാവായി.[a]
