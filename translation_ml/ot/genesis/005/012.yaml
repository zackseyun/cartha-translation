    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിസൂത്രത്തിൽ חיה ‘ജീവിച്ചു’ എന്നാണ്; തുടർന്നുള്ള ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാനും പ്രായം സൂചിപ്പിക്കാനും ‘ജീവിച്ചശേഷം’ ഉപയോഗിച്ചു.
- source_word: קֵינָן
  choice: കേനാൻ
  rationale: എബ്രായരൂപമായ קֵינָן-നെ ആധാരമാക്കിയ മലയാള ലിപ്യന്തരണം.
- source_word: שִׁבְעִים שָׁנָה
  choice: എഴുപതു വയസ്സുവരെ
  rationale: ഇത് സന്താനജനനസമയത്തെ കേനാന്റെ പ്രായം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എഴുപതു വയസ്സുവരെ ജീവിച്ചശേഷം’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: הוליד എന്ന ഹിഫീൽ രൂപം പുരുഷവംശാവലിയിൽ ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥം നൽകുന്നു; ‘ജന്മം നൽകി’ ആ കാരകഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്ന എബ്രായ വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ വേറെ പദം ആവശ്യമില്ല.
- source_word: מַהֲלַלְאֵל
  choice: മഹലലേൽ
  rationale: എബ്രായനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
