  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: ml
  text: ആദാം നൂറ്റിമുപ്പത് വർഷം ജീവിച്ചു; തന്റെ സാദൃശ്യത്തിൽ, തന്റെ പ്രതിരൂപപ്രകാരം[a] ഒരു മകന്നു പിതാവായി[b], അവന് ശേത്ത് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ സാദൃശ്യത്തിൽ, തന്റെ പ്രതിരൂപപ്രകാരം” എന്ന പ്രയോഗം ഉല്പത്തി 1:26–27-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ജനിപ്പിച്ചു” അല്ലെങ്കിൽ “സന്താനത്തെ ഉളവാക്കി”; എബ്രായത്തിൽ പുരുഷകർത്താവിനോടുകൂടി പിതൃത്വം സൂചിപ്പിക്കുന്ന ക്രിയയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിയുടെ പ്രായസൂത്രത്തിൽ ഈ ക്രിയ, മകനെ ജനിപ്പിച്ച സംഭവത്തോളം ആദാം ജീവിച്ച കാലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമാക്കാൻ ‘ജീവിച്ചശേഷം’ എന്നു നൽകി.
- source_word: אָדָם
  choice: ആദാം
  rationale: ഇവിടെ പൊതുവായ ‘മനുഷ്യൻ’ എന്നല്ല, വംശാവലിയിലെ വ്യക്തിനാമമായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: നൂറ്റിമുപ്പത് വർഷം
  rationale: എബ്രായ സംഖ്യാവാക്യത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: ഒരു മകനെ ജനിപ്പിച്ചു
  rationale: പുരുഷകർത്താവോടുകൂടിയ ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥം നൽകുന്നു. തുടർന്നുള്ള പേരിടലിൽ നിന്ന് സൂചിതമായ ഏകവചന സന്താനത്തെ ‘ഒരു മകനെ’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בִּדְמוּתוֹ
  choice: തന്റെ സാദൃശ്യത്തിൽ
  rationale: דמות സൂചിപ്പിക്കുന്ന സാമ്യം നിലനിർത്തുകയും ഉല്പത്തി 1:26-ലെ ഭാഷാപ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּצַלְמוֹ
  choice: തന്റെ പ്രതിരൂപപ്രകാരം
  rationale: צלם എന്നതിനു ‘പ്രതിരൂപം’ നൽകി, כְ എന്ന ഉപസർഗത്തെ ‘പ്രകാരം’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു; ‘സാദൃശ്യം’ എന്ന മുൻപദവുമായി ഉള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: അവന് ശേത്ത് എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് ശേത്ത് എന്നു വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֵׁת
  choice: ശേത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ആദാമിന്റെ മകനും ആദാമിന്റെ സാദൃശ്യവും പ്രതിരൂപവും തമ്മിലുള്ള ബന്ധം
  choice: ആദാമിനോടുള്ള സാമ്യം നേരിട്ട് പ്രകടിപ്പിക്കുന്ന ഭാഷ നിലനിർത്തി; ദൈവപ്രതിരൂപം നഷ്ടപ്പെട്ടു, ക്ഷയിച്ചു, അല്ലെങ്കിൽ മാറ്റപ്പെട്ടു എന്ന നിഗമനം ചേർത്തില്ല.
  alternative: വീഴ്ചയ്ക്കുശേഷം ദൈവപ്രതിരൂപം ക്ഷയിച്ചുവെന്നോ, ഈ പദപ്രതിധ്വനിക്ക് ദൈവശാസ്ത്രപരമായ പ്രസക്തിയില്ലെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാചകം ഉല്പത്തി 1:26–27-നെ ഉദ്ദേശപൂർവം പ്രതിധ്വനിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രഫലം ഇവിടെ വിശദീകരിക്കുന്നില്ല; അതിനാൽ പാഠത്തിലെ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ‘സാദൃശ്യം/പ്രതിരൂപം’ എന്ന ഇരട്ടപദപ്രയോഗം ഉദ്ദേശപൂർവം നിലനിർത്തി; പേരിടൽ മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
