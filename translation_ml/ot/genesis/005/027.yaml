source:
  edition: WLC
  text: וַ/יִּהְיוּ֙ כָּל יְמֵ֣י מְתוּשֶׁ֔לַח תֵּ֤שַׁע וְ/שִׁשִּׁים֙ שָׁנָ֔ה וּ/תְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/027.yaml
  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: ml
  text: അങ്ങനെ മെഥൂശലഹിന്റെ ആയുഷ്കാലം ആകെ തൊള്ളായിരത്തി അറുപത്തൊൻപത് വർഷമായിരുന്നു; പിന്നെ അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: ആയുഷ്കാലം ആകെ ... ആയിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘എല്ലാ ദിവസങ്ങളും’ എന്നാണെങ്കിലും, വംശാവലിയുടെ സംഗ്രഹസൂത്രത്തിൽ ഉദ്ദേശിക്കുന്നത് ആകെ ആയുഷ്കാലമാണ്. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מְתוּשֶׁלַח
  choice: മെഥൂശലഹ്
  rationale: ഹീബ്രു വ്യക്തിനാമമായ מְתוּשֶׁלַח എന്നതിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: തൊള്ളായിരത്തി അറുപത്തൊൻപത് വർഷം
  rationale: ഹീബ്രുവിൽ 69 ആദ്യം, 900 പിന്നീട് വരുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ ആകെ സംഖ്യ 969 ആയി നൽകുന്നു. സംഖ്യയ്ക്കുശേഷം ‘വർഷം’ ഉപയോഗിക്കുന്നത് സാധാരണ മലയാളപ്രയോഗമാണ്.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വംശാവലിയുടെ പതിവ് സമാപനസൂത്രം. וַ־യുടെ കഥനതുടർച്ച ‘പിന്നെ’ എന്ന പദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളം; ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഹീബ്രു സൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി.
