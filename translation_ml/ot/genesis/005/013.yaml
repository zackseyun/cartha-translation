  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: ml
  text: മഹലലേലിന് പിതാവായശേഷം കേനാൻ എണ്ണൂറ്റി നാൽപ്പത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലികളിലെ ആയുസ്സുവിവരണത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: קֵינָן
  choice: കേനാൻ
  rationale: ഹീബ്രു നാമരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: മഹലലേലിന്റെ ജനനത്തിനു പിന്നാലെയുള്ള കാലഘട്ടം വ്യക്തമാക്കുന്ന സ്വാഭാവിക കാലസൂചകം.
- source_word: הוֹלִידוֹ
  choice: മഹലലേലിനെ ജനിപ്പിച്ച
  rationale: ആൺവിഷയത്തോടുകൂടിയ ילד എന്ന ഹിഫീൽ ക്രിയയുടെ കാരകഭാവം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: מַהֲלַלְאֵל
  choice: മഹലലേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: എണ്ണൂറ്റിനാല്പതു വർഷം
  rationale: ഹീബ്രുവിലെ ഘടകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ ചേർത്ത് അതേ ആകെ കാലയളവ് നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: ആദ്യ ക്രിയയുമായുള്ള പദസാമ്യം കാത്തുസൂക്ഷിക്കുകയും പുരുഷവിഷയത്തിന്റെ കാരകപ്രയോഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: ഹീബ്രു പ്രത്യേകം പറയുന്ന ആൺ-പെൺ സന്തതികളെ പൊതുവായ ‘മക്കൾ’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതെ നിലനിർത്തുന്നു.
