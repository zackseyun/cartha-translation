  to: മഹലലേലിന് പിതാവായശേഷം കേനാൻ എണ്ണൂറ്റി നാൽപ്പത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാർക്കും പുത്രിമാർക്കും പിതാവായി.
