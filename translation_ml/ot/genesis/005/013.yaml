translation_notes:
  register: ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം. ഹീബ്രു വംശാവലിയുടെ ആവർത്തനഘടന സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവിക കാലക്രമവും വാക്യപ്രവാഹവും പിന്തുടർന്നു.
