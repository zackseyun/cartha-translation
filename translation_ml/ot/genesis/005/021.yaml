id: GEN.5.21
reference: Genesis 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִ֣י חֲנ֔וֹךְ חָמֵ֥שׁ וְ/שִׁשִּׁ֖ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת מְתוּשָֽׁלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/021.yaml
  text: Enoch lived sixty-five years and fathered Methuselah.
translation:
  language: ml
  text: ഹാനോക്ക് അറുപത്തഞ്ചു വർഷം ജീവിച്ചു, മെഥൂശലഹിന് പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ, മകനെ ജനിപ്പിച്ച സംഭവത്തോളം ജീവിച്ച കാലയളവിനെ സൂചിപ്പിക്കുന്നു. അടുത്ത ക്രിയയുമായുള്ള സമയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ജീവിച്ചശേഷം’ എന്നു നൽകി.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: അറുപത്തഞ്ചു വർഷം
  rationale: ഹീബ്രുവിലെ ‘അഞ്ചും അറുപതും’ എന്ന ക്രമം മാറ്റി സ്വാഭാവിക ആധുനിക മലയാള സംഖ്യാരൂപം ഉപയോഗിച്ചു.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷൻ കർത്താവായുള്ള വംശാവലി സന്ദർഭത്തിൽ ילד എന്ന ക്രിയയ്ക്ക് ‘പിതാവായി/ജനിപ്പിച്ചു’ എന്ന അർഥമുണ്ട്. സംക്ഷിപ്തവും പതിവുള്ളതുമായ വംശാവലി പ്രയോഗമായി ‘ജനിപ്പിച്ചു’ തിരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് ഹീബ്രുവിലെ നിർദ്ദിഷ്ട പ്രത്യക്ഷകർമ ചിഹ്നമാണ്; മലയാളത്തിൽ അതിന് വേറൊരു പദം ആവശ്യമില്ല.
- source_word: מְתוּשָׁלַח
  choice: മെഥൂശലഹ്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ വായിക്കാവുന്നതുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; വിഭക്തി ചേർന്ന പാഠത്തിൽ ‘മെഥൂശലഹിനെ’ എന്നു വരുന്നു.
