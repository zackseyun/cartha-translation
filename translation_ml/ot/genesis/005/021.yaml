translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. പുരാതനമോ അത്യന്തം സംസ്കൃതവത്കൃതമോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
