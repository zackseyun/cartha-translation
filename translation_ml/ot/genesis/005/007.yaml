id: GEN.5.7
reference: Genesis 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: ml
  text: എനോശിനെ ജനിപ്പിച്ചശേഷം ശേത്ത് എണ്ണൂറ്റിയേഴു വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ ഒരു നിർദിഷ്ട സംഭവത്തിനുശേഷമുള്ള ജീവിതകാലം അറിയിക്കുന്നു; അതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ‘ജീവിച്ചു’ എന്നാണ്.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: എനോശിനെ ജനിപ്പിച്ചശേഷം
  rationale: אַחֲרֵי കാലപരമായ ‘ശേഷം’ എന്ന ബന്ധവും, ילד എന്ന ഹിഫീൽ രൂപത്തിന്റെ പുരുഷവംശാവലി അർഥമായ ‘ജനിപ്പിച്ചു’ എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֱנוֹשׁ
  choice: എനോശ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ പ്രതിലിപീകരിക്കുന്നു.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: എണ്ണൂറ്റിയേഴു വർഷം
  rationale: ഹീബ്രുവിൽ ചെറിയ സംഖ്യ ആദ്യം വന്നാലും ആകെ 807 വർഷമാണ്; സ്വാഭാവിക മലയാള സംഖ്യാക്രമത്തിൽ അതു നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിസന്ദർഭത്തിലെ ילד എന്ന ക്രിയയുടെ കാരകാർഥം വ്യക്തമായി നൽകുന്നു; പഴഞ്ചൻ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: മൂലപാഠം ആൺ-പെൺ സന്തതികളെ പ്രത്യേകം പറയുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലത്തിലെ രണ്ട് ക്രിയാഖണ്ഡങ്ങൾ സ്വാഭാവികമായി വേർതിരിക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു; പുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
