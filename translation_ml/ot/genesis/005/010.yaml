  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: ml
  text: കേനാനെ[a] ജനിപ്പിച്ചശേഷം എനോശ് എണ്ണൂറ്റിപ്പതിനഞ്ച് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായ പേര് ‘കേനാൻ’; ഗ്രീക്ക് സ്വാധീനമുള്ള പരമ്പരാഗത രൂപം ‘കയിനാൻ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: אֱנוֹשׁ
