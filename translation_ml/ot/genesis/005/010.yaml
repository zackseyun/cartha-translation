  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രായ വാക്യക്രമത്തിലെ അസ്വാഭാവികത പകർത്താതെ, കാലയളവ് വ്യക്തമായി വായിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
