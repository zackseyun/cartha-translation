revisions:
- from: ആദാമിന്റെ തലമുറകളുടെ പുസ്തകം ഇതാണ്. ദൈവം മനുഷ്യനെ[b] സൃഷ്ടിച്ച നാളിൽ[a], ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ അവനെ ഉണ്ടാക്കി.
  to: ആദാമിന്റെ തലമുറകളുടെ പുസ്തകം ഇതാണ്. ദൈവം മനുഷ്യനെ[b] സൃഷ്ടിച്ച നാളിൽ[a], അവനെ ദൈവത്തിന്റെ സാദൃശ്യപ്രകാരം ഉണ്ടാക്കി.
  rationale: മൂലപാഠത്തിലെ בִּדְמוּת (‘സാദൃശ്യപ്രകാരം/സാദൃശ്യത്തിൽ അനുസരിച്ച്’) എന്ന ബന്ധം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ ‘ദൈവത്തിന്റെ സാദൃശ്യപ്രകാരം’ എന്നു തിരുത്തി. ഇതിലൂടെ ‘സാദൃശ്യം’ എന്ന പ്രധാന പദവും ‘ഉണ്ടാക്കി’ എന്ന עָשָׂה-യുടെ വിശാലക്രിയാർഥവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും അർഥവും മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
