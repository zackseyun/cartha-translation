id: GEN.5.1
reference: Genesis 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: ml
  text: ആദാമിന്റെ തലമുറകളുടെ പുസ്തകം ഇതാണ്. ദൈവം മനുഷ്യനെ[b] സൃഷ്ടിച്ച നാളിൽ[a], അവനെ ദൈവത്തിന്റെ സാദൃശ്യപ്രകാരം ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവം മനുഷ്യനെ സൃഷ്ടിച്ചപ്പോൾ.’ ‘നാളിൽ’ എന്ന ഹീബ്രു പ്രയോഗം ‘എപ്പോൾ’ എന്ന കാലസൂചക അർഥത്തിൽ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘മനുഷ്യൻ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഹീബ്രുപദം സന്ദർഭമനുസരിച്ച് ‘മനുഷ്യവർഗം’ എന്നും വിവർത്തനം ചെയ്യാം; വാക്യത്തിലെ ആദ്യപ്രയോഗത്തിൽ അതേ പദം ‘ആദാം’ എന്ന വ്യക്തിനാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: പുസ്തകം ഇതാണ്
  rationale: ഹീബ്രുവിലെ നാമവാക്യവും സൂചകസർവനാമവും മലയാളത്തിലെ സ്വാഭാവികമായ തലക്കെട്ടുശൈലിയിൽ അവതരിപ്പിക്കുന്നു; ‘ആണ്’ എന്ന ക്രിയ ആശയത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: תּוֹלְדֹת
  choice: തലമുറകൾ
  rationale: ഉല്പത്തിപുസ്തകത്തിലെ ആവർത്തിച്ചുവരുന്ന ഘടനാപദത്തിന്റെ തലമുറകൾ, സന്തതിപരമ്പര, അവയുടെ വിവരണം എന്നീ അർഥവ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു.
- source_word: אָדָם (ആദ്യ പ്രയോഗം)
  choice: ആദാം
  rationale: തുടർന്നുവരുന്ന വംശാവലിയുടെ പൂർവികനെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തിനാമമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: בְּיוֹם בְּרֹא
  choice: സൃഷ്ടിച്ച നാളിൽ
  rationale: ‘സൃഷ്ടിച്ചപ്പോൾ’ എന്ന കാലസൂചക അർഥം സാധ്യമാണെങ്കിലും, ഹീബ്രുവിലെ ‘നാളിൽ’ എന്ന ഔപചാരിക പ്രയോഗവും ഉല്പത്തി 1–2-ലേക്കുള്ള പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഏകവചന ക്രിയാഭാവത്തോടെ വരുന്ന ദൈവനാമത്തിന് സാധാരണ മലയാളരൂപം.
- source_word: אָדָם (രണ്ടാം പ്രയോഗം)
  choice: മനുഷ്യൻ
  rationale: സൃഷ്ടിവിവരണത്തെ പ്രതിധ്വനിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ പദം മനുഷ്യനെ പൊതുവായും പ്രതിനിധിപരമായ ഏകവചനത്തിലും സൂചിപ്പിക്കുന്നു.
- source_word: בִּדְמוּת אֱלֹהִים
  choice: ദൈവത്തിന്റെ സാദൃശ്യത്തിൽ
  rationale: דְּמוּת എന്നത് ‘സാദൃശ്യം/സാമ്യം’ എന്നാണ്; ഇവിടെ ഇല്ലാത്ത צֶלֶם (‘പ്രതിരൂപം’) എന്ന പദവുമായി ലയിപ്പിക്കാതെ വ്യത്യാസം സൂക്ഷിക്കുന്നു.
- source_word: עָשָׂה אֹתוֹ
  choice: അവനെ ഉണ്ടാക്കി
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ‘ഉണ്ടാക്കി’ യോജിക്കുന്നു; ഏകവചന പുല്ലിംഗ സർവനാമത്തെ ‘അവനെ’ എന്ന് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ אָדָם എന്ന പദത്തിന്റെ രണ്ടു പ്രയോഗങ്ങൾ
  choice: ആദ്യത്തേത് ‘ആദാം’ എന്ന വ്യക്തിനാമമായും രണ്ടാമത്തേത് ‘മനുഷ്യൻ’ എന്ന പൊതുനാമമായും
  alternative: രണ്ടും ‘ആദാം’ എന്നു നൽകുക; അല്ലെങ്കിൽ രണ്ടാമത്തേത് ‘മനുഷ്യവർഗം’ എന്നു നൽകുക
  rationale: ആദ്യ പ്രയോഗം വംശാവലിയുടെ പേരെടുത്ത പൂർവികനെ സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തേത് സൃഷ്ടിവിവരണത്തിലെ മനുഷ്യനെ പൊതുവായും പ്രതിനിധിപരമായ ഏകവചനത്തിലും സൂചിപ്പിക്കുന്നു. ഈ വ്യത്യാസം മൂലപാഠത്തിലെ അർഥചലനം സംരക്ഷിക്കുന്നു.
- issue: ദൈവസാദൃശ്യത്തെ സൂചിപ്പിക്കുന്ന പദം
  choice: ‘സാദൃശ്യം’ നിലനിർത്തുക
  alternative: ‘ദൈവത്തിന്റെ പ്രതിരൂപം’ എന്നു സമന്വയിപ്പിക്കുക
  rationale: ഇവിടെ ഹീബ്രു പദം דְּמוּת ആണ്, צֶלֶם അല്ല. അതിനാൽ സമീപസൃഷ്ടിവിവരണത്തിലെ ‘പ്രതിരൂപം’ എന്ന ഭാഷയിലേക്ക് ലയിപ്പിക്കാതെ പദവ്യത്യാസം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വംശാവലിയുടെ ഔപചാരിക തലക്കെട്ടുഭാവം നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവുമായി കൃത്യമായി ബന്ധപ്പെടുന്നതിനായി [a] ‘നാളിൽ’ എന്ന പ്രയോഗത്തിനും [b] ‘മനുഷ്യനെ’ എന്ന പദത്തിനും ചേർത്തിരിക്കുന്നു.
