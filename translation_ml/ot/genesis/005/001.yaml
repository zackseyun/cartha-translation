  naturalness: ‘ആദാമിന്റെ തലമുറകളുടെ പുസ്തകം’ സ്വാഭാവികവും ഔപചാരികമായ വംശാവലിത്തലക്കെട്ടിന് യോജിച്ചതുമാണ്. ‘സാദൃശ്യത്തിൽ’ എന്ന പ്രയോഗം മലയാളത്തിൽ അല്പം അസ്പഷ്ടമായി, ഒരു സ്ഥാനസൂചനപോലെ കേൾക്കാം; ‘സാദൃശ്യപ്രകാരം’ കൂടുതൽ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്. ‘അവനെ ഉണ്ടാക്കി’ അംഗീകരിക്കാവുന്നതാണ്.
  terminology: ‘ആദാം’, ‘തലമുറകൾ’, ‘മനുഷ്യൻ’, ‘സാദൃശ്യം’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. דְּמוּת-നെ ‘സാദൃശ്യം’ എന്നാക്കി צֶלֶם-നോട് ലയിപ്പിക്കാതിരിക്കുന്നത് ശരിയാണ്. അടിക്കുറിപ്പ് സൂചകങ്ങൾ വാക്യത്തിലെ അനുയോജ്യ പദങ്ങളോടു ചേർന്നിരിക്കുന്നു.
