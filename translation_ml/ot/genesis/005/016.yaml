id: GEN.5.16
reference: Genesis 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִ֣י מַֽהֲלַלְאֵ֗ל אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת יֶ֔רֶד שְׁלֹשִׁ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: ml
  text: മഹലലേൽ യാരെദിനെ ജനിപ്പിച്ചശേഷം എണ്ണൂറ്റിമുപ്പത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ, പേരെടുത്ത മകന്റെ ജനനത്തിനുശേഷമുള്ള ആയുസ്സിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מַהֲלַלְאֵל
  choice: മഹലലേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സാധ്യമായത്ര നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: യാരെദിന്റെ ജനനത്തിനുശേഷം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ യാരെദിനെ ജനിപ്പിച്ചതിനുശേഷം’; സ്വാഭാവിക മലയാളത്തിൽ പിതൃത്വം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ നാമവാക്യരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יֶרֶד
  choice: യാരെദ്
  rationale: എബ്രായ നാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: എണ്ണൂറ്റിമുപ്പത് വർഷം
  rationale: എബ്രായത്തിലെ ‘മുപ്പത് വർഷവും എണ്ണൂറ് വർഷവും’ എന്ന സംഖ്യാക്രമം സ്വാഭാവിക മലയാളക്രമത്തിലാക്കി, ആകെ സംഖ്യ മാറ്റമില്ലാതെ നൽകുന്നു.
- source_word: וַיּוֹלֶד
  choice: അവനു ... ജനിച്ചു
  rationale: ഹിഫീൽ രൂപം പിതാവാകുക/ജനിപ്പിക്കുക എന്നർഥം നൽകുന്നു. ‘അവനു ... ജനിച്ചു’ എന്നത് ആ പുരുഷപിതൃത്വബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: മൂലപാഠം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന ആവർത്തനത്തെക്കാൾ സ്വാഭാവികമായ ‘ജനനത്തിനുശേഷം’, ‘അവനു ... ജനിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ സ്വീകരിച്ചിട്ടും മൂലത്തിലെ പിതൃത്വവും കാലക്രമവും സംരക്ഷിച്ചിട്ടുണ്ട്.
