revisions:
- from: യാരെദിന്റെ ജനനത്തിനുശേഷം മഹലലേൽ എണ്ണൂറ്റിമുപ്പത് വർഷം ജീവിച്ചു; അവനു പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു.
  to: മഹലലേൽ യാരെദിനെ ജനിപ്പിച്ചശേഷം എണ്ണൂറ്റിമുപ്പത് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
