- from: മെഥൂശലഹിനെ ജനിപ്പിച്ചശേഷം ഹാനോക്ക് മുന്നൂറു വർഷം ദൈവത്തോടുകൂടെ നടന്നു[a]; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  to: മെഥൂശലഹിന് പിതാവായശേഷം ഹാനോക്ക് മുന്നൂറു വർഷം ദൈവത്തോടുകൂടെ നടന്നു[a]; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  rationale: The revision replaces the potentially non-specific first ‘ജനിപ്പിച്ചശേഷം’ with an idiomatic expression that explicitly identifies Enoch as Methuselah’s father. It retains the Hebrew idiom ‘walked with God,’ the three-hundred-year duration, and the explicit reference to sons and daughters. The second genealogical ‘ജനിപ്പിച്ചു’ remains acceptable in context, where Enoch is unambiguously the male subject.
