reference: Genesis 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: ml
  text: മെഥൂശലഹിന് പിതാവായശേഷം ഹാനോക്ക് മുന്നൂറു വർഷം ദൈവത്തോടുകൂടെ നടന്നു[a]; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവവുമായി കൂട്ടായ്മയിൽ ജീവിച്ചു.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ദൈവത്തോടുകൂടെ നടന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: നടന്നു
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബന്ധാത്മക രൂപകമാണ്. വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘നടന്നു’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֶת הָאֱלֹהִים
  choice: ദൈവത്തോടുകൂടെ
  rationale: אֶת ഇവിടെ ‘കൂടെ’ എന്ന ബന്ധാത്മക അർഥത്തിലാണ്. സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമായി ‘ദൈവത്തോടുകൂടെ’ സ്വീകരിച്ചു.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: മെഥൂശലഹിനെ ജനിപ്പിച്ചശേഷം
  rationale: אַחֲרֵי എന്നതിന്റെ കാലസൂചനയും ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ പിതൃത്വസൂചനയും വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: മുന്നൂറു വർഷം
  rationale: ഹാനോക്ക് ദൈവത്തോടുകൂടെ നടന്ന കാലദൈർഘ്യത്തെ നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു
  rationale: എബ്രായം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം രണ്ടും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തോടുകൂടെ നടന്നു’ എന്ന പ്രയോഗത്തിൽ ഹാനോക്കിന്റെ ദൈവബന്ധത്തിന്റെ സ്വഭാവം
  choice: ബന്ധാത്മക രൂപകമായ ‘ദൈവത്തോടുകൂടെ നടന്നു’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ദൈവവുമായി കൂട്ടായ്മയിൽ ജീവിച്ചു
  rationale: മൂലപാഠത്തിലെ രൂപകത്തിന് വിശ്വസ്തജീവിതം, അടുപ്പം, കൂട്ടായ്മ എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളാനാകുന്നു. അവയിൽ ഒന്ന് മാത്രം തിരഞ്ഞെടുത്ത് അർഥം ചുരുക്കാതിരിക്കാൻ രൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഹാനോക്ക്’, ‘മെഥൂശലഹ്’ എന്നീ പേരുകളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
