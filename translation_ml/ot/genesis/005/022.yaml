    issue: The first occurrence of ‘ജനിപ്പിച്ചശേഷം’ lacks the explicit paternal sense of הוֹלִידוֹ.
    rationale: The Hebrew verb refers to Enoch as Methuselah’s male parent. In modern Malayalam, ‘ജനിപ്പിക്കുക’ can be used in genealogical style, but it does not independently mark fatherhood and may be heard as maternal birthing. ‘മെഥൂശലഹിന് പിതാവായശേഷം’ communicates the source sense clearly.
