  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. ഹീബ്രായ വംശാവലിസൂത്രത്തിന്റെ ആവർത്തനഭാവം സംരക്ഷിക്കുമ്പോൾ അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കി.
