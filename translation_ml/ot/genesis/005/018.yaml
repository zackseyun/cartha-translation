source:
  edition: WLC
  text: וַֽ/יְחִי יֶ֕רֶד שְׁתַּ֧יִם וְ/שִׁשִּׁ֛ים שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: ml
  text: യെരെദിന് നൂറ്റിയറുപത്തിരണ്ടു വയസ്സായപ്പോൾ, അവൻ ഹനോക്കിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: വയസ്സായപ്പോൾ
  rationale: വംശാവലിയുടെ സൂത്രവാക്യത്തിൽ חיה പ്രായവിവരത്തെ പരിചയപ്പെടുത്തുന്നു. അടുത്ത ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘വയസ്സായപ്പോൾ’ എന്നു നൽകി.
- source_word: יֶרֶד
  choice: യാരെദ്
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ വായനയിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: നൂറ്റിയറുപത്തിരണ്ടു വയസ്സ്
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം അർത്ഥം മാറ്റാതെ സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകി.
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: വംശാവലി സന്ദർഭത്തിലെ ילד എന്ന ക്രിയയുടെ പുരുഷകർത്തൃപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പഴഞ്ചൻ ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: אֶת חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമചിഹ്നം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. חֲנוֹךְ എന്ന നാമത്തിന് എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഹീബ്രു വാക്യഘടന അതേപടി പകർത്താതെ, പ്രായവും പിതൃത്വവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായ ‘ആയപ്പോൾ’ ഘടനയിൽ വ്യക്തമാക്കി.
