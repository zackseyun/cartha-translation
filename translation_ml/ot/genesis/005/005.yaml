id: GEN.5.5
reference: Genesis 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְי֞וּ כָּל יְמֵ֤י אָדָם֙ אֲשֶׁר חַ֔י תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וּ/שְׁלֹשִׁ֖ים שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/005.yaml
  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: ml
  text: ആദാം[a] ജീവിച്ച ആകെ നാളുകൾ തൊള്ളായിരത്തി മുപ്പത് വർഷം ആയിരുന്നു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘ആദാം’ എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘മനുഷ്യൻ’ എന്നോ ‘മനുഷ്യവർഗം’ എന്നോ അർഥമാകാം; എന്നാൽ ഇവിടെ വംശാവലിയിലെ ആദാം എന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിയിൽ ഒരാളുടെ ആകെ ആയുസ്സ് പ്രസ്താവിക്കുന്ന ഈ സൂത്രവാക്യത്തിൽ היה എന്ന ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ ‘ആയിരുന്നു’ എന്നു നൽകുന്നു.
- source_word: כָּל יְמֵי
  choice: ആകെ നാളുകൾ
  rationale: ജീവിതത്തെ ‘നാളുകൾ’ എന്നു കണക്കാക്കുന്ന എബ്രായ പ്രയോഗവും ആവർത്തിച്ചുവരുന്ന വംശാവലി ശൈലിയും നിലനിർത്തുന്നു; ‘ആകെ’ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: אָדָם
  choice: ആദാം
  rationale: ഇവിടെ പൊതുവായ ‘മനുഷ്യൻ/മനുഷ്യവർഗം’ എന്ന അർഥമല്ല, വംശാവലിയിലെ വ്യക്തിയുടെ പേരാണ്; അതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר חַי
  choice: ജീവിച്ച
  rationale: ‘നാളുകൾ’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി നൽകുന്നു.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: തൊള്ളായിരത്തി മുപ്പത് വർഷം
  rationale: എബ്രായത്തിലെ പൂർണ്ണ സംഖ്യയെ അക്കങ്ങളാക്കാതെ സാഹിത്യശൈലിക്ക് യോജിച്ച വാക്കുകളായി നൽകുന്നു.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വംശാവലിയിലെ ആവർത്തിത മരണസൂത്രത്തിന്റെ ലളിതവും ഗൗരവമുള്ളതുമായ സ്വഭാവം നിലനിർത്തുന്നു; വാവ്-തുടർച്ചയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പിന്നെ’ എന്നു ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ അർഥം
  choice: വ്യക്തിനാമമായ ‘ആദാം’
  alternative: മനുഷ്യൻ / മനുഷ്യവർഗം
  rationale: ഉല്പത്തി 5-ലെ വംശാവലി സന്ദർഭത്തിൽ ഈ പദം പേരെടുത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ അർഥം സ്വീകരിച്ചാൽ വംശാവലി പരാമർശം മങ്ങിപ്പോകും.
- issue: മരണസൂത്രത്തിന്റെ സംരക്ഷണം
  choice: പിന്നെ അവൻ മരിച്ചു
  alternative: അവന്റെ ജീവിതം അവസാനിച്ചു
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ളതും ആവർത്തിതവുമായ മരണപ്രസ്താവന മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ‘ആകെ നാളുകൾ’ എന്ന പ്രയോഗം എബ്രായ സൂത്രവാക്യത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; സംഖ്യ വാക്കുകളായി എഴുതിയിരിക്കുന്നു.
