  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ יְמֵי אָדָ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֵׁ֔ת שְׁמֹנֶ֥ה מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: ml
  text: ശേത്തിനെ ജനിപ്പിച്ചശേഷം ആദാം എണ്ണൂറു വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ശേത്തിനെ ജനിപ്പിച്ചശേഷം ‘ആദാമിന്റെ ദിവസങ്ങൾ ... എണ്ണൂറു വർഷം ആയിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: ആദാം ... ജീവിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ആദാമിന്റെ ദിവസങ്ങൾ ... ആയിരുന്നു’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ ആയുസ്സിന്റെ ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ജീവിച്ചു’ എന്നു നൽകി.
- source_word: אָדָם
  choice: ആദാം
  rationale: വംശാവലിയുടെ ഈ സന്ദർഭത്തിൽ ഇത് മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമല്ല, വ്യക്തിനാമമാണ്.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: തുടർന്നുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ കാലികബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹלִידוֹ
  choice: ജനിപ്പിച്ച
  rationale: ילד എന്ന ധാതുവിന്റെ ഹിഫ്ഇൽ രൂപം ഇവിടെ പുരുഷനെ വിഷയമാക്കി ‘ജനിപ്പിക്കുക’ എന്ന വംശാവലിപരമായ അർഥത്തിലാണ്.
- source_word: אֶת שֵׁת
  choice: ശേത്തിനെ
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമചിഹ്നം മലയാളത്തിൽ വിഭക്തിയിലൂടെ പ്രകടമാകുന്നു; שֵׁת എന്ന പേര് ‘ശേത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: എണ്ണൂറു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: അവൻ ... ജനിപ്പിച്ചു
  rationale: മുമ്പുള്ള הוֹלִידוֹ എന്നതിലെ അതേ ילד ധാതുവുമായുള്ള പദസാമ്യം നിലനിർത്തുകയും വംശാവലിപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: എബ്രായം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിലേക്കു ചുരുക്കാതെ ഇരുവിഭാഗവും വ്യക്തമാക്കി.
theological_decisions:
- issue: אָדָם എന്നതിന്റെ അർഥം
  choice: വ്യക്തിനാമമായ ‘ആദാം’
  alternative: ‘മനുഷ്യൻ’
  rationale: വംശാവലിയുടെ ഉടനെയുള്ള സാഹിത്യസന്ദർഭത്തിൽ പരാമർശിക്കപ്പെടുന്നത് പേരുള്ള വ്യക്തിയായ ആദാമിനെയാണ്; പൊതുവായ മനുഷ്യവർഗത്തെയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനിപ്പിച്ചു’ എന്ന പദം വംശാവലിസന്ദർഭവും മൂലപാഠത്തിലെ ആവർത്തിച്ച ילד ധാതുവും നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള എബ്രായ ആയുസ്സുപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
