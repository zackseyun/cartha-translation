id: GEN.5.30
reference: Genesis 5:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: ml
  text: ലാമെക്ക് നോഹിനെ ജനിപ്പിച്ചശേഷം അഞ്ഞൂറ്റിത്തൊണ്ണൂറ്റഞ്ച് വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: ഉല്പത്തി 5-ലെ വംശാവലിസൂത്രത്തിൽ, പേരെടുത്തുപറയുന്ന സംഭവത്തിനുശേഷമുള്ള ആയുസ്സിന്റെ കാലയളവിനെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ജീവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: നോഹിന്റെ ജനനത്തിനു തുടർന്നുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ കാലബന്ധപദം.
- source_word: הוֹלִידוֹ
  choice: ജന്മം നൽകിയശേഷം
  rationale: ഹിഫ്ഇൽ രൂപം പുരുഷനായ കർത്താവിന്റെ പിതൃത്വപരമായ ജനിപ്പിക്കലിനെ സൂചിപ്പിക്കുന്നു. ‘ജന്മം നൽകി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ മാന്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: נֹחַ
  choice: നോഹ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: അഞ്ഞൂറ്റിത്തൊണ്ണൂറ്റഞ്ച് വർഷം
  rationale: എബ്രായത്തിലെ 95 + 500 എന്ന സംഖ്യാക്രമം, ആകെ 595 മാറ്റാതെ സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיּוֹלֶד
  choice: ജന്മം നൽകി
  rationale: വംശാവലിയിൽ പുരുഷനായ കർത്താവ് മക്കളുടെ പിതാവായി എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘മക്കളുണ്ടായി’ എന്നതിനെക്കാൾ മൂലക്രിയയോട് അടുത്തതാണ്.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാർക്കും പുത്രിമാർക്കും
  rationale: എബ്രായം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നു ചുരുക്കിയിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഇംഗ്ലീഷിലെ മുൻവിവർത്തനത്തെ അനുകരിക്കുന്ന കുറിപ്പ് ആവശ്യമില്ല; എബ്രായ വാക്യഘടനയുടെ അർഥം മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ നേരിട്ട് നൽകാം.
