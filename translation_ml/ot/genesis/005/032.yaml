id: GEN.5.32
reference: Genesis 5:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: ml
  text: നോഹയ്ക്ക് അഞ്ഞൂറു വയസ്സായപ്പോൾ[a], അവൻ ശേം, ഹാം, യാഫെത്ത് എന്നിവർക്കു പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശേം, ഹാം, യാഫെത്ത്’ എന്ന ക്രമം എബ്രായ പാഠത്തിലുള്ളതാണ്. ഇത് നിർബന്ധമായും അവരുടെ ജനനക്രമം സൂചിപ്പിക്കുന്നില്ല; മൂവരും ഒരേ വർഷത്തിലാണ് ജനിച്ചതെന്നും അർഥമാക്കേണ്ടതില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയപ്പോൾ
  rationale: ഇവിടെ היה എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആയപ്പോൾ’ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: അഞ്ഞൂറു വയസ്സായ
  rationale: בן + സംഖ്യ + שנה എന്നത് പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; ‘അഞ്ഞൂറു വയസ്സായ’ എന്നത് സ്വാഭാവികമായ മലയാള തുല്യപ്രയോഗമാണ്.
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പുരുഷവിഷയത്തോടൊപ്പം ‘ജനിപ്പിക്കുക/പിതാവാകുക’ എന്നർഥം നൽകുന്നു. ‘പിതാവായി’ ആ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു; മൂന്നു പേരും അതേ വർഷം ജനിച്ചു എന്ന അനാവശ്യ സൂചനയും ഒഴിവാക്കുന്നു.
- source_word: נֹחַ
  choice: നോഹ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: שֵׁם
  choice: ശേം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: חָם
  choice: ഹാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יָפֶת
  choice: യാഫെത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘ശേം, ഹാം, യാഫെത്ത്’ എന്ന പട്ടികയുടെ ക്രമം ജനനക്രമമാണോ എന്ന സൂചന
  choice: എബ്രായ പാഠത്തിലെ പേരുകളുടെ ക്രമം നിലനിർത്തി; മൂവരും നോഹയുടെ അഞ്ഞൂറാം വയസ്സിൽതന്നെ ജനിച്ചെന്നോ ഇതു കൃത്യമായ ജനനക്രമമാണെന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: സാധ്യതയുള്ള ജനനക്രമമനുസരിച്ച് പേരുകൾ പുനഃക്രമീകരിക്കുക, അല്ലെങ്കിൽ മൂവരും ഒരേ വർഷം ജനിച്ചതായി തോന്നിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം നോഹയുടെ അഞ്ഞൂറാം വയസ്സിനെ തുടർന്ന് ഈ പുത്രന്മാരുടെ ജനനത്തെ സംക്ഷിപ്തമായി രേഖപ്പെടുത്തുന്നു. വിശാലമായ ആഖ്യാനത്തിന്റെ വെളിച്ചത്തിൽ പട്ടിക നിർബന്ധമായും ജനനക്രമം സൂചിപ്പിക്കുന്നില്ല; മൂവരും ഒരേ വർഷം ജനിച്ചു എന്നും എബ്രായ വാചകം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തതയും സാധ്യതയുള്ള സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച ‘നോഹ’ എന്ന നാമത്തിനു പകരം രണ്ടാം ഉപവാക്യത്തിൽ ‘അവൻ’ ഉപയോഗിച്ച് മലയാളത്തിലെ ഒഴുക്ക് മെച്ചപ്പെടുത്തി. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും പിതൃത്വാർഥം വ്യക്തവുമായ ‘പിതാവായി’ തെരഞ്ഞെടുത്തു.
