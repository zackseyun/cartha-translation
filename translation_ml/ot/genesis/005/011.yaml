  yaml_path: translation/ot/genesis/005/011.yaml
  text: So all the days of Enosh were nine hundred and five years, and he died.
translation:
  language: ml
  text: അങ്ങനെ എനോശിന്റെ ആയുഷ്കാലം ആകെ തൊള്ളായിരത്തി അഞ്ച് വർഷമായിരുന്നു; പിന്നെ അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: ആയുഷ്കാലം ആകെ … ആയിരുന്നു
  rationale: വംശാവലിയിൽ ഒരാളുടെ മൊത്തം ജീവിതദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱנוֹשׁ
  choice: ഏനോശ്
  rationale: ഹീബ്രു നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: തൊള്ളായിരത്തഞ്ചു വർഷം
  rationale: ഹീബ്രുവിലെ ‘അഞ്ചു വർഷവും തൊള്ളായിരം വർഷവും’ എന്ന സംഖ്യാക്രമം അർഥം മാറ്റാതെ സ്വാഭാവിക മലയാളക്രമത്തിൽ 905 വർഷമായി നൽകുന്നു.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വംശാവലിയിലെ പതിവ് സമാപനസൂത്രം വ്യക്തമായി നൽകുന്നു; കഥാക്രമം സൂചിപ്പിക്കാൻ വാവ് ബന്ധകത്തെ ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
