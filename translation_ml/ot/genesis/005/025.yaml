translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിയുടെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രീതിയിൽ ലിപ്യന്തരിച്ചു.
