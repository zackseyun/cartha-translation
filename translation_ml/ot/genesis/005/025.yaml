  text: וַ/יְחִ֣י מְתוּשֶׁ֔לַח שֶׁ֧בַע וּ/שְׁמֹנִ֛ים שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת לָֽמֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: ml
  text: മെഥൂശലഹ് നൂറ്റി എൺപത്തേഴു വർഷം ജീവിച്ചശേഷം ലാമെക്കിന്റെ പിതാവായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ലാമെക്കിനെ ജനിപ്പിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിസൂത്രത്തിൽ ഈ ക്രിയ തുടർന്നുവരുന്ന പ്രായവും സന്താനജനനവും തമ്മിൽ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘... വർഷം ജീവിച്ചശേഷം’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: מְתוּשֶׁלַח
  choice: മെഥൂശലഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: നൂറ്റി എൺപത്തേഴു വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം സ്വാഭാവികമായ ആധുനിക മലയാള സംഖ്യാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: ഹിഫീൽ രൂപം വംശാവലിയിൽ ‘ജനിപ്പിച്ചു/പിതാവായി’ എന്ന അർഥം നൽകുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ ‘പിതാവായി’ തെരഞ്ഞെടുത്തു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: לָמֶךְ
  choice: ലാമെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
