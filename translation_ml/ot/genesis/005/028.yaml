source:
  edition: WLC
  text: וַֽ/יְחִי לֶ֕מֶךְ שְׁתַּ֧יִם וּ/שְׁמֹנִ֛ים שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד בֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: ml
  text: ലാമെക്ക് നൂറ്റി എൺപത്തിരണ്ടു വർഷം ജീവിച്ചു; അവൻ ഒരു മകന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചശേഷം
  rationale: വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ ലാമെക്ക് അടുത്ത സംഭവത്തിനു മുമ്പ് ജീവിച്ച വർഷകാലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനുബന്ധ ക്രിയാരൂപം കാലക്രമബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֶמֶךְ
  choice: ലാമെക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: നൂറ്റി എൺപത്തിരണ്ടു വർഷം
  rationale: എബ്രായ സംഖ്യാക്രമം സ്വാഭാവികമായ മലയാള സംഖ്യാരീതിയിൽ നൽകി.
- source_word: וַיּוֹלֶד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷൻ കർത്താവായുള്ള ילד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘ഒരു മകന്റെ പിതാവായി/ജനിപ്പിച്ചു’ എന്ന വംശാവലിപരമായ അർഥത്തിലാണ്; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: മകൻ ഈ വാക്യത്തിൽ ഇനിയും പേരോടെ പരിചയപ്പെടുത്തപ്പെടാത്തതിനാൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന ‘ഒരു’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി.
