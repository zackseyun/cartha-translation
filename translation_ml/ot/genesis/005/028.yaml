revisions:
- from: ലാമെക്ക് നൂറ്റി എൺപത്തിരണ്ടു വർഷം ജീവിച്ചശേഷം ഒരു മകനെ ജനിപ്പിച്ചു.
  to: ലാമെക്ക് നൂറ്റി എൺപത്തിരണ്ടു വർഷം ജീവിച്ചു; അവൻ ഒരു മകന്റെ പിതാവായി.
