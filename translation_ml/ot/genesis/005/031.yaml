  text: וַֽ/יְהִי֙ כָּל יְמֵי לֶ֔מֶךְ שֶׁ֤בַע וְ/שִׁבְעִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: ml
  text: അങ്ങനെ ലാമെക്കിന്റെ ആയുഷ്കാലം ആകെ എഴുനൂറ്റി എഴുപത്തെഴ് വർഷമായിരുന്നു[a]. പിന്നെ അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ സംഖ്യയുടെ പദക്രമം അക്ഷരാർഥത്തിൽ ‘ഏഴും എഴുപതും വർഷം, ഏഴുനൂറു വർഷം’ എന്നാണ്; അതായത് 777 വർഷം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ ... ആയിരുന്നു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה ലാമെക്കിന്റെ ആയുസ്സിന്റെ സംഗ്രഹവാക്യം അവതരിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ആഖ്യാനത്തിലെ തുടർച്ചയും സമാപനഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל יְמֵי
  choice: ആയുഷ്കാലം ആകെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എല്ലാ ദിവസങ്ങളും’ എന്നാണെങ്കിലും, ഇവിടെ ഒരാളുടെ മുഴുവൻ ജീവിതകാലം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ആധുനിക മലയാളത്തിൽ ‘ആയുഷ്കാലം ആകെ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לֶמֶךְ
  choice: ലാമെക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: എഴുനൂറ്റെഴുപത്തേഴു
  rationale: എബ്രായം ആദ്യം ഏകകവും ദശകവും, തുടർന്ന് ശതകവും പറഞ്ഞ് ആകെ 777 സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സംഖ്യ സാധാരണ ക്രമത്തിൽ ചേർത്തെഴുതുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שָׁנָה
  choice: വർഷം
  rationale: സംഖ്യയോടുചേർന്ന കാലദൈർഘ്യം മലയാളത്തിൽ ‘വർഷം’ എന്ന ഏകവചനരൂപത്തിൽ സ്വാഭാവികമായി പറയാം; വാക്യത്തിൽ വിധേയപൂരകമായി ‘വർഷമായിരുന്നു’ എന്നു ചേർത്തിരിക്കുന്നു.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: ഉല്പത്തി 5-ലെ ആവർത്തിത സമാപനസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു. ‘പിന്നെ’ ആഖ്യാനതുടർച്ച വ്യക്തമാക്കുന്നു; മരണവിവരം വ്യാഖ്യാനമില്ലാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 5-ലെ വംശാവലിയുടെ ആയുസ്സുസൂത്രം
  choice: പ്രായത്തെ ചരിത്രപരമായ ആയുഷ്കാലസംഗ്രഹമായി നേരിട്ട് വിവർത്തനം ചെയ്യുക
  alternative: സംഖ്യയെ പ്രതീകാത്മകമായി വ്യാഖ്യാനിച്ച് വിവർത്തനത്തിൽ സൂചിപ്പിക്കുക
  rationale: എബ്രായപാഠം കൃത്യമായ സംഖ്യയും മരണവിവരവും നേരിട്ട് നൽകുന്നു. പ്രതീകാത്മകമോ സംശയാത്മകമോ ആയ വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ പാഠത്തിന്റെ പ്രത്യക്ഷാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്തവും ആവർത്തനാത്മകവുമായ ശൈലി നിലനിർത്തിക്കൊണ്ട്, എബ്രായ സംഖ്യാക്രമത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
