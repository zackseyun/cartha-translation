  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, പ്രായം കഴിഞ്ഞുള്ള പിതൃത്വസംഭവം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു; രണ്ട് അടിക്കുറിപ്പുകളുടെയും സൂചകങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
