  text: וַֽ/יְחִ֥י אֱנ֖וֹשׁ תִּשְׁעִ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת קֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: ml
  text: എനോശ് തൊണ്ണൂറു വർഷം ജീവിച്ചു; പിന്നെ കേനാനെ ജനിപ്പിച്ചു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായക്രിയ ഇവിടെ പുരുഷൻ ഒരു സന്താനത്തിന്റെ പിതാവായതിനെ സൂചിപ്പിക്കുന്നു. ‘ജനിപ്പിച്ചു’ എന്നത് ഈ വംശാവലിസന്ദർഭത്തിലെ സ്വാഭാവികമായ മലയാളരൂപമാണ്; ചില പരിഭാഷകൾ ‘പിതാവായി’ എന്നും നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷാപാരമ്പര്യങ്ങളിൽ ഗ്രീക്കുരൂപത്തെ പിന്തുടർന്ന് ഈ പേര് ‘കയിനാൻ’ എന്നു കാണാം; എബ്രായപാഠത്തിലെ രൂപം ‘കേനാൻ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചപ്പോൾ
  rationale: വംശാവലിയുടെ പ്രായസൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ ‘ജീവിക്കുക’ എന്നാണ്; തുടർന്നുള്ള ജനനസംഭവവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘ജീവിച്ചപ്പോൾ’ എന്നു നൽകി.
- source_word: אֱנוֹשׁ
  choice: എനോശ്
  rationale: മസോററ്റിക് എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം.
- source_word: תִּשְׁעִים שָׁנָה
  choice: തൊണ്ണൂറു വർഷം
  rationale: എബ്രായ പ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: പിതാവായി
  rationale: പുരുഷൻ കർത്താവായുള്ള വംശാവലിയിൽ Hiphil രൂപം സന്താനത്തിന്റെ പിതാവാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രാചീനഭാവമുള്ള ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് സ്വതന്ത്ര പദാർഥമില്ലാത്ത നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാള വാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം പ്രതിഫലിക്കുന്നു.
- source_word: קֵינָן
  choice: കേനാൻ
  rationale: മസോററ്റിക് എബ്രായത്തിലെ קֵינָן എന്ന പേരിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
