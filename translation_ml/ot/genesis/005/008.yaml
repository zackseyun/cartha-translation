    rationale: In modern Malayalam, ‘ശേത്തിന്റെ ആകെ ആയുഷ്കാലം’ reads more smoothly than ‘ശേത്തിന്റെ ആയുഷ്കാലം ആകെ’ while retaining precisely the same total-lifespan meaning.
  revised_text: അങ്ങനെ ശേത്തിന്റെ ആകെ ആയുഷ്കാലം തൊള്ളായിരത്തി പന്ത്രണ്ട് വർഷമായിരുന്നു; അവൻ മരിച്ചു.
