id: GEN.5.8
reference: Genesis 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְיוּ֙ כָּל יְמֵי שֵׁ֔ת שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה וּ/תְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/008.yaml
  text: So all the days of Seth were nine hundred and twelve years, and he died.
translation:
  language: ml
  text: അങ്ങനെ ശേത്തിന്റെ ആകെ ആയുഷ്കാലം തൊള്ളായിരത്തി പന്ത്രണ്ട് വർഷമായിരുന്നു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: ആയുഷ്കാലം ആകെ ... വർഷമായിരുന്നു
  rationale: വംശാവലിയിൽ ഒരാളുടെ മൊത്തം ജീവിതദൈർഘ്യം സംഗ്രഹിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളും’ എന്നതിനെക്കാൾ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം ഉപയോഗിക്കുമ്പോഴും പൂർണ ആയുസ്സ് എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: שֵׁת
  choice: ശേത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നൽകിയിരിക്കുന്നു.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: തൊള്ളായിരത്തി പന്ത്രണ്ട് വർഷം
  rationale: എബ്രായത്തിൽ ‘പന്ത്രണ്ട് വർഷവും തൊള്ളായിരം വർഷവും’ എന്ന ക്രമത്തിൽ വരുന്ന സംഖ്യയെ, ആകെ 912 എന്ന മൂല്യം മാറ്റാതെ സ്വാഭാവിക മലയാള സംഖ്യാക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּמֹת
  choice: പിന്നെ അവൻ മരിച്ചു
  rationale: വംശാവലിയിലെ ആവർത്തിത സമാപനസൂത്രത്തിന്റെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനബലം നിലനിർത്തുന്നു; തുടർച്ച സൂചിപ്പിക്കുന്ന וַ־ ഇവിടെ ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ വംശാവലി-സൂത്രത്തിന്റെ സംക്ഷിപ്തതയും മരണത്തെക്കുറിച്ചുള്ള ആവർത്തിത സമാപനവും സംരക്ഷിച്ചിരിക്കുന്നു.
