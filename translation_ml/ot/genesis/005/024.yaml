id: GEN.5.24
reference: Genesis 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת הָֽ/אֱלֹהִ֑ים וְ/אֵינֶ֕/נּוּ כִּֽי לָקַ֥ח אֹת֖/וֹ אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: ml
  text: ഹാനോക്ക് ദൈവത്തോടൊപ്പം നടന്നു; അവൻ ഇല്ലാതെയായി, കാരണം ദൈവം അവനെ എടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: നടന്നു
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ കേവലം ശാരീരികമായ നടത്തമല്ല, തുടർച്ചയായ ജീവിതരീതിയും ദൈവവുമായുള്ള ബന്ധവും സൂചിപ്പിക്കുന്നു. ‘നടന്നു’ എന്നത് എബ്രായ ഭാഷാശൈലി നിലനിർത്തുന്നു.
- source_word: אֶת הָאֱלֹהִים
  choice: ദൈവത്തോടൊപ്പം
  rationale: הלך എന്ന ക്രിയയോടു ചേർന്ന אֶת സഹവാസത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ബന്ധപരമായ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: וְאֵינֶנּוּ
  choice: പിന്നെ അവനെ കാണാനില്ലായിരുന്നു
  rationale: അക്ഷരാർഥം ‘അവൻ ഉണ്ടായിരുന്നില്ല’ എന്നാണ്. എന്നാൽ മലയാളത്തിൽ ‘അവൻ ഇല്ലാതായി’ എന്നു പറഞ്ഞാൽ അസ്തിത്വം അവസാനിച്ചു എന്ന അധിക അർഥം വരാം. ‘കാണാനില്ലായിരുന്നു’ എന്നത് അവൻ ഇനി അവിടെ ഉണ്ടായിരുന്നില്ലെന്ന ആശയം, എങ്ങനെ എന്നത് വിശദീകരിക്കാതെ, സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഹാനോക്കിനെ കാണാതായതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചകമാണ്.
- source_word: לָקַח אֹתוֹ
  choice: അവനെ എടുത്തു
  rationale: לקח എന്നതിന്റെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു. ദൈവം അവനെ എവിടേക്കാണ് എടുത്തതെന്നോ അതിന്റെ കൃത്യമായ രീതി എന്തെന്നോ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ അവ ചേർത്തിട്ടില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ ഏക സത്യദൈവത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഹാനോക്ക് മരിച്ചില്ലെന്നോ സ്വർഗത്തിലേക്കു മാറ്റപ്പെട്ടെന്നോ വ്യക്തമായി പറയണമോ
  choice: ‘അവനെ കാണാനില്ലായിരുന്നു, കാരണം ദൈവം അവനെ എടുത്തു’ എന്ന സംയതമായ വാചകം നിലനിർത്തി.
  alternative: ‘അവൻ മരിച്ചില്ല’; ‘ദൈവം അവനെ സ്വർഗത്തിലേക്കു കൊണ്ടുപോയി’; ‘ദൈവം അവനെ രൂപാന്തരപ്പെടുത്തി.’
  rationale: അസാധാരണമായ ദൈവിക ഇടപെടൽ വാക്യം ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഈ എബ്രായ വാക്യം ‘സ്വർഗത്തിലേക്ക്’ എന്നു പറയുകയോ മരണം നേരിട്ട് നിഷേധിക്കുകയോ ചെയ്യുന്നില്ല. അതിനാൽ പിന്നീടുള്ള വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംയമനവും ഉത്കണ്ഠയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ദൈവത്തോടൊപ്പം നടന്നു’ എന്ന എബ്രായ ഭാഷാശൈലി അർഥവ്യാഖ്യാനമായി മാറ്റാതെ നിലനിർത്തി; ‘കാണാനില്ലായിരുന്നു’ എന്ന പ്രയോഗം അനാവശ്യമായ അസ്തിത്വനിഷേധം ഒഴിവാക്കുന്നു.
