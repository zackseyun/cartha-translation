id: GEN.5.2
reference: Genesis 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: ml
  text: ആണും പെണ്ണുമായി അവൻ അവരെ സൃഷ്ടിച്ചു; അവരെ അനുഗ്രഹിച്ചു; അവർ സൃഷ്ടിക്കപ്പെട്ട ദിവസം അവർക്കു ‘മനുഷ്യൻ’ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: ആണും പെണ്ണുമായി
  rationale: പരസ്പരം ജോടിയായ ലിംഗപദങ്ങളുടെ സമമിതി നിലനിർത്തുകയും സൃഷ്ടിസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּרָאָם
  choice: അവൻ അവരെ സൃഷ്ടിച്ചു
  rationale: ברא എന്ന ക്രിയയുടെ കർത്താവ് ദൈവമാണ്; മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ഇരുവരെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: അവരെ അനുഗ്രഹിച്ചു
  rationale: ദൈവത്തിന്റെ അനുഗ്രഹപ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: അവർക്കു … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥമായ ‘അവരുടെ പേര് വിളിച്ചു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികം; ഒരൊറ്റ കൂട്ടായ നാമം ഇരുവർക്കും നൽകിയെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: אָדָם
  choice: മനുഷ്യർ
  rationale: ഇവിടെ ആണും പെണ്ണും ഉൾപ്പെടുന്ന മനുഷ്യവർഗത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മനുഷ്യൻ’ പുരുഷവ്യക്തിയായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘മനുഷ്യർ’ ഉൾക്കൊള്ളുന്ന കൂട്ടായ അർഥം വ്യക്തമായി നൽകുന്നു. അതേ എബ്രായരൂപം ‘ആദാം’ എന്ന വ്യക്തിനാമവുമാകാമെന്ന ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: അവർ സൃഷ്ടിക്കപ്പെട്ട ദിവസം
  rationale: കാലസൂചനയും നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ കൂട്ടായ മനുഷ്യ-സ്വത്വാർഥം
  choice: മനുഷ്യർ
  alternative: ആദാം; മനുഷ്യൻ; മനുഷ്യവർഗം
  rationale: വാക്യം ആണിനും പെണ്ണിനും ഒരുമിച്ച് ഒരു പേര് നൽകിയതായി പറയുന്നു; അതിനാൽ കൂട്ടായ അർഥമാണ് സന്ദർഭത്തിൽ പ്രാഥമികം. എന്നാൽ אָדָם എന്ന എബ്രായരൂപം ആദാം എന്ന വ്യക്തിനാമവും ആയതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സെമിറ്റിക് ഘടനയായ ‘അവരുടെ പേര് വിളിച്ചു’ എന്നതിനു പകരം സ്വാഭാവികമായ ‘അവർക്കു … എന്നു പേരിട്ടു’ ഉപയോഗിച്ചു; തുടർച്ചയായ ദൈവിക പ്രവൃത്തികൾ അർധവിരാമങ്ങളാൽ വ്യക്തമായി വേർതിരിച്ചു.
