source:
  edition: WLC
  text: וַֽ/יְחִ֣י מְתוּשֶׁ֗לַח אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת לֶ֔מֶךְ שְׁתַּ֤יִם וּ/שְׁמוֹנִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: ml
  text: ലാമെക്കിനെ ജനിപ്പിച്ചശേഷം മെഥൂശലഹ് 782 വർഷം ജീവിച്ചു; അവൻ പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിവിവരണത്തിൽ പേരെടുത്ത മകന്റെ ജനനത്തിനു ശേഷമുള്ള ആയുഷ്കാലം സൂചിപ്പിക്കുന്ന חיה എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מְתוּשֶׁלַח
  choice: മെഥൂശലഹ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: ലാമെക്കിനെ ജനിപ്പിച്ചശേഷം
  rationale: אַחֲרֵיയുടെ കാലസൂചനയും Hiphil രൂപമായ הוֹלִידוֹയുടെ പുരുഷകർത്തൃപരമായ ‘ജനിപ്പിക്കുക’ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 വർഷം
  rationale: എബ്രായത്തിൽ ‘രണ്ടും എൺപതും, എഴുനൂറും വർഷം’ എന്ന ക്രമത്തിൽ നൽകിയ ആകെ സംഖ്യയെ മലയാളത്തിലെ സാധാരണ സംഖ്യാരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: അവന് പുത്രന്മാരും പുത്രിമാരും ജനിച്ചു
  rationale: എബ്രായം ആൺ-പെൺ സന്തതികളെ പ്രത്യേകം പറയുന്നത് സംരക്ഷിക്കുന്നു; ഒരേ വാക്യത്തിൽ ‘ജനിപ്പിച്ചു’ ആവർത്തിക്കുന്നതിനേക്കാൾ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്, അതേസമയം പിതൃത്വസന്ദർഭം വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. ‘മക്കൾ’ എന്നു പൊതുവാക്കാതെ ‘പുത്രന്മാരും പുത്രിമാരും’ എന്ന് മൂലപാഠത്തിലെ വ്യത്യാസം നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ എബ്രായശബ്ദരൂപത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
