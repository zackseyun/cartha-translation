id: GEN.5.19
reference: Genesis 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: ml
  text: ഹാനോക്കിനെ ജനിപ്പിച്ചശേഷം യെരെദ് എണ്ണൂറു വർഷം ജീവിച്ചു; യെരെദ് പുത്രന്മാരെയും പുത്രിമാരെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: വംശാവലിസൂത്രവാക്യത്തിൽ חיה എന്ന ക്രിയ നിർദിഷ്ട കാലയളവിലെ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יֶרֶד
  choice: യെരെദ്
  rationale: എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אַחֲרֵי
  choice: ശേഷം
  rationale: പേരെടുത്ത മകന്റെ ജനനത്തിനു തുടർന്നുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ കാലബന്ധപദം.
- source_word: הוֹלִידוֹ אֶת־חֲנוֹךְ
  choice: ഹാനോക്കിന് ജന്മം നൽകിയ
  rationale: ഹിഫീൽ രൂപമായ ילד പിതാവെന്ന നിലയിൽ സന്താനജനനത്തിന് കാരണനായതിനെ സൂചിപ്പിക്കുന്നു; ‘ജന്മം നൽകി’ എന്നത് ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: എബ്രായ നാമരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: എണ്ണൂറു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സംഖ്യാവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיּוֹלֶד
  choice: അവന് ... ജനിച്ചു
  rationale: പുരുഷകർത്താവുള്ള വംശാവലിസന്ദർഭത്തിലെ ילד എന്ന ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും പിതൃത്വബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בָּנִים וּבָנוֹת
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: എബ്രായം ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ആ വ്യത്യാസം സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. മൂലത്തിലെ രണ്ട് സമാന്തര ക്രിയാഭാഗങ്ങൾ അർദ്ധവിരാമംകൊണ്ട് വ്യക്തമായി വേർതിരിച്ചു; പേരുകൾ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
