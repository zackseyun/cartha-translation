  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֖י כָּל יְמֵ֣י חֲנ֑וֹךְ חָמֵ֤שׁ וְ/שִׁשִּׁים֙ שָׁנָ֔ה וּ/שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/023.yaml
  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: ml
  text: ഹാനോക്കിന്റെ ആയുഷ്കാലം ആകെ മുന്നൂറ്ററുപത്തഞ്ച് വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വംശാവലിയിലെ ആയുസ്സിന്റെ സംഗ്രഹപ്രസ്താവനയാണ് ഈ രൂപം അവതരിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ഭൂതകാലക്രിയയായ ‘ആയിരുന്നു’ അതിന്റെ അർഥം വഹിക്കുന്നു.
- source_word: כָּל יְמֵי
  choice: ആയുഷ്കാലം ആകെ
  rationale: പദശഃ ‘എല്ലാ ദിവസങ്ങളും’ എന്നാണെങ്കിലും, വംശാവലിയുടെ ഈ സൂത്രവാക്യത്തിൽ പൂർണമായ ജീവിതദൈർഘ്യമാണ് ഉദ്ദേശിക്കുന്നത്. ‘ആയുഷ്കാലം ആകെ’ ആ അർഥവും സമഗ്രതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: മുന്നൂറ്ററുപത്തഞ്ച്
  rationale: എബ്രായത്തിലെ ‘അറുപത്തഞ്ചും മുന്നൂറും’ എന്ന ഘടനയെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ മൊത്തം 365 ആയി അവതരിപ്പിക്കുന്നു.
- source_word: שָׁנָה ... שָׁנָה
  choice: വർഷം
  rationale: സംഖ്യയോടുചേർന്ന മലയാളപ്രയോഗത്തിൽ ഏകവചനരൂപമായ ‘വർഷം’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-സംഗ്രഹശൈലി. ഹീബ്രു ഭാഷാശൈലിയിലെ ‘എല്ലാ ദിവസങ്ങളും’ എന്ന പ്രയോഗം അർഥസമത്വത്തോടെ ‘ആയുഷ്കാലം ആകെ’ എന്നു നൽകി.
