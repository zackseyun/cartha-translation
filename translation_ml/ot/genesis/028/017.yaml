id: GEN.28.17
reference: Genesis 28:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: ml
  text: അവൻ ഭയപ്പെട്ടു; “ഈ സ്ഥലം എത്ര ഭയഭക്തിയുളവാക്കുന്നതാണ്[a]! ഇത് ദൈവത്തിന്റെ ഭവനമല്ലാതെ മറ്റൊന്നുമല്ല; ഇതാണ് സ്വർഗത്തിന്റെ കവാടം[b],” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് ‘ഭയപ്പെടുത്തുന്ന,’ ‘ഭയാനകമായ,’ അല്ലെങ്കിൽ ‘ഭയഭക്തിയുളവാക്കുന്ന’ എന്ന അർഥഭാവങ്ങളുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “ആകാശങ്ങളുടെ കവാടം.” ഇവിടെ എബ്രായപ്രയോഗം ദൈവികമണ്ഡലമായ സ്വർഗത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: അവൻ ഭയപ്പെട്ടു
  rationale: ירא എന്ന ക്രിയ യാക്കോബിന്റെ ഭയത്തോടെയുള്ള പ്രതികരണം നേരിട്ട് അറിയിക്കുന്നു; സന്ദർഭത്തിലെ ഭക്ത്യാദരം അടുത്ത വാക്യഭാഗത്തിലും പ്രകടമാകുന്നു.
- source_word: מַה נּוֹרָא
  choice: എത്ര ഭയഭക്തി ഉണർത്തുന്നതാണ്
  rationale: נוֹרָא ഭയം, നടുക്കം, ഭക്ത്യാദരം എന്നിവയുടെ സംയുക്തഭാവം വഹിക്കുന്നു. ‘ഭയഭക്തി ഉണർത്തുന്നത്’ വിശുദ്ധസാന്നിധ്യത്തിനു മുമ്പിലെ ഭയവും ആദരവും അനാവശ്യമായി ഒന്നിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലം
  rationale: എബ്രായ നിർദ്ദേശകപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: אֵין זֶה כִּי אִם
  choice: ഇത് ... അല്ലാതെ മറ്റൊന്നുമല്ല
  rationale: ഊന്നലോടെയുള്ള തിരിച്ചറിയലും പരിമിതീകരണവും പ്രകടമാക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בֵּית אֱלֹהִים
  choice: ദൈവത്തിന്റെ ഭവനം
  rationale: ബന്ധിത നാമപ്രയോഗത്തെ സുതാര്യമായി പരിഭാഷപ്പെടുത്തുന്നു; ‘ഭവനം’ ഗൗരവമുള്ള ശൈലി നിലനിർത്തുമ്പോഴും ഇവിടെ ഇതിനകം ഒരു നിർമിത ആരാധനാലയം ഉണ്ടെന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: ആകാശങ്ങളുടെ കവാടം
  rationale: ശָׁמַיִם എന്ന എബ്രായരൂപത്തിന്റെ ബഹുവചനസദൃശ രൂപവും ഭൂമിയും ദൈവികമണ്ഡലവും തമ്മിലുള്ള പ്രവേശനകവാടത്തിന്റെ ദൃശ്യവും പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന രൂപത്തിന്റെ ഏകവചനസൂചന
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമായിരുന്നാലും ദർശനത്തിന്റെയും ഉടമ്പടിയുടെയും ഉടൻസന്ദർഭത്തിൽ ഇത് യാക്കോബിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- issue: വിശുദ്ധസന്ദർഭത്തിലെ נוֹרָא എന്ന പദത്തിന്റെ ഭാവം
  choice: ഭയഭക്തി ഉണർത്തുന്നത്
  alternative: ഭയാനകം; വിസ്മയകരം
  rationale: ഈ പദം വെറും ഭീകരതയെയോ സാധാരണ വിസ്മയത്തെയോ മാത്രം സൂചിപ്പിക്കുന്നില്ല; ദൈവസാന്നിധ്യത്തിനു മുമ്പിലെ ഭയവും ഭക്ത്യാദരവും തമ്മിലുള്ള പിരിമുറുക്കം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: שָׁמַיִם എന്നതിന്റെ സംഖ്യാഭാവം
  choice: ആകാശങ്ങൾ
  alternative: സ്വർഗം
  rationale: മൂലരൂപത്തോട് ഔപചാരികമായി അടുത്തുനിൽക്കാൻ ‘ആകാശങ്ങൾ’ സ്വീകരിച്ചു; ഇവിടെ അത് ദൈവികമണ്ഡലത്തെ സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭയഭക്തി’ വിശുദ്ധഭയവും ആദരവും ചേർന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘ഭവനം’, ‘കവാടം’ എന്നിവ വാക്യത്തിന്റെ ഔന്നത്യം സംരക്ഷിക്കുന്നു.
