    issue: Purpose clause is expressed with 'എടുക്കേണ്ടതിന്.'
    rationale: This construction may communicate necessity or obligation. The Hebrew לָקַחַת expresses the purpose of Isaac's sending Jacob, best rendered here by 'എടുക്കാൻ.'
  - severity: low
