translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഹീബ്രു വാക്യത്തിലെ ദീർഘമായ ആശ്രിതഘടന പരമാവധി നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ‘ചെയ്തെന്നും … കല്പിച്ചെന്നും’ എന്ന സമാന്തരരൂപം ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
