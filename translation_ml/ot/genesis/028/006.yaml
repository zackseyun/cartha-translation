reference: Genesis 28:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ml
  text: യിസ്ഹാക്ക് യാക്കോബിനെ അനുഗ്രഹിക്കുകയും, അവിടെനിന്ന് തനിക്കായി ഒരു ഭാര്യയെ എടുക്കാൻ അവനെ പദ്ദൻ-അരാമിലേക്കു അയയ്ക്കുകയും ചെയ്തതും, അവനെ അനുഗ്രഹിച്ചപ്പോൾ, “നീ കനാനിലെ പുത്രിമാരിൽനിന്ന്[a] ഒരു ഭാര്യയെ എടുക്കരുത്” എന്നു പറഞ്ഞ് അവനോടു കല്പിച്ചതും ഏശാവ് കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കനാന്യ സ്ത്രീകളിൽനിന്ന്.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “കനാനിലെ പുത്രിമാരിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: ഏശാവ് കണ്ടു
  rationale: വയ്യക്ഷണിക ക്രിയാരൂപം ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ഹീബ്രുവിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: യിസ്ഹാക്ക് യാക്കോബിനെ അനുഗ്രഹിക്കുകയും … ചെയ്തെന്നും
  rationale: ഏശാവ് കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ആദ്യ ഘടകമായി ആശ്രിതവാക്യരൂപത്തിൽ സ്വാഭാവികമായി നൽകി; സംഭവം കാണുന്നതിനു മുമ്പുള്ളതാണെന്ന ബന്ധം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: അവനെ പദ്ദൻ-അരാമിലേക്കു അയയ്ക്കുകയും
  rationale: അനുഗ്രഹിച്ചതിനോടു സമന്വയിപ്പിച്ച ക്രിയയായി നിലനിർത്തി; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: അവന് അവിടെനിന്ന് ഒരു ഭാര്യയെ എടുക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥമുള്ള infinitive-ഉം לוֹയിലെ സ്വാർഥ/പ്രയോജന സൂചനയും സംരക്ഷിക്കുന്നു; വിവാഹസന്ദർഭത്തിലെ ‘ഭാര്യയെ എടുക്കുക’ എന്ന ബൈബിൾഭാഷ സ്വാഭാവികമാണ്.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: അവനെ അനുഗ്രഹിച്ചപ്പോൾ
  rationale: בְּ ഇവിടെ ക്രിയയുടെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: എന്നു പറഞ്ഞ് അവനോടു കല്പിച്ചെന്നും
  rationale: צוהയുടെ കല്പനാഭാവവും לֵאמֹר എന്ന ഉദ്ധരണി-പരിചയപ്പെടുത്തലും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ സംരക്ഷിച്ചു.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: നീ ഒരു ഭാര്യയെ എടുക്കരുത്
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലുള്ള നിരോധനം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: കനാനിലെ പുത്രിമാരിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘കനാന്റെ പുത്രിമാർ’ എന്ന പ്രയോഗത്തിന്റെ രൂപചിത്രം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകി.
