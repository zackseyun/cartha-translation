id: GEN.28.20
reference: Genesis 28:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵ/אמֹ֑ר אִם יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗/י וּ/שְׁמָרַ֨/נִי֙ בַּ/דֶּ֤רֶךְ הַ/זֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְ/נָֽתַן לִ֥/י לֶ֛חֶם לֶ/אֱכֹ֖ל וּ/בֶ֥גֶד לִ/לְבֹּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് ഒരു നേർച്ച നേർന്ന് ഇങ്ങനെ പറഞ്ഞു: “ദൈവം എന്നോടുകൂടെ ഉണ്ടായിരിക്കുകയും ഞാൻ പോകുന്ന ഈ വഴിയിൽ എന്നെ കാത്തുസൂക്ഷിക്കുകയും[a], എനിക്ക് ഭക്ഷിക്കാൻ അപ്പവും[b] ധരിക്കാൻ വസ്ത്രവും തരുകയും ചെയ്താൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്നെ കാത്തുപരിപാലിക്കുകയും’ അല്ലെങ്കിൽ ‘എനിക്കു കാവലായിരിക്കുകയും.’'
    reason: שׁמר എന്ന എബ്രായ പദത്തിന് കാത്തുസൂക്ഷിക്കുക, കാവൽ നോക്കുക, പരിപാലിക്കുക എന്നീ അടുത്ത അർഥങ്ങൾ ഉണ്ടാകാം.
  - marker: b
    text: ‘അപ്പം’ എന്ന പദം ഇവിടെ ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാനും ഇടയുണ്ട്.
    reason: לֶחֶם എന്ന പദത്തിന്റെ പ്രത്യക്ഷ അർഥം ‘അപ്പം’ ആണെങ്കിലും സന്ദർഭാനുസരണം അത് ഭക്ഷണത്തിന്റെ പൊതുനാമമായി ഉപയോഗിക്കപ്പെടാം.
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: യാക്കോബ് ഒരു നേർച്ച നേർന്ന്
  rationale: നדר എന്ന ക്രിയയും അതേ ധാതുവിലുള്ള נֶדֶר എന്ന നാമവും ചേർന്നുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘നേർച്ച നേർന്നു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേർച്ചയുടെ ഉള്ളടക്കം സ്വാഭാവികമായ മലയാളത്തിൽ പരിചയപ്പെടുത്തുന്നു.
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: എബ്രായത്തിലെ വ്യവസ്ഥാസൂചകമായ אִם നേരിട്ട് നിലനിർത്തുന്നു; യാക്കോബ് ഉറപ്പോടെയാണോ സംശയത്തോടെയാണോ സംസാരിക്കുന്നത് എന്നു വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: אֱלֹהִים עִמָּדִי
  choice: ദൈവം എന്നോടുകൂടെ ഇരിക്കുകയും
  rationale: ദൈവസാന്നിധ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וּשְׁמָרַנִי
  choice: എന്നെ കാത്തുസൂക്ഷിക്കുകയും
  rationale: שׁמר എന്ന പദത്തിലെ സംരക്ഷിക്കുക, കാവൽ നോക്കുക എന്നീ അർഥവ്യാപ്തികൾ ‘കാത്തുസൂക്ഷിക്കുക’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: ഞാൻ പോകുന്ന ഈ വഴിയിൽ
  rationale: ‘ഈ വഴി’ എന്ന മൂലരൂപം നിലനിർത്തിക്കൊണ്ട് യാക്കോബിന്റെ യാത്രാസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: എനിക്ക് ഭക്ഷിക്കാൻ അപ്പവും തരുകയും
  rationale: לֶחֶם എന്നതിന്റെ പ്രത്യക്ഷ അർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; ‘ഭക്ഷിക്കാൻ’ എന്ന ഉദ്ദേശ്യപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: ധരിക്കാൻ വസ്ത്രവും
  rationale: വസ്ത്രവും അതിന്റെ ഉപയോഗലക്ഷ്യവും മൂലപാഠത്തോട് ചേർന്ന് ലളിതമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ വ്യവസ്ഥാപരമായ നേർച്ചയുടെ സ്വഭാവം
  choice: אִם എന്ന വ്യവസ്ഥയെ ‘ചെയ്താൽ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘ചെയ്യുമ്പോൾ’ അല്ലെങ്കിൽ ‘ചെയ്യുമെന്നതിനാൽ’ എന്നു ഉറപ്പിന്റെ ഭാവത്തിൽ വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠത്തിലെ വ്യവസ്ഥാസ്വഭാവം നിലനിർത്തുകയും യാക്കോബിന്റെ വാക്കുകൾ സംശയമാണോ ആത്മവിശ്വാസമാണോ എന്ന് മൗനമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘നേർച്ച നേർന്നു’ എന്ന പരമ്പരാഗതവും ഇന്നും മനസ്സിലാകുന്നതുമായ പ്രയോഗം മൂലത്തിലെ cognate construction നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമാകുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു.
