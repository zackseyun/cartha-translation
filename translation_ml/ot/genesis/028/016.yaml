id: GEN.28.16
reference: Genesis 28:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּיקַ֣ץ יַעֲקֹב֮ מִ/שְּׁנָת/וֹ֒ וַ/יֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהוָ֔ה בַּ/מָּק֖וֹם הַ/זֶּ֑ה וְ/אָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് ഉറക്കത്തിൽനിന്ന് ഉണർന്ന് പറഞ്ഞു: “തീർച്ചയായും യാഹ്‌വെ ഈ സ്ഥലത്തുണ്ട്; ഞാനോ അത് അറിഞ്ഞിരുന്നില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: ഉണർന്ന്
  rationale: ഉറക്കത്തിൽനിന്ന് ഉണരുക എന്ന ക്രിയയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം; തുടർന്നുള്ള וַיֹּאמֶר-നോടു ചേർന്ന് ആഖ്യാനപ്രവാഹം നിലനിർത്തുന്നു.
- source_word: מִשְּׁנָתוֹ
  choice: ഉറക്കത്തിൽനിന്ന്
  rationale: ‘അവന്റെ ഉറക്കത്തിൽനിന്ന്’ എന്ന ഉടമസ്ഥസൂചന മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതിനാൽ, കർത്താവായ യാക്കോബിനെ ആശ്രയിച്ച് സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: אָכֵן
  choice: തീർച്ചയായും
  rationale: പെട്ടെന്നുണ്ടായ ഉറച്ച തിരിച്ചറിവും ഊന്നലും പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵשׁ
  choice: ഉണ്ട്
  rationale: അസ്തിത്വത്തെയും സാന്നിധ്യത്തെയും ഒരുപോലെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമാനത.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്ത്
  rationale: യാക്കോബ് കിടന്നുറങ്ങി ദർശനം ലഭിച്ച നിർദിഷ്ട സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וְאָנֹכִי
  choice: ഞാനോ
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നലും യാഹ്‌വെയുടെ സാന്നിധ്യവും യാക്കോബിന്റെ മുൻകാല അജ്ഞതയും തമ്മിലുള്ള വ്യത്യാസവും മലയാളത്തിലെ ‘-ഓ’ ഘടകം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא יָדָעְתִּי
  choice: അത് അറിഞ്ഞിരുന്നില്ല
  rationale: പറയുന്ന നിമിഷത്തിനു മുമ്പുള്ള അറിവില്ലായ്മയെ ‘അറിഞ്ഞിരുന്നില്ല’ വ്യക്തമാക്കുന്നു; ‘അത്’ യാഹ്‌വെ അവിടെ ഉണ്ടെന്ന സത്യത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവെക്കാതെ ലിപ്യന്തരണം നിലനിർത്തി.
- issue: יֵשׁ എന്നതിലെ സാന്നിധ്യത്തിന്റെ സ്വഭാവം
  choice: ഈ സ്ഥലത്തുണ്ട്
  alternative: ഈ സ്ഥലത്ത് സന്നിഹിതനാണ്
  rationale: മൂലത്തിലെ അസ്തിത്വപ്രയോഗം സാന്നിധ്യം സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ സ്വഭാവത്തെ വിശദീകരിക്കുന്നില്ല; ‘ഉണ്ട്’ ആ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’, ‘ഞാനോ’ എന്നിവയിലൂടെ നിലനിർത്തി; അനാവശ്യ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
