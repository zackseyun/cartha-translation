  source_fidelity: 'മുഖ്യ ആശയങ്ങൾ ശരിയായി പകർന്നിട്ടുണ്ട്: അനുഗ്രഹവചനത്തിലെ ആശംസാഭാവം, അബ്രാഹാമിന്റെ അനുഗ്രഹം, യാക്കോബിനോടും അവന്റെ സന്തതിയോടുമുള്ള പ്രയോഗം, പരദേശവാസത്തിന്റെ ദേശം, ദൈവം അബ്രാഹാമിനു നൽകിയ ദേശം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ നിലവിലെ വാക്യക്രമത്തിൽ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ‘നീ കൈവശമാക്കേണ്ടതിന്’ എന്ന ഘടകം പ്രധാനവാക്യത്തിനു ശേഷം അപൂർണമായി നിൽക്കുന്നു. അത് മുഖ്യക്രിയയോടു വ്യാകരണപരമായി ബന്ധിപ്പിക്കണം.'
  naturalness: ‘ദൈവം അബ്രാഹാമിനു നൽകിയ, നീ പരദേശിയായി പാർക്കുന്ന ദേശം’ എന്ന മുൻനിരത്തിയ ബന്ധവാക്യവും തുടർന്ന് വരുന്ന ഉദ്ദേശ്യഖണ്ഡവും വായനയിൽ ഭാരവും വാക്യഭംഗവും കുറയ്ക്കുന്നു. ഉദ്ദേശ്യഖണ്ഡം ആദ്യം വെക്കുകയും ബന്ധവാക്യത്തിന്റെ ക്രമം മലയാളത്തിനു സ്വാഭാവികമായി മാറ്റുകയും ചെയ്താൽ ഗൗരവമുള്ള ആധുനിക ഭാഷാശൈലി ലഭിക്കും.
  terminology: ‘അബ്രാഹാമിന്റെ അനുഗ്രഹം,’ ‘സന്തതി,’ ‘പരദേശിയായി പാർക്കുന്ന ദേശം,’ ‘കൈവശമാക്കുക,’ ‘ദൈവം’ എന്നിവ യോജിച്ചിരിക്കുന്നു. ‘നിന്നോടുകൂടെ’ എന്നത് אִתָּךְ എന്ന ഘടകം വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് a-യിൽ ബദൽവാക്യം മുഴുവൻ ദത്തിവിഭക്തി ഉൾപ്പെടെ നൽകുന്നതാണ് കൂടുതൽ കൃത്യം.
