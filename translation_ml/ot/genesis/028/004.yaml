- from: അവൻ അബ്രാഹാമിന്റെ അനുഗ്രഹം നിനക്കും നിന്നോടൊപ്പമുള്ള നിന്റെ സന്തതിക്കും[a] നൽകുമാറാകട്ടെ; ദൈവം അബ്രാഹാമിനു നൽകിയ, നീ പരദേശിയായി പാർക്കുന്ന ദേശം നീ കൈവശമാക്കേണ്ടതിന്[b].
  to: നീ പരദേശിയായി പാർക്കുന്ന, ദൈവം അബ്രാഹാമിന് നൽകിയ ദേശം കൈവശമാക്കേണ്ടതിന്, അവൻ അബ്രാഹാമിന്റെ അനുഗ്രഹം നിനക്കും നിന്നോടുകൂടെ നിന്റെ സന്തതിക്കും[a] നൽകുമാറാകട്ടെ.
  rationale: ലְרִשְׁתְּךָയുടെ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി വരുന്നതിനായി ‘ദേശം കൈവശമാക്കേണ്ടതിന്’ എന്ന ഖണ്ഡം പ്രധാന ആശംസാവാക്യത്തിനു മുമ്പിലേക്കു മാറ്റി. ‘നീ പരദേശിയായി പാർക്കുന്ന’ എന്ന സ്വാഭാവിക വ്യാഖ്യാനപരമായ രൂപം നിലനിർത്തി; അതു מְגֻרֶיךָയുടെ resident-alien/sojourning ആശയം പകരുന്നു. അടിക്കുറിപ്പ് b മുഖ്യവാചകത്തിലെ ‘കൈവശമാക്കുക’ എന്ന തിരഞ്ഞെടുപ്പിനു യോജിച്ച ബദലായി നിലനിർത്തിയിരിക്കുന്നു.
