  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: ml
  text: നീ പരദേശിയായി പാർക്കുന്ന, ദൈവം അബ്രാഹാമിന് നൽകിയ ദേശം കൈവശമാക്കേണ്ടതിന്, അവൻ അബ്രാഹാമിന്റെ അനുഗ്രഹം നിനക്കും നിന്നോടുകൂടെ നിന്റെ സന്തതിക്കും[a] നൽകുമാറാകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കും നിന്നോടുകൂടെയുള്ള നിന്റെ വിത്തിനും.” എബ്രായ നാമം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും അർഥത്തിൽ സമൂഹവാചകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: നൽകുമാറാകട്ടെ
  rationale: അനുഗ്രഹവചനത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ഈ രൂപം ഒരു ആശംസയോ പ്രാർഥനയോ പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നൽകുമാറാകട്ടെ’ അതിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ അനുഗ്രഹം
  rationale: എബ്രായ സംയുക്തപദബന്ധം നേരിട്ട് പകർന്നുകൊണ്ട് അബ്രാഹാമിനോടുള്ള ഉടമ്പടിവാഗ്ദാനത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: നിനക്കും നിന്നോടൊപ്പമുള്ള നിന്റെ സന്തതിക്കും
  rationale: זֶרַע രൂപത്തിൽ ഏകവചനമാണെങ്കിലും സമൂഹവാചകമായി സന്തതിവംശത്തെ സൂചിപ്പിക്കുന്നു. אִתָּךְ എന്ന ‘നിന്നോടൊപ്പം’ എന്ന ഘടകവും ഒഴിവാക്കാതെ സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
- source_word: לְרִשְׁתְּךָ
  choice: നീ കൈവശമാക്കേണ്ടതിന്
  rationale: לְ ചേർന്ന ക്രിയാനാമരൂപം ഇവിടെ ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്നു. ദേശത്തെ സംബന്ധിച്ച് ‘കൈവശമാക്കുക’ എന്നത് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു; ‘അവകാശമായി നേടുക’ എന്ന ഉടമ്പടിസംബന്ധമായ അർഥനിറവും സാധ്യമാണ്.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: നീ പരദേശിയായി പാർക്കുന്ന ദേശം
  rationale: מָגוּר വാഗ്ദത്തദേശത്ത് സ്ഥിരാവകാശമില്ലാത്ത പരദേശവാസിയായി പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ബഹുവചനപ്രയോഗത്തെക്കാൾ ഈ വാക്യരൂപം ആ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: ദൈവം അബ്രാഹാമിനു നൽകിയ
  rationale: ബന്ധവാക്യം ലളിതമായും നേരിട്ടും പകർത്തുന്നു; אֱלֹהִים എന്നതിന് ഇവിടെ ‘ദൈവം’ യോജിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള ഉടമ്പടിവാഗ്ദാനത്തിന്റെ ഭാഷ
  choice: ‘അബ്രാഹാമിന്റെ അനുഗ്രഹം’ എന്നും ദേശം ‘കൈവശമാക്കുക’ എന്നും വ്യക്തമായി നിലനിർത്തി.
  alternative: ‘അബ്രാഹാമിനു വാഗ്ദാനം ചെയ്ത അനുഗ്രഹം’ എന്നും ‘അവകാശമായി നേടുക’ എന്നും വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്താം.
  rationale: വാക്യം അബ്രാഹാമിനോടുള്ള വാഗ്ദാനവുമായി യാക്കോബിനെ നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ഉടമ്പടിസംബന്ധമായ അർഥസമ്മർദം സംരക്ഷിച്ചിരിക്കുന്നു.
- issue: זֶרַע എന്ന പദത്തിന്റെ ഏകവചനരൂപവും സമൂഹവാചകാർഥവും
  choice: മുഖ്യവാചകത്തിൽ ‘സന്തതി’ എന്ന് നൽകി, രൂപപരമായ ‘വിത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: മുഖ്യവാചകത്തിൽ ‘വിത്ത്’ എന്ന അക്ഷരാർഥം ഉപയോഗിക്കാം.
  rationale: ‘സന്തതി’ ആധുനിക മലയാളത്തിൽ മനുഷ്യവംശപരമ്പരയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും എബ്രായത്തിലെ സമൂഹവാചകാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ഏകവചനരൂപം അനാവശ്യമായി ഒരു വ്യക്തിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അനുഗ്രഹവചനശൈലി സ്വീകരിച്ചു. ‘പരദേശിയായി പാർക്കുന്ന’ എന്ന പ്രയോഗം പിതൃപുരുഷന്മാരുടെ താൽക്കാലിക വാസസ്ഥിതിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പുകളുടെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
