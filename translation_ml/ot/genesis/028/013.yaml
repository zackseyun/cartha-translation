id: GEN.28.13
reference: Genesis 28:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: ml
  text: 'അതാ, യഹ്‌വെ അതിന്റെ മുകളിൽ[a] നിലകൊണ്ടിരുന്നു. അവൻ പറഞ്ഞു: “ഞാൻ യഹ്‌വെ, നിന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവവും യിസ്ഹാക്കിന്റെ ദൈവവും ആകുന്നു. നീ കിടക്കുന്ന ദേശം ഞാൻ നിനക്കും നിന്റെ സന്തതിക്കും[b] തരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “യാക്കോബിന്റെ അരികിൽ” അഥവാ “യാക്കോബിന്റെ മുകളിൽ”; സർവനാമം പടിക്കെട്ടിനെയല്ല, യാക്കോബിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിൽ.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ “നിന്റെ വിത്തിനും”; സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ “നിന്റെ സന്തതിക്കും” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ദർശനവിവരണത്തിലെ അപ്രതീക്ഷിതത്വവും സജീവതയും സൂചിപ്പിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൂചനയോടെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נִצָּב
  choice: നിലകൊണ്ടിരുന്നു
  rationale: ഹീബ്രു കർത്തൃവാചക രൂപത്തിന്റെ തുടരുന്ന അഥവാ നിലനിൽക്കുന്ന ഭാവം പ്രകടമാക്കുന്നു.
- source_word: עָלָיו
  choice: അതിന്റെ മുകളിൽ
  rationale: അടുത്തുള്ള മുൻപദമായ പടിക്കെട്ടിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവായന സ്വീകരിക്കുന്നു; യാക്കോബിനെ സൂചിപ്പിക്കാവുന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: നിന്റെ പിതാവായ അബ്രാഹാമിന്റെ ദൈവം
  rationale: אָבִיךָ എന്നത് അബ്രാഹാമിനോടു ചേർന്നുള്ള അനുബന്ധവിശേഷണമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ ‘പിതാവ്’ പൂർവപിതാവ് എന്ന വിശാല അർഥം വഹിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ഈ ദേശം
  rationale: വാഗ്ദത്തത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭൂമിയുടെ ഉപരിതലം മാത്രമല്ല, അവകാശമായി നൽകപ്പെടുന്ന ദേശമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ നിർദ്ദേശകപദം സന്ദർഭത്തിലെ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: നീ കിടക്കുന്ന
  rationale: നിലവിൽ തുടരുന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ഈ ദേശം’ എന്നതുമായുള്ള സ്ഥലംബന്ധം പ്രസക്തിയിൽ വ്യക്തമാണ്.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: ഞാൻ നിനക്കു തരും
  rationale: വാഗ്ദത്തസന്ദർഭത്തിലെ അപൂർണക്രിയയെ ഭാവികാലമായി നൽകുന്നു.
- source_word: וּלְזַרְעֶךָ
  choice: നിന്റെ സന്തതിക്കും
  rationale: זֶרַע എന്ന ഏകവചനരൂപത്തിലുള്ള സമൂഹാർഥത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്ന ‘സന്തതി’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവിക നാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: עָלָיו എന്ന സർവനാമത്തിന്റെ സൂചിതപദം
  choice: പടിക്കെട്ട്—‘അതിന്റെ മുകളിൽ’
  alternative: യാക്കോബ്—‘അവന്റെ അരികിൽ’ അല്ലെങ്കിൽ ‘അവന്റെ മുകളിൽ’
  rationale: തൊട്ടുമുമ്പുള്ള പുൽലിംഗ ഏകവചന നാമമായ പടിക്കെട്ടാണ് ഏറ്റവും അടുത്ത വ്യാകരണസൂചകം. എങ്കിലും യാക്കോബിനെ സൂചിപ്പിക്കുന്ന വായന സാധ്യമായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘അബ്രാഹാം നിന്റെ പിതാവ്’ എന്ന പ്രയോഗം
  choice: നിന്റെ പിതാവായ അബ്രാഹാം
  alternative: നിന്റെ പൂർവപിതാവായ അബ്രാഹാം
  rationale: ഹീബ്രുവിലെ ‘പിതാവ്’ എന്ന പദം മാറ്റാതെ സൂക്ഷിക്കുന്നു; വംശപിതാവ് എന്ന വിശാലബന്ധം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ ദർശനത്തിന്റെ സജീവത നിലനിർത്തുന്നു; ‘നിലകൊണ്ടിരുന്നു’ കർത്തൃവാചകത്തിന്റെ തുടരുന്ന ഭാവം നൽകുന്നു. ദൈവിക നാമം സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റിയിട്ടില്ല; വാക്യത്തിലെ യഥാർഥ സർവനാമസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
