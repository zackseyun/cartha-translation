source:
  edition: WLC
  text: וַ/יֵּצֵ֥א יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֖לֶךְ חָרָֽנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: ml
  text: യാക്കോബ് ബേർ-ശേബയിൽനിന്ന് പുറപ്പെട്ട് ഹാരാനിലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ഹാരാനിലേക്കു/ഹാരാന്റെ ദിശയിലേക്ക്’; ‘ഹാരാൻ’ എന്ന പേരിനോടു ദിശ സൂചിപ്പിക്കുന്ന ഒരു പ്രത്യയം ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് സ്വാഭാവികവും മൂലാർഥത്തോട് അടുത്തതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: מִבְּאֵר שָׁבַע
  choice: ബേർ-ശേബയിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; בְּאֵר שָׁבַע എന്ന സ്ഥലനാമം ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളപരിഭാഷ. ‘യാത്രയായി’ പോലുള്ള രൂപങ്ങൾ മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധികഭാവം ചേർക്കും.
- source_word: חָרָנָה
  choice: ഹാരാനിലേക്കു
  rationale: സ്ഥലദിശ സൂചിപ്പിക്കുന്ന -ָה പ്രത്യയം ഹാരാന്റെ ദിശയിലേക്കുള്ള ഗതിയെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘-ലേക്കു’ ലക്ഷ്യവും ദിശയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. സ്ഥലനാമങ്ങൾ പരിചിതമായ മലയാളരൂപങ്ങളിൽ നിലനിർത്തി; എബ്രായത്തിലെ ദിശാസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
