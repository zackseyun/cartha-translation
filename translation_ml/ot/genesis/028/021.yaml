  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: ml
  text: ഞാൻ സമാധാനത്തോടെ[a] എന്റെ അപ്പന്റെ വീട്ടിലേക്കു മടങ്ങിവരുകയും ചെയ്താൽ, യഹോവ എനിക്കു ദൈവമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമാധാനത്തോടെ” എന്നത് “സുരക്ഷിതനായി” അഥവാ “ക്ഷേമത്തോടെ” എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രു പ്രയോഗം സുരക്ഷിതമായ മടങ്ങിവരവും സമഗ്രമായ സുഖക്ഷേമവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: ഞാൻ … മടങ്ങിവരുകയും ചെയ്താൽ
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘മടങ്ങിവരുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. മുൻവാക്യത്തിൽ ആരംഭിച്ച നിബന്ധനാപരമായ നേർച്ചയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ചെയ്താൽ’ ഉപയോഗിച്ചു.
- source_word: בְשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: שָׁלוֹם എന്ന പദത്തിലെ സമാധാനം, ക്ഷേമം, സുരക്ഷ എന്നീ വിശാല അർഥങ്ങൾ സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള വിവർത്തനം; സുരക്ഷിതമായ മടങ്ങിവരവ് എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֶל בֵּית אָבִי
  choice: എന്റെ അപ്പന്റെ വീട്ടിലേക്കു
  rationale: കുടുംബത്തെയും പിതൃഭവനത്തെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു ഘടന സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהָיָה
  choice: ആയിരിക്കും
  rationale: നേർച്ചയിലെ നിബന്ധനയ്ക്കു പിന്നാലെയുള്ള ഫലത്തെ ഭാവികാലത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഹീബ്രുവിൽ പ്രത്യേകം ഇല്ലാത്ത ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לִי לֵאלֹהִים
  choice: എനിക്കു ദൈവമായിരിക്കും
  rationale: ‘എനിക്ക് ദൈവമായി ഇരിക്കും’ എന്ന ഹീബ്രു ബന്ധസൂചനയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബ് യഹോവയെ തന്റെ ദൈവമായി അംഗീകരിക്കുന്നത് നിബന്ധനയുടെ ഫലമാണോ, അതോ നിരുപാധികമായ പ്രഖ്യാപനമാണോ
  choice: മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച നിബന്ധനയുടെ ഫലമായി ‘യഹോവ എനിക്കു ദൈവമായിരിക്കും’ എന്നു നിലനിർത്തി.
  alternative: ഇത് നിബന്ധനയിൽനിന്നു വേർപെട്ട നിരുപാധികമായ വിശ്വാസപ്രഖ്യാപനമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രു വാക്യശൃംഖല നേർച്ചയിലെ നിബന്ധന തുടരുകയും തുടർന്ന് ഫലം അറിയിക്കുകയും ചെയ്യുന്നതായി സ്വാഭാവികമായി വായിക്കാം. എന്നാൽ മൂലപാഠത്തിൽ പ്രത്യേകമായി ഇല്ലാത്ത ‘അപ്പോൾ’ ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അപ്പന്റെ വീട്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തിലെ കുടുംബബന്ധം നിലനിർത്തുന്നതുമാണ്; നിബന്ധനാപരമായ വാക്യബന്ധം വ്യക്തമാക്കിയെങ്കിലും മൂലത്തിൽ ഇല്ലാത്ത ശക്തിപ്പെടുത്തൽ ഒഴിവാക്കി.
