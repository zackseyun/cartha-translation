id: GEN.28.1
reference: Genesis 28:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ml
  text: 'പിന്നെ യിസ്ഹാക്ക് യാക്കോബിനെ വിളിച്ച് അനുഗ്രഹിക്കുകയും അവനോടു കല്പിക്കുകയും ചെയ്തു: “കനാന്യസ്ത്രീകളിൽനിന്ന് നീ ഒരു ഭാര്യയെ എടുക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: קרא എന്ന ക്രിയ אֶל സഹിതം ഇവിടെ ഒരാളെ അടുക്കലേക്ക് വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ച്’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിക്കുകയും
  rationale: ברך എന്നതിന്റെ സാധാരണ അർഥമായ ‘അനുഗ്രഹിക്കുക’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיְצַוֵּהוּ
  choice: അവനോടു കല്പിക്കുകയും ചെയ്തു
  rationale: צוה അധികാരപൂർവമായ കല്പന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; പിതാവിന്റെ നിർദേശത്തിന്റെ ശക്തി ‘കല്പിച്ചു’ സംരക്ഷിക്കുന്നു.
- source_word: וַיֹּאמֶר לוֹ
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ പ്രതിനിധീകരിച്ചു
  rationale: ‘കല്പിക്കുകയും അവനോടു പറയുകയും ചെയ്തു’ എന്ന ആവർത്തനഭാരം ഒഴിവാക്കി, ഹീബ്രു കഥനശൃംഖലയിലെ വാക്കിന്റെ ആമുഖം മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: לֹא תִקַּח
  choice: നീ ... എടുക്കരുത്
  rationale: നിഷേധത്തോടുകൂടിയ imperfect ഇവിടെ വിലക്കാണ്; ‘എടുക്കരുത്’ അതിന്റെ കല്പനാശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: אִשָּׁה
  choice: ഒരു ഭാര്യയെ
  rationale: വിവാഹസന്ദർഭത്തിൽ אִשָּׁה ‘ഭാര്യ’ എന്നാണ്; ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ഇവിടെ ഇതാണ് കൃത്യം.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: കനാനിലെ പുത്രിമാരിൽനിന്ന്
  rationale: ‘കനാന്റെ പുത്രിമാരിൽനിന്ന്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപഭാവം സംരക്ഷിക്കുമ്പോൾ, ‘കനാനിലെ’ എന്നത് ആ ദേശജനവിഭാഗത്തിലെ സ്ത്രീകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַ
  choice: പിന്നെ
  rationale: ആദ്യത്തെ waw കഥനത്തിലെ തുടർച്ചയും സമയക്രമവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പിന്നെ’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘കനാനിലെ പുത്രിമാർ’ എന്ന സെമിറ്റിക് പ്രയോഗം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
