  to: 'പിന്നെ യിസ്ഹാക്ക് യാക്കോബിനെ വിളിച്ച് അനുഗ്രഹിക്കുകയും അവനോടു കല്പിക്കുകയും ചെയ്തു: “കനാന്യസ്ത്രീകളിൽനിന്ന് നീ ഒരു ഭാര്യയെ എടുക്കരുത്.”'
