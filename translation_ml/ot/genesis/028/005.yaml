  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട വംശബന്ധവാക്യത്തിലെ ആശയക്കുഴപ്പം കുറയ്ക്കാൻ ‘മകനും ... സഹോദരനുമായ’ എന്ന സമാന്തര ഘടന ഉപയോഗിച്ചു.
