  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִצְחָק֙ אֶֽת יַעֲקֹ֔ב וַ/יֵּ֖לֶךְ פַּדֶּ֣נָֽ/ה אֲרָ֑ם אֶל לָבָ֤ן בֶּן בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְ/עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: ml
  text: അങ്ങനെ യിസ്ഹാക്ക് യാക്കോബിനെ പറഞ്ഞയച്ചു; അവൻ പദ്ദൻ-അരാമിലേക്കു, അരാമ്യനായ[a] ബെഥൂവേലിന്റെ മകനും യാക്കോബിന്റെയും ഏശാവിന്റെയും അമ്മയായ റിബെക്കയുടെ സഹോദരനുമായ ലാബാന്റെ അടുക്കൽ പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പഴയ വിവർത്തനപാരമ്പര്യത്തിൽ, “സുറിയക്കാരനായ.” എന്നാൽ ഹീബ്രു പദം കൂടുതൽ കൃത്യമായി അരാമ്യനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: യാത്രയാക്കി
  rationale: ഈ സന്ദർഭത്തിൽ ഒരാളെ പറഞ്ഞയയ്ക്കുക/യാത്രയാക്കുക എന്ന അർഥം; തുടർന്നുള്ള പുറപ്പെടലും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: അവൻ ... പോയി
  rationale: הלך എന്ന സാധാരണ ‘പോകുക’ എന്ന ക്രിയയും സംഭവങ്ങളുടെ തുടർച്ചയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: פַּדֶּנָה אֲרָם
  choice: പദ്ദൻ-അരാമിലേക്കു
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രുവിലെ ദിശാസൂചക പ്രത്യയം ‘-ലേക്കു’ എന്നു പ്രകടമാക്കി.
- source_word: בֶּן בְּתוּאֵל
  choice: ബെഥൂവേലിന്റെ മകൻ
  rationale: പുത്രബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീവിഭക്തി ഘടനയിൽ നൽകി.
- source_word: הָאֲרַמִּי
  choice: അരാമ്യനായ
  rationale: ചരിത്ര-വംശീയ സൂചനയായ ‘Aramean’ കൃത്യമായി നൽകുന്നു; ‘സുറിയാനിക്കാരൻ’ എന്ന പിൽക്കാല ഭൂമിശാസ്ത്രപരമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: אֲחִי רִבְקָה
  choice: റിബെക്കയുടെ സഹോദരൻ
  rationale: ഹീബ്രു ബന്ധഘടനയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: യാക്കോബിന്റെയും ഏശാവിന്റെയും അമ്മ
  rationale: റിബെക്കയെ വിശദീകരിക്കുന്ന ഹീബ്രു പ്രയോഗം പൂർണമായി നിലനിർത്തുന്നു.
theological_decisions: []
