  to: അപ്പോൾ ഏശാവ് യിശ്മായേലിന്റെ അടുത്ത് ചെന്നു; അബ്രാഹാമിന്റെ മകനായ യിശ്മായേലിന്റെ മകളും നെബായോത്തിന്റെ സഹോദരിയുമായ മഹലത്തിനെ തന്റെ ഭാര്യമാർക്കു പുറമേ തനിക്കു ഭാര്യയായി എടുത്തു.[a]
  rationale: The revision removes the added causal force of “അതുകൊണ്ട്,” avoids the unnecessary interpretive adjective “നിലവിലുള്ള,” retains the Hebrew’s sequential narrative and marital idiom, and corrects the footnote alternative so that it accurately conveys addition rather than accompaniment.
