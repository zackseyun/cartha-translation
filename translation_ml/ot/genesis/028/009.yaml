translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ബന്ധങ്ങളുടെ നീണ്ട നിര വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; മൂലത്തിലെ വിവരക്രമവും കൂട്ടിച്ചേർക്കലിന്റെ അർഥവും നിലനിർത്തി.
