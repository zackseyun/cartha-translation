base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: ml
  text: അപ്പോൾ ഏശാവ് യിശ്മായേലിന്റെ അടുത്ത് ചെന്നു; അബ്രാഹാമിന്റെ മകനായ യിശ്മായേലിന്റെ മകളും നെബായോത്തിന്റെ സഹോദരിയുമായ മഹലത്തിനെ തന്റെ ഭാര്യമാർക്കു പുറമേ തനിക്കു ഭാര്യയായി എടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ ഭാര്യമാർക്കു പുറമേ.” മഹലത്തിനെ ഏശാവ് തന്റെ ഭാര്യമാർക്കു പകരമായല്ല, അവർക്കു പുറമേ മറ്റൊരു ഭാര്യയായാണ് എടുത്തതെന്ന് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: ഏശാവ് യിശ്മായേലിന്റെ അടുക്കൽ ചെന്നു
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനം സൂചിപ്പിക്കുന്ന וַיֵּלֶךְ ലളിതമായി ‘ചെന്നു’ എന്നു നൽകി; വ്യക്തിയിലേക്കുള്ള ഗതിയെ אֶל സൂചിപ്പിക്കുന്നതിനാൽ ‘അടുക്കൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും, לוֹ לְאִשָּׁה എന്ന വിവാഹസന്ദർഭത്തിൽ മലയാളത്തിൽ ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: מָחֲלַת
  choice: മഹലത്ത്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ മകനായ യിശ്മായേലിന്റെ മകൾ
  rationale: വംശബന്ധം വ്യക്തമാക്കുന്ന എബ്രായ സംയുക്തഘടന മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണക്രമത്തിൽ നൽകി.
- source_word: אֲחוֹת נְבָיוֹת
  choice: നെബായോത്തിന്റെ സഹോദരി
  rationale: മഹലത്തിനെ കൂടുതൽ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണവാക്യം നേരിട്ട് നിലനിർത്തി.
- source_word: עַל נָשָׁיו
  choice: തന്റെ നിലവിലുള്ള ഭാര്യമാർക്കു പുറമേ
  rationale: ഇവിടെ עַל സ്ഥാനബന്ധമല്ല, കൂട്ടിച്ചേർക്കലാണ് സൂചിപ്പിക്കുന്നത്. പുതിയ ഭാര്യ പഴയ ഭാര്യമാരുടെ പകരക്കാരിയല്ലെന്ന് ‘നിലവിലുള്ള ... പുറമേ’ വ്യക്തമാക്കുന്നു.
- source_word: לוֹ לְאִשָּׁה
  choice: തനിക്കു ഭാര്യയായി
  rationale: വിവാഹത്തിന്റെ ഉദ്ദേശ്യവും לוֹ നൽകുന്ന സ്വപ്രയോജനസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
