translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സുലഭവുമായ ശൈലി. ‘അപ്പൻ’, ‘സഹോദരൻ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിലെ ബന്ധഘടന വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു; ആജ്ഞയുടെ ഗൗരവം ‘എഴുന്നേറ്റ് ... പോകുക’, ‘എടുക്കുക’ എന്നീ രൂപങ്ങൾ നിലനിർത്തുന്നു.
