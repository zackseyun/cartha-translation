  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: ml
  text: എഴുന്നേറ്റ് പദ്ദൻ-അരാമിലേക്കും നിന്റെ അമ്മയുടെ അപ്പനായ ബെഥൂവേലിന്റെ വീട്ടിലേക്കും പോകുക; അവിടെനിന്ന് നിന്റെ അമ്മയുടെ സഹോദരനായ ലാബാന്റെ പുത്രിമാരിൽനിന്ന് നിനക്കായി ഒരു ഭാര്യയെ എടുക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ പ്രയോഗസഹജമായി, “നിന്റെ അമ്മയുടെ അപ്പൻ” എന്നതിന് “നിന്റെ മുത്തച്ഛൻ” എന്നും “നിന്റെ അമ്മയുടെ സഹോദരൻ” എന്നതിന് “നിന്റെ അമ്മാവൻ” എന്നും പറയാം. പ്രധാനവാചകം എബ്രായത്തിലെ ബന്ധപ്രയോഗങ്ങൾ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם לֵךְ֙
  choice: എഴുന്നേറ്റ് ... പോകുക
  rationale: തുടർച്ചയായ രണ്ടു ആജ്ഞകളുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: പദ്ദൻ-അരാമിലേക്കു
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ദിശാസൂചകമായ -ה മലയാളത്തിലെ ‘-ലേക്കു’കൊണ്ട് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: ബെഥൂവേലിന്റെ വീട്ടിലേക്കു
  rationale: വീടിനെയോ കുടുംബഭവനത്തെയോ ലക്ഷ്യമാക്കിയുള്ള ഗതി വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥഘടന ഉപയോഗിക്കുന്നു.
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: നിന്റെ അമ്മയുടെ അപ്പനായ
  rationale: ‘നിന്റെ അമ്മയുടെ അപ്പൻ’ എന്ന എബ്രായ ബന്ധപ്രയോഗം തുറന്നുവെക്കുന്നു; ‘മുത്തച്ഛൻ’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: וְקַח לְךָ֤
  choice: നിനക്കു ... എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ‘എടുക്കുക’ എന്ന അർഥവും לְךָ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ലക്ഷ്യവും നിലനിർത്തുന്നു.
- source_word: מִשָּׁם֙
  choice: അവിടെനിന്ന്
  rationale: മൂലപാഠത്തിലെ ‘നിന്ന്’ എന്ന ആശയം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: אִשָּׁ֔ה
  choice: ഭാര്യയായി
  rationale: വിവാഹസന്ദർഭത്തിൽ ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ തന്നെയാണ് ഉദ്ദേശിച്ച അർഥം.
- source_word: מִבְּנ֥וֹת לָבָ֖ן
  choice: ലാബാന്റെ പുത്രിമാരിൽ ഒരുവളെ
  rationale: തിരഞ്ഞെടുപ്പ് പല പുത്രിമാരിൽനിന്നാണെന്ന ഭാഗികത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲחִ֥י אִמֶּֽךָ
  choice: നിന്റെ അമ്മയുടെ സഹോദരനായ
  rationale: എബ്രായത്തിലെ ബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘അമ്മാവൻ’ എന്ന സംക്ഷിപ്ത പദം പ്രധാനവാചകത്തിൽ കൊണ്ടുവരുന്നില്ല.
