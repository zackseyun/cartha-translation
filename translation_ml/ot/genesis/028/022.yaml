id: GEN.28.22
reference: Genesis 28:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: ml
  text: ഞാൻ സ്തംഭമായി നാട്ടിയ ഈ കല്ല് ദൈവത്തിന്റെ ഭവനമായിരിക്കും[a]. അങ്ങ് എനിക്കു തരുന്ന എല്ലാറ്റിലും പത്തിലൊന്ന് ഞാൻ അങ്ങേക്കു തീർച്ചയായും നൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിനുള്ള ഒരു ഭവനമായിരിക്കും.”
    reason: എബ്രായത്തിലെ ബֵּית אֱלֹהִים എന്ന പ്രയോഗം ‘ദൈവത്തിന്റെ ഭവനം’ എന്നും ‘ദൈവത്തിനുള്ള ഒരു ഭവനം’ എന്നും സ്വാഭാവികമായി ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: מַצֵּבָה
  choice: സ്തംഭം
  rationale: നാട്ടിനിർത്തിയ കൽസ്മാരകത്തെയോ അടയാളക്കല്ലിനെയോ സൂചിപ്പിക്കുന്നു. ‘സ്തംഭം’ മൂലപാഠത്തിലെ മൂർത്തമായ ദൃശ്യം ചുരുക്കത്തിലും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי מַצֵּבָה
  choice: ഞാൻ സ്തംഭമായി നാട്ടിയ ഈ കല്ല്
  rationale: ശിലയെ വെറുതെ വച്ചതല്ല, കുത്തനെ സ്ഥാപിച്ചതാണെന്ന സന്ദർഭാർഥം ‘നാട്ടിയ’ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: ദൈവത്തിന്റെ ഭവനമായിരിക്കും
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ നേരായ അർഥം ‘ദൈവത്തിന്റെ ഭവനം’ എന്നാണ്. ഈ കല്ലുമായി ബന്ധപ്പെട്ട സ്ഥലം വിശുദ്ധസ്ഥാനമാകുമെന്ന വാചകത്തിന്റെ തുറന്ന സ്വഭാവം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: תִּתֶּן לִי
  choice: അങ്ങ് എനിക്കു തരുന്ന
  rationale: നേർച്ചയുടെ പശ്ചാത്തലത്തിലുള്ള ലളിതമായ അപൂർണക്രിയയെ സ്വാഭാവികമായ ഭാവി/നിബന്ധനാർഥത്തിൽ അവതരിപ്പിക്കുന്നു. ദൈവത്തോടുള്ള ആദരസൂചക അഭിസംബോധനയായി ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: പത്തിലൊന്ന് ഞാൻ അങ്ങേക്കു തീർച്ചയായും നൽകും
  rationale: ക്രിയാനാമവും അതേ ധാതുവിലെ ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ വഴി നിലനിർത്തുന്നു; ‘ദശാംശം’ എന്ന സ്ഥാപനപരമായ പദത്തേക്കാൾ ‘പത്തിലൊന്ന്’ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: לָךְ
  choice: അങ്ങേക്കു
  rationale: നേർന്ന പത്തിലൊന്നിന്റെ സ്വീകർത്താവ് ദൈവമാണെന്ന് നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കല്ല് ‘ദൈവത്തിന്റെ ഭവനം’ ആകുന്നതിന്റെ സ്വഭാവം
  choice: പിന്നീടുള്ള ദേവാലയസിദ്ധാന്തം ചേർക്കാതെ ‘ദൈവത്തിന്റെ ഭവനമായിരിക്കും’ എന്ന മൂലവാചകം നിലനിർത്തി.
  alternative: കല്ലുതന്നെ ഒരു ആരാധനാലയമാകും; അല്ലെങ്കിൽ ഇത് പിന്നീടുള്ള ദേവാലയത്തെ നേരിട്ട് പ്രവചിക്കുന്നു.
  rationale: ഉടൻമുമ്പുള്ള ദൈവസന്ദർശനവുമായി ബന്ധപ്പെട്ട വിശുദ്ധസ്ഥാനമെന്ന ആശയം വാചകത്തിലുണ്ട്; എന്നാൽ അത് എങ്ങനെ നിറവേറും എന്നു പരിഭാഷ വിശദീകരിക്കുന്നില്ല.
- issue: പത്തിലൊന്ന് നൽകുമെന്ന നേർച്ച
  choice: ദൈവം നൽകുന്ന എല്ലാറ്റിലും പത്തിലൊന്ന് ദൈവത്തിനു തീർച്ചയായും നൽകുമെന്ന വ്യക്തിപരമായ നേർച്ചയായി പരിഭാഷപ്പെടുത്തി.
  alternative: പിന്നീടുള്ള മോശൈക നിയമത്തിലെയോ സഭാപരമായ ദശാംശക്രമത്തിലെയോ സ്ഥാപനപരമായ സാങ്കേതികപദമായി വായിക്കുക.
  rationale: ഉല്പത്തി സന്ദർഭത്തിലെ നേർച്ചയും എബ്രായത്തിലെ ഊന്നലും സംരക്ഷിക്കുമ്പോൾ പിൽക്കാല സംവിധാനങ്ങളെ പാഠത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘ഭവനം’ എന്നത് ‘വീട്’ എന്നതിനെക്കാൾ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; അതേസമയം പിൽക്കാല ദേവാലയസ്ഥാപനത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
