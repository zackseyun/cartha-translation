base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ അപ്പന്റെയും അമ്മയുടെയും വാക്ക് കേട്ട്[a] പദ്ദൻ-അരാമിലേക്കു പോയെന്നും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അപ്പനെയും അമ്മയെയും അനുസരിച്ച്.’ സന്ദർഭത്തിൽ ഈ ഹീബ്രു ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്നും ‘അനുസരിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: വാക്കു കേട്ട്
  rationale: שׁמע എന്ന ക്രിയയ്ക്ക് אֶל ചേർന്നാൽ ഒരാളുടെ വാക്ക് കേൾക്കുക, അത് അനുസരിക്കുക എന്നീ അർഥനിറങ്ങൾ വരാം. ‘വാക്കു കേട്ട്’ എന്ന പ്രയോഗം ഈ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: തന്റെ അപ്പന്റെയും അമ്മയുടെയും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל എന്ന മുൻപ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകോപിത പ്രയോഗമായി നൽകിയിരിക്കുന്നു; ഇരു ബന്ധപദങ്ങളുടെയും ഉടമസ്ഥത ‘തന്റെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: പോയെന്നും
  rationale: הלך എന്ന സാധാരണ ഗമനക്രിയയ്ക്ക് ‘പോയി’ എന്നതാണ് നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ. വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്നതിനാൽ ‘എന്നും’ ഉപയോഗിച്ചു.
- source_word: פַּדֶּנָה אֲרָם
  choice: പദ്ദൻ-അരാമിലേക്കു
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു. ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന ה־ locale ‘-ലേക്കു’ എന്നതിലൂടെ പ്രതിഫലിപ്പിച്ചു.
- source_word: וַ
  choice: -ഉം / എന്നും
  rationale: വാക്യം മുമ്പുള്ള പ്രസ്താവനയുടെ തുടർച്ചയായതിനാൽ ഹീബ്രു waw-യുടെ ബന്ധകസ്വഭാവം മലയാളത്തിലെ ആശ്രിതമായ ‘എന്നും’ ഘടനയിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലവാക്യം മുൻവാക്യത്തോട് വ്യാകരണപരമായി ആശ്രിതമായതിനാൽ അവസാനത്തിൽ ‘എന്നും’ നിലനിർത്തിയിരിക്കുന്നു.
