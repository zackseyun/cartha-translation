revisions:
- from: ഏശാവ് തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൃഷ്ടിയിൽ കനാനിലെ പുത്രിമാർ ദോഷമുള്ളവരാണെന്നു കണ്ടു.[a]
  to: ഏശാവ് കനാനിലെ പുത്രിമാർ തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൃഷ്ടിയിൽ അനിഷ്ടകരമായിരുന്നെന്നു കണ്ടു.[a]
  rationale: The revision resolves the Malayalam grammatical and semantic awkwardness of ‘ദോഷമുള്ളവരാണെന്ന്.’ It preserves the Hebrew’s negative evaluative adjective without converting a context-bound paternal judgment into an explicit assertion of moral evil. The footnote retains the available lexical range and identifies the likely contextual sense without treating it as certain.
