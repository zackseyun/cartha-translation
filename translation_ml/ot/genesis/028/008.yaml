source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: ml
  text: ഏശാവ് കനാനിലെ പുത്രിമാർ തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൃഷ്ടിയിൽ അനിഷ്ടകരമായിരുന്നെന്നു കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കനാനിലെ പുത്രിമാർ തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ ദൃഷ്ടിയിൽ ചീത്തയായിരുന്നു.” ഹീബ്രായ വിശേഷണത്തിന് “ചീത്ത” എന്നോ “തിന്മയുള്ള” എന്നോ അർഥമാകാം; എന്നാൽ ഇവിടെ വിവാഹപങ്കാളികളെന്ന നിലയിൽ കനാനിലെ സ്ത്രീകളെ യിസ്ഹാക്ക് അനുകൂലമായി കണ്ടില്ല എന്ന ആശയമായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന സാധാരണ ക്രിയയുടെ ‘കണ്ടു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇതിന് ‘മനസ്സിലാക്കി’ എന്ന ആശയസൂചന സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരിന്റെ ലിപ്യന്തരണം.
- source_word: כִּי
  choice: എന്നു
  rationale: ഏശാവ് കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഘടകമായി כִּי ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: רָעוֹת
  choice: ദോഷമുള്ളവർ
  rationale: רָעוֹת എന്ന വിശേഷണത്തിന്റെ ‘ചീത്ത/ദോഷമുള്ള’ എന്ന മൂല്യനിർണയാർഥം കാത്തുസൂക്ഷിക്കുന്നു; ഇത് നിർബന്ധമായും സമ്പൂർണ ധാർമിക ദുഷ്ടതയെ സൂചിപ്പിക്കുന്നുവെന്നു വിധിക്കുന്നില്ല.
- source_word: בְּנוֹת כְּנָעַן
  choice: കനാനിലെ പുത്രിമാർ
  rationale: ‘കനാന്റെ പുത്രിമാർ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ കുടുംബ-ജനവിഭാഗ ചട്ടക്കൂട് നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: വിലയിരുത്തലിനെയോ കാഴ്ചപ്പാടിനെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ഭാഷാശൈലിക്ക് മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം.
- source_word: יִצְחָק אָבִיו
  choice: തന്റെ പിതാവായ യിസ്ഹാക്കിന്റെ
  rationale: ആരാണ് പിതാവെന്ന ബന്ധം വ്യക്തമായി രേഖപ്പെടുത്തി മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം പിന്തുടരുന്നു.
theological_decisions:
- issue: കനാനിലെ പുത്രിമാരെക്കുറിച്ചുള്ള רָעוֹת എന്ന വിലയിരുത്തലിന്റെ സ്വഭാവം
  choice: ‘ദോഷമുള്ളവർ’ എന്നു നൽകി വിലയിരുത്തൽ യിസ്ഹാക്കിന്റെ ദൃഷ്ടിയിലാണെന്ന ഘടന നിലനിർത്തി.
  alternative: ‘അനിഷ്ടരായിരുന്നു’ അല്ലെങ്കിൽ ‘തിന്മയുള്ളവരായിരുന്നു’
  rationale: ആദ്യത്തേത് മൂലപദത്തിന്റെ ശക്തി കുറയ്ക്കാം; രണ്ടാമത്തേത് സമ്പൂർണ ധാർമിക ദുഷ്ടതയെ അനാവശ്യമായി ഉറപ്പിക്കാം. ഹീബ്രായത്തിലെ വിലയിരുത്തൽഭാവവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗം ഹീബ്രായ ഭാഷാശൈലി സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘പുത്രിമാർ’ മൂലത്തിലെ ജനവിഭാഗപരമായ അവതരണം സംരക്ഷിക്കുന്നു.
