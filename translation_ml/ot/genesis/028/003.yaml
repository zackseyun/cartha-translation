id: GEN.28.3
reference: Genesis 28:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: ml
  text: സർവശക്തനായ ദൈവം നിന്നെ അനുഗ്രഹിക്കട്ടെ; നിന്നെ സന്താനസമൃദ്ധനാക്കുകയും വർധിപ്പിക്കുകയും ചെയ്യട്ടെ. അങ്ങനെ നീ ജനതകളുടെ ഒരു സമൂഹമായിത്തീരട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: സർവശക്തനായ ദൈവം
  rationale: ദൈവിക സ്ഥാനപ്പേരിനെ ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥം പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പ്രയോഗമാണിത്. എബ്രായരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְבָרֵךְ
  choice: അനുഗ്രഹിക്കട്ടെ
  rationale: അനുഗ്രഹസന്ദർഭത്തിലെ ജസ്സീവ് ഭാവം ലളിതമായ ഭാവികാലമാക്കാതെ ആശംസാ-പ്രാർഥനയായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְיַפְרְךָ
  choice: നിന്നെ സന്താനസമൃദ്ധനാക്കി
  rationale: פרה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകാർഥം നിലനിർത്തുകയും ഗോത്രപിതൃ അനുഗ്രഹത്തിന്റെ സന്താനസംബന്ധമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְיַרְבֶּךָ
  choice: വർധിപ്പിക്കുകയും
  rationale: സംഖ്യയിലും പ്രത്യേകിച്ച് സന്തതിയിലും പെരുകുക എന്ന കാരകാർഥം മുൻപദത്തോടു ചേർന്ന് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָיִיתָ
  choice: അങ്ങനെ നീ ... ആയിത്തീരട്ടെ
  rationale: മുൻ അനുഗ്രഹങ്ങളുടെ ഫലമായി വരേണ്ട അവസ്ഥയെന്ന ബന്ധവും ആശംസാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: לִקְהַל עַמִּים
  choice: ജനസമൂഹങ്ങളുടെ ഒരു സഭ
  rationale: קהל എന്നതിന്റെ സമ്മേളിത സമൂഹം എന്ന ആശയവും עמים എന്ന ബഹുവചനത്തിന്റെ പല ജനങ്ങൾ/ജനസമൂഹങ്ങൾ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֵל שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സർവശക്തനായ ദൈവം
  alternative: ഏൽ ശദ്ദായി
  rationale: ദൈവിക സ്ഥാനപ്പേര് അർത്ഥാനുവാദം ചെയ്യുന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മൂലത്തിലെ എബ്രായരൂപം അടിക്കുറിപ്പിൽ നൽകി വ്യത്യസ്തമായ ലെക്സിക്കൽ സാധ്യത മറയ്ക്കുന്നില്ല.
- issue: לִקְהַל עַמִּים എന്നതിലെ ബഹുവചനം
  choice: ജനസമൂഹങ്ങളുടെ ഒരു സഭ
  alternative: ജനതകളുടെ ഒരു സമൂഹം
  rationale: ഒന്നിലധികം peoples എന്ന മൂലാർത്ഥവും קהל എന്ന സമ്മേളിത കൂട്ടായ്മയുടെ ആശയവും നിലനിർത്തുന്നു; അതിനെ വെറും അനേകം വ്യക്തികൾ എന്നാക്കി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ അനുഗ്രഹവാക്യശൈലി. എബ്രായത്തിലെ ആശംസാഭാവം ‘ചെയ്യട്ടെ/ആയിത്തീരട്ടെ’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി; അനാവശ്യമായ സഭാവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
