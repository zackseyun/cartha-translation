  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: ml
  text: ഇതാ, ഞാൻ നിന്നോടുകൂടെയുണ്ട്. നീ എവിടെയൊക്കെ പോയാലും ഞാൻ നിന്നെ കാത്തുകൊള്ളും[a]; നിന്നെ ഈ ദേശത്തേക്കു തിരികെ കൊണ്ടുവരും. കാരണം, ഞാൻ നിന്നോടു പറഞ്ഞത്[b] ചെയ്തുതീർക്കുന്നതുവരെ നിന്നെ വിട്ടുകളയുകയില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെ കാവൽചെയ്യും.”
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിന്റെ അർഥമനുസരിച്ച് “ഞാൻ നിന്നോടു വാഗ്ദാനം ചെയ്തത്” എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായത്തിൽ അക്ഷരാർഥം “ഞാൻ നിന്നോടു പറഞ്ഞത്” എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നിന്നെ ഉപേക്ഷിക്കുകയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ദൈവിക വാക്കിന്റെ ശ്രദ്ധയാകർഷിക്കുന്നതും ഉറപ്പുനൽകുന്നതുമായ എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָנֹכִי עִמָּךְ
  choice: ഞാൻ നിന്നോടുകൂടെയുണ്ട്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും ദൈവസാന്നിധ്യത്തിന്റെ നേരിട്ടുള്ള ഉറപ്പും അതിരുകടക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וּשְׁמַרְתִּיךָ
  choice: ഞാൻ നിന്നെ കാത്തുകൊള്ളും
  rationale: שׁמר എന്ന പദത്തിലെ സംരക്ഷിക്കുക, കാവൽചെയ്യുക എന്നീ അർഥവ്യാപ്തികൾ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: നീ എവിടെയൊക്കെ പോയാലും
  rationale: യാക്കോബ് പോകുന്ന എല്ലാ ഇടങ്ങളെയും സാഹചര്യങ്ങളെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: നിന്നെ ... തിരികെ കൊണ്ടുവരും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: ഈ ദേശത്തേക്കു
  rationale: אֲדָמָה എന്നതിന് മണ്ണ് അഥവാ നിലം എന്ന അർഥവും ഉണ്ടെങ്കിലും, ഇവിടെ വാഗ്ദത്തത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പശ്ചാത്തലത്തിൽ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: לֹא אֶעֱזָבְךָ
  choice: നിന്നെ വിട്ടുകളയുകയില്ല
  rationale: עזב എന്ന പദത്തിന്റെ വിശാലമായ ‘വിടുക’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു; ‘ഉപേക്ഷിക്കുക’ സാധ്യമായ മറ്റൊരു അർഥമായി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: ചെയ്തുതീർക്കുന്നതുവരെ
  rationale: ഭാവിയിൽ പൂർത്തിയാകുന്ന പ്രവൃത്തിവരെ എന്ന എബ്രായ ഘടനയുടെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: ഞാൻ നിന്നോടു പറഞ്ഞത്
  rationale: എബ്രായത്തിൽ ഉള്ളത് ‘പറഞ്ഞത്’ എന്നതാണ്; സന്ദർഭം വാഗ്ദാനപരമാണെങ്കിലും ‘വാഗ്ദാനം ചെയ്തത്’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടിസംബന്ധിയായ ദൈവസാന്നിധ്യവും സംരക്ഷണവും
  choice: സാന്നിധ്യം, സംരക്ഷണം, തിരിച്ചുകൊണ്ടുവരൽ, പറഞ്ഞത് നിറവേറ്റൽ എന്നിവ നേരിട്ടുള്ള വാഗ്ദാനങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: പിന്നീടുള്ള ബൈബിൾപ്രയോഗങ്ങളുമായി കൂടുതൽ വ്യക്തമായ പ്രതിധ്വനി ഉണ്ടാക്കാൻ ‘ഉപേക്ഷിക്കുകയില്ല’ പോലുള്ള പരമ്പരാഗത ഭാഷ മുഖ്യവാചകത്തിൽ ഉപയോഗിക്കുക.
  rationale: വാക്യത്തിന്റെ ഉടമ്പടിസംബന്ധിയായ ഭാരം നിലനിർത്തുമ്പോഴും പിന്നീടുള്ള ദൈവശാസ്ത്രരൂപീകരണങ്ങൾ ഇതിലേക്കു ചേർക്കുന്നില്ല.
- issue: ‘പറഞ്ഞത്’ എന്നതും ‘വാഗ്ദാനം ചെയ്തത്’ എന്നതും
  choice: മുഖ്യവാചകത്തിൽ ‘പറഞ്ഞത്’ നിലനിർത്തി.
  alternative: സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘വാഗ്ദാനം ചെയ്തത്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ദൈവവചനം ഇവിടെ വാഗ്ദാനസ്വഭാവമുള്ളതാണെങ്കിലും, דִּבַּרְתִּי എന്ന ക്രിയ അക്ഷരാർഥത്തിൽ ‘ഞാൻ പറഞ്ഞു/സംസാരിച്ചു’ എന്നാണ്; ഈ വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ദൈവിക അഭിസംബോധന. ‘ഇതാ’ എന്ന അല്പം ഔപചാരികമായ പദം മൂലത്തിലെ ശ്രദ്ധയാകർഷിക്കുന്ന ഭാവം നിലനിർത്താൻ ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു.
