source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: ml
  text: യാക്കോബ് അതിരാവിലെ എഴുന്നേറ്റ്, തന്റെ തലയ്ക്കരികിൽ വെച്ചിരുന്ന കല്ല് എടുത്ത്, അതിനെ ഒരു കൽത്തൂണായി[a] സ്ഥാപിച്ചു; അതിന്റെ മുകളിൽ[b] എണ്ണ ഒഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിവർത്തി സ്ഥാപിച്ച കല്ല്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘അതിന്റെ തലയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: ക്രിയയുടെയും സമയപ്രയോഗത്തിന്റെയും ‘നേരത്തേ എഴുന്നേൽക്കുക’ എന്ന ഊന്നൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: הָאֶבֶן
  choice: കല്ല്
  rationale: നിശ്ചിത ഏകവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: താൻ തലയുടെ അടുത്തുവെച്ചിരുന്ന
  rationale: മുൻസന്ദർഭത്തിലെ ഉറക്കസ്ഥാനം സൂചിപ്പിക്കുമ്പോഴും, എബ്രായത്തിൽ വ്യക്തമല്ലാത്ത ‘തലയ്ക്കടിയിൽ’ എന്ന് അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: ഒരു കൽത്തൂണായി നാട്ടിനിർത്തി
  rationale: കല്ലിനെ നിവർത്തി സ്ഥാപിക്കുന്ന പ്രവൃത്തിയും അതിന്റെ ഫലമായ മַצֵּבָהയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַצֵּבָה
  choice: കൽത്തൂൺ
  rationale: ‘തൂൺ’ എന്നതിനെക്കാൾ വസ്തു കല്ലാണെന്ന് വ്യക്തമാക്കുകയും, ആരാധനാപരമോ സ്മാരകപരമോ ആയ ഉദ്ദേശ്യം വിവർത്തനത്തിൽ മുൻകൂട്ടി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: എണ്ണ ഒഴിച്ചു
  rationale: എബ്രായത്തിലെ പ്രവർത്തിയെ നേരിട്ട് നൽകുന്നു; ‘അഭിഷേകം ചെയ്തു’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: עַל רֹאשָׁהּ
  choice: അതിന്റെ മുകളിൽ
  rationale: അക്ഷരാർഥമായ ‘അതിന്റെ തലയിൽ’ എന്ന രൂപകത്തെ ജഡവസ്തുവിനെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മַצֵּבָהയ്ക്കും എണ്ണ ഒഴിക്കുന്ന പ്രവൃത്തിക്കും ഉണ്ടായേക്കാവുന്ന ആരാധനാപരമായ പ്രാധാന്യം
  choice: പ്രവൃത്തികളെ വിലയിരുത്താതെ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘സ്മാരകശില’ എന്നും ‘അഭിഷേകം ചെയ്തു’ എന്നും കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുക
  rationale: വാക്യം യാക്കോബിന്റെ പ്രവൃത്തി മാത്രം വിവരിക്കുന്നു. പിന്നീടുള്ള വേദഭാഗങ്ങളിലെ കൽത്തൂണുകളെക്കുറിച്ചുള്ള അനുകൂലമോ പ്രതികൂലമോ ആയ വിലയിരുത്തൽ ഇവിടെ മുൻകൂട്ടി ചുമത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാശൃംഖല മലയാളത്തിൽ സുതാര്യമായ പ്രവർത്തനക്രമമായി നൽകിയിരിക്കുന്നു; യഥാർഥമായ സ്ഥലപരവും ആരാധനാപരവുമായ അനിശ്ചിതത്വങ്ങൾ വ്യാഖ്യാനിച്ച് തീർത്തിട്ടില്ല.
