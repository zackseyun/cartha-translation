- from: യാക്കോബ് അതിരാവിലെ എഴുന്നേറ്റ്, താൻ തലയുടെ അടുത്തുവെച്ചിരുന്ന കല്ല് എടുത്ത് ഒരു കൽത്തൂണായി[a] നാട്ടിനിർത്തി; അതിന്റെ മുകളിൽ[b] എണ്ണ ഒഴിച്ചു.
  to: യാക്കോബ് അതിരാവിലെ എഴുന്നേറ്റ്, തന്റെ തലയ്ക്കരികിൽ വെച്ചിരുന്ന കല്ല് എടുത്ത്, അതിനെ ഒരു കൽത്തൂണായി[a] സ്ഥാപിച്ചു; അതിന്റെ മുകളിൽ[b] എണ്ണ ഒഴിച്ചു.
