reference: Genesis 28:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: ml
  text: അവൻ സ്വപ്നം കണ്ടു; ഇതാ, ഭൂമിയിൽ സ്ഥാപിച്ചിരുന്ന ഒരു ഏണി[a], അതിന്റെ മുകൾഭാഗം ആകാശംവരെ എത്തിയിരുന്നു; ഇതാ, ദൈവദൂതന്മാർ അതിൽ കയറുകയും ഇറങ്ങുകയും ചെയ്തുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കയറാനും ഇറങ്ങാനും ഉള്ള ഒരു ഘടന.” ഹീബ്രുപദം ഏണി എന്നതിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അവന്റെമേൽ.” എന്നാൽ സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായ സൂചന ഏണിയിലേക്കാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: അവൻ ഒരു സ്വപ്നം കണ്ടു
  rationale: ഹീബ്രു ആഖ്യാനരൂപം കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: സ്വപ്നദൃശ്യത്തെ സജീവമായി വായനക്കാരന്റെ മുമ്പിൽ അവതരിപ്പിക്കുന്ന കണികയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: סֻלָּם
  choice: കയറിപ്പോകാനുള്ള പടവ്
  rationale: ഈ അപൂർവ ഹീബ്രുപദം ഏണി മാത്രമെന്ന് നിർബന്ധിക്കുന്നില്ല; കയറാനും ഇറങ്ങാനും ഉള്ള ഒരു ഘടന എന്ന വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֻצָּב אַרְצָה
  choice: ഭൂമിയിൽ ഉറപ്പിച്ചിരുന്ന
  rationale: ഘടന ഭൂമിയിൽ സ്ഥാപിതമായി നിൽക്കുന്ന നിലയെ സൂചിപ്പിക്കുന്നു; ആകാശത്തോടുള്ള ഭൗമിക വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: അതിന്റെ മുകൾഭാഗം ആകാശത്തോളം എത്തിയിരുന്നു
  rationale: വസ്തുവിന്റെ 'തല' എന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി 'മുകൾഭാഗം' എന്നും ദിശാസൂചക രൂപം 'ആകാശത്തോളം' എന്നും നൽകുന്നു.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: ദൈവത്തിന്റെ ദൂതന്മാർ
  rationale: ദർശനസന്ദർഭത്തിൽ ദൈവിക ദൂതന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്; 'ദൂതന്മാർ' എന്നത് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും പദത്തിന്റെ ദൂതൻ/സന്ദേശവാഹകൻ എന്ന അടിസ്ഥാനാർഥത്തോട് ചേർന്നതുമാണ്.
- source_word: עֹלִים וְיֹרְדִים
  choice: കയറുകയും ഇറങ്ങുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ഹീബ്രു കൃതന്തങ്ങൾ ദൃശ്യത്തിലെ തുടരുന്ന ചലനം പ്രകടമാക്കുന്നു.
- source_word: בּוֹ
  choice: അതിലൂടെ
  rationale: അടുത്തതും സ്വാഭാവികവുമായ പൂർവപദമായ പടവിനെയാണ് പുരുഷലിംഗ ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അതിന്മേലൂടെയുള്ള സഞ്ചാരം 'അതിലൂടെ' എന്ന് സ്വാഭാവികമായി പറയുന്നു.
theological_decisions:
- issue: סֻלָּם എന്ന ദൃശ്യരൂപം
  choice: കയറിപ്പോകാനുള്ള പടവ്
  alternative: ഏണി
  rationale: ഹീബ്രുപദം പടികളുള്ള ഘടനയെയോ ഏണിയെയോ സൂചിപ്പിക്കാം; പ്രധാനവാചകത്തിൽ വിശാലമായ അർഥം നൽകി പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: בּוֹ എന്നതിന്റെ സൂചന
  choice: അതിലൂടെ (പടവിലൂടെ)
  alternative: അവന്റെമേൽ/അവനിലൂടെ
  rationale: വ്യാകരണപരമായി മറ്റൊരു സൂചന ചർച്ചചെയ്യപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഏറ്റവും അടുത്തതും സന്ദർഭത്തിൽ സ്വാഭാവികവുമായ പൂർവപദം പടവാണ്; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദൃശ്യത്തിന്റെ സജീവതയ്ക്കായി ആവർത്തിച്ചുള്ള וְהִנֵּה രണ്ടിടത്തും “ഇതാ”യായി നിലനിർത്തി; അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വവും സർവനാമസൂചനയിലെ സാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
