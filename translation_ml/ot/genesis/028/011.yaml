  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: ml
  text: അവൻ ഒരു പ്രത്യേക സ്ഥലത്തെത്തി; സൂര്യൻ അസ്തമിച്ചിരുന്നതിനാൽ അവിടെ രാത്രി തങ്ങി. ആ സ്ഥലത്തെ കല്ലുകളിൽ ഒരെണ്ണം[b] എടുത്ത് തന്റെ തലയ്ക്കരികിൽ വെച്ചു[a]; പിന്നെ ആ സ്ഥലത്ത് കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തലയ്ക്കടിയിൽ വെച്ചു” അല്ലെങ്കിൽ “തലയ്ക്ക് ചാരിടമായി വെച്ചു.” എബ്രായപദം തലയുടെ സ്ഥാനത്തെയോ തലയ്ക്കുള്ള ചാരിടത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “കല്ലുകളിൽ ഒരെണ്ണം” എന്നതിന് പകരം, “ആ സ്ഥലത്തെ ചില കല്ലുകൾ” എന്നും എബ്രായപ്രയോഗം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: ഒരു പ്രത്യേക സ്ഥലത്ത് എത്തി
  rationale: פגע എന്ന ക്രിയയ്ക്ക് ഇവിടെ യാത്രയ്ക്കിടെ ഒരു സ്ഥലത്ത് എത്തുക എന്ന അർഥമാണ്. ആദ്യ പരാമർശത്തിലാണെങ്കിലും നിർദ്ദിഷ്ടപ്രത്യയമുള്ള הַמָּקוֹם കഥയിൽ പിന്നീട് പ്രാധാന്യമാർജിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരു പ്രത്യേക സ്ഥലം’ എന്നു നൽകി.
- source_word: וַיָּלֶן שָׁם
  choice: അവിടെ രാത്രി കഴിച്ചു
  rationale: לון രാത്രി തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ ‘രാത്രി കഴിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിച്ചിരുന്നതിനാൽ
  rationale: സൂര്യനോടൊപ്പം בוא ഉപയോഗിക്കുന്നത് അസ്തമയത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; കാരണം വ്യക്തമാക്കുന്ന כִּיയും മുൻപേ പൂർത്തിയായ പ്രവൃത്തിയും മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: ആ സ്ഥലത്തെ കല്ലുകളിൽ ഒരെണ്ണം എടുത്ത്
  rationale: ബഹുവചനമായ ‘കല്ലുകൾ’ക്കൊപ്പമുള്ള partitive מִן സാധാരണയായി അവയിൽ ഒന്ന് എന്ന ആശയം നൽകുന്നു. എന്നാൽ വ്യാകരണപരമായി ചില കല്ലുകൾ എന്ന വായനയ്ക്കും സാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തി.
- source_word: מְרַאֲשֹׁתָיו
  choice: തലയുടെ ഭാഗത്ത്
  rationale: ഈ പദം തല വെക്കുന്ന ഇടത്തെയോ തലയ്ക്കരികിലെയോ സൂചിപ്പിക്കുന്നു. ‘തലയ്ക്കടിയിൽ’ എന്നു പറയുന്നത് കല്ലിന്റെ കൃത്യസ്ഥാനം അനാവശ്യമായി ഉറപ്പിക്കുന്നതിനാൽ കൂടുതൽ ഔപചാരികമായ ‘തലയുടെ ഭാഗത്ത്’ തിരഞ്ഞെടുത്തു.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്ത് കിടന്നു
  rationale: שׁכב ഇവിടെ കിടക്കുക എന്ന പ്രവൃത്തിയാണ്; ഉറങ്ങി എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ അപ്പുറം പോകും. സ്ഥലത്തിന്റെ ആവർത്തനം അതിന്റെ കഥാപരമായ പ്രാധാന്യം നിലനിർത്തുന്നു.
