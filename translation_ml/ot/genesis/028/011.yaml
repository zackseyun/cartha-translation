translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. കല്ലിന്റെ എണ്ണത്തിലും വെച്ച സ്ഥാനത്തുമുള്ള യഥാർഥ എബ്രായ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
