id: GEN.28.14
reference: Genesis 28:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: ml
  text: നിന്റെ സന്തതി ഭൂമിയിലെ പൊടിപോലെയാകും; നീ പടിഞ്ഞാറോട്ടും കിഴക്കോട്ടും വടക്കോട്ടും തെക്കോട്ടും വ്യാപിക്കും. നിന്നിലും നിന്റെ സന്തതിയിലും ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്നിലും നിന്റെ സന്തതിയിലും ഭൂമിയിലെ സകല കുടുംബങ്ങളും തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും.” എബ്രായ ക്രിയയെ പ്രത്യാവർത്തകമോ മധ്യവാചകപരമോ ആയ അർഥത്തിലും മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: നിന്റെ സന്തതി ... ആകും
  rationale: זֶרַע ഇവിടെ കൂട്ടായ ഏകവചനമായി വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ ആ കൂട്ടായ സ്വഭാവം നിലനിർത്തുകയും സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: ഭൂമിയിലെ പൊടിപോലെ
  rationale: എണ്ണമറ്റ പെരുപ്പത്തെ സൂചിപ്പിക്കുന്ന ഉപമയാണ്; הָאָרֶץ എന്നതിന്റെ വിശാലമായ അർഥം ‘ഭൂമി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּפָרַצְתָּ
  choice: നീ ... വ്യാപിക്കും
  rationale: פרץ എന്ന ക്രിയയിലെ പുറത്തേക്കു പടരുന്ന ശക്തമായ ചലനം ഭൂമിശാസ്ത്രപരമായ ഈ സന്ദർഭത്തിൽ ‘വ്യാപിക്കും’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: പടിഞ്ഞാറോട്ടും കിഴക്കോട്ടും വടക്കോട്ടും തെക്കോട്ടും
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ‘-ഓട്ട്’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു; പരമ്പരയിലെ נֶגֶב ഇവിടെ തെക്കുദിശയാണ്.
- source_word: וְנִבְרֲכוּ
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: നിഫാൽ രൂപത്തിന്റെ സ്വാഭാവികമായ കർമണി അർഥം ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ സന്ദർഭത്തിൽ നിലനിർത്തുന്നു; പ്രത്യാവർത്തക/മധ്യമ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: നിന്നിലും നിന്റെ സന്തതിയിലും
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ ‘ഇൽ’ ബന്ധം നിലനിർത്തി, ‘മുഖാന്തരം’ എന്ന വ്യാഖ്യാനാത്മക പരിഹാരം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: ഭൂമിയിലെ സകല കുടുംബങ്ങളും
  rationale: מִשְׁפְּחֹת കുടുംബ/കുല കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു; സർവലൗകിക വ്യാപ്തിയുള്ള ഈ വാഗ്ദാനത്തിൽ הָאֲדָמָה എന്നതിന് ‘ഭൂമി’ യോജിക്കുന്നു.
theological_decisions:
- issue: പിതൃപുരുഷന്മാർക്കുള്ള വാഗ്ദാനത്തിൽ നിഫാൽ രൂപമായ ברך എന്ന ക്രിയയുടെ അർഥം
  choice: ‘ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും’ എന്ന കർമണി വായന
  alternative: ‘ഭൂമിയിലെ സകല കുടുംബങ്ങളും നിന്നിലും നിന്റെ സന്തതിയിലും തങ്ങളെത്തന്നെ അനുഗ്രഹിക്കും/അനുഗ്രഹം ആശംസിക്കും’ എന്ന പ്രത്യാവർത്തക അല്ലെങ്കിൽ മധ്യമ വായന
  rationale: ഉടമ്പടി-വാഗ്ദാനത്തിന്റെ ആവർത്തിത സൂത്രവാക്യത്തിൽ കർമണി വായന നേരിട്ടതും യുക്തവുമാണ്. എങ്കിലും എബ്രായരൂപം പ്രത്യാവർത്തക/മധ്യമ അർഥത്തിനും ഇടനൽകുന്നതിനാൽ ആ യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ ദിശാക്രമവും കൂട്ടായ ‘സന്തതി’യും നിലനിർത്തി; സിദ്ധാന്തപരമായ അധികവ്യാഖ്യാനം ഒഴിവാക്കി.
