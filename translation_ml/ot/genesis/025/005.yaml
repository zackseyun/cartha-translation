  text: Abraham gave all that he had to Isaac[a].
translation:
  language: ml
  text: അബ്രാഹാം തനിക്കുണ്ടായിരുന്നതെല്ലാം യിസ്ഹാക്കിനു കൊടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘തന്റേതായിരുന്നതെല്ലാം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൊടുക്കുക’ എന്നാണ്. ആഖ്യാനത്തിലെ wayyiqtol രൂപം ഇവിടെ സ്വാഭാവികമായി ഭൂതകാലമായ ‘കൊടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാളത്തിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: אֶת
  choice: '[വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ സ്വതന്ത്രമായ പദസമാനതയില്ല, വാക്യഘടനയിൽ അതിന്റെ പ്രവർത്തനം പ്രതിഫലിക്കുന്നു.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: തനിക്കുണ്ടായിരുന്നതെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റേതായിരുന്നതെല്ലാം’ എന്ന ആശയം. ‘തനിക്കുണ്ടായിരുന്നതെല്ലാം’ ആ മുഴുവൻ വ്യാപ്തിയും നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: לְיִצְחָק
  choice: യിസ്ഹാക്കിനു
  rationale: לְ ഇവിടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-നു’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്ന כָּל എന്ന പദത്തിന്റെ ഊന്നൽ ‘എല്ലാം’ വഴി നിലനിർത്തി; കൂടുതൽ പദാനുസൃതമായ ഉടമസ്ഥതാപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
