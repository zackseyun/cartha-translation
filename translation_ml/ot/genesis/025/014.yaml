- source_word: מַשָּׂא
  choice: മസ്സാ
  rationale: ഈ വംശാവലിസന്ദർഭത്തിൽ ഇത് വ്യക്തി/ഗോത്രനാമമാണ്. സമാനരൂപമുള്ള ‘ഭാരം/അരുളപ്പാട്’ എന്ന പൊതുനാമാർത്ഥം ഇവിടെ സ്വീകരിക്കാതെ, ദ്വിത്വധ്വനിയും അവസാന ā സ്വരവും നിലനിർത്തി ലിപ്യന്തരണം ചെയ്തു.
