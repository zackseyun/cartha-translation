id: GEN.25.23
reference: Genesis 25:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: ml
  text: 'യഹ്‌വേ അവളോടു പറഞ്ഞു: “രണ്ടു ജനതകൾ നിന്റെ ഗർഭത്തിലുണ്ട്; രണ്ടു ജനവിഭാഗങ്ങൾ നിന്റെ ഉള്ളിൽനിന്നു വേർപിരിയും. ഒരു ജനവിഭാഗം മറ്റേതിനെക്കാൾ ശക്തമായിരിക്കും; മൂത്തവൻ ഇളയവനെ സേവിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലിയവൻ ചെറിയവനെ സേവിക്കും.”
    reason: മൂലഭാഷയിലെ רַב, צָעִיר എന്നീ പദങ്ങൾ ‘മൂത്തവൻ, ഇളയവൻ’ എന്നും ‘വലിയവൻ, ചെറിയവൻ’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: שְׁנֵי גיים
  choice: രണ്ടു ജനതകൾ
  rationale: രാഷ്ട്രീയ-വംശീയ സമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; സമാന്തരമായ അടുത്ത പദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: בְּבִטְנֵךְ
  choice: നിന്റെ ഗർഭത്തിൽ
  rationale: ഗർഭധാരണത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: שְׁנֵי לְאֻמִּים
  choice: രണ്ടു ജനവിഭാഗങ്ങൾ
  rationale: ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന സമാന്തരപദം; ‘ജനതകൾ’ എന്ന മുൻപദത്തിന്റെ വെറും ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് കവിതാസമാന്തര്യം സംരക്ഷിക്കുന്നു.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: നിന്റെ ഉള്ളിൽനിന്നു വേർപിരിയും
  rationale: അക്ഷരാർഥമായ ‘അന്തരാവയവങ്ങളിൽനിന്ന്’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി, വേർതിരിയുക എന്ന ക്രിയയുടെ അകർമ്മക/മധ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: ഒരു ജനവിഭാഗം മറ്റേതിനെക്കാൾ ശക്തമായിരിക്കും
  rationale: രണ്ടു ജനസമൂഹങ്ങൾ തമ്മിലുള്ള താരതമ്യവും יֶאֱמָץ എന്ന ശക്തിപ്രാപിക്കൽ/ശക്തനായിരിക്കൽ ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: רַב
  choice: മൂത്തവൻ
  rationale: ഇരട്ടമക്കളുടെ സന്ദർഭത്തിൽ ‘വലിയവൻ’ എന്നതിനെ ജനനക്രമത്തിലെ ‘മൂത്തവൻ’ എന്നു ഗ്രഹിക്കുന്നത് സ്വാഭാവികം; ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: יַעֲבֹד
  choice: സേവിക്കും
  rationale: עבד എന്ന ക്രിയയുടെ വിശാലമായ സേവന/അധീനതാഭാവം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: צָעִיר
  choice: ഇളയവനെ
  rationale: സഹോദരന്മാരുടെ ജനനക്രമസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള തുല്യപദം.
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר എന്നതിലെ പ്രായക്രമമോ സ്ഥാനവ്യത്യാസമോ
  choice: മൂത്തവൻ ഇളയവനെ സേവിക്കും
  alternative: വലിയവൻ ചെറിയവനെ സേവിക്കും
  rationale: ഇരട്ടമക്കളുടെ ഗർഭസന്ദർഭം പ്രായക്രമവായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നാൽ רַב/צָעִיר എന്നീ വിശേഷണങ്ങൾക്ക് വലുപ്പം, മഹത്ത്വം, സ്ഥാനം എന്നീ അർഥസാധ്യതകളും ഉള്ളതിനാൽ അവ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രവചനശൈലി. എബ്രായ കവിതാസമാന്തര്യം ‘ജനതകൾ/ജനവിഭാഗങ്ങൾ’ എന്ന പദവ്യത്യാസത്തിലൂടെ നിലനിർത്തി; അർഥസാധ്യതയുള്ള അവസാനവാക്യം അടിക്കുറിപ്പോടെ അവതരിപ്പിച്ചു.
