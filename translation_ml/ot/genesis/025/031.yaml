  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. כַיּוֹם എന്ന പദത്തിന്റെ ഊന്നൽ മുഖ്യവാചകത്തിൽ ‘ഇന്നുതന്നെ’ എന്നും അതിന്റെ നിയമപരമോ പ്രാബല്യപരമോ ആയ സൂക്ഷ്മത അടിക്കുറിപ്പിലും നിലനിർത്തി.
