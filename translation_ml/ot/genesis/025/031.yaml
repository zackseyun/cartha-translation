id: GEN.25.31
reference: Genesis 25:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥/ה כַ/יּ֛וֹם אֶת בְּכֹֽרָתְ/ךָ֖ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: ml
  text: 'യാക്കോബ് പറഞ്ഞു: “നിന്റെ ജ്യേഷ്ഠാവകാശം ഇന്നുതന്നെ എനിക്കു വിൽക്കുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ ജ്യേഷ്ഠാവകാശം ഇന്നുമുതൽ എനിക്കുള്ളതായി വിൽക്കുക.” ഉടൻ പ്രാബല്യത്തിൽ വരുന്ന, ബാധകമായ ഒരു ഇടപാടിനാണ് ഇവിടെ ഊന്നൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള ക്രിയാരൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പറഞ്ഞു’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: מִכְרָה
  choice: വിൽക്കുക
  rationale: מכר എന്ന ക്രിയയുടെ ആജ്ഞാരൂപമാണ്; ഇവിടെ നേരിട്ടുള്ള ആവശ്യത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַיּוֹם
  choice: ഇന്നുതന്നെ
  rationale: ഈ പ്രയോഗത്തിന് ‘ഇന്ന്’, ‘ഇന്നുമുതൽ പ്രാബല്യത്തിൽ’ എന്നീ സൂക്ഷ്മാർഥങ്ങൾ ഉണ്ടാകാം. സന്ദർഭത്തിലെ ഉടനടിയുള്ള, ബാധകമായ ഇടപാട് എന്ന ഊന്നൽ ‘ഇന്നുതന്നെ’ സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമായതിനാൽ മലയാളത്തിൽ സ്വതന്ത്ര പദം ആവശ്യമില്ല.
- source_word: בְּכֹרָתְךָ
  choice: നിന്റെ ജ്യേഷ്ഠാവകാശം
  rationale: ആദ്യജാതനായ മകന്റെ പദവിയോടു ബന്ധപ്പെട്ട അവകാശങ്ങളും ആനുകൂല്യങ്ങളും സൂചിപ്പിക്കുന്നു; ‘ജ്യേഷ്ഠാവകാശം’ സംക്ഷിപ്തവും സ്ഥാപിതവുമായ മലയാള തുല്യപദമാണ്.
- source_word: לִי
  choice: എനിക്കു
  rationale: വിൽപ്പനയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദാതൃരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
