id: GEN.25.27
reference: Genesis 25:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: ml
  text: ബാലന്മാർ വളർന്നപ്പോൾ, ഏശാവ് വേട്ടയിൽ പ്രാവീണ്യമുള്ളവനും തുറസ്സായ പ്രദേശങ്ങളിൽ ജീവിക്കുന്നവനും[a] ആയിത്തീർന്നു; യാക്കോബാകട്ടെ, കൂടാരങ്ങളിൽ പാർക്കുന്ന ശാന്തസ്വഭാവിയായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വയലിന്റെ മനുഷ്യൻ’; ഇവിടെ തുറസ്സായ പ്രദേശത്ത് ജീവിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ശാന്തസ്വഭാവി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ‘നിഷ്കളങ്കനായ,’ ‘നേരുള്ള,’ ‘ലളിതനായ,’ അല്ലെങ്കിൽ ‘സമഗ്രതയുള്ള’ എന്ന അർഥങ്ങളും സന്ദർഭാനുസരണം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: ബാലന്മാർ വളർന്നപ്പോൾ
  rationale: സന്ദർഭത്തിൽ ക്രിയ ഇരട്ടമക്കൾ പ്രായപൂർത്തിയിലേക്കു വളരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: വേട്ടയിൽ പ്രാവീണ്യമുള്ളവൻ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വേട്ട അറിയുന്ന മനുഷ്യൻ’ എന്നതിലുപരി, പ്രയോഗം വേട്ടയിലെ പരിശീലിതമായ അറിവും കഴിവും സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ שָׂדֶה
  choice: വെളിമ്പ്രദേശത്തെ മനുഷ്യൻ
  rationale: שָׂדֶה എന്നത് അടിസ്ഥാനമായി ‘വയൽ/തുറന്ന പ്രദേശം’ എന്നാണ്. ഇവിടെ കൂടാരവാസിയായ യാക്കോബിനോടുള്ള വൈരുധ്യത്തിൽ ഏശാവിന്റെ വെളിമ്പ്രദേശത്തെ ജീവിതരീതിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אִישׁ תָּם
  choice: സൗമ്യനായ മനുഷ്യൻ
  rationale: תָּם എന്ന പദത്തിന് സമഗ്രത, നിർദോഷത, നേര്, ലാളിത്യം തുടങ്ങിയ അർഥവ്യാപ്തിയുണ്ട്. ഈ സന്ദർഭത്തിലെ ജീവിതരീതി/സ്വഭാവ വൈരുധ്യം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നൽകിക്കൊണ്ട് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יֹשֵׁב אֹהָלִים
  choice: കൂടാരങ്ങളിൽ പാർക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം യാക്കോബിന്റെ പതിവായ വാസരീതിയെ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ ‘കൂടാരങ്ങൾ’ നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബിനെ വിശേഷിപ്പിക്കുന്ന תָּם എന്ന പദത്തിന്റെ അർഥം
  choice: സ്വഭാവത്തെയും ജീവിതരീതിയെയും സൂചിപ്പിക്കുന്ന ‘സൗമ്യനായ’
  alternative: ‘നിഷ്കളങ്കനായ,’ ‘നേരുള്ള,’ ‘ലളിതനായ,’ അല്ലെങ്കിൽ ‘സമഗ്രതയുള്ള’
  rationale: ഉടൻ വരുന്ന സാഹിത്യവൈരുധ്യം ഏശാവിന്റെ വേട്ടയും വെളിമ്പ്രദേശത്തെ ജീവിതവും യാക്കോബിന്റെ കൂടാരവാസവും തമ്മിലാണ്. അതിനാൽ വ്യക്തമായ ധാർമിക വിധിയായി ഒരു അർഥം മാത്രം ഉറപ്പിക്കാതെ, മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ വിവർത്തനവും അടിക്കുറിപ്പിൽ പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തിയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആയിത്തീർന്നു’ എന്നത് ഏശാവിന്റെ തൊഴിൽ-ജീവിതരീതി വികസിച്ചതിനെ സൂചിപ്പിക്കുന്നു; യാക്കോബിനെക്കുറിച്ചുള്ള സമാന്തരവാക്യത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ആയിരുന്നു’ ഉപയോഗിച്ചു. മൂലത്തിലെ വൈരുധ്യം അർധവിരാമവും ‘യാക്കോബാകട്ടെ’ എന്ന പ്രയോഗവുംകൊണ്ട് വ്യക്തമാക്കിയിരിക്കുന്നു.
