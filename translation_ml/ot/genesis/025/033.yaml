source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: ml
  text: 'യാക്കോബ് പറഞ്ഞു: “ഇന്നുതന്നെ എന്നോടു ശപഥം ചെയ്യുക.”[a] അപ്പോൾ അവൻ യാക്കോബിനോടു ശപഥം ചെയ്തു; തന്റെ ജ്യേഷ്ഠാവകാശം[b] യാക്കോബിന് വിറ്റു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇന്ന് എന്നോടു ശപഥം ചെയ്യുക,” “ഈ ദിവസം എന്നോടു ശപഥം ചെയ്യുക,” അല്ലെങ്കിൽ “ഇന്നുമുതൽ പ്രാബല്യത്തിൽ വരുന്നതായി എന്നോടു ശപഥം ചെയ്യുക.”
    reason: lexical_alternative
  - marker: b
    text: “ജ്യേഷ്ഠാവകാശം” എന്നത് ആദ്യജാതനായ മകനുള്ള അവകാശങ്ങളെയും പദവിയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: എന്നോടു സത്യം ചെയ്യുക
  rationale: ശപഥം ആവശ്യപ്പെടുന്ന ആജ്ഞാരൂപവും ശപഥം സ്വീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന לִּי എന്ന രൂപവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: כַּיּוֹם
  choice: ഇന്നുതന്നെ
  rationale: ‘ഇന്ന്,’ ‘ഈ ദിവസം,’ ‘ഇന്നുമുതൽ’ എന്നീ സാധ്യതകളുള്ള കാലസൂചനയാണ്. സന്ദർഭത്തിലെ ഉടൻ ചെയ്യണമെന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘ഇന്നുതന്നെ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥ വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: അവൻ യാക്കോബിനോടു സത്യം ചെയ്തു
  rationale: ആഖ്യാനത്തിലെ ക്രിയാക്രമവും മുമ്പത്തെ ‘സത്യം ചെയ്യുക’ എന്ന ആവശ്യവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു. സർവനാമത്തിന്റെ സൂച്യം വായനക്കാരന് വ്യക്തമാക്കാൻ ‘യാക്കോബ്’ ആവർത്തിച്ചു.
- source_word: וַיִּמְכֹּר
  choice: വിൽക്കുകയും ചെയ്തു
  rationale: מכר വിൽപ്പനയെന്ന ഇടപാടിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘കൈമാറി’ എന്ന മൃദുവായ പരാവർത്തനത്തെക്കാൾ ഇടപാടിന്റെ സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בְּכֹרָתוֹ
  choice: തന്റെ ജ്യേഷ്ഠാവകാശം
  rationale: ആദ്യജാതനായ മകനുള്ള പദവിയും അവകാശങ്ങളും സൂചിപ്പിക്കുന്ന കുടുംബ-നിയമപരമായ ആശയം ‘ജ്യേഷ്ഠാവകാശം’ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിനു
  rationale: വിൽപ്പനയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗ്ഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ഏശാവ് בְּכֹרָה കൈമാറിയതിന്റെ സ്വഭാവം
  choice: തന്റെ ജ്യേഷ്ഠാവകാശം യാക്കോബിനു വിറ്റു
  alternative: ആദ്യജാതനെന്ന നിലയിലുള്ള തന്റെ അവകാശങ്ങൾ യാക്കോബിനു വിറ്റു
  rationale: വാക്യം ആദ്യജാതാവകാശത്തിന്റെ യഥാർഥ ഇടപാടുപരമായ ഉപേക്ഷണമാണ് വിവരിക്കുന്നത്. അതിന്റെ മൂല്യത്തെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ കുടുംബ-നിയമപരമായ ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച നിലനിർത്തുമ്പോൾ അനാവശ്യമായ ശബ്ദാനുകരണം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
