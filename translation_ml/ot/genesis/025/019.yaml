id: GEN.25.19
reference: Genesis 25:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: ml
  text: 'അബ്രാഹാമിന്റെ മകനായ യിസ്ഹാക്കിന്റെ വംശവിവരം[a] ഇതാണ്: അബ്രാഹാം യിസ്ഹാക്കിന്റെ പിതാവായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തലമുറകൾ,’ ‘വംശരേഖ,’ അല്ലെങ്കിൽ ‘വിവരണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന തൊലെദോത്ത് എന്ന ഹീബ്രായപദം ഉല്പത്തിയിൽ ആവർത്തിക്കുന്ന ഒരു വിഭാഗശീർഷകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇതാണ്
  rationale: വാക്യം ഉല്പത്തിയിലെ ഒരു പുതിയ വിഭാഗം പരിചയപ്പെടുത്തുന്നു. ഹീബ്രായ സംയോജകത്തിന്റെ ആഖ്യാനബന്ധം മലയാളത്തിൽ നിർബന്ധമായി ‘ഇപ്പോൾ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ ശീർഷകവാക്യത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: תּוֹלְדֹת
  choice: തലമുറകളുടെ വിവരണം
  rationale: ഉല്പത്തിയിൽ ആവർത്തിക്കുന്ന ഘടനാപദമാണിത്; ഒരു വ്യക്തിയിൽനിന്ന് തുടർന്നുവരുന്ന വംശരേഖയെയും അതുമായി ബന്ധപ്പെട്ട വിവരണത്തെയും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്താൻ ഈ പ്രയോഗം സഹായിക്കുന്നു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഹീബ്രായ നാമരൂപത്തോട് അടുത്തതുമായ രൂപം.
- source_word: בֶּן אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ മകനായ
  rationale: ബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: הוֹלִיד
  choice: ജനിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘പിതാവായി ജനിപ്പിക്കുക’ എന്ന വംശാവലിസംബന്ധിയായ അർഥം സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉല്പത്തിയിലെ תּוֹלְדֹת എന്ന ഘടനാപദത്തിന്റെ പരിഭാഷ
  choice: തലമുറകളുടെ വിവരണം
  alternative: വംശാവലി; കുടുംബചരിത്രം; സന്തതികൾ
  rationale: തുടർന്നുള്ള ഭാഗം സന്തതിപ്പട്ടിക മാത്രമാണെന്നോ വ്യക്തിജീവചരിത്രം മാത്രമാണെന്നോ മുൻകൂട്ടി ചുരുക്കാതെ, വംശപരമ്പരയും അതിൽനിന്നു വികസിക്കുന്ന കഥാവിവരണവും ഉൾക്കൊള്ളുന്ന മൂലപദത്തിന്റെ വ്യാപ്തിയും ഉല്പത്തിയിലെ ആവർത്തിത ശീർഷകസ്വഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ശീർഷകസൂത്രത്തിന്റെ ഔപചാരികത കാത്തുസൂക്ഷിക്കുമ്പോൾ ‘തലമുറകൾ’ എന്ന ഒറ്റപദത്തിന്റെ മലയാളത്തിലെ സാധ്യതയുള്ള അസ്പഷ്ടത ‘വിവരണം’ ചേർത്ത് നിയന്ത്രിച്ചിരിക്കുന്നു.
