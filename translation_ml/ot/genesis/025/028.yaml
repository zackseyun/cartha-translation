  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ‘വായിൽ’ എന്ന ദൃശ്യപ്രയോഗം പ്രധാനവാചകത്തിൽ സാധ്യമായത്ര നിലനിർത്തുകയും അതിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു.
