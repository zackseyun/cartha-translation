  text: וַ/יֶּאֱהַ֥ב יִצְחָ֛ק אֶת עֵשָׂ֖ו כִּי צַ֣יִד בְּ/פִ֑י/ו וְ/רִבְקָ֖ה אֹהֶ֥בֶת אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: ml
  text: വേട്ടയിറച്ചി അവന്റെ വായിലുണ്ടായിരുന്നതിനാൽ യിസ്ഹാക്ക് ഏശാവിനെ സ്നേഹിച്ചു[a]; എന്നാൽ റിബെക്ക യാക്കോബിനെ സ്നേഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വേട്ടയിറച്ചി അവന്റെ വായിൽ ഉണ്ടായിരുന്നതിനാൽ.” ഏശാവ് കൊണ്ടുവന്ന വേട്ടയിറച്ചി യിസ്ഹാക്ക് ആസ്വദിച്ചിരുന്നതിനാൽ അദ്ദേഹം ഏശാവിനെ സ്നേഹിച്ചു എന്നാണ് ഈ പ്രയോഗത്തിന്റെ സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: ആഖ്യാനത്തിലെ Qal wayyiqtol ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: אֶת עֵשָׂו
  choice: ഏശാവിനെ
  rationale: നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല; വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: —കൊണ്ട്
  rationale: യിസ്ഹാക്കിന്റെ സ്നേഹത്തിനുള്ള കാരണം ഈ ഘടന വ്യക്തമാക്കുന്നു.
- source_word: צַיִד
  choice: വേട്ടയിറച്ചി
  rationale: צַיִד വേട്ടയാടി ലഭിക്കുന്ന മൃഗമാംസമോ ഭക്ഷണമോ സൂചിപ്പിക്കുന്നു; ‘മാൻമാംസം’ എന്ന് അനാവശ്യമായി ചുരുക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: בְּפִיו
  choice: തന്റെ വായിൽ രുചിച്ചു
  rationale: അക്ഷരാർഥം ‘അവന്റെ വായിൽ’ എന്നാണ്. മലയാളത്തിൽ പൂർണമായി അസ്വാഭാവികമാകാതെ ആ ദൃശ്യബിംബം നിലനിർത്താൻ ‘വായിൽ രുചിച്ചു’ എന്നു നൽകി; ഉദ്ദേശ്യം ഏശാവ് കൊണ്ടുവന്ന വേട്ടയിറച്ചി യിസ്ഹാക്ക് ആസ്വദിച്ചു എന്നതായിരിക്കാം.
- source_word: וְרִבְקָה
  choice: എന്നാൽ റിബെക്ക
  rationale: וְ അടിസ്ഥാനമായി ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും ഇവിടെ മാതാപിതാക്കളുടെ വ്യത്യസ്ത ഇഷ്ടങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാണ്; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֹהֶבֶת
  choice: സ്നേഹിച്ചു
  rationale: പങ്കാളിക്രിയ തുടരുന്നതോ സ്വഭാവസവിശേഷമായതോ ആയ സ്നേഹത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ആഖ്യാനസന്ദർഭത്തിൽ മലയാള ഭൂതകാലം സ്വാഭാവികവും മുൻവാക്യത്തോടു സമാന്തരവുമാണ്.
- source_word: אֶת יַעֲקֹב
  choice: യാക്കോബിനെ
  rationale: നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല; വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നൽകുന്നു.
