id: GEN.25.32
reference: Genesis 25:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: ml
  text: 'ഏശാവ് പറഞ്ഞു[a]: “ഇതാ, ഞാൻ മരിക്കാനിരിക്കുകയാണ്; ഈ ജ്യേഷ്ഠാവകാശം എനിക്ക് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ മരിക്കാൻ പോകുന്നു; ഈ ജ്യേഷ്ഠാവകാശംകൊണ്ട് എനിക്ക് എന്ത് പ്രയോജനം?”'
    reason: എബ്രായത്തിലെ ഹോലേക് + ക്രിയാനാമപ്രയോഗം ‘മരിക്കാൻ പോകുന്നു’ എന്നും, അവസാനത്തെ അലങ്കാരപ്രശ്നം ‘എനിക്ക് എന്ത് പ്രയോജനം?’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി തുടക്കത്തിലെ ‘എന്നിട്ട്/അപ്പോൾ’ പ്രത്യേകം ചേർത്തിട്ടില്ല.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: തുടർന്നുള്ള പ്രസ്താവനയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യാക്ഷേപത്തിന്റെ ശക്തി ആധുനികവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്രമായ ഒന്നാംപുരുഷ സർവനാമം നൽകുന്ന ഊന്നൽ സന്ദർഭവും വാക്യക്രമവും മതിയായ രീതിയിൽ വഹിക്കുന്നു.
- source_word: הוֹלֵךְ לָמוּת
  choice: മരിക്കാൻ പോകുകയാണ്
  rationale: ഒരു ഫലത്തിലേക്കുള്ള സമീപഗതിയെ സൂചിപ്പിക്കുന്ന הלך + ക്രിയാനാമരൂപം; ഇവിടെ അക്ഷരാർഥത്തിലുള്ള യാത്രയല്ല, വരാനിരിക്കുന്ന മരണമെന്ന പ്രസ്താവനയാണ്. ഈ മലയാളപ്രയോഗം അതിന്റെ സ്വാഭാവികതയും അസ്പഷ്ടതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וְלָמָּה זֶּה לִי
  choice: പിന്നെ ... എനിക്ക് എന്തിന്?
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള ഏശാവിന്റെ അലങ്കാരപ്രശ്നരൂപത്തിലുള്ള നിഗമനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘എനിക്ക് എന്ത് പ്രയോജനം?’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּכֹרָה
  choice: ജ്യേഷ്ഠാവകാശം
  rationale: ആദ്യജാതനായ മകന്റെ നിയമപരവും സാമൂഹികവുമായ സ്ഥാനവും അവകാശങ്ങളും സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദം.
theological_decisions:
- issue: താൻ മരിക്കാൻ പോകുകയാണെന്ന ഏശാവിന്റെ പ്രസ്താവനയുടെ വ്യാഖ്യാനശക്തി
  choice: അവൻ മരിക്കാൻ പോകുകയാണെന്ന പ്രസ്താവന അതേപടി നിലനിർത്തി; അത് അക്ഷരാർഥത്തിലുള്ള ആസന്നമരണമോ വിശപ്പുമൂലമുള്ള അതിശയോക്തിയോ എന്നു നിർണയിച്ചിട്ടില്ല.
  alternative: അക്ഷരാർഥത്തിലുള്ള ആസന്നമരണം; അല്ലെങ്കിൽ കടുത്ത വിശപ്പിനെക്കുറിച്ചുള്ള അതിശയോക്തിപരമായ പരാതി.
  rationale: എബ്രായപാഠം ഏശാവ് ‘മരിക്കാൻ പോകുന്നു’ എന്നു പറയുന്നതു മാത്രമേ വ്യക്തമാക്കുന്നുള്ളൂ. വിവർത്തനം ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നോക്കൂ’ സംസാരഭാവം നിലനിർത്തുന്നു; ‘ജ്യേഷ്ഠാവകാശം’ ആശയത്തിന്റെ നിയമ-സാമൂഹിക വ്യാപ്തി സംക്ഷിപ്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
