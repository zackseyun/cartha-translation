  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: ml
  text: 'കുട്ടികൾ അവളുടെ ഉള്ളിൽ തമ്മിൽ പിടഞ്ഞു. അപ്പോൾ അവൾ പറഞ്ഞു: “ഇങ്ങനെയാണെങ്കിൽ, ഞാൻ എന്തിന് ഇങ്ങനെ?”[a] തുടർന്ന് അവൾ യഹ്‌വേയോട് ചോദിച്ചറിയാൻ പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഞാൻ എന്തിന് ഇങ്ങനെയായിരിക്കുന്നു?” എബ്രായപ്രയോഗം അപൂർണ്ണമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഞാൻ എന്തിന്?” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: തമ്മിൽ പോരാടി
  rationale: ഹിത്പാഏൽ രൂപം പരസ്പരവും തീവ്രവുമായ ചലനമോ സംഘർഷമോ സൂചിപ്പിക്കുന്നു. ‘തമ്മിൽ പോരാടി’ ഗർഭസ്ഥരായ കുട്ടികളുടെ ഉള്ളിലെ സംഘർഷം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘തിക്കിത്തിരക്കി’ എന്നതിനെക്കാൾ ശക്തവും ‘പരസ്പരം ഞെരിച്ചുകളഞ്ഞു’ എന്നതിനെക്കാൾ മിതവുമാണ്.
- source_word: הַבָּנִים
  choice: കുട്ടികൾ
  rationale: בנים എന്നത് ‘പുത്രന്മാർ’ എന്നും വരാമെങ്കിലും, ജനനത്തിനു മുമ്പുള്ള ഈ സന്ദർഭത്തിൽ ‘കുട്ടികൾ’ സ്വാഭാവികമാണ്. അടുത്ത വാക്യത്തിൽ വെളിപ്പെടുന്ന അവരുടെ പുരുഷലിംഗത്തെ ഇത് നിഷേധിക്കുന്നില്ല.
- source_word: בְּקִרְבָּהּ
  choice: അവളുടെ ഉള്ളിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ അന്തർഭാഗത്ത്/ഉള്ളിൽ’ എന്നാണ്. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഗർഭപാത്രം’ എന്ന കൂടുതൽ നിർദിഷ്ട പദം ചേർക്കാതെ ശരീരത്തിനുള്ളിലെ അർഥം നിലനിർത്തുന്നു.
- source_word: אִם כֵּן
  choice: ഇങ്ങനെയാണെങ്കിൽ
  rationale: റിബെക്കയുടെ അവസ്ഥയോടുള്ള വ്യാകുല പ്രതികരണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: ഞാൻ എന്തിന് ഇങ്ങനെ?
  rationale: എബ്രായപ്രയോഗം അപൂർണ്ണവും അർഥസാധ്യതയുള്ളതുമാണ്. സന്ദർഭത്തിൽ ‘ഞാൻ എന്തിന് ഇങ്ങനെ?’ എന്നത് അവളുടെ ദുരവസ്ഥയോടുള്ള ചോദ്യം വ്യക്തമാക്കുമ്പോഴും ‘ഞാൻ എന്തിന്?’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: യഹ്‌വേയോട് ചോദിച്ചറിയാൻ
  rationale: דרש ഒരു വ്യക്തിയെ കർമമായി സ്വീകരിക്കുമ്പോൾ ദൈവിക മാർഗനിർദേശമോ അരുളപ്പാടോ തേടി അന്വേഷിക്കുക എന്ന അർഥം വരാം. ‘ചോദിച്ചറിയാൻ’ ഈ സന്ദർഭത്തിലെ പ്രത്യേകത മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നതിനു പകരം വ്യക്തിനാമം സംരക്ഷിക്കുന്നു. ‘യഹ്‌വേ’ ലഭ്യമായ ഉച്ചാരണസാക്ഷ്യത്തെ അടിസ്ഥാനമാക്കിയുള്ള സാധാരണ ലിപ്യന്തരമാണ്.
- issue: לָמָּה זֶּה אָנֹכִי എന്ന അപൂർണ്ണപ്രയോഗത്തിന്റെ അർഥം
  choice: ഞാൻ എന്തിന് ഇങ്ങനെ?
  alternative: ഞാൻ എന്തിന്?; എനിക്ക് എന്തിന് ഇത് സംഭവിക്കുന്നു?
  rationale: സന്ദർഭപരമായ അർഥം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ അസ്തിത്വപരമായോ കൂടുതൽ അക്ഷരാർഥത്തിലോ വായിക്കാവുന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ കഥനലാളിത്യം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ അപൂർണ്ണപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
