  to: 'കുട്ടികൾ അവളുടെ ഉള്ളിൽ തമ്മിൽ പിടഞ്ഞു. അപ്പോൾ അവൾ പറഞ്ഞു: “ഇങ്ങനെയാണെങ്കിൽ, ഞാൻ എന്തിന് ഇങ്ങനെ?”[a] തുടർന്ന് അവൾ യഹ്‌വേയോട് ചോദിച്ചറിയാൻ പോയി.'
