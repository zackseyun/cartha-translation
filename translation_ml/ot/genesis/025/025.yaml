id: GEN.25.25
reference: Genesis 25:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: ml
  text: ആദ്യം പുറത്തുവന്നവൻ ചുവപ്പുനിറമുള്ളവനായിരുന്നു[a]; അവന്റെ ശരീരം മുഴുവൻ രോമമേലങ്കിപോലെയായിരുന്നു[b]. അവർ അവന് ഏശാവ് എന്നു പേരിട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുവപ്പുകലർന്നവൻ’ അല്ലെങ്കിൽ ‘ചുവന്നവൻ.’ എബ്രായ വിശേഷണം ചുവപ്പുനിറമുള്ള ഒരു പ്രത്യക്ഷത്തെ വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രോമംകൊണ്ടുള്ള ഒരു വസ്ത്രംപോലെ’ അല്ലെങ്കിൽ ‘രോമമേലങ്കിപോലെ.’ എബ്രായത്തിൽ ‘മേലങ്കി’ എന്നും ‘രോമം’ എന്നും അർഥമുള്ള പദങ്ങൾ ചേർന്നുള്ള ഒരു ഉപമയാണ്.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവർ അവന്റെ പേര് ഏശാവ് എന്നു വിളിച്ചു’; ഇത് പേരിടുന്നതിനുള്ള പതിവ് പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറത്തുവന്നവൻ
  rationale: പ്രസവത്തിൽ ശിശു പുറത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ ക്രിയയുടെ മൂർത്തമായ ദൃശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָרִאשׁוֹן
  choice: ആദ്യം
  rationale: ഇരട്ടകളിൽ ജനനക്രമത്തിൽ ആദ്യനായവനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַדְמוֹנִי
  choice: ചുവപ്പുനിറമുള്ളവൻ
  rationale: ചുവപ്പുകലർന്ന ശരീരപ്രത്യക്ഷത്തെ സൂചിപ്പിക്കുന്നു; വെറും കടുംചുവപ്പ് എന്ന് അതിശയിപ്പിക്കാതെ എബ്രായ വിശേഷണത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: כֻּלּוֹ
  choice: അവന്റെ ശരീരം മുഴുവൻ
  rationale: വിവരണം ശരീരമാകെ ബാധകമാണെന്ന ഊന്നൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: രോമക്കുപ്പായംപോലെ
  rationale: אַדֶּרֶת എന്ന കുപ്പായം/മേലങ്കി രൂപകവും שֵׂעָר എന്ന രോമസൂചനയും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: അവർ അവന് ... എന്നു പേരിട്ടു
  rationale: എബ്രായത്തിലെ പതിവ് നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֵשָׂו
  choice: ഏശാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
