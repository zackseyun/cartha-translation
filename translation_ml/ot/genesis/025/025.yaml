translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ജനനദൃശ്യവും രോമക്കുപ്പായത്തിന്റെ അസാധാരണ ഉപമയും നിലനിർത്തി; നാമകരണപ്രയോഗം സ്വാഭാവിക മലയാളമാക്കി. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
