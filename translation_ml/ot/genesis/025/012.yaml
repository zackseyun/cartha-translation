  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ വംശാവലി-തലക്കെട്ട് നിലനിർത്തിയിട്ടുണ്ട്; ബന്ധിത അടിമസ്ഥാനം മൃദൂകരിച്ചിട്ടില്ല. മലയാളവാക്യത്തിലെ വ്യക്തതയ്ക്കായി ‘യിശ്മായേലിന്റെ വംശപരമ്പര’ അവസാനം ആവർത്തിച്ചിരിക്കുന്നു.
