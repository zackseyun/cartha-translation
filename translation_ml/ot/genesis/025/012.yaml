source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: ml
  text: സാറായുടെ അടിമസ്ത്രീയായ ഈജിപ്തുകാരി ഹാഗാർ അബ്രാഹാമിന് പ്രസവിച്ച, അബ്രാഹാമിന്റെ മകനായ യിശ്മായേലിന്റെ വംശപരമ്പര[a] ഇതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിശ്മായേലിന്റെ സന്തതികൾ.’ ഉല്പത്തിപ്പുസ്തകത്തിൽ ആവർത്തിച്ചുവരുന്ന തലക്കെട്ടായ תּוֹלְדוֹת (തോലെദോത്ത്) എന്ന ഹീബ്രായ പദം ‘തലമുറകൾ,’ ‘സന്തതികൾ,’ അല്ലെങ്കിൽ ‘കുടുംബവഴി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇതാണ്
  rationale: വംശാവലിയുടെ പുതിയ വിഭാഗം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഹീബ്രായിലെ וְ എന്ന ബന്ധകത്തിന്റെ ശക്തി മലയാളത്തിൽ പ്രത്യേകമായ കാലസൂചകപദം ചേർക്കാതെ സന്ദർഭത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: תֹּלְדֹת
  choice: വംശപരമ്പര
  rationale: ഉല്പത്തിപ്പുസ്തകത്തിൽ ആവർത്തിക്കുന്ന ഘടനാപരമായ തലക്കെട്ടിന്റെ വംശം/തലമുറകൾ എന്ന വിശാല അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: ഹീബ്രായ പേരിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בֶּן אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ മകനായ
  rationale: ഹീബ്രായ സംയുക്തബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יָלְדָה
  choice: പ്രസവിച്ച
  rationale: ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചനരൂപം ഹാഗാറിനെ മാതൃകർത്താവായി നിലനിർത്തുന്നു.
- source_word: הַמִּצְרִית
  choice: ഈജിപ്തുകാരി
  rationale: ഹാഗാറിന്റെ ഈജിപ്ത്യൻ ദേശീയ/വംശീയ തിരിച്ചറിയൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שִׁפְחַת שָׂרָה
  choice: സാറായുടെ അടിമസ്ത്രീയായ
  rationale: שִׁפְחָה സൂചിപ്പിക്കുന്ന ബന്ധിതവും കീഴാളവുമായ സാമൂഹിക നില ‘ദാസി’ എന്ന മൃദുവാകാവുന്ന പദത്തേക്കാൾ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְאַבְרָהָם
  choice: അബ്രാഹാമിനു
  rationale: ילד എന്ന ക്രിയയോടുകൂടിയ לְ പിതാവായ അബ്രാഹാമിനോടുള്ള പ്രസവബന്ധം സൂചിപ്പിക്കുന്നു.
