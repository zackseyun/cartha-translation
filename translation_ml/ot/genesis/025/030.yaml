  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഏശാവിന്റെ തിടുക്കം പ്രകടമാക്കാൻ മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി; മൂലത്തിൽ പറയാത്ത ഭക്ഷണനാമം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
