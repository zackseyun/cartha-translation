source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: ml
  text: 'ഏശാവ് യാക്കോബിനോടു പറഞ്ഞു: “ദയവായി ഈ ചുവന്നത്, ഈ ചുവന്നത്—കുറച്ച് എനിക്കു വിഴുങ്ങാൻ തരൂ[a]; ഞാൻ ആകെ തളർന്നിരിക്കുന്നു.” അതുകൊണ്ടാണ് അവന് ഏദോം[b] എന്നു പേരായത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഭക്ഷണത്തിന്റെ പേര് വ്യക്തമാക്കാതെ അക്ഷരാർഥത്തിൽ ‘ഈ ചുവന്നത്, ഈ ചുവന്നത്’ എന്നു പറയുന്നു. ഈ ആവർത്തനം ഏശാവിന്റെ തിടുക്കമുള്ള സംസാരത്തെ പ്രതിഫലിപ്പിക്കുന്നതാകാം. പല പരിഭാഷകളും ഇവിടെ ‘പായസം’ പോലുള്ള ഒരു ഭക്ഷണനാമം ചേർക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഏദോം’ എന്ന പേര് ‘ചുവപ്പ്’ എന്നർഥമുള്ള പദവുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു; വാക്യത്തിലെ ആവർത്തിച്ചുള്ള ‘ചുവന്നത്’ എന്ന പ്രയോഗം ഈ പദകളി നിലനിർത്തുന്നു.
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: എനിക്കു വിഴുങ്ങാൻ തരൂ
  rationale: לעט എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം സാധാരണ ‘തീറ്റുക’ എന്നതിലുപരി ആർത്തിയോടെ വിഴുങ്ങുന്ന ഭാവം നൽകുന്നു. ‘വിഴുങ്ങാൻ തരൂ’ എന്നത് ഏശാവിന്റെ തിടുക്കമുള്ള സംസാരഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָא
  choice: ദയവായി
  rationale: അഭ്യർഥനയെ സൂചിപ്പിക്കുന്ന കണികയായതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘ദയവായി’ ഉപയോഗിച്ചു.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: ഈ ചുവന്നത്, ഈ ചുവന്നത് കുറച്ച്
  rationale: എബ്രായമൂലത്തിൽ ഭക്ഷണത്തിന്റെ പേര് പറയാതെ ‘ചുവന്നത്’ എന്നു രണ്ടുതവണ ആവർത്തിക്കുന്നു. ഭക്ഷണത്തിന്റെ പേര് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ആവർത്തനവും ചൂണ്ടിക്കാണിക്കുന്ന הַזֶּה എന്ന പദത്തിന്റെ ഭാവവും സംരക്ഷിച്ചു.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: ഞാൻ ആകെ തളർന്നിരിക്കുന്നു
  rationale: עָיֵף ക്ഷീണം അഥവാ തളർച്ചയെ സൂചിപ്പിക്കുന്നു. ‘ആകെ തളർന്നിരിക്കുന്നു’ സന്ദർഭത്തിലെ തീവ്രത വ്യക്തമാക്കുകയും ബോധക്ഷയം പോലുള്ള അതിശക്തമായ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: പേരിടലിന്റെ കാരണവിവരണം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: അവന് ഏദോം എന്നു പേരായി
  rationale: എബ്രായത്തിലെ പേരിടൽസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പേരിട്ട വ്യക്തി ആരെന്ന അനിശ്ചിതത്വം നിർബന്ധമായി പരിഹരിക്കുന്നില്ല.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ‘ചുവപ്പ്’ എന്ന എബ്രായപദവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions: []
