id: GEN.25.11
reference: Genesis 25:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ മരണശേഷം ദൈവം അവന്റെ മകനായ യിസ്ഹാക്കിനെ അനുഗ്രഹിച്ചു. യിസ്ഹാക്ക് ബേർ-ലഹയ്-രോയിക്കരികെ താമസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേർ-ലഹയ്-രോയി ഒരു കിണറിന്റെ പേരാണ്; ഈ എബ്രായപേര് ഉല്പത്തി 16:14-ൽ മുമ്പ് പരാമർശിച്ചിട്ടുണ്ട്.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: സംഭവിച്ചു എന്നത് പ്രത്യേകം ആവർത്തിക്കാതെ ആഖ്യാനബന്ധത്തിലൂടെ അവതരിപ്പിച്ചു
  rationale: ഇവിടെ രൂപം തുടർന്നുള്ള ആഖ്യാനസംഭവത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘അങ്ങനെ സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് ഭാരമുള്ളതിനാൽ കാലസൂചനയോടുകൂടിയ സ്വാഭാവിക വാക്യം അതേ ആഖ്യാനപ്രവാഹം നൽകുന്നു.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ മരണശേഷം
  rationale: കാലബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: ദൈവം ... അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും אֱלֹהִים എന്ന ഏകദൈവസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: അവന്റെ മകനായ യിസ്ഹാക്കിനെ
  rationale: בְּנוֹ എന്നതിലെ സൂചകം അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബന്ധം അസന്ദിഗ്ധവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישב ഇവിടെ ഒരു സ്ഥലത്ത് വസിക്കുക എന്ന അർഥത്തിലാണ്; ‘താമസിച്ചു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עִם
  choice: അരികെ
  rationale: സ്ഥലനാമത്തിനു മുമ്പിലുള്ള עִם ഇവിടെ കൂട്ടായ്മയേക്കാൾ സാമീപ്യമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: ബേർ-ലഹയ്-രോയി
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയ കിണറിന്റെ പേരിനെ വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ശബ്ദാന്തരം ചെയ്തു.
theological_decisions:
- issue: אֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവം
  alternative: ദേവൻ / ദൈവികൻ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ പദം ഏകസത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൈവം’ സാധാരണവും മതവിഭാഗനിരപേക്ഷവുമായ മലയാളപ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘യിസ്ഹാക്ക്’ എന്ന പേരും, സ്ഥലനാമത്തിന് മൂലഭാഷയോട് അടുത്ത ശബ്ദാന്തരവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചകം അത് വിശദീകരിക്കുന്ന സ്ഥലനാമവാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തു.
