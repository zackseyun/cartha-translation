  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָקְשָׁ֣ן יָלַ֔ד אֶת שְׁבָ֖א וְ/אֶת דְּדָ֑ן וּ/בְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם וּ/לְטוּשִׁ֖ים וּ/לְאֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: ml
  text: യൊക്ഷാൻ ശേബായുടെയും ദെദാന്റെയും പിതാവായി. ദെദാന്റെ പുത്രന്മാർ അശ്ശൂരീം[a], ലെതൂശീം, ലെയുമ്മീം എന്നിവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഇവ വ്യക്തിനാമങ്ങൾക്കു പകരം വംശങ്ങളുടെയോ ഗോത്രങ്ങളുടെയോ പേരുകളായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: യൊക്ഷാൻ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിലെ പുരുഷജനനബന്ധം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ജനിപ്പിച്ചു’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകാം.
- source_word: שְׁבָא
  choice: ശേബ
  rationale: വ്യക്തി/സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: דְּדָן
  choice: ദെദാൻ
  rationale: വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനമായ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ വംശക്കാരെയോ ഗോത്രനാമങ്ങളെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: הָיוּ
  choice: ആയിരുന്നു
  rationale: പട്ടികയിലെ പേരുകളെ ദെദാന്റെ പുത്രന്മാരായി പരിചയപ്പെടുത്തുന്ന ലളിതമായ സംയോജകക്രിയ.
- source_word: אַשּׁוּרִם
  choice: അശ്ശൂരീം
  rationale: അർത്ഥം നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതെ സാധ്യതയുള്ള വംശ/ഗോത്രനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: לְטוּשִׁים
  choice: ലെത്തൂശീം
  rationale: വ്യുത്പത്തി അനിശ്ചിതമായതിനാൽ സാധ്യതയുള്ള വംശ/ഗോത്രനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: לְאֻמִּים
  choice: ലെയുമ്മീം
  rationale: ‘ജനതകൾ’ എന്ന സാധാരണനാമമായി വിവർത്തനം ചെയ്യാതെ, ഈ സന്ദർഭത്തിലെ പേരായി ലിപ്യന്തരിച്ചു.
