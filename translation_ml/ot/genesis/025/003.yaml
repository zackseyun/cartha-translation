translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. പേരുകളുടെ ലിപ്യന്തരണത്തിൽ എബ്രായധ്വനികളോടുള്ള അടുപ്പവും മലയാളത്തിലെ വായനാസൗകര്യവും തുലനം ചെയ്തു; ഉറവിടത്തിലെ വ്യക്തികൾ/വംശങ്ങൾ എന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
