    rationale: The Hebrew refers to a cooked lentil dish (נְזִיד עֲדָשִׁים), not a sweet preparation. This lexical choice materially misidentifies the food item.
  - severity: low
    issue: “നിസ്സാരമായി കണ്ടു” somewhat softens the contempt expressed by וַיִּבֶז.
    rationale: “തുച്ഛമായി കണ്ടു” is idiomatic, preserves the evaluative force of the Hebrew, and does not imply more than the source states.
