source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: ml
  text: യാക്കോബ് ഏശാവിന് അപ്പവും പരിപ്പുകറിയും[a] കൊടുത്തു. അവൻ തിന്നു, കുടിച്ചു, എഴുന്നേറ്റു, പോയി. അങ്ങനെ ഏശാവ് ജ്യേഷ്ഠാവകാശത്തെ തുച്ഛമായി കണ്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിപ്പുകൊണ്ടുള്ള കറി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജ്യേഷ്ഠാവകാശത്തെ അവജ്ഞിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: കൊടുത്തു
  rationale: സാധാരണമായ ‘കൊടുക്കുക’ എന്ന അർഥം ഈ നേരിട്ടുള്ള ആഖ്യാനസന്ദർഭത്തിന് യോജിക്കുന്നു; അധികമായ ഇടപാട്-സൂചനകളൊന്നും ചേർക്കുന്നില്ല.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: ഇവിടെ പായസത്തോടൊപ്പം പറയുന്നതിനാൽ പൊതുവായ ‘ഭക്ഷണം’ എന്നതിനെക്കാൾ മൂർത്തമായ ‘അപ്പം’ ഉചിതമാണ്.
- source_word: נְזִיד עֲדָשִׁים
  choice: പരിപ്പുപായസം
  rationale: പരിപ്പുകൊണ്ടുള്ള കട്ടിയുള്ള വേവിച്ച വിഭവത്തെയാണ് ഈ ഘടന സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവികവും പരിചിതവുമായ പ്രയോഗമാണിത്; ‘പരിപ്പുകൊണ്ടുള്ള പായസം’ എന്ന കൂടുതൽ രൂപനിഷ്ഠമായ പകരം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: അവൻ തിന്നു, കുടിച്ചു, എഴുന്നേറ്റു, പോയി
  rationale: തുടർച്ചയായ ഹീബ്രു ക്രിയകളുടെ വേഗവും ചുരുക്കവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളക്രമം.
- source_word: וַיִּבֶז
  choice: നിസ്സാരമായി കണ്ടു
  rationale: അവജ്ഞയോടെയും വിലകുറച്ചും കാണുക എന്ന ശക്തമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ രൂപനിഷ്ഠമായ ‘അവജ്ഞയോടെ കണ്ടു’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַבְּכֹרָה
  choice: തന്റെ ജ്യേഷ്ഠാവകാശം
  rationale: ആദ്യജാതനെന്ന നിലയിലെ കുടുംബ-നിയമപരമായ അവകാശത്തെ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു. സന്ദർഭത്തിൽ അത് ഏശാവിന്റേതായതിനാൽ ‘തന്റെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഏശാവ് ജ്യേഷ്ഠാവകാശത്തിന് നൽകിയ വിലയെക്കുറിച്ചുള്ള ആഖ്യാനത്തിന്റെ സമാപനവിധി
  choice: അങ്ങനെ ഏശാവ് തന്റെ ജ്യേഷ്ഠാവകാശത്തെ നിസ്സാരമായി കണ്ടു
  alternative: ഏശാവ് ജ്യേഷ്ഠാവകാശത്തെ അവജ്ഞയോടെ കണ്ടു
  rationale: അവസാനവാക്യം മുൻപ്രവൃത്തികളിൽനിന്നുള്ള ആഖ്യാനപരമായ നിഗമനവും ധാർമിക വിലയിരുത്തലും നൽകുന്നു. ‘അങ്ങനെ’ ഈ ബന്ധം നിലനിർത്തുന്നു; ‘നിസ്സാരമായി കണ്ടു’ അവകാശത്തെ വിലകുറച്ചതും അവജ്ഞയോടെ പരിഗണിച്ചതുമായ അർഥം അനാവശ്യമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ ചെറുക്രിയകളുടെ ദ്രുതലയം നിലനിർത്താൻ ‘തിന്നു, കുടിച്ചു, എഴുന്നേറ്റു, പോയി’ എന്ന സമാന്തരക്രമം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
