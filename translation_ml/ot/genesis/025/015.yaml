lexical_decisions:
- source_word: חֲדַד
  choice: ഹദദ്
  rationale: യിശ്മായേലിന്റെ പുത്രന്മാരുടെ പട്ടികയിലെ വ്യക്തിനാമം; ഹീബ്രു വ്യഞ്ജനരൂപം നേരിട്ട് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: תֵימָא
  choice: തേമാ
  rationale: വ്യക്തി/ഗോത്രനാമം; ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ദീർഘസ്വരങ്ങൾ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: יְטוּר
  choice: യെതൂർ
  rationale: വ്യക്തിനാമം; ആദ്യത്തെ യോദ് 'യെ' എന്നും അവസാനത്തെ ദീർഘ ഊ സ്വരം 'തൂർ' എന്നും പ്രതിഫലിപ്പിച്ചു.
- source_word: נָפִישׁ
  choice: നാഫീശ്
  rationale: വ്യക്തിനാമം; ഹീബ്രുവിലെ ദീർഘസ്വരങ്ങളും അവസാന ശീൻ ധ്വനിയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി.
- source_word: קֵדְמָה
  choice: കേദെമാ
  rationale: വ്യക്തിനാമം; ഹീബ്രു രൂപത്തോട് ചേർന്നും മലയാളത്തിൽ എളുപ്പം വായിക്കാവുന്ന വിധത്തിലും ലിപ്യന്തരിച്ചു.
- source_word: וְ / וָ
  choice: പട്ടികയിലെ അവസാന പേരിനു മുമ്പുള്ള കോമ
  rationale: ഹീബ്രുവിൽ ഓരോ പേരിനെയും ബന്ധിപ്പിക്കുന്ന സംയോജകങ്ങൾ ഉണ്ടെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക നാമപ്പട്ടികയിൽ കോമകൾ മതിയാകുന്നു; അർത്ഥം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു. പേരുകൾ ഇംഗ്ലീഷ് രൂപങ്ങളിൽനിന്നല്ല, ഹീബ്രു മസോററ്റിക് പാഠത്തിലെ ധ്വനിരൂപങ്ങളിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
