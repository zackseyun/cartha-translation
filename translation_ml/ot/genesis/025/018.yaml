  to: ഹവീലാ മുതൽ അശ്ശൂരിലേക്കു[a] പോകുന്ന വഴിയിൽ, ഈജിപ്തിന് എതിർവശത്തുള്ള ശൂർവരെ അവർ പാർത്തു. തന്റെ എല്ലാ സഹോദരന്മാരുടെയും എതിർവശത്ത് അവൻ പാർത്തു.[b]
