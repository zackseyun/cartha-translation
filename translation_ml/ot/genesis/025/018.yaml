  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: ml
  text: ഹവീലാ മുതൽ അശ്ശൂരിലേക്കു[a] പോകുന്ന വഴിയിൽ, ഈജിപ്തിന് എതിർവശത്തുള്ള ശൂർവരെ അവർ പാർത്തു. തന്റെ എല്ലാ സഹോദരന്മാരുടെയും എതിർവശത്ത് അവൻ പാർത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശ്ശൂർ’ എന്നത് ‘അസ്സീറിയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗത്തിന് ‘തന്റെ എല്ലാ സഹോദരന്മാരോടും എതിർത്ത് അവൻ പാർത്തു’ എന്ന അർത്ഥവും ഉണ്ടാകാം; അക്ഷരാർഥത്തിൽ, ‘തന്റെ എല്ലാ സഹോദരന്മാരുടെയും മുമ്പിൽ അവൻ വീണു’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: അവർ ... പാർത്തു
  rationale: שׁכן എന്ന ക്രിയയുടെ ബഹുവചനരൂപം ഒരു പ്രദേശത്ത് വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘പാർത്തു’ സ്വാഭാവികവും ഭൂപ്രദേശവിവരണത്തിന് യോജിച്ചതുമാണ്.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: ഹവീലാമുതൽ ... ശൂർവരെ
  rationale: ഇത് ഇശ്മായേലിന്റെ സന്തതികൾ പാർത്തിരുന്ന പ്രദേശത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള അതിർത്തിപ്രയോഗമാണ്.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: ഈജിപ്തിന് എതിർവശത്ത്
  rationale: עַל־פְּנֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘മുഖത്തിന് മുമ്പിൽ/എതിർവശത്ത്’ എന്നാണ്. ദിശ അനാവശ്യമായി നിർണയിക്കാതെ ഭൂമിശാസ്ത്രപരമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: അശ്ശൂരിലേക്കുള്ള വഴിയിലുള്ള
  rationale: ദിശാസൂചകമായ ה സഹിതമുള്ള രൂപം അശ്ശൂരിലേക്കുള്ള സഞ്ചാരദിശയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വഴിവിവരണമായി സ്വാഭാവികമാക്കുന്നു.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: തന്റെ എല്ലാ സഹോദരന്മാർക്കും എതിർവശത്ത്
  rationale: പ്രയോഗത്തിന്റെ സ്ഥലപരമായ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ശത്രുത എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: נָפָל
  choice: അവൻ പാർത്തു
  rationale: נפל സാധാരണയായി ‘വീഴുക’ എന്നാണെങ്കിലും ഇവിടെ ഇശ്മായേൽ തന്റെ ബന്ധുക്കളുടെ മുമ്പിൽ/എതിർവശത്ത് വസിച്ചതിനെ സൂചിപ്പിക്കുന്ന ശൈലീപ്രയോഗമായി മനസ്സിലാക്കാം. ഏകവചനം ഇശ്മായേലിലേക്കു വീണ്ടും ശ്രദ്ധ തിരിക്കുന്നു.
theological_decisions:
- issue: עַל־פְּנֵי כָּל־אֶחָיו נָפָל എന്ന ശൈലീപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: തന്റെ എല്ലാ സഹോദരന്മാർക്കും എതിർവശത്ത് അവൻ പാർത്തു
  alternative: തന്റെ എല്ലാ സഹോദരന്മാരോടും എതിർത്തുനിന്ന് അവൻ പാർത്തു; തന്റെ എല്ലാ സഹോദരന്മാരുടെയും മുമ്പിൽ അവൻ വീണു
  rationale: എബ്രായപ്രയോഗം സ്ഥലബന്ധമോ എതിർപ്പിന്റെ നിലപാടോ സൂചിപ്പിക്കാം; נפל എന്നതിന്റെ അക്ഷരാർഥവും ‘വീണു’ എന്നാണ്. മുഖ്യപാഠം കുറഞ്ഞ വ്യാഖ്യാനഭാരമുള്ള സ്ഥലപരമായ വായന സ്വീകരിക്കുന്നു; യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. സ്ഥലനാമങ്ങൾ ഹവീലാ, ശൂർ, അശ്ശൂർ എന്ന പ്രചാരത്തിലുള്ള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു. ആദ്യത്തെ ബഹുവചനവും അവസാനത്തെ ഏകവചനവും മൂലപാഠത്തിലെ വ്യാകരണപരമായ മാറ്റം അനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
