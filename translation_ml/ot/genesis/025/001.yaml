  language: ml
  text: അബ്രാഹാം മറ്റൊരു ഭാര്യയെ[a] വിവാഹം കഴിച്ചു; അവളുടെ പേര് കെതൂറാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അബ്രാഹാം വീണ്ടും ഒരു ഭാര്യയെ വിവാഹം കഴിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “അബ്രാഹാം കൂട്ടിച്ചേർത്തു, ഒരു ഭാര്യയെ എടുത്തു” എന്നാണ്; ഇവിടെ “കൂട്ടിച്ചേർത്തു” എന്നത് ആവർത്തനമോ അധികതയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: മറ്റൊരു
  rationale: יסף എന്ന ക്രിയയുടെ കൂട്ടിച്ചേർക്കൽ/ആവർത്തന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘മറ്റൊരു’ എന്നു പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘കൂട്ടിച്ചേർത്തു’ എന്ന അസ്വാഭാവിക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: וַיִּקַּח
  choice: സ്വീകരിച്ചു
  rationale: לקח אִשָּׁה എന്നത് ഭാര്യയെ സ്വീകരിക്കുക എന്ന വിവാഹസംബന്ധിയായ എബ്രായ പ്രയോഗമാണ്. ‘സ്വീകരിച്ചു’ എന്നത് ആ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אִשָּׁה
  choice: ഭാര്യയെ
  rationale: לקח എന്ന ക്രിയയോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ אִשָּׁה എന്നതിന് ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ എന്ന അർഥമാണ് കൃത്യം.
- source_word: וּשְׁמָהּ
  choice: അവളുടെ പേര് … എന്നായിരുന്നു
  rationale: എബ്രായത്തിലെ ലളിതമായ നാമനിർദേശ വാക്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: קְטוּרָה
  choice: കെതൂറാ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: וַיֹּסֶף എന്ന പദത്തിന്റെ കൂട്ടിച്ചേർക്കൽ/ആവർത്തന ഭാവം അബ്രാഹാം ഭാര്യയെ സ്വീകരിച്ചതുമായി എങ്ങനെ ബന്ധിപ്പിക്കണം
  choice: അബ്രാഹാം മറ്റൊരു ഭാര്യയെ സ്വീകരിച്ചു
  alternative: അബ്രാഹാം വീണ്ടും ഒരു ഭാര്യയെ സ്വീകരിച്ചു; അബ്രാഹാം കൂട്ടിച്ചേർത്ത് ഒരു ഭാര്യയെ സ്വീകരിച്ചു
  rationale: എബ്രായപാഠത്തിലെ കൂട്ടിച്ചേർക്കൽ/ആവർത്തന സൂചന ‘മറ്റൊരു ഭാര്യ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം വ്യക്തമായി നൽകുന്നു. ഇതിലൂടെ പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ചേർക്കാതെ അതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിവാഹം ചെയ്തു’ എന്ന വ്യാഖ്യാനാത്മക രൂപത്തിന് പകരം എബ്രായത്തിലെ ‘എടുത്തു/സ്വീകരിച്ചു’ എന്ന പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്ന ‘സ്വീകരിച്ചു’ ഉപയോഗിച്ചു; യഥാർഥത്തിലെ കൂട്ടിച്ചേർക്കൽ ഭാവം ‘മറ്റൊരു’ എന്നും അടിക്കുറിപ്പിലെ മറ്റൊരു വായനയിലൂടെയും സംരക്ഷിച്ചു.
