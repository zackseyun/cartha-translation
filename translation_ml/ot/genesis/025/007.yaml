translation:
  language: ml
  text: 'അബ്രാഹാം ജീവിച്ച ആയുഷ്കാലം ഇതായിരുന്നു: നൂറ്റെഴുപത്തഞ്ചു വർഷം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദശഃ: ‘അബ്രാഹാമിന്റെ ജീവന്റെ വർഷങ്ങളുടെ ദിവസങ്ങൾ, അവൻ ജീവിച്ചത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ആകെ
  rationale: ഈ വാക്യം അബ്രാഹാമിന്റെ ആയുഷ്കാലത്തെ സംഗ്രഹിക്കുന്നു. തുടക്കത്തിലെ സംയോജകവും നിർദേശകസർവനാമവും മലയാളത്തിൽ അക്ഷരാർഥമായി ആവർത്തിക്കാതെ, സംഗ്രഹഭാവം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ആകെ’ ഉപയോഗിച്ചു.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: അബ്രാഹാം ജീവിച്ച ആയുഷ്കാലം
  rationale: ‘അബ്രാഹാമിന്റെ ജീവന്റെ വർഷങ്ങളിലെ ദിവസങ്ങൾ’ എന്ന എബ്രായ നിർമാണം മുഴുവൻ ജീവിതകാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. അതിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകി; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר חָי
  choice: ജീവിച്ച
  rationale: ബന്ധവാക്യത്തിന്റെ ആവർത്തന ഊന്നൽ ചുരുക്കമായ മലയാള വിശേഷണവാക്യത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: നൂറ്റെഴുപത്തഞ്ചു വർഷം
  rationale: എബ്രായത്തിലെ 100 + 70 + 5 എന്ന കൂട്ടിച്ചേർക്കൽരീതി കൃത്യമായ ആകെ സംഖ്യയായി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
