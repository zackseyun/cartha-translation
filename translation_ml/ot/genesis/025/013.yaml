translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലിപ്പട്ടികയ്ക്കനുയോജ്യമായ ഗൗരവവും ലാളിത്യവും പാലിച്ചു. പേരുകൾ ഹീബ്രായിശബ്ദരൂപത്തെ മുൻനിർത്തി ലിപ്യന്തരിച്ചു; പട്ടിക സ്വാഭാവികമായി വായിക്കാനായി നെബായോത്തിനുശേഷം അർധവിരാമവും ‘പിന്നെ’ എന്ന ബന്ധപദവും ഉപയോഗിച്ചു.
