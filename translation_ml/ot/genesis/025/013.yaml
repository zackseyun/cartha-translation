source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: ml
  text: 'യിശ്മായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ, അവരുടെ പേരുകൾപ്രകാരം, അവരുടെ വംശപരമ്പരകൾ അനുസരിച്ച്[a], ഇവയാണ്: യിശ്മായേലിന്റെ ആദ്യജാതൻ നെബായോത്ത് ആയിരുന്നു; കേദാർ, അദ്ബെയേൽ, മിബ്സാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ തലമുറകൾപ്രകാരം.’ ഹീബ്രായിപദം വംശപരമ്പരയെയോ വംശാവലികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: ഹീബ്രായിലെ പട്ടിക-ആമുഖത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യബന്ധം മലയാളത്തിലെ പദക്രമംകൊണ്ട് വ്യക്തമാകുന്നതിനാൽ ആദിയിലെ സംയോജകം പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: യിശ്മായേലിന്റെ പുത്രന്മാരുടെ പേരുകൾ
  rationale: ഹീബ്രായിലെ ബന്ധപദശൃംഖലയുടെ അർഥവും വംശാവലി ശൈലിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בִּשְׁמֹתָם לְתוֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾപ്രകാരം
  rationale: പേരുകളുടെ പട്ടിക തലമുറകളോ വംശപരമ്പരകളോ അനുസരിച്ചുള്ളതാണെന്ന വംശാവലി ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പേരുകളെക്കുറിച്ചുള്ള ആശയം ഇതിനുമുമ്പുള്ള ‘പേരുകൾ’ എന്ന പദത്തിൽ ഇതിനകം വ്യക്തമാകുന്നു.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: യിശ്മായേലിന്റെ ആദ്യജാതൻ
  rationale: നെബായോത്ത് യിശ്മായേലിന്റെ ആദ്യപുത്രനാണെന്ന ബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: נְבָיֹת
  choice: നെബായോത്ത്
  rationale: ഹീബ്രായിപേരിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാവുന്ന ലിപ്യന്തരണം.
- source_word: קֵדָר
  choice: കേദാർ
  rationale: ഹീബ്രായിപേരിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: אַדְבְּאֵל
  choice: അദ്ബെയേൽ
  rationale: പേരിലെ വ്യഞ്ജനഘടനയും ദൈവനാമഘടകമായ ‘ഏൽ’ എന്ന അന്ത്യഭാഗവും കഴിയുന്നത്ര നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: מִבְשָׂם
  choice: മിബ്സാം
  rationale: ഹീബ്രായിപേരിന്റെ ശബ്ദരൂപം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
