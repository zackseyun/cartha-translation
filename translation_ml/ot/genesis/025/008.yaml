  to: അബ്രാഹാം നല്ല വാർധക്യത്തിൽ, വൃദ്ധനും സംതൃപ്തനുമായി[a], അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു; തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു.[b]
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ജീവിതത്തിൽ’ ഒഴിവാക്കി וְשָׂבֵעַയുടെ സംക്ഷിപ്തവും സന്ദർഭാനുയോജ്യവുമായ ‘സംതൃപ്തനുമായി’ നിലനിർത്തി. അവസാന മരണപ്രയോഗത്തിൽ നിഫാൽ കർമണിരൂപവും അതിന്റെ വ്യാഖ്യാനപരമായ അസ്പഷ്ടതയും കാത്തുസൂക്ഷിച്ചുകൊണ്ട് മലയാളം ലളിതമാക്കി. അടിക്കുറിപ്പുകൾ പരിഷ്കരിച്ച പാഠത്തോടു പൊരുത്തപ്പെടുത്തി; എല്ലാ അടിക്കുറിപ്പ് ആങ്കറുകളും നിലനിൽക്കുന്നു.
