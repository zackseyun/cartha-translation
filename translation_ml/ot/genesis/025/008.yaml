  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְוַ֨ע וַ/יָּ֧מָת אַבְרָהָ֛ם בְּ/שֵׂיבָ֥ה טוֹבָ֖ה זָקֵ֣ן וְ/שָׂבֵ֑עַ וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: ml
  text: അബ്രാഹാം നല്ല വാർധക്യത്തിൽ, വൃദ്ധനും സംതൃപ്തനുമായി[a], അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു; തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വൃദ്ധനും നിറഞ്ഞവനും’; ‘സംതൃപ്തനും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘ദിവസങ്ങൾ’ എന്ന പദം ഹീബ്രു മൂലപാഠത്തിലില്ല. ഈ പ്രയോഗം പൂർണമായ ജീവിതത്തെയോ സംതൃപ്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്നത് പരമ്പരാഗത ഹീബ്രു മരണപ്രയോഗമാണ്. മരിച്ച ബന്ധുക്കളോടുള്ള ചേർച്ചയെ ഇത് സൂചിപ്പിച്ചേക്കാം; എന്നാൽ അതിന്റെ കൃത്യമായ രീതി ഈ വാക്കുകൾ വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: അന്ത്യശ്വാസം വലിച്ചു
  rationale: മരണവിവരണങ്ങളിൽ גוע ജീവൻ വിടുന്നതിനെയോ അന്ത്യശ്വാസം വലിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. പിന്നാലെയുള്ള ‘മരിച്ചു’ എന്നതിൽനിന്ന് ഇതിനെ വേർതിരിച്ചും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന സാധാരണ മരണക്രിയയെ അലങ്കാരമോ മൃദൂകരണവുമില്ലാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: നല്ല വാർധക്യത്തിൽ
  rationale: שֵׂיבָה എന്നത് വാർധക്യത്തെയും טוֹבָה അതിന്റെ നല്ലതോ പൂർണതയുള്ളതോ ആയ അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; ഹീബ്രു ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: זָקֵן
  choice: വൃദ്ധനും
  rationale: ‘വൃദ്ധൻ’ എന്ന സ്വതന്ത്ര വിശേഷണം നിലനിർത്തി ഹീബ്രുവിലെ വിവരണങ്ങളുടെ നിര സംരക്ഷിക്കുന്നു.
- source_word: וְשָׂבֵעַ
  choice: ജീവിതത്തിൽ സംതൃപ്തനുമായി
  rationale: שָׂבֵעַ എന്നതിന് ‘നിറഞ്ഞ/മതിയായ/സംതൃപ്തനായ’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. ഇവിടെ ‘ദിവസങ്ങൾ’ മൂലപാഠത്തിലില്ലാത്തതിനാൽ അത് ചേർക്കാതെ, മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘ജീവിതത്തിൽ’ ഉപയോഗിക്കുന്നു; പൂർണജീവിതത്തിന്റെ ഭാവവും സംതൃപ്തിയുടെ സാധ്യതയും നിലനിർത്തുന്നു.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെടുകയും ചെയ്തു
  rationale: പരമ്പരാഗത ഹീബ്രു മരണപ്രയോഗത്തിന്റെ കർമണിരൂപവും അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു; അടക്കം, പൂർവികരോടുള്ള പുനഃസംഗമം, മരണാനന്തരാവസ്ഥ എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: עַמָּיו
  choice: തന്റെ ജനം
  rationale: עם എന്ന പദത്തിന്റെ സാമൂഹികവും ബന്ധുത്വപരവുമായ വിശാലത നിലനിർത്തുന്നു; ‘പൂർവികർ’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്ന മരണപ്രയോഗത്തിന്റെ അർഥം
  choice: വ്യാഖ്യാനപരമായി തീർപ്പാക്കാതെ പരമ്പരാഗത മരണപ്രയോഗമായി നിലനിർത്തി.
  alternative: കുടുംബക്കല്ലറയിൽ അടക്കപ്പെട്ടു; മരിച്ച ബന്ധുക്കളോടോ പൂർവികരോടോ ചേർന്നു; ബോധപൂർവമായ മരണാനന്തര അസ്തിത്വത്തിലേക്ക് പ്രവേശിച്ചു.
  rationale: വാക്യം ഈ സാധ്യതകളിൽ ഏതെങ്കിലും ഒന്ന് മാത്രമാണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അസ്പഷ്ടതയും വിവർത്തനത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു’ എന്ന ഇരട്ടപ്രയോഗം ഹീബ്രുവിലെ രണ്ട് വ്യത്യസ്ത ക്രിയകൾ നിലനിർത്തുന്നു. ‘ചേർക്കപ്പെടുകയും ചെയ്തു’ എന്ന കർമണിരൂപം മൂലത്തിലെ നിഫാൽ രൂപവും മരണപ്രയോഗത്തിന്റെ അസ്പഷ്ടതയും സംരക്ഷിക്കുന്നു.
