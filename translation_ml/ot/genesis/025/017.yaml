source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: ml
  text: യിശ്മായേലിന്റെ ആയുഷ്കാലം നൂറ്റിമുപ്പത്തേഴു വർഷമായിരുന്നു. അവൻ അന്ത്യശ്വാസം വലിച്ചു[a] മരിച്ചു; തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ പ്രാണൻ വിട്ടു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ തുടർന്നുള്ള ‘മരിച്ചു’ എന്ന ക്രിയയിൽനിന്ന് വ്യത്യസ്തമായതിനാൽ രണ്ടും പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്നത് മരണവിവരണങ്ങളിൽ ഉപയോഗിക്കുന്ന ഒരു എബ്രായ ശൈലിയാണ്. അത് ഒരാളുടെ പൂർവികരോടുള്ള മരണാനന്തര സംഗമത്തെയോ ബന്ധുക്കളുടെ ഇടയിലെ സംസ്കാരത്തെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: യിശ്മായേലിന്റെ ആയുഷ്കാലം ... വർഷമായിരുന്നു
  rationale: ആയുസ്സിന്റെ വർഷങ്ങൾ എണ്ണുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കഥാസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലവും നിലനിർത്തുന്നു.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: നൂറ്റിമുപ്പത്തേഴു വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമത്തെ കൃത്യമായ ആകെ സംഖ്യയായി സാധാരണ മലയാളരീതിയിൽ നൽകുന്നു.
- source_word: וַיִּגְוַע
  choice: അവൻ അന്ത്യശ്വാസം വലിച്ചു
  rationale: തുടർന്നുവരുന്ന ‘മരിച്ചു’ എന്ന ക്രിയയിൽനിന്ന് വ്യത്യസ്തമായ גוע എന്ന ക്രിയയുടെ അന്ത്യശ്വാസം വിടുക എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന രണ്ടാമത്തെ മരണക്രിയയെ ഒഴിവാക്കാതെ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെടുകയും ചെയ്തു
  rationale: എബ്രായ മരണവിവരണത്തിലെ കർമണിപ്രയോഗവും ‘തന്റെ ജനം’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു; ശവസംസ്കാരമോ മരണാനന്തര പുനഃസംഗമമോ എന്ന് തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്ന മരണപ്രയോഗത്തിന്റെ അർഥം
  choice: വ്യാഖ്യാനപരമായി തുറന്നിരിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തി.
  alternative: പൂർവികരുടെ കല്ലറയിൽ അടക്കം ചെയ്യപ്പെട്ടു; അല്ലെങ്കിൽ മരണശേഷം പൂർവികരോടു ഒന്നിച്ചു.
  rationale: ഈ പ്രയോഗം കുടുംബക്കല്ലറയിലെ സംസ്കാരത്തെയോ മരണശേഷമുള്ള പൂർവികസംഗമത്തെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കാം; മൂലപാഠം ഈ സാധ്യതകളിൽ ഒന്ന് മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ‘അന്ത്യശ്വാസം വലിച്ചു മരിച്ചു’ എന്ന ഇരട്ട ക്രിയാപ്രയോഗം മൂലപാഠത്തിലെ രണ്ട് വ്യത്യസ്ത മരണക്രിയകളെ നിലനിർത്തുന്നു; ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെട്ടു’ എന്ന ശൈലിയുടെ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
