  source_fidelity: 'മുഖ്യവാചകം എബ്രായപാഠത്തിന്റെ അർഥം വിശ്വസ്തമായി നൽകുന്നു: യിസ്ഹാക്ക് ഭാര്യയെ സംബന്ധിച്ച് യഹ്‌വെയോട് അപേക്ഷിക്കുന്നു; അവൾ വന്ധ്യയാണ്; യഹ്‌വെ അവന്റെ അപേക്ഷ സ്വീകരിക്കുന്നു; റിബെക്ക ഗർഭം ധരിക്കുന്നു. עתר ധാതുവിന്റെ ആവർത്തനം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും യുക്തമായി പ്രതിഫലിക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പ് a-യിൽ ഇല്ലാത്ത ‘ഇരുന്ന്’ എന്ന ക്രിയ ചേർത്തിട്ടുണ്ട്.'
