id: GEN.25.21
reference: Genesis 25:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: ml
  text: യിസ്ഹാക്ക് തന്റെ ഭാര്യയ്ക്കുവേണ്ടി[a] യഹ്‌വെയോട് അപേക്ഷിച്ചു; കാരണം അവൾ വന്ധ്യയായിരുന്നു. യഹ്‌വെ അവന്റെ അപേക്ഷ സ്വീകരിച്ചു[b]; അവന്റെ ഭാര്യയായ റിബെക്ക ഗർഭം ധരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തന്റെ ഭാര്യയുടെ മുമ്പിൽ/എതിർവശത്ത്’. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപ്രയോഗത്തിന് ‘മുന്നിൽ/എതിർവശത്ത്’ എന്ന അക്ഷരാർഥവും, ‘അവളെ സംബന്ധിച്ച്/അവൾക്കുവേണ്ടി’ എന്ന സന്ദർഭാർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അപേക്ഷിച്ചു’, ‘അപേക്ഷ സ്വീകരിച്ചു’ എന്നീ രണ്ടു പ്രയോഗങ്ങൾക്കും എബ്രായത്തിൽ ഒരേ ധാതുവാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: അപേക്ഷിച്ചു / അപേക്ഷ സ്വീകരിച്ചു
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേ എബ്രായ ധാതു ആവർത്തിച്ച് പ്രാർഥനയും അതിനുള്ള ദൈവിക പ്രതികരണവും തമ്മിലുള്ള ബന്ധം പ്രകടമാക്കുന്നു. മലയാളത്തിൽ ‘അപേക്ഷിച്ചു ... അപേക്ഷ സ്വീകരിച്ചു’ എന്ന പ്രയോഗം ആ ആവർത്തനത്തിന്റെ പ്രതിധ്വനി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַיהוָה / יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയ്ക്കുവേണ്ടി
  rationale: לְנֹכַח എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മുന്നിൽ/എതിർവശത്ത്’ എന്ന സ്ഥാനസൂചനയുണ്ടെങ്കിലും, ഈ പ്രാർഥനാസന്ദർഭത്തിൽ ഭാര്യയെ സംബന്ധിച്ചോ അവൾക്കുവേണ്ടിയോ അപേക്ഷിച്ചു എന്ന അർഥമാണ് മുഖ്യവാചകത്തിൽ ഏറ്റവും സ്വാഭാവികം. അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עֲקָרָה
  choice: വന്ധ്യ
  rationale: ഗർഭം ധരിക്കാൻ കഴിയാത്ത അവസ്ഥയെ സംക്ഷിപ്തമായും സന്ദർഭോചിതമായും സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: ക്രിയയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִצְחָק / רִבְקָה
  choice: യിസ്ഹാക്ക് / റിബെക്ക
  rationale: എബ്രായ നാമങ്ങളുടെ രൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവുമായ ലിപ്യന്തരണങ്ങൾ.
theological_decisions:
- issue: עתר ധാതുവിന്റെ ആവർത്തനവും ദൈവിക പ്രതികരണവും
  choice: ‘അപേക്ഷിച്ചു ... അപേക്ഷ സ്വീകരിച്ചു’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘പ്രാർഥിച്ചു ... ഉത്തരം നൽകി’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘അപേക്ഷിക്കപ്പെട്ടു’
  rationale: ദൈവത്തിന്റെ പ്രതികരണത്തെ യാന്ത്രിക ഫലമായി ചിത്രീകരിക്കാതെ, എബ്രായത്തിലെ ധാതുപുനരാവർത്തനവും അപേക്ഷ–സ്വീകരണം എന്ന പരസ്പരബന്ധവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പൊതുപദവിയാൽ പകരാതെ, സാധാരണമായി അംഗീകരിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളലിപിയിൽ അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ലളിതവും ഗൗരവമുള്ളതുമായ ആധുനിക നിലവാരമലയാളം. ‘വന്ധ്യ’ എന്ന പദം മൂലത്തിലെ അവസ്ഥ നേരിട്ട് അറിയിക്കുന്നു; അപകീർത്തിപ്പെടുത്തുന്ന അധികഭാവം ചേർക്കുന്നില്ല. എബ്രായത്തിലെ ബന്ധകശൈലി മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു.
