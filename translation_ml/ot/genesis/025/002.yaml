  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിയുടെ സംക്ഷിപ്തത നിലനിർത്തി; പേരുകൾ ഇംഗ്ലീഷ് പരമ്പരയിൽനിന്നല്ല, ഹീബ്രു രൂപങ്ങളിൽനിന്ന് നേരിട്ട് മലയാളത്തിലാക്കി.
