  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֣לֶד ל֗/וֹ אֶת זִמְרָן֙ וְ/אֶת יָקְשָׁ֔ן וְ/אֶת מְדָ֖ן וְ/אֶת מִדְיָ֑ן וְ/אֶת יִשְׁבָּ֖ק וְ/אֶת שֽׁוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/002.yaml
  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: ml
  text: അവൾ അവന് സിമ്രാൻ, യൊക്ഷാൻ, മെദാൻ, മിദ്യാൻ, യിശ്ബാക്ക്, ശൂഹ് എന്നിവരെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: അവൾ … പ്രസവിച്ചു
  rationale: ילד എന്ന ധാതുവിന്റെ Qal wayyiqtol മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചനരൂപം ഭൂതകാലത്തിലെ പ്രസവത്തെ വിവരിക്കുന്നു. വംശാവലിസന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്; മൂലത്തിൽ ഇല്ലാത്ത ‘മക്കളെ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: לוֹ
  choice: അവന്
  rationale: ילד എന്ന ക്രിയയോടുകൂടിയ לְ + പുരുഷലിംഗ ഏകവചന പ്രത്യയം കുട്ടികളുടെ പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവന് … പ്രസവിച്ചു’ എന്നത് ഈ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഓരോ പേരിനും മുമ്പുള്ള നേരിട്ടുള്ള കർമസൂചകമാണിത്; മലയാളത്തിൽ ഇതിന് പ്രത്യേക പദം ആവശ്യമില്ല.
- source_word: זִמְרָן
  choice: സിമ്രാൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יָקְשָׁן
  choice: യൊക്ഷാൻ
  rationale: വ്യക്തിനാമത്തിലെ ആദ്യ yod-ഉം നടുവിലെ qoph–shin വ്യഞ്ജനക്രമവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מְדָן
  choice: മെദാൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു സ്വര-വ്യഞ്ജനരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִדְיָן
  choice: മിദ്യാൻ
  rationale: ഹീബ്രു മִדְיָן എന്ന പേരിലെ വ്യഞ്ജനക്രമവും yod-ന്റെ ധ്വനിയും നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: יִשְׁבָּק
  choice: യിശ്ബാക്ക്
  rationale: ആദ്യ yod ഉൾപ്പെടെ ഹീബ്രു പേരിന്റെ രൂപം വ്യക്തമായി പ്രതിനിധാനം ചെയ്യുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: שׁוּחַ
  choice: ശൂഹ്
  rationale: അവസാന ח എന്ന ഘർഷധ്വനിയെ മലയാളത്തിൽ അടുത്തായി സൂചിപ്പിക്കുന്നതിനായി ‘ഹ്’ ഉപയോഗിച്ച് പേര് ലിപ്യന്തരിച്ചു.
