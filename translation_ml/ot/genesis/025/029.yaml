  text: וַ/יָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַ/יָּבֹ֥א עֵשָׂ֛ו מִן הַ/שָּׂדֶ֖ה וְ/ה֥וּא עָיֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: ml
  text: യാക്കോബ് ഒരു കറി[a] വേവിക്കുകയായിരുന്നു; ഏശാവ് വയലിൽനിന്ന് വന്നു; അവൻ ക്ഷീണിതനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിളപ്പിച്ചുണ്ടാക്കുന്ന ഒരു വിഭവം.’ എബ്രായക്രിയ പ്രത്യേകിച്ച് തിളപ്പിച്ചുള്ള പാചകത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തളർന്നിരുന്നു’ അല്ലെങ്കിൽ ‘വളരെ ക്ഷീണിച്ചിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: വേവിച്ചുകൊണ്ടിരുന്നു
  rationale: זיד ഇവിടെ തിളപ്പിച്ചു ഭക്ഷണം പാകം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. കഥയുടെ പുരോഗമിക്കുന്ന പശ്ചാത്തലപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: נָזִיד
  choice: ഒരു പായസം
  rationale: തിളപ്പിച്ചുണ്ടാക്കുന്ന കട്ടിയുള്ള വിഭവമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘പായസം’ എന്ന പദം ഈ സന്ദർഭത്തിൽ മധുരവിഭവം മാത്രമെന്നല്ല, വേവിച്ച കട്ടിയുള്ള ഭക്ഷണം എന്ന പഴയതും സാധുവുമായ അർഥത്തിലാണ്; തുടർന്നുള്ള വാക്യത്തിലെ പരിപ്പുവിഭവവുമായി ഇത് യോജിക്കുന്നു.
- source_word: וַיָּבֹא
  choice: മടങ്ങിവന്നു
  rationale: בוא എന്നത് വരുക/എത്തുക എന്നാണ്. ‘വയലിൽനിന്ന്’ എന്ന പ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ ‘മടങ്ങിവന്നു’ സ്വാഭാവികമാണ്; എങ്കിലും എബ്രായത്തിൽ മടങ്ങിവരവ് പ്രത്യേകം സൂചിപ്പിക്കുന്ന ശബ്‌ദമില്ല.
- source_word: מִן הַשָּׂדֶה
  choice: വയലിൽനിന്ന്
  rationale: שׂדה എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘വയൽ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ തുറസ്സായ പ്രദേശം എന്നും മനസ്സിലാക്കാം.
- source_word: וְהוּא עָיֵף
  choice: അവൻ വളരെ ക്ഷീണിതനായിരുന്നു
  rationale: עָיֵף ക്ഷീണം, തളർച്ച എന്നിവ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സംഭവത്തിന് പശ്ചാത്തലമാകുന്ന ശക്തമായ ക്ഷീണം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘വളരെ ക്ഷീണിതൻ’ ഉപയോഗിച്ചു.
