source:
  edition: WLC
  text: וּ/בְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָ/עֵ֨פֶר֙ וַ/חֲנֹ֔ךְ וַ/אֲבִידָ֖ע וְ/אֶלְדָּעָ֑ה כָּל אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: ml
  text: മിദ്യാന്റെ പുത്രന്മാർ ഏഫാ, ഏഫെർ, ഹാനോക്ക്, അബീദാ, എൽദാഅാ എന്നിവരായിരുന്നു. ഇവരെല്ലാവരും കെതൂറായുടെ പുത്രന്മാരായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: മിദ്യാന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ בְּנֵי എന്ന പദത്തിന്റെ പുരുഷസന്തതി എന്ന കൃത്യമായ അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപം ഉപയോഗിക്കുന്നു.
- source_word: עֵיפָה
  choice: ഏഫാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സ്വാഭാവികമായി പകർന്നു.
- source_word: עֵפֶר
  choice: ഏഫെർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: חֲנֹךְ
  choice: ഹാനോക്ക്
  rationale: എബ്രായ חֲנֹךְ എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ഇംഗ്ലീഷ് പാരമ്പര്യരൂപമായ ‘Enoch’ ആശ്രയിച്ചിട്ടില്ല.
- source_word: אֲבִידָע
  choice: അബീദാ
  rationale: വ vocalized എബ്രായ രൂപത്തിന്റെ ശബ്ദഘടന മലയാളത്തിൽ പകർന്നു.
- source_word: אֶלְדָּעָה
  choice: എൽദായാ
  rationale: അവസാന അക്ഷരഘടകവും ഉൾപ്പെടെ എബ്രായ പേരിന്റെ ശബ്ദരൂപം സംരക്ഷിക്കുന്നു.
- source_word: כָּל אֵלֶּה בְּנֵי קְטוּרָה
  choice: ഇവരെല്ലാവരും കെതൂറയുടെ പുത്രന്മാരായിരുന്നു
  rationale: പട്ടികയിലുള്ള എല്ലാവരെയും സംഗ്രഹിക്കുന്ന എബ്രായ പ്രയോഗവും ആവർത്തിക്കുന്ന വംശാവലി സൂത്രവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
