revisions:
- from: മിദ്യാന്റെ പുത്രന്മാർ ഏഫാ, ഏഫെർ, ഹാനോക്ക്, അബീദാ, എൽദായാ എന്നിവരായിരുന്നു. ഇവരെല്ലാവരും കെതൂറയുടെ പുത്രന്മാരായിരുന്നു.
  to: മിദ്യാന്റെ പുത്രന്മാർ ഏഫാ, ഏഫെർ, ഹാനോക്ക്, അബീദാ, എൽദാഅാ എന്നിവരായിരുന്നു. ഇവരെല്ലാവരും കെതൂറായുടെ പുത്രന്മാരായിരുന്നു.
