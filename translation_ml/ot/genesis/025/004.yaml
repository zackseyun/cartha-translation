translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലപാഠത്തിലെ പേരുകൾ ഇംഗ്ലീഷ് രൂപങ്ങളിൽനിന്നല്ല, എബ്രായ ശബ്ദരൂപങ്ങളിൽനിന്ന് ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലെ [a] അടയാളം ‘Ephah’ എന്ന പേരിനു പിന്നാലെ വന്നിട്ടുണ്ടെങ്കിലും അതിന്റെ കുറിപ്പ് ‘Hanoch’നെക്കുറിച്ചുള്ളതാണ്; മൂലപാഠത്തിൽ അത്തരം കുറിപ്പ് ആവശ്യപ്പെടുന്ന വ്യത്യാസമില്ലാത്തതിനാൽ പ്രസിദ്ധീകരണ കരടിൽ അത് ഉൾപ്പെടുത്തിയിട്ടില്ല.
