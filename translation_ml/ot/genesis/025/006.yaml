revisions:
- from: എന്നാൽ തന്റെ വെപ്പാട്ടികളുടെ പുത്രന്മാർക്ക് അബ്രാഹാം സമ്മാനങ്ങൾ കൊടുത്തു; താൻ ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ അവരെ തന്റെ മകനായ യിസ്ഹാക്കിൽനിന്ന് അകറ്റി, കിഴക്കോട്ട്, കിഴക്കൻ ദേശത്തേക്ക് അയച്ചു.
  to: എന്നാൽ തനിക്കുണ്ടായിരുന്ന വെപ്പാട്ടികളുടെ പുത്രന്മാർക്ക് അബ്രാഹാം സമ്മാനങ്ങൾ കൊടുത്തു; താൻ ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ തന്റെ മകനായ യിസ്ഹാക്കിൽനിന്ന് അവരെ അകറ്റി കിഴക്കോട്ട്, കിഴക്കൻ ദേശത്തേക്ക് അയച്ചു.
  rationale: The revision retains every source element while making the separation from Isaac modify the act of sending, rather than representing it as an additional action. ‘തനിക്കുണ്ടായിരുന്ന’ naturally identifies the concubines as Abraham’s without ambiguity.
