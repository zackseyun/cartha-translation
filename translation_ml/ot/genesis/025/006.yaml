id: GEN.25.6
reference: Genesis 25:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: ml
  text: എന്നാൽ തനിക്കുണ്ടായിരുന്ന വെപ്പാട്ടികളുടെ പുത്രന്മാർക്ക് അബ്രാഹാം സമ്മാനങ്ങൾ കൊടുത്തു; താൻ ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ തന്റെ മകനായ യിസ്ഹാക്കിൽനിന്ന് അവരെ അകറ്റി കിഴക്കോട്ട്, കിഴക്കൻ ദേശത്തേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: എന്നാൽ ... പുത്രന്മാർക്ക്
  rationale: മുൻവാക്യത്തിൽ യിസ്ഹാക്കിന് അവകാശം നൽകിയതുമായുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും לְ എന്ന ദാതൃബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: തന്റെ വെപ്പാട്ടികളുടെ
  rationale: പദം കുറഞ്ഞ സാമൂഹിക-വൈവാഹിക പദവിയുള്ള സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; ‘വെപ്പാട്ടികൾ’ മലയാളത്തിലെ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ തത്തുല്യമാണ്. ‘തന്റെ’ എന്നത് അബ്രാഹാമിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: נָתַן ... מַתָּנֹת
  choice: സമ്മാനങ്ങൾ കൊടുത്തു
  rationale: ക്രിയയും കർമവും നേരായും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു; അവകാശവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘സമ്മാനങ്ങൾ’ യോജിക്കുന്നു.
- source_word: וַיְשַׁלְּחֵם
  choice: അവരെ ... അയച്ചു
  rationale: തുടർന്നുള്ള מֵעַל എന്ന വേർപാടിന്റെ പ്രയോഗത്തോടൊപ്പം ചേർന്ന് അയച്ചുകളയുന്നതിന്റെയും അകറ്റുന്നതിന്റെയും അർഥം നൽകുന്നു.
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: തന്റെ മകനായ യിസ്ഹാക്കിൽനിന്ന് അകറ്റി
  rationale: מֵעַל സൂചിപ്പിക്കുന്ന യിസ്ഹാക്കിൽനിന്നുള്ള വേർപാട് ‘അകറ്റി’ എന്നതിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: താൻ ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ
  rationale: അബ്രാഹാം മരിക്കുന്നതിനുമുമ്പ് ഈ നടപടി എടുത്തുവെന്ന കാലസൂചന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: കിഴക്കോട്ട്, കിഴക്കൻ ദേശത്തേക്ക്
  rationale: ആദ്യപദത്തിലെ ദിശാസൂചനയും പിന്നത്തെ പ്രദേശസൂചനയും ആവർത്തനം മായ്ക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ‘കിഴക്കോട്ട്—കിഴക്കൻ ദേശത്തേക്ക്’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം സംരക്ഷിച്ചു; വിശദീകരണപരമായ വിഭാഗീയ ഭാഷ ഒഴിവാക്കി.
