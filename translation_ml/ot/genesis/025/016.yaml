reference: Genesis 25:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: ml
  text: ഇവർ യിശ്മായേലിന്റെ പുത്രന്മാർ; അവരുടെ വാസസ്ഥലങ്ങൾക്കും പാളയങ്ങൾക്കും അനുസരിച്ചുള്ള അവരുടെ പേരുകൾ ഇവയാണ്:[a] അവരുടെ ജനവിഭാഗങ്ങൾക്കനുസരിച്ച് പന്ത്രണ്ട് പ്രഭുക്കന്മാർ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരുടെ ഗ്രാമങ്ങളിലും പാളയങ്ങളിലും അവരുടെ പേരുകൾ ഇവയാണ്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ മുൻപ്രത്യയം സ്ഥലസൂചനയായോ, വാസസ്ഥലങ്ങളെയും പാളയങ്ങളെയും അടിസ്ഥാനമാക്കിയുള്ള പട്ടികയായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ ജനവിഭാഗങ്ങൾക്കനുസരിച്ച് പന്ത്രണ്ട് തലവന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: ഇവരാണ്
  rationale: പട്ടികയുടെ സംഗ്രഹം അവതരിപ്പിക്കുന്ന എബ്രായ നിർദ്ദേശക-സർവനാമ ഘടനയെ സ്വാഭാവികമായ മലയാള വർത്തമാനരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: യിശ്മായേലിന്റെ പുത്രന്മാർ
  rationale: മുൻവാക്യങ്ങളിൽ പേരെടുത്തുപറഞ്ഞ യിശ്മായേലിന്റെ നേരിട്ടുള്ള പുത്രന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: שְׁמֹתָם
  choice: അവരുടെ പേരുകൾ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בְּחַצְרֵיהֶם
  choice: അവരുടെ വാസസ്ഥലങ്ങളിൽ
  rationale: חָצֵר ഗ്രാമം, കുടിയിരിപ്പ്, ചുറ്റുമതിലുള്ള വാസസ്ഥലം എന്നിവ സൂചിപ്പിക്കാം. ഗോത്രപരവും ഭൂമിശാസ്ത്രപരവുമായ ഈ സന്ദർഭത്തിൽ ‘വാസസ്ഥലങ്ങൾ’ സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമാണ്.
- source_word: וּבְטִירֹתָם
  choice: പാളയങ്ങളിൽ
  rationale: טִירָה പാളയം, പാളയവാസസ്ഥലം, ചിലപ്പോൾ സംരക്ഷിത പാളയം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘പാളയങ്ങൾ’ അതിന്റെ അർധനാടോടി പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: נְשִׂיאִם
  choice: പ്രഭുക്കന്മാർ
  rationale: נָשִׂיא നേതാവ്, ഗോത്രത്തലവൻ, പ്രഭു എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. പിതൃകാല ഗോത്രസന്ദർഭത്തിലെ ഉയർന്ന പദവി സൂചിപ്പിക്കാൻ ‘പ്രഭുക്കന്മാർ’ യോജിക്കുന്നു.
- source_word: לְאֻמֹּתָם
  choice: താന്താങ്ങളുടെ ജനവിഭാഗങ്ങൾക്കനുസരിച്ച്
  rationale: אֻמָּה ഒരു ജനസമൂഹത്തെയോ വംശീയ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ജനവിഭാഗങ്ങൾ’ ‘രാജ്യങ്ങൾ’ എന്നതിലധികം സന്ദർഭോചിതവും ‘ഗോത്രങ്ങൾ’ എന്നതിലധികം മൂലപദസമീപവുമാണ്.
theological_decisions:
- issue: പന്ത്രണ്ട് נְשִׂיאִם എന്നവരുടെ പദവി
  choice: പന്ത്രണ്ട് പ്രഭുക്കന്മാർ
  alternative: പന്ത്രണ്ട് തലവന്മാർ
  rationale: വാചകം അവരുടെ രാഷ്ട്രീയഘടനയുടെ കൃത്യരൂപം നിർവചിക്കുന്നില്ല. ഉയർന്ന ഗോത്രപദവി സൂചിപ്പിക്കുന്നതോടൊപ്പം പ്രത്യേക ഭരണസംവിധാനം ആരോപിക്കാത്ത പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ സ്ഥലസൂചന പേരുകളെ എങ്ങനെ വിശേഷിപ്പിക്കുന്നു എന്ന എബ്രായത്തിലെ ചെറിയ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; അപരിചിതമായ അത്യന്തം സാങ്കേതിക ഗോത്രപദങ്ങൾ ഒഴിവാക്കി.
