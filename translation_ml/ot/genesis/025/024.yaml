  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: ml
  text: അവൾക്കു പ്രസവിക്കാനുള്ള ദിവസങ്ങൾ തികഞ്ഞപ്പോൾ, ഇതാ, അവളുടെ ഗർഭത്തിൽ ഇരട്ടക്കുട്ടികൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: അവൾക്കു പ്രസവിക്കാനുള്ള ദിവസങ്ങൾ തികഞ്ഞപ്പോൾ
  rationale: מלא എന്ന ക്രിയയും ‘അവളുടെ ദിവസങ്ങൾ’ എന്ന പ്രയോഗവും ചേർന്ന് പ്രസവകാലം പൂർത്തിയായതിനെ സൂചിപ്പിക്കുന്നു. ‘ദിവസങ്ങൾ തികഞ്ഞപ്പോൾ’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ രൂപം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: לָלֶדֶת
  choice: പ്രസവിക്കാനുള്ള
  rationale: ילד എന്ന ക്രിയയുടെ ഈ രൂപം കുട്ടിയെ പ്രസവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘പ്രസവിക്കാനുള്ള’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന അപ്രതീക്ഷിതമോ ശ്രദ്ധേയമോ ആയ വസ്തുതയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ ഊന്നൽ ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: תוֹמִם
  choice: ഇരട്ടക്കുട്ടികൾ
  rationale: ഈ ബഹുവചനനാമം ഇരട്ടകളെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ഉടൻ വ്യക്തമാകുന്നതിനാൽ ‘ഇരട്ടക്കുട്ടികൾ’ തെരഞ്ഞെടുത്തു.
- source_word: בְּבִטְנָהּ
  choice: അവളുടെ ഗർഭത്തിൽ
  rationale: בטן എന്നതിന് വയർ എന്നും ഗർഭം എന്നും അർഥമാകാം; പ്രസവസന്ദർഭത്തിൽ ‘ഗർഭത്തിൽ’ എന്നതാണ് കൃത്യവും സ്വാഭാവികവും.
