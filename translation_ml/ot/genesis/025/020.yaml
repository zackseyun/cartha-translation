translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ വംശ-സ്ഥല വിവരങ്ങൾ നിലനിർത്തിയപ്പോൾ, വിവാഹപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
