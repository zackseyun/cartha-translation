source:
  edition: WLC
  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: ml
  text: യിസ്ഹാക്ക് നാല്പതു വയസ്സുള്ളപ്പോൾ, പദ്ദൻ-അരാമിൽനിന്നുള്ള അരാമ്യനായ[b] ബെഥൂവേലിന്റെ മകളും അരാമ്യനായ ലാബാന്റെ സഹോദരിയുമായ റിബെക്കയെ ഭാര്യയായി സ്വീകരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘റിബെക്കയെ തനിക്കു ഭാര്യയായി എടുത്തപ്പോൾ’ എന്നാണ്; ഇവിടെ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമായ ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അരാമ്യൻ’ എന്നത് എബ്രായ ജനനാമത്തിന്റെ കൃത്യമായ രൂപമാണ്; ഈ വിശേഷണം ബെഥൂവേലിനും ലാബാനുമാണ് ബാധകമാകുന്നത്. ചില പഴയ പരിഭാഷകളിൽ ‘സുറിയാനി’ അല്ലെങ്കിൽ ‘സിറിയൻ’ എന്നു കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: യിസ്ഹാക്ക് നാല്പതു വയസ്സുള്ളപ്പോൾ
  rationale: പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കാലസൂചനയോടുകൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: ഭാര്യയായി സ്വീകരിച്ചു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും വിവാഹസന്ദർഭത്തിൽ ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്നതാണ് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം; לוֹയുടെ ബന്ധാർഥവും ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: רִבְקָה
  choice: റിബെക്ക
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בַּת בְּתוּאֵל
  choice: ബെഥൂവേലിന്റെ മകൾ
  rationale: വംശബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָאֲרַמִּי
  choice: അരാമ്യൻ
  rationale: എബ്രായ ജനനാമമായ אֲרַמִּיയെ ചരിത്രപരമായി കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; പഴയ ‘സുറിയാനി/സിറിയൻ’ എന്ന രൂപത്തേക്കാൾ സൂക്ഷ്മമാണ്.
- source_word: מִפַּדַּן אֲרָם
  choice: പദ്ദൻ-അരാമിൽനിന്നുള്ള
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുകയും מן എന്ന ഉറവിടസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲחוֹת לָבָן
  choice: ലാബാന്റെ സഹോദരി
  rationale: എബ്രായത്തിലെ ബന്ധസൂചന നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
