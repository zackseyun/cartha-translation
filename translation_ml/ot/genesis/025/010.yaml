  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: ml
  text: അബ്രാഹാം ഹേത്തിന്റെ പുത്രന്മാരിൽനിന്ന് വാങ്ങിയ ആ വയലിൽ അബ്രാഹാമും അവന്റെ ഭാര്യ സാറയും അടക്കം ചെയ്യപ്പെട്ടു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹേത്തിന്റെ പുത്രന്മാർ’ എന്നതിന് ‘ഹിത്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ കുടുംബബന്ധത്തെയോ വംശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നതും ഹിത്യ ജനവിഭാഗത്തെ കുറിക്കുന്നതുമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ ‘അടക്കം ചെയ്യപ്പെട്ടു’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; ക്രിയയ്ക്കു പിന്നാലെ ‘അബ്രാഹാമും അവന്റെ ഭാര്യ സാറയും’ എന്ന സംയുക്ത കർത്താവ് വരുന്നത് ഹീബ്രു വ്യാകരണത്തിൽ സാധാരണമാണ്.
    reason: source_form
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: ആ വയൽ
  rationale: നിശ്ചിതത്വമുള്ള ‘വയൽ’ എന്ന നാമം മുമ്പ് പരാമർശിച്ച ശവസംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആ വയൽ’ സ്വാഭാവികമായി ഈ മുൻസൂചന നൽകുന്നു.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם
  choice: അബ്രാഹാം ... വാങ്ങിയ
  rationale: ബന്ധവാക്യത്തിന്റെ ആശയവും ഭൂമി വിലകൊടുത്തു സ്വന്തമാക്കിയതിന്റെ വ്യാപാരപരമായ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מֵאֵת בְּנֵי חֵת
  choice: ഹേത്തിന്റെ പുത്രന്മാരിൽനിന്ന്
  rationale: ഉറവിടപാഠത്തിലെ കുടുംബ/ജനവിഭാഗ പ്രയോഗം ഔപചാരികമായി സംരക്ഷിക്കുന്നു; ‘ഹിത്യർ’ എന്ന ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שָׁמָּה
  choice: ആ വയലിൽത്തന്നെ
  rationale: ‘അവിടെ’ എന്ന സ്ഥലസൂചനയെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ മുൻപറഞ്ഞ വയലുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; ഊന്നലും നിലനിർത്തുന്നു.
- source_word: קֻבַּר
  choice: അടക്കം ചെയ്തു
  rationale: ഹീബ്രു നിഷ്ക്രിയരൂപത്തിന്റെ ശവസംസ്കാരാർഥം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സംയുക്ത കർമമായ ഇരുവർക്കും ക്രിയ ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യ സാറയെയും
  rationale: സാറയുടെ ഭാര്യബന്ധം വ്യക്തമാക്കിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം സ്വീകരിക്കുന്നു.
