translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഉറവിടത്തിലെ വിഷയം മുൻനിർത്തുന്ന ഘടന വാക്കിന് വാക്കായി പകർത്തി അസ്വാഭാവികമാക്കാതെ ‘ആ വയലിൽത്തന്നെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
