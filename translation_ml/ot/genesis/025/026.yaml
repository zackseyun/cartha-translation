  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ദൃശ്യവിവരവും കർത്തൃസന്ദിഗ്ധതയും നിലനിർത്തി; ഇരട്ടസഹോദരൻ പോലുള്ള സന്ദർഭവിവരം പദത്തിൽ ചേർത്തിട്ടില്ല.
