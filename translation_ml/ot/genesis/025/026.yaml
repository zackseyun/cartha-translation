source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֞ן יָצָ֣א אָחִ֗י/ו וְ/יָד֤/וֹ אֹחֶ֨זֶת֙ בַּ/עֲקֵ֣ב עֵשָׂ֔ו וַ/יִּקְרָ֥א שְׁמ֖/וֹ יַעֲקֹ֑ב וְ/יִצְחָ֛ק בֶּן שִׁשִּׁ֥ים שָׁנָ֖ה בְּ/לֶ֥דֶת אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: ml
  text: അതിനുശേഷം അവന്റെ സഹോദരൻ പുറത്തുവന്നു; അവന്റെ കൈ ഏശാവിന്റെ കുതികാൽ പിടിച്ചിരിക്കുകയായിരുന്നു. അതുകൊണ്ട് അവന് യാക്കോബ്[a] എന്നു പേരിട്ടു. അവർ ജനിച്ചപ്പോൾ യിസ്ഹാക്കിന് അറുപത് വയസ്സായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യാക്കോബ്” എന്ന പേര് “കുതികാൽ” എന്നർഥമുള്ള എബ്രായപദത്തോടും പിന്നീട് വഞ്ചിക്കുകയോ മറ്റൊരാളുടെ സ്ഥാനം കൈക്കലാക്കുകയോ ചെയ്യുക എന്ന ആശയത്തോടും ശബ്ദബന്ധമുള്ളതാണ്. ഏശാവിന്റെ കുതികാൽ പിടിച്ചിരുന്നുവെന്ന വിവരണവുമായി ഇത് പൊരുത്തപ്പെടുന്നു.
    reason: പേരും ‘കുതികാൽ’ എന്ന പദവും തമ്മിലുള്ള എബ്രായ ശബ്ദബന്ധവും പിന്നീടുള്ള പദപ്രയോഗവും മലയാളത്തിൽ നേരിട്ട് ദൃശ്യമല്ലാത്തതിനാൽ.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനു ശേഷം
  rationale: മുൻപറഞ്ഞ ജനനത്തിനു പിന്നാലെയുള്ള സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָצָא
  choice: പുറത്തുവന്നു
  rationale: ജനനസന്ദർഭത്തിൽ ഗർഭത്തിൽനിന്നുള്ള പുറത്തുവരവിനെ സൂചിപ്പിക്കുന്ന എബ്രായക്രിയയുടെ ദൃശ്യസ്വഭാവം നിലനിർത്തുന്നു; ‘ജനിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אָחִיו
  choice: അവന്റെ സഹോദരൻ
  rationale: എബ്രായത്തിൽ ‘സഹോദരൻ’ മാത്രമാണ് ഉള്ളത്; സന്ദർഭത്തിൽ ഇരട്ടകളാണെങ്കിലും ആ വിവരം ഈ പദത്തിലേക്ക് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: അവന്റെ കൈ ... പിടിച്ചിരിക്കുകയായിരുന്നു
  rationale: പുറത്തുവരുമ്പോൾ തുടരുന്ന നിലയായി കൈ കുതികാൽ പിടിച്ചിരുന്നതിനെ പങ്കാളിക്രിയയുടെ ഭാവത്തോടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: ഏശാവിന്റെ കുതികാൽ
  rationale: ബന്ധഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: അതുകൊണ്ട് അവന് ... എന്നു പേരിട്ടു
  rationale: പേരിടലും കുതികാൽ പിടിച്ചതും തമ്മിലുള്ള കഥാപരമായ ബന്ധം വ്യക്തമാക്കുന്നു; കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃരഹിത പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം നിലനിർത്തുന്നു; കുതികാൽ സംബന്ധിച്ച ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: അറുപത് വയസ്സായിരുന്നു
  rationale: എബ്രായത്തിലെ പ്രായസൂചനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּלֶדֶת אֹתָם
  choice: അവർ ജനിച്ചപ്പോൾ
  rationale: എബ്രായത്തിൽ വ്യക്തമാക്കാത്ത പ്രസവകർത്താവിനെ കൂട്ടിച്ചേർക്കാതെ സമയബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
