id: GEN.25.9
reference: Genesis 25:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְבְּר֨וּ אֹת֜/וֹ יִצְחָ֤ק וְ/יִשְׁמָעֵאל֙ בָּנָ֔י/ו אֶל מְעָרַ֖ת הַ/מַּכְפֵּלָ֑ה אֶל שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן צֹ֨חַר֙ הַֽ/חִתִּ֔י אֲשֶׁ֖ר עַל פְּנֵ֥י מַמְרֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: ml
  text: അവന്റെ പുത്രന്മാരായ യിസ്ഹാക്കും യിശ്മായേലും അവനെ മമ്രേയ്ക്ക് എതിരെയുള്ള, സോഹറിന്റെ മകനായ ഹിത്യനായ എഫ്രോന്റെ വയലിലുള്ള മക്പേലാ ഗുഹയിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: ചേർന്ന് അവനെ ... അടക്കം ചെയ്തു
  rationale: വയീഖ്തോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. രണ്ട് കർത്താക്കളുടെ സംയുക്ത പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ചേർന്ന്’ ഉപയോഗിച്ചു; אֹתוֹ മുൻവാക്യത്തിലെ അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: അവന്റെ പുത്രന്മാരായ യിസ്ഹാക്കും യിശ്മായേലും
  rationale: בָּנָיו എന്നത് അബ്രാഹാമിന്റെ പുത്രന്മാർ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു; പേരുകൾക്കുമുമ്പുള്ള ഈ ഘടന മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: മക്പേലാ ഗുഹയിൽ
  rationale: אֶל സാധാരണയായി ‘ലേക്ക്’ എന്നർഥം നൽകുമെങ്കിലും, അടക്കത്തിന്റെ സന്ദർഭത്തിൽ സ്ഥലം സൂചിപ്പിക്കുന്ന ‘ഗുഹയിൽ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്. മക്പേലാ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: എഫ്രോന്റെ വയലിലുള്ള
  rationale: രണ്ടാമത്തെ אֶל അടക്കസ്ഥലത്തെ കൂടുതൽ നിർവചിക്കുന്നു. ഗുഹ വയലിനുള്ളിലാണെന്ന സ്ഥലബന്ധം മലയാളത്തിൽ ബന്ധകൃതന്തം ഉപയോഗിച്ച് വ്യക്തമാക്കി.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: ഹിത്യനായ സോഹറിന്റെ മകൻ
  rationale: בן എന്ന വംശബന്ധവും הַחִתִּי എന്ന ജനവിഭാഗസൂചനയും മലയാളത്തിലെ സ്വാഭാവിക നാമഘടനയിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: മമ്രേയ്ക്ക് എതിരെയുള്ള
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിൽ עַל־פְּנֵי ‘എതിരെ’, ‘മുന്നിൽ’, ‘അഭിമുഖമായി’ എന്നീ അർഥങ്ങൾ നൽകാം. പ്രധാന പാഠത്തിൽ ‘എതിരെയുള്ള’ തിരഞ്ഞെടുത്തു; ദിശ അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
