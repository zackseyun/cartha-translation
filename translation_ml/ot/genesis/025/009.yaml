translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. വ്യക്തി-സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി; മൂലത്തിലെ സ്ഥലവിവരണത്തിന്റെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
