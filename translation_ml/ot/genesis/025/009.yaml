revisions:
- from: അവന്റെ പുത്രന്മാരായ യിസ്ഹാക്കും യിശ്മായേലും ചേർന്ന് അവനെ മമ്രേയ്ക്ക് എതിരെയുള്ള[a], ഹിത്യനായ സോഹറിന്റെ മകൻ എഫ്രോന്റെ വയലിലുള്ള മക്പേലാ ഗുഹയിൽ അടക്കം ചെയ്തു.
  to: അവന്റെ പുത്രന്മാരായ യിസ്ഹാക്കും യിശ്മായേലും അവനെ മമ്രേയ്ക്ക് എതിരെയുള്ള, സോഹറിന്റെ മകനായ ഹിത്യനായ എഫ്രോന്റെ വയലിലുള്ള മക്പേലാ ഗുഹയിൽ അടക്കം ചെയ്തു.
  rationale: The revision assigns ‘the Hittite’ to Ephron, as required by the Hebrew grammar, and orders the modifiers so that ‘opposite Mamre’ clearly describes Ephron’s field. It also removes the nonessential added adverb ‘ചേർന്ന്.’
