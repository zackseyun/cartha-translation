source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: ml
  text: ജനങ്ങളെയാകട്ടെ[a], ഈജിപ്തുദേശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേയറ്റംവരെ അവൻ അവരെ പട്ടണങ്ങളിലേക്കു മാറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരെ പട്ടണങ്ങളിലേക്കു മാറ്റി” എന്നും പരിഭാഷപ്പെടുത്താം. ചില പരിഭാഷകൾ വ്യത്യസ്തമായ പാഠധാരണയെ പിന്തുടർന്ന് യോസേഫ് ജനങ്ങളെ ദാസന്മാരാക്കി എന്ന് വിവർത്തനം ചെയ്യുന്നു; എന്നാൽ ഇവിടത്തെ എബ്രായപാഠം കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നത് അവരുടെ സ്ഥലംമാറ്റമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: ജനങ്ങൾ
  rationale: ഈജിപ്തിലെ ബാധിതരായ ജനസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: അവൻ മാറ്റിപ്പാർപ്പിച്ചു
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്കു നീക്കുകയോ മാറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആളുകളെ സംബന്ധിച്ചിടത്തോളം ‘മാറ്റിപ്പാർപ്പിച്ചു’ എന്നത് നിർബന്ധിത സ്ഥലംമാറ്റത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അടിമകളാക്കി എന്ന ആശയം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: לֶעָרִים
  choice: പട്ടണങ്ങളിലേക്കു
  rationale: ל എന്ന ഉപസർഗത്തെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതായി എടുത്തു. ‘പട്ടണങ്ങളിലേക്കു’ എന്നത് മൂലപാഠത്തോട് അടുത്തതും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: ഈജിപ്തിന്റെ ഭൂപ്രദേശത്തിന്റെ ഒരറ്റംമുതൽ മറ്റേയറ്റംവരെ
  rationale: גְבוּל ഇവിടെ അതിർത്തിരേഖയെക്കാൾ ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘ഒരറ്റംമുതൽ മറ്റേയറ്റംവരെ’ എന്ന പ്രയോഗം രാജ്യവ്യാപകമായ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈജിപ്തിലെ ജനങ്ങളോടുള്ള യോസേഫിന്റെ നടപടിയുടെ സ്വഭാവം
  choice: അവൻ അവരെ പട്ടണങ്ങളിലേക്കു മാറ്റിപ്പാർപ്പിച്ചു
  alternative: അവൻ അവരെ ദാസന്മാരാക്കി
  rationale: മസോറെറ്റിക് എബ്രായ പാഠം നേരിട്ട് പറയുന്നത് ജനങ്ങളുടെ സ്ഥലംമാറ്റമാണ്; ദാസ്യത്തിലാക്കൽ ഈ വാക്യത്തിന്റെ പദപ്രയോഗത്തിൽ വ്യക്തമല്ല. അതിനാൽ വ്യത്യസ്ത പാഠവായനയെ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ജനങ്ങളെയാകട്ടെ’ എന്ന വിഷയസൂചകപ്രയോഗം എബ്രായത്തിലെ മുന്നോട്ടുവച്ച കർമ്മത്തെ പ്രതിഫലിപ്പിക്കുന്നു; ‘അവൻ’ എന്നത് സന്ദർഭത്തിൽ യോസേഫിനെ സൂചിപ്പിക്കുന്നതിനാൽ പേര് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
