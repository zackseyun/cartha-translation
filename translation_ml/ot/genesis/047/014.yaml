source:
  edition: WLC
  text: וַ/יְלַקֵּ֣ט יוֹסֵ֗ף אֶת כָּל הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֤א בְ/אֶֽרֶץ מִצְרַ֨יִם֙ וּ/בְ/אֶ֣רֶץ כְּנַ֔עַן בַּ/שֶּׁ֖בֶר אֲשֶׁר הֵ֣ם שֹׁבְרִ֑ים וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת הַ/כֶּ֖סֶף בֵּ֥יתָ/ה פַרְעֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: ml
  text: യോസേഫ് ഈജിപ്ത് ദേശത്തും കനാൻ ദേശത്തും ഉണ്ടായിരുന്ന വെള്ളി മുഴുവനും അവർ വാങ്ങിക്കൊണ്ടിരുന്ന ധാന്യത്തിനായി ശേഖരിച്ചു[a]. യോസേഫ് ആ വെള്ളി ഫറവോന്റെ ഭവനത്തിലേക്കു കൊണ്ടുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പണം മുഴുവനും.’ എബ്രായമൂലത്തിൽ അക്ഷരാർഥത്തിൽ ‘വെള്ളി മുഴുവനും’ എന്നാണ്; വെള്ളി ഇവിടെ പണമടയ്ക്കാനുള്ള മാധ്യമമായി ഉപയോഗിച്ചിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഫറവോന്റെ ഭവനം’ എന്നത് രാജവസതിയെ മാത്രമല്ല, വിശാലമായ അർഥത്തിൽ ഫറവോന്റെ രാജഭവനത്തെയോ ഭണ്ഡാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: ശേഖരിച്ചു
  rationale: לקט എന്ന ക്രിയയുടെ ‘പല ഇടങ്ങളിൽനിന്നായി കൂട്ടിച്ചേർക്കുക/ശേഖരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל הַכֶּסֶף
  choice: വെള്ളി മുഴുവനും
  rationale: כֶּסֶף എന്നതിന്റെ മൂർത്തമായ ‘വെള്ളി’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് പണമെന്ന നിലയിൽ ഉപയോഗിക്കപ്പെട്ടതാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: הַנִּמְצָא
  choice: ഉണ്ടായിരുന്ന
  rationale: ദേശങ്ങളിൽ ലഭ്യമായോ നിലവിലുണ്ടായിരുന്നോ വെള്ളിയെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: ഈജിപ്ത് ദേശത്തും കനാൻ ദേശത്തും
  rationale: രണ്ടു ഭൂപ്രദേശങ്ങളെയും വേർതിരിച്ചു പറയുന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בַּשֶּׁבֶר
  choice: ധാന്യത്തിനു പകരമായി
  rationale: യോസേഫ് കഥാസന്ദർഭത്തിൽ שֶׁבֶר വാങ്ങുന്ന ധാന്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; בְ ഇടപാടിന്റെ പ്രതിഫലബന്ധം കാണിക്കുന്നു.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: അവർ വാങ്ങിക്കൊണ്ടിരുന്ന
  rationale: ഇവിടെ שבר എന്നത് ധാന്യം വാങ്ങുക എന്നർഥമുള്ളതാണ്; പങ്കാളിക്രിയയുടെ തുടരുന്ന പ്രവർത്തനഭാവം ‘വാങ്ങിക്കൊണ്ടിരുന്ന’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിലേക്കു കൊണ്ടുവന്നു
  rationale: ദിശാസൂചകമായ בֵּיתָהയുടെ ‘അകത്തേക്ക്/ഭവനത്തിലേക്ക്’ എന്ന ചലനഭാവം നൽകുകയും בַּיִת എന്ന പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘വെള്ളി’യും ‘ഭവനം’യും മുഖ്യപാഠത്തിൽ നിലനിർത്തി മൂലപാഠത്തിന്റെ മൂർത്തതയും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു; ആവശ്യമായ വിശദീകരണങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകിയിരിക്കുന്നു.
