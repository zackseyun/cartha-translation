id: GEN.47.9
reference: Genesis 47:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: ml
  text: 'യാക്കോബ് ഫറവോനോടു പറഞ്ഞു: “എന്റെ പരദേശവാസത്തിലെ വർഷങ്ങൾ[a] നൂറ്റിമുപ്പതാണ്. എന്റെ ജീവിതത്തിലെ വർഷങ്ങൾ എണ്ണത്തിൽ കുറവും ദുരിതം നിറഞ്ഞവയുമായിരുന്നു; അവ, എന്റെ പിതാക്കന്മാർ പരദേശികളായി കഴിഞ്ഞ ജീവിതത്തിലെ വർഷങ്ങളോളം എത്തിയിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ തീർത്ഥാടനകാലത്തിലെ വർഷങ്ങൾ … അവരുടെ തീർത്ഥാടനകാലത്തിലെ വർഷങ്ങൾ.” എബ്രായപദം അന്യദേശത്ത് താൽക്കാലിക താമസക്കാരനായി കഴിയുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: ഞാൻ പരദേശിയായി പാർത്തുവന്ന / പരദേശികളായി പാർത്ത
  rationale: ഈ പദം അന്യദേശത്ത് താൽക്കാലിക താമസക്കാരനായി കഴിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘തീർത്ഥാടനം’ എന്ന ആത്മീയവത്കരണം ഒഴിവാക്കി പിതൃപുരുഷന്മാരുടെ പരദേശവാസസ്ഥിതി വ്യക്തമാക്കുന്നു.
- source_word: יְמֵי שְׁנֵי
  choice: വർഷങ്ങളിലെ ദിവസങ്ങൾ / ആയുഷ്കാലത്തിലെ ദിവസങ്ങൾ
  rationale: ‘ദിവസങ്ങൾ—വർഷങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവവും ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർത്ഥഗ്രാഹ്യമാക്കുന്നു.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: നൂറ്റിമുപ്പതു വർഷം
  rationale: മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപം.
- source_word: מְעַט וְרָעִים
  choice: ചുരുക്കവും ദുരിതം നിറഞ്ഞവയും
  rationale: מְעַט ആയുസ്സിന്റെ താരതമ്യേന കുറഞ്ഞ ദൈർഘ്യത്തെയും רָעִים ജീവിതാനുഭവത്തിലെ കഷ്ടദുരിതങ്ങളെയും സൂചിപ്പിക്കുന്നു; ധാർമിക തിന്മയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הִשִּׂיגוּ
  choice: എത്തിയിട്ടില്ല
  rationale: മുൻപുള്ളവരുടെ ആയുഷ്കാലത്തോളം എത്താതിരിക്കുക എന്ന താരതമ്യാർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: אֲבֹתַי
  choice: എന്റെ പിതാക്കന്മാർ
  rationale: സന്ദർഭത്തിലെ പിതൃപുരുഷന്മാരുമായുള്ള കുടുംബപരമായ തുടർച്ച നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതൃപുരുഷൻ സ്വയം പരദേശവാസിയായി വിശേഷിപ്പിക്കുന്നത്
  choice: പരദേശിയായി പാർത്തുവന്ന
  alternative: തീർത്ഥാടനകാലം
  rationale: മൂലപദം ആത്മീയ തീർത്ഥാടനത്തെ വ്യക്തമായി പറയുന്നില്ല; അന്യദേശത്ത് താൽക്കാലിക താമസക്കാരനായി കഴിഞ്ഞ ചരിത്രാവസ്ഥയാണ് മുൻനിരയിൽ. അതിനാൽ പിന്നീടുള്ള ആത്മീയ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. മൂലത്തിലെ ‘ദിവസങ്ങൾ—വർഷങ്ങൾ’ ആവർത്തനം ഭാഗികമായി നിലനിർത്തി; അമിതമായി അക്ഷരാനുവർത്തനം ചെയ്ത് മലയാളവാക്യം ദുർഗ്രാഹ്യമാകുന്നത് ഒഴിവാക്കി.
