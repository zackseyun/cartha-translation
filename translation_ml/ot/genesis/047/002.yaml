source:
  edition: WLC
  text: וּ/מִ/קְצֵ֣ה אֶחָ֔י/ו לָקַ֖ח חֲמִשָּׁ֣ה אֲנָשִׁ֑ים וַ/יַּצִּגֵ֖/ם לִ/פְנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/002.yaml
  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: ml
  text: അവൻ തന്റെ സഹോദരന്മാരിൽനിന്ന് അഞ്ചുപേരെ എടുത്ത് ഫറവോന്റെ മുമ്പാകെ നിർത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ സഹോദരന്മാരുടെ അറ്റത്തുനിന്ന്’ അഥവാ ‘തന്റെ സഹോദരന്മാരിൽ ഏറ്റവും മികച്ചവരിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥത്തിൽ ‘അറ്റം/അരിക്’ ഉൾപ്പെടുന്നുണ്ടെങ്കിലും, ഇവിടെ യോസേഫ് തന്റെ സഹോദരന്മാരിൽനിന്ന് അഞ്ചുപേരെ തിരഞ്ഞെടുത്തു എന്ന ഭാഗികാർഥമായിരിക്കാനാണു കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: തന്റെ സഹോദരന്മാരിൽനിന്ന്
  rationale: מִקְצֵה എന്ന പ്രയോഗത്തിന് അക്ഷരാർഥത്തിൽ ‘അറ്റത്തുനിന്ന്’ എന്ന ആശയമുണ്ടെങ്കിലും, ഇവിടെ ഒരു വലിയ കൂട്ടത്തിൽനിന്ന് ചിലരെ എടുക്കുന്ന ഭാഗികാർഥമാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്. ‘സഹോദരന്മാരിൽനിന്ന്’ എന്നത് ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶחָיו
  choice: തന്റെ സഹോദരന്മാർ
  rationale: സന്ദർഭത്തിൽ ഇവർ യോസേഫിന്റെ സ്വന്തം സഹോദരന്മാരായതിനാൽ പൊതുവായ ‘ബന്ധുക്കൾ’ എന്നതിനെക്കാൾ ‘സഹോദരന്മാർ’ കൃത്യമാണ്.
- source_word: לָקַח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ലָקַח എന്നതിന് അടിസ്ഥാനമായി ‘എടുത്തു/കൊണ്ടുപോയി’ എന്നാണ്. ഫറവോന്റെ സന്നിധിയിൽ ഹാജരാക്കുന്നതിനായി സഹോദരന്മാരിൽ അഞ്ചുപേരെ ഒപ്പം കൊണ്ടുപോയെന്ന സന്ദർഭാർഥം ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: അഞ്ചുപേർ
  rationale: ആളുകളെ എണ്ണുമ്പോൾ ‘അഞ്ചുപേർ’ എന്നതാണ് സ്വാഭാവികമായ ആധുനിക മലയാളം; ഇവർ സഹോദരന്മാരാണെന്നത് മുൻപത്തെ പദത്തിൽ വ്യക്തമാണ്.
- source_word: וַיַּצִּגֵם
  choice: അവരെ നിർത്തി
  rationale: יָצַג എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നിർത്തുക, ഹാജരാക്കുക, മുമ്പിൽ കൊണ്ടുവന്നു നിർത്തുക’ എന്നർഥം നൽകുന്നു. രാജസന്നിധിയിലെ അവതരണം സൂചിപ്പിക്കുമ്പോഴും എബ്രായത്തിന്റെ ദൃശ്യസ്വഭാവം നിലനിർത്താൻ ‘നിർത്തി’ തിരഞ്ഞെടുത്തു.
- source_word: לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പാകെ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്നാണ്. ‘ഫറവോന്റെ മുമ്പാകെ’ സംക്ഷിപ്തവും മാന്യവുമായ കഥനഭാഷയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. എബ്രായത്തിലെ ഭാഗികപ്രയോഗത്തിന്റെ പ്രധാന അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി, യഥാർഥമായ പദാർഥ-വ്യാഖ്യാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
