  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: ml
  text: വിളവെടുപ്പാകുമ്പോൾ, നിങ്ങൾ അഞ്ചിലൊന്ന് ഫറവോന് കൊടുക്കണം; ശേഷിക്കുന്ന അഞ്ചിൽ നാലുഭാഗം[a] നിലത്തിൽ വിതയ്ക്കാനുള്ള വിത്തിനും, നിങ്ങളുടെ ഭക്ഷണത്തിനും, നിങ്ങളുടെ വീടുകളിലുള്ളവരുടെ ഭക്ഷണത്തിനും, നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കു ഭക്ഷിക്കാനുമായി നിങ്ങൾക്കുള്ളതായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നാല് കൈകൾ’; അഞ്ചു വിഹിതങ്ങളിൽ ശേഷിക്കുന്ന നാല് വിഹിതങ്ങൾ, അതായത് അഞ്ചിൽ നാലുഭാഗം, എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: വിളവെടുപ്പാകുമ്പോൾ
  rationale: תְּבוּאָה വിളവ്/ഉൽപ്പന്നം എന്നർഥം നൽകുന്നു; ഈ ഭരണപരമായ സന്ദർഭത്തിൽ בַּ ചേർന്ന രൂപം വിളവ് ലഭിക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ കാലസൂചനയായി വിവർത്തനം ചെയ്തു.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: നിങ്ങൾ അഞ്ചിലൊന്ന് ഫറവോന് കൊടുക്കണം
  rationale: חֲמִישִׁית കൃത്യമായി അഞ്ചിലൊന്നിനെ സൂചിപ്പിക്കുന്നു; നിർദേശത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി ‘കൊടുക്കണം’ എന്നു നൽകി.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: ശേഷിക്കുന്ന അഞ്ചിൽ നാലുഭാഗം
  rationale: അക്ഷരാർഥത്തിലെ ‘നാല് കൈകൾ’ ഇവിടെ അഞ്ചു വിഹിതങ്ങളിൽ ശേഷിക്കുന്ന നാല് വിഹിതങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ശേഷിക്കുന്ന’ എന്നു ചേർത്തത് നികുതി നൽകിയശേഷമുള്ള പങ്കാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കുള്ളതായിരിക്കും
  rationale: ശേഷിക്കുന്ന വിളവ് അവർക്കായി വകയിരുത്തപ്പെടുകയും അവരുടെ കൈവശമാകുകയും ചെയ്യുന്നതാണ് ഈ രൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: നിലത്തിൽ വിതയ്ക്കാനുള്ള വിത്തിന്
  rationale: לְ എന്നത് ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; അടുത്ത കൃഷിക്കായി നിലത്തിൽ വിതയ്ക്കേണ്ട വിത്തെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: וּלְאָכְלְכֶם
  choice: നിങ്ങളുടെ ഭക്ഷണത്തിന്
  rationale: אכל-ൽനിന്നുള്ള രൂപം ഇവിടെ ഭക്ഷണോപയോഗത്തെ സൂചിപ്പിക്കുന്നു; പട്ടികയുടെ ഘടന നിലനിർത്തി.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: നിങ്ങളുടെ വീടുകളിലുള്ളവരുടെ ഭക്ഷണത്തിന്
  rationale: ബന്ധവാചകം വീടുകളിലുള്ള ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; വസ്തുക്കളെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വ്യക്തികളെ തുറന്നുപറഞ്ഞു.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങളുടെ ഭക്ഷണത്തിന്
  rationale: טַף ചെറുകുട്ടികളെയോ ആശ്രിതരായ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു; കുടുംബസന്ദർഭം നിലനിർത്തുന്ന സ്വാഭാവിക പദമായി ‘കുഞ്ഞുങ്ങൾ’ തെരഞ്ഞെടുത്തു.
