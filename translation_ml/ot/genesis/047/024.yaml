translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭരണപരമായ നിർദേശം സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും എബ്രായത്തിലെ വിഹിതപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
