source:
  edition: WLC
  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: ml
  text: 'ആ വർഷം അവസാനിച്ചപ്പോൾ, രണ്ടാം വർഷത്തിൽ അവർ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “എന്റെ യജമാനനിൽനിന്ന് ഞങ്ങൾ ഒന്നും മറച്ചുവെക്കില്ല: പണം[a] തീർന്നിരിക്കുന്നു; കന്നുകാലിസമ്പത്തും എന്റെ യജമാനന്റെ പക്കലായിക്കഴിഞ്ഞു. ഞങ്ങളുടെ ശരീരങ്ങളും[b] നിലവും അല്ലാതെ എന്റെ യജമാനന്റെ മുമ്പിൽ ഒന്നും ശേഷിച്ചിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വെള്ളി’; എബ്രായത്തിൽ ‘വെള്ളി’ എന്ന പദം പണത്തെയും സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞങ്ങളെത്തന്നെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഞങ്ങളുടെ ശരീരങ്ങൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: ആ വർഷം അവസാനിച്ചപ്പോൾ
  rationale: תמם സൂചിപ്പിക്കുന്ന പൂർത്തിയാകൽ അഥവാ അവസാനിക്കൽ സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: രണ്ടാം വർഷത്തിൽ
  rationale: സന്ദർഭത്തിൽ ഇത് തുടർന്നുവന്ന വർഷമായിരിക്കാമെങ്കിലും, എബ്രായത്തിലെ ക്രമസംഖ്യയെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: എന്റെ യജമാനനിൽനിന്ന് ഞങ്ങൾ ഒന്നും മറച്ചുവെക്കില്ല
  rationale: כחד എന്നതിന്റെ മറയ്ക്കുക/ഒളിച്ചുവെക്കുക എന്ന അർഥവും ഏകവചനത്തിലുള്ള ആദരസംബോധനയായ ‘എന്റെ യജമാനൻ’ എന്ന രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: תַּם הַכֶּסֶף
  choice: പണം തീർന്നിരിക്കുന്നു
  rationale: כֶּסֶף അക്ഷരാർഥത്തിൽ വെള്ളിയാണെങ്കിലും ഇവിടെ വിനിമയമാധ്യമമായ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; תם അതു മുഴുവൻ ചെലവായി തീർന്ന സ്ഥിതി പറയുന്നു.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: കന്നുകാലിസമ്പത്തും എന്റെ യജമാനന്റെ പക്കലായിക്കഴിഞ്ഞു
  rationale: മൃഗരൂപത്തിലുള്ള സമ്പത്ത് യോസേഫിന്റെ കൈവശത്തേക്കു മാറിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥാവകാശത്തിന്റെ ആശയം അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ മുമ്പിൽ ഒന്നും ശേഷിച്ചിട്ടില്ല
  rationale: לִפְנֵי എന്ന ‘മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ശേഷിച്ചിട്ടില്ല എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: גְּוִיָּתֵנוּ וְאַדְמָתֵנוּ
  choice: ഞങ്ങളുടെ ശരീരങ്ങളും നിലവും
  rationale: גְּוִיָּהയുടെ മൂർത്തമായ ‘ശരീരം’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ ജീവനുള്ള വ്യക്തികളെയാണ് ഉദ്ദേശിക്കുന്നത്. אֲדָמָה കൃഷിഭൂമിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിലം’ എന്നു നൽകി.
