translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൂട്ടം സംസാരിച്ചിട്ടും മൂലപാഠത്തിലെ ഏകവചന ആദരരൂപമായ ‘എന്റെ യജമാനൻ’ നിലനിർത്തി; ആവർത്തനം എബ്രായത്തിന്റെ വാചകഭാവം സംരക്ഷിക്കുന്നു.
