id: GEN.47.3
reference: Genesis 47:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל אֶחָ֖י/ו מַה מַּעֲשֵׂי/כֶ֑ם וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה רֹעֵ֥ה צֹאן֙ עֲבָדֶ֔י/ךָ גַּם אֲנַ֖חְנוּ גַּם אֲבוֹתֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: ml
  text: 'ഫറവോൻ അവന്റെ സഹോദരന്മാരോടു ചോദിച്ചു: “നിങ്ങളുടെ തൊഴിൽ[a] എന്താണ്?” അവർ ഫറവോനോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങളും ഞങ്ങളുടെ പിതാക്കന്മാരും ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവരാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളുടെ ജോലി എന്താണ്?”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: നിങ്ങളുടെ തൊഴിൽ എന്താണ്?
  rationale: מַעֲשֶׂה എന്ന പദത്തിന് പ്രവൃത്തി, ജോലി, പ്രവർത്തനം എന്നീ അർഥങ്ങളുണ്ട്. രാജസദസ്സിലെ ഈ ചോദ്യത്തിൽ അവരുടെ ഉപജീവനമാർഗമോ തൊഴിൽമേഖലയോ ആണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘തൊഴിൽ’ തെരഞ്ഞെടുത്തു.
- source_word: רֹעֵה צֹאן
  choice: ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവർ
  rationale: പങ്കാളിത്തക്രിയാരൂപമായ רֹעֵהയും צֹאן എന്ന ചെറുകന്നുകാലികളെ—പ്രധാനമായി ചെമ്മരിയാടുകളെയും കോലാടുകളെയും—സൂചിപ്പിക്കുന്ന നാമവും ചേർന്ന് അവരുടെ തൊഴിൽ വ്യക്തമാക്കുന്നു. ‘ആട്ടിൻകൂട്ടങ്ങളെ മേയ്ക്കുന്നവർ’ മൂലപാഠത്തിലെ രണ്ടു ഘടകങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: עבד എന്ന പദത്തിന് ദാസൻ/അടിമ എന്ന വിശാല അർഥപരിധിയുണ്ടെങ്കിലും, ഇവിടെ ഫറവോനോടുള്ള വിനയപൂർവമായ സ്വയംവിശേഷണമാണ് മുൻനിൽക്കുന്നത്. ‘അങ്ങയുടെ ദാസന്മാർ’ ആ രാജസദസ്സിലെ ആദരഭാവം നിലനിർത്തുന്നു.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: ഞങ്ങളും ഞങ്ങളുടെ പിതാക്കന്മാരും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന גַּם തലമുറകളിലുടനീളമുള്ള തുടർച്ചയെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിലെ ‘ഞങ്ങളും … പിതാക്കന്മാരും’ ആ സമാന്തര ഊന്നൽ സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: אֶל אֶחָיו
  choice: അവന്റെ സഹോദരന്മാരോട്
  rationale: സന്ദർഭത്തിൽ പ്രത്യയം യോസേഫിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ ‘അവന്റെ സഹോദരന്മാർ’ എന്ന പ്രയോഗം പേര് ചേർത്ത് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഫറവോനോടുള്ള രാജസദസ്സിലെ വിനയഭാവം ‘അങ്ങയുടെ ദാസന്മാർ’ എന്ന പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു; മൂലപാഠത്തിന്റെ ആവർത്തനവും തലമുറത്തുടർച്ചയും സ്വാഭാവികമായി നിലനിർത്തി.
