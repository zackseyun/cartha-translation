translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ രചിച്ചു. ഹീബ്രുവിലെ കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ മുന്നിലെത്തിച്ചു. ‘തളർന്നുപോയി’ എന്ന രൂപകാലങ്കാരം ഭൂവിഭാഗങ്ങളെയും അവിടത്തെ സമൂഹങ്ങളെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
