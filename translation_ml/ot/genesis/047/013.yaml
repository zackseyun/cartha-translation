language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: ml
  text: ക്ഷാമം അതികഠിനമായിരുന്നതിനാൽ ദേശത്തെങ്ങും ഭക്ഷണം ഉണ്ടായിരുന്നില്ല[a]. ക്ഷാമം നിമിത്തം ഈജിപ്തുദേശവും കനാൻദേശവും തളർന്നുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘അപ്പം’; ഇവിടെ പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ക്ഷയിച്ചുപോയി’ / ‘ശക്തിയറ്റുപോയി’. ക്ഷാമം ഈജിപ്തിനെയും കനാനെയും ദുർബലമാക്കിയതിനെ ഹീബ്രു ക്രിയ രൂപകാത്മകമായി വിവരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: ഭക്ഷണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘അപ്പം’ എന്നാണെങ്കിലും, ക്ഷാമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് പൊതുവായി ആഹാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭക്ഷണം’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֵין
  choice: ഉണ്ടായിരുന്നില്ല
  rationale: ഭൂതകാല ആഖ്യാനസന്ദർഭത്തിലെ അസ്തിത്വനിഷേധം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל הָאָרֶץ
  choice: ദേശത്തെങ്ങും
  rationale: ബാധിതമായ പ്രദേശം മുഴുവനെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഭൂമി മുഴുവനെന്ന ആഗോള അർഥം അനാവശ്യമായി നൽകുന്നില്ല.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: ക്ഷാമം അതികഠിനമായിരുന്നതിനാൽ
  rationale: ‘ഭാരം’ എന്ന അക്ഷരാർഥത്തിനു പകരം ക്ഷാമത്തിന്റെ കടുപ്പം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ് സന്ദർഭത്തിൽ യോജിച്ചത്; כִּי കാരണബന്ധമായി വിവർത്തനം ചെയ്തു.
- source_word: וַתֵּלַהּ
  choice: തളർന്നുപോയി
  rationale: ക്ഷാമത്തിന്റെ ദുർബലപ്പെടുത്തുന്ന ഫലത്താൽ നാടുകൾ ക്ഷയിച്ചു/ശക്തിയറ്റു എന്ന രൂപകാലങ്കാരപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: ഈജിപ്തുദേശവും കനാൻദേശവും
  rationale: രണ്ടു ഭൂവിഭാഗങ്ങൾക്കും ഹീബ്രുവിലുള്ള ‘ദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי הָרָעָב
  choice: ക്ഷാമം നിമിത്തം
  rationale: കാരണത്തെ വ്യക്തമാക്കുന്ന ഹീബ്രു മുൻപ്രത്യയപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
