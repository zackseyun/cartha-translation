  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: ml
  text: 'പിന്നെ യോസേഫ് ഫറവോന്റെ സന്നിധിയിൽ ചെന്നു ഫറവോനോടു അറിയിച്ചു: “എന്റെ അപ്പനും സഹോദരന്മാരും അവരുടെ ആടുമാടുകളും അവർക്കുള്ള സകലവും സഹിതം കനാൻദേശത്തുനിന്ന് വന്നിരിക്കുന്നു[a]. ഇതാ[b], അവർ ഗോശെൻദേശത്താണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കനാൻദേശത്തുനിന്ന് വന്നു.” എബ്രായത്തിലെ പൂർത്തിക്രിയ ലളിത ഭൂതകാലമായോ, പൂർത്തിയായ വരവിന്റെ ഇപ്പോഴത്തെ ഫലം ഊന്നുന്ന രൂപമായോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവർ ഇപ്പോൾ ഗോശെൻദേശത്തുണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: സന്നിധിയിൽ ചെന്നു
  rationale: בוא എന്നതിന് വരുക, പോകുക, പ്രവേശിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ യോസേഫ് ഫറവോന്റെ സന്നിധിയിലേക്കു ചെന്നതാണെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: ഫറവോന്റെ സന്നിധിയിൽ ചെന്നു പറഞ്ഞു
  rationale: ‘അറിയിച്ചു, പറഞ്ഞു’ എന്ന എബ്രായ ആഖ്യാനരീതി മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ, സംസാരത്തിന്റെ റിപ്പോർട്ടിങ് സ്വഭാവം നഷ്ടപ്പെടാതെ ‘പറഞ്ഞു’ എന്നു സ്വാഭാവികമാക്കി.
- source_word: אָבִי וְאַחַי
  choice: എന്റെ അപ്പനും സഹോദരന്മാരും
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥതയും പുരുഷസഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: അവരുടെ ആടുമാടുകളോടും
  rationale: צאן ചെമ്മരിയാടുകളും കോലാടുകളും പോലുള്ള ചെറുകന്നുകാലികളെയും בקר വലിയ കന്നുകാലികളെയും സൂചിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിലെ ‘ആടുമാടുകൾ’ ഈ കൂട്ടവ്യത്യാസം സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: അവർക്കുള്ള സകലത്തോടുംകൂടെ
  rationale: അവരുടെ മുഴുവൻ സ്വത്തുസമ്പാദ്യത്തെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തും മലയാളത്തിൽ ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുനിന്ന് വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ വരവിന്റെ ഇപ്പോഴത്തെ ഫലം ഊന്നുന്ന തരത്തിൽ perfect രൂപം മലയാളത്തിലെ ‘വന്നിരിക്കുന്നു’ എന്നു നൽകി; ലളിത ഭൂതകാലവും സാധ്യമാണ്.
- source_word: וְהִנָּם
  choice: ഇതാ, അവർ
  rationale: הנה ശ്രദ്ധ ക്ഷണിക്കുകയും ഇപ്പോഴത്തെ സാന്നിധ്യം ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്നു; ‘ഇതാ’ ആ ദൈക്തിക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻദേശത്താണ്
  rationale: എബ്രായത്തിലെ ‘ദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പദം നിലനിർത്തുകയും ഇപ്പോഴത്തെ സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
