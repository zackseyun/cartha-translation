  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്ന ശൈലി. ‘അപ്പൻ’ സന്ദർഭത്തിലെ കുടുംബസംഭാഷണത്തിന് സ്വാഭാവികമാണ്; ‘ഇതാ’ മൂലപാഠത്തിലെ ശ്രദ്ധാകർഷക ഊന്നൽ നിലനിർത്തുന്നു.
