source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Joseph and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: ml
  text: 'ഇസ്രായേൽ മരിക്കാനുള്ള ദിവസങ്ങൾ അടുത്തപ്പോൾ, അവൻ തന്റെ മകനായ യോസേഫിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “നിന്റെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി നിന്റെ കൈ എന്റെ തുടയുടെ കീഴിൽ വെക്കുക[a]; എന്നോടു അചഞ്ചലമായ സ്നേഹത്തോടും വിശ്വസ്തതയോടുംകൂടെ പെരുമാറുക.[b] ദയവായി എന്നെ ഈജിപ്തിൽ അടക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ കൈ എന്റെ തുടയുടെ കീഴിൽ വെക്കുക” എന്നത് ഗോത്രപിതാക്കന്മാരുടെ ആഖ്യാനങ്ങളിൽ ഗൗരവമുള്ള ഒരു സത്യപ്രതിജ്ഞയോടു ബന്ധപ്പെട്ട ആംഗ്യമാണ്; ഉല്പത്തി 24:2 താരതമ്യം ചെയ്യുക.
    reason: cultural_note
  - marker: b
    text: '“അചഞ്ചലമായ സ്നേഹവും വിശ്വസ്തതയും” എന്ന എബ്രായ പദജോടി ബന്ധനിഷ്ഠവും ആശ്രയിക്കാവുന്നതുമായ ദയയെ സൂചിപ്പിക്കുന്നു. മറ്റൊരു പരിഭാഷ: “ദയയോടും വിശ്വസ്തതയോടുംകൂടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: ഇസ്രായേലിന്റെ മരണദിവസം അടുത്തപ്പോൾ
  rationale: ‘ദിവസങ്ങൾ അടുത്തു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, മരണം ആസന്നമായെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പാഠത്തിലുള്ള ‘ഇസ്രായേൽ’ എന്ന പേരുതന്നെ സംരക്ഷിക്കുന്നു.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: തന്റെ മകനായ യോസേഫിനെ
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ ‘യോസേഫ്’ ഉപയോഗിക്കുന്നു.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: നിന്റെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: എബ്രായ വിനയപൂർവ അഭ്യർഥനയിലെ ‘നിന്റെ കണ്ണുകളിൽ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ‘നിന്റെ ദൃഷ്ടിയിൽ’ എന്നു നൽകുന്നു; חֵן എന്നത് ‘പ്രീതി’യായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: ദയവായി നിന്റെ കൈ എന്റെ തുടയുടെ കീഴിൽ വെച്ച്
  rationale: ഗോത്രപിതാക്കന്മാരുടെ ആഖ്യാനത്തിലെ സത്യപ്രതിജ്ഞാ ചേഷ്ടയെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലപാഠത്തിന്റെ ശരീരസംബന്ധമായ വ്യക്തത നിലനിർത്തുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: חֶסֶד וֶאֱמֶת
  choice: അചഞ്ചലസ്നേഹത്തോടും വിശ്വസ്തതയോടുംകൂടെ
  rationale: חֶסֶד എന്നതിലെ ഉറച്ച, ബന്ധനിഷ്ഠമായ സ്നേഹവും אֱמֶת എന്നതിലെ വിശ്വസനീയതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ഉടമ്പടി’ എന്ന പദം മൂലത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: ദയവായി എന്നെ ഈജിപ്തിൽ അടക്കരുത്
  rationale: נָא നൽകുന്ന വിനയപൂർവമായ അപേക്ഷാഭാവം ‘ദയവായി’ എന്നു വ്യക്തമാക്കുകയും, നിഷേധാത്മക അഭ്യർഥന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת എന്ന പദജോടിയുടെ പരിഭാഷ
  choice: അചഞ്ചലസ്നേഹവും വിശ്വസ്തതയും
  alternative: ഉടമ്പടിനിഷ്ഠയും സത്യവും; ദയയും സത്യവും
  rationale: ഈ സന്ദർഭത്തിൽ പദജോടി വിശ്വസ്തവും ആശ്രയിക്കാവുന്നതുമായ ബന്ധനിഷ്ഠ പ്രവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉടമ്പടി’ എന്ന ആശയം പ്രസക്തമായിരിക്കാമെങ്കിലും പദത്തിൽ അത് നേരിട്ട് പറഞ്ഞിട്ടില്ല; അതിനാൽ അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ‘കൈ തുടയുടെ കീഴിൽ വെക്കുക’ എന്ന ചേഷ്ട
  choice: മുഖ്യപാഠത്തിൽ അക്ഷരാർഥത്തോട് ചേർന്ന് നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: ‘എന്നോടു സത്യം ചെയ്യുക’ എന്നു വ്യാഖ്യാനപരമായി മാറ്റുക
  rationale: മൂലപാഠത്തിന്റെ സാംസ്കാരികവും ആഖ്യാനപരവുമായ വ്യക്തത സംരക്ഷിക്കുന്നു; അതിന്റെ കൃത്യമായ പ്രതീകാർഥം പാഠം തന്നെ വിശദീകരിക്കാത്തതിനാൽ അതിലധികം നിഗമനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇസ്രായേൽ’, ‘യോസേഫ്’, ‘ഈജിപ്ത്’ എന്നീ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന נָאയുടെ അപേക്ഷാഭാവം രണ്ടിടത്തും ‘ദയവായി’ എന്നു നിലനിർത്തി; അപരിചിതമായ സത്യപ്രതിജ്ഞാ ചേഷ്ട മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ ചുരുക്കമായി വിശദീകരിച്ചു.
