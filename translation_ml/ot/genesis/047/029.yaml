    rationale: וַיִּקְרְבוּ יְמֵי is plural, ‘the days drew near.’ A plural Malayalam rendering preserves both number and the source idiom.
  - severity: low
    issue: The oath-gesture footnote uses ‘ചേഷ്ട.’
    rationale: ‘ആംഗ്യം’ is more natural and precise for a culturally significant ritual gesture in modern Malayalam.
