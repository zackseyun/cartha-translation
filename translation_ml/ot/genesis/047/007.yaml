source:
  edition: WLC
  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: ml
  text: പിന്നെ യോസേഫ് തന്റെ അപ്പനായ യാക്കോബിനെ അകത്തേക്കു കൊണ്ടുവന്ന് ഫറവോന്റെ മുമ്പിൽ നിർത്തി[a]. യാക്കോബ് ഫറവോനെ അനുഗ്രഹിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഫറവോന്റെ മുമ്പിൽ നിൽക്കുമാറാക്കി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അനുഗ്രഹിച്ചു’ എന്നതിൽ വെറും മര്യാദാപൂർവമായ അഭിവാദ്യം മാത്രമല്ല, ഔപചാരികമായി ഉച്ചരിച്ച ഒരു അനുഗ്രഹവും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: അകത്തേക്കു കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യോസേഫ് യാക്കോബിനെ ഫറവോന്റെ സന്നിധിയിലേക്കു കൊണ്ടുവന്നുവെന്ന കാരണാർത്ഥം നൽകുന്നു; രാജസദസ്സിന്റെ പശ്ചാത്തലവും ഈ പ്രയോഗം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אָבִיו
  choice: തന്റെ അപ്പനായ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം യോസേഫിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: മുമ്പിൽ നിർത്തി
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘നിൽക്കുമാറാക്കി’ എന്ന കാരണാർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; ഔപചാരികമായ രാജസന്നിധിയിലെ അവതരണവും സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: לִפְנֵי פַרְעֹה
  choice: ഫറവോന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാധാരണ അർത്ഥമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ പ്രാഥമിക അർത്ഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു; അതിനെ വെറും അഭിവാദ്യമായി ചുരുക്കുന്നില്ല.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രാജപദവിയുടെ രൂപം.
- source_word: וַ
  choice: പിന്നെ
  rationale: വാവ്-തുടർച്ചാക്രമം കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘പിന്നെ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: യാക്കോബ് ഫറവോനോടു ചെയ്ത പ്രവൃത്തിയുടെ അർത്ഥം
  choice: യാക്കോബ് ഫറവോനെ യഥാർഥത്തിൽ അനുഗ്രഹിച്ചു
  alternative: യാക്കോബ് ഫറവോനെ ആദരപൂർവം അഭിവാദ്യം ചെയ്തു
  rationale: ברך എന്ന ക്രിയയുടെ സാധാരണ അർത്ഥം ‘അനുഗ്രഹിക്കുക’ എന്നതാണ്. സാമൂഹികമായി താഴ്ന്ന നിലയിലുള്ള ഗോത്രപിതാവ് മഹാരാജാവിനെ അനുഗ്രഹിക്കുന്നതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ പാഠത്തിലുള്ളതുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ കാരണാർത്ഥം പ്രധാന പാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്; ברך എന്നതിലെ അനുഗ്രഹാർത്ഥം ദുർബലപ്പെടുത്തിയിട്ടില്ല.
