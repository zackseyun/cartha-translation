translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. യോസേഫിനോടുള്ള ആദരസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ബന്ധിതസേവനത്തിന്റെ കാഠിന്യം മറച്ചുവയ്ക്കാതിരിക്കാൻ ‘അടിമകൾ’ നിലനിർത്തി.
