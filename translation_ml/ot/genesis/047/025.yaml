id: GEN.47.25
reference: Genesis 47:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “അങ്ങ് ഞങ്ങളെ ജീവനോടെ നിലനിർത്തി. എന്റെ യജമാനന്റെ ദൃഷ്ടിയിൽ ഞങ്ങൾക്കു പ്രീതി ലഭിക്കട്ടെ[a]. ഞങ്ങൾ ഫറവോന്റെ അടിമകളായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുക” എന്നത് അംഗീകാരവും ദയയും അഭ്യർഥിക്കുന്ന എബ്രായ പ്രയോഗശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള സാധാരണ ആഖ്യാനപ്രവാഹം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הֶחֱיִתָנוּ
  choice: അങ്ങ് ഞങ്ങളെ ജീവനോടെ നിലനിർത്തി
  rationale: חיה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘ജീവിക്കാൻ ഇടയാക്കുക/ജീവൻ നിലനിർത്തുക’ എന്ന കാരകാർഥം സംരക്ഷിക്കുന്നു; ആത്മീയമായ ‘രക്ഷ’ എന്ന അധിക അർഥം ചുമത്തുന്നില്ല.
- source_word: נִמְצָא חֵן
  choice: ഞങ്ങൾക്കു പ്രീതി ലഭിക്കുമാറാകട്ടെ
  rationale: ഒന്നാം ബഹുവചന യിഖ്തോൽ ഇവിടെ വിനയപൂർവമായ അഭ്യർഥനയായി പ്രവർത്തിക്കുന്നു; ലളിതമായ ഭൂതകാല പ്രസ്താവനയാക്കാതെ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: എന്റെ യജമാനന്റെ ദൃഷ്ടിയിൽ
  rationale: ‘കണ്ണുകളിൽ പ്രീതി കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗശൈലിയെയും ഏകവചനത്തിലുള്ള ആദരസംബോധനയെയും വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהָיִינוּ
  choice: ഞങ്ങൾ … ആയിരിക്കും
  rationale: യോസേഫിന്റെ നടപടിയുടെ ഫലമായി അവർ ഏറ്റെടുക്കുന്ന തുടർപ്രതിബദ്ധതയെ ഭാവികാലത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲבָדִים לְפַרְעֹה
  choice: ഫറവോന്റെ അടിമകൾ
  rationale: ഈ സാമ്പത്തിക സാഹചര്യത്തിൽ സ്വാതന്ത്ര്യമില്ലാത്ത ബന്ധിതസേവനം പ്രധാനമായതിനാൽ മൃദുവായ ‘ദാസന്മാർ/സേവകർ’ എന്നതിനു പകരം ‘അടിമകൾ’ ഉപയോഗിക്കുന്നു; לְ ഫറവോനോടുള്ള അധീനബന്ധം സൂചിപ്പിക്കുന്നു.
