  terminology: ‘അങ്ങ്’ appropriately marks deferential address. ‘യജമാനൻ’ properly reflects אֲדֹנִי in this address, and ‘അടിമകൾ’ rightly preserves the economically bonded status denoted by עֲבָדִים in context.
