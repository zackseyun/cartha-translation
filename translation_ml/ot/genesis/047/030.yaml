  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: ml
  text: 'ഞാൻ എന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിക്കുമ്പോൾ[a], എന്നെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുപോയി അവരുടെ സംസ്കാരസ്ഥലത്ത്[b] അടക്കണം.” അവൻ പറഞ്ഞു: “അങ്ങ് പറഞ്ഞതുപോലെ ഞാൻ ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാൻ എന്റെ പിതാക്കന്മാരോടുകൂടെ കിടക്കുമ്പോൾ’; മരണത്തോടും സംസ്കാരത്തോടും ബന്ധപ്പെട്ട ഒരു പതിവ് ഹീബ്രു പ്രയോഗമാണിത്. ‘പിതാക്കന്മാർ’ എന്നതിന് ‘പൂർവികർ’ എന്നും പറയാം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ കല്ലറയിൽ’ അല്ലെങ്കിൽ ‘അവരുടെ ശവകുടീരത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: ഞാൻ ... നിദ്രപ്രാപിക്കുമ്പോൾ
  rationale: שׁכב എന്നതിന്റെ ‘കിടക്കുക’ എന്ന ദൃശ്യഭാവവും മരണവുമായി ബന്ധപ്പെട്ട പതിവുശൈലിയും മലയാളത്തിലെ dignified ആയ ‘നിദ്രപ്രാപിക്കുക’ സംരക്ഷിക്കുന്നു; וְ ഇവിടെ അഭ്യർഥനയുടെ സാഹചര്യത്തിൽ കാലാർഥമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עִם אֲבֹתַי
  choice: എന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: ആദിപിതാക്കന്മാർ/പൂർവികർ എന്ന അർഥമുള്ള കുടുംബപരവും സംസ്കാരപരവുമായ ഹീബ്രു പ്രയോഗം കഴിയുന്നത്ര ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: וּנְשָׂאתַנִי
  choice: എന്നെ ... കൊണ്ടുപോയി
  rationale: മൃതശരീരം ഈജിപ്തിനു പുറത്തേക്കു മാറ്റിക്കൊണ്ടുപോകുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽ/നീക്കം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: וּקְבַרְתַּנִי
  choice: അടക്കണം
  rationale: קבר എന്ന ‘സംസ്കരിക്കുക/അടക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; മുൻവാക്യത്തിൽ ആരംഭിച്ച അഭ്യർഥനയുടെ നിർബന്ധസ്വരം മലയാളത്തിലെ ‘ണം’ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּקְבֻרָתָם
  choice: അവരുടെ ശ്മശാനസ്ഥലത്ത്
  rationale: קְבֻרָה ഇവിടെ കല്ലറയുടെ രൂപം നിർണ്ണയിക്കാതെ സംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘ശ്മശാനസ്ഥലം’ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: സാധാരണ ഹീബ്രു ആഖ്യാനക്രമം മലയാളത്തിൽ ലളിതമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യും
  rationale: സ്വതന്ത്ര സർവനാമമായ אָנֹכִי നൽകുന്ന ഉറപ്പിന്റെ ഭാവം ‘ഞാൻ ചെയ്യും’ എന്ന നേരിട്ടുള്ള മറുപടിയിൽ നിലനിൽക്കുന്നു; അനാവശ്യമായ അതിശക്തമായ ഊന്നൽ ചേർത്തിട്ടില്ല.
- source_word: כִדְבָרֶךָ
  choice: അങ്ങ് പറഞ്ഞതുപോലെ
  rationale: അക്ഷരാർഥമായ ‘അങ്ങയുടെ വാക്കുപ്രകാരം’ എന്ന ആശയം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പിതാവിനോടുള്ള മാന്യസംബോധനയ്ക്കായി ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിക്കുക’ എന്ന മരണപ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ഹീബ്രു ദൃശ്യപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘ഞാൻ മരിക്കുമ്പോൾ’ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: മരണവും സംസ്കാരവും സംബന്ധിച്ച പതിവുശൈലിയാണെങ്കിലും, അതിനെ വെറും ‘മരിക്കുക’ എന്നു മാറ്റുന്നത് മൂലപാഠത്തിലെ രൂപകവും പിതാക്കന്മാരോടുള്ള ബന്ധവും ചുരുക്കും; മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തവും പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാക്കോബ് യോസേഫിനോടു പറയുന്ന അഭ്യർഥനയിൽ മാന്യസംബോധനയായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിൽ ഹീബ്രു മരണപ്രയോഗം സംരക്ഷിക്കുകയും സാധ്യതയുള്ള കൂടുതൽ അക്ഷരാർഥ/വ്യത്യസ്ത പദപ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകുകയും ചെയ്തു.
