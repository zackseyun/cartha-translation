source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: ml
  text: “ഈജിപ്തുദേശം നിന്റെ മുമ്പിലുണ്ട്.[a] ദേശത്തിന്റെ ഏറ്റവും നല്ല ഭാഗത്ത് നിന്റെ അപ്പനെയും സഹോദരന്മാരെയും പാർപ്പിക്കുക; അവർ ഗോഷെൻദേശത്ത് താമസിക്കട്ടെ. അവരിൽ കഴിവുള്ളവർ ഉണ്ടെന്ന് നിനക്കറിയാമെങ്കിൽ,[b] അവരെ എന്റെ കന്നുകാലികളുടെ മേൽനോട്ടക്കാരായി നിയമിക്കുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ മുമ്പിലുണ്ട്” എന്നത്, ഈജിപ്തിനുള്ളിൽ അനുയോജ്യമായ സ്ഥലം തിരഞ്ഞെടുക്കാൻ സ്വാതന്ത്ര്യമുണ്ടെന്നു സൂചിപ്പിക്കാവുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ശക്തി/പ്രാപ്തിയുള്ള പുരുഷന്മാർ”; “യോഗ്യരായ പുരുഷന്മാർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഈ പ്രയോഗം സൈനിക വീരതയെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: ഈജിപ്തുദേശം നിന്റെ മുമ്പിലുണ്ട്
  rationale: ‘നിന്റെ മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഈജിപ്തിനുള്ളിൽ സ്ഥലം തിരഞ്ഞെടുക്കാനുള്ള സ്വാതന്ത്ര്യവും ലഭ്യതയും ഇത് സൂചിപ്പിക്കുന്നു.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: ദേശത്തിന്റെ ഏറ്റവും നല്ല ഭാഗത്ത്
  rationale: מֵיטַב സൂചിപ്പിക്കുന്ന ഏറ്റവും നല്ല അഥവാ ശ്രേഷ്ഠമായ പ്രദേശം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הוֹשֵׁב
  choice: പാർപ്പിക്കുക
  rationale: ישׁב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപത്തിലുള്ള കാരണാർത്ഥം—അവരെ താമസിപ്പിക്കുക—കൃത്യമായി നൽകുന്നു.
- source_word: יֵשְׁבוּ
  choice: താമസിക്കട്ടെ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരു സ്ഥലത്ത് വസിക്കുകയെന്നതാണ്; ആജ്ഞാനുവർത്തിയായ അനുവദനീയ ഭാവവും നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോഷെൻദേശത്ത്
  rationale: മൂലത്തിലെ ‘ദേശം’ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וְאִם יָדַעְתָּ
  choice: നിനക്കറിയാമെങ്കിൽ
  rationale: യോസേഫിന്റെ അറിവിനെ അടിസ്ഥാനമാക്കിയുള്ള വ്യവസ്ഥ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי חַיִל
  choice: കഴിവുള്ളവർ
  rationale: ഭരണ-മൃഗപരിപാലന സന്ദർഭത്തിൽ חַיִל സൈനിക വീരതയെക്കാൾ കഴിവും യോഗ്യതയും കാര്യക്ഷമതയും സൂചിപ്പിക്കുന്നു; ലിംഗസൂചന മൂലത്തിൽ ഉള്ളതിനാൽ അടിക്കുറിപ്പിൽ അക്ഷരാർഥം നൽകുന്നു.
- source_word: וְשַׂמְתָּם
  choice: അവരെ ... നിയമിക്കുക
  rationale: ശാബ്ദികമായ ‘വെക്കുക’ എന്നതിനെക്കാൾ ചുമതലയിലേക്കുള്ള ഔദ്യോഗിക നിയമനം സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שָׂרֵי מִקְנֶה
  choice: കന്നുകാലികളുടെ മേൽനോട്ടക്കാർ
  rationale: שָׂרֵי എന്നതിന്റെ നേതൃത്വം/മേൽനോട്ടം എന്ന അർഥവും מִקְנֶה എന്നതിന്റെ വളർത്തുമൃഗസമ്പത്ത് എന്ന അർഥവും സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: עַל אֲשֶׁר לִי
  choice: എന്റെ കന്നുകാലികളുടെ മേൽ
  rationale: ‘എനിക്കുള്ളവയുടെ മേൽ’ എന്ന മൂലപ്രയോഗത്തിന്റെ സൂചിത വിഷയം മുൻപുള്ള കന്നുകാലികളാണെന്ന് മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
