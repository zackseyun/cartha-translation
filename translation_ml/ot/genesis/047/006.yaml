translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പാർപ്പിക്കുക,’ ‘താമസിക്കട്ടെ,’ ‘മേൽനോട്ടക്കാർ’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. ഇംഗ്ലീഷ് consultation layer-ൽ footnote markers-ന്റെ ഉള്ളടക്കക്രമം പൊരുത്തക്കേടോടെ നൽകിയിരുന്നതിനാൽ, മൂലപദങ്ങളോട് ശരിയായി ബന്ധിപ്പിച്ച് [a] ‘നിന്റെ മുമ്പിൽ’ എന്ന പ്രയോഗത്തിനും [b] אַנְשֵׁי חַיִל എന്നതിനും ചേർത്തിരിക്കുന്നു.
