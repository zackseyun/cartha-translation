source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹ֑ה וַ/יֵּצֵ֖א מִ/לִּ/פְנֵ֥י פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് ഫറവോനെ അനുഗ്രഹിച്ചു[a]; പിന്നെ ഫറവോന്റെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോനെ അഭിവാദ്യം ചെയ്തു” / “ഫറവോനോട് യാത്രപറഞ്ഞു”; എബ്രായക്രിയ സാധാരണയായി “അനുഗ്രഹിച്ചു” എന്നാണ് അർഥമാക്കുന്നത്. എന്നാൽ രാജസദസ്സിലെ കൂടിക്കാഴ്ചയുടെ പശ്ചാത്തലത്തിൽ അതിന് ഔപചാരികമായ അഭിവാദനത്തിന്റെയോ യാത്രപറച്ചിലിന്റെയോ ഭാവവും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘അനുഗ്രഹിക്കുക’ എന്നാണ്. രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ ഔപചാരിക അഭിവാദനമോ യാത്രപറച്ചിലോ എന്ന ഭാവം ഇതിൽ ഉൾപ്പെടാമെങ്കിലും, തൊട്ടുമുമ്പുള്ള വാക്യം 7-ലെയും ഇവിടത്തെയും പ്രാഥമിക പദാർഥം നിലനിർത്തുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ടിരിക്കുന്ന വ്യക്തിനാമരൂപം.
- source_word: אֶת
  choice: '[നേരിട്ടുള്ള കർമസൂചകം; പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ പ്രത്യേകം പദസമാനത ആവശ്യമില്ല.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാളത്തിൽ പരിചിതമായ രൂപം.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുപോയി
  rationale: יצא എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള ചലനവും രാജസന്നിധിയിൽനിന്നുള്ള യാത്രയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִלִּפְנֵי
  choice: അവന്റെ സന്നിധിയിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘ഫറവോന്റെ മുമ്പിൽനിന്ന്’ എന്നതിനെക്കാൾ, രാജാവുമായുള്ള കൂടിക്കാഴ്ചയിൽനിന്നുള്ള മടങ്ങിപ്പോക്ക് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സൂച്യം സമീപസ്ഥനായ ഫറവോനാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു ക്രമത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് ‘അനുഗ്രഹിച്ചശേഷം’ എന്ന രൂപം പ്രവർത്തികളുടെ തുടർച്ച വ്യക്തമാക്കുന്നു. ‘സന്നിധി’ രാജസദസ്സിന്റെ ഔപചാരികതയ്ക്ക് യോജിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദമാണ്.
