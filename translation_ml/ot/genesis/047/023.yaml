source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫ് ജനത്തോടു പറഞ്ഞു: “നോക്കൂ, ഇന്ന് ഞാൻ നിങ്ങളെയും നിങ്ങളുടെ നിലത്തെയും ഫറവോനുവേണ്ടി വാങ്ങിയിരിക്കുന്നു.[a] ഇതാ, നിങ്ങൾക്കു വിത്ത്; നിങ്ങൾ നിലം വിതയ്ക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വായത്തമാക്കിയിരിക്കുന്നു.” എബ്രായ ക്രിയയ്ക്ക് വാങ്ങുക എന്ന അർഥത്തോടൊപ്പം പൊതുവായി സ്വന്തമാക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ഈജിപ്തിലെ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֵן
  choice: നോക്കൂ
  rationale: ഊന്നലോടെയുള്ള പ്രഖ്യാപനം അവതരിപ്പിക്കുന്ന ദർശകാവ്യയത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: קָנִיתִי
  choice: വാങ്ങിയിരിക്കുന്നു
  rationale: קנה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള വാങ്ങൽ/സ്വായത്തമാക്കൽ അർഥവും ഈ സാമ്പത്തിക ഇടപാടിന്റെ പശ്ചാത്തലവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶתְכֶם
  choice: നിങ്ങളെ
  rationale: ജനങ്ങൾ തന്നെയാണ് ക്രിയയുടെ നേരിട്ടുള്ള കർമം; ലളിതമായ സർവനാമം മൂലപാഠത്തിന്റെ കടുപ്പം മറയ്ക്കുന്നില്ല.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: ഇടപാട് നടന്ന വർത്തമാനദിനത്തെ നേരിട്ട് അടയാളപ്പെടുത്തുന്നു.
- source_word: אַדְמַתְכֶם
  choice: നിങ്ങളുടെ നിലം
  rationale: കൃഷിയോഗ്യമായ ഭൂമിയുടമസ്ഥതയാണ് സന്ദർഭം; ‘നിലം’ മലയാളത്തിൽ ഭൂമിയെയും കൃഷിയിടത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְפַרְעֹה
  choice: ഫറവോനുവേണ്ടി
  rationale: യോസേഫ് ഫറവോന്റെ പേരിൽ ഈ സ്വായത്തമാക്കൽ നടത്തിയെന്ന ലാമെദിന്റെ ഗുണഭോക്തൃ/ഉടമസ്ഥതാ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: הֵא
  choice: ഇതാ
  rationale: യോസേഫ് ഇപ്പോൾ നൽകുന്ന വിത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ദർശകശക്തി ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: זֶרַע
  choice: വിത്ത്
  rationale: വിതയ്ക്കാനുള്ള ധാന്യവിത്തിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ക്രിയ ഉപയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וּזְרַעְתֶּם
  choice: നിങ്ങൾ ... വിതയ്ക്കണം
  rationale: നേരിട്ടുള്ള പ്രസംഗത്തിലെ നിർദേശാത്മക ശക്തിയും ഹീബ്രു സംയോജകവും സ്വാഭാവിക മലയാളത്തിൽ പൂർണ്ണമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הָאֲדָמָה
  choice: നിലം
  rationale: കൃഷി ചെയ്യേണ്ട മണ്ണ്/ഭൂമി എന്ന അർഥം; മുമ്പത്തെ ‘നിലം’ എന്ന പദവുമായി യോജിപ്പ് പാലിക്കുന്നു.
theological_decisions:
- issue: ജനങ്ങളെയും നിലത്തെയും ഫറവോനുവേണ്ടി קנה ചെയ്തതിന്റെ സ്വഭാവം
  choice: വാങ്ങിയിരിക്കുന്നു
  alternative: സ്വായത്തമാക്കിയിരിക്കുന്നു
  rationale: മൂലക്രിയ വാങ്ങുക എന്നും പൊതുവായി സ്വായത്തമാക്കുക എന്നും അർഥമാക്കാം. മുഖ്യപാഠത്തിൽ ഇടപാടിന്റെ നേരിട്ടുള്ള സാമ്പത്തിക അർഥം നിലനിർത്തി, വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി; ജനങ്ങളുടെ നിലയെ അതിലപ്പുറം സിദ്ധാന്തപരമായി നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. നിയമ-സാമ്പത്തിക സന്ദർഭത്തിന്റെ കടുപ്പം മൃദൂകരിക്കാതെ സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു.
