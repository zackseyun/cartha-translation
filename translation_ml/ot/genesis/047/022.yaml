  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: ml
  text: പുരോഹിതന്മാരുടെ ഭൂമി മാത്രം അവൻ വാങ്ങിയില്ല; കാരണം, ഫറവോനിൽനിന്ന് പുരോഹിതന്മാർക്കു നിശ്ചിതമായ ഒരു വിഹിതമുണ്ടായിരുന്നു[a], ഫറവോൻ അവർക്കു നൽകിയ അവരുടെ വിഹിതം അവർ ഭക്ഷിച്ചു. അതുകൊണ്ട് അവർ തങ്ങളുടെ ഭൂമി വിറ്റില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്ഥിരമായ ഉപജീവനവിഹിതം,” “ഓഹരി,” അല്ലെങ്കിൽ “ഭക്ഷണവിഹിതം” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായത്തിലെ חֹק / חֻקָּם എന്നത് പ്രധാനമായും ഒരു നിയമചട്ടത്തെയല്ല, ഔദ്യോഗികമായി അനുവദിച്ച ഉപജീവനസഹായത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: മുൻവിവരണത്തിലെ പൊതുസ്ഥിതിയിൽനിന്ന് പുരോഹിതന്മാരുടെ ഭൂമിയെ ഒഴിവാക്കുന്ന നിയന്ത്രണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരുടെ ഭൂമി
  rationale: പുരോഹിതന്മാരുടെ ഉടമസ്ഥതയിലുള്ള ഭൂസ്വത്തിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: קָנָה
  choice: വാങ്ങിയില്ല
  rationale: ക്ഷാമകാലത്തെ ഭൂമി വാങ്ങൽ എന്ന സാമ്പത്തികസന്ദർഭത്തിന് യോജിച്ച നേരിട്ടുള്ള പദം.
- source_word: כִּי
  choice: കാരണം
  rationale: പുരോഹിതന്മാരുടെ ഭൂമി വാങ്ങാതിരുന്നതിന്റെ കാരണം വ്യക്തമാക്കുന്നു.
- source_word: חֹק / חֻקָּם
  choice: നിശ്ചിത വിഹിതം / ആ വിഹിതം
  rationale: ഇവിടെ നിയമചട്ടം എന്നതിലുപരി ഫറവോൻ ഔദ്യോഗികമായി അനുവദിച്ച ഉപജീവനവിഹിതമാണ് ഉദ്ദേശിക്കുന്നത്; 'നിശ്ചിത' എന്നത് നിയമിതമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת פַּרְעֹה
  choice: ഫറവോനിൽനിന്ന്
  rationale: വിഹിതത്തിന്റെ ഉറവിടം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: ആ വിഹിതംകൊണ്ടാണ് അവർ ഉപജീവിച്ചിരുന്നത്
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ 'തിന്നുക' ഇവിടെ ആ വിഹിതം ആശ്രയിച്ചു ജീവിക്കുക എന്ന സന്ദർഭാർഥത്തിലാണ്; സാധാരണ മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן לָהֶם פַּרְעֹה
  choice: ഫറവോൻ അവർക്കു നൽകിയ
  rationale: വിഹിതം നൽകിയതു ഫറവോനാണെന്ന ബന്ധവാക്യം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻപറഞ്ഞ കാരണത്തിൽനിന്നുള്ള ഫലം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מָכְרוּ
  choice: വിറ്റില്ല
  rationale: ഭൂമി കൈമാറ്റം ചെയ്യാത്തതിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള വാണിജ്യപദം.
- source_word: אַדְמָתָם
  choice: തങ്ങളുടെ ഭൂമി
  rationale: പുരോഹിതന്മാരുടെ സ്വന്തമായ ഭൂസ്വത്താണെന്ന പ്രത്യാവർത്തകബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
