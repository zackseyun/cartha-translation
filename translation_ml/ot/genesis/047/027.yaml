source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ ഈജിപ്തുദേശത്തിലെ ഗോശെൻദേശത്ത് താമസമാക്കി; അവർ അവിടെ സ്വത്തുക്കൾ സമ്പാദിച്ചു[a], സന്താനസമൃദ്ധരായി അത്യന്തം പെരുകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ അവിടെ സ്ഥിരതാമസമുറപ്പിച്ചു.’ കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവർ അവിടെ പിടിപെട്ടു/ഉറപ്പിക്കപ്പെട്ടു.’ എബ്രായക്രിയയ്ക്ക് ദേശത്ത് കൈവശം നേടുക, അല്ലെങ്കിൽ അവിടെ ഉറച്ചുനിൽക്കുക എന്ന അർഥങ്ങൾ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസമാക്കി
  rationale: ישׁב ഇവിടെ താത്കാലികമായി പാർക്കുന്നതിനെക്കാൾ സ്ഥിരവാസം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘താമസമാക്കി’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായപാഠത്തിലെ പേര് അതേപടി നിലനിർത്തുന്നു. ഇവിടെ യാക്കോബ് തന്റെ കുടുംബത്തെ പ്രതിനിധീകരിക്കുന്നതിനാൽ, പിന്നാലെയുള്ള ബഹുവചനക്രിയകളിലേക്കുള്ള മാറ്റവും സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തുകയും, ഗോശെൻ ഈജിപ്തിനുള്ളിലെ പ്രദേശമാണെന്ന് സ്വാഭാവിക മലയാളഘടനയിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻദേശത്ത്
  rationale: എബ്രായത്തിലെ ‘ദേശം’ എന്ന പ്രാദേശിക ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: അവർ അവിടെ അവകാശങ്ങൾ നേടി
  rationale: אחז എന്ന ക്രിയയുടെ നിഫാൽരൂപം ഇവിടെ ഭൂമിയിൽ കൈവശമോ സ്ഥിരമായ അവകാശമോ നേടുന്നതിനെ സൂചിപ്പിക്കാം. ‘അവകാശങ്ങൾ നേടി’ പ്രധാന സന്ദർഭാർഥം നൽകുന്നു; ക്രിയയുടെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפְרוּ
  choice: സന്താനസമൃദ്ധരായി
  rationale: ഉല്പത്തിയിൽ ആവർത്തിക്കുന്ന ഫലവത്താകലിന്റെയും സന്താനവർധനയുടെയും പ്രമേയം മനുഷ്യരെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: അത്യന്തം പെരുകി
  rationale: רבה എന്ന വർധനക്രിയയും מְאֹד എന്ന ശക്തമായ തീവ്രതയും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേൽ’ എന്നതിന്റെ പ്രതിനിധാനപരമായ അർഥവും ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റവും
  choice: ആദ്യം ‘ഇസ്രായേൽ’ എന്ന് ഏകവചനനാമം നിലനിർത്തി, തുടർന്ന് ‘അവർ’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു.
  alternative: മുഴുവൻ വാക്യത്തിലും ‘ഇസ്രായേൽമക്കൾ’ എന്നോ ‘യാക്കോബ്’ എന്നോ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠം ആദ്യം പിതാമഹനായ ഇസ്രായേലിനെ ഏകവചനത്തിൽ അവതരിപ്പിച്ച ശേഷം കുടുംബത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിലേക്ക് മാറുന്നു. ആ പ്രതിനിധാനപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈജിപ്തും ഗോശെനും സംബന്ധിച്ച ‘ദേശം’ എന്ന പ്രാദേശിക സൂചനയും, ഉല്പത്തിയിലെ സന്താനവർധനപ്രമേയവും, ‘ഇസ്രായേൽ’ എന്ന ഏകവചനത്തിൽനിന്നുള്ള ബഹുവചനമാറ്റവും സംരക്ഷിച്ചു.
