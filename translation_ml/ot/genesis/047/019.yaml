  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: ml
  text: എന്തിന് ഞങ്ങളും ഞങ്ങളുടെ നിലവും അങ്ങയുടെ കൺമുന്നിൽ നശിച്ചുപോകണം?[a] ആഹാരത്തിനു പകരമായി[b] ഞങ്ങളെയും ഞങ്ങളുടെ നിലത്തെയും വാങ്ങിക്കൊള്ളുക. അങ്ങനെ ഞങ്ങളും ഞങ്ങളുടെ നിലവും ഫറവോന്റെ അടിമകളായിത്തീരും.[c] വിത്തു തരണമേ; അങ്ങനെ ഞങ്ങൾ ജീവിക്കാനും മരിക്കാതിരിക്കാനും നിലം പാഴായിപ്പോകാതിരിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ ദൃഷ്ടിയിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അപ്പത്തിനു പകരമായി.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ദാസന്മാരായിത്തീരും.” എബ്രായപദം വിവിധ തരത്തിലുള്ള സേവന-അടിമത്താവസ്ഥകളെ സൂചിപ്പിക്കാം; ഇവിടെ സാമ്പത്തികമായി ബന്ധിതരാകുന്ന അർഥമാണ് മുന്നിട്ടുനിൽക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: എന്തിന് ... നശിക്കണം?
  rationale: റെടോറിക്കൽ അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്നു. ഇവിടെ ജനങ്ങളോടൊപ്പം നിലവും കർത്താവായതിനാൽ, മലയാളത്തിൽ ഇരുവർക്കും സ്വാഭാവികമായി ചേരുന്ന ‘നശിക്കുക’ തിരഞ്ഞെടുത്തു.
- source_word: לְעֵינֶיךָ
  choice: അങ്ങയുടെ കൺമുന്നിൽ
  rationale: യോസേഫിന്റെ സാന്നിധ്യത്തിലും ദൃഷ്ടിയിലും എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യത സംരക്ഷിക്കുന്നു; ആദരസൂചകമായ അഭിസംബോധന സന്ദർഭോചിതമാണ്.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: ഞങ്ങളും ഞങ്ങളുടെ നിലവും
  rationale: ജോടിയായ גם ... גם ജനങ്ങളെയും കൃഷിനിലത്തെയും തുല്യമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: ഞങ്ങളെയും ഞങ്ങളുടെ നിലത്തെയും വാങ്ങിക്കൊള്ളുക
  rationale: ക്ഷാമകാലത്തെ വിലകൊടുത്തുള്ള ഏറ്റെടുക്കൽ എന്ന קנהയുടെ വാണിജ്യാർഥം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: בַּלָּחֶם
  choice: ആഹാരത്തിനു പകരമായി
  rationale: לחם അക്ഷരാർഥത്തിൽ ‘അപ്പം’ ആണെങ്കിലും ഈ ക്ഷാമസന്ദർഭത്തിൽ പൊതുവായ ആഹാരത്തെ സൂചിപ്പിക്കുന്നു; ב വിലയോ വിനിമയമാധ്യമമോ അടയാളപ്പെടുത്തുന്നതിനാൽ ‘പകരമായി’ വ്യക്തമാക്കി.
- source_word: וְנִהְיֶה ... עֲבָדִים לְפַרְעֹה
  choice: ഫറവോന്റെ അടിമകളായിത്തീരും
  rationale: വാങ്ങലിന്റെ ഫലമായി ഉണ്ടാകുന്ന ബന്ധിതാവസ്ഥയും ഫറവോനോടുള്ള ഉടമസ്ഥബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: וְתֶן זֶרַע
  choice: വിത്തു തരണമേ
  rationale: കൃഷിസന്ദർഭത്തിലെ വിതയ്ക്കാനുള്ള ധാന്യമാണ് ഉദ്ദേശ്യം. എബ്രായത്തിൽ പരോക്ഷകർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: നിലം പാഴായിപ്പോകാതിരിക്കാനും
  rationale: שמם എന്ന ക്രിയയുടെ വിജനമാകുക, ഉപയോഗശൂന്യമാകുക എന്ന കാർഷികസന്ദർഭാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: עֲבָדִים എന്ന പദത്തിന്റെ സാമൂഹിക-നിയമപരമായ തീവ്രത
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: ഭക്ഷണത്തിനായി തങ്ങളെയും നിലത്തെയും വാങ്ങാൻ ആവശ്യപ്പെടുന്ന സാമ്പത്തിക-നിയമപരമായ സന്ദർഭത്തിൽ സ്വാതന്ത്ര്യനഷ്ടം പ്രധാനമാണ്. ‘സേവകർ’ അത് മൃദൂകരിക്കും; ‘അടിമകൾ’ ആശയത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അപേക്ഷാഭാവം ഉപയോഗിച്ചു. ‘അങ്ങയുടെ’, ‘തരണമേ’ എന്നിവ യോസേഫിനോടുള്ള ആദരപൂർവ അഭിസംബോധന വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ ലക്ഷ്യവാക്യങ്ങളുടെ ബന്ധം മലയാളത്തിൽ ‘ജീവിക്കാനും ... പാഴായിപ്പോകാതിരിക്കാനും’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തി.
