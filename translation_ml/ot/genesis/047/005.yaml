  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה אֶל יוֹסֵ֖ף לֵ/אמֹ֑ר אָבִ֥י/ךָ וְ/אַחֶ֖י/ךָ בָּ֥אוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/005.yaml
  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ യോസേഫിനോടു പറഞ്ഞു[a]: “നിന്റെ പിതാവും സഹോദരന്മാരും നിന്റെ അടുക്കൽ വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ഫറവോൻ യോസേഫിനോടു ഇങ്ങനെ പറഞ്ഞു: ‘നിന്റെ പിതാവും സഹോദരന്മാരും നിന്റെ അടുക്കൽ വന്നു.’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമസൂചന സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാള ബൈബിൾപരമ്പരയിൽ സുപരിചിതമായ രൂപം.
- source_word: אֶל יוֹסֵף
  choice: യോസേഫിനോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സ്വാഭാവിക മലയാള ദത്തിവിഭക്തിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: പ്രധാനവാചകത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ‘പറഞ്ഞു’ എന്നതിന് പിന്നാലെ നേരിട്ടുള്ള ഉദ്ധരണി വരുന്നതിനാൽ ‘പറഞ്ഞുകൊണ്ട്/ഇങ്ങനെ പറഞ്ഞു’ എന്ന അധിക പ്രയോഗം മലയാളത്തിൽ ആവർത്തനമാകും; ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: യോസേഫിനോടുള്ള ഏകവചന ദ്വിതീയപുരുഷ ഉടമസ്ഥത നിലനിർത്തുന്നു; ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ കുടുംബപദമാണ്.
- source_word: וְאַחֶיךָ
  choice: സഹോദരന്മാരും
  rationale: പുരുഷലിംഗ ബഹുവചനമായ ‘സഹോദരന്മാർ’ തന്നെയാണ് നൽകിയിരിക്കുന്നത്; പൊതുവായ ‘കുടുംബം’ എന്നു വിപുലീകരിച്ചിട്ടില്ല.
- source_word: בָּאוּ
  choice: വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ വരവിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ
  rationale: യോസേഫിനെ ലക്ഷ്യമാക്കിയുള്ള ചലനം കൃത്യമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇവിടെ’ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനക്രമം ‘അപ്പോൾ’ എന്നതിലൂടെ നിലനിർത്തി; לֵאמֹר എന്ന ആവർത്തനാത്മക വാക്യപ്രവേശകം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
