base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: ml
  text: യോസേഫ് തന്റെ അപ്പനും സഹോദരന്മാർക്കും തന്റെ അപ്പന്റെ കുടുംബത്തിലുള്ള എല്ലാവർക്കും അവരുടെ കൊച്ചുകുട്ടികളുടെ എണ്ണത്തിനനുസരിച്ച്[b] ആഹാരം[a] നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അപ്പം’. ഇവിടെ എബ്രായപദം ഭക്ഷണസാധനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘കൊച്ചുകുട്ടികളുടെ വായ്ക്കനുസരിച്ച്’. കുട്ടികളുടെ എണ്ണത്തിനോ അവരുടെ ആവശ്യങ്ങൾക്കോ അനുസരിച്ച് എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: ആഹാരം നൽകി പോറ്റി
  rationale: പിയേൽ രൂപത്തിലുള്ള כלכל ഭൗതികമായി പരിപാലിക്കുക, ഉപജീവനം നൽകുക എന്ന അർഥം വഹിക്കുന്നു. ക്ഷാമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആഹാരം നൽകിക്കൊണ്ടുള്ള തുടർച്ചയായ സംരക്ഷണം ഈ പ്രയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֶחֶם
  choice: ആഹാരം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘അപ്പം’ ആണെങ്കിലും ഇവിടെ അത് ഭക്ഷണസാധനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ക്ഷാമകാലത്തെ വിതരണസന്ദർഭത്തിൽ ‘ആഹാരം’ കൂടുതൽ യോജിച്ചതാണ്.
- source_word: כָּל בֵּית אָבִיו
  choice: അപ്പന്റെ കുടുംബത്തിലുള്ള എല്ലാവരെയും
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെയല്ല, കുടുംബത്തെയും അതിൽ ഉൾപ്പെട്ടവരെയും സൂചിപ്പിക്കുന്നു. ആ സാമൂഹിക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְפִי
  choice: എണ്ണത്തിനനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘വായ്ക്കനുസരിച്ച്’ എന്നാണെങ്കിലും ഈ പ്രയോഗം അളവ്, അനുപാതം, അല്ലെങ്കിൽ ആളുകളുടെ എണ്ണം സൂചിപ്പിക്കുന്ന ഒരു ഭാഷാശൈലിയാണ്. സന്ദർഭത്തിലെ വിതരണാർഥം ‘എണ്ണത്തിനനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
- source_word: הַטָּף
  choice: അവരുടെ കൊച്ചുകുട്ടികൾ
  rationale: טַף കുടുംബങ്ങളിലെ ചെറിയ കുട്ടികളെയോ ആശ്രിതരായ കുഞ്ഞുങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘കൊച്ചുകുട്ടികൾ’ പ്രായസൂചനയും കുടുംബബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אָבִיו ... אֶחָיו
  choice: തന്റെ അപ്പൻ ... സഹോദരന്മാർ
  rationale: അടുത്ത ബന്ധങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദങ്ങളാണിവ. സന്ദർഭത്തിൽ യോസേഫിന്റെ പുരുഷസഹോദരന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആഹാരം നൽകി പോറ്റി’ എന്നത് ക്ഷാമകാലത്തെ സാധനവിതരണവും തുടർച്ചയായ പരിപാലനവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു. അക്ഷരാർഥങ്ങളും പ്രയോഗത്തിലെ എണ്ണം/ആവശ്യം എന്ന സൂക്ഷ്മതയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
