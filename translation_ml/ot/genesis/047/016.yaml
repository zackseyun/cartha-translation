source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: ml
  text: 'യോസേഫ് പറഞ്ഞു: “നിങ്ങളുടെ മൃഗസമ്പത്ത് കൊണ്ടുവരൂ; പണം തീർന്നുപോയെങ്കിൽ, നിങ്ങളുടെ മൃഗസമ്പത്തിനു പകരമായി ഞാൻ നിങ്ങൾക്കു നൽകാം[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “ഞാൻ നിങ്ങൾക്കു നൽകാം” എന്നതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; തൊട്ടുമുമ്പുള്ള ക്ഷാമസന്ദർഭത്തിൽ അത് ഭക്ഷണമാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: കൊണ്ടുവരൂ
  rationale: ഈ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ സ്വത്ത് കൈമാറാനായി ഹാജരാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഭരണപരമായ ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവരൂ’ സ്വാഭാവികമാണ്.
- source_word: מִקְנֵיכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികൾ
  rationale: מִקְנֶה വളർത്തുമൃഗങ്ങളെയും മൃഗസമ്പത്തിനെയും വ്യാപകമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കന്നുകാലികൾ’ സന്ദർഭോചിതവും ഗ്രാഹ്യവുമാണ്.
- source_word: וְאֶתְּנָה לָכֶם
  choice: ഞാൻ നിങ്ങൾക്കു ഭക്ഷണം തരാം
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല. എന്നാൽ തൊട്ടുമുമ്പുള്ള ക്ഷാമസന്ദർഭത്തിൽ ആവശ്യപ്പെടുന്നത് ഭക്ഷണമായതിനാൽ വ്യക്തതയ്ക്കായി ‘ഭക്ഷണം’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּמִקְנֵיכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികൾക്കു പകരമായി
  rationale: בְ ഇവിടെ കൈമാറ്റബന്ധം സൂചിപ്പിക്കുന്നു; ‘പകരമായി’ ഇടപാടിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: അടിസ്ഥാനമായ ഉപാധിസൂചക അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇതിന് ‘പണം തീർന്നതിനാൽ’ എന്ന കാരണസൂചനയും ഉണ്ടായേക്കാം.
- source_word: אָפֵס כָּסֶף
  choice: പണം തീർന്നുപോയി
  rationale: אָפֵס പൂർണമായി ഇല്ലാതാകുകയോ തീരുകയോ ചെയ്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘തീർന്നുപോയി’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
