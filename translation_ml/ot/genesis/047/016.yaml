  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവർത്തനം. മൂലത്തിലെ ഉപാധിസൂചകമായ אִם ‘എങ്കിൽ’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ സാധ്യമായ കാരണാർഥം വ്യാഖ്യാനത്തിലൂടെ നിർബന്ധിച്ചിട്ടില്ല. വ്യക്തമാക്കാത്ത കർമം ക്ഷാമസന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘ഭക്ഷണം’ എന്നു പൂരിപ്പിച്ചു.
