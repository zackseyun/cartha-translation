source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִשָּֽׁבְעָ/ה֙ לִ֔/י וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַ/מִּטָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എനിക്കു സത്യം ചെയ്തുതരുക.” അവൻ അവനോടു സത്യം ചെയ്തു. പിന്നെ ഇസ്രായേൽ കിടക്കയുടെ തലഭാഗത്ത് വണങ്ങി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വടിയുടെ തലഭാഗത്ത്.” ഹീബ്രായ വ്യഞ്ജനപാഠം ഇങ്ങനെയും വായിക്കാം; സെപ്റ്റുവജിന്റിലും എബ്രായർ 11:21-ലും പ്രതിഫലിക്കുന്നത് ഈ അർഥമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: എനിക്കു സത്യം ചെയ്തുതരുക
  rationale: സത്യപ്രതിജ്ഞ ആവശ്യപ്പെടുന്ന നേരിട്ടുള്ള ആജ്ഞയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: അവൻ അദ്ദേഹത്തോടു സത്യം ചെയ്തു
  rationale: മുൻപത്തെ സത്യപ്രതിജ്ഞാ ക്രിയയുമായുള്ള പദസംബന്ധം നിലനിർത്തുകയും ഹീബ്രായിലെ സർവനാമരൂപം അനാവശ്യമായി പേരുകൾ ചേർത്ത് വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു
  rationale: ശാരീരികമായി കുനിയുക എന്നും ആരാധിക്കുക എന്നും അർഥമാകാവുന്ന ക്രിയ ഇവിടെ വ്യക്തമായ ദൈവിക കർമവിഷയമില്ലാത്തതിനാൽ, ആരാധന എന്ന വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതെ ശരീരചലനം സൂചിപ്പിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന വ്യക്തിനാമം യാക്കോബ് എന്നു സമന്വയിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: കിടക്കയുടെ തലഭാഗത്തിന്മേൽ
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളനുസരിച്ചുള്ള ‘കിടക്ക’ എന്ന വായനയും עַל എന്ന സ്ഥാനസൂചനയും കഴിയുന്നത്ര നേരിട്ട്, മനസ്സിലാകുന്ന മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉല്പത്തി 47:31-ലെ വ്യഞ്ജനപാഠം ‘കിടക്ക’ എന്നും ‘വടി’ എന്നും വായിക്കാവുന്നതും എബ്രായർ 11:21 സെപ്റ്റുവജിന്റ് അനുബന്ധമായ ‘വടി’ വായന പ്രതിഫലിപ്പിക്കുന്നതുമാണ്.
  choice: കിടക്ക
  alternative: വടി
  rationale: ഉല്പത്തിയുടെ പ്രധാനപാഠത്തിൽ ലഭ്യമായ മസോരറ്റിക് ഹീബ്രായിലെ הַמִּטָּה (‘കിടക്ക’) എന്ന സ്വരീകരണം പിന്തുടരുന്നു. എന്നാൽ വ്യഞ്ജനങ്ങളുടെ മറ്റൊരു സാധുവായ വായനയും അതിന്റെ കാനോനിക പ്രസക്തിയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സർവനാമങ്ങളുടെ മൂലപാഠപരമായ അനിശ്ചിതത്വം നിലനിർത്തിയിരിക്കുന്നു; ‘ആരാധിച്ചു’ എന്ന ദൈവശാസ്ത്രപരമായി കൂടുതൽ നിർണായകമായ വിവർത്തനം ഒഴിവാക്കി.
