id: GEN.47.28
reference: Genesis 47:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְחִ֤י יַעֲקֹב֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְהִ֤י יְמֵֽי יַעֲקֹב֙ שְׁנֵ֣י חַיָּ֔י/ו שֶׁ֣בַע שָׁנִ֔ים וְ/אַרְבָּעִ֥ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: ml
  text: യാക്കോബ് ഈജിപ്തുദേശത്ത് പതിനേഴു വർഷം ജീവിച്ചു. യാക്കോബിന്റെ ആയുഷ്കാലം[a] ആകെ നൂറ്റിനാൽപ്പത്തേഴു വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “യാക്കോബിന്റെ നാളുകൾ, അവന്റെ ജീവിതവർഷങ്ങൾ”; ഇത് അദ്ദേഹത്തിന്റെ ആയുഷ്കാലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.'
    reason: മൂലപാഠത്തിലെ ആവർത്തനാത്മകമായ എബ്രായ പ്രയോഗം മുഖ്യവാക്യത്തിൽ സ്വാഭാവിക മലയാളമായി നൽകിയതിനാൽ അതിന്റെ പദാനുപദരൂപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיְחִי
  choice: ജീവിച്ചു
  rationale: חיה എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന നേരിട്ടുള്ള ആഖ്യാനാർഥം, പറഞ്ഞിരിക്കുന്ന കാലയളവോളം യാക്കോബ് ജീവിച്ചു എന്നതാണ്.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്ത്
  rationale: മൂലപാഠത്തിലെ אֶרֶץ (‘ദേശം’) നിലനിർത്തുകയും സ്വാഭാവികമായ മലയാളസംയുക്തരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: പതിനേഴു വർഷം
  rationale: സംഖ്യയും കാലയളവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְמֵי יַעֲקֹב שְׁנֵי חַיָּיו
  choice: യാക്കോബിന്റെ ആയുഷ്കാലം
  rationale: ‘യാക്കോബിന്റെ നാളുകൾ, അവന്റെ ജീവിതവർഷങ്ങൾ’ എന്ന എബ്രായ സമാനാധികരണ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപം; മൂലരൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: നൂറ്റിനാൽപ്പത്തേഴു വർഷം
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം മലയാളത്തിലെ പതിവനുസരിച്ച് ക്രമപ്പെടുത്തി, ആകെ സംഖ്യ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי
  choice: ആകെ ... വർഷമായിരുന്നു
  rationale: ആയുഷ്കാലത്തിന്റെ മൊത്തം സംഗ്രഹിക്കുന്ന ഈ വാക്യഭാഗത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
