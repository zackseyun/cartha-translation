translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഫറവോനോടുള്ള രാജസദസ്സിലെ വിനയം ‘അങ്ങയുടെ’, ‘ദയവായി’, ‘അനുവദിക്കണമേ’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി; അതേസമയം വാക്യം അനാവശ്യമായി പുരാതനശൈലിയിലാക്കിയിട്ടില്ല.
