reference: Genesis 47:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה לָ/ג֣וּר בָּ/אָרֶץ֮ בָּאנוּ֒ כִּי אֵ֣ין מִרְעֶ֗ה לַ/צֹּאן֙ אֲשֶׁ֣ר לַ/עֲבָדֶ֔י/ךָ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/עַתָּ֛ה יֵֽשְׁבוּ נָ֥א עֲבָדֶ֖י/ךָ בְּ/אֶ֥רֶץ גֹּֽשֶׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: ml
  text: 'അവർ ഫറവോനോടു പറഞ്ഞു: “ഈ ദേശത്ത് പരദേശികളായി പാർക്കാനാണ് ഞങ്ങൾ വന്നിരിക്കുന്നത്[a]. കനാൻദേശത്ത് ക്ഷാമം അതികഠിനമായതിനാൽ അങ്ങയുടെ ദാസന്മാരുടെ ആട്ടിൻപറ്റങ്ങൾക്കു മേച്ചിൽപ്പുറമില്ല. ഇപ്പോൾ അങ്ങയുടെ ദാസന്മാരെ ദയവായി ഗോശെൻദേശത്ത് താമസിക്കാൻ അനുവദിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ ദേശത്ത് താത്കാലിക താമസക്കാരായി കഴിയാനാണ് ഞങ്ങൾ വന്നിരിക്കുന്നത്.’'
    reason: גור എന്ന ക്രിയയിൽ പരദേശവാസത്തിന്റെയും താത്കാലിക താമസത്തിന്റെയും ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നതിനാൽ പദാർഥപരമായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: לָגוּר
  choice: പരദേശികളായി പാർക്കാൻ
  rationale: גור ഇവിടെ സ്ഥിരമായി കുടിയേറുന്നതിനെക്കാൾ അന്യദേശത്ത് താത്കാലികമോ ആശ്രിതമോ ആയി വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പരദേശികളായി പാർക്കുക’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ഈ ദേശത്ത്
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് അവർ ഇപ്പോൾ എത്തിയിരിക്കുന്ന ഈജിപ്താണ്; മലയാളത്തിൽ ‘ഈ ദേശത്ത്’ എന്ന് പറയുന്നത് സംഭാഷണസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִרְעֶה
  choice: മേയാൻ ഇടം
  rationale: മൃഗങ്ങൾക്ക് മേയാനുള്ള പ്രദേശമോ പുല്ലോ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘മേച്ചിൽപ്പുറം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לַצֹּאן
  choice: ആട്ടിൻപറ്റങ്ങൾക്ക്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം. മലയാളത്തിലെ പതിവുപ്രയോഗമായ ‘ആട്ടിൻപറ്റങ്ങൾ’ കൂട്ടസൂചന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരുടെ
  rationale: ഉടമസ്ഥതയും ഫറവോനോടുള്ള വിനീതമായ സ്വയംപരാമർശവും സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: כָבֵד הָרָעָב
  choice: ക്ഷാമം അതികഠിനമായതിനാൽ
  rationale: כבד എന്നതിന്റെ അക്ഷരാർഥം ‘ഭാരം’ ആണെങ്കിലും ക്ഷാമത്തോടൊപ്പം അത് തീവ്രതയെ സൂചിപ്പിക്കുന്നു; ‘അതികഠിനം’ ആ വ്യവഹാരാർഥം നൽകുന്നു.
- source_word: יֵשְׁבוּ נָא
  choice: ദയവായി … താമസിക്കാൻ അനുവദിക്കണമേ
  rationale: യുസ്സീവ് രൂപവും נָאയും ചേർന്ന വിനീതമായ അപേക്ഷയെ ആധുനിക മാന്യമായ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഇവിടെ രാജസന്നിധിയിലെ വിനീതമായ സ്വയംവിശേഷണമാണ് മുൻനിരയിൽ; അടിമത്തസ്ഥിതി നിർബന്ധമായി സൂചിപ്പിക്കുന്ന ‘അടിമകൾ’ക്കാൾ ‘ദാസന്മാർ’ സന്ദർഭോചിതമാണ്.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: ഗോശെൻദേശം
  rationale: ഹീബ്രായ നിർമാണത്തിലെ ഭൂമിശാസ്ത്രപരമായ വ്യക്തത സംക്ഷിപ്തമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
