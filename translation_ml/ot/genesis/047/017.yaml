  rationale: മുഴുവൻ വളർത്തുമൃഗസമ്പത്തിനെയും സൂചിപ്പിക്കുന്ന മִקְנֶה-യെ ‘വളർത്തുമൃഗങ്ങൾ’ എന്നു തിരുത്തി; പ്രത്യേകമായി പശുവർഗത്തെ സൂചിപ്പിക്കുന്ന മִקְנֵה הַבָּקָר-ന് നിലവിലുള്ള ‘കന്നുകാലിക്കൂട്ടങ്ങൾ’ നിലനിർത്തി. ഇതിലൂടെ വാക്യത്തിന്റെ സമഗ്രമായ കൈമാറ്റാർഥവും പട്ടികയിലെ വിഭാഗവ്യത്യാസവും വ്യക്തമായി സംരക്ഷിക്കപ്പെടുന്നു.
