id: GEN.47.17
reference: Genesis 47:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: ml
  text: അങ്ങനെ അവർ തങ്ങളുടെ വളർത്തുമൃഗങ്ങളെ യോസേഫിന്റെ അടുക്കൽ കൊണ്ടുവന്നു. യോസേഫ് കുതിരകൾക്കും ആട്ടിൻപറ്റങ്ങൾക്കും കന്നുകാലിക്കൂട്ടങ്ങൾക്കും കഴുതകൾക്കും പകരമായി അവർക്ക് അപ്പം കൊടുത്തു. ആ വർഷം അവരുടെ സകല വളർത്തുമൃഗങ്ങൾക്കും പകരമായി അപ്പം നൽകി അവരെ പോറ്റി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അപ്പംകൊണ്ട് അവരെ നയിച്ചു.” എബ്രായക്രിയയ്ക്ക് “നയിക്കുക, നടത്തുക, പരിപാലിക്കുക” എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ ക്ഷാമകാലത്ത് അവരെ പോറ്റിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: അവരുടെ കന്നുകാലികൾ / അവരുടെ സകല കന്നുകാലികൾ
  rationale: വീട്ടിൽ വളർത്തുന്ന മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണ്; മലയാളത്തിൽ ‘കന്നുകാലികൾ’ എന്നത് സന്ദർഭത്തിൽ വിശാലമായ കൂട്ടപ്പദമായി സ്വാഭാവികമാണ്.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: ക്ഷാമസന്ദർഭത്തിൽ ആഹാരത്തെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും, ആവർത്തിക്കുന്ന എബ്രായപദത്തിന്റെ മൂർത്തരൂപം നിലനിർത്തുന്നു.
- source_word: בַּסּוּסִים
  choice: കുതിരകൾക്കു പകരമായി
  rationale: ב ഇവിടെ കൈമാറ്റവിലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇടപാടിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘പകരമായി’ ചേർത്തു.
- source_word: מִקְנֵה הַצֹּאן
  choice: ആട്ടിൻപറ്റങ്ങൾ
  rationale: ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടപ്പദത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִקְנֵה הַבָּקָר
  choice: കന്നുകാലിക്കൂട്ടങ്ങൾ
  rationale: പ്രധാനമായി പശുവർഗത്തിലെ കൂട്ടമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന കൂട്ടപ്പദം.
- source_word: חֲמֹרִים
  choice: കഴുതകൾ
  rationale: വ്യക്തവും ആധുനികവുമായ സാധാരണ മലയാളപദം.
- source_word: וַיְנַהֲלֵם
  choice: അവരെ പോറ്റി
  rationale: נהל എന്ന ക്രിയയ്ക്ക് ‘നയിക്കുക, നടത്തുക’ എന്ന മൂലാർഥമുണ്ടെങ്കിലും അപ്പം ഉപാധിയായിരിക്കുന്ന ഈ ക്ഷാമസന്ദർഭത്തിൽ പരിപാലിച്ച് നിലനിർത്തുക എന്ന ആശയം ‘പോറ്റി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּלֶּחֶם
  choice: അപ്പം നൽകി
  rationale: അവരെ നിലനിർത്തിയ ഉപാധി അപ്പമായിരുന്നുവെന്ന് വ്യക്തമാക്കുകയും മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടന പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּכָל מִקְנֵהֶם
  choice: അവരുടെ സകല കന്നുകാലികൾക്കും പകരമായി
  rationale: മുഴുവൻ കൈമാറ്റ ഇടപാടിനെയും സംഗ്രഹിക്കുന്നു; ‘പകരമായി’ ഇടപാടിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בַּשָּׁנָה הַהִוא
  choice: ആ വർഷം
  rationale: കാലപരിധിയെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
