id: GEN.47.15
reference: Genesis 47:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: ml
  text: 'ഈജിപ്തുദേശത്തെയും കനാൻദേശത്തെയും പണം തീർന്നപ്പോൾ[a], ഈജിപ്തുകാർ എല്ലാവരും യോസേഫിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഞങ്ങൾക്ക് അപ്പം തരണമേ.[b] ഞങ്ങൾ അങ്ങയുടെ മുമ്പിൽ മരിക്കുന്നത് എന്തിന്? പണം തീർന്നുപോയല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പണം’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ‘വെള്ളി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അപ്പം’ എന്നത് ക്ഷാമസന്ദർഭത്തിൽ ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  choice: പണം തീർന്നപ്പോൾ
  rationale: תמם ഇവിടെ പൂർണമായി ചെലവായി തീരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ക്ഷാമകാലത്തെ വാങ്ങൽസന്ദർഭത്തിൽ כֶּסֶף എന്നത് വെള്ളിയെക്കാൾ സ്വാഭാവികമായി ‘പണം’ എന്നാണ്.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: ഈജിപ്തുദേശത്തെയും കനാൻദേശത്തെയും
  rationale: מן ഉപയോഗിച്ചിരിക്കുന്ന മൂലവാചകം ആ ദേശങ്ങളിൽ ഉണ്ടായിരുന്ന പണം തീർന്നുവെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഈ ബന്ധം ഷഷ്ഠിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: ഈജിപ്തുകാർ എല്ലാവരും ... വന്നു
  rationale: അക്ഷരാർഥം ‘ഈജിപ്ത് മുഴുവനും വന്നു’ എന്നാണെങ്കിലും ഇത് ദേശവാസികളെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗമാണ്.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: ഞങ്ങൾക്കു അപ്പം തരണമേ
  rationale: לֶחֶם എന്നതിന്റെ മൂർത്തമായ അർഥം ‘അപ്പം’ എന്നു നിലനിർത്തുന്നു; ക്ഷാമസന്ദർഭത്തിൽ അത് ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാം. അപേക്ഷയുടെ അടിയന്തരത ‘തരണമേ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: ഞങ്ങൾ അങ്ങയുടെ മുമ്പിൽവെച്ച് മരിക്കുന്നത് എന്തിന്?
  rationale: נֶגְדֶּךָ എന്നത് യോസേഫിന്റെ സാന്നിധ്യത്തിൽ, അവന്റെ മുമ്പിൽ എന്ന ആശയം നൽകുന്നു. ആദരസൂചകമായ ‘അങ്ങയുടെ’ അധികാരിയോടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: כִּי אָפֵס כָּסֶף
  choice: പണം തീർന്നുപോയതുകൊണ്ട്
  rationale: כִּי ഇവിടെ ചോദ്യം ഉന്നയിക്കുന്നതിനുള്ള കാരണം നൽകുന്നു. മലയാളത്തിൽ കാരണവാക്യം ആദ്യം ചേർക്കുന്നത് വാചകം സ്വാഭാവികമാക്കുന്നു; אָפֵס പണം ഇനി ശേഷിച്ചിട്ടില്ലെന്ന് സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആദരപൂർവ മലയാളം. ‘അപ്പം’ എന്ന മൂലരൂപകവും ‘അങ്ങയുടെ മുമ്പിൽവെച്ച്’ എന്ന സാന്നിധ്യാർഥവും സംരക്ഷിച്ചു. അക്ഷരാർഥമായ ‘ഈജിപ്ത് മുഴുവനും’ എന്നതിനുപകരം ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കാൻ ‘ഈജിപ്തുകാർ എല്ലാവരും’ ഉപയോഗിച്ചു.
