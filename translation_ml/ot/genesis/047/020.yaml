source:
  edition: WLC
  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: ml
  text: അങ്ങനെ യോസേഫ് ഈജിപ്തിലെ നിലമെല്ലാം ഫറവോനുവേണ്ടി വാങ്ങി[a]. ക്ഷാമം അവരുടെമേൽ അതികഠിനമായിരുന്നതിനാൽ ഈജിപ്തുകാർ ഓരോരുത്തനും താന്താന്റെ വയൽ വിറ്റു[b]. അങ്ങനെ നിലം ഫറവോന്റേതായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈജിപ്തിലെ നിലമെല്ലാം ഫറവോനുവേണ്ടി സ്വന്തമാക്കി.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ക്ഷാമം അവരുടെമേൽ ശക്തമായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: വാങ്ങി
  rationale: വയലുകൾ വിറ്റതിനെക്കുറിച്ചുള്ള ഈ സാമ്പത്തിക സന്ദർഭത്തിൽ קנה എന്ന ക്രിയ വിലകൊടുത്തുള്ള സമ്പാദനത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ ‘വാങ്ങി’ എന്നാണ്.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: ഈജിപ്തിലെ നിലമെല്ലാം
  rationale: ഇവിടെ אַדְמָה വെറും മണ്ണിനെയല്ല, ഉടമസ്ഥതയിലുള്ള കൃഷിഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിലമെല്ലാം’ ആ സ്വത്തുസംബന്ധിയായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְפַרְעֹה
  choice: ഫറവോനുവേണ്ടി
  rationale: לְ എന്ന ഉപസർഗം വാങ്ങലിന്റെ ഗുണഭോക്താവിനെയോ ഉടമയാകുന്ന വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു; യോസേഫ് ഫറവോനുവേണ്ടിയാണ് ഇടപാട് നടത്തിയത്.
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: ഓരോരുത്തനും അവനവന്റെ വയൽ വിറ്റു
  rationale: കൂട്ടായ വിഷയത്തോടൊപ്പം വരുന്ന വിതരണാർഥമുള്ള אִישׁയും ഏകവചനമായ ‘അവന്റെ വയൽ’ എന്ന പ്രയോഗവും ഓരോ ഈജിപ്തുകാരനും സ്വന്തം വയൽ വിറ്റുവെന്ന ആശയം നൽകുന്നു.
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: ക്ഷാമം ഈജിപ്തുകാരുടെമേൽ അതികഠിനമായിരുന്നു
  rationale: חזק എന്നതിന്റെ അക്ഷരാർഥം ‘ശക്തമായിരുന്നു’ എന്നാണെങ്കിലും ക്ഷാമത്തെക്കുറിച്ച് മലയാളത്തിൽ ‘അതികഠിനമായിരുന്നു’ എന്നത് തീവ്രതയും ജനങ്ങളുടെമേലുള്ള സമ്മർദവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: നിലം ഫറവോന്റേതായി
  rationale: ഇത് ഉടമസ്ഥാവകാശം ഫറവോനിലേക്കു മാറിയ ഫലത്തെ സംക്ഷിപ്തമായും കൃത്യമായും അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘നിലം’, ‘വയൽ’ എന്നീ പദങ്ങൾ ഉടമസ്ഥതയിലുള്ള ഭൂമിയെയും കൃഷിയിടത്തെയും വേർതിരിക്കുന്നു. മൂലപാഠത്തിലെ കാരണം-ഫലം ക്രമവും ഉടമസ്ഥാവകാശമാറ്റവും നിലനിർത്തിയിട്ടുണ്ട്.
