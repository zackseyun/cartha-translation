id: GEN.47.26
reference: Genesis 47:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣שֶׂם אֹתָ֣/הּ יוֹסֵ֡ף לְ/חֹק֩ עַד הַ/יּ֨וֹם הַ/זֶּ֜ה עַל אַדְמַ֥ת מִצְרַ֛יִם לְ/פַרְעֹ֖ה לַ/חֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַ/כֹּֽהֲנִים֙ לְ/בַדָּ֔/ם לֹ֥א הָיְתָ֖ה לְ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: ml
  text: 'അങ്ങനെ യോസേഫ് ഈജിപ്തിലെ ഭൂമിയെ സംബന്ധിച്ച് ഇന്നുവരെയും നിലനിൽക്കുന്ന ഒരു ചട്ടമായി അതു സ്ഥാപിച്ചു: അഞ്ചിലൊന്ന് ഫറവോനുള്ളതാണ്.[a] പുരോഹിതന്മാരുടെ ഭൂമി മാത്രം ഫറവോന്റേതായില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരുപത് ശതമാനം ഫറവോനുള്ളതാണ്.” എബ്രായപദം അഞ്ചിലൊന്ന് വിഹിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: ഒരു ചട്ടമായി അതു സ്ഥാപിച്ചു
  rationale: שׂוּם + לְחֹק എന്ന നിയമപരമായ പ്രയോഗം ഒരു നയം ചട്ടമായി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻവാക്യത്തിലെ ക്രമീകരണത്തെ തിരിച്ചുപറയുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും നിലനിൽക്കുന്ന
  rationale: കഥാകാരന്റെ കാലംവരെ ചട്ടം തുടർന്നുനിന്നുവെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സ്ഥാപിച്ച പ്രവൃത്തി ഇന്നുവരെ നീണ്ടുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: ഈജിപ്തിലെ ഭൂമിയെ സംബന്ധിച്ച്
  rationale: עַל ഇവിടെ ചട്ടത്തിന്റെ പ്രയോഗമേഖലയെ അടയാളപ്പെടുത്തുന്നു; അതിനാൽ ‘സംബന്ധിച്ച്’ എന്നത് നിയമപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: അഞ്ചിലൊന്ന് ഫറവോനുള്ളതാണ്
  rationale: ചട്ടത്തിന്റെ ഉള്ളടക്കമായ അഞ്ചിലൊന്ന് വിഹിതവും അതിന്റെ സ്വീകർത്താവായ ഫറവോനും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: പുരോഹിതന്മാരുടെ ഭൂമി മാത്രം
  rationale: רַק-ഉം לְבַדָּם-ഉം ചേർന്നുള്ള ഊന്നിയ ഒഴിവാക്കൽ മലയാളത്തിലെ ‘മാത്രം’ സ്വാഭാവികമായി വഹിക്കുന്നു; അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: ഫറവോന്റേതായില്ല
  rationale: היה + לְ എന്ന ഘടന ഇവിടെ ഉടമസ്ഥതയിലേക്കുള്ള മാറ്റത്തിന്റെ ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിലെ ഭൂമി ഫറവോന് സ്വന്തമായതുമായുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ഭാവത്തിന് ‘ചട്ടം’ ഉപയോഗിച്ചു; ‘ഫറവോന്റേതായില്ല’ എന്ന രൂപം ഭൂമിയുടെ ഉടമസ്ഥതാമാറ്റവുമായി ബന്ധപ്പെട്ട സന്ദർഭം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
