id: GEN.47.11
reference: Genesis 47:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּוֹשֵׁ֣ב יוֹסֵף֮ אֶת אָבִ֣י/ו וְ/אֶת אֶחָי/ו֒ וַ/יִּתֵּ֨ן לָ/הֶ֤ם אֲחֻזָּה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/מֵיטַ֥ב הָ/אָ֖רֶץ בְּ/אֶ֣רֶץ רַעְמְסֵ֑ס כַּ/אֲשֶׁ֖ר צִוָּ֥ה פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: ml
  text: യോസേഫ് തന്റെ പിതാവിനെയും സഹോദരന്മാരെയും പാർപ്പിച്ചു; ഫറവോൻ കൽപ്പിച്ചതുപോലെ, ഈജിപ്ത് ദേശത്ത്, ദേശത്തിലെ ഏറ്റവും നല്ല ഭാഗമായ രാമെസേസ് ദേശത്ത്, അവർക്കു ഭൂസ്വത്ത് നൽകി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: പാർപ്പിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—താമസിക്കാൻ ഇടയാക്കുക—സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: തന്റെ അപ്പനെയും സഹോദരന്മാരെയും
  rationale: എബ്രായമൂലത്തിലെ ബന്ധപദങ്ങൾ പൊതുവായ ‘കുടുംബം’ എന്നാക്കി വിപുലീകരിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: അവർക്കു കൈവശഭൂമി കൊടുത്തു
  rationale: אֲחֻזָּה സൂചിപ്പിക്കുന്ന ഭൂസ്വത്തോ സ്ഥിരമായ ഭൂകൈവശമോ ‘അവകാശം’ എന്ന ഉടമ്പടിസംബന്ധമായ അധികധ്വനി വരാതെ വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തിലെ
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ ദേശസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ തുടർന്നുള്ള സ്ഥാനവിവരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: ഏറ്റവും നല്ല ഭാഗമായ
  rationale: מֵיטַב എന്നത് ദേശത്തിന്റെ ഏറ്റവും നല്ല അഥവാ തിരഞ്ഞെടുക്കപ്പെട്ട ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂപ്രദേശസൂചനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: രാമെസേസ് ദേശത്ത്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ആവർത്തിക്കുന്ന אֶרֶץ എന്ന പദം ‘ദേശം’ ആയി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: ഫറവോൻ കല്പിച്ചതുപോലെ
  rationale: ഫറവോന്റെ മുൻകല്പനയോടുള്ള കൃത്യമായ അനുസരണം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് ലളിതവും മൂലത്തിലെ കുടുംബബന്ധത്തിന് യോജിച്ചതുമാണ്; ‘കൈവശഭൂമി’ ഭൂമിയുടെ സ്ഥിരമായ കൈവശാവകാശത്തെ വ്യക്തമാക്കുന്നു.
