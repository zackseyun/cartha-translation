id: GEN.47.8
reference: Genesis 47:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל יַעֲקֹ֑ב כַּ/מָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: ml
  text: 'ഫറവോൻ യാക്കോബിനോടു പറഞ്ഞു: “നിന്റെ ജീവിതവർഷങ്ങളിലെ ദിവസങ്ങൾ എത്രയാണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥമായി: “നിന്റെ ജീവിതത്തിന്റെ വർഷങ്ങളിലെ ദിവസങ്ങൾ എത്ര?” ഇത് യാക്കോബിന്റെ പ്രായം ചോദിക്കുന്ന ഔപചാരികമായ എബ്രായ ശൈലിയാണ്; കൂടുതൽ സ്വാഭാവികമായി, “നിനക്ക് എത്ര വയസ്സായി?”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു
  rationale: אמר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ചോദിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ആശയപരമായി കൃത്യവുമാണ്; വാവ് രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: פַּרְעֹה
  choice: ഫറവോൻ
  rationale: രാജകീയ സ്ഥാനപ്പേരിന്റെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: אֶל־יַעֲקֹב
  choice: യാക്കോബിനോടു
  rationale: אֶל ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ദാതൃവിഭക്തിയോടുകൂടിയ ഈ രൂപം സ്വാഭാവിക മലയാളമാണ്.
- source_word: כַּמָּה
  choice: എത്രയാണ്
  rationale: എണ്ണാവുന്ന കാലഘടകങ്ങളുടെ അളവ് ചോദിക്കുന്ന പദത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: നിന്റെ ആയുഷ്കാലത്തിന്റെ വർഷങ്ങളിലെ ദിവസങ്ങൾ
  rationale: ‘നിന്റെ ജീവിതത്തിന്റെ വർഷങ്ങളുടെ ദിവസങ്ങൾ’ എന്ന പാളികളുള്ള എബ്രായ പ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘ജീവിതം’ എന്നതിനെക്കാൾ ‘ആയുഷ്കാലം’ ഈ പ്രായചോദ്യത്തിന്റെ സന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു, എന്നാൽ ലളിതമായി ‘നിനക്ക് എത്ര വയസ്സായി?’ എന്നു ചുരുക്കുന്നില്ല.
