translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. മുഖ്യവാക്യത്തിൽ എബ്രായ പ്രയോഗത്തിന്റെ അസാധാരണമായ പാളിവിന്യാസം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ അതിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുകയും ചെയ്തു.
