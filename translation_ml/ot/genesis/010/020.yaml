  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: ml
  text: ഹാമിന്റെ പുത്രന്മാർ ഇവരാണ്—അവരുടെ കുലങ്ങൾപ്രകാരം[a], അവരുടെ ഭാഷകൾപ്രകാരം[b], അവരുടെ ദേശങ്ങളിൽ, അവരുടെ ജനതകളിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് … അവരുടെ ഭാഷകൾക്കനുസരിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം; ആവർത്തിക്കുന്ന ഹീബ്രു ബന്ധപദം വിഭാഗങ്ങൾപ്രകാരമുള്ള ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘നാവുകൾ’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭാഷകളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְנֵי חָם
  choice: ഹാമിന്റെ പുത്രന്മാർ ഇവരാണ്
  rationale: തിരിച്ചറിയൽ സ്വഭാവമുള്ള സംഗ്രഹവാക്യമായി אֵלֶּהയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; בְנֵי എന്ന ബന്ധപദത്തിന്റെ ഔപചാരിക അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ വിപുലമായ ബന്ധുത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; לְ വർഗീകരണമോ വിഭജനമോ അടയാളപ്പെടുത്തുന്നതിനാൽ ‘പ്രകാരം’ യോജിക്കുന്നു.
- source_word: לִלְשֹׁנֹתָם
  choice: ഭാഷകൾപ്രകാരം
  rationale: לָשׁוֹן എന്നതിന്റെ അക്ഷരാർഥം ‘നാവ്’ ആണെങ്കിലും ഇവിടെ വ്യത്യസ്ത ഭാഷകളെയാണ് സൂചിപ്പിക്കുന്നത്; വർഗീകരണാർഥമുള്ള לְ ‘പ്രകാരം’ എന്നു നൽകി.
- source_word: בְאַרְצֹתָם
  choice: അവരുടെ ദേശങ്ങളിൽ
  rationale: בְ യുടെ സ്ഥലസൂചകബലം നിലനിർത്തുന്നു; אֶרֶץ എന്ന ബഹുവചനത്തിന് ആധുനിക രാഷ്ട്രസംവിധാനം അനാവശ്യമായി സൂചിപ്പിക്കാത്ത ‘ദേശങ്ങൾ’ ഉപയോഗിക്കുന്നു.
- source_word: בְגוֹיֵהֶם
  choice: ജനതകൾപ്രകാരം
  rationale: גּוֹי ഇവിടെ വംശകുലങ്ങളിൽനിന്നു വ്യത്യസ്തമായ ജനവിഭാഗങ്ങളെയോ ജനതകളെയോ സൂചിപ്പിക്കുന്നു. ഈ പട്ടികയുടെ വർഗീകരണ ഘടന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘പ്രകാരം’ ഉപയോഗിക്കുന്നു; എങ്കിലും ഹീബ്രുവിൽ മുൻപുള്ള രണ്ട് ഘടകങ്ങളിലെ לְ-നു പകരം בְ ആണ്.
theological_decisions:
- issue: בְגוֹיֵהֶם എന്ന അവസാന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ജനതകൾപ്രകാരം
  alternative: അവരുടെ ജനതകളിൽ
  rationale: בְ അക്ഷരാർഥത്തിൽ ‘ഇൽ/യിൽ’ എന്നു വരാമെങ്കിലും ഈ സംഗ്രഹസൂത്രത്തിൽ വംശം, ഭാഷ, ദേശം, ജനത എന്നീ വിഭാഗങ്ങൾ നിരത്തപ്പെടുന്നു. ‘പ്രകാരം’ ആ വർഗീകരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു; സ്ഥലസൂചക വായനയുടെ സാധ്യത കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-സംഗ്രഹശൈലി. ഹീബ്രുവിലെ വർഗീകരണഘടനയും ‘ദേശങ്ങളിൽ’ എന്ന സ്ഥലസൂചക വ്യത്യാസവും നിലനിർത്തി. ലഭിച്ച ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാളത്തിൽ [a] ‘കുലങ്ങൾപ്രകാരം’ എന്നതിനുശേഷവും [b] ‘ഭാഷകൾപ്രകാരം’ എന്നതിനുശേഷവും ചേർത്തിരിക്കുന്നു.
