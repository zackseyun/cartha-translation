  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി. മുഖ്യവാചകം പ്രാദേശിക അർഥം മുൻനിർത്തുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത സംരക്ഷിക്കുന്നു.
