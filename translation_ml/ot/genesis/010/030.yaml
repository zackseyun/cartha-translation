reference: Genesis 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִ֥י מוֹשָׁבָ֖/ם מִ/מֵּשָׁ֑א בֹּאֲ/כָ֥ה סְפָ֖רָ/ה הַ֥ר הַ/קֶּֽדֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: ml
  text: അവരുടെ വാസസ്ഥലം മേശാ മുതൽ സെഫാറിലേക്കുള്ള ദിശയിൽ, കിഴക്കൻ മലനാടുവരെ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവരുടെ വാസസ്ഥലം മേശാ മുതൽ സെഫാറിലേക്കുള്ള ദിശയിൽ, കിഴക്കുള്ള മല വരെ ആയിരുന്നു.’ ഹീബ്രു വാക്യത്തിൽ ‘സെഫാർ’ എന്ന സ്ഥലനാമവും ‘കിഴക്കിന്റെ മല/മലനാട്’ എന്ന പ്രയോഗവും തമ്മിലുള്ള ബന്ധം പൂർണമായി ഉറപ്പില്ലാത്തതിനാൽ, ഈ ഭൗമപരിധിയുടെ ഘടന ഒന്നിലധികം രീതിയിൽ മനസ്സിലാക്കാം.'
    reason: ഹീബ്രു വാക്യഘടനയുടെയും הַר എന്ന പദത്തിന്റെ ‘മല’/‘മലനാട്’ എന്ന സാധ്യതയുടെയും അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഭൂതകാല വിവരണഭാവം അടുത്തായി നിലനിർത്തുന്നു; വാക്യബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: מוֹשָׁבָם
  choice: അവരുടെ വാസസ്ഥലം
  rationale: ഒരു ജനവിഭാഗം പാർത്തിരുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, വ്യക്തിഗത താമസത്തേക്കാൾ ഭൗമപരമായ അർഥം നൽകുന്ന ‘വാസസ്ഥലം’ അനുയോജ്യം.
- source_word: מִמֵּשָׁא
  choice: മേശാ മുതൽ
  rationale: സ്ഥലനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; מִן എന്ന ആരംഭപരിധി ‘മുതൽ’ എന്നു നൽകി.
- source_word: בֹּאֲכָה
  choice: പോകുന്ന വഴിയിൽ
  rationale: ഒരു സ്ഥലത്തേക്കുള്ള സഞ്ചാരദിശ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: סְפָרָה
  choice: സെഫാറിലേക്കു
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ദിശാസൂചകമായ ה־യെ ‘-ലേക്കു’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: הַר
  choice: മലനാട്
  rationale: അതിർത്തിവിവരണത്തിൽ ഒറ്റമലയേക്കാൾ പർവതപ്രദേശത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മലനാട്’ തെരഞ്ഞെടുത്തു; ‘മല’ എന്ന വായനയും സാധ്യമാണ്.
- source_word: הַקֶּדֶם
  choice: കിഴക്കൻ
  rationale: കിഴക്ക് അഥവാ കിഴക്കൻ പ്രദേശം എന്ന ഭൗമപരമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
