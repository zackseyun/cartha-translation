  text: അർവാദ്യരെയും സെമാര്യരെയും ഹമാത്ത്യരെയും ജനിപ്പിച്ചു. പിന്നീട് കനാന്യരുടെ[a] ഗോത്രങ്ങൾ ചിതറിപ്പോയി.
  philosophy: optimal-equivalence
