  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ml
  text: പത്രൂസ്യരെയും കസ്ലൂഹ്യരെയും—അവിടെനിന്നാണ് ഫെലിസ്ത്യർ പുറപ്പെട്ടത്[a]—കഫ്തോര്യരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവിടെനിന്ന് ഫെലിസ്ത്യർ പുറപ്പെട്ടു.’ ഈ വാക്കുകൾ തൊട്ടുമുമ്പ് പറഞ്ഞ കസ്ലൂഹ്യരിൽനിന്നുള്ള ഫെലിസ്ത്യരുടെ ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: പത്രൂസ്യർ
  rationale: പത്രൂസ് എന്ന സ്ഥലനാമത്തിൽനിന്നുള്ള ജനനാമം; അർഥം അനുമാനിക്കാതെ എബ്രായരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: כַּסְלֻחִים
  choice: കസ്ലൂഹ്യർ
  rationale: തിരിച്ചറിയൽ അനിശ്ചിതമായ ജനനാമമായതിനാൽ എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: അവിടെനിന്നാണ് ... പുറപ്പെട്ടത്
  rationale: ‘അവിടെനിന്ന് അവർ പുറപ്പെട്ടു’ എന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്ഥലസൂചനയും അവ്യക്തമായ ബന്ധവും പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
- source_word: פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യർ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ജനനാമരൂപം.
- source_word: כַּפְתֹּרִים
  choice: കഫ്തോര്യർ
  rationale: കഫ്തോർ എന്ന പേരുമായി ബന്ധപ്പെട്ട ജനനാമം; എബ്രായരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת
  choice: -രെയും
  rationale: പട്ടികയിലെ ആവർത്തിത സംയോജകവും കർമസൂചകവും മലയാളത്തിൽ ‘-രെയും’ എന്ന സ്വാഭാവിക സമുച്ചയരൂപത്തിൽ പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: ‘അവിടെനിന്ന് ഫെലിസ്ത്യർ പുറപ്പെട്ടു’ എന്ന ഉപവാക്യത്തിന്റെ പൂർവപദം
  choice: പ്രധാനവാചകത്തിൽ ‘അവിടെനിന്ന്’ എന്ന സ്ഥലസൂചകപ്രയോഗം നിലനിർത്തി.
  alternative: ‘കസ്ലൂഹ്യരിൽനിന്നാണ് ഫെലിസ്ത്യർ വന്നത്’ എന്നു കസ്ലൂഹ്യരെ വ്യക്തമായ പൂർവപദമാക്കാം.
  rationale: എബ്രായത്തിൽ מִשָּׁם എന്നത് അക്ഷരാർഥത്തിൽ ‘അവിടെനിന്ന്’ എന്നാണ്. തൊട്ടുമുമ്പുള്ള കസ്ലൂഹ്യരുമായി ബന്ധിപ്പിക്കുന്നത് സ്വാഭാവികമാണെങ്കിലും, അങ്ങനെ തുറന്നുപറയുന്നത് മൂലത്തിലെ സാധ്യതാപരമായ അവ്യക്തത പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. ജനനാമങ്ങൾക്ക് മലയാളത്തിൽ സ്വാഭാവികമായ ‘-യർ’ രൂപവും കർമസ്ഥാനത്ത് ‘-രെയും’ രൂപവും ഉപയോഗിച്ചു; ഇടയ്ക്കുള്ള ഉത്ഭവക്കുറിപ്പ് ദീർഘവരകൾക്കിടയിൽ നൽകി.
