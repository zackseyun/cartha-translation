lexical_decisions:
- source_word: וְ/אֶת
  choice: -നെയും / -യെയും
  rationale: וְ എന്ന സംയോജകം ‘ഉം/യും’ എന്ന അർഥം നൽകുന്നു; אֶת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ഓരോ പേരിനോടും ചേർത്ത ‘-നെയും/-യെയും’ എന്ന രൂപം സംയോജനവും കർമബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עוֹבָל
  choice: ഓബാൽ
  rationale: വംശാവലിയിൽ വരുന്ന വ്യക്തിനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തിന് അനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִימָאֵל
  choice: അബീമായേൽ
  rationale: വ്യക്തിനാമം അതിന്റെ ഘടകങ്ങളുടെ അർഥം വ്യാഖ്യാനിക്കാതെ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׁבָא
  choice: ശേബ
  rationale: ഈ സന്ദർഭത്തിലെ שְׁבָא എന്ന വ്യക്തി/സ്ഥലനാമത്തെ മറ്റൊരു ഹീബ്രു പേരായ ‘സേബ’യിൽനിന്ന് വേർതിരിച്ച് ‘ശേബ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
