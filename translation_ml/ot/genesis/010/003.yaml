translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും വ്യക്തിനാമങ്ങളുടെ ലിപ്യന്തരണ സ്വഭാവവും നിലനിർത്തി.
