id: GEN.10.10
reference: Genesis 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּהִ֨י רֵאשִׁ֤ית מַמְלַכְתּ/וֹ֙ בָּבֶ֔ל וְ/אֶ֖רֶךְ וְ/אַכַּ֣ד וְ/כַלְנֵ֑ה בְּ/אֶ֖רֶץ שִׁנְעָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: ml
  text: അവന്റെ രാജ്യത്തിന്റെ ആരംഭം ശിനാർ ദേശത്തിലെ ബാബേൽ[a], ഏരെക്ക്[b], അക്കാദ്[b], കൽനേ എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബാബിലോൺ’.
    reason: lexical_alternative
  - marker: b
    text: ഏരെക്ക് സാധാരണയായി പുരാതന ഊറുക്കുമായും അക്കാദ് പുരാതന അക്കാദുമായും തിരിച്ചറിയപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: ആയിരുന്നു
  rationale: പട്ടികയോടുകൂടിയ ഈ വിവരണവാക്യത്തിൽ היה എന്ന ക്രിയ ഭൂതകാലത്തിലെ ലളിതമായ ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘ആയിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: רֵאשִׁית
  choice: ആരംഭം
  rationale: രാജ്യത്തിന്റെ ആദ്യകേന്ദ്രമോ ആദ്യവ്യാപ്തിയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘തലസ്ഥാനം’ എന്നോ ‘പ്രധാനഭാഗം’ എന്നോ വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: מַמְלַכְתּוֹ
  choice: അവന്റെ രാജ്യം
  rationale: നഗരങ്ങളുടെ പട്ടിക ഉൾപ്പെടുന്ന സാഹചര്യത്തിൽ മַמְלָכָה എന്നത് രാജഭരണം എന്നതിലുപരി ഭരണപ്രദേശം ഉൾക്കൊള്ളുന്ന ‘രാജ്യം’ എന്നു സ്വാഭാവികമായി നൽകാം.
- source_word: בָּבֶל
  choice: ബാബേൽ
  rationale: എബ്രായ നാമത്തിന്റെ രൂപവും ഉല്പത്തി 11-ലെ സാഹിത്യബന്ധവും നിലനിർത്തുന്നു; ‘ബാബിലോൺ’ എന്ന പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶרֶךְ
  choice: ഏരെക്ക്
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; പുരാതന ഊറുക്ക് നഗരവുമായുള്ള സാധാരണ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: אַכַּד
  choice: അക്കാദ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്തതും ചരിത്രപരമായി പരിചിതവുമായ മലയാള ലിപ്യന്തരണം.
- source_word: כַלְנֵה
  choice: കൽനേ
  rationale: മസോററ്റിക് പാഠത്തിലെ כַלְנֵה എന്ന രൂപം തന്നെയാണ് പ്രതിനിധീകരിക്കുന്നത്; മറ്റിടങ്ങളിലെ ബന്ധമുള്ള ‘കൽനോ’ എന്ന രൂപം ഇവിടെ പകരുന്നില്ല.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: ശിനാർ ദേശത്തിലെ
  rationale: אֶרֶץ എന്ന ഭൂമിശാസ്ത്രസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പട്ടികയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. സ്ഥലനാമങ്ങൾ എബ്രായ പാഠത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരം ചെയ്തു. ഒരേ സാംസ്കാരിക അടിക്കുറിപ്പ് ബാധിക്കുന്ന ‘ഏരെക്ക്’, ‘അക്കാദ്’ എന്നീ രണ്ടുപേരുടെയും പിന്നാലെ [b] ചേർത്തിട്ടുണ്ട്.
