id: GEN.10.11
reference: Genesis 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: ml
  text: ആ ദേശത്തുനിന്ന് അശ്ശൂർ പുറപ്പെട്ട് നിനെവേ[a], രെഹോബോത്ത്-ഈർ, കാലഹ് എന്നിവ പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, മുൻവാക്യത്തിലെ നിമ്രോദിനെ കർത്താവായും אַשּׁוּר എന്നതിനെ അശ്ശൂർദേശം എന്ന പ്രദേശനാമമായും എടുത്താൽ: “ആ ദേശത്തുനിന്ന് അവൻ അശ്ശൂർദേശത്തേക്കു പുറപ്പെട്ട് നിനെവേ, രെഹോബോത്ത്-ഈർ, കാലഹ് എന്നിവ പണിതു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: ആ ദേശത്തുനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥാനത്തെയോ പുറപ്പെടുന്ന ഇടത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ אֶרֶץ മണ്ണിനെയല്ല, മുമ്പ് പറഞ്ഞ ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָצָא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ സാധാരണ അർഥം ‘പുറപ്പെടുക/പുറത്തേക്കു പോകുക’ എന്നാണ്; ആ ദേശത്തുനിന്നുള്ള നീക്കം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: ഈ നാമം അശ്ശൂർ എന്ന വ്യക്തിയെയോ അശ്ശൂർദേശത്തെയോ സൂചിപ്പിക്കാം. വാക്യത്തിലെ പ്രത്യക്ഷ കർത്താവായി വ്യക്തിനാമം സ്വീകരിച്ചെങ്കിലും യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘പണിയുക’ എന്നാണ്; ‘സ്ഥാപിച്ചു’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: נִינְוֵה
  choice: നിനവെ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: רְחֹבֹת עִיר
  choice: രെഹോബോത്ത്-ഈർ
  rationale: ആവർത്തിക്കുന്ന אֶת ചിഹ്നത്തോടുകൂടിയ നഗരപ്പട്ടികയിൽ വരുന്നതിനാൽ ഇത് സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പദശഃ ‘നഗരത്തിന്റെ വിശാലസ്ഥലങ്ങൾ’ എന്ന സാധ്യത ഇവിടെ കുറവാണ്.
- source_word: כָּלַח
  choice: കാലഹ്
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: אַשּׁוּר എന്നതിന്റെ കർത്താവും സൂചനയും
  choice: 'അശ്ശൂർ തന്നെയാണ് കർത്താവ്: ‘അശ്ശൂർ പുറപ്പെട്ടു’'
  alternative: 'മുൻവാക്യത്തിലെ നിമ്രോദ് സൂചിതകർത്താവ്: ‘അവൻ ആ ദേശത്തുനിന്ന് അശ്ശൂർദേശത്തേക്കു പുറപ്പെട്ട്… പണിതു’'
  rationale: ഹീബ്രു വ്യഞ്ജനപാഠത്തിൽ אַשּׁוּר വ്യക്തിനാമമായും ദേശനാമമായും മനസ്സിലാക്കാം. ക്രിയയ്ക്കു പിന്നാലെ വരുന്ന നാമത്തെ പ്രത്യക്ഷ കർത്താവായി എടുക്കുന്നതാണ് ഉടനെയുള്ള വാക്യഘടനയ്ക്ക് സ്വാഭാവികം; എങ്കിലും മറ്റൊരു വായനയും സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ തിരിച്ചറിയാൻ കഴിയുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു. ഹീബ്രുവിലെ യഥാർഥ വ്യാകരണ-ഭൂമിശാസ്ത്ര അവ്യക്തത പ്രധാനവായനയിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
