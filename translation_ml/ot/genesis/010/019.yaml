source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: ml
  text: കനാന്യരുടെ അതിർത്തി സീദോൻമുതൽ, ഗെരാറിന്റെ ദിശയിൽ ഗസ്സവരെയും, സൊദോം, ഗൊമോറ, അദ്മ, സെബോയീം എന്നിവയുടെ ദിശയിൽ ലാശാ[a]വരെയും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലേശാ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വിവരണാത്മകമായ ഭൂതകാലത്തിൽ അതിർത്തിയുടെ വ്യാപ്തി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള ക്രിയാരൂപം.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: ഇവിടെ ദേശത്തിന്റെ അതിരോ അതിർത്തിരേഖയോ ആണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘അതിർത്തി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യരുടെ
  rationale: എബ്രായത്തിൽ ഏകവചന ജനവിഭാഗനാമമാണെങ്കിലും സന്ദർഭത്തിൽ കനാൻജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִצִּידֹן
  choice: സീദോൻമുതൽ
  rationale: מִן ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘മുതൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בֹּאֲכָה
  choice: …ലേക്കു പോകുന്ന വഴിയിൽ
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഒരു സ്ഥലത്തേക്കുള്ള ദിശയെയോ യാത്രാമാർഗത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ ദിശാസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: גְרָרָה
  choice: ഗെരാറിലേക്ക്
  rationale: ദിശാസൂചകമായ ה ഉൾക്കൊള്ളിച്ചുകൊണ്ട് സ്ഥലനാമം മലയാളലിപിയിൽ നൽകി.
- source_word: עַד
  choice: …വരെ
  rationale: അതിർത്തിയുടെ അവസാനപരിധി വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַזָּה
  choice: ഗസ്സ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: സൊദോമിലേക്കും ഗൊമോറയിലേക്കും അദ്മയിലേക്കും സെബോയീമിലേക്കും
  rationale: അതിർത്തിയുടെ ദിശ നിർണയിക്കുന്ന സ്ഥലനാമപരമ്പര; മൂലത്തിലെ ആവർത്തിച്ചുള്ള ബന്ധകങ്ങൾ മലയാളത്തിലും നിലനിർത്തി.
- source_word: לָשַׁע
  choice: ലാശാ
  rationale: മസോരറ്റിക് സ്വരീകരണത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം; ‘ലേശാ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘Sidon’ എന്നതിനുശേഷം നൽകിയിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും എബ്രായ സ്ഥലനാമവും അനുസരിച്ച് അത് ‘ലാശാ’യ്ക്കുശേഷം വെച്ചു.
