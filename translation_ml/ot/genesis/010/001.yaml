source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: ml
  text: നോഹയുടെ പുത്രന്മാരായ ശേം, ഹാം, യാഫെത്ത് എന്നിവരുടെ തലമുറകൾ[a] ഇവയാണ്. പ്രളയത്തിനുശേഷം അവർക്കു പുത്രന്മാർ ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നോഹയുടെ പുത്രന്മാരുടെ വംശജർ ഇവരാണ്.’ ഇവിടെ ‘തലമുറകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രായ തലക്കെട്ടുപദം വംശപരമ്പരയെയോ ഒരാളിൽനിന്ന് ഉത്ഭവിക്കുന്നതിനെയോ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: വാക്യഭാഗത്തെ പുതിയ വിഭാഗത്തിന്റെ തലക്കെട്ടായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ו എന്ന ആഖ്യാനബന്ധത്തിന്റെ ശക്തി മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ സന്ദർഭം വഹിക്കുന്നു.
- source_word: תּוֹלְדֹת
  choice: തലമുറകൾ
  rationale: ഉല്പത്തിയിലെ ആവർത്തിച്ചുവരുന്ന ഘടനാസൂചക പദത്തിന്റെ വംശപരമ്പരയെയും ഒരാളിൽനിന്ന് ഉത്ഭവിക്കുന്നതിനെയും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּנֵי נֹחַ
  choice: നോഹയുടെ പുത്രന്മാർ
  rationale: ഹീബ്രായ സംയുക്തരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: שֵׁם חָם וָיָפֶת
  choice: ശേം, ഹാം, യാഫെത്ത്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּוָּלְדוּ
  choice: ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ കർമണിക/അകർമക അർഥത്തിൽ ‘ജനിച്ചു’ എന്നാണ്; ‘ജനിപ്പിച്ചു’ എന്ന സജീവ അർഥം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: לָהֶם
  choice: അവർക്കു
  rationale: ജനനവുമായി ബന്ധപ്പെട്ട ബന്ധം അഥവാ കൈവശബന്ധം സൂചിപ്പിക്കുന്ന ל എന്ന ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം.
- source_word: בָּנִים
  choice: പുത്രന്മാർ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; തുടർന്നുള്ള വംശാവലിസന്ദർഭത്തോടും ഇത് പൊരുത്തപ്പെടുന്നു.
- source_word: אַחַר הַמַּבּוּל
  choice: പ്രളയത്തിനുശേഷം
  rationale: മഹാപ്രളയത്തിനു ശേഷമുള്ള കാലസന്ദർഭം സംക്ഷിപ്തവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തിയിലെ תּוֹלְדֹת എന്ന ഘടനാസൂചക പദത്തിന്റെ പരിഭാഷ
  choice: തലമുറകൾ
  alternative: വംശജർ; വംശചരിത്രം
  rationale: ‘തലമുറകൾ’ എന്നത് പദത്തിന്റെ പരമ്പരാഗതവും മൂലഭാഷയോട് അടുത്തതുമായ വിശാലത സൂക്ഷിക്കുന്നു; അതിനെ വംശജരിലേക്കോ ഒരു വിവരണത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
- issue: בָּנִים എന്ന ലിംഗസൂചക പദം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: ഹീബ്രായ പദം ഇവിടെ പുല്ലിംഗമാണ്; പേരെടുത്ത പുരുഷവംശജരെ വിവരിക്കുന്ന വംശാവലിസന്ദർഭത്തിൽ ആ സവിശേഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം ഉല്പത്തിയിലെ ഔപചാരിക തലക്കെട്ടുശൈലി നിലനിർത്തുന്നതുമായ ഭാഷ ഉപയോഗിച്ചു. പേരുകൾ ശേം, ഹാം, യാഫെത്ത് എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു.
