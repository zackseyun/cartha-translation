source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: ml
  text: 'കൂശിന്റെ പുത്രന്മാർ: സെബാ[a], ഹവീലാ, സബ്താ, രയ്മാ, സബ്തെകാ[b]. രയ്മായുടെ പുത്രന്മാർ: ശെബാ, ദെദാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വംശാവലികളിൽ ‘പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം നേരിട്ടുള്ള ജൈവപുത്രന്മാരെ മാത്രമല്ല, സന്തതികളെയോ ഒരു വംശത്തിന്റെയോ ജനവിഭാഗത്തിന്റെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: ഈ വാക്യത്തിലെ പല പേരുകളും വ്യക്തികളെ മാത്രമല്ല, ജനവിഭാഗങ്ങളെയോ പ്രദേശങ്ങളെയോ അവയ്ക്ക് പേര് നൽകിയ പൂർവികരെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നർഥമുള്ള construct plural ആണ്. വംശാവലിയിൽ ഇത് നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, പിൻതലമുറക്കാരെയോ അവരിൽനിന്നുണ്ടായ ജനവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം; എങ്കിലും മൂലപദത്തിന്റെ രൂപവും വംശാവലിയുടെ ആവർത്തനഘടനയും നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: כּוּשׁ
  choice: കൂശ്
  rationale: വ്യക്തിനാമം; ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: סְבָא
  choice: സെബാ
  rationale: വ്യക്തിയെയോ ജനവിഭാഗത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാവുന്ന പേരായി വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: חֲוִילָה
  choice: ഹവീലാ
  rationale: ഹീബ്രു പേരിന്റെ സ്വരഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: סַבְתָּה
  choice: സബ്താ
  rationale: Proper name; ഹീബ്രു രൂപത്തോട് ചേർന്ന സംക്ഷിപ്ത മലയാള ലിപ്യന്തരണം.
- source_word: רַעְמָה
  choice: രയമാ
  rationale: ע എന്ന ഹീബ്രു വ്യഞ്ജനത്തെ മലയാള വായനയിൽ അതിരൂക്ഷമാക്കാതെ, അക്ഷരക്രമം തിരിച്ചറിയാവുന്നവിധം ‘യ’ ഉപയോഗിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: סַבְתְּכָא
  choice: സബ്തെക്കാ
  rationale: ഹീബ്രു വ്യഞ്ജനക്രമവും അവസാനത്തെ ദീർഘസ്വരവും സൂക്ഷിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּבְנֵי רַעְמָה
  choice: രയമായുടെ പുത്രന്മാർ
  rationale: വാക്യത്തിലെ ആവർത്തിത വംശാവലി സൂത്രം നിലനിർത്തി. മലയാളത്തിൽ പട്ടിക തുടർന്നുവരുന്നതിനാൽ prefixed conjunction പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: שְׁבָא
  choice: ശെബാ
  rationale: שׁ എന്നത് ‘ശ’ ആയും ഹീബ്രു ശെവാ സ്വരം ‘െ’ ആയും പ്രതിഫലിപ്പിച്ച ലിപ്യന്തരണം.
- source_word: דְדָן
  choice: ദെദാൻ
  rationale: വ്യക്തി/ജനവിഭാഗനാമം വിശേഷണരൂപമാക്കാതെ നേരിട്ട് ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: വംശാവലിയിലെ ‘പുത്രന്മാർ’ എന്ന ബന്ധപദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘പുത്രന്മാർ’ നിലനിർത്തി; വിശാലമായ വംശപര/ജനവിഭാഗപര അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സന്തതികൾ’ അല്ലെങ്കിൽ ‘വംശജർ’ എന്നു പ്രധാനവാചകത്തിൽ നൽകുക.
  rationale: മൂലത്തിലെ בְּנֵי എന്ന രൂപത്തോട് ഔപചാരിക ബന്ധം നിലനിർത്തിക്കൊണ്ട്, അത് ഉടനെയുള്ള ജൈവപുത്രന്മാർക്ക് മാത്രമായി വായിക്കപ്പെടാതിരിക്കാൻ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: പട്ടികയിലെ പേരുകളുടെ ഒന്റോളജിക്കൽ നില
  choice: പേരുകൾ വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരിച്ചു; വ്യക്തി, ജനത, പ്രദേശം എന്നീ സാധ്യതകൾ തുറന്നുവച്ചു.
  alternative: ഓരോ പേരിനെയും വ്യക്തികളായോ ജനവിഭാഗങ്ങളായോ വ്യക്തമായി നിർണ്ണയിക്കുക.
  rationale: ജനതകളുടെ പട്ടികയിൽ പേരുകൾ പേരാദിപുരുഷന്മാരെയും അവരിൽനിന്നുള്ള ജനവിഭാഗങ്ങളെയും പ്രദേശങ്ങളെയും ഒരുമിച്ച് പ്രതിനിധീകരിക്കാം; മൂലവാചകം ഇവിടെ അത് തീർച്ചപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. ഹീബ്രുവിലെ പേരുകളുടെ ശബ്ദരൂപം കഴിയുന്നത്ര നിലനിർത്തി; അനാവശ്യമായി ഇംഗ്ലീഷ് ബൈബിൾ നാമരൂപങ്ങളെ ആശ്രയിച്ചിട്ടില്ല. മൂലത്തിലെ waw-കളെ ഓരോന്നും ‘ഉം/കൂടാതെ’ എന്നു യാന്ത്രികമായി ആവർത്തിക്കാതെ, മലയാള പട്ടികാശൈലിയിൽ കോമകളിലൂടെ സ്വാഭാവികമാക്കി.
