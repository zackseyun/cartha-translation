  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: ml
  text: ഇവരിൽനിന്ന് ജനതകളുടെ തീരദേശങ്ങൾ അവരുടെ ദേശങ്ങളിൽ വേർതിരിഞ്ഞു[a]—ഓരോരുത്തരും അവരവരുടെ ഭാഷയനുസരിച്ച്[b], അവരുടെ വംശക്കൂട്ടങ്ങൾപ്രകാരം, അവരുടെ ജനതകളിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനതകളുടെ ദ്വീപുകൾ അവരുടെ ദേശങ്ങളിൽ വേർതിരിഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ദ്വീപുകളെയോ തീരദേശങ്ങളെയോ സൂചിപ്പിക്കാം; ഈ വാക്യം പ്രദേശങ്ങളുടെ വേർതിരിവിനെയോ അവിടങ്ങളിലെ ജനങ്ങളുടെ പിരിഞ്ഞുപോകലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഓരോ മനുഷ്യനും അവന്റെ ഭാഷയനുസരിച്ച്’; ഓരോ വിഭാഗത്തെയും പ്രത്യേകം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: ഇവരിൽനിന്ന്
  rationale: מִן ചേർന്ന demonstrative ഇവിടെ മുമ്പ് പറഞ്ഞ യാഫെത്തിന്റെ സന്തതികളിൽനിന്നുള്ള ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: נִפְרְדוּ
  choice: വേർതിരിഞ്ഞു
  rationale: פרד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം വേർപെടുക/വേർതിരിയുക എന്ന അർഥം നൽകുന്നു; ഭൂവിഭാഗങ്ങളോ അവയുമായി ബന്ധപ്പെട്ട ജനവിഭാഗങ്ങളോ വേർതിരിഞ്ഞുവെന്ന മൂലവാക്യത്തിന്റെ തുറന്ന നില ഇത് നിലനിർത്തുന്നു.
- source_word: אִיֵּי הַגּוֹיִם
  choice: ജനതകളുടെ തീരദേശങ്ങൾ
  rationale: אִיִּים ദ്വീപുകളെയും കടൽത്തീര പ്രദേശങ്ങളെയും സൂചിപ്പിക്കാം. ഈ ജനവിവരണസന്ദർഭത്തിൽ ‘തീരദേശങ്ങൾ’ സ്വാഭാവികമാണ്; construct ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: בְּאַרְצֹתָם
  choice: അവരവരുടെ ദേശങ്ങളിൽ
  rationale: אֶרֶץ ഇവിടെ ഓരോ വിഭാഗത്തിന്റെയും അധിവാസഭൂമിയെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; distributive അർഥം മലയാളത്തിൽ ‘അവരവരുടെ’ എന്നു വ്യക്തമാക്കി.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: ഓരോന്നും അതതിന്റെ ഭാഷയനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോ മനുഷ്യനും അവന്റെ ഭാഷപ്രകാരം’ എന്ന distributive പ്രയോഗമാണ്. മുൻപുള്ള ‘തീരദേശങ്ങൾ’ എന്ന നപുംസക ബഹുവചനവിഷയത്തോട് സ്വാഭാവികമായി ചേരാൻ ഇങ്ങനെ നൽകി; വ്യക്തിഗത പുരുഷന്മാരെയല്ല, ഓരോ വിഭാഗത്തെയും ഉദ്ദേശിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശക്കൂട്ടങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഈ വംശാവലി-ജനവിഭാഗ സന്ദർഭത്തിൽ ആധുനിക അണുകുടുംബത്തെക്കാൾ വിശാലമായ clan grouping ആണ്.
- source_word: בְּגוֹיֵהֶם
  choice: അവരുടെ ജനതകളിൽ
  rationale: גּוֹי ജനത/ദേശീയ ജനവിഭാഗം എന്ന അർഥത്തിലാണ്; בְ എന്ന മുൻപ്രത്യയത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വേർതിരിഞ്ഞത് ഭൂവിഭാഗങ്ങളോ അവിടങ്ങളിലെ ജനങ്ങളോ എന്ന വ്യാഖ്യാനസാധ്യത
  choice: ‘ജനതകളുടെ തീരദേശങ്ങൾ വേർതിരിഞ്ഞു’ എന്ന മൂലഘടന നിലനിർത്തി
  alternative: ‘തീരദേശങ്ങളിലെ ജനങ്ങൾ പിരന്നുപോയി’
  rationale: ജനങ്ങളെയാണ് ക്രിയയുടെ യഥാർഥ കർത്താവായി വ്യക്തമാക്കുന്ന വ്യാഖ്യാനം സാധ്യമാണെങ്കിലും, അത് മൂലപാഠത്തിലെ אִיֵּי הַגּוֹיִם എന്ന വ്യാകരണഘടനയെ വ്യാഖ്യാനിച്ച് പരിഹരിക്കും. യഥാർഥമായ അസ്പഷ്ടത നിലനിർത്തുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വംശക്കൂട്ടങ്ങൾ’ എന്നത് clan എന്ന വിശാല സാമൂഹികഘടകത്തെ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യമായി അറിയിക്കുന്നു. മൂലപാഠത്തിലെ സമാന്തര വർഗീകരണക്രമം പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
