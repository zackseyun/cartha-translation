lexical_decisions:
- source_word: וְ/אֶת
  choice: -നെയും
  rationale: אֵת ഇവിടെ വംശാവലിപ്പട്ടികയിലെ പേരുകളെ നേരിട്ടുള്ള കർമങ്ങളായി അടയാളപ്പെടുത്തുന്നു; וְ അവയെ തമ്മിൽ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ഓരോ പേരിനോടും ചേർത്ത ‘-നെയും’ ഈ പട്ടികാസമന്വയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הֲדוֹרָם
  choice: ഹദോരാം
  rationale: വംശാവലിയിലെ സംജ്ഞാനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אוּזָל
  choice: ഊസാൽ
  rationale: എബ്രായത്തിലെ ദീർഘ ū സ്വരവും z വ്യഞ്ജനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
- source_word: דִּקְלָה
  choice: ദിക്ലാ
  rationale: സംജ്ഞാനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ എബ്രായ രൂപമായ Diqlāh-നോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
