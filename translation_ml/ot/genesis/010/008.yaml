id: GEN.10.8
reference: Genesis 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: ml
  text: കൂശ് നിമ്രോദിന്റെ പിതാവായി; അവൻ ഭൂമിയിൽ ഒരു പ്രബലനാകാൻ തുടങ്ങി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രബലൻ” എന്നതിന് “വീരൻ,” “ശക്തൻ,” “പരാക്രമി,” അല്ലെങ്കിൽ “യോദ്ധാവ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ഭൂമിയിൽ” എന്നതിന് “ദേശത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: കൂശ്
  rationale: വംശാവലിയുടെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ וְ വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയില്ല; വ്യക്തിനാമം ‘കൂശ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: വംശാവലിസന്ദർഭത്തിൽ പുരുഷവംശജനനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: נִמְרֹד
  choice: നിമ്രോദ്
  rationale: വ്യക്തിനാമത്തിന്റെ സാധാരണ മലയാള ലിപ്യന്തരണം.
- source_word: הוּא הֵחֵל לִהְיוֹת
  choice: അവൻ ... ആകാൻ തുടങ്ങി
  rationale: ‘ആരംഭിച്ചു’ എന്ന ഹീബ്രു അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘ആദ്യനായിത്തീർന്നു’ എന്ന പാഠത്തിൽ വ്യക്തമല്ലാത്ത മുൻഗണനാഭാവം ചേർക്കുന്നില്ല.
- source_word: גִּבֹּר
  choice: ഒരു വീരൻ
  rationale: ശക്തൻ, പരാക്രമി, യോദ്ധാവ്, വീരൻ എന്നീ സാധ്യതകളുള്ള പദത്തിന്റെ വിശാലത മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ഉല്പത്തി 10-ലെ ജനതകളുടെ വിശാലസന്ദർഭത്തിൽ ‘earth’ എന്ന അർഥം യോജിക്കുന്നു; എങ്കിലും ‘ദേശത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הֵחֵל לִהְיוֹת എന്നതിന്റെ ഭാവം
  choice: ആകാൻ തുടങ്ങി
  alternative: ആദ്യമായി ... ആയിത്തീർന്നു
  rationale: ഹീബ്രു വാചകം ആരംഭത്തെ വ്യക്തമാക്കുന്നു; നിമ്രോദ് ചരിത്രത്തിലെ ആദ്യത്തെ അത്തരം വ്യക്തിയായിരുന്നു എന്ന വ്യാഖ്യാനം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- issue: אֶרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ജനതകളുടെ പട്ടികയുടെ വിശാലസന്ദർഭം ‘ഭൂമി’യെ പിന്തുണയ്ക്കുന്നു; പ്രാദേശികമായ ‘ദേശം’ എന്ന അർഥസാധ്യതയും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പിതാവായി’ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ അർഥസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
