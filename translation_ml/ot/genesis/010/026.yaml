source:
  edition: WLC
  text: וְ/יָקְטָ֣ן יָלַ֔ד אֶת אַלְמוֹדָ֖ד וְ/אֶת שָׁ֑לֶף וְ/אֶת חֲצַרְמָ֖וֶת וְ/אֶת יָֽרַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: ml
  text: യോക്താൻ അൽമോദാദിനെയും ശാലെഫിനെയും ഹസർമാവെത്തിനെയും യേരഹിനെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָקְטָן
  choice: യോക്താൻ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; വാക്യാരംഭത്തിലെ וְ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: יָלַד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലി സന്ദർഭത്തിൽ പുരുഷൻ ഈ പേരുകളിലുള്ളവരുടെ പിതാവായി എന്ന ആശയം നൽകുന്നു; ‘ജനിപ്പിച്ചു’ ആ വംശാവലിബന്ധം സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ട കർമസൂചകമാണിത്; മലയാളത്തിൽ കർമവിഭക്തിയായ ‘-നെ/-യെ’ ഉപയോഗിച്ചാണ് അതിന്റെ വ്യാകരണധർമ്മം പ്രകടമാക്കിയത്.
- source_word: אַלְמוֹדָד
  choice: അൽമോദാദ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שָׁלֶף
  choice: ശാലെഫ്
  rationale: ഹീബ്രു സ്വരരൂപത്തെ പിന്തുടരുന്ന വ്യക്തിനാമ ലിപ്യന്തരണം.
- source_word: חֲצַרְמָוֶת
  choice: ഹസർമാവെത്ത്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു; ആദിയിലെ ח-യ്ക്ക് പ്രചാരത്തിലുള്ള ‘ഹ’ ഉപയോഗിച്ചു.
- source_word: יָרַח
  choice: യേരഹ്
  rationale: പേരിന്റെ ആദിയിലെ ഹീബ്രു യോദ് ‘യ’യായും അവസാന ח ‘ഹ്’യായും പ്രതിനിധീകരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: וְאֶת
  choice: ‘-നെയും’
  rationale: ഓരോ പേരിനുമുമ്പുമുള്ള ആവർത്തിത וְ മലയാളത്തിലെ സമുച്ചയ കർമപ്രത്യയമായ ‘-നെയും’ വഴി സ്വാഭാവികമായി നിലനിർത്തി; אֶת കർമവിഭക്തിയിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ഹീബ്രുവിൽ ഓരോ പേരിനുമുമ്പുമുള്ള ആവർത്തിത ‘ഉം/കൂടാതെ’ എന്ന ഘടന മലയാളത്തിലെ ‘-നെയും’ എന്ന ആവർത്തനത്തിലൂടെ സ്വാഭാവികമായി സംരക്ഷിച്ചതിനാൽ വിശദീകരണ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
