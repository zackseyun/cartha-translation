source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: ml
  text: മിസ്രയീം ലൂദീമിനെയും[a] അനാമീമിനെയും ലെഹാബീമിനെയും[b] നഫ്തുഹീമിനെയും ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതാവായി” അല്ലെങ്കിൽ “ഉളവാക്കി” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായക്രിയ സന്തതികളെ ഉളവാക്കുന്നതിന് വംശാവലികളിൽ സാധാരണയായി ഉപയോഗിക്കുന്ന പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവ ഇവിടെ സ്ഥലനാമങ്ങളായോ പിൽക്കാലത്തെ പ്രത്യേക ജനതകളായോ തിരിച്ചറിഞ്ഞ് പരിഭാഷപ്പെടുത്താതെ, ജനവിഭാഗങ്ങളുടെ പേരുകളായി ലിപ്യന്തരിച്ചു.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: മിസ്രയീം
  rationale: ജനതകളുടെ പട്ടികയിൽ ഈ പദം ഈജിപ്ത് എന്ന സ്ഥലനാമത്തെക്കാൾ ഒരു പൂർവികന്റെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: יָלַד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശാവലി സന്ദർഭത്തിൽ സന്തതികളുടെ പിതാവാകുക/അവരെ ഉളവാക്കുക എന്ന അർഥമുള്ള സാധാരണ എബ്രായ ക്രിയയാണ്; ‘ജനിപ്പിച്ചു’ മലയാളത്തിൽ സംക്ഷിപ്തവും വംശാവലിസ്വഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: സ്വതന്ത്രമായ പദാർഥമില്ലാത്ത നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാളത്തിലെ ‘-നെ/-യെ’ വിഭക്തിയിലൂടെ അതിന്റെ വ്യാകരണധർമ്മം പ്രകടമാക്കി.
- source_word: לוּדִים
  choice: ലൂദീം
  rationale: നിശ്ചിതമായ പിൽക്കാല ജനതയുമായോ സ്ഥലവുമായോ സമീകരിക്കാതെ, ബഹുവചന ജനവിഭാഗനാമം ലിപ്യന്തരിച്ചു.
- source_word: עֲנָמִים
  choice: അനാമീം
  rationale: വംശാവലിയിലെ ജനവിഭാഗനാമത്തിന്റെ സ്വഭാവം നിലനിർത്താൻ എബ്രായരൂപം ലിപ്യന്തരിച്ചു.
- source_word: לְהָבִים
  choice: ലെഹാബീം
  rationale: അനിശ്ചിതമായ ചരിത്രപരമായ തിരിച്ചറിയൽ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ എബ്രായ ജനവിഭാഗനാമം അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: נַפְתֻּחִים
  choice: നഫ്തുഹീം
  rationale: ഈ വംശാവലിപ്പട്ടികയിലെ ബഹുവചന ജനവിഭാഗനാമമായി എബ്രായരൂപം നിലനിർത്തി.
- source_word: וְ
  choice: -നെയും / ഉം
  rationale: എബ്രായത്തിലെ ആവർത്തിത സംയോജകത്തെ മലയാളത്തിൽ പട്ടികയിലെ ഓരോ കർമത്തോടും ചേർന്ന സ്വാഭാവിക സമുച്ചയരൂപങ്ങളാൽ പ്രതിനിധീകരിച്ചു.
