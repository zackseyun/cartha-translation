translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. പേരുകളുടെ എബ്രായ ബഹുവചനാവസാനം സൂചിപ്പിക്കുന്ന ‘-ീം’ നിലനിർത്തി; ആവർത്തിത കർമസൂചനം മലയാളത്തിലെ ‘-നെയും’ രൂപങ്ങളിലൂടെ സ്വാഭാവികമാക്കി.
