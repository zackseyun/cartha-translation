  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/002.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ml
  text: 'യെഫെത്തിന്റെ പുത്രന്മാർ: ഗോമെർ[a], മാഗോഗ്, മാദായി, യാവാൻ, തുബാൽ, മെശെക്ക്, തീരാസ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പിന്നീടുള്ള പ്രയോഗങ്ങളിൽ ഈ പേരുകളിൽ ചിലതിന് ജനവിഭാഗപരമോ ഭൂമിശാസ്ത്രപരമോ ആയ തിരിച്ചറിയലുകൾ ഉണ്ടായേക്കാം: ‘മാദായി’ = ‘മേദ്യർ’; ‘യാവാൻ’ = ‘അയോണിയ’ അഥവാ ‘ഗ്രീക്കുകാർ’. മുഖ്യപാഠം എബ്രായ വംശാവലിപ്പേരുകൾ ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: בֵּן എന്ന പദത്തിന്റെ construct ബഹുവചനം വംശാവലിപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്നു. എബ്രായത്തിലെ പുരുഷവംശപരമായ അവതരണം വിശാലമാക്കാതെ നേരിട്ട് നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: יֶפֶת
  choice: യാഫെത്ത്
  rationale: വ്യക്തിനാമമായതിനാൽ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: גֹּמֶר
  choice: ഗോമെർ
  rationale: യാഫെത്തിന്റെ പുത്രന്മാരുടെ പട്ടികയിലെ വ്യക്തിനാമം; അർത്ഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מָגוֹג
  choice: മാഗോഗ്
  rationale: പിന്നീടുള്ള പ്രയോഗങ്ങളിൽ ജനവിഭാഗമോ പ്രദേശമോ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ വംശാവലിയിലെ പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מָדַי
  choice: മാദായി
  rationale: ‘മേദ്യർ’ എന്ന ജനവിഭാഗവുമായി ബന്ധിപ്പിക്കാമെങ്കിലും ഇവിടെ വ്യക്തിനാമരൂപം നിലനിർത്തി.
- source_word: יָוָן
  choice: യാവാൻ
  rationale: ചില സന്ദർഭങ്ങളിൽ അയോണിയയെയോ ഗ്രീക്കുകാരെയോ സൂചിപ്പിക്കാമെങ്കിലും ഈ വംശാവലിയിൽ എബ്രായ പേരിന്റെ രൂപം സംരക്ഷിച്ചു.
- source_word: תֻבָל
  choice: തൂബാൽ
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֶשֶׁךְ
  choice: മെശെക്ക്
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: תִירָס
  choice: തീരാസ്
  rationale: വ്യക്തിനാമം; എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
