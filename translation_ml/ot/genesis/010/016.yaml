id: GEN.10.16
reference: Genesis 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ וְ/אֶת הָ֣/אֱמֹרִ֔י וְ/אֵ֖ת הַ/גִּרְגָּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: ml
  text: യെബൂസ്യരെയും[a] അമോര്യരെയും ഗിർഗാശ്യരെയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ജാതിനാമങ്ങൾ ഏകവചനത്തിലാണ് (‘യെബൂസ്യൻ,’ ‘അമോര്യൻ,’ ‘ഗിർഗാശ്യൻ’); എന്നാൽ ഈ വംശാവലിയിൽ അവ ജനസമൂഹങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: യെബൂസ്യർ
  rationale: എബ്രായത്തിൽ ഏകവചന ജാതിനാമമാണെങ്കിലും ജാതികളുടെ ഈ വംശാവലിപ്പട്ടികയിൽ ഒരു ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനരൂപം സ്വീകരിച്ചു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: ചുറ്റുമുള്ള ജാതിനാമങ്ങളെപ്പോലെ ഈ ഏകവചന ജാതിനാമവും ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַגִּרְגָּשִׁי
  choice: ഗിർഗാശ്യർ
  rationale: എബ്രായ ഏകവചന ജാതിനാമം ഇവിടെ ജനസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാള ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: וְאֶת / וְאֵת
  choice: -യെയും
  rationale: വാവ് എന്ന സംയോജകവും നേരിട്ടുള്ള കർമസൂചകമായ אֵת-ഉം ചേർന്ന് മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന പട്ടികയിലെ ഘടകങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ കർമസൂചകത്തോടുകൂടിയ ‘-യെയും’ എന്ന രൂപം ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഇത് മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനം അർധവിരാമം നൽകി; ജാതിനാമങ്ങൾക്ക് മലയാളത്തിൽ പരിചിതമായ ‘-യർ’ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
