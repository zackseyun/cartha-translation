translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; എല്ലാ പേരുകളും എബ്രായത്തിൽനിന്ന് ഏകോപിതമായി ലിപ്യന്തരിച്ചു.
