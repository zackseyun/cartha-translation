language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישׁ כִּתִּ֖ים וְ/דֹדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: ml
  text: 'യാവാന്റെ പുത്രന്മാർ: എലീശാ, തർശീശ്, കിത്തീം, ദോദാനീം[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളും 1 ദിനവൃത്താന്തം 1:7-ഉം ‘ദോദാനീം’ എന്നതിനുപകരം ‘രോദാനീം’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ എബ്രായ രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ‘സന്തതികൾ’ എന്ന വിശാല അർഥവും സാധ്യമെങ്കിലും പട്ടികയുടെ ഘടനയിൽ ‘പുത്രന്മാർ’ സ്വാഭാവികവും കൃത്യവുമാണ്. വാക്യാരംഭത്തിലെ וּ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ പട്ടികാശൈലിയിലൂടെ സ്വാഭാവികമാക്കി.
- source_word: יָוָן
  choice: യാവാൻ
  rationale: വ്യക്തി/ജനനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אֱלִישָׁה
  choice: എലീശാ
  rationale: പട്ടികയിലെ വ്യക്തി/സ്ഥലനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְ/תַרְשִׁישׁ
  choice: തർശീശ്
  rationale: പേരിനെ പരിഭാഷപ്പെടുത്താതെ, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ എബ്രായാധിഷ്ഠിത ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּתִּים
  choice: കിത്തീം
  rationale: ജനവിഭാഗമോ സ്ഥലമോ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം പേരായിത്തന്നെ നിലനിർത്തി; അവസാനത്തെ ദീർഘസ്വരം എബ്രായ -ים രൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְ/דֹדָנִים
  choice: ദോദാനീം
  rationale: പ്രധാനപാഠമായ WLC/മസോററ്റിക് പാഠത്തിലെ דֹדָנִים പിന്തുടർന്നു; ‘രോദാനീം’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
