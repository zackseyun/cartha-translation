id: GEN.10.12
reference: Genesis 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: ml
  text: നിനവേക്കും കാലഹിനും ഇടയിലുള്ള രെസെനും പണിതു; അതാണ് മഹാനഗരം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതാണ് മഹാനഗരം” എന്ന വാക്കുകൾ രെസെനെ മാത്രമോ, നിനവേക്കും കാലഹിനും ഇടയിലുള്ള വിശാലമായ നഗരമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת רֶסֶן
  choice: രേസെനും
  rationale: വാക്യം 11-ലെ ‘പണിതു’ എന്ന ക്രിയയുടെ തുടർന്നുള്ള കർമമായി ബന്ധകപ്രത്യയത്തോടെ സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵּין ... וּבֵין
  choice: '...ക്കും ...നും ഇടയിലുള്ള'
  rationale: രേസെന്റെ സ്ഥാനം സൂചിപ്പിക്കുന്ന എബ്രായ പരസ്പരബന്ധക ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: נִינְוֵה
  choice: നിനവേ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: כָּלַח
  choice: കാലഹ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം; അസ്സീറിയൻ രൂപമായ ‘കൽഹു’വിനെ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
- source_word: הִוא הָעִיר הַגְּדֹלָה
  choice: അതാണ് മഹാനഗരം
  rationale: സൂചകസർവനാമത്തിന്റെ വിശദീകരണസ്വഭാവവും നിർദിഷ്ടമായ ‘വലിയ/മഹത്തായ നഗരം’ എന്ന പ്രയോഗവും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ‘അതാണ് മഹാനഗരം’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: ആ സൂചന രേസെനെ മാത്രമാണോ വിശാലമായ നിനവേ–കാലഹ് നഗരമേഖലയെയാണോ ഉദ്ദേശിക്കുന്നത് എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിച്ചില്ല.
  alternative: ‘അത്’ രേസെനെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ നിനവേ, രേസെൻ, കാലഹ് എന്നിവ ഉൾപ്പെടുന്ന വലിയ നഗരമേഖലയെ സൂചിപ്പിക്കുന്നു.
  rationale: എബ്രായ വാക്യഘടന സൂചിതവിഷയം നിർവിവാദമായി നിശ്ചയിക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ ‘പണിതു’ എന്ന ക്രിയ തുടരുന്നതിനാൽ അർത്ഥസമ്പൂർണതയ്ക്കായി ആ ക്രിയ ആവർത്തിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
