  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി; ഹേത്തിനെക്കുറിച്ചുള്ള വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
