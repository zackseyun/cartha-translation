lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: കനാൻ
  rationale: വംശാവലിയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളത്തിൽ വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു ചേർത്തില്ല; כנען എന്ന പേര് ‘കനാൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: יָלַד
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശപരമ്പരയിൽ സന്താനോത്പാദനം സൂചിപ്പിക്കുന്ന ക്രിയയെ, പഴഞ്ചനല്ലാത്തതും മൂലത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നതുമായ ‘ജനിപ്പിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶת
  choice: '[പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഹീബ്രു വ്യാകരണഘടകത്തിന് മലയാളത്തിൽ പ്രത്യേക പദസമാനം ആവശ്യമില്ല.
- source_word: צִידֹן
  choice: സീദോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בְּכֹר/וֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: നാമവും മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും ചേർന്ന രൂപം സീദോൻ കനാന്റെ ആദ്യജാതനാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ കർത്താവിലേക്കുള്ള തിരിച്ചുസൂചനയ്ക്ക് ‘തന്റെ’ സ്വാഭാവികമാണ്.
- source_word: וְ/אֶת
  choice: -യെയും
  rationale: രണ്ടാമത്തെ കർമത്തെ ഒന്നാമത്തേതിനോടു ചേർക്കുന്ന conjunction മലയാളത്തിലെ സമുച്ചയകർമരൂപമായ ‘-യെയും’ വഴി പ്രകടമാക്കി; את പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: חֵת
  choice: ഹേത്ത്
  rationale: ഹീബ്രു വ്യക്തിനാമം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ലിപ്യന്തരിച്ചു.
