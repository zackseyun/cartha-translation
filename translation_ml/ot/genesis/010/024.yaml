  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: ml
  text: അർപക്ഷദ് ശേലഹിന്റെ പിതാവായി, ശേലഹ് ഏബെരിന്റെ പിതാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: അർപക്ഷദ്
  rationale: എബ്രായനാമമായ אַרְפַּכְשַׁד-ന്റെ ശബ്ദരൂപം കഴിയുന്നത്ര നേരിട്ട് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ഗ്രീക്ക് സ്വാധീനമുള്ള പരമ്പരാഗത രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
- source_word: יָלַד
  choice: പിതാവായി
  rationale: പുരുഷകർത്താവുള്ള വംശാവലിസന്ദർഭത്തിൽ ‘ജനിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത പാലിക്കുന്നതുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകം; മലയാളത്തിൽ വേറെ പദം ആവശ്യമില്ല.
- source_word: שָׁלַח / וְ/שֶׁלַח
  choice: ശേലഹ് / ശേലഹ്
  rationale: ഈ വാക്യത്തിലെ എബ്രായ സ്വരരൂപത്തെ അടിസ്ഥാനമാക്കി പേര് ഒരേവിധത്തിൽ ലിപ്യന്തരിച്ചു; വാവിനെ വാക്യഘടനയിൽ അർധവിരാമത്തിനു ശേഷമുള്ള തുടർച്ചയിലൂടെ പ്രതിനിധീകരിച്ചു.
- source_word: עֵבֶר
  choice: ഏബെർ
  rationale: എബ്രായ עֵבֶר എന്ന പേരിന്റെ സ്വരരൂപം പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം; ‘ഹേബെർ’ പോലുള്ള ഗ്രീക്ക്/പരമ്പരാഗത രൂപം ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ‘ജനിപ്പിച്ചു’ എന്നതിനുപകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പിതാവായി’ ഉപയോഗിച്ചു; എബ്രായാധിഷ്ഠിത പേരുരൂപങ്ങൾ നിലനിർത്തി.
