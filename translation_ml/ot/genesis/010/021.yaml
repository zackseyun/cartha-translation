id: GEN.10.21
reference: Genesis 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: ml
  text: ഏബെരിന്റെ സകല പുത്രന്മാരുടെയും പിതാവും യാഫെത്തിന്റെ മൂത്ത സഹോദരനുമായ[a] ശേമിനും മക്കൾ ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂത്തവനായ യാഫെത്തിന്റെ സഹോദരൻ.” എബ്രായത്തിലെ “വലിയ/മൂത്ത” എന്ന വിശേഷണം ശേമിനെയോ യാഫെത്തിനെയോ വിശേഷിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... גַּם הוּא
  choice: ശേമിനും
  rationale: വാവും לְ എന്ന ബന്ധപ്രത്യയവും גם הוא എന്ന ഊന്നലും ചേർന്ന് വംശാവലിയിൽ ശേമിനും സന്തതി ഉണ്ടായെന്ന കൂട്ടിച്ചേർക്കൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശേമിനും’ ഇത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֻלַּד
  choice: മക്കൾ ജനിച്ചു
  rationale: ഏകവചന ക്രിയാരൂപമാണെങ്കിലും ഇവിടെ ഒരാളുടെ സന്തതിയുടെ ജനനം പരിചയപ്പെടുത്തുന്ന വംശാവലിപരമായ പ്രയോഗമാണ്; മലയാളത്തിൽ ബഹുവചനാർത്ഥമുള്ള ‘മക്കൾ ജനിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: אֲבִי כָּל־בְּנֵי־עֵבֶר
  choice: ഏബെരിന്റെ സകല പുത്രന്മാരുടെയും പിതാവ്
  rationale: אָב എന്നത് വംശപിതാവിനെയും സൂചിപ്പിക്കാമെങ്കിലും നേരിട്ടുള്ള ‘പിതാവ്’ നിലനിർത്തുന്നു; בְּנֵי എന്നതിനെ ‘പുത്രന്മാർ’ എന്നു നൽകി ഏബെരിന്റെ പേര് പൊതുവായ ഒരു ജനവിഭാഗനാമമായി ലയിപ്പിക്കാതിരിക്കുന്നു.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: യാഫെത്തിന്റെ മൂത്ത സഹോദരൻ
  rationale: കുടുംബബന്ധത്തിന്റെ പശ്ചാത്തലത്തിൽ גָּדוֹל പ്രായമൂപ്പിനെ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ വിശേഷണം ശേമിനെ വിശേഷിപ്പിക്കുന്ന വായന സ്വീകരിക്കുന്നു; യാഫെത്തിനെ വിശേഷിപ്പിക്കാവുന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: הַגָּדוֹל എന്ന വിശേഷണം ശേമിനോടോ യാഫെത്തിനോടോ ചേരുന്നതെന്ന വ്യാകരണസന്ദിഗ്ധത
  choice: 'ശേമിനെ വിശേഷിപ്പിക്കുന്നതായി: ‘യാഫെത്തിന്റെ മൂത്ത സഹോദരൻ’'
  alternative: 'യാഫെത്തിനെ വിശേഷിപ്പിക്കുന്നതായി: ‘മൂത്തവനായ യാഫെത്തിന്റെ സഹോദരൻ’'
  rationale: എബ്രായ വാക്യഘടന രണ്ടു ബന്ധങ്ങളും അനുവദിക്കുന്നു. ഇത് വംശാവലിസംബന്ധമായ യഥാർത്ഥ വ്യാകരണസന്ദിഗ്ധതയായതിനാൽ പ്രധാന പാഠത്തിൽ ഒരു സാധ്യത സ്വീകരിച്ച് മറ്റേത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ വംശാവലിയുടെ ബന്ധഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിച്ചു.
