  revised_text: അവൻ യഹ്‌വേയുടെ മുമ്പാകെ പ്രബലനായ ഒരു വേട്ടക്കാരനായിരുന്നു. അതുകൊണ്ട്, “നിമ്രോദിനെപ്പോലെ യഹ്‌വേയുടെ മുമ്പാകെ പ്രബലനായ ഒരു വേട്ടക്കാരൻ” എന്നു പറയപ്പെടുന്നു.[a]
