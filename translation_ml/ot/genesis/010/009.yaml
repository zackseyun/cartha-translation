reference: Genesis 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: ml
  text: അവൻ യഹ്‌വേയുടെ മുമ്പാകെ പ്രബലനായ ഒരു വേട്ടക്കാരനായിരുന്നു. അതുകൊണ്ട്, “നിമ്രോദിനെപ്പോലെ യഹ്‌വേയുടെ മുമ്പാകെ പ്രബലനായ ഒരു വേട്ടക്കാരൻ” എന്നു പറയപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, വിശാലമായ സന്ദർഭത്തിൽ ഈ പ്രയോഗത്തിന് ശത്രുതാഭാവമുണ്ടെന്ന് മനസ്സിലാക്കുന്നെങ്കിൽ, “യഹ്‌വേയെ ധിക്കരിച്ചുകൊണ്ട്” എന്നാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר
  choice: പ്രബലനായ
  rationale: צַיִד എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ അസാധാരണമായ വേട്ടവൈദഗ്ധ്യവും കഴിവും സൂചിപ്പിക്കുന്നു; വേറിട്ടൊരു ‘വീരൻ’ എന്ന നാമപദപ്രയോഗമായി മാറ്റാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: צַיִד
  choice: വേട്ടക്കാരൻ
  rationale: ഈ പ്രയോഗത്തിൽ ‘വേട്ട’ അഥവാ ‘വേട്ടമൃഗം’ എന്നതിലുപരി വേട്ടയിൽ വൈദഗ്ധ്യമുള്ള വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: അടിസ്ഥാനമായ ‘സന്നിധിയിൽ/മുമ്പിൽ’ എന്ന ബന്ധാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സാധ്യമായ ശത്രുതാഭാവമുള്ള വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: തുടർന്നുവരുന്ന പഴഞ്ചൊല്ലിനോ പ്രചാരത്തിലുള്ള ചൊല്ലിനോ കാരണം അവതരിപ്പിക്കുന്ന സൂത്രവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵאָמַר
  choice: എന്നു പറയപ്പെടുന്നത്
  rationale: പ്രചാരത്തിലുള്ള ഒരു ചൊല്ല് അവതരിപ്പിക്കുന്ന കർത്താവില്ലാത്ത നിഷ്ക്രിയപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: כְּנִמְרֹד
  choice: നിമ്രോദിനെപ്പോലെ
  rationale: כְּ എന്ന താരതമ്യസൂചകത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: നിമ്രോദിനെ സംബന്ധിച്ച לִפְנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: യഹ്‌വേയുടെ മുമ്പാകെ
  alternative: യഹ്‌വേയെ ധിക്കരിച്ചുകൊണ്ട്
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അടിസ്ഥാനാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. സന്ദർഭത്തിൽ ചിലർ കാണുന്ന ശത്രുതാഭാവം ഉറപ്പിച്ചിട്ടില്ലാത്തതിനാൽ അത് അടിക്കുറിപ്പിൽ സാധ്യതയായി മാത്രം രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആവർത്തിച്ചുവരുന്ന എബ്രായപ്രയോഗം രണ്ടിടത്തും ഒരേ രീതിയിൽ നിലനിർത്തിയിരിക്കുന്നു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
