id: GEN.10.17
reference: Genesis 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַֽ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/017.yaml
  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: ml
  text: ഹിവ്യരും[a] അർക്ക്യരും സീന്യരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹിവ്യവംശം, അർക്ക്യവംശം, സീന്യവംശം.’ എബ്രായത്തിൽ നിർദ്ദിഷ്ട ആർട്ടിക്കിളോടുകൂടിയ ഏകവചന ജനവിഭാഗനാമങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവ ഇവിടെ ജനങ്ങളെയോ വംശങ്ങളെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: -ഉം
  rationale: വംശാവലിപ്പട്ടികയിലെ തുടർച്ചയായ ഇനങ്ങളെ ബന്ധിപ്പിക്കുന്ന וְ എന്ന സംയോജകത്തിന്റെ അർഥം മലയാളത്തിൽ ഓരോ ജനനാമത്തോടും ചേർക്കുന്ന ‘-ഉം’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; אֶת എന്ന കർമസൂചകത്തിന് ഇവിടെ വേറെ പരിഭാഷ ആവശ്യമില്ല.
- source_word: הַחִוִּי
  choice: ഹിവ്യർ
  rationale: ഏകവചന ജനവിഭാഗനാമം നിർദ്ദിഷ്ട ആർട്ടിക്കിളോടുകൂടി സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘ഹിവ്യർ’ ആ കൂട്ടായ ജനവിഭാഗത്തെ സ്വാഭാവികമായ മലയാള ബഹുവചനരൂപത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָעַרְקִי
  choice: അർക്ക്യർ
  rationale: അർക്കയുമായി ബന്ധപ്പെട്ട നിവാസികളെയോ വംശക്കാരെയോ സൂചിപ്പിക്കുന്ന സമൂഹവാചക ജനനാമമാണിത്; പട്ടികയുടെ രൂപം നിലനിർത്താൻ ‘അർക്ക്യർ’ എന്നു നൽകുന്നു.
- source_word: הַסִּינִי
  choice: സീന്യർ
  rationale: സീൻ എന്ന സ്ഥലമോ വംശമോ സംബന്ധിച്ച ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചക രൂപം; മറ്റു ജനനാമങ്ങളോടൊത്ത മലയാള രൂപമായി ‘സീന്യർ’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വംശാവലിപ്പട്ടികാശൈലി. എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനങ്ങളെ സ്വാഭാവികമായ മലയാള ബഹുവചന ജനനാമങ്ങളാക്കി; വംശം എന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
