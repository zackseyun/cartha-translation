id: GEN.10.22
reference: Genesis 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: ml
  text: 'ശേമിന്റെ പുത്രന്മാർ: ഏലാം, അശ്ശൂർ, അർപ്പക്ഷദ്[a], ലൂദ്, അരാം[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ നാമം ‘അർപ്പക്ഷദ്’; ഗ്രീക്ക് രൂപത്തിന്റെ സ്വാധീനമുള്ള ചില പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ‘അർഫക്സാദ്’ എന്ന രൂപം കാണാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അശ്ശൂർ’, ‘അരാം’ എന്നീ എബ്രായ നാമങ്ങൾ പിൽക്കാലത്ത് യഥാക്രമം അശ്ശൂര്യ, അരാം/സിറിയ എന്നീ പ്രദേശങ്ങളോടും ജനവിഭാഗങ്ങളോടും ബന്ധപ്പെടുത്തി കാണപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പശ്ചാത്തലത്തിൽ എബ്രായ നിർമിത ബഹുവചനമായ ‘ശേമിന്റെ പുത്രന്മാർ’ എന്ന പുരുഷവംശപരമായ രൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שֵׁם
  choice: ശേം
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: עֵילָם
  choice: ഏലാം
  rationale: വംശജനാമമായും സ്ഥലനാമമായും വരുന്ന എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: אַשּׁוּר
  choice: അശ്ശൂർ
  rationale: അശ്ശൂര്യ എന്ന പിൽക്കാല ദേശനാമത്തിലേക്ക് വ്യാഖ്യാനിക്കാതെ, വംശാവലിയിൽ നൽകിയിരിക്കുന്ന എബ്രായ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: אַרְפַּכְשַׁד
  choice: അർപ്പക്ഷദ്
  rationale: ഗ്രീക്ക് സ്വാധീനമുള്ള പരമ്പരാഗത രൂപത്തിനുപകരം മസോററ്റിക് എബ്രായ വ്യഞ്ജനങ്ങളെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: לוּד
  choice: ലൂദ്
  rationale: വാക്യത്തിലെ ഏകവചന നാമത്തെ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു; ‘ലൂദീം’ എന്ന വ്യത്യസ്ത രൂപം ഉപയോഗിക്കുന്നില്ല.
- source_word: אֲרָם
  choice: അരാം
  rationale: ‘സിറിയ’ എന്ന പിൽക്കാല ഭൂമിശാസ്ത്രപരമായ സമാനപദം നൽകാതെ എബ്രായ നാമം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വംശാവലിപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും വ്യക്തിനാമങ്ങളുടെ എബ്രായാധിഷ്ഠിത രൂപങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പേരുകൾക്കുശേഷം മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
