  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: ml
  text: നോഹയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങൾ, അവരുടെ വംശാവലികൾക്കനുസരിച്ചും അവരുടെ ജനതകളിലുമായി, ഇവയാണ്. ഇവരിൽനിന്ന് പ്രളയത്തിനുശേഷം ഭൂമിയിൽ ജനതകൾ വേർപിരിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വേർപിരിഞ്ഞു” എന്നതിന് “വിഭജിക്കപ്പെട്ടു” അല്ലെങ്കിൽ “വ്യാപിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: കുടുംബങ്ങൾ
  rationale: ബന്ധുത്വത്തെ അടിസ്ഥാനമാക്കിയുള്ള കുടുംബവിഭാഗങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: לְתוֹלְדֹתָם
  choice: വംശാവലികൾപ്രകാരം
  rationale: തലമുറകൾ, സന്തതിപരമ്പര, വംശാവലി എന്നീ അർഥസാധ്യതകളുള്ള תּוֹלְדוֹת ഇവിടെ ജാതിപ്പട്ടികയുടെ സമാപനസംഗ്രഹമായതിനാൽ ‘വംശാവലികൾപ്രകാരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּגוֹיֵהֶם
  choice: അവരുടെ ജനതകളായി
  rationale: בְּ എന്നതിന്റെ വർഗീകരണപരമായ ഭാവവും גּוֹי എന്നതിന്റെ ജനത/ദേശീയ സമൂഹം എന്ന അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וּמֵאֵלֶּה
  choice: ഇവരിൽനിന്നാണ്
  rationale: മുമ്പ് വിവരിച്ച നോഹയുടെ സന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്; മനുഷ്യരെ പരാമർശിക്കുന്നതിനാൽ ‘ഇവരിൽനിന്ന്’ സ്വാഭാവികമാണ്.
- source_word: נִפְרְדוּ
  choice: വേർപിരിഞ്ഞത്
  rationale: നിഫാൽ രൂപത്തിലുള്ള വേർപെടൽ/വിഭജനം എന്ന ആശയം നിലനിർത്തുന്നു; ‘ചിതറിപ്പാർത്തു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: നോഹയുടെ പുത്രന്മാരിൽനിന്നുണ്ടായ വ്യത്യസ്ത ജനസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ജനതകൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ജാതിപ്പട്ടികയുടെ സാർവലൗകിക പരിധിയിൽ אֶרֶץ ഒരു പ്രാദേശിക ദേശത്തേക്കാൾ ഭൂമിയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: אַחַר הַמַּבּוּל
  choice: പ്രളയത്തിനുശേഷം
  rationale: കാലസൂചന നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: പ്രളയാനന്തര ജനവ്യാപനസംഗ്രഹത്തിലെ אֶרֶץ എന്നതിന്റെ പരിധി
  choice: സാർവലൗകികമായ ‘ഭൂമി’
  alternative: പ്രാദേശികമായ ‘ദേശം’
  rationale: ഉല്പത്തി 10 നോഹയുടെ സന്തതികളിൽനിന്നുണ്ടായ ജനതകളുടെ സമഗ്ര പട്ടികയായതിനാൽ ഇവിടെ ഭൂമിയാകെ എന്ന പരിധിയാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- issue: נִפְרְדוּ സൂചിപ്പിക്കുന്ന വേർപെടലോ വ്യാപനമോ
  choice: വേർപിരിഞ്ഞു
  alternative: ചിതറിപ്പാർത്തു / വ്യാപിച്ചു
  rationale: മൂലക്രിയയുടെ വേർപെടൽ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുകയും ജനതകൾ എങ്ങനെ വ്യാപിച്ചു എന്നതിനെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. എബ്രായത്തിലെ വർഗീകരണവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യവാക്യം പുനഃക്രമീകരിച്ചു; വംശാവലി, ജനത, വേർപെടൽ എന്നീ പ്രധാന ആശയങ്ങൾ നിലനിർത്തി.
