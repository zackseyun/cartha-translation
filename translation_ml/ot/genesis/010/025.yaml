id: GEN.10.25
reference: Genesis 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: ml
  text: ഏബെരിനും രണ്ടു പുത്രന്മാർ ജനിച്ചു. ഒരുവന്റെ പേര് പെലെഗ് ആയിരുന്നു; കാരണം, അവന്റെ കാലത്ത് ഭൂമി വിഭജിക്കപ്പെട്ടു.[a] അവന്റെ സഹോദരന്റെ പേര് യോക്താൻ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദേശം വിഭജിക്കപ്പെട്ടു.” എബ്രായപദത്തിന് “ഭൂമി” എന്നും “ദേശം” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר
  choice: ഏബെരിന്
  rationale: വംശാവലിയുടെ അടുത്ത അറിയിപ്പിലേക്കുള്ള ബന്ധം മലയാളത്തിലെ തുടർച്ചയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ അധികമായ ‘അങ്ങനെ’ ചേർക്കാതെ ദാതൃപ്രയോഗം നിലനിർത്തി.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: രണ്ടു പുത്രന്മാർ ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും ബഹുവചന കർത്താവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘ജനിപ്പിച്ചു’ എന്ന് മാറ്റുന്നില്ല.
- source_word: שֵׁם הָאֶחָד
  choice: ഒരുവന്റെ പേര്
  rationale: ‘ആദ്യത്തവൻ’ എന്നു ക്രമം നിർണ്ണയിക്കാതെ, ഒരുവനെയും അവന്റെ സഹോദരനെയും വേർതിരിക്കുന്ന എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פֶּלֶג
  choice: പേലെഗ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: כִּי בְיָמָיו
  choice: അവന്റെ കാലത്ത് … എന്നതിനാലാണ്
  rationale: כִּי നൽകുന്ന പേരിന്റെ വിശദീകരണബന്ധവും בְיָמָיו എന്ന കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִפְלְגָה
  choice: വിഭജിക്കപ്പെട്ടു
  rationale: פלג എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ അർത്ഥം നിലനിർത്തുന്നു; വിഭജനം എങ്ങനെ സംഭവിച്ചു എന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ഉല്പത്തി 10-ലെ ജനതകളുടെ വിശാല പശ്ചാത്തലത്തിൽ ‘earth’ എന്ന വ്യാപക അർത്ഥം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; ‘ദേശം’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְשֵׁם אָחִיו
  choice: അവന്റെ സഹോദരന്റെ പേര്
  rationale: എബ്രായത്തിലെ ബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: יָקְטָן
  choice: യോക്താൻ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തോട് അടുത്തതായി ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: പേലെഗിന്റെ പേരിന്റെ വിശദീകരണത്തിൽ הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ജനതകളുടെ വംശാവലി എന്ന വിശാല സന്ദർഭം കണക്കിലെടുത്ത് മുഖ്യവാചകത്തിൽ ‘ഭൂമി’ സ്വീകരിച്ചു. എങ്കിലും വിഭജനത്തിന്റെ കൃത്യമായ വ്യാപ്തിയോ ചരിത്രരീതിയോ നിർണ്ണയിക്കുന്നില്ല; എബ്രായപദത്തിന്റെ പ്രാദേശിക അർത്ഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി-വിവരണ ശൈലി. പേരിന്റെ അർത്ഥബന്ധം വിശദീകരിക്കാൻ സ്വാഭാവികമായ കാരണവാക്യം ഉപയോഗിച്ചെങ്കിലും വിഭജനത്തിന്റെ സ്വഭാവം വ്യാഖ്യാനിച്ചിട്ടില്ല.
