  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: ml
  text: ഇവരാണ് ശേമിന്റെ പുത്രന്മാർ—അവരുടെ കുലങ്ങൾക്കും അവരുടെ ഭാഷകൾക്കും അനുസരിച്ച്, അവരുടെ ദേശങ്ങളിൽ, അവരുടെ ജനതകൾക്കും അനുസരിച്ച്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരുടെ കുലങ്ങൾ പ്രകാരവും … അവരുടെ ഭാഷകൾ പ്രകാരവും … അവരുടെ ജനതകൾ പ്രകാരവും.” എബ്രായത്തിൽ കുലങ്ങൾ, ഭാഷകൾ, ജനതകൾ എന്നിവയോടൊപ്പം വർഗീകരണം സൂചിപ്പിക്കുന്ന ഒരേ ബന്ധപ്രത്യയം ആവർത്തിക്കുന്നു; “അവരുടെ ദേശങ്ങളിൽ” എന്നിടത്ത് സ്ഥലസൂചകമായ വേറൊരു ബന്ധപ്രത്യയമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ സംഗ്രഹവാക്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചകമായും നിർണ്ണായകമായും അവതരിപ്പിക്കുന്നു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: വംശാവലിയുടെ പുരുഷരേഖാപരമായ ഔപചാരിക പ്രയോഗം നിലനിർത്തുന്നു; വിശാലമായ ‘സന്തതികൾ’ എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: שֵׁם
  choice: ശേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾ അനുസരിച്ച്
  rationale: മִשְׁפָּחָה ഇവിടെ ഗോത്ര-വംശാവലി വിഭാഗമായ കുലത്തെ സൂചിപ്പിക്കുന്നു; לְ വർഗീകരണം രേഖപ്പെടുത്തുന്നു.
- source_word: לִלְשֹׁנֹתָם
  choice: ഭാഷകൾ അനുസരിച്ച്
  rationale: അക്ഷരാർഥമായ ‘നാവുകൾ’ എന്നതിനു പകരം ജനതകളുടെ ഭാഷാവിഭാഗങ്ങൾ എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְאַרְצֹתָם
  choice: ദേശങ്ങളിൽ
  rationale: בְ എന്ന സ്ഥലസൂചകവും ബഹുവചനമായ ഭൂവിഭാഗങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ആധുനിക രാഷ്ട്രസംവിധാനം സൂചിപ്പിക്കുന്ന ‘രാജ്യങ്ങൾ’ ഒഴിവാക്കുന്നു.
- source_word: לְגוֹיֵהֶם
  choice: രാഷ്ട്രങ്ങൾ അനുസരിച്ച്
  rationale: גּוֹי എന്നത് ഇവിടെ വേർതിരിച്ച ജനസമൂഹങ്ങളെയോ രാഷ്ട്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ച לְ-യുടെ വർഗീകരണപ്രയോഗം നിലനിർത്തുന്നു.
