revisions:
- from: ഇവരാണ് ശേമിന്റെ പുത്രന്മാർ—അവരുടെ കുലങ്ങൾ അനുസരിച്ചും ഭാഷകൾ അനുസരിച്ചും ദേശങ്ങളിൽ രാഷ്ട്രങ്ങൾ അനുസരിച്ചും.[a]
  to: ഇവരാണ് ശേമിന്റെ പുത്രന്മാർ—അവരുടെ കുലങ്ങൾക്കും അവരുടെ ഭാഷകൾക്കും അനുസരിച്ച്, അവരുടെ ദേശങ്ങളിൽ, അവരുടെ ജനതകൾക്കും അനുസരിച്ച്.[a]
