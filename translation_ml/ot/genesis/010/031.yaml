translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലി ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച വർഗീകരണഘടന കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും, ‘ദേശങ്ങളിൽ’ എന്ന സ്ഥലസൂചകഘടകം പ്രത്യേകം സംരക്ഷിച്ചു.
