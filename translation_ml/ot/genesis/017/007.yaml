id: GEN.17.7
reference: Genesis 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: ml
  text: ഞാൻ എന്റെ ഉടമ്പടി എനിക്കും നിനക്കും ഇടയിലും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും ഇടയിലും, അവരുടെ തലമുറകളിലുടനീളം ഒരു ശാശ്വത ഉടമ്പടിയായി സ്ഥാപിക്കും—നിനക്കു ദൈവമായിരിക്കാനും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കു ദൈവമായിരിക്കാനും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സന്തതി’ എന്നു വിവർത്തനം ചെയ്ത എബ്രായപദം സമൂഹവാചക ഏകവചനമാണ്; ‘വിത്ത്’ എന്നോ ‘പിൻതലമുറകൾ’ എന്നോ വിവർത്തനം ചെയ്യാനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ വ്യവഹാരപരമായി: ‘നിന്റെ ദൈവമായിരിക്കാനും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിയുടെ ദൈവമായിരിക്കാനും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: ഞാൻ സ്ഥാപിക്കും
  rationale: הקים എന്ന ക്രിയയ്ക്ക് בְּרִית എന്ന പദത്തോടൊപ്പം ഒരു ഉടമ്പടി സ്ഥാപിക്കുക അഥവാ ഉറപ്പിക്കുക എന്ന അർഥമുണ്ട്. ഇവിടെ ‘സ്ഥാപിക്കും’ എന്നത് ഉടമ്പടിയുടെ തുടക്കവും ദൃഢതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്നതിന്റെ സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളരൂപമാണ് ‘ഉടമ്പടി’; ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ‘എന്റെ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: എനിക്കും നിനക്കും മധ്യേയും
  rationale: ആവർത്തിക്കുന്ന בֵּין ഘടന ഉടമ്പടിയിലെ കക്ഷികളെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി അല്പം മിനുക്കിയെങ്കിലും ബന്ധസൂചന നിലനിർത്തി.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע ഒരു സമൂഹവാചക ഏകവചനമാണ്; ‘സന്തതി’ അതിന്റെ ഏകവചന-സമൂഹവാചക സ്വഭാവവും ‘വിത്ത്’/‘പിൻതലമുറകൾ’ എന്ന സാധ്യതകളും അമിതമായി നിർണയിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: אַחֲרֶיךָ
  choice: നിനക്കുശേഷമുള്ള
  rationale: കാലപരവും വംശപരവുമായ തുടർച്ചയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְדֹרֹתָם
  choice: അവരുടെ തലമുറകളിലുടനീളം
  rationale: തുടർച്ചയായ തലമുറകളിലൂടെയുള്ള ഉടമ്പടിയുടെ നിലനിൽപ്പ് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: לִבְרִית עוֹלָם
  choice: ഒരു ശാശ്വത ഉടമ്പടിയായി
  rationale: עוֹלָם ഇവിടെ ദീർഘകാലികവും നിലനിൽക്കുന്നതുമായ ഉടമ്പടിയെ സൂചിപ്പിക്കുന്നു. ‘ശാശ്വത’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ രൂപമാണ്.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: നിനക്ക് ദൈവമായിരിക്കേണ്ടതിന്
  rationale: ‘നിനക്കു ദൈവമായിരിക്കുക’ എന്ന എബ്രായ ബന്ധസൂത്രത്തെ അടുത്തായി നിലനിർത്തുന്നു; കൂടുതൽ വ്യവഹാരപരമായ ‘നിന്റെ ദൈവമായിരിക്കേണ്ടതിന്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും
  rationale: മുമ്പത്തെ זֶרַע എന്ന സമൂഹവാചക പദത്തിന്റെ വിവർത്തനം സ്ഥിരമായി നിലനിർത്തുകയും വംശപരമായ തുടർച്ച വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ זֶרַע എന്ന സമൂഹവാചക ഏകവചനം
  choice: നിന്റെ സന്തതി
  alternative: നിന്റെ വിത്ത്; നിന്റെ പിൻതലമുറകൾ
  rationale: ‘സന്തതി’ സമൂഹപരമായ അർഥം വഹിക്കുമ്പോഴും പദത്തെ നിർബന്ധമായി ബഹുവചനമാക്കുന്നില്ല; അതിനാൽ വാചകത്തിലെ യഥാർഥമായ ഏകവചന-സമൂഹവാചക പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: ഉടമ്പടി സൂത്രവാക്യത്തിന്റെ ബന്ധപരമായ രൂപം
  choice: നിനക്ക് ദൈവമായിരിക്കേണ്ടതിന്
  alternative: നിന്റെ ദൈവമായിരിക്കേണ്ടതിന്
  rationale: മൂലത്തിലെ לְךָ לֵאלֹהִים എന്ന ബന്ധപരമായ ഘടനയോട് അടുത്തുനിൽക്കുന്നു; ഉടമസ്ഥതയുടെ അർഥം മാത്രം മുൻനിർത്തി ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മത നിർണയിക്കുന്നില്ല.
- issue: בְּרִית עוֹלָם എന്നതിലെ കാലദൈർഘ്യം
  choice: ശാശ്വത ഉടമ്പടി
  alternative: എന്നേക്കുമുള്ള ഉടമ്പടി; സ്ഥിരമായ ഉടമ്പടി
  rationale: עוֹלָם എന്ന പദത്തിന്റെ ഉടമ്പടിസന്ദർഭത്തിലെ നിലനിൽക്കുന്ന ദൈർഘ്യം ഗൗരവത്തോടെ അവതരിപ്പിക്കുന്നു; അതിന്റെ എല്ലാ ദൈവശാസ്ത്രപരമായ പ്രയോഗപരിധികളും വിവർത്തനത്തിലൂടെ അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഉടമ്പടി-ഭാഷ ഉപയോഗിച്ചു. ‘സന്തതി’ എന്ന പദം സമൂഹവാചക ഏകവചനത്തിലെ യഥാർഥമായ അവ്യക്തത സംരക്ഷിക്കുന്നു. മുഖ്യവാക്യത്തിലെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി ദീർഘരേഖകൊണ്ട് വിഭജിച്ചെങ്കിലും മൂലത്തിലെ ആശയക്രമം നിലനിർത്തി.
