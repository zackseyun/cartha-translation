revisions:
- from: 'ദൈവം അബ്രാഹാമിനോടു പറഞ്ഞു: “നീയാകട്ടെ, എന്റെ ഉടമ്പടി പാലിക്കണം—നീയും നിനക്കുശേഷം നിന്റെ സന്തതിയും, അവരുടെ തലമുറകളിലെല്ലാം.”'
  to: 'ദൈവം അബ്രാഹാമിനോടു പറഞ്ഞു: “നീയാകട്ടെ, എന്റെ ഉടമ്പടി പാലിക്കണം; നീയും നിനക്കുശേഷം നിന്റെ സന്തതിയും[a] തലമുറതലമുറയായി അത് പാലിക്കണം.”'
