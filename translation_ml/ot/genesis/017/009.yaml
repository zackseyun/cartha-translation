id: GEN.17.9
reference: Genesis 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: ml
  text: 'ദൈവം അബ്രാഹാമിനോടു പറഞ്ഞു: “നീയാകട്ടെ, എന്റെ ഉടമ്പടി പാലിക്കണം; നീയും നിനക്കുശേഷം നിന്റെ സന്തതിയും[a] തലമുറതലമുറയായി അത് പാലിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർത്ഥം, “നിന്റെ വിത്ത്”; ഇവിടെ ഇത് കൂട്ടായ അർഥത്തിൽ നിന്റെ സന്തതിയെ സൂചിപ്പിക്കുന്നു.
    reason: זֶרַע എന്ന ഏകവചന കൂട്ടായ നാമത്തിന്റെ കൂടുതൽ അക്ഷരീയമായ പരിഭാഷ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ‘പറഞ്ഞു’ മതിയായ നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: അബ്രാഹാമിനോടു ഉടമ്പടിസംബന്ധമായി സംസാരിക്കുന്ന ദൈവത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ദൈവം’ എന്നത് പതിവും നേരിട്ടുമുള്ള പരിഭാഷയാണ്.
- source_word: אֶל־אַבְרָהָם
  choice: അബ്രാഹാമിനോടു
  rationale: ഹീബ്രു പാഠത്തിൽ പേരുമാറ്റത്തിനുശേഷമുള്ള ‘അബ്രാഹാം’ തന്നെയാണ്; אֶל സംസാരത്തിന്റെ അഭിമുഖം സൂചിപ്പിക്കുന്നതിനാൽ ‘-നോടു’ സ്വാഭാവികമാണ്.
- source_word: וְאַתָּה
  choice: നീയാകട്ടെ
  rationale: മുന്നിൽ നിൽക്കുന്ന സർവനാമത്തിന്റെ ഊന്നലും, ദൈവത്തിന്റെ വാഗ്ദാനങ്ങളിൽനിന്ന് അബ്രാഹാമിന്റെ ഉത്തരവാദിത്വത്തിലേക്കുള്ള വിഷയമാറ്റവും പ്രകടമാക്കുന്നു.
- source_word: אֶת־בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള בְּרִית എന്ന ഉടമ്പടിപദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: תִשְׁמֹר
  choice: പാലിക്കണം
  rationale: שׁמר എന്നതിന് ‘കാക്കുക, പാലിക്കുക, അനുഷ്ഠിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്; ഉടമ്പടിയുടെ ബാധ്യത വ്യക്തമാക്കാൻ ആധുനിക മലയാളത്തിൽ ‘പാലിക്കണം’ സ്വാഭാവികവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: നീയും ... നിന്റെ സന്തതിയും
  rationale: זֶרַע വ്യാകരണപരമായി ഏകവചനമായ ഒരു സമൂഹനാമമാണ്. ‘സന്തതി’ അതിന്റെ കൂട്ടായ വംശപരമ്പരാഗത അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אַחֲרֶיךָ
  choice: നിനക്കുശേഷം
  rationale: വംശപരമ്പരയിലെ തുടർച്ചയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: לְדֹרֹתָם
  choice: അവരുടെ തലമുറകളിലെല്ലാം
  rationale: തുടർന്നുവരുന്ന എല്ലാ തലമുറകളിലുമുള്ള ബാധ്യതയും തുടർച്ചയും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിബാധ്യതയ്ക്ക് അധിക നിയമപരമോ ആചാരപരമോ ആയ അർഥം ചേർക്കാതിരിക്കുക
  choice: എന്റെ ഉടമ്പടി പാലിക്കണം
  alternative: എന്റെ ഉടമ്പടി കാക്കണം / അനുഷ്ഠിക്കണം
  rationale: വാക്യം അബ്രാഹാമിനും അവന്റെ സന്തതിക്കും ഉള്ള ഉടമ്പടിബാധ്യത പ്രസ്താവിക്കുന്നു. ‘പാലിക്കണം’ എന്നത് നിർബന്ധസ്വഭാവം വ്യക്തമാക്കുമ്പോഴും ഹീബ്രുവിനപ്പുറം പ്രത്യേക നിയമപരമോ വിഭാഗീയമോ ആയ ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നീയാകട്ടെ’ മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘സന്തതി’ ഏകവചന സമൂഹനാമത്തിന്റെ സ്വഭാവം സംരക്ഷിക്കുന്നു.
