id: GEN.17.5
reference: Genesis 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: ml
  text: ഇനി നിന്റെ പേര് അബ്രാം എന്നു വിളിക്കപ്പെടുകയില്ല; നിന്റെ പേര് അബ്രാഹാം എന്നായിരിക്കും. കാരണം, ഞാൻ നിന്നെ അനേകം ജനതകളുടെ പിതാവാക്കിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദശഃ: ‘ഞാൻ നിന്നെ അനേകം ജനതകളുടെ പിതാവായി നൽകിയിരിക്കുന്നു.’'
    reason: נְתַתִּיךָ എന്ന ക്രിയയുടെ പദശഃ അർഥമായ ‘നൽകിയിരിക്കുന്നു’ എന്ന വിവർത്തനസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: יִקָּרֵא
  choice: വിളിക്കപ്പെടുകയില്ല
  rationale: നാമകരണം സൂചിപ്പിക്കുന്ന നിഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עוֹד
  choice: ഇനി ... ഇല്ല
  rationale: לֹא എന്ന നിഷേധത്തോടൊപ്പം, ഇപ്പോൾമുതൽ പഴയ പേര് ഉപയോഗിക്കപ്പെടുന്നത് അവസാനിക്കുന്നു എന്ന കാലസൂചന നൽകുന്നു.
- source_word: שִׁמְךָ
  choice: നിന്റെ പേര്
  rationale: രണ്ടാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള രൂപത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְהָיָה
  choice: എന്നായിരിക്കും
  rationale: പഴയ പേരിനുപകരം പുതിയ പേര് നിലവിൽ വരുമെന്ന നാമമാറ്റ പ്രഖ്യാപനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വിരുദ്ധത വിരാമചിഹ്നത്തിലൂടെയും വാക്യക്രമത്തിലൂടെയും വ്യക്തമാകുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כִּי
  choice: കാരണം
  rationale: പുതിയ പേര് നൽകുന്നതിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אַב
  choice: പിതാവ്
  rationale: പേരുമായി ബന്ധപ്പെട്ട പദപ്രയോഗവും ഉടമ്പടി സന്ദർഭവും നിലനിർത്തുന്ന സാധാരണ അർഥം.
- source_word: הֲמוֹן
  choice: അനേകം
  rationale: വലിയ സംഖ്യയെയോ ബഹുലതയെയോ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; גּוֹיִם എന്ന ബഹുവചനത്തോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: גּוֹיִם
  choice: ജനതകൾ
  rationale: ഇവിടെ വിവിധ ജനവിഭാഗങ്ങളെയോ രാഷ്ട്രജനങ്ങളെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ എന്ന അനാവശ്യമായ പിൽക്കാല മതസൂചന ഒഴിവാക്കുന്നു.
- source_word: נְתַתִּיךָ
  choice: ഞാൻ നിന്നെ ... ആക്കിയിരിക്കുന്നു
  rationale: പദശഃ ‘നൽകിയിരിക്കുന്നു’ എന്നതായാലും ഈ വിധേയഘടനയിൽ ‘ആക്കിയിരിക്കുന്നു’ സ്വാഭാവികമാണ്; ഹീബ്രു സമ്പൂർണരൂപത്തിന്റെ പൂർത്തിയായ ദൈവിക പ്രഖ്യാപനബലം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക നാമമാറ്റ പ്രഖ്യാപനത്തിലെ പൂർത്തിയായ ക്രിയാഭാവം
  choice: ഞാൻ നിന്നെ അനേകം ജനതകളുടെ പിതാവാക്കിയിരിക്കുന്നു
  alternative: ഞാൻ നിന്നെ അനേകം ജനതകളുടെ പിതാവാക്കും
  rationale: נְתַתִּיךָ സമ്പൂർണരൂപത്തിലാണ്. അതിനാൽ ഭാവികാലമാക്കി മിനുക്കാതെ, വാഗ്ദാനം ദൈവവചനത്തിൽ ഇതിനകം സ്ഥാപിതമായ യാഥാർഥ്യമായി പ്രഖ്യാപിക്കുന്ന പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നാമമാറ്റസൂത്രത്തിന്റെ ഔപചാരികതയും ഹീബ്രു സമ്പൂർണക്രിയയുടെ പ്രഖ്യാപനബലവും സംരക്ഷിച്ചിരിക്കുന്നു.
