  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: ml
  text: അബ്രാഹാമിന് തൊണ്ണൂറ്റൊൻപതു വയസ്സായിരുന്നു; അവന്റെ അഗ്രചർമ്മത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്യപ്പെട്ടപ്പോൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: അബ്രാഹാം
  rationale: വാക്യാരംഭത്തിലെ ו കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ/കൂടാതെ’ ചേർക്കാതെ തുടർച്ച നിലനിർത്താം.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: അദ്ദേഹത്തിന് തൊണ്ണൂറ്റൊൻപതു വയസ്സായിരുന്നു
  rationale: ‘തൊണ്ണൂറ്റൊൻപതു വർഷങ്ങളുടെ മകൻ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള പ്രായപ്രസ്താവന.
- source_word: בְּהִמֹּלוֹ
  choice: പരിച്ഛേദന ചെയ്തപ്പോൾ
  rationale: בְ + ക്രിയാനാമവും സർവനാമപ്രത്യയവും ചേർന്നത് കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: അഗ്രചർമത്തിലെ മാംസം
  rationale: ‘അവന്റെ അഗ്രചർമത്തിന്റെ മാംസം’ എന്ന മൂലഭാഷയിലെ ദേഹസംബന്ധമായ വ്യക്തമായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരിച്ഛേദനസൂത്രത്തിലെ വ്യക്തമായ ദേഹസൂചന ചുരുക്കിക്കളയാതെ സംരക്ഷിച്ചു.
