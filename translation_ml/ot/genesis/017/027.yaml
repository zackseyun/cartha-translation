base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: ml
  text: അവന്റെ വീട്ടിലുള്ള പുരുഷന്മാരെല്ലാവരും—വീട്ടിൽ ജനിച്ചവരും ഒരു വിദേശിയിൽനിന്ന് പണം കൊടുത്തു വാങ്ങിയവരും—അവനോടൊപ്പം പരിച്ഛേദനം ചെയ്യപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിദേശി” എന്നതിന് എബ്രായമൂലത്തിൽ അക്ഷരാർഥമായി “അന്യത്വത്തിന്റെ മകൻ” എന്നാണ്; ഇത് ഒരു വിദേശിയെയോ പുറത്തുനിന്നുള്ളവനെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: അവന്റെ വീട്ടിലുള്ള പുരുഷന്മാരെല്ലാവരും
  rationale: וְ കഥാവിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; כָל സമഗ്രതയും אַנְשֵׁי בֵיתוֹ അബ്രാഹാമിന്റെ വീട്ടുസമൂഹത്തിലെ പുരുഷന്മാരെയും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സാഹചര്യത്തിന് കൃത്യവുമായ പ്രയോഗം.
- source_word: יְלִיד בָּיִת
  choice: വീട്ടിൽ ജനിച്ചവർ
  rationale: വീട്ടുസമൂഹത്തിനുള്ളിൽ ജനിച്ചവരെന്ന സാമൂഹിക അർഥം ലളിതവും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: וּמִקְנַת כֶּסֶף
  choice: പണം കൊടുത്തു വാങ്ങിയവർ
  rationale: വില നൽകി സ്വന്തമാക്കിയ വ്യക്തികളെയാണ് ഈ ഘടന സൂചിപ്പിക്കുന്നത്; ഇടപാടിന്റെ അർഥം മറയ്ക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: ഒരു വിദേശിയിൽനിന്ന്
  rationale: בֶּן נֵכָר അക്ഷരാർഥത്തിൽ ‘വിദേശിയുടെ മകൻ’ എന്നായാലും ഇവിടെ ‘വിദേശി/അന്യൻ’ എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
- source_word: נִמֹּלוּ
  choice: പരിച്ഛേദനം ചെയ്യപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം നിലനിർത്തുന്നു; അവർ സ്വയം ചെയ്തുവെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: അബ്രാഹാമിനോടുള്ള സഹവർത്തിത്വവും ഒരേ സന്ദർഭത്തിലുള്ള പ്രവൃത്തിയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
