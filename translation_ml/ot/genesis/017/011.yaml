  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: ml
  text: നിങ്ങളുടെ അഗ്രചർമ്മത്തിന്റെ മാംസം നിങ്ങൾ പരിച്ഛേദന ചെയ്യണം; അത് എനിക്കും നിങ്ങൾക്കും ഇടയിലുള്ള ഉടമ്പടിയുടെ അടയാളമായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടയാളം’ എന്നതിന് ‘ചിഹ്നം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: നിങ്ങൾ പരിച്ഛേദന ചെയ്യണം
  rationale: സംയോജകാവ്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ ഇവിടെ ഉടമ്പടിസംബന്ധമായ നിർദേശത്തിന്റെ ബലം വഹിക്കുന്നു. കർത്തൃപ്രയോഗം അബ്രാഹാമിന്റെ കുടുംബം നിർവഹിക്കേണ്ട പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּשַׂר
  choice: മാംസം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മാംസം’ നിലനിർത്തുന്നു; ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന പരിച്ഛേദനസൂത്രവാക്യത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: עָרְלַתְכֶם
  choice: നിങ്ങളുടെ അഗ്രചർമത്തിന്റെ
  rationale: ഈ ശരീരശാസ്ത്രപരമായ സന്ദർഭത്തിൽ പദം അഗ്രചർമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയം ‘നിങ്ങളുടെ’ എന്നു നിലനിർത്തി.
- source_word: וְהָיָה
  choice: അത് … ആയിരിക്കും
  rationale: ഇപ്പോൾ കല്പിച്ച പരിച്ഛേദനയെ തിരികെ സൂചിപ്പിക്കുന്ന ഭാവി/ബന്ധക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְאוֹת
  choice: അടയാളമായി
  rationale: אוֹת എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ ‘അടയാളം’ ഉടമ്പടിസന്ദർഭത്തിലെ പ്രാധാന്യം നിലനിർത്തുന്നു; ‘ചിഹ്നം’ എന്ന വിവർത്തനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּרִית
  choice: ഉടമ്പടിയുടെ
  rationale: സന്ദർഭത്തിൽ ദൈവം അബ്രാഹാമുമായി സ്ഥാപിക്കുന്ന നിർദിഷ്ട ഉടമ്പടിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: എനിക്കും നിങ്ങൾക്കും മധ്യേയുള്ള
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തെ നിലനിർത്തി ബന്ധത്തിലെ ഇരുകക്ഷികളെയും നേരിട്ട് രേഖപ്പെടുത്തുന്നു; സന്തതികളെക്കുറിച്ചുള്ള ചുറ്റുപാടിലെ ആശയം ഈ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പരിച്ഛേദനയുടെ ഉടമ്പടിസംബന്ധമായ സ്വഭാവം
  choice: ഉടമ്പടിയുടെ അടയാളം
  alternative: ഉടമ്പടിയുടെ ചിഹ്നം
  rationale: אוֹת בְּרִית പരിച്ഛേദനയെ ഉടമ്പടിയുടെ അടയാളമായി തിരിച്ചറിയുന്നു. വാക്യം പറയുന്നതിലപ്പുറം കൂദാശാപരമോ കേവലം പ്രതീകാത്മകമോ ആയ വ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അഗ്രചർമം,’ ‘പരിച്ഛേദന,’ ‘ഉടമ്പടി’ എന്നീ കൃത്യമായ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
