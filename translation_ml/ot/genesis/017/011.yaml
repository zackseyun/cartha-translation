  to: നിങ്ങളുടെ അഗ്രചർമ്മത്തിന്റെ മാംസം നിങ്ങൾ പരിച്ഛേദന ചെയ്യണം; അത് എനിക്കും നിങ്ങൾക്കും ഇടയിലുള്ള ഉടമ്പടിയുടെ അടയാളമായിരിക്കും[a].
