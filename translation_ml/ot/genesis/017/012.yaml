  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: ml
  text: എട്ടു ദിവസം പ്രായമാകുമ്പോൾ[a], നിങ്ങളുടെ തലമുറകളിലുടനീളം നിങ്ങളിലുള്ള എല്ലാ ആണും പരിച്ഛേദനം ചെയ്യപ്പെടണം—വീട്ടിൽ ജനിച്ചവനായാലും നിന്റെ സന്തതിയിൽപ്പെട്ടവനല്ലാത്ത ഏതെങ്കിലും വിദേശിയിൽനിന്ന് വെള്ളി കൊടുത്തു വാങ്ങിയവനായാലും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എട്ടു ദിവസത്തിന്റെ മകൻ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘പണം കൊടുത്തു വാങ്ങിയവൻ.’'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘നിന്റെ വിത്തിൽനിന്നുള്ളവനല്ലാത്ത ഏതൊരു വിദേശിയുടെ മകനിൽനിന്നും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: എട്ടു ദിവസം പ്രായമായപ്പോൾ
  rationale: ‘എട്ടു ദിവസത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രയോഗം എട്ടു ദിവസം പ്രായമായ ശിശുവിനെ സൂചിപ്പിക്കുന്നു. സമയനിബന്ധന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִמּוֹל
  choice: പരിച്ഛേദനം നടത്തണം
  rationale: നിഫാൽ രൂപം ഇവിടെ നിർദേശാത്മകമായ നിഷ്ക്രിയ അർഥം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും നിയമനിർദേശത്തിന്റെ ഭാവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: לָכֶם כָּל זָכָר
  choice: നിങ്ങളിലുള്ള എല്ലാ ആണിനും
  rationale: כָּל זָכָר എന്നത് പ്രായഭേദമില്ലാതെ ‘എല്ലാ ആണും’ എന്നാണ്; לָכֶם അഭിസംബോധന ചെയ്യപ്പെടുന്ന സമൂഹത്തിനുള്ളിലുള്ളവരെ സൂചിപ്പിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലെല്ലാം കല്പന ബാധകമാണെന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְלִיד בָּיִת
  choice: വീട്ടിൽ ജനിച്ചവൻ
  rationale: കുടുംബഗൃഹത്തിനുള്ളിൽ ജനിച്ച വ്യക്തിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഉറവിടത്തിന്റെ ദൃശ്യഭാഷ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: וּמִקְנַת כֶּסֶף
  choice: വെള്ളി കൊടുത്തു വാങ്ങിയവൻ
  rationale: כֶּסֶף എന്നതിന്റെ മൂർത്തമായ ‘വെള്ളി’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് വാങ്ങലിലൂടെ സമ്പാദിച്ച വ്യക്തിയെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: ഏതെങ്കിലും വിദേശിയിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിലെ ‘വിദേശിയുടെ മകൻ’ എന്നത് വിദേശിയായ ഒരാളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: നിന്റെ സന്തതിയിൽപ്പെടാത്ത
  rationale: זֶרַע എന്ന ‘വിത്ത്’ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഏകവചന അഭിസംബോധനയായ ‘നിന്റെ’ നിലനിർത്തി അബ്രാഹാമിന്റെ ജൈവസന്തതിക്കു പുറത്തുള്ളവനെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ ഉടമ്പടിഗൃഹത്തിൽ പരിച്ഛേദനകല്പനയുടെ വ്യാപ്തി
  choice: ജൈവസന്തതിക്കു പുറമേ വീട്ടിൽ ജനിച്ചവരും വിദേശിയിൽനിന്ന് വിലയ്ക്കു വാങ്ങിയവരുമായ എല്ലാ ആണുങ്ങളെയും വാക്യം ഉൾക്കൊള്ളുന്നു.
  alternative: കല്പനയെ പ്രധാനമായും അബ്രാഹാമിന്റെ ജൈവസന്തതിയിലേക്ക് പരിമിതപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം വീട്ടിൽ ജനിച്ചവരെയും വാങ്ങപ്പെട്ടവരെയും വ്യക്തമായി ഉൾപ്പെടുത്തുകയും അവർ അബ്രാഹാമിന്റെ സന്തതിയിൽപ്പെടാത്തവരാണെന്ന് പറയുകയും ചെയ്യുന്നു. പിന്നീടുള്ള ദൈവശാസ്ത്രനിഗമനങ്ങൾ ചേർക്കാതെ ഈ വ്യാപ്തി പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമനിർദേശശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ബഹുവചനമായ ‘നിങ്ങളുടെ/നിങ്ങളിലുള്ള’ എന്നതും അബ്രാഹാമിനോടുള്ള ഏകവചനമായ ‘നിന്റെ’ എന്നതും വേർതിരിച്ചു നിലനിർത്തി. ‘ആൺകുട്ടി’ എന്ന പ്രായപരിമിത പദത്തിനു പകരം ഉറവിടത്തിലെ വ്യാപകമായ זָכָר അനുസരിച്ച് ‘ആൺ’ ഉപയോഗിച്ചു.
