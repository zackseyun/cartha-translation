id: GEN.17.13
reference: Genesis 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: ml
  text: നിന്റെ വീട്ടിൽ ജനിച്ചയാളും നിന്റെ പണംകൊണ്ട് വാങ്ങപ്പെട്ടയാളും[b][c] പരിച്ഛേദന ഏൽക്കുകതന്നെ വേണം[a]. എന്റെ ഉടമ്പടി നിങ്ങളുടെ ശരീരത്തിൽ ഒരു നിത്യ ഉടമ്പടിയായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘തീർച്ചയായും പരിച്ഛേദന ഏൽക്കണം.’ ഊന്നലിനായി എബ്രായത്തിൽ infinitive absolute-നോടൊപ്പം finite verb ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘വീട്ടിൽ ജനിച്ചയാൾ’, ‘പണംകൊണ്ട് വാങ്ങപ്പെട്ടയാൾ’ എന്നീ എബ്രായപ്രയോഗങ്ങൾ അബ്രാഹാമിന്റെ വീട്ടിൽ ജനിച്ചവരും വിലകൊടുത്ത് സമ്പാദിക്കപ്പെട്ടവരും ഉൾപ്പെടുന്ന വീട്ടംഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'മറ്റൊരു രൂപം: ‘നിന്റെ വീട്ടിൽ ജനിച്ചവനും നിന്റെ പണംകൊണ്ട് വാങ്ങപ്പെട്ടവനും.’'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: പരിച്ഛേദന ഏൽക്കുകതന്നെ വേണം
  rationale: മൂലപാഠത്തിലെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു. സന്ദർഭത്തിലെ നിർബന്ധവും ആ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം പ്രകടമാക്കുന്നു.
- source_word: יְלִיד בֵּיתְךָ
  choice: നിന്റെ വീട്ടിൽ ജനിച്ചയാൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ വീട്ടിൽ ജനിച്ചവൻ/വീട്ടിൽ ജനിച്ചയാൾ.’ വീട്ടംഗത്വം വ്യക്തമാക്കുമ്പോഴും ഈ പദപ്രയോഗത്തിൽ മാത്രം തുറന്നുപറയാത്ത അടിമസ്ഥാനം വിവർത്തനത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: നിന്റെ പണംകൊണ്ട് വാങ്ങപ്പെട്ടയാൾ
  rationale: വിലകൊടുത്ത് സമ്പാദിച്ച വ്യക്തിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വെള്ളി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘പണം’ ആധുനിക മലയാളത്തിൽ സാമ്പത്തിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന പദത്തിന്റെ കേന്ദ്രമായ ഉടമ്പടി-അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בִּבְשַׂרְכֶם
  choice: നിങ്ങളുടെ ശരീരത്തിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ ‘ഇൽ’ എന്ന അർഥവും പരിച്ഛേദനയുടെ ശാരീരിക അടയാളവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു; ‘നിങ്ങളുടെ’ എന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: לִבְרִית עוֹלָם
  choice: ഒരു നിത്യ ഉടമ്പടിയായി
  rationale: לִ ഇവിടെ ഫലം അഥവാ നില സൂചിപ്പിക്കുന്നു. עוֹלָם എന്നതിന്റെ ദീർഘകാല/നിത്യ സ്വഭാവം ‘നിത്യ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ശാരീരിക അടയാളവും ഉടമ്പടിയും തമ്മിലുള്ള ബന്ധം
  choice: പരിച്ഛേദനയിലൂടെ ഉടമ്പടി ശരീരത്തിൽ ഉണ്ടായിരിക്കുമെന്ന് വാക്യം നേരിട്ട് പറയുന്ന വിധം നിലനിർത്തി.
  alternative: ശാരീരിക അടയാളം ഉടമ്പടി അംഗത്വത്തെ വെറും പ്രതീകമായി സൂചിപ്പിക്കുന്നു എന്നോ, അടയാളവും ഉടമ്പടിയും കൂടുതൽ ശക്തമായി ഒന്നാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ‘എന്റെ ഉടമ്പടി നിങ്ങളുടെ ശരീരത്തിൽ ... ആയിരിക്കും’ എന്ന എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള ഭാഷയും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്ര വ്യവസ്ഥകളിലൂടെ അതിനെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ‘ഉടമ്പടി’, ‘പരിച്ഛേദന’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അടിമസ്ഥാനം മുഖ്യപാഠത്തിൽ മൂലത്തേക്കാൾ അധികമായി വ്യക്തമാക്കിയിട്ടില്ല.
