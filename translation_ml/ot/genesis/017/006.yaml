  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: ml
  text: ഞാൻ നിന്നെ അത്യന്തം സന്താനസമൃദ്ധനാക്കും[a]; നിന്നിൽനിന്ന് ജനതകളെ ഉത്ഭവിപ്പിക്കും; രാജാക്കന്മാരും നിന്നിൽനിന്ന് പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “വളരെ, വളരെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: ഞാൻ നിന്നെ ... സന്താനസമൃദ്ധനാക്കും
  rationale: פרה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ഫലവത്താക്കുക/വർധിപ്പിക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു. മനുഷ്യസന്തതിയെക്കുറിച്ചുള്ള ഉടമ്പടി-സന്ദർഭത്തിൽ ‘സന്താനസമൃദ്ധനാക്കും’ എന്നത് ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּמְאֹד מְאֹד
  choice: അത്യന്തം
  rationale: מְאֹד എന്ന പദത്തിന്റെ ആവർത്തനം വാഗ്ദാനത്തിന് ശക്തമായ തീവ്രത നൽകുന്നു. ‘അത്യന്തം’ അത് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകരുന്നു; കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: നിന്നിൽനിന്ന് ജനതകളെ ഉളവാക്കും
  rationale: 'נתן + ל എന്ന ഘടന ഇവിടെ ഫലപരമായ അർഥത്തിലാണ്: അബ്രാഹാമിൽനിന്ന് അനേകം ജനതകൾ ഉണ്ടാകും. മലയാളത്തിൽ ‘നിന്നിൽനിന്ന് ജനതകളെ ഉളവാക്കും’ എന്നത് ഈ വംശപരമായ ഫലം വ്യക്തമായി അറിയിക്കുന്നു.'
- source_word: לְגוֹיִם
  choice: ജനതകൾ
  rationale: גּוֹיִם ദേശീയമോ ജനവിഭാഗപരമോ ആയ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘വിജാതീയർ’ എന്ന പിന്നീടുള്ള മതപരമായ അർഥം ചുമത്താതെ ‘ജനതകൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וּמְלָכִים
  choice: രാജാക്കന്മാരും
  rationale: מְלָכִים എന്നത് കൃത്യമായി ‘രാജാക്കന്മാർ’ എന്നാണ്; ‘ഭരണാധികാരികൾ’ എന്നത് അനാവശ്യമായി വിശാലമാണ്.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: നിന്നിൽനിന്ന് പുറപ്പെടും
  rationale: יצא എന്ന ക്രിയയുടെ അടിസ്ഥാന ദിശാത്മക അർഥമായ ‘പുറപ്പെടുക’ നിലനിർത്തുന്നു; ഈ വംശാവലി-സന്ദർഭത്തിൽ അതിന്റെ അർഥം ‘നിന്റെ സന്തതിയായി വരും’ എന്നാണ്.
theological_decisions:
- issue: അബ്രാഹാമിനു വാഗ്ദാനം ചെയ്യപ്പെട്ട സന്തതിയുടെ വ്യാപ്തി
  choice: അബ്രാഹാം അനേകം ജനതകളുടെയും രാജാക്കന്മാരുടെയും പൂർവികനാകുമെന്ന് വാക്യം വാഗ്ദാനം ചെയ്യുന്നു.
  alternative: അബ്രാഹാമിന് ജനതകളുടെ ഇടയിൽ ഒരു പ്രത്യേക പദവി നൽകുമെന്ന കൂടുതൽ അമൂർത്തമായ അർഥത്തിൽ വാക്യം വായിക്കാം.
  rationale: അടുത്തുള്ള ഉടമ്പടി-സന്ദർഭം സന്തതിക്കും വംശപരമ്പരയ്ക്കും ഊന്നൽ നൽകുന്നു. ‘നിന്നിൽനിന്ന്’ എന്ന ആവർത്തിത ആശയവും രാജാക്കന്മാർ പുറപ്പെടുമെന്ന പ്രസ്താവനയും വംശപരമായ വായനയെ പിന്തുണയ്ക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനവും ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്താനസമൃദ്ധൻ’ മനുഷ്യവംശത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കുന്നു. അവസാന ഘടകത്തിലെ ‘പുറപ്പെടും’ എബ്രായത്തിലെ יצא എന്ന ക്രിയയുടെ സജീവ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു.
