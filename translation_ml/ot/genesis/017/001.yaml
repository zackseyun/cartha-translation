id: GEN.17.1
reference: Genesis 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: ml
  text: 'അബ്രാമിന് തൊണ്ണൂറ്റൊൻപതു വയസ്സായപ്പോൾ യഹ്‌വെ അവന് പ്രത്യക്ഷനായി അവനോടു പറഞ്ഞു: “ഞാൻ സർവശക്തനായ ദൈവം[a] ആകുന്നു. എന്റെ സന്നിധിയിൽ നടക്കുക; കുറ്റമറ്റവനായിരിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ഏൽ ശദ്ദായി. ‘ശദ്ദായി’ എന്നതിന്റെ കൃത്യമായ അർഥനിറം തർക്കവിഷയമാണ്; അതുകൊണ്ട് ചില വിവർത്തനങ്ങൾ ഈ പേര് ലിപ്യന്തരണം ചെയ്യുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: അബ്രാമിന് തൊണ്ണൂറ്റൊൻപതു വയസ്സായപ്പോൾ
  rationale: ഹീബ്രായ പ്രായപ്രയോഗവും കാലസൂചന നൽകുന്ന ആഖ്യാനഘടനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: യഹ്‌വെ കർത്താവും അബ്രാം ദർശനം ലഭിക്കുന്ന വ്യക്തിയുമായ ഈ നിഫാൽ ആഖ്യാനസന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായി’ എന്നത് സ്വാഭാവികമായ അർഥമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵל שַׁדַּי
  choice: സർവശക്തനായ ദൈവം
  rationale: ദൈവിക സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗതവും വായനക്കാർക്ക് വ്യക്തവുമായ അർഥവിവർത്തനം; ശദ്ദായി എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം തർക്കവിഷയമായതിനാൽ മൂലരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ നടക്കുക
  rationale: ജീവിതചര്യയെ സൂചിപ്പിക്കുന്ന ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുകയും לְפָנַי എന്നതിന്റെ സന്നിധി/മുഖസാന്നിധ്യ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וֶהְיֵה תָמִים
  choice: കുറ്റമറ്റവനായിരിക്കുക
  rationale: תָמִים സൂചിപ്പിക്കുന്ന സമഗ്രതയും നിർദോഷമായ ജീവിതനിലയും ധാർമ്മിക ശക്തിയോടെ നൽകുന്നു; പാപരഹിതമായ പരിപൂർണത എന്ന അതിരുകടന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אֵל שַׁדַּי എന്ന ദൈവിക സ്ഥാനപ്പേരിന്റെ അവതരണം
  choice: സർവശക്തനായ ദൈവം
  alternative: ഏൽ ശദ്ദായി; ശദ്ദായി ദൈവം
  rationale: പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു; എന്നാൽ שַׁדַּיയുടെ വ്യുത്പത്തിയും കൃത്യമായ അർഥനിറവും അനിശ്ചിതമായതിനാൽ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: תָמִים എന്ന പദത്തിന്റെ ധാർമ്മിക വ്യാപ്തി
  choice: കുറ്റമറ്റവനായിരിക്കുക
  alternative: നിഷ്കളങ്കനായിരിക്കുക; സമ്പൂർണനായിരിക്കുക; പൂർണഹൃദയനായിരിക്കുക
  rationale: ഉടമ്പടിസന്ദർഭത്തിലെ സമഗ്രതയും കുറ്റമറ്റ ജീവിതവും സൂചിപ്പിക്കുന്നു; സമ്പൂർണ പാപരാഹിത്യം എന്ന് പാഠം ആവശ്യപ്പെടുന്നതായി മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘നടക്കുക’ എന്ന ബൈബിൾപരമായ ജീവിതരൂപകം നിലനിർത്തി; ദുർഗ്രാഹ്യമായ പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
