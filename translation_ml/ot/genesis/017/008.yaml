  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: ml
  text: നീ പരദേശിയായി വസിക്കുന്ന ദേശം—കനാൻ ദേശം മുഴുവനും—ഞാൻ നിനക്കും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും എന്നേക്കുമുള്ള സ്വത്തായി[a] നൽകും; ഞാൻ അവർക്ക് ദൈവമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നേക്കുമുള്ള ഒരു കൈവശസ്വത്തായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ഞാൻ ... നൽകും
  rationale: ഉടമ്പടി വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ, വാവോടുകൂടിയ ഖാൽ പൂർണ്ണക്രിയയ്ക്ക് ഭാവിയിലെ വാഗ്ദാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְךָ
  choice: നിനക്കും
  rationale: അബ്രാഹാമിനെ വ്യക്തിപരമായി സ്വീകർത്താവായി സൂചിപ്പിക്കുന്ന ദത്തിവ് അർഥം നിലനിർത്തുന്നു.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും
  rationale: זֶרַע എന്ന സമൂഹവാചക നാമത്തിന്റെ ഏകവചനരൂപവും തലമുറത്തുടർച്ചയും ‘സന്തതി’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: നീ പരദേശിയായി പാർക്കുന്ന ദേശം
  rationale: מְגוּרִים സൂചിപ്പിക്കുന്ന സ്ഥിരാവകാശമില്ലാത്ത പരദേശവാസത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു; അസ്വാഭാവികമായ ശാബ്ദിക ബഹുവചനം ഒഴിവാക്കുന്നു.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം മുഴുവനും
  rationale: മുൻപത്തെ ദേശത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണവും כָּל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള അവകാശമായി
  rationale: അവകാശമായി കൈവശം വയ്ക്കുന്ന ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്ന אֲחֻזָּהയും ദീർഘസ്ഥായിയായ ഉടമ്പടിബലമുള്ള עוֹלָםയും ഗൗരവത്തോടെ പകർന്നു നൽകുന്നു.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: ഞാൻ അവർക്ക് ദൈവമായിരിക്കും
  rationale: ദൈവത്തിൽ ഒരു സത്താപരമായ മാറ്റം സൂചിപ്പിക്കാതെ, എബ്രായ ഉടമ്പടിസൂത്രത്തിന്റെ ബന്ധപരമായ അർഥവും വാക്യഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ ഉടമ്പടിസൂത്രം പരിഭാഷപ്പെടുത്തൽ
  choice: ഞാൻ അവർക്ക് ദൈവമായിരിക്കും
  alternative: ഞാൻ അവരുടെ ദൈവമായിരിക്കും
  rationale: ഇരുവിധവും സാധുവാണെങ്കിലും, ‘അവർക്ക് ദൈവമായിരിക്കും’ എന്നത് לָהֶם לֵאלֹהִים എന്ന എബ്രായ ഘടനയോട് അടുത്തുനിൽക്കുകയും ഉടമ്പടിബന്ധം തുറന്ന നിലയിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ‘പരദേശിയായി പാർക്കുന്ന’ എന്ന പ്രയോഗം മൂലത്തിലെ താമസക്കാരനായ അന്യന്റെ നില വ്യക്തമാക്കുന്നു; ‘സന്തതി’ സമൂഹവാചകത്തിന്റെ ആശയസാന്ദ്രത നിലനിർത്തുന്നു.
