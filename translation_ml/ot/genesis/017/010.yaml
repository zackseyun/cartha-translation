source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: ml
  text: 'നിങ്ങൾ പാലിക്കേണ്ട, എനിക്കും നിങ്ങൾക്കും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും[a] ഇടയിലുള്ള എന്റെ ഉടമ്പടി ഇതാണ്: നിങ്ങളിലുള്ള ഓരോ ആണും പരിച്ഛേദനം ഏൽക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിനക്കുശേഷമുള്ള നിന്റെ പിൻതലമുറകൾക്കും.’ എബ്രായത്തിലെ זֶרַע എന്നത് ‘സന്തതി’യെയോ ‘പിൻതലമുറകളെ’യോ സൂചിപ്പിക്കാവുന്ന സമൂഹവാചകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ദൈവം സ്ഥാപിക്കുന്ന ബന്ധനിബന്ധനയെ സൂചിപ്പിക്കുന്ന ബൈബിളിലെ സ്ഥിരമായ പദമാണ് בְּרִית; ആ അർഥവും ഉല്പത്തി പുസ്തകത്തിലെ പദതുടർച്ചയും ‘ഉടമ്പടി’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: നിങ്ങൾ പാലിക്കേണ്ട
  rationale: ഇവിടത്തെ അപൂർണക്രിയ ഉടമ്പടിയോടനുബന്ധിച്ച ബാധ്യത പ്രകടമാക്കുന്നു; ‘പാലിക്കേണ്ട’ ആ നിർബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: എനിക്കും നിങ്ങൾക്കും നിനക്കുശേഷമുള്ള നിന്റെ സന്തതിക്കും ഇടയിലുള്ള
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് അബ്രാഹാമിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനമായ ‘നിന്റെ’ എന്നതിലേക്കുള്ള മാറ്റം നിലനിർത്തി. זֶרַע ഒരു സമൂഹവാചകമായതിനാൽ ‘സന്തതി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: הִמּוֹל לָכֶם
  choice: നിങ്ങളിലുള്ള … പരിച്ഛേദനം ഏൽക്കണം
  rationale: ആവശ്യം ബാധകമായ സമൂഹത്തെ לָכֶם സൂചിപ്പിക്കുന്നു. ‘പരിച്ഛേദനം ഏൽക്കണം’ എന്ന പ്രയോഗം എബ്രായത്തിലെ നിർദേശാത്മകവും കർമണിസദൃശവുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל זָכָר
  choice: ഓരോ ആണും
  rationale: ഈ നിബന്ധന പുരുഷലിംഗത്തിൽപ്പെട്ട എല്ലാവർക്കും—പ്രായഭേദമില്ലാതെ—ബാധകമാണെന്ന് എബ്രായം വ്യക്തമാക്കുന്നു. ‘പുരുഷൻ’ എന്ന് പറഞ്ഞാൽ പ്രായപൂർത്തിയായവൻ എന്ന ധ്വനി വരാവുന്നതിനാൽ ‘ഓരോ ആണും’ തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ഉടമ്പടിയുടെ അടയാളമായ പരിച്ഛേദനയുടെ ലിംഗനിർദ്ദിഷ്ട പരിധി
  choice: നിങ്ങളിലുള്ള ഓരോ ആണും പരിച്ഛേദനം ഏൽക്കണം
  alternative: നിങ്ങളെല്ലാവരും പരിച്ഛേദനം ഏൽക്കണം
  rationale: כָּל זָכָר വ്യക്തമായി എല്ലാ ആണുകളെയും നിർദ്ദേശിക്കുന്നു. അതിനാൽ വാക്യത്തിന്റെ പരിധി എല്ലാവരിലേക്കും പൊതുവാക്കാതെ മൂലപാഠത്തിലെ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തി.
- issue: അഭിസംബോധനയിലെ ബഹുവചന–ഏകവചന മാറ്റം
  choice: നിങ്ങൾക്കും … നിന്റെ സന്തതിക്കും
  alternative: നിങ്ങൾക്കും … നിങ്ങളുടെ സന്തതിക്കും
  rationale: മൂലപാഠത്തിലെ בֵינֵיכֶם എന്ന ബഹുവചനത്തിൽനിന്ന് זַרְעֲךָ എന്ന ഏകവചനത്തിലേക്കുള്ള ഉദ്ദേശ്യപൂർവമായ മാറ്റം മലയാളത്തിലും സൂക്ഷിച്ചു; അത് അബ്രാഹാമിനെയും സന്നിഹിത സമൂഹത്തെയും തമ്മിലുള്ള ബന്ധത്തിലെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഉടമ്പടിയുടെ ഔപചാരിക സ്വരം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ സർവനാമ-എണ്ണമാറ്റവും കൂട്ടവാചകമായ ‘സന്തതി’യുടെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
