    rationale: എബ്രായ വാക്യത്തിലെ הַלְּבֶן എന്നതിൽ בן (‘മകൻ’) വ്യക്തമായി ഉണ്ട്. ‘കുഞ്ഞ്’ എന്ന മലയാള പൊതുപദം വിവർത്തനതിരഞ്ഞെടുപ്പായി സ്വീകാര്യമായിരിക്കാമെങ്കിലും, മൂലത്തിൽ അത് വ്യക്തമാക്കിയിട്ടില്ലെന്ന കുറിപ്പ് തെറ്റാണ്. അടിക്കുറിപ്പ് ‘മകൻ’ എന്ന പര്യായം അറിയിക്കണം.
