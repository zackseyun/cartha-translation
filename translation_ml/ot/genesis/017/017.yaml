  to: 'അപ്പോൾ അബ്രാഹാം കമിഴ്ന്നുവീണു ചിരിച്ചു; തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു: “നൂറു വയസ്സുള്ള ഒരാൾക്കു ഒരു കുഞ്ഞ് ജനിക്കുമോ?[a] തൊണ്ണൂറു വയസ്സുള്ള സാറാ പ്രസവിക്കുമോ?”'
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥം മാറ്റാതെ, എബ്രായത്തിലെ ഉടമസൂചന ‘തന്റെ’ ചേർത്തു. നിർണായകമായി, തെറ്റായ implicit-subject അടിക്കുറിപ്പ് നീക്കി, בן എന്ന പദത്തിന്റെ ‘മകൻ’ എന്ന ശാബ്ദിക പര്യായം രേഖപ്പെടുത്തുന്ന ശരിയായ lexical-alternative അടിക്കുറിപ്പ് നൽകി. ചിരിയുടെ ഭാവത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കൽ ഒന്നും വരുത്തിയിട്ടില്ല.
