source:
  edition: WLC
  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാഹാം കമിഴ്ന്നുവീണു ചിരിച്ചു; തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു: “നൂറു വയസ്സുള്ള ഒരാൾക്കു ഒരു കുഞ്ഞ് ജനിക്കുമോ?[a] തൊണ്ണൂറു വയസ്സുള്ള സാറാ പ്രസവിക്കുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നൂറു വയസ്സുള്ള ഒരാൾക്കു ഒരു മകൻ ജനിക്കുമോ?” എബ്രായത്തിൽ ഇവിടെ ‘മകൻ’ എന്ന പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: അബ്രാഹാം കമിഴ്ന്നുവീണു
  rationale: ‘മുഖത്തിന്മേൽ വീണു’ എന്ന എബ്രായ പ്രയോഗം കമിഴ്ന്നുവീഴുന്ന ശരീരനിലയെ സൂചിപ്പിക്കുന്നു. ‘കമിഴ്ന്നുവീണു’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּצְחָק
  choice: ചിരിച്ചു
  rationale: צחק എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘ചിരിക്കുക’ എന്നാണ്. ചിരിയുടെ ഉദ്ദേശ്യമോ ധാർമിക ഗുണമോ വിവർത്തനത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: അവൻ ഹൃദയത്തിൽ പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു’ എന്ന അന്തർഭാഷണപ്രയോഗം നിലനിർത്തുന്നു; വാക്കുകൾ ശബ്ദമായി പറഞ്ഞതല്ലെന്ന സൂചനയും ഇതിലുണ്ട്.
- source_word: הַלְּבֶן מֵאָה שָׁנָה יִוָּלֵד
  choice: നൂറു വയസ്സുള്ള ഒരാൾക്കു ഒരു കുഞ്ഞ് ജനിക്കുമോ?
  rationale: בן מאה שנה എന്നത് പ്രായം സൂചിപ്പിക്കുന്ന ‘നൂറു വയസ്സുള്ള ഒരാൾ’ എന്ന പ്രയോഗമാണ്; יִוָּלֵד എന്ന ക്രിയയ്ക്ക് മലയാളത്തിൽ സ്വാഭാവികമായി ആവശ്യമായ അപ്രകട കർത്താവിനെ ‘ഒരു കുഞ്ഞ്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: וְאִם שָׂרָה הֲבַת תִּשְׁעִים שָׁנָה תֵּלֵד
  choice: തൊണ്ണൂറു വയസ്സുള്ള സാറാ പ്രസവിക്കുമോ?
  rationale: ‘തൊണ്ണൂറു വർഷങ്ങളുടെ മകൾ’ എന്ന എബ്രായ പ്രായപ്രയോഗം മലയാളത്തിൽ ‘തൊണ്ണൂറു വയസ്സുള്ള’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; ילד എന്ന ക്രിയ സ്ത്രീയെ കർത്താവാക്കുമ്പോൾ ‘പ്രസവിക്കുക’ എന്നാണ്.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ ചിരിയുടെ ഭാവം
  choice: ‘ചിരിച്ചു’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവിശ്വാസത്തോടെ ചിരിച്ചു’ / ‘സന്തോഷത്തോടെ ചിരിച്ചു’
  rationale: ഈ വാക്യം ചിരിയെ അവിശ്വാസമെന്നോ ആനന്ദമെന്നോ വ്യക്തമായി വിലയിരുത്തുന്നില്ല. അതിനാൽ കഥയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കമിഴ്ന്നുവീണു’ ശരീരനില വ്യക്തമാക്കുന്നു; ‘ഹൃദയത്തിൽ പറഞ്ഞു’ മൂലപാഠത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ജനനചോദ്യത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
