id: GEN.17.25
reference: Genesis 17:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִשְׁמָעֵ֣אל בְּנ֔/וֹ בֶּן שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/הִ֨מֹּל֔/וֹ אֵ֖ת בְּשַׂ֥ר עָרְלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: ml
  text: അവന്റെ മകനായ യിശ്മായേലിന് തന്റെ അഗ്രചർമ്മത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്യപ്പെട്ടപ്പോൾ പതിമൂന്നു വയസ്സായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: യിശ്മായേൽ
  rationale: വാക്യാരംഭത്തിലെ ו തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ഈ ഒറ്റവാക്യത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലൂടെ അതിന്റെ ഭാവം വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ എന്നു ചേർത്തില്ല; പേര് ‘യിശ്മായേൽ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּנ֔/וֹ
  choice: അവന്റെ മകനായ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പേരിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: അവന് പതിമൂന്നു വയസ്സായിരുന്നു
  rationale: ഹീബ്രായയിലെ പ്രായപ്രയോഗം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നൽകി.
- source_word: בְּ/הִמֹּל/וֹ
  choice: പരിച്ഛേദന ചെയ്തപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ന്റെ കാലസൂചന ‘ചെയ്തപ്പോൾ’ എന്നു നൽകി; ഹീബ്രായത്തിലെ passive/reflexive ആശയം തുടർന്നുള്ള വ്യക്തമായ ശരീരഭാഗത്തെ കർമമാക്കുന്ന മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: אֵת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന ഈ ഘടകത്തിന് മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനം ആവശ്യമില്ല.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: അഗ്രചർമ്മമാംസം
  rationale: ‘അവന്റെ അഗ്രചർമ്മത്തിന്റെ മാംസം’ എന്ന മൂലത്തിലെ വ്യക്തമായ ദേഹപരമായ പ്രയോഗം ചുരുക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന സംയുക്തപദമായി നിലനിർത്തി.
theological_decisions:
- issue: പരിച്ഛേദനയുടെ കർമമായി വ്യക്തിയെയോ അഗ്രചർമ്മമാംസത്തെയോ അവതരിപ്പിക്കൽ
  choice: അഗ്രചർമ്മമാംസം പരിച്ഛേദന ചെയ്തപ്പോൾ
  alternative: അഗ്രചർമ്മത്തിൽ അവൻ പരിച്ഛേദന ഏറ്റപ്പോൾ
  rationale: ഹീബ്രായത്തിൽ בְּהִמֹּלוֹ യിശ്മായേലിന്റെ പരിച്ഛേദനയെ സൂചിപ്പിക്കുമ്പോഴും אֵת בְּשַׂר עָרְלָתוֹ എന്ന വ്യക്തമായ കർമപ്രയോഗം അഗ്രചർമ്മമാംസത്തെ മുൻനിർത്തുന്നു. മലയാളത്തിൽ മൂലത്തിലെ ഈ വ്യക്തത നിലനിർത്തുന്ന രൂപം തിരഞ്ഞെടുത്തു; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള വിവരണശൈലി. ‘അഗ്രചർമ്മമാംസം’ എന്നത് മൂലത്തിലെ concrete covenantal wording സംരക്ഷിക്കുന്നു; ‘പരിച്ഛേദന’ സാധാരണ ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ പദമാണ്.
