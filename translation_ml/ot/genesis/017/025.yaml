revisions:
- from: അവന്റെ മകനായ യിശ്മായേലിന്റെ അഗ്രചർമ്മമാംസം പരിച്ഛേദന ചെയ്തപ്പോൾ അവന് പതിമൂന്നു വയസ്സായിരുന്നു.
  to: അവന്റെ മകനായ യിശ്മായേലിന് തന്റെ അഗ്രചർമ്മത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്യപ്പെട്ടപ്പോൾ പതിമൂന്നു വയസ്സായിരുന്നു.
  rationale: The revision retains the Hebrew’s age statement, Ishmael’s filial identification, and the explicit bodily object. It replaces the ambiguous active Malayalam phrasing with a passive construction that naturally indicates Ishmael’s circumcision without reducing the concrete expression to merely “he was circumcised.”
  reviewer_model: gpt-5.6-terra
