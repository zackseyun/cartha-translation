id: GEN.17.3
reference: Genesis 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפֹּ֥ל אַבְרָ֖ם עַל פָּנָ֑י/ו וַ/יְדַבֵּ֥ר אִתּ֛/וֹ אֱלֹהִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: ml
  text: 'അപ്പോൾ അബ്രാം കമിഴ്ന്നു വീണു; ദൈവം അവനോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: വീണു
  rationale: נפל എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം പൂർത്തിയായ ഭൂതകാല സംഭവത്തെ വിവരിക്കുന്നു. തുടർന്നുള്ള ‘കമിഴ്ന്നു’ എന്ന പ്രയോഗം സാഷ്ടാംഗമായ വീഴ്ചയുടെ ഭാവം വ്യക്തമാക്കുന്നതിനാൽ അധിക വിശദീകരണം ആവശ്യമില്ല.
- source_word: עַל פָּנָיו
  choice: കമിഴ്ന്നു
  rationale: മുഖം നിലത്തേക്കാക്കി വീഴുന്നതും ആദരവോടെ സാഷ്ടാംഗം ചെയ്യുന്നതും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്. ‘കമിഴ്ന്നുവീണു’ മലയാളത്തിൽ സ്വാഭാവികമായി ദൃശ്യവും ഭാവവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: אַבְרָם
  choice: അബ്രാം
  rationale: ഈ ഘട്ടത്തിൽ പേര് ഇനിയും അബ്രാഹാം എന്നു മാറ്റപ്പെട്ടിട്ടില്ല; അതിനാൽ പേരിന്റെ നിലവിലെ രൂപം നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ പീയേൽ രൂപത്തിന് ഇവിടെ ‘സംസാരിച്ചു’ എന്നതാണ് നേരിട്ടുള്ള അർഥം. לֵאמֹר തുടർന്നുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടു
  rationale: את പ്രാപഞ്ചികപ്രത്യയത്തോടുകൂടി ഇവിടെ ‘അവനോടുകൂടെ/അവനോടു’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘അവനോടു സംസാരിച്ചു’ സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ ഏകവചന ക്രിയാസമ്മതത്തോടുകൂടി ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: אמר എന്ന ക്രിയയുടെ ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്റ്റ് നേരിട്ടുള്ള വാക്കുകൾക്ക് അവതാരികയാണ്. മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ആവർത്തനത്തേക്കാൾ കോളൺ തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആദ്യത്തെ വാവ് കഥയിലെ തുടർച്ചയും സമയക്രമവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ അത് വായനാസൗകര്യത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതവ്യക്തിയും സംഖ്യയും
  choice: ഏകവചനമായ ‘ദൈവം’
  alternative: രൂപഘടന മാത്രം പരിഗണിച്ചുള്ള ‘ദൈവങ്ങൾ’
  rationale: സന്ദർഭവും ഏകവചന ക്രിയാസമ്മതവും അബ്രാമിനോടു സംസാരിക്കുന്ന ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ബഹുവചന വിവർത്തനം വ്യാകരണപരമായും സന്ദർഭപരമായും തെറ്റായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ‘മുഖത്തിന്മേൽ വീണു’ എന്ന ദൃശ്യത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘കമിഴ്ന്നുവീണു’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു. വാക്യത്തിന്റെ അവസാനത്തിലുള്ള കോളൺ അടുത്ത വാക്യത്തിൽ ആരംഭിക്കുന്ന ദൈവവചനത്തെ അവതരിപ്പിക്കുന്നു.
