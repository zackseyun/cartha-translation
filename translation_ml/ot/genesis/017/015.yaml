id: GEN.17.15
reference: Genesis 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം അബ്രാഹാമിനോടു പറഞ്ഞു: “നിന്റെ ഭാര്യ സാറായിയെക്കുറിച്ച്: അവളുടെ പേര് സാറായി എന്നു നീ വിളിക്കരുത്, കാരണം സാറാ എന്നാണ് അവളുടെ പേര്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “നിന്റെ ഭാര്യ സാറായിയെ ഇനി സാറായി എന്നു വിളിക്കരുത്; അവളുടെ പേര് സാറാ എന്നായിരിക്കും.”'
    reason: പേരുമാറ്റത്തിന്റെ ആശയം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമാനുഗതത്വം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ഏകവചനമായി ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പതിവും യോജിച്ചതുമായ പരിഭാഷ.
- source_word: שָׂרַי
  choice: സാറായി
  rationale: പഴയ പേരും പുതിയ പേരും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്താൻ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אִשְׁתְּךָ
  choice: നിന്റെ ഭാര്യ
  rationale: അബ്രാഹാമുമായുള്ള സാറായിയുടെ ബന്ധം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥ നിർമാണം.
- source_word: לֹא תִקְרָא
  choice: നീ ... വിളിക്കരുത്
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കിലെ നിരോധനാത്മക നിർദേശം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶת שְׁמָהּ
  choice: അവളുടെ പേര്
  rationale: പേരിടൽ സൂത്രവാക്യത്തിന്റെ പ്രാധാന്യം കാത്തുസൂക്ഷിക്കാൻ ‘പേര്’ എന്ന പദം വ്യക്തമായി നിലനിർത്തി.
- source_word: כִּי
  choice: ;
  rationale: ഇവിടെ പുതിയ പേര് പ്രഖ്യാപിക്കുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘കാരണം’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായി കാരണാർഥം ശക്തിപ്പെടുത്താം.
- source_word: שָׂרָה שְׁמָהּ
  choice: സാറാ എന്നാണ് അവളുടെ പേര്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യത്തിലെ ‘സാറാ’ എന്ന പേരിനുള്ള ഊന്നൽ നിലനിർത്തുകയും മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഭാവികാല സഹായക്രിയ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പേര് മാറ്റുന്ന സൂത്രവാക്യത്തിന്റെ പരിഭാഷ
  choice: ‘അവളുടെ പേര് സാറായി എന്നു നീ വിളിക്കരുത്; സാറാ എന്നാണ് അവളുടെ പേര്’ എന്ന നേരിട്ടുള്ള പ്രഖ്യാപനം
  alternative: ‘ഇനി അവളെ സാറായി എന്നു വിളിക്കരുത്; അവളുടെ പേര് സാറാ എന്നായിരിക്കും’
  rationale: മൂലപാഠത്തിലെ നിരോധനവും പേരിന്റെ ഔപചാരിക പ്രഖ്യാപനവും നിലനിർത്തുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘ഇനി’യോ വ്യക്തമായ ഭാവികാലമോ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘സാറായിയെ സംബന്ധിച്ചിടത്തോളം’ എന്ന വിഷയാരംഭം എബ്രായത്തിലെ മുൻനിറുത്തിയ നാമഘടകത്തെ പ്രതിഫലിപ്പിക്കുന്നു; പേരിടൽ പ്രഖ്യാപനത്തിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
