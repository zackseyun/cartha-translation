base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “അല്ല; നിന്റെ ഭാര്യയായ സാറാ നിനക്കൊരു മകനെ പ്രസവിക്കും. നീ അവന് യിസ്ഹാക്ക്[a] എന്നു പേരിടണം. ഞാൻ എന്റെ ഉടമ്പടി അവനോടു സ്ഥാപിക്കും; അത് അവന്റെ ശേഷം വരുന്ന സന്തതിക്കായി എന്നേക്കുമുള്ള ഉടമ്പടിയായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യിസ്ഹാക്ക്’ എന്ന പേര് ‘അവൻ ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അവൻ ചിരിക്കും’ എന്നർഥമുള്ള ഹീബ്രായ ക്രിയയോട് ശബ്ദസാമ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: അല്ല;
  rationale: അബ്രാഹാമിന്റെ തൊട്ടുമുമ്പത്തെ അപേക്ഷ തിരുത്തുന്ന ശക്തി സന്ദർഭത്തിൽ ഉള്ളതിനാൽ വെറും ‘എന്നാൽ’ എന്നതിനെക്കാൾ ‘അല്ല’ യോജിക്കുന്നു; തുടർന്നുള്ള വാക്യം ദൈവത്തിന്റെ പകരമായ പ്രഖ്യാപനമാണ്.
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: നിനക്കൊരു മകനെ പ്രസവിക്കും
  rationale: പങ്കാളിത്തരൂപം ഇവിടെ ഭാവിയിലെ വാഗ്ദത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: നീ അവന് ... എന്നു പേരിടണം
  rationale: ഹീബ്രായ നാമകരണസൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: יִצְחָק
  choice: യിസ്ഹാക്ക്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു; ഹീബ്രായത്തിലെ ചിരിയുമായി ബന്ധപ്പെട്ട പദപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַהֲקִמֹתִי אֶת־בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി ... സ്ഥാപിക്കും
  rationale: הקים എന്ന ക്രിയയുടെ ‘നിലനിൽക്കുമാറാക്കുക/സ്ഥാപിക്കുക’ എന്ന ഉടമ്പടിസംബന്ധിയായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടും
  rationale: ഉടമ്പടി യിസ്ഹാക്കുമായി ഉള്ള ബന്ധമാണെന്ന ഹീബ്രായ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: לִבְרִית עוֹלָם
  choice: എന്നേക്കുമുള്ള ഉടമ്പടിയായി
  rationale: ഉടമ്പടിയുടെ ദീർഘകാല, നിലനിൽക്കുന്ന സ്വഭാവം വ്യക്തമാക്കുന്നു; ദാർശനികമായ അധിക അർഥങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: അവന്റെ ശേഷം വരുന്ന സന്തതിയോടും
  rationale: זֶרַע എന്ന കൂട്ടവാചക ഏകവചനത്തിന്റെ വംശപരമായ അർഥം ‘സന്തതി’ സംരക്ഷിക്കുന്നു; ‘അവന്റെ ശേഷം’ കാലപരവും തലമുറാപരവുമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയുടെ വ്യാപ്തിയും തുടർച്ചയും
  choice: ഉടമ്പടി യിസ്ഹാക്കിനോടും അവന്റെ ശേഷം വരുന്ന സന്തതിയോടും സ്ഥാപിക്കപ്പെടുന്നതായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പ്രത്യേകമായി ഒരു ജാതീയ വാഗ്ദത്തമായി ചുരുക്കുക, അല്ലെങ്കിൽ പിൽക്കാല ക്രൈസ്തവ ഉടമ്പടിശാസ്ത്രത്തെ ഇവിടെ നേരിട്ട് നിർവചിക്കുന്നതായി വികസിപ്പിക്കുക.
  rationale: ഹീബ്രായ വാക്യം പറയുന്നതിലപ്പുറം ഉടമ്പടിയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യാതെ അതിലെ അവകാശവാദവും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഉടമ്പടി’, ‘സന്തതി’ എന്നീ പരിചിതമായ ദൈവശാസ്ത്രപദങ്ങൾ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും വാക്യത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനപരമായ പ്രത്യേകതകൾ ചേർത്തിട്ടില്ല.
