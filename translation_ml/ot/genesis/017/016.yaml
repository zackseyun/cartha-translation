id: GEN.17.16
reference: Genesis 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: ml
  text: ഞാൻ അവളെ അനുഗ്രഹിക്കും; മാത്രമല്ല, അവളിൽനിന്ന് നിനക്കൊരു മകനെയും ഞാൻ തരും. ഞാൻ അവളെ അനുഗ്രഹിക്കും; അവൾ ജനതകളായിത്തീരും[a]; ജനവിഭാഗങ്ങളുടെ രാജാക്കന്മാർ അവളിൽനിന്ന് ഉത്ഭവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ ജനതകളുടെ അമ്മയായിത്തീരും.’ എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘അവൾ ജനതകളായിത്തീരും’ എന്നാണ്.
    reason: എബ്രായത്തിലെ സംക്ഷിപ്തവും അസാധാരണവുമായ പ്രയോഗത്തിന്റെ സാധാരണ അർഥം വ്യക്തമാക്കുന്നതിനൊപ്പം അതിന്റെ അക്ഷരാർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: ഞാൻ അവളെ അനുഗ്രഹിക്കും / ഞാൻ അവളെ അനുഗ്രഹിക്കും
  rationale: ברך എന്ന ക്രിയയുടെ ഉടമ്പടിസംബന്ധമായ ദൈവാനുഗ്രഹത്തിന്റെ ഭാരം നിലനിർത്താൻ ‘അനുഗ്രഹിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി. എബ്രായത്തിലെ ആവർത്തനവും ഊന്നലിനായി അതേപടി സൂക്ഷിച്ചു.
- source_word: וְגַם
  choice: മാത്രമല്ല
  rationale: ലളിതമായ ‘കൂടാതെ’ എന്ന ബന്ധത്തെക്കാൾ അധികമായ ഊന്നൽ ഈ പ്രയോഗം നൽകുന്നു; ആ സങ്കലിതവും ഊന്നൽപരവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘മാത്രമല്ല’ പ്രകടമാക്കുന്നു.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: അവളിൽനിന്ന് നിനക്കൊരു മകനെയും ഞാൻ തരും
  rationale: ക്രിയാരൂപം qatal ആണെങ്കിലും വാഗ്ദാനസന്ദർഭത്തിൽ ഭാവികാല അർഥത്തിലാണ്. ‘അവളിൽനിന്ന്’ എന്നത് മകൻ സാറയിൽനിന്ന് ജനിക്കുമെന്ന വംശജനനബന്ധം നിലനിർത്തുന്നു.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: അവൾ ജനതകളായിത്തീരും
  rationale: ‘അവൾ ജനതകൾക്കായി/ജനതകളായിത്തീരും’ എന്ന എബ്രായത്തിലെ ശ്രദ്ധേയമായ സംക്ഷിപ്തരൂപം സംരക്ഷിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘അമ്മ’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല; മലയാളവായനക്കാർക്കായി അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: גּוֹיִם
  choice: ജനതകൾ
  rationale: ഗോത്രപിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഗּוֹיִם എന്ന ബഹുവചനത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദമാണ് ‘ജനതകൾ’.
- source_word: מַלְכֵי עַמִּים
  choice: ജനവിഭാഗങ്ങളുടെ രാജാക്കന്മാർ
  rationale: עַמִּים എന്നത് മുൻവാക്യത്തിലെ גּוֹיִם എന്നതിൽനിന്ന് വേർതിരിച്ചു കാണിക്കാനും ‘peoples’ എന്ന ബഹുവചനസമൂഹാർഥം വ്യക്തമാക്കാനും ‘ജനവിഭാഗങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: അവളിൽനിന്ന് ഉത്ഭവിക്കും
  rationale: അക്ഷരാർഥം ‘അവളിൽനിന്ന് ഉണ്ടാകും’ എന്നാണെങ്കിലും ഇവിടെ ഉത്ഭവവും വംശപരമ്പരയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉത്ഭവിക്കും’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: സാറയിൽനിന്നുള്ള ജനതകളെയും രാജവംശങ്ങളെയും കുറിച്ചുള്ള വാഗ്ദാനം
  choice: അവൾ ജനതകളായിത്തീരും; ജനവിഭാഗങ്ങളുടെ രാജാക്കന്മാർ അവളിൽനിന്ന് ഉത്ഭവിക്കും
  alternative: അവൾ ജനതകളുടെ അമ്മയായിത്തീരും; ജനവിഭാഗങ്ങളുടെ രാജാക്കന്മാർ അവളിൽനിന്ന് ഉത്ഭവിക്കും
  rationale: ജനതകളും രാജവംശങ്ങളും സാറയിൽനിന്ന് ഉണ്ടാകുമെന്ന ഉടമ്പടിവാഗ്ദാനം വാക്യം പ്രസ്താവിക്കുന്നു. ‘അമ്മ’ എന്ന വ്യാഖ്യാനപരമായി യുക്തമായെങ്കിലും മൂലത്തിൽ വ്യക്തമല്ലാത്ത പദം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, എബ്രായത്തിന്റെ അസാധാരണമായ കോർപ്പറേറ്റ് പ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഉടമ്പടിപരമായ ‘അനുഗ്രഹിക്കും’ എന്ന പദവും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തി; ദുഷ്കരമായ ‘ജനതകളായിത്തീരും’ എന്ന പ്രയോഗം വായനാസഹായിയായ അടിക്കുറിപ്പോടെയാണ് നൽകിയിരിക്കുന്നത്.
