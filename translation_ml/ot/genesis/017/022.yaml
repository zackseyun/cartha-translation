  text: וַ/יְכַ֖ל לְ/דַבֵּ֣ר אִתּ֑/וֹ וַ/יַּ֣עַל אֱלֹהִ֔ים מֵ/עַ֖ל אַבְרָהָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: ml
  text: അവനോടു സംസാരിച്ചുതീർന്നപ്പോൾ ദൈവം അബ്രാഹാമിന്റെ മുകളിൽനിന്ന് മുകളിലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം അബ്രാഹാമിന്റെ മുകളിൽനിന്ന് മുകളിലേക്കു കയറി.” എബ്രായത്തിൽ ‘മുകളിലേക്കു പോകുക/കയറുക’ എന്ന ക്രിയ ഉപയോഗിച്ച് ദൈവപ്രത്യക്ഷതയുടെ അവസാനം സ്ഥലപരമായ ഭാഷയിൽ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: സംസാരിച്ചുതീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയുടെ പൂർത്തീകരണാർഥവും തുടർന്നുവരുന്ന മുഖ്യപ്രവൃത്തിയോടുള്ള കാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന infinitive construct כלה-യോടൊപ്പം ‘സംസാരിച്ചുതീർക്കുക’ എന്ന പ്രയോഗം രൂപപ്പെടുത്തുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടു
  rationale: സംഭാഷണത്തിലെ പരസ്പരബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സർവനാമം അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּעַל
  choice: മുകളിലേക്കു പോയി
  rationale: עלה എന്നതിലെ യഥാർഥമായ ഉയർച്ചയുടെ ദൃശ്യഭാഷ നിലനിർത്തുന്നു; ‘പിരിഞ്ഞുപോയി’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമാണെങ്കിലും ഏകവചനക്രിയയും സന്ദർഭവും ഏകവചനമായ ‘ദൈവം’ ആവശ്യപ്പെടുന്നു.
- source_word: מֵעַל
  choice: അടുക്കൽനിന്ന്
  rationale: מֵעַל എന്നതിന്റെ ‘മേൽനിന്ന്/അരികിൽനിന്ന്’ എന്ന ബന്ധാർഥം ഈ ദൈവപ്രത്യക്ഷതയുടെ അവസാനത്തെ വിവരിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉയർച്ചയുടെ ഘടകം മുഖ്യക്രിയയിൽ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
theological_decisions:
- issue: ദൈവിക സാന്നിധ്യം അവസാനിക്കുന്നതിന്റെ സ്ഥലപരമായ വിവരണം
  choice: ‘ദൈവം ... മുകളിലേക്കു പോയി’ എന്ന ഉയർച്ചാഭാഷ നിലനിർത്തി
  alternative: ‘ദൈവം അബ്രാഹാമിനെ വിട്ടുപോയി’ / ‘ദൈവം പിൻവാങ്ങി’
  rationale: എബ്രായമൂലം ദൈവപ്രത്യക്ഷതയുടെ അവസാനം സ്ഥലപരമായ ഉയർച്ചയായി ചിത്രീകരിക്കുന്നു. ദൈവത്തെ സ്ഥലപരമായി പരിമിതനാക്കുന്ന സിദ്ധാന്തനിഗമനം ചേർക്കാതെയും ഈ കഥനരൂപം സംരക്ഷിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ഉയർച്ചാദൃശ്യം നിലനിർത്തിയതിനാൽ ‘മുകളിലേക്കു പോയി’ എന്നു നൽകി; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥപരമായ വ്യത്യസ്ത വായന രേഖപ്പെടുത്തി.
