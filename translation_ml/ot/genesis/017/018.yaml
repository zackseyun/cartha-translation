reference: Genesis 17:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: ml
  text: 'അബ്രാഹാം ദൈവത്തോട് പറഞ്ഞു: “ഇശ്മായേൽ അങ്ങയുടെ മുമ്പാകെ ജീവിക്കണമേ![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഇശ്മായേൽ അങ്ങയുടെ സന്നിധിയിൽ ജീവിക്കണമേ!” ‘അങ്ങയുടെ മുമ്പാകെ’ എന്നതിന് അങ്ങയുടെ പ്രീതിയിലോ അനുഗ്രഹത്തിലോ എന്ന ആശയവും ഉണ്ടായേക്കാം.'
    reason: לוּ എന്ന ആശംസാസൂചക കണത്തിന്റെ അപേക്ഷാഭാവവും לְפָנֶיךָ എന്ന പ്രയോഗത്തിന്റെ ‘സന്നിധി/പ്രീതി’ സംബന്ധമായ സാധുവായ അർഥവൈവിധ്യവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പദക്രമവും സന്ദർഭവും തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘പറഞ്ഞു’ മതിയാകുന്നു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തോട്
  rationale: സംസാരക്രിയയോടുകൂടിയ אֶל എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘-ത്തോട്’ ആണ്; הָאֱלֹהִים സന്ദർഭത്തിലെ നിർദിഷ്ട ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לוּ
  choice: …എങ്കിൽ!
  rationale: ഇവിടെ לוּ ഒരു വ്യവസ്ഥയല്ല, തീവ്രമായ ആഗ്രഹമാണ് പ്രകടിപ്പിക്കുന്നത്. മലയാളത്തിലെ ആശംസാസൂചകമായ ‘…എങ്കിൽ!’ ആ വികാരവും അപൂർണമായ ആഗ്രഹവാക്യത്തിന്റെ ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִשְׁמָעֵאל
  choice: ഇശ്മായേൽ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാള ബൈബിൾപ്രയോഗത്തിന് യോജിച്ച രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: יִחְיֶה
  choice: ജീവിച്ചിരുന്നെങ്കിൽ
  rationale: לוּ-യോടൊപ്പമുള്ള അപൂർണക്രിയ അബ്രാഹാമിന്റെ ആഗ്രഹം സൂചിപ്പിക്കുന്നു. ‘ജീവിച്ചിരുന്നെങ്കിൽ’ തുടരുന്ന ജീവനും നിലനിൽപ്പും ആശിക്കുന്ന ഭാവം നൽകുന്നു; ഇത് കഴിഞ്ഞകാലത്തെ അവാസ്തവസ്ഥിതിയായി മാത്രം വായിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുന്നു.
- source_word: לְפָנֶיךָ
  choice: അങ്ങയുടെ മുമ്പാകെ
  rationale: ‘നിന്റെ മുഖസന്നിധിയിൽ/മുമ്പിൽ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ദൈവസന്നിധി, അംഗീകാരം, അനുഗ്രഹം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവത്തിന്റെ മുമ്പാകെ ഇശ്മായേൽ ജീവിക്കണമെന്ന അബ്രാഹാമിന്റെ ആഗ്രഹത്തിന്റെ വ്യാപ്തി
  choice: ‘അങ്ങയുടെ മുമ്പാകെ’ എന്ന് സംക്ഷിപ്തമായി നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ സന്നിധിയിൽ’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ പ്രീതിയിൽ/അനുഗ്രഹത്തിൻ കീഴിൽ’
  rationale: לְפָנֶיךָ ദൈവസന്നിധിയിലും ദൈവപ്രീതിയിലും ജീവിക്കുന്നതിനെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ അതിന്റെ ഉടമ്പടിസംബന്ധമായ ഉള്ളടക്കം വാക്യം വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവിക അംഗീകാരമോ ഉടമ്പടിസ്ഥിതിയോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ വികാരഭരിതമായ ആശംസയും ‘മുമ്പാകെ’ എന്ന സംക്ഷിപ്തവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ പ്രയോഗവും നിലനിർത്തി.
