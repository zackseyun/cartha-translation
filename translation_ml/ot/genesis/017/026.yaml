source:
  edition: WLC
  text: בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה נִמּ֖וֹל אַבְרָהָ֑ם וְ/יִשְׁמָעֵ֖אל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: ml
  text: ആ ദിവസംതന്നെ അബ്രാഹാമും അവന്റെ മകനായ ഇശ്മായേലും പരിച്ഛേദനം ചെയ്യപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: അന്നേ ദിവസംതന്നെ
  rationale: ഈ എബ്രായ പ്രയോഗം കൃത്യമായി അതേ ദിവസമെന്ന കാലസൂചനയ്ക്ക് ഊന്നൽ നൽകുന്നു. ‘അന്നേ ദിവസംതന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נִמּוֹל
  choice: പരിച്ഛേദനം ചെയ്യപ്പെട്ടു
  rationale: മൂലപദത്തിന്റെ നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു. എബ്രായത്തിൽ ക്രിയ ഏകവചന രൂപത്തിലാണെങ്കിലും പിന്നാലെ അബ്രാഹാമും യിശ്മായേലും ചേർന്ന കർത്താവായതിനാൽ മലയാളത്തിൽ ബഹുവചനസമ്മതമായ ‘ചെയ്യപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: אַבְרָהָם
  choice: അബ്രാഹാം
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ളതും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: וְיִשְׁמָעֵאל
  choice: യിശ്മായേലും
  rationale: സംയോജകത്തിന്റെ അർഥം ‘-ഉം’ മുഖേന നൽകി, പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം അബ്രാഹാമിനെ സൂചിപ്പിക്കുന്നു; യിശ്മായേൽ അവന്റെ മകനാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കാലസൂചനയിലെ ഊന്നലും ക്രിയയുടെ നിഷ്ക്രിയഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു.
