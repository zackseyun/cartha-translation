  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: ml
  text: എന്നാൽ എന്റെ ഉടമ്പടി ഞാൻ യിസ്ഹാക്കുമായി സ്ഥാപിക്കും[a]. അടുത്ത വർഷം ഈ നിശ്ചിത സമയത്ത് സാറാ അവനെ നിനക്കു പ്രസവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കൂടാതെ, എന്റെ ഉടമ്പടി ഞാൻ യിസ്ഹാക്കുമായി സ്ഥാപിക്കും.” ഹീബ്രു സംയോജകം ലളിതമായി “ഉം/കൂടാതെ” എന്നർഥത്തിൽ പരിഭാഷപ്പെടുത്താം; എന്നാൽ മുൻവാക്യത്തിൽ യിശ്മായേലിനെക്കുറിച്ചു നൽകിയ വാഗ്ദാനത്തോടുള്ള വൈരുധ്യമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: എന്നാൽ
  rationale: വാവ് എന്ന സംയോജകം അടിസ്ഥാനമായി ‘ഉം/കൂടാതെ’ എന്ന ബന്ധം സൂചിപ്പിക്കാമെങ്കിലും, മുൻവാക്യത്തിലെ യിശ്മായേലിനെക്കുറിച്ചുള്ള വാഗ്ദാനത്തോട് ഇവിടെ വ്യക്തമായ വൈരുധ്യബന്ധമുണ്ട്; അതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്. ‘എന്നും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: ഉല്പത്തിയിലെ ദൈവിക ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ בְּרִית എന്നതിന് സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം; ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ‘എന്റെ’ ആയി പ്രകടമാക്കുന്നു.
- source_word: אָקִים
  choice: ഞാൻ ... സ്ഥാപിക്കും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഉടമ്പടി ഉറപ്പോടെ സ്ഥാപിക്കുക എന്നർഥം നൽകുന്നു; ‘സ്ഥാപിക്കും’ ഔപചാരികതയും ഉടമ്പടിസന്ദർഭവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: אֶת יִצְחָק
  choice: യിസ്ഹാക്കുമായി
  rationale: ഹീബ്രുവിൽ നേരിട്ടുള്ള കർമസൂചകമാണെങ്കിലും, മലയാളത്തിൽ ‘ഉടമ്പടി സ്ഥാപിക്കുക’ എന്ന പ്രയോഗത്തോടൊപ്പം ഉടമ്പടിയിലെ പങ്കാളിയെ ‘-മായി’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: സാറാ അവനെ നിനക്കു പ്രസവിക്കും
  rationale: ബന്ധവാക്യം യിസ്ഹാക്കിനെ വാഗ്ദത്തപുത്രനായി തിരിച്ചറിയിക്കുന്നു; לְךָ എന്നത് ‘നിനക്കു’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: ഈ നിശ്ചിതസമയത്ത്
  rationale: מוֹעֵד മുൻകൂട്ടി നിശ്ചയിച്ച സമയം എന്ന ആശയം വഹിക്കുന്നു; ‘നിശ്ചിതസമയം’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּשָּׁנָה הָאַחֶרֶת
  choice: അടുത്ത വർഷം
  rationale: അക്ഷരാർഥത്തിൽ ‘തുടർന്നുവരുന്ന/മറ്റേ വർഷത്തിൽ’; മലയാളത്തിൽ ‘അടുത്ത വർഷം’ ഏറ്റവും സ്വാഭാവികമായ തുല്യപ്രയോഗമാണ്.
theological_decisions:
- issue: യിശ്മായേലിനല്ല, യിസ്ഹാക്കുമായി ഉടമ്പടി സ്ഥാപിക്കപ്പെടുന്നു
  choice: ദൈവം തന്റെ ഉടമ്പടി യിസ്ഹാക്കുമായി സ്ഥാപിക്കുമെന്ന് വാക്യം നേരിട്ട് പ്രസ്താവിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: മുൻവാക്യത്തിലെ യിശ്മായേലിനുള്ള അനുഗ്രഹവാഗ്ദാനവുമായി വ്യത്യാസം മൃദുവാക്കി വെറും തുടർച്ചയായി വായിക്കുക.
  rationale: വാക്യത്തിലെ ഉടമ്പടിപങ്കാളിയായി യിസ്ഹാക്കിനെ വ്യക്തമായി നിലനിർത്തുന്നു; എന്നാൽ പാഠം പറയുന്നതിന് അപ്പുറമുള്ള പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ‘ഉടമ്പടി’, ‘സ്ഥാപിക്കും’, ‘നിശ്ചിതസമയം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ഔപചാരികത കാത്തുസൂക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ‘യിസ്ഹാക്ക്’, ‘സാറാ’ എന്നീ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
