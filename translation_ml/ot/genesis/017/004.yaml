  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: ml
  text: ഞാനോ[a], ഇതാ, എന്റെ ഉടമ്പടി നിന്നോടുകൂടെയുണ്ട്; നീ അനേകം ജനതകളുടെ പിതാവായിത്തീരും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഞാൻ—ഇതാ, എന്റെ ഉടമ്പടി നിന്നോടുകൂടെയുണ്ട്.’ ഹീബ്രുവിലെ ആരംഭ സർവനാമത്തിനും തുടർന്നുള്ള കണത്തിനും ഊന്നലുണ്ട്.'
