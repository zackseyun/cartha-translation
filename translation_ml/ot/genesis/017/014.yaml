source:
  edition: WLC
  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: ml
  text: പരിച്ഛേദനം ചെയ്യപ്പെടാത്ത പുരുഷൻ—അവന്റെ അഗ്രചർമ്മത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്യപ്പെട്ടിട്ടില്ലാത്തവൻ—ആ വ്യക്തി തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും[a][b]; അവൻ എന്റെ ഉടമ്പടി ലംഘിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ആ ജീവൻ [അഥവാ വ്യക്തി] തന്റെ ജനത്തിൽനിന്ന് ഛേദിക്കപ്പെടും.” ഹീബ്രു ‘ജീവൻ/വ്യക്തി’ എന്ന പദവും ‘ഛേദിക്കപ്പെടുക’ എന്ന ഉടമ്പടിശിക്ഷാ പ്രയോഗവും ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ഛേദിക്കപ്പെടുക” എന്നത് കടുത്ത ഉടമ്പടിശിക്ഷയെ സൂചിപ്പിക്കാം; സന്ദർഭമനുസരിച്ച് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലോ മരണമോ ഉൾപ്പെടാം. ഈ വാക്യം അതിനെ കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: പരിച്ഛേദനം ഏൽക്കാത്ത പുരുഷൻ
  rationale: עָרֵל എന്നത് പരിച്ഛേദനം ചെയ്യപ്പെടാത്തവനെ സൂചിപ്പിക്കുന്നു; זָכָר കൂടിയതിനാൽ പുരുഷവ്യക്തി എന്നു വ്യക്തമാകുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നിയമപരമായ പ്രസ്താവനയ്ക്ക് യോജിച്ചതുമായ രൂപം.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: പരിച്ഛേദനം ഏൽക്കാത്ത
  rationale: מול എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു. പൊതുവായ നിയമനിബന്ധനയായതിനാൽ ഈ രൂപം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: അഗ്രചർമ്മത്തിന്റെ മാംസത്തിൽ
  rationale: ഹീബ്രുവിലെ ശരീരശാസ്ത്രപരമായ വ്യക്തത പൊതുവാക്കി കളയാതെ നിലനിർത്തുന്നു. בְּשַׂר ‘മാംസം’, עָרְלָה ‘അഗ്രചർമ്മം’ എന്ന മൂർത്തമായ പദപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി ഛേദിക്കപ്പെടണം
  rationale: נפש ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതിലുപരി ശിക്ഷയ്ക്ക് വിധേയനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഛേദിക്കപ്പെടണം’ എന്നത് כרת എന്ന ഉടമ്പടിശിക്ഷാ പ്രയോഗത്തിന്റെ മനപ്പൂർവമായ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: מֵעַמֶּיהָ
  choice: തന്റെ ജനത്തിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ പ്രത്യയം נפש-നോടു വ്യാകരണപരമായി യോജിക്കുന്നുവെങ്കിലും സൂചിപ്പിക്കുന്നത് പ്രസ്തുത പുരുഷനെയാണ്. ‘തന്റെ ജനത്തിൽനിന്ന്’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ ബന്ധം അറിയിക്കുന്നു.
- source_word: אֶת בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന പ്രധാന ഉടമ്പടിപദത്തിന്റെ ദൈവശാസ്ത്രപരവും സാഹിത്യപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: הֵפַר
  choice: ലംഘിച്ചിരിക്കുന്നു
  rationale: הפר എന്നതിന് ഉടമ്പടി ഭംഗപ്പെടുത്തുക, ലംഘിക്കുക, അസാധുവാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ‘ലംഘിച്ചിരിക്കുന്നു’ ഈ സന്ദർഭത്തിലെ കുറ്റകരമായ ഉടമ്പടിലംഘനം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: כרת എന്ന ഉടമ്പടിശിക്ഷയുടെ അർഥം
  choice: ‘ഛേദിക്കപ്പെടണം’ എന്ന പ്രയോഗം നിലനിർത്തി ശിക്ഷയുടെ കൃത്യരൂപം നിർണയിക്കാതിരിക്കുക
  alternative: സമൂഹത്തിൽനിന്ന് പുറത്താക്കപ്പെടണം; കൊല്ലപ്പെടണം
  rationale: ഈ വാക്യം മാത്രം ശിക്ഷ സമൂഹബഹിഷ്കരണമോ മരണമോ മറ്റൊരു ദൈവിക ന്യായവിധിയോ എന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരവും നിയമപരവുമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
- issue: נפש എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വ്യക്തി
  alternative: ആത്മാവ്; ജീവൻ
  rationale: ഇവിടെ נפש ഉടമ്പടിശിക്ഷയ്ക്ക് വിധേയനായ മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലത്തിൽ നിർബന്ധമല്ലാത്ത ശരീര-ആത്മ ദ്വൈതധാരണ കൊണ്ടുവരാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപ്രസ്താവനയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ശരീരശാസ്ത്രപരമായ പദപ്രയോഗവും ഉടമ്പടിശിക്ഷയുടെ അവ്യക്തതയും സംരക്ഷിച്ചു.
