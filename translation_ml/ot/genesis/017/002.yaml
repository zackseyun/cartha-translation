source:
  edition: WLC
  text: וְ/אֶתְּנָ֥ה בְרִיתִ֖/י בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/אַרְבֶּ֥ה אוֹתְ/ךָ֖ בִּ/מְאֹ֥ד מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: ml
  text: ഞാനും നീയും തമ്മിൽ എന്റെ ഉടമ്പടി ഞാൻ സ്ഥാപിക്കും[a]; നിന്നെ ഞാൻ അത്യധികമായി വർധിപ്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാനും നീയും തമ്മിൽ എന്റെ ഉടമ്പടി ഞാൻ നൽകും/വെക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: ഞാൻ സ്ഥാപിക്കും
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, בְּרִית എന്ന പദത്തോടൊപ്പമുള്ള ഈ ഉടമ്പടിസന്ദർഭത്തിൽ ‘സ്ഥാപിക്കും’ എന്നത് ഉദ്ദേശിച്ച പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന പദത്തിന്റെ ഔപചാരികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം; ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ‘എന്റെ’ എന്നു പ്രതിനിധീകരിച്ചു.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: ഞാനും നീയും തമ്മിൽ
  rationale: ബന്ധസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְאַרְבֶּה
  choice: ഞാൻ വർധിപ്പിക്കും
  rationale: רבה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം എണ്ണത്തിൽ പെരുക്കുന്ന കാരണാർഥം സൂചിപ്പിക്കുന്നു; ‘വർധിപ്പിക്കും’ അബ്രാമിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: אֹתְךָ
  choice: നിന്നെ
  rationale: മൂലപാഠത്തിൽ രണ്ടാംപുരുഷ പുല്ലിംഗ ഏകവചന കർമം അബ്രാമിനെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; സന്തതിയെ വ്യാഖ്യാനമായി മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בִּמְאֹד מְאֹד
  choice: അത്യധികമായി
  rationale: מְאֹד എന്ന പദത്തിന്റെ ആവർത്തനം നൽകുന്ന ശക്തമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: נתן + ברית എന്ന ഉടമ്പടിപ്രയോഗം
  choice: എന്റെ ഉടമ്പടി ഞാൻ സ്ഥാപിക്കും
  alternative: എന്റെ ഉടമ്പടി ഞാൻ വെക്കും / നൽകും
  rationale: ‘കൊടുക്കുക/വെക്കുക’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ, ഉടമ്പടിസന്ദർഭത്തിലെ പ്രവൃത്തിയെ ‘സ്ഥാപിക്കും’ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ഉടമ്പടി ആരംഭിക്കുകയാണോ സ്ഥിരീകരിക്കുകയാണോ എന്നതിനെ അതിലപ്പുറം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായത്തിലെ നേരിട്ടുള്ള രണ്ടാംപുരുഷ ഏകവചനരൂപവും ഉടമ്പടിപദത്തിന്റെ ഔപചാരിക ഭാരവും നിലനിർത്തി.
