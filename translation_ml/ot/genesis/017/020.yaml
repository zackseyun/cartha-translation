id: GEN.17.20
reference: Genesis 17:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: ml
  text: യിശ്മായേലിനെക്കുറിച്ചും ഞാൻ നിന്റെ അപേക്ഷ കേട്ടിരിക്കുന്നു. ഇതാ, ഞാൻ അവനെ അനുഗ്രഹിച്ചിരിക്കുന്നു; ഞാൻ അവനെ സന്താനസമൃദ്ധനാക്കുകയും അവനെ അത്യന്തം വർധിപ്പിക്കുകയും ചെയ്യും. അവൻ പന്ത്രണ്ട് പ്രഭുക്കന്മാർക്കു പിതാവാകും; ഞാൻ അവനെ ഒരു വലിയ ജനതയാക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּיךָ
  choice: ഞാൻ നിന്റെ അപേക്ഷ കേട്ടിരിക്കുന്നു
  rationale: പദശഃ ‘ഞാൻ നിന്നെ കേട്ടിരിക്കുന്നു’ എന്നാണ്; സന്ദർഭത്തിൽ അബ്രാഹാമിന്റെ യിശ്മായേലിനെക്കുറിച്ചുള്ള അപേക്ഷയ്ക്ക് ദൈവം ഉത്തരം നൽകിയെന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ദൈവത്തിന്റെ തുടർന്നുള്ള പ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സൂചകപദത്തിന്റെ ഗൗരവവും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וְהִפְרֵיתִי אֹתוֹ
  choice: ഞാൻ അവനെ സന്താനസമൃദ്ധനാക്കുകയും
  rationale: പ്രജനനപരമായ ‘ഫലവത്താക്കുക’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בִּמְאֹד מְאֹד
  choice: അത്യന്തം
  rationale: ‘വളരെ വളരെ’ എന്ന ശക്തമായ ഹീബ്രു ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: נְשִׂיאִם
  choice: പ്രഭുക്കന്മാർ
  rationale: ഗോത്രത്തലവന്മാരെയോ ഭരണനേതാക്കളെയോ സൂചിപ്പിക്കുന്ന പദം; രാജാക്കന്മാർ എന്ന് അതിരുകടന്ന് നിർവചിക്കാതെ നേതൃപദവി നിലനിർത്തുന്നു.
- source_word: לְגוֹי גָּדוֹל
  choice: ഒരു വലിയ ജനതയാക്കും
  rationale: גּוֹי എന്നത് ഇവിടെ യിശ്മായേലിൽനിന്ന് രൂപപ്പെടുന്ന വലിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനത’ അതിന് സ്വാഭാവികമായ തുല്യപദമാണ്.
theological_decisions:
- issue: യിശ്മായേലിനുള്ള അനുഗ്രഹവും ഉടമ്പടി വംശരേഖയും തമ്മിലുള്ള വ്യത്യാസം
  choice: വാക്യത്തിൽ പറയുന്ന അനുഗ്രഹം, സന്താനവർധന, വലിയ ജനത എന്നീ വാഗ്ദാനങ്ങൾ മാറ്റമില്ലാതെ വ്യക്തമായി നിലനിർത്തി.
  alternative: ഉടമ്പടി യിസ്ഹാക്കിലൂടെ സ്ഥാപിക്കപ്പെടുമെന്ന അടുത്ത വാക്യത്തിന്റെ ആശയം ഇവിടെ ചേർത്ത് യിശ്മായേലിന്റെ അനുഗ്രഹത്തെ പരിമിതപ്പെടുത്തുക.
  rationale: മൂലവാക്യം യിശ്മായേലിനുള്ള യഥാർഥ അനുഗ്രഹം ശക്തമായി പ്രഖ്യാപിക്കുന്നു; ഉടമ്പടിയുടെ പ്രത്യേക വംശരേഖയെക്കുറിച്ചുള്ള വേർതിരിവ് ഈ വാക്യത്തിൽ ചേർക്കാതെ സന്ദർഭത്തിനായി വിടണം.
- issue: שָׁמַעְתִּיךָ എന്നതിലെ കർമസൂചന
  choice: ‘നിന്റെ അപേക്ഷ കേട്ടിരിക്കുന്നു’
  alternative: ‘നിന്നെ കേട്ടിരിക്കുന്നു’
  rationale: രണ്ടാമത്തെത് കൂടുതൽ രൂപപരമായി അടുപ്പമുള്ളതാണെങ്കിലും, മലയാളത്തിൽ സന്ദർഭോചിതമായ അർഥം ആദ്യത്തെ രൂപം വ്യക്തമായി നൽകുന്നു; ദൈവം അബ്രാഹാമിന്റെ വാക്ക് അംഗീകരിച്ചെന്ന ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘ഇതാ’, ‘അനുഗ്രഹിച്ചിരിക്കുന്നു’, ‘പ്രഭുക്കന്മാർ’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ പ്രഖ്യാപനാത്മക ഗൗരവം നിലനിർത്തുന്നു; അനാവശ്യമായ പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
