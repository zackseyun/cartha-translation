  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: ml
  text: അപ്പോൾ അബ്രാഹാം തന്റെ മകനായ യിശ്മായേലിനെയും, തന്റെ വീട്ടിൽ ജനിച്ച എല്ലാവരെയും, പണം കൊടുത്തു വാങ്ങിയ എല്ലാവരെയും, അബ്രാഹാമിന്റെ വീട്ടിലുള്ളവരിൽ ഓരോ ആണിനെയും കൂട്ടി; ദൈവം അവനോടു പറഞ്ഞതുപോലെ, ആ ദിവസംതന്നെ[a] അവരുടെ അഗ്രചർമത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈ ദിവസംതന്നെ”; അബ്രാഹാം അതേ ദിവസംതന്നെ പ്രവർത്തിച്ചുവെന്നതിന് ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുവന്ന്
  rationale: לקח എന്നത് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; എന്നാൽ ഇവിടെ പരിച്ഛേദനം ചെയ്യേണ്ട വീട്ടുകാരെ ഒരുമിച്ചുകൊണ്ടുവന്ന് നടപടി ആരംഭിക്കുന്നതായതിനാൽ ഈ സ്വാഭാവിക മലയാളപ്രയോഗം സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְלִידֵי בֵיתוֹ
  choice: തന്റെ വീട്ടിൽ ജനിച്ച എല്ലാവരെയും
  rationale: ‘അവന്റെ വീട്ടിൽ ജനിച്ചവർ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; അവരുടെ സാമൂഹിക പദവി മുഖ്യവാക്യത്തിൽ ആവശ്യത്തിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: തന്റെ പണംകൊടുത്തു വാങ്ങിയ എല്ലാവരെയും
  rationale: വിലകൊടുത്ത് വീട്ടിലേക്കു സ്വന്തമാക്കിയ ആളുകളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘പണംകൊടുത്തു വാങ്ങിയ’ എന്നത് ആ സാമ്പത്തിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: അബ്രാഹാമിന്റെ വീട്ടിലുള്ള പുരുഷന്മാരിൽ ഓരോ ആണിനെയും
  rationale: זָכָר എന്ന ‘ആൺ’ എന്ന വ്യക്തമായ ലിംഗസൂചനയും אַנְשֵׁי എന്ന ‘പുരുഷന്മാർ’ എന്ന പദവും സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ഉറവിടത്തിലെ ആവർത്തനസ്വഭാവവും സമഗ്രതയും നിലനിൽക്കുന്നു.
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: അവരുടെ അഗ്രചർമത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്തു
  rationale: പരിച്ഛേദനത്തിനുള്ള പതിവുപദവും בְּשַׂר עָרְלָה എന്ന ശരീരസംബന്ധമായ മൂർത്തമായ ഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: അന്നുതന്നെ
  rationale: ആ ദിവസംതന്നെ വൈകാതെ അനുസരിച്ചെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: ദൈവം തന്നോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר אתו എന്നത് ‘അവനോടു/അവനുമായി സംസാരിച്ചു’ എന്ന ഇരു സൂക്ഷ്മതകളും അനുവദിക്കുന്നു. ദൈവവചനത്തിന്റെ ഗൗരവത്തിന് യോജിച്ച ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും സംഭാഷണാത്മകതയെ സിദ്ധാന്തപരമായി അതിനപ്പുറം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: אֱלֹהִים എന്ന ദൈവനാമസൂചന
  choice: ദൈവം
  alternative: ദേവൻ
  rationale: ഉടമ്പടി പ്രസംഗിക്കുന്ന ഏകദൈവത്തെയാണ് സന്ദർഭം വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും സ്ഥാപിതവുമായ രൂപം ‘ദൈവം’ ആണ്.
- issue: വീട്ടുകാരെ വിവരിക്കുന്ന ലിംഗസൂചകഭാഷ
  choice: പുരുഷന്മാരിൽ ഓരോ ആണിനെയും
  alternative: വീട്ടിലുള്ള ഓരോ പുരുഷനെയും
  rationale: ഉറവിടത്തിലെ זָכָר (‘ആൺ’) എന്നും אַנְשֵׁי (‘പുരുഷന്മാർ’) എന്നും ഉള്ള ഇരട്ടപ്രയോഗം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; പകരം കൂടുതൽ സുതാര്യമെങ്കിലും ഉറവിടത്തിലെ ആവർത്തനം ചുരുക്കുന്നു.
- issue: דִּבֶּר אִתּוֹ എന്നതിലെ ബന്ധസൂചന
  choice: തന്നോടു അരുളിച്ചെയ്തതുപോലെ
  alternative: തന്നുമായി സംസാരിച്ചതുപോലെ
  rationale: എബ്രായം ‘അവനോടു പറഞ്ഞു’ എന്നും ‘അവനുമായി സംസാരിച്ചു’ എന്നും ഉൾക്കൊള്ളാൻ കഴിയും. ഈ കല്പനയോടുള്ള അനുസരണമാണ് ഇവിടെ പ്രധാനം; മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം തെരഞ്ഞെടുത്തു, എന്നാൽ സംഭാഷണസൂചനയെ ആശയപരമായി നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘വീട്’ എന്ന പദം ഭൗതിക ഭവനത്തെയും വിപുലമായ വീട്ടുകൂട്ടത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ എബ്രായ בַּיִת എന്നതിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യവാക്യത്തിൽ ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
