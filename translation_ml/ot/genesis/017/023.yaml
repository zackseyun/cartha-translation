revisions:
- from: അപ്പോൾ അബ്രാഹാം തന്റെ മകനായ യിശ്മായേലിനെയും തന്റെ വീട്ടിൽ ജനിച്ച എല്ലാവരെയും തന്റെ പണംകൊടുത്തു വാങ്ങിയ എല്ലാവരെയും—അബ്രാഹാമിന്റെ വീട്ടിലുള്ള പുരുഷന്മാരിൽ ഓരോ ആണിനെയും—കൂട്ടിക്കൊണ്ടുവന്ന്, ദൈവം തന്നോടു അരുളിച്ചെയ്തതുപോലെ, അന്നുതന്നെ[a] അവരുടെ അഗ്രചർമത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്തു.
  to: അപ്പോൾ അബ്രാഹാം തന്റെ മകനായ യിശ്മായേലിനെയും, തന്റെ വീട്ടിൽ ജനിച്ച എല്ലാവരെയും, പണം കൊടുത്തു വാങ്ങിയ എല്ലാവരെയും, അബ്രാഹാമിന്റെ വീട്ടിലുള്ളവരിൽ ഓരോ ആണിനെയും കൂട്ടി; ദൈവം അവനോടു പറഞ്ഞതുപോലെ, ആ ദിവസംതന്നെ[a] അവരുടെ അഗ്രചർമത്തിന്റെ മാംസം പരിച്ഛേദനം ചെയ്തു.
  rationale: The revision retains all four groups specified in the Hebrew, the explicit reference to every male, the concrete reference to foreskin flesh, and the emphasis on action that very day. It removes added locational movement, improves modern Malayalam syntax, and renders the final divine-speech clause more directly.
