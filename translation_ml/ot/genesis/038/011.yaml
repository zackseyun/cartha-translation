  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/תָמָ֨ר כַּלָּת֜/וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית אָבִ֗י/ךְ עַד יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔/י כִּ֣י אָמַ֔ר פֶּן יָמ֥וּת גַּם ה֖וּא כְּ/אֶחָ֑י/ו וַ/תֵּ֣לֶךְ תָּמָ֔ר וַ/תֵּ֖שֶׁב בֵּ֥ית אָבִֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ തന്റെ മരുമകളായ താമാറിനോട് പറഞ്ഞു: “എന്റെ മകൻ ശേലാ വളരുന്നതുവരെ നീ നിന്റെ അപ്പന്റെ വീട്ടിൽ വിധവയായി കഴിയുക.” കാരണം, “അവനും അവന്റെ സഹോദരന്മാരെപ്പോലെ മരിച്ചുപോയേക്കാം,” എന്ന് അവൻ പറഞ്ഞു[a]. അങ്ങനെ താമാർ പോയി തന്റെ അപ്പന്റെ വീട്ടിൽ താമസിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്ന് അവൻ വിചാരിച്ചു.” എബ്രായത്തിലെ “പറഞ്ഞു” എന്ന പദം മനസ്സിലെ ചിന്തയെയും പരിചയപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: വിധവയായി കഴിയുക
  rationale: ആജ്ഞാരൂപമായ שְׁבִיയും വിധവസ്ഥയെ സൂചിപ്പിക്കുന്ന אַלְמָנָהയും ചേർന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ആ സ്ഥിതിയിൽ തുടരാനുള്ള നിർദേശവും നിലനിർത്തുന്നു.
- source_word: בֵית אָבִיךְ
  choice: നിന്റെ അപ്പന്റെ വീട്ടിൽ
  rationale: പിതൃഭവനത്തിലെ താമസം സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: എന്റെ മകൻ ശേലാ വളരുന്നതുവരെ
  rationale: יִגְדַּל എന്നത് വളർന്ന് പ്രായപൂർത്തിയാകുന്നതിനെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു; എന്നാൽ വിവാഹയോഗ്യത എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കാതെ മൂലത്തിലെ പൊതുവായ പദം നിലനിർത്തുന്നു.
- source_word: כִּי אָמַר
  choice: കാരണം ... എന്ന് അവൻ പറഞ്ഞു
  rationale: אָמַר എന്ന ‘പറഞ്ഞു’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു; ഇത് മനസ്സിലെ ചിന്തയെ പരിചയപ്പെടുത്തുന്നതാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: פֶּן יָמוּת
  choice: മരിച്ചുപോയേക്കാം
  rationale: פֶּן പ്രകടിപ്പിക്കുന്ന ഭയാശങ്ക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഫലം ഉറപ്പാണെന്നല്ല, ആശങ്കയാണെന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: כְּאֶחָיו
  choice: തന്റെ സഹോദരന്മാരെപ്പോലെ
  rationale: ഏരിന്റെയും ഓനാന്റെയും മരണത്തോടുള്ള താരതമ്യം, അധിക വിശദീകരണം ചേർക്കാതെ, നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַתֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ധാതുവിന്റെ ഇവിടെ ആവശ്യമായ സ്ഥിരവാസ അർഥം ലളിതമായ കഥനമലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּלָּתוֹ
  choice: തന്റെ മരുമകളായ
  rationale: സന്ദർഭത്തിലെ ബന്ധം വ്യക്തമാക്കുന്ന സാധാരണ മലയാള ബന്ധപദം.
- source_word: בֵּית אָבִיהָ
  choice: തന്റെ അപ്പന്റെ വീട്ടിൽ
  rationale: മുമ്പുള്ള സമാന പ്രയോഗവുമായി പൊരുത്തം നിലനിർത്തിക്കൊണ്ട് പിതൃഭവനത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യെഹൂദായുടെ വാക്ക് ശബ്ദമായി പറഞ്ഞതോ മനസ്സിൽ വിചാരിച്ചതോ
  choice: പ്രധാനപാഠത്തിൽ ‘എന്ന് അവൻ പറഞ്ഞു’
  alternative: ‘എന്ന് അവൻ വിചാരിച്ചു’
  rationale: എബ്രായത്തിൽ אָמַר എന്നത് അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണ്, എന്നാൽ ആന്തരിക ചിന്തയും പരിചയപ്പെടുത്താം. പ്രധാനപാഠം മൂലപദം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് യഥാർഥമായ അർഥസാധ്യത രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായതിനാൽ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനങ്ങളും യെഹൂദായുടെ ഭയാശങ്കയും അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തി.
