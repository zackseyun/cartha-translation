  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ תִּֽקַּֽח לָ֔/הּ פֶּ֖ן נִהְיֶ֣ה לָ/ב֑וּז הִנֵּ֤ה שָׁלַ֨חְתִּי֙ הַ/גְּדִ֣י הַ/זֶּ֔ה וְ/אַתָּ֖ה לֹ֥א מְצָאתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: ml
  text: 'യെഹൂദാ പറഞ്ഞു: “അവൾ അവ കൈവശം വെച്ചുകൊള്ളട്ടെ; അല്ലെങ്കിൽ നാം പരിഹാസപാത്രമായിത്തീരും.[a] ഇതാ, ഞാൻ ഈ കോലാട്ടിൻകുട്ടിയെ അയച്ചു; എന്നാൽ നീ അവളെ കണ്ടെത്തിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നാം അപമാനിതരായിത്തീരും” എന്നോ “നാം പരിഹസിക്കപ്പെടും” എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം അവജ്ഞയ്ക്കോ പരിഹാസത്തിനോ പാത്രമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: അവൾ അവ കൈവശം വെച്ചുകൊള്ളട്ടെ
  rationale: 'ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് അനുവദനീയമായ ആജ്ഞാർഥമുണ്ട്: പണയവസ്തുക്കൾ അവൾ സൂക്ഷിച്ചുകൊള്ളുന്നതിന് യെഹൂദാ സമ്മതിക്കുന്നു. ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ ഒന്നിലധികം പണയവസ്തുക്കളെ സൂചിപ്പിക്കാൻ ‘അവ’ ഉപയോഗിച്ചു.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: അല്ലെങ്കിൽ നാം പരിഹാസപാത്രമായിത്തീരും
  rationale: פֶּן ഭയപ്പെടുന്ന ഫലം സൂചിപ്പിക്കുന്നു; בּוּז അവജ്ഞയും നിന്ദയും പരിഹാസവും ഉൾക്കൊള്ളുന്നു. സാമൂഹിക അപമാനം സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുപറയുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: ഞാൻ ഈ കോലാട്ടിൻകുട്ടിയെ അയച്ചു
  rationale: גְּדִי ഇളംപ്രായമുള്ള ആടിനെ, പ്രത്യേകിച്ച് കോലാട്ടിൻകുട്ടിയെ, സൂചിപ്പിക്കുന്നു. ‘ഈ’ എന്ന നിർദ്ദേശകം മൂലപാഠത്തിൽനിന്ന് നിലനിർത്തി.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: എന്നാൽ നീ അവളെ കണ്ടെത്തിയില്ല
  rationale: וְ ഇവിടെ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. സ്ത്രീലിംഗ പ്രത്യയം അന്വേഷിച്ച സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പണയവസ്തുക്കളുടെ ബഹുവചനം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുകയും ഹീബ്രുവിലെ സാമൂഹിക നിന്ദയുടെ ആശയവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
