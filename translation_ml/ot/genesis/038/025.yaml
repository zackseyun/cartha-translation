  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: ml
  text: 'അവളെ പുറത്തേക്കു കൊണ്ടുപോകുമ്പോൾ, അവൾ തന്റെ അമ്മായിയപ്പന് സന്ദേശം അയച്ചു: “ഇവ ആരുടേതോ ആ പുരുഷനാലാണ് ഞാൻ ഗർഭിണിയായത്.” പിന്നെ അവൾ പറഞ്ഞു: “ഈ മുദ്രയും ചരടുകളും വടിയും ആരുടേതാണെന്ന് ദയവായി തിരിച്ചറിയുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവ ആരുടേതാണെന്ന് ദയവായി നിർണയിക്കുക.” ഹീബ്രായ ക്രിയയ്ക്ക് ‘തിരിച്ചറിയുക’ എന്നും ‘ആരുടേതെന്ന് നിർണയിക്കുക’ എന്നും അർഥമാകാം; ഇവിടെ കുറ്റവിചാരണയെ ഓർമിപ്പിക്കുന്ന മൂർച്ചയുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: പുറത്തേക്കു കൊണ്ടുപോകുമ്പോൾ
  rationale: יצא എന്ന ക്രിയയുടെ ഹോഫാൽ വർത്തമാന കൃദന്തരൂപം ശിക്ഷയ്ക്കായി അവളെ പുറത്തേക്കു കൊണ്ടുപോകുന്ന പുരോഗമിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: שָׁלְחָה אֶל חָמִיהָ
  choice: തന്റെ അമ്മായിയപ്പന്റെ അടുക്കൽ ആളയച്ചു
  rationale: ശാരീരികമായി ഒരു വസ്തു മാത്രം അയച്ചു എന്നതിലുപരി, തുടർന്നുവരുന്ന സന്ദേശം അദ്ദേഹത്തെ അറിയിക്കാൻ ആളയച്ചുവെന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: ഈ സാധനങ്ങളുടെ ഉടമയായ പുരുഷനാലാണ് ഞാൻ ഗർഭിണിയായത്
  rationale: לְאִישׁ ഗർഭധാരണത്തിന് കാരണനായ പുരുഷനെ സൂചിപ്പിക്കുകയും ബന്ധവാക്യം വസ്തുക്കളുടെ ഉടമസ്ഥത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַכֶּר נָא
  choice: ദയവായി തിരിച്ചറിയുക
  rationale: נכר എന്ന ആജ്ഞാരൂപം തിരിച്ചറിയുക/ആരുടേതെന്ന് നിർണയിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; נָא അഭ്യർഥനയുടെ ഭാവം നൽകുന്നു.
- source_word: חֹתֶמֶת
  choice: മുദ്രമോതിരം
  rationale: വ്യക്തിയെ തിരിച്ചറിയാൻ ഉപയോഗിച്ചിരുന്ന സ്വകാര്യ മുദ്രയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ അത് ചരടുകളോടൊപ്പം ധരിച്ചിരുന്ന മുദ്രമോതിരമായി സ്വാഭാവികമായി മനസ്സിലാക്കാം.
- source_word: פְּתִילִים
  choice: ചരടുകൾ
  rationale: ഹീബ്രായ പദത്തിന്റെ ബഹുവചനം നിലനിർത്തുകയും മുദ്രയോടു ബന്ധിപ്പിച്ചിരുന്ന ചരടുകളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מַטֶּה
  choice: വടി
  rationale: പിതൃഗോത്രകാല കഥാസന്ദർഭത്തിലെ കൈവടി/അധികാരചിഹ്നം എന്ന പൊതുവായ അർഥത്തിന് സ്വാഭാവികമായ മലയാളം.
