translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും കഥയുടെ നാടകീയതയും നിലനിർത്തി. ‘അമ്മായിയപ്പൻ,’ ‘ഗർഭിണി,’ ‘മുദ്രമോതിരം’ തുടങ്ങിയ സാധാരണക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രായത്തിലെ തിരിച്ചറിയൽ/നിർണയിക്കൽ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
