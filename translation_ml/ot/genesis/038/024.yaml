  to: 'ഏകദേശം മൂന്നുമാസം കഴിഞ്ഞപ്പോൾ, “നിന്റെ മരുമകളായ താമാർ വേശ്യാവൃത്തി നടത്തിയിരിക്കുന്നു[a]; മാത്രമല്ല, ഇതാ, വേശ്യാവൃത്തിയിലൂടെ അവൾ ഗർഭിണിയായിരിക്കുന്നു[b]” എന്ന് യെഹൂദാവിനെ അറിയിച്ചു. അപ്പോൾ യെഹൂദാ പറഞ്ഞു: “അവളെ പുറത്തുകൊണ്ടുവരൂ; അവൾ ചുട്ടെരിക്കപ്പെടട്ടെ.”'
