id: GEN.38.24
reference: Genesis 38:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: ml
  text: 'ഏകദേശം മൂന്നുമാസം കഴിഞ്ഞപ്പോൾ, “നിന്റെ മരുമകളായ താമാർ വേശ്യാവൃത്തി നടത്തിയിരിക്കുന്നു[a]; മാത്രമല്ല, ഇതാ, വേശ്യാവൃത്തിയിലൂടെ അവൾ ഗർഭിണിയായിരിക്കുന്നു[b]” എന്ന് യെഹൂദാവിനെ അറിയിച്ചു. അപ്പോൾ യെഹൂദാ പറഞ്ഞു: “അവളെ പുറത്തുകൊണ്ടുവരൂ; അവൾ ചുട്ടെരിക്കപ്പെടട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേശ്യയെപ്പോലെ പെരുമാറിയിരിക്കുന്നു”; കൂടുതൽ പൊതുവായി, “ലൈംഗിക അധാർമികത ചെയ്തിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വേശ്യാവൃത്തിയുടെ ഫലമായി ഗർഭിണിയായിരിക്കുന്നു” അല്ലെങ്കിൽ “വേശ്യാവൃത്തികളിലൂടെ ഗർഭിണിയായിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: ഏകദേശം മൂന്നുമാസം കഴിഞ്ഞപ്പോൾ
  rationale: כְּ സൂചിപ്പിക്കുന്ന ഏകദേശ കാലപരിധിയും എബ്രായ ആഖ്യാനത്തിലെ പുതിയ സംഭവവികാസവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: എന്ന് യെഹൂദയെ അറിയിച്ചു
  rationale: נגד എന്ന ക്രിയയുടെ ഹോഫാൽ നിഷ്പ്രയോകഭാവം റിപ്പോർട്ട് യെഹൂദയ്ക്കു ലഭിച്ചതായി വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടകം മലയാളത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: זָנְתָה
  choice: വേശ്യാവൃത്തി നടത്തിയിരിക്കുന്നു
  rationale: זנה എന്ന പദത്തിലെ വേശ്യാവൃത്തി-രൂപകവും കുറ്റാരോപണത്തിന്റെ മൂർച്ചയും നിലനിർത്തുന്നു; പൊതുവായ ‘ലൈംഗിക അധാർമികത’ എന്നതിലേക്കു അർഥം വിശാലമാക്കുന്നില്ല.
- source_word: כַּלָּתֶךָ
  choice: നിന്റെ മരുമകൾ
  rationale: സന്ദർഭത്തിലെ സ്ത്രീബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ബന്ധപദം.
- source_word: וְגַם הִנֵּה
  choice: മാത്രമല്ല
  rationale: കുറ്റാരോപണത്തിലേക്കു ചേർക്കുന്ന ഊന്നലും ആശ്ചര്യകരമായ അധികവിവരവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הָרָה לִזְנוּנִים
  choice: വേശ്യാവൃത്തിയിലൂടെ അവൾ ഗർഭിണിയായിരിക്കുന്നു
  rationale: הָרָה എന്നതിന്റെ ‘ഗർഭിണി’ എന്ന അർഥവും לִזְנוּנִים എന്നതിന്റെ കാരണ/ഫലബന്ധവും, മുൻ ക്രിയയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: הוֹצִיאוּהָ
  choice: അവളെ പുറത്തുകൊണ്ടുവരൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അഭിസംബോധിതരുടെ ബഹുവചനം മലയാള ക്രിയാരൂപത്തിൽ പ്രത്യേകം അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: וְתִשָּׂרֵף
  choice: അവൾ ചുട്ടെരിക്കപ്പെടട്ടെ
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്പ്രയോകഭാവവും വിധിയുടെ കഠിനതയും സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ വിവർത്തനം അധികമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: നിയമപരമായ കുറ്റാരോപണത്തിൽ זנה/זנונים എന്ന ലൈംഗിക പദസമുച്ചയത്തിന്റെ അവതരണം
  choice: ‘വേശ്യാവൃത്തി നടത്തിയിരിക്കുന്നു / വേശ്യാവൃത്തിയിലൂടെ’ എന്ന ഒരേ പദകുടുംബം ഉപയോഗിക്കുക
  alternative: ‘ലൈംഗിക അധാർമികത ചെയ്തിരിക്കുന്നു / അധാർമികബന്ധത്തിലൂടെ’
  rationale: മൂലപാഠത്തിലെ ഒരേ പദമൂലത്തിൽനിന്നുള്ള ആവർത്തനവും വേശ്യാവൃത്തി സൂചിപ്പിക്കുന്ന കുറ്റാരോപണവും സംരക്ഷിക്കുന്നു; ആരോപണം ശരിവയ്ക്കുകയോ പൊതുവായ ധാർമിക വിഭാഗമാക്കി മയപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
- issue: യെഹൂദയുടെ വിധിയുടെ സ്വഭാവം
  choice: ‘അവളെ പുറത്തുകൊണ്ടുവരൂ; അവൾ ചുട്ടെരിക്കപ്പെടട്ടെ’ എന്ന വധശിക്ഷാ നിർദേശം
  alternative: ‘അവളെ പുറത്തുകൊണ്ടുവന്ന് ചുട്ടുകളയൂ’
  rationale: മൂലത്തിലെ അടിയന്തര ആജ്ഞയും ചുട്ടെരിക്കൽ എന്ന കഠിനവിധിയും നിലനിർത്തുമ്പോൾ, നിഫാൽ രൂപത്തിലെ നിഷ്പ്രയോകതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്ന പദത്തിന്റെ അക്ഷരാർത്ഥ പുനരാവർത്തനത്തിനു പകരം וְגַם הִנֵּה യുടെ ഊന്നൽ ‘മാത്രമല്ല’ എന്നതിലൂടെ നൽകി. കുറ്റാരോപണത്തിന്റെ ഭാഷ വിവർത്തകന്റെ സ്വന്തം നൈതിക വിധിയായി കേൾക്കാതിരിക്കാൻ നേരിട്ടുള്ള ഉദ്ധരണിക്കുള്ളിൽ നിലനിർത്തി.
