    issue: The final clause begins with “പിന്നീട്,” which can be read chiefly as a sequence-of-events marker.
    rationale: וְלֹא יָסַף עוֹד לְדַעְתָּהּ emphasizes that Judah did not again/any longer have sexual relations with Tamar. “പിന്നീടൊരിക്കലും” communicates the non-repetition more plainly while preserving the narrative sense.
  - severity: low
