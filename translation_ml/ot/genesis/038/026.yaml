source:
  edition: WLC
  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ അവയെ തിരിച്ചറിഞ്ഞു പറഞ്ഞു: “അവൾ എന്നെക്കാൾ നീതിയുള്ളവളാണ്[a]; കാരണം ഞാൻ അവളെ എന്റെ മകൻ ശേലായ്ക്കു കൊടുത്തില്ല.” അവൻ പിന്നീടൊരിക്കലും അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടില്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ എന്നെക്കാൾ ശരിയുടെ പക്ഷത്താണ്.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “അവളെ വീണ്ടും അറിഞ്ഞില്ല”; ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ശിഷ്ടോക്തിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: അവയെ തിരിച്ചറിഞ്ഞു
  rationale: മുൻവാക്യത്തിൽ കാണിച്ച പണയവസ്തുക്കളെയാണ് യെഹൂദാ തിരിച്ചറിഞ്ഞതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ, എബ്രായത്തിൽ പ്രകടമല്ലാത്ത ബഹുവചന കർമം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ചേർത്തു.
- source_word: צָדְקָה מִמֶּנִּי
  choice: അവളാണ് എന്നെക്കാൾ നീതിയുള്ളവൾ
  rationale: צדק എന്ന പദത്തിന്റെ ധാർമിക ഭാവവും מן സൂചിപ്പിക്കുന്ന താരതമ്യവും നിലനിർത്തുന്നു; ഇത് ഈ സംഭവത്തിലെ താരതമ്യവിധിയാണ്, സമ്പൂർണ പാപരാഹിത്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല.
- source_word: כִּי עַל כֵּן
  choice: കാരണം
  rationale: യെഹൂദായുടെ വിലയിരുത്തലിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന കാരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: ഞാൻ അവളെ എന്റെ മകൻ ശേലായ്ക്കു കൊടുത്തില്ല
  rationale: വിവാഹത്തിനായി കൊടുക്കുക എന്നത് കഥാസന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്ത രൂപം നിലനിർത്തി.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: പിന്നീട് അവൻ അവളുമായി വീണ്ടും ശാരീരികബന്ധത്തിലേർപ്പെട്ടില്ല
  rationale: ידע എന്ന എബ്രായ ശിഷ്ടോക്തിയുടെ ലൈംഗിക അർഥം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; יָסַף עוֹד സൂചിപ്പിക്കുന്ന ആവർത്തനമില്ലായ്മ ‘വീണ്ടും ... ഇല്ല’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: שֵׁלָה
  choice: ശേലാ
  rationale: വ്യക്തിനാമം മൂലരൂപത്തിന് സമീപമായ മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
theological_decisions:
- issue: യെഹൂദായുടെ ഏറ്റുപറച്ചിലിലെ ധാർമിക വിലയിരുത്തൽ
  choice: ഈ കാര്യത്തിൽ താമാർ തന്നേക്കാൾ നീതിയുള്ളവളാണെന്ന് യെഹൂദാ സമ്മതിക്കുന്നു.
  alternative: താമാറിന്റെ നടപടിക്രമം മാത്രമാണ് കൂടുതൽ ന്യായീകരിക്കപ്പെട്ടതെന്നോ അവൾ പൂർണമായും പാപരഹിതയാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: താരതമ്യപ്രയോഗം സാഹചര്യപരമാണ്. צדק എന്ന പദത്തിന്റെ യഥാർഥ ധാർമിക ശക്തി നിലനിർത്തിക്കൊണ്ട് അതിനെ സമ്പൂർണമായ ദൈവശാസ്ത്രവിധിയായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘നീതിയുള്ളവൾ’ മൂലപദത്തിന്റെ ധാർമിക ഭാരം നിലനിർത്തുന്നു; ലൈംഗികബന്ധത്തെക്കുറിച്ചുള്ള വാചകം അസ്പഷ്ടമായ അക്ഷരാനുവാദത്തിന് പകരം വ്യക്തവും ശിഷ്ടവുമായ രീതിയിൽ നൽകി.
