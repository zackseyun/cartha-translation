reference: Genesis 38:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨ט אֵלֶ֜י/הָ אֶל הַ/דֶּ֗רֶךְ וַ/יֹּ֨אמֶר֙ הָֽבָ/ה נָּא֙ אָב֣וֹא אֵלַ֔יִ/ךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖/וֹ הִ֑וא וַ/תֹּ֨אמֶר֙ מַה תִּתֶּן לִּ֔/י כִּ֥י תָב֖וֹא אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: ml
  text: 'അവൻ വഴിയരികിൽ അവളുടെ അടുക്കലേക്കു തിരിഞ്ഞുചെന്ന് പറഞ്ഞു: “ദയവായി, ഞാൻ നിന്റെ അടുക്കൽ വരട്ടെ.”[a] അവൾ തന്റെ മരുമകളാണെന്ന് അവൻ അറിഞ്ഞിരുന്നില്ല. അവൾ ചോദിച്ചു: “നീ എന്റെ അടുക്കൽ വരാൻ എനിക്ക് എന്തു തരും?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ അടുക്കൽ വരുക” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ശിഷ്ടോക്തിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: “നീ എനിക്ക് എന്തു പ്രതിഫലം തരും?” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പാഠം അക്ഷരാർഥത്തിൽ “എനിക്ക് എന്തു തരും?” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ
  choice: അവളുടെ അടുക്കലേക്കു തിരിഞ്ഞുചെന്ന്
  rationale: נטה ഇവിടെ സ്വന്തം വഴിയിൽനിന്ന് മാറി ഒരാളുടെ അടുത്തേക്കു ചെല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തിരിഞ്ഞുചെന്ന്’ ചലനവും ദിശാമാറ്റവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶל־הַדֶּרֶךְ
  choice: വഴിയരികിൽ
  rationale: താമാർ വഴിക്കരികിൽ ഇരിക്കുന്ന സന്ദർഭത്തിൽ, ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָבָה נָּא
  choice: ദയവായി, … വരട്ടെ
  rationale: അഭ്യർഥനയും പ്രേരണയും പ്രകടമാക്കുന്ന ഈ സംയുക്തപ്രയോഗം ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלַי
  choice: നിന്റെ/എന്റെ അടുക്കൽ വരുക
  rationale: സന്ദർഭത്തിൽ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ശിഷ്ടോക്തി നേരിട്ട് വിശദീകരിക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא
  choice: അവൾ തന്റെ മരുമകളാണെന്ന് അവൻ അറിഞ്ഞിരുന്നില്ല
  rationale: വിശദീകരണവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി, כַלָּה എന്ന ബന്ധപദം കൃത്യമായി ‘മരുമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַה תִּתֶּן לִּי
  choice: എനിക്ക് എന്തു തരും?
  rationale: സന്ദർഭത്തിൽ പ്രതിഫലം ഉദ്ദേശിക്കുന്നെങ്കിലും, മൂലപാഠത്തിലെ പൊതുവായ ‘കൊടുക്കുക’ എന്ന ക്രിയ സംരക്ഷിക്കുന്നു.
- source_word: כִּי תָבוֹא אֵלַי
  choice: നീ എന്റെ അടുക്കൽ വരേണ്ടതിന്
  rationale: כִּי ഇവിടെ ഇടപാടിന്റെ ഉദ്ദേശ്യമോ വ്യവസ്ഥയോ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശ്യബന്ധം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും കഥനസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളം. ലൈംഗിക അർഥമുള്ള ഹീബ്രായ ശിഷ്ടോക്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; അനാവശ്യമായ തുറന്ന പരാവർത്തനം ഒഴിവാക്കി.
