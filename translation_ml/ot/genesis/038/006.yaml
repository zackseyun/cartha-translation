  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֧ח יְהוּדָ֛ה אִשָּׁ֖ה לְ/עֵ֣ר בְּכוֹר֑/וֹ וּ/שְׁמָ֖/הּ תָּמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: ml
  text: യഹൂദാ തന്റെ ആദ്യജാതനായ ഏരിന് ഒരു ഭാര്യയെ എടുത്തു. അവളുടെ പേര് താമാർ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൊണ്ടുവന്നു
  rationale: לָקַח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക/കൊണ്ടുവരുക’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, മകനുവേണ്ടി ഭാര്യയെ കണ്ടെത്തിക്കൊണ്ടുവന്ന വിവാഹക്രമീകരണസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘വിവാഹം നിശ്ചയിച്ചു’ എന്നു പരാവർത്തനം ചെയ്ത് മൂലപാഠത്തേക്കാൾ വ്യക്തമാക്കുന്നില്ല.
- source_word: אִשָּׁה
  choice: ഭാര്യയായി ഒരു സ്ത്രീയെ
  rationale: אִשָּׁה എന്ന പദത്തിന്റെ ‘സ്ത്രീ’ എന്ന അടിസ്ഥാനാർഥവും ഈ സന്ദർഭത്തിലെ ‘ഭാര്യ’ എന്ന ബന്ധാർഥവും മലയാളത്തിൽ വ്യക്തമായി സംയോജിപ്പിക്കുന്നു.
- source_word: לְעֵר
  choice: ഏരിനു
  rationale: לְ ഉപസർഗം ഇവിടെ യഹൂദായുടെ പ്രവൃത്തിയുടെ ഗുണഭോക്താവോ സ്വീകരിക്കുന്നയാളോ ആയ ഏരിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכוֹרוֹ
  choice: തന്റെ ആദ്യജാതനായ
  rationale: ‘ആദ്യജാതൻ’ എന്നത് בְּכוֹר എന്ന പദത്തിന്റെ കുടുംബപരവും അവകാശപരവുമായ സൂചനകൾ സംരക്ഷിക്കുന്നു; ‘മൂത്ത മകൻ’ എന്ന ലളിതീകരണം ഒഴിവാക്കുന്നു.
- source_word: וּשְׁמָהּ
  choice: അവളുടെ പേര് … എന്നായിരുന്നു
  rationale: എബ്രായ നാമപരിചയ സൂത്രത്തെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תָּמָר
  choice: താമാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വിവാഹം യഹൂദാ ക്രമീകരിച്ചു എന്ന സന്ദർഭസൂചന പ്രകടമാക്കുന്നു; എന്നാൽ മൂലപാഠത്തിലില്ലാത്ത ആചാരപരമോ ദൈവശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർത്തിട്ടില്ല.
