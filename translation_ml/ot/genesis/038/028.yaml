  text: וַ/יְהִ֥י בְ/לִדְתָּ֖/הּ וַ/יִּתֶּן יָ֑ד וַ/תִּקַּ֣ח הַ/מְיַלֶּ֗דֶת וַ/תִּקְשֹׁ֨ר עַל יָד֤/וֹ שָׁנִי֙ לֵ/אמֹ֔ר זֶ֖ה יָצָ֥א רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: ml
  text: അവൾ പ്രസവിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഒരുവൻ ഒരു കൈ പുറത്തേക്കു നീട്ടി.[a] അപ്പോൾ പ്രസവസഹായിക ആ കൈയിൽ കടുംചുവപ്പുനൂൽ കെട്ടി, “ഇവനാണ് ആദ്യം പുറത്തുവന്നത്” എന്നു പറഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൻ ഒരു കൈ കൊടുത്തു”; പ്രസവത്തിനിടെ ശിശുവിന്റെ കൈ പുറത്തേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. “ഒരു കൈ പുറത്തുവന്നു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ഇരട്ടകളിൽ ആദ്യം പ്രത്യക്ഷപ്പെട്ടത് ആരെന്ന് പിന്നീട് തിരിച്ചറിയാനുള്ള ദൃശ്യമായ അടയാളമായിരുന്നു ഈ കടുംചുവപ്പുനൂൽ.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: അവൾ പ്രസവിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: בְּ + ילד എന്ന infinitive construct-ഉം 3fs പ്രത്യയവും പ്രസവം നടന്നുകൊണ്ടിരുന്ന സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം അതിന്റെ തുടർച്ചാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּתֶּן יָד
  choice: അവരിൽ ഒരാൾ ഒരു കൈ പുറത്തേക്കു നീട്ടി
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു കൈ കൊടുത്തു’ എന്നുള്ള എബ്രായ പ്രയോഗം പ്രസവത്തിനിടെ ശിശുവിന്റെ കൈ പുറത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇരട്ടകളിൽ ആരെന്നത് ഈ ഘട്ടത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘അവരിൽ ഒരാൾ’ എന്ന് നൽകി; കർത്താവുള്ള ക്രിയാരൂപവും നിലനിർത്തി.
- source_word: הַמְיַלֶּדֶת
  choice: സൂതികർമിണി
  rationale: പ്രസവത്തിൽ സഹായിക്കുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്ന പദത്തിന് മാന്യവും കൃത്യവുമായ സാധാരണ മലയാള ബൈബിൾ-സാഹിത്യ പദം.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: ആ കൈയിൽ ഒരു കടുംചുവപ്പുനൂൽ കെട്ടി
  rationale: שָׁנִי കടുംചുവപ്പ് നിറമുള്ള വസ്തുവിനെയോ നൂലിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിന് ആവശ്യമായ ‘നൂൽ’ സ്വാഭാവികമായി പൂരിപ്പിച്ചു; കൈമണിയെന്ന് അനാവശ്യമായി പ്രത്യേകീകരിച്ചില്ല.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: ഇവനാണ് ആദ്യം പുറത്തുവന്നത്
  rationale: പ്രദർശകസർവനാമവും יצא എന്ന ക്രിയയും ആദ്യം പുറത്തുവന്നതായി കരുതപ്പെട്ട ശിശുവിനെ തിരിച്ചറിയിക്കുന്നു. ‘ആദ്യജാതൻ’ എന്നു നൽകുന്നത് മൂലത്തിൽ ഇല്ലാത്ത നിയമപരമോ പദവിപരമോ ആയ ആശയം ചേർക്കുമെന്നതിനാൽ ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അവരിൽ ഒരാൾ’ എന്നത് ഇരട്ടകളിൽ ഏത് ശിശുവാണെന്ന മൂലപാഠത്തിലെ സന്ദർഭപരമായ അനിശ്ചിതത്വം കാത്തുസൂക്ഷിക്കുന്നു; ‘സൂതികർമിണി’ കൃത്യവും സംക്ഷിപ്തവുമായ പദമായി ഉപയോഗിച്ചു.
