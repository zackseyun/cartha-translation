revisions:
- from: യെഹൂദയുടെ ആദ്യജാതനായ ഏർ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു; അതിനാൽ യഹ്‌വെ അവനെ മരണത്തിന് ഏല്പിച്ചു.[a]
  to: യെഹൂദയുടെ ആദ്യജാതനായ ഏർ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു; യഹ്‌വെ അവനെ മരിപ്പിച്ചു.[a]
  rationale: The revision replaces an idiom that can suggest handing Er over to death with a direct causative verb corresponding to the Hebrew Hiphil. It also removes the added inferential connector while retaining the narrative coordination and the text’s unsoftened attribution of agency to Yahweh.
