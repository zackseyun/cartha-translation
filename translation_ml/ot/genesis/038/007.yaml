  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: ml
  text: യെഹൂദയുടെ ആദ്യജാതനായ ഏർ യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ ദുഷ്ടനായിരുന്നു; യഹ്‌വെ അവനെ മരിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “യഹ്‌വെ അവൻ മരിക്കാനിടയാക്കി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ/പിന്നെ’ ചേർക്കാതെ സ്വാഭാവികമായ ഭൂതകാല ക്രിയ മതിയാകുന്നു.
- source_word: עֵר
  choice: ഏർ
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּכוֹר יְהוּדָה
  choice: യെഹൂദയുടെ ആദ്യജാതനായ
  rationale: ജനനക്രമവും പുത്രബന്ധവും സൂചിപ്പിക്കുന്ന construct ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: רַע
  choice: ദുഷ്ടൻ
  rationale: ഇവിടെ പദം മോശം ഗുണനിലവാരമല്ല, യഹ്‌വെയുടെ മുമ്പിലുള്ള ധാർമിക ദുഷ്ടതയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְמִתֵהוּ
  choice: അവനെ മരണത്തിന് ഏല്പിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവവും യഹ്‌വെയുടെ നേരിട്ടുള്ള പ്രവർത്തനവും ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കൂടുതൽ ഔപചാരികമായ കാരകവിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: ഏറിന്റെ മരണത്തിലുള്ള ദൈവിക പ്രവർത്തനം
  choice: യഹ്‌വെ അവനെ മരണത്തിന് ഏല്പിച്ചു
  alternative: യഹ്‌വെ അവൻ മരിക്കാനിടയാക്കി
  rationale: ഹിഫീൽ രൂപം മരണത്തെ യഹ്‌വെയുടെ കാരകപ്രവർത്തനമായി തുറന്നുപറയുന്നു. മാർഗമോ കൂടുതൽ ദൈവശാസ്ത്രപരമായ വിശദീകരണമോ പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവിക ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മരണപ്രയോഗത്തിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
