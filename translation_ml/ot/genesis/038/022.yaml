- from: 'അങ്ങനെ അവൻ യെഹൂദയുടെ അടുക്കൽ മടങ്ങിവന്ന് പറഞ്ഞു: “ഞാൻ അവളെ കണ്ടില്ല. മാത്രമല്ല, ‘ഇവിടെ ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യ[a] ഉണ്ടായിരുന്നിട്ടില്ല’ എന്ന് ആ സ്ഥലത്തെ പുരുഷന്മാരും പറഞ്ഞു.”'
  to: 'അങ്ങനെ അവൻ യെഹൂദയുടെ അടുക്കൽ മടങ്ങിവന്ന് പറഞ്ഞു: “ഞാൻ അവളെ കണ്ടില്ല; കൂടാതെ, ആ സ്ഥലത്തെ പുരുഷന്മാർ, ‘ഇവിടെ ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യ[a] ഇല്ലായിരുന്നു’ എന്നും പറഞ്ഞു.”'
  rationale: ലളിതമായ ഭൂതകാല അസ്തിത്വനിഷേധം പുനഃസ്ഥാപിക്കുകയും, റിപ്പോർട്ടിനകത്തെ ഉദ്ധരണി സ്വാഭാവിക മലയാളക്രമത്തിൽ പുനഃസംഘടിപ്പിക്കുകയും ചെയ്തു. കേദേശായെക്കുറിച്ചുള്ള അടിക്കുറിപ്പിൽ പാഠം ഉറപ്പിക്കാത്ത ചരിത്രപരമായ/മൂല്യനിർണയപരമായ അവകാശവാദം ഒഴിവാക്കി, പദത്തിന്റെ ആരാധനാചാരബന്ധവും സാധ്യമായ ബദൽ പരിഭാഷയും മാത്രം നിലനിർത്തി.
