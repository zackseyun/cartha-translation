source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ אֶל יְהוּדָ֔ה וַ/יֹּ֖אמֶר לֹ֣א מְצָאתִ֑י/הָ וְ/גַ֨ם אַנְשֵׁ֤י הַ/מָּקוֹם֙ אָֽמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ യെഹൂദയുടെ അടുക്കൽ മടങ്ങിവന്ന് പറഞ്ഞു: “ഞാൻ അവളെ കണ്ടില്ല; കൂടാതെ, ആ സ്ഥലത്തെ പുരുഷന്മാർ, ‘ഇവിടെ ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യ[a] ഇല്ലായിരുന്നു’ എന്നും പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ‘കേദേശാ’; സാധാരണ വേശ്യയെ സൂചിപ്പിക്കുന്ന പദത്തിൽനിന്ന് വ്യത്യസ്തമായി, ആരാധനാചാരബന്ധം സൂചിപ്പിക്കുന്ന സ്ത്രീയെക്കുറിച്ചുള്ള പദം. ‘ദേവാലയവേശ്യ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: അങ്ങനെ അവൻ ... മടങ്ങിവന്ന്
  rationale: വയ്യക്ഷോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകുന്നു.
- source_word: אֶל־יְהוּדָה
  choice: യെഹൂദയുടെ അടുക്കൽ
  rationale: אֶל ദിശയെയോ സമീപനത്തെയോ സൂചിപ്പിക്കുന്നു; വ്യക്തിയായ യെഹൂദയുടെ സമീപത്തേക്കുള്ള മടങ്ങിവരവ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא מְצָאתִיהָ
  choice: ഞാൻ അവളെ കണ്ടില്ല
  rationale: നിഷേധത്തോടുകൂടിയ പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തിയെ നേരായും അധിക ഭാവാർഥം ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: וְגַם
  choice: മാത്രമല്ല
  rationale: ആദ്യ റിപ്പോർട്ടിനോടു രണ്ടാമത്തെ പിന്തുണയ്ക്കുന്ന വിവരം കൂട്ടിച്ചേർക്കുന്ന പദത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: ആ സ്ഥലത്തെ പുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും പ്രദേശവാസികളായ പുരുഷന്മാരെയാണ് ചോദിച്ചതെന്ന സന്ദർഭം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לֹא הָיְתָה בָזֶה
  choice: ഇവിടെ ... ഉണ്ടായിരുന്നിട്ടില്ല
  rationale: ആ സ്ഥലത്ത് അത്തരമൊരു സ്ത്രീ ഉണ്ടായിരുന്നതിനെ നിഷേധിക്കുന്ന അസ്തിത്വപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: קְדֵשָׁה
  choice: ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യ
  rationale: കേദേശാ എന്ന പദത്തിലെ മതാചാരബന്ധം നിലനിർത്തുന്നു; ‘ദേവാലയവേശ്യ’ എന്നു പറഞ്ഞ് ഒരു ഔപചാരിക ദേവാലയസ്ഥാപനത്തെ അനാവശ്യമായി മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
theological_decisions:
- issue: קְדֵשָׁה എന്ന പദത്തിന്റെ മതാചാരപരമായ അർഥം
  choice: ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യ
  alternative: ദേവാലയവേശ്യ; സമർപ്പിതസ്ത്രീ
  rationale: സന്ദർഭത്തിൽ സാധാരണ വേശ്യയെ സൂചിപ്പിക്കുന്ന זֹנָה എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കണം. അതേസമയം, പദം സൂചിപ്പിക്കുന്ന സ്ഥാപനത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം ഉറപ്പിച്ചു പറയാതിരിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വേശ്യ’ എന്ന നേരായ പദം സന്ദർഭത്തിലെ ലൈംഗികവും സാമൂഹികവുമായ അർഥം മറച്ചുവയ്ക്കാതെ നൽകുന്നു; മതാചാരബന്ധം വിശദീകരണപദസമുച്ചയത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
