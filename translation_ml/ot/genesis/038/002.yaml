  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: ml
  text: അവിടെ യെഹൂദാ ശൂവ എന്നു പേരുള്ള ഒരു കനാന്യനായ മനുഷ്യന്റെ മകളെ കണ്ടു.[a] അവൻ അവളെ എടുത്ത് അവളുടെ അടുക്കൽ ചെന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ, “അവന്റെ പേര് ശൂവ എന്നായിരുന്നു.” ഇവിടെ പേര് കനാന്യനായ മനുഷ്യന്റേതാണ്, മകളുടേതല്ല.
    reason: lexical_alternative
  - marker: b
    text: “അവളുടെ അടുക്കൽ ചെന്നു” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ആഖ്യാനസന്ദർഭത്തിലുള്ള അർഥം ‘കണ്ടു’ എന്നാണ്; ‘കണ്ടുമുട്ടി’ എന്നത് മൂലപാഠത്തിലില്ലാത്ത ആശയം ചേർക്കും.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലസൂചകമായ שָׁם എന്നതിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: ഒരു കനാന്യപുരുഷന്റെ മകളെ
  rationale: ‘ഒരു പുരുഷന്റെ മകൾ—ഒരു കനാന്യന്റെ’ എന്ന എബ്രായ ഘടനയുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: ശൂവ എന്നു പേരുള്ള
  rationale: പേര് മകൾക്കല്ല, കനാന്യപുരുഷനാണ് എന്ന എബ്രായ പുരുഷലിംഗ സർവനാമസൂചനയോട് ചേർന്ന് നിൽക്കുന്നു; അടിക്കുറിപ്പ് ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקָּחֶהָ
  choice: അവളെ സ്വീകരിച്ച്
  rationale: לקח എന്നത് അക്ഷരാർഥത്തിൽ ‘എടുത്തു’ എന്നാണെങ്കിലും സ്ത്രീയെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ വിവാഹബന്ധത്തിലേക്ക് സ്വീകരിക്കുന്ന ആശയം സൂചിപ്പിക്കാം. ‘വിവാഹം കഴിച്ചു’ എന്നു പൂർണമായി വ്യക്തമാക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ ആ സൂചന നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെന്നു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ രൂപകാത്മക ഭാഷ നിലനിർത്തുന്നു; അതിന്റെ ലൈംഗികബന്ധസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: וַיִּקָּחֶהָ എന്നതിൽ വിവാഹം വ്യക്തമായി പ്രസ്താവിച്ചിട്ടുണ്ടോ
  choice: ‘അവളെ സ്വീകരിച്ച്’ എന്ന മിതമായ പ്രയോഗം
  alternative: ‘അവളെ വിവാഹം കഴിച്ച്’ / ‘അവളെ എടുത്ത്’
  rationale: സ്ത്രീയെ ‘എടുക്കുക’ എന്നത് വിവാഹത്തെ സൂചിപ്പിക്കാമെങ്കിലും ക്രിയയിൽ മാത്രം വിവാഹം പൂർണമായി തുറന്നുപറയുന്നില്ല; അതിനാൽ അർഥസൂചനയും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ഒരുപോലെ കാത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കനാന്യപുരുഷൻ’, ‘അവളുടെ അടുക്കൽ ചെന്നു’ എന്നിവ മൂലപാഠത്തിന്റെ ഘടനയും പരോക്ഷപ്രയോഗവും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
