  to: 'താമാറിനോടു ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, നിന്റെ അമ്മായിയപ്പൻ തന്റെ ആടുകളുടെ[a] രോമം കത്രിക്കാൻ തിമ്നായിലേക്കു കയറിപ്പോകുന്നു.”'
