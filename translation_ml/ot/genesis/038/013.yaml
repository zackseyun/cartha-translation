id: GEN.38.13
reference: Genesis 38:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֥ד לְ/תָמָ֖ר לֵ/אמֹ֑ר הִנֵּ֥ה חָמִ֛י/ךְ עֹלֶ֥ה תִמְנָ֖תָ/ה לָ/גֹ֥ז צֹאנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: ml
  text: 'താമാറിനോടു ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, നിന്റെ അമ്മായിയപ്പൻ തന്റെ ആടുകളുടെ[a] രോമം കത്രിക്കാൻ തിമ്നായിലേക്കു കയറിപ്പോകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ ആട്ടിൻകൂട്ടത്തിന്റെ രോമം കത്രിക്കാൻ.”
    reason: צֹאן can refer collectively to a flock, while the main text appropriately uses ‘sheep’ in this shearing context.
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: താമാറിനോട് ഇങ്ങനെ അറിയിച്ചു
  rationale: നגד എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലുള്ള നിഷ്ക്രിയവും വാർത്ത അറിയിക്കുന്നതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെയുള്ള പ്രയോഗമായി നൽകി; לְתָמָר വാർത്ത സ്വീകരിക്കുന്നയാളായ താമാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ അറിയിച്ചു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ ‘ഇങ്ങനെ’ എന്നും ഉദ്ധരണിക്കുമുമ്പുള്ള വിരാമചിഹ്നംകൊണ്ടും സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദർശകാവ്യയത്തിന്റെ പ്രയോഗശക്തി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָמִיךְ
  choice: നിന്റെ അമ്മായിയപ്പൻ
  rationale: സ്ത്രീലിംഗ ഏകവചന അഭിസംബോധനയോടുകൂടിയ ബന്ധുത്വപദം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עֹלֶה
  choice: കയറിപ്പോകുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ അല്ലെങ്കിൽ ഉടൻ നടക്കാനിരിക്കുന്ന സഞ്ചാരവും עלה എന്നതിലെ മുകളിലേക്കുള്ള ദിശാസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: תִמְנָתָה
  choice: തിമ്നയിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה സ്വാഭാവിക മലയാളത്തിൽ ലക്ഷ്യസ്ഥാന വിഭക്തിയാൽ വിവർത്തനം ചെയ്തു.
- source_word: לָגֹז צֹאנוֹ
  choice: തന്റെ ആടുകളുടെ രോമം കത്രിക്കാൻ
  rationale: ל ചേർന്ന ക്രിയാനാമത്തിന്റെ ഉദ്ദേശ്യാർഥവും, രോമം കത്രിക്കുന്ന സന്ദർഭത്തിൽ צאן എന്നതിന്റെ സ്വാഭാവികമായ ‘ആടുകൾ’ എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ നിഷ്ക്രിയ വാർത്താവതരണത്തെ കർത്താവിനെ ചേർക്കാതെ അവതരിപ്പിച്ചു; ‘കയറിപ്പോകുന്നു’ എന്നത് യാത്രയുടെ ദിശാസൂചന സംരക്ഷിക്കുന്നു.
