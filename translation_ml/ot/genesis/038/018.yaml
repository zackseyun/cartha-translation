  text: וַ/יֹּ֗אמֶר מָ֣ה הָֽ/עֵרָבוֹן֮ אֲשֶׁ֣ר אֶתֶּן לָּ/ךְ֒ וַ/תֹּ֗אמֶר חֹתָֽמְ/ךָ֙ וּ/פְתִילֶ֔/ךָ וּ/מַטְּ/ךָ֖ אֲשֶׁ֣ר בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן לָּ֛/הּ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/תַּ֥הַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “ഞാൻ നിനക്കു എന്തു പണയമാണു തരേണ്ടത്?” അവൾ പറഞ്ഞു: “നിന്റെ മുദ്രയും[a] ചരടും നിന്റെ കൈയിലുള്ള വടിയും.” അവൻ അവ അവൾക്കു കൊടുത്തു; പിന്നെ അവളുടെ അടുക്കൽ ചെന്നു.[b] അവൾ അവനാൽ ഗർഭം ധരിച്ചു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അടയാളമുദ്ര.’ അത് മുദ്രമോതിരമായിരുന്നുവെന്ന് എബ്രായപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘അവളുടെ അടുക്കൽ ചെന്നു’ എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മര്യാദാപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവൾ അവനിൽനിന്ന് ഗർഭിണിയായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: പണയം
  rationale: പിന്നീട് നൽകേണ്ട പ്രതിഫലം ലഭിക്കുന്നതുവരെ ഉറപ്പായി കൈമാറുന്ന വസ്തുവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘പണയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: חֹתָמְךָ
  choice: നിന്റെ മുദ്ര
  rationale: തിരിച്ചറിയലിനായി ഉപയോഗിച്ച മുദ്രയിടുന്ന ഉപകരണത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. അതു മോതിരമായിരുന്നുവെന്ന് എബ്രായപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘മുദ്രമോതിരം’ എന്ന് അതിവ്യക്തമാക്കിയില്ല.
- source_word: וּפְתִילֶךָ
  choice: ചരടും
  rationale: മുദ്രയോടു ബന്ധപ്പെട്ടു ഉപയോഗിച്ചിരിക്കാവുന്ന ചരടാണിത്; എന്നാൽ ആ ബന്ധം പാഠത്തിൽ തുറന്നുപറയാത്തതിനാൽ ലളിതമായ ‘ചരട്’ നിലനിർത്തി.
- source_word: וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: നിന്റെ കൈയിലുള്ള വടിയും
  rationale: ബന്ധവാക്യം വടിയെയാണ് വിശേഷിപ്പിക്കുന്നത്. മൂലപാഠത്തിലെ ദൃശ്യമായ ‘കൈയിൽ’ എന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֶּן לָּהּ
  choice: അവൻ അവ അവൾക്കു കൊടുത്തു
  rationale: ക്രിയയിൽ പ്രത്യക്ഷ സർവനാമകർമമില്ലെങ്കിലും മുമ്പ് ആവശ്യപ്പെട്ട മൂന്ന് വസ്തുക്കളെയും മലയാളത്തിൽ ‘അവ’ എന്നു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെന്നു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മര്യാദാപ്രയോഗം അതിന്റെ കഥനഗൗരവവും പരോക്ഷതയും നിലനിർത്തി പരിഭാഷപ്പെടുത്തി.
- source_word: וַתַּהַר לוֹ
  choice: അവൾ അവനാൽ ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയയുടെ ‘ഗർഭം ധരിക്കുക’ എന്ന അർഥവും לֹו സൂചിപ്പിക്കുന്ന പിതൃത്വബന്ധവും ഔപചാരികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: לֹו എന്നതിന്റെ ബന്ധസൂചന
  choice: അവനാൽ ഗർഭം ധരിച്ചു
  alternative: അവനിൽനിന്ന് ഗർഭിണിയായി
  rationale: ഇത് യെഹൂദയാണ് ഗർഭധാരണത്തിന് കാരണമായത് എന്നു വ്യക്തമാക്കുന്നു; ‘അവനുവേണ്ടി’ എന്ന ലക്ഷ്യാർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ മര്യാദാപ്രയോഗം തുറന്ന ലൈംഗിക പദപ്രയോഗമാക്കി മാറ്റാതെ നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
