source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: ml
  text: 'അവൻ അവൾ ഉണ്ടായിരുന്ന സ്ഥലത്തെ ആളുകളോടു ചോദിച്ചു: “വഴിയരികിൽ ഏനായീമിൽ[b] ഉണ്ടായിരുന്ന ആ ആരാധനാചാരബന്ധമുള്ള വേശ്യ[a] എവിടെയാണ്?” അവർ പറഞ്ഞു: “ഇവിടെ ആരാധനാചാരബന്ധമുള്ള ഒരു വേശ്യയും ഉണ്ടായിരുന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്ഷേത്രവേശ്യ.” എബ്രായപദം ആരാധനാചാരവുമായി ബന്ധപ്പെട്ട ഒരു വേശ്യയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ ഒരു പ്രത്യേക ക്ഷേത്രകെട്ടിടത്തെക്കുറിച്ച് പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഏനായീം ഒരു സ്ഥലനാമമാണ്; എബ്രായരൂപം “കണ്ണുകൾ” എന്ന പദത്തോടോ, ഒരുപക്ഷേ “ഉറവുകൾ” എന്ന ആശയത്തോടോ ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: ചോദിച്ചു
  rationale: ശׁאל എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവും.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: അവളുടെ സ്ഥലത്തെ ആളുകളോട്
  rationale: ‘അവളുടെ സ്ഥലം’ എന്ന 3-ാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സംരക്ഷിക്കുന്നു; אַנְשֵׁי എന്നത് പുരുഷന്മാരെ സൂചിപ്പിക്കാമെങ്കിലും മലയാളത്തിൽ സ്ഥലവാസികളെ സ്വാഭാവികമായി ‘ആളുകൾ’ എന്നു പറയാം.
- source_word: לֵאמֹר
  choice: 'ചോദിച്ചു:'
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ കൊളോൺ ഉപയോഗിച്ച് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: אַיֵּה
  choice: എവിടെ?
  rationale: സ്ഥാനം അന്വേഷിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ലളിതമായ മലയാളരൂപം.
- source_word: הַקְּדֵשָׁה / קְדֵשָׁה
  choice: ആചാരപരമായ വേശ്യ
  rationale: קְדֵשָׁה എന്ന പദത്തെ സാധാരണ זֹנָהയിൽനിന്ന് വേർതിരിക്കുകയും ആരാധനാ/മതാചാരബന്ധം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; പ്രത്യേക ക്ഷേത്രകെട്ടിടം ഉണ്ടായിരുന്നുവെന്ന് അനാവശ്യമായി നിർദ്ദേശിക്കുന്നില്ല.
- source_word: בָעֵינַיִם
  choice: ഏനയീമിൽ
  rationale: സന്ദർഭത്തിൽ ഇത് സ്ഥലനാമമാണ് (ഉല്പത്തി 38:14); അക്ഷരാർഥമായ ‘കണ്ണുകൾ’ അല്ലെങ്കിൽ ‘ഉറവുകൾ’ എന്നു വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל הַדָּרֶךְ
  choice: വഴിയരികിൽ
  rationale: റോഡിനോടു ചേർന്നുള്ള സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: ഇവിടെ അങ്ങനെയൊരു വേശ്യ ഉണ്ടായിരുന്നിട്ടില്ല
  rationale: ആ സ്ഥലത്ത് അത്തരമൊരു സ്ത്രീ ഉണ്ടായിരുന്നതിനെ നാട്ടുകാർ നിഷേധിക്കുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘അങ്ങനെയൊരു’ മുൻപത്തെ പ്രത്യേക പദത്തെ തിരികെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: קְדֵשָׁה എന്ന പദത്തിന്റെ ആരാധനാചാരബന്ധം
  choice: ആചാരപരമായ വേശ്യ
  alternative: ക്ഷേത്രവേശ്യ; വേശ്യ
  rationale: പദത്തിന്റെ സാധാരണ വേശ്യയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു; എന്നാൽ ഒരു പ്രത്യേക ക്ഷേത്രസ്ഥാപനമോ പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക മതസംവിധാനമോ ഉറപ്പിച്ചുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ ‘അവളുടെ സ്ഥലം’ എന്ന അസാധാരണമായ ബന്ധസൂചന സംരക്ഷിച്ചിരിക്കുന്നു. സ്ഥലനാമം ‘ഏനയീം’ എന്നു ലിപ്യന്തരിച്ചു.
