id: GEN.38.10
reference: Genesis 38:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: ml
  text: അവൻ ചെയ്തതു യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു; അതുകൊണ്ട് യഹ്‌വെ അവനെയും മരിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: തിന്മയായിരുന്നു
  rationale: רעע എന്ന ധാതുവിന്റെ നൈതിക വിലയിരുത്തൽ മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതു
  rationale: മുൻവാക്യത്തിലെ ഓനാന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം ലളിതമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּמֶת
  choice: മരണത്തിന് ഏല്പിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥവും ദൈവിക കർത്തൃത്വവും ഗൗരവമുള്ള ഭാഷയിൽ പ്രകടമാക്കുന്നു.
- source_word: גַּם אֹתוֹ
  choice: അവനെയും
  rationale: മുമ്പ് ഏരിനു സംഭവിച്ച വിധി ഓനാനും സംഭവിച്ചു എന്ന ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം നേരിട്ട് സംരക്ഷിക്കുന്നു; ഒരു സ്ഥാനപ്പേരോ മതവിഭാഗപരമായ പ്രത്യേക രൂപമോ നിർബന്ധിക്കുന്നില്ല.
- issue: וַיָּמֶת എന്നതിലെ ദൈവിക ന്യായവിധി
  choice: അതുകൊണ്ട് അവനെയും അവിടുന്ന് മരണത്തിന് ഏല്പിച്ചു
  alternative: അവനെയും കൊന്നു; അവനെയും മരിപ്പിച്ചു
  rationale: മരണത്തിന് ദൈവം നേരിട്ടു കാരണനായെന്ന ഹിഫീൽ ക്രിയയുടെ അർത്ഥം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ അനാവശ്യമായി പരുഷമാകാതെയും അർത്ഥം മൃദൂകരിക്കാതെയും അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. യഹ്‌വെയെ വീണ്ടും സർവനാമത്തിലൂടെ പരാമർശിക്കുമ്പോൾ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
