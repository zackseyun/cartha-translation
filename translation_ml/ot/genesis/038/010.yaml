revisions:
- from: അവൻ ചെയ്തതു യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു; അതുകൊണ്ട് അവനെയും അവിടുന്ന് മരണത്തിന് ഏല്പിച്ചു.
  to: അവൻ ചെയ്തതു യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മയായിരുന്നു; അതുകൊണ്ട് യഹ്‌വെ അവനെയും മരിപ്പിച്ചു.
  rationale: The revision retains the draft's faithful rendering of the divine name, the divine-evaluation idiom, and the connective sense of גַּם ('also'). It replaces the semantically indirect 'മരണത്തിന് ഏല്പിച്ചു' with 'മരിപ്പിച്ചു,' which directly conveys the Hebrew causative and Yahweh's stated agency.
