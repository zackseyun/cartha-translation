- from: അവൾ വീണ്ടും ഒരു മകനെ പ്രസവിച്ചു; അവന് ശേലാ എന്നു പേരിട്ടു. അവൾ അവനെ പ്രസവിച്ചപ്പോൾ അവൻ കെസീബിലായിരുന്നു.[a]
