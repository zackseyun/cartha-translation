source:
  edition: WLC
  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: ml
  text: അവൾ വീണ്ടും ഒരു മകനെ പ്രസവിച്ചു. അവന് ശേലാ എന്നു പേരിട്ടു. അവൾ അവനെ പ്രസവിച്ചപ്പോൾ അവൻ കെസീബിലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ ‘അവൻ’ എന്നാണ്; ഈ കർത്താവിന്റെ സൂചന അനിശ്ചിതമാണ്. ചില പുരാതന പാഠസാക്ഷികളും വ്യാഖ്യാതാക്കളും ഇങ്ങനെ വായിക്കുന്നു: ‘അവൾ അവനെ പ്രസവിച്ചപ്പോൾ അവൾ കെസീബിലായിരുന്നു.’ ‘കെസീബ്’ ചില ഭാഗങ്ങളിൽ ‘കെസീബ്/കേസീബ്’ എന്ന അക്ഷരവിന്യാസത്തിലും കാണപ്പെടുന്നു; രണ്ടും ഒരേ സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: അവൾ വീണ്ടും ഒരു മകനെ പ്രസവിച്ചു
  rationale: יסף + עוד ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീണ്ടും ... പ്രസവിച്ചു’ എന്നത് സന്ദർഭത്തിലെ ആവർത്തനം സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കുന്നു; ഗർഭധാരണത്തെ പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: അവന് ശേലാ എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന വാക്കുതോറ്റ വിവർത്തനത്തേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ നാമകരണപ്രയോഗമാണിത്; ശേലാ എന്ന വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהָיָה
  choice: അവൻ ... ആയിരുന്നു
  rationale: മസൊററ്റിക് എബ്രായപാഠത്തിലെ ക്രിയാരൂപം മൂന്നാം പുരുഷൻ പുല്ലിംഗ ഏകവചനമാണ്. അതിനാൽ പ്രധാനപാഠത്തിൽ പുല്ലിംഗ കർത്താവിനെ നിലനിർത്തുന്നു; കർത്താവിനെക്കുറിച്ചുള്ള യഥാർഥ സംശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִכְזִיב
  choice: കെസീബിൽ
  rationale: כְזִיב എന്ന സ്ഥലനാമത്തെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; സ്ഥലസൂചനയ്ക്ക് ‘-ഇൽ’ സ്വാഭാവികമാണ്.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: അവൾ അവനെ പ്രസവിച്ചപ്പോൾ
  rationale: בְ + infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു. ‘പ്രസവിച്ചപ്പോൾ’ എന്നത് അർഥവും സ്ത്രീലിംഗ പ്രത്യയവും പുരുഷലിംഗ കർമവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְהָיָה എന്നതിന്റെ കർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ’
  alternative: ‘അവൾ കെസീബിലായിരുന്നു’
  rationale: WLC/MT-യിലെ രൂപം പുല്ലിംഗ ഏകവചനമായതിനാൽ ‘അവൻ’ എന്നത് ഔപചാരികമായി ഏറ്റവും അടുത്ത വിവർത്തനമാണ്. എന്നാൽ ചില പുരാതന സാക്ഷ്യങ്ങളും വ്യാഖ്യാനപരമ്പരകളും സ്ത്രീലിംഗ കർത്താവിനെ മനസ്സിലാക്കുന്നതിനാൽ ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ പുല്ലിംഗ കർത്താവിനെ പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ സംശയാസ്പദമായ സൂചന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്തു. ‘കെസീബ്’ എന്ന സ്ഥലനാമത്തിന് ഇവിടെ പ്രത്യേക അക്ഷരവിന്യാസ-അടിക്കുറിപ്പ് ആവശ്യമില്ല; പ്രധാന പാഠസംബന്ധമായ കർത്തൃഭേദമാണ് നിർണായകം.
