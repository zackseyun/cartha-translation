source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֵּ֥רֶד יְהוּדָ֖ה מֵ/אֵ֣ת אֶחָ֑י/ו וַ/יֵּ֛ט עַד אִ֥ישׁ עֲדֻלָּמִ֖י וּ/שְׁמ֥/וֹ חִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: ml
  text: ആ കാലത്ത്[a] യെഹൂദാ തന്റെ സഹോദരന്മാരെ വിട്ട് താഴേക്കു പോയി, ഹീരാ എന്നു പേരുള്ള ഒരു അദുല്ലാമ്യന്റെ[b] അടുക്കലേക്കു വഴിതിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ആ കാലത്ത് അങ്ങനെ സംഭവിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അദുല്ലാമ്യനായ ഒരു മനുഷ്യൻ’; എബ്രായപ്രയോഗം അയാളെ ദേശബന്ധംകൊണ്ട് മാത്രം തിരിച്ചറിയിക്കുന്നതാകാം, എന്നാൽ ഒരു പ്രത്യേക വ്യക്തിയെ പരിചയപ്പെടുത്തുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: ആ കാലത്ത്
  rationale: പുതിയ സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; וַיְהִי എന്നതിന്റെ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּרֶד
  choice: താഴേക്കു പോയി
  rationale: ירד എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക ആഖ്യാനപ്രയോഗം.
- source_word: מֵאֵת אֶחָיו
  choice: തന്റെ സഹോദരന്മാരെ വിട്ട്
  rationale: യെഹൂദാ സഹോദരന്മാരിൽനിന്നു വേർപെട്ടുപോയെന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֵּט עַד
  choice: അടുക്കലേക്കു തിരിഞ്ഞു
  rationale: נטה എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘തിരിഞ്ഞുപോകുക’ എന്ന അർഥവും עַד സൂചിപ്പിക്കുന്ന ഒരാളിലേക്കുള്ള നീക്കവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: ഒരു അദുല്ലാമ്യൻ
  rationale: ആ വ്യക്തിയെ അവന്റെ ദേശബന്ധംകൊണ്ട് പരിചയപ്പെടുത്തുന്നു; אִישׁ എന്നത് മലയാളത്തിൽ പ്രത്യേകം ‘മനുഷ്യൻ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. പ്രത്യേക വ്യക്തിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּשְׁמוֹ חִירָה
  choice: ഹീരാ എന്നു പേരുള്ള
  rationale: എബ്രായ നാമകരണവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി മുൻവിവരണത്തോട് ബന്ധിപ്പിക്കുന്നു.
- source_word: חִירָה
  choice: ഹീരാ
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
