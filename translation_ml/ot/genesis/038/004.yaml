  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: ml
  text: അവൾ വീണ്ടും ഗർഭം ധരിച്ചു ഒരു മകനെ പ്രസവിച്ചു; അവന് ഓനാൻ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: അവൾ ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയ ഗർഭം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഗർഭം ധരിച്ചു’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: തുടർച്ചയായ ജനനങ്ങളുടെ ഈ സന്ദർഭത്തിൽ עוֹד ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീണ്ടും’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയത്.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד + בֵּן എന്നത് ഒരു മകനെ പ്രസവിക്കുന്നതിനുള്ള സാധാരണ എബ്രായ പ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഒരു മകനെ പ്രസവിച്ചു’ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: അവന് … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന് … എന്നു പേരിട്ടു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: אוֹנָן
  choice: ഓനാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ക്രിയാശൃംഖലയുടെ സംഭവക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാകാൻ അവസാന രണ്ടു ഘടകങ്ങൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
