translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ കഥാക്രമം, ഏജൻസിയുടെ പ്രയോഗം, ‘സ്ത്രീയുടെ കൈയിൽനിന്ന്’ എന്ന മൂർത്തമായ ഭാഷ എന്നിവ സംരക്ഷിച്ചുകൊണ്ട് അനാവശ്യമായ പഴമൊഴിനട ഒഴിവാക്കി.
