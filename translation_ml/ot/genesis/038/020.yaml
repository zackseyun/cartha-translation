  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദാ തന്റെ അദുല്ലാമ്യനായ സുഹൃത്ത് മുഖാന്തരം കോലാട്ടിൻകുട്ടിയെ അയച്ചു[a], സ്ത്രീയുടെ കൈയിൽനിന്ന് പണയവസ്തു വീണ്ടെടുക്കാനായി[b][c]; എന്നാൽ അവൻ അവളെ കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥം: ‘തന്റെ അദുല്ലാമ്യനായ സുഹൃത്തിന്റെ കൈയാൽ’; ഇവിടെ അതിന്റെ അർഥം ‘അവന്റെ മുഖാന്തരം’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഈടുവസ്തു വീണ്ടെടുക്കാനായി.’'
    reason: lexical_alternative
  - marker: c
    text: 'ഹീബ്രു: ‘സ്ത്രീയുടെ കൈയിൽനിന്ന്’; അതായത് അവളുടെ കൈവശത്തുനിന്ന്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: גְּדִי הָעִזִּים
  choice: കോലാട്ടിൻകുട്ടി
  rationale: പ്രയോഗം ഒരു ചെറുപ്പമായ ആടിനെ, പ്രത്യേകിച്ച് കോലാട്ടിൻകുട്ടിയെ, സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ മുമ്പ് വാഗ്ദാനം ചെയ്ത മൃഗവും ഇതുതന്നെ.
- source_word: בְּיַד
  choice: മുഖാന്തരം
  rationale: അക്ഷരാർഥം ‘കൈയാൽ/കൈയിൽ’ എന്നാണെങ്കിലും ഇവിടെ വ്യക്തിയുടെ ഏജൻസിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണ്; ‘മുഖാന്തരം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: רֵעֵהוּ
  choice: തന്റെ ... സുഹൃത്ത്
  rationale: സാമൂഹിക കൂട്ടാളിയെയോ സഹചാരിയെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘സുഹൃത്ത്’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും സ്വാഭാവികം.
- source_word: הָעֲדֻלָּמִי
  choice: അദുല്ലാമ്യൻ
  rationale: അദുല്ലാമിൽ നിന്നുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗ/ദേശബന്ധ നാമം.
- source_word: לָקַחַת
  choice: തിരികെ വാങ്ങാനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തരൂപം; സുരക്ഷയായി വിട്ട വസ്തു വീണ്ടെടുക്കുന്നതാണ് സന്ദർഭം, അതിനാൽ ‘തിരികെ വാങ്ങുക’ ഉദ്ദേശ്യത്തെ വ്യക്തമാക്കുന്നു.
- source_word: הָעֵרָבוֹן
  choice: പണയം
  rationale: ഉറപ്പോ സുരക്ഷയോ ആയി ഏല്പിച്ച വസ്തുവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘പണയം’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִיַּד הָאִשָּׁה
  choice: സ്ത്രീയുടെ കൈയിൽനിന്ന്
  rationale: ഹീബ്രുവിലെ മൂർത്തമായ ‘സ്ത്രീയുടെ കൈയിൽനിന്ന്’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ കൈവശം/ഉടമസ്ഥതയിൽനിന്ന് എന്ന ആശയവും വ്യക്തമാണ്.
- source_word: וְלֹא מְצָאָהּ
  choice: എന്നാൽ അവൻ അവളെ കണ്ടില്ല
  rationale: ദൗത്യത്തിന്റെ പ്രതീക്ഷിച്ച ഫലവും പരാജയവും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘അവളെ’ എന്ന് നിലനിർത്തുന്നു.
