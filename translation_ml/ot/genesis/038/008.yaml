revisions:
- from: 'അപ്പോൾ യെഹൂദാ ഓനാനോടു പറഞ്ഞു: “നിന്റെ സഹോദരന്റെ ഭാര്യയുടെ അടുക്കൽ ചെല്ലുക; അവളോടുള്ള ഭർതൃസഹോദരന്റെ കടമ നിറവേറ്റി നിന്റെ സഹോദരനുവേണ്ടി സന്തതിയെ നിലനിർത്തുക.”'
  to: 'അപ്പോൾ യെഹൂദാ ഓനാനോടു പറഞ്ഞു: “നിന്റെ സഹോദരന്റെ ഭാര്യയുടെ അടുക്കൽ ചെല്ലുക; അവളോടു ഭർത്തൃസഹോദരധർമ്മം നിർവഹിക്കുക[a]; നിന്റെ സഹോദരനുവേണ്ടി സന്തതി ഉണ്ടാക്കുക.”'
  rationale: The revision replaces a potentially misleading ‘preserve offspring’ formulation with wording that explicitly conveys producing offspring, and it uses a more natural Malayalam designation for the technical brother-in-law duty. The euphemistic wording for sexual intercourse and the source’s restrained register are retained.
