id: GEN.38.8
reference: Genesis 38:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ ഓനാനോടു പറഞ്ഞു: “നിന്റെ സഹോദരന്റെ ഭാര്യയുടെ അടുക്കൽ ചെല്ലുക; അവളോടു ഭർത്തൃസഹോദരധർമ്മം നിർവഹിക്കുക[a]; നിന്റെ സഹോദരനുവേണ്ടി സന്തതി ഉണ്ടാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മരിച്ചുപോയ സഹോദരന്റെ പേരിൽ സന്തതി ഉണ്ടാകേണ്ടതിനായി അവന്റെ ഭാര്യയോടുള്ള ഭർത്തൃസഹോദരന്റെ കടമ നിർവഹിക്കുക.
    reason: יַבֵּם എന്ന സാങ്കേതിക ക്രിയയുടെ കുടുംബ-നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: בֹּא אֶל
  choice: അടുക്കൽ ചെല്ലുക
  rationale: വിവാഹസന്ദർഭത്തിലെ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരോക്ഷത നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֵשֶׁת אָחִיךָ
  choice: നിന്റെ സഹോദരന്റെ ഭാര്യ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְיַבֵּם אֹתָהּ
  choice: അവളോടുള്ള ഭർതൃസഹോദരന്റെ കടമ നിറവേറ്റുക
  rationale: יִבֵּם എന്ന സാങ്കേതിക പദത്തിലെ കുടുംബപരവും നിയമപരവുമായ ബാധ്യത വ്യക്തമാക്കുന്നു; അപരിചിതമായ സാങ്കേതികപദം ഒഴിവാക്കുന്നു.
- source_word: וְהָקֵם זֶרַע
  choice: സന്തതിയെ നിലനിർത്തുക
  rationale: മരിച്ച സഹോദരന്റെ വംശപരമ്പര തുടരുക എന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിത്ത്’ എന്ന അക്ഷരാർഥം ഇവിടെ അസ്പഷ്ടമാകും.
- source_word: לְאָחִיךָ
  choice: നിന്റെ സഹോദരനുവേണ്ടി
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ പ്രയോജന/പ്രാതിനിധ്യഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭർതൃസഹോദരവിവാഹവുമായി ബന്ധപ്പെട്ട സാങ്കേതിക പദം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അവളോടുള്ള ഭർതൃസഹോദരന്റെ കടമ നിറവേറ്റുക
  alternative: അവളെ ഭർതൃസഹോദരധർമ്മപ്രകാരം സ്വീകരിക്കുക
  rationale: മൂലപദം വിവാഹമോ ലൈംഗികബന്ധമോ മാത്രം സൂചിപ്പിക്കുന്നില്ല; മരിച്ച സഹോദരനുവേണ്ടി സന്തതി നിലനിർത്താനുള്ള കുടുംബബാധ്യതയും ഉൾക്കൊള്ളുന്നു. തെരഞ്ഞെടുത്ത രൂപം പിന്നീടുള്ള നിയമവ്യവസ്ഥകളെ അനാവശ്യമായി ഇവിടെ ഇറക്കിവയ്ക്കാതെ ആ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അടുക്കൽ ചെല്ലുക’ എന്ന പരോക്ഷപ്രയോഗം മൂലഭാഷയിലെ ശൈലിസൗമ്യത നിലനിർത്തുന്നു. സാങ്കേതികമായ ‘ലെവിറേറ്റ്’ എന്ന കടംപദം ഒഴിവാക്കി അർഥം വാചകത്തിനുള്ളിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
