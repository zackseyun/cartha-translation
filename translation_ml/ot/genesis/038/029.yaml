source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מֵשִׁ֣יב יָד֗/וֹ וְ/הִנֵּה֙ יָצָ֣א אָחִ֔י/ו וַ/תֹּ֕אמֶר מַה פָּרַ֖צְתָּ עָלֶ֣י/ךָ פָּ֑רֶץ וַ/יִּקְרָ֥א שְׁמ֖/וֹ פָּֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: ml
  text: 'അവൻ കൈ പിന്നോട്ടു വലിച്ചപ്പോൾ, ഇതാ, അവന്റെ സഹോദരൻ പുറത്തുവന്നു. അപ്പോൾ അവൾ പറഞ്ഞു: “നീ നിനക്കായി എന്തൊരു പിളർപ്പാണ് ഉണ്ടാക്കിയത്!”[a] അതുകൊണ്ട് അവന് പേരെസ് എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിളർപ്പ്’ എന്ന പദവും ‘പേരെസ്’ എന്ന പേരും ഒരേ ഹീബ്രു ധാതുവായ פרץ (പ-ര-ത്സ) യുമായി ബന്ധപ്പെട്ടവയാണ്. വാചകം അക്ഷരാർഥത്തിൽ ഏകദേശം, ‘നിനക്കായി എന്തൊരു പിളർപ്പാണ് നീ പിളർത്തിയത്!’ എന്നാണ്; ഇവിടെ ‘നിനക്കായി’ എന്നു പരിഭാഷപ്പെടുത്തിയ പ്രയോഗത്തിന്റെ കൃത്യമായ ഭാവം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: അവൻ കൈ പിന്നോട്ടു വലിച്ചപ്പോൾ
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും ‘കൈ’ എന്ന നാമവും ചേർന്ന പ്രയോഗം കൈ പിൻവലിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ജനനസന്ദർഭത്തിൽ ‘പിന്നോട്ടു വലിച്ചു’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ഹിന്നേ എന്ന ശ്രദ്ധാകർഷകപദം സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വവും ആഖ്യാനത്തിന്റെ സജീവതയും പ്രകടമാക്കുന്നു.
- source_word: יָצָא אָחִיו
  choice: അവന്റെ സഹോദരൻ പുറത്തുവന്നു
  rationale: ജനനസന്ദർഭത്തിലെ יצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: നീ നിനക്കായി എന്തൊരു പിളർപ്പാണ് ഉണ്ടാക്കിയത്!
  rationale: פרץ എന്ന ധാതുവിന്റെ ആവർത്തനവും പേരെസ് എന്ന പേരുമായുള്ള പദവിനോദവും കഴിയുന്നത്ര നിലനിർത്താൻ ‘പിളർപ്പ്’ ഉപയോഗിച്ചു. עָלֶיךָ എന്ന ദുഷ്കരമായ പ്രയോഗത്തെ ‘നിനക്കായി’ എന്നു തുറന്നുവെക്കുന്നു; അതിന്റെ കൃത്യമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: פָּרֶץ
  choice: പേരെസ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അതിന്റെ അർഥബന്ധം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: അതുകൊണ്ട് അവന് പേരെസ് എന്നു പേരായി
  rationale: ഹീബ്രു ക്രിയ ഏകവചന പുൽലിംഗത്തിലാണെങ്കിലും പേരിട്ട വ്യക്തി ആരെന്ന് സന്ദർഭം വ്യക്തമായി പറയുന്നില്ല. സ്വാഭാവികമായ നിർവ്യക്ത നാമകരണപ്രയോഗം ഉപയോഗിച്ച് അനാവശ്യമായി ഒരു കർത്താവിനെ ചേർക്കുന്നത് ഒഴിവാക്കി.
theological_decisions:
- issue: പേരിട്ട വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: നിർവ്യക്തമായ ‘അവന് ... എന്നു പേരായി’
  alternative: ‘അവൻ അവന് പേരെസ് എന്നു പേരിട്ടു’
  rationale: മസോററ്റിക് പാഠത്തിലെ ക്രിയ പുൽലിംഗ ഏകവചനമാണെങ്കിലും മുൻവാക്യത്തിലെ പ്രസംഗകർത്താവ് സ്ത്രീയാണ്; കർത്താവിനെ പാഠം വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ ഈ അനിശ്ചിതത്വം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്നത് ഹീബ്രു ആഖ്യാനത്തിലെ അപ്രതീക്ഷിതത്വം നിലനിർത്തുന്നു. മുഖ്യവാചകത്തിൽ പദവിനോദം ഭാഗികമായി സംരക്ഷിക്കുകയും അതിന്റെ ഹീബ്രു അടിസ്ഥാനം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു.
