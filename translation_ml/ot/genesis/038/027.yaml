  text: וַ/יְהִ֖י בְּ/עֵ֣ת לִדְתָּ֑/הּ וְ/הִנֵּ֥ה תְאוֹמִ֖ים בְּ/בִטְנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/027.yaml
  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: ml
  text: അവൾക്കു പ്രസവിക്കാനുള്ള സമയമായപ്പോൾ, ഇതാ, അവളുടെ ഗർഭത്തിൽ ഇരട്ടക്കുട്ടികൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാള കാലവാക്യത്തിലൂടെ അറിയിക്കുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത വ്യക്തമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: בְּעֵת
  choice: സമയമായപ്പോൾ
  rationale: בְּ എന്ന ഉപസർഗത്തോടുകൂടിയ עֵת പ്രസവത്തിന്റെ സമയസന്ദർഭം സൂചിപ്പിക്കുന്നു; ‘സമയമായപ്പോൾ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִדְתָּהּ
  choice: അവൾക്കു പ്രസവിക്കാനുള്ള
  rationale: ילד എന്ന ധാതുവിന്റെ infinitive construct-ഉം മൂന്നാം പുരുഷ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയവും ചേർന്ന് ‘അവൾ പ്രസവിക്കാനുള്ള’ എന്ന അർഥം നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധേയവും അപ്രതീക്ഷിതവുമായ വിവരം വായനക്കാരന്റെ ശ്രദ്ധയിൽ കൊണ്ടുവരുന്ന הִנֵּהയുടെ വ്യവഹാരശക്തി ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: תְאוֹמִים
  choice: ഇരട്ടക്കുട്ടികൾ
  rationale: പദം നേരിട്ട് ഇരട്ടകളെ സൂചിപ്പിക്കുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ ‘ഇരട്ടക്കുട്ടികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּבִטְנָהּ
  choice: അവളുടെ ഗർഭത്തിൽ
  rationale: בֶּטֶן എന്നതിന് വയർ എന്നും ഗർഭം എന്നും അർഥമുണ്ടാകാം; പ്രസവസന്ദർഭത്തിൽ ‘ഗർഭത്തിൽ’ ആണ് കൃത്യവും സ്വാഭാവികവും.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ നിലനിർത്തി ഹീബ്രു വാക്യത്തിലെ ശ്രദ്ധാകർഷണവും അപ്രതീക്ഷിതത്വവും സംരക്ഷിച്ചു.
