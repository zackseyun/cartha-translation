  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: ml
  text: നാളുകൾ ഏറെയായപ്പോൾ[a], യെഹൂദയുടെ ഭാര്യയായ ശൂവയുടെ മകൾ[b] മരിച്ചു. യെഹൂദയ്ക്ക് ആശ്വാസം ലഭിച്ചശേഷം[c], അവൻ തന്റെ ആട്ടിൻകൂട്ടത്തെ കത്രിക്കുന്നവരുടെ അടുക്കലേക്കു തിമ്നയിലേക്കു കയറിപ്പോയി; അവനും അവന്റെ സുഹൃത്തായ അദുല്ലാമ്യൻ ഹീരയും കൂടെയുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വളരെക്കാലത്തിനുശേഷം.’ അക്ഷരാർഥം: ‘ദിവസങ്ങൾ പെരുകി.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ശൂവയുടെ മകൾ’; ചിലർ ഇത് ‘ബത്ത്-ശൂവ’ എന്ന വ്യക്തിനാമമായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: 'അഥവാ: ‘യെഹൂദയ്ക്ക് ആശ്വാസം ലഭിച്ചപ്പോൾ’ / ‘യെഹൂദയ്ക്ക് ആശ്വാസം ലഭിച്ചു.’ ഇവിടെ എബ്രായ ക്രിയ ദുഃഖാചരണത്തിനുശേഷം ആശ്വസിപ്പിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
