  rationale: സഹയാത്രയുടെ ആശയം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നൽകുകയും ഹീരയുടെ ബന്ധവും സ്വദേശപരമായ വിശേഷണവും നിലനിർത്തുകയും ചെയ്യുന്നു.
