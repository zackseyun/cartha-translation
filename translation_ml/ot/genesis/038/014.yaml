revisions:
- from: അപ്പോൾ അവൾ വിധവാവസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി, ഒരു മൂടുപടംകൊണ്ട് തന്നെ മൂടിപ്പൊതിഞ്ഞ്, തിമ്നയിലേക്കുള്ള വഴിയരികിലെ ഏനയീമിന്റെ കവാടത്തിൽ ഇരുന്നു. കാരണം ശേലാ വളർന്നിട്ടും തന്നെ അവന് ഭാര്യയായി നൽകിയിട്ടില്ലെന്ന് അവൾ കണ്ടു.
  to: അപ്പോൾ അവൾ തന്റെ വിധവാവസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി, മൂടുപടം ധരിച്ച് അതിൽ സ്വയം പൊതിഞ്ഞ്, തിമ്നയിലേക്കുള്ള വഴിയിലുള്ള ഏനായീമിന്റെ പ്രവേശനസ്ഥലത്ത് ഇരുന്നു. ശേലാ വളർന്നിരിക്കുന്നതും, എന്നിട്ടും തന്നെ അവന് ഭാര്യയായി നൽകിയിട്ടില്ലാത്തതും അവൾ കണ്ടു.
  rationale: സ്ഥലവിവരണത്തിൽ മൂലത്തേക്കാൾ സങ്കുചിതമായ ‘വഴിയരികിൽ’ ഒഴിവാക്കി, פֶּתַח-നെ ‘പ്രവേശനസ്ഥലം’ എന്നു വിവർത്തനം ചെയ്തു. മൂടുപടം ധരിക്കലും അതിൽ സ്വയം പൊതിയലും വേർതിരിച്ചു വ്യക്തമാക്കി. അവസാനവാക്യത്തിൽ ‘എന്നിട്ടും’ ചേർത്ത് כִּי-യുടെ ആവർത്തനവും വിരുദ്ധഭാവവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു; നൽകപ്പെട്ടത് ആരാൽ എന്നത് കർമണിപ്രയോഗത്തിലൂടെ തുറന്നതായിത്തന്നെ സൂക്ഷിച്ചു.
