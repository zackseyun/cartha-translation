source:
  edition: WLC
  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: ml
  text: അപ്പോൾ അവൾ തന്റെ വിധവാവസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി, മൂടുപടം ധരിച്ച് അതിൽ സ്വയം പൊതിഞ്ഞ്, തിമ്നയിലേക്കുള്ള വഴിയിലുള്ള ഏനായീമിന്റെ പ്രവേശനസ്ഥലത്ത് ഇരുന്നു. ശേലാ വളർന്നിരിക്കുന്നതും, എന്നിട്ടും തന്നെ അവന് ഭാര്യയായി നൽകിയിട്ടില്ലാത്തതും അവൾ കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: അവൾ വിധവാവസ്ത്രങ്ങൾ
  rationale: ‘അവളുടെ വിധവത്വത്തിന്റെ വസ്ത്രങ്ങൾ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം; വിധവയായ നില സൂചിപ്പിക്കുന്ന പ്രത്യേക വസ്ത്രധാരണം നിലനിർത്തുന്നു.
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: ഒരു മൂടുപടംകൊണ്ട് തന്നെ മൂടിപ്പൊതിഞ്ഞ്
  rationale: രണ്ട് ക്രിയകളായ ‘മൂടി’, ‘പൊതിഞ്ഞു/മറച്ചു’ എന്നിവയുടെ ചേർന്ന ഊന്നൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: בְּפֶתַח עֵינַיִם
  choice: ഏനയീമിന്റെ കവാടത്തിൽ
  rationale: עֵינַיִם ഇവിടെ സ്ഥലനാമമായി വായിക്കുന്ന മസോരറ്റിക് പാഠവും സന്ദർഭവും പിന്തുടരുന്നു; פֶּתַח എന്നതിന് ‘കവാടം/പ്രവേശനം’ എന്ന അർഥം നൽകുന്നു.
- source_word: תִּמְנָתָה
  choice: തിമ്നയിലേക്കുള്ള
  rationale: ദിശാസൂചകമായ -ה ഘടകത്തെ ‘യിലേക്കുള്ള’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: גָדַל שֵׁלָה
  choice: ശേലാ വളർന്നിട്ടും
  rationale: ശേലാ വിവാഹപ്രായത്തിലെത്തിയെന്ന സന്ദർഭസൂചന വ്യാഖ്യാനമായി ചേർക്കാതെ, മൂലത്തിലെ ‘വളർന്നു’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: താമാറിന്റെ ഉദ്ദേശ്യവും വേഷധാരണത്തിന്റെ അർഥവും
  choice: അവളുടെ പ്രവൃത്തികൾ മാത്രം വിവരിച്ചു; ഈ വാക്യത്തിൽ അവളെ ‘വേശ്യയായി വേഷംമാറി’ എന്ന് നിർവചിച്ചില്ല
  alternative: ‘വേശ്യയുടെ വേഷം ധരിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക വിവർത്തനം
  rationale: മൂലവാക്യം വിധവാവസ്ത്രം മാറ്റി മൂടുപടം ധരിച്ചതാണ് നേരിട്ട് പറയുന്നത്; അവളുടെ സാമൂഹിക തിരിച്ചറിവിനെക്കുറിച്ചുള്ള തുടർകഥയിലെ ധാരണ ഈ വാക്യത്തിലേക്ക് മുൻകൂട്ടി ഇറക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ശേലയെ നൽകാതിരുന്നതിലെ ഉത്തരവാദിത്വം
  choice: ‘തന്നെ അവന് ഭാര്യയായി നൽകിയിട്ടില്ല’ എന്ന കർമണിപ്രയോഗം
  alternative: ‘യെഹൂദാ അവളെ ശേലായ്ക്ക് നൽകിയില്ല’
  rationale: ഹീബ്രായ പാഠം കർമണിപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്; ഉത്തരവാദിയെ ഇവിടെ നേരിട്ട് പേരെടുത്തു പറയാതെ അതേ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ‘ഏനയീം’, ‘തിമ്ന’, വ്യക്തിനാമം ‘ശേലാ’ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. ഹീബ്രായത്തിലെ ആവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ ‘മൂടിപ്പൊതിഞ്ഞ്’ ഉപയോഗിച്ചു.
