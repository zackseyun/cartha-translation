translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വാക്യക്രമം ഹീബ്രുവിലെ സംഭവക്രമവും കാരണബന്ധവും നിലനിർത്തുന്നു; ‘വേശ്യ’ എന്നത് മൂലപദത്തിന്റെ അർഥം അനാവശ്യമായ ആധുനിക ആശയങ്ങൾ ചേർക്കാതെ നൽകുന്നു.
