source:
  edition: WLC
  text: וַ/יִּרְאֶ֣/הָ יְהוּדָ֔ה וַֽ/יַּחְשְׁבֶ֖/הָ לְ/זוֹנָ֑ה כִּ֥י כִסְּתָ֖ה פָּנֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: ml
  text: യൂദാ അവളെ കണ്ടപ്പോൾ, അവൾ മുഖം മൂടിയിരുന്നതിനാൽ അവളെ ഒരു വേശ്യയായി കരുതി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ ഒരു വേശ്യയാണെന്ന് വിചാരിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: യൂദാ അവളെ കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുള്ള മാനസിക നിഗമനത്തോടുള്ള കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחְשְׁבֶהָ
  choice: അവളെ … ആയി കരുതി
  rationale: חשב ഇവിടെ താമാറിന്റെ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള യൂദായുടെ തെറ്റായ മാനസിക നിഗമനത്തെ സൂചിപ്പിക്കുന്നു; ‘കരുതി’ ആ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְזוֹנָה
  choice: ഒരു വേശ്യയായി
  rationale: זוֹנָה എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും പൊതുവായി മനസ്സിലാക്കാവുന്നതുമായ പ്രയോഗമാണിത്; പുരാതനമോ ആധുനിക സാമൂഹികശാസ്ത്രപരമോ ആയ അധിക സൂചനകൾ ചേർക്കുന്നില്ല.
- source_word: כִּי
  choice: …ഇരുന്നതിനാൽ
  rationale: כִּי ഇവിടെ യൂദായുടെ നിഗമനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ കാരണസൂചകമായ ‘ഇരുന്നതിനാൽ’ ഈ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: അവൾ മുഖം മൂടിയിരുന്നതിനാൽ
  rationale: כסה എന്നത് ‘മൂടുക’ എന്നും פניה എന്നത് ‘അവളുടെ മുഖം’ എന്നും അർഥമാക്കുന്നു. മൂടിയ പ്രവൃത്തി യൂദാ കാണുന്നതിനു മുമ്പുള്ള പശ്ചാത്തലസാഹചര്യമാണെന്നത് ‘മൂടിയിരുന്നതിനാൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
