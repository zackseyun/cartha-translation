  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: ml
  text: അവൾ ഗർഭം ധരിച്ച് ഒരു മകനെ പ്രസവിച്ചു; അവൻ[a] അവന് ഏർ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായത്തിൽ ‘അവൻ അവന്റെ പേര് ഏർ എന്നു വിളിച്ചു’ എന്നാണ്; ക്രിയ പുരുഷലിംഗ ഏകവചനമാണ്. സന്ദർഭത്തിൽ കർത്താവ് യെഹൂദയായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: അവൾ ഗർഭം ധരിച്ചു
  rationale: הרה ഗർഭം ധരിക്കുക, ഗർഭിണിയാകുക എന്നർഥം നൽകുന്നു. ആഖ്യാനത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ് ‘ഗർഭം ധരിച്ചു’.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയ പ്രസവിക്കുക എന്നും בֵּן മകൻ എന്നും അർഥമാക്കുന്നു. മലയാളത്തിൽ ഈ സംയോജനം സ്വാഭാവികമായി കുടുംബബന്ധവും സംഭവവും വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: അവൻ അവന് … എന്നു പേരിട്ടു
  rationale: ക്രിയ പുരുഷലിംഗ ഏകവചനമായതിനാൽ കർത്താവിലെ വ്യാകരണപരമായ മാറ്റം ‘അവൻ’ എന്നു നിലനിർത്തുന്നു. ‘പേരിട്ടു’ എന്നത് ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: עֵר
  choice: ഏർ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സംക്ഷിപ്തമായി പകർത്തുന്നു.
theological_decisions:
- issue: וַיִּקְרָא (‘പേരിട്ടു’) എന്ന ക്രിയയുടെ കർത്താവ്
  choice: പുരുഷലിംഗ ഏകവചനത്തെ പിന്തുടർന്ന് ‘അവൻ’ എന്നു വിവർത്തനം ചെയ്തു; സന്ദർഭത്തിൽ ഇത് യെഹൂദയെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
  alternative: ചില വിവർത്തനങ്ങൾ ‘അവൾ പേരിട്ടു’ എന്നു സമന്വയിപ്പിക്കുകയോ ‘അവന് ഏർ എന്നു പേരായി’ എന്ന കർമണിപ്രയോഗത്തിലൂടെ കർത്താവിനെ വ്യക്തമാക്കാതിരിക്കുകയോ ചെയ്യുന്നു.
  rationale: മുൻപുള്ള ‘അവൾ ഗർഭം ധരിച്ചു’, ‘പ്രസവിച്ചു’ എന്നീ സ്ത്രീലിംഗ ക്രിയകളിൽനിന്ന് ഇവിടെ ഹീബ്രായ ക്രിയ വ്യക്തമായി പുരുഷലിംഗത്തിലേക്ക് മാറുന്നു. ആ വ്യാകരണപരമായ മാറ്റം പരിഹരിച്ചുകളയാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. ഹീബ്രായത്തിലെ ലിംഗമാറ്റം ‘അവൻ’ എന്ന പദത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; എന്നാൽ ‘പേര് വിളിച്ചു’ എന്ന പദാനുപദരൂപത്തിനു പകരം സ്വാഭാവിക മലയാളമായ ‘പേരിട്ടു’ ഉപയോഗിച്ചു.
