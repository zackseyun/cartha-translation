  verdict: revise
  source_fidelity: നിയമപരമായ അർഥത്തിൽ זרע ‘സന്തതി’ എന്നും അവസാനത്തെ ഉദ്ദേശ്യവാക്യത്തിലും അതേ അർഥം എന്നും നൽകിയിരിക്കുന്നത് ഹീബ്രു പാഠത്തോട് യോജിക്കുന്നു. ആവർത്തിതമായ ഭൂതകാലപ്രവൃത്തിയും ഉദ്ദേശ്യവാക്യവും നിലനിൽക്കുന്നു. എന്നാൽ ‘ബന്ധപ്പെടുക’ മാത്രം ലൈംഗികസൂചനയെ ആവശ്യത്തിന് വ്യക്തമാക്കുന്നില്ല; ‘നിലത്തു കളഞ്ഞുകളയുക’ എന്നത് ശൈലീപരമായി അസ്വാഭാവികമാണ്.
  naturalness: ‘തനിക്കുള്ളവനായി ആ സന്തതി’ എന്ന പ്രയോഗത്തിൽ ലിംഗ/സൂചനാപരമായ അസ്വാഭാവികതയുണ്ട്. ‘ആ സന്തതി തനിക്കുള്ളതാകുകയില്ല’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്. ‘നിലത്തുവെച്ച് പാഴാക്കുമായിരുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘സന്തതി’ കുടുംബ-അവകാശ പശ്ചാത്തലത്തിന് യോജിച്ചിരിക്കുന്നു. ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക’ മൂലപാഠത്തിലെ യൂഫെമിസത്തേക്കാൾ അനാവശ്യമായി ക്രൂരമാകാതെ അർഥം വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പിൽ ‘സഹോദരവിവാഹം’ എന്ന ആശയക്കുഴപ്പമുണ്ടാക്കാവുന്ന പ്രയോഗത്തിനു പകരം മരിച്ച സഹോദരന്റെ വംശം തുടരാനുള്ള വിവാഹക്രമം എന്നു വിശദീകരിച്ചിരിക്കുന്നു.
