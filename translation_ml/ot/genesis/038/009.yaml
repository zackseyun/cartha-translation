  to: എന്നാൽ ആ സന്തതി തനിക്കുള്ളതാകുകയില്ലെന്ന് ഓനാൻ അറിഞ്ഞിരുന്നു[a]. അതുകൊണ്ട്, സഹോദരന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുമ്പോഴെല്ലാം, സഹോദരന് സന്തതി നൽകാതിരിക്കാനായി അവൻ അത് നിലത്തുവെച്ച് പാഴാക്കുമായിരുന്നു[b].
