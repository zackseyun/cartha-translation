id: GEN.38.9
reference: Genesis 38:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: ml
  text: എന്നാൽ ആ സന്തതി തനിക്കുള്ളതാകുകയില്ലെന്ന് ഓനാൻ അറിഞ്ഞിരുന്നു[a]. അതുകൊണ്ട്, സഹോദരന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുമ്പോഴെല്ലാം, സഹോദരന് സന്തതി നൽകാതിരിക്കാനായി അവൻ അത് നിലത്തുവെച്ച് പാഴാക്കുമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ പദശഃ ‘വിത്ത്’; ഇവിടെ മരിച്ച സഹോദരന്റെ വംശം തുടരാനുള്ള വിവാഹക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ സന്തതി അഥവാ അവകാശിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ ‘അത് നിലത്തേക്ക് നശിപ്പിച്ചു/പാഴാക്കി.’ ഗർഭധാരണം തടയാൻ ഓനാൻ ചെയ്ത പ്രവൃത്തിയെയാണ് ഈ പ്രയോഗം വിവരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: അറിഞ്ഞിരുന്നു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ ידע എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הַזָּרַע
  choice: ആ സന്തതി
  rationale: പദശഃ ‘വിത്ത്’ എന്നാണെങ്കിലും, ഇവിടെ മരിച്ച സഹോദരനുവേണ്ടി ജനിക്കേണ്ട സന്തതി അഥവാ അവകാശിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: തനിക്കുള്ളവനായി ആ സന്തതി കണക്കാക്കപ്പെടുകയില്ല
  rationale: സന്തതി ഓനാന്റേതായി കണക്കാക്കപ്പെടാതെ മരിച്ച സഹോദരന്റേതായി കണക്കാക്കപ്പെടുമെന്ന കുടുംബനിയമപരമായ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה אִם־בָּא
  choice: ബന്ധപ്പെടുമ്പോഴെല്ലാം
  rationale: ഹീബ്രു ഘടന സൂചിപ്പിക്കുന്ന പതിവായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: സഹോദരന്റെ ഭാര്യയുമായി ബന്ധപ്പെടുക
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അശ്ലീലമാകാതെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְשִׁחֵת אַרְצָה
  choice: അത് നിലത്തു കളഞ്ഞുകളയുമായിരുന്നു
  rationale: שחת എന്നതിലെ ‘നശിപ്പിക്കുക/പാഴാക്കുക’ എന്ന ആശയവും ഗർഭധാരണം തടയുന്ന പ്രവൃത്തിയും നിലനിർത്തുന്നു; ഹീബ്രുവിൽ വ്യക്തമാക്കാത്ത വസ്തുവിനെ മുഖ്യവാചകത്തിൽ അതിയായി വിശദീകരിക്കുന്നില്ല.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: സഹോദരന് സന്തതി നൽകാതിരിക്കാനായി
  rationale: ഉദ്ദേശ്യവാക്യം കൃത്യമായി നൽകുകയും זרע എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ സന്തതി എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ זרע എന്ന പദത്തിന്റെ അർഥവും ഓനാന്റെ പ്രവൃത്തിയുടെ സ്വഭാവവും
  choice: നിയമപരവും കുടുംബപരവുമായ ഭാഗങ്ങളിൽ ‘സന്തതി’ എന്നു വിവർത്തനം ചെയ്തു; ഗർഭധാരണം തടഞ്ഞ ശാരീരിക പ്രവൃത്തിയെ ‘അത് നിലത്തു കളഞ്ഞുകളഞ്ഞു’ എന്നു നൽകി.
  alternative: എല്ലായിടത്തും ‘വിത്ത്’ എന്നു നൽകുക, അല്ലെങ്കിൽ ‘ശുക്ലം നിലത്തു സ്ഖലിപ്പിച്ചു’ എന്ന് കൂടുതൽ വ്യക്തമായി പറയുക.
  rationale: വാക്യം മരിച്ച സഹോദരന് കണക്കാക്കപ്പെടേണ്ട സന്തതിയെയും അതിനെ തടയാനുള്ള ഓനാന്റെ പ്രവൃത്തിയെയും ബന്ധിപ്പിക്കുന്നു. ഈ വിവർത്തനം ആ ബന്ധം വ്യക്തമാക്കുമ്പോഴും മൂലപാഠത്തേക്കാൾ അധികമായ ധാർമികമോ സിദ്ധാന്തപരമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ലൈംഗികപ്രയോഗം അശ്ലീലമാകാതെ തുറന്ന അർഥം നൽകുന്നു; ‘സന്തതി കണക്കാക്കപ്പെടുക’ എന്ന രൂപം കുടുംബനിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
