  to: പിന്നെ അവൾ എഴുന്നേറ്റ് അവിടെനിന്ന് പോയി; തന്റെ മൂടുപടം നീക്കി, തന്റെ വിധവാവസ്ത്രങ്ങൾ ധരിച്ചു.
