translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ഹീബ്രു ക്രിയാക്രമം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി അക്ഷരാർഥപരമായ ആവർത്തനം ഒഴിവാക്കി.
