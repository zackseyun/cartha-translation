id: GEN.38.19
reference: Genesis 38:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֣קָם וַ/תֵּ֔לֶךְ וַ/תָּ֥סַר צְעִיפָ֖/הּ מֵ/עָלֶ֑י/הָ וַ/תִּלְבַּ֖שׁ בִּגְדֵ֥י אַלְמְנוּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: ml
  text: പിന്നെ അവൾ എഴുന്നേറ്റ് അവിടെനിന്ന് പോയി; തന്റെ മൂടുപടം നീക്കി, തന്റെ വിധവാവസ്ത്രങ്ങൾ ധരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: അവൾ എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥനക്രമത്തിലുള്ള പ്രയോഗം അടുത്ത പ്രവൃത്തിയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: וַתֵּלֶךְ
  choice: അവിടെനിന്നു പോയി
  rationale: മുൻപ്രവൃത്തിക്ക് പിന്നാലെയുള്ള הלך ആ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവിടെനിന്നു പോയി’ എന്നു നൽകി.
- source_word: וַתָּסַר ... מֵעָלֶיהָ
  choice: തന്റെ ... നീക്കി
  rationale: സור എന്ന ഹിഫീൽ രൂപവും מֵעָלֶיהָയും ചേർന്ന് അവൾ തന്റെ മേലുണ്ടായിരുന്ന മൂടുപടം എടുത്തുമാറ്റിയതിനെ സൂചിപ്പിക്കുന്നു. ‘തന്റെ ... നീക്കി’ എന്നത് ആവർത്തനഭാരം കൂടാതെ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: צְעִיפָהּ
  choice: തന്റെ മൂടുപടം
  rationale: צָעִיף ഇവിടെ തലെയോ മുഖത്തെയോ മറയ്ക്കുന്ന ആവരണമാണ്; താമാറിന്റെ വേഷമാറ്റത്തിന്റെ സന്ദർഭത്തിൽ ‘മൂടുപടം’ അനുയോജ്യമാണ്.
- source_word: וַתִּלְבַּשׁ
  choice: ധരിച്ചു
  rationale: לבש വസ്ത്രം അണിയുക എന്നർഥം നൽകുന്നു; ‘ധരിച്ചു’ ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: വിധവാവസ്ത്രങ്ങൾ
  rationale: ഈ സംയുക്തപദം അവളുടെ വിധവാസ്ഥിതിയുമായി ബന്ധപ്പെട്ട വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘വിധവാവസ്ത്രങ്ങൾ’ സംക്ഷിപ്തമായി മൂലത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
