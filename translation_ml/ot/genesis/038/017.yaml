source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אָנֹכִ֛י אֲשַׁלַּ֥ח גְּדִֽי עִזִּ֖ים מִן הַ/צֹּ֑אן וַ/תֹּ֕אמֶר אִם תִּתֵּ֥ן עֵרָב֖וֹן עַ֥ד שָׁלְחֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ ആട്ടിൻകൂട്ടത്തിൽനിന്ന് ഒരു കോലാട്ടിൻകുട്ടിയെ അയച്ചുതരാം.” അവൾ പറഞ്ഞു: “നീ അതിനെ അയച്ചുതരുന്നതുവരെ എനിക്ക് ഒരു പണയം[a] തരാമെങ്കിൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഈട്” അല്ലെങ്കിൽ “ജാമ്യം” (עֵרָבוֹן).
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: ഒരു കോലാട്ടിൻകുട്ടി
  rationale: കോലാടുകളിൽപ്പെട്ട ഒരു കുട്ടിയെയാണ് ഈ ഘടന സൂചിപ്പിക്കുന്നത്. ‘കോലാട്ടിൻകുട്ടി’ ആ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: מִן הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിൽനിന്ന്
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം. ഇവിടെ മൃഗം കോലാട്ടിൻകുട്ടിയാണെന്ന് നേരത്തേ വ്യക്തമാക്കിയതിനാൽ ‘ആട്ടിൻകൂട്ടം’ സ്വാഭാവികമാണ്.
- source_word: עֵרָבוֹן
  choice: പണയം
  rationale: വാഗ്ദാനം പിന്നീട് നിറവേറ്റുന്നതുവരെ ഉറപ്പായി കൈമാറുന്ന വസ്തുവാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘പണയം’ ഈ സന്ദർഭത്തിന് ചേരുന്ന സാധാരണ മലയാളപദമാണ്.
- source_word: עַד שָׁלְחֶךָ
  choice: നീ അതിനെ അയച്ചുതരുന്നതുവരെ
  rationale: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നീ അയയ്ക്കുന്നതുവരെ’ എന്നാണ്. സന്ദർഭത്തിൽ അയയ്ക്കേണ്ട കോലാട്ടിൻകുട്ടിയാണ് സൂചിതം; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അതിനെ’ ചേർത്തു.
- source_word: אִם תִּתֵּן
  choice: തരാമെങ്കിൽ
  rationale: താമാർ മുന്നോട്ടുവയ്ക്കുന്ന നിബന്ധനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. മൂലത്തിലെ അപൂർണ നിബന്ധനാവാക്യത്തിന്റെ സ്വഭാവം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: ഞാൻ … അയച്ചുതരാം
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ ‘ഞാൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ‘അയച്ചുതരാം’ വാഗ്ദാനത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നിബന്ധനാവാക്യത്തിന്റെ അപൂർണത വിശദീകരിച്ച് പൂർത്തിയാക്കാതെ സൂക്ഷിച്ചു; ഉദ്ധരണികളുടെ ക്രമവും നേരിട്ടുള്ള സംഭാഷണവും നിലനിർത്തി.
