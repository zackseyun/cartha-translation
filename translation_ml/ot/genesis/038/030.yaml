source:
  edition: WLC
  text: וְ/אַחַר֙ יָצָ֣א אָחִ֔י/ו אֲשֶׁ֥ר עַל יָד֖/וֹ הַ/שָּׁנִ֑י וַ/יִּקְרָ֥א שְׁמ֖/וֹ זָֽרַח־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: ml
  text: അതിനുശേഷം, കൈയിൽ ചുവപ്പുനൂൽ ഉണ്ടായിരുന്ന അവന്റെ സഹോദരൻ പുറത്തുവന്നു; അവൻ അവന് സേരഹ് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: തുടർന്നുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יָצָא
  choice: പുറത്തുവന്നു
  rationale: പ്രസവസന്ദർഭത്തിൽ ശിശു പുറത്തുവരുന്നതിനെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אָחִיו
  choice: അവന്റെ സഹോദരൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ ബന്ധപദത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മറ്റേ ഇരട്ടസഹോദരനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: കൈയിൽ ചെമന്നൂൽ ഉണ്ടായിരുന്ന
  rationale: കൈയിലെ ചുവന്ന അടയാളംകൊണ്ട് സഹോദരനെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; 'നൂൽ' എന്നത് 28-ാം വാക്യത്തിലെ തൊട്ടടുത്ത സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: הַשָּׁנִי
  choice: ചെമന്നൂൽ
  rationale: ഇവിടെ അക്ഷരാർഥത്തിൽ 'ചെമപ്പ്/ചെമന്ന വസ്തു' എന്നാണെങ്കിലും മുൻവാക്യത്തിൽ നൂൽ വ്യക്തമാക്കിയതിനാൽ സംക്ഷിപ്തവും ഗ്രാഹ്യവുമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: അവന് ... എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥമായ 'അവന്റെ പേര് വിളിച്ചു' എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കർത്താവ് ഹീബ്രായത്തിൽ പുല്ലിംഗ ഏകവചനമാണെങ്കിലും മലയാളത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: זָרַח
  choice: സേരഹ്
  rationale: വ്യക്തിനാമം മലയാള ശബ്ദരീതിക്ക് അനുയോജ്യമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
