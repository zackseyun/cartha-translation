  terminology: '''സേരഹ്'' is an acceptable Malayalam transliteration of Zerah. ''ചുവപ്പുനൂൽ'' accurately reflects the scarlet marker from the immediate context. The naming idiom is best rendered naturally as ''അവന് സേരഹ് എന്നു പേരിട്ടു,'' while retaining the masculine subject as ''അവൻ.'''
