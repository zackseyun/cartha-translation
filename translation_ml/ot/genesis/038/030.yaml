translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ കാലക്രമവും ബന്ധവാക്യവും നിലനിർത്തിക്കൊണ്ട്, ഹീബ്രായ നാമകരണപ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കി. ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണാവശ്യമായ പ്രത്യേക അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
