source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֣ם רְאוּבֵן֮ אַל תִּשְׁפְּכוּ דָם֒ הַשְׁלִ֣יכוּ אֹת֗/וֹ אֶל הַ/בּ֤וֹר הַ/זֶּה֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר וְ/יָ֖ד אַל תִּשְׁלְחוּ ב֑/וֹ לְמַ֗עַן הַצִּ֤יל אֹת/וֹ֙ מִ/יָּדָ֔/ם לַ/הֲשִׁיב֖/וֹ אֶל אָבִֽי/ו׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: ml
  text: 'രൂബേൻ അവരോടു പറഞ്ഞു: “രക്തം ചൊരിയരുത്. വിജനപ്രദേശത്തുള്ള ഈ കുഴിയിൽ[a] അവനെ എറിയുക; എന്നാൽ അവന്റെമേൽ കൈവെക്കരുത്.” അവരുടെ കൈയിൽനിന്ന് അവനെ രക്ഷിച്ച് അവന്റെ അപ്പന്റെ അടുക്കലേക്കു തിരികെ കൊണ്ടുവരാനായിരുന്നു രൂബേന്റെ ഉദ്ദേശ്യം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുഴി” എന്നതിന് “ജലസംഭരണിക്കുഴി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വെള്ളം ശേഖരിക്കുന്നതിനായി നിർമിച്ച കുഴിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവരുടെ കൈയിൽനിന്ന് അവനെ രക്ഷിച്ച് അവന്റെ അപ്പന്റെ അടുക്കലേക്കു തിരികെ കൊണ്ടുവരേണ്ടതിന്.”'
    reason: structural_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: രക്തം ചൊരിയരുത്
  rationale: കൊലപാതകത്തെയും അതിലൂടെ വരുന്ന രക്തപാതകക്കുറ്റത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: അവനെ എറിയുക
  rationale: ശാരീരികമായി കുഴിയിലേക്ക് എറിയുന്ന പ്രവൃത്തിയെ വ്യക്തവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: הַבּוֹר
  choice: കുഴി
  rationale: ഈ പദത്തിന് കുഴി, ജലസംഭരണിക്കുഴി തുടങ്ങിയ അർഥങ്ങൾ വരാം; മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥമുള്ള ‘കുഴി’ ഉപയോഗിച്ച് പ്രത്യേക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: മരുഭൂമിയിലുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള വിശേഷണരൂപത്തിൽ വ്യക്തമാക്കുന്നു; മִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയും സൂചിപ്പിക്കാം.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: എന്നാൽ അവന്റെമേൽ കൈവെക്കരുത്
  rationale: അവനെ നേരിട്ട് ആക്രമിക്കുകയോ ഉപദ്രവിക്കുകയോ ചെയ്യരുതെന്ന എബ്രായ ഭാഷാശൈലിയെ മലയാളത്തിലെ സമാന പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: അവരുടെ കൈയിൽനിന്ന് അവനെ രക്ഷിച്ച്
  rationale: ‘കൈ’ അധികാരത്തെയോ പിടിയെയോ സൂചിപ്പിക്കുന്ന മൂലഭാഷാ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: അവന്റെ അപ്പന്റെ അടുക്കൽ തിരികെ എത്തിക്കാൻ
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘തിരികെ കൊണ്ടുവരുക/എത്തിക്കുക’ എന്ന കാരകാർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: לְמַעַן ആരംഭിക്കുന്ന ഉദ്ദേശ്യവാക്യം ആരുടെ വാക്കാണ് എന്നത്
  choice: നേരിട്ടുള്ള സംഭാഷണത്തിനു പുറത്തുള്ള ആഖ്യാതാവിന്റെ വിശദീകരണമായി അവതരിപ്പിച്ചു
  alternative: രൂബേന്റെ നേരിട്ടുള്ള വാക്കുകളുടെ തുടർച്ചയായി വായിക്കുക
  rationale: എബ്രായ വാക്യഘടന രൂബേന്റെ മറഞ്ഞ ഉദ്ദേശ്യം ആഖ്യാതാവ് വിശദീകരിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; അതിനാൽ ഉദ്ധരണി അവസാനിപ്പിച്ചശേഷം പ്രത്യേക വാക്യമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഭാഷണവും ആഖ്യാതാവിന്റെ ഉദ്ദേശ്യവിശദീകരണവും വേർതിരിക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി. ‘അപ്പൻ’ എന്നത് കുടുംബബന്ധത്തിന്റെ സ്വാഭാവികത നിലനിർത്തുന്നു.
