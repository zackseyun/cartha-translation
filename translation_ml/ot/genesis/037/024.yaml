  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ആവർത്തനവും വെള്ളത്തെക്കുറിച്ചുള്ള വ്യക്തമായ വിശദീകരണവും നിലനിർത്തി; ‘കുഴി’ എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
