  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: ml
  text: അപ്പോൾ അവർ അവനെ എടുത്ത് കുഴിയിലേക്കു എറിഞ്ഞു. കുഴി ശൂന്യമായിരുന്നു; അതിൽ വെള്ളമുണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: അപ്പോൾ അവർ അവനെ പിടിച്ച്
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനപ്രവാഹം നൽകുന്നു. לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തിക്കൊണ്ട്, ഈ സന്ദർഭത്തിലെ ബലപ്രയോഗം അമിതമാക്കാതെ ‘പിടിച്ച്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: അവനെ ... എറിഞ്ഞു
  rationale: השליך എന്ന ക്രിയയുടെ ‘എറിയുക/വലിച്ചെറിയുക’ എന്ന അർഥം ലളിതവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു; ക്രിയയുടെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: הַבֹּרָה
  choice: കുഴിയിൽ
  rationale: בּוֹר എന്നത് കുഴി, ജലസംഭരണിക്കുഴി, കിണർ എന്നിവയെ സൂചിപ്പിക്കാം. ‘കുഴി’ വിശാലമായ അർഥം നിലനിർത്തുന്നു; വെള്ളമില്ലായിരുന്നുവെന്ന തുടർവിവരണം ജലസംഭരണിക്കുഴി എന്ന സാധ്യത ഉയർത്തുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְהַבּוֹר רֵק
  choice: കുഴി ഒഴിഞ്ഞുകിടക്കുകയായിരുന്നു
  rationale: ഈ വാക്യഭാഗം പശ്ചാത്തല വിശദീകരണമാണ്. רֵק എന്നതിന്റെ ‘ഒഴിഞ്ഞ/ശൂന്യമായ’ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒഴിഞ്ഞുകിടക്കുകയായിരുന്നു’ എന്നു നൽകി.
- source_word: אֵין בּוֹ מָיִם
  choice: അതിൽ വെള്ളമുണ്ടായിരുന്നില്ല
  rationale: കുഴി ഏത് അർഥത്തിൽ ഒഴിഞ്ഞതായിരുന്നു എന്ന് വ്യക്തമാക്കുന്ന എബ്രായവാക്യം നേരായും സ്വാഭാവികമായും വിവർത്തനം ചെയ്യുന്നു.
