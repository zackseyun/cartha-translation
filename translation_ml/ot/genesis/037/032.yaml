  source_fidelity: വാക്യത്തിലെ രണ്ടു ക്രിയകളായ ‘അയച്ചു’യും ‘കൊണ്ടുവന്നു’യും വ്യക്തമായി വേർതിരിച്ചു നിലനിർത്തണം. כְּתֹנֶת הַפַּסִּים എന്ന അനിശ്ചിത പ്രയോഗത്തിന് ‘നീണ്ട കൈകളുള്ള അങ്കി’ എന്നത് സൂക്ഷ്മവും സ്വാഭാവികവുമായ പരിഹാരമാണ്. ‘തിരിച്ചറിയുക’ הַכֶּר נָאയുടെ അർഥവും കഥാപരമായ ആവർത്തനസൂചനയും നിലനിർത്തുന്നു.
  naturalness: കരടിലെ ‘കൊടുത്തയച്ചു; അത് ... കൊണ്ടുവന്ന് അവർ പറഞ്ഞു’ എന്ന ഘടനയിൽ അതേ കർമത്തെ അയച്ചതും കൊണ്ടുവന്നതും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്. സമാന്തര ക്രിയാരൂപം ഉപയോഗിക്കുന്നത് കഥനത്തെ കൂടുതൽ വ്യക്തവും നിലവാരമലയാളത്തിന് സ്വാഭാവികവുമാക്കുന്നു. ‘നീളൻ കൈകളുള്ള’ എന്നതിനു പകരം ‘നീണ്ട കൈകളുള്ള’ കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘അങ്കി’ כְּתֹנֶת-ന് യോജിക്കുന്നു. ‘നിന്റെ മകൻ’ എന്ന ദൂരസ്ഥമായ പ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് a-യിൽ വസ്ത്രപദത്തിന്റെ അനിശ്ചിതത്വവും പരമ്പരാഗത ‘പല നിറങ്ങളുള്ള അങ്കി’ എന്ന വായനയും ശരിയായി രേഖപ്പെടുത്തുന്നു. അടിക്കുറിപ്പ് b-യെ മൂലക്രിയയുടെ ‘തിരിച്ചറിയുക’ എന്ന അർഥത്തോടു കൂടുതൽ നേരിട്ട് ബന്ധിപ്പിച്ചു.
