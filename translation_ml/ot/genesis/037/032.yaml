  to: 'പിന്നെ അവർ നീണ്ട കൈകളുള്ള ആ അങ്കി[a] കൊടുത്തയക്കുകയും അത് തങ്ങളുടെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുവരികയും ചെയ്തു. അവർ പറഞ്ഞു: “ഇത് ഞങ്ങൾ കണ്ടെത്തി. ഇത് നിന്റെ മകന്റെ അങ്കിയാണോ അല്ലയോ എന്ന് ഒന്നു തിരിച്ചറിയുക[b].”'
