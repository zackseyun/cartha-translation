id: GEN.37.32
reference: Genesis 37:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: ml
  text: 'പിന്നെ അവർ നീണ്ട കൈകളുള്ള ആ അങ്കി[a] കൊടുത്തയക്കുകയും അത് തങ്ങളുടെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുവരികയും ചെയ്തു. അവർ പറഞ്ഞു: “ഇത് ഞങ്ങൾ കണ്ടെത്തി. ഇത് നിന്റെ മകന്റെ അങ്കിയാണോ അല്ലയോ എന്ന് ഒന്നു തിരിച്ചറിയുക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അലങ്കരിച്ച അങ്കി,” “സമൃദ്ധമായി അലങ്കരിച്ച നീളക്കുപ്പായം” എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി, “പല നിറങ്ങളുള്ള അങ്കി.” എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യാർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ദയവായി തിരിച്ചറിയുക” എന്നും പരിഭാഷപ്പെടുത്താം. തിരിച്ചറിയലും തെറ്റായ തിരിച്ചറിയലും ആവർത്തിക്കുന്ന ഈ വിശാലകഥയിൽ ഈ പദപ്രയോഗത്തിന് പ്രത്യേക പ്രാധാന്യമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: കൊടുത്തയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; കഥനക്രമം ‘പിന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: നീളൻ കൈകളുള്ള ആ അങ്കി
  rationale: כְּתֹנֶת ഒരു അങ്കി/നീളക്കുപ്പായം പോലുള്ള വസ്ത്രമാണ്. פַּסִּים എന്നതിന്റെ കൃത്യാർഥം അനിശ്ചിതമാണെങ്കിലും കൈപ്പത്തിവരെ നീളുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യതയാൽ ഈ പരിഭാഷ സ്വീകരിച്ചു; ‘പല നിറങ്ങളുള്ള’ എന്ന പരമ്പരാഗത അർഥം മൂലപദത്തിൽ ഉറപ്പില്ല.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: അത് തങ്ങളുടെ അപ്പന്റെ അടുക്കൽ കൊണ്ടുവന്ന്
  rationale: മൂലപാഠത്തിലെ ‘തങ്ങളുടെ അപ്പന്റെ അടുക്കൽ’ എന്ന ബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ ആവശ്യമായ കർമസൂചകമായ ‘അത്’ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: זֹאת מָצָאנוּ
  choice: ഇത് ഞങ്ങൾ കണ്ടെത്തിയതാണ്
  rationale: സഹോദരന്മാരുടെ വഞ്ചനാപരമായെങ്കിലും ഉപരിതലത്തിൽ ലളിതമായ പ്രസ്താവന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֶּר נָא
  choice: ഒന്നു തിരിച്ചറിയുക
  rationale: הכר എന്നതിന്റെ ‘തിരിച്ചറിയുക’ എന്ന അർഥവും נָא നൽകുന്ന മൃദുവായ അഭ്യർഥനാഭാവവും സംരക്ഷിക്കുന്നു; കഥയിലെ തിരിച്ചറിയൽപ്രമേയവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: ഇത് നിന്റെ മകന്റെ അങ്കിയാണോ അല്ലയോ എന്ന്
  rationale: ‘ആണോ അല്ലയോ’ എന്ന പരോക്ഷചോദ്യം കൃത്യമായി നിലനിർത്തുന്നു. ‘നിന്റെ മകൻ’ എന്ന പ്രയോഗം യോസേഫിൽനിന്നുള്ള സഹോദരന്മാരുടെ അകലം സൂചിപ്പിക്കുന്ന മൂലപാഠഭാഷ മാറ്റാതെ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ,’ ‘അങ്കി,’ ‘ഒന്നു തിരിച്ചറിയുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്. വസ്ത്രത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള എബ്രായത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
