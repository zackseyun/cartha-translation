  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: ml
  text: യാക്കോബിന്റെ വംശചരിത്രം ഇതാണ്:[a] പതിനേഴു വയസ്സുള്ള യോസേഫ് തന്റെ സഹോദരന്മാരോടൊപ്പം ആട്ടിൻപറ്റത്തെ മേയിച്ചുകൊണ്ടിരുന്നു. യുവാവായ അവൻ തന്റെ അപ്പന്റെ ഭാര്യമാരായ ബിൽഹായുടെ പുത്രന്മാരോടും സിൽപായുടെ പുത്രന്മാരോടും കൂടെയായിരുന്നു.[b] യോസേഫ് അവരെക്കുറിച്ചുള്ള മോശമായ റിപ്പോർട്ട് അവരുടെ അപ്പനെ അറിയിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാക്കോബിന്റെ തലമുറകൾ ഇവയാണ്” / “യാക്കോബിന്റെ കുടുംബചരിത്രം ഇതാണ്.” ഉല്പത്തിയിൽ ‘തോലെദോത്ത്’ എന്ന ഹീബ്രുപദം പലപ്പോഴും പുതിയൊരു വിഭാഗം ആരംഭിക്കുകയും ഒരാളിൽനിന്ന് തുടർന്നുവരുന്ന വംശത്തെയും ചരിത്രത്തെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഈ ഭാഗത്തിന്റെ ഹീബ്രു വാക്യഘടന ദുഷ്കരമാണ്. ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: “അവൻ തന്റെ സഹോദരന്മാരോടൊപ്പം ആട്ടിൻപറ്റത്തെ മേയിച്ചുകൊണ്ടിരുന്നു; യുവാവായ അവൻ തന്റെ അപ്പന്റെ ഭാര്യമാരായ ബിൽഹായുടെ പുത്രന്മാരോടും സിൽപായുടെ പുത്രന്മാരോടും കൂടെയായിരുന്നു.”'
    reason: source_ambiguity
  - marker: c
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “അവരുടെ അപ്പനെ”; യാക്കോബ് യോസേഫിന്റെയും ഈ സഹോദരന്മാരുടെയും അപ്പനാണെന്ന ബഹുവചനരൂപം മൂലപാഠത്തിൽ വ്യക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: വംശചരിത്രം
  rationale: ഉല്പത്തിയിൽ പുതിയൊരു വിഭാഗം ആരംഭിക്കുന്ന ഘടനാപരമായ പദമാണിത്. ഒരാളിൽനിന്ന് തുടർന്നുവരുന്ന തലമുറകളെയും അവരുടെ ചരിത്രത്തെയും സൂചിപ്പിക്കാം; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘വംശചരിത്രം’ എന്നു നൽകി, പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הָיָה רֹעֶה
  choice: മേയിച്ചുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിപ്രയോഗം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘കൊണ്ടിരുന്നു’ ആ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: തന്റെ സഹോദരന്മാരോടൊപ്പം ആട്ടിൻപറ്റത്തെ
  rationale: യോസേഫ് സഹോദരന്മാരെ മേയിച്ചു എന്നല്ല, അവരോടൊപ്പം ആട്ടിൻപറ്റത്തെ മേയിച്ചു എന്ന സന്ദർഭാർഥമാണ് മലയാളവാക്യത്തിൽ വ്യക്തമാക്കിയത്.
- source_word: נַעַר
  choice: യുവാവ്
  rationale: യോസേഫിന് പതിനേഴു വയസ്സെന്ന് വ്യക്തമാക്കിയിരിക്കുന്നതിനാൽ ‘ബാലൻ’ എന്നതിനെക്കാൾ ‘യുവാവ്’ സന്ദർഭോചിതവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: ബിൽഹായുടെ പുത്രന്മാരോടും സിൽപായുടെ പുത്രന്മാരോടും കൂടെ
  rationale: ഹീബ്രു വാക്യഘടന ദുഷ്കരമാണ്; ഇവരുമായി യോസേഫ് കൂടെയുണ്ടായിരുന്നു എന്ന ഏറ്റവും കുറഞ്ഞ വ്യാഖ്യാനമുള്ള ബന്ധാർഥം സ്വീകരിച്ചു. ആവർത്തിച്ച ഘടനയും നിലനിർത്തി.
- source_word: נְשֵׁי אָבִיו
  choice: തന്റെ അപ്പന്റെ ഭാര്യമാർ
  rationale: ബിൽഹായെയും സിൽപായെയും തിരിച്ചറിയിക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: דִּבָּתָם רָעָה
  choice: അവരെക്കുറിച്ചുള്ള മോശമായ വിവരം
  rationale: അവരെ സംബന്ധിച്ച പ്രതികൂലമായ റിപ്പോർട്ടാണ് പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. ‘ദുഷ്‌വാർത്ത’ എന്നത് സംഭവിച്ച അനർഥത്തെക്കുറിച്ചുള്ള വാർത്തയായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘മോശമായ വിവരം’ അർഥം അതിരുകടക്കാതെ നൽകുന്നു.
- source_word: אֶל אֲבִיהֶם
  choice: അവരുടെ അപ്പനെ
  rationale: ഹീബ്രുവിലുള്ള ബഹുവചന ഉടമസ്ഥപ്രത്യയം സംരക്ഷിച്ചു; യാക്കോബ് യോസേഫിന്റെയും സഹോദരന്മാരുടെയും പൊതുവായ അപ്പനാണെന്ന് ഇത് സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ’, ‘ആട്ടിൻപറ്റം’, ‘മേയിച്ചുകൊണ്ടിരുന്നു’ എന്നീ സാധാരണക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ഘടനാപരമായ തലക്കെട്ടും ദുഷ്കരമായ സഹചര്യവാക്യവും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
