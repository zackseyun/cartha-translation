source:
  edition: WLC
  text: וַ/יֵּלְכ֖וּ אֶחָ֑י/ו לִ/רְע֛וֹת אֶׄתׄ צֹ֥אן אֲבִי/הֶ֖ם בִּ/שְׁכֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/012.yaml
  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: ml
  text: അവന്റെ സഹോദരന്മാർ തങ്ങളുടെ അപ്പന്റെ ആട്ടിൻപറ്റത്തെ ശെഖേമിൽ മേയ്ക്കാൻ പോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശെഖേമിനു സമീപം.” എബ്രായ ഉപസർഗം സ്ഥലത്തിനകത്തെയോ അവിടെയോ അതിന്റെ പരിസരത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായ ഭൂതകാലപ്രയോഗം.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: സന്ദർഭത്തിൽ യോസേഫിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִרְעוֹת
  choice: മേയ്ക്കാൻ
  rationale: רעה എന്ന ക്രിയ ഇവിടെ ആട്ടിൻപറ്റത്തെ പരിപാലിച്ച് തീറ്റിക്കുന്ന പ്രവൃത്തിയെയും അതിന്റെ ഉദ്ദേശ്യത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദം ആവശ്യമില്ല.
- source_word: צֹאן
  choice: ആട്ടിൻപറ്റത്തെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപദമാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘ആട്ടിൻപറ്റം’ അതിനെ അനാവശ്യമായി ഇനംതിരിക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: אֲבִיהֶם
  choice: തങ്ങളുടെ അപ്പന്റെ
  rationale: സഹോദരന്മാരിലേക്കു തിരിച്ചുനിൽക്കുന്ന ഉടമസ്ഥബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘തങ്ങളുടെ’ ഉപയോഗിച്ചു; ‘അപ്പൻ’ സാധാരണവും മാന്യവുമായ ആഖ്യാനഭാഷയാണ്.
- source_word: בִּשְׁכֶם
  choice: ശെഖേമിലേക്കു
  rationale: സ്ഥലനാമത്തോടുള്ള בְּ സ്ഥലം അകത്തോ സ്ഥലത്തോ പരിസരത്തോ എന്നർഥം നൽകാം; ചലനക്രിയയോടൊപ്പം മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന ‘-ലേക്കു’ സ്വാഭാവികമാണ്, എന്നാൽ മൂലത്തിലെ സ്ഥലപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശെഖേം’ എന്ന രൂപം സ്ഥലനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്നു; കന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാൻ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘ആട്ടിൻപറ്റം’ ഉപയോഗിച്ചു.
