id: GEN.37.15
reference: Genesis 37:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: ml
  text: 'ഒരു മനുഷ്യൻ അവനെ വയലിൽ അലഞ്ഞുനടക്കുന്നതായി കണ്ടു. ആ മനുഷ്യൻ അവനോട് ചോദിച്ചു: “നീ എന്താണ് അന്വേഷിക്കുന്നത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: അവനെ കണ്ടു
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ ഖാൽ അർഥമായ ‘കണ്ടെത്തുക/കാണുക’ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യൻ
  rationale: പുരുഷനായ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചനത്തിന്റെ വ്യക്തത നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: വാക്യഘടനയിലൂടെ സൂചിപ്പിച്ചു
  rationale: הנה നൽകുന്ന ശ്രദ്ധാകേന്ദ്രവും ദൃശ്യാവിഷ്കാരവും മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ഇതാ’ ചേർക്കാതെ തുടർന്നുള്ള വിവരണത്തിന്റെ നേരിട്ടുള്ള ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: תֹעֶה
  choice: വഴിതെറ്റി അലഞ്ഞുനടക്കുകയായിരുന്നു
  rationale: תעה എന്ന പദത്തിലെ വഴിതെറ്റൽ/അലച്ചിൽ എന്നീ സമീപ അർഥങ്ങൾ രണ്ടും നിലനിർത്തുന്നു; പൂർണമായി ‘നഷ്ടപ്പെട്ടവൻ’ എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שדה എന്ന സാധാരണ പദത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: അവനോട് ചോദിച്ചു
  rationale: שאל എന്നതിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: לֵאמֹר
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിച്ചു
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള സംഭാഷണസൂത്രം മലയാളത്തിൽ കോളനും ഉദ്ധരണിയും ഉപയോഗിച്ച് സ്വാഭാവികമായി നൽകുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: מַה תְּבַקֵּשׁ
  choice: നീ എന്താണ് അന്വേഷിക്കുന്നത്?
  rationale: בקש എന്നതിന്റെ ‘അന്വേഷിക്കുക/തിരയുക’ എന്ന അർഥവും നടന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയുടെ ഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ അർഥവും ദൃശ്യഭാവവും സംരക്ഷിച്ചു.
