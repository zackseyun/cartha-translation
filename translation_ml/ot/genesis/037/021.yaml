id: GEN.37.21
reference: Genesis 37:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע רְאוּבֵ֔ן וַ/יַּצִּלֵ֖/הוּ מִ/יָּדָ֑/ם וַ/יֹּ֕אמֶר לֹ֥א נַכֶּ֖/נּוּ נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: ml
  text: 'എന്നാൽ രൂബേൻ അതു കേട്ടപ്പോൾ, അവൻ യോസേഫിനെ അവരുടെ കൈയിൽനിന്ന് രക്ഷിച്ചു. അവൻ പറഞ്ഞു: “നാം അവന്റെ ജീവനെടുക്കരുത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം അവനെ കൊന്നുകളയരുത്.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “ജീവനെ സംബന്ധിച്ച് നാം അവനെ അടിക്കരുത്” എന്നാണ്; മാരകമായി പ്രഹരിക്കുക എന്ന അർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: അതു കേട്ടപ്പോൾ
  rationale: שׁמע എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ സഹോദരന്മാരുടെ ആലോചനയാണ് ‘അതു’ സൂചിപ്പിക്കുന്നത്. തുടർച്ചയായ ആഖ്യാനത്തിലെ സമയബന്ധം ‘കേട്ടപ്പോൾ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיַּצִּלֵהוּ
  choice: അവൻ യോസേഫിനെ ... രക്ഷിച്ചു
  rationale: നצל എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘വിടുവിക്കുക, രക്ഷിക്കുക’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു. ഹീബ്രുവിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘യോസേഫ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: מִיָּדָם
  choice: അവരുടെ കൈയിൽനിന്ന്
  rationale: അവരുടെ അധികാരത്തിൽനിന്നോ പിടിയിൽനിന്നോ എന്ന ഹീബ്രു രൂപകം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിലേക്കുള്ള സാധാരണ ആഖ്യാനപരമായ പ്രവേശനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: നാം അവന്റെ ജീവനെടുക്കരുത്
  rationale: വാക്കുതോറും ‘ജീവനെ സംബന്ധിച്ച് അവനെ അടിക്കരുത്’ എന്ന ഹീബ്രു പ്രയോഗം മാരകമായി പ്രഹരിക്കുക, അഥവാ ജീവൻ അപഹരിക്കുക, എന്നാണ് സൂചിപ്പിക്കുന്നത്. ‘ജീവനെടുക്കരുത്’ ഉദ്ദേശിച്ച അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘അവരുടെ കൈയിൽനിന്ന്’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും അവസാനത്തെ ഹീബ്രു പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി അർഥമാക്കുകയും ചെയ്തു.
