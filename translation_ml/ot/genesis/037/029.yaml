id: GEN.37.29
reference: Genesis 37:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: ml
  text: രൂബേൻ കുഴിയിലേക്കു[a] മടങ്ങിവന്നപ്പോൾ, അതാ, യോസേഫ് കുഴിയിൽ ഇല്ലായിരുന്നു. അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘കുഴി’ എന്നതിന് ‘ജലസംഭരണിക്കുഴി’ എന്നും പരിഭാഷപ്പെടുത്താം (എബ്രായം: ബോർ).'
    reason: lexical_alternative
  - marker: b
    text: സ്വന്തം വസ്ത്രങ്ങൾ കീറുന്നത് ദുഃഖം, ഞെട്ടൽ, അല്ലെങ്കിൽ കടുത്ത മനോവ്യഥ പ്രകടിപ്പിക്കുന്ന പതിവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ ആഖ്യാനരൂപം രൂബേൻ മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തേക്കു തിരിച്ചെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിവന്നു’ സ്വാഭാവികവും ദിശയെ അനാവശ്യമായി വിശദീകരിക്കാത്തതുമാണ്.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: കുഴി / കുഴിയിൽ
  rationale: בּוֹר എന്നതിന് കുഴി എന്നും ജലസംഭരണിക്കുഴി എന്നും അർഥമാകാം. ഈ സന്ദർഭത്തിൽ ‘കുഴി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה തുടർന്നുവരുന്ന അപ്രതീക്ഷിത കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകമാണ്; ‘അതാ’ അതിന്റെ പെട്ടെന്നുള്ള തിരിച്ചറിവും സാഹിത്യബലവും നിലനിർത്തുന്നു.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: യോസേഫ് കുഴിയിൽ ഇല്ലായിരുന്നു
  rationale: אֵין ഇവിടെ അഭാവത്തെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ സ്വാഭാവികമായ മലയാളത്തിൽ യോസേഫിന്റെ അഭാവം മാത്രം പറയുന്നു; അവൻ എങ്ങനെ പോയി എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: വസ്ത്രം കീറുക ദുഃഖം, ഞെട്ടൽ, അല്ലെങ്കിൽ കടുത്ത മനോവ്യഥ പ്രകടിപ്പിക്കുന്ന പതിവായിരുന്നു. ‘വസ്ത്രങ്ങൾ കീറി’ മൂലപ്രയോഗത്തെ വ്യക്തവും നേരിട്ടുമായ രീതിയിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അതാ’ എന്ന അല്പം ഉയർന്ന ആഖ്യാനപ്രയോഗം മൂലത്തിലെ הִנֵּה യുടെ ശ്രദ്ധാകർഷകശക്തി നിലനിർത്താൻ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് [b] പ്രസക്തമായ പ്രവൃത്തിക്കു പിന്നാലെ വാക്യാവസാനത്തിൽ ചേർത്തു.
