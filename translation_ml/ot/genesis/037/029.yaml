  terminology: “കുഴി” is an appropriate main rendering for בּוֹר, while the footnote preserves “cistern” as a legitimate lexical alternative. “വസ്ത്രങ്ങൾ കീറി” accurately conveys the conventional Hebrew expression without importing interpretation into the text.
