source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֲלֵי/הֶ֑ם שִׁמְעוּ נָ֕א הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֥ר חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/006.yaml
  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഞാൻ കണ്ട ഈ സ്വപ്നം[a] ഒന്നു കേൾക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ‘സ്വപ്നം’ എന്ന നാമവും അതേ ധാതുവിൽനിന്നുള്ള ‘സ്വപ്നം കാണുക’ എന്ന ക്രിയയും ആവർത്തിക്കുന്നു; അക്ഷരാർഥത്തിൽ: ‘ഞാൻ സ്വപ്നം കണ്ട ഈ സ്വപ്നം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ ക്രിയാക്രമം തുടരുന്നത് സ്വാഭാവികമാണ്; אֲלֵיהֶם എന്നത് ‘അവരോടു’ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: שִׁמְעוּ נָא
  choice: ഒന്നു കേൾക്കൂ
  rationale: ബഹുവചന ആജ്ഞയായ שִׁמְעוּ ശ്രദ്ധിച്ചു കേൾക്കാനുള്ള ആഹ്വാനമാണ്. נָא ആജ്ഞയെ മയപ്പെടുത്തുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിനയപൂർവ അഭ്യർഥനയായി ‘ഒന്നു കേൾക്കൂ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַחֲלוֹם הַזֶּה
  choice: ഈ സ്വപ്നം
  rationale: നിശ്ചയാർഥക നാമത്തോടു ചേർന്ന സൂചകപദത്തെ സ്വാഭാവിക മലയാളപദക്രമത്തിൽ ‘ഈ സ്വപ്നം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: ഞാൻ കണ്ട
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ നാമത്തിനു മുമ്പുള്ള വിശേഷണവാക്യമായി നൽകിയിരിക്കുന്നു. ‘സ്വപ്നം കണ്ട ഈ സ്വപ്നം’ എന്ന പദാവർത്തനം അസ്വാഭാവികമായതിനാൽ മുഖ്യവാചകത്തിൽ ‘ഞാൻ കണ്ട ഈ സ്വപ്നം’ എന്നും, എബ്രായത്തിലെ ധാതുസംബന്ധമായ ആവർത്തനം അടിക്കുറിപ്പിലും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. נָאയുടെ മയപ്പെടുത്തൽ ‘ദയവായി’ എന്ന ഔപചാരിക രൂപത്തിനു പകരം സന്ദർഭോചിതമായ ‘ഒന്നു’ കൊണ്ടു പ്രകടിപ്പിച്ചു.
