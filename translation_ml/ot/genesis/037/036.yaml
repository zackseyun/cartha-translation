translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായപാഠത്തിലെ ജനനാമം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും സന്ദർഭാധിഷ്ഠിതമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു. പദവികളുടെ സാങ്കേതികവും അനിശ്ചിതവുമായ അർഥങ്ങൾ പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
