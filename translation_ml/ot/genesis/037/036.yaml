  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: ml
  text: അതിനിടെ, മേദാന്യർ[a] അവനെ ഈജിപ്തിലേക്കു ഫറവോന്റെ ഒരു ഉദ്യോഗസ്ഥനും[b] രാജകാവൽസേനയുടെ തലവനുമായ[c] പോത്തീഫറിന് വിറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ ‘മേദാന്യർ’ എന്നാണ്. സമീപസന്ദർഭവും ചില പുരാതന പരിഭാഷകളും കണക്കിലെടുത്ത് പരമ്പരാഗതമായി ഇവിടെ ‘മിദ്യാന്യർ’ എന്നും മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: alternative_reading
  - marker: b
    text: ‘ഫറവോന്റെ ഒരു ഷണ്ഡൻ’ എന്നോ ‘ഫറവോന്റെ ഒരു കൊട്ടാര ഉദ്യോഗസ്ഥൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് ഈ അർഥങ്ങളെല്ലാം വരാം.
    reason: lexical_alternative
  - marker: c
    text: പദശഃ ‘കൊല്ലുന്നവരുടെ തലവൻ.’ രാജസഭാസന്ദർഭത്തിൽ ഇത് രാജാവിന്റെ കാവൽസേനയുടെയോ അംഗരക്ഷകരുടെയോ തലവനെ സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: അതിനിടെ, മേദാന്യർ
  rationale: വാക്യാരംഭത്തിലെ וְ ആഖ്യാനത്തിലെ രംഗമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അതിനിടെ’ എന്നു നൽകി. മְדָנִים എന്ന മസോററ്റിക് രൂപം നേരിട്ട് ‘മേദാന്യർ’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തെ ആശ്രയിച്ചുള്ള ‘മിദ്യാന്യർ’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מָכְרוּ אֹתוֹ
  choice: അവനെ … വിറ്റു
  rationale: Qal perfect ആയ מָכְרוּ ആഖ്യാനത്തിലെ ഭൂതകാലക്രിയയായി നൽകി; אֹתוֹ യോസേഫിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമമാണ്.
- source_word: אֶל מִצְרָיִם לְפוֹטִיפַר
  choice: ഈജിപ്തിലെ … പോത്തീഫറിനു
  rationale: אֶל ദിശയെയോ ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, വാങ്ങുന്നയാളായ പോത്തീഫർ ഈജിപ്തിലാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘ഈജിപ്തിലെ … പോത്തീഫറിനു’ എന്നു വ്യക്തമാക്കി. അർഥം അനാവശ്യമായി ‘ഈജിപ്തിലേക്കു കൊണ്ടുപോയി’ എന്ന് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: סְרִיס פַּרְעֹה
  choice: ഫറവോന്റെ ഒരു ഉദ്യോഗസ്ഥൻ
  rationale: סָרִיס എന്ന പദത്തിന് ഷണ്ഡൻ എന്നും രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥൻ എന്നും അർഥമാകാം. ഇവിടെ വ്യക്തിയുടെ ശരീരാവസ്ഥ നിർണയിക്കാതെ ഔദ്യോഗിക പദവി സൂചിപ്പിക്കുന്ന നിഷ്പക്ഷമായ ഭാഷ തിരഞ്ഞെടുത്തു.
- source_word: שַׂר הַטַּבָּחִים
  choice: രാജകാവൽസേനയുടെ തലവൻ
  rationale: പദശഃ ‘കൊല്ലുന്നവരുടെ തലവൻ’ എന്നായേക്കാം; രാജസഭാസന്ദർഭത്തിൽ വധശിക്ഷയും രാജസുരക്ഷയും നിർവഹിച്ചിരുന്ന കാവൽവിഭാഗത്തിന്റെ മേധാവിയെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്. ‘രാജകാവൽസേന’ ഈ ഔദ്യോഗിക പശ്ചാത്തലം വ്യക്തമായി അറിയിക്കുന്നു.
