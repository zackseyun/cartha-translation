source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: ml
  text: 'ആ മനുഷ്യൻ പറഞ്ഞു: “അവർ ഇവിടെനിന്ന് പുറപ്പെട്ടുപോയി; കാരണം, ‘നമുക്ക് ദോഥാനിലേക്കു[a] പോകാം’ എന്ന് അവർ പറയുന്നതു ഞാൻ കേട്ടു[b].” അങ്ങനെ യോസേഫ് തന്റെ സഹോദരന്മാരുടെ പിന്നാലെ പോയി, ദോഥാനിൽ അവരെ കണ്ടെത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ദോഥാനിലേക്ക്’ എന്ന സ്ഥലനാമത്തിന് ദിശ സൂചിപ്പിക്കുന്ന ഒരു പ്രത്യയം ചേർത്തിരിക്കുന്നു; അക്ഷരാർഥത്തിൽ ‘ദോഥാൻ-ദിശയിലേക്ക്’ എന്ന ആശയം.
    reason: cultural_note
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവർ പറഞ്ഞത് ഞാൻ കേട്ടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: ഇവിടെനിന്ന് പുറപ്പെട്ടുപോയി
  rationale: נסע ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് യാത്ര തുടരുന്നതിനെയോ പാളയം നീക്കി പോകുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. പാളയത്തിന്റെ ദൃശ്യം അനാവശ്യമായി വ്യക്തമാക്കാതെ, പുറപ്പെട്ടു മുന്നോട്ടുപോയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മനുഷ്യൻ പറഞ്ഞ നിഗമനത്തിന്റെ കാരണം തുടർന്നുള്ള കേട്ട വാക്കുകളാണെന്ന് വ്യക്തമാക്കുന്ന കാരണസൂചക പ്രയോഗം.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: അവർ പറയുന്നത് ഞാൻ കേട്ടു
  rationale: പുല്ലിംഗ ബഹുവചന കർത്തൃവാചകമായ אֹמְרִים സന്ദർഭത്തിൽ യോസേഫിന്റെ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്നു. നടന്നുകൊണ്ടിരുന്ന സംസാരമെന്ന ഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נֵלְכָה
  choice: നമുക്ക് ... പോകാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന cohortative രൂപത്തിന്റെ കൂട്ടായ നിർദേശമോ സ്വയംപ്രേരണയോ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דֹּתָיְנָה
  choice: ദോഥാനിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക -ה, ദോഥാനിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: אַחַר אֶחָיו
  choice: തന്റെ സഹോദരന്മാരുടെ പിന്നാലെ
  rationale: സഹോദരന്മാർ പോയ വഴിയെ പിന്തുടർന്നുള്ള യോസേഫിന്റെ യാത്രയെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; ‘പിന്തുടർന്ന് വേട്ടയാടി’ എന്ന അതിശക്തമായ അർത്ഥം ചേർക്കുന്നില്ല.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: ദോഥാനിൽ അവരെ കണ്ടെത്തി
  rationale: מצא എന്ന സാധാരണ ആഖ്യാനക്രിയയ്ക്ക് ‘കണ്ടെത്തി’ യോജിക്കുന്നു; בְּ സ്ഥലത്തെ ‘ദോഥാനിൽ’ എന്നു വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ആവർത്തിച്ചുള്ള എബ്രായ വാക്യാരംഭങ്ങൾ മലയാളത്തിലെ ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘said’ എന്നതിനു പിന്നാലെയാണെങ്കിലും അതിന്റെ കുറിപ്പ് דֹּתָיְנָה എന്ന ദിശാസൂചക രൂപത്തെക്കുറിച്ചായതിനാൽ, ഉറവിടസാക്ഷ്യത്തിന് അനുസരിച്ച് അടയാളം ‘ദോഥാനിലേക്കു’ എന്നതോടു ചേർത്തു.
