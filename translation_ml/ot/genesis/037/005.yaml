revisions:
- from: യോസേഫ് ഒരു സ്വപ്നം കണ്ടു; അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞപ്പോൾ അവർ അവനെ മുമ്പിലുമധികം വെറുത്തു.
  to: യോസേഫ് ഒരു സ്വപ്നം കണ്ടു; അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു; അവർ അവനെ ഇനിയും കൂടുതൽ വെറുത്തു.
  rationale: 'The revision preserves the Hebrew''s three coordinated narrative actions rather than converting the middle action into a temporal subordinate clause. “ഇനിയും കൂടുതൽ” naturally conveys the intensified, continuing hatred denoted by וַיּוֹסִפוּ עוֹד. No footnote is needed: “ഒരു സ്വപ്നം കണ്ടു” is an ordinary Malayalam expression and adequately represents the Hebrew cognate construction without obscuring meaning.'
