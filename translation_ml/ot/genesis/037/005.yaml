id: GEN.37.5
reference: Genesis 37:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּחֲלֹ֤ם יוֹסֵף֙ חֲל֔וֹם וַ/יַּגֵּ֖ד לְ/אֶחָ֑י/ו וַ/יּוֹסִ֥פוּ ע֖וֹד שְׂנֹ֥א אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: ml
  text: യോസേഫ് ഒരു സ്വപ്നം കണ്ടു; അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു; അവർ അവനെ ഇനിയും കൂടുതൽ വെറുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: യോസേഫ് ഒരു സ്വപ്നം കണ്ടു
  rationale: ഹീബ്രായിലെ സമാനധാതുവുള്ള ക്രിയയും നാമവും ചേർന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഒരു സ്വപ്നം സ്വപ്നം കണ്ടു’ എന്നാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ ‘ഒരു സ്വപ്നം കണ്ടു’ എന്നത് സ്വാഭാവികവും പൂർണ അർഥവുമുള്ള പ്രയോഗമാണ്.
- source_word: וַיַּגֵּד
  choice: പറഞ്ഞപ്പോൾ
  rationale: נגד എന്ന ക്രിയ ഇവിടെ അറിയിക്കുക/പറയുക എന്ന അർഥത്തിലാണ്. തുടർന്നുള്ള പ്രതികരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ ‘പറഞ്ഞപ്പോൾ’ എന്നു നൽകി; ‘അത്’ മുൻപുള്ള സ്വപ്നത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְאֶחָיו
  choice: തന്റെ സഹോദരന്മാരോട്
  rationale: മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ പദം ‘അവന്റെ സഹോദരന്മാർക്ക്/സഹോദരന്മാരോട്’ എന്നാണ്; മലയാളത്തിലെ പ്രതിഫലനാത്മക ഉടമസ്ഥരൂപമായ ‘തന്റെ’ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: മുമ്പിലുമധികം
  rationale: ‘വീണ്ടും/ഇനിയും കൂട്ടി’ എന്ന ഹീബ്രായീ പ്രയോഗം മുമ്പുണ്ടായിരുന്ന വെറുപ്പിന്റെ വർധനയെ സൂചിപ്പിക്കുന്നു; ‘മുമ്പിലുമധികം’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שְׂנֹא אֹתוֹ
  choice: അവനെ ... വെറുത്തു
  rationale: יסף എന്ന ക്രിയയെ പിന്തുടരുന്ന infinitive construct മലയാളത്തിൽ സ്വാഭാവികമായ സമാപിക ക്രിയയായി നൽകിയിരിക്കുന്നു.
