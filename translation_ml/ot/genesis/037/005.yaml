translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രായിലെ തുടർച്ചയായ waw-ക്രിയകളെ യാന്ത്രികമായി ആവർത്തിക്കാതെ, സംഭവക്രമവും കാരണസംബന്ധമായ പ്രതികരണവും സ്വാഭാവിക മലയാളവാക്യത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ footnote മലയാളത്തിൽ ആവശ്യമില്ല; ‘ഒരു സ്വപ്നം കണ്ടു’ തന്നെയാണ് ഹീബ്രായീ cognate construction-ന്റെ പതിവും നേരിട്ടുമുള്ള മലയാളരൂപം.
