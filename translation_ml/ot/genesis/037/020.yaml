    issue: Opening connective rendered as an explicit causal inference
    rationale: “അതുകൊണ്ട്” normally means ‘therefore/for that reason’ in Malayalam. The Hebrew וְעַתָּה here functions as an urgent discourse transition (‘now, come’) and does not require an explicit causal conclusion.
