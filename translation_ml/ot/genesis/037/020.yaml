  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: ml
  text: “ഇപ്പോൾ, വരൂ; നമുക്ക് അവനെ കൊന്ന് കുഴികളിലൊന്നിൽ[a] എറിയാം. എന്നിട്ട്, ‘ഒരു വന്യമൃഗം[b] അവനെ തിന്നുകളഞ്ഞു’ എന്നു പറയാം. അപ്പോൾ അവന്റെ സ്വപ്നങ്ങൾ എന്തായിത്തീരുമെന്ന് നമുക്കു കാണാം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജലസംഭരണിക്കുഴികളിലൊന്നിൽ.” എബ്രായപദം കുഴിയെയോ വെള്ളം സംഭരിക്കുന്ന കുഴിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു ക്രൂരമൃഗം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ തുടർച്ചയും ഉടൻ ചെയ്യാനിരിക്കുന്ന നിർദേശത്തിന്റെ സമയഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: לְכוּ
  choice: വരൂ
  rationale: ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘പോകുക’ എന്ന കല്പനയല്ല, കൂട്ടായ പ്രവർത്തനത്തിന് ആഹ്വാനം ചെയ്യുന്ന പ്രയോഗമാണ്.
- source_word: וְנַהַרְגֵהוּ
  choice: നമുക്ക് അവനെ കൊല്ലാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ ഇച്ഛാസൂചകമായ കൂട്ടായ നിർദേശം സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: וְנַשְׁלִכֵהוּ
  choice: എറിയാം
  rationale: ശക്തമായി ഇടുക/എറിയുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, ആധുനിക മലയാളരൂപം.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: കുഴികളിലൊന്നിൽ
  rationale: בּוֹר എന്ന പദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ജലസംഭരണിക്കുഴി എന്ന കൂടുതൽ നിർദിഷ്ട അർഥവും സാധ്യമാണ്.
- source_word: וְאָמַרְנוּ
  choice: എന്നിട്ട് … എന്നു പറയാം
  rationale: അവർ ആസൂത്രണം ചെയ്യുന്ന അടുത്ത നടപടിയെ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חַיָּה רָעָה
  choice: ഒരു വന്യമൃഗം
  rationale: അപകടകാരിയായ കാട്ടുമൃഗം എന്ന സന്ദർഭാർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘ദുഷ്ടമൃഗം’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: אֲכָלָתְהוּ
  choice: അവനെ തിന്നുകളഞ്ഞു
  rationale: പൂർണമായി തിന്നു നശിപ്പിച്ചു എന്ന സന്ദർഭത്തിലെ ശക്തമായ പൂർത്തീകരണഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְנִרְאֶה
  choice: നമുക്കു കാണാം
  rationale: ‘നാം കാണും’ എന്നും ‘നമുക്ക് നോക്കാം’ എന്നും ഗ്രഹിക്കാവുന്ന രൂപത്തിന്റെ സന്ദർഭോചിതമായ വെല്ലുവിളിഭാവം നിലനിർത്തുന്നു.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: അവന്റെ സ്വപ്നങ്ങൾ എന്തായിത്തീരുമെന്ന്
  rationale: സ്വപ്നങ്ങളുടെ ഫലം എന്താകുമെന്ന് പരിഹാസത്തോടെ വെല്ലുവിളിക്കുന്ന അർഥം പകർത്തുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ സ്വപ്നങ്ങളെക്കുറിച്ചുള്ള അവസാന വാക്യത്തിന്റെ ഭാവം
  choice: അവന്റെ സ്വപ്നങ്ങൾ എന്തായിത്തീരുമെന്ന് നമുക്കു കാണാം
  alternative: അവന്റെ സ്വപ്നങ്ങൾ എന്താകുമെന്ന് നമുക്കു കാണാം
  rationale: സ്വപ്നങ്ങളുടെ സത്യതയെ നേരിട്ട് നിഷേധിക്കുന്നതായി വ്യാഖ്യാനം ചേർക്കാതെ, അവയുടെ അന്തിമഫലത്തെ സഹോദരന്മാർ പരിഹസിച്ച് വെല്ലുവിളിക്കുന്ന മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. കൂട്ടക്കൊലയ്ക്കുള്ള ആഹ്വാനത്തിന്റെ നേരിട്ടുള്ള ശക്തിയും അവസാനത്തിലെ പരിഹാസഭാവവും മൃദൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
