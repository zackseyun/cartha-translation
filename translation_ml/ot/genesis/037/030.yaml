source:
  edition: WLC
  text: וַ/יָּ֥שָׁב אֶל אֶחָ֖י/ו וַ/יֹּאמַ֑ר הַ/יֶּ֣לֶד אֵינֶ֔/נּוּ וַ/אֲנִ֖י אָ֥נָה אֲנִי בָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: ml
  text: 'അവൻ തന്റെ സഹോദരന്മാരുടെ അടുക്കലേക്കു മടങ്ങിവന്നു പറഞ്ഞു[a]: “ബാലൻ ഇല്ല! ഞാനോ—ഞാൻ എവിടേക്കു പോകും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ബാലൻ അവിടെയില്ല; ഞാനോ—ഞാൻ എവിടേക്കാണ് വരുന്നത്?” ഈ ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം “ഞാൻ എവിടെ പോകും?” അല്ലെങ്കിൽ “ഞാൻ ഇനി എന്തു ചെയ്യും?” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שוב എന്ന ക്രിയയുടെ മടങ്ങുക എന്ന അർഥവും തുടർന്നുള്ള אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരുടെ അടുക്കൽ
  rationale: אֶל ദിശയെയും אֶחָיו അവന്റെ സഹോദരന്മാരെയും സൂചിപ്പിക്കുന്നു; കുടുംബസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַיֶּלֶד
  choice: ബാലൻ
  rationale: יֶלֶד എന്നത് ബാലൻ/കുട്ടി എന്നാണ്; ഇവിടെ യോസേഫിനെക്കുറിച്ചുള്ള സഹോദരന്മാരുടെ പരാമർശത്തിന് ‘ബാലൻ’ യോജിക്കുന്നു.
- source_word: אֵינֶנּוּ
  choice: കാണുന്നില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ ഇല്ല’ എന്ന അഭാവപ്രയോഗം. കുഴിയിൽ അവനെ കാണാതായ ഉടനെയുള്ള സാഹചര്യത്തിൽ ‘കാണുന്നില്ല’ സ്വാഭാവികമാണ്; അവൻ മരിച്ചെന്ന അർഥം അനാവശ്യമായി നൽകുന്നില്ല.
- source_word: וַאֲנִי
  choice: ഞാനിനി
  rationale: പ്രത്യേകമായി എടുത്തുപറയുന്ന ‘ഞാൻ’ എന്ന ഭാവവും രൂബേന്റെ ഇപ്പോഴത്തെ വ്യാകുലതയും മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: אָנָה אֲנִי בָא
  choice: എവിടെ പോകും?
  rationale: അക്ഷരാർഥത്തിന് അടുത്തത് ‘ഞാൻ എവിടേക്കാണ് വരുന്നത്?’ എങ്കിലും ഇത് ലക്ഷ്യമോ ഇനി ചെയ്യേണ്ടതോ ചോദിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ ‘എവിടെ പോകും?’ അതിന്റെ വ്യാകുലമായ ചോദ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
