  to: 'അവൻ തന്റെ സഹോദരന്മാരുടെ അടുക്കലേക്കു മടങ്ങിവന്നു പറഞ്ഞു[a]: “ബാലൻ ഇല്ല! ഞാനോ—ഞാൻ എവിടേക്കു പോകും?”'
