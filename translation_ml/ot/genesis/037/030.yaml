translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളം. രൂബേന്റെ ഞെട്ടലും മുറിഞ്ഞുപോകുന്ന വാക്യഭാവവും നിലനിർത്താൻ രണ്ടു ചെറുവാക്യങ്ങളും ആശ്ചര്യചിഹ്നവും ഉപയോഗിച്ചു; അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
