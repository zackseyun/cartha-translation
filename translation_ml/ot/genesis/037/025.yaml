id: GEN.37.25
reference: Genesis 37:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: ml
  text: പിന്നെ അവർ ഭക്ഷണം കഴിക്കാൻ ഇരുന്നു. അവർ കണ്ണുകൾ ഉയർത്തി നോക്കിയപ്പോൾ, ഇതാ, ഗിലെയാദിൽനിന്ന് വന്നുകൊണ്ടിരുന്ന യിശ്മായേല്യരുടെ ഒരു യാത്രാസംഘം. അവരുടെ ഒട്ടകങ്ങൾ സുഗന്ധപ്പശ, ബാൽസം, ലാദാനം[a] എന്നിവ ചുമന്നിരുന്നു; ആ ചരക്കുകൾ ഈജിപ്തിലേക്കു കൊണ്ടുപോകാൻ അവർ പോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലാദാനം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ചില പരിഭാഷകൾ “മൂർ” എന്നു നൽകുന്നു.
    reason: לֹט എന്ന അപൂർവപദത്തിന്റെ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയലിലുള്ള യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: ഭക്ഷണം കഴിക്കാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പം കഴിക്കാൻ’ എന്നാണെങ്കിലും, ഇവിടെ לֶחֶם പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ഹീബ്രായ പ്രയോഗമാണ്.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: യിശ്മായേല്യരുടെ ഒരു യാത്രാസംഘം
  rationale: אֹרְחָה ചരക്കുമായി സഞ്ചരിക്കുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: נְכֹאת
  choice: സുഗന്ധപ്പശ
  rationale: കൃത്യമായി തിരിച്ചറിയാൻ പ്രയാസമുള്ള ഒരു സുഗന്ധമുള്ള സസ്യോൽപ്പന്നം/പശയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘സുഗന്ധപ്പശ’ അനാവശ്യമായ സസ്യശാസ്ത്രനിശ്ചിതത്വം ഒഴിവാക്കുന്നു.
- source_word: צְרִי
  choice: ബാൽസം
  rationale: ഔഷധ-സുഗന്ധഗുണമുള്ള വിലയേറിയ പശയെയോ തൈലസ്രവത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് പ്രചാരമുള്ള കടമെടുത്ത രൂപം.
- source_word: לֹט
  choice: ലാദാനം
  rationale: ഈ പദത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; സാധ്യതയേറിയ സുഗന്ധപശയായ ലാദാനം മുഖ്യപാഠത്തിൽ നൽകി, ‘മൂർ’ എന്ന പാരമ്പര്യ വിവർത്തനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: അവ ഈജിപ്തിലേക്കു കൊണ്ടുപോകുകയായിരുന്നു
  rationale: ഹീബ്രായത്തിൽ ‘ഈജിപ്തിലേക്കു താഴേക്കു കൊണ്ടുപോകുക’ എന്ന ഭൗമദിശാഭാവമുണ്ട്; മലയാളത്തിൽ ലക്ഷ്യവും ചരക്കുമായുള്ള ബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് וְהִנֵּהയുടെ ശ്രദ്ധാകർഷകഭാവം നിലനിർത്തുന്നു. ചരക്കുകളുടെ പുരാതന നാമങ്ങളിൽ തെറ്റായ കൃത്യത ഒഴിവാക്കുകയും ആവശ്യമായിടത്ത് അടിക്കുറിപ്പ് നൽകുകയും ചെയ്തു.
