- from: പിന്നെ അവർ ഭക്ഷണം കഴിക്കാൻ ഇരുന്നു. അവർ കണ്ണുയർത്തി നോക്കിയപ്പോൾ, ഇതാ, ഗിലെയാദിൽനിന്നു വരുന്ന യിശ്മായേല്യരുടെ ഒരു യാത്രാസംഘം! അവരുടെ ഒട്ടകങ്ങൾ സുഗന്ധപ്പശ, ബാൽസം, ലാദാനം[a] എന്നിവ ചുമന്നിരുന്നു; അവ ഈജിപ്തിലേക്കു കൊണ്ടുപോകുകയായിരുന്നു.
  to: പിന്നെ അവർ ഭക്ഷണം കഴിക്കാൻ ഇരുന്നു. അവർ കണ്ണുകൾ ഉയർത്തി നോക്കിയപ്പോൾ, ഇതാ, ഗിലെയാദിൽനിന്ന് വന്നുകൊണ്ടിരുന്ന യിശ്മായേല്യരുടെ ഒരു യാത്രാസംഘം. അവരുടെ ഒട്ടകങ്ങൾ സുഗന്ധപ്പശ, ബാൽസം, ലാദാനം[a] എന്നിവ ചുമന്നിരുന്നു; ആ ചരക്കുകൾ ഈജിപ്തിലേക്കു കൊണ്ടുപോകാൻ അവർ പോകുകയായിരുന്നു.
  rationale: അവസാനത്തിലെ അവ്യക്തമായ സർവനാമം മാറ്റി, യിശ്മായേല്യർ ചരക്കുകൾ ഈജിപ്തിലേക്കു കൊണ്ടുപോകാൻ പോകുകയായിരുന്നു എന്ന ബന്ധം വ്യക്തമായി ആവിഷ്കരിച്ചു. “വന്നുകൊണ്ടിരുന്ന” എന്നത് בָּאָה എന്ന പങ്കുപ്രയോഗത്തിന്റെ തുടർച്ചയായ സഞ്ചാരഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മറ്റെല്ലാ വിവർത്തന-അടിക്കുറിപ്പ് തീരുമാനങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
