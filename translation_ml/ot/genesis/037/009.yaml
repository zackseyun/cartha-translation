revisions:
- from: 'പിന്നെ അവൻ മറ്റൊരു സ്വപ്നം കണ്ടു. അവൻ അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു: “നോക്കൂ, ഞാൻ മറ്റൊരു സ്വപ്നം കണ്ടു: സൂര്യനും ചന്ദ്രനും പതിനൊന്ന് നക്ഷത്രങ്ങളും എന്നെ വണങ്ങിക്കൊണ്ടിരുന്നു[a].”'
  to: 'പിന്നെ അവൻ മറ്റൊരു സ്വപ്നം കണ്ടു. അവൻ അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “നോക്കൂ, ഞാൻ മറ്റൊരു സ്വപ്നം കണ്ടു: സൂര്യനും ചന്ദ്രനും പതിനൊന്ന് നക്ഷത്രങ്ങളും എന്റെ മുമ്പിൽ കുമ്പിട്ടുകൊണ്ടിരുന്നു[a].”'
  rationale: The revision removes redundant phrasing in the report-to-the-brothers clause and changes the main rendering of the final verb to an unambiguously non-cultic expression of obeisance. The alternative ‘വണങ്ങുക’ and the lexical clarification remain in the footnote, preserving the verb's broader semantic range.
