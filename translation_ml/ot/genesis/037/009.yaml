source:
  edition: WLC
  text: וַ/יַּחֲלֹ֥ם עוֹד֙ חֲל֣וֹם אַחֵ֔ר וַ/יְסַפֵּ֥ר אֹת֖/וֹ לְ/אֶחָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּ֨ה חָלַ֤מְתִּֽי חֲלוֹם֙ ע֔וֹד וְ/הִנֵּ֧ה הַ/שֶּׁ֣מֶשׁ וְ/הַ/יָּרֵ֗חַ וְ/אַחַ֤ד עָשָׂר֙ כּֽוֹכָבִ֔ים מִֽשְׁתַּחֲוִ֖ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ മറ്റൊരു സ്വപ്നം കണ്ടു. അവൻ അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “നോക്കൂ, ഞാൻ മറ്റൊരു സ്വപ്നം കണ്ടു: സൂര്യനും ചന്ദ്രനും പതിനൊന്ന് നക്ഷത്രങ്ങളും എന്റെ മുമ്പിൽ കുമ്പിട്ടുകൊണ്ടിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ വണങ്ങിക്കൊണ്ടിരുന്നു.” എബ്രായക്രിയയ്ക്ക് ആഴമായി കുനിഞ്ഞ് ആദരവ് പ്രകടിപ്പിക്കുക എന്ന അർഥവും വരാം; ഇവിടെ അത് ദൈവാരാധനയെക്കാൾ ആദരപൂർവമായ കീഴടങ്ങലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: പിന്നെ അവൻ മറ്റൊരു സ്വപ്നം കണ്ടു
  rationale: വയ്യക്ഷോൽ രൂപം കഥയുടെ തുടർച്ച മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. עוֹד, אַחֵר എന്നിവ ചേർന്ന ആവർത്തനഭാവം ‘മറ്റൊരു’ എന്നതിലൂടെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: അവൻ അത് തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു
  rationale: סִפֵּר എന്നതിന്റെ സാധാരണ അർഥമായ ‘പറയുക/വിവരിക്കുക’ ലളിതവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു; אֶחָיו സന്ദർഭാനുസൃതമായി ‘തന്റെ സഹോദരന്മാർ’ എന്നാണ്.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹിന്നേയുടെ സംവാദപ്രയോഗം പഴഞ്ചൻ ശൈലി ഒഴിവാക്കി നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: ഞാൻ മറ്റൊരു സ്വപ്നം കണ്ടു
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ ‘സ്വപ്നം കണ്ടു’ എന്ന പ്രയോഗം സ്വീകരിക്കുകയും עוֹד സൂചിപ്പിക്കുന്ന ആവർത്തനം ‘മറ്റൊരു’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: രണ്ടാമത്തെ ഹിന്നേ സ്വപ്നദൃശ്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ദ്വിബിന്ദു ആ അവതരണശക്തി സ്വാഭാവികമായി വഹിക്കുകയും അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: സൂര്യനും ചന്ദ്രനും പതിനൊന്ന് നക്ഷത്രങ്ങളും
  rationale: ആകാശഗോളങ്ങളെയും സംഖ്യയെയും നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ആവർത്തിക്കുന്ന וְ ഘടകങ്ങളുടെ ഏകോപനഭാവം മലയാളത്തിലെ ‘-ഉം’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: എന്നെ വണങ്ങിക്കൊണ്ടിരുന്നു
  rationale: പങ്കാളിക്രിയ സ്വപ്നദൃശ്യത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘വണങ്ങുക’ ആദരപൂർവമായ കീഴടങ്ങലിനെയും നമസ്കാരത്തെയും ഉൾക്കൊള്ളുന്നു; ഈ സന്ദർഭത്തിൽ ദൈവാരാധന എന്ന അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: യോസേഫിന്റെ സ്വപ്നത്തിലെ מִשְׁתַּחֲוִים എന്ന ക്രിയയുടെ അർഥം
  choice: ആദരപൂർവമായ വണക്കം/കീഴടങ്ങൽ — ‘എന്നെ വണങ്ങിക്കൊണ്ടിരുന്നു’
  alternative: ‘എന്നെ ആരാധിക്കുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘എന്റെ മുമ്പിൽ കുമ്പിട്ടുകൊണ്ടിരുന്നു’
  rationale: അടുത്തുള്ള കഥാസന്ദർഭവും പിന്നീടുള്ള നിറവേറലും കുടുംബപരവും അധികാരപരവുമായ ആദരവും കീഴടങ്ങലുമാണ് സൂചിപ്പിക്കുന്നത്; ദൈവാരാധനയെന്ന പ്രത്യേക അവകാശവാദം പാഠത്തിൽ ചേർക്കാതെ, എബ്രായക്രിയയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹിന്നേയ്ക്ക് ‘നോക്കൂ’ ഉപയോഗിച്ച് നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ജീവന്തത നിലനിർത്തി. കഥയുടെ ആദ്യ രണ്ട് ക്രിയകൾ വേർതിരിച്ച വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും എബ്രായത്തിലെ സംഭവക്രമം സംരക്ഷിച്ചു.
