  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: ml
  text: യോസേഫ് തന്റെ സഹോദരന്മാരുടെ അടുത്തെത്തിയപ്പോൾ, അവർ യോസേഫിന്റെ കുപ്പായം—അവൻ ധരിച്ചിരുന്ന ആ വിശേഷപ്പെട്ട കുപ്പായം[a]—ഊരിയെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീണ്ട കൈകളുള്ള കുപ്പായം,’ ‘സമൃദ്ധമായി അലങ്കരിച്ച കുപ്പായം,’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘പല നിറങ്ങളുള്ള കുപ്പായം.’ כְּתֹנֶת הַפַּסִּים എന്ന എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: എത്തിയപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘സംഭവിച്ചു’ എന്ന പദാനുപദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: בָּא ... אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരുടെ അടുത്തെത്തി
  rationale: പുരുഷബഹുവചനമായ ‘സഹോദരന്മാർ’ സന്ദർഭത്തിലെ യോസേഫിന്റെ ആൺസഹോദരന്മാരെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘അടുത്തെത്തി’ വരവിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּפְשִׁיטוּ
  choice: അവന്റെ ദേഹത്തുനിന്ന് ഊരിയെടുത്തു
  rationale: മറ്റൊരാളുടെ വസ്ത്രം ബലമായി അഴിച്ചുമാറ്റുന്ന പ്രവൃത്തിയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: כֻּתָּנְתּוֹ
  choice: കുപ്പായം
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന כֻּתֹּנֶת എന്ന വസ്ത്രത്തിന് സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: വിശേഷപ്പെട്ട കുപ്പായം
  rationale: פַּסִּים എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമായതിനാൽ ‘പല നിറങ്ങളുള്ളത്’ എന്ന ഒറ്റ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ, വസ്ത്രത്തിന്റെ പ്രത്യേകത സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: യോസേഫ് ധരിച്ചിരുന്ന
  rationale: ‘അവന്റെ മേൽ ഉണ്ടായിരുന്ന’ എന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
