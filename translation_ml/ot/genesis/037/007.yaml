  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിതമായ ‘ഇതാ’യും സമാന്തരമായ മൂന്ന് ദൃശ്യഘട്ടങ്ങളും അർദ്ധവിരാമങ്ങളിലൂടെ സംരക്ഷിച്ചു.
