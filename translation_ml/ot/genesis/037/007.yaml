source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: ml
  text: ഇതാ, നാം വയലിന്റെ നടുവിൽ കറ്റകൾ കെട്ടിക്കൊണ്ടിരിക്കുകയായിരുന്നു; ഇതാ, എന്റെ കറ്റ എഴുന്നേറ്റു, അതും നിവർന്നുനിന്നു; ഇതാ, നിങ്ങളുടെ കറ്റകൾ എന്റെ കറ്റയുടെ ചുറ്റും വന്നു[a] അതിനെ കുമ്പിട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലയം ചെയ്തു.” എബ്രായ ക്രിയ തിരിയുകയോ ചുറ്റിവരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സാഷ്ടാംഗം വീണു വണങ്ങി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ ... ഇതാ ... ഇതാ
  rationale: സ്വപ്നവിവരണത്തിലെ സജീവതയും മൂന്ന് തവണയുള്ള ആവർത്തനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: കറ്റകൾ കെട്ടിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ധാന്യത്തണ്ടുകൾ കറ്റകളായി കെട്ടുന്ന കാർഷികപ്രവൃത്തിയെയും എബ്രായത്തിലെ ക്രിയ–നാമ ബന്ധത്തെയും വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: വയലിന്റെ നടുവിൽ
  rationale: വെറും ‘വയലിൽ’ എന്നതിനെക്കാൾ എബ്രായ പദത്തിലെ സ്ഥലസൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: קָמָה וְגַם נִצָּבָה
  choice: എഴുന്നേറ്റ് നിവർന്നുനിന്നു
  rationale: ആദ്യം ഉയരുന്നതും തുടർന്ന് ഉറച്ചുനിൽക്കുന്നതുമായ ക്രമം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; וְגַם സൂചിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ക്രിയാക്രമത്തിൽ പ്രകടമാണ്.
- source_word: תְסֻבֶּינָה
  choice: ചുറ്റും വന്നു
  rationale: തിരിയുക, ചുറ്റിവരുക എന്ന എബ്രായ ക്രിയയുടെ അടിസ്ഥാനചലനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കറ്റകൾ വലയം ചെയ്യുന്നതും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: കുമ്പിട്ടു
  rationale: സ്വയം താഴ്ത്തി വണങ്ങുന്ന പ്രവൃത്തിയെ വ്യക്തമായി പറയുന്നു; ആദരാഞ്ജലി അർപ്പിച്ചു എന്ന രാഷ്ട്രീയമോ ആരാധനാപരമോ ആയ വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: എന്റെ കറ്റ / നിങ്ങളുടെ കറ്റകൾ
  rationale: കാർഷികപ്രതീകം സ്ഥിരമായി നിലനിർത്തുകയും സ്വപ്നത്തിലെ ഏകവചന–ബഹുവചന വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
