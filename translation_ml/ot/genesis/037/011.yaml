source:
  edition: WLC
  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: ml
  text: അവന്റെ സഹോദരന്മാർക്ക് അവനോട് അസൂയ തോന്നി; എന്നാൽ അവന്റെ അപ്പൻ ആ കാര്യം മനസ്സിൽ സൂക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ വാക്ക് സൂക്ഷിച്ചു” / “പറഞ്ഞത് സൂക്ഷിച്ചു”; അതായത്, യോസേഫ് അറിയിച്ച കാര്യം അദ്ദേഹം മനസ്സിൽ വെച്ച് തുടർന്നും പരിഗണിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: അസൂയ തോന്നി
  rationale: קנא ഇവിടെ യോസേഫിന്റെ സ്വപ്നങ്ങൾ മൂലം സഹോദരന്മാരിൽ ഉണ്ടായ അസൂയയെ സൂചിപ്പിക്കുന്നു. ആ പ്രതികരണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഈ പ്രയോഗം അനുയോജ്യമാണ്.
- source_word: בּוֹ
  choice: അവനോട്
  rationale: קנא എന്ന ക്രിയയോടുകൂടിയ בְּ അസൂയയുടെ ലക്ഷ്യത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘അവനോട് അസൂയ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: കഥാസന്ദർഭത്തിലെ യോസേഫിന്റെ സഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: וְאָבִיו
  choice: എന്നാൽ അവന്റെ അപ്പൻ
  rationale: וְ എന്നതിന് അടിസ്ഥാനമായി ‘ഒപ്പം/ഉം’ എന്ന അർഥമുണ്ടെങ്കിലും, സഹോദരന്മാരുടെ അസൂയയും അപ്പന്റെ ചിന്താപൂർവമായ പ്രതികരണവും തമ്മിലുള്ള വ്യത്യാസം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שָׁמַר
  choice: മനസ്സിൽ സൂക്ഷിച്ചു
  rationale: שׁמר എന്നത് അടിസ്ഥാനമായി ‘കാക്കുക/സൂക്ഷിക്കുക’ എന്നാണ്; ഇവിടെ പറഞ്ഞ കാര്യം ശ്രദ്ധയോടെ ഓർത്തുവെക്കുകയും പരിഗണിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്യുന്നതാണ് സന്ദർഭാർഥം.
- source_word: אֶת־הַדָּבָר
  choice: ആ കാര്യം
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്,’ ‘പറഞ്ഞത്,’ ‘കാര്യം’ എന്നീ അർഥസാധ്യതകളുണ്ട്. യോസേഫ് അറിയിച്ച സ്വപ്നവും അതിന്റെ പ്രാധാന്യവും ഉൾക്കൊള്ളാൻ ‘ആ കാര്യം’ സ്വാഭാവികവും വിശാലവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. പിതാവിനെ കുടുംബകഥനത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘അപ്പൻ’ ഉപയോഗിച്ചു; മൂലത്തിലെ ‘സൂക്ഷിച്ചു’ എന്ന ദൃശ്യഭാവം ‘മനസ്സിൽ സൂക്ഷിച്ചു’ എന്ന മലയാള പ്രയോഗത്തിൽ നിലനിർത്തി.
