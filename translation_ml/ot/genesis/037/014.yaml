translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ച שְׁלוֹם ഒറ്റ സംയുക്തപ്രയോഗമായ ‘സഹോദരന്മാരുടെയും ആട്ടിൻപറ്റത്തിന്റെയും സുഖവിവരം’ എന്നതിലൂടെ ഇരുവർക്കും ഒരുപോലെ ബാധകമാക്കി. സർവനാമങ്ങളുടെ ആവർത്തനം മൂലപാഠത്തെ പിന്തുടരുന്നു; മുൻസന്ദർഭം വ്യക്തികളെ തിരിച്ചറിയിക്കുന്നു.
