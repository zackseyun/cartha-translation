reference: Genesis 37:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നീ ഒന്നു പോയി നിന്റെ സഹോദരന്മാർ സുഖമായിരിക്കുന്നോ എന്നും ആട്ടിൻപറ്റം സുഖമായിരിക്കുന്നോ എന്നും നോക്കി എന്നെ അറിയിക്കൂ.” അങ്ങനെ അവൻ അവനെ ഹെബ്രോൻ താഴ്‌വരയിൽനിന്ന് അയച്ചു; അവൻ ശെഖേമിൽ എത്തി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: നീ ഇപ്പോൾ പോയി
  rationale: ആജ്ഞാരൂപമായ לֶךְ എന്നതും അഭ്യർഥനയെ മൃദുവാക്കുന്ന נָא എന്ന കണികയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: רְאֵה אֶת־שְׁלוֹם
  choice: സുഖവിവരം അന്വേഷിച്ച്
  rationale: ראה എന്ന ‘നോക്കുക/അറിയുക’ എന്ന ക്രിയയും ഇവിടെ ക്ഷേമസ്ഥിതിയെ സൂചിപ്പിക്കുന്ന שׁלום എന്ന നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം നൽകുന്നു; സഹോദരന്മാർക്കും ആട്ടിൻപറ്റത്തിനും ഒരേ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരുടെ
  rationale: സന്ദർഭത്തിൽ യോസേഫിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിന്റെ
  rationale: צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടനാമമായി ‘ആട്ടിൻപറ്റം’ ഉപയോഗിക്കുന്നു, ഇനം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: എന്നെ അറിയിക്കൂ
  rationale: അക്ഷരാർഥത്തിലെ ‘എനിക്ക് വാക്ക് മടക്കിക്കൊണ്ടുവരുക’ എന്നത് ഇവിടെ വിവരം തിരികെ അറിയിക്കുക എന്ന ഭാഷാശൈലിയാണ്; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: ഹെബ്രോൻ താഴ്‌വരയിൽനിന്ന്
  rationale: עֵמֶק എന്ന ഭൂമിശാസ്ത്രപദമായ ‘താഴ്‌വര’യും ഹെബ്രോനുമായുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שְׁכֶמָה
  choice: ശെഖേമിൽ എത്തി
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക -ה ശെഖേമിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; ‘എത്തി’ എന്ന സന്ദർഭത്തിലെ ക്രിയയോടൊപ്പം മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം അധികരണരൂപത്തിൽ സ്വാഭാവികമായി വരുന്നു.
