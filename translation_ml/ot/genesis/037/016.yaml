  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ എന്റെ സഹോദരന്മാരെ അന്വേഷിക്കുകയാണ്. അവർ എവിടെയാണ് മേയ്ക്കുന്നതെന്ന്[a] ദയവായി എന്നോടു പറയൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇടയവേല ചെയ്യുന്നത്” / “ആട്ടിൻപറ്റത്തെ മേയ്ക്കുന്നത്.” എബ്രായ കൃദന്തരൂപം മേച്ചിൽസ്ഥലത്ത് മൃഗങ്ങളെ പരിപാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വിവരണത്തിലെ സാധാരണ wayyiqtol ക്രിയാരൂപം. സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ തുടക്കത്തിലെ ‘അപ്പോൾ/എന്നിട്ട്’ നിർബന്ധമല്ല.
- source_word: אֶת אַחַי
  choice: എന്റെ സഹോദരന്മാരെ
  rationale: אֶת നിർദിഷ്ട കർമത്തെ സൂചിപ്പിക്കുന്നു; אַחַי എന്നത് സന്ദർഭത്തിൽ യോസേഫിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: ഞാൻ ... അന്വേഷിക്കുകയാണ്
  rationale: സ്വതന്ത്ര സർവനാമവും വർത്തമാന കൃദന്തരൂപവും ചേർന്ന് തുടരുന്ന, ഉടനെയുള്ള തിരച്ചിലിനെ സൂചിപ്പിക്കുന്നു; ‘അന്വേഷിക്കുകയാണ്’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַגִּידָה נָּא לִי
  choice: ദയവായി എന്നോടു പറയൂ
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫിൽ ആജ്ഞാരൂപത്തോടൊപ്പം נָא വരുന്നതിനാൽ വിനയപൂർവമായ അപേക്ഷയാണ്; ഈ മലയാളപ്രയോഗം ആജ്ഞയും വിനയവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: אֵיפֹה הֵם
  choice: അവർ എവിടെയാണ്
  rationale: സ്ഥലം ചോദിക്കുന്ന אֵיפֹהയും വ്യക്തമായി നൽകിയിരിക്കുന്ന ബഹുവചന സർവനാമമായ הֵםഉം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: רֹעִים
  choice: മേയ്ക്കുന്നത്
  rationale: רעה എന്ന ക്രിയയുടെ ഖാൽ കൃദന്തരൂപം മേച്ചിൽസ്ഥലത്ത് മൃഗങ്ങളെ പരിപാലിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും അത് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
