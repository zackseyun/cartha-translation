  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו הִנֵּ֗ה בַּ֛עַל הַ/חֲלֹמ֥וֹת הַלָּזֶ֖ה בָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: ml
  text: 'അവർ പരസ്പരം പറഞ്ഞു: “നോക്കൂ, ഈ സ്വപ്നക്കാരൻ[a] വരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘സ്വപ്നങ്ങളുടെ ഉടമ’ അല്ലെങ്കിൽ ‘സ്വപ്നങ്ങളുടെ യജമാനൻ.’ സഹോദരന്മാരുടെ പരിഹാസഭാവം പ്രതിഫലിപ്പിക്കാൻ ഹീബ്രു പ്രയോഗം ഇവിടെ ‘സ്വപ്നക്കാരൻ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയ്യമർ ക്രിയാരൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയ്ക്കായി ‘അവർ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: אִישׁ אֶל אָחִיו
  choice: അവർ തമ്മിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരുവൻ തന്റെ സഹോദരനോട്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഇത് പരസ്പരപ്രയോഗമാണ്; ‘അവർ തമ്മിൽ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ തുല്യം.
- source_word: בַּעַל הַחֲלֹמוֹת הַלָּזֶה
  choice: ആ സ്വപ്നക്കാരൻ
  rationale: בַּעַל הַחֲלֹמוֹת എന്നത് അക്ഷരാർഥത്തിൽ ‘സ്വപ്നങ്ങളുടെ ഉടമ/യജമാനൻ’ എന്നാണ്; ഇവിടെ സഹോദരന്മാരുടെ പരിഹാസഭാവത്തിൽ ‘സ്വപ്നക്കാരൻ’ സ്വാഭാവികമാണ്. הַלָּזֶה ചൂണ്ടിക്കാട്ടലിനൊപ്പം അവജ്ഞയും വഹിക്കാവുന്നതിനാൽ ‘ആ’ എന്നു നൽകി.
- source_word: בָּא
  choice: വരുന്നു
  rationale: בוא എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം നടന്നുകൊണ്ടിരിക്കുന്ന സമീപനത്തെ സൂചിപ്പിക്കുന്നു; ‘വരുന്നു’ അതിനെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
