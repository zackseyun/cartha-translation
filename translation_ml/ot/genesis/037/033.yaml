id: GEN.37.33
reference: Genesis 37:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכִּירָ֤/הּ וַ/יֹּ֨אמֶר֙ כְּתֹ֣נֶת בְּנִ֔/י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Joseph has surely been torn to pieces.”
translation:
  language: ml
  text: 'അവൻ അത് തിരിച്ചറിഞ്ഞ് പറഞ്ഞു: “ഇത് എന്റെ മകന്റെ അങ്കിയാണ്. ഒരു കാട്ടുമൃഗം അവനെ തിന്നുകളഞ്ഞു. യോസേഫ് നിശ്ചയമായും കടിച്ചുകീറപ്പെട്ടിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ ക്രിയയ്ക്ക് ഊന്നൽ നൽകിയിരിക്കുന്നു: അക്ഷരാർഥത്തിൽ, “കടിച്ചുകീറി, കടിച്ചുകീറപ്പെട്ടിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: അവൻ അത് തിരിച്ചറിഞ്ഞ്
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള נכר ഇവിടെ ‘തിരിച്ചറിയുക’ എന്നാണ്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം അങ്കിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അത്’ എന്നു നൽകി.
- source_word: כְּתֹנֶת בְּנִי
  choice: എന്റെ മകന്റെ അങ്കി
  rationale: כְּתֹנֶת ശരീരത്തിൽ ധരിക്കുന്ന നീണ്ട വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമായ ‘അങ്കി’ തിരഞ്ഞെടുത്തു.
- source_word: חַיָּה רָעָה
  choice: ഒരു കാട്ടുമൃഗം
  rationale: ഈ സന്ദർഭത്തിൽ חַיָּה ഒരു വന്യമൃഗത്തെയും רָעָה അതിന്റെ അപകടകരമായ സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു. ‘ദുഷ്ട’ എന്നു പറഞ്ഞ് ധാർമ്മിക അർഥം ചുമത്താതെ, സ്വാഭാവിക മലയാളത്തിൽ ‘കാട്ടുമൃഗം’ എന്നു നൽകി.
- source_word: אֲכָלָתְהוּ
  choice: അവനെ തിന്നുകളഞ്ഞു
  rationale: മൃഗം ഇരയെ പൂർണമായി ഭക്ഷിച്ചതെന്ന സന്ദർഭബോധം മലയാളത്തിലെ ‘തിന്നുകളഞ്ഞു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: טָרֹף טֹרַף
  choice: നിശ്ചയമായും കടിച്ചുകീറപ്പെട്ടിരിക്കുന്നു
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും നിഷ്ക്രിയ ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘നിശ്ചയമായും’ ആ ഊന്നലും ‘കടിച്ചുകീറപ്പെട്ടിരിക്കുന്നു’ മൃഗാക്രമണത്തിന്റെ അർഥവും നൽകുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതുമായ വ്യക്തിനാമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായ മൂലത്തിലെ ആവർത്തനാത്മക ഊന്നൽ മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായി നൽകി; രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
