  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: ml
  text: 'അവന്റെ സഹോദരന്മാർ അവനോടു പറഞ്ഞു: “നീ ശരിക്കും ഞങ്ങളുടെമേൽ രാജാവായി വാഴുമോ? നീ ശരിക്കും ഞങ്ങളെ ഭരിക്കുമോ?” അങ്ങനെ, അവന്റെ സ്വപ്നങ്ങളും അവന്റെ വാക്കുകളും നിമിത്തം അവർ അവനെ പിന്നെയും അധികം വെറുത്തു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: നീ ഞങ്ങളുടെമേൽ രാജാവായി വാഴുമെന്നോ?
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനം ശക്തമായ ചോദ്യം സൂചിപ്പിക്കുന്നു; ‘രാജാവായി വാഴുക’ എന്നത് מלך എന്ന ക്രിയയുടെ രാജത്വസൂചന വ്യക്തമാക്കുന്നു.
- source_word: אִם מָשׁוֹל תִּמְשֹׁל
  choice: നീ ഞങ്ങളെ ഭരിക്കുമെന്നോ?
  rationale: משׁל എന്ന ക്രിയയിലെ ആധിപത്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഭരിക്കുക’ എന്നു നൽകി; ആവർത്തനത്തിന്റെ ഊന്നൽ ചോദ്യത്തിന്റെ പരിഹാസഭാവത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: അവർ അവനെ പിന്നെയും അധികം വെറുത്തു
  rationale: יסף + עוד എന്ന വർധനാഭാവം ‘പിന്നെയും അധികം’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: അവന്റെ സ്വപ്നങ്ങളും അവന്റെ വാക്കുകളും നിമിത്തം
  rationale: രണ്ടു കാരണങ്ങളെയും വേർതിരിച്ചുതന്നെ നിലനിർത്തുകയും עַל എന്ന കാരണാർഥം ‘നിമിത്തം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ ഭാവി അധികാരത്തെക്കുറിച്ചുള്ള സഹോദരന്മാരുടെ ചോദ്യങ്ങളുടെ സ്വരം
  choice: നേരിട്ടുള്ള, അവിശ്വാസവും എതിർപ്പും നിറഞ്ഞ ചോദ്യങ്ങളായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘നീ ശരിക്കും...?’ എന്ന ഊന്നൽപദം രണ്ടിടത്തും ചേർക്കുക
  rationale: ഹീബ്രുവിലെ infinitive absolute + finite verb ഘടന ഊന്നൽ നൽകുന്നു; എന്നാൽ മലയാളത്തിൽ ‘രാജാവായി വാഴുമെന്നോ?’ എന്നും ‘ഭരിക്കുമെന്നോ?’ എന്നും ഉള്ള രൂപങ്ങൾ സന്ദർഭത്തിലെ അവിശ്വാസപരിഹാസം സ്വാഭാവികമായി വഹിക്കുന്നു, ഭാവി വാഴ്ചയുടെ സ്വഭാവം വിശദീകരിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘രാജാവായി വാഴുക’ എന്നും ‘ഭരിക്കുക’ എന്നും ഉപയോഗിച്ച് മൂലത്തിലെ രണ്ട് സമാന്തര ക്രിയകളുടെ വ്യത്യാസം നിലനിർത്തി.
