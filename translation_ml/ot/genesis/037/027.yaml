  naturalness: ‘വരൂ, നമുക്ക് ... വിൽക്കാം’ സ്വാഭാവികമാണ്. ‘അവന്റെമേൽ കൈവെക്കരുത്’ സാധാരണ മലയാളത്തിൽ നേരിട്ടുള്ള ഉപദ്രവം/ആക്രമണം സൂചിപ്പിക്കുന്ന നല്ല പ്രയോഗമാണ്. ‘അവന്റെ വാക്കു കേട്ടു’ സ്വാഭാവികമായിരുന്നാലും വാചകത്തിൽ ഇല്ലാത്ത ‘വാക്കു’ ചേർക്കുന്നു. ‘നമ്മുടെ സ്വന്തം മാംസം’ മലയാളത്തിൽ മനുഷ്യനെ സൂചിപ്പിക്കുമ്പോൾ അസ്വാഭാവികവും ശരീരമാംസത്തെ പ്രധാനമായി സൂചിപ്പിക്കുന്നതുമാണ്.
  terminology: ‘യിശ്മായേല്യർ’യും ‘സഹോദരൻ’യും യോജിച്ചിരിക്കുന്നു. ‘നമ്മുടെ സ്വന്തം ശരീരം’ എബ്രായ ബശാർ എന്ന രക്തബന്ധപ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും മലയാളത്തിലെ സ്വീകരിക്കാവുന്ന ശൈലിയും നിലനിർത്തുന്നു. അവസാന ക്രിയയ്ക്ക് ‘അവർ അവനെ ശ്രദ്ധിച്ചു കേട്ടു’ എന്നത് שמעയുടെ hear/heed പരിധി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പിൽ ‘സമ്മതിച്ചു’ എന്ന സന്ദർഭാർഥം സൂചിപ്പിക്കാം, എന്നാൽ ‘അനുസരിച്ചു’ എന്നതിനെ പ്രധാന സാധ്യതയായി ഉന്നയിക്കേണ്ടതില്ല.
