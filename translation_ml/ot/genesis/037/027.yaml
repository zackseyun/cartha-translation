reference: Genesis 37:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְכ֞וּ וְ/נִמְכְּרֶ֣/נּוּ לַ/יִּשְׁמְעֵאלִ֗ים וְ/יָדֵ֨/נוּ֙ אַל תְּהִי ב֔/וֹ כִּֽי אָחִ֥י/נוּ בְשָׂרֵ֖/נוּ ה֑וּא וַֽ/יִּשְׁמְע֖וּ אֶחָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: ml
  text: “വരൂ, നമുക്ക് അവനെ യിശ്മായേല്യർക്കു വിൽക്കാം. നാം അവന്റെമേൽ കൈവെക്കരുത്[a]; കാരണം അവൻ നമ്മുടെ സഹോദരൻ, നമ്മുടെ സ്വന്തം ശരീരം[b] തന്നെയല്ലോ.” അവന്റെ സഹോദരന്മാർ അവനെ ശ്രദ്ധിച്ചു കേട്ടു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘നമ്മുടെ കൈ അവന്റെമേൽ ഉണ്ടാകരുത്.’ നേരിട്ട് അവനെ ഉപദ്രവിക്കരുത് എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നമ്മുടെ സ്വന്തം ബന്ധു.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ശ്രദ്ധിച്ചു കേട്ടു’ എന്നത് ഇവിടെ ‘സമ്മതിച്ചു’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: വരൂ
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ ഒരു പ്രവൃത്തിക്കു പ്രേരിപ്പിക്കുന്ന വ്യവഹാരപ്രയോഗമാണ്; ‘വരൂ’ അതിന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: וְנִמְכְּרֶנּוּ
  choice: നമുക്ക് അവനെ … വിൽക്കാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ നിർദേശാത്മക ഭാവം കൂട്ടായ ഒരു നിർദേശം പ്രകടിപ്പിക്കുന്നു; ‘നമുക്ക് … വിൽക്കാം’ ആ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: യിശ്മായേല്യർക്കു
  rationale: മുൻപ്രത്യയവും നിർദിഷ്ട ജനവിഭാഗനാമവും ചേർന്ന രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവിക ദാതൃവിഭക്തിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: നാം അവന്റെമേൽ കൈവെക്കരുത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നമ്മുടെ കൈ അവന്റെമേൽ ഉണ്ടാകരുത്’ എന്നാണ്. നേരിട്ട് ഉപദ്രവിക്കുകയോ കൊല്ലുകയോ ചെയ്യരുതെന്ന ആശയം സൂചിപ്പിക്കുന്ന കൈയുടെ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: യൂദയുടെ നിർദേശത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധപദത്തിന്റെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: אָחִינוּ
  choice: നമ്മുടെ സഹോദരൻ
  rationale: അടുത്ത രക്തബന്ധം സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: בְשָׂרֵנוּ
  choice: നമ്മുടെ സ്വന്തം മാംസം
  rationale: രക്തബന്ധം സൂചിപ്പിക്കുന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം നിലനിർത്തുകയും ‘സ്വന്തം’ ചേർത്ത് മലയാളത്തിൽ അതിന്റെ ബന്ധുത്വബലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ അവന്റെ വാക്കു കേട്ടു
  rationale: שמע എന്ന പദത്തിന് കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘വാക്കു കേട്ടു’ എന്ന മലയാളപ്രയോഗം കേൾവിയെയും നിർദേശം സ്വീകരിച്ചതിനെയും ഒരുപോലെ തുറന്നുവയ്ക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘കൈ’, ‘മാംസം’ എന്നീ മൂർത്തരൂപങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടാതെ നിലനിർത്തി; അവസാന ക്രിയയിലെ ‘കേട്ടു/അനുസരിച്ചു’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
