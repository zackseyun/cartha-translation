    rationale: וַיִּשְׁמְעוּ אֶחָיו എന്നത് അക്ഷരാർഥത്തിൽ ‘അവന്റെ സഹോദരന്മാർ കേട്ടു/ശ്രദ്ധിച്ചു കേട്ടു’ എന്നാണ്. പ്രസംഗത്തിന്റെ വസ്തു സന്ദർഭത്തിൽ വ്യക്തമെങ്കിലും അതു വിവർത്തനത്തിൽ നാമമായി ചേർക്കുന്നത് അനാവശ്യ വിശദീകരണമാണ്.
