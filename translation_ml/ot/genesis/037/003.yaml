  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ‘വാർധക്യത്തിലെ മകൻ’ എന്ന മൂലശൈലി സംരക്ഷിച്ചു. വസ്ത്രത്തിന്റെ അനിശ്ചിത വിവരണം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും തുറന്നുവെച്ചു; പരമ്പരാഗത ‘പല നിറങ്ങളുള്ള’ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
