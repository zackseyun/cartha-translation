  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: ml
  text: ഇസ്രായേൽ തന്റെ എല്ലാ പുത്രന്മാരെക്കാളും യോസേഫിനെ സ്നേഹിച്ചു; കാരണം, അവൻ തന്റെ വാർധക്യത്തിലെ മകനായിരുന്നു. ഇസ്രായേൽ അവനുവേണ്ടി വിശേഷമായി അലങ്കരിച്ച ഒരു അങ്കി[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “പല നിറങ്ങളുള്ള അങ്കി.” എബ്രായപ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; നിറങ്ങളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനു പകരം, അത് വിശേഷമായി അലങ്കരിച്ച അങ്കിയെയോ കൈത്തണ്ടുകളിലേക്കും കണങ്കാലുകളിലേക്കും നീളുന്ന അങ്കിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായപാഠം ഇവിടെ യാക്കോബ് എന്നതിനു പകരം ഇസ്രായേൽ എന്ന വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. വാക്യാരംഭത്തിലെ וְ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אָהַב
  choice: സ്നേഹിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സ്നേഹിച്ചു’ എന്നാണ്. സന്ദർഭത്തിൽ പക്ഷപാതം ഉൾക്കൊള്ളാമെങ്കിലും ‘കൂടുതൽ പ്രിയം കാണിച്ചു’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: מִכָּל בָּנָיו
  choice: തന്റെ എല്ലാ പുത്രന്മാരെക്കാളും
  rationale: מִן ചേർന്ന പ്രയോഗത്തിന്റെ താരതമ്യാർഥവും בָּנָיו എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ ‘പുത്രന്മാർ’ എന്ന വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ പ്രത്യേക സ്നേഹത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: അവൻ തന്റെ വാർധക്യത്തിലെ മകനായിരുന്നു
  rationale: ഇസ്രായേലിന്റെ വാർധക്യവുമായി ബന്ധപ്പെട്ട മകൻ എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തന്റെ’ എന്നത് ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְעָשָׂה לוֹ
  choice: ഇസ്രായേൽ അവനുവേണ്ടി ... ഉണ്ടാക്കി
  rationale: לוֹ എന്നതിലെ ‘അവനുവേണ്ടി’ എന്ന ഗുണഭോക്തൃഭാവം നിലനിർത്തുന്നു. മലയാളത്തിൽ കർത്താവിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ഇസ്രായേൽ’ ആവർത്തിച്ചു.
- source_word: כְּתֹנֶת
  choice: അങ്കി
  rationale: ശരീരത്തിൽ ധരിക്കുന്ന ട്യൂണിക് സ്വഭാവമുള്ള വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ് ‘അങ്കി’.
- source_word: פַּסִּים
  choice: വിശേഷമായി അലങ്കരിച്ച
  rationale: പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. കൈമുട്ടുകളിലേക്കും കണങ്കാലുകളിലേക്കും നീളുന്നതാകാം, അലങ്കാരസമൃദ്ധമായ വസ്ത്രമാകാം; അതിനാൽ ഒരു നിർദിഷ്ട വ്യാഖ്യാനം അതിരുകടന്ന് ഉറപ്പിക്കാതെ വായനാസൗകര്യമുള്ള പൊതുവായ വിവർത്തനം മുഖ്യപാഠത്തിൽ നൽകി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
