id: GEN.37.10
reference: Genesis 37:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: ml
  text: 'അവൻ ആ സ്വപ്നം തന്റെ അപ്പനോടും സഹോദരന്മാരോടും പറഞ്ഞു. അവന്റെ അപ്പൻ അവനെ ശാസിച്ചു; അവനോടു ചോദിച്ചു: “നീ കണ്ട ഈ സ്വപ്നം എന്താണ്? ഞാനും നിന്റെ അമ്മയും നിന്റെ സഹോദരന്മാരും നിന്റെ മുമ്പിൽ നിലംവരെ കുനിയാൻ ശരിക്കും വരുമോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീഴാൻ ശരിക്കും വരുമോ?” എബ്രായക്രിയ ആഴമുള്ള വണക്കത്തെ സൂചിപ്പിക്കാം; ഇവിടെ അതിന് ആരാധന എന്ന അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: പറഞ്ഞു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘പറയുക/വിവരിക്കുക’ എന്നാണ് അർഥം. സന്ദർഭത്തിൽ പറഞ്ഞത് സ്വപ്നമാണെന്നു സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘ആ സ്വപ്നം ... പറഞ്ഞു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: אָבִיו ... אֶחָיו
  choice: തന്റെ അപ്പൻ ... സഹോദരന്മാർ
  rationale: ബന്ധസൂചക പദങ്ങൾ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ കുടുംബസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘അപ്പൻ’ ഉപയോഗിച്ചു; പുരുഷലിംഗ ബഹുവചനം ‘സഹോദരന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: וַיִּגְעַר בּוֹ
  choice: അവനെ ശാസിച്ചു
  rationale: גער ശക്തമായ വാക്കാലുള്ള ശാസനയെയോ ശകാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ശാസിച്ചു’ അതിന്റെ ബലം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: നീ കണ്ട ഈ സ്വപ്നം എന്താണ്?
  rationale: എബ്രായത്തിലെ ചോദ്യം നിലനിർത്തുന്നു. ‘സ്വപ്നം സ്വപ്നംകണ്ടു’ എന്ന ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അർഥം നഷ്ടപ്പെടുത്താതെ ‘നീ കണ്ട ഈ സ്വപ്നം’ എന്നു നൽകി.
- source_word: הֲבוֹא נָבוֹא
  choice: വന്ന് ... എന്നാണോ?
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഫൈനിറ്റ് ക്രിയയും ചേർന്നുള്ള ഊന്നൽ അവിശ്വാസഭരിതമായ ചോദ്യരൂപത്തിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കൃത്രിമമായ ‘തീർച്ചയായും വരുമോ’ ഒഴിവാക്കി.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: ഞാനും നിന്റെ അമ്മയും സഹോദരന്മാരും
  rationale: മൂലത്തിലെ പട്ടികക്രമവും ബന്ധങ്ങളും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: നിന്റെ മുമ്പിൽ ... കുനിയുക
  rationale: ഇവിടെ השתחוה ആരാധനയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; കീഴടങ്ങലോ ബഹുമാനമോ പ്രകടിപ്പിക്കുന്ന ആഴമുള്ള വണക്കം എന്ന സാമൂഹിക അർഥമാണ് സന്ദർഭോചിതം.
- source_word: אָרְצָה
  choice: നിലംവരെ
  rationale: ദിശാസൂചകമായ രൂപം ഭൂമിയിലേക്കോ നിലത്തേക്കോ ആഴത്തിൽ കുനിയുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിലംവരെ’ മലയാളത്തിൽ ആ ചലനം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ആരാധനാതീത സന്ദർഭത്തിലെ השתחוה എന്ന ക്രിയയുടെ അർഥം
  choice: നിന്റെ മുമ്പിൽ നിലംവരെ കുനിയുക
  alternative: നിന്നെ ആരാധിക്കുക; നിന്റെ മുമ്പിൽ സാഷ്ടാംഗം വീഴുക
  rationale: ദൈവിക സന്ദർഭങ്ങളിൽ ഈ ക്രിയയ്ക്ക് ആരാധന എന്ന അർഥമുണ്ടാകാം. എന്നാൽ ഇവിടെ യോസേഫിന്റെ സ്വപ്നത്തോടുള്ള യാക്കോബിന്റെ പ്രതികരണത്തിൽ കുടുംബാംഗങ്ങളുടെ അധീനതയെയോ ആഴമുള്ള വണക്കത്തെയോ ആണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പാഠം ആവശ്യപ്പെടാത്ത ആരാധനാസംബന്ധമായ ആശയം ചേർക്കാതെ സാമൂഹിക അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സംഭാഷണത്തിലെ അതിശയവും ശാസനയും ചോദ്യംവഴി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
