language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל יוֹסֵ֗ף הֲ/ל֤וֹא אַחֶ֨י/ךָ֙ רֹעִ֣ים בִּ/שְׁכֶ֔ם לְכָ֖/ה וְ/אֶשְׁלָחֲ/ךָ֣ אֲלֵי/הֶ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ യോസേഫിനോടു പറഞ്ഞു: “നിന്റെ സഹോദരന്മാർ ശെഖേമിൽ കന്നുകാലിക്കൂട്ടത്തെ മേയ്ക്കുകയല്ലേ?[a] വരൂ, ഞാൻ നിന്നെ അവരുടെ അടുക്കലേക്ക് അയയ്ക്കാം.” അവൻ അദ്ദേഹത്തോടു, “ഇതാ, ഞാൻ,” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കന്നുകാലിക്കൂട്ടത്തെ പരിപാലിക്കുകയല്ലേ?” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: רֹעִים എന്ന പദം മേയിക്കുന്ന പ്രവൃത്തിയെയും കന്നുകാലിക്കൂട്ടത്തെ പൊതുവായി പരിപാലിക്കുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായ പാഠത്തിൽ ‘യാക്കോബ്’ എന്നല്ല, ‘ഇസ്രായേൽ’ എന്ന പേരാണ്; അതിനാൽ അതുതന്നെ ലിപ്യന്തരിച്ചു.
- source_word: הֲלוֹא
  choice: മേയിക്കുകയല്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയമുള്ള പുരുഷലിംഗ ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം.
- source_word: רֹעִים
  choice: ആടുമാടുകളെ മേയിക്കുക
  rationale: רעה എന്ന ധാതുവിന്റെ കന്നുകാലിക്കൂട്ടത്തെ പരിപാലിക്കുകയും മേയിക്കുകയും ചെയ്യുന്ന പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; കന്നുകാലികളുടെ ഇനം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ ‘ആടുമാടുകൾ’ ഉപയോഗിച്ചു.
- source_word: בִּשְׁכֶם
  choice: ശെഖേമിൽ
  rationale: സ്ഥലസൂചകമായ בְּ സ്വാഭാവികമായി ‘-യിൽ’ എന്നും സ്ഥലനാമം ശെഖേം എന്നും നൽകി.
- source_word: לְכָה
  choice: വരൂ
  rationale: ക്ഷണം/ആഹ്വാനം സൂചിപ്പിക്കുന്ന പുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: וְאֶשְׁלָחֲךָ
  choice: ഞാൻ നിന്നെ ... അയയ്ക്കാം
  rationale: ആജ്ഞാരൂപത്തിനു പിന്നാലെയുള്ള ഒന്നാംപുരുഷ ഉദ്ദേശഭാവത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘അയയ്ക്കാം’ കൊണ്ടു പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲלֵיהֶם
  choice: അവരുടെ അടുക്കലേക്ക്
  rationale: സഹോദരന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമവും ദിശാബോധവും സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּנִי
  choice: ഞാൻ ഇതാ
  rationale: സന്നദ്ധമായ സ്വയംസമർപ്പണത്തെയും സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രതികരണസൂത്രത്തിന്റെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ മൂലപാഠപ്രകാരം ലിപ്യന്തരിച്ചു; അലങ്കാരചോദ്യവും ‘ഞാൻ ഇതാ’ എന്ന പ്രതികരണസൂത്രവും നിലനിർത്തി.
