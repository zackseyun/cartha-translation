id: GEN.37.35
reference: Genesis 37:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ പുത്രന്മാരും പുത്രിമാരും എല്ലാവരും അവനെ ആശ്വസിപ്പിക്കാൻ എഴുന്നേറ്റു. എന്നാൽ അവൻ ആശ്വാസം സ്വീകരിക്കാൻ വിസമ്മതിച്ചു. അവൻ പറഞ്ഞു: “ഞാൻ ദുഃഖിതനായി എന്റെ മകന്റെ അടുക്കലേക്ക്, ഷെയോളിലേക്ക്[a] ഇറങ്ങിച്ചെല്ലും[b].” അങ്ങനെ അവന്റെ പിതാവ് അവനെച്ചൊല്ലി കരഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “കല്ലറയിലേക്ക്” അല്ലെങ്കിൽ “മരിച്ചവരുടെ ലോകത്തിലേക്ക്”; എബ്രായം: “ഷെയോൾ.”'
    reason: lexical_alternative
  - marker: b
    text: 'വാക്യം ഇങ്ങനെയും മനസ്സിലാക്കാം: “ഞാൻ എന്റെ മകനെച്ചൊല്ലി ദുഃഖിച്ചുകൊണ്ട് ഷെയോളിലേക്ക് ഇറങ്ങിച്ചെല്ലും.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം നിലനിർത്തുന്നു; ആശ്വസിപ്പിക്കാൻ അവർ പ്രവർത്തനസജ്ജരായതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָל־בָּנָיו וְכָל־בְּנֹתָיו
  choice: അവന്റെ പുത്രന്മാരും പുത്രിമാരും എല്ലാവരും
  rationale: എബ്രായത്തിലെ പുത്രന്മാർ–പുത്രിമാർ എന്ന വ്യക്തമായ വേർതിരിവ് ‘മക്കൾ’ എന്നു പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לְנַחֲמוֹ
  choice: അവനെ ആശ്വസിപ്പിക്കാൻ
  rationale: വിയോഗദുഃഖത്തിൽ ആശ്വാസം നൽകുക എന്ന പിയേൽ രൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: ആശ്വാസം സ്വീകരിക്കാൻ വിസമ്മതിച്ചു
  rationale: נחם എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിലുള്ള പ്രത്യാവർത്തക/കർമണി ഭാവവും מאן സൂചിപ്പിക്കുന്ന സജീവമായ വിസമ്മതവും വ്യക്തമായി നൽകുന്നു.
- source_word: אֵרֵד
  choice: ഞാൻ ... ഇറങ്ങിച്ചെല്ലും
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്ക് പോകുക’ എന്ന ദിശാഭാവം ഷെയോളിലേക്കുള്ള ഗമനവുമായി ചേർത്ത് നിലനിർത്തുന്നു.
- source_word: אֶל־בְּנִי
  choice: എന്റെ മകന്റെ അടുക്കലേക്ക്
  rationale: אֶל എന്നതിന്റെ ‘അടുക്കലേക്ക്/നേരെ’ എന്ന അർഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: אָבֵל
  choice: ദുഃഖിച്ചുകൊണ്ട്
  rationale: വിലപിക്കുന്നവന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പദം മലയാളത്തിൽ ക്രിയാവിശേഷണപരമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁאֹלָה
  choice: ഷെയോളിൽ
  rationale: שׁאול എന്ന സവിശേഷ എബ്രായ ആശയം ‘കല്ലറ’ എന്നു ചുരുക്കുകയോ പിൽക്കാല പരലോകസങ്കൽപ്പങ്ങൾ ചേർക്കുകയോ ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ദിശാസൂചകമായ ה־യെ ‘ഇറങ്ങിച്ചെല്ലും’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: അങ്ങനെ അവന്റെ പിതാവ് അവനെച്ചൊല്ലി കരഞ്ഞു
  rationale: ‘അവന്റെ പിതാവ്’ എന്ന കർത്താവിനെയും ‘അവനെ’ എന്ന കർമത്തെയും നിലനിർത്തി, വാവ്-തുടർച്ചയെ സ്വാഭാവികമായ ആഖ്യാനബന്ധമായി നൽകുന്നു.
theological_decisions:
- issue: שְׁאוֹל (ഷെയോൾ) എന്നതിന്റെ വിവർത്തനം
  choice: ഷെയോൾ
  alternative: കല്ലറ; മരിച്ചവരുടെ ലോകം
  rationale: ഈ പദം ഒരു ശവക്കുഴിയെക്കാൾ വിശാലമായ അർഥം വഹിക്കാം. അതേസമയം വികസിതമായ ഒരു പ്രത്യേക പരലോകസിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യരുത്. അതിനാൽ പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം നൽകി അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: אֶל־בְּנִי אָבֵל שְׁאֹלָה എന്ന പദക്രമവും ബന്ധവും
  choice: “ദുഃഖിച്ചുകൊണ്ട് ഞാൻ ഷെയോളിൽ എന്റെ മകന്റെ അടുക്കലേക്ക് ഇറങ്ങിച്ചെല്ലും”
  alternative: “എന്റെ മകനെച്ചൊല്ലി ദുഃഖിച്ചുകൊണ്ട് ഞാൻ ഷെയോളിലേക്ക് ഇറങ്ങിച്ചെല്ലും”
  rationale: പ്രധാനപാഠം ‘എന്റെ മകന്റെ അടുക്കലേക്ക്’ എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു. എന്നാൽ ‘ദുഃഖിച്ചുകൊണ്ട്’ എന്നത് വാക്യത്തിൽ എവിടെ ചേർന്നു വായിക്കണമെന്നതിലുള്ള സ്വാഭാവിക ഘടനാഭേദം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പുത്രന്മാർ/പുത്രിമാർ’ എന്നത് മൂലപാഠത്തിലെ ലിംഗവ്യത്യാസം കൃത്യമായി സൂക്ഷിക്കുന്നു. ‘ഷെയോൾ’ എന്ന അപരിചിതപദത്തിന് അടിക്കുറിപ്പിലൂടെ സഹായം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
