reference: Genesis 37:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: ml
  text: അപ്പോൾ മിദ്യാന്യരായ വ്യാപാരികൾ അതുവഴി കടന്നുപോയി. അവർ യോസേഫിനെ വലിച്ചും ഉയർത്തിയും കുഴിയിൽനിന്ന് പുറത്തെടുത്തു; യോസേഫിനെ ഇരുപത് വെള്ളിക്ക്[a] യിശ്മായേല്യർക്കു വിറ്റു. തുടർന്ന് അവർ യോസേഫിനെ ഈജിപ്തിലേക്കു കൊണ്ടുപോയി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇരുപത് വെള്ളി’ എന്നാണ്; അളവിന്റെ ഏകകം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: മിദ്യാന്യ വ്യാപാരികളെയും യിശ്മായേല്യരെയും പരാമർശിച്ചതിനു പിന്നാലെ എബ്രായപാഠം ‘അവർ വലിച്ചു’, ‘മുകളിലേക്ക് ഉയർത്തി’, ‘വിറ്റു’, ‘കൊണ്ടുപോയി’ എന്നിങ്ങനെ ബഹുവചനക്രിയകൾ ഉപയോഗിക്കുന്നു. ഓരോ പ്രവൃത്തിയിലും ഏതു സംഘമാണ് ഉദ്ദേശിക്കപ്പെടുന്നത് എന്നതിൽ അതിനാൽ ചില അവ്യക്തത നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: അതുവഴി കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയ സ്ഥലത്തിനരികിലൂടെ സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അതുവഴി കടന്നുപോയി’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: മിദ്യാന്യരായ വ്യാപാരികൾ
  rationale: ‘മിദ്യാന്യരായ പുരുഷന്മാർ, വ്യാപാരികൾ’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ഇവർ ഒരു വ്യാപാരസംഘമാണെന്ന വിവരവും നിലനിർത്തുന്നു.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: വലിച്ചുകയറ്റി … പുറത്തെടുത്തു
  rationale: രണ്ട് എബ്രായക്രിയകളെയും വേർതിരിച്ചുനിർത്തിക്കൊണ്ട്, കുഴിയിൽനിന്നുള്ള മുകളിലേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִן הַבּוֹר
  choice: കുഴിയിൽനിന്ന്
  rationale: בּוֹר എന്നത് കുഴിയെയോ ജലസംഭരണിക്കുഴിയെയോ സൂചിപ്പിക്കാം; ഈ കഥാസന്ദർഭത്തിൽ ‘കുഴി’ വ്യക്തവും പരമ്പരാഗതവുമാണ്.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: യിശ്മായേല്യർക്കു
  rationale: വിൽപ്പനയുടെ സ്വീകരിക്കുന്ന വിഭാഗമായി യിശ്മായേല്യരെ മൂലപാഠം വ്യക്തമായി പേരെടുക്കുന്നു.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: ഇരുപത് വെള്ളിക്ക്
  rationale: അക്ഷരാർഥം ‘ഇരുപത് വെള്ളി’ എന്നാണ്; അളവിന്റെ ഏകകം മൂലപാഠത്തിൽ പറയാത്തതിനാൽ ‘ശേക്കെൽ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: അവർ യോസേഫിനെ ഈജിപ്തിലേക്കു കൊണ്ടുപോയി
  rationale: ദിശാസൂചക രൂപവും ‘കൊണ്ടുവരുക/കൊണ്ടുപോകുക’ എന്ന കാരകക്രിയയും മലയാള ദൃഷ്ടികോണത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മിദ്യാന്യരെയും യിശ്മായേല്യരെയും പറഞ്ഞശേഷമുള്ള ബഹുവചനക്രിയകളുടെ കർത്താവ്
  choice: മൂലപാഠത്തെപ്പോലെ ‘അവർ’ എന്നു മാത്രം ഉപയോഗിച്ച് കർത്താവിനെ കൂടുതൽ നിർണ്ണയിക്കാതിരിക്കുക
  alternative: എല്ലാ പ്രവൃത്തികളും മിദ്യാന്യ വ്യാപാരികൾ ചെയ്തുവെന്നോ, വിൽപ്പനയും ഈജിപ്തിലേക്കുള്ള യാത്രയും യിശ്മായേല്യർ ചെയ്തുവെന്നോ വ്യക്തമാക്കുക
  rationale: എബ്രായത്തിലെ ബഹുവചനക്രിയകൾ ഓരോ ഘട്ടത്തിലും ഏതു സംഘത്തെ സൂചിപ്പിക്കുന്നു എന്നതിൽ യഥാർഥമായ അവ്യക്തതയുണ്ട്. വിവർത്തനം അത് പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘വലിച്ചുകയറ്റി … പുറത്തെടുത്തു’ എന്ന ഘടന എബ്രായത്തിലെ ഇരട്ടക്രിയ നിലനിർത്തുന്നു; ‘അവർ’ എന്ന സർവനാമം കർത്തൃസംബന്ധമായ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
