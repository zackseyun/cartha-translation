review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys seeing Joseph from a distance, the action occurring before he approached them, and the purpose of killing him. The temporal sense is slightly more idiomatic in Malayalam as «അടുത്തെത്തുംമുമ്പ്».
  naturalness: The wording is clear modern standard Malayalam. Reordering «അവനെതിരെ അവർ ഗൂഢാലോചന നടത്തി» avoids the somewhat heavy repetition and gives a smoother narrative flow.
  terminology: «ഗൂഢാലോചന നടത്തി» is an appropriate contextual rendering of וַיִּתְנַכְּלוּ. The footnote’s «കെണിയൊരുക്കി» is narrower than the Hebrew’s range of scheming/deceitful plotting; «തന്ത്രം മെനഞ്ഞു» better preserves the lexical alternative without adding a specific method.
  issues:
  - severity: low
    issue: Footnote alternative is overly specific.
    rationale: «കെണിയൊരുക്കി» can imply setting a trap, whereas the Hebrew verb more broadly denotes scheming, plotting, or dealing deceitfully.
  - severity: low
    issue: Temporal clause can be made more idiomatic.
    rationale: «അടുത്തെത്തുംമുമ്പ്» is a natural concise Malayalam expression for the Hebrew ‘before he came near.’
  revised_text: അവർ അവനെ ദൂരത്തുനിന്ന് കണ്ടു. അവൻ അവരുടെ അടുത്തെത്തുംമുമ്പ്, അവനെ കൊല്ലാൻ അവനെതിരെ അവർ ഗൂഢാലോചന നടത്തി[a].
