translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യ ഉപവാക്യത്തിനു ശേഷം പൂർണവിരാമം ഉപയോഗിച്ചു; ആശയക്രമം മാറ്റിയിട്ടില്ല.
