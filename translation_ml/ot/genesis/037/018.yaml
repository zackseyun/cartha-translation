source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: ml
  text: അവർ അവനെ ദൂരത്തുനിന്ന് കണ്ടു. അവൻ അവരുടെ അടുത്തെത്തുംമുമ്പ്, അവനെ കൊല്ലാൻ അവനെതിരെ അവർ ഗൂഢാലോചന നടത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവനെതിരെ തന്ത്രം മെനഞ്ഞു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് തന്ത്രം മെനയുക, ചതിപൂർവം പ്രവർത്തിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; ഇവിടെ അവനെ കൊല്ലാനുള്ള പദ്ധതിയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: അവർ അവനെ ദൂരത്തുനിന്നു കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ ദൃശ്യഗ്രഹണാർഥവും מֵרָחֹק എന്നതിന്റെ സ്ഥലപരമായ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: അവൻ അവരുടെ അടുത്തെത്തുന്നതിനുമുമ്പ്
  rationale: בְּטֶרֶם സൂചിപ്പിക്കുന്ന മുൻകാലബന്ധവും קרב എന്നതിന്റെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന സ്ഥലപരമായ ആശയവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: അവർ അവനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: נכל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ശത്രുതാപരമായി തന്ത്രം മെനയുന്നതിനെയോ ചതിപ്രയോഗം നടത്തുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള കൊലപ്പെടുത്താനുള്ള ഉദ്ദേശ്യം കണക്കിലെടുത്ത് ‘ഗൂഢാലോചന നടത്തി’ യോജിക്കുന്നു.
- source_word: לַהֲמִיתוֹ
  choice: അവനെ കൊല്ലാൻ
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ infinitive construct ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണിത്.
