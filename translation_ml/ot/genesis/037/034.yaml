revisions:
- from: അപ്പോൾ യാക്കോബ് തന്റെ വസ്ത്രങ്ങൾ കീറി, അരയിൽ ചാക്കുവസ്ത്രം ചുറ്റി, തന്റെ മകനെച്ചൊല്ലി അനേകദിവസം വിലപിച്ചു.
  to: അപ്പോൾ യാക്കോബ് തന്റെ വസ്ത്രങ്ങൾ കീറി, അരയിൽ ചാക്കുവസ്ത്രം ചുറ്റി, തന്റെ മകനെ ഓർത്ത് അനേകം ദിവസങ്ങൾ ദുഃഖിച്ചു.
  rationale: The revision replaces the narrower ‘വിലപിച്ചു’ with ‘ദുഃഖിച്ചു’ to match the Hebrew verb for mourning without adding an unstated vocal action. It also uses the more natural plural duration phrase ‘അനേകം ദിവസങ്ങൾ.’ The concrete mourning actions and the culturally specific term ‘ചാക്കുവസ്ത്രം’ are retained.
