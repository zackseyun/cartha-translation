id: GEN.37.34
reference: Genesis 37:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔י/ו וַ/יָּ֥שֶׂם שַׂ֖ק בְּ/מָתְנָ֑י/ו וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ יָמִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: ml
  text: അപ്പോൾ യാക്കോബ് തന്റെ വസ്ത്രങ്ങൾ കീറി, അരയിൽ ചാക്കുവസ്ത്രം ചുറ്റി, തന്റെ മകനെ ഓർത്ത് അനേകം ദിവസങ്ങൾ ദുഃഖിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: കീറി
  rationale: ദുഃഖാചരണത്തിന്റെ അടയാളമായി വസ്ത്രം കീറുന്ന മൂർത്തമായ പ്രവൃത്തിയെ സ്വാഭാവികവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: שִׂמְלֹתָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: പൊതുവായി വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: שַׂק
  choice: ചാക്കുവസ്ത്രം
  rationale: വിലാപസന്ദർഭത്തിലെ പരുക്കൻ ദുഃഖവസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന, ബൈബിൾഭാഷയിൽ പരിചിതമായ പദം.
- source_word: בְּמָתְנָיו
  choice: അരയിൽ ... ചുറ്റി
  rationale: മത്നയിം സൂചിപ്പിക്കുന്ന അര/കടിപ്രദേശത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വസ്ത്രം ധരിക്കുന്ന രീതിയും സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: וַיִּתְאַבֵּל
  choice: വിലപിച്ചു
  rationale: ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന ഔപചാരിക ദുഃഖാചരണവും തുടർന്നുനിന്ന ശോകവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל־בְּנוֹ
  choice: തന്റെ മകനെച്ചൊല്ലി
  rationale: മകനെക്കുറിച്ചോ മകന്റെ പേരിലോ ഉള്ള വിലാപം എന്ന ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יָמִים רַבִּים
  choice: അനേകദിവസം
  rationale: മൂലത്തിലെ ‘അനേകം ദിവസങ്ങൾ’ എന്ന ദൈർഘ്യപ്രയോഗം ചുരുക്കവും നേരിട്ടുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സാംസ്കാരികമായി പ്രത്യേകമായ שַׂק എന്ന പദം വിശദീകരണപരമായി ലഘൂകരിക്കാതെ ‘ചാക്കുവസ്ത്രം’ എന്നു നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് വസ്ത്രങ്ങൾ കീറുന്നതുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; בְּמָתְנָיו നേരിട്ട് ‘അരയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
