source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב יַעֲקֹ֔ב בְּ/אֶ֖רֶץ מְגוּרֵ֣י אָבִ֑י/ו בְּ/אֶ֖רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: ml
  text: യാക്കോബ് തന്റെ പിതാവ് പരദേശിയായി പാർത്തിരുന്ന ദേശത്ത്, കനാൻദേശത്ത്, താമസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യാക്കോബ് തന്റെ പിതാവിന്റെ പരദേശവാസങ്ങളുടെ ദേശത്ത്, കനാൻദേശത്ത്, പാർത്തു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം പാർക്കുക/വസിക്കുക എന്നതാണ്. ‘താമസിച്ചു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; സ്ഥിരമായി കുടിയേറിയെന്ന ആശയം അമിതമായി നൽകുന്നില്ല. വാവ്-തുടർച്ചയുടെ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: בְּאֶרֶץ
  choice: ദേശത്ത്
  rationale: ഭൂവിഭാഗത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന് ‘ദേശം’ യോജിക്കുന്നു; എബ്രായത്തിലെ സ്ഥലസൂചക രൂപം മലയാളത്തിലെ ‘ദേശത്ത്’ എന്നതിലൂടെ സ്വാഭാവികമായി വരുന്നു.
- source_word: מְגוּרֵי
  choice: പരദേശിയായി പാർത്തിരുന്ന
  rationale: מגור ഒരു അന്യദേശവാസിയായുള്ള താൽക്കാലിക പാർപ്പിന്റെ സൂക്ഷ്മാർഥം വഹിക്കുന്നു. ‘പരദേശിയായി പാർത്തിരുന്ന’ എന്നത് അത് സാധാരണ ‘വസിച്ചിരുന്നു’ എന്നതിലുപരി വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אָבִיו
  choice: തന്റെ പിതാവ്
  rationale: സർവനാമബന്ധം യാക്കോബിലേക്കാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാൻ ‘തന്റെ പിതാവ്’ ഉപയോഗിച്ചു; ഇവിടെ പിതാവ് യിസ്ഹാക്കാണ്.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: കനാൻ എന്ന ഭൂവിഭാഗത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു. മൂലത്തിലെ בְּאֶרֶץ എന്ന ആവർത്തനം മലയാളത്തിൽ ‘ദേശത്ത് … കനാൻദേശത്ത്’ എന്ന സമാന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
