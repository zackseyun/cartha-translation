translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘പരദേശിയായി പാർത്തിരുന്ന’ എന്ന പ്രയോഗം മְגוּרֵי എന്നതിലെ അന്യദേശവാസത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു; മുഖ്യവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകി. അടിക്കുറിപ്പ് സൂചിക [a] മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
