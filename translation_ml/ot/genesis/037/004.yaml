  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: ml
  text: തങ്ങളുടെ അപ്പൻ അവനെ അവന്റെ എല്ലാ സഹോദരന്മാരെക്കാളും അധികം സ്നേഹിച്ചിരുന്നുവെന്ന് അവന്റെ സഹോദരന്മാർ കണ്ടപ്പോൾ, അവർ അവനെ വെറുത്തു; അവനോടു സമാധാനത്തോടെ സംസാരിക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനോടു സമാധാനത്തിൽ സംസാരിക്കാൻ അവർക്കു കഴിഞ്ഞില്ല”; അതായത്, അവനോടു സൗഹൃദഭാവത്തിൽ സംസാരിക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സഹോദരന്മാരുടെ തിരിച്ചറിവും തുടർന്നുണ്ടായ വെറുപ്പും തമ്മിലുള്ള കാലബന്ധം ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶחָיו
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം യോസേഫിന്റെ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי
  choice: എന്ന്
  rationale: അവർ കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്; കാരണാർഥകമായ ‘കാരണം’ എന്നതിനെക്കാൾ ‘എന്ന്’ ഹീബ്രു വാക്യഘടന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אָהַב
  choice: സ്നേഹിക്കുന്നുവെന്ന്
  rationale: സന്ദർഭത്തിൽ പക്ഷപാതത്തിന്റെ സൂചനയുണ്ടെങ്കിലും, ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സ്നേഹിക്കുക’ എന്നതാണ്; താരതമ്യപ്രയോഗം അധികസ്നേഹത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: אֲבִיהֶם
  choice: തങ്ങളുടെ അപ്പൻ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം സഹോദരന്മാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘തങ്ങളുടെ’ എന്നത് ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘അപ്പൻ’ ആഖ്യാനത്തിന് സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: מִכָּל אֶחָיו
  choice: അവന്റെ എല്ലാ സഹോദരന്മാരെക്കാളും അധികം
  rationale: താരതമ്യസൂചകമായ מִן-ഉം כָּל-ഉം ചേർന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവന്റെ എല്ലാ സഹോദരന്മാരെക്കാളും’ എന്നാണ്; മൂലത്തിൽ ഇല്ലാത്ത ‘മറ്റു’ ചേർക്കാതെ താരതമ്യം സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׂנְאוּ
  choice: അവർ അവനെ വെറുത്തു
  rationale: שׂנא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വെറുക്കുക’ നിലനിർത്തുന്നു.
- source_word: וְלֹא יָכְלוּ
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: അവരുടെ വെറുപ്പിൽനിന്ന് ഉളവായ അശക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: דַּבְּרוֹ
  choice: അവനോടു ... സംസാരിക്കാൻ
  rationale: പ്രത്യയം യോസേഫിനെ സൂചിപ്പിക്കുന്നു; അഭിസംബോധനയോ ഇടപെടലോ മലയാളത്തിൽ ‘അവനോടു സംസാരിക്കുക’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: לְשָׁלֹם
  choice: സമാധാനത്തോടെ
  rationale: שָׁלוֹם ഇവിടെ സമാധാനപരവും സൗഹൃദപരവുമായ ബന്ധത്തിലോ ഭാവത്തിലോ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു പ്രയോഗത്തിന്റെ ‘സമാധാനം’ എന്ന പ്രതിച്ഛായ സംരക്ഷിക്കാൻ ‘സമാധാനത്തോടെ’ തിരഞ്ഞെടുത്തു.
