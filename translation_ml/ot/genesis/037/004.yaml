  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ ‘സമാധാനത്തോടെ സംസാരിക്കുക’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ സൗഹൃദപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
