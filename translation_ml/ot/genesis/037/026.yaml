  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദാ തന്റെ സഹോദരന്മാരോടു പറഞ്ഞു: “നമ്മുടെ സഹോദരനെ കൊന്ന് അവന്റെ രക്തം മറച്ചുവെച്ചാൽ നമുക്ക് എന്തു ലാഭം?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നമ്മുടെ സഹോദരനെ കൊന്ന് അവന്റെ രക്തം ഒളിപ്പിച്ചാൽ നമുക്ക് എന്തു നേട്ടം?” ‘അവന്റെ രക്തം മറച്ചുവെക്കുക’ എന്ന എബ്രായ പ്രയോഗം രക്തച്ചൊരിച്ചിലോ അതിന്റെ കുറ്റമോ ഒളിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമാനുസൃത ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ രൂപം.
- source_word: אֶל אֶחָיו
  choice: തന്റെ സഹോദരന്മാരോടു
  rationale: ഇവിടെ പുല്ലിംഗ ബഹുവചനം യോസേഫിന്റെ അവിടെ സന്നിഹിതരായ ആൺസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַה בֶּצַע
  choice: നമുക്ക് എന്തു ലാഭം?
  rationale: בֶּצַע ലാഭം, നേട്ടം എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; യെഹൂദായുടെ സ്വാർഥലാഭകേന്ദ്രിതമായ പ്രായോഗിക കണക്കുകൂട്ടൽ ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: '...എങ്കിൽ / ...ആൽ'
  rationale: വാചകത്തിൽ ആലോചനാപരമായ ചോദ്യത്തിന്റെ വ്യവസ്ഥ അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപമായ ‘മറച്ചുവെച്ചാൽ’ വഴി സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: נַהֲרֹג
  choice: കൊന്ന്
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രവർത്തി, തുടർന്നുള്ള സോപാധിക ഘടനയോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: אָחִינוּ
  choice: നമ്മുടെ സഹോദരനെ
  rationale: കുടുംബബന്ധം വാക്യത്തിന്റെ ധാർമിക സംഘർഷത്തിന് കേന്ദ്രമായതിനാൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: അവന്റെ രക്തം മറച്ചുവെച്ചാൽ
  rationale: ‘അവന്റെ രക്തം മൂടുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം രക്തച്ചൊരിച്ചിലോ അതിന്റെ കുറ്റമോ ഒളിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘രക്തം മറച്ചുവെക്കുക’ ദൃശ്യരൂപവും ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ രക്തം മൂടുക’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: അവന്റെ രക്തം മറച്ചുവെക്കുക
  alternative: അവന്റെ രക്തച്ചൊരിച്ചിൽ ഒളിപ്പിക്കുക
  rationale: മൂലത്തിലെ ‘രക്തം’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുകയും, അത് കുറ്റം ഒളിപ്പിക്കുന്നതാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അതിരുകടന്ന് നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘എന്തു ലാഭം’ യെഹൂദായുടെ പ്രായോഗിക കണക്കുകൂട്ടൽ നിലനിർത്തുന്നു; ‘രക്തം മറച്ചുവെക്കുക’ മൂലഭാഷയുടെ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു.
