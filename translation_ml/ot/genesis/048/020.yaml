revisions:
- from: 'അങ്ങനെ ആ ദിവസം അവൻ അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് പറഞ്ഞു: “നിന്നെ ചൊല്ലി[a] ഇസ്രായേൽ ഇങ്ങനെ അനുഗ്രഹിക്കും: ‘ദൈവം നിന്നെ എഫ്രയീമിനെയും മനശ്ശെയെയും പോലെ ആക്കട്ടെ.’” അങ്ങനെ അവൻ എഫ്രയീമിനെ മനശ്ശെയ്ക്കു മുമ്പിൽ നിർത്തി.'
  to: 'അവൻ അന്നു അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു: “നിന്നെ ചൊല്ലി ഇസ്രായേൽ അനുഗ്രഹിക്കും: ‘ദൈവം നിന്നെ എഫ്രയീമിനെയും മനശ്ശെയെയും പോലെ ആക്കട്ടെ.’” അവൻ എഫ്രയീമിനെ മനശ്ശെയ്ക്ക് മുമ്പിൽ വെച്ചു.'
  rationale: തിരുത്തൽ അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. സംയോജക വാവിന് അനാവശ്യമായ നിഗമനാർഥം നൽകാതിരിക്കുകയും, അവസാനക്രിയയിൽ ശാരീരികമായ ‘നിർത്തൽ’ എന്ന സൂചന ഒഴിവാക്കി അനുഗ്രഹക്രമത്തിലെ മുൻഗണനയും മൂലക്രിയയുടെ സാധാരണ അർഥവും നിലനിർത്തുകയും ചെയ്യുന്നു. ‘ഇസ്രായേൽ’ എന്നതിന്റെ തുറന്ന സൂചിതാർഥവും בְּךָയിലെ വിവാദ/ബദൽ സാദ്ധ്യതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
