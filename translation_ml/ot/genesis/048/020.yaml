source:
  edition: WLC
  text: וַ/יְבָ֨רֲכֵ֜/ם בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמוֹר֒ בְּ/ךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יְשִֽׂמְ/ךָ֣ אֱלֹהִ֔ים כְּ/אֶפְרַ֖יִם וְ/כִ/מְנַשֶּׁ֑ה וַ/יָּ֥שֶׂם אֶת אֶפְרַ֖יִם לִ/פְנֵ֥י מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: ml
  text: 'അവൻ അന്നു അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു: “നിന്നെ ചൊല്ലി ഇസ്രായേൽ അനുഗ്രഹിക്കും: ‘ദൈവം നിന്നെ എഫ്രയീമിനെയും മനശ്ശെയെയും പോലെ ആക്കട്ടെ.’” അവൻ എഫ്രയീമിനെ മനശ്ശെയ്ക്ക് മുമ്പിൽ വെച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: അവൻ അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: ברך എന്ന ക്രിയയുടെ പീയേൽ രൂപവും ബഹുവചന കർമപ്രത്യയവും എഫ്രയീമിനെയും മനശ്ശെയെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള לֵאמֹר സ്വാഭാവികമായി ഉദ്ധരണി അവതരിപ്പിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചന വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: בְּךָ
  choice: നിന്നെ ചൊല്ലി
  rationale: ഏകവചനപ്രത്യയത്തോടുകൂടിയ בְּ ഇവിടെ ഒരാളുടെ പേര്/മാതൃക ഉപയോഗിച്ച് അനുഗ്രഹിക്കുന്ന ആശയം നൽകുന്നു. ‘നിന്നെ ചൊല്ലി’ എബ്രായ പ്രയോഗത്തിന്റെ രൂപകാത്മകതയും സന്ദർഭത്തിലെ അനുഗ്രഹസൂത്രവാക്യവും നിലനിർത്തുന്നു.
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ഇങ്ങനെ അനുഗ്രഹിക്കും
  rationale: ഇംപർഫെക്റ്റ് ഭാവിയിലോ പതിവായോ നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേൽ’ എന്ന പദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: ദൈവം നിന്നെ ... പോലെ ആക്കട്ടെ
  rationale: അനുഗ്രഹസന്ദർഭത്തിലെ ആശംസാഭാവം ‘ആക്കട്ടെ’ വ്യക്തമായി നൽകുന്നു; שׂים എന്നതിന്റെ ഈ സന്ദർഭത്തിലുള്ള ഫലപ്രദമായ അർഥം ‘ആക്കുക’ ആണ്.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: എഫ്രയീമിനെയും മനശ്ശെയെയും പോലെ
  rationale: രണ്ടു പേരെയും താരതമ്യത്തിന്റെ പരിധിയിൽ വ്യക്തമായി ഉൾപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: അവൻ എഫ്രയീമിനെ മനശ്ശെയ്ക്കു മുമ്പിൽ നിർത്തി
  rationale: ലക്ഷണാർഥമായ മുൻഗണനയ്ക്കൊപ്പം שׂים ... לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ നിർത്തുക’ എന്ന ദൃശ്യരൂപവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അനുഗ്രഹസൂത്രത്തിലെ ‘ഇസ്രായേൽ’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ‘ഇസ്രായേൽ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘യാക്കോബ്’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽജനം’ എന്നു വിശദീകരിക്കുക
  rationale: എബ്രായപാഠം ‘ഇസ്രായേൽ’ എന്നു മാത്രമാണ് പറയുന്നത്. അത് പൂർവപിതാവായ യാക്കോബിനെയും ഭാവിയിലെ ജനസമൂഹത്തെയും ഓർമിപ്പിക്കാവുന്നതിനാൽ ആ അർഥവ്യാപ്തി പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: בְּךָ എന്നതിലെ ബന്ധം
  choice: ‘നിന്നെ ചൊല്ലി’
  alternative: ‘നിന്നിൽ’
  rationale: അനുഗ്രഹിക്കുമ്പോൾ ഈ പേരുകളെ മാതൃകയോ സൂത്രവാക്യമോ ആയി ഉപയോഗിക്കുന്ന ആശയം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പേരുകൾ സാധാരണ മലയാള ബൈബിൾ ഉച്ചാരണരീതിയോട് ചേർത്ത് നൽകിയിരിക്കുന്നു. അനുഗ്രഹവാക്യത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാക്കി.
