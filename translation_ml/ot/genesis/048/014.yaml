id: GEN.48.14
reference: Genesis 48:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽ തന്റെ വലങ്കൈ നീട്ടി ഇളയവനായ എഫ്രയീമിന്റെ തലയിൽ വെച്ചു; തന്റെ ഇടങ്കൈ മനശ്ശെയുടെ തലയിൽ വെച്ചു. മനശ്ശെ ആദ്യജാതനായിരുന്നതിനാൽ, അവൻ ബോധപൂർവം കൈകൾ കുറുകെ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ തന്റെ കൈകൾ ബോധപൂർവം ക്രമപ്പെടുത്തി.” ഹീബ്രു പ്രയോഗം ഉദ്ദേശപൂർവവും നൈപുണ്യപൂർവവുമായ കൈകളുടെ സ്ഥാനനിർണ്ണയത്തെ ഊന്നിപ്പറയാം; ഇവിടെ അത് കൈകൾ കുറുകെ വെച്ചതിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: നീട്ടി
  rationale: കൈ ശാരീരികമായി നീട്ടുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיָּשֶׁת
  choice: വെച്ചു
  rationale: തലമേൽ കൈ വയ്ക്കുന്ന അനുഗ്രഹപ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: יְמִינוֹ / שְׂמֹאלוֹ
  choice: തന്റെ വലങ്കൈ / ഇടങ്കൈ
  rationale: രണ്ടു കൈകളുടെയും വ്യത്യസ്ത സ്ഥാനനിർണ്ണയം വാക്യത്തിന്റെ മുഖ്യവിഷയമായതിനാൽ സമാന്തരമായി വ്യക്തമായി വിവർത്തനം ചെയ്തു.
- source_word: וְהוּא הַצָּעִיר
  choice: ഇളയവനായ എഫ്രയീമിന്റെ
  rationale: ഹീബ്രുവിലെ തിരിച്ചറിയൽവിവരം സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ എഫ്രയീമിനോടു ചേർത്തു; ജനനക്രമത്തിലെ വൈരുധ്യം തുടർന്നുള്ള വാക്യത്തിൽ നിലനിൽക്കുന്നു.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: അവൻ അറിഞ്ഞുകൊണ്ടുതന്നെ കൈകൾ കുറുകെ വെച്ചു
  rationale: ഈ ദുഷ്കരമായ പ്രയോഗം ബോധപൂർവവും നൈപുണ്യപൂർവവുമായ കൈക്രമീകരണത്തെ സൂചിപ്പിക്കാം; അടുത്ത സന്ദർഭം കൈകൾ കുറുകെ വച്ചതാണെന്ന് ശക്തമായി കാണിക്കുന്നു. 'അറിഞ്ഞുകൊണ്ടുതന്നെ' എന്നത് ഉദ്ദേശപൂർവതയും 'കുറുകെ വെച്ചു' എന്നത് ദൃശ്യമായ പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: כִּי מְנַשֶּׁה הַבְּכֹר
  choice: മനശ്ശെ ആദ്യജാതനായിരുന്നെങ്കിലും
  rationale: כִּי ഇവിടെ സാഹചര്യപരമായി മനശ്ശെയുടെ ആദ്യജാതസ്ഥാനം ചൂണ്ടിക്കാട്ടുന്നു. മലയാളത്തിൽ concessive രൂപം അസാധാരണമായ കൈവയ്പ്പിനും പ്രതീക്ഷിക്കപ്പെട്ട ജനനാവകാശക്രമത്തിനുമിടയിലെ വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבְּכֹר
  choice: ആദ്യജാതൻ
  rationale: വെറും പ്രായമുതിർച്ചയല്ല, ജനനക്രമത്തിന്റെയും അനുഗ്രഹാവകാശത്തിന്റെയും സാംസ്കാരിക പ്രാധാന്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: യാക്കോബ് ബോധപൂർവം കൈകൾ കുറുകെ വെച്ചു
  alternative: യാക്കോബ് കൈകളെ നൈപുണ്യത്തോടെ അല്ലെങ്കിൽ ഉദ്ദേശപൂർവം നയിച്ചു; കുറുകെ വെച്ചുവെന്നത് പ്രയോഗത്തിൽ നേരിട്ട് പറയണമെന്നില്ല
  rationale: വലങ്കൈ ഇളയവനായ എഫ്രയീമിന്മേലും ഇടങ്കൈ ആദ്യജാതനായ മനശ്ശെയിന്മേലും വെച്ചതായി അടുത്ത സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ, ബോധപൂർവമായ കുറുകെയുള്ള കൈവയ്പ്പാണ് ഏറ്റവും സാദ്ധ്യമായ അർഥം. പ്രതീക്ഷിച്ച ആദ്യജാതക്രമത്തിന്റെ മനഃപൂർവമായ മറിച്ചിടൽ നിലനിർത്തുന്നു; അതിനെക്കുറിച്ച് പിൽക്കാല ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. 'ആദ്യജാതൻ' എന്ന ബൈബിൾ-സാംസ്കാരിക പ്രാധാന്യമുള്ള പദം നിലനിർത്തി. ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തിന്റെ സാക്ഷ്യപ്പെടുത്തിയ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
