revisions:
- from: യോസേഫ് അവർ ഇരുവരെയും എടുത്തു—എഫ്രയീമിനെ തന്റെ വലതുകൈകൊണ്ട് യിസ്രായേലിന്റെ ഇടതുവശത്തും മനശ്ശെയെ തന്റെ ഇടതുകൈകൊണ്ട് യിസ്രായേലിന്റെ വലതുവശത്തും നിർത്തി—അവരെ അവന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു.
  to: യോസേഫ് അവരിരുവരെയും എടുത്തു—എഫ്രയീമിനെ തന്റെ വലതുകൈയിൽ, യിസ്രായേലിന്റെ ഇടതുവശത്ത്; മനശ്ശെയെ തന്റെ ഇടതുകൈയിൽ, യിസ്രായേലിന്റെ വലതുവശത്ത്—അവന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു.
  rationale: The revision removes the unsupported positioning verb, renders the Hebrew hand phrases as locatives, and retains the source’s deliberately contrasting right/left arrangement. The final pronoun remains faithful to the Hebrew and, in context, refers to Israel.
