source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: ml
  text: യോസേഫ് അവരിരുവരെയും എടുത്തു—എഫ്രയീമിനെ തന്റെ വലതുകൈയിൽ, യിസ്രായേലിന്റെ ഇടതുവശത്ത്; മനശ്ശെയെ തന്റെ ഇടതുകൈയിൽ, യിസ്രായേലിന്റെ വലതുവശത്ത്—അവന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: സഹോദരന്മാരായ ഇരുവരെയും യോസേഫ് ക്രമപ്പെടുത്തി കൊണ്ടുവരുന്ന പ്രവർത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ഇടതുവശത്തും / യിസ്രായേലിന്റെ വലതുവശത്തും
  rationale: മִן ഇവിടെ അകലം സൂചിപ്പിക്കുന്ന ‘നിന്ന്’ എന്നതിലുപരി, യിസ്രായേലിനെ അഭിമുഖീകരിച്ചുള്ള സ്ഥാനക്രമമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വശത്ത്’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: അവരെ അവന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥമായ ‘അടുത്തേക്കു കൊണ്ടുവരുക’ സംരക്ഷിക്കുന്നു; ‘അവന്റെ’ എന്ന സർവനാമം മൂലപാഠത്തിലെപ്പോലെ യിസ്രായേലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കൈകളുടെയും യിസ്രായേലിന്റെ വശങ്ങളുടെയും മറിച്ചുള്ള സ്ഥാനക്രമം വ്യക്തമായി നിലനിർത്തി.
