reference: Genesis 48:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: ml
  text: 'യോസേഫ് തന്റെ അപ്പനോട് പറഞ്ഞു: “അങ്ങനെയല്ല, അപ്പാ; കാരണം ഇവനാണ് ആദ്യജാതൻ. അങ്ങയുടെ വലതുകൈ ഇവന്റെ തലയിൽ വെക്കണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മലയാളത്തിൽ വാക്യക്രമം തന്നെയത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കേണ്ടതില്ല.
- source_word: אֶל אָבִיו
  choice: തന്റെ അപ്പനോട്
  rationale: ദിശാസൂചകമായ אֶל-നെയും മൂന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘തന്റെ’ എന്നത് പരാമർശം യോസേഫിലേക്കാണെന്ന് തെളിയിക്കുന്നു.
- source_word: לֹא כֵן
  choice: അങ്ങനെയല്ല
  rationale: തിരുത്തലും പ്രതിഷേധവും പ്രകടിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും ആദരവുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: אָבִי
  choice: അപ്പാ
  rationale: ഒന്നാം പുരുഷ ഏകവചന ഉടമസ്ഥബന്ധമുള്ള നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സ്വാഭാവികവും ആദരസൂചകവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമത്തിലൂടെ
  rationale: ഇവിടെ כִּי യോസേഫിന്റെ തിരുത്തലിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അങ്ങനെയല്ല, അപ്പാ; ഇവനാണ്…’ എന്ന ഘടന കാരണംബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; നിർബന്ധമായി ‘കാരണം’ ചേർക്കുന്നത് സംഭാഷണം ഭാരമുള്ളതാക്കും.
- source_word: זֶה
  choice: ഇവൻ
  rationale: യോസേഫ് അടുത്തുള്ള മകനെ ചൂണ്ടിക്കാണിക്കുന്ന ദൈക്തികബലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַבְּכֹר
  choice: മൂത്തവൻ
  rationale: മലയാളത്തിൽ കുടുംബത്തിലെ ജനനക്രമവും ആദ്യജാതപുത്രന്റെ സ്ഥാനവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘ആദ്യജാതൻ’ എന്നത് കൂടുതൽ സാങ്കേതികവും കുറച്ച് സ്വാഭാവികവുമാണ്.
- source_word: שִׂים
  choice: വെക്കണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മകനായ യോസേഫ് അപ്പനോട് സംസാരിക്കുന്ന ആദരഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְמִינְךָ
  choice: അങ്ങയുടെ വലതുകൈ
  rationale: വലതുഭാഗമല്ല, കൈ തന്നെയാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു; ആദരസൂചകമായ രണ്ടാംപുരുഷരൂപം സംഭാഷണസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: עַל רֹאשׁוֹ
  choice: ഇവന്റെ തലയിൽ
  rationale: അനുഗ്രഹത്തിനായുള്ള കൈവെക്കൽ എന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഇവന്റെ’ എന്നത് ചൂണ്ടിക്കാണിക്കപ്പെട്ട മകനിലേക്കുള്ള പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുഗ്രഹസന്ദർഭത്തിലെ ജനനക്രമ-പദവി
  choice: മൂത്തവൻ
  alternative: ആദ്യജാതൻ
  rationale: הַבְּכֹר ജനനക്രമത്തിനൊപ്പം കുടുംബപരവും അവകാശപരവുമായ പദവിയും സൂചിപ്പിക്കുന്നു. ആ അർഥപരിധി മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്ന ‘മൂത്തവൻ’ തിരഞ്ഞെടുത്തു; സന്ദർഭം ഇത് കേവലം പ്രായത്തെക്കുറിച്ചല്ലെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കുടുംബസംഭാഷണശൈലി. ‘അപ്പാ’, ‘അങ്ങയുടെ’, ‘വെക്കണമേ’ എന്നിവ യോസേഫിന്റെ തിരുത്തലിലെ നേരിട്ടുള്ളതും പിതാവിനോടുള്ള ആദരവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
