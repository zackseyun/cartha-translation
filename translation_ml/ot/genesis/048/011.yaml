id: GEN.48.11
reference: Genesis 48:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: ml
  text: 'ഇസ്രായേൽ യോസേഫിനോടു പറഞ്ഞു: “നിന്റെ മുഖം കാണുമെന്നു ഞാൻ പ്രതീക്ഷിച്ചിരുന്നില്ല; ഇതാ, നിന്റെ സന്തതിയെയും കാണാൻ ദൈവം എനിക്ക് ഇടയാക്കിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപത്തിന്റെ സാധാരണ ആഖ്യാനപുരോഗതി മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലക്രിയയിലൂടെ നൽകുന്നു; വാക്യക്രമം തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായ പാഠം ‘യാക്കോബ്’ എന്നതിനു പകരം ഉടമ്പടിനാമമായ ‘ഇസ്രായേൽ’ ഉപയോഗിക്കുന്നതിനാൽ അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: רְאֹה פָנֶיךָ
  choice: നിന്റെ മുഖം കാണുക
  rationale: ‘നിന്നെ നേരിൽ കാണുക’ എന്ന എബ്രായ പ്രയോഗാർത്ഥം ഉള്ളതായിരുന്നാലും, മൂലത്തിലെ ദൃശ്യവൈഭവവും വികാരബലവും സംരക്ഷിക്കാൻ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം നിലനിർത്തുന്നു.
- source_word: לֹא פִלָּלְתִּי
  choice: ഞാൻ പ്രതീക്ഷിച്ചിരുന്നില്ല
  rationale: ഈ സന്ദർഭത്തിൽ פלל പ്രാർഥനയെക്കാൾ പ്രതീക്ഷയെയോ കരുതലെയോ സൂചിപ്പിക്കുന്നു. മുൻകാലത്തുണ്ടായിരുന്ന പ്രതീക്ഷയില്ലായ്മ സ്വാഭാവിക മലയാളത്തിൽ ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നാൽ ഇതാ
  rationale: അതിശയവും ശക്തമായ വഴിത്തിരിവും സൂചിപ്പിക്കുന്ന വ്യവഹാരചിഹ്നം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘എന്നാൽ ഇതാ’ വൈരുധ്യവും ആശ്ചര്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הֶרְאָה אֹתִי
  choice: കാണാൻ ദൈവം എനിക്ക് ഇടയാക്കിയിരിക്കുന്നു
  rationale: ראה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർത്ഥം വ്യക്തമായി സംരക്ഷിക്കുമ്പോൾ, ദൈവം നൽകിയ അവസരം എന്ന സന്ദർഭാർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ എത്തിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇത് യഹോവ എന്ന ഉടമ്പടിനാമമല്ല, സാധാരണ ദൈവികപദവിയാണ്; അതിനാൽ നേരിട്ടുള്ള സാധാരണ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: גַּם
  choice: -യെയും
  rationale: യോസേഫിനെ മാത്രമല്ല, അവന്റെ സന്തതിയെയും കാണാൻ കഴിഞ്ഞെന്ന അപ്രതീക്ഷിതമായ അധികാനുഗ്രഹം ഉൾപ്പെടുത്തൽപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: זַרְעֶךָ
  choice: നിന്റെ സന്തതി
  rationale: זֶרַע എന്ന ഏകവചന-സമൂഹാർത്ഥം നിലനിർത്തുന്നു. ‘മക്കൾ’ എന്നത് സന്ദർഭത്തെ അനാവശ്യമായി ചുരുക്കാം; ‘വംശജർ’ എന്നത് ഉടൻ മുന്നിലുള്ള മക്കളേക്കാൾ വിശാലമായി തോന്നാം.
theological_decisions:
- issue: പിതൃപുരുഷ ആഖ്യാനത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: യഹോവ
  rationale: മൂലപാഠം സാധാരണ ദൈവികപദവിയായ אֱלֹהִים ആണ് ഉപയോഗിക്കുന്നത്, ഉടമ്പടിനാമമായ יהוה അല്ല. അതിനാൽ പേരുമാറ്റമോ സിദ്ധാന്തപരമായ വിപുലീകരണമോ കൂടാതെ ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നിന്റെ മുഖം കാണുക’ എന്ന മൂലഭാഷയുടെ സജീവമായ പ്രയോഗം നിലനിർത്തിയിട്ടുണ്ട്; ‘പ്രതീക്ഷിച്ചിരുന്നില്ല’ എന്നത് സന്ദർഭാനുസൃതമായ മുൻകാല മനോഭാവം വ്യക്തമാക്കുന്നു. വിശദീകരണം ആവശ്യപ്പെടുന്ന നിർണായക പാഠഭേദമോ യഥാർത്ഥ ദ്വയാർഥതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
