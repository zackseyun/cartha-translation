  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: ml
  text: 'യോസേഫ് തന്റെ പിതാവിനോട് പറഞ്ഞു: “ഇവർ എന്റെ പുത്രന്മാരാണ്; ദൈവം ഇവിടെവെച്ച് എനിക്കു നൽകിയവർ.” യാക്കോബ് പറഞ്ഞു: “ദയവായി അവരെ എന്റെ അടുക്കലേക്കു കൊണ്ടുവരൂ[b]; ഞാൻ അവരെ അനുഗ്രഹിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ “ദയവായി അവരെ എടുത്ത് എന്റെ അടുക്കലേക്കു വരൂ; ഞാൻ അവരെ അനുഗ്രഹിക്കട്ടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: തന്റെ പിതാവിനോട്
  rationale: യോസേഫിന്റെ പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലിക്ക് ‘പിതാവ്’ യോജിക്കുന്നു.
- source_word: בָּנַי הֵם
  choice: ഇവർ എന്റെ പുത്രന്മാരാണ്
  rationale: בָּנַי പുരുഷലിംഗ ബഹുവചനമായതിനാൽ ‘പുത്രന്മാർ’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തി; മുന്നിലുള്ളവരെ ചൂണ്ടിക്കാണിക്കുന്ന സന്ദർഭത്തിൽ ‘ഇവർ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: ദൈവം എനിക്ക് ... തന്നവർ
  rationale: പുത്രന്മാർ ദൈവത്തിന്റെ ദാനമാണെന്ന ആശയം ലളിതമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ബന്ധസൂചകമായി ‘തന്നവർ’ ഉപയോഗിച്ചു.
- source_word: בָּזֶה
  choice: ഇവിടെ
  rationale: യോസേഫിന്റെ ഇപ്പോഴത്തെ സ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്ന ദെയ്ക്റ്റിക് അർഥം സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ വ്യക്തമായ സ്ഥലാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: קָחֶם נָא אֵלַי
  choice: ദയവായി അവരെ എന്റെ അടുക്കൽ കൊണ്ടുവരൂ
  rationale: לקח എന്നതിന് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്ന അർഥമുണ്ടെങ്കിലും, യാക്കോബിന്റെ അടുക്കലേക്ക് പുത്രന്മാരെ എത്തിക്കണമെന്ന സന്ദർഭാർഥം ‘കൊണ്ടുവരൂ’ സ്വാഭാവികമായി നൽകുന്നു; נָא-യുടെ വിനയഭാവം ‘ദയവായി’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: וַאֲבָרֲכֵם
  choice: ഞാൻ അവരെ അനുഗ്രഹിക്കട്ടെ
  rationale: അഭ്യർഥനയെ തുടർന്നുള്ള ഇച്ഛാ/ഉദ്ദേശ്യഭാവം സംരക്ഷിക്കുന്നു; ഉറച്ച പ്രവചനമായി മാത്രം വായിക്കപ്പെടുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യോസേഫിന്റെ വാക്കുകളിലെ אֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനമായ ‘ദൈവം’
  alternative: പൊതുവായ ‘ഒരു ദൈവം’ അല്ലെങ്കിൽ ബഹുവചനമായ ‘ദേവന്മാർ’
  rationale: പിതൃകഥകളുടെ ആഖ്യാനസന്ദർഭത്തിൽ യോസേഫ് തന്റെ പുത്രന്മാരെ നൽകിയവനായി ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് അംഗീകരിക്കുന്നത്; ഏകവചന ക്രിയാരൂപവും ഈ വായനയോട് പൊരുത്തപ്പെടുന്നു.
- issue: וַאֲבָרֲכֵם എന്നതിന്റെ ഭാവം
  choice: ‘ഞാൻ അവരെ അനുഗ്രഹിക്കട്ടെ’ എന്ന ഇച്ഛാ/ഉദ്ദേശ്യഭാവം
  alternative: ‘ഞാൻ അവരെ അനുഗ്രഹിക്കും’ എന്ന ലളിത ഭാവികാലം
  rationale: ഹീബ്രു രൂപം അഭ്യർഥനയുടെ ഉദ്ദേശ്യം അല്ലെങ്കിൽ സംസാരിക്കുന്നവന്റെ ഇച്ഛയെ സൂചിപ്പിക്കാൻ കഴിയും; അതിനെ വെറും ഭാവിപ്രഖ്യാപനമായി പരിമിതപ്പെടുത്താതെ ആ ഭാവം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള ‘പറഞ്ഞു’ സ്വാഭാവികമായി നിലനിർത്തിയെങ്കിലും രണ്ടാമത്തെ വക്താവിനെ ഹീബ്രുവിലെപ്പോലെ സർവനാമത്തിലൂടെ സൂചിപ്പിച്ചു; സന്ദർഭത്തിൽ അത് യാക്കോബാണെന്ന് വ്യക്തമാണ്. അടിക്കുറിപ്പ് [a] അർഥസംബന്ധമായ പദമായ ‘ഇവിടെ’ എന്നതോടാണ് ചേർത്തിരിക്കുന്നത്.
