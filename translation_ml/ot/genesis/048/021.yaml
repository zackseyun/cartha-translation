  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: ml
  text: 'പിന്നെ ഇസ്രായേൽ യോസേഫിനോടു പറഞ്ഞു: “ഇതാ, ഞാൻ മരിക്കാൻ പോകുന്നു. എങ്കിലും[a] ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും; നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദേശത്തേക്കു നിങ്ങളെ[b] മടക്കിക്കൊണ്ടുവരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എങ്കിലും’ എന്നതിനുപകരം ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്നും’ എന്നു വിവർത്തനം ചെയ്യാം. ഹീബ്രുവിലെ ബന്ധകം അക്ഷരാർഥത്തിൽ ‘കൂടാതെ/എന്നും’ എന്നാണ്; ഇവിടെ ഇസ്രായേലിന്റെ ആസന്നമരണത്തിനും ദൈവത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യത്തിനും ഇടയിലെ വൈരുധ്യം അതു സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളോടുകൂടെ’, ‘നിങ്ങളെ’ എന്നീ രൂപങ്ങൾ ഹീബ്രുവിൽ ബഹുവചനമാണ്; അതിനാൽ വാഗ്ദാനം യോസേഫിനപ്പുറം അവന്റെ കുടുംബത്തെയോ സന്തതികളെയോ ഉൾക്കൊള്ളുന്നു.
    reason: grammatical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പിന്നെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പിന്നെ’ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: മൂലപാഠം യാക്കോബ് എന്നതിനു പകരം ഉടമ്പടിനാമമായ ‘ഇസ്രായേൽ’ ഉപയോഗിക്കുന്നതിനാൽ അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: אָנֹכִי מֵת
  choice: ഞാൻ മരിക്കാറായിരിക്കുന്നു
  rationale: പങ്കാളിക്രിയാരൂപം ഇവിടെ പൂർത്തിയായ മരണമല്ല, ആസന്നമായ മരണമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: എങ്കിലും ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: വാവ് അക്ഷരാർഥത്തിൽ സംയോജകമാണെങ്കിലും, ഇസ്രായേലിന്റെ ആസന്നമരണത്തിനും ദൈവത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യത്തിനും ഇടയിലെ സന്ദർഭസിദ്ധമായ വൈരുധ്യം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
- source_word: עִמָּכֶם
  choice: നിങ്ങളോടുകൂടെ
  rationale: പ്രത്യയം ബഹുവചനമാണ്; യോസേഫിനെക്കാൾ വിപുലമായ കുടുംബത്തെയോ സന്തതികളെയോ ഉൾക്കൊള്ളുന്ന വാഗ്ദാനം മലയാളത്തിലെ ബഹുവചനരൂപം വ്യക്തമാക്കുന്നു.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: നിങ്ങളെ മടക്കിക്കൊണ്ടുവരും
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം—ദൈവം അവരെ തിരിച്ചുവരുത്തും—സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദേശത്തേക്ക്
  rationale: വാഗ്ദത്തമായ പിതൃദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പദക്രമവും പുരുഷലിംഗസൂചനയും അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാഗ്ദാനത്തിലെ ബഹുവചന സർവനാമങ്ങളുടെ സൂചന
  choice: ‘നിങ്ങളോടുകൂടെ’, ‘നിങ്ങളെ’ എന്നീ ബഹുവചനരൂപങ്ങൾ നിലനിർത്തി.
  alternative: യോസേഫിനോടു മാത്രമുള്ള ഏകവചന അഭിസംബോധനയായി വിവർത്തനം ചെയ്യുക.
  rationale: ഹീബ്രുവിലെ അനുബന്ധപ്രത്യയങ്ങൾ രണ്ടിടത്തും ബഹുവചനമാണ്; അതിനാൽ വാഗ്ദാനം യോസേഫിന്റെ കുടുംബത്തെയോ സന്തതികളെയോ ഉൾക്കൊള്ളുന്നതായി തുറന്നുവെക്കുന്നു.
- issue: ദൈവത്തിന്റെ സാന്നിധ്യത്തിനു മുമ്പുള്ള וְ എന്നതിന്റെ വ്യവഹാരശക്തി
  choice: സന്ദർഭത്തിലെ വൈരുധ്യം സൂചിപ്പിക്കാൻ ‘എങ്കിലും’ ഉപയോഗിച്ചു.
  alternative: ഔപചാരിക സംയോജകമായി ‘ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും’ അല്ലെങ്കിൽ ‘ദൈവവും നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും’ എന്നു നൽകുക.
  rationale: ഇസ്രായേൽ മരിക്കാനിരിക്കുമ്പോഴും ദൈവം അവരോടുകൂടെ തുടരുമെന്ന ആശയവൈരുധ്യം സന്ദർഭത്തിൽ ശക്തമാണ്; എങ്കിലും ലളിതമായ ‘എന്നും/കൂടാതെ’ എന്ന വായന സാധ്യമാണെന്ന് അടിക്കുറിപ്പ് രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ ശൈലി. ‘ഇതാ’, ‘മരിക്കാറായിരിക്കുന്നു’, ‘മടക്കിക്കൊണ്ടുവരും’ എന്നിവ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷണം, ആസന്നത, കാരണാർഥം എന്നിവ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
