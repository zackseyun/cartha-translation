source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: ml
  text: യോസേഫ് തന്റെ അപ്പന്റെ വലങ്കൈ എഫ്രയീമിന്റെ തലമേൽ വെച്ചതു കണ്ടപ്പോൾ, അത് യോസേഫിന് അനിഷ്ടമായി[a]. അവൻ തന്റെ അപ്പന്റെ കൈ പിടിച്ച് അത് എഫ്രയീമിന്റെ തലമേൽനിന്ന് മനശ്ശെയുടെ തലമേലേക്ക് മാറ്റാൻ ശ്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “അത് അവന്റെ കണ്ണുകളിൽ മോശമായിരുന്നു” എന്നാണ് എബ്രായപ്രയോഗം; അർഥം, അത് യോസേഫിന് അനിഷ്ടമായി എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: … കണ്ടപ്പോൾ
  rationale: כִּי ഇവിടെ യോസേഫ് കണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉപവാക്യം ‘കണ്ടപ്പോൾ’ എന്നു ചേർക്കുന്നത് സംഭവക്രമവും സമയബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָשִׁית
  choice: വെച്ചതു
  rationale: שׁית എന്ന ക്രിയയുടെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; യോസേഫ് ശ്രദ്ധിച്ചപ്പോഴേക്കും കൈ തലമേൽ വെച്ചിരുന്നു എന്ന സന്ദർഭക്രമവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: יַד יְמִינוֹ
  choice: വലങ്കൈ
  rationale: അനുഗ്രഹത്തിന്റെ പ്രവൃത്തിയിൽ പ്രാധാന്യമുള്ള വലതുകൈയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: അത് അവന്റെ കണ്ണിൽ അനിഷ്ടമായി
  rationale: ‘അവന്റെ കണ്ണിൽ മോശമായി/അനിഷ്ടമായി’ എന്ന എബ്രായ ശരീരാവയവപ്രയോഗം സംരക്ഷിക്കുമ്പോൾ, ഇവിടെ ധാർമിക തിന്മയല്ല യോസേഫിന്റെ അനിഷ്ടമാണെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתְמֹךְ
  choice: ആ കൈയിൽ പിടിച്ചു
  rationale: תמך എന്നതിന് താങ്ങുക, പിടിക്കുക എന്നീ അർഥങ്ങളുണ്ട്; കൈ തിരിച്ചുവിടാനുള്ള ശാരീരിക പ്രവൃത്തിയാണ് ഇവിടെ, എന്നാൽ അമിതമായ ബലപ്രയോഗം സൂചിപ്പിക്കാതിരിക്കാൻ ‘പിടിച്ചു’ എന്നു നൽകി.
- source_word: לְהָסִיר אֹתָהּ
  choice: മാറ്റാൻ
  rationale: הסיר എന്നതിന്റെ മാറ്റുക/നീക്കുക എന്ന ദിശാത്മക അർഥം ഈ സാഹചര്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: എഫ്രയീമിന്റെ തലമേൽനിന്ന് മനശ്ശെയുടെ തലമേലേക്ക്
  rationale: ഒരു തലയിൽനിന്ന് മറ്റേതിന്റെ മേലേക്കുള്ള കൈയുടെ നീക്കം വ്യക്തമായി നിലനിർത്തുന്നു; രണ്ടാമത്തെ עַל സൂചിപ്പിക്കുന്ന ഉപരിതലസ്ഥാനവും ‘തലമേലേക്ക്’ എന്നതിൽ പ്രകടമാണ്.
