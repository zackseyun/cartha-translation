translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘അപ്പൻ’, ‘വലങ്കൈ’, ‘തലമേൽ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ച ഗൗരവവും നിലനിർത്തുന്നു. എബ്രായത്തിലെ ‘അവന്റെ കണ്ണിൽ’ എന്ന ദൃശ്യപ്രയോഗം മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ച് സ്വാഭാവിക മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകി.
