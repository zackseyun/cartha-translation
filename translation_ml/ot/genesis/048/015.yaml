base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: ml
  text: 'അവൻ യോസേഫിനെ അനുഗ്രഹിച്ച് പറഞ്ഞു: “എന്റെ പിതാക്കന്മാരായ അബ്രാഹാമും യിസ്ഹാക്കും ആരുടെ സന്നിധിയിൽ നടന്നിരുന്നുവോ ആ ദൈവം, എന്റെ ആരംഭം മുതൽ[b] ഇന്നുവരെ എന്നെ മേയിച്ചുപോന്ന[a] ദൈവം,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ മേയിച്ചുപോന്ന” എന്നതിന് “എന്റെ ഇടയനായിരുന്ന” അല്ലെങ്കിൽ “എന്നെ പോഷിപ്പിച്ചുപോന്ന” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഇടയന്റെ തുടർച്ചയായ പരിപാലനവും നടത്തിപ്പും പോഷണവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ ആരംഭം മുതൽ” എന്നതിന് “എന്റെ ജീവിതകാലം മുഴുവൻ” എന്നും പറയാം. എബ്രായപ്രയോഗം യാക്കോബിന്റെ ജീവിതത്തിന്റെ ഏറ്റവും ആദ്യഘട്ടം മുതലുള്ള ദൈവപരിപാലനത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: അവൻ യോസേഫിനെ അനുഗ്രഹിച്ചുകൊണ്ട്
  rationale: എബ്രായപാഠം അനുഗ്രഹം യോസേഫിനാണെന്ന് വ്യക്തമായി പറയുന്നതിനാൽ, സന്ദർഭത്തിൽ പുത്രന്മാർ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും അതിനെ മാറ്റാതെ നിലനിർത്തുന്നു. തുടർന്നുള്ള וַיֹּאמַר-നോടുള്ള സ്വാഭാവിക മലയാളബന്ധത്തിനായി ‘അനുഗ്രഹിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്നു നൽകി.
- source_word: הָאֱלֹהִים
  choice: ആ ദൈവം
  rationale: നിർദ്ദിഷ്ടതയും ഗൗരവമുള്ള ആഹ്വാനശൈലിയും കാത്തുസൂക്ഷിക്കുകയും പിന്നാലെയുള്ള ബന്ധവാക്യങ്ങളാൽ തിരിച്ചറിയപ്പെടുന്ന ദൈവത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: എന്റെ പിതാക്കന്മാർ ആരുടെ സന്നിധിയിൽ നടന്നുവോ
  rationale: ദൈവസന്നിധിയിൽ ജീവിതം നയിക്കുക എന്ന ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: അബ്രാഹാമും യിസ്ഹാക്കും
  rationale: ആധുനിക മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: הָרֹעֶה אֹתִי
  choice: എന്നെ മേയിച്ചുപോന്ന
  rationale: רעה എന്ന പദത്തിലെ ഇടയന്റെ തുടർച്ചയായ പരിപാലനം, നടത്തിപ്പ്, പോഷണം എന്നീ ദൃശ്യാർഥങ്ങൾ സജീവ ക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵעוֹדִי
  choice: എന്റെ ആരംഭംമുതൽ
  rationale: യാക്കോബിന്റെ ജീവിതത്തിന്റെ ആദിമുതൽ എന്ന വ്യാപകമായ ആശയം നിലനിർത്തുന്നു; ‘ജനനംമുതൽ’ എന്ന് ഒരു പ്രത്യേക സംഭവത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആരംഭകാലംമുതൽ ഇപ്പോഴത്തെ ദിവസംവരെയുള്ള തുടർച്ച സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ദൈവസന്നിധിയിൽ നടക്കുക എന്ന പിതൃപുരുഷന്മാരുടെ പ്രയോഗം
  choice: ആരുടെ സന്നിധിയിൽ നടന്നുവോ
  alternative: ആരെ അനുഗമിച്ചുവോ / ആരുടെ സാന്നിധ്യത്തിൽ ജീവിച്ചുവോ
  rationale: ഇത് അനുസരണം മാത്രമായി ചുരുക്കാതെ, ദൈവത്തിന്റെ ദൃഷ്ടിയിലും ബന്ധത്തിലും ജീവിക്കുന്നതെന്ന മൂലപാഠത്തിലെ രൂപകവും അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തിന്റെ ഇടയപരിപാലനരൂപകം
  choice: എന്നെ മേയിച്ചുപോന്ന ദൈവം
  alternative: എന്റെ ഇടയനായിരുന്ന ദൈവം / എന്നെ പോഷിപ്പിച്ച ദൈവം
  rationale: ഇടയന്റെ സജീവവും തുടർച്ചയായതുമായ പരിപാലനത്തെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; അതിനെ ആഹാരമോ ഭൗതികപോഷണമോ മാത്രമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള അനുഗ്രഹവാക്യശൈലി സ്വീകരിച്ചു. ‘സന്നിധിയിൽ നടന്നുവോ’, ‘മേയിച്ചുപോന്ന’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിലെ പ്രധാന രൂപകങ്ങൾ നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
