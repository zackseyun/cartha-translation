  terminology: “അബ്രാഹാം,” “യിസ്ഹാക്ക്,” “ദൈവം,” “സന്നിധിയിൽ,” and the pastoral verb “മേയിച്ചുപോന്ന” are suitable. The divine shepherd image should remain explicit rather than be reduced to general provision.
  issues:
