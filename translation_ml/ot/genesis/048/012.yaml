  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: ml
  text: അപ്പോൾ യോസേഫ് അവരെ യാക്കോബിന്റെ മുട്ടുകൾക്കിടയിൽനിന്ന്[a] പുറത്തുകൊണ്ടുവന്നു; പിന്നെ അവൻ മുഖം നിലത്തേക്കു താഴ്ത്തി നമസ്കരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യാക്കോബിന്റെ മുട്ടുകളുടെ അരികിൽനിന്ന്.’ ഈ അനുഗ്രഹരംഗത്തിൽ കുട്ടികൾ യാക്കോബിനോടു വളരെ അടുത്തായിരുന്ന സ്ഥാനത്തെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: മാറ്റിനിർത്തി
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം അവരെ അവിടത്തെ സ്ഥാനത്തുനിന്ന് പുറത്തേക്കു നീക്കിയെന്ന കാരക അർഥം നൽകുന്നു. മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മാറ്റിനിർത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֹתָם
  choice: അവരെ
  rationale: എഫ്രയീമിനെയും മനശ്ശെയെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: מֵעִם בִּרְכָּיו
  choice: യാക്കോബിന്റെ മുട്ടുകൾക്കിടയിൽനിന്ന്
  rationale: പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവന്റെ മുട്ടുകളോടൊപ്പമുണ്ടായിരുന്നിടത്തുനിന്ന്’ എന്നതോടടുത്തതാണ്. അനുഗ്രഹരംഗത്തിൽ ബാലന്മാർ യാക്കോബിനോട് വളരെ അടുത്തുനിന്നിരുന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘മുട്ടുകൾക്കിടയിൽനിന്ന്’ മുഖ്യവായനയായി സ്വീകരിച്ചു; സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂചന വ്യക്തമാക്കാൻ ‘യാക്കോബിന്റെ’ എന്നു നൽകി.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: שׁחה എന്ന ക്രിയയുടെ ഈ രൂപം ആദരസൂചകമായി കുനിയുകയോ സാഷ്ടാംഗം വീഴുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘മുഖം നിലത്തോടു ചേർത്ത്’ എന്ന വാക്കുകൾ ഭാവത്തിന്റെ ആഴം വ്യക്തമാക്കുന്നു.
- source_word: לְאַפָּיו
  choice: മുഖം
  rationale: ബഹുവചനരൂപമുള്ള എബ്രായ പദം ഇവിടെ ഏകവചനസമാനമായ ‘അവന്റെ മുഖം’ എന്ന അർഥത്തിലാണ്.
- source_word: אָרְצָה
  choice: നിലത്തോടു ചേർത്ത്
  rationale: ദിശാസൂചക രൂപം ‘നിലത്തേക്ക്’ എന്നാണ്; മലയാളത്തിൽ കുനിഞ്ഞുനമസ്കരിക്കുന്ന ശരീരഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘നിലത്തോടു ചേർത്ത്’ എന്നു നൽകി.
theological_decisions:
- issue: ‘അവന്റെ മുട്ടുകൾ’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: യാക്കോബിന്റെ മുട്ടുകൾ
  alternative: യോസേഫിന്റെ മുട്ടുകൾ
  rationale: മുൻസന്ദർഭത്തിൽ യാക്കോബ് കുട്ടികളെ അടുത്തുചേർത്ത് അനുഗ്രഹിക്കാൻ ഒരുങ്ങുകയാണ്; യോസേഫ് അവരെ യാക്കോബിന്റെ സമീപത്തുനിന്ന് മാറ്റുന്നതാണ് ഇവിടെ ഏറ്റവും സ്വാഭാവികമായ വായന. ഇത് സന്ദർഭപരമായ സർവനാമനിർണയമാണ്, ഉപദേശപരമായ തീരുമാനമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വേദപാഠത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായ പദപ്രയോഗത്തിലെ സ്ഥാനസംബന്ധമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
