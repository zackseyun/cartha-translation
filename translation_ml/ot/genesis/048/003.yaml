source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה אֵלַ֥/י בְּ/ל֖וּז בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יְבָ֖רֶךְ אֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: ml
  text: 'യാക്കോബ് യോസേഫിനോട് പറഞ്ഞു: “സർവശക്തനായ ദൈവം[a] കനാൻദേശത്തെ ലൂസിൽ എനിക്കു പ്രത്യക്ഷനായി, എന്നെ അനുഗ്രഹിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “ഏൽ ശദ്ദായി.” പരമ്പരാഗതമായി “സർവശക്തനായ ദൈവം” എന്നു പരിഭാഷപ്പെടുത്തുന്നു; “ശദ്ദായി” എന്നതിന്റെ കൃത്യമായ അർഥഭാവം വിവാദവിഷയമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിന്റെ മുന്നോട്ടുള്ള ഒഴുക്ക് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ലളിതമായ ‘പറഞ്ഞു’ സ്വാഭാവികവും മതിയായതുമാണ്.
- source_word: אֶל
  choice: യോസേഫിനോടു
  rationale: സംസാരം അഭിമുഖീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദാതൃരൂപം ഉപയോഗിച്ചു.
- source_word: אֵל שַׁדַּי
  choice: സർവശക്തനായ ദൈവം
  rationale: ദൈവിക ശീർഷകം അർഥപരമായി പരിഭാഷപ്പെടുത്തി. ‘ശദ്ദായി’ എന്നതിന്റെ കൃത്യമായ അർഥഭാവം വിവാദമായതിനാൽ എബ്രായരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נִרְאָה
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു. ‘പ്രത്യക്ഷനായി’ എന്നത് അധിക വ്യാഖ്യാനം ചേർക്കാതെ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֵלַי
  choice: എനിക്കു
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ പൂർവപ്രത്യയം യാക്കോബിനെ ലക്ഷ്യമാക്കിയ പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּלוּז
  choice: ലൂസിൽവെച്ച്
  rationale: സംഭവം നടന്ന സ്ഥലമായി ലൂസിനെ വ്യക്തവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തിലെ
  rationale: മൂലത്തിലെ ‘കനാൻദേശം’ എന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം നിലനിർത്തുകയും ലൂസുമായുള്ള സ്ഥലപ്പരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: എന്നെ അനുഗ്രഹിച്ചു
  rationale: മുൻപത്തെ ദൈവിക കർത്താവുതന്നെയാണ് ഈ ക്രിയയുടെയും കർത്താവ്; ആവർത്തിച്ചുള്ള സർവനാമം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി തുടർന്നു.
theological_decisions:
- issue: אֵל שַׁדַּי എന്ന ദൈവിക ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: സർവശക്തനായ ദൈവം
  alternative: ഏൽ ശദ്ദായി; ശക്തനായ ദൈവം
  rationale: ശീർഷകത്തിന്റെ പരമ്പരാഗതവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി. എന്നാൽ שַׁדַּי എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം ഉറപ്പില്ലാത്തതിനാൽ ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലപ്പേരും ദൈവിക ശീർഷകവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയിരിക്കുന്നു; യഥാർഥ ശാബ്ദിക അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
