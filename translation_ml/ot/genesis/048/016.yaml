id: GEN.48.16
reference: Genesis 48:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: ml
  text: സകല തിന്മയിൽനിന്നും[a] എന്നെ വീണ്ടെടുത്ത ദൂതൻ ഈ ബാലന്മാരെ അനുഗ്രഹിക്കട്ടെ; എന്റെ പേരും എന്റെ പിതാക്കന്മാരായ അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും പേരും ഇവരുടെമേൽ വിളിക്കപ്പെടട്ടെ[b]; അവർ ദേശത്തിന്റെ നടുവിൽ അത്യധികമായി പെരുകട്ടെ[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സകല ദോഷത്തിൽനിന്നും,’ ‘എല്ലാ അനർഥത്തിൽനിന്നും,’ അല്ലെങ്കിൽ ‘ഓരോ കഷ്ടതയിൽനിന്നും.’ എബ്രായപദം ധാർമിക തിന്മയ്ക്കു പുറമേ അനർഥത്തെയും ദോഷത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവർ എന്റെ പേരിലും എന്റെ പിതാക്കന്മാരായ അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും പേരിലും അറിയപ്പെടട്ടെ.’ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പേര് അവരുടെമേൽ വിളിക്കപ്പെടട്ടെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവർ ഒരു വലിയ സമൂഹമായി വളരട്ടെ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന അപൂർവ എബ്രായക്രിയ സമൃദ്ധമായ വർധനയെ സൂചിപ്പിക്കുന്നു; മത്സ്യങ്ങൾ പെരുകുന്നതിന്റെ ധ്വനിയും അതിലുണ്ടാകാം.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘ഭൂമിയുടെ നടുവിൽ.’ എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: מַלְאָךְ എന്നത് ദൂതൻ/സന്ദേശവാഹകൻ എന്നർഥമുള്ളതാണ്. ഇവിടെ ദൈവിക സംരക്ഷണവുമായി ബന്ധപ്പെട്ട സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; ആ ദൂതന്റെ തത്ത്വശാസ്ത്രപരമായ വ്യക്തിത്വം ഇതിലൂടെ നിർണയിക്കുന്നില്ല.
- source_word: הַגֹּאֵל אֹתִי
  choice: എന്നെ വീണ്ടെടുത്ത
  rationale: גאל എന്ന ക്രിയയുടെ പങ്കാളിവാചകം വീണ്ടെടുക്കുന്നവൻ/വിടുവിക്കുന്നവൻ എന്ന ആശയം വഹിക്കുന്നു. യാക്കോബ് തന്റെ കഴിഞ്ഞകാല സംരക്ഷണം ഓർക്കുന്നതിനാൽ മലയാളത്തിൽ പൂർത്തിയായ പ്രവൃത്തിയായി ‘വീണ്ടെടുത്ത’ എന്നു നൽകി.
- source_word: מִכָּל רָע
  choice: സകല തിന്മയിൽനിന്നും
  rationale: רָע ധാർമിക തിന്മയെയും അനർഥം, ദോഷം, കഷ്ടം എന്നിവയെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ ‘തിന്മ’ ഈ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְבָרֵךְ
  choice: അനുഗ്രഹിക്കട്ടെ
  rationale: അനുഗ്രഹവാക്യത്തിലെ yiqtol ഇവിടെ ആശംസാത്മകമാണ്; ‘അനുഗ്രഹിക്കട്ടെ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַנְּעָרִים
  choice: ഈ ബാലന്മാർ
  rationale: സന്ദർഭത്തിലെ എഫ്രയീമിനെയും മനശ്ശെയെയും സൂചിപ്പിക്കുന്ന യുവ ആൺമക്കൾ എന്ന അർഥം വ്യക്തമാക്കാൻ ‘ഈ ബാലന്മാർ’ ഉപയോഗിച്ചു.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: എന്റെ പേരും എന്റെ പിതാക്കന്മാരായ അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും പേരും ഇവരുടെമേൽ വിളിക്കപ്പെടട്ടെ
  rationale: ഒറ്റ ക്രിയ സംയുക്ത കർത്താവിനെ ഭരിക്കുന്ന എബ്രായ ഘടനയും ‘പേര് അവരുടെമേൽ വിളിക്കപ്പെടുക’ എന്ന ഭാഷാചിത്രവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
- source_word: וְיִדְגּוּ לָרֹב
  choice: അത്യധികമായി പെരുകട്ടെ
  rationale: അപൂർവമായ דגה സമൃദ്ധമായ, മത്സ്യസദൃശമായ വർധനയെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ വ്യക്തമായ ആധുനിക മലയാളം ഉപയോഗിച്ച്, ആ വ്യുത്പത്തിസൂചന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: ദേശത്തിന്റെ നടുവിൽ
  rationale: אָרֶץ എന്നതിന് ദേശം/ഭൂമി എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. പിതൃപുരുഷന്മാരുടെയും വാഗ്ദത്തദേശത്തിന്റെയും സന്ദർഭത്തിൽ ‘ദേശം’ മുൻഗണന നേടി; ‘ഭൂമി’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ അനുഗ്രഹത്തിലെ ‘ദൂതൻ’ ആരാണ് എന്ന ചോദ്യം
  choice: ‘ദൂതൻ’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തി; വ്യക്തിത്വം കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: ദൈവത്തിന്റെ പ്രത്യക്ഷീകരണം; അല്ലെങ്കിൽ ദൈവത്തിനുവേണ്ടി പ്രവർത്തിക്കുന്ന സൃഷ്ടിക്കപ്പെട്ട ദൂതൻ.
  rationale: ഈ വാക്യം ദൈവത്തെയും ദൂതനെയും അടുത്ത ബന്ധത്തിൽ അവതരിപ്പിച്ചാലും ദൂതന്റെ സത്താപരമായ വ്യക്തിത്വം വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ക്രിസ്തുശാസ്ത്രപരമോ മറ്റേതെങ്കിലും വിഭാഗീയമോ ആയ നിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള അനുഗ്രഹവാക്യശൈലി. ‘വീണ്ടെടുത്ത,’ ‘അനുഗ്രഹിക്കട്ടെ,’ ‘വിളിക്കപ്പെടട്ടെ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ മോചന, ആശംസ, നാമബന്ധ ഭാഷാചിത്രങ്ങൾ നിലനിർത്തുന്നു. പരമ്പരാഗത ബൈബിൾ നാമരൂപങ്ങളായ ‘അബ്രാഹാം,’ ‘യിസ്ഹാക്ക്’ ഉപയോഗിച്ചു.
