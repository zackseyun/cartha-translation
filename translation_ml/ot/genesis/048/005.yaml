  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: ml
  text: ഇപ്പോൾ, ഞാൻ ഈജിപ്തിൽ നിന്റെ അടുക്കൽ വരുന്നതിനുമുമ്പ് ഈജിപ്തുദേശത്ത് നിനക്കു ജനിച്ച നിന്റെ രണ്ടു പുത്രന്മാർ എന്റെവരാണ്; എഫ്രയീമും മനശ്ശെയും രൂബേനെയും ശിമെയോനെയുംപോലെ എന്റെവരായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, എഫ്രയീമിനെയും മനശ്ശെയെയും യാക്കോബ് സ്വന്തം പുത്രന്മാരായി കണക്കാക്കുന്നു; രൂബേനെയും ശിമെയോനെയുംപോലുള്ള പദവി അവർക്കും ഉണ്ടായിരിക്കും. ഹീബ്രൂ പ്രയോഗം കൂടുതൽ പദാനുസൃതമായി, ‘ഞാൻ ഈജിപ്തിൽ നിന്റെ അടുക്കൽ വന്നതുവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് യാക്കോബ് എത്തുന്നതിനുമുമ്പ് ജനിച്ച പുത്രന്മാരെയാണ്.
    reason: lexical_alternative_and_cultural_note
