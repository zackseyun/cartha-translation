- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרַיְמָה
  choice: ഞാൻ നിന്റെ അടുക്കൽ ഈജിപ്തിലേക്കു വരുന്നതിനുമുമ്പ്
  rationale: עַד എന്നതിന്റെ പദാനുസൃതമായ ‘വരെ’ എന്ന സാധ്യത നിലനിൽക്കുന്നുവെങ്കിലും, സന്ദർഭത്തിലെ കാലപരിധി മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘വരുന്നതിനുമുമ്പ്’ ഉപയോഗിച്ചു.
- source_word: לִי הֵם
  choice: എനിക്കുള്ളവരാണ്
  rationale: യാക്കോബിന്റെ പുത്രസ്ഥാനാവകാശവാദം സാങ്കേതികമായ ദത്തെടുക്കൽപദം ചേർക്കാതെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: എഫ്രയീമും മനശ്ശെയും
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: രൂബേനെയും ശിമെയോനെയുംപോലെ
  rationale: כְּ സൂചിപ്പിക്കുന്ന താരതമ്യം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: יִהְיוּ לִי
  choice: എനിക്കുള്ളവരായിരിക്കും
  rationale: ഭാവികാലത്തിലെ ഗൗരവമുള്ള പദവിപ്രഖ്യാപനം നിലനിർത്തുകയും മുൻപത്തെ ‘എനിക്കുള്ളവരാണ്’ എന്ന പ്രസ്താവനയോട് ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: എഫ്രയീമിനെയും മനശ്ശെയെയും കുറിച്ചുള്ള യാക്കോബിന്റെ അവകാശവാദത്തിന്റെ സ്വഭാവം
  choice: ‘എനിക്കുള്ളവരാണ്/എനിക്കുള്ളവരായിരിക്കും’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി പുത്രസ്ഥാനത്തിലേക്കുള്ള ഉൾപ്പെടുത്തൽ സൂചിപ്പിച്ചു.
  alternative: ‘ഞാൻ അവരെ എന്റെ പുത്രന്മാരായി ദത്തെടുക്കുന്നു’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ഹീബ്രൂവിൽ സാങ്കേതികമായ ‘ദത്തെടുക്കുക’ എന്ന പദമില്ല. അതിനാൽ ആശയം വ്യക്തമാകുമ്പോഴും നിയമപരമോ മതസിദ്ധാന്തപരമോ ആയ അധിക നിർവചനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രൂവിലെ ഈജിപ്ത് എന്ന സ്ഥലനാമത്തിന്റെ ആവർത്തനം നിലനിർത്തി; സാങ്കേതികമായ ദത്തെടുക്കൽഭാഷ ഒഴിവാക്കി.
