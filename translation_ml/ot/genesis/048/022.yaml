lexical_decisions:
- source_word: וַאֲנִי
  choice: ഞാനാകട്ടെ
  rationale: ക്രിയയിൽത്തന്നെ കർത്താവ് സൂചിതമായിരിക്കെ സ്വതന്ത്ര സർവനാമം ചേർത്തിരിക്കുന്നത് ഊന്നൽ നൽകുന്നു; ‘ഞാനാകട്ടെ’ ആ ഊന്നലും വാക്യത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נָתַתִּי
  choice: തരുന്നു
  rationale: രൂപത്തിൽ പൂർണകാലമാണെങ്കിലും, യാക്കോബ് ഔപചാരികമായി അവകാശം നൽകുന്ന ഈ നേരിട്ടുള്ള പ്രസംഗത്തിൽ ഇത് വർത്തമാനകാല നിർവഹണപ്രഖ്യാപനമായി മനസ്സിലാക്കാം.
- source_word: שְׁכֶם אַחַד
  choice: ഒരു ഓഹരി
  rationale: സന്ദർഭത്തിൽ യോസേഫിന് സഹോദരന്മാരെക്കാൾ ലഭിക്കുന്ന അധിക അവകാശവിഹിതമാണ് പ്രധാന ആശയം. എന്നാൽ שְׁכֶם എന്നതിന് ‘തോൾ/മലഞ്ചരിവ്’ എന്ന അർഥവും ശെഖേം എന്ന സ്ഥലനാമവുമായുള്ള ശബ്ദസാമ്യവും ഉള്ളതിനാൽ ആ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാർക്കുള്ളതിനെക്കാൾ … അധികമായി
  rationale: ഇവിടെ עַל താരതമ്യത്തോടൊപ്പം അധികലാഭമോ അധികവിഹിതമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: അത് ഞാൻ … പിടിച്ചെടുത്തതാണ്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനമായ ‘എടുക്കുക’ എന്ന ആശയവും പിന്നാലെയുള്ള ആയുധപ്രയോഗവും കണക്കിലെടുത്ത് ‘പിടിച്ചെടുത്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: מִיַּד הָאֱמֹרִי
  choice: അമോര്യന്റെ കൈയിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ഏകവചനവും ഒരാളുടെ അധികാരത്തിൽനിന്നോ കൈവശത്തിൽനിന്നോ എടുക്കുക എന്ന ‘കൈയിൽനിന്ന്’ പ്രയോഗവും സംരക്ഷിക്കുന്നു; ‘അമോര്യൻ’ ഇവിടെ സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനമായിരിക്കാം.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: എന്റെ വാളും വില്ലുംകൊണ്ട്
  rationale: രണ്ട് ആയുധങ്ങളുടെയും യുദ്ധചിത്രം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: שְׁכֶם എന്ന പദത്തിന്റെ ‘ഓഹരി’ എന്ന അർഥവും ശെഖേം സ്ഥലനാമവുമായുള്ള ബന്ധവും
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരു ഓഹരി’ എന്ന് നൽകി, പദത്തിന്റെ ഭൂപ്രകൃതിസംബന്ധമായ അർഥവും ശെഖേം സ്ഥലനാമത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
  alternative: ‘ഒരു മലഞ്ചരിവ്’ അല്ലെങ്കിൽ ‘ശെഖേം എന്ന ഒരു വിഹിതം’
  rationale: സന്ദർഭം യോസേഫിന് ലഭിക്കുന്ന അധിക അവകാശവിഹിതത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. അതേസമയം എബ്രായപദത്തിലെ വാക്കുകളിയും പിന്നീട് യോസേഫുമായി ബന്ധപ്പെടുന്ന ശെഖേം സ്ഥലവും പൂർണമായി ഒഴിവാക്കരുത്; അതിനാൽ പ്രധാനപാഠം വ്യക്തമായിരിക്കുമ്പോൾ അടിക്കുറിപ്പ് യഥാർഥമായ അർഥസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞാനാകട്ടെ’ എന്നത് എബ്രായത്തിലെ കർത്തൃഊന്നൽ നിലനിർത്തുന്നു; ‘ഓഹരി അധികമായി’ സാധാരണ വായനക്കാർക്ക് അവകാശവിഹിതത്തിന്റെ താരതമ്യാർഥം വ്യക്തമായി നൽകുന്നു. ആയുധങ്ങളും ‘അമോര്യന്റെ കൈയിൽനിന്ന്’ എന്ന രൂപകവും മൃദൂകരിക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
