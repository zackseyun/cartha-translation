  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: ml
  text: ഈ സംഭവങ്ങൾക്കുശേഷം യോസേഫിനോട് ഒരാൾ[a] പറഞ്ഞു, “ഇതാ, നിന്റെ പിതാവ് രോഗിയാണ്.” അപ്പോൾ അവൻ തന്റെ രണ്ടു പുത്രന്മാരെ—മനശ്ശെയെയും എഫ്രയീമിനെയും—കൂടെ കൂട്ടിക്കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘യോസേഫിനോട് അവൻ പറഞ്ഞു’ എന്നാണ്; എന്നാൽ സംസാരിച്ചയാൾ ആരെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: സംസാരിക്കുന്നയാളെ മൂലപാഠം അനിശ്ചിതമായി വിടുന്നതു വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: വിവരണത്തിലെ പുതിയ ഘട്ടത്തെയും മുൻസംഭവങ്ങളുമായുള്ള കാലബന്ധത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; דְּבָרִים എന്നതിനെ സന്ദർഭാനുസൃതമായി ‘സംഭവങ്ങൾ’ എന്നു നൽകി.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: യോസേഫിനോട് ഒരാൾ പറഞ്ഞു
  rationale: എബ്രായ പാഠം സംസാരിക്കുന്നയാളെ പേരെടുത്ത് പറയുന്നില്ല. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായിരിക്കെ ആ അനിശ്ചിതത്വം നിലനിർത്താൻ ‘ഒരാൾ’ ഉപയോഗിച്ചു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വാർത്തയുടെ അടിയന്തരത പ്രകടമാക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാള സമാനപദം.
- source_word: אָבִיךָ חֹלֶה
  choice: നിന്റെ പിതാവ് രോഗിയായിരിക്കുന്നു
  rationale: യാക്കോബിന്റെ ഇപ്പോഴത്തെ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന participial പ്രയോഗം നേരായും മാന്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: അവൻ തന്റെ രണ്ടു പുത്രന്മാരെയും കൂടെ കൊണ്ടുപോയി
  rationale: യോസേഫ് തന്റെ രണ്ടു മക്കളെ തന്നോടൊപ്പം കൂട്ടിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: മനശ്ശെയെയും എഫ്രയീമിനെയും
  rationale: വ്യക്തിനാമങ്ങളുടെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അതിപുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ പേരിടാത്ത സംസാരിക്കുന്നയാളുടെ അനിശ്ചിതത്വം നിലനിർത്തി.
