  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: ml
  text: എന്നെക്കുറിച്ചാണെങ്കിൽ, ഞാൻ പദ്ദാനിൽനിന്ന്[a] വരുമ്പോൾ, കനാൻദേശത്ത് വഴിയിൽ, എഫ്രാത്തയിൽ എത്താൻ ഇനിയും കുറെ ദൂരം ശേഷിക്കെ[c], റാഹേൽ എന്റെ അരികിൽവെച്ച് മരിച്ചു[b]. ഞാൻ അവളെ അവിടെ, എഫ്രാത്തയിലേക്കുള്ള വഴിയിൽ, അടക്കം ചെയ്തു; എഫ്രാത്ത എന്നു പറയുന്നത് ബേത്‌ലഹേം ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ “പദ്ദാൻ” എന്നു മാത്രമാണുള്ളത്. ബന്ധപ്പെട്ട മറ്റു ഭാഗങ്ങളെ അടിസ്ഥാനമാക്കി ചില വിവർത്തനങ്ങൾ ഇതിനെ “പദ്ദാൻ-അരാം” എന്നു വിപുലീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “എന്റെമേൽ മരിച്ചു.” ഈ എബ്രായപ്രയോഗം റാഹേൽ യാക്കോബിന്റെ അരികിൽവെച്ച് മരിച്ചതിനെയോ അവളുടെ മരണം അദ്ദേഹത്തിനുണ്ടാക്കിയ വ്യക്തിപരമായ ദുഃഖത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
  - marker: c
    text: “എഫ്രാത്തയിൽ എത്താൻ ഇനിയും കുറെ ദൂരം” എന്നത് ശേഷിച്ച ഒരു ഭൂദൂരം സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗമാണ്; കൃത്യമായ ദൂരം വ്യക്തമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: എന്നെക്കുറിച്ചാണെങ്കിൽ
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ സംയോജകം യാക്കോബിന്റെ വ്യക്തിപരമായ ഓർമയിലേക്കുള്ള വിഷയമാറ്റവും ഊന്നലും സൂചിപ്പിക്കുന്നു.
- source_word: מִפַּדָּן
  choice: പദ്ദാനിൽനിന്നു
  rationale: ഇവിടത്തെ എബ്രായപാഠത്തിൽ പദ്ദാൻ എന്നു മാത്രമേ ഉള്ളൂ; ബന്ധമുള്ള മറ്റു വാക്യങ്ങളെ ആശ്രയിച്ച് പദ്ദാൻ-അരാം എന്നു വിപുലീകരിച്ചിട്ടില്ല.
- source_word: מֵתָה עָלַי
  choice: എനിക്കരികെവെച്ചു മരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെമേൽ മരിച്ചു’ എന്ന അസാധാരണ പ്രയോഗം സമീപസാന്നിധ്യവും വ്യക്തിപരമായ ആഘാതവും ഒരുപോലെ സൂചിപ്പിക്കാം. പ്രധാനപാഠം സമീപസാന്നിധ്യം സ്വാഭാവികമായി നൽകുന്നു; വികാരപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: എഫ്രാത്തയിൽ എത്താൻ ഇനിയും കുറെ ദൂരം ശേഷിക്കെ
  rationale: כברת ארץ നിർദിഷ്ടമല്ലാത്ത ഒരു ഭൂദൂരത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; തെറ്റായ കൃത്യത ഒഴിവാക്കാൻ ‘കുറെ ദൂരം’ ഉപയോഗിച്ചു.
- source_word: וָאֶקְבְּרֶהָ שָׁם
  choice: ഞാൻ അവളെ അവിടെ ... അടക്കം ചെയ്തു
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവൃത്തിയും സ്ഥലസൂചനയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: הִוא בֵּית לָחֶם
  choice: എഫ്രാത്ത എന്നു പറയുന്നത് ബേത്‌ലഹേം ആണ്
  rationale: എഫ്രാത്തയെ ബേത്‌ലഹേമുമായി തിരിച്ചറിയിക്കുന്ന വിശദീകരണവാക്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: מֵתָה עָלַי എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘എനിക്കരികെവെച്ചു മരിച്ചു’
  alternative: ‘എന്റെ ദുഃഖത്തിനിടയാക്കി മരിച്ചു’ / അക്ഷരാർഥത്തിൽ ‘എന്റെമേൽ മരിച്ചു’
  rationale: സന്ദർഭം യാക്കോബിന്റെ സാന്നിധ്യവും നഷ്ടത്തിന്റെ വ്യക്തിപരമായ ഭാരവും അനുവദിക്കുന്നു. ഒറ്റ അർഥത്തിലേക്ക് തീർപ്പാക്കാതെ പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മൂലപാഠത്തിനു ചേർന്ന് ‘പദ്ദാൻ,’ ‘എഫ്രാത്ത,’ ‘ബേത്‌ലഹേം’ എന്നിങ്ങനെ നൽകി. വാക്യത്തിന്റെ ഓർമ്മപങ്കിടുന്ന വ്യക്തിപരമായ ഭാവം നിലനിർത്തി; അപൂർവമായ എബ്രായപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
