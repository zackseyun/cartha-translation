id: GEN.48.4
reference: Genesis 48:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: ‘ഇതാ, ഞാൻ നിന്നെ സന്താനസമൃദ്ധനാക്കി വർധിപ്പിക്കും; നിന്നെ ജനതകളുടെ ഒരു സമൂഹമാക്കും. നിനക്കുശേഷം നിന്റെ സന്തതിക്ക് ഈ ദേശം ശാശ്വതാവകാശമായി നൽകും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: ദൈവിക പ്രഖ്യാപനത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: നിന്നെ സന്താനസമൃദ്ധനാക്കി വർധിപ്പിക്കും
  rationale: פרה എന്ന പദത്തിന്റെ സന്താനഫലസമൃദ്ധിയും רבה എന്ന പദത്തിന്റെ വർധനയും വേർതിരിച്ചുതന്നെ പ്രകടമാക്കുന്നു.
- source_word: קְהַל עַמִּים
  choice: ജനസമൂഹം
  rationale: קהל എന്നത് കൂട്ടം/സഭയും עמים എന്നത് ജനവിഭാഗങ്ങളുമാണ്; സംയുക്തപദമായ ‘ജനസമൂഹം’ ഉറവിടത്തിന്റെ കൂട്ടായ ബഹുജന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: זַרְעֲךָ
  choice: നിന്റെ സന്തതി
  rationale: ‘വിത്ത്’ എന്ന അക്ഷരാർഥത്തിനുപകരം വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ഹീബ്രുവിലെ കൂട്ടാർഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: אֲחֻזַּת עוֹלָם
  choice: ശാശ്വതാവകാശമായി
  rationale: אֲחֻזָּהയുടെ കൈവശാവകാശ/പൈതൃകസ്വത്ത് എന്ന ആശയവും עוֹלָם എന്ന ദീർഘകാല-ശാശ്വത ഘടകവും ചേർത്ത് നൽകുന്നു.
theological_decisions:
- issue: വാഗ്ദാനത്തിന്റെ കാലപരിധി
  choice: ശാശ്വതാവകാശം
  alternative: എന്നേക്കുമുള്ള കൈവശഭൂമി
  rationale: עוֹלָם എന്ന പദത്തിന്റെ ശക്തി കുറയ്ക്കാതെ, അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയെ ഇവിടെ വിശദീകരിച്ച് നിർണ്ണയിക്കുന്നില്ല.
- issue: ‘ജനങ്ങൾ’ എന്ന ബഹുവചനത്തിന്റെ അർഥം
  choice: ജനസമൂഹം
  alternative: ജനതകളുടെ സമൂഹം
  rationale: ബഹുജന/ബഹുവംശ സാധ്യത നിലനിർത്തുമ്പോഴും വാക്യം അസ്വാഭാവികമാകാതിരിക്കാൻ സംയുക്തരൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവിക വാഗ്ദാനത്തിന്റെ നേരിട്ടുള്ള പ്രഖ്യാപനശൈലിയും സമാന്തര ക്രിയാക്രമവും നിലനിർത്തി.
