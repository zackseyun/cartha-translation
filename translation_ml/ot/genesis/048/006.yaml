id: GEN.48.6
reference: Genesis 48:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: ml
  text: എന്നാൽ അവർക്കുശേഷം നീ ജനിപ്പിക്കുന്ന നിന്റെ സന്തതി നിനക്കുള്ളവരായിരിക്കും[a][b]; അവരുടെ അവകാശവിഹിതത്തിൽ അവർ തങ്ങളുടെ സഹോദരന്മാരുടെ പേരിൽ വിളിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർക്കുശേഷം നീ ജനിപ്പിക്കുന്ന നിന്റെ മക്കൾ.’'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവർക്ക് പ്രത്യേക ഗോത്രവിഹിതം ലഭിക്കാതെ എഫ്രയീമിന്റെയും മനശ്ശെയുടെയും പേരുകളിൽ കണക്കാക്കപ്പെടും.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: നിന്റെ സന്തതി
  rationale: ജനിപ്പിക്കപ്പെട്ടവരെയോ ജനിക്കുന്ന മക്കളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘സന്തതി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: אֲשֶׁר הוֹלַדְתָּ אַחֲרֵיהֶם
  choice: അവർക്കുശേഷം നിനക്കു ജനിക്കുന്ന
  rationale: യോസേഫിന്റെ പിതൃത്വം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും എഫ്രയീമിനും മനശ്ശെയ്ക്കും ശേഷം ജനിക്കുന്നവരെന്ന സമയബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לְךָ יִהְיוּ
  choice: നിനക്കുള്ളവരായിരിക്കും
  rationale: എഫ്രയീമിനെയും മനശ്ശെയെയും യാക്കോബ് സ്വന്തമക്കളായി കണക്കാക്കിയതിൽനിന്നു വ്യത്യസ്തമായി, പിന്നീട് ജനിക്കുന്നവർ യോസേഫിനുള്ളവരായിരിക്കും എന്ന കുടുംബപരവും നിയമപരവുമായ ബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: തങ്ങളുടെ സഹോദരന്മാരുടെ പേരിൽ
  rationale: പിന്നീട് ജനിക്കുന്നവർ എഫ്രയീമിന്റെയോ മനശ്ശെയുടെയോ ഗോത്രനാമത്തിനു കീഴിൽ കണക്കാക്കപ്പെടുമെന്ന ആശയം നൽകുന്നു; അതേസമയം എബ്രായത്തിലെ ‘സഹോദരന്മാർ’ എന്ന കുടുംബപദം നിലനിർത്തുന്നു.
- source_word: יִקָּרְאוּ
  choice: വിളിക്കപ്പെടും
  rationale: קרא എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ‘വിളിക്കപ്പെടുക/പേരിടപ്പെടുക’ എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘കണക്കാക്കപ്പെടുക’ എന്ന സൂചനയും ഇതിലുണ്ട്.
- source_word: בְּנַחֲלָתָם
  choice: അവരുടെ അവകാശത്തിൽ
  rationale: נַחֲלָהയുടെ പാരമ്പര്യസ്വത്ത് അഥവാ ഗോത്രവിഹിതം എന്ന അർഥം നിലനിർത്തുന്നു; സർവനാമത്തിന്റെ സ്വാഭാവികമായ സന്ദർഭബന്ധം അനാവശ്യമായി വിശദീകരിച്ച് മൂലവാക്യത്തിലെ സംക്ഷിപ്തത ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: പിന്നീട് ജനിക്കുന്ന യോസേഫിന്റെ മക്കളുടെ ഗോത്രപരമായ സ്ഥാനം
  choice: ‘നിനക്കുള്ളവരായിരിക്കും’ എന്നും ‘സഹോദരന്മാരുടെ പേരിൽ വിളിക്കപ്പെടും’ എന്നും മൂലപാഠത്തിന്റെ നിയമ-കുടുംബ ഭാഷ നിലനിർത്തി.
  alternative: അവർക്ക് പ്രത്യേക ഗോത്രാവകാശം ലഭിക്കില്ലെന്നും എഫ്രയീമിന്റെയോ മനശ്ശെയുടെയോ കീഴിൽ കണക്കാക്കപ്പെടുമെന്നും മുഖ്യപാഠത്തിൽ വിശദമായി പറയുക.
  rationale: വിശദീകരണം സന്ദർഭത്തിൽ ന്യായമാണെങ്കിലും അത് മൂലവാക്യത്തിൽ പ്രത്യക്ഷമായി പറഞ്ഞിട്ടില്ല; അതിനാൽ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സന്തതി’, ‘അവകാശം’ എന്നിവ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും ഗോത്രപരമായ പാരമ്പര്യവിഹിതത്തിന്റെ പശ്ചാത്തലത്തിനു യോജിച്ചതുമാണ്. മൂലത്തിലെ സർവനാമബന്ധവും ‘വിളിക്കപ്പെടും’ എന്ന ഔപചാരിക ഘടനയും സാധ്യമായത്ര നിലനിർത്തിയിരിക്കുന്നു.
