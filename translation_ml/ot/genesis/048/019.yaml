  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: ml
  text: 'എന്നാൽ അവന്റെ പിതാവ് സമ്മതിക്കാതെ പറഞ്ഞു: “എനിക്കറിയാം, മകനേ, എനിക്കറിയാം. അവനും ഒരു ജനമായിത്തീരും; അവനും മഹാനായിത്തീരും. എങ്കിലും അവന്റെ ഇളയ സഹോദരൻ അവനെക്കാൾ മഹാനായിത്തീരും; അവന്റെ സന്തതി ജനതകളുടെ നിറവായിത്തീരും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനതകളുടെ ബാഹുല്യമായിത്തീരും.” എബ്രായപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ “ജനതകളുടെ നിറവ്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: സമ്മതിക്കാതെ
  rationale: മָאֵן ബോധപൂർവമായ നിരസനത്തെ സൂചിപ്പിക്കുന്നു. കൈകൾ മാറ്റാനുള്ള യോസേഫിന്റെ ശ്രമത്തോട് യാക്കോബ് സമ്മതിച്ചില്ലെന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: എനിക്കറിയാം, മകനേ, എനിക്കറിയാം
  rationale: എബ്രായത്തിലെ ഊന്നൽ നൽകുന്ന ആവർത്തനം അതേപടി നിലനിർത്തുന്നു; മലയാളത്തിൽ കർമം കൂട്ടിച്ചേർക്കാതെയും പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: അവനും ഒരു ജനമായിത്തീരും
  rationale: עָם എന്നത് ഇവിടെ ഒരു കൂട്ടായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനമായി’ എന്നത് ‘രാഷ്ട്രമായി’ എന്നതിനെക്കാൾ ഉറവിടപദത്തോട് അടുത്തതാണ്.
- source_word: וְגַם הוּא יִגְדָּל
  choice: അവനും മഹാനായിത്തീരും
  rationale: יִגְדָּל ഭാവിയിൽ പ്രാധാന്യത്തിലും നിലയിലും വളർന്ന് മഹാനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאוּלָם
  choice: എങ്കിലും
  rationale: മനശ്ശെയുടെ മഹത്ത്വവും എഫ്രയീമിന്റെ അതിലേറെ മഹത്ത്വവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: אָחִיו הַקָּטֹן
  choice: അവന്റെ ഇളയ സഹോദരൻ
  rationale: הַקָּטֹן ഇവിടെ വലുപ്പത്തെയല്ല, കുടുംബത്തിലെ പ്രായക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: അവനെക്കാൾ മഹാനായിത്തീരും
  rationale: താരതമ്യസൂചകമായ מִן മനശ്ശെയെക്കാൾ എഫ്രയീം മഹാനാകുമെന്ന അർഥം നൽകുന്നു; ‘ആയിത്തീരും’ എന്നത് വികാസപരമായ ഭാവിനുവൻസ് നിലനിർത്തുന്നു.
- source_word: וְזַרְעוֹ
  choice: അവന്റെ സന്തതി
  rationale: זֶרַע എന്ന കൂട്ടായ ഏകവചനത്തിന്റെ അർഥം മലയാളത്തിലെ ‘സന്തതി’ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: ജനതകളുടെ നിറവായിത്തീരും
  rationale: מְלֹא എന്ന ‘നിറവ്/പൂർണത’ ആശയം വ്യാഖ്യാനിച്ച് ‘ബാഹുല്യം’ എന്നു മാത്രം ചുരുക്കാതെ നിലനിർത്തുന്നു; അസാധാരണമായ മൂലപ്രയോഗത്തിന്റെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സാധ്യതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: מְלֹא הַגּוֹיִם എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ജനതകളുടെ നിറവ്
  alternative: ജനതകളുടെ ബാഹുല്യം
  rationale: ഉടൻ കാണുന്ന സന്ദർഭത്തിൽ എഫ്രയീമിന്റെ സന്തതിയുടെ വ്യാപ്തിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നതെങ്കിലും, ‘നിറവ്’ എന്ന മൂലനാമം വ്യാഖ്യാനിച്ച് ‘ബാഹുല്യം’ എന്നു തീർപ്പാക്കാതെ നിലനിർത്തുന്നു. ഇതിലൂടെ പ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തതയും പിന്നീടുള്ള അന്തർപാഠസാധ്യതയും സംരക്ഷിക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും വൈരുധ്യവും ഭാവികാല വികാസവും നിലനിർത്തി; ‘ജനതകളുടെ നിറവ്’ എന്ന അസാധാരണ പ്രയോഗം ലളിതവത്കരിക്കാതെ അടിക്കുറിപ്പിലൂടെ വ്യാഖ്യാനപരമായ മറ്റൊരു സാധ്യത നൽകി.
