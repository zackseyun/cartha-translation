  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ആലിംഗനം ചെയ്തു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ ‘ചേർത്തുപിടിച്ചു’ തിരഞ്ഞെടുത്തു; അതേസമയം അത്യന്തം സംസാരഭാഷാപരമായ രൂപം ഒഴിവാക്കി.
