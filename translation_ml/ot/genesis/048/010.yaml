  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ കണ്ണുകൾ വാർധക്യം കാരണം മങ്ങിയിരുന്നു[a]; അവന് കാണാൻ കഴിഞ്ഞില്ല. അപ്പോൾ യോസേഫ് അവരെ ഇസ്രായേലിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു[b]. ഇസ്രായേൽ അവരെ ചുംബിക്കുകയും ചേർത്തുപിടിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘വാർധക്യം കാരണം ഇസ്രായേലിന്റെ കണ്ണുകൾ ഭാരപ്പെട്ടിരുന്നു.’ ഈ പ്രയോഗം കാഴ്ചശക്തി മങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ക്രിയയുടെ കർത്താവായി യോസേഫിന്റെ പേര് ആവർത്തിക്കുന്നില്ല; മുൻസന്ദർഭത്തിൽനിന്ന് യോസേഫാണ് അവരെ ഇസ്രായേലിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നതെന്ന് വ്യക്തമാകുന്നു.
    reason: contextual_clarification
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ കണ്ണുകൾ
  rationale: എബ്രായത്തിലെ സംയുക്തനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകി. മൂലപാഠത്തിലുള്ള ‘ഇസ്രായേൽ’ എന്ന പേര് അതേപടി നിലനിർത്തി.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: വാർധക്യം നിമിത്തം ... മങ്ങിയിരുന്നു
  rationale: כָּבְדוּ എന്നതിന്റെ അക്ഷരാർഥം ‘ഭാരപ്പെട്ടിരുന്നു’ എന്നാണെങ്കിലും കാഴ്ചയെ സംബന്ധിച്ച ഈ പ്രയോഗം കാഴ്ചശക്തി മങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു. מִן കാരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിമിത്തം’ എന്നു നൽകി.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: അവന് കാണാൻ കഴിഞ്ഞില്ല
  rationale: കാണാനുള്ള കഴിവില്ലായ്മ ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും അറിയിച്ചു.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: അവരെ ഇസ്രായേലിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു
  rationale: ഹിഫ്ഇൽ ക്രിയയുടെ ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്ന സ്ഥലസൂചന നിലനിർത്തി. ക്രിയയുടെ കർത്താവ് എബ്രായത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും കർത്താവിനെ പേരെടുത്ത് വ്യക്തമാക്കാതെവച്ചു; אֵלָיו സൂചിപ്പിക്കുന്ന ഇസ്രായേലിനെ വ്യക്തതയ്ക്കായി പേരെടുത്തു.
- source_word: וַיִּשַּׁק לָהֶם
  choice: ഇസ്രായേൽ അവരെ ചുംബിക്കുകയും
  rationale: ബഹുവചന സർവനാമത്തെ സ്വാഭാവികമായി ‘അവരെ’ എന്നു നൽകി. മുൻവാക്യത്തിൽ കർത്താവിനെ പറയാതിരുന്നതിനാൽ പ്രവർത്തകൻ ഇസ്രായേലാണെന്ന് വായനക്കാരന് വ്യക്തമാകാൻ പേര് ആവർത്തിച്ചു.
- source_word: וַיְחַבֵּק לָהֶם
  choice: ചേർത്തുപിടിക്കുകയും ചെയ്തു
  rationale: സ്നേഹപൂർവമായ ആലിംഗനത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ആധുനിക മലയാളത്തിൽ അറിയിച്ചു.
theological_decisions:
- issue: וַיַּגֵּשׁ എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ കർത്താവിന്റെ പേര് ചേർത്തിട്ടില്ല
  alternative: ‘യോസേഫ് അവരെ ഇസ്രായേലിന്റെ അടുത്തേക്കു കൊണ്ടുവന്നു’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽ അവരെ തന്റെ അടുത്തേക്കു കൊണ്ടുവരുത്തി’
  rationale: എബ്രായ ക്രിയയിൽ കർത്താവ് സൂചിതമാണെങ്കിലും പേരെടുത്ത് പറഞ്ഞിട്ടില്ല. സന്ദർഭം യോസേഫിനെ പിന്തുണയ്ക്കാം; തൊട്ടുമുമ്പത്തെ വ്യാകരണകർത്താവായ ഇസ്രായേലുമായുള്ള തുടർച്ചയും ചിലർ കാണാം. ഒരു വ്യാഖ്യാനം മാത്രം പാഠത്തിൽ ഉറപ്പിക്കാതെ മൂലത്തിലെ പിരിമുറുക്കം നിലനിർത്തി.
