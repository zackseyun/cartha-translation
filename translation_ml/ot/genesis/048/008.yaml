translation:
  language: ml
  text: യിസ്രായേൽ യോസേഫിന്റെ പുത്രന്മാരെ കണ്ടപ്പോൾ[a], “ഇവർ ആരാണ്?” എന്നു പറഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘യോസേഫിന്റെ പുത്രന്മാർ.’'
    reason: lexical_alternative
  - marker: b
    text: മൂലപാഠത്തിൽ ഇവിടെ യാക്കോബിന്റെ ഉടമ്പടിനാമമായ ‘യിസ്രായേൽ’ എന്നാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുകയും തുടർന്നുള്ള ചോദ്യത്തിന് കാലസാഹചര്യം ഒരുക്കുകയും ചെയ്യുന്നു; മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായി ഈ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: യിസ്രായേൽ
  rationale: മൂലപാഠം ‘യാക്കോബ്’ എന്നല്ല, ഗോത്രപിതാവിന്റെ ഉടമ്പടിനാമമായ ‘യിസ്രായേൽ’ എന്നാണ് പറയുന്നത്; അതിനാൽ അതേ പേര് നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര പദസമാനം ആവശ്യമില്ല.
- source_word: בְּנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാരെ
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘യോസേഫിന്റെ പുത്രന്മാർ’ എന്നാണ്; വിഭക്തിയോടെ ഇത് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיֹּאמֶר
  choice: എന്നു ചോദിച്ചു
  rationale: ഹീബ്രുവിൽ പൊതുവായ ‘പറഞ്ഞു’ എന്ന ക്രിയയാണെങ്കിലും പിന്നാലെയുള്ള വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സംഭാഷണപ്രവർത്തനത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִי אֵלֶּה
  choice: ഇവർ ആരാണ്?
  rationale: മനുഷ്യരെ ചൂണ്ടിക്കാട്ടുന്ന ബഹുവചനസർവനാമത്തിന് മലയാളത്തിലെ ആദരസൂചകവും സാധാരണവുമായ ‘ഇവർ’ യോജിക്കുന്നു; ‘ആരാണ്’ തിരിച്ചറിയൽ ചോദിക്കുന്നതിനെ കൃത്യമായി നൽകുന്നു.
