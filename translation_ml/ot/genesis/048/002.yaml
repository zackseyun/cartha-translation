id: GEN.48.2
reference: Genesis 48:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֣ד לְ/יַעֲקֹ֔ב וַ/יֹּ֕אמֶר הִנֵּ֛ה בִּנְ/ךָ֥ יוֹסֵ֖ף בָּ֣א אֵלֶ֑י/ךָ וַ/יִּתְחַזֵּק֙ יִשְׂרָאֵ֔ל וַ/יֵּ֖שֶׁב עַל הַ/מִּטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: ml
  text: 'യാക്കോബിനെ വിവരം അറിയിച്ചു: “ഇതാ, നിന്റെ മകൻ യോസേഫ് നിന്റെ അടുക്കൽ വന്നിരിക്കുന്നു.” ഇസ്രായേൽ സ്വയം കരുത്ത് സംഭരിച്ച് കിടക്കയിൽ ഇരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב
  choice: ഒരാൾ യാക്കോബിനെ വിവരം അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് ‘അറിയിക്കുക, വിവരം അറിയിക്കുക’ എന്നാണ് അർഥം. എബ്രായത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിൽ അനിശ്ചിതമായ ‘ഒരാൾ’ ഉപയോഗിച്ചു.
- source_word: וַיֹּאמֶר
  choice: അയാൾ പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ രണ്ടാമത്തെ പ്രസ്താവനാക്രിയ ഒഴിവാക്കാതെ, മുമ്പുള്ള അനിശ്ചിത കർത്താവിനെ സ്വാഭാവികമായി തുടർന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഈ ദേയിക നിപാതത്തിന് ആധുനികവും മാന്യവുമായ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: בִּנְךָ יוֹסֵף
  choice: നിന്റെ മകൻ യോസേഫ്
  rationale: ബന്ധസൂചക ഘടനയും വ്യക്തിനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בָּא אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ വരവിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി കാത്തുസൂക്ഷിക്കുന്ന പ്രയോഗം.
- source_word: וַיִּתְחַזֵּק
  choice: ശക്തി സംഭരിച്ച്
  rationale: ഹിത്പാഏൽ രൂപം രോഗാവസ്ഥയിൽ സ്വയം കരുത്താർജിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക പ്രയോഗത്തിനു പകരം ഈ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിലെ ‘യാക്കോബ്’ എന്ന പേരിൽനിന്നുള്ള മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ പേരുമാറ്റം നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: കിടക്കയിൽ എഴുന്നേറ്റിരുന്നു
  rationale: രോഗിയായ യാക്കോബ് കിടന്ന നിലയിൽനിന്ന് എഴുന്നേറ്റ് ഇരുന്നതാണ് സന്ദർഭം; ‘ഇരുന്നു’ എന്ന അടിസ്ഥാനാർഥം മലയാളത്തിൽ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിൽ ‘യാക്കോബ്’, ‘ഇസ്രായേൽ’ എന്നീ രണ്ടു പേരുകളുടെ ഉപയോഗം
  choice: മൂലപാഠത്തിലെ പേരുമാറ്റം അതേപടി നിലനിർത്തുക
  alternative: ശൈലീസ്ഥിരതയ്ക്കായി രണ്ടിടത്തും ‘യാക്കോബ്’ ഉപയോഗിക്കുക
  rationale: ഈ പേരുമാറ്റത്തിന് സാഹിത്യപരമോ ദൈവശാസ്ത്രപരമോ ആയ പ്രാധാന്യം ഉണ്ടാകാം; അതിനെ ഏകീകരിക്കുന്നത് മൂലപാഠത്തിലെ സൂക്ഷ്മത ഇല്ലാതാക്കും.
- issue: വിവരം അറിയിച്ച വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: അനിശ്ചിതമായ ‘ഒരാൾ’ എന്നു നൽകുക
  alternative: സന്ദർഭത്തെ ആശ്രയിച്ച് ഒരു പ്രത്യേക ദൂതനെയോ വീട്ടുകാരനെയോ സൂചിപ്പിക്കുക
  rationale: എബ്രായപാഠം കർത്താവിന്റെ വ്യക്തിത്വം വ്യക്തമാക്കുന്നില്ല; പരിഭാഷയും അതിനെ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ രണ്ട് പ്രസ്താവനാക്രിയകളും യാക്കോബ്/ഇസ്രായേൽ പേരുമാറ്റവും സംരക്ഷിച്ചുകൊണ്ട്, രോഗാവസ്ഥയിലെ ചലനം സാധാരണ വായനക്കാരന് വ്യക്തമായി അവതരിപ്പിച്ചു.
