source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: ml
  text: അവ ആകാശവിതാനത്തിൽ ഭൂമിയുടെമേൽ വെളിച്ചം നൽകേണ്ടതിന് പ്രകാശദായകങ്ങളായിരിക്കട്ടെ[a][b]. അങ്ങനെതന്നെ ആയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിച്ചങ്ങൾ’. എബ്രായപദം അമൂർത്തമായ വെളിച്ചത്തെയല്ല, വെളിച്ചം നൽകുന്ന വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആകാശത്തിന്റെ വിശാലതയിൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ആയിരിക്കട്ടെ
  rationale: മുൻവാക്യത്തിലെ സൃഷ്ടികല്പനയുടെ ആജ്ഞാർഥം ഇവിടെ തുടരുന്നതിനാൽ, ഒരു സാധാരണ ഭാവികാലപ്രസ്താവനയ്ക്കുപകരം വിധികല്പനയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: לִמְאוֹרֹת
  choice: പ്രകാശഗോളങ്ങളായി
  rationale: מָאוֹר അമൂർത്തമായ വെളിച്ചത്തെയല്ല, വെളിച്ചം നൽകുന്ന വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിലെ ആകാശവസ്തുക്കൾക്ക് ‘പ്രകാശഗോളങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: ആകാശവിതാനത്തിൽ
  rationale: רָקִיעַ വിരിച്ചിരിക്കുന്ന വിശാലതയെയോ ആകാശവിതാനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ആകാശവിതാനം’ എബ്രായരൂപകത്തെ നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യമാണ്.
- source_word: לְהָאִיר
  choice: വെളിച്ചം നൽകാൻ
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘വെളിച്ചമുണ്ടാക്കുക/നൽകുക’ എന്ന അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയുടെമേൽ
  rationale: പ്രകാശം പതിക്കുന്ന മേഖലയെ സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന്റെ ദിശാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ദൈവകല്പനയുടെ പൂർത്തീകരണം അറിയിക്കുന്ന ഉല്പത്തി 1-ലെ ആവർത്തിത സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവചനത്തിൽ וְהָיוּ എന്നതിന്റെ ആജ്ഞാർഥം
  choice: ‘ആയിരിക്കട്ടെ’ എന്ന കല്പനയുടെ തുടർച്ചയായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആയിരിക്കും’ എന്ന ലളിത ഭാവികാലം
  rationale: വാക്യഘടനയും തൊട്ടുമുമ്പുള്ള സന്ദർഭവും ഇതിനെ ആകാശപ്രകാശങ്ങളുടെ നിയമനത്തെക്കുറിച്ചുള്ള ദൈവകല്പനയുടെ ഭാഗമായി കാണിക്കുന്നു; ഇത് കല്പനയും പൂർത്തീകരണവും എന്ന സാഹിത്യഘടന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രകാശഗോളങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുന്നു; ‘ആകാശവിതാനം’ മൂലഭാഷയിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യപാഠത്തിലെ [a][b] അനുസരിച്ചാണ്.
