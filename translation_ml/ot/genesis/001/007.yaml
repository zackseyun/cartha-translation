source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: ml
  text: അങ്ങനെ ദൈവം ആ വിസ്തൃതി ഉണ്ടാക്കുകയും വിസ്തൃതിക്കു താഴെയുള്ള വെള്ളത്തെയും വിസ്തൃതിക്കു മുകളിലുള്ള വെള്ളത്തെയും തമ്മിൽ വേർതിരിക്കുകയും ചെയ്തു.[a] അങ്ങനെതന്നെ ആയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആകാശവിതാനം” (പരമ്പരാഗതം); “ആകാശക്കമാനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ സൃഷ്ടിസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘രൂപപ്പെടുത്തി’ എന്ന കൂടുതൽ പ്രത്യേകമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടെ വരുന്ന אֱלֹהִים ഇവിടെ ഏക സ്രഷ്ടാവായ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הָרָקִיעַ
  choice: വിസ്തൃതി
  rationale: רָקִיעַ എന്നത് വിരിച്ചിട്ടതോ പരന്നുകിടക്കുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. ‘വിസ്തൃതി’ അതിന്റെ സ്ഥലപരമായ ആശയം നിലനിർത്തുകയും ഒരു പ്രത്യേക പ്രാചീന പ്രപഞ്ചമാതൃക നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּבְדֵּל
  choice: വേർതിരിച്ചു
  rationale: בדל എന്ന ക്രിയയുടെ വേർപെടുത്തുക/വ്യത്യസ്തമാക്കുക എന്ന അർഥവും ഉല്പത്തി 1-ലെ ക്രമീകരണ പ്രമേയവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: …ത്തെയും …ത്തെയും തമ്മിൽ
  rationale: രണ്ടു വിഭാഗങ്ങൾക്കിടയിലെ വേർതിരിവ് സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: מים രൂപപരമായി ബഹുവചനമാണെങ്കിലും പലപ്പോഴും ദ്രവ്യനാമമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘വെള്ളം’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: വിസ്തൃതിക്കു താഴെയുള്ള
  rationale: വിസ്തൃതിയോടുള്ള ലംബസ്ഥാനബന്ധം നേരിട്ട് സൂചിപ്പിക്കുകയും ‘മുകളിലുള്ള’ എന്നതുമായ വിരുദ്ധസമാന്തര്യം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: വിസ്തൃതിക്കു മുകളിലുള്ള
  rationale: מֵעַל എന്നതിന്റെ ‘മുകളിൽ’ എന്ന സ്ഥലപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെതന്നെ സംഭവിച്ചു
  rationale: ദൈവത്തിന്റെ കല്പന സഫലമായതിനെ അടയാളപ്പെടുത്തുന്ന ഉല്പത്തി 1-ലെ ആവർത്തനസൂത്രം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിലെ רָקִיעַ എന്ന പദത്തിന്റെ പ്രപഞ്ചശാസ്ത്രപരമായ സൂചന
  choice: വിസ്തൃതി
  alternative: ആകാശവിതാനം; ആകാശക്കമാനം
  rationale: ‘വിസ്തൃതി’ വിരിച്ചിട്ടതെന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ഉറച്ച വിതാനമെന്ന ധാരണയെയോ കമാനാകൃതിയിലുള്ള ഒരു പ്രത്യേക പ്രപഞ്ചമാതൃകയെയോ മൂലപാഠത്തേക്കാൾ കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘വിസ്തൃതി’ എന്ന പദം എബ്രായ പാഠത്തിന്റെ ഘടനയും ഊന്നലും സംരക്ഷിക്കാൻ നിലനിർത്തി; ‘വെള്ളം’ മലയാളത്തിലെ സ്വാഭാവിക ദ്രവ്യനാമമായി ഉപയോഗിച്ചു.
