id: GEN.1.9
reference: Genesis 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “ആകാശത്തിൻകീഴിലുള്ള[a] വെള്ളം ഒരു സ്ഥലത്തേക്ക് ഒന്നിച്ചുകൂടട്ടെ; ഉണങ്ങിയ നിലം പ്രത്യക്ഷമാകട്ടെ.” അങ്ങനെതന്നെ ആയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആകാശം” എന്നതിന് “ആകാശങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു שָׁמַיִם എന്ന പദം സന്ദർഭമനുസരിച്ച് ആകാശത്തെയോ ആകാശങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ‘ദൈവം പറഞ്ഞു’ എന്നത് ഈ പ്രവാഹം വ്യക്തമായി നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി സ്രഷ്ടാവായ ഏക ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: יִקָּווּ
  choice: ഒന്നിച്ചുകൂടട്ടെ
  rationale: ആജ്ഞാഭാവം നിലനിർത്തുകയും വെള്ളം ഒരിടത്തേക്ക് സമാഹരിക്കപ്പെടുന്നതെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: ഹീബ്രുവിൽ രൂപപരമായി ബഹുവചനമാണെങ്കിലും, മലയാളത്തിൽ ഈ സമുച്ചയദ്രവ്യത്തിന് സ്വാഭാവികമായ രൂപം ഏകവചനസദൃശമായ ‘വെള്ളം’ ആണ്.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: ആകാശങ്ങൾക്കു കീഴിലുള്ള
  rationale: מִן ഘടകം സ്ഥാനം സൂചിപ്പിക്കുന്ന വിശേഷണഘടനയിൽ ഉൾക്കൊള്ളുന്നു; שָׁמַיִם എന്നതിന്റെ രൂപവും സൃഷ്ടിവിവരണത്തിന്റെ ഗൗരവമുള്ള ഭാഷാശൈലിയും ‘ആകാശങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: אֶל מָקוֹם אֶחָד
  choice: ഒരു സ്ഥലത്തേക്ക്
  rationale: ഒരു ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കവും אֶחָד എന്ന ‘ഒരു’ എന്ന ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְתֵרָאֶה
  choice: പ്രത്യക്ഷമാകട്ടെ
  rationale: നിഫാൽ ആജ്ഞാഭാവത്തിന്റെ തുടർച്ചയും മൂടിക്കിടന്നിരുന്നത് ദൃശ്യമാകുന്നതെന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലം
  rationale: ഒന്നിച്ചുകൂടിയ വെള്ളത്തിൽനിന്ന് വേർതിരിഞ്ഞ് വെളിവാകുന്ന വരണ്ട ഭൂഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിലെ നാമകരണത്തിനും യോജിക്കുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ദൈവകല്പന നിറവേറിയതായി അറിയിക്കുന്ന ആവർത്തിത സൃഷ്ടിവിവരണസൂത്രം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിലെ שָׁמַיִם എന്ന പ്രപഞ്ചസംബന്ധിയായ പദം
  choice: ആകാശങ്ങൾ
  alternative: ആകാശം
  rationale: ഹീബ്രു പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ആകാശം’ അല്ലെങ്കിൽ ‘ആകാശങ്ങൾ’ എന്നർഥമാകാം. ഇവിടെ രൂപവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്താൻ ‘ആകാശങ്ങൾ’ സ്വീകരിക്കുന്നു; പ്രത്യേകമായ ഒരു പ്രപഞ്ചമാതൃക പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സൃഷ്ടിവിവരണശൈലി. ഹീബ്രു ആജ്ഞാഭാവവും നിറവേറൽസൂത്രവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
