id: GEN.1.8
reference: Genesis 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: ml
  text: ദൈവം ആ വിരിവിന്[a] “ആകാശം”[b] എന്നു പേരിട്ടു. സന്ധ്യയായി, പ്രഭാതമായി—രണ്ടാം ദിവസം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: ‘വിതാനം’ അല്ലെങ്കിൽ ‘കമാനം.’ എബ്രായപദമായ רָקִיעַ പരത്തപ്പെട്ടതോ വ്യാപിച്ചുകിടക്കുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘സ്വർഗം’ അല്ലെങ്കിൽ ‘ആകാശങ്ങൾ.’ എബ്രായപദമായ שָׁמַיִם ആകാശത്തെയോ സ്വർഗത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ദൈവം വിരിവിനു നൽകുന്ന പേരാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: പേരിട്ടു
  rationale: ל എന്ന മുൻപ്രത്യയത്തോടുകൂടിയ קרא ഇവിടെ നാമകരണം ചെയ്യുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ ‘പേരിട്ടു’ ഈ ആശയം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമാണെങ്കിലും ഉല്പത്തി 1-ൽ ഏകവചനക്രിയയോടുകൂടി ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: לָרָקִיעַ
  choice: ആ വിരിവിന്
  rationale: רָקִיעַ പരത്തപ്പെട്ടതോ വ്യാപിച്ചുകിടക്കുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. പഴയ പ്രയോഗമായ ‘വിതാനം’ എന്നതിനെക്കാൾ ‘വിരിവ്’ സാധാരണ വായനക്കാർക്ക് സുതാര്യവും, ‘കമാനം’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: שָׁמָיִם
  choice: ആകാശം
  rationale: ഇവിടെ ദൈവം വിരിവിനു നൽകുന്ന പേരാണിത്. ‘ആകാശം’ ദൃശ്യമായ മേൽവിരിവിനെയും വിശാലമായ ആകാശലോകത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്; ‘സ്വർഗം’ എന്നു പറഞ്ഞാൽ ദൈവത്തിന്റെ വാസസ്ഥലം എന്ന പിൽക്കാല ആശയം മാത്രം മുൻനിരയിലെത്താൻ ഇടയുണ്ട്.
- source_word: וַיְהִי
  choice: ആയി
  rationale: ആവർത്തിക്കുന്ന സൃഷ്ടിദിനസൂത്രത്തിൽ ‘സന്ധ്യയായി, പ്രഭാതമായി’ എന്ന മലയാളപ്രയോഗം ലളിതവും സ്വാഭാവികവുമാണ്; അതേസമയം എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: עֶרֶב
  choice: സന്ധ്യ
  rationale: സൃഷ്ടിദിനങ്ങളുടെ ആവർത്തനസൂത്രത്തിന് യോജിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: בֹקֶר
  choice: പ്രഭാതം
  rationale: സൃഷ്ടിദിനങ്ങളുടെ ആവർത്തനസൂത്രത്തിന് യോജിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: יוֹם שֵׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: שֵׁנִי-യ്ക്ക് നിർദേശകപദം ഇല്ലെങ്കിലും ദിവസങ്ങളുടെ ക്രമത്തിലെ രണ്ടാം ദിവസത്തെ അടയാളപ്പെടുത്തുന്ന ക്രമസംഖ്യയായതിനാൽ ‘രണ്ടാം ദിവസം’ എന്നു നൽകി.
theological_decisions:
- issue: שָׁמָיִם എന്നത് רָקִיעַ-യ്ക്ക് നൽകുന്ന പേരായി പരിഭാഷപ്പെടുത്തൽ
  choice: “ആകാശം”
  alternative: “സ്വർഗം” അല്ലെങ്കിൽ “ആകാശങ്ങൾ”
  rationale: വാക്യം ദൈവം വിരിവിനു പേരിടുന്നതാണ് വിവരിക്കുന്നത്. ‘ആകാശം’ ഈ നാമകരണഭാവവും സൃഷ്ടിവിവരണത്തിന്റെ ഗൗരവവും സൂക്ഷിക്കുന്നു; അതോടൊപ്പം പിൽക്കാലത്തെ ഒരു പ്രത്യേക പ്രപഞ്ചഘടനയെയോ ദൈവവാസത്തെക്കുറിച്ചുള്ള ധാരണയെയോ നിർബന്ധിക്കുന്നില്ല.
- issue: רָקִיעַ സൂചിപ്പിക്കുന്ന ഘടനയുടെ സ്വഭാവം
  choice: വിരിവ്
  alternative: വിതാനം അല്ലെങ്കിൽ കമാനം
  rationale: മൂലപദം പരത്തപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഭൗതികഘടനയെക്കുറിച്ചുള്ള തർക്കം വാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല. അതിനാൽ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്ന ‘വിരിവ്’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സൃഷ്ടിവിവരണശൈലി സ്വീകരിച്ചു. ‘എന്നു വിളിച്ചു’ എന്ന പദാനുപദരൂപത്തിന് പകരം നാമകരണത്തിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘പേരിട്ടു’ ഉപയോഗിച്ചു. ആവർത്തനസൂത്രത്തിന്റെ താളം നിലനിർത്താൻ ‘സന്ധ്യയായി, പ്രഭാതമായി—രണ്ടാം ദിവസം’ എന്നു ചുരുക്കി.
