id: GEN.1.31
reference: Genesis 1:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: ml
  text: ദൈവം താൻ ഉണ്ടാക്കിയതെല്ലാം കണ്ടു; ഇതാ, അത് വളരെ നല്ലതായിരുന്നു. സന്ധ്യയായി, പ്രഭാതമായി—ആറാം ദിവസം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ സാധാരണ കഥനരൂപം നേരിട്ട് നൽകുന്നു; സന്ദർഭത്തിലെ വിലയിരുത്തൽഭാവം നിലനിൽക്കുമ്പോഴും അതിനെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമുള്ള നാമമാണെങ്കിലും ഇവിടെ ഏകവചന ക്രിയയോടുകൂടി ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ പ്രമാണരൂപം ഇതാണ്.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: താൻ ഉണ്ടാക്കിയതെല്ലാം
  rationale: സൃഷ്ടിക്കപ്പെട്ടവയുടെ സമഗ്രത വ്യക്തമാക്കുകയും ദൈവത്തെ സൂചിപ്പിക്കുന്ന പ്രതിഫലന സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ദൃശ്യതയും ഊന്നലും നൽകുകയും ചെയ്യുന്ന הִנֵּהയുടെ പ്രഭാവം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: טוֹב מְאֹד
  choice: വളരെ നല്ലതായിരുന്നു
  rationale: טוֹב എന്നതിന്റെ വിശാലമായ ‘നല്ലത്’ എന്ന അർഥവും מְאֹדയുടെ തീവ്രതയും നിലനിർത്തുന്നു; ധാർമികമോ സൗന്ദര്യപരമോ പ്രവർത്തനപരമോ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: സന്ധ്യയായി, പ്രഭാതമായി
  rationale: ഉല്പത്തി 1-ലെ ആവർത്തിത ദിനസമാപനസൂത്രം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർത്തുന്നു; രണ്ടു ഘടകങ്ങളുടെയും ക്രമം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: ആറാം ദിവസം
  rationale: നാമത്തോടുകൂടിയ നിർദിഷ്ട ക്രമസംഖ്യയുടെ സ്വാഭാവിക മലയാളരൂപം; ഹീബ്രുവിലെ നിർദിഷ്ടത ക്രമസംഖ്യയുടെ രൂപത്തിൽ സന്ദർഭസഹജമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: טוֹב מְאֹד എന്നതിൽ സൃഷ്ടിയുടെ നന്മയുടെ സ്വഭാവം
  choice: വളരെ നല്ലതായിരുന്നു
  alternative: അത്യന്തം നല്ലതായിരുന്നു
  rationale: സൃഷ്ടിയുടെ നന്മയെക്കുറിച്ചുള്ള വിശാലമായ ഉറപ്പ് സംരക്ഷിക്കുന്നു; അതിനെ പ്രത്യേകമായി ധാർമികം, സൗന്ദര്യപരം, അല്ലെങ്കിൽ പ്രവർത്തനപരം എന്നു നിർണ്ണയിക്കുന്നില്ല.
- issue: സൃഷ്ടിദിവസങ്ങളെക്കുറിച്ചുള്ള തർക്കങ്ങൾ മുൻകൂട്ടി തീർപ്പാക്കാതെ ദിനസൂത്രം നൽകൽ
  choice: സന്ധ്യയായി, പ്രഭാതമായി—ആറാം ദിവസം
  alternative: സന്ധ്യയായി, പ്രഭാതമായി; ദിവസം ആറ്
  rationale: ഹീബ്രു സൂത്രത്തിന്റെ ക്രമവും ആറാം ദിവസത്തിന്റെ നിർദിഷ്ടതയും പിന്തുടരുന്നു; ദിവസങ്ങളുടെ ദൈർഘ്യമോ സാഹിത്യപരമായ പങ്കോ സംബന്ധിച്ച അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അതാ’ എന്നത് ഹീബ്രു ശ്രദ്ധാകർഷക കണത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു. വാക്യക്രമം മലയാള വായനാസൗകര്യത്തിന് അനുസരിച്ചെങ്കിലും മൂലപാഠത്തിന്റെ അനുക്രമവും ആവർത്തിത ദിനസൂത്രവും നിലനിർത്തിയിരിക്കുന്നു.
