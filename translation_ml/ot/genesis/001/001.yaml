id: GEN.1.1
reference: Genesis 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ml
  text: ആരംഭത്തിൽ, ദൈവം ആകാശങ്ങളും ഭൂമിയും സൃഷ്ടിച്ചപ്പോൾ[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'പരമ്പരാഗതമായി ഇതിനെ ഒരു പൂർണ്ണവാക്യമായി പരിഭാഷപ്പെടുത്തുന്നു: “ആരംഭത്തിൽ ദൈവം ആകാശങ്ങളും ഭൂമിയും സൃഷ്ടിച്ചു.” എന്നാൽ നിശ്ചയാർഥപ്രത്യയമില്ലാത്ത בְּרֵאשִׁית എന്ന പദത്തിനുശേഷം בָּרָא എന്ന ക്രിയ വരുന്നതിനാൽ, ഉല്പത്തി 2:4ബിയിലെ ഘടനപോലെ, ഇതിനെ ആശ്രിതമായ ഒരു കാലസൂചക ഉപവാക്യമായി വായിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം. അങ്ങനെ വായിക്കുമ്പോൾ മുഖ്യവാക്യം മൂന്നാം വാക്യത്തിലാണ്: “ദൈവം അരുളിച്ചെയ്തു: ‘വെളിച്ചം ഉണ്ടാകട്ടെ.’”'
    reason: Preserves the alternative traditional complete-sentence reading and the rationale for the dependent-clause rendering, while removing unnecessary English terminology.
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: ആദിയിൽ, … സൃഷ്ടിച്ചപ്പോൾ
  rationale: നിശ്ചയാർഥപ്രത്യയമില്ലാത്ത בְּרֵאשִׁית എന്ന രൂപവും പിന്നാലെയുള്ള finite verb בָּרָאയും ചേർന്ന് ആശ്രിതമായ ഒരു കാലസൂചക ഉപവാക്യമായി സ്വാഭാവികമായി വായിക്കാം. ‘ആദിയിൽ’ എന്നത് רֵאשִׁית എന്ന പദത്തിന്റെ അർഥബലം നിലനിർത്തുന്നു; ‘സൃഷ്ടിച്ചപ്പോൾ’ ആശ്രിതവാക്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: בָּרָא
  choice: സൃഷ്ടിച്ചപ്പോൾ
  rationale: בָּרָא ദൈവിക സൃഷ്ടിയെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ക്രിയയാണ്. ‘സൃഷ്ടിച്ചു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ നിർദേശിക്കപ്പെട്ട കാലസൂചക വാക്യഘടനയ്ക്കായി ‘സൃഷ്ടിച്ചപ്പോൾ’ എന്നു നൽകി.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമാണെങ്കിലും ഇവിടെ ഏകവചനക്രിയയായ בָּרָאയോടാണ് വരുന്നത്; അതിനാൽ ഏകവചനമായ ‘ദൈവം’ യോജിക്കുന്നു.
- source_word: אֵת
  choice: '[പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു]'
  rationale: אֵת എബ്രായത്തിലെ നിർണ്ണീത നേരിട്ടുള്ള കർമചിഹ്നമാണ്; മലയാളത്തിൽ അതിന് സ്വതന്ത്രമായ പദസമാനം ആവശ്യമില്ല.
- source_word: הַשָּׁמַיִם
  choice: ആകാശം
  rationale: എബ്രായരൂപം ബഹുവചനമാണെങ്കിലും ആധുനിക സാധാരണ മലയാളത്തിൽ ‘ആകാശം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ആകാശവും ഭൂമിയും’ ചേർന്ന് സൃഷ്ടിയുടെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന ദ്വന്ദപ്രയോഗമാണ്.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: אָרֶץ എന്നതിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം; ആകാശത്തോടു ചേർന്ന ഈ പ്രപഞ്ചസന്ദർഭത്തിൽ ‘ഭൂമി’യാണ് യോജിച്ചത്.
theological_decisions:
- issue: ആരംഭവാക്യത്തിന്റെ വാക്യഘടന
  choice: 'ആശ്രിത കാലസൂചക ഉപവാക്യം: ‘ആദിയിൽ, ദൈവം ആകാശവും ഭൂമിയും സൃഷ്ടിച്ചപ്പോൾ—’'
  alternative: 'സ്വതന്ത്ര പൂർണ്ണവാക്യം: ‘ആദിയിൽ ദൈവം ആകാശവും ഭൂമിയും സൃഷ്ടിച്ചു.’'
  rationale: നിശ്ചയാർഥപ്രത്യയമില്ലാത്ത בְּרֵאשִׁית, പിന്നാലെയുള്ള finite verb בָּרָא, ഉല്പത്തി 2:4ബി, ഹോശേയ 1:2 എന്നിവയിലെ സമാന കാലസൂചക തുടക്കങ്ങൾ—ഇവ ആശ്രിതവാക്യവായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ പരമ്പരാഗത സ്വതന്ത്രവാക്യവായന പുരാതന പരിഭാഷകളിലും സ്വീകരണചരിത്രത്തിലും ശക്തമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; വാക്യഘടനയിലെ യഥാർഥ അനിശ്ചിതത്വം സിദ്ധാന്തപരമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആകാശവും ഭൂമിയും’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ സമഗ്രതാസൂചക പ്രയോഗമായി നിലനിർത്തി. ദീർഘരേഖ വാക്യം തുടരുമെന്ന ആശ്രിതഘടന സൂചിപ്പിക്കുന്നു.
