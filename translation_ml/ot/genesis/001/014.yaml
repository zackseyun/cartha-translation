id: GEN.1.14
reference: Genesis 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “പകലിനെ രാത്രിയിൽനിന്ന് വേർതിരിക്കാൻ ആകാശവിസ്തൃതിയിൽ വെളിച്ചങ്ങൾ ഉണ്ടാകട്ടെ. അവ അടയാളങ്ങൾക്കും നിശ്ചിതകാലങ്ങൾക്കും[a] ദിവസങ്ങൾക്കും വർഷങ്ങൾക്കും ആയിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഋതുക്കൾക്കും.” ഹീബ്രു പദത്തിന് ‘നിശ്ചയിക്കപ്പെട്ട സമയങ്ങൾ’ എന്ന അർഥമുണ്ട്; മറ്റു സന്ദർഭങ്ങളിൽ അത് ഉത്സവകാലങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: പ്രകാശഗോളങ്ങൾ
  rationale: ഈ നാമം വെളിച്ചം വഹിക്കുന്നതോ പുറപ്പെടുവിക്കുന്നതോ ആയ ആകാശവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. ‘പ്രകാശഗോളങ്ങൾ’ എന്നത് സൂര്യൻ, ചന്ദ്രൻ തുടങ്ങിയവയെ മുൻകൂട്ടി പേരിടാതെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רָקִיעַ הַשָּׁמַיִם
  choice: ആകാശവിതാനം
  rationale: വിരിച്ചിരിക്കുന്ന ആകാശമേഖല എന്ന ആശയം നൽകുന്ന, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന സാഹിത്യഗൗരവമുള്ള പ്രയോഗമാണിത്; നിർബന്ധമായും ഖരമായ ഒരു ഗോളക്കവചം എന്ന വ്യാഖ്യാനം ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: പകലിനെയും രാത്രിയെയും വേർതിരിക്കേണ്ടതിന്
  rationale: ഹീബ്രു ഉദ്ദേശ്യാർഥകമായ infinitive-നെയും ആവർത്തിച്ച ‘ഇടയിൽ’ ഘടനയെയും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לְאֹתֹת
  choice: അടയാളങ്ങൾക്കും
  rationale: ആകാശത്തിലെ നിരീക്ഷിക്കാവുന്ന സൂചകങ്ങൾ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; അതിനെ ശകുനങ്ങൾ എന്നോ അത്ഭുതചിഹ്നങ്ങൾ എന്നോ ചുരുക്കുന്നില്ല.
- source_word: לְמוֹעֲדִים
  choice: നിശ്ചിതകാലങ്ങൾക്കും
  rationale: മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയങ്ങൾ, ഋതുക്കൾ, ഉത്സവകാലങ്ങൾ എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയുന്ന മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: לְיָמִים וְשָׁנִים
  choice: ദിവസങ്ങൾക്കും വർഷങ്ങൾക്കും
  rationale: മൂലപാഠത്തിലെ കാലഘടകങ്ങളെ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יְהִי ... וְהָיוּ
  choice: ഉണ്ടാകട്ടെ ... വേണ്ടിയാകട്ടെ
  rationale: സൃഷ്ടികൽപ്പനയുടെ വിധ്യർഥഭാവം നിലനിർത്തുന്നു; രണ്ടാമത്തെ ക്രിയയെ വെറും ഭാവികാല പ്രവചനമായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിൽ מוֹעֲדִים എന്ന പദത്തിന്റെ അർഥം
  choice: വിശാലമായ അർഥമുള്ള ‘നിശ്ചിതകാലങ്ങൾ’
  alternative: ‘ഋതുക്കൾ’ അല്ലെങ്കിൽ ‘ഉത്സവകാലങ്ങൾ’
  rationale: സന്ദർഭം കാലത്തിന്റെ പ്രപഞ്ചക്രമീകരണമാണ്. അതിനാൽ കാലാവസ്ഥാ ഋതുക്കളിലേക്കോ ഇസ്രായേലിന്റെ ആരാധനോത്സവങ്ങളിലേക്കോ മാത്രം അർഥം ചുരുക്കാതെ, രണ്ടിനുമുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവവചനത്തിന്റെ സൃഷ്ടികൽപ്പനാഭാവം നിലനിർത്താൻ ‘അരുളിച്ചെയ്തു’, ‘ഉണ്ടാകട്ടെ’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. പട്ടികയിലെ ദത്തിവിഭക്തി ആവർത്തിച്ച് ഹീബ്രു ഘടനയുടെ ഊന്നൽ സംരക്ഷിച്ചു.
