id: GEN.1.2
reference: Genesis 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: ml
  text: ഭൂമി രൂപമില്ലാത്തതും ശൂന്യവുമായിരുന്നു; ആഴിയുടെ മീതെ ഇരുട്ടുണ്ടായിരുന്നു; ദൈവത്തിന്റെ ആത്മാവ്[a] വെള്ളത്തിന്റെ മീതെ പൊങ്ങിനിന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിൽനിന്നുള്ള ഒരു കാറ്റ്” അല്ലെങ്കിൽ “ദൈവത്തിന്റെ കാറ്റ്” വെള്ളത്തിന്റെ മീതെ വീശിക്കൊണ്ടിരുന്നു.
    reason: רוּחַ אֱלֹהִים എന്ന ഹീബ്രു പ്രയോഗത്തിന് ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നും ‘ദൈവത്തിൽനിന്നുള്ള ഒരു കാറ്റ്’ അഥവാ ‘ദൈവത്തിന്റെ കാറ്റ്’ എന്നും അർഥമാകാം; അടിക്കുറിപ്പ് ഈ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: ഭൂമി
  rationale: הָאָרֶץ എന്നത് ഇവിടെ ‘ഭൂമി’ എന്നാണ്. വാക്യാരംഭത്തിലെ ו മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ‘ഭൂമിയോ/ഭൂമിയാകട്ടെ’ എന്ന കൃത്രിമ പ്രയോഗം ഒഴിവാക്കി സ്വാഭാവികമായ വാക്യബന്ധത്തിലൂടെ അത് പ്രകടമാക്കുന്നു.
- source_word: הָיְתָה
  choice: ആയിരുന്നു
  rationale: ഇവിടെയുള്ള היה ഒരു അവസ്ഥയെ വിവരിക്കുന്നതാണ്; മാറ്റം സംഭവിച്ചുവെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കുന്ന ‘ആയിത്തീർന്നു’ എന്നതിനെക്കാൾ ‘ആയിരുന്നു’ യോജിക്കുന്നു.
- source_word: תֹהוּ וָבֹהוּ
  choice: രൂപമില്ലാത്തതും ശൂന്യവും
  rationale: രൂപപ്പെടാത്ത, ജനവാസമോ നിറവോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പദജോടിയുടെ അർഥം ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְחֹשֶׁךְ
  choice: ഇരുട്ട്
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: עַל־פְּנֵי
  choice: ഉപരിതലത്തിനുമീതെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മുഖത്തിന്മേൽ’ എന്നതിനു പകരം അതേ സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְהוֹם
  choice: ആഴി
  rationale: ആദിമമായ ആഴക്കടൽ/ജലഗർത്തം എന്ന ആശയം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു; ‘അഗാധം’ എന്നത് ജലസൂചന കുറയ്ക്കാം.
- source_word: וְרוּחַ אֱלֹהִים
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: רוּחַ എന്നതിന് ‘ആത്മാവ്’, ‘കാറ്റ്’, ‘ശ്വാസം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. പ്രധാനപാഠത്തിൽ ശക്തവും പരമ്പരാഗതവുമായ ‘ദൈവത്തിന്റെ ആത്മാവ്’ സ്വീകരിച്ച്, ‘ദൈവത്തിൽനിന്നുള്ള കാറ്റ്/ദൈവത്തിന്റെ കാറ്റ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מְרַחֶפֶת
  choice: ചിറകടിച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായ, ചിറകുവിരിച്ച് ഇളകിനിൽക്കുന്ന ചലനത്തിന്റെ ദൃശ്യഭാവം participle-ൽ ഉണ്ട്. ‘പാറിക്കൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ഒരിടത്തിനുമീതെയുള്ള sustained movement ഇത് വ്യക്തമാക്കുന്നു.
- source_word: הַמָּיִם
  choice: വെള്ളം
  rationale: ഹീബ്രുവിൽ രൂപപരമായി ബഹുവചനസദൃശമാണെങ്കിലും വെള്ളത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ നാമമാണ്; മലയാളത്തിൽ ‘വെള്ളങ്ങൾ’ അസ്വാഭാവികമായതിനാൽ ഏകവചനസമൂഹനാമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: הָיְתָה എന്നത് അവസ്ഥയെയോ അവസ്ഥാമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആയിരുന്നു
  alternative: ആയിത്തീർന്നു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഭൂമിയുടെ അന്നത്തെ അവസ്ഥയാണ് വിവരിക്കുന്നത്. ‘ആയിത്തീർന്നു’ എന്നു വിവർത്തനം ചെയ്യാൻ വ്യാകരണപരമായ സാധ്യത ഉണ്ടായാലും, അവസ്ഥാമാറ്റം ഇവിടെ നിർബന്ധിതമല്ല; അതിനാൽ പാഠം പറയാത്ത ഒരു മുൻസംഭവമോ സിദ്ധാന്തമോ ചേർക്കുന്നില്ല.
- issue: וְרוּחַ אֱלֹהִים ദൈവത്തിന്റെ ആത്മാവിനെയോ ദൈവത്തിൽനിന്നുള്ള കാറ്റിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ഒരു കാറ്റ് / ദൈവത്തിന്റെ കാറ്റ്
  rationale: ഹീബ്രു പ്രയോഗം യഥാർഥത്തിൽ രണ്ടർഥസാധ്യതയുള്ളതാണ്. പ്രധാനപാഠത്തിൽ ‘ദൈവത്തിന്റെ ആത്മാവ്’ സ്വീകരിക്കുമ്പോഴും കാലാവസ്ഥാസംബന്ധിയായ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ച് വ്യാഖ്യാനപരമായ സംഘർഷം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആഴി’ സൃഷ്ടിവിവരണത്തിന്റെ ജലഗഹനത നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിൽ നീണ്ട ഏകവാക്യം ഒഴിവാക്കി അർദ്ധവിരാമങ്ങളിലൂടെ സമാന്തര ഘടന വ്യക്തമായി അവതരിപ്പിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ആത്മാവ്’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ വെച്ചു.
