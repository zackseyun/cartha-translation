  to: ഭൂമി രൂപമില്ലാത്തതും ശൂന്യവുമായിരുന്നു; ആഴിയുടെ മീതെ ഇരുട്ടുണ്ടായിരുന്നു; ദൈവത്തിന്റെ ആത്മാവ്[a] വെള്ളത്തിന്റെ മീതെ പൊങ്ങിനിന്നുകൊണ്ടിരുന്നു.
