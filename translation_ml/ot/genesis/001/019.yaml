    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയി
  rationale: ആവർത്തിച്ചുവരുന്ന സൃഷ്ടിദിന സമാപനസൂത്രത്തിൽ היה എന്ന ക്രിയയുടെ സംഭവനില സൂചിപ്പിക്കുന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘ആയിത്തീർന്നു’ എന്ന മാറ്റത്തിന്റെ അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: עֶרֶב
  choice: സന്ധ്യ
  rationale: ‘സന്ധ്യ’ എന്നത് עֶרֶב എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിലെ ബൈബിൾശൈലിക്ക് യോജിച്ചതുമായ സാധാരണ തുല്യപദമാണ്.
- source_word: וַיְהִי
  choice: ആയി
  rationale: എബ്രായത്തിലെ ആവർത്തനവും താളവും നിലനിർത്താൻ ആദ്യ ക്രിയയോടു സമാനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בֹּקֶר
  choice: പ്രഭാതം
  rationale: בֹּקֶר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാള തുല്യപദം; ‘പുലരി’യെക്കാൾ മൂലപദത്തിന്റെ പൊതുവായ അർത്ഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: יוֹם רְבִיעִי
  choice: നാലാം ദിവസം
  rationale: എബ്രായത്തിലെ ക്രമസംഖ്യയോടുകൂടിയ ദിനനിർദേശം നേരിട്ട് നൽകുന്നു. മലയാളത്തിൽ നിർദ്ദിഷ്ടതയ്ക്ക് വേറെ വിവക്തോപപദം ആവശ്യമില്ല.
theological_decisions:
- issue: സൃഷ്ടിദിനത്തിന്റെ സ്വഭാവമോ ദൈർഘ്യമോ സംബന്ധിച്ച ഒരു പ്രത്യേക വ്യാഖ്യാനം ചേർക്കാതെ ആവർത്തനസൂത്രം പരിഭാഷപ്പെടുത്തൽ
  choice: സന്ധ്യയായി, പ്രഭാതമായി—നാലാം ദിവസം.
  alternative: സന്ധ്യയായി, പ്രഭാതമായി; ഒരു നാലാം ദിവസം.
  rationale: മൂലപാഠത്തിലെ സന്ധ്യ–പ്രഭാത ആവർത്തനവും ക്രമസംഖ്യയും മാത്രം നിലനിർത്തുന്നു; ‘ദിവസം’ എത്ര ദൈർഘ്യമുള്ളതാണെന്ന വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംക്ഷിപ്ത ശൈലി. എബ്രായ ആവർത്തനസൂത്രത്തിന്റെ താളം നിലനിർത്തിയിരിക്കുന്നു.
