id: GEN.1.30
reference: Genesis 1:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: ml
  text: ഭൂമിയിലെ എല്ലാ മൃഗങ്ങൾക്കും, ആകാശത്തിലെ എല്ലാ പറവകൾക്കും, ഭൂമിയിൽ ഇഴഞ്ഞുനീങ്ങുന്ന സകല ജീവജാലങ്ങൾക്കും, എല്ലാ പച്ചസസ്യങ്ങളും ആഹാരമാണ്.[a] അങ്ങനെ സംഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഈ ഉപവാക്യത്തിന് വ്യക്തമായി പറഞ്ഞ ക്രിയയില്ല; 29-ാം വാക്യത്തിലെ “ഞാൻ നൽകിയിരിക്കുന്നു” എന്ന ആശയം ഇവിടെ തുടരുന്നതായി മനസ്സിലാക്കി, “എല്ലാ പച്ചസസ്യങ്ങളും ഞാൻ ആഹാരമായി നൽകിയിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ellipsis_from_context
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: ഭൂമിയിലെ എല്ലാ മൃഗങ്ങൾക്കും
  rationale: חַיָּה ഇവിടെ കരയിൽ ജീവിക്കുന്ന മൃഗങ്ങളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘മൃഗങ്ങൾ’ സ്വാഭാവികവും ‘കാട്ടുമൃഗങ്ങൾ’ എന്ന അനാവശ്യമായ പരിമിതപ്പെടുത്തൽ ഒഴിവാക്കുന്നതുമാണ്.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ എല്ലാ പറവകൾക്കും
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും സൃഷ്ടിവിവരണത്തിൽ ‘പറവകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; שָׁמַיִם ഇവിടെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകാശം’ എന്നു വരുന്നു.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: ഭൂമിയിൽ ഇഴഞ്ഞുനീങ്ങുന്നവയിൽ ... എല്ലാറ്റിനും
  rationale: רמשׂ ഭൂമിയിലൂടെ ഇഴയുകയോ ചെറുതായി നീങ്ങുകയോ ചെയ്യുന്ന ജീവികളെ സൂചിപ്പിക്കുന്നു. ‘ഇഴഞ്ഞുനീങ്ങുന്ന’ എന്നത് അതിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: ജീവൻ ഉള്ള
  rationale: נֶפֶשׁ חַיָּה ഇവിടെ ജീവിക്കുന്ന സത്തയെയോ ജന്തുജീവനെയോ സൂചിപ്പിക്കുന്നു. ‘ജീവൻ ഉള്ള’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഇതിനെ വ്യത്യസ്തമായ נִשְׁמַת חַיִּים എന്ന പ്രയോഗത്തിന്റെ അർഥമായ ‘ജീവശ്വാസം’ എന്നു തെറ്റായി കലർത്തുന്നില്ല.
- source_word: אֶת כָּל יֶרֶק עֵשֶׂב
  choice: പച്ചസസ്യങ്ങളെല്ലാം
  rationale: יֶרֶק עֵשֶׂב പച്ചയായ സസ്യവളർച്ചയെയോ സസ്യാഹാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പച്ചസസ്യങ്ങളെല്ലാം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: לְאָכְלָה
  choice: ആഹാരമാണ്
  rationale: ലാമെദ് ഘടന ഭക്ഷണത്തിനായുള്ള ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽനിന്ന് ക്രിയ ആശയപരമായി തുടരുന്നതിനാൽ ‘ആഹാരമാണ്’ മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യം നൽകുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ഉല്പത്തി 1-ലെ ദൈവവചനത്തിന്റെ നിറവേറ്റൽസൂത്രം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: മൃഗങ്ങളെക്കുറിച്ചുള്ള נֶפֶשׁ חַיָּה എന്ന പ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘ജീവൻ ഉള്ള’
  alternative: ‘ജീവനുള്ള പ്രാണൻ ഉള്ള’ അഥവാ ‘ജീവിക്കുന്ന സത്തയുള്ള’
  rationale: ഈ പ്രയോഗം ജന്തുക്കളുടെ സജീവജീവിതത്തെ സൂചിപ്പിക്കുന്നു. ‘ജീവാത്മാവ്’ എന്നു നൽകിയാൽ മലയാളത്തിൽ അനാവശ്യമായ ആത്മാവുസംബന്ധിയായ സിദ്ധാന്താർഥം വരാം; ‘ജീവശ്വാസം’ എന്നു നൽകിയാൽ ഉല്പത്തി 2:7-ലെ വ്യത്യസ്തമായ נִשְׁמַת חַיִּים എന്ന പ്രയോഗവുമായി കലരും. അടുക്കിയ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ഈ വാക്യത്തിലെ നിഗൂഢമായ ക്രിയ
  choice: ‘പച്ചസസ്യങ്ങളെല്ലാം ആഹാരമാണ്’ എന്ന ക്രിയാസമ്പന്നമായ മലയാളവാക്യം
  alternative: മുൻവാക്യത്തിൽനിന്ന് ക്രിയ പൂരിപ്പിച്ച് ‘പച്ചസസ്യങ്ങളെല്ലാം ഞാൻ ആഹാരമായി നൽകിയിരിക്കുന്നു’
  rationale: എബ്രായപാഠത്തിൽ ഈ വാക്യത്തിൽ ‘നൽകി’ എന്ന ക്രിയ ആവർത്തിക്കുന്നില്ല; അത് 1:29-ൽനിന്ന് ആശയപരമായി തുടരുന്നു. മുഖ്യപാഠം ഇല്ലാത്ത ക്രിയ നേരിട്ട് ചേർക്കാതെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സൃഷ്ടിവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘പറവകൾ’, ‘ഇഴഞ്ഞുനീങ്ങുന്ന’, ‘ആഹാരം’ എന്നീ പദങ്ങൾ സാഹിത്യഗൗരവവും സ്വാഭാവികതയും സമന്വയിപ്പിക്കുന്നു.
