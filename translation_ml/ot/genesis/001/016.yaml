id: GEN.1.16
reference: Genesis 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: ml
  text: 'ദൈവം രണ്ടു വലിയ പ്രകാശഗോളങ്ങളെ ഉണ്ടാക്കി: പകലിനെ ഭരിക്കാൻ വലുതായ പ്രകാശഗോളവും രാത്രിയെ ഭരിക്കാൻ ചെറുതായ പ്രകാശഗോളവും നക്ഷത്രങ്ങളും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, അവസാനഭാഗം കൂടുതൽ വ്യക്തമായി: ‘നക്ഷത്രങ്ങളെയും [ഉണ്ടാക്കി].’'
    reason: എബ്രായത്തിലെ സംയോജകവും നേരിട്ടുള്ള കർമചിഹ്നവും നക്ഷത്രങ്ങളെ ‘ഉണ്ടാക്കി’ എന്ന ക്രിയയുടെ മറ്റൊരു കർമമായി ചേർക്കുന്നു; മലയാളത്തിൽ ക്രിയയെ സൂചിപ്പിച്ച് ഈ ബന്ധം കൂടുതൽ വ്യക്തമാക്കാം.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ നേരിട്ട് നൽകുന്നു; ‘നിയമിച്ചു’ എന്ന് വിവർത്തനം ചെയ്താൽ സന്ദർഭത്തിലെ ചുമതല ക്രിയയിൽ അനാവശ്യമായി ചേർക്കപ്പെടും.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഉല്പത്തി 1-ൽ ഏകവചന ക്രിയയോടുകൂടിയ אֱלֹהִים ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും മാനകവുമായ രൂപം ‘ദൈവം’ ആണ്.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: വലിയ രണ്ടു പ്രകാശഗോളങ്ങളെ
  rationale: מָאוֹר പ്രകാശം നൽകുന്ന ആകാശഗോളത്തെ സൂചിപ്പിക്കുന്നു. ‘പ്രകാശഗോളങ്ങൾ’ എന്നത് സൂര്യൻ, ചന്ദ്രൻ എന്നീ പേരുകൾ ഇറക്കുമതി ചെയ്യാതെ വസ്തുനിഷ്ഠമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: വലുതായ പ്രകാശഗോളം
  rationale: גדול/קטן എന്ന താരതമ്യവിരുദ്ധത നിലനിർത്താൻ ‘വലുതായ’ എന്നും ‘ചെറുതായ’ എന്നും സമാന്തരമായി നൽകിയിരിക്കുന്നു.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: പകലിനെ ഭരിക്കാൻ
  rationale: מֶמְשֶׁלֶת എന്നത് ഭരണം/ആധിപത്യം എന്ന അർഥം വഹിക്കുന്നു; ഉദ്ദേശ്യസൂചകമായ לְ മലയാളത്തിൽ ‘ഭരിക്കാൻ’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: ചെറുതായ പ്രകാശഗോളം
  rationale: קטן എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘ചെറുത്’ ആണ്; വലിയ പ്രകാശഗോളത്തോടുള്ള സമാന്തരവിരുദ്ധത ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: രാത്രിയെ ഭരിക്കാൻ
  rationale: പകലിനെ സംബന്ധിച്ച മുൻവാക്യഘടനയോടുള്ള എബ്രായ സമാന്തരതയും ‘ഭരണം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: നക്ഷത്രങ്ങളും
  rationale: സംയോജകമായ וְ അധികമായി സൃഷ്ടിക്കപ്പെട്ട വസ്തുക്കളെ ഹ്രസ്വമായി ചേർക്കുന്നു; മലയാളത്തിലെ ‘-ഉം’ ആ ഏകോപനവും ചേർത്തുപറയുന്ന ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ആകാശഗോളങ്ങളെ സൂര്യൻ, ചന്ദ്രൻ എന്നു പേരിട്ട് വിവർത്തനം ചെയ്യണമോ
  choice: ‘വലുതായ പ്രകാശഗോളം’, ‘ചെറുതായ പ്രകാശഗോളം’ എന്നു നിലനിർത്തി.
  alternative: ‘സൂര്യൻ’, ‘ചന്ദ്രൻ’
  rationale: എബ്രായമൂലം സാധാരണ പേരുകളായ ‘സൂര്യൻ’, ‘ചന്ദ്രൻ’ എന്നിവയ്ക്കു പകരം מָאוֹר എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മൂലത്തിന്റെ പ്രത്യേക പദപ്രയോഗം സംരക്ഷിക്കുകയും പാഠത്തിൽ ഇല്ലാത്ത പേരുകൾ ചേർക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തരഘടനയും ‘വലിയ/ചെറിയ’ വിരുദ്ധതയും സംരക്ഷിച്ചു; ‘പ്രകാശഗോളം’ സാധാരണ വായനക്കാർക്ക് അർഥവ്യക്തത നൽകുന്നതിനൊപ്പം സൂര്യൻ/ചന്ദ്രൻ എന്നില്ലാത്ത മൂലപദപ്രയോഗവും നിലനിർത്തുന്നു.
