    reason: lexical_alternative
  - marker: b
    text: ‘നമുക്ക് ഉണ്ടാക്കാം’, ‘നമ്മുടെ സ്വരൂപത്തിൽ’, ‘നമ്മുടെ സാദൃശ്യപ്രകാരം’ എന്നീ ബഹുവചനപ്രയോഗങ്ങൾ ഹീബ്രുവിലുള്ളതുപോലെ നിലനിർത്തിയിരിക്കുന്നു. ഇവയെ ദൈവിക ആത്മാലോചനയായോ സ്വർഗീയ സദസ്സിനോടുള്ള അഭിസംബോധനയായോ—ക്രൈസ്തവ സമഗ്രവേദവായനയിൽ—പിന്നീടുള്ള ത്രിത്വവെളിപ്പാടിനോട് യോജിക്കുന്ന മുൻസൂചനയായോ വ്യത്യസ്തമായി മനസ്സിലാക്കാറുണ്ട്.
