id: GEN.1.26
reference: Genesis 1:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം പറഞ്ഞു: “നമ്മുടെ സ്വരൂപത്തിൽ, നമ്മുടെ സാദൃശ്യപ്രകാരം നമുക്ക്[b] മനുഷ്യനെ[a] ഉണ്ടാക്കാം. സമുദ്രത്തിലെ മത്സ്യങ്ങളെയും ആകാശത്തിലെ പക്ഷികളെയും[d] വളർത്തുമൃഗങ്ങളെയും ഭൂമിയെയാകെയും ഭൂമിയിൽ ഇഴയുന്ന എല്ലാ ഇഴജന്തുക്കളെയും അവർ ഭരിക്കട്ടെ.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യവർഗത്തെ’ അല്ലെങ്കിൽ ‘മാനവരാശിയെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രു אָדָם (ആദാം) സമാഹാര ഏകവചനമാണ്—മനുഷ്യരെ ഒരു വർഗമായി കണക്കാക്കുന്നു. അതുകൊണ്ടാണ് തുടർന്ന് ‘അവർ ഭരിക്കട്ടെ’ എന്ന ബഹുവചനം വരുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നമുക്ക് ഉണ്ടാക്കാം’, ‘നമ്മുടെ സ്വരൂപത്തിൽ’, ‘നമ്മുടെ സാദൃശ്യപ്രകാരം’ എന്നീ ബഹുവചനപ്രയോഗങ്ങൾ ഹീബ്രുവിലുള്ളതുപോലെ നിലനിർത്തിയിരിക്കുന്നു. ഇവയെ ദൈവിക ആത്മാലോചനയായോ സ്വർഗീയ സദസ്സിനോടുള്ള അഭിസംബോധനയായോ—ക്രൈസ്തവ സമഗ്രവേദവായനയിൽ—പിന്നീടുള്ള ത്രിത്വവെളിപ്പാടിനോട് യോജിക്കുന്ന മുൻസൂചനയായോ വ്യത്യസ്തമായി മനസ്സിലാക്കാറുണ്ട്.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘അധീശത്വം പുലർത്തട്ടെ.’
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ ‘ആകാശങ്ങളുടെ പക്ഷികൾ’; മലയാളത്തിൽ ‘ആകാശത്തിലെ പക്ഷികൾ’ എന്നതാണ് സ്വാഭാവികം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ദൈവം പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ആ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: נַעֲשֶׂה
  choice: നമുക്ക് ... ഉണ്ടാക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ആഹ്വാനരൂപത്തിന്റെ ആലോചനാത്മക ഭാവവും ബഹുവചനവും നിലനിർത്തുന്നു; ‘സൃഷ്ടിക്കാം’ എന്നതിനെക്കാൾ ‘ഉണ്ടാക്കാം’ עשה എന്ന ക്രിയയോട് അടുത്തതാണ്.
- source_word: אָדָם
  choice: മനുഷ്യനെ
  rationale: ഇവിടെ പദം മനുഷ്യവർഗത്തെ ഏകകമായി സൂചിപ്പിക്കുന്ന സമാഹാര ഏകവചനമാണ്. മലയാളത്തിലെ ‘മനുഷ്യൻ’ എന്ന രൂപം പ്രതിനിധാനപരമായ ഏകവചനവും പൊതുവായ മനുഷ്യസൂചനയും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בְּצַלְמֵנוּ
  choice: നമ്മുടെ സ്വരൂപത്തിൽ
  rationale: צלם എന്നതിലെ രൂപം/പ്രതിനിധാനം എന്ന ആശയം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: כִּדְמוּתֵנוּ
  choice: നമ്മുടെ സാദൃശ്യപ്രകാരം
  rationale: דמות സൂചിപ്പിക്കുന്ന സാമ്യം അഥവാ മാതൃകാനുരൂപത വ്യക്തമാക്കുകയും ‘സ്വരൂപം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְיִרְדּוּ
  choice: അവർ ഭരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞാർത്ഥ/അനുവാദക ഭാവം സംരക്ഷിക്കുന്നു; സമാഹാര ഏകവചനമായ ‘മനുഷ്യനെ’ തുടർന്ന് വരുന്ന ബഹുവചനം അതേപടി നിലനിർത്തുന്നു.
- source_word: בִדְגַת הַיָּם
  choice: സമുദ്രത്തിലെ മത്സ്യങ്ങളുടെമേൽ
  rationale: ഹീബ്രു സംയുക്തഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പക്ഷികളുടെമേൽ
  rationale: עוף ഇവിടെ പറക്കുന്ന ജീവികളെ, സന്ദർഭത്തിൽ പക്ഷികളെ, സൂചിപ്പിക്കുന്നു; שמים-ന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘ആകാശം’ ആണ്.
- source_word: וּבַבְּהֵמָה
  choice: വളർത്തുമൃഗങ്ങളുടെമേൽ
  rationale: בהמה ഇവിടെ വീട്ടിൽ വളർത്തുന്ന കരമൃഗങ്ങളുടെ വർഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ എന്നത് ചില വായനക്കാർക്ക് അതിയായി ചുരുങ്ങിയതായി തോന്നാം.
- source_word: וּבְכָל הָאָרֶץ
  choice: ഭൂമി മുഴുവന്റെയുംമേൽ
  rationale: ഉല്പത്തി 1-ലെ സർവലൗകിക വ്യാപ്തി നിലനിർത്തുന്നു; പ്രാദേശിക ‘ദേശം’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: ഇഴയുന്ന സകല ഇഴജന്തുക്കളുടെയുംമേൽ
  rationale: നാമത്തിന്റെയും അതേ ധാതുവിൽനിന്നുള്ള കൃദന്തരൂപത്തിന്റെയും ആവർത്തനം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നമുക്ക് ഉണ്ടാക്കാം ... നമ്മുടെ സ്വരൂപത്തിൽ ... നമ്മുടെ സാദൃശ്യപ്രകാരം’ എന്ന ബഹുവചന ദൈവവചനം
  choice: ആരോടാണ് ദൈവം സംസാരിക്കുന്നതെന്നോ ബഹുവചനത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർഥമെന്തെന്നോ മുഖ്യവാചകത്തിൽ നിർണയിക്കാതെ ബഹുവചനം സംരക്ഷിച്ചു.
  alternative: ദൈവിക ആത്മാലോചന; സ്വർഗീയസഭയോടുള്ള അഭിസംബോധന; ക്രൈസ്തവ സമഗ്രവേദവായനയിൽ ത്രിത്വവെളിപ്പാടിനോട് യോജിക്കുന്ന മുൻസൂചന.
  rationale: ഹീബ്രു ഒന്നാംപുരുഷ ബഹുവചനമാണ് ഉപയോഗിക്കുന്നത്. വിവർത്തനം ആ യഥാർഥമായ തുറന്ന നിലയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഹരിക്കാതെ നിലനിർത്തണം.
- issue: אָדָם എന്ന സമാഹാര ഏകവചനം
  choice: മുഖ്യവാചകത്തിൽ ‘മനുഷ്യനെ’ എന്ന് ഏകവചനമായി നൽകി, തുടർന്ന് ‘അവർ’ എന്ന ബഹുവചനം നിലനിർത്തി.
  alternative: ‘മനുഷ്യവർഗത്തെ’ അല്ലെങ്കിൽ ‘മാനവരാശിയെ’ എന്ന് വ്യക്തമാക്കുക.
  rationale: മൂലത്തിലെ ഏകവചന-ബഹുവചന പരസ്പരബന്ധം സംരക്ഷിക്കുന്നതോടൊപ്പം ഇവിടെ മുഴുവൻ മനുഷ്യരെയും ഉദ്ദേശിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: മനുഷ്യന്റെ അധികാരം
  choice: ‘ഭരിക്കട്ടെ’ എന്നു നൽകി.
  alternative: ‘അധീശത്വം പുലർത്തട്ടെ’ അല്ലെങ്കിൽ ‘ആധിപത്യം നടത്തട്ടെ’.
  rationale: רדה അധികാരത്തോടെ ഭരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭരിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ഈ വാക്യം മാത്രം ആശ്രയിച്ച് ആ ഭരണത്തിന്റെ സ്വഭാവത്തെ ചൂഷണമെന്നോ പരിപാലനമെന്നോ അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘സ്വരൂപം’, ‘സാദൃശ്യം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; എന്നാൽ ദുഷ്കരമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. പട്ടികയിലെ ആവർത്തിച്ച ‘മേൽ’ മലയാളവാക്യത്തിൽ സംയുക്ത ഷഷ്ഠിവിഭക്തിയിലൂടെ ഒറ്റത്തവണ നൽകിയെങ്കിലും ഓരോ ഘടകത്തിനുമേലുള്ള ഭരണബന്ധം വ്യക്തമാണ്.
