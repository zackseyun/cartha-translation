id: GEN.1.6
reference: Genesis 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “വെള്ളങ്ങളുടെ മധ്യത്തിൽ ഒരു വിസ്തൃതി[a] ഉണ്ടാകട്ടെ; അതു വെള്ളങ്ങളെ വെള്ളങ്ങളിൽനിന്ന് വേർതിരിക്കട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിതാനം,” “ആകാശവിതാനം,” “കമാനം,” അല്ലെങ്കിൽ “താഴികക്കുടം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വിരിച്ചോ പരത്തിയോ ഉള്ള ഒന്നിനെ സൂചിപ്പിക്കുന്നു; പുരാതന പ്രപഞ്ചചിത്രത്തെ എത്ര വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു എന്നതനുസരിച്ച് പരിഭാഷകൾ വ്യത്യാസപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വെള്ളങ്ങൾക്കും വെള്ളങ്ങൾക്കും ഇടയിൽ [വേർതിരിക്കുന്നതായിരിക്കട്ടെ].” അതായത്, ഒരു ജലസമൂഹത്തെ മറ്റൊന്നിൽനിന്ന് വേർതിരിക്കുന്നതായിരിക്കട്ടെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ പുരോഗതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലി നിലനിർത്താൻ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഏകവചന ക്രിയയോടുകൂടെ ഏക സ്രഷ്ടാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൈവം’ എന്നത് സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളരൂപമാണ്.
- source_word: יְהִי
  choice: ഉണ്ടാകട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപം ദൈവിക കല്പനയെ പ്രകടിപ്പിക്കുന്നു. ‘ഉണ്ടാകട്ടെ’ അതിന്റെ നിർവഹണശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: רָקִיעַ
  choice: വിതാനം
  rationale: ഈ പദം വിരിച്ചോ പരത്തിയോ ഉള്ള ഒന്നിനെ സൂചിപ്പിക്കുന്നു. ‘വിതാനം’ ആ ആശയം നിലനിർത്തുന്നു; അതേസമയം അതിന്റെ കൃത്യമായ ഭൗതികരൂപത്തെ മുഖ്യവാക്യത്തിൽ നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: בְּתוֹךְ הַמָּיִם
  choice: വെള്ളങ്ങളുടെ മധ്യത്തിൽ
  rationale: ആദിമജലങ്ങളുടെ നടുവിലുള്ള സ്ഥാനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. മַיִם എന്ന രൂപത്തിന്റെ സമൂഹബഹുവചന ഭാവം ‘വെള്ളങ്ങൾ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וִיהִי מַבְדִּיל
  choice: അതു ... വേർതിരിക്കട്ടെ
  rationale: മുൻപത്തെ ജസ്സീവ് കല്പന തുടരുകയും വിതാനത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാൻ ‘അതു’ ചേർത്തു.
- source_word: בֵּין מַיִם לָמָיִם
  choice: വെള്ളത്തെ വെള്ളത്തിൽനിന്ന്
  rationale: ഹീബ്രു പദാനുപദമായി ‘വെള്ളങ്ങൾക്കും വെള്ളങ്ങൾക്കും ഇടയിൽ’ എന്നാണ്. വേർതിരിക്കൽ സൂചിപ്പിക്കുന്ന മലയാളക്രിയയോടൊപ്പം ‘വെള്ളത്തെ വെള്ളത്തിൽനിന്ന്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി രണ്ട് ജലസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: רָקִיעַ എന്ന പദവും പുരാതന പ്രപഞ്ചചിത്രവും
  choice: വിതാനം
  alternative: വിസ്തൃതി; ആകാശവിതാനം; കമാനം; താഴികക്കുടം
  rationale: വാക്യം ജലങ്ങളുടെ നടുവിൽ അവയെ വേർതിരിക്കുന്നതായി വിരിച്ചിരിക്കുന്ന ഒന്നിനെ വിവരിക്കുന്നു. ‘വിതാനം’ മൂലപദത്തിന്റെ അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; എന്നാൽ അതിനെ ഉറച്ച കമാനമോ നിർദിഷ്ടമായ മറ്റൊരു പ്രപഞ്ചഘടനയോ ആയി മുഖ്യവാക്യത്തിൽ തീർപ്പാക്കുന്നില്ല. സാധ്യതയുള്ള കൂടുതൽ നിർദിഷ്ട രൂപങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘ആകാശവിതാനം’ എന്നതിനു പകരം ‘വിതാനം’ തെരഞ്ഞെടുത്തത്, അടുത്ത വാക്യത്തിനു മുമ്പേ അതിനെ ‘ആകാശം’ എന്നു തിരിച്ചറിയാതിരിക്കാനും മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്താനുമാണ്. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും ബന്ധപ്പെട്ട പദത്തിനോ വാക്യഭാഗത്തിനോ പിന്നാലെ നൽകിയിരിക്കുന്നു.
