  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു[a]: “വെളിച്ചം ഉണ്ടാകട്ടെ.” വെളിച്ചം ഉണ്ടായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെളിച്ചം ഉണ്ടാകണമേ.” ഹീബ്രുവിൽ ഇച്ഛയെയോ കല്പനയെയോ പ്രകടിപ്പിക്കുന്ന ജൂസിവ് ക്രിയാരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ എന്നത് ഹീബ്രു ആഖ്യാനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമുള്ള ഈ നാമത്തിന് ഇവിടെ ഏകവചനക്രിയയാണ്; ഉല്പത്തി 1-ൽ ഇത് ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ മലയാളത്തിലെ പതിവായ ‘ദൈവം’ ഉപയോഗിച്ചു.
- source_word: יְהִי
  choice: ഉണ്ടാകട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ jussive രൂപം ഇച്ഛയെയോ കല്പനയെയോ പ്രകടിപ്പിക്കുന്നു. സൃഷ്ടികല്പനയുടെ അർഥവും ഗൗരവവും ‘ഉണ്ടാകട്ടെ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אוֹר
  choice: വെളിച്ചം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വെളിച്ചം’ എന്നാണ്; ഇവിടെ അതിനെ പ്രത്യേക പ്രകാശസ്രോതസ്സായോ ആലങ്കാരിക അർഥമായോ ചുരുക്കാൻ സന്ദർഭപരമായ കാരണമില്ല.
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: היה എന്ന ക്രിയയുടെ wayyiqtol രൂപം ദൈവവചനത്തിന്റെ ഉടനെയുള്ള ഫലം അറിയിക്കുന്നു. ‘ഉണ്ടായി’ എന്ന സംക്ഷിപ്തരൂപം ആ ഫലസിദ്ധി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אוֹר
  choice: വെളിച്ചം
  rationale: കല്പനയും അതിന്റെ നിറവേറലും തമ്മിലുള്ള ബന്ധം ഊന്നിപ്പറയുന്ന ഹീബ്രു ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
theological_decisions:
- issue: ദൈവത്തിന്റെ സൃഷ്ടികല്പനയുടെ പരിഭാഷ
  choice: വെളിച്ചം ഉണ്ടാകട്ടെ
  alternative: വെളിച്ചം ഉണ്ടായിരിക്കട്ടെ / വെളിച്ചം ഉണ്ടാകണമേ
  rationale: ഹീബ്രു jussive ദൈവഹിതത്തെയോ ഫലപ്രദമായ കല്പനയെയോ പ്രകടിപ്പിക്കുന്നു. ‘ഉണ്ടാകട്ടെ’ അതിന്റെ കല്പനാത്മക ശക്തി നിലനിർത്തുന്നു; ‘ഉണ്ടാകണമേ’ എന്നത് പ്രാർഥനാഭാവം അനാവശ്യമായി വരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തനവും കല്പന–നിറവേറൽ ഘടനയും നിലനിർത്തി; സാങ്കേതിക പദമായ ‘jussive’ വിശദീകരണത്തിനായി അടിക്കുറിപ്പിൽ മാത്രം ഉപയോഗിച്ചു.
