- from: 'ദൈവം അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് പറഞ്ഞു: “ഫലവത്താകുവിൻ, പെരുകുവിൻ, സമുദ്രങ്ങളിലെ ജലം നിറയ്ക്കുവിൻ; പക്ഷികൾ[a] ഭൂമിയിൽ പെരുകട്ടെ.”'
