source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: ml
  text: 'ദൈവം അവരെ അനുഗ്രഹിച്ചു പറഞ്ഞു: “ഫലവത്താകുവിൻ, പെരുകുവിൻ, സമുദ്രങ്ങളിലെ ജലത്തെ നിറയ്ക്കുവിൻ; പക്ഷികൾ[a] ഭൂമിയിൽ പെരുകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പറക്കുന്ന ജീവികൾ’; എബ്രായത്തിലെ עוֹף എന്ന പദം പക്ഷികളെക്കാൾ വിശാലമായി പറക്കുന്ന ജീവികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: പീയേൽ രൂപം അനുഗ്രഹം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ദൈവിക പ്രവൃത്തിയും അനുഗ്രഹത്തിന്റെ ഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: മുൻവാക്യത്തിൽ സൃഷ്ടിക്കപ്പെട്ട സമുദ്രജീവികളെയും പക്ഷികളെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഉല്പത്തി 1-ൽ ഏകവചന ക്രിയയോടുകൂടെ ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള പദം.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: פְּרוּ
  choice: ഫലവത്താകുവിൻ
  rationale: പ്രത്യുത്പാദനശേഷിയെയും സന്താനവർധനയെയും സൂചിപ്പിക്കുന്ന രൂപകഭാവം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘പെരുകുവിൻ’ എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: וּרְבוּ
  choice: പെരുകുവിൻ
  rationale: എണ്ണത്തിൽ വർധിക്കുക എന്ന അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וּמִלְאוּ
  choice: നിറയ്ക്കുവിൻ
  rationale: מלא എന്ന ക്രിയയുടെ ‘നിറയ്ക്കുക’ എന്ന അടിസ്ഥാനാർഥം അധിക ഊന്നൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֶת הַמַּיִם
  choice: ജലം
  rationale: എബ്രായത്തിലെ രൂപപരമായ ബഹുവചനം മലയാളത്തിൽ സാധാരണയായി ഏകവചന സമാഹാരനാമമായ ‘ജലം’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בַּיַּמִּים
  choice: സമുദ്രങ്ങളിലെ
  rationale: ים എന്ന പദത്തിന്റെ ബഹുവചനം സംരക്ഷിക്കുകയും ജലം നിറയേണ്ട മേഖലയെന്ന ബന്ധം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: וְהָעוֹף
  choice: പക്ഷികൾ
  rationale: സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായ അർഥം; എങ്കിലും עוֹף എന്ന പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: יִרֶב
  choice: പെരുകട്ടെ
  rationale: കല്പനാത്മകമായ ആശീർവാദത്തിന്റെ ഭാവമുള്ള ജസ്സീവ് രൂപം ഭാവികാല പ്രവചനമാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: പക്ഷികൾ വർധിക്കുന്ന ഭൗമിക മേഖലയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷ.
theological_decisions:
- issue: അനുഗ്രഹവചനത്തിന്റെ പ്രവൃത്തിസ്വഭാവം
  choice: ആദ്യ ക്രിയകൾ കല്പനാരൂപത്തിലും അവസാന ക്രിയ ആശംസാത്മകമായ ‘പെരുകട്ടെ’ എന്ന രൂപത്തിലും നൽകി.
  alternative: എല്ലാ ക്രിയകളും നേരിട്ടുള്ള കല്പനകളാക്കുക; അല്ലെങ്കിൽ അവസാനത്തെ ക്രിയയെ ‘പെരുകും’ എന്ന ലളിതഭാവിയായി നൽകുക.
  rationale: എബ്രായത്തിൽ ദൈവത്തിന്റെ അനുഗ്രഹം കല്പനാത്മക ഇംപെറേറ്റീവുകളും ജസ്സീവ് രൂപവും വഴിയാണ് പ്രകടമാകുന്നത്. പരിഭാഷ അതിനെ വെറും കല്പനയോ വെറും പ്രവചനമോ ആക്കാതെ ആ ഭാവവൈവിധ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സൃഷ്ടിവിവരണത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്താൻ ‘ഫലവത്താകുവിൻ’, ‘പെരുകുവിൻ’, ‘നിറയ്ക്കുവിൻ’ എന്നീ സാഹിത്യപരമായെങ്കിലും പൊതുവേ മനസ്സിലാകുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] പ്രധാനപാഠത്തിലെ ‘പക്ഷികൾ’ എന്ന പദത്തോടു ചേർത്തിരിക്കുന്നു.
