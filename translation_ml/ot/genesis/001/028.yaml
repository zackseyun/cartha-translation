revisions:
- from: 'ദൈവം അവരെ അനുഗ്രഹിച്ചു. ദൈവം അവരോടു പറഞ്ഞു: “ഫലവത്താകുവിൻ, പെരുകുവിൻ, ഭൂമിയിൽ നിറയുവിൻ; അതിനെ കീഴടക്കുവിൻ. സമുദ്രത്തിലെ മത്സ്യങ്ങളുടെയും ആകാശത്തിലെ പറവകളുടെയും ഭൂമിയിൽ സഞ്ചരിക്കുന്ന[b] സകല ജീവികളുടെയും മേൽ ഭരിക്കുവിൻ[a].”'
  to: 'ദൈവം അവരെ അനുഗ്രഹിച്ചു. ദൈവം അവരോടു പറഞ്ഞു: “ഫലവത്താകുവിൻ, പെരുകുവിൻ, ഭൂമിയെ നിറയ്ക്കുവിൻ; അതിനെ കീഴടക്കുവിൻ. സമുദ്രത്തിലെ മത്സ്യങ്ങളുടെയും ആകാശത്തിലെ പറവകളുടെയും ഭൂമിയിൽ സഞ്ചരിക്കുന്ന[b] സകല ജീവികളുടെയും മേൽ ഭരിക്കുവിൻ[a].”'
  rationale: ‘ഭൂമിയിൽ നിറയുവിൻ’ എന്ന സ്ഥാനസൂചനയെ ‘ഭൂമിയെ നിറയ്ക്കുവിൻ’ എന്ന കർമസൂചനയായി തിരുത്തി എബ്രായത്തിലെ אֶת־ഹാʼാരെץ-ന്റെ നേരിട്ടുള്ള കർമബന്ധം പുനഃസ്ഥാപിച്ചു. മറ്റെല്ലാ വാചകങ്ങളും മൂലപാഠത്തോടും ആധുനിക പ്രമാണമലയാളത്തിന്റെ ശൈലിയോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
