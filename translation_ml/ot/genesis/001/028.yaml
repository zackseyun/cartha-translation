id: GEN.1.28
reference: Genesis 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: ml
  text: 'ദൈവം അവരെ അനുഗ്രഹിച്ചു. ദൈവം അവരോടു പറഞ്ഞു: “ഫലവത്താകുവിൻ, പെരുകുവിൻ, ഭൂമിയെ നിറയ്ക്കുവിൻ; അതിനെ കീഴടക്കുവിൻ. സമുദ്രത്തിലെ മത്സ്യങ്ങളുടെയും ആകാശത്തിലെ പറവകളുടെയും ഭൂമിയിൽ സഞ്ചരിക്കുന്ന[b] സകല ജീവികളുടെയും മേൽ ഭരിക്കുവിൻ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആധിപത്യം നടത്തുവിൻ.”'
    reason: רדה എന്ന ക്രിയയുടെ ‘ഭരിക്കുക/ആധിപത്യം നടത്തുക’ എന്ന സാധുവായ പദവികല്പം.
  - marker: b
    text: 'അഥവാ: “ഇഴയുന്ന.”'
    reason: רמש നിലത്തുകൂടി നീങ്ങുന്നതിനെയും ഇഴയുന്നതിനെയും സൂചിപ്പിക്കാം; പ്രധാനപാഠത്തിലെ വിശാലമായ പരിഭാഷയ്ക്കുള്ള പദവികല്പം.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: പീയേൽ രൂപം അനുഗ്രഹം യാഥാർഥ്യമായി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പ്രമാണികവുമായ തത്തുല്യം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: פְּרוּ
  choice: ഫലവത്താകുവിൻ
  rationale: സന്താനോൽപാദനവും വംശവർധനവും സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; അടുത്തുള്ള ‘പെരുകുവിൻ’ എന്ന ക്രിയയുമായി അർത്ഥസമന്വയവുമുണ്ട്.
- source_word: וּרְבוּ
  choice: പെരുകുവിൻ
  rationale: എണ്ണത്തിൽ വർധിക്കുക എന്ന നേരിട്ടുള്ള അർത്ഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וּמִלְאוּ
  choice: നിറയുവിൻ
  rationale: מלא എന്ന ക്രിയയുടെ ‘നിറയ്ക്കുക/നിറയുക’ എന്ന അർത്ഥം, ഭൂമിയെ മനുഷ്യർ നിറയ്ക്കുക എന്ന സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ഉല്പത്തി 1-ലെ സാർവലൗകിക സൃഷ്ടിസന്ദർഭത്തിൽ ഒരു പ്രാദേശിക ദേശത്തേക്കാൾ മുഴുവൻ ഭൂമിയാണ് ഉദ്ദേശ്യം.
- source_word: וְכִבְשֻׁהָ
  choice: അതിനെ കീഴടക്കുവിൻ
  rationale: നിയന്ത്രണത്തിൻ കീഴിൽ കൊണ്ടുവരുക എന്ന כבש-ന്റെ ശക്തി മയപ്പെടുത്താതെയും ചൂഷണാർത്ഥം കൂട്ടിച്ചേർക്കാതെയും നിലനിർത്തുന്നു.
- source_word: וּרְדוּ
  choice: മേൽ ഭരിക്കുവിൻ
  rationale: רדה സൂചിപ്പിക്കുന്ന ഭരണാധികാരത്തിന്റെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִּדְגַת הַיָּם
  choice: സമുദ്രത്തിലെ മത്സ്യങ്ങൾ
  rationale: വിശാലമായ സമുദ്രജീവികൾ എന്നതിലുപരി മൂലപദം പ്രത്യേകം സൂചിപ്പിക്കുന്ന മത്സ്യങ്ങളെ കൃത്യമായി നൽകുന്നു.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: ആകാശത്തിലെ പറവകൾ
  rationale: עוֹף-ന്റെ സന്ദർഭോചിതമായ അർത്ഥം ‘പറവകൾ’ എന്നും שָּׁמַיִם-നെ സ്വാഭാവികമായി ‘ആകാശം’ എന്നും നൽകി.
- source_word: בְכָל חַיָּה
  choice: സകല ജീവികൾ
  rationale: חַיָּה-യുടെ വിശാലമായ ജീവി/മൃഗം എന്ന പരിധി നിലനിർത്തുകയും കാട്ടുമൃഗങ്ങൾ എന്ന ചുരുങ്ങിയ അർത്ഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הָרֹמֶשֶׂת
  choice: സഞ്ചരിക്കുന്ന
  rationale: നിലത്തു നീങ്ങുന്ന ജീവികളെ വിശാലമായി ഉൾക്കൊള്ളുന്നു; ‘ഇഴയുന്ന’ എന്ന കൂടുതൽ സവിശേഷമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: כבש, רדה എന്നീ ക്രിയകളിലെ മനുഷ്യാധികാരത്തിന്റെ ശക്തി
  choice: ‘കീഴടക്കുവിൻ’, ‘മേൽ ഭരിക്കുവിൻ’ എന്ന ശക്തമായ ഭരണഭാഷ നിലനിർത്തി.
  alternative: ‘പരിപാലിക്കുവിൻ’, ‘കാര്യസ്ഥരായിരിക്കുവിൻ’, അല്ലെങ്കിൽ ‘ആധിപത്യം നടത്തുവിൻ’.
  rationale: എബ്രായക്രിയകൾ വെറും പരിപാലനത്തേക്കാൾ ശക്തമാണ്. അതേസമയം ചൂഷണപരമായ അർത്ഥമോ പരിസ്ഥിതിപരമായ വ്യാഖ്യാനമോ പാഠത്തിലേക്ക് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- issue: הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ഭൂമി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദേശം’.
  rationale: ഉല്പത്തി 1-ലെ സാർവലൗകിക സൃഷ്ടിവിവരണത്തിൽ ഇത് ഒരു പ്രാദേശിക ദേശത്തെയല്ല, ഭൂമിയെ ആകെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ബഹുവചന ആജ്ഞകൾക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ച് വാക്യത്തിന്റെ ഔന്നത്യവും ആവർത്തനഘടനയും നിലനിർത്തി; അനാവശ്യമായി പുരാതനമായ പദങ്ങൾ ഒഴിവാക്കി.
