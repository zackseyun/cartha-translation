- from: ഭൂമിക്കു വെളിച്ചം നൽകേണ്ടതിന് ദൈവം അവയെ ആകാശവിതാനത്തിൽ സ്ഥാപിച്ചു.[a]
  to: ദൈവം അവയെ ആകാശവിതാനത്തിൽ ഭൂമിക്കു വെളിച്ചം നൽകാൻ സ്ഥാപിച്ചു.[a]
  rationale: A minimal revision replaces a potentially necessity-bearing Malayalam construction with an unambiguous purposive infinitive. All other wording, including the natural compound “ആകാശവിതാനം” and the lexical-alternative footnote, is retained.
