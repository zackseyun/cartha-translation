id: GEN.1.17
reference: Genesis 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: ml
  text: ദൈവം അവയെ ആകാശവിതാനത്തിൽ ഭൂമിക്കു വെളിച്ചം നൽകാൻ സ്ഥാപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശങ്ങളുടെ വിതാനത്തിൽ.’
    reason: רָקִיעַ הַשָּׁמַיִם എന്ന എബ്രായപ്രയോഗത്തിന്റെ കൂടുതൽ പദാനുപദമായ രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: സ്ഥാപിച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘വെച്ചു/നൽകി’ എന്ന അർഥമുണ്ടെങ്കിലും, ഇവിടെ ജ്യോതികളെ ഉദ്ദേശ്യപൂർവം അവയുടെ സ്ഥാനത്തു വെച്ചതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: אֹתָם
  choice: അവയെ
  rationale: മുൻവാക്യത്തിലെ വലിയ ജ്യോതി, ചെറിയ ജ്യോതി, നക്ഷത്രങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമസർവനാമം.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഉല്പത്തി 1-ൽ ഏകവചന ക്രിയയോടുകൂടെ ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സാധാരണ മലയാളരൂപമായ ‘ദൈവം’ ഉപയോഗിച്ചു.
- source_word: בִּרְקִיעַ
  choice: ആകാശവിതാനത്തിൽ
  rationale: רָקִיעַ വിരിച്ചുപരന്ന വിസ്തൃതിയെ സൂചിപ്പിക്കുന്നു. ‘ആകാശവിതാനം’ പുരാതന പാഠത്തിന്റെ സ്ഥലസങ്കൽപ്പം നിലനിർത്തുകയും ‘ഉറച്ച ആകാശക്കവചം’ പോലുള്ള അതിവ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: הַשָּׁמַיִם
  choice: ആകാശ
  rationale: רָקִיעַ הַשָּׁמַיִם എന്ന സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകാശവിതാനം’ എന്നു ചേർത്തെഴുതി; ഇതിലൂടെ ‘ആകാശങ്ങളുടെ വിതാനം’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കി.
- source_word: לְהָאִיר
  choice: വെളിച്ചം നൽകേണ്ടതിന്
  rationale: 'אור എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കാരണാർഥകമാണ്: വെറും ‘പ്രകാശിക്കുക’ എന്നതിലുപരി ‘വെളിച്ചം നൽകുക’ എന്നാണ്. לְ എന്ന ഉദ്ദേശ്യാർഥവും ‘-േണ്ടതിന്’ വഴി പ്രകടമാക്കി.'
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിക്കു
  rationale: ഇവിടെ עַל הָאָרֶץ പ്രകാശം എത്തുന്ന ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ഭൂമിക്കു വെളിച്ചം നൽകുക’ എന്നത് സ്വാഭാവിക മലയാളമാണ്; ‘ഭൂമിയുടെമേൽ’ എന്ന രൂപം കൂടുതൽ പദാനുപദമെങ്കിലും കുറച്ച് കൃത്രിമമാണ്.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിലെ רָקִיעַ എന്ന പ്രപഞ്ചഘടനാപദം
  choice: ആകാശവിതാനം
  alternative: ആകാശമണ്ഡലം; ഉറച്ച ആകാശക്കവചം
  rationale: ‘ആകാശവിതാനം’ മൂലപദത്തിലെ വിരിച്ചുപരന്ന സ്ഥലസങ്കൽപ്പം നിലനിർത്തുന്നു. അതേസമയം, ഉറച്ച ഘടനയെന്ന വ്യാഖ്യാനമോ ആധുനിക ശാസ്ത്രീയ പ്രപഞ്ചചിത്രമോ പാഠത്തിലേക്ക് നിർബന്ധമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു; വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
