source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “വെള്ളങ്ങൾ ജീവനുള്ള ജീവികളാൽ തിങ്ങട്ടെ[a]; പറവകൾ[b] ഭൂമിക്കു മീതെ ആകാശവിതാനത്തിന്റെ[c] പരപ്പിലൂടെ പറക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “വെള്ളങ്ങൾ ജീവനുള്ള ജീവികളുടെ കൂട്ടംകൂട്ടമായി തിങ്ങട്ടെ.” എബ്രായത്തിൽ ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ഉപയോഗിച്ച് ജീവന്റെ സമൃദ്ധി ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “പറക്കുന്ന ജീവികൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ പദം പക്ഷികളെക്കാൾ വിശാലമായ അർത്ഥത്തിൽ വരാം.
    reason: lexical_alternative
  - marker: c
    text: “ആകാശപ്പരപ്പ്,” “ആകാശക്കുട” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ ആഖ്യാനക്രിയയെ ലളിതവും സ്വാഭാവികവുമായ മലയാള ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യക്രമം തന്നെ ആഖ്യാനത്തുടർച്ച വ്യക്തമാക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടെ സ്രഷ്ടാവായ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനുള്ള സ്വാഭാവിക മലയാള പദം.
- source_word: יִשְׁרְצוּ ... שֶׁרֶץ
  choice: കൂട്ടങ്ങളാൽ തിങ്ങട്ടെ
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള എബ്രായ ക്രിയയും നാമവും സമൃദ്ധമായ, ചലനപൂർണമായ ജീവസാന്നിധ്യത്തെ ഊന്നുന്നു. പദാനുപദ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ ‘കൂട്ടങ്ങളാൽ തിങ്ങട്ടെ’ എന്ന രൂപം ആ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמַּיִם
  choice: വെള്ളങ്ങൾ
  rationale: ഉല്പത്തി 1-ലെ എബ്രായ ബഹുവചന രൂപവും സൃഷ്ടിവിവരണത്തിന്റെ വിശാലമായ ജലസങ്കല്പവും നിലനിർത്തുന്നു.
- source_word: נֶפֶשׁ חַיָּה
  choice: ജീവനുള്ള ജീവികൾ
  rationale: ഇവിടെ സചേതനമായ ജന്തുജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാക്കൾ’ എന്ന വിവർത്തനം പാഠത്തിൽ ഇല്ലാത്ത സാങ്കേതിക ദൈവശാസ്ത്രാർത്ഥം വരുത്താനിടയുണ്ട്.
- source_word: עוֹף
  choice: പറവകൾ
  rationale: സാധാരണ വായനയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം; എബ്രായ പദത്തിന്റെ വിശാലമായ ‘പറക്കുന്ന ജീവികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְעוֹפֵף
  choice: പറക്കട്ടെ
  rationale: ക്രിയയുടെ പറക്കൽ എന്ന അടിസ്ഥാന അർത്ഥവും നിർദേശാത്മകമായ ജസ്സീവ് ഭാവവും വ്യക്തമായി നൽകുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിക്കു മീതെ
  rationale: പറക്കലിന്റെ പശ്ചാത്തലത്തിൽ עַל സൂചിപ്പിക്കുന്ന മുകളിലായുള്ള സ്ഥാനമോ ചലനമോ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל־פְּנֵי
  choice: പരപ്പിലൂടെ
  rationale: ‘മുഖത്തിന്മേൽ/മുഖത്തുകൂടെ’ എന്ന എബ്രായ ദൃശ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി, വിശാലതയുടെ മുൻപരപ്പിലൂടെയുള്ള പറക്കലായി നൽകുന്നു.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: ആകാശവിതാനം
  rationale: വിരിച്ച പരപ്പിന്റെ ആശയം നിലനിർത്തുകയും ‘ഉറച്ച ആകാശക്കുട’ പോലുള്ള കൂടുതൽ സിദ്ധാന്തഭാരമുള്ള വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിൽ נֶפֶשׁ חַיָּה എന്ന പ്രയോഗം
  choice: ജീവനുള്ള ജീവികൾ
  alternative: ജീവനുള്ള ആത്മാക്കൾ / ജീവജാലങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രയോഗം ജന്തുക്കളായ സജീവ ജീവികളെ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്ന പദം പിന്നീടുള്ള മനുഷ്യശാസ്ത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ സാങ്കേതിക അർത്ഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാം.
- issue: רְקִיעַ എന്ന സൃഷ്ടിജഗത്-പദത്തിന്റെ വിവർത്തനം
  choice: ആകാശവിതാനം
  alternative: ആകാശപ്പരപ്പ് / ഉറച്ച ആകാശക്കുട
  rationale: മൂലപദത്തിന്റെ വിരിച്ച പരപ്പ് എന്ന ദൃശ്യത്തെ സൂക്ഷിക്കുമ്പോഴും ഒരു നിർദിഷ്ട പുരാതനമോ ആധുനികമോ ആയ പ്രപഞ്ചമാതൃക തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സൃഷ്ടിവിവരണശൈലി. കൃത്രിമമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും എബ്രായത്തിലെ സമൃദ്ധിജീവന്റെ ഊന്നൽ മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
