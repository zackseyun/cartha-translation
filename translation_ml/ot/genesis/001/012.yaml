id: GEN.1.12
reference: Genesis 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: ml
  text: 'ഭൂമി സസ്യജാലം മുളപ്പിച്ചു: അതതു തരമനുസരിച്ച് വിത്തുൽപ്പാദിപ്പിക്കുന്ന ചെടികളും, അതതു തരമനുസരിച്ച് വിത്തുള്ള ഫലം കായ്ക്കുന്ന വൃക്ഷങ്ങളും. അതു നല്ലതെന്നു ദൈവം കണ്ടു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: മുളപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപം ഭൂമി സസ്യങ്ങളെ പുറത്തു വരുത്തിയെന്ന കാരണാർത്ഥം നൽകുന്നു. സസ്യങ്ങളുടെ ഉദ്ഭവസന്ദർഭത്തിൽ ‘മുളപ്പിച്ചു’ സ്വാഭാവികവും സജീവവുമാണ്.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: ഉല്പത്തി 1-ലെ പ്രപഞ്ചസൃഷ്ടിയുടെ പശ്ചാത്തലത്തിൽ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: דֶּשֶׁא
  choice: സസ്യജാലം
  rationale: പുല്ലിൽ മാത്രം ഒതുങ്ങാത്ത, പുതുതായി മുളച്ചുവരുന്ന സസ്യവളർച്ചയെ സൂചിപ്പിക്കുന്ന വിശാലമായ കൂട്ടപ്പദം.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: വിത്തുൽപ്പാദിപ്പിക്കുന്ന ചെടികൾ
  rationale: עֵשֶׂב ഇവിടെ വിത്തുണ്ടാക്കുന്ന ചെറുസസ്യങ്ങളെയോ സസ്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പങ്കാളിത്തരൂപം അവയുടെ തുടർച്ചയായ പ്രജനനശേഷി വ്യക്തമാക്കുന്നു.
- source_word: לְמִינֵהוּ
  choice: അതതു തരമനുസരിച്ച്
  rationale: מין എന്നത് ആധുനിക ജീവശാസ്ത്രത്തിലെ സാങ്കേതിക ‘സ്പീഷീസ്’ എന്ന ആശയമല്ല, സൃഷ്ടിയിലെ തരം അഥവാ വിഭാഗമാണ്. ആവർത്തനമുള്ള എബ്രായ ഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וְעֵץ עֹשֶׂה פְּרִי אֲשֶׁר זַרְעוֹ בוֹ
  choice: വിത്തുള്ള ഫലം കായ്ക്കുന്ന വൃക്ഷങ്ങൾ
  rationale: ഏകവചനരൂപത്തിലുള്ള עֵץ ഇവിടെ കൂട്ടാർത്ഥത്തിലാണ്. זַרְעוֹ בוֹ എന്ന ബന്ധവാക്യം വിത്ത് ഫലത്തിനകത്തുണ്ടെന്ന അർത്ഥത്തിൽ സ്വാഭാവികമായ മലയാളമായി ചുരുക്കുന്നു.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: അതു നല്ലതെന്നു ദൈവം കണ്ടു
  rationale: സൃഷ്ടിവിവരണത്തിലെ ആവർത്തിക്കുന്ന ദൈവിക വിലയിരുത്തൽ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിഭാഗങ്ങളെ ആധുനിക ജീവശാസ്ത്ര വർഗീകരണമായി വായിക്കാതിരിക്കുക
  choice: അതതു തരമനുസരിച്ച്
  alternative: അതതു സ്പീഷീസനുസരിച്ച്
  rationale: מין പുരാതന പാഠത്തിലെ തരം/വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്പീഷീസ്’ എന്ന ആധുനിക സാങ്കേതികപദം പാഠത്തിലേക്ക് പിന്നീട് രൂപപ്പെട്ട ശാസ്ത്രീയ വർഗീകരണം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. എബ്രായത്തിലെ രണ്ടു לְמִינֵהוּ ഘടകങ്ങളുടെയും ആവർത്തനം നിലനിർത്തി. വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം വ്യക്തമാക്കാൻ ആദ്യ വിശാലവിഭാഗത്തിനു ശേഷം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
