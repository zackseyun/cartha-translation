  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: ml
  text: ദൈവം ഉണങ്ങിയ നിലത്തിന് “ഭൂമി”[a] എന്നും വെള്ളത്തിന്റെ സമാഹാരത്തിന് “സമുദ്രങ്ങൾ” എന്നും പേരിട്ടു. അതു നല്ലതെന്നു ദൈവം കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിലം”; എബ്രായപദമായ אֶרֶץ ഇവിടെ ഉണങ്ങിയ നിലത്തിനു നൽകിയ പേരായോ “നിലം/ഭൂമി” എന്ന പൊതുനാമമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: പേരിട്ടു
  rationale: ഇവിടെ ക്രിയ നാമകരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ നാമകരണഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ “പേരിട്ടു” യോജിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഉല്പത്തി 1-ൽ ബഹുവചനരൂപമുള്ള ഈ നാമത്തോടൊപ്പം ഏകവചനക്രിയയാണ് വരുന്നത്; ഇവിടെ അത് ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לַיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തിന്
  rationale: കൂടിച്ചേർന്ന വെള്ളത്തിൽനിന്നു വേർതിരിക്കപ്പെട്ട വരണ്ട കരയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. “ഉണങ്ങിയ നിലം” സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶרֶץ
  choice: ഭൂമി
  rationale: നാമകരണസന്ദർഭത്തിൽ ഉണങ്ങിയ നിലത്തിനു നൽകുന്ന പേരാണിത്. മലയാളലിപിയിൽ വലിയക്ഷരവ്യത്യാസമില്ലാത്തതിനാൽ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ പേരെന്ന ധർമം വ്യക്തമാക്കുന്നു; പദത്തിന് “നിലം/കര” എന്ന പൊതുനാമാർഥവും സാധ്യമാണ്.
- source_word: מִקְוֵה הַמַּיִם
  choice: വെള്ളം കൂടിച്ചേർന്നതിനെ
  rationale: מִקְוֵה എന്നത് ശേഖരണം അഥവാ ഒന്നിച്ചുകൂടിയ സമാഹാരം എന്നാണ്. പദാനുപദമായ ഭാരമുള്ള പ്രയോഗത്തേക്കാൾ ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി അതേ ആശയം നൽകുന്നു.
- source_word: יַמִּים
  choice: സമുദ്രങ്ങൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുകയും നാമകരണസമാന്തര്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ഉല്പത്തി 1-ൽ ആവർത്തിക്കുന്ന ദൈവിക വിലയിരുത്തൽസൂത്രത്തിലെ ലളിതമായ ദർശനക്രിയയെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כִּי טוֹב
  choice: അതു നല്ലതെന്ന്
  rationale: טוֹב എന്ന പദത്തിന്റെ സൗന്ദര്യം, യോജ്യത, ഗുണം തുടങ്ങിയ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ ആവർത്തിത വിലയിരുത്തൽസൂത്രം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: אֶרֶץ എന്നത് പൊതുനാമമായോ നാമകരണത്തിൽ നൽകിയ പേരായോ അവതരിപ്പിക്കൽ
  choice: “ഭൂമി” എന്നു ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകി പേരെന്ന ധർമം സൂചിപ്പിക്കുക
  alternative: “നിലം” അല്ലെങ്കിൽ ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ “ഭൂമി” എന്നു നൽകുക
  rationale: വാക്യം വ്യക്തമായ നാമകരണസൂത്രമാണ്. മലയാളത്തിൽ capitalization ഇല്ലാത്തതിനാൽ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ആ സാഹിത്യധർമം പ്രകടമാക്കുന്നു; എന്നാൽ എബ്രായപദത്തിന്റെ പൊതുനാമാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ രണ്ടു നാമകരണവാക്യങ്ങളുടെ സമാന്തര്യം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ അനാവശ്യ ക്രിയാവർത്തനം ഒഴിവാക്കി. പേരുകളെ ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകി നാമകരണസന്ദർഭം വ്യക്തമാക്കി.
