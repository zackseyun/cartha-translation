  to: അങ്ങനെ ദൈവം വലിയ സമുദ്രജീവികളെയും[a], വെള്ളം കൂട്ടമായി നിറഞ്ഞിരുന്ന സകല സഞ്ചരിക്കുന്ന ജീവജാലങ്ങളെയും അവയുടെ ഇനമനുസരിച്ചും, ചിറകുള്ള സകല പക്ഷികളെയും ഓരോന്നിന്റെയും ഇനമനുസരിച്ചും സൃഷ്ടിച്ചു. ദൈവം അത് നല്ലതാണെന്ന് കണ്ടു.
