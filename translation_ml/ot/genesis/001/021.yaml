  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: ml
  text: അങ്ങനെ ദൈവം വലിയ സമുദ്രജീവികളെയും[a], വെള്ളം കൂട്ടമായി നിറഞ്ഞിരുന്ന സകല സഞ്ചരിക്കുന്ന ജീവജാലങ്ങളെയും അവയുടെ ഇനമനുസരിച്ചും, ചിറകുള്ള സകല പക്ഷികളെയും ഓരോന്നിന്റെയും ഇനമനുസരിച്ചും സൃഷ്ടിച്ചു. ദൈവം അത് നല്ലതാണെന്ന് കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലിയ സമുദ്രഭീകരജീവികൾ” അല്ലെങ്കിൽ “വലിയ വ്യാളികൾ.” എബ്രായത്തിലെ തന്നീനീം എന്ന പദം വലിയ സർപ്പസദൃശമോ ഭീകരമോ ആയ ജീവികളെ സൂചിപ്പിക്കാം; ഇവിടെ ജലസംബന്ധമായ സന്ദർഭം “സമുദ്രജീവികൾ” എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: സൃഷ്ടിച്ചു
  rationale: ഉല്പത്തി 1-ൽ ദൈവത്തിന്റെ സൃഷ്ടിപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പ്രധാന ക്രിയയുടെ വ്യതിരിക്തതയും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമാണെങ്കിലും ഇവിടെ ഏകവചനക്രിയയോടുകൂടെ ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: വലിയ സമുദ്രജീവികൾ
  rationale: തന്നീനിം വലിയ സർപ്പസദൃശമോ ഭീകരമോ ആയ ജീവികളെ സൂചിപ്പിക്കാം; ജലസംബന്ധമായ ഈ സന്ദർഭത്തിൽ പുരാണാത്മക ധ്വനി അനാവശ്യമായി ശക്തമാക്കാതെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: സകല ജീവജാലങ്ങളും
  rationale: നെഫെഷ് ഹയ്യാ ഇവിടെ ദൈവശാസ്ത്രപരമായ ‘ആത്മാവ്’ എന്ന അർഥമല്ല, ജീവനുള്ള ജന്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הָרֹמֶשֶׂת
  choice: ചലിക്കുന്ന
  rationale: രാമസ് എന്ന മൂലം ഇഴയുന്നതിൽ മാത്രം ഒതുങ്ങാതെ വിശാലമായി സഞ്ചരിക്കുന്നതോ ചലിക്കുന്നതോ ആയ ജീവികളെ സൂചിപ്പിക്കാം.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: വെള്ളത്തിൽ കൂട്ടമായി നിറഞ്ഞ
  rationale: ശാരത്സിന്റെ പെരുകി നിറയുക, കൂട്ടംകൂടുക എന്ന സമൃദ്ധിയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: לְמִינֵהֶם
  choice: അവയുടെ ഇനം അനുസരിച്ച്
  rationale: സൃഷ്ടിയിലെ വിഭാഗീകരണം സൂചിപ്പിക്കുകയും ബഹുവചന സൂചകത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל עוֹף כָּנָף
  choice: ചിറകുള്ള സകല പക്ഷികളും
  rationale: പറക്കുന്ന ജീവികളുടെ വിഭാഗവും ചിറകുള്ളതെന്ന പ്രത്യേകതയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְמִינֵהוּ
  choice: അതതിന്റെ ഇനം അനുസരിച്ച്
  rationale: കൂട്ടവാചകമായ ‘സകല പക്ഷികളും’ എന്നതിലെ ഓരോ വിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: അതു നല്ലതെന്നു ദൈവം കണ്ടു
  rationale: ഉല്പത്തി 1-ൽ ആവർത്തിക്കുന്ന ദൈവിക വിലയിരുത്തൽ സൂത്രവാക്യം സംക്ഷിപ്തവും സ്ഥിരതയുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിവരണത്തിൽ תַּנִּינִם എന്ന പദത്തിനുള്ള സാധ്യതയുള്ള പുരാണാത്മക ധ്വനി
  choice: വലിയ സമുദ്രജീവികൾ
  alternative: വലിയ സമുദ്രഭീകരജീവികൾ; വലിയ വ്യാളികൾ
  rationale: വാക്യം ജലജീവികളെ ദൈവം സൃഷ്ടിച്ചതായി വിവരിക്കുന്നു. സമീപസന്ദർഭം ആവശ്യപ്പെടാത്ത പുരാണാത്മക അർഥം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ, എബ്രായപദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള വിവരണശൈലി. എബ്രായ വാക്യത്തിന്റെ വിഭാഗീകരണവും സമൃദ്ധിയുടെ സൂചനയും ആവർത്തിക്കുന്ന സൃഷ്ടിവിലയിരുത്തൽ സൂത്രവും നിലനിർത്തിയിട്ടുണ്ട്.
