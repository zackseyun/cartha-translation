source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: ml
  text: ദൈവം ഭൂമിയിലെ വന്യമൃഗങ്ങളെ[a] അതതിന്റെ ഇനമനുസരിച്ചും, കന്നുകാലികളെ അതതിന്റെ ഇനമനുസരിച്ചും, നിലത്ത് ഇഴയുന്ന സകല ജീവികളെയും[c] അതതിന്റെ ഇനമനുസരിച്ചും[b] ഉണ്ടാക്കി. അതു നല്ലതെന്നു ദൈവം കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭൂമിയിലെ മൃഗങ്ങൾ.’ എബ്രായ പ്രയോഗം ഇവിടെ കന്നുകാലികളിൽനിന്ന് വേർതിരിച്ച വന്യമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അതതിന്റെ ഇനമനുസരിച്ച്’ എന്നാണ്. ഇവിടെ ‘ഇനം’ സൃഷ്ടികളുടെ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; അതിനെ ആധുനിക ശാസ്ത്രീയ വർഗീകരണത്തിലെ ‘സ്പീഷീസ്’ എന്ന അർഥത്തിൽ നിർബന്ധമായി എടുക്കേണ്ടതില്ല.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘നിലത്തിലെ സകല ഇഴജന്തുക്കളെയും.’ വാക്യത്തിന്റെ ആദ്യഭാഗത്ത് ‘ഭൂമി’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിൽനിന്ന് വ്യത്യസ്തമായ ഒരു എബ്രായപദമാണ് ഇവിടെ ‘നിലം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ നേരിട്ട് നൽകുന്നു. ഇവിടെ ‘സൃഷ്ടിച്ചു’ എന്നു കൊടുത്താൽ ברא എന്ന വേറൊരു എബ്രായ ക്രിയയുമായുള്ള സൂക്ഷ്മ വ്യത്യാസം മങ്ങാൻ ഇടയുണ്ട്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഇവിടെ ഏകവചനക്രിയയോടുകൂടി ഏക സ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികവും പ്രമാണികവുമായ രൂപം ‘ദൈവം’ ആണ്.
- source_word: חַיַּת הָאָרֶץ
  choice: ഭൂമിയിലെ വന്യമൃഗങ്ങൾ
  rationale: בהמה എന്ന കന്നുകാലിവർഗത്തിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്ന കരയിലെ വന്യജീവികളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വന്യമൃഗങ്ങൾ’ ഈ വിഭാഗവ്യത്യാസം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: അതതിന്റെ ഇനമനുസരിച്ച്
  rationale: מין സൃഷ്ടികളുടെ വിഭാഗത്തെയോ തരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഇനം’ സ്വാഭാവികമായ മലയാളമാണ്; ‘അതതിന്റെ’ എന്നത് ഓരോ കൂട്ടത്തിന്റെയും വിതരണം സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചനരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: വന്യമൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ചിരിക്കുന്ന, പ്രത്യേകിച്ച് മനുഷ്യർ വളർത്തുന്ന വലിയ കരമൃഗങ്ങളുടെ വിഭാഗം. ‘കന്നുകാലികൾ’ എന്നത് ‘പശുക്കൾ’ എന്നതിനെക്കാൾ വിശാലവും മലയാളത്തിൽ പരിചിതവുമാണ്.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: നിലത്ത് ഇഴയുന്ന സകല ജീവികളും
  rationale: רמש നിലത്തിനടുത്തുകൂടി ചലിക്കുന്ന ചെറുജീവികളെ സൂചിപ്പിക്കുന്നു. הָאֲדָמָהയെ ‘നിലം’ എന്നു നൽകുന്നത് വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ הָאָרֶץ (‘ഭൂമി’) എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: അതു നല്ലതെന്നു ദൈവം കണ്ടു
  rationale: ഉല്പത്തി 1-ലെ ആവർത്തിതമായ വിലയിരുത്തൽവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘അതു’ സൃഷ്ടിക്കപ്പെട്ടതിനെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിവിഭാഗങ്ങളെ ആധുനിക ശാസ്ത്രീയ വർഗീകരണമായി വ്യാഖ്യാനിക്കാതിരിക്കുക
  choice: ഇനം
  alternative: സ്പീഷീസ് / ജീവശാസ്ത്രജാതി
  rationale: എബ്രായ മין ഒരു തരത്തെയോ വിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു; അതിനെ ആധുനിക ജീവശാസ്ത്രത്തിലെ ‘species’ എന്ന സാങ്കേതിക വിഭാഗത്തോട് തുല്യമാക്കാൻ പാഠം നിർബന്ധിക്കുന്നില്ല.
- issue: הָאָרֶץ, הָאֲדָמָה എന്നീ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: ഭൂമി … നിലം
  alternative: ഭൂമി … ഭൂമി
  rationale: ഒരേ വാക്യത്തിലുള്ള ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ട് എബ്രായ പദങ്ങളെ ഒരൊറ്റ മലയാളപദത്തിലാക്കി സമതലപ്പെടുത്താതെ അവയുടെ പദവ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉണ്ടാക്കി’ എന്നത് മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘വന്യമൃഗങ്ങൾ, കന്നുകാലികൾ, നിലത്ത് ഇഴയുന്ന ജീവികൾ’ എന്ന ക്രമം എബ്രായത്തിലെ മൂന്ന് സൃഷ്ടിവിഭാഗങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
