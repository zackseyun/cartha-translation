source:
  edition: WLC
  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: ml
  text: സന്ധ്യയായി[a], പ്രഭാതമായി—അഞ്ചാം ദിവസം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സന്ധ്യ ഉണ്ടായി, പ്രഭാതം ഉണ്ടായി—അഞ്ചാം ദിവസം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയി
  rationale: ഇവിടെ היה എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം സൃഷ്ടിവിവരണത്തിലെ ആവർത്തിത ആഖ്യാനസൂത്രത്തിന്റെ ഭാഗമാണ്. മലയാളത്തിൽ ‘സന്ധ്യയായി, പ്രഭാതമായി’ എന്ന പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവും മൂലത്തിലെ താളം നിലനിർത്തുന്നതുമാണ്.
- source_word: עֶרֶב
  choice: സന്ധ്യ
  rationale: ഈ നാമം സന്ധ്യയെ സൂചിപ്പിക്കുന്നു. ആവർത്തിതമായ സൃഷ്ടിദിനസൂത്രത്തിന് യോജിച്ച നേരിട്ടുള്ള മലയാളപദമാണ് ‘സന്ധ്യ’.
- source_word: בֹּקֶר
  choice: പ്രഭാതം
  rationale: ഈ നാമം പ്രഭാതത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്ധ്യ’യോടുള്ള സമാന്തരത നിലനിർത്തുന്ന വ്യക്തവും മാന്യവുമായ പദമാണ് ‘പ്രഭാതം’.
- source_word: יוֹם
  choice: ദിവസം
  rationale: ഇവിടെ יוֹם ക്രമസംഖ്യയോടുകൂടി സൃഷ്ടിദിനത്തെ അടയാളപ്പെടുത്തുന്നു. അതിന്റെ ദൈർഘ്യത്തെ വ്യാഖ്യാനിക്കാതെ നേരിട്ടുള്ള തുല്യപദമായ ‘ദിവസം’ നിലനിർത്തുന്നു.
- source_word: חֲמִישִׁי
  choice: അഞ്ചാം
  rationale: ‘ദിവസം’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന കൃത്യമായ ക്രമസംഖ്യയാണ് ‘അഞ്ചാം’.
theological_decisions:
- issue: സൃഷ്ടിദിനസൂത്രത്തിന്റെ സ്വഭാവം
  choice: ‘സന്ധ്യയായി, പ്രഭാതമായി—അഞ്ചാം ദിവസം’ എന്ന കാലസൂചനയുള്ള ആവർത്തിതസൂത്രം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ഇത് നിർബന്ധമായും 24 മണിക്കൂർ ദിവസമെന്നോ ഒരു യുഗമെന്നോ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം സന്ധ്യ–പ്രഭാത സൂത്രവും ക്രമസംഖ്യയോടുകൂടിയ ദിവസവും നൽകുന്നു; എന്നാൽ സൃഷ്ടിദിനത്തിന്റെ ദൈർഘ്യത്തെയോ സാഹിത്യസ്വഭാവത്തെയോ കുറിച്ചുള്ള പിന്നീടുള്ള തർക്കങ്ങൾ ഈ വാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തിത താളം നിലനിർത്താൻ ചെറുവാക്യഘടനയും ദീർഘവിരാമചിഹ്നവും ഉപയോഗിച്ചു; അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
