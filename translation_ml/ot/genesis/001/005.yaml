  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: ml
  text: ദൈവം വെളിച്ചത്തിന് പകൽ എന്നും ഇരുട്ടിന് രാത്രി എന്നും പേരിട്ടു. സന്ധ്യയായി, പ്രഭാതമായി—ഒന്നാം ദിവസം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: “ഒരു ദിവസം” അഥവാ “ദിവസം ഒന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... קָרָא
  choice: പേരിട്ടു
  rationale: קרא എന്ന ക്രിയയ്ക്ക് ഈ നാമകരണഘടനയിൽ ‘വിളിച്ചു’ എന്നും ‘പേരിട്ടു’ എന്നും അർഥമാകാം; സാധാരണ മലയാളത്തിൽ നാമകരണപ്രവൃത്തി വ്യക്തമായി അറിയിക്കാൻ ‘പേരിട്ടു’ സ്വാഭാവികമാണ്.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമുള്ള ഈ നാമം ഇവിടെ ഏകവചനക്രിയയോടുകൂടെ സ്രഷ്ടാവായ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു; ‘ദൈവം’ മലയാളത്തിലെ പ്രമാണിക രൂപമാണ്.
- source_word: לָאוֹר ... יוֹם
  choice: വെളിച്ചത്തിന് പകൽ
  rationale: ഹീബ്രു നാമകരണഘടനയിലെ לְ മലയാളത്തിൽ ‘-ത്തിന് ... എന്ന്’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; יוֹם ഇവിടെ വെളിച്ചത്തിന് നൽകിയ ‘പകൽ’ എന്ന പേരാണ്.
- source_word: וְלַחֹשֶׁךְ ... לָיְלָה
  choice: ഇരുട്ടിന് രാത്രി
  rationale: വെളിച്ചം–ഇരുട്ട്, പകൽ–രാത്രി എന്നീ സമാന്തര ജോടികൾ ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: സന്ധ്യയായി, പ്രഭാതമായി
  rationale: ആവർത്തിതമായ ഹീബ്രു ഘടനയുടെ താളം സംക്ഷിപ്തമായി നിലനിർത്തുകയും עֶרֶב, בֹקֶר എന്നിവയുടെ സാധാരണ അർഥങ്ങൾ നൽകുകയും ചെയ്യുന്നു.
- source_word: יוֹם אֶחָד
  choice: ഒന്നാം ദിവസം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു ദിവസം/ദിവസം ഒന്ന്’ എന്നാണെങ്കിലും സൃഷ്ടിദിനങ്ങളുടെ ക്രമത്തിൽ മലയാളത്തിൽ ‘ഒന്നാം ദിവസം’ സ്വാഭാവികവും വ്യക്തവുമാണ്; മൂലത്തിലെ cardinal രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יוֹם אֶחָד എന്ന സമാപനപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഒന്നാം ദിവസം
  alternative: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു ദിവസം’ അഥവാ ‘ദിവസം ഒന്ന്’'
  rationale: ഹീബ്രുവിൽ ordinal ആയ ‘ആദ്യത്തെ’ എന്നതിനു പകരം cardinal אֶחָד (‘ഒന്ന്’) ആണ്. എന്നാൽ തുടർന്നുവരുന്ന എണ്ണപ്പെട്ട ദിനക്രമത്തിൽ ‘ഒന്നാം ദിവസം’ സ്വാഭാവികമാണ്. മൂലരൂപത്തിന്റെ വ്യാഖ്യാനസാധ്യത മറച്ചുവയ്ക്കാതിരിക്കാൻ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. നാമകരണത്തിന് ‘പേരിട്ടു’ ഉപയോഗിച്ച് അനാവശ്യമായ പദാനുപദകഠിനത ഒഴിവാക്കി; ഹീബ്രു വാക്യത്തിന്റെ സമാന്തരതയും സന്ധ്യ–പ്രഭാത താളവും നിലനിർത്തി.
