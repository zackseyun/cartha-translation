source:
  edition: WLC
  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: ml
  text: സന്ധ്യ ഉണ്ടായി, പ്രഭാതം ഉണ്ടായി—മൂന്നാം ദിവസം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ പദക്രമത്തിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സന്ധ്യ ഉണ്ടായി, പ്രഭാതം ഉണ്ടായി, ദിവസം മൂന്നാമത്തേത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയി
  rationale: היה എന്ന ക്രിയയുടെ തുടർച്ചാവൃത്താന്തരൂപം ഇവിടെ സമയഘട്ടം നിലവിൽ വന്നതിനെ സൂചിപ്പിക്കുന്ന ആവർത്തനസൂത്രത്തിന്റെ ഭാഗമാണ്. മലയാളത്തിൽ ‘സന്ധ്യയായി; പ്രഭാതമായി’ എന്നത് സ്വാഭാവികവും എബ്രായ പദക്രമത്തിന്റെ താളം നിലനിർത്തുന്നതുമാണ്.
- source_word: עֶרֶב
  choice: സന്ധ്യ
  rationale: ഈ നാമം സന്ധ്യയെയോ സന്ധ്യാസമയത്തെയോ സൂചിപ്പിക്കുന്നു; സൃഷ്ടിവിവരണത്തിലെ ആവർത്തനവാക്യത്തിന് ‘സന്ധ്യ’ നേരിട്ടും സുതാര്യവുമായ പരിഭാഷയാണ്.
- source_word: בֹּקֶר
  choice: പ്രഭാതം
  rationale: ഈ നാമം പ്രഭാതത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്ധ്യ’യോടുള്ള സൂത്രപരമായ സമാന്തരത ‘പ്രഭാതം’ നിലനിർത്തുന്നു.
- source_word: יוֹם
  choice: ദിവസം
  rationale: സൃഷ്ടിക്രമത്തിലെ എണ്ണപ്പെട്ട ദിവസത്തെയാണ് ഇവിടെ יוֹם സൂചിപ്പിക്കുന്നത്; ‘ദിവസം’ അതിന്റെ നേരിട്ടുള്ള സന്ദർഭോചിതമായ പരിഭാഷയാണ്.
- source_word: שְׁלִישִׁי
  choice: മൂന്നാം
  rationale: ക്രമസംഖ്യയായ ഈ പദം ‘മൂന്നാം’ എന്നാണ് അർഥം; അത് ‘ദിവസം’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്നു.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: സന്ധ്യയായി; പ്രഭാതമായി
  rationale: ഉല്പത്തി 1-ലെ സ്ഥിരമായ സാഹിത്യാവർത്തനത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്. രണ്ടു ഘടകങ്ങളുടെയും സമാന്തരഘടനയും താളവും അർദ്ധവിരാമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിദിവസത്തിന്റെ ആവർത്തനവാക്യം ഒരു പ്രത്യേക കാലക്രമവ്യാഖ്യാനം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: സന്ധ്യയായി; പ്രഭാതമായി—മൂന്നാം ദിവസം.
  alternative: സന്ധ്യയായി, പ്രഭാതമായി; ദിവസം മൂന്നാമത്തേത്.
  rationale: എബ്രായ വാചകം സൃഷ്ടിവിവരണത്തിലെ ക്രമത്തെ അടയാളപ്പെടുത്തുന്നു. ‘മൂന്നാം ദിവസം’ സ്വാഭാവികമായ മലയാളമാണ്; ദിവസങ്ങളുടെ ദൈർഘ്യമോ സാഹിത്യപരമായ പ്രവർത്തനമോ സംബന്ധിച്ച പിൽക്കാല വ്യാഖ്യാനവിവാദങ്ങളിൽ ഇത് വിധി പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ഭാഷ. ആവർത്തനസൂത്രത്തിന്റെ ലാളിത്യവും താളവും കാത്തുസൂക്ഷിച്ചു; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
