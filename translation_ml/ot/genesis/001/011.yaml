id: GEN.1.11
reference: Genesis 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “ഭൂമി സസ്യജാലം മുളപ്പിക്കട്ടെ[a]: വിത്ത് ഉത്പാദിപ്പിക്കുന്ന ചെടികളും, അതതിന്റെ ഇനമനുസരിച്ച്[b] ഫലം കായ്ക്കുന്നതും വിത്ത് അവയിൽ ഉള്ളതുമായ[c] ഫലവൃക്ഷങ്ങളും ഭൂമിയിൽ ഉണ്ടാകട്ടെ.” അങ്ങനെതന്നെ സംഭവിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂമി സസ്യജാലം പുറപ്പെടുവിക്കട്ടെ.”
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “അതിന്റെ ഇനമനുസരിച്ച്”; വിവിധ വർഗങ്ങളിലെ ഓരോന്നിനെയും സൂചിപ്പിക്കാൻ ഏകവചനം വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അതിന്റെ വിത്ത് അതിൽ ഉള്ളത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: ഭൂമി സസ്യങ്ങൾ മുളപ്പിക്കട്ടെ
  rationale: ഹിഫീൽ ആജ്ഞാർഥത്തിന്റെ കാരണാത്മക ഭാവവും ഭൂമിയോടുള്ള നിർദേശവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മണ്ണിൽനിന്ന് സസ്യങ്ങൾ പൊട്ടിമുളയ്ക്കുന്ന ദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: דֶּשֶׁא
  choice: സസ്യങ്ങൾ
  rationale: പച്ചയായി വളരുന്ന സസ്യജാലത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന സമാഹാരപദം; ‘പുല്ല്’ എന്നു ചുരുക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: עֵשֶׂב
  choice: ചെടികൾ
  rationale: വിത്ത് ഉത്പാദിപ്പിക്കുന്ന ശാകസസ്യങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: מַזְרִיעַ זֶרַע
  choice: വിത്ത് ഉത്പാദിപ്പിക്കുന്ന
  rationale: വിത്ത് പുറപ്പെടുവിക്കുന്ന സ്ഥിരസ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עֵץ פְּרִי
  choice: ഫലവൃക്ഷങ്ങൾ
  rationale: ഫലം കായ്ക്കുന്ന വൃക്ഷവർഗത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: עֹשֶׂה פְּרִי
  choice: ഫലം കായ്ക്കുന്ന
  rationale: കൃഷിസംബന്ധമായ സ്വാഭാവിക മലയാളപ്രയോഗം; വൃക്ഷത്തിന്റെ സവിശേഷ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: לְמִינוֹ
  choice: അതതിന്റെ ഇനമനുസരിച്ച്
  rationale: ഹീബ്രുവിലെ ഏകവചനത്തെ വിതരണാർഥത്തിൽ നിലനിർത്തുകയും ഓരോ വർഗവും സ്വന്തം ഇനമനുസരിച്ചാണെന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: അവയുടെ വിത്ത് അവയിൽത്തന്നെ ഉണ്ടായിരിക്കട്ടെ
  rationale: സർവനാമങ്ങളുടെ ഏകവചനഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമാഹാരബഹുവചനമായി നൽകുന്നു; വിത്ത് ഫലത്തിനകത്താണോ വൃക്ഷത്തിനകത്താണോ എന്ന ബന്ധത്തിലെ സാധ്യത പൂർണമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: സൃഷ്ടിവിവരണത്തിലെ സ്ഥലസൂചന ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ദൈവിക കല്പനയുടെ സാക്ഷാത്കാരത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തനസൂത്രം ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിക്കപ്പെട്ട സസ്യവിഭാഗങ്ങളുടെ വ്യാപ്തിയും സ്വഭാവവും
  choice: സസ്യങ്ങൾ, വിത്ത് ഉത്പാദിപ്പിക്കുന്ന ചെടികൾ, ഫലം കായ്ക്കുന്ന ഫലവൃക്ഷങ്ങൾ എന്നിങ്ങനെ വാചകത്തിലെ വിശാല വിഭാഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘പുല്ല്, വിത്തുള്ള ഔഷധി, ഫലവൃക്ഷം’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപമോ ‘എല്ലാത്തരം സസ്യങ്ങളും വൃക്ഷങ്ങളും’ എന്ന പൊതുവായ പരാവർത്തനമോ.
  rationale: പുരാതന വാചകത്തിലെ ദൃശ്യാനുഭവാധിഷ്ഠിത വിഭാഗങ്ങളെ ആധുനിക ശാസ്ത്രീയ വർഗീകരണമായി മാറ്റാതെയും അവ തമ്മിലുള്ള വ്യത്യാസങ്ങൾ ഇല്ലാതാക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: אֲשֶׁר זַרְעוֹ בוֹ എന്ന ബന്ധവാക്യത്തിന്റെ സൂചന
  choice: ‘അവയുടെ വിത്ത് അവയിൽത്തന്നെ ഉണ്ടായിരിക്കട്ടെ’ എന്ന രൂപത്തിൽ സർവനാമബന്ധത്തിന്റെ വിശാലത നിലനിർത്തി.
  alternative: ‘ഫലത്തിനകത്ത് വിത്തുള്ള’ എന്നു ബന്ധം വ്യക്തമായി ഫലത്തോടു മാത്രം ചേർക്കുക.
  rationale: ഹീബ്രു വ്യാകരണം ഫലത്തെയോ ഫലവൃക്ഷത്തെയോ സൂചിപ്പിക്കാവുന്ന രീതിയിലുള്ളതിനാൽ വിവർത്തനം അനാവശ്യമായി ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. സാങ്കേതിക സസ്യശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
