id: GEN.1.24
reference: Genesis 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “ഭൂമി അതതു ഇനമനുസരിച്ച് ജീവജന്തുക്കളെ[a] പുറപ്പെടുവിക്കട്ടെ—വളർത്തുമൃഗങ്ങളെയും നിലത്തു ഇഴയുന്ന ജീവികളെയും അതതു ഇനമനുസരിച്ചുള്ള ഭൂമിയിലെ കാട്ടുമൃഗങ്ങളെയും.” അങ്ങനെ സംഭവിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവനുള്ള സത്തകൾ”; അക്ഷരാർഥത്തിൽ, “ജീവനുള്ള നെഫെശ്/പ്രാണൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: പുറപ്പെടുവിക്കട്ടെ
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ ആജ്ഞാർഥരൂപം ഭൂമിയെ കർത്താവാക്കി ജീവികൾ പുറത്തുവരാൻ ഇടയാക്കുക എന്ന കാരണാർത്ഥം നൽകുന്നു; ‘പുറപ്പെടുവിക്കട്ടെ’ അത് ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ഭൂമി
  rationale: സൃഷ്ടിവിവരണത്തിൽ ഇത് വിശാലമായ ഭൗമമണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: נֶפֶשׁ חַיָּה
  choice: ജീവജന്തുക്കൾ
  rationale: ഈ പ്രയോഗം സചേതനമായ ജീവികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ജീവജന്തുക്കൾ’ സ്വാഭാവികമാണ്; ‘ജീവാത്മാക്കൾ’ എന്നത് സന്ദർഭം ആവശ്യപ്പെടാത്ത തത്ത്വശാസ്ത്രപരമായ അർത്ഥം കൊണ്ടുവരാം.
- source_word: לְמִינָהּ
  choice: അതതു ഇനമനുസരിച്ച്
  rationale: എബ്രായരൂപം ഏകവചന കൂട്ടനാമത്തോട് പൊരുത്തപ്പെടുന്നുവെങ്കിലും ആശയം വിഭാഗംതോറുമുള്ള വിതരണമാണ്; ‘അതതു ഇനമനുസരിച്ച്’ ഈ അർത്ഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּהֵמָה
  choice: വളർത്തുമൃഗങ്ങൾ
  rationale: കാട്ടുമൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ചുള്ള, പ്രത്യേകിച്ച് മനുഷ്യരോടൊപ്പം വളർത്തപ്പെടുന്ന വലിയ കരമൃഗങ്ങളുടെ വിഭാഗത്തെ ഇത് സൂചിപ്പിക്കുന്നു.
- source_word: רֶמֶשׂ
  choice: നിലത്തിഴയുന്ന ജീവികൾ
  rationale: നിലത്തുകൂടി ഇഴഞ്ഞോ ചെറുചലനങ്ങളോടെയോ സഞ്ചരിക്കുന്ന ജീവികളുടെ വിശാലവിഭാഗമാണ് ഉദ്ദേശ്യം; ഏതാനും ജീവിവർഗങ്ങളായി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: חַיְתוֹ אֶרֶץ
  choice: കാട്ടുമൃഗങ്ങൾ
  rationale: בְּהֵמָה എന്ന വളർത്തുമൃഗവിഭാഗത്തോട് വ്യത്യാസപ്പെടുത്തി സ്വതന്ത്രമായി ജീവിക്കുന്ന കരമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കാട്ടുമൃഗങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיְהִי כֵן
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ദൈവകല്പനയുടെ നിറവേറ്റലിനെ സൂചിപ്പിക്കുന്ന ഉല്പത്തി 1-ലെ ആവർത്തിത സൂത്രവാക്യം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: נֶפֶשׁ എന്ന പദം ദൈവശാസ്ത്രപരമായി ഭാരമുള്ള ഭാഷയിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: ജീവജന്തുക്കൾ
  alternative: ജീവികളായ ആത്മാക്കൾ / ജീവനുള്ള സത്തകൾ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദസമുച്ചയം പൊതുവായി ജന്തുജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; മൃഗങ്ങളുടെ അഭൗതിക ഘടനയെക്കുറിച്ചുള്ള പിന്നീടുള്ള സിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കാതിരിക്കാൻ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ പദം ഉപയോഗിക്കുകയും അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവഭാഷ. കല്പനയുടെ കാരണാർത്ഥവും ‘അതതു ഇനം’ എന്ന വിതരണാർഥവും സംരക്ഷിച്ചു; അനാവശ്യമായ മതവിഭാഗപരമോ തത്ത്വശാസ്ത്രപരമോ ആയ പദഭാരം ഒഴിവാക്കി.
