lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടു
  rationale: ראה എന്ന ക്രിയയുടെ സ്വാഭാവിക ആഖ്യാനരൂപം ‘കണ്ടു’ എന്നാണ്. സന്ദർഭത്തിൽ വിലയിരുത്തൽ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും അതിനെ അമിതമായി വ്യാഖ്യാനിക്കാതെ ഈ പദം നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ബഹുവചനരൂപമുള്ള ഈ നാമം ഇവിടെ ഏകവചനക്രിയയോടുകൂടെ ഏകസ്രഷ്ടാവിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഏകവചനരൂപം ‘ദൈവം’ ആണ്.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് പ്രത്യക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ കർമവിഭക്തിയായ ‘-ത്തെ’ മുഖേന അതിന്റെ ധർമ്മം പ്രകടമാകുന്നു.
- source_word: הָאוֹר
  choice: വെളിച്ചം / വെളിച്ചത്തെ
  rationale: നിശ്ചയാർഥക ഉപപദം മുമ്പ് സൃഷ്ടിക്കപ്പെട്ട പ്രത്യേക വെളിച്ചത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭവും വിഭക്തിയും ഈ നിശ്ചിതത്വം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഇവിടെ כִּי ദൈവം കണ്ടറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നല്ലതാണെന്ന്’ എന്ന ഘടന അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: טוֹב
  choice: നല്ലത്
  rationale: טוֹב എന്ന പൊതുവായ മൂല്യനിർണയപദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ ‘നല്ലത്’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: וַיַּבְדֵּל
  choice: വേർതിരിച്ചു
  rationale: בדל വേർപെടുത്തുക, വിഭജിക്കുക, വേർതിരിവ് കല്പിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ഇവിടെ ‘വേർതിരിച്ചു’ വ്യക്തവും സ്വാഭാവികവും ആണെങ്കിലും പ്രവർത്തിയുടെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: בֵּין ... וּבֵין
  choice: വെളിച്ചത്തെയും ഇരുട്ടിനെയും
  rationale: അക്ഷരാർഥത്തിൽ ‘വെളിച്ചത്തിനും ഇരുട്ടിനും ഇടയിൽ’ എന്ന ഘടനയാണ്. ‘വേർതിരിച്ചു’ എന്ന ക്രിയയോടൊപ്പം രണ്ടു കർമങ്ങളെയും ‘-ഉം’ ചേർത്ത് പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലാർഥത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: הַחֹשֶׁךְ
  choice: ഇരുട്ട് / ഇരുട്ടിനെ
  rationale: നിശ്ചയാർഥക ഉപപദം ഇതിനകം പരാമർശിച്ച ഇരുട്ടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭവും വിഭക്തിയും ആ നിശ്ചിതത്വം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: രണ്ടു ഉപവാക്യങ്ങളിലും אֱלֹהִים എന്ന കർത്താവിന്റെ ആവർത്തനം
  choice: രണ്ടാമത്തെ ഉപവാക്യത്തിലും ‘ദൈവം’ ആവർത്തിച്ചു.
  alternative: രണ്ടാമത്തെ ഉപവാക്യത്തിൽ ‘അവൻ’ എന്ന സർവനാമം ഉപയോഗിക്കുക.
  rationale: എബ്രായമൂലം ദൈവികകർത്താവിനെ വ്യക്തമായി ആവർത്തിക്കുന്നു. ആ താളവും ഊന്നലും ദൈവശാസ്ത്രപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- issue: വെളിച്ചവും ഇരുട്ടും തമ്മിലുള്ള വേർതിരിവിന്റെ സ്വഭാവം
  choice: സ്ഥലപരമോ കാലപരമോ ആശയപരമോ എന്ന് നിർവചിക്കാതെ ‘വേർതിരിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘വിഭജിച്ചു’ അല്ലെങ്കിൽ ‘വേർതിരിവ് കല്പിച്ചു’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: വേർതിരിവിന്റെ രീതി മൂലപാഠം വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിലെ സൃഷ്ടിശാസ്ത്രപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ‘ദൈവം’ എന്ന ആവർത്തനം നിലനിർത്തി. മലയാളത്തിൽ നിശ്ചയാർഥക ഉപപദമില്ലാത്തതിനാൽ הָאוֹר, הַחֹשֶׁךְ എന്നിവയുടെ നിശ്ചിതത്വം സന്ദർഭവും വിഭക്തിയും മുഖേന പ്രകടമാക്കി. പാദക്കുറിപ്പ് ബന്ധപ്പെട്ട ക്രിയയായ ‘വേർതിരിച്ചു’ എന്നതിനു പിന്നാലെ ചേർത്തു.
