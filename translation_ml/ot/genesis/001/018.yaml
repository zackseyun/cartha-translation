id: GEN.1.18
reference: Genesis 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: ml
  text: പകലിനെയും രാത്രിയെയും ഭരിക്കാനും, വെളിച്ചത്തെ ഇരുട്ടിൽനിന്ന് വേർതിരിക്കാനും[a]. അതു നല്ലതാണെന്ന് ദൈവം കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിച്ചവും ഇരുട്ടും തമ്മിൽ വ്യത്യാസം വരുത്താനും.’
    reason: בדל എന്ന ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ‘വേർതിരിക്കുക’ എന്നും ‘വ്യത്യാസം വരുത്തുക’ എന്നും ഗ്രഹിക്കാവുന്ന അർഥഭേദം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: ഭരിക്കാനും
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ജ്യോതികളുടെ ഉദ്ദേശ്യവും ചുമതലയും സൂചിപ്പിക്കുന്ന ക്രിയാരൂപമാണിത്. ‘ഭരിക്കുക’ എന്നത് משל എന്ന പദത്തിന്റെ ഭരണപരമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; സ്വതന്ത്രമായ ദൈവിക അധികാരം അവയ്ക്കുണ്ടെന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: പകലിനെയും രാത്രിയെയും
  rationale: ‘ഭരിക്കുക’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ കർമവിഭക്തി ഉപയോഗിച്ചു. എബ്രായത്തിലെ നിർദിഷ്ടമായ ജോടിയും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: വേർതിരിക്കാനും
  rationale: בדל ഇവിടെ ദൈവം സൃഷ്ടിയിൽ സ്ഥാപിച്ച വേർതിരിവിനെ സൂചിപ്പിക്കുന്നു. ‘വേർതിരിക്കുക’ ഉല്പത്തി 1-ലെ ആവർത്തിത സൃഷ്ടിഭാഷയും ഈ പദത്തിന്റെ മൂർത്തമായ അർഥവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בֵּין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ
  choice: വെളിച്ചത്തെ ഇരുട്ടിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ‘ഇടയിൽ ... ഇടയിൽ’ എന്ന ഘടനയെ, ‘വേർതിരിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ മലയാളരീതിയിൽ അവതരിപ്പിക്കുന്നു. വെളിച്ചവും ഇരുട്ടും നിർദിഷ്ട ഘടകങ്ങളായി നിലനിൽക്കുന്നു.
- source_word: וַ/יַּ֥רְא אֱלֹהִ֖ים
  choice: ദൈവം കണ്ടു
  rationale: എബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ചയും ഉല്പത്തി 1-ലെ ആവർത്തിത വിലയിരുത്തൽശൈലിയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: כִּי טֽוֹב
  choice: അതു നല്ലതെന്ന്
  rationale: טוב എന്ന പദത്തിലെ നന്മ, യോജ്യത, സൃഷ്ടിക്രമത്തിലെ ശരിയായ സ്ഥാനം എന്നീ അർഥവ്യാപ്തി ചുരുക്കാതെ ‘നല്ലത്’ എന്ന പരിചിതവും ഗൗരവമുള്ളതുമായ പദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിയിലെ ആകാശജ്യോതികളുടെ പ്രവർത്തനം
  choice: ജ്യോതികൾ പകലിനെയും രാത്രിയെയും ഭരിക്കാനും വെളിച്ചവും ഇരുട്ടും വേർതിരിക്കാനും നിയമിക്കപ്പെട്ടവയാണെന്ന പ്രവർത്തനപരമായ വിവരണം നിലനിർത്തുന്നു.
  alternative: ജ്യോതികൾ സ്വതന്ത്ര ദൈവിക സത്തകളെന്നപോലെ ആധിപത്യം പ്രയോഗിക്കുന്നു എന്നു തോന്നിപ്പിക്കുന്ന കൂടുതൽ വ്യക്തിവത്കൃതമായ ഭാഷ.
  rationale: എബ്രായപാഠം ജ്യോതികൾക്ക് സൃഷ്ടിക്രമത്തിനുള്ളിലെ ചുമതലകളാണ് നൽകുന്നത്. ‘ഭരിക്കുക’ മൂലപാഠത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും, ദൈവം അവയെ വിലയിരുത്തുന്ന അന്തിമവാക്യം ദൈവത്തിന്റെ പരമാധികാരം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ സൃഷ്ടിവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മുൻവാക്യത്തോടു ബന്ധമുള്ള ഉദ്ദേശ്യസൂചക ക്രിയാരൂപങ്ങൾ ‘-ക്കാനും’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് പ്രസക്തമായ ‘വേർതിരിക്കാനും’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
