id: GEN.1.29
reference: Genesis 1:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: ml
  text: 'ദൈവം പറഞ്ഞു: “ഇതാ, ഭൂമിയുടെ ഉപരിതലത്തിലെങ്ങുമുള്ള വിത്തുൽപ്പാദിപ്പിക്കുന്ന സകല സസ്യങ്ങളും വിത്തുള്ള ഫലം കായ്ക്കുന്ന സകല വൃക്ഷങ്ങളും ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു. അവ നിങ്ങൾക്ക് ആഹാരമായിരിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന ദാനപ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്കും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും ഇടം നൽകുന്ന എബ്രായ പൂർണ്ണക്രിയയുടെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: വിത്തുൽപ്പാദിപ്പിക്കുന്ന സകല സസ്യങ്ങളും
  rationale: עֵשֶׂב എന്നത് ഭക്ഷ്യസുഗന്ധസസ്യങ്ങൾ മാത്രമല്ല, സസ്യവർഗത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ആവർത്തനമുള്ള എബ്രായ ശൈലി സ്വാഭാവിക മലയാളത്തിൽ അർഥസമ്പൂർണ്ണമായി നൽകുന്നു.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: ഭൂമിയുടെ ഉപരിതലത്തിലെങ്ങുമുള്ള
  rationale: ‘ഭൂമിയുടെ മുഖത്തിന്മേൽ’ എന്ന സ്ഥലസൂചക എബ്രായ ഭാഷാശൈലിയുടെ വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: വിത്തുള്ള ഫലം കായ്ക്കുന്ന
  rationale: വൃക്ഷഫലത്തിനുള്ളിൽ വിത്തുണ്ടെന്ന മൂലപാഠത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു; അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കുന്നു.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: അവ നിങ്ങൾക്ക് ആഹാരമായിരിക്കും
  rationale: കൂട്ടായ വിഷയത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചനക്രിയയുടെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനസർവനാമത്തോടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആഹാരമായി നൽകിയവയുടെ കൂട്ടായ പരാമർശത്തിലെ സംഖ്യ
  choice: അവ നിങ്ങൾക്ക് ആഹാരമായിരിക്കും
  alternative: അത് നിങ്ങൾക്ക് ആഹാരമായിരിക്കും
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനമാണെങ്കിലും മുൻപുള്ള സസ്യങ്ങളെയും വൃക്ഷഫലങ്ങളെയും കൂട്ടായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവ’ എന്നു പറയുന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; വാക്യം അനുവദനീയമായ ആഹാരത്തെക്കുറിച്ചാണ് പറയുന്നത്, അതിനപ്പുറമുള്ള ഒരു മതശാസ്ത്രനിഗമനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും ഒരുമിപ്പിച്ചിരിക്കുന്നു. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകപ്രയോഗം മൂലപാഠത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; പഴക്കം തോന്നിക്കുന്ന പദക്രമവും അനാവശ്യമായ വ്യാഖ്യാനവികാസവും ഒഴിവാക്കി.
