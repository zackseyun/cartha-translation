id: GEN.1.27
reference: Genesis 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: ml
  text: അങ്ങനെ ദൈവം മനുഷ്യനെ തന്റെ സ്വരൂപത്തിൽ[a] സൃഷ്ടിച്ചു; ദൈവത്തിന്റെ സ്വരൂപത്തിൽ അവനെ സൃഷ്ടിച്ചു; ആണും പെണ്ണുമായി അവരെ സൃഷ്ടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘മനുഷ്യവർഗത്തെ’: ഇവിടെ എബ്രായത്തിലെ ആദാം എന്ന പദം ഏകവചനത്തിലാണെങ്കിലും മനുഷ്യരാശിയെ മുഴുവനായി പ്രതിനിധീകരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: സൃഷ്ടിച്ചു
  rationale: ദൈവിക സൃഷ്ടിയെ സൂചിപ്പിക്കുന്ന ക്രിയയായി ‘സൃഷ്ടിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; മൂന്നു പ്രാവശ്യത്തെ ആവർത്തനവും അതേപടി നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഇവിടെ ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הָאָדָם
  choice: മനുഷ്യനെ
  rationale: ഏകവചനത്തിലുള്ള പദം ഇവിടെ മുഴുവൻ മനുഷ്യവർഗത്തെയും പ്രതിനിധീകരിക്കുന്നു; തുടർന്ന് ‘ആണും പെണ്ണുമായി അവരെ’ എന്ന ബഹുവചനത്തിലേക്കുള്ള മാറ്റം ഇതു വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ/മനുഷ്യനെ’ ഈ പ്രതിനിധാനപരമായ ഏകവചനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: בְּצַלְמוֹ
  choice: തന്റെ സ്വരൂപത്തിൽ
  rationale: പ്രത്യയം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കർത്താവിലേക്കു തിരിഞ്ഞുനിൽക്കുന്ന ‘തന്റെ’ എന്ന സർവനാമം അവ്യക്തത ഒഴിവാക്കി എബ്രായത്തിന്റെ ബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: ദൈവത്തിന്റെ സ്വരൂപത്തിൽ
  rationale: മുൻവാക്യഭാഗത്തെ വിശദീകരിക്കുകയും ഊന്നിപ്പറയുകയും ചെയ്യുന്ന ആവർത്തനം നിലനിർത്തി.
- source_word: אֹתוֹ
  choice: അവനെ
  rationale: പ്രതിനിധാനപരമായ ഏകവചനത്തിലുള്ള הָאָדָם എന്ന പദത്തോട് യോജിക്കുന്ന പുല്ലിംഗ ഏകവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: זָכָר וּנְקֵבָה
  choice: ആണും പെണ്ണുമായി
  rationale: ഇവ ബന്ധപരമായ ‘പുരുഷൻ/സ്ത്രീ’ എന്നതിലുപരി ലിംഗഭേദം സൂചിപ്പിക്കുന്ന പദങ്ങളാണ്. ‘ആൺ, പെൺ’ എന്ന മലയാളപദങ്ങൾ ആ അർത്ഥം കൃത്യമായി നൽകുന്നു; ‘-മായി’ അവരെ അങ്ങനെ സൃഷ്ടിച്ചു എന്ന വാക്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: പ്രതിനിധാനപരമായ ഏകവചനത്തിൽനിന്ന് മനുഷ്യരുടെ ബഹുത്വത്തിലേക്കുള്ള ഉദ്ദേശ്യപൂർവമായ മാറ്റം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ മനുഷ്യരാശിയെ സൂചിപ്പിക്കുന്ന אָדָם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മനുഷ്യനെ
  alternative: മനുഷ്യവർഗത്തെ
  rationale: എബ്രായം ഏകവചന രൂപവും ഏകവചന സർവനാമവും ഉപയോഗിച്ചശേഷം ‘ആണും പെണ്ണുമായി അവരെ’ എന്നു ബഹുവചനത്തിലേക്കു മാറുന്നു. ‘മനുഷ്യനെ’ ഈ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ ഏകവചന-ബഹുവചന സംഘർഷം സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യക്തമായ സമൂഹവാചക അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവപൂർണ മലയാളം. എബ്രായത്തിലെ ത്രിവിധ ‘സൃഷ്ടിച്ചു’ ആവർത്തനവും ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റവും സംരക്ഷിച്ചു.
