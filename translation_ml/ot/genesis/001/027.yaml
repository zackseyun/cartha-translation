  source_fidelity: Hebrew's threefold ברא repetition is retained by repeating “സൃഷ്ടിച്ചു” three times. The representative singular הָאָדָם and its singular pronoun are preserved in “മനുഷ്യനെ … അവനെ,” followed by the deliberate plural shift in “അവരെ.” “ആണും പെണ്ണുമായി” accurately conveys the sexed descriptors זָכָר וּנְקֵבָה without substituting the relational pair ‘man and woman.’
