  terminology: “ദൈവം,” “സ്വരൂപം,” and “സൃഷ്ടിച്ചു” are established, natural Malayalam biblical terms. The footnote appropriately supplies “മനുഷ്യവർഗത്തെ” as an alternative explanatory rendering while preserving the source’s singular form in the main text.
