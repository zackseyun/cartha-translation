id: GEN.30.18
reference: Genesis 30:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔/י אֲשֶׁר נָתַ֥תִּי שִׁפְחָתִ֖/י לְ/אִישִׁ֑/י וַ/תִּקְרָ֥א שְׁמ֖/וֹ יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: ml
  text: 'ലേയാ പറഞ്ഞു: “ഞാൻ എന്റെ ദാസിയെ എന്റെ ഭർത്താവിനു കൊടുത്തതിനാൽ ദൈവം എനിക്ക് എന്റെ പ്രതിഫലം തന്നിരിക്കുന്നു.” അവൾ അവന് യിസ്സാഖാർ[a] എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യിസ്സാഖാർ” എന്ന പേര് “കൂലി” അഥവാ “പ്രതിഫലം” എന്നർഥമുള്ള ഹീബ്രു പദത്തോട് ശബ്ദസാമ്യമുള്ളതാണ്; ഇത് ലേയയുടെ വിശദീകരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: ദൈവം ... തന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ഫലം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: שְׂכָרִי
  choice: എന്റെ പ്രതിഫലം
  rationale: ശമ്പളം, കൂലി, പ്രതിഫലം എന്നീ അർഥങ്ങൾക്കിടയിൽ, ജനനത്തെക്കുറിച്ചുള്ള ലേയയുടെ വ്യാഖ്യാനത്തിന് സ്വാഭാവികവും പേരിലെ പദപ്രതിധ്വനി സൂചിപ്പിക്കാൻ യോജിച്ചതുമായ പദം.
- source_word: אֲשֶׁר
  choice: '...തിനാൽ'
  rationale: ഇവിടെ ബന്ധസൂചക കണിക കാരണബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... കൊടുത്തതിനാൽ
  rationale: ഭൂതകാലത്തിൽ നടന്ന പ്രവൃത്തിയെ കാരണവാക്യത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שִׁפְחָתִי
  choice: എന്റെ ദാസിയെ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള ആശ്രിത സേവിക/അടിമ എന്ന അർഥപരിധി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: לְאִישִׁי
  choice: എന്റെ ഭർത്താവിനു
  rationale: സന്ദർഭത്തിൽ אִישׁ എന്നത് യാക്കോബുമായുള്ള വിവാഹബന്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: പേരിടൽ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; שָׂכָר എന്ന ‘പ്രതിഫലം/കൂലി’ പദവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രതിഫലത്തെക്കുറിച്ചുള്ള ലേയയുടെ വ്യാഖ്യാനം
  choice: ലേയയുടെ വാക്കുകൾ വിലയിരുത്താതെ, ദൈവം പ്രതിഫലം നൽകിയെന്ന അവളുടെ അവകാശവാദമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇടപാടുസ്വഭാവം മയപ്പെടുത്തുകയോ വിവർത്തനത്തിൽ അവളുടെ ദൈവശാസ്ത്രത്തെ അംഗീകരിക്കുകയോ വിമർശിക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം സംഭവങ്ങളെക്കുറിച്ചുള്ള ലേയയുടെ സ്വന്തം വ്യാഖ്യാനമാണ് രേഖപ്പെടുത്തുന്നത്; പരിഭാഷ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യരീതി. ‘ദാസി’ ചരിത്രപരമായ ആശ്രിത സേവന/അടിമസ്ഥിതിയുടെ അർഥപരിധി തുറന്നുവെക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വ്യക്തിനാമത്തോടു ചേർത്തിരിക്കുന്നു.
