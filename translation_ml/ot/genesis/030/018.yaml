  source_fidelity: 'The Malayalam accurately represents the Hebrew: Leah attributes the giving of her שְׂכָרִי to God, gives the causal explanation for having given her female servant to her husband, and then names the child Issachar. The present-perfect-like തന്നിരിക്കുന്നു is idiomatic and fitting for the completed action with present relevance.'
