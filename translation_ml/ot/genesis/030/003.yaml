reference: Genesis 30:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ പറഞ്ഞു: “ഇതാ, എന്റെ ദാസി ബിൽഹാ. അവളുടെ അടുക്കൽ ചെല്ലുക; അവൾ എന്റെ മുട്ടുകൾക്കുമേൽ പ്രസവിക്കട്ടെ[a]. അങ്ങനെ അവളിലൂടെ എനിക്കും ഒരു കുടുംബം സ്ഥാപിതമാകട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൾ എന്റെ മുട്ടുകൾക്കുമേൽ പ്രസവിക്കട്ടെ.” ദാസിക്കു ജനിക്കുന്ന കുഞ്ഞിനെ ഭാര്യ തന്റെ കുഞ്ഞായി പ്രതീകാത്മകമായി സ്വീകരിക്കുന്ന ഒരു ആചാരത്തെ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവളിലൂടെ എനിക്കും മക്കളുണ്ടാകട്ടെ.” എബ്രായമൂലത്തിൽ “ഞാനും പടുത്തുയർത്തപ്പെടട്ടെ” എന്നാണ്; സന്തതിയിലൂടെ ഒരു കുടുംബം സ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: എന്റെ ദാസി
  rationale: אמה ഒരു കീഴ്നിലയിലുള്ള സ്ത്രീദാസിയെ സൂചിപ്പിക്കുന്നു. ‘ദാസി’ ആ സാമൂഹിക നില മറച്ചുവയ്ക്കാതെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: בֹּא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെല്ലുക
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശിഷ്ടോക്തിയാണിത്. ഉറവിടത്തിലെ പരോക്ഷപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലും ഗ്രഹിക്കാവുന്ന രീതിയിലാണ് വിവർത്തനം.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: അവൾ എന്റെ മടിയിൽ പ്രസവിക്കട്ടെ
  rationale: ‘എന്റെ മുട്ടുകളിന്മേൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘എന്റെ മടിയിൽ’ മലയാളത്തിൽ സ്വാഭാവികമായി ശരീരഭാവം അറിയിക്കുന്നു; അതേസമയം സാംസ്കാരികമായി അടയാളപ്പെടുത്തിയ പ്രതീകാത്മക സ്വീകരണം നിലനിർത്തുന്നു.
- source_word: וְאִבָּנֶה
  choice: എനിക്കും ഒരു കുടുംബം പടുത്തുയർത്തപ്പെടട്ടെ
  rationale: בנה എന്ന ‘പണിയുക/പടുത്തുയർത്തുക’ എന്ന രൂപകം നിലനിർത്തുകയും, സന്തതിയിലൂടെ കുടുംബം സ്ഥാപിക്കപ്പെടുക എന്ന സന്ദർഭാർഥം മലയാളവായനക്കാരന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מִמֶּנָּה
  choice: അവളിലൂടെ
  rationale: ബിൽഹാ റാഹേലിന് സന്തതി ലഭിക്കുന്ന മാർഗമാണെന്ന ഉപകരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גַם אָנֹכִי
  choice: എനിക്കും
  rationale: വന്ധ്യതയുള്ള റാഹേലും ഈ ക്രമീകരണത്തിലൂടെ കുടുംബസ്ഥാപനത്തിൽ പങ്കാളിയാകുമെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബിൽഹായുടെ പ്രസവത്തിലൂടെ റാഹേൽ ‘പടുത്തുയർത്തപ്പെടുക’ എന്നതിന്റെ അർഥം
  choice: സന്തതിയിലൂടെ ഒരു കുടുംബം സ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന നിർമ്മാണരൂപകം നിലനിർത്തി.
  alternative: ‘അവളിലൂടെ എനിക്കും മക്കളുണ്ടാകട്ടെ’ എന്നു രൂപകം ഒഴിവാക്കി വിവർത്തനം ചെയ്യാം.
  rationale: ഉറവിടത്തിലെ בנה എന്ന പദത്തിന്റെ കുടുംബ/സന്തതി രൂപകം പ്രധാനമാണ്; അതിനെ പൂർണമായി വ്യാഖ്യാനിച്ച് മാറ്റാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നത്ര വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ലൈംഗികബന്ധത്തെക്കുറിച്ചുള്ള എബ്രായ ശിഷ്ടോക്തിയും ‘പടുത്തുയർത്തപ്പെടുക’ എന്ന കുടുംബരൂപകവും സാധ്യമായത്ര നിലനിർത്തി; സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
