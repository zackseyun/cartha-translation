source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: ml
  text: 'അപ്പോൾ ലാബാൻ അവനോടു പറഞ്ഞു: “നിന്റെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി താമസിക്കൂ.[a] യഹ്‌വെ നിന്റെ നിമിത്തം എന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നുവെന്ന് ഞാൻ ശകുനം നോക്കി മനസ്സിലാക്കിയിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “താമസിക്കൂ” എന്ന അഭ്യർഥന മൂലപാഠത്തിൽ വ്യക്തമായി എഴുതിയിട്ടില്ല; സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
    reason: ellipsis
  - marker: b
    text: “ഞാൻ ശകുനം നോക്കി” എന്നതിന് “ഞാൻ ശകുനം വായിച്ചു” എന്നും, അർഥം മയപ്പെടുത്തി “ഞാൻ അനുഭവത്തിൽനിന്ന് മനസ്സിലാക്കി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ സാധാരണയായി ശകുനം നോക്കുന്നതിനെയോ ദിവ്യജ്ഞാനരീതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: നിന്റെ ദൃഷ്ടിയിൽ എനിക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ദയവായി ഇവിടെ താമസിക്കൂ
  rationale: ‘ദൃഷ്ടിയിൽ പ്രീതി ലഭിക്കുക’ എന്ന പ്രയോഗം എബ്രായ ശൈലി നിലനിർത്തുന്നു. נָא അഭ്യർഥനയെ മൃദുവാക്കുന്നതിനാൽ ‘ദയവായി’ എന്നു പരിഭാഷപ്പെടുത്തി. മൂലപാഠത്തിൽ അഭ്യർഥനയുടെ ക്രിയ വിട്ടുകളഞ്ഞിട്ടുണ്ടെങ്കിലും സന്ദർഭത്തിൽനിന്ന് ‘ഇവിടെ താമസിക്കൂ’ എന്നു പൂരിപ്പിച്ചു.
- source_word: נִחַשְׁתִּי
  choice: ഞാൻ ശകുനം നോക്കി മനസ്സിലാക്കിയിരിക്കുന്നു
  rationale: പീയേൽ രൂപത്തിലുള്ള נחשׁ സാധാരണയായി ശകുനം നോക്കലിനെയോ ദിവ്യജ്ഞാനരീതിയെയോ സൂചിപ്പിക്കുന്നു. പ്രവർത്തിയും അതിലൂടെ ലഭിച്ച അറിവും സ്വാഭാവിക മലയാളത്തിൽ ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു; ‘അനുഭവത്തിൽനിന്ന് അറിഞ്ഞു’ എന്ന ദുർബലമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ശബ്ദലിപ്യന്തരണമായി നൽകി.
- source_word: וַיְבָרֲכֵנִי
  choice: എന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: മുൻകാല ദൈവപ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം ലാബാൻ തിരിച്ചറിഞ്ഞതായി പ്രസ്തുത രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בִּגְלָלֶךָ
  choice: നിന്റെ നിമിത്തം
  rationale: കാരണബന്ധം dignified ആയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָבָן
  choice: ലാബാൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: ലാബാന്റെ അറിവിന്റെ മാർഗം
  choice: ശകുനം നോക്കി മനസ്സിലാക്കി
  alternative: അനുഭവത്തിൽനിന്ന് മനസ്സിലാക്കി
  rationale: נחשׁ എന്ന ക്രിയയുടെ ശക്തമായ അടിസ്ഥാനാർഥം ശകുനം നോക്കൽ/ദിവ്യജ്ഞാനം തേടൽ എന്നതാണ്. ലാബാന്റെ രീതി അംഗീകരിക്കാതെയും അതിനെ മയപ്പെടുത്താതെയും മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. എബ്രായ ഭാഷാശൈലിയായ ‘നിന്റെ ദൃഷ്ടിയിൽ പ്രീതി’ നിലനിർത്തിയപ്പോൾ, വിട്ടുകളഞ്ഞ അഭ്യർഥന സന്ദർഭാനുസൃതമായി പൂരിപ്പിച്ചു. ദിവ്യനാമം ‘യഹ്‌വെ’ എന്നും നിഗൂഢജ്ഞാനരീതി ‘ശകുനം നോക്കി’ എന്നും സുതാര്യമായി നൽകി.
