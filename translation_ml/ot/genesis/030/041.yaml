source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: ml
  text: ആട്ടിൻകൂട്ടത്തിലെ കരുത്തുള്ളവ ഇണചേരുമ്പോഴെല്ലാം[a], അവ കോലുകൾക്കിടയിൽ ഇണചേരേണ്ടതിന് യാക്കോബ് ആ കോലുകൾ ആട്ടിൻകൂട്ടത്തിന്റെ കൺമുന്നിൽ വെള്ളം കുടിക്കുന്ന തൊട്ടികളിൽ[b] വെക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കരുത്തുറ്റവ’ എന്നോ ‘ഊർജസ്വലമായവ’ എന്നോ പരിഭാഷപ്പെടുത്താം. അടുത്ത വാക്യത്തിലെ ദുർബലമായ മൃഗങ്ങളിൽനിന്ന് വേർതിരിച്ച്, കൂടുതൽ ദൃഢമായ മൃഗങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ചാലുകളിൽ’ എന്നോ ‘വെള്ളച്ചാലുകളിൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം. മൃഗങ്ങൾ വെള്ളം കുടിക്കാൻ വന്നിരുന്ന ഇടങ്ങളെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: എപ്പോഴെല്ലാം … വെക്കുമായിരുന്നു
  rationale: ഈ ഘടന ആവർത്തിച്ചുണ്ടായിരുന്ന പതിവുസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എപ്പോഴെല്ലാം’ എന്നും ‘വെക്കുമായിരുന്നു’ എന്നും ചേർത്ത് ആ ആവർത്തനഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַחֵם / לְיַחְמֶנָּה
  choice: ഇണചേരുമ്പോൾ / ഇണചേരേണ്ടതിന്
  rationale: മൃഗങ്ങൾ മദിയിലാകുന്നതും പ്രജനനത്തിനായി ഇണചേരുന്നതുമായ സന്ദർഭമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ഇവിടെ മൃഗപരിപാലനസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘ഇണചേരുക’ തിരഞ്ഞെടുത്തു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻകൂട്ടം
  rationale: ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ സ്വാഭാവികവും കൂട്ടവാചകവുമായ മലയാളപ്രയോഗമാണ് ‘ആട്ടിൻകൂട്ടം’.
- source_word: הַמְקֻשָּׁרוֹת
  choice: കരുത്തുള്ളവ
  rationale: അടുത്ത വാക്യത്തിലെ ദുർബലമായ മൃഗങ്ങളോടുള്ള വൈരുധ്യം നിലനിർത്തി, ദൃഢവും നല്ല ശേഷിയുള്ളതുമായ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന ലളിതമായ പ്രയോഗം.
- source_word: וְשָׂם
  choice: വെക്കുമായിരുന്നു
  rationale: שׂים എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും പ്രവൃത്തിയുടെ പതിവായ ആവർത്തനസ്വഭാവവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמַּקְלוֹת
  choice: കോലുകൾ
  rationale: മുൻസന്ദർഭത്തിൽ യാക്കോബ് ഉപയോഗിച്ച തൊലിയുരിച്ച കൊമ്പുകളെയോ വടികളെയോ സൂചിപ്പിക്കുന്ന, വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: לְעֵינֵי הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിന്റെ കൺമുന്നിൽ
  rationale: ‘കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּרֳהָטִים
  choice: വെള്ളം കുടിക്കുന്ന തൊട്ടികളിൽ
  rationale: മൃഗങ്ങൾ വെള്ളം കുടിക്കാൻ വന്നിരുന്ന തൊട്ടികളെയോ ചാലുകളെയോ ആണ് പദം സൂചിപ്പിക്കുന്നത്; പശ്ചാത്തലം വായനക്കാരന് വ്യക്തമാകുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: לְיַחְמֶנָּה
  choice: ഇണചേരേണ്ടതിന്
  rationale: לְ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. യാക്കോബിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു; കോലുകൾ തന്നെ നിർബന്ധമായും ഇണചേരലിനു കാരണമായി എന്ന് അതിശയോക്തിയായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: בַּמַּקְלוֹת
  choice: കോലുകൾക്കിടയിൽ
  rationale: കോലുകൾ അവയുടെ മുമ്പിൽ വെച്ചിരുന്ന സാഹചര്യത്തിൽ ഇണചേരുക എന്ന സ്ഥലപരമായ/സാഹചര്യപരമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കോലുകളും പ്രജനനഫലവും തമ്മിലുള്ള കാരണബന്ധം
  choice: ‘ഇണചേരേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യപ്രയോഗം ഉപയോഗിച്ചു
  alternative: ‘കോലുകൾ അവയെ ഇണചേരിച്ചു’ എന്ന നേരിട്ടുള്ള കാരണപ്രയോഗം
  rationale: എബ്രായം യാക്കോബിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; കോലുകളുടെ ഫലപ്രാപ്തിയെക്കുറിച്ചുള്ള ശാസ്ത്രീയമോ അത്ഭുതപരമോ ആയ വിശദീകരണം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ ആഖ്യാനശൈലി. ആവർത്തിച്ച പ്രവൃത്തിയെ ‘എപ്പോഴെല്ലാം … വെക്കുമായിരുന്നു’ എന്ന ഘടനയിലൂടെ പ്രകടിപ്പിച്ചു; മൂലത്തിലെ ദൃശ്യഊന്നലും ഉദ്ദേശ്യഭാവവും സംരക്ഷിച്ചു.
