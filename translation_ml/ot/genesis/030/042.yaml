  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. പാഠത്തിൽ ഹീബ്രുവിലെ സംക്ഷിപ്തതയും വൈരുധ്യവും നിലനിർത്തി; സൂചിത കർമമായ കോലുകൾ വ്യക്തതയ്ക്കായി ചേർത്ത് അടിക്കുറിപ്പിൽ സന്ദർഭബന്ധം നൽകി.
