reference: Genesis 30:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: ml
  text: എന്നാൽ ആട്ടിൻപറ്റത്തിലെ ദുർബലമായവ ഇണചേരുമ്പോൾ, അവൻ ആ കോലുകൾ വെച്ചില്ല[a]. അങ്ങനെ ദുർബലമായവ ലാബാന്റേതും കരുത്തുള്ളവ യാക്കോബിന്റേതുമായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുൻവാക്യങ്ങളിൽ പറഞ്ഞതുപോലെ അവൻ കോലുകൾ അവയുടെ മുമ്പിൽ വെച്ചില്ല.
    reason: cross_reference
  - marker: b
    text: “ദുർബലമായവ” എന്നതിനുപകരം “ബലഹീനമായവ” എന്നും, “കരുത്തുള്ളവ” എന്നതിനുപകരം “ദൃഢമായവ” അല്ലെങ്കിൽ “ഊർജസ്വലമായവ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദങ്ങളുടെ കൃത്യമായ സൂക്ഷ്മാർഥം അനിശ്ചിതമാണ്; ദുർബലമായതും കരുത്തുള്ളതുമായ മൃഗങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: ആട്ടിൻപറ്റത്തിലെ ദുർബലമായവ ഇണചേരുമ്പോൾ
  rationale: בְּ + infinitive construct temporal clause ആയി എടുത്തു. עטף എന്ന അപൂർവ പദം ഇവിടെ എതിർപദമായ קְשֻׁרִים നോടുള്ള വ്യത്യാസത്തിൽ ‘ദുർബലമായവ’ എന്നു പരിഭാഷപ്പെടുത്തി; പ്രജനനസന്ദർഭം വ്യക്തമാക്കാൻ ‘ഇണചേരുമ്പോൾ’ ചേർത്തു, എന്നാൽ ‘വൈകി ഇണചേരുന്നവ’ എന്ന കൂടുതൽ നിർദിഷ്ട വ്യാഖ്യാനം പാഠത്തിൽ നിർബന്ധിച്ചില്ല.
- source_word: הַצֹּאן
  choice: ആട്ടിൻപറ്റം
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്. സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആട്ടിൻപറ്റം’ ഉപയോഗിച്ചു.
- source_word: לֹא יָשִׂים
  choice: അവൻ ആ കോലുകൾ വെച്ചില്ല
  rationale: שׂים എന്നത് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്. ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യങ്ങളിലെ കോലുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയം വ്യക്തമായിരിക്കാനായി ‘ആ കോലുകൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: וְהָיָה
  choice: അങ്ങനെ ... ആയി
  rationale: വാവ് + ഖാതൽ ഇവിടെ ഫലമായി ഉണ്ടായ അവസ്ഥ അറിയിക്കുന്നു. ‘അങ്ങനെ ... ആയി’ സ്വാഭാവികമായി ആ ഫലം പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֲטֻפִים
  choice: ദുർബലമായവ
  rationale: עטף മൂലത്തിൽനിന്നുള്ള രൂപം, തുടക്കത്തിലെ പദവുമായി ശബ്ദാർഥബന്ധം നിലനിർത്തിയും കരുത്തുള്ളവയോടുള്ള വൈരുധ്യം സൂക്ഷിച്ചും പരിഭാഷപ്പെടുത്തി.
- source_word: לְלָבָן
  choice: ലാബാന്റേത്
  rationale: ലാമെദ് ഇവിടെ ഉടമസ്ഥതയെയോ ലഭിച്ച വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഉടമസ്ഥരൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהַקְּשֻׁרִים
  choice: കരുത്തുള്ളവ
  rationale: രൂപം അപൂർവമാണെങ്കിലും ദുർബലമായവയോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം ശക്തമോ ഊർജസ്വലമോ ആയ മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കരുത്തുള്ളവ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിന്റേത്
  rationale: ലാമെദ് ഉടമസ്ഥതയെയോ വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപം സ്വീകരിച്ചു.
