id: GEN.30.24
reference: Genesis 30:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקְרָ֧א אֶת שְׁמ֛/וֹ יוֹסֵ֖ף לֵ/אמֹ֑ר יֹסֵ֧ף יְהוָ֛ה לִ֖/י בֵּ֥ן אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: ml
  text: അവൾ അവന് യോസേഫ്[a] എന്നു പേരിട്ടു. “യഹ്‌വെ എനിക്ക് മറ്റൊരു മകനെക്കൂടി തരട്ടെ” എന്ന് അവൾ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യോസേഫ്” എന്ന പേര് “കൂട്ടിച്ചേർക്കട്ടെ” അഥവാ “അവൻ കൂട്ടിച്ചേർക്കുന്നു” എന്നർഥമുള്ള എബ്രായ ക്രിയയോട് ശബ്ദസാദൃശ്യമുള്ളതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: ‘അവന്റെ പേര് വിളിച്ചു’ എന്ന എബ്രായ നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: לֵאמֹר
  choice: എന്ന് അവൾ പറഞ്ഞു
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ infinitive-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: יֹסֵף
  choice: തരട്ടെ
  rationale: הוסיף എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘കൂട്ടിച്ചേർക്കുക’ എന്നാണ്; ഒരു മകനെ സംബന്ധിച്ച് മലയാളത്തിൽ ‘മറ്റൊരു മകനെക്കൂടി തരട്ടെ’ എന്നത് പ്രാർഥനാത്മക ആശയം സ്വാഭാവികമായി നൽകുന്നു. പേരുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לִי
  choice: എനിക്ക്
  rationale: ഗുണഭോക്താവിനെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന לִי-യുടെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: בֵּן אַחֵר
  choice: മറ്റൊരു മകനെക്കൂടി
  rationale: בן എന്നത് പ്രത്യേകം ‘മകൻ’ എന്നും אַחֵר ‘മറ്റൊന്ന്’ എന്നും സൂചിപ്പിക്കുന്നു; ‘കൂടി’ ചേർക്കലിന്റെ ആശയം സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: יֹסֵף എന്ന ക്രിയയുടെ ഭാവം
  choice: പ്രാർഥന/ആഗ്രഹമായി ‘തരട്ടെ’
  alternative: ‘കൂട്ടിച്ചേർക്കും’ അഥവാ ‘കൂട്ടിച്ചേർത്തിരിക്കുന്നു’
  rationale: നാമകരണവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ രൂപം ഭാവിയിലേക്കുള്ള അപേക്ഷയോ ആഗ്രഹമോ ആയി വായിക്കാം; ഉറപ്പായ പ്രവചനമോ പൂർത്തിയായ പ്രവൃത്തിയോ ആയി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ നാമകരണസൂത്രം പദാനുപദമായി അസ്വാഭാവികമാക്കാതെ ‘പേരിട്ടു’ എന്നു നൽകി; പേരും ക്രിയയും തമ്മിലുള്ള ശബ്ദകളി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
