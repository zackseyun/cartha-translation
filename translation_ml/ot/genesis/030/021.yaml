  text: അതിനുശേഷം അവൾ ഒരു മകളെ പ്രസവിച്ചു; ആ മകൾക്ക് ദീനാ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: മുൻപു വിവരിച്ച പ്രസവങ്ങൾക്കു ശേഷമുള്ള സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: יָלְדָה בַּת
  choice: ഒരു മകളെ പ്രസവിച്ചു
  rationale: യָלְדָה എന്ന ക്രിയയുടെയും അതിന്റെ പ്രത്യക്ഷ കർമമായ בַּת എന്ന നാമത്തിന്റെയും അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַתִּקְרָא אֶת־שְׁמָהּ
  choice: അവൾക്ക് … എന്നു പേരിട്ടു
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ പേര് വിളിച്ചു’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, അതേ അർഥം നൽകുന്ന സാധാരണ നാമകരണപ്രയോഗം സ്വീകരിച്ചു.
- source_word: דִּינָה
  choice: ദീനാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സംഭവക്രമം നിലനിർത്തിയപ്പോൾ, നാമകരണവാക്യം സ്വാഭാവിക മലയാളരീതിയിൽ അവതരിപ്പിച്ചു.
