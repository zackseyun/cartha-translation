source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר נָקְבָ֧/ה שְׂכָרְ/ךָ֛ עָלַ֖/י וְ/אֶתֵּֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/028.yaml
  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: ml
  text: അപ്പോൾ അവൻ പറഞ്ഞു[a], “നിന്റെ കൂലി എത്രയെന്നു എന്നോടു പറയുക; ഞാൻ അതു തരാം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ വേതനം എന്നോടു നിശ്ചയിച്ചുപറയുക; ഞാൻ അതു തരാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു; ആ ക്രമാനുഗത ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ നൽകുന്നു.
- source_word: נָקְבָה
  choice: വ്യക്തമാക്കുക
  rationale: נקב ഇവിടെ തുക വ്യക്തമായി നിശ്ചയിച്ചു പറയുക എന്ന അർഥത്തിലാണ്. ‘വ്യക്തമാക്കുക’ ആ ആശയം മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: שְׂכָרְךָ
  choice: നിനക്കുള്ള കൂലി
  rationale: שָׂכָר അധ്വാനത്തിനുള്ള കൂലി അഥവാ പ്രതിഫലം സൂചിപ്പിക്കുന്നു; യാക്കോബും ലാബാനും തമ്മിലുള്ള തൊഴിൽസന്ദർഭത്തിൽ ‘കൂലി’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: עָלַי
  choice: എന്നോട്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെമേൽ’ എന്നാണെങ്കിലും, ഈ പ്രയോഗത്തിൽ പറയേണ്ട തുക സംസാരിക്കുന്നവനോടു വ്യക്തമാക്കുക എന്ന ദിശാസൂചനയാണ്; അതിനാൽ ‘എന്നോട്’ സ്വാഭാവികവും ഉറവിടസാക്ഷ്യത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: וְאֶתֵּנָה
  choice: ഞാൻ അതു തരാം
  rationale: נתן എന്ന ക്രിയയുടെ ‘തരുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. ഏകവചനമായ കൂലിത്തുകയെ മലയാളത്തിൽ ‘അതു’ എന്നു സ്വാഭാവികമായി പരാമർശിക്കുന്നു; രൂപം ഉറപ്പുനൽകുന്ന ഭാവവും വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആദരവുറ്റ മലയാളം. സംഭാഷണത്തിൽ സ്വാഭാവികത നിലനിർത്തിക്കൊണ്ട് ‘എന്നോട്’ എന്ന ഹീബ്രു ഘടകവും പരിഭാഷയിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
