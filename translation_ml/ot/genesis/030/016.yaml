  source_fidelity: 'The Malayalam accurately represents the Hebrew sequence and sense: Jacob’s return from the field at evening, Leah’s going out to meet him, her emphatic claim that he is to come to her because she has hired him by means of her son’s mandrakes, and Jacob’s lying with her that night. The transactional ambiguity of בְּ in בְּדוּדָאֵי is appropriately retained and explained without over-specifying the arrangement.'
