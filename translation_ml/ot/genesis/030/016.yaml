id: GEN.30.16
reference: Genesis 30:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יַעֲקֹ֣ב מִן הַ/שָּׂדֶה֮ בָּ/עֶרֶב֒ וַ/תֵּצֵ֨א לֵאָ֜ה לִ/קְרָאת֗/וֹ וַ/תֹּ֨אמֶר֙ אֵלַ֣/י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔י/ךָ בְּ/דוּדָאֵ֖י בְּנִ֑/י וַ/יִּשְׁכַּ֥ב עִמָּ֖/הּ בַּ/לַּ֥יְלָה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: ml
  text: 'വൈകുന്നേരം യാക്കോബ് വയലിൽനിന്നു വന്നപ്പോൾ ലേയ അവനെ എതിരേൽക്കാൻ ചെന്നു പറഞ്ഞു: “നീ എന്റെ അടുക്കൽ വരണം; എന്റെ മകന്റെ ദൂദായിപ്പഴങ്ങൾ കൊടുത്ത് ഞാൻ നിന്നെ കൂലിക്കെടുത്തിരിക്കുന്നു[a].” അങ്ങനെ ആ രാത്രി അവൻ അവളോടുകൂടെ ശയിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ മകന്റെ ദൂദായിപ്പഴങ്ങൾ വിലയായി കൊടുത്ത് ഞാൻ നിന്നെ കൂലിക്കെടുത്തിരിക്കുന്നു.” എബ്രായപ്രയോഗം ദൂദായിപ്പഴങ്ങളെ ഈ ക്രമീകരണത്തിന്റെ വിലയോ മാർഗമോ ആയി ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: വയലിൽനിന്നു വന്നപ്പോൾ
  rationale: ബוא എന്നതിന്റെ വരുക/അകത്തേക്കു വരുക എന്ന ചലനാർഥവും מן השדה എന്ന സ്ഥലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּעֶרֶב
  choice: വൈകുന്നേരം
  rationale: കാലസൂചനയെ ആധുനിക സാധാരണ മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: അവനെ എതിരേൽക്കാൻ ചെന്നു
  rationale: יצא + לקראת എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ പുറത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵלַי תָּבוֹא
  choice: നീ എന്റെ അടുക്കൽ വരണം
  rationale: സന്ദർഭത്തിലെ ലൈംഗിക സൂചന അസഭ്യമാക്കാതെ നിലനിർത്തുകയും ലേയയുടെ ഉറച്ച അവകാശവാദം ‘വരണം’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: ഞാൻ നിന്നെ കൂലിക്കെടുത്തിരിക്കുന്നു
  rationale: ഒരേ ധാതുവിന്റെ ആവർത്തനമുള്ള എബ്രായപ്രയോഗത്തിന്റെ ഇടപാടുസ്വഭാവം ‘കൂലിക്കെടുക്കുക’ എന്ന തിരഞ്ഞെടുപ്പിലൂടെ നിലനിർത്തുന്നു; ആവർത്തനത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ കൃത്രിമമായി ഇരട്ടിപ്പിക്കുന്നില്ല.
- source_word: בְּדוּדָאֵי בְנִי
  choice: എന്റെ മകന്റെ ദൂദായിപ്പഴങ്ങൾ കൊടുത്ത്
  rationale: בְּ എന്നത് ഇവിടെ ക്രമീകരണത്തിന്റെ വിലയോ മാർഗമോ സൂചിപ്പിക്കുന്നു. ‘കൊടുത്ത്’ ഇടപാടിന്റെ അർഥം വ്യക്തമാക്കുന്നു; സസ്യനാമം ഉറപ്പില്ലാത്തതിനാൽ പരമ്പരാഗതമായ ‘ദൂദായിപ്പഴങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: അവൻ അവളോടുകൂടെ ശയിച്ചു
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ മാന്യമായ പരോക്ഷപ്രയോഗം അതേ ഗൗരവത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: בַּלַּיְלָה הוּא
  choice: ആ രാത്രി
  rationale: എബ്രായത്തിലെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തെ സ്വാഭാവിക മലയാളകാലപ്രയോഗമായി നൽകുന്നു.
