translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ശയിച്ചു’ എന്ന ബൈബിൾപരമായ പരോക്ഷപ്രയോഗം മൂലപാഠത്തിന്റെ സംയമിതഭാവം സംരക്ഷിക്കുന്നു; ‘ദൂദായിപ്പഴങ്ങൾ’ എന്ന അപൂർവ സസ്യനാമത്തിന് ഇടപാടിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
