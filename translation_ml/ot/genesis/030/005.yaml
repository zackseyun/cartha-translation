source:
  edition: WLC
  text: וַ/תַּ֣הַר בִּלְהָ֔ה וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/005.yaml
  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: ml
  text: ബിൽഹാ ഗർഭം ധരിച്ച് യാക്കോബിന് ഒരു മകനെ പ്രസവിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഗർഭിണിയായി, യാക്കോബിനുവേണ്ടി ഒരു മകനെ പ്രസവിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയ ഗർഭിണിയാകുക/ഗർഭം ധരിക്കുക എന്നർഥം നൽകുന്നു. ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: בִּלְהָה
  choice: ബിൽഹ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന പതിവ് മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയ ഇവിടെ ഒരു കുഞ്ഞിനെ പ്രസവിക്കുക എന്നർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിന്
  rationale: לְ എന്ന ബന്ധസൂചകത്തെ മലയാളത്തിലെ ദാതൃവിഭക്തിയായ ‘-ന്’ ഉപയോഗിച്ച് നിലനിർത്തി; മകൻ യാക്കോബിനുവേണ്ടി/യാക്കോബിനുള്ളവനായി ജനിച്ചു എന്ന മൂലഭാഷയിലെ ബന്ധം ഇതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: בֵּן എന്നത് ‘മകൻ’ എന്നാണ്; സ്വാഭാവിക മലയാള വാക്യഘടനയ്ക്കായി ‘ഒരു’യും ‘പ്രസവിച്ചു’ എന്ന ക്രിയയുടെ കർമവിഭക്തിയും ചേർത്തു.
theological_decisions:
- issue: לְיַעֲקֹב എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: യാക്കോബിന്
  alternative: യാക്കോബിന്റെ മകനായി
  rationale: മൂലപാഠത്തിലെ ദാതൃ/ബന്ധസൂചക രൂപം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘യാക്കോബിന്’ എന്നു നിലനിർത്തുന്നു; ഇതിലൂടെ പ്രസവത്തിന്റെയും പിതൃത്വബന്ധത്തിന്റെയും സൂചന ഒരുമിച്ച് തുറന്ന നിലയിൽ തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗർഭം ധരിച്ച് … പ്രസവിച്ചു’ എന്ന കൂട്ടുപ്രയോഗം എബ്രായത്തിലെ തുടർച്ചയായ രണ്ടു സംഭവങ്ങളെയും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
