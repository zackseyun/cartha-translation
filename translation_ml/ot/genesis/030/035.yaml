translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. കോലാടുകളുടെ ലിംഗവ്യത്യാസവും വിവിധതരം ശരീര അടയാളങ്ങൾക്കായുള്ള എബ്രായ പദവ്യത്യാസവും കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തി; כְּשָׂבִים എന്നതിന് പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കാൻ ‘ചെമ്മരിയാടുകൾ’ ഉപയോഗിച്ചു.
