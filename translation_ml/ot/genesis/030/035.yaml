revisions:
- from: അന്നുതന്നെ അവൻ വരകളുള്ളതും മറുകുകളുള്ളതുമായ ആൺകോലാടുകളെയും[a], ചെറുപുള്ളികളും മറുകുകളുമുള്ള എല്ലാ പെൺകോലാടുകളെയും—വെള്ളനിറമുള്ള ഭാഗമുണ്ടായിരുന്ന ഓരോന്നിനെയും—ചെമ്മരിയാടുകളിൽ കടുംനിറമുള്ള എല്ലാറ്റിനെയും[b] വേർതിരിച്ച് തന്റെ പുത്രന്മാരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചു[c].
  to: ആ ദിവസം അവൻ വരകളുള്ള[a]തും പാടുകളുള്ളതുമായ ആൺകോലാടുകളെയും, ചെറുപുള്ളികളും പാടുകളുമുള്ള എല്ലാ പെൺകോലാടുകളെയും—വെള്ളനിറമുള്ള ഭാഗമുണ്ടായിരുന്ന ഓരോന്നിനെയും—ചെമ്മരിയാടുകളിൽ ഇരുണ്ടനിറമുള്ളവയെയെല്ലാം[b] വേർതിരിച്ച് തന്റെ പുത്രന്മാരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചു[c].
  rationale: ടְלֻאִים/טְלֻאֹת-നുള്ള ‘മറുകുകൾ’ മാറ്റി ‘പാടുകൾ’ ഉപയോഗിച്ചു; ഇതിലൂടെ ചെറുപുള്ളി (נְקֻדּוֹת) എന്നതും വലിയ/പാച്ചിയായ പാട് (טְלֻאֹת) എന്നതും തമ്മിലുള്ള വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ നിലനിൽക്കുന്നു. ഇരുണ്ടനിറമുള്ള ചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും വ്യക്തമാക്കി. അർഥം, ക്രിയയുടെ ബന്ധം, ലിംഗവ്യത്യാസം, കൈയിൽ ഏൽപ്പിച്ചു എന്ന ശൈലിയുടെ അർഥം എന്നിവ മാറ്റിയിട്ടില്ല.
