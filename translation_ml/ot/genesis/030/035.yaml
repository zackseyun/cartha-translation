  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: ml
  text: ആ ദിവസം അവൻ വരകളുള്ള[a]തും പാടുകളുള്ളതുമായ ആൺകോലാടുകളെയും, ചെറുപുള്ളികളും പാടുകളുമുള്ള എല്ലാ പെൺകോലാടുകളെയും—വെള്ളനിറമുള്ള ഭാഗമുണ്ടായിരുന്ന ഓരോന്നിനെയും—ചെമ്മരിയാടുകളിൽ ഇരുണ്ടനിറമുള്ളവയെയെല്ലാം[b] വേർതിരിച്ച് തന്റെ പുത്രന്മാരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വരകളുള്ള’ എന്നതിന് ‘പട്ടകളുള്ള’ അല്ലെങ്കിൽ ‘വളയവരകളുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം മൃഗങ്ങളുടെ ശരീരത്തിലെ പട്ടപോലുള്ള അടയാളങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇരുണ്ടനിറമുള്ള’ എന്നതിന് ‘തവിട്ടുനിറമുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഇരുണ്ട തവിട്ടുനിറത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘തന്റെ പുത്രന്മാരുടെ കൈയിൽ കൊടുത്തു’; അവരുടെ നിയന്ത്രണത്തിലോ പരിപാലനത്തിലോ ഏൽപ്പിച്ചു എന്നർഥമുള്ള എബ്രായ ശൈലി.'
    reason: idiom
lexical_decisions:
- source_word: וַיָּסַר
  choice: വേർതിരിച്ച്
  rationale: ഹിഫ്ഇൽ രൂപം മൃഗങ്ങളെ കൂട്ടത്തിൽനിന്ന് മാറ്റിനിർത്തുകയോ വേർതിരിക്കുകയോ ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘വേർതിരിച്ച്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַתְּיָשִׁים
  choice: ആൺകോലാടുകൾ
  rationale: תיש പ്രത്യേകമായി ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
- source_word: הָעֲקֻדִּים
  choice: വരകളുള്ള
  rationale: മൃഗങ്ങളുടെ ശരീരത്തിലെ പട്ടകളോ വളയവരകളോ പോലുള്ള അടയാളങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിരുകടന്ന സാങ്കേതികത ഒഴിവാക്കി ‘വരകളുള്ള’ എന്നു നൽകി.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: മറുകുകളുള്ള
  rationale: ടלא എന്ന പദം പാച്ചുകളോ ക്രമരഹിതമായ വലിയ നിറയടയാളങ്ങളോ സൂചിപ്പിക്കുന്നു; נקוד എന്ന ചെറുപുള്ളികളിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘മറുകുകൾ’ ഉപയോഗിച്ചു.
- source_word: הַנְּקֻדּוֹת
  choice: ചെറുപുള്ളികളുള്ള
  rationale: נקוד ചെറിയ കുത്തുകളെയോ പുള്ളികളെയോ സൂചിപ്പിക്കുന്നു; ടלא എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം മലയാളത്തിലും പ്രകടമാക്കുന്നു.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: വെള്ളനിറമുള്ള ഭാഗമുണ്ടായിരുന്ന ഓരോന്നിനെയും
  rationale: ‘അതിൽ വെള്ളയുള്ള എല്ലാം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിതരണാത്മക അർഥവും മൃഗങ്ങളുടെ ശരീരത്തിലെ വെള്ള അടയാളവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: ചെമ്മരിയാടുകളിൽ കടുംനിറമുള്ള എല്ലാറ്റിനെയും
  rationale: חוּם ഇരുണ്ടതോ തവിട്ടുനിറമുള്ളതോ ആയ വർണം സൂചിപ്പിക്കാം; כְּשָׂבִים എന്നത് നിർബന്ധമായും കുഞ്ഞാടുകൾ മാത്രമല്ലാത്തതിനാൽ വിശാലമായ ‘ചെമ്മരിയാടുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: തന്റെ പുത്രന്മാരുടെ ചുമതലയിൽ ഏൽപ്പിച്ചു
  rationale: അക്ഷരാർഥമായ ‘പുത്രന്മാരുടെ കൈയിൽ കൊടുത്തു’ എന്നത് അവരുടെ നിയന്ത്രണത്തിലോ പരിപാലനത്തിലോ ഏൽപ്പിച്ചു എന്ന എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി അറിയിച്ചു.
