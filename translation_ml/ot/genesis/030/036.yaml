  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֗שֶׂם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים בֵּינ֖/וֹ וּ/בֵ֣ין יַעֲקֹ֑ב וְ/יַעֲקֹ֗ב רֹעֶ֛ה אֶת צֹ֥אן לָבָ֖ן הַ/נּוֹתָרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/036.yaml
  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: ml
  text: അവൻ തനിക്കും യാക്കോബിനും ഇടയിൽ മൂന്നു ദിവസത്തെ യാത്രാദൂരം വെച്ചു. യാക്കോബ് ലാബാന്റെ ശേഷിച്ച ആട്ടിൻപറ്റത്തെ മേയിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ യാത്രാദൂരം
  rationale: പദപ്രയോഗം സൂചിപ്പിക്കുന്നത് വെറും കാലയളവല്ല, മൂന്നു ദിവസം യാത്ര ചെയ്യേണ്ടത്ര ദൂരമാണ്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ അർഥം വ്യക്തമാക്കി.
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: ‘സ്ഥാപിച്ചു/വെച്ചു’ എന്ന അടിസ്ഥാനാർഥം ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: רֹעֶה
  choice: മേയിച്ചുകൊണ്ടിരുന്നു
  rationale: ഹീബ്രായ പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: ലാബാന്റെ ശേഷിച്ച ആട്ടിൻപറ്റം
  rationale: צֹאן എന്നത് ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭോചിതവും വായനാസൗകര്യമുള്ളതുമായ പരമ്പരാഗത മലയാള പദമായി ‘ആട്ടിൻപറ്റം’ സ്വീകരിച്ചു; ‘ശേഷിച്ച’ എന്നത് הַנּוֹתָרֹת കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണം. ആദ്യത്തെ ‘അവൻ’ സന്ദർഭത്തിൽ ലാബാനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലത്തിലെ സർവനാമം നിലനിർത്തി. ‘യാക്കോബോ’ എന്ന പ്രയോഗം വാക്യത്തിലെ വിഷയമാറ്റവും നേരിയ വിരുദ്ധസമാന്തരതയും സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
