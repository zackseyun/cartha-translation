  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בגד
  choice: ഭാഗ്യം!
  rationale: ഈ ദുഷ്കരമായ എബ്രായ പ്രയോഗം גד (‘ഭാഗ്യം’) എന്നതുമായി ബന്ധപ്പെട്ട ആഹ്ലാദപ്രകടനമായി മനസ്സിലാക്കാം; കുട്ടിയുടെ ഗാദ് എന്ന പേരുമായുള്ള ശബ്ദബന്ധവും ഇതിലൂടെ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: അതുകൊണ്ട് അവൾ അവന് ... എന്നു പേരിട്ടു
  rationale: പേരിടൽ സന്ദർഭത്തിലെ קרא എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ലേയായുടെ ആഹ്ലാദപ്രകടനത്തിൽനിന്ന് പേരിടലിലേക്കുള്ള ഫലസൂചകമായ ഒഴുക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: גָּד
  choice: ഗാദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം; മുൻപുള്ള ‘ഭാഗ്യം’ എന്ന ആഹ്ലാദപ്രകടനത്തോടുള്ള പേരിടൽ വാക്കുകളിയും സൂചിപ്പിക്കുന്നു.
