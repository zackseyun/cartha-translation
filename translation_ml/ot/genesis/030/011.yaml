lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം കഥയിലെ അടുത്ത പ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു; ആഖ്യാനത്തിന്റെ തുടർച്ച ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאָה
