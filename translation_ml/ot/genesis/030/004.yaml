  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּתֶּן ל֛/וֹ אֶת בִּלְהָ֥ה שִׁפְחָתָ֖/הּ לְ/אִשָּׁ֑ה וַ/יָּבֹ֥א אֵלֶ֖י/הָ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: ml
  text: അങ്ങനെ അവൾ തന്റെ ദാസിയായ[a] ബിൽഹയെ അവന് ഭാര്യയായി കൊടുത്തു; യാക്കോബ് അവളുടെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദാസി’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായപദം കീഴ്നിലയിലുള്ള ഒരു സ്ത്രീസേവികയെയോ സ്ത്രീ അടിമയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: അങ്ങനെ അവൾ ... കൊടുത്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. മുൻവാക്യത്തിലെ സാഹചര്യഫലവും സംഭവക്രമവും സ്വാഭാവിക മലയാളത്തിൽ ‘അങ്ങനെ’ വ്യക്തമാക്കുന്നു.
- source_word: לּוֹ
  choice: അവന്
  rationale: എബ്രായ പരോക്ഷകർമത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: בִּלְהָה
  choice: ബിൽഹ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁפְחָתָהּ
  choice: തന്റെ ദാസിയായ
  rationale: שִׁפְחָה കീഴ്നിലയിലുള്ള സ്ത്രീസേവികയെയോ സ്ത്രീ അടിമയെയോ സൂചിപ്പിക്കുന്നു. ‘ദാസി’ ലിംഗവും സാമൂഹികപദവിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തതയോടെ കാണിക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഈ പ്രയോഗം വിവാഹപരമോ ഉപഭാര്യാതുല്യമോ ആയ ബന്ധത്തിലേക്ക് നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ബന്ധത്തിന്റെ നിയമ-സാമൂഹിക സ്വഭാവം അമിതമായി വിശദീകരിക്കാതെ ‘ഭാര്യയായി’ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: അവളുടെ അടുക്കൽ ചെന്നു
  rationale: ലൈംഗികസംഗമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മര്യാദാപ്രയോഗമാണിത്. അതിനെ തുറന്നുപറയാതെ മൂലത്തിലെ ശൈലിയും സൂചനയും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: ബിൽഹയുടെ ബന്ധപദവി
  choice: ഭാര്യയായി
  alternative: ഉപഭാര്യയായി
  rationale: לְאִשָּׁה എന്ന മൂലപദം നേരിട്ട് ‘സ്ത്രീയായി/ഭാര്യയായി’ എന്നാണ്; ‘ഉപഭാര്യ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തിൽ നിന്നുള്ള ഒരു പ്രത്യേക സാമൂഹിക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കും. അതിനാൽ മൂലത്തിലെ ബന്ധപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ലൈംഗികസംഗമത്തിനുള്ള എബ്രായ മര്യാദാപ്രയോഗം ‘അവളുടെ അടുക്കൽ ചെന്നു’ എന്ന് സൂചനാത്മകമായി നിലനിർത്തി.
