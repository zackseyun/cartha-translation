id: GEN.30.26
reference: Genesis 30:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: תְּנָ֞/ה אֶת נָשַׁ֣/י וְ/אֶת יְלָדַ֗/י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְ/ךָ֛ בָּ/הֵ֖ן וְ/אֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת עֲבֹדָתִ֖/י אֲשֶׁ֥ר עֲבַדְתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: ml
  text: എന്റെ ഭാര്യമാരെയും മക്കളെയും എനിക്കു തരിക—അവർക്കുവേണ്ടിയാണല്ലോ ഞാൻ അങ്ങയെ സേവിച്ചത്[a]—എന്നിട്ട് ഞാൻ പോകട്ടെ. ഞാൻ അങ്ങേക്കു ചെയ്ത സേവനം എന്താണെന്ന് അങ്ങേക്ക് അറിയാമല്ലോ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ ലഭിക്കാനായി ഞാൻ അങ്ങയെ സേവിച്ചു.’ എബ്രായത്തിലെ സ്ത്രീലിംഗ ബഹുവചനം ഇവിടെ പറഞ്ഞ മുഴുവൻ കുടുംബത്തേക്കാൾ പ്രത്യേകമായി ഭാര്യമാരെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സേവനം’ എന്നത് ‘അധ്വാനം’ എന്നോ ‘ജോലി’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഈ വാക്യത്തിൽ ‘സേവിക്കുക/ജോലി ചെയ്യുക’ എന്ന ഒരേ എബ്രായ മൂലം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: എനിക്കു തരിക
  rationale: ലാബാനോടുള്ള ആജ്ഞാരൂപം; സന്ദർഭത്തിൽ യാക്കോബാണ് സ്വീകരിക്കുന്നവൻ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: എന്റെ ഭാര്യമാരെയും മക്കളെയും
  rationale: സന്ദർഭത്തിൽ אִשָּׁה ഭാര്യമാരെയും יֶלֶד മക്കളെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: അവർക്കുവേണ്ടിയാണല്ലോ ഞാൻ അങ്ങയെ സേവിച്ചത്
  rationale: בָהֵן സൂചിപ്പിക്കുന്ന കാരണ/പ്രതിഫലബന്ധം നിലനിർത്തുന്നു; സ്ത്രീലിംഗ ബഹുവചനമായതിനാൽ പ്രത്യേകിച്ച് ഭാര്യമാരിലേക്കുള്ള സൂചനയ്ക്കും ഇട നൽകുന്നു.
- source_word: וְאֵלֵכָה
  choice: എന്നിട്ട് ഞാൻ പോകട്ടെ
  rationale: הלך എന്ന ക്രിയയുടെ cohortative ഭാവമായ ആഗ്രഹവും അനുമതി അഭ്യർഥിക്കുന്ന സ്വരവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: അങ്ങേക്ക് അറിയാമല്ലോ
  rationale: כִּי നൽകുന്ന വിശദീകരണഭാവവും אַתָּה നൽകുന്ന ഊന്നലും മലയാളത്തിലെ ‘അറിയാമല്ലോ’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: ഞാൻ അങ്ങേക്കു ചെയ്ത സേവനം
  rationale: עבד എന്ന ഒരേ മൂലത്തിന്റെ നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ പൂർണമായി പുനരാവർത്തിക്കുമ്പോൾ അസ്വാഭാവികമാകുന്നതിനാൽ, ‘ചെയ്ത സേവനം’ എന്ന രൂപം അർത്ഥവും മാന്യമായ ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ലാബാനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ ബന്ധസൂചനയുടെ യഥാർഥ അനിശ്ചിതത്വം [a]യിൽ സംരക്ഷിച്ചു; עבד എന്ന മൂലത്തിന്റെ ആവർത്തനം [b]യിൽ രേഖപ്പെടുത്തി.
