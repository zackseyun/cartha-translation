translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആധുനികവും മാന്യവുമായ മലയാളം. ഹീബ്രുവിലെ നാമകരണ പദപ്രയോഗം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു; בָּנוֹת എന്നതിന്റെ സന്ദർഭോചിതമായ പൊതുവർത്ഥം ‘സ്ത്രീകൾ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
