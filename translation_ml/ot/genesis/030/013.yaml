  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: ml
  text: 'അപ്പോൾ ലേയാ പറഞ്ഞു: “ഞാൻ എത്ര സന്തോഷവതി! സ്ത്രീകൾ എന്നെ സന്തോഷവതി എന്നു വിളിക്കും.” അങ്ങനെ അവൾ അവന് ആശേർ[a] എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആശേർ” എന്ന പേര് ലേയാ ഉപയോഗിച്ച, “സന്തോഷവതി” എന്നും “സന്തോഷവതി എന്നു വിളിക്കും” എന്നും അർഥമുള്ള ഹീബ്രു പദങ്ങളുമായുള്ള പദപ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: ഞാൻ എത്ര സന്തോഷവതി!
  rationale: אֹשֶׁר എന്ന പദം സന്തോഷം, സൗഭാഗ്യം എന്നീ അർഥങ്ങൾ നൽകുന്നു. ഇവിടെ ലേയയുടെ ആഹ്ലാദപ്രകടനമായതിനാൽ സ്വാഭാവികമായ മലയാള വിസ്മയവാക്യമായി പരിഭാഷപ്പെടുത്തി; ഒന്നാംപുരുഷ സൂചനയും നിലനിർത്തി.
- source_word: אִשְּׁרוּנִי
  choice: എന്നെ സന്തോഷവതി എന്നു വിളിക്കും
  rationale: Piel രൂപത്തിലുള്ള אשר ഒരാളെ സന്തുഷ്ട/ഭാഗ്യവതി എന്നു പ്രഖ്യാപിക്കുക എന്ന അർഥം നൽകുന്നു. മുമ്പുള്ള ‘സന്തോഷവതി’യുമായും ആശേർ എന്ന പേരുമായുമുള്ള പദബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: בָּנוֹת
  choice: സ്ത്രീകൾ
  rationale: പദശഃ ‘പുത്രിമാർ’ എന്നാണെങ്കിലും, ഇവിടെ പൊതുവായി സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘സ്ത്രീകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: അങ്ങനെ അവൾ അവന് ആശേർ എന്നു പേരിട്ടു
  rationale: ഹീബ്രു നാമകരണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. അതിന്റെ അർഥബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
