  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: ml
  text: 'അപ്പോൾ റാഹേൽ പറഞ്ഞു: “ദൈവത്തിന്റെ മല്ലിടലുകളാൽ[a] ഞാൻ എന്റെ സഹോദരിയോടു മല്ലിട്ടു; ഞാൻ ജയിക്കുകയും ചെയ്തു.” അതുകൊണ്ട് അവൾ അവന് നഫ്താലി എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ദൈവത്തിന്റെ മല്ലിടലുകളാൽ.” ഈ പ്രയോഗത്തിന് “ദൈവികമായ മല്ലിടലുകളാൽ” എന്നോ, തീവ്രത സൂചിപ്പിക്കുന്ന രീതിയിൽ “അതിശക്തമായ മല്ലിടലുകളാൽ” എന്നോ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: ദൈവികമായ മല്ലിടലുകളാൽ
  rationale: എബ്രായ ഘടനയെ അടുത്തായി പിന്തുടരുകയും נפתל എന്ന ധാതുവിനും നഫ്താലി എന്ന പേരിനുമിടയിലെ പദപ്രയോഗബന്ധം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു. אֱלֹהִים ഇവിടെ ദൈവത്തെ നേരിട്ട് സൂചിപ്പിക്കാമെങ്കിലും അതിശക്തിയെയോ മഹത്ത്വത്തെയോ സൂചിപ്പിക്കുന്ന തീവ്രതാപ്രയോഗവുമാകാം; ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: נִפְתַּלְתִּי
  choice: ഞാൻ ... മല്ലിട്ടു
  rationale: പേരിടലിലേക്കു നയിക്കുന്ന എബ്രായ പദപ്രയോഗം നിലനിർത്താൻ ‘മല്ലിട്ടു’ എന്ന ദൃശ്യവും സ്വാഭാവികവുമായ ക്രിയ ഉപയോഗിച്ചു.
- source_word: עִם אֲחֹתִי
  choice: എന്റെ സഹോദരിയോടു
  rationale: עִם എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മത്സരാത്മകത ‘മല്ലിട്ടു’ എന്ന ക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: גַּם יָכֹלְתִּי
  choice: ഞാൻ ജയിക്കുകയും ചെയ്തു
  rationale: ഈ മത്സരസന്ദർഭത്തിൽ יכל വിജയിക്കുകയോ മേൽക്കൈ നേടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; ‘ജയിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: അതുകൊണ്ട് അവൾ അവന് നഫ്താലി എന്നു പേരിട്ടു
  rationale: എബ്രായ പേരിടൽസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും മുൻവാക്യത്തിലെ വിശദീകരണവുമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: נַפְתּוּלֵי אֱלֹהִים എന്ന പ്രയോഗത്തിൽ ദൈവത്തെ നേരിട്ട് പരാമർശിക്കുന്നുണ്ടോ, അതോ אֱלֹהִים തീവ്രതാസൂചകമാണോ
  choice: പ്രധാന പാഠത്തിൽ ‘ദൈവികമായ മല്ലിടലുകളാൽ’
  alternative: ‘അതിശക്തമായ മല്ലിടലുകളാൽ’ / ‘ദൈവത്തിന്റെ മല്ലിടലുകളാൽ’
  rationale: മൂലത്തിലെ ദൈവസംബന്ധിയായ പദം പ്രധാന പാഠത്തിൽ മറയ്ക്കാതെ സൂക്ഷിക്കുന്നു; അതേസമയം ഈ ദുഷ്കരമായ പ്രയോഗത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, അതുവഴി ഒരു വ്യാഖ്യാനം നിർബന്ധിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മല്ലിടലുകൾ/മല്ലിട്ടു’ എന്ന ആവർത്തനം എബ്രായത്തിലെ പദപ്രയോഗവും നഫ്താലി എന്ന പേരുമായുള്ള ബന്ധവും പ്രതിഫലിപ്പിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
