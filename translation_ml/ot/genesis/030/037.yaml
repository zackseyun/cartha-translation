translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മലയാളവായനക്കാർക്ക് അധികം പരിചിതമല്ലാത്ത വൃക്ഷനാമമായ ‘പോപ്ലാർ’ നിലനിർത്തി അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു. ബദാം, പ്ലെയ്ൻ മരം എന്നീ കൂടുതൽ സാധ്യതയുള്ള സസ്യതിരിച്ചറിയലുകൾ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
