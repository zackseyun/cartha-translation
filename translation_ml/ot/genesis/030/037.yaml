source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֣/וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְ/ל֣וּז וְ/עֶרְמ֑וֹן וַ/יְפַצֵּ֤ל בָּ/הֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַ/לָּבָ֔ן אֲשֶׁ֖ר עַל הַ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: ml
  text: പിന്നെ യാക്കോബ് പച്ചയായ പോപ്ലാർ[a] മരത്തിന്റെയും ബദാം[b] മരത്തിന്റെയും പ്ലെയ്ൻ[c] മരത്തിന്റെയും വടികൾ എടുത്തു. അവയിൽ വെളുത്ത വരകൾ ഉണ്ടാകുന്നവിധം തൊലി ഉരിഞ്ഞ്, വടികളിലെ വെളുത്ത ഭാഗം പുറത്തുകാണിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പച്ചയായ സ്റ്റോറാക്സ്’; לִבְנֶה ഏത് വൃക്ഷമാണെന്നത് ഉറപ്പില്ലെങ്കിലും ‘പോപ്ലാർ’ എന്ന പരിഭാഷ സാധാരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: പഴയ ഇംഗ്ലീഷ് പരിഭാഷകളിൽ പലപ്പോഴും ‘ഹേസൽ’ എന്നു കാണുന്നു; എന്നാൽ לוּז എന്നതിന് ‘ബദാം’ എന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: c
    text: പഴയ ഇംഗ്ലീഷ് പരിഭാഷകളിൽ പലപ്പോഴും ‘ചെസ്റ്റ്നട്ട് മരം’ എന്നു കാണുന്നു; എന്നാൽ עֶרְמוֹן എന്നതിന് ‘പ്ലെയ്ൻ മരം’ എന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: കൊമ്പുകൾ
  rationale: ഇവിടെ മുറിച്ചെടുത്ത മരക്കൊമ്പുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വടികൾ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് സ്വാഭാവികം.
- source_word: לִבְנֶה לַח
  choice: പച്ചയായ പോപ്ലാർ
  rationale: לַח പുതുതായി മുറിച്ചതും ഉണങ്ങാത്തതുമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; לִבְנֶהയുടെ കൃത്യമായ വൃക്ഷതിരിച്ചറിയൽ അനിശ്ചിതമാണെങ്കിലും ‘പോപ്ലാർ’ സാധാരണമായ തിരിച്ചറിയലാണ്.
- source_word: לוּז
  choice: ബദാം
  rationale: പഴയ പരിഭാഷകളിലെ ‘ഹേസൽ’ എന്ന തിരിച്ചറിയലിനെക്കാൾ ‘ബദാം’ എന്നതാണ് എബ്രായപദത്തിന് കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: עֶרְמוֹן
  choice: പ്ലെയ്ൻ മരം
  rationale: പഴയ ‘ചെസ്റ്റ്നട്ട്’ തിരിച്ചറിയലിനെക്കാൾ ഈ പദം പ്ലെയ്ൻ മരത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.
- source_word: וַיְפַצֵּל
  choice: തൊലി ... ചീന്തിക്കളഞ്ഞു
  rationale: കൊമ്പിന്റെ വെളുത്ത ഉൾഭാഗം കാണത്തക്കവിധം തൊലി നീക്കുന്നതാണ് സന്ദർഭത്തിലെ പ്രവൃത്തി.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: വെള്ള വരകളായി
  rationale: തൊലി ഭാഗികമായി നീക്കിയതിലൂടെ ഉണ്ടായ ദൃശ്യമായ വെളുത്ത അടയാളങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: വെളുത്ത ഭാഗം വെളിപ്പെടുത്തി
  rationale: വെളുത്ത ഉൾമരം മറനീക്കി ദൃശ്യമാക്കുക എന്ന പ്രവൃത്തി-ഫലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: കൊമ്പുകളിലെ
  rationale: എബ്രായത്തിലെ עַל അടുത്തായി ‘മേൽ’ എന്നാണെങ്കിലും, തൊലി നീക്കുമ്പോൾ തെളിയുന്ന വെളുത്ത ഭാഗത്തെ മലയാളത്തിൽ ‘കൊമ്പുകളിലെ’ എന്നു പറയുന്നത് അർത്ഥവത്തും സ്വാഭാവികവുമാണ്.
