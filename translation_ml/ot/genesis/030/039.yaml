source:
  edition: WLC
  text: וַ/יֶּחֱמ֥וּ הַ/צֹּ֖אן אֶל הַ/מַּקְל֑וֹת וַ/תֵּלַ֣דְןָ הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/טְלֻאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: ml
  text: അങ്ങനെ ആട്ടിൻപറ്റം വടികളുടെ മുമ്പിൽവെച്ച് ഇണചേർന്നു; ആട്ടിൻപറ്റം വരകളുള്ളവയും[a] ചെറുപുള്ളികളുള്ളവയും[b] പാടുകളുള്ളവയും ആയ കുഞ്ഞുങ്ങളെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വരകളുള്ളവ’ എന്നതിന് ‘പട്ടകളുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗത പരിഭാഷകളിൽ ‘വളയവരകളുള്ളവ’ എന്ന ആശയവും കാണാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ചെറുപുള്ളികളുള്ളവ’ (נְקֻדִּים), ‘പാടുകളുള്ളവ’ (טְלֻאִים) എന്നീ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ഏകദേശമാണ്; രണ്ടാമത്തേത് ‘ചിതറിയ പാടുകളുള്ളവ’, ‘വലിയ പാടുകളുള്ളവ’, അല്ലെങ്കിൽ ‘പലനിറപ്പാടുകളുള്ളവ’ എന്നിങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: ഇണചേർന്നു
  rationale: יחם എന്ന ക്രിയയുടെ അടിസ്ഥാന ആശയം ചൂടിലാകുക എന്നതാണെങ്കിലും, മൃഗങ്ങളുടെ പ്രജനനസന്ദർഭത്തിൽ ഇണചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻപറ്റം
  rationale: צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമൂഹനാമമാണ്. ‘ആട്ടിൻപറ്റം’ അതിന്റെ കൂട്ടാർഥം നിലനിർത്തുന്നു; എബ്രായത്തിലെ ആവർത്തനവും പരിഭാഷയിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: אֶל הַמַּקְלוֹת
  choice: വടികളുടെ മുമ്പിൽവെച്ച്
  rationale: אֶל സാധാരണയായി ‘നേരെ/അടുത്തേക്ക്’ എന്ന ദിശാർഥം നൽകുന്നു; ചുറ്റുപാടിലെ ദൃശ്യപ്രജനനക്രമത്തിൽ വടികളുടെ മുമ്പിൽ എന്ന സാഹചര്യാർഥം യോജിക്കുന്നു.
- source_word: וַתֵּלַדְןָ
  choice: കുഞ്ഞുങ്ങളെ പ്രസവിച്ചു
  rationale: ילד പ്രസവിക്കുക എന്നർഥമുള്ളതാണ്. മൂലപാഠത്തിൽ സന്തതിയെ സൂചിപ്പിക്കുന്ന നാമം തുറന്നുപറയാത്തതിനാൽ, മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘കുഞ്ഞുങ്ങൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: עֲקֻדִּים
  choice: വരകളുള്ളവ
  rationale: ഈ പദം വരകളോ പട്ടകളോ പോലുള്ള അടയാളങ്ങളുള്ള മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘വരകളുള്ളവ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: נְקֻדִּים
  choice: ചെറുപുള്ളികളുള്ളവ
  rationale: ചെറിയ പുള്ളികളോ കുത്തുകളോ ഉള്ള രൂപത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന טְלֻאִים എന്ന പദത്തിൽനിന്നുള്ള ഏകദേശ വ്യത്യാസം വ്യക്തമാക്കാൻ ‘ചെറുപുള്ളികൾ’ ഉപയോഗിച്ചു.
- source_word: וּטְלֻאִים
  choice: മറുകുകളുള്ളവ
  rationale: വലുതോ ക്രമരഹിതമോ ആയ പാടുകൾ/മറുകുകൾ ഉള്ള രൂപത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘മറുകുകളുള്ളവ’ മുൻപത്തെ ‘ചെറുപുള്ളികളുള്ളവ’ എന്നതിൽനിന്ന് അർഥവ്യത്യാസം സൂചിപ്പിക്കുന്നു.
