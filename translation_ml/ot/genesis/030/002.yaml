source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: ml
  text: 'അപ്പോൾ യാക്കോബ് റാഹേലിനോടു കോപിച്ചു[a]. അവൻ പറഞ്ഞു: “നിന്നിൽനിന്ന് ഗർഭഫലം[b] തടഞ്ഞുവെച്ച ദൈവത്തിന്റെ സ്ഥാനത്ത് ഞാൻ ആണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “യാക്കോബിന്റെ കോപം റാഹേലിനെതിരെ ജ്വലിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: “ഗർഭഫലം” എന്ന എബ്രായ പ്രയോഗം മക്കളെയോ സന്തതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: കോപിച്ചു
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘കോപം ജ്വലിച്ചു’ എന്നാണെങ്കിലും, കോപം ശക്തമായി ഉയർന്നുവന്നുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കോപിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു; കൂടുതൽ രൂപാനുസൃതമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּרָחֵל
  choice: റാഹേലിനോടു
  rationale: കോപത്തിന്റെ ലക്ഷ്യം റാഹേൽ ആണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: ദൈവത്തിന്റെ സ്ഥാനത്താണോ ഞാൻ?
  rationale: תַחַת ഇവിടെ ദൈവത്തിനു പകരമായി അവിടുത്തെ സ്ഥാനമോ അധികാരമോ ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്റെ സ്ഥാനത്ത്’ ഈ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: നിനക്കു ... തടഞ്ഞുവെച്ച
  rationale: റാഹേലിനു സന്തതി ലഭിക്കാതിരുന്നതിന്റെ പ്രവർത്തകത്വം ദൈവത്തിനാണെന്ന വാക്യത്തിലെ നേരിട്ടുള്ള അവകാശവാദം മയപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- source_word: פְּרִי בָטֶן
  choice: ഗർഭഫലം
  rationale: ‘ഗർഭത്തിന്റെ ഫലം’ എന്ന എബ്രായ രൂപകത്തെ സംക്ഷിപ്തവും മാന്യവും ബൈബിൾഭാഷയ്ക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വന്ധ്യതയിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: റാഹേലിനു ഗർഭഫലം ലഭിക്കാതിരുന്നത് ദൈവം തടഞ്ഞുവെച്ചതാണെന്ന് യാക്കോബ് പറയുന്നു.
  alternative: യാക്കോബ് ദൈവിക പ്രവർത്തകത്വം ഉറപ്പിക്കാതെ വെറും അലങ്കാരപ്രശ്നം ചോദിക്കുന്നു.
  rationale: אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן എന്ന ബന്ധവാക്യം ഗർഭഫലം തടഞ്ഞുവെച്ചത് ദൈവമാണെന്ന് നേരിട്ട് തിരിച്ചറിയിക്കുന്നു; പരിഭാഷ ഈ സംഘർഷഭരിതമായ അവകാശവാദം മയപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവത്തിന്റെ സ്ഥാനത്തെക്കുറിച്ചുള്ള അലങ്കാരപ്രശ്നവും ഗർഭഫലം തടഞ്ഞുവെച്ചത് ദൈവമാണെന്ന മൂലപാഠത്തിലെ പ്രസ്താവനയും നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ദൈവത്തിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് פְּרִי בָטֶן എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ [b] ‘ഗർഭഫലം’ എന്നതിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
