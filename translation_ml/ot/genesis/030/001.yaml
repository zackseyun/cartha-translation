source:
  edition: WLC
  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: ml
  text: യാക്കോബിന് താൻ മക്കളെ[a] പ്രസവിച്ചിട്ടില്ലെന്ന് റാഹേൽ കണ്ടപ്പോൾ, അവൾ തന്റെ സഹോദരിയോട് അസൂയപ്പെട്ടു. അവൾ യാക്കോബിനോട്, “എനിക്ക് മക്കളെ തരൂ; ഇല്ലെങ്കിൽ ഞാൻ മരിക്കും!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പുത്രന്മാരെ’; ഇവിടെ സന്തതിയെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കളെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: യാക്കോബിന് താൻ മക്കളെ പ്രസവിച്ചിട്ടില്ലെന്ന് റാഹേൽ കണ്ടപ്പോൾ
  rationale: സ്ത്രീയെ കർത്താവാക്കി വരുന്ന יָלַד എന്ന ക്രിയയുടെ ‘പ്രസവിക്കുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു. לְיַעֲקֹב എന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘യാക്കോബിന്’ എന്നു നൽകിയിരിക്കുന്നു. തുടർന്നുള്ള വികാരത്തിനുള്ള സമയ-കാരണ പശ്ചാത്തലം വാവ്-തുടർച്ചയോടുകൂടിയ വാക്യക്രമത്തിൽനിന്ന് ‘കണ്ടപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: അവൾ തന്റെ സഹോദരിയോട് അസൂയപ്പെട്ടു
  rationale: קנא ഇവിടെ സഹോദരിയുടെ സന്താനലാഭത്തോടുള്ള അസൂയയെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ റാഹേൽ എന്ന പേരിന്റെ ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ വ്യക്തമായ സർവനാമം ഉപയോഗിച്ചു; ‘സഹോദരി’ എന്ന ബന്ധപദം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: הָבָה לִּי בָנִים
  choice: എനിക്ക് മക്കളെ തരൂ
  rationale: ആവശ്യത്തിന്റെ നേരിട്ടുള്ളതും ആജ്ഞാസ്വരവും ‘തരൂ’ നിലനിർത്തുന്നു. בָנִים രൂപപരമായി ‘പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഈ സന്താനപ്രാപ്തിസന്ദർഭത്തിൽ പൊതുവായി സന്തതിയെ സൂചിപ്പിക്കാവുന്നതിനാൽ സ്വാഭാവികമായ ‘മക്കൾ’ തെരഞ്ഞെടുത്തു; രൂപപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  choice: ഇല്ലെങ്കിൽ ഞാൻ മരിക്കും
  rationale: וְאִם אַיִן അവതരിപ്പിക്കുന്ന കടുത്ത ബദലിനെ ‘ഇല്ലെങ്കിൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. מֵתָה אָנֹכִי എന്നതിന്റെ തീവ്രവും നേരിട്ടുമുള്ള പ്രസ്താവനയെ മാനസികമായി വിശദീകരിക്കാതെ ‘ഞാൻ മരിക്കും’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: മക്കളെ നൽകാനുള്ള അധികാരം യാക്കോബിനോട് ആവശ്യപ്പെടുന്ന റാഹേലിന്റെ വാക്കുകൾ
  choice: “എനിക്ക് മക്കളെ തരൂ” എന്ന നേരിട്ടുള്ള ആവശ്യം അതേപടി നിലനിർത്തി.
  alternative: റാഹേൽ ഒരു മകനെ ലഭിക്കണമെന്ന ആഗ്രഹം മാത്രം വിശദീകരിക്കുന്ന വിധത്തിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം റാഹേലിന്റെ നിരാശാഭരിതമായ വാക്കുകളാണ് രേഖപ്പെടുത്തുന്നത്; അവയുടെ ദൈവശാസ്ത്രപരമായ ശരിതെറ്റുകൾ വിവർത്തനം സ്വയം തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. റാഹേലിന്റെ അസൂയയും നിരാശയും മൃദൂകരിക്കാതെ, അതേസമയം അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ അവതരിപ്പിച്ചു.
