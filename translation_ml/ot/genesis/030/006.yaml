id: GEN.30.6
reference: Genesis 30:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: ml
  text: 'അപ്പോൾ റാഹേൽ പറഞ്ഞു: “ദൈവം എന്റെ കാര്യത്തിൽ ന്യായം വിധിച്ചിരിക്കുന്നു; എന്റെ സ്വരം കൂടി കേൾക്കുകയും എനിക്ക് ഒരു മകനെ നൽകുകയും ചെയ്തിരിക്കുന്നു.” അതുകൊണ്ട് അവൾ അവന് ദാൻ എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּנַנִּי
  choice: എന്റെ കാര്യത്തിൽ ന്യായം വിധിച്ചു
  rationale: ക്രിയയുടെ ന്യായവിധിസംബന്ധമായ അർഥവും റാഹേലിനുവേണ്ടിയുള്ള ദൈവിക നടപടിയുടെ സന്ദർഭവും നിലനിർത്തുന്നു; ‘എന്നെ കുറ്റം വിധിച്ചു’ എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുകയും ദാൻ എന്ന പേരുമായുള്ള പദപ്രയോഗബന്ധം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനമായ ‘ദൈവം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שָׁמַע בְּקֹלִי
  choice: എന്റെ സ്വരം കേട്ട്
  rationale: ‘എന്റെ സ്വരം’ എന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ കാരണ-തുടർച്ച നൽകുന്നു.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: എനിക്ക് ഒരു മകനെ തന്നിരിക്കുന്നു
  rationale: בן എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്തി, ദൈവത്തിന്റെ പ്രവർത്തനഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന വാക്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: പേരിടലിന്റെ കാരണം അവതരിപ്പിക്കുന്ന സാധാരണ അനുമാനസൂചക പ്രയോഗം.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: അവന് ദാൻ എന്നു പേരിട്ടു
  rationale: എബ്രായ നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: דָּן
  choice: ദാൻ
  rationale: എബ്രായ പേരിന്റെ അംഗീകൃത മലയാള ലിപ്യന്തരണം; דין എന്ന ‘വിധിക്കുക’ ധാതുവുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: റാഹേലിനെ സംബന്ധിച്ച ദൈവിക ന്യായവിധിയുടെ സ്വഭാവം
  choice: ദൈവം എന്റെ കാര്യത്തിൽ ന്യായം വിധിച്ചു
  alternative: ദൈവം എന്നെ വിധിച്ചു; ദൈവം എനിക്ക് നീതി നൽകി
  rationale: മൂലപാഠത്തിലെ ന്യായപരമായ രൂപകം സംരക്ഷിക്കുമ്പോഴും അത് ശിക്ഷാവിധിയാണെന്നോ സാങ്കേതികമായ ദൈവശാസ്ത്രപരമായ നീതീകരണമാണെന്നോ നിർണ്ണയിക്കുന്നില്ല. സന്ദർഭത്തിൽ ദൈവം റാഹേലിന്റെ അപേക്ഷ പരിഗണിച്ച് അവൾക്കനുകൂലമായി പ്രവർത്തിച്ചുവെന്ന ഭാവം നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നാമകരണത്തിലെ പദപ്രയോഗം നഷ്ടപ്പെടാതിരിക്കാൻ പ്രധാനവാചകത്തിൽ ന്യായവിധിയുടെ ഭാഷയും [a] അടിക്കുറിപ്പും ചേർത്തിരിക്കുന്നു.
