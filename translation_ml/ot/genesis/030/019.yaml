source:
  edition: WLC
  text: וַ/תַּ֤הַר עוֹד֙ לֵאָ֔ה וַ/תֵּ֥לֶד בֵּן שִׁשִּׁ֖י לְּ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/019.yaml
  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: ml
  text: ലേയാ വീണ്ടും ഗർഭം ധരിച്ച് യാക്കോബിന് ആറാമത്തെ മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ച്
  rationale: ഹീബ്രു הרה എന്ന ക്രിയ ഇവിടെ ഗർഭം ധരിക്കുക എന്ന അർഥത്തിലാണ്. ആഖ്യാനത്തിന്റെ ഒഴുക്ക് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: ഈ ആഖ്യാനക്രമത്തിൽ ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീണ്ടും’ എന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ അർഥം പ്രസവിക്കുക എന്നതാണ്; ആധുനിക മലയാളത്തിൽ നേരിട്ടും മാന്യവുമായ പ്രയോഗം.
- source_word: בֵּן
  choice: മകനെ
  rationale: בֵּן എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘മകൻ’ എന്നാണ്; വാക്യത്തിൽ കർമരൂപമായ ‘മകനെ’ ഉപയോഗിച്ചു.
- source_word: שִׁשִּׁי
  choice: ആറാമത്തെ
  rationale: ക്രമസംഖ്യയെ കൃത്യമായി സൂചിപ്പിക്കുകയും ലേയാ യാക്കോബിന് പ്രസവിച്ച പുത്രന്മാരുടെ ക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിന്
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ബന്ധപരമായ അർഥം മലയാളത്തിൽ ‘യാക്കോബിന് ... പ്രസവിച്ചു’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ജനനാഖ്യാന ശൈലി. മൂലപാഠത്തിലെ സംഭവക്രമവും ബന്ധസൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
