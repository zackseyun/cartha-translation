    rationale: എബ്രായ צֹאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘ആടുകളുടെ കൂട്ടം’ മലയാളത്തിൽ കൂടുതൽ ഉൾക്കൊള്ളുന്നതാണ്.
