  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: ml
  text: അവൻ തൊലിയുരിച്ച വടികൾ, ആടുകളുടെ കൂട്ടം വെള്ളം കുടിക്കാൻ വന്നിരുന്ന തൊട്ടികളിൽ, വെള്ളം കുടിക്കാനുള്ള ചാലുകളിൽ, ആടുകളുടെ കൂട്ടത്തിന്റെ മുമ്പിൽ വെച്ചു; ആടുകൾ വെള്ളം കുടിക്കാൻ വന്നപ്പോൾ അവയ്ക്ക് മദം വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവ ഇണചേർന്നു.” എബ്രായ ക്രിയ കൂടുതൽ അക്ഷരാർഥത്തിൽ മൃഗങ്ങൾക്ക് മദം വന്നതിനെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ഇണചേരൽ അതിൽ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: വെച്ചു
  rationale: വസ്തുക്കളെ ഒരു നിർദിഷ്ട സ്ഥാനത്ത് സ്ഥാപിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּקְלוֹת
  choice: വടികൾ
  rationale: മുൻവാക്യത്തിൽ യാക്കോബ് ഒരുക്കിയ ശാഖകളെയോ കമ്പുകളെയോ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: אֲשֶׁר פִּצֵּל
  choice: തൊലിയുരിച്ച
  rationale: പട്ടകൾ തെളിയാൻ മരത്തൊലി നീക്കിയ പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּרֳהָטִים
  choice: തൊട്ടികളിൽ
  rationale: മൃഗങ്ങൾക്ക് വെള്ളം കൊടുക്കുന്ന തൊട്ടികളെയോ ചാലുപോലുള്ള സംവിധാനങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: בְּשִׁקֲתוֹת הַמָּיִם
  choice: വെള്ളം കുടിക്കാനുള്ള ചാലുകളിൽ
  rationale: മുൻപുള്ള സ്ഥാനപദത്തോട് അർത്ഥത്തിൽ ചേർന്നുനിൽക്കുന്ന രണ്ടാമത്തെ എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: הַצֹּאן
  choice: ആട്ടിൻകൂട്ടം
  rationale: ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְנֹכַח הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തിന്റെ മുമ്പിൽ
  rationale: മൃഗങ്ങൾക്ക് നേരെ, അവയുടെ കൺമുമ്പിൽ എന്ന സ്ഥലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּחַמְנָה
  choice: മദിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ ‘ചൂടുപിടിക്കുക/ഇണചേരാനുള്ള മദം വരുക’ എന്ന അർത്ഥം നിലനിർത്തുകയും ഇണചേരൽ സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: വെള്ളം കുടിക്കാൻ വന്നപ്പോൾ
  rationale: ഇൻഫിനിറ്റീവ് ഘടനയിലെ കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
