  to: അവൻ തൊലിയുരിച്ച വടികൾ, ആടുകളുടെ കൂട്ടം വെള്ളം കുടിക്കാൻ വന്നിരുന്ന തൊട്ടികളിൽ, വെള്ളം കുടിക്കാനുള്ള ചാലുകളിൽ, ആടുകളുടെ കൂട്ടത്തിന്റെ മുമ്പിൽ വെച്ചു; ആടുകൾ വെള്ളം കുടിക്കാൻ വന്നപ്പോൾ അവയ്ക്ക് മദം വന്നു.[a]
  rationale: കൂട്ടപ്പേരിന്റെ വ്യാപ്തി നിലനിർത്താൻ ‘ആട്ടിൻകൂട്ടം’ ‘ആടുകളുടെ കൂട്ടം’ എന്നാക്കി. അവസാനവാക്യത്തിൽ കർത്താവിനെ വ്യക്തമായി പറഞ്ഞും ‘മദം വന്നു’ എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചും എബ്രായ ക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭാനുസൃതമായ ഇണചേരൽ സൂചനയും സംരക്ഷിച്ചു. സ്ഥലസൂചനകളിലെ എബ്രായ ഇരട്ടപ്രയോഗം മാറ്റിയിട്ടില്ല.
