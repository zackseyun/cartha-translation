  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ രണ്ട് ബന്ധപ്പെട്ട ജലസ്ഥലപദങ്ങളും ആട്ടിൻകൂട്ടം എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു; അവസാന ക്രിയയുടെ യഥാർഥ അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
