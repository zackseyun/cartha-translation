translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആട്ടിൻകൂട്ടത്തിന്റെ മുഖങ്ങൾ’ എന്ന അക്ഷരാർഥം അസ്വാഭാവികമാകുന്നതിനാൽ അതിലെ ദൃശ്യഭാവം ‘അഭിമുഖമായി നിർത്തി’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തി. വിവരണത്തിലെ സാധ്യതയുള്ള സന്ദർഭപിരിമുറുക്കം മുഖ്യപാഠത്തിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിലൂടെ യഥാർഥ ഭാഷാപരമായ സാധ്യത അറിയിച്ചു.
