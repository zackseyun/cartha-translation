base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: ml
  text: യാക്കോബ് കുഞ്ഞാടുകളെ[a] വേർതിരിച്ചു. അവൻ ആട്ടിൻകൂട്ടത്തെ ലാബാന്റെ ആട്ടിൻകൂട്ടത്തിലെ[d] വരകളുള്ളവയുടെയും[b] എല്ലാ കടുംനിറമുള്ളവയുടെയും[c] നേരെ നിർത്തി. പിന്നെ അവൻ തനിക്കായി ആട്ടിൻകൂട്ടങ്ങളെ വേറിട്ടുനിർത്തി; അവയെ ലാബാന്റെ ആട്ടിൻകൂട്ടത്തോടു ചേർത്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുഞ്ഞാടുകൾ’ എന്നതിന് ‘ഇളം ആടുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വരകളുള്ളവ’ എന്നതിന് ‘പട്ടകളുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘കടുംനിറമുള്ളവ’ എന്നതിന് ‘തവിട്ടുനിറമുള്ളവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: എബ്രായപദപ്രയോഗം സാധാരണയായി ‘ലാബാന്റെ ആട്ടിൻകൂട്ടത്തിലെ’ എന്നാണ്. സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ചിലർ ഇതിനെ ‘ലാബാന്റെ ആട്ടിൻകൂട്ടത്തിൽനിന്നുള്ള’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: source_ambiguity
