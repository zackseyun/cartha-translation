- source_word: הַכְּשָׂבִים
  choice: കുഞ്ഞാടുകളെ
  rationale: ഈ പദം പൊതുവായി ആടുകളെയല്ല, കുഞ്ഞാടുകളെയോ ഇളം ആടുകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കുഞ്ഞാടുകൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הִפְרִיד
  choice: വേർതിരിച്ചു
  rationale: פרד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വേർപെടുത്തുക, വേർതിരിക്കുക എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: פְּנֵי הַצֹּאן
  choice: ആട്ടിൻകൂട്ടത്തെ അഭിമുഖമായി നിർത്തി
  rationale: അക്ഷരാർഥം ‘ആട്ടിൻകൂട്ടത്തിന്റെ മുഖങ്ങൾ’ എന്നാണ്. മലയാളത്തിൽ പ്രവർത്തിയുടെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായി പറയാൻ ‘അഭിമുഖമായി നിർത്തി’ എന്നു നൽകി.
- source_word: עָקֹד
  choice: വരകളുള്ളവ
  rationale: പട്ടകളോ വരകളോ ഉള്ള മൃഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘വരകളുള്ളവ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: כָל חוּם
  choice: കടുംനിറമുള്ളവയെല്ലാം
  rationale: חוּם ഇരുണ്ടതോ തവിട്ടുനിറമുള്ളതോ ആയ വർണം സൂചിപ്പിക്കാം. ‘കടുംനിറമുള്ളവ’ അനാവശ്യമായ വർണ്ണകൃത്യത ഒഴിവാക്കി ഉറവിടത്തിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּצֹאן לָבָן
  choice: ലാബാന്റെ ആട്ടിൻകൂട്ടത്തിലുള്ള
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ സാധാരണ സ്ഥലസൂചക അർഥമായ ‘ഉള്ള/ഇടയിൽ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘നിന്നു ജനിച്ച’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: അവൻ തനിക്കായി ആട്ടിൻകൂട്ടങ്ങളെ വേറിട്ടുനിർത്തി
  rationale: שׁית എന്നതിലെ ‘വയ്ക്കുക/നിർത്തുക’ എന്ന ആശയവും לְבַדּוֹ എന്നതിലെ വേർതിരിവും ഉടമസ്ഥതാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: അവയെ ലാബാന്റെ ആട്ടിൻകൂട്ടത്തോടു ചേർത്തില്ല
  rationale: ഇവിടെ עַל കൂട്ടിച്ചേർക്കൽ അഥവാ സഹവാസം സൂചിപ്പിക്കുന്നതായി എടുത്തു; വേർതിരിച്ച കൂട്ടങ്ങളെ ലാബാന്റെ കൂട്ടവുമായി ചേർത്തില്ല എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
