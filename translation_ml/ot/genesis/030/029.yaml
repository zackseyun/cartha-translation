source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑י/ךָ וְ/אֵ֛ת אֲשֶׁר הָיָ֥ה מִקְנְ/ךָ֖ אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഞാൻ നിന്നെ എങ്ങനെ സേവിച്ചെന്നും നിന്റെ കന്നുകാലികൾ എന്റെ പക്കൽ എങ്ങനെയായിരുന്നെന്നും നിനക്കുതന്നെ അറിയാമല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ വിവരണത്തിലെ കർത്താവിനെയും കർമത്തെയും സൂചിപ്പിക്കുന്ന സർവനാമങ്ങൾ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവ യാക്കോബിനെയും ലാബാനെയും സൂചിപ്പിക്കുന്നു.
- source_word: אַתָּה יָדַעְתָּ
  choice: നിനക്കറിയാമല്ലോ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘-ല്ലോ’ പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: ഞാൻ നിന്നെ എങ്ങനെ സേവിച്ചെന്നും
  rationale: עבד എന്ന പദത്തിലെ അധീനസേവനത്തിന്റെയും തൊഴിൽ ചെയ്തതിന്റെയും ഭാവം ‘സേവിച്ചു’ നിലനിർത്തുന്നു.
- source_word: מִקְנְךָ
  choice: നിന്റെ കന്നുകാലികൾ
  rationale: വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന מִקְנֶה എന്ന സമാഹാരപദത്തിന് സാധാരണ മലയാളത്തിൽ വ്യക്തമായ തുല്യപ്രയോഗം.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: നിന്റെ കന്നുകാലികൾ എന്റെ പക്കൽ എങ്ങനെയായിരുന്നെന്നും
  rationale: ‘എന്നോടുകൂടെ ഉണ്ടായിരുന്നത്’ എന്ന അക്ഷരാർഥവും യാക്കോബിന്റെ പരിപാലനത്തിൽ അവയുടെ സ്ഥിതി എങ്ങനെയായിരുന്നു എന്ന സാധ്യതയുള്ള ആശയവും ഒരുമിച്ച് തുറന്നുവെക്കുന്നു; സമൃദ്ധിപ്പെട്ടുവെന്ന് മുഖ്യവാചകത്തിൽ നേരിട്ട് ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘നിനക്കറിയാമല്ലോ’ എന്നത് മൂലത്തിലെ സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു. സർവനാമങ്ങളുടെ സന്ദർഭാശ്രിതത്വവും കന്നുകാലികളുടെ അവസ്ഥയെക്കുറിച്ചുള്ള ഹീബ്രായ വാക്യത്തിന്റെ അർഥതുറവും നിലനിർത്തിയിരിക്കുന്നു.
