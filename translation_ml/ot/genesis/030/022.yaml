source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת רָחֵ֑ל וַ/יִּשְׁמַ֤ע אֵלֶ֨י/הָ֙ אֱלֹהִ֔ים וַ/יִּפְתַּ֖ח אֶת רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: ml
  text: അപ്പോൾ ദൈവം റാഹേലിനെ ഓർത്തു[a]. ദൈവം അവളുടെ വാക്കു കേട്ടു[b], അവളുടെ ഗർഭപാത്രം തുറന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘റാഹേലിനെ ശ്രദ്ധിച്ചു’ / ‘റാഹേലിനെ മനസ്സിൽ കരുതി.’ ഇവിടെ ‘ഓർത്തു’ എന്ന എബ്രായ ബൈബിൾപ്രയോഗം ദൈവം അവളെ മറന്നിരുന്നു എന്നല്ല, അവളോടുള്ള അനുകൂല ശ്രദ്ധ പ്രവർത്തിയിലേക്കു നയിച്ചു എന്നാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവളെ കേട്ടു’; അഥവാ, ‘അവളുടെ വാക്കു ചെവിക്കൊണ്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: ഓർത്തു
  rationale: זכר എന്ന എബ്രായ ക്രിയയുടെ ബൈബിൾസവിശേഷമായ പ്രയോഗം നിലനിർത്തുന്നു. ഇവിടെ ഇത് മറന്നുപോയ കാര്യം വീണ്ടും ഓർമവന്നുവെന്നതിലുപരി, അനുകൂലമായ ശ്രദ്ധ പ്രവർത്തിയിലേക്കു നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: എല്ലാ ക്രിയകളും ഏകവചനത്തിലായതിനാൽ ഇവിടെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת רָחֵל
  choice: റാഹേലിനെ
  rationale: אֶת നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്നു; רָחֵל എന്ന പേര് മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: അവളുടെ അപേക്ഷ കേട്ടു
  rationale: שׁמע + אֶל ശ്രദ്ധയോടെ കേൾക്കുകയും പ്രതികരിക്കുകയും ചെയ്യുക എന്ന ആശയം വഹിക്കാം. വാക്യസന്ദർഭത്തിൽ അവൾ ദൈവത്തോടു നടത്തിയ അപേക്ഷയാണ് ഉദ്ദേശ്യമെന്നത് സ്വാഭാവികമാക്കുന്നു; എന്നാൽ 'ഉത്തരം നൽകി' എന്നു പറഞ്ഞ് ഫലം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: וַיִּפְתַּח
  choice: തുറന്നു
  rationale: פתח എന്ന മൂർത്തമായ ക്രിയയെ നേരിട്ട് നിലനിർത്തി എബ്രായ ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: רַחְמָהּ
  choice: അവളുടെ ഗർഭപാത്രം
  rationale: רֶחֶם എന്നത് ഗർഭപാത്രം എന്നാണ്; ഗർഭധാരണത്തിന് പ്രാപ്തയാക്കി എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: ആദ്യത്തെ waw-consecutive കഥയുടെ തുടർച്ചയും കാലക്രമത്തിലുള്ള മുന്നേറ്റവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ 'അപ്പോൾ' സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ദൈവം റാഹേലിനെ 'ഓർത്തു' എന്ന മനുഷ്യസദൃശ ഭാഷ
  choice: '''ഓർത്തു'' എന്ന ബൈബിൾ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.'
  alternative: '''റാഹേലിനെ ശ്രദ്ധിച്ചു'' / ''റാഹേലിനെ മനസ്സിൽ കരുതി'''
  rationale: എബ്രായം ദൈവം മുമ്പ് റാഹേലിനെ മറന്നിരുന്നു എന്ന് നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. ദൈവത്തിന്റെ അനുകൂല ശ്രദ്ധ പ്രവർത്തിയിലേക്കു നയിച്ചതാണ് ആശയം; തുടർന്നുള്ള കേൾക്കലും ഗർഭപാത്രം തുറക്കലും അത് വ്യക്തമാക്കുന്നു.
- issue: ദൈവം അവളെ 'കേട്ടു' എന്നതിന്റെ കൃത്യമായ അർത്ഥം
  choice: സന്ദർഭസൂചന വ്യക്തമാക്കി 'അവളുടെ അപേക്ഷ കേട്ടു' എന്നു നൽകി.
  alternative: '''അവളെ കേട്ടു'' / ''അവളുടെ വാക്കു ചെവിക്കൊണ്ടു'''
  rationale: മൂലത്തിലെ אֵלֶיהָ അക്ഷരാർഥത്തിൽ 'അവളിലേക്കു/അവളെ' എന്ന ബന്ധമാണ് നൽകുന്നത്. ഇവിടെ ദൈവത്തോടുള്ള റാഹേലിന്റെ അപേക്ഷയാണ് സ്വാഭാവിക സന്ദർഭം; എന്നിരുന്നാലും 'ഉത്തരം നൽകി' എന്നു പരിഭാഷപ്പെടുത്തി ദൈവിക പ്രതികരണത്തിന്റെ സ്വഭാവം അമിതമായി നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. 'ഓർത്തു', 'ഗർഭപാത്രം തുറന്നു' എന്നീ ബൈബിൾസവിശേഷ പ്രയോഗങ്ങൾ സംരക്ഷിച്ചു; അപരിചിതത്വം കുറയ്ക്കാൻ അടിക്കുറിപ്പുകൾ ചേർത്തു.
