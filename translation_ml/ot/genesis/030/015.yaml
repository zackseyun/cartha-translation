  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ֗/הּ הַ/מְעַט֙ קַחְתֵּ֣/ךְ אֶת אִישִׁ֔/י וְ/לָ/קַ֕חַת גַּ֥ם אֶת דּוּדָאֵ֖י בְּנִ֑/י וַ/תֹּ֣אמֶר רָחֵ֗ל לָ/כֵן֙ יִשְׁכַּ֤ב עִמָּ/ךְ֙ הַ/לַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ml
  text: 'എന്നാൽ അവൾ അവളോടു പറഞ്ഞു: “നീ എന്റെ ഭർത്താവിനെ എടുത്തതു ചെറിയ കാര്യമാണോ? എന്റെ മകന്റെ മാൻഡ്രേക്കുകളും കൂടി എടുക്കണമെന്നാണോ?” റാഹേൽ പറഞ്ഞു: “എങ്കിൽ നിന്റെ മകന്റെ മാൻഡ്രേക്കുകൾക്കു പകരമായി ഇന്ന് രാത്രി അവൻ നിന്നോടുകൂടെ ശയിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: ചെറിയ കാര്യമാണോ?
  rationale: ഇത് കുറ്റപ്പെടുത്തൽ നിറഞ്ഞ അലങ്കാരചോദ്യമാണ്; ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: നീ എന്റെ ഭർത്താവിനെ എടുത്തതു
  rationale: קח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ലേയയുടെ ആരോപണം വിശദീകരിച്ചോ മയപ്പെടുത്തിയോ ഇല്ല.
- source_word: דּוּדָאֵי
  choice: മാൻഡ്രേക്കുകൾ
  rationale: സസ്യനാമം തിരിച്ചറിയുന്ന പതിവ് പരിഭാഷ സ്വീകരിക്കുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത പ്രജനനഫലത്തെ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: അവൻ നിന്നോടുകൂടെ ശയിക്കട്ടെ
  rationale: ലൈംഗികസന്ദർഭം മാന്യമായും വ്യക്തമായും അറിയിക്കുന്ന, ഉറവിടത്തോട് ചേർന്ന പ്രയോഗം.
- source_word: תַּחַת
  choice: പകരമായി
  rationale: ഇവിടെ കൈമാറ്റമോ പ്രതിഫലമോ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ലേയയുടെ ‘എന്റെ ഭർത്താവിനെ എടുത്തു’ എന്ന ആരോപണത്തിന്റെ വ്യാഖ്യാനം
  choice: ആരോപണം അതേപടി നിലനിർത്തി
  alternative: റാഹേൽ യാക്കോബിന്റെ സ്നേഹമോ ദാമ്പത്യാവകാശമോ അപഹരിച്ചുവെന്ന് വിശദീകരിക്കുക
  rationale: വാക്യം ലേയയുടെ വാക്കുകൾ മാത്രം രേഖപ്പെടുത്തുന്നു; അതിന്റെ ചരിത്രപരമോ നൈതികമോ ആയ സാധുത പരിഭാഷകൻ തീർപ്പാക്കരുത്.
- issue: മാൻഡ്രേക്കുകളുടെ മതപരമോ പ്രജനനപരമോ ആയ പ്രാധാന്യം
  choice: മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം ചേർത്തില്ല
  alternative: ഗർഭധാരണസഹായിയായ ഫലം എന്ന് പരിഭാഷപ്പെടുത്തുക
  rationale: ഉറവിടം സസ്യത്തെ മാത്രമാണ് പേരിടുന്നത്; അതിന്റെ ഫലപ്രാപ്തിയെ അംഗീകരിക്കുകയോ നിഷേധിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. സ്ത്രീസർവനാമങ്ങളുടെ ഉറവിടപരമായ അസ്പഷ്ടത നിലനിർത്താൻ ആദ്യ വാക്യത്തിൽ ‘അവൾ അവളോടു’ ഉപയോഗിച്ചു; തുടർന്ന് റാഹേലിന്റെ പേര് ഉറവിടം പോലെ വ്യക്തമാക്കി. സംഭാഷണത്തിലെ കുറ്റപ്പെടുത്തൽഭാവവും കൈമാറ്റത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും മയപ്പെടുത്തിയിട്ടില്ല.
