  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: ml
  text: ഗോതമ്പുകൊയ്ത്തുകാലത്ത് രൂബേൻ വയലിൽ പോയി മാൻഡ്രേക്കുകൾ[a] കണ്ടെത്തി. അവൻ അവ തന്റെ അമ്മയായ ലേയയുടെ അടുക്കൽ കൊണ്ടുവന്നു. അപ്പോൾ റാഹേൽ ലേയയോട്, “നിന്റെ മകന്റെ മാൻഡ്രേക്കുകളിൽ കുറച്ച് ദയവായി എനിക്കു തരൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രേമപ്പഴങ്ങൾ’; דּוּדָאִים എന്ന ഹീബ്രുപദം പരമ്പരാഗതമായി മാൻഡ്രേക്ക് എന്നു തിരിച്ചറിയുന്ന ഒരു സസ്യത്തെ സൂചിപ്പിക്കുന്നു. ചുറ്റുമുള്ള ആഖ്യാനത്തിൽ ഇത് സന്താനലഭ്യതയുമായി ബന്ധപ്പെടുത്തി കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: ഗോതമ്പുകൊയ്ത്തുകാലത്ത്
  rationale: ഹീബ്രു പ്രയോഗം ഗോതമ്പിന്റെ വിളവെടുപ്പുകാലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സമയസന്ദർഭം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന സാധാരണ ക്രിയാരൂപം; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പുറപ്പെട്ടു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: דּוּדָאִים
  choice: മാൻഡ്രേക്ക് പഴങ്ങൾ
  rationale: പരമ്പരാഗതമായി മാൻഡ്രേക്ക് എന്നു തിരിച്ചറിയുന്ന സസ്യത്തിന്റെ ശേഖരിക്കാവുന്ന ഫലങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. സസ്യതിരിച്ചറിയലിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: കൃഷിസന്ദർഭത്തിൽ שָׂדֶה എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וַיָּבֵא אֹתָם
  choice: അവൻ അവ ... കൊണ്ടുവന്നു
  rationale: ഹിഫിൽ ക്രിയയുടെ ‘കൊണ്ടുവരുക’ എന്ന അർഥവും ബഹുവചന കർമവും സംരക്ഷിക്കുന്നു.
- source_word: אֶל לֵאָה אִמּוֹ
  choice: തന്റെ അമ്മയായ ലേയയുടെ അടുക്കൽ
  rationale: ലേയ രൂബേന്റെ അമ്മയാണെന്ന ബന്ധം വ്യക്തമായി, സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: תְּנִי נָא לִי
  choice: ദയവായി എനിക്കു തരൂ
  rationale: ആജ്ഞാരൂപത്തെയും נָא നൽകുന്ന വിനീതമായ അപേക്ഷാഭാവത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: നിന്റെ മകന്റെ മാൻഡ്രേക്ക് പഴങ്ങളിൽ കുറച്ച്
  rationale: מִן എന്നതിന്റെ അംശസൂചകമായ അർഥം ‘കുറച്ച്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ലേയയുടെ മകനോടുള്ള ഉടമസ്ഥബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
