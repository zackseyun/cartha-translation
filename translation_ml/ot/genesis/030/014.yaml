translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, മാന്യവും സ്വാഭാവികവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സസ്യത്തിന്റെ കൃത്യമായ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
