translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അടിമസ്ത്രീ’ എന്ന പദം പുരാതന സാമൂഹിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ അവതരിപ്പിക്കുന്നു; ആവശ്യമുള്ളിടത്ത് പാദക്കുറിപ്പ് മറ്റൊരു സാധുവായ വിവർത്തനം നൽകുന്നു.
