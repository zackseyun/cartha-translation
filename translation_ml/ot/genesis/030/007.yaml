id: GEN.30.7
reference: Genesis 30:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: ml
  text: റാഹേലിന്റെ അടിമസ്ത്രീയായ[a] ബിൽഹാ വീണ്ടും ഗർഭം ധരിച്ചു; അവൾ യാക്കോബിന് രണ്ടാമതൊരു മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാസിയായ” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം ഒരു സ്ത്രീ അടിമയെയോ താഴ്ന്ന സാമൂഹിക നിലയിലുള്ള സേവികയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ഗർഭം ധരിച്ചു
  rationale: הרה എന്ന ക്രിയ ഗർഭം ധരിക്കുക എന്ന അർഥമാണ് നൽകുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: עוֹד
  choice: വീണ്ടും
  rationale: ഈ ജനനവിവരണത്തിൽ עוֹד സംഭവം ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: യָלַד എന്ന ക്രിയയുടെ ഖാൽ രൂപം ഇവിടെ ഒരു മകനെ പ്രസവിച്ചു എന്ന അർഥം നൽകുന്നു.
- source_word: שִׁפְחַת
  choice: അടിമസ്ത്രീയായ
  rationale: שִׁפְחָה ഒരു സ്ത്രീ അടിമയെയോ താഴ്ന്ന സാമൂഹിക നിലയിലുള്ള ദാസിയെയോ സൂചിപ്പിക്കുന്നു. ‘അടിമസ്ത്രീ’ ബന്ധിതമായ സാമൂഹികപദവി മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: בֵּן שֵׁנִי
  choice: രണ്ടാമതൊരു മകനെ
  rationale: പദസമുച്ചയത്തിന്റെ അർഥം ‘രണ്ടാമത്തെ മകൻ’ എന്നാണ്; സന്ദർഭത്തിൽ ‘രണ്ടാമതൊരു മകനെ’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിന്
  rationale: לְ ഇവിടെ ബന്ധമോ പിതൃത്വമോ സൂചിപ്പിക്കുന്നു; ‘യാക്കോബിന് ... പ്രസവിച്ചു’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഘടനയും അർഥവും നിലനിർത്തുന്നു.
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: റാഹേലിന്റെ അടിമസ്ത്രീയായ ബിൽഹാ
  rationale: ബിൽഹായെ റാഹേലിനോടുള്ള അവളുടെ സാമൂഹികബന്ധംകൊണ്ട് തിരിച്ചറിയുന്ന മൂലപാഠത്തിലെ സമാനാധികരണഘടന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
