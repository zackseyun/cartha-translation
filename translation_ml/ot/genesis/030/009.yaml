id: GEN.30.9
reference: Genesis 30:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: ml
  text: ലേയാ തനിക്കു മക്കളെ പ്രസവിക്കുന്നത് നിലച്ചെന്ന് കണ്ടപ്പോൾ, അവൾ തന്റെ ദാസിയായ സില്പായെ എടുത്ത് യാക്കോബിനു ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; പിന്നാലെയുള്ള പ്രവൃത്തിയോടുള്ള കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഇവിടെ כִּי കാരണമല്ല, ലേയാ ഗ്രഹിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്.
- source_word: עָמְדָה מִלֶּדֶת
  choice: തനിക്കു മക്കളെ പ്രസവിക്കുന്നത് നിലച്ചു
  rationale: עמד + מן + ക്രിയാനാമം എന്ന പ്രയോഗം ഒരു പ്രവൃത്തി നിർത്തുക എന്ന അർഥം നൽകുന്നു. ילד എന്നതിന്റെ പ്രസവസന്ദർഭം ‘മക്കളെ പ്രസവിക്കുന്നത്’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שִׁפְחָתָהּ
  choice: തന്റെ ദാസിയായ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള കീഴാള ഗൃഹസേവിക/അടിമ എന്ന പദത്തിന്റെ ലിംഗവും ഗൃഹസ്ഥിതിയും ‘ദാസി’ സംക്ഷിപ്തമായും മാന്യമായും സൂചിപ്പിക്കുന്നു; പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: זִלְפָּה
  choice: സിൽപ
  rationale: എബ്രായ വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ശബ്ദലിപ്യന്തരണത്തോടെ നൽകിയിരിക്കുന്നു.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിനു
  rationale: ഈ ഘടനയിലെ ל എന്ന പരോക്ഷ കർമസൂചകത്തെ മലയാളത്തിലെ ദ്വിതീയാർഥ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: נתן ל... לאשה എന്നത് വിവാഹബന്ധത്തിലേക്കു നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; ‘ഭാര്യയായി’ അതിന്റെ ഔപചാരിക വിവാഹഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സിൽപയുടെ ഗൃഹസ്ഥിതിയും വിവാഹപദപ്രയോഗവും
  choice: שִׁפְחָה എന്നത് ‘ദാസി’ എന്നും לְאִשָּׁה എന്നത് ‘ഭാര്യയായി’ എന്നും പരിഭാഷപ്പെടുത്തി രണ്ടും നിലനിർത്തുന്നു.
  alternative: പരമ്പരാഗത ശൈലിയിൽ ‘ദാസി/പരിചാരിക’ എന്നു നൽകുക, അല്ലെങ്കിൽ അവളുടെ ദ്വിതീയ ഭാര്യാസ്ഥിതി സൂചിപ്പിക്കാൻ ‘വെപ്പാട്ടി’ എന്നു നൽകുക.
  rationale: എബ്രായപാഠം സിൽപയെ ലേയായുടെ שִׁפְחָה എന്നു വ്യക്തമാക്കുകയും അവളെ യാക്കോബിനു לְאִשָּׁה ആയി കൊടുത്തുവെന്ന് പറയുകയും ചെയ്യുന്നു. ഈ വാക്യത്തിൽ ഇല്ലാത്ത സാങ്കേതിക വിഭാഗമായ ‘വെപ്പാട്ടി’ ഇറക്കുമതി ചെയ്യാതെ, അവളുടെ കീഴാള ഗൃഹസ്ഥിതിയും ഔപചാരിക വിവാഹഭാഷയും ഒരുമിച്ചു സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രസവിക്കുന്നത് നിലച്ചു’ എന്ന പ്രയോഗം എബ്രായ ഇടിയത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പാഠത്തിൽ യഥാർത്ഥ ആശയദ്വന്ദ്വം ആവശ്യമായിടത്ത് മാത്രം അടിക്കുറിപ്പ് നൽകണമെന്നതിനാൽ ഇവിടെ അടിക്കുറിപ്പുകളില്ല.
