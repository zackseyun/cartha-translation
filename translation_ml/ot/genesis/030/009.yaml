    issue: The name “സിൽപ” omits the final vowel of זִלְפָּה.
    rationale: The Hebrew personal name ends in ה (-ah). Malayalam “സില്പാ” preserves this element and is the more recognizable biblical-name form; this is a small but safe fidelity correction.
