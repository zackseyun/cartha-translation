  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: ml
  text: 'ലേയാ പറഞ്ഞു: “ദൈവം എനിക്ക് നല്ലൊരു ദാനം നൽകിയിരിക്കുന്നു. ഈ പ്രാവശ്യം എന്റെ ഭർത്താവ് എന്നെ ആദരിക്കും[a], കാരണം ഞാൻ അദ്ദേഹത്തിന് ആറു പുത്രന്മാരെ പ്രസവിച്ചിരിക്കുന്നു.” അതുകൊണ്ട് അവൾ അവന് സെബൂലൂൻ എന്നു പേരിട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നോടൊപ്പം വസിക്കും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ അപൂർവമാണ്; അത് ‘സെബൂലൂൻ’ എന്ന പേരുമായി പദപ്രയോഗബന്ധം പുലർത്തുന്നു. ലേയയെ ആദരിക്കുക, അവളോടൊപ്പം വസിക്കുക അഥവാ അവളോടുകൂടെ തുടരുക എന്നീ ആശയങ്ങൾ ഇതിൽ ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: എനിക്ക് നല്ലൊരു സമ്മാനം സമ്മാനിച്ചിരിക്കുന്നു
  rationale: ക്രിയയുടെയും നാമത്തിന്റെയും ആവർത്തനത്തിലൂടെ എബ്രായത്തിലെ പദപ്രയോഗബന്ധം മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘നല്ലൊരു ദാനം നൽകിയിരിക്കുന്നു’ എന്നതിനെക്കാൾ നാമകരണസന്ദർഭത്തിലെ ശബ്ദ-അർത്ഥബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַפַּעַם
  choice: ഈ പ്രാവശ്യം
  rationale: ലേയയുടെ മുൻ അനുഭവങ്ങളോടുള്ള താരതമ്യവും ഇപ്പോഴത്തെ പ്രതീക്ഷയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יִזְבְּלֵנִי
  choice: എന്നെ ആദരിക്കും
  rationale: അപൂർവമായ എബ്രായക്രിയയ്ക്ക് സന്ദർഭത്തിൽ യോജിക്കുന്ന പരമ്പരാഗത അർത്ഥം; ‘എന്നോടൊപ്പം വസിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אִישִׁי
  choice: എന്റെ ഭർത്താവ്
  rationale: വിവാഹസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: ഞാൻ എന്റെ ഭർത്താവിന് ആറു പുത്രന്മാരെ പ്രസവിച്ചുകൊടുത്തതുകൊണ്ട്
  rationale: לוֹ എന്ന പരോക്ഷകർമം വ്യക്തമായി നിലനിർത്തുകയും കാരണം സൂചിപ്പിക്കുന്ന כִּי സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: അതുകൊണ്ട് അവൾ അവന് സെബൂലൂൻ എന്നു പേരിട്ടു
  rationale: എബ്രായ നാമകരണസൂത്രത്തിന്റെ അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יִזְבְּלֵנִי എന്ന അപൂർവക്രിയയുടെ അർത്ഥം
  choice: എന്നെ ആദരിക്കും
  alternative: എന്നോടൊപ്പം വസിക്കും
  rationale: ഭർത്താവിൽനിന്ന് കൂടുതൽ അംഗീകാരം ലഭിക്കുമെന്ന ലേയയുടെ പ്രതീക്ഷ സന്ദർഭത്തിൽ ശക്തമാണ്; എന്നാൽ ‘വസിക്കുക/കൂടെ കഴിയുക’ എന്ന വ്യാഖ്യാനവും സെബൂലൂൻ എന്ന പേരുമായുള്ള പദപ്രയോഗബന്ധവും യഥാർത്ഥ ഭാഷാപരമായ അനിശ്ചിതത്വമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സമ്മാനം സമ്മാനിച്ചിരിക്കുന്നു’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം മൂലഭാഷയിലെ זבד പദകുടുംബത്തിന്റെ പദപ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്നിടത്ത് അനാവശ്യമായ വ്യാഖ്യാനമോ സഭാവിഭാഗസവിശേഷമായ പദാവലിയോ ചേർത്തിട്ടില്ല.
