revisions:
- from: ഇന്ന് അങ്ങയുടെ ആട്ടിൻപറ്റം മുഴുവനിലൂടെയും ഞാൻ കടന്നുപോകട്ടെ. അവയിൽനിന്ന് പുള്ളികളും പാടുകളുമുള്ള ഓരോ മൃഗത്തെയും[a], ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമുള്ള ഓരോ കുഞ്ഞാടിനെയും[b], കോലാടുകളിൽ പാടുകളും പുള്ളികളുമുള്ള ഓരോന്നിനെയും വേർതിരിച്ചുമാറ്റുക. അവയായിരിക്കും എന്റെ കൂലി.
  to: ഇന്ന് അങ്ങയുടെ ആട്ടിൻപറ്റം മുഴുവനിലൂടെയും ഞാൻ കടന്നുപോകട്ടെ. അവയിൽനിന്ന് പുള്ളികളും പാടുകളുമുള്ള ഓരോ മൃഗത്തെയും[a], ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമുള്ള ഓരോ ചെമ്മരിയാടിനെയും[b], കോലാടുകളിൽ പാടുകളും പുള്ളികളുമുള്ള ഓരോന്നിനെയും ഞാൻ വേർതിരിച്ചുമാറ്റട്ടെ. അവയായിരിക്കും എന്റെ കൂലി.
  rationale: The revision restores Jacob as the one who removes or sets apart the animals, preserving the Hebrew clause’s first-person proposal rather than converting it into an instruction to Laban. It also replaces the age-specific ‘കുഞ്ഞാട്’ with ‘ചെമ്മരിയാട്’ to avoid narrowing the source term. Footnote anchors and lexical cautions are retained.
