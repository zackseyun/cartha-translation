translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ലാബാനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്നും ആജ്ഞയിൽ മാന്യമായ ‘വേർതിരിച്ചുമാറ്റുക’ എന്നും ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആജ്ഞാരൂപം സംരക്ഷിച്ചതിനാൽ വേർതിരിക്കുന്ന പ്രവൃത്തി യാക്കോബ് ചെയ്യുന്നതായി മാറ്റിയിട്ടില്ല.
