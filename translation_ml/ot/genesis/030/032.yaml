  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: ml
  text: ഇന്ന് അങ്ങയുടെ ആട്ടിൻപറ്റം മുഴുവനിലൂടെയും ഞാൻ കടന്നുപോകട്ടെ. അവയിൽനിന്ന് പുള്ളികളും പാടുകളുമുള്ള ഓരോ മൃഗത്തെയും[a], ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമുള്ള ഓരോ ചെമ്മരിയാടിനെയും[b], കോലാടുകളിൽ പാടുകളും പുള്ളികളുമുള്ള ഓരോന്നിനെയും ഞാൻ വേർതിരിച്ചുമാറ്റട്ടെ. അവയായിരിക്കും എന്റെ കൂലി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുള്ളികളുള്ള’ (נָקֹד), ‘പാടുകളുള്ള’ (טָלוּא) എന്നീ രണ്ടു പദങ്ങളും നിറവിന്യാസത്തെ സൂചിപ്പിക്കുന്നു. അവയുടെ കൃത്യമായ വ്യത്യാസം വ്യക്തമല്ല; അർഥങ്ങൾ തമ്മിൽ ഭാഗികമായി ഒത്തുചേരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തവിട്ടുനിറമുള്ള’. חוּם എന്ന എബ്രായപദം ചെമ്മരിയാടുകളിലെ ഇരുണ്ടതോ തവിട്ടുനിറത്തോടടുത്തതോ ആയ നിറത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: ഞാൻ കടന്നുപോകട്ടെ
  rationale: Qal അപൂർണരൂപം സന്ദർഭത്തിൽ യാക്കോബിന്റെ നിർദേശത്തെ സൂചിപ്പിക്കുന്ന അനുവാദാർഥക/ഇച്ഛാർഥക പ്രയോഗമായി സ്വാഭാവികമായി വായിക്കാം; ഭാവികാലമായ ‘ഞാൻ കടന്നുപോകും’ എന്ന അർഥവും വ്യാകരണപരമായി സാധ്യമാണ്.
- source_word: בְּכָל צֹאנְךָ
  choice: അങ്ങയുടെ ആട്ടിൻപറ്റം മുഴുവനിലൂടെയും
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന സമൂഹനാമമാണ്. ‘ആട്ടിൻപറ്റം’ മലയാളത്തിൽ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചകമായ പദത്തിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
- source_word: הָסֵר מִשָּׁם
  choice: അവയിൽനിന്ന് ... വേർതിരിച്ചുമാറ്റുക
  rationale: הָסֵר എന്നത് പുരുഷ ഏകവചന ആജ്ഞാരൂപമാണ്; അതിനാൽ ലാബാനോട് മൃഗങ്ങളെ മാറ്റാൻ പറയുന്ന നിർദേശമായി വിവർത്തനം ചെയ്തു. ‘നീക്കംചെയ്യുക’ എന്നതിനെക്കാൾ കൂട്ടത്തിൽനിന്നുള്ള വേർതിരിക്കൽ ഇവിടെ വ്യക്തമാണ്.
- source_word: כָּל שֶׂה
  choice: ഓരോ മൃഗത്തെയും
  rationale: שֶׂה ചെറിയ വളർത്തുമൃഗക്കൂട്ടത്തിലെ ഒരു അംഗത്തെ പൊതുവായി സൂചിപ്പിക്കാം. തുടർന്നുള്ള ചെമ്മരിയാട്–കോലാട് വേർതിരിവിന് മുമ്പ് ഒരു ഇനത്തെ അനാവശ്യമായി നിശ്ചയിക്കാതിരിക്കാൻ ‘മൃഗം’ ഉപയോഗിച്ചു.
- source_word: נָקֹד
  choice: പുള്ളികളുള്ള
  rationale: ചെറിയ പൊട്ടുകളോ പുള്ളികളോ ഉള്ള നിറവിന്യാസമാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: טָלוּא
  choice: പാടുകളുള്ള
  rationale: വലുതോ ക്രമരഹിതമോ ആയ നിറപ്പാടുകൾ ഉള്ളതെന്ന ആശയം നൽകുന്നു; נָקֹד എന്ന പദത്തിൽനിന്നുള്ള സാധ്യതയുള്ള വ്യത്യാസം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חוּם
  choice: ഇരുണ്ട നിറമുള്ള
  rationale: പദം ഇരുണ്ടതോ തവിട്ടുനിറത്തോടടുത്തതോ ആയ നിറത്തെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ വർണഛായ ഉറപ്പില്ലാത്തതിനാൽ ‘തവിട്ടുനിറമുള്ള’ എന്ന് അതിനിർണയിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തി.
- source_word: בַּכְּשָׂבִים
  choice: ചെമ്മരിയാടുകളിൽ
  rationale: כְּשָׂבִים ഇവിടെ കോലാടുകളോടുള്ള വ്യത്യാസത്തിൽ ചെമ്മരിയാടുകളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּעִזִּים
  choice: കോലാടുകളിൽ
  rationale: עִזִּים കോലാടുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ചെമ്മരിയാടുകളിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കാൻ ‘കോലാടുകൾ’ ഉപയോഗിച്ചു.
- source_word: וְהָיָה שְׂכָרִי
  choice: അവയായിരിക്കും എന്റെ കൂലി
  rationale: שָׂכָר തൊഴിൽബന്ധത്തിലെ പ്രതിഫലമോ കൂലിയോ ആണ്. മുൻപു വേർതിരിച്ച മൃഗങ്ങളെയാണ് ‘അവ’ സൂചിപ്പിക്കുന്നത്.
