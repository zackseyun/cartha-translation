source:
  edition: WLC
  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: ml
  text: ആ മനുഷ്യൻ വളരെ അധികമായി അഭിവൃദ്ധിപ്പെട്ടു; അവന് അനേകം ആടുകളുടെ കൂട്ടങ്ങളും സ്ത്രീ അടിമകളും പുരുഷ അടിമകളും ഒട്ടകങ്ങളും കഴുതകളും ഉണ്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാസിമാരും ദാസന്മാരും” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദങ്ങൾ സ്ത്രീ-പുരുഷ ഗൃഹസേവകരെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അവർ സമ്പത്തിന്റെ പട്ടികയിൽ ഉൾപ്പെടുന്നതിനാൽ “സ്ത്രീ അടിമകൾ” എന്നും “പുരുഷ അടിമകൾ” എന്നും വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: അത്യന്തം സമ്പന്നനായിത്തീർന്നു
  rationale: פרץ എന്ന ക്രിയയുടെ ‘പൊട്ടിപ്പുറപ്പെടുക/വളരെയധികം വർധിക്കുക’ എന്ന അടിസ്ഥാനഭാവം ഈ സമ്പത്തിന്റെ സന്ദർഭത്തിൽ അസാധാരണമായ അഭിവൃദ്ധിയെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ച മְאֹד ശക്തമായ തീവ്രത നൽകുന്നു.
- source_word: הָאִישׁ
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ യാക്കോബിനെ സൂചിപ്പിക്കുന്ന ‘the man’ എന്ന പൊതുനാമം അനാവശ്യമായി പേര് ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיְהִי לוֹ
  choice: അവന് ... ഉണ്ടായി
  rationale: കഥയുടെ പുരോഗതിയിൽ അവന്റെ കൈവശം ഇവ വന്നുചേർന്നുവെന്ന ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: צֹאן רַבּוֹת
  choice: അനേകം ആട്ടിൻപറ്റങ്ങൾ
  rationale: צֹאן ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്; പതിവ് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ആട്ടിൻപറ്റങ്ങൾ’ സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: അടിമസ്ത്രീകളും അടിമപുരുഷന്മാരും
  rationale: സ്ത്രീ-പുരുഷ വ്യത്യാസവും ബന്ധിത സേവനത്തിന്റെ സാമൂഹിക യാഥാർഥ്യവും മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: ഒട്ടകങ്ങളും കഴുതകളും
  rationale: മൃഗനാമങ്ങളുടെ സാധാരണ ആധുനിക മലയാളരൂപങ്ങൾ.
theological_decisions:
- issue: שְׁפָחוֹת, עֲבָדִים എന്നീ പദങ്ങളെ ‘ദാസർ/വേലക്കാർ’ എന്നോ ‘അടിമകൾ’ എന്നോ വിവർത്തനം ചെയ്യുക
  choice: അടിമസ്ത്രീകളും അടിമപുരുഷന്മാരും
  alternative: ദാസിമാരും ദാസന്മാരും
  rationale: ഇവിടെ ആളുകൾ യാക്കോബിന് ലഭിച്ച സമ്പത്തിന്റെ പട്ടികയിൽ ഉൾപ്പെടുന്നതിനാൽ ബന്ധിത ഉടമസ്ഥാവസ്ഥ പ്രസക്തമാണ്. ‘അടിമ’ ആ സാമൂഹിക യാഥാർഥ്യം കൂടുതൽ നേരിട്ട് അറിയിക്കുന്നു; അതേസമയം ഒരു പ്രത്യേക മതശാസ്ത്ര നിലപാട് പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. എബ്രായത്തിലെ കൂട്ടിച്ചേർക്കുന്ന പട്ടികാശൈലി ആവർത്തിച്ച ‘-കളും’ വഴി നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി രണ്ട് സ്വതന്ത്ര വാക്യഘടകങ്ങൾ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
