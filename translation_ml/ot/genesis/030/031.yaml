  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ നേരിട്ടുള്ള നിരസനവും വ്യവസ്ഥാപരമായ നിർദേശവും നിലനിർത്തി; אָשׁוּבָה എന്നതിലെ യഥാർഥ അർഥദ്വയത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
