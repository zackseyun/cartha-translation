  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: ml
  text: 'അവൻ ചോദിച്ചു: “ഞാൻ നിനക്ക് എന്തു തരണം?” യാക്കോബ് പറഞ്ഞു: “നീ എനിക്ക് ഒന്നും തരേണ്ട. നീ എനിക്കുവേണ്ടി ഈ കാര്യം ചെയ്താൽ, ഞാൻ വീണ്ടും[a] നിന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുകയും കാത്തുകൊള്ളുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ മടങ്ങി നിന്റെ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുകയും കാത്തുകൊള്ളുകയും ചെയ്യും.” ഹീബ്രു ക്രിയയ്ക്ക് മടങ്ങുക എന്നോ സേവനം വീണ്ടും ആരംഭിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: ഞാൻ നിനക്ക് എന്തു തരണം?
  rationale: മָה എന്ന ചോദ്യപദവും ഒന്നാംപുരുഷ נתן രൂപവും ചേർന്ന് ലാബാൻ നൽകേണ്ട പ്രതിഫലം എന്താണെന്ന് ചോദിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ഈ ചോദ്യം സ്വാഭാവികവും നേരിട്ടുമാണ്.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: നീ എനിക്ക് ഒന്നും തരേണ്ട
  rationale: നിഷേധസന്ദർഭത്തിലെ מְאוּמָה എന്നത് ‘ഒന്നും’ എന്നാണ്. ഇവിടെ ലֹא സഹിതമുള്ള അപൂർണക്രിയ ഭാവികാല പ്രവചനമല്ല, പ്രതിഫലം നിരസിക്കുന്ന വാക്കായതിനാൽ ‘തരേണ്ട’ എന്നു നൽകി.
- source_word: אִם תַּעֲשֶׂה לִי הַדָּבָר הַזֶּה
  choice: നീ എനിക്കുവേണ്ടി ഈ കാര്യം ചെയ്താൽ
  rationale: ഹീബ്രുവിലെ വ്യവസ്ഥയും ‘ഈ കാര്യം’ എന്ന സൂചകപ്രയോഗവും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളവാക്യമായി നൽകി.
- source_word: אָשׁוּבָה
  choice: ഞാൻ വീണ്ടും
  rationale: שׁוב എന്ന ക്രിയയ്ക്ക് ഇവിടെ ഒരു സ്ഥലത്തേക്കുള്ള മടങ്ങിവരവിനേക്കാൾ ജോലി പുനരാരംഭിക്കുക എന്ന അർഥം സന്ദർഭോചിതമാണ്. എങ്കിലും ‘മടങ്ങിവരുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֶרְעֶה
  choice: മേയിച്ചു
  rationale: צֹאן എന്ന കന്നുകാലിക്കൂട്ടത്തോടൊപ്പം רעה എന്നത് മേയ്ക്കുകയും പരിപാലിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മേയിച്ചു’ എന്നത് ഈ ഇടയവൃത്തിയുടെ ദൃശ്യമായ അർഥം നൽകുന്നു.
- source_word: צֹאנְךָ
  choice: നിന്റെ ആട്ടിൻകൂട്ടത്തെ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറുകന്നുകാലികളുടെ കൂട്ടനാമമാണ്. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പൊതുപദമായി ‘ആട്ടിൻകൂട്ടം’ തിരഞ്ഞെടുത്തു.
- source_word: אֶשְׁמֹר
  choice: കാത്തുകൊള്ളാം
  rationale: שׁמר ഇവിടെ കൂട്ടത്തെ നിരീക്ഷിച്ച് സംരക്ഷിക്കുന്ന ഇടയന്റെ ചുമതലയെ സൂചിപ്പിക്കുന്നു. ‘കാത്തുകൊള്ളാം’ സംരക്ഷണവും തുടർച്ചയായ മേൽനോട്ടവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
