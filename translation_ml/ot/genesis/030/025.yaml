  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: ml
  text: 'റാഹേൽ യോസേഫിനെ പ്രസവിച്ചപ്പോൾ, യാക്കോബ് ലാബാനോട് പറഞ്ഞു: “എന്നെ വിട്ടയയ്ക്കുക; ഞാൻ എന്റെ സ്ഥലത്തേക്കും എന്റെ ദേശത്തേക്കും പോകട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: എന്നെ യാത്രയാക്കണം
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ ‘എന്നെ വിട്ടയയ്ക്കുക/പോകാൻ അനുവദിക്കുക’ എന്ന അർഥം സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: എന്റെ സ്ഥലത്തേക്കും എന്റെ ദേശത്തേക്കും
  rationale: രണ്ടു സ്വത്തുസൂചക രൂപങ്ങളും ആവർത്തിച്ച് മൂലപാഠത്തിന്റെ ഘടന നിലനിർത്തുന്നു; ‘സ്വന്തം’ എന്ന് ചേർക്കാതെ എബ്രായത്തിൽ ഉള്ളത്ര ഊന്നൽ മാത്രം നൽകുന്നു.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …ശേഷം
  rationale: സംഭവക്രമം സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണം വിനയപൂർവമായ അഭ്യർഥനയുടെ ഭാവത്തിൽ നൽകിയിരിക്കുന്നു.
