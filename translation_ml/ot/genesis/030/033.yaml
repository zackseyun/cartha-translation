translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘കോലാട്/ചെമ്മരിയാട്’ എന്ന പദങ്ങൾ മൃഗവിഭാഗങ്ങളുടെ വ്യത്യാസം വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ സാക്ഷ്യപ്രയോഗവും ഭാവികാലത്തിലെ പരിശോധനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; യഥാർഥമായ പദാർഥ-വാക്യഘടനാ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു.
