  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: ml
  text: “എന്റെ സത്യസന്ധത[a] എനിക്കുവേണ്ടി സാക്ഷ്യം പറയും; പിന്നീട്[b] നീ എന്റെ കൂലി പരിശോധിക്കാൻ[c] വരുമ്പോൾ, കോലാടുകളിൽ പുള്ളികളും വലിയ പാടുകളും ഇല്ലാത്തതും ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമില്ലാത്തതുമായ ഏതിനെയും എന്റെ പക്കൽ കണ്ടാൽ, അത് മോഷ്ടിച്ചതായി കണക്കാക്കപ്പെടും[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ നീതി’ അല്ലെങ്കിൽ ‘എന്റെ നേര்மை.’ ഇവിടെ എബ്രായപദം ഈ കൂലി-കരാറിൽ യാക്കോബിന്റെ തെളിയിക്കാവുന്ന നേരിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നാളത്തെ ദിവസം.’ ഇത് ‘നാളെ’ എന്നോ, ലാബാൻ ആട്ടിൻകൂട്ടത്തെ പരിശോധിക്കുന്ന പിന്നീടൊരു സമയം എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിന്റെ മുമ്പിൽ എന്റെ കൂലിയുടെ കാര്യത്തിൽ നീ വരുമ്പോൾ.’ സന്ദർഭത്തിൽ ഇത് കൂലി പരിശോധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: source_idiom
  - marker: e
    text: 'എബ്രായത്തിൽ ചുരുക്കമായി: ‘അത് എന്റെ പക്കൽ മോഷ്ടിച്ചതാണ്.’ അത്തരം മൃഗം യാക്കോബിന്റെ പക്കൽ കണ്ടെത്തിയാൽ മോഷ്ടിച്ചതായി വിധിക്കപ്പെടുമെന്നാണ് അർഥം.'
    reason: implicit_judicial_sense
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: എനിക്കുവേണ്ടി സാക്ഷ്യം പറയും
  rationale: ‘ഉത്തരം പറയും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാക്ഷ്യപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; യാക്കോബിന്റെ പെരുമാറ്റം അവനെ നിർദോഷനായി തെളിയിക്കുമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: צִדְקָתִי
  choice: എന്റെ സത്യസന്ധത
  rationale: ഈ കൂലി-കരാർ സന്ദർഭത്തിൽ പദം ഇടപാടിലെ യാക്കോബിന്റെ തെളിയിക്കാവുന്ന നേരിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നീതി’ എന്ന കൂടുതൽ വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּיוֹם מָחָר
  choice: പിന്നീട്
  rationale: അക്ഷരാർഥത്തിൽ ‘നാളത്തെ ദിവസം’ എന്നാണെങ്കിലും, ഇവിടെ അടുത്ത കലണ്ടർ ദിവസത്തേക്കാൾ ഭാവിയിലെ പരിശോധനാസമയമാണ് ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യത.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: നീ എന്റെ കൂലി പരിശോധിക്കാൻ വരുമ്പോൾ
  rationale: ലാബാൻ പിന്നീട് യാക്കോബിന്റെ കൂലിയായി വേർതിരിച്ച മൃഗങ്ങളെ പരിശോധിക്കുന്ന പ്രായോഗിക അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: נָקֹד וְטָלוּא
  choice: പുള്ളികളോ മറുകുകളോ
  rationale: രണ്ടു വ്യത്യസ്ത അടയാളരീതികളെ മലയാളത്തിൽ വേർതിരിച്ചു കാണിക്കുന്നു; നിഷേധവാക്യത്തിൽ ‘-ഓ ... -ഓ ഇല്ലാത്ത’ എന്ന രൂപം ‘ഇവയിൽ ഒന്നുമില്ലാത്ത’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חוּם
  choice: ഇരുണ്ട നിറം
  rationale: കൃത്യമായ നിറച്ചായം ഉറപ്പില്ലാത്തതിനാൽ ‘തവിട്ടുനിറം’ എന്നതിനെക്കാൾ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: בָּעִזִּים / בַּכְּשָׂבִים
  choice: കോലാടുകളിൽ / ചെമ്മരിയാടുകളിൽ
  rationale: രണ്ടു മൃഗവിഭാഗങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു; כשבים എന്നത് കുഞ്ഞാടുകളെയോ പൊതുവായി ചെമ്മരിയാടുകളെയോ സൂചിപ്പിക്കാം.
- source_word: גָּנוּב הוּא אִתִּי
  choice: എന്റെ പക്കൽ കണ്ടാൽ, അത് മോഷ്ടിച്ചതായി കണക്കാക്കണം
  rationale: എബ്രായത്തിലെ ചുരുക്കമായ ന്യായവിധിപരമായ പ്രസ്താവന—അത്തരം മൃഗം യാക്കോബിന്റെ പക്കൽ ഉണ്ടെങ്കിൽ മോഷ്ടിച്ചതായി കരുതണം—വ്യക്തമാക്കുന്നു.
