- from: “അങ്ങനെ, പിന്നീട്[b] നീ എന്റെ കൂലി പരിശോധിക്കാൻ[c] വരുമ്പോൾ, എന്റെ സത്യസന്ധത[a] എനിക്കുവേണ്ടി സാക്ഷ്യം പറയും. കോലാടുകളിൽ പുള്ളികളോ മറുകുകളോ ഇല്ലാത്തതും ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമില്ലാത്തതുമായ[d] ഏതൊന്നും എന്റെ പക്കൽ കണ്ടാൽ, അത് മോഷ്ടിച്ചതായി കണക്കാക്കണം[e].”
  to: “എന്റെ സത്യസന്ധത[a] എനിക്കുവേണ്ടി സാക്ഷ്യം പറയും; പിന്നീട്[b] നീ എന്റെ കൂലി പരിശോധിക്കാൻ[c] വരുമ്പോൾ, കോലാടുകളിൽ പുള്ളികളും വലിയ പാടുകളും ഇല്ലാത്തതും ചെമ്മരിയാടുകളിൽ ഇരുണ്ട നിറമില്ലാത്തതുമായ ഏതിനെയും എന്റെ പക്കൽ കണ്ടാൽ, അത് മോഷ്ടിച്ചതായി കണക്കാക്കപ്പെടും[e].”
  rationale: The revised wording preserves the Hebrew cumulative description of goat markings, uses natural Malayalam for coat patterns, and renders the final terse judicial statement without adding an imperative. It also improves footnote precision and idiom. Footnote d is retained as supplied, though no anchor is necessary in the running text because it expands the same marked-animal clause already discussed in the note.
