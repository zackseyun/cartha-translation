lexical_decisions:
- source_word: וַתֵּלֶד
  choice: പ്രസവിച്ചു
  rationale: കഥയിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന wayyiqtol രൂപം; ילד എന്ന ക്രിയയും ‘ഒരു മകനെ’ എന്ന കർമവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രസവിച്ചു’ എന്നു നൽകുന്നു.
- source_word: זִלְפָּה
  choice: സിൽപ്പാ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁפְחַת
  choice: ദാസിയായ
  rationale: שִׁפְחָה കീഴ്നിലയിലുള്ള സ്ത്രീ ഗൃഹദാസിയെ സൂചിപ്പിക്കുന്നു. ‘ദാസി’ ലിംഗവും അധീനമായ സാമൂഹിക നിലയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ മറ്റൊരു സ്വാഭാവിക പരിഭാഷ നൽകുന്നു.
- source_word: לֵאָה
  choice: ലേയയുടെ
  rationale: എബ്രായത്തിലെ construct ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധമായി നൽകി.
- source_word: לְיַעֲקֹב
  choice: യാക്കോബിന്
  rationale: ילד എന്ന ക്രിയയോടൊപ്പമുള്ള לְ പിതാവിനെയോ പ്രയോജനസ്വീകർത്താവിനെയോ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ദാതൃവിഭക്തി ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בֵּן
  choice: ഒരു മകനെ
  rationale: സന്ദർഭത്തിലെ അനിശ്ചിത ഏകവചന നാമം മലയാളത്തിൽ ‘ഒരു’ ചേർത്ത് സ്വാഭാവികമായി നൽകി.
