base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: ml
  text: 'അവൾ ഗർഭം ധരിച്ചു, ഒരു മകനെ പ്രസവിച്ചു; അവൾ പറഞ്ഞു: “ദൈവം എന്റെ നിന്ദ[a] നീക്കിക്കളഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ അപമാനം” അല്ലെങ്കിൽ “എന്റെ ലജ്ജ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: അവൾ ഗർഭം ധരിച്ചു
  rationale: הרה ഗർഭം ധരിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കഥാക്രമം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: וַתֵּלֶד בֵּן
  choice: ഒരു മകനെ പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയും בֵּן എന്ന നാമവും ചേർന്ന് ഒരു മകനെ പ്രസവിച്ചു എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: ഹീബ്രായ കഥനത്തിലെ തുടർച്ച മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אָסַף
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഈ സന്ദർഭത്തിൽ אסף എടുത്തുമാറ്റുക, നീക്കുക എന്ന ഫലസൂചക അർഥത്തിലാണ്; ‘നീക്കിക്കളഞ്ഞു’ പൂർത്തിയായ ഫലത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: പദം രൂപത്തിൽ ബഹുവചനമായിരുന്നാലും ഏകവചന ക്രിയയോടുകൂടി ഇവിടെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חֶרְפָּתִי
  choice: എന്റെ അപമാനം
  rationale: חֶרְפָּה സാമൂഹിക നിന്ദ, അപകീർത്തി, ലജ്ജ എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; ‘അപമാനം’ ആ സാമൂഹിക മാനവും ആധുനിക വായനാസൗകര്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֱלֹהִים എന്നതിന്റെ ഏകവചന അർഥം
  choice: ദൈവം
  alternative: ദേവന്മാർ
  rationale: אָסַף എന്ന ഏകവചന ക്രിയയും സന്ദർഭവും ഏകവചന സൂചന ആവശ്യപ്പെടുന്നു; വ്യാകരണപരമായ അർഥത്തിനപ്പുറം വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘അപമാനം’ എന്നത് വന്ധ്യതയോടു ബന്ധപ്പെട്ട പൊതുനിന്ദയുടെ സാമൂഹിക മാനം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
