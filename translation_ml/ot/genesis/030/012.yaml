  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁפְחַת לֵאָה
  choice: ലേയയുടെ ദാസിയായ
