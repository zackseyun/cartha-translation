source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל לֵאָ֑ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: ml
  text: ദൈവം ലേയയെ ശ്രദ്ധിച്ചു കേട്ടു[a]. അവൾ ഗർഭം ധരിച്ച് യാക്കോബിന് അഞ്ചാമത്തെ മകനെ പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം ലേയയെ കേട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: അപേക്ഷ കേട്ടു
  rationale: שׁמע + אֶל ഇവിടെ വെറും ശബ്ദഗ്രഹണമല്ല, അനുകൂലമായി ശ്രദ്ധിച്ചു പ്രതികരിക്കുന്നതും സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ വ്യക്തമായ പ്രാർഥനാവാക്കുകൾ രേഖപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ ഈ പ്രയോഗം സന്ദർഭസൂചന നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ആഖ്യാനത്തിൽ ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: לֵאָה
  choice: ലേയ
  rationale: എബ്രായ നാമമായ לֵאָהയുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וַתַּהַר
  choice: അവൾ ഗർഭം ധരിച്ചു
  rationale: ജനനവിവരണത്തിൽ הרהയുടെ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: യാക്കോബിന് ... പ്രസവിച്ചു
  rationale: ילד + לְ എന്ന ഘടനയിലെ പരോക്ഷ കർമബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: בֵּן חֲמִישִׁי
  choice: അഞ്ചാമതൊരു മകനെ
  rationale: ക്രമസംഖ്യ മകനെ വിശേഷിപ്പിക്കുന്നു; 'ഒരു അഞ്ചാമത്തെ മകൻ' എന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കി മലയാളത്തിൽ ഒഴുക്കുള്ള രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: שׁמע אֶל സൂചിപ്പിക്കുന്ന ദൈവിക പ്രതികരണം
  choice: ദൈവം ലേയയുടെ അപേക്ഷ അനുകൂലമായി കേട്ടു എന്ന ആശയം പ്രധാന പാഠത്തിൽ നൽകി.
  alternative: ദൈവം ലേയയുടെ വാക്കു കേട്ടു.
  rationale: എബ്രായ പ്രയോഗം വെറും കേൾവിയേക്കാൾ ശ്രദ്ധാപൂർവവും പ്രതികരണപരവുമായ കേൾവിയെ സൂചിപ്പിക്കാം. എന്നാൽ പ്രതികരണത്തിന്റെ സ്വഭാവത്തെ പാഠത്തിനപ്പുറം വിശദീകരിച്ചിട്ടില്ല; കൂടുതൽ ഔപചാരികമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ ആശയബന്ധങ്ങളും ആവർത്തനഭാവവും നിലനിർത്തി.
