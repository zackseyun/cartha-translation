reference: Genesis 30:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: ml
  text: ഞാൻ വരുന്നതിനുമുമ്പ് നിനക്കുണ്ടായിരുന്നത് അൽപ്പമായിരുന്നു; എന്നാൽ അത് പെരുകി സമൃദ്ധമായി. എന്റെ വരവോടെ[a] യഹോവ നിന്നെ അനുഗ്രഹിച്ചു. ഇനി, എന്റെ സ്വന്തം കുടുംബത്തിനുവേണ്ടി ഞാനും എപ്പോൾ കരുതും[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ കാലടിയിൽ.’ ഈ ഹീബ്രു പ്രയോഗത്തിന് ‘എന്റെ വരവോടെ’ എന്നോ ‘ഞാൻ നിമിത്തം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘എന്റെ സ്വന്തം കുടുംബത്തിനുവേണ്ടി ഞാനും എപ്പോൾ എന്തെങ്കിലും ചെയ്യും?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: ഞാൻ വരുന്നതിനുമുമ്പ് നിനക്കുണ്ടായിരുന്നത് അൽപ്പമായിരുന്നു
  rationale: ലְפָנַי എന്നതിന്റെ രൂപപരമായ അർഥം ‘എനിക്കുമുമ്പിൽ/എനിക്കുമുമ്പ്’ എന്നാണ്; സന്ദർഭത്തിൽ യാക്കോബിന്റെ വരവിനു മുമ്പുള്ള ലാബാന്റെ കുറഞ്ഞ സമ്പത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: അത് പെരുകി സമൃദ്ധമായി
  rationale: פרץ എന്ന ക്രിയയിലെ ശക്തമായ വളർച്ചയും לָרֹב സൂചിപ്പിക്കുന്ന സമൃദ്ധമായ ഫലവും ലളിതവും സ്വാഭാവികവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ നാല് അക്ഷരങ്ങളുള്ള പേരിനെ മലയാളത്തിലെ സ്ഥാപിതമായ ശബ്ദരൂപമായ ‘യഹോവ’ എന്നു നൽകുന്നു; പകരം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കുന്നില്ല.
- source_word: לְרַגְלִי
  choice: എന്റെ വരവോടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ കാലടിയിൽ/കാലിനോടൊപ്പം’ എന്നുള്ള പ്രയോഗം ഇവിടെ യാക്കോബിന്റെ വരവിനോടനുബന്ധിച്ചോ അവൻ നിമിത്തമോ ലഭിച്ച അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന ഒരു ഭാഷാശൈലിയാണ്. പ്രധാന പാഠത്തിൽ സന്ദർഭോചിതമായ വരവ് എന്ന അർഥം നൽകുകയും കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: എന്റെ സ്വന്തം കുടുംബത്തിനുവേണ്ടിയും ഞാൻ എപ്പോൾ കരുതും?
  rationale: עשה ... לְבֵיתִי എന്ന പ്രയോഗം സ്വന്തം വീട്ടുകാരുടെ ക്ഷേമത്തിനായി പ്രവർത്തിക്കുകയോ ഉപജീവനം ഒരുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കരുതും’ സാമ്പത്തികവും കുടുംബപരിപാലനപരവുമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ രൂപപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ലְרַגְלִי എന്ന പ്രയോഗത്തിന്റെ കാലാർഥവും കാരണാർഥവും
  choice: പ്രധാന പാഠത്തിൽ ‘എന്റെ വരവോടെ’; ‘ഞാൻ നിമിത്തം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ഞാൻ നിമിത്തം
  rationale: അടുത്തുള്ള ‘ഞാൻ വരുന്നതിനുമുമ്പ്’ എന്ന കാലപരമായ വിരുദ്ധത ‘എന്റെ വരവോടെ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും യാക്കോബ് മുഖാന്തരം അനുഗ്രഹം ലഭിച്ചു എന്ന കാരണാർഥവും ഹീബ്രു പ്രയോഗത്തിൽ സാധ്യമായതിനാൽ അത് ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അൽപ്പമായിരുന്നു,’ ‘പെരുകി സമൃദ്ധമായി,’ ‘കരുതും’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ആശയസാന്ദ്രതയും സ്വാഭാവിക മലയാളപ്രവാഹവും തമ്മിൽ സമതുലിതമാക്കുന്നു.
