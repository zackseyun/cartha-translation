source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയുടെ സൈന്യാധിപൻ യോശുവയോടു പറഞ്ഞു[a]: “നിന്റെ കാലിൽനിന്ന് ചെരിപ്പ് അഴിച്ചുമാറ്റുക[b]; നീ നിൽക്കുന്ന സ്ഥലം വിശുദ്ധമാണ്.” യോശുവ അങ്ങനെ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹോവയുടെ സൈന്യത്തിന്റെ അധിപൻ.”
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ഏകവചനം: “നിന്റെ ചെരിപ്പ് ... നിന്റെ കാൽ.” കൂടുതൽ പരിചിതമായ ബഹുവചനപ്രയോഗത്തിന് പുറപ്പാട് 3:5 താരതമ്യം ചെയ്യുക.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: സൈന്യാധിപൻ
  rationale: צְבָא എന്ന സൈനികസന്ദർഭത്തിൽ നേതൃത്വപദവിയെ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; ‘പ്രഭു’ പോലുള്ള പദങ്ങൾ ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: צְבָא יְהוָה
  choice: യഹോവയുടെ സൈന്യം
  rationale: צָבָאയുടെ സൈനിക അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘സൈന്യം’ ആധുനിക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- source_word: שַׁל
  choice: അഴിച്ചുമാറ്റുക
  rationale: കാലിൽ ധരിച്ച ചെരിപ്പ് നീക്കാനുള്ള ആജ്ഞയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַעַלְךָ
  choice: നിന്റെ ... ചെരിപ്പ്
  rationale: പുരാതന പാദരക്ഷയെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം നിലനിർത്തുന്നു; ‘ചെരിപ്പ്’ മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ പദമാണ്.
- source_word: מֵעַל רַגְלְךָ
  choice: നിന്റെ കാലിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തുന്നു; പുറപ്പാട് 3:5-ലെ പരിചിതമായ ബഹുവചനരീതിയോട് ഒത്താക്കുന്നില്ല.
- source_word: הַמָּקוֹם
  choice: സ്ഥലം
  rationale: മൂലത്തിലെ നിർദ്ദിഷ്ട നാമത്തെ അധിക സൂചനാപദം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: עֹמֵד עָלָיו
  choice: നീ നിൽക്കുന്ന
  rationale: തുടരുന്ന നിലപാടിനെ സ്വാഭാവികമായ ബന്ധവാക്യത്തിൽ നൽകുന്നു; ‘അതിന്റെമേൽ’ എന്നത് മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകും.
- source_word: קֹדֶשׁ הוּא
  choice: വിശുദ്ധമാണ്
  rationale: קֹדֶשׁ എന്ന പദത്തിന്റെ വേദപുസ്തകപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: യോശുവ അങ്ങനെ ചെയ്തു
  rationale: യോശുവയുടെ അനുസരണം രേഖപ്പെടുത്തുന്ന സൂത്രവാക്യം ലളിതവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: שַׂר צְבָא יְהוָה എന്നു വിളിക്കപ്പെടുന്ന സംസാരിക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിയലും പദവിയും
  choice: ‘യഹോവയുടെ സൈന്യാധിപൻ’ എന്ന വിവരണാത്മക പദവി മാത്രം ഉപയോഗിച്ചു.
  alternative: ദൂതനായ സൈന്യാധിപൻ; യഹോവയുടെ പ്രത്യക്ഷത; മനുഷ്യാവതാരത്തിനു മുമ്പുള്ള ക്രിസ്തുവിന്റെ പ്രത്യക്ഷത
  rationale: വാക്യം ആ വ്യക്തിയെ ഈ പദവിക്കപ്പുറം വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ ദൂതൻ, ദൈവപ്രത്യക്ഷത, ക്രിസ്തുപ്രത്യക്ഷത എന്നിവയിൽ ഒന്നായി നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വേദപുസ്തകശൈലി. മൂലത്തിലെ ഏകവചനമായ ‘ചെരിപ്പ്/കാൽ’ നിലനിർത്തി. സംസാരിക്കുന്ന വ്യക്തിയുടെ സ്വഭാവത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
