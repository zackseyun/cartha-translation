source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: ml
  text: യോർദ്ദാന്റെ പടിഞ്ഞാറുഭാഗത്തുള്ള അമോര്യരുടെ എല്ലാ രാജാക്കന്മാരും കടൽത്തീരത്തുള്ള[a] കനാന്യരുടെ എല്ലാ രാജാക്കന്മാരും, യഹ്വേ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് യോർദ്ദാനിലെ വെള്ളം ഞങ്ങൾ കടന്നുപോകുന്നതുവരെ[b] വറ്റിച്ചുകളഞ്ഞെന്നു കേട്ടപ്പോൾ, അവരുടെ ഹൃദയം ഉരുകിപ്പോയി; ഇസ്രായേൽമക്കളെ ഭയന്ന് അവരിൽ പിന്നെ മനക്കരുത്തൊന്നും ശേഷിച്ചില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കടലിനരികിലുള്ള”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് തീരപ്രദേശമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളും പുരാതന പരിഭാഷകളും “അവർ കടന്നുപോകുന്നതുവരെ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: c
    text: എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ “അവരിൽ പിന്നെ ആത്മാവ്/ശ്വാസം ഉണ്ടായിരുന്നില്ല” എന്നാണർഥം; ഇവിടെ അത് ധൈര്യമോ മനക്കരുത്തോ നഷ്ടപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും കാലസാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകമായി ‘സംഭവിച്ചു’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: യോർദ്ദാന്റെ പടിഞ്ഞാറുഭാഗത്തുള്ള
  rationale: יָמָּה എന്ന പടിഞ്ഞാറോട്ടുള്ള ദിശയും യോർദ്ദാന്റെ മറുകര എന്ന ഭൂമിശാസ്ത്രപരമായ ആശയവും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: കടൽത്തീരത്തുള്ള
  rationale: കടലിനോടു ചേർന്ന തീരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന്
  rationale: ജലം അവരുടെ മുമ്പിൽനിന്ന് നീക്കപ്പെട്ടുവെന്ന ആശയവും בְנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ദേശീയ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: עַד עברנו
  choice: ഞങ്ങൾ കടന്നുപോകുന്നതുവരെ
  rationale: മസോരറ്റിക് വ്യഞ്ജനപാഠത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനത്തെ നിലനിർത്തുന്നു; മൂന്നാംപുരുഷ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּמַּס לְבָבָם
  choice: അവരുടെ ഹൃദയം ഉരുകിപ്പോയി
  rationale: എബ്രായത്തിലെ ഏകവചന കൂട്ടായ രൂപവും ഭയം മൂലം ധൈര്യം നഷ്ടപ്പെടുന്ന ‘ഉരുകുക’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: അവരിൽ പിന്നെ മനക്കരുത്തൊന്നും ശേഷിച്ചില്ല
  rationale: רוּחַ ഇവിടെ നൽകുന്ന ധൈര്യം/ഉൾക്കരുത്ത് എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; പദത്തിന്റെ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ദേശീയ-കുടുംബപരമായ സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന കുടുംബപരമായ ദേശീയഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: עברנו എന്ന ക്രിയയുടെ പുരുഷഭേദം
  choice: ഞങ്ങൾ കടന്നുപോകുന്നതുവരെ
  alternative: അവർ കടന്നുപോകുന്നതുവരെ
  rationale: മസോരറ്റിക് വ്യഞ്ജനപാഠത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, സുപ്രധാനമായ മറ്റൊരു പാഠവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂമിശാസ്ത്രസൂചനകൾ വ്യക്തമായി നൽകി; എബ്രായത്തിലെ കൂട്ടായ ഏകവചനമായ ‘ഹൃദയം’ നിലനിർത്തി. പാഠഭേദവും רוּחַ എന്ന പദത്തിന്റെ രൂപകപരമായ അർഥവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
