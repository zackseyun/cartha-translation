  to: 'അവൻ പറഞ്ഞു[a]: “അല്ല; യഹോവയുടെ സൈന്യത്തിന്റെ അധിപനായിട്ടാണ് ഞാൻ ഇപ്പോൾ വന്നിരിക്കുന്നത്.” അപ്പോൾ യോശുവ കവിണ്ണുവീണ് മുഖം നിലത്തുവെച്ച് വണങ്ങി[b]. അവൻ അദ്ദേഹത്തോട് പറഞ്ഞു: “എന്റെ യജമാനൻ തന്റെ ദാസനോട് എന്താണ് പറയുന്നത്?”'
  rationale: മൂലപാഠത്തിലെ വַיֹּאמֶר (‘പറഞ്ഞു’) എന്ന സംസാരക്രിയ പുനഃസ്ഥാപിച്ചു. ചോദ്യം നേരിട്ടുള്ള ഉദ്ധരണിയിൽ പൂർണമായി നിലനിൽക്കുന്നതിനാൽ അർഥനഷ്ടമില്ല; അതേസമയം എബ്രായ ആഖ്യാനത്തിന്റെ പ്രയോഗവും സംരക്ഷിക്കപ്പെടുന്നു. മറ്റെല്ലാ പദപ്രയോഗങ്ങളും അടിക്കുറിപ്പുകളും പാഠവിശ്വസ്തവും സ്വാഭാവികവുമാണ്.
