id: JOS.5.14
reference: Joshua 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “അല്ല; യഹോവയുടെ സൈന്യത്തിന്റെ അധിപനായിട്ടാണ് ഞാൻ ഇപ്പോൾ വന്നിരിക്കുന്നത്.” അപ്പോൾ യോശുവ കവിണ്ണുവീണ് മുഖം നിലത്തുവെച്ച് വണങ്ങി[b]. അവൻ അദ്ദേഹത്തോട് പറഞ്ഞു: “എന്റെ യജമാനൻ തന്റെ ദാസനോട് എന്താണ് പറയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “രണ്ടുമല്ല; യഹോവയുടെ സൈന്യത്തിന്റെ അധിപനായിട്ടാണ് ഞാൻ ഇപ്പോൾ വന്നിരിക്കുന്നത്.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായ ക്രിയയെ “ആരാധിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഈ വാക്യം മാത്രം ആ വ്യക്തിയുടെ സ്വരൂപത്തെ തീർപ്പാക്കാത്തതിനാൽ, ചെയ്ത പ്രവൃത്തി സൂചിപ്പിക്കുന്ന “വണങ്ങി” എന്നാണ് മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: അല്ല
  rationale: യോശുവയുടെ മുമ്പത്തെ ഒന്നുകിൽ-അല്ലെങ്കിൽ ചോദ്യത്തിനുള്ള നേരിട്ടുള്ള നിഷേധം; ‘രണ്ടുമല്ല’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: …ആയിട്ടാണ്
  rationale: നിഷേധത്തിനു പിന്നാലെയുള്ള തിരുത്തൽ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שַׂר
  choice: അധിപൻ
  rationale: സൈനികസന്ദർഭത്തിലെ മേൽനേതാവിനെ സൂചിപ്പിക്കുന്ന, മാന്യവും വ്യാപകമായി ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: צְבָא יְהוָה
  choice: യഹോവയുടെ സൈന്യം
  rationale: ‘സൈന്യം’ צָבָאയുടെ സൈനിക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עַתָּה בָאתִי
  choice: ഞാൻ ഇപ്പോൾ വന്നിരിക്കുന്നു
  rationale: വന്നെത്തിയ പ്രവൃത്തിയുടെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയുടെയും ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׁתָּחוּ
  choice: വണങ്ങി
  rationale: ശാരീരികമായ ആദരപ്രകടനം നിലനിർത്തുന്നു; ഈ വാക്യം മാത്രം ആശ്രയിച്ച് അതിനെ പ്രത്യേകമായി ആരാധനയെന്ന് തീർപ്പാക്കുന്നില്ല.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഒന്നാംപുരുഷ പ്രത്യയത്തോടുകൂടിയ ആദരസംബോധന നിലനിർത്തുകയും ആ വ്യക്തിയുടെ സ്വരൂപത്തെ വിവർത്തനത്തിലൂടെ മുൻകൂട്ടി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מְדַבֵּר אֶל עַבְדּוֹ
  choice: തന്റെ ദാസനോട് എന്താണ് പറയുന്നത്
  rationale: സംഭാഷണത്തിന്റെ തത്സമയഭാവവും യോശുവയുടെ വിനയപൂർവമായ സ്വയംവിശേഷണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോശുവയുടെ പ്രവൃത്തിയെ വ്യക്തമായി ആരാധനയായി വിവർത്തനം ചെയ്യണമോ
  choice: മുഖം നിലത്തുവെച്ച് ‘വണങ്ങി’ എന്ന് നൽകി
  alternative: ‘ആരാധിച്ചു’
  rationale: שחה ആദരപൂർവം വണങ്ങുന്നതിനെയും ചില സന്ദർഭങ്ങളിൽ ആരാധിക്കുന്നതിനെയും സൂചിപ്പിക്കാം. ഈ വാക്യം മാത്രം ആ പ്രവൃത്തിയുടെ കൃത്യമായ ദൈവശാസ്ത്രസ്വഭാവം നിർണയിക്കാത്തതിനാൽ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: സംസാരിക്കുന്ന വ്യക്തിയെ ദൈവിക പ്രത്യക്ഷതയോ ദൂതനോ ആയി വിവർത്തനത്തിൽ തിരിച്ചറിയണമോ
  choice: ‘യഹോവയുടെ സൈന്യത്തിന്റെ അധിപൻ’ എന്ന പാഠത്തിലെ പദവിയിൽ മാത്രം നിർത്തി
  alternative: ദൂതനെയോ ദൈവിക പ്രത്യക്ഷതയെയോ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ ഭാഷ
  rationale: ഈ വാക്യം ആ വ്യക്തിയുടെ സ്വരൂപത്തെ വ്യക്തമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ വിവർത്തനം പാഠപരമായി സംയമിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യഹോവ’ എന്ന സ്ഥാപിത മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു. ആദരസംബോധനയിൽ ‘അദ്ദേഹത്തോട്’ ഉപയോഗിച്ചെങ്കിലും ദൈവികസ്വരൂപം മുൻകൂട്ടി നിർണയിക്കുന്ന ഭാഷ ഒഴിവാക്കി.
