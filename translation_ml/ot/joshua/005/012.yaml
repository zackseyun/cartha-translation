source:
  edition: WLC
  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: ml
  text: അവർ ദേശത്തിലെ വിളവിൽനിന്ന്[a] ഭക്ഷിച്ച പിറ്റേന്ന് മന്ന നിന്നുപോയി. ഇസ്രായേൽമക്കൾക്ക്[b] ഇനി മന്ന ഉണ്ടായില്ല; ആ വർഷം അവർ കനാൻദേശത്തിലെ വിളവിൽനിന്ന് ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശത്തിലെ പഴയ വിളവിൽനിന്ന്.’ ഈ എബ്രായപദം മുൻവർഷത്തെ വിളവിൽനിന്നു സൂക്ഷിച്ചുവെച്ച ധാന്യത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാനും ഇടയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമുള്ള പരിഭാഷ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: നിന്നുപോയി
  rationale: ഇവിടെ שׁבת ശബ്ബത്ത് ആചരിക്കുക എന്നല്ല, ലഭിച്ചുകൊണ്ടിരുന്നത് അവസാനിക്കുക എന്ന അർഥത്തിലാണ്; ‘നിന്നുപോയി’ സ്വാഭാവികവും സംഭവത്തിന്റെ പെട്ടെന്നുള്ള അവസാനത്തെ വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: הַמָּן / מָן
  choice: മന്ന
  rationale: മരുഭൂമിയിൽ ലഭിച്ച ആഹാരത്തിനുള്ള മലയാളത്തിലെ സ്ഥാപിതമായ ബൈബിൾപദം.
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഭക്ഷണത്തിനു തുടർന്ന ദിവസത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ കാലപ്രയോഗം.
- source_word: בְּאָכְלָם
  choice: അവർ ... ഭക്ഷിച്ചതിന്റെ
  rationale: בְ + infinitive construct ഇവിടെ കാലബന്ധം പ്രകടിപ്പിക്കുന്നു; മന്ന നിലച്ചത് ദേശത്തിലെ വിളവ് ഭക്ഷിച്ചതിനെ തുടർന്നാണെന്ന ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: ദേശത്തിലെ വിളവിൽനിന്ന്
  rationale: עֲבוּר ദേശത്തു നിന്നുള്ള കാർഷിക ഉൽപ്പന്നത്തെ സൂചിപ്പിക്കുന്നു. ‘വിളവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്; മുൻവർഷത്തെ സൂക്ഷിച്ച വിളവ് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא הָיָה עוֹד
  choice: പിന്നെ ... ലഭിച്ചില്ല
  rationale: ഇനി മന്ന ഉണ്ടായിരുന്നില്ല എന്ന അസ്തിത്വാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: בני എന്ന ബന്ധപദത്തിന്റെ രൂപം നിലനിർത്തുകയും മലയാളത്തിലെ സ്ഥാപിതവും ഉൾക്കൊള്ളാവുന്നതുമായ സമൂഹനാമപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֹּאכְלוּ
  choice: അവർ ... ഭക്ഷിച്ചു
  rationale: ലളിതമായ എബ്രായ ആഖ്യാനഭൂതകാലത്തെ നേരിട്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִתְּבוּאַת
  choice: വിളവിൽനിന്ന്
  rationale: תְּבוּאָה കാർഷിക ഉൽപ്പാദനത്തെയോ വിളവിനെയോ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഉണ്ടായാലും ‘വിളവ്’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമാണ്.
- source_word: אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം
  rationale: ‘കനാന്റെ ദേശം’ എന്ന ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാള സംയുക്തനാമത്തിൽ പൂർണമായി നിലനിർത്തുന്നു.
- source_word: בַּשָּׁנָה הַהִיא
  choice: ആ വർഷം
  rationale: കാലസൂചനയുടെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
