reference: Joshua 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: ml
  text: അവർക്കു പകരമായി അവൻ ഉണ്ടായിത്തീർത്ത അവരുടെ പുത്രന്മാരെ[a] യോശുവ പരിച്ഛേദനം ചെയ്തു; അവർ പരിച്ഛേദനം ചെയ്യപ്പെടാത്തവരായിരുന്നു, കാരണം വഴിയിൽവെച്ച് അവർ അവരെ പരിച്ഛേദനം ചെയ്തിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ സ്ഥാനത്ത് അവൻ ഉണ്ടായിത്തീർത്ത അവരുടെ പുത്രന്മാരെ.” ഈ എബ്രായ പ്രയോഗം ഈ പുത്രന്മാർ മുൻതലമുറയ്ക്കു പകരക്കാരായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: അവരുടെ പുത്രന്മാരെ
  rationale: പരിച്ഛേദനത്തിന്റെ സന്ദർഭത്തിൽ בָּנִים ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: הֵקִים
  choice: അവൻ ഉയർത്തിയ
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ മുൻതലമുറയ്ക്കു പകരം അടുത്ത തലമുറയെ ഉയർത്തിനിർത്തിയതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന കർത്താവിന്റെ അവ്യക്തത നിലനിർത്താൻ ‘അവൻ’ ഉപയോഗിച്ചു.
- source_word: תַּחְתָּם
  choice: അവരുടെ സ്ഥാനത്ത്
  rationale: ഇവിടെ תַּחַת താഴെ എന്ന സ്ഥലാർഥത്തിലല്ല, പകരം/സ്ഥാനഗ്രഹണം എന്ന അർഥത്തിലാണ്.
- source_word: מָל
  choice: പരിച്ഛേദനം ചെയ്തു
  rationale: מוּל എന്നത് പരിച്ഛേദനം നടത്തുന്നതിനുള്ള പതിവു ക്രിയയാണ്; ആധുനിക മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: עֲרֵלִים
  choice: പരിച്ഛേദനം ഏൽക്കാത്തവർ
  rationale: ശാരീരികവും ഉടമ്പടിസംബന്ധവുമായ അവസ്ഥയെ വ്യക്തമായി അറിയിക്കുമ്പോൾ അസ്വാഭാവികമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: കാരണം ... അവർ അവരെ പരിച്ഛേദനം ചെയ്തിരുന്നില്ല
  rationale: രണ്ടാമത്തെ כִּי വിശദീകരണകാരണം നൽകുന്നു. מָלוּ എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നുതന്നെ നിലനിർത്തി.
- source_word: בַּדָּרֶךְ
  choice: യാത്രാമധ്യേ
  rationale: മരുഭൂമിയിലൂടെയുള്ള യാത്രക്കിടയിൽ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനമില്ലാത്ത ശാരീരിക-ഉടമ്പടി അവസ്ഥ
  choice: പരിച്ഛേദനം ഏൽക്കാത്തവർ
  alternative: അഗ്രചർമികൾ
  rationale: വാക്യം ആത്മീയ രൂപകത്തെക്കുറിച്ചല്ല, യഥാർഥ പരിച്ഛേദനത്തെക്കുറിച്ചാണ്. തെരഞ്ഞെടുത്ത രൂപം ഉടമ്പടിസന്ദർഭം നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുകയും ചെയ്യുന്നു.
- issue: הֵקִים എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ ഉയർത്തിയ
  alternative: യഹോവ ഉയർത്തിയ / അവർ ഉയർത്തിയ
  rationale: എബ്രായപാഠത്തിൽ ക്രിയ ഏകവചന പുല്ലിംഗമാണെങ്കിലും കർത്താവിനെ പേരെടുത്ത് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സാധ്യതയുള്ള ദൈവിക കർത്താവിനെ വ്യാഖ്യാനമായി ചേർക്കാതെ ഉറവിടത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ദൈർഘ്യമേറിയ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചെങ്കിലും കാരണബന്ധവും ആവർത്തനവും സംരക്ഷിച്ചു. [a] അടയാളം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
