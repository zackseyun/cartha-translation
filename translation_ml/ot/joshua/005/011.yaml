  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אכְל֜וּ מֵ/עֲב֥וּר הָ/אָ֛רֶץ מִ/מָּֽחֳרַ֥ת הַ/פֶּ֖סַח מַצּ֣וֹת וְ/קָל֑וּי בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: ml
  text: പെസഹയുടെ പിറ്റേന്നായ ആ ദിവസംതന്നെ അവർ ദേശത്തിലെ വിളവിൽനിന്ന്[a] പുളിപ്പില്ലാത്ത അപ്പവും വറുത്ത ധാന്യവും[b] ഭക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേശത്തിലെ പഴയ വിളവിൽനിന്ന്.’ എബ്രായപദത്തിന് ദേശത്തിന്റെ വിളവ് എന്നർഥമുണ്ട്; മുൻവിളവിൽനിന്നു സൂക്ഷിച്ചുവെച്ച വിളവാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നതെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഉണക്കിവറുത്ത ധാന്യം.’ ധാന്യം വറുത്ത് തയ്യാറാക്കിയതിനെ എബ്രായപദം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: അവർ ... ഭക്ഷിച്ചു
  rationale: אכל എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗം ആ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: ദേശത്തിലെ വിളവിൽനിന്ന്
  rationale: עֲבוּר ഇവിടെ ദേശത്തിന്റെ വിളവ് അഥവാ ഉൽപ്പന്നം എന്ന അടിസ്ഥാനാർഥത്തിലാണ്. מן എന്ന വിഭക്തിയുടെ ഭാഗികാർഥം ‘വിളവിൽനിന്ന്’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ‘പഴയ’ എന്ന ആശയം പാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: പെസഹയുടെ പിറ്റേന്ന്
  rationale: കാലസൂചനയായ ഈ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണിത്.
- source_word: מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: പെസഹാസന്ദർഭത്തിൽ מַצּוֹת എന്നതിന്റെ വ്യക്തവും പതിവുമായ മലയാള പരിഭാഷ.
- source_word: וְקָלוּי
  choice: വറുത്ത ധാന്യം
  rationale: קָלוּי ധാന്യം ചൂടിൽ വറുത്തോ ഉണക്കിവറുത്തോ തയ്യാറാക്കിയതിനെ സൂചിപ്പിക്കുന്നു. ‘വറുത്ത ധാന്യം’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന രൂപമാണ്.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ആ ദിവസംതന്നെയായിരുന്നു അത്
  rationale: בְּעֶצֶם എന്ന ഊന്നലും ‘ഈ ദിവസം’ എന്ന കൃത്യതയും മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ദൃഷ്ടികോണത്തിൽ ‘ആ ദിവസംതന്നെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെസഹ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി. മൂലത്തിലെ അവസാന ഊന്നൽ വേറൊരു ചെറുവാക്യമായി നൽകി; ഇതിലൂടെ ദിവസത്തിന്റെ കൃത്യതയും ഊന്നലും വ്യക്തമായി കേൾക്കുന്നു.
