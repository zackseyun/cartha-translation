  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: ml
  text: യോശുവ യെരീഹോവിനരികെ[a] ആയിരുന്നപ്പോൾ, അവൻ കണ്ണുയർത്തി നോക്കി. അതാ, ഒരാൾ കൈയിൽ ഊരിയ വാളുമായി യോശുവയുടെ എതിർവശത്ത് നിന്നു. യോശുവ അയാളുടെ അടുത്തുചെന്ന്, “നീ ഞങ്ങളുടെ പക്ഷത്താണോ, അതോ ഞങ്ങളുടെ ശത്രുക്കളുടെ പക്ഷത്താണോ?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെരീഹോവിൽ’ എന്നോ ‘യെരീഹോവിനു സമീപം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ മുൻപ്രത്യയം നഗരത്തിനകത്തെ ഒരു കൃത്യസ്ഥാനം മാത്രമല്ല, വിശാലമായ സ്ഥലബന്ധവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: ആയിരുന്നപ്പോൾ
  rationale: വിവരണത്തിലെ പുതിയ രംഗം ആരംഭിക്കുന്ന וַיְהִי എന്ന പ്രയോഗവും സമയസാഹചര്യം സൂചിപ്പിക്കുന്ന בִּהְיוֹת എന്ന രൂപവും സ്വാഭാവികമായ മലയാള സമയവാക്യത്തിൽ സംയോജിപ്പിക്കുന്നു; അർഥമില്ലാത്ത പദാനുപദ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: בִּירִיחוֹ
  choice: യെരീഹോവിനരികെ
  rationale: בְּ എന്ന മുൻപ്രത്യയം ഇവിടെ കൃത്യമായി നഗരത്തിനകത്ത് എന്നതിലുപരി വിശാലമായ സ്ഥലബന്ധം സൂചിപ്പിക്കാം. സൈനികസന്ദർഭത്തിൽ ‘അരികെ’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: അവൻ കണ്ണുയർത്തി നോക്കി
  rationale: എബ്രായത്തിലെ ദൃശ്യസമ്പന്നമായ പ്രയോഗവും തുടർന്നുള്ള കാണൽക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും രംഗത്തെ സജീവമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്ന കണികയുടെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: വാക്യം ആ വ്യക്തിയെ ഒരു മനുഷ്യനെന്ന നിലയിൽ മാത്രമാണ് ആദ്യം അവതരിപ്പിക്കുന്നത്. ‘യോദ്ധാവ്’, ‘ദൂതൻ’ തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട തിരിച്ചറിയലുകൾ ചേർക്കുന്നില്ല.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: അവന്റെ എതിർവശത്ത് നിൽക്കുന്നു
  rationale: לְנֶגֶד സൂചിപ്പിക്കുന്ന നേർക്കുനേർ/മുൻവശത്തുള്ള സ്ഥാനബന്ധവും സന്ദർഭത്തിലെ ഏറ്റുമുട്ടൽഭാവവും നിലനിർത്തുന്നു.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: ഊരിയ വാൾ കൈയിൽ പിടിച്ചുകൊണ്ട്
  rationale: ശയ്യയിൽനിന്ന് പുറത്തെടുത്ത, ഉപയോഗിക്കാൻ സജ്ജമായ വാളിന്റെ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו
  choice: യോശുവ അയാളുടെ അടുത്തുചെന്ന്
  rationale: ആ വ്യക്തിയിലേക്കുള്ള യോശുവയുടെ നീക്കം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: നീ ഞങ്ങളുടെ പക്ഷത്താണോ, അതോ ഞങ്ങളുടെ ശത്രുക്കളുടെ പക്ഷത്താണോ?
  rationale: לְ ഇവിടെ പക്ഷബന്ധമോ കൂറോ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ ‘പക്ഷത്ത്’യും ‘ശത്രുക്കൾ’യും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: യോശുവ നേരിട്ട ‘ആളുടെ’ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ നിർദിഷ്ട തിരിച്ചറിയൽ നൽകാതെ ‘ഒരാൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവദൂതൻ; യഹോവയുടെ ദൂതൻ; ദൈവപ്രത്യക്ഷത; ക്രിസ്തുവിന്റെ അവതാരപൂർവ പ്രത്യക്ഷത
  rationale: ഈ വാക്യം ആ വ്യക്തിയെ אִישׁ എന്നു മാത്രമാണ് പരിചയപ്പെടുത്തുന്നത്. തുടർന്നുള്ള സന്ദർഭം വിവിധ വ്യാഖ്യാനങ്ങൾക്ക് ഇടവരുത്താമെങ്കിലും, ഈ വാക്യത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ നിഗമനം പരിഭാഷയിൽ ചേർക്കാതിരിക്കുന്നത് യഥാർഥമായ പാഠസമ്മർദവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അതാ’, ‘കണ്ണുയർത്തി നോക്കി’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യസജീവത നിലനിർത്തുന്നു; എന്നാൽ പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കുന്നു.
