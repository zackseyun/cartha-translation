revisions:
- from: പുറപ്പെട്ടുവന്ന ജനമെല്ലാം പരിച്ഛേദന ഏറ്റവരായിരുന്നു. എന്നാൽ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടശേഷമുള്ള യാത്രയിൽ[a] മരുഭൂമിയിൽ ജനിച്ച ജനമെല്ലാം പരിച്ഛേദന ഏറ്റിരുന്നില്ല.
  to: കാരണം, ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന ജനമെല്ലാം പരിച്ഛേദനം ചെയ്യപ്പെട്ടവരായിരുന്നു; എന്നാൽ, ഈജിപ്തിൽനിന്ന് അവർ പുറപ്പെട്ടപ്പോൾ വഴിയിൽ മരുഭൂമിയിൽ ജനിച്ച ജനമെല്ലാം പരിച്ഛേദനം ചെയ്യപ്പെട്ടിരുന്നില്ല.[a]
  rationale: The revision restores the explanatory force of כִּי, retains the contrast introduced by וְ, and uses natural Malayalam passive wording for the circumcised condition. It gives the source’s compact journey/exit expression more closely in the main text and preserves the alternative syntactic and verbal-form details in a footnote, without imposing an overly definite temporal interpretation.
