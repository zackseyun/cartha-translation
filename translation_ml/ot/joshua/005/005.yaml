reference: Joshua 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: ml
  text: കാരണം, ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന ജനമെല്ലാം പരിച്ഛേദനം ചെയ്യപ്പെട്ടവരായിരുന്നു; എന്നാൽ, ഈജിപ്തിൽനിന്ന് അവർ പുറപ്പെട്ടപ്പോൾ വഴിയിൽ മരുഭൂമിയിൽ ജനിച്ച ജനമെല്ലാം പരിച്ഛേദനം ചെയ്യപ്പെട്ടിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഈജിപ്തിൽനിന്ന് അവർ പുറപ്പെടുമ്പോൾ വഴിയിൽ മരുഭൂമിയിൽ ജനിച്ച ജനമെല്ലാം പരിച്ഛേദനം ചെയ്തില്ല.’'
    reason: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם എന്ന പ്രയോഗത്തിലെ ‘വഴിയിൽ/യാത്രയിൽ’ എന്ന ഘടനയും ‘ഈജിപ്തിൽനിന്ന് പുറപ്പെടുമ്പോൾ’ എന്ന കാലബന്ധവും, കൂടാതെ ലֹא מָלוּ എന്ന സജീവ ഹീബ്രു രൂപവും സൂക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന ബന്ധം വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ നടപടിക്കുള്ള വിശദീകരണമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ച നിലനിർത്താൻ ‘കാരണം’ എന്നു നിർബന്ധമായി ചേർക്കാതെ വിശദീകരണബന്ധം പ്രകടമാക്കുന്നു.
- source_word: מֻלִים הָיוּ
  choice: പരിച്ഛേദന ഏറ്റവരായിരുന്നു
  rationale: היה സഹിതമുള്ള നിഷ്ക്രിയ കൃദന്തരൂപം, പുറപ്പെട്ട ജനത്തിന്റെ മുൻകൂട്ടിയുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הָעָם הַיֹּצְאִים
  choice: പുറപ്പെട്ടുവന്ന ജനമെല്ലാം
  rationale: עם എന്ന കൂട്ടായ അർഥവും, ഈജിപ്തിൽനിന്നു പുറപ്പെട്ട തലമുറയെ സൂചിപ്പിക്കുന്ന substantival participle-ഉം നിലനിർത്തുന്നു.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: എന്നാൽ ... ജനിച്ച ജനമെല്ലാം
  rationale: וְ ഇവിടെ രണ്ടു തലമുറകളെ വൈരുധ്യത്തോടെ ബന്ധിപ്പിക്കുന്നു; ‘എന്നാൽ’ ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാട് യാത്രയുടെ പശ്ചാത്തലത്തിലുള്ള מדבר എന്ന പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടശേഷമുള്ള യാത്രയിൽ
  rationale: ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടിനു ശേഷമുള്ള വഴിയാത്രയിലാണ് ജനനങ്ങൾ നടന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രു ഘടനയുടെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לֹא מָלוּ
  choice: പരിച്ഛേദന ഏറ്റിരുന്നില്ല
  rationale: ഹീബ്രുവിൽ ക്രിയ സജീവരൂപത്തിലാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല; സന്ദർഭത്തിലെ ശ്രദ്ധ ജനിച്ച തലമുറയുടെ പരിച്ഛേദനയില്ലാത്ത അവസ്ഥയിലാണ്. അതിനാൽ മലയാളത്തിലെ അവസ്ഥാസൂചകമായ നിഷ്ക്രിയപ്രയോഗം യോജിക്കുന്നു.
