source:
  edition: WLC
  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ പുത്രന്മാർ[a] ഗിൽഗാലിൽ പാളയമിറങ്ങി. ആ മാസത്തിന്റെ പതിനാലാം ദിവസം വൈകുന്നേരം അവർ യെരീഹോയുടെ സമതലങ്ങളിൽ പെസഹ ആചരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേല്യർ” എന്നോ “ഇസ്രായേലിന്റെ മക്കൾ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയ പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപരവും പുല്ലിംഗ ബഹുവചനവുമായ പ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള בְ എന്ന ഉപസർഗം ഇവിടെ ‘ഗിൽഗാലിൽ’ എന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: പെസഹ ആചരിച്ചു
  rationale: പെസഹയോടൊപ്പം עשה ഉപയോഗിക്കുമ്പോൾ ആ ഉത്സവം അനുഷ്ഠിക്കുക എന്നതാണ് ആശയം; ‘ആചരിച്ചു’ ആ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: הַפֶּסַח
  choice: പെസഹ
  rationale: ഈ ഉത്സവത്തിനും അതുമായി ബന്ധപ്പെട്ട അനുഷ്ഠാനത്തിനും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദമാണ് ‘പെസഹ’.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പതിനാലാം ദിവസം
  rationale: എബ്രായ കലണ്ടർപ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: בָּעֶרֶב
  choice: വൈകുന്നേരം
  rationale: അനുഷ്ഠാനത്തിന്റെ സമയം സൂചിപ്പിക്കുന്ന עֶרֶב എന്ന പദത്തിന് സന്ദർഭോചിതമായ ആധുനിക മലയാളം.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: യെരീഹോയുടെ സമതലങ്ങളിൽ
  rationale: עֲרָבוֹת എന്നത് സമതലമോ പുൽമേടുപോലുള്ള താഴ്ന്ന പ്രദേശമോ സൂചിപ്പിക്കുന്നു; ഇവിടെ ഭൂമിശാസ്ത്രപരമായി ‘സമതലങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ മക്കൾ
  rationale: പ്രത്യേകമായ ഉപദേശവ്യത്യാസം ഇവിടെ ഇല്ലെങ്കിലും, മൂലപാഠത്തിലെ കുടുംബബന്ധപരവും പുല്ലിംഗ ബഹുവചനവുമായ രൂപം ‘ഇസ്രായേൽപുത്രന്മാർ’ കൂടുതൽ സുതാര്യമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ ബന്ധപരമായ ‘ഇസ്രായേൽപുത്രന്മാർ’ നിലനിർത്തിയെങ്കിലും, വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പ്രയോഗത്തിന് പിന്നാലെയല്ലാതെ വാക്യാവസാനത്ത് വരുന്നത് ഒഴിവാക്കി, ‘ഇസ്രായേൽപുത്രന്മാർ[a]’ എന്നായി സ്ഥാപിക്കേണ്ടതാണ്.
