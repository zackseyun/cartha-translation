  rationale: The revision removes the unintended active-agent implication and renders the source’s passive/reflexive circumcision construction naturally in Malayalam. It also smooths the locative idiom without reducing its sense of remaining where they were. The footnote continues to signal the possible senses of restoration, healing, or revival.
