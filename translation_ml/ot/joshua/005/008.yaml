translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരിച്ഛേദനം’ എന്ന സ്ഥാപിത ബൈബിൾ പദവും ‘പാളയം’ എന്ന പൊതുവേ മനസ്സിലാകുന്ന പദവും ഉപയോഗിച്ചു. മൂലത്തിലെ കൂട്ടായ ഏകവചനഭാവം ‘ജനത്തെ മുഴുവനും’ എന്നതിലൂടെ നിലനിർത്തി.
