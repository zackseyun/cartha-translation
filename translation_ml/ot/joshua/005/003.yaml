  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സാങ്കേതികമായ ‘പരിച്ഛേദനം’ നിലനിർത്തി; അപരിചിതമായ സ്ഥലനാമത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
