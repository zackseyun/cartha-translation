id: JOS.5.6
reference: Joshua 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇസ്രായേൽമക്കൾ മരുഭൂമിയിൽ നാല്പതു വർഷം സഞ്ചരിച്ചു; ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട, യുദ്ധത്തിനു പോകുന്ന പുരുഷന്മാരായ ആ ജനത മുഴുവനും അവസാനിച്ചുപോകുന്നതുവരെ അവർ അങ്ങനെ സഞ്ചരിച്ചു. അവർ യഹോവയുടെ ശബ്ദം കേൾക്കാതിരുന്നതിനാൽ, യഹോവ അവരോടു സത്യംചെയ്തിരുന്നത്, അവരുടെ പിതാക്കന്മാരോടു ഞങ്ങൾക്കു[a] നൽകാമെന്ന് യഹോവ സത്യംചെയ്തിരുന്ന, പാലും തേനും ഒഴുകുന്ന ദേശം അവർക്കു കാണാൻ അനുവദിക്കുകയില്ല എന്നാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “ഞങ്ങൾക്കു”; ചില പുരാതന ഭാഷാന്തരങ്ങളും പരിഭാഷകളും “അവർക്ക്” എന്നു വായിക്കുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָלְכוּ
  choice: സഞ്ചരിച്ചു
  rationale: നാല്പതു വർഷത്തെ മരുഭൂമിയാത്രയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘നടന്നു’ എന്ന അത്യന്തം പദാനുപദമായ രൂപത്തേക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ബന്ധപരമായ രൂപം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെയും ഇസ്രായേലിന്റെ അലച്ചിലിന്റെ പശ്ചാത്തലത്തെയും സൂചിപ്പിക്കുന്ന സാധാരണ മലയാള പദം.
- source_word: עַד תֹּם
  choice: ഒടുങ്ങിപ്പോകുന്നതുവരെ
  rationale: കൂട്ടം പൂർണമായി അവസാനിച്ചെന്ന ആശയം നിലനിർത്തുന്നു; അവരുടെ മരണരീതിയെ മൂലപാഠത്തേക്കാൾ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: כָּל הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധപുരുഷന്മാരായ ജനത മുഴുവനും
  rationale: ‘ജനത’ എന്ന കൂട്ടായ പരാമർശവും അതിനെ വിശദീകരിക്കുന്ന ‘യുദ്ധപുരുഷന്മാർ’ എന്ന പ്രയോഗവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: യഹോവയുടെ ശബ്ദത്തിനു ചെവികൊടുത്തില്ല
  rationale: കേൾക്കലിന്റെയും അനുസരണത്തിന്റെയും ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകത്വം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: കാണാൻ അവരെ അനുവദിക്കുകയില്ലെന്ന് ... സത്യംചെയ്തിരുന്നു
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ശപഥത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: പാലും തേനും ഒഴുകുന്ന ദേശം
  rationale: മൂലരൂപകം കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്ന പരിചിതമായ മലയാള പ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുപദവിയല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വ്യക്തിനാമം സംരക്ഷിച്ചു.
- issue: לָנוּ എന്ന ഒന്നാംപുരുഷ ബഹുവചന സർവനാമം
  choice: നമുക്ക്
  alternative: അവർക്ക്
  rationale: മസോററ്റിക് പാഠത്തിലെ യഥാർഥമായ ഒന്നാംപുരുഷ ബഹുവചനം തിരുത്താതെ നിലനിർത്തി. സന്ദർഭത്തിൽ പ്രതീക്ഷിക്കാവുന്ന മൂന്നാംപുരുഷ വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, പാഠത്തിലെ സംഘർഷം മറച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ വാക്യം ഗ്രഹിക്കാനായി മലയാളത്തിൽ മൂന്ന് വാക്യങ്ങളാക്കി; കാരണം, ശപഥം, വാഗ്ദത്തദേശം എന്നീ ആശയബന്ധങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അത് വിശദീകരിക്കുന്ന ‘നമുക്ക്’ എന്ന പദത്തിനുതന്നെ ചേർത്തു.
