revisions:
- from: എന്തെന്നാൽ, ഇസ്രായേൽമക്കൾ നാല്പതു വർഷം മരുഭൂമിയിൽ സഞ്ചരിച്ചു. ഈജിപ്തിൽനിന്നു പുറപ്പെട്ടുവന്ന യുദ്ധപുരുഷന്മാരായ ജനത മുഴുവനും ഒടുങ്ങിപ്പോകുന്നതുവരെ അങ്ങനെ സംഭവിച്ചു; അവർ യഹോവയുടെ ശബ്ദത്തിനു ചെവികൊടുത്തില്ല. അതുകൊണ്ട്, യഹോവ അവരുടെ പിതാക്കന്മാരോടു നമുക്ക്[a] നൽകാമെന്ന് സത്യംചെയ്തിരുന്ന, പാലും തേനും ഒഴുകുന്ന ദേശം കാണാൻ അവരെ അനുവദിക്കുകയില്ലെന്ന് യഹോവ അവരോടു സത്യംചെയ്തിരുന്നു.
  to: എന്തെന്നാൽ, ഇസ്രായേൽമക്കൾ മരുഭൂമിയിൽ നാല്പതു വർഷം സഞ്ചരിച്ചു; ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട, യുദ്ധത്തിനു പോകുന്ന പുരുഷന്മാരായ ആ ജനത മുഴുവനും അവസാനിച്ചുപോകുന്നതുവരെ അവർ അങ്ങനെ സഞ്ചരിച്ചു. അവർ യഹോവയുടെ ശബ്ദം കേൾക്കാതിരുന്നതിനാൽ, യഹോവ അവരോടു സത്യംചെയ്തിരുന്നത്, അവരുടെ പിതാക്കന്മാരോടു ഞങ്ങൾക്കു[a] നൽകാമെന്ന് യഹോവ സത്യംചെയ്തിരുന്ന, പാലും തേനും ഒഴുകുന്ന ദേശം അവർക്കു കാണാൻ അനുവദിക്കുകയില്ല എന്നാണ്.
  rationale: The revision makes the “until all the nation … had come to an end” relationship explicit, removes an unnecessary inferential connector, and uses more natural modern Malayalam for the fighting men. It preserves the Hebrew’s restrained “came to an end” sense, the repeated divine name, the two distinct oaths, and the difficult first-person plural reading with its footnote anchored directly to the pronoun.
