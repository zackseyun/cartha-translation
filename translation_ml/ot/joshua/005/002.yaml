source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: ml
  text: 'ആ സമയത്ത് യഹ്‌വെ യോശുവയോടു പറഞ്ഞു: “നിനക്കുവേണ്ടി തീക്കല്ലുകൊണ്ടുള്ള കത്തികൾ[a] ഉണ്ടാക്കുക. എന്നിട്ട് ഇസ്രായേലിന്റെ പുത്രന്മാരെ[b] വീണ്ടും—രണ്ടാം പ്രാവശ്യം[c]—പരിച്ഛേദന ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തീക്കല്ലിന്റെ കത്തികൾ.” പരിച്ഛേദനയ്ക്കായി ഇവിടെ ഉപയോഗിക്കുന്ന, തീക്കല്ലിൽ നിർമിച്ച മുറിക്കുപകരണങ്ങളെയാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; പൊതുവായി “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “രണ്ടാം പ്രാവശ്യം” എന്നത് ഒരേ വ്യക്തികളെ രണ്ടുതവണ പരിച്ഛേദന ചെയ്യുക എന്നല്ല; ഇസ്രായേൽജനതയിൽ പരിച്ഛേദനം വീണ്ടും നടപ്പാക്കുക എന്നതാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: കഥാസന്ദർഭത്തിലെ സമയത്തെ പരിചയപ്പെടുത്തുന്ന സാധാരണ എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עֲשֵׂה לְךָ
  choice: നിനക്കുവേണ്ടി ... ഉണ്ടാക്കുക
  rationale: ആജ്ഞാരൂപത്തോടു ചേർന്ന ദാതൃസർവനാമത്തിന്റെ സ്വയംപ്രയോജനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חַרְבוֹת צֻרִים
  choice: തീക്കല്ലുകൊണ്ടുള്ള കത്തികൾ
  rationale: חַרְבוֹת ഇവിടെ വാളുകളെക്കാൾ മുറിക്കാനുള്ള കത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; צֻרִים അവ തീക്കല്ലിൽ നിർമിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְשׁוּב
  choice: വീണ്ടും
  rationale: ‘മടങ്ങുക’ എന്ന അടിസ്ഥാനാർഥമുള്ള പദം പിന്നാലെയുള്ള ആജ്ഞയോടൊപ്പം ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമായി പ്രവർത്തിക്കുന്നു.
- source_word: מֹל
  choice: പരിച്ഛേദന ചെയ്യുക
  rationale: ഉടമ്പടിസന്ദർഭത്തിലെ ക്രിയയുടെ നേരിട്ടുള്ളതും മലയാളത്തിൽ പ്രചാരമുള്ളതുമായ പരിഭാഷ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ പുത്രന്മാർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗപ്രയോഗവും പരിച്ഛേദനയുടെ നേരിട്ടുള്ള സ്വീകർത്താക്കൾ പുരുഷന്മാരാണെന്ന സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ആവർത്തനത്തെ പ്രത്യേകം ഊന്നുന്ന പദം ഒഴിവാക്കാതെ പ്രതിനിധീകരിക്കുന്നു; וְשׁוּב എന്നതിന്റെ ‘വീണ്ടും’ എന്ന ആശയവും വേറിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് ഉള്ളത്; അതിനാൽ ആ വ്യക്തിനാമം ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗരൂപവും പരിച്ഛേദനയുടെ സന്ദർഭത്തിൽ പുരുഷന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന വസ്തുതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- issue: ‘വീണ്ടും—രണ്ടാം പ്രാവശ്യം’ എന്ന ആവർത്തനപ്രയോഗം
  choice: മൂലത്തിലെ രണ്ട് ആവർത്തനസൂചനകളും നിലനിർത്തി
  alternative: വീണ്ടും പരിച്ഛേദന ചെയ്യുക; രണ്ടാം പ്രാവശ്യം പരിച്ഛേദന ചെയ്യുക
  rationale: וְשׁוּב, שֵׁנִית എന്നീ രണ്ട് ഘടകങ്ങളും മൂലത്തിൽ ഉള്ളതിനാൽ ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കുന്നില്ല; ഇത് അതേ വ്യക്തികളെ രണ്ടുതവണ പരിച്ഛേദന ചെയ്യണമെന്നല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘വീണ്ടും/രണ്ടാം പ്രാവശ്യം’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം ദീർഘരേഖകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി; സാങ്കേതിക പദമായ ‘പരിച്ഛേദന’ പൊതുവായ ബൈബിൾപ്രയോഗത്തോട് യോജിക്കുന്നു.
