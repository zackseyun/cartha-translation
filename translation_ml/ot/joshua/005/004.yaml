base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: ml
  text: 'യോശുവ അവരെ പരിച്ഛേദനം ചെയ്തതിന്റെ കാരണം ഇതാണ്: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന ജനത്തിലെ പുരുഷന്മാരായ യുദ്ധവീരന്മാർ എല്ലാവരും[a], ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടശേഷം വഴിമധ്യേ മരുഭൂമിയിൽവെച്ച് മരിച്ചുപോയിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യുദ്ധത്തിന്റെ പുരുഷന്മാർ എല്ലാവരും”; “യോദ്ധാക്കൾ എല്ലാവരും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: യോശുവ അവരെ പരിച്ഛേദനം ചെയ്തതിന്റെ കാരണം ഇതാണ്
  rationale: ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇതാണ് കാര്യം’ എന്നാണെങ്കിലും, ഇവിടെ യോശുവയുടെ പ്രവൃത്തിക്കുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിൽനിന്ന് ‘അവരെ’ ചേർത്തിരിക്കുന്നു.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന ജനത്തിലെ പുരുഷന്മാർ
  rationale: ‘ജനമെല്ലാം’ എന്നതിനെ തുടർന്ന് വരുന്ന ‘ആണുങ്ങൾ’ ആ ജനത്തിലെ പുരുഷവിഭാഗത്തെ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി ബന്ധിപ്പിച്ചു.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധവീരന്മാർ എല്ലാവരും
  rationale: സൈനികമായി യുദ്ധത്തിൽ പങ്കെടുക്കുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: מֵתוּ בַמִּדְבָּר בַדֶּרֶךְ
  choice: വഴിമധ്യേ മരുഭൂമിയിൽവെച്ചു മരിച്ചുപോയിരുന്നു
  rationale: യോശുവയുടെ നടപടിക്ക് മുമ്പേ സംഭവിച്ച മരണം ‘മരിച്ചുപോയിരുന്നു’ എന്ന പൂർവകാലരൂപം വ്യക്തമാക്കുന്നു; בַּדֶּרֶךְ യാത്രയ്ക്കിടയിലെ സംഭവമെന്ന നിലയിൽ ‘വഴിമധ്യേ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടശേഷം
  rationale: പുറപ്പാടിനു ശേഷമുള്ള യാത്രാകാലത്താണ് മരണം സംഭവിച്ചതെന്ന സന്ദർഭക്രമം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. ഹീബ്രുവിലെ വിശദീകരണാത്മക ശൈലി സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; സൈനിക പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
