id: JOS.5.9
reference: Joshua 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: ml
  text: 'യഹ്‌വെ യോശുവയോടു പറഞ്ഞു: “ഇന്ന് ഞാൻ ഈജിപ്തിന്റെ നിന്ദ[a] നിങ്ങളുടെ മേൽനിന്ന് ഉരുട്ടിക്കളഞ്ഞിരിക്കുന്നു.” അതുകൊണ്ട് ആ സ്ഥലത്തിന് ഗിൽഗാൽ[b] എന്നു പേരിട്ടു; ഇന്നുവരെയും അതാണ് അതിന്റെ പേര്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈജിപ്തിന്റെ അപമാനം” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം ഈജിപ്തിലെ ഇസ്രായേലിന്റെ പഴയ ലജ്ജയെയോ, ഈജിപ്തിൽനിന്നുണ്ടായ നിന്ദയെയോ, ഇപ്പോൾ നീക്കപ്പെട്ട ഉടമ്പടിപരമായ അപമാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഗിൽഗാൽ” എന്ന എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദം “ഉരുട്ടിക്കളഞ്ഞു” എന്നർഥമുള്ള ക്രിയയുടെ ശബ്ദത്തോട് സാമ്യമുള്ളതിനാൽ ഇവിടെ ഒരു പദക്രീഡയുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിലെ നാല് വ്യഞ്ജനാക്ഷരങ്ങളെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: גַּלּוֹתִי
  choice: ഞാൻ ... ഉരുട്ടിക്കളഞ്ഞിരിക്കുന്നു
  rationale: גלל എന്ന ധാതുവിന്റെ ‘ഉരുട്ടുക/ഉരുട്ടിക്കളയുക’ എന്ന ദൃശ്യഭാവവും ഗിൽഗാൽ എന്ന സ്ഥലനാമത്തോടുള്ള ശബ്ദക്രീഡയും നിലനിർത്തുന്നു.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: ഈജിപ്തിന്റെ നിന്ദ
  rationale: ‘നിന്ദ, അപമാനം, ലജ്ജ’ എന്നീ അർഥസാധ്യതകളുള്ള പ്രയോഗത്തിന്റെ ബന്ധം—ഈജിപ്തുമായി ബന്ധപ്പെട്ട നിന്ദയോ ഈജിപ്ത് ചുമത്തിയ നിന്ദയോ—വ്യക്തമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: מֵעֲלֵיכֶם
  choice: നിങ്ങളുടെ മേൽനിന്ന്
  rationale: നിന്ദ അവരുടെമേൽ കിടന്നിരുന്ന ഒന്നുപോലെ നീക്കപ്പെടുന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: അതുകൊണ്ട് ആ സ്ഥലത്തിന് ഗിൽഗാൽ എന്നു പേരിട്ടു
  rationale: പേരിടലിന്റെ ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; മൂലപാഠത്തിൽ ക്രിയയുടെ കർത്താവ് പരോക്ഷമായതിനാൽ ആരാണു പേരിട്ടതെന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അതാണ് അതിന്റെ പേര്
  rationale: ആഖ്യാതാവിന്റെ കാലദൃഷ്ടി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഈജിപ്തിന്റെ നിന്ദ’ എന്നതിന്റെ അർഥം
  choice: ഈജിപ്തുമായുള്ള ബന്ധം ഉദ്ദേശപൂർവം വിശാലമായി നിലനിർത്തി.
  alternative: ഈജിപ്തിലെ അടിമത്തത്തിന്റെ ലജ്ജ; ഈജിപ്തുകാർ ഇസ്രായേലിന്മേൽ ചുമത്തിയ നിന്ദ; പരിച്ഛേദനയില്ലായ്മയുമായി ബന്ധപ്പെട്ട ഉടമ്പടിപരമായ അപമാനം.
  rationale: חֶרְפַּת מִצְרַיִם എന്ന എബ്രായ പ്രയോഗം ഇവയിൽ ഒന്നിനെ മാത്രം വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ ഒരു ചരിത്രപരമോ ദൈവശാസ്ത്രപരമോ ആയ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മേൽനിന്ന് ഉരുട്ടിക്കളഞ്ഞിരിക്കുന്നു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കെ മൂലപാഠത്തിലെ ദൃശ്യരൂപവും സ്ഥലനാമത്തോടുള്ള പദക്രീഡയും സംരക്ഷിക്കുന്നു.
