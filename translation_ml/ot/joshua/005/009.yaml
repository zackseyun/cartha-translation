  source_fidelity: 'The translation accurately represents the Hebrew: Yahweh''s speech to Joshua, the temporal emphasis "today," the rolling-away imagery of גַּלּוֹתִי, the deliberately open genitive in "the reproach of Egypt," the imagery of removal "from upon you," and the continuing-place-name formula "to this day." The implicit subject in the naming clause is appropriately left unspecified.'
