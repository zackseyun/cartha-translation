  source_fidelity: 'The verse’s sequence is retained: Yahweh delivers the enemy into Israel’s power; Israel strikes them, pursues them to the three stated locations, and strikes them again, leaving no survivor. The final impersonal Malayalam construction appropriately avoids assigning a singular or plural subject to the Hebrew infinitive הִשְׁאִיר, whose form itself does not mark number.'
