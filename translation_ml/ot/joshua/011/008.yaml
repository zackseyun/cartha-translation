source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: ml
  text: യഹ്‌വെ അവരെ ഇസ്രായേലിന്റെ കൈയിൽ ഏൽപ്പിച്ചു. ഇസ്രായേല്യർ അവരെ അടിച്ചുവീഴ്ത്തി, വലിയ സീദോൻ വരെയും മിസ്രെഫോത്ത്-മയീം[a] വരെയും കിഴക്കുള്ള മിസ്പെ താഴ്വര വരെയും അവരെ പിന്തുടർന്നു. അവരിൽ ഒരുവനെയും ശേഷിപ്പിക്കാതെ അവരെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മിസ്രെഫോത്ത്-മയീം” ഒരു സ്ഥലനാമമാണ്; എബ്രായപദങ്ങൾക്ക് “ജലങ്ങളുടെ ദഹനങ്ങൾ” എന്ന ശാബ്ദിക അർഥം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: അവരെ ഇസ്രായേലിന്റെ കൈയിൽ ഏൽപ്പിച്ചു
  rationale: സൈനികസന്ദർഭത്തിലെ ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗം മറ്റൊരാളുടെ അധികാരത്തിൽ ഏൽപ്പിക്കുക എന്നർഥം നൽകുന്നു; ‘കൈ’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിൽ נכה അടിച്ചുവീഴ്ത്തുന്നതും മാരകമായി പരാജയപ്പെടുത്തുന്നതും സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചിരിക്കുന്ന ക്രിയ ഒരേവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּרְדְּפוּם
  choice: അവരെ പിന്തുടർന്നു
  rationale: ഓടിപ്പോകുന്ന ശത്രുവിനെ പിന്തുടരുക എന്ന רדף എന്ന ക്രിയയുടെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം.
- source_word: צִידוֹן רַבָּה
  choice: മഹാ സീദോൻ
  rationale: നഗരനാമത്തെ വിശേഷിപ്പിക്കുന്ന רבהയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: മിസ്രെഫോത്ത്-മയീം
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; പദങ്ങളുടെ സാദ്ധ്യമായ ശാബ്ദിക അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: കിഴക്കുള്ള മിസ്പെ താഴ്വര
  rationale: בקעה വിശാലമായ താഴ്വരയെ സൂചിപ്പിക്കുന്നു; מזרחהയുടെ ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: അവരിൽ ഒരുവനെയും ശേഷിപ്പിക്കാതെ
  rationale: ശേഷിച്ചവനായി ആരെയും വിടാതിരിക്കുക എന്ന ഫലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എബ്രായ infinitive രൂപം കർത്താവിന്റെ വചനവ്യാകരണസംഖ്യ വ്യക്തമാക്കാത്തതിനാൽ അനാവശ്യമായി ‘അവൻ/അവർ’ എന്നു നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: അവസാന ഉപവാക്യത്തിലെ പ്രവർത്തകന്റെ തിരിച്ചറിയൽ
  choice: കർത്താവിനെ പ്രത്യേകം പറയാത്ത ‘ശേഷിപ്പിക്കാതെ’ എന്ന ഘടന
  alternative: അവർ ഒരുവനെയും ശേഷിപ്പിച്ചില്ല / അവൻ ഒരുവനെയും ശേഷിപ്പിച്ചില്ല
  rationale: הִשְׁאִיר ഇവിടെ infinitive ആയതിനാൽ അതിൽ സ്വതന്ത്രമായി ഏകവചനമോ ബഹുവചനമോ അടയാളപ്പെടുത്തിയിട്ടില്ല; സന്ദർഭത്തിൽ ഇസ്രായേല്യരാണ് പ്രവർത്തകർ എന്നു മനസ്സിലാകുമ്പോഴും മൂലത്തിലെ രൂപത്തെക്കാൾ കൂടുതൽ വ്യക്തത നിർബന്ധിച്ച് ചേർക്കാതിരിക്കാൻ കർത്താവില്ലാത്ത സ്വാഭാവിക മലയാളഘടന സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; സംഭവക്രമവും ആവർത്തനവും നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
