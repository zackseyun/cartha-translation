id: JOS.11.23
reference: Joshua 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: ml
  text: അങ്ങനെ, യഹോവ മോശെയോടു പറഞ്ഞതെല്ലാം അനുസരിച്ച് യോശുവ ദേശം മുഴുവനും[a] കൈവശപ്പെടുത്തി. യോശുവ അത് ഇസ്രായേലിന് അവരുടെ ഗോത്രവിഭാഗങ്ങൾക്കനുസരിച്ച് അവകാശമായി കൊടുത്തു. ദേശത്തിന് യുദ്ധത്തിൽനിന്ന് സ്വസ്ഥത ലഭിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശമെല്ലാം.’ ഇവിടെ പറയുന്നത് ഈ വിവരണത്തിന്റെ പരിധിയിലുള്ള ദേശത്തെക്കുറിച്ചുള്ള ജയസംഗ്രഹമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ദേശം യുദ്ധത്തിൽനിന്ന് ശാന്തമായിരുന്നു.’ എബ്രായപ്രയോഗം സംഘർഷത്തിനുശേഷമുള്ള സ്വസ്ഥതയെയോ ശാന്തതയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൈവശപ്പെടുത്തി
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണ്; ഈ ജയസംഗ്രഹത്തിൽ മലയാളത്തിലെ ‘കൈവശപ്പെടുത്തി’ ഭൂമി തന്റെ അധീനതയിലാക്കിയെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ ‘പൂർണമായി കീഴടക്കി’ എന്ന അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: כָּל הָאָרֶץ
  choice: ദേശം മുഴുവനും
  rationale: ഇവിടെ אֶרֶץ ഭൂമിയെയാകെ അല്ല, വിവരണത്തിലുള്ള ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദേശം മുഴുവനും’ എബ്രായത്തിലെ സമഗ്രതാവകാശം നിലനിർത്തുന്നു; അതിന്റെ പരിധി വിവർത്തനം തന്നെ തീർപ്പാക്കുന്നില്ല.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതൊക്കെയും അനുസരിച്ച്
  rationale: כְּכֹל אֲשֶׁר മുൻപ് പറഞ്ഞ വചനത്തോടുള്ള പൂർണ അനുരൂപത സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּתְּנָהּ
  choice: അത് ... കൊടുത്തു
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ദേശത്തേക്കു മടങ്ങുന്നു. נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കൊടുത്തു’ നിലനിർത്തുന്നു; വിഭജനത്തിന്റെ ആശയം പിന്നാലെയുള്ള വാക്കുകൾ നൽകുന്നു.
- source_word: לְנַחֲלָה
  choice: അവകാശമായി
  rationale: נַחֲלָה തലമുറകളിലേക്കുള്ള അവകാശസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘അവകാശമായി’ അതിന്റെ നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം സംക്ഷിപ്തമായി വഹിക്കുന്നു.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: അവരുടെ ഗോത്രങ്ങൾക്കനുസരിച്ചുള്ള വിഭാഗങ്ങളായി
  rationale: מַחְלְקוֹת വിഭജിക്കപ്പെട്ട ഭാഗങ്ങളെയോ വിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുകയും לְשִׁבְטֵיהֶם ഗോത്രക്രമം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ രണ്ടും ബന്ധപ്പെടുത്തി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: യുദ്ധത്തിൽനിന്ന് സ്വസ്ഥത ലഭിച്ചു
  rationale: שקט സംഘർഷം അവസാനിച്ചതിനെത്തുടർന്നുള്ള ശാന്തതയോ വിശ്രമമോ സൂചിപ്പിക്കുന്നു. ‘സ്വസ്ഥത ലഭിച്ചു’ പ്രധാന യുദ്ധപ്രവർത്തനങ്ങളുടെ വിരാമം പ്രകടിപ്പിക്കുന്നു; സമ്പൂർണവും ശാശ്വതവുമായ സമാധാനം അനിവാര്യമായി സൂചിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദേശം മുഴുവനും’ എന്ന ജയസംഗ്രഹത്തിന്റെ വ്യാപ്തി
  choice: യഹോവയുടെ വചനനിവൃത്തിയായി യോശുവ വിവരണത്തിലുള്ള ദേശം കൈവശപ്പെടുത്തിയെന്ന ആഖ്യാനസംഗ്രഹം അതേ ശക്തിയോടെ നിലനിർത്തി.
  alternative: ഓരോ പ്രദേശവും ഉടൻതന്നെ പൂർണമായി അധിവസിക്കപ്പെട്ടു എന്ന കർശനമായ അർഥം; അല്ലെങ്കിൽ വെറും അതിശയോക്തിയായ വിജയപ്രസ്താവം.
  rationale: എബ്രായം സമഗ്രമായ ഒരു ആഖ്യാനസംഗ്രഹം നൽകുന്നു. ശേഷിച്ച പ്രദേശങ്ങളെക്കുറിച്ചുള്ള മറ്റു വചനങ്ങളുമായുള്ള പിരിമുറുക്കം പരിഭാഷയിൽ വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ ‘ദേശം മുഴുവനും’ എന്നു നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്തു’, ‘അവകാശം’, ‘സ്വസ്ഥത’ തുടങ്ങിയ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. എബ്രായത്തിലെ ആവർത്തിച്ച ‘യോശുവ’യും വാക്യഘടനയും വ്യക്തതയ്ക്കായി നിലനിർത്തി.
