  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: ml
  text: 'അങ്ങനെ യോശുവ ഈ ദേശം മുഴുവനും കൈവശപ്പെടുത്തി: മലനാട്, നെഗെവ് മുഴുവനും, ഗോശെൻദേശം മുഴുവനും[c], താഴ്ന്ന പ്രദേശം[a], അരാബാ[b], ഇസ്രായേലിന്റെ മലനാട്, അതിന്റെ താഴ്ന്ന പ്രദേശം എന്നിവയെല്ലാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താഴ്ന്ന പ്രദേശം’ എന്നതിന് ‘ഷെഫേലാ’ എന്നും പരിഭാഷപ്പെടുത്താം. മധ്യമലനാടിനും തീരസമതലത്തിനും ഇടയിലുള്ള താഴ്ന്ന കുന്നിൻമേഖലയെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്. വാക്യത്തിന്റെ അവസാനത്തിലും ഇതേ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അരാബാ’ ഒരു പ്രാദേശിക ഭൂമിശാസ്ത്രനാമമാണ്; ചിലർ അതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘യോർദ്ദാൻ താഴ്വര’ എന്നോ ‘മരുസമതലം’ എന്നോ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെയുള്ള ‘ഗോശെൻദേശം’ കനാനിലെ ഒരു പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അത് ഈജിപ്തിലെ ഗോശെൻ തന്നെയായിരിക്കണമെന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൈവശപ്പെടുത്തി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ സൈനികജയത്തിന്റെ സംഗ്രഹസന്ദർഭത്തിൽ ‘കൈവശപ്പെടുത്തി’ എന്നത് സ്വാഭാവികവും പ്രസക്തവുമാണ്; ‘നശിപ്പിച്ചു’ എന്നതുപോലുള്ള അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം മുഴുവനും
  rationale: אֶרֶץ എന്നതിന്റെ വിശാലമായ പ്രദേശാർഥവും הַזֹּאת എന്ന സൂചകത്തിന്റെ ബലവും നിലനിർത്തുന്നു.
- source_word: הָהָר
  choice: മലനാട്
  rationale: ഇവിടെ ഒറ്റപ്പെട്ട പർവതങ്ങളെയല്ല, ഉയർന്ന ഭൂപ്രദേശമേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘മലനാട്’ സ്വാഭാവികമായ പ്രാദേശിക പദമാണ്.
- source_word: הַנֶּגֶב
  choice: നെഗെവ്
  rationale: ഇത് പൊതുവായ ‘തെക്ക്’ എന്നതിലുപരി ഒരു നിർദിഷ്ട ഭൂമിശാസ്ത്രമേഖലയായതിനാൽ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: ഗോശെൻദേശം
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗമായ ‘ഗോശെന്റെ ദേശം’ മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമാക്കുന്നു; അത് ഏതു ഗോശെനാണെന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: הַשְּׁפֵלָה
  choice: താഴ്ന്ന പ്രദേശം
  rationale: മധ്യമലനാടിനും തീരസമതലത്തിനും ഇടയിലുള്ള താഴ്ന്ന കുന്നിൻപ്രദേശത്തെ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു; പ്രാദേശിക നാമമായ ‘ഷെഫേലാ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָעֲרָבָה
  choice: അരാബാ
  rationale: עֲרָבָה ഇവിടെ പ്രത്യേക ഭൂമിശാസ്ത്രനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ വ്യാഖ്യാനാത്മകമായി ‘യോർദ്ദാൻ താഴ്വര’ എന്നു ചുരുക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: הַר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മലനാട്
  rationale: הַר എന്നതിന്റെ പ്രാദേശിക അർഥവും יִשְׂרָאֵל എന്ന ബന്ധപദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּשְׁפֵלָתוֹ
  choice: അതിന്റെ താഴ്ന്ന പ്രദേശം
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം മുൻപുള്ള ‘ഇസ്രായേലിന്റെ മലനാട്’ എന്നതിലേക്കുള്ള ബന്ധമായി നിലനിർത്തി, ഉയർന്ന പ്രദേശവും അതിനോടു ചേർന്ന താഴ്ന്ന പ്രദേശവും തമ്മിലുള്ള ഭൂപ്രകൃതിവ്യത്യാസം സംരക്ഷിക്കുന്നു.
