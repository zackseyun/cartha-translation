translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഭൂമിശാസ്ത്രനാമങ്ങളായ ‘നെഗെവ്’, ‘അരാബാ’ എന്നിവ ലിപ്യന്തരിച്ചു; വിവരണാത്മക ഭൂപ്രദേശപദങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
