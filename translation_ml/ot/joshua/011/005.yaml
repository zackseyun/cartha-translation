    rationale: Although it can convey opposition in context, Malayalam also uses this construction for fighting alongside or engaging with someone. The Hebrew construction here denotes battle against Israel, so «ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്യാൻ» is clearer.
  - severity: low
