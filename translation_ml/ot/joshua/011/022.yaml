id: JOS.11.22
reference: Joshua 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ ദേശത്ത് അനാക്യരിൽ ആരും ശേഷിച്ചില്ല; ഗസ്സയിലും ഗത്തിലും അശ്ദോദിലും മാത്രമാണ് അവർ ശേഷിച്ചിരുന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתַר
  choice: ശേഷിച്ചില്ല
  rationale: നിഫാൽ രൂപം യോശുവയുടെ സൈനികനടപടികൾക്കുശേഷം ആരും ബാക്കിയുണ്ടായിരുന്നില്ല എന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശേഷിച്ചില്ല’ സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: עֲנָקִים
  choice: അനാക്യർ
  rationale: ജനവിഭാഗത്തിന്റെ എബ്രായ നാമം മലയാളവായനയ്ക്ക് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരിച്ചു; വിവരണാത്മകമായി വികസിപ്പിച്ചിട്ടില്ല.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ദേശത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന സംയുക്തപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: רַק
  choice: മാത്രമേ
  rationale: പരിമിതിയും ഒഴിവാക്കലും സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘മാത്രമേ … ഉള്ളൂ’ ഘടനയിൽ വ്യക്തമാണ്.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: ഗസ്സയിലും ഗത്തിലും അശ്ദോദിലും
  rationale: സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപങ്ങളിൽ നൽകി; ആവർത്തിക്കുന്ന ഓരോ בְ ഉപസർഗവും ‘-യിൽ/ഇൽ’ ആയി പ്രതിഫലിപ്പിച്ചു.
- source_word: נִשְׁאָרוּ
  choice: ചിലർ ശേഷിച്ചുള്ളൂ
  rationale: ബഹുവചനക്രിയയുടെ പരാമർശവിഷയം അനാക്യരാണ്; മലയാളത്തിൽ സന്ദർഭം വ്യക്തമാക്കാൻ ‘ചിലർ’ ചേർക്കുന്നത് ശേഷിച്ച ഒരു വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്, പുതിയ ആശയം കൂട്ടുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘അനാക്യർ’ എന്ന ജനവിഭാഗനാമവും ‘ഇസ്രായേൽമക്കൾ’ എന്ന മൂലഭാഷാസമീപമായ പ്രയോഗവും നിലനിർത്തി.
