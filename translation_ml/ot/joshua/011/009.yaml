source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ יְהוֹשֻׁ֔עַ כַּ/אֲשֶׁ֥ר אָֽמַר ל֖/וֹ יְהוָ֑ה אֶת סוּסֵי/הֶ֣ם עִקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם שָׂרַ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: ml
  text: 'യഹ്‌വെ തന്നോടു പറഞ്ഞതുപോലെതന്നെ യോശുവ അവരോടു ചെയ്തു: അവരുടെ കുതിരകളുടെ കാൽഞരമ്പുകൾ മുറിക്കുകയും[a] അവരുടെ രഥങ്ങൾ തീകൊണ്ട് ചുട്ടുകളയുകയും ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുതിരകളെ മുടന്താക്കി’; എബ്രായക്രിയ കൂടുതൽ കൃത്യമായി അവയുടെ കാൽഞരമ്പുകൾ മുറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: യോശുവ അവരോടു ചെയ്തു
  rationale: עשה + ל എന്ന പ്രയോഗം സന്ദർഭത്തിൽ അവർക്കെതിരെ അഥവാ അവരോടു പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള ഘടന നിലനിർത്താൻ ‘അവരോടു ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: തന്നോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר എന്ന താരതമ്യബലം ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു; ദൈവിക നിർദേശം എന്ന സന്ദർഭത്തിൽ אָמַר എന്നത് സ്വാഭാവികമായി ‘കല്പിച്ചു’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: סוּסֵיהֶם
  choice: അവരുടെ കുതിരകൾ
  rationale: ബഹുവചന ഉടമസ്ഥരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: עִקֵּר
  choice: കാൽഞരമ്പുകൾ മുറിച്ചു
  rationale: ക്രിയ കുതിരകളെ പ്രവർത്തനരഹിതമാക്കാൻ അവയുടെ കാലിലെ ഞരമ്പുകൾ മുറിക്കുന്ന പ്രത്യേക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പൊതുവായ ‘മുടന്താക്കി’ എന്നതിനെക്കാൾ ഈ രൂപം കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: അവരുടെ രഥങ്ങൾ
  rationale: യുദ്ധരഥങ്ങളെ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: שָׂרַף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: എബ്രായത്തിൽ തീ വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ അത് ഒഴിവാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നു. അത് ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ‘യഹ്‌വെ’ എന്ന രൂപം സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ പ്രവർത്തനക്രമവും ‘തീയിൽ’ എന്ന വ്യക്തമായ ഘടകവും നിലനിർത്തി; അപരിചിതമായ സാങ്കേതിക ക്രിയയ്ക്കു പകരം അതിന്റെ അർഥം വ്യക്തമായി പറഞ്ഞു.
