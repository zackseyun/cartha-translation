  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יְהוֹשֻׁ֜עַ בָּ/עֵ֤ת הַ/הִיא֙ וַ/יִּלְכֹּ֣ד אֶת חָצ֔וֹר וְ/אֶת מַלְכָּ֖/הּ הִכָּ֣ה בֶ/חָ֑רֶב כִּֽי חָצ֣וֹר לְ/פָנִ֔ים הִ֕יא רֹ֖אשׁ כָּל הַ/מַּמְלָכ֥וֹת הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: ml
  text: ആ സമയത്ത് യോശുവ മടങ്ങി ഹാസോർ[a] പിടിച്ചടക്കി; അതിന്റെ രാജാവിനെ വാൾകൊണ്ട് വെട്ടി[c]. പണ്ട് ഹാസോർ ഈ രാജ്യങ്ങളുടെയെല്ലാം മുഖ്യമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരിച്ചുവന്നു.’ എബ്രായക്രിയയ്ക്ക് ‘മടങ്ങുക,’ ‘തിരിയുക’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ സൈനികനീക്കത്തിലെ തിരിച്ചുള്ള ദിശയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഈ രാജ്യങ്ങളുടെയെല്ലാം തല ആയിരുന്നു’; അതായത്, അവയിൽ മുഖ്യസ്ഥാനത്തായിരുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ‘വാൾകൊണ്ട് വെട്ടി’ എന്നത് എബ്രായത്തിന്റെ നിയന്ത്രിതമായ പരിഭാഷയാണ്. സന്ദർഭത്തിൽ ഇത് കൊന്നുകളഞ്ഞു എന്ന് സൂചിപ്പിക്കാമെങ്കിലും ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘അടിച്ചു/വെട്ടി’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שׁוב എന്ന ക്രിയ ഇവിടെ സൈനികനീക്കത്തിനിടയിലെ തിരിച്ചുപോക്കിനെയോ മടങ്ങിവരവിനെയോ സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിച്ചെന്ന്’ ദിശാസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: വിശാലമായ ഒരു കാലസന്ദർഭം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ കാലപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചടക്കി
  rationale: לכד ഒരു നഗരം സൈനികമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിടിച്ചടക്കി’ യോജിക്കുന്നു.
- source_word: חָצוֹר
  choice: ഹാസോർ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מַלְכָּהּ
  choice: അതിന്റെ രാജാവിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹാസോർ നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അതിന്റെ രാജാവ്’ സ്വാഭാവികമാണ്.
- source_word: הִכָּה בֶחָרֶב
  choice: വാൾകൊണ്ട് വെട്ടി
  rationale: נכה എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അടിക്കുക/വെട്ടുക’ നിലനിർത്തുന്നു. സന്ദർഭം വധത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘കൊന്നു’ എന്ന് ക്രിയയിൽ തന്നെ വ്യക്തമാക്കാതെ മൂലപാഠത്തിന്റെ നിയന്ത്രിത ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: പണ്ട് ... ആയിരുന്നു
  rationale: ഹാസോറിന്റെ പ്രാധാന്യം വിശദീകരിക്കുന്ന കാരണവാക്യം മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെയും സ്വാഭാവികമായി തുടർച്ച നൽകുന്നു.
- source_word: לְפָנִים
  choice: പണ്ട്
  rationale: മുൻകാലത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: רֹאשׁ
  choice: തലസ്ഥാനം
  rationale: അക്ഷരാർഥത്തിൽ ‘തല’ എന്നാണെങ്കിലും ഇവിടെ രാജ്യങ്ങൾക്കിടയിലെ മുഖ്യസ്ഥാനമോ പ്രഥമത്വമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തലസ്ഥാനം’ ആ രൂപകവും രാഷ്ട്രീയകേന്ദ്രത്തിന്റെ ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: ഈ രാജ്യങ്ങളുടെയെല്ലാം
  rationale: സമഗ്രതയും സമീപസൂചകത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: רֹאשׁ എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: തലസ്ഥാനം
  alternative: മുഖ്യസ്ഥാനം / തല
  rationale: ഈ വാക്യത്തിൽ ഹാസോർ മറ്റു രാജ്യങ്ങളിൽ പ്രഥമസ്ഥാനത്തുണ്ടായിരുന്നുവെന്ന അർഥം നൽകുന്നു. എന്നാൽ ‘തലസ്ഥാനം’ ഭരണകേന്ദ്രമെന്ന കൂടുതൽ നിർദിഷ്ട അർഥം നൽകാൻ സാധ്യതയുള്ളതിനാൽ അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ പ്രവർത്തനക്രമവും ‘വാൾകൊണ്ട് വെട്ടി’ എന്ന നിയന്ത്രിത പ്രയോഗവും നിലനിർത്തി; യഥാർഥമായ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
