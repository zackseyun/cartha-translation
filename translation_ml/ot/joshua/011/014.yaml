  terminology: “കൊള്ളമുതൽ,” “കന്നുകാലികൾ,” “ഇസ്രായേൽമക്കൾ,” and “മനുഷ്യരെ മുഴുവൻ” are suitable. The collective rendering of כָּל־הָאָדָם appropriately includes the whole human population in contrast to livestock, without importing an unnecessary gender restriction.
