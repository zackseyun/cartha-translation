base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: ml
  text: ഈ പട്ടണങ്ങളിലെ കൊള്ളമുതൽ മുഴുവനും കന്നുകാലികളോടൊപ്പം ഇസ്രായേൽമക്കൾ തങ്ങൾക്കായി കൊള്ളയടിച്ചു. എന്നാൽ അവിടെയുള്ള മനുഷ്യരെ മുഴുവൻ അവർ വാളിന്റെ ധാരകൊണ്ട് വെട്ടി, അവരെ നശിപ്പിക്കുന്നതുവരെ. ശ്വാസമുള്ള ആരെയും അവർ ശേഷിപ്പിച്ചില്ല[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “വാളിന്റെ വായാൽ”; “വാളിന്റെ ധാരകൊണ്ട്” എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: “ശ്വസിച്ചിരുന്ന ഒന്നിനെയും അവർ ജീവനോടെ വിട്ടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: കൊള്ളമുതൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുക്കുന്ന വസ്തുവകകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങളിലെ
  rationale: മുമ്പ് പരാമർശിച്ച പട്ടണങ്ങളിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: കൊള്ളയായി കൈവശപ്പെടുത്തിയ വളർത്തുമൃഗങ്ങളെയാണ് ഈ യുദ്ധസന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: בָּזְזוּ לָהֶם
  choice: തങ്ങൾക്കായി കൊള്ളയടിച്ചു
  rationale: കൊള്ളയടിച്ച പ്രവൃത്തിയും അതിന്റെ പ്രയോജനം അവർക്കുതന്നെയായിരുന്നുവെന്ന לָהֶם എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബബന്ധപ്രയോഗം മലയാളത്തിലെ പതിവായ ജനസമൂഹനാമമായി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל הָאָדָם
  choice: അവിടെയുള്ള മനുഷ്യരെ മുഴുവൻ
  rationale: കന്നുകാലികളോടു വിപരീതമായി പട്ടണങ്ങളിലെ മനുഷ്യജനസംഖ്യയെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ വെട്ടി
  rationale: ‘വാളിന്റെ വായ്’ എന്ന എബ്രായ ദൃശ്യബിംബവും അതിന്റെ ‘വാളാൽ വെട്ടുക’ എന്ന അർഥവും മലയാളത്തിൽ ഗ്രാഹ്യമായി ചേർത്തുനിർത്തുന്നു.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: നശിപ്പിച്ചു
  rationale: שׁמד എന്ന ക്രിയയുടെ സമ്പൂർണ നശീകരണഭാവം നേരിട്ട് നൽകുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ഹേരെം സാങ്കേതികഭാഷ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: ശ്വാസമുള്ള ആരെയും അവർ ശേഷിപ്പിച്ചില്ല
  rationale: נְשָׁמָהയിലെ ശ്വാസം എന്ന മൂർത്തചിത്രം നിലനിർത്തിക്കൊണ്ട് ഒരാളെയും ജീവനോടെ വിട്ടില്ലെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ അവതരണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ ബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തപദമായി നിലനിർത്തുന്നു.
- issue: כָּל הָאָדָם എന്നതിന്റെ വ്യാപ്തി
  choice: അവിടെയുള്ള മനുഷ്യരെ മുഴുവൻ
  alternative: ഓരോ മനുഷ്യനെയും
  rationale: אָדָם ഇവിടെ കന്നുകാലികളിൽനിന്നു വേർതിരിച്ച മനുഷ്യജനസംഖ്യയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. സ്ത്രീകളെയും കുട്ടികളെയും ഒഴിവാക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഉൾക്കൊള്ളുന്ന കൂട്ടാർഥം തിരഞ്ഞെടുത്തു.
- issue: നശീകരണഭാഷയുടെ അവതരണം
  choice: വെട്ടി നശിപ്പിച്ചു
  alternative: നിർമൂലമാകുന്നതുവരെ വെട്ടി
  rationale: ഉറവിടത്തിലെ ക്രൂരവും സമ്പൂർണവുമായ പ്രവൃത്തി മൃദൂകരിക്കാതെ നൽകുന്നു; അതേസമയം ഈ ഉപവാക്യത്തിൽ ഇല്ലാത്ത ‘ശാപാർപ്പിത നാശം’ പോലുള്ള സാങ്കേതിക ദൈവശാസ്ത്രപദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. യുദ്ധത്തിന്റെ ക്രൂരത മൃദൂകരിക്കാതെ, എബ്രായത്തിലെ ‘വാളിന്റെ വായ്’, ‘ശ്വാസം’ എന്നീ ദൃശ്യബിംബങ്ങൾ വായനാസൗകര്യത്തോടെ പരമാവധി നിലനിർത്തി.
