    issue: The extent clause עַד הִשְׁמִדָם אֹתָם is not explicitly represented.
    rationale: “വെട്ടി നശിപ്പിച്ചു” can state two coordinated actions, but it does not clearly express that the striking continued until their destruction. The source’s temporal/extent relationship should be preserved.
