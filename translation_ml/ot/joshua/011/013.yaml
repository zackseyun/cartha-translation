translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാവസ്തുശാസ്ത്രപരമായ ‘ടെൽ’ എന്ന സാങ്കേതികപദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി ‘മേട്’ ഉപയോഗിക്കുകയും കൃത്യമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു.
