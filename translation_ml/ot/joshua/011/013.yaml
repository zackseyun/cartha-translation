source:
  edition: WLC
  text: רַ֣ק כָּל הֶ/עָרִ֗ים הָ/עֹֽמְדוֹת֙ עַל תִּלָּ֔/ם לֹ֥א שְׂרָפָ֖/ם יִשְׂרָאֵ֑ל זוּלָתִ֛י אֶת חָצ֥וֹר לְ/בַדָּ֖/הּ שָׂרַ֥ף יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: ml
  text: എന്നാൽ, തങ്ങളുടെ മേടുകളിൽ[a] നിലനിന്നിരുന്ന പട്ടണങ്ങളൊന്നും ഇസ്രായേൽ ചുട്ടുകളഞ്ഞില്ല; ഹാസോർ മാത്രം യോശുവ ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ ടെല്ലുകളിൽ’—തലമുറകളായി ഒരേ സ്ഥലത്ത് നടന്ന മനുഷ്യവാസത്തിന്റെ തുടർച്ചയായ പാളികൾകൊണ്ട് രൂപപ്പെട്ട പുരാതന ആവാസമേടുകളിലാണ് പട്ടണങ്ങൾ നിലനിന്നിരുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോടുള്ള വൈരുധ്യവും തുടർന്ന് പറയുന്ന ഏക അപവാദവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הֶעָרִים ... לֹא
  choice: പട്ടണങ്ങളൊന്നും ... ചുട്ടുകളഞ്ഞില്ല
  rationale: നിഷേധവാക്യത്തിലെ സമഗ്രമായ വിതരണാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: തങ്ങളുടെ മേടുകളിൽ നിലനിന്നിരുന്ന
  rationale: עֹמְדוֹת എന്നതിലെ നിലനിൽപ്പിന്റെ ദൃശ്യഭാവവും תֵּל എന്നതിന്റെ ആവാസപാളികളാൽ രൂപപ്പെട്ട മേട് എന്ന സ്ഥലസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: ഹാസോർ മാത്രം
  rationale: ഹാസോർ ഏക അപവാദമാണെന്ന ഇരട്ട ഊന്നൽ മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: യോശുവ ചുട്ടുകളഞ്ഞു
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച ക്രിയ നിലനിർത്തി ഹാസോറിനോടുള്ള വ്യത്യസ്ത നടപടി ഊന്നിപ്പറയുന്നു.
- source_word: חָצוֹר
  choice: ഹാസോർ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള ലിപ്യന്തരണം.
