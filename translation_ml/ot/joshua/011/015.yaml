  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: ml
  text: യഹ്‌വേ തന്റെ ദാസനായ മോശയോടു കല്പിച്ചതുപോലെതന്നെ മോശ യോശുവയോടു കല്പിച്ചു; യോശുവ അങ്ങനെതന്നെ ചെയ്തു. യഹ്‌വേ മോശയോടു കല്പിച്ച എല്ലാറ്റിലും ഒന്നുപോലും അവൻ ഒഴിവാക്കിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യഹ്‌വേ മോശയോടു കല്പിച്ച എല്ലാറ്റിൽനിന്നും അവൻ ഒന്നും വിട്ടുകളഞ്ഞില്ല.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം: “യഹ്‌വേ മോശയോടു കല്പിച്ച എല്ലാറ്റിൽനിന്നും അവൻ ഒരു കാര്യവും നീക്കിയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: യഹ്‌വേ മോശയോടു കല്പിച്ചതും മോശ യോശുവയോടു കല്പിച്ചതും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്ന ക്രിയ; വാക്യത്തിലെ ആജ്ഞാധികാരത്തിന്റെ ശൃംഖല നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനായ
  rationale: മോശയ്ക്കുള്ള ബഹുമാനസൂചകവും ഉടമ്പടിബന്ധപരവുമായ വിശേഷണമായി עבד ഇവിടെ ‘ദാസൻ’ എന്ന അർഥത്തിലാണ് സ്വാഭാവികം.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: കല്പനയ്ക്കും യോശുവയുടെ പ്രവൃത്തിക്കും ഇടയിലെ പൊരുത്തം വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ആവർത്തനത്തിന് യോജിച്ച ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: עָשָׂה
  choice: ചെയ്തു
  rationale: വിശാലാർഥമുള്ള എബ്രായക്രിയയുടെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; അനുസരണത്തിന്റെ സമ്പൂർണത അടുത്ത വാക്യം വിശദീകരിക്കുന്നു.
- source_word: לֹא הֵסִיר דָּבָר
  choice: ഒന്നുപോലും അവൻ ഒഴിവാക്കിയില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു കാര്യവും നീക്കിയില്ല’ എന്ന പ്രയോഗം ഇവിടെ കല്പിക്കപ്പെട്ടതിൽ ഒന്നും വിട്ടുകളയാതെയുള്ള സമ്പൂർണ അനുസരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִכֹּל אֲשֶׁר
  choice: കല്പിച്ച എല്ലാറ്റിലും
  rationale: കല്പിക്കപ്പെട്ട കാര്യങ്ങളുടെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: אֶת
  choice: '[വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: സ്വതന്ത്രമായ മലയാള സമാനപദമില്ലാത്ത നേരിട്ടുള്ള കർമസൂചകമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ആ പേര് മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: യോശുവയുടെ അനുസരണത്തിന്റെ വ്യാപ്തി
  choice: ‘ഒന്നുപോലും അവൻ ഒഴിവാക്കിയില്ല’ എന്ന് സമ്പൂർണത നിലനിർത്തി
  alternative: ‘ഒരു കാര്യവും നീക്കിയില്ല’ എന്ന അക്ഷരാർഥ രൂപം
  rationale: വാക്യം യോശുവയുടെ അനുസരണത്തിൽ ഒരു കല്പനയും ഒഴിവായില്ലെന്ന് പറയുന്നു; ‘ഒഴിവാക്കിയില്ല’ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ എബ്രായ ശൈലി സൂചിപ്പിച്ച് രൂപകത്തിന്റെ തെളിവ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിച്ചു’, ‘ദാസൻ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തുന്നു. എബ്രായത്തിലെ താരതമ്യവും ആവർത്തനവും ‘പോലെതന്നെ’, ‘അങ്ങനെതന്നെ’ എന്നിവയിലൂടെ സൂക്ഷിച്ചു.
