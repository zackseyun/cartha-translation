  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോശുവ ഈ രാജാക്കന്മാർക്കെതിരെ ദീർഘകാലം യുദ്ധം നടത്തി.” എബ്രായത്തിൽ അക്ഷരാർഥം “അനേകം ദിവസങ്ങൾ” എന്നാണ്; “യുദ്ധം ചെയ്തു” എന്നത് അക്ഷരാർഥത്തിൽ “യുദ്ധം ഉണ്ടാക്കി” എന്ന ശൈലിപ്രയോഗമാണ്.
