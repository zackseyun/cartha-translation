  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: ml
  text: അവർ അതിലുണ്ടായിരുന്ന സകല മനുഷ്യരെയും വാളിന്റെ മൂർച്ചകൊണ്ട് കൊന്നുകളഞ്ഞു; അവരെ നാശത്തിനായി സമർപ്പിച്ചു[a]. ശ്വാസമുള്ള ഒന്നുപോലും ശേഷിച്ചില്ല[b]. അവൻ ഹാസോർ തീകൊണ്ട് ചുട്ടുകളഞ്ഞു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ പൂർണമായി നശിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘വിലക്കിന് കീഴിലാക്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ חרם എന്ന പദം നാശത്തിനായി മാറ്റിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ശ്വാസവും ശേഷിച്ചില്ല’; ആരും ജീവനോടെ ശേഷിച്ചില്ലെന്ന ആശയം നൽകുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ആദ്യം ‘അവർ കൊന്നുകളഞ്ഞു’ എന്ന് ബഹുവചനവും തുടർന്ന് ‘അവൻ ചുട്ടുകളഞ്ഞു’ എന്ന് ഏകവചനവും വരുന്നു. അവസാനത്തെ ഏകവചനം യോശുവയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: അവർ ... കൊന്നുകളഞ്ഞു
  rationale: നכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യുദ്ധസന്ദർഭത്തിൽ അടിച്ചുവീഴ്ത്തി കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഫലം വ്യക്തമായി അറിയിക്കാൻ ‘കൊന്നുകളഞ്ഞു’ എന്നു നൽകി.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന സകല മനുഷ്യരെയും
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെയല്ല, നഗരത്തിലുണ്ടായിരുന്ന മനുഷ്യജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായ കൂട്ട ഏകവചനത്തിന്റെ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന എബ്രായ പ്രയോഗം വാളിന്റെ മൂർച്ചയാൽ കൊല്ലുക എന്നതാണ്. ‘വായ്ത്തല’ ദൃശ്യസാന്ദ്രത നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הַחֲרֵם
  choice: അവരെ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദം വെറും കൊലപാതകത്തേക്കാൾ കൂടുതലായി, പിൻവലിക്കാനാവാത്തവിധം നാശത്തിനായി വേർതിരിക്കുന്ന ആശയം വഹിക്കുന്നു. ‘സമർപ്പിച്ചു’ ആ പ്രത്യേക ആശയം നിലനിർത്തുന്നു; കർമ്മം വ്യക്തമാക്കാൻ ‘അവരെ’ ചേർത്തിരിക്കുന്നു.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: ശ്വാസമുള്ള ഒന്നുപോലും ശേഷിച്ചില്ല
  rationale: נְשָׁמָה ശ്വാസം/ശ്വസിക്കുന്ന ജീവി എന്ന ദൃശ്യഭാവം വഹിക്കുന്നു. അതിനെ ‘രക്ഷപ്പെട്ടവർ ആരുമില്ല’ എന്നു മാത്രം വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിന്റെ വിശാലവും ശക്തവുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: חָצוֹר
  choice: ഹാസോർ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: שָׂרַף בָּאֵשׁ
  choice: അവൻ തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: ക്രിയയുടെ ഏകവചന കർത്താവ് നിലനിർത്തുന്നു. ‘തീയിട്ടു ചുട്ടുകളഞ്ഞു’ എന്നത് בָּאֵשׁ എന്ന വ്യക്തമാക്കിയ അഗ്നിപ്രയോഗവും പൂർണമായി കത്തിച്ച പ്രവർത്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: കീഴടക്കൽസന്ദർഭത്തിലെ חרם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; വിലക്കിന് കീഴിലാക്കി
  rationale: ഈ പദത്തിന് സാധാരണ സൈനികനശീകരണത്തെക്കാൾ പ്രത്യേകമായ, പിൻവലിക്കാനാവാത്ത സമർപ്പണത്തിന്റെ ഭാരം ഉണ്ട്. തിരഞ്ഞെടുത്ത പ്രയോഗം വാക്യത്തിന്റെ കഠിനത മറയ്ക്കാതെയും പിന്നീട് രൂപപ്പെട്ട സിദ്ധാന്തം ചേർക്കാതെയും ആ ആശയം സൂക്ഷിക്കുന്നു.
- issue: ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള കർത്തൃമാറ്റം
  choice: അവർ ... കൊന്നുകളഞ്ഞു ... അവൻ ... ചുട്ടുകളഞ്ഞു
  alternative: അവർ ... കൊന്നുകളഞ്ഞു ... അവർ ... ചുട്ടുകളഞ്ഞു
  rationale: മൂലപാഠത്തിലെ וַיַּכּוּ എന്ന ബഹുവചനത്തിനും שָׂרַף എന്ന ഏകവചനത്തിനും ഇടയിലെ മാറ്റം അതേപടി നിലനിർത്തി. അവസാനത്തെ ‘അവൻ’ സന്ദർഭത്തിൽ യോശുവയെ സൂചിപ്പിക്കാനിടയുണ്ടെങ്കിലും പേര് നേരിട്ട് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘വാളിന്റെ വായ്ത്തല’, ‘ശ്വാസമുള്ള ഒന്ന്’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു. חרם എന്ന സാങ്കേതിക ആശയം മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനാത്മകമായി നൽകി, സാധ്യതയുള്ള മറ്റു പരിഭാഷകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
