  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: ml
  text: വടക്കുള്ളവരായ, മലനാട്ടിലും കിന്നെരോത്തിന് തെക്കുള്ള അരാബയിലും താഴ്ന്ന പ്രദേശത്തും പടിഞ്ഞാറുള്ള[b] ദോരിന്റെ ഉയർന്ന പ്രദേശങ്ങളിലും[a] ഉണ്ടായിരുന്ന രാജാക്കന്മാർക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദോരിന്റെ ജില്ലകളിൽ,’ ‘ദോർ പ്രദേശത്ത്,’ അല്ലെങ്കിൽ ‘ദോരിന്റെ ചരിവുകളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ ഭൂപ്രകൃത്യർഥത്തെക്കുറിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കടലിന്റെ ദിശയിൽ.’ എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ ഇത് സാധാരണയായി ‘പടിഞ്ഞാറ്’ എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: രാജാക്കന്മാർക്കും … ആളയച്ചു
  rationale: വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ וְאֶל എന്നതിന്റെ ലക്ഷ്യാർഥം നിലനിർത്തി; മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമാകാൻ മുൻവാക്യത്തിലെ ആശയത്തിൽനിന്ന് ‘ആളയച്ചു’ ആവർത്തിച്ചു ചേർത്തു.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: വടക്കുള്ള … ഉണ്ടായിരുന്നവർ
  rationale: ഇത് രാജാക്കന്മാരുടെ ഭൂമിശാസ്ത്രപരമായ സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘വടക്കുനിന്നുള്ള’ എന്നതിനെക്കാൾ ‘വടക്കുള്ള’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בָּהָר
  choice: മലനാട്ടിൽ
  rationale: ഒറ്റപ്പെട്ട ഒരു മലയെക്കാൾ ഒരു ഭൂപ്രദേശത്തെയാണ് ഇവിടെ הַר സൂചിപ്പിക്കുന്നത്.
- source_word: וּבָעֲרָבָה
  choice: അരാബയിൽ
  rationale: പൊതുവായ ‘സമതലം’ എന്നതിനു പകരം പ്രത്യേക ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: കിന്നെരോത്തിന് തെക്കുള്ള
  rationale: വടക്കൻ സ്ഥലമായ കിന്നെരോത്തിനെ സംബന്ധിച്ച് נֶגֶב ദിശാസൂചനയായി ‘തെക്ക്’ എന്നു ഗ്രഹിക്കുന്നത് യോജിക്കുന്നു.
- source_word: וּבַשְּׁפֵלָה
  choice: താഴ്ന്ന പ്രദേശത്ത്
  rationale: שְׁפֵלָהയുടെ താഴ്ന്നനാട്/മലയടിവാരപ്രദേശം എന്ന ഭൂപ്രകൃതിസൂചന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: וּבְנָפוֹת דּוֹר
  choice: ദോരിന്റെ ഉയർന്ന പ്രദേശങ്ങളിൽ
  rationale: അപൂർവമായ נָפוֹת എന്ന പദത്തിന്റെ സാധ്യതയുള്ള ഭൂപ്രകൃത്യർഥം മുഖ്യവാചകത്തിൽ നൽകി; അതിന്റെ അനിശ്ചിതത്വവും മറ്റു സാധ്യതകളും അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִיָּם
  choice: പടിഞ്ഞാറുള്ള
  rationale: ‘കടൽ’ എന്ന പദം എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ സാധാരണയായി പടിഞ്ഞാറുദിശയെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. മൂലവാക്യം മുൻവാക്യത്തിലെ ‘ആളയച്ചു’ എന്ന ക്രിയയെ ആശ്രയിക്കുന്നതിനാൽ, ഒറ്റവാക്യമായി വായിക്കാനാകുന്നവിധം ആ ക്രിയ ഇവിടെ ആവർത്തിച്ചു. ദീർഘമായ ഭൂമിശാസ്ത്രപ്പട്ടിക വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
