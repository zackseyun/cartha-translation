translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, വായനാസൗകര്യമുള്ള ശൈലി. വാക്യം എബ്രായത്തിൽ മുൻവാക്യത്തിലെ ക്രിയയുടെ തുടർച്ചയായതിനാൽ, ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അർഥം പൂർത്തിയാകാൻ ‘വിളിച്ചുകൂട്ടി’ ചേർത്തു. ജനനാമങ്ങൾ മലയാളത്തിൽ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിൽ നൽകി.
