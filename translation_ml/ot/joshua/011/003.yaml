source:
  edition: WLC
  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: ml
  text: കിഴക്കും പടിഞ്ഞാറുമുള്ള[a] കനാന്യരുടെയും, മലനാട്ടിലുള്ള അമോര്യരുടെയും ഹിത്യരുടെയും പെരിസ്യരുടെയും യെബൂസ്യരുടെയും, ഹെർമോന്റെ താഴെയുള്ള മിസ്പാ ദേശത്തുള്ള ഹിവ്യരുടെയും അടുക്കലേക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “കടലിൽ നിന്ന്”; ഇവിടെ “കടൽ” പടിഞ്ഞാറുദിശയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപദമായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: നിശ്ചയാർഥക ഏകവചനത്തിലുള്ള ജനനാമം ഇവിടെ ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: מִמִּזְרָח וּמִיָּם
  choice: കിഴക്കും പടിഞ്ഞാറുമുള്ള
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച വിളിച്ചുകൂട്ടലിന്റെ കർമമായി ജനവിഭാഗങ്ങളെ അവതരിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പരാമർശം. יָם അക്ഷരാർഥത്തിൽ ‘കടൽ’ ആണെങ്കിലും ഇവിടെ പടിഞ്ഞാറുദിശയെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי
  choice: അമോര്യരെയും, ഹിത്യരെയും, പെരിസ്യരെയും
  rationale: എബ്രായത്തിലെ കൂട്ടാർഥക ഏകവചന ജനനാമങ്ങൾക്ക് സ്വാഭാവികമായ മലയാള ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הַיְבוּסִי בָּהָר
  choice: മലനാട്ടിലുള്ള യെബൂസ്യരെയും
  rationale: בָּהָר യോശുവയിൽ സാധാരണയായി മധ്യത്തിലെ ഉയർന്ന മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മലനാട്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַחִוִּי תַּחַת חֶרְמוֹן
  choice: ഹെർമോന്റെ താഴെ ... ഉള്ള ഹിവ്യരെയും
  rationale: תַּחַת എന്നതിന്റെ സ്ഥലസൂചകമായ ‘താഴെ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; അത് ഹെർമോന്റെ അടിവാരമോ തെക്കുഭാഗമോ എന്ന് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: മിസ്പാ ദേശത്തുള്ള
  rationale: אֶרֶץ ഇവിടെ പ്രദേശം/ദേശം എന്ന അർഥത്തിൽ; מִצְפָּה സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
