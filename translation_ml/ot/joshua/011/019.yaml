base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുമായി[a] സമാധാനം ചെയ്ത ഒരു പട്ടണംപോലും ഉണ്ടായിരുന്നില്ല; ഗിബെയോനിൽ താമസിച്ചിരുന്ന ഹിവ്യർ മാത്രമായിരുന്നു അതിന് അപവാദം. മറ്റെല്ലാ പട്ടണങ്ങളെയും ഇസ്രായേൽമക്കൾ യുദ്ധത്തിൽ പിടിച്ചെടുത്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽജനവുമായി.’ ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവയെല്ലാം അവർ യുദ്ധത്തിൽ എടുത്തു.’ ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിന് അടുത്തതായി, ‘എല്ലാം അവർ യുദ്ധത്തിൽ എടുത്തു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה
  choice: സമാധാനം ചെയ്ത
  rationale: שׁלם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ സമാധാനബന്ധത്തിൽ പ്രവേശിക്കുക എന്ന നയതന്ത്രപരമായ അർഥം നൽകുന്നു. ‘കീഴടങ്ങി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിതമായിരിക്കും.
- source_word: אֶל
  choice: -മായി
  rationale: ഹീബ്രായത്തിൽ സാധാരണയായി ‘അടുക്ക്/ലേക്ക്’ എന്ന ദിശാസൂചന നൽകുന്നുവെങ്കിലും, സമാധാനം ചെയ്യുക എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധസൂചകം ‘-മായി’ ആണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ദേശീയ-കൂട്ടായ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മനസ്സിലാക്കാവുന്നതുമായ രൂപം.
- source_word: בִּלְתִּי
  choice: മാത്രമായിരുന്നു അതിന് അപവാദം
  rationale: മുൻപുള്ള നിഷേധത്തിന് ഏക അപവാദം അവതരിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: ഗിബെയോനിൽ താമസിച്ചിരുന്ന ഹിവ്യർ
  rationale: יֹשְׁבֵי എന്ന പങ്കാളിക്രിയാരൂപത്തിന്റെ ‘അവിടെ വസിച്ചിരുന്നവർ’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת הַכֹּל
  choice: മറ്റെല്ലാം
  rationale: הַכֹּל എന്നത് സന്ദർഭത്തിലുള്ള ശേഷിച്ച പട്ടണങ്ങളെയോ ജനവിഭാഗങ്ങളെയോ മൊത്തമായി സൂചിപ്പിക്കുന്നു. ‘മറ്റെല്ലാം’ ആ പരാമർശത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും നിർദ്ദേശിക്കാത്ത ഒരു നാമം നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לָקְחוּ
  choice: പിടിച്ചെടുത്തു
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ ആണെങ്കിലും യുദ്ധസന്ദർഭത്തിൽ മലയാളത്തിലെ ‘പിടിച്ചെടുത്തു’ സ്വാഭാവികമാണ്; ‘നശിപ്പിച്ചു’ പോലുള്ള അധിക അർഥം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: בַמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: പട്ടണങ്ങൾ സമാധാനത്തിലൂടെയല്ല, യുദ്ധസാഹചര്യത്തിലാണ് പിടിച്ചെടുത്തത് എന്ന ഹീബ്രായ പ്രയോഗം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
