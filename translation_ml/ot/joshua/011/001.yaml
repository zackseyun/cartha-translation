source:
  edition: WLC
  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: ml
  text: ഹാസോർ രാജാവായ യാബീൻ ഇതു കേട്ടപ്പോൾ[a][b], മാദോൻ രാജാവായ യോബാബിനും ശിമ്രോൻ രാജാവിനും[c] അക്ഷാഫ് രാജാവിനും അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഹാസോർ രാജാവായ യാബീൻ കേട്ടപ്പോൾ, അങ്ങനെ സംഭവിച്ചു.” എബ്രായത്തിലെ ആഖ്യാനസൂത്രം ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ “കേട്ടപ്പോൾ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “കേട്ടു” എന്നു മാത്രമേയുള്ളൂ; “ഇതു” എന്നത് മുൻസന്ദർഭത്തിൽനിന്ന് സൂചിതമാണ്.
    reason: cross_reference
  - marker: c
    text: ഇവിടത്തെ “ശിമ്രോൻ” യോശുവ 12:20-ൽ പറയുന്ന “ശിമ്രോൻ-മെരോൻ” തന്നെയാണെന്ന് ചിലർ തിരിച്ചറിയുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: വַיְהִי + כִּי + infinitive construct എന്ന എബ്രായ ആഖ്യാനഘടന ഇവിടെ കാലസാഹചര്യം അവതരിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘കേട്ടപ്പോൾ’ എന്നു നൽകി; കേട്ട കാര്യം മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ ‘ഇതു’ ചേർത്തു.
- source_word: יָבִין
  choice: യാബീൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ חָצוֹר
  choice: ഹാസോർരാജാവായ
  rationale: സ്ഥലനാമവും രാജപദവിയും ചേർന്ന എബ്രായ construct chain മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തപ്രയോഗമായി നൽകി.
- source_word: וַיִּשְׁלַח אֶל
  choice: അടുക്കൽ ആളയച്ചു
  rationale: ശׁלח + אֶל എന്നത് ‘അടുക്കൽ അയച്ചു’ എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ കർമം പറയാതെ ‘അയച്ചു’ എന്നു മാത്രം പറയുന്നത് അസ്വാഭാവികമായതിനാൽ സന്ദേശവാഹകരെ സൂചിപ്പിക്കുന്ന പൊതുവായ ‘ആളയച്ചു’ ഉപയോഗിച്ചു; സന്ദേശത്തിന്റെ ഉള്ളടക്കം ചേർത്തിട്ടില്ല.
- source_word: יוֹבָב מֶלֶךְ מָדוֹן
  choice: മാദോൻരാജാവായ യോബാബ്
  rationale: വ്യക്തിനാമവും രാജപദവിയും സ്ഥലനാമവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി.
- source_word: שִׁמְרוֹן
  choice: ശിമ്രോൻ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം അതേ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; യോശുവ 12:20-ലെ ശിമ്രോൻ-മെരോനുമായി മുഖ്യപാഠത്തിൽ ലയിപ്പിച്ചില്ല.
- source_word: אַכְשָׁף
  choice: അക്ഷാഫ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
