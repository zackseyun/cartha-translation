translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. രാജപദവികൾ സ്ഥലനാമങ്ങളോടു ചേർത്ത് സ്വാഭാവികമായി രൂപപ്പെടുത്തി. പട്ടികയിലെ മൂന്ന് സ്വീകർത്താക്കളെയും സംബന്ധബന്ധത്തിലൂടെ ഒരേ ‘അടുക്കൽ ആളയച്ചു’ എന്ന ക്രിയയോട് ബന്ധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
