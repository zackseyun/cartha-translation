revisions:
- from: അവരും അവരോടുകൂടെ അവരുടെ എല്ലാ പാളയങ്ങളും പുറപ്പെട്ടു.[a] അവർ കടൽത്തീരത്തെ മണൽപോലെ എണ്ണമറ്റ ഒരു വലിയ ജനസമൂഹമായിരുന്നു; കുതിരകളും രഥങ്ങളും അത്യധികം ഉണ്ടായിരുന്നു.[b]
  to: അവരും അവരോടുകൂടെ അവരുടെ എല്ലാ പാളയങ്ങളും പുറപ്പെട്ടു—കടൽത്തീരത്തെ മണൽപോലെ അനേകരായ വലിയൊരു ജനസമൂഹം; കുതിരകളും രഥങ്ങളും വളരെ അധികം ഉണ്ടായിരുന്നു.[a]
  rationale: ‘എണ്ണമറ്റ’ എന്ന കൂടുതൽ ശക്തമായ പ്രയോഗം ‘മണൽപോലെ അനേകരായ’ എന്ന മൂലപാഠത്തിന്റെ ഉപമയും സംഖ്യാബാഹുല്യവും നേരിട്ട് പ്രകടമാക്കുന്ന രൂപത്തിലേക്ക് മാറ്റി. കുതിരകളുടെയും രഥങ്ങളുടെയും അളവിനെ ‘വളരെ അധികം’ എന്നു സ്വാഭാവികമായി നൽകി. അനാവശ്യമായ രണ്ടാം അടിക്കുറിപ്പ് നീക്കി, പാളയങ്ങൾക്കുള്ള പ്രസക്തമായ നിഘണ്ടുഅർഥക്കുറിപ്പ് മാത്രം നിലനിർത്തി.
