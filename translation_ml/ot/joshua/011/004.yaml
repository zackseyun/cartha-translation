source:
  edition: WLC
  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: ml
  text: അവരും അവരോടുകൂടെ അവരുടെ എല്ലാ പാളയങ്ങളും പുറപ്പെട്ടു—കടൽത്തീരത്തെ മണൽപോലെ അനേകരായ വലിയൊരു ജനസമൂഹം; കുതിരകളും രഥങ്ങളും വളരെ അധികം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാളയങ്ങൾ” എന്ന എബ്രായപദം സൈനിക പാളയങ്ങളെയും, വിപുലമായ അർഥത്തിൽ അവയിൽ അണിനിരന്ന സൈന്യങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള നീക്കം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ സൈനികഭാവം അനാവശ്യമായി ക്രിയയിൽ ചേർക്കുന്നില്ല.
- source_word: מַחֲנֵיהֶם
  choice: അവരുടെ എല്ലാ പാളയങ്ങളും
  rationale: מַחֲנֶה എന്നതിന്റെ അടിസ്ഥാന ദൃശ്യമായ ‘പാളയം’ നിലനിർത്തുന്നു; ഇവിടെ അത് പാളയമിറങ്ങിയ സൈനികസംഘങ്ങളെയും സൂചിപ്പിക്കാം.
- source_word: עַם רָב
  choice: ഒരു വലിയ ജനസമൂഹം
  rationale: עַם എന്ന കൂട്ടനാമവും רָב നൽകുന്ന വലിപ്പബോധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: കടൽത്തീരത്തെ മണൽപോലെ എണ്ണമറ്റ
  rationale: മണലിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് לָרֹב സൂചിപ്പിക്കുന്ന സംഖ്യാബാഹുല്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סוּס וָרֶכֶב רַב מְאֹד
  choice: കുതിരകളും രഥങ്ങളും അത്യധികം ഉണ്ടായിരുന്നു
  rationale: സമൂഹവാചക ഏകവചനങ്ങളായ סוּס, רֶכֶב എന്നിവയെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനങ്ങളാക്കി, רַב מְאֹד എന്ന ശക്തമായ അളവുബോധം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണം. ‘പാളയങ്ങൾ’ എന്ന മൂലരൂപം നിലനിർത്തി അതിന്റെ സൈനികസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; മണൽ-ഉപമ സംഖ്യാബാഹുല്യം വ്യക്തമാകുന്ന വിധത്തിൽ നൽകിയിരിക്കുന്നു.
