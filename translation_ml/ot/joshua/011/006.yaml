source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: ml
  text: 'യഹ്‌വേ യോശുവയോടു പറഞ്ഞു: “അവരെ ഭയപ്പെടരുത്. നാളെ ഇതേ സമയത്ത്[a] ഞാൻ അവരെയെല്ലാം ഇസ്രായേലിന്റെ മുമ്പിൽ കൊല്ലപ്പെട്ടവരായി ഏല്പിച്ചുതരും[b]. അവരുടെ കുതിരകളുടെ കാൽഞരമ്പുകൾ അറുത്തുകളയുകയും അവരുടെ രഥങ്ങൾ തീയിൽ ചുട്ടുകളയുകയും വേണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാളെ ഏകദേശം ഇതേ സമയത്ത്.’
    reason: כָּעֵת എന്ന പ്രയോഗത്തിൽ ‘ഇതേ സമയത്ത്’ എന്നും ‘ഏകദേശം ഈ സമയത്ത്’ എന്നും ഗ്രഹിക്കാവുന്ന സൂക്ഷ്മതയുണ്ട്.
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഞാൻ അവരെയെല്ലാം ഇസ്രായേലിന്റെ മുമ്പിൽ കൊല്ലപ്പെട്ടവരായി കൊടുക്കുന്നു’; അതായത്, ഇസ്രായേൽ അവരെ വധിക്കേണ്ടതിന് അവരെ ഏല്പിച്ചുകൊടുക്കുന്നു.'
    reason: നֹתֵן ... חֲלָלִים എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അസാധാരണവും ശക്തവുമായ രൂപം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: അവരെ ഭയപ്പെടരുത്
  rationale: മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ വിലക്കായി ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: നാളെ ഇതേ സമയത്ത്
  rationale: അടുത്ത ദിവസം ഇതേ സമയത്തോടടുത്തുള്ള സമയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കാലപ്രയോഗം; ‘ഏകദേശം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אָנֹכִי נֹתֵן
  choice: ഞാൻ ... ഏല്പിച്ചുതരും
  rationale: വരാനിരിക്കുന്നതും ഉറപ്പുള്ളതുമായ ദൈവിക കൈമാറ്റത്തെ സ്വാഭാവിക മലയാള ഭാവികാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: അവരെയെല്ലാം ഇസ്രായേലിന്റെ മുമ്പിൽ കൊല്ലപ്പെട്ടവരായി
  rationale: חֲלָלִים എന്നത് യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊല്ലപ്പെട്ടവർ’ ഉപയോഗിക്കുകയും, לִפְנֵי എന്ന സ്ഥലരൂപകം പരമാവധി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: תְּעַקֵּר
  choice: കാൽഞരമ്പുകൾ അറുത്തുകളയുക
  rationale: യുദ്ധകുതിരകളെ പ്രവർത്തനരഹിതമാക്കാൻ അവയുടെ കാലിലെ ഞരമ്പുകൾ മുറിക്കുന്ന പ്രത്യേക പ്രവൃത്തിയെ വ്യക്തമായി പറയുന്നു.
- source_word: מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ
  choice: അവരുടെ രഥങ്ങൾ തീയിൽ ചുട്ടുകളയുക
  rationale: രഥങ്ങളും തീയും വ്യക്തമായി പറയുന്ന ഹീബ്രു രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, Yahweh എന്ന രൂപത്തിന് അനുയോജ്യമായ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- issue: ശത്രുക്കളെ ‘കൊല്ലപ്പെട്ടവരായി’ ഏല്പിക്കുന്ന ദൈവിക വാഗ്ദാനം
  choice: ഹീബ്രുവിലെ കടുത്ത യുദ്ധഭാഷ അതേപടി നിലനിർത്തുന്നു
  alternative: ‘പരാജയപ്പെടുത്താൻ ഏല്പിക്കും’ എന്ന മൃദുവാക്കിയ വ്യാഖ്യാനം
  rationale: വാക്യത്തിലെ ദൈവിക പ്രവർത്തനവും യുദ്ധഫലവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. യുദ്ധസംബന്ധമായ കഠിനഭാഷ മൃദൂകരിച്ചിട്ടില്ല; എന്നാൽ ‘hamstring’ എന്ന സാങ്കേതിക ആശയം സാധാരണ വായനക്കാരന് മനസ്സിലാകുന്ന വിധം ‘കാൽഞരമ്പുകൾ അറുത്തുകളയുക’ എന്നു വ്യക്തമാക്കി.
