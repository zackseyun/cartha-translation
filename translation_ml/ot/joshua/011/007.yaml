revisions:
- from: അപ്പോൾ യോശുവയും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പോരാളികളെല്ലാം[a] മേരോം ജലാശയത്തിനരികെ അവരുടെ നേരെ പൊടുന്നനെ വന്ന് അവരുടെമേൽ ചാടിവീണു.
