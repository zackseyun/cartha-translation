  text: וַ/יָּבֹ֣א יְהוֹשֻׁ֡עַ וְ/כָל עַם֩ הַ/מִּלְחָמָ֨ה עִמּ֧/וֹ עֲלֵי/הֶ֛ם עַל מֵ֥י מֵר֖וֹם פִּתְאֹ֑ם וַֽ/יִּפְּל֖וּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: ml
  text: അപ്പോൾ യോശുവയും അവനോടുകൂടെ യുദ്ധജനമൊക്കെയും മേരോമിലെ ജലാശയങ്ങളുടെ സമീപത്ത് അവരുടെ നേരെ പെട്ടെന്ന് വന്നു; അവരുടെമേൽ പതിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയ സന്ദർഭമനുസരിച്ച് ‘വരുക’ എന്നോ ‘പോകുക’ എന്നോ അർഥമാക്കാം. ഇവിടെ ശത്രുവിന്റെ നേരെയുള്ള നീക്കം തുടർന്നുള്ള പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി അറിയിക്കാൻ ‘വന്നു’ എന്നു നൽകി.
- source_word: עַם הַמִּלְחָמָה
  choice: പോരാളികളെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ ജനം’ എന്ന കൂട്ടായ പ്രയോഗം. ‘പോരാളികളെല്ലാം’ എന്നത് പുരുഷന്മാർ മാത്രമാണെന്ന സൂചന ചേർക്കാതെ, യുദ്ധത്തിൽ പങ്കെടുത്ത കൂട്ടത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: യോശുവയോടൊപ്പമുള്ളവരെന്ന അനുഗമനബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲלֵיהֶם
  choice: അവരുടെ നേരെ
  rationale: ശത്രുതാപരമായ നീക്കത്തോടൊപ്പം על എന്നതിന് ‘നേരെ/എതിരായി’ എന്ന അർഥം യോജിക്കുന്നു.
- source_word: עַל מֵי מֵרוֹם
  choice: മേരോം ജലാശയത്തിനരികെ
  rationale: മേരോം എന്ന ജലസ്ഥാനത്തോടു ചേർന്നുള്ള സ്ഥലം സൂചിപ്പിക്കുന്നു; ‘ജലാശയത്തിനരികെ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: פִּתְאֹם
  choice: പൊടുന്നനെ
  rationale: ആക്രമണത്തിന്റെ അപ്രതീക്ഷിതത്വവും പെട്ടെന്നുള്ള സ്വഭാവവും നിലനിർത്തുന്ന നേരിട്ടുള്ള തത്തുല്യം.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: അവരുടെമേൽ ചാടിവീണു
  rationale: נפל ב എന്ന സൈനിക പ്രയോഗത്തിലെ ‘ആക്രമിച്ചുകയറുക’ എന്ന ആശയം, വെറും ‘ആക്രമിച്ചു’ എന്നതിനെക്കാൾ ദൃശ്യസാന്ദ്രമായി നിലനിർത്തുന്നു.
- source_word: וְ
  choice: അപ്പോൾ
  rationale: ആദ്യത്തെ waw കഥയിലെ തുടർച്ചയും സംഭവക്രമവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ അതിനെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
