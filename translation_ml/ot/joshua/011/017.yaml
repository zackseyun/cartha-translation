source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: ml
  text: സേയീരിലേക്കു ഉയർന്നുകിടക്കുന്ന ഹാലാക്ക് പർവതം[a] മുതൽ ഹെർമോൻ പർവതത്തിനു താഴെയുള്ള ലെബാനോൻ താഴ്വരയിലെ[b] ബാൽ-ഗാദ് വരെ, അവരുടെ എല്ലാ രാജാക്കന്മാരെയും യോശുവ പിടികൂടി; അവരെ അടിച്ചുവീഴ്ത്തി, കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മിനുസമുള്ള പർവതം.’ എബ്രായപദം വിവരണാത്മകമായി മനസ്സിലാക്കാനാകുമെങ്കിലും ഇവിടെ ‘ഹാലാക്ക് പർവതം’ എന്ന സ്ഥലനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലെബാനോൻ സമതലത്തിലെ.’ എബ്രായപദം വിശാലമായ താഴ്വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: ഹാലാക്ക് പർവതം
  rationale: സന്ദർഭത്തിൽ ഇത് ഭൂമിശാസ്ത്രപരമായ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; വിശേഷണാത്മകമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: സേയീരിലേക്കു ഉയർന്നുപോകുന്ന
  rationale: עלה എന്ന കൃതന്തത്തിന്റെ ഭൂപ്രകൃതിപരമായ ഉയർച്ചയെയോ കയറ്റത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְעַד בַּעַל גָּד
  choice: ബാൽ-ഗാദ് വരെ
  rationale: ഭൂപ്രദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി സൂചിപ്പിക്കുന്ന וְעַד എന്നതിനെ ‘വരെ’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: ലെബാനോൻ താഴ്വരയിലെ
  rationale: בִּקְעָה വിശാലമായ താഴ്വരയെയോ സമതലത്തെയോ സൂചിപ്പിക്കാം; ഈ ഭൂപ്രകൃതിസന്ദർഭത്തിൽ ‘താഴ്വര’ സ്വാഭാവികമാണ്, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: ഹെർമോൻ പർവതത്തിനു താഴെയുള്ള
  rationale: ഒരു പ്രധാന ഭൂപ്രദേശചിഹ്നത്തോടുള്ള താഴ്ന്ന സ്ഥാനം തַּחַת സൂചിപ്പിക്കുന്നതിനാൽ ‘താഴെയുള്ള’ എന്നു നൽകി.
- source_word: וְאֵת כָּל מַלְכֵיהֶם לָכַד
  choice: അവരുടെ എല്ലാ രാജാക്കന്മാരെയും യോശുവ പിടികൂടി
  rationale: എബ്രായത്തിൽ കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു; ഒറ്റപ്പെട്ട വാക്യത്തിലും വ്യക്തതയ്ക്കായി ‘യോശുവ’ വ്യക്തമാക്കി. כָּל എന്ന സമഗ്രത നിലനിർത്തി.
- source_word: וַיַּכֵּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്നതിന്റെ ഹിംസാത്മകമായ ‘അടിച്ചുവീഴ്ത്തുക/വെട്ടിവീഴ്ത്തുക’ എന്ന ആശയം നിലനിർത്തുകയും തുടർന്നുള്ള വ്യക്തമായ കൊല്ലൽക്രിയയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמִיתֵם
  choice: കൊന്നു
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം മരണത്തിനു കാരണമാകുന്നതിനെ വ്യക്തമായി പറയുന്നു; ആധുനിക മലയാളത്തിൽ ‘കൊന്നു’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
