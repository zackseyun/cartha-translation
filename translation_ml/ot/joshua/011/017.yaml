translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള ബൈബിൾ-മലയാള ലിപ്യന്തരണരീതിക്ക് അനുസൃതമായി നൽകി. മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത ഹിംസാക്രിയകൾ ഒറ്റ ക്രിയയായി ലയിപ്പിക്കാതെ നിലനിർത്തി.
