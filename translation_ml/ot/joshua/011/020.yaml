base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: ml
  text: അവരുടെ ഹൃദയങ്ങളെ കടുപ്പിച്ച്[a] ഇസ്രായേലിനെ യുദ്ധത്തിൽ നേരിടാൻ ഇടയാക്കിയത് യഹോവയിൽനിന്നായിരുന്നു. അവരെ നാശത്തിനായി സമർപ്പിക്കാനും[b], അവർക്കുവേണ്ടി കരുണാഭ്യർഥന ഉണ്ടാകാതിരിക്കാനും[c], യഹോവ മോശയോടു കല്പിച്ചതുപോലെ അവരെ നശിപ്പിക്കാനും വേണ്ടിയായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ഹൃദയങ്ങളെ ബലപ്പെടുത്തി.’ ഇവിടെ അവർ എതിർപ്പിൽ ഉറച്ചുനിൽക്കാൻ ഇടയായതിനെ, അതായത് അവരുടെ ഹൃദയങ്ങൾ കടുപ്പിക്കപ്പെട്ടതിനെ, ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ഇത് ന്യായവിധിക്കായി ഒരാളെ അല്ലെങ്കിൽ ഒന്നിനെ വിലക്കിനുകീഴാക്കി നാശത്തിനു സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദമാണ്. ‘അവരെ പൂർണമായി നശിപ്പിക്കാനും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവർക്ക് കരുണ ലഭിക്കാതിരിക്കാനും.’ എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്; അവർക്കുവേണ്ടിയുള്ള കരുണാഭ്യർഥന ഇല്ലാത്തതിനെയോ കരുണ ലഭിക്കാത്തതിനെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: യഹോവയിൽനിന്നായിരുന്നു
  rationale: ദൈവിക പ്രവർത്തനത്തിന്റെ ഉറവിടം നേരിട്ട് നിലനിർത്തുന്നു; ദൈവനാമം ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: അവരുടെ ഹൃദയങ്ങളെ കടുപ്പിച്ച്
  rationale: חזק എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ബലപ്പെടുത്തുക’ ആണെങ്കിലും, ഇവിടെ എതിർപ്പിൽ ഉറച്ചുനിൽക്കാൻ ഇടയാക്കുന്ന സന്ദർഭാർഥം ‘ഹൃദയം കടുപ്പിക്കുക’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ യുദ്ധത്തിൽ നേരിടാൻ
  rationale: ശത്രുതാപരമായ യുദ്ധസമ്മുഖീകരണം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמַעַן הַחֲרִימָם
  choice: അവർ നാശത്തിനായി സമർപ്പിക്കപ്പെടാനും
  rationale: חרם എന്ന സാങ്കേതിക ന്യായവിധി-പദത്തിന്റെ ‘നാശത്തിനായി വേർതിരിക്കുക/സമർപ്പിക്കുക’ എന്ന ശക്തി സൂക്ഷിക്കുന്നു; എബ്രായ അനന്തക്രിയയിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ നിഷ്ക്രിയരൂപം ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: അവർക്കു കരുണ ലഭിക്കാതിരിക്കാനും
  rationale: תְּחִנָּה സൂചിപ്പിക്കുന്ന കൃപയോ കരുണയോ ലഭിക്കാത്ത അവസ്ഥ ഇവിടെ സ്വാഭാവികമായി അറിയിക്കുന്നു; അപേക്ഷ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: അവർ നശിപ്പിക്കപ്പെടാനും
  rationale: שמד എന്നതിന്റെ ശക്തമായ നാശാർഥം വ്യക്തമായി നൽകുന്നു; കർത്താവിനെ അനാവശ്യമായി നിർണ്ണയിക്കാതെ എബ്രായത്തിലെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവകല്പനയുമായുള്ള പൊരുത്തം നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കനാന്യരുടെ ഹൃദയം കടുപ്പിക്കുന്നതിലെ ദൈവിക പ്രവർത്തനം
  choice: ‘യഹോവയിൽനിന്നായിരുന്നു’ എന്ന് ദൈവിക പ്രവർത്തനത്തിന്റെ ഉറവിടം തുറന്നുപറയുന്നു.
  alternative: യഹോവ അത് അനുവദിച്ചു എന്നു മൃദൂകരിക്കുക.
  rationale: എബ്രായപാഠം ഈ സംഭവത്തെ നേരിട്ട് യഹോവയിൽനിന്നുള്ളതെന്നു പറയുന്നു; അതിനെ വെറും അനുവാദമായി മാറ്റുന്നത് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇല്ലാതാക്കും.
- issue: חרם എന്ന പദത്തിന്റെ ന്യായവിധി-സ്വഭാവം
  choice: ‘നാശത്തിനായി സമർപ്പിക്കപ്പെടുക’
  alternative: ‘പൂർണമായി നശിപ്പിക്കപ്പെടുക’ അല്ലെങ്കിൽ ‘വിലക്കിനുകീഴാക്കപ്പെടുക’
  rationale: പദത്തിന്റെ പ്രത്യേക സമർപ്പണ/ന്യായവിധി ഭാവം നിലനിർത്തുകയും സാധാരണ നശിപ്പിക്കൽ എന്നതിലേക്കു ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: חרם, שמד എന്നീ അനന്തക്രിയകളുടെ കർത്താവ്
  choice: നിഷ്ക്രിയരൂപം ഉപയോഗിച്ച് കർത്താവിനെ വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
  alternative: യഹോവയെയോ ഇസ്രായേലിനെയോ വ്യക്തമായ കർത്താവായി ചേർക്കുക.
  rationale: എബ്രായത്തിൽ ഈ അനന്തക്രിയകളുടെ പ്രവർത്തകൻ വ്യാകരണപരമായി തുറന്നുപറഞ്ഞിട്ടില്ല; ഒരു കർത്താവിനെ ചേർക്കുന്നത് യഥാർത്ഥത്തിലുള്ള അനിശ്ചിതത്വം പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവിക പ്രവർത്തനം മൃദൂകരിക്കാതെ നിലനിർത്തി; എബ്രായത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്ത ഇടങ്ങളിൽ നിഷ്ക്രിയരൂപം ഉപയോഗിച്ച് യഥാർത്ഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
