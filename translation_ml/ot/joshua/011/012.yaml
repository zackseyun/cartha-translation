  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: ml
  text: ഈ രാജാക്കന്മാരുടെ എല്ലാ പട്ടണങ്ങളെയും അവരുടെ എല്ലാ രാജാക്കന്മാരെയും യോശുവ പിടിച്ചടക്കി. ആ രാജാക്കന്മാരെയെല്ലാം വാളിന്റെ ധാരകൊണ്ട് വെട്ടിവീഴ്ത്തി, നാശത്തിനായി സമർപ്പിച്ചു[a]. യാഹ്‌വെയുടെ ദാസനായ മോശ കൽപിച്ചതുപോലെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ പൂർണമായി നശിപ്പിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ആളുകളെയോ വസ്തുക്കളെയോ തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്.
    reason: lexical_alternative
