base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: ml
  text: ആ കാലത്ത് യോശുവ വന്ന് മലനാട്ടിൽനിന്ന്—ഹെബ്രോനിൽനിന്നും ദെബീരിൽനിന്നും അനാബിൽനിന്നും, യെഹൂദയുടെ മലനാട് മുഴുവനിൽനിന്നും ഇസ്രായേലിന്റെ മലനാട് മുഴുവനിൽനിന്നും—അനാക്യരെ ഇല്ലാതാക്കി. അവരുടെ പട്ടണങ്ങളോടൊപ്പം അവരെ യോശുവ നാശത്തിനായി സമർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “അവരെ നിരോധനത്തിന് വിധേയരാക്കി.” എബ്രായ ക്രിയ വ്യക്തികളെയോ വസ്തുക്കളെയോ നാശത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയ ഇവിടെ തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വന്ന്’ സ്വാഭാവികമായി അടുത്ത പ്രവർത്തനവുമായി ചേരുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: ആ കാലത്ത്
  rationale: സന്ദർഭത്തോടുള്ള കാലബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: וַיַּכְרֵת
  choice: ഇല്ലാതാക്കി
  rationale: כרת എന്നതിന്റെ അക്ഷരാർഥം ‘മുറിച്ചുകളയുക’ എന്നാണെങ്കിലും, ഇവിടെ ഒരു ജനവിഭാഗത്തെ പ്രദേശത്തുനിന്ന് നീക്കിക്കളയുകയോ ഉന്മൂലനം ചെയ്യുകയോ ചെയ്യുന്ന അർഥമാണ്. പിന്നാലെയുള്ള חרם എന്ന സാങ്കേതിക പദത്തിൽനിന്ന് വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: הָעֲנָקִים
  choice: അനാക്യർ
  rationale: ജനവിഭാഗനാമം മലയാളത്തിലെ വ്യക്തമായ ബഹുവചനരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִן הָהָר
  choice: മലനാട്ടിൽനിന്ന്
  rationale: യോശുവയിൽ הָהָר സാധാരണയായി ഒറ്റമലയെയല്ല, ഉയർന്ന ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: ഹെബ്രോനിൽനിന്നും ദെബീരിൽനിന്നും അനാബിൽനിന്നും
  rationale: സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ഓരോ സ്ഥലത്തോടുമുള്ള מן ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: യെഹൂദയുടെ മലനാട് മുഴുവനിൽനിന്നും
  rationale: യെഹൂദയോടു ബന്ധപ്പെട്ട മുഴുവൻ ഉയർന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മലനാട് മുഴുവനിൽനിന്നും
  rationale: ‘ഇസ്രായേൽ’ എന്ന ഭൂമിശാസ്ത്ര-രാഷ്ട്രീയ നാമം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തി.
- source_word: עִם עָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങളോടൊപ്പം
  rationale: עִם എന്നതിന്റെ സഹവർത്തിത്വാർഥവും עָרִים എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപവും നൽകുന്നു.
- source_word: הֶחֱרִימָם
  choice: അവരെ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘നാശത്തിനായി വേർതിരിക്കുക/സമർപ്പിക്കുക’ എന്ന സാങ്കേതിക യുദ്ധാർഥം വെറും ‘നശിപ്പിച്ചു’ എന്നതിലേക്കു ചുരുക്കാതെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: חרם എന്ന യുദ്ധസാങ്കേതിക പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: നിരോധനത്തിന് വിധേയരാക്കി; പൂർണമായി നശിപ്പിച്ചു
  rationale: വാക്യത്തിൽ כרת എന്നും חרם എന്നും രണ്ട് വ്യത്യസ്ത ക്രിയകൾ ഉള്ളതിനാൽ അവയെ ഒരേ മലയാളപദത്തിൽ ലയിപ്പിച്ചില്ല. ‘നാശത്തിനായി സമർപ്പിച്ചു’ എന്നത് חרם-ന്റെ ആചാരപരവും യുദ്ധപരവുമായ സവിശേഷ ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ അക്ഷരാനുസൃതമായ ബദൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങളുടെ ആവർത്തനഘടനയും כרת/חרם ക്രിയകളുടെ അർഥവ്യത്യാസവും സംരക്ഷിച്ചു.
