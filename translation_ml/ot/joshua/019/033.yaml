  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: ml
  text: അവരുടെ അതിർ ഹേലെഫിൽനിന്ന്, സാനന്നീമിലെ ഓക്കുമരത്തിൽനിന്ന്, അദാമി-നെക്കെബും യബ്‌നെയേലും കടന്ന്, ലക്കൂംവരെ ആയിരുന്നു[a]; അതിന്റെ അറ്റം യോർദ്ദാനിലായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഏലോൻ-ബെസാനന്നീമിൽനിന്ന്” എന്നും വായിക്കാം; ഹീബ്രു പദസമുച്ചയം ഒരു സ്ഥലനാമമായോ “സാനന്നീമിലെ/സാനന്നീമിന്റെ ഓക്കുമരം” എന്നായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “അതിന്റെ പുറപ്പെടലുകൾ യോർദ്ദാൻ ആയിരുന്നു”; അതിർത്തിയുടെ അന്ത്യബിന്ദുക്കൾ യോർദ്ദാനിലെത്തി എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: അവരുടെ അതിർ
  rationale: അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്ന גְּבוּל എന്ന പദവും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מֵחֵלֶף
  choice: ഹേലെഫിൽനിന്നും
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: സാനന്നീമിലെ കരുവേലകത്തിൽനിന്നും
  rationale: אֵלוֹן ഇവിടെ വലിയൊരു വൃക്ഷത്തെ സൂചിപ്പിക്കുന്ന പൊതുനാമമായി വായിച്ചു; ഏകീകൃത സ്ഥലനാമമായി വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: അദാമി-നെക്കെബിലൂടെയും
  rationale: അതിർത്തിവിവരണത്തിലെ സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; പട്ടികയുടെ സഞ്ചാരക്രമം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ലൂടെയും’ ഉപയോഗിച്ചു.
- source_word: וְיַבְנְאֵל
  choice: യബ്‌നെയേലിലൂടെയും
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; അതിർത്തി കടന്നുപോകുന്ന ഇടങ്ങളുടെ പരമ്പര സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിച്ചു.
- source_word: עַד לַקּוּם
  choice: ലക്കൂംവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന വ്യാപ്തിയുടെ അന്ത്യപരിധി ‘വരെ’ കൊണ്ട് പ്രകടിപ്പിച്ചു.
- source_word: תֹּצְאֹתָיו
  choice: അതിന്റെ അറ്റം
  rationale: അക്ഷരാർഥമായ ‘പുറപ്പെടലുകൾ’ എന്നതിനുപകരം അതിർത്തിവിവരണത്തിലെ അന്ത്യബിന്ദു എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകി; ഹീബ്രു പ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ മലയാള സ്ഥലനാമരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. അപൂർവ സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രുവിലെ സ്ഥലനാമ/പൊതുനാമ ദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
