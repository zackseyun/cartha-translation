translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അതിർത്തിവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പട്ടികഘടന മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘എന്നിവയും അതിൽ ഉൾപ്പെട്ടു’ എന്നു ചേർത്തു; സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
