  revised_text: അല്ലമ്മെലെക്ക്, അമാദ്, മിശാൽ; അതിർ കർമ്മേലിലേക്കു പടിഞ്ഞാറോട്ട് എത്തി, ശീഹോർ-ലിബ്നാത്തിലേക്കും എത്തി.
