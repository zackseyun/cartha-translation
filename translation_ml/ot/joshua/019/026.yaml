source:
  edition: WLC
  text: וְ/אַֽלַמֶּ֥לֶךְ וְ/עַמְעָ֖ד וּ/מִשְׁאָ֑ל וּ/פָגַ֤ע בְּ/כַרְמֶל֙ הַ/יָּ֔מָּ/ה וּ/בְ/שִׁיח֖וֹר לִבְנָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: ml
  text: അല്ലമ്മെലെക്ക്, അമാദ്, മിശാൽ; അതിർ കർമ്മേലിലേക്കു പടിഞ്ഞാറോട്ട് എത്തി, ശീഹോർ-ലിബ്നാത്തിലേക്കും എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: അല്ലമ്മേലെക്ക്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി.
- source_word: עַמְעָד
  choice: അമാദ്
  rationale: സ്ഥലനാമം; എബ്രായ രൂപത്തെ വായനാസൗകര്യത്തോടെ ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁאָל
  choice: മിശാൽ
  rationale: സ്ഥലനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וּפָגַע
  choice: അതിർ ... എത്തി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ ഒരു അതിർ ഒരു സ്ഥലത്തെ എത്തുകയോ തൊടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അതിർത്തിഭാഷയായി ‘എത്തി’ തെരഞ്ഞെടുത്തു.
- source_word: בְּכַרְמֶל
  choice: കർമ്മേലിലും
  rationale: അതിർ എത്തിച്ചേരുന്ന സ്ഥലമായി കർമ്മേലിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ഇൽ’ വിഭക്തി ഉപയോഗിച്ചു.
- source_word: הַיָּמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: പദശഃ ‘കടലിന്റെ ദിശയിലേക്ക്’; ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ മധ്യധരണ്യാഴി പടിഞ്ഞാറായതിനാൽ ദിശാസൂചനയായി ‘പടിഞ്ഞാറോട്ട്’ നൽകി, പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: ശീഹോർ-ലിബ്നാത്തിലും
  rationale: സംയുക്ത സ്ഥലനാമമായി കണ്ട് ഹൈഫനോടെ ലിപ്യന്തരിച്ചു; അതിർ എത്തുന്ന രണ്ടാമത്തെ സ്ഥലമെന്ന സമാന്തരഘടന നിലനിർത്തി.
