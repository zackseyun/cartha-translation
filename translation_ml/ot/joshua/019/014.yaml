  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָסַ֤ב אֹת/וֹ֙ הַ/גְּב֔וּל מִ/צְּפ֖וֹן חַנָּתֹ֑ן וְ/הָיוּ֙ תֹּֽצְאֹתָ֔י/ו גֵּ֖י יִפְתַּח אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി അതിനെ ചുറ്റി വടക്കോട്ട് ഹന്നാത്തോനിലേക്കു തിരിഞ്ഞു[a]; അതിന്റെ അറ്റങ്ങൾ[b] യിഫ്താഹ്-ഏൽ താഴ്‌വരയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹന്നാത്തോന്റെ വടക്കുവശത്ത്.” ഹീബ്രു പ്രയോഗം ദിശാസൂചനയായോ സ്ഥാനസൂചനയായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അതിന്റെ പുറപ്പെടുന്നിടങ്ങൾ”; അതിർത്തിവിവരണത്തിൽ അതിന്റെ അറ്റങ്ങളെയോ അവസാനബിന്ദുക്കളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: പിന്നെ ... ചുറ്റി ... തിരിഞ്ഞു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ അതിർത്തിരേഖ തിരിയുന്നതോ വളഞ്ഞുപോകുന്നതോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ദിശാമാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ
  choice: അതിനെ
  rationale: സന്ദർഭത്തിൽ സർവനാമം മുമ്പ് പറഞ്ഞ സ്ഥലത്തെയോ അതിർത്തിബിന്ദുവിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ നപുംസകപ്രയോഗം യോജിക്കുന്നു.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: ഭൂപങ്കിടൽ വിവരണത്തിൽ ഇത് പ്രദേശത്തിന്റെ അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: ഹന്നാത്തോന്റെ വടക്കുവശത്തേക്കു
  rationale: מן + צפון എന്ന പ്രയോഗത്തിലെ സ്ഥാനപരവും ദിശാപരവുമായ അർത്ഥസാധ്യതകൾ പൂർണമായി തീർപ്പാക്കാതെ, അതിർത്തി ഹന്നാത്തോന്റെ വടക്കുഭാഗത്തുകൂടി തിരിയുന്ന ഭാവം നൽകുന്നു.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: അതിന്റെ അറ്റങ്ങൾ ... ആയിരുന്നു
  rationale: തֹּצְאֹתָיו രൂപപരമായി ബഹുവചനമാണ്; അതിർത്തിയുടെ അവസാനബിന്ദുക്കൾ അല്ലെങ്കിൽ അറ്റങ്ങൾ എന്ന ഭൂമിശാസ്ത്രപരമായ അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: גֵּי
  choice: താഴ്‌വര
  rationale: ഗെയ് എന്ന പദം താഴ്‌വരയെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ സ്ഥലനാമത്തിന്റെ ഭാഗമായി 'താഴ്‌വര' വ്യക്തമാണ്.
- source_word: יִפְתַּח אֵל
  choice: യിഫ്താഹ്-ഏൽ
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത ലിപ്യന്തരണം ഉപയോഗിച്ചു.
