translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഹീബ്രുവിലെ ബഹുവചനം നിലനിർത്തുകയും മִצְּפוֹן എന്നതിലെ സ്ഥാന-ദിശാ അവ്യക്തത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
