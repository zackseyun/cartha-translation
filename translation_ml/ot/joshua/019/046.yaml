  text: യർക്കോനിലെ ജലങ്ങളും[a] രക്കോനും, യോപ്പയ്ക്ക് എതിരെയുള്ള അതിർത്തിപ്രദേശവും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യർക്കോനിലെ ജലങ്ങൾ’ എന്നതിനുപകരം ‘മേ-യർക്കോൻ’ എന്ന സ്ഥലനാമമായും ഹീബ്രു പദപ്രയോഗം മനസ്സിലാക്കാം.
    reason: lexical_alternative
