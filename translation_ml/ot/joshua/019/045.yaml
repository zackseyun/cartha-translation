    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהֻד
  choice: യെഹൂദ്
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. പദത്തിന്റെ തുടക്കത്തിലുള്ള וִ־ പട്ടികയിലെ മുൻ ഘടകവുമായി ബന്ധിപ്പിക്കുന്ന സംയോജകമാണ്.
- source_word: וּבְנֵי בְרַק
  choice: ബെനേ-ബെരാക്
  rationale: സന്ദർഭത്തിൽ ഇത് ‘ബെരാക്കിന്റെ പുത്രന്മാർ’ എന്ന സാധാരണ നാമവാക്യമല്ല, ദാൻ ഗോത്രത്തിന് ലഭിച്ച ഒരു പട്ടണത്തിന്റെ സംയുക്ത സ്ഥലനാമമാണ്. ഒറ്റ സ്ഥലനാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: וְגַת רִמּוֹן
  choice: ഗത്ത്-രിമ്മോൻ
  rationale: പട്ടികയിൽ ഒരു പട്ടണത്തെ സൂചിപ്പിക്കുന്ന സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; രണ്ടു വ്യത്യസ്ത സ്ഥലങ്ങളായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഹൈഫൻ ചേർത്തു.
