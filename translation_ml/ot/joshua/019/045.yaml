  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, പട്ടണപ്പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിലെ ആദ്യ അടിക്കുറിപ്പിന്റെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് അത് ബെനേ-ബെരാക്കിനോടു ചേർത്തു.
