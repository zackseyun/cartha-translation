base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: ml
  text: അതിർത്തി താബോർ, ശഹസൂമാ, ബേത്ത്-ശേമെശ് എന്നിവിടങ്ങളിലെത്തി[a]; അവരുടെ അതിർത്തി യോർദ്ദാനിൽ അവസാനിച്ചു[b]—പതിനാറു പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എത്തി’ എന്നതിന് ‘ചെന്നുചേർന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായ ക്രിയ ഒരു അതിർത്തിരേഖ ഒരു സ്ഥലവുമായി സമ്പർക്കത്തിൽ വരുന്നതിനെയോ അതിനെ എത്തിച്ചേരുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവരുടെ അതിർത്തിയുടെ പുറപ്പെടുന്നിടങ്ങൾ യോർദ്ദാൻ ആയിരുന്നു.’ അതിർത്തിയുടെ അറ്റത്തെയോ വ്യാപ്തിയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: അതിർത്തി ... എത്തി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ פגע ഒരു അതിർത്തിരേഖ ഒരു സ്ഥലത്തെ എത്തുന്നതോ അതുമായി ചേരുന്നതോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ സ്ഥലപരമായ അർഥം നിലനിർത്താൻ ‘എത്തി’ ഉപയോഗിച്ചു.
- source_word: בְּתָבוֹר
  choice: താബോർ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְשַׁחֲצוּמָה
  choice: ശഹസൂമാ
  rationale: മസൊററ്റിക് വായനയെ അടിസ്ഥാനമാക്കി സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: പദാർഥമായി വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: അവരുടെ അതിർത്തിയുടെ അറ്റം യോർദ്ദാൻ ആയിരുന്നു
  rationale: תֹּצְאוֹת എന്നതിന്റെ അക്ഷരാർഥം ‘പുറപ്പെടുന്നിടങ്ങൾ/അറ്റങ്ങൾ’ എന്നാണെങ്കിലും അതിർത്തിസൂത്രവാക്യത്തിൽ അന്തിമബിന്ദുവിനെയോ വ്യാപ്തിയെയോ സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തോടെ ഭൂമിശാസ്ത്രപരമായ ധർമ്മം നിലനിർത്തി.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: പതിനാറു പട്ടണങ്ങൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട്, സ്വാഭാവികമായ മലയാളക്രമത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: חָצֵר ഇവിടെ പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട അധീന കുടിയിരിപ്പുകളെയോ മതിലില്ലാത്ത ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഗ്രാമങ്ങൾ’ തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അതിർത്തിവിവരണത്തിന്റെ സാങ്കേതിക സ്വഭാവം അടിക്കുറിപ്പുകളിലൂടെ വ്യക്തമാക്കി.
