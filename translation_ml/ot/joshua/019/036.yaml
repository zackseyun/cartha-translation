  source_fidelity: ഹീബ്രു വാക്യത്തിലെ മൂന്ന് സ്ഥലനാമങ്ങളും അവയെ ബന്ധിപ്പിക്കുന്ന പട്ടികാസ്വഭാവവും കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു. אֲדָמָה ഇവിടെ സാധാരണനാമമല്ല, സ്ഥലനാമമാണെന്ന സന്ദർഭാർഥം ശരിയായി പരിഗണിച്ചിട്ടുണ്ട്. הָרָמָהയിലെ നിർദേശകഘടകം പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നതും ഇംഗ്ലീഷ് POB തീരുമാനവുമായി യോജിക്കുന്നു.
