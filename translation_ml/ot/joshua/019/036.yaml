lexical_decisions:
- source_word: אֲדָמָה
  choice: അദാമാ
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָרָמָה
  choice: രാമാ
  rationale: മുൻപിലുള്ള നിർദേശകഘടകം വേർതിരിച്ച് വിവർത്തനം ചെയ്യാതെ, സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: חָצוֹר
  choice: ഹാസോർ
  rationale: സ്ഥലനാമമായതിനാൽ അതിന്റെ സാദ്ധ്യമായ ശാബ്ദിക അർഥം നൽകാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְ
  choice: എന്നിവയും
  rationale: ഈ വാക്യം മുൻവാക്യത്തിൽ തുടരുന്ന പട്ടണപ്പട്ടികയുടെ ഭാഗമാണ്. ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വിധം അവതരിപ്പിച്ചു.
