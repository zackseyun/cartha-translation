  text: וַ/יְהִ֖י גְּב֣וּל נַחֲלָתָ֑/ם צָרְעָ֥ה וְ/אֶשְׁתָּא֖וֹל וְ/עִ֥יר שָֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: ml
  text: അവരുടെ അവകാശഭൂമിയുടെ അതിർത്തി സൊരാ, എശ്താവോൽ, ഈർ-ശെമെശ്[a] എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈർ-ശെമെശ് എന്ന പേരിന്റെ അർഥം ‘സൂര്യന്റെ നഗരം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വിവരണാത്മകമായ ഈ വാക്യത്തിൽ היה എന്ന ക്രിയയുടെ കഥനശൈലി മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയകൊണ്ട് പ്രകടമാക്കുന്നു; ഹീബ്രു സംയോജകത്തിന്റെ ബലം പ്രത്യേകം ‘അങ്ങനെ സംഭവിച്ചു’ എന്നു കൃത്രിമമായി വികസിപ്പിച്ചിട്ടില്ല.
- source_word: גְּבוּל
  choice: അതിർ
  rationale: ഗോത്രത്തിന് ലഭിച്ച അവകാശഭൂമിയുമായി ബന്ധപ്പെട്ട അതിർത്തി എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്ന് സ്ഥലനാമങ്ങളുടെ പട്ടിക വരുന്നതോടും ഇത് യോജിക്കുന്നു.
- source_word: נַחֲלָתָם
  choice: അവരുടെ അവകാശഭൂമി
  rationale: נַחֲלָה ഇവിടെ ഗോത്രത്തിന് അവകാശമായി ലഭിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. ‘സ്വത്ത്’ എന്നതിനെക്കാൾ ‘അവകാശഭൂമി’ ഭൂപ്രദേശപരവും ഉടമ്പടിസംബന്ധവുമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: צָרְעָה
  choice: സൊരാ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶשְׁתָּאוֹל
  choice: എഷ്ടാവോൽ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; വ്യഞ്ജനസമുച്ചയം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: עִיר שָׁמֶשׁ
  choice: ഈർ-ശേമെശ്
  rationale: ‘നഗരം’ + ‘സൂര്യൻ’ എന്ന ഘടകങ്ങളുള്ള സ്ഥലനാമം മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അതിന്റെ സുതാര്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകി. ഇംഗ്ലീഷ് കരടിൽ [a] എന്ന ചിഹ്നം അബദ്ധത്തിൽ Zorah-നു ശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് Ir-shemesh-നെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ചിഹ്നം ‘ഈർ-ശേമെശ്’ എന്നതിനുശേഷം ശരിയായി സ്ഥാപിച്ചു.
