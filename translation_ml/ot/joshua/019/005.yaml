lexical_decisions:
- source_word: צִקְלַג
  choice: സിക്ലാഗ്
  rationale: പട്ടണപ്പേരായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: ബേത്ത്-ഹമ്മർക്കാബോത്ത്
  rationale: ‘വീട്’ എന്നും ‘രഥങ്ങൾ’ എന്നും അർഥമുള്ള ഘടകങ്ങൾ ചേർന്ന സ്ഥലനാമമാണിത്. പട്ടികയിലെ സ്ഥലനാമമെന്ന നിലയിൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രുവിലെ നിർദിഷ്ടലേഖനമായ הַയും ഇരട്ട മ വ്യഞ്ജനവും ‘ഹമ്മ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: חֲצַר סוּסָה
  choice: ഹസർ-സൂസാ
  rationale: വാസസ്ഥലം/വളപ്പ്, കുതിര എന്നിവയുമായി ബന്ധപ്പെട്ട സംയുക്ത സ്ഥലനാമമായതിനാൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְ / וּ / וַ
  choice: -ഉം / -യും
  rationale: പട്ടികയിലെ ഓരോ പേരിനെയും ബന്ധിപ്പിക്കുന്ന ഹീബ്രു സംയോജകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവികമായ സമുച്ചയപ്രത്യയങ്ങളാൽ അവതരിപ്പിച്ചു.
