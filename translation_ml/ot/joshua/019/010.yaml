  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: ml
  text: മൂന്നാമത്തെ നറുക്ക്[a] സെബൂലൂന്റെ പുത്രന്മാർക്ക് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ചു. അവരുടെ അവകാശഭൂമിയുടെ അതിർത്തി സാരീദ് വരെ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “നറുക്ക് ഉയർന്നുവന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ലഭിച്ചു
  rationale: עלה എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘കയറിവന്നു/ഉയർന്നുവന്നു’ എന്നാണെങ്കിലും നറുക്കെടുപ്പിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘നറുക്ക് ലഭിച്ചു’ എന്നത് സ്വാഭാവികമാണ്; മൂലത്തിലെ ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: മൂന്നാമത്തെ നറുക്ക്
  rationale: ഭൂവിഭജനം നിർണയിക്കാൻ ഉപയോഗിച്ച നറുക്കിനെയും അതിന്റെ ക്രമത്തെയും കൃത്യമായി അറിയിക്കുന്നു.
- source_word: לִבְנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാർക്ക്
  rationale: בני എന്ന കുടുംബ-ഗോത്ര പ്രയോഗത്തിന്റെ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് സെബൂലൂൻ ഗോത്രത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ കുടുംബ-കുല വിഭാഗങ്ങൾ പ്രകാരമുള്ള വിതരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: גְּבוּל נַחֲלָתָם
  choice: അവരുടെ അവകാശഭൂമിയുടെ അതിർത്തി
  rationale: גבול എന്നത് അതിർത്തിയെയും נחלה നറുക്കിലൂടെ ലഭിച്ച പാരമ്പര്യാവകാശഭൂമിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: עַד שָׂרִיד
  choice: സാരീദ് വരെ
  rationale: അതിർത്തിയുടെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന עד എന്ന പദവും സ്ഥലനാമവും സ്വാഭാവികമായി നൽകുന്നു.
