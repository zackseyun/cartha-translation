translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗോത്രപരമായ കുടുംബഭാഷയും ഭൂവിഭജനത്തിലെ ‘അവകാശഭൂമി’ എന്ന ആശയവും നിലനിർത്തിയിരിക്കുന്നു; നീണ്ട എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
