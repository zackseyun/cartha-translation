translation:
  language: ml
  text: റെമെത്ത്[a], ഏൻ-ഗന്നീം, ഏൻ-ഹദ്ദാ, ബേത്ത്-പസ്സേസ് എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഹീബ്രു സ്ഥലനാമങ്ങളിൽ ‘ഏൻ-ഗന്നീം’ എന്നതിന് സാധ്യതയുള്ള അർഥം ‘തോട്ടങ്ങളുടെ ഉറവ’ എന്നാണ്; ‘ഏൻ-ഹദ്ദാ’യുടെ ആദ്യഘടകം ‘ഉറവ’ എന്നും ‘ബേത്ത്-പസ്സേസ്’യുടെ ആദ്യഘടകം ‘വീട്’ എന്നും അർഥമാക്കുന്നു. ഇവ ഇവിടെ പട്ടണനാമങ്ങളായതിനാൽ പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: റെമെത്ത്
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: עֵין גַּנִּים
  choice: ഏൻ-ഗന്നീം
  rationale: עֵין ('ഉറവ') + גַּנִּים ('തോട്ടങ്ങൾ') എന്ന സംയുക്ത സ്ഥലനാമം; പട്ടണനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: עֵין חַדָּה
  choice: ഏൻ-ഹദ്ദാ
  rationale: עֵין ('ഉറവ') കൊണ്ട് തുടങ്ങുന്ന സ്ഥലനാമം; രണ്ടാം ഘടകത്തിന്റെ അർഥം അനിശ്ചിതമായതിനാൽ മുഴുവൻ പേരും ലിപ്യന്തരിച്ചു.
- source_word: בֵית פַּצֵּץ
  choice: ബേത്ത്-പസ്സേസ്
  rationale: בֵית ('വീട്') ഉൾപ്പെടുന്ന സംയുക്ത സ്ഥലനാമം; ഭൂമിശാസ്ത്രപരമായ പട്ടികയിൽ അർഥപരിഭാഷയെക്കാൾ ലിപ്യന്തരണം സ്വാഭാവികമാണ്.
- source_word: וְ
  choice: എന്നിവയും
  rationale: ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ അവസാനത്തെ ‘എന്നിവയും’കൊണ്ട് പ്രതിനിധീകരിച്ചു; മുൻവാക്യവുമായി പട്ടിക തുടരുന്നതിന്റെ ഭാവവും ‘യും’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി. സ്ഥലനാമങ്ങൾക്ക് മലയാള ഉച്ചാരണസൗകര്യമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു; ഹീബ്രു വാക്യം മുൻപത്തെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തെ സംയോജകഭാവം നിലനിർത്തി.
