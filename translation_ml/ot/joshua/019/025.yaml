translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂവിഭജന-പട്ടികാശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ബന്ധകങ്ങൾ മലയാളത്തിൽ ഓരോ പേരിനുമുമ്പും ആവർത്തിക്കാതെ, പട്ടികയുടെ സ്വാഭാവികതയ്ക്കായി ‘എന്നിവ’ ഉപയോഗിച്ചു.
