    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഈ രൂപം അതിർത്തിവിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. സ്ഥലനാമങ്ങളുടെ പട്ടികയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്ന വിധത്തിൽ വാക്യാവസാനത്ത് ‘ആയിരുന്നു’ എന്നു നൽകി.
- source_word: גְּבוּלָם
  choice: അവരുടെ അതിർ
  rationale: גְּבוּל ഇവിടെ ഗോത്രത്തിന് അനുവദിച്ച പ്രദേശത്തിന്റെ അതിർത്തിയെ സൂചിപ്പിക്കുന്നു; ഭൂവിഭജനസന്ദർഭത്തിൽ ‘അതിർ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്. പ്രത്യയം ബഹുവചനത്തിലുള്ള ‘അവരുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֶלְקַת
  choice: ഹെൽക്കത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַחֲלִי
  choice: ഹാലി
  rationale: സ്ഥലനാമം മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וָבֶטֶן
  choice: ബേതെൻ
  rationale: ഹീബ്രു സ്ഥലനാമം നേരിട്ട് മലയാളലിപിയിൽ നൽകി.
- source_word: וְאַכְשָׁף
  choice: അക്ഷാഫ്
  rationale: ഹീബ്രു ഉച്ചാരണഘടനയെ അടുത്ത് പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു; പരമ്പരാഗതമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
