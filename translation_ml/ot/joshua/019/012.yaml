  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി സാരീദിൽനിന്ന് കിഴക്കോട്ട്, സൂര്യോദയദിശയിലേക്ക്[a], തിരിഞ്ഞ് കിസ്ലോത്ത്-താബോരിന്റെ അതിർത്തിവരെ എത്തി; അവിടെനിന്ന് ദാബെരത്തിലേക്കു നീങ്ങി യാഫീയയിലേക്കു കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘കിഴക്കോട്ട്, സൂര്യൻ ഉദിക്കുന്ന ദിശയിലേക്ക്’; അക്ഷരാർഥം: ‘കിഴക്കോട്ട്, സൂര്യന്റെ ഉദയം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: പിന്നെ അതിർത്തി ... തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണങ്ങളിൽ שוב ദിശാമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവായ ‘അതിർത്തി’ വ്യക്തമാക്കുകയും ‘തിരിഞ്ഞ്’ എന്നത് ഭൂമിശാസ്ത്രപരമായ ചലനം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: מִשָּׂרִיד
  choice: സാരീദിൽനിന്ന്
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോടടുത്ത് ലിപ്യന്തരണം ചെയ്തു; מן ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: കിഴക്കോട്ട്, സൂര്യോദയദിശയിലേക്ക്
  rationale: കിഴക്കൻ ദിശയെ ഇരട്ടപ്രയോഗത്തിലൂടെ ഊന്നിപ്പറയുന്ന ഹീബ്രു രൂപവും സൂര്യോദയത്തിന്റെ ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: עַל גְּבוּל
  choice: അതിർത്തിവരെ എത്തി
  rationale: ഈ അതിർത്തിവിവരണത്തിൽ ഒരു അതിർത്തിപ്രദേശത്തെത്തുന്ന ചലനമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വരെ എത്തി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כִּסְלֹת תָּבֹר
  choice: കിസ്ലോത്ത്-താബോർ
  rationale: സംയുക്ത സ്ഥലനാമം ഹീബ്രുവിനോടടുത്ത് ലിപ്യന്തരണം ചെയ്ത് ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: וְיָצָא
  choice: അവിടെനിന്ന് ... നീങ്ങി
  rationale: അതിർത്തിവിവരണത്തിൽ יצא അതിർത്തിരേഖ തുടർന്നു പുറപ്പെടുന്നതോ വ്യാപിക്കുന്നതോ സൂചിപ്പിക്കുന്നു. ‘നീങ്ങി’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭൂമിശാസ്ത്രചലനം നൽകുന്നു.
- source_word: אֶל הַדָּבְרַת
  choice: ദാബെരത്തിലേക്ക്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ലക്ഷ്യദിശ אֶל അനുസരിച്ച് ‘-ലേക്ക്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ നിർദേശോപപദം മലയാള സ്ഥലനാമത്തിനു മുമ്പിൽ വേർതിരിച്ച് പ്രകടമാക്കേണ്ടതില്ല.
- source_word: וְעָלָה
  choice: കയറിച്ചെന്നു
  rationale: עלה സൂചിപ്പിക്കുന്ന ഉയരത്തിലേക്കുള്ള കയറ്റത്തിന്റെ ഭൂപ്രകൃതിനിറം നിലനിർത്തുന്നു.
- source_word: יָפִיעַ
  choice: യാഫീയ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോടടുത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. ആവർത്തനഭാരം കുറയ്ക്കാൻ രണ്ടാമത്തെ ഘട്ടത്തിൽ ‘അവിടെനിന്ന്’ ചേർത്തെങ്കിലും ഹീബ്രുവിലെ ദിശാക്രമവും സൂര്യോദയദൃശ്യവും ഉയരത്തിലേക്കുള്ള കയറ്റവും സംരക്ഷിച്ചു. എല്ലാ സ്ഥലനാമങ്ങളും മൂലഹീബ്രുവിനോടടുത്ത് ലിപ്യന്തരണം ചെയ്തു.
