  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שַֽׁעֲלַבִּ֥ין וְ/אַיָּל֖וֹן וְ/יִתְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/042.yaml
  text: and Shaalabbin[a], and Aijalon[c][b], and Ithlah.
translation:
  language: ml
  text: ശാലബ്ബീനും[a], അയ്യാലോനും[b], യിത്‌ലായും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബന്ധപ്പെട്ട വേദഭാഗങ്ങളിലും ചില പരിഭാഷാപാരമ്പര്യങ്ങളിലും ഈ പേര് ‘ശാൽബീം’ അല്ലെങ്കിൽ ‘ശാലബീം’ എന്നും കാണപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അയ്യാലോൻ എന്ന പേര് ‘അയാലോൻ’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ചില പഴയ പരിഭാഷാപാരമ്പര്യങ്ങളിൽ യിത്‌ലാ എന്ന പേര് ‘യെത്‌ലാ’ എന്നും നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: -ഉം
  rationale: ഓരോ സ്ഥലനാമത്തോടും ചേർന്നിരിക്കുന്ന എബ്രായ സംയോജകത്തെ മലയാളത്തിലെ ആവർത്തിതമായ ‘-ഉം’ ഉപയോഗിച്ച് നൽകി; ഇതിലൂടെ പട്ടികയുടെ ഘടനയും താളവും നിലനിർത്തുന്നു.
- source_word: שַׁעֲלַבִּין
  choice: ശാലബ്ബീൻ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ രൂപത്തെ ആധാരമാക്കി ലിപ്യന്തരണം ചെയ്തു. മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി ആദ്യ അക്ഷരസംയോജനം ‘ശാ’ എന്നു നൽകി; ഇരട്ട ബേത് ‘ബ്ബ’ എന്നും ദീർഘമായ അവസാന സ്വരം ‘ഈ’ എന്നും പ്രതിഫലിപ്പിച്ചു.
- source_word: אַיָּלוֹן
  choice: അയ്യാലോൻ
  rationale: എബ്രായത്തിലെ ഇരട്ട യോദ് ശബ്ദത്തെ ‘യ്യ’ എന്നും ദീർഘസ്വരങ്ങളെ ‘ആ’, ‘ഓ’ എന്നും പ്രതിഫലിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: יִתְלָה
  choice: യിത്‌ലാ
  rationale: ആദ്യ യോദ് ഉൾപ്പെടെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം; അവസാന ദീർഘസ്വരം ‘ആ’ ആയി നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്ഥലനാമങ്ങളുടെ എബ്രായ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണമാണ് ഉപയോഗിച്ചത്. ആവർത്തിക്കുന്ന ‘-ഉം’ പട്ടികയുടെ എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; ഭാഷ ലളിതവും ഗൗരവമുള്ളതുമാണ്.
