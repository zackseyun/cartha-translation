lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: മുമ്പ് വിവരിച്ച ഭൂപ്രദേശവിഹിതത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന നിർദേശകസർവനാമം. യോശുവയിലെ ഈ വിവരണസംഗ്രഹസൂത്രത്തിന് ഭൂതകാലരൂപം സ്വാഭാവികമാണ്; ക്രിയയില്ലാത്ത എബ്രായ വാക്യമായതിനാൽ വർത്തമാനകാലവും സാധ്യമാണ്.
- source_word: נַחֲלַת
  choice: അവകാശം
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർത്ഥച്ഛായകൾ ‘അവകാശം’ നിലനിർത്തുന്നു.
- source_word: בְּנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥം ‘സെബൂലൂന്റെ പുത്രന്മാർ’; ഇവിടെ ഗോത്രത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന കുടുംബപരമായ പ്രയോഗം നിലനിർത്തി.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ വംശങ്ങൾക്കനുസരിച്ചുള്ള
  rationale: לְ ഇവിടെ വിഭജനമോ വർഗീകരണമോ സൂചിപ്പിക്കുന്നു; מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: മുമ്പ് പേരെടുത്ത നഗരകേന്ദ്രങ്ങളെ സംഗ്രഹിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ഈ പട്ടികാസന്ദർഭത്തിന് ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങളും
  rationale: പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ വാസസ്ഥലങ്ങളെയാണ് חָצֵר ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപദമാണ്.
