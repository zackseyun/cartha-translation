  language: ml
  text: 'സെബൂലൂന്റെ പുത്രന്മാരുടെ വംശങ്ങൾക്കനുസരിച്ചുള്ള അവകാശം ഇതായിരുന്നു[a]: ഈ പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സെബൂലൂന്റെ പുത്രന്മാരുടെ വംശങ്ങൾക്കനുസരിച്ചുള്ള അവകാശം ഇതാണ്.” എബ്രായത്തിൽ നിർദേശകസർവനാമത്തോടുകൂടിയ ക്രിയയില്ലാത്ത വാക്യമാണുള്ളത്; അതിനാൽ ഈ സംഗ്രഹപ്രയോഗം വർത്തമാനകാലത്തിലോ ഭൂതകാലത്തിലോ പരിഭാഷപ്പെടുത്താം.
