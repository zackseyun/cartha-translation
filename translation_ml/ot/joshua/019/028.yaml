  text: എബ്രോൻ[a], രെഹോബ്, ഹമ്മോൻ, കാനാ, മഹത്തായ സീദോൻവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം: “എബ്രോൻ”; ചില പാഠപാരമ്പര്യങ്ങളിലും പരിഭാഷകളിലും “അബ്ദോൻ” എന്നു കാണുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: עֶבְרֹן
  choice: എബ്രോൻ
  rationale: മസോരറ്റിക് പാഠത്തിലെ വ്യഞ്ജനരൂപം നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു; വ്യത്യസ്ത പാഠപാരമ്പര്യത്തിലെ ‘അബ്ദോൻ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: רְחֹב
  choice: രെഹോബ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: חַמּוֹן
  choice: ഹമ്മോൻ
  rationale: ദ്വിത്വ മെയ്യും ദീർഘസ്വരവും പ്രതിഫലിപ്പിക്കുന്ന സ്ഥലനാമ ലിപ്യന്തരണം.
- source_word: קָנָה
  choice: കാനാ
  rationale: എബ്രായ സ്ഥലനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַד
  choice: വരെ
  rationale: അതിർത്തിയുടെ എത്തിച്ചേരുന്ന പരിധി സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: צִידוֹן רַבָּה
  choice: മഹാനഗരമായ സീദോൻ
  rationale: רַבָּה സീദോന്റെ പ്രാധാന്യത്തെ സൂചിപ്പിക്കുന്ന വിശേഷണമാണെന്ന് വ്യക്തമാക്കി, മലയാളത്തിൽ തെറ്റായ വലുപ്പസൂചന ഒഴിവാക്കാൻ ‘മഹാനഗരമായ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികയുടെ ഭൂമിശാസ്ത്രപരമായ ഒഴുക്ക് വ്യക്തമാക്കാൻ ‘എന്നിവിടങ്ങളിലൂടെ’ ചേർത്തു; ഇത് അതിർത്തിവിവരണത്തിന്റെ സന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
