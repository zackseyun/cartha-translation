  to: അവരുടെ അതിർത്തി പടിഞ്ഞാറോട്ട് മാറാലാവരെ കയറി; ദബ്ബേശെത്തിനെ തൊടുകയും യൊക്നെയാമിന് എതിരെയുള്ള വാടിയെ[a] തൊടുകയും ചെയ്തു.
