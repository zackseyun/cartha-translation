  text: וְ/עָלָ֨ה גְבוּלָ֧/ם לַ/יָּ֛מָּ/ה וּ/מַרְעֲלָ֖ה וּ/פָגַ֣ע בְּ/דַבָּ֑שֶׁת וּ/פָגַע֙ אֶל הַ/נַּ֔חַל אֲשֶׁ֖ר עַל פְּנֵ֥י יָקְנְעָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: ml
  text: അവരുടെ അതിർത്തി പടിഞ്ഞാറോട്ട് മാറാലാവരെ കയറി; ദബ്ബേശെത്തിനെ തൊടുകയും യൊക്നെയാമിന് എതിരെയുള്ള വാടിയെ[a] തൊടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'വാടി: സാധാരണയായി കാലാവസ്ഥാനുസൃതമായ ജലപാതയെയോ അതിന്റെ താഴ്വരയെയോ സൂചിപ്പിക്കുന്ന ഭൗമപദം.'
    reason: ഹീബ്രു נַחַל എന്ന പദത്തിന്റെ വിശാലമായ ഭൗമാർഥം വ്യക്തമാക്കുന്നു; ഒരു പ്രത്യേക ജലപ്രവാഹസ്വഭാവം നിർണയിക്കുന്നില്ല.
lexical_decisions:
- source_word: וְעָלָה
  choice: കയറി
  rationale: അതിർത്തിരേഖ ഭൂപ്രകൃതിയിലൂടെ ഉയരുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ക്രിയയുടെ അടിസ്ഥാന ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: לַיָּמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘കടലിലേക്കു’ എന്നാണെങ്കിലും ദിശാസൂചനയായി ഇവിടെ പടിഞ്ഞാറ് ഉദ്ദേശിക്കുന്നു.
- source_word: וּפָגַע
  choice: തൊട്ട്
  rationale: അതിർത്തി ഒരു സ്ഥലത്തെയോ ഭൗമസവിശേഷതയെയോ എത്തി സ്പർശിക്കുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: הַנַּחַל
  choice: തോട്
  rationale: നַחַל സാധാരണയായി കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന താഴ്വരയെയോ ജലപാതയെയോ സൂചിപ്പിക്കുന്നു; ഈ അതിർത്തിവിവരണത്തിൽ ലളിതമായ ഭൗമപദമായി ‘തോട്’ തിരഞ്ഞെടുത്തു.
- source_word: עַל־פְּנֵי
  choice: എതിരെയുള്ള
  rationale: സ്ഥലബന്ധത്തിൽ ‘മുന്നിലുള്ള/എതിർവശത്തുള്ള’ എന്ന അർഥം ഇവിടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
