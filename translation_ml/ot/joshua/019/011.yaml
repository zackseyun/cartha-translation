translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവിവരണത്തിന്റെ സംക്ഷിപ്തതയും ഹീബ്രുവിലെ ആവർത്തനവും നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ച ലിപ്യന്തരണത്തിൽ നൽകി.
