  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായ സമാപനസൂത്രത്തിന്റെ ഘടന ദീർഘരേഖയിലൂടെ നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
