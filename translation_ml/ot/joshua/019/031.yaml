  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי אָשֵׁ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: ml
  text: ആശേർ മക്കളുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ച അവകാശം ഇതായിരുന്നു[a]—ഈ പട്ടണങ്ങളും അവയുടെ കുടിയിരിപ്പുകളും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതാണ്.” എബ്രായത്തിലെ ചൂണ്ടുപദത്തോടുകൂടിയ നാമവാക്യം കൂടുതൽ രൂപാനുസൃതമായി വർത്തമാനകാലത്തിൽ പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിലെ വിവരണസമാപനത്തിന് ഭൂതകാലം സ്വാഭാവികമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവയുടെ ഗ്രാമങ്ങളും.” എബ്രായപദം പട്ടണങ്ങളുമായി ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ ജനവാസങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: വിവരിച്ചുകഴിഞ്ഞ ഭൂവിഭാഗത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന സർവനാമമാണിത്. വിവരണത്തിന്റെ സമാപനവാക്യമായതിനാൽ ഭൂതകാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; എങ്കിലും എബ്രായ നാമവാക്യം വർത്തമാനകാലത്തിലും പരിഭാഷപ്പെടുത്താം.
- source_word: נַחֲלַת
  choice: ലഭിച്ച അവകാശം
  rationale: യോശുവയിലെ ഭൂവിഭജനസന്ദർഭത്തിൽ ഈ പദം അവകാശമായി ലഭിച്ച പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ ഉടമ്പടിയുടെയും കുടുംബപാരമ്പര്യത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു; ‘ലഭിച്ച’ എന്നത് മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ചേർത്തതാണ്.
- source_word: מַטֵּה בְנֵי אָשֵׁר
  choice: ആശേർ മക്കളുടെ ഗോത്രത്തിന്
  rationale: מַטֵּה ഇവിടെ വടി എന്ന അക്ഷരാർഥത്തിലല്ല, ഗോത്രഘടകത്തെ സൂചിപ്പിക്കുന്നു. בְנֵי אָשֵׁר എന്ന എബ്രായ പുത്രബന്ധപ്രയോഗം ‘ആശേർ മക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്നതിന്റെ വിതരണാർഥം ‘അനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: עָרִים ജനവാസമുള്ള നഗരകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമാണ്. ആധുനിക മലയാളത്തിൽ സ്ഥലങ്ങളുടെ വലുപ്പത്തെക്കുറിച്ച് അനാവശ്യ ധാരണ ഉണ്ടാക്കാതെ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: וְחַצְרֵיהֶן
  choice: അവയോടു ചേർന്ന കുടിയിരിപ്പുകൾ
  rationale: חָצֵר ഇവിടെ പട്ടണങ്ങളുമായി ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ ജനവാസങ്ങളെയോ മതിലില്ലാത്ത ചെറുകുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കാം. ‘കുടിയിരിപ്പുകൾ’ ഈ വിശാല അർഥം നിലനിർത്തുന്നു; ‘അവയോടു ചേർന്ന’ എന്നത് പട്ടണങ്ങളുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
