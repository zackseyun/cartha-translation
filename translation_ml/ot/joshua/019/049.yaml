source:
  edition: WLC
  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: ml
  text: അവർ ദേശത്തെ അതിന്റെ പ്രദേശവിഭാഗങ്ങൾക്കനുസരിച്ച്[a] അവകാശവിഹിതമായി വിഭജിച്ചു തീർന്നപ്പോൾ, ഇസ്രായേൽമക്കൾ നൂന്റെ മകനായ യോശുവയ്ക്ക് അവരുടെ ഇടയിൽ ഒരു അവകാശവിഹിതം കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ അതിർത്തികൾക്കനുസരിച്ച്.’ ഹീബ്രുപദം പ്രദേശവിഭാഗങ്ങളെയും അവയുടെ അതിർത്തിരേഖകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: വീതിച്ചുതീർന്നപ്പോൾ
  rationale: כלה എന്ന ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും തുടർന്നുള്ള സംഭവത്തോടുള്ള കാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִנְחֹל
  choice: അവകാശമായി വീതിക്കുക
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ נחל വെറും കൈവശപ്പെടുത്തലല്ല, ഗോത്രങ്ങൾക്ക് അവകാശവിഹിതമായി നിശ്ചയിച്ചു നൽകുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: യോശുവയുടെ പശ്ചാത്തലത്തിൽ ഇത് ഭൂമിയെ പൊതുവായി അല്ല, വിഭജിക്കപ്പെടുന്ന വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לִגְבוּלֹתֶיהָ
  choice: അതിന്റെ പ്രദേശവിഭാഗങ്ങൾക്കനുസരിച്ച്
  rationale: גבול അതിർത്തിരേഖകളെയും അതിനാൽ നിർവചിക്കപ്പെട്ട പ്രദേശങ്ങളെയും സൂചിപ്പിക്കാം; ഇവിടെ ബഹുവചനം ദേശത്തിന്റെ പ്രാദേശിക വിഭജനങ്ങൾക്ക് യോജിക്കുന്നു. യഥാർഥമായ പദാർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתְּנוּ
  choice: കൊടുത്തു
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു; ഔദ്യോഗികമായ അനുവദിക്കൽ എന്ന ആശയം സന്ദർഭത്തിൽ നിന്ന് വ്യക്തമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു ദേശീയവിളിപ്പിന്റെ രൂപത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗവുമാണ്.
- source_word: נַחֲלָה
  choice: ഒരു അവകാശം
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭൂവിഹിതത്തിന്റെ അർഥം ‘അവകാശം’ നിലനിർത്തുന്നു; വെറും സ്വത്ത് എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവയ്ക്ക്
  rationale: വ്യക്തിനാമവും പിതൃനാമവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ
  rationale: യോശുവയുടെ അവകാശം ഇസ്രായേലിന്റെ സമൂഹത്തിന്റെയും ഭൂവിഹിതങ്ങളുടെയും നടുവിൽ തന്നെയായിരുന്നു എന്ന സ്ഥല-സാമൂഹിക സൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ദേശീയവിളിപ്പ്
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഔപചാരിക ഘടനയോട് അടുത്തുനിൽക്കുമ്പോഴും ആ ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവ് ദേശീയവിളിപ്പായി വായിക്കപ്പെടുന്നു.
- issue: נַחֲלָה എന്ന ഭൂവിഹിതപദത്തിന്റെ സൂക്ഷ്മത
  choice: ഒരു അവകാശം
  alternative: ഒരു ഓഹരി / ഒരു കൈവശഭൂമി
  rationale: ദേശവിഭജനത്തിലെ ലഭിച്ച വിഹിതം എന്ന നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ‘അവകാശം’ കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘അവകാശം’ എന്ന പ്രധാന ഭൂവിഹിതപദം ആവർത്തിച്ച് മൂലത്തിലെ നാമ-ക്രിയബന്ധം ദൃശ്യമാക്കിയിട്ടുണ്ട്; അതിർത്തി/പ്രദേശം എന്ന അർഥവൈകല്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
