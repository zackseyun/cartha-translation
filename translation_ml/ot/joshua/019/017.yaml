source:
  edition: WLC
  text: לְ/יִ֨שָּׂשכָ֔ר יָצָ֖א הַ/גּוֹרָ֣ל הָֽ/רְבִיעִ֑י לִ/בְנֵ֥י יִשָּׂשכָ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: ml
  text: യിസ്സാഖാറിനായി നാലാമത്തെ നറുക്ക് പുറത്തുവന്നു—യിസ്സാഖാറിന്റെ പുത്രന്മാർക്കായി, അവരുടെ കുലങ്ങൾ അനുസരിച്ച്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: യിസ്സാഖാറിന്
  rationale: പ്രത്യയം לְ ഇവിടെ നറുക്ക് ലഭിക്കുന്ന ഗോത്രത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദാതൃവിഭക്തി സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: יָצָא
  choice: വന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പുറപ്പെട്ടു/വന്നു’ എന്ന ദൃശ്യഭാവം നറുക്കെടുപ്പിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַגּוֹרָל
  choice: നറുക്ക്
  rationale: ഗോത്രാവകാശം നിർണയിക്കാൻ എടുത്ത നറുക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഓഹരി’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ ഫലമായ ഭൂവിഹിതത്തിലേക്ക് അർഥം മാറാം.
- source_word: הָרְבִיעִי
  choice: നാലാമത്തെ
  rationale: വിഹിതനിർണയത്തിലെ ക്രമസംഖ്യ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: യിസ്സാഖാറിന്റെ പുത്രന്മാർക്ക്
  rationale: בְנֵי എന്ന ഗോത്രവംശപരമായ പ്രയോഗത്തിന്റെ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ യിസ്സാഖാറിന്റെ വംശജരായ ഗോത്രജനത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ കൃത്യമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനം നിലനിർത്തി, ആദ്യഭാഗത്തിലെ ഗോത്രനാമവും തുടർന്ന് വരുന്ന വംശപരമായ വിശദീകരണവും തമ്മിലുള്ള ഘടന ദീർഘരേഖയിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
