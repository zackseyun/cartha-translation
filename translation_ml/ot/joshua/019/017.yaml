- from: യിസ്സാഖാറിന് നാലാമത്തെ നറുക്ക് വന്നു—യിസ്സാഖാറിന്റെ പുത്രന്മാർക്ക് അവരുടെ കുലങ്ങൾപ്രകാരം.
  to: യിസ്സാഖാറിനായി നാലാമത്തെ നറുക്ക് പുറത്തുവന്നു—യിസ്സാഖാറിന്റെ പുത്രന്മാർക്കായി, അവരുടെ കുലങ്ങൾ അനുസരിച്ച്.
