  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി രാമയിലേക്കും കോട്ടകെട്ടി ഉറപ്പിച്ച സോർ നഗരത്തിലേക്കും തിരിഞ്ഞു; തുടർന്ന് അതിർത്തി ഹോസയിലേക്കു തിരിഞ്ഞു. അതിന്റെ അതിർത്തിയറ്റങ്ങൾ അക്സീബിന്റെ ഭൂപ്രദേശത്തുനിന്ന് കടലിലേക്കായിരുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പടിഞ്ഞാറോട്ടായിരുന്നു’; ഹീബ്രുവിൽ അക്ഷരാർഥം ‘കടലിലേക്ക്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അക്സീബിന്റെ ഭൂപ്രദേശം’ എന്നതിന് ‘അക്സീബിന്റെ മേഖല’ അല്ലെങ്കിൽ ‘അക്സീബിന്റെ ദേശം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: അതിർത്തി ... തിരിഞ്ഞു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ שוב ദിശാമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തിരിഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָרָמָה
  choice: രാമയിലേക്ക്
  rationale: ദിശാസൂചകമായ -ה ഉൾക്കൊള്ളുന്നതിനാൽ സ്ഥലനാമത്തെ ലക്ഷ്യമാക്കിയുള്ള നീക്കമായി വിവർത്തനം ചെയ്തു.
- source_word: עִיר מִבְצַר צֹר
  choice: കോട്ടകെട്ടി ഉറപ്പിച്ച സോർ നഗരം
  rationale: מִבְצַר നഗരത്തിന്റെ കോട്ടയുറപ്പിനെ വിവരിക്കുന്നു; പദബന്ധത്തിന്റെ വിശേഷണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חֹסָה
  choice: ഹോസ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: תֹצְאֹתָיו
  choice: അതിന്റെ അറ്റങ്ങൾ
  rationale: അതിർത്തിരേഖയുടെ അവസാനബിന്ദുക്കളെയോ പുറപ്പെടുന്ന അറ്റങ്ങളെയോ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗം; ഹീബ്രു ബഹുവചനം നിലനിർത്തി.
- source_word: הַיָּמָּה
  choice: കടലിലേക്ക്
  rationale: ദിശാസൂചകമായ രൂപത്തിന്റെ മൂർത്തമായ ‘കടലിലേക്ക്’ എന്ന അർഥം നിലനിർത്തി; സന്ദർഭത്തിൽ ഇത് പടിഞ്ഞാറുദിശയെയും സൂചിപ്പിക്കാം.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: അക്സീബിന്റെ ഭൂപ്രദേശത്തുനിന്ന്
  rationale: חֶבֶל ഇവിടെ അളന്നുനിർണയിച്ച പ്രദേശം/മേഖല എന്ന അർഥത്തിൽ എടുത്തു; അസ്പഷ്ടമായ ഹീബ്രു ബന്ധം അമിതമായി നിർവചിക്കാതെ ‘ഭൂപ്രദേശം’ എന്നു നൽകി.
