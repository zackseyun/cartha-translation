  text: לִ/בְנֵ֣י נַפְתָּלִ֔י יָצָ֖א הַ/גּוֹרָ֣ל הַ/שִּׁשִּׁ֑י לִ/בְנֵ֥י נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: ml
  text: നഫ്താലിയുടെ മക്കൾക്കു ആറാമത്തെ നറുക്ക് പുറത്തുവന്നു; നഫ്താലിയുടെ മക്കൾക്കു അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീണു’; എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘പുറത്തുവന്നു’ അല്ലെങ്കിൽ ‘പുറപ്പെട്ടു’ എന്നാണ്. ഇവിടെ അത് നറുക്കെടുപ്പിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ മക്കൾക്ക്
  rationale: לְ ഇവിടെ നറുക്കിലൂടെ ലഭിക്കുന്ന അവകാശത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു. ‘മക്കൾ’ എന്നത് ഗോത്രപരമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: יָצָא
  choice: പുറത്തുവന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പുറത്തുവരുക’ നിലനിർത്തുന്നു; നറുക്കെടുപ്പിന്റെ ഫലം വെളിപ്പെട്ടതിനെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הַגּוֹרָל הַשִּׁשִּׁי
  choice: ആറാമത്തെ നറുക്ക്
  rationale: גורל എന്നത് ഇവിടെ ദേശവിഭജനത്തിനായി എടുത്ത നറുക്കിനെയും הַשִּׁשִּׁי അതിന്റെ ക്രമത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുലങ്ങൾ’ ആ അർഥം സാധാരണ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി ഭാരമാകാതിരിക്കാൻ സ്വീകർത്താവും കുലക്രമവും ഒരൊറ്റ സ്വാഭാവിക വാക്യഘടനയിൽ ചേർത്തു; അർഥഘടകങ്ങൾ എല്ലാം നിലനിർത്തി.
