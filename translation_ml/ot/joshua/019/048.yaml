source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: ml
  text: 'ഇതായിരുന്നു ദാൻഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ച അവകാശം[a]: ഈ പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതാണ് ... ലഭിച്ച അവകാശം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുവിലെ ഈ ചൂണ്ടിക്കാണിക്കൽ പ്രയോഗത്തിൽ വർത്തമാനകാലമോ ഭൂതകാലമോ വ്യക്തമായി അടയാളപ്പെടുത്തിയിട്ടില്ല. ‘അവകാശം’ എന്നതിന് ‘വിഹിതം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: മുമ്പ് വിവരിച്ച ഭൂപ്രദേശത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സംഗ്രഹപ്രയോഗം. സന്ദർഭത്തിലെ ഭൂതകാല വിവരണത്തിന് സ്വാഭാവികമായി യോജിക്കുന്നു; എങ്കിലും ഹീബ്രുവിൽ കാലം വ്യക്തമായി അടയാളപ്പെടുത്തിയിട്ടില്ല.
- source_word: נַחֲלַת
  choice: ലഭിച്ച അവകാശം
  rationale: വെറും ഭരണപരമായ ഭൂവിഹിതം എന്നതിലുപരി പാരമ്പര്യമായി കൈവശം ലഭിക്കുന്ന പ്രദേശം എന്ന ഉടമ്പടിപരമായ ആശയം നിലനിർത്തുന്നു.
- source_word: מַטֵּה בְנֵי דָן
  choice: ദാൻഗോത്രത്തിന്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ദാന്റെ പുത്രന്മാരുടെ ഗോത്രം’ എന്നതിനേക്കാൾ സ്വാഭാവികമായ ആധുനിക മലയാളം; ഗോത്രപരമായ അർഥം പൂർണമായി നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക അണുകുടുംബങ്ങളെ അല്ല.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: മുമ്പ് നൽകിയ സ്ഥലപ്പട്ടികയെ ചൂണ്ടിക്കാണിക്കുന്ന നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങളും
  rationale: പട്ടണങ്ങളോടു ചേർന്നതോ അവയെ ആശ്രയിച്ചതോ ആയ ചെറുകുടിയിരിപ്പുകളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പരിഭാഷ.
theological_decisions:
- issue: נַחֲלָה എന്ന പദത്തിലെ ഭൂവിഹിതവും പാരമ്പര്യാവകാശവും
  choice: ലഭിച്ച അവകാശം
  alternative: വിഹിതം
  rationale: ഭൂമി നിശ്ചയിച്ചുനൽകപ്പെട്ട വിഹിതമാണെന്ന സന്ദർഭവും അവകാശമായി ലഭിച്ചതാണെന്ന പദത്തിന്റെ ധ്വനിയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഹീബ്രു സംഗ്രഹവാക്യത്തിന്റെ ഘടന കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് ‘ദാന്റെ പുത്രന്മാരുടെ ഗോത്രം’ എന്ന കൃത്രിമമായ രൂപത്തിന് പകരം വായനാസൗകര്യമുള്ള ‘ദാൻഗോത്രം’ ഉപയോഗിച്ചു. കാലസംബന്ധവും נַחֲלָהയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
