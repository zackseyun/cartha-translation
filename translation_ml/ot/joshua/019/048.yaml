  source_fidelity: 'The translation accurately represents the Hebrew summary formula: זֹאת as a retrospective ‘ഇതായിരുന്നു’; נַחֲלַת as ‘ലഭിച്ച അവകാശം’; the tribal designation as ‘ദാൻഗോത്രത്തിന്’; the clan qualification; and the concluding apposition, ‘ഈ പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.’ ‘ലഭിച്ച’ makes explicit the received character implicit in the inheritance terminology but does not materially alter the sense in this land-allotment context.'
