  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി പടിഞ്ഞാറോട്ടു തിരിഞ്ഞ് അസ്നോത്ത്-താബോരിലേക്കു ചെന്നു; അവിടെനിന്ന് ഹുക്കോക്കിലേക്കു നീങ്ങി. അത് തെക്കുവശത്ത് സെബൂലൂനെ തൊട്ടു; പടിഞ്ഞാറുവശത്ത് ആശേരിനെയും, യോർദ്ദാനരികെ സൂര്യോദയദിക്കിലേക്കുള്ള യെഹൂദായെയും തൊട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിലെ വാചകക്രമം: “യെഹൂദാ, യോർദ്ദാൻ, സൂര്യോദയദിക്കിലേക്ക്.” സാധാരണ മനസ്സിലാക്കുന്ന ഗോത്രപ്രദേശങ്ങളുടെ ഭൂമിശാസ്ത്രമനുസരിച്ച് നഫ്താലി യെഹൂദായുമായി നേരിട്ട് അതിർത്തി പങ്കിട്ടിരുന്നില്ല; അതിനാൽ ഈ പ്രയോഗം ഭൂമിശാസ്ത്രപരമായി ദുഷ്കരമാണ്. ചിലർ ഇതിനെ വേറൊരു വിധത്തിൽ വ്യാഖ്യാനിക്കുകയോ പാഠത്തിൽ പകർപ്പുസംബന്ധമായ പ്രശ്നമുണ്ടെന്ന് കരുതുകയോ ചെയ്യുന്നു. ഇവിടെ എബ്രായപാഠം ഉള്ളതുപോലെ, അതിന്റെ ദുഷ്കരത പരിഹരിക്കാതെയാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.'
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: പിന്നെ അതിർത്തി ... തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണങ്ങളിൽ שׁוב സാധാരണയായി അതിർത്തിരേഖ ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൂർണമായി ‘മടങ്ങി’ എന്ന അർഥമല്ല.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: പദശഃ ‘കടലിന്റെ ദിക്കിലേക്ക്’ എന്നാണെങ്കിലും മെഡിറ്ററേനിയൻ കടലിനെ അടിസ്ഥാനമാക്കിയുള്ള പടിഞ്ഞാറൻ ദിശയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: אַזְנוֹת תָּבוֹר
  choice: അസ്നോത്ത്-താബോർ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: അവിടെനിന്ന് ഹുക്കോക്കിലേക്കു നീങ്ങി
  rationale: അതിർത്തിവിവരണത്തിലെ יצא ഒരു സ്ഥാനത്തുനിന്ന് അതിർത്തിരേഖ തുടർന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നീങ്ങി’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ ഗതി നൽകുന്നു.
- source_word: וּפָגַע
  choice: തൊട്ടു
  rationale: പ്രദേശാതിർത്തികളുടെ സന്ദർഭത്തിൽ פגע മറ്റൊരു പ്രദേശവുമായി അതിർത്തി സമ്പർക്കത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִנֶּגֶב
  choice: തെക്കുവശത്ത്
  rationale: ഇവിടെ מן + נגב അതിർത്തിസമ്പർക്കത്തിന്റെ തെക്കൻ വശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִיָּם
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: പദശഃ ‘കടലിന്റെ ഭാഗത്തുനിന്ന്’ എന്ന രൂപമാണെങ്കിലും ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ പടിഞ്ഞാറൻ വശമാണ് സൂചന.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: കിഴക്ക്, സൂര്യോദയദിക്കിൽ, യോർദ്ദാനരികെ യെഹൂദയെയും
  rationale: ഭൂമിശാസ്ത്രപരമായി ദുഷ്കരമായ മസോരറ്റിക് വാചകം തിരുത്തുകയോ സമന്വയിപ്പിക്കുകയോ ചെയ്യാതെ അതിന്റെ ഘടകങ്ങളും അനിശ്ചിത ബന്ധവും പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കിഴക്ക് യോർദ്ദാനരികെ യെഹൂദ’ എന്ന ഭൂമിശാസ്ത്രപരമായി ദുഷ്കരമായ പ്രയോഗം
  choice: മസോരറ്റിക് വാചകത്തിലെ ‘യെഹൂദ’ മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ഭൂമിശാസ്ത്രപ്രശ്നം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘യെഹൂദ’ പകർപ്പുപിശകാണെന്നു കരുതി വാചകം തിരുത്തുക, അല്ലെങ്കിൽ നഫ്താലി യെഹൂദയുമായി നേരിട്ട് അതിർത്തി പങ്കിട്ടെന്ന സൂചന ഒഴിവാക്കുന്നവിധം മിനുക്കുക.
  rationale: ഇത് പ്രധാനമായും പാഠവിമർശനപരവും ഭൂമിശാസ്ത്രപരവുമായ പ്രശ്നമാണ്. ലഭ്യമായ എബ്രായപാഠത്തെ അനുമാനാധിഷ്ഠിതമായി തിരുത്താതെ അതിലെ യഥാർഥ ദുഷ്കരത സംരക്ഷിക്കുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും അമിതമായി അക്ഷരാർഥപരമായ അസ്വാഭാവികത ഒഴിവാക്കി. സ്ഥലനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകിയിരിക്കുന്നു.
