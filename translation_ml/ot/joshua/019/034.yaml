  - severity: low
    issue: The draft uses 'യെഹൂദ' rather than the conventional Malayalam biblical name form 'യെഹൂദാ.'
    rationale: '''യെഹൂദാ'' is more natural and recognizable in modern standard Malayalam biblical usage, while still transparently representing Hebrew יהודה.'
  - severity: low
