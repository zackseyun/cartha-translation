  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: ml
  text: യഹ്‌വെയുടെ കൽപനപ്രകാരം അവർ അവൻ ആവശ്യപ്പെട്ടിരുന്ന പട്ടണമായ എഫ്രയീം മലനാട്ടിലെ തിമ്നത്ത്-സെരഹ് അവന്നു കൊടുത്തു. അവൻ ആ പട്ടണം പണിതു[a], അതിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പട്ടണം പുനർനിർമിച്ചു” അല്ലെങ്കിൽ “പുനരുദ്ധരിച്ചു.” എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥം “പണിതു” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പുനർനിർമാണമോ പുനരുദ്ധാരണമോ ഉദ്ദേശിച്ചിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  rationale: עַל־פִּי എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്നാണെങ്കിലും ഇവിടെ ദൈവിക കല്പനയെയോ അധികാരപൂർവമായ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: נָתְנוּ לוֹ
  choice: അവർ അവനു കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ലളിതമായ ‘കൊടുക്കുക’ എന്ന അർഥവും ബഹുവചന കർത്താവും പരോക്ഷ കർമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: അവൻ ആവശ്യപ്പെട്ട ... പട്ടണം
  rationale: שׁאל ഇവിടെ അപേക്ഷിക്കുകയോ ആവശ്യപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘ആവശ്യപ്പെട്ട’ എന്നത് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: תִּמְנַת סֶרַח
  choice: തിമ്നത്ത്-സേരഹ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ഘടകങ്ങളുടെ അതിർത്തി വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: הַר ഇവിടെ ഒറ്റ മലയേക്കാൾ ഒരു പർവതപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മലനാട്’ ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: അവൻ ആ പട്ടണം പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പണിയുക’ എന്നാണ്. മുമ്പേ ഉണ്ടായിരുന്ന പട്ടണമെന്ന സന്ദർഭത്തിൽ ‘പുനർനിർമിച്ചു/പുനരുദ്ധരിച്ചു’ എന്ന അർഥം സാധ്യതയുള്ളതായിരുന്നാലും, അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: അതിൽ താമസിച്ചു
  rationale: ישׁב എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ ‘വസിക്കുക/താമസിക്കുക’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലവാചകം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം Yahweh-നോട് അടുത്ത ലിപ്യന്തരണം സ്വീകരിച്ചു; Jehovah-യുമായി സാധാരണ ബന്ധിപ്പിക്കപ്പെടുന്ന ‘യഹോവ’ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ പദക്രമം കൃത്രിമമായി പകർത്താതെ സ്ഥലനാമവും ഭൂമിശാസ്ത്രവിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമപ്പെടുത്തി; ‘പണിതു’ എന്ന മൂലാർഥവും സന്ദർഭസാധ്യതയും തമ്മിലുള്ള സംഘർഷം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
