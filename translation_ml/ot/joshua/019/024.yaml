source:
  edition: WLC
  text: וַ/יֵּצֵא֙ הַ/גּוֹרָ֣ל הַֽ/חֲמִישִׁ֔י לְ/מַטֵּ֥ה בְנֵֽי אָשֵׁ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: ml
  text: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ആശേറിന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന് അഞ്ചാമത്തെ നറുക്ക് വീണു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച് ആശേറിന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിനായി അഞ്ചാമത്തെ നറുക്ക് എടുക്കപ്പെട്ടു.’'
    reason: ‘നറുക്ക് വീണു’ എന്ന മൂലപാഠത്തോട് അടുത്ത പ്രയോഗത്തിനുപകരം സന്ദർഭപരമായ കർമണിപ്രയോഗവും, ‘കുലങ്ങൾ’ എന്നതിനുപകരം കൂടുതൽ വിശാലമായ ‘കുടുംബങ്ങൾ’ എന്ന വായനയും നൽകുന്നു.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: വീണു
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘പുറപ്പെടുക’ എന്നാണെങ്കിലും, നറുക്കെടുപ്പിന്റെ സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘നറുക്ക് വീണു’ എന്നത് സ്വാഭാവികവും മൂലപാഠത്തിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: הַגּוֹרָל
  choice: നറുക്ക്
  rationale: גורל നറുക്കിനെയോ നറുക്കിലൂടെ നിശ്ചയിക്കപ്പെട്ട ഫലത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അവകാശഭാഗം’ എന്ന ഫലകേന്ദ്രിത പരിഭാഷയെക്കാൾ ‘നറുക്ക്’ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: הַחֲמִישִׁי
  choice: അഞ്ചാമത്തെ
  rationale: ‘നറുക്ക്’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ക്രമസംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നും വരാമെങ്കിലും, ഭൂവിഭജനസന്ദർഭത്തിൽ അത് സ്ഥിരമായി ‘ഗോത്രം’ എന്ന അർഥത്തിലാണ്.
- source_word: בְנֵי אָשֵׁר
  choice: ആശേറിന്റെ സന്തതികളുടെ
  rationale: അക്ഷരാർഥം ‘ആശേറിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ മുഴുവൻ ഗോത്രപരമ്പരയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്ത്രീപുരുഷന്മാരെ ഉൾക്കൊള്ളുന്ന ‘സന്തതികൾ’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ വംശീയ-കുടുംബ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ ഈ ഘടനയെ വ്യക്തമായി അറിയിക്കുന്നു, കൂടാതെ לְ എന്നതിന്റെ വിഭജനപരമായ ബലം ‘അനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
