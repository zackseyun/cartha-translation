translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ആവർത്തിക്കുന്ന ഭൂവിഭജനസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവികമായ ‘നറുക്ക് വീണു’ എന്ന പ്രയോഗം സ്വീകരിച്ചു.
