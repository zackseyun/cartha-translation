base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/018.yaml
  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: ml
  text: അവരുടെ അതിർത്തി യിസ്രെയേൽ[a], കെസുല്ലോത്ത്, ശൂനേം എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘യിസ്രെയേൽ’ എന്ന സ്ഥലനാമത്തിന് ദിശാസൂചകമായ ഒരു പ്രത്യയം ചേർന്നിരിക്കുന്നു; അതിനാൽ ‘യിസ്രെയേലിലേക്ക്’ അല്ലെങ്കിൽ ‘യിസ്രെയേലിന്റെ ദിശയിൽ’ എന്നും അർഥമാക്കാം. എന്നാൽ അതിർത്തിയിലെ സ്ഥലങ്ങളുടെ പട്ടികയിൽ ഈ സൂക്ഷ്മത പ്രകടമാക്കാതെയും വായിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: വ്യാപിച്ചിരുന്നു
  rationale: അതിർത്തിവിവരണത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാനും היה എന്ന ക്രിയയുടെ അർഥം ഈ ഭൂപ്രദേശസന്ദർഭത്തിൽ വ്യക്തമാക്കാനും ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: גְּבוּלָם
  choice: അവരുടെ അതിർ
  rationale: גְּבוּל അതിർത്തിരേഖയെയോ പ്രദേശപരിധിയെയോ സൂചിപ്പിക്കുന്നു; മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവരുടെ’ എന്നു നിലനിർത്തി.
- source_word: יִזְרְעֶאלָה
  choice: യിസ്രെയേലിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ־ָה പ്രത്യയം ‘-ലേക്ക്’ എന്നു മുഖ്യപാഠത്തിൽ പ്രകടമാക്കി.
- source_word: הַכְּסוּלֹת
  choice: കെസുല്ലോത്ത്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; മുൻപ്രത്യയമായ നിർദേശക ഹേ പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല.
- source_word: שׁוּנֵם
  choice: ശൂനേം
  rationale: സ്ഥലനാമം മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. അതിർത്തിപ്പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, യിസ്രെയേൽ എന്ന സ്ഥലനാമത്തിലെ ദിശാസൂചന മുഖ്യപാഠത്തിൽ പ്രകടമാക്കി; അതിന്റെ സാധ്യതയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
