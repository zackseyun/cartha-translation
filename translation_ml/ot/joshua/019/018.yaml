- from: അവരുടെ അതിർ യിസ്രെയേലിലേക്കും[a] കെസുല്ലോത്തിലേക്കും ശൂനേമിലേക്കും വ്യാപിച്ചിരുന്നു.
  to: അവരുടെ അതിർത്തി യിസ്രെയേൽ[a], കെസുല്ലോത്ത്, ശൂനേം എന്നിവയായിരുന്നു.
  rationale: The revision restores the Hebrew’s simple copular boundary list, avoids assigning directional force to names that do not carry it, and preserves the directional-he nuance on Jezreel in a concise footnote. It remains natural in modern Malayalam without resolving the boundary-list ambiguity beyond the source.
