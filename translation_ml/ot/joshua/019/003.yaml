  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/חֲצַ֥ר שׁוּעָ֛ל וּ/בָלָ֖ה וָ/עָֽצֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/003.yaml
  text: Hazar-shual[a], Balah, and Ezem[b],
translation:
  language: ml
  text: ഹസർ-ശൂവാൽ[a], ബാലാ, ഏസെം[b] എന്നിവയും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിലെ ‘ഹസർ-ശൂവാൽ’ ഒരു സംയുക്ത സ്ഥലനാമമാണ്; അക്ഷരാർഥത്തിൽ ‘കുറുക്കന്റെ കുടിയിരിപ്പ്’ അല്ലെങ്കിൽ ‘കുറുക്കന്റെ ഗ്രാമം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ബന്ധപ്പെട്ട സ്ഥലനാമരൂപങ്ങളുമായി ഒത്തുനോക്കിയുള്ള ലിപ്യന്തരണത്തിന്റെ ഫലമായി ചില പരിഭാഷകളിൽ ‘ബാലാ’ എന്നതിന് ‘ബാലാഹ്’ എന്നും ‘ഏസെം’ എന്നതിന് ‘അസെം’ എന്നും കാണാം.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: ഹസർ-ശൂവാൽ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മസൊററ്റിക് രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. സംയുക്തനാമത്തിന്റെ ഘടന സൂചിപ്പിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: בָלָה
  choice: ബാലാ
  rationale: ഈ വാക്യത്തിലെ മസൊററ്റിക് സ്വരീകരണത്തോട് അടുത്തുനിൽക്കുന്ന സ്ഥലനാമ ലിപ്യന്തരണം.
- source_word: עָצֶם
  choice: ഏസെം
  rationale: മസൊററ്റിക് സ്വരീകരണം പ്രതിഫലിപ്പിക്കുന്ന സ്ഥലനാമ ലിപ്യന്തരണം; മലയാള ഉച്ചാരണസൗകര്യത്തിനായി ഏസെം എന്നു നൽകി.
- source_word: וַ / וּ / וָ
  choice: എന്നിവയും
  rationale: മുൻവാക്യത്തിൽ തുടരുന്ന സ്ഥലനാമപ്പട്ടികയാണെന്നത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ഈ വാക്യത്തിന്റെ ആരംഭത്തിലെ ബന്ധകത്തെയും പേരുകൾ തമ്മിലുള്ള ഏകോപനത്തെയും ഒരുമിച്ച് പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന സ്ഥലനാമപ്പട്ടികയായതിനാൽ അവസാനം അർധവിരാമം നൽകി; പേരുകൾ വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
