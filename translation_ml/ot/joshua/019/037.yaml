- source_word: עֵין חָצוֹר
  choice: ഏൻ-ഹാസോർ
  rationale: സംയുക്തമായ സ്ഥലപ്പേരെന്ന നിലയിൽ עֵין എന്ന ഘടകത്തെ ‘ഉറവ’ എന്നു മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; വ്യുത്പത്തിപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְ
  choice: എന്നിവയും
  rationale: മുൻവാക്യങ്ങളിൽനിന്ന് തുടരുന്ന പട്ടികയാണിത്. ഓരോ പേരിനുമുമ്പും ‘ഉം’ ആവർത്തിക്കുന്നതിനുപകരം, സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ അവസാനത്തിൽ ‘എന്നിവയും’ ഉപയോഗിച്ച് ഹീബ്രു സംയോജനത്തിന്റെ അർഥം നിലനിർത്തി.
