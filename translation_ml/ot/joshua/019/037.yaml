lexical_decisions:
- source_word: קֶדֶשׁ
  choice: കേദെശ്
  rationale: പട്ടണപ്പേരായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
