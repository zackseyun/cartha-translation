source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: ml
  text: പുരോഹിതനായ എലെയാസറും നൂന്റെ മകനായ യോശുവയും ഇസ്രായേൽമക്കളുടെ[a] ഗോത്രങ്ങളിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാരും ശീലോവിൽ, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിൽ, യഹ്‌വെയുടെ മുമ്പാകെ നറുക്കിട്ട് വിഭജിച്ചു നൽകിയ അവകാശഭൂമികൾ ഇവയാണ്. ഇങ്ങനെ അവർ ദേശം വിഭജിച്ചുതീർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേൽജനം.’'
    reason: മൂലപാഠത്തിലെ ലിംഗസൂചകമായ ബന്ധുത്വപ്രയോഗവും അതിന്റെ സമൂഹസൂചകമായ അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: അവകാശഭൂമികൾ
  rationale: നַחֲלָה ഇവിടെ ഗോത്രങ്ങൾക്ക് അവകാശമായി ലഭിച്ച ഭൂവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമികൾ’ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ആശയവും ഭൂമിയെന്ന സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: נִחֲלוּ
  choice: പങ്കിട്ടുകൊടുത്ത
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഭൂമി വിവിധ ഗോത്രങ്ങൾക്ക് വിഹിതമായി നൽകുന്ന ഭരണപരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പങ്കിട്ടുകൊടുത്ത’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: പിതൃഭവനത്തലവന്മാർ
  rationale: പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളുടെ തലവന്മാരെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘പിതൃഭവനം’ എബ്രായ സാമൂഹികഘടന നിലനിർത്തുന്നു.
- source_word: בְּגוֹרָל
  choice: നറുക്കിട്ട്
  rationale: നറുക്കെടുപ്പിലൂടെ വിഹിതം നിശ്ചയിച്ചതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח എന്നത് പ്രവേശനസ്ഥലത്തെയും אֹהֶל מוֹעֵד ദൈവസന്നിധിയിൽ കൂടിവരുന്ന കൂടാരത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: ഇങ്ങനെ അവർ ദേശം വിഭജിച്ചുതീർത്തു
  rationale: വിവരണത്തിന്റെ സമാപനഫലം വ്യക്തമാക്കിക്കൊണ്ട് ക്രിയയുടെ പൂർത്തീകരണഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധുത്വപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന പരമ്പരാഗത രൂപം നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക കൂട്ടനാമമായി വായിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ‘അവകാശഭൂമികൾ’, ‘പിതൃഭവനത്തലവന്മാർ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ നിയമപരവും സാമൂഹികവുമായ സൂക്ഷ്മത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
