source:
  edition: WLC
  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: ml
  text: എന്നാൽ ദാൻ ഗോത്രക്കാരുടെ അതിർ അവരെ കടന്ന് പുറത്തേക്കു നീണ്ടു.[a] അതുകൊണ്ട് ദാൻ ഗോത്രക്കാർ കയറിച്ചെന്ന് ലേശെമിനെതിരെ യുദ്ധം ചെയ്തു. അവർ അതിനെ പിടിച്ചടക്കി, വാളിന്റെ മൂർച്ചയാൽ അതിനെ വെട്ടിക്കൊന്നു; അതു കൈവശമാക്കി അവിടെ പാർത്തു. തങ്ങളുടെ പൂർവപിതാവായ ദാന്റെ പേരനുസരിച്ച് അവർ ലേശെമിന് ദാൻ എന്നു പേരിട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദാൻ ഗോത്രക്കാരുടെ അതിർ അവരിൽനിന്ന് പുറത്തേക്കു നീണ്ടു.” ചില പരിഭാഷകൾ വിശാലമായ സന്ദർഭത്തെ ആധാരമാക്കി, “ദാൻ ഗോത്രക്കാരുടെ പ്രദേശം അവർക്ക് പോരായിരുന്നു” എന്ന് വ്യാഖ്യാനിക്കുന്നു. എന്നാൽ ഹീബ്രു പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ സ്ഥലപരമാണ്.
    reason: alternative_reading
  - marker: b
    text: ന്യായാധിപന്മാർ 18:7, 14, 27, 29 എന്നിവയിൽ ലേശെമിനെ ലയീശുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: ദാൻമക്കളുടെ പ്രദേശത്തിന്റെ അതിർ അവരെ കടന്ന് പുറത്തേക്കു നീണ്ടു
  rationale: גְבוּל എന്നതിന് അതിർ എന്നും പ്രദേശം എന്നും അർഥമാകാം. ദാന്റെ അവകാശപ്രദേശത്തെക്കുറിച്ചുള്ള സന്ദർഭം സൂചിപ്പിക്കാൻ രണ്ടും സ്വാഭാവികമായി ചേർത്തു. ദുഷ്കരമായ מֵהֶם എന്ന പ്രയോഗത്തിലെ സ്ഥലപരമായ ആശയം നിലനിർത്തി; ‘അവർക്ക് പോരായിരുന്നു’ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
- source_word: בְּנֵי דָן
  choice: ദാൻമക്കൾ
  rationale: ‘ദാന്റെ പുത്രന്മാർ’ എന്ന ഗോത്ര-കുടുംബ ഭാഷാശൈലി സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲלוּ
  choice: പുറപ്പെട്ടുചെന്ന്
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കയറിച്ചെല്ലുക/മേലോട്ടു പോകുക’ എന്നാണെങ്കിലും ഇവിടെ സൈനിക നീക്കമാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ഭൂപ്രകൃതിയെക്കുറിച്ചുള്ള അനാവശ്യ നിഗമനം ഒഴിവാക്കി ചലനത്തെ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: ലേശെമിനെതിരെ യുദ്ധം ചെയ്തു
  rationale: നഗരത്തിനെതിരായ സൈനിക പോരാട്ടം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֶשֶׁם
  choice: ലേശെം
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം അതേ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; ന്യായാധിപന്മാർ 18-ലെ ലയീശുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: അതിനെ പിടിച്ചടക്കി
  rationale: לכד എന്ന സൈനികക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ അതിനെ സംഹരിച്ചു
  rationale: לְפִי חֶרֶב എന്നത് അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന ഹീബ്രു രൂപകമാണ്. ‘വായ്ത്തല’ അതിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; നഗരത്തെ വാളിനിരയാക്കിയ കൂട്ടസംഹാരമാണ് ക്രിയയുടെ സന്ദർഭാർഥം.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: അതു കൈവശമാക്കി
  rationale: ירשׁ ഇവിടെ മുൻവാസികളെ കീഴടക്കിയശേഷം പ്രദേശം സ്വന്തമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: അവിടെ പാർത്തു
  rationale: ישׁב എന്നതിന്റെ ‘വസിക്കുക’ എന്ന അർഥം dignified, current Malayalam-ൽ നൽകുന്നു.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: ലേശെമിന് ദാൻ എന്നു പേരിട്ടു
  rationale: നഗരത്തിന് പുതിയ പേര് നൽകിയതാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: തങ്ങളുടെ പിതാവായ ദാന്റെ പേരനുസരിച്ച്
  rationale: אָב എന്ന പിതൃപുരുഷസംബന്ധിയായ ഗോത്രഭാഷയെ ‘പിതാവ്’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ ‘പൂർവപിതാവ്’ എന്ന് വ്യാഖ്യാനിച്ചിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യരീതി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള ഹീബ്രു വാവ്-തുടർച്ചകൾ മലയാളത്തിൽ ചെറുവാക്യങ്ങളും അർധവിരാമവും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു. ദുഷ്കരമായ ആദ്യ ഉപവാക്യത്തിന്റെ സ്ഥലപരമായ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
