source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: ml
  text: രണ്ടാമത്തെ നറുക്ക് ശിമെയോന്[a]—ശിമെയോന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന്, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്—ലഭിച്ചു. അവരുടെ അവകാശഭൂമി യെഹൂദായുടെ പുത്രന്മാരുടെ അവകാശഭൂമിക്കുള്ളിലായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “രണ്ടാമത്തെ നറുക്ക് ശിമെയോനുവേണ്ടി പുറത്തുവന്നു.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘പുറത്തുവരുക’ എന്നാണ്; ഇവിടെ അത് നറുക്കെടുപ്പിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “ശിമെയോന്റെ പുത്രന്മാർ”, “യെഹൂദായുടെ പുത്രന്മാർ” എന്നിവ എബ്രായത്തിലെ ഗോത്രനാമപ്രയോഗങ്ങളാണ്; അതത് ഗോത്രങ്ങളിലെ സന്തതികളെയോ അംഗങ്ങളെയോ ഇവ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: രണ്ടാമത്തെ നറുക്ക് ... ലഭിച്ചു
  rationale: יצא എന്ന ക്രിയയുടെ അടിസ്ഥാനചിത്രം ‘പുറത്തുവരുക’ എന്നതാണെങ്കിലും, നറുക്കെടുപ്പിന്റെ ഫലം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘നറുക്ക് ലഭിച്ചു’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം നിലനിർത്തുന്നു.
- source_word: לְשִׁמְעוֹן
  choice: ശിമെയോന്
  rationale: לְ ഇവിടെ നറുക്കിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സംപ്രദാനരൂപം അത് ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന്
  rationale: מַטֶּה ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘ഗോത്രം’ എന്നാണ്. בְנֵי എന്ന എബ്രായ വംശീയപ്രയോഗം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחוֹת ആധുനിക അണുകുടുംബങ്ങളെക്കാൾ വിശാലമായ ഗോത്രാന്തർഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കുലങ്ങൾ’ അനുയോജ്യം.
- source_word: נַחֲלָתָם
  choice: അവരുടെ അവകാശഭൂമി
  rationale: נַחֲלָה ഇവിടെ പാരമ്പര്യമായി ലഭിച്ച പ്രദേശിക വിഹിതമാണ്; ‘അവകാശഭൂമി’ അതിന്റെ നിയമപരവും ഭൂമിശാസ്ത്രപരവുമായ ഭാവങ്ങൾ വ്യക്തമാക്കുന്നു.
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാരുടെ അവകാശഭൂമിക്കുള്ളിൽ
  rationale: בְּתוֹךְ സൂചിപ്പിക്കുന്ന അകത്തുള്ള സ്ഥാനം വ്യക്തമായി നൽകുകയും נַחֲלָה എന്ന പദം ഒരേ വാക്യത്തിൽ ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
