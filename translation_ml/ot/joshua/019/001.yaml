translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നറുക്ക്’, ‘ഗോത്രം’, ‘കുലങ്ങൾ’, ‘അവകാശഭൂമി’ എന്നീ പദങ്ങൾ ഭൂവിഭജനസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. എബ്രായത്തിലെ വംശീയപ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
