  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: ml
  text: നഫ്താലിയുടെ മക്കളുടെ[b] ഗോത്രത്തിന്റെ അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശം ഇതായിരുന്നു[a]—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതാണ്.” ഹീബ്രുവിലെ സർവനാമത്തോടുകൂടിയ നാമവാക്യം വർത്തമാനകാലമായോ ഭൂതകാലമായോ പരിഭാഷപ്പെടുത്താം; ഭൂവിഭാഗത്തിന്റെയും പട്ടണങ്ങളുടെയും പട്ടികയ്ക്കുശേഷമുള്ള ഈ സംഗ്രഹത്തിൽ ഭൂതകാലം സ്വാഭാവികമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നഫ്താലിയുടെ പുത്രന്മാർ.” ഈ ഹീബ്രു ഗോത്രപ്രയോഗം നഫ്താലിയുടെ വംശജരായ ഗോത്രജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: മുമ്പ് വിവരിച്ച ഭൂവിഭാഗത്തെയും പട്ടണപ്പട്ടികയെയും തിരിഞ്ഞുനോക്കുന്ന സംഗ്രഹവാക്യമായതിനാൽ ഭൂതകാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; എങ്കിലും ഹീബ്രു നാമവാക്യം വർത്തമാനകാലമായും പരിഭാഷപ്പെടുത്താം.
- source_word: נַחֲלַת
  choice: അവകാശം
  rationale: യോശുവയിലെ ഭൂവിഭജനസന്ദർഭത്തിൽ പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂപങ്കിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവകാശം’ ഉടമ്പടിയോടും പാരമ്പര്യത്തോടുമുള്ള അർഥബന്ധം നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഇവിടെ വടിയോ ശാഖയോ അല്ല, ഇസ്രായേലിലെ ഗോത്രവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ മക്കൾ
  rationale: ഹീബ്രുവിലെ വംശബന്ധം സൂചിപ്പിക്കുന്ന ‘നഫ്താലിയുടെ പുത്രന്മാർ/മക്കൾ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് നഫ്താലിയുടെ വംശജരായ ഗോത്രജനങ്ങളെ മുഴുവനും സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളനുസരിച്ചുള്ള ഭൂവിതരണമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പുരാതന ഭൂവിഭജനസന്ദർഭത്തിന് ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും അമിതമായ നഗരവലുപ്പം ധ്വനിപ്പിക്കാത്തതുമാണ്.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിതമായ ചെറുജനവാസകേന്ദ്രങ്ങളെയാണ് ഈ സൂത്രവാക്യത്തിൽ חָצֵר സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ അതിന്റെ വ്യക്തമായ ആധുനിക മലയാളസമാനപദമാണ്.
