  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു സംഗ്രഹവാക്യത്തിന്റെ ഘടനയും വംശബന്ധപ്രയോഗവും പരമാവധി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു.
