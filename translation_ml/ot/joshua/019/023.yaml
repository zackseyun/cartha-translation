source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: ml
  text: ഇതായിരുന്നു ഇസ്സാഖാർമക്കളുടെ ഗോത്രത്തിന്റെ അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: മുമ്പ് വിവരിച്ച ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന നിർദ്ദേശകപദം. എബ്രായത്തിൽ ക്രിയയില്ലാത്ത നാമവാക്യമാണെങ്കിലും, വിവരിച്ചുകഴിഞ്ഞ വിഭജനത്തെ സംഗ്രഹിക്കുന്ന മലയാളത്തിൽ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: נַחֲלַת
  choice: ലഭിച്ച അവകാശഭൂമി
  rationale: യോശുവയിലെ സന്ദർഭത്തിൽ പാരമ്പര്യാവകാശമായി ലഭിച്ച ഗോത്രഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അവകാശഭൂമി’ ഉടമ്പടിയോടു ബന്ധപ്പെട്ട ഭൂമിയുടെ ഭാവം നിലനിർത്തുന്നു; ‘ലഭിച്ച’ എന്നത് മലയാളവാക്യത്തെ സ്വാഭാവികമാക്കുന്നു.
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: ഇസ്സാഖാർമക്കളുടെ ഗോത്രത്തിന്
  rationale: מַטֵּה ഇവിടെ ‘ഗോത്രം’ എന്നാണ്. בְנֵי എന്ന വംശബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ ഉപവിഭാഗങ്ങളെയാണ് מִשְׁפָּחוֹת സൂചിപ്പിക്കുന്നത്; വിതരണാർഥമുള്ള לְ മലയാളത്തിലെ ‘അനുസരിച്ച്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന പദം. ആധുനിക മലയാളത്തിൽ പുരാതന പ്രദേശപ്പട്ടികയ്ക്ക് ‘പട്ടണം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ ജനവാസങ്ങളെയാണ് חָצֵר സൂചിപ്പിക്കുന്നത്. സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം പട്ടണങ്ങളിലേക്കാണ് മടങ്ങുന്നത്; അതിനാൽ ‘അവയുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭൂവിഭജനപ്പട്ടികയുടെ സംഗ്രഹസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ ക്രിയാരഹിത വാക്യത്തിന്റെ കാലസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
