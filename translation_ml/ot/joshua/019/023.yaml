- from: ഇതായിരുന്നു ഇസ്സാഖാർമക്കളുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ച അവകാശഭൂമി[a]—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  to: ഇതായിരുന്നു ഇസ്സാഖാർമക്കളുടെ ഗോത്രത്തിന്റെ അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
