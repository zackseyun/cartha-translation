translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അതിർത്തിയാണ് മറഞ്ഞിരിക്കുന്ന കർത്താവ് എന്നു വ്യക്തമാക്കിയിട്ടുണ്ട്. സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ സ്ഥിരതയോടെ ലിപ്യന്തരിച്ചു. ദുഷ്കരമായ അവസാന ഉപവാക്യത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അതിയായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
