id: JOS.19.13
reference: Joshua 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/שָּׁ֤ם עָבַר֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה גִּתָּ֥/ה חֵ֖פֶר עִתָּ֣ה קָצִ֑ין וְ/יָצָ֛א רִמּ֥וֹן הַ/מְּתֹאָ֖ר הַ/נֵּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: ml
  text: അവിടെനിന്ന് അതിർത്തി കിഴക്കോട്ട്, സൂര്യോദയദിക്കിലേക്ക്[a], ഗത്ത്-ഹേഫെരിലേക്കു കടന്നു, ഏത്ത്-കാസീനിലേക്കു[b] നീങ്ങി; പിന്നെ രിമ്മോനിലേക്കു[c] ചെന്നു, അത് നേയാവരെ നീളുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെനിന്ന് അത് കിഴക്കോട്ടു കടന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “കിഴക്കോട്ട്, സൂര്യോദയദിക്കിലേക്ക്” എന്നിങ്ങനെ ദിശ സൂചിപ്പിക്കുന്ന രണ്ടു പ്രയോഗങ്ങളുണ്ട്; ഇത് ഊന്നലിനായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായപാഠം: “ഏത്ത്-കാസീൻ”; ഈ രൂപം “ഇത്താ-കാസീൻ” എന്നും ചിലർ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
  - marker: c
    text: ഈ വാക്യഭാഗത്തിന്റെ എബ്രായപാഠം ദുഷ്കരമാണ്; അക്ഷരാർഥത്തോട് അടുത്ത രൂപം “നേയായിലേക്കുള്ള/നേയായിലേക്കു വളയുന്ന രിമ്മോൻ” എന്നോ അതിനു സമാനമായോ വരാം. അതിർത്തി രിമ്മോനിൽനിന്ന് നേയാവരെ നീണ്ടു എന്നാണ് പലരും മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സംയോജകപദം ഉൾപ്പെട്ട മൂലരൂപത്തിന്റെ ക്രമാനുഗതത്വം അതിർത്തിവിവരണത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: עָבַר
  choice: അതിർത്തി ... കടന്ന്
  rationale: അതിർത്തിരേഖ ഒരു സ്ഥലത്തുനിന്ന് മറ്റൊന്നിലേക്കു കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മറഞ്ഞിരിക്കുന്ന കർത്താവായ ‘അതിർത്തി’ ചേർത്തു.
- source_word: קֵדְמָה מִזְרָחָה
  choice: കിഴക്കോട്ട്, സൂര്യോദയദിക്കിലേക്ക്
  rationale: കിഴക്കുദിശയെ സൂചിപ്പിക്കുന്ന രണ്ടു എബ്രായ പദങ്ങളും നിലനിർത്തി അവയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: גִּתָּה חֵפֶר
  choice: ഗത്ത്-ഹേഫെർ
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: עִתָּה קָצִין
  choice: ഏത്ത്-കാസീൻ
  rationale: മസോരറ്റിക് പാഠത്തിലെ പദവിഭജനം അടിസ്ഥാനമാക്കി ഒറ്റ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു; രൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְיָצָא
  choice: ചെന്നു
  rationale: അതിർത്തിവിവരണത്തിൽ രേഖ അടുത്ത സ്ഥാനത്തേക്ക് എത്തുകയോ പുറത്തേക്കു നീങ്ങുകയോ ചെയ്യുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רִמּוֹן
  choice: രിമ്മോൻ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַמְּתֹאָר
  choice: നീണ്ടുകിടക്കുന്നു
  rationale: ദുഷ്കരമായ പങ്കാളിത്തരൂപത്തെ അതിർത്തി നേയാവരെ വ്യാപിക്കുന്നു എന്ന സന്ദർഭോചിത അർത്ഥത്തിൽ പരിഭാഷപ്പെടുത്തി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הַנֵּעָה
  choice: നേയാവരെ
  rationale: നേയാ എന്ന സ്ഥലനാമത്തെ അതിർത്തിയുടെ വ്യാപ്തിയുടെ അന്ത്യസ്ഥാനമായി ഗ്രഹിച്ചു.
