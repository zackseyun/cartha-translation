  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: ml
  text: യിരോൻ, മിഗ്ദൽ-ഏൽ[a], ഹോരേം, ബേത്ത്-അനാത്ത്, ബേത്ത്-ശേമെശ്[b]—അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ പത്തൊൻപതു പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മിഗ്ദൽ-ഏൽ ഒരു സ്ഥലനാമമാണ്; അതിലെ പദഘടകങ്ങൾക്ക് അക്ഷരാർഥത്തിൽ “ദൈവത്തിന്റെ/ഏലിന്റെ ഗോപുരം” എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: ബേത്ത്-അനാത്ത്, ബേത്ത്-ശേമെശ് എന്നിവ സ്ഥലനാമങ്ങളാണ്; അവയ്ക്ക് അക്ഷരാർഥത്തിൽ യഥാക്രമം “അനാത്തിന്റെ ഭവനം”, “സൂര്യന്റെ ഭവനം” എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: യിർയോൻ
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരണം ചെയ്തു; പട്ടികയുടെ മലയാള വാക്യഘടനയിൽ ആദിയിലെ וְ പ്രത്യേകം പദമായി നൽകേണ്ടതില്ല.
- source_word: וּ/מִגְדַּל אֵל
  choice: മിഗ്ദൽ-ഏൽ
  rationale: സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; ഘടകങ്ങളുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חֳרֵם
  choice: ഹോരേം
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരണം.
- source_word: וּ/בֵית עֲנָת
  choice: ബേത്ത്-അനാത്ത്
  rationale: സ്ഥിരമായ സംയുക്ത സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: സ്ഥിരമായ സംയുക്ത സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: പത്തൊൻപതു പട്ടണങ്ങൾ
  rationale: പുരാതന കുടിയിരിപ്പുകളെ ആധുനിക മഹാനഗരങ്ങളായി തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാനും പട്ടികയുടെ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കാനും עָרִים എന്നത് 'പട്ടണങ്ങൾ' എന്നു നൽകി.
- source_word: וְ/חַצְרֵי/הֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ
  rationale: חֲצֵרִים ഇവിടെ പേരെടുത്ത പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട അധീനഗ്രാമങ്ങളെയോ മതിലില്ലാത്ത ചെറുകുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്നു; ഭൂവിഭജനപ്പട്ടികയിലെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
