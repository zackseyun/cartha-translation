base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/043.yaml
  text: and Aijalon[a], Timnah[b], and Ekron.
translation:
  language: ml
  text: അയ്യാലോനും[a] തിമ്നയും[b] എക്രോനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ אֵילוֹן എന്ന പേര് ‘അയാലോൻ’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ תִמְנָתָה എന്ന രൂപം കൂടുതൽ ഔപചാരികമായി ‘തിമ്നാഥാ’ അല്ലെങ്കിൽ ‘തിമ്നാഥ്’ എന്നും ലിപ്യന്തരണം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵילוֹן
  choice: അയ്യാലോൻ
  rationale: ഇത് ഒരു സ്ഥലനാമമാണ്; മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു. എബ്രായ ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്ത ‘അയാലോൻ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: תִמְנָתָה
  choice: തിമ്ന
  rationale: സ്ഥലനാമത്തിന്റെ പതിവായ ഹ്രസ്വരൂപം സ്വീകരിച്ചു; എബ്രായത്തിലെ ദിശാ/സ്ഥാനസൂചകമായ അവസാനഘടകം ഉൾക്കൊള്ളുന്ന കൂടുതൽ ഔപചാരിക ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: עֶקְרוֹן
  choice: എക്രോൻ
  rationale: സ്ഥലനാമം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ
  choice: -ഉം
  rationale: എബ്രായത്തിൽ ഓരോ പേരിനുമുമ്പും ആവർത്തിക്കുന്ന സംയോജകത്തെ മലയാളത്തിലെ പട്ടികാരീതിക്ക് സ്വാഭാവികമായ ‘-ഉം’ ചേർത്ത് ഓരോ പേരിലും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. നഗരപ്പട്ടികയിലെ എബ്രായ ബഹുസംയോജക ഘടന ഓരോ പേരിനോടും ‘-ഉം’ ചേർത്ത് സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി മറിച്ചായിരുന്നതിനാൽ, മലയാള കരടിൽ അവ ശരിയായ സ്ഥലനാമങ്ങളോട് ചേർത്തു.
