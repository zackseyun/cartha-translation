source:
  edition: WLC
  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: ml
  text: അതോടൊപ്പം, ഈ പട്ടണങ്ങൾക്കു ചുറ്റുമുണ്ടായിരുന്ന എല്ലാ ഗ്രാമങ്ങളും ബാലത്ത്-ബേർ, രാമത്ത്-നെഗെബ്[a] വരെ ഉൾപ്പെട്ടിരുന്നു. ഇത് ശിമെയോന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ച അവകാശഭൂമിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ബാലത്ത്-ബേർ, അതായത് രാമത്ത്-നെഗെബ്.” രണ്ടാമത്തെ പേര് ആദ്യ സ്ഥലനാമത്തെ വിശദീകരിക്കുന്ന അനുബന്ധനാമമായി വായിക്കാവുന്നതാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: എല്ലാ ഗ്രാമങ്ങളും ... ഉൾപ്പെട്ടിരുന്നു
  rationale: മുൻവാക്യത്തിലെ പട്ടണപ്പട്ടികയോടുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; חֲצֵרִים ഇവിടെ മതിലില്ലാത്ത ആശ്രിതഗ്രാമങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾക്കു ചുറ്റുമുണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥവും הָאֵלֶּה എന്ന സമീപസൂചകത്തിന്റെ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: പ്രദേശത്തിന്റെ വ്യാപ്തിയുടെ അറ്റം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בַּעֲלַת בְּאֵר
  choice: ബയലത്ത്-ബേർ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: רָאמַת נֶגֶב
  choice: രാമത്ത്-നെഗെബ്
  rationale: ഇത് ആദ്യനാമത്തിന്റെ വിശദീകരണമാണോ വേറൊരു സ്ഥലമാണോ എന്ന മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കാൻ അർഥവിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: נַחֲלַת
  choice: അവകാശഭൂമി
  rationale: യോശുവയിലെ ഗോത്രവിഭജനസന്ദർഭത്തിൽ പാരമ്പര്യമായി ലഭിച്ച ഭൂവിഹിതം എന്ന നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന്
  rationale: מַטֶּה എന്നതിന്റെ ഗോത്രാർഥവും בְנֵי എന്നതിന്റെ വംശാവലിപരമായ രൂപവും നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള
  rationale: ഗോത്രത്തിനുള്ളിലെ കുടുംബ-കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന വിതരണഭാഷ കൃത്യമായി നൽകുന്നു.
