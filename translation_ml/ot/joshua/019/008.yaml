translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ഗോത്രവിഭജനസന്ദർഭത്തിന് യോജിച്ച ‘അവകാശഭൂമി’, ‘കുലങ്ങൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പിന്റെ [a] അടയാളം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
