  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: ml
  text: ഉമ്മാ, അഫേക്ക്, രെഹോബ്—ആകെ ഇരുപത്തിരണ്ട് പട്ടണങ്ങളും അവയോടു ബന്ധപ്പെട്ട ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻמָה
  choice: ഉമ്മാ
  rationale: പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: אֲפֵק
  choice: അഫേക്ക്
  rationale: സ്ഥലനാമം; എബ്രായ വ്യഞ്ജനങ്ങളും ദീർഘസ്വരവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: רְחֹב
  choice: രെഹോബ്
  rationale: സ്ഥലനാമം; എബ്രായ രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ഈ ഭൂവിഭാഗപ്പട്ടികയിലെ കുടിയിരിപ്പുകളെ സൂചിപ്പിക്കുന്നു; അവയുടെ വലുപ്പം നിർബന്ധമായും ആധുനിക നഗരങ്ങളുടേതല്ലാത്തതിനാൽ സ്വാഭാവികമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: ഇരുപത്തിരണ്ട്
  rationale: പട്ടണങ്ങളുടെ ആകെ എണ്ണം നേരിട്ട് നൽകുന്നു.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ കുടിയിരിപ്പുകളെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സംക്ഷിപ്തവും മാന്യവുമായ മലയാളം. എബ്രായ പട്ടികയുടെ ഘടന നിലനിർത്തിക്കൊണ്ട് ബന്ധം വ്യക്തമാക്കാൻ ‘ഉൾപ്പെടെ’ ഉപയോഗിച്ചു; സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്തിട്ടില്ല.
