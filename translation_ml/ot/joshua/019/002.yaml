translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പട്ടികശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; ‘ബേർ-ശേബ / ശേബ’ എന്ന യഥാർഥ പാഠസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
