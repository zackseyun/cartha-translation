  yaml_path: translation/ot/joshua/019/006.yaml
  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: ml
  text: ബേത്ത്-ലെബാവോത്തും ശാരൂഹെനും[a]—പതിമൂന്ന് പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഹീബ്രു പാഠത്തിൽ ‘ശാരൂഹെൻ’ എന്നാണ്; സമാന്തരമായ യോശുവ 15:32-ലെ പട്ടികയിൽ ‘ശിൽഹീം’ എന്ന വ്യത്യസ്ത നാമരൂപമുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: ബേത്ത്-ലെബാവോത്ത്
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന ലിപ്യന്തരണം നൽകി.
- source_word: שָׁרוּחֶן
  choice: ശാരൂഹെൻ
  rationale: WLCയിലെ മസോററ്റിക് പാഠത്തിലുള്ള സ്ഥലനാമം ലിപ്യന്തരിച്ചു; സമാന്തര പട്ടികയിലെ വ്യത്യസ്ത നാമം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ഭൂപങ്കിടൽ പട്ടികയിലെ יִר എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥലങ്ങളുടെ വലുപ്പത്തെ അതിരുകടന്ന് സൂചിപ്പിക്കാത്തതുമായ പദം.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: പതിമൂന്ന്
  rationale: ഹീബ്രു സംഖ്യയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പേരെടുത്ത പട്ടണങ്ങളോട് ചേർന്ന ആശ്രിതമോ മതിലില്ലാത്തതോ ആയ ചെറുകുടിയിരിപ്പുകളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഗ്രാമങ്ങൾ’ ഏറ്റവും വ്യക്തമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, ഗ്രാമങ്ങൾ പതിമൂന്ന് എന്ന എണ്ണത്തിൽ ഉൾപ്പെടുന്നില്ലെന്നും പട്ടണങ്ങളോടൊപ്പമുള്ളവയാണെന്നും വ്യക്തമാക്കാൻ ‘ഉൾപ്പെടെ’ ഉപയോഗിച്ചു.
