  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭൂവിഭജനസന്ദർഭം വ്യക്തമാക്കാൻ ‘അവകാശഭൂമി’ ഉപയോഗിച്ചു; ഗോത്രപരമായ ഹീബ്രു പ്രയോഗം ‘മക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
