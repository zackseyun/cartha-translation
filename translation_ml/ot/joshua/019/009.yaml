  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: ml
  text: യെഹൂദാമക്കളുടെ ഓഹരിയിൽനിന്ന് ശിമെയോൻമക്കൾക്ക് അവകാശഭൂമി ലഭിച്ചു[a]. യെഹൂദാമക്കളുടെ പങ്ക് അവർക്കു അധികമായിരുന്നതിനാൽ, ശിമെയോൻമക്കൾക്ക് യെഹൂദാമക്കളുടെ അവകാശഭൂമിക്കുള്ളിൽ അവകാശഭൂമി ലഭിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദാമക്കളുടെ ഭൂവിഭാഗത്തിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിലെ חֶבֶל അളന്നു നിശ്ചയിച്ച ഒരു ഭൂവിഭാഗത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ശിമെയോനു നീക്കിവെച്ച ഭൂമി യെഹൂദാമക്കൾക്കു നീക്കിവെച്ച പ്രദേശത്തിനുള്ളിലായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: מֵחֶבֶל
  choice: ഓഹരിയിൽനിന്ന്
  rationale: ഭൂമി അളന്നു വിഭജിക്കുന്ന സന്ദർഭത്തിൽ חֶבֶל ഒരു നിർണയിക്കപ്പെട്ട ഭൂവിഭാഗത്തെയോ ഓഹരിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഓഹരി’ അവകാശഭൂമിയുടെ വിഭജനസന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: נַחֲלַת / נַחֲלָתָם
  choice: അവകാശഭൂമി
  rationale: യോശുവയിലെ נַחֲלָה തലമുറാവകാശമായി ലഭിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, ‘അവകാശം’ എന്ന അമൂർത്തപദത്തേക്കാൾ ‘അവകാശഭൂമി’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: യെഹൂദാമക്കൾ / ശിമെയോൻമക്കൾ
  rationale: ‘മക്കൾ’ ഹീബ്രുവിലെ בְּנֵי എന്ന വംശ-ഗോത്രനാമപ്രയോഗം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: חֵלֶק
  choice: പങ്ക്
  rationale: חֵלֶק അനുവദിക്കപ്പെട്ട വിഹിതത്തെ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള חֶבֶל എന്നതിനോടുള്ള പദവ്യത്യാസവും മലയാളത്തിൽ ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: רַב מֵהֶם
  choice: അവർക്കു വേണ്ടതിലും വലുത്
  rationale: യെഹൂദാമക്കൾക്കു ലഭിച്ച വിഹിതം അവരുടെ ആവശ്യത്തെക്കാൾ അധികമായിരുന്നു എന്ന താരതമ്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּנְחֲלוּ
  choice: തങ്ങളുടെ അവകാശഭൂമി നേടി
  rationale: נחל എന്ന ക്രിയ ഇവിടെ അനുവദിക്കപ്പെട്ട ഭൂമി അവകാശമായി കൈവരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ
  choice: ഉള്ളിൽ
  rationale: ശിമെയോന്റെ ഭൂവിഹിതം യെഹൂദയുടെ വിഹിതത്തിന്റെ അതിർത്തികൾക്കുള്ളിലായിരുന്നു എന്ന സ്ഥലബന്ധം ലളിതമായി നൽകുന്നു.
