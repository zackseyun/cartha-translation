base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: ml
  text: കത്താത്ത്, നഹലാൽ, ശിമ്രോൻ, യിദാലാ, ബേത്‌ലഹേം[a]—പന്ത്രണ്ട് പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ബേത്‌ലഹേം ഒരു സ്ഥലനാമമാണ്; ‘അപ്പത്തിന്റെ വീട്’ എന്ന അർഥത്തിലുള്ള വിവർത്തിത പ്രയോഗമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: കത്താത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: נַהֲלָל
  choice: നഹലാൽ
  rationale: സ്ഥലനാമം എബ്രായ സ്വരരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: שִׁמְרוֹן
  choice: ശിമ്രോൻ
  rationale: സ്ഥലനാമം സ്വാഭാവികമായ മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: יִדְאֲלָה
  choice: യിദലാ
  rationale: ആദ്യത്തെ എബ്രായ യോദ് നിലനിർത്തി സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵית לָחֶם
  choice: ബേത്‌ലഹേം
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ ഘടകപദങ്ങളുടെ അക്ഷരാർഥമായ ‘അപ്പത്തിന്റെ വീട്’ എന്നു വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ഭൂപ്രദേശപ്പട്ടികയിലെ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന עִיר എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അളവിനെക്കുറിച്ച് അതിരുകടന്ന ധാരണ നൽകാത്തതുമായ പദം.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: പന്ത്രണ്ട്
  rationale: പട്ടണങ്ങളുടെ എണ്ണം സൂചിപ്പിക്കുന്ന സംഖ്യ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമങ്ങളെയോ മതിലില്ലാത്ത ചെറുജനവാസങ്ങളെയോ സൂചിപ്പിക്കുന്ന രൂപം; സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം പട്ടണങ്ങളിലേക്കാണ് തിരിച്ചുപോകുന്നത്.
