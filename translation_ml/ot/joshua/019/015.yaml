  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂപ്രദേശപ്പട്ടികാശൈലി. പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; അവസാന വാക്യഘടകം സ്വാഭാവിക മലയാളത്തിനായി ‘അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ’ എന്നു ക്രമപ്പെടുത്തി.
