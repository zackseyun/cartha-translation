reference: Joshua 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി സൂര്യോദയദിക്കിലേക്ക് ബേത്ത്-ദാഗോനിലേക്കു തിരിഞ്ഞു; അത് സെബൂലൂൻ പ്രദേശത്തെയും യിഫ്താഹ്-ഏൽ താഴ്വരയെയും തൊട്ടു; വടക്കോട്ട് ബേത്ത്-ഏമെക്കിലേക്കും നെീയേലിലേക്കും നീങ്ങി, ഇടതുവശത്തുനിന്ന്[a] കാബൂലിലേക്കു നീണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘ഇടതുവശത്തുനിന്ന്’ എന്നാണ്. അതിർത്തിവിവരണങ്ങളിൽ, നോക്കുന്ന ദിശയെ ആശ്രയിച്ച് ഇത് വടക്കുവശത്തെ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: പിന്നെ അതിർത്തി ... തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണങ്ങളിൽ שׁוב അതിർത്തിരേഖ ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവായ ‘അതിർത്തി’ വ്യക്തമാക്കുന്നത് വായന സുഗമമാക്കുന്നു.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: സൂര്യോദയദിക്കിൽ
  rationale: ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്ക്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും കിഴക്കുദിക്ക് എന്ന ഭൂമിശാസ്ത്രാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בֵּית דָּגֹן
  choice: ബേത്ത്-ദാഗോൻ
  rationale: സ്ഥലനാമം അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּפָגַע
  choice: എത്തി
  rationale: അതിർത്തിരേഖ മറ്റൊരു പ്രദേശത്തെയോ അതിർത്തിയെയോ തൊടുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗം.
- source_word: בִּזְבֻלוּן
  choice: സെബൂലൂനിലും
  rationale: അതിർത്തി സെബൂലൂൻ പ്രദേശവുമായി സമ്പർക്കത്തിലെത്തുന്നതാണ് സന്ദർഭാർഥം.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: യിഫ്താഹ്-ഏൽ താഴ്വരയിലും
  rationale: גֵי എന്നത് ‘താഴ്വര’; യിഫ്താഹ്-ഏൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: צָפוֹנָה
  choice: വടക്കോട്ട്
  rationale: ദിശാസൂചക ക്രിയാവിശേഷണത്തിന്റെ ബലം നേരിട്ട് നിലനിർത്തുന്നു; വാക്യഘടനയിലെ ബന്ധത്തെ അതിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: בֵּית הָעֵמֶק
  choice: ബേത്ത്-ഏമെക്ക്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּנְעִיאֵל
  choice: നെീയേൽ
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְיָצָא
  choice: കടന്ന് ... നീണ്ടു
  rationale: അതിർത്തിവിവരണത്തിൽ יצא രേഖ തുടർന്നുപോകുകയോ പുറത്തേക്കു നീളുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭൂമിശാസ്ത്രപരമായ ചലനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶל כָּבוּל
  choice: കാബൂലിലേക്കു
  rationale: പുരാതന സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִשְּׂמֹאל
  choice: ഇടതുവശത്തായി[a]
  rationale: മൂലപാഠത്തിലെ ‘ഇടത്’ എന്ന ദൃഢമായ പദം വ്യാഖ്യാനിച്ച് ‘വടക്ക്’ എന്നു മാത്രം മാറ്റാതെ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് അടുത്ത് ലിപ്യന്തരണം ചെയ്തു. മൂലപാഠത്തിലെ ദിശാസംബന്ധമായ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
