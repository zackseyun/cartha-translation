id: JOS.19.40
reference: Joshua 19:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם יָצָ֖א הַ/גּוֹרָ֥ל הַ/שְּׁבִיעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: ml
  text: ദാൻമക്കളുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ഏഴാമത്തെ നറുക്ക് ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: യോശുവയിലെ ദേശവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് വടി എന്ന അക്ഷരാർഥത്തിലല്ല, ‘ഗോത്രം’ എന്ന അർഥത്തിലാണ്; לְ വിഹിതം ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ത്തിന്’ എന്നു നൽകി.
- source_word: בְנֵי דָן
  choice: ദാൻമക്കളുടെ
  rationale: എബ്രായയിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഇവിടെ מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ വംശ-കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക ഗാർഹിക ‘കുടുംബങ്ങൾ’ എന്ന ധാരണ ഒഴിവാക്കാൻ ‘കുലങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: יָצָא
  choice: ലഭിച്ചു
  rationale: അക്ഷരാർഥം ‘പുറപ്പെട്ടു/പുറത്തുവന്നു’ എന്നാണെങ്കിലും നറുക്കെടുപ്പിന്റെ ഫലം ഒരു ഗോത്രത്തിന് ലഭിച്ചതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ലഭിച്ചു’ ഉപയോഗിച്ചു.
- source_word: הַגּוֹרָל
  choice: നറുക്ക്
  rationale: ദേശവിഭജനത്തിനായുള്ള നറുക്കെടുപ്പിനെ സൂചിപ്പിക്കുന്ന גּוֹרָל എന്ന പദത്തിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: הַשְּׁבִיעִי
  choice: ഏഴാമത്തെ
  rationale: നറുക്കെടുപ്പിലെ ക്രമം സൂചിപ്പിക്കുന്ന സാധാരണ ക്രമസംഖ്യാരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘ദാൻമക്കൾ’ എന്ന ബന്ധുത്വഭാഷയും ‘കുലങ്ങൾ’ എന്ന സാമൂഹികവിഭാഗപദവും മൂലപാഠത്തിന്റെ ഘടനയും പശ്ചാത്തലവും വ്യക്തമാക്കുന്നു; നറുക്കെടുപ്പ് സന്ദർഭത്തിൽ ‘ലഭിച്ചു’ സ്വാഭാവിക optimal-equivalence രൂപമാണ്.
