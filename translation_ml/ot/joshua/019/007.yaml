source:
  edition: WLC
  text: עַ֥יִן רִמּ֖וֹן וָ/עֶ֣תֶר וְ/עָשָׁ֑ן עָרִ֥ים אַרְבַּ֖ע וְ/חַצְרֵי/הֶֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: ml
  text: അയിൻ[a], രിമ്മോൻ, ഏഥെർ, ആശാൻ—ഇങ്ങനെ നാല് പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠം അയിൻ, രിമ്മോൻ, ഏഥെർ, ആശാൻ എന്നീ നാല് സ്ഥലനാമങ്ങൾ നൽകുന്നു. എന്നാൽ 1 ദിനവൃത്താന്തം 4:32-നോടു താരതമ്യം ചെയ്യുന്ന ചിലർ ‘അയിൻ-രിമ്മോൻ’ ഒരൊറ്റ സംയുക്ത സ്ഥലനാമമായി മനസ്സിലാക്കുന്നു; അങ്ങനെ മനസ്സിലാക്കിയാൽ പട്ടണങ്ങളുടെ എണ്ണത്തെ ബാധിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: അയീൻ
  rationale: നഗരപ്പട്ടികയിൽ സ്ഥലനാമമായി വരുന്നതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: רִמּוֹן
  choice: രിമ്മോൻ
  rationale: ഇവിടെ ‘മാതളനാരകം’ എന്ന സാധാരണ അർഥത്തിലല്ല, സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וָעֶתֶר
  choice: ഏഥെർ
  rationale: സംയോജകത്തോടുകൂടിയ സ്ഥലനാമം; മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְעָשָׁן
  choice: ആശാൻ
  rationale: നഗരപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രു ശബ്ദരൂപം പരമാവധി നിലനിർത്തി.
- source_word: עָרִים אַרְבַּע
  choice: നാല് പട്ടണങ്ങൾ
  rationale: സംഖ്യയോടുകൂടിയ സംഗ്രഹപ്രസ്താവന. ആധുനിക മലയാളത്തിൽ ഈ വാസസ്ഥലങ്ങളെ സൂചിപ്പിക്കാൻ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങളും
  rationale: പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ വാസസ്ഥലങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പരിഭാഷയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ഹീബ്രു വാക്യത്തിലെ പട്ടികയും തുടർന്നുള്ള സംഗ്രഹവും മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ദീർഘവിരാമചിഹ്നവും ‘ഇങ്ങനെ’ എന്ന ബന്ധപദവും ഉപയോഗിച്ചു; സംഖ്യ സംബന്ധിച്ച പാഠപരമായ പിരിമുറുക്ക് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
