id: JOS.19.35
reference: Joshua 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָרֵ֖י מִבְצָ֑ר הַ/צִּדִּ֣ים צֵ֔ר וְ/חַמַּ֖ת רַקַּ֥ת וְ/כִנָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: ml
  text: 'കോട്ടമതിലുള്ള പട്ടണങ്ങൾ[a] ഇവയായിരുന്നു: സിദ്ദീം, സേർ, ഹമ്മത്ത്, രക്കത്ത്, കിന്നേരെത്ത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കോട്ടനഗരങ്ങൾ.’
    reason: ‘കോട്ടമതിലുള്ള പട്ടണങ്ങൾ’ എന്ന പ്രയോഗത്തിന് സാധുവായ ലഘുവായ ബദൽ; എബ്രായം עָרֵי מִבְצָר എന്നതിന്റെ ‘fortress cities’ എന്ന സാധ്യത പ്രതിഫലിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: കോട്ടകെട്ടിയ പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וְ മലയാളത്തിൽ പ്രത്യേകമായി ചേർക്കാതെയും സ്വാഭാവികമായി വ്യക്തമാകുന്നു. עָרֵי מִבְצָר എന്ന സംയുക്തപ്രയോഗം സൈനികമായി ഉറപ്പിച്ച പട്ടണങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കോട്ടകെട്ടിയ പട്ടണങ്ങൾ’ എന്നു നൽകി.
- source_word: הַ/צִּדִּים
  choice: സിദ്ദീം
  rationale: സ്ഥലനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു; എബ്രായത്തിലെ നിർദ്ദേശകപ്രത്യയം മലയാള സ്ഥലനാമപ്പട്ടികയിൽ വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തിയില്ല. എന്നാൽ ഈ രൂപം സാധാരണ നാമവാക്യമായും മനസ്സിലാക്കാൻ സാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ ബദൽ സൂചിപ്പിച്ചു.
- source_word: צֵר
  choice: സേർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וְ/חַמַּת
  choice: ഹമ്മത്ത്
  rationale: ദ്വിത്വവ്യഞ്ജനം നിലനിർത്തി സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: רַקַּת
  choice: രക്കത്ത്
  rationale: മധ്യത്തിലെ ദ്വിത്വവ്യഞ്ജനവും അവസാനത്തെ ത് ശബ്ദവും പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְ/כִנָּרֶת
  choice: കിന്നേരെത്ത്
  rationale: എബ്രായത്തിലെ ദ്വിത്വവ്യഞ്ജനവും അവസാനത്തെ ത് ശബ്ദവും നിലനിർത്തി സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മൂലഭാഷയുടെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ നൽകി; ക്രിയ വാക്യാവസാനത്ത് സ്വാഭാവികമായി ചേർത്തു.
