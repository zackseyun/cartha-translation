source:
  edition: WLC
  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: ml
  text: എന്നാൽ വേശ്യയായ രാഹാബിനെയും[a] അവളുടെ പിതാവിന്റെ കുടുംബത്തെയും അവൾക്കുള്ള സകലത്തെയും യോശുവ ജീവനോടെ വിട്ടു. യെരീഹോയെ ഒറ്റുനോക്കാൻ യോശുവ അയച്ച ദൂതന്മാരെ[b] അവൾ ഒളിപ്പിച്ചതിനാൽ, അവൾ ഇന്നുവരെ ഇസ്രായേലിന്റെ ഇടയിൽ പാർത്തുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗണിക.’
    reason: ‘വേശ്യയായ’ എന്ന മുഖ്യവായനയ്ക്കുള്ള പരമ്പരാഗത ശൈലീപരമായ പദപര്യായം.
  - marker: b
    text: എബ്രായത്തിൽ ‘ദൂതന്മാർ’; അതായത്, യെരീഹോയെ ഒറ്റുനോക്കാൻ യോശുവ അയച്ച പുരുഷന്മാർ.
    reason: മൂലപദം അവരുടെ പൊതുവായ ദൂതപദവിയെ സൂചിപ്പിക്കുമ്പോൾ, തുടർന്നുള്ള ഭാഗം അവരുടെ ചാരദൗത്യം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: വേശ്യയായ
  rationale: സ്ത്രീ വാണിജ്യലൈംഗികതയിൽ ഏർപ്പെട്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ പദം; പഴഞ്ചൻ അല്ലെങ്കിൽ പരോക്ഷമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: בֵּית אָבִיהָ
  choice: അവളുടെ പിതാവിന്റെ കുടുംബം
  rationale: വീടെന്ന കെട്ടിടത്തേക്കാൾ പിതാവിന്റെ കുടുംബ-ഗൃഹസമൂഹത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: അവൾക്കുള്ള സകലവും
  rationale: സ്വത്തുക്കളെയും അവളോടു ബന്ധപ്പെട്ട മറ്റുള്ളവരെയും ഉൾക്കൊള്ളാവുന്ന മൂലപാഠത്തിന്റെ വ്യാപ്തി പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: הֶחֱיָה
  choice: ജീവനോടെ വിട്ടു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘ജീവിക്കാൻ അനുവദിച്ചു/ജീവനോടെ നിലനിർത്തി’ എന്ന കാരകാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתֵּשֶׁב
  choice: പാർത്തുവരുന്നു
  rationale: ‘ഇന്നുവരെ’ എന്നതോടൊപ്പം, ഭൂതകാലത്ത് ആരംഭിച്ച് ആഖ്യാതാവിന്റെ വർത്തമാനകാലംവരെ തുടരുന്ന താമസം സൂചിപ്പിക്കുന്നു.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ഇടയിൽ
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിലെ വാസം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം, ‘ഇസ്രായേൽ’ എന്ന സമഷ്ടിനാമത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: הֶחְבִּיאָה
  choice: ഒളിപ്പിച്ചു
  rationale: മറച്ചുവെച്ചു എന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പൊതുവായ ‘സന്ദേശവാഹകർ/ദൂതന്മാർ’ എന്ന പദം നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യഭാഗം അവരുടെ ചാരദൗത്യം വ്യക്തമാക്കുന്നു.
- source_word: לְרַגֵּל
  choice: ഒറ്റുനോക്കാൻ
  rationale: രഹസ്യമായി സ്ഥിതിവിവരം നിരീക്ഷിക്കുന്ന ചാരദൗത്യത്തെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രാഹാബ് ഇസ്രായേലിനുള്ളിൽ ഉൾപ്പെട്ട് താമസിച്ചത്
  choice: അവൾ ഇന്നുവരെ ഇസ്രായേലിന്റെ ഇടയിൽ പാർത്തുവരുന്നു
  alternative: അവൾ ഇസ്രായേല്യരുടെ ഇടയിൽ താമസമാക്കി
  rationale: ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്ന താമസം പ്രസ്താവിക്കുന്നു; അവളുടെ തുടർസ്ഥാനത്തെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്ര നിഗമനങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാർത്തുവരുന്നു’ തുടർച്ചയെ വ്യക്തമാക്കുന്നു; ‘ഇസ്രായേലിന്റെ ഇടയിൽ’ എന്നത് മൂലപാഠത്തിലെ സമഷ്ടിനാമവും ഉൾക്കൊള്ളലിന്റെ സൂചനയും നിലനിർത്തുന്നു.
