source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: ml
  text: അവർ പട്ടണവും അതിലുള്ള സകലവും തീയിട്ടു ചുട്ടുകളഞ്ഞു. എന്നാൽ വെള്ളിയും പൊന്നും വെങ്കലം, ഇരുമ്പ് എന്നിവകൊണ്ടുള്ള വസ്തുക്കളും മാത്രം യഹ്‌വെയുടെ ആലയത്തിലെ ഭണ്ഡാരത്തിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെങ്കലവും ഇരുമ്പുംകൊണ്ടുള്ള പാത്രങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദത്തിന് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, വസ്തുക്കൾ എന്നിങ്ങനെ വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: തീയിട്ടു ചുട്ടുകളഞ്ഞു
  rationale: ക്രിയയുടെ സജീവ ബഹുവചനരൂപവും בָאֵשׁ സൂചിപ്പിക്കുന്ന അഗ്നിയെന്ന ഉപാധിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: അതിലുള്ള സകലവും
  rationale: പട്ടണത്തിനുള്ളിലുണ്ടായിരുന്ന എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സമഗ്രത സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: רַק
  choice: എന്നാൽ ... മാത്രം
  rationale: മുമ്പ് പറഞ്ഞ സമ്പൂർണ നാശത്തിൽനിന്നുള്ള ഒഴിവാക്കൽ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: വെങ്കലവും ഇരുമ്പുംകൊണ്ടുള്ള വസ്തുക്കൾ
  rationale: כְּלֵי പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, മറ്റു നിർമിത വസ്തുക്കൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമായതിനാൽ 'വസ്തുക്കൾ' ആ വ്യാപ്തി സംരക്ഷിക്കുന്നു; נְחֹשֶׁת ഇവിടെ 'വെങ്കലം' എന്നു നൽകിയിരിക്കുന്നു.
- source_word: נָתְנוּ
  choice: വെച്ചു
  rationale: വിലപിടിപ്പുള്ള വസ്തുക്കൾ ഭണ്ഡാരത്തിൽ നിക്ഷേപിക്കുന്ന ഈ സന്ദർഭത്തിൽ נתן എന്നതിന്റെ സ്വാഭാവികമായ അർഥം.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിലെ ഭണ്ഡാരം
  rationale: വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട വിലപിടിപ്പുള്ള വസ്തുക്കളുടെ സംഭരണസ്ഥലമെന്ന അർഥം നൽകുന്നു; 'ക്ഷേത്രം' എന്നതിനേക്കാൾ 'ആലയം' ഈ സാഹചര്യത്തിൽ സ്വാഭാവികവും അനാവശ്യമായ കാലസൂചന ഒഴിവാക്കുന്നതുമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- issue: ലോഹവസ്തുക്കളുടെ ആരാധനാസംബന്ധമായ ലക്ഷ്യസ്ഥാനം
  choice: യഹ്‌വെയുടെ ആലയത്തിലെ ഭണ്ഡാരത്തിൽ
  alternative: യഹ്‌വെയുടെ ആലയത്തിനുള്ള ഭണ്ഡാരത്തിൽ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം സൂചിപ്പിക്കുന്ന ബന്ധം സംരക്ഷിക്കുമ്പോഴും, പാഠം പറയുന്നതിലപ്പുറം സമർപ്പണച്ചടങ്ങുകളെക്കുറിച്ചുള്ള വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. ഹീബ്രുവിലെ ഒഴിവാക്കൽ ഘടനയും വസ്തുക്കളെ പട്ടികപ്പെടുത്തുന്ന ശൈലിയും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വിശാലാർഥപദത്തിന് പിന്നാലെ വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
