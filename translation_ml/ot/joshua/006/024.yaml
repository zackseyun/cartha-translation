  source_fidelity: The draft accurately renders the destruction of the city and its contents, the exception for the metals, and their placement in Yahweh’s house treasury. The expression “വെങ്കലവും ഇരുമ്പുംകൊണ്ടുള്ള വസ്തുക്കൾ” can, however, imply articles made of bronze and iron together, whereas the Hebrew lists articles of bronze and articles of iron.
