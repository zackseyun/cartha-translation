revisions:
- from: അപ്പോൾ ജനം ആർത്തുവിളിച്ചു; പുരോഹിതന്മാർ കാഹളങ്ങൾ ഊതി. ജനം കാഹളനാദം കേട്ടപ്പോൾ ഉച്ചത്തിൽ ആർത്തുവിളിച്ചു. മതിൽ അതിന്റെ ചുവട്ടിലേക്കുതന്നെ തകർന്നുവീണു[a]. ജനം ഓരോരുത്തനും തനിക്കു നേരെയുള്ള ഭാഗത്തുകൂടി നഗരത്തിലേക്കു കയറിച്ചെന്ന്[b] നഗരം പിടിച്ചെടുത്തു.
  to: അപ്പോൾ ജനം ആർത്തുവിളിച്ചു; അവർ കാഹളങ്ങൾ ഊതി. ജനം കാഹളനാദം കേട്ടപ്പോൾ വലിയ ആർപ്പുവിളി മുഴക്കി. മതിൽ അതിന്റെ സ്ഥാനത്തുതന്നെ തകർന്നുവീണു[a]. ജനം ഓരോരുത്തനും തന്റെ നേരേ മുന്നോട്ടു നഗരത്തിലേക്കു കയറി നഗരം പിടിച്ചെടുത്തു[b].
  rationale: ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘പുരോഹിതന്മാർ’ എന്ന കർത്താവിനെ ഒഴിവാക്കി, ശോഫാർ ഊതിയത് ജനമാണെന്ന എബ്രായവാക്യത്തിന്റെ നേരിട്ടുള്ള വ്യാകരണബന്ധം പുനഃസ്ഥാപിച്ചു. രണ്ടാം ചലനവാക്യത്തിൽ ഓരോ വ്യക്തിയും സ്വന്തം മുന്നിലുള്ള ദിശയിലേക്കു നീങ്ങിയെന്ന അർഥം വ്യക്തമായി അറിയിച്ചു. മതിൽ വീണതിനെക്കുറിച്ചുള്ള ബുദ്ധിമുട്ടുള്ള എബ്രായരൂപത്തിന് ഒരു സ്വാഭാവിക മുഖ്യവിവർത്തനം നൽകിയെങ്കിലും, കൂടുതൽ അക്ഷരാർഥവും ‘നിരപ്പായി’ എന്ന പരമ്പരാഗത ബദലും കുറിപ്പിൽ സംരക്ഷിച്ചു.
