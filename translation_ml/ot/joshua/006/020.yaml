source:
  edition: WLC
  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: ml
  text: അപ്പോൾ ജനം ആർത്തുവിളിച്ചു; അവർ കാഹളങ്ങൾ ഊതി. ജനം കാഹളനാദം കേട്ടപ്പോൾ വലിയ ആർപ്പുവിളി മുഴക്കി. മതിൽ അതിന്റെ സ്ഥാനത്തുതന്നെ തകർന്നുവീണു[a]. ജനം ഓരോരുത്തനും തന്റെ നേരേ മുന്നോട്ടു നഗരത്തിലേക്കു കയറി നഗരം പിടിച്ചെടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മതിൽ നിരപ്പായി വീണു.” എബ്രായത്തിൽ അക്ഷരാർഥം, “മതിൽ അതിന്റെ കീഴിലേക്കു വീണു” എന്നാണ്; അസാധാരണമായ ഈ പ്രയോഗം മതിൽ നേരേ താഴേക്കു തകർന്നുവീണതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഓരോ പുരുഷനും തന്റെ നേരേ [മുന്നോട്ടു].”
    reason: gendered_distributive
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: ആർത്തുവിളിച്ചു / ഉച്ചത്തിൽ ആർത്തുവിളിച്ചു
  rationale: രוע എന്ന ധാതുവും תְּרוּעָה എന്ന നാമവും ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; യുദ്ധവിളിയെന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും മൂലവാക്യം അത് പ്രത്യേകം നിർണ്ണയിക്കാത്തതിനാൽ പൊതുവായെങ്കിലും ശക്തമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: കാഹളങ്ങൾ / കാഹളം
  rationale: ശോഫാർ സൂചന നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പുകൊണ്ടുള്ള വാദ്യമാണ്. മലയാളത്തിൽ വായനാസൗകര്യവും വാദ്യത്തിന്റെ പ്രവർത്തനവും നിലനിർത്താൻ ‘കാഹളം’ ഉപയോഗിച്ചു.
- source_word: קוֹל הַשּׁוֹפָר
  choice: കാഹളനാദം
  rationale: קוֹל എന്നത് ഇവിടെ വാദ്യത്തിന്റെ ശബ്ദം എന്നർഥമാണ്; ‘കാഹളനാദം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: മതിൽ അതിന്റെ ചുവട്ടിലേക്കുതന്നെ തകർന്നുവീണു
  rationale: തַּחְתֶּיהָ എന്ന അസാധാരണ പ്രയോഗത്തിലെ ‘അതിന്റെ കീഴിലേക്ക്/ചുവട്ടിലേക്ക്’ എന്ന ദിശ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രൂപം നൽകി; ‘നിരപ്പായി വീണു’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- source_word: וַיַּעַל ... הָעִירָה
  choice: നഗരത്തിലേക്കു കയറിച്ചെന്ന്
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനവും עִירָה എന്ന ദിശാസൂചക രൂപത്തിലെ നഗരത്തിലേക്കുള്ള നീക്കവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ נֶגְדּוֹ
  choice: ഓരോരുത്തനും തനിക്കു നേരെയുള്ള ഭാഗത്തുകൂടി
  rationale: വിതരണാത്മകമായ אִישׁ എന്ന രൂപവും ഓരോ വ്യക്തിയും സ്വന്തം സ്ഥാനത്തുനിന്ന് നേരേ മുന്നോട്ടു നീങ്ങിയെന്ന נֶגְדּוֹയുടെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּלְכְּדוּ
  choice: പിടിച്ചെടുത്തു
  rationale: ഒരു നഗരത്തെ സൈനികമായി കൈവശപ്പെടുത്തുന്ന לכד എന്ന ക്രിയയുടെ വ്യക്തവും സാധാരണവുമായ മലയാളരൂപം.
theological_decisions:
- issue: אִישׁ נֶגְדּוֹ എന്ന വിതരണാത്മക പ്രയോഗത്തിലെ ലിംഗസൂചന
  choice: ഓരോരുത്തനും തനിക്കു നേരെയുള്ള ഭാഗത്തുകൂടി
  alternative: ഓരോ പുരുഷനും തന്റെ നേരേ മുന്നിലുള്ള ഭാഗത്തുകൂടി
  rationale: אִישׁ രൂപപരമായി പുല്ലിംഗമാണെങ്കിലും ഇവിടെ സൈന്യത്തിലെ ഓരോ അംഗത്തെയും വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഓരോരുത്തനും’ പുരുഷപങ്കാളികളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗമായതിനാൽ അനാവശ്യമായ കാഠിന്യം ഒഴിവാക്കി; കുറിപ്പിൽ അക്ഷരാർഥം വ്യക്തമാക്കി.
- issue: തകർന്ന മതിലിന്റെ വീഴ്ചയുടെ സ്വഭാവം
  choice: അതിന്റെ ചുവട്ടിലേക്കുതന്നെ തകർന്നുവീണു
  alternative: നിരപ്പായി വീണു
  rationale: എബ്രായത്തിലെ അസാധാരണമായ תַּחְתֶּיהָ എന്ന പദപ്രയോഗം മതിൽ എങ്ങനെ വീണുവെന്ന കാര്യത്തിൽ വ്യാഖ്യാനസാധ്യത വിടുന്നു; മുഖ്യപാഠത്തിൽ ആ അസാധാരണതയുടെ അടിസ്ഥാനചിത്രം നിലനിർത്തി, കൂടുതൽ വ്യാഖ്യാനപരമായ പാഠം കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി രണ്ടാം വാക്യത്തിൽ ചുരുക്കി. וַיָּרַע הָעָם എന്നിടത്തെ കർത്താവ് ‘ജനം’ തന്നെയാണ്; ഇംഗ്ലീഷ് consultation text-ലെ marker/footnote പൊരുത്തക്കേട് പിന്തുടർന്നിട്ടില്ല. ‘പുരോഹിതന്മാർ’ എന്നത് ഈ വാക്യത്തിലെ വ്യക്തമായ കർത്താവല്ലാത്തതിനാൽ ചേർത്തിരിക്കുന്നത് സന്ദർഭപൂരണമാണെങ്കിലും മൂലപാഠത്തോട് കൂടുതൽ കർശനമായി നിൽക്കാൻ അന്തിമപാഠത്തിൽ അത് ഒഴിവാക്കുന്നത് അഭികാമ്യം.
