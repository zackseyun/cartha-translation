reference: Joshua 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: ml
  text: യുദ്ധം ചെയ്യുന്ന പുരുഷന്മാരായ നിങ്ങളെല്ലാവരും[a] നഗരത്തെ ചുറ്റുക; നഗരത്തിനു ചുറ്റും ഒരിക്കൽ സഞ്ചരിക്കുക. നീ ഇങ്ങനെ ആറു ദിവസം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യുദ്ധത്തിലെ പുരുഷന്മാർ’; ‘യുദ്ധസൈനികർ’ അല്ലെങ്കിൽ ‘യോദ്ധാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: നിങ്ങളെല്ലാവരും നഗരത്തെ ചുറ്റിനടന്ന്
  rationale: סבב എന്ന ധാതുവിന്റെ ‘ചുറ്റിപ്പോകുക’ എന്ന അടിസ്ഥാനാർഥവും സൈനികസന്ദർഭത്തിലെ ക്രമബദ്ധമായ നീക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: സന്ദർഭത്തിൽ യെരീഹോ ആണെങ്കിലും എബ്രായപാഠം പൊതുനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ‘നഗരം’ എന്നു തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയത്.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യുന്ന പുരുഷന്മാരായ നിങ്ങളെല്ലാവരും
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ പുരുഷന്മാർ’ എന്ന പുരുഷലിംഗ സൈനികപ്രയോഗം. മലയാളത്തിൽ അർഥം വ്യക്തമാകാനും പുരുഷന്മാരെന്ന സൂചന നഷ്ടപ്പെടാതിരിക്കാനും ഈ രൂപം സ്വീകരിച്ചു.
- source_word: הַקֵּיף אֶת הָעִיר
  choice: അതിനെ ഒരിക്കൽ വലംവയ്ക്കണം
  rationale: ആദ്യത്തെ ‘ചുറ്റിനടക്കുക’ എന്ന നിർദേശം പുനരുറപ്പിക്കുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ അനാവശ്യമായ ഒരേപദാവർത്തനം കൂടാതെ ‘വലംവയ്ക്കുക’ എന്നു നൽകി.
- source_word: פַּעַם אֶחָת
  choice: ഒരിക്കൽ
  rationale: ഒരു പ്രാവശ്യം എന്ന അർഥമുള്ള സ്വാഭാവിക മലയാള തത്തുല്യം.
- source_word: כֹּה
  choice: ഇങ്ങനെ
  rationale: നിർദേശിച്ച രീതിയിലേക്കു ചൂണ്ടുന്ന സാധാരണവും മാന്യവുമായ മലയാള പ്രയോഗം.
- source_word: תַעֲשֶׂה
  choice: നീ ... ചെയ്യണം
  rationale: ഇവിടെയുള്ള രണ്ടാംപുരുഷ ഏകവചനം യോശുവയോടുള്ള അഭിസംബോധനയായി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: പ്രവൃത്തി ആവർത്തിക്കേണ്ട കാലദൈർഘ്യം ലളിതമായി നൽകുന്നു.
theological_decisions:
- issue: אַנְשֵׁי הַמִּלְחָמָה എന്നതിലെ ലിംഗസൂചന
  choice: യുദ്ധം ചെയ്യുന്ന പുരുഷന്മാർ
  alternative: യോദ്ധാക്കൾ / സൈനികർ
  rationale: എബ്രായപ്രയോഗം പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിരപേക്ഷമാകാവുന്ന പദം മാത്രം ഉപയോഗിക്കാതെ ‘പുരുഷന്മാർ’ നിലനിർത്തി.
- issue: അഭിസംബോധനയിലെ വചനമാറ്റം
  choice: ആദ്യഭാഗത്ത് ബഹുവചനം; അവസാനഭാഗത്ത് ‘നീ’ എന്ന ഏകവചനം
  alternative: രണ്ടിടത്തും ബഹുവചനം അല്ലെങ്കിൽ രണ്ടിടത്തും ഏകവചനം
  rationale: וְסַבֹּתֶם എന്ന ബഹുവചനത്തിൽനിന്ന് תַעֲשֶׂה എന്ന ഏകവചനത്തിലേക്കുള്ള എബ്രായപാഠത്തിന്റെ മാറ്റം സംരക്ഷിച്ചു; അവസാനത്തെ ഏകവചനം ഉത്തരവാദിയായ നേതാവ് യോശുവയെ അഭിസംബോധന ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി സ്വീകരിച്ചു. ‘ചുറ്റിനടക്കുക’ എന്നും ‘വലംവയ്ക്കുക’ എന്നും ഉപയോഗിച്ച് എബ്രായത്തിലെ ആവർത്തിച്ച ചുറ്റൽപ്രയോഗം സ്വാഭാവികമായി സംരക്ഷിച്ചു; ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം തുറന്നുകാട്ടാൻ അവസാനവാക്യത്തിൽ ‘നീ’ ചേർത്തു.
