id: JOS.6.10
reference: Joshua 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ לֵ/אמֹ֗ר לֹ֤א תָרִ֨יעוּ֙ וְ/לֹֽא תַשְׁמִ֣יעוּ אֶת קוֹלְ/כֶ֔ם וְ/לֹא יֵצֵ֥א מִ/פִּי/כֶ֖ם דָּבָ֑ר עַ֠ד י֣וֹם אָמְרִ֧/י אֲלֵי/כֶ֛ם הָרִ֖יעוּ וַ/הֲרִיעֹתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: ml
  text: 'യോശുവ ജനത്തോടു കൽപ്പിച്ചു: “ഞാൻ നിങ്ങളോടു, ‘ആർപ്പുവിളിക്കുവിൻ!’ എന്നു പറയുന്ന ദിവസംവരെ, നിങ്ങൾ ആർപ്പുവിളിക്കരുത്[a]; നിങ്ങളുടെ ശബ്ദം കേൾപ്പിക്കരുത്; നിങ്ങളുടെ വായിൽനിന്ന് ഒരു വാക്കുപോലും പുറത്തുവരരുത്[b]. അപ്പോൾ നിങ്ങൾ ആർപ്പുവിളിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “യുദ്ധവിളി മുഴക്കരുത്” അല്ലെങ്കിൽ “പോരാട്ടഘോഷം നടത്തരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നിങ്ങളുടെ വായിൽനിന്ന് ഒരു വാക്കും പുറത്തുവരരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: വെറും ഉപദേശമല്ല, അധികാരപൂർവമായ ആജ്ഞയാണ് എബ്രായ ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭം സൈനികമാണെങ്കിലും മൂലപദം പൊതുവായ ‘ജനം’ എന്നാണ്; ‘സൈന്യം’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לֹא תָרִיעוּ / הָרִיעוּ / וַהֲרִיעֹתֶם
  choice: ആർപ്പുവിളിക്കരുത് / ആർപ്പുവിളിക്കുവിൻ / ആർപ്പുവിളിക്കണം
  rationale: רוע എന്ന ഒരേ ധാതുവിന്റെ ആവർത്തനം നിലനിർത്തുന്നു; യുദ്ധവിളിയെയോ വിജയഘോഷത്തെയോ സൂചിപ്പിക്കാവുന്ന സന്ദർഭാർഥവും ‘ആർപ്പുവിളിക്കുക’ ഉൾക്കൊള്ളുന്നു.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: നിങ്ങളുടെ ശബ്ദം കേൾപ്പിക്കരുത്
  rationale: ‘കേൾക്കുമാറാക്കുക’ എന്ന കാരകഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: നിങ്ങളുടെ വായിൽനിന്ന് ഒരു വാക്കുപോലും പുറത്തുവരരുത്
  rationale: ‘വായിൽനിന്ന് വാക്ക് പുറത്തുവരുക’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും ‘പോലും’ വഴി സമ്പൂർണ മൗനത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַד יוֹם אָמְרִי אֲלֵיכֶם
  choice: ‘ആർപ്പുവിളിക്കുവിൻ!’ എന്നു ഞാൻ നിങ്ങളോടു പറയുന്ന ദിവസംവരെ
  rationale: ‘ദിവസംവരെ’ എന്ന കൃത്യമായ കാലസൂചനയും ‘ഞാൻ നിങ്ങളോടു പറയുമ്പോൾ’ എന്ന വാക്യബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. കല്പനയുടെ അധികാരഭാവവും മൂലവാക്യത്തിലെ മൂന്ന് ഘട്ടങ്ങളായ മൗനനിർദേശവും ഒരേ ധാതുവിന്റെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
