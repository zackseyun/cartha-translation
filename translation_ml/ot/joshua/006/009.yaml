base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: ml
  text: ആയുധധാരികളായ സൈനികർ കാഹളങ്ങൾ[a] ഊതിക്കൊണ്ടിരുന്ന പുരോഹിതന്മാരുടെ മുമ്പിൽ നടന്നുകൊണ്ടിരുന്നു; പിൻകാവൽസേന പെട്ടകത്തിനു പിന്നിൽ നടന്നുകൊണ്ടിരുന്നു; കാഹളങ്ങൾ തുടർച്ചയായി ഊതിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ശോഫറോത്ത്; പ്രത്യേകിച്ച് ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങൾ; പലപ്പോഴും ‘ആട്ടുകൊമ്പുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: ആയുധധാരികളായ സൈനികർ
  rationale: യുദ്ധസജ്ജരായി ഘോഷയാത്രയുടെ മുൻനിരയിൽ നീങ്ങിയ സൈനികസംഘത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: הֹלֵךְ
  choice: നടന്നുകൊണ്ടിരുന്നു
  rationale: എബ്രായ പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന സഞ്ചാരത്തെ മലയാളത്തിലെ പുരോഗമനരൂപം പ്രകടമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഘോഷയാത്രയിലെ സ്ഥാനക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ സ്ഥലസൂചക പ്രയോഗം.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാപരവും ആഖ്യാനപരവുമായ സന്ദർഭങ്ങളിൽ ഈ പദത്തിന്റെ സ്ഥിരവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാളരൂപം.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ ഊതിക്കൊണ്ടിരുന്ന
  rationale: പുരോഹിതന്മാരുടെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയായി ഉപവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഊതുക’ വാദ്യത്തിന്റെ പ്രവർത്തനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הַמְאַסֵּף
  choice: പിൻകാവൽസേന
  rationale: യാത്രാസംഘത്തിന്റെ പിന്നിൽ സംരക്ഷണചുമതലയോടെ നീങ്ങുന്ന സൈനികവിഭാഗം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നിൽ
  rationale: ഇവിടെ കാലക്രമമല്ല, പെട്ടകത്തോടുള്ള സ്ഥലപരമായ ബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הָאָרוֹן
  choice: പെട്ടകം
  rationale: സമീപസന്ദർഭത്തിൽ ഏത് പെട്ടകമാണെന്ന് വ്യക്തമായതിനാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ഉടമ്പടിയുടെ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: മുന്നോട്ടു നീങ്ങിക്കൊണ്ട് ... തുടർച്ചയായി ഊതിക്കൊണ്ടിരുന്നു
  rationale: സഞ്ചാരത്തോടൊപ്പം കാഹളം ഊതുന്ന പ്രവൃത്തി തുടർന്നുവെന്ന എബ്രായ നിർമാണത്തിന്റെ ദൈർഘ്യസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: בַּשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ
  rationale: വാക്യത്തിനുള്ളിൽ വായനാസൗകര്യവും പദസ്ഥിരതയും നിലനിർത്തുന്നു; ഉപകരണത്തിന്റെ കൂടുതൽ കൃത്യമായ സ്വഭാവം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
