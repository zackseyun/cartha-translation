id: JOS.6.12
reference: Joshua 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: ml
  text: യോശുവ അതിരാവിലെ എഴുന്നേറ്റു; പുരോഹിതന്മാർ യഹോവയുടെ പെട്ടകം ചുമന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: അതിരാവിലെ എഴുന്നേറ്റു
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന അർഥം നൽകുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בַּבֹּקֶר
  choice: അതിരാവിലെ
  rationale: അക്ഷരാർഥം ‘രാവിലെ’ എന്നാണ്; മുൻക്രിയയിലെ നേരത്തേ എന്ന ആശയത്തോടു ചേർത്ത് സ്വാഭാവികമായി ‘അതിരാവിലെ’ എന്നു നൽകി.
- source_word: וַיִּשְׂאוּ
  choice: ചുമന്നു
  rationale: נשא എന്നതിന് ഉയർത്തുക, വഹിക്കുക, ചുമക്കുക എന്നീ അർഥങ്ങളുണ്ട്. പെട്ടകം കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘ചുമന്നു’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തെ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥതാരൂപത്തിൽ നൽകി; אֲרוֹן എന്നത് ഈ സന്ദർഭത്തിൽ വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് പകരാതെ പേരായി നിലനിർത്തി; ആധുനിക മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപം ‘യഹോവ’യാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വിവരണശൈലിയിലെ തുടർച്ച നിലനിർത്താൻ രണ്ട് പ്രവൃത്തികളെ അർധവിരാമംകൊണ്ട് ബന്ധിപ്പിച്ചു.
