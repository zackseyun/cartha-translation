reference: Joshua 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: ml
  text: 'ദേശം ഒറ്റുനോക്കിയ ആ രണ്ടു പുരുഷന്മാരോടു യോശുവ പറഞ്ഞു: “ആ വേശ്യയായ സ്ത്രീയുടെ[a] വീട്ടിൽ പോയി, നിങ്ങൾ അവളോടു ശപഥം ചെയ്തതുപോലെ ആ സ്ത്രീയെയും അവൾക്കുള്ള സകലവും അവിടെനിന്ന് പുറത്തുകൊണ്ടുവരൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ആ സ്ത്രീ, വേശ്യ.” മലയാളത്തിൽ കൂടുതൽ ചുരുക്കി “വേശ്യയുടെ വീട്ടിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: എബ്രായത്തിലെ ‘സ്ത്രീ’യും ‘വേശ്യ’യും ചേർന്നുള്ള appositional പ്രയോഗവും അതിന്റെ സ്വാഭാവികമായ മലയാള വിവർത്തനസാധ്യതയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: ആ രണ്ടു പുരുഷന്മാരോടു
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമവും നിർദിഷ്ടരായ രണ്ടു പുരുഷന്മാരും വ്യക്തമായി നിലനിർത്തുന്നു; തുടക്കത്തിലെ waw മലയാള ആഖ്യാനത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: ദേശം ഒറ്റുനോക്കിയ
  rationale: רגל എന്ന പദത്തിന്റെ സന്ദർഭാർഥമായ രഹസ്യനിരീക്ഷണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മുമ്പ് നടന്ന ദൗത്യമാണെന്നത് ഭൂതകാലരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֹּאוּ בֵּית
  choice: വീട്ടിൽ ചെന്ന്
  rationale: בוא എന്നതിന്റെ സന്ദർഭോചിതമായ ആജ്ഞയും בית എന്നതിന്റെ വാസസ്ഥലാർഥവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: വേശ്യയായ സ്ത്രീ
  rationale: זוֹנָה എന്നതിന്റെ വ്യക്തമായ അർഥം മയപ്പെടുത്താതെ നൽകുകയും എബ്രായത്തിലെ ‘സ്ത്രീ’ എന്ന നാമവും അതിന്റെ വിശേഷണസ്വഭാവമുള്ള പദവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: അവിടെനിന്നു പുറത്തുകൊണ്ടുവരുക
  rationale: ഹിഫിൽ രൂപത്തിന്റെ causative അർഥമായ ‘പുറത്തുകൊണ്ടുവരുക’ എന്നതും מִשָּׁם എന്ന ‘അവിടെനിന്ന്’ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: അവൾക്കുള്ള സകലവും
  rationale: വ്യക്തികളെയോ വസ്തുക്കളെയോ മാത്രമായി ചുരുക്കാതെ എബ്രായത്തിലെ വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: നിങ്ങൾ അവളോടു സത്യം ചെയ്തതുപോലെ
  rationale: ആജ്ഞയ്ക്ക് അടിസ്ഥാനമായിരുന്ന അവരുടെ ശപഥബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: രാഹാബിനെ വിശേഷിപ്പിക്കുന്ന זוֹנָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വേശ്യ
  alternative: വേശ്യാവൃത്തി ചെയ്തിരുന്ന സ്ത്രീ; അഭിസാരിക
  rationale: എബ്രായപദം വേശ്യയെ സൂചിപ്പിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത മയപ്പെടുത്തലോ പ്രത്യേക വ്യാഖ്യാനമോ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന ആജ്ഞാരൂപം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാകുന്നതിനാൽ അതിപുരാതനമായ ‘പുറത്തുകൊണ്ടുവരുവിൻ’ ഒഴിവാക്കി.
