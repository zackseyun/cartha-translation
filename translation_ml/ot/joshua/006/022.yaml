  naturalness: The wording is generally clear modern Malayalam. With an explicit നിങ്ങൾ, the plural modern imperative പുറത്തുകൊണ്ടുവരൂ is more natural than the unmarked പുറത്തുകൊണ്ടുവരുക. പോയി also makes the initial plural command idiomatic.
