source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: ml
  text: യോശുവ ജനത്തോടു സംസാരിച്ചപ്പോൾ, യഹോവയുടെ സന്നിധിയിൽ[a] ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ[b] വഹിച്ചിരുന്ന ഏഴു പുരോഹിതന്മാർ മുന്നോട്ടു നീങ്ങി കാഹളങ്ങൾ ഊതി; യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം അവരുടെ പിന്നാലെ നീങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യഹോവയുടെ മുമ്പിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: ‘യോബേലിന്റെ ഏഴു ശോഫാറുകൾ’; ഇവിടെ ഇത് മിക്കവാറും ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജൂബിലിക്കാഹളങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: സംസാരിച്ചപ്പോൾ
  rationale: വിവരണത്തിന്റെ അടുത്ത ഘട്ടം അവതരിപ്പിക്കുന്ന וַיְהִיയും കാലസൂചകമായ כֶּאֱמֹרയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ കാലവാക്യത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ ‘സംഭവിച്ചു’ ചേർക്കാതെ ക്രമബന്ധം നിലനിർത്തുന്നു.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ
  rationale: שׁוֹפָר എന്നത് കൊമ്പുകൊണ്ടുള്ള ഊത്തുവാദ്യമാണ്; ഇവിടെ יוֹבֵל മിക്കവാറും ആട്ടുകൊമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്. ഉപകരണത്തിന്റെ രൂപവും പ്രവർത്തനവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥിതിവാചക അർഥം നിലനിർത്തുന്നു; ഘോഷയാത്രയിലെ കൃത്യമായ സ്ഥാനക്രമത്തെ മാത്രം ഉറപ്പിക്കുന്നില്ല.
- source_word: עָבְרוּ
  choice: മുന്നോട്ടു നീങ്ങി
  rationale: ഈ ഘോഷയാത്രാസന്ദർഭത്തിൽ עבר അതിർത്തി കടക്കുന്നതിനെക്കാൾ മുന്നോട്ടുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ ഊതി
  rationale: תקע + שופר എന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളം.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളത്തിൽ അവതരിപ്പിച്ച് ഉടമ്പടിയുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നാലെ നീങ്ങി
  rationale: പുരോഹിതന്മാരുടെ പിന്നിലുള്ള തുടർച്ചയായ ഘോഷയാത്രാനീക്കം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: לִפְנֵי יְהוָה എന്നതിന്റെ അർഥം
  choice: യഹോവയുടെ സന്നിധിയിൽ
  alternative: യഹോവയുടെ മുമ്പിൽ
  rationale: ഈ പ്രയോഗം ഭൗതിക സ്ഥാനത്തെയും ദൈവസാന്നിധ്യത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ പ്രധാനപാഠം രണ്ടിനും ഇടം നൽകുന്ന രീതിയിൽ വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഘോഷയാത്രയുടെ സ്ഥാനക്രമവും ചലനവും വ്യക്തമായി സൂക്ഷിച്ചു; അപരിചിതമായ ‘ശോഫാർ’ പ്രധാനപാഠത്തിൽ വിശദീകരണാത്മകമായി പരിഭാഷപ്പെടുത്തി, മൂലരൂപം അടിക്കുറിപ്പിൽ നൽകി.
