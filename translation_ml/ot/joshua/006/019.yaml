source:
  edition: WLC
  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: ml
  text: എന്നാൽ വെള്ളിയും സ്വർണവും, വെങ്കലംകൊണ്ടും ഇരുമ്പുകൊണ്ടും ഉണ്ടാക്കിയ വസ്തുക്കളുമെല്ലാം യഹ്‌വേക്കു വിശുദ്ധമാണ്[a]; അവ യഹ്‌വേയുടെ ഭണ്ഡാരത്തിലേക്കു ചെല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘വിശുദ്ധമാണ്’, ‘ചെല്ലണം’ എന്നീ പ്രയോഗങ്ങൾ ഏകവചനത്തിലാണ്; പട്ടികപ്പെടുത്തിയ ലോഹങ്ങളെയും വസ്തുക്കളെയും ഒരൊറ്റ സമാഹാരമായി കണക്കാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: എന്നാൽ … സകല
  rationale: മുൻവാക്യത്തിലെ നിരോധനത്തോടു വിപരീതമായി ഈ വസ്തുക്കൾക്കുള്ള പ്രത്യേക നിർദേശം അവതരിപ്പിക്കുന്നതിനാൽ וְ എന്ന ബന്ധകത്തിന് സന്ദർഭോചിതമായി ‘എന്നാൽ’ എന്നു നൽകി; כֹּל എന്നത് ‘സകല’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כֶּסֶף וְ/זָהָב
  choice: വെള്ളിയും സ്വർണവും
  rationale: മറ്റു ലോഹങ്ങളോടൊപ്പം പറയുന്നതിനാൽ כֶּסֶף ഇവിടെ പണമല്ല, വെള്ളി എന്ന ലോഹമാണ്; זָהָב സ്വർണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: വെങ്കലവും ഇരുമ്പുംകൊണ്ടുള്ള … വസ്തുക്കൾ
  rationale: כְּלִי എന്നത് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, മറ്റു നിർമ്മിത വസ്തുക്കൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമായതിനാൽ ‘വസ്തുക്കൾ’ എന്നു നൽകി. נְחֹשֶׁת പുരാതന ലോഹസന്ദർഭത്തിൽ സാധാരണയായി വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: യഹ്‌വേക്കു വിശുദ്ധമാണ്
  rationale: സമർപ്പിതമായ ഉടമസ്ഥതയും വിശുദ്ധസ്ഥാനത്തേക്കായി വേർതിരിക്കപ്പെട്ട നിലയും ഉൾക്കൊള്ളുന്ന മൂലപാഠത്തിന്റെ സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തി.
- source_word: אוֹצַר יְהוָה
  choice: യഹ്‌വേയുടെ ഭണ്ഡാരം
  rationale: אוֹצָר വിലപിടിപ്പുള്ള വസ്തുക്കൾ സൂക്ഷിക്കുന്ന ഭണ്ഡാരത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: יָבֹוא
  choice: ചെല്ലണം
  rationale: മൂലപാഠത്തിലെ സജീവക്രിയ നിലനിർത്തി; ‘കൊണ്ടുവരണം’ എന്ന കർമണാർത്ഥം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ സവിശേഷ നാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- issue: קֹדֶשׁ എന്നതിന്റെ സമർപ്പണാർഥം
  choice: വിശുദ്ധമാണ്
  alternative: യഹ്‌വേക്കായി വേർതിരിക്കപ്പെട്ടതാണ്
  rationale: ‘വിശുദ്ധം’ എന്ന മൂലാർഥവും സമർപ്പണത്തിലെ ദൈവബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വസ്തുക്കൾ’ എന്ന പദം כְּלִיയുടെ വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടിക്കുറിപ്പിന്റെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, മൂലപാഠത്തിൽ യഥാർഥമായി പ്രസക്തമായ ഏകവചന-സമാഹാര സൂചന മാത്രം [a] ആയി ഉൾപ്പെടുത്തി.
