translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്തമായ അവസാനവാക്യം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ആവർത്തനസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
