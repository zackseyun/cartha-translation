reference: Joshua 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: ml
  text: രണ്ടാം ദിവസം അവർ നഗരത്തെ ഒരിക്കൽ ചുറ്റി പാളയത്തിലേക്കു മടങ്ങി. ഇങ്ങനെ അവർ ആറു ദിവസവും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: അവർ ... ചുറ്റി
  rationale: סבב എന്ന ധാതു ഇവിടെ ചുറ്റിസഞ്ചരിക്കുക എന്ന ചലനത്തെ സൂചിപ്പിക്കുന്നു. സൈനികമായ അധിക അർത്ഥം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: הָעִיר
  choice: പട്ടണത്തെ
  rationale: עִיר എന്നത് പട്ടണം/നഗരം എന്നു വരാം; യെരീഹോയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: ഹീബ്രു കാലസൂചനയുടെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: פַּעַם אַחַת
  choice: ഒരിക്കൽ
  rationale: ‘ഒരു പ്രാവശ്യം’ എന്ന അർത്ഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיָּשֻׁבוּ
  choice: മടങ്ങി
  rationale: שׁוב എന്ന ധാതുവിന്റെ ‘തിരിച്ചുപോകുക/മടങ്ങുക’ എന്ന അർത്ഥം ആഖ്യാനക്രമത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: הַמַּחֲנֶה
  choice: പാളയത്തിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപം മലയാളത്തിൽ ‘-ലേക്കു’ ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כֹּה עָשׂוּ
  choice: ഇങ്ങനെ അവർ ... ചെയ്തു
  rationale: כֹּה പ്രവൃത്തിയുടെ രീതിയെ ചൂണ്ടിക്കാണിക്കുന്നു; עָשׂוּ-യോടൊപ്പം ഹീബ്രുവിന്റെ സംക്ഷിപ്തമായ സമാപനവാക്യം നിലനിർത്തുന്നു.
- source_word: שֵׁשֶׁת יָמִים
  choice: ആറു ദിവസം
  rationale: ഹീബ്രുവിലെ കാലദൈർഘ്യപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ രീതി ആ ദിവസങ്ങളിൽ ആവർത്തിച്ചുവെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
