source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: ml
  text: അങ്ങനെ യാഹ്‌വേയുടെ പെട്ടകം നഗരത്തെ ഒരു പ്രാവശ്യം ചുറ്റിവന്നു.[a] പിന്നെ അവർ പാളയത്തിൽ വന്ന് ആ രാത്രി പാളയത്തിൽത്തന്നെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ പെട്ടകത്തെയാണ് പ്രവർത്തനത്തിന്റെ കർത്താവായി അവതരിപ്പിക്കുന്നത്; എന്നാൽ പുരോഹിതന്മാരാണ് അതു ചുമന്നിരുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: ചുറ്റിവന്നു
  rationale: സבב എന്ന ധാതുവിന്റെ ഇവിടെ കാണുന്ന രൂപം നഗരത്തെ ചുറ്റിയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. പെട്ടകത്തെയാണ് എബ്രായവാക്യം വ്യാകരണപരമായ കർത്താവാക്കുന്നത്; അതിനാൽ കർമ്മണിപ്രയോഗം ചേർക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: אֲרוֹן יְהוָה
  choice: യാഹ്‌വേയുടെ പെട്ടകം
  rationale: എബ്രായത്തിലെ സംയുക്തനാമഘടന നേരിട്ട് നിലനിർത്തുകയും ദൈവനാമമായ יְהוָה-യെ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
- source_word: אֶת הָעִיר
  choice: നഗരത്തെ
  rationale: സന്ദർഭത്തിൽ യെരീഹോയെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം; മൂലപാഠത്തിലെ പൊതുപദം ആവർത്തിക്കാതെ അതേപടി നിലനിർത്തി.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: ഒരു പ്രാവശ്യം ചുറ്റിവന്നു
  rationale: ചുറ്റൽ എന്ന ആശയത്തെ വിശദീകരിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗവും ‘ഒരിക്കൽ’ എന്ന എണ്ണവും മലയാളത്തിൽ സ്വാഭാവികമായി ഏകീകരിച്ചു.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: അവർ പാളയത്തിൽ വന്ന്
  rationale: בוא എന്നതിന്റെ അടിസ്ഥാന അർഥമായ വരുക/പ്രവേശിക്കുക നിലനിർത്തി; ‘മടങ്ങി’ എന്ന സന്ദർഭാനുമാനം ചേർത്തിട്ടില്ല.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: ആ രാത്രി പാളയത്തിൽത്തന്നെ താമസിച്ചു
  rationale: לון എന്നത് രാത്രി പാർക്കുക എന്നർഥം നൽകുന്നു. എബ്രായത്തിലെ ‘പാളയം’ എന്ന ആവർത്തനം ‘പാളയത്തിൽത്തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ നാലക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ലിപ്യന്തരണമായി നൽകി.
- issue: പെട്ടകം പ്രവർത്തനത്തിന്റെ കർത്താവായി വരുന്നത്
  choice: പെട്ടകം നഗരത്തെ ചുറ്റിവന്നു
  alternative: പുരോഹിതന്മാർ പെട്ടകം നഗരത്തിനു ചുറ്റും കൊണ്ടുപോയി
  rationale: പെട്ടകം പുരോഹിതന്മാർ ചുമന്നതാണെങ്കിലും, എബ്രായവാക്യം പെട്ടകത്തെയാണ് വ്യാകരണപരമായി കർത്താവാക്കുന്നത്. ആ വ്യക്തിവൽക്കരിച്ച ആഖ്യാനരീതി പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു; പ്രായോഗിക സാഹചര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ പെട്ടകത്തിന്റെ വ്യക്തിവൽക്കരണവും പാളയത്തെക്കുറിച്ചുള്ള ആവർത്തനവും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
