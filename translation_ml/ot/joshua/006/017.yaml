  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: ml
  text: നഗരവും അതിലുള്ള സകലവും യഹോവയ്ക്കായി നാശത്തിനു സമർപ്പിക്കപ്പെട്ടതായിരിക്കണം[a]. വേശ്യയായ രാഹാബ് മാത്രം ജീവനോടെ ശേഷിക്കണം—അവളും വീട്ടിൽ അവളോടുകൂടെയുള്ള എല്ലാവരും—കാരണം ഞങ്ങൾ അയച്ച ദൂതന്മാരെ[b] അവൾ ഒളിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിരോധനത്തിൻ കീഴിലായിരിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം യഹോവയ്ക്കായി പിൻവലിക്കാനാകാത്തവിധം സമർപ്പിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ആ സമർപ്പണം നാശത്തിലൂടെയാണ് നടപ്പാകുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ദൂതന്മാർ.’ സന്ദർഭത്തിൽ ഇവർ ദേശം ഒറ്റുനോക്കാൻ യോശുവ അയച്ച പുരുഷന്മാരാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: നാശത്തിനു സമർപ്പിക്കപ്പെട്ടത്
  rationale: ഈ കീഴടക്കസന്ദർഭത്തിൽ പദം യഹോവയ്ക്കായി പിൻവലിക്കാനാകാത്തവിധം നീക്കിവെക്കുന്നതിനെയും അതു നാശത്തിലൂടെ നടപ്പാക്കുന്നതിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ സമർപ്പണത്തിന്റെയും നാശത്തിന്റെയും ആശയങ്ങൾ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കായി
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ യഹോവയ്ക്കുള്ള സമർപ്പണത്തെ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה മലയാളത്തിൽ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: רַק
  choice: മാത്രം
  rationale: നഗരത്തിന്റെ പൊതുവിധിയിൽനിന്നുള്ള ഏക അപവാദത്തെ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: הַזּוֹנָה
  choice: വേശ്യയായ
  rationale: പഴഞ്ചൻ അല്ലാത്തതും അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നതുമായ ആധുനിക മലയാളപദം.
- source_word: תִּחְיֶה
  choice: ജീവനോടെ ശേഷിക്കണം
  rationale: നാശത്തിനു വിരുദ്ധമായി രാഹാബ് ജീവനോടെ തുടരണമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘രക്ഷിക്കപ്പെടണം’ എന്ന കർമണി ആശയം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: אִתָּהּ בַּבַּיִת
  choice: വീട്ടിൽ അവളോടുകൂടെയുള്ള
  rationale: ഇത് കുടുംബാംഗങ്ങളെ മാത്രം അല്ല, വീട്ടിനുള്ളിൽ രാഹാബിനോടൊപ്പം ഉണ്ടായിരുന്ന എല്ലാവരെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: הֶחְבְּאַתָה
  choice: അവൾ ഒളിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘അഭയം നൽകി’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: הַמַּלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: מַלְאָךְ എന്ന പദത്തിന്റെ പൊതുവായ അർഥം ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്നാണ്. സന്ദർഭത്തിൽ ഇവർ യോശുവ അയച്ച മനുഷ്യരാണ്; ‘ചാരന്മാർ’ എന്നത് സന്ദർഭവ്യാഖ്യാനമാണെന്നതിനാൽ മുഖ്യവാചകത്തിൽ കൂടുതൽ ഔപചാരികമായി ‘ദൂതന്മാർ’ നിലനിർത്തുന്നു.
- source_word: שָׁלָחְנוּ
  choice: ഞങ്ങൾ അയച്ച
  rationale: ഒന്നാംപുരുഷ ബഹുവചനമായ പൂർത്തിക്രിയ മുൻപ് നടന്ന അയയ്ക്കലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭൂതകാലരൂപം അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: നഗരവും അതിലുള്ള സകലവും ... ആയിരിക്കണം
  rationale: എബ്രായത്തിലെ മുൻനിരപ്പെടുത്തലും പുനരുക്ത സർവനാമവും നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ അസ്വാഭാവികമായ പുനരാവർത്തനം കൂടാതെ സംയുക്ത കർത്താവിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കീഴടക്കസന്ദർഭത്തിലെ חֵרֶם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനു സമർപ്പിക്കപ്പെട്ടത്
  alternative: നിരോധനത്തിൻ കീഴിലുള്ളത്; ശപിക്കപ്പെട്ടത്; നാശത്തിനായി വേർതിരിക്കപ്പെട്ടത്
  rationale: വിധിയുടെ കഠിനത മൃദൂകരിക്കാതെയും നഗരം വെറും ശാപഗ്രസ്തമാണെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാതെയും, യഹോവയ്ക്കായി വിധിയിൽ പൂർണമായി ഏല്പിക്കപ്പെട്ടിരിക്കുന്നു എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം ഈ രൂപം നിലനിർത്തുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കീഴടക്കവിധിയുടെ കഠിനത മറച്ചുവെക്കാതെ, חֵרֶם എന്ന പദത്തിലെ സമർപ്പണവും നാശവും ഒരുമിച്ച് നിലനിർത്തി. ഇടവരകൾ രാഹാബിനോടൊപ്പം വീട്ടിലുണ്ടായിരുന്ന എല്ലാവരെയും ഉൾപ്പെടുത്തുന്ന അപവാദം വായനാസൗകര്യത്തോടെ വ്യക്തമാക്കുന്നു.
