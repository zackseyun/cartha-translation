source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: ml
  text: യഹോവയുടെ പെട്ടകത്തിനു മുമ്പിൽ ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ വഹിച്ചിരുന്ന ഏഴു പുരോഹിതന്മാർ[a] നടന്നുകൊണ്ട് കാഹളങ്ങൾ ഊതിക്കൊണ്ടിരുന്നു. ആയുധധാരികൾ അവരുടെ മുമ്പിലും പിൻകാവൽ യഹോവയുടെ പെട്ടകത്തിനു പിന്നിലും നടന്നു; മുന്നേറിക്കൊണ്ടിരിക്കെ കാഹളങ്ങൾ ഊതിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യൂബിലി കാഹളങ്ങൾ’ അല്ലെങ്കിൽ ‘ഏഴ് ആട്ടുകൊമ്പുകൾ.’ എബ്രായപ്രയോഗം ആട്ടുകൊമ്പുകൊണ്ടുണ്ടാക്കിയതോ ആട്ടുകൊമ്പുമായി ബന്ധപ്പെട്ടതോ ആയ ശോഫാർ കാഹളങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങൾ
  rationale: שׁוֹפָר എന്നത് കൊമ്പുകൊണ്ടുള്ള കാഹളത്തെയും הַיֹּבְלִים ആട്ടുകൊമ്പുമായുള്ള ബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വസ്തുവും വാദ്യത്തിന്റെ പ്രവർത്തനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הֹלְכִים הָלוֹךְ
  choice: നടന്നുകൊണ്ടു
  rationale: ക്രിയയോടൊപ്പമുള്ള infinitive absolute നൽകുന്ന തുടർച്ചയായ, പുരോഗമിക്കുന്ന പ്രവർത്തനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ ഊതിക്കൊണ്ടിരുന്നു
  rationale: תקע എന്ന ക്രിയയ്ക്ക് ശോഫാറിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ‘ഊതുക’ ആണ്; തുടർച്ചയായ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: הֶחָלוּץ
  choice: ആയുധധാരികൾ
  rationale: യുദ്ധത്തിനായി സജ്ജരായി ഘോഷയാത്രയ്ക്കു മുമ്പിൽ നീങ്ങിയ വിഭാഗത്തെ വ്യക്തവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמְאַסֵּף
  choice: പിൻകാവൽ
  rationale: ഘോഷയാത്രയുടെ പിന്നിൽ നീങ്ങുന്ന സൈനികവിഭാഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: കാഹളങ്ങൾ തുടർച്ചയായി ഊതിക്കൊണ്ടിരുന്നു
  rationale: അവസാന പ്രയോഗത്തിലെ ദൈർഘ്യവും ആവർത്തിതമായ കാഹളമൂത്തും നിലനിർത്തുന്നു; വിഷയത്തിലെ പാഠപരമായ അസ്പഷ്ടത മലയാളത്തിൽ അനാവശ്യമായി പരിഹരിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: അവസാനത്തെ הוֹלֵךְ וְתָקוֹעַ എന്ന ഏകവചനരൂപത്തിന്റെ ബന്ധം
  choice: വ്യക്തമായ പുതിയ കർത്താവിനെ ചേർക്കാതെ ‘കാഹളങ്ങൾ തുടർച്ചയായി ഊതിക്കൊണ്ടിരുന്നു’
  alternative: ‘പുരോഹിതന്മാർ കാഹളങ്ങൾ ഊതിക്കൊണ്ടിരുന്നു’ അഥവാ ‘പിൻകാവൽ കാഹളം ഊതിക്കൊണ്ടിരുന്നു’
  rationale: മസോററ്റിക് പാഠത്തിലെ വ്യാകരണരൂപവും സന്ദർഭത്തിലെ ബഹുവചന കാഹളമൂത്തും തമ്മിൽ സംഘർഷമുണ്ട്. ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പിച്ച് ചേർക്കാതെ പ്രവർത്തനത്തിന്റെ തുടർച്ച മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഘോഷയാത്രയുടെ ക്രമവും തുടർച്ചയായ പ്രവർത്തനവും സംരക്ഷിച്ചു.
