base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: ml
  text: ഏഴാം ദിവസം, പുലരി ഉദിക്കുമ്പോൾ, അവർ അതിരാവിലെ എഴുന്നേറ്റ് ഈ വിധം നഗരത്തെ ഏഴു പ്രാവശ്യം ചുറ്റിനടന്നു. ആ ദിവസം മാത്രമാണ് അവർ നഗരത്തെ ഏഴു പ്രാവശ്യം ചുറ്റിനടന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: പുലരി തെളിയുന്ന നേരത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘പുലരി ഉദിക്കുമ്പോൾ’; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: ചുറ്റി നടന്നു
  rationale: മൂലക്രിയയുടെ പ്രാഥമിക അർഥം നഗരത്തെ ചുറ്റുക എന്നതാണ്. സന്ദർഭത്തിലെ ക്രമബദ്ധമായ നീക്കം സൂചിപ്പിക്കുമ്പോഴും ‘മാർച്ച് ചെയ്തു’ എന്ന സൈനിക സൂക്ഷ്മാർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: പതിവുപോലെ
  rationale: ഇവിടെ ‘ഈ ക്രമം/രീതി അനുസരിച്ച്’ എന്ന അർഥം; മുൻദിവസങ്ങളിൽ നിർദേശിച്ചും അനുഷ്ഠിച്ചും വന്ന രീതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: ആ ദിവസം മാത്രമാണ്
  rationale: ആ ദിവസത്തിന്റെ പ്രത്യേകതയ്ക്ക് മൂലപാഠം നൽകുന്ന ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായോ വിഭാഗീയമായോ വിശദീകരണം ചേർത്തിട്ടില്ല.
