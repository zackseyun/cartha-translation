    issue: “പതിവുപോലെ” for כַּמִּשְׁפָּט הַזֶּה
    rationale: The phrase refers specifically to ‘this manner/procedure,’ likely the stated pattern of circling. ‘As usual’ is contextually plausible but less exact and can imply a general custom.
