id: JOS.6.18
reference: Joshua 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളോ, നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന്[a] അകന്നുനിൽക്കുക; അല്ലാത്തപക്ഷം, നിങ്ങൾതന്നെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീരുകയും[b], നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന് എന്തെങ്കിലും എടുക്കുകയും, ഇസ്രായേലിന്റെ പാളയത്തെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാക്കുകയും അതിന്മേൽ കഷ്ടം വരുത്തുകയും ചെയ്യും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു חֵרֶם (ഖേരെം) എന്ന പദം പരമ്പരാഗതമായി ‘വിലക്ക്’ അല്ലെങ്കിൽ ‘ശപിക്കപ്പെട്ട വസ്തു’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. ഇവിടെ അത് ദൈവത്തിനായി തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കപ്പെട്ട് നശിപ്പിക്കേണ്ട ആളുകളെയോ വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ വിലക്കിനുകീഴിലാക്കും.’'
    reason: alternative_reading
  - marker: c
    text: ‘അതിന്മേൽ കഷ്ടം വരുത്തുക’ എന്ന പ്രയോഗം ആഖാന്റെ പാപവും അത് ഇസ്രായേലിനുണ്ടാക്കിയ അനന്തരഫലങ്ങളും വിവരിക്കുന്ന യോശുവ 7:1, 25-ലെ പ്രമേയത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: എന്നാൽ നിങ്ങളോ
  rationale: וְרַק നൽകുന്ന വൈരുധ്യവും നിയന്ത്രണാത്മക ഊന്നലും സ്വതന്ത്ര സർവനാമമായ אַתֶּם നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: שִׁמְרוּ מִן־
  choice: …യിൽനിന്ന് അകന്നുനിൽക്കുക
  rationale: שמר עם מן ഇവിടെ ഒരു കാര്യത്തിൽനിന്ന് സ്വയം കാത്തുസൂക്ഷിക്കുക എന്ന മുന്നറിയിപ്പാണ്; ‘അകന്നുനിൽക്കുക’ അതിന്റെ പ്രായോഗികവും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു.
- source_word: הַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  rationale: ഏകവചനത്തിലുള്ള ഹീബ്രു സമൂഹവാചകത്തിന്റെ അവ്യക്തത നിലനിർത്തിക്കൊണ്ട്, ദൈവത്തിനുള്ള അപ്രത്യക്ഷമാക്കാനാവാത്ത സമർപ്പണവും ഈ സന്ദർഭത്തിലെ നാശവും പ്രകടമാക്കുന്നു; അതിനെ വെറും ‘ശപിക്കപ്പെട്ട വസ്തു’ എന്നു തെറ്റായി ചുരുക്കുന്നില്ല.
- source_word: פֶּן
  choice: അല്ലാത്തപക്ഷം
  rationale: മുന്നറിയിപ്പിന്റെ ഉദ്ദേശ്യവും അനന്തരഫലവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: תַּחֲרִימוּ
  choice: നിങ്ങൾതന്നെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീരും
  rationale: നിരോധിക്കപ്പെട്ടതിൽനിന്ന് എടുക്കുന്നതിലൂടെ അതേ ന്യായവിധിയുടെ നില തങ്ങൾക്കുതന്നെ വരുത്തിവയ്ക്കുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു; സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: അതിൽനിന്ന് എന്തെങ്കിലും എടുത്ത്
  rationale: ഒരു സമൂഹവാചക സമഗ്രതയിൽനിന്ന് ഒരു ഭാഗം എടുക്കുന്നതാണ് ഉദ്ദേശ്യം; ‘എന്തെങ്കിലും’ മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: ഇസ്രായേലിന്റെ പാളയത്തെയും നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാക്കുകയും
  rationale: שׂים + പൂരകത്തിന്റെ ഫലകാരണ അർഥം ‘ആക്കുക’ എന്നു നൽകുകയും חֵרֶם എന്ന പദത്തിന് വാക്യത്തിലുടനീളം സ്ഥിരമായ പരിഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: അതിന്മേൽ അനർഥം വരുത്തുകയും ചെയ്യും
  rationale: עכר എന്ന ക്രിയയുടെ ദുരിതം/വിപത്ത് വരുത്തുക എന്ന കാരണാർഥവും, പ്രത്യയം ഇസ്രായേൽപാളയത്തെ സൂചിപ്പിക്കുന്നതും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധയുദ്ധത്തിന്റെയും ന്യായവിധിയുടെയും സന്ദർഭത്തിലെ חֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  alternative: വിലക്കപ്പെട്ടത്; ശപിക്കപ്പെട്ട വസ്തു; നാശശപഥത്തിനുകീഴിലുള്ളത്
  rationale: ഈ സന്ദർഭത്തിൽ പദം ദൈവത്തിനായി മാറ്റിവെക്കപ്പെട്ടതും നാശത്തിലൂടെ അപ്രത്യക്ഷമാക്കേണ്ടതുമായതിനെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം പുരാതന സാങ്കേതികപദം നിർബന്ധിക്കാതെയും ‘ശപിക്കപ്പെട്ടത്’ എന്ന ഒറ്റ ആശയത്തിലേക്ക് ചുരുക്കാതെയും സമർപ്പണവും ന്യായവിധിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: תַּחֲרִימוּ എന്നതിലെ കർത്തൃപ്രയോഗവും ഫലസ്ഥിതിയും
  choice: നിങ്ങൾതന്നെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീരും
  alternative: നിങ്ങൾ നിങ്ങളെത്തന്നെ നാശത്തിനായി സമർപ്പിക്കും; നിങ്ങൾ വിലക്കിനുകീഴിലാകും
  rationale: ഹീബ്രു രൂപം പ്രവർത്തകമായിരിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ നിരോധിതമായതെടുത്താൽ അതേ חֵרֶם-സ്ഥിതി ഇസ്രായേല്യർ സ്വയം ഏറ്റുവാങ്ങുമെന്ന ഫലമാണ് മുന്നിൽ വരുന്നത്. മുഖ്യവാചകം ആ ഫലം വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധ്യമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: വ്യക്തിയുടെ പ്രവൃത്തി സമൂഹത്തിന്മേൽ വരുത്തുന്ന ന്യായവിധി
  choice: ഇസ്രായേലിന്റെ പാളയത്തെയും നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാക്കും
  alternative: ഇസ്രായേലിന്റെ പാളയത്തെ വിലക്കിനുകീഴിലാക്കും
  rationale: ഹീബ്രു വാക്യം വ്യക്തിപരമായ ലംഘനത്തിന്റെ സമൂഹപരമായ ഫലം ശക്തമായി പറയുന്നു. അതിനെ വ്യക്തിപരമായ കുറ്റബോധത്തിലേക്കോ ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തത്തിലേക്കോ ചുരുക്കാതെ അതേ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. חֵרֶם എന്ന സാങ്കേതിക ആശയം മുഖ്യവാചകത്തിൽ വിശദീകരണാത്മകമായി പരിഭാഷപ്പെടുത്തി; ആവർത്തനം ഹീബ്രുവിലെ ആശയബന്ധം നിലനിർത്താൻ ഉദ്ദേശപൂർവം സൂക്ഷിച്ചു. ദീർഘമായ ഹീബ്രു മുന്നറിയിപ്പ് വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, എന്നാൽ കാരണം-ഫലക്രമം നിലനിർത്തി.
