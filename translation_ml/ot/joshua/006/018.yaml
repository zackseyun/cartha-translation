revisions:
- from: എന്നാൽ നിങ്ങളോ, നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന്[a] അകന്നുനിൽക്കുക. അല്ലാത്തപക്ഷം, അതിൽനിന്ന് എന്തെങ്കിലും എടുത്ത് നിങ്ങൾതന്നെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീരും[b]; ഇസ്രായേലിന്റെ പാളയത്തെയും നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാക്കുകയും അതിന്മേൽ അനർഥം വരുത്തുകയും ചെയ്യും[c].
  to: എന്നാൽ നിങ്ങളോ, നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന്[a] അകന്നുനിൽക്കുക; അല്ലാത്തപക്ഷം, നിങ്ങൾതന്നെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീരുകയും[b], നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിൽനിന്ന് എന്തെങ്കിലും എടുക്കുകയും, ഇസ്രായേലിന്റെ പാളയത്തെ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതാക്കുകയും അതിന്മേൽ കഷ്ടം വരുത്തുകയും ചെയ്യും[c].
  rationale: The revision retains the draft’s sound collective rendering of חֵרֶם and its modern-standard Malayalam register. It replaces the causative participial sequence with coordinated future clauses, preserving the Hebrew warning’s syntax and leaving the precise relation of the consequent actions unforced. The cross-reference note is retained with a more direct Malayalam expression for עכר.
