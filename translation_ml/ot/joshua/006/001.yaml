  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: ml
  text: യെരീഹോ യിസ്രായേൽമക്കൾ[a] നിമിത്തം മുറുകെ അടച്ചിട്ടിരുന്നു[b]; ആരും പുറത്തേക്കു പോയില്ല, ആരും അകത്തേക്കു വന്നതുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യിസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്; ഇത് യിസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ സമൂഹനാമമാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ഒരേ ധാതുവിന്റെ രണ്ടു രൂപങ്ങൾ ചേർത്ത് യെരീഹോ പൂർണമായി അടച്ചിട്ടിരുന്നുവെന്ന ആശയം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: യെരീഹോ നഗരം
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി; ഇവിടെ സൂചിപ്പിക്കുന്നത് കോട്ടനഗരത്തെയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘നഗരം’ ചേർത്തു. വാക്യാരംഭത്തിലെ וְ എന്ന ആഖ്യാനബന്ധകത്തിന് പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർത്തിട്ടില്ല.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: ഭദ്രമായി അടച്ചുപൂട്ടിയിരുന്നു
  rationale: ഒരേ ധാതുവിന്റെ സജീവ-നിഷ്ക്രിയ രൂപങ്ങൾ ചേർന്ന പ്രയോഗം സമ്പൂർണവും ഉറപ്പുള്ളതുമായ അടച്ചിടലിനെ ഊന്നുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ തീവ്രത അറിയിക്കാൻ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: מִפְּנֵי
  choice: നിമിത്തം
  rationale: യിസ്രായേൽമക്കളുടെ സാന്നിധ്യമാണ് നഗരം അടച്ചിടാനുള്ള സാഹചര്യമോ കാരണമോ എന്നു സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ തുറന്നുപറയാത്ത ‘ഭയന്ന്’ എന്ന വികാരം ചേർത്തിട്ടില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ കുടുംബാധിഷ്ഠിതമായ സമൂഹനാമം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: ആരും പുറത്തേക്കു പോയില്ല, ആരും അകത്തേക്കു വന്നതുമില്ല
  rationale: നഗരത്തിലേക്കും പുറത്തേക്കുമുള്ള സഞ്ചാരം പൂർണമായി നിലച്ചിരുന്നുവെന്ന സമാന്തരപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
