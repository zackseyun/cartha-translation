  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. മൂലത്തിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിലൂടെ നിലനിർത്തുകയും തുറന്നുപറയാത്ത ഭയത്തിന്റെ ആശയം ഒഴിവാക്കുകയും ചെയ്തു.
