source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: ml
  text: 'ആ സമയത്ത് യോശുവ അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു[a]: “ഈ നഗരമായ യെരീഹോയെ എഴുന്നേറ്റ് വീണ്ടും പണിയുന്നവൻ യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവൻ! തന്റെ ആദ്യജാതന്റെ വിലകൊടുത്ത് അവൻ അതിന്റെ അടിത്തറയിടും; തന്റെ ഏറ്റവും ഇളയവന്റെ വിലകൊടുത്ത് അതിന്റെ കവാടങ്ങൾ സ്ഥാപിക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘അവരെ ശപഥത്തിന് വിധേയരാക്കി.’ എബ്രായ ക്രിയ കാരണാർഥത്തിലാണ്: യോശുവ ജനത്തെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘തന്റെ ആദ്യജാതനോടുകൂടെ/ആദ്യജാതനിലൂടെ ... തന്റെ ഏറ്റവും ഇളയവനോടുകൂടെ/ഏറ്റവും ഇളയവനിലൂടെ.’ ഇവിടെ അവരുടെ നഷ്ടത്തിന്റെ വിലകൊടുത്ത് എന്ന അർഥമാണ് സാധ്യത; എന്നാൽ അവർ എങ്ങനെ നഷ്ടപ്പെടുമെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു
  rationale: ശבע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മറ്റുള്ളവരെ സത്യം ചെയ്യിക്കുക അഥവാ ശപഥത്തിന് വിധേയരാക്കുക എന്ന കാരണാർഥം നൽകുന്നു. സന്ദർഭത്തിൽനിന്ന് കർമം പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: בָּעֵת הַהִיא
  choice: ആ സമയത്ത്
  rationale: കാലസൂചനയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: אָרוּר הָאִישׁ
  choice: മനുഷ്യൻ ... ശപിക്കപ്പെട്ടവൻ
  rationale: എബ്രായ ശാപപ്രഖ്യാപനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ഏകവചന പുല്ലിംഗം ഇവിടെ പൊതുവായി ആരെയും സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ മുമ്പാകെ
  rationale: ദൈവസന്നിധിയിലും ദൈവത്തിന്റെ ദൃഷ്ടിയിലും എന്ന ആശയം ചുരുക്കമായും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: יָקוּם וּבָנָה
  choice: വീണ്ടും പണിയാൻ ഇറങ്ങിപ്പുറപ്പെടുന്ന
  rationale: നശിപ്പിക്കപ്പെട്ട നഗരത്തെ പുനർനിർമിക്കാൻ ഒരാൾ മനഃപൂർവം ഉദ്യമിക്കുന്നതിന്റെ സംയുക്തബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: ഈ യെരീഹോ നഗരം
  rationale: ‘ഈ നഗരം, യെരീഹോ’ എന്ന സമാനാധികരണ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: തന്റെ ആദ്യജാതന്റെ വിലയായി ... തന്റെ ഇളയവന്റെ വിലയായി
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ കൃത്യമായ അർഥം ‘കൊണ്ട്/ൽ’ ആണെങ്കിലും ഇവിടെ നഷ്ടമോ വിലയോ സൂചിപ്പിക്കുന്ന സാധ്യത ശക്തമാണ്. മുഖ്യപാഠം ആ അർഥം നൽകുകയും അടിക്കുറിപ്പ് അക്ഷരാർഥവും വ്യാഖ്യാനപരിധിയും രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: יְיַסְּדֶנָּה
  choice: അതിന്റെ അടിത്തറയിടും
  rationale: יסד എന്ന ക്രിയയുടെ നിർമാണസന്ദർഭത്തിലെ മൂർത്തമായ അർഥം നൽകുന്നു.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: അതിന്റെ കവാടങ്ങൾ സ്ഥാപിക്കും
  rationale: നഗരനിർമാണസന്ദർഭത്തിൽ വാതിൽപ്പാളികളോടുകൂടിയ കവാടസംവിധാനം സ്ഥാപിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോശുവയുടെ പ്രഖ്യാപനത്തിന്റെ സ്വഭാവം
  choice: യഹോവയുടെ മുമ്പാകെയുള്ള ഗൗരവമേറിയ ശാപപ്രഖ്യാപനം
  alternative: യോശുവയുടെ വ്യക്തിപരമായ ആശംസയോ ദൈവികബലമില്ലാത്ത ഒരു പൗരനിയമമോ
  rationale: ‘യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവൻ’ എന്ന വാക്കുകൾ പ്രഖ്യാപനത്തിന്റെ ദൈവസന്നിധിയിലുള്ള ഗൗരവം വ്യക്തമാക്കുന്നു; അതിലപ്പുറം അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല.
- issue: ആദ്യജാതനും ഇളയവനും സംബന്ധിച്ച ശാപത്തിന്റെ അർഥം
  choice: പുനർനിർമാണത്തിന്റെ ആരംഭത്തോടും പൂർത്തീകരണത്തോടും ബന്ധപ്പെട്ട് മക്കളെ നഷ്ടപ്പെടുമെന്ന വിലയാർഥം
  alternative: മക്കളെ ബലിയർപ്പിക്കുമെന്ന നിർദ്ദിഷ്ട അവകാശവാദം, അല്ലെങ്കിൽ നിർമാണകാലത്തെ പൊതുവായ ദുർഭാഗ്യം മാത്രം
  rationale: സന്ദർഭവും സമാന്തരവാക്യങ്ങളും കടുത്ത കുടുംബനഷ്ടത്തെ സൂചിപ്പിക്കുന്നു; എന്നാൽ മരണം എങ്ങനെ സംഭവിക്കും എന്നോ ബാലബലി ഉദ്ദേശിക്കുന്നുവെന്നോ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പൊതുവായ ശൈലി. ‘യെരീഹോ,’ ‘യഹോവ,’ ‘ആദ്യജാതൻ,’ ‘കവാടങ്ങൾ’ എന്നിവ തിരുവെഴുത്തുവായനക്കാർക്ക് പരിചിതമായിരിക്കെ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന രൂപങ്ങളാണ്. ശാപസൂത്രത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ഉദ്ഗാരചിഹ്നം ഉപയോഗിച്ചു.
