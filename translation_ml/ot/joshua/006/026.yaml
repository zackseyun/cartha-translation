revisions:
- from: 'ആ സമയത്ത് യോശുവ അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു[a]: “ഈ യെരീഹോ നഗരം വീണ്ടും പണിയാൻ ഇറങ്ങിപ്പുറപ്പെടുന്ന മനുഷ്യൻ യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവൻ! തന്റെ ആദ്യജാതന്റെ വിലയായി അവൻ അതിന്റെ അടിത്തറയിടും; തന്റെ ഇളയവന്റെ വിലയായി അതിന്റെ കവാടങ്ങൾ സ്ഥാപിക്കും.”[b]'
  to: 'ആ സമയത്ത് യോശുവ അവരെക്കൊണ്ട് സത്യം ചെയ്യിച്ചു[a]: “ഈ നഗരമായ യെരീഹോയെ എഴുന്നേറ്റ് വീണ്ടും പണിയുന്നവൻ യഹോവയുടെ മുമ്പാകെ ശപിക്കപ്പെട്ടവൻ! തന്റെ ആദ്യജാതന്റെ വിലകൊടുത്ത് അവൻ അതിന്റെ അടിത്തറയിടും; തന്റെ ഏറ്റവും ഇളയവന്റെ വിലകൊടുത്ത് അതിന്റെ കവാടങ്ങൾ സ്ഥാപിക്കും.”[b]'
  rationale: The revision corrects the meaning of ‘youngest,’ streamlines the rebuilding clause while retaining the Hebrew ‘rise up and rebuild’ force, and updates the explanatory footnote to match the revised wording. It preserves the source text’s ambiguity about the precise manner of the children’s loss and does not imply child sacrifice.
