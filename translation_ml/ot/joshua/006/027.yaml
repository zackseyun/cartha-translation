source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: ml
  text: യഹ്‌വെ യോശുവയോടുകൂടെ ഉണ്ടായിരുന്നു; അവന്റെ പ്രശസ്തി[a] ദേശമെങ്ങും പരന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെക്കുറിച്ചുള്ള വാർത്ത” അല്ലെങ്കിൽ “അവനെക്കുറിച്ചുള്ള കേൾവി.” എബ്രായപദത്തിന് വിവരം, വാർത്ത, കേൾവി, പ്രശസ്തി എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ യോശുവയുടെ വളർന്നുവരുന്ന പ്രശസ്തിയെയാണ് അത് സാധ്യതയേറിയതായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: യഹ്‌വെ യോശുവയോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: היה + אֶת + വ്യക്തി എന്ന ഘടന ദൈവിക സാന്നിധ്യത്തെയും കൂടെയിരിപ്പിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം സ്വീകരിച്ചു.
- source_word: שָׁמְעוֹ
  choice: അവന്റെ കീർത്തി
  rationale: ഈ നാമത്തിന് വിവരം, വാർത്ത, കേൾവി, പ്രശസ്തി എന്നീ അർഥങ്ങൾ വരാം. യെരീഹോവിജയത്തിനു ശേഷമുള്ള സന്ദർഭത്തിൽ യോശുവയുടെ വ്യാപകമായ പ്രശസ്തി എന്ന അർഥമാണ് മുഖ്യവാചകത്തിൽ ഏറ്റവും സ്വാഭാവികം; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּכָל הָאָרֶץ
  choice: ദേശത്തെങ്ങും
  rationale: ഇവിടെ הָאָרֶץ ആഖ്യാനത്തിൽ പരാമർശിക്കുന്ന ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്, ഭൂമി മുഴുവനെയല്ല. 'ദേശത്തെങ്ങും' വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നതും ഒഴിവാക്കുന്നു.
- issue: שָׁמְעוֹ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അവന്റെ കീർത്തി
  alternative: അവനെക്കുറിച്ചുള്ള വാർത്ത / അവന്റെ കേൾവി
  rationale: സന്ദർഭം യോശുവയുടെ വളർന്നുവരുന്ന പ്രസിദ്ധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. 'ദേശത്തെങ്ങും പരന്നു' എന്ന സ്വാഭാവിക പ്രയോഗം എബ്രായത്തിലെ നിലാവസ്ഥയെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ ആശയവിവരം ചേർക്കുന്നില്ല.
