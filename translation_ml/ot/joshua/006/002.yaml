  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: ml
  text: 'യഹ്‌വെ യോശുവയോടു പറഞ്ഞു: “നോക്കൂ, യെരീഹോയെയും അതിന്റെ രാജാവിനെയും വീരപരാക്രമികളായ യോദ്ധാക്കളെയും[a] ഞാൻ നിന്റെ കയ്യിൽ തന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശക്തരായ യോദ്ധാക്കൾ” അല്ലെങ്കിൽ “ധീരരായ യോദ്ധാക്കൾ.” ഹീബ്രു പ്രയോഗത്തിൽ ശക്തിയുടെയും യുദ്ധവീര്യത്തിന്റെയും ആശയങ്ങൾ ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിന്റെ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പ്രകടമാക്കുന്നു; നിർബന്ധമില്ലാത്ത ഒരു പ്രത്യേക കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: רְאֵה
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... തന്നിരിക്കുന്നു
  rationale: യുദ്ധത്തിനു മുമ്പേ ദൈവം പൂർത്തിയായതായി പ്രഖ്യാപിക്കുന്ന ഹീബ്രു പൂർണ്ണക്രിയയുടെ ഉറപ്പും കാലപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- source_word: בְיָדְךָ
  choice: നിന്റെ കയ്യിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: יְרִיחוֹ
  choice: യെരീഹോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
- source_word: מַלְכָּהּ
  choice: അതിന്റെ രാജാവ്
  rationale: സ്ത്രീലിംഗത്തിലുള്ള നഗരത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രത്യയം മലയാളത്തിൽ അനാവശ്യ വ്യക്തിവൽക്കരണമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: വീരപരാക്രമികളായ യോദ്ധാക്കൾ
  rationale: ശക്തി, ധീരത, യുദ്ധവൈദഗ്ധ്യം എന്നീ സംയുക്ത ആശയങ്ങൾ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യുദ്ധത്തിനു മുമ്പുള്ള נָתַתִּי എന്ന പൂർണ്ണക്രിയയുടെ അർഥശക്തി
  choice: “ഞാൻ ... തന്നിരിക്കുന്നു” എന്ന പൂർത്തിയായ ദൈവിക പ്രഖ്യാപനം
  alternative: “ഞാൻ ... തരുന്നു” അല്ലെങ്കിൽ “ഞാൻ ... തരും”
  rationale: വിജയം ഉറപ്പായ ദൈവിക ദാനമായി പാഠം അവതരിപ്പിക്കുന്നതിനെ നിലനിർത്തുന്നു; അതേസമയം ഭാവികാലമാക്കി സംഘർഷം പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. “നിന്റെ കയ്യിൽ” എന്ന ഉറവിടഭാഷയിലെ രൂപകം മനസ്സിലാകുന്നതുകൊണ്ട് നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട “യോദ്ധാക്കൾ” എന്ന പദസമുച്ചയത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
