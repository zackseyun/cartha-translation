  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: ml
  text: ഏഴു പുരോഹിതന്മാർ ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ[a] പെട്ടകത്തിനു മുമ്പിൽ വഹിക്കണം. ഏഴാം ദിവസം നിങ്ങൾ നഗരം ഏഴു പ്രാവശ്യം ചുറ്റിനടക്കണം; പുരോഹിതന്മാർ കാഹളങ്ങൾ ഊതണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആട്ടുകൊമ്പുകളായ ഏഴു കാഹളങ്ങൾ” അഥവാ “ഏഴു ഷോഫാറുകൾ.” എബ്രായപദപ്രയോഗം കൊമ്പുകൊണ്ടുള്ള ഊത്തുവാദ്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അവ ആട്ടുകൊമ്പുകൊണ്ടുള്ളവയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: വഹിക്കണം
  rationale: נשא എന്ന ക്രിയയ്ക്ക് ‘വഹിക്കുക/ചുമക്കുക’ എന്ന അർഥമുണ്ട്. കല്പനാസന്ദർഭത്തിലെ നിർദേശഭാവം ‘വഹിക്കണം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങൾ
  rationale: שׁוֹפָר കൊമ്പുകൊണ്ടുള്ള ഊത്തുവാദ്യത്തെയും הַיּוֹבְלִים ഇവിടെ അതിന്റെ തരത്തെയും സൂചിപ്പിക്കുന്നു. ‘ആട്ടുകൊമ്പുകൊണ്ടുള്ള കാഹളങ്ങൾ’ വാദ്യത്തിന്റെ സ്വഭാവവും പ്രവർത്തനവും വ്യക്തമാക്കുന്നു; ‘ജൂബിലി കാഹളങ്ങൾ’ എന്നു പറയുന്നത് ഈ സന്ദർഭത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: לִפְנֵי הָאָרוֹן
  choice: പെട്ടകത്തിനു മുമ്പിൽ
  rationale: לִפְנֵי സ്ഥലപരമായി ‘മുമ്പിൽ’ എന്നാണ്. മൂലപാഠത്തിൽ ഈ വാക്യത്തിൽ ‘ഉടമ്പടിയുടെ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: תָּסֹבּוּ
  choice: നിങ്ങൾ ... ചുറ്റിനടക്കണം
  rationale: סבב എന്നത് ‘ചുറ്റുക/ചുറ്റിനടക്കുക’ എന്നാണ്. ഘോഷയാത്രാസദൃശമായ സൈനികസന്ദർഭത്തിൽ ‘ചുറ്റിനടക്കണം’ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: פְּעָמִים
  choice: പ്രാവശ്യം
  rationale: ആവർത്തിക്കുന്ന പ്രവൃത്തിയോടും സംഖ്യയോടും ചേർന്നപ്പോൾ ‘പ്രാവശ്യം’ എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ ഊതണം
  rationale: תקע + בַּשּׁוֹפָרוֹת കൊമ്പുവാദ്യം ഊതുക എന്ന പതിവുശൈലിയാണ്. വാദ്യത്തിന്റെ സ്വഭാവം മുമ്പേ പറഞ്ഞിരിക്കുന്നതിനാൽ ഇവിടെ ചുരുക്കി ‘കാഹളങ്ങൾ’ എന്നു ആവർത്തിക്കുന്നു.
