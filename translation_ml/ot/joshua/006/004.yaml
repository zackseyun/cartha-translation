translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ നിർദേശാത്മക yiqtol രൂപങ്ങൾ മലയാളത്തിൽ ‘-ണം’ ഉപയോഗിച്ച് അവതരിപ്പിച്ചു. ‘പെട്ടകം’ എന്നത് സന്ദർഭത്തിൽ പരിചിതമായ നിർദിഷ്ട പെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഉടമ്പടിയുടെ’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
