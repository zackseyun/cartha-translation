id: JOS.6.6
reference: Joshua 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: ml
  text: 'നൂന്റെ മകനായ യോശുവ പുരോഹിതന്മാരെ വിളിച്ച് അവരോടു പറഞ്ഞു: “ഉടമ്പടിയുടെ പെട്ടകം ചുമക്കുക; ഏഴു പുരോഹിതന്മാർ യഹ്‌വേയുടെ പെട്ടകത്തിനു മുമ്പിൽ ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ[a] ചുമക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആട്ടുകൊമ്പുകളുടെ ഏഴു കാഹളങ്ങൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: קרא എന്ന ക്രിയ ഇവിടെ പുരോഹിതന്മാരെ അഭിസംബോധന ചെയ്യാൻ യോശുവ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ച്’ സ്വാഭാവികവും പ്രസംഗസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: ഹീബ്രായ പുത്രബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസംബന്ധമായ ഈ സന്ദർഭത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണ മലയാളപരിഭാഷ.
- source_word: שְׂאוּ
  choice: ചുമക്കുക
  rationale: נשׂא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; പെട്ടകം വഹിച്ചുകൊണ്ടുപോകുന്നതാണ് സന്ദർഭം, അതിനാൽ ‘ചുമക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: നിർമാണബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മനസ്സിലാക്കാൻ എളുപ്പവുമായ രൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: ഏഴു പുരോഹിതന്മാർ … ചുമക്കട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള അപൂർണക്രിയ ഇവിടെ തുടർന്നുള്ള നിർദേശം പ്രകടിപ്പിക്കുന്നു; ‘ചുമക്കട്ടെ’ അതിന്റെ നിർദേശാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: ആട്ടുകൊമ്പുകൊണ്ടുള്ള ഏഴു കാഹളങ്ങൾ
  rationale: שׁוֹפָר കൊമ്പുകൊണ്ടുള്ള കാഹളത്തെയും יוֹבְלִים ഇവിടെ ആട്ടുകൊമ്പുകളെയും സൂചിപ്പിക്കുന്നു; തിരഞ്ഞെടുക്കപ്പെട്ട രൂപം ഉപകരണത്തിന്റെ സ്വഭാവം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഘോഷയാത്രയിലെ സ്ഥാനബന്ധം വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള മലയാളപ്രയോഗം.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ഇങ്ങനെ ഉടമ്പടിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായ ആജ്ഞയുടെയും തുടർനിർദേശത്തിന്റെയും വ്യത്യാസം ‘ചുമക്കുക’ / ‘ചുമക്കട്ടെ’ എന്ന രൂപങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
