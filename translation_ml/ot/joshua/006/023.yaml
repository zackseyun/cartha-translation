source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: ml
  text: അപ്പോൾ ചാരന്മാരായ ആ യുവാക്കൾ അകത്തു ചെന്ന് രാഹാബിനെയും അവളുടെ അപ്പനെയും അമ്മയെയും സഹോദരന്മാരെയും അവളോടു ചേർന്ന എല്ലാവരെയും[a] പുറത്തുകൊണ്ടുവന്നു. അവളുടെ എല്ലാ കുടുംബഗണങ്ങളെയും[b] അവർ പുറത്തുകൊണ്ടുവന്ന് ഇസ്രായേലിന്റെ പാളയത്തിനു പുറത്തു പാർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾക്കുള്ള സകലത്തെയും.’ എബ്രായപ്രയോഗം വ്യക്തികൾക്കപ്പുറം അവളുടെ വകയായിരുന്ന വസ്തുക്കളെയും ഉൾക്കൊള്ളാവുന്നതാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ പ്രധാനമായും അവളുടെ വീട്ടുകാരെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവളുടെ എല്ലാ വംശഗണങ്ങളെയും’ അല്ലെങ്കിൽ ‘അവളുടെ ബന്ധുക്കളെയെല്ലാം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: യുവാക്കൾ
  rationale: נַעַר ഇവിടെ രണ്ടു ചാരന്മാരെയും യുവപുരുഷന്മാരായി സൂചിപ്പിക്കുന്നു; ‘യുവാക്കൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הַמְרַגְּלִים
  choice: ചാരന്മാരായ
  rationale: רגל എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം യുവാക്കൾ ആരെന്ന് തിരിച്ചറിയിക്കുന്നു; ‘ചാരന്മാരായ’ എന്ന വിശേഷണപ്രയോഗം മൂലപാഠത്തിന്റെ സംക്ഷിപ്ത ഘടന നിലനിർത്തുന്നു.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: പുറത്തുകൊണ്ടുവന്നു
  rationale: יצא എന്നതിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്നാണ്; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പരിഭാഷ നൽകി ആവർത്തനം നിലനിർത്തി.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: അവളോടു ചേർന്ന എല്ലാവരെയും
  rationale: പദപ്രയോഗം വിശാലമായി ‘അവൾക്കുള്ളതെല്ലാം/അവളുടേതായതെല്ലാം’ എന്നാകാം. രക്ഷിക്കപ്പെട്ടവരെപ്പറ്റിയുള്ള സന്ദർഭത്തിൽ വ്യക്തികളാണ് പ്രധാന സൂചന; എങ്കിലും വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: അവളുടെ എല്ലാ കുടുംബഗണങ്ങളെയും
  rationale: מִשְׁפָּחָה കുടുംബത്തെയോ വിപുലമായ ബന്ധുഗണത്തെയോ വംശഗണത്തെയോ സൂചിപ്പിക്കാം. ‘കുടുംബഗണങ്ങൾ’ അടുത്ത കുടുംബത്തിനു പുറത്തുള്ള വിശാല കൂട്ടങ്ങളെ സൂചിപ്പിക്കുകയും ബഹുവചനരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּנִּיחוּם
  choice: പാർപ്പിച്ചു
  rationale: נוח എന്നതിന്റെ ഹിഫീൽ ഇവിടെ അവരെ ഒരു സ്ഥലത്ത് നിർത്തുകയോ പാർപ്പിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; ‘പാർപ്പിച്ചു’ മനഃപൂർവമായ സ്ഥാനനിർണ്ണയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പാളയത്തിനു പുറത്തു
  rationale: സ്ഥലസൂചന നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; അവർ അവിടെ പാർപ്പിക്കപ്പെട്ടതിന്റെ കാരണം പരിഭാഷയിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: രാഹാബിനെയും അവളോടു ചേർന്നവരെയും ഇസ്രായേൽപാളയത്തിനു പുറത്തു പാർപ്പിച്ചതിന്റെ കാരണം
  choice: കാരണം വിശദീകരിക്കാതെ സ്ഥലസൂചന മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ആചാരപരമായ വേർതിരിവ്, സംരക്ഷണപരമായ കാവൽ, അല്ലെങ്കിൽ ഇസ്രായേലിൽ ഉൾപ്പെടുത്തുന്നതിനു മുമ്പുള്ള താൽക്കാലിക പാർപ്പിക്കൽ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായപാഠം അവർ പാളയത്തിനു പുറത്തു പാർപ്പിക്കപ്പെട്ടു എന്നു മാത്രമാണ് പറയുന്നത്; കാരണം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ കഥാപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ’, ‘അമ്മ’ എന്നീ സാധാരണ ബന്ധപദങ്ങൾ വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; ‘കുടുംബഗണങ്ങൾ’ എന്ന പദം വിപുലമായ ബന്ധുകൂട്ടങ്ങളുടെ അർത്ഥവും എബ്രായ ബഹുവചനവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ശരിയായ പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
