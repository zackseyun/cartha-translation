  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: ml
  text: 'ഏഴാം പ്രാവശ്യം പുരോഹിതന്മാർ കാഹളങ്ങൾ[a] ഊതിയപ്പോൾ, യോശുവ ജനത്തോടു പറഞ്ഞു: “ആർപ്പുവിളിക്കൂ, കാരണം യാഹ്‌വെ നഗരം നിങ്ങൾക്കു തന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ശോഫാർ എന്ന കൊമ്പുകൊണ്ടുള്ള ഊതിവാദ്യത്തിന്റെ ബഹുവചനമാണ്; ‘കൊമ്പുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: ഏഴാം പ്രാവശ്യം ... ഊതിയപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും ഏഴാമത്തെ ആവർത്തനവും സ്വാഭാവിക മലയാള ഉപവാക്യത്തിലൂടെ അറിയിക്കുന്നു; וַיְהִי എന്നത് പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മലയാളത്തിൽ അനാവശ്യമായ ഭാരമുണ്ടാക്കും.
- source_word: תָּקְעוּ ... בַּשּׁוֹפָרוֹת
  choice: കാഹളങ്ങൾ ഊതി
  rationale: תקע എന്ന ക്രിയയുടെ ഊതുക എന്ന പ്രവർത്തിയും שׁוֹפָרוֹת എന്ന ഊതിവാദ്യവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָרִיעוּ
  choice: ആർപ്പുവിളിക്കൂ
  rationale: യുദ്ധഘോഷമെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ, ഉച്ചത്തിലുള്ള കൂട്ടവിളി എന്ന കല്പന സ്വാഭാവികവും ശക്തവുമായി നൽകുന്നു.
- source_word: כִּי נָתַן
  choice: തന്നിരിക്കുന്നു
  rationale: കല്പനയ്ക്കുള്ള കാരണം പ്രകടമാക്കുകയും, നഗരം ഇതിനകം നൽകിയതായി ഉറപ്പോടെ പറയുന്ന എബ്രായ പൂർണ്ണക്രിയയുടെ ദൃഷ്ടികോണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: സന്ദർഭത്തിൽ യെരീഹോയെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നഗരത്തെ എബ്രായ വാചകത്തിന്റെ പൊതുപദപ്രയോഗത്തോടൊപ്പം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം മറയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കുന്നില്ല.
- issue: נָתַן എന്ന പൂർണ്ണക്രിയയുടെ സമയ-ഭാവം
  choice: നഗരം നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  alternative: നഗരം നിങ്ങൾക്കു തരും
  rationale: നഗരം ഇനിയും കൈവശമായിട്ടില്ലെങ്കിലും ദൈവത്തിന്റെ നൽകൽ പൂർത്തിയായ കാര്യമായി യോശുവ പ്രഖ്യാപിക്കുന്ന മൂലപാഠത്തിലെ ഉറപ്പും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘ആർപ്പുവിളിക്കൂ’ കല്പനയുടെ ശക്തി നിലനിർത്തുന്നു; അതേസമയം ‘യുദ്ധഘോഷം മുഴക്കൂ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി. നേരിട്ടുള്ള പ്രസംഗത്തിൽ സ്വാഭാവിക ഊന്നലിനായി ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു.
