id: JOS.6.7
reference: Joshua 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: ml
  text: 'അവർ ജനത്തോടു പറഞ്ഞു: “മുന്നോട്ടു നീങ്ങി നഗരത്തെ ചുറ്റിനടക്കുവിൻ; ആയുധധാരികൾ[a] യഹ്‌വെയുടെ പെട്ടകത്തിനു മുമ്പായി നീങ്ങട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുന്നണിപ്പട”; അതായത്, പെട്ടകത്തിനു മുമ്പായി നീങ്ങുന്ന ആയുധധാരികൾ.
    reason: חָלוּץ ആയുധസജ്ജരായവരെയും സന്ദർഭത്തിൽ മുന്നണിയായി നീങ്ങുന്ന സേനാവിഭാഗത്തെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: അടുത്ത സംഭവത്തെ തുടർച്ചയായി അവതരിപ്പിക്കുന്ന ബഹുവചന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; കർത്താവ് ആരെന്നത് വാക്യത്തിൽ വ്യക്തമാക്കാതെ എബ്രായത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: אֶל־הָעָם
  choice: ജനത്തോട്
  rationale: עָם എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സൈന്യം എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: עִבְרוּ
  choice: മുന്നോട്ടു നീങ്ങി
  rationale: ഇവിടെ ഒരു അതിർത്തിയോ നദിയോ കടക്കുന്നതല്ല, ഘോഷയാത്രയായി മുന്നോട്ടു പോകുന്നതാണ് സന്ദർഭം; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ചലനനിർദേശം ഉപയോഗിക്കുന്നു.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: നഗരത്തെ ചുറ്റിനടക്കുവിൻ
  rationale: סבב സൂചിപ്പിക്കുന്ന നഗരത്തിനു ചുറ്റുമുള്ള സഞ്ചാരം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ക്രിയയിൽ ഇല്ലാത്ത അധിക സൈനികഭാവം ചേർക്കുന്നില്ല.
- source_word: וְהֶחָלוּץ
  choice: ആയുധധാരികൾ
  rationale: യുദ്ധത്തിനായി ആയുധമണിഞ്ഞ സേനാവിഭാഗത്തെയാണ് חָלוּץ സൂചിപ്പിക്കുന്നത്. അതിന്റെ മുന്നണിപ്പട എന്ന പ്രവർത്തനപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יַעֲבֹר
  choice: നീങ്ങട്ടെ
  rationale: നിർദേശാത്മകമായ ഏകവചന ക്രിയയെ കൂട്ടമായ സേനാവിഭാഗത്തോടു ചേർന്ന സ്വാഭാവിക മലയാള ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകത്തിനു മുമ്പായി
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥാനസൂചനയും אֲרוֹן എന്ന പെട്ടകവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ യ്ഹ്വ്ഹിനെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ‘Yahweh’ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ ലിപ്യന്തരിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം സംബന്ധിച്ച പരിധി അംഗീകരിച്ചുകൊണ്ടാണ് ‘യഹ്‌വെ’ ഉപയോഗിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ ആജ്ഞാഭാഷ ഉപയോഗിച്ചു. ‘ചുറ്റിനടക്കുവിൻ’ എന്ന രൂപം ബഹുവചന നിർദേശം വ്യക്തമാക്കുന്നു; ‘നീങ്ങട്ടെ’ സേനാവിഭാഗത്തെ ഏകകമായി കാണുന്ന എബ്രായ ഏകവചനത്തോട് യോജിക്കുന്നു.
