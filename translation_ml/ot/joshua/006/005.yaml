translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യുദ്ധസന്ദർഭവും אִישׁ എന്ന ഉറവിടരൂപവും കണക്കിലെടുത്ത് ‘ഓരോ പുരുഷനും’ നിലനിർത്തി. പ്രവചനാത്മകമായ ക്രിയാക്രമത്തിന് മലയാളത്തിലെ ഭാവികാലം ഉപയോഗിച്ചു; സ്രോതസ്സിലെ സ്ഥലദൃശ്യത്തിലെ അസാധാരണത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
