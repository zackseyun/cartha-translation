source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְשֹׁ֣ךְ בְּ/קֶ֣רֶן הַ/יּוֹבֵ֗ל ב/שמע/כם אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר יָרִ֥יעוּ כָל הָ/עָ֖ם תְּרוּעָ֣ה גְדוֹלָ֑ה וְ/נָ֨פְלָ֜ה חוֹמַ֤ת הָ/עִיר֙ תַּחְתֶּ֔י/הָ וְ/עָל֥וּ הָ/עָ֖ם אִ֥ישׁ נֶגְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: ml
  text: ആട്ടുകൊമ്പിന്റെ നാദം നീട്ടിമുഴക്കുമ്പോൾ[a], കാഹളത്തിന്റെ ശബ്ദം നിങ്ങൾ കേൾക്കുമ്പോൾ, ജനമെല്ലാം ഉച്ചത്തിൽ വലിയൊരു ആർപ്പുവിളി മുഴക്കണം. അപ്പോൾ നഗരമതിൽ അതിന്റെ ചുവട്ടിലേക്കുതന്നെ ഇടിഞ്ഞുവീഴും[b]; ജനമെല്ലാം കയറിച്ചെല്ലും—ഓരോ പുരുഷനും നേരെ തന്റെ മുന്നിലേക്ക്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആട്ടുകൊമ്പിൽ ദീർഘനാദം മുഴക്കുമ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘നഗരമതിൽ അതിന്റെ കീഴിലേക്കുതന്നെ വീഴും’ എന്നാണ്; മതിൽ നേരെ താഴേക്ക് ഇടിഞ്ഞുവീഴും എന്നായിരിക്കാം അർത്ഥം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഓരോരുത്തനും നേരെ മുന്നോട്ട്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: നാദം നീട്ടിമുഴക്കുമ്പോൾ
  rationale: ഈ പ്രയോഗത്തിൽ משׁך കൊമ്പിന്റെ നാദം ദീർഘിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ‘നീട്ടുക’ എന്ന മൂലദൃശ്യവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: ആട്ടുകൊമ്പ്
  rationale: ഇവിടെ יוֹבֵל സാങ്കേതികമായ ‘യൂബിലി’യെക്കാൾ ഊതുന്ന വാദ്യമായ ആട്ടുകൊമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: קוֹל הַשּׁוֹפָר
  choice: കാഹളത്തിന്റെ ശബ്ദം
  rationale: שׁוֹפָר കൊമ്പുകൊണ്ടുള്ള കാഹളമാണ്; ‘കാഹളം’ സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പരിഭാഷയാണ്, കൂടാതെ קוֹל എന്ന ‘ശബ്ദം’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: ഉച്ചത്തിൽ വലിയൊരു ആർപ്പുവിളി മുഴക്കണം
  rationale: ക്രിയയും സമാനാർത്ഥ നാമവും ചേർന്നിരിക്കുന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കാഹളനാദത്തിൽനിന്ന് ജനത്തിന്റെ ആർപ്പുവിളിയെ വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחְתֶּיהָ
  choice: അതിന്റെ ചുവട്ടിലേക്കുതന്നെ
  rationale: മതിൽ സ്വന്തം അടിയിലേക്കു നേരെ തകർന്നുവീഴുന്ന ഉജ്ജ്വലമായ എബ്രായ ദൃശ്യം നിലനിർത്തുന്നു; ‘അതിന്റെ സ്ഥാനത്ത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: וְעָלוּ
  choice: കയറിച്ചെല്ലും
  rationale: עלה എന്നതിന്റെ അടിസ്ഥാനമായ ‘കയറുക/മേലോട്ടു പോകുക’ എന്ന അർത്ഥവും നഗരം ആക്രമിച്ചു പ്രവേശിക്കുന്ന സന്ദർഭവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്ത് നൽകുന്നു.
- source_word: אִישׁ נֶגְדּוֹ
  choice: ഓരോ പുരുഷനും തനിക്കു നേരെയുള്ള ദിശയിൽത്തന്നെ
  rationale: אִישׁ എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ വിതരണാർത്ഥവും, ഓരോരുത്തനും സ്വന്തം മുന്നിലുള്ള ഭാഗത്തുകൂടി നേരെ നീങ്ങുന്നു എന്ന സ്ഥലസൂചനയും സംരക്ഷിക്കുന്നു.
