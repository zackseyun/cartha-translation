  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: ml
  text: അവർ നഗരത്തിലുണ്ടായിരുന്ന സകലത്തെയും—പുരുഷൻ മുതൽ സ്ത്രീ വരെയും, ബാലൻ മുതൽ വൃദ്ധൻ വരെയും, കാള, ചെമ്മരിയാട്, കഴുത എന്നിവയെയും—വാളിന്റെ വായ്ത്തലയാൽ നിശ്ശേഷ നാശത്തിന് അർപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പൂർണമായി നശിപ്പിച്ചു’ അഥവാ ‘വിലക്കിനുകീഴിലാക്കി.’ ഹീബ്രായ ക്രിയയായ חרם, എന്തിനെയെങ്കിലും വിലക്കിനുകീഴിൽ തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള חרם സാധാരണ നശിപ്പിക്കൽ മാത്രമല്ല, വിലക്കിനുകീഴിൽ തിരിച്ചെടുക്കാനാവാത്തവിധം നാശത്തിനായി വേർതിരിക്കുന്ന സാങ്കേതിക ആശയവും വഹിക്കുന്നു. ‘നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു’ എന്നത് ആ ആശയം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: നഗരത്തിലുണ്ടായിരുന്ന സകലത്തെയും
  rationale: തുടർന്ന് വിശദീകരിക്കുന്ന നഗരവാസികളെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രപ്രയോഗത്തിന്റെ പൂർണത സംരക്ഷിക്കുന്നു.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: പുരുഷൻമുതൽ സ്ത്രീവരെയും
  rationale: ഹീബ്രായ ഏകവചന വിതരണഘടനയും ഇരുലിംഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന പരിധിപ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: ബാലൻമുതൽ വൃദ്ധൻവരെയും
  rationale: പ്രായപരിധിയുടെ മുഴുവൻ വ്യാപ്തിയും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പരിധിപ്രയോഗം; נער എന്ന പദത്തിന്റെ ഇവിടെ പ്രസക്തമായ ചെറുപ്പക്കാരൻ/ബാലൻ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: കാള, ചെമ്മരിയാട്, കഴുത എന്നിവയെയും
  rationale: മനുഷ്യരിൽനിന്ന് കന്നുകാലികളിലേക്കും വ്യാപിക്കുന്ന ഉൾക്കൊള്ളൽ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; שֶׂה ഇവിടെ കൂട്ടമായി ചെമ്മരിയാടുകളെയോ കോലാടുകളെയോ സൂചിപ്പിക്കാം.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: ‘വാളിന്റെ വായ്’ എന്ന ഹീബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ആയുധത്തിന്റെ മൂർച്ചയാൽ കൊല്ലുക എന്ന ഭാഷാശൈലി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യുദ്ധന്യായവിധിയുടെ പശ്ചാത്തലത്തിലുള്ള חרם ഭാഷയുടെ പരിഭാഷ
  choice: നിശ്ശേഷനാശത്തിന് അർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; വിലക്കിനുകീഴിലാക്കി
  rationale: ക്രിയ പൊതുവായ നശിപ്പിക്കൽ മാത്രമല്ല, തിരിച്ചെടുക്കാനാവാത്ത നാശത്തിനായി സമർപ്പിക്കൽ എന്ന സാങ്കേതിക അർഥവും സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം സംഭവത്തിന്റെ കഠിനത മൃദൂകരിക്കാതെയും അതിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെയും ഈ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ സമഗ്രതയും സാങ്കേതിക חרם ആശയവും വാളിന്റെ ‘വായ്’ എന്ന ദൃശ്യരൂപവും സംരക്ഷിച്ചു; നീണ്ട പട്ടിക വായിക്കാൻ സൗകര്യമായി ഇടവരകൾ ഉപയോഗിച്ചു.
