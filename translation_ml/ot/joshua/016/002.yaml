base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി ബേഥേലിൽനിന്ന് ലൂസിലേക്കു പുറപ്പെട്ട് അത്താരോത്തിലെ അർക്ക്യരുടെ[a] അതിർത്തിയിലേക്കു കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അർഖ്യരുടെ”; എബ്രായ ജനനാമമായ הָאַרְכִּיയുടെ മറ്റൊരു ലിപ്യന്തരണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: പിന്നെ അതിർത്തി ... പുറപ്പെട്ട്
  rationale: മുൻവാക്യത്തിൽ വിവരിക്കുന്ന അതിർത്തിയാണ് ഇവിടെ സൂചിതമായ കർത്താവ്; മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി ‘അതിർത്തി’ ചേർത്തു. വാവ് ഘടിപ്പിച്ച ക്രിയ അതിർത്തിവിവരണത്തിലെ തുടർച്ചയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: מִבֵּית אֵל
  choice: ബേഥേലിൽനിന്ന്
  rationale: സ്ഥലനാമമായ בֵּית־אֵל എന്നതിന്റെ മലയാളത്തിലെ വ്യക്തവും പതിവുസഹജവുമായ ലിപ്യന്തരണം.
- source_word: לוּזָה
  choice: ലൂസിലേക്കു
  rationale: അവസാനത്തിലെ ദിശാസൂചകമായ ה ലൂസിന്റെ ദിശയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘ലൂസിലേക്കു’ സ്വാഭാവികമാണ്.
- source_word: וְעָבַר
  choice: കടന്നുപോയി
  rationale: അതിർത്തിരേഖയുടെ തുടർന്നുള്ള ഗതി വിവരിക്കുന്ന עבר എന്ന ക്രിയയെ ഭൂമിശാസ്ത്രപരമായ യാത്രാവിവരണത്തിന് യോജിച്ച രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: אֶל גְּבוּל הָאַרְכִּי
  choice: അർക്ക്യരുടെ അതിർത്തിയിലേക്കു
  rationale: גְּבוּל അതിർത്തിയെയും הָאַרְכִּי അർക്കി വംശക്കാരനെയോ ആ ജനവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന ജനനാമം മലയാളത്തിൽ സമൂഹവാചകമായ ‘അർക്ക്യർ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: עֲטָרוֹת
  choice: അതാരോത്തിൽ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; വാക്യഘടനയിൽ അത് അർക്ക്യരുടെ അതിർത്തി കടന്നുപോകുന്ന സ്ഥലം എന്നു അവതരിപ്പിച്ചു.
