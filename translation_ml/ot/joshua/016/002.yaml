translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർത്താവായ ‘അതിർത്തി’ വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു; സ്ഥലനാമങ്ങൾ മലയാളവായനയ്ക്ക് സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
