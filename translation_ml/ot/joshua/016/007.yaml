translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. ഇംഗ്ലീഷിനെ പദാനുപദമായി പിന്തുടരാതെ എബ്രായ അതിർത്തിസൂത്രവാക്യത്തിന്റെ അർഥം മുൻനിർത്തി; വ്യക്തതയ്ക്കായി സൂചിതമായ കർത്താവായ ‘അതിർ’ ചേർത്തു. സ്ഥലനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ പ്രചാരത്തിലുള്ള മലയാളലിപിയിൽ നൽകി.
