base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി യാനോഹയിൽനിന്ന് അതാരോത്തിലേക്കും നാരാത്തിലേക്കും[a] ഇറങ്ങി, യെരീഹോയിൽ എത്തി[b], യോർദ്ദാനിൽ അവസാനിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘നാരാത്തിലേക്കു’; ഈ സ്ഥലനാമം യോശുവ 16:8-ലെ ‘നാര’ എന്ന പേരിൽനിന്ന് വ്യത്യസ്തമായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘യെരീഹോയെ തൊട്ടു’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ഒരു അതിർത്തിരേഖ ഒരു സ്ഥലത്ത് എത്തുന്നതോ അതിനെ തൊടുന്നതോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ പദാനുപദമായി: ‘യോർദ്ദാനിലേക്കു പുറപ്പെട്ടു’; എബ്രായ അതിർത്തിവിവരണശൈലി രേഖയുടെ ഗതിയോ അന്തിമസ്ഥാനമോ വിവരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: പിന്നെ അതിർ … ഇറങ്ങി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ יָרַד ഭൂപ്രകൃതിയിലോ ദിശയിലോ താഴേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അതിർത്തിരേഖയാണ് കർത്താവെന്ന് വ്യക്തമാക്കാൻ ‘അതിർ’ ചേർത്തു; തുടർച്ചാസ്വഭാവമുള്ള וְ എന്ന ഘടകം ‘പിന്നെ’ എന്നു നൽകി.
- source_word: מִיָּנוֹחָה
  choice: യാനോഹയിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി, സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עֲטָרוֹת
  choice: അതാരോത്തിലേക്ക്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. വാക്യത്തിലെ അതിർത്തിയുടെ ഗതി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘-ലേക്ക്’ ചേർത്തു.
- source_word: וְנַעֲרָתָה
  choice: നാരയിലേക്കും
  rationale: മസോറെറ്റിക് സ്വരചിഹ്നങ്ങളുള്ള രൂപം ‘നാര’ എന്ന സ്ഥലനാമത്തെ പിന്തുണയ്ക്കുന്നു; അവസാനത്തെ ദിശാസൂചക ה മലയാളത്തിൽ ‘-ലേക്ക്’ എന്നു പ്രതിഫലിപ്പിച്ചു.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: യെരീഹോയിൽ എത്തി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ פגע ഒരു അതിർത്തിരേഖ ഒരു സ്ഥലത്തെ തൊടുന്നതോ അവിടെ എത്തിച്ചേരുന്നതോ സൂചിപ്പിക്കാം. ‘എത്തി’ ആ സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും കൃത്യമായ ഭൂമിശാസ്ത്രബന്ധം അതിരുകടന്ന് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽ അവസാനിച്ചു
  rationale: അതിർത്തിസൂത്രവാക്യങ്ങളിൽ יצא രേഖയുടെ പുറപ്പെടൽസ്ഥാനത്തെയോ അന്തിമസ്ഥാനത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘യോർദ്ദാനിൽ അവസാനിച്ചു’ എന്നത് അതിർത്തിയുടെ ലക്ഷ്യാന്ത്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പതിവ് മലയാള സ്ഥലനാമരൂപം ഉപയോഗിച്ചു; സന്ദർഭത്തിൽ അത് നദിയാണെന്നത് വ്യക്തമായതിനാൽ ‘നദി’ ചേർക്കേണ്ടതില്ല.
