id: JOS.16.5
reference: Joshua 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֛י גְּב֥וּל בְּנֵֽי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֞י גְּב֤וּל נַחֲלָתָ/ם֙ מִזְרָ֔חָ/ה עַטְר֣וֹת אַדָּ֔ר עַד בֵּ֥ית חוֹרֹ֖ן עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: ml
  text: 'എഫ്രയീമിന്റെ മക്കളുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള പ്രദേശം ഇപ്രകാരമായിരുന്നു: അവരുടെ അവകാശഭൂമിയുടെ കിഴക്കുഭാഗത്തെ അതിർത്തി അതാരോത്ത്-അദ്ദാർ[a] മുതൽ മുകളിലെ ബേത്ത്-ഹോരോൻവരെ ആയിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ അവകാശഭൂമിയുടെ അതിർത്തി കിഴക്കോട്ട് അതാരോത്ത്-അദ്ദാർ ആയിരുന്നു.” എബ്രായവാക്യഘടന അല്പം വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്താമെങ്കിലും ഭൂമിശാസ്ത്രപരമായ അർഥം മാറുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: പ്രദേശം / അതിർത്തി
  rationale: 'ഒരേ എബ്രായപദം സന്ദർഭമനുസരിച്ച് രണ്ടുവിധത്തിൽ നൽകി: ആദ്യപ്രയോഗം എഫ്രയീം ഗോത്രത്തിന്റെ മൊത്തം ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രദേശം’; രണ്ടാമത്തേത് സ്ഥലനാമങ്ങളാൽ നിർവചിക്കപ്പെടുന്ന അതിരിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിർത്തി’.'
- source_word: בְּנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ വംശാവലിസംബന്ധിയായ പുത്രത്വപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; ഇവിടെ അത് എഫ്രയീമിന്റെ സന്തതികളായ ഗോത്രജനത്തെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ ഗോത്രങ്ങൾക്കനുസരിച്ച്
  rationale: യോശുവയിലെ ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനകത്തെ വംശകുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ ‘ഗോത്രങ്ങൾ’ ഈ സാമൂഹിക ഘടന വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: נַחֲלָתָם
  choice: അവരുടെ അവകാശഭൂമി
  rationale: נַחֲלָה ഇവിടെ അവകാശമായി ലഭിച്ച ഭൂമിയാണ്; ‘അവകാശഭൂമി’ ഭൂമിയെന്ന ആശയവും പാരമ്പര്യാവകാശത്തിന്റെ ഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: מִזְרָחָה
  choice: കിഴക്കുഭാഗത്തെ
  rationale: ദിശാസൂചക രൂപം അതിർത്തിയുടെ കിഴക്കൻ ഭാഗമോ ആരംഭബിന്ദുവോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഭൂമിശാസ്ത്രപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: עַטְרוֹת אַדָּר
  choice: അതാരോത്ത്-അദ്ദാർ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; സംയുക്തനാമമാണെന്ന് കാണിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: עַד
  choice: മുതൽ … വരെ
  rationale: അതിർത്തിവിവരണത്തിൽ വ്യാപ്തിയുടെ രണ്ട് അറ്റങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്ന ഘടന.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: മുകളിലെ ബേത്ത്-ഹോരോൻ
  rationale: עֶלְיוֹן ഈ സ്ഥലത്തെ താഴത്തെ ബേത്ത്-ഹോരോനിൽനിന്ന് വേർതിരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണക്രമം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച גְּבוּל എന്ന പദത്തിന്റെ സന്ദർഭവ്യത്യാസം ‘പ്രദേശം/അതിർത്തി’ എന്നിങ്ങനെ പ്രകടമാക്കി. എല്ലാ സ്ഥലനാമങ്ങളും മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
