source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: ml
  text: 'യോസേഫിന്റെ പുത്രന്മാർക്കുള്ള നറുക്ക് വന്നു[a]: യെരീഹോയ്ക്കരികിലെ യോർദാൻമുതൽ, കിഴക്കുള്ള യെരീഹോയിലെ വെള്ളങ്ങളിലേക്കു, യെരീഹോയിൽനിന്ന് ബേഥേൽ മലനാട്ടിലേക്കു കയറുന്ന മരുഭൂമിയിലൂടെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോസേഫിന്റെ പുത്രന്മാർക്കായി നറുക്ക് വീണു.” ഹീബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ “പുറത്തുവന്നു” എന്നാണ്; ഭൂവിഭജനസന്ദർഭത്തിൽ “നറുക്ക് വീണു” എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: നറുക്ക് ഇങ്ങനെ വന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ‘പുറത്തുവന്നു/വന്നു’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തിക്കൊണ്ട്, ഭൂവിഭജനത്തിനായുള്ള നറുക്കിന്റെ ഫലമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതിർത്തിരേഖയുടെ തുടർന്നുള്ള വിവരണത്തിലേക്ക് ‘ഇങ്ങനെ’ സുഗമമായി നയിക്കുന്നു.
- source_word: לִבְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാർക്കുള്ള
  rationale: ഹീബ്രായ ബന്ധുത്വപ്രയോഗമായ ‘യോസേഫിന്റെ പുത്രന്മാർ’ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യോസേഫിന്റെ ഗോത്രവംശജരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: യെരീഹോവിനരികെയുള്ള യോർദാൻമുതൽ
  rationale: യെരീഹോയോടു ചേർന്ന യോർദാൻ പ്രദേശമാണ് അതിർത്തിയുടെ ആരംഭസ്ഥാനം എന്ന ഭൂമിശാസ്ത്രബന്ധം, അതിരുകടന്ന് കൃത്യമാക്കാതെ, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמֵי יְרִיחוֹ מִזְרָחָה
  choice: കിഴക്കുള്ള യെരീഹോയിലെ ജലാശയങ്ങൾവരെ
  rationale: מי എന്ന ബഹുവചന/സമാഹാരരൂപം ‘ജലാശയങ്ങൾ’ എന്നു നിലനിർത്തുകയും מזרחה സൂചിപ്പിക്കുന്ന കിഴക്കൻ സ്ഥാനം ചേർക്കുകയും ചെയ്യുന്നു; ഒറ്റ ഉറവാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമിയിലൂടെ
  rationale: מדבר എന്നത് ജനവാസം കുറഞ്ഞ വരണ്ട വനപ്രദേശത്തെയും മരുപ്രദേശത്തെയും സൂചിപ്പിക്കാം. മലയാള ബൈബിൾ-ഭൂമിശാസ്ത്ര പ്രയോഗത്തിൽ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്; ‘-യിലൂടെ’ അതിർത്തിയുടെ സഞ്ചാരദിശ വ്യക്തമാക്കുന്നു.
- source_word: עֹלֶה מִירִיחוֹ בָּהָר בֵּית אֵל
  choice: യെരീഹോയിൽനിന്ന് ബേഥേൽ മലനാട്ടിലേക്കു കയറുന്ന
  rationale: עֹלֶה എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭൂപ്രകൃതിപരമായ ഉയർച്ച ‘കയറുന്ന’ എന്നു നൽകുന്നു; הָר ഇവിടെ ഒറ്റമലയേക്കാൾ ഉയർന്ന മലനാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ബേഥേൽ മലനാട്’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
