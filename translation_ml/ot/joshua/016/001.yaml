translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. ഹീബ്രായ വാക്യത്തിന്റെ സംക്ഷിപ്ത അതിർത്തിപ്പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഇങ്ങനെ’, ‘പിന്നെ’, ‘-മുതൽ/-വരെ’, ‘-യിലൂടെ’ എന്നിവ ഉപയോഗിച്ചു; എന്നാൽ ഉറവിന്റെ കൃത്യസ്വഭാവവും നറുക്കിനെക്കുറിച്ചുള്ള പ്രയോഗഭേദവും അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
