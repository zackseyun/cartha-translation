id: JOS.16.8
reference: Joshua 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: ml
  text: തപ്പൂഹിൽനിന്ന് അതിർത്തി പടിഞ്ഞാറോട്ട് കാനാ തോടുവരെ നീളുന്നു; അതിന്റെ അറ്റങ്ങൾ കടൽവരെയാണ്. അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച് എഫ്രയീമിന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിനുള്ള അവകാശഭൂമി ഇതാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: തപ്പൂഹിൽനിന്ന്
  rationale: מִן ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: അതിർത്തി ... നീളുന്നു
  rationale: അതിർത്തിവിവരണത്തിൽ הלך അതിർത്തിരേഖയുടെ ഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നീളുന്നു’ സ്വാഭാവികമാണ്.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: കടലുമായി ബന്ധപ്പെട്ട ദിശാരൂപം ഇവിടെ സാധാരണ അതിർത്തിവിവരണപ്രകാരം പടിഞ്ഞാറുദിശയെ സൂചിപ്പിക്കുന്നു.
- source_word: נַחַל קָנָה
  choice: കാനാ തോട്
  rationale: נַחַל തോട്, നീർച്ചാൽ, അല്ലെങ്കിൽ വാദി എന്നർഥമാകാം; പൊതുവായ വായനയ്ക്ക് ‘തോട്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: അതിന്റെ അറ്റം കടലിലാണ്
  rationale: അതിർത്തിയുടെ അന്തിമസ്ഥാനമാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഹീബ്രുവിലെ ബഹുവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനമായി അവതരിപ്പിച്ചു.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാരുടെ ഗോത്രം
  rationale: מַטֵּה ഇവിടെ ഗോത്രവിഭാഗമാണ്; בְנֵי എന്ന പുരുഷലിംഗ കുടുംബപരമായ ഗോത്രനാമം മറച്ചുവയ്ക്കാതെ നിലനിർത്തി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: മൂലത്തിലെ കുടുംബ/കുലവിഭാഗങ്ങളുടെ അടിസ്ഥാനത്തിലുള്ള വിഭജനബോധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בְנֵי אֶפְרַיִם എന്ന ലിംഗസൂചക ഗോത്രനാമം
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  alternative: എഫ്രയീമ്യർ / എഫ്രയീമിന്റെ സന്തതികൾ
  rationale: ഹീബ്രു അക്ഷരാർഥത്തിൽ ‘എഫ്രയീമിന്റെ പുത്രന്മാർ’ എന്നും ഒരു പതിവ് ഗോത്രനാമമായും വരുന്നതിനാൽ പുരുഷലിംഗ കുടുംബപ്രയോഗം നിലനിർത്തി; ഇതുവഴി പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭൂവിഭാഗവിവരണ ശൈലി. ‘അവകാശഭൂമി’ നַחֲלָהയുടെ ഭൂവിതരണസന്ദർഭം വ്യക്തമാക്കുന്നു. പ്രസിദ്ധീകരണവാക്യത്തിൽ അടിക്കുറിപ്പുകളില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ചേർത്തിട്ടില്ല.
