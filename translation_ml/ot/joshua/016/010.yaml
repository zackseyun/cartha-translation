source:
  edition: WLC
  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: ml
  text: എന്നാൽ ഗേസെരിൽ വസിച്ചിരുന്ന കനാന്യരെ അവർ പുറത്താക്കിയില്ല; കനാന്യർ ഇന്നുവരെ എഫ്രയീമിന്റെ മധ്യേ വസിച്ചുവരുന്നു; അവർ നിർബന്ധിത വേലക്കാരായിത്തീർന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: നീക്കിക്കളഞ്ഞില്ല
  rationale: ഹിഫ്ഇൽ രൂപം ഇവിടെ ദേശത്തുനിന്ന് പുറത്താക്കുക/ഒഴിപ്പിക്കുക എന്ന അർഥത്തിലാണ്; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: എഫ്രയീമ്യരുടെ ഇടയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘എഫ്രയീമിന്റെ മധ്യേ’; ഇവിടെ ഗോത്രജനതയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ജനസമൂഹാർഥം വ്യക്തമാക്കി.
- source_word: לְמַס עֹבֵד
  choice: നിർബന്ധിത വേലക്കാരായി
  rationale: מַס എന്നത് ചുമത്തപ്പെട്ട കഠിനവേല/നിർബന്ധിത തൊഴിൽസേവനം സൂചിപ്പിക്കുന്നു; עֹבֵד സേവനം ചെയ്യുന്നതെന്ന ആശയം ശക്തിപ്പെടുത്തുന്നു.
- source_word: וַיְהִי
  choice: ആയിത്തീർന്നു
  rationale: വയിക്തോൽ രൂപത്തിന്റെ സംഭവപരമായ ഭാവം നിലനിർത്തി; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിലെ ‘became’ എന്ന തിരഞ്ഞെടുപ്പിനും യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ഹീബ്രുവിലെ ആദ്യ വാവിനെ വൈരുധ്യസൂചകമായ ‘എന്നാൽ’ എന്നും തുടർന്നുള്ള സംഭവബന്ധത്തെ ‘അതിനാൽ’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
