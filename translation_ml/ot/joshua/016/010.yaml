- from: എന്നാൽ ഗേസെരിൽ പാർത്തിരുന്ന കനാന്യരെ അവർ നീക്കിക്കളഞ്ഞില്ല. അതിനാൽ കനാന്യർ ഇന്നുവരെ എഫ്രയീമ്യരുടെ ഇടയിൽ പാർത്തുവരുന്നു; അവർ നിർബന്ധിത വേലക്കാരായിത്തീർന്നു.
