  register: ആധുനികവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ‘അതിർത്തി’ നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മലയാളത്തിൽ ഉച്ചാരണസൗകര്യമുള്ളവിധം ലിപ്യന്തരണം ചെയ്തു.
