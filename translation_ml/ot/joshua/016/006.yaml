  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി പടിഞ്ഞാറോട്ട്[a] വടക്കുഭാഗത്തുള്ള മിഖ്മെഥാത്തിലേക്കു ചെന്നു. തുടർന്ന് അതിർത്തി കിഴക്കോട്ട് താനത്ത്-ശീലോയിലേക്കു തിരിഞ്ഞ്, അതിന്റെ കിഴക്കുവശത്തുകൂടി യാനോഹയിലേക്കു കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദാനുപദമായി, ‘കടലിലേക്കു’; ‘പടിഞ്ഞാറോട്ട്’ എന്ന അർഥത്തിലുള്ള ഒരു എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: പിന്നെ ... നീണ്ടു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ അതിർത്തിരേഖയുടെ തുടർന്നുള്ള നീക്കത്തെയോ വ്യാപനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നീണ്ടു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം നൽകുന്നു; വാവ് ക്രമതുടർച്ചയായി ‘പിന്നെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: ഗോത്രവിഹിതത്തിന്റെ അതിർത്തിരേഖയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘അതിർത്തി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַיָּמָּה
  choice: പടിഞ്ഞാറോട്ട്[a]
  rationale: പദാനുപദമായി ‘കടലിലേക്കു’ എന്നാണെങ്കിലും, ഇത് പടിഞ്ഞാറ് സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ ദിശാപ്രയോഗമാണ്. ഭൂമിശാസ്ത്രപരമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകുകയും പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: הַמִּכְמְתָת מִצָּפוֹן
  choice: മിഖ്മെഥാത്തിന്റെ വടക്കുവശത്തേക്കു
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; מִצָּפוֹן അതിർത്തിയുടെ ഗതിയുമായി ബന്ധപ്പെട്ട വടക്കുവശത്തെ ഭൂപ്രകൃതിസൂചനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְנָסַב
  choice: തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണത്തിൽ ദിശാമാറ്റമാണ് ഈ ക്രിയ സൂചിപ്പിക്കുന്നത്; ‘തിരിഞ്ഞ്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִזְרָחָה תַּאֲנַת שִׁלֹה
  choice: കിഴക്കോട്ട് താനത്ത്-ശീലോയിലേക്കു
  rationale: ദിശാസൂചകമായ ה കിഴക്കോട്ടുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ശബ്ദരൂപം അനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְעָבַר אוֹתוֹ מִמִּזְרַח
  choice: അതിന്റെ കിഴക്കുവശത്തുകൂടി കടന്ന്
  rationale: അതിർത്തിരേഖ താനത്ത്-ശീലോയുടെ കിഴക്കുവശം കടന്നുപോകുന്നു എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അതിന്റെ’ എന്നത് സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יָנוֹחָה
  choice: യാനോവാഹിലേക്കു ചെന്നു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക രൂപം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കമായി നൽകിയിരിക്കുന്നു.
