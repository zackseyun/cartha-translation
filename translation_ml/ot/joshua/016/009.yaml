  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: ml
  text: മനശ്ശെയുടെ മക്കളുടെ അവകാശഭൂമിക്കുള്ളിൽ എഫ്രയീമിന്റെ മക്കൾക്കായി വേർതിരിച്ചുവെച്ച പട്ടണങ്ങൾ—അവയെല്ലാം അവയുടെ ഗ്രാമങ്ങളോടുകൂടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഫ്രയീമിന്റെ മക്കൾക്കായി വേർപെടുത്തിയ പട്ടണങ്ങൾ.” എബ്രായ കൃദന്തരൂപം, ഈ പട്ടണങ്ങൾ മനശ്ശെയുടെ പ്രദേശത്തുനിന്ന് വേർതിരിച്ച് എഫ്രയീമിനായി പ്രത്യേകമാക്കിയവയാണെന്ന ആശയത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: യോശുവയിലെ ഭൂപ്രദേശപ്പട്ടികകളിൽ עִיר സൂചിപ്പിക്കുന്ന നഗരങ്ങളെയോ പട്ടണങ്ങളെയോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ എന്നു നൽകി.
- source_word: הַמִּבְדָּלוֹת
  choice: വേർതിരിച്ചുവെച്ച
  rationale: בדל എന്ന ധാതുവിൽനിന്നുള്ള ഈ കർമ്മണി കൃദന്തം വേർതിരിക്കപ്പെട്ടതോ പ്രത്യേകമായി മാറ്റിവെക്കപ്പെട്ടതോ എന്ന ആശയം നൽകുന്നു; മനശ്ശെയുടെ പ്രദേശത്തിനുള്ളിലായിരുന്നിട്ടും എഫ്രയീമിനായി പ്രത്യേകം നിശ്ചയിച്ച പട്ടണങ്ങൾ എന്ന സന്ദർഭം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ മക്കൾക്കായി
  rationale: בני എന്നതിന്റെ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തി ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സംരക്ഷിച്ചു.
- source_word: בְּתוֹךְ
  choice: ഉള്ളിൽ
  rationale: മറ്റൊരു ഗോത്രത്തിന്റെ അവകാശഭൂമിയുടെ അതിരുകൾക്കകത്തെ സ്ഥാനം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: נַחֲלַת
  choice: അവകാശഭൂമി
  rationale: נחלה ഇവിടെ ഗോത്രത്തിന് അവകാശമായി ലഭിച്ച ഭൂവിഹിതമാണ്; ‘അവകാശഭൂമി’ അവകാശത്തിന്റെയും ഭൂവിഹിതത്തിന്റെയും ആശയങ്ങൾ ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മക്കൾ
  rationale: ഗോത്രനാമപ്രയോഗത്തിലെ בני എന്ന ഘടകം മൂലഭാഷയോട് ചേർന്ന് ‘മക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: כָּל הֶעָרִים
  choice: ആ പട്ടണങ്ങളെല്ലാം
  rationale: כָּל നൽകുന്ന സമഗ്രതയും മുൻപു പറഞ്ഞ പട്ടണങ്ങളിലേക്കുള്ള സംഗ്രഹസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങളും ഉൾപ്പെടെ
  rationale: חָצֵר ഇവിടെ പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ചെറുകുടിയിരിപ്പുകളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗ്രാമങ്ങൾ’ ഏറ്റവും വ്യക്തമായ പൊതുപദമാണ്.
