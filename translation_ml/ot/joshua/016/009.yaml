  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. മൂലത്തിലെ അപൂർണ്ണ പട്ടികവാക്യത്തെ മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘ഉണ്ടായിരുന്നു’ ചേർത്ത് പൂർണ്ണവാക്യമാക്കി; ഗോത്രസൂത്രത്തിലെ ‘മക്കൾ’ എന്ന രൂപവും ഭൂവിഹിതത്തിന്റെ ‘അവകാശ’ സൂചനയും നിലനിർത്തി.
