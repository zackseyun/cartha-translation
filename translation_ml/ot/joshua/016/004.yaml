    reason: נחל എന്ന ക്രിയയ്ക്ക് ഇവിടെ അവകാശമായി ലഭിക്കുക, അവകാശമായി പ്രാപിക്കുക, കൈവശമാക്കുക എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: തങ്ങളുടെ അവകാശം ലഭിച്ചു
  rationale: נחל എന്ന ക്രിയ ഇവിടെ നിശ്ചയിച്ചുകൊടുത്ത അവകാശഭൂമി ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കാനും യോശുവയിലെ ഭൂവിഭജനസന്ദർഭം വ്യക്തമാക്കാനും ‘തങ്ങളുടെ അവകാശം ലഭിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു; മൂലഭാഷയിൽ കർമം പരോക്ഷമായി ഉൾക്കൊള്ളുന്നു.
- source_word: בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാർ
  rationale: ഗോത്ര-വംശാവലി സന്ദർഭത്തിലെ ‘യോസേഫിന്റെ പുത്രന്മാർ’ എന്ന ഔപചാരിക പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് യോസേഫിൽനിന്നുള്ള ഗോത്രങ്ങളെ പ്രതിനിധീകരിക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തി-ഗോത്രനാമരൂപം ഉപയോഗിച്ചു.
- source_word: וְאֶפְרָיִם
  choice: എഫ്രയീമും
  rationale: പേരിനെ മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നൽകി; וְ എന്ന സംയോജകത്തെ ‘-ഉം’ വഴി നിലനിർത്തി.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാക്യാരംഭത്തിലെ waw തുടർന്നുവരുന്ന ആഖ്യാനഘട്ടത്തെ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അങ്ങനെ’ ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
