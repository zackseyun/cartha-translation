base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: ml
  text: പിന്നെ അത് പടിഞ്ഞാറോട്ട് യഫ്ലേത്യരുടെ അതിർത്തിയിലേക്കും താഴത്തെ ബേത്ത്-ഹോരോന്റെ അതിർത്തിവരെയും ഗേസെർവരെയും ഇറങ്ങിച്ചെന്നു; അതിന്റെ അതിർത്തിയുടെ അറ്റങ്ങൾ കടലിലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ അതിർത്തിവിവരണ ശൈലിയുടെ അക്ഷരാർഥം ‘അതിന്റെ പുറപ്പെടലുകൾ കടലിലായിരുന്നു’ എന്നാണ്; ഇവിടെ അതിർത്തിയുടെ അവസാനസ്ഥാനങ്ങൾ കടലിലായിരുന്നു എന്നാണർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: പിന്നെ അതു ... ഇറങ്ങിച്ചെന്നു
  rationale: അതിർത്തിവിവരണത്തിലെ ഭൂപ്രകൃതിപരമായ താഴോട്ടുള്ള നീക്കം നിലനിർത്തുകയും, തുടർച്ച സൂചിപ്പിക്കുന്ന conjunction സ്വാഭാവികമായി ‘പിന്നെ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: ദിശാസൂചക രൂപം ഭൂമിശാസ്ത്രപരമായി മെഡിറ്ററേനിയൻ കടലിന്റെ ദിശയായ പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: യഫ്ലേത്യരുടെ അതിർത്തിയിലേക്ക്
  rationale: גְּבוּל എന്നത് അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്നു; gentilic designation ആയ הַיַּפְלֵטִי ജനവിഭാഗനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: താഴത്തെ ബേത്ത്-ഹോരോന്റെ അതിർത്തിവരെ
  rationale: עַד വ്യാപ്തിയുടെ അറ്റം സൂചിപ്പിക്കുന്നു; תַּחְתּוֹן, മേലത്തെ ബേത്ത്-ഹോരോനിൽനിന്ന് വേർതിരിക്കുന്ന ‘താഴത്തെ’ എന്ന വിശേഷണം നിലനിർത്തുന്നു.
- source_word: וְעַד גָּזֶר
  choice: ഗേസെർവരെയും
  rationale: ആവർത്തിക്കുന്ന עַד അതിർത്തിയുടെ വ്യാപ്തി തുടരുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: וְהָיוּ תֹצְאֹתָיו
  choice: അതിന്റെ അതിർത്തിയുടെ അറ്റം ... ആയിരുന്നു
  rationale: അതിർത്തിവിവരണങ്ങളിലെ תֹצְאֹתָיו അതിർത്തിയുടെ അവസാനസ്ഥാനം അഥവാ എത്തിച്ചേരുന്ന അറ്റം സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘പുറപ്പെടലുകൾ’ എന്നതിനെക്കാൾ ഈ ഭൂമിശാസ്ത്രാർഥം മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יָמָּה
  choice: കടലിൽ
  rationale: അവസാന ഘടകത്തിൽ ഇത് ദിശയെക്കാൾ അതിർത്തിയുടെ അന്തിമസ്ഥാനമായ കടലിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു.
