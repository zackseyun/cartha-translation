translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; മൂലത്തിലെ അതിർത്തിസൂത്രത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമായി നൽകി, അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
