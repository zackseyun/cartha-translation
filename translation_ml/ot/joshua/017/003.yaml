id: JOS.17.3
reference: Joshua 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: ml
  text: 'മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകനായ ഗിലെയാദിന്റെ മകനായ ഹേഫെരിന്റെ മകൻ സെലോഫഹാദിന്[a] പുത്രന്മാരില്ലായിരുന്നു; പുത്രിമാർ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ. അവന്റെ പുത്രിമാരുടെ പേരുകൾ ഇവയാണ്: മഹ്ലാ, നോവാ[b], ഹോഗ്ലാ, മിൽക്കാ, തിര്‍സാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘സെലോഫഹാദിനോ/സെലോഫഹാദിന്’ എന്നാരംഭിക്കുന്നു; ഇവിടെ അത് സെലോഫഹാദിന്റെ കുടുംബസ്ഥിതി അവതരിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള നോവാ സെലോഫഹാദിന്റെ പുത്രിയാണ്; ഉല്പത്തി പുസ്തകത്തിൽ പറയുന്ന പുരുഷനായ നോഹയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: സെലോഫഹാദിന്
  rationale: വാക്യാരംഭത്തിലെ וְ + לִ എന്ന പ്രയോഗവും പിന്നാലെയുള്ള לֹא הָיוּ לוֹ എന്ന അവകാശസൂചക ഘടനയും ചേർന്ന് സെലോഫഹാദിന്റെ കുടുംബസ്ഥിതി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ദാതൃവിഭക്തിയോടുകൂടിയ ‘സെലോഫഹാദിന് … ഇല്ലായിരുന്നു’ എന്ന രൂപം അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ മകനായ ഗിലെയാദിന്റെ മകനായ ഹേഫെരിന്റെ മകൻ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ‘മകൻ’ എന്ന വംശാവലിഘടന ഒഴിവാക്കാതെ സൂക്ഷിച്ചു. മലയാളത്തിൽ ബന്ധങ്ങൾ വ്യക്തമായി ഗ്രഹിക്കാനായി ഉടമസ്ഥതാശൃംഖല സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിച്ചു.
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: പുത്രന്മാരില്ലായിരുന്നു; പുത്രിമാർ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: בָּנִים എന്നത് ഇവിടെ പൊതുവായ ‘മക്കൾ’ അല്ല, പുത്രിമാരോട് വിരുദ്ധമായി നിൽക്കുന്ന ‘പുത്രന്മാർ’ ആണ്. כִּי אִם സൂചിപ്പിക്കുന്ന ഒഴിവാക്കൽ/വൈരുധ്യം ‘മാത്രമേ’ എന്നതിലൂടെ വ്യക്തമാക്കി.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: അവന്റെ പുത്രിമാരുടെ പേരുകൾ ഇവയാണ്
  rationale: പേരുകളുടെ പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; ‘അവന്റെ’ എന്ന ഉടമസ്ഥസൂചന നിലനിർത്തി.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: മഹ്ലാ, നോവാ, ഹോഗ്ലാ, മിൽക്കാ, തിര്‍സാ
  rationale: വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്നും മലയാളത്തിൽ വായിക്കാവുന്ന രീതിയിലും ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വംശാവലിയുടെ ആവർത്തനഘടനയും പുത്രന്മാർ–പുത്രിമാർ എന്ന നിയമപരമായി പ്രസക്തമായ വൈരുധ്യവും നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് [b] മിൽക്കായ്ക്കു ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം നോവായെക്കുറിച്ചായതിനാൽ ബന്ധപ്പെട്ട പേരിനു പിന്നാലെ സ്ഥാപിച്ചു.
