translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘മലനാട്’–‘താഴ്‌വരപ്രദേശം’ എന്ന ഭൂപ്രദേശവ്യത്യാസം നിലനിർത്തുകയും, എബ്രായ നഗരബന്ധരൂപകം മുഖ്യവാചകത്തിൽ വ്യക്തമായി നൽകിക്കൊണ്ട് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്തു.
