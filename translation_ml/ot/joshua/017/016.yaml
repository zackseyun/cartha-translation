id: JOS.17.16
reference: Joshua 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: ml
  text: 'യോസേഫിന്റെ മക്കൾ പറഞ്ഞു: “മലനാട് ഞങ്ങൾക്ക് മതിയാകില്ല[a]. താഴ്‌വരപ്രദേശത്ത് താമസിക്കുന്ന കനാന്യർക്കെല്ലാം ഇരുമ്പുരഥങ്ങളുണ്ട്[b]—ബേത്ത്-ശെയാനിലും അതിന്റെ അധീനപട്ടണങ്ങളിലും[c] ഉള്ളവർക്കും യിസ്രെയേൽ താഴ്‌വരയിൽ ഉള്ളവർക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘മലനാട് ഞങ്ങൾക്കു കണ്ടെത്തപ്പെടുന്നില്ല.’ സന്ദർഭത്തിൽ, മലനാട് യോസേഫിന്റെ ഗോത്രങ്ങൾക്കു മതിയാകുന്നില്ല എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇരുമ്പുകൊണ്ടുള്ള രഥങ്ങൾ.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അതിന്റെ പുത്രിമാർ’; ഒരു പ്രധാന നഗരത്തെ ആശ്രയിച്ചിരുന്ന ചെറുപട്ടണങ്ങളെയോ ജനവാസകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: הָהָר
  choice: മലനാട്
  rationale: ഭൂപ്രദേശവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് ഒറ്റ മലയെയല്ല, യോസേഫിന്റെ ഗോത്രങ്ങൾക്കു ലഭിച്ച ഉയർന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: ഞങ്ങൾക്ക് മതിയാകില്ല
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഞങ്ങൾക്കു കണ്ടെത്തപ്പെടുന്നില്ല’ എന്നതിനെക്കാൾ, ലഭിച്ച മലനാട് പര്യാപ്തമല്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: רֶכֶב בַּרְזֶל
  choice: ഇരുമ്പുരഥങ്ങൾ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ ശക്തിയും സൈനികസന്ദർഭത്തിലെ സ്വാഭാവിക അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; രഥങ്ങൾ മുഴുവനായും ഇരുമ്പിൽ നിർമിച്ചതാണെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: താമസിക്കുന്ന കനാന്യർക്കെല്ലാം
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിൽ ബഹുവചനമായി നൽകുന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: אֶרֶץ הָעֵמֶק
  choice: താഴ്‌വരപ്രദേശം
  rationale: മലനാടിനോടു വിപരീതമായ താഴ്ന്ന ഭൂപ്രദേശത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּבֵית שְׁאָן
  choice: ബേത്ത്-ശെയാൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וּבְנוֹתֶיהָ
  choice: അതിന്റെ അധീനപട്ടണങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അതിന്റെ പുത്രിമാർ’ എന്ന നഗരബന്ധരൂപകം ആധുനിക വായനക്കാരന് വ്യക്തമായി മനസ്സിലാകുന്ന വിധത്തിൽ ആശ്രിത ചെറുപട്ടണങ്ങളെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: യിസ്രെയേൽ താഴ്‌വര
  rationale: എബ്രായ ഭൂമിശാസ്ത്രനാമത്തിന്റെ അർഥവും ഘടനയും വ്യക്തമായി നിലനിർത്തുന്നു.
