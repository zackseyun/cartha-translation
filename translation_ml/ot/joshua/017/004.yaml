revisions:
- from: 'അങ്ങനെ അവർ പുരോഹിതനായ എലെയാസാരിന്റെയും നൂന്റെ മകനായ യോശുവയുടെയും പ്രമാണിമാരുടെയും മുമ്പാകെ വന്ന് പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ ഞങ്ങൾക്ക് ഒരു അവകാശം നൽകണമെന്ന് യഹോവ മോശയോടു കല്പിച്ചിട്ടുണ്ട്.” അതിനാൽ യഹോവയുടെ കല്പനപ്രകാരം[a] അവൻ അവരുടെ അപ്പന്റെ സഹോദരന്മാരുടെ ഇടയിൽ അവർക്കും ഒരു അവകാശം നൽകി.[b]'
  to: 'അങ്ങനെ അവർ പുരോഹിതനായ എലെയാസാരുടെയും നൂന്റെ മകനായ യോശുവയുടെയും പ്രമാണിമാരുടെയും മുമ്പാകെ സമീപിച്ച് ഇപ്രകാരം പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ ഞങ്ങൾക്കു ഒരു അവകാശഭൂമി നൽകാൻ യാഹ്‌വേ മോശെയോടു കല്പിച്ചിരുന്നു.” അപ്പോൾ യാഹ്‌വേയുടെ കല്പനപ്രകാരം[a] അവൻ അവർക്കു അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ ഒരു അവകാശഭൂമി നൽകി.[b]'
