source:
  edition: WLC
  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: ml
  text: 'അങ്ങനെ അവർ പുരോഹിതനായ എലെയാസാരുടെയും നൂന്റെ മകനായ യോശുവയുടെയും പ്രമാണിമാരുടെയും മുമ്പാകെ സമീപിച്ച് ഇപ്രകാരം പറഞ്ഞു: “ഞങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ ഞങ്ങൾക്കു ഒരു അവകാശഭൂമി നൽകാൻ യാഹ്‌വേ മോശെയോടു കല്പിച്ചിരുന്നു.” അപ്പോൾ യാഹ്‌വേയുടെ കല്പനപ്രകാരം[a] അവൻ അവർക്കു അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ ഒരു അവകാശഭൂമി നൽകി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യാഹ്‌വേയുടെ വായനുസരിച്ച്.”'
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ പിതാവിന്റെ സഹോദരന്മാരുടെ ഇടയിൽ” എന്നത് അവരുടെ പിതൃകുലത്തിനുള്ളിൽ അനുവദിക്കപ്പെട്ട വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: അവർ ... മുമ്പാകെ വന്നു
  rationale: קרב എന്ന ക്രിയയുടെ 3-ാം പുരുഷ ബഹുവചന സ്ത്രീലിംഗരൂപം മുൻസന്ദർഭത്തിലെ സെലോഫഹാദിന്റെ പുത്രിമാരെ സൂചിപ്പിക്കുന്നു; ഔദ്യോഗികമായി അധികാരികളുടെ സന്നിധിയിൽ എത്തിയതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: മൂന്നു പ്രാവശ്യം ആവർത്തിക്കുന്ന പദം ഔദ്യോഗികവും പരസ്യവുമായ അപേക്ഷാസന്ദർഭം അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ പട്ടികയെ സ്വാഭാവികമാക്കാൻ അവസാന ഘടകത്തോടൊപ്പം ഒരിക്കൽ ചേർത്തിരിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: כֹּהֵן എന്ന പദത്തിന്റെ പതിവായ, വ്യക്തമായ മലയാളരൂപം.
- source_word: הַנְּשִׂיאִים
  choice: പ്രമാണിമാർ
  rationale: ഗോത്ര-സമൂഹ അധികാരികളെ സൂചിപ്പിക്കുന്നു; രാജകുമാരന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ഔദ്യോഗിക സ്ഥാനഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: ഞങ്ങൾക്ക് ഒരു അവകാശം നൽകണമെന്ന്
  rationale: נַחֲלָה ഇവിടെ പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ നിയമപരവും ഭൂവിതരണപരവുമായ അർഥം ലളിതമായി വഹിക്കുന്നു.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: ഞങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: സ്ത്രീകളായ അപേക്ഷകർ തങ്ങളുടെ പുരുഷ വംശബന്ധുക്കളുടെ വിഹിതത്തിനുള്ളിൽ പങ്ക് ചോദിക്കുന്ന സാഹചര്യത്തിലെ ലിംഗ-സാമൂഹിക പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: וַיִּתֵּן
  choice: അവൻ ... നൽകി
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയ നേരിട്ട് നിലനിർത്തുന്നു; സമീപസ്ഥനായ യോശുവയാണ് സാധ്യതയുള്ള കർത്താവ്, എന്നാൽ മൂലത്തിലെ പരോക്ഷത പരിഭാഷയിൽ നിർബന്ധിച്ച് വിശദീകരിക്കുന്നില്ല.
- source_word: אֶל־פִּי יְהוָה
  choice: യഹോവയുടെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായനുസരിച്ച്’; അധികാരപൂർവമായ ദൈവിക നിർദേശം എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחֵי אֲבִיהֶן
  choice: അവരുടെ അപ്പന്റെ സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: പിതൃവംശത്തിലെ പ്രത്യേക ബന്ധം പൊതുവായ ‘ബന്ധുക്കൾ’ എന്നു പരത്താതെ മൂലപാഠത്തിന്റെ കൃത്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉള്ളത്; അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: אַחֵינוּ എന്ന ലിംഗസൂചക ബന്ധുപദം
  choice: ഞങ്ങളുടെ സഹോദരന്മാർ
  alternative: ഞങ്ങളുടെ ബന്ധുക്കൾ
  rationale: സെലോഫഹാദിന്റെ പുത്രിമാർ പുരുഷ വംശാംഗങ്ങളുടെ ഇടയിൽ ഭൂവിഹിതം ആവശ്യപ്പെടുന്ന നിയമപരമായ പ്രത്യേകത നിലനിർത്തുന്നു.
- issue: אֲחֵי אֲבִיהֶן എന്ന പിതൃവംശബന്ധം
  choice: അവരുടെ അപ്പന്റെ സഹോദരന്മാർ
  alternative: അവരുടെ പിതൃവംശക്കാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ബന്ധുപദം സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് വിശാലമായ പിതൃകുലത്തെ സൂചിപ്പിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וַיִּתֵּן എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ
  alternative: യോശുവ
  rationale: സന്ദർഭത്തിൽ യോശുവയായിരിക്കാനാണ് കൂടുതൽ സാധ്യത; എങ്കിലും മൂലപാഠം പേര് ആവർത്തിക്കാത്തതിനാൽ പരിഭാഷയും ആ പരോക്ഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഔദ്യോഗിക അപേക്ഷാസന്ദർഭം സൂചിപ്പിക്കാൻ ‘മുമ്പാകെ’, ‘പ്രമാണിമാർ’, ‘കല്പനപ്രകാരം’ എന്നിവ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ബന്ധുപദങ്ങളും ഏകവചന കർത്താവിലെ സ്വാഭാവിക അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
