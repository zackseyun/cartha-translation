source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: ml
  text: മനശ്ശെ ഗോത്രത്തിന് നറുക്ക് ലഭിച്ചു; അവൻ യോസേഫിന്റെ ആദ്യജാതനായിരുന്നു. മനശ്ശെയുടെ ആദ്യജാതനും ഗിലെയാദിന്റെ പിതാവുമായ[a] മാഖീറിന്, അവൻ ഒരു യോദ്ധാവായിരുന്നതിനാൽ, ഗിലെയാദും ബാശാനും ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗിലെയാദിന്റെ പൂർവികൻ” അല്ലെങ്കിൽ “ഗിലെയാദിന്റെ സ്ഥാപകൻ” എന്നും പരിഭാഷപ്പെടുത്താം. “പിതാവ്” എന്ന എബ്രായപ്രയോഗം ഉടനെയുള്ള ജൈവപിതാവിനെ മാത്രമല്ല, ഒരു പൂർവികനെയോ സ്ഥാപകനെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: നറുക്ക് ലഭിച്ചു
  rationale: ഭൂപ്രദേശം നറുക്കിട്ട് അവകാശമായി നൽകുന്ന സന്ദർഭത്തിലെ ഫലത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെ ഗോത്രത്തിന്
  rationale: מַטֶּה ഇവിടെ അക്ഷരാർഥത്തിലുള്ള വടിയല്ല, ഗോത്രവിഭാഗമാണ്.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: അവൻ യോസേഫിന്റെ ആദ്യജാതനായിരുന്നു
  rationale: സർവനാമം മനശ്ശെയെ സൂചിപ്പിക്കുന്നു; כִּי നൽകുന്ന വിശദീകരണബന്ധവും നിലനിർത്തുന്നു.
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: മനശ്ശെയുടെ ആദ്യജാതനായ മാഖീറിന്
  rationale: മനശ്ശെയുടെ വംശത്തിനുള്ളിലെ പ്രത്യേക അവകാശസ്വീകർത്താവിനെ לְ സൂചിപ്പിക്കുന്നു; വാക്യഘടനയിൽ ഇത് തുടർന്നുള്ള ക്രിയയോടു ചേർത്തിരിക്കുന്നു.
- source_word: אֲבִי הַגִּלְעָד
  choice: ഗിലെയാദിന്റെ പിതാവ്
  rationale: എബ്രായ കുടുംബബന്ധപ്രയോഗം പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; പൂർവികൻ അല്ലെങ്കിൽ സ്ഥാപകൻ എന്ന വിപുലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ מִלְחָמָה
  choice: ഒരു യോദ്ധാവ്
  rationale: യുദ്ധത്തിൽ പ്രാവീണ്യമുള്ളവൻ എന്ന അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְהִי לוֹ
  choice: അവന് ലഭിച്ചു
  rationale: അവകാശവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ നിയുക്തമായ കൈവശാവകാശം വ്യക്തമാക്കുന്നു.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: ഗിലെയാദും ബാശാനും
  rationale: സ്ഥിരപ്രയോഗത്തിലുള്ള സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: മനശ്ശെയുടെ ആദ്യജാതത്വം അവകാശവിഭജനത്തിനുള്ള വിശദീകരണമായി വായിക്കൽ
  choice: കാരണമോ വിശദീകരണമോ സൂചിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തി
  alternative: കാരണമെന്ന ബന്ധം ദുർബലപ്പെടുത്തി സ്വതന്ത്ര പ്രസ്താവനയാക്കുക
  rationale: כִּי എന്ന പദത്തിന്റെ വിശദീകരണ/കാരണശക്തി പാഠത്തിൽ സംരക്ഷിക്കണം; അതിനപ്പുറം അവകാശക്രമത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ നിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധങ്ങൾ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഗിലെയാദിന്റെ പിതാവ്’ എന്ന പ്രയോഗത്തിനുശേഷം വരുന്ന വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
