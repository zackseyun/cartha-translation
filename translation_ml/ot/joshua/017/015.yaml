translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വചനത്തിലെ ‘നീ’ ഏകവചനരൂപം കൂട്ടായ ജനവിഭാഗത്തെ അഭിസംബോധന ചെയ്യുന്നതായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. ജനവിഭാഗനാമങ്ങൾ ബൈബിൾ മലയാളത്തിൽ എളുപ്പം തിരിച്ചറിയാവുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
