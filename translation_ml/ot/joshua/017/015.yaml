source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: ml
  text: 'യോശുവ അവരോടു പറഞ്ഞു: “നിങ്ങൾ ജനസംഖ്യയിൽ വലിയ ഒരു ജനതയാണെങ്കിൽ, കാട്ടിലേക്കു കയറിച്ചെന്ന് പെരിസ്യരുടെയും രെഫായീമരുടെയും ദേശത്ത് അവിടെ നിങ്ങൾക്കായി സ്ഥലം വെട്ടിത്തെളിക്കൂ[a]. കാരണം, എഫ്രയീം മലനാട് നിങ്ങൾക്കു ഇടുങ്ങിയതാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാട്ടിലേക്കു കയറിച്ചെന്ന് നിങ്ങൾക്കായി അതു വെട്ടിത്തെളിക്കൂ.” എബ്രായ ക്രിയ കാടുവെട്ടി ഭൂമി തെളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എഫ്രയീം മലനാട്” എന്നത് “എഫ്രയീം പർവതം” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ എഫ്രയീമിനു ലഭിച്ച ഉയർന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: ജനസംഖ്യയേറിയ ഒരു ജനം
  rationale: ഈ പ്രയോഗം ഇവിടെ ജനത്തിന്റെ മഹത്ത്വത്തേക്കാൾ എണ്ണപ്പെരുപ്പത്തെ സൂചിപ്പിക്കുന്നു. യോസേഫിന്റെ ഗോത്രക്കാർ ഉന്നയിച്ച വലിയ ജനസംഖ്യയെന്ന അവകാശവാദം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: കാട്ടുപ്രദേശത്തേക്കു കയറിച്ചെന്ന്
  rationale: עלה ഉയർന്ന പ്രദേശത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; הַיַּעְרָה ദിശാസൂചനയോടെ കാട്ടിലേക്കുള്ള ഗതിയെ അറിയിക്കുന്നു. לְךָയിലെ സ്വപ്രയോജനഭാവം തുടർന്നുള്ള ‘നിങ്ങൾക്കായി’ എന്നതിൽ പ്രകടമാക്കുന്നു.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: നിങ്ങൾക്കായി അവിടെ സ്ഥലം വെട്ടിത്തെളിക്കൂ
  rationale: പിയേൽ രൂപത്തിലുള്ള ברא കാടുവെട്ടി ഭൂമി തെളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രായിൽ കർമം പരോക്ഷമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘സ്ഥലം’ ചേർത്തിരിക്കുന്നു; ‘വെട്ടിത്തെളിക്കൂ’ എന്നത് വനഭൂമി തെളിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: പെരിസ്യരുടെയും രെഫായീമ്യരുടെയും ദേശത്ത്
  rationale: രണ്ടു ജനവിഭാഗനാമങ്ങളും വ്യാഖ്യാനാത്മകമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. רְפָאִים ഇവിടെ വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ പേരായി വരുന്നതിനാൽ അതിന്റെ അർഥം നിർബന്ധമായി നിർവചിക്കുന്നില്ല.
- source_word: כִּי אָץ לְךָ
  choice: നിങ്ങൾക്കു മതിയാകാത്തവിധം ഇടുങ്ങിയതാണല്ലോ
  rationale: אָץ ഞെരുക്കമോ സ്ഥലക്കുറവോ സൂചിപ്പിക്കുന്നു. ജനസംഖ്യയ്ക്കു നിലവിലുള്ള പ്രദേശം പോരെന്ന സന്ദർഭാർഥം ‘മതിയാകാത്തവിധം ഇടുങ്ങിയത്’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; כִּיയുടെ കാരണഭാവം ‘ആണല്ലോ’ വഴി നൽകുന്നു.
- source_word: הַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്
  rationale: ഭൂപ്രദേശവിവരണത്തിൽ הַר ഒരു ഒറ്റ കൊടുമുടിയേക്കാൾ ഉയർന്ന മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘എഫ്രയീം പർവതം’ എന്നതിനെക്കാൾ ‘എഫ്രയീം മലനാട്’ യോജിക്കുന്നു.
