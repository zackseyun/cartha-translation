  text: נֶ֣גְבָּ/ה לְ/אֶפְרַ֗יִם וְ/צָפ֨וֹנָ/ה֙ לִ/מְנַשֶּׁ֔ה וַ/יְהִ֥י הַ/יָּ֖ם גְּבוּל֑/וֹ וּ/בְ/אָשֵׁר֙ יִפְגְּע֣וּ/ן מִ/צָּפ֔וֹן וּ/בְ/יִשָּׂשכָ֖ר מִ/מִּזְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: ml
  text: തെക്കുവശം എഫ്രയീമിന്റേതും വടക്കുവശം മനശ്ശെയുടേതും ആയിരുന്നു. കടൽ അതിന്റെ അതിരായിരുന്നു. വടക്കുവശത്ത് ആശേരിനോടും കിഴക്കുവശത്ത് യിസ്സാഖാറിനോടും അതിരിട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വടക്കുവശത്ത് അവർ ആശേരിനെ തൊട്ടു; കിഴക്കുവശത്ത് യിസ്സാഖാറിനെയും.” പ്രദേശാതിർത്തികളുടെ വിവരണത്തിൽ എബ്രായ ക്രിയയ്ക്ക് ‘കണ്ടുമുട്ടുക,’ ‘തൊടുക,’ ‘അതിരിടുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם וְצָפוֹנָה לִמְנַשֶּׁה
  choice: തെക്കുവശം എഫ്രയീമിന്റേതും വടക്കുവശം മനശ്ശെയുടേതും ആയിരുന്നു
  rationale: ദിശാസൂചക രൂപങ്ങളും ל എന്ന ഉടമസ്ഥത/വിഹിതസൂചക പ്രയോഗവും അതിർത്തിവിവരണത്തിന്റെ ചുരുക്കഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: കടൽ അതിന്റെ അതിരായിരുന്നു
  rationale: പടിഞ്ഞാറൻ അതിർത്തിയായി കടലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ വാക്യം നേരിട്ട്, സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; പ്രത്യയം പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: יִפְגְּעוּן
  choice: ചേർന്നുകിടന്നു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ פגע പ്രദേശങ്ങൾ തമ്മിൽ എത്തിച്ചേരുക, തൊടുക, അതിരിടുക എന്ന അർഥം വഹിക്കുന്നു. ‘ചേർന്നുകിടന്നു’ ഭൂമിശാസ്ത്രപരമായ സമീപസ്ഥിതി സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִצָּפוֹן ... מִמִּזְרָח
  choice: വടക്കുവശത്ത് ... കിഴക്കുവശത്ത്
  rationale: ഇവിടെ מִן ഏതു വശത്താണ് പ്രദേശങ്ങൾ തമ്മിൽ ചേരുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘വടക്കുനിന്ന്/കിഴക്കുനിന്ന്’ എന്നതിനെക്കാൾ ഈ രൂപം മലയാളത്തിൽ അതിർത്തിസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തിയിരിക്കെ, എബ്രായത്തിലെ അപൂർണവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആവശ്യമായ ക്രിയകൾ ചേർത്തു.
