translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണ ശൈലി. ഗോത്രനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ‘എഫ്രയീം’, ‘മനശ്ശെ’ എന്നീ രൂപങ്ങളിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രസക്തമായ പദബന്ധത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
