    rationale: '“തെക്കുവശത്തേക്ക്” conveys direction toward the south side. The Hebrew phrase is best retained as a location relative to the brook: south of/on the south side of it. “തെക്കുവശത്തുകൂടെ” gives this without over-specifying the precise course of the boundary.'
