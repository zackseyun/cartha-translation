source:
  edition: WLC
  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി കാനാ തോടിന്റെ[a] തെക്കുവശത്തുകൂടെ ഇറങ്ങി. മനശ്ശെയുടെ പട്ടണങ്ങൾക്കിടയിലുള്ള ഈ പട്ടണങ്ങൾ എഫ്രയീമിനുള്ളവയായിരുന്നു[b]. മനശ്ശെയുടെ അതിർത്തി തോടിന്റെ വടക്കുവശത്തായിരുന്നു; അതിന്റെ അറ്റം കടലിലായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “കാനാ നീർച്ചാൽത്താഴ്വര.” എബ്രായപദം കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന തോടിനെയോ അതിന്റെ വരണ്ട നീർച്ചാൽപ്പാതയെയോ താഴ്വരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, മനശ്ശെയ്ക്ക് വിഹിതമായി ലഭിച്ച പ്രദേശത്തിനുള്ളിൽ എഫ്രയീമിനുള്ള പട്ടണങ്ങൾ ഉണ്ടായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: ഇവിടെ “കടൽ” എന്നത് മെഡിറ്ററേനിയൻ കടലാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: പിന്നെ അതിർത്തി ... ഇറങ്ങി
  rationale: അതിർത്തിവിവരണത്തിൽ ירד ഭൂപ്രകൃതിയിലോ ദിശയിലോ താഴേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. തുടർച്ചാസൂചകമായ waw-നെ സ്വാഭാവികമായി ‘പിന്നെ’ എന്നു നൽകി.
- source_word: נַחַל קָנָה
  choice: കാനാ തോട്
  rationale: נחל എന്നത് തോട്, കാലിക നീരൊഴുക്ക്, അല്ലെങ്കിൽ നീർച്ചാൽ കടന്നുപോകുന്ന താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം. മലയാളത്തിൽ വായനാസൗകര്യമുള്ള ‘തോട്’ മുഖ്യപാഠത്തിൽ നൽകി, വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: נֶגְבָּה לַנַּחַל
  choice: തോടിന്റെ തെക്കുവശത്തേക്ക്
  rationale: പ്രയോഗം തോടിനോടുള്ള തെക്കൻ സ്ഥാനം/ദിശ സൂചിപ്പിക്കുന്നു. തെക്കുവശത്തുകൂടിയോ അതിലേക്കോ അതിർത്തി ഇറങ്ങുന്നതെന്ന മൂലത്തിലെ ചെറിയ അനിശ്ചിതത്വം പൂർണമായി തീർപ്പാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: ഈ പട്ടണങ്ങൾ എഫ്രയീമിനുള്ളവയായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യം ഉടമസ്ഥതയെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; ‘എഫ്രയീമിനുള്ളവ’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പട്ടണങ്ങൾക്കിടയിലുള്ള
  rationale: בתוך ഇവിടെ ഉൾസ്ഥിതി സൂചിപ്പിക്കുന്നു—മനശ്ശെയ്ക്ക് നൽകിയ പ്രദേശത്തിനുള്ളിൽ എഫ്രയീമിന്റെ പട്ടണങ്ങൾ നിലകൊണ്ടിരുന്നു.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: മനശ്ശെയുടെ അതിർത്തി തോടിന്റെ വടക്കുവശത്തായിരുന്നു
  rationale: מִצְּפוֹן തോടിന്റെ വടക്കുഭാഗത്തുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: അതിന്റെ അറ്റം കടലിലായിരുന്നു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ תוצאות അതിർത്തിയുടെ അവസാനസ്ഥാനം സൂചിപ്പിക്കുന്നു. ഭൂമിശാസ്ത്രപരമായ സാഹചര്യത്തിൽ הים മെഡിറ്ററേനിയൻ കടലാണ്.
