  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: ml
  text: യോർദ്ദാന്ന് അക്കരെയുള്ള ഗിലെയാദ്, ബാശാൻ ദേശങ്ങൾക്കു പുറമെ, മനശ്ശെയ്ക്ക് പത്തു ഓഹരികൾ നറുക്കിലൂടെ ലഭിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനശ്ശെയ്ക്ക് പത്തു ഭൂവിഭാഗങ്ങൾ വീതിച്ചുകിട്ടി.” എബ്രായഭാഷയിൽ ഭൂമി നറുക്കിട്ട് വിഭജിക്കുന്ന സന്ദർഭത്തിൽ അക്ഷരാർഥത്തിൽ “വീണു” എന്ന പ്രയോഗമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: നറുക്കിലൂടെ ലഭിച്ചു
  rationale: നפל എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘വീണു’ എന്നാണെങ്കിലും, ഇവിടെ ഭൂവിഭജനത്തിലെ നറുക്കിടൽ സന്ദർഭമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം അറിയിക്കാനും നറുക്കിന്റെ ആശയം നിലനിർത്താനും ‘നറുക്കിലൂടെ ലഭിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חַבְלֵי
  choice: ഓഹരികൾ
  rationale: അളവുകയർ, പ്രദേശം, വിഭജിച്ചുകിട്ടിയ പങ്ക് എന്നീ അർഥങ്ങൾക്കു സാധ്യതയുണ്ട്. ഭൂവിഭജനത്തിന്റെ ഫലമായ പങ്കുകളെ സൂചിപ്പിക്കാൻ ‘ഓഹരികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: വ്യക്തിയുടെയും ഗോത്രത്തിന്റെയും പേരിനുള്ള പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: עֲשָׂרָה
  choice: പത്തു
  rationale: ഓഹരികളുടെ എണ്ണം സൂചിപ്പിക്കുന്ന സാധാരണ സംഖ്യാരൂപം.
- source_word: לְבַד
  choice: കൂടാതെ
  rationale: യോർദ്ദാനക്കരയിലെ ഭൂമിക്കു പുറമേ ലഭിച്ച ഓഹരികളാണിവ എന്നു സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵאֶרֶץ הַגִּלְעָד וְהַבָּשָׁן
  choice: ഗിലെയാദും ബാശാനും
  rationale: לְבַד എന്നതിനോടൊപ്പം ‘ഗിലെയാദിന്റെയും ബാശാന്റെയും ദേശം കൂടാതെ’ എന്ന ആശയമാണ്. മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി സ്ഥലനാമങ്ങൾ നേരിട്ട് ചേർത്തു.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെയുള്ള
  rationale: ഗിലെയാദും ബാശാനും യോർദ്ദാന്റെ മറുകരയിലാണെന്ന ഭൂമിശാസ്ത്രപരമായ വിവരം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഏത് കരയെന്ന ദൃഷ്ടികോണപരമായ അവ്യക്തത നിലനിർത്തുന്നു.
