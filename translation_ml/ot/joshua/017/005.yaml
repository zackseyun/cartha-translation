  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായ ഭൂവിഭജന പ്രയോഗത്തിന്റെ ആശയം മുഖ്യവാക്യത്തിൽ വ്യക്തമായി നൽകിയപ്പോൾ, അതിന്റെ അക്ഷരാർഥപരമായ സവിശേഷത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
