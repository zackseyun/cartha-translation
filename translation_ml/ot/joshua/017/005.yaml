  to: യോർദ്ദാന്ന് അക്കരെയുള്ള ഗിലെയാദ്, ബാശാൻ ദേശങ്ങൾക്കു പുറമെ, മനശ്ശെയ്ക്ക് പത്തു ഓഹരികൾ നറുക്കിലൂടെ ലഭിച്ചു.[a]
