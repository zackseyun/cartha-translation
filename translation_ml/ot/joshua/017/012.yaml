revisions:
- from: എന്നാൽ മനശ്ശെയുടെ മക്കൾക്ക് ഈ പട്ടണങ്ങൾ കൈവശമാക്കിയിരുന്നവരെ അവിടെനിന്ന് ഒഴിപ്പിക്കാൻ കഴിഞ്ഞില്ല; കനാന്യർ ഈ ദേശത്തുതന്നെ പാർക്കാൻ ഉറച്ചുനിന്നു.[a]
  to: എന്നാൽ മനശ്ശെയുടെ മക്കൾക്ക് ഈ പട്ടണങ്ങളിൽനിന്ന് നിവാസികളെ ഒഴിപ്പിക്കാൻ കഴിഞ്ഞില്ല; കനാന്യർ ഈ ദേശത്ത് പാർക്കാൻ ദൃഢനിശ്ചയം ചെയ്തു.[a]
  rationale: The revision removes an interpretively expanded and awkward description of the inhabitants while retaining the contextual dispossession sense in natural Malayalam. It also renders the Canaanites' volition with explicit determination, in line with the Hebrew verb and the English audit trail. The footnote anchor and its lexical function are retained.
