  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: ml
  text: എന്നാൽ മനശ്ശെയുടെ മക്കൾക്ക് ഈ പട്ടണങ്ങളിൽനിന്ന് നിവാസികളെ ഒഴിപ്പിക്കാൻ കഴിഞ്ഞില്ല; കനാന്യർ ഈ ദേശത്ത് പാർക്കാൻ ദൃഢനിശ്ചയം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കനാന്യൻ ഈ ദേശത്ത് പാർക്കാൻ ദൃഢനിശ്ചയം ചെയ്തു.” എബ്രായത്തിൽ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമം ഏകവചനത്തിലാണ്; ക്രിയയ്ക്ക് സന്നദ്ധതയെയോ ദൃഢനിശ്ചയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: കഴിഞ്ഞില്ല
  rationale: കഴിവില്ലായ്മയെയോ സാധിക്കാതിരുന്നതിനെയോ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ മനശ്ശെയുടെ ഗോത്രസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ കൈവശമാക്കിയിരുന്നവരെ അവിടെനിന്ന് ഒഴിപ്പിക്കാൻ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ അധീനതയിൽനിന്ന് നീക്കുക/കൈവശം നഷ്ടപ്പെടുത്തുക എന്ന പ്രദേശിക അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. എബ്രായത്തിൽ പട്ടണങ്ങളാണ് നേരിട്ടുള്ള കർമമെങ്കിലും, ഉദ്ദേശിക്കുന്നത് അവിടത്തെ നിവാസികളെ ഒഴിപ്പിക്കലാണ്.
- source_word: וַיּוֹאֶל
  choice: ഉറച്ചുനിന്നു
  rationale: യാൽ എന്ന ക്രിയയിലെ മനസ്സൊരുക്കം, നിശ്ചയം, തുടർന്നുനിൽക്കാനുള്ള ദൃഢത എന്നിവ സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു; വെറും ആവർത്തിത പ്രവൃത്തി എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും ഇവിടെ ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടവചനമാണ്; മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികം.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: ഈ ദേശത്തുതന്നെ പാർക്കാൻ
  rationale: താമസിച്ചുകൊണ്ടിരിക്കുക എന്ന ആശയവും ചർച്ചയിലുള്ള നിർദിഷ്ട പ്രദേശവും വ്യക്തമാക്കുന്നു; ‘തന്നെ’ അവരുടെ ഉറച്ച നിലപാടിന് സ്വാഭാവിക ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: കനാന്യരുടെ തുടർവാസത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭാവം
  choice: പാർക്കാൻ ഉറച്ചുനിന്നു
  alternative: ഈ ദേശത്ത് പാർക്കുന്നതിൽ തുടർന്നു / പാർക്കാൻ തീരുമാനിച്ചു
  rationale: മൂലക്രിയയിൽ സന്നദ്ധതയും ദൃഢനിശ്ചയവും ഉൾപ്പെടാം. ‘ഉറച്ചുനിന്നു’ ഈ തുറന്ന അർഥപരിധി ഏറെക്കുറെ നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ അധിക കാരണം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പട്ടണങ്ങളെ ഒഴിപ്പിക്കുക’ എന്ന അസ്വാഭാവിക വാച്യത്തിനു പകരം, എബ്രായ ശൈലിയുടെ ഉദ്ദേശ്യം തുറന്നുകാട്ടുന്ന ‘പട്ടണങ്ങൾ കൈവശമാക്കിയിരുന്നവരെ അവിടെനിന്ന് ഒഴിപ്പിക്കുക’ ഉപയോഗിച്ചു. അർധവിരാമം രണ്ട് പരസ്പരബന്ധിത പ്രസ്താവനകളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
