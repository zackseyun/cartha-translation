id: JOS.17.14
reference: Joshua 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְדַבְּרוּ֙ בְּנֵ֣י יוֹסֵ֔ף אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר מַדּוּעַ֩ נָתַ֨תָּה לִּ֜/י נַחֲלָ֗ה גּוֹרָ֤ל אֶחָד֙ וְ/חֶ֣בֶל אֶחָ֔ד וַֽ/אֲנִ֣י עַם רָ֔ב עַ֥ד אֲשֶׁר עַד כֹּ֖ה בֵּֽרְכַ֥/נִי יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: ml
  text: 'അപ്പോൾ യോസേഫിന്റെ മക്കൾ യോശുവയോടു പറഞ്ഞു: “യാഹ്‌വേ ഇന്നുവരെ എന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നതിനാൽ, ഞാൻ ജനസംഖ്യയേറിയ ഒരു ജനമായിരിക്കെ, നീ എനിക്ക് അവകാശമായി ഒരേയൊരു നറുക്കുവിഹിതവും ഒരേയൊരു ഭൂവിഭാഗവും[a] മാത്രം തന്നത് എന്തുകൊണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അളന്നു വേർതിരിച്ച ഒരേയൊരു പ്രദേശം.’ എബ്രായപദത്തിന് അളന്നു നിശ്ചയിച്ച ഭൂവിഹിതം എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף
  choice: യോസേഫിന്റെ മക്കൾ ... പറഞ്ഞു
  rationale: ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിക്കുന്നു.
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: നീ എനിക്ക് അവകാശമായി ... തന്നത്
  rationale: ഭൂമിയുടെ പാരമ്പര്യാവകാശം എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ഏകവചനമായ ‘എനിക്ക്’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: גּוֹרָל אֶחָד
  choice: ഒരേയൊരു നറുക്കുവിഹിതം
  rationale: നറുക്കിട്ടു നിർണയിച്ച വിഹിതം എന്ന ആശയം വ്യക്തമാക്കുകയും തുടർന്നുള്ള חֶבֶל എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְחֶבֶל אֶחָד
  choice: ഒരേയൊരു ഭൂവിഭാഗം
  rationale: അളന്നു വേർതിരിച്ച ഭൂവിഹിതമോ പ്രദേശമോ സൂചിപ്പിക്കുന്ന പദത്തിന് വായനാസൗകര്യമുള്ള മലയാളരൂപം നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲנִי עַם רָב
  choice: ഞാൻ ജനസംഖ്യയേറിയ ഒരു ജനമായിരിക്കെ
  rationale: ഗോത്രസമൂഹം തന്നെക്കുറിച്ച് ഏകവചനത്തിൽ സംസാരിക്കുന്ന എബ്രായരീതി സംരക്ഷിക്കുന്നു; רָב ഇവിടെ പദവിയേക്കാൾ അംഗസംഖ്യയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: യഹോവ ഇന്നുവരെ എന്നെ അനുഗ്രഹിച്ചിരിക്കുന്നതിനാൽ
  rationale: സംക്ഷിപ്തമായ എബ്രായ പ്രയോഗത്തിലെ കാരണബന്ധവും ‘ഇന്നുവരെ’ എന്ന കാലപരിധിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ടുള്ളതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യോസേഫ് ഗോത്രങ്ങളുടെ സമൂഹവാചക ഏകവചനം
  choice: ‘എനിക്ക്’, ‘ഞാൻ’, ‘എന്നെ’ എന്നീ ഏകവചനരൂപങ്ങൾ നിലനിർത്തി
  alternative: ‘ഞങ്ങൾക്ക്’, ‘ഞങ്ങൾ’, ‘ഞങ്ങളെ’ എന്ന ബഹുവചനരൂപങ്ങൾ
  rationale: ‘യോസേഫിന്റെ മക്കൾ’ ബഹുവചനമായിരിക്കുമ്പോഴും അവരുടെ നേരിട്ടുള്ള വാക്കുകളിൽ എബ്രായമൂലം സമൂഹത്തെ ഒരൊറ്റ ഘടകമായി ഏകവചനത്തിൽ അവതരിപ്പിക്കുന്നു; ആ അർഥസമ്മർദം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. ഗോത്രസമൂഹത്തിന്റെ ഏകവചന സ്വയംപരാമർശം ഉദ്ദേശപൂർവം നിലനിർത്തി. ‘നറുക്കുവിഹിതം’ എന്നും ‘ഭൂവിഭാഗം’ എന്നും നൽകി അടുത്തടുത്തുള്ള രണ്ടു എബ്രായ ഭൂവിഹിതപദങ്ങളുടെ വ്യത്യാസം സംരക്ഷിച്ചു.
