  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] ശക്തരായപ്പോൾ, അവർ കനാന്യരെ നിർബന്ധിത വേലയ്ക്ക് വിധേയരാക്കി[b]; എങ്കിലും അവരെ പൂർണമായി തുരത്തിക്കളഞ്ഞില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേല്യർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കനാന്യരെ നിർബന്ധിത സേവനത്തിന് വിധേയരാക്കി’ അല്ലെങ്കിൽ ‘കനാന്യരെ കപ്പത്തിന് വിധേയരാക്കി.’
    reason: lexical_alternative
  - marker: c
    text: ‘പൂർണമായി’ എന്നത് മൂലഭാഷയിലെ ഊന്നലിനെ വ്യക്തമാക്കുന്നു.
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ശക്തരായപ്പോൾ ഇങ്ങനെ സംഭവിച്ചു
  rationale: വിവരണത്തിൽ ഒരു പുതിയ സംഭവവികാസം അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָזְקוּ
  choice: ശക്തരായപ്പോൾ
  rationale: ഇവിടെ ക്രിയ ശക്തി പ്രാപിക്കുന്നതിനെയോ പ്രബലരാകുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘ശക്തരായപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധ പദപ്രയോഗമാണെങ്കിലും, ഒരു ജനസമൂഹത്തിന്റെ പരമ്പരാഗത നാമമായി ആധുനിക മലയാളത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: അവർ കനാന്യരെ നിർബന്ധിതവേലയ്ക്കു വിധേയരാക്കി
  rationale: מַס ഇവിടെ വെറും നികുതിയേക്കാൾ നിർബന്ധിത സേവനത്തെയോ അധ്വാനത്തെയോ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. എബ്രായത്തിലെ ഏകവചന സമൂഹനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: എന്നാൽ അവരെ പൂർണമായി തുരത്തിക്കളഞ്ഞില്ല
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന എബ്രായ ഘടന പ്രവർത്തനത്തെ ഊന്നിപ്പറയുന്നു. ‘പൂർണമായി’ ആ തീവ്രത വ്യക്തമാക്കുന്നു; ‘തുരത്തിക്കളയുക’ അധിവാസസ്ഥലത്തുനിന്ന് പുറത്താക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, ഇത് മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് ദേശീയനാമമാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- issue: מַס എന്ന പദത്തിന്റെ സാമൂഹിക അർഥം
  choice: നിർബന്ധിതവേല
  alternative: കപ്പം / നിർബന്ധിത സേവനം
  rationale: ശേഷിച്ച കനാന്യരെ കീഴ്പ്പെടുത്തിയ സന്ദർഭത്തിൽ നിർബന്ധിത അധ്വാനമാണ് സാധ്യതയേറിയ അർഥം. എങ്കിലും കപ്പം അല്ലെങ്കിൽ പൊതുവായ നിർബന്ധിത സേവനം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിത ദേശീയപദവും, ബലപ്രയോഗത്തിന്റെ സ്വഭാവം മറയ്ക്കാത്ത ‘നിർബന്ധിതവേല’ എന്ന പ്രയോഗവും ഉപയോഗിച്ചു.
