revisions:
- from: 'ഇസ്രായേൽമക്കൾ[a] ശക്തരായപ്പോൾ ഇങ്ങനെ സംഭവിച്ചു: അവർ കനാന്യരെ നിർബന്ധിതവേലയ്ക്കു വിധേയരാക്കി[b]; എന്നാൽ അവരെ പൂർണമായി തുരത്തിക്കളഞ്ഞില്ല[c].'
  to: ഇസ്രായേൽമക്കൾ[a] ശക്തരായപ്പോൾ, അവർ കനാന്യരെ നിർബന്ധിത വേലയ്ക്ക് വിധേയരാക്കി[b]; എങ്കിലും അവരെ പൂർണമായി തുരത്തിക്കളഞ്ഞില്ല[c].
