    rationale: മൂലത്തിൽ വַיְהִי (‘ഉണ്ടായി/വന്നു’)യും לְ (‘ക്കു/വേണ്ടി’)യും മാത്രമാണുള്ളത്; ‘ലഭിച്ചു’ എന്നത് സ്വീകരണപ്രവർത്തി കൂട്ടിച്ചേർക്കുന്നു. ഭൂവിഭജനസന്ദർഭം നിലനിർത്തിക്കൊണ്ട് ‘വിഹിതം ഉണ്ടായിരുന്നു’ എന്നു നൽകുന്നത് മൂലവാക്യത്തിന്റെ അപൂർണമായെങ്കിലും വിതരണസൂചകമായ ഘടനയോട് കൂടുതൽ അടുത്തതാണ്.
