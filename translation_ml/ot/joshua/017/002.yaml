  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂവിഭജനപ്പട്ടികയുടെ ഔപചാരിക ആവർത്തനം നിലനിർത്തിയെങ്കിലും, וַיְהִי എന്ന പ്രയോഗം സന്ദർഭോചിതമായി ‘ഓഹരി ലഭിച്ചു’ എന്നു നൽകി.
