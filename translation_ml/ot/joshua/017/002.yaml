revisions:
- from: 'മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്ക്[a] അവരുടെ കുലങ്ങൾപ്രകാരം[b] ഓഹരി ലഭിച്ചു: അബീയേസെരിന്റെ പുത്രന്മാർക്കും ഹേലെക്കിന്റെ പുത്രന്മാർക്കും അസ്രീയേലിന്റെ പുത്രന്മാർക്കും ശേഖേമിന്റെ പുത്രന്മാർക്കും ഹേഫെരിന്റെ പുത്രന്മാർക്കും ശെമീദായുടെ പുത്രന്മാർക്കും. ഇവർ യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുരുഷസന്തതികളായിരുന്നു[c], അവരുടെ കുലങ്ങൾപ്രകാരം.'
  to: 'മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്ക്[a], അവരുടെ കുലങ്ങൾപ്രകാരം[b], വിഹിതം ഉണ്ടായിരുന്നു: അബീയേസെരിന്റെ പുത്രന്മാർക്കും, ഹേലെക്കിന്റെ പുത്രന്മാർക്കും, അസ്രീയേലിന്റെ പുത്രന്മാർക്കും, ശേഖേമിന്റെ പുത്രന്മാർക്കും, ഹേഫെരിന്റെ പുത്രന്മാർക്കും, ശെമീദായുടെ പുത്രന്മാർക്കും. ഇവർ യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുരുഷസന്തതികളായിരുന്നു[c], അവരുടെ കുലങ്ങൾപ്രകാരം.'
  rationale: സന്ദർഭത്തിൽ നിഗൂഢമായ ഭൂവിഹിതം മലയാളത്തിൽ വ്യക്തമാക്കി, എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ലഭിച്ചു’ എന്ന സ്വീകരണക്രിയ ഒഴിവാക്കി. പട്ടികയുടെ ആവർത്തനഘടന, കുലപരമായ ക്രമീകരണം, പുരുഷസന്തതികളെന്ന സമാപനവിവരണം എന്നിവ സംരക്ഷിച്ചു.
