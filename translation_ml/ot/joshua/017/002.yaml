source:
  edition: WLC
  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: ml
  text: 'മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്ക്[a], അവരുടെ കുലങ്ങൾപ്രകാരം[b], വിഹിതം ഉണ്ടായിരുന്നു: അബീയേസെരിന്റെ പുത്രന്മാർക്കും, ഹേലെക്കിന്റെ പുത്രന്മാർക്കും, അസ്രീയേലിന്റെ പുത്രന്മാർക്കും, ശേഖേമിന്റെ പുത്രന്മാർക്കും, ഹേഫെരിന്റെ പുത്രന്മാർക്കും, ശെമീദായുടെ പുത്രന്മാർക്കും. ഇവർ യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പുരുഷസന്തതികളായിരുന്നു[c], അവരുടെ കുലങ്ങൾപ്രകാരം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനശ്ശെയുടെ ശേഷിച്ച സന്തതികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥമായി ‘മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘കുലങ്ങൾ’ എന്നത് ഹീബ്രു മിഷ്പെഹോത്ത് എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; ഇവിടെ അത് ഒരു ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കുടുംബങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: cultural_note
  - marker: c
    text: ഹീബ്രുവിലെ ‘പുരുഷസന്തതികൾ’ എന്ന ഊന്നൽ, ചുറ്റുപാടിലുള്ള ഭാഗത്ത് പറയുന്ന സെലോഫഹാദിന്റെ പുത്രിമാരിൽനിന്ന് മനശ്ശെയുടെ ഈ പുരുഷവംശരേഖകളെ വേർതിരിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: ഓഹരി ലഭിച്ചു
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ലളിതമായ ‘ഉണ്ടായി’ എന്നതിനേക്കാൾ സ്വാഭാവികമായി വിഹിതലഭ്യത വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ ആഖ്യാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്ക്
  rationale: ‘പുത്രന്മാർ’ എന്ന ഹീബ്രു രൂപം നിലനിർത്തിക്കൊണ്ട്, മുമ്പ് പരാമർശിച്ച വിഭാഗത്തിനു ശേഷമുള്ള മറ്റു വംശരേഖകളെയാണ് ‘ശേഷിച്ച’ എന്നു സൂചിപ്പിക്കുന്നത്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: മִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ അംഗീകൃത ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക അണുകുടുംബത്തെക്കാൾ ‘കുലം’ യോജിക്കുന്നു.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי חֵלֶק
  choice: അബീയേസെരിന്റെ പുത്രന്മാർക്കും ... ഹേലെക്കിന്റെ പുത്രന്മാർക്കും
  rationale: നിയമപരമായ പട്ടികയുടെ ആവർത്തനശൈലിയും לִבְנֵי എന്ന പുത്രബന്ധരൂപവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: הַזְּכָרִים
  choice: പുരുഷസന്തതികൾ
  rationale: ചുറ്റുപാടിലുള്ള സെലോഫഹാദിന്റെ പുത്രിമാരിൽനിന്ന് വേർതിരിച്ച് പുരുഷവംശരേഖകൾക്ക് നൽകുന്ന ഹീബ്രു ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
