  verdict: revise
  source_fidelity: ‘ഓഹരി ലഭിച്ചു’ ഭൂവിഭജനസന്ദർഭത്തിലെ നിഗൂഢമായ വിഹിതത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നുവെങ്കിലും, ഹീബ്രു വാക്യം നേരിട്ട് ‘ഓഹരി’യെയോ ‘ലഭിച്ചു’വിനെയോ പ്രസ്താവിക്കുന്നില്ല. വാക്യത്തിലെ വַיְהִי ... לִבְנֵי ഘടനയുടെ വിതരണ/അനുവിഭജന സ്വഭാവം കൂടുതൽ അടുത്തായി സൂചിപ്പിക്കുന്ന രൂപം അഭികാമ്യമാണ്.
  naturalness: പട്ടികയും ആവർത്തനവും ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമാണ്. ‘അവരുടെ കുലങ്ങൾപ്രകാരം’ എന്ന പ്രയോഗവും ഔപചാരിക പട്ടികശൈലിക്ക് യോജിക്കുന്നു.
  terminology: ‘കുലങ്ങൾ’ മִשְׁפָּחוֹת എന്ന ഗോത്രത്തിനകത്തെ ബന്ധുഘടകത്തിന് യോജിച്ച വിവർത്തനമാണ്. ‘പുരുഷസന്തതികൾ’ הַזְּכָרִים-ന്റെ ഉദ്ദേശ്യമായ പുരുഷവംശജരെ സ്വാഭാവികമായി അറിയിക്കുന്നു. പേരുകളുടെ നിലവിലെ മലയാളരൂപങ്ങൾ നിലനിർത്താം.
