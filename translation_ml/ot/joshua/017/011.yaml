  choice: ആ മൂന്നു മേഖലകൾ
  rationale: נָפֶת ഇവിടെ ഭൂമിശാസ്ത്രപരമോ ഭരണപരമോ ആയ വിഭാഗത്തെ സൂചിപ്പിക്കാം. അനിശ്ചിതമായ ‘ഉയർന്ന പ്രദേശങ്ങൾ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിച്ച വിശാലപദമായ ‘മേഖലകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അവ്യക്തത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
