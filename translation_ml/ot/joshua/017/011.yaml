  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: ml
  text: മനശ്ശെയ്ക്ക് ഇസ്സാഖാറിലും ആശേരിലും ബേത്ത്-ശെയാനും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും[a], ഇബ്ലെയാമും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, ദോരിലെ നിവാസികളും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, ഏൻ-ദോരിലെ നിവാസികളും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, താനാക്കിലെ നിവാസികളും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും, മെഗിദ്ദോയിലെ നിവാസികളും അതിന്റെ ആശ്രിതഗ്രാമങ്ങളും ഉണ്ടായിരുന്നു—ആ മൂന്നു മേഖലകൾ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’; ഒരു പട്ടണത്തെ ആശ്രയിച്ചുള്ള ഗ്രാമങ്ങളെയോ കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ശൈലിപ്രയോഗം.
    reason: cultural_note
  - marker: b
    text: ‘മൂന്നു ജില്ലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പദപ്രയോഗം ദുഷ്കരമാണ്; അത് ഒരു ഭൂമിശാസ്ത്രപരമോ ഭരണപരമോ ആയ വിഭജനത്തെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: മനശ്ശെയ്ക്ക് ... ഉണ്ടായിരുന്നു
  rationale: ל־ സഹിതമുള്ള ഹീബ്രായ അസ്തിത്വപ്രയോഗം ഉടമസ്ഥതയെയോ ഗോത്രവിഹിതത്തിൽ ഉൾപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഇത് ‘മനശ്ശെയ്ക്ക് ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: ഇസ്സാഖാറിലും ആശേരിലും
  rationale: בְ ഇവിടെ ആ ഗോത്രങ്ങളുടെ പ്രദേശങ്ങൾക്കുള്ളിലെ സ്ഥാനം സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ച ഘടന മലയാളത്തിലെ ‘-ലും ... -ലും’ കൊണ്ട് നിലനിർത്തി.
- source_word: בֵּית שְׁאָן
  choice: ബേത്ത്-ശെയാൻ
  rationale: സ്ഥലനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം നൽകി.
- source_word: בְנוֹתֶיהָ
  choice: അതിന്റെ ആശ്രിതഗ്രാമങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’ എന്നാണെങ്കിലും, പ്രധാന പട്ടണത്തെ ആശ്രയിച്ചുള്ള ഗ്രാമങ്ങളെയോ കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗമാണിത്. മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
