- source_word: יֹשְׁבֵי דֹאר
  choice: ദോരിലെ നിവാസികൾ
  rationale: יֹשְׁבֵי എന്ന കർത്തൃവാചക രൂപത്തിന്റെ ‘നിവാസികൾ’ എന്ന അർത്ഥം സംക്ഷിപ്തമായി നിലനിർത്തി.
- source_word: עֵין דֹּר
