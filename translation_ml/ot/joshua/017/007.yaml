translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണ ശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. ഹീബ്രുവിലെ ദിശാസംബന്ധിയായ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
