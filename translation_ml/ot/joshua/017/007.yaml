source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: ml
  text: മനശ്ശെയുടെ അതിർ ആശേരിൽനിന്ന് ശെഖേമിന് അഭിമുഖമായ മിഖ്മെഥാത്ത് വരെയായിരുന്നു[a]. പിന്നെ അതിർ വലത്തോട്ട്[b] ഏൻ-തപ്പുവഹിലെ നിവാസികളിലേക്കു നീങ്ങി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ശെഖേമിന്റെ മുന്നിലുള്ള’ അല്ലെങ്കിൽ ‘ശെഖേമിന് എതിരെയുള്ള’.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘വലത്തോട്ട്’; അതിർത്തിവിവരണങ്ങളിൽ ഇത് ‘തെക്കോട്ട്’ എന്ന ദിശയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഏൻ-തപ്പുവഹ് എന്ന പേരിന്റെ അർഥം ‘തപ്പുവഹിന്റെ ഉറവ്’ എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: അതിർ
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ ഗോത്രഭൂമിയുടെ അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: מֵאָשֵׁר
  choice: ആശേരിൽനിന്ന്
  rationale: מִן അതിർത്തിവിവരണത്തിന്റെ ആരംഭസ്ഥാനം അടയാളപ്പെടുത്തുന്നു; ആശേർ ഇവിടെ ഗോത്രപരമോ ഭൂമിശാസ്ത്രപരമോ ആയ സൂചനയായി നിലനിർത്തുന്നു.
- source_word: הַמִּכְמְתָת
  choice: മിഖ്മെഥാത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: ശെഖേമിന് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי എന്നതിലെ ‘മുന്നിൽ/എതിരായി/അഭിമുഖമായി’ എന്ന സ്ഥലബന്ധം ദിശ അനാവശ്യമായി നിർണ്ണയിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: പിന്നെ അതിർ ... നീങ്ങി
  rationale: അതിർത്തിയുടെ ഗതി വിവരിക്കുന്ന ഹീബ്രു ശൈലിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶל־הַיָּמִין
  choice: വലത്തോട്ട്
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രപരമായി ‘തെക്കോട്ട്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു, അതുവഴി യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: יֹשְׁבֵי
  choice: നിവാസികളുടെ
  rationale: ഒരു സ്ഥലത്ത് പാർക്കുന്ന ജനങ്ങളെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക കൃത്തിനുള്ള സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: עֵין תַּפּוּחַ
  choice: ഏൻ-തപ്പുവഹ്
  rationale: സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; പേരിന്റെ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
