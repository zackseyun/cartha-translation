  - severity: low
    issue: Footnote a does not precisely correspond to the main rendering.
    rationale: The main text uses ‘അഭിമുഖമായ,’ while the note offers ‘മുന്നിലുള്ള’ and ‘എതിരെയുള്ള.’ Including ‘അഭിമുഖമായ’ as an alternative—or treating the note explicitly as alternatives for the spatial phrase—makes the lexical relationship clearer.
