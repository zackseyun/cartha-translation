  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: ml
  text: തപ്പൂഹ് പ്രദേശം മനശ്ശെയ്ക്കുള്ളതായിരുന്നു[a]; എന്നാൽ മനശ്ശെയുടെ അതിർത്തിയോടു ചേർന്ന തപ്പൂഹ് എഫ്രയീമിന്റെ പുത്രന്മാർക്കുള്ളതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘മനശ്ശെയ്ക്ക് തപ്പൂഹ് പ്രദേശം ഉണ്ടായിരുന്നു; എന്നാൽ മനശ്ശെയുടെ അതിർത്തിയോടു ചേർന്ന തപ്പൂഹ് എഫ്രയീമിന്റെ പുത്രന്മാർക്കുള്ളതായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/מְנַשֶּׁה הָיְתָה
  choice: മനശ്ശെയ്ക്കുള്ളതായിരുന്നു
  rationale: לְ എന്ന ഉപസർഗവും היה എന്ന ക്രിയയും ചേർന്ന ഈ പ്രദേശവിഭജനപ്രസ്താവന ഉടമസ്ഥതയെയോ അനുവദിച്ച വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മനശ്ശെയ്ക്കുള്ളതായിരുന്നു’ എന്നത് മൂലത്തിന്റെ ഘടനയോട് അടുത്തുനിൽക്കുന്നതും സ്വാഭാവികവുമാണ്.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: തപ്പൂഹിന്റെ പ്രദേശം
  rationale: אֶרֶץ ഇവിടെ ഒരു രാജ്യത്തെയല്ല, തപ്പൂഹുമായി ബന്ധപ്പെട്ട ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പ്രദേശം’ പട്ടണമായ തപ്പൂഹിനെയും അതിനെ ചുറ്റിയ ഭൂമിയെയും തമ്മിൽ വേർതിരിച്ചറിയാൻ സഹായിക്കുന്നു.
- source_word: תַּפּוּחַ
  choice: തപ്പൂഹ്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְ/תַפּוּחַ
  choice: എന്നാൽ ... തപ്പൂഹ്
  rationale: וְ സാധാരണയായി ‘ഉം/കൂടാതെ’ എന്നാണെങ്കിലും ഇവിടെ തപ്പൂഹിന്റെ പ്രദേശവും അതിർത്തിയിലുള്ള തപ്പൂഹ് പട്ടണവും വ്യത്യസ്ത ഗോത്രങ്ങൾക്കുള്ളതാണെന്ന വൈരുധ്യം പ്രകടമാണ്; അതിനാൽ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: മനശ്ശെയുടെ അതിർത്തിയിലുള്ള
  rationale: അതിർത്തിവിവരണത്തിൽ אֶל സ്ഥാനസാമീപ്യമോ അതിർത്തിയോടുള്ള ബന്ധമോ സൂചിപ്പിക്കുന്നു. ‘അതിർത്തിയിലുള്ള’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്; കൃത്യമായി അതിർത്തിരേഖമേലാണോ അതിനോടു ചേർന്നാണോ എന്ന സൂക്ഷ്മത നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: לִ/בְנֵי אֶפְרָיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർക്കുള്ളതായിരുന്നു
  rationale: בְּנֵי എന്ന ബന്ധുത്വപ്രയോഗം നിലനിർത്തി ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്നു; לְ-യുടെ അനുവദിച്ച ഉടമസ്ഥത ‘ക്കുള്ളതായിരുന്നു’ എന്ന് പ്രകടിപ്പിക്കുന്നു.
