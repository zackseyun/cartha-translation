translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഭൂവിഭജനഭാഷ ഉപയോഗിച്ചു. ‘തപ്പൂഹിന്റെ പ്രദേശം’ എന്നും ‘തപ്പൂഹ്’ എന്നും വേർതിരിച്ചത് മൂലപാഠത്തിലെ ഭൂവിഭാഗവും സ്ഥലനാമവും തമ്മിലുള്ള സാദ്ധ്യമായ വ്യത്യാസം വ്യക്തമാക്കാനാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
