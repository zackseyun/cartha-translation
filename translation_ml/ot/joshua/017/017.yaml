translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘യോസേഫിന്റെ ഭവനം’ എന്ന ഗോത്രപരമായ മൂലഭാഷാ പ്രയോഗം നിലനിർത്തിയപ്പോൾ, എഫ്രയീമിനെയും മനശ്ശെയെയും ചേർത്ത് അതിന്റെ അർഥം ഉടൻ വ്യക്തമാക്കി. കൂട്ടായ ഏകവചനമായ എബ്രായ അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായ ‘നിങ്ങൾ’ ആയി നൽകി.
