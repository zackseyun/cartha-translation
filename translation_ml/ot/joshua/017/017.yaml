  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: ml
  text: 'യോശുവ യോസേഫിന്റെ ഭവനത്തോട്—എഫ്രയീമിനോടും മനശ്ശെയോടും—പറഞ്ഞു: “നിങ്ങൾ അനേകം പേരുള്ള ഒരു ജനസമൂഹമാണ്[a]; നിങ്ങൾക്കു വലിയ ശക്തിയുമുണ്ട്. നിങ്ങൾക്ക് ഒരു ഓഹരി മാത്രം ഉണ്ടായിരിക്കുകയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു വലിയ ജനം.” എബ്രായപ്രയോഗത്തിന് ജനസംഖ്യയെയോ മഹത്ത്വത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഭൂവിഭജനത്തിന്റെ സന്ദർഭം ജനസംഖ്യ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നറുക്ക്.” യോശുവയുടെ പുസ്തകത്തിൽ ഈ പദം പലപ്പോഴും നറുക്കിലൂടെ അനുവദിക്കപ്പെട്ട അവകാശഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഇവിടെ “ഓഹരി” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനം
  rationale: യോസേഫിൽനിന്നുള്ള ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്ന കുടുംബ-ഗോത്ര പ്രയോഗം നിലനിർത്തുന്നു; പിന്നാലെ എഫ്രയീമും മനശ്ശെയും എന്നു വ്യക്തമാക്കുന്നു.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: എഫ്രയീമിനോടും മനശ്ശെയോടും
  rationale: ‘യോസേഫിന്റെ ഭവനം’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന് രണ്ട് ഗോത്രനാമങ്ങളും വ്യക്തമായി നിർവചിക്കുന്നു.
- source_word: עַם רַב
  choice: ജനസംഖ്യയേറിയ ഒരു ജനം
  rationale: רַב എന്ന പദത്തിന് ‘വലിയ’ എന്നും ‘അനേകം’ എന്നും അർഥമാകാം; ഭൂവിഭജനത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ സംഖ്യാബലം മുൻനിൽക്കുന്നു.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: നിങ്ങൾക്കു വലിയ ശക്തിയുമുണ്ട്
  rationale: לָךְ എന്ന ഉടമസ്ഥതാഭാവവും כֹחַ എന്ന ശക്തി/ശേഷി ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: നിങ്ങൾക്ക് ഒരു ഓഹരി മാത്രം ഉണ്ടായിരിക്കുകയില്ല
  rationale: ഭൂമി നറുക്കിട്ട് വിഭജിക്കുന്ന സന്ദർഭത്തിൽ גּוֹרָל ലഭിക്കുന്ന അവകാശഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; ‘മാത്രം’ എന്നത് സന്ദർഭത്തിലെ നിയന്ത്രണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള വാക്കുകളുടെ അവതാരകപ്രയോഗം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
