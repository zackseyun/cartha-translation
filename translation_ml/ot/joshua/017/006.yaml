  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: ml
  text: എന്തെന്നാൽ, മനശ്ശെയുടെ പുത്രിമാർ അവന്റെ പുത്രന്മാരുടെ ഇടയിൽ അവകാശഭാഗം ലഭിച്ചു[a][b]; ഗിലെയാദ് ദേശമാകട്ടെ, മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്കുള്ളതായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മനശ്ശെയുടെ പുത്രിമാർ അവന്റെ പുത്രന്മാരുടെ ഇടയിൽ ഒരു അവകാശഭാഗം അനന്തരാവകാശമായി നേടി.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘അവന്റെ പുത്രന്മാരുടെ ഇടയിൽ’ എന്നാണ്; അവകാശക്രമത്തിൽ പുത്രിമാരെയും പുത്രന്മാരെയും പാഠം വ്യക്തമായി വേർതിരിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: ‘ഗിലെയാദ് ദേശം മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്കായിരുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ഓഹരിവിഭജനത്തിന് വിശദീകരണം നൽകുന്ന ഹീബ്രു ബന്ധപദത്തിന്റെ കാരണാത്മകവും വിശദീകരണാത്മകവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രിമാർ
  rationale: നിർമാണബന്ധം നേരിട്ട് പകർന്നുകൊണ്ട്, തുടർന്നുള്ള ‘പുത്രന്മാർ’ എന്ന പദവുമായുള്ള നിയമപരമായ അവകാശവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: נָחֲלוּ נַחֲלָה
  choice: ഒരു അവകാശം ലഭിച്ചു
  rationale: ഒരേ ധാതുവിലുള്ള ക്രിയ-നാമ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കെ, പാരമ്പര്യഭൂമി ലഭിച്ചതെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּתוֹךְ בָּנָיו
  choice: അവന്റെ പുത്രന്മാരുടെ ഇടയിൽ
  rationale: ‘ഇടയിൽ/മധ്യേ’ എന്ന അർഥവും, പുത്രിമാരും പുത്രന്മാരും തമ്മിലുള്ള മൂലപാഠത്തിലെ വ്യക്തമായ വ്യത്യാസവും സംരക്ഷിക്കുന്നു; ‘അവന്റെ’ എന്നത് മനശ്ശെയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശമാകട്ടെ
  rationale: ഭൂവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നാമവാക്യം സ്വാഭാവികമായി പകർന്നുകൊണ്ട്, ആദ്യ ഉപവാക്യത്തോടുള്ള താരതമ്യവ്യത്യാസം ‘ആകട്ടെ’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: മനശ്ശെയുടെ ശേഷിച്ച പുത്രന്മാർക്കുള്ളതായിരുന്നു
  rationale: ഹീബ്രുവിലെ ‘അവർക്കായി/അവർക്കുള്ളതായി ആയിരുന്നു’ എന്ന ഉടമസ്ഥതയുടെയും ഓഹരിയുടെയും അർഥം പദപ്രയോഗത്തിലെ അനിശ്ചിതത്വം അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
