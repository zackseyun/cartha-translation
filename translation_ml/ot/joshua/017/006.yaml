translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അവകാശഭൂമി വിഭജിക്കുന്ന നിയമ-ചരിത്ര പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘അവകാശം’, ‘പുത്രിമാർ’, ‘പുത്രന്മാർ’ എന്നീ നിർദ്ദിഷ്ട പദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
