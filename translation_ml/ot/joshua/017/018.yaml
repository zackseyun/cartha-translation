  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: ml
  text: എന്നാൽ മലനാട് നിനക്കുള്ളതായിരിക്കും[a]; കാരണം അത് വനപ്രദേശമാണ്. നീ അത് വെട്ടിത്തെളിക്കും; അതിന്റെ അതിരുകൾവരെയുള്ള ഭാഗങ്ങളും നിനക്കുള്ളതായിരിക്കും[b]. നീ കനാന്യരെ അവകാശത്തിൽനിന്ന് നീക്കിക്കളയും; അവർക്ക് ഇരുമ്പുരഥങ്ങളുണ്ടെങ്കിലും അവർ ശക്തരാണെങ്കിലും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മല നിനക്കുള്ളതായിരിക്കും”; ഹീബ്രു പദത്തിന് “മല” എന്നും “മലനാട്” എന്നും അർഥമാകാം. ഇവിടെ യോസേഫിന്റെ ഗോത്രങ്ങൾക്ക് അനുവദിച്ച ഉയർന്ന ഭൂപ്രദേശത്തെയാണ് സാധ്യതയേറിയവിധം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അതിന്റെ പുറംപ്രദേശങ്ങളും” അല്ലെങ്കിൽ “അതിന്റെ അതിരുകളും”; ഹീബ്രു പദം വനമൂടിയ മലനാടിന്റെ അറ്റങ്ങളെയോ പുറംപരിധികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ “കനാന്യൻ … അവനു ഇരുമ്പുരഥമുണ്ട് … അവൻ ശക്തനാണ്” എന്ന് ഏകവചനരൂപങ്ങൾ ഉപയോഗിച്ച് ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: മലനാട്
  rationale: ഭൂവിഭജനത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഇത് ഒരൊറ്റ മലയെയല്ല, ഉയർന്ന ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יִהְיֶה לָּךְ
  choice: നിനക്കുള്ളതായിരിക്കും
  rationale: היה + ל എന്ന പ്രയോഗത്തിലെ ഉടമസ്ഥതയുടെയോ അവകാശനിയോഗത്തിന്റെയോ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יַעַר
  choice: വനപ്രദേശം
  rationale: മരങ്ങൾ നിറഞ്ഞ ഭൂപ്രദേശമെന്ന അർഥം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבֵרֵאתוֹ
  choice: നീ അത് വെട്ടിത്തെളിക്കും
  rationale: പിയേൽ രൂപം വനഭൂമി തെളിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: תֹּצְאֹתָיו
  choice: അതിന്റെ അറ്റങ്ങൾവരെയും
  rationale: ഭൂപ്രദേശത്തിന്റെ പുറംപരിധികളെയും മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: תוֹרִישׁ
  choice: അവകാശത്തിൽനിന്ന് നീക്കിക്കളയും
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירש ഒരാളെ ഭൂമിയുടെ കൈവശാവകാശത്തിൽനിന്ന് പുറത്താക്കുക എന്ന സൈനികവും ഭൂവുടമസ്ഥതാപരവുമായ ആശയം വഹിക്കുന്നു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: ഹീബ്രുവിൽ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: רֶכֶב בַּרְזֶל
  choice: ഇരുമ്പുരഥങ്ങൾ
  rationale: ഇരുമ്പുകൊണ്ട് ബലപ്പെടുത്തിയ രഥങ്ങളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും പതിവുമായ പരിഭാഷ.
- source_word: חָזָק הוּא
  choice: അവർ ശക്തരാണ്
  rationale: ഏകവചന ജനനാമത്തിന്റെ കൂട്ടായ അർഥം മലയാളത്തിൽ ബഹുവചനത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: എന്നാൽ / കാരണം / എങ്കിലും
  rationale: വാക്യത്തിൽ ആവർത്തിക്കുന്ന כִּי വ്യത്യസ്ത സംവാദപ്രവർത്തനങ്ങൾ വഹിക്കുന്നു; സന്ദർഭമനുസരിച്ച് വിരോധം, കാരണം, വഴങ്ങൽ എന്നിവയായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: കനാന്യജനത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടായ ഏകവചനം
  choice: “കനാന്യർ … അവർ” എന്ന ബഹുവചന കൂട്ടർഥം
  alternative: “കനാന്യൻ … അവൻ” എന്ന രൂപപരമായ ഏകവചനം
  rationale: ഹീബ്രു ജനനാമം ഏകവചനരൂപത്തിൽ ഒരു ജനസമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ ബഹുവചനത്തിലൂടെയാണ് കൂടുതൽ വ്യക്തവും സ്വാഭാവികവും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഭൂവിഭജനസന്ദർഭത്തിലെ ഭൗമശാസ്ത്രപരവും അവകാശപരവുമായ ആശയങ്ങൾ വ്യക്തമായി സൂക്ഷിച്ചു; כִּי എന്ന പദത്തിന്റെ ആവർത്തനങ്ങളിൽ ഉള്ള കാരണാത്മകവും വഴങ്ങൽസൂചകവുമായ വ്യത്യാസങ്ങൾ സന്ദർഭാനുസൃതമായി പ്രകടമാക്കി.
