- source_word: וְ/יַתִּיר
  choice: യത്തീർ
  rationale: സ്ഥലപ്പേര് എബ്രായത്തിലെ ആരംഭധ്വനിയായ yod-നെ ‘യ’യായി പ്രതിനിധീകരിച്ച് ലിപ്യന്തരണം ചെയ്തു; മുൻപുള്ള സംയോജകം മലയാളപ്പട്ടികയിലെ വിരാമചിഹ്നത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: וְ/שׂוֹכֹה
  choice: സോഖോ
  rationale: സ്ഥലപ്പേര് എബ്രായ പാഠത്തിലെ ś ധ്വനിയെ പ്രായോഗിക മലയാള ലിപ്യന്തരത്തിൽ ‘സ’യായി നൽകി; മുൻപുള്ള സംയോജകം പട്ടികാസംരചനയിൽ പ്രകടമാകുന്നു.
