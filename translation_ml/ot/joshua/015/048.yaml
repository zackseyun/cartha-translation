  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാരൂപം. ആരംഭത്തിലെ എബ്രായ ‘ഉം/കൂടാതെ’ മുൻവാക്യത്തിലെ പട്ടിക തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഒഴിവാക്കി. എല്ലാ കുറിപ്പടയാളങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
