  text: הַ/קַּ֖יִן גִּבְעָ֣ה וְ/תִמְנָ֑ה עָרִ֥ים עֶ֖שֶׂר וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: ml
  text: ഹക്കയിൻ, ഗിബെയാ, തിമ്നാ—ആകെ പത്തു പട്ടണങ്ങളും അവയോടനുബന്ധിച്ച വാസസ്ഥലങ്ങളും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקַּיִן
  choice: ഹക്കയീൻ
  rationale: പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തിലെ നിർദ്ദിഷ്ടോപസർഗവും ചേർത്ത് ലിപ്യന്തരണം ചെയ്തു.
- source_word: גִּבְעָה
  choice: ഗിബെയ
  rationale: ഇവിടെ ‘കുന്ന്’ എന്ന സാധാരണ അർത്ഥമല്ല, സ്ഥലനാമമാണ്; അതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: תִמְנָה
  choice: തിമ്ന
  rationale: ഓഹരിപ്രദേശത്തിലെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים עֶשֶׂר
  choice: പത്തു പട്ടണങ്ങൾ
  rationale: പ്രദേശപ്പട്ടികയിലെ നഗരകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണ സംഗ്രഹപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പേരെടുത്ത പട്ടണങ്ങളോടു ചേർന്ന ചെറുകിട ആശ്രിത ജനവാസങ്ങളെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഗ്രാമങ്ങൾ’ തെരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. എബ്രായവാക്യത്തിലെ സംഗ്രഹഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് അടയാളം പദവുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നുന്നു; അവിടെ നൽകിയ അടിക്കുറിപ്പ് settlements/villages എന്ന പദത്തിനാണ്, Hak-kain എന്നതിനല്ല. മലയാളത്തിൽ ‘ഗ്രാമങ്ങൾ’ നേരിട്ട് ഉപയോഗിച്ചതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
