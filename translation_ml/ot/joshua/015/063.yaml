  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: ml
  text: എന്നാൽ യെരൂശലേമിൽ വസിച്ചിരുന്ന യെബൂസ്യരെ[a] അവിടെനിന്ന് നീക്കിക്കളയാൻ യെഹൂദാമക്കൾക്കു കഴിഞ്ഞില്ല. അതുകൊണ്ട് യെബൂസ്യർ യെഹൂദാമക്കളോടൊപ്പം യെരൂശലേമിൽ ഇന്നുവരെ വസിച്ചുവരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യെബൂസ്യൻ’ എന്ന ഏകവചനമാണ്; ഇവിടെ അത് ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: എന്നാൽ
  rationale: മുൻപുള്ള ദേശവിഭജനവിവരണത്തിൽനിന്ന് ഒരു അപവാദത്തിലേക്കുള്ള വൈരുധ്യപരമായ മാറ്റം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הַיְבוּסִי
  choice: യെബൂസ്യർ
  rationale: എബ്രായപദം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: യെരൂശലേമിൽ വസിച്ചിരുന്ന
  rationale: പങ്കാളിത്തക്രിയാരൂപം യെബൂസ്യരെ യെരൂശലേമിലെ നിവാസികളായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ വിശേഷണവാക്യമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: לֹא יוכלו
  choice: കഴിഞ്ഞില്ല
  rationale: കഴിഞ്ഞകാല വിവരണത്തിലെ കഴിവില്ലായ്മ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְנֵי יְהוּדָה
  choice: യെഹൂദാമക്കൾ
  rationale: യെഹൂദയുടെ ഗോത്രസന്തതിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന എബ്രായ കുടുംബ-ഗോത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְהוֹרִישָׁם
  choice: അവിടെനിന്ന് നീക്കിക്കളയാൻ
  rationale: ഹിഫീൽ രൂപം കൈവശസ്ഥലത്തുനിന്ന് പുറത്താക്കുകയോ ഉടമസ്ഥത നഷ്ടപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്ഥലസന്ദർഭത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיֵּשֶׁב
  choice: വസിച്ചുവരുന്നു
  rationale: ‘ഇന്നുവരെ’ എന്ന കാലസൂചനയോടൊപ്പം ഭൂതകാലത്തിൽ ആരംഭിച്ച് ആഖ്യാതാവിന്റെ കാലംവരെ തുടരുന്ന അവസ്ഥയെ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: യെഹൂദാമക്കളോടൊപ്പം
  rationale: അസാധാരണമായ എബ്രായ ഘടന ഇവിടെ സഹവാസത്തെ സൂചിപ്പിക്കുന്നു; ‘ഒപ്പം’ ആ ബന്ധം തെറ്റിദ്ധാരണയില്ലാതെ അറിയിക്കുന്നു.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: നേരിട്ടുള്ള സ്ഥലസൂചനയാണ്.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ആഖ്യാതാവിന്റെ കാലംവരെ സ്ഥിതി തുടർന്നുവെന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
theological_decisions:
- issue: בְנֵי יְהוּדָה എന്ന ഗോത്രപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യെഹൂദാമക്കൾ
  alternative: യെഹൂദാജനം / യെഹൂദാഗോത്രക്കാർ
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം അല്ല, യെഹൂദയുടെ ഗോത്രസന്തതിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മക്കൾ’ ഉറവിടത്തിലെ കുടുംബ-ഗോത്രഭാവം നിലനിർത്തുന്നു.
- issue: וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה എന്ന അവസാന വാക്യഭാഗത്തിന്റെ അർഥം
  choice: യെബൂസ്യർ യെഹൂദാമക്കളോടൊപ്പം ... വസിച്ചുവരുന്നു
  alternative: യെബൂസ്യർ യെഹൂദാമക്കളുടെ ഇടയിൽ പാർത്തു / അവരുടെ അരികിൽ പാർത്തു
  rationale: അക്ഷരാർഥത്തിൽ അസാധാരണമായ ഘടനയായിരുന്നാലും സന്ദർഭം സഹവാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഒപ്പം’ ബന്ധത്തിന്റെ സ്വഭാവം അതിരുകടന്ന് നിർവചിക്കാതെ അതു വ്യക്തമാക്കുന്നു.
