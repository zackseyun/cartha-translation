  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വസിച്ചുവരുന്നു’ തുടർച്ചയുടെ ഭാവം നൽകുന്നു; ‘അവിടെനിന്ന്’ എന്നത് യെരൂശലേമിൽനിന്നുള്ള നീക്കത്തെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
