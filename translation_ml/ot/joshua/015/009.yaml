  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: ml
  text: പിന്നെ അതിർ മലയുടെ ശിഖരത്തിൽനിന്ന് നെഫ്തോഹയിലെ ജലത്തിന്റെ ഉറവിലേക്കു വളഞ്ഞു[a]; അവിടെനിന്ന് അത് എഫ്രോൻ പർവതത്തിലെ നഗരങ്ങളിലേക്കു നീണ്ടു. തുടർന്ന് അതിർ ബാലായിലേക്കു വളഞ്ഞു; ബാലാ, അതായത് കിര്യത്ത്-യെയാരീം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അതിർ രേഖ വരച്ചു” / “അതിർ തിരിഞ്ഞു.” ഈ അതിർത്തിവിവരണത്തിൽ ഹീബ്രായ ക്രിയ അതിർത്തിരേഖ വരയ്ക്കുന്നതിനെയോ അതിന്റെ ദിശ മാറുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: വളഞ്ഞ് / വളഞ്ഞു
  rationale: അതിർവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ അതിർത്തിരേഖ ദിശ മാറുന്നതോ ഒരു ഭൂപ്രദേശത്തെ ചുറ്റി രേഖപ്പെടുത്തപ്പെടുന്നതോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘വളഞ്ഞു’ ഭൂപ്രകൃതിസംബന്ധമായ അർഥം നന്നായി നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַגְּבוּל
  choice: അതിർ
  rationale: ഭൂപ്രദേശവിഭജനത്തിന്റെ സന്ദർഭത്തിൽ അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: מֵרֹאשׁ הָהָר
  choice: മലയുടെ മുകളിൽനിന്ന്
  rationale: רֹאשׁ എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: നെഫ്തോവാഹിലെ ജലസ്രോതസ്സ്
  rationale: ഹീബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സ്ഥലനാമബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘നെഫ്തോവാഹ്’ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְיָצָא
  choice: നീണ്ടു
  rationale: അതിർത്തിരേഖ അവിടേക്കു തുടർന്നുപോകുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘പുറപ്പെട്ടു’ ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: എഫ്രോൻമലയിലെ പട്ടണങ്ങൾ
  rationale: ഹീബ്രായ സംയുക്തഘടന അടുത്തായി നിലനിർത്തിക്കൊണ്ട് ‘എഫ്രോൻ മല’ എന്ന ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בַּעֲלָה
  choice: ബാലാ
  rationale: സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരണം.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: അതുതന്നെയാണ് കിര്യത്ത്-യെയാരീം
  rationale: ബാലായെ മറ്റൊരു സ്ഥലനാമത്തോടു തിരിച്ചറിയിക്കുന്ന ഹീബ്രായ സർവനാമപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
