  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രായ അതിർവിവരണത്തിന്റെ ക്രമവും സ്ഥലനാമങ്ങളും സംരക്ഷിച്ചുകൊണ്ട്, അസ്വാഭാവികമായ അക്ഷരാനുവാദങ്ങൾ ഒഴിവാക്കി.
