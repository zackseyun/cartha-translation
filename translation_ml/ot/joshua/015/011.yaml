  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: ml
  text: അതിർത്തി എക്രോന്റെ പാർശ്വത്തേക്കു വടക്കോട്ടു നീങ്ങി[a]. പിന്നെ അതിർത്തി ശിക്കെരോനിലേക്കു തിരിഞ്ഞ്[b], ബാലാ മല കടന്ന് യബ്‌നെയേലിലേക്കു നീങ്ങി. അതിർത്തിയുടെ അറ്റങ്ങൾ കടലോട്ടായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എക്രോന്റെ വടക്കൻ പാർശ്വത്തേക്കു.” ഹീബ്രായത്തിൽ “എക്രോന്റെ പാർശ്വം” എന്ന പ്രയോഗത്തോടൊപ്പം വടക്കോട്ടുള്ള ദിശാസൂചക രൂപവും ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ക്രിയ അതിർത്തിരേഖ ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; “ശിക്കെരോനിലേക്കു വളഞ്ഞ്” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രായം അക്ഷരാർഥത്തിൽ “അതിർത്തിയുടെ പുറപ്പെടുന്ന അറ്റങ്ങൾ കടലോട്ട് ആയിരുന്നു.” ഇത് പടിഞ്ഞാറുള്ള മെഡിറ്ററേനിയൻ കടലിൽ അതിർത്തി അവസാനിച്ചതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
