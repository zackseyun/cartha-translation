  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി ബെൻ-ഹിന്നോം താഴ്‌വരയിലൂടെ യെബൂസ്യന്റെ തെക്കുവശത്തെ മലഞ്ചരിവിലേക്ക്[a] കയറിച്ചെന്നു—അതാണ് യെരൂശലേം. തുടർന്ന് അതിർത്തി ഹിന്നോം താഴ്‌വരയ്ക്കു പടിഞ്ഞാറുള്ള മലമുകളിലേക്ക്[b] കയറിച്ചെന്നു; ആ മല രെഫായീം താഴ്‌വരയുടെ വടക്കേ അറ്റത്താണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘യെബൂസ്യന്റെ തോൾ’ എന്നാണ്; ഇവിടെ ‘തോൾ’ എന്ന ഭൂപ്രകൃതിപദം ‘മലഞ്ചരിവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘കടലിന്റെ ദിശയിലേക്ക്’ എന്നാണ്; എബ്രായ ഭൂമിശാസ്ത്രത്തിൽ ഇത് സാധാരണയായി പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
