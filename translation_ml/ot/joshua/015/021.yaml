  text: וַ/יִּֽהְי֣וּ הֶ/עָרִ֗ים מִ/קְצֵה֙ לְ/מַטֵּ֣ה בְנֵֽי יְהוּדָ֔ה אֶל גְּב֥וּל אֱד֖וֹם בַּ/נֶּ֑גְבָּ/ה קַבְצְאֵ֥ל וְ/עֵ֖דֶר וְ/יָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: ml
  text: 'യെഹൂദാമക്കളുടെ ഗോത്രപ്രദേശത്തിന്റെ അങ്ങേയറ്റത്ത്[a], ഏദോമിന്റെ അതിർത്തിയുടെ ഭാഗത്തുള്ള നെഗെബിൽ[b] ഉണ്ടായിരുന്ന പട്ടണങ്ങൾ ഇവയായിരുന്നു: കബ്സെയേൽ, ഏദെർ, യാഗൂർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാമക്കളുടെ ഗോത്രത്തിന്റെ അറ്റത്തുനിന്നുള്ള’; എബ്രായ പ്രയോഗം യെഹൂദയുടെ പ്രദേശത്തിന്റെ അങ്ങേയറ്റത്തെയോ പുറംവക്കിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നെഗെബ്’ എന്നത് ‘തെക്ക്’ എന്നോ ‘തെക്കൻ പ്രദേശം’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ അത് യെഹൂദയുടെ പ്രത്യേക തെക്കൻ മേഖലയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: ഉണ്ടായിരുന്ന പട്ടണങ്ങൾ ഇവയായിരുന്നു
  rationale: പട്ടണപ്പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: യെഹൂദാമക്കളുടെ ഗോത്രപ്രദേശത്തിന്റെ അങ്ങേയറ്റത്ത്
  rationale: קצה എന്നതിന്റെ അതിർത്തി/അറ്റം എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; מַטֶּה ഗോത്രത്തെയും സന്ദർഭം അതിന്റെ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഗോത്രപ്രദേശം’ എന്ന് വ്യക്തമാക്കി. בְנֵי יְהוּדָה എന്ന പരമ്പരാഗത ഗോത്രനാമം ‘യെഹൂദാമക്കൾ’ എന്ന് നിലനിർത്തി.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ഏദോമിന്റെ അതിർത്തിക്കു നേരെ
  rationale: אֶל നൽകുന്ന ദിശാസൂചന നിലനിർത്തുന്നു; പട്ടണങ്ങൾ അതിർത്തിയോട് ചേർന്നുതന്നെയായിരുന്നു എന്ന് അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: בַּנֶּגְבָּה
  choice: നെഗെബിൽ
  rationale: ഈ ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവിവരണത്തിൽ തെക്കൻ പ്രത്യേക മേഖലയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘തെക്ക്’ എന്ന പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: കബ്സെയേൽ, ഏദെർ, യാഗൂർ
  rationale: എബ്രായ സ്ഥലനാമങ്ങളുടെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പട്ടികയുടെ സ്വാഭാവിക അവതരണത്തിനായി ക്രിയാവിന്യാസം മലയാളരീതിയിൽ ക്രമപ്പെടുത്തി; എബ്രായത്തിലെ ദിശാസൂചനയും ഭൂമിശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
