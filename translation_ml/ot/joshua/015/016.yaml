reference: Joshua 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: ml
  text: 'കാലേബ് പറഞ്ഞു[a]: “കിര്യത്ത്-സേഫെറിനെ ആക്രമിച്ച് അതു കീഴടക്കുന്നവന് ഞാൻ എന്റെ മകൾ അക്സായെ ഭാര്യയായി കൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കിര്യത്ത്-സേഫെറിനെ ആക്രമിച്ച് അതു കീഴടക്കുന്ന ആൾ.”
    reason: אֲשֶׁר ആരംഭിക്കുന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന് ‘…വൻ’ എന്നതിനു പകരമുള്ള സ്വാഭാവിക മലയാളരൂപം.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യമർ എന്ന എബ്രായ ആഖ്യാനരൂപം സംഭവപരമ്പരയിലെ അടുത്ത വാക്കിനെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു നൽകി.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: אֲשֶׁר
  choice: …വൻ
  rationale: അനിശ്ചിത ബന്ധവാക്യത്തെ തുറന്ന വെല്ലുവിളിയായി സ്വാഭാവിക മലയാളത്തിൽ ‘ആക്രമിച്ച് … പിടിച്ചടക്കുന്നവൻ’ എന്ന ഘടനയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: יַכֶּה
  choice: ആക്രമിച്ച്
  rationale: נכה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ നഗരത്തിനെതിരായ സൈനികപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘ആക്രമിക്കുക’ സന്ദർഭത്തിൽ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: קִרְיַת סֵפֶר
  choice: കിര്യത്ത്-സേഫെർ
  rationale: സ്ഥലനാമം അതിന്റെ ഘടകങ്ങളെ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וּלְכָדָהּ
  choice: അതു പിടിച്ചടക്കുന്ന
  rationale: לכד എന്നത് സൈനികസന്ദർഭത്തിൽ പിടിച്ചെടുക്കുക എന്നർത്ഥം; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്, മലയാളത്തിൽ ‘അതു’ എന്നു വ്യക്തമാക്കി.
- source_word: וְנָתַתִּי לוֹ
  choice: അവന് ഞാൻ … കൊടുക്കും
  rationale: കാലേബിന്റെ വാഗ്ദാനവും സ്വീകർത്താവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַכְסָה
  choice: അക്സ
  rationale: വ്യക്തിനാമം ഉറവിടരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: בִתִּי
  choice: എന്റെ മകൾ
  rationale: ബന്ധസൂചന മൂലപാഠത്തിലുള്ളതുപോലെ വ്യക്തമായി നിലനിർത്തി.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിൽ കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനശൈലി. ‘ആക്രമിച്ച്’ സൈനികപ്രവർത്തനവും ‘പിടിച്ചടക്കുന്ന’ വിജയകരമായ നഗരകൈവശപ്പെടുത്തലും വേർതിരിച്ചു നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
