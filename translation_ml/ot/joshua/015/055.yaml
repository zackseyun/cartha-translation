base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/055.yaml
  text: Maon[a], Carmel, Ziph, and Juttah.
translation:
  language: ml
  text: മാവോൻ[a], കർമ്മേൽ, സീഫ്, യുത്താ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായമൂലത്തിൽ ഇവിടെ പട്ടണങ്ങളുടെ പേരുകൾ മാത്രമാണുള്ളത്: “മാവോൻ, കർമ്മേൽ, സീഫ്, യുത്താ.”'
    reason: cultural_note
lexical_decisions:
- source_word: מָעוֹן
  choice: മാവോൻ
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമമായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: כַּרְמֶל
  choice: കർമ്മേൽ
  rationale: ഇവിടെ യെഹൂദാപ്രദേശത്തെ പട്ടണത്തിന്റെ പേരാണ്; പൊതുനാമമായി വിവർത്തനം ചെയ്യാതെ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וָזִיף
  choice: സീഫ്
  rationale: ו എന്ന സംയോജകത്തോടുകൂടിയ זִיף എന്ന സ്ഥലനാമം; പട്ടികയുടെ മലയാള വാക്യഘടനയിൽ സംയോജകം അവസാന പേരിനു മുമ്പ് സ്വാഭാവികമായി നൽകി.
- source_word: וְיוּטָּה
  choice: യുത്താ
  rationale: ו എന്ന സംയോജകത്തോടുകൂടിയ יוּטָּה എന്ന സ്ഥലനാമം; ഹീബ്രായത്തിലെ ഇരട്ട ട് ശബ്ദത്തെ പ്രതിഫലിപ്പിക്കുന്ന പരമ്പരാഗത മലയാളരൂപമായ ‘യുത്താ’ സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്ഥലനാമങ്ങളുടെ പട്ടിക എന്ന മൂലരൂപം ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലിയിൽ നിലനിർത്തി. ഹീബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘ו’ സംയോജകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിക്ക് അനുസരിച്ച് അവസാന പേരിനു മുമ്പുള്ള ഒറ്റ ‘എന്നിവയും/ഉം’ രൂപത്തിലാക്കാതെ ചിഹ്നവിന്യാസത്തിലൂടെ അവതരിപ്പിച്ചു; അവസാന സംയോജനം കോമയാൽ സൂചിപ്പിക്കുന്നതിനേക്കാൾ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരുകൾ കോമകൊണ്ട് വേർതിരിച്ചു.
