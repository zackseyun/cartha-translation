translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കയറിച്ചെന്നു’ എന്നത് ഭൂമിശാസ്ത്രപരമായ കയറ്റവും സൈനികമായി എതിരേ നീങ്ങുന്നതും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; വൈരഭാവം ‘ക്കെതിരെ’ വ്യക്തമാക്കുന്നു. മൂലത്തിലെ പശ്ചാത്തലവിവരം പരാന്തീസിൽ നിലനിർത്തി.
