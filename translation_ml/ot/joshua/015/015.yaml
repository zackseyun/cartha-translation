- source_word: קִרְיַת סֵפֶר
  choice: കിര്യത്ത്-സേഫെർ
  rationale: സ്ഥലനാമം മുഖ്യവാചകത്തിൽ ലിപ്യന്തരണം ചെയ്തു; ഘടകപദങ്ങളിൽനിന്ന് ലഭിക്കാവുന്ന അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
