  yaml_path: translation/ot/joshua/015/049.yaml
  text: and Dannah[a], and Kiriath-sannah (that is, Debir),
translation:
  language: ml
  text: ദന്നായും കിര്യത്ത്-സന്നായും (അതായത് ദെബീർ),
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַנָּה
  choice: ദന്ന
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: קִרְיַת סַנָּה
  choice: കിര്യത്ത്-സന്ന
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ രൂപം നിലനിർത്താനും קִרְיַת എന്ന ഘടകം ‘നഗരം’ എന്നു പരിഭാഷപ്പെടുത്തി പേരിന്റെ സ്വഭാവം മറയ്ക്കാതിരിക്കാനും ലിപ്യന്തരിച്ചു.
- source_word: הִיא
  choice: അതുതന്നെ
  rationale: കിര്യത്ത്-സന്നയും ദെബീരും ഒരേ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നുവെന്ന മൂലപാഠത്തിലെ സമീകരണം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: דְבִר
  choice: ദെബീർ
  rationale: കിര്യത്ത്-സന്നയുടെ മറ്റൊരു പേരായി വരുന്ന സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְ
  choice: യും
  rationale: പട്ടികയിലെ സംയോജകഘടന മലയാളത്തിലെ സ്വാഭാവിക അനുബന്ധപ്രത്യയത്തിലൂടെ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്ഥലനാമപ്പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ‘അത് ദെബീർ’ എന്ന തിരിച്ചറിയൽ കോഷ്ഠകത്തിൽ സ്വാഭാവികമായി നൽകി.
