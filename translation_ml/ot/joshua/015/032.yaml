lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: ലെബാവോത്ത്
  rationale: പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന പട്ടികയുടെ സ്വാഭാവിക മലയാളരൂപത്തിൽ ആദ്യത്തെ വാവ് പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: וְשִׁלְחִים
  choice: ശിൽഹീം
  rationale: സ്ഥലനാമം എന്ന നിലയിൽ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וְעַיִן
  choice: അയീൻ
  rationale: ഇവിടെ ‘കണ്ണ്/ഉറവ’ എന്ന പൊതുനാമമല്ല, സ്ഥലനാമമാണ്; അതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: וְרִמּוֹן
  choice: രിമ്മോൻ
  rationale: ‘മാതളം’ എന്ന പൊതുവായ അർഥം സാധ്യമെങ്കിലും പട്ടണപ്പട്ടികയിൽ ഇത് സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: ആകെ ഇരുപത്തൊൻപത് പട്ടണങ്ങൾ
  rationale: പട്ടികയിലെ പട്ടണങ്ങളുടെ മൊത്തം എണ്ണം സൂചിപ്പിക്കുന്ന എബ്രായ സംഗ്രഹപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ
  rationale: חָצֵר ഇവിടെ പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമങ്ങളെയോ ചെറുകുടിയിരുപ്പുകളെയോ സൂചിപ്പിക്കുന്നു; ‘ഗ്രാമങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും വ്യക്തമായ പദമാണ്.
