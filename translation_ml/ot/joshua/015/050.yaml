lexical_decisions:
- source_word: עֲנָב
  choice: അനാബ്
  rationale: പട്ടണപ്പേരായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶשְׁתְּמֹה
  choice: എഷ്ടെമോ
  rationale: സ്ഥലപ്പേരായതിനാൽ ലിപ്യന്തരിച്ചു; ശിൻ-താവ് സംയോജനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഷ്ട’ എന്നും അവസാനത്തെ സ്വരം ‘മോ’ എന്നും പ്രതിനിധീകരിച്ചു.
- source_word: עָנִים
  choice: അനീം
  rationale: ബഹുവചനരൂപംപോലെ തോന്നുന്നെങ്കിലും ഇവിടെ സ്ഥലപ്പേരാണ്; എബ്രായത്തിലെ ദീർഘസ്വരവും അവസാന വ്യഞ്ജനവും സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘അനീം’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: മൂന്നു സ്ഥലപ്പേരുകളെ ബന്ധിപ്പിക്കുന്ന ആവർത്തിത സംയോജകമാണ്; സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ കോമകളാൽ ബന്ധിപ്പിച്ചു.
