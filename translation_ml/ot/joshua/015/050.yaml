translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടണങ്ങളുടെ പട്ടികയ്ക്കനുയോജ്യമായ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
