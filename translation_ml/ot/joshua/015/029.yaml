  text: בַּעֲלָ֥ה וְ/עִיִּ֖ים וָ/עָֽצֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/029.yaml
  text: Baalah[a], Iyyim[c][b], and Ezem.
translation:
  language: ml
  text: ബാലാ[a], ഇയ്യീം[b], ഏസെം[c] എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിൽ സമാന്തര പട്ടികകളുടെ സ്വാധീനത്താൽ ഈ പേര് ‘ബാല’ എന്നു കാണുന്നു; മസോററ്റിക് പാഠത്തിൽ ‘ബാലാ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘ഇയ്യീം’ എന്ന പേരിന് ‘അവശിഷ്ടങ്ങൾ’ അഥവാ ‘കൂമ്പാരങ്ങൾ’ എന്നർത്ഥമുള്ള ഹീബ്രു പദവുമായി ബന്ധമുണ്ടാകാം; എന്നാൽ ഇവിടെ അത് സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
    reason: lexical_alternative
  - marker: c
    text: ചില വിവർത്തനപാരമ്പര്യങ്ങളിൽ ഈ പേര് ‘അസെം’ എന്നു ലിപ്യന്തരിക്കുന്നു; ഈ വാക്യത്തിലെ ഹീബ്രു സ്വരീകരണത്തെ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ ‘ഏസെം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: ബാലാ
  rationale: പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു മസോററ്റിക് രൂപമായ Baʿălāh-നോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עִיִּים
  choice: ഇയ്യീം
  rationale: ഇത് ഇവിടെ ഒരു സ്ഥലനാമമാണ്. പദത്തിന് ‘അവശിഷ്ടങ്ങൾ/കൂമ്പാരങ്ങൾ’ എന്ന പദാർത്ഥബന്ധം ഉണ്ടായേക്കാമെങ്കിലും സന്ദർഭത്തിൽ വിവർത്തനം ചെയ്യാതെ, ഇരട്ട യോദിനെയും ദീർഘസ്വരത്തെയും സൂചിപ്പിക്കുന്നവിധം ലിപ്യന്തരിച്ചു.
- source_word: עָצֶם
  choice: ഏസെം
  rationale: പട്ടണനാമം ലിപ്യന്തരിച്ചു; ഈ വാക്യത്തിലെ മസോററ്റിക് സ്വരീകരണത്തെ അനുസരിച്ച് ആദ്യസ്വരം ‘ഏ’ എന്നും צ-യെ മലയാളവായനയ്ക്ക് സ്വാഭാവികമായ ‘സ’ എന്നും പ്രതിനിധീകരിച്ചു.
- source_word: וְ / וָ
  choice: എന്നിവയും
  rationale: ഈ വാക്യം മുൻവാക്യങ്ങളിൽ തുടരുന്ന പട്ടികയുടെ ഭാഗമായതിനാൽ, ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാസമാപക പ്രയോഗമായ ‘എന്നിവയും’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകി; വാക്യം മുൻപത്തെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ‘എന്നിവയും’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പേരുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
