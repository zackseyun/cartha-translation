  source_fidelity: ഹീബ്രു വാക്യത്തിലെ ദാതൃവിഭക്തിയോടുകൂടിയ കാലേബ്, വ്യക്തമാക്കാത്ത കർത്താവുള്ള ‘നൽകി,’ യെഹൂദാമക്കളുടെ ഇടയിലെ ഓഹരി, യഹ്‌വെ യോശുവയോടു നൽകിയ കൽപന, കിര്യത്ത്-അർബാ/ഹെബ്രോൻ തിരിച്ചറിയൽ എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘അർബാ’യാണ് അനാക്കിന്റെ പിതാവെന്ന് പരന്തസിസിലൂടെ വ്യക്തമാക്കുന്നത് മൂലപാഠത്തിലെ അപ്പൊസിഷന്റെ ശരിയായ വ്യാപ്തി സൂക്ഷിക്കുന്നു. ‘അവൻ’ എന്ന സർവനാമം കർത്താവിനെ നിർണയിക്കാതെ വയ്ക്കുന്നു.
  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വായിക്കാവുന്ന, മാന്യമായ ബൈബിൾഗദ്യമാണ്. ‘ഓഹരി നൽകി,’ ‘ഇടയിൽ,’ ‘അതായത് ഹെബ്രോൻ’ എന്നിവ സ്വാഭാവികമാണ്. ഡാഷും കോലണും ഇവിടെ വിശദീകരണാത്മകമായ സ്ഥലനാമ-അപ്പൊസിഷൻ വ്യക്തമാക്കാൻ പ്രവർത്തിക്കുന്നു.
