id: JOS.15.13
reference: Joshua 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: ml
  text: 'യെഫുന്നെയുടെ മകനായ കാലേബിന് അവൻ യെഹൂദാമക്കളുടെ ഇടയിൽ ഒരു ഓഹരി നൽകി—യഹ്‌വെ യോശുവയോടു കല്പിച്ചതനുസരിച്ച്[a]: കിര്യത്ത്-അർബാ (അർബാ അനാക്കിന്റെ പിതാവായിരുന്നു[b]), അതായത് ഹെബ്രോൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “യഹ്‌വെയുടെ വചനമനുസരിച്ച്.” ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “യഹ്‌വെയുടെ വായനുസരിച്ച്” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: “പിതാവ്” എന്നതിന് ഇവിടെ “പൂർവികൻ” എന്നോ “സ്ഥാപകൻ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ കാലേബിന്
  rationale: സംയോജകവും ദാതൃവിഭക്തിയും സ്വാഭാവികമായ മലയാള വാക്യാരംഭത്തിൽ ഉൾപ്പെടുത്തി; പിതൃപുത്രബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: נָתַן חֵלֶק
  choice: അവൻ ... ഒരു ഓഹരി നൽകി
  rationale: ഹീബ്രുവിലെ സകർമ്മക ക്രിയയും വ്യക്തമാക്കാത്ത കർത്താവും നിലനിർത്തുന്നു; ‘ഓഹരി’ ഭൂപങ്കിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: യെഹൂദാമക്കളുടെ ഇടയിൽ
  rationale: ‘യെഹൂദയുടെ മക്കൾ’ എന്ന ഗോത്രസൂചന മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֶל־פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: യഹ്‌വെ യോശുവയോടു കല്പിച്ചതനുസരിച്ച്
  rationale: ‘വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സാഹചര്യോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യോശുവയാണ് കല്പനയുടെ സ്വീകരിതാവ് എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബാ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִי הָעֲנָק
  choice: അർബാ അനാക്കിന്റെ പിതാവായിരുന്നു
  rationale: അപ്പൊസിഷൻ അർബായെയാണ് വിശേഷിപ്പിക്കുന്നതെന്ന് വ്യക്തമായി കാണിക്കുന്നു; אָב എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘പിതാവ്’ നിലനിർത്തുന്നു.
- source_word: הִיא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോൻ
  rationale: രണ്ടു സ്ഥലനാമങ്ങളും ഒരേ നഗരത്തെ സൂചിപ്പിക്കുന്നുവെന്ന തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘നൽകി’ എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവൻ ... നൽകി’ എന്നു കർത്താവിനെ വ്യക്തമാക്കാതെ നിലനിർത്തി.
  alternative: ‘യോശുവ നൽകി’ എന്നോ ‘യഹ്‌വെ നൽകി’ എന്നോ വ്യക്തമാക്കുക.
  rationale: ഹീബ്രു വാക്യത്തിൽ കർത്താവ് തുറന്നു പറഞ്ഞിട്ടില്ല. ഏതെങ്കിലും ഒരാളെ പേരെടുത്ത് കർത്താവാക്കുന്നത് മൂലപാഠത്തിലെ യഥാർഥമായ അവ്യക്തത പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു; മൂലപാഠത്തിലെ വ്യക്തമാക്കാത്ത കർത്താവ് സംരക്ഷിച്ചു.
