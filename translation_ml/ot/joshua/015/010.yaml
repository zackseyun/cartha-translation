  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി ബാലായിൽനിന്ന് പടിഞ്ഞാറോട്ട്[a] സേയീർ മലയിലേക്കു തിരിഞ്ഞു. അത് യെയാരീം മലയുടെ വടക്കൻ വശത്തേക്കു കടന്നുപോയി; അതാണ് കെസാലോൻ. പിന്നെ അത് ബേത്ത്-ശേമെശിലേക്കു ഇറങ്ങി, തിമ്നയിലേക്കു കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കടലോട്ട്’; പടിഞ്ഞാറോട്ട് എന്നതിനുള്ള പതിവു ദിശാസൂചകപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: അതിർത്തി ... തിരിഞ്ഞ്
  rationale: അതിർത്തിവിവരണത്തിൽ ക്രിയ അതിർത്തിരേഖയുടെ ദിശാമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; ആ ഭൂപ്രകൃതിപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִבַּעֲלָה
  choice: ബാലായിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്[a]
  rationale: അക്ഷരാർഥത്തിൽ ‘കടലോട്ടു’ എന്ന ദിശാസൂചകപ്രയോഗമാണെങ്കിലും ഇസ്രായേൽദേശത്തിന്റെ സാഹചര്യത്തിൽ ‘പടിഞ്ഞാറോട്ട്’ എന്നാണ് ഉദ്ദേശ്യം.
- source_word: אֶל הַר שֵׂעִיר
  choice: സേയീർ മലയിലേക്ക്
  rationale: הַר എന്നത് മലയെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ അതിർത്തിയിലെ ഒരു നിർദിഷ്ട ഭൂപ്രദേശചിഹ്നമായതിനാൽ ‘സേയീർ മല’ എന്ന് നൽകി.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: ചരിവിലൂടെ കടന്നുപോയി
  rationale: כֶּתֶף എന്നതിന്റെ അടിസ്ഥാനചിത്രം ‘തോൾ/വശം’ എന്നതാണ്; മലയുടെ സന്ദർഭത്തിൽ ‘ചരിവ്’ സ്വാഭാവികമായ ഭൂപ്രകൃതിപദമാണ്. וְעָבַר അതിർത്തി ആ ഭാഗത്തുകൂടി നീളുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: യെയാരീം മലയുടെ വടക്കൻ ചരിവ്
  rationale: മലയുടെ വടക്കുവശത്തെ നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ പദബന്ധം മലയാളത്തിൽ ക്രമപ്പെടുത്തി.
- source_word: הִיא כְסָלוֹן
  choice: അതാണ് കെസാലോൻ
  rationale: മുമ്പു പറഞ്ഞ ഭൂപ്രദേശത്തെ കെസാലോൻ എന്നു തിരിച്ചറിയിക്കുന്ന വിശദീകരണം നേരിട്ട് നിലനിർത്തി.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലേക്കു ഇറങ്ങി
  rationale: ഉയരത്തിൽനിന്നുള്ള താഴോട്ടുള്ള നീക്കം സൂചിപ്പിക്കുന്ന ഭൂപ്രകൃതിപരമായ ക്രിയയുടെ അർഥം സംരക്ഷിച്ചു.
- source_word: וְעָבַר תִּמְנָה
  choice: തിമ്നയിലേക്കു കടന്നുപോയി
  rationale: ദിശാസൂചകമായ ה־യെ ‘ലേക്ക്’ എന്നു നൽകി; അതിർത്തിരേഖയുടെ തുടർന്നുള്ള നീക്കം ‘കടന്നുപോയി’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
