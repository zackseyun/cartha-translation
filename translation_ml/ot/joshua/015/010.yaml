translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭൂപ്രദേശവിവരണശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മൂലഭാഷയുടെ രൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; അതിർത്തിയെ തുടർച്ചയായ ഏകവചന കർത്താവായി നിലനിർത്തി.
