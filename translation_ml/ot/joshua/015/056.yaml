lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: യിസ്രെയേൽ
  rationale: യെഹൂദയുടെ അവകാശഭൂമിയിലെ ഒരു പട്ടണനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: יָקְדְעָם
  choice: യൊക്ദെയാം
  rationale: പട്ടണനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; ആദ്യ സ്വരം മാസോററ്റിക് പാഠത്തിലെ qamets qatan പ്രകാരം ‘യൊ’ എന്നു നൽകി.
- source_word: זָנוֹחַ
  choice: സാനോവഹ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; അവസാനത്തെ ח എന്ന തൊണ്ടയൊലി മലയാളത്തിൽ ഏകദേശമായി ‘ഹ്’ കൊണ്ട് പ്രതിനിധീകരിച്ചു.
- source_word: וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: എബ്രായത്തിലെ ആവർത്തിത സംയോജകങ്ങൾ ലളിതമായ നാമപ്പട്ടികയെ ബന്ധിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അവയെ കോമകൾകൊണ്ട് പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. വാക്യം പട്ടികാരൂപത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
