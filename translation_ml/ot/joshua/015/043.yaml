lexical_decisions:
- source_word: יִפְתָּח
  choice: യിഫ്താഹ്
  rationale: യെഹൂദയിലെ പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമം; എബ്രായ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരം ചെയ്തു. ന്യായാധിപന്റെ പരിചിതമായ പേരുമായി അനാവശ്യമായി ഏകീകരിച്ചിട്ടില്ല.
- source_word: אַשְׁנָה
  choice: അശ്നാ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ഉച്ചാരണത്തോട് അടുത്ത, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: נְצִיב
  choice: നെസീബ്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരം ചെയ്തു; എബ്രായ צ എന്ന അക്ഷരത്തിന്റെ ഉച്ചാരണത്തെ ‘സ’ എന്നും കൂടുതൽ കൃത്യമായി ‘ത്സ’ എന്നും പ്രതിനിധീകരിക്കാവുന്നതിനാൽ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְ
  choice: എന്നിവയും
  rationale: ഈ വാക്യം മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ, ഓരോ പേരിനുമുമ്പും ‘ഉം’ ആവർത്തിക്കുന്നതിനു പകരം സ്വാഭാവിക മലയാള പട്ടികാശൈലിയിൽ അവസാനത്തിൽ ‘എന്നിവയും’ ഉപയോഗിച്ചു; ബന്ധകത്തിന്റെ പട്ടികാതുടർച്ച നിലനിർത്തുന്നു.
