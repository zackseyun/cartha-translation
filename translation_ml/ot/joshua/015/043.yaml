translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
