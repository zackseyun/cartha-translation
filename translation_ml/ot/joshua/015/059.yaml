source:
  edition: WLC
  text: וּ/מַעֲרָ֥ת וּ/בֵית עֲנ֖וֹת וְ/אֶלְתְּקֹ֑ן עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: ml
  text: മഅരാത്ത്, ബേത്ത്-അനോത്ത്, എൽതെക്കോൻ എന്നിവയും—അവയുടെ ഗ്രാമങ്ങളോടുകൂടെ ആറ് പട്ടണങ്ങൾ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവയുടെ അധീന ജനവാസകേന്ദ്രങ്ങളോടുകൂടെ’ അഥവാ ‘അവയുടെ ചെറുഗ്രാമങ്ങളോടുകൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ഗ്രാമീണ ജനവാസസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַעֲרָת
  choice: മയാരാത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; മുൻപിലെ וּ സംയോജകത്തെ മലയാള വാക്യഘടനയ്ക്കനുസരിച്ച് പട്ടികയുടെ അവസാനത്തിലുള്ള ‘എന്നിവയും’ എന്നതിൽ ഉൾപ്പെടുത്തി.
- source_word: וּבֵית עֲנוֹת
  choice: ബേത്ത്-അനോത്ത്
  rationale: בֵית ഉൾപ്പെട്ട സംയുക്ത സ്ഥലനാമം; അതിനെ ‘അനോത്തിന്റെ വീട്’ എന്നു വിവർത്തനം ചെയ്യാതെ, പേരിന്റെ ഘടന വ്യക്തമാക്കാൻ ഹൈഫനോടെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶלְתְּקֹן
  choice: എൽത്തെക്കോൻ
  rationale: സ്ഥലനാമമായതിനാൽ ഹീബ്രു രൂപത്തെ പിന്തുടർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: അതിർത്തി-പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും വലുപ്പത്തെക്കുറിച്ച് അനാവശ്യമായ ആധുനിക ധാരണകൾ ചുമത്താത്തതുമാണ്.
- source_word: שֵׁשׁ
  choice: ആറു
  rationale: പട്ടണങ്ങളുടെ ആകെ എണ്ണം സൂചിപ്പിക്കുന്ന സംഖ്യ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ
  rationale: חָצֵר ഇവിടെ പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ ജനവാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബന്ധവും ഉൾപ്പെടുത്തലും സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഉൾപ്പെടെ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. ഇത് മുമ്പത്തെ വാക്യത്തിൽ തുടരുന്ന സ്ഥലനാമപ്പട്ടികയായതിനാൽ ഓരോ പേരിനുമുമ്പും ‘കൂടാതെ’ ആവർത്തിക്കാതെ, അവസാനത്തിൽ ‘എന്നിവയും’ ചേർത്ത് ഹീബ്രുവിലെ സംയോജകങ്ങളുടെ പ്രവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
