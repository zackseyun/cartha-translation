revisions:
- from: മയാരാത്ത്, ബേത്ത്-അനോത്ത്, എൽത്തെക്കോൻ എന്നിവയും—അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ ആറു പട്ടണങ്ങൾ.[a]
  to: മഅരാത്ത്, ബേത്ത്-അനോത്ത്, എൽതെക്കോൻ എന്നിവയും—അവയുടെ ഗ്രാമങ്ങളോടുകൂടെ ആറ് പട്ടണങ്ങൾ.[a]
  rationale: The revision corrects the two place-name transliterations against the Hebrew, retains the list-continuation force of the conjunction through ‘എന്നിവയും,’ and uses a coordination-based Malayalam expression for ‘cities and their villages.’ The footnote remains accurately anchored to the rendering of חַצְרֵיהֶן and preserves the lexical alternatives without overstating the term’s exact administrative scope.
