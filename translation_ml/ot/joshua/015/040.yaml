lexical_decisions:
- source_word: כַבּוֹן
  choice: കബ്ബോൻ
  rationale: പട്ടണപ്പേരായതിനാൽ അർത്ഥപരിഭാഷ ചെയ്യാതെ എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തെ മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: לַחְמָס
  choice: ലഹ്മാസ്
  rationale: എബ്രായ ח-യുടെ ഉച്ചാരണം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സൂചിപ്പിക്കാൻ ‘ഹ’ ഉപയോഗിച്ച് സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: כִתְלִישׁ
  choice: കിത്ലീശ്
  rationale: എബ്രായ നാമത്തിന്റെ വ്യഞ്ജനക്രമവും ദീർഘമായ ī സ്വരവും സാധ്യമായത്ര നിലനിർത്തി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: ഓരോ പേരിനുമുമ്പുമുള്ള എബ്രായ സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ പട്ടികാശൈലിയിൽ കോമകൾകൊണ്ട് അവതരിപ്പിച്ചു; അവസാനത്തെ ‘ഉം’ നിർബന്ധമായി ചേർക്കുന്നത് പേരിന്റെ ഭാഗമെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാമെന്നതിനാൽ ഒഴിവാക്കി.
