source:
  edition: WLC
  text: וְ/חֻמְטָ֗ה וְ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן וְ/צִיעֹ֑ר עָרִ֥ים תֵּ֖שַׁע וְ/חַצְרֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: ml
  text: ഹുമ്താ, കിര്യത്ത്-അർബാ—അതായത് ഹെബ്രോൻ[a]—സീയോർ എന്നിവ; അവയുടെ ഗ്രാമങ്ങളോടുകൂടെ ഒൻപതു പട്ടണങ്ങൾ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കിര്യത്ത്-അർബാ—അതായത് ഹെബ്രോൻ” എന്ന എബ്രായ പ്രയോഗം കിര്യത്ത്-അർബാ ഹെബ്രോൻ തന്നെയാണെന്ന് തിരിച്ചറിയിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: “ഗ്രാമങ്ങൾ” എന്നതിന് “അനുബന്ധ ജനവാസകേന്ദ്രങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ചെറിയ ജനവാസങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: ഹുമ്താ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബാ
  rationale: ഇവിടെ സ്ഥിരമായ സ്ഥലനാമമായി വരുന്നതിനാൽ ‘അർബായുടെ നഗരം’ എന്നു വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הִיא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോൻ
  rationale: കിര്യത്ത്-അർബാ എന്ന പഴയ പേരിനെ ഹെബ്രോനുമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִיעֹר
  choice: സീയോർ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים תֵּשַׁע
  choice: ആകെ ഒൻപതു പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദത്തിന് ഈ ഭൂപ്രദേശപ്പട്ടികയിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; സംഖ്യ പട്ടികയിലെ മൊത്തത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആകെ’ ചേർത്തു.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: മുഖ്യ പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ചെറുകിട അധീന ജനവാസങ്ങളെ സൂചിപ്പിക്കാവുന്ന പദമാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഗ്രാമങ്ങൾ’ തെരഞ്ഞെടുത്തു, വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
