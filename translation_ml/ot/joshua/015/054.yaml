translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; പട്ടികയുടെ മൊത്തസംഖ്യയും അനുബന്ധ ജനവാസങ്ങളുമായുള്ള ബന്ധവും സ്വാഭാവിക വാക്യക്രമത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
