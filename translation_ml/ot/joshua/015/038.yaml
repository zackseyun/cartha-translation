lexical_decisions:
- source_word: דִלְעָן
  choice: ദിലെയാൻ
  rationale: യെഹൂദയിലെ പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സ്ഥലനാമം; മസോരറ്റിക് സ്വരീകരണത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הַמִּצְפֶּה
  choice: മിസ്പെ
  rationale: രൂപത്തിൽ നിർദ്ദിഷ്ടോപപദം ഉണ്ടായിരുന്നാലും, ഈ പട്ടണപ്പട്ടികയിൽ ഇത് ‘കാവൽഗോപുരം’ എന്നു വിവർത്തനം ചെയ്യേണ്ട പൊതുനാമമല്ല, സ്ഥലനാമമായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ നിർദ്ദിഷ്ടോപപദം വേർതിരിക്കാതെ ലിപ്യന്തരിച്ചു.
- source_word: יָקְתְאֵל
  choice: യോക്തെയേൽ
  rationale: സ്ഥലനാമം; മസോരറ്റിക് സ്വരീകരണത്തിലെ യാ/യോഖ്‌തെഏൽ രൂപം പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
