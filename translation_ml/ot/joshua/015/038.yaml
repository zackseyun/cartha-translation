translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടണപ്പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി. എബ്രായ വാക്യത്തിലെ ആവർത്തിച്ചുള്ള ‘וְ’ സംയോജകത്തെ മലയാളത്തിൽ പട്ടികാവസാനത്തിലെ ‘എന്നിവയും’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ അവതരിപ്പിച്ചു.
