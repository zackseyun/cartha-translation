lexical_decisions:
- source_word: קְעִילָה
  choice: കെയീലാ
  rationale: സ്ഥലനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: אַכְזִיב
  choice: അക്സീബ്
