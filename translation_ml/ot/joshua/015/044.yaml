translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം. വംശാവലി/പ്രദേശപട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി. പ്രധാന പാഠത്തിലെ [a] അടയാളം ‘ഗ്രാമങ്ങൾ’ എന്ന പദത്തിനു തൊട്ടുപിന്നാലെ വരേണ്ടതാണെങ്കിലും മലയാളവാക്യത്തിന്റെ വായനാസൗകര്യത്തിനായി വാക്യാവസാനത്തിൽ നൽകിയിരിക്കുന്നു; അടിക്കുറിപ്പ് അതേ പദത്തെയാണ് വിശദീകരിക്കുന്നത്.
