- source_word: מָרֵאשָׁה
  choice: മാരേശാ
  rationale: സ്ഥലനാമം; വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: പ്രദേശപട്ടികയുടെ സന്ദർഭത്തിൽ നഗരസ്വഭാവമുള്ള ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: תֵּשַׁע
  choice: ഒൻപതു
  rationale: പട്ടണങ്ങളുടെ എണ്ണം നേരിട്ട് നൽകുന്നു.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ ജനവാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഉടമസ്ഥബന്ധം ബഹുവചന സ്ത്രീലിംഗപ്രത്യയം വ്യക്തമാക്കുന്നു.
- source_word: וְ
  choice: പട്ടികയിലെ ബന്ധവും സമാപനവാക്യത്തിലെ ഉൾപ്പെടുത്തലും മലയാളത്തിലെ ചിഹ്നക്രമവും ‘ഉൾപ്പെടെ’ എന്ന പ്രയോഗവുംകൊണ്ട് പ്രകടിപ്പിച്ചു
  rationale: എബ്രായത്തിലെ ആവർത്തിത സംയോജകത്തെ വാക്കുതോറും ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാരൂപം നൽകി.
