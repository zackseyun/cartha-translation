    text: “ഗ്രാമങ്ങൾ” എന്നതിന് “ആശ്രിത ജനവാസകേന്ദ്രങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദം ഒരു പട്ടണത്തോടു ബന്ധപ്പെട്ട ഗ്രാമീണ വാസസ്ഥലങ്ങളെ സൂചിപ്പിക്കാം.
