  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: ml
  text: കെയീലാ, അക്സീബ്, മാരേശാ—ഒൻപത് പട്ടണങ്ങളും അവയ്ക്കു ചേർന്ന ഗ്രാമങ്ങളും[a].
  philosophy: optimal-equivalence
  footnotes:
