id: JOS.15.61
reference: Joshua 15:61
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/מִּדְבָּ֑ר בֵּ֚ית הָעֲרָבָ֔ה מִדִּ֖ין וּ/סְכָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/061.yaml
  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
translation:
  language: ml
  text: 'മരുഭൂമിയിൽ[a]: ബേത്ത്-അരാബാ[b], മിദ്ദീൻ, സെഖാഖാ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിജനപ്രദേശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ מִדְבָּר എന്ന പദം സന്ദർഭമനുസരിച്ച് ജനവാസം കുറഞ്ഞ വനാന്തരത്തെയോ വരണ്ട മരുഭൂമിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ബേത്ത്-അരാബാ ഒരു സ്ഥലനാമമാണ്; പദശഃ ‘അരാബായുടെ ഭവനം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: בַּ־ എന്ന ഉപസർഗവും നിർദേശകപദവും ചേർന്ന് തുടർന്നുവരുന്ന പട്ടണങ്ങൾ സ്ഥിതിചെയ്യുന്ന ഭൂമേഖലയെ സൂചിപ്പിക്കുന്നു. യെഹൂദാ പ്രദേശത്തിന്റെ ജനവാസം കുറഞ്ഞ വരണ്ട മേഖലയെന്ന സന്ദർഭത്തിന് ‘മരുഭൂമി’ സ്വാഭാവികമായി യോജിക്കുന്നു; പൂർണമായ മണൽപ്രദേശം എന്ന അർഥത്തിൽ മാത്രം ഇതിനെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: בֵּית הָעֲרָבָה
  choice: ബേത്ത്-അരാബാ
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִדִּין
  choice: മിദ്ദീൻ
  rationale: സ്ഥലനാമം എബ്രായ വ്യഞ്ജനദ്വിത്വവും ദീർഘസ്വരവും സാധ്യമായത്ര നിലനിർത്തി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּסְכָכָה
  choice: സെഖാഖാ
  rationale: וּ എന്ന ‘കൂടാതെ/ഉം’ ബന്ധകം മലയാള പട്ടികയിലെ കോമയും അവസാന നാമത്തിന്റെ സ്ഥാനവുംകൊണ്ട് സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; സ്ഥലനാമം എബ്രായരൂപത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ഭൂമേഖലയെ പരിചയപ്പെടുത്തുന്ന വാക്യഖണ്ഡത്തിനു ശേഷം ദ്വിബിന്ദു നിലനിർത്തി.
