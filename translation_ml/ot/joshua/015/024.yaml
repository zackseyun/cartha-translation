lexical_decisions:
- source_word: זִיף
  choice: സീഫ്
  rationale: യെഹൂദയിലെ ഒരു പട്ടണത്തിന്റെ സ്ഥലനാമമായതിനാൽ അർത്ഥം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: טֶלֶם
  choice: തേലെം
  rationale: പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; പദത്തിന്റെ സാധ്യമായ പൊതുവായ അർത്ഥം ഇവിടെ പരിഭാഷപ്പെടുത്താൻ സന്ദർഭസൂചനയില്ല.
- source_word: בְעָלוֹת
  choice: ബെയാലോത്ത്
  rationale: സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു. ഹീബ്രു സ്വരചിഹ്നങ്ങളിലെ ബെയാലോത്ത് എന്ന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ബയാലോത്ത് എന്ന പരിചിതമായ മറ്റൊരു ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וָ / וּ
  choice: പട്ടികയിലെ കോമയും അവസാന ഇനത്തിനു മുൻപുള്ള സംയോജനവും
  rationale: ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള സംയോജകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ അവതരിപ്പിച്ചു.
