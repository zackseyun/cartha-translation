lexical_decisions:
- source_word: לָכִישׁ
  choice: ലാഖീശ്
  rationale: യെഹൂദയിലെ നഗരത്തിന്റെ ഹീബ്രു സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בָצְקַת
  choice: ബൊത്സ്കത്ത്
  rationale: ഹീബ്രു വ്യഞ്ജനമായ צ-യുടെ ‘ത്സ’ ശബ്ദം നിലനിർത്തി സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; പ്രചാരത്തിലുള്ള ലളിതരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: עֶגְלוֹן
  choice: എഗ്ലോൻ
  rationale: ഇവിടെ മോവാബ്യരാജാവിനെയല്ല, നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ / וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: ഹീബ്രുവിലെ ബന്ധകങ്ങൾ നഗരങ്ങളുടെ ലളിതമായ പട്ടികയെ ബന്ധിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാള പട്ടികാശൈലിയിൽ കോമകൾ ഉപയോഗിച്ചു.
