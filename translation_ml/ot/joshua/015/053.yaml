  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, നൽകിയിരിക്കുന്ന എബ്രായ വ്യഞ്ജനരൂപത്തോട് ചേർന്ന ‘യാനീം’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു; മുൻചേർന്ന ו സംയോജകത്തെ മലയാളത്തിലെ ‘-ഉം’കൊണ്ട് പ്രകടിപ്പിച്ചു.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: ബേത്ത്-തപ്പൂഹും
  rationale: ഇത് ഒരു സംയുക്ത സ്ഥലനാമമായതിനാൽ בֵית എന്നത് ‘വീട്’ എന്നു അർത്ഥവിവർത്തനം ചെയ്യാതെ ‘ബേത്ത്-’ എന്നു ലിപ്യന്തരിച്ചു. תַּפּוּחַ എന്ന ഘടകത്തിലെ ദീർഘസ്വരവും അവസാനത്തെ ഘർഷധ്വനിയും സൂചിപ്പിക്കാൻ ‘തപ്പൂഹ്’ ഉപയോഗിച്ചു; וּ എന്നത് ‘-ഉം’കൊണ്ട് പ്രകടിപ്പിച്ചു.
- source_word: וַ/אֲפֵקָה
  choice: അഫേക്കായും
  rationale: സ്ഥലനാമത്തിന്റെ അവസാന ה സൂചിപ്പിക്കുന്ന സ്വരവും ഉൾപ്പെടുത്തി ‘അഫേക്കാ’ എന്നു ലിപ്യന്തരിച്ചു; തുടക്കത്തിലെ וַ മലയാളത്തിലെ ‘-ഉം’ ആയി നൽകി.
