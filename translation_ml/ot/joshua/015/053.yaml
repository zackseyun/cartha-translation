translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, നഗരനാമങ്ങളുടെ പട്ടികയെന്ന സ്വഭാവം നിലനിർത്തുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ച സംയോജകങ്ങൾ ഓരോ പേരിലും മലയാളത്തിലെ ‘-ഉം’ ചേർത്ത് സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
