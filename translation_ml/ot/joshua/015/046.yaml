  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രപ്പട്ടികാ ശൈലി. സ്ഥലനാമങ്ങൾ ‘എക്രോൻ’, ‘അശ്ദോദ്’ എന്ന സാധാരണ ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
