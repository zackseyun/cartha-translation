  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “എനിക്ക് ഒരു അനുഗ്രഹം[a] തരണമേ. അങ്ങ് എനിക്ക് നെഗെബ്[b] ദേശം തന്നിരിക്കുന്നതിനാൽ, നീരുറവകളും[c] എനിക്ക് തരണമേ.” അങ്ങനെ അവൻ അവൾക്ക് മേലത്തെ നീരുറവകളും താഴത്തെ നീരുറവകളും കൊടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ദാനം.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “അനുഗ്രഹം” എന്നാണ്; ഇവിടെ അത് പ്രയോജനകരമായ ഒരു ദാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “നെഗെബ്” എന്ന എബ്രായപദത്തിന് “തെക്കൻ പ്രദേശം” എന്നോ “വരണ്ട പ്രദേശം” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം നീരുറവകളെയോ ജലാശയങ്ങളെയോ ജലം ശേഖരിക്കുന്ന തടങ്ങളെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ “നീരുറവകൾ” എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: ഒരു അനുഗ്രഹം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘അനുഗ്രഹം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് പിതാവിൽനിന്ന് അഭ്യർഥിക്കുന്ന പ്രയോജനകരമായ ഒരു ദാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: നെഗെബ് പ്രദേശത്തെ ഭൂമി
  rationale: נֶגֶב ഇവിടെ ഭൂമിശാസ്ത്രപരമായ പേരായി മനസ്സിലാക്കുന്നത് സ്വാഭാവികമാണ്; ‘പ്രദേശത്തെ’ എന്നത് മലയാളത്തിൽ സ്ഥലസൂചന വ്യക്തമാക്കുന്നു.
- source_word: גֻּלֹּת מָיִם
  choice: നീരുറവകൾ
  rationale: വസ്തുവിന്റെ കൃത്യസ്വഭാവം വിവാദമാണെങ്കിലും, ഭൂമിയോടൊപ്പം ആവശ്യപ്പെടുന്ന ജലസ്രോതസ്സുകൾ എന്ന സന്ദർഭത്തിന് ‘നീരുറവകൾ’ നന്നായി യോജിക്കുന്നു.
- source_word: תְּנָה לִּי
  choice: എനിക്ക് ... തരണമേ
  rationale: ആജ്ഞാരൂപത്തിന്റെ അഭ്യർഥനാഭാവം സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנָתַתָּה לִי
  choice: '...കളും എനിക്ക് തരണമേ'
  rationale: സംയോജകത്തിന്റെ അധികമായ അഭ്യർഥന എന്ന ഭാവം ‘-കളും’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: മുകൾഭാഗത്തെ നീരുറവകൾ
  rationale: עִלִּיּוֹת സൂചിപ്പിക്കുന്ന ഉയർന്ന സ്ഥാനത്തെ വ്യക്തമാക്കുകയും മുൻപത്തെ ‘നീരുറവകൾ’ എന്ന പരിഭാഷയുമായി പൊരുത്തം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: താഴ്ഭാഗത്തെ നീരുറവകൾ
  rationale: സമാന്തര പ്രയോഗത്തിലെ താഴ്ന്ന സ്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֶּן לָהּ
  choice: അങ്ങനെ അവൻ അവൾക്ക് ... കൊടുത്തു
  rationale: അവളുടെ അഭ്യർഥനയ്ക്കുള്ള പ്രതികരണമായി കഥ മുന്നേറുന്നതിനെ ‘അങ്ങനെ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
