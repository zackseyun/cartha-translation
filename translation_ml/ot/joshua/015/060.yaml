source:
  edition: WLC
  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: ml
  text: കിര്യത്ത്-ബാൽ (അതായത് കിര്യത്ത്-യെയാരീം), റബ്ബാ—അവയുടെ അധിവാസകേന്ദ്രങ്ങളോടുകൂടെ രണ്ടു പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: കിര്യത്ത്-ബാൽ
  rationale: സ്ഥലപ്പേരായതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הִיא
  choice: അതായത്
  rationale: ആദ്യത്തെ സ്ഥലപ്പേരിനെ മറ്റൊരു പേരിലൂടെ തിരിച്ചറിയിക്കുന്ന വിശദീകരണസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: ഇത് അതേ പട്ടണത്തിന്റെ മറ്റൊരു പേരായതിനാൽ സ്ഥലപ്പേരായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָרַבָּה
  choice: റബ്ബാ
  rationale: ഹീബ്രു നിർദേശകോപസർഗം മലയാളത്തിൽ പ്രത്യേകം പുനരാവിഷ്കരിക്കാതെ സ്ഥലപ്പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים שְׁתַּיִם
  choice: രണ്ടു പട്ടണങ്ങൾ
  rationale: പ്രദേശവിഭജനപ്പട്ടികയിലെ എണ്ണസംഗ്രഹം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ചുറ്റുമുള്ള അധിവാസകേന്ദ്രങ്ങൾ
  rationale: പ്രധാന പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമങ്ങളെയോ ചെറുകുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. സ്ഥലപ്പേരുകൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; പട്ടികാശൈലിയുടെ സംക്ഷിപ്തത നിലനിർത്തി.
