lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: അവരുടെ ... ആയിരുന്നു
  rationale: ഹീബ്രായത്തിലെ היה + לָהֶם എന്ന ഘടനയെ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: גְּבוּל נֶגֶב
  choice: തെക്കേ അതിർത്തി
  rationale: ഇവിടെ נֶגֶב പ്രദേശനാമമല്ല, യെഹൂദയുടെ അതിർത്തിയുടെ തെക്കുഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מִקְצֵה
  choice: അറ്റത്തുനിന്ന്
  rationale: അതിർത്തി ആരംഭിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ അഗ്രബിന്ദുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: പിൽക്കാലത്തെ ‘ചാവുകടൽ’ എന്ന പേരിനു പകരം ഹീബ്രായ മൂലത്തിലെ നാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִן הַלָּשֹׁן
  choice: നാവുപോലുള്ള ഉൾക്കടലിൽനിന്ന്
  rationale: לָשׁוֹן എന്നതിന്റെ ‘നാവ്’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ഉദ്ദേശിക്കുന്ന ഭൂമിശാസ്ത്ര സവിശേഷത വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: തെക്കോട്ടു തിരിഞ്ഞുകിടക്കുന്ന
  rationale: פנה എന്ന പദത്തിന്റെ ദിശാഭിമുഖത സ്വാഭാവികമായ മലയാള ഭൂമിശാസ്ത്ര പ്രയോഗത്തിൽ നൽകുന്നു.
