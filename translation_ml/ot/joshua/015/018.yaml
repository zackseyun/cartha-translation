base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ml
  text: അവൾ വന്നപ്പോൾ, തന്റെ അപ്പനിൽനിന്ന് ഒരു വയൽ ചോദിക്കാൻ അവൾ അവനെ പ്രേരിപ്പിച്ചു.[a] പിന്നെ അവൾ കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി.[b] കാലേബ് അവളോട്, “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നു ചോദിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവൾ അവനെ സമ്മതിപ്പിച്ചു”; കൂടുതൽ നിഷേധാത്മകമായ ഭാവത്തിൽ, “അവൾ അവനെ ഇളക്കിവിട്ടു.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അവൾ കഴുതപ്പുറത്തുനിന്ന് ചാടിയിറങ്ങി”; എബ്രായ ക്രിയ പെട്ടെന്നുള്ള ഇറക്കം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “നിനക്ക് എന്ത്?” എന്നാണ്; സന്ദർഭമനുസരിച്ച് “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നോ “നിന്നെ എന്താണ് അലട്ടുന്നത്?” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: അവൾ വന്നപ്പോൾ
  rationale: בְ + infinitive construct + 3fs suffix സമയസൂചക ഉപവാക്യമാണ്. ലക്ഷ്യസ്ഥാനം അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ കാലബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתְּסִיתֵהוּ
  choice: അവൾ അവനെ പ്രേരിപ്പിച്ചു
  rationale: סות എന്ന ക്രിയയ്ക്ക് പ്രേരിപ്പിക്കുക, വശീകരിക്കുക, ഇളക്കിവിടുക തുടങ്ങിയ അർഥസാധ്യതകളുണ്ട്. ഈ കുടുംബപരമായ അഭ്യർഥനാസന്ദർഭത്തിൽ ‘പ്രേരിപ്പിച്ചു’ സജീവമായ പ്രചോദനം നിലനിർത്തുകയും അനാവശ്യമായ നിഷേധാത്മകത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: ഒരു വയൽ തന്റെ അപ്പനോട് ചോദിക്കാൻ
  rationale: שאל ഇവിടെ ഒരാളോട് എന്തെങ്കിലും ചോദിക്കുക/അഭ്യർഥിക്കുക എന്നാണ്. മֵאֵת സൂചിപ്പിക്കുന്ന അഭ്യർഥനയുടെ ഉറവിടമായ വ്യക്തിയെ മലയാളത്തിലെ ‘അപ്പനോട്’ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; שָׂדֶה നേരിട്ട് ‘ഒരു വയൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: അവൾ കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങി
  rationale: צנח പെട്ടെന്നോ ശ്രദ്ധേയമായോ താഴേക്കിറങ്ങുന്ന ഭാവം സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിലെ അടിസ്ഥാനപ്രവൃത്തി കഴുതപ്പുറത്തുനിന്ന് ഇറങ്ങുന്നതാണ്. മുഖ്യവാചകത്തിൽ സ്വാഭാവികരൂപവും അടിക്കുറിപ്പിൽ ശക്തമായ ഭാവസാധ്യതയും നൽകിയിരിക്കുന്നു.
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്താണ് വേണ്ടത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്ക് എന്ത്?’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ ആവശ്യമോ വിഷമമോ അന്വേഷിക്കുന്നു. തുടർന്നുള്ള അഭ്യർഥനയുടെ സന്ദർഭത്തിൽ ‘നിനക്ക് എന്താണ് വേണ്ടത്?’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതും ഈ കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികവുമാണ്. മൂലപാഠത്തിലെ സർവനാമബന്ധവും പദാർഥത്തിലെ സാധ്യതകളും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
