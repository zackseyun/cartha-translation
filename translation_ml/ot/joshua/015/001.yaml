revisions:
- from: യെഹൂദയുടെ സന്തതികളുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ച നറുക്ക് തെക്കേ അറ്റത്ത്, ഏദോമിന്റെ അതിർത്തിയോടു ചേർന്ന സീൻ മരുഭൂമിവരെ ആയിരുന്നു.[a]
  to: യെഹൂദാസന്തതികളുടെ ഗോത്രത്തിന്, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്, നറുക്കിലൂടെ ലഭിച്ച ഓഹരി ഏദോമിന്റെ അതിർത്തിവരെ—തെക്കുഭാഗത്തുള്ള സീൻ മരുഭൂമിവരെ, തെക്കേയറ്റംവരെ—ആയിരുന്നു.[a]
  rationale: 'The revision restores the boundary-limit force of “to the border of Edom” and represents both Hebrew directional elements: the southern side and the extreme southern limit. It retains a fluent modern Malayalam sentence and preserves the lexical ambiguity of תֵימָן in a neutral footnote.'
