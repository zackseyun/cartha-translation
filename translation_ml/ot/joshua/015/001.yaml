source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: ml
  text: യെഹൂദാസന്തതികളുടെ ഗോത്രത്തിന്, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്, നറുക്കിലൂടെ ലഭിച്ച ഓഹരി ഏദോമിന്റെ അതിർത്തിവരെ—തെക്കുഭാഗത്തുള്ള സീൻ മരുഭൂമിവരെ, തെക്കേയറ്റംവരെ—ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ, അവസാന ഭാഗം: “തെക്കോട്ട്, തെക്കിന്റെ/തേമാന്റെ അറ്റം മുതൽ.” “തേമാൻ” എന്നത് “തെക്ക്” എന്ന ദിശാർഥത്തിലും ഒരു സ്ഥലനാമമായും മനസ്സിലാക്കാം; ഇവിടെ സന്ദർഭത്തിൽ അത്യന്തം തെക്കുള്ള പരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: ലഭിച്ച നറുക്ക് ... ആയിരുന്നു
  rationale: ഭൂവിഭജനത്തിനായി നറുക്കിട്ടതിന്റെ ഫലമാണ് ഇവിടെ വിവരിക്കുന്നത്. ‘നറുക്ക്’ എന്നത് വിഭജനരീതി നിലനിർത്തുന്നു; ‘ലഭിച്ച ... ആയിരുന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ഫലം വ്യക്തമാക്കുന്നു.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ സന്തതികളുടെ ഗോത്രത്തിന്
  rationale: മַטֶּה എന്നതിന്റെ ഗോത്രപരമായ അർഥം ‘ഗോത്രം’ എന്നു നൽകി; בְּנֵי എന്ന എബ്രായ ബന്ധപ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ‘സന്തതികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ ഉപവിഭാഗങ്ങളെയാണ് מִשְׁפָּחָה സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ സന്ദർഭോചിതമാണ്.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ഏദോമിന്റെ അതിർത്തിയോടു ചേർന്ന
  rationale: അതിർത്തിവിവരണത്തിലെ אֶל ഗമ്യസ്ഥാനമോ പരിധിയോ സൂചിപ്പിക്കുന്നു. മലയാളവാക്യത്തിൽ ഭൂവിഭാഗത്തിന്റെ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: מִדְבַּר צִן
  choice: സീൻ മരുഭൂമി
  rationale: מִדְבָּר വരണ്ട വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രനാമത്തോടൊപ്പം ‘മരുഭൂമി’ വ്യക്തവും നിലവാരമുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: נֶגְבָּה מִקְצֵה תֵימָן
  choice: തെക്കേ അറ്റത്ത്
  rationale: രണ്ട് ദിശാസൂചക ഘടകങ്ങളും ചേർന്ന് അത്യന്തം തെക്കുള്ള പരിധിയെ സൂചിപ്പിക്കുന്നു. ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവിക മലയാളത്തിൽ അർഥം നൽകി; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ അർഥം സ്വാഭാവികമായി അവതരിപ്പിച്ചുകൊണ്ട് എബ്രായത്തിലെ ദിശാപ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
