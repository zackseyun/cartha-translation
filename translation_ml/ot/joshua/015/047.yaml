translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രപട്ടികാശൈലി. ‘ആശ്രിതപട്ടണങ്ങൾ’ എന്നത് എബ്രായ ഭാഷാശൈലിയുടെ അർഥം തുറന്നുപറയുന്നു; വാക്യാവസാനത്തിലെ യഥാർഥ പാഠദുഷ്കരത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
