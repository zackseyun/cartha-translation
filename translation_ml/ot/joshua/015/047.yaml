base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: ml
  text: അശ്ദോദ്, അതിന്റെ ആശ്രിതപട്ടണങ്ങളും ഗ്രാമങ്ങളും; ഗസ്സ, അതിന്റെ ആശ്രിതപട്ടണങ്ങളും ഗ്രാമങ്ങളും; ഈജിപ്തിലെ തോടുവരെയും[a] അതിർത്തിയായ കടൽവരെയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈജിപ്തിലെ വാദി’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ נחל എന്ന പദം കാലാവസ്ഥാനുസരിച്ച് ഒഴുകുന്ന ജലപാതയെയോ വാദിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘കടൽ’ മധ്യധരണ്യാഴിയെയാണു സൂചിപ്പിക്കുന്നത്. വാക്യാവസാനത്തെ എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും വ്യാഖ്യാനത്തിൽ അനിശ്ചിതവുമാണ്; അക്ഷരാർഥത്തിൽ ഏകദേശം ‘കടൽ, അതിർത്തി, അതിർത്തി’ എന്നാണ്.
    reason: textual_or_exegetical_clarity
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: അതിന്റെ ആശ്രിതപട്ടണങ്ങൾ
  rationale: പ്രധാന നഗരത്തോടു ചേർന്ന ആശ്രിത അഥവാ ഉപഗ്രഹപട്ടണങ്ങളെ സൂചിപ്പിക്കുന്ന ‘പുത്രിമാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֲצֵרֶיהָ
  choice: അതിന്റെ ഗ്രാമങ്ങൾ
  rationale: ഈ ഭൂമിശാസ്ത്രപരമായ പട്ടികയിൽ ചെറുതും പുറമ്പോക്കിലുള്ളതുമായ വാസകേന്ദ്രങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: נַחַל מִצְרָיִם
  choice: ഈജിപ്തുതോട്
  rationale: അതിർത്തിചിഹ്നമായ ഈ സ്ഥലനാമത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; נחל സ്ഥിരമായ അരുവിയെയോ കാലിക ജലപാതയെയോ വാദിയെയോ സൂചിപ്പിക്കാമെന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: הַיָּם
  choice: മഹാസമുദ്രം
  rationale: പ്രദേശത്തിന്റെ പടിഞ്ഞാറൻ അതിർത്തിയായ മധ്യധരണ്യാഴിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ ഭൂമിശാസ്ത്രപ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു; തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַגְּבוּל וּגְבוּל
  choice: അതായിരുന്നു അതിന്റെ അതിർത്തി
  rationale: മസോറ പാഠത്തിലെ അവസാനഭാഗം ദുഷ്കരവും ആവർത്തനാത്മകവുമാണ്; സമുദ്രം അതിർത്തിയായി പ്രവർത്തിക്കുന്നു എന്ന സാദ്ധ്യമായ അർഥം വ്യക്തമായി നൽകുന്നു, എന്നാൽ പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: ഭൂപ്രദേശത്തിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: അശ്ദോദ് / ഗസ്സ
  rationale: മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന രീതിയിൽ സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുന്നു.
