  language: ml
  text: ഗെദേരോത്ത്, ബേത്ത്-ദാഗോൻ[a], നഅമാ, മക്കേദാ—ഗ്രാമങ്ങളോടുകൂടിയ പതിനാറ് പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബേത്ത്-ദാഗോൻ എന്ന പേരിന്റെ അക്ഷരാർഥം ‘ദാഗോന്റെ വീട്’ എന്നാണ്; എന്നാൽ ഇവിടെ അതൊരു സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: ഗെദേരോത്ത്
  rationale: വാവു സംയോജകം മലയാളത്തിലെ പട്ടികാശൈലിയിൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בֵּית דָּגוֹן
  choice: ബേത്ത്-ദാഗോൻ
  rationale: ‘ദാഗോന്റെ വീട്’ എന്ന ഘടനയുള്ളതെങ്കിലും ഇവിടെ ഇത് സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ സംയുക്തനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: וְ/נַעֲמָה
  choice: നയമാ
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; മുൻപിലെ സംയോജകം പട്ടികയുടെ വിരാമചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: וּ/מַקֵּדָה
  choice: മക്കേദാ
  rationale: സ്ഥലനാമം എബ്രായത്തിലെ ദ്വിത്വ വ്യഞ്ജനവും അവസാന സ്വരവും പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ഭൂപ്രദേശപ്പട്ടികയിൽ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ പ്രസക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: പതിനാറു
  rationale: എബ്രായത്തിലെ സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וְ/חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങളോടുകൂടെ
  rationale: പേരെടുത്ത പട്ടണങ്ങളോട് ആശ്രിതമായി ബന്ധപ്പെട്ട ചെറു ഗ്രാമീണ ജനവാസങ്ങളെയാണ് חָצֵר സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ ഈ ഭൂമിശാസ്ത്രപരമായ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
