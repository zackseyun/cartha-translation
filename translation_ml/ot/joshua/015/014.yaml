  text: וַ/יֹּ֤רֶשׁ מִ/שָּׁם֙ כָּלֵ֔ב אֶת שְׁלוֹשָׁ֖ה בְּנֵ֣י הָ/עֲנָ֑ק אֶת שֵׁשַׁ֤י וְ/אֶת אֲחִימַן֙ וְ/אֶת תַּלְמַ֔י יְלִידֵ֖י הָ/עֲנָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: ml
  text: അവിടെനിന്ന് കാലേബ് അനാക്കിന്റെ മൂന്നു പുത്രന്മാരെ—ശേശായി, അഹീമാൻ, തൽമായി എന്നിവരെ, അനാക്കിൽനിന്നു ജനിച്ചവരെ[b]—പുറത്താക്കി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടെനിന്ന് അവരെ ഒഴിപ്പിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ മുൻ അധിവാസികളെ ഒഴിപ്പിച്ചുകൊണ്ട് ആ സ്ഥലം കൈവശമാക്കുക എന്ന ആശയത്തിന് ഊന്നൽ നൽകാനാകും.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ആദ്യം ‘അനാക്കിന്റെ പുത്രന്മാർ’ എന്നും പിന്നീട് ‘അനാക്കിൽനിന്നു ജനിച്ചവർ’ എന്നും പറയുന്നു. ഒരേ കൂട്ടത്തെക്കുറിച്ച് ബന്ധമുള്ള രണ്ടു വംശാവലിപ്രയോഗങ്ങളാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: പുറത്താക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירשׁ ഇവിടെ ആളുകളെ കർമമായി സ്വീകരിക്കുന്നതിനാൽ, മുൻ അധിവാസികളെ അവരുടെ കൈവശത്തിൽനിന്ന് നീക്കുക അഥവാ പുറത്താക്കുക എന്ന അർഥം നൽകുന്നു. ‘പുറത്താക്കി’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൈവശം നഷ്ടപ്പെടുത്തിച്ചു എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചിരിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഈ പദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: അനാക്കിന്റെ മൂന്നു പുത്രന്മാർ
  rationale: בְּנֵי എന്ന കുടുംബബന്ധപദം ‘പുത്രന്മാർ’ എന്നു ഔപചാരികമായി നിലനിർത്തുന്നു; പേരെടുത്ത മൂന്നു വ്യക്തികളെയാണ് വാക്യം തുടർന്ന് തിരിച്ചറിയുന്നത്.
- source_word: שֵׁשַׁי
  choice: ശേശായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲחִימַן
  choice: അഹീമാൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: תַּלְמַי
  choice: തൽമായി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְלִידֵי הָעֲנָק
  choice: അനാക്കിൽനിന്നു ജനിച്ചവർ
  rationale: יְלִידֵי എന്നത് അക്ഷരാർഥത്തിൽ ഒരാളിൽനിന്നു ജനിച്ചവരെ സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘അനാക്കിന്റെ പുത്രന്മാർ’ എന്നതുമായി ബന്ധപ്പെട്ട രണ്ടാമത്തെ വംശാവലിപ്രയോഗം ആവർത്തനം നീക്കാതെ നിലനിർത്തുന്നു.
