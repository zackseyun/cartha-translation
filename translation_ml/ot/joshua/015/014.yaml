  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പേരുകളുടെ പട്ടികയും അതിനോടു ചേർന്ന വംശാവലി വിശദീകരണവും വായിക്കാൻ എളുപ്പമാക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി.
