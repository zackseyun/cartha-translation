  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: ml
  text: പടിഞ്ഞാറെ അതിർത്തി മഹാസമുദ്രവും അതിന്റെ തീരരേഖയുമായിരുന്നു.[a] യെഹൂദായുടെ പുത്രന്മാരുടെ ഗോത്രകുടുംബങ്ങൾക്കനുസരിച്ച്, ചുറ്റുമുള്ള അവരുടെ അതിർത്തി ഇതായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘സമുദ്രത്തേക്ക്—മഹാസമുദ്രം—അതിർത്തി’ എന്നാണ്. ഇത് യെഹൂദായുടെ പടിഞ്ഞാറുഭാഗത്തെ അതിർത്തിയായ മെഡിറ്ററേനിയൻ കടലിനെയും അതിന്റെ തീരരേഖയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്.’ ഇവിടെ എബ്രായപദം ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: പടിഞ്ഞാറെ അതിർത്തി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ יָם പടിഞ്ഞാറുള്ള സമുദ്രത്തിന്റെ ദിശയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: മഹാസമുദ്രം
  rationale: ‘മഹാസമുദ്രം’ എന്നത് മെഡിറ്ററേനിയൻ കടലിനുള്ള പരമ്പരാഗത ഭൂമിശാസ്ത്രനാമമാണ്; മൂലത്തിലെ ‘വലിയ സമുദ്രം’ എന്ന ഘടനയും നിലനിർത്തുന്നു.
- source_word: וּגְבוּל
  choice: അതിന്റെ തീരം
  rationale: ആവർത്തിച്ചുള്ള גְּבוּל ഇവിടെ സമുദ്രത്തോടു ചേർന്ന അതിർത്തിരേഖയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത സമാനാധികരണമാണ്; മലയാളത്തിൽ ‘അതിന്റെ തീരം’ ഭൂപ്രകൃതിയെയും അതിർത്തിപ്രവർത്തനത്തെയും വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദാമക്കൾ
  rationale: ഹീബ്രുവിലെ പുത്രസന്തതി സൂചിപ്പിക്കുന്ന ഗോത്രനാമം മലയാളത്തിലെ സ്വാഭാവികമായ സമൂഹവാചകത്തിൽ അവതരിപ്പിക്കുന്നു; ഇത് യെഹൂദായുടെ ഗോത്രസന്തതിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റിലും
  rationale: പ്രദേശത്തെ എല്ലാ വശത്തുനിന്നും ചുറ്റുന്ന അതിർത്തിയുടെ സംഗ്രഹം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ ഗോത്രകുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ കുടുംബം എന്നതിലുപരി ആ സാമൂഹിക ഘടന വ്യക്തമാക്കാൻ ‘ഗോത്രകുടുംബങ്ങൾ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יְהוּדָה എന്ന ലിംഗസൂചക ഗോത്രപ്രയോഗം
  choice: യെഹൂദാമക്കൾ
  alternative: യെഹൂദായുടെ പുത്രന്മാർ
  rationale: ഈ പ്രയോഗം പുരുഷന്മാരെ മാത്രം വേർതിരിച്ചുപറയുന്നതല്ല, യെഹൂദായുടെ ഗോത്രസന്തതിയെ സമഗ്രമായി നാമകരണം ചെയ്യുന്നതാണ്. മലയാളത്തിലെ ‘യെഹൂദാമക്കൾ’ ഉറവിടത്തിലെ സന്തതിബന്ധം നിലനിർത്തുകയും സമൂഹപരമായ അർത്ഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി. ‘മഹാസമുദ്രം’ എന്ന വേദപാരമ്പര്യ ഭൂമിശാസ്ത്രനാമവും ‘ഗോത്രകുടുംബങ്ങൾ’ എന്ന വ്യക്തമായ സാമൂഹികപദവും ഉപയോഗിച്ചു.
