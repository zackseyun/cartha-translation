- from: പടിഞ്ഞാറെ അതിർത്തി മഹാസമുദ്രവും അതിന്റെ തീരവുമായിരുന്നു.[a] ഇതായിരുന്നു യെഹൂദാമക്കളുടെ അതിർത്തി ചുറ്റിലും, അവരുടെ ഗോത്രകുടുംബങ്ങൾക്കനുസരിച്ച്.[b]
