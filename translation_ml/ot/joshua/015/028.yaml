lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: ഹസർ-ശൂവാൽ
  rationale: പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. പദഘടകങ്ങൾക്ക് ‘കുറുക്കന്റെ/കാട്ടുനായയുടെ ഗ്രാമം’ എന്ന വ്യുത്പത്തിപരമായ അർഥസാധ്യതയുണ്ട്.
- source_word: בְּאֵר שֶׁבַע
  choice: ബേർ-ശേബ
  rationale: പരിചിതമായ സ്ഥലനാമം എന്ന നിലയിൽ ലിപ്യന്തരണം ചെയ്തു. പേരിലുള്ള ‘കിണർ’, ‘ഏഴ്’ എന്നീ അർഥങ്ങളും ‘ശപഥം’ എന്ന പദവുമായുള്ള ശബ്ദാലങ്കാരവും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בִּזְיוֹתְיָה
  choice: ബിസ്യോത്യാ
  rationale: വ്യുത്പത്തി അനിശ്ചിതമായ സ്ഥലനാമമായതിനാൽ എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַ / וּ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള സംയോജകങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ കോമകളിലൂടെ അവതരിപ്പിച്ചു; വാക്യാർഥത്തിൽ മാറ്റമില്ല.
