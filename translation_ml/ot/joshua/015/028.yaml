  register: ആധുനിക നിലവാരമലയാളത്തിൽ, അതിർത്തി-പട്ടണപ്പട്ടികയ്ക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകി.
