id: JOS.15.6
reference: Joshua 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: ml
  text: പിന്നെ അതിർ ബേത്ത്-ഹൊഗ്ലയിലേക്കു കയറി, ബേത്ത്-അരാബയുടെ വടക്കുവശത്തുകൂടി കടന്നു; തുടർന്ന് അതിർ രൂബേന്റെ മകനായ ബോഹന്റെ കല്ലിലേക്കു കയറി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: കയറി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ ഈ ക്രിയ ഉയർന്ന ഭൂപ്രദേശത്തേക്കോ മേൽദിശയിലേക്കോ അതിർത്തിരേഖ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കയറി’ സ്വാഭാവികവും ഭൂപ്രകൃതിസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: הַגְּבוּל
  choice: അതിർ
  rationale: ഇവിടെ സൂചിപ്പിക്കുന്നത് പ്രദേശമൊട്ടാകെയല്ല, അതിർത്തിരേഖയാണ്. ആവർത്തിച്ചുള്ള ഭൂമിശാസ്ത്രവിവരണത്തിന് ‘അതിർ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: בֵּית חָגְלָה
  choice: ബേത്ത്-ഹൊഗ്ല
  rationale: സ്ഥലനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: ബേത്ത്-അരാബയുടെ വടക്കുവശത്തുകൂടി കടന്നു
  rationale: അതിർത്തിരേഖ ആ സ്ഥലത്തിന്റെ വടക്കുഭാഗം വഴി തുടർന്നുപോകുന്നതാണ് ഈ ഭൂമിശാസ്ത്രസൂത്രത്തിന്റെ അർത്ഥം; മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֶבֶן בֹּהַן
  choice: ബോഹന്റെ കല്ല്
  rationale: ഹീബ്രുവിലെ സംയുക്തബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് ബോഹനുമായി ബന്ധപ്പെട്ട ഒരു അതിർത്തിചിഹ്നമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בֶּן רְאוּבֵן
  choice: രൂബേന്റെ മകനായ
  rationale: ഹീബ്രു പദപ്രയോഗം വ്യക്തമായി ‘രൂബേന്റെ മകൻ’ എന്നാണ്; ‘രൂബേൻഗോത്രക്കാരൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപത്തിലേക്ക് മാറ്റിയിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി. ആവർത്തിക്കുന്ന ‘അതിർ’ എന്ന പദം മൂലപാഠത്തിന്റെ ഘടനയും അതിർത്തിരേഖയുടെ തുടർച്ചയും വ്യക്തമാക്കുന്നതിനായി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ [a] അടിക്കുറിപ്പ് ‘ബോഹന്റെ കല്ല്’ എന്നതിനുള്ള പകരരൂപം പറയുന്നതാണെങ്കിലും അത് തെറ്റായി ബേത്ത്-ഹൊഗ്ലയോട് ചേർത്തതായി തോന്നുന്നു; കൂടാതെ നിർദേശിക്കുന്ന പകരരൂപം മൂലപാഠത്തിന്റെ തന്നെ നേരിട്ടുള്ള അർത്ഥമായതിനാൽ മലയാള കരടിൽ അനാവശ്യമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
