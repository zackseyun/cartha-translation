  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, ഭൂമിശാസ്ത്രനാമങ്ങളുടെ സംക്ഷിപ്ത പട്ടികയായി അവതരിപ്പിച്ചു. മൂലപാഠത്തിലെ മൂന്ന് സ്ഥലനാമങ്ങളും അതേ ക്രമത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ [b] അടിക്കുറിപ്പ് Ithnan-നോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നതെങ്കിലും അവിടെ marker Hazor-ന് ശേഷമാണ് നൽകിയിരിക്കുന്നത്; മലയാളത്തിൽ പ്രസക്തമായ ഇംഗ്ലീഷ് ലിപ്യന്തരപരമ്പരയെക്കുറിച്ചുള്ള ആ കുറിപ്പ് ആവശ്യമില്ലാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
