lexical_decisions:
- source_word: קִינָה
  choice: കീനാ
  rationale: യെഹൂദയുടെ പട്ടണപ്പട്ടികയിലെ സ്ഥലനാമം; അർത്ഥം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ എഴുതുന്നു.
- source_word: דִימוֹנָה
