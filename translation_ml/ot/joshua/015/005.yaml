  text: וּ/גְב֥וּל קֵ֨דְמָ/ה֙ יָ֣ם הַ/מֶּ֔לַח עַד קְצֵ֖ה הַ/יַּרְדֵּ֑ן וּ/גְב֞וּל לִ/פְאַ֤ת צָפ֨וֹנָ/ה֙ מִ/לְּשׁ֣וֹן הַ/יָּ֔ם מִ/קְצֵ֖ה הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: ml
  text: കിഴക്കൻ അതിർത്തി യോർദ്ദാന്റെ അഴിമുഖംവരെയുള്ള ഉപ്പുകടലായിരുന്നു. വടക്കുവശത്തെ അതിർത്തി യോർദ്ദാന്റെ അഴിമുഖത്തുള്ള കടൽനാക്കിൽനിന്ന് ആരംഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: ഹീബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ അഴിമുഖം
  rationale: അക്ഷരാർഥത്തിൽ ‘യോർദ്ദാന്റെ അറ്റം’; ഇവിടെ നദി ഉപ്പുകടലിൽ ചേരുന്ന അഴിമുഖത്തെയാണ് ഭൂമിശാസ്ത്രപരമായി സൂചിപ്പിക്കുന്നത്.
- source_word: לְשׁוֹן הַיָּם
  choice: കടൽനാക്ക്
  rationale: കരയിലേക്കു നീണ്ടുകയറുന്ന കടൽഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ഭൂമിശാസ്ത്രരൂപകം നിലനിർത്തുന്നു.
- source_word: לִפְאַת צָפוֹנָה
  choice: വടക്കുവശത്തെ
  rationale: അതിർത്തിയുടെ വടക്കൻ ഭാഗം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവിവരണം വ്യക്തവും ഗൗരവമുള്ളതുമായി അവതരിപ്പിച്ചു. രണ്ടാം വാക്യത്തിലെ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ആരംഭിച്ചു’ ചേർത്തു; ഉറവിടത്തിലെ ദിശാക്രമവും കടൽനാക്ക് എന്ന രൂപകവും സംരക്ഷിച്ചു.
