  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: ml
  text: നിബ്ശാനും ഉപ്പിന്റെ നഗരവും ഏൻ-ഗെദിയും—അവയുടെ പാർപ്പിടങ്ങളോടുകൂടെ ആറു നഗരങ്ങൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: നിബ്ശാൻ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രു നിർദേശകപ്രത്യയം പേരിന്റെ ഭാഗമായി വേർതിരിച്ച് പ്രതിനിധീകരിച്ചില്ല.
- source_word: עִיר הַמֶּלַח
  choice: ഉപ്പുനഗരം
  rationale: ‘ഉപ്പിന്റെ നഗരം’ എന്ന സുതാര്യമായ സ്ഥലനാമത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അർത്ഥാനുവാദം ചെയ്തു.
- source_word: עֵין גֶּדִי
  choice: ഏൻ-ഗെദി
  rationale: സ്ഥിരപ്രയോഗത്തിലുള്ള സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്തു; ഘടകങ്ങളുടെ അർത്ഥം വിവർത്തനം ചെയ്ത് പേരിന്റെ സ്വഭാവം മാറ്റിയില്ല.
- source_word: עָרִים שֵׁשׁ
  choice: ആറു നഗരങ്ങൾ
  rationale: പ്രദേശപ്പട്ടികയിലെ സംഖ്യാത്മക സംഗ്രഹം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ അധീനവാസസ്ഥലങ്ങൾ
  rationale: പ്രധാന നഗരങ്ങളോടു ബന്ധപ്പെട്ട ചെറുതും പലപ്പോഴും മതിലില്ലാത്തതുമായ പാർപ്പിടകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ‘ഗ്രാമങ്ങൾ’ എന്ന പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְ
  choice: പട്ടികയിലെ കോമകളും ‘ഇങ്ങനെ ... കൂടെ’ എന്ന ഘടനയും
  rationale: ആവർത്തിക്കുന്ന സംയോജകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാഘടനയിലൂടെ പ്രതിനിധീകരിച്ചു; വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയാണെന്ന സ്വഭാവം നിലനിർത്തുന്നു.
