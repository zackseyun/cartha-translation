translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായിക്കാൻ എളുപ്പമുള്ളതുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ നൽകി; സുതാര്യമായ עִיר הַמֶּלַח മാത്രം അർത്ഥാനുവാദം ചെയ്തു. ‘അധീനവാസസ്ഥലങ്ങൾ’ എന്നത് ബന്ധത്തിന്റെ അർത്ഥം കൃത്യമായി സൂക്ഷിക്കുന്നു; കൂടുതൽ പരിചിതമായ ‘ഗ്രാമങ്ങൾ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
