  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി; വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: מַדְמַנָּה
  choice: മദ്മന്നാ
  rationale: സ്ഥലനാമം ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; നടുവിലെ വ്യഞ്ജനദ്വിത്വം നിലനിർത്തി.
- source_word: סַנְסַנָּה
  choice: സൻസന്നാ
  rationale: സ്ഥലനാമം ഹീബ്രായ ശബ്ദരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു; നൂൻ വ്യഞ്ജനത്തിന്റെ ദ്വിത്വം നിലനിർത്തി.
- source_word: וְ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: ഹീബ്രായത്തിൽ ഓരോ പേരിനുമുമ്പും വരുന്ന ബന്ധകത്തെ സ്വാഭാവിക മലയാള പട്ടികാശൈലിയിൽ കോമകളാൽ പ്രതിനിധീകരിച്ചു; അവസാനത്തെ ചുരുക്കപ്പട്ടികയിലും പ്രത്യേകം ‘എന്നിവ’ ചേർക്കാതെ മൂലത്തിന്റെ ലഘുരൂപം സൂക്ഷിച്ചു.
