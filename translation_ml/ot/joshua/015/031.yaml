  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ബൈബിൾ സ്ഥലനാമങ്ങൾക്ക് യോജിച്ച ഗൗരവമുള്ള ലിപ്യന്തരണശൈലി. മൂലത്തിലെ പേരുകളുടെ പട്ടികയായ സംക്ഷിപ്ത ഘടന നിലനിർത്തിയിരിക്കുന്നു.
