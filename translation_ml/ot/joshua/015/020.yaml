  source_fidelity: The draft accurately conveys the demonstrative summary, the land-inheritance sense of נַחֲלָה, tribal identity, and the clan-level distribution. However, the Malayalam dative construction in “ഗോത്രത്തിന് ... അവകാശഭൂമി” weakens the Hebrew construct relationship, which is ‘the inheritance of the tribe,’ not simply land ‘for the tribe.’
