lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ സൂചകസർവനാമം മുമ്പ് വിവരിച്ച ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. വിവരണത്തിന്റെ സമാപനസംഗ്രഹമായതിനാൽ മലയാളത്തിൽ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്; എങ്കിലും ഹീബ്രുവിലെ കാലസൂചനയില്ലാത്ത രൂപം ‘ഇതാണ്’ എന്ന വിവർത്തനവും അനുവദിക്കുന്നു.
- source_word: נַחֲלַת
  choice: അവകാശഭൂമി
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ ഈ പദം അവകാശമായി ലഭിച്ച ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ എന്നത് അവകാശത്തിന്റെയും ഭൂവിഹിതത്തിന്റെയും ആശയങ്ങൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഗോത്രപരമായ ഈ സന്ദർഭത്തിൽ പദത്തിന്റെ അർഥം ‘ഗോത്രം’ എന്നാണ്; ‘വടി’ എന്ന മൂലാർഥം ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: בְנֵי יְהוּדָה
  choice: യെഹൂദാമക്കൾ
  rationale: ഹീബ്രുവിലെ ‘യെഹൂദയുടെ മക്കൾ’ എന്ന വംശപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി ‘യെഹൂദാമക്കൾ’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലതലത്തിലുള്ള കുടുംബവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. לְ എന്ന ഉപസർഗത്തിന്റെ വിതരണാർഥം ‘അനുസരിച്ച്’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
