  revised_text: ഇതായിരുന്നു യെഹൂദാമക്കളുടെ ഗോത്രത്തിന്റെ, അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി.[a]
