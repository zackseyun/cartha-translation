  terminology: ‘അവകാശഭൂമി,’ ‘ഗോത്രം,’ and ‘കുലങ്ങൾ’ are appropriate modern-standard Malayalam terms for the land allotment, tribe, and clan groupings. ‘യെഹൂദാമക്കൾ’ suitably retains the source’s genealogical idiom.
