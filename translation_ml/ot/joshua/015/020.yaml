translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗോത്രഭൂവിഭജനത്തിന്റെ സാങ്കേതിക അർഥം വ്യക്തമാക്കാൻ ‘അവകാശഭൂമി’, ‘കുലങ്ങൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ വർത്തമാന/ഭൂതകാല അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
