source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: ml
  text: കെനസിന്റെ മകനായ ഒത്നീയേൽ, കാലേബിന്റെ സഹോദരൻ,[b] അതിനെ[a] പിടിച്ചടക്കി. അപ്പോൾ കാലേബ് തന്റെ മകൾ അക്സായെ അവന് ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുൻവാക്യത്തിൽ പറഞ്ഞ കിര്യത്ത്-സേഫെർ അഥവാ ദെബീർ നഗരത്തെ.
    reason: cross_reference
  - marker: b
    text: എബ്രായ വാക്യഘടനയിൽ ‘കാലേബിന്റെ സഹോദരൻ’ എന്ന പ്രയോഗം ഒത്നീയേലിനെയോ കെനസിനെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം. ‘സഹോദരൻ’ എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ അടുത്ത ബന്ധു എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: അത് പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയയുടെ സൈനികമായ ‘പിടിച്ചെടുക്കുക/കീഴടക്കുക’ എന്ന അർഥം ‘പിടിച്ചടക്കി’ സ്വാഭാവികമായി നൽകുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עָתְנִיאֵל
  choice: ഒത്നീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן קְנַז
  choice: കെനസിന്റെ മകനായ
  rationale: പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന ലളിതമായ എബ്രായ ഘടന മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲחִי כָלֵב
  choice: കെനസ് കാലേബിന്റെ സഹോദരനായിരുന്നു
  rationale: അടുത്തുള്ള ‘കെനസ്’ എന്ന പേരോടാണ് ഈ സമാസപ്രയോഗം സ്വാഭാവികമായി ചേരുന്നത്. אָח എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘സഹോദരൻ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിപുലമായ ബന്ധുവർഗാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּתֶּן לוֹ
  choice: അപ്പോൾ കാലേബ് ... അവന് ... കൊടുത്തു
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് കർത്താവ് കാലേബാണെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ പേര് ആവർത്തിക്കുന്നു; ‘അപ്പോൾ’ കഥാഗതിയിലെ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: തന്റെ മകൾ അക്സയെ
  rationale: പേരും മകൾബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകുന്നു; ‘തന്റെ’ എന്നത് കാലേബിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹത്തിൽ കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: אֲחִי כָלֵב ആരെയാണ് വിശേഷിപ്പിക്കുന്നത്
  choice: കാലേബിന്റെ സഹോദരൻ കെനസാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു
  alternative: ഒത്നീയേൽ കാലേബിന്റെ സഹോദരനാണെന്നോ ബന്ധം വ്യാകരണപരമായി വ്യക്തമാക്കാതെയോ പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായ പദക്രമത്തിൽ ഈ വിശേഷണം തൊട്ടുമുമ്പുള്ള കെനസിനോടാണ് ഏറ്റവും സ്വാഭാവികമായി ചേരുന്നത്. വംശാവലിസന്ദർഭത്തോടും ഇത് യോജിക്കുന്നു; എങ്കിലും ‘സഹോദരൻ’ എന്ന പദത്തിന്റെ വിപുലാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പിടിച്ചടക്കി’ സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു. ബന്ധസൂചനയിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ഇടവാക്യം ഉപയോഗിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
