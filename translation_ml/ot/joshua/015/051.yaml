  text: 'Goshen, Holon, and Giloh: eleven cities with their villages.'
translation:
  language: ml
  text: ഗോശെൻ, ഹോലോൻ, ഗിലോ—അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ പതിനൊന്നു പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: ഗോശെൻ
  rationale: സ്ഥലപ്പേര്; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: חֹלֹן
  choice: ഹോലോൻ
  rationale: സ്ഥലപ്പേര്; ആദ്യാക്ഷരമായ ח-യെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഹ’കൊണ്ട് പ്രതിനിധീകരിച്ചു.
- source_word: גִלֹה
  choice: ഗീലോ
  rationale: സ്ഥലപ്പേര്; എബ്രായത്തിലെ ദീർഘസ്വരവും അവസാനത്തെ ה സൂചിപ്പിക്കുന്ന ‘ഓ’ ശബ്ദവും നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: പ്രദേശപ്പട്ടികയിലെ നഗരവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַחַת עֶשְׂרֵה
  choice: പതിനൊന്നു
  rationale: ‘പട്ടണങ്ങൾ’ എന്നതിന്റെ എണ്ണം സൂചിപ്പിക്കുന്ന സംഖ്യ; മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: חַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ചേർന്ന ആശ്രിത ഗ്രാമീണ വാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം മുൻപറഞ്ഞ പട്ടണങ്ങളിലേക്കു തിരിച്ചുപോകുന്നതും ‘അവയുടെ’ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രദേശപ്പട്ടികാ ശൈലി. എബ്രായ വാക്യക്രമത്തിലെ പേരുകളുടെ പട്ടികയ്ക്കുശേഷമുള്ള ആകെ എണ്ണവും ആശ്രിത ഗ്രാമങ്ങളും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിച്ചു.
