translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂപരിധിവിവരണശൈലി സ്വീകരിച്ചു. സ്ഥലനാമം ലിപ്യന്തരിച്ചു; സാങ്കേതികമായ ‘വാദി’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘ഈജിപ്തുതോട്’ എന്ന പദത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
