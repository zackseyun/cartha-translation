  - severity: low
    issue: «ഈജിപ്തുതോട്» is an awkward noun compound in modern standard Malayalam.
    rationale: «ഈജിപ്തിലെ തോട്» is more idiomatic while retaining the lexical distinction from a major river. The footnote anchor remains directly attached to the expression it explains.
