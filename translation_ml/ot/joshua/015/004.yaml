  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: ml
  text: പിന്നെ അത് അസ്മോൻ വരെ നീങ്ങി, ഈജിപ്തിലെ തോടിലേക്കു[a] ചെന്നു; അതിർത്തി കടലിൽ അവസാനിച്ചു. ഇതായിരിക്കും നിങ്ങളുടെ തെക്കേ അതിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിലെ വാദി.” ഹീബ്രുവിലെ നഹൽ എന്ന പദം പലപ്പോഴും കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന നീർച്ചാലിനെയോ അതിന്റെ താഴ്‌വരയെയോ സൂചിപ്പിക്കുന്നു. “ഈജിപ്തുനദി” എന്ന പരമ്പരാഗത പരിഭാഷയും സാധ്യമാണ്; എന്നാൽ ഇവിടെ അത് നൈൽ നദിയാണെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: പിന്നെ അത് … കടന്ന്
  rationale: അതിർത്തിയുടെ സഞ്ചാരപഥം അടുത്ത സ്ഥലത്തേക്കു തുടരുന്നതാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘കടന്ന്’ എന്നത് ഭൂപരിധിവിവരണത്തിൽ സ്വാഭാവികവും മൂലക്രിയയുടെ ചലനഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: עַצְמוֹנָה
  choice: അസ്മോനിലേക്കു
  rationale: സ്ഥലനാമമായ עַצְמוֹן മലയാളലിപിയിൽ ‘അസ്മോൻ’ എന്നു ലിപ്യന്തരിച്ചു; ദിശാസൂചകമായ ഹീബ്രു പ്രത്യയം ‘-ലേക്കു’ എന്നാക്കി.
- source_word: וְיָצָא
  choice: ചെന്നു
  rationale: അതിർത്തിവിവരണത്തിൽ יצא അതിർത്തിരേഖ ഒരു ലക്ഷ്യസ്ഥാനത്ത് എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘പുറപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘ചെന്നു’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נַחַל מִצְרַיִם
  choice: ഈജിപ്തുതോട്
  rationale: נַחַל സാധാരണയായി വലിയ നദിയെയല്ല, കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന തോടിനെയോ വാദിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഈജിപ്തുതോട്’ സ്ഥലനാമസ്വഭാവം നിലനിർത്തുകയും നൈൽ നദിയാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: അതിർത്തി കടലിൽ അവസാനിച്ചു
  rationale: ഹീബ്രു പ്രയോഗം അതിർത്തിയുടെ അറ്റം കടലിന്റെ ദിശയിലാണെന്നു പറയുന്നു. ഈ സന്ദർഭത്തിൽ കടൽ മധ്യധരണ്യാഴിയാണ്; പേര് പാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തി.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: ഇതായിരിക്കും നിങ്ങളുടെ തെക്കേ അതിർത്തി
  rationale: נֶגֶב ഇവിടെ പ്രദേശനാമമായ ‘നെഗെവ്’ എന്നതിലുപരി തെക്കുദിശയെ സൂചിപ്പിക്കുന്നു. വാക്യം മുമ്പു വിവരിച്ച രേഖയെ തെക്കേ അതിർത്തിയായി സംഗ്രഹിക്കുന്നു.
