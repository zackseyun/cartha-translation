source:
  edition: WLC
  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: ml
  text: അതിർത്തി അവിടെനിന്ന് തെക്കോട്ട് അക്രബ്ബീം കയറ്റത്തിലേക്കു[a] ചെന്നു, സീനിലേക്കു കടന്നു, തെക്കുനിന്ന് കാദേശ്-ബർന്നേയയിലേക്കു കയറി, ഹെസ്രോൻ കടന്ന്, അദ്ദാറിലേക്കു കയറി, കാർക്കായിലേക്കു[b] തിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അക്രബ്ബീം” എന്ന പേരിന് സാധ്യതയുള്ള അർഥം “തേളുകൾ” എന്നാണ്; ഇവിടെ അതൊരു സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കാർക്കാ” എന്ന സ്ഥലനാമത്തിന്റെ ലിപ്യന്തരണം അനിശ്ചിതമാണ്; “കർക്കാഅ” എന്നും എഴുതാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: അതിർത്തി അവിടെനിന്ന് ... ചെന്നു
  rationale: അതിർത്തിവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ കർത്താവ് അതിർത്തിരേഖയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ക്രിയയിലെ മുന്നോട്ടുള്ള ഗതിയും നിലനിർത്തുന്നു.
- source_word: אֶל מִנֶּגֶב
  choice: തെക്കോട്ട്
  rationale: അതിർത്തിയുടെ സഞ്ചാരദിശയെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: അക്രബ്ബീം കയറ്റംവരെ
  rationale: מַעֲלֵה എന്നത് ഉയർന്നുപോകുന്ന വഴിയെയോ കയറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; עַקְרַבִּים സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְעָבַר צִנָה
  choice: സീനിലേക്കു കടന്നു
  rationale: עבר എന്ന ഗതിക്രിയയുടെ കടന്നുപോകൽഭാവവും ദിശാസൂചനയുള്ള צִנָה എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: തെക്കുനിന്ന് കാദേശ്-ബർന്നേയയിലേക്കു കയറി
  rationale: മസോററ്റിക് പാഠത്തിലെ מן ... ל ഘടനയെ ചലനമായി നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; കാദേശ്-ബർന്നേയയുടെ തെക്കുഭാഗത്തുകൂടി പോയി എന്ന മറ്റൊരു വ്യാഖ്യാനം വാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: וְעָבַר חֶצְרוֹן
  choice: ഹെസ്രോൻ കടന്ന്
  rationale: അതിർത്തിരേഖ ഒരു സ്ഥലത്തെ കടന്നുപോകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וְעָלָה אַדָּרָה
  choice: അദ്ദാറിലേക്കു കയറി
  rationale: ദിശാസൂചകമായ സ്ഥലനാമരൂപവും ഉയർന്നുപോകുന്ന ഗതിയും സംരക്ഷിക്കുന്നു.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: കാർക്കായിലേക്കു തിരിഞ്ഞു
  rationale: נסב അതിർത്തിയുടെ വളവിനെയോ ദിശാമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമത്തിലെ ദിശാസൂചക ה രൂപം ‘-യിലേക്ക്’ എന്നാക്കി.
