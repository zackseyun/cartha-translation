translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഭൂവിഭാഗപ്പട്ടികയ്ക്കനുയോജ്യമായ സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ഇംഗ്ലീഷ് കരടിലെ രണ്ടാമത്തെ അടിക്കുറിപ്പ് ബേത്ത്-പേലെത്തിനോടാണ് ബന്ധപ്പെട്ടതെങ്കിലും അതിന്റെ [b] അടയാളം ഹെശ്മോനിന് പിന്നാലെ തെറ്റായി നൽകിയതായി തോന്നുന്നതിനാൽ, ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ആ അനാവശ്യ അടിക്കുറിപ്പ് ഉൾപ്പെടുത്തിയിട്ടില്ല.
