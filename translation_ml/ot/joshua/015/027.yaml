- source_word: חֲצַר גַּדָּה
  choice: ഹസർ-ഗദ്ദാ
  rationale: യെഹൂദയുടെ പ്രദേശപ്പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. സംയുക്ത സ്ഥലനാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: חֶשְׁמוֹן
  choice: ഹെശ്മോൻ
  rationale: സ്ഥലനാമമായതിനാൽ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֵּית פָּלֶט
  choice: ബേത്ത്-പേലെത്ത്
  rationale: ‘പേലെത്തിന്റെ വീട്’ എന്നു അർഥപരമായി വിവർത്തനം ചെയ്യാതെ സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു; ഘടകബന്ധം കാണിക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: וְ / וּ
  choice: പട്ടികയിലെ വിരാമചിഹ്നങ്ങൾ
  rationale: എബ്രായത്തിലെ ബന്ധകങ്ങൾ സ്ഥലനാമങ്ങളെ ഏകോപിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ കോമകളാൽ ഇവ വേർതിരിച്ചു; അവസാന ഇനത്തിനുമുമ്പ് നിർബന്ധമായി ‘ഉം’ ചേർക്കുന്നത് ഒഴിവാക്കി.
