  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായമൂലത്തിൽ യെഹൂദയിലെ പട്ടണനാമങ്ങളുടെ ലളിതമായ ഒരു പട്ടികയാണ്: “യാർമൂത്ത്, അദുല്ലാം, സോഖോ, അസേക്കാ.” ഈ സ്ഥലനാമങ്ങളുടെ മലയാള ലിപ്യന്തരണത്തിൽ, പ്രത്യേകിച്ച് “സോഖോ” എന്ന പേരിൽ, രൂപഭേദങ്ങൾ കാണാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: യാർമൂത്ത്
  rationale: യെരൂശലേമിനു സമീപമുള്ള യെഹൂദാപട്ടണത്തിന്റെ എബ്രായ നാമം അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַ/עֲדֻלָּם
  choice: അദുല്ലാം
  rationale: വാവു സംയോജകത്തോടുകൂടിയ സ്ഥലനാമം. മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാശൈലിയിൽ സംയോജകത്തിന്റെ അർഥം വിരാമചിഹ്നങ്ങളിലൂടെ പ്രകടമാക്കി; നാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: שׂוֹכֹה
  choice: സോഖോ
  rationale: യെഹൂദയിലെ പട്ടണനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; മലയാള വിവർത്തനപാരമ്പര്യത്തിൽ രൂപഭേദങ്ങൾ കാണാം.
- source_word: וַ/עֲזֵקָה
  choice: അസേക്കാ
  rationale: വാവു സംയോജകത്തോടുകൂടിയ അവസാന സ്ഥലനാമം. മലയാളത്തിലെ പട്ടികാശൈലിയിൽ അവസാനത്തെ ‘ഉം/കൂടാതെ’ നിർബന്ധമായി ചേർക്കാതെ വിരാമചിഹ്നങ്ങളിലൂടെ നിര പ്രകടമാക്കി; നാമം ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായത്തിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു; മുഖ്യപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
