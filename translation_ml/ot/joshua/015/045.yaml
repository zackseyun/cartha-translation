  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ חֲצֵרִים ചെറിയ കുടിയിരിപ്പുകളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ഗ്രാമങ്ങൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യപദമാണ്.
