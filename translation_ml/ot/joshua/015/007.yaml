  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകി. ദീർഘമായ എബ്രായ ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; സ്ഥലബന്ധങ്ങൾ നിലനിർത്തി.
