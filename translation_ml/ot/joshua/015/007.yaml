base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: ml
  text: അതിർത്തി ആഖോർ താഴ്വരയിൽനിന്ന് ദെബീറിലേക്കു കയറി; പിന്നെ വടക്കോട്ടു തിരിഞ്ഞ് ഗിൽഗാലിലേക്കു[a] നീങ്ങി. ഗിൽഗാൽ, തോടിന്റെ[b] തെക്കുവശത്തുള്ള അദുമ്മീം കയറ്റത്തിന് എതിർവശത്താണ്. തുടർന്ന് അതിർത്തി ഏൻ-ശേമെശിലെ വെള്ളത്തിലേക്കു കടന്നുചെന്നു; അതിന്റെ അറ്റം[c] ഏൻ-രോഗേലിൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗിൽഗാലിലേക്കു’ എന്നത് ഗിൽഗാലിന്റെ ദിശയിലേക്കു തിരിഞ്ഞു എന്നോ അതിർത്തി ഗിൽഗാലിലേക്കു നീങ്ങി എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘തോട്’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന നീർച്ചാലിനെയോ അതിന്റെ താഴ്‌വരയെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുറപ്പെടുന്നിടങ്ങൾ’ എന്ന ബഹുവചനപ്രയോഗമാണ്; അതിർത്തിവിവരണത്തിൽ ഇത് അതിന്റെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: അതിർത്തി ... കയറി
  rationale: അതിർത്തിവിവരണങ്ങളിൽ עלה ഉയർന്ന ഭൂപ്രദേശത്തേക്കുള്ള നീക്കത്തെയോ മേലോട്ടുള്ള ഗതിയെയോ സൂചിപ്പിക്കുന്നു; ‘കയറി’ ഈ ഭൂപ്രകൃതിസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: ആഖോർ താഴ്വരയിൽനിന്ന് ദെബീറിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה ദെബീറിലേക്കുള്ള നീക്കവും מִן ആരംഭസ്ഥലവും വ്യക്തമാക്കുന്നു.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: പിന്നെ വടക്കോട്ടു തിരിഞ്ഞ്
  rationale: פנה ദിശമാറ്റത്തെയോ ആ ദിശയിലേക്കു മുഖം തിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; അതിർത്തിരേഖയുടെ പശ്ചാത്തലത്തിൽ ‘തിരിഞ്ഞ്’ സ്വാഭാവികമാണ്.
- source_word: אֶל הַגִּלְגָּל
  choice: ഗിൽഗാലിലേക്കു
  rationale: אֶל ലക്ഷ്യത്തിലേക്കുള്ള ദിശയെയോ അവിടേക്കുള്ള നീക്കത്തെയോ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ‘-ലേക്കു’ ഈ രണ്ടു സാധ്യതകളും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: അദുമ്മീം കയറ്റത്തിന് എതിർവശത്ത്
  rationale: נֹכַח ‘എതിർവശത്ത്/അഭിമുഖമായി’ എന്നും מַעֲלֵה ഭൂപ്രദേശത്തിലെ കയറ്റം എന്നും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: തോടിന്റെ തെക്കുവശത്തുള്ള
  rationale: נֶגֶב ഇവിടെ ദിശയായ തെക്കിനെ സൂചിപ്പിക്കുന്നു. נַחַל ഈ ഭൂപ്രകൃതിവിവരണത്തിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന തോടോ നീർച്ചാലോ ആകാം; വായനാസൗകര്യത്തിന് ‘തോട്’ തിരഞ്ഞെടുത്തു.
- source_word: וְעָבַר הַגְּבוּל
  choice: തുടർന്ന് അതിർത്തി ... കടന്നുചെന്നു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ עבר അടുത്ത സ്ഥാനത്തേക്കു കടന്നുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും ഒരു ജലധാര മുറിച്ചുകടന്നുവെന്ന അർഥം ചുമത്താതെ ഗതി വ്യക്തമാക്കുന്നു.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: ഏൻ-ശേമെശിലെ വെള്ളത്തിലേക്കു
  rationale: מֵי എന്ന ബഹുവചനരൂപത്തിന്റെ ‘വെള്ളം/ജലങ്ങൾ’ എന്ന അർഥം നിലനിർത്തുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: അതിന്റെ അറ്റം ഏൻ-രോഗേലിൽ ആയിരുന്നു
  rationale: അതിർത്തിവിവരണത്തിൽ תֹצְאוֹתָיו അതിർത്തിയുടെ അവസാനസ്ഥാനം സൂചിപ്പിക്കുന്നു. എബ്രായയിലെ ബഹുവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനമായ ‘അറ്റം’ എന്നു നൽകി, കുറിപ്പിൽ അക്ഷരാർഥം രേഖപ്പെടുത്തി.
