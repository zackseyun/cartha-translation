  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: ml
  text: “സാക്ഷ്യപെട്ടകം ചുമക്കുന്ന പുരോഹിതന്മാരോട് യോർദ്ദാനിൽനിന്ന് കയറിവരാൻ കല്പിക്കുക.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാക്ഷിയുടെ പെട്ടകം.” എബ്രായപാഠത്തിൽ ഇവിടെ പരിചിതമായ “നിയമം” എന്നതിനു പകരം “സാക്ഷ്യം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: കല്പിക്കുക
  rationale: צוה എന്ന ക്രിയയുടെ ഏകവചന പുല്ലിംഗ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചയാർഥക ഘടകമുള്ള כהנים എന്ന പദത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: נֹשְׂאֵי
  choice: ചുമക്കുന്ന
  rationale: נשׂא എന്ന ക്രിയയുടെ ബഹുവചന കർത്തൃവാചക കൃന്ദന്തരൂപം പുരോഹിതന്മാരെ വിശേഷിപ്പിക്കുന്നു; തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן הָעֵדוּת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: ഇവിടെ മൂലപാഠം ‘നിയമപെട്ടകം’ എന്നല്ല, עֵדוּת എന്ന ‘സാക്ഷ്യം/സാക്ഷ്യരേഖ’ സൂചിപ്പിക്കുന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. മലയാളത്തിലെ ബൈബിൾപരമായ സംയുക്തരൂപം ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְיַעֲלוּ
  choice: കയറിവരാൻ
  rationale: עלה എന്നതിന്റെ ‘കയറുക/മുകളിലേക്കു വരുക’ എന്ന അർഥം, നദീതടത്തിൽനിന്നു കരയിലേക്കുള്ള ചലനമെന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִן הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽ നിലനിർത്തുന്നു; ‘യോർദ്ദാൻ’ എന്ന പേരിലൂടെ സന്ദർഭത്തിലെ നദി വ്യക്തമാണ്.
theological_decisions:
- issue: പെട്ടകത്തിന്റെ വിശേഷണം
  choice: സാക്ഷ്യപെട്ടകം
  alternative: നിയമപെട്ടകം
  rationale: പല ഇടങ്ങളിലും പരിചിതമായ ‘നിയമപെട്ടകം’ എന്ന പ്രയോഗത്തിലേക്ക് സമന്വയിപ്പിക്കാതെ, ഈ വാക്യത്തിലെ עֵדוּת എന്ന പ്രത്യേക മൂലപദം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ നേരിട്ടുള്ള ആജ്ഞയുടെ ശക്തിയും ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലിയും നിലനിർത്തി. ‘കയറിവരുക’ നദീതടത്തിൽനിന്ന് കരയിലേക്കുള്ള ചലനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
