  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. വാക്യത്തിന്റെ മുഖ്യപ്രവാഹം വ്യക്തമാക്കാൻ പ്രതിനിധിവാക്യം ദീർഘവിരാമങ്ങൾക്കുള്ളിൽ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
