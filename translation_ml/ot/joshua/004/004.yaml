  language: ml
  text: അപ്പോൾ യോശുവ, ഇസ്രായേൽമക്കളിൽനിന്ന് താൻ നിയോഗിച്ചിരുന്ന പന്ത്രണ്ടുപേരെ—ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോരുത്തനെ വീതം—വിളിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിയോഗിച്ചിരുന്ന” എന്നതിന് “ഒരുക്കിയിരുന്ന” അഥവാ “നിശ്ചയിച്ചിരുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
