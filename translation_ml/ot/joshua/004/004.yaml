lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: വിളിച്ചു
  rationale: קרא אל എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ തിരഞ്ഞെടുത്തവരെ തന്റെ അടുക്കലേക്കു വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചു’ സ്വാഭാവികവും മൂലത്തിലെ ശക്തി അതിരുകടക്കാത്തതുമാണ്.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: പന്ത്രണ്ടുപേരെ
  rationale: മുമ്പേ തിരിച്ചറിയപ്പെട്ട നിശ്ചിത സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പന്ത്രണ്ടുപേരെ’ എന്നത് പുരുഷന്മാരടങ്ങിയ സംഘത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲשֶׁר הֵכִין
  choice: താൻ നിയോഗിച്ചിരുന്ന
  rationale: הכין എന്നതിന് ‘ഒരുക്കുക, സജ്ജമാക്കുക, നിയോഗിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. മുൻസന്ദർഭത്തിൽ പ്രതിനിധികളെ തിരഞ്ഞെടുത്തതിനാൽ ‘നിയോഗിച്ചിരുന്ന’ ഇവിടെ വ്യക്തവും യോജിച്ചതുമാണ്; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്ന്
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പരമ്പരാഗത ജനസമൂഹസൂചക പ്രയോഗത്തിന്റെ രൂപഭാവം ‘ഇസ്രായേൽമക്കൾ’ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോരുത്തനെ വീതം
  rationale: ഹീബ്രായയിലെ വിതരണാർഥമുള്ള ആവർത്തനം മലയാളത്തിൽ ‘ഓരോ ... ഓരോരുത്തനെ വീതം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
