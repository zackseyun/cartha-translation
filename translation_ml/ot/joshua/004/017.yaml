translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വരുവിൻ’ എന്ന രൂപം കല്പനയുടെ മാന്യതയും ബഹുവചനവും വ്യക്തമായി സൂക്ഷിക്കുന്നു; അത്യന്തം പഴഞ്ചനായ പദക്രമം ഒഴിവാക്കിയിരിക്കുന്നു.
