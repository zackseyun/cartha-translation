source:
  edition: WLC
  text: וַ/יְצַ֣ו יְהוֹשֻׁ֔עַ אֶת הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר עֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ പുരോഹിതന്മാരോടു കല്പിച്ചു: “യോർദ്ദാനിൽനിന്നു കയറിവരുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: അപ്പോൾ ... കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആധികാരികമായ കല്പനാഭാവം ‘കല്പിച്ചു’ നിലനിർത്തുന്നു; വാവ്-തുടർച്ചയുടെ ആഖ്യാനബന്ധം സ്വാഭാവികമായി ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: אֶת הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരോടു
  rationale: നേരിട്ടുള്ള കർമമായ ‘പുരോഹിതന്മാരെ’ എന്നതിനെക്കാൾ, മലയാളത്തിൽ കല്പനയുടെ സ്വീകർത്താവിനെ ‘-ഓടു’ ചേർത്ത് പറയുന്നത് സ്വാഭാവികമാണ്; നിർദ്ദിഷ്ടസംഘം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לֵאמֹר
  choice: 'കല്പിച്ചു:'
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി തുടങ്ങുന്ന לֵאמֹר എന്ന ഘടകം മലയാളത്തിൽ വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു നൽകാതെ ഉദ്ധരണിചിഹ്നവും ദ്വിബിന്ദുവുംകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: עֲלוּ
  choice: കയറിവരുവിൻ
  rationale: עלהയുടെ ‘മുകളിലേക്കു കയറുക’ എന്ന അർഥവും സംസാരിക്കുന്നവന്റെ ഭാഗത്തേക്കുള്ള ചലനവും ഒരുമിച്ച് അറിയിക്കുന്നു; ബഹുവചന കല്പനാരൂപവും നിലനിർത്തുന്നു.
- source_word: מִן הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽനിന്നു
  rationale: מן ഇവിടെ നദിക്കുള്ളിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ‘കയറിവരുവിൻ’ എന്ന ക്രിയയോടൊപ്പം ‘-ൽനിന്നു’ ആ ആശയം വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നദി’ ചേർത്തിട്ടില്ല.
