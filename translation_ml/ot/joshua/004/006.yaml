  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: ml
  text: ഇത് നിങ്ങളുടെ ഇടയിൽ ഒരു അടയാളമായിരിക്കേണ്ടതിന്, ഭാവിയിൽ[c] നിങ്ങളുടെ മക്കൾ[a], ‘ഈ കല്ലുകൾ നിങ്ങൾക്കു എന്താണ് അർഥമാക്കുന്നത്?’[b] എന്നു ചോദിക്കുമ്പോൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പദശഃ ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ അത് അടുത്ത തലമുറയെ പ്രതിനിധീകരിച്ചാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ഈ കല്ലുകൾ നിങ്ങൾക്കു എന്ത്?’'
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ പദശഃ ‘നാളെ’; ഇവിടെ അത് ‘പിന്നീട്’ അഥവാ ‘ഭാവിയിൽ’ എന്ന അർഥത്തിൽ പ്രയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּהְיֶה
  choice: ആയിരിക്കേണ്ടതിന്
  rationale: לְמַעַן അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യവും അതിനെത്തുടരുന്ന അപൂർണക്രിയയുടെ ഉദ്ദേശിതഫലവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אוֹת
  choice: അടയാളം
  rationale: പ്രതീകാത്മകമായി സൂചിപ്പിക്കുന്ന ഒന്നെന്ന അടിസ്ഥാന അർഥം നേരിട്ട് നൽകുന്നു; സ്മാരകസ്വഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹത്തിനുള്ളിലെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ മക്കൾ
  rationale: രൂപപരമായി ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഇവിടെ സ്മാരകത്തെക്കുറിച്ച് ചോദിക്കുന്ന അടുത്ത തലമുറയെ പ്രതിനിധീകരിക്കുന്നതിനാൽ ‘മക്കൾ’ ഉദ്ദേശ്യാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מָחָר
  choice: ഭാവിയിൽ
  rationale: പദശഃ ‘നാളെ’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ പിന്നീടുള്ള കാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ ‘ഭാവിയിൽ’ എന്നാണ് സ്വാഭാവിക വിവർത്തനം.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: ഈ കല്ലുകൾ നിങ്ങൾക്ക് എന്താണ് അർഥം?
  rationale: പദശഃ ‘ഈ കല്ലുകൾ നിങ്ങൾക്ക് എന്ത്?’ എന്ന ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം, അവയുടെ പ്രാധാന്യം എന്തെന്ന ചോദ്യം, സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵיכֶם എന്നതിലെ ലിംഗസൂചന
  choice: നിങ്ങളുടെ മക്കൾ
  alternative: നിങ്ങളുടെ പുത്രന്മാർ
  rationale: പുരുഷലിംഗ ബഹുവചനരൂപം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും ഈ സന്ദർഭത്തിൽ ചോദിക്കുന്ന അടുത്ത തലമുറയെ പ്രതിനിധീകരിക്കുന്നു; പുരുഷന്മാർക്കു മാത്രമായുള്ള നിയന്ത്രണം വാചകം ഉദ്ദേശിക്കുന്നില്ല.
- issue: מָחָר എന്നതിന്റെ കാലസൂചന
  choice: ഭാവിയിൽ
  alternative: നാളെ
  rationale: ഇവിടെ ‘നാളെ’ എന്ന പദം അടുത്ത കലണ്ടർദിവസത്തെക്കാൾ, വരാനിരിക്കുന്ന കാലത്തെ പ്രയോഗപരമായി സൂചിപ്പിക്കുന്നു; ആ വ്യാപ്തി പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യാവസാനത്തിലെ ദീർഘരേഖ അടുത്ത വാക്യത്തിൽ വരുന്ന ഉത്തരത്തിലേക്കുള്ള എബ്രായ വാക്യഘടനയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; അർഥം മുൻകൂട്ടി പൂർണമാക്കുന്നില്ല.
