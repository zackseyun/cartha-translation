reference: Joshua 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: ml
  text: 'യോശുവ അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ പെട്ടകത്തിന്റെ മുമ്പിലൂടെ യോർദ്ദാന്റെ നടുവിലേക്കു കടന്നുചെല്ലുവിൻ. നിങ്ങളിൽ ഓരോ പുരുഷനും ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളുടെ എണ്ണമനുസരിച്ച് ഓരോ കല്ല് തന്റെ തോളിൽ എടുത്തുകൊള്ളുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നതിനാൽ നിർബന്ധിതമായ ഒരു ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: עִבְרוּ
  choice: കടന്നുചെല്ലുക
  rationale: നദിയിലെ പെട്ടകം നിൽക്കുന്ന നടുവിലേക്കുള്ള സഞ്ചാരമാണ് സന്ദർഭം; അതിനാൽ വെറും ‘പോകുക’ എന്നതിനെക്കാൾ അതിർത്തി കടക്കുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിലൂടെ
  rationale: പെട്ടകവുമായി ബന്ധപ്പെട്ട സ്ഥലപരമായ സ്ഥാനം വ്യക്തമാക്കുന്നു; ‘മുമ്പിൽ’ എന്ന നിശ്ചല അർഥത്തേക്കാൾ ഇവിടെ സഞ്ചാരത്തിന് സ്വാഭാവികം.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ പെട്ടകം
  rationale: ഹീബ്രു സമാസബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ നടുവിലേക്ക്
  rationale: תּוֹךְ സൂചിപ്പിക്കുന്ന ഉൾഭാഗം/മധ്യഭാഗം ഒഴിവാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהָרִימוּ לָכֶם
  choice: എടുത്തുകൊള്ളട്ടെ
  rationale: കല്ല് ഉയർത്തി സ്വന്തമായി കൊണ്ടുപോകാനുള്ള ആജ്ഞാസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אִישׁ אֶבֶן אַחַת
  choice: ഓരോരുത്തനും ഓരോ കല്ല്
  rationale: ഹീബ്രുവിലെ വിതരണാത്മക ഏകവചനം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; സന്ദർഭത്തിൽ മുമ്പ് തിരഞ്ഞെടുത്ത പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്, എങ്കിലും മലയാളത്തിലെ ‘ഓരോരുത്തൻ’ സ്വാഭാവികമായ പുരുഷ ഏകവചനമാണ്.
- source_word: עַל שִׁכְמוֹ
  choice: തന്റെ തോളിൽ
  rationale: വിതരണാത്മക ഏകവചനവും വ്യക്തിഗത കൈവശബന്ധവും നിലനിർത്തുന്നു.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളുടെ എണ്ണമനുസരിച്ച്
  rationale: കല്ലുകളുടെ എണ്ണവും ഗോത്രങ്ങളുടെ എണ്ണവും തമ്മിലുള്ള പൊരുത്തം വ്യക്തമാക്കുകയും בְנֵי יִשְׂרָאֵל എന്ന ഔപചാരിക പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ ആയി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണസ്വഭാവം അംഗീകരിച്ചുകൊണ്ട് മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹ്‌വെ’ രൂപം ഉപയോഗിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന ഹീബ്രു ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അതിനെ പൊതുവായ ജനവിഭാഗനാമമായി ചുരുക്കുന്നില്ല.
- issue: אִישׁ എന്ന പുരുഷലിംഗ വിതരണപദം
  choice: ഓരോരുത്തനും
  alternative: ഓരോ പുരുഷനും
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം ഗോത്രങ്ങളിൽനിന്ന് തിരഞ്ഞെടുത്ത പന്ത്രണ്ട് പുരുഷന്മാരെ വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ഈ ഏകവചന രൂപം ആ വ്യക്തിവിതരണം സ്വാഭാവികമായി നൽകുന്നു; ‘ഓരോ പുരുഷനും’ എന്ന് ആവർത്തിച്ച് ഭാരം കൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഹീബ്രു വാക്യഘടനയുടെ അനാവശ്യ അനുകരണം ഒഴിവാക്കി; ‘പെട്ടകം’, ‘യോർദ്ദാൻ’, ‘ഇസ്രായേൽമക്കൾ’ തുടങ്ങിയ ബൈബിൾസന്ദർഭ പദങ്ങൾ നിലനിർത്തി.
