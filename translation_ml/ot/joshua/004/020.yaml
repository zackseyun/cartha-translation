id: JOS.4.20
reference: Joshua 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֩ שְׁתֵּ֨ים עֶשְׂרֵ֤ה הָֽ/אֲבָנִים֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר לָקְח֖וּ מִן הַ/יַּרְדֵּ֑ן הֵקִ֥ים יְהוֹשֻׁ֖עַ בַּ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/020.yaml
  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: ml
  text: യോർദ്ദാനിൽനിന്ന് അവർ എടുത്ത ഈ പന്ത്രണ്ടു കല്ലുകൾ യോശുവ ഗിൽഗാലിൽ സ്ഥാപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: '[വാക്യാരംഭത്തിൽ പ്രത്യേകം പദമായി ചേർത്തില്ല]'
  rationale: וְ ആഖ്യാനത്തെ മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ ‘എന്നിട്ട്’ പോലൊരു പദം നിർബന്ധമായി ചേർക്കാതെ അവതരിപ്പിച്ചു. אֵת നേരിട്ടുള്ള കർമചിഹ്നമായതിനാൽ പ്രത്യേക പരിഭാഷയില്ല.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: ആ പന്ത്രണ്ടു കല്ലുകൾ
  rationale: സംഖ്യയും നാമവും നിർദ്ദേശകപദവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി. മുമ്പ് പരാമർശിച്ച കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിനാൽ ‘ആ’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר לָקְחוּ
  choice: അവർ എടുത്ത
  rationale: ബന്ധവാക്യം കല്ലുകളെ വിശേഷിപ്പിക്കുന്നു. മുൻകാലസംഭവം മലയാളത്തിൽ സന്ദർഭവും ക്രിയാക്രമവുംകൊണ്ട് വ്യക്തമായതിനാൽ കൃത്രിമമായ പൂർവപൂർണകാലരൂപം ഒഴിവാക്കി.
- source_word: מִן הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽനിന്ന്
  rationale: מן എന്ന ഉറവിടസൂചക അർഥം ‘-ൽനിന്ന്’ കൊണ്ട് കൃത്യമായി നൽകി; നദിയുടെ പരമ്പരാഗത മലയാളനാമം ‘യോർദ്ദാൻ’ ഉപയോഗിച്ചു.
- source_word: הֵקִים
  choice: നാട്ടിനിർത്തി
  rationale: സ്മാരകക്കല്ലുകൾ ഒരു സ്ഥലത്ത് സ്ഥാപിച്ചു നിർത്തുന്നതാണ് സന്ദർഭം. ‘നാട്ടിനിർത്തി’ എന്നത് ഈ ഭൗതിക പ്രവൃത്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗം മലയാളത്തിലെ ‘-ൽ’ വിഭക്തിയാൽ നൽകി; സ്ഥലനാമം ‘ഗിൽഗാൽ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ കർമം ആദ്യം വരുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി; അനാവശ്യ വിശദീകരണവും മതവിഭാഗസവിശേഷ പദപ്രയോഗവും ഒഴിവാക്കി.
