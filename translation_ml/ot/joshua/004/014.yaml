source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: ml
  text: അന്ന് യഹ്‌വെ യോശുവയെ എല്ലാ ഇസ്രായേല്യരുടെയും ദൃഷ്ടിയിൽ മഹാനാക്കി. മോശെ ജീവിച്ചിരുന്ന നാളുകളിലെല്ലാം അവർ മോശെയെ ഭയപ്പെട്ടിരുന്നതുപോലെ യോശുവയെയും ഭയപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭയാദരവോടെ കണ്ടു” അല്ലെങ്കിൽ “ആദരിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ഭയം, ഭയാദരം, അല്ലെങ്കിൽ ആദരവ് എന്നീ അർത്ഥങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നേ ദിവസം
  rationale: നേരിട്ടുള്ള ആഖ്യാനത്തിലെ സമയസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; הַהוּא നൽകുന്ന നിർദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: גִּדַּל
  choice: മഹാനാക്കി
  rationale: גדל എന്ന ക്രിയയുടെ പീയേൽ രൂപത്തിലുള്ള കാരണാർത്ഥം—യഹ്‌വെ യോശുവയെ മഹത്വമുള്ളവനായി കണക്കാക്കപ്പെടുമാറാക്കി—സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിന്റെയും കണ്ണിൽ
  rationale: പൊതുവായ വിലയിരുത്തലിനെയോ കാഴ്ചപ്പാടിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യരൂപം മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: യോശുവയെയും ഭയപ്പെട്ടു
  rationale: ירא ഉൾക്കൊള്ളുന്ന ഭയം, ഭയാദരം, ആദരപൂർവമായ ഭക്തി എന്നീ അർത്ഥസാധ്യതകളെ പ്രധാനപാഠത്തിൽ ‘ഭയപ്പെട്ടു’ എന്ന പദത്തിലൂടെ തുറന്നുവെക്കുന്നു; സർവനാമത്തിന്റെ സൂചിതവ്യക്തി മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘യോശുവ’ ആവർത്തിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെ
  rationale: മോശയോടും യോശുവയോടുമുള്ള ഇസ്രായേലിന്റെ പ്രതികരണങ്ങൾ തമ്മിലുള്ള നേരിട്ടുള്ള താരതമ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: അവർ മോശയെ ഭയപ്പെട്ടിരുന്നതു
  rationale: മോശയുടെ കാലത്തെ മുൻകാല പ്രതികരണത്തോടുള്ള താരതമ്യം മലയാളത്തിലെ ഭൂതകാല തുടർച്ചാരൂപത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל יְמֵי חַיָּיו
  choice: മോശെയുടെ ജീവിതകാലമത്രയും
  rationale: അടുത്ത മുൻപദമായ മോശയെയാണ് ഏകവചന പ്രത്യയം സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘മത്രയും’ മുഴുവൻ കാലപരിധിയും നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ നാമത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യോശുവയോടുള്ള ירא എന്ന പ്രതികരണത്തിന്റെ അർത്ഥനിറം
  choice: ഭയപ്പെട്ടു
  alternative: ഭയാദരവോടെ നിന്നു; ആദരിച്ചു
  rationale: ക്രിയയുടെ ഭയം, വിസ്മയാദരം, ബഹുമാനം എന്നീ അർത്ഥപരിധി മുൻകൂട്ടി ചുരുക്കാതെ നിലനിർത്തുന്നു. നേതൃസന്ദർഭം ഭീകരതയേക്കാൾ ആദരപൂർവമായ ഭയത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പ്രധാനപാഠം അതിനെ പൂർണമായി വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കണ്ണിൽ മഹാനാക്കി’ എന്ന എബ്രായ ദൃശ്യരൂപം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടു സർവനാമങ്ങളും യഥാക്രമം ‘മോശ’ എന്നും ‘യോശുവ’ എന്നും വ്യക്തമാക്കി.
