source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: ml
  text: ജനമെല്ലാം അക്കരെ കടന്നുകഴിഞ്ഞപ്പോൾ, യഹോവയുടെ പെട്ടകവും പുരോഹിതന്മാരും ജനത്തിന്റെ മുമ്പിൽ[a] അക്കരെ കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത്തിന്റെ സന്നിധിയിൽ’ അഥവാ ‘ജനത്തിന്റെ കൺമുന്നിൽ.’ ഹീബ്രായ പ്രയോഗത്തിന് ഒരാളുടെ മുന്നിലുള്ള സ്ഥാനത്തെയോ അയാളുടെ സാന്നിധ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …കഴിഞ്ഞപ്പോൾ
  rationale: ഇവിടെ וַיְהִי ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുകയും כַּאֲשֶׁר സമയബന്ധം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ ‘…കഴിഞ്ഞപ്പോൾ’ എന്നു പറയുന്നത് സ്വാഭാവികമായി അതേ ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: ജനമെല്ലാം അക്കരെ കടന്നുകഴിഞ്ഞപ്പോൾ
  rationale: תַּם പൂർത്തീകരണത്തെയും עבר നദി കടന്ന് മറുകരയിലെത്തുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘കടന്നുകഴിഞ്ഞപ്പോൾ’ മുൻപ്രവൃത്തി പൂർത്തിയായതും തുടർന്നുള്ള സംഭവവുമായുള്ള സമയബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: אֲרוֹן יְהוָה
  choice: യഹോവയുടെ പെട്ടകം
  rationale: ഹീബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ നേരായ അർഥം നിലനിർത്തുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְהַכֹּהֲנִים
  choice: പുരോഹിതന്മാരും
  rationale: വാക്യത്തിലെ וְ പെട്ടകത്തെയും പുരോഹിതന്മാരെയും കടന്നവരായി ഏകോപിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ഉം’ ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּעֲבֹר
  choice: അക്കരെ കടന്നു
  rationale: മുൻവാക്യഭാഗത്തിലെ עבר എന്ന അതേ ധാതുവുമായുള്ള പദസാമ്യം നിലനിർത്തുകയും യോർദ്ദാൻ കടക്കുന്നതിന്റെ ദിശ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי സ്ഥലപരമായി ‘മുന്നിൽ’ എന്നും ‘സന്നിധിയിൽ/കൺമുന്നിൽ’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്. ‘മുമ്പിൽ’ പ്രധാന സ്ഥലപരമായ അർഥം നൽകുമ്പോഴും ഹീബ്രായത്തിലെ അർഥവ്യാപ്തി പൂർണമായി അടച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: ദൈവനാമമായ יהוה എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വിശേഷണപ്പദവിക്കുപകരം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ, അത് മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- issue: לִפְנֵי הָעָם എന്നതിന്റെ സ്ഥലപരമോ സാന്നിധ്യപരമോ ആയ അർഥം
  choice: ജനത്തിന്റെ മുമ്പിൽ
  alternative: ജനത്തിന്റെ സന്നിധിയിൽ
  rationale: സന്ദർഭത്തിൽ സ്ഥലപരമായ ‘മുന്നിൽ’ എന്ന അർഥം സാദ്ധ്യമാണെങ്കിലും, എല്ലാവരും കടന്നുകഴിഞ്ഞ ശേഷമാണ് പെട്ടകവും പുരോഹിതന്മാരും കടക്കുന്നതെന്നതിനാൽ ‘ജനത്തെക്കാൾ മുമ്പായി’ എന്ന് നിർണയിക്കുന്നില്ല. പദത്തിന്റെ സാന്നിധ്യാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജനമെല്ലാം’ സമഗ്രത ഊന്നിപ്പറയുന്നു; ‘അക്കരെ കടന്നു’ യോർദ്ദാൻ കടക്കുന്നതിന്റെ ചലനബോധം സ്വാഭാവികമായി നൽകുന്നു. യഥാർഥ ഹീബ്രായ അർഥസന്ദിഗ്ധത [a] അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
