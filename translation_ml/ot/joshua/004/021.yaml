translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്ന ഉറവിടസുതാര്യമായ പരമ്പരാഗത പ്രയോഗം നിലനിർത്തി; മറ്റു ഘടകങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
