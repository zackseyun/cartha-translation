id: JOS.4.21
reference: Joshua 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אֲשֶׁר֩ יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ אֶת אֲבוֹתָ֣/ם לֵ/אמֹ֔ר מָ֖ה הָ/אֲבָנִ֥ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: ml
  text: 'അവൻ ഇസ്രായേൽമക്കളോടു പറഞ്ഞു: “ഭാവിയിൽ നിങ്ങളുടെ മക്കൾ അവരുടെ പിതാക്കന്മാരോട്, ‘ഈ കല്ലുകൾ എന്താണ്?’ എന്നു ചോദിക്കുമ്പോൾ,[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി “നാളെ”; ഇവിടെ ഭാവിയിലെ ഒരു കാലത്തെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഈ കല്ലുകൾ എന്താണ്?” എന്നത് എബ്രായത്തിന്റെ അക്ഷരാർഥത്തോട് അടുത്തതാണ്; “ഈ കല്ലുകൾ എന്തിനെ സൂചിപ്പിക്കുന്നു?” എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിലെ തുടർപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിന് ‘പറഞ്ഞു’ മതിയാകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ എബ്രായ പ്രയോഗം മലയാളത്തിലെ പരിചിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: ചോദിക്കുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാവുന്ന സാഹചര്യത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ മക്കൾ
  rationale: രൂപപരമായി ‘നിങ്ങളുടെ പുത്രന്മാർ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ പിൻതലമുറയിലെ മക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദം തെരഞ്ഞെടുത്തു.
- source_word: מָחָר
  choice: ഭാവിയിൽ
  rationale: അക്ഷരാർഥമായ ‘നാളെ’ ഇവിടെ വരാനിരിക്കുന്ന കാലത്തെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: אֶת אֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാരോട്
  rationale: കുട്ടികൾ തങ്ങളുടെ പിതാക്കന്മാരോടു ചോദിക്കുന്ന കുടുംബസന്ദർഭം നേരിട്ട് നിലനിർത്തുന്നു; ‘പൂർവികർ’ എന്നു വിപുലീകരിച്ചിട്ടില്ല.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: ഈ കല്ലുകൾ എന്താണ്?
  rationale: എബ്രായത്തിലെ തിരിച്ചറിയൽസ്വഭാവമുള്ള ചോദ്യത്തെ സുതാര്യമായി നിലനിർത്തുന്നു; സന്ദർഭസൂചിതമായ ‘ഇവയുടെ അർഥമെന്ത്?’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
