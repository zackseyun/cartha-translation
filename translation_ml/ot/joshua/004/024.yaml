reference: Joshua 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: ml
  text: ഭൂമിയിലെ[a] സകല ജനതകളും യഹ്‌വേയുടെ കൈ ശക്തമാണെന്ന് അറിയേണ്ടതിനും, നിങ്ങൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വേയെ നിങ്ങളുടെ ജീവിതകാലം മുഴുവൻ ഭയപ്പെടേണ്ടതിനുമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ദേശത്തിലെ സകല ജനതകളും’; הָאָרֶץ എന്ന പദം ഇവിടെ പ്രാദേശിക അർഥത്തിൽ എടുത്താൽ.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘ഭയപ്പെടുക’ എന്നതിൽ വെറും പേടി മാത്രമല്ല, യഹ്‌വേയോടുള്ള ഭക്ത്യാദരവും വിസ്മയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: അറിയേണ്ടതിന്
  rationale: לְמַעַן ഉദ്ദേശ്യം സൂചിപ്പിക്കുകയും דַּעַת അതിനോടുചേർന്ന ക്രിയാനാമരൂപമായി വരികയും ചെയ്യുന്നു; മലയാളത്തിൽ ‘അറിയേണ്ടതിന്’ ഈ ഉദ്ദേശ്യബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: עַמֵּי എന്നത് വ്യത്യസ്ത ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനതകൾ’ എന്നു നൽകി; ഈ സന്ദർഭത്തിൽ הָאָרֶץ ആഗോള അർഥത്തിൽ ‘ഭൂമി’ എന്നു മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: יַד יְהוָה
  choice: യഹ്‌വേയുടെ കൈ
  rationale: ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വിശദീകരിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ഉടമ്പടിനാമമായ ചതുരക്ഷരനാമം പേരായിത്തന്നെ ലിപ്യന്തരിച്ചു.
- source_word: כִּי חֲזָקָה הִיא
  choice: ശക്തിയുള്ളതാണെന്ന്
  rationale: സ്ത്രീലിംഗ സർവനാമം ‘കൈ’യെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; חֲזָקָהയുടെ നേരിട്ടുള്ള ഗുണാർഥം സംരക്ഷിക്കുന്നു.
- source_word: יְרָאתֶם אֶת יְהוָה
  choice: യഹ്‌വേയെ ... ഭയപ്പെടേണ്ടതിന്
  rationale: ירא എന്നതിലെ ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നിവയുടെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു; അതിനെ ‘ആദരിക്കുക’ എന്നു മാത്രം മൃദൂകരിക്കുന്നില്ല.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹ്‌വേയാണ് സൂചിതൻ; ഇവിടെ אֱלֹהִים ഏകവചനപരമായ ‘ദൈവം’ എന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: നിങ്ങളുടെ ആയുഷ്കാലമൊക്കെയും
  rationale: അക്ഷരാർഥമായ ‘എല്ലാ ദിവസങ്ങളും’ എന്നതിന്റെ ജീവിതകാലം മുഴുവനുമുള്ള നിലനിൽപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പേരായി നിലനിർത്തി.
- issue: ירא എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരത്തോടെ വണങ്ങുക / ഭയഭക്തിയോടെ ആദരിക്കുക
  rationale: മൂലത്തിലെ ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നീ ഘടകങ്ങളെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നേരിട്ടുള്ള പദം നിലനിർത്തി; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: הָאָרֶץ എന്നതിന്റെ വ്യാപ്തി
  choice: ഭൂമി
  alternative: ദേശം
  rationale: ദൈവപ്രവൃത്തിയുടെ പരസ്യവും വിശാലവുമായ സാക്ഷ്യത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ആഗോള അർഥം മുൻഗണിച്ചു; പ്രാദേശിക വായന സാധ്യമെന്നത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘യഹ്‌വേയുടെ കൈ’ എന്ന എബ്രായ രൂപകം നിലനിർത്തി. ആവർത്തിച്ചുള്ള לְמַעַן ഘടന ‘...വേണ്ടതിനും ...വേണ്ടതിനും’ എന്ന സമാന്തരരൂപത്തിൽ പുനരാവിഷ്കരിച്ചു.
