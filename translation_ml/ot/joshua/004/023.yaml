source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ, നിങ്ങൾ കടന്നുതീരുന്നതുവരെ യോർദാനിലെ വെള്ളം നിങ്ങളുടെ മുമ്പിൽ വറ്റിച്ചുകളഞ്ഞു; ഞങ്ങൾ കടന്നുതീരുന്നതുവരെ അവിടുന്ന് അതിനെ ഞങ്ങളുടെ മുമ്പിൽ വറ്റിച്ചുകളഞ്ഞ ഞാങ്ങണക്കടലിനോടു നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ചെയ്തതുപോലെതന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി “ചെങ്കടൽ” എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: വറ്റിച്ചുകളഞ്ഞു
  rationale: יבש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വെള്ളം വറ്റിപ്പോകാൻ ഇടയാക്കുക എന്ന കാരണാർഥം നൽകുന്നു. അത്ഭുതകരമായി കടന്നുപോകാൻ വഴിയൊരുക്കിയ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, Yahweh എന്ന അംഗീകൃത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹ്‌വെ എന്ന ഏകവചന ദൈവനാമത്തോടു ചേർന്നിരിക്കുന്നതിനാൽ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള വാക്യഘടനയിൽ ദൈവനാമത്തിനു മുമ്പ് സ്വാഭാവികമായി ചേരുന്ന രൂപമാണിത്.
- source_word: מֵי הַיַּרְדֵּן
  choice: യോർദാനിലെ വെള്ളം
  rationale: നദിയുടെ വെള്ളത്തെക്കുറിച്ചുള്ള എബ്രായ നിർമാണം വ്യക്തവും സ്വാഭാവികവുമായി പകർന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: മുഖം അഥവാ സാന്നിധ്യം എന്ന ആശയമുള്ള എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד עָבְרְכֶם
  choice: നിങ്ങൾ കടന്നുതീരുന്നതുവരെ
  rationale: കടക്കൽ പൂർത്തിയാകുന്നതുവരെയുള്ള കാലപരിധി വ്യക്തമാക്കുന്നു; עבר എന്ന ചലനക്രിയയുടെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: അതുപോലെതന്നെ ... ചെയ്തു
  rationale: യോർദാൻ സംഭവവും മുമ്പത്തെ കടൽ കടക്കലും തമ്മിലുള്ള വ്യക്തമായ താരതമ്യം നിലനിർത്തുന്നു.
- source_word: יַם סוּף
  choice: ഞാങ്ങണക്കടൽ
  rationale: סוּף എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ഞാങ്ങണയെ മുൻനിർത്തി മൂലഭാഷാസാക്ഷ്യം പിന്തുടരുന്നു. പരിചിതമായ പരമ്പരാഗത പേര് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: מִפָּנֵינוּ
  choice: ഞങ്ങളുടെ മുമ്പിൽ
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ സമാന്തര പ്രയോഗം അതേ രീതിയിൽ നിലനിർത്തുകയും സംസാരിക്കുന്നവൻ പുറപ്പാടുതലമുറയോടു സ്വയം ചേർത്തുപറയുന്നതു സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עַד עָבְרֵנוּ
  choice: ഞങ്ങൾ കടന്നുതീരുന്നതുവരെ
  rationale: ആദ്യഭാഗത്തിലെ സമാന്തര പ്രയോഗത്തിന്റെ ആവർത്തനവും കടക്കൽ പൂർത്തിയാകുന്നതുവരെയുള്ള ദൈർഘ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേരോ പരമ്പരാഗതമായ മറ്റൊരു ഉച്ചാരണമോ പകരംവയ്ക്കാതെ Yahweh എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: יַם סוּף എന്ന സ്ഥലനാമത്തിന്റെ പരിഭാഷ
  choice: ഞാങ്ങണക്കടൽ
  alternative: ചെങ്കടൽ
  rationale: സוּף എന്ന എബ്രായപദം നേരിട്ട് ‘ഞാങ്ങണ’യെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠം മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകുന്നു. വായനക്കാർക്ക് പരിചിതമായ ‘ചെങ്കടൽ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ രണ്ടു സമാന്തര സംഭവങ്ങളും ‘കടന്നുതീരുന്നതുവരെ’, ‘മുമ്പിൽ’, ‘വറ്റിച്ചുകളഞ്ഞു’ എന്നീ ആവർത്തിത പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. താരതമ്യവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ടാം ഭാഗം ദീർഘവിരാമത്തോടെ പുനഃക്രമീകരിച്ചു.
