id: JOS.4.22
reference: Joshua 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹדַעְתֶּ֖ם אֶת בְּנֵי/כֶ֣ם לֵ/אמֹ֑ר בַּ/יַּבָּשָׁה֙ עָבַ֣ר יִשְׂרָאֵ֔ל אֶת הַ/יַּרְדֵּ֖ן הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ നിങ്ങളുടെ മക്കളെ[a] ഇങ്ങനെ അറിയിക്കണം: ‘ഇസ്രായേൽ ഉണങ്ങിയ നിലത്തിലൂടെ ഈ യോർദാൻ കടന്നു.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളുടെ പുത്രന്മാരെ’; എബ്രായപദം പ്രത്യേകമായി ആൺമക്കളെയോ കൂടുതൽ പൊതുവായി മക്കളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: അപ്പോൾ നിങ്ങൾ ... അറിയിക്കണം
  rationale: ידע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക, അറിയാൻ ഇടയാക്കുക’ എന്ന കാരണാർഥം നൽകുന്നു. സന്ദർഭത്തിലെ നിർദേശക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ וְ എന്ന സംയോജകം ‘അപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּנֵיכֶם
  choice: നിങ്ങളുടെ മക്കളെ
  rationale: בנים എന്ന പദത്തിന് പ്രത്യേകമായി ആൺമക്കളെയോ പൊതുവായി മക്കളെയോ സൂചിപ്പിക്കാം. ഇവിടെ സ്മാരകത്തിന്റെ അർഥം അടുത്ത തലമുറയെ പഠിപ്പിക്കുന്നതാണ്; അതിനാൽ വിശാലാർഥമുള്ള ‘മക്കൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, ഇടുങ്ങിയ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് വരുന്ന ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന לאמר എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּיַּבָּשָׁה
  choice: ഉണങ്ങിയ നിലത്തിലൂടെ
  rationale: יַבָּשָׁה വെള്ളമില്ലാത്ത ഉണങ്ങിയ കരയെയോ നിലത്തെയോ സൂചിപ്പിക്കുന്നു. നദി കടന്നുപോയ സഞ്ചാരപാത മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഉണങ്ങിയ നിലത്തിലൂടെ’ എന്നു നൽകി.
- source_word: עָבַר
  choice: കടന്നു
  rationale: עבר എന്ന ധാതു ഇവിടെ നേരിട്ടുള്ള കർമമായ യോർദാനോടൊപ്പം ‘കടക്കുക’ എന്ന അർഥത്തിലാണ്.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനതയെ സൂചിപ്പിക്കുന്ന പേരിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: ഈ യോർദാൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ നാമവും സൂചകസർവനാമവും ചേർന്ന എബ്രായപ്രയോഗത്തിലെ സമീപതയും ഊന്നലും ‘ഈ യോർദാൻ’ എന്നതിൽ നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ പ്രത്യേകം ‘നദി’ എന്ന പദമില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഉദ്ധരണിയുടെ നേരിട്ടുള്ള സ്വഭാവവും ‘ഈ യോർദാൻ’ എന്ന സൂചകപ്രയോഗവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി.
