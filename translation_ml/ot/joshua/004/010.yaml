  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: ml
  text: പെട്ടകം ചുമന്ന പുരോഹിതന്മാർ, യാഹ്‌വെ യോശുവയോടു ജനത്തോടു പറയാൻ കല്പിച്ചതും മോശ യോശുവയോടു കല്പിച്ചതിന് അനുസൃതവുമായ സകല കാര്യങ്ങളും പൂർത്തിയാകുന്നതുവരെ[a] യോർദാൻ നദിയുടെ നടുവിൽ നിന്നുകൊണ്ടിരുന്നു. ജനം തിടുക്കത്തിൽ കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിന്റെ അക്ഷരാർഥം: ‘മുഴുവൻ കാര്യവും പൂർത്തിയാകുന്നതുവരെ.’ യാഹ്‌വെ യോശുവയോടു ജനത്തോടു പറയാൻ കല്പിച്ച എല്ലാ കാര്യങ്ങളുടെയും പൂർത്തീകരണത്തെ ഈ പ്രയോഗം സംഗ്രഹിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: പെട്ടകം ചുമന്ന പുരോഹിതന്മാർ
  rationale: എബ്രായ പങ്കാളിത്തരൂപം പുരോഹിതന്മാരുടെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ചുമന്ന’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: യോർദാന്റെ നടുവിൽ നിന്നു
  rationale: തുടർച്ചയായ നില്പിനെയും നദിയുടെ മധ്യത്തിലുള്ള സ്ഥാനത്തെയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: എല്ലാം പൂർത്തിയാകുന്നതുവരെ
  rationale: ദָּבָר എന്ന പദത്തിന്റെ ‘വാക്ക്/കാര്യം’ എന്ന വിശാല അർഥം ഇവിടെ കല്പിക്കപ്പെട്ട മുഴുവൻ കാര്യങ്ങളുടെയും പൂർത്തീകരണത്തെ സംഗ്രഹിക്കുന്നു.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: ജനത്തോടു പറയാൻ
  rationale: ദൈവം യോശുവയോട് ജനത്തെ അഭിസംബോധന ചെയ്യാൻ കല്പിച്ച വാചികപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: മോശ യോശുവയോടു കല്പിച്ചതനുസരിച്ചായിരുന്നു ഇതെല്ലാം
  rationale: כְּכֹל സൂചിപ്പിക്കുന്ന പൂർണമായ അനുസൃതത സംരക്ഷിക്കുകയും മലയാളത്തിലെ ദീർഘവാക്യം വ്യക്തമായി വിഭജിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: ജനം വേഗത്തിൽ മറുകര കടന്നു
  rationale: ജനത്തിന്റെ തിടുക്കവും നദി കടന്നുള്ള ദിശാബോധവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ രൂപമാണ് ‘യഹോവ’.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി.
