source:
  edition: WLC
  text: וַ֠/יַּעַבְרוּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֨י שֵׁ֤בֶט הַֽ/מְנַשֶּׁה֙ חֲמֻשִׁ֔ים לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: ml
  text: മോശെ അവരോടു പറഞ്ഞിരുന്നതുപോലെ, രൂബേന്റെ പുത്രന്മാരും[a] ഗാദിന്റെ പുത്രന്മാരും മനശ്ശെയുടെ പാതിഗോത്രവും ആയുധസജ്ജരായി[b] ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ[c] കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രൂബേൻഗോത്രക്കാരും ഗാദ്യരും മനശ്ശെയുടെ പാതിഗോത്രവും.’ എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘രൂബേന്റെ പുത്രന്മാർ … ഗാദിന്റെ പുത്രന്മാർ … മനശ്ശെയുടെ പാതിഗോത്രം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ആയുധസജ്ജരായി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് യുദ്ധത്തിനായി സജ്ജീകരിക്കപ്പെട്ടവർ എന്നോ സൈനികനിരയായി ക്രമീകരിക്കപ്പെട്ടവർ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ മുമ്പിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ മുമ്പിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: കടന്നുപോയി
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ עבר യോർദ്ദാൻ കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. വാക്യത്തിൽ നദിയുടെ പേര് ചേർക്കാതെ തന്നെ ‘കടന്നുപോയി’ എന്നത് മൂലപാഠത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי רְאוּבֵן / וּבְנֵי גָד
  choice: രൂബേന്റെ പുത്രന്മാർ / ഗാദിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ‘രൂബേൻഗോത്രക്കാർ’, ‘ഗാദ്യർ’ എന്നീ കൂടുതൽ വ്യവഹാരപരമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: മൂലത്തിലെ construct chain കൃത്യവും മലയാളത്തിൽ വ്യക്തവുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חֲמֻשִׁים
  choice: ആയുധസജ്ജരായി
  rationale: സന്ദർഭത്തിൽ യുദ്ധത്തിനായി സജ്ജരായ നിലയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘ആയുധസജ്ജരായി’ എന്നത് അതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; സൈനികനിരയായി ക്രമീകരിക്കപ്പെട്ടവർ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: മറ്റു ഇസ്രായേൽമക്കൾക്കു മുന്നിലായുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന ലളിതവും ഉറവിടത്തോട് അടുത്തതുമായ പ്രയോഗം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ ബന്ധുത്വപ്രയോഗത്തിന്റെ മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യരൂപം; ‘ഇസ്രായേല്യർ’ എന്ന വ്യവഹാരപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: മോശെ അവരോടു പറഞ്ഞിരുന്നതുപോലെ
  rationale: കടന്നുപോകലിനു മുമ്പ് മോശെ നൽകിയ നിർദേശം ആയതിനാൽ ‘പറഞ്ഞിരുന്നതുപോലെ’ മുൻകാലബന്ധവും അതിനോടുള്ള അനുരൂപതയും വ്യക്തമാക്കുന്നു; ‘കല്പിച്ചതുപോലെ’ എന്നു പരിഭാഷപ്പെടുത്തി കല്പനാഭാവം അധികമായി നിർണ്ണയിക്കുന്നില്ല.
