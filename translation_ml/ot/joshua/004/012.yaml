translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായ ബന്ധുത്വപ്രയോഗങ്ങൾ കഴിയുന്നത്ര ദൃശ്യമായി നിലനിർത്തിയെങ്കിലും, മലയാളത്തിൽ സ്ഥാപിതമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപം സ്വീകരിച്ചു. മൂലവാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്താൻ മോശെയെക്കുറിച്ചുള്ള ഉപവാക്യം ആദ്യം വെച്ചു.
