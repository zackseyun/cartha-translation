  text: And Yahweh said to Joshua,[a]
translation:
  language: ml
  text: യഹ്‌വെ യോശുവയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘പറഞ്ഞ്’ അഥവാ ‘പറയാൻ’; ഇത് അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ אמר ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ദൈവത്തിന്റെ പ്രസ്താവനയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു; വാക്യക്രമത്തിൽനിന്ന് തുടർച്ച വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർത്തില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും മൂലരൂപത്തോട് ചേർന്നതുമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: യോശുവയോട്
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘-യോട്’ ഉപയോഗിച്ചു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാള ബൈബിൾരൂപം സ്വീകരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഈ രൂപം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; പദശഃ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ പേര് മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവത്തിന്റെ സംസാരത്തിന് ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും വാക്യം അനാവശ്യമായി പുരാതനശൈലിയിലാക്കിയിട്ടില്ല.
