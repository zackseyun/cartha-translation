id: JOS.4.19
reference: Joshua 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/עָ֗ם עָלוּ֙ מִן הַ/יַּרְדֵּ֔ן בֶּ/עָשׂ֖וֹר לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַֽ/יַּחֲנוּ֙ בַּ/גִּלְגָּ֔ל בִּ/קְצֵ֖ה מִזְרַ֥ח יְרִיחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: ml
  text: ഒന്നാം മാസം പത്താം ദിവസം ജനം യോർദ്ദാനിൽനിന്ന് കയറിവന്നു[a]. അവർ യെരീഹോയുടെ കിഴക്കേ അതിർത്തിയിലുള്ള ഗിൽഗാലിൽ പാളയമിറങ്ങി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കയറിപ്പോയി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യെരീഹോയ്ക്ക് കിഴക്കുള്ള ഗിൽഗാലിൽ പാളയമിറങ്ങി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: കയറിവന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ഉയർന്നുവരുക/കയറിവരുക എന്ന ദിശാബോധം നിലനിർത്തുന്നു; യോർദ്ദാനിൽനിന്നുള്ള പുറപ്പെടലിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം.
- source_word: מִן הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽനിന്ന്
  rationale: നദിയിൽനിന്നുള്ള പുറപ്പെടൽ സംക്ഷിപ്തമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ യോർദ്ദാൻ നദിയാണെന്ന് വ്യക്തമാണ്.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ഒന്നാം മാസം പത്താം ദിവസം
  rationale: എബ്രായ കലണ്ടർ-തീയതി പ്രയോഗം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ പാളയമടിക്കുക/തമ്പടിക്കുക എന്ന അർഥം dignified, സാധാരണ ബൈബിൾ-മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത്, അവിടെ പാളയമിറങ്ങിയെന്ന സ്ഥാനബന്ധം മലയാളത്തിലെ -യിൽ വിഭക്തിയാൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: യെരീഹോയുടെ കിഴക്കേ അതിർത്തിയിലുള്ള
  rationale: קצה എന്നതിന്റെ അരിക്/അതിർത്തി എന്ന ഭൗമസൂചനയും מזרח എന്നതിന്റെ കിഴക്കൻ ദിശയും ചേർത്ത് ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ഘടനയ്ക്ക് 'യെരീഹോയ്ക്ക് കിഴക്ക്' എന്ന മറ്റൊരു സാധ്യതയുണ്ട്.
