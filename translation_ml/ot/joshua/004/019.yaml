translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. സ്ഥലനാമങ്ങൾക്ക് പരിചിതമായ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ദിശാസംബന്ധമായ ചെറിയ അവ്യക്തത പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
