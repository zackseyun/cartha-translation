  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: ml
  text: 'ജനത മുഴുവനും[a] യോർദാൻ കടന്നുതീർന്നപ്പോൾ, യഹ്‌വെ യോശുവയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനം മുഴുവനും’; എബ്രായപദം ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടായ നാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇത് ആഖ്യാനത്തിന്റെ അടുത്ത സംഭവഘട്ടം അവതരിപ്പിക്കുന്ന ഘടനയാണ്. മലയാളത്തിൽ കാലവാക്യവും മുഖ്യവാക്യവും ചേർന്ന സ്വാഭാവിക വാക്യക്രമം അതിന്റെ പ്രഭാഷണധർമ്മം വ്യക്തമാക്കുന്നതിനാൽ ‘സംഭവിച്ചു’ എന്നു പ്രത്യേകം ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: כַּאֲשֶׁר
  choice: …പ്പോൾ
  rationale: മുഖ്യസംഭവത്തിനു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള കാലബന്ധകപ്രത്യയം.
- source_word: תַּמּוּ ... לַעֲבוֹר
  choice: കടന്നുതീർന്നപ്പോൾ
  rationale: תמם സൂചിപ്പിക്കുന്ന പൂർത്തീകരണവും עבר എന്ന കടക്കൽക്രിയയും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָל הַגּוֹי
  choice: ജനത മുഴുവനും
  rationale: ഗּוֹי ഇവിടെ ഇസ്രായേലിനെ ഏകവചനത്തിലുള്ള ഒരു സമൂഹഘടകമായി സൂചിപ്പിക്കുന്നു; ‘ജനത മുഴുവനും’ ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദാൻ
  rationale: നദിയുടെ എബ്രായ നാമത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായ ഭൂമിശാസ്ത്രനാമം; സന്ദർഭത്തിൽ ‘നദി’ ചേർക്കേണ്ടതില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 'യോശുവയോടു പറഞ്ഞു:'
  rationale: എബ്രായ സംസാരസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുവരുന്ന വാക്കുകളെ ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവനാമം ശബ്ദാന്തരം ചെയ്തു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന വസ്തുത മറച്ചുവെക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി. വാക്യം അടുത്ത വാക്യത്തിലെ ദൈവവചനത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
