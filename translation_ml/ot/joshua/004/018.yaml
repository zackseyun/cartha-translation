source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം വഹിച്ച പുരോഹിതന്മാർ യോർദാന്റെ നടുവിൽനിന്നു കയറിവന്ന്, അവരുടെ പാദത്തളങ്ങൾ ഉണങ്ങിയ നിലത്തേക്കു ഉയർന്നപ്പോൾ, യോർദാനിലെ വെള്ളം അതിന്റെ സ്ഥാനത്തേക്കു മടങ്ങി, മുമ്പത്തെപ്പോലെ[a] അതിന്റെ തീരങ്ങളിലെല്ലാം കവിഞ്ഞൊഴുകി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ”; അതായത്, “മുമ്പത്തെപ്പോലെ” അഥവാ “പഴയതുപോലെ.”'
    reason: ഹീബ്രു ഇടിയത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי
  choice: അങ്ങനെ സംഭവിച്ചു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ പുതിയ സംഭവക്രമം അവതരിപ്പിക്കുന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בעלות
  choice: കയറിവന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു വരുക/കയറിവരുക’ എന്ന ചലനാർഥം, നദീതടത്തിൽനിന്നു കരയിലേക്കുള്ള നീക്കത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം വഹിച്ച
  rationale: നാമശൃംഖലയുടെ ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുകയും נשׂא എന്നതിനു സ്വാഭാവികമായ ‘വഹിക്കുക’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: യോർദാന്റെ നടുവിൽനിന്നു
  rationale: תוך സൂചിപ്പിക്കുന്ന നദിയുടെ അകത്തളമോ മധ്യഭാഗമോ വ്യക്തമാക്കുന്നു.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: അവരുടെ ഉള്ളങ്കാലുകൾ ഉണങ്ങിയ നിലത്തു പതിഞ്ഞപ്പോൾ
  rationale: കാലടികൾ നദീതടത്തിൽനിന്നു വേർപെട്ട് ഉണങ്ങിയ നിലത്തെത്തിയ ചലനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; כַּפּוֹת רַגְלֵי എന്ന ‘കാലുകളുടെ ഉള്ളങ്കാൽ’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: യോർദാനിലെ വെള്ളം അതിന്റെ സ്ഥാനത്തേക്കു മടങ്ങി
  rationale: വെള്ളം പഴയ സ്ഥാനത്തേക്കു തിരിച്ചെത്തുന്നതായി മൂലപാഠത്തിലെ ചലനചിത്രം നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: മുമ്പത്തെപ്പോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇന്നലെയും അതിനു മുമ്പും എന്നപോലെ’ എന്ന ഹീബ്രു പ്രയോഗം ‘പണ്ടത്തെ/മുൻകാലത്തെ നിലപോലെ’ എന്നർഥമുള്ള ഇടിയമാണ്.
- source_word: עַל כָּל גְּדוֹתָיו
  choice: അതിന്റെ തീരങ്ങളിലെല്ലാം കവിഞ്ഞൊഴുകി
  rationale: വെള്ളം നദിയുടെ തീരങ്ങൾക്കുമീതെ ഒഴുകിയെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ നേരിട്ട് വരുന്ന വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ശബ്ദാനുസൃതമായി നിലനിർത്തുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ മൂലനാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉടമ്പടിപ്പെട്ടകം’, ‘വഹിച്ചു’, ‘കവിഞ്ഞൊഴുകി’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ വാക്യത്തിന്റെ തിരുവെഴുത്തുസ്വഭാവവും നിലനിർത്തുന്നു.
