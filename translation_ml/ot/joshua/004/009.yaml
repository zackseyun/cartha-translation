theological_decisions:
- issue: സമീപസന്ദർഭത്തിൽ ഗിൽഗാലിൽ സ്ഥാപിച്ച പന്ത്രണ്ട് കല്ലുകളുമായുള്ള ആഖ്യാനപരമായ പിരിമുറുക്ക്
  choice: യോശുവ യോർദ്ദാന്റെ നടുവിൽത്തന്നെ പന്ത്രണ്ട് കല്ലുകൾ സ്ഥാപിച്ചതായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: യോർദ്ദാനിൽനിന്ന് എടുത്ത് മറ്റൊരിടത്ത് സ്ഥാപിച്ച കല്ലുകളുടെ സംഗ്രഹവിവരണമായി വ്യാഖ്യാനിക്കുകയോ രണ്ടു സ്മാരകങ്ങളെ ഒന്നാക്കി സമന്വയിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: ഹീബ്രു പാഠം കല്ലുകൾ ‘യോർദ്ദാന്റെ നടുവിൽ’ സ്ഥാപിച്ചതായി വ്യക്തമായി പറയുന്നു. സന്ദർഭവുമായി സമന്വയിപ്പിക്കാൻ ഈ അവകാശവാദം മാറ്റുന്നത് പരിഭാഷയുടെ പരിധി കവിയും.
- issue: עַד הַיּוֹם הַזֶּה എന്ന സ്മാരകസൂത്രത്തിന്റെ കാലസൂചന
  choice: ‘അവ ഇന്നുവരെയും അവിടെയുണ്ട്’ എന്ന് കഥാകൃത്തിന്റെ കാലത്തേക്കുള്ള തുടർച്ചയായി നൽകി.
  alternative: ‘അവ ഇന്നുവരെ അവിടെയുണ്ടായിരുന്നു’ എന്ന് ഭൂതകാലത്തിൽ നൽകുക.
  rationale: കഥാകൃത്തിന്റെ കാഴ്ചപ്പാടിൽ തുടരുന്ന അവസ്ഥ സംരക്ഷിക്കുന്നു; ഇന്നത്തെ വായനക്കാരന്റെ കാലത്തും കല്ലുകൾ അവിടെയുണ്ടെന്ന അവകാശവാദം ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യോർദ്ദാന്റെ നടുവിൽ’ എന്നത് മൂലപാഠത്തിലെ സ്ഥലസൂചനയും ആഖ്യാനപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു. മുഖ്യവാക്യത്തിലെ ആവർത്തനഭാരം കുറയ്ക്കാൻ രണ്ടാമത്തെ ഉപവാക്യം സ്വതന്ത്രവാക്യമാക്കി; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
