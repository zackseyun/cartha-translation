  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: ml
  text: യോശുവ യോർദ്ദാന്റെ നടുവിൽ, ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ചുകൊണ്ടിരുന്ന പുരോഹിതന്മാരുടെ കാലുകൾ നിന്നിരുന്ന സ്ഥലത്തിനു കീഴെ[a] പന്ത്രണ്ട് കല്ലുകൾ സ്ഥാപിച്ചു. അവ ഇന്നുവരെയും അവിടെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ചുകൊണ്ടിരുന്ന പുരോഹിതന്മാരുടെ കാലുകളുടെ നിൽപ്പിടത്തിനു കീഴിൽ.’ പുരോഹിതന്മാർ പെട്ടകം വഹിച്ചുകൊണ്ട് നിന്നിരുന്ന സ്ഥാനത്തെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: സ്ഥാപിച്ചു
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ കല്ലുകൾ നാട്ടി നിർത്തുക/സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്. ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും സ്മാരകക്കല്ലുകളുടെ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ നടുവിൽ
  rationale: תּוֹךְ എന്ന പദത്തിന്റെ മധ്യം/ഉൾഭാഗം എന്ന സ്ഥലസൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു; കല്ലുകൾ യോർദ്ദാനിൽ തന്നെയാണെന്ന പാഠത്തിലെ അവകാശവാദം മങ്ങിക്കുന്നില്ല.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: കാലുകൾ നിന്നിരുന്ന സ്ഥലത്ത്
  rationale: מַצָּב ഇവിടെ നിൽപ്പിടത്തെയോ നിലയത്തെയോ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ അത്യന്തം അക്ഷരാർഥമായ ഘടന മലയാളത്തിൽ ദുർഗ്രഹമാകാതിരിക്കാൻ സ്ഥലസൂചന സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം ചുമന്ന
  rationale: נֹשְׂאֵי എന്ന കർത്തൃവാചക കൃദന്തത്തിന്റെ വഹിക്കുക/ചുമക്കുക എന്ന അർഥം ‘ചുമന്ന’ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּהְיוּ שָׁם
  choice: അവ അവിടെയുണ്ട്
  rationale: עַד הַיּוֹם הַזֶּה എന്ന തുടർപ്രയോഗത്തോടൊപ്പം, കഥാകൃത്തിന്റെ കാലംവരെ നിലനിന്ന അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
