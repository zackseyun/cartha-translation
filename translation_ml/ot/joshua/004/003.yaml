  to: 'അവരോടു ഇങ്ങനെ കൽപ്പിക്കുക: ‘ഇവിടെനിന്ന്, യോർദ്ദാന്റെ നടുവിൽനിന്ന്, പുരോഹിതന്മാരുടെ പാദങ്ങൾ ഉറച്ചുനിന്ന സ്ഥാനത്തുനിന്ന്[a] നിങ്ങൾക്കായി പന്ത്രണ്ടു കല്ലുകൾ എടുത്തുകൊൾവിൻ. അവ നിങ്ങളോടുകൂടെ കടത്തിക്കൊണ്ടുപോയി, ഇന്നു രാത്രി നിങ്ങൾ താമസിക്കാനിരിക്കുന്ന രാത്രിതാമസസ്ഥലത്ത്[b] വെക്കുവിൻ.’'
