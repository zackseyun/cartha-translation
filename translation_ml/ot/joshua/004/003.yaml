source:
  edition: WLC
  text: וְ/צַוּ֣וּ אוֹתָ/ם֮ לֵ/אמֹר֒ שְׂאֽוּ לָ/כֶ֨ם מִ/זֶּ֜ה מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן מִ/מַּצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים הָכִ֖ין שְׁתֵּים עֶשְׂרֵ֣ה אֲבָנִ֑ים וְ/הַעֲבַרְתֶּ֤ם אוֹתָ/ם֙ עִמָּ/כֶ֔ם וְ/הִנַּחְתֶּ֣ם אוֹתָ֔/ם בַּ/מָּל֕וֹן אֲשֶׁר תָּלִ֥ינוּ ב֖/וֹ הַ/לָּֽיְלָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: ml
  text: 'അവരോടു ഇങ്ങനെ കൽപ്പിക്കുക: ‘ഇവിടെനിന്ന്, യോർദ്ദാന്റെ നടുവിൽനിന്ന്, പുരോഹിതന്മാരുടെ പാദങ്ങൾ ഉറച്ചുനിന്ന സ്ഥാനത്തുനിന്ന്[a] നിങ്ങൾക്കായി പന്ത്രണ്ടു കല്ലുകൾ എടുത്തുകൊൾവിൻ. അവ നിങ്ങളോടുകൂടെ കടത്തിക്കൊണ്ടുപോയി, ഇന്നു രാത്രി നിങ്ങൾ താമസിക്കാനിരിക്കുന്ന രാത്രിതാമസസ്ഥലത്ത്[b] വെക്കുവിൻ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘പുരോഹിതന്മാരുടെ പാദങ്ങളുടെ ഉറപ്പായ നിൽപ്പിടത്തുനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘രാത്രിതാമസസ്ഥലം’ എന്നത് യോർദ്ദാൻ കടന്നശേഷം ഇസ്രായേൽജനം രാത്രി തങ്ങുന്ന ഇടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അത് സ്ഥിരമായ ഒരു പാർപ്പിടമാകണമെന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: അവരോടു ... കല്പിക്കുക
  rationale: צוה എന്ന ക്രിയയുടെ പീയേൽ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘അറിയിക്കുക’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള കല്പനയാണിത്.
- source_word: שְׂאוּ לָכֶם
  choice: നിങ്ങൾക്കായി എടുത്തുകൊൾവിൻ
  rationale: കല്ലുകൾ നദീതടത്തിൽനിന്ന് ഉയർത്തിയെടുക്കുന്ന പ്രവൃത്തിയും לָכֶם സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പങ്കാളിത്തവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സ്വകാര്യ ഉടമസ്ഥത അർഥമാക്കുന്നില്ല.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: ഇവിടെ, യോർദ്ദാന്റെ നടുവിൽ
  rationale: ‘ഇവിടെ’ എന്നും ‘യോർദ്ദാന്റെ നടുവിൽ’ എന്നും വരുന്ന ഇരട്ട സ്ഥലനിർദേശം നിലനിർത്തി കല്ലുകൾ എടുക്കേണ്ട കൃത്യസ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: പുരോഹിതന്മാരുടെ കാലുകൾ ഉറച്ചുനിന്ന സ്ഥലത്തുനിന്ന്
  rationale: מַצָּב എന്നതിലെ നിൽക്കുന്ന സ്ഥലം/നിലയവും הָכִין നൽകുന്ന ഉറപ്പിന്റെ ഭാവവും സ്വാഭാവികമായി ചേർത്തു പറയുന്നു; ഹീബ്രു ഘടനയുടെ കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: പന്ത്രണ്ടു കല്ലുകൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട്, വിപുലീകരണമില്ലാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: അവ നിങ്ങളോടൊപ്പം മറുകരയിലേക്കു കൊണ്ടുപോയി
  rationale: עבר എന്ന ക്രിയയുടെ കടത്തിക്കൊണ്ടുപോകൽ/കടക്കൽ ഭാവവും עִמָּכֶם എന്ന സഹഗമനവും വ്യക്തമാക്കുന്നു.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: വെക്കുവിൻ
  rationale: נוח എന്ന ഹിഫീൽ രൂപം ഇവിടെ കല്ലുകൾ ഒരു സ്ഥലത്ത് ഇറക്കിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലളിതവും ദൃശ്യവുമായ മലയാളപ്രയോഗം.
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: നിങ്ങൾ ഇന്നു രാത്രി താമസിക്കുന്ന സ്ഥലത്ത്
  rationale: מָלוֹן എന്നത് രാത്രിതാമസസ്ഥലമാണെന്ന അർഥവും സന്ദർഭത്തിലെ ഭാവികാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥിരവാസസ്ഥലമെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ബഹുവചന ആജ്ഞയ്ക്ക് ‘എടുത്തുകൊൾവിൻ’, ‘വെക്കുവിൻ’ എന്നീ രൂപങ്ങൾ സ്വീകരിച്ചു. യോർദ്ദാൻ കടക്കുന്നതിന്റെ ദിശാസൂചന വ്യക്തമാക്കാൻ ‘മറുകരയിലേക്കു’ എന്നു ഉപയോഗിച്ചെങ്കിലും, മൂലത്തിലെ പ്രവർത്തനക്രമം—എടുക്കുക, കൂടെ കടത്തുക, താമസസ്ഥലത്ത് വെക്കുക—അക്ഷുണ്ണമായി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ വിശദീകരിക്കുന്ന പദങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, അവയെ യഥാക്രമം ‘ഉറച്ചുനിന്ന’ ഘടകത്തിനും ‘താമസിക്കുന്ന സ്ഥലം’ ഘടകത്തിനും ചേർത്തു.
