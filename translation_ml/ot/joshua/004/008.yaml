source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] യോശുവ കൽപ്പിച്ചതുപോലെ ചെയ്തു. യാഹ്‌വേ യോശുവയോടു പറഞ്ഞതുപോലെ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളുടെ എണ്ണമനുസരിച്ച് അവർ യോർദ്ദാന്റെ നടുവിൽനിന്ന്[b] പന്ത്രണ്ട് കല്ലുകൾ എടുത്തു; അവ തങ്ങളോടൊപ്പം രാത്രിത്താവളസ്ഥലത്തേക്ക്[c] കടത്തിക്കൊണ്ടുപോയി അവിടെ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ”; എബ്രായിയിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യോർദ്ദാന്റെ മധ്യത്തിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “പാളയത്തിലേക്ക്”; എബ്രായിപദം കൂടുതൽ കൃത്യമായി രാത്രി തങ്ങുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായിയിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും സുപരിചിതവുമായ രൂപം.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അങ്ങനെ ചെയ്തു
  rationale: നിർദേശം അനുസരിച്ചുള്ള പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: ക്രിയയുടെ അധികാരപൂർവമായ നിർദേശാർഥം സംരക്ഷിക്കുന്നു.
- source_word: וַיִּשְׂאוּ
  choice: എടുത്തു
  rationale: കല്ലുകൾ ഉയർത്തി കൊണ്ടുപോകുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം; തുടർന്നുള്ള ‘കൊണ്ടുപോയി’ എന്ന ക്രിയ ഗതിയെ വ്യക്തമാക്കുന്നു.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ നടുവിൽനിന്ന്
  rationale: תּוֹךְ എന്നതിന്റെ സ്ഥലസൂചകമായ ‘ഉള്ളിൽ/നടുവിൽ’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ നദിയുടെ മധ്യഭാഗത്തെ നദീതടമാണ് സന്ദർഭം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളുടെ എണ്ണമനുസരിച്ച്
  rationale: പന്ത്രണ്ടു കല്ലുകളും ഗോത്രങ്ങളുടെ എണ്ണവും തമ്മിലുള്ള പൊരുത്തം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: അവ തങ്ങളോടൊപ്പം ... കൊണ്ടുപോയി
  rationale: കല്ലുകളെ കടത്തിക്കൊണ്ടുപോയതും അവരോടൊപ്പമുണ്ടായിരുന്നതും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמָּלוֹן
  choice: താവളസ്ഥലം
  rationale: യാത്രയ്ക്കിടയിൽ രാത്രി തങ്ങുന്ന ഇടം എന്ന പ്രത്യേക അർഥം സംരക്ഷിക്കുന്നു; ‘പാളയം’ എന്ന പൊതുവായ പരിഭാഷയേക്കാൾ ഉറവിടത്തോട് അടുത്തത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ‘കർത്താവ്’ എന്ന പദവിയല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ നാമരൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായിയിലെ കുടുംബബന്ധപ്രയോഗവും ദൈവനാമവും സ്ഥലസൂചകമായ പദങ്ങളുടെ കൃത്യതയും നിലനിർത്തിക്കൊണ്ട്, വാക്യഘടന മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
