translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ നേരിട്ടുള്ള ‘എടുക്കുക’ നിലനിർത്തി; വിതരണാർഥം മലയാളത്തിലെ ‘ഓരോ ... വീതം’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
