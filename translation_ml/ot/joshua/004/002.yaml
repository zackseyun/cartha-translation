source:
  edition: WLC
  text: קְח֤וּ לָ/כֶם֙ מִן הָ/עָ֔ם שְׁנֵ֥ים עָשָׂ֖ר אֲנָשִׁ֑ים אִישׁ אֶחָ֥ד אִישׁ אֶחָ֖ד מִ/שָּֽׁבֶט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/002.yaml
  text: Take for yourselves from the people twelve men[a], one man from each tribe.
translation:
  language: ml
  text: “ജനത്തിൽനിന്ന് പന്ത്രണ്ടു പുരുഷന്മാരെ നിങ്ങൾക്കായി എടുക്കുക—ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോ പുരുഷനെ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ വിതരണാർഥമുള്ള പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷൻ, ഒരു പുരുഷൻ, ഒരു ഗോത്രത്തിൽനിന്ന്’ എന്ന് ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ഖാൽ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണ്. സന്ദർഭത്തിൽ ആളുകളെ നിയോഗിക്കുന്ന ആശയം ഉൾപ്പെടാമെങ്കിലും, അതിനെ വ്യാഖ്യാനമായി പാഠത്തിൽ ചേർക്കാതെ നേരിട്ടുള്ള ക്രിയാബലം നിലനിർത്തുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കായി
  rationale: ל എന്ന ഉപസർഗവും രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയവും ചേർന്ന് നൽകുന്ന ഗുണഭോക്തൃ/പ്രത്യാവർത്തക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘നിങ്ങൾക്കായി’ എന്നു നൽകുന്നു.
- source_word: מִן הָעָם
  choice: ജനത്തിൽനിന്ന്
  rationale: עם ഇവിടെ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനത്തിൽനിന്ന്’ എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: പന്ത്രണ്ടുപേരെ
  rationale: അർഥം പന്ത്രണ്ട് പ്രായപൂർത്തിയായ പുരുഷന്മാർ എന്നാണ്. എന്നാൽ മലയാളത്തിലെ സ്വാഭാവിക എണ്ണൽരീതിയിൽ ‘പന്ത്രണ്ടുപേരെ’ എന്നു പറഞ്ഞശേഷം വിതരണവാക്യത്തിൽ ‘പുരുഷനെ’ എന്നു വ്യക്തമാക്കുന്നത് ലിംഗസൂചനയും വായനാസൗകര്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ഓരോ പുരുഷനെ വീതം
  rationale: ‘ഒരു പുരുഷൻ, ഒരു പുരുഷൻ’ എന്ന ആവർത്തനം വിതരണാർഥം നൽകുന്നു. മലയാളത്തിലെ ‘ഓരോ ... വീതം’ അതേ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ ആവർത്തനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: מִשָּׁבֶט
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും
  rationale: שבט ഇവിടെ ഇസ്രായേലിലെ ഓരോ ഗോത്രത്തെയും സൂചിപ്പിക്കുന്നു. വിതരണാർഥമുള്ള മുൻവാക്യഘടനയോടു ചേർന്ന് ‘ഓരോ ഗോത്രത്തിൽനിന്നും’ കൃത്യവും സ്വാഭാവികവുമാണ്.
