  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: ml
  text: യുദ്ധസജ്ജരായ ഏകദേശം നാല്പതിനായിരംപേർ യാഹ്‌വെയുടെ സന്നിധിയിൽ യുദ്ധത്തിനായി യെരീഹോയുടെ സമതലങ്ങളിലേക്കു കടന്നുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: ഏകദേശം നാല്പതിനായിരംപേർ
  rationale: സംഖ്യയ്ക്കു മുമ്പിലുള്ള כְּ ഏകദേശ കണക്കിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: യുദ്ധസജ്ജരായ
  rationale: ആയുധമണിഞ്ഞ് സൈനികനടപടിക്കു സജ്ജരായവരെ സൂചിപ്പിക്കുന്നു; ‘മുൻനിരപ്പട’ എന്ന് സന്ദർഭത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർത്തിട്ടില്ല.
- source_word: עָבְרוּ
  choice: കടന്നുപോയി
  rationale: യോർദാൻ കടക്കുന്നതിനെക്കുറിച്ചുള്ള തുടർച്ചയായ വിവരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യാഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥലപരവും ദൈവസാന്നിധ്യപരവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: ലക്ഷ്യത്തെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്ന לְ നിലനിർത്തുന്നു.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: യെരീഹോയുടെ സമതലങ്ങളിലേക്ക്
  rationale: עַרְבוֹת എന്നത് യോർദാൻ താഴ്‌വരയിലെ സമതലപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായ ‘സ്റ്റെപ്പ്’ എന്നതിനെക്കാൾ ഇത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിപരമായ ഉടമ്പടിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ശീർഷകമാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു.
- issue: לִפְנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യാഹ്‌വെയുടെ സന്നിധിയിൽ
  alternative: യാഹ്‌വെയുടെ മുമ്പിലൂടെ
  rationale: പ്രയോഗം ദൈവസാന്നിധ്യത്തെയോ ദൈവത്തിന്റെ മുമ്പിലുള്ള നീക്കത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘സന്നിധിയിൽ’ ഈ അർഥവ്യാപ്തി നിലനിർത്തുകയും യാഹ്‌വെ സൈനികരുടെ ഭൗതിക മുന്നിൽ നടന്നു എന്ന അനാവശ്യ നിർണ്ണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലപാഠത്തിന്റെ പദക്രമം കൃത്യമായി അനുകരിക്കാതെ അതിലെ അർഥബന്ധങ്ങളും ഏകദേശസംഖ്യയും സൈനികസജ്ജതയും ദൈവസാന്നിധ്യവും സംരക്ഷിച്ചു.
