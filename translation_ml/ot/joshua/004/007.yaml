reference: Joshua 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: ml
  text: 'അപ്പോൾ നിങ്ങൾ അവരോടു പറയണം: “യഹോവയുടെ[a] ഉടമ്പടിയുടെ പെട്ടകത്തിന്റെ മുമ്പിൽ യോർദ്ദാനിലെ വെള്ളം ഒഴുകാതെയായി. പെട്ടകം യോർദ്ദാൻ കടന്നപ്പോൾ യോർദ്ദാനിലെ വെള്ളം ഒഴുകാതെയായി.” ഈ കല്ലുകൾ ഇസ്രായേൽമക്കൾക്ക് എന്നേക്കും ഒരു സ്മാരകമായിരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹോവ” എന്നത് എബ്രായത്തിലെ יהוה (YHWH) എന്ന ദൈവനാമത്തിന്റെ മലയാളരൂപമാണ്; ഇത് “യാഹ്‌വെ” എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: ദൈവനാമത്തിന്റെ ലിപ്യന്തരണത്തിലെ യഥാർഥ വ്യത്യാസം വായനക്കാരനെ അറിയിക്കാൻ.
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: ഒഴുകാതെയായി
  rationale: നദീജലത്തെക്കുറിച്ചുള്ള നിഫാൽ രൂപം ഇവിടെ വെള്ളത്തിന്റെ ഒഴുക്ക് നിലച്ചതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘മുറിച്ചുകളയപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘ഒഴുകാതെയായി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ആവർത്തനം നിലനിർത്തി.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: യോർദ്ദാനിലെ വെള്ളം
  rationale: എബ്രായ ബഹുവചനപ്രയോഗം നദിയുടെ ജലപ്രവാഹത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വെള്ളം’ എന്ന ഏകവചനസമൂഹനാമം സ്വാഭാവികമാണ്.
- source_word: מִפְּנֵי
  choice: മുമ്പിൽ
  rationale: പെട്ടകത്തിന്റെ സാന്നിധ്യത്തിനു മുമ്പിൽ സംഭവിച്ചതെന്ന സ്ഥലപരമായ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹോവയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ദൈവനാമവും ഉടമ്പടിയുമായുള്ള പെട്ടകത്തിന്റെ ബന്ധവും പൂർണമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ഘടന.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: בְּעָבְרוֹ
  choice: പെട്ടകം ... കടന്നപ്പോൾ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം വ്യാകരണപരമായി പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നാമം ആവർത്തിച്ചു.
- source_word: וְהָיוּ הָאֲבָנִים הָאֵלֶּה לְזִכָּרוֹן
  choice: ഈ കല്ലുകൾ ... ഒരു സ്മാരകമായിരിക്കും
  rationale: വാവ് സഹിതമുള്ള പൂർണക്രിയയുടെ നിർദേശഫലമായ ഭാവാർഥം മലയാള ഭാവികാലത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ വംശനാമപ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ സമൂഹനാമത്തിൽ നൽകുന്നു; ഇത് പുരുഷന്മാർക്ക് മാത്രമെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: തുടർന്നുനിൽക്കുന്ന ദൈർഘ്യത്തെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള തുല്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു. മലയാള വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണമാണ് ‘യഹോവ’; ഉച്ചാരണപുനർനിർമാണത്തിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ഇസ്രായേൽമക്കൾക്ക്
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്; ഇസ്രായേല്യർക്ക്
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ജനസമൂഹനാമം ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മക്കൾ’ അതിന്റെ കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പുരുഷലിംഗരൂപം അക്ഷരാർഥത്തിൽ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുറിച്ചുകളയപ്പെട്ടു’ എന്ന അക്ഷരാനുകരണം ഒഴിവാക്കി നദിയുടെ ഒഴുക്ക് നിലച്ചതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കി. ഉദ്ധരണിയും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തി; പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
