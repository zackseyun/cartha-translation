id: JOS.10.31
reference: Joshua 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: ml
  text: പിന്നെ യോശുവയും അവനോടുകൂടെ ഇസ്രായേൽ മുഴുവനും ലിബ്നയിൽനിന്ന് ലാഖീശിലേക്കു നീങ്ങി; യോശുവ അതിനെതിരെ പാളയമടിച്ചു അതിനെതിരെ യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: നീങ്ങി
  rationale: עבר എന്ന ക്രിയയ്ക്ക് ‘കടന്നുപോകുക/നീങ്ങുക’ എന്ന വിശാലമായ അർഥമുണ്ട്. ഇവിടെ നദി കടക്കുന്നതല്ല, ഒരു നഗരത്തിൽനിന്ന് മറ്റൊന്നിലേക്കുള്ള സൈനികനീക്കമാണ്; അതിനാൽ ‘നീങ്ങി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: കൂടെയുള്ള ഇസ്രായേൽ മുഴുവനും
  rationale: യോശുവയോടൊപ്പം സഞ്ചരിച്ച ഇസ്രായേൽ സമൂഹത്തെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗം; മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: ലിബ്നയിൽനിന്ന് ലാഖീശിലേക്ക്
  rationale: ലָכִישָׁהയിലെ ദിശാസൂചകമായ -ה ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ലാഖീശിലേക്ക്’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּחַן עָלֶיהָ
  choice: അതിനെതിരെ പാളയമിറങ്ങി
  rationale: חנה എന്നത് പാളയമടിക്കുക എന്നാണ്; ഉപരോധസന്ദർഭത്തിലെ עַל ശത്രുതാപരമായി നഗരത്തിനെതിരെ നിലയുറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിനെതിരെ പാളയമിറങ്ങി’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: അതിനോടു യുദ്ധംചെയ്തു
  rationale: Niphal രൂപത്തിലുള്ള לחם ‘യുദ്ധംചെയ്യുക’ എന്നാണ്; בָּהּ ഇവിടെ നഗരത്തെ എതിരാളിയായി കാണിക്കുന്നു. ‘അതിനോടു യുദ്ധംചെയ്തു’ മൂലത്തിന്റെ ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവർത്തനം. ഹീബ്രു വിവരണത്തിന്റെ ക്രമവും ആവർത്തിച്ചുള്ള സൈനികഭാവവും നിലനിർത്തിയിട്ടുണ്ട്. വിശദീകരണം ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
