id: JOS.10.5
reference: Joshua 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: ml
  text: അങ്ങനെ അമോര്യരുടെ അഞ്ചു രാജാക്കന്മാർ—യെരൂശലേം രാജാവ്, ഹെബ്രോൻ രാജാവ്, യർമൂത്ത് രാജാവ്, ലാഖീശ് രാജാവ്, എഗ്ലോൻ രാജാവ്—ഒന്നിച്ചുകൂടി. അവരും അവരുടെ എല്ലാ സൈന്യങ്ങളും[a] കയറിച്ചെന്ന് ഗിബെയോനെതിരെ പാളയമിറങ്ങി അതിനോടു യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവരും അവരുടെ എല്ലാ പാളയങ്ങളും.’ ഇവിടെ ‘പാളയങ്ങൾ’ എന്നത് സൈന്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: നിഫാൽ രൂപത്തിലെ കൂട്ടമായി ഒരുമിച്ചുവരുക എന്ന അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഔപചാരിക സഖ്യമുണ്ടാക്കി എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്നതിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; ഭൂപ്രകൃതിയെയോ പതിവ് ദിശാപ്രയോഗത്തെയോ കൃത്രിമമായി നിർണയിക്കുന്നില്ല.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ അഞ്ചു രാജാക്കന്മാർ
  rationale: ഹീബ്രുവിലെ സംഖ്യയും ജനവിഭാഗസൂചനയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: യെരൂശലേം രാജാവ് ... എഗ്ലോൻ രാജാവ്
  rationale: ഓരോ ഭരണാധികാരിയെയും പ്രത്യേകം എണ്ണിപ്പറയുന്ന ഹീബ്രു ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: അവരും അവരുടെ എല്ലാ സൈന്യങ്ങളും
  rationale: മַחֲנֶה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പാളയം’ എന്നുണ്ടെങ്കിലും ഇവിടെ നീങ്ങുകയും യുദ്ധം ചെയ്യുകയും ചെയ്യുന്ന സൈനികസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: ഗിബെയോനെതിരെ പാളയമിറങ്ങി
  rationale: തുടർന്നുള്ള യുദ്ധപ്രവർത്തനം കാരണം עַל ഇവിടെ വെറും സമീപസ്ഥാനം മാത്രമല്ല, ശത്രുതാപരമായ നിലപാടാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: അതിനോടു യുദ്ധം ചെയ്തു
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഗിബെയോൻ നഗരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നഗരത്തെ ‘അത്’ എന്നു പരാമർശിക്കുന്നത് സ്വാഭാവികമാണ്.
