translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകി; മൂലത്തിലെ രാജാക്കന്മാരുടെ ആവർത്തിച്ചുള്ള പട്ടികയും സൈനികക്രമവും നിലനിർത്തി.
