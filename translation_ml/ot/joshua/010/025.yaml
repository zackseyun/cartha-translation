  to: 'യോശുവ അവരോടു പറഞ്ഞു: “ഭയപ്പെടരുത്; തളർന്നുപോകരുത്.[a] ശക്തരും ധൈര്യശാലികളും ആയിരിക്കുക. കാരണം, നിങ്ങൾ പോരാടിക്കൊണ്ടിരിക്കുന്ന എല്ലാ ശത്രുക്കളോടും യഹ്‌വെ ഇങ്ങനെതന്നെ ചെയ്യും.”'
