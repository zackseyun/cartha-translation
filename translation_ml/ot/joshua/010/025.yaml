id: JOS.10.25
reference: Joshua 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: ml
  text: 'യോശുവ അവരോടു പറഞ്ഞു: “ഭയപ്പെടരുത്; തളർന്നുപോകരുത്.[a] ശക്തരും ധൈര്യശാലികളും ആയിരിക്കുക. കാരണം, നിങ്ങൾ പോരാടിക്കൊണ്ടിരിക്കുന്ന എല്ലാ ശത്രുക്കളോടും യഹ്‌വെ ഇങ്ങനെതന്നെ ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഭയപ്പെടരുത്; തകർന്നുപോകരുത്.”
    reason: חתת എന്ന എബ്രായക്രിയയ്ക്ക് പരിഭ്രമിക്കുക, തളരുക, തകർന്നുപോകുക എന്നീ അർത്ഥഛായകൾ ഉണ്ടാകാം; കൂടുതൽ ശക്തമായ അക്ഷരാർഥസാധ്യത ഇവിടെ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: യോശുവ അവരോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമം നിലനിർത്തുന്നു.
- source_word: אַל תִּירְאוּ
  choice: ഭയപ്പെടരുത്
  rationale: ירא എന്ന ക്രിയയുടെ നിഷേധാത്മക ആജ്ഞ ഇവിടെ ഭയപ്പെടാതിരിക്കാനുള്ള നേരിട്ടുള്ള പ്രബോധനമാണ്.
- source_word: וְאַל תֵּחָתּוּ
  choice: പരിഭ്രമിക്കുകയുമരുത്
  rationale: חתת എന്ന പദത്തിലെ ഭയന്ന് തളരുക, സംഭ്രമിക്കുക, ഉള്ളിൽ തകർന്നുപോകുക എന്നീ അർത്ഥവ്യാപ്തികളിൽ സാഹചര്യത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; കൂടുതൽ അക്ഷരാർഥസന്നിഹിതമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: ശക്തരും ധൈര്യശാലികളും ആയിരിക്കുക
  rationale: ശക്തിയും ഉറച്ച ധൈര്യവും എന്ന രണ്ടു ഘടകങ്ങളും വേർതിരിച്ചു സൂക്ഷിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രബോധനരൂപം.
- source_word: כִּי כָכָה
  choice: ഇങ്ങനെതന്നെ
  rationale: כָכָהയുടെ രീതിസൂചകവും ഊന്നലുമുള്ള അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; മുൻവാക്യത്തിനുള്ള കാരണബന്ധം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: יַעֲשֶׂה יְהוָה
  choice: യഹ്‌വെ ... ചെയ്യും
  rationale: സന്ദർഭത്തിൽ yiqtol ഭാവിക്രിയയെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְכָל אֹיְבֵיכֶם אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: നിങ്ങൾ പോരാടിക്കൊണ്ടിരിക്കുന്ന എല്ലാ ശത്രുക്കളോടും
  rationale: എബ്രായത്തിലെ ആവർത്തക സർവനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി, പോരാട്ടത്തിന്റെ എതിർബന്ധം ‘-ഓടും’ എന്ന വിഭക്തിയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ബഹുവചന ആജ്ഞകൾ വ്യക്തമായി നിലനിർത്തുകയും പഴഞ്ചൻ ക്രിയാന്തങ്ങൾ ഒഴിവാക്കുകയും ചെയ്തു.
