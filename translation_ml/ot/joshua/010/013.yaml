id: JOS.10.13
reference: Joshua 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: ml
  text: അങ്ങനെ സൂര്യൻ നിശ്ചലമായി[a]; ചന്ദ്രൻ നിന്നു—ആ ജനം തങ്ങളുടെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യുന്നതുവരെ. ഇത് യാശാരിന്റെ പുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലേ? സൂര്യൻ ആകാശമധ്യത്തിൽ നിശ്ചലമായി; ഏകദേശം ഒരു പൂർണദിവസത്തോളം[c] അസ്തമിക്കാൻ തിടുക്കം കാട്ടിയില്ല[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൗനമായി’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ അർഥം ‘അനങ്ങാതെ നിന്നു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘യാശാരിന്റെ പുസ്തകം’; ‘നീതിമാന്റെ പുസ്തകം’ അഥവാ ‘നേരുള്ളവന്റെ പുസ്തകം’ എന്നായിരിക്കാം അർഥം.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ, ‘ഒരു പൂർണദിവസംപോലെ’ അഥവാ ‘ഏതാണ്ട് ഒരു പൂർണദിവസം.’
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ, ‘വരാൻ തിടുക്കപ്പെട്ടില്ല’; സൂര്യനെക്കുറിച്ച് പറയുമ്പോൾ ഇത് അസ്തമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: സൂര്യൻ നിശ്ചലമായി
  rationale: דמם എന്ന ക്രിയയ്ക്ക് ‘മൗനമായിരിക്കുക’ എന്നും ‘നിശ്ചലമായിരിക്കുക’ എന്നും അർഥമാകാം. ചന്ദ്രൻ നിന്നു എന്ന സമാന്തരപ്രയോഗവും ജ്യോതിർഗോളസന്ദർഭവും കണക്കിലെടുത്ത് ‘നിശ്ചലമായി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְיָרֵחַ עָמָד
  choice: ചന്ദ്രൻ നിന്നു
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നിൽക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ ചലനം അവസാനിച്ചതെന്ന ആശയം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: ആ ജനം തങ്ങളുടെ ശത്രുക്കളോടു പ്രതികാരം ചെയ്യുന്നതുവരെ
  rationale: ഈ പ്രയോഗത്തിൽ נקם എന്ന പൂർണരൂപം പ്രതീക്ഷിക്കാമെങ്കിലും മസോററ്റിക് പാഠത്തിലെ יִקֹּם പ്രതികാരമെടുക്കുക/നീതിപുലർത്തുക എന്ന ആശയം വഹിക്കുന്നു. גוי ഇവിടെ ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനം’ സ്വാഭാവികമാണ്.
- source_word: סֵפֶר הַיָּשָׁר
  choice: യാശാരിന്റെ പുസ്തകം
  rationale: ഒരു ഗ്രന്ഥനാമമായി יָשָׁר-നെ ലിപ്യന്തരണം ചെയ്യുന്നു; അതിന്റെ സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: ആകാശമധ്യത്തിൽ
  rationale: ‘ആകാശത്തിന്റെ നടുവിൽ’ എന്ന സ്ഥലസൂചനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא אָץ לָבוֹא
  choice: അസ്തമിക്കാൻ തിടുക്കം കാട്ടിയില്ല
  rationale: സൂര്യനെ സംബന്ധിച്ച בוא അസ്തമനത്തെ സൂചിപ്പിക്കുന്നു; אוץ-ന്റെ വേഗപ്പെടുക/തിടുക്കപ്പെടുക എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: כְּיוֹם תָּמִים
  choice: ഏകദേശം ഒരു പൂർണദിവസത്തോളം
  rationale: תמים-ന്റെ ‘പൂർണമായ’ എന്ന അർഥവും כְּ-യുടെ താരതമ്യ/ഏകദേശഭാവവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ജ്യോതിർഗോള അത്ഭുതത്തിന്റെ സ്വഭാവം
  choice: സൂര്യനും ചന്ദ്രനും നിശ്ചലമായതായി പാഠം പറയുന്ന വിധത്തിൽ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: മനുഷ്യനിരീക്ഷണത്തിന്റെ ഭാഷയായി മാത്രം അവതരിപ്പിക്കുക, അല്ലെങ്കിൽ കവിതാഭാഗമായി ചുരുക്കി വ്യാഖ്യാനിക്കുക.
  rationale: വിവരണം സംഭവത്തെ അസാധാരണമായ ഒന്നായി അവതരിപ്പിക്കുന്നു. ആധുനിക ശാസ്ത്രീയ പൊരുത്തപ്പെടുത്തലോ രൂപകവത്കരണമോ വിവർത്തനത്തിൽ ചേർക്കാതെ പാഠത്തിന്റെ അവകാശവാദവും അതിലെ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: יִקֹּם എന്ന പ്രയോഗത്തിലെ പ്രതികാരം/നീതിസ്ഥാപനം
  choice: ‘പ്രതികാരം ചെയ്യുക’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘തങ്ങളുടെ ശത്രുക്കളുടെമേൽ നീതി നടപ്പാക്കുക’ അല്ലെങ്കിൽ ‘സ്വയം പ്രതികാരം ചെയ്യുക’.
  rationale: ശത്രുക്കളെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ പ്രതികാരത്തിന്റെ ആശയം ശക്തമാണ്; എന്നിരുന്നാലും നീതിപുലർത്തൽ/വീണ്ടെടുപ്പ് എന്ന ഭാവസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ ഗൗരവമുള്ള മലയാളം. എബ്രായ കവിതാസദൃശമായ സമാന്തരത നിലനിർത്താൻ അർധവിരാമവും ദീർഘവിരാമവും ഉപയോഗിച്ചു; അത്ഭുതവിവരണത്തെ സ്വാഭാവികവത്കരിക്കുകയോ ശാസ്ത്രീയമായി വിശദീകരിക്കുകയോ ചെയ്തിട്ടില്ല.
