  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: ml
  text: യഹ്‌വെ ലാഖീശിനെ ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു. രണ്ടാം ദിവസം അവൻ അതിനെ പിടിച്ചടക്കി; അവൻ ലിബ്നയോടു ചെയ്തതുപോലെ, അതിനെ വാളിന്റെ വായ്ത്തലംകൊണ്ട് അടിക്കുകയും അതിലുള്ള സകല മനുഷ്യരെയും സംഹരിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു അക്ഷരാർഥത്തിൽ: ‘അതിലുള്ള ഓരോ ജീവനും’; ഇവിടെ ഇത് പട്ടണത്തിലുള്ള ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിലെ നാല് വ്യഞ്ജനാക്ഷരങ്ങളെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, ഹീബ്രു നാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: '... കൈയിൽ ഏല്പിച്ചു'
  rationale: ഒരാളുടെ അധികാരത്തിന് വിട്ടുകൊടുക്കുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥവും ‘കൈ’ എന്ന ദൃശ്യരൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָכִישׁ
  choice: ലാഖീശ്
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּלְכְּדָהּ
  choice: അതിനെ പിടിച്ചടക്കി
  rationale: ഒരു പട്ടണം സൈനികമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: രണ്ടാം ദിവസം
  rationale: കാലസൂചനയെ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു; ‘അടുത്ത ദിവസം’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: וַיַּכֶּהָ ... לְפִי חֶרֶב
  choice: അതിനെ ... വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു
  rationale: נכה എന്ന പ്രഹരിക്കൽ/വധിക്കൽ ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ശക്തി നൽകുകയും, ‘വാളിന്റെ വായ്’ എന്ന ഹീബ്രു ദൃശ്യരൂപം മലയാളത്തിലെ ‘വാളിന്റെ വായ്ത്തല’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുള്ള എല്ലാവരെയും
  rationale: נֶפֶשׁ ഇവിടെ ശരീരം–ആത്മാവ് എന്ന തത്ത്വചിന്താപരമായ വേർതിരിവല്ല, പട്ടണത്തിലുള്ള മനുഷ്യരെയാണ് കൂട്ടമായി സൂചിപ്പിക്കുന്നത്. അതിനാൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ മനുഷ്യസൂചന ഉപയോഗിക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: അവൻ ലിബ്നയോടു ചെയ്തതുപോലെ
  rationale: ഹീബ്രുവിലെ ഏകവചന കർത്താവായ ‘അവൻ’ നിലനിർത്തി, മുമ്പ് ലിബ്നയ്ക്കു സംഭവിച്ചതുമായ താരതമ്യം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ജയിച്ച പട്ടണത്തിലെ നിവാസികളെ കൊന്നതിനെ വിവരിക്കുന്ന പ്രയോഗം
  choice: അതിലുള്ള എല്ലാവരെയും
  alternative: അതിലുള്ള സകല ആത്മാക്കളെയും / അതിലുള്ള സകല ജീവജാലങ്ങളെയും
  rationale: ഹീബ്രു נֶפֶשׁ ഇവിടെ മനുഷ്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ആത്മാക്കൾ’ എന്നത് ഉറവിടത്തിലില്ലാത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് ഉണർത്താം; ‘ജീവജാലങ്ങൾ’ മൃഗങ്ങളെയും ഉൾപ്പെടുത്തുന്നതായി തെറ്റിദ്ധരിപ്പിക്കാം. തിരഞ്ഞെടുത്ത രൂപം സംഭവത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താതെ മനുഷ്യസൂചന വ്യക്തമാക്കുന്നു.
- issue: അവസാന താരതമ്യവാക്യത്തിലെ കർത്താവിന്റെ എണ്ണം
  choice: അവൻ ലിബ്നയോടു ചെയ്തതുപോലെ
  alternative: അവർ ലിബ്നയോടു ചെയ്തതുപോലെ / ലിബ്നയോടു ചെയ്തതുപോലെ
  rationale: ഹീബ്രു ക്രിയ ഏകവചനത്തിലാണ്. സന്ദർഭത്തിൽ യോശുവ പ്രതിനിധിയായ നേതാവായി ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും, അത് ബഹുവചനമാക്കി വ്യാഖ്യാനിക്കാതെ ഉറവിടരൂപത്തിലെ ഏകവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കൈയിൽ ഏല്പിച്ചു’, ‘വാളിന്റെ വായ്ത്തലയാൽ’ എന്നീ ഹീബ്രു ദൃശ്യരൂപങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. ഹീബ്രുവിലെ നീണ്ട സംയുക്തവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയക്രമവും ഏകവചന കർത്താവും സംരക്ഷിച്ചു.
