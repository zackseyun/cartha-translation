  to: യഹ്‌വെ ലാഖീശിനെ ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു. രണ്ടാം ദിവസം അവൻ അതിനെ പിടിച്ചടക്കി; അവൻ ലിബ്നയോടു ചെയ്തതുപോലെ, അതിനെ വാളിന്റെ വായ്ത്തലംകൊണ്ട് അടിക്കുകയും അതിലുള്ള സകല മനുഷ്യരെയും സംഹരിക്കുകയും ചെയ്തു.[a]
