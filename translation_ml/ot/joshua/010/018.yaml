id: JOS.10.18
reference: Joshua 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: ml
  text: 'യോശുവ പറഞ്ഞു: “ഗുഹയുടെ വായ്ക്കൽ വലിയ കല്ലുകൾ ഉരുട്ടിവെക്കുക; അവരെ കാക്കാൻ അവിടെ ആളുകളെ നിയോഗിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ പ്രകടിപ്പിക്കുന്നു; പ്രത്യേകം കാലക്രമസൂചന ചേർക്കുന്നില്ല.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: גֹּלּוּ
  choice: ഉരുട്ടിവെക്കുക
  rationale: גלל എന്ന ക്രിയയുടെ കല്ലുകൾ ഉരുട്ടുക എന്ന ഭൗതിക അർഥം നേരിട്ട് നൽകുകയും ലക്ഷ്യസ്ഥാനത്ത് വെക്കുന്നതും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: വലിയ കല്ലുകൾ
  rationale: കല്ലുകളുടെ വലിപ്പത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: ഗുഹയുടെ വായ്ക്കൽ
  rationale: פִּי എന്നതിലെ ‘വായ’ എന്ന ഹീബ്രു രൂപകം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהַפְקִידוּ
  choice: നിയോഗിക്കുക
  rationale: פקד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ചുമതല ഏൽപ്പിക്കൽ എന്ന ആശയം സൂക്ഷിക്കുന്നു.
- source_word: עָלֶיהָ
  choice: അവിടെ
  rationale: ഗുഹയ്ക്കരികിൽ ആളുകളെ കാവലിനായി നിർത്തുക എന്ന സ്ഥലപരവും ചുമതലാസംബന്ധവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲנָשִׁים
  choice: ആളുകളെ
  rationale: സന്ദർഭത്തിലെ മനുഷ്യരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘കാവൽക്കാർ’ എന്ന് വിവർത്തനം ചെയ്ത് മൂലത്തിൽ ഇല്ലാത്ത ഔദ്യോഗിക പദവി ചേർക്കുന്നില്ല.
- source_word: לְשָׁמְרָם
  choice: അവരെ കാക്കാൻ
  rationale: മസൊററ്റിക് പാഠത്തിലെ പുല്ലിംഗ ബഹുവചന പ്രത്യയം കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഗുഹയ്ക്കുള്ളിലെ രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: לְשָׁמְרָם എന്നതിലെ ബഹുവചന കർമത്തിന്റെ സൂചന
  choice: അവരെ കാക്കാൻ
  alternative: അതിനെ കാക്കാൻ / ഗുഹ കാവൽ നിൽക്കാൻ
  rationale: ഹീബ്രു പ്രത്യയം പുല്ലിംഗ ബഹുവചനമാണ്; ഏകവചന സ്ത്രീലിംഗമായ ‘ഗുഹ’ അതിന്റെ വ്യാകരണപരമായ പൂർവപദമാകുന്നില്ല. അതിനാൽ അകത്ത് അടച്ചിട്ട രാജാക്കന്മാരെയാണ് കാക്കേണ്ടത് എന്ന വായന വ്യാകരണത്തിനും സന്ദർഭത്തിനും യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘ഗുഹയുടെ വായ്ക്കൽ’ എന്ന മൂലരൂപകം നിലനിർത്തി; ബഹുവചന കർമം ‘അവരെ’ എന്ന് തുറന്നുവിവർത്തനം ചെയ്തതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
