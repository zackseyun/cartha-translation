base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: ml
  text: യഹോവ ആ പട്ടണത്തെയും അതിന്റെ രാജാവിനെയും കൂടി ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു. അവൻ അതിനെയും അതിലുണ്ടായിരുന്ന സകല മനുഷ്യരെയും[a] വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു. അതിൽ ഒരു അതിജീവിയെയും ശേഷിപ്പിച്ചില്ല. യെരീഹോയുടെ രാജാവിനോടു ചെയ്തതുപോലെതന്നെ അതിന്റെ രാജാവിനോടും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “അതിലുള്ള എല്ലാ നെഫെഷും” (അക്ഷരാർഥത്തിൽ, “ഓരോ ജീവനും/ആത്മാവും”). ഇവിടെ ഈ പ്രയോഗം പട്ടണത്തിലുണ്ടായിരുന്ന എല്ലാ ആളുകളെയും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിലെ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങളെ മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ കൈയിൽ ഏല്പിച്ചു
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം നൽകിക്കൊണ്ട് ‘കൈ’ എന്ന മൂലഭാഷാചിത്രവും സംരക്ഷിക്കുന്നു.
- source_word: גַּם
  choice: ആ പട്ടണത്തെയും
  rationale: മുൻവിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘കൂടി/യും’ എന്ന അർഥം ‘-യും’ എന്ന സമുച്ചയപ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: ആ പട്ടണത്തെയും അതിന്റെ രാജാവിനെയും
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം സന്ദർഭത്തിലെ ലിബ്നാ പട്ടണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ ‘ആ പട്ടണം’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: അതിനെ ... വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ മാരകപ്രഹരവും לפי חרב എന്ന ‘വാളിന്റെ വായ്/മുന’ എന്ന എബ്രായ ദൃശ്യവും ചേർത്ത് നൽകുന്നു.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന സകല മനുഷ്യരെയും
  rationale: נפש ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നല്ല, പട്ടണത്തിലുണ്ടായിരുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: അതിൽ ഒരാളെയും ശേഷിപ്പിച്ചില്ല
  rationale: ശേഷിച്ചവൻ/അതിജീവിച്ചവൻ എന്ന കൂട്ടാർത്ഥം മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായി അറിയിക്കുന്നു.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: യെരീഹോരാജാവിനോടു ചെയ്തതുപോലെതന്നെ അതിന്റെ രാജാവിനോടും ചെയ്തു
  rationale: עשה എന്ന ക്രിയയുടെ ആവർത്തനവും കൃത്യമായ താരതമ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധസന്ദർഭത്തിൽ נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സകല മനുഷ്യരെയും
  alternative: സകല ആത്മാക്കളെയും
  rationale: ഇവിടെ പദം നഗരവാസികളായ ജീവനുള്ള വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാക്കൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലവാക്യത്തിൽ ഇല്ലാത്ത ശരീര-ആത്മ ദ്വൈതസൂചന വരുത്താം.
- issue: സംഹാരവിവരണത്തിന്റെ തീവ്രത
  choice: ഒരാളെയും ശേഷിപ്പിച്ചില്ല
  alternative: ശേഷിപ്പൊന്നും വെച്ചില്ല
  rationale: ശരീദ് എന്ന പദത്തിന്റെ ‘അതിജീവിച്ച വ്യക്തി’ എന്ന അർഥം മറയ്ക്കാതെയും വാചകത്തിന്റെ നൈതിക-ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെയും നൽകുന്നു.
