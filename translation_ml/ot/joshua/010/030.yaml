  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഇസ്രായേലിന്റെ കൈയിൽ’ എന്നും ‘വാളിന്റെ വായ്ത്തല’ എന്നും മൂലഭാഷയിലെ പ്രധാന ദൃശ്യങ്ങൾ നിലനിർത്തി; സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘ആ പട്ടണം’ ഉപയോഗിച്ചു.
