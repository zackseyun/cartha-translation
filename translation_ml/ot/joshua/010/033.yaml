translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പ്രഹരിച്ചു’ എന്ന പദം മൂലഭാഷയിലെ ക്രിയാചിത്രം നിലനിർത്തുന്നു; സമ്പൂർണനാശത്തിന്റെ ആശയം അടുത്ത ഉപവാക്യത്തിൽ വ്യക്തമാകുന്നു.
