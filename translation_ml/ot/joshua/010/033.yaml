  source_fidelity: 'The draft accurately represents the Hebrew sequence and participants: Horam, king of Gezer, went up to aid Lachish; Joshua struck Horam and his people and left no survivor for him. The result clause and the lexical ambiguity of שָׂרִיד are retained.'
