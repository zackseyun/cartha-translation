  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: ml
  text: യോശുവയും ഇസ്രായേൽമക്കളും അവരെ വളരെ വലിയ പ്രഹരത്തോടെ, അവരെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ അടിച്ചുതീർന്നപ്പോൾ, അവരിൽ ശേഷിച്ചവർ രക്ഷപ്പെട്ട്[a] കോട്ടകെട്ടിയ പട്ടണങ്ങളിൽ പ്രവേശിച്ചു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവരിൽനിന്നുള്ള ശേഷിച്ചവർ ശേഷിച്ചു/രക്ഷപ്പെട്ടു’ എന്നപോലെ നാമവും ക്രിയയും ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: ആക്രമിച്ചുതീർന്നപ്പോൾ
  rationale: וַיְהִי ചേർന്ന കാലസൂചക infinitive construct സംഭവപരമ്പരയിലെ അടുത്ത ഘട്ടം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ ‘…തീർന്നപ്പോൾ’ എന്ന ഘടന സ്വാഭാവികമായി അതേ കഥനപ്രവർത്തനം നിർവഹിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: യോശുവയും ഇസ്രായേൽമക്കളും
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തെക്കാൾ മലയാള ബൈബിൾഭാഷയിലും ആധുനിക പ്രയോഗത്തിലും സ്വാഭാവികമായ സാമൂഹിക-സാമുദായിക നാമമാണ് ‘ഇസ്രായേൽമക്കൾ’.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: അവർക്കു അതിഭയങ്കരമായ പ്രഹരമേൽപ്പിച്ച് … ആക്രമിച്ചു
  rationale: נכה/מכה എന്ന ക്രിയ-നാമ ആവർത്തനത്തിലെ ‘അടിക്കുക/പ്രഹരം’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിലെ മാരകത ‘അതിഭയങ്കരമായ’ എന്നും തുടർന്നുള്ള നാശപരാമർശവും വ്യക്തമാക്കുന്നു.
- source_word: עַד תֻּמָּם
  choice: അവരെ പൂർണമായി ഇല്ലാതാക്കുന്നതുവരെ
  rationale: ‘അവരുടെ അവസാനംവരെ/അവർ തീരുന്നതുവരെ’ എന്ന സമ്പൂർണതാബോധം നിലനിർത്തുന്നു. പിന്നാലെ അതിജീവിച്ചവരെ പറയുന്നതിലുള്ള വാചകത്തിന്റെ ഉദ്ദേശ്യമായ സംഘർഷം മൃദുവാക്കുന്നില്ല.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: അവരിൽ ശേഷിച്ചവർ രക്ഷപ്പെട്ട്
  rationale: നാമവും ക്രിയയും തമ്മിലുള്ള ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി, ശേഷിച്ചവർ പരാജിതപക്ഷത്തിൽപ്പെട്ടവരാണെന്ന מֵהֶם എന്ന സൂചന ‘അവരിൽ’ വഴി വ്യക്തമാക്കുന്നു. അക്ഷരാർഥ ആവർത്തനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עָרֵי הַמִּבְצָר
  choice: കോട്ടകെട്ടിയ പട്ടണങ്ങൾ
  rationale: מבצר സൂചിപ്പിക്കുന്ന പ്രതിരോധകോട്ടകളുള്ള നഗരങ്ങളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
