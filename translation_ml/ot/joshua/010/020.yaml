  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. ‘പൂർണമായി ഇല്ലാതാക്കുന്നതുവരെ’ എന്ന സമ്പൂർണതാപ്രയോഗത്തിനും പിന്നാലെയുള്ള അതിജീവിതർക്കും ഇടയിലെ മൂലപാഠത്തിന്റെ സംഘർഷം നിലനിർത്തി.
