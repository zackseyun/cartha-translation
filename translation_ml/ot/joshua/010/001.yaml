  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: ml
  text: യെരൂശലേമിന്റെ രാജാവായ അദോനീ-സേദെക്ക്, യോശുവ ഹായിയെ പിടിച്ചടക്കി അതിനെ നാശത്തിനായി സമർപ്പിച്ചെന്നും[a], യെരീഹോവിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തതുപോലെതന്നെ ഹായിയോടും അതിന്റെ രാജാവിനോടും ചെയ്തെന്നും, ഗിബെയോൻനിവാസികൾ ഇസ്രായേലുമായി സമാധാനം ഉണ്ടാക്കി ഇസ്രായേലിന്റെ ഇടയിൽ ഉണ്ടായിരുന്നെന്നും[b] കേട്ടപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിനെ പൂർണമായി നശിപ്പിച്ചെന്നും.” എബ്രായത്തിലെ חֵרֶם ഭാഷ, ഒരു വസ്തുവിനെ നാശത്തിനായി വേർതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേലുമായി സമാധാനനിബന്ധനകളിൽ ഏർപ്പെട്ടെന്നും.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: കേട്ടപ്പോൾ,
  rationale: വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന സാഹചര്യത്തിൽ, ഹീബ്രു ആഖ്യാനാരംഭത്തെ സ്വാഭാവിക മലയാള temporal clause-ൽ ഉൾപ്പെടുത്തി; വേറിട്ട് ‘സംഭവിച്ചു’ എന്നു ചേർത്താൽ മലയാളത്തിൽ അസ്വാഭാവികമാകും.
- source_word: כִשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כְּ + infinitive construct സൂചിപ്പിക്കുന്ന കാലസാഹചര്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲדֹנִי צֶדֶק
  choice: അദോനീ-സേദെക്ക്
  rationale: സംയുക്ത വ്യക്തിനാമത്തിന്റെ ഘടന ഹൈഫനോടെ ലിപ്യന്തരിച്ചു.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: യെരൂശലേംരാജാവ്
  rationale: construct ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തരൂപത്തിൽ നൽകി.
- source_word: לָכַד
  choice: പിടിച്ചടക്കി
  rationale: നഗരം സൈനികമായി കൈവശപ്പെടുത്തിയെന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: הָעַי
  choice: ഹായിപട്ടണം
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ പേരിന്റെ നഗരം എന്ന സ്വഭാവം വ്യക്തമാക്കാൻ ‘പട്ടണം’ ചേർത്തു.
- source_word: וַיַּחֲרִימָהּ
  choice: അതിനെ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിലെ നശിപ്പിക്കൽ മാത്രമല്ല, നാശത്തിനായി വേർതിരിച്ചുവയ്ക്കുന്ന സാങ്കേതിക-ആരാധനാത്മക ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: ചെയ്തതുപോലെതന്നെ ... ചെയ്തു
  rationale: ഹീബ്രുവിലെ താരതമ്യാത്മക സമാന്തരഘടന മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ
  choice: യെരീഹോവിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തു
  rationale: עשה ל എന്ന പ്രയോഗവും വാക്യത്തിലെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: הִשְׁלִימוּ
  choice: സമാധാനമുണ്ടാക്കി
  rationale: Hiphil രൂപം ഇവിടെ സമാധാനബന്ധത്തിൽ പ്രവേശിച്ചതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: ഗിബെയോൻനിവാസികൾ
  rationale: substantival participle നഗരത്തിലെ താമസക്കാരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദമായി നൽകി.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്നു
  rationale: בקרבם എന്നത് ഇസ്രായേലിന്റെ മധ്യേ/ഇടയിൽ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ താമസബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ജയിച്ചടക്കൽസന്ദർഭത്തിലെ חרם ഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു
  rationale: മൂലപദത്തിൽ ദൈവിക വിധിയുടെ കീഴിൽ നാശത്തിനായി വേർതിരിക്കുന്ന ആശയം ഉൾപ്പെടുന്നതിനാൽ കേവല സൈനിക നശീകരണമായി ചുരുക്കിയില്ല; എന്നാൽ ‘ശാപബാധിതമാക്കി’ പോലുള്ള അസ്പഷ്ടമായ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗവുമായി പൊതുവേ ഒത്ത ലിപ്യന്തരണത്തിൽ നൽകി.
