reference: Joshua 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: ml
  text: 'ഈ രാജാക്കന്മാരെ യോശുവയുടെ അടുക്കൽ പുറത്തുകൊണ്ടുവന്നപ്പോൾ, യോശുവ യിസ്രായേലിലെ എല്ലാ പുരുഷന്മാരെയും[a] വിളിച്ചു; തന്നോടൊപ്പം പോയിരുന്ന യോദ്ധാക്കളുടെ സേനാനായകന്മാരോടു[b] പറഞ്ഞു: “അടുത്തുവരുവിൻ; നിങ്ങളുടെ കാലുകൾ ഈ രാജാക്കന്മാരുടെ കഴുത്തുകളിൽ വെക്കുവിൻ.” അവർ അടുത്തുവന്ന് തങ്ങളുടെ കാലുകൾ അവരുടെ കഴുത്തുകളിൽ വെച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘യിസ്രായേലിലെ ഓരോ പുരുഷനെയും’; ഈ സൈനികസന്ദർഭത്തിൽ സൈന്യത്തോടൊപ്പം ഉണ്ടായിരുന്ന പുരുഷന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യോദ്ധാക്കളുടെ നേതാക്കന്മാരോടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: പുറത്തുകൊണ്ടുവന്നപ്പോൾ
  rationale: വַיְהִי + כְּ എന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു; സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: ഈ രാജാക്കന്മാർ
  rationale: സംസാരസന്ദർഭത്തിൽ സന്നിഹിതരായ രാജാക്കന്മാരിലേക്കുള്ള സൂചനയായതിനാൽ ‘ഈ’ യോജിക്കുന്നു.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: യിസ്രായേലിലെ എല്ലാ പുരുഷന്മാരും
  rationale: ‘യിസ്രായേലിലെ ഓരോ പുരുഷനും’ എന്ന വിതരണാത്മക അർഥവും സൈനികസന്ദർഭത്തിലെ പുരുഷലിംഗസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: യുദ്ധപുരുഷന്മാരുടെ നായകന്മാർ
  rationale: קְצִינֵי എന്നതിലെ നേതൃസ്ഥാനം ‘നായകന്മാർ’ എന്നും אַנְשֵׁי הַמִּלְחָמָה എന്ന സൈനികപ്രയോഗം ‘യുദ്ധപുരുഷന്മാർ’ എന്നും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: തന്നോടൊപ്പം പോയിരുന്ന
  rationale: യോശുവയോടൊപ്പം സൈനികയാത്രയിൽ പങ്കെടുത്തവരെ വിശേഷിപ്പിക്കുന്ന രൂപം; മലയാളത്തിലെ ഭൂതകാലബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: קִרְבוּ
  choice: അടുത്തുവരുവിൻ
  rationale: ശാരീരികമായി സമീപിക്കാനുള്ള നേരിട്ടുള്ള ബഹുവചന കല്പനയെ dignified, readily understood Malayalam-ൽ നൽകുന്നു.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: നിങ്ങളുടെ കാലുകൾ ... കഴുത്തുകളിൽ വെക്കുവിൻ
  rationale: കീഴടക്കലിന്റെ മൂർത്തമായ പ്രവൃത്തിയെ മയപ്പെടുത്താതെ, שִׂים എന്ന സാധാരണ ക്രിയയുടെ അർഥം വ്യക്തമായി പകരുന്നു.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: അവർ അടുത്തുവന്ന് ... വെച്ചു
  rationale: തുടർച്ചയായ രണ്ടു ആഖ്യാനക്രിയകളെയും ഉടനെയുള്ള അനുസരണത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: כָּל אִישׁ יִשְׂרָאֵל, אַנְשֵׁי הַמִּלְחָמָה എന്നിവയിലെ ലിംഗസൂചന
  choice: എല്ലാ പുരുഷന്മാർ / യുദ്ധപുരുഷന്മാർ
  alternative: എല്ലാ യിസ്രായേല്യരും / യോദ്ധാക്കൾ
  rationale: സൈനികസന്ദർഭത്തിൽ മൂലപാഠം വ്യക്തമായി ഉപയോഗിക്കുന്ന പുരുഷലിംഗരൂപങ്ങളെ ലിംഗനിരപേക്ഷമാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: രാജാക്കന്മാരുടെ കഴുത്തുകളിൽ കാലുകൾ വെക്കുന്ന കീഴടക്കൽചിഹ്നം
  choice: മൂലപാഠത്തിലെ മൂർത്തമായ പ്രവൃത്തി അതേപടി നിലനിർത്തുന്നു
  alternative: അവരെ പൂർണമായി കീഴടക്കിയതായി സ്വതന്ത്രമായി പരാവർത്തനം ചെയ്യുക
  rationale: വാക്യത്തിലെ കഠിനമായ സൈനികദൃശ്യം ധാർമികമായോ ഉപദേശപരമായോ മയപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു.
- issue: הֶהָלְכוּא אִתּוֹ എന്ന ബന്ധവാക്യത്തിന്റെ സാധ്യതയുള്ള സംബന്ധം
  choice: മലയാളവാക്യത്തിൽ ‘തന്നോടൊപ്പം പോയിരുന്ന’ എന്നത് മുഴുവൻ സൈനികനേതൃസംഘത്തെ വിശേഷിപ്പിക്കാൻ അനുവദിക്കുന്നു
  alternative: അത് നായകന്മാരെ മാത്രം അല്ലെങ്കിൽ യുദ്ധപുരുഷന്മാരെ മാത്രം വ്യക്തമായി വിശേഷിപ്പിക്കുന്നതായി നിർണ്ണയിക്കുക
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം വ്യാകരണപരമായി ഒന്നിലധികം സമീപപദങ്ങളുമായി ചേരാവുന്നതിനാൽ അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. കല്പനകളിൽ ‘അടുത്തുവരുവിൻ’, ‘വെക്കുവിൻ’ എന്നീ മാന്യമായ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു; സൈനികദൃശ്യത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തി.
