  to: 'ഈ രാജാക്കന്മാരെ യോശുവയുടെ അടുക്കൽ പുറത്തുകൊണ്ടുവന്നപ്പോൾ, യോശുവ യിസ്രായേലിലെ എല്ലാ പുരുഷന്മാരെയും[a] വിളിച്ചു; തന്നോടൊപ്പം പോയിരുന്ന യോദ്ധാക്കളുടെ സേനാനായകന്മാരോടു[b] പറഞ്ഞു: “അടുത്തുവരുവിൻ; നിങ്ങളുടെ കാലുകൾ ഈ രാജാക്കന്മാരുടെ കഴുത്തുകളിൽ വെക്കുവിൻ.” അവർ അടുത്തുവന്ന് തങ്ങളുടെ കാലുകൾ അവരുടെ കഴുത്തുകളിൽ വെച്ചു.'
