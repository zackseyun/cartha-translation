  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: ml
  text: ജനമെല്ലാം സുരക്ഷിതരായി മക്കേദയിലെ യോശുവയുടെ പാളയത്തിലേക്കു മടങ്ങിവന്നു. ഇസ്രായേൽമക്കളിൽ ഒരാൾക്കെതിരെയും ഒരാളും നാവനക്കിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: “ഇസ്രായേൽമക്കളിൽ ഒരാൾക്കെതിരെയും ഒരാളും ഒരു വാക്കുപോലും പറഞ്ഞില്ല.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ, “ഒരാളും തന്റെ നാവ് മൂർച്ചയാക്കിയില്ല,” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: ജനമെല്ലാം ... മടങ്ങിവന്നു
  rationale: ശׁוּב ഇവിടെ പിന്തുടരലിനുശേഷമുള്ള ശാരീരികമായ മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നു. עָם എന്നത് സന്ദർഭത്തിൽ പോരാളികളെയാണു സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്താൻ ‘ജനം’ ഉപയോഗിച്ചു.
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: മക്കേദയിൽ യോശുവയുടെ അടുക്കൽ പാളയത്തിലേക്കു
  rationale: 'എബ്രായത്തിലെ ചുരുക്കിയ സ്ഥാനവാക്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു: പാളയം മക്കേദയിൽ യോശുവയുടെ അടുക്കലായിരുന്നു.'
- source_word: בְּשָׁלוֹם
  choice: സുരക്ഷിതരായി
  rationale: ഈ യുദ്ധസന്ദർഭത്തിൽ ശָׁלוֹם എന്നത് കേടുപാടില്ലാതെ സുരക്ഷിതമായി മടങ്ങിയെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘സമാധാനത്തോടെ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: ഒരാളും നാവനക്കിയില്ല
  rationale: ‘നാവ് മൂർച്ചയാക്കുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ എതിർത്തു സംസാരിക്കുകയോ ഭീഷണിപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘നാവനക്കിയില്ല’ എന്ന പ്രയോഗം രൂപകത്തിന്റെ ശരീരഭാഗചിത്രവും സന്ദർഭാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: ഇസ്രായേൽമക്കളിൽ ആർക്കും എതിരായി
  rationale: בני ישראל എന്ന ദേശീയ-വംശപരമായ സംജ്ഞയെ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകുന്നു; നിഷേധത്തോടുകൂടിയ אִישׁ ഇവിടെ ‘ആർക്കും’ എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: בני ישראל എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന ലിംഗചിഹ്നിത സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന കുടുംബ-ഉടമ്പടി ഭാവം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പാളയം,’ ‘ഇസ്രായേൽമക്കൾ’ എന്നീ വേദപാരമ്പര്യമുള്ള പദങ്ങൾ നിലനിർത്തി; ദുർഗ്രാഹ്യമായ അക്ഷരാനുവാദത്തിനു പകരം സ്വാഭാവികമായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നൽകി.
