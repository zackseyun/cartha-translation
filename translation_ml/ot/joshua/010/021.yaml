    rationale: “ഇസ്രായേൽമക്കളിൽ ആർക്കും എതിരായി” is grammatical, but “ഇസ്രായേൽമക്കളിൽ ഒരാൾക്കെതിരെയും” more naturally and precisely renders the negative-plus-אִישׁ sense, ‘against any one of the sons of Israel.’
