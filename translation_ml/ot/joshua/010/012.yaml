source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: ml
  text: 'യാഹ്‌വെ അമോര്യരെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ ഏൽപ്പിച്ചുകൊടുത്ത ദിവസം യോശുവ യാഹ്‌വെയോടു സംസാരിച്ചു. അവൻ ഇസ്രായേലിന്റെ കൺമുന്നിൽ പറഞ്ഞു: “സൂര്യനേ, ഗിബെയോനിൽ നിശ്ചലമായിരിക്കുക; ചന്ദ്രനേ, അയ്യാലോൻ താഴ്വരയിൽ നിശ്ചലമായിരിക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ രണ്ടാമത്തെ വാക്യഭാഗം അക്ഷരാർഥത്തിൽ “ചന്ദ്രൻ, അയ്യാലോൻ താഴ്വരയിൽ” എന്നാണ്; ആദ്യ വാക്യഭാഗത്തിലെ “നിശ്ചലമായിരിക്കുക” എന്ന ക്രിയ ഇവിടെ അധ്യാഹരിച്ചിരിക്കുന്നു. דּוֹם എന്ന ഹീബ്രു ക്രിയയ്ക്ക് “നിശ്ചലമായിരിക്കുക,” “നിൽക്കുക,” അല്ലെങ്കിൽ “മിണ്ടാതിരിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: പീയേൽ രൂപത്തിന്റെ സാധാരണ അർഥം ‘സംസാരിക്കുക’ എന്നതാണ്; തുടർന്നുള്ള וַיֹּאמֶר എന്ന ‘പറഞ്ഞു’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: യഹോവ ... ഏല്പിച്ചുകൊടുത്ത ദിവസം
  rationale: בְּיוֹם സഹിതമുള്ള infinitive construct കാലസൂചനയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമായി നൽകി.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരെ
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും ഇവിടെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമാണ്; അതിനാൽ മലയാള ബഹുവചന കർമരൂപം യോജിക്കുന്നു.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധ സൂചനയും לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ’ എന്ന ആശയവും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേൽ കാണെ പറഞ്ഞു
  rationale: לְעֵינֵי എന്നത് പൊതുവായ ദൃശ്യസാന്നിധ്യം സൂചിപ്പിക്കുന്നു; ‘കാണെ’ അതിനെ ചുരുക്കമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: സൂര്യാ ... നിശ്ചലമായി നിൽക്കുക
  rationale: דום നിശ്ശബ്ദതയെയോ നിൽപ്പിനെയോ സൂചിപ്പിക്കാം; ഈ ആകാശീയ കല്പനയുടെ സാഹചര്യത്തിൽ ചലനം നിലയ്ക്കുന്നതിനെ വ്യക്തമാക്കുന്നെങ്കിലും വ്യാഖ്യാനം അതിരുകടക്കാത്ത പ്രയോഗമാണിത്.
- source_word: בְּגִבְעוֹן
  choice: ഗിബെയോനിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചകത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള മലയാള രൂപം; ‘മുകളിൽ’ എന്ന വ്യാഖ്യാനപരമായ സ്ഥലം നിർബന്ധിക്കുന്നില്ല.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: ചന്ദ്രാ, അയ്യാലോൻ താഴ്വരയിൽ നിൽക്കുക
  rationale: ഹീബ്രുവിലെ രണ്ടാമത്തെ സമാന്തര ഘടകം ക്രിയാരഹിതമാണ്; മുൻ ഘടകത്തിലെ דום ഇവിടെ അധ്യാഹരിക്കപ്പെടുന്നതിനാൽ മലയാളത്തിൽ ‘നിൽക്കുക’ ചേർത്ത് അർഥം സ്വാഭാവികമാക്കി, അടിക്കുറിപ്പിൽ ഘടന വ്യക്തമാക്കി.
- source_word: אַיָּלוֹן
  choice: അയ്യാലോൻ
  rationale: ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്നതും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികവുമായ സ്ഥലനാമ ലിപ്യന്തരണം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരി ദൈവനാമം ഉപയോഗിക്കുന്നു. അത് പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്നു നൽകി; ശാസ്ത്രീയമായ മറ്റൊരു ലിപ്യന്തരണം ‘യാഹ്‌വെ’ ആണ്.
- issue: സൂര്യനോടുള്ള കല്പനയുടെ അർഥം
  choice: നിശ്ചലമായി നിൽക്കുക
  alternative: മിണ്ടാതിരിക്കുക / നിൽക്കുക / നിലയ്ക്കുക
  rationale: דום എന്ന ക്രിയയ്ക്ക് നിശ്ശബ്ദതയുടെയും നിലച്ചിരിപ്പിന്റെയും അർഥപരിധിയുണ്ട്. സന്ദർഭം ചലനനിലയ്ക്കലിലേക്കു ചായുന്നുവെങ്കിലും അതിന്റെ യാന്ത്രികമോ ജ്യോതിശാസ്ത്രപരമോ ആയ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കവിതാസ്വഭാവമുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഹീബ്രുവിലെ കുടുംബബന്ധ പ്രയോഗം സംരക്ഷിക്കുന്നു.
