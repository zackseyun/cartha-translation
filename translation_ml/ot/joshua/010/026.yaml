source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: ml
  text: അതിനുശേഷം യോശുവ അവരെ അടിച്ചുവീഴ്ത്തി കൊന്നു; പിന്നെ അവരെ അഞ്ചു മരങ്ങളിൽ തൂക്കി.[a] സന്ധ്യവരെ അവർ ആ മരങ്ങളിൽ തൂങ്ങിക്കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ മരങ്ങളിൽ തൂക്കിയിട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ശരീരങ്ങളെ മരത്തിലോ മരക്കഷണത്തിലോ തൂക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുത്തിനാട്ടി’ എന്ന അർഥവും സാധ്യതയുള്ളതാണ്; എന്നാൽ ഇവിടെ അത് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം പ്രഹരിച്ച് വീഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള וַיְמִיתֵם എന്ന ‘കൊന്നു’ എന്ന ക്രിയയിൽനിന്ന് ഇതിനെ വേർതിരിച്ചുനിർത്താൻ ‘വെട്ടിവീഴ്ത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ ക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: וַיְמִיתֵם
  choice: കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മരണത്തിനിടയാക്കുക എന്നർഥം നൽകുന്നു; ഈ വധസന്ദർഭത്തിൽ ‘കൊന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיִּתְלֵם
  choice: അവരെ ... തൂക്കി
  rationale: תלה എന്നത് ഒരാളെ അല്ലെങ്കിൽ മൃതദേഹം മരത്തിലോ മരവസ്തുവിലോ തൂക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കുത്തിനാട്ടിയെന്ന രീതി ഉറപ്പിക്കാതെ ഉറവിടത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: അഞ്ചു മരങ്ങളിൽ
  rationale: עֵץ എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘മരം’ നിലനിർത്തുന്നു; തൂക്കുമരം, കഴുമരം, മരക്കുറ്റി തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ടമായ ഘടനകൾ പാഠം വ്യക്തമാക്കുന്നില്ല.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: അവർ ... തൂങ്ങിക്കിടന്നു
  rationale: היה എന്ന ക്രിയയും നിഷ്ക്രിയ കൃദന്തരൂപവും ചേർന്ന് തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘തൂങ്ങിക്കിടന്നു’ ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: പ്രദർശനം അവസാനിച്ച സമയപരിധിയെ അടുത്തും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു; ‘സൂര്യാസ്തമയംവരെ’ എന്നു പറഞ്ഞാൽ ഉറവിടത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനപരമാകും.
theological_decisions:
- issue: വധശേഷമുള്ള പ്രദർശനസന്ദർഭത്തിൽ עֵץ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മരങ്ങൾ
  alternative: മരക്കുറ്റികൾ / തൂക്കുമരങ്ങൾ
  rationale: എബ്രായ പദം ‘മരം’ എന്നും ‘മരംകൊണ്ടുള്ള വസ്തു’ എന്നും അർഥമാക്കാം. ഈ വാക്യം ഉപകരണത്തിന്റെ കൃത്യരൂപം വ്യക്തമാക്കാത്തതിനാൽ ‘മരങ്ങൾ’ എന്ന നേരിട്ടുള്ള അർഥം സ്വീകരിച്ച് പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക വധോപകരണചിത്രം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വെട്ടിവീഴ്ത്തി’യും ‘കൊന്നു’വും വേർതിരിച്ച് എബ്രായത്തിലെ തുടർച്ചയായ രണ്ട് ക്രിയകളെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പിന്റെ സൂചിക [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
