lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: נוּס എന്ന ക്രിയ അപകടത്തിൽനിന്നോ പരാജയത്തിൽനിന്നോ പലായനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ഈ അഞ്ചു രാജാക്കന്മാർ
  rationale: ഹീബ്രു നിർദേശകപദമായ הָאֵלֶּהയുടെ പ്രത്യേകത ‘ഈ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമവും ഇതാണ്.
- source_word: וַיֵּחָבְאוּ
  choice: ഒളിച്ചു
  rationale: חבאയുടെ സ്വയം മറയ്ക്കുക എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: בַמְּעָרָה
  choice: ഗുഹയിൽ
  rationale: ഹീബ്രുവിൽ നിർദിഷ്ട ആർട്ടിക്കിൾ ഉണ്ടെങ്കിലും മലയാളത്തിൽ ‘ഗുഹയിൽ’ എന്ന രൂപം തന്നെ സന്ദർഭപരമായി നിർദിഷ്ടമായ ഗുഹയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּמַקֵּדָה
  choice: മക്കേദയിലെ
  rationale: സ്ഥലനാമം ശബ്ദാനുകരണമായി നിലനിർത്തുകയും ഗുഹയുടെ സ്ഥാനം വ്യക്തമാക്കാൻ മലയാളത്തിലെ സ്വാഭാവികമായ സംബന്ധരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: വാവ് കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ബന്ധകമാണ്; മുൻസന്ദർഭത്തിൽനിന്നുള്ള തിരിവ് പ്രകടമാക്കുന്ന ഇംഗ്ലീഷ് POB-യുടെ ‘But’ എന്ന വായനയെ പിന്തുടർന്ന് ‘എന്നാൽ’ ഉപയോഗിച്ചു. ‘അപ്പോൾ’ എന്നതും സാധ്യമാണ്.
