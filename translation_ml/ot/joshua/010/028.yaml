source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: ml
  text: ആ ദിവസം യോശുവ മക്കേദ പിടിച്ചടക്കി; വാളിന്റെ വായ്ത്തലയാൽ അതിനെ ആക്രമിച്ചു. അതിന്റെ രാജാവിനെയും അതിലുള്ള ഓരോരുത്തരെയും അവൻ നാശത്തിനായി സമർപ്പിച്ചു[a]; ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല. യെരീഹോയുടെ രാജാവിനോടു ചെയ്തതുപോലെതന്നെ അവൻ മക്കേദയുടെ രാജാവിനോടും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർണമായി നശിപ്പിച്ചു.” എബ്രായക്രിയ നിരോധനത്തിനു കീഴിൽ ഒരാളെയോ ഒന്നിനെയോ നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: חרם എന്ന ക്രിയയുടെ ‘നാശത്തിനായി സമർപ്പിക്കുക’ എന്ന പ്രത്യേക അർഥവും സാധ്യമായ ലളിതപരിഭാഷയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: לָכַד
  choice: പിടിച്ചടക്കി
  rationale: ഒരു നഗരം സൈനികമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: അതിനെ വാളിന്റെ വായ്ത്തലയാൽ സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ആക്രമിച്ചു സംഹരിക്കുക എന്ന ശക്തിയും ‘വാളിന്റെ വായ്’ എന്ന എബ്രായ ദൃശ്യരൂപവും ‘വായ്ത്തല’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הֶחֱרִים
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്നത് വെറും കൊല്ലലല്ല, നിരോധനവിധിയിൽ നാശത്തിനു വേർതിരിച്ചുവെക്കുന്നതെന്ന ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ അർഥവും വഹിക്കുന്നു.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന ഓരോ വ്യക്തിയെയും
  rationale: נפש ഇവിടെ ദേഹരഹിതമായ ആത്മാവിനെയല്ല, വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല
  rationale: അതിജീവിച്ച ഒരാളെയും ശേഷിപ്പിച്ചില്ല എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: യെരീഹോവിലെ രാജാവിനോടു ചെയ്തതുപോലെതന്നെ അവൻ മക്കേദയിലെ രാജാവിനോടും ചെയ്തു
  rationale: עשה + ל എന്ന എബ്രായത്തിലെ മനഃപൂർവമായ സംക്ഷിപ്തത നിലനിർത്തി, രാജാവിന് സംഭവിച്ചതെന്തെന്ന് അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: മക്കേദ / യെരീഹോ / യോശുവ
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന ലിപ്യന്തരണം.
theological_decisions:
- issue: വിജയയുദ്ധസന്ദർഭത്തിലെ חרם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു / നിരോധനവിധിക്ക് ഏല്പിച്ചു
  rationale: ഈ ക്രിയ സാധാരണ നശീകരണത്തെക്കാൾ കൂടുതൽ അർഥം വഹിച്ച്, നാശത്തിനായി വേർതിരിക്കപ്പെടുന്ന നിരോധനവിധിയെ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ ആ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ അർഥവ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വാളിന്റെ വായ്ത്തല’ എന്ന ദൃശ്യരൂപവും ‘ചെയ്തു’ എന്ന സംക്ഷിപ്ത താരതമ്യവും മൂലഭാഷയോട് ചേർന്ന് നിലനിർത്തിയിരിക്കുന്നു; חרם എന്ന പദത്തിന്റെ പ്രത്യേക അർഥം പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
