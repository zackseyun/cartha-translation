  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ നിശ്ചലരായി നിൽക്കരുത്; നിങ്ങളുടെ ശത്രുക്കളെ പിന്തുടരുക; അവരുടെ പിൻഭാഗത്തുള്ളവരെ ആക്രമിക്കുക.[a] അവർ തങ്ങളുടെ പട്ടണങ്ങളിൽ പ്രവേശിക്കാൻ അവരെ അനുവദിക്കരുത്; കാരണം നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ അവരെ നിങ്ങളുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ഏറ്റവും പിന്നിലുള്ളവരെ ആക്രമിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ ഓടിപ്പോകുന്ന സേനയുടെ വാൽഭാഗത്തെയോ ഏറ്റവും പിന്നിലുള്ളവരെയോ പ്രഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: എന്നാൽ നിങ്ങൾ
  rationale: സംയോജകവും സ്വതന്ത്ര സർവനാമവും ചേർന്ന് മുമ്പുള്ളവരിൽനിന്ന് ഇവരിലേക്കുള്ള വൈരുധ്യാത്മക ഊന്നൽ സൂചിപ്പിക്കുന്നു.
- source_word: אַל תַּעֲמֹדוּ
  choice: നിശ്ചലരായി നിൽക്കരുത്
  rationale: പിന്തുടരൽ നിർത്തരുതെന്ന സൈനികസന്ദർഭത്തിലെ ആശയം നൽകിക്കൊണ്ട് ‘നിൽക്കുക’ എന്ന മൂലചിത്രം നിലനിർത്തുന്നു.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളെ പിന്തുടർന്ന്
  rationale: רדף אחרי എന്നത് പിന്തുടരുക എന്ന സാധാരണ പ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി നൽകിയിരിക്കുന്നു.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: അവരുടെ പിൻനിരയെ ആക്രമിക്കണം
  rationale: זנב എന്ന ക്രിയ ഓടിപ്പോകുന്ന സേനയുടെ ‘വാൽ’, അതായത് ഏറ്റവും പിന്നിലുള്ള വിഭാഗം, ആക്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായി ക്രമീകരിച്ച rear guard ആണെന്ന് അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: അവർ ... പ്രവേശിക്കാൻ അനുവദിക്കരുത്
  rationale: נתן കൂടെ infinitive വന്നിരിക്കുന്ന ഈ പ്രയോഗം അനുവദിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: אֶל עָרֵיהֶם
  choice: തങ്ങളുടെ പട്ടണങ്ങളിൽ
  rationale: עיר പട്ടണം/നഗരം എന്നർഥം വഹിക്കുന്നു; ആവർത്തിക്കുന്ന ബഹുവചന കർത്താവിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ ‘തങ്ങളുടെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי נְתָנָם
  choice: കാരണം ... അവരെ ... ഏല്പിച്ചിരിക്കുന്നു
  rationale: perfect ക്രിയ ദൈവികമായി വിജയം ഇതിനകം ഉറപ്പായതായി അവതരിപ്പിക്കുന്നു; ‘ഏല്പിച്ചിരിക്കുന്നു’ ആ ഫലസ്ഥിതി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കൈയിൽ
  rationale: അധികാരം അഥവാ നിയന്ത്രണം സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചന ‘കൈ’ എന്ന ദൃശ്യപ്രയോഗം മനസ്സിലാകുന്ന മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരംവയ്ക്കാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: נְתָנָם എന്ന perfect ക്രിയയിലെ ഉറപ്പായ ദൈവിക പ്രവർത്തനം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: ഭാവിവാഗ്ദാനമാക്കി മാറ്റാതെ, വിജയം ദൈവം ഇതിനകം ഉറപ്പാക്കിയതായി എബ്രായ perfect അവതരിപ്പിക്കുന്ന സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനികസന്ദർഭം തെളിയിക്കുന്നതിനൊപ്പം മൂലത്തിലെ ‘കൈ’ എന്ന ദൃശ്യപ്രയോഗവും perfect ക്രിയയുടെ ഉറപ്പും നിലനിർത്തി.
