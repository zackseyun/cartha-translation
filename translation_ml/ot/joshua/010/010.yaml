  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: ml
  text: യഹ്‌വെ അവരെ ഇസ്രായേലിന്റെ മുമ്പിൽ പരിഭ്രാന്തരാക്കി[a]; ഗിബെയോനിൽവെച്ച് അവരെ വലിയ തോതിൽ സംഹരിച്ചു; ബേത്ത്-ഹോരോൻ കയറ്റത്തിന്റെ വഴിയിലൂടെ അവരെ പിന്തുടർന്നു, അസേക്കാ വരെയും മക്കേദാ വരെയും അവരെ സംഹരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആശയക്കുഴപ്പത്തിലാക്കി’ അല്ലെങ്കിൽ ‘ഭീതിയിലാഴ്ത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ യുദ്ധത്തിൽ ആശയക്കുഴപ്പമോ പരിഭ്രാന്തിയോ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: പരിഭ്രാന്തരാക്കി
  rationale: המם എന്ന ക്രിയ യുദ്ധത്തിൽ ഭീതിയും ആശയക്കുഴപ്പവും ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരിഭ്രാന്തരാക്കി’ ദൈവിക കാരണവും മാനസികമായ കലക്കവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഫലമാത്രം സൂചിപ്പിക്കുന്ന ‘തോൽപ്പിച്ചു’ എന്നതിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുമ്പിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരവും ‘ഇസ്രായേലിന്റെ കൺമുന്നിൽ/അവർക്കുവേണ്ടി’ എന്നതുമായ സാധ്യതകൾ അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: അവരെ വൻതോതിൽ സംഹരിച്ചു
  rationale: യുദ്ധസന്ദർഭത്തിൽ נכהയും מכה גדולהയും ചേർന്ന് കനത്ത പ്രഹരത്തെയോ വലിയ സംഹാരത്തെയോ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ യുദ്ധത്തിലെ മാരകമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּגִבְעוֹן
  choice: ഗിബെയോനിൽ
  rationale: യുദ്ധം നടന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּרְדְּפֵם
  choice: അവരെ പിന്തുടർന്ന്
  rationale: רדף ശത്രുവിനെ പിന്തുടരുക എന്ന സാധാരണ യുദ്ധക്രിയയാണ്; തുടർന്നുള്ള ക്രിയയുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: ബേത്ത്-ഹോരോൻ കയറ്റത്തിന്റെ വഴിയിലൂടെ
  rationale: ‘ബേത്ത്-ഹോരോന്റെ കയറ്റത്തിലൂടെയുള്ള വഴി’ എന്ന ഭൂപ്രകൃതിവിവരം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: וַיַּכֵּם
  choice: അവരെ വെട്ടിവീഴ്ത്തി
  rationale: ആവർത്തിച്ചിരിക്കുന്ന נכה എന്ന യുദ്ധക്രിയയുടെ ശക്തിയും പിന്തുടർന്നുള്ള മാരകപ്രഹരവും പ്രകടമാക്കുന്നു.
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: അസേക്കവരെയും മക്കേദവരെയും
  rationale: ആക്രമണം എത്തിച്ചേർന്ന ഭൂമിശാസ്ത്രപരമായ പരിധികളെ ആവർത്തിച്ച עַד അനുസരിച്ച് രണ്ടിടങ്ങൾക്കും ‘വരെ’ ചേർത്ത് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: പിന്തുടരുന്ന ക്രിയകളുടെ കർത്താവ്
  choice: യഹ്‌വെയെ തുടർച്ചയായ കർത്താവായി നിലനിർത്തി
  alternative: പിന്തുടരലിന്റെയും വെട്ടിവീഴ്ത്തലിന്റെയും കർത്താവായി ഇസ്രായേലിനെ വ്യക്തമാക്കുക
  rationale: എബ്രായ വാക്യത്തിലെ ഏകവചന ക്രിയാശൃംഖലയിൽ പ്രത്യക്ഷമായി പറയുന്ന കർത്താവ് യഹ്‌വെയാണ്. സൈനിക പ്രവർത്തനം ഇസ്രായേലിലൂടെ നടന്നിരിക്കാമെങ്കിലും, വാക്യഘടനയിലെ ദൈവിക പ്രവർത്തനപ്രാധാന്യം പരിഭാഷയിൽ മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രാഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; യുദ്ധത്തിന്റെ തീവ്രത മയപ്പെടുത്താതെയും അനാവശ്യമായ പുരാതനപദങ്ങൾ ഒഴിവാക്കിയും അവതരിപ്പിച്ചു.
