  to: യഹ്‌വെ അവരെ ഇസ്രായേലിന്റെ മുമ്പിൽ പരിഭ്രാന്തരാക്കി[a]; ഗിബെയോനിൽവെച്ച് അവരെ വലിയ തോതിൽ സംഹരിച്ചു; ബേത്ത്-ഹോരോൻ കയറ്റത്തിന്റെ വഴിയിലൂടെ അവരെ പിന്തുടർന്നു, അസേക്കാ വരെയും മക്കേദാ വരെയും അവരെ സംഹരിച്ചു.
