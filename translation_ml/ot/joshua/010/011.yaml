id: JOS.10.11
reference: Joshua 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: ml
  text: അവർ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോകുമ്പോൾ, ബേത്ത്-ഹോരോന്റെ ഇറക്കത്തിലായിരിക്കെ, യഹ്‌വെ ആകാശത്തുനിന്ന് വലിയ കല്ലുകൾ അസേക്കവരെ അവരുടെമേൽ എറിഞ്ഞു; അവർ മരിച്ചു. ഇസ്രായേൽമക്കൾ വാളുകൊണ്ട് കൊന്നവരെക്കാൾ കൂടുതൽപേർ ആലിക്കല്ലുകളാൽ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: അവർ ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോകുമ്പോൾ
  rationale: ב prefixed infinitive construct marks contemporaneous action, while מִפְּנֵי expresses flight from before an opposing force. The Malayalam retains the Hebrew imagery without obscuring that this is a retreat.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: ബേത്ത്-ഹോരോന്റെ ഇറക്കത്തിലായിരിക്കെ
  rationale: מוֹרָד denotes a descent or downhill route; ‘ഇറക്കം’ naturally preserves the topographical detail.
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: The personal covenant name represented by the Tetragrammaton is transliterated rather than replaced with a title.
- source_word: הִשְׁלִיךְ
  choice: എറിഞ്ഞു
  rationale: A direct, current Malayalam equivalent for casting or throwing; the source location ‘from heaven’ already supplies the downward spatial relation.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: വലിയ കല്ലുകൾ
  rationale: Preserves the source's initial generic description before the later identification as hailstones.
- source_word: מִן הַשָּׁמַיִם
  choice: ആകാശത്തുനിന്ന്
  rationale: In this weather-event context, ‘ആകാശം’ is natural Malayalam while retaining the above/heavenly origin stated in the Hebrew.
- source_word: עַד עֲזֵקָה
  choice: അസേക്കവരെ
  rationale: עַד marks spatial extent along the route, naturally expressed with -വരെ.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: ആലിപ്പഴക്കല്ലുകളാൽ
  rationale: Identifies the previously mentioned stones as hailstones and preserves the repeated ‘stone’ element through the compound form.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: This established Malayalam biblical ethnonym preserves the source expression literally enough while remaining intelligible.
- source_word: בֶּחָרֶב
  choice: വാളുകൊണ്ട്
  rationale: Naturally represents the instrumental beth and the singular collective ‘sword.’
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: The Hebrew directly uses the personal divine name; transliteration preserves that distinction without replacing it by a title.
- issue: Nature of the projectiles from heaven
  choice: First ‘വലിയ കല്ലുകൾ,’ later ‘ആലിപ്പഴക്കല്ലുകൾ’
  alternative: Render both references immediately as hailstones
  rationale: The Hebrew first calls them large stones and only later specifies hailstones. The translation preserves this narrative progression.
- issue: Rendering בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: The chosen form reflects the source expression and is conventional, while the alternative is more purely ethnonymic. Neither changes the referent.
translation_notes:
  register: Modern standard Malayalam with a dignified narrative register. Proper names are rendered as ബേത്ത്-ഹോരോൻ and അസേക്ക. The syntax is slightly formal to preserve the sequence and comparison in the Hebrew, but remains accessible to ordinary readers.
