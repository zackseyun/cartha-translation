source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: ml
  text: “എന്റെ അടുക്കൽ കയറിവന്ന് എന്നെ സഹായിക്കൂ; നമുക്ക് ഗിബെയോനെ ആക്രമിക്കാം. കാരണം, അത് യോശുവയോടും ഇസ്രായേൽമക്കളോടും സമാധാനം ചെയ്തിരിക്കുന്നു[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സമാധാന ഉടമ്പടി ചെയ്തിരിക്കുന്നു” അല്ലെങ്കിൽ “സഖ്യം ചെയ്തിരിക്കുന്നു.” ഹീബ്രു ക്രിയ സമാധാനബന്ധത്തിലോ ഉടമ്പടിസമാധാനത്തിലോ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: എന്റെ അടുക്കൽ കയറിവന്ന്
  rationale: עלה എന്ന ബഹുവചന ആജ്ഞയുടെ ഉയരത്തിലേക്കുള്ള ചലനസൂചനയും אֵלַי എന്നതിന്റെ സംസാരിക്കുന്നയാളിലേക്കുള്ള ദിശയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעִזְרֻנִי
  choice: എന്നെ സഹായിക്കൂ
  rationale: עזר എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞയും ഏകവചന പ്രഥമപുരുഷ കർമവും നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנַכֶּה
  choice: നമുക്ക് ... ആക്രമിക്കാം
  rationale: נכה എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ബഹുവചന ഇച്ഛാർഥം മലയാളത്തിലെ നിർദേശാത്മകമായ ‘നമുക്ക് ... ആക്രമിക്കാം’ എന്ന രൂപത്തിൽ നൽകുന്നു; സൈനികസന്ദർഭത്തിൽ ‘ആക്രമിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: אֶת גִּבְעוֹן
  choice: ഗിബെയോനെ
  rationale: നേരിട്ടുള്ള കർമമായ സ്ഥലനാമം മലയാളത്തിലെ കർമവിഭക്തിയോടെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അഭ്യർഥനയ്ക്കും ആക്രമണനിർദേശത്തിനുമുള്ള കാരണത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: הִשְׁלִימָה
  choice: സമാധാനം ചെയ്തിരിക്കുന്നു
  rationale: שלם എന്ന ഹിഫീൽ ക്രിയയുടെ നയതന്ത്രപരമായ അർഥം സംരക്ഷിക്കുന്നു; ഉടമ്പടിയോ സഖ്യമോ എന്ന കൂടുതൽ നിർദിഷ്ട വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: യോശുവയോടും ഇസ്രായേൽമക്കളോടും
  rationale: സമാധാനബന്ധത്തിലെ കക്ഷികളെ ‘-ഓട്’ ഉപയോഗിച്ച് വ്യക്തമാക്കുകയും בני ישראל എന്ന കുടുംബാധിഷ്ഠിത ഹീബ്രു പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בני ישראל എന്ന ദേശീയ-കുടുംബപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപകൽപ്പന സംരക്ഷിക്കുന്നതോടൊപ്പം മലയാള ബൈബിൾഭാഷയിൽ മനസ്സിലാക്കാവുന്ന സ്വാഭാവിക രൂപമാണിത്; ചരിത്രപരമായി ജനതയെ മുഴുവനായി സൂചിപ്പിക്കാമെന്ന കാര്യം നിഷേധിക്കുന്നില്ല.
- issue: הִשְׁלִימָה എന്നതിന്റെ നയതന്ത്രസൂചന
  choice: സമാധാനം ചെയ്തിരിക്കുന്നു
  alternative: സഖ്യം ചെയ്തിരിക്കുന്നു / സമാധാന ഉടമ്പടി ചെയ്തിരിക്കുന്നു
  rationale: മൂലക്രിയയിൽ സമാധാനബന്ധത്തിലേക്കോ ഉടമ്പടിസമാധാനത്തിലേക്കോ പ്രവേശിക്കുന്ന ആശയം ഉണ്ടെങ്കിലും, ‘സഖ്യം’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കാം; അതിനാൽ വിശാലമായ പദം മുഖ്യപാഠത്തിലും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടുള്ള സൈനിക ആഹ്വാനശൈലി. ‘കയറിവന്ന്’ ഭൗമദിശയും സംസാരിക്കുന്നയാളിലേക്കുള്ള വരവും ചേർത്ത് നൽകുന്നു. സ്ഥലനാമങ്ങൾക്ക് ഗിബെയോൻ, യോശുവ എന്നീ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
