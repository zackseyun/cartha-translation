revisions:
- from: അങ്ങനെ യോശുവ ഗിൽഗാലിൽനിന്ന് പുറപ്പെട്ടു കയറി; അവനും അവനോടുകൂടെ യുദ്ധത്തിനുള്ള സകല ജനവും[a] പരാക്രമശാലികളായ സകല യോദ്ധാക്കളും ഉണ്ടായിരുന്നു.
  to: അങ്ങനെ യോശുവ ഗിൽഗാലിൽനിന്ന് കയറിപ്പോയി; അവനും, അവനോടുകൂടെ യുദ്ധസേനയിലെ എല്ലാവരും[a], പരാക്രമശാലികളായ എല്ലാ യോദ്ധാക്കളും.
