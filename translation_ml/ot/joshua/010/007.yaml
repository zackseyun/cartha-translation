  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ ഗിൽഗാലിൽനിന്ന് കയറിപ്പോയി; അവനും, അവനോടുകൂടെ യുദ്ധസേനയിലെ എല്ലാവരും[a], പരാക്രമശാലികളായ എല്ലാ യോദ്ധാക്കളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യുദ്ധത്തിന്റെ സകല ജനവും’; ഇവിടെ യുദ്ധത്തിനായി സജ്ജരായ സൈനികസമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: പുറപ്പെട്ടു കയറി
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ യാത്രയുടെ തുടക്കവും ഉയർന്നിടത്തേക്കുള്ള നീക്കവും സ്വാഭാവികമായി അറിയിക്കാൻ ‘പുറപ്പെട്ടു കയറി’ എന്നു നൽകി.
- source_word: מִן הַגִּלְגָּל
  choice: ഗിൽഗാലിൽനിന്ന്
  rationale: מן എന്ന വിഭക്തിസംബന്ധവും ഗിൽഗാൽ എന്ന സ്ഥലനാമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הוּא
  choice: അവനും
  rationale: മൂലപാഠത്തിലെ സ്വതന്ത്ര സർവനാമം യോശുവ തന്നെ പോയെന്ന ഊന്നൽ നൽകുന്നു; തുടർന്നുള്ള കൂട്ടുപദങ്ങളോടു ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: യുദ്ധത്തിനുള്ള സകല ജനവും
  rationale: അക്ഷരാർഥമായ ‘യുദ്ധത്തിന്റെ സകല ജനവും’ എന്ന ഘടനയുടെ കൂട്ടായ സൈനിക അർഥം സംരക്ഷിക്കുമ്പോൾ, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘യുദ്ധത്തിനുള്ള’ എന്നു നൽകി.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: עם എന്ന പൂർവപ്രത്യയത്തിന്റെയും ഏകവചന പുരുഷസൂചക പ്രത്യയത്തിന്റെയും നേരിട്ടുള്ള, മാന്യമായ മലയാളരൂപം.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: പരാക്രമശാലികളായ സകല യോദ്ധാക്കളും
  rationale: גבורי החיל എന്ന സ്ഥിരപ്രയോഗത്തിലെ ശക്തി, ധൈര്യം, യുദ്ധവൈദഗ്ധ്യം എന്നീ ആശയങ്ങൾ വ്യക്തമാക്കുന്നു; മുൻപുള്ള കൂട്ടായ സൈനികസംഘത്തിൽനിന്ന് ഈ വിശിഷ്ട യോദ്ധാക്കളെ വേർതിരിച്ചും കാണിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘സകല’വും യോശുവയെ ഊന്നുന്ന സ്വതന്ത്ര സർവനാമവും നിലനിർത്തി. ‘യുദ്ധത്തിനുള്ള സകല ജനവും’ എന്ന പൊതുവായ സൈനികസംഘത്തെയും ‘പരാക്രമശാലികളായ സകല യോദ്ധാക്കളും’ എന്ന വിശിഷ്ട വിഭാഗത്തെയും ലയിപ്പിക്കാതെ വേർതിരിച്ചു.
