source:
  edition: WLC
  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിക്കുന്ന സമയത്ത്[a] യോശുവ കല്പിച്ചു. അവർ അവരെ മരങ്ങളിൽനിന്ന് ഇറക്കി, അവർ അവിടെ ഒളിച്ചിരുന്ന ഗുഹയിൽ[b] എറിഞ്ഞു. അവർ ഗുഹാമുഖത്ത് വലിയ കല്ലുകൾ വെച്ചു; അവ ഇന്നുവരെയും അവിടെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സംക്ഷിപ്തമായി: “സൂര്യാസ്തമയത്തിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “അവർ അവിടെ ഒളിച്ചിരുന്ന” എന്ന് ‘അവിടെ’ എന്ന പദം വ്യക്തമായി ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്ന സമയത്ത്
  rationale: സൂര്യൻ ‘അകത്തേക്കു വരുന്നു’ എന്ന എബ്രായ പ്രയോഗം അസ്തമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ സമയവും ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: യോശുവ കല്പിച്ചു
  rationale: കല്പന നൽകുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ ആഖ്യാനരൂപം.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: അവർ അവരെ മരങ്ങളിൽനിന്ന് ഇറക്കി
  rationale: മരങ്ങളിൽ തൂക്കിയിരുന്നവരെ താഴെയിറക്കിയ പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു; ബഹുവചന സൂചനകളും നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁלִכֻם
  choice: എറിഞ്ഞു
  rationale: ‘എറിയുക’ എന്ന ക്രിയയുടെ ശക്തിയും നേരിട്ടുള്ള ആഖ്യാനഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: അവർ അവിടെ ഒളിച്ചിരുന്ന
  rationale: שָׁם എന്ന വ്യക്തമായ ‘അവിടെ’ എന്ന ക്രിയാവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി, മുൻപ് നടന്ന ഒളിച്ചിരിപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל פִּי הַמְּעָרָה
  choice: ഗുഹാമുഖത്ത്
  rationale: ‘ഗുഹയുടെ വായ്’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഗുഹാമുഖം’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: അവ ഇന്നുവരെയും അവിടെയുണ്ട്
  rationale: കല്ലുകൾ വെച്ചതിന്റെ ഫലം ആഖ്യാതാവിന്റെ കാലംവരെ തുടരുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
