translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം ചെറുവാക്യങ്ങളാക്കി സ്വാഭാവികമായി അവതരിപ്പിച്ചു; എന്നാൽ ആവർത്തനസൂചനകളും ‘അവിടെ’ എന്ന ഊന്നലും സംരക്ഷിച്ചു.
