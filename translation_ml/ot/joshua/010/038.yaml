translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ സ്ത്രീലിംഗ സർവനാമം വ്യാകരണപരമായി നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
