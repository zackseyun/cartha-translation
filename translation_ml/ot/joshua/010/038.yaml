  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: ml
  text: പിന്നെ യോശുവയും കൂടെയുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേല്യരും ദെബീറിലേക്കു മടങ്ങിച്ചെന്ന് അതിനെതിരെ യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിച്ചെന്ന്
  rationale: שׁוב എന്ന ക്രിയ ചലനസന്ദർഭത്തിൽ ‘മടങ്ങുക’ എന്നാണ്; ദെബീറിലേക്കുള്ള തുടർന്നുള്ള നീക്കവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: കൂടെയുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേല്യരും
  rationale: കൂട്ടായ അർഥത്തിലുള്ള ‘എല്ലാ ഇസ്രായേലും’ എന്ന പ്രയോഗം ഇവിടെ യോശുവയോടൊപ്പമുള്ള ഇസ്രായേൽ സൈന്യത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: דְּבִרָה
  choice: ദെബീറിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന directional he ദെബീറിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּלָּחֶם
  choice: യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയ ഇവിടെ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്.
- source_word: עָלֶיהָ
  choice: അതിനെതിരെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദെബീർ നഗരത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നഗരത്തെ നിർജീവ ഏകവചനമായി പരാമർശിക്കുന്നത് സ്വാഭാവികമാണ്.
