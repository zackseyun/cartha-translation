id: JOS.10.17
reference: Joshua 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/יהוֹשֻׁ֣עַ לֵ/אמֹ֑ר נִמְצְאוּ֙ חֲמֵ֣שֶׁת הַ/מְּלָכִ֔ים נֶחְבְּאִ֥ים בַּ/מְּעָרָ֖ה בְּ/מַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: ml
  text: 'യോശുവയോട് ഇങ്ങനെ അറിയിച്ചു: “ആ അഞ്ചു രാജാക്കന്മാരെ മക്കേദയിലെ ഗുഹയിൽ ഒളിച്ചിരിക്കുന്നതായി കണ്ടെത്തിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ അഞ്ചു രാജാക്കന്മാരെ മക്കേദയിലെ ഗുഹയിൽ ഒളിഞ്ഞുകിടന്നതായി കണ്ടെത്തിയിരിക്കുന്നു.” എബ്രായ പങ്കാളികരൂപം ‘ഒളിച്ചിരിക്കുന്ന’ എന്ന പ്രവർത്തനമായോ ‘ഒളിഞ്ഞുകിടക്കുന്ന’ എന്ന അവസ്ഥയായോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: നגד എന്ന ക്രിയയുടെ നിഷ്ക്രിയ ആഖ്യാനരൂപം യോശുവയ്ക്ക് ഒരു വിവരം അറിയിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവിനെ ചേർക്കാതെ ‘യോശുവയോട് അറിയിച്ചു’ എന്നു പറയുന്നത് സ്വാഭാവികവും അർത്ഥസത്യവുമാണ്.
- source_word: לִיהוֹשֻׁעַ
  choice: യോശുവയോട്
  rationale: വിവരം ലഭിക്കുന്ന വ്യക്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ദാതൃപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഹീബ്രു സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ അറിയിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: נִמְצְאוּ
  choice: കണ്ടെത്തിയിരിക്കുന്നു
  rationale: מצא എന്നതിന്റെ നിഷ്ക്രിയ ബഹുവചനരൂപം ഇപ്പോൾ ലഭിച്ച കണ്ടെത്തൽവാർത്തയെ സൂചിപ്പിക്കുന്നു; റിപ്പോർട്ടിലെ സമകാലിക പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണക്രിയാരൂപം നിലനിർത്തുന്നു.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: അഞ്ചു രാജാക്കന്മാരെയും
  rationale: മുമ്പ് പരാമർശിച്ച നിർദ്ദിഷ്ട അഞ്ചു രാജാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; കണ്ടെത്തുക എന്ന ക്രിയയോടുള്ള സ്വാഭാവിക മലയാള കർമരൂപം ഉപയോഗിച്ചു.
- source_word: נֶחְבְּאִים
  choice: ഒളിച്ചിരിക്കുന്നതായി
  rationale: חבא എന്നതിന്റെ പങ്കാളികരൂപം ഒളിച്ചിരിക്കുകയെന്ന പ്രവർത്തനമായോ ഒളിപ്പിക്കപ്പെട്ട അവസ്ഥയായോ ഗ്രഹിക്കാം. പ്രധാനപാഠം സ്വാഭാവികമായ പ്രവർത്തനാത്മക വായന നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמְּעָרָה
  choice: ഗുഹയിൽ
  rationale: നിർദ്ദിഷ്ട ഗുഹയെ സ്ഥലസൂചകമായ മലയാളരൂപത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בְּמַקֵּדָה
  choice: മക്കേദയിലെ
  rationale: ഗുഹ മക്കേദ എന്ന സ്ഥലത്താണെന്ന ബന്ധം മലയാളത്തിൽ ‘മക്കേദയിലെ ഗുഹ’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ വ്യക്തമാക്കി.
