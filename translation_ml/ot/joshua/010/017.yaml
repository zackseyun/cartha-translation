  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കർത്താവില്ലാത്ത ‘അറിയിച്ചു’ എന്ന പ്രയോഗം എബ്രായ നിഷ്ക്രിയത്തിന്റെ അനിർദ്ദിഷ്ട റിപ്പോർട്ടറിനെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഉദ്ധരണിക്കുള്ളിലെ റിപ്പോർട്ട് പൂർണ്ണക്രിയാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
