source:
  edition: WLC
  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: ml
  text: അവർ അതിനെ പിടിച്ചടക്കി; വാളിന്റെ വായ്ത്തലയാൽ അതിനെയും അതിന്റെ രാജാവിനെയും അതിന്റെ എല്ലാ പട്ടണങ്ങളെയും അതിലുള്ള എല്ലാവരെയും സംഹരിച്ചു. എഗ്ലോനോടു ചെയ്തതുപോലെതന്നെ അവൻ ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല. അതിനെയും അതിലുള്ള എല്ലാവരെയും അവൻ നാശത്തിനായി സമർപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർണമായി നശിപ്പിച്ചു.” എബ്രായത്തിൽ ‘ഹേരെമിന് വിധേയമാക്കി’ എന്നാണ്; അതായത് നാശത്തിനായി സമർപ്പിച്ചു.
    reason: חרם എന്ന സാങ്കേതിക എബ്രായപദത്തിന്റെ മറ്റൊരു സാധുവായ പരിഭാഷയും അതിന്റെ അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: അവർ അതിനെ പിടിച്ചടക്കി
  rationale: לכד എന്ന പദത്തിന്റെ നഗരം സൈനികമായി കീഴടക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്നതിന്റെ പ്രഹരിക്കൽ എന്ന ആശയവും ‘വാളിന്റെ വായ്’ എന്ന എബ്രായ ശൈലിയുടെ മൂർച്ചയുള്ള വായ്ത്തല എന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: וְאֶת כָּל עָרֶיהָ
  choice: അതിന്റെ എല്ലാ പട്ടണങ്ങളെയും
  rationale: עיר നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ രാജകീയ നഗരത്തോടു ബന്ധപ്പെട്ട ജനവാസകേന്ദ്രങ്ങളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘പട്ടണങ്ങൾ’.
- source_word: וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന ഓരോ മനുഷ്യനെയും
  rationale: נפש ഇവിടെ അഭൗതികമായ ‘ആത്മാവ്’ എന്നതല്ല, മനുഷ്യജീവനെയോ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: അവൻ ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല
  rationale: ശേഷിച്ചവൻ അഥവാ അതിജീവിച്ചവൻ എന്ന שָׂרִיד-ന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; ഏകവചന ക്രിയയുടെ സാധ്യതയുള്ള കർത്താവായ യോശുവയെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיַּחֲרֵם
  choice: അവൻ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്നത് വെറും നശിപ്പിക്കൽ മാത്രമല്ല, നാശത്തിനായി വേർതിരിച്ചുവയ്ക്കുന്ന സാങ്കേതിക ആശയവും വഹിക്കുന്നതിനാൽ അതിന്റെ പ്രത്യേക ഭാരം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുദ്ധവിധിയുടെ പശ്ചാത്തലത്തിലുള്ള חרם എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു
  rationale: മൂലപദത്തിലുള്ള സമർപ്പണം/വേർതിരിക്കൽ, നാശം എന്നീ സംയുക്ത ആശയങ്ങൾ പ്രധാനവാചകത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ബഹുവചന കർത്താവിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം (‘അവർ’/‘അവൻ’) പരിഹരിക്കാതെ അതേപടി സൂക്ഷിച്ചിട്ടുണ്ട്. ആവർത്തിക്കുന്ന ‘ഓരോ മനുഷ്യനെയും’ എന്ന പ്രയോഗവും മൂലവാചകത്തിന്റെ ആവർത്തനത്തിന് അനുസൃതമായി നിലനിർത്തി.
