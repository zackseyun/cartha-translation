  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കാരണബന്ധവും ‘വലിയ’ എന്ന പദത്തിലെ വലുപ്പം/പ്രാധാന്യം സംബന്ധിച്ച അർഥവ്യാപ്തിയും നിലനിർത്തിയിരിക്കുന്നു.
