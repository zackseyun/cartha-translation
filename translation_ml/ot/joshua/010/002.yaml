reference: Joshua 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: ml
  text: അവർ വളരെ ഭയപ്പെട്ടു, കാരണം ഗിബെയോൻ ഒരു വലിയ നഗരവും രാജകീയ നഗരങ്ങളിലൊന്നുപോലെയും ആയിരുന്നു; അത് ഹായിയെക്കാൾ വലിയതും അതിലെ പുരുഷന്മാരെല്ലാം വീരന്മാരും ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിലെ പുരുഷന്മാരെല്ലാം വീരയോദ്ധാക്കളായിരുന്നു.’
    reason: גִּבֹּרִים എന്ന പദത്തിന്റെ കൂടുതൽ വ്യക്തമായ സൈനിക അർഥം പകരുന്ന പരിഭാഷാവികല്പം.
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: അവർ വളരെ ഭയപ്പെട്ടു
  rationale: യרא എന്ന ക്രിയയുടെ ഭയാർഥവും מְאֹד എന്ന തീവ്രതാസൂചകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִיר גְּדוֹלָה
  choice: ഒരു വലിയ നഗരം
  rationale: גָּדוֹל വലുപ്പത്തെയും പ്രാധാന്യത്തെയും സൂചിപ്പിക്കാം; ‘വലിയ’ ഈ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: גִּבְעוֹן
  choice: ഗിബെയോൻ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: രാജകീയ നഗരങ്ങളിലൊന്നുപോലെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘രാജ്യത്തിന്റെ നഗരങ്ങളിലൊന്ന്’ എന്നതിനെക്കാൾ പദവിയും രാജബന്ധവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: അത് ഹായിയെക്കാൾ വലിയതായിരുന്നു
  rationale: ഗിബെയോൻ നഗരത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ‘വലിയ’ എന്നത് വലുപ്പം/പ്രാധാന്യം എന്ന മൂലഭാഷയിലെ സാധ്യത നിലനിർത്തുന്നു.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: അതിലെ പുരുഷന്മാരെല്ലാം
  rationale: സൈനിക പശ്ചാത്തലത്തിൽ אֲנָשִׁים നഗരത്തിലെ പുരുഷ പോരാളികളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ജനങ്ങൾ’ എന്നു മാറ്റുന്നില്ല.
- source_word: גִּבֹּרִים
  choice: വീരന്മാർ
  rationale: ശക്തരും യുദ്ധശൂരരുമായ പുരുഷന്മാർ എന്ന സൈനിക ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
