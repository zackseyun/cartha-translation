id: JOS.10.36
reference: Joshua 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: ml
  text: പിന്നെ യോശുവയും അവനോടുകൂടെ ഇസ്രായേൽ മുഴുവനും എഗ്ലോനിൽനിന്ന് ഹെബ്രോനിലേക്കു കയറിച്ചെന്നു; അവർ അതിനെതിരെ[a] യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവൾക്കെതിരെ’; സ്ത്രീലിംഗ സർവനാമം ഹെബ്രോൻ നഗരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് മറ്റൊരിടത്തേക്കുള്ള ഉയർന്ന ദിശയിലെ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘കയറിച്ചെന്നു’ ദിശാബോധം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: യോശുവയോടൊപ്പമുണ്ടായിരുന്ന ഇസ്രായേൽ ജനസമൂഹത്തെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കുന്ന സമൂഹവാചകത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയം യോശുവയെ സൂചിപ്പിക്കുന്നതിനാൽ മൂലപാഠത്തിന്റെ ബന്ധം വ്യക്തമായി പകരുന്നു.
- source_word: מֵעֶגְלוֹנָה
  choice: എഗ്ലോനിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ൽനിന്ന്’ അതിന്റെ സ്വാഭാവിക തുല്യരൂപമാണ്.
- source_word: חֶבְרוֹנָה
  choice: ഹെബ്രോനിലേക്ക്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ഹെബ്രോനിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘ഹെബ്രോനിലേക്ക്’ അതു വ്യക്തമായി പകരുന്നു.
- source_word: וַיִּלָּחֲמוּ
  choice: അവർ ... യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്നർഥത്തിലാണ്. ബഹുവചന കർത്താവിനെ വ്യക്തമാക്കാൻ ‘അവർ’ ചേർത്തിരിക്കുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനെതിരെ
  rationale: עַל എന്ന പദം ഇവിടെ ശത്രുതാപരമായ ‘എതിരെ’ എന്ന ബന്ധം പ്രകടിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹെബ്രോൻ നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നഗരത്തിന് സ്വാഭാവികമായി ‘അത്’ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘കയറിച്ചെന്നു’ എന്ന പ്രയോഗം ഭൂമിശാസ്ത്രപരമായ ഉയർന്ന ദിശ നിലനിർത്തുന്നു. ദീർഘമായ സംയുക്തകർത്താവിനു ശേഷം ബഹുവചന ക്രിയാകർത്താവിനെ വ്യക്തമാക്കാൻ അർധവിരാമത്തിനു പിന്നാലെ ‘അവർ’ ഉപയോഗിച്ചു.
