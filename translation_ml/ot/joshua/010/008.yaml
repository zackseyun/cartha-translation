id: JOS.10.8
reference: Joshua 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: ml
  text: 'യഹ്‌വേ യോശുവയോടു പറഞ്ഞു: “അവരെ ഭയപ്പെടരുത്; ഞാൻ അവരെ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു. അവരിൽ ഒരുവനും നിന്റെ മുമ്പിൽ നിൽക്കുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: אַל תִּירָא מֵהֶם
  choice: അവരെ ഭയപ്പെടരുത്
  rationale: מן ഇവിടെ ഭയത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവരെ ഭയപ്പെടരുത്’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമം
  rationale: തുടർന്നുള്ള ദൈവിക ഉറപ്പ് കല്പനയുടെ അടിസ്ഥാനമാണ്. ഉദ്ധരണിക്കുള്ളിലെ അർധവിരാമം ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְיָדְךָ
  choice: നിന്റെ കയ്യിൽ
  rationale: ശത്രുക്കളെ ഒരാളുടെ അധികാരത്തിലേല്പിക്കുക എന്ന സൈനിക പ്രയോഗത്തിലെ എബ്രായ ദൃശ്യരൂപം മലയാളത്തിലും വ്യക്തമാണ്.
- source_word: נְתַתִּים
  choice: ഞാൻ അവരെ ... ഏല്പിച്ചിരിക്കുന്നു
  rationale: ദൈവിക തീരുമാനത്തിന്റെ പൂർത്തത്വവും ഇപ്പോഴത്തെ പ്രസക്തിയും പ്രകടിപ്പിക്കാൻ വർത്തമാനപൂർണ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: അവരിൽ ഒരുവനും ... ഉറച്ചുനിൽക്കുകയില്ല
  rationale: אִישׁ ശത്രുസൈന്യത്തിലെ പുരുഷയോദ്ധാക്കളെ വ്യക്തിഗതമായി സൂചിപ്പിക്കുന്നു; ‘ഒരുവനും’ അതിന്റെ പുരുഷലിംഗസൂചനയും സമഗ്രനിഷേധവും നിലനിർത്തുന്നു.
- source_word: בְּפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: മൂലത്തിലെ സ്ഥാനദൃശ്യരൂപം നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ എതിർത്തുനിൽക്കുക എന്ന അർഥം ‘ഉറച്ചുനിൽക്കുക’ എന്ന ക്രിയയോടൊപ്പം വ്യക്തമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം നിലനിർത്തുന്നു.
- issue: אִישׁ എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: ഒരുവൻ
  alternative: ആരും
  rationale: ഇവിടെ പരാമർശിക്കുന്നത് ശത്രുസൈന്യത്തിലെ പുരുഷയോദ്ധാക്കളെയാണ്. അതിനാൽ ലിംഗസൂചന ഇല്ലാതാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഒരുവനും’ ഉപയോഗിക്കുന്നു.
- issue: נְתַתִּים എന്ന പൂർണക്രിയയുടെ കാലഭാവം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: ഭാവിയിലെ യുദ്ധവിജയം ദൈവം ഇതിനകം ഉറപ്പിച്ച യാഥാർഥ്യമായി പ്രഖ്യാപിക്കുന്നു. ഭാവികാലമാക്കി മാറ്റാതെ പൂർണതയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിന്റെ കയ്യിൽ’ എന്നും ‘നിന്റെ മുമ്പിൽ’ എന്നും ഉള്ള എബ്രായ ദൃശ്യപ്രയോഗങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
