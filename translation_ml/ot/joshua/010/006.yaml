base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: ml
  text: 'അപ്പോൾ ഗിബെയോനിലെ പുരുഷന്മാർ ഗിൽഗാലിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ ആളയച്ച് പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരിൽനിന്ന് അങ്ങയുടെ കൈ പിൻവലിക്കരുതേ.[a] വേഗം ഞങ്ങളുടെ അടുക്കൽ കയറിവന്ന് ഞങ്ങളെ രക്ഷിക്കുകയും സഹായിക്കുകയും ചെയ്യണമേ. മലനാട്ടിൽ താമസിക്കുന്ന അമോര്യരുടെ സകല രാജാക്കന്മാരും ഞങ്ങൾക്കെതിരെ ഒത്തുകൂടിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “അങ്ങയുടെ ദാസന്മാരിൽനിന്ന് അങ്ങയുടെ കൈ തളർത്തരുത്.” ഇത് “ഞങ്ങളെ പിന്തുണയ്ക്കുന്നത് നിർത്തരുത്” അഥവാ “ഞങ്ങളെ ഉപേക്ഷിക്കരുത്” എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: ഗിബെയോനിലെ പുരുഷന്മാർ ... ആളയച്ച്
  rationale: ശലഹ് എന്ന ക്രിയയുടെ സന്ദേശവാഹകരെ അയയ്ക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ആളയച്ച്’ എന്നു നൽകി; אַנְשֵׁי എന്ന പുല്ലിംഗപ്രയോഗം ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: ഗിൽഗാലിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ
  rationale: ആവർത്തിക്കുന്ന אֶל സ്വീകർത്താവിനെയും ലക്ഷ്യസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമത്തിൽ രണ്ടും വ്യക്തമായി നൽകി.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരിൽനിന്ന് അങ്ങയുടെ കൈ പിൻവലിക്കരുതേ
  rationale: പിന്തുണയോ പ്രവർത്തനമോ നിർത്തരുത് എന്ന കൈയെ സംബന്ധിച്ച എബ്രായ ശൈലി സുതാര്യവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: ഇവിടെ עבד അടിമത്തത്തിന്റെ നിയമസ്ഥിതിയെ ഊന്നുന്നതല്ല, യോശുവയോടുള്ള വിനയപൂർവമായ രാഷ്ട്രീയ സ്വയംവിശേഷണമാണ്; അതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: വേഗം ഞങ്ങളുടെ അടുക്കൽ കയറിവന്ന്
  rationale: עלה ഭൂഭാഗപരമായ കയറ്റത്തെ സൂചിപ്പിക്കുന്നു; ഗിൽഗാലിൽനിന്ന് മലനാട്ടിലേക്കുള്ള നീക്കത്തിന്റെ സൂക്ഷ്മത ‘കയറിവന്ന്’ നിലനിർത്തുന്നു.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: ഞങ്ങളെ രക്ഷിക്കുകയും സഹായിക്കുകയും ചെയ്യണമേ
  rationale: ישע, עזר എന്നീ രണ്ടു അഭ്യർഥനകളും വേർതിരിച്ച് നിലനിർത്തി; സൈനിക അപകടത്തിൽനിന്നുള്ള വിടുതൽ ‘രക്ഷിക്കുക’ എന്ന സാധാരണ പദത്തിൽ നൽകി.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: ഞങ്ങൾക്കെതിരെ ഒത്തുകൂടിയിരിക്കുന്നു
  rationale: ശത്രുതാപരമായ സന്ദർഭത്തിൽ אֶל എന്നത് വെറും സമീപനം അല്ല, എതിരായുള്ള കൂട്ടിച്ചേരലാണ്; ‘എതിരെ’ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יֹשְׁבֵי הָהָר
  choice: മലനാട്ടിൽ താമസിക്കുന്ന
  rationale: הָהָר ഇവിടെ ഏകമലയെക്കാൾ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മലനാട്’ ആ ഭൂപ്രദേശാർഥം സ്വാഭാവികമായി നൽകുന്നു.
