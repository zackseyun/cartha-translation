translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. യോശുവയോടുള്ള വിനയപൂർവമായ അഭ്യർഥന പ്രകടമാക്കാൻ ‘അങ്ങ്’ രൂപങ്ങളും ‘-ണമേ/രുതേ’ ക്രിയാരൂപങ്ങളും ഉപയോഗിച്ചു; മൂലത്തിലെ കൈ-ശൈലിയും ഭൂപ്രദേശപരമായ കയറ്റവും നിലനിർത്തി.
