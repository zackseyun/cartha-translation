id: JOS.10.3
reference: Joshua 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: ml
  text: 'അതുകൊണ്ട് യെരൂശലേം രാജാവായ അദോനി-സേദെക്ക് ഹെബ്രോൻ രാജാവായ ഹോഹാമിനും യാർമൂത്ത് രാജാവായ പിരാമിനും ലാഖീശ് രാജാവായ യാഫീയയ്ക്കും എഗ്ലോൻ രാജാവായ ദെബീറിനും ഇങ്ങനെ സന്ദേശം അയച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അതിനാൽ ... ആളയച്ച്
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുകയും മുൻവാക്യത്തിലെ സാഹചര്യവുമായി ഫലബന്ധം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. സന്ദേശം അയയ്ക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം ‘ആളയയ്ക്കുക’ എന്നതാണ്.
- source_word: אֲדֹנִי צֶדֶק
  choice: അദോനി-സേദെക്ക്
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു; സംയുക്തനാമത്തിന്റെ ഘടന സൂചിപ്പിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: യെരൂശലേംരാജാവായ
  rationale: ഹീബ്രു സംയുക്തബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള വിശേഷണഘടനയിൽ നൽകി.
- source_word: הוֹהָם
  choice: ഹോഹാം
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരമുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: פִּרְאָם
  choice: പിരാം
  rationale: വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: יַרְמוּת
  choice: യാർമൂത്ത്
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יָפִיעַ
  choice: യാഫീയ
  rationale: വ്യക്തിനാമം ഹീബ്രുവിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: לָכִישׁ
  choice: ലാഖീശ്
  rationale: സ്ഥലനാമം ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: דְּבִיר
  choice: ദെബീർ
  rationale: ഈ സന്ദർഭത്തിൽ ഇത് സാധാരണനാമമല്ല, എഗ്ലോൻരാജാവിന്റെ വ്യക്തിനാമമാണ്; അതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עֶגְלוֹן
  choice: എഗ്ലോൻ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെ പറഞ്ഞു:'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള സന്ദേശത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാക്കന്മാരെ പട്ടികപ്പെടുത്തുമ്പോൾ ആവർത്തനം ഒഴിവാക്കാതെ ഹീബ്രുവിലെ സമാന്തരഘടന നിലനിർത്തി; വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു അടുത്ത വാക്യത്തിൽ വരുന്ന സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു.
