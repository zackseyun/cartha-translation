source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יְהוֹשֻׁ֖עַ פִּתְאֹ֑ם כָּל הַ/לַּ֕יְלָה עָלָ֖ה מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/009.yaml
  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: ml
  text: യോശുവ ഗിൽഗാലിൽനിന്ന് രാത്രി മുഴുവൻ കയറിവന്ന്, പെട്ടെന്ന് അവരുടെ അടുക്കലെത്തി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെട്ടെന്ന് അവരുടെ അടുക്കൽ വന്നു.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘വന്നു’ എന്നാണ്; സൈനികസന്ദർഭത്തിൽ ശത്രുവിന്റെ അടുത്തേക്ക് അപ്രതീക്ഷിതമായി എത്തിച്ചേർന്നത് ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘രാത്രി മുഴുവൻ ഗിൽഗാലിൽനിന്ന് കയറിപ്പോയി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: അവരുടെ അടുത്തെത്തി
  rationale: בוא എന്ന ക്രിയയും אֶל എന്ന ഉപസർഗവും അടിസ്ഥാനപരമായി ‘അവരുടെ അടുക്കലേക്ക് വന്നു/എത്തി’ എന്നാണ്. സൈനികസന്ദർഭം അപ്രതീക്ഷിതമായ സമീപനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘ആക്രമിച്ചു’ എന്ന ആശയം മൂലപാഠത്തിൽക്കാൾ അധികമായി ചേർക്കാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: פִּתְאֹם
  choice: പെട്ടെന്ന്
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതവും ക്ഷണികവുമായ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: כָּל הַלַּיְלָה
  choice: രാത്രി മുഴുവൻ
  rationale: പ്രവർത്തനത്തിന്റെ മുഴുവൻ രാത്രിയിലുമുള്ള ദൈർഘ്യം കൃത്യമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: עָלָה
  choice: കയറി സഞ്ചരിച്ച്
  rationale: עלה എന്നത് അക്ഷരാർഥത്തിൽ ‘കയറിപ്പോയി’ എന്നാണ്; ഇവിടെ ഗിൽഗാലിൽനിന്നുള്ള സൈനികയാത്രയാണ്. ‘കയറി സഞ്ചരിച്ച്’ എന്നത് ഭൂപ്രകൃതിപരമായ ഉയർച്ചയും യാത്രയും നിലനിർത്തുന്നു, എന്നാൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘പടനീക്കം നടത്തി’ എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: מִן הַגִּלְגָּל
  choice: ഗിൽഗാലിൽനിന്ന്
  rationale: പുറപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്ഥലനാമപ്രയോഗം.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
