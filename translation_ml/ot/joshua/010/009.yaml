translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ചാണ്; ‘അവരുടെ അടുത്തെത്തി’ എന്നത് മൂലപാഠത്തിന്റെ ദിശാസൂചന നിലനിർത്തുകയും ആക്രമണം നടന്നുവെന്ന് മുൻകൂട്ടി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
