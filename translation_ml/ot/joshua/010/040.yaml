source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ ദേശം മുഴുവനെയും—മലനാടും നെഗെവും താഴ്‌ന്ന പ്രദേശവും മലഞ്ചരിവുകളും—ആ പ്രദേശങ്ങളിലെ എല്ലാ രാജാക്കന്മാരെയും ആക്രമിച്ചു. അവൻ ഒരു അതിജീവിയെയും ശേഷിപ്പിച്ചില്ല; ശ്വാസമുള്ള സകലത്തിനെയും[a] നാശത്തിനായി സമർപ്പിച്ചു[b]. ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ കൽപ്പിച്ചതുപോലെതന്നെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ശ്വാസമുള്ളതെല്ലാം’ അഥവാ ‘ശ്വസിക്കുന്ന സകലതും.’
    reason: lexical_alternative
  - marker: b
    text: ‘പൂർണമായി നശിപ്പിച്ചു’ എന്നും ‘നാശത്തിനായി നിരുപാധികമായി സമർപ്പിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. മാറ്റാനാവാത്തവിധം നാശത്തിനായി സമർപ്പിക്കുന്നതിനെയാണ് എബ്രായ ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭത്തിലെ ‘പ്രഹരിക്കുക/ആക്രമിക്കുക’ എന്ന ശക്തി നിലനിർത്തുന്നു; ഒറ്റ ക്രിയകൊണ്ട് ഫലം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: כָּל הָאָרֶץ
  choice: ദേശം മുഴുവനെയും
  rationale: ഇവിടെ אֶרֶץ ഭൂമി മുഴുവനെയല്ല, വിവരിക്കപ്പെടുന്ന പ്രാദേശിക ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הָהָר
  choice: മലനാട്
  rationale: യോശുവയിൽ ഇത് സാധാരണയായി ഒരു ഭൂപ്രദേശനാമമായി വരുന്നതിനാൽ ‘മലനാട്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַנֶּגֶב
  choice: നെഗെവ്
  rationale: തെക്കൻ വരണ്ട മേഖലയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമം ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തുന്നു.
- source_word: הַשְּׁפֵלָה
  choice: താഴ്‌ന്ന പ്രദേശം
  rationale: മലനാടിനും തീരപ്രദേശത്തിനും ഇടയിലെ താഴ്‌ന്ന ഭൂപ്രദേശത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: הָאֲשֵׁדוֹת
  choice: മലഞ്ചരിവുകൾ
  rationale: אֲשֵׁדוֹת സൂചിപ്പിക്കുന്ന ചരിവുകളെയോ ഇറക്കങ്ങളെയോ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: അവൻ ആരെയും ശേഷിപ്പിച്ചില്ല
  rationale: യുദ്ധസന്ദർഭത്തിൽ שָׂרִיד എന്നതിന്റെ ‘അതിജീവിച്ചവൻ/ശേഷിച്ചവൻ’ എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַנְּשָׁמָה
  choice: ശ്വാസമുള്ള സകലതിനെയും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ശ്വാസമുള്ളതെല്ലാം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തിയും തീക്ഷ്ണതയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: הֶחֱרִים
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിലെ മാറ്റാനാവാത്ത സമർപ്പണത്തിന്റെയും നശീകരണത്തിന്റെയും മതപര-യുദ്ധപരമായ ഇരട്ടനിറം സംരക്ഷിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: മുൻകൂട്ടിയുള്ള ദൈവകല്പനയോട് കൃത്യമായി അനുസരിച്ചുവെന്ന താരതമ്യബലം പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: חרם എന്ന യുദ്ധഭാഷയുടെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; ശാപാർപ്പിതമാക്കി
  rationale: വെറും സൈനിക നശീകരണമായി ചുരുക്കാതെയും ദുര്‍ഗ്രഹമായ സാങ്കേതികപദം മാത്രം ഉപയോഗിക്കാതെയും, പദത്തിന്റെ മതപരമായി സമർപ്പിക്കപ്പെട്ട നാശം എന്ന സംഘർഷഭരിതമായ അർഥം നിലനിർത്തുന്നു.
- issue: כָּל הַנְּשָׁמָה എന്നതിന്റെ വ്യാപ്തി
  choice: ശ്വാസമുള്ള സകലതിനെയും
  alternative: എല്ലാ മനുഷ്യരെയും; ശ്വസിച്ചതെല്ലാം
  rationale: മൂലപാഠം വ്യക്തികളിലേക്ക് മാത്രം ചുരുക്കാതെ അതിന്റെ യഥാർഥ പ്രയോഗവും കഠിനതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂപ്രദേശങ്ങളുടെ പട്ടിക ഡാഷുകൾക്കുള്ളിൽ നൽകി വാക്യഘടന വ്യക്തമാക്കിയിരിക്കുന്നു. മൂലത്തിലെ കടുപ്പമുള്ള യുദ്ധഭാഷ മൃദൂകരിക്കാതെയും അധിക വ്യാഖ്യാനം ചേർക്കാതെയും നിലനിർത്തിയിരിക്കുന്നു; വിശദീകരണകുറിപ്പുകളുടെ അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
