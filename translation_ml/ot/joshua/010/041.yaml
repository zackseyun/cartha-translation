- from: യോശുവ കാദേശ്-ബർന്നേയമുതൽ ഗസ്സവരെയുള്ളവരെയും[a] ഗിബെയോൻവരെയുള്ള ഗോഷെൻദേശം മുഴുവനെയും ആക്രമിച്ചു.
  to: യോശുവ കാദേശ്-ബർന്നേയമുതൽ ഗസ്സവരെയും, ഗിബെയോൻവരെ ഗോഷെൻദേശം മുഴുവനെയും ഉൾപ്പെടുത്തി, അവരെ പ്രഹരിച്ചു.[a]
  rationale: The correction restores the geographic function of the phrases 'from Kadesh-barnea to Gaza' and 'all the land of Goshen to Gibeon.' 'ഉൾപ്പെടുത്തി' makes explicit in Malayalam that the listed regions delimit the scope, while 'അവരെ' preserves the Hebrew suffix's antecedent from the preceding context. No theological interpretation has been added.
