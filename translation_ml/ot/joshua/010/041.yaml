language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכֵּ֧/ם יְהוֹשֻׁ֛עַ מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ וְ/עַד עַזָּ֑ה וְ/אֵ֛ת כָּל אֶ֥רֶץ גֹּ֖שֶׁן וְ/עַד גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: ml
  text: യോശുവ കാദേശ്-ബർന്നേയമുതൽ ഗസ്സവരെയും, ഗിബെയോൻവരെ ഗോഷെൻദേശം മുഴുവനെയും ഉൾപ്പെടുത്തി, അവരെ പ്രഹരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ തോൽപ്പിച്ചു.” എബ്രായക്രിയ സൈനികമായ പ്രഹരത്തെയോ പരാജയപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കാം; അത് എല്ലായ്പോഴും പ്രവൃത്തിയുടെ കൃത്യമായ രീതിയോ മരണത്തെയോ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലുള്ള ‘പ്രഹരിക്കുക/തോൽപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു; എല്ലാവരെയും കൊന്നുവെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയമുതൽ
  rationale: പടയോട്ടത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ ആരംഭപരിധി സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְעַד עַזָּה
  choice: ഗസ്സവരെയുള്ളവരെയും
  rationale: עַד സൂചിപ്പിക്കുന്ന വ്യാപ്തി ‘വരെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ക്രിയയോടുള്ള ബഹുവചന കർമപ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: ഗോഷെൻദേശം മുഴുവനെയും
  rationale: אֵת അടയാളപ്പെടുത്തുന്ന രണ്ടാമത്തെ നേരിട്ടുള്ള കർമത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: וְעַד גִּבְעוֹן
  choice: ഗിബെയോൻവരെയുള്ള
  rationale: ഭൂപ്രദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി സൂചിപ്പിക്കുന്ന עַד എന്നതിന്റെ അർഥം ‘വരെ’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമിശാസ്ത്രപരമായ രണ്ടു വ്യാപ്തികളും വാക്യത്തിന്റെ രണ്ടു നേരിട്ടുള്ള കർമങ്ങളും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
