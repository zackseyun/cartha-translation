  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: ml
  text: പിന്നെ യോശുവയും അവനോടുകൂടെ എല്ലാ ഇസ്രായേലും മക്കേദയിൽനിന്ന് ലിബ്നയിലേക്കു നീങ്ങി; അവർ ലിബ്നയ്ക്കെതിരെ യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: നീങ്ങി
  rationale: עבר എന്ന ക്രിയയ്ക്ക് കടന്നുപോകുക, മുന്നോട്ടുപോകുക എന്നീ അർഥങ്ങളുണ്ട്. ഒരു നഗരത്തിൽനിന്ന് അടുത്ത നഗരത്തിലേക്കുള്ള സൈനികനീക്കമാണ് ഇവിടെ; ജലാശയമോ അതിർത്തിയോ കടന്നുവെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കാതെ ‘നീങ്ങി’ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: עִם എന്ന പൂർവപ്രത്യയവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും യോശുവയോടുള്ള സഹഗമനം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: מִמַּקֵּדָה
  choice: മക്കേദയിൽനിന്ന്
  rationale: מן എന്ന പൂർവപ്രത്യയം പുറപ്പെടുന്ന സ്ഥലം അടയാളപ്പെടുത്തുന്നു; സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לִבְנָה
  choice: ലിബ്നയിലേക്ക്
  rationale: സഞ്ചാരത്തിന്റെ ലക്ഷ്യസ്ഥാനമാണ് ലിബ്ന; സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּלָּחֶם
  choice: യുദ്ധം ചെയ്തു
  rationale: Niphal രൂപത്തിലുള്ള לחם ഇവിടെ പോരാടുക, യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന സാധാരണ അർഥത്തിലാണ്; ‘യുദ്ധം ചെയ്തു’ ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ച വ്യക്തമായ മലയാളമാണ്.
- source_word: עִם לִבְנָה
  choice: ലിബ്നയ്ക്കെതിരെ
  rationale: עִם സാധാരണയായി ‘കൂടെ’ എന്നാണ് അർഥമെങ്കിലും לחם എന്ന ക്രിയയ്ക്കുശേഷം അത് പോരാട്ടത്തിലെ എതിരാളിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. അതിനാൽ മലയാളത്തിൽ ‘എതിരെ’ എന്നാണ് സ്വാഭാവികം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ മക്കേദ, ലിബ്ന എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. ഹീബ്രു വാക്യത്തിലെ ഏകവചന ക്രിയയ്ക്കുശേഷമുള്ള സംയുക്ത കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും, രണ്ടാം ക്രിയയുടെ കർത്താവ് വ്യക്തതയ്ക്കായി ‘അവർ’ എന്നു നൽകുകയും ചെയ്തു.
