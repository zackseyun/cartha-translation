  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ ക്രമവും പ്രധാന അർഥഘടകങ്ങളും കൃത്യമായി നിലനിൽക്കുന്നു: യോശുവയും അവനോടുകൂടെ എല്ലാ ഇസ്രായേലും മക്കേദയിൽനിന്ന് ലിബ്നയിലേക്കു നീങ്ങി; തുടർന്ന് ലിബ്നയ്ക്കെതിരെ യുദ്ധം ചെയ്തു. וַיַּעֲבֹר എന്നത് ഇവിടെ നദികടത്തൽ നിർബന്ധമാക്കാതെ ‘നീങ്ങി’ എന്നു നൽകിയിരിക്കുന്നത് സന്ദർഭോചിതമാണ്.'
