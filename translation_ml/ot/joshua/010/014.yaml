revisions:
- from: അതിനു മുമ്പോ ശേഷമോ അതുപോലൊരു ദിവസം ഉണ്ടായിട്ടില്ല—ഒരു മനുഷ്യന്റെ ശബ്ദത്തിനു യഹ്‌വെ ചെവികൊടുത്ത ദിവസം[a]. കാരണം യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു.
