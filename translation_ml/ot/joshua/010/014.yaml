  revised_text: യഹ്‌വെ ഒരു മനുഷ്യന്റെ ശബ്ദം കേട്ട ആ ദിവസത്തെപ്പോലെ, ആ ദിവസത്തിനു മുമ്പോ ശേഷമോ മറ്റൊരു ദിവസം ഉണ്ടായിട്ടില്ല; കാരണം യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു.[a]
