  source_fidelity: മൂലത്തിലെ താരതമ്യനിഷേധം, യഹ്‌വെ ഒരു മനുഷ്യന്റെ ശബ്ദം കേട്ടെന്ന അസാധാരണ സാഹചര്യം, ഇസ്രായേലിനുവേണ്ടിയുള്ള യുദ്ധം എന്ന കാരണവാക്യം എന്നിവ കരട് ശരിയായി നൽകുന്നു. എന്നാൽ ‘അതിനു മുമ്പോ ശേഷമോ’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ തുടക്കത്തിൽ വരുമ്പോൾ അതിന്റെ സൂചനാസംബന്ധം അനാവശ്യമായി അസ്പഷ്ടമാകുന്നു.
  naturalness: ‘ഒരു മനുഷ്യന്റെ ശബ്ദത്തിനു യഹ്‌വെ ചെവികൊടുത്ത ദിവസം’ മനസ്സിലാക്കാവുന്നതാണ്; എങ്കിലും ‘ശബ്ദത്തിനു ചെവികൊടുക്കുക’ ഇവിടെ അൽപം കൃത്രിമമാണ്. മൂലത്തിലെ രൂപകം നിലനിർത്തിക്കൊണ്ട് ‘ഒരു മനുഷ്യന്റെ ശബ്ദം യഹ്‌വെ കേട്ട’ എന്നു പറയുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
