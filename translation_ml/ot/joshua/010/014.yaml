reference: Joshua 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: ml
  text: യഹ്‌വെ ഒരു മനുഷ്യന്റെ ശബ്ദം കേട്ട ആ ദിവസത്തെപ്പോലെ, ആ ദിവസത്തിനു മുമ്പോ ശേഷമോ മറ്റൊരു ദിവസം ഉണ്ടായിട്ടില്ല; കാരണം യഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “യഹ്‌വെ ഒരു മനുഷ്യന്റെ അപേക്ഷ ശ്രദ്ധിച്ച ദിവസം.” എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെ ഒരു മനുഷ്യന്റെ ശബ്ദം കേൾക്കാൻ.”'
    reason: ‘ഒരു മനുഷ്യന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ ശൈലി അപേക്ഷ ശ്രദ്ധിച്ചു പ്രതികരിക്കുന്നതിനെ സൂചിപ്പിക്കാം; മുഖ്യവാചകം മൂലത്തിലെ ‘ശബ്ദം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: അതുപോലൊരു ദിവസം ഉണ്ടായിട്ടില്ല
  rationale: നിഷേധാത്മക അസ്തിത്വവാക്യവും כ־ എന്ന താരതമ്യപ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിച്ച് ആ ദിവസത്തിന്റെ സമാനതയില്ലായ്മ നിലനിർത്തുന്നു.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: അതിനു മുമ്പോ ശേഷമോ
  rationale: പ്രത്യയങ്ങൾ ഏറ്റവും സ്വാഭാവികമായി മുമ്പ് പറഞ്ഞ ‘ദിവസം’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അതിനു’ എന്നത് ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: ഒരു മനുഷ്യന്റെ ശബ്ദത്തിനു യഹ്‌വെ ചെവികൊടുത്ത ദിവസം
  rationale: ‘ശബ്ദത്തിനു ചെവികൊടുക്കുക’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ‘ശബ്ദം കേൾക്കുക’ എന്ന ശൈലി സംരക്ഷിക്കുന്നതോടൊപ്പം ഇവിടെ ഉദ്ദേശിക്കുന്ന ശ്രദ്ധിച്ചു പ്രതികരിക്കൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ദൈവം മനുഷ്യനെ അനുസരിച്ചു എന്ന ദൈവശാസ്ത്രപരമായി ഭാരിതമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അസാധാരണമായ സംഭവത്തിന് പിന്നാലെ വരുന്ന വിശദീകരണകാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു
  rationale: നിഫാൽ രൂപത്തിന്റെ പരസ്പര/യുദ്ധപ്രവർത്തന അർഥവും לְ എന്നതിന്റെ അനുകൂലാർഥവും ലളിതവും കൃത്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ നിലനിർത്തുകയും ഇംഗ്ലീഷ് പരിശോധനാപാളിയിലെ ‘Yahweh’ എന്ന തീരുമാനത്തോട് പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- issue: לִשְׁמֹעַ ... בְּקוֹל אִישׁ എന്നതിന്റെ അർഥം
  choice: ഒരു മനുഷ്യന്റെ ശബ്ദത്തിനു യഹ്‌വെ ചെവികൊടുത്തു
  alternative: യഹ്‌വെ ഒരു മനുഷ്യന്റെ അപേക്ഷ അംഗീകരിച്ചു; യഹ്‌വെ ഒരു മനുഷ്യനെ അനുസരിച്ചു
  rationale: ദൈവം യോശുവയുടെ വാക്ക് ശ്രദ്ധിച്ചു പ്രതികരിച്ചു എന്ന അർഥം നൽകുന്നു; എന്നാൽ ‘അനുസരിച്ചു’ എന്നു പറഞ്ഞ് ദൈവം മനുഷ്യനു കീഴടങ്ങിയെന്ന ധ്വനി ചേർക്കുന്നില്ല. അതേസമയം മൂലത്തിലെ ‘ശബ്ദം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സമാനതയില്ലാത്ത ദിവസത്തെ ഊന്നിപ്പറയാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു; കാരണംവാക്യം വേർതിരിച്ച് സാധാരണ വായനക്കാർക്ക് ബന്ധം വ്യക്തമായി നൽകി.
