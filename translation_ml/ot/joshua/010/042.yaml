base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: ml
  text: യോശുവ ഈ രാജാക്കന്മാരെയെല്ലാം അവരുടെ ദേശത്തോടൊപ്പം ഒരൊറ്റ തവണയിൽ[a] പിടിച്ചടക്കി; കാരണം, ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വെ ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരൊറ്റ പടയോട്ടത്തിൽ.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഒരു സമയത്ത്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: പിടിച്ചടക്കി
  rationale: സൈനികസന്ദർഭത്തിലെ ‘പിടിക്കുക, കൈവശപ്പെടുത്തുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ജയിച്ചു’ എന്നതിനെക്കാൾ മൂലക്രിയയുടെ പിടിച്ചെടുക്കൽഭാവം നിലനിർത്തുന്നു.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: ഈ രാജാക്കന്മാരെയെല്ലാം
  rationale: നേരിട്ടുള്ള കർമത്തെയും സൂചകപദത്തെയും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֶת אַרְצָם
  choice: അവരുടെ ദേശത്തോടുകൂടെ
  rationale: אֶרֶץ എന്നതിന്റെ വിശാലമായ ‘ദേശം’ എന്ന അർഥം നൽകുകയും രാജാക്കന്മാരെയും അവരുടെ ദേശത്തെയും ഒരുമിച്ച് പിടിച്ചടക്കിയെന്ന ഘടന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: פַּעַם אֶחָת
  choice: ഒരേ സമയത്ത്
  rationale: അക്ഷരാർഥമായ ‘ഒരു സമയത്ത്’ എന്ന പ്രയോഗം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ ‘ഒരൊറ്റ പടയോട്ടത്തിൽ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: യോശുവയുടെ വിജയത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു ബന്ധഘടനയെ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥഘടനയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തു
  rationale: നിഫാൽ ക്രിയയും לְ ബന്ധവും ചേർന്നുള്ള, ഇസ്രായേലിന്റെ പക്ഷത്ത് യുദ്ധം ചെയ്യുക എന്ന അർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ ഉപയോഗിക്കുന്നു; ‘യാഹ്‌വെ’ മറ്റൊരു ലിപ്യന്തരണസാധ്യതയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ കാരണബന്ധവും സൈനികസന്ദർഭവും നിലനിർത്തിയിരിക്കുന്നു; פַּעַם אֶחָת എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
