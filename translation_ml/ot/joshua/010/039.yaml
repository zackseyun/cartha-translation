  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: ml
  text: അവർ അതിനെയും അതിന്റെ രാജാവിനെയും അതിന്റെ എല്ലാ പട്ടണങ്ങളെയും പിടിച്ചടക്കി. വാളിന്റെ ധാരകൊണ്ട് അവരെ വെട്ടിവീഴ്ത്തി; അതിലുണ്ടായിരുന്ന ഓരോ വ്യക്തിയെയും നാശത്തിനായി സമർപ്പിച്ചു[a]. അവൻ ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല. ഹെബ്രോനോടു ചെയ്തതുപോലെതന്നെ അവൻ ദെബീരിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തു; ലിബ്നയോടും അതിന്റെ രാജാവിനോടും ചെയ്തതുപോലെതന്നെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവരെ സമ്പൂർണനാശത്തിനായി വിട്ടുകൊടുത്തു.” ഇവിടെ എബ്രായത്തിലെ ḥerem എന്ന സാങ്കേതിക പദപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: The note is moved to ‘നാശത്തിനായി സമർപ്പിച്ചു,’ the rendering of וַיַּחֲרִימוּ, and now supplies a legitimate lexical alternative for that term.
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: അവർ അതിനെയും പിടിച്ചടക്കി
  rationale: לכד എന്നത് സൈനികസന്ദർഭത്തിൽ ‘പിടിച്ചടക്കുക’ എന്നാണ്. രൂപം ഏകവചനമായിരുന്നാലും തുടർന്നുള്ള ബഹുവചന ക്രിയകളും യോശുവയുടെ നേതൃത്വത്തിലുള്ള സമൂഹപ്രവർത്തനവും പരിഗണിച്ച് ‘അവർ’ എന്നു നൽകി; നഗരത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ പ്രത്യയം ‘അതിനെ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: അതിന്റെ രാജാവിനെയും അതിന്റെ എല്ലാ പട്ടണങ്ങളെയും
  rationale: עיר എന്നത് ഇവിടെ ദെബീരിനോടു ബന്ധപ്പെട്ട അധീന ജനവാസകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പട്ടണങ്ങൾ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: അവരെ വാളിന്റെ വായ്ത്തലയാൽ വെട്ടിവീഴ്ത്തി
  rationale: לְפִי חֶרֶב എന്ന എബ്രായ പ്രയോഗത്തിലെ ‘വാളിന്റെ വായ്/വായ്ത്തല’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; הכהയുടെ ഹിംസാത്മക സൈനിക അർഥം ‘വെട്ടിവീഴ്ത്തി’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחֲרִימוּ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם സാധാരണ നശിപ്പിക്കൽ മാത്രമല്ല, സമ്പൂർണ നാശത്തിനായി മാറ്റിവയ്ക്കുന്ന സാങ്കേതിക ആശയവും വഹിക്കുന്നു. ‘നാശത്തിനായി സമർപ്പിച്ചു’ ആ പ്രത്യേക ശക്തി നിലനിർത്തുന്നു.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന ഓരോ വ്യക്തിയെയും
  rationale: נפש ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നതല്ല, അവിടെയുണ്ടായിരുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: അവൻ ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല
  rationale: ക്രിയയുടെ എബ്രായ ഏകവചനം നിലനിർത്തി ‘അവൻ’ എന്നു നൽകി; שָׂרִיד എന്നത് ജീവനോടെ ശേഷിച്ചവനെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: ഹെബ്രോനോടു ചെയ്തതുപോലെതന്നെ അവൻ ദെബീരിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തു
  rationale: താരതമ്യസൂത്രവും ഏകവചന കർത്താവും നിലനിർത്തുന്നു; לְ എന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘-ഓടു’ രൂപത്തിൽ നൽകി.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: ലിബ്നയോടും അതിന്റെ രാജാവിനോടും ചെയ്തതുപോലെതന്നെ
  rationale: ദെബീരിന്റെ വിധിയെ ലിബ്നയുടെയും രാജാവിന്റെയും വിധിയുമായി ബന്ധിപ്പിക്കുന്ന അവസാന താരതമ്യം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: חרם യുദ്ധഭാഷയുടെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: സമ്പൂർണമായി നശിപ്പിച്ചു; ശാപാർപ്പിതമാക്കി
  rationale: മതപരവും ന്യായവിധിസംബന്ധവുമായ സാങ്കേതിക ഭാവം നഷ്ടപ്പെടുത്താതെ, പ്രധാനവാചകത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതിരിക്കാൻ ഈ രൂപം സ്വീകരിച്ചു. കൂടുതൽ നേരിട്ടുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള ആഖ്യാനമാറ്റം
  choice: കൂട്ടായ പ്രവർത്തനങ്ങൾക്ക് ‘അവർ’; לֹא הִשְׁאִיר എന്നിടത്തും താരതമ്യവാക്യങ്ങളിലും ‘അവൻ’
  alternative: എല്ലായിടത്തും ‘അവർ’; എല്ലായിടത്തും ‘അവൻ’
  rationale: എബ്രായത്തിലെ സമൂഹം/നേതാവ് എന്ന കർത്തൃമാറ്റം ഏകീകരിക്കാതെ നിലനിർത്തുന്നു; അതിലൂടെ യിസ്രായേലിന്റെ കൂട്ടായ പ്രവർത്തനവും യോശുവയുടെ പ്രതിനിധിനേതൃത്വവും തമ്മിലുള്ള വാചകതീവ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വാളിന്റെ വായ്ത്തല’ എന്ന ഉറവിടദൃശ്യവും ബഹുവചന–ഏകവചന കർത്തൃമാറ്റവും ഉദ്ദേശപൂർവം നിലനിർത്തി. സ്ഥലനാമങ്ങൾ ഹെബ്രോൻ, ദെബീർ, ലിബ്ന എന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകി.
