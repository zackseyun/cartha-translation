revisions:
- from: 'അവർ അതിനെയും[a] അതിന്റെ രാജാവിനെയും അതിന്റെ എല്ലാ പട്ടണങ്ങളെയും പിടിച്ചടക്കി. അവരെ വാളിന്റെ വായ്ത്തലയാൽ വെട്ടിവീഴ്ത്തി; അതിലുണ്ടായിരുന്ന ഓരോ വ്യക്തിയെയും നാശത്തിനായി സമർപ്പിച്ചു. അവൻ ഒരാളെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല. ഹെബ്രോനോടു ചെയ്തതുപോലെതന്നെ അവൻ ദെബീരിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തു; ലിബ്നയോടും അതിന്റെ രാജാവിനോടും ചെയ്തതുപോലെതന്നെ.


    [a] അഥവാ, “അവർ അതിനെ സമ്പൂർണമായി നശിപ്പിച്ചു.” ഇവിടെ എബ്രായപദം നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ḥērem ഭാഷയാണ് ഉപയോഗിക്കുന്നത്.'
