source:
  edition: WLC
  text: וַ/יָּ֤שָׁב יְהוֹשֻׁ֨עַ֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּֽלָ/ה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/043.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: ml
  text: പിന്നെ യോശുവയും അവനോടുകൂടെ യിസ്രായേൽ മുഴുവനും ഗിൽഗാലിലെ[a] പാളയത്തിലേക്കു മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പാളയത്തിലേക്ക്, ഗിൽഗാലിലേക്ക്.’ ‘ഗിൽഗാൽ’ എന്ന സ്ഥലനാമത്തിന്റെ എബ്രായരൂപത്തിൽ ദിശ സൂചിപ്പിക്കുന്ന ഒരു അന്ത്യപ്രത്യയം ചേർത്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങി
  rationale: שׁוב എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനരൂപം ഇവിടെ മുൻസ്ഥാനത്തേക്കുള്ള മടക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങി’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപം നിലനിർത്തുന്നു.
- source_word: וְכָל יִשְׂרָאֵל
  choice: യിസ്രായേൽ മുഴുവനും
  rationale: മൂലത്തിലെ ‘എല്ലാ യിസ്രായേലും’ എന്ന സമൂഹവാചക അർഥം നിലനിർത്തുന്നു; അതിനെ ‘എല്ലാ യിസ്രായേല്യരും’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: കൂടെ സഞ്ചരിച്ചതിനെ സൂചിപ്പിക്കുന്ന עִם എന്ന പൂർവപ്രത്യയവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും നേരിട്ട് പകരുന്നു.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്കു
  rationale: אֶל ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; מַחֲנֶה ഈ സൈനികസന്ദർഭത്തിൽ ‘പാളയം’ എന്നാണ് സ്വാഭാവികം.
- source_word: הַגִּלְגָּלָה
  choice: ഗിൽഗാലിലെ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה ഗിൽഗാലിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗിൽഗാലിലെ പാളയത്തിലേക്ക്’ എന്ന രൂപം ലക്ഷ്യവും പാളയത്തിന്റെ സ്ഥാനവും സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ രൂപപരമായ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
