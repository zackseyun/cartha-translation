translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘യിസ്രായേൽ മുഴുവനും’ എന്നത് മൂലത്തിലെ സമൂഹവാചകത്വം നിലനിർത്തുന്നു. ദിശാസൂചക അന്ത്യപ്രത്യയത്തിന്റെ സൂക്ഷ്മത പ്രധാനവാക്യത്തിൽ സ്വാഭാവിക മലയാളത്തിലൂടെയും അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥമായ രൂപത്തിലൂടെയും അവതരിപ്പിച്ചു.
