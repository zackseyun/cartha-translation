translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പട്ടികയിലെ ആവർത്തിതമായ ‘രാജാവ്’ എന്ന ഘടകം മൂലപാഠത്തിന്റെ ഘടന അനുസരിച്ച് നിലനിർത്തി. വിശദീകരണാത്മക കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
