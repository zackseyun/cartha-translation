reference: Joshua 10:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עֲשׂוּ כֵ֔ן וַ/יֹּצִ֣יאוּ אֵלָ֗י/ו אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָ֑ה אֵ֣ת מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶת מֶ֤לֶךְ חֶבְרוֹן֙ אֶת מֶ֣לֶךְ יַרְמ֔וּת אֶת מֶ֥לֶךְ לָכִ֖ישׁ אֶת מֶ֥לֶךְ עֶגְלֽוֹן־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: ml
  text: 'അവർ അങ്ങനെ ചെയ്തു; ഗുഹയിൽനിന്ന് ഈ അഞ്ചു രാജാക്കന്മാരെ അവന്റെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവന്നു: യെരൂശലേമിലെ രാജാവിനെ, ഹെബ്രോനിലെ രാജാവിനെ, യർമ്മൂത്തിലെ രാജാവിനെ, ലാഖീശിലെ രാജാവിനെ, എഗ്ലോനിലെ രാജാവിനെ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അവർ അങ്ങനെ ചെയ്തു
  rationale: മുൻ കല്പന അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֹּצִיאוּ
  choice: കൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ കാരകപ്രയോഗം ‘പുറത്തുകൊണ്ടുവരുക’ എന്നാണ്; തുടർന്നുള്ള ‘ഗുഹയിൽനിന്ന്’ എന്ന പ്രയോഗത്തോടൊപ്പം ‘കൊണ്ടുവന്നു’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവന്റെ അടുക്കൽ
  rationale: אל എന്ന പൂർവപ്രത്യയത്തിന്റെ ദിശാസൂചക അർഥം നിലനിർത്തുന്നു; സൂചിതനായ വ്യക്തി യോശുവയാണെങ്കിലും മൂലപാഠം ഇവിടെ പേര് ആവർത്തിക്കാത്തതിനാൽ സർവനാമം തന്നെ സൂക്ഷിക്കുന്നു.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ആ അഞ്ചു രാജാക്കന്മാരെ
  rationale: സംഭാഷണസന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക നിർദേശകപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: מִן הַמְּעָרָה
  choice: ഗുഹയിൽനിന്ന്
  rationale: അകത്തുനിന്നുള്ള നീക്കത്തെ ലളിതമായ സ്ഥലസൂചകപ്രയോഗത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: രാജാധികാരിയെ സൂചിപ്പിക്കുന്ന എബ്രായ നാമത്തിന്റെ കൃത്യവും പതിവുമായ മലയാളസമം.
- source_word: יְרוּשָׁלִַם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം.
- source_word: יַרְמוּת
  choice: യർമ്മൂത്ത്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: לָכִישׁ
  choice: ലാഖീശ്
  rationale: എബ്രായ ദീർഘസ്വരവും വ്യഞ്ജനരൂപവും പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עֶגְלוֹן
  choice: എഗ്ലോൻ
  rationale: ഇവിടെ നഗരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സ്ഥലനാമത്തിന്റെ വ്യക്തമായ മലയാള ലിപ്യന്തരണം.
