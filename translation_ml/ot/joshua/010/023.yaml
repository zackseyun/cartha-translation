revisions:
- from: 'അവർ അങ്ങനെ ചെയ്തു. ആ അഞ്ചു രാജാക്കന്മാരെ ഗുഹയിൽനിന്ന് അവന്റെ അടുക്കൽ കൊണ്ടുവന്നു: യെരൂശലേംരാജാവ്, ഹെബ്രോൻരാജാവ്, യർമ്മൂത്ത്‌രാജാവ്, ലാഖീശ്‌രാജാവ്, എഗ്ലോൻരാജാവ്.'
  to: 'അവർ അങ്ങനെ ചെയ്തു; ഗുഹയിൽനിന്ന് ഈ അഞ്ചു രാജാക്കന്മാരെ അവന്റെ അടുക്കലേക്കു പുറത്തുകൊണ്ടുവന്നു: യെരൂശലേമിലെ രാജാവിനെ, ഹെബ്രോനിലെ രാജാവിനെ, യർമ്മൂത്തിലെ രാജാവിനെ, ലാഖീശിലെ രാജാവിനെ, എഗ്ലോനിലെ രാജാവിനെ.'
  rationale: The revision explicitly renders the extraction sense of the Hebrew causative verb and recasts the city-king designations into natural Malayalam appositional accusative phrases. It retains the source’s pronoun rather than supplying Joshua’s name and preserves every city and king in the stated order.
