id: JOS.10.34
reference: Joshua 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: ml
  text: പിന്നെ യോശുവയും അവനോടുകൂടെ എല്ലാ ഇസ്രായേലും ലാഖീശിൽനിന്ന് എഗ്ലോനിലേക്കു നീങ്ങി. അവർ അതിനെതിരെ പാളയമിറങ്ങി അതിനെതിരെ യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: നീങ്ങി
  rationale: עבר എന്ന ക്രിയ ഇവിടെ ഒരു അതിർത്തിയോ ജലാശയമോ കടക്കുന്നതിനെക്കാൾ, സൈനികയാത്രയിൽ ഒരു നഗരത്തിൽനിന്ന് മറ്റൊന്നിലേക്കുള്ള മുന്നേറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ 'നീങ്ങി' തെരഞ്ഞെടുത്തു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: യോശുവയോടൊപ്പം ഇസ്രായേൽ മുഴുവനും ഉണ്ടായിരുന്നുവെന്ന സഹവർത്തിത്വബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִלָּכִישׁ
  choice: ലാഖീശിൽനിന്ന്
  rationale: സൈനികനീക്കത്തിന്റെ പുറപ്പെടൽസ്ഥലം സൂചിപ്പിക്കുന്ന מִן ഉപസർഗം വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֶגְלֹנָה
  choice: എഗ്ലോനിലേക്ക്
  rationale: പദാന്ത്യത്തിലെ ദിശാസൂചക ה എഗ്ലോനിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നതിനാൽ '-ലേക്ക്' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיַּחֲנוּ
  choice: അവർ പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനെതിരെ
  rationale: ഉപരോധസന്ദർഭത്തിൽ על വെറും സമീപസ്ഥാനം മാത്രമല്ല, നഗരത്തിനെതിരായ ശത്രുതാപരമായ നിലയുറപ്പാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּלָּחֲמוּ
  choice: യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയുടെ നിഫാൽ രൂപം യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: עָלֶיהָ
  choice: അതിനോടു
  rationale: യുദ്ധക്രിയയുടെ ലക്ഷ്യം നഗരം തന്നെയാണെന്നത് നിലനിർത്തുന്നു; മുൻപത്തെ 'അതിനെതിരെ' എന്ന ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് മൂലത്തിലെ ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וְכָל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലും
  rationale: യോശുവയോടൊപ്പമുള്ള ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സമഷ്ടിപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
