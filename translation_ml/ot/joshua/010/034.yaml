  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണം. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ 'പാളയമിറങ്ങി' ഉപയോഗിച്ചു; മൂലത്തിലെ ക്രമവും കൂട്ടായ കർത്താവും സംരക്ഷിച്ചു.
