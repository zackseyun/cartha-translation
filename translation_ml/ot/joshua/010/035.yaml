revisions:
- from: അന്ന് അവർ ആ പട്ടണം പിടിച്ചടക്കി, വാളിന്റെ വായ്ത്തലയാൽ അതിനെ സംഹരിച്ചു[a]. അതിലുണ്ടായിരുന്ന ഓരോ മനുഷ്യനെയും അന്നുതന്നെ അവൻ നാശത്തിനായി സമർപ്പിച്ചു[b]; ലാഖീശിനോടു ചെയ്തതുപോലെതന്നെ അവൻ ഇതിനോടും ചെയ്തു.
  to: അന്നു അവർ ആ പട്ടണം പിടിച്ചടക്കി, വാളിന്റെ വായ്ത്തലയാൽ അതിനെ സംഹരിച്ചു[a]. അതിലുള്ള എല്ലാവരെയും അവൻ അന്നുതന്നെ നാശത്തിനായി സമർപ്പിച്ചു[b]; ലാഖീശിനോടു അവൻ ചെയ്തതെല്ലാംപോലെ.
