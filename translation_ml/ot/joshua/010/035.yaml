  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: ml
  text: അന്നു അവർ ആ പട്ടണം പിടിച്ചടക്കി, വാളിന്റെ വായ്ത്തലയാൽ അതിനെ സംഹരിച്ചു[a]. അതിലുള്ള എല്ലാവരെയും അവൻ അന്നുതന്നെ നാശത്തിനായി സമർപ്പിച്ചു[b]; ലാഖീശിനോടു അവൻ ചെയ്തതെല്ലാംപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘വാളിന്റെ വായാൽ’; വാളിന്റെ മൂർച്ചയുള്ള വായ്ത്തലകൊണ്ട് സംഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘പൂർണമായി നശിപ്പിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രു ക്രിയ നിരോധനവിധിയുടെ കീഴിൽ നാശത്തിനായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: അവർ ആ പട്ടണം പിടിച്ചടക്കി
  rationale: לכד എന്ന ക്രിയ യുദ്ധസന്ദർഭത്തിൽ ഒരു പട്ടണം കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻസന്ദർഭത്തിലെ പട്ടണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘ആ പട്ടണം’ എന്നു വ്യക്തമാക്കി.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന് / അന്നുതന്നെ
  rationale: ഒരേ ദിവസത്തിനുള്ളിൽ നടന്ന പ്രവൃത്തികളെന്ന ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള കാലപ്രയോഗം.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ അതിനെ സംഹരിച്ചു
  rationale: לְפִי חֶרֶב എന്നത് അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന ഹീബ്രു രൂപകമാണ്. ‘വായ്ത്തല’ വാളിന്റെ മൂർച്ചയുള്ള ഭാഗത്തെ സൂചിപ്പിച്ച് ആ ദൃശ്യം നിലനിർത്തുന്നു; הכהയുടെ സന്ദർഭാർഥം ‘സംഹരിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: അതിലുണ്ടായിരുന്ന ഓരോ മനുഷ്യനെയും
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ അല്ല, പട്ടണത്തിലുള്ള ജീവിച്ചിരുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഓരോ മനുഷ്യനെയും’ വ്യക്തവും ദൈവശാസ്ത്രപരമായി തെറ്റിദ്ധരിപ്പിക്കാത്തതുമാണ്.
- source_word: הֶחֱרִים
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന ഹിഫീൽ ക്രിയ സാധാരണ നശിപ്പിക്കൽ മാത്രമല്ല, നിരോധനവിധിയുടെ കീഴിൽ നാശത്തിനായി വേർതിരിക്കുന്ന സാങ്കേതിക ആശയവും വഹിക്കുന്നു. ഈ പരിഭാഷ ആ പ്രത്യേക ബലം നിലനിർത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: ലാഖീശിനോടു ചെയ്തതുപോലെതന്നെ അവൻ ഇതിനോടും ചെയ്തു
  rationale: כְּכֹל എന്നതിലെ പൂർണമായ താരതമ്യബലം ‘ചെയ്തതുപോലെതന്നെ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; עָשָׂהയുടെ മൂന്നാം പുരുഷ ഏകവചനരൂപം ‘അവൻ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിജയയുദ്ധസന്ദർഭത്തിലെ חרם/החרים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; നിരോധനവിധിക്കു കീഴിലാക്കി
  rationale: ഹീബ്രു ക്രിയയിൽ നശിപ്പിക്കൽ മാത്രമല്ല, നാശത്തിനായി പ്രത്യേകമായി വേർതിരിക്കുക എന്ന യുദ്ധ-ആരാധനാപരമായ സാങ്കേതിക ധ്വനിയുമുണ്ട്. മുഖ്യപാഠം അതു നിലനിർത്തുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യമായ പരിഭാഷ അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മനുഷ്യസമൂഹസംബന്ധമായ അർഥം
  choice: ഓരോ മനുഷ്യനും
  alternative: ഓരോ ജീവനും; ഓരോ ആത്മാവും
  rationale: ഇവിടെ പദം പട്ടണത്തിലെ വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ മൂലപാഠം ഉദ്ദേശിക്കാത്ത മനുഷ്യസ്വഭാവസംബന്ധമായ ദൈവശാസ്ത്രവാദം സൂചിപ്പിച്ചേക്കാം.
- issue: הֶחֱרִים, עָשָׂה എന്നീ ഏകവചന ക്രിയകളുടെ കർത്താവ്
  choice: അവൻ
  alternative: അവർ
  rationale: പട്ടണം പിടിക്കുകയും ആക്രമിക്കുകയും ചെയ്തവരെ ആദ്യത്തെ ബഹുവചന ക്രിയകൾ സൂചിപ്പിക്കുമ്പോൾ, തുടർന്ന് വരുന്ന הֶחֱרִים, עָשָׂה എന്നിവ മൂന്നാം പുരുഷ പുല്ലിംഗ ഏകവചനമാണ്. സന്ദർഭത്തിൽ അത് യോശുവയെ സൂചിപ്പിക്കുന്നു; വ്യാകരണപരമായ ഈ മാറ്റം പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള കർത്തൃമാറ്റം സൂക്ഷിച്ചിരിക്കുന്നു. ‘വാളിന്റെ വായ്ത്തല’ മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തുമ്പോൾ, ‘നാശത്തിനായി സമർപ്പിച്ചു’ חרם എന്ന സാങ്കേതിക പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ലഘൂകരിക്കാതെ അവതരിപ്പിക്കുന്നു.
