id: JOS.10.22
reference: Joshua 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ פִּתְח֖וּ אֶת פִּ֣י הַ/מְּעָרָ֑ה וְ/הוֹצִ֣יאוּ אֵלַ֗/י אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ പറഞ്ഞു: “ഗുഹാമുഖം തുറന്ന് ആ അഞ്ച് രാജാക്കന്മാരെയും ഗുഹയിൽനിന്ന് എന്റെ അടുക്കൽ കൊണ്ടുവരുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിന് ‘അപ്പോൾ’ യോജിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: פִּתְחוּ
  choice: തുറന്ന്
  rationale: ബഹുവചന ആജ്ഞാരൂപമായ ‘തുറക്കുക’ എന്ന ആശയം, പിന്നാലെയുള്ള സമനില ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: פִּי הַמְּעָרָה
  choice: ഗുഹാമുഖം
  rationale: അക്ഷരാർഥത്തിലെ ‘ഗുഹയുടെ വായ്’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: וְהוֹצִיאוּ
  choice: കൊണ്ടുവരുക
  rationale: ഹിഫീൽ ആജ്ഞയിലെ അകത്തുനിന്ന് പുറത്തേക്കു വരുത്തുന്ന കാരണാർഥം സന്ദർഭത്തിലെ ‘ഗുഹയിൽനിന്ന്’ എന്ന പ്രയോഗത്തോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: യോശുവയിലേക്കുള്ള ദിശയും സമീപനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ആ അഞ്ച് രാജാക്കന്മാരെയും
  rationale: ഇതിനകം തിരിച്ചറിയപ്പെട്ട പ്രത്യേക രാജാക്കന്മാരെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘ആ’ സ്വാഭാവികമാണ്; ഹീബ്രു നിർദ്ദേശകത്തിന്റെ സന്ദർഭപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִן הַמְּעָרָה
  choice: ഗുഹയിൽനിന്ന്
  rationale: പുറത്തേക്കുള്ള നീക്കത്തിന്റെ ഉറവിടസ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഗുഹാമുഖം’ ഹീബ്രു ദൃശ്യരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. നിർദ്ദേശകമായ הָאֵלֶּה സന്ദർഭത്തിൽ ‘ആ’ എന്ന് നൽകിയെങ്കിലും ‘ഈ’ എന്നും പരിഭാഷപ്പെടുത്താം; വാക്യത്തിന്റെ അർഥത്തിൽ നിർണായക വ്യത്യാസമില്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
