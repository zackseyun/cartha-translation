  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: ml
  text: അപ്പോൾ യോശുവയും അദ്ദേഹത്തോടൊപ്പമുള്ള എല്ലാ യിസ്രായേലും ഗിൽഗാലിലെ പാളയത്തിലേക്കു മടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോശുവ ഗിൽഗാലിലേക്കു മടങ്ങിയെന്ന സമാന പ്രസ്താവന 10:43-ലും കാണുന്നു. അതിനാൽ ചില വ്യാഖ്യാതാക്കൾ ഈ വാക്യം മുൻകൂട്ടിയുള്ള സൂചനയായോ സ്ഥാനം മാറിയ പാഠമായോ കാണുന്നു; എന്നാൽ ഇവിടെയുള്ള ഹീബ്രു പാഠം ഉള്ളതുപോലെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: അപ്പോൾ ... മടങ്ങി
  rationale: שׁוב എന്ന ക്രിയയുടെ wayyiqtol രൂപം തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മുൻസ്ഥാനത്തേക്കുള്ള മടക്കത്തിന് ‘മടങ്ങി’ സ്വാഭാവികമാണ്; ‘അപ്പോൾ’ ആഖ്യാനത്തിന്റെ പുരോഗതി വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: וְכָל יִשְׂרָאֵל
  choice: കൂടെയുള്ള എല്ലാ യിസ്രായേലും
  rationale: ഹീബ്രുവിലെ ‘അവനോടുകൂടെ’ എന്ന ഘടകത്തെയും ‘എല്ലാ യിസ്രായേൽ’ എന്ന സമൂഹവാചകത്തെയും സ്വാഭാവിക മലയാളക്രമത്തിൽ ചേർക്കുന്നു; ഇത് സൈന്യത്തെയോ ജനസമൂഹത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: കൂടെയുള്ള
  rationale: ‘അവനോടുകൂടെ’ എന്ന അർഥം യോശുവയോടൊപ്പമുണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל הַמַּחֲנֶה
  choice: പാളയത്തിലേക്കു
  rationale: מַחֲנֶה ഇവിടെ സൈനിക പാളയത്തെ സൂചിപ്പിക്കുന്നു; אֶל ദിശയിലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
- source_word: הַגִּלְגָּלָה
  choice: ഗിൽഗാലിലെ
  rationale: സ്ഥലനാമത്തിലെ ദിശാസൂചക പ്രത്യയം ഗിൽഗാലിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘ഗിൽഗാലിലെ പാളയത്തിലേക്കു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് കൃത്യവുമാണ്.
theological_decisions:
- issue: യോശുവ 10:43-ലെ സമാനമായ മടക്കവിവരണവുമായി ബന്ധപ്പെട്ട ആഖ്യാനസ്ഥാനം
  choice: മസോരറ്റിക് ഹീബ്രു പാഠത്തിലുള്ള വാക്യം അതേപടി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: 10:43-ലെ സമാന പ്രസ്താവന കാരണം ഈ വാക്യം മുൻകൂട്ടിയുള്ള സൂചനയോ സ്ഥാനം മാറിയ പാഠമോ ആണെന്ന് ചിലർ കാണുന്നു.
  rationale: ഇത് ഒരു ഉപദേശപരമായ പ്രശ്നമല്ല; സാഹിത്യപരവും പാഠവിമർശനപരവുമായ ചർച്ചയാണ്. മുഖ്യപാഠം വ്യാഖ്യാനത്തിലൂടെ ഒത്തുചേർക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്യാതെ ലഭ്യമായ ഹീബ്രു പാഠത്തെ പ്രതിനിധീകരിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാളയം’ സൈനിക പശ്ചാത്തലം സ്വാഭാവികമായി നൽകുന്നു. സമൂഹവാചകമായ ‘യിസ്രായേൽ’ നിലനിർത്തിയതിനാൽ അത് സൈന്യത്തെയാണോ മുഴുവൻ ഉടമ്പടിജനത്തെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന മൂലപാഠത്തിലെ വ്യാപ്തി നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
