translation:
  language: ml
  text: ഹോർമയിലെ രാജാവ്, ഒന്ന്; അരാദിലെ രാജാവ്, ഒന്ന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ സ്ഥലത്തെയും ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന സംയുക്തരൂപം. മലയാളത്തിൽ സ്ഥലനാമത്തോടൊപ്പം ‘-യിലെ’ ചേർത്ത് സ്വാഭാവികമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: חָרְמָה
  choice: ഹോർമ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֶחָד
  choice: ഒന്ന്
  rationale: തോൽപ്പിക്കപ്പെട്ട ഓരോ രാജാവിനെയും എണ്ണുന്ന, ആവർത്തനാത്മക പട്ടികയിലെ സംക്ഷിപ്ത സംഖ്യാരൂപം. എബ്രായ ഘടനയും താളവും നിലനിർത്താൻ ‘ഒരു രാജാവ്’ എന്നതിനു പകരം ‘ഒന്ന്’ ഉപയോഗിച്ചു.
- source_word: עֲרָד
  choice: അരാദ്
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് അടുത്തവിധം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
