translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ പട്ടികാസ്വഭാവം ‘-വും’ വഴി നിലനിർത്തി. ദീർഘമായ വിശേഷണശൃംഖല വായനാസൗകര്യത്തിനായി ഡാഷും അർധവിരാമവും ഉപയോഗിച്ച് വിഭജിച്ചു; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
