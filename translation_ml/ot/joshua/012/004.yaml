  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: ml
  text: ബാശാനിലെ രാജാവായ ഓഗിന്റെ പ്രദേശവും—രെഫായീം[a] ജനത്തിൽ ശേഷിച്ചവരിൽ ഒരുവനായ അവൻ അസ്താരോത്തിലും എദ്രെയിലും താമസിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭീമന്മാർ.” രെഫായീം എന്ന എബ്രായപദം അസാധാരണമായ ഉയരമുള്ളവരായി ഓർമിക്കപ്പെട്ടിരുന്ന ഒരു പുരാതന ജനവിഭാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: പ്രദേശവും
  rationale: ഇവിടെ גְּבוּל ഒരു അതിർത്തിരേഖയെക്കാൾ ഓഗിന്റെ അധീനപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യാദിയിലെ ו മുൻവാക്യത്തിലെ പട്ടിക തുടരുന്നതിനാൽ ‘-വും’ എന്നു നൽകി.
- source_word: ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: ബാശാൻരാജാവായ ഓഗ്
  rationale: രാജാവിനെയും അവന്റെ ഭരണപ്രദേശത്തെയും തിരിച്ചറിയിക്കുന്ന ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി; വ്യക്തിനാമവും സ്ഥലനാമവും ലിപ്യന്തരിച്ചു.
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: രെഫായീമിൽ ശേഷിച്ചവരിൽ ഒരുവൻ
  rationale: יֶתֶר ശേഷിച്ച ഭാഗത്തെയോ ശേഷിച്ചവരെയോ സൂചിപ്പിക്കുന്നു. מִן ഇവിടെ ആ കൂട്ടത്തിൽപ്പെട്ടവൻ എന്ന ആശയം നൽകുന്നു; ഓഗ് രെഫായീമിൽ ശേഷിച്ച ഒരാളായിരുന്നുവെന്ന അർഥം വ്യക്തമായി നിലനിർത്തി.
- source_word: הָ/רְפָאִ֑ים
  choice: രെഫായീം
  rationale: ‘ഭീമന്മാർ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി ലിപ്യന്തരിച്ചു; വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: താമസിച്ചിരുന്നു
  rationale: ഏകവചനത്തിലുള്ള കർത്തൃവാചക ക്രിയാവിശേഷണം ഓഗിനെയാണ് സൂചിപ്പിക്കുന്നത്. ישב എന്നതിന്റെ ഇവിടെ യോജിച്ച അർഥം താമസിക്കുക എന്നതാണ്.
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: അസ്താരോത്തിലും എദ്രെയിലും
  rationale: രണ്ട് സ്ഥലനാമങ്ങളും ലിപ്യന്തരിച്ചു; ഓരോന്നിനോടുമുള്ള בְ-യുടെ സ്ഥലസൂചനയും ו-യുടെ സംയോജനവും മലയാളത്തിലെ ‘-ഇലും ... -ഇലും’ ഘടനയിൽ പ്രതിഫലിപ്പിച്ചു.
