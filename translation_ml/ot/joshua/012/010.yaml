  text: the king of Jerusalem[a], one; the king of Hebron, one.
translation:
  language: ml
  text: യെരൂശലേമിലെ രാജാവ്—ഒരാൾ[a]; ഹെബ്രോനിലെ രാജാവ്—ഒരാൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “യെരൂശലേമിലെ ഒരു രാജാവ്; ഹെബ്രോനിലെ ഒരു രാജാവ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ നഗരരാജ്യത്തിന്റെയും ഭരണാധികാരിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. സ്ഥലനാമത്തോടൊപ്പം ‘-യിലെ രാജാവ്’ എന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: יְרוּשָׁלִַם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: אֶחָד
  choice: ഒരാൾ
  rationale: ഇവിടെ പദം തോൽപ്പിക്കപ്പെട്ട രാജാക്കന്മാരുടെ എണ്ണമാണ് രേഖപ്പെടുത്തുന്നത്. വ്യക്തിയെ എണ്ണുന്നതിനുള്ള സ്വാഭാവിക മലയാളരൂപമായ ‘ഒരാൾ’ ഹീബ്രുവിലെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തുന്നു.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: സംക്ഷിപ്തമായ ഹീബ്രു കണക്കുപട്ടികയുടെ ഘടനയും ആവർത്തനവും നിലനിർത്തിക്കൊണ്ട്, ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ഭാഷ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ആദ്യത്തെ പൂർണ പട്ടികഘടകത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
