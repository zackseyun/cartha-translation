  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֶ֥לֶךְ דּ֛וֹר לְ/נָפַ֥ת דּ֖וֹר אֶחָ֑ד מֶֽלֶךְ גּוֹיִ֥ם לְ/גִלְגָּ֖ל אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/023.yaml
  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: ml
  text: നാഫത്ത്-ദോരിലെ ദോരിന്റെ രാജാവ്, ഒരുവൻ; ഗിൽഗാലിലെ ഗോയീമിന്റെ രാജാവ്, ഒരുവൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: …രാജാവ്
  rationale: തോൽപ്പിക്കപ്പെട്ട രാജാക്കന്മാരുടെ പട്ടികയിൽ ഓരോ ഇനവും അവതരിപ്പിക്കുന്ന സംയുക്തരൂപം; മലയാളത്തിൽ സ്ഥലനാമത്തോടു ചേർത്തുള്ള ‘രാജാവ്’ സ്വാഭാവികമാണ്.
- source_word: דּוֹר
  choice: ദോർ
  rationale: സ്ഥലനാമമായതിനാൽ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְנָפַת דּוֹר
  choice: നാഫത്ത്-ദോരിലെ
  rationale: ഇത് ദോരിന്റെ പ്രദേശമോ ഭൂപ്രദേശനാമമോ സൂചിപ്പിക്കുന്ന സംയുക്ത ഭൂമിശാസ്ത്രപ്രയോഗമാണ്. വിവരണാത്മക അർഥം നിർബന്ധിക്കാതെ രൂപം നിലനിർത്താൻ ‘നാഫത്ത്-ദോർ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: പട്ടികയിലെ എണ്ണൽസൂചകമാണ്; രാജാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ഒരുവൻ’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: גּוֹיִם
  choice: ഗോയീം
  rationale: സാധാരണയായി ‘ജനതകൾ/ജാതികൾ’ എന്നർഥമുള്ള പദമാണെങ്കിലും ഇവിടെ സ്ഥലമോ പ്രദേശമോ സൂചിപ്പിച്ചേക്കാം. അവ്യക്തതയെ മുഖ്യവാക്യത്തിൽ അതിരുകടന്ന് പരിഹരിക്കാതിരിക്കാൻ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְגִלְגָּל
  choice: ഗിൽഗാലിലെ
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നു; ‘ഗിൽഗാലിലെ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആവർത്തനാത്മകമായ പട്ടികാശൈലിയും ഓരോ രാജാവിനുശേഷമുള്ള സംക്ഷിപ്ത എണ്ണലും നിലനിർത്തി. ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളുടെ മാർക്കറുകൾ അവയുടെ വിഷയങ്ങളോട് പൊരുത്തപ്പെടാതെ മറിച്ചിട്ടതായി തോന്നുന്നതിനാൽ, മൂലഹീബ്രായ വാക്യത്തിന്റെ ആവശ്യകത അനുസരിച്ച് മുഖ്യപാഠം നേരിട്ട് രൂപപ്പെടുത്തി; ഈ വാക്യത്തിൽ നിർബന്ധമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
