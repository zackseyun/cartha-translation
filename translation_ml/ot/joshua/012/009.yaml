id: JOS.12.9
reference: Joshua 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֶ֥לֶךְ יְרִיח֖וֹ אֶחָ֑ד מֶ֧לֶךְ הָ/עַ֛י אֲשֶׁר מִ/צַּ֥ד בֵּֽית אֵ֖ל אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/009.yaml
  text: the king of Jericho[a], one; the king of Ai, which is beside Bethel, one.
translation:
  language: ml
  text: യെരീഹോയിലെ രാജാവ്, ഒരുവൻ; ബേഥേലിനു സമീപമുള്ള ഹായിയിലെ രാജാവ്, ഒരുവൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഒരു ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം; പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തുന്നു.
- source_word: יְרִיחוֹ
  choice: യെരീഹോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: പരാജയപ്പെട്ട രാജാക്കന്മാരെ ഓരോരുത്തരായി എണ്ണുന്ന ആവർത്തിത സൂത്രവാക്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഇവിടെ എണ്ണപ്പെടുന്നത് വ്യക്തിയായ രാജാവായതിനാൽ മനുഷ്യവാചക രൂപം സ്വാഭാവികമാണ്.
- source_word: הָעַי
  choice: ഹായി
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം; ഹീബ്രായ നിർദേശക ലേഖനം പ്രത്യേകം വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: אֲשֶׁר
  choice: -മുള്ള
  rationale: ഹായിയെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ചുരുക്കി അവതരിപ്പിക്കുന്നു.
- source_word: מִצַּד
  choice: സമീപമുള്ള
  rationale: ബേഥേലിനോടുള്ള സ്ഥലപരമായ അടുപ്പം സൂചിപ്പിക്കുന്നു; ‘അരികിലുള്ള’ എന്നതും സാധ്യമാണ്.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ പട്ടികാശൈലി. ഹീബ്രായത്തിലെ ആവർത്തിത എണ്ണൽരീതി ‘രാജാവ്, ഒരുവൻ’ എന്ന ഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് വാചകവിഭജനത്തിലെ യഥാർത്ഥ വ്യത്യാസം വ്യക്തമാക്കുന്നില്ലെന്നും അതിന്റെ പാഠം പ്രധാനവായനയോട് അടിസ്ഥാനപരമായി ഒരുപോലെയാണെന്നും കണ്ടതിനാൽ പ്രസിദ്ധീകരണ കരടിൽ ചേർത്തിട്ടില്ല.
