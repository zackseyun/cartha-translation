  text: the king of Madon[a], one; the king of Hazor, one.
translation:
  language: ml
  text: മാദോനിലെ രാജാവ് ഒരുവൻ[a]; ഹാസോരിലെ രാജാവ് ഒരുവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ മൂലപാഠം സംക്ഷിപ്തമായ കണക്കെടുപ്പ് ശൈലി നിലനിർത്തുന്നു: “മാദോനിലെ രാജാവ് ഒരുവൻ; ഹാസോരിലെ രാജാവ് ഒരുവൻ.”'
    reason: cultural_note
lexical_decisions:
- source_word: מֶלֶךְ מָדוֹן
  choice: മാദോൻരാജാവ്
  rationale: നിർമാണരൂപത്തിലുള്ള ‘മാദോന്റെ രാജാവ്’ എന്ന ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തപദത്തിലൂടെ ചുരുക്കിപ്പറയുന്നു; പട്ടികയുടെ സംക്ഷിപ്തശൈലിയും നിലനിർത്തുന്നു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: ഓരോ നഗരരാജാവിനെയും എണ്ണുന്ന ഏകവചന സംഖ്യയാണ്; വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒന്ന്’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ ‘ഒരുവൻ’ സ്വീകരിച്ചു, എന്നാൽ ആവർത്തിച്ച കണക്കെടുപ്പ് സൂത്രം നിലനിർത്തി.
- source_word: מֶלֶךְ חָצוֹר
  choice: ഹാസോർരാജാവ്
  rationale: നിർമാണരൂപത്തിലുള്ള ‘ഹാസോറിന്റെ രാജാവ്’ എന്ന ബന്ധം സ്വാഭാവികമായ മലയാള സംയുക്തപദമായി നൽകി.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: രണ്ടാമത്തെ പട്ടികയിനത്തിലും ആവർത്തിക്കുന്ന സംഖ്യ നിലനിർത്തി, എബ്രായത്തിലെ കണക്കെടുപ്പ് ശൈലി സംരക്ഷിച്ചു.
- source_word: מָדוֹן
  choice: മാദോൻ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: חָצוֹר
  choice: ഹാസോർ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം നൽകി.
