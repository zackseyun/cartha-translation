translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂമിശാസ്ത്രപദങ്ങളിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചപ്പോൾ ‘അരാബാ’ എന്ന പ്രത്യേക നാമം വ്യാഖ്യാനക്കുറിപ്പോടെ നിലനിർത്തി. മൂലത്തിലെ ദീർഘവാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി പുനഃക്രമീകരിച്ചെങ്കിലും വിവരബന്ധങ്ങളും കിഴക്കൻ പ്രദേശപരിധിയും സംരക്ഷിച്ചു.
