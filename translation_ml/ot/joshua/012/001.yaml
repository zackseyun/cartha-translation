source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: ml
  text: യോർദാന്ന് അപ്പുറത്ത്, സൂര്യോദയദിക്കിൽ[b], അർന്നോൻ വാദി[c] മുതൽ ഹെർമോൻ പർവതംവരെയും കിഴക്കോട്ടുള്ള അരാബാ[d] മുഴുവനിലും, ഇസ്രായേൽമക്കൾ[a] തോൽപ്പിച്ച് അവരുടെ ദേശം കൈവശമാക്കിയ ദേശത്തെ രാജാക്കന്മാർ ഇവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ’; എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്കിൽ’; അതായത് കിഴക്ക്.
    reason: lexical_alternative
  - marker: c
    text: ‘വാദി’ കാലാനുസൃതമായി വെള്ളമൊഴുകുന്ന തോടിനെയോ അതിന്റെ താഴ്‌വരയെയോ സൂചിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ ‘അർന്നോൻ തോട്’ എന്നോ ‘അർന്നോൻ താഴ്‌വര’ എന്നോ നൽകുന്നു.
    reason: cultural_note
  - marker: d
    text: അഥവാ ‘സമതലം’; ‘അരാബാ’ യോർദാൻ വിള്ളൽതാഴ്‌വര മേഖലയെ സൂചിപ്പിക്കുന്ന പ്രത്യേക ഭൂമിശാസ്ത്രപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: പുതിയ പട്ടിക ആരംഭിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: מַלְכֵי הָאָרֶץ
  choice: രാജാക്കന്മാർ
  rationale: തുടർന്നുള്ള ഭൂമിശാസ്ത്രപരമായ പരിധി ഇവർ ഭരിച്ച ദേശത്തെ വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി.
- source_word: אֲשֶׁר הִכּוּ
  choice: തോൽപ്പിച്ച്
  rationale: נכה എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ അർഥം നൽകുന്നു; ഓരോ രാജാവും കൊല്ലപ്പെട്ടു എന്ന് വാചകം ആവശ്യത്തിലധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തതും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּרְשׁוּ אֶת־אַרְצָם
  choice: അവരുടെ ദേശം കൈവശമാക്കിയ
  rationale: കീഴടക്കൽസന്ദർഭത്തിൽ ירשׁ അവകാശമായി ലഭിക്കുക എന്നതിലുപരി ദേശം കൈവശപ്പെടുത്തുക എന്ന അർഥം നൽകുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാനക്കരെ
  rationale: ‘യോർദാന്റെ മറുകരയിൽ’ എന്ന സ്ഥാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; തുടർന്നുള്ള കിഴക്കൻ ദിശാസൂചന ഏത് കരയെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ
  choice: സൂര്യോദയദിക്കിൽ
  rationale: ‘സൂര്യൻ ഉദിക്കുന്ന ദിക്കിലേക്ക്’ എന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് കിഴക്ക് എന്ന അർഥം വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: מִנַּחַל אַרְנוֹן
  choice: അർന്നോൻ നീരൊഴുക്കുതാഴ്‌വര മുതൽ
  rationale: נחל സ്ഥിരമായ നദിയെ മാത്രം സൂചിപ്പിക്കാതെ കാലാനുസൃത നീരൊഴുക്കുള്ള താഴ്‌വരയെയും സൂചിപ്പിക്കാം; ‘നീരൊഴുക്കുതാഴ്‌വര’ ഭൂമിശാസ്ത്രസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עַד הַר חֶרְמוֹן
  choice: ഹെർമോൻ പർവതംവരെ
  rationale: പ്രദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וְכָל־הָעֲרָבָה מִזְרָחָה
  choice: കിഴക്കുള്ള അരാബാ മുഴുവനിലുമായി
  rationale: עֲרָבָהയെ പൊതുവായ ‘സമതലം’ എന്ന് ലഘൂകരിക്കാതെ പ്രത്യേക ഭൂമിശാസ്ത്രനാമമായി നിലനിർത്തുകയും מִזְרָחָהയുടെ കിഴക്കൻ സ്ഥാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
