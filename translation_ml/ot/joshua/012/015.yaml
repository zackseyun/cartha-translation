  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ നഗരരാജ്യത്തിന്റെയും ഭരണാധികാരിയെ പരിചയപ്പെടുത്തുന്ന സംയുക്തരൂപം; മലയാളത്തിൽ സ്ഥലനാമത്തോടൊപ്പം ‘-യിലെ രാജാവ്’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: לִבְנָה
  choice: ലിബ്ന
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: പട്ടികയിലെ ഓരോ രാജാവിനെയും എണ്ണുന്ന സംഖ്യാവാചകം; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചുകൊണ്ട് എബ്രായത്തിലെ സംക്ഷിപ്ത എണ്ണൽശൈലി നിലനിർത്തി.
- source_word: עֲדֻלָּם
  choice: അദുല്ലാം
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
