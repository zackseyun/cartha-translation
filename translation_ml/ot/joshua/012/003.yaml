source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: ml
  text: അരാബയും[a], കിഴക്കുഭാഗത്തുള്ള കിന്നെരെത്ത് കടൽവരെയും, ബേത്ത്-യെശിമോത്ത് വഴിയായി കിഴക്കോട്ടുള്ള അരാബക്കടലായ ഉപ്പുകടൽവരെയും[b], തെക്കുഭാഗത്ത് പിസ്ഗയുടെ ചരിവുകൾക്കു താഴെവരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അരാബ’ എന്നതിന് ‘സമതലം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് പൊതുവായ ഒരു സമതലത്തേക്കാൾ യോർദ്ദാൻ ഭ്രംശതാഴ്വരപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അരാബക്കടൽ, ഉപ്പുകടൽ’ എന്നു പറയുന്നത് പിന്നീട് സാധാരണയായി ചാവുകടൽ എന്നു വിളിക്കപ്പെട്ട കടലിനെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: അരാബ
  rationale: സാധാരണ സമതലമെന്നതിലുപരി യോർദ്ദാൻ ഭ്രംശതാഴ്വരപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: יָם כִּנְרוֹת
  choice: കിന്നെരെത്ത് കടൽ
  rationale: എബ്രായ സ്ഥലനാമം നിലനിർത്തിക്കൊണ്ട് ‘കടൽ’ എന്ന ഘടകവും ഔപചാരികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִזְרָחָה
  choice: കിഴക്കുള്ള / കിഴക്കോട്ട്
  rationale: ആദ്യ സന്ദർഭത്തിൽ സ്ഥലബന്ധവും രണ്ടാമത്തേതിൽ ദിശാബോധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; രണ്ടിടത്തും കിഴക്കൻ ദിശ നിലനിർത്തി.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: അരാബക്കടലായ ഉപ്പുകടൽ
  rationale: രണ്ടാമത്തെ പേര് ആദ്യത്തേതിനെ വിശദീകരിക്കുന്ന എബ്രായ സമാനാധികരണബന്ധം ‘-ആയ’ കൊണ്ട് പ്രകടമാക്കി; മൂലത്തിൽ ഇല്ലാത്ത ‘ചാവുകടൽ’ മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: ബേത്ത്-യെശിമോത്തിലേക്കുള്ള ദിശയിൽ
  rationale: അതിർത്തിവിവരണത്തിൽ דֶּרֶךְ പാതയെയോ ദിശയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഭൂമിശാസ്ത്രദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וּמִתֵּימָן
  choice: തെക്കോട്ട്
  rationale: ദക്ഷിണദിശയെയോ ദക്ഷിണഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന രൂപം സംക്ഷിപ്തമായ ദിശാപദമായി നൽകി.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: പിസ്ഗയുടെ ചരിവുകൾക്കു താഴെ
  rationale: ഭൂപ്രകൃതിവിവരണത്തിലെ ‘താഴെ’ എന്നും മലയുടെ ഇറക്കങ്ങളായ ‘ചരിവുകൾ’ എന്നും അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകി.
