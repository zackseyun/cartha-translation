revisions:
- from: അരാബയിൽ കിഴക്കുള്ള കിന്നെരെത്ത് കടൽവരെയും[a], കിഴക്കോട്ട് അരാബക്കടലായ ഉപ്പുകടൽവരെയും[b], ബേത്ത്-യെശിമോത്തിലേക്കുള്ള ദിശയിലും, തെക്കോട്ട് പിസ്ഗയുടെ ചരിവുകൾക്കു താഴെവരെയും.
  to: അരാബയും[a], കിഴക്കുഭാഗത്തുള്ള കിന്നെരെത്ത് കടൽവരെയും, ബേത്ത്-യെശിമോത്ത് വഴിയായി കിഴക്കോട്ടുള്ള അരാബക്കടലായ ഉപ്പുകടൽവരെയും[b], തെക്കുഭാഗത്ത് പിസ്ഗയുടെ ചരിവുകൾക്കു താഴെവരെയും.
  rationale: The revision restores the Arabah as a coordinated element of the territorial list, places its lexical note on the correct word, and renders the Beth-jeshimoth phrase with a closer, natural route expression. It retains the source’s directional and topographical sequence, the appositional naming of the Salt Sea, and the deliberately incomplete boundary-list syntax.
