translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായ പട്ടികാഭാഗമായതിനാൽ സമാപകക്രിയ ചേർത്തിട്ടില്ല. സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; മൂലത്തിലെ ദിശാപരവും സമാനാധികരണപരവുമായ ഘടനകൾ സാധ്യമായത്ര നിലനിർത്തി.
