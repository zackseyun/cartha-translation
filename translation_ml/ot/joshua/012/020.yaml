translation:
  language: ml
  text: ശിമ്രോൻ-മെരോനിലെ രാജാവ്—ഒന്ന്; അക്ഷാഫിലെ രാജാവ്—ഒന്ന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: വിജയപ്പട്ടികയിലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ ഓരോ നഗരരാജ്യത്തിന്റെയും ഭരണാധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്ഥലനാമത്തിനു പിന്നാലെ ‘രാജാവ്’ എന്നു നൽകുന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: ശിമ്രോൻ-മെരോൻ
  rationale: മസോര പാഠത്തിന്റെ സ്വരചിഹ്നങ്ങളും വാക്യഘടനയും ഇതിനെ സാധാരണയായി ഒരു സംയുക്ത സ്ഥലനാമമായി മനസ്സിലാക്കാൻ പിന്തുണയ്ക്കുന്നു; ഈ വാക്യത്തിൽ രണ്ടു രാജാക്കന്മാരെ മാത്രം എണ്ണുന്നതുമായും ഇത് യോജിക്കുന്നു. സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒന്ന്
  rationale: അധ്യായത്തിലെ ആവർത്തിത എണ്ണൽസൂത്രത്തിൽ אֶחָד ഓരോ രാജാവിന്റെയും എണ്ണം സംക്ഷിപ്തമായി രേഖപ്പെടുത്തുന്നു. ‘ഒന്ന്’ എന്ന രൂപം മൂലപാഠത്തിന്റെ താളവും പട്ടികാശൈലിയും നിലനിർത്തുന്നു.
- source_word: אַכְשָׁף
  choice: അക്ഷാഫ്
  rationale: ഹീബ്രു സ്ഥലനാമം ആധുനിക മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമായ വിധം ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ പട്ടികാരീതിയും സംക്ഷിപ്തമായ എണ്ണൽതാളവും ദീർഘരേഖ ഉപയോഗിച്ച് നിലനിർത്തി; യഥാർഥമായ പാഠസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
