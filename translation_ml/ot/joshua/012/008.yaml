translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഭൂമിശാസ്ത്രപ്പട്ടികയുടെ താളവും എബ്രായത്തിലെ കൂട്ടവാചക ജനനാമങ്ങളും നിലനിർത്തി. മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന വാക്യഘടനയോട് ഈ വാക്യം ബന്ധപ്പെടുന്നതിനാൽ, മലയാളത്തിൽ അർഥപൂർണമായ ഖണ്ഡമായി ‘ഉണ്ടായിരുന്ന ... ദേശം’ ചേർത്തിരിക്കുന്നു; ഇത് 12:7-ലെ ആശ്രിതഘടന വ്യക്തമാക്കുന്നു.
