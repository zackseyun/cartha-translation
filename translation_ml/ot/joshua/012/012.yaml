lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: מֶלֶךְ എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ. സ്ഥലനാമത്തോടു ചേർന്ന എബ്രായ സംയുക്തഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘എഗ്ലോൻരാജാവ്’, ‘ഗേസെർരാജാവ്’ എന്നു നൽകി.
- source_word: עֶגְלוֹן
