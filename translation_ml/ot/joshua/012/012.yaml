  rationale: സ്ഥലനാമം മൂലഭാഷയിലെ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: പട്ടികയിലെ എണ്ണൽസൂചകമായ ‘ഒന്ന്’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, രാജാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തിവാചക രൂപം ഉപയോഗിച്ചു; ‘ഒരു രാജാവ്’ എന്ന വിപുലീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
- source_word: גֶּזֶר
  choice: ഗേസെർ
  rationale: സ്ഥലനാമം എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
