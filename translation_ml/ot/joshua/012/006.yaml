  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ദാസനായ മോശെയും ഇസ്രായേലിന്റെ പുത്രന്മാരും[a] അവരെ പരാജയപ്പെടുത്തി. യഹ്‌വെയുടെ ദാസനായ മോശെ അത് രൂബേന്യർക്കും ഗാദ്യർക്കും മനശ്ശെയുടെ പാതിഗോത്രത്തിനും അവകാശമായി നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ സ്വാഭാവികമായി, “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: മോശെയെക്കുറിച്ചുള്ള ബഹുമാനസൂചകമായ സ്ഥാനനാമത്തിൽ ഇത് യഹ്‌വെയോടുള്ള സമർപ്പിത സേവനത്തെയും നിയോഗിത പദവിയെയും സൂചിപ്പിക്കുന്നു; അടിമത്തത്തിന് ഊന്നൽ നൽകുന്ന പദത്തേക്കാൾ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചന രൂപം സുതാര്യമായി നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ കൂട്ടനാമം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הִכּוּם
  choice: അവരെ പരാജയപ്പെടുത്തി
  rationale: נכה എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ അടിച്ചുവീഴ്ത്തൽ, തോൽപ്പിക്കൽ, കൊല്ലൽ എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ‘പരാജയപ്പെടുത്തി’ യുദ്ധസംഗ്രഹത്തിന് സ്വാഭാവികമായിരിക്കെ കൊല്ലപ്പെട്ടുവെന്ന് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: וַיִּתְּנָהּ
  choice: അത് ... നൽകി
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അത്’ സ്വാഭാവികമാണ്.
- source_word: יְרֻשָּׁה
  choice: അവകാശമായി
  rationale: തലമുറകളായി കൈവശം ലഭിക്കുന്ന അവകാശഭൂമി എന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: לָרֻאוּבֵנִי
  choice: രൂബേന്യർക്ക്
  rationale: ഏകവചനത്തിലുള്ള ഗോത്രനാമവിശേഷണം ഇവിടെ സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചന സമൂഹനാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לַגָּדִי
  choice: ഗാദ്യർക്ക്
  rationale: ഗാദ് ഗോത്രത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സമൂഹനാമമായി നൽകി.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: യോർദ്ദാന്റെ കിഴക്കുഭാഗത്ത് അവകാശം ലഭിച്ച മനശ്ശെ ഗോത്രത്തിന്റെ പകുതിയെ സൂചിപ്പിക്കുന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിന്റെ സമൂഹാർത്ഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
- issue: הִכּוּם എന്ന സൈനികക്രിയയുടെ വ്യാപ്തി
  choice: അവരെ പരാജയപ്പെടുത്തി
  alternative: അവരെ അടിച്ചുവീഴ്ത്തി; അവരെ സംഹരിച്ചു
  rationale: ക്രിയയ്ക്ക് യുദ്ധത്തിൽ തോൽപ്പിക്കൽ മുതൽ കൊല്ലൽ വരെയുള്ള അർത്ഥവ്യാപ്തിയുണ്ട്. സന്ദർഭം അനുവദിക്കുന്ന ഈ അനിശ്ചിതത്വം കൊല്ലൽ എന്നൊന്നിലേക്ക് ചുരുക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗോത്രനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ രൂപങ്ങളോട് ചേർന്ന് നൽകിയിരിക്കുന്നു. മൂലത്തിലെ ആവർത്തനമായ ‘യഹ്‌വെയുടെ ദാസനായ മോശെ’ രണ്ടു പ്രാവശ്യവും നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുതന്നെ ചേർത്തിരിക്കുന്നു.
