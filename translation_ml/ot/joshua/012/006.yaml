  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ ഘടനയും നിർണായക ഘടകങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു: മോശെയുടെ ‘യഹ്‌വെയുടെ ദാസൻ’ എന്ന വിശേഷണം രണ്ടുതവണയും, ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗവും, യുദ്ധക്രിയയുടെ സന്ദർഭാനുസൃതമായ ‘പരാജയപ്പെടുത്തി’ എന്ന വിവർത്തനവും, ദേശത്തെ അവകാശമായി നൽകലും, മൂന്നു സ്വീകർത്തൃഗോത്രങ്ങളും നിലനിർത്തിയിരിക്കുന്നു. ‘അവരെ പരാജയപ്പെടുത്തി’ എന്നത് נכהയുടെ സൈനികപ്രയോഗത്തിന് യോജിച്ചതും കൊല്ലലിലേക്ക് അനാവശ്യമായി അർത്ഥം ചുരുക്കാത്തതുമാണ്.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘രൂബേന്യർക്കും ഗാദ്യർക്കും മനശ്ശെയുടെ പാതിഗോത്രത്തിനും’ എന്ന സമാന്തരഘടന വ്യക്തമാണ്. ‘അത്’ എന്ന സർവനാമം മുൻസന്ദർഭത്തിലെ ദേശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രത്യയത്തിന്റെ യോജിച്ച മലയാളരൂപമാണ്.
  terminology: ‘യഹ്‌വെ,’ ‘ദാസൻ,’ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ,’ ‘അവകാശമായി,’ ‘പാതിഗോത്രം’ എന്നിവ ഉറവിടത്തോടും നൽകിയ ഇംഗ്ലീഷ് പരിശോധനാപാതയോടും യോജിക്കുന്നു. പേരുകളുടെ മലയാളരൂപങ്ങളും സ്ഥിരതയുള്ളവയാണ്. അടിക്കുറിപ്പ് a മുഖ്യപാഠത്തിലെ വ്യക്തമായ പുരുഷലിംഗ കോർപ്പറേറ്റ് പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക ബദൽ നൽകുന്നു; ആങ്കർ ശരിയായ സ്ഥാനത്താണ്.
