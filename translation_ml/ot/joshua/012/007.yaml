  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: ml
  text: യോർദാന്റെ അക്കരെ, പടിഞ്ഞാറ്, ലെബാനോൻ താഴ്വരയിലെ ബാൽ-ഗാദ് മുതൽ സേയീരിലേക്കു ഉയരുന്ന[b] ഹാലാക് പർവതംവരെ യോശുവയും യിസ്രായേൽമക്കളും[a] അടിച്ചുതോൽപ്പിച്ച ദേശത്തിലെ രാജാക്കന്മാർ ഇവരാണ്. യോശുവ ആ ദേശം യിസ്രായേൽഗോത്രങ്ങൾക്ക് അവരുടെ വിഭാഗങ്ങൾക്കനുസരിച്ച് അവകാശമായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “യിസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സേയീരിലേക്കു കയറിപ്പോകുന്ന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מַלְכֵי הָאָרֶץ
  choice: ദേശത്തിലെ രാജാക്കന്മാർ ഇവരാണ്
  rationale: തുടർന്നുവരുന്ന പട്ടികയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הִכָּה
  choice: കൊന്നുവീഴ്ത്തിയ
  rationale: രാജാക്കന്മാരെ യുദ്ധത്തിൽ സംഹരിച്ചതിനെ സൂചിപ്പിക്കുന്ന נכה എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; വെറും ‘തോൽപ്പിച്ച’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ആശയം മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ സമുദായനാമമായി നൽകുന്നു; ‘യിസ്രായേല്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: യോർദാന്റെ പടിഞ്ഞാറുവശത്ത്
  rationale: നദിയുടെ പടിഞ്ഞാറൻ പാർശ്വവും יָמָּה നൽകുന്ന ദിശാസൂചനയും വ്യക്തമായി അറിയിക്കുന്നു; മലയാളത്തിൽ അസ്വാഭാവികമായ ‘പടിഞ്ഞാറോട്ടുള്ള യോർദാനക്കരെ’ ഒഴിവാക്കുന്നു.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: ലെബാനോൻ താഴ്വരയിലെ
  rationale: בִּקְעָה എന്ന വിശാലമായ താഴ്വര/സമതലഭൂപ്രദേശത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘താഴ്വര’ എന്നു നൽകുന്നു.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: ഹാലാക് പർവതംവരെ
  rationale: സന്ദർഭത്തിൽ ഭൂസ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ הֶחָלָק എന്നത് ‘മിനുസമുള്ള മല’ എന്നു വിവർത്തനം ചെയ്യാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: സേയീരിലേക്കു ഉയരുന്ന
  rationale: ഭൂപ്രദേശത്തിന്റെ ഉയർച്ചയെയും സേയീരിലേക്കുള്ള ദിശയെയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘കയറിപ്പോകുന്ന’ എന്ന മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְרֻשָּׁה
  choice: അവകാശമായി
  rationale: യോശുവയിലെ ദേശവിഭജനസന്ദർഭത്തിനും ഉടമ്പടിപരമായ അവകാശധാരണയ്ക്കും യോജിച്ച പതിവ് മലയാളപദം.
- source_word: כְּמַחְלְקֹתָם
  choice: അവരുടെ വിഭാഗങ്ങൾക്കനുസരിച്ച്
  rationale: ഓരോ ഗോത്രത്തിന്റെയും നിർണയിക്കപ്പെട്ട വിഭാഗമോ വിഹിതമോ സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗം അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
