  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: ml
  text: മക്കേദായിലെ രാജാവ്[a], ഒരാൾ; ബേഥേലിലെ രാജാവ്, ഒരാൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായമൂലത്തിൽ പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിൽക്കുന്നു: ‘മക്കേദായിലെ രാജാവ്, ഒരാൾ; ബേഥേലിലെ രാജാവ്, ഒരാൾ.’ ഇവിടെ ‘ഒരാൾ’ എന്നത് പരാജയപ്പെടുത്തിയ ഓരോ രാജാവിന്റെയും എണ്ണമാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ നഗരരാജ്യത്തിന്റെയും ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന സംയുക്തരൂപം; മലയാളത്തിൽ സ്ഥലനാമത്തോടൊപ്പം ‘-യിലെ രാജാവ്’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: מַקֵּדָה
  choice: മക്കേദ
  rationale: വിവർത്തനം ചെയ്യാതെ ശബ്ദലിപ്യന്തരണം ചെയ്ത സ്ഥലനാമം.
- source_word: אֶחָד
  choice: ഒരാൾ
  rationale: പരാജയപ്പെടുത്തിയ ഓരോ രാജാവിന്റെയും എണ്ണം രേഖപ്പെടുത്തുന്ന സംഖ്യയാണ്; വ്യക്തിയെ എണ്ണുന്നതിനുള്ള സ്വാഭാവിക മലയാളരൂപമായ ‘ഒരാൾ’ എബ്രായത്തിന്റെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തുന്നു.
- source_word: בֵּית אֵל
  choice: ബേഥേൽ
  rationale: ‘ദൈവത്തിന്റെ ഭവനം’ എന്ന് പദോത്പത്തിപരമായി വിവർത്തനം ചെയ്യാതെ, ഇവിടെ സ്ഥലനാമമായതിനാൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ആവർത്തനവും സംക്ഷിപ്തമായ കണക്കെടുപ്പ് ശൈലിയും നിലനിർത്തി; സ്ഥലനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരൂപങ്ങൾ ഉപയോഗിച്ചു.
