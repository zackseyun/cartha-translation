source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: ml
  text: ഹെശ്ബോനിൽ വസിച്ചിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോൻ അർണോൻ താഴ്വരയുടെ[a] തീരത്തുള്ള അരോവേർ മുതൽ, ആ താഴ്വരയുടെ മധ്യഭാഗവും ഗിലെയാദിന്റെ പകുതിയും ഉൾപ്പെടെ, അമ്മോന്യരുടെ[b] അതിർത്തിയായ യബ്ബോക്ക് താഴ്വര വരെ ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ נחל (നഹൽ) എന്ന പദത്തിന് താഴ്വര, വാദി, നീരൊഴുക്കുപാത എന്നിങ്ങനെ അർഥങ്ങളാകാം; ഇവിടെ അർണോനും യബ്ബോക്കും പ്രദേശാതിർത്തികളായി പറയപ്പെടുന്നു.
    reason: cultural_note
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അമ്മോന്റെ പുത്രന്മാർ’; അതായത് അമ്മോന്യർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: വസിച്ചിരുന്ന
  rationale: ישב എന്ന ക്രിയയുടെ പങ്കാളികരൂപം ഇവിടെ സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: מֹשֵׁל
  choice: ഭരിച്ചിരുന്നു
  rationale: പറയുന്ന ഭൂപ്രദേശത്തിന്മേലുള്ള സീഹോന്റെ രാഷ്ട്രീയാധികാരമാണ് משל ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: מֵעֲרוֹעֵר
  choice: അരോവേർമുതൽ
  rationale: מ־ ഭൂപ്രദേശത്തിന്റെ ആരംഭബിന്ദുവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുതൽ’ എന്നത് നേരിട്ടും സ്വാഭാവികമായും അർഥം നൽകുന്നു.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: അർണോൻ താഴ്വരയുടെ കരയിൽ
  rationale: שפה എന്നത് ‘കര/അരിക്’ എന്നും נחל താഴ്വര, വാദി, നീരൊഴുക്കുപാത എന്നിവയും സൂചിപ്പിക്കാം; ‘താഴ്വരയുടെ കര’ ഭൂപ്രകൃതിയെ അനാവശ്യമായി സ്ഥിരനദിയാക്കി നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְתוֹךְ הַנַּחַל
  choice: താഴ്വരയുടെ മധ്യഭാഗംമുതലും
  rationale: תוך എന്നതിന്റെ ‘നടുവ്/മധ്യഭാഗം’ എന്ന അർഥം നിലനിർത്തുന്നു; പ്രദേശപരിധിയുടെ നിരയ്ക്ക് അനുയോജ്യമായി ‘മുതൽ’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: ഗിലെയാദിന്റെ പകുതിയിലൂടെയും
  rationale: חצי സൂചിപ്പിക്കുന്ന പകുതി പ്രദേശം കൃത്യമായി നിലനിർത്തുകയും തുടർന്നുള്ള അതിർത്തിവരെ വ്യാപിക്കുന്ന ഭരണപരിധിയോട് മലയാളവാക്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: യബ്ബോക്ക് താഴ്വരവരെയും
  rationale: עד അവസാനപരിധിയെ സൂചിപ്പിക്കുന്നു; נחל എന്ന പദത്തിന്റെ താഴ്വര/വാദി അർഥം ഇവിടെ നിലനിർത്തുന്നു.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ അതിർത്തി
  rationale: അക്ഷരാർഥമായ ‘അമ്മോന്റെ പുത്രന്മാർ’ മലയാളത്തിൽ ജനവിഭാഗനാമമായി സ്വാഭാവികമല്ലാത്തതിനാൽ അതിന്റെ അംഗീകൃത ജനവിഭാഗാർഥമായ ‘അമ്മോന്യർ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരുടെ
  rationale: രാജാവിന്റെ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അമോര്യരുടെ രാജാവ്’ എന്നു നൽകുന്നു.
