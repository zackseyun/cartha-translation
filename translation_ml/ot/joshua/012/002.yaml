translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലപാഠം രാജാക്കന്മാരുടെ പട്ടികയിലെ ഒരു ഘടകമായതിനാൽ അർധവിരാമം ഉപയോഗിച്ച് പേരും ഭരണപരിധിയും ബന്ധിപ്പിച്ചു. נחל എന്ന പദത്തിന്റെ ഭൂപ്രകൃതിസംബന്ധിയായ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
