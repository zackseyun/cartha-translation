id: JOS.12.22
reference: Joshua 12:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מֶ֤לֶךְ קֶ֨דֶשׁ֙ אֶחָ֔ד מֶֽלֶךְ יָקְנֳעָ֥ם לַ/כַּרְמֶ֖ל אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/022.yaml
  text: the king of Kedesh[a], one; the king of Jokneam by Carmel, one.
translation:
  language: ml
  text: കേദെശിന്റെ രാജാവ്, ഒന്ന്; കർമ്മേലിനരികെയുള്ള യൊക്നെയാമിന്റെ രാജാവ്[a], ഒന്ന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കർമ്മേലിലെ യൊക്നെയാമിന്റെ രാജാവ്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം സ്ഥലമോ പ്രാദേശികബന്ധമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: പരാജയപ്പെട്ട നഗരരാജ്യങ്ങളുടെ ഭരണാധികാരികളെ എണ്ണിപ്പറയുന്ന പട്ടികയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: קֶדֶשׁ
  choice: കേദെശ്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒന്ന്
  rationale: ഓരോ രാജാവിനെയും പ്രത്യേകം എണ്ണുന്ന യോശുവ 12-ലെ ആവർത്തനാത്മക പട്ടികാശൈലി നിലനിർത്തുന്നു.
- source_word: יָקְנֳעָם
  choice: യൊക്നെയാം
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לַ/כַּרְמֶל
  choice: കർമ്മേലിനരികെയുള്ള
  rationale: ל ഉപസർഗം ഇവിടെ സ്ഥലബന്ധമോ പ്രാദേശികബന്ധമോ സൂചിപ്പിക്കാം; ‘അരികെയുള്ള’ എന്നത് കർമ്മേലിനോടുള്ള സമീപസ്ഥാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും അതിനെ പർവതമോ പ്രദേശമോ എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള ‘ഒന്ന്’ നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പിന്റെ ചിഹ്നം ‘Kedesh’ എന്നതിനു ശേഷമാണെങ്കിലും അടിക്കുറിപ്പ് לַכַּרְמֶל എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ ബന്ധപ്പെട്ട ‘യൊക്നെയാം’ ഘടകത്തിനു ശേഷമാണ് [a] ചേർത്തത്.
