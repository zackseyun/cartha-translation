translation:
  language: ml
  text: തപ്പൂഹിന്റെ രാജാവ്—ഒരാൾ; ഹേഫെരിന്റെ രാജാവ്—ഒരാൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: ഓരോ സ്ഥലത്തെയും ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന നിർമ്മിതരൂപം. മലയാളത്തിൽ സ്ഥലനാമത്തോടു ‘-ിന്റെ’ ചേർത്ത് സ്വാഭാവികമായി ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תַּפּוּחַ
  choice: തപ്പൂഹ്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരാൾ
  rationale: പട്ടികയിൽ തോൽപ്പിക്കപ്പെട്ട ഓരോ രാജാവിനെയും പ്രത്യേകം എണ്ണുന്ന സംക്ഷിപ്ത പ്രയോഗം. വ്യക്തിയെ എണ്ണുന്നതിനാൽ മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികമാണ്.
- source_word: חֵפֶר
  choice: ഹേഫെർ
  rationale: സ്ഥലനാമമായതിനാൽ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആവർത്തനാത്മകമായ ഹീബ്രു പട്ടികാശൈലി നിലനിർത്തിക്കൊണ്ട്, ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം ഉപയോഗിച്ചു. ദീർഘസ്വരവും അന്തിമ വ്യഞ്ജനവും സൂചിപ്പിക്കുന്നതിനായി സ്ഥലനാമങ്ങൾ ‘തപ്പൂഹ്’, ‘ഹേഫെർ’ എന്നു ലിപ്യന്തരിച്ചു.
