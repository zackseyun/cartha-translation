  yaml_path: translation/ot/joshua/012/024.yaml
  text: the king of Tirzah, one; all the kings, thirty-one.
translation:
  language: ml
  text: തിർസായിലെ രാജാവ്, ഒന്ന്; ആകെ രാജാക്കന്മാർ മുപ്പത്തിയൊന്ന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: രാജാവ്
  rationale: തുടർന്നുവരുന്ന സ്ഥലനാമത്തോടു ചേർന്ന നിർമാണരൂപം; പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്താൻ ‘തിർസയുടെ രാജാവ്’ എന്നു നൽകി.
- source_word: תִּרְצָה
  choice: തിർസ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ശബ്ദലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֶחָד
  choice: ഒന്ന്
  rationale: ഈ നഗരവുമായി ബന്ധപ്പെട്ട ഒരു രാജാവിനെ സൂചിപ്പിക്കുന്ന എണ്ണൽപദം; പട്ടികയുടെ ആവർത്തനഘടന സംരക്ഷിച്ചു.
- source_word: כָּל
  choice: ആകെ
  rationale: മുമ്പ് എണ്ണിപ്പറഞ്ഞ രാജാക്കന്മാരുടെ സമാപനത്തുക അവതരിപ്പിക്കുന്നതിനാൽ, സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘ആകെ’ തിരഞ്ഞെടുത്തു.
- source_word: מְלָכִים
  choice: രാജാക്കന്മാർ
  rationale: ഇതുവരെ പട്ടികപ്പെടുത്തിയ നിർദിഷ്ട രാജാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചനം.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: മുപ്പത്തിയൊന്ന്
  rationale: ഹീബ്രു സംയുക്തസംഖ്യയുടെ സാധാരണ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സംക്ഷിപ്തവുമായ പട്ടികാശൈലി. ഹീബ്രു വാക്യത്തിലെ അവസാന മൊത്തക്കണക്ക് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു; പ്രത്യേക വ്യാഖ്യാനമോ മതവിഭാഗപരമായ ഭാഷയോ ചേർത്തിട്ടില്ല.
