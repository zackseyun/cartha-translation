  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: ml
  text: അവൻ ഹെർമ്മോൻ പർവതത്തിന്മേലും സൽഖായിലും ബാശാൻ മുഴുവനിലും, ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെ, ഹെശ്ബോൻ രാജാവായ സീഹോന്റെ അതിർത്തിവരെയുള്ള ഗിലെയാദിന്റെ പകുതിയിലും ഭരിച്ചുകൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ ഹെർമ്മോൻ പർവതത്തിന്മേലും സൽഖായിലും ബാശാൻ മുഴുവനിലും ഭരിച്ചു.” എബ്രായത്തിൽ ‘ഭരിച്ചുകൊണ്ട്’ എന്ന ആശയത്തിലുള്ള ഒരു കൃദ്‌രൂപം മുൻവാക്യത്തിലെ വിവരണം തുടരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: അവൻ ... ഭരിച്ചു
  rationale: משל എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം മുൻവാക്യത്തിലെ ഓഗിന്റെ വിവരണം തുടരുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ സമ്പൂർണ്ണവാക്യം ഉപയോഗിച്ചെങ്കിലും അതിന്റെ തുടർച്ചാസ്വഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּהַר חֶרְמוֹן
  choice: ഹെർമ്മോൻ പർവതം
  rationale: משל-നോടൊപ്പമുള്ള ב ഭരണാധീനമായ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഭരിച്ചു’ എന്ന ക്രിയയ്ക്ക് നേരിട്ടുള്ള കർമമായി പ്രദേശനാമം സ്വാഭാവികമാണ്.
- source_word: וּבְסַלְכָה
  choice: സൽഖാ
  rationale: ഓഗിന്റെ ഭരണപ്രദേശത്തിലുള്ള സ്ഥലനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וּבְכָל הַבָּשָׁן
  choice: ബാശാൻ മുഴുവനും
  rationale: כל പ്രദേശത്തിന്റെ സമഗ്രത ഊന്നിപ്പറയുന്നു; ‘മുഴുവനും’ മലയാളത്തിൽ ഈ വ്യാപ്തി വ്യക്തമായി നൽകുന്നു.
- source_word: עַד גְּבוּל
  choice: അതിർത്തിവരെ
  rationale: עד גבול ഭരണപ്രദേശത്തിന്റെ അറ്റം അഥവാ പരിധി സൂചിപ്പിക്കുന്നു.
- source_word: הַגְּשׁוּרִי
  choice: ഗെശൂര്യർ
  rationale: ഏകവചന ജനവിഭാഗവിശേഷണം ഇവിടെ ഒരു ജനസമൂഹത്തെയും അവരുടെ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചന ജനനാമം സ്വാഭാവികമാണ്.
- source_word: וְהַמַּעֲכָתִי
  choice: മാഖാത്യർ
  rationale: ജനവിഭാഗവിശേഷണത്തെ ജനസമൂഹത്തിന്റെ പേരായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: ഗിലെയാദിന്റെ പകുതി
  rationale: ഭരണാധീനമായ പ്രദേശത്തിന്റെ പകുതിയെ കൃത്യമായി സൂചിപ്പിക്കുന്ന ലളിതമായ മലയാളപ്രയോഗം.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻരാജാവായ സീഹോന്റെ അതിർത്തി
  rationale: സീഹോന്റെ പദവിയും രാജ്യകേന്ദ്രവും നിലനിർത്തി, ഗിലെയാദിന്റെ പകുതിയുടെ മറുവശത്തെ പരിധിയായി ഈ വാക്യഘടകം വ്യക്തമാക്കുന്നു.
