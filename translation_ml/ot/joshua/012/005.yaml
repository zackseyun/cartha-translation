revisions:
- from: അവൻ ഹെർമ്മോൻ പർവതം, സൽഖാ, ബാശാൻ മുഴുവനും ഭരിച്ചു[a]. അവന്റെ അധികാരം ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെയും ഗിലെയാദിന്റെ പകുതിയിൽ ഹെശ്ബോൻരാജാവായ സീഹോന്റെ അതിർത്തിവരെയും വ്യാപിച്ചിരുന്നു.
  to: അവൻ ഹെർമ്മോൻ പർവതത്തിന്മേലും സൽഖായിലും ബാശാൻ മുഴുവനിലും, ഗെശൂര്യരുടെയും മാഖാത്യരുടെയും അതിർത്തിവരെ, ഹെശ്ബോൻ രാജാവായ സീഹോന്റെ അതിർത്തിവരെയുള്ള ഗിലെയാദിന്റെ പകുതിയിലും ഭരിച്ചുകൊണ്ടിരുന്നു[a].
