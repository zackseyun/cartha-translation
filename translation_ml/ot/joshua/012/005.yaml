translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. എബ്രായത്തിലെ ദീർഘമായ പങ്കാളിത്തഘടന മലയാളവായനയ്ക്ക് വ്യക്തത നൽകാൻ രണ്ട് വാക്യങ്ങളാക്കി; പ്രദേശപരിധികളുടെ ബന്ധം അർത്ഥം മാറ്റാതെ വ്യക്തമാക്കി. എല്ലാ സ്ഥല-ജനനാമങ്ങളും ഉറവിടരൂപത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു.
