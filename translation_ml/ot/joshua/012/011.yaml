  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ יַרְמוּת
  choice: യർമൂത്തിലെ രാജാവ്
  rationale: מֶלֶךְ എന്ന സംയുക്തരൂപവും തുടർന്നുള്ള സ്ഥലനാമവും മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലബന്ധരൂപത്തിൽ നൽകി.
- source_word: יַרְמוּת
  choice: യർമൂത്ത്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: തോൽപ്പിക്കപ്പെട്ട രാജാക്കന്മാരുടെ പട്ടികയിലെ സംക്ഷിപ്ത എണ്ണൽസൂത്രം നിലനിർത്തുന്നു; വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ 'ഒരുവൻ' സ്വാഭാവികമാണ്.
- source_word: מֶלֶךְ לָכִישׁ
  choice: ലാഖീശിലെ രാജാവ്
  rationale: ആദ്യ പദസമുച്ചയത്തോടുള്ള സമാന്തരതയും എബ്രായ പട്ടികാശൈലിയും കാത്തു.
- source_word: לָכִישׁ
  choice: ലാഖീശ്
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד
  choice: ഒരുവൻ
  rationale: ആവർത്തിക്കുന്ന എണ്ണൽപദം ആദ്യ പ്രയോഗത്തോടൊത്തു പരിഭാഷപ്പെടുത്തി.
