base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: ml
  text: '“നീ ഇസ്രായേൽമക്കളോടു പറയുക: ‘മോശ മുഖാന്തരം[a] ഞാൻ നിങ്ങളോടു പറഞ്ഞ അഭയനഗരങ്ങൾ നിങ്ങൾക്കായി നിയോഗിക്കുവിൻ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “മോശയുടെ കൈയാൽ”; അർഥം: “മോശ മുഖാന്തരം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: പീയേൽ ആജ്ഞാരൂപം യോശുവയോടുള്ള നേരിട്ടുള്ള കല്പനയായി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗത്തെ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായി നിലനിർത്തുന്നു; ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപേരാണിത്.
- source_word: לֵאמֹר
  choice: 'പറയുക:'
  rationale: ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ ആവർത്തനഭാരം ഒഴിവാക്കി നേരിട്ടുള്ള കല്പനയും തുടർന്നുള്ള ഉദ്ധരണിയുംകൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: תְּנוּ לָכֶם
  choice: നിങ്ങൾക്കായി നിയോഗിക്കുവിൻ
  rationale: נתן എന്നതിന്റെ അക്ഷരാർഥം ‘നൽകുക’ ആണെങ്കിലും, ഇവിടെ നഗരങ്ങളെ ഒരു പ്രത്യേക നിയമപരമായ ദൗത്യത്തിനായി നിശ്ചയിക്കുക എന്ന ഭരണപരമായ അർഥമാണ്; ‘നിയോഗിക്കുക’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: עָרֵי הַמִּקְלָט
  choice: അഭയനഗരങ്ങൾ
  rationale: സംരക്ഷണം ലഭിക്കുന്നതിനായി വേർതിരിച്ച നഗരങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള നിയമപദപ്രയോഗം.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞ
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വിഷയം നഗരങ്ങളാണെന്ന് പദക്രമം വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശ മുഖാന്തരം
  rationale: ‘മോശയുടെ കൈയാൽ’ എന്ന എബ്രായ കർത്തൃത്വ-മാധ്യമ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം, ദൈവിക കല്പന മോശയിലൂടെ അറിയിക്കപ്പെട്ടു എന്ന നിലയിൽ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന ലിംഗസൂചക കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപരമായ സവിശേഷത പൂർണമായി ഇല്ലാതാക്കാതെ, ആധുനിക മലയാളത്തിൽ സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പതിവുപ്രയോഗം തിരഞ്ഞെടുത്തു.
- issue: בְּיַד מֹשֶׁה എന്ന മാധ്യമകർത്തൃത്വ പ്രയോഗം
  choice: മോശ മുഖാന്തരം
  alternative: മോശയുടെ കൈയാൽ
  rationale: മോശ ദൈവിക നിർദേശത്തിന്റെ മനുഷ്യ മാധ്യമമായിരുന്നുവെന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. കല്പനയുടെ ഔപചാരിക ഭാവം നിലനിർത്താൻ ‘നിയോഗിക്കുവിൻ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു.
