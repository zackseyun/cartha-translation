translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യക്രമം സംരക്ഷിച്ചെങ്കിലും മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാകുന്ന വിധം ക്രിയാവിശേഷണരൂപങ്ങളും ‘പറയണം/കൊടുക്കണം/താമസിക്കണം’ എന്ന നിർദേശരൂപങ്ങളും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർഥ പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
