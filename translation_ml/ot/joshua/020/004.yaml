  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: ml
  text: അവൻ ഈ പട്ടണങ്ങളിൽ ഒന്നിലേക്ക് ഓടിപ്പോയി, പട്ടണവാതിലിന്റെ പ്രവേശനസ്ഥാനത്ത് നിന്നുകൊണ്ട് ആ പട്ടണത്തിലെ മൂപ്പന്മാർ കേൾക്കെ തന്റെ കാര്യം[a] പറയണം. അപ്പോൾ അവർ അവനെ പട്ടണത്തിനകത്ത് തങ്ങളുടെ ഇടയിലേക്കു സ്വീകരിച്ച്[b] അവന് ഒരു സ്ഥലം കൊടുക്കണം; അവൻ അവരോടൊപ്പം താമസിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ വാക്കുകൾ” അല്ലെങ്കിൽ “തന്റെ വ്യവഹാരം”; എബ്രായപദം അവൻ പറയുന്ന വാക്കുകളെയോ അവൻ അവതരിപ്പിക്കുന്ന കേസിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവനെ പട്ടണത്തിനകത്ത് തങ്ങളുടെ അടുക്കലേക്കു കൊണ്ടുവരിക”; എബ്രായക്രിയയ്ക്ക് “കൂട്ടിച്ചേർക്കുക,” “അകത്തേക്കു കൊണ്ടുവരിക,” “സ്വീകരിക്കുക” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: ഓടിപ്പോയി ... പറയണം
  rationale: നിയമനിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന രൂപം സന്ദർഭത്തിൽ നിർദേശാത്മകമാണ്. മലയാളത്തിൽ ആദ്യ പ്രവൃത്തിയെ ക്രിയാവിശേഷണരൂപത്തിലും പ്രധാന നിർദേശം ‘വേണം’ എന്ന അർഥമുള്ള രൂപത്തിലുമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങളിൽ ഒന്നിലേക്ക്
  rationale: ഭാഗസൂചകമായ എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: പട്ടണവാതിലിന്റെ പ്രവേശനസ്ഥാനത്ത് നിന്നുകൊണ്ട്
  rationale: פֶּתַח എന്ന ‘പ്രവേശനം/തുറവ്’ എന്ന ആശയവും שַׁעַר എന്ന ‘വാതിൽ’ എന്ന ആശയവും നിലനിർത്തുന്നു; പൗരന്യായനടപടി നടന്ന പൊതുസ്ഥലത്തിന്റെ ദൃശ്യവും സംരക്ഷിക്കുന്നു.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: മൂപ്പന്മാർ കേൾക്കെ ... പറയണം
  rationale: ‘ചെവികളിൽ’ എന്ന പദാനുപദരൂപത്തിനു പകരം ‘കേൾക്കെ’ എന്നത് എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: ആ പട്ടണത്തിലെ മൂപ്പന്മാർ
  rationale: הַהִיא നൽകുന്ന നിർദിഷ്ടത ‘ആ പട്ടണം’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶת דְּבָרָיו
  choice: തന്റെ കാര്യം
  rationale: דָּבָר എന്നതിന് ‘വാക്കുകൾ,’ ‘കാര്യം,’ ‘വ്യവഹാരം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ന്യായപരമായ ഈ സന്ദർഭത്തിൽ ‘തന്റെ കാര്യം’ സ്വാഭാവികമാണ്; പദത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: അവനെ പട്ടണത്തിനകത്ത് തങ്ങളുടെ ഇടയിലേക്കു സ്വീകരിച്ച്
  rationale: പട്ടണത്തിനകത്തേക്കുള്ള ചലനവും സമൂഹത്തിലേക്കുള്ള ഔദ്യോഗിക സ്വീകരണവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു. אָסַף എന്ന ക്രിയയുടെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: അവന് ഒരു സ്ഥലം കൊടുക്കണം
  rationale: מָקוֹם എന്ന പൊതുവായ ‘സ്ഥലം’ നിലനിർത്തുന്നു; അത് പാർപ്പിടമോ നിയോഗിച്ച സ്ഥലമോ എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וְיָשַׁב עִמָּם
  choice: അവൻ അവരോടൊപ്പം താമസിക്കണം
  rationale: പാർപ്പിന്റെ സന്ദർഭത്തിൽ יָשַׁב എന്നതിന് ‘താമസിക്കുക’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളമാണ്.
