  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: ml
  text: അബദ്ധത്തിൽ, അറിയാതെ ഒരാളുടെ മരണത്തിന് ഇടയാക്കിയവൻ[a] അവിടേക്കു ഓടിപ്പോകേണ്ടതിനും, അവ നിങ്ങൾക്കു രക്തപ്രതികാരകനിൽനിന്നുള്ള[b] അഭയസ്ഥാനങ്ങളായിരിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാളെ കൊന്നവൻ’. ഇവിടെ എബ്രായപദത്തെ ‘അബദ്ധത്തിൽ’, ‘അറിയാതെ’ എന്നീ പ്രയോഗങ്ങൾ വിശേഷിപ്പിക്കുന്നതിനാൽ, മനഃപൂർവം കൊലചെയ്ത ഒരാളെയല്ല ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവനിൽനിന്ന്’. ഇസ്രായേലിലെ കുടുംബബന്ധാധിഷ്ഠിത നിയമക്രമത്തിൽ ഒരു മരണത്തിന് പ്രതികാരം ചെയ്യാനുള്ള ചുമതലയുള്ള വ്യക്തിയെയാണ് ഈ എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകേണ്ടതിന്
  rationale: മുൻ കല്പനയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לָנוּס എന്ന രൂപവും ദിശാസൂചകമായ שָׁמָּהയും സ്വാഭാവിക മലയാളത്തിൽ ഉദ്ദേശ്യപ്രയോഗമായി നൽകി.
- source_word: רוֹצֵחַ
  choice: കൊന്നവൻ
  rationale: തുടർന്നുള്ള ‘അബദ്ധത്തിൽ, അറിയാതെ’ എന്നീ വിശേഷണങ്ങൾ മനഃപൂർവമല്ലാത്ത നരഹത്യയാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ ‘കൊലപാതകി’ എന്ന ഉദ്ദേശപൂർവ കുറ്റം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: מַכֵּה נֶפֶשׁ
  choice: ഒരാളെ കൊന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വ്യക്തിയെ പ്രഹരിക്കുന്നവൻ’ എന്നാണെങ്കിലും നിയമസന്ദർഭത്തിൽ മരണത്തിന് ഇടയാക്കുന്നതാണ് അർഥം; മലയാളത്തിൽ അത് വ്യക്തമായി അറിയിച്ചു.
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: അബദ്ധത്തിൽ, അറിയാതെ
  rationale: ആകസ്മികതയും അറിവോ ബോധമോ ഇല്ലായ്മയും എന്ന ബന്ധപ്പെട്ടെങ്കിലും വേറിട്ട രണ്ടു ആശയങ്ങളും നിലനിർത്തി.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: അവ നിങ്ങൾക്ക് അഭയസ്ഥാനങ്ങളായിരിക്കേണ്ടതിന്
  rationale: ബഹുവചന ക്രിയ നഗരങ്ങളെ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ מִקְלָט എന്ന ആശയം മലയാളത്തിൽ നഗരങ്ങളോട് പൊരുത്തപ്പെടുന്ന ബഹുവചനമായി നൽകി.
- source_word: מִגֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകനിൽനിന്ന്
  rationale: കുടുംബബന്ധാധിഷ്ഠിതമായ നിയമവ്യവസ്ഥയിൽ കൊല്ലപ്പെട്ടവന്റെ രക്തത്തിന് പ്രതികാരം ചെയ്യുന്ന ചുമതലയുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തി.
theological_decisions:
- issue: കൊന്നവന്റെ നിയമപരവും നൈതികവുമായ വിശേഷണം
  choice: മനഃപൂർവമല്ലാതെ മരണത്തിന് ഇടയാക്കിയ വ്യക്തി
  alternative: കൊലപാതകി
  rationale: בִּשְׁגָגָה, בִּבְלִי דָעַת എന്നീ ഇരട്ട വിശേഷണങ്ങൾ ഉദ്ദേശപൂർവമായ കൊലപാതകമല്ലെന്ന് വ്യക്തമാക്കുന്നു; അതിനാൽ ദുഷ്ടലക്ഷ്യം മുൻകൂട്ടി ആരോപിക്കുന്ന പദം ഉപയോഗിച്ചില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ സൂക്ഷ്മത നിലനിർത്തിക്കൊണ്ട് ‘കൊലപാതകി’ പോലുള്ള തെറ്റിദ്ധരിപ്പിക്കുന്ന പദം ഒഴിവാക്കി; ‘രക്തപ്രതികാരകൻ’ എന്ന സാംസ്കാരിക-നിയമപര പദത്തിന് അടിക്കുറിപ്പ് നൽകി.
