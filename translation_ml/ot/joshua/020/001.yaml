id: JOS.20.1
reference: Joshua 20:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ യോശുവയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ … അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ക്രമാനുഗതത്വം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിൽ ‘അരുളിച്ചെയ്തു’ എന്നത് ആധുനിക ബൈബിൾ മലയാളത്തിൽ ഗൗരവമുള്ളതും പരിചിതവുമായ പ്രയോഗമാണ്; ലളിതമായ ‘പറഞ്ഞു’വിനെക്കാൾ דִּבֵּר എന്ന ക്രിയയുടെ ഔപചാരിക സംസാരഭാവവും ഇത് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപദവി കൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶל
  choice: യോശുവയോടു
  rationale: ‘ഒരാളോടു സംസാരിക്കുക’ എന്ന സ്വാഭാവിക മലയാള ഘടനയിൽ എബ്രായത്തിലെ ലക്ഷ്യസൂചകമായ אֶל പ്രകടമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള ഉദ്ധരണി സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു (:)
  rationale: ഈ ക്രിയാനാമരൂപം തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ സൂത്രബദ്ധമായി പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ഇപ്രകാരം അരുളിച്ചെയ്തു:’ എന്ന ആവർത്തനത്തേക്കാൾ ദ്വിബിന്ദു അതേ പ്രവർത്തനം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ഒരു സ്ഥാനനാമമല്ല, ദൈവത്തിന്റെ ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപം നിലനിർത്തി. ‘യാഹ്‌വെ’ കൂടുതൽ പുനർനിർമിത ഉച്ചാരണരൂപമാണെങ്കിലും സാധാരണ മലയാള വായനക്കാർക്ക് ‘യഹോവ’ കൂടുതൽ സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘അപ്പോൾ’ ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു; ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ പ്രയോഗമാണ്. ഈ വാക്യത്തിൽ ആവശ്യമായ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണ അടിക്കുറിപ്പോ ഇല്ല.
