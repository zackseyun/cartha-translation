  source_fidelity: 'The draft accurately preserves the conditional case, the legal role of the blood avenger, the prohibition on surrender, the lack of intent, and the absence of prior hatred. However, the footnote''s purported literal rendering of מִתְּמוֹל שִׁלְשׁוֹם is inaccurate: it says “or” and “from before that,” whereas the Hebrew idiom is literally “from yesterday [and] the day before.”'
