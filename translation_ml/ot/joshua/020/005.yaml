  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: ml
  text: രക്തപ്രതികാരകൻ അവനെ പിന്തുടർന്നാൽ, അവർ ആ കൊന്നവനെ അവന്റെ കയ്യിൽ ഏൽപ്പിക്കരുത്; കാരണം, അവൻ മനഃപൂർവമല്ലാതെ തന്റെ കൂട്ടുകാരനെ അടിച്ചതും മുമ്പ് അവനോട് വിദ്വേഷം ഉണ്ടായിരുന്നില്ലാത്തതുമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഇന്നലെയും അതിന്റെ തലേദിവസവും മുതൽ”; മുമ്പ് എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְדֹּף
  choice: പിന്തുടർന്നാൽ
  rationale: നിയമപരമായ ഒരു സാധ്യതാസാഹചര്യമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്; മലയാളത്തിൽ സോപാധിക അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: കൊല്ലപ്പെട്ടവന്റെ രക്തത്തിന് കുടുംബത്തിന്റെ പേരിൽ പ്രതികാരം ചെയ്യുന്ന നിയമപരമായ പ്രതിനിധിയെ സൂചിപ്പിക്കുന്ന പദമാണ്; ‘രക്തപ്രതികാരകൻ’ ഈ പ്രത്യേക പങ്ക് സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יַסְגִּרוּ ... בְּיָדוֹ
  choice: അവർ ... അവന്റെ കയ്യിൽ ഏൽപ്പിക്കരുത്
  rationale: സങ്കേതനഗരത്തിലെ അധികാരികൾ അയാളെ പ്രതികാരകന്റെ അധികാരത്തിന് വിട്ടുകൊടുക്കരുതെന്ന നിയമബലം നിലനിർത്തുന്നു; ‘കയ്യിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: הָרֹצֵחַ
  choice: ആ കൊന്നവനെ
  rationale: ഈ സന്ദർഭത്തിൽ കൊല മനഃപൂർവമാണെന്ന് വിധിക്കപ്പെട്ടിട്ടില്ല. അതിനാൽ കുറ്റബോധം മുൻകൂട്ടി ചുമത്തുന്ന ‘കൊലപാതകി’ ഒഴിവാക്കി, ഒരാളെ കൊന്ന വ്യക്തി എന്ന നിഷ്പക്ഷ അർഥം നൽകുന്നു.
- source_word: בִּבְלִי דַעַת
  choice: മനഃപൂർവമല്ലാതെ
  rationale: വെറും അറിവില്ലായ്മയല്ല, പ്രവൃത്തിയിൽ ഉദ്ദേശപൂർവത ഇല്ലായിരുന്നുവെന്ന നിയമപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִכָּה
  choice: അടിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പ്രഹരിച്ചു/അടിച്ചു’ നിലനിർത്തുന്നു; മരണഫലം സന്ദർഭത്തിൽനിന്നാണ് വ്യക്തമാകുന്നത്, ക്രിയയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: רֵעֵהוּ
  choice: തന്റെ കൂട്ടുകാരനെ
  rationale: רֵעַ എന്നത് ഇവിടെ മറ്റൊരാളെയോ സഹജീവിയെയോ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ അയൽവാസിത്വം നിർബന്ധമായി സൂചിപ്പിക്കാത്ത സ്വാഭാവിക പദമാണ് ‘കൂട്ടുകാരൻ’.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: അവനോട് വിദ്വേഷവും ഉണ്ടായിരുന്നില്ല
  rationale: മുൻവൈരം ഇല്ലായിരുന്നുവെന്ന നിയമപരമായ കാര്യം വ്യക്തമായി പറയുന്നു; ‘വിദ്വേഷം’ എന്നത് ഉദ്ദേശപൂർവ കൊലയുമായി ബന്ധപ്പെട്ട വൈരത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ്
  rationale: ‘ഇന്നലെയും അതിനുമുമ്പും മുതൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം മുൻകാലത്തെ സൂചിപ്പിക്കുന്ന ഭാഷാശൈലിയാണ്; മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളമായ ‘മുമ്പ്’ ഉപയോഗിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: സങ്കേതനഗരസന്ദർഭത്തിൽ הָרֹצֵחַ എന്ന വ്യക്തിയുടെ നിയമസ്ഥിതി
  choice: ആ കൊന്നവനെ
  alternative: കൊലപാതകിയെ
  rationale: വാക്യം ഉദ്ദേശമില്ലായ്മയും മുൻവിദ്വേഷത്തിന്റെ അഭാവവും വ്യക്തമാക്കുന്നതിനാൽ, കുറ്റകരമായ മനഃപൂർവ കൊല മുൻകൂട്ടി വിധിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- issue: בִּבְלִי דַעַת എന്നതിലെ ഉത്തരവാദിത്വവും ഉദ്ദേശവും
  choice: മനഃപൂർവമല്ലാതെ
  alternative: അറിയാതെ
  rationale: ‘അറിയാതെ’ എന്നത് അറിവിന്റെ അഭാവത്തിൽ മാത്രം ഒതുങ്ങാം; ഈ നിയമസന്ദർഭത്തിൽ പ്രവൃത്തിയുടെ ഉദ്ദേശരാഹിത്യമാണ് പ്രധാനമെന്നതിനാൽ ‘മനഃപൂർവമല്ലാതെ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആഖ്യാന ശൈലി. ‘രക്തപ്രതികാരകൻ’ പോലുള്ള സന്ദർഭവിശേഷ പദം കൃത്യതയ്ക്കായി നിലനിർത്തി; ഉദ്ദേശപൂർവ കൊല സൂചിപ്പിക്കുന്ന കുറ്റാരോപക പദങ്ങൾ ഒഴിവാക്കി.
