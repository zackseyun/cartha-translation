translation_notes:
  register: ആധുനിക സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ഭാഷയാണ് ഉപയോഗിച്ചത്. ഭൂവിശേഷണങ്ങളുടെ ആവർത്തനം മൂലപാഠാനുസൃതമായി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘Naphtali’ക്കു ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് കിര്യത്ത്-അർബയെക്കുറിച്ചായതിനാൽ ബന്ധപ്പെട്ട പേരിനു ശേഷമാണ് അടയാളം സ്ഥാപിച്ചത്.
