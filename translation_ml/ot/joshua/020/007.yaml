source:
  edition: WLC
  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: ml
  text: അങ്ങനെ അവർ നഫ്താലിയുടെ മലനാട്ടിൽ, ഗലീലയിലുള്ള കേദെശും എഫ്രയീമിന്റെ മലനാട്ടിലുള്ള ശെഖേമും യെഹൂദയുടെ മലനാട്ടിലുള്ള കിര്യത്ത്-അർബയും[a]—അതായത് ഹെബ്രോൻ—പ്രത്യേകമായി നീക്കിവച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ: ‘കിര്യത്ത്-അർബ, അതു ഹെബ്രോൻ’; കിര്യത്ത്-അർബ എന്നത് ഹെബ്രോന്റെ മറ്റൊരു പേരാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: പ്രത്യേകമായി നീക്കിവച്ചു
  rationale: അഭയനഗരങ്ങളായി ഒരു പ്രത്യേക നിയമപരമായ ഉദ്ദേശ്യത്തിനുവേണ്ടി ഈ പട്ടണങ്ങളെ ഔദ്യോഗികമായി വേർതിരിക്കുന്നതാണ് സന്ദർഭം. ആരാധനാകർമപരമായ വിശുദ്ധീകരണം എന്ന അർഥം അനാവശ്യമായി മുൻനിർത്താതെ קדשׁ എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: קֶדֶשׁ
  choice: കേദെശ്
  rationale: സ്ഥലപ്പേര് വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בַּגָּלִיל
  choice: ഗലീലയിലുള്ള
  rationale: גָּלִיל എന്ന ഭൂമേഖലയുടെ മലയാളത്തിൽ പരിചിതമായ പേരായ ‘ഗലീല’ ഉപയോഗിച്ചു.
- source_word: בְּהַר נַפְתָּלִי
  choice: നഫ്താലിയുടെ മലനാട്ടിൽ
  rationale: പ്രദേശവിവരണത്തിൽ הַר ഒരു കൊടുമുടിയെയല്ല, മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘മലനാട്’ എന്നു നൽകി.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: സ്ഥലപ്പേര് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീമിന്റെ മലനാട്ടിലുള്ള
  rationale: എഫ്രയീമിനോടു ബന്ധപ്പെട്ട ഉയർന്ന ഭൂപ്രദേശമാണ് ഉദ്ദേശിക്കുന്നത്; ഒറ്റ മലയല്ല.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബ
  rationale: സ്ഥിരമായ സ്ഥലപ്പേര് അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; രണ്ട് ഘടകങ്ങളുടെ ബന്ധം വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: הִיא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോൻ
  rationale: കിര്യത്ത്-അർബയും ഹെബ്രോനും ഒരേ സ്ഥലത്തിന്റെ പേരുകളാണെന്ന് വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ഇടക്കുറിപ്പായി നൽകി.
- source_word: בְּהַר יְהוּדָה
  choice: യെഹൂദയുടെ മലനാട്ടിലുള്ള
  rationale: യെഹൂദയിലെ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മലനാട്’ എന്നു വിവർത്തനം ചെയ്തു.
