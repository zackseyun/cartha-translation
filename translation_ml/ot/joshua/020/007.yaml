  source_fidelity: മൂലഎബ്രായത്തിലെ വാക്യക്രമവും അർഥബന്ധങ്ങളും വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു. וַיַּקְדִּשׁוּ എന്ന നിയമപരമായ/ഭരണപരമായ വേർതിരിച്ചുനിയമിക്കൽ ‘പ്രത്യേകമായി നീക്കിവച്ചു’ എന്നതിലൂടെ യോജ്യമായി പ്രകടമാകുന്നു. മൂന്ന് സ്ഥലനാമങ്ങളും അവയോടു ചേർന്ന മലനാടുകളുടെ നിർദേശങ്ങളും, കിര്യത്ത്-അർബ = ഹെബ്രോൻ എന്ന വിശദീകരണവും സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: ആധുനിക സാധാരണ മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ക്രിയയെ വാക്യാന്ത്യത്തിൽ വച്ചിരിക്കുന്നത് മലയാളത്തിന്റെ സാധാരണ ശൈലിക്കു യോജിക്കുന്നു. ‘മലനാട്’ ഇവിടെ ഏകപർവതത്തെ അല്ല, പ്രദേശപരമായ ഉയർന്ന ഭൂവിഭാഗത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമാണ്.
  terminology: 'സ്ഥലപ്പേരുകളുടെ ലിപ്യന്തരണം സ്ഥിരതയുള്ളതാണ്: കേദെശ്, ശെഖേം, കിര്യത്ത്-അർബ, ഹെബ്രോൻ. ‘ഗലീല,’ ‘നഫ്താലി,’ ‘എഫ്രയീം,’ ‘യെഹൂദ’ എന്നിവയും അംഗീകരിക്കാവുന്ന ആധുനിക രൂപങ്ങളാണ്. ദൈവശാസ്ത്രപരമായ അനാവശ്യ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.'
