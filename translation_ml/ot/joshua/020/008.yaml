  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: ml
  text: യോർദ്ദാന്റെ മറുകരയിൽ, യെരീഹോവിന് കിഴക്കായി, അവർ രൂബേൻ ഗോത്രത്തിന്റെ വിഹിതത്തിൽ മരുഭൂമിയിലെ പീഠഭൂമിയിലുള്ള ബേസെരിനെയും, ഗാദ് ഗോത്രത്തിന്റെ വിഹിതത്തിൽ ഗിലെയാദിലുള്ള രാമോത്തിനെയും[a], മനശ്ശെ ഗോത്രത്തിന്റെ വിഹിതത്തിൽ ബാശാനിലുള്ള ഗോലാനെയും നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘രാമോത്ത്-ഗിലെയാദ്’ എന്നും പറയുന്നു. ഹീബ്രായത്തിൽ അക്ഷരാർഥം ‘ഗിലെയാദിലുള്ള രാമോത്ത്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: യോർദ്ദാനക്കരെ, യെരീഹോവിന് കിഴക്കായി
  rationale: കനാൻദേശത്തെ വീക്ഷണസ്ഥാനമാക്കി യോർദ്ദാന്റെ മറുകരയും യെരീഹോയുടെ കിഴക്കുഭാഗവും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתְנוּ
  choice: നിശ്ചയിച്ചു
  rationale: അഭയനഗരങ്ങളായി ഔദ്യോഗികമായി തിരഞ്ഞെടുത്ത് നിയോഗിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വെറും ‘കൊടുത്തു’ എന്നതിനെക്കാൾ ‘നിശ്ചയിച്ചു’ വ്യക്തമാണ്.
- source_word: בֶּצֶר
  choice: ബേസെർ
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: בַּמִּדְבָּר בַּמִּישֹׁר
  choice: മരുഭൂമിയിലെ പീഠഭൂമിയിലുള്ള
  rationale: מִדְבָּר കൃഷിചെയ്യാത്ത വരണ്ട പ്രദേശത്തെയും מִישׁוֹר യോർദ്ദാന്റെ കിഴക്കുള്ള നിരപ്പായ ഉയർന്ന പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִמַּטֵּה רְאוּבֵן / מִמַּטֵּה גָד / מִמַּטֵּה מְנַשֶּׁה
  choice: രൂബേൻഗോത്രത്തിന്റെ പ്രദേശത്ത് / ഗാദ്‌ഗോത്രത്തിന്റെ പ്രദേശത്ത് / മനശ്ശെഗോത്രത്തിന്റെ പ്രദേശത്ത്
  rationale: ഇവ നഗരങ്ങൾ അതത് ഗോത്രവിഹിതങ്ങളിൽപ്പെട്ടവയാണെന്ന ബന്ധം മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: ഗിലെയാദിലുള്ള രാമോത്ത്
  rationale: ഹീബ്രായ പാഠത്തിലെ നഗരനാമം + പ്രദേശം എന്ന ഘടന സംയുക്തനാമമാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: גלון בַּבָּשָׁן
  choice: ബാശാനിലുള്ള ഗോലാൻ
  rationale: സ്ഥലനാമവും അതു സ്ഥിതിചെയ്യുന്ന പ്രദേശവും ഹീബ്രായത്തിലെപ്പോലെ വേർതിരിച്ചു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ പരിചിതമായ ബൈബിൾ-മലയാള രൂപങ്ങളോട് ചേർത്ത് ലിപ്യന്തരം ചെയ്തു; ഹീബ്രായ ഭൂമിശാസ്ത്രഘടനയും ഗോത്രവിഹിതബന്ധവും വ്യക്തമായി നിലനിർത്തി.
