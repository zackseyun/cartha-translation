revisions:
- from: യോർദ്ദാനക്കരെ, യെരീഹോവിന് കിഴക്കായി, അവർ രൂബേൻഗോത്രത്തിന്റെ പ്രദേശത്ത് മരുഭൂമിയിലെ പീഠഭൂമിയിലുള്ള ബേസെരും, ഗാദ്‌ഗോത്രത്തിന്റെ പ്രദേശത്ത് ഗിലെയാദിലുള്ള രാമോത്തും[a], മനശ്ശെഗോത്രത്തിന്റെ പ്രദേശത്ത് ബാശാനിലുള്ള ഗോലാനും നിശ്ചയിച്ചു.
  to: യോർദ്ദാന്റെ മറുകരയിൽ, യെരീഹോവിന് കിഴക്കായി, അവർ രൂബേൻ ഗോത്രത്തിന്റെ വിഹിതത്തിൽ മരുഭൂമിയിലെ പീഠഭൂമിയിലുള്ള ബേസെരിനെയും, ഗാദ് ഗോത്രത്തിന്റെ വിഹിതത്തിൽ ഗിലെയാദിലുള്ള രാമോത്തിനെയും[a], മനശ്ശെ ഗോത്രത്തിന്റെ വിഹിതത്തിൽ ബാശാനിലുള്ള ഗോലാനെയും നിയമിച്ചു.
  rationale: The revision clarifies that the locations are on the far side of the Jordan, retains the Hebrew geographic and tribal-allotment relationships, and improves idiomatic Malayalam without changing the verse’s meaning or its limited traditional-name note.
