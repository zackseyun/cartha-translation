  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: ml
  text: അവൻ ന്യായവിധിക്കായി സമൂഹത്തിന്റെ മുമ്പാകെ നിൽക്കുന്നതുവരെയും[a], അക്കാലത്ത് പദവിയിലിരിക്കുന്ന മഹാപുരോഹിതൻ മരിക്കുന്നതുവരെയും, ആ നഗരത്തിൽ താമസിക്കണം. അതിനുശേഷം കൊന്നവന്[b] താൻ ഓടിപ്പോയ സ്വന്തം നഗരത്തിലേക്കും സ്വന്തം വീട്ടിലേക്കും മടങ്ങിച്ചെല്ലാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമൂഹം’ എന്നതിന് ‘സഭ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഹീബ്രായിപദം നിയമവിധിക്കായി കൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൊന്നവൻ’; ‘കൊലചെയ്തവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘കൊലപാതകി’ എന്നു പറഞ്ഞാൽ കുറ്റം വിധിക്കപ്പെട്ടുവെന്ന ധ്വനി വരാമെന്നതിനാൽ അത് മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
    reason: lexical_and_legal_distinction
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: ആ നഗരത്തിൽ താമസിക്കണം
  rationale: ישב ഇവിടെ അഭയനഗരത്തിൽ തുടർന്നു വസിക്കണമെന്ന നിയമപരമായ നിർദേശം സൂചിപ്പിക്കുന്നു; ‘താമസിക്കണം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: ന്യായവിധിക്കായി സമൂഹത്തിന്റെ മുമ്പാകെ നിൽക്കുന്നതുവരെ
  rationale: עמד לפני എന്നത് അധികാരമുള്ള സംഘത്തിന്റെ മുമ്പാകെ ഹാജരാകുക എന്ന നിയമസന്ദർഭത്തിലുള്ള പ്രയോഗമാണ്. עדהയെ ഇവിടെ വിധിനിർണയത്തിനായി കൂടിയ സമൂഹമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: അക്കാലത്ത് പദവിയിലിരിക്കുന്ന മഹാപുരോഹിതൻ മരിക്കുന്നതുവരെ
  rationale: ബന്ധവാക്യം അന്നത്തെ മഹാപുരോഹിതനെ തിരിച്ചറിയിക്കുന്നു; ‘പദവിയിലിരിക്കുന്ന’ എന്നത് മലയാളത്തിൽ ഈ ഔദ്യോഗിക-കാലിക അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הָרֹצֵחַ
  choice: കൊന്നവൻ
  rationale: רצח എന്ന പദം കൊലപ്പെടുത്തിയ വ്യക്തിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ അഭയനഗരസന്ദർഭത്തിൽ കുറ്റകരമായ കൊലപാതകം ഇതിനകം വിധിക്കപ്പെട്ടതായി പറയുന്നില്ല. ‘കൊന്നവൻ’ ആ നിയമപരമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: אָז יָשׁוּב ... וּבָא
  choice: അതിനുശേഷം ... മടങ്ങിച്ചെല്ലാം
  rationale: വ്യവസ്ഥകൾ പൂർത്തിയായശേഷമുള്ള നിയമാനുമതിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘മടങ്ങിച്ചെല്ലാം’ അനുമതിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: സ്വന്തം നഗരത്തിലേക്കും സ്വന്തം വീട്ടിലേക്കും
  rationale: പൗരസമൂഹത്തിലേക്കും കുടുംബവാസസ്ഥാനത്തിലേക്കുമുള്ള ഇരട്ട മടക്കം നിലനിർത്തുന്നു.
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: താൻ ഓടിപ്പോയ സ്വന്തം നഗരത്തിലേക്ക്
  rationale: ഹീബ്രായിയിലെ ആവർത്തനം മലയാളത്തിൽ സുഗമമായി ചേർത്തുകൊണ്ട്, അയാൾ ആദ്യം പലായനം ചെയ്ത സ്ഥലത്തേക്കാണ് മടങ്ങുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന വ്യക്തിയുടെ നിയമസ്ഥിതി
  choice: ‘കൊന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘കൊലപാതകി’
  rationale: ‘കൊലപാതകി’ എന്നത് കുറ്റകരമായ ഉദ്ദേശ്യവും വിധിക്കപ്പെട്ട കുറ്റവും സൂചിപ്പിക്കാം. അഭയനഗരനിയമത്തിന്റെ ഈ ഘട്ടത്തിൽ അത്തരം വിധി മുൻകൂട്ടി ചുമത്താതിരിക്കാൻ നിഷ്പക്ഷമായ പദം തിരഞ്ഞെടുത്തു.
- issue: മഹാപുരോഹിതന്റെ മരണശേഷമുള്ള മടക്കത്തിന്റെ സ്വഭാവം
  choice: ‘മടങ്ങിച്ചെല്ലാം’ എന്ന അനുമതിസൂചക രൂപം
  alternative: ‘മടങ്ങിച്ചെല്ലും’ എന്ന ഭാവികാല രൂപം
  rationale: നിയമസന്ദർഭം നിർബന്ധമായ സംഭവപ്രവചനം എന്നതിലുപരി നിയന്ത്രണത്തിൽനിന്നുള്ള മോചനവും മടങ്ങാനുള്ള അവകാശവും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് ഭാരമേറിയ പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി; ഹീബ്രായിയിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
