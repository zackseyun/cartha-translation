source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: ml
  text: ഇവയായിരുന്നു എല്ലാ ഇസ്രായേൽമക്കൾക്കും[a] അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിക്കും[b] വേണ്ടി നിശ്ചയിക്കപ്പെട്ട പട്ടണങ്ങൾ. അബദ്ധത്തിൽ ഒരാളെ കൊന്നവൻ അവിടേക്ക് ഓടിപ്പോകാനും, സമൂഹത്തിന്റെ[c] മുമ്പാകെ നിൽക്കുന്നതുവരെ രക്തപ്രതികാരിയുടെ കൈയാൽ മരിക്കാതിരിക്കാനും വേണ്ടിയായിരുന്നു അവ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ ഇസ്രായേല്യർക്കും.” എബ്രായത്തിൽ അക്ഷരാർഥം “എല്ലാ ഇസ്രായേൽമക്കൾക്കും.”
    reason: lexical_alternative
  - marker: b
    text: “പരദേശി” എന്നത് ഇസ്രായേൽ സമൂഹത്തിന്റെ ഇടയിൽ പാർത്തിരുന്ന ഇസ്രായേല്യനല്ലാത്ത നിവാസിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “സഭയുടെ.” ഇവിടെ ജനസമൂഹത്തിന്റെ നീതിനിർവഹണ കൂട്ടായ്മയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: നിശ്ചയിച്ച പട്ടണങ്ങൾ
  rationale: നിയമപരമായി നിയമിക്കപ്പെട്ടതോ വേർതിരിക്കപ്പെട്ടതോ ആയ പട്ടണങ്ങൾ എന്ന അർഥം നൽകുന്നു; മൂലപദസമുച്ചയത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘സങ്കേതം’ എന്ന ആശയം ഇവിടെ ചേർക്കുന്നില്ല.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾക്കും
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ദേശീയപ്രയോഗത്തിന്റെ രൂപഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശിക്കും
  rationale: גֵּר എന്നത് സമൂഹത്തിനകത്ത് താമസിക്കുന്ന അന്യദേശജനായ നിവാസിയെ സൂചിപ്പിക്കുന്നു; ‘പാർക്കുന്ന പരദേശി’ ഈ നിയമപരവും സാമൂഹികവുമായ നില സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: לָנוּס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകാനും
  rationale: נוּס എന്ന ക്രിയയിലെ അപകടത്തിൽനിന്നുള്ള പലായനത്തിന്റെ ചലനാത്മകത സ്വാഭാവികമായി പകരുന്നു.
- source_word: כָּל מַכֵּה נֶפֶשׁ בִּשְׁגָגָה
  choice: അബദ്ധത്തിൽ ഒരാളെ കൊന്നവൻ
  rationale: ‘ഒരു ജീവനെ അടിച്ചവൻ’ എന്ന എബ്രായ വ്യവഹാരം മരണകാരകമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; בִּשְׁגָגָה ഉദ്ദേശപൂർവമല്ലാത്ത പ്രവൃത്തിയെന്ന നിയമപരമായ ഭേദം വ്യക്തമാക്കുന്നു.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: കൊല്ലപ്പെട്ട ബന്ധുവിനുവേണ്ടി രക്തപ്രതികാരം നിർവഹിക്കുന്ന നിയമ-കുടുംബപങ്കിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത പദം.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ മുമ്പാകെ നിൽക്കുന്നതുവരെ
  rationale: സംരക്ഷണം നിലനിൽക്കുന്ന സമയപരിധിയും സമൂഹത്തിനു മുമ്പിലുള്ള നിയമപരമായ ഹാജരാകലും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗരൂപമുള്ള ദേശീയപ്രയോഗം
  choice: എല്ലാ ഇസ്രായേൽമക്കൾക്കും
  alternative: എല്ലാ ഇസ്രായേല്യർക്കും
  rationale: മൂലഭാഷയിലെ ‘മക്കൾ’ എന്ന ദേശീയ-വംശീയ പ്രയോഗം പ്രധാനപാഠത്തിൽ സൂക്ഷിക്കുന്നു; അത് പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതായി വ്യാഖ്യാനിക്കാതെ കൂടുതൽ സ്വാഭാവികമായ കൂട്ടനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: גֵּר എന്ന താമസക്കാരനായ പരദേശിയുടെ നിയമപദവി
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന പരദേശി
  alternative: അവരുടെ ഇടയിൽ താമസിക്കുന്ന അന്യദേശനിവാസി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനകത്ത് സ്ഥിരമായി പാർക്കുന്ന ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിക്കും ഈ നിയമസംരക്ഷണം ബാധകമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു; ആധുനിക കുടിയേറ്റവിഭാഗങ്ങൾ പാഠത്തിൽ ചുമത്തുന്നില്ല.
- issue: הָעֵדָה എന്ന നീതിനിർവഹണ സമൂഹം
  choice: സമൂഹം
  alternative: സഭ
  rationale: ഇവിടെ ആരാധനാസഭയേക്കാൾ വിധിനിർണയത്തിനായി പ്രതിനിധീകരിക്കപ്പെട്ട ജനസമൂഹമാണ് ഉദ്ദേശ്യം; ‘സമൂഹം’ ഈ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമ-വിവരണ ശൈലി. നീണ്ട എബ്രായ വാക്യം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഉദ്ദേശ്യബന്ധം ‘വേണ്ടിയായിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി.
