source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: ml
  text: യാഹ്‌വെ നിങ്ങൾക്കു നൽകിയതുപോലെ നിങ്ങളുടെ സഹോദരന്മാർക്കും[a] സ്വസ്ഥത നൽകുകയും, നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ അവർക്കു നൽകുന്ന ദേശം അവരും കൈവശമാക്കുകയും ചെയ്യുന്നതുവരെ. അതിനുശേഷം, യാഹ്‌വെയുടെ ദാസനായ മോശെ നിങ്ങൾക്കു നൽകിയ, സൂര്യോദയദിക്കിൽ യോർദ്ദാന്ന് അക്കരെയുള്ള നിങ്ങളുടെ അവകാശദേശത്തേക്കു നിങ്ങൾ മടങ്ങിച്ചെന്ന് അതു കൈവശമാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ സഹഇസ്രായേല്യർക്കും’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിങ്ങളുടെ സഹോദരന്മാർക്കും’ എന്നാണ്. ഇവിടെ ഇത് ഇസ്രായേലിലെ മറ്റു ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: സ്വസ്ഥത നൽകുകയും
  rationale: നוח എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ യുദ്ധത്തിൽനിന്നും കുടിയേറ്റത്തിലെ അനിശ്ചിതത്വത്തിൽനിന്നും ആശ്വാസവും സ്ഥിരതയും നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സ്വസ്ഥത നൽകുക’ അർഥവും സന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַאֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർക്കും
  rationale: എബ്രായത്തിൽ പുരുഷലിംഗ ബഹുവചനമായ ‘നിങ്ങളുടെ സഹോദരന്മാർ’ എന്നാണ്; മുഖ്യപാഠത്തിൽ ആ രൂപം നിലനിർത്തി, സന്ദർഭത്തിലെ വിപുലമായ ഗോത്രപരമായ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּכֶם
  choice: നിങ്ങളെപ്പോലെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ താരതമ്യം (‘നിങ്ങളെപ്പോലെ’) മലയാളത്തിലും അർഥഗ്രാഹ്യമായതിനാൽ അതിലെ സങ്കുചിതത്വം അനാവശ്യമായി വികസിപ്പിച്ചിട്ടില്ല.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם
  choice: കൈവശമാക്കുകയും / കൈവശമാക്കണം
  rationale: ירשׁ ഇവിടെ അനുവദിച്ചുകിട്ടിയ പ്രദേശം യാഥാർഥ്യമായി അധീനമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കൈവശമാക്കുക’ സൈനിക-അവകാശ പശ്ചാത്തലത്തിലെ സജീവതയും ഉടമസ്ഥതയും പ്രകടമാക്കുന്നു.
- source_word: נֹתֵן
  choice: നൽകുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം തുടരുന്നതോ ആസന്നമായതോ ആയ ദൈവിക ദാനത്തെ സൂചിപ്പിക്കുന്നു; ‘നൽകുന്ന’ അതിന്റെ കാലഭാവം നിലനിർത്തുന്നു.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: നിങ്ങളുടെ അവകാശദേശം
  rationale: ഈ പ്രയോഗം അവർക്കു ഓഹരിയായി ലഭിച്ച ഭൂമിയെ സൂചിപ്പിക്കുന്നു; ‘അവകാശദേശം’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: നദിയുടെ മറുവശത്തെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗം; ദിശയുടെ വീക്ഷണകേന്ദ്രം സന്ദർഭം നിർണ്ണയിക്കട്ടെയെന്നതിനാൽ കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: സൂര്യോദയദിക്കിൽ
  rationale: അക്ഷരാർഥത്തിലെ സൂര്യോദയചിത്രം നിലനിർത്തിക്കൊണ്ട് കിഴക്കുദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ഉടമ്പടിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: אֲחֵיכֶם എന്ന ലിംഗസൂചക ബന്ധുപദം
  choice: നിങ്ങളുടെ സഹോദരന്മാർ
  alternative: നിങ്ങളുടെ സഹഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെന്ന കാര്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: עֶבֶד יְהוָה എന്ന മോശെയുടെ വിശേഷണം
  choice: യാഹ്‌വെയുടെ ദാസൻ
  alternative: യാഹ്‌വെയുടെ അടിമ
  rationale: ഇത് മോശെയുടെ ഔദ്യോഗികവും ബഹുമാനസൂചകവുമായ ദൈവസേവനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മുൻവാക്യത്തിൽ ആരംഭിച്ച കാലപരിധിയെ തുടരുമെന്നതിനാൽ വാക്യം ‘...ചെയ്യുന്നതുവരെ’ എന്ന ആശ്രിതഘടനയിൽ നിലനിർത്തി. ദൈവനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ഭൂമിശാസ്ത്രപരമായ സൂര്യോദയചിത്രവും അവകാശം കൈവശമാക്കുന്ന സജീവ അർഥവും സംരക്ഷിച്ചു.
