id: JOS.1.1
reference: Joshua 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ ദാസനായ മോശെയുടെ മരണശേഷം, മോശെയുടെ ശുശ്രൂഷകനായ നൂന്റെ മകൻ യോശുവയോട് യഹ്‌വേ അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: മരണശേഷം
  rationale: കഥാഖ്യാനത്തിന്റെ പശ്ചാത്തലം സ്ഥാപിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ കാലസൂചനയായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വേയുടെ ദാസൻ
  rationale: മോശെയുടെ ദൈവിക സേവനത്തെയും ബഹുമാന്യമായ ഔദ്യോഗിക സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവ
  rationale: ഹീബ്രായ പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: മോശെയുടെ ശുശ്രൂഷകൻ
  rationale: മോശെയെ സഹായിച്ചും പരിചരിച്ചും സേവിച്ച വ്യക്തിയെന്ന പങ്ക് വ്യക്തമാക്കുന്നു; പിൽക്കാല സഭാപദവിയുടെ അർഥം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തത്
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്നതിന് മലയാള ബൈബിൾ ഗദ്യത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ദ്വിബിന്ദു അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: മോശെയുടെ പദവിയിലെ עֶבֶד
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഇവിടെ പദം ബന്ധിതാവസ്ഥയെക്കാൾ യഹ്‌വേയ്ക്കുള്ള ബഹുമാന്യമായ സേവനപദവിയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: מְשָׁרֵת എന്ന പദത്തിന്റെ പങ്കുസൂചന
  choice: ശുശ്രൂഷകൻ
  alternative: പരിചാരകൻ / സഹായി / സേവകൻ
  rationale: മോശെയോടൊപ്പം നിന്ന് സേവിക്കുകയും സഹായിക്കുകയും ചെയ്ത യോശുവയുടെ പങ്ക് നിലനിർത്തുന്നു; പദത്തിന്റെ പരിചരണം, സഹായം, സേവനം എന്നീ അർഥവ്യാപ്തികളെ പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ബൈബിൾ ഗദ്യം. ആവർത്തിച്ചിരിക്കുന്ന ‘മോശെ’ എന്ന പേര് മൂലപാഠത്തിലെ രണ്ട് വ്യത്യസ്ത ബന്ധങ്ങൾ—യഹ്‌വേയുടെ ദാസൻ, യോശുവ ശുശ്രൂഷിച്ച വ്യക്തി—വ്യക്തമായി നിലനിർത്താൻ സംരക്ഷിച്ചു.
