id: JOS.1.9
reference: Joshua 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: ml
  text: ഞാൻ നിന്നോടു കൽപിച്ചിട്ടില്ലയോ? ശക്തനും ധൈര്യവാനും ആയിരിക്കുക. ഭയന്ന് വിറയ്ക്കരുത്; പരിഭ്രമിക്കരുത്. കാരണം, നീ പോകുന്നിടത്തെല്ലാം നിന്റെ ദൈവമായ യഹ്‌വെ[a] നിന്നോടുകൂടെ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ YHWH (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു. ഇവിടെ ‘യഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: ദൈവനാമത്തിന്റെ ലിപ്യന്തരണവും പരമ്പരാഗത പകരംവായനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: הֲלֹוא צִוִּיתִיךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചിട്ടില്ലയോ?
  rationale: നിഷേധത്തോടുകൂടിയ അലങ്കാരചോദ്യം കല്പനയെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിലെ ഈ രൂപം അതിന്റെ ചോദ്യംഭാവവും ശക്തമായ ഓർമ്മപ്പെടുത്തലും നിലനിർത്തുന്നു.
- source_word: חֲזַק וֶאֱמָץ
  choice: ശക്തനും ധൈര്യവാനും ആയിരിക്കുക
  rationale: חזק, אמץ എന്നീ സമാന്തര കല്പനകൾ യഥാക്രമം ശക്തിയെയും ധൈര്യത്തെയും സൂചിപ്പിക്കുന്നു; ആവർത്തനമാക്കാതെ രണ്ടിന്റെയും വ്യത്യസ്ത ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אַל תַּעֲרֹץ
  choice: ഭയന്നുവിറയ്ക്കരുത്
  rationale: ערץ സാധാരണ ഭയത്തേക്കാൾ ശക്തമായ നടുക്കത്തെയും ഭീതിയെയും സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ആ തീവ്രത പ്രകടമാക്കുന്നു.
- source_word: וְאַל תֵּחָת
  choice: പരിഭ്രമിക്കുകയും അരുത്
  rationale: חתת എന്ന പദത്തിന് തകർന്നുപോകുക, ഭ്രമിച്ചുപോകുക, നിരുത്സാഹപ്പെടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ സമാന്തരമായ മാനസിക തളർച്ചയെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘പരിഭ്രമിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: כִּי עִמְּךָ
  choice: നിന്നോടുകൂടെ ഉണ്ടല്ലോ
  rationale: כִּי തുടർന്നുള്ള ദൈവസാന്നിധ്യം കല്പനകളുടെ അടിസ്ഥാനമായി അവതരിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ അലങ്കാരചോദ്യത്തോടു ചേർന്ന് മലയാളത്തിൽ ‘ഉണ്ടല്ലോ’ കാരണവും ഉറപ്പും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה ഒരു പദവിയാൽ മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֶיךָ എന്നത് ഏകവചന അഭിസംബോധനയോടെ ‘നിന്റെ ദൈവമായ’ എന്നു നൽകി.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: നീ പോകുന്നിടത്തെല്ലാം
  rationale: യോശുവ പോകുന്ന എല്ലാ ഇടങ്ങളെയും സാഹചര്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: כִּי എന്ന കാരണബന്ധത്തിന്റെ അവതരണം
  choice: ഉണ്ടല്ലോ
  alternative: എന്തെന്നാൽ ... ഉണ്ട്
  rationale: ദൈവസാന്നിധ്യമാണ് മുൻകല്പനകളുടെ അടിസ്ഥാനം. ‘ഉണ്ടല്ലോ’ എന്ന രൂപം ആ കാരണബലവും ആശ്വാസകരമായ ഉറപ്പും മലയാളത്തിൽ നിലനിർത്തുന്നു; സ്വതന്ത്രമായ പുതിയ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും വചനത്തിന്റെ ഗൗരവവും കല്പനകളുടെ ശക്തിയും നിലനിർത്തുന്ന ശൈലി. യോശുവയോടുള്ള ഏകവചന അഭിസംബോധന തുടർച്ചയായി പാലിച്ചു.
