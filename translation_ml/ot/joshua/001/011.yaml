source:
  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: ml
  text: 'പാളയത്തിന്റെ നടുവിലൂടെ കടന്നുചെന്ന് ജനത്തോട് ഇങ്ങനെ കല്പിക്കുവിൻ: ‘നിങ്ങൾക്കുവേണ്ടി യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ ഒരുക്കിക്കൊള്ളുവിൻ. കാരണം, മൂന്നു ദിവസത്തിനകം[a] നിങ്ങൾ ഈ യോർദാൻ കടന്ന്, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു കൈവശമാക്കാൻ തരുന്ന ദേശം കൈവശമാക്കുന്നതിനായി അതിൽ പ്രവേശിക്കും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മൂന്നു ദിവസംകൂടി കഴിഞ്ഞ്” അല്ലെങ്കിൽ “മൂന്നു ദിവസത്തിനുശേഷം” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗം യോർദാൻ കടക്കുന്നതിനു മുമ്പ് ശേഷിക്കുന്ന ഹ്രസ്വകാലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: പാളയത്തിന്റെ നടുവിലൂടെ കടന്നുചെന്ന്
  rationale: עִבְרוּ എന്ന ബഹുവചന കല്പനയുടെയും קֶרֶב എന്ന ‘നടുവ്/ഉൾഭാഗം’ എന്ന സ്ഥലസൂചനയുടെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְצַוּוּ אֶת־הָעָם לֵאמֹר
  choice: ജനത്തോട് ഇങ്ങനെ കല്പിക്കുവിൻ
  rationale: צוה എന്ന പദത്തിന്റെ ആധികാരികമായ ‘കല്പിക്കുക’ എന്ന ശക്തിയും לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: നിങ്ങൾക്കുവേണ്ടി യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ ഒരുക്കിക്കൊള്ളുവിൻ
  rationale: צֵידָה സാധാരണ ഭക്ഷണം മാത്രമല്ല, യാത്രയ്ക്കായി കരുതുന്ന ആഹാരസാധനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; לָכֶם എന്ന ആത്മപ്രയോജനസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തിനകം
  rationale: ഇനിയും ശേഷിക്കുന്ന ഹ്രസ്വകാലത്തിനുശേഷം സംഭവം നടക്കുമെന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം നൽകുന്നു; കാലപ്രയോഗത്തിലെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן הַזֶּה
  choice: നിങ്ങൾ ഈ യോർദാൻ കടന്ന്
  rationale: הַזֶּה എന്ന സമീപസൂചകത്തിന്റെ ‘ഈ’ നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘ആനിരിക്കുകയാണ്’ എന്ന രൂപം עֹבְרִים എന്ന കൃതന്തത്തിന്റെ ആസന്നഭാവം വാക്യത്തിന്റെ സമാപനത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: ദേശത്തിൽ പ്രവേശിച്ച് അതു കൈവശമാക്കാൻ
  rationale: പ്രവേശനവും കൈവശപ്പെടുത്തലും എന്ന ബന്ധിത ലക്ഷ്യങ്ങളെ വ്യക്തമായി നൽകുന്നു; ירשׁ എന്ന പദത്തിന്റെ അവകാശ/ജയസന്ദർഭത്തിലുള്ള ശക്തി ‘കൈവശമാക്കുക’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: നിങ്ങൾക്കു കൈവശമാക്കാൻ തരുന്ന … അതു കൈവശമാക്കാനിരിക്കുകയാണ്
  rationale: നֹתֵן എന്ന കൃതന്തത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്നതും ഉറപ്പുള്ളതുമായ ദാനഭാവം ‘തരുന്ന’ എന്നു നൽകുന്നു; ירשׁ എന്ന പദത്തിന്റെ ആവർത്തനം കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമമായ יהוה മറച്ചുവയ്ക്കാതെ, ‘Yahweh’ എന്ന രൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദേശം ദൈവം തരുന്നതും ജനങ്ങൾ കൈവശമാക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വെ തരുന്ന ദേശം ജനങ്ങൾ പ്രവേശിച്ച് കൈവശമാക്കുന്നു
  alternative: ദൈവദാനത്തെ മാത്രം അല്ലെങ്കിൽ മനുഷ്യജയത്തെ മാത്രം മുൻനിർത്തുന്ന രൂപം
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ദാനവും ജനങ്ങളുടെ പ്രവേശന-കൈവശപ്പെടുത്തൽ പ്രവർത്തിയും ഒരുമിച്ച് പ്രസ്താവിക്കുന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്യോഗസ്ഥരോടുള്ള ബഹുവചന കല്പനയ്ക്ക് ‘കല്പിക്കുവിൻ’, ജനങ്ങളോടുള്ള ഉദ്ധരിച്ച കല്പനയ്ക്ക് ‘ഒരുക്കിക്കൊള്ളുവിൻ’ എന്നിവ ഉപയോഗിച്ചു. സ്ഥലനാമം ‘യോർദാൻ’ എന്നും ദൈവനാമം ‘യഹ്‌വെ’ എന്നും ലിപ്യന്തരിച്ചു.
