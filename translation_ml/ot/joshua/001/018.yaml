source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: ml
  text: നിന്റെ ആജ്ഞയെ ധിക്കരിക്കുകയും നീ അവനോടു കൽപ്പിക്കുന്ന സകലത്തിലും നിന്റെ വാക്കുകൾ അനുസരിക്കാതിരിക്കുകയും ചെയ്യുന്ന ഏതൊരുവനും വധിക്കപ്പെടണം.[a] എന്നാൽ, നീ ശക്തനും ധൈര്യവാനും ആയിരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ വായോടു മത്സരിക്കുന്ന ഓരോ പുരുഷനും.” ഇവിടെ “നിന്റെ വായ്” എന്ന എബ്രായ പ്രയോഗം നിന്റെ ആജ്ഞയെയോ അധികാരപൂർവമായ വാക്കിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: ഏതൊരുവനും
  rationale: ‘ഓരോ പുരുഷനും’ എന്ന വിതരണാർഥമുള്ള എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തിനിഷ്ഠവും പുല്ലിംഗസൂചന നിലനിർത്തുന്നതുമായ വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יַמְרֶה אֶת פִּיךָ
  choice: നിന്റെ ആജ്ഞയെ ധിക്കരിക്കുകയും
  rationale: יַמְרֶה അധികാരത്തോടുള്ള മത്സരമോ ധിക്കാരമോ സൂചിപ്പിക്കുന്നു; ‘നിന്റെ വായ്’ എന്ന അക്ഷരാർഥപ്രയോഗം ഇവിടെ അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആജ്ഞ’ എന്നു നൽകി.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: നിന്റെ വാക്കുകൾ അനുസരിക്കാതിരിക്കുകയും
  rationale: שׁמע ഇവിടെ കേൾക്കുക എന്നതിലുപരി ശ്രദ്ധിച്ചു അനുസരിക്കുക എന്ന അർഥത്തിലാണ്; സ്വാഭാവിക മലയാളത്തിന് ‘അനുസരിക്കുക’ അനുയോജ്യം.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: നീ അവനോടു കല്പിക്കുന്ന ഒന്നിലും
  rationale: ആവശ്യപ്പെടുന്ന അനുസരണത്തിന്റെ സമഗ്രമായ വ്യാപ്തി വ്യക്തമാക്കുകയും എബ്രായത്തിലെ വ്യക്തിവാചക പ്രത്യയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יוּמָת
  choice: വധിക്കപ്പെടണം
  rationale: ഈ ഹോഫാൽ രൂപം സ്വാഭാവികമരണം അല്ല, അധികാരപൂർവം നടപ്പാക്കുന്ന മരണശിക്ഷയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: רַק חֲזַק וֶאֱמָץ
  choice: നീ മാത്രം ശക്തനും ധൈര്യവാനും ആയിരിക്കുക
  rationale: רַק-ന്റെ ഊന്നലും പരിധിനിർണയവും ‘മാത്രം’ വഴി നിലനിർത്തുന്നു; ആവർത്തിച്ചുവരുന്ന പ്രബോധനം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: ലിംഗസൂചനയുള്ള പ്രതിനിധിപ്രയോഗം
  choice: ഏതൊരുവനും
  alternative: ആരെങ്കിലും / ഓരോ വ്യക്തിയും
  rationale: אִישׁ പുല്ലിംഗ ഏകവചനമാണ്. മലയാളത്തിൽ ‘ഏതൊരുവനും’ വിതരണാർഥവും ലിംഗരൂപവും നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിലെ പൊതുവായ ബാധകത പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: മരണശിക്ഷയുടെ നിയമപരമായ സ്വഭാവം
  choice: വധിക്കപ്പെടണം
  alternative: മരിക്കും / മരണശിക്ഷയ്ക്ക് വിധേയനാകണം
  rationale: יוּמָת ഏർപ്പെടുത്തപ്പെടുന്ന മരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വെറും ‘മരിക്കും’ എന്നതിനെക്കാൾ നിയമപരമായ ശക്തി സംരക്ഷിക്കുന്നു; നടപടിക്രമത്തെക്കുറിച്ചുള്ള അധികവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. നിയമപരമായ ഗൗരവവും യോശുവയോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തി; അമിതമായ അക്ഷരാനുവാദം ഒഴിവാക്കി എബ്രായ പ്രയോഗത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
