source:
  edition: WLC
  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: ml
  text: എന്റെ ദാസനായ മോശെ മരിച്ചു. അതുകൊണ്ട് ഇപ്പോൾ, നീയും ഈ ജനമെല്ലാം, ഈ യോർദ്ദാൻ കടക്കുക; ഞാൻ അവർക്കു, ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്[a], നൽകുന്ന ദേശത്തേക്കു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യർക്ക്’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽമക്കൾക്ക്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: എന്റെ ദാസൻ
  rationale: ഇവിടെ עֶבֶד ദൈവത്തോടുള്ള മോശെയുടെ ബന്ധത്തെ ബഹുമാനപൂർവം വിശേഷിപ്പിക്കുന്നു; അടിമത്തത്തിന്റെ ഭാവം മുൻനിർത്താതെ ‘ദാസൻ’ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: മോശെയുടെ മരണം ഇപ്പോഴത്തെ യാഥാർഥ്യമായി പ്രസ്താവിക്കുന്ന എബ്രായ രൂപത്തിന്റെ നേരിട്ടുള്ളതും ശക്തവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മോശെയുടെ മരണത്തിൽനിന്ന് യോശുവയുടെ നിയോഗത്തിലേക്കുള്ള മാറ്റവും അതിലെ അനന്തരഫലഭാവവും ഒരുമിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: קוּם
  choice: എഴുന്നേൽക്കുക
  rationale: നിർണായകമായ പ്രവർത്തനത്തിലേക്കുള്ള ദൈവിക ആഹ്വാനം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ പകരുന്നു.
- source_word: עֲבֹר
  choice: കടന്ന് ... പോകുക
  rationale: യോർദ്ദാൻ നേരിട്ടുള്ള കർമമായതിനാൽ ‘കടക്കുക’ എന്ന അർഥമാണ് സന്ദർഭോചിതം; മലയാളത്തിലെ ലക്ഷ്യദിശ സ്വാഭാവികമാക്കാൻ ‘കടന്ന് ... പോകുക’ എന്നു രൂപപ്പെടുത്തി.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: ഈ യോർദ്ദാൻ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ നിർദേശകപദം ‘ഈ’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നദി’ ചേർക്കുന്നില്ല.
- source_word: אַתָּה וְכָל הָעָם הַזֶּה
  choice: നീയും ഈ ജനമെല്ലാം
  rationale: ‘ജനം’ എന്ന സമൂഹവാചക ഏകവചനവും ‘ഈ’ എന്ന നിർദേശകവും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: אֶל הָאָרֶץ
  choice: ദേശത്തേക്ക്
  rationale: ചലനസന്ദർഭത്തിലെ אֶל ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദേശത്തേക്ക്’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: ഞാൻ അവർക്കു ... നൽകുന്ന
  rationale: נֹתֵן എന്ന കൃദന്തരൂപത്തിലെ നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ സാക്ഷാത്കരിക്കപ്പെടുന്നതോ ആയ ദാനഭാവം ‘നൽകുന്ന’ എന്ന രൂപം സൂക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർക്ക്
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ ബഹുവചനരൂപം സുതാര്യമായി നിലനിർത്തുന്നു; സമൂഹം മുഴുവനാണ് ഉദ്ദേശ്യമെന്നത് അടിക്കുറിപ്പിലെ സ്വാഭാവിക പകരങ്ങൾ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിലെ ലിംഗസൂചന
  choice: ഇസ്രായേൽപുത്രന്മാർക്ക്
  alternative: ഇസ്രായേല്യർക്ക് / ഇസ്രായേൽമക്കൾക്ക്
  rationale: മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന പുരുഷലിംഗരൂപം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ദൈവിക നിയോഗശൈലി സ്വീകരിച്ചു. ‘എഴുന്നേൽക്കുക,’ ‘യോർദ്ദാൻ,’ ‘ദേശം’ എന്നിവ ഔന്നത്യം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. ദീർഘവാക്യത്തിലെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ അർദ്ധവിരാമവും ഇടവരകളും ഉപയോഗിച്ചു.
