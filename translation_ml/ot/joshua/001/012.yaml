  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ജാതിനാമങ്ങൾ സ്വാഭാവികമായ ബഹുവചനത്തിൽ നൽകി; അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന പ്രസംഗാരംഭം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കി.
