base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: ml
  text: രൂബേന്യരോടും ഗാദ്യരോടും മനശ്ശെയുടെ പകുതിഗോത്രത്തോടും യോശുവ പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ അക്ഷരാർഥം: “പറഞ്ഞുകൊണ്ട്.” യോശുവയുടെ വാക്കുകൾ അടുത്ത വാക്യത്തിൽ ആരംഭിക്കുന്നുവെന്ന് ഈ പദം സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: രൂബേന്യരോടും
  rationale: ജാതിനാമത്തിന്റെ ഏകവചനരൂപം ഇവിടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായ ‘രൂബേന്യർ’ ഉപയോഗിച്ചു; ല്‍ എന്ന ഉപസർഗത്തിന്റെ അഭിസംബോധനാർഥം ‘-ഓട്’കൊണ്ടും וְ ‘-ഉം’കൊണ്ടും പ്രകടമാക്കി.
- source_word: וְ/לַ/גָּדִי
  choice: ഗാദ്യരോടും
  rationale: എബ്രായത്തിലെ ജാതിനാമ ഏകവചനം കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ ‘ഗാദ്യർ’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പകുതിഗോത്രത്തോടും
  rationale: ഘടനാപരമായി ‘മനശ്ശെയുടെ ഗോത്രത്തിന്റെ പകുതി’ എന്നാണ് അർഥം; പതിവും സംക്ഷിപ്തവുമായ ‘പകുതിഗോത്രം’ ആ ആശയം കൃത്യമായി നൽകുന്നു.
- source_word: אָמַר
  choice: പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ പ്രസ്താവനാക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥാപിതമായ പേരുരൂപം നിലനിർത്തി.
- source_word: לֵאמֹר
  choice: :[a]
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ‘പറഞ്ഞുകൊണ്ട്/ഇപ്രകാരം’ എന്ന ഘടകം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു; ഉറവിടത്തിലെ രൂപം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
