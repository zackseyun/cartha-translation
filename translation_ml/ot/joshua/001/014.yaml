  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: ml
  text: നിങ്ങളുടെ ഭാര്യമാരും കുഞ്ഞുങ്ങളും കന്നുകാലികളും മോശെ നിങ്ങൾക്കു നൽകിയ യോർദാന്റെ മറുകരയിലുള്ള ദേശത്തു താമസിക്കട്ടെ. എന്നാൽ നിങ്ങളിലുള്ള എല്ലാ യുദ്ധവീരന്മാരും ആയുധസജ്ജരായി[a] നിങ്ങളുടെ സഹോദരന്മാർക്കു[b] മുമ്പായി കടന്നുചെന്ന് അവരെ സഹായിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യുദ്ധനിരയായി’ അല്ലെങ്കിൽ ‘യുദ്ധത്തിനൊരുങ്ങി.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘നിങ്ങളുടെ സഹഇസ്രായേല്യർക്കു’; എബ്രായപാഠം പുരുഷലിംഗ ബന്ധുത്വപദം പ്രതിനിധാനാർഥത്തിൽ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: നിങ്ങളുടെ ഭാര്യമാർ
  rationale: ഈ കുടുംബ-സൈനിക സന്ദർഭത്തിൽ പദം പൊതുവായി സ്ത്രീകളെയല്ല, അഭിസംബോധന ചെയ്യപ്പെടുന്ന പുരുഷന്മാരുടെ ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: טַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾ
  rationale: טַף ചെറിയ കുട്ടികളെയോ കുടുംബത്തിലെ ആശ്രിതരെയോ സൂചിപ്പിക്കാം; ഇവിടെ ‘കുഞ്ഞുങ്ങൾ’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וּמִקְנֵיכֶם
  choice: നിങ്ങളുടെ കന്നുകാലികൾ
  rationale: מִקְנֶה ഇവിടെ വളർത്തുമൃഗങ്ങളെയും ആട്ടിൻപറ്റം, മാടിൻകൂട്ടം തുടങ്ങിയ സമ്പത്തിനെയും സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ മലയാളത്തിൽ ഈ കൂട്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֵשְׁבוּ
  choice: പാർക്കട്ടെ
  rationale: משב എന്ന ക്രിയയുടെ താമസിക്കുക/അവിടെത്തന്നെ തുടരുക എന്ന ആശയം ഈ നിർദേശസന്ദർഭത്തിൽ ‘പാർക്കട്ടെ’ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാനക്കരെ
  rationale: עֵבֶר ദിശ കൃത്യമായി വിശദീകരിക്കാതെ യോർദാന്റെ മറുകരയിലെ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘യോർദാനക്കരെ’ അതേ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: חֲמֻשִׁים
  choice: ആയുധസജ്ജരായി
  rationale: സൈനികസന്ദർഭത്തിൽ യുദ്ധത്തിന് ആയുധമണിഞ്ഞോ സജ്ജമായോ ഇരിക്കുക എന്നതാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം; പദത്തിന്റെ സൂക്ഷ്മതയിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർക്കു മുമ്പായി
  rationale: ലക്ഷ്യമാക്കപ്പെടുന്ന സഹഇസ്രായേല്യർക്കു മുന്നിൽ സൈനികർ കടന്നുപോകണം എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: നിങ്ങളിലെ എല്ലാ യുദ്ധവീരന്മാരും
  rationale: ഈ പ്രയോഗം ശക്തരും കഴിവുറ്റവരുമായ പോരാളികളെ സൂചിപ്പിക്കുന്നു; ‘യുദ്ധവീരന്മാർ’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: അവരെ സഹായിക്കണം
  rationale: തുടരുന്ന നിർദേശത്തിന്റെ ബാധ്യത മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֲחֵיכֶם എന്ന പദത്തിലെ ലിംഗസൂചക ബന്ധുത്വഭാഷ
  choice: നിങ്ങളുടെ സഹോദരന്മാർ
  alternative: നിങ്ങളുടെ സഹഇസ്രായേല്യർ
  rationale: എബ്രായപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധുത്വപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭത്തിൽ അതിന് വിശാലമായ ഉടമ്പടിസമൂഹസൂചനയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: חֲמֻשִׁים എന്ന സൈനിക വിശേഷണം
  choice: ആയുധസജ്ജരായി
  alternative: യുദ്ധനിരയായി / യുദ്ധത്തിനൊരുങ്ങി
  rationale: യുദ്ധോപകരണങ്ങളോടെ സജ്ജരാകുക എന്ന അർഥമാണ് ഈ സന്ദർഭത്തിൽ ഏറ്റവും സാധ്യതയുള്ളത്; കൃത്യമായ സൂക്ഷ്മാർഥം വിവാദവിധേയമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കുടുംബാംഗങ്ങൾ അവിടെ തുടരുന്നതും യുദ്ധവീരന്മാർ മുന്നിൽ കടക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ നിങ്ങളോ’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
