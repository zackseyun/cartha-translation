id: JOS.1.7
reference: Joshua 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: ml
  text: 'ഒന്നുമാത്രം: നീ ശക്തനും വളരെ ധൈര്യമുള്ളവനും ആയിരിക്കുക. എന്റെ ദാസനായ മോശെ നിന്നോടു കല്പിച്ച നിയമം മുഴുവനും അനുസരിച്ച് പ്രവർത്തിക്കാൻ ശ്രദ്ധിക്കുക. അതിൽനിന്ന് വലത്തോട്ടോ ഇടത്തോട്ടോ വ്യതിചലിക്കരുത്. അങ്ങനെ, നീ പോകുന്നിടത്തെല്ലാം വിവേകത്തോടെ പ്രവർത്തിക്കേണ്ടതിൽ വിജയിക്കാം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ പോകുന്നിടത്തെല്ലാം വിജയം പ്രാപിക്കാം” അഥവാ “അഭിവൃദ്ധി പ്രാപിക്കാം.”
    reason: תַּשְׂכִּיל എന്ന പദത്തിന് വിവേകത്തോടെ പ്രവർത്തിക്കുക എന്ന മുഖ്യഅർഥത്തോടൊപ്പം വിജയിക്കുക അല്ലെങ്കിൽ അഭിവൃദ്ധി പ്രാപിക്കുക എന്ന അർഥനിറവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രോത്സാഹനത്തെ തുടർന്നുള്ള ഊന്നിയ ആഹ്വാനമായി ഇത് പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘എന്നാൽ’ ഈ പ്രസംഗബന്ധം സ്വാഭാവികമായി നൽകുന്നു; വെറും ‘മാത്രം’ എന്നത് ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: നീ ശക്തനും വളരെ ധൈര്യമുള്ളവനും ആയിരിക്കുക
  rationale: രണ്ട് ആജ്ഞകളും യഥാക്രമം ശക്തിയും ഉറച്ച ധൈര്യവും സൂചിപ്പിക്കുന്നു; מְאֹד നൽകുന്ന തീവ്രത ‘വളരെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: അനുസരിച്ച് പ്രവർത്തിക്കാൻ ശ്രദ്ധിക്കുക
  rationale: ശ്രദ്ധയോടെ കാത്തുപാലിക്കുന്നതും അതനുസരിച്ച് ചെയ്യുന്നതും ഉൾപ്പെടുന്ന ക്രിയാശൃംഖലയെ സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּכָל הַתּוֹרָה
  choice: നിയമം മുഴുവനും
  rationale: സന്ദർഭത്തിൽ മോശെയിലൂടെ ലഭിച്ച ഉടമ്പടിനിയമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മുഴുവനും’ അതിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: എന്റെ ദാസനായ മോശെ നിന്നോടു കല്പിച്ച
  rationale: ബന്ധവാക്യവും മോശെയെക്കുറിച്ചുള്ള ദൈവിക വിശേഷണവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: അതിൽനിന്ന് വലത്തോട്ടോ ഇടത്തോട്ടോ വ്യതിചലിക്കരുത്
  rationale: നിർദേശിക്കപ്പെട്ട വഴിയിൽനിന്നുള്ള മാറ്റത്തെ സൂചിപ്പിക്കുന്ന ദിശാരൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְמַעַן
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: תַּשְׂכִּיל
  choice: വിവേകത്തോടെ പ്രവർത്തിക്കാം
  rationale: ഹിഫീൽ രൂപത്തിന്റെ മുഖ്യമായ വിവേകപൂർവമായ പ്രവർത്തനം എന്ന അർഥം മുൻനിർത്തുന്നു; അതിൽ ഉൾക്കൊള്ളാവുന്ന വിജയത്തിന്റെ അർഥനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: നീ പോകുന്നിടത്തെല്ലാം
  rationale: הלך എന്ന ‘പോകുക/നടക്കുക’ എന്ന ക്രിയയും സമഗ്രമായ വ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിലെ תּוֹרָה എന്ന പദത്തിന്റെ അർഥം
  choice: നിയമം
  alternative: പ്രബോധനം
  rationale: മോശെ കല്പിച്ചതിനെക്കുറിച്ചാണ് ഈ വാക്യം പ്രത്യേകമായി പറയുന്നത്; അതിനാൽ ഉടമ്പടിസംബന്ധമായ നിയമം എന്ന അർഥമാണ് ഇവിടെ പ്രാഥമികം. പദത്തിന്റെ വിശാലമായ ‘പ്രബോധനം’ എന്ന അർഥം അനാവശ്യമായി മുൻനിർത്തിയിട്ടില്ല.
- issue: תַּשְׂכִּיל എന്ന പദത്തിന്റെ അർഥം
  choice: വിവേകത്തോടെ പ്രവർത്തിക്കാം
  alternative: വിജയം പ്രാപിക്കാം; അഭിവൃദ്ധിയുണ്ടാകാം
  rationale: എബ്രായപദം വിവേകപൂർവമായ പ്രവർത്തനത്തെയും അതിന്റെ ഫലമായ വിജയത്തെയും സൂചിപ്പിക്കാം. ഭൗതിക അഭിവൃദ്ധി എന്ന ആശയം മുഖ്യപാഠത്തിൽ അമിതമായി ഉറപ്പിക്കാതിരിക്കാൻ വിവേകത്തിന്റെ അർഥം സ്വീകരിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നിയമം’ എന്നത് സന്ദർഭപരമായ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു; ദിശാരൂപകവും ജ്ഞാനം-വിജയം എന്ന അർഥപിരിമുറുക്കവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുശേഷം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
