source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: ml
  text: ഈ ന്യായപ്രമാണപുസ്തകം നിന്റെ വായിൽനിന്ന് വിട്ടുപോകരുത്. അതിൽ എഴുതിയിരിക്കുന്നതെല്ലാം അനുസരിച്ച് ശ്രദ്ധയോടെ പ്രവർത്തിക്കേണ്ടതിന് നീ രാവും പകലും അതിനെക്കുറിച്ച് ധ്യാനിക്കണം[a]. അപ്പോൾ നീ നിന്റെ വഴി വിജയകരമാക്കുകയും വിവേകത്തോടെ പ്രവർത്തിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് പതുക്കെ ഉരുവിടണം” അല്ലെങ്കിൽ “അത് മന്ദമായി ചൊല്ലണം”; എബ്രായക്രിയ ധ്യാനത്തോടൊപ്പം ശബ്ദം താഴ്ത്തിയുള്ള ആവർത്തനവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: വിട്ടുപോകരുത്
  rationale: ‘നീങ്ങുക, വിട്ടുപോകുക’ എന്ന അർഥവും ന്യായപ്രമാണം യോശുവയുടെ വായിൽ നിരന്തരം ഉണ്ടായിരിക്കണമെന്ന ദൃശ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: ഈ ന്യായപ്രമാണപുസ്തകം
  rationale: סֵפֶר എന്നത് പുസ്തകം/ചുരുൾ എന്നും תּוֹרָה ഇവിടെ എഴുതപ്പെട്ട ഉടമ്പടിനിയമം എന്നും സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണപുസ്തകം’ സന്ദർഭസൂചകവും മലയാള ബൈബിൾ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
- source_word: מִפִּיךָ
  choice: നിന്റെ വായിൽനിന്ന്
  rationale: സംസാരിക്കൽ, ഉരുവിടൽ, അധരങ്ങളിൽ സദാ സൂക്ഷിക്കൽ എന്നിവ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ മൂർത്തമായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
- source_word: וְהָגִיתָ בּוֹ
  choice: അതിനെക്കുറിച്ച് ധ്യാനിക്കണം
  rationale: הגה എന്ന ക്രിയയ്ക്ക് ധ്യാനിക്കുക എന്നതിനൊപ്പം പതുക്കെ ഉരുവിടുക എന്ന വാചികഭാവവും ഉണ്ടാകാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘ധ്യാനിക്കുക’ ഉപയോഗിച്ച് മറ്റേ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יוֹמָם וָלַיְלָה
  choice: രാവും പകലും
  rationale: നിരന്തരമായ അഭ്യാസത്തെ സൂചിപ്പിക്കുന്ന പദജോടിയെ മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: ശ്രദ്ധയോടെ പ്രവർത്തിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെയും സൂക്ഷ്മമായ അനുസരണത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; അറിവിൽ നിൽക്കാതെ പ്രവൃത്തിയിലേക്കുള്ള നീക്കവും സംരക്ഷിക്കുന്നു.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: അതിൽ എഴുതിയിരിക്കുന്നതെല്ലാം അനുസരിച്ച്
  rationale: כְּכָל എന്നതിന്റെ സമഗ്രതയും എഴുതപ്പെട്ട പ്രമാണം മാനദണ്ഡമാണെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: നിന്റെ വഴി വിജയകരമാക്കും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരകഭാവം സംരക്ഷിച്ച്, യോശുവ തന്റെ വഴിയെ വിജയകരമാക്കുമെന്ന ഉറവിടവാക്യത്തിന്റെ ഘടന പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: תַּשְׂכִּיל
  choice: വിവേകത്തോടെ പ്രവർത്തിക്കും
  rationale: שכל ഹിഫീലിന്റെ ഉൾക്കാഴ്ചയോടെയും വിവേകത്തോടെയും പ്രവർത്തിക്കുക എന്ന അർഥം നൽകുന്നു; മുമ്പുള്ള צלח-ന്റെ വിജയഭാവവുമായി ഇതിനെ ലയിപ്പിക്കാതെ വേർതിരിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി പശ്ചാത്തലത്തിലെ תּוֹרָה എന്ന പദത്തിന്റെ അർഥം
  choice: ന്യായപ്രമാണം
  alternative: ഉപദേശം / തോറാ
  rationale: תּוֹרָה-യ്ക്ക് പൊതുവേ ‘ഉപദേശം’ എന്ന അർഥമുണ്ടെങ്കിലും ഇവിടെ യോശുവ അനുസരിക്കേണ്ട എഴുതപ്പെട്ട ഉടമ്പടിനിയമമാണ് ഉദ്ദേശ്യം. ‘ന്യായപ്രമാണം’ ആ പ്രത്യേക സന്ദർഭം വ്യക്തമാക്കുന്നു.
- issue: הגה എന്നതിലെ വാചിക ഉരുവിടലും ആന്തരിക ധ്യാനവും
  choice: മുഖ്യപാഠത്തിൽ ‘ധ്യാനിക്കണം’; വാചികഭാവം അടിക്കുറിപ്പിൽ
  alternative: പതുക്കെ ഉരുവിടണം / മന്ദമായി ചൊല്ലണം
  rationale: വാക്യം ‘വായിൽനിന്ന്’ എന്ന വാചിക ദൃശ്യവും നിരന്തരമായ ചിന്തയും കൂട്ടിച്ചേർക്കുന്നു. ഒരു ഭാവം മാത്രം അന്തിമമാക്കാതെ സ്വാഭാവിക മുഖ്യപാഠവും വ്യക്തമായ അടിക്കുറിപ്പും ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗതമായി ഗ്രാഹ്യമായ ‘ന്യായപ്രമാണം’ നിലനിർത്തിയെങ്കിലും വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല. രണ്ടാംപുരുഷ ഏകവചനരൂപം യോശുവയോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
