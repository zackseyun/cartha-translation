  source_fidelity: 'എബ്രായ പാഠത്തിലെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ന്യായപ്രമാണപുസ്തകം വായിൽനിന്ന് വിട്ടുപോകരുത് എന്ന തുടർച്ചയായ വാചികസാന്നിധ്യത്തിന്റെ ദൃശ്യം, രാവും പകലും ധ്യാനിക്കൽ, എഴുതിയിരിക്കുന്ന സകലത്തിനും അനുസൃതമായ ശ്രദ്ധാപൂർവമായ പ്രവൃത്തി, തുടർന്ന് വഴിയെ വിജയകരമാക്കലും വിവേകത്തോടെ പ്രവർത്തിക്കലും. צלח-ന്റെ കാരകഭാവവും שכל-ന്റെ വിവേകപൂർവമായ പ്രവർത്തനവും വേർതിരിച്ചു നിലനിർത്തിയിരിക്കുന്നു.'
