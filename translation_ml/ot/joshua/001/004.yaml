base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: ml
  text: മരുഭൂമിമുതൽ ഈ ലെബാനോൻവരെയും, മഹാനദിയായ യൂഫ്രട്ടീസ് നദിവരെയും—ഹിത്യരുടെ ദേശം മുഴുവനും—സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലേക്കുള്ള മഹാസമുദ്രംവരെയും[a] നിങ്ങളുടെ അതിർത്തിയായിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മെഡിറ്ററേനിയൻ കടൽ.
    reason: cross_reference
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പടിഞ്ഞാറോട്ടുള്ള’; അക്ഷരാർഥം, ‘സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: മരുഭൂമിമുതൽ
  rationale: מִדְבָּר വരണ്ടതും ജനവാസം കുറഞ്ഞതുമായ മരുഭൂമി/വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവിവരണത്തിൽ സ്വാഭാവികമായ മലയാളപദമായി ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: ഈ ലെബാനോൻവരെയും
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ സൂചകപദമായ הַזֶּה ‘ഈ’ എന്നു നിലനിർത്തി; לְבָנוֹן എന്ന സ്ഥലനാമം ‘ലെബാനോൻ’ എന്നു ലിപ്യന്തരിച്ചു. വാക്യത്തിലെ അതിർത്തിവ്യാപ്തി മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വരെയും’ ചേർത്തു.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: മഹാനദിയായ യൂഫ്രട്ടീസ് നദിവരെയും
  rationale: ‘മഹാനദി’ എന്ന വിശേഷണത്തിനുശേഷം അതിനെ ‘യൂഫ്രട്ടീസ് നദി’ എന്നു തിരിച്ചറിയിക്കുന്ന ഹീബ്രു സമാനാധികരണഘടന സ്വാഭാവിക മലയാളത്തിൽ ‘മഹാനദിയായ’ എന്നു അവതരിപ്പിച്ചു; עַד അതിർത്തിഭാഷയിൽ ‘വരെയും’ ആയി പരിഭാഷപ്പെടുത്തി.
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: ഹിത്യരുടെ ദേശം മുഴുവനും
  rationale: כֹּל എന്ന സമഗ്രതയും ‘ഹിത്യരുടെ ദേശം’ എന്ന ജനതാ-ഭൂമിശാസ്ത്രപരമായ നിർദേശവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: മഹാസമുദ്രംവരെയും
  rationale: הַיָּם הַגָּדוֹל എന്ന പദപ്രയോഗം വ്യാഖ്യാനാത്മകമായി ‘മെഡിറ്ററേനിയൻ കടൽ’ എന്നു മുഖ്യപാഠത്തിൽ മാറ്റാതെ ‘മഹാസമുദ്രം’ എന്നു നിലനിർത്തി; തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലുള്ള
  rationale: പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥചിത്രമായ സൂര്യന്റെ അസ്തമയം സംരക്ഷിക്കുകയും അതിന്റെ ദിശാസൂചന മലയാളവായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘ദിക്കിലുള്ള’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: നിങ്ങളുടെ അതിർത്തിയായിരിക്കും
  rationale: גְּבוּל ഇവിടെ പ്രദേശവ്യാപ്തി നിർണയിക്കുന്ന അതിർത്തിയെ സൂചിപ്പിക്കുന്നു; ഹീബ്രു അപൂർണ്ണക്രിയയുടെ പ്രഖ്യാപനാത്മക ഭാവി അർഥം ‘ആയിരിക്കും’ എന്നു നൽകി.
