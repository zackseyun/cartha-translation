translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭൂമിശാസ്ത്ര-അതിർത്തിഭാഷ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ‘ഈ’ എന്ന സൂചകവും ‘സൂര്യൻ അസ്തമിക്കുന്ന’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
