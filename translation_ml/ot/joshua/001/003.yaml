id: JOS.1.3
reference: Joshua 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: ml
  text: നിങ്ങളുടെ ഉള്ളങ്കാൽ ചവിട്ടുന്ന ഓരോ സ്ഥലവും[a] മോശെയോടു ഞാൻ സംസാരിച്ചതുപോലെ ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ഉള്ളങ്കാൽ എവിടെയെല്ലാം ചവിട്ടുന്നുവോ, ആ സ്ഥലമെല്ലാം.’
    reason: ബന്ധവാക്യത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു മലയാള രൂപം; അർഥം മാറ്റാതെ വിതരണാർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: ഓരോ സ്ഥലവും
  rationale: כָּל എന്നത് מָקוֹם-നോടൊപ്പം വിതരണാർഥം നൽകുന്നു; വാഗ്ദാനം ഓരോ സ്ഥലത്തെയും സംബന്ധിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר ... בּוֹ
  choice: '... ചവിട്ടുന്ന'
  rationale: മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ പ്രത്യേക ബന്ധസർവനാമം ആവർത്തിക്കാതെ ആശയം സ്വാഭാവികമായി നൽകാം; בּוֹ സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം ക്രിയാസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: תִּדְרֹךְ
  choice: ചവിട്ടുന്ന
  rationale: דרך എന്ന ക്രിയയുടെ കാൽവെക്കുക/ചവിട്ടുക എന്ന മൂർത്തമായ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: כַּף רַגְלְכֶם
  choice: നിങ്ങളുടെ ഉള്ളങ്കാൽ
  rationale: כַּף רֶגֶל കാലിന്റെ അടിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ബഹുവചന അഭിസംബോധനയായ 'നിങ്ങളുടെ' നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചന രൂപം ഉപയോഗിക്കുന്നു.
- source_word: לָכֶם נְתַתִּיו
  choice: ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  rationale: ലാഭഭോക്താവിനെ 'നിങ്ങൾക്കു' എന്നു വ്യക്തമാക്കുകയും perfect രൂപത്തിന്റെ പൂർത്തിയായതും നിലവിൽ പ്രാബല്യമുള്ളതുമായ ദാനാർഥം 'തന്നിരിക്കുന്നു' കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: '...പോലെ'
  rationale: ഇപ്പോഴത്തെ പ്രഖ്യാപനവും മോശെയോടുള്ള മുൻവചനവും തമ്മിലുള്ള അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: മോശെയോടു ഞാൻ അരുളിച്ചെയ്തത്
  rationale: דבר אל എന്നത് 'പറയുക/സംസാരിക്കുക' എന്നാണ്; ദൈവത്തിന്റെ വാക്കെന്ന സന്ദർഭത്തിൽ dignified Malayalam ആയ 'അരുളിച്ചെയ്യുക' ഉപയോഗിക്കുന്നു, എന്നാൽ 'വാഗ്ദാനം ചെയ്തു' എന്ന വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ദൈവിക ദാനത്തിന്റെ ക്രിയാകാലവും ഭാവവും
  choice: נְתַתִּיו എന്ന perfect രൂപം 'ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു' എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: '''ഞാൻ നിങ്ങൾക്കു തരും'' അല്ലെങ്കിൽ ''ഞാൻ നിങ്ങൾക്കു തരുന്നു'''
  rationale: ഭൂമി ചരിത്രത്തിൽ പിന്നീട് കൈവശമാകുന്നുവെങ്കിലും ദൈവിക പ്രഖ്യാപനത്തിൽ ദാനം ഉറപ്പിക്കപ്പെട്ടതായി ഹീബ്രു perfect അവതരിപ്പിക്കുന്നു. ഭാവികാലമാക്കി മാറ്റാതെ ആ ഉറപ്പും പൂർത്തിത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ഉള്ളങ്കാൽ ചവിട്ടുക' എന്ന മൂർത്തബിംബവും ദൈവിക ദാനത്തിന്റെ പൂർത്തിയായ ഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യമായ സഭാവിഭാഗീയ പദപ്രയോഗം ഒഴിവാക്കി.
