    issue: The honorific «അങ്ങ്» is stronger than the source’s unmarked second-person singular.
    rationale: Hebrew singular verbal suffixes address Joshua directly but do not encode a special honorific level. Using «നീ» preserves the source form without adding social elevation.
  - severity: low
    issue: The lexical alternative for the final locative expression is not represented in a Malayalam footnote.
    rationale: The audit trail identifies a literal alternative (“to every place that you send us”). A footnote at «എവിടേക്കു» preserves that transparent alternative without burdening the main text.
