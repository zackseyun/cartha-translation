translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള പ്രസംഗശൈലി. ‘അങ്ങ്’ ആദരസൂചക ഏകവചനമായി ഉപയോഗിച്ചിരിക്കുന്നു; പദത്തിൽ ഇല്ലാത്ത സൈനികമോ സഭാപരമോ ആയ പ്രത്യേക അർഥങ്ങൾ ചേർത്തിട്ടില്ല.
