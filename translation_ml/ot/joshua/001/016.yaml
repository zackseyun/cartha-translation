language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲנ֔וּ אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר כֹּ֤ל אֲשֶׁר צִוִּיתָ֨/נוּ֙ נַֽעֲשֶׂ֔ה וְ/אֶֽל כָּל אֲשֶׁ֥ר תִּשְׁלָחֵ֖/נוּ נֵלֵֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: ml
  text: 'അവർ യോശുവയോടു ഉത്തരം പറഞ്ഞു: “നീ ഞങ്ങളോടു കൽപിച്ചതെല്ലാം ഞങ്ങൾ ചെയ്യും; നീ ഞങ്ങളെ എവിടേക്കു[a] അയച്ചാലും ഞങ്ങൾ പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നീ ഞങ്ങളെ അയക്കുന്ന എല്ലാ സ്ഥലത്തേക്കും.”
    reason: വְאֶל כָּל אֲשֶׁר എന്ന പ്രയോഗത്തിന്റെ സ്ഥലസൂചകമായ, കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ബദൽ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: അവർ യോശുവയോട് ഇങ്ങനെ ഉത്തരം പറഞ്ഞു
  rationale: ענה എന്ന ക്രിയ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; അഭിസംബോധിതനെ മലയാളത്തിൽ ‘യോശുവയോട്’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. לֵאמֹר നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘ഇങ്ങനെ’ ഉപയോഗിച്ചു.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: അങ്ങ് ഞങ്ങളോടു കല്പിച്ചതെല്ലാം
  rationale: כֹּל אֲשֶׁר സമഗ്രതയെ ‘എല്ലാം’ എന്നു നൽകുന്നു; צוה അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കല്പിച്ചു’ തെരഞ്ഞെടുത്തു. യോശുവയോടുള്ള ആദരസൂചക ഏകവചനമായി ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: נַעֲשֶׂה
  choice: ഞങ്ങൾ ചെയ്യും
  rationale: עשה ഇവിടെ കല്പിക്കപ്പെട്ടത് നടപ്പാക്കുക എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്; ‘ചെയ്യും’ ലളിതവും കൃത്യവുമാണ്.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: അങ്ങ് ഞങ്ങളെ എവിടേക്കു അയച്ചാലും
  rationale: ശബ്ദാനുസൃതമായി ‘അയക്കുന്ന എല്ലാ സ്ഥലത്തേക്കും’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനവാചകമായ ‘എവിടേക്കു ... അയച്ചാലും’ എന്നു നൽകി.
- source_word: נֵלֵךְ
  choice: ഞങ്ങൾ പോകും
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷ.
