  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: ml
  text: നിന്റെ ജീവിതകാലം മുഴുവനും ഒരു മനുഷ്യനും നിന്റെ മുമ്പിൽ നിലകൊള്ളുകയില്ല[a][b]. ഞാൻ മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ, ഞാൻ നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കും. ഞാൻ നിന്നെ കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആർക്കും നിന്റെ മുമ്പിൽ നിലകൊള്ളാൻ കഴിയുകയില്ല.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് വിജയകരമായി ചെറുത്തുനിൽക്കാൻ കഴിയുക എന്ന അർഥവും വരാം.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു മനുഷ്യനും’ എന്നതിന് എബ്രായത്തിൽ പുല്ലിംഗ ഏകവചനരൂപമാണുള്ളത്; എന്നാൽ ഇവിടെ അത് പൊതുവായി ഏതൊരു മനുഷ്യ എതിരാളിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘ഞാൻ നിന്നെ വിട്ടുകളയുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല.’ ആദ്യത്തെ ക്രിയയ്ക്ക് വിട്ടുകളയുക, പിന്തുണയിൽ അയവുവരുത്തുക, അല്ലെങ്കിൽ സഹായിക്കാതെ വിടുക എന്നീ ഭാവങ്ങളുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: നിലകൊള്ളുകയില്ല
  rationale: יצב എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം ഇവിടെ ഒരാളുടെ മുമ്പിൽ എതിർത്ത് നിലയുറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിന്റെ മുമ്പിൽ നിലകൊള്ളുക’ എന്ന എബ്രായ പ്രയോഗരീതി നിലനിർത്തിക്കൊണ്ട് സൈനികസന്ദർഭത്തിലെ വിജയകരമായ ചെറുത്തുനിൽപ്പും ഇതു ധ്വനിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: ഒരു മനുഷ്യനും
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ אִישׁ ഇവിടെ പൊതുവായ അർഥത്തിൽ ഏതൊരു മനുഷ്യ എതിരാളിയെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരു മനുഷ്യനും’ ഉറവിടരൂപത്തോട് അടുത്തതും സ്വാഭാവികവുമാണ്.
- source_word: לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ
  rationale: പദശഃ ‘നിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നർഥമുള്ള പ്രയോഗം ഈ സന്ദർഭത്തിൽ എതിർപ്പിന്റെ ഭാവം ഉൾക്കൊള്ളുന്നു. ‘നിന്റെ മുമ്പിൽ’ എബ്രായ ശൈലി സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ഒരാളുടെ ജീവിതകാലം മുഴുവനെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളസമാനതയാണ് ഇത്.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: ഞാൻ മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ
  rationale: כַאֲשֶׁר സൂചിപ്പിക്കുന്ന താരതമ്യം വ്യക്തമായി നിലനിർത്തുകയും ദൈവം മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതും യോശുവയോടുകൂടെ ഉണ്ടായിരിക്കുമെന്ന വാഗ്ദാനവും നേരിട്ട് ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶהְיֶה עִמָּךְ
  choice: നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കും
  rationale: היה എന്ന ക്രിയയും עִם എന്ന ബന്ധപദവും ചേർന്നുള്ള ദൈവസാന്നിധ്യത്തിന്റെ വാഗ്ദാനം അധിക വ്യാഖ്യാനം കൂടാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַרְפְּךָ
  choice: നിന്നെ കൈവിടുകയോ
  rationale: רפה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം പിടി അയയ്ക്കുക, പിന്തുണയിൽ അയവുവരുത്തുക, സഹായിക്കാതെ വിടുക എന്നീ ഭാവങ്ങൾ വഹിക്കുന്നു. ‘കൈവിടുക’ ഈ ദൃശ്യഭാവവും പിന്തുണ പിൻവലിക്കാത്തതെന്ന ആശയവും മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֶעֶזְבֶךָּ
  choice: ഉപേക്ഷിക്കുകയോ ഇല്ല
  rationale: עזב എന്നത് വിട്ടുപോകുക, ഉപേക്ഷിക്കുക, പരിത്യജിക്കുക എന്നർഥം നൽകുന്നു. ‘ഉപേക്ഷിക്കുക’ ആദ്യക്രിയയായ ‘കൈവിടുക’ എന്നതിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ സമ്പൂർണ പരിത്യാഗത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: אִישׁ എന്ന പൊതുവായ പുല്ലിംഗ ഏകവചനത്തിന്റെ പരിഭാഷ
  choice: ഒരു മനുഷ്യനും
  alternative: ആർക്കും / ഒരു എതിരാളിക്കും
  rationale: ഉറവിടത്തിലെ പുല്ലിംഗ ഏകവചനം മറയ്ക്കാതെ അതിന്റെ പൊതുവായ മാനുഷിക പരാമർശം നിലനിർത്തി. ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ലെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ എന്ന ഇരട്ട വാഗ്ദാനത്തിലെ വ്യത്യാസം
  choice: ഞാൻ നിന്നെ കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ഇല്ല
  alternative: ഞാൻ നിന്നിലുള്ള പിടി അയയ്ക്കുകയോ നിന്നെ ഉപേക്ഷിക്കുകയോ ഇല്ല
  rationale: ആദ്യക്രിയ പിന്തുണയിലെ പിടി അയയ്ക്കാതിരിക്കുന്നതും രണ്ടാമത്തേത് പൂർണമായി ഉപേക്ഷിക്കാതിരിക്കുന്നതും സൂചിപ്പിക്കുന്നു. ദൈവിക വിശ്വസ്തതയുടെ ഈ രണ്ട് വശങ്ങളും ഒന്നാക്കി ചുരുക്കാതെ മലയാളത്തിൽ വേർതിരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൈവിക വാഗ്ദാനത്തിന് യോജിച്ച ഗൗരവമുള്ള ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘നിന്റെ മുമ്പിൽ നിലകൊള്ളുക’ എന്ന ഉറവിടപ്രയോഗം നിലനിർത്തി; അതിന്റെ സൈനികസന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘കൈവിടുക / ഉപേക്ഷിക്കുക’ എന്ന ജോടി എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകളുടെ ഭാവവ്യത്യാസം കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
