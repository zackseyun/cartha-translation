translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭരണപരമായ പദവിയെ വ്യക്തമാക്കാൻ ‘ഉദ്യോഗസ്ഥന്മാർ’ ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്കുള്ള ബന്ധം കോളൺകൊണ്ട് സൂചിപ്പിച്ചു.
