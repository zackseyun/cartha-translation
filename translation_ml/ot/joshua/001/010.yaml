translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ ജനത്തിന്റെ ഉദ്യോഗസ്ഥന്മാരോടു കല്പിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: അപ്പോൾ ... കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ നിർദേശാത്മക ശക്തി ‘കല്പിച്ചു’ നിലനിർത്തുന്നു; wayyiqtol രൂപത്തിന്റെ കഥാക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണ്; മലയാളത്തിൽ ‘ജനത്തിന്റെ ഉദ്യോഗസ്ഥന്മാരോടു’ എന്ന ഘടനയിലൂടെ ബന്ധം വ്യക്തമാകുന്നു.
- source_word: שֹׁטְרֵי
  choice: ഉദ്യോഗസ്ഥന്മാർ
  rationale: שֹׁטֵר ഇവിടെ സൈനിക മേധാവിയെയല്ല, ഭരണനിർവഹണ ചുമതലയുള്ള ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉദ്യോഗസ്ഥന്മാർ’ ആ ഔദ്യോഗിക-ഭരണപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עָם ഇവിടെ സമൂഹമായി നിലകൊള്ളുന്ന ജനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ തത്തുല്യമാണ്.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ കോളൺ സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പദാനുപദ രൂപം ഈ ചെറുവാക്യത്തിൽ കൃത്രിമമായി തോന്നാം.
