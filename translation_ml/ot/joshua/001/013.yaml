id: JOS.1.13
reference: Joshua 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: ml
  text: 'യഹ്‌വെയുടെ ദാസനായ മോശ നിങ്ങളോടു കല്പിച്ച വാക്ക് ഓർക്കുക: “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു വിശ്രമം നൽകുന്നു; ഈ ദേശം നിങ്ങൾക്കു നൽകിയിരിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ദേശം നിങ്ങൾക്കു നൽകും.” എബ്രായ ക്രിയയെ പൂർത്തിയായ പ്രവൃത്തിയായോ ഉറപ്പുള്ള ഭാവിയായോ മനസ്സിലാക്കാം. യോർദ്ദാന്റെ കിഴക്കുള്ള ഗോത്രങ്ങൾക്ക് അവരുടെ അവകാശഭൂമി ഇതിനകം അനുവദിച്ചിരുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “നൽകിയിരിക്കുന്നു” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: ഓർക്കുക
  rationale: זכר എന്ന ധാതുവിന്റെ കല്പനാരൂപമാണിത്. മുമ്പ് നൽകിയ കല്പന മനസ്സിൽ കൊണ്ടുവരാനുള്ള നേരിട്ടുള്ള ആഹ്വാനം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഓർക്കുക’ എന്നു നൽകുന്നു.
- source_word: הַדָּבָר
  choice: വാക്ക്
  rationale: דבר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘കല്പന’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ മോശ പറഞ്ഞ നിർദേശത്തിന്റെ ഉള്ളടക്കം തുടർന്നു വരുന്നതിനാൽ ‘വാക്ക്’ മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; കല്പനയുടെ അധികാരഭാവം צִוָּה എന്ന ക്രിയയിൽ വ്യക്തമാകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ക്രിയയുടെ ശക്തി ‘കല്പിച്ച’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വെയുടെ ദാസൻ
  rationale: മോശയുടെ ദൈവനിയോഗിതമായ സേവനത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദവിയായതിനാൽ עבד എന്നത് ഇവിടെ ‘ദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ‘യഹ്‌വെ’ എന്നു നൽകി.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രണ്ടാം പുരുഷ ബഹുവചന പ്രത്യയത്തോടുകൂടിയ സംയുക്തരൂപം നേരിട്ട്, ഉടമ്പടിബന്ധത്തിന്റെ അഭിസംബോധന നിലനിർത്തി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵנִיחַ
  choice: വിശ്രമം നൽകുന്നു
  rationale: ഹിഫിൽ പങ്കാളിരൂപം വിശ്രമമോ സുരക്ഷിതമായ സ്ഥിരതയോ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ അർഥവ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וְנָתַן
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഖാതൽ രൂപം പൂർത്തിയായ പ്രവൃത്തിയായോ ഉറപ്പുള്ള ഭാവിയായോ ഗ്രഹിക്കാം. യോർദ്ദാന്റെ കിഴക്കുള്ള ഗോത്രങ്ങൾക്ക് ഈ ദേശം ഇതിനകം അനുവദിച്ചിരുന്ന കഥാസന്ദർഭത്തിൽ പൂർത്തിയായ ദാനത്തെ സൂചിപ്പിക്കുന്ന ‘നൽകിയിരിക്കുന്നു’ അനുയോജ്യമാണ്; ഭാവിവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: സൂചകപദത്തോടുകൂടിയ ലളിതമായ നാമവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Jehovah’ എന്ന പിൽക്കാല രൂപവും സ്വീകരിക്കാതെ, മലയാളത്തിൽ ശബ്ദാനുസൃതമായി നൽകി.
- issue: וְנָתַן എന്ന ക്രിയയുടെ കാല-ദൃഷ്ടി
  choice: നൽകിയിരിക്കുന്നു
  alternative: നൽകും
  rationale: എബ്രായരൂപം പൂർത്തിയായ ദാനത്തെയും ഉറപ്പുള്ള ഭാവിയെയും അനുവദിക്കുന്നു. കിഴക്കൻ ഗോത്രങ്ങൾക്ക് ദേശം ഇതിനകം ലഭിച്ചിരുന്ന സമീപകഥാസന്ദർഭം പൂർത്തിയായ വായനയെ പിന്തുണയ്ക്കുന്നു; യഥാർഥമായ ഭാവിവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കല്പിച്ച വാക്ക്’ എന്ന രൂപം മൂലത്തിലെ ‘വാക്ക്’–‘കല്പിക്കുക’ വേർതിരിവ് നിലനിർത്തുന്നു. ഉദ്ധരണിയിലെ രണ്ട് ദൈവിക പ്രവൃത്തികൾ അർഥവ്യത്യാസം തെളിയിക്കാൻ അർധവിരാമംകൊണ്ട് വേർതിരിച്ചു.
