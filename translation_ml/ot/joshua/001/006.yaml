source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: ml
  text: ശക്തനും ധൈര്യവാനും ആയിരിക്കുക; കാരണം, അവരുടെ പിതാക്കന്മാർക്ക്[b] കൊടുക്കുമെന്ന് ഞാൻ സത്യംചെയ്ത ആ ദേശത്തിന്റെ അവകാശികളാക്കുന്നത് ഈ ജനത്തെ നീയായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ജനത്തിന് ദേശം അവകാശമായി നൽകുന്നത് നീയായിരിക്കും.” എബ്രായ ക്രിയയ്ക്ക് ‘അവകാശമായി ലഭിക്കുമാറാക്കുക’ എന്ന കാരണാർത്ഥമുണ്ട്; സന്ദർഭത്തിൽ അത് അവകാശം നൽകുക അഥവാ പങ്കിട്ടുകൊടുക്കുക എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ പിതാക്കന്മാർ” എന്നത് ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരെ, പ്രത്യേകിച്ച് ഗോത്രപിതാക്കന്മാരെ, സൂചിപ്പിക്കുന്നു; “അവരുടെ പൂർവികർ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק
  choice: ശക്തനായിരിക്കുക
  rationale: പുരുഷ ഏകവചനത്തിലുള്ള കൽപ്പനയുടെ ആഹ്വാനസ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וֶאֱמָץ
  choice: ധൈര്യവാനുമായിരിക്കുക
  rationale: חזק എന്ന പദത്തോടൊപ്പമുള്ള ഈ കൽപ്പന ധൈര്യവും ദൃഢനിശ്ചയവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പരിചിതവും വ്യക്തവുമായ പദജോടി തിരഞ്ഞെടുത്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള വാക്യം മുൻ കൽപ്പനയുടെ അടിസ്ഥാനം നൽകുന്നു എന്ന കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תַּנְחִיל
  choice: അവകാശികളാക്കുന്നത് നീയായിരിക്കും
  rationale: נחל എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം—ജനത്തിന് ദേശം അവകാശമായി ലഭിക്കുമാറാക്കുക—നിലനിർത്തുകയും ഭാവിസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: എബ്രായയിലെ ഏകവചന കൂട്ടനാമവും സമീപസൂചകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഈ ഉടമ്പടിപരമായ സന്ദർഭത്തിൽ വാഗ്ദത്തപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദം.
- source_word: נִשְׁבַּעְתִּי
  choice: ഞാൻ ... സത്യംചെയ്ത
  rationale: ദൈവം പിതാക്കന്മാരോടു ചെയ്ത ശപഥത്തെ നേരിട്ടും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: לַאֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  rationale: എബ്രായയിലെ പുരുഷലിംഗ ബഹുവചനവും ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരിലേക്കുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: לָתֵת לָהֶם
  choice: അവർക്ക് കൊടുക്കുമെന്ന്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കവും ദേശം ലഭിക്കുന്നവരെയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: לַאֲבוֹתָם എന്ന പിതൃപുരുഷസൂചനയുടെ വിവർത്തനം
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  alternative: അവരുടെ പൂർവികർക്ക്
  rationale: മൂലപാഠം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനം ഉപയോഗിക്കുകയും ഉടമ്പടി ലഭിച്ച ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ആ രൂപം നിലനിർത്തി.
- issue: תַּנְחִיל എന്ന കാരണാർത്ഥ ക്രിയയുടെ അവതരണം
  choice: ഈ ജനത്തെ ... ദേശത്തിന്റെ അവകാശികളാക്കുന്നത് നീയായിരിക്കും
  alternative: ഈ ജനത്തിന് ... ദേശം അവകാശമായി നൽകുന്നത് നീയായിരിക്കും
  rationale: യോശുവ ജനത്തിന് ദേശം അവകാശമായി ലഭിക്കുമാറാക്കും എന്ന എബ്രായ ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം മുഖ്യപാഠം തുറന്നുവെക്കുന്നു; ദേശം നൽകുന്നത് ദൈവമാണെന്ന വിശാലമായ സന്ദർഭത്തെ ഇല്ലാതാക്കാതെ യോശുവയുടെ നിയോഗം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കൽപ്പനയുടെ നേരിട്ടുള്ള ശക്തിയും കാരണവാക്യത്തിന്റെ ബന്ധവും ക്രിയയുടെ കാരണാർത്ഥവും സംരക്ഷിച്ചു; അതേസമയം പദാനുപദമായ കൃത്രിമത്വം ഒഴിവാക്കി.
