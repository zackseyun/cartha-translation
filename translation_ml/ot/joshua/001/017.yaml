reference: Joshua 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: ml
  text: എല്ലാ കാര്യത്തിലും ഞങ്ങൾ മോശെയുടെ വാക്കു കേട്ടതുപോലെ[a] അങ്ങയുടെ വാക്കും കേൾക്കും. ഒരു കാര്യം മാത്രം—അങ്ങയുടെ ദൈവമായ യഹ്‌വെ മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ അങ്ങയോടുകൂടെയും ഉണ്ടായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോശെയെ അനുസരിച്ചതുപോലെ ... അങ്ങയെയും അനുസരിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. שמע എന്ന എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘കേൾക്കുക’ എന്നും ‘അനുസരിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: വാക്കു കേട്ടു / വാക്കു കേൾക്കും
  rationale: שׁמע എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘കേൾക്കുക’, ‘ശ്രദ്ധിക്കുക’, ‘അനുസരിക്കുക’ എന്നീ അർഥച്ചായകളുണ്ട്. മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ സ്വാഭാവികമായിരിക്കെ അനുസരണത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; എന്നാൽ ‘അനുസരിക്കുക’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി അർഥം അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: כְּכֹל אֲשֶׁר
  choice: എല്ലാ കാര്യത്തിലും ... പോലെ
  rationale: ഈ പ്രയോഗത്തിലെ സമഗ്രതയും താരതമ്യവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֶל / אֵלֶיךָ
  choice: മോശെയുടെ വാക്കു / അങ്ങയുടെ വാക്ക്
  rationale: ‘കേൾക്കുക’ എന്ന ക്രിയയോടൊപ്പം വ്യക്തിയെ നേരിട്ട് കർമമാക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമായതിനാൽ, വ്യക്തിയുടെ വാക്കു കേൾക്കുക എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു; അഭിസംബോധനയുടെ സമാന്തരത നിലനിർത്തി.
- source_word: רַק
  choice: പ്രത്യേക പദമായി പ്രകടിപ്പിക്കാതെ ആശംസാരൂപത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ רַק തുടർന്നുവരുന്ന ആശംസയെയോ നിബന്ധനാസദൃശമായ യോഗ്യതയെയോ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മാത്രം’ ചേർത്താൽ നിയന്ത്രണാർഥം അസ്വാഭാവികമാകാം; ‘ഉണ്ടായിരിക്കട്ടെ’ എന്ന ആശംസാരൂപവും വാക്യക്രമവും അതിന്റെ പ്രയോഗശക്തി വഹിക്കുന്നു.
- source_word: יִהְיֶה
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: ലളിതമായ ഭാവിപ്രവചനത്തേക്കാൾ ആശംസാപരമായ അർഥമാണ് സന്ദർഭത്തിൽ യോജിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവം
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം ആദരസൂചകമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: עִמָּךְ / עִם
  choice: അങ്ങയോടുകൂടെ / മോശെയോടുകൂടെ
  rationale: സാന്നിധ്യവും സഹവാസവും സൂചിപ്പിക്കുന്ന עִם എന്ന പദത്തിന്റെ സാധാരണയും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: כַּאֲשֶׁר
  choice: ഉണ്ടായിരുന്നതുപോലെ
  rationale: മോശെയോടുള്ള ദൈവസാന്നിധ്യവും യോശുവയോടുള്ള ദൈവസാന്നിധ്യവും തമ്മിലുള്ള താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നിലനിർത്തി; ‘യഹോവ’ എന്ന പരമ്പരാഗത സംയുക്തോച്ചാരണത്തിനുപകരം ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: ശמע എന്ന ക്രിയയിലെ കേൾവി–അനുസരണം അർഥച്ചായ
  choice: വാക്കു കേൾക്കുക
  alternative: അനുസരിക്കുക
  rationale: ജനത്തിന്റെ വാക്കുകൾ യോശുവയോടുള്ള അനുസരണപ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലക്രിയയിലെ ‘കേൾക്കുക’ എന്ന അടിസ്ഥാനാർഥവും സന്ദർഭത്തിലെ ‘അനുസരിക്കുക’ എന്ന സൂചനയും ഒരുമിച്ച് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യോശുവയോടുള്ള ഏകവചന അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘വാക്കു കേൾക്കുക’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും കേൾവി–അനുസരണം എന്നീ രണ്ട് അർഥച്ചായകളും വഹിക്കുന്നതുമാണ്.
