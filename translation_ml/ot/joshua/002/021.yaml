- from: 'അവൾ പറഞ്ഞു: “നിങ്ങളുടെ വാക്കുകൾപോലെതന്നെ ആകട്ടെ.” പിന്നെ അവൾ അവരെ യാത്രയാക്കി; അവർ പോയി. അവൾ ആ കടുംചുവപ്പുനിറമുള്ള ചരട്[a] ജനലിൽ കെട്ടി.'
  to: 'അവൾ പറഞ്ഞു: “നിങ്ങൾ പറഞ്ഞതുപോലെതന്നെ ആകട്ടെ.” പിന്നെ അവൾ അവരെ അയച്ചുവിട്ടു; അവർ പോയി. അവൾ ജനലിൽ കടുംചുവപ്പു ചരട്[a] കെട്ടി.'
