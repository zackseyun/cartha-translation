source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ כְּ/דִבְרֵי/כֶ֣ם כֶּן ה֔וּא וַֽ/תְּשַׁלְּחֵ֖/ם וַ/יֵּלֵ֑כוּ וַ/תִּקְשֹׁ֛ר אֶת תִּקְוַ֥ת הַ/שָּׁנִ֖י בַּ/חַלּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “നിങ്ങൾ പറഞ്ഞതുപോലെതന്നെ ആകട്ടെ.” പിന്നെ അവൾ അവരെ അയച്ചുവിട്ടു; അവർ പോയി. അവൾ ജനലിൽ കടുംചുവപ്പു ചരട്[a] കെട്ടി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കടുംചുവപ്പു നൂൽക്കയർ.” എബ്രായപ്രയോഗത്തിന് ചരട്, നൂൽക്കയർ, അല്ലെങ്കിൽ കയർ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: നിങ്ങളുടെ വാക്കുകൾപോലെതന്നെ
  rationale: ബഹുവചനമായ ‘വാക്കുകൾ’ എന്ന രൂപവും ചാരന്മാർ പറഞ്ഞ വ്യവസ്ഥകളോടുള്ള രാഹാബിന്റെ സമ്മതവും നിലനിർത്തുന്നു.
- source_word: כֵּן הוּא
  choice: ആകട്ടെ
  rationale: സമ്മതം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം; ‘അങ്ങനെതന്നെ ആകട്ടെ’ എന്ന ആശയം നൽകുന്നു.
- source_word: וַתְּשַׁלְּחֵם
  choice: അവൾ അവരെ യാത്രയാക്കി
  rationale: שלח എന്ന ക്രിയയുടെ ‘അയയ്ക്കുക/പോകാൻ അനുവദിക്കുക’ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֵּלֵכוּ
  choice: അവർ പോയി
  rationale: הלך എന്ന ലളിതമായ ചലനക്രിയയെ വ്യാഖ്യാനഭാരം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וַתִּקְשֹׁר
  choice: കെട്ടി
  rationale: קשר എന്നതിന്റെ ‘കെട്ടുക/ബന്ധിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സന്ദർഭത്തിന് യോജിച്ച ലളിതമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: കടുംചുവപ്പുനിറമുള്ള ചരട്
  rationale: ഇവിടെ תִּקְוָה ‘പ്രത്യാശ’യല്ല, കാണാവുന്ന അടയാളമായി ഉപയോഗിച്ച ചരട്/നൂൽക്കയർ ആണ്; הַשָּׁנִי അതിന്റെ കടുംചുവപ്പ് നിറത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בַּחַלּוֹן
  choice: ജനലിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം കെട്ടിയിടം സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനലിൽ’ എന്നു നൽകി.
