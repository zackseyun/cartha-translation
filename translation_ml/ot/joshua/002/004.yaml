id: JOS.2.4
reference: Joshua 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקַּ֧ח הָֽ/אִשָּׁ֛ה אֶת שְׁנֵ֥י הָ/אֲנָשִׁ֖ים וַֽ/תִּצְפְּנ֑/וֹ וַ/תֹּ֣אמֶר כֵּ֗ן בָּ֤אוּ אֵלַ/י֙ הָֽ/אֲנָשִׁ֔ים וְ/לֹ֥א יָדַ֖עְתִּי מֵ/אַ֥יִן הֵֽמָּה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: ml
  text: 'എന്നാൽ ആ സ്ത്രീ ആ രണ്ടു പുരുഷന്മാരെയും കൂട്ടിക്കൊണ്ടുപോയി ഒളിപ്പിച്ചിരുന്നു[a]. അവൾ പറഞ്ഞു: “അതെ, ആ പുരുഷന്മാർ എന്റെ അടുക്കൽ വന്നിരുന്നു; പക്ഷേ അവർ എവിടെനിന്നുള്ളവരാണെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒളിപ്പിച്ചു” എന്നതിലെ എബ്രായ പ്രത്യയം അക്ഷരാർഥത്തിൽ ഏകവചനമാണ് (“അവനെ ഒളിപ്പിച്ചു”); എന്നാൽ സന്ദർഭം രണ്ടു പുരുഷന്മാരെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നതിനാൽ വിവർത്തനത്തിൽ ബഹുവചനാർഥം നൽകിയിരിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ എന്നത് ഈ സന്ദർഭത്തിൽ പുരുഷന്മാരെ സുരക്ഷിതമായി മാറ്റി ഒളിപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്. തുടർന്നുള്ള ‘ഒളിപ്പിച്ചിരുന്നു’ മുൻകൃത്യത വ്യക്തമാക്കുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: ഇവിടെ രാഹാബിനെ ഒരു സ്ത്രീയായി പരാമർശിക്കുകയാണ്; ‘ഭാര്യ’ എന്ന അർഥം സന്ദർഭത്തിൽ ഉദ്ദേശ്യമല്ല.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ആ രണ്ടു പുരുഷന്മാരെയും
  rationale: ഇത് ഇസ്രായേല്യരായ രണ്ടു പുരുഷചാരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പുരുഷന്മാർ’ കൃത്യവും മാന്യവുമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: וַתִּצְפְּנוֹ
  choice: ഒളിപ്പിച്ചിരുന്നു
  rationale: എബ്രായരൂപത്തിൽ ഏകവചന പ്രത്യയമുണ്ടെങ്കിലും സന്ദർഭത്തിലെ കർമം രണ്ടു പുരുഷന്മാരാണ്. മലയാളത്തിൽ ബഹുവചന കർമം മുമ്പേ വ്യക്തമാകുന്നതിനാൽ ക്രിയ സ്വാഭാവികമായി അതിനോടു ചേരുന്നു; കാലരൂപം അവളുടെ പ്രസ്താവനയ്ക്കുമുമ്പ് പ്രവൃത്തി നടന്നതായി കാണിക്കുന്നു.
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനത്തിലെ സംഭാഷണാരംഭം ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: כֵּן
  choice: അതെ
  rationale: മുമ്പത്തെ അന്വേഷണത്തെ അംഗീകരിക്കുന്ന നേരിട്ടുള്ള സമ്മതം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ എന്റെ അടുക്കൽ വന്നിരുന്നു
  rationale: മൂലത്തിലെ വ്യക്തികളെയും അവരുടെ രാഹാബിലേക്കുള്ള വരവിനെയും കൃത്യമായി നിലനിർത്തുന്നു; ‘വന്നിരുന്നു’ സംഭാഷണസന്ദർഭത്തിലെ മുൻകാല പ്രവൃത്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא יָדַעְתִּי
  choice: പക്ഷേ ... എനിക്ക് അറിയില്ലായിരുന്നു
  rationale: വാവ് ഔപചാരികമായി ‘ഉം/കൂടാതെ’ ആണെങ്കിലും ഇവിടെ സമ്മതത്തിനും അറിവില്ലെന്ന നിഷേധത്തിനുമിടയിലെ വിരുദ്ധബന്ധം ‘പക്ഷേ’ വ്യക്തമാക്കുന്നു.
- source_word: מֵאַיִן הֵמָּה
  choice: അവർ എവിടെനിന്നുള്ളവരാണെന്ന്
  rationale: അവരുടെ ഉത്ഭവസ്ഥലമോ വരവിടമോ ചോദിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
