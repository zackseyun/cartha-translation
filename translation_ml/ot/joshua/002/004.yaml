translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ആഖ്യാനക്രമം സ്വാഭാവികമാക്കാൻ മുൻകൃത്യത സൂചിപ്പിക്കുന്ന ‘ഒളിപ്പിച്ചിരുന്നു’ ഉപയോഗിച്ചു; മൂലത്തിലെ ഏകവചന പ്രത്യയത്തിലെ അസാധാരണത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
