source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: ml
  text: എന്നാൽ നമ്മുടെ ഈ കാര്യം[a] നീ വെളിപ്പെടുത്തിയാൽ, നീ ഞങ്ങളെക്കൊണ്ട് സത്യം ചെയ്യിച്ച ആ സത്യത്തിന്റെ ബാധ്യതയിൽനിന്ന് ഞങ്ങൾ ഒഴിവായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ ഈ ഇടപാട്’ അല്ലെങ്കിൽ ‘നമ്മുടെ ഈ വാക്ക്.’ എബ്രായപദത്തിന് കാര്യം, ഇടപാട്, വാക്ക് എന്നീ അർഥങ്ങൾ വരാം. സന്ദർഭത്തിൽ ഇത് ചാരന്മാരുമായി ബന്ധപ്പെട്ട കാര്യം, അതായത് അവരുടെ രഹസ്യദൗത്യം, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ സത്യത്തിൽനിന്ന് ഞങ്ങൾ കുറ്റമില്ലാത്തവരായിരിക്കും.’ അവൾ ഈ കാര്യം വെളിപ്പെടുത്തിയാൽ, അവൾ അവരെക്കൊണ്ട് ചെയ്യിച്ച സത്യത്തിന്റെ ബാധ്യത ഇനി അവർക്കുണ്ടാകില്ല എന്നാണ് എബ്രായപ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ / -യാൽ
  rationale: മുൻപറഞ്ഞ ഉറപ്പിന് ഒരു വിരുദ്ധമായ വ്യവസ്ഥ ഇവിടെ അവതരിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപത്തോടൊപ്പം ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: תַּגִּידִי
  choice: നീ വെളിപ്പെടുത്തിയാൽ
  rationale: נגד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അറിയിക്കുക, വെളിപ്പെടുത്തുക’ എന്നർഥം നൽകുന്നു. സന്ദർഭത്തിൽ രഹസ്യം പുറത്തുപറയുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: നമ്മുടെ ഈ രഹസ്യകാര്യം
  rationale: דבר എന്ന പദത്തിന് ‘വാക്ക്, കാര്യം, ഇടപാട്’ തുടങ്ങിയ വിശാലമായ അർഥങ്ങളുണ്ട്. ഇവിടെ ചാരന്മാരുടെ രഹസ്യദൗത്യത്തെയും ഉടമ്പടിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘രഹസ്യകാര്യം’ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: ഞങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും
  rationale: היה + נקי എന്ന പ്രയോഗം കുറ്റമില്ലായ്മ മാത്രമല്ല, ഒരു ബാധ്യതയിൽനിന്നുള്ള മോചനവും സൂചിപ്പിക്കുന്നു. ഇവിടെ സത്യത്തിന്റെ ബാധ്യതയിൽനിന്ന് ഒഴിവാകുക എന്നതാണ് സന്ദർഭാർഥം.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: സത്യത്തിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗം വേർപാടിനെയോ മോചനത്തെയോ സൂചിപ്പിക്കുന്നു. രണ്ടാം ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം രാഹാബ് അവരെക്കൊണ്ട് ചെയ്യിച്ച സത്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ബന്ധവാക്യം അതു വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച
  rationale: שׁבע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നേരിട്ട് നിലനിർത്താൻ ‘ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച’ എന്നു പരിഭാഷപ്പെടുത്തി.
