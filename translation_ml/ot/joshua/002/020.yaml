  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘പ്രതിജ്ഞ’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ സാധാരണക്കാർക്ക് പരിചിതമായ ‘സത്യം’ ഉപയോഗിച്ചു; കാരണാർഥവും വ്യവസ്ഥയുടെ ഗൗരവവും നിലനിർത്തി.
