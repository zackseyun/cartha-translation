lexical_decisions:
- source_word: טֶרֶם
  choice: മുമ്പ്
  rationale: തുടർന്നുള്ള പ്രവൃത്തി നടക്കുന്നതിനു മുമ്പുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘കിടക്കുന്നതിനുമുമ്പ്’ എന്നു ചേർത്തു.
- source_word: יִשְׁכָּבוּן
  choice: അവർ കിടക്കുന്നതിനുമുമ്പ്
  rationale: שׁכב എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കിടക്കുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഉറങ്ങാൻ കിടക്കുന്നതെന്ന സൂചനയുണ്ടെങ്കിലും ‘ഉറങ്ങുക’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം നിർണ്ണയിക്കുന്നില്ല.
- source_word: עָלְתָה
  choice: കയറിച്ചെന്നു
  rationale: עלה സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: עֲלֵיהֶם
  choice: അവരുടെ അടുക്കൽ
  rationale: ചലനക്രിയയോടൊപ്പം വ്യക്തികളെ ലക്ഷ്യമായി സൂചിപ്പിക്കുന്ന עַל എന്ന പ്രയോഗം മലയാളത്തിൽ ‘അവരുടെ അടുക്കൽ’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: עַל הַגָּג
  choice: മേൽക്കൂരയിലേക്ക്
  rationale: അവൾ കയറിച്ചെന്ന സ്ഥലമായ വീടിന്റെ പരന്ന മേൽക്കൂരയെ സൂചിപ്പിക്കുന്നു; ചലനത്തിന്റെ ലക്ഷ്യം മലയാളത്തിൽ ദിശാവിഭക്തിയോടെ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: וְהֵמָּה ... וְהִיא
  choice: അവർ ... അവൾ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ സർവനാമങ്ങൾ സൃഷ്ടിക്കുന്ന കഥാപാത്രവ്യത്യാസം മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
