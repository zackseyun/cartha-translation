translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വ്യവസ്ഥാപരമായ പ്രസംഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. സ്ത്രീയോടുള്ള ഏകവചന നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ആവർത്തനവും കുടുംബബന്ധങ്ങളുടെ വ്യക്തതയും പരമാവധി സംരക്ഷിച്ചിട്ടുണ്ട്.
