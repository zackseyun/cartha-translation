source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: ml
  text: “ഇതാ, ഞങ്ങൾ ദേശത്ത് പ്രവേശിക്കുമ്പോൾ, നീ ഞങ്ങളെ താഴെയിറക്കിയ ജനാലയിൽ ഈ കടുംചുവപ്പുനൂൽച്ചരട്[a] കെട്ടണം. നിന്റെ അപ്പനെയും അമ്മയെയും സഹോദരന്മാരെയും നിന്റെ അപ്പന്റെ കുടുംബത്തിലുള്ള എല്ലാവരെയും നിന്റെ വീട്ടിലേക്ക് കൂട്ടിച്ചേർക്കണം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കടുംചുവപ്പുനൂലിന്റെ ഈ ചരട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ സൂചനാത്മക ശക്തി നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: בָאִים בָּאָרֶץ
  choice: ഞങ്ങൾ ദേശത്തു പ്രവേശിക്കുമ്പോൾ
  rationale: സന്ദർഭത്തിൽ ഭാവിയിലെ പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന കർത്തരിപ്രയോഗം; വ്യവസ്ഥയുടെ സമയസൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: ഈ കടുംചുവപ്പുനൂൽച്ചരട്
  rationale: תִּקְוָה ഇവിടെ ചരട്/കയർ എന്ന അർഥത്തിലും חוּט നൂൽ എന്ന അർഥത്തിലും വരുന്നു. തിരിച്ചറിയാനുള്ള അടയാളമായ ചരടിനെ സൂചിപ്പിക്കുമ്പോൾ ഘടകങ്ങളുടെ രൂപവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: תִּקְשְׁרִי
  choice: നീ ... കെട്ടണം
  rationale: രണ്ടാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ അപൂർണക്രിയ ഇവിടെ നിർദേശാത്മകമാണ്; ‘കെട്ടണം’ വ്യവസ്ഥാപരമായ നിർബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: നീ ഞങ്ങളെ താഴെയിറക്കിയ ജനാലയിൽ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘താഴെയിറക്കുക’ നേരിട്ട് സൂക്ഷിക്കുകയും ജനാലയുമായുള്ള ബന്ധം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: നിന്റെ അടുക്കൽ വീട്ടിനുള്ളിൽ കൂട്ടിവരുത്തണം
  rationale: ആളുകളെ തന്റെ അടുക്കൽ കൂട്ടുക എന്ന ആശയവും വീട്ടിലേക്കുള്ള ദിശയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: നിന്റെ അപ്പനെയും അമ്മയെയും സഹോദരന്മാരെയും
  rationale: മൂലത്തിലെ ബന്ധപദങ്ങളും אַחַיִךְ എന്ന പുല്ലിംഗ ബഹുവചനവും കൃത്യമായി നിലനിർത്തുന്നു; ‘അപ്പൻ’ ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל בֵּית אָבִיךְ
  choice: നിന്റെ അപ്പന്റെ കുടുംബത്തിലുള്ള എല്ലാവരെയും
  rationale: בֵּית ഇവിടെ കെട്ടിടത്തേക്കാൾ കുടുംബ/ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമായി പറയുന്നു.
