translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. പുരാതന പരന്ന മേൽക്കൂരയ്ക്ക് ‘മട്ടുപ്പാവ്’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ‘അവൾക്കുവേണ്ടി’ എന്ന ഘടകം ഒഴിവാക്കാതെ നിലനിർത്തി.
