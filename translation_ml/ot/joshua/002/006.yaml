translation:
  language: ml
  text: എന്നാൽ അവൾ അവരെ മട്ടുപ്പാവിലേക്കു കയറ്റി, അവൾക്കുവേണ്ടി മട്ടുപ്പാവിൽ നിരത്തിവെച്ചിരുന്ന ചണത്തണ്ടുകൾക്കിടയിൽ ഒളിപ്പിച്ചിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: മട്ടുപ്പാവിലേക്കു / മട്ടുപ്പാവിൽ
  rationale: പുരാതന വീടിന്റെ പരന്ന മേൽക്കൂരയെ സൂചിപ്പിക്കുന്നതിനാൽ, ആളുകൾ കയറുകയും ചണത്തണ്ടുകൾ ഉണക്കാൻ നിരത്തിവെക്കുകയും ചെയ്യുന്ന ഇടമെന്ന അർഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: ചണത്തണ്ടുകൾക്കിടയിൽ
  rationale: פִּשְׁתֵּי הָעֵץ എന്നത് സംസ്കരണത്തിനായി വെച്ചിരുന്ന ചണച്ചെടിയുടെ തണ്ടുകളെ സൂചിപ്പിക്കുന്നു; വെറും നാരുകൾ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ സസ്യഭാഗം നിലനിർത്തുന്നു.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: അവൾക്കുവേണ്ടി ... നിരത്തിവെച്ചിരുന്ന
  rationale: לָהּ എന്ന സ്ത്രീലിംഗ ഏകവചന ദത്തിവിഭക്തിയുടെ സാന്നിധ്യം സംരക്ഷിച്ച്, തണ്ടുകൾ അവളുടെ ആവശ്യത്തിനായി നിരത്തിയിരുന്നതായി വിവർത്തനം ചെയ്തു.
- source_word: וְהִיא הֶעֱלָתַם ... וַתִּטְמְנֵם
  choice: എന്നാൽ അവൾ അവരെ ... കയറ്റി ... ഒളിപ്പിച്ചിരുന്നു
  rationale: സന്ദർഭത്തിലെ മുൻകാല പശ്ചാത്തലപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ പൂർത്തഭൂതകാലരൂപം ഉപയോഗിച്ചു; തുടക്കത്തിലെ וְהִיא ഇവിടെ വിരുദ്ധ/വിശദീകരണബന്ധമായി ‘എന്നാൽ’ എന്നു നൽകി.
