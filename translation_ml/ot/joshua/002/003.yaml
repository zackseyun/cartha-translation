  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: ml
  text: 'അപ്പോൾ യെരീഹോ രാജാവ് രാഹാബിന്റെ അടുക്കലേക്ക് ആളയച്ചു; ഇങ്ങനെ പറയിച്ചു: “നിന്റെ അടുക്കൽ വന്ന് നിന്റെ വീട്ടിൽ കയറിയ ആ പുരുഷന്മാരെ പുറത്തുകൊണ്ടുവരിക; ദേശം മുഴുവൻ പരിശോധിച്ചറിയാനാണ്[a] അവർ വന്നിരിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദേശം മുഴുവൻ ചാരപ്പണി നടത്താൻ” അല്ലെങ്കിൽ “നിരീക്ഷിച്ചറിയാൻ.” എബ്രായ ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ രഹസ്യാന്വേഷണത്തിന്റെ അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שלח എന്ന ക്രിയയുടെ ‘അയയ്ക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; രാജാവ് സന്ദേശവാഹകരെ അയച്ചുവെന്ന സന്ദർഭസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: യെരീഹോരാജാവ്
  rationale: എബ്രായത്തിലെ construct ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל רָחָב
  choice: രാഹാബിന്റെ അടുക്കൽ
  rationale: אֶל ഇവിടെ സന്ദേശത്തിന്റെ ലക്ഷ്യസ്ഥാനത്തെയോ സ്വീകരിക്കുന്നയാളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: הוֹצִיאִי
  choice: പുറത്തുകൊണ്ടുവരിക
  rationale: יצא എന്ന ക്രിയയുടെ Hiphil സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം ഒരാളെ പുറത്തുവരുത്തുക എന്ന ശക്തമായ കല്പനയാണ്.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരെ
  rationale: അറിയപ്പെട്ട നിർദിഷ്ട പുരുഷന്മാരെയാണ് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ആ’ എന്നത് മലയാളത്തിൽ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: നിന്റെ അടുക്കൽ വന്ന്
  rationale: സന്ദർഭത്തിലെ കഴിഞ്ഞുവരവ് സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: നിന്റെ വീട്ടിൽ പ്രവേശിച്ച
  rationale: രണ്ടാമത്തെ בוא വീട്ടിലേക്കുള്ള പ്രവേശനം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ആവർത്തനം ഒഴിവാക്കി ചലനത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: —ആണ്
  rationale: കല്പനയ്ക്കുള്ള കാരണം മലയാളത്തിൽ emphatic copular construction ഉപയോഗിച്ച് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לַחְפֹּר
  choice: രഹസ്യമായി പരിശോധിക്കാൻ
  rationale: חפר ഇവിടെ ദേശത്തെക്കുറിച്ചുള്ള അന്വേഷണാത്മക നിരീക്ഷണമോ ചാരപരിശോധനയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ രഹസ്യാന്വേഷണ ഭാവം നൽകിക്കൊണ്ട് ‘ചാരപ്പണി’ എന്ന കൂടുതൽ നിർണ്ണായക പദം ഒഴിവാക്കുന്നു.
- source_word: אֶת כָּל הָאָרֶץ
  choice: ദേശം മുഴുവൻ
  rationale: הָאָרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, ബന്ധപ്പെട്ട ദേശമോ പ്രദേശമോ ആണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בָּאוּ
  choice: അവർ വന്നിരിക്കുന്നത്
  rationale: അവരുടെ വരവിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ perfect construction മുഖേന പ്രകടമാക്കുന്നു.
