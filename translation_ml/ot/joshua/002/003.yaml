  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. രാജകീയ സന്ദേശത്തിന്റെ നേരിട്ടുള്ള കല്പനാഭാവം സംരക്ഷിച്ചു. חפר എന്ന പദത്തിലെ പരിശോധന/ചാരനിരീക്ഷണം എന്ന അർഥപരിധി മുഖ്യപാഠത്തിൽ ‘രഹസ്യമായി പരിശോധിക്കുക’ എന്നു നൽകി; ഈ വാക്യത്തിൽ footnote marker ചേർക്കേണ്ടതായ യഥാർത്ഥ പാഠവ്യത്യാസമോ അനിവാര്യമായ ദ്വയാർഥമോ കണ്ടില്ല.
