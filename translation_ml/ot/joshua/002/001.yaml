source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: ml
  text: 'നൂന്റെ മകനായ യോശുവ ശിത്തീമിൽനിന്ന് രണ്ടു പുരുഷന്മാരെ ചാരന്മാരായി രഹസ്യമായി അയച്ചു. അവരോട് പറഞ്ഞു: “പോയി ദേശവും യെരീഹോവും കണ്ടറിയുവിൻ.”[a] അവർ പോയി രാഹാബ് എന്നു പേരുള്ള ഒരു വേശ്യയുടെ[b] വീട്ടിലെത്തി, അവിടെ കിടന്നു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദേശവും യെരീഹോവും” എന്നതിന് “ദേശം, പ്രത്യേകിച്ച് യെരീഹോ” എന്നും അർഥമാക്കാം. എബ്രായം ദേശത്തെ പൊതുവായും യെരീഹോയെ പ്രത്യേകമായും എടുത്തുപറയുന്നതായി മനസ്സിലാക്കാൻ കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: “ഒരു സത്രക്കാരിയുടെ” എന്നും ചിലർ സന്ദർഭത്തിന്റെയോ പിൽക്കാല പാരമ്പര്യത്തിന്റെയോ അടിസ്ഥാനത്തിൽ അഭിപ്രായപ്പെട്ടിട്ടുണ്ട്. എന്നാൽ എബ്രായപദത്തിന്റെ സാധാരണ അർഥം “വേശ്യ” എന്നാണ്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “അവിടെ താമസിച്ചു.” എബ്രായം അക്ഷരാർഥത്തിൽ “അവിടെ കിടന്നു” എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: കഥനസന്ദർഭത്തിൽ שלח എന്ന ക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: מִן הַשִּׁטִּים
  choice: ശിത്തീമിൽനിന്ന്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: രണ്ടു പുരുഷന്മാരെ
  rationale: എബ്രായം പുരുഷന്മാരായ രണ്ടു വ്യക്തികളെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: מְרַגְּלִים
  choice: ചാരന്മാരായി
  rationale: അവരുടെ ദൗത്യവും പങ്കും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: חֶרֶשׁ
  choice: രഹസ്യമായി
  rationale: ഇവിടെ പദം ക്രിയാവിശേഷണമായി പ്രവർത്തിച്ച് ദൗത്യത്തിന്റെ രഹസ്യസ്വഭാവം സൂചിപ്പിക്കുന്നു.
- source_word: לְכוּ רְאוּ
  choice: പോയി ... കണ്ടറിയുവിൻ
  rationale: രണ്ടു ആജ്ഞാരൂപങ്ങളുടെയും അർഥം നിലനിർത്തിക്കൊണ്ട് നിരീക്ഷണദൗത്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: ദേശവും യെരീഹോവും
  rationale: എബ്രായത്തിലെ സംയോജകമായ ‘വും/and’ നേരിട്ട് നിലനിർത്തി, യെരീഹോ ദേശത്തിനുള്ളിലെ പ്രത്യേക ലക്ഷ്യമാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: ഒരു വേശ്യയുടെ വീട്ടിൽ
  rationale: זוֹנָה എന്ന പദത്തിന്റെ സാധാരണവും നേരിട്ടുമായ അർഥം ‘വേശ്യ’ എന്നാണ്; ‘സത്രക്കാരി’ എന്നത് സന്ദർഭാധിഷ്ഠിതമായ വ്യാഖ്യാനമാണ്.
- source_word: וּשְׁמָהּ רָחָב
  choice: രാഹാബ് എന്നു പേരുള്ള
  rationale: സ്ത്രീയുടെ പേര് സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ തിരിച്ചറിയിക്കുന്നു.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: അവിടെ കിടന്നു
  rationale: שכב എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ലൈംഗികബന്ധമോ ഔപചാരിക താമസക്രമമോ പാഠത്തിൽ ഇല്ലാത്തവിധം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: രാഹാബിന്റെ തൊഴിൽ സൂചിപ്പിക്കുന്ന זוֹנָה എന്ന പദത്തിന്റെ അർഥം
  choice: വേശ്യ
  alternative: സത്രക്കാരി
  rationale: എബ്രായപദത്തിന്റെ സാധാരണ നിഘണ്ടുവർഥം ‘വേശ്യ’ എന്നാണ്. സാമൂഹികമോ ധാർമികമോ ആയ അസ്വസ്ഥത ഒഴിവാക്കാൻ അതിനെ മൃദൂകരിക്കുന്നത് മൂലപാഠത്തിന്റെ വ്യക്തമായ അർഥം മറയ്ക്കും.
- issue: וַיִּשְׁכְּבוּ שָׁמָּה എന്നതിന്റെ സൂചന
  choice: അവിടെ കിടന്നു
  alternative: അവിടെ താമസിച്ചു
  rationale: മൂലപാഠം അക്ഷരാർഥത്തിൽ ‘അവിടെ കിടന്നു’ എന്നാണ്. ഇത് ലൈംഗികപ്രവർത്തനം സൂചിപ്പിക്കുന്നുവെന്ന് പറയുകയോ ഔപചാരികമായി താമസിച്ചു എന്ന് കൂടുതൽ നിർവചിക്കുകയോ ചെയ്യാതെ കഥനത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ‘ദേശവും യെരീഹോവും’ തമ്മിലുള്ള ബന്ധം
  choice: ദേശവും യെരീഹോവും
  alternative: ദേശം, പ്രത്യേകിച്ച് യെരീഹോ
  rationale: എബ്രായത്തിൽ രണ്ടിനെയും וְ (‘ഉം/and’) കൊണ്ട് ബന്ധിപ്പിക്കുന്നു. യെരീഹോ പൊതുവായ ദേശപരിശോധനയിലെ പ്രധാന ലക്ഷ്യമായിരിക്കാം; എങ്കിലും ‘പ്രത്യേകിച്ച്’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് വ്യാഖ്യാനം കൂടുതൽ വ്യക്തമാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘കണ്ടറിയുവിൻ’ എന്നത് ദൗത്യപരമായ നിരീക്ഷണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു. വ്യക്തി-സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള ബൈബിൾ മലയാളരൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; തൊഴിൽസൂചനയും അവസാന ക്രിയയിലെ അർഥതുറപ്പും മൃദൂകരിക്കാതെ നിലനിർത്തി.
