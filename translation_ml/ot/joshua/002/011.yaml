  naturalness: ‘ഹൃദയം ഉരുകിപ്പോയി’ സ്വാഭാവികമാണ്. ‘നിങ്ങൾ നിമിത്തം’ അൽപം കൃത്രിമമായ പ്രയോഗമാണ്. അടിക്കുറിപ്പ് a-യിലെ “ഞങ്ങൾ കേട്ടു; അപ്പോൾ” എന്ന ഉദ്ധരണി അർഥരഹിതവും പാഠവുമായി പൊരുത്തപ്പെടാത്തതുമാണ്; അത് തിരുത്തണം.
