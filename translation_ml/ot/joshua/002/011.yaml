id: JOS.2.11
reference: Joshua 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: ml
  text: ഞങ്ങൾ അതു കേട്ടപ്പോൾ[a] ഞങ്ങളുടെ ഹൃദയം ഉരുകിപ്പോയി; നിങ്ങളെ ഭയന്ന് ആരിലും പിന്നെ ധൈര്യം ശേഷിച്ചില്ല. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ[b] തന്നെയാണ് മുകളിലെ ആകാശത്തിലും താഴെയുള്ള ഭൂമിയിലും ദൈവം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുൻവിവരത്തെ സൂചിപ്പിക്കുന്ന “അതു” മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തതാണ്.
    reason: lexical_alternative
  - marker: b
    text: “യഹ്‌വേ” എന്നത് എബ്രായത്തിലെ യ്ഹ്വ്ഹ് (יהוה) എന്ന ദൈവനാമത്തെ പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: ഞങ്ങൾ അതു കേട്ടപ്പോൾ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച സംഭവങ്ങളെ സൂചിപ്പിക്കാൻ ‘അതു’ സ്വാഭാവികമായി ചേർക്കുന്നു; തുടർന്നുള്ള പ്രതികരണവുമായി കാലബന്ധം വ്യക്തമാക്കാൻ ‘കേട്ടപ്പോൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: ഞങ്ങളുടെ ഹൃദയം ഉരുകിപ്പോയി
  rationale: ഭയത്താൽ മനോധൈര്യം നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: ആരിലും പിന്നെ ധൈര്യം ശേഷിച്ചില്ല
  rationale: ഇവിടെ רוּחַ കാറ്റിനെയോ പരിശുദ്ധാത്മാവിനെയോ അല്ല, ഉള്ളിലെ ധൈര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങൾ നിമിത്തം
  rationale: അക്ഷരാർഥത്തിൽ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ഭയത്തിന്റെ കാരണത്തെയാണ് അറിയിക്കുന്നത്.
- source_word: כִּי
  choice: കാരണം
  rationale: മുമ്പ് പറഞ്ഞ ഭയത്തിന്റെയും ധൈര്യക്ഷയത്തിന്റെയും കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ യ്ഹ്വ്ഹിനെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ദൈവനാമത്തോടു ചേർന്നുള്ള ബന്ധസൂചക പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הוּא אֱלֹהִים
  choice: തന്നെയാണ് ... ദൈവം
  rationale: പ്രസ്താവനയിലെ ഊന്നൽ നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിൽ പ്രകടമല്ലാത്ത ‘ഏക’മോ ‘സത്യ’മോ ചേർക്കുന്നില്ല.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: മീതെയുള്ള ആകാശത്തിൽ
  rationale: മുകളിലെ ആകാശവും താഴെയുള്ള ഭൂമിയും ചേർന്ന സമഗ്രതാസൂചക ദ്വന്ദ്വത്തിന്റെ ആദ്യഭാഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: താഴെയുള്ള ഭൂമിയിൽ
  rationale: ആകാശം–ഭൂമി ദ്വന്ദ്വം പൂർത്തിയാക്കി ദൈവത്തിന്റെ സർവവ്യാപക അധികാരത്തിന്റെ ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: രാഹാബിന്റെ വിശ്വാസപ്രഖ്യാപനത്തിന്റെ വ്യാപ്തി
  choice: യഹ്‌വേ തന്നെയാണ് മീതെയുള്ള ആകാശത്തിലും താഴെയുള്ള ഭൂമിയിലും ദൈവം
  alternative: യഹ്‌വേ മാത്രമാണ് സത്യദൈവം
  rationale: ആകാശം–ഭൂമി സമഗ്രതാസൂചക പ്രയോഗത്തിലൂടെ യഹ്‌വേയുടെ സാർവത്രിക ദൈവത്വം മൂലപാഠം ഉറപ്പിക്കുന്നു. എന്നാൽ ഇവിടെ നേരിട്ട് ഇല്ലാത്ത ‘മാത്രം’, ‘സത്യ’ എന്നീ വിശേഷണങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഹൃദയം ഉരുകിപ്പോയി’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും, അസ്വാഭാവികമായ ‘ആത്മാവ് എഴുന്നേറ്റില്ല’ എന്ന അക്ഷരാർഥത്തിന് പകരം സന്ദർഭോചിതമായി ‘ധൈര്യം ശേഷിച്ചില്ല’ എന്നു നൽകുകയും ചെയ്തു.
