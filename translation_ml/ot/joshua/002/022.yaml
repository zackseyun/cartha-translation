  terminology: ‘മലമ്പ്രദേശം’ suitably renders the contextual sense of הָהָרָה without prematurely restricting it to one mountain. ‘പിന്തുടർന്നവർ’ and ‘മടങ്ങിവരുന്നതുവരെ’ faithfully express the substantival participle and the return clause. The footnote preserves the lexical alternatives and contextual qualification appropriately.
