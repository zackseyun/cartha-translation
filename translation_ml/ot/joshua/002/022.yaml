  source_fidelity: The Malayalam accurately represents the sequential movement ('they went and came'), the destination in the hill country, the three-day stay, the pursuers' return, and their unsuccessful search along the road. The implicit object of 'did not find' is naturally supplied as 'them' without adding meaning.
