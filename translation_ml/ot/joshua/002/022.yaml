id: JOS.2.22
reference: Joshua 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ וַ/יָּבֹ֣אוּ הָ/הָ֔רָ/ה וַ/יֵּ֤שְׁבוּ שָׁם֙ שְׁלֹ֣שֶׁת יָמִ֔ים עַד שָׁ֖בוּ הָ/רֹדְפִ֑ים וַ/יְבַקְשׁ֧וּ הָ/רֹדְפִ֛ים בְּ/כָל הַ/דֶּ֖רֶךְ וְ/לֹ֥א מָצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: ml
  text: അങ്ങനെ അവർ പോയി മലമ്പ്രദേശത്ത്[a] എത്തി. പിന്തുടർന്നവർ മടങ്ങിവരുന്നതുവരെ അവർ അവിടെ മൂന്നു ദിവസം താമസിച്ചു. പിന്തുടർന്നവർ വഴിയിലുടനീളം തിരഞ്ഞെങ്കിലും അവരെ കണ്ടെത്തിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മലയിലേക്ക്” അല്ലെങ്കിൽ “കുന്നുകളിലേക്ക്.” ഹീബ്രു പദം ഒരൊറ്റ മലശിഖരത്തേക്കാൾ യെരീഹോയുടെ പടിഞ്ഞാറുള്ള മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: അവർ പോയി ... എത്തി
  rationale: തുടർച്ചയായ രണ്ടു ആഖ്യാനക്രിയകളെയും മലയാളത്തിൽ സ്വാഭാവികമായ ചലനക്രമമായി നിലനിർത്തുന്നു.
- source_word: הָהָרָה
  choice: മലമ്പ്രദേശത്ത്
  rationale: ദിശ സൂചിപ്പിക്കുന്ന രൂപവും യെരീഹോയുടെ പടിഞ്ഞാറുള്ള കുന്നിൻപ്രദേശം എന്ന സന്ദർഭസാധ്യതയും പ്രകടമാക്കുന്നു; ഏകമായ ഒരു കൊടുമുടി എന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: അവർ അവിടെ ... താമസിച്ചു
  rationale: ഇവിടെ ישב സ്ഥിരവാസമല്ല, താൽക്കാലികമായി അവിടെ കഴിഞ്ഞതാണെന്ന അർഥം നൽകുന്നു.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: പിന്തുടർന്നവർ മടങ്ങിവരുന്നതുവരെ
  rationale: שוב എന്നതിന്റെ ‘മടങ്ങിവരുക’ എന്ന അർഥവും רֹדְפִים എന്ന substantival participle-ന്റെ പ്രവർത്തകസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים בְּכָל הַדֶּרֶךְ
  choice: പിന്തുടർന്നവർ വഴിയിലുടനീളം തിരഞ്ഞു
  rationale: അന്വേഷണസന്ദർഭത്തിൽ בקש-ന് ‘തിരയുക’ സ്വാഭാവികമാണ്; בְּכָל הַדֶּרֶךְ പാതയുടെ മുഴുവൻ നീളവും സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא מָצָאוּ
  choice: എങ്കിലും അവരെ കണ്ടെത്തിയില്ല
  rationale: ഹീബ്രുവിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ അത് ചാരന്മാരാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാവ് ഇവിടെ ഫലവിരുദ്ധതയായി ‘എങ്കിലും’ എന്നു നൽകുന്നു.
