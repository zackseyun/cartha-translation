  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: ml
  text: 'ആ പുരുഷന്മാർ അവളോടു പറഞ്ഞു: “നിങ്ങൾ ഞങ്ങളുടെ ഈ കാര്യം വെളിപ്പെടുത്താതിരുന്നാൽ, നിങ്ങളുടെ ജീവന് പകരം ഞങ്ങളുടെ ജീവൻ—ഞങ്ങൾ മരിക്കേണ്ടിവന്നാലും. യഹ്‌വെ ഞങ്ങൾക്ക് ദേശം നൽകുമ്പോൾ, ഞങ്ങൾ നിന്നോടു ദയയോടും വിശ്വസ്തതയോടുംകൂടെ[a] പെരുമാറും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ നിന്നോടു വിശ്വസ്തസ്നേഹത്തോടും സത്യസന്ധതയോടുംകൂടെ പെരുമാറും.” എബ്രായത്തിലെ חֶסֶד וֶאֱמֶת എന്ന പദജോടി പലപ്പോഴും ദയാപൂർണവും വിശ്വസനീയവും നിഷ്ഠയുള്ളതുമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: എബ്രായപാഠം സന്ദർഭത്തിൽ ചാരന്മാരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ നേരിട്ട് ‘പുരുഷന്മാർ’ എന്നാണ് പറയുന്നത്; അതിനാൽ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: നിങ്ങളുടെ ജീവന് പകരം ഞങ്ങളുടെ ജീവൻ കൊടുക്കാം
  rationale: נֶפֶשׁ ഇവിടെ ‘ജീവൻ’ എന്നും תַּחַת പകരംവയ്ക്കൽ എന്നും לָמוּת മരണസന്നദ്ധത എന്നും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിജ്ഞാഭാഷ ഉപയോഗിച്ചുകൊണ്ട് സ്വജീവൻ പകരം നൽകാനുള്ള ബാധ്യത നിലനിർത്തുന്നു.
- source_word: אִם לֹא תַגִּידוּ
  choice: നിങ്ങൾ വെളിപ്പെടുത്താതിരുന്നാൽ
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന അർഥമുണ്ട്. രഹസ്യമായ കാര്യം പുറത്തുപറയാതിരിക്കണമെന്ന സന്ദർഭത്തിന് ‘വെളിപ്പെടുത്തുക’ യോജിക്കുന്നു; ‘നിങ്ങൾ’ എബ്രായത്തിലെ ബഹുവചനരൂപത്തെയും മലയാളത്തിലെ മാന്യ ഏകവചനസംബോധനയെയും തുറന്നുവെക്കുന്നു.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: ഞങ്ങളുടെ ഈ കാര്യം
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്,’ ‘കാര്യം,’ ‘വ്യവഹാരം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ദൗത്യമോ ധാരണയോ എന്ന് അതിയായി നിർണ്ണയിക്കാതെ ‘കാര്യം’ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: യഹ്‌വെ ഞങ്ങൾക്ക് ഈ ദേശം തരുമ്പോൾ
  rationale: בְּ സഹിതമുള്ള infinitive construct സമയസാഹചര്യം, ‘തരുമ്പോൾ,’ സൂചിപ്പിക്കുന്നു. നിർദ്ദിഷ്ടമായ ദേശത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഈ ദേശം’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: ഞങ്ങൾ നിന്നോടു … പെരുമാറും
  rationale: עשה עם എന്ന പ്രയോഗത്തിന്റെ ‘ഒരാളോടു പ്രവർത്തിക്കുക/പെരുമാറുക’ എന്ന ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: חֶסֶד וֶאֱמֶת
  choice: ഉടമ്പടിവിശ്വസ്തതയോടും സത്യത്തോടുംകൂടെ
  rationale: חֶסֶד എന്നതിലെ സ്ഥിരമായ ബന്ധനിഷ്ഠയെ ‘ഉടമ്പടിവിശ്വസ്തത’ എന്നും אֱמֶת എന്നതിനെ ‘സത്യം’ എന്നും വേർതിരിച്ചു നിലനിർത്തുന്നു; സാധാരണ ദയയായി മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം വ്യക്തിനാമമായിത്തന്നെ നിലനിർത്തുന്നു; ഒരു പൊതുപദവിയോ പ്രത്യേക പാരമ്പര്യത്തിലെ രൂപമോ നിർബന്ധിക്കുന്നില്ല.
- issue: חֶסֶד וֶאֱמֶת എന്ന പദജോടിയുടെ അർഥബലം
  choice: ഉടമ്പടിവിശ്വസ്തതയോടും സത്യത്തോടുംകൂടെ
  alternative: ദയയോടും വിശ്വസ്തതയോടുംകൂടെ
  rationale: ബന്ധപരമായ നിഷ്ഠയും വിശ്വാസ്യതയും ഉൾക്കൊള്ളുന്ന രണ്ട് ഘടകങ്ങളും മുഖ്യപാഠത്തിൽ വേർതിരിച്ചു സംരക്ഷിക്കുന്നു. കൂടുതൽ പൊതുവായ സ്വാഭാവിക പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: നַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת എന്ന പ്രതിജ്ഞയുടെ സ്വഭാവം
  choice: നിങ്ങളുടെ ജീവന് പകരം ഞങ്ങളുടെ ജീവൻ കൊടുക്കാം
  alternative: നിങ്ങൾക്കുവേണ്ടി ഞങ്ങൾ മരിക്കാം
  rationale: ഇത് പ്രായശ്ചിത്തപരമായ സാങ്കേതിക പ്രസ്താവനയായി വായിക്കാതെ, രാഹാബിനെയും അവളുടെ വീട്ടുകാരെയും സംരക്ഷിക്കാനുള്ള സ്വജീവൻ പണയപ്പെടുത്തിയ ഉറപ്പായി പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. രാഹാബിനോടുള്ള ആദ്യ അഭിസംബോധനയിൽ ‘നിങ്ങൾ’ ഉപയോഗിക്കുന്നത് മാന്യ ഏകവചനവും എബ്രായ ബഹുവചനരൂപവും ഒരുപോലെ തുറന്നുവെക്കുന്നു; നേരിട്ടുള്ള വാഗ്ദാനത്തിൽ ‘നിന്നോടു’ ഉപയോഗിക്കുന്നത് എബ്രായ ഏകവചനത്തെയും സംഭാഷണത്തിന്റെ അടുപ്പത്തെയും പ്രതിഫലിപ്പിക്കുന്നു.
