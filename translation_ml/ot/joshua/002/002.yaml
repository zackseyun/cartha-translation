id: JOS.2.2
reference: Joshua 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣אָמַ֔ר לְ/מֶ֥לֶךְ יְרִיח֖וֹ לֵ/אמֹ֑ר הִנֵּ֣ה אֲ֠נָשִׁים בָּ֣אוּ הֵ֧נָּה הַ/לַּ֛יְלָה מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/חְפֹּ֥ר אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: ml
  text: 'യെരീഹോ രാജാവിന് ഇങ്ങനെ വിവരം ലഭിച്ചു: “ഇതാ, ഇസ്രായേല്യരിൽപ്പെട്ട ചില പുരുഷന്മാർ ദേശത്തെ അന്വേഷിച്ചറിയാൻ ഇന്നു രാത്രി ഇവിടെ വന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: അറിയിച്ചു
  rationale: പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ആരാണ് അറിയിച്ചതെന്ന് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: യെരീഹോ രാജാവിനോട്
  rationale: സ്ഥലനാമവും രാഷ്ട്രീയ പദവിയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: അടിയന്തരമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന കണികയുടെ ശക്തി മാന്യമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲנָשִׁים
  choice: ചില പുരുഷന്മാർ
  rationale: ഇവിടെ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അനിശ്ചിതമായ ഒരു സംഘത്തെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ചില’ ചേർത്തിരിക്കുന്നു.
- source_word: בָּאוּ הֵנָּה
  choice: ഇവിടെ വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ വരവിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും യോജിച്ച മലയാളരൂപം.
- source_word: הַלַּיְלָה
  choice: ഇന്നു രാത്രി
  rationale: സംഭവം നടക്കുന്ന അതേ രാത്രിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേല്യരിൽപ്പെട്ട
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം ജനസമൂഹത്തിലെ അംഗത്വം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לַחְפֹּר
  choice: അന്വേഷിച്ചറിയാൻ
  rationale: ക്രിയയുടെ അന്വേഷിക്കുക, സൂക്ഷ്മമായി പരിശോധിക്കുക എന്നീ അർഥങ്ങൾ നിലനിർത്തുകയും രഹസ്യനിരീക്ഷണം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶת הָאָרֶץ
  choice: ദേശം
  rationale: സന്ദർഭത്തിൽ പരിശോധിക്കപ്പെടുന്ന ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും പതിവുമായ പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത മൂലഭാഷാപ്രയോഗം നിലനിർത്തുകയും ചാരപ്രവർത്തനമെന്ന സന്ദർഭാർഥം മുഖ്യവാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
