translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മുന്നറിയിപ്പിന്റെ അടിയന്തരതയും നിർദേശങ്ങളുടെ ക്രമവും നിലനിർത്തി. എബ്രായത്തിലെ ‘മല/മലമ്പ്രദേശം’ എന്ന അവ്യക്തതയും ‘കണ്ടുമുട്ടുക/നേരിടുക’ എന്ന ക്രിയയുടെ അർത്ഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
