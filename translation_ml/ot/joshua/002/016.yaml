id: JOS.2.16
reference: Joshua 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: ml
  text: 'അവൾ അവരോടു പറഞ്ഞു: “പിന്തുടരുന്നവർ നിങ്ങളെ കണ്ടുമുട്ടാതിരിക്കാൻ[b] മലമ്പ്രദേശത്തേക്ക്[a] പോകുക. അവർ മടങ്ങിവരുന്നതുവരെ മൂന്നുദിവസം അവിടെ ഒളിച്ചിരിക്കുക. അതിനുശേഷം നിങ്ങൾക്കു നിങ്ങളുടെ വഴിക്കു പോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മലയിലേക്ക്”; എബ്രായപദം ഒരു പ്രത്യേക മലയെയോ ചുറ്റുമുള്ള മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നേരിടാതിരിക്കാൻ” അല്ലെങ്കിൽ “നിങ്ങളുടെ അടുത്ത് വന്നുപെടാതിരിക്കാൻ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരാളെ കണ്ടുമുട്ടുക എന്ന അർത്ഥമുണ്ട്. പിന്തുടരുന്ന സന്ദർഭം അതിലെ ശത്രുതാപരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: മലമ്പ്രദേശത്തേക്ക്
  rationale: הַר എന്ന പദം ഒരു പ്രത്യേക മലയെയോ മലനിരകളുള്ള പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. ഒളിവിനായി സമീപത്തെ ദുർഘടപ്രദേശത്തേക്കു പോകാനുള്ള നിർദേശമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘മലമ്പ്രദേശം’ സ്വാഭാവികവും മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: פֶּן יִפְגְּעוּ בָכֶם
  choice: പിന്തുടരുന്നവർ നിങ്ങളെ കണ്ടുമുട്ടാതിരിക്കാൻ
  rationale: פֶּן മുൻകരുതലോടുകൂടിയ നിഷേധലക്ഷ്യം പ്രകടിപ്പിക്കുന്നു. פגע ב എന്നത് ‘കണ്ടുമുട്ടുക’, ‘നേരിടുക’, ‘വന്നുപെടുക’ എന്നീ അർത്ഥങ്ങൾക്കിടയിൽ നിൽക്കുന്നു. പിന്തുടരുന്ന സന്ദർഭം ശത്രുതാപരമായ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നതിനാൽ കൂടുതൽ അർത്ഥം ചേർക്കാതെ ‘കണ്ടുമുട്ടുക’ ഉപയോഗിച്ചു.
- source_word: וְנַחְבֵּתֶם
  choice: ഒളിച്ചിരിക്കുക
  rationale: നിഫാൽ രൂപം അവർ സ്വയം മറഞ്ഞിരിക്കണമെന്ന നിർദേശം നൽകുന്നു. ‘ഒളിച്ചിരിക്കുക’ ആ സ്വയംസംബന്ധമായ അർത്ഥവും നിശ്ചിതകാലം മറഞ്ഞുകഴിയുന്നതും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നുദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ ‘മൂന്നുദിവസം’ എന്നു നേരിട്ട് നൽകുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: അവർ മടങ്ങിവരുന്നതുവരെ
  rationale: עַד + שוב കാത്തിരിപ്പിന്റെ അവസാനപരിധി സൂചിപ്പിക്കുന്നു. ആവർത്തനം ഭാരമാകാതിരിക്കാൻ ‘പിന്തുടരുന്നവർ’ എന്നതിനെ അടുത്ത വാക്യത്തിൽ ‘അവർ’ എന്നു പരാമർശിച്ചു.
- source_word: וְאַחַר תֵּלְכוּ לְדַרְכְּכֶם
  choice: അതിനു ശേഷം നിങ്ങൾക്കു നിങ്ങളുടെ വഴിക്കു പോകാം
  rationale: മുൻ നിർദേശങ്ങൾ പാലിച്ചശേഷമുള്ള അടുത്ത നടപടിയും അനുമതിസ്വരവും ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു. ‘പോകാം’ എന്നത് മലയാളത്തിൽ ആ സ്വരം സ്വാഭാവികമായി നൽകുന്നു.
