source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: ml
  text: നിന്റെ വീടിന്റെ വാതിലുകൾ കടന്ന് പുറത്തുപോകുന്ന ഏവന്റെയും രക്തം അവന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും; ഞങ്ങൾ കുറ്റമില്ലാത്തവരായിരിക്കും. എന്നാൽ വീട്ടിൽ നിന്നോടുകൂടെ ഉള്ള ഏവന്റെയും രക്തം ഞങ്ങളുടെ തലമേൽ ആയിരിക്കും[a]—അവന്റെമേൽ കൈവെച്ചാൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രക്തം അവന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും”, “രക്തം ഞങ്ങളുടെ തലമേൽ ആയിരിക്കും” എന്നിവ രക്തച്ചൊരിച്ചിലിനോ മരണത്തിനോ ആരാണ് ഉത്തരവാദി എന്നു വ്യക്തമാക്കുന്ന നിയമപ്രയോഗങ്ങളാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ നിബന്ധന നേരിട്ട് അവതരിപ്പിക്കുന്നു
  rationale: ഈ രൂപം അടുത്ത നിബന്ധനയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ നിബന്ധന നേരിട്ട് പറയുന്നത് സ്വാഭാവികവും അർഥസമ്പൂർണ്ണവുമാണ്.
- source_word: כֹּל אֲשֶׁר
  choice: ഏവന്റെയും
  rationale: സന്ദർഭത്തിൽ ഇത് വ്യക്തികളെ ഓരോരുത്തരായി സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗമാണ്; ‘ഏവന്റെയും’ ആ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: നിന്റെ വീട്ടിന്റെ വാതിലുകൾ കടന്ന് പുറത്തുപോകുന്ന
  rationale: പുറത്തേക്കുള്ള ചലനം വ്യക്തമായി നൽകുകയും എബ്രായത്തിലെ ദിശാസൂചന അനാവശ്യമായി ആവർത്തിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: അവന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും
  rationale: രക്തച്ചൊരിച്ചിലിനോ മരണത്തിനോ ഉള്ള ഉത്തരവാദിത്വം ചുമത്തുന്ന നിയമപ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: ഞങ്ങൾ കുറ്റമില്ലാത്തവരായിരിക്കും
  rationale: ശപഥപ്രകാരമുള്ള ബാധ്യതയിൽനിന്നുള്ള വിമുക്തിയെ നിയമപരമായ വ്യക്തതയോടെ അറിയിക്കുന്നു.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: എന്നാൽ വീട്ടിൽ നിന്നോടുകൂടെ ഉള്ള ഏവന്റെയും
  rationale: വീട്ടിനുള്ളിൽ തുടരുന്ന ഓരോ വ്യക്തിക്കും ബാധകമായ വിരുദ്ധ നിബന്ധന സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: രക്തം ഞങ്ങളുടെ തലമേൽ ആയിരിക്കും
  rationale: മുമ്പത്തെ സമാന്തര നിയമപ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തി ചാരന്മാർ ഏറ്റെടുക്കുന്ന ഉത്തരവാദിത്വം വ്യക്തമാക്കുന്നു.
- source_word: אִם יָד תִּהְיֶה בוֹ
  choice: അവന്റെമേൽ കൈവെച്ചാൽ
  rationale: ഉപദ്രവമോ അക്രമമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കൈ’ എന്ന ദൃശ്യരൂപവും നിർദിഷ്ടമല്ലാത്ത കർത്തൃഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്തത്തിന്റെ ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗം
  choice: ‘രക്തം അവന്റെ സ്വന്തം തലമേൽ / ഞങ്ങളുടെ തലമേൽ ആയിരിക്കും’ എന്ന രൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു
  alternative: ‘തന്റെ മരണത്തിന് അവൻതന്നെ ഉത്തരവാദിയായിരിക്കും / അവന്റെ മരണത്തിന് ഞങ്ങൾ ഉത്തരവാദികളായിരിക്കും’
  rationale: വ്യാഖ്യാനപരമായ പരാവർത്തനം അർഥം വ്യക്തമാക്കുമെങ്കിലും മൂലപാഠത്തിന്റെ ഉടമ്പടിപരവും നിയമപരവുമായ ഗൗരവവും സമാന്തരഘടനയും നഷ്ടപ്പെടുത്തും; അതിനാൽ പ്രയോഗം നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- issue: അനിശ്ചിത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചന രൂപം
  choice: ‘അവന്റെ’ എന്ന ഏകവചന രൂപം നിലനിർത്തുന്നു
  alternative: ബഹുവചനമോ ലിംഗനിരപേക്ഷമായ പരാവർത്തനമോ ഉപയോഗിക്കുക
  rationale: എബ്രായം അനിശ്ചിത വ്യക്തിയെ വിതരണാത്മക ഏകവചനത്തിൽ അവതരിപ്പിക്കുന്നു. ഇവിടെ പുരുഷലിംഗരൂപം നിയമപരമായ പ്രതിനിധിപ്രയോഗമാണ്; പുരുഷന്മാരെ മാത്രം പരിമിതപ്പെടുത്തുന്നതല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ഉടമ്പടി ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സമാന്തരമായ ‘രക്തം തലമേൽ’ പ്രയോഗം നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
