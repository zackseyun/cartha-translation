  source_fidelity: ആദ്യ സമാന്തര നിയമപ്രയോഗത്തിൽ എബ്രായത്തിലെ דָּמוֹ (‘അവന്റെ രക്തം’) പരിഭാഷയിൽ വിട്ടുപോയിരിക്കുന്നു. രണ്ടാമത്തെ പ്രയോഗത്തിലും അടിക്കുറിപ്പിലും ‘രക്തം’ ഉള്ളതിനാൽ ഇത് വ്യക്തമായ അർഥനഷ്ടമാണ്. മറ്റുഘടകങ്ങൾ—വീടിന് പുറത്തുപോകുന്നവനും വീട്ടിൽ രാഹാബിനോടുകൂടെ ഉള്ളവനും തമ്മിലുള്ള വിരുദ്ധനിബന്ധന, ചാരന്മാരുടെ കുറ്റവിമുക്തി, ‘കൈവെക്കുക’ എന്ന അനിശ്ചിത കർത്തൃഭാവമുള്ള പ്രയോഗം—മൂലത്തോടു യോജിക്കുന്നു.
  naturalness: തിരുത്തിയ രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘നിന്റെ വീടിന്റെ വാതിലുകൾ’ എന്ന രൂപം ‘നിന്റെ വീട്ടിന്റെ വാതിലുകൾ’ എന്നതിനെക്കാൾ പ്രയോഗസഹജമാണ്. ‘അവന്റെമേൽ കൈവെച്ചാൽ’ സന്ദർഭത്തിൽ അക്രമം/ഉപദ്രവം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ അനിശ്ചിത കർത്തൃപ്രയോഗമാണ്.
  terminology: ‘രക്തം ... തലമേൽ’ എന്ന നിയമപരമായ രക്ത-ഉത്തരവാദിത്വപ്രയോഗം സമാന്തരമായി നിലനിർത്തിയിരിക്കുന്നു. ‘കുറ്റമില്ലാത്തവരായിരിക്കും’ נְקִיִּם എന്ന ബാധ്യതയിൽനിന്നുള്ള കുറ്റവിമുക്തിയെ യോജ്യമായി അറിയിക്കുന്നു. അടിക്കുറിപ്പ് ഈ പ്രയോഗത്തിന്റെ നിയമപരമായ ഉദ്ദേശ്യം വിശദീകരിക്കുന്നു; വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിലേക്ക് മാറ്റുന്നില്ല.
