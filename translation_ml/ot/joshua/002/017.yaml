revisions:
- from: 'അപ്പോൾ ആ പുരുഷന്മാർ അവളോടു പറഞ്ഞു: “നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച ഈ ശപഥത്തിന്റെ ബാധ്യതയിൽനിന്ന് ഞങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും.[a]”'
  to: 'അപ്പോൾ ആ മനുഷ്യർ അവളോടു പറഞ്ഞു: “നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച ഈ നിന്റെ ശപഥത്തിൽനിന്ന് ഞങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും.[a]”'
  rationale: The revision removes the added noun ‘ബാധ്യത’ from the main text while retaining the intended legal-release sense through ‘ശപഥത്തിൽനിന്ന് ... ഒഴിവുള്ളവർ.’ It also uses more natural modern Malayalam for the ordinary Hebrew term ‘the men,’ preserves the future-oriented contextual sense, and keeps the lexical ambiguity in the footnote.
