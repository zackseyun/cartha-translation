id: JOS.2.17
reference: Joshua 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלֶ֖י/הָ הָ/אֲנָשִׁ֑ים נְקִיִּ֣ם אֲנַ֔חְנוּ מִ/שְּׁבֻעָתֵ֥/ךְ הַ/זֶּ֖ה אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ മനുഷ്യർ അവളോടു പറഞ്ഞു: “നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച ഈ നിന്റെ ശപഥത്തിൽനിന്ന് ഞങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച ഈ നിന്റെ ശപഥത്തിന്റെ കാര്യത്തിൽ ഞങ്ങൾ ബാധ്യതയില്ലാത്തവരാണ്.” എബ്രായപദത്തിന് നിയമപരമോ ഉടമ്പടിസംബന്ധമോ ആയ ബാധ്യതയിൽനിന്ന് ഒഴിവുള്ളവർ എന്ന അർത്ഥമുണ്ട്; ‘കുറ്റമില്ലാത്തവർ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നൽകാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: אֵלֶיהָ
  choice: അവളോടു
  rationale: രാഹാബിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘പുരുഷന്മാർ’ എന്ന പദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവർ ചാരന്മാരാണെങ്കിലും ആ പ്രത്യേക പദവി ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: נְקִיִּם
  choice: ബാധ്യതയിൽനിന്ന് ... ഒഴിവുള്ളവരായിരിക്കും
  rationale: നിയമപരമോ ഉടമ്പടിസംബന്ധമോ ആയ ബാധ്യതയിൽനിന്നുള്ള വിടുതലാണ് ഇവിടെ പ്രധാന അർത്ഥം. തുടർന്നുവരുന്ന നിബന്ധനകളുടെ പശ്ചാത്തലത്തിൽ ഭാവിസൂചന സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: ഈ ശപഥത്തിന്റെ ബാധ്യതയിൽനിന്ന്
  rationale: מִן സൂചിപ്പിക്കുന്ന വേർപെടലും הַזֶּה എന്ന നിർദേശകത്തിന്റെ ‘ഈ’ എന്ന അർത്ഥവും നിലനിർത്തുന്നു. രണ്ടാം ഏകവചന സ്ത്രീലിംഗ ഉടമസ്ഥപ്രത്യയം ബന്ധവാക്യത്തിലൂടെ വ്യക്തമാണ്.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: നീ ഞങ്ങളെക്കൊണ്ട് ചെയ്യിച്ച
  rationale: ശപഥം ചെയ്യാൻ അവൾ അവരെ പ്രേരിപ്പിച്ചു എന്ന ഹിഫീൽ കാരകഭാവവും ‘ഞങ്ങളെ’ എന്ന കർമപ്രത്യയവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: נְקִיִּם എന്ന പദത്തിന്റെ കാലസൂചനയും ബാധ്യതാസംബന്ധമായ അർത്ഥവും
  choice: ഞങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും
  alternative: ഞങ്ങൾ ഒഴിവുള്ളവരാണ് / ഞങ്ങൾ കുറ്റമില്ലാത്തവരാണ്
  rationale: ഹീബ്രുവിൽ വിശേഷണവാക്യം സ്വതവേ കാലം നിർണ്ണയിക്കുന്നില്ല. അടുത്ത വാക്യങ്ങളിൽ വരാനിരിക്കുന്ന നിബന്ധനകളെ ആശ്രയിച്ചുള്ള വിടുതലാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഭാവിരൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എന്നാൽ മൂലരൂപത്തിന്റെ കാലപരമായ തുറന്ന നിലയും ‘നിർദോഷർ/ബാധ്യതയില്ലാത്തവർ’ എന്ന നിയമപരമായ നിഴലർത്ഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചാരന്മാർ’ എന്ന് സന്ദർഭവിവരം ചേർക്കാതെ മൂലത്തിലെ ‘പുരുഷന്മാർ’ നിലനിർത്തി; ‘ശപഥം’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ പദമായി തിരഞ്ഞെടുത്തു.
