translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. തുടർച്ചയായ എബ്രായ ക്രിയാക്രമം മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപങ്ങളാലും അവസാനത്തെ പൂർണക്രിയയാലും സ്വാഭാവികമാക്കി. രണ്ടാം വാക്യം റിപ്പോർട്ടിനെ വ്യക്തമായി വേർതിരിക്കുന്നു.
