source:
  edition: WLC
  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: ml
  text: പിന്നെ ആ രണ്ടുപേരും മടങ്ങി, മലയിൽനിന്ന് ഇറങ്ങി, അക്കരെ കടന്ന്, നൂന്റെ മകനായ യോശുവയുടെ അടുക്കൽ ചെന്നു. തങ്ങൾക്കു സംഭവിച്ചതെല്ലാം[a] അവർ അവനോടു വിവരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങൾക്കു നേരിട്ടതെല്ലാം”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തങ്ങളെ കണ്ടെത്തിയ സകല കാര്യങ്ങളും.”
    reason: מצא എന്ന ക്രിയാപ്രയോഗത്തിന്റെ എബ്രായ രൂപകം മലയാള മുഖ്യപാഠത്തിൽ ആശയാനുസൃതമായി നൽകിയതിനാൽ അക്ഷരാർഥവും മറ്റൊരു സ്വാഭാവിക പരിഭാഷയും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: മടങ്ങി
  rationale: שׁוב എന്ന ക്രിയയുടെ ആഖ്യാനസന്ദർഭത്തിലെ സ്വാഭാവിക അർഥം ദൗത്യം കഴിഞ്ഞ് മടങ്ങുക എന്നതാണ്.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: ആ രണ്ടുപേരും
  rationale: എബ്രായപാഠം അവരെ ചാരന്മാർ എന്നു വിശേഷിപ്പിക്കാതെ ‘രണ്ട് പുരുഷന്മാർ’ എന്നാണ് പറയുന്നത്. മലയാളത്തിൽ സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്നവരെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ആ രണ്ടുപേരും’ എന്നു നൽകി.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: മലയിൽനിന്ന് ഇറങ്ങി
  rationale: הָהָר ഏകവചനവും നിർദിഷ്ടവുമാണ്; സമീപസന്ദർഭത്തിലെ ഒളിത്താവളമായ മലയെ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘മലയിൽനിന്ന്’ എന്നു നൽകി. വിശാലമായ മലമ്പ്രദേശം എന്ന അർഥസാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
- source_word: וַיַּעַבְרוּ
  choice: അക്കരെ കടന്ന്
  rationale: עבר ഇവിടെ മറുകരയിലേക്കു കടക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ കടന്ന വസ്തു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ‘യോർദ്ദാൻ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവയുടെ അടുക്കൽ ചെന്നു
  rationale: בוא אֶל എന്ന പ്രയോഗവും പിതൃനാമസഹിതമായ തിരിച്ചറിയലും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: അവർ അവനോടു വിവരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ സംഭവങ്ങൾ പറഞ്ഞറിയിക്കുക അഥവാ വിവരിക്കുക എന്നാണ്; ദൗത്യറിപ്പോർട്ടിന്റെ ഭാവം ‘വിവരിച്ചു’ എന്നതിൽ ലഭിക്കുന്നു.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: തങ്ങൾക്കു സംഭവിച്ചതെല്ലാം
  rationale: מצאയുടെ ഈ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘തങ്ങളെ കണ്ടെത്തിയ കാര്യങ്ങളെല്ലാം’ എന്നാണെങ്കിലും, തങ്ങൾക്കു നേരിട്ടതോ സംഭവിച്ചതോ ആയ എല്ലാം എന്ന എബ്രായ ശൈലിയാണ് ഉദ്ദേശിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ‘സംഭവിച്ചതെല്ലാം’ എന്നു നൽകി; രൂപകത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
