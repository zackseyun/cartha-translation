id: JOS.2.9
reference: Joshua 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: ml
  text: 'അവൾ ആ പുരുഷന്മാരോടു പറഞ്ഞു: “യഹ്‌വെ നിങ്ങൾക്ക് ഈ ദേശം നൽകിയിരിക്കുന്നുവെന്നും നിങ്ങളോടുള്ള ഭീതി ഞങ്ങളുടെമേൽ വീണിരിക്കുന്നുവെന്നും[a] ഈ ദേശത്തിലെ സകല നിവാസികളും നിങ്ങളുടെ മുമ്പിൽ ഉരുകിപ്പോയിരിക്കുന്നുവെന്നും[b] എനിക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളെക്കുറിച്ചുള്ള കൊടുംഭീതി ഞങ്ങളുടെമേൽ വീണിരിക്കുന്നു.”'
    reason: אֵימָה എന്ന പദത്തിന് ‘ഭീതി’ എന്നതിനെക്കാൾ ശക്തമായ ‘കൊടുംഭീതി/ഭയങ്കരം’ എന്ന അർത്ഥവും ഉണ്ടാകാം.
  - marker: b
    text: 'അഥവാ: “ഈ ദേശത്തിലെ സകല നിവാസികൾക്കും നിങ്ങൾ നിമിത്തം ധൈര്യം നഷ്ടപ്പെട്ടിരിക്കുന്നു.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “ഉരുകിയിരിക്കുന്നു” എന്നാണ്.'
    reason: മൂലത്തിലെ രൂപകവും അതിന്റെ സന്ദർഭോചിതമായ അർത്ഥമായ ധൈര്യനഷ്ടവും വായനക്കാരന് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: അവൾ ആ പുരുഷന്മാരോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്ക് പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ ക്രിയാക്രമം നിലനിർത്തി. നിർദിഷ്ടലേഖനം ഉടൻ പരാമർശിക്കപ്പെട്ട പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ പുരുഷന്മാർ’ എന്നു നൽകി.
- source_word: יָדַעְתִּי
  choice: എനിക്കറിയാം
  rationale: പൂർണ്ണക്രിയ ഇവിടെ ഇപ്പോഴും പ്രസക്തമായ ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വർത്തമാനാവസ്ഥാപ്രയോഗം അതു സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: യഹ്‌വെ നിങ്ങൾക്ക് ഈ ദേശം നൽകിയിരിക്കുന്നു
  rationale: ജയം ഇനിയും പുരോഗമിച്ചുകൊണ്ടിരുന്നെങ്കിലും രാഹാബിന്റെ കാഴ്ചയിൽ ദാനം ഉറപ്പായ സംഭവമാണ്. ‘നൽകിയിരിക്കുന്നു’ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ നിർദിഷ്ട ദേശം മലയാളത്തിൽ ‘ഈ ദേശം’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: നിങ്ങളോടുള്ള ഭീതി ഞങ്ങളുടെമേൽ വീണിരിക്കുന്നു
  rationale: אֵימָהയുടെ ഭയം/കൊടുംഭീതി എന്ന അർത്ഥവും ‘മേൽ വീഴുക’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും നിലനിർത്തി. ‘നിങ്ങളുടെ ഭീതി’ എന്നു പറഞ്ഞാൽ നിങ്ങൾ അനുഭവിക്കുന്ന ഭയം എന്ന തെറ്റായ അർത്ഥം വരാമെന്നതിനാൽ ‘നിങ്ങളോടുള്ള ഭീതി’ എന്നു നൽകി.
- source_word: נָמֹגוּ
  choice: ഉരുകിപ്പോയിരിക്കുന്നു
  rationale: ക്രിയയുടെ ഉരുകുക/അലിഞ്ഞുപോകുക എന്ന ശക്തമായ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ധൈര്യം നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: ഈ ദേശത്തിലെ സകല നിവാസികളും
  rationale: പങ്കാളിത്തരൂപത്തെ കൂട്ടനാമമായി കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും ഗൗരവമുള്ളതും മനസ്സിലാക്കാവുന്നതുമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: സാന്നിധ്യം, സമീപനം, അതുമൂലമുള്ള ഭയം എന്നീ അർത്ഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന എബ്രായ ഇടിയം അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലത്തിലെ നാമസ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: ദേശദാനം പൂർത്തിയായതായി പറയുന്ന പൂർണ്ണക്രിയ
  choice: നൽകിയിരിക്കുന്നു
  alternative: നൽകി; നൽകുകയാണ്
  rationale: ദേശാധിനിവേശം ഇനിയും പൂർത്തിയായിട്ടില്ലെങ്കിലും രാഹാബ് ദൈവത്തിന്റെ ദാനത്തെ ഉറപ്പായും ഫലപ്രദമായും കണക്കാക്കുന്നു. ഈ കാലപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം ‘നൽകിയിരിക്കുന്നു’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഞങ്ങളുടെമേൽ വീണിരിക്കുന്നു’, ‘ഉരുകിപ്പോയിരിക്കുന്നു’ എന്നീ മൂലരൂപകങ്ങൾ മനപ്പൂർവം നിലനിർത്തി; വ്യാഖ്യാനപരമായ സമാനാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
