id: JOS.2.24
reference: Joshua 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: ml
  text: 'അവർ യോശുവയോടു പറഞ്ഞു: “തീർച്ചയായും യഹോവ ദേശം മുഴുവനും നമ്മുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു; ദേശവാസികളെല്ലാം നമ്മെ ഭയന്ന് ധൈര്യം ചോർന്നുപോയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഈ കണം ചാരന്മാരുടെ ഉറച്ച നിഗമനത്തെ ഊന്നിപ്പറയുന്നു; ഇംഗ്ലീഷ് consultation layer-ലെ ‘Surely’ എന്ന അർഥവും ഇതിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: നമ്മുടെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന ആശയം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: נָמֹגוּ
  choice: ധൈര്യം ചോർന്നുപോയിരിക്കുന്നു
  rationale: മൂലത്തിലെ ‘ഉരുകിപ്പോകുക’ എന്ന രൂപകം ഭയത്താൽ മനോധൈര്യം നഷ്ടപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפָּנֵינוּ
  choice: നമ്മെ ഭയന്ന്
  rationale: അക്ഷരാർഥമായ ‘നമ്മുടെ മുമ്പിൽ/നമ്മുടെ നിമിത്തം’ എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ഇസ്രായേലിനെക്കുറിച്ചുള്ള ഭയം കാരണമാണെന്ന് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വേ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- issue: ദേശത്തിന്റെ കൈമാറ്റം പൂർത്തിയായതായി പറയുന്ന perfect രൂപം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: നാട് ഇനിയും പൂർണമായി കൈവശപ്പെടുത്തിയിട്ടില്ലെങ്കിലും, ചാരന്മാർ യഹോവയുടെ പ്രവൃത്തിയെ ഉറപ്പായും നടന്നതായി പ്രഖ്യാപിക്കുന്ന മൂലത്തിലെ perfect രൂപവും വിശ്വാസപൂർണമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ഉറപ്പും ആവേശവും നിലനിർത്തി; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
