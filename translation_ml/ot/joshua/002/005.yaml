id: JOS.2.5
reference: Joshua 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: ml
  text: ഇരുട്ടായപ്പോൾ കവാടം അടയ്ക്കാനിരിക്കെ[a] ആ പുരുഷന്മാർ പുറത്തേക്കു പോയി. അവർ എവിടേക്കു പോയെന്ന് എനിക്ക് അറിയില്ല. വേഗം അവരെ പിന്തുടരുക; നിങ്ങൾ അവരെ പിടിച്ചെത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരുട്ടിൽ കവാടം അടയ്ക്കാനിരിക്കെ’; എബ്രായ പ്രയോഗം ഇരുട്ട് ആരംഭിക്കുന്ന സമയത്തുള്ള കവാടം അടയ്ക്കലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר
  choice: കവാടം അടയ്ക്കാനിരിക്കെ
  rationale: היה എന്ന ക്രിയയോടുകൂടിയ לִסְגֹּר ആസന്നമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അടയ്ക്കാനിരിക്കെ’ എന്നത് കവാടം അടയ്ക്കാൻ പോകുന്ന സമയത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בַּחֹשֶׁךְ
  choice: ഇരുട്ടായപ്പോൾ
  rationale: ഇരുട്ടിന്റെ ആരംഭത്തോടനുബന്ധിച്ച സമയസൂചനയായി പ്രയോഗിച്ചിരിക്കുന്നു; ‘ഇരുട്ടായപ്പോൾ’ എന്നത് സമയാർഥം വ്യക്തമായി നൽകുന്നു, എന്നാൽ മറ്റൊരു വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: ആ പുരുഷന്മാർ പുറത്തേക്കു പോയി
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാന ചലനാർഥമായ ‘പുറത്തേക്കു പോകുക’ നിലനിർത്തുന്നു. മുമ്പ് പരാമർശിക്കപ്പെട്ടവരാണെന്ന സൂചനയ്ക്ക് ‘ആ’ ചേർത്തു.
- source_word: לֹא יָדַעְתִּי
  choice: എനിക്ക് അറിയില്ല
  rationale: രൂപത്തിൽ പൂർണക്രിയയായിരുന്നാലും നേരിട്ടുള്ള സംഭാഷണത്തിൽ നിലവിലുള്ള അറിവില്ലായ്മയാണ് അവകാശപ്പെടുന്നത്; അതിനാൽ മലയാളത്തിലെ വർത്തമാനാവസ്ഥ സ്വാഭാവികമാണ്.
- source_word: אָנָה הָלְכוּ
  choice: എവിടേക്കു പോയെന്ന്
  rationale: אָנָה ലക്ഷ്യസ്ഥാനത്തെക്കുറിച്ചുള്ള ചോദ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എവിടേക്കു’ എന്നത് ‘എവിടെ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: വേഗം അവരെ പിന്തുടരുക
  rationale: ആജ്ഞയും വേഗതയും പിന്തുടരുന്ന പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּי תַשִּׂיגוּם
  choice: നിങ്ങൾ അവരെ പിടിച്ചെത്തും
  rationale: Hiphil രൂപത്തിലുള്ള נשׂג പിന്തുടർന്ന് ഒപ്പമെത്തുക അഥവാ പിടിച്ചെത്തുക എന്നർഥം നൽകുന്നു. ‘പിടിച്ചെത്തും’ പിന്തുടർച്ചയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; വെറും ‘പിടിക്കും’ എന്നത് പിടികൂടൽ എന്ന അധിക ആശയം നൽകാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘കവാടം,’ ‘പിന്തുടരുക’ എന്നിവ സന്ദർഭത്തിന് അനുയോജ്യമായ ഔപചാരികത നൽകുന്നു; പുരാതനമോ സഭാവിഭാഗവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
