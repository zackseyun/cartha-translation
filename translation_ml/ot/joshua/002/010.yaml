source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ യഹ്‌വെ നിങ്ങളുടെ മുമ്പിൽ ചെങ്കടലിലെ[a] വെള്ളം വറ്റിച്ചുകളഞ്ഞതും, യോർദ്ദാന്റെ മറുകരയിലുണ്ടായിരുന്ന അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരായ സീഹോനോടും ഓഗിനോടും നിങ്ങൾ ചെയ്തതെന്തെന്നും—അവരെ നിങ്ങൾ നാശത്തിനായി സമർപ്പിച്ചതെന്നും—ഞങ്ങൾ കേട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ യാം സൂഫ്; പരമ്പരാഗതമായി ‘ചെങ്കടൽ’; കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഞാങ്ങണകളുടെ കടൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ഭയത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: שָׁמַעְנוּ
  choice: ഞങ്ങൾ കേട്ടിരിക്കുന്നു
  rationale: കേട്ട വിവരം ഇപ്പോഴും അവരെ ബാധിക്കുന്നുവെന്ന എബ്രായ പൂർണക്രിയയുടെ പ്രസക്തി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
- source_word: הוֹבִישׁ
  choice: വറ്റിച്ചുകളഞ്ഞു
  rationale: יבש എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘വറ്റിച്ചു/ഉണങ്ങുമാറാക്കി’ എന്ന കാരകാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵי יַם סוּף
  choice: ചെങ്കടലിലെ വെള്ളം
  rationale: പരമ്പരാഗതവും വായനക്കാർക്ക് പരിചിതവുമായ ഭൂമിശാസ്ത്രനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: ഇസ്രായേലിന്റെ മുമ്പിൽനിന്ന് വെള്ളം നീക്കപ്പെട്ടതെന്ന സ്ഥലബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: നിങ്ങൾ ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: കാലസൂചകമായ ക്രിയാനാമഘടനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരായ
  rationale: എബ്രായ നിർമാണബന്ധവും പിന്നാലെയുള്ള രാജാക്കന്മാരുടെ പേരുകളുമായുള്ള സമാനാധികരണവും വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ ഉണ്ടായിരുന്ന
  rationale: രാഹാബിന്റെ കാഴ്ചപ്പാടിൽ യോർദ്ദാന്റെ മറുകരയിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: സീഹോനോടും ഓഗിനോടും
  rationale: രണ്ട് അമോര്യരാജാക്കന്മാരെ പേരെടുത്ത് തിരിച്ചറിയുകയും ‘അവരോട് ചെയ്തത്’ എന്ന മലയാളഘടനയോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: הֶחֱרַמְתֶּם
  choice: നിങ്ങൾ അവരെ നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിലെ സമർപ്പണം/വിലക്ക്, അതിന്റെ ഫലമായ നാശം എന്നീ രണ്ടു ഘടകങ്ങളും വെറും ‘കൊന്നു’ അല്ലെങ്കിൽ ‘തോൽപ്പിച്ചു’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ പദവിയാൽ പകരാതെ പേരായി നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തിന്റെ മലയാള ശബ്ദാന്തരമാണ്.
- issue: חרם എന്ന യുദ്ധ-സമർപ്പണ പദത്തിന്റെ പരിഭാഷ
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു; വിലക്കിനുകീഴാക്കി
  rationale: പദത്തിന്റെ പ്രത്യേക മതപരവും യുദ്ധപരവുമായ ആശയഭാരം സംരക്ഷിക്കുന്നു; അതിനെ സാധാരണ സൈനികനാശമായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട എബ്രായവാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, ചരם എന്ന അവസാന വിശദീകരണം ഡാഷുകൾക്കുള്ളിൽ നൽകി ‘നിങ്ങൾ ചെയ്തതു’ എന്താണെന്ന് വ്യക്തമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
