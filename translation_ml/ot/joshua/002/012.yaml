reference: Joshua 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: ml
  text: 'ഇപ്പോൾ, യഹ്‌വെയുടെ നാമത്തിൽ എന്നോടു സത്യം ചെയ്യണമേ: ഞാൻ നിങ്ങളോടു ദയ കാണിച്ചതുപോലെ നിങ്ങളും എന്റെ പിതാവിന്റെ കുടുംബത്തോടു ദയ കാണിക്കുമെന്നും എനിക്ക് വിശ്വസിക്കാവുന്ന ഒരു അടയാളം[a] നൽകുമെന്നും,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സത്യമായ ഒരു അടയാളം,’ ‘ഉറപ്പായ ഒരു അടയാളം,’ അല്ലെങ്കിൽ ‘വിശ്വസനീയമായ ഒരു ഉറപ്പ്.’
    reason: אוֹת אֱמֶת എന്ന പ്രയോഗത്തിന് അടയാളത്തിന്റെ സത്യസന്ധത, വിശ്വാസ്യത, ഉറപ്പുനൽകുന്ന സ്വഭാവം എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: വിവരണത്തിൽനിന്ന് അടിയന്തരമായ അഭ്യർഥനയിലേക്കുള്ള സംക്രമണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; വാവിന്റെ ബന്ധകഭാവം വാക്യസന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: എന്നോടു ദയവായി സത്യം ചെയ്യുക
  rationale: ബഹുവചന നിഫാൽ ആജ്ഞയുടെ ‘സത്യം ചെയ്യുക’ എന്ന അർഥവും נָא നൽകുന്ന വിനീതവും അടിയന്തരവുമായ അഭ്യർഥനാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹ്‌വെയെച്ചൊല്ലി
  rationale: ശപഥത്തിൽ യഹ്‌വെയെ ആഹ്വാനം ചെയ്യുന്നതിനെ സ്വാഭാവികമായ മലയാളപ്രയോഗത്തിൽ അവതരിപ്പിക്കുകയും ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: ഞാൻ നിങ്ങളോടു ദയ കാണിച്ചതുപോലെ
  rationale: חֶסֶד എന്നതിലെ വിശ്വസ്തവും അനുഗ്രഹപൂർണവുമായ നന്മയുടെ ഭാരം ഈ വ്യക്തിപരമായ സന്ദർഭത്തിൽ അതിരുകടന്ന സാങ്കേതികഭാഷയില്ലാതെ ‘ദയ’ കൊണ്ട് നൽകുന്നു.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: നിങ്ങളും … ദയ കാണിക്കുമെന്നും
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള വാവ്-ഖാതൽ രൂപത്തെ ആവശ്യപ്പെടുന്ന ഭാവി/ശപഥത്തിന്റെ ഉള്ളടക്കമായി വായിക്കുന്നു; ‘നിങ്ങളും’ പരസ്പരപ്രതികരണം വ്യക്തമാക്കുന്നു.
- source_word: בֵּית אָבִי
  choice: എന്റെ പിതാവിന്റെ കുടുംബം
  rationale: ഹീബ്രു കുടുംബ-ഗൃഹസമൂഹ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; വെറും കെട്ടിടം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: אוֹת אֱמֶת
  choice: വിശ്വസിക്കാവുന്ന ഒരു അടയാളം
  rationale: אוֹת എന്നതിനെ ‘അടയാളം’ എന്നും אֱמֶת നൽകുന്ന സത്യസന്ധത/വിശ്വാസ്യതയുടെ ഗുണത്തെ ‘വിശ്വസിക്കാവുന്ന’ എന്നും അവതരിപ്പിക്കുന്നു; ഉറപ്പോ പണയമോ എന്ന സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ നിയമനാമം പൊതുപദവിയാക്കി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חֶסֶד എന്ന പദത്തിന്റെ ബന്ധപരമായ ഭാരം
  choice: ദയ
  alternative: വിശ്വസ്തസ്നേഹം; ഉടമ്പടിവിശ്വസ്തത
  rationale: രാഹാബും ചാരന്മാരും തമ്മിലുള്ള ഈ സന്ദർഭത്തിൽ ‘ദയ’ സ്വാഭാവികവും മതവിഭാഗപരമായ വ്യാഖ്യാനം ചുമത്താത്തതുമാണ്; ഒരേ പദം രണ്ടിടത്തും ആവർത്തിച്ച് പരസ്പരബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘അടയാളം’ എന്ന പ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
