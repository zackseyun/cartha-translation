  naturalness: The current placement of the long content clause before ‘swear’ is grammatically possible but heavy in modern Malayalam. Moving the oath formula and main request earlier yields a clearer, more natural sentence without changing scope or emphasis. സത്യം ചെയ്യണമേ naturally carries the politeness/urgency of נא.
