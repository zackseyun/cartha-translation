source:
  edition: WLC
  text: וְ/הַחֲיִתֶ֞ם אֶת אָבִ֣/י וְ/אֶת אִמִּ֗/י וְ/אֶת אַחַ/י֙ וְ/אֶת אחות/י וְ/אֵ֖ת כָּל אֲשֶׁ֣ר לָ/הֶ֑ם וְ/הִצַּלְתֶּ֥ם אֶת נַפְשֹׁתֵ֖י/נוּ מִ/מָּֽוֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ അപ്പനെയും അമ്മയെയും, എന്റെ സഹോദരന്മാരെയും സഹോദരിമാരെയും, അവർക്കുള്ള എല്ലാവരെയും[b] ജീവനോടെ കാക്കുകയും[a] ഞങ്ങളുടെ ജീവനെ മരണത്തിൽനിന്ന് വിടുവിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവനോടെ കാക്കുക’ എന്നതിന് ‘ജീവിക്കാൻ ഇടയാക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർക്കുള്ള എല്ലാവരെയും’ എന്നത് അവരുടെ വീട്ടിലെ മറ്റംഗങ്ങളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നതാകാം; ഈ പദപ്രയോഗം ‘അവർക്കുള്ള സകലത്തെയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: ജീവനോടെ കാക്കുകയും
  rationale: חיה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ജീവിക്കാൻ ഇടയാക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്നാണ്. മരണഭീഷണിയുടെ സാഹചര്യത്തിൽ ‘ജീവനോടെ കാക്കുക’ എന്നത് കാരകഭാവവും അഭ്യർഥനയുടെ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: എന്റെ അപ്പനെയും അമ്മയെയും, എന്റെ സഹോദരന്മാരെയും സഹോദരിമാരെയും
  rationale: എബ്രായത്തിലെ ബന്ധുസൂചകപദങ്ങളുടെ ക്രമവും ആവർത്തിച്ചുള്ള ഊന്നലും കഴിയുന്നത്ര നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ אחותי സഹോദരിമാരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: അവരുടേതായ എല്ലാവരെയും
  rationale: രക്ഷിക്കപ്പെടേണ്ട കുടുംബാംഗങ്ങളെയും ആശ്രിതരെയും സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ അർഥം സന്ദർഭത്തിൽ ഏറ്റവും സാധ്യതയുള്ളതാണ്. എന്നാൽ മൂലപദപ്രയോഗത്തിന് വസ്തുവകകളെയും ഉൾക്കൊള്ളാവുന്ന വിശാലതയുള്ളതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְהִצַּלְתֶּם
  choice: വിടുവിക്കുകയും
  rationale: נצל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘വിടുവിക്കുക/രക്ഷിക്കുക’ എന്നാണ് അർഥം. ‘വിടുവിക്കുക’ മരണഭീഷണിയിൽനിന്നുള്ള മോചനത്തെ ഗൗരവമുള്ള ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: נַפְשֹׁתֵינוּ
  choice: ഞങ്ങളുടെ ജീവൻ
  rationale: ഇവിടെ נפש ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെയല്ല, അപകടത്തിലായ വ്യക്തികളുടെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കൂട്ടായ അർഥത്തിൽ ‘ഞങ്ങളുടെ ജീവൻ’ സ്വാഭാവികമാണ്.
- source_word: מִמָּוֶת
  choice: മരണത്തിൽനിന്നു
  rationale: എബ്രായ മുൻപ്രത്യയവും מָוֶת എന്ന നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഭീഷണിയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭ്യർഥനാശൈലി ഉപയോഗിച്ചു. അഭിസംബോധന ചെയ്യപ്പെടുന്നവർ രണ്ടുപേരായതിനാൽ ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കി. ബന്ധുപദങ്ങളുടെ ആവർത്തനത്തിലൂടെ എബ്രായത്തിലെ ഊന്നൽ നിലനിർത്തി; ‘ആത്മാക്കൾ’ പോലുള്ള സന്ദർഭവിരുദ്ധമായ മതസാങ്കേതിക പദം ഒഴിവാക്കി.
