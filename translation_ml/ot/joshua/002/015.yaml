  terminology: ‘കയറുകൊണ്ട്,’ ‘ജനലിലൂടെ,’ and ‘താമസിച്ചിരുന്നത്’ are appropriate. The footnote should be anchored to the wall-residence wording, not to the lowering action, since it explains the location phrase.
