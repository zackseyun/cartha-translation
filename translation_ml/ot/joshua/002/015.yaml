  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: ml
  text: അപ്പോൾ അവൾ അവരെ ഒരു കയറുകൊണ്ട് ജനലിലൂടെ താഴെയിറക്കി, കാരണം അവളുടെ വീട് നഗരമതിലിൽ ആയിരുന്നു; അവൾ മതിലിൽത്തന്നെ താമസിച്ചിരുന്നത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവളുടെ വീട് നഗരമതിലിന്മേൽ ആയിരുന്നു; അവൾ മതിലിന്മേൽ താമസിച്ചിരുന്നു.’ എബ്രായത്തിലെ പ്രയോഗം അവളുടെ വാസസ്ഥലം നഗരമതിലിന്റെ ഘടനയ്ക്കുള്ളിലോ അതിന്മേലോ ആയിരുന്നുവെന്ന് സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: അപ്പോൾ അവൾ അവരെ ... താഴെയിറക്കി
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘താഴേക്ക് പോകാൻ ഇടയാക്കുക/താഴെയിറക്കുക’ എന്ന കാരകാർഥം നൽകുന്നു. കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ് ‘അപ്പോൾ’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: בַּחֶבֶל
  choice: ഒരു കയറുകൊണ്ട്
  rationale: חֶבֶל എന്നത് ‘കയർ’ എന്നാണ്; ב ഇവിടെ ഉപകരണാർഥകമായതിനാൽ ‘കയറുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּעַד הַחַלּוֹן
  choice: ജനലിലൂടെ
  rationale: בְּעַד ഇവിടെ ഒരു തുറവിലൂടെ കടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ജനലിലൂടെ’ എന്നത് ലളിതവും കൃത്യവുമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: താഴെയിറക്കൽ എങ്ങനെ സാധ്യമായിരുന്നു എന്നതിന്റെ വിശദീകരണം ഈ പദം അവതരിപ്പിക്കുന്നു.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: അവളുടെ വീട് നഗരമതിലിനുള്ളിലായിരുന്നു
  rationale: പദശഃ ‘അവളുടെ വീട് മതിലിന്റെ ചുവരിൽ/മതിലിനകത്ത്’ എന്നാണ്. വാസസ്ഥലം നഗരമതിലിന്റെ ഘടനയിലായിരുന്നുവെന്ന ആശയം നിലനിർത്താൻ ‘നഗരമതിലിനുള്ളിൽ’ എന്നു നൽകി; ‘പണിതുചേർത്തിരുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: അവൾ ആ മതിലിനുള്ളിലാണു താമസിച്ചിരുന്നത്
  rationale: יָשַׁב ‘താമസിക്കുക/വസിക്കുക’ എന്നും പങ്കാളിരൂപം തുടരുന്ന വാസസ്ഥിതിയെയും സൂചിപ്പിക്കുന്നു. בַחוֹמָהയിലെ സ്ഥലംസംബന്ധിയായ അസ്പഷ്ടത കഴിയുന്നത്ര നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. ‘നഗരമതിലിനുള്ളിൽ’ എന്ന പ്രയോഗം പുരാതന മതിലിന്റെ ഘടനയിൽ ഉൾപ്പെട്ട വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘മേൽ/ഉള്ളിൽ’ എന്ന എബ്രായത്തിലെ സ്ഥലസംബന്ധിയായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
