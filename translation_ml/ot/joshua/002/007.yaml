translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കവാടം’ നഗരകവാടമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ വിശദീകരണം ചേർത്തിട്ടില്ല. ‘യോർദ്ദാൻ’ എന്ന പരിചിത ബൈബിൾ സ്ഥലനാമരൂപം ഉപയോഗിച്ചു.
