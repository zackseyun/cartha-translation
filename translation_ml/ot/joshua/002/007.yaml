source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: ml
  text: ആ ആളുകൾ അവരെ പിന്തുടർന്ന് യോർദ്ദാനിലേക്കുള്ള വഴിയിലൂടെ കടവുകൾവരെ[a] പോയി. അവരെ പിന്തുടർന്നവർ പുറത്തുപോയ ഉടനെ, അവരുടെ പിന്നാലെ കവാടം അടച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോർദ്ദാനിലെ കടന്നുപോകാവുന്ന ഇടങ്ങളിലേക്ക്”; ‘കടവുകൾ’ എന്നത് നദി നടന്നുകടക്കാവുന്ന ആഴംകുറഞ്ഞ സ്ഥലങ്ങളാണ്.
    reason: מַעְבָּרוֹת എന്ന പദത്തിന് ‘കടന്നുപോകാവുന്ന ഇടങ്ങൾ’ എന്ന ബദൽ അർഥസാധ്യതയുണ്ട്; ഇവിടെ അത് യോർദ്ദാനിലെ ആഴംകുറഞ്ഞ കടവുകളെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: ആ ആളുകൾ
  rationale: നിശ്ചയാർഥക ബഹുവചനം മുൻസന്ദർഭത്തിലെ രാജാവിന്റെ ആളുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ മുൻപരാമർശം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആ ആളുകൾ’ എന്നു നൽകി.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: അവരെ പിന്തുടർന്ന് ... പോയി
  rationale: רדף എന്നതിന്റെ പിന്തുടരൽ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, യാത്രാമാർഗം ചേർന്നിരിക്കുന്ന വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: യോർദ്ദാനിലേക്കുള്ള വഴിയിലൂടെ
  rationale: דֶּרֶךְ ഇവിടെ യോർദ്ദാനിലേക്കു നയിക്കുന്ന വഴി/പാതയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: കടവുകൾവരെ
  rationale: מַעְבָּרוֹת നദി കടക്കാവുന്ന ആഴംകുറഞ്ഞ ഇടങ്ങളാണ്; യാത്രാസന്ദർഭത്തിലെ עַל ലക്ഷ്യപരിധിയായി ‘വരെ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: കവാടം അടച്ചു
  rationale: നിശ്ചയാർഥക ഏകവചനം സന്ദർഭത്തിൽ നഗരകവാടത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നഗര’ എന്ന പദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: אַחֲרֵי כַּאֲשֶׁר יָצְאוּ
  choice: പുറത്തുപോയ ഉടനെ
  rationale: സംഭവങ്ങളുടെ അടുത്തകാലക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; കവാടം അവരുടെ പിന്നാലെ അടച്ചുവെന്ന ആശയം വാക്യക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: അവരെ പിന്തുടർന്നവർ
  rationale: ക്രിയാവിശേഷണരൂപം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നതും ആവർത്തിച്ചുള്ള പിന്തുടരൽ ആശയവും സംരക്ഷിക്കുന്നു.
