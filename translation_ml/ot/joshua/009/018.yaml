source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കൾ അവരെ അടിച്ചില്ല[a], കാരണം സഭയുടെ പ്രമാണിമാർ ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയുടെ നാമത്തിൽ അവരോടു ശപഥം ചെയ്തിരുന്നു. അപ്പോൾ സഭ മുഴുവനും പ്രമാണിമാർക്കെതിരേ പിറുപിറുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ ആക്രമിച്ചില്ല’ അല്ലെങ്കിൽ ‘അവരെ കൊന്നില്ല.’ എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് പ്രഹരിക്കുക, ആക്രമിക്കുക, അല്ലെങ്കിൽ കൊല്ലുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: അവരെ ആക്രമിച്ചില്ല
  rationale: נכה എന്ന ക്രിയയ്ക്ക് അടിക്കുക, ആക്രമിക്കുക, യുദ്ധസന്ദർഭത്തിൽ കൊല്ലുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ഗിബെയോന്യർക്കെതിരായ സായുധനടപടി ഒഴിവാക്കിയതാണ് സന്ദർഭം; ‘ആക്രമിച്ചില്ല’ സ്വാഭാവികമായ മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ മരണഫലം നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും സമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാള ബൈബിൾഭാഷയും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: അവരോടു ശപഥം ചെയ്തിരുന്നു
  rationale: ശപഥം മുൻപേ നടന്നതും ഇപ്പോഴത്തെ ആക്രമിക്കാതിരിക്കലിന് കാരണമായതും മലയാളത്തിലെ പൂർത്തഭൂതകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: സഭയുടെ പ്രമാണിമാർ
  rationale: נְשִׂיאִים അംഗീകൃത തലവന്മാരെ സൂചിപ്പിക്കുന്നു; ‘പ്രമാണിമാർ’ പുരാതന സമൂഹനേതൃത്വത്തിന് യോജിച്ച, ഗൗരവമുള്ള മലയാളപദമാണ്. עֵדָה ഇവിടെ കൂടിയ സമൂഹമായ ‘സഭ’യായി നൽകിയിരിക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹോവയുടെ നാമത്തിൽ
  rationale: שׁבע-യോടൊപ്പമുള്ള בְ ശപഥം ആരെ സാക്ഷിയാക്കി/ആരുടെ നാമത്തിൽ ചെയ്തുവെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നാമത്തിൽ’ സ്വാഭാവികമായി ഈ ബന്ധം അറിയിക്കുന്നു; יהוה ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു.
- source_word: וַיִּלֹּנוּ
  choice: പിറുപിറുത്തു
  rationale: לון സമൂഹമായി നേതാക്കൾക്കെതിരേ അസന്തോഷത്തോടെ മുറുമുറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുത്തു’ അതിന്റെ കൂട്ടായ പരാതിയും പ്രതികൂലഭാവവും നിലനിർത്തുന്നു.
- source_word: כָל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: כָל എന്ന സമഗ്രതയും עֵדָה എന്ന കൂടിയ സമൂഹവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഉടമ്പടിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: עֵדָה എന്ന സമൂഹപദം
  choice: സഭ
  alternative: സമൂഹം / ജനസഭ
  rationale: ഇവിടെ പദം ഇസ്രായേലിന്റെ കൂടിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ സ്വാഭാവികവും ചുരുക്കവുമാണ്; പിന്നീടുള്ള പ്രത്യേക സഭാശാസ്ത്ര അർഥം നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘ഇസ്രായേൽമക്കൾ,’ ‘ശപഥം,’ ‘പ്രമാണിമാർ,’ ‘പിറുപിറുത്തു’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തിന്റെ ചരിത്രപരമായ ഭാവം സൂക്ഷിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്.
