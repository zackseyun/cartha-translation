  source_fidelity: The Hebrew הִכּוּם is simply ‘struck them’; ‘അവരെ ആക്രമിച്ചില്ല’ narrows it to an attack and is consequently more interpretive than necessary. ‘അവരെ അടിച്ചില്ല’ retains the source verb’s concrete but outcome-unspecified force. The oath, divine name, and the complaint against the leaders are otherwise conveyed faithfully.
