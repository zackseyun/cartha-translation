  terminology: ‘യഹോവയുടെ നാമത്തിൽ’ naturally expresses swearing by Yahweh and preserves the divine name. ‘ശപഥം ചെയ്തിരുന്നു’ accurately reflects the prior oath. The footnote should present ‘attack’ and ‘kill’ as contextual possibilities, not make either the main translation.
