id: JOS.9.8
reference: Joshua 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: ml
  text: അവർ യോശുവയോട്, “ഞങ്ങൾ അങ്ങയുടെ ദാസന്മാരാണ്[a],” എന്നു പറഞ്ഞു. അപ്പോൾ യോശുവ അവരോട്, “നിങ്ങൾ ആരാണ്? എവിടെനിന്നാണ് വരുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ അങ്ങയുടെ അടിമകളാണ്.” עֲבָדֶיךָ എന്ന ഹീബ്രായപ്രയോഗത്തിന് ‘ദാസന്മാർ’ എന്നും ‘അടിമകൾ’ എന്നും അർഥമാകാം. ഇവിടെ സംസാരിക്കുന്നവർ നയതന്ത്രപരമായ അപേക്ഷയിൽ വിനയത്തോടെ കീഴ്വഴക്കം പ്രകടിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദാസന്മാർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: עֶבֶד എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ദാസൻ’, ‘സേവകൻ’, ‘അടിമ’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഗിബെയോന്യർ നയതന്ത്രപരമായ വിനയഭാഷയിൽ തങ്ങളെ കീഴടങ്ങിയ അപേക്ഷകരായി അവതരിപ്പിക്കുന്നതിനാൽ ‘ദാസന്മാർ’ സ്വാഭാവികമാണ്; ‘അടിമകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲנָחְנוּ
  choice: ഞങ്ങൾ ... ആണ്
  rationale: ഹീബ്രായ നാമവാക്യത്തിൽ ബന്ധകക്രിയ പ്രകടമല്ലെങ്കിലും സ്വാഭാവികമായ മലയാളവാക്യത്തിന് ‘ആണ്’ ചേർക്കുന്നു.
- source_word: מִי אַתֶּם
  choice: നിങ്ങൾ ആരാണ്?
  rationale: ചോദ്യപദവും സർവനാമവും അധിക നാമം ചേർക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: എവിടെനിന്നാണ് വരുന്നത്?
  rationale: מֵאַיִן ഉത്ഭവസ്ഥലം ചോദിക്കുന്നു. בוא എന്ന ക്രിയയുടെ രൂപം ഇവിടെ ഇപ്പോഴത്തെ യാത്രയുടെ ഘട്ടത്തെക്കാൾ അവർ എവിടത്തുകാരാണെന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിലെ ‘വരുക’ എന്ന ക്രിയയും നിലനിർത്തുന്നു.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: അവർ ... പറഞ്ഞു; അപ്പോൾ യോശുവ ... ചോദിച്ചു
  rationale: ഹീബ്രായ ആഖ്യാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ ഭൂതകാലക്രിയകളാൽ അവതരിപ്പിക്കുന്നു. രണ്ടാമത്തെ വാചകം ചോദ്യം ആയതിനാൽ പൊതുവായ ‘പറഞ്ഞു’ എന്നതിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചോദിച്ചു’ ഉപയോഗിക്കുന്നു; ‘അപ്പോൾ’ സംസാരിക്കുന്നയാളുടെ മാറ്റവും ക്രമവും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. യോശുവയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുമ്പോൾ നയതന്ത്രപരമായ ആദരവും വിനയവും പ്രകടമാക്കാൻ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
