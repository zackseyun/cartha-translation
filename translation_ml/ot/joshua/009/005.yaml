- source_word: בָּלוֹת
  choice: പഴകിയ
  rationale: കാലപ്പഴക്കവും ഉപയോഗവും മൂലം ജീർണിച്ച അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; വെറും ‘പഴയ’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: מְטֻלָּאוֹת
  choice: തുന്നിച്ചേർത്ത
  rationale: കഷണങ്ങൾ ചേർത്ത് അറ്റകുറ്റപ്പണി ചെയ്ത പാദരക്ഷകളെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּרַגְלֵיהֶם
  choice: അവരുടെ കാലുകളിൽ
  rationale: എബ്രായത്തിലെ സ്ഥലസൂചനയും ദൃശ്യമായ വിശദാംശവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שְׂלָמוֹת
  choice: വസ്ത്രങ്ങൾ
  rationale: പ്രത്യേക ഇനം അനാവശ്യമായി നിർണ്ണയിക്കാതെ പൊതുവായ വസ്ത്രസൂചന നിലനിർത്തുന്നു.
- source_word: עֲלֵיהֶם
  choice: ദേഹത്ത്
  rationale: വസ്ത്രങ്ങൾ അവർ ധരിച്ചിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֶחֶם צֵידָם
  choice: യാത്രയ്ക്കായി അവർ കരുതിയിരുന്ന അപ്പം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അപ്പം’ നിലനിർത്തിക്കൊണ്ട് צֵידָם യാത്രാസംഭാരമാണെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: יָבֵשׁ הָיָה
  choice: ഉണങ്ങി ... ആയിരുന്നു
  rationale: അപ്പത്തിന്റെ അവസ്ഥയെ വിവരിക്കുന്ന എബ്രായ ഘടന ലളിതമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: נִקֻּדִים
  choice: പൊടിഞ്ഞത്
  rationale: അപൂർവവും അർഥം അനിശ്ചിതവുമായ പദത്തിന്, ഉണങ്ങിയ അപ്പം പൊടിഞ്ഞുപോയ അവസ്ഥ എന്ന സന്ദർഭോചിത സാധ്യത തിരഞ്ഞെടുക്കുന്നു; ‘പൂപ്പൽ പിടിച്ചത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
