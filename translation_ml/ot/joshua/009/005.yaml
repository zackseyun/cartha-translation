  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: ml
  text: അവരുടെ കാലുകളിൽ പഴകിയതും തുന്നിച്ചേർത്തതുമായ ചെരിപ്പുകളും ദേഹത്ത് പഴകിയ വസ്ത്രങ്ങളും ഉണ്ടായിരുന്നു. യാത്രയ്ക്കായി അവർ കരുതിയിരുന്ന അപ്പമെല്ലാം ഉണങ്ങിയതും പൊടിഞ്ഞതുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂപ്പൽ പിടിച്ചതായിരുന്നു.” ഇവിടെ “പൊടിഞ്ഞത്” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്. അത് ഉണങ്ങി കഷണങ്ങളായി പൊടിഞ്ഞ അപ്പത്തെ സൂചിപ്പിക്കാം; ചിലർ അതിനെ “പൂപ്പൽ പിടിച്ചത്” എന്നും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: ചെരിപ്പുകൾ
