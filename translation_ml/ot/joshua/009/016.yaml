- from: അവരുമായി ഉടമ്പടി ചെയ്തിട്ട് മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ, അവർ തങ്ങളുടെ സമീപത്തുള്ളവരാണെന്നും തങ്ങളുടെ ഇടയിൽ താമസിക്കുന്നവരാണെന്നും ഇസ്രായേല്യർ കേട്ടറിഞ്ഞു.
