id: JOS.9.16
reference: Joshua 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: ml
  text: അവരുമായി ഉടമ്പടി ചെയ്തിട്ട് മൂന്നാം ദിവസത്തിന്റെ അവസാനം, അവർ തങ്ങളോടു സമീപമുള്ളവരും തങ്ങളുടെ ഇടയിൽ താമസിക്കുന്നവരുമാണെന്ന് ഇസ്രായേല്യർ കേട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ
  rationale: ‘മൂന്നു ദിവസത്തിന്റെ അറ്റത്ത്’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സമയാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: അവരുമായി ഉടമ്പടി ചെയ്തിട്ട്
  rationale: כרת ברית എന്ന സ്ഥിരപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഉടമ്പടി ചെയ്യുക’ എന്നു പരിഭാഷപ്പെടുത്തി; לָהֶם സൂചിപ്പിക്കുന്ന മറുപക്ഷബന്ധം ‘അവരുമായി’ എന്നു വ്യക്തമാക്കി.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: അവർ തങ്ങളുടെ സമീപത്തുള്ളവരാണെന്നും
  rationale: אֵלָיו എന്ന ഏകവചന പ്രത്യയം സന്ദർഭത്തിൽ ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പ്രതിഫലനസർവനാമം ഉപയോഗിച്ചു.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: തങ്ങളുടെ ഇടയിൽ താമസിക്കുന്നവരാണെന്നും
  rationale: בְּקִרְבּוֹയുടെ അക്ഷരാർഥമായ ‘അതിന്റെ/അവന്റെ നടുവിൽ’ എന്നത് ഇവിടെ ഇസ്രായേലിന്റെ പ്രദേശത്തിനുള്ളിലോ അവരുടെ മധ്യേയോ വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ പരിധി നിലനിർത്താൻ ‘ഇടയിൽ’ തെരഞ്ഞെടുത്തു.
- source_word: וַיִּשְׁמְעוּ
  choice: ഇസ്രായേല്യർ കേട്ടറിഞ്ഞു
  rationale: ഹീബ്രായത്തിൽ വിഷയം ക്രിയയിൽ ഉൾക്കൊള്ളുന്നുണ്ടെങ്കിലും മുൻസന്ദർഭത്തിലെ ഇസ്രായേല്യരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ വിഷയം വ്യക്തമാക്കി.
theological_decisions:
- issue: אֵלָיו / בְּקִרְבּוֹ എന്ന ഏകവചന പ്രത്യയങ്ങളുടെ കൂട്ടായ സൂചന
  choice: ‘തങ്ങളുടെ സമീപത്ത് / തങ്ങളുടെ ഇടയിൽ’ എന്നു ഇസ്രായേൽ സമൂഹത്തെ കൂട്ടായ ഏകകമായി നിലനിർത്തി
  alternative: ‘അവന്റെ സമീപത്ത് / അവന്റെ ഇടയിൽ’ എന്ന അക്ഷരാർഥ ഏകവചനം
  rationale: ഇവിടെ ഏകവചനം ഇസ്രായേലിനെ ഒരു കൂട്ടായ ഏകകമായി കാണുന്നു; യോശുവയെ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുന്നത് അനാവശ്യമായ അർഥനിർണയമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രായ വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ കാലബന്ധവും റിപ്പോർട്ട് ചെയ്ത വിവരവും വ്യക്തമായി അവതരിപ്പിച്ചു; വ്യാഖ്യാനപരമായ അധികവിവരം ചേർത്തിട്ടില്ല.
