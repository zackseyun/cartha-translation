id: JOS.9.6
reference: Joshua 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: ml
  text: 'അവർ ഗിൽഗാലിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ ചെന്നു. അവർ അവനോടും ഇസ്രായേൽ പുരുഷന്മാരോടും പറഞ്ഞു: “ഞങ്ങൾ ദൂരദേശത്തുനിന്നു വന്നവരാണ്. അതുകൊണ്ട് ഇപ്പോൾ ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞങ്ങളുമായി ഒരു സന്ധി ചെയ്യുക.” ഹീബ്രു ശൈലിയുടെ അക്ഷരാർഥം “ഞങ്ങളുമായി ഒരു ഉടമ്പടി മുറിക്കുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: അവർ ... ചെന്നു
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയും തുടർച്ചയായ ആഖ്യാനരൂപവും സ്വാഭാവിക മലയാളത്തിൽ ‘ചെന്നു’ എന്ന് നൽകിയിരിക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം തുടർന്നുള്ള പ്രയോഗങ്ങൾ വ്യക്തമാക്കുന്നു.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: ഗിൽഗാലിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ
  rationale: ആവർത്തിച്ചുള്ള אֶל യോശുവയെയും പാളയത്തെയും ലക്ഷ്യസ്ഥാനമായി ചൂണ്ടുന്നു. മലയാളത്തിൽ സ്ഥലം ആദ്യം പറഞ്ഞ് ‘യോശുവയുടെ അടുക്കൽ’ എന്നു നൽകുന്നത് അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമാണ്.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: מַחֲנֶה എന്നത് ഇവിടെ യാത്രാ-സൈനിക പശ്ചാത്തലത്തിലെ camp/encampment ആണ്; ‘പാളയം’ അതിന്റെ സാധാരണവും മാന്യവുമായ മലയാള തുല്യപദമാണ്.
- source_word: וַיֹּאמְרוּ
  choice: അവർ ... പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ സംസാരക്രിയയെ ആഖ്യാനശൈലിക്ക് യോജിച്ച ലളിതമായ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: അവനോടും ഇസ്രായേൽപുരുഷന്മാരോടും
  rationale: אִישׁ יִשְׂרָאֵל ഒരു സമാഹാര ഏകവചനപ്രയോഗമാണ്. പുരുഷലിംഗരൂപവും കൂട്ടായ അർഥവും സംരക്ഷിക്കാൻ ‘ഇസ്രായേൽപുരുഷന്മാർ’ ഉപയോഗിച്ചു.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: ദൂരദേശത്തുനിന്ന്
  rationale: אֶרֶץ ഇവിടെ ദേശം/രാജ്യം എന്നും רְחוֹקָה ദൂരെ എന്നും അർഥമാക്കുന്നു; സംയുക്തരൂപമായ ‘ദൂരദേശം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בָּאנוּ
  choice: ഞങ്ങൾ ... വന്നവരാണ്
  rationale: സമ്പൂർണക്രിയയുടെ ഇപ്പോഴുള്ള ഫലം—അവർ ഇപ്പോൾ അവിടെ എത്തിയിരിക്കുന്നു—മലയാളത്തിലെ ‘വന്നവരാണ്’ എന്ന പ്രസ്താവന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: ഈ പ്രയോഗം അപേക്ഷയിലേക്കുള്ള നിഗമനാത്മക മാറ്റം സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട് ഇപ്പോൾ’ അതിന്റെ ബന്ധവും സമയസൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക
  rationale: כרת ברית അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന ഹീബ്രു ശൈലിയാണെങ്കിലും ആ പ്രയോഗം ആധുനിക മലയാളത്തിൽ അപാരദർശകമാണ്. ‘ഉടമ്പടി ചെയ്യുക’ അർഥം സ്വാഭാവികമായി നൽകുന്നു; לָנוּ എന്ന ബന്ധം ‘ഞങ്ങളുമായി’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: രാഷ്ട്രീയ കരാറിന്റെ പശ്ചാത്തലത്തിൽ בְרִית എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമ്പടി
  alternative: സന്ധി
  rationale: സന്ദർഭം നയതന്ത്രപരമാണെങ്കിലും בְרִית ബൈബിളിലെ പ്രധാനമായ ‘ഉടമ്പടി’ എന്ന പദമാണ്. മുഖ്യപാഠത്തിൽ ആ പദബന്ധം നിലനിർത്തി, രാഷ്ട്രീയ സൂക്ഷ്മാർഥമായ ‘സന്ധി’ അടിക്കുറിപ്പിൽ പകരമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘പാളയം,’ ‘ഉടമ്പടി’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
