translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘നിന്റെ കൈയിൽ’, ‘നിന്റെ ദൃഷ്ടിയിൽ’ എന്നീ എബ്രായ രൂപകങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. മൂലത്തിലെ ആവർത്തനത്തിന് അല്പം ഔപചാരികതയുണ്ടെങ്കിലും അതിന്റെ വാചകശക്തി സംരക്ഷിക്കാൻ മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ചു.
