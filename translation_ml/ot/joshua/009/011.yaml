translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ നയതന്ത്രപരമായ വിനയഭാവവും ‘ഉടമ്പടി’ എന്ന ബൈബിൾ ആശയവും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുവാദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
