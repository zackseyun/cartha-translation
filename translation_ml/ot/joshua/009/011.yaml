source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞങ്ങളുടെ മൂപ്പന്മാരും ഞങ്ങളുടെ ദേശത്തിലെ സകല നിവാസികളും ഞങ്ങളോടു പറഞ്ഞു: ‘യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ കൈയിൽ എടുത്ത് അവരെ ചെന്നു കാണുക. അവരോട്, “ഞങ്ങൾ നിങ്ങളുടെ ദാസന്മാരാണ്”[b] എന്നു പറയുക. ഇപ്പോൾ ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞങ്ങൾക്കായി ഒരു ഉടമ്പടി മുറിക്കുക.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ ദാസന്മാർ’ എന്നത് ഇവിടെ ആദരവും കീഴ്‌വണക്കവും പ്രകടിപ്പിക്കുന്ന നയതന്ത്രഭാഷയാണ്; എബ്രായപദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ‘അടിമകൾ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: ഞങ്ങളുടെ മൂപ്പന്മാർ
  rationale: ഇവിടെ പ്രായമുള്ള പുരുഷന്മാരെ പൊതുവായി അല്ല, സമൂഹനേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മൂപ്പന്മാർ’ ആ സാമൂഹിക-രാഷ്ട്രീയ പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: ഞങ്ങളുടെ ദേശത്തിലെ സകല നിവാസികളും
  rationale: ദേശത്ത് വസിക്കുന്ന ജനങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘നിവാസികൾ’ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: צֵידָה
  choice: യാത്രയ്ക്കുള്ള ഭക്ഷണസാധനങ്ങൾ
  rationale: യാത്രയ്ക്കായി കരുതുന്ന ഭക്ഷണമോ വിഭവങ്ങളോ ആണ് ഉദ്ദേശ്യം; സന്ദർഭത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
- source_word: בְיֶדְכֶם
  choice: കൈയിൽ എടുത്ത്
  rationale: എബ്രായത്തിലെ ദൃശ്യമായ ‘നിങ്ങളുടെ കൈയിൽ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַדֶּרֶךְ
  choice: യാത്രയ്ക്കുള്ള
  rationale: ഇവിടെ דֶּרֶךְ യാത്രയെയാണ് സൂചിപ്പിക്കുന്നത്; ലക്ഷ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: לִקְרָאתָם
  choice: അവരെ ചെന്നു കാണുക
  rationale: ആരെയെങ്കിലും സമീപിച്ച് കണ്ടുമുട്ടാൻ പോകുക എന്ന ആശയം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: עַבְדֵיכֶם
  choice: നിങ്ങളുടെ ദാസന്മാർ
  rationale: עבד എന്നതിന് അടിമ എന്നും അർഥമാകാമെങ്കിലും, ഇവിടെ ഉടമ്പടി അഭ്യർഥിക്കുന്ന വിനയപൂർവമായ നയതന്ത്രഭാഷയാണ്; ‘ദാസന്മാർ’ ആ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: ഞങ്ങളുമായി ഒരു ഉടമ്പടി ചെയ്യുക
  rationale: כרת ברית എന്നത് അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ ശൈലിയാണ്; മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്യുക’ സ്വാഭാവികവും ഉടമ്പടിയുടെ ആശയം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തെ പ്രധാന അഭ്യർഥനയിലേക്കു നയിക്കുന്ന മാറ്റം ലളിതമായി നൽകുന്നു.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: ഞങ്ങളോടു പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ഉദ്ധരണി ആരംഭിക്കുന്ന സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി നൽകിയിരിക്കുന്നു.
