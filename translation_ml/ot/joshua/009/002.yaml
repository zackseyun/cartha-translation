id: JOS.9.2
reference: Joshua 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֣וּ יַחְדָּ֔ו לְ/הִלָּחֵ֥ם עִם יְהוֹשֻׁ֖עַ וְ/עִם יִשְׂרָאֵ֑ל פֶּ֖ה אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/002.yaml
  text: they gathered together to fight against Joshua and against Israel[a], with one accord.
translation:
  language: ml
  text: അവർ യോശുവയോടും ഇസ്രായേലിനോടും യുദ്ധം ചെയ്യാൻ ഒരുമനസ്സോടെ[a] ഒന്നിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഒരു വായോടെ’; പൂർണമായ ഐക്യത്തോടെയോ ഏകാഭിപ്രായത്തോടെയോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: കבץ എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഒരു സംഘമായി കൂടിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒന്നിച്ചുകൂടി’ എന്നത് കൂട്ടായ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַחְדָּו
  choice: ഒന്നിച്ച്
  rationale: ഈ ക്രിയാവിശേഷണം സംയുക്തമായ പ്രവർത്തനത്തെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘ഒന്നിച്ചുകൂടി’ എന്ന പ്രയോഗം അതിന്റെ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: לְהִלָּחֵם
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: לחם എന്ന ധാതുവിന്റെ നിഫാൽ അനന്തക്രിയാരൂപം യുദ്ധത്തിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യുദ്ധം ചെയ്യാൻ’ വ്യക്തവും മാന്യവുമായ സാധാരണ മലയാളമാണ്.
- source_word: עִם
  choice: -ഓട്
  rationale: യുദ്ധം ചെയ്യുന്ന ക്രിയയോടൊപ്പം עִם ഇവിടെ സഹവർത്തിത്വമല്ല, എതിർപ്പ് സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘യോശുവയോട് യുദ്ധം ചെയ്യുക’ എന്ന ഘടന ഈ പ്രതികൂല അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപം.
- source_word: וְעִם יִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടും
  rationale: ആവർത്തിക്കുന്ന എബ്രായ മുൻനിലപദത്തിന്റെ എതിർപ്പാർന്ന അർഥം നിലനിർത്തുകയും യോശുവയെയും ഇസ്രായേലിനെയും വേർതിരിച്ച് സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: פֶּה אֶחָד
  choice: ഒരുമനസ്സോടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വായ്’ എന്ന ഈ എബ്രായ ശൈലി പൂർണമായ ഐക്യമോ ഏകാഭിപ്രായമോ സൂചിപ്പിക്കുന്നു. ‘ഒരുമനസ്സോടെ’ ആ ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ മലയാളം. ‘ഒരുമനസ്സോടെ’ എന്നത് അപൂർവമായ അക്ഷരാനുവാദം ഒഴിവാക്കി മൂലത്തിലെ ഏകകണ്ഠതയുടെ ആശയം നൽകുന്നു; [a] അടിക്കുറിപ്പ് മൂലരൂപം രേഖപ്പെടുത്തുന്നു.
