source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ അന്നുതന്നെ, യഹോവ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്, സഭയ്ക്കും യഹോവയുടെ യാഗപീഠത്തിനും വേണ്ടി അവരെ വിറകുവെട്ടുന്നവരും വെള്ളം കോരുന്നവരും[a] ആക്കി; അവർ ഇന്നുവരെയും അങ്ങനെതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളം കൊണ്ടുവരുന്നവരും.’
    reason: שֹׁאֲבֵי מַיִם എന്നത് അക്ഷരാർഥത്തിൽ വെള്ളം കോരുന്നവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ സേവനചുമതലയെ മുൻനിർത്തി ‘വെള്ളം കൊണ്ടുവരുന്നവർ’ എന്നും പറയാം.
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: അവരെ ... ആക്കി
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക/വെക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ കർത്തൃവാചക കൃദന്തരൂപങ്ങളോടൊപ്പം അത് ഒരു സേവനവിഭാഗമായി നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവരെ ... ആക്കി’ ഈ പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חֹטְבֵי עֵצִים
  choice: വിറകുവെട്ടുന്നവർ
  rationale: മരം അല്ലെങ്കിൽ വിറക് വെട്ടുന്നവരെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം. യാഗപീഠസേവനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘വിറകുവെട്ടുന്നവർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: വെള്ളം കോരുന്നവർ
  rationale: שאב വെള്ളം ഉറവിൽനിന്നോ കിണറ്റിൽനിന്നോ കോരുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘വെള്ളം കോരുന്നവർ’ മൂലപദത്തിന്റെ പ്രവൃത്തിയെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു; സേവനത്തിന്റെ ഫലത്തെ മുൻനിർത്തുന്ന ‘വെള്ളം കൊണ്ടുവരുന്നവർ’ അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയായി നൽകിയിരിക്കുന്നു.
- source_word: לָעֵדָה
  choice: സഭയ്ക്കും
  rationale: עֵדָה ഇസ്രായേലിന്റെ സംഘടിതമായ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ അതിന്റെ കൂട്ടായതും ആരാധനാസംബന്ധവുമായ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: യഹോവയുടെ യാഗപീഠത്തിനുംവേണ്ടി
  rationale: ഈ സേവനം യഹോവയുടെ യാഗപീഠവുമായി നേരിട്ട് ബന്ധപ്പെട്ടതാണെന്ന് ഉടമസ്ഥബന്ധത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: വിവരിച്ച സംഭവം എഴുത്തുകാരന്റെ കാലംവരെ തുടർന്നിരുന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനത.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത്
  rationale: ഇവിടെ אֶל സേവനം നടക്കുന്ന സ്ഥലത്തെ സംബന്ധിച്ചാണ്. ‘അവൻ’ എന്ന വ്യക്തിപരമായ കർത്താവിനെ നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ ദൈവിക തിരഞ്ഞെടുപ്പിന്റെ സൂചന സംരക്ഷിക്കുന്നു; യിഖ്തോൽ രൂപത്തിന്റെ ഭാവി/അപൂർണ ദിശയെ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാന-ഭാവി പ്രയോഗം തുറന്ന നിലയിൽ വെക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ‘അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലം’ എന്നതിലെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യഹോവയെ സൂചിപ്പിക്കുന്നു
  alternative: ‘തിരഞ്ഞെടുക്കപ്പെടുന്ന സ്ഥലം’ എന്ന കർമണിപ്രയോഗം
  rationale: ആരാധനാസ്ഥലം യഹോവ തിരഞ്ഞെടുക്കുന്നു എന്ന യോശുവ–ആവർത്തനപുസ്തക പ്രയോഗം ഇവിടെ പശ്ചാത്തലമാകുന്നു. കർമണിപ്രയോഗം ഈ ദൈവിക പ്രവർത്തനത്തെ മറയ്ക്കുമെന്നതിനാൽ മൂലത്തിലെ വ്യക്തിപരമായ സർവനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലവാക്യത്തിലെ സംക്ഷിപ്തതയും അവസാനഭാഗത്തെ കാല-സ്ഥലബന്ധവും ദീർഘവരയിലൂടെ നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവാക്യം ചേർത്തിട്ടില്ല.
