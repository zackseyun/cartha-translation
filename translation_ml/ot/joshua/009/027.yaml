- from: അങ്ങനെ യോശുവ അന്നുതന്നെ അവരെ സഭയ്ക്കും യഹോവയുടെ യാഗപീഠത്തിനുംവേണ്ടി വിറകുവെട്ടുന്നവരും വെള്ളം കോരുന്നവരും[a] ആക്കി—അവൻ തിരഞ്ഞെടുക്കുന്ന സ്ഥലത്ത് ഇന്നുവരെയും.
