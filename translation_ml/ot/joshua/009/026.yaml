id: JOS.9.26
reference: Joshua 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: ml
  text: അവൻ അവർക്കുവേണ്ടി ഇങ്ങനെ ചെയ്തു; ഇസ്രായേൽപുത്രന്മാരുടെ[a] കൈയിൽനിന്ന് അവരെ വിടുവിച്ചു; അവർ അവരെ കൊന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ.’ ഹീബ്രുവിൽ ‘ഇസ്രായേൽപുത്രന്മാരുടെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: അവൻ അവരോട് അങ്ങനെ ചെയ്തു
  rationale: עשה ... כן എന്ന പ്രയോഗത്തിന്റെ ‘അങ്ങനെ ചെയ്തു’ എന്ന അർഥവും לָהֶם സൂചിപ്പിക്കുന്ന അവരോടുള്ള നടപടിയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּצֵּל
  choice: വിടുവിക്കുകയും ചെയ്തു
  rationale: נצל എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അധികാരത്തിൽനിന്നോ അപകടത്തിൽനിന്നോ വിടുവിക്കുക’ എന്ന അർഥം തുടർന്നുള്ള ‘കൈയിൽനിന്ന്’ എന്ന പ്രയോഗവുമായി യോജിക്കുന്നു; -ഉം രൂപം ഹീബ്രു വാക്യശൃംഖലയിലെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: אוֹתָם
  choice: അവരെ
  rationale: ഗിബെയോന്യരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ അക്ഷരാർഥമായ പുരുഷലിംഗ ബഹുവചന ദേശീയവിശേഷണം സംരക്ഷിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ ‘ഇസ്രായേല്യർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלֹא הֲרָגוּם
  choice: അവർ അവരെ കൊന്നില്ല
  rationale: הרג എന്ന ക്രിയയുടെ നേരായ അർഥമായ ‘കൊല്ലുക’ ഉപയോഗിക്കുന്നു; ബഹുവചന കർത്താവ് ഇസ്രായേൽപുത്രന്മാരെയും കർമം ഗിബെയോന്യരെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹനാമം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇത് ഒരു ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണെങ്കിലും മൂലപാഠത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സ്വാഭാവികമായ സമൂഹനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ വാക്യഘടന അർദ്ധവിരാമങ്ങളാലും ‘-ഉം ചെയ്തു’ എന്ന ഏകോപനരൂപത്താലും വ്യക്തമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
