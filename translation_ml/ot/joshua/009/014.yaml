id: JOS.9.14
reference: Joshua 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: ml
  text: അതിനാൽ ആ പുരുഷന്മാർ അവരുടെ യാത്രാഭക്ഷണത്തിൽനിന്ന് കുറച്ചെടുത്തു; എന്നാൽ യഹോവയുടെ അരുളപ്പാട് അവർ ചോദിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യഹോവയുടെ വായ്’; അതായത്, അവന്റെ നിർദേശമോ തീരുമാനമോ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു; സാധനങ്ങൾ തെളിവിനായി സ്വീകരിച്ചതെന്നതിലപ്പുറം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: മൂലപാഠത്തിൽ ‘പുരുഷന്മാർ’ എന്നേ ഉള്ളൂ. സന്ദർഭത്തിൽ അവർ ഇസ്രായേല്യ പ്രതിനിധികളാണെങ്കിലും ‘നേതാക്കൾ’ എന്നോ ‘ഇസ്രായേൽപുരുഷന്മാർ’ എന്നോ വ്യക്തമാക്കുന്നത് ഒഴിവാക്കി.
- source_word: מִצֵּידָם
  choice: അവരുടെ യാത്രാഭക്ഷണത്തിൽനിന്ന് കുറച്ച്
  rationale: צֵיד യാത്രയ്ക്കായുള്ള ഭക്ഷണമോ കരുതൽസാധനങ്ങളോ സൂചിപ്പിക്കുന്നു; ഇവിടെ സാധനങ്ങളുടെ പഴക്കമാണ് പരിശോധിക്കുന്നത് എന്നതിനാൽ സ്വാഭാവികമായ ‘യാത്രാഭക്ഷണം’ തെരഞ്ഞെടുത്തു. מן എന്ന ഉപസർഗത്തിന്റെ ഭാഗികാർഥം ‘കുറച്ച്’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: פִּי יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ വായ്’; ഇവിടെ യഹോവയുടെ നിർദേശം അല്ലെങ്കിൽ തീരുമാനം ചോദിച്ചറിയുക എന്ന പ്രയോഗാർഥമാണ്. ‘അരുളപ്പാട്’ ദൈവത്തിൽനിന്നുള്ള മറുപടി/നിർദേശം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി മലയാളത്തിൽ പരിചിതവും ഉച്ചരിക്കാവുന്നതുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്തു; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റിയിട്ടില്ല.
- source_word: לֹא שָׁאָלוּ
  choice: അവർ ചോദിച്ചില്ല
  rationale: שׁאל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ചോദിക്കുക/അന്വേഷിക്കുക’ ആണ്. ‘അരുളപ്പാട്’ എന്ന കർമത്തോടൊപ്പം ‘ചോദിച്ചില്ല’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ സ്ഥിരപരിചയമുള്ള ലിപ്യന്തരണം നിലനിർത്തി.
- issue: פִּי יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ അരുളപ്പാട്
  alternative: യഹോവയുടെ വായ് / യഹോവയുടെ ആലോചന / യഹോവയുടെ നിർദേശം
  rationale: അക്ഷരാർഥം മാത്രം നൽകിയാൽ ആധുനിക മലയാളത്തിൽ ഉദ്ദേശ്യം അവ്യക്തമാകും. യഹോവയുടെ നിർദേശമോ തീരുമാനമോ ചോദിച്ചറിയാത്തതാണെന്ന സന്ദർഭാർഥം ‘അരുളപ്പാട്’ അറിയിക്കുന്നു; ‘കൽപ്പന’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ വിരുദ്ധഘടന നിലനിർത്താൻ അർധവിരാമവും ‘എന്നാൽ’ എന്ന ബന്ധകവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചിക പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
