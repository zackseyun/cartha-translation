source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: ml
  text: 'എന്നാൽ എല്ലാ നേതാക്കളും മുഴുവൻ സമൂഹത്തോടും പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേയുടെ നാമത്തിൽ നാം അവരോടു സത്യം ചെയ്തിരിക്കുന്നു. ഇപ്പോൾ നമുക്ക് അവരെ തൊടാൻ[a] കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരെ ഉപദ്രവിക്കാൻ” അല്ലെങ്കിൽ “അവരെ ആക്രമിക്കാൻ”; പദശഃ “അവരെ തൊടാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ അടിസ്ഥാന അർഥം ‘അപ്പോൾ/അങ്ങനെ പറഞ്ഞു’ എന്നാണെങ്കിലും, മുൻസന്ദർഭത്തിലെ സഭയുടെ പരാതിക്കുള്ള വിരുദ്ധപ്രതികരണമായതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമായി ആശയബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: הַנְּשִׂיאִים
  choice: പ്രമാണിമാർ
  rationale: നָשִׂיא ഇവിടെ ഇസ്രായേലിന്റെ ഭരണ-ഗോത്ര പ്രതിനിധികളായ നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ‘പ്രമാണിമാർ’ ആ ഔദ്യോഗികവും സമൂഹപ്രതിനിധിത്വപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: הָעֵדָה
  choice: സർവസഭ
  rationale: עֵדָה ഇസ്രായേൽ സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; כָּל എന്ന ‘എല്ലാ/മുഴുവൻ’ ആശയത്തോടുകൂടെ ‘സർവസഭ’ സംക്ഷിപ്തവും മാന്യവുമായ പരിഭാഷയാണ്.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: നാം അവരോടു സത്യം ചെയ്തിരിക്കുന്നു
  rationale: ശപഥം മുൻപ് ചെയ്തതാണെങ്കിലും അതിന്റെ ബന്ധനശക്തി ഇപ്പോഴും നിലനിൽക്കുന്നു; മലയാളത്തിലെ പൂർത്തവർത്തമാന രൂപം അത് പ്രകടമാക്കുന്നു.
- source_word: בַּיהוָה
  choice: യഹോവയുടെ നാമത്തിൽ
  rationale: שׁבע-യോടുകൂടിയ בְ ശപഥം ആരെ സാക്ഷിയാക്കി ചെയ്തുവെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യഹോവയുടെ നാമത്തിൽ സത്യം ചെയ്തു’ എന്നത് സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഇസ്രായേലുമായുള്ള ബന്ധത്തിൽ ദൈവത്തെ തിരിച്ചറിയിക്കുന്ന നേരിട്ടുള്ള ഘടനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: പദശഃ ‘ഇപ്പോൾ’ എന്നതോടൊപ്പം മുൻപറഞ്ഞ ശപഥത്തിന്റെ ഇപ്പോഴത്തെ ഫലവും വാക്യത്തിൽ ഉണ്ട്; ‘അതുകൊണ്ട് ഇപ്പോൾ’ മലയാളത്തിൽ ആ നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לֹא נוּכַל
  choice: നമുക്ക് ... കഴിയില്ല
  rationale: יכל അടിസ്ഥാനമായി കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ശപഥം മൂലമുള്ള ധാർമിക അസാധ്യത സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ‘കഴിയില്ല’ എന്ന ലളിതരൂപം നിലനിർത്തി.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: അവരെ തൊടാൻ
  rationale: נגע-യുടെ പദശഃ അർഥമായ ‘തൊടുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ ഉപദ്രവിക്കുകയോ ആക്രമിക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിൽ ദൈവത്തിന്റെ പ്രത്യേക ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അത് ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; പൊതുവായ സ്ഥാനപ്പേരായി മാറ്റിയില്ല.
- issue: ശപഥം മൂലമുള്ള ‘കഴിയില്ല’ എന്നതിന്റെ സ്വഭാവം
  choice: ധാർമിക ബാധ്യത ഉൾക്കൊള്ളുന്ന ‘കഴിയില്ല’
  alternative: ‘ചെയ്യരുത്’ / ‘അനുവാദമില്ല’
  rationale: ലֹא נוּכַל രൂപപരമായി അസമർഥതയാണ് പറയുന്നത്. എന്നാൽ സന്ദർഭത്തിൽ അത് യഹോവയുടെ നാമത്തിൽ ചെയ്ത ശപഥത്തിൽനിന്നുള്ള ധാർമിക നിയന്ത്രണമാണ്; മുഖ്യപാഠം ഈ രണ്ടിനുമിടയിലെ ഉത്കണ്ഠ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ കഥനശൈലി സ്വീകരിച്ചു. ‘പ്രമാണിമാർ’, ‘സർവസഭ’, ‘സത്യം ചെയ്തിരിക്കുന്നു’ എന്നീ രൂപങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ അനുബന്ധ പദത്തിനരികെ ചേർത്തിരിക്കുന്നു.
