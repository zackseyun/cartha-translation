id: JOS.9.20
reference: Joshua 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: ml
  text: 'നാം അവരോട് ഇങ്ങനെ ചെയ്യും: അവരെ ജീവനോടെ വിടും[a]. അപ്പോൾ, നാം അവരോടു ചെയ്ത ശപഥം നിമിത്തം നമ്മുടെമേൽ ക്രോധം[b] ഉണ്ടാകുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ജീവനോടെ നിലനിർത്തും” അല്ലെങ്കിൽ “അവരെ കൊല്ലാതെ വിടും.”
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ ഇത് ദൈവിക ക്രോധമായിരിക്കാനാണ് സാധ്യത; എന്നാൽ എബ്രായപാഠം ഇവിടെ “യഹോവയുടെ ക്രോധം” എന്നു വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: നാം അവരോട് ഇങ്ങനെ ചെയ്യും
  rationale: നിർദേശിക്കുന്ന നടപടിയെ സൂചിപ്പിക്കുന്ന זֹאת എന്ന പ്രയോഗവും ഭാവിയിലുള്ള ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്ന נַעֲשֶׂה എന്ന ക്രിയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: അവരെ ജീവനോടെ വിടും
  rationale: חיה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘ജീവിക്കാൻ അനുവദിക്കുക/ജീവനോടെ നിലനിർത്തുക’ എന്നാണ്. ‘ജീവനോടെ വിടും’ സന്ദർഭത്തിൽ സ്വാഭാവികവും അർത്ഥത്തിൽ കൃത്യവുമാണ്.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: അപ്പോൾ ... നമ്മുടെമേൽ ക്രോധം ഉണ്ടാകുകയില്ല
  rationale: നിർദേശിച്ച നടപടിയുടെ ഫലമായി ഭയപ്പെടുന്ന ക്രോധം ഒഴിവാകുമെന്ന ബന്ധം ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു; എന്നാൽ എബ്രായപാഠത്തിൽ ഇല്ലാത്ത ദൈവനാമം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: קֶצֶף
  choice: ക്രോധം
  rationale: സാധാരണ ‘കോപം’ എന്നതിനെക്കാൾ പദത്തിന്റെ ഗൗരവവും ശപഥലംഘനത്തിന്റെ പശ്ചാത്തലവും ‘ക്രോധം’ നന്നായി നിലനിർത്തുന്നു.
- source_word: עַל הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: നാം അവരോടു ചെയ്ത ശപഥം നിമിത്തം
  rationale: עַל എന്നതിന്റെ കാരണാർഥവും, לָהֶם സഹിതമുള്ള שׁבע എന്ന ക്രിയയുടെ ‘അവരോട് ശപഥം ചെയ്യുക’ എന്ന അർത്ഥവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ശപഥലംഘനവുമായി ബന്ധപ്പെട്ട קֶצֶף ആരുടെ ക്രോധമാണ്?
  choice: മുഖ്യവാചകത്തിൽ ‘ക്രോധം’ എന്നു മാത്രം നൽകി.
  alternative: ‘യഹോവയുടെ ക്രോധം’ എന്നു വ്യക്തമായി നൽകുക.
  rationale: സന്ദർഭത്തിൽ ദൈവിക ക്രോധമാണ് ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയെങ്കിലും, ഈ വാക്യത്തിലെ എബ്രായപാഠം യഹോവയെ വ്യക്തമായി പരാമർശിക്കുന്നില്ല. അതിനാൽ ആ സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിച്ച് മൂലപാഠത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശപഥം’, ‘ക്രോധം’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; എബ്രായവാക്യത്തിലെ അനുക്രമം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളായി അവതരിപ്പിച്ചിരിക്കുന്നു.
