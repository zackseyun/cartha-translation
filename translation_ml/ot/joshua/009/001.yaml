    text: അല്ലെങ്കിൽ, ‘ശെഫേലായിൽ’; യെഹൂദയുടെ പടിഞ്ഞാറുള്ള താഴ്ന്ന കുന്നിൻപ്രദേശമാണ് ശെഫേലാ.
