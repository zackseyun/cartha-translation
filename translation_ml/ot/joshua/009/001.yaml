  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: യോർദ്ദാന്റെ മറുകരയിൽ[b]—മലനാട്ടിലും താഴ്ന്ന കുന്നിൻപ്രദേശത്തും[c] ലെബാനോന് അഭിമുഖമായ മഹാസമുദ്രതീരം മുഴുവനും—ഉണ്ടായിരുന്ന എല്ലാ രാജാക്കന്മാരും—ഹിത്യർ, അമോര്യർ, കനാന്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ—ഇതു[a] കേട്ടപ്പോൾ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അവർ കേട്ട കാര്യം വ്യക്തമാക്കിയിട്ടില്ല. ചുറ്റുപാടിലുള്ള സന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യോർദ്ദാനപ്പുറത്തുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശ സംസാരകന്റെ ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാടിനെ ആശ്രയിച്ചിരിക്കുന്നു.
