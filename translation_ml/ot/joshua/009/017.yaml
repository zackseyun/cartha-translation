source:
  edition: WLC
  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെട്ട് മൂന്നാം ദിവസം അവരുടെ പട്ടണങ്ങളിൽ എത്തി. അവരുടെ പട്ടണങ്ങൾ ഗിബെയോൻ, കെഫീരാ, ബെയേരോത്ത്, കിര്യത്ത്-യെയാരീം എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയയുടെ യാത്ര ആരംഭിക്കൽ എന്ന അർഥവും ആഖ്യാനത്തിലെ മുന്നേറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പാളയം പൊളിച്ചു എന്ന ആശയം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നതിനെക്കാൾ മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ ജനസമൂഹനാമം; ഹീബ്രു പ്രയോഗത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങളിൽ എത്തി
  rationale: בוא + אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തെത്തൽ സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിൽ പട്ടണങ്ങളുടെ സമീപത്ത് മാത്രമല്ല, അവിടെയെത്തിയതാണെന്ന അർഥം വ്യക്തമാകുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ‘മൂന്നാം ദിവസത്തിനകം’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וְעָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങൾ ... എന്നിവയായിരുന്നു
  rationale: וְ ഇവിടെ പട്ടണങ്ങളുടെ വിശദീകരണപ്പട്ടിക അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വേറൊരു വാക്യമായി നൽകുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: גִּבְעוֹן
  choice: ഗിബെയോൻ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ വായനാസൗകര്യമുള്ള ലിപ്യന്തരണം.
- source_word: הַכְּפִירָה
  choice: കെഫീരാ
  rationale: ഹീബ്രു כְּפִירָה എന്ന രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בְּאֵרוֹת
  choice: ബെയേരോത്ത്
  rationale: ഹീബ്രു സ്വരഘടനയെ തിരിച്ചറിയാവുന്ന വിധത്തിൽ സംരക്ഷിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ രണ്ടു ഘടകങ്ങളും ഹൈഫൻ ഉപയോഗിച്ച് വ്യക്തമായി നിലനിർത്തുന്നു.
