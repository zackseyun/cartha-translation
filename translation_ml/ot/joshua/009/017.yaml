  source_fidelity: 'ഹീബ്രു വാക്യത്തിന്റെ ക്രമവും അർഥവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെടുന്നു, മൂന്നാം ദിവസം ഗിബെയോന്യരുടെ പട്ടണങ്ങളിൽ എത്തുന്നു, തുടർന്ന് ആ പട്ടണങ്ങളുടെ പട്ടിക നൽകുന്നു. אֶל-ന്റെ ലക്ഷ്യാർഥം ‘പട്ടണങ്ങളിൽ എത്തി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ മതിയായും വ്യക്തമായും വരുന്നു.'
