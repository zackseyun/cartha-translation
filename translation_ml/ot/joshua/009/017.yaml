translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മലയാളത്തിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ജനസമൂഹപ്രയോഗമാണ്. സ്ഥലനാമങ്ങൾ ഇംഗ്ലീഷ് പാരമ്പര്യരൂപങ്ങളിൽനിന്നല്ല, ഹീബ്രു രൂപങ്ങളിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
