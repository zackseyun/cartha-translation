id: JOS.9.9
reference: Joshua 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: ml
  text: 'അവർ അവനോടു പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ വളരെ ദൂരെയുള്ള ഒരു ദേശത്തുനിന്ന് വന്നിരിക്കുന്നത് അങ്ങയുടെ ദൈവമായ യഹ്‌വെയുടെ നാമം നിമിത്തമാണ്; കാരണം, അവിടുത്തെ പ്രശസ്തിയും അവിടുന്ന് ഈജിപ്തിൽ ചെയ്ത സകലവും ഞങ്ങൾ കേട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ വിവരണശൈലിയിലെ wayyiqtol സ്വാഭാവികമായ മലയാള കഥനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രസംഗബന്ധം അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: വളരെ ദൂരെയുള്ള ഒരു ദേശത്തുനിന്ന്
  rationale: רְחוֹקָה എന്ന ‘ദൂരെയുള്ള’ അർഥവും מְאֹד എന്ന തീവ്രതാസൂചകമായ ‘വളരെ’യും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בָּאוּ עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ വന്നിരിക്കുന്നത്
  rationale: עֲבָדֶיךָ ഇവിടെ നയതന്ത്രപരമായ വിനയസൂചക സ്വയംവിശേഷണമാണ്; അതിനാൽ ‘അടിമകൾ’ എന്നതിനെക്കാൾ ‘ദാസന്മാർ’ യോജിക്കുന്നു. പൂർത്തിയായ വരവും ഇപ്പോഴത്തെ അവസ്ഥയും മലയാളത്തിലെ ‘വന്നിരിക്കുന്നത്’ വ്യക്തമാക്കുന്നു.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹ്‌വെയുടെ നാമം നിമിത്തം
  rationale: לְשֵׁם എന്ന പ്രയോഗത്തിലെ ഉദ്ദേശ്യം/കാരണം എന്ന ഭാവം ‘നാമം നിമിത്തം’ നിലനിർത്തുന്നു; ‘കീർത്തി’ എന്നു ഇവിടെ തന്നെ പകരാതെ ‘നാമം’ സംരക്ഷിക്കുന്നു.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: അവിടത്തെ കീർത്തിയെക്കുറിച്ച് ഞങ്ങൾ കേട്ടിരിക്കുന്നു
  rationale: שמע എന്ന ധാതുവുമായി ബന്ധമുള്ള നാമം ഉൾപ്പെടുന്ന cognate പ്രയോഗം ഒരാളെക്കുറിച്ചുള്ള വാർത്ത, പ്രസിദ്ധി, കീർത്തി എന്നീ അർഥങ്ങൾക്ക് ഇടനൽകുന്നു. മുഖ്യപാഠത്തിൽ ‘കീർത്തി’ സ്വാഭാവികമാണ്; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: അവിടന്ന് ഈജിപ്തിൽ ചെയ്ത സകലത്തെക്കുറിച്ചും
  rationale: כָּל אֲשֶׁר എന്ന ഘടനയെ സമഗ്രമായി പ്രതിഫലിപ്പിക്കുകയും മുൻപത്തെ ‘കീർത്തിയെക്കുറിച്ചും’ എന്ന ഘടകവുമായി മലയാളത്തിൽ സമാന്തരബന്ധം സൃഷ്ടിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לְשֵׁם എന്നതിലെ ‘നാമം’ എന്ന ആശയം
  choice: നാമം നിമിത്തം
  alternative: കീർത്തി കേട്ടതിനാൽ; നാമത്തിനുവേണ്ടി
  rationale: ഇവിടെ കാരണം/പ്രേരണ എന്ന അർഥം പ്രസക്തമാണെങ്കിലും ‘നാമം’ എന്ന ദൈവശാസ്ത്രപരവും ഭാഷാപരവുമായ ഘടകം നിലനിർത്തുന്നു; അതിനെ ‘കീർത്തി’യെന്നൊന്നിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. യോശുവയെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു; യഹ്‌വെയെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്/അവിടത്തെ’ ഉപയോഗിച്ചു. നയതന്ത്രപരമായ വിനയം പ്രകടമാക്കാൻ ‘ദാസന്മാർ’ നിലനിർത്തി.
