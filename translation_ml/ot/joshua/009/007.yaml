    rationale: ‘എങ്ങനെ ... ഉടമ്പടി ചെയ്യും?’ may be understood as a straightforward future question. ‘എങ്ങനെ ... ചെയ്യാനാകും?’ preserves the logical impossibility implied by the Hebrew question.
