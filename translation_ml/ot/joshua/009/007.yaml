id: JOS.9.7
reference: Joshua 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: ml
  text: 'എന്നാൽ ഇസ്രായേൽജനങ്ങൾ ഹിവ്യനോട് പറഞ്ഞു: “ഒരുപക്ഷേ നീ ഞങ്ങളുടെ ഇടയിൽ[a] താമസിക്കുന്നവനായിരിക്കാം; അങ്ങനെയെങ്കിൽ ഞാൻ എങ്ങനെ നിന്നോടു ഉടമ്പടി ചെയ്യാനാകും[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദാനുപദമായി, ‘എന്റെ മധ്യേ’; ഏകവചനം ഇസ്രായേലിനുവേണ്ടി സംസാരിക്കുന്ന ഒരു പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദാനുപദമായി, ‘നിന്നോടു ഉടമ്പടി മുറിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനങ്ങൾ
  rationale: אִישׁ ഏകവചനരൂപമാണെങ്കിലും ഇവിടെ ഇസ്രായേലിന്റെ പ്രതിനിധികളെ സൂചിപ്പിക്കുന്ന സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; നൽകിയിരിക്കുന്ന ക്രിയാരൂപവും ബഹുവചനമാണ്. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ സമൂഹവാചകമായി ‘ഇസ്രായേൽജനങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: הַחִוִּי
  choice: ഹിവ്യനോട്
  rationale: എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തി; സംഘത്തെ പ്രതിനിധീകരിച്ച് അഭിസംബോധന ചെയ്യപ്പെടുന്ന ഒരാളെ ഇത് സൂചിപ്പിക്കാം.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: സംശയസൂചകമായ സാധ്യതയെ മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּקִרְבִּי
  choice: ഞങ്ങളുടെ ഇടയിൽത്തന്നെ
  rationale: പദാനുപദമായി ‘എന്റെ മധ്യേ’ എന്ന ഏകവചനമാണെങ്കിലും സംസാരിക്കുന്നയാൾ ഇസ്രായേലിനെ പ്രതിനിധീകരിക്കുന്നു. ‘ഞങ്ങളുടെ ഇടയിൽത്തന്നെ’ എന്നത് കൂട്ടായതും ഭൂമിശാസ്ത്രപരവുമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: יוֹשֵׁב
  choice: താമസിക്കുന്നവനായിരിക്കാം
  rationale: ישׁב എന്നതിന്റെ വർത്തമാനകാല പങ്കാളിത്തരൂപം സ്ഥിരമായി വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സംശയസൂചകമായ אוּלַי-യോടൊപ്പം ഈ രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְאֵיךְ
  choice: അങ്ങനെയെങ്കിൽ ... എങ്ങനെ
  rationale: മുൻപറഞ്ഞ സംശയത്തിന്റെ പ്രായോഗിക പരിണതഫലം അവതരിപ്പിക്കുന്ന ബന്ധവും ചോദ്യഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: אכרות ... בְרִית
  choice: ഉടമ്പടി ചെയ്യും
  rationale: എബ്രായ പ്രയോഗം പദാനുപദമായി ‘ഉടമ്പടി മുറിക്കുക’ എന്നാണ്. ആധുനിക മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി അറിയിക്കാൻ ‘ഉടമ്പടി ചെയ്യുക’ ഉപയോഗിച്ചു.
- source_word: לְךָ
  choice: നിന്നോടു
  rationale: ഉടമ്പടി ചെയ്യുന്നതിലെ മറുകക്ഷിയുമായുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ പ്രസംഗത്തിലെ സമൂഹത്തെ പ്രതിനിധീകരിക്കുന്ന ഏകവചനങ്ങൾ
  choice: ആദ്യ ഭാഗത്ത് ‘ഞങ്ങളുടെ ഇടയിൽ’ എന്ന സമൂഹവാചകം ഉപയോഗിച്ചും ഉടമ്പടി സംബന്ധിച്ച വാക്യത്തിൽ ‘ഞാൻ’ എന്ന ഏകവചനം നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്റെ മധ്യേ ... ഞാൻ നിന്നോടു ഉടമ്പടി ചെയ്യും’ എന്ന് എല്ലായിടത്തും ഏകവചനം നിലനിർത്തുക.
  rationale: എബ്രായത്തിൽ ഇസ്രായേലിനുവേണ്ടി സംസാരിക്കുന്ന പ്രതിനിധിയുടെ ഏകവചനപ്രയോഗമുണ്ട്. എല്ലാം പദാനുപദമായി ഏകവചനത്തിൽ നൽകിയാൽ ഒരാൾ സ്വന്തം കാര്യം മാത്രം പറയുന്നതായി തെറ്റിദ്ധരിക്കാം. അതേസമയം אכרות എന്ന ഒന്നാംപുരുഷ ഏകവചനത്തിന്റെ പ്രതിനിധിസ്വരം ‘ഞാൻ’ എന്നതിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഉടമ്പടി’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി; അപരിചിതമായ പദാനുപദ പ്രയോഗങ്ങൾ അടിക്കുറിപ്പുകളിലാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കത്തോട് പൊരുത്തപ്പെടുന്ന വിധത്തിൽ സൂചകങ്ങൾ ബന്ധപ്പെട്ട മലയാളപദങ്ങൾക്കരികിൽ വെച്ചു.
