reference: Joshua 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: ml
  text: അവരും തന്ത്രപൂർവം പ്രവർത്തിച്ചു; അവർ പോയി വേഷംമാറി[a]. തങ്ങളുടെ കഴുതകൾക്കായി പഴകിത്തേഞ്ഞ ചാക്കുകളും, പിളർന്നതും കെട്ടി നന്നാക്കിയതുമായ പഴകിത്തേഞ്ഞ വീഞ്ഞുതുരുത്തികളും[b] അവർ എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാത്രയ്ക്കുള്ള സാധനങ്ങൾ ഒരുക്കി.” וַיִּצְטַיָּרוּ എന്ന എബ്രായ ക്രിയ ദുഷ്കരമാണ്; അതിനെ ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കിയിട്ടുണ്ട്. വഞ്ചനാപരമായ രൂപഭാവം സൃഷ്ടിക്കുന്ന സന്ദർഭം ഇവിടെ “വേഷംമാറി” എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “കെട്ടിയ” അഥവാ “ബന്ധിച്ച” എന്നും പരിഭാഷപ്പെടുത്താം; പിളർന്ന വീഞ്ഞുതുരുത്തികൾ കെട്ടി നന്നാക്കിയതിനെ ഈ പദം വിവരിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: കൗശലത്തോടെ
  rationale: ഈ സന്ദർഭത്തിൽ വഞ്ചന ഉൾക്കൊള്ളുന്ന സാമർഥ്യത്തെയോ കൗശലത്തെയോ സൂചിപ്പിക്കുന്നു; പ്രവൃത്തിവിശേഷണരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַיִּצְטַיָּרוּ
  choice: വേഷംമാറി
  rationale: ദൂരദേശത്തുനിന്നുള്ളവരെന്ന പ്രതീതി സൃഷ്ടിക്കാൻ അവർ പഴകിയ സാധനങ്ങൾ ഉപയോഗിക്കുന്ന ഉടൻപിന്തുടരുന്ന സന്ദർഭത്തിന് ഈ അർഥം നന്നായി യോജിക്കുന്നു; ക്രിയയുടെ ദുഷ്കരതയും മറ്റൊരു വായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שַׂקִּים בָּלִים
  choice: പഴകിത്തേഞ്ഞ ചാക്കുകൾ
  rationale: שַׂקִּים എന്നത് ചരക്കു കൊണ്ടുപോകുന്ന ചാക്കുകളെയും בָּלִים ഉപയോഗവും പഴക്കവും മൂലം ജീർണിച്ചതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: לַחֲמוֹרֵיהֶם
  choice: തങ്ങളുടെ കഴുതകൾക്കായി
  rationale: ചാക്കുകൾ മൃഗങ്ങളുടെ ഉപയോഗത്തിനോ ചുമടിനോ ഉള്ളവയാണെന്ന ബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: נֹאדוֹת יַיִן
  choice: വീഞ്ഞുതുരുത്തികൾ
  rationale: വീഞ്ഞ് സൂക്ഷിക്കാനും കൊണ്ടുപോകാനും ഉപയോഗിച്ചിരുന്ന തോൽകൊണ്ടുള്ള പാത്രത്തിന് പ്രചാരമുള്ളതും സംക്ഷിപ്തവുമായ മലയാള പദം.
- source_word: מְבֻקָּעִים
  choice: പിളർന്ന്
  rationale: בקע ധാതുവിലെ നിഷ്ക്രിയ കൃദന്തരൂപം തുരുത്തികൾ പിളർന്നതോ പൊട്ടിയതോ ആയ അവസ്ഥ സൂചിപ്പിക്കുന്നു.
- source_word: מְצֹרָרִים
  choice: കെട്ടിപ്പൂട്ടിയ
  rationale: പിളർന്ന തുരുത്തികൾ കെട്ടി അടച്ചോ കെട്ടി നന്നാക്കിയോ എന്ന ഭൗതിക പ്രവൃത്തിയെ പ്രതിഫലിപ്പിക്കുന്നു; പൊതുവായ ‘ഒട്ടിച്ച’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: גַם הֵמָּה
  choice: അവരും
  rationale: മറ്റുള്ളവരെപ്പോലെ ഗിബെയോന്യരും നടപടിയെടുത്തു എന്ന കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
