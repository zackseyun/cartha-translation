  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ദുഷ്കരമായ ക്രിയയുടെ സന്ദർഭോചിത വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടും യഥാർഥ പാഠസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
