  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ അവരുമായി സമാധാനം സ്ഥാപിക്കുകയും അവരെ ജീവനോടെ വിടുന്നതിനായി അവരുമായി ഉടമ്പടി ചെയ്യുകയും ചെയ്തു; സമൂഹത്തിന്റെ പ്രമാണികൾ അവരോടു സത്യം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם
  choice: യോശുവ അവരുമായി സമാധാനം സ്ഥാപിച്ചു
  rationale: עשה שלום എന്ന പ്രയോഗം സമാധാനബന്ധം സ്ഥാപിക്കുക എന്ന അർഥത്തിലാണ്; ‘സമാധാനം സ്ഥാപിച്ചു’ സ്വാഭാവികവും രാഷ്ട്രീയ-ഉടമ്പടിപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: അവരുമായി ഉടമ്പടി ചെയ്തു
  rationale: כרת ברית അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ ശൈലിയാണെങ്കിലും മലയാളത്തിൽ അത് അസ്വാഭാവികമാണ്. ‘ഉടമ്പടി ചെയ്തു’ നിയമപരവും ഗൗരവമുള്ളതുമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לְחַיּוֹתָם
  choice: അവരെ ജീവനോടെ വിടുന്നതിനായി
  rationale: ഹിഫീൽ രൂപം ഇവിടെ അവരെ ജീവിക്കാൻ അനുവദിക്കുക, അഥവാ കൊല്ലാതെ വിടുക എന്ന ഉടമ്പടിയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ആ ഉദ്ദേശ്യം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: അവരോടു സത്യംചെയ്തു
  rationale: שבע ഇവിടെ ഔപചാരികമായി സത്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവരോടു സത്യംചെയ്തു’ സംക്ഷിപ്തവും പ്രസക്തവുമാണ്.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ പ്രമാണികൾ
  rationale: נשיאים അംഗീകൃത തലവന്മാരെയും עדה സംഘടിത സമൂഹത്തെയും സൂചിപ്പിക്കുന്നു. ‘സമൂഹത്തിന്റെ പ്രമാണികൾ’ പിന്നീട് രൂപപ്പെട്ട സഭാസംവിധാനങ്ങൾ അനാവശ്യമായി സൂചിപ്പിക്കാതെ മാന്യമായ നേതൃസ്ഥാനത്തെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി ശൈലിയുടെ പരിഭാഷ
  choice: ഉടമ്പടി ചെയ്തു
  alternative: ഉടമ്പടി മുറിച്ചു
  rationale: മൂലഭാഷയിലെ ‘മുറിക്കുക’ എന്ന രൂപകം മലയാളത്തിൽ നിലനിർത്തിയാൽ അർഥം മങ്ങാം. സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉടമ്പടിയുടെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഗൗരവം സംരക്ഷിക്കുന്നു.
- issue: הָעֵדָה എന്ന സമൂഹപദത്തിന്റെ പരിഭാഷ
  choice: സമൂഹം
  alternative: സഭ / ജനസമൂഹം
  rationale: ഇവിടെ സംഘടിത ഇസ്രായേൽ സമൂഹമാണ് ഉദ്ദേശ്യം. ‘സമൂഹം’ എന്നത് പിന്നീടുള്ള പ്രത്യേക സഭാഘടനകൾ ഇറക്കുമതി ചെയ്യാതെ പദത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ബന്ധകങ്ങളെ മലയാളവാക്യത്തിന്റെ ഒഴുക്കിനനുസരിച്ച് ‘അങ്ങനെ’, ‘-യും’, അർദ്ധവിരാമം എന്നിവകൊണ്ട് അവതരിപ്പിച്ചു.
