  to: 'അവർ യോശുവയോട് ഉത്തരം പറഞ്ഞു: “അങ്ങയുടെ ദൈവമായ യഹോവ തന്റെ ദാസനായ മോശയോട്, ദേശം മുഴുവനും നിങ്ങൾക്കു നൽകാനും ദേശവാസികളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് നശിപ്പിക്കാനും കല്പിച്ച കാര്യം അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കു വ്യക്തമായി അറിയിക്കപ്പെട്ടിരുന്നു[a]. അതുകൊണ്ട് നിങ്ങൾ നിമിത്തം ഞങ്ങളുടെ ജീവനെക്കുറിച്ച് ഞങ്ങൾ അത്യന്തം ഭയപ്പെട്ടു; അതിനാലാണ് ഞങ്ങൾ ഈ കാര്യം ചെയ്തത്.”'
  rationale: The revision restores the source’s emphatic passive construction, makes the singular address to Joshua consistent, and preserves ‘this matter’ in the final clause. It does not alter the meaning or soften the reported command.
