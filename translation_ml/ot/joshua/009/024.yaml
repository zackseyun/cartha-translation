  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: ml
  text: 'അവർ യോശുവയോട് ഉത്തരം പറഞ്ഞു: “അങ്ങയുടെ ദൈവമായ യഹോവ തന്റെ ദാസനായ മോശയോട്, ദേശം മുഴുവനും നിങ്ങൾക്കു നൽകാനും ദേശവാസികളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് നശിപ്പിക്കാനും കല്പിച്ച കാര്യം അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കു വ്യക്തമായി അറിയിക്കപ്പെട്ടിരുന്നു[a]. അതുകൊണ്ട് നിങ്ങൾ നിമിത്തം ഞങ്ങളുടെ ജീവനെക്കുറിച്ച് ഞങ്ങൾ അത്യന്തം ഭയപ്പെട്ടു; അതിനാലാണ് ഞങ്ങൾ ഈ കാര്യം ചെയ്തത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കു തീർച്ചയായും അറിയിക്കപ്പെട്ടിരുന്നു.” ഊന്നൽ നൽകാൻ ഹീബ്രുവിൽ ഒരേ ക്രിയയുടെ അനന്തക്രിയാരൂപവും പൂർണക്രിയാരൂപവും ചേർത്തുപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: അവർ യോശുവയോട് ഉത്തരം പറഞ്ഞു
  rationale: ഇരട്ട വാക്യപ്രയോഗത്തെ മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ, പ്രതികരണവും തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: '[കാരണം സൂചിപ്പിക്കുന്ന ആശയം തുടർന്നുള്ള വാക്യത്തിൽ ഉൾപ്പെടുത്തി]'
  rationale: ഗിബെയോന്യർ ചെയ്ത പ്രവൃത്തിയുടെ കാരണം ഇതിലൂടെ വിശദീകരിക്കുന്നു; മലയാളത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിൽ പ്രത്യേകമായി ‘കാരണം’ ചേർക്കാതെ കാരണബന്ധം വ്യക്തമാണ്.
- source_word: הֻגֵּד הֻגַּד
  choice: വ്യക്തമായി അറിഞ്ഞിരുന്നു
  rationale: נגד എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം അറിയിക്കപ്പെടുക എന്ന അർഥവും infinitive absolute നൽകുന്ന ഊന്നലും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിൽ ‘ഞങ്ങളെ വ്യക്തമായി അറിയിച്ചിരുന്നു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; വിവരം ലഭിച്ചതെന്ന passive പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾ
  rationale: നയതന്ത്രപരമായ വിനയപൂർവ സ്വയംപരാമർശമാണ്; അടിമത്തം ഊന്നുന്ന പദം ഒഴിവാക്കി, അഭിസംബോധനയിലെ ബഹുമാനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും אֱלֹהֶיךָ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനായ
  rationale: മോശെയുടെ ദൈവനിയോഗിത സേവനത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദമായി עבד വിവർത്തനം ചെയ്യുന്നു.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: ദേശം മുഴുവനും നിങ്ങൾക്കു നൽകാനും
  rationale: ദേശത്തിന്റെ സമഗ്രതയും ഇസ്രായേലിനു നൽകുന്ന പ്രവൃത്തിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: ദേശവാസികളെയെല്ലാം നിങ്ങളുടെ മുമ്പിൽനിന്ന് നശിപ്പിക്കാനും
  rationale: השמיד എന്നതിന്റെ ശക്തമായ നാശാർഥവും מִפְּנֵיכֶם സൂചിപ്പിക്കുന്ന ഇസ്രായേലിന്റെ മുമ്പിൽനിന്നുള്ള നീക്കലും നിലനിർത്തുന്നു.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: ഞങ്ങളുടെ ജീവനെക്കുറിച്ച് ഞങ്ങൾ അത്യന്തം ഭയപ്പെട്ടു
  rationale: נפשׁ ഇവിടെ ജീവൻ എന്ന അർഥത്തിൽ; מְאֹד എന്ന തീവ്രത ‘അത്യന്തം’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: അതിനാലാണ് ഞങ്ങൾ ഇങ്ങനെ ചെയ്തത്
  rationale: ഹീബ്രുവിലെ ‘ഈ കാര്യം ചെയ്തു’ എന്ന പ്രയോഗം കാരണബന്ധം വ്യക്തമായ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: ദേശവാസികളുടെ നാശത്തെക്കുറിച്ചുള്ള കല്പനയുടെ ശക്തി
  choice: നശിപ്പിക്കാനും
  alternative: നീക്കിക്കളയാനും
  rationale: השמיד എന്ന ക്രിയയുടെ ശക്തമായ അർഥം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു; വാക്യം ഇത് ഗിബെയോന്യർ കേട്ടറിഞ്ഞ കല്പനയായി റിപ്പോർട്ട് ചെയ്യുന്നതും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യോശുവയോടുള്ള വിനയപൂർവമായ അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചപ്പോൾ, ഉദ്ധരിക്കപ്പെട്ട ദൈവകല്പനയിലെ ബഹുവചനത്തെ ‘നിങ്ങൾ’ എന്നു നിലനിർത്തി. ഹീബ്രു ഊന്നൽ പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
