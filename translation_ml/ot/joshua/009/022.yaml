id: JOS.9.22
reference: Joshua 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ അവരെ വിളിച്ചുവരുത്തി അവരോടു പറഞ്ഞു: “നിങ്ങൾ ഞങ്ങളുടെ ഇടയിൽ[a] താമസിക്കുന്നവരായിരിക്കെ, ‘ഞങ്ങൾ നിങ്ങളിൽനിന്ന് വളരെ ദൂരെയാണ്’ എന്നു പറഞ്ഞ് ഞങ്ങളെ വഞ്ചിച്ചത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളുടെ മധ്യേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: അവരെ വിളിച്ചുവരുത്തി
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ വെറും വിളിയെയല്ല, ഗിബെയോന്യരെ തന്റെ മുമ്പാകെ വരുത്തിയതിനെയും സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചുവരുത്തി’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രായിലെ പതിവ് സംഭാഷണാരംഭസൂത്രത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: ഞങ്ങളെ വഞ്ചിച്ചത്
  rationale: പീയേൽ രൂപം മനഃപൂർവമായ വഞ്ചനയെ സൂചിപ്പിക്കുന്നു; ‘വഞ്ചിച്ചു’ അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: ഞങ്ങൾ നിങ്ങളിൽനിന്ന് വളരെ ദൂരെയാണ്
  rationale: מְאֹד നൽകുന്ന ഊന്നൽ ‘വളരെ’ എന്ന പദത്തിലൂടെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּקִרְבֵּנוּ
  choice: ഞങ്ങളുടെ ഇടയിൽ
  rationale: സ്ഥലപരമായ ‘നമ്മുടെ മധ്യേ/ഇടയിൽ’ എന്ന അർഥമുള്ള പ്രയോഗത്തിന് സാധാരണ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: יֹשְׁבִים
  choice: താമസിക്കുന്നവർ
  rationale: പങ്ക്തിരൂപം തുടരുന്ന വാസത്തെയോ കുടിയിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ‘താമസിക്കുന്നവർ’ അതിനെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടിയെക്കുറിച്ചുള്ള പരോക്ഷ കുറ്റാരോപണം വിശദീകരിക്കണമോ
  choice: ഭൗമദൂരത്തെക്കുറിച്ചുള്ള വ്യാജവാദവും അതിലൂടെയുള്ള വഞ്ചനയും മാത്രം വാക്യത്തിൽ പ്രകടിപ്പിച്ചു.
  alternative: ഉടമ്പടി ലംഘനമോ അതിന്റെ ദൈവശാസ്ത്രപരമായ പ്രത്യാഘാതങ്ങളോ മുഖ്യവാചകത്തിൽ ചേർക്കുക.
  rationale: ഈ വാക്യം നേരിട്ട് കുറ്റപ്പെടുത്തുന്നത് സമീപത്ത് താമസിച്ചിട്ടും വളരെ ദൂരത്തുനിന്നാണെന്ന് പറഞ്ഞ വഞ്ചനയെയാണ്; ഉടമ്പടിസംബന്ധമായ പ്രത്യാഘാതങ്ങൾ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്, വിവർത്തനത്തിൽ ചേർക്കേണ്ടതല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഹീബ്രായിലെ അവസാനത്തെ വിരുദ്ധവാക്യം മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ ‘താമസിക്കുന്നവരായിരിക്കെ’ എന്ന ഘടനയിൽ മുൻപോട്ട് കൊണ്ടുവന്നിട്ടും അതിന്റെ ഊന്നലും കുറ്റാരോപണവും നിലനിർത്തി.
