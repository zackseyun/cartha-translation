  source_fidelity: 'ഹീബ്രായ വാക്യത്തിലെ ക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പുനഃക്രമീകരിച്ചിട്ടുണ്ടെങ്കിലും എല്ലാ പ്രധാന ഘടകങ്ങളും നിലനിൽക്കുന്നു: യോശുവയുടെ വിളിച്ചുവരുത്തൽ, അവരോടുള്ള പ്രസംഗം, വഞ്ചനയെക്കുറിച്ചുള്ള ചോദ്യം, ‘വളരെ ദൂരെയാണ്’ എന്ന അവകാശവാദം, യാഥാർഥ്യത്തിൽ അവരുടെ ഇടയിലെ വാസം. ‘എന്നു പറഞ്ഞ്’ ഇവിടെ לֵאמֹר ഘടനയുടെയും വഞ്ചനയുടെ ഉള്ളടക്കത്തിന്റെയും സ്വാഭാവികമായ അവതരണമാണ്.'
  naturalness: ‘നിങ്ങൾ ഞങ്ങളുടെ ഇടയിൽ താമസിക്കുന്നവരായിരിക്കെ ... ഞങ്ങളെ വഞ്ചിച്ചത് എന്തിന്?’ എന്ന ഘടന ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘വിളിച്ചുവരുത്തി’ സന്ദർഭോചിതമായി സമൻസ് ചെയ്യുന്നതിന്റെ ആശയം നന്നായി പ്രകടിപ്പിക്കുന്നു.
  terminology: ‘വഞ്ചിച്ചത്,’ ‘താമസിക്കുന്നവർ,’ ‘ഞങ്ങളുടെ ഇടയിൽ’ എന്നിവ ഹീബ്രായ പദങ്ങളുടെ അർഥവും വാക്യത്തിന്റെ ഔപചാരിക സംഭാഷണരജിസ്റ്ററും യഥാവിധി സംരക്ഷിക്കുന്നു. ദൈവശാസ്ത്രപരമോ ഉടമ്പടിസംബന്ധമോ ആയ വിശദീകരണം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
