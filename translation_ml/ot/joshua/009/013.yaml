source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: ml
  text: ഈ വീഞ്ഞുതുരുത്തികൾ പുതിയവയായിരുന്നപ്പോൾ ഞങ്ങൾ നിറച്ചതാണ്—നോക്കൂ, അവ പൊട്ടിപ്പിളർന്നിരിക്കുന്നു[a]. ഞങ്ങളുടെ ഈ വസ്ത്രങ്ങളും ചെരിപ്പുകളും വളരെ ദീർഘമായ യാത്ര നിമിത്തം തേഞ്ഞുപോയിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പിളർന്നുതുറന്നിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘യാത്രയുടെ വളരെ വലിയ ദൈർഘ്യം നിമിത്തം’; അതായത്, യാത്ര വളരെ ദീർഘമായിരുന്നതിനാൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: വീഞ്ഞുതുരുത്തികൾ
  rationale: നֹאד ദ്രാവകങ്ങൾ സൂക്ഷിക്കാൻ ഉപയോഗിച്ചിരുന്ന തോൽപാത്രമാണ്. ‘വീഞ്ഞുതുരുത്തികൾ’ അതിന്റെ വസ്തുവും ഉപയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: ഞങ്ങൾ പുതുതായിരിക്കുമ്പോൾ നിറച്ച
  rationale: ‘പുതിയത്’ എന്ന വിശേഷണം തുരുത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; കാലസൂചനയായി നൽകുന്നത് മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: നോക്കൂ—ഇപ്പോൾ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഇപ്പോഴത്തെ അവസ്ഥ ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: הִתְבַּקָּעוּ
  choice: പൊട്ടിപ്പിളർന്നിരിക്കുന്നു
  rationale: തോൽപാത്രങ്ങൾ പിളർന്ന് തുറന്നുപോയ ഫലാവസ്ഥയെ ഈ പ്രയോഗം കൃത്യമായി സൂചിപ്പിക്കുന്നു; വെറും ‘പൊട്ടി’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: שַׂלְמוֹתֵינוּ
  choice: ഞങ്ങളുടെ ഈ വസ്ത്രങ്ങൾ
  rationale: שַׂלְמוֹת എന്നത് പൊതുവായി വസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വസ്ത്രങ്ങൾ’ മാന്യവും സ്വാഭാവികവുമായ പൊതുപദമാണ്.
- source_word: נְעָלֵינוּ
  choice: ചെരിപ്പുകൾ
  rationale: പാദരക്ഷകളെ സൂചിപ്പിക്കുന്ന പൊതുപദം; പുരാതന സാഹചര്യത്തിൽ ചെരിപ്പ്/സാൻഡൽ എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בָּלוּ
  choice: തേഞ്ഞുപോയിരിക്കുന്നു
  rationale: ദീർഘമായ ഉപയോഗംകൊണ്ട് പഴകി ഉപയോഗക്ഷമത നഷ്ടപ്പെടുന്ന ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: വളരെ ദീർഘമായ യാത്ര നിമിത്തം
  rationale: വഴിയുടെ അത്യധികമായ ദൈർഘ്യമാണ് വസ്ത്രങ്ങളും ചെരിപ്പുകളും തേഞ്ഞതിന്റെ കാരണം എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
