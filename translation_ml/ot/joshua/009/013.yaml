revisions:
- from: ഞങ്ങൾ പുതുതായിരിക്കുമ്പോൾ നിറച്ച ഈ വീഞ്ഞുതുരുത്തികൾ നോക്കൂ—ഇപ്പോൾ അവ പൊട്ടിപ്പിളർന്നിരിക്കുന്നു[a]. വളരെ ദീർഘമായ യാത്ര നിമിത്തം ഞങ്ങളുടെ ഈ വസ്ത്രങ്ങളും ചെരിപ്പുകളും തേഞ്ഞുപോയിരിക്കുന്നു[b].
