  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ റിപ്പോർട്ടുഭാവവും തെളിവുകൾ ചൂണ്ടിക്കാണിക്കുന്ന സംസാരശൈലിയും നിലനിർത്തിയിരിക്കുന്നു.
