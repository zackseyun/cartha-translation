  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: ml
  text: യോർദ്ദാന്റെ മറുകരയിലായിരുന്ന[a] അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരോട്—ഹെശ്ബോൻ രാജാവായ സീഹോനോടും അഷ്ടാരോത്തിൽ ഉണ്ടായിരുന്ന[b] ബാശാൻ രാജാവായ ഓഗിനോടും—അവൻ ചെയ്തതെല്ലാം
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോർദ്ദാനക്കരെ’ എന്നും ‘യോർദ്ദാന്റെ മറുവശത്തായിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അഷ്ടാരോത്തിൽ ആയിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതെല്ലാം
  rationale: വാക്യം മുൻവാക്യത്തിലെ പട്ടിക തുടരുന്നു. עָשָׂה എന്നതിന്റെ പരോക്ഷ കർത്താവിനെ എബ്രായപാഠംപോലെ ‘അവൻ’ എന്നു നിലനിർത്തുന്നു; כָּל אֲשֶׁר എന്ന സമഗ്രത ‘ചെയ്തതെല്ലാം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ രണ്ടു രാജാക്കന്മാരോട്
  rationale: לְ എന്ന ബന്ധത്തെ ‘-ഓട്’ ഉപയോഗിച്ച് നേരിട്ട് നൽകുന്നു; ‘എതിരായി’ എന്നു വിവർത്തനം ചെയ്ത് സംഘർഷഭാവം അധികമായി ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ ഉണ്ടായിരുന്ന
  rationale: בְּעֵבֶר എന്നത് സംസാരിക്കുന്നവരുടെ ഭൂമിശാസ്ത്രപരമായ കാഴ്ചപ്പാടിൽ യോർദ്ദാന്റെ അക്കരയെ സൂചിപ്പിക്കുന്നു. ആപേക്ഷിക വാക്യത്തിന്റെ ബഹുവചനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ രാജാവായ സീഹോനോടും
  rationale: രാജാവിന്റെ പദവിയും സ്ഥലനാമവും വ്യക്തമായ സമാനാധികരണഘടനയിൽ നൽകുന്നു; തുടർന്നുള്ള സമാന്തര പട്ടികയ്ക്കായി ‘-ഉം’ ചേർക്കുന്നു.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻ രാജാവായ ഓഗിനോടും
  rationale: സീഹോനെക്കുറിച്ചുള്ള മുൻഘടനയോട് സമാന്തരമായി രാജപദവിയും പേരും നൽകുന്നു.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: അഷ്ടാരോത്തിൽ ഉണ്ടായിരുന്ന
  rationale: ആപേക്ഷിക ഉപവാക്യം ഏറ്റവും സ്വാഭാവികമായി ഓഗിനെ വിശേഷിപ്പിക്കുന്നു. בְּ എന്നതിന്റെ സ്ഥലബന്ധം ‘-ത്തിൽ’ കൊണ്ട് നൽകുന്നു; ‘വസിച്ചിരുന്ന’ എന്ന കൂടുതൽ നിർദ്ദിഷ്ട അർത്ഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: עָשָׂה എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ’ എന്നു നിലനിർത്തി, സന്ദർഭം കർത്താവിനെ തിരിച്ചറിയാൻ അനുവദിക്കുന്നു.
  alternative: ‘യഹോവ ചെയ്തതെല്ലാം’ എന്നു ദൈവനാമം വ്യക്തമായി ചേർക്കുക.
  rationale: ഈ വാക്യത്തിൽ കർത്താവ് നാമമായി പറഞ്ഞിട്ടില്ല. മുൻസന്ദർഭം യഹോവയെ സൂചിപ്പിച്ചാലും, മൂലപാഠത്തിന്റെ പരോക്ഷത സംരക്ഷിക്കാൻ ദൈവനാമം ചേർക്കുന്നില്ല.
- issue: אֲשֶׁר בְּעַשְׁתָּרוֹת എന്നതിന്റെ ബന്ധം
  choice: ഉപവാക്യം ഓഗിനെ വിശേഷിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അഷ്ടാരോത്തിനെ ബാശാനുമായി കൂടുതൽ പൊതുവായി ബന്ധിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: വ്യാകരണപരമായി അടുത്തുള്ള ഏകവചന പുരുഷനാമമായ ഓഗാണ് സ്വാഭാവിക മുൻപദം; എങ്കിലും സ്ഥലസൂചനയുടെ ‘ഉണ്ടായിരുന്ന/ആയിരുന്നു’ വ്യത്യാസം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ നിന്ന് തുടരുന്നതിനാൽ സ്വതന്ത്രവാക്യമായി പൂർണ്ണവിരാമം ചേർത്തിട്ടില്ല. ‘അമോര്യർ,’ ‘യോർദ്ദാൻ,’ ‘ഹെശ്ബോൻ,’ ‘സീഹോൻ,’ ‘ബാശാൻ,’ ‘ഓഗ്,’ ‘അഷ്ടാരോത്ത്’ എന്നീ രൂപങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗവുമായി പൊരുത്തപ്പെടുന്ന ലിപ്യന്തരണങ്ങളായി സ്വീകരിച്ചു.
