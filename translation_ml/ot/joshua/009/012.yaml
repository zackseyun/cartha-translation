  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ ശൈലി. ഉദ്ധരണിരൂപം സംസാരസന്ദർഭം വ്യക്തമാക്കുന്നു. അവസാന ഹീബ്രു പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
