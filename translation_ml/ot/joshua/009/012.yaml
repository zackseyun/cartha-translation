  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: ml
  text: “ഞങ്ങളുടെ ഈ അപ്പം, നിങ്ങളുടെയടുത്തേക്കു വരാൻ ഞങ്ങൾ പുറപ്പെട്ട ദിവസം വീടുകളിൽനിന്ന് യാത്രയ്ക്കുള്ള ഭക്ഷണമായി എടുത്തപ്പോൾ, ചൂടുള്ളതായിരുന്നു. എന്നാൽ ഇപ്പോൾ, നോക്കൂ, അത് ഉണങ്ങി പുള്ളികളുള്ളതായിരിക്കുന്നു[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൂപ്പൽ പിടിച്ചിരിക്കുന്നു,” “വിണ്ടുകീറിയിരിക്കുന്നു,” അല്ലെങ്കിൽ “പൊടിഞ്ഞുപോകുന്ന നിലയിലായിരിക്കുന്നു.” ഹീബ്രു പദം പുള്ളികളോ പൊട്ടുകളോ കൊണ്ട് അടയാളപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു. പഴകിയ അപ്പത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ അതിന്റെ കൃത്യമായ സൂചന വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: ഞങ്ങളുടെ ഈ അപ്പം
  rationale: പ്രദർശകപദത്തിന്റെയും ഉടമസ്ഥതാസൂചകത്തിന്റെയും ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָם
  choice: ചൂടോടെ
  rationale: ‘പുതിയത്’ എന്ന വ്യാഖ്യാനാർഥം ചേർക്കാതെ ഹീബ്രു വിശേഷണത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: യാത്രയ്ക്കുള്ള ഭക്ഷണമായി ഞങ്ങൾ ഇതെടുത്തത്
  rationale: യാത്രയ്ക്കായി വിഭവങ്ങൾ കരുതുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും അപ്പത്തെ കർമമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מִבָּתֵּינוּ
  choice: വീടുകളിൽനിന്ന്
  rationale: മൂലപാഠത്തിലെ ബഹുവചനമായ ‘ഞങ്ങളുടെ വീടുകൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: പുറപ്പെട്ട ദിവസം
  rationale: യാത്ര ആരംഭിച്ച സമയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: നിങ്ങളുടെയടുത്തേക്കു വരാൻ
  rationale: ശ്രോതാക്കളുടെ അടുക്കലേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരാൻ’ എന്നു പറയുന്നു; ദിശാബോധം സംരക്ഷിക്കുന്നു.
- source_word: וְעַתָּה הִנֵּה
  choice: എന്നാൽ ഇപ്പോൾ നോക്കൂ
  rationale: മുമ്പത്തെ അവസ്ഥയോടുള്ള വൈരുധ്യവും ഇപ്പോഴത്തെ തെളിവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: יָבֵשׁ
  choice: ഉണങ്ങി
  rationale: അപ്പത്തിന്റെ ഇപ്പോഴത്തെ ഉണങ്ങിയ അവസ്ഥ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהָיָה נִקֻּדִים
  choice: പുള്ളിപുള്ളിയായിരിക്കുന്നു
  rationale: പുള്ളികളോ പൊട്ടുകളോ ഉള്ളത് എന്ന ഹീബ്രു പദത്തിന്റെ അടിസ്ഥാന ദൃശ്യാർഥം നിലനിർത്തുന്നു; പൂപ്പൽ പിടിച്ചു, പൊടിഞ്ഞു തുടങ്ങിയ സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനങ്ങൾ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
