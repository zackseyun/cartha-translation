  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ നിങ്ങൾ ശപിക്കപ്പെട്ടിരിക്കുന്നു; നിങ്ങളിൽനിന്ന് എന്റെ ദൈവത്തിന്റെ ആലയത്തിനുവേണ്ടി അടിമകളും വിറകുവെട്ടുന്നവരും വെള്ളം കോരുന്നവരും ഒരിക്കലും ഇല്ലാതാകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘നിങ്ങളിൽനിന്ന് ഒരു അടിമ ഒരിക്കലും ഛേദിക്കപ്പെടുകയില്ല.’ അവരുടെ ജനത്തിൽനിന്ന് ഈ വേലയ്ക്കുള്ളവർ തുടർച്ചയായി ഉണ്ടായിരിക്കുമെന്നാണ് എബ്രായപ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻവിധിയിൽനിന്ന് അതിന്റെ ശിക്ഷാഫലത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲרוּרִים
  choice: ശപിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ബഹുവചന അഭിസംബോധനയോടുള്ള വിധേയവിശേഷണത്തിന്റെ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: നിങ്ങളിൽനിന്ന് ... അടിമകൾ ... ഒരിക്കലും ഇല്ലാതാകുകയില്ല
  rationale: כרת എന്ന ക്രിയയുടെ ‘മുറിച്ചുനീക്കപ്പെടുക/ഇല്ലാതാകുക’ എന്ന രൂപകവും സമൂഹത്തിൽനിന്ന് ഈ നില തുടർച്ചയായി ഉണ്ടായിരിക്കുമെന്ന ആശയവും സംരക്ഷിക്കുന്നു; എബ്രായ ഏകവചനം ഇവിടെ സമൂഹവാചകമായി ഗ്രഹിക്കുന്നു.
- source_word: עֶבֶד
  choice: അടിമകൾ
  rationale: ശാപമായി ചുമത്തപ്പെട്ട അധീനവും നിർബന്ധിതവുമായ സേവനനിലയെ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: חֹטְבֵי עֵצִים
  choice: വിറകുവെട്ടുന്നവർ
  rationale: ചുമത്തപ്പെട്ട തൊഴിൽ ആധുനികവും സുതാര്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שֹׁאֲבֵי מַיִם
  choice: വെള്ളം കോരുന്നവർ
  rationale: കിണർ മുതലായ ഉറവിടങ്ങളിൽനിന്ന് വെള്ളം കോരുന്ന നിർദിഷ്ട ജോലിയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵית אֱלֹהָי
  choice: എന്റെ ദൈവത്തിന്റെ ആലയത്തിനുവേണ്ടി
  rationale: ഇവിടെ בַּיִת ഗൃഹത്തെയല്ല, ആരാധനാസങ്കേതത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ പ്രസക്തമായ മലയാള പദമാണ്.
theological_decisions:
- issue: യോശുവയുടെ ശാപത്തിൽ ചുമത്തപ്പെട്ട അധീനസേവനനിലയുടെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: വാക്യം ആരാധനാസങ്കേതവുമായി ബന്ധപ്പെട്ട നിർബന്ധിതവും തുടർച്ചയായതുമായ കീഴാളവേലയെ വിവരിക്കുന്നു. അതിന്റെ കാഠിന്യം മയപ്പെടുത്താതിരിക്കാൻ ‘അടിമകൾ’ തിരഞ്ഞെടുത്തു.
- issue: വിധി ഓരോ വ്യക്തിക്കും ഒരേ തൊഴിലാണോ, സമൂഹം തുടർച്ചയായി തൊഴിലാളികളെ നൽകുമെന്നാണോ
  choice: നിങ്ങളിൽനിന്ന് ... ഒരിക്കലും ഇല്ലാതാകുകയില്ല
  alternative: നിങ്ങളിൽ ചിലർ എന്നും അടിമകളായിരിക്കും
  rationale: എബ്രായവാക്യം വ്യക്തികളിലെ ‘ചിലരെ’ വേർതിരിക്കുന്നതിനെക്കാൾ അവരുടെ സമൂഹത്തിൽനിന്ന് ഇത്തരക്കാരുടെ നിര അവസാനിക്കില്ലെന്ന ആശയം മുന്നോട്ടുവയ്ക്കുന്നു; അതിനാൽ ആ കൂട്ടായ, തുടർച്ചയായ അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ആലയം’ ആരാധനാസങ്കേതസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘അടിമകൾ’ ശാപത്തിന്റെ കാഠിന്യം മയപ്പെടുത്തുന്നില്ല.
