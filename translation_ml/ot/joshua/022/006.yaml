source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/ם יְהוֹשֻׁ֑עַ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אָהֳלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ അവരെ അനുഗ്രഹിച്ച് അയച്ചുവിട്ടു; അവർ തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു[a] പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തങ്ങളുടെ വീടുകളിലേക്ക്’—അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ കൂടാരങ്ങളിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: അവരെ അനുഗ്രഹിച്ചു
  rationale: പീയേൽ രൂപം ഇവിടെ യാത്രതിരിക്കുന്നവർക്കു യോശുവ അനുഗ്രഹം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുഗ്രഹിച്ചു’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവും മൂലഭാഷയുടെ ഔപചാരിക പ്രവർത്തനം നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: וַיְשַׁלְּחֵם
  choice: യാത്രയാക്കി
  rationale: ഈ സന്ദർഭത്തിൽ שׁלח അവരെ പുറപ്പെടാൻ അനുവദിച്ച് അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്രയാക്കി’ വിടപറഞ്ഞ് അയയ്ക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; വെറും ‘അയച്ചു’ എന്നതിലുണ്ടാകാവുന്ന നിയോഗാർത്ഥം ഒഴിവാക്കുന്നു.
- source_word: וַיֵּלְכוּ
  choice: അവർ ... പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ നേരിട്ടുള്ള പരിഭാഷ. ‘മടങ്ങിപ്പോയി’ എന്നു പറയുന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത മടക്കയാത്രയുടെ ആശയം കൂട്ടിച്ചേർക്കും.
- source_word: אֶל
  choice: -ലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള ദിശാവിഭക്തി.
- source_word: אָהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങൾ
  rationale: നാമത്തിന്റെ അക്ഷരാർഥം ‘അവരുടെ കൂടാരങ്ങൾ’ എന്നാണ്. കർത്താവ് ‘അവർ’ ആയതിനാൽ മലയാളത്തിൽ പ്രതിഫലകമായ ‘തങ്ങളുടെ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘വീടുകൾ’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണ ശൈലി. എബ്രായ വാക്യക്രമത്തിന്റെ തുടർച്ച നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി ‘അനുഗ്രഹിച്ച് യാത്രയാക്കി’ എന്ന ക്രിയാശൃംഖല ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
