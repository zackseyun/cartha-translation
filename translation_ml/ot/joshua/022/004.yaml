reference: Joshua 22:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: ml
  text: ഇപ്പോൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ, താൻ അവരോടു പറഞ്ഞതുപോലെ[a], നിങ്ങളുടെ സഹോദരന്മാർക്ക്[b] വിശ്രമം നൽകിയിരിക്കുന്നു. അതിനാൽ ഇപ്പോൾ നിങ്ങൾ തിരിഞ്ഞ് നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കും[c], യഹ്‌വെയുടെ ദാസനായ മോശെ നിങ്ങൾക്കു നൽകിയ യോർദ്ദാനപ്പുറത്തുള്ള[d] നിങ്ങളുടെ സ്വന്തമായ ദേശത്തേക്കും പോകുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താൻ അവരോടു വാഗ്ദാനം ചെയ്തതുപോലെ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥം ‘താൻ അവരോടു പറഞ്ഞതുപോലെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് അവരുടെ സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിങ്ങളുടെ വീടുകളിലേക്കും.’ അക്ഷരാർഥം ‘നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കും’ എന്നാണ്.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, ‘യോർദ്ദാന്റെ മറുകരയിലുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: വിശ്രമം നൽകിയിരിക്കുന്നു
  rationale: നוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ യുദ്ധത്തിൽനിന്നും സംഘർഷത്തിൽനിന്നും ആശ്വാസവും സുരക്ഷയും നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിശ്രമം നൽകി’ എന്നത് മൂലരൂപത്തിന്റെ ദൃശ്യവും സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ സാധാരണ ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: לַאֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർക്ക്
  rationale: പുരുഷലിംഗ ബഹുവചനമായ എബ്രായരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: താൻ അവരോടു പറഞ്ഞതുപോലെ
  rationale: דבר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പറഞ്ഞു/സംസാരിച്ചു’ എന്നാണ്. ‘വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും അത് വ്യാഖ്യാനപരമായതിനാൽ കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: פְּנוּ
  choice: തിരിഞ്ഞ്
  rationale: ആജ്ഞാരൂപത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘തിരിയുക’ നിലനിർത്തി; തുടർന്നുള്ള ‘പോകുവിൻ’ എന്നതോടൊപ്പം ഇവിടെനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וּלְכוּ לָכֶם
  choice: പോകുവിൻ
  rationale: לָכֶם എന്ന നൈതിക ദാതീവിന് മലയാളത്തിൽ വേറൊരു പദം ചേർക്കാതെ ആജ്ഞ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: לְאָהֳלֵיכֶם
  choice: നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു
  rationale: ‘വീടുകളിലേക്ക്’ എന്ന വിപുലമായ പ്രയോഗാർഥം സാധ്യമാണെങ്കിലും, ചരിത്രപരമായ ദൃശ്യവും എബ്രായ പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും നിലനിർത്താൻ ‘കൂടാരങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: നിങ്ങളുടെ കൈവശദേശത്തേക്കു
  rationale: אֲחֻזָּה സ്വന്തമായി കൈവശം വയ്ക്കുന്ന ഭൂമിയെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശദേശം’ എന്നത് അവകാശപാരമ്പര്യത്തിന്റെ അധിക ആശയം വരുത്താമെന്നതിനാൽ ‘കൈവശദേശം’ തിരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: മോശെ നിങ്ങൾക്കു നൽകിയ
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ ‘നൽകി’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘വിഹിതമായി നിശ്ചയിച്ചു’ എന്നത് സന്ദർഭോചിതമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനപരമാണ്.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വെയുടെ ദാസൻ
  rationale: മോശെയെക്കുറിച്ചുള്ള ബഹുമാനസൂചക ഉടമ്പടിപദവിയായി עֶבֶד ഇവിടെ വരുന്നതിനാൽ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ മറുകരയിൽ
  rationale: സംസാരിക്കുന്നവന്റെ സ്ഥാനത്തുനിന്ന് യോർദ്ദാനപ്പുറത്തെ പ്രദേശം സൂചിപ്പിക്കുന്ന സ്ഥലംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നത് ഉടമ്പടിനാമത്തെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ എന്ന രൂപം വേറൊരു പരമ്പരാഗത ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: ‘പറഞ്ഞതുപോലെ’ എന്നതിലെ ദൈവിക വാഗ്ദാനത്തിന്റെ സൂചന
  choice: പറഞ്ഞതുപോലെ
  alternative: വാഗ്ദാനം ചെയ്തതുപോലെ
  rationale: വാക്യസന്ദർഭത്തിൽ ദൈവിക വാഗ്ദാനം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം; എങ്കിലും דבר എന്ന ക്രിയ നേരിട്ട് ‘പറയുക’ എന്നാണ്. അതിനാൽ വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ പദാർത്ഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ആജ്ഞയുടെ ഗൗരവം നിലനിർത്താൻ ‘പോകുവിൻ’ ഉപയോഗിച്ചു. ദീർഘമായ ഭൂമിസംബന്ധ വിശേഷണത്തെ ഡാഷുകൾക്കുള്ളിൽ വെച്ച് ‘കൂടാരങ്ങൾ’ എന്നതും ‘കൈവശദേശം’ എന്നതും ഒരേ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് വായനയിൽ വ്യക്തമാക്കി. എല്ലാ കുറിപ്പടയാളങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
