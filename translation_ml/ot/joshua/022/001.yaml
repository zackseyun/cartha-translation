  text: Then Joshua called the Reubenites, the Gadites, and the half-tribe of Manasseh,
translation:
  language: ml
  text: അപ്പോൾ യോശുവ രൂബേന്യരെയും ഗാദ്യരെയും മനശ്ശെയുടെ പകുതിഗോത്രത്തെയും വിളിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ ആഖ്യാനചിഹ്നം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: יִקְרָא
  choice: വിളിച്ചു
  rationale: Qal രൂപത്തിലുള്ള ക്രിയയ്ക്ക് ‘വിളിക്കുക/അടുക്കലേക്കു വിളിക്കുക’ എന്ന അർഥം; സന്ദർഭം ആവശ്യപ്പെടാത്ത അധിക ഔപചാരികത ‘വിളിച്ചുവരുത്തി’ പോലുള്ള രൂപങ്ങൾ നൽകാം.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
- source_word: לָרֽאוּבֵנִי
  choice: രൂബേന്യരെ
  rationale: ഏകവചനത്തിലുള്ള വംശനാമം ഇവിടെ ഗോത്രസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനരൂപം ആ കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלַגָּדִי
  choice: ഗാദ്യരെ
  rationale: ഏകവചനത്തിലുള്ള വംശനാമം കൂട്ടായ ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനമായി നൽകി.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പകുതിഗോത്രത്തെ
  rationale: מַטֶּה ഇവിടെ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പകുതിഗോത്രം’ എന്ന രൂപം ഒരു അംഗീകൃത ഗോത്രവിഭാഗമെന്ന ആശയം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
