  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമവും കൂട്ടായ ഗോത്രനാമങ്ങളുടെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
