  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: ml
  text: 'അവർ ഗിലെയാദ് ദേശത്തുള്ള[a] രൂബേന്റെ മക്കളുടെയും ഗാദിന്റെ മക്കളുടെയും മനശ്ശെയുടെ പാതിഗോത്രത്തിന്റെയും അടുക്കൽ എത്തി; അവരോടു ഇങ്ങനെ സംസാരിച്ചു[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഗിലെയാദ് ദേശത്തേക്ക്.” ഹീബ്രു മുൻവാക്ക് ദിശയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അവർ കിഴക്കൻ ഗോത്രങ്ങളുടെ അടുക്കൽ എത്തിയ സ്ഥലം വ്യക്തമാക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവരോടു പറഞ്ഞു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ കഥനരൂപം ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെത്തിയ ചലനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എത്തി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּנֵי
  choice: മക്കൾ
  rationale: ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഹീബ്രു പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടായ നാമപ്രയോഗം; ‘പുത്രന്മാർ’ എന്നത് അനാവശ്യമായി പുരുഷന്മാരിലേക്കു മാത്രം അർത്ഥം ചുരുക്കാം.
- source_word: חֲצִי שֵׁבֶט
  choice: പാതിഗോത്രം
  rationale: യോശുവയിൽ ആവർത്തിക്കുന്ന ഗോത്രവിഭാഗത്തെ സംക്ഷിപ്തമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശത്ത്
  rationale: אֶל സാധാരണയായി ദിശ സൂചിപ്പിച്ചാലും ഇവിടെ കിഴക്കൻ ഗോത്രങ്ങളെ അവർ കണ്ടുമുട്ടിയ പ്രദേശം വ്യക്തമാക്കുന്ന സ്ഥാനസൂചനയായി വായിക്കാം.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: അവരോടു സംസാരിച്ചു
  rationale: דבר + אֵת നേരിട്ടുള്ള ആശയവിനിമയം സൂചിപ്പിക്കുന്നു; ‘അവരോടു സംസാരിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ‘അവരോട് പറഞ്ഞു’ എന്ന സാധ്യതയ്ക്കും അടുത്തതുമാണ്.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ കഥനബന്ധത്തോടെ നൽകുന്നു.
