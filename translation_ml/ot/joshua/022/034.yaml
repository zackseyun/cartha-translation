  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: ml
  text: രൂബേന്റെ പുത്രന്മാരും ഗാദിന്റെ പുത്രന്മാരും ആ യാഗപീഠത്തിന് “സാക്ഷി”[a] എന്നു പേരിട്ടു; കാരണം, “യഹ്‌വേ ദൈവമാണ്” എന്നതിന് അതു നമുക്കിടയിൽ സാക്ഷിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, വിശദമായി: അവർ ആ യാഗപീഠത്തിന് “യഹ്‌വേ ദൈവമാണ് എന്നതിന് നമുക്കിടയിലെ സാക്ഷി” എന്നു പേരിട്ടു. ഇതനുസരിച്ച് തുടർന്നുള്ള വിശദീകരണവാക്യം മുഴുവനും പേരിന്റെ ഭാഗമാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: പേരിട്ടു
  rationale: קרא എന്ന ക്രിയയ്ക്ക് ഇവിടെ לַמִּזְבֵּחַ എന്ന ഘടനയോടുകൂടെ ഒരു വസ്തുവിന് പേര് നൽകുക എന്ന അർഥമാണ്; ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: രൂബേന്റെ പുത്രന്മാരും ഗാദിന്റെ പുത്രന്മാരും
  rationale: എബ്രായത്തിലെ ‘പുത്രന്മാർ’ എന്ന ഗോത്രവംശപരമായ പ്രയോഗം നിലനിർത്തുകയും മുമ്പുള്ള വിവരണവുമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַמִּזְבֵּחַ
  choice: ആ യാഗപീഠത്തിന്
  rationale: מִזְבֵּחַ എന്നതിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; നിർദിഷ്ടമായ ആ പീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֵד
  choice: സാക്ഷി
  rationale: ‘സാക്ഷി/സാക്ഷ്യം’ എന്ന അർഥമുള്ള നാമം. ഇവിടെ പീഠത്തിന്റെ പേരായി വരുന്നതിനാൽ ഉദ്ധരണിചിഹ്നങ്ങളിൽ നൽകിയിരിക്കുന്നു.
- source_word: כִּי עֵד הוּא
  choice: കാരണം ... അതു ... സാക്ഷിയാണ്
  rationale: ആദ്യ כִּי പേരിടലിന്റെ കാരണം വിശദീകരിക്കുന്നതായി വായിക്കുന്നു; הוּא യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּינֹתֵינוּ
  choice: നമുക്കിടയിൽ
  rationale: ബന്ധപ്പെട്ട കൂട്ടങ്ങൾക്കിടയിലെ സാക്ഷ്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: “യഹ്‌വേ ദൈവമാകുന്നു” എന്നതിന്
  rationale: രണ്ടാമത്തെ כִּי സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി എടുത്തു. יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നും הָאֱלֹהִים വിധേയപദമായി ‘ദൈവമാകുന്നു’ എന്നും നൽകി.
theological_decisions:
- issue: വിവരണവാക്യം മുഴുവനും യാഗപീഠത്തിന്റെ ഔപചാരിക നാമത്തിന്റെ ഭാഗമാണോ എന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘സാക്ഷി’ മാത്രം പേരായി നൽകി, തുടർന്നുള്ള വാക്കുകൾ അതിന്റെ കാരണവും സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കവുമായി അവതരിപ്പിച്ചു.
  alternative: “യഹ്‌വേ ദൈവമാകുന്നു എന്നതിന് നമുക്കിടയിലെ സാക്ഷി” എന്ന മുഴുവൻ പ്രയോഗവും പീഠത്തിന്റെ പേരായി വായിക്കുക.
  rationale: മസോരറ്റിക് പാഠം ‘സാക്ഷി’ എന്നതിന് ശേഷം വിശദീകരണസ്വഭാവമുള്ള כִּי വാക്യം നൽകുന്നു. ദീർഘനാമവായന സാധ്യമെങ്കിലും നിർബന്ധിതമല്ല; അതിനാൽ പാഠത്തിൽ കൂടുതൽ വ്യക്തമായി സാക്ഷ്യപ്പെട്ട ഹ്രസ്വവായന നിലനിർത്തി, മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പേരിട്ടു’ നാമകരണത്തെ വ്യക്തമായി അറിയിക്കുന്നു; ‘യാഗപീഠം’, ‘സാക്ഷി’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു. മൂലത്തിലെ വ്യാഖ്യാനസാധ്യത [a] അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
