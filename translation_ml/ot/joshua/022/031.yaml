source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: ml
  text: 'പുരോഹിതനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ് രൂബേന്റെ മക്കളോടും ഗാദിന്റെ മക്കളോടും മനശ്ശെയുടെ മക്കളോടും പറഞ്ഞു: “നിങ്ങൾ ഈ കാര്യത്തിൽ യഹോവയോട് വിശ്വാസവഞ്ചന കാണിച്ചിട്ടില്ലാത്തതിനാൽ, യഹോവ നമ്മുടെ ഇടയിൽ ഉണ്ടെന്ന് ഇന്ന് ഞങ്ങൾ അറിയുന്നു.[a][b] അങ്ങനെ നിങ്ങൾ ഇസ്രായേൽമക്കളെ യഹോവയുടെ കൈയിൽനിന്ന് രക്ഷിച്ചിരിക്കുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ മധ്യേ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി, “നിങ്ങൾ യഹോവയോട് ഈ വിശ്വാസവഞ്ചന ചെയ്തിട്ടില്ല”; ഈ പദാവർത്തനം ഉടമ്പടിയോടുള്ള വഞ്ചനയെയോ വിശ്വാസലംഘനത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “യഹോവയുടെ കൈയിൽനിന്ന്” എന്നത് യഹോവയുടെ ശക്തിയിൽനിന്നോ ന്യായവിധിയിൽനിന്നോ ഒഴിവാക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ തുടർച്ച സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ കാലക്രമസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസറിന്റെ മകൻ ഫീനെഹാസ്
  rationale: വ്യക്തിയുടെ പേരും പിതൃബന്ധവും പുരോഹിതപദവിയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള രൂപം.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: രൂബേന്റെ മക്കളോടും ഗാദിന്റെ മക്കളോടും മനശ്ശെയുടെ മക്കളോടും
  rationale: ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്ന ‘മക്കൾ’ എന്ന ഹീബ്രായ ഘടനയും ആവർത്തനവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: ഇന്ന് ഞങ്ങൾ അറിയുന്നു
  rationale: ഇപ്പോഴുണ്ടായ ഉറച്ച ബോധ്യത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ വർത്തമാനബലം നിലനിർത്തുന്നു.
- source_word: בְּתוֹכֵנוּ
  choice: നമ്മുടെ ഇടയിൽ
  rationale: സമൂഹത്തിന്റെ മധ്യേയുള്ള ദൈവസാന്നിധ്യം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പേരായിത്തന്നെ അവതരിപ്പിക്കുന്ന പദ്ധതിയുടെ രീതി പിന്തുടരുന്നു.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: നിങ്ങൾ ഈ കാര്യത്തിൽ യഹോവയോട് വിശ്വാസവഞ്ചന കാണിച്ചിട്ടില്ല
  rationale: מעל എന്ന ധാതുവിന്റെയും സമാനനാമത്തിന്റെയും ഉടമ്പടിപരമായ അവിശ്വസ്തത/വഞ്ചന എന്ന ഭാരം സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവികമായ പദാവർത്തനം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: אָז
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിൽനിന്ന് ഉണ്ടാകുന്ന ഫലമോ നിഗമനമോ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; കർശനമായ കാലക്രമാർത്ഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: הִצַּלְתֶּם
  choice: രക്ഷിച്ചിരിക്കുന്നു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘വിടുവിക്കുക/രക്ഷിക്കുക’ എന്ന കാരണാർഥവും പൂർത്തിയായ ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיַּד יְהוָה
  choice: യഹോവയുടെ കൈയിൽനിന്ന്
  rationale: ദൈവത്തിന്റെ അധികാരത്തെയോ ന്യായവിധിയെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള പ്രസ്താവന
  choice: യഹോവ നമ്മുടെ ഇടയിൽ ഉണ്ട്
  alternative: യഹോവ നമ്മുടെ മധ്യേ ഉണ്ട്
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിലെ ഉടമ്പടിപരമായ ദൈവസാന്നിധ്യത്തെ പ്രസ്താവിക്കുന്ന വാചകം അതിലുപരി പിന്നീടുള്ള ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: מעל എന്ന പദകുടുംബത്തിന്റെ അർത്ഥം
  choice: യഹോവയോട് വിശ്വാസവഞ്ചന കാണിക്കുക
  alternative: യഹോവയ്ക്കെതിരെ ഈ അതിക്രമം ചെയ്യുക
  rationale: ഇത് വെറും നിയമലംഘനമല്ല, യഹോവയോടുള്ള ഉടമ്പടിവിശ്വസ്തതയുടെ ലംഘനമാണെന്ന ധാർമ്മിക-ദൈവശാസ്ത്ര ഭാരം പ്രകടമാക്കുന്നു.
- issue: ‘യഹോവയുടെ കൈയിൽനിന്ന്’ എന്ന പ്രയോഗം
  choice: ഹീബ്രായ രൂപകം പ്രധാനവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: യഹോവയുടെ ന്യായവിധിയിൽനിന്ന്
  rationale: ദൈവത്തിന്റെ ശക്തിയോ ന്യായവിധിയോ ഇവിടെ ഉദ്ദേശിക്കപ്പെടാം; ‘ന്യായവിധി’ മാത്രം പ്രധാനവാചകത്തിൽ നൽകുന്നത് ആ രൂപകത്തിന്റെ വിശാലത ചുരുക്കുമെന്നതിനാൽ യഥാർത്ഥ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ഒരുമിച്ച് പാലിച്ചു. ഗോത്രപരമായ ‘മക്കൾ’ എന്ന ഘടനയും ദൈവനാമവും ഹീബ്രായത്തിലെ ‘കൈ’ എന്ന രൂപകവും നിലനിർത്തി; അസ്വാഭാവികമായ പദാവർത്തനം അടിക്കുറിപ്പിലേക്ക് മാറ്റി.
