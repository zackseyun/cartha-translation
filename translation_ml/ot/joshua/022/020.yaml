revisions:
- from: സേരഹിന്റെ മകനായ ആഖാൻ നാശത്തിനായി സമർപ്പിച്ച വസ്തുവിന്റെ കാര്യത്തിൽ അവിശ്വസ്തത കാണിച്ചില്ലയോ? അതുനിമിത്തം ഇസ്രായേൽസഭ മുഴുവന്റെയുംമേൽ ക്രോധം വന്നില്ലയോ? തന്റെ അകൃത്യത്തിൽ നശിച്ച ഒരേയൊരാൾ അവനായിരുന്നില്ലല്ലോ.
  to: സേരഹിന്റെ മകനായ ആഖാൻ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിന്റെ കാര്യത്തിൽ അവിശ്വസ്തത കാണിക്കുകയും, ഇസ്രായേൽസഭ മുഴുവന്മേലും ക്രോധം വരികയും ചെയ്തില്ലയോ? അവൻ തന്റെ അകൃത്യത്തിൽ ഒറ്റയ്ക്കല്ല മരിച്ചത്.
  rationale: The revision preserves the rhetorical force and all substantive elements of the Hebrew, while making the syntax and idiom natural in modern standard Malayalam. It avoids specifying who else died or offering an interpretation of their responsibility.
