id: JOS.22.20
reference: Joshua 22:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: ml
  text: സേരഹിന്റെ മകനായ ആഖാൻ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടതിന്റെ കാര്യത്തിൽ അവിശ്വസ്തത കാണിക്കുകയും, ഇസ്രായേൽസഭ മുഴുവന്മേലും ക്രോധം വരികയും ചെയ്തില്ലയോ? അവൻ തന്റെ അകൃത്യത്തിൽ ഒറ്റയ്ക്കല്ല മരിച്ചത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: അവിശ്വസ്തത കാണിച്ചു
  rationale: ആവർത്തനരൂപം കുറ്റത്തിന്റെ ഉറപ്പും ഗൗരവവും ഊന്നുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘അവിശ്വസ്തത കാണിച്ചു’ ഉടമ്പടിവഞ്ചനയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിച്ച വസ്തുവിന്റെ കാര്യത്തിൽ
  rationale: חֵרֶם എന്നത് ദൈവത്തിനു മാറ്റിവെച്ച് നശിപ്പിക്കേണ്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; വെറും ‘ശപിക്കപ്പെട്ട വസ്തു’ എന്നതിനെക്കാൾ സന്ദർഭാർത്ഥം കൃത്യമായി നൽകുന്നു.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേൽസഭ
  rationale: עֵדָהയുടെ കൂട്ടായ സമൂഹാർത്ഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: קָצֶף
  choice: ക്രോധം
  rationale: ദൈവിക രോഷത്തെ സൂചിപ്പിക്കുന്ന ശക്തമായെങ്കിലും സ്വാഭാവികമായ പദം.
- source_word: גָוַע
  choice: നശിച്ചു
  rationale: ഇവിടെ കുറ്റത്തിന്റെ ഫലമായ മരണത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വിധിയുടെ ഭാരം നിലനിർത്തുന്നു.
- source_word: בַעֲוֹנוֹ
  choice: തന്റെ അകൃത്യത്തിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ കാരണ/സാഹചര്യസംബന്ധിയായ തുറന്ന ഭാവം സൂക്ഷിക്കുകയും עָוֹן എന്ന പദത്തിന്റെ കുറ്റവും അതിന്റെ പരിണതിയും ഉൾക്കൊള്ളുന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആഖാന്റെ പാപത്തിന്റെ സമൂഹപരമായ പ്രത്യാഘാതം
  choice: ‘ഇസ്രായേൽസഭ മുഴുവന്റെയുംമേൽ ക്രോധം വന്നു’ എന്നും ‘നശിച്ച ഒരേയൊരാൾ അവനായിരുന്നില്ല’ എന്നും നേരിട്ട് നിലനിർത്തി.
  alternative: ആഖാനോടൊപ്പം അവന്റെ കുടുംബം മാത്രം ശിക്ഷിക്കപ്പെട്ടു എന്നു വിശദീകരിക്കുക.
  rationale: ഹീബ്രു വാക്യം ക്രോധം മുഴുവൻ സമൂഹത്തിന്മേൽ വന്നതും ആഖാൻ മാത്രം മരിച്ചില്ലെന്നതും പറയുന്നു; മറ്റുള്ളവർ ആരെന്നോ എങ്ങനെ മരിച്ചെന്നോ ഈ വാക്യം നിർണ്ണയിക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിന്റെ വ്യാകരണബന്ധം
  choice: ‘തന്റെ അകൃത്യത്തിൽ നശിച്ച ഒരേയൊരാൾ അവനായിരുന്നില്ല’
  alternative: ‘അവൻ തന്റെ അകൃത്യത്തിൽ ഒറ്റയ്ക്കല്ല മരിച്ചത്’
  rationale: ഹീബ്രു לֹא ... אֶחָד സമൂഹപരമായ ഫലത്തെ ഊന്നുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആഖാൻ മാത്രമല്ല മരണപ്പെട്ടത് എന്ന അർത്ഥം വ്യക്തമായി നൽകുന്നു; ഉത്തരവാദിത്തത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ വാചാടോപചോദ്യങ്ങളുടെ ശക്തി രണ്ട് ചോദ്യങ്ങളായി സ്വാഭാവികമായി നിലനിർത്തി. സാങ്കേതിക പദമായ חֵרֶם വിശദീകരണാത്മകമായി വിവർത്തനം ചെയ്തതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
