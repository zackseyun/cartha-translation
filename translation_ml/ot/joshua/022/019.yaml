revisions:
- from: 'എന്നാൽ നിങ്ങളുടെ അവകാശഭൂമി[a] അശുദ്ധമാണെങ്കിൽ, യഹ്‌വേയുടെ തിരുനിവാസം പാർക്കുന്ന[b] യഹ്‌വേയുടെ അവകാശഭൂമിയിലേക്ക് കടന്നുവന്ന് ഞങ്ങളുടെ ഇടയിൽ അവകാശം നേടിക്കൊള്ളുക[c]. യഹ്‌വേയോടു മത്സരിക്കരുത്; ഞങ്ങളോടും മത്സരിക്കരുത്. നമ്മുടെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനു പുറമേ[d] നിങ്ങൾക്കായി മറ്റൊരു യാഗപീഠം പണിതുകൊണ്ട് അങ്ങനെ ചെയ്യരുത്.


    [a] അഥവാ “നിങ്ങൾക്ക് പൈതൃകമായി ലഭിച്ച ഭൂമി.” “അവകാശം” എന്നതിനുള്ള എബ്രായപദത്തിന് പാരമ്പര്യമായി ലഭിച്ച ഭൂസ്വത്ത് എന്നും അർഥമാകാം.

    [b] അഥവാ “യഹ്‌വേയുടെ തിരുനിവാസം സ്ഥിതിചെയ്യുന്ന.” എബ്രായവാക്യം അക്ഷരാർഥത്തിൽ യഹ്‌വേയുടെ തിരുനിവാസം അവിടെ പാർക്കുന്നതായി പറയുന്നു.

    [c] അഥവാ “ഞങ്ങളുടെ ഇടയിൽ താമസമാക്കുക.” എബ്രായക്രിയയ്ക്ക് ഒരു അവകാശഭാഗം നേടുക എന്നോ ഒരു സ്ഥലത്തു താമസമാക്കുക എന്നോ അർഥമാകാം.

    [d] അഥവാ “വേറെയായി” അല്ലെങ്കിൽ “കൂടാതെ.”'
  to: 'എന്നാൽ നിങ്ങളുടെ അവകാശഭൂമി[a] അശുദ്ധമാണെങ്കിൽ, യഹ്‌വേയുടെ തിരുനിവാസം പാർക്കുന്ന[b] യഹ്‌വേയുടെ അവകാശഭൂമിയിലേക്ക് കടന്നുവരിക; ഞങ്ങളുടെ ഇടയിൽ ഒരു അവകാശഭാഗം നേടിക്കൊള്ളുക[c]. എന്നാൽ നമ്മുടെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനു പുറമേ[d] നിങ്ങൾക്കുവേണ്ടി ഒരു യാഗപീഠം പണിതുകൊണ്ട് യഹ്‌വേക്കെതിരെയും ഞങ്ങൾക്കെതിരെയും ധിക്കരിക്കരുത്.


    [a] അഥവാ “നിങ്ങൾക്ക് പൈതൃകമായി ലഭിച്ച ഭൂമി.” “അവകാശം” എന്നതിനുള്ള എബ്രായപദത്തിന് പാരമ്പര്യമായി ലഭിച്ച ഭൂസ്വത്ത് എന്നും അർഥമാകാം.


    [b] അഥവാ “യഹ്‌വേയുടെ തിരുനിവാസം സ്ഥിതിചെയ്യുന്ന.” എബ്രായവാക്യം അക്ഷരാർഥത്തിൽ യഹ്‌വേയുടെ തിരുനിവാസം അവിടെ പാർക്കുന്നതായി പറയുന്നു.


    [c] അഥവാ “ഞങ്ങളുടെ ഇടയിൽ താമസമാക്കുക.” എബ്രായക്രിയയ്ക്ക് ഒരു അവകാശഭാഗം നേടുക എന്നോ ഒരു സ്ഥലത്തു താമസമാക്കുക എന്നോ അർഥമാകാം.


    [d] അഥവാ “യഹ്‌വേയുടെ യാഗപീഠത്തിൽനിന്ന് വേറെയായി” അല്ലെങ്കിൽ “യഹ്‌വേയുടെ യാഗപീഠത്തിനു കൂടാതെ.”'
