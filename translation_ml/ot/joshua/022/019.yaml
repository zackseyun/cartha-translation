source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങളുടെ അവകാശഭൂമി[a] അശുദ്ധമാണെങ്കിൽ, യഹ്‌വേയുടെ തിരുനിവാസം പാർക്കുന്ന[b] യഹ്‌വേയുടെ അവകാശഭൂമിയിലേക്ക് കടന്നുവരിക; ഞങ്ങളുടെ ഇടയിൽ ഒരു അവകാശഭാഗം നേടിക്കൊള്ളുക[c]. എന്നാൽ നമ്മുടെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനു പുറമേ[d] നിങ്ങൾക്കുവേണ്ടി ഒരു യാഗപീഠം പണിതുകൊണ്ട് യഹ്‌വേക്കെതിരെയും ഞങ്ങൾക്കെതിരെയും ധിക്കരിക്കരുത്.


    [a] അഥവാ “നിങ്ങൾക്ക് പൈതൃകമായി ലഭിച്ച ഭൂമി.” “അവകാശം” എന്നതിനുള്ള എബ്രായപദത്തിന് പാരമ്പര്യമായി ലഭിച്ച ഭൂസ്വത്ത് എന്നും അർഥമാകാം.


    [b] അഥവാ “യഹ്‌വേയുടെ തിരുനിവാസം സ്ഥിതിചെയ്യുന്ന.” എബ്രായവാക്യം അക്ഷരാർഥത്തിൽ യഹ്‌വേയുടെ തിരുനിവാസം അവിടെ പാർക്കുന്നതായി പറയുന്നു.


    [c] അഥവാ “ഞങ്ങളുടെ ഇടയിൽ താമസമാക്കുക.” എബ്രായക്രിയയ്ക്ക് ഒരു അവകാശഭാഗം നേടുക എന്നോ ഒരു സ്ഥലത്തു താമസമാക്കുക എന്നോ അർഥമാകാം.


    [d] അഥവാ “യഹ്‌വേയുടെ യാഗപീഠത്തിൽനിന്ന് വേറെയായി” അല്ലെങ്കിൽ “യഹ്‌വേയുടെ യാഗപീഠത്തിനു കൂടാതെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
