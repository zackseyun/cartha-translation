    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്കുകളോടുള്ള ശക്തമായ വ്യവസ്ഥയും വിരുദ്ധഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: טְמֵאָה
  choice: അശുദ്ധം
  rationale: ഭൂമിയെക്കുറിച്ചുള്ള ആചാരപരമോ മതപരമോ ആയ അശുദ്ധതയുടെ സാധ്യത നിലനിർത്തുന്നു; അതിന്റെ കൃത്യസ്വഭാവം വിശദീകരിക്കുന്നില്ല.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: നിങ്ങളുടെ അവകാശഭൂമി
  rationale: אֲחֻזָּה എന്നത് കൈവശഭൂമിയെയോ പാരമ്പര്യസ്വത്തിനെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘യഹ്‌വേയുടെ അവകാശഭൂമി’ എന്ന സമാന്തരപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: עִבְרוּ לָכֶם
  choice: കടന്നുവന്ന്
  rationale: സന്ദർഭത്തിൽ യോർദ്ദാൻ കടക്കുന്നതാണ് സൂചന. മലയാളത്തിൽ അനാവശ്യമായ പ്രതിഫലനപ്രയോഗം ചേർക്കാതെ ആഹ്വാനത്തിന്റെ ദിശയും പ്രവർത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: യഹ്‌വേയുടെ അവകാശഭൂമിയിലേക്ക്
  rationale: ആദ്യത്തെ ‘നിങ്ങളുടെ അവകാശഭൂമി’ എന്ന പ്രയോഗത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: യഹ്‌വേയുടെ തിരുനിവാസം പാർക്കുന്ന
  rationale: שׁכן/מִשְׁכָּן എന്ന പദബന്ധം സൃഷ്ടിക്കുന്ന ‘നിവാസം പാർക്കുന്നു’ എന്ന എബ്രായ പദപ്രതിധ്വനി കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: ഞങ്ങളുടെ ഇടയിൽ അവകാശം നേടിക്കൊള്ളുക
  rationale: വെറും താമസമല്ല, ഭൂമിയിൽ ഒരു അവകാശഭാഗം നേടുന്ന ആശയം മുൻനിർത്തുന്നു; ‘താമസമാക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: യഹ്‌വേയോടു മത്സരിക്കരുത്; ഞങ്ങളോടും മത്സരിക്കരുത്
  rationale: യഹ്‌വേയ്ക്കും പടിഞ്ഞാറൻ ഗോത്രങ്ങൾക്കും എതിരായ മത്സരത്തെ സമാന്തരമായ രണ്ടു വിലക്കുകളായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: നിങ്ങൾക്കായി മറ്റൊരു യാഗപീഠം പണിതുകൊണ്ട്
  rationale: בְּ ചേർന്ന ക്രിയാനാമം സൂചിപ്പിക്കുന്ന മാർഗമോ സാഹചര്യവുമാണ് ‘പണിതുകൊണ്ട്’ പ്രകടിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തമാക്കാൻ ‘മറ്റൊരു’ ചേർത്തിരിക്കുന്നു.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വേയുടെ യാഗപീഠത്തിനു പുറമേ
  rationale: അംഗീകൃത യാഗപീഠത്തിനു പുറത്ത് വേറൊരു യാഗപീഠം സ്ഥാപിക്കുന്നതിലെ വിലക്ക് നിലനിർത്തുന്നു; ‘വേറെയായി/കൂടാതെ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിലുണ്ട്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായ ചതുരക്ഷരനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യോർദ്ദാനക്കരയിലെ ഭൂമിയുടെ അശുദ്ധതയുടെ സ്വഭാവം
  choice: ‘നിങ്ങളുടെ അവകാശഭൂമി അശുദ്ധമാണെങ്കിൽ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി അശുദ്ധതയുടെ കൃത്യസ്വഭാവം നിർവചിക്കാതിരിക്കുക.
  alternative: ആചാരപരമായി മലിനമായ ഭൂമി എന്നോ കേന്ദ്രവിശുദ്ധമന്ദിരത്തിനു പുറത്തായതിനാൽ അനുയോജ്യമല്ലാത്ത ഭൂമി എന്നോ വിശദീകരിക്കുക.
  rationale: എബ്രായവാക്യം അശുദ്ധതയുടെ കാരണം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആചാരപരവും ഭൂമിശാസ്ത്രപരവും വാഗ്വൈഭവപരവുമായ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
- issue: കൂടുതലായി പണിയുന്ന യാഗപീഠത്തിന്റെ സ്ഥാനം
  choice: യഹ്‌വേയുടെ യാഗപീഠത്തിനു പുറമേ മറ്റൊരു യാഗപീഠം പണിയുന്നതിനെ വിലക്കുന്നതായി പരിഭാഷപ്പെടുത്തുക.
  alternative: രണ്ടാമത്തെ ഏതു യാഗപീഠവും സ്വതവേ നിരോധിതമാണെന്നോ, ബലിയർപ്പണത്തിനുള്ള മത്സരയാഗപീഠം മാത്രമാണ് ഉദ്ദേശ്യമെന്നോ വ്യക്തമാക്കുക.
  rationale: വാക്യം അംഗീകൃത യാഗപീഠത്തിനു പുറമേയുള്ള യാഗപീഠത്തെ എതിർക്കുന്നു; എന്നാൽ വിലക്കിന്റെ കൃത്യമായ വ്യാപ്തി ഈ വാക്യം മാത്രം പൂർണമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂസ്വത്തുമായി ബന്ധപ്പെട്ട ആവർത്തനം കാണിക്കാൻ ‘അവകാശഭൂമി/അവകാശം’ നിലനിർത്തി. എബ്രായത്തിലെ തിരുനിവാസം–പാർക്കുക എന്ന പദപ്രതിധ്വനി അല്പം അസാധാരണമായിരുന്നാലും മനസ്സിലാകുന്ന മലയാളത്തിൽ സംരക്ഷിച്ചു. യഹ്‌വേ എന്ന ദൈവനാമം ലിപ്യന്തരിച്ചു.
