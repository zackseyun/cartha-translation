  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: ml
  text: യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയാൻ ഞങ്ങൾ ഞങ്ങൾക്കുവേണ്ടി ഒരു യാഗപീഠം പണിതതെങ്കിൽ, അല്ലെങ്കിൽ അതിന്മേൽ ഹോമയാഗവും ധാന്യയാഗവും അർപ്പിക്കാനോ, അല്ലെങ്കിൽ അതിന്മേൽ സമാധാനയാഗങ്ങൾ[b] അർപ്പിക്കാനോ വേണ്ടിയാണെങ്കിൽ, യഹോവ തന്നേ അതിന്റെ പേരിൽ ഞങ്ങളോടു കണക്കു ചോദിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവ തന്നേ അതിന്റെ പേരിൽ ഞങ്ങളോടു കണക്കു ചോദിക്കും.”'
    reason: ശപഥസന്ദർഭത്തിൽ יְבַקֵּשׁ എന്ന ക്രിയയെ ശാപകമായ ‘ചോദിക്കട്ടെ’ എന്നും ലളിതഭാവിയായ ‘ചോദിക്കും’ എന്നും ഗ്രഹിക്കാം.
  - marker: b
    text: “സമാധാനയാഗങ്ങൾ” എന്നത് “കൂട്ടായ്മയാഗങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: שְׁלָמִים എന്ന യാഗപദം സമാധാനം, ക്ഷേമം, കൂട്ടായ്മ എന്നിവയുമായി ബന്ധപ്പെട്ടതിനാൽ ഈ രണ്ടു പരിഭാഷകളും പ്രചാരത്തിലുണ്ട്.
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: ഞങ്ങൾ ഞങ്ങൾക്കുവേണ്ടി ഒരു യാഗപീഠം പണിതതെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ ശപഥസന്ദർഭത്തിൽ לִבְנוֹת എന്ന infinitive construct വ്യവസ്ഥാസൂചകമായി പ്രവർത്തിക്കുന്നു. לָנוּ എന്നത് ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയാൻ
  rationale: ശാരീരികമായി പിന്നിൽനിന്നു മടങ്ങുക എന്ന ദൃശ്യവും യഹോവയെ പിന്തുടരുന്നത് ഉപേക്ഷിക്കുക എന്ന വിശ്വാസത്യാഗസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: അതിന്മേൽ ഹോമയാഗവും ധാന്യയാഗവും അർപ്പിക്കാനോ
  rationale: הַעֲלוֹת എന്ന യാഗസാങ്കേതിക ക്രിയയ്ക്ക് സ്വാഭാവികമായ ‘അർപ്പിക്കുക’ ഉപയോഗിച്ചു. עוֹלָה, מִנְחָה എന്നിവയ്ക്ക് യഥാക്രമം ‘ഹോമയാഗം’, ‘ധാന്യയാഗം’ എന്നു നൽകി; അവയ്ക്കിടയിലെ וּ സംയോജകത്തെ ‘-വും ... -വും’ ആയി സംരക്ഷിച്ചു.
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: അതിന്മേൽ സമാധാനയാഗങ്ങൾ അർപ്പിക്കാനോ
  rationale: യാഗസന്ദർഭത്തിലെ עָשָׂה മലയാളത്തിൽ സ്വാഭാവികമായി ‘അർപ്പിക്കുക’ എന്നാണ്. זִבְחֵי שְׁלָמִים എന്ന സാങ്കേതിക പദത്തിന് പരമ്പരാഗതവും അർത്ഥസൂചകവുമായ ‘സമാധാനയാഗങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: യഹോവ തന്നേ അതിനു ഞങ്ങളോടു കണക്കു ചോദിക്കട്ടെ
  rationale: הוּאയുടെ ഊന്നൽ ‘തന്നേ’കൊണ്ട് പ്രകടമാക്കി. ശപഥത്തിലെ സ്വയംശാപസ്വരം ‘ചോദിക്കട്ടെ’ നിലനിർത്തുന്നു; בִּקֵּשׁ ഇവിടെ വെറും അന്വേഷണമല്ല, ഉത്തരവാദിത്വം ആവശ്യപ്പെടുക എന്ന അർത്ഥത്തിലാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ദൈവനാമരൂപത്തിൽ നിലനിർത്തി.
- issue: അവസാന ഉപവാക്യത്തിന്റെ ശപഥപരമായ ഭാവം
  choice: യഹോവ തന്നേ അതിനു ഞങ്ങളോടു കണക്കു ചോദിക്കട്ടെ
  alternative: യഹോവ തന്നേ അതിനു ഞങ്ങളോടു കണക്കു ചോദിക്കും
  rationale: സന്ദർഭം സ്വയംശാപം ഉൾക്കൊള്ളുന്ന ശപഥമായതിനാൽ ലളിതമായ ഭാവികാലപ്രസ്താവനയെക്കാൾ ആശംസക/ശാപക ഭാവം യോജിക്കുന്നു; ഭാവികാലവായന സാദ്ധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾ സ്ഥിരതയോടെ ഉപയോഗിച്ചെങ്കിലും എബ്രായ വാക്യഘടനയുടെ അസ്വാഭാവികത മലയാളത്തിലേക്ക് പകർത്തിയിട്ടില്ല. വ്യവസ്ഥാസൂചക ഘടനയും ശപഥത്തിന്റെ തീവ്രതയും സംരക്ഷിച്ചു.
