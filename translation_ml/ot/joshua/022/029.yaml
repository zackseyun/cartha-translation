language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: ml
  text: “യഹോവയ്‌ക്കെതിരെ മത്സരിച്ചും ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞും, ഹോമയാഗത്തിനോ ധാന്യയാഗത്തിനോ ബലിക്കോ വേണ്ടി, അവന്റെ കൂടാരത്തിനു മുമ്പിലുള്ള നമ്മുടെ ദൈവമായ യഹോവയുടെ യാഗപീഠത്തിനു പുറമെ ഒരു യാഗപീഠം പണിയുക എന്നത് ഞങ്ങളിൽനിന്ന് അകന്നിരിക്കട്ടെ!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: ചെയ്യുന്നത് ഞങ്ങളിൽനിന്ന് അകന്നിരിക്കട്ടെ … ഞങ്ങൾക്ക് ഒരിക്കലും ഇടവരരുത്
  rationale: കടുത്ത നിരാകരണവും വെറുപ്പും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ദീർഘഘടനയിൽ അതിന്റെ ഊന്നൽ അവസാനത്തിലും വ്യക്തമാക്കുന്നു.
- source_word: לִמְרֹד בַּיהוָה
  choice: യഹോവയ്ക്കെതിരെ മത്സരിക്കുക
  rationale: מרד എന്ന ക്രിയ ദൈവത്തിനെതിരായ ഉടമ്പടിപരമായ ധിക്കാരത്തെയും കലാപത്തെയും സൂചിപ്പിക്കുന്നു; ב ഇവിടെ പ്രതികൂലബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയുക
  rationale: ‘പിന്നാലെനിന്ന് മടങ്ങുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അനുഗമനം ഉപേക്ഷിക്കുന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: മറ്റൊരു യാഗപീഠം … പണിയുക
  rationale: നിലവിലുള്ള അംഗീകൃത യാഗപീഠത്തിനു പുറമേ ആരാധനയ്ക്കായി വേറൊരു പീഠം പണിയുന്നതാണ് നിരാകരിക്കപ്പെടുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: לְעֹלָה לְמִנְחָה וּלְזָבַח
  choice: ഹോമയാഗമോ ധാന്യയാഗമോ ബലിയോ അർപ്പിക്കാൻ
  rationale: עֹלָה, מִנְחָה എന്നിവയുടെ സാങ്കേതിക യാഗാർഥങ്ങൾ നിലനിർത്തുന്നു; זֶבַח വ്യക്തമാക്കിയിട്ടില്ലാത്ത പൊതുവായ ബലിയായതിനാൽ അതിനെ പ്രത്യേക ഉപവിഭാഗമായി ചുരുക്കുന്നില്ല.
- source_word: מִלְּבַד מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവയുടെ … യാഗപീഠമല്ലാതെ മറ്റൊരു യാഗപീഠം
  rationale: അംഗീകൃത യാഗപീഠത്തെ ഒഴിച്ചുള്ള മറ്റേതൊരു പീഠത്തെയും നിരാകരിക്കുന്ന מִלְּבַד എന്നതിന്റെ ഒഴിവാക്കൽ/വ്യത്യാസ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: കൂടാരത്തിനു മുമ്പിലുള്ള
  rationale: מִשְׁכָּן എന്നത് ഈ വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ ദൈവസാന്നിധ്യത്തിന്റെ കൂടാരമാണ്; לִפְנֵי എന്ന സ്ഥലബന്ധം ‘മുമ്പിലുള്ള’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: പുതിയ യാഗപീഠം പണിയുന്നതിന്റെ ഉദ്ദേശ്യം
  choice: യാഗങ്ങൾ അർപ്പിക്കാനുള്ള മറ്റൊരു യാഗപീഠം പണിയുന്നതാണ് നിരാകരിക്കുന്നത്
  alternative: ഏതു സ്മാരകയാഗപീഠവും പണിയുന്നത് നിരാകരിക്കുന്നു
  rationale: വാക്യം പ്രത്യേകിച്ച് ഹോമയാഗം, ധാന്യയാഗം, ബലി എന്നിവയ്ക്കായുള്ള പീഠത്തെക്കുറിച്ചാണ് പറയുന്നത്; സാക്ഷ്യചിഹ്നമായ പീഠത്തെ തന്നെ കുറ്റപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള പ്രസംഗശൈലി ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യത്തിന്റെ ശക്തമായ നിരാകരണം മലയാളത്തിൽ വ്യക്തമായി കേൾക്കാൻ ആരംഭത്തിലും അവസാനത്തിലും ഊന്നൽ ക്രമപ്പെടുത്തി; യാഗസംബന്ധമായ സാങ്കേതിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തി.
