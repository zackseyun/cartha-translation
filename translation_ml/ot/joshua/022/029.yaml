revisions:
- from: “യഹോവയ്ക്കെതിരെ മത്സരിക്കുകയോ ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയുകയോ[a] ചെയ്യുന്നത് ഞങ്ങളിൽനിന്ന് അകന്നിരിക്കട്ടെ! നമ്മുടെ ദൈവമായ യഹോവയുടെ കൂടാരത്തിനു മുമ്പിലുള്ള യാഗപീഠമല്ലാതെ മറ്റൊരു യാഗപീഠം ഹോമയാഗമോ ധാന്യയാഗമോ ബലിയോ അർപ്പിക്കാൻ പണിയുന്നത് ഞങ്ങൾക്ക് ഒരിക്കലും ഇടവരരുത്!”
  to: “യഹോവയ്‌ക്കെതിരെ മത്സരിച്ചും ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞും, ഹോമയാഗത്തിനോ ധാന്യയാഗത്തിനോ ബലിക്കോ വേണ്ടി, അവന്റെ കൂടാരത്തിനു മുമ്പിലുള്ള നമ്മുടെ ദൈവമായ യഹോവയുടെ യാഗപീഠത്തിനു പുറമെ ഒരു യാഗപീഠം പണിയുക എന്നത് ഞങ്ങളിൽനിന്ന് അകന്നിരിക്കട്ടെ!”
  rationale: The revision restores 'his tabernacle,' retains the source's three offering categories and its contrast with Yahweh's authorized altar, and expresses the initial strong repudiation once in natural Malayalam. The footnote remains anchored to 'യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞും' and preserves the literal Hebrew imagery.
