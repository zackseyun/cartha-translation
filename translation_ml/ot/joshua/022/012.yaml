  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] അതു കേട്ടപ്പോൾ, അവർക്കെതിരേ യുദ്ധത്തിനു പുറപ്പെടാൻ ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും ശീലോവിൽ ഒന്നിച്ചുകൂടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവർക്കെതിരേ യുദ്ധത്തിനായി കയറിച്ചെല്ലാൻ’; സൈനിക നടപടിക്കുള്ള ഒരു പതിവുപ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: അതു കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു. ക്രിയയുടെ കർമം എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻസന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു; വാക്യത്തിലെ രണ്ടു occurrences-ലും ഒരേ രൂപം പാലിക്കുന്നു.
- source_word: וַיִּקָּהֲלוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: קהל എന്ന ക്രിയയിലെ സംഘടിതമായി സമ്മേളിക്കുക എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും
  rationale: עֵדָה സൂചിപ്പിക്കുന്ന സമുദായപരമായ കൂട്ടായ്മയും כָּל നൽകുന്ന സമഗ്രതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שִׁלֹה
  choice: ശീലോ
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു; വിഭക്തിയോടുകൂടെ മുഖ്യപാഠത്തിൽ ‘ശീലോവിൽ’ എന്നാണ്.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: അവർക്കെതിരേ യുദ്ധത്തിനു പുറപ്പെടാൻ
  rationale: അക്ഷരാർഥത്തിലെ ‘അവർക്കെതിരേ കയറിച്ചെല്ലുക’ എന്ന സൈനിക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആക്രമണോദ്ദേശം മയപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: യോർദ്ദാന്റെ കിഴക്കുള്ള ഗോത്രങ്ങൾക്കെതിരായ സമൂഹത്തിന്റെ സൈനിക ഉദ്ദേശ്യം
  choice: ‘അവർക്കെതിരേ യുദ്ധത്തിനു പുറപ്പെടാൻ’ എന്ന് വ്യക്തമായി നിലനിർത്തി
  alternative: ‘അവരുമായി സംസാരിക്കാൻ/അവരെ നേരിടാൻ’ എന്നപോലെ ഉദ്ദേശ്യം മയപ്പെടുത്തുക
  rationale: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא സൈനിക നടപടിയെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള സംഭവങ്ങൾ കണക്കിലെടുത്ത് ഈ ഘട്ടത്തിലെ സംഘർഷം മുൻകൂട്ടി ലഘൂകരിക്കരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സമൂഹം മുഴുവനും’ എന്നത് ഔപചാരിക കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്നു; ‘യുദ്ധത്തിനു പുറപ്പെടാൻ’ എന്നത് എബ്രായ സൈനിക പ്രയോഗത്തെ വാക്കിന് വാക്കായി അനുകരിക്കാതെ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
