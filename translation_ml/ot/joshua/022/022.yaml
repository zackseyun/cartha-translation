id: JOS.22.22
reference: Joshua 22:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: ml
  text: 'ശക്തനായവനേ[a], ദൈവമേ, യഹ്‌വേ! ശക്തനായവനേ, ദൈവമേ, യഹ്‌വേ! അവിടുന്ന് അറിയുന്നു; ഇസ്രായേൽതന്നെ അറിയും: ഞങ്ങൾ കലാപത്തിലോ യഹ്‌വേയ്ക്കെതിരായ അവിശ്വസ്തതയിലോ പ്രവർത്തിച്ചതാണെങ്കിൽ, ഇന്ന് ഞങ്ങളെ രക്ഷിക്കരുതേ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ ദൈവിക ആഹ്വാനം രണ്ടുതവണ ആവർത്തിക്കുന്നു: “ഏൽ, എലോഹീം, യഹ്‌വേ; ഏൽ, എലോഹീം, യഹ്‌വേ.” ഇത് സത്യപ്രതിജ്ഞാസദൃശമായ ശക്തമായ ഊന്നൽ നൽകുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: ശക്തനായവനേ, ദൈവമേ, യഹ്‌വേ
  rationale: אֵל എന്ന ഏകവചന ദൈവിക വിശേഷണത്തിന്റെ ശക്തി ‘ശക്തനായവൻ’ എന്നു നിലനിർത്തുകയും, തുടർന്നുള്ള אֱלֹהִים എന്നതിൽ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിലെ സംബോധനാരൂപങ്ങൾ ഈ ഗൗരവമുള്ള ദൈവാഹ്വാനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ആവർത്തനം അതേപടി സൂക്ഷിച്ചിരിക്കുന്നു.
- source_word: הוּא יֹדֵעַ
  choice: അവിടുന്ന് അറിയുന്നു
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ഏകവചന സർവനാമവും വർത്തമാനകാല ജ്ഞാനപ്രകടനവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: ഇസ്രായേൽതന്നെയും അറിയും
  rationale: הוּא നൽകുന്ന ഊന്നൽ ‘തന്നെയും’ മുഖേന സൂക്ഷിക്കുന്നു; അപൂർണ്ണക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവികാല അർഥം ‘അറിയും’ എന്നു നൽകുന്നു.
- source_word: אִם בְּמֶרֶד
  choice: അതു കലാപംമൂലമോ ... ആയിരുന്നെങ്കിൽ
  rationale: מֶרֶד എന്നത് കലാപം അഥവാ മത്സരിക്കൽ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ സംക്ഷിപ്തമായ നിബന്ധന മലയാളത്തിൽ വായിക്കാവുന്ന വിധം ‘അതു ... ആയിരുന്നെങ്കിൽ’ എന്നു നൽകിയെങ്കിലും പ്രവൃത്തിയുടെ സ്വഭാവം കൂടുതൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: וְאִם בְּמַעַל
  choice: അവിശ്വസ്തതമൂലമോ
  rationale: מַעַל വിശ്വാസലംഘനത്തെയും ഉടമ്പടിസംബന്ധമായ അവിശ്വസ്തതയെയും സൂചിപ്പിക്കുന്നു. ‘അവിശ്വസ്തത’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בַּיהוָה
  choice: യഹ്‌വേയ്ക്കെതിരായ
  rationale: കലാപത്തിന്റെയും അവിശ്വസ്തതയുടെയും സന്ദർഭത്തിൽ בְ എന്ന ബന്ധത്തെ പ്രതികൂലമായ ‘എതിരായ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: ഞങ്ങളെ രക്ഷിക്കരുതേ
  rationale: ישׁע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും אַל ചേർന്ന നിഷേധാത്മക അഭ്യർഥനയും ഗൗരവമുള്ള മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്നു
  rationale: ‘ഈ ദിവസം’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ഇന്നു’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ അടുത്ത ശബ്ദരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ആവർത്തിച്ച ദൈവിക നാമശ്രേണിയുടെ പ്രാബല്യം
  choice: മുഴുവൻ ആഹ്വാനവും രണ്ടുതവണ ആവർത്തിച്ചു
  alternative: ഒറ്റ സംയുക്ത ദൈവിക പദവിയായി ചുരുക്കുക
  rationale: ഹീബ്രുവിലെ ആവർത്തനം സത്യപ്രതിജ്ഞാസദൃശമായ ഗൗരവവും ഊന്നലും സൃഷ്ടിക്കുന്നു; അതിന്റെ കൃത്യമായ ആചാരപരമായ അർഥം നിർണ്ണയിക്കാതെ വാചകഘടന സംരക്ഷിക്കുന്നു.
- issue: അവസാന നിഷേധാത്മക അഭ്യർഥനയുടെ അഭിസംബോധന
  choice: ദൈവത്തോടുള്ള ‘ഞങ്ങളെ രക്ഷിക്കരുതേ’ എന്ന അപേക്ഷയായി നിലനിർത്തി
  alternative: ഇസ്രായേലിനോടുള്ള അപേക്ഷയായി വ്യാഖ്യാനിക്കുക
  rationale: രണ്ടാം പുരുഷ ഏകവചന ക്രിയയും മുൻപുള്ള ദൈവാഹ്വാനവും ദൈവത്തോടുള്ള അഭിസംബോധനയെ പിന്തുണയ്ക്കുന്നു; വാക്യത്തിന്റെ കഠിനമായ സത്യപ്രതിജ്ഞാസ്വഭാവം മയപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള സംബോധനാരൂപങ്ങളും ലളിതമായ വാക്യഘടനയും ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തനം, ഊന്നൽ, സംക്ഷിപ്തമായ നിബന്ധന, കഠിനമായ നിഷേധാത്മക അപേക്ഷ എന്നിവ പരമാവധി നിലനിർത്തി.
