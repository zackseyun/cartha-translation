source:
  edition: WLC
  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: ml
  text: നിങ്ങൾ ഇത്രയും നാളുകളായി, ഇന്നുവരെ നിങ്ങളുടെ സഹോദരന്മാരെ ഉപേക്ഷിച്ചിട്ടില്ല; നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ കല്പന പാലിക്കാനുള്ള ചുമതല നിങ്ങൾ പാലിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ സഹ ഇസ്രായേല്യരെ.” എബ്രായപദം അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ഇവിടെ അത് ഇസ്രായേൽജനത്തിലെ സഹാംഗങ്ങളെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: ഉപേക്ഷിച്ചിട്ടില്ല
  rationale: עזב എന്ന ക്രിയയുടെ ‘വിട്ടുകളയുക, ഉപേക്ഷിക്കുക’ എന്ന ബന്ധപരമായ ഗൗരവം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാരെ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനമായ ‘നിങ്ങളുടെ സഹോദരന്മാർ’ എന്ന ബന്ധപദം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ അത് സഹയിസ്രായേല്യരെ വിശാലമായി സൂചിപ്പിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: זֶה יָמִים רַבִּים
  choice: ഈ ദീർഘകാലമൊക്കെയും
  rationale: ‘അനേകം ദിവസങ്ങളായുള്ള ഈ കാലം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദീർഘകാല തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: ഭൂതകാലംമുതൽ ഇപ്പോഴത്തെ ദിവസംവരെയുള്ള തുടർച്ച സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וּשְׁמַרְתֶּם
  choice: നിങ്ങൾ പാലിച്ചിരിക്കുന്നു
  rationale: שׁמר ഇവിടെ ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം വിശ്വസ്തമായി ആചരിച്ചതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പാലിക്കുക’ അനുയോജ്യമാണ്.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: കല്പന ഏല്പിച്ച കടമ
  rationale: ‘കല്പനയുടെ കാവൽ/ചുമതല’ എന്ന ഘടനയെ അസ്വാഭാവികമായ പദാനുപദരൂപത്തിൽ നൽകാതെ, കല്പനയിൽനിന്ന് ഉത്ഭവിക്കുന്ന ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: ഉടമ്പടിബന്ധം വ്യക്തമാക്കുന്ന ‘നിങ്ങളുടെ ദൈവം’ എന്ന അഭിസംബോധന ദൈവനാമത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളഘടനയിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തിൽ പൂർണനിശ്ചയമില്ലാത്തതിനാൽ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ ഉപയോഗിക്കുന്നു; ‘യാഹ്‌വേ’ സാധ്യമായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: אֲחֵיכֶם എന്ന പുല്ലിംഗ ബന്ധപദത്തിന്റെ പരിധി
  choice: നിങ്ങളുടെ സഹോദരന്മാരെ
  alternative: നിങ്ങളുടെ സഹയിസ്രായേല്യരെ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചന ബന്ധപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ഉടമ്പടിജനത്തിലെ സഹാംഗങ്ങളെ വിശാലമായി സൂചിപ്പിക്കാമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ദീർഘകാല വിശ്വസ്തതയും ഏല്പിക്കപ്പെട്ട കടമ പാലിച്ചതുമെന്ന ആശയങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
