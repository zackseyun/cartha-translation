- from: പെയോരിലെ[b] അകൃത്യം നമുക്കു പോരാഞ്ഞോ[a]—അതിൽനിന്ന് ഇന്നുവരെ നാം നമ്മെത്തന്നെ ശുദ്ധീകരിച്ചിട്ടില്ല, യഹോവയുടെ സമൂഹത്തിന്മേൽ ബാധയും വന്നു?
