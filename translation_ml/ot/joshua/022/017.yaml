id: JOS.22.17
reference: Joshua 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: ml
  text: പെയോരിലെ[b] അകൃത്യം നമുക്കു പോരാഞ്ഞോ[a]—അതിൽനിന്ന് നാം ഇന്നുവരെ നമ്മെത്തന്നെ ശുദ്ധീകരിച്ചിട്ടില്ല; യഹോവയുടെ സമൂഹത്തിൽ ബാധയുണ്ടായി?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പെയോരിലെ കുറ്റം നമുക്കു പോരാഞ്ഞോ?’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ עָוֹן എന്ന പദത്തിന് ‘അകൃത്യം’, ‘കുറ്റം’, ചിലപ്പോൾ കുറ്റത്തിന്റെ പരിണതഫലം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായമൂലത്തിൽ ‘പെയോർ’ എന്നു മാത്രമാണ്; ബന്ധപ്പെട്ട മറ്റു ഭാഗങ്ങളിൽ ‘ബാൽ-പെയോർ’ എന്ന പൂർണരൂപം കാണാം.
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: നമുക്കു പോരാഞ്ഞോ
  rationale: ‘ഇത് നമുക്കു വളരെ ചെറിയ കാര്യമാണോ/പോരാഞ്ഞോ?’ എന്ന ശാസനാത്മക ചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֲוֺן
  choice: അകൃത്യം
  rationale: പാപപ്രവൃത്തിയെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാവുന്ന പദമാണിത്; മുഖ്യപാഠത്തിൽ ധാർമിക ഗൗരവം നിലനിർത്തുകയും ‘കുറ്റം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: פְּעוֹר
  choice: പെയോർ
  rationale: മൂലപാഠത്തിൽ ‘ബാൽ-പെയോർ’ എന്ന പൂർണരൂപമല്ല, ‘പെയോർ’ എന്നു മാത്രമായതിനാൽ അതുതന്നെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: അതിൽനിന്ന് ... നാം നമ്മെത്തന്നെ ശുദ്ധീകരിച്ചിട്ടില്ല
  rationale: ഹിത്പയേൽ രൂപത്തിലെ ആത്മനിഷ്ഠ അർഥം ‘നമ്മെത്തന്നെ’ എന്നതിലൂടെ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: സംസാരിക്കുന്ന കാലംവരെ അവസ്ഥ തുടരുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപം.
- source_word: וַיְהִי הַנֶּגֶף
  choice: ബാധയും വന്നു
  rationale: ചരിത്രസംഭവമായി ഉണ്ടായ ദൈവിക ശിക്ഷയെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്നിട്ടും’ പോലുള്ള വൈരുധ്യസൂചകം ചേർത്തിട്ടില്ല.
- source_word: בַּעֲדַת יְהוָה
  choice: യഹോവയുടെ സമൂഹത്തിന്മേൽ
  rationale: עֵדָה എന്നത് ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ബാധ സമൂഹത്തെ ആക്രമിച്ചതെന്ന ആശയം ‘മേൽ’ വ്യക്തമാക്കുന്നു. ദൈവനാമം യഹോവ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: עֲוֺן എന്ന പദത്തിലെ പാപം–കുറ്റബാധ്യത അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘അകൃത്യം’
  alternative: ‘കുറ്റം’
  rationale: സംഭവത്തിലെ പാപത്തിന്റെ ധാർമിക ഗൗരവം ‘അകൃത്യം’ നന്നായി വഹിക്കുന്നു; എന്നാൽ എബ്രായപദത്തിനുള്ള കുറ്റബാധ്യതയുടെ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി പ്രതിനിധീകരിക്കുന്നു.
- issue: ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: വാക്യത്തിന്റെ അവസാനംവരെ ശാസനാത്മക ചോദ്യമായി അവതരിപ്പിച്ചു
  alternative: ആദ്യ ഉപവാക്യം മാത്രം ചോദ്യമാക്കി ശേഷിച്ചത് പ്രസ്താവനകളാക്കുക
  rationale: വാക്യാരംഭത്തിലെ ചോദ്യം തുടർന്നുള്ള ബന്ധവാക്യത്തെയും ബാധയെക്കുറിച്ചുള്ള ഓർമ്മപ്പെടുത്തലിനെയും വാഗ്വൈഭവപരമായി ഉൾക്കൊള്ളാമെന്ന വായന സംരക്ഷിക്കുന്നു; ദീർഘരേഖ ഉപവാക്യബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. ശാസനാത്മക ചോദ്യത്തിന്റെ മൂർച്ച നിലനിർത്താൻ ‘പോരാഞ്ഞോ’ ഉപയോഗിച്ചു. ‘സമൂഹം’, ‘ബാധ’, ‘ശുദ്ധീകരിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്നതിനൊപ്പം വാക്യത്തിന്റെ ഉടമ്പടി-ആരാധനാപരമായ ഭാവവും സൂക്ഷിക്കുന്നു.
