source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: ml
  text: ഈ കാര്യം യിസ്രായേൽമക്കൾക്ക് സ്വീകാര്യമായി[a]. യിസ്രായേൽമക്കൾ ദൈവത്തെ വാഴ്ത്തി[b]. രൂബേൻമക്കളും ഗാദ്മക്കളും പാർത്തിരുന്ന ദേശം നശിപ്പിക്കാനായി അവരുടെ നേരെ യുദ്ധത്തിനു പുറപ്പെടണമെന്ന് അവർ പറഞ്ഞില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഈ കാര്യം യിസ്രായേൽമക്കളുടെ കണ്ണുകളിൽ നല്ലതായിരുന്നു.”'
    reason: മൂലത്തിലെ വിലയിരുത്തൽശൈലിയും ദൃശ്യരൂപവും വ്യക്തമാക്കാൻ.
  - marker: b
    text: 'അക്ഷരാർഥം: “ദൈവത്തെ അനുഗ്രഹിച്ചു.” ഇവിടെ അതിന്റെ അർഥം ദൈവത്തെ വാഴ്ത്തി എന്നാണ്.'
    reason: ברך എന്ന മൂലക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭാർഥവും ഒരുമിച്ച് സൂക്ഷിക്കാൻ.
  - marker: c
    text: 'അക്ഷരാർഥം: “അവരുടെ നേരെ യുദ്ധത്തിനു പുറപ്പെടാൻ പറഞ്ഞില്ല.”'
    reason: മൂലത്തിലെ ‘പറഞ്ഞില്ല’ എന്ന ഘടനയും അതിനോടു ചേർന്ന ക്രിയാരൂപവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: ഈ കാര്യം ... സ്വീകാര്യമായി
  rationale: ‘ഈ കാര്യം അവരുടെ കണ്ണുകളിൽ നല്ലതായിരുന്നു’ എന്ന എബ്രായ വിലയിരുത്തൽശൈലിയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുൻവാക്യങ്ങളിലെ വിശദീകരണത്തെയാണ് ‘കാര്യം’ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കൂട്ടനാമത്തെ മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: ദൈവത്തെ വാഴ്ത്തി
  rationale: ദൈവം കർമമായിരിക്കുമ്പോൾ ברך എന്ന ക്രിയയ്ക്ക് ഇവിടെ ദൈവത്തെ സ്തുതിക്കുക/വാഴ്ത്തുക എന്ന അർഥമാണ്; ‘ദൈവത്തെ അനുഗ്രഹിച്ചു’ എന്ന അക്ഷരരൂപത്തേക്കാൾ മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא אָמְרוּ
  choice: അവർ പറഞ്ഞില്ല
  rationale: എബ്രായത്തിലെ ലളിതമായ ‘പറഞ്ഞില്ല’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ആലോചിച്ചില്ല, തീരുമാനിച്ചില്ല തുടങ്ങിയ അധിക വ്യാഖ്യാനങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: അവരുടെ നേരെ യുദ്ധത്തിനു പുറപ്പെടുക
  rationale: עלה על എന്ന സൈനിക മുന്നേറ്റപ്രയോഗത്തിലെ ചലനചിത്രവും യുദ്ധസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: ദേശം നശിപ്പിക്കേണ്ടതിന്
  rationale: שׁחת എന്ന ശക്തമായ നാശാർഥവും אֶרֶץ എന്ന പ്രദേശസൂചനയും നേരിട്ട് നൽകുന്നു.
- source_word: יֹשְׁבִים בָּהּ
  choice: പാർത്തിരുന്ന
  rationale: പങ്കാളിവിനയുടെ തുടർച്ചയായ വാസസ്ഥിതിയെ സന്ദർഭോചിതമായ മലയാള ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യർ ദൈവത്തെ ‘അനുഗ്രഹിക്കുന്നു’ എന്ന പ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘ദൈവത്തെ വാഴ്ത്തി’
  alternative: ‘ദൈവത്തെ അനുഗ്രഹിച്ചു’
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാനാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുമ്പോൾ, ദൈവം കർമമായിരിക്കുന്ന ഈ സന്ദർഭത്തിലെ യഥാർഥ പ്രയോഗാർഥം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുന്നു; പ്രത്യേക മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യിസ്രായേൽമക്കൾ,’ ‘രൂബേൻമക്കൾ,’ ‘ഗാദ്മക്കൾ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ കൂട്ടനാമബന്ധം നിലനിർത്തുന്നു. എബ്രായ ശൈലി അനാവശ്യമായി കടുപ്പിക്കാതെ അതിലെ പ്രധാന ചിത്രങ്ങളും അർഥഭേദങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
