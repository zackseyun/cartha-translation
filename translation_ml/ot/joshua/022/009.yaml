base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: ml
  text: അങ്ങനെ രൂബേൻമക്കളും ഗാദ്മക്കളും മനശ്ശെയുടെ പാതിഗോത്രവും കനാൻദേശത്തുള്ള ശീലോവിൽ നിന്ന് ഇസ്രായേൽമക്കളെ വിട്ട് മടങ്ങി പുറപ്പെട്ടു; യഹോവ മോശെ മുഖാന്തരം കല്പിച്ചതനുസരിച്ച് അവർക്ക് അവകാശമായി ലഭിച്ചിരുന്ന ഗിലെയാദ് ദേശത്തേക്കു പോകാനായിരുന്നു അത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ കൈവശമാക്കിയിരുന്ന.” എബ്രായ ക്രിയ അവർക്ക് ഭൂമി അവകാശമായി ലഭിച്ചതിനെയോ അതിൽ സ്ഥാപിതരായി കൈവശം വച്ചതിനെയോ, സന്ദർഭാനുസരണം കൈവശപ്പെടുത്തുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻבוּ וַיֵּלְכוּ
  choice: മടങ്ങിപ്പോകാൻ യാത്രയായി
  rationale: שוב എന്നതിന്റെ മടക്കദിശയും הלך എന്നതിന്റെ യാത്ര/പുറപ്പെടൽ ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: രൂബേൻമക്കളും ഗാദ്മക്കളും മനശ്ശെയുടെ പാതിഗോത്രവും
  rationale: വംശീയ-ഗോത്രപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെ വിട്ട്
  rationale: מֵאֵת സൂചിപ്പിക്കുന്ന വേർപാടിനെ വ്യക്തമായി നൽകുന്നു; ഇവിടെ 'മക്കൾ' എന്ന ബൈബിൾപരമായ ഗോത്രസമൂഹപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുള്ള ശീലോവിൽവെച്ച്
  rationale: സ്ഥലപരമായ ബന്ധം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു; അർഥത്തിൽ ഒന്നും നഷ്ടപ്പെടുന്നില്ല.
- source_word: אֶל אֶרֶץ הַגִּלְעָד אֶל אֶרֶץ אֲחֻזָּתָם
  choice: അവരുടെ അവകാശഭൂമിയായ ഗിലെയാദ് ദേശത്തേക്ക്
  rationale: ആവർത്തിച്ചുള്ള אֶל אֶרֶץ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ ഏകീകരിക്കുമ്പോഴും ഗിലെയാദ് അവരുടെ നിയമപരമായ ഭൂവുടമസ്ഥതയാണെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: അവർ കൈവശമാക്കിയിരുന്ന
  rationale: אחז എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ഭൂമി സ്വന്തമായി ലഭിച്ചു കൈവശംവെക്കുക എന്ന ഫലാവസ്ഥയെയോ കൈവശപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠം സാധാരണ മലയാളത്തിൽ രണ്ടാമത്തെ ഭാവം നൽകുന്നു, പാദക്കുറിപ്പ് മറ്റൊരു സാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: עַל פִּי יְהוָה בְּיַד מֹשֶׁה
  choice: യഹോവ മോശ മുഖാന്തരം കല്പിച്ചതനുസരിച്ച്
  rationale: עַל־פִּי എന്ന കല്പനാഭാവവും בְּיַד എന്ന മധ്യസ്ഥത/മുഖാന്തരത്വവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ നിയമനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ 'യഹോവ' എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: ഭൂമി കൈവശമായ രീതിയെ സൂചിപ്പിക്കുന്ന נֹאחֲזוּ എന്ന നിഫാൽ രൂപം
  choice: അവർ കൈവശമാക്കിയിരുന്ന
  alternative: അവർക്ക് അവകാശമായി ലഭിച്ചിരുന്ന
  rationale: ക്രിയയ്ക്ക് കൈവശപ്പെടുത്തൽ, കൈവശം ലഭിക്കൽ/അതിൽ സ്ഥാപിക്കപ്പെടൽ എന്നീ ഭാവങ്ങൾ ഉണ്ടാകാം. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായൊരു അർഥം നൽകി മറ്റേ സാധ്യത പാദക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു; ദൈവികദാനവും മനുഷ്യകൈവശപ്പെടുത്തലും തമ്മിലുള്ള പാഠത്തിലെ ഭാവവ്യത്യാസം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗോത്രനാമങ്ങളിലും ഭൂമിയവകാശവുമായി ബന്ധപ്പെട്ട പദങ്ങളിലും ബൈബിൾപരമായ ഔപചാരികത നിലനിർത്തിയിട്ടുണ്ട്; എബ്രായ വാക്യഘടനയുടെ അനാവശ്യ കാഠിന്യം ഒഴിവാക്കി.
