source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: ml
  text: 'അപ്പോൾ ഞങ്ങൾ പറഞ്ഞു: “ഭാവിയിൽ അവർ ഞങ്ങളോടും ഞങ്ങളുടെ വരുംതലമുറകളോടും ഇങ്ങനെ പറഞ്ഞാൽ, ഞങ്ങൾ പറയും: ‘ഞങ്ങളുടെ പിതാക്കന്മാർ ഉണ്ടാക്കിയ യഹ്‌വെയുടെ യാഗപീഠത്തിന്റെ മാതൃക[a] നോക്കൂ. അത് ഹോമയാഗത്തിനുവേണ്ടിയല്ല, ബലിക്കുവേണ്ടിയുമല്ല; മറിച്ച്, അത് ഞങ്ങൾക്കും നിങ്ങൾക്കും മധ്യേ ഒരു സാക്ഷിയാണ്.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാതൃക’ എന്നതിന് ‘പകർപ്പ്,’ ‘രൂപം,’ അല്ലെങ്കിൽ ‘പ്രതിരൂപം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു പദം ഒരു രൂപത്തെയോ മാതൃകയെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ഇത് യാഗാർപ്പണത്തിനുവേണ്ടിയല്ല, മറിച്ച് സാക്ഷ്യമായി നിലകൊള്ളുന്ന ഒരു പ്രതിരൂപമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: അതുകൊണ്ട് ഞങ്ങൾ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനൊപ്പം സന്ദർഭത്തിലെ വിശദീകരണബന്ധവും സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהָיָה כִּי
  choice: …പറഞ്ഞാൽ
  rationale: ഭാവിയിൽ സംഭവിക്കാവുന്ന ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപത്തിൽ നൽകി.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: ഭാവിയിൽ അവർ ഞങ്ങളോടോ ഞങ്ങളുടെ വരുംതലമുറകളോടോ
  rationale: מָחָר ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘നാളെ’ എന്നതിലുപരി ഭാവികാലത്തെ സൂചിപ്പിക്കുന്നു. דֹּרֹת എന്നതിന്റെ തലമുറ എന്ന ആശയം നിലനിർത്തി.
- source_word: תַּבְנִית
  choice: മാതൃക
  rationale: രൂപം, മാതൃക, പകർപ്പ് എന്നീ അർഥസാധ്യതകളുള്ള പദം; ഇവിടെ യാഗാർപ്പണത്തിനുള്ള അംഗീകൃത പീഠമല്ല, സാക്ഷ്യമായി നിർമിച്ച അതിന്റെ പ്രതിനിധിരൂപമാണെന്ന സന്ദർഭത്തിന് ‘മാതൃക’ യോജിക്കുന്നു.
- source_word: מִזְבַּח יְהוָה
  choice: യഹ്‌വെയുടെ യാഗപീഠം
  rationale: സംബന്ധനിർമാണം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ദൈവനാമം പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- source_word: אֲבוֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ കുടുംബപദം നിലനിർത്തുന്നു; പൊതുവായ ‘പൂർവികർ’ എന്നാക്കി സമതലപ്പെടുത്തുന്നില്ല.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: ഹോമയാഗത്തിനുവേണ്ടിയല്ല, ബലിക്കുവേണ്ടിയുമല്ല
  rationale: עֹלָה എന്ന പ്രത്യേക ഹോമയാഗവും זֶבַח എന്ന വിശാലമായ ബലിയും വേർതിരിക്കുന്നു; ആവർത്തിച്ച നിഷേധത്തിന്റെ ഊന്നൽ ‘അല്ല…വേണ്ടിയുമല്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: כִּי עֵד הוּא
  choice: എന്നാൽ അത് … ഒരു സാക്ഷിയാണ്
  rationale: മുൻപുള്ള നിഷേധങ്ങൾക്ക് വിരുദ്ധമായി യാഗപീഠത്തിന്റെ യഥാർഥ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; הוּא എന്ന സർവനാമവും നാമവാക്യത്തിന്റെ ഘടനയും നിലനിർത്തി.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: ഞങ്ങൾക്കും നിങ്ങൾക്കും മധ്യേ
  rationale: രണ്ടു കൂട്ടർക്കുമിടയിലെ സാക്ഷ്യം എന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ഹീബ്രുവിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു. ‘യഹ്‌വെ’ ആധുനിക പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ അടുത്തായി പ്രതിനിധീകരിക്കുന്നു.
- issue: אֲבוֹתֵינוּ എന്ന ലിംഗസൂചക ബന്ധുപദം
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർ
  alternative: ഞങ്ങളുടെ പൂർവികർ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: പ്രതിയാഗപീഠത്തിന്റെ ഉദ്ദേശ്യം
  choice: യാഗത്തിനല്ല, സാക്ഷിയായി
  alternative: നിയമാനുസൃതമായ മറ്റൊരു യാഗപീഠം
  rationale: ഇരട്ട നിഷേധവും עֵד എന്ന പദവും അതിനെ യാഗാർപ്പണത്തിനുള്ള പീഠമല്ല, രണ്ടു വിഭാഗങ്ങൾക്കിടയിലെ സാക്ഷ്യമാണെന്ന് വ്യക്തമാക്കുന്നു; ഇതിലപ്പുറം ഒരു മതവിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തി. ‘ഹോമയാഗം,’ ‘ബലി,’ ‘യാഗപീഠം,’ ‘സാക്ഷി’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
