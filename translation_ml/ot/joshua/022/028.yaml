  to: 'അപ്പോൾ ഞങ്ങൾ പറഞ്ഞു: “ഭാവിയിൽ അവർ ഞങ്ങളോടും ഞങ്ങളുടെ വരുംതലമുറകളോടും ഇങ്ങനെ പറഞ്ഞാൽ, ഞങ്ങൾ പറയും: ‘ഞങ്ങളുടെ പിതാക്കന്മാർ ഉണ്ടാക്കിയ യഹ്‌വെയുടെ യാഗപീഠത്തിന്റെ മാതൃക[a] നോക്കൂ. അത് ഹോമയാഗത്തിനുവേണ്ടിയല്ല, ബലിക്കുവേണ്ടിയുമല്ല; മറിച്ച്, അത് ഞങ്ങൾക്കും നിങ്ങൾക്കും മധ്യേ ഒരു സാക്ഷിയാണ്.’”'
