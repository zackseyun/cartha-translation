source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: ml
  text: 'എന്നാൽ, യഹോവയുടെ ദാസനായ മോശെ നിങ്ങളോടു കല്പിച്ച കല്പനയും ന്യായപ്രമാണവും അനുഷ്ഠിക്കുന്നതിൽ അതീവ ശ്രദ്ധ പുലർത്തുക: നിങ്ങളുടെ ദൈവമായ യഹോവയെ സ്നേഹിക്കാനും, അവന്റെ എല്ലാ വഴികളിലും നടക്കാനും, അവന്റെ കല്പനകൾ പാലിക്കാനും, അവനോടു ചേർന്നുനിൽക്കാനും, നിങ്ങളുടെ പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടുംകൂടെ അവനെ സേവിക്കാനും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ യാത്രയയപ്പിനും അനുഗ്രഹത്തിനും പിന്നാലെ വരുന്ന ശക്തമായ മുന്നറിയിപ്പും വിരുദ്ധ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שִׁמְרוּ מְאֹד לַעֲשׂוֹת
  choice: അനുസരിക്കാൻ അതീവ ജാഗ്രത പുലർത്തുക
  rationale: ശബ്ദാനുകരണമായ ‘വളരെ കാത്തുകൊൾവിൻ’ എന്നതിനെക്കാൾ, പ്രവൃത്തിയിൽ നടപ്പാക്കുന്നതിനെക്കുറിച്ചുള്ള ശക്തമായ ജാഗ്രത എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּצְוָה
  choice: കല്പന
  rationale: ഏകവചനവും ഉടമ്പടിസംബന്ധമായ ആജ്ഞയുടെ സ്വരവും നിലനിർത്തുന്നു.
- source_word: הַתּוֹרָה
  choice: ന്യായപ്രമാണം
  rationale: മോശയുമായി ബന്ധപ്പെട്ട ഈ ഉടമ്പടിപശ്ചാത്തലത്തിൽ പരിചിതമായ മലയാള പദം; ‘പ്രബോധനം/ഉപദേശം’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עֶבֶד יְהוָה
  choice: യഹോവയുടെ ദാസൻ
  rationale: മോശയുടെ ബഹുമാനസൂചക സ്ഥാനപ്പേര് നിലനിർത്തുന്നു; അടിമത്തത്തെ അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: അവന്റെ എല്ലാ വഴികളിലും നടക്കുക
  rationale: ഹീബ്രുവിലെ ധാർമിക-ഉടമ്പടി രൂപകം നിലനിർത്തുകയും മലയാളത്തിൽ മനസ്സിലാകാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: അവന്റെ കല്പനകൾ പാലിക്കുക
  rationale: കല്പനകളോടുള്ള അനുസരണം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּלְדָבְקָה בּוֹ
  choice: അവനോടു പറ്റിച്ചേരുക
  rationale: דבק എന്ന ക്രിയയിലെ അടുത്ത, ഉറച്ച ബന്ധത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: וּלְעָבְדוֹ
  choice: അവനെ സേവിക്കുക
  rationale: ആരാധന ഉൾപ്പെടാവുന്നെങ്കിലും അതിൽ മാത്രം ഒതുങ്ങാത്ത സമർപ്പിത സേവനത്തിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: പൂർണഹൃദയത്തോടും പൂർണമനസ്സോടുംകൂടെ
  rationale: മുഴുവൻ ആന്തരിക വ്യക്തിത്വത്തോടെയുള്ള സമർപ്പണം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; נפשׁ-നെ ഇവിടെ ശരീരത്തിൽനിന്ന് വേർപ്പെട്ട ‘ആത്മാവ്’ എന്ന സാങ്കേതിക അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: ഉടമ്പടിസംബന്ധമായ ധാർമിക രൂപകങ്ങൾ
  choice: അവന്റെ എല്ലാ വഴികളിലും നടക്കുക ... അവനോടു പറ്റിച്ചേരുക
  alternative: അവന്റെ ഇഷ്ടപ്രകാരം ജീവിക്കുക ... അവനോട് ഉറച്ചുനിൽക്കുക
  rationale: വ്യാഖ്യാനപരമായി ലളിതമാക്കാതെ ഹീബ്രുവിലെ രൂപകങ്ങളും ബന്ധപരമായ തീവ്രതയും സംരക്ഷിക്കുന്നു.
- issue: נפשׁ എന്ന പദത്തിന്റെ അവതരണം
  choice: മനസ്സ്
  alternative: ആത്മാവ് / ജീവൻ
  rationale: ഈ സമാന്തരപ്രയോഗത്തിൽ സമ്പൂർണ വ്യക്തിത്വവും ജീവസത്തയും ഉദ്ദേശിക്കുന്നു; ശരീരം-ആത്മാവ് എന്ന പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക വിഭജനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ ‘മനസ്സ്’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രു വാക്യത്തിലെ കല്പനാപരമായ ശക്തിയും ക്രമാനുസൃതമായ അനന്തക്രിയാവിന്യാസവും നിലനിർത്താൻ മുഖ്യ കല്പനയ്ക്ക് പിന്നാലെ ലക്ഷ്യങ്ങൾ നിരത്തി.
