source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: ml
  text: അവനോടുകൂടെ പത്ത് നേതാക്കൾ ഉണ്ടായിരുന്നു—ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങൾക്കുമായി ഓരോ പിതൃഭവനത്തിനുവേണ്ടി ഓരോ നേതാവ് വീതം. അവരിൽ ഓരോരുത്തനും ഇസ്രായേലിന്റെ ആയിരങ്ങളിൽ[a] തന്റെ പിതൃഭവനത്തിന്റെ തലവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ ആയിരങ്ങൾ’ എന്നാണ്. ഇവിടെ ‘ആയിരങ്ങൾ’ എന്നത് ഇസ്രായേലിലെ വംശവിഭാഗങ്ങളെയോ വലിയ കുടുംബക്കൂട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: പ്രമാണിമാർ / പ്രമാണി
  rationale: ഔദ്യോഗികമായ ഗോത്രനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന പദം; ‘രാജകുമാരൻ’ എന്ന വംശപരമായ അർഥം അനാവശ്യമായി വരുത്താതെ പദവിയും മാന്യതയും നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: മുൻവാക്യത്തിലെ ഫീനെഹാസിനെ സൂചിപ്പിക്കുന്ന മുൻനിലയും സർവനാമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: ഓരോ പ്രമാണി വീതം
  rationale: ആവർത്തനത്തിന്റെ വിതരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבֵית אָב
  choice: ഓരോ പിതൃഭവനത്തിന്
  rationale: പിതൃവംശാധിഷ്ഠിതമായ കുടുംബ-ഭരണഘടകത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബന്ധുത്വപദത്തിന്റെ രൂപവും അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: പ്രമാണിമാർ ഗോത്രങ്ങളെ പ്രതിനിധീകരിച്ചു വന്നവരാണെന്ന ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאִישׁ
  choice: അവരിൽ ഓരോരുത്തനും
  rationale: പത്തു പ്രതിനിധികളിലേക്കുള്ള വിതരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: സ്വന്തം പിതൃഭവനത്തിന്റെ തലവൻ
  rationale: നേതൃത്വപദവിയും പിതൃവംശീയ കുടുംബഘടനയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങളിൽ
  rationale: אֶלֶף എന്ന പദത്തിന്റെ ‘ആയിരം’ എന്ന രൂപം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുമ്പോൾ, ഇവിടെ അത് സാമൂഹികമോ സൈനികമോ ആയ വിഭാഗങ്ങളെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
