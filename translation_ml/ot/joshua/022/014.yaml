- from: അവനോടുകൂടെ പത്തു പ്രമാണിമാരും ഉണ്ടായിരുന്നു—ഇസ്രായേലിലെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഓരോ പിതൃഭവനത്തിന് ഓരോ പ്രമാണി വീതം. അവരിൽ ഓരോരുത്തനും ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങളിൽ[a] സ്വന്തം പിതൃഭവനത്തിന്റെ തലവനായിരുന്നു.
