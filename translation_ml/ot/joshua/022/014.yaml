translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘പിതൃഭവനം’, ‘ആയിരക്കൂട്ടങ്ങൾ’ എന്നീ പദങ്ങൾ പുരാതന ഇസ്രായേലിന്റെ ബന്ധുത്വ-ഭരണഘടനയുടെ സവിശേഷത നിലനിർത്തുന്നു; അപരിചിതമായ രണ്ടാമത്തെ പദം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
