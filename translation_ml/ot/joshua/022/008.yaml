  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “വളരെയധികം സമ്പത്തും വളരെയധികം വളർത്തുമൃഗങ്ങളും വെള്ളിയും പൊന്നും വെങ്കലവും[a] ഇരുമ്പും വളരെയധികം വസ്ത്രങ്ങളുമായി നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു മടങ്ങുക. നിങ്ങളുടെ ശത്രുക്കളിൽനിന്നുള്ള കൊള്ളമുതൽ നിങ്ങളുടെ സഹോദരന്മാരുമായി[b] പങ്കിടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വെങ്കലം’ എന്നത് ‘ചെമ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നു പറയുന്നത് മറ്റു ഗോത്രങ്ങളിലെ സഹഇസ്രായേല്യരെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഹീബ്രായ വിവരണസൂത്രത്തിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘പറഞ്ഞു’ എന്നു ചുരുക്കിയെങ്കിലും അർഥം പൂർണമായി നിലനിർത്തുന്നു.
- source_word: בִּנְכָסִים רַבִּים
  choice: വളരെയധികം സമ്പത്തും
  rationale: נְכָסִים സ്വത്ത്, സമ്പത്ത്, വസ്തുവകകൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; തുടർന്നുള്ള പട്ടികയ്ക്കു മുന്നിൽ ‘സമ്പത്ത്’ സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു മടങ്ങുക
  rationale: ‘കൂടാരങ്ങൾ’ എന്ന ചരിത്രപരമായ ദൃശ്യബിംബം നിലനിർത്തുകയും ബഹുവചന ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: അനവധി കന്നുകാലികളും
  rationale: מִקְנֶה വിവിധ ഇനങ്ങളിലുള്ള വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന കൂട്ടനാമമാണ്; ‘കന്നുകാലികൾ’ അതിനെ ഒരു പ്രത്യേക ഇനത്തിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: വെള്ളിയും പൊന്നും
  rationale: ലോഹങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സാധാരണ മലയാളത്തിൽ പരിചിതവുമായ പദങ്ങൾ.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: വെങ്കലവും ഇരുമ്പും
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; പുരാതന ലോഹങ്ങളുടെ പട്ടികയിൽ ‘വെങ്കലം’ പരമ്പരാഗതവും യോജിച്ചതുമായ മുഖ്യവിവർത്തനമാണ്, മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: വളരെയധികം വസ്ത്രങ്ങളുമായി
  rationale: שְׂלָמוֹת വസ്ത്രങ്ങൾ അഥവാ മേലങ്കികൾ എന്ന വിശാല അർഥമുള്ളതിനാൽ ‘വസ്ത്രങ്ങൾ’ അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു; מְאֹד എന്ന തീവ്രതയും പ്രകടമാക്കുന്നു.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളിൽനിന്നുള്ള കൊള്ളമുതൽ ... പങ്കിടുക
  rationale: שָׁלָל യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; ‘കൊള്ളമുതൽ’ സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു, ‘പങ്കിടുക’ ബഹുവചന ആജ്ഞയെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עִם אֲחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാരുമായി
  rationale: אָחִים എന്ന പുല്ലിംഗ ബഹുവചന ബന്ധപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മറ്റു ഗോത്രങ്ങളിലെ സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֲחֵיכֶם എന്ന ലിംഗസൂചക ഉടമ്പടിബന്ധപദം
  choice: നിങ്ങളുടെ സഹോദരന്മാരുമായി
  alternative: നിങ്ങളുടെ സഹഇസ്രായേല്യരുമായി
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബന്ധപദം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് മറ്റു ഗോത്രങ്ങളിലെ സഹഇസ്രായേല്യരാണെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രസന്ദർഭം നിലനിർത്താൻ ‘കൂടാരങ്ങൾ’ എന്നും യുദ്ധസന്ദർഭം നിലനിർത്താൻ ‘കൊള്ളമുതൽ’ എന്നും ഉപയോഗിച്ചു. അനാവശ്യമായ പഴഞ്ചൻ ആജ്ഞാരൂപങ്ങൾ ഒഴിവാക്കി.
