  to: 'അവൻ അവരോടു പറഞ്ഞു: “വളരെയധികം സമ്പത്തും വളരെയധികം വളർത്തുമൃഗങ്ങളും വെള്ളിയും പൊന്നും വെങ്കലവും[a] ഇരുമ്പും വളരെയധികം വസ്ത്രങ്ങളുമായി നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു മടങ്ങുക. നിങ്ങളുടെ ശത്രുക്കളിൽനിന്നുള്ള കൊള്ളമുതൽ നിങ്ങളുടെ സഹോദരന്മാരുമായി[b] പങ്കിടുക.”'
  rationale: ‘കന്നുകാലികൾ’ എന്ന ഇന-നിർദിഷ്ട പദത്തിനു പകരം, ഹീബ്രായ מִקְנֶהയുടെ വിശാലമായ കൂട്ടനാമാർഥം നിലനിർത്തുന്ന ‘വളർത്തുമൃഗങ്ങൾ’ ഉപയോഗിച്ചു. മറ്റെല്ലാ പദപ്രയോഗങ്ങളും മൂലപാഠത്തോടും ആധുനിക നിലവാരമലയാളത്തോടും യോജിച്ചതാണ്.
