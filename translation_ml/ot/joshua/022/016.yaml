  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: ml
  text: 'യഹോവയുടെ സമൂഹം മുഴുവനും ഇപ്രകാരം പറയുന്നു: “ഇസ്രായേലിന്റെ ദൈവത്തോടു നിങ്ങൾ ചെയ്ത ഈ വിശ്വാസവഞ്ചന എന്താണ്?[a] നിങ്ങൾക്കായി ഒരു യാഗപീഠം പണിയുന്നതിലൂടെ ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞ്, ഇന്ന് യഹോവയ്‌ക്കെതിരെ മത്സരിക്കാനോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസവഞ്ചന” എന്നതിന് “അവിശ്വസ്തത” എന്നോ “ദ്രോഹം” എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപദം ഉടമ്പടിയിലോ ആരാധനയിലോ കാണിക്കുന്ന വിശ്വസ്തതാലംഘനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: എബ്രായ ക്രിയ രൂപത്തിൽ പൂർണകാലമായിരുന്നാലും, സന്ദേശപ്രഖ്യാപന സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി വർത്തമാനകാലത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: כֹּל עֲדַת יְהוָה
  choice: യഹോവയുടെ സമൂഹം മുഴുവനും
  rationale: עֲדָה എന്നത് ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സമൂഹം’ ആ കൂട്ടായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: നിങ്ങൾ ചെയ്ത ഈ വിശ്വാസവഞ്ചന എന്താണ്?
  rationale: מַעַל ഉടമ്പടിയോടും ആരാധനയോടും ബന്ധപ്പെട്ട അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു; നാമവും അതേ ധാതുവിലുള്ള ക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവത്തോടു
  rationale: מעל എന്ന ക്രിയയോടുകൂടിയ ב കുറ്റം ആരോടാണ് ചെയ്തതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവത്തോടു വിശ്വാസവഞ്ചന ചെയ്യുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לָשׁוּב ... מֵאַחֲרֵי יְהוָה
  choice: യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയുക
  rationale: ‘പിന്നാലെ പോകുക’ എന്ന എബ്രായ രൂപകത്തിന്റെ ഉടമ്പടിവിശ്വസ്തതാ ഭാവം ‘അനുഗമിക്കുക’ നിലനിർത്തുന്നു.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: നിങ്ങൾ നിങ്ങൾക്കായി ഒരു യാഗപീഠം പണിത്
  rationale: ב ചേർന്ന ക്രിയാനാമം ആരോപിക്കപ്പെടുന്ന പിന്തിരിയലിന്റെ മാർഗമോ സാഹചര്യവുമാണ്; ‘പണിത്’ ഈ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לִמְרָדְכֶם ... בַּיהוָה
  choice: യഹോവയോടു മത്സരിക്കുകയും
  rationale: מרד അധികാരത്തിനെതിരായ കലാപത്തെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘മത്സരിക്കുക’ മലയാള ബൈബിൾഭാഷയിൽ ഗൗരവമുള്ളതും പൊതുവായി മനസ്സിലാകുന്നതുമാണ്.
- source_word: הַיּוֹם ... הַיּוֹם
  choice: ഇന്ന് ... ഇന്ന്
  rationale: അടിയന്തരത ഊന്നുന്ന മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി.
theological_decisions:
- issue: מַעַל എന്ന ഉടമ്പടിലംഘനപദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസവഞ്ചന
  alternative: അവിശ്വസ്തത; ദ്രോഹം
  rationale: സാധാരണ പാപത്തേക്കാൾ ആരാധനാപരവും ഉടമ്പടിപരവുമായ വിശ്വസ്തതാലംഘനമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘വിശ്വാസവഞ്ചന’ അതിന്റെ ബന്ധപരവും ഗൗരവമുള്ളതുമായ ഭാവം നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു; ആധുനിക മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: യാഗപീഠനിർമാണവും മത്സരവും തമ്മിലുള്ള വാക്യബന്ധം
  choice: പണിത് ... പിന്തിരിയുകയും ... മത്സരിക്കുകയും
  alternative: പണിയുന്നതിനാൽ ... മത്സരിക്കാൻ
  rationale: לִמְרָדְכֶם ഉദ്ദേശമോ ഫലമോ വ്യക്തമാക്കാവുന്നതിനാൽ അതിനെ നിർണ്ണായകമായി ‘മത്സരിക്കാനായി’ എന്നു ചുരുക്കാതെ, ആരോപണത്തിന്റെ സമാന്തര ഘടകമായി നൽകി; ഇതിലൂടെ മൂലത്തിലെ ചെറിയ വ്യാകരണാഭാസം അമിതമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പൊതുവായ ശൈലി. മൂലത്തിലെ ഇരട്ട ‘ഇന്ന്’ നിലനിർത്തി. ദൈവനാമം ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു; ആരോപണത്തിന്റെ കടുപ്പം മൃദൂകരിച്ചിട്ടില്ല.
