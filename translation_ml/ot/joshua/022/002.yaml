id: JOS.22.2
reference: Joshua 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “യാഹ്‌വേയുടെ ദാസനായ മോശെ നിങ്ങളോടു കൽപ്പിച്ചതെല്ലാം നിങ്ങൾ പാലിച്ചു; ഞാൻ നിങ്ങളോടു കൽപ്പിച്ച എല്ലാ കാര്യങ്ങളിലും നിങ്ങൾ എന്റെ വാക്ക് കേട്ടു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങളോടു കൽപ്പിച്ച എല്ലാ കാര്യങ്ങളിലും നിങ്ങൾ എന്നെ അനുസരിച്ചു.” ‘ഒരാളുടെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗം പലപ്പോഴും അനുസരണത്തോടെ പ്രതികരിക്കുക എന്ന അർഥം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം ഉപയോഗിച്ചു.
- source_word: שְׁמַרְתֶּם
  choice: നിങ്ങൾ പാലിച്ചു
  rationale: കല്പനകളുടെ പശ്ചാത്തലത്തിൽ שׁמר എന്നത് സൂക്ഷിക്കുക എന്നതിലുപരി അനുസരണത്തോടെ പാലിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: നിങ്ങളോടു കല്പിച്ചതെല്ലാം
  rationale: എബ്രായത്തിലെ സമഗ്രതയും കല്പനയുടെ അധികാരഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: യഹോവയുടെ ദാസനായ മോശ
  rationale: עֶבֶד ഇവിടെ മോശയുടെ ദൈവനിയുക്ത സേവനത്തെ സൂചിപ്പിക്കുന്ന ബഹുമാനപദവിയാണ്; ‘ദാസൻ’ അതിന് അനുയോജ്യം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: നിങ്ങൾ എന്റെ വാക്കു കേട്ടു
  rationale: ‘എന്റെ ശബ്ദം കേൾക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശ്രവണരൂപകം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ ‘എന്റെ വാക്കു കേട്ടു’ എന്നു നൽകി; സന്ദർഭത്തിൽ അനുസരണത്തിന്റെ അർഥവും ഉൾപ്പെടുന്നു.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിച്ച എല്ലാ കാര്യങ്ങളിലും
  rationale: കല്പിച്ചതിന്റെ പൂർണവ്യാപ്തി വ്യക്തമാക്കുകയും മുൻവാക്യത്തിലെ צוה എന്ന ക്രിയയോടുള്ള പദസുസ്ഥിരത പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി പകരാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തി.
- issue: മോശയെ വിശേഷിപ്പിക്കുന്ന עֶבֶד
  choice: ദാസൻ
  alternative: അടിമ
  rationale: ഇവിടെ ഈ പദം ഉടമസ്ഥതയിലായ അടിമസ്ഥിതിയെ മുൻനിർത്തുന്നില്ല; യഹോവയോടുള്ള നിയുക്തവും ബഹുമാന്യവുമായ സേവനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- issue: שׁמע בְּקוֹל എന്ന പ്രയോഗത്തിലെ കേൾവിയും അനുസരണവും
  choice: എന്റെ വാക്കു കേട്ടു
  alternative: എന്നെ അനുസരിച്ചു
  rationale: മൂലത്തിലെ ശ്രവണരൂപകം സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന അനുസരണാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; അങ്ങനെ അർഥവൈവിദ്ധ്യം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കല്പിച്ചു’, ‘പാലിച്ചു’, ‘ദാസൻ’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും ഇപ്പോഴും ഗ്രാഹ്യമായ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ കേൾവി-അനുസരണ ദ്വയാർഥം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
