translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗോത്രനാമങ്ങളോടൊപ്പം ആവർത്തിക്കുന്ന ‘മക്കൾ’ എന്ന ഉറവിടഘടനയും അവസാനത്തെ എബ്രായ ദൃശ്യപ്രയോഗവും നിലനിർത്തി; അപരിചിതമായ ‘ആയിരങ്ങൾ’ എന്ന ഭരണപര പദസാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
