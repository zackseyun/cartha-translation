    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ ആയിരങ്ങളുടെ തലവന്മാർ.’ ഇവിടെ ‘ആയിരങ്ങൾ’ എന്നത് കൃത്യമായി ആയിരംപേരടങ്ങുന്ന ഘടകങ്ങളേക്കാൾ ഗോത്രങ്ങളിലെ കുലങ്ങളെയോ ഭരണ-സൈനിക വിഭാഗങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം.
