reference: Joshua 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: ml
  text: മനശ്ശെ ഗോത്രത്തിന്റെ ഒരു പകുതിക്ക് മോശെ ബാശാനിൽ അവകാശഭൂമി നൽകിയിരുന്നു; മറ്റേ പകുതിക്ക് യോശുവ യോർദ്ദാന്റെ പടിഞ്ഞാറുവശത്തുള്ള അവരുടെ സഹോദരന്മാരോടൊപ്പം[a] അവകാശഭൂമി നൽകി. യോശുവ അവരെ അവരുടെ കൂടാരങ്ങളിലേക്കു പറഞ്ഞയച്ചപ്പോൾ അവരെ അനുഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവരുടെ സഹോദരന്മാരോടൊപ്പം.” ഇവിടെ ഈ പദം മറ്റു ഗോത്രങ്ങളിലെ സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.'
    reason: ‘സഹോദരന്മാർ’ എന്ന എബ്രായ ബന്ധുത്വപദത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെ ഗോത്രത്തിന്റെ ഒരു പകുതിക്ക്
  rationale: മനശ്ശെ ഗോത്രത്തിന്റെ രണ്ട് വിഭാഗങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുവരുന്ന ‘മറ്റേ പകുതി’യുമായുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נָתַן מֹשֶׁה
  choice: മോശെ ... നൽകിയിരുന്നു
  rationale: യോശുവയുടെ പിന്നീടുള്ള ഭൂവിഭജനത്തിനു മുമ്പ് മോശെ ചെയ്ത പ്രവൃത്തിയാണെന്ന കാലക്രമം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּבָּשָׁן
  choice: ബാശാനിൽ
  rationale: പ്രദേശനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּלְחֶצְיוֹ
  choice: മറ്റേ പകുതിക്ക്
  rationale: സർവനാമപ്രത്യയം മനശ്ശെ ഗോത്രത്തിലേക്കു മടങ്ങുന്നു; രണ്ട് വിഭാഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: യോശുവ ... അവകാശഭൂമി നൽകി
  rationale: ‘ഭൂമി’ മൂലപാഠത്തിൽ സ്പഷ്ടമായ കർമമല്ലെങ്കിലും ഭൂവിഭജനസന്ദർഭത്തിൽ അന്തർലീനമാണ്; ‘അവകാശഭൂമി’ മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: עִם אֲחֵיהֶם
  choice: അവരുടെ സഹോദരന്മാരോടൊപ്പം
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപദം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ അത് മറ്റു ഇസ്രായേൽ ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: യോർദ്ദാന്റെ മറുകരയിൽ, പടിഞ്ഞാറുഭാഗത്ത്
  rationale: ‘യോർദ്ദാനക്കരെ’ എന്ന ദിക്കുസംബന്ധമായ കാഴ്ചപ്പാടും ‘കടലോട്ടു/പടിഞ്ഞാറോട്ട്’ എന്ന ഭൂമിശാസ്ത്രസൂചനയും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְגַם כִּי
  choice: '...പ്പോൾ'
  rationale: അടുത്ത പ്രവൃത്തിയെ കാലസംബന്ധമായി അവതരിപ്പിക്കുന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ബന്ധകത്തെ അനാവശ്യമായി വലുതാക്കുന്നില്ല.
- source_word: שִׁלְּחָם
  choice: അവരെ ... പറഞ്ഞയച്ചു
  rationale: പീയേൽ രൂപത്തിന്റെ ‘യാത്രയാക്കി അയയ്ക്കുക/വിടപറഞ്ഞയയ്ക്കുക’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: אֶל אָהֳלֵיהֶם
  choice: അവരുടെ കൂടാരങ്ങളിലേക്ക്
  rationale: ‘വീടുകളിലേക്ക്’ എന്ന ആശയവിവർത്തനത്തിനു പകരം മൂലത്തിലെ ദൃശ്യമായ ‘കൂടാരങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: וַיְבָרֲכֵם
  choice: അവരെ അനുഗ്രഹിച്ചു
  rationale: ברך എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സാധാരണവുമായ മലയാളപരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗോത്രവിഭജനവും ഭൂമിശാസ്ത്രദിശയും വ്യക്തമായി നൽകിയിട്ടുണ്ട്; മൂലത്തിലെ ‘സഹോദരന്മാർ’, ‘കൂടാരങ്ങൾ’ എന്നീ ദൃശ്യപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്.
