source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കൾ ഗിലെയാദ് ദേശത്തുള്ള രൂബേന്റെ മക്കളുടെയും[a] ഗാദിന്റെ മക്കളുടെയും മനശ്ശെയുടെ പാതിഗോത്രത്തിന്റെയും അടുക്കലേക്ക് പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസിനെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: “രൂബേന്യരുടെയും ഗാദ്യരുടെയും മനശ്ശെയുടെ പാതിഗോത്രത്തിന്റെയും അടുക്കലേക്ക്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം തിരിച്ചറിയാവുന്ന വിധം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ സംയുക്തപദം.
- source_word: אֶל
  choice: അടുക്കലേക്ക്
  rationale: പ്രതിനിധിയെ അയയ്ക്കുന്ന സന്ദർഭത്തിൽ ലക്ഷ്യവ്യക്തികളിലേക്കുള്ള ദിശ/സ്വീകർത്താക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘എതിരായി’ എന്ന അർഥമല്ല.
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ ബന്ധനിർമാണം സുതാര്യമായി നിലനിർത്തുന്നു; ‘രൂബേന്യർ’ എന്ന ജനവിഭാഗനാമം കൂടുതൽ സ്വാഭാവികമായ ഒരു പകരമാണ്.
- source_word: בְּנֵי גָד
  choice: ഗാദിന്റെ മക്കൾ
  rationale: മൂലത്തിലെ ‘മക്കൾ’ എന്ന പ്രയോഗം നിലനിർത്തുകയും രൂബേനെക്കുറിച്ചുള്ള സമാന്തര ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: ഗോത്രത്തിന്റെ പകുതിഭാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധനിർമാണത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: ഗിലെയാദ് ദേശത്തുള്ള
  rationale: രൂബേൻ, ഗാദ്, മനശ്ശെയുടെ പാതിഗോത്രം എന്നിവരുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന സ്ഥാനസൂചനയായി വാക്യത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: אֶת פִּינְחָס
  choice: ഫീനെഹാസിനെ
  rationale: אֶת വിവർത്തനം ചെയ്യാത്ത നേരിട്ടുള്ള കർമചിഹ്നമാണ്; വ്യക്തിനാമത്തിന് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בֶּן אֶלְעָזָר
  choice: എലെയാസാരിന്റെ മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്ന മലയാള പ്രയോഗം.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: നാമം പുരോഹിതപദവിയെ സൂചിപ്പിക്കുന്നു. എബ്രായ പദക്രമത്തിൽ ഇത് എലെയാസാരിനോടാണ് ഏറ്റവും അടുത്തു നിൽക്കുന്നതെങ്കിലും, വാക്യഘടനയിൽ ഫീനെഹാസിന്റെ വിശേഷണമായി മനസ്സിലാക്കാവുന്ന യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘പുരോഹിതൻ’ എന്ന വിശേഷണം ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനവാചകത്തിൽ ‘പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ്’ എന്ന രൂപത്തിൽ ഫീനെഹാസിനെ വിശേഷിപ്പിക്കുന്ന വായന
  alternative: ‘പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ്’ എന്ന മലയാളപദക്രമം ചിലർക്കു എലെയാസാരിനെ വിശേഷിപ്പിക്കുന്നതായും വായിക്കാം; കൂടുതൽ വ്യക്തമാക്കിയാൽ ‘പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ്’ / ‘എലെയാസാരിന്റെ മകനായ പുരോഹിതൻ ഫീനെഹാസ്’ എന്ന വ്യത്യസ്ത വായനകൾ സാധ്യം
  rationale: ഹീബ്രുവിലെ הַכֹּהֵן പദം ‘എലെയാസാർ’ എന്നതിനുശേഷം വരുന്നു; അതിനാൽ അടുത്തുള്ള നാമമായ എലെയാസാരോടു ചേർക്കാം. എന്നാൽ യോശുവ 22:31-ലെ സമാന്തര തിരിച്ചറിയലും ഫീനെഹാസിന്റെ പുരോഹിതസ്ഥാനവും അതിനെ ഫീനെഹാസിനോടു ചേർക്കുന്ന വായനയ്ക്കും ശക്തമായ പിന്തുണ നൽകുന്നു. ഈ വാക്യത്തിൽ അനാവശ്യമായി തീർപ്പുകൽപ്പിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ചെറിയ തുറന്നത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ശൈലി. ‘ഇസ്രായേൽമക്കൾ’, ‘ഗോത്രം’, ‘പുരോഹിതൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അത്യന്തം പുരാതനമായ വാക്യക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നമായ [a] മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
