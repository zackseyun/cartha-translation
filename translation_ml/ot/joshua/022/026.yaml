id: JOS.22.26
reference: Joshua 22:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר נַעֲשֶׂה נָּ֣א לָ֔/נוּ לִ/בְנ֖וֹת אֶת הַ/מִּזְבֵּ֑חַ לֹ֥א לְ/עוֹלָ֖ה וְ/לֹ֥א לְ/זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞങ്ങൾ പറഞ്ഞു[a]: ‘ഇപ്പോൾ നമുക്കായി ആ യാഗപീഠം പണിയാം[b]—ഹോമയാഗത്തിനല്ല, യാഗത്തിനുമല്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പോൾ ഞങ്ങൾ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ ബന്ധകപദം മുൻവാക്യത്തോടുള്ള ബന്ധത്തിന്റെ സ്വഭാവമനുസരിച്ച് പലവിധത്തിൽ സ്വാഭാവികമായി നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘നമുക്കായി ഉണ്ടാക്കാം, യാഗപീഠം പണിയാൻ.’ ഇത് ‘നമുക്കായി യാഗപീഠം പണിയാം’ എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: അതുകൊണ്ട് ഞങ്ങൾ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ אמר എന്ന ക്രിയ മുൻവാക്യത്തിലെ ആശങ്കയിൽനിന്ന് ഉണ്ടായ തീരുമാനത്തെ അവതരിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ സന്ദർഭത്തിലെ ഫലസൂചന സ്വാഭാവികമായി നൽകുന്നു; ബന്ധം കൂടുതൽ നിഷ്പക്ഷമായി വായിക്കാനും കഴിയും എന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: ഇപ്പോൾ നമുക്കായി ... പണിയാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപവും തുടർന്നുള്ള infinitive construct-ഉം ചേർന്ന എബ്രായ പ്രയോഗം ഒരു കൂട്ടായ നിർദേശമോ തീരുമാനമോ പ്രകടിപ്പിക്കുന്നു. പദാനുപദമായ ‘ഉണ്ടാക്കാം, പണിയാൻ’ എന്നതിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ ‘പണിയാം’ ഉപയോഗിച്ചു; נָא-യുടെ അഭ്യർഥനാത്മക/ഉത്സാഹിപ്പിക്കുന്ന ഭാവം ‘ഇപ്പോൾ’ കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: ആ യാഗപീഠം
  rationale: നിശ്ചയാർഥക ഉപപദം സന്ദർഭത്തിൽ ചർച്ചചെയ്യുന്ന നിർദിഷ്ട യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആ’ ഈ സന്ദർഭനിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: לֹא לְעוֹלָה
  choice: ഹോമയാഗത്തിനല്ല
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലിപദമാണ്; ‘ഹോമയാഗം’ ആ വ്യത്യസ്ത യാഗവിഭാഗം ചുരുക്കമായും പരിചിതമായും നൽകുന്നു.
- source_word: וְלֹא לְזָבַח
  choice: യാഗത്തിനുമല്ല
  rationale: זֶבַח ഇവിടെ עֹלָה-യിൽനിന്ന് വേർതിരിച്ച പൊതുവായ യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘യാഗം’ അതിനെ അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ നിലനിർത്തുന്നു; ‘-ഉമല്ല’ ആവർത്തിച്ച നിഷേധത്തിന്റെ ഏകോപനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യാഗപീഠം,’ ‘ഹോമയാഗം,’ ‘യാഗം’ എന്നീ പൊതുവായി മനസ്സിലാക്കാവുന്ന ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായ വാക്യഘടനയുടെ അസ്വാഭാവികമായ പദാനുപദ രൂപം മുഖ്യവാചകത്തിൽ മലയാളീകരിക്കുകയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
