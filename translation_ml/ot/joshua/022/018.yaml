- source_word: תָּשֻׁבוּ
  choice: പിന്തിരിയുന്നു
  rationale: שׁוב എന്ന ക്രിയയ്ക്ക് ‘തിരികെ വരുക’ എന്നും ‘പിന്തിരിയുക’ എന്നും അർഥമാകാം. מֵאַחֲרֵי എന്ന പ്രയോഗത്തോടൊപ്പം ഇവിടെ യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്നുള്ള വിശ്വാസത്യാഗപരമായ പിന്തിരിയലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ പിന്നാലെനിന്ന്’ എന്ന എബ്രായ ശൈലി, അവിടുത്തെ അനുഗമിക്കുന്നത് നിർത്തുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְהָיָה
  choice: …ചെയ്താൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പോൾ സംഭവിക്കും’ എന്നാണെങ്കിലും, തുടർന്നുവരുന്ന മുന്നറിയിപ്പിന്റെ നിബന്ധനാസ്വഭാവം മലയാളത്തിൽ ‘ചെയ്താൽ’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תִּמְרְדוּ
  choice: മത്സരിച്ചാൽ
  rationale: מרד ന്യായമായ അധികാരത്തിനെതിരായ കലാപത്തെയും ഉടമ്പടിവിരുദ്ധമായ ധിക്കാരത്തെയും സൂചിപ്പിക്കുന്നു. ‘മത്സരിക്കുക’ എന്നത് മലയാള ബൈബിൾഭാഷയിൽ ശക്തവും ഗ്രഹിക്കാവുന്നതുമായ പ്രയോഗമാണ്.
- source_word: בַּיהוָה
  choice: യഹോവയോടു
  rationale: מרד എന്ന ക്രിയയോടൊപ്പം בְ വിരോധാർഥത്തിലാണ്; മലയാളത്തിലെ ‘യഹോവയോടു മത്സരിക്കുക’ എന്ന പ്രയോഗം ‘യഹോവയ്ക്കെതിരെ കലഹിക്കുക’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּמָחָר
  choice: നാളെ
  rationale: ഫലത്തിന്റെ അടിയന്തരത നിലനിർത്തുന്ന നേരിട്ടുള്ള കാലസൂചകപ്രയോഗം.
- source_word: יִקְצֹף
  choice: കോപിക്കും
  rationale: קצף ശക്തമായ കോപം അഥവാ ക്രോധം സൂചിപ്പിക്കുന്നു. ‘കോപിക്കും’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുഴുവൻ സഭ
  rationale: עֵדָה ഉടമ്പടിജനത്തിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ അതിന്റെ സാമൂഹികവും സമഷ്ടിപരവുമായ ഭാവം നിലനിർത്തുന്നു.
