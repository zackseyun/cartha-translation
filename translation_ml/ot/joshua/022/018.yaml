  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: ml
  text: നിങ്ങളോ ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയുന്നു[a][b]. നിങ്ങൾ ഇന്ന് യഹോവയ്‌ക്കെതിരെ കലഹിക്കുകയാണെങ്കിൽ, നാളെ അവിടുന്ന്[c] ഇസ്രായേലിന്റെ മുഴുവൻ സഭയോടും കോപിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിന്തിരിയുന്നു’ എന്നതിന് ‘തിരിഞ്ഞുപോകുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായക്രിയയ്ക്ക് ‘തിരികെ വരുക’ അല്ലെങ്കിൽ ‘പിന്തിരിയുക’ എന്നിങ്ങനെ അർഥങ്ങളുണ്ട്; ഇവിടെ അവിശ്വസ്തതയോടെ അനുഗമിക്കുന്നത് ഉപേക്ഷിക്കുന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ പിന്നാലെനിന്ന്’; അവിടുത്തെ അനുഗമിക്കുന്നത് നിർത്തുക എന്നർഥമുള്ള എബ്രായ ശൈലി.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ കർത്താവിനെ പ്രത്യേകം പറഞ്ഞിട്ടില്ല; ‘കോപിക്കും’ എന്നു മാത്രമേയുള്ളൂ. സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന കർത്താവ് യഹോവയാണ്.
    reason: implicit_subject
