  to: നിങ്ങളോ ഇന്ന് യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിയുന്നു[a][b]. നിങ്ങൾ ഇന്ന് യഹോവയ്‌ക്കെതിരെ കലഹിക്കുകയാണെങ്കിൽ, നാളെ അവിടുന്ന്[c] ഇസ്രായേലിന്റെ മുഴുവൻ സഭയോടും കോപിക്കും.
  rationale: The revision preserves the source’s rhetorical conditional warning by using ‘കലഹിക്കുകയാണെങ്കിൽ’ rather than a simple future contingency, and it renders rebellion against YHWH more directly with ‘യഹോവയ്‌ക്കെതിരെ കലഹിക്കുക.’ Footnote c has also been adjusted so that it accurately says the subject—not the pronoun ‘അവിടുന്ന്’—is absent in Hebrew.
