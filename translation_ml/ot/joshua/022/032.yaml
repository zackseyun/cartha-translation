source:
  edition: WLC
  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസും നേതാക്കളും രൂബേന്റെ മക്കളുടെയും ഗാദിന്റെ മക്കളുടെയും അടുക്കൽനിന്ന്, ഗിലെയാദ് ദേശത്തുനിന്ന് കനാൻ ദേശത്തേക്ക്, ഇസ്രായേൽമക്കളുടെ അടുക്കലേക്ക് മടങ്ങിവന്നു; അവർ അവർക്കു വിവരം അറിയിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ അവരോട് കാര്യം അറിയിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ദָּבָר എന്ന ഹീബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘വാക്ക്,’ ‘കാര്യം,’ ‘വിവരം’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഇസ്രായേൽജനത്തെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ പൂർത്തിയായ മടങ്ങിവരവ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ദൃഷ്ടികോണം അനാവശ്യമായി കൂടുതൽ നിർണയിക്കുന്നില്ല.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസ്
  rationale: ഹീബ്രായ വംശപരവും ഔദ്യോഗികവുമായ തിരിച്ചറിയൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിക്കുന്നു.
- source_word: וְהַנְּשִׂיאִים
  choice: നേതാക്കളും
  rationale: נְשִׂיאִים ഇവിടെ ഗോത്രനേതാക്കളെ സൂചിപ്പിക്കുന്നു. രാജകീയ പദവി ധ്വനിപ്പിക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമകാലിക പദമാണ് ‘നേതാക്കൾ’.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: രൂബേന്റെ മക്കളുടെയും ഗാദിന്റെ മക്കളുടെയും അടുത്തുനിന്ന്
  rationale: രണ്ടിടത്തുമുള്ള בְּנֵי എന്ന ആവർത്തനം നിലനിർത്തുകയും, വ്യക്തികളുടെ സന്നിധിയിൽനിന്നുള്ള മടങ്ങിവരവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: ഗിലെയാദ് ദേശത്തുനിന്ന് കനാൻ ദേശത്തേക്ക്
  rationale: രണ്ടു ഭൂവിഭാഗങ്ങൾക്കുമൊപ്പം ആവർത്തിക്കുന്ന אֶרֶץ ‘ദേശം’ എന്നു നിലനിർത്തി ഭൂമിശാസ്ത്രപരമായ വിരുദ്ധദിശ വ്യക്തമാക്കുന്നു.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ അടുത്തേക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ രൂപം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ പതിവായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: അവർ അവർക്കു വിവരം കൊണ്ടുവന്നു
  rationale: שוב എന്ന മടങ്ങിവരവ്-ധ്വനിയും דָּבָר എന്നതിന്റെ സന്ദർഭോചിതമായ ‘വിവരം/സന്ദേശം’ എന്ന അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
