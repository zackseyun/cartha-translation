revisions:
- from: അപ്പോൾ പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസും നേതാക്കളും രൂബേന്റെ മക്കളുടെയും ഗാദിന്റെ മക്കളുടെയും അടുത്തുനിന്ന്, ഗിലെയാദ് ദേശത്തുനിന്ന് കനാൻ ദേശത്തേക്ക്, ഇസ്രായേൽമക്കളുടെ അടുത്തേക്കു മടങ്ങിവന്നു; അവർ അവർക്കു വിവരം കൊണ്ടുവന്നു.[a][b]
  to: അപ്പോൾ പുരോഹിതനായ എലെയാസാരിന്റെ മകൻ ഫീനെഹാസും നേതാക്കളും രൂബേന്റെ മക്കളുടെയും ഗാദിന്റെ മക്കളുടെയും അടുക്കൽനിന്ന്, ഗിലെയാദ് ദേശത്തുനിന്ന് കനാൻ ദേശത്തേക്ക്, ഇസ്രായേൽമക്കളുടെ അടുക്കലേക്ക് മടങ്ങിവന്നു; അവർ അവർക്കു വിവരം അറിയിച്ചു.[a][b]
  rationale: The revision makes the departure from the Reubenites and Gadites idiomatic and semantically clear, and it renders the final reporting idiom in natural modern Malayalam. It retains the Hebrew's repeated tribal phrasing, the geographical movement from Gilead to Canaan, and the collective designation ‘sons of Israel.’
