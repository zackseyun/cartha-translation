  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗോത്രനാമങ്ങളോടൊപ്പമുള്ള ‘മക്കൾ’ എന്ന സ്രോതസ്സിലെ ആവർത്തനം സംരക്ഷിച്ചു; രാജകീയ സൂചന ഒഴിവാക്കാൻ ‘പ്രഭുക്കന്മാർ’ എന്നതിനുപകരം ‘നേതാക്കൾ’ ഉപയോഗിച്ചു.
