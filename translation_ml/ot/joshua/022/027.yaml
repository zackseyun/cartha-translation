source:
  edition: WLC
  text: כִּי֩ עֵ֨ד ה֜וּא בֵּינֵ֣י/נוּ וּ/בֵינֵי/כֶ֗ם וּ/בֵ֣ין דֹּרוֹתֵי/נוּ֮ אַחֲרֵי/נוּ֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת יְהוָה֙ לְ/פָנָ֔י/ו בְּ/עֹלוֹתֵ֥י/נוּ וּ/בִ/זְבָחֵ֖י/נוּ וּ/בִ/שְׁלָמֵ֑י/נוּ וְ/לֹא יֹאמְר֨וּ בְנֵי/כֶ֤ם מָחָר֙ לְ/בָנֵ֔י/נוּ אֵין לָ/כֶ֥ם חֵ֖לֶק בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: ml
  text: 'മറിച്ച്, നമുക്കും നിങ്ങൾക്കും ഇടയിലും നമുക്കുശേഷമുള്ള നമ്മുടെ തലമുറകൾക്കിടയിലും ഇത് ഒരു സാക്ഷിയാണ്: നമ്മുടെ ഹോമയാഗങ്ങളാലും ബലികളാലും സമാധാനയാഗങ്ങളാലും അവന്റെ സന്നിധിയിൽ യഹോവയ്ക്കുള്ള ശുശ്രൂഷ നാം നിർവഹിക്കേണ്ടതിന്. അങ്ങനെ, ഭാവിയിൽ നിങ്ങളുടെ മക്കൾ നമ്മുടെ മക്കളോട്, ‘യഹോവയിൽ നിങ്ങൾക്ക് ഒരു ഓഹരിയുമില്ല’ എന്നു പറയുകയില്ല.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ നിഷേധത്തിനു വിരുദ്ധമായി യാഗപീഠത്തിന്റെ യഥാർഥ ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്ന സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עֵד
  choice: സാക്ഷി
  rationale: യാഗപീഠം ഇരുകൂട്ടരുടെയും യഹോവയിലുള്ള പങ്കാളിത്തത്തിന് നിലനിൽക്കുന്ന സാക്ഷ്യമാണെന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: עֲבֹדַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള ശുശ്രൂഷ
  rationale: עבד എന്ന മൂലത്തിന്റെ ആരാധനയും സേവനവും ഉൾക്കൊള്ളുന്ന അർഥപരിധി നിലനിർത്തുന്നു; തുടർന്നുള്ള യാഗങ്ങൾ അതിന്റെ ആചാരപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: ഈ പ്രത്യേക യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും ഉറവിടപദത്തോട് അടുത്തതുമായ പദം.
- source_word: מָחָר
  choice: ഭാവിയിൽ
  rationale: അക്ഷരാർഥമായ ‘നാളെ’ എന്നതിലുപരി ഇവിടെ ഉദ്ദേശിക്കുന്ന വരുംകാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֵלֶק בַּיהוָה
  choice: യഹോവയിൽ ... ഓഹരി
  rationale: ‘യഹോവയിൽ പങ്ക്/ഓഹരി’ എന്ന സാന്ദ്രമായ ഉടമ്പടി-ബന്ധ ഭാഷയെ വിശദീകരിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഉറവിടത്തിലെ വ്യക്തിനാമസ്വഭാവം മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു; സാധാരണ പദവിയായ ‘കർത്താവ്’ എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
- issue: ‘യഹോവയിൽ ഓഹരി’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപകത്തെ അതേപടി നിലനിർത്തി
  alternative: യഹോവയെ ആരാധിക്കാനുള്ള അവകാശം
  rationale: ഈ വാക്കുകൾ ആരാധനാവകാശം, ഉടമ്പടി അംഗത്വം, അവകാശബന്ധം എന്നിവയെ സൂചിപ്പിക്കാം; അവയിൽ ഒന്ന് മാത്രം തിരഞ്ഞെടുത്ത് മൂലത്തിലെ അർഥസാന്ദ്രത ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട എബ്രായ വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്തി.
