source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: ml
  text: അവർ കനാൻദേശത്തുള്ള യോർദാൻ പ്രദേശങ്ങളിൽ എത്തിയപ്പോൾ, രൂബേന്റെ പുത്രന്മാരും ഗാദിന്റെ പുത്രന്മാരും മനശ്ശെയുടെ പാതിഗോത്രവും അവിടെ യോർദാന്റെ അരികെ ഒരു യാഗപീഠം പണിതു—കാഴ്ചയിൽ വലിയ ഒരു യാഗപീഠം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘കാണാൻ വലിയ ഒരു യാഗപീഠം’; അതായത്, കാഴ്ചയിൽ ശ്രദ്ധേയമായ ഒരു യാഗപീഠം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: പ്രദേശം
  rationale: ചുറ്റുമുള്ള ഭൂപ്രദേശത്തെയോ ജില്ലയെയോ സൂചിപ്പിക്കുന്ന പദമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഭൂമിശാസ്ത്രപരമായ അർഥത്തിന് യോജിച്ചതുമായ പദം ‘പ്രദേശം’ ആണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: എത്തിയപ്പോൾ
  rationale: വാക്യം മുൻവിവരണവുമായി കാലപരമായി ബന്ധിപ്പിക്കുകയും ഹീബ്രു ആഖ്യാനത്തിന്റെ മുന്നേറ്റം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തുള്ള
  rationale: ഏത് യോർദാൻ പ്രദേശമാണെന്ന് വ്യക്തമാക്കുന്ന ബന്ധവാക്യത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ നിർദേശം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בְנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ കുടുംബ-ഗോത്ര പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘രൂബേന്യർ’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് സുതാര്യമായി ചേർന്നുനിൽക്കുന്നു.
- source_word: בְנֵי גָד
  choice: ഗാദിന്റെ പുത്രന്മാർ
  rationale: രൂബേന്റെ പുത്രന്മാർ എന്ന സമാന്തര പ്രയോഗത്തോടുള്ള ഏകീകരണവും ഹീബ്രു ഘടനയും നിലനിർത്തുന്നു.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: ഗോത്രത്തിന്റെ പകുതിയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു സംയുക്തപദത്തിന് വ്യക്തവും പതിവുള്ളതുമായ മലയാളരൂപം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: യാഗാർപ്പണവുമായി ബന്ധപ്പെട്ട നിർമിതിയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പദം.
- source_word: עַל הַיַּרְדֵּן
  choice: യോർദാനരികെ
  rationale: ഭൂമിശാസ്ത്രപരമായ ഈ പ്രയോഗത്തിൽ עַל സാമീപ്യം സൂചിപ്പിക്കുന്നു; ‘യോർദാനരികെ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: גָּדוֹל
  choice: വളരെ വലുതായ
  rationale: പീഠത്തിന്റെ ശ്രദ്ധേയമായ വലുപ്പമോ ദൃശ്യപ്രഭാവമോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള לְמַרְאֶה-യുമായി ചേർന്ന് കാഴ്ചയിൽ പ്രകടമായ വലുപ്പം നൽകുന്നു.
- source_word: לְמַרְאֶה
  choice: കാഴ്ചയിൽ
  rationale: പീഠം കാണപ്പെട്ട വിധത്തെ വിവരിക്കുന്നു. ‘കാഴ്ചയിൽ’ എന്നത് വലുപ്പത്തെയും ദൃശ്യശ്രദ്ധേയതയെയും തുറന്നുവെക്കുന്ന സ്വാഭാവിക മലയാളമാണ്.
theological_decisions:
- issue: മത്സരാരാധനയ്ക്കുള്ള യാഗപീഠമാണെന്ന സാധ്യത
  choice: വിധിനിർണയമില്ലാതെ നിർമാണവും ദൃശ്യവലുപ്പവും മാത്രം വിവരിക്കുക
  alternative: ‘പ്രതാപമേറിയ യാഗപീഠം’ അല്ലെങ്കിൽ ‘മത്സരയാഗപീഠം’ എന്നു വ്യാഖ്യാനാത്മകമായി നൽകുക
  rationale: ഈ വാക്യം യാഗപീഠത്തിന്റെ നിർമാണവും അതിന്റെ ശ്രദ്ധേയമായ കാഴ്ചയും മാത്രമാണ് പറയുന്നത്; ബലിയർപ്പണത്തിനായിരുന്നോ കേന്ദ്രവിശുദ്ധമന്ദിരത്തോടുള്ള മത്സരമായിരുന്നോ എന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ തുടർന്നുള്ള ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗോത്രനാമങ്ങളിലെ ഹീബ്രു കുടുംബപ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു. വാക്യത്തിന്റെ ആഖ്യാനപ്രവാഹത്തിനായി ‘എത്തിയപ്പോൾ’ ഉപയോഗിച്ചു; യാഗപീഠത്തിന്റെ ഉദ്ദേശ്യം മുൻകൂട്ടി വിധിക്കാതെ ദൃശ്യവിവരണം മാത്രം നൽകി.
