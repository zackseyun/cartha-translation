revisions:
- from: അവർ കനാൻദേശത്തുള്ള യോർദാൻ പ്രദേശത്ത്[a] എത്തിയപ്പോൾ, രൂബേന്റെ പുത്രന്മാരും ഗാദിന്റെ പുത്രന്മാരും മനശ്ശെയുടെ പാതിഗോത്രവും അവിടെ യോർദാനരികെ ഒരു യാഗപീഠം പണിതു—കാഴ്ചയിൽ വളരെ വലുതായ ഒരു യാഗപീഠം.[b]
  to: അവർ കനാൻദേശത്തുള്ള യോർദാൻ പ്രദേശങ്ങളിൽ എത്തിയപ്പോൾ, രൂബേന്റെ പുത്രന്മാരും ഗാദിന്റെ പുത്രന്മാരും മനശ്ശെയുടെ പാതിഗോത്രവും അവിടെ യോർദാന്റെ അരികെ ഒരു യാഗപീഠം പണിതു—കാഴ്ചയിൽ വലിയ ഒരു യാഗപീഠം.[b]
