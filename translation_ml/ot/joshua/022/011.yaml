reference: Joshua 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഇങ്ങനെ പറയുന്നതായി കേട്ടു:[a] “ഇതാ, രൂബേൻമക്കളും ഗാദ്മക്കളും മനശ്ശെയുടെ പാതിഗോത്രവും കനാൻദേശത്തിന് എതിർവശത്ത്,[b] യോർദാന്റെ പ്രദേശങ്ങളിൽ,[c] ഇസ്രായേൽമക്കളുടെ വശത്ത്[d] യാഗപീഠം പണിതിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഇസ്രായേൽമക്കൾ കേട്ടു, ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്.” ഇവിടെ ഹീബ്രു പ്രയോഗം ഒരു റിപ്പോർട്ട് അവതരിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “കനാൻദേശത്തിന് അഭിമുഖമായി” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ “യോർദാന്റെ പ്രദേശങ്ങൾ/ജില്ലകൾ”; ഈ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്.
    reason: cultural_note
  - marker: d
    text: “ഇസ്രായേൽമക്കളുടെ വശത്ത്” എന്ന അവസാന ഭൂമിശാസ്ത്രപ്രയോഗം ദുഷ്കരമാണ്. അത് യോർദാന്റെ പടിഞ്ഞാറ് ഇസ്രായേൽമക്കൾക്കുള്ള വശത്തെയോ അവർക്കെതിർവശത്തുള്ള സ്ഥാനത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: ഇസ്രായേൽമക്കൾ ഇങ്ങനെ പറയുന്നതു കേട്ടു
  rationale: ശמע എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും לֵאמֹר അവതരിപ്പിക്കുന്ന റിപ്പോർട്ടിന്റെ പ്രവർത്തനവും നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ റിപ്പോർട്ട്-സൂത്രവാക്യമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ആവർത്തിക്കുന്ന കുടുംബ-ദേശീയ പ്രയോഗം സംക്ഷിപ്തവും മലയാള ബൈബിൾശൈലിയിൽ പരിചിതവുമായ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָנוּ
  choice: പണിതിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ ഈ ക്രിയാരൂപം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: ആ യാഗപീഠം
  rationale: ഹീബ്രുവിലെ നിർദ്ദിഷ്ടത സൂചിപ്പിക്കുകയും വിവരിക്കപ്പെടുന്ന പ്രത്യേക യാഗപീഠത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തിന് എതിർവശത്ത്
  rationale: מוּל സൂചിപ്പിക്കുന്ന സ്ഥാനപരമായ അഭിമുഖതയോ എതിർസ്ഥിതിയോ അനാവശ്യമായി കൃത്യമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: യോർദാന്റെ പ്രദേശത്ത്
  rationale: גְּלִילוֹת എന്നതിന്റെ ജില്ലകൾ/പ്രദേശങ്ങൾ എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ വശത്ത്
  rationale: ദിശ കൃത്യമായി നിർണ്ണയിക്കാതെ עֵבֶר എന്നതിന്റെ ‘വശം/അക്കരെ’ എന്ന ബന്ധപരമായ അർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠത്തിന്റെ ഉദ്ദേശ്യം
  choice: വാക്യത്തിൽ റിപ്പോർട്ട് ചെയ്യുന്ന നിർമാണം മാത്രം പ്രസ്താവിച്ചു
  alternative: ഇത് മത്സരയാഗപീഠമോ ആരാധനയ്ക്കുള്ള യാഗപീഠമോ എന്നു വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നില്ല; തുടർന്നുള്ള കഥാവിവരണം തീർപ്പാക്കേണ്ട സംഘർഷം വിവർത്തനം മുൻകൂട്ടി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യം. ‘ഇസ്രായേൽമക്കൾ’, ‘രൂബേൻമക്കൾ’, ‘ഗാദ്മക്കൾ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ ആവർത്തിക്കുന്ന בְנֵי പ്രയോഗം നിലനിർത്തുന്നു. ദുഷ്കരമായ അവസാന ഭൂമിശാസ്ത്രവാക്യം മുഖ്യപാഠത്തിൽ നിർബന്ധിതമായി വ്യാഖ്യാനിക്കാതെ അടിക്കുറിപ്പിൽ അതിന്റെ അനിശ്ചിതത്വം വ്യക്തമാക്കിയിരിക്കുന്നു.
