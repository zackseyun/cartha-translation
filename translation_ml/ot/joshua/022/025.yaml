source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: ml
  text: “യഹ്‌വേ യോർദാനെ ഞങ്ങൾക്കും നിങ്ങൾക്കും മധ്യേ അതിരായി നിശ്ചയിച്ചിരിക്കുന്നു, രൂബേന്റെ പുത്രന്മാരേ, ഗാദിന്റെ പുത്രന്മാരേ; യഹ്‌വേയിൽ നിങ്ങൾക്ക് ഒരു പങ്കുമില്ല[a]” എന്ന് നിങ്ങളുടെ പുത്രന്മാർ പറഞ്ഞേക്കാം. അങ്ങനെ അവർ ഞങ്ങളുടെ പുത്രന്മാർ യഹ്‌വേയെ ഭയപ്പെടാതിരിക്കുമാറ് ഇടയാക്കിയേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്‌വേയിൽ നിങ്ങൾക്ക് ഓഹരിയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: അതിരാക്കിയിരിക്കുന്നു
  rationale: גְּבוּל എന്നത് അതിരിനെയും נָתַן ഇവിടെ അതിരായി സ്ഥാപിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അതിരാക്കിയിരിക്കുന്നു’ ഈ സംയുക്താർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദാനെ
  rationale: നദിയുടെ പേരായ ‘യോർദാൻ’ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘നദി’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: രൂബേന്റെ പുത്രന്മാരേ, ഗാദിന്റെ പുത്രന്മാരേ
  rationale: בְּנֵי എന്ന സ്രോതസ്സിലെ ഗോത്രസംബോധന വ്യക്തമായി നിലനിർത്തി.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: യഹ്‌വേയിൽ നിങ്ങൾക്ക് ഒരു പങ്കുമില്ല
  rationale: חֵלֶק എന്നത് ‘പങ്ക്/ഓഹരി’ എന്നാണ്; ദൈവവുമായുള്ള ഉടമ്പടിപരമായ പങ്കാളിത്തത്തിന്റെ അർഥം അതിയായി വിശദീകരിക്കാതെ ‘പങ്ക്’ നിലനിർത്തുന്നു.
- source_word: וְהִשְׁבִּיתוּ
  choice: പിന്തിരിപ്പിച്ചേക്കാം
  rationale: שבת-ന്റെ ഹിഫീൽ രൂപത്തിലെ ‘നിർത്താൻ ഇടയാക്കുക’ എന്ന കാരണാർഥം, സന്ദർഭത്തിലെ ആശങ്കയോടുകൂടിയ സാധ്യതയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: യഹ്‌വേയെ ഭയപ്പെടുന്നതിൽനിന്ന്
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ബൈബിൾ പ്രയോഗം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: സ്രോതസ്സിലുള്ള ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: חֵלֶק בַּיהוָה എന്നതിന്റെ ഉടമ്പടിപരമായ അർഥം
  choice: യഹ്‌വേയിൽ ഒരു പങ്കുമില്ല
  alternative: യഹ്‌വേയിൽ ഓഹരിയില്ല / യഹ്‌വേയിൽ അവകാശമില്ല
  rationale: ‘അവകാശം’ അല്ലെങ്കിൽ ‘അവകാശഭൂമി’ എന്നു പറഞ്ഞ് അർഥം ചുരുക്കാതെ, പങ്കാളിത്തവും വിഹിതവും ഉൾക്കൊള്ളാവുന്ന സ്രോതസ്സിലെ വിശാലത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരിച്ച ഭാവിവാക്കും അതിന്റെ സാധ്യതയുള്ള ഫലവും വേർതിരിക്കാൻ രണ്ട് വാക്യങ്ങൾ ഉപയോഗിച്ചു; ‘പുത്രന്മാർ’ ഗോത്ര-തലമുറ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
