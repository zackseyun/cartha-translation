  text: וַֽ/יַּעֲנוּ֙ בְּנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֔ד וַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה וַֽ/יְדַבְּר֔וּ אֶת רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: ml
  text: 'അപ്പോൾ രൂബേന്റെ മക്കളും ഗാദിന്റെ മക്കളും മനശ്ശെയുടെ പാതിഗോത്രവും ഉത്തരം പറഞ്ഞ് ഇസ്രായേലിലെ കുലവിഭാഗങ്ങളുടെ തലവന്മാരോടു[a] സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ ആയിരങ്ങളുടെ തലവന്മാർ’; കുലപരമോ ഗോത്രപരമോ ആയ വിഭാഗങ്ങളുടെ നേതാക്കളെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ഉത്തരം പറഞ്ഞ്
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ഖാൽ രൂപത്തിലുള്ള ענה മുൻപുണ്ടായ ആരോപണത്തിനുള്ള മറുപടിയെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള וַיְדַבְּרוּ എന്ന ക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ വംശപരമായ ‘രൂബേന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന പ്രയോഗം സുതാര്യവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: וּבְנֵי גָד
  choice: ഗാദിന്റെ മക്കൾ
  rationale: മൂലഭാഷയിലെ കുടുംബ-വംശപരമായ പ്രയോഗം രൂബേനെക്കുറിച്ചുള്ള സമാന്തരവാക്യവുമായി ഒത്തുനിൽക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രം
  rationale: ഘടകപദക്രമത്തിന്റെ അർത്ഥം കൃത്യമായി നൽകുന്ന, മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: וַיְדַבְּרוּ
  choice: സംസാരിച്ചു
  rationale: דבר എന്നതിന്റെ ‘സംസാരിക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുകയും, ‘ഉത്തരം പറഞ്ഞു’ എന്ന മുൻക്രിയയെ ലയിപ്പിക്കാതെ എബ്രായത്തിലെ ഇരട്ട ആഖ്യാനരൂപം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ കുലവിഭാഗങ്ങളുടെ തലവന്മാരോട്
  rationale: רָאשֵׁי എന്നത് ‘തലവന്മാർ’ എന്നും אַלְפֵי എന്നത് അക്ഷരാർഥത്തിൽ ‘ആയിരങ്ങൾ’ എന്നും വരുന്നു; ഇവിടെ ഭരണപരമോ ഗോത്രപരമോ ആയ വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സാധ്യത വായനാസൗകര്യത്തോടെ നൽകാൻ ‘കുലവിഭാഗങ്ങൾ’ സ്വീകരിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ‘ഉത്തരം പറഞ്ഞു—സംസാരിച്ചു’ എന്ന രണ്ടു ക്രിയകളും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദത്തിനരികിലാണ് [a] ചേർത്തിരിക്കുന്നത്.
