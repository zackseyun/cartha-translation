id: JOS.22.24
reference: Joshua 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: ml
  text: 'അല്ല, ആശങ്കകൊണ്ടാണ് ഞങ്ങൾ ഇതു ചെയ്തത്. ഞങ്ങൾ ഇങ്ങനെ വിചാരിച്ചു: ‘വരുംകാലത്ത് നിങ്ങളുടെ മക്കൾ ഞങ്ങളുടെ മക്കളോട്, “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയുമായി നിങ്ങൾക്ക് എന്തു ബന്ധം?” എന്നു പറഞ്ഞേക്കാം.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: ആശങ്കകൊണ്ട്
  rationale: ഈ സംയുക്തപ്രയോഗം ഭയാശങ്കയിൽനിന്നോ ഉത്കണ്ഠയിൽനിന്നോ ചെയ്തതെന്ന ആശയം നൽകുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ കാരണം വ്യക്തമാക്കുന്നു.
- source_word: מָחָר
  choice: വരുംകാലത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നാളെ’ എന്നാണെങ്കിലും ഇവിടെ ഭാവിയിലെ ഒരു കാലത്തെ, പ്രത്യേകിച്ച് അടുത്ത തലമുറയുടെ കാലത്തെ, സൂചിപ്പിക്കുന്നു.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: യഹോവയുമായി നിങ്ങൾക്ക് എന്തു ബന്ധം?
  rationale: ‘നിങ്ങൾക്കും യഹോവയ്ക്കും എന്ത്?’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ബന്ധമോ അവകാശമോ നിഷേധിക്കുന്ന അർഥം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കിഴക്കൻ ഗോത്രങ്ങൾക്ക് യഹോവയുമായുള്ള ബന്ധം ചോദ്യം ചെയ്യുന്ന ഭാവിവാക്ക്
  choice: ‘യഹോവയുമായി നിങ്ങൾക്ക് എന്തു ബന്ധം?’ എന്ന തുറന്ന ചോദ്യരൂപം നിലനിർത്തി
  alternative: ‘യഹോവയിൽ നിങ്ങൾക്ക് യാതൊരു പങ്കുമില്ല’ എന്ന പ്രസ്താവന
  rationale: മൂലപാഠം ചോദ്യം രൂപത്തിലാണ്; അതിലുള്ള ബന്ധം, പങ്ക്, അവകാശം എന്നിവയുടെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രായത്തിലെ നിഷേധാത്മക ഊന്നൽ ‘അല്ല’ എന്നു നിലനിർത്തി; ദീർഘമായ വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു.
