source:
  edition: WLC
  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: ml
  text: അവർക്കുള്ള അവകാശം നറുക്കിലൂടെ നിശ്ചയിക്കപ്പെട്ടു; ഒമ്പത് ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനുമായി യഹ്‌വെ മോശ മുഖാന്തരം[a] കൽപിച്ചതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘മോശയുടെ കൈയാൽ’; മധ്യസ്ഥതയെയോ ഒരു വഴിയായുള്ള പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: നറുക്കിട്ട്
  rationale: בְּ എന്ന ഉപസർഗം മാർഗമോ രീതിയോ സൂചിപ്പിക്കുന്നു; ഭൂവിഭജനം നറുക്കെടുപ്പിലൂടെ നടന്നുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלָתָם
  choice: അവരുടെ അവകാശം
  rationale: നַחֲלָה ഇവിടെ നിയമിക്കപ്പെട്ട പാരമ്പര്യഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ സന്ദർഭത്തിൽ ചുരുക്കവും വ്യക്തവുമാണ്.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ ദൈവിക കല്പനയും ഇപ്പോഴത്തെ വിഭജനവും തമ്മിലുള്ള പൊരുത്തം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശ മുഖാന്തരം
  rationale: അക്ഷരാർഥത്തിൽ ‘മോശയുടെ കൈയാൽ’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം മധ്യസ്ഥതയെയോ ഏജൻസിയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഖാന്തരം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: ഒമ്പതു ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും
  rationale: לְ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു; מַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്നാണ്, അവസാനത്തെ ഏകവചനം ഒരു അരഗോത്രത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു; സ്വരീകരണത്തിലെ ചരിത്രപരമായ അനിശ്ചിതത്വം അംഗീകരിച്ചുകൊണ്ട് സാധാരണ പണ്ഡിതോപയോഗം പിന്തുടരുന്നു.
- issue: בְּיַד מֹשֶׁה എന്ന പ്രയോഗത്തിലെ മധ്യസ്ഥത
  choice: മോശ മുഖാന്തരം
  alternative: മോശയുടെ കൈയാൽ
  rationale: കല്പനയുടെ ഉറവിടം യഹ്‌വെയും അതിന്റെ മാനുഷിക മധ്യസ്ഥൻ മോശയുമാണെന്ന വ്യത്യാസം നിലനിർത്തുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യം ക്രിയാവിഹീനമായ സംക്ഷിപ്ത ഘടനയായതിനാൽ മലയാളത്തിൽ അർഥം പൂർത്തിയാക്കാൻ ‘നിർണയിച്ചത്’, ‘അത് നൽകി’ എന്നീ ക്രിയകൾ ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘മോശ മുഖാന്തരം’ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന വാക്യത്തിന്റെ അവസാനം വെച്ചു.
