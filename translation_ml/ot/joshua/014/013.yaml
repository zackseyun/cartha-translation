translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും ലാളിത്യവും ചേർന്ന മലയാളം. എബ്രായത്തിലെ സർവനാമം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും കാലേബ് തന്നെയാണ് അതിന്റെ വ്യക്തമായ സൂചിതൻ എന്നു അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
