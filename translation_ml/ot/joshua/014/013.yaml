source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ יְהוֹשֻׁ֑עַ וַ/יִּתֵּ֧ן אֶת חֶבְר֛וֹן לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה לְ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/013.yaml
  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: ml
  text: അപ്പോൾ യോശുവ അവനെ അനുഗ്രഹിച്ചു; യെഫുന്നെയുടെ മകനായ കാലേബിന് ഹെബ്രോൻ അവകാശമായി നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാലേബിനെ അനുഗ്രഹിച്ചു’; എബ്രായപാഠത്തിൽ ‘അവനെ അനുഗ്രഹിച്ചു’ എന്നാണ്. സന്ദർഭത്തിൽ ‘അവൻ’ കാലേബിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: അവനെ അനുഗ്രഹിച്ച്
  rationale: בּרך എന്ന ക്രിയയോടു ചേർന്ന മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം അക്ഷരാർഥത്തിൽ ‘അവനെ’ എന്നാണ്. സന്ദർഭത്തിൽ അത് കാലേബിനെ സൂചിപ്പിക്കുന്നതിനാൽ മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തി.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: וַיִּתֵּן
  choice: നൽകി
  rationale: נתן എന്ന സാധാരണ ‘കൊടുക്കുക/നൽകുക’ എന്ന ക്രിയയെ ഭൂവിഹിതം നൽകുന്ന സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: אֶת חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: אֶת എന്ന നേരിട്ടുള്ള കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; സ്ഥലനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകനായ കാലേബിന്
  rationale: לְ എന്നത് പരോക്ഷകർമം സൂചിപ്പിക്കുന്നു. ‘യെഫുന്നെയുടെ മകനായ കാലേബിന്’ എന്ന രൂപം വംശപരാമർശവും സ്വാഭാവിക മലയാള വാക്യക്രമവും നിലനിർത്തുന്നു.
- source_word: לְנַחֲלָה
  choice: അവകാശമായി
  rationale: נַחֲלָה ഇവിടെ ഇസ്രായേലിലെ ഭൂവിഹിതമായി ലഭിക്കുന്ന പാരമ്പര്യാവകാശത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശമായി’ എന്നത് അതിന്റെ നിയമപരവും ഭൂവിഹിതപരവുമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
