revisions:
- from: എന്നോടൊപ്പം പോയ എന്റെ സഹോദരന്മാർ ജനത്തിന്റെ ഹൃദയം ഉരുക്കിക്കളഞ്ഞു; എന്നാൽ ഞാൻ എന്റെ ദൈവമായ യഹോവയെ പൂർണമായി അനുഗമിച്ചു.
  to: എന്നോടൊപ്പം പോയ എന്റെ സഹോദരന്മാർ ജനത്തിന്റെ ഹൃദയം ഉരുകിപ്പോകുമാറാക്കി; എന്നാൽ ഞാൻ എന്റെ ദൈവമായ യഹോവയെ പൂർണമായി അനുഗമിച്ചു.
