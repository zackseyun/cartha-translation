  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: ml
  text: മോശെ എന്നെ അയച്ച ദിവസത്തിൽ ഞാൻ എത്ര ശക്തനായിരുന്നോ, അത്രതന്നെ ശക്തനാണ് ഇന്നും ഞാൻ. അന്നത്തെ എന്റെ ശക്തി എങ്ങനെയായിരുന്നോ, ഇന്നും എന്റെ ശക്തി അതുപോലെയാണ്—യുദ്ധത്തിനും പുറത്തുപോകാനും അകത്തുവരാനും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറത്തുപോകുകയും അകത്തുവരുകയും ചെയ്യുക’ എന്നത് സജീവമായി പ്രവർത്തിക്കാനുള്ള പൂർണ ശേഷിയെ സൂചിപ്പിക്കുന്ന ഒരു ഹീബ്രു പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: ഇന്നും ഞാൻ ശക്തനാണ്
  rationale: עוֹדֶנִּי എന്നതിലെ തുടർച്ചയുടെ ആശയം ‘ഇന്നും’ സ്വാഭാവികമായി അറിയിക്കുന്നു; חָזָק ഇവിടെ ശാരീരിക ശക്തിയെയും പ്രവർത്തനക്ഷമതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: മോശെ എന്നെ അയച്ച ദിവസത്തെപ്പോലെ
  rationale: ഹീബ്രു താരതമ്യവും നിർദിഷ്ടമായ കാലസൂചനയും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: അന്ന് എനിക്കുണ്ടായിരുന്ന അതേ ശക്തി ഇന്നും എനിക്കുണ്ട്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു സമാന്തരഘടനയുടെ അന്നും ഇന്നും തമ്മിലുള്ള തുല്യത വ്യക്തമായി പകരുന്നു; ആശയത്തിൽ ഇല്ലാത്ത വർധനയോ ക്ഷയമോ ചേർക്കുന്നില്ല.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാനും
  rationale: വ്യക്തിപരമായ യുദ്ധസജ്ജതയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: പുറത്തുപോകാനും അകത്തുവരാനും
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ക്രമവും സംരക്ഷിക്കുന്നു; അതിന്റെ വിശാലമായ സാംസ്കാരിക അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആദ്യവാക്യത്തിലെ നേരിട്ടുള്ള താരതമ്യവും രണ്ടാംവാക്യത്തിലെ അന്ന്–ഇന്ന് സമാന്തരതയും നിലനിർത്തി; അവസാനത്തെ ഹീബ്രു ശൈലിപ്രയോഗം മുഖ്യവാചകത്തിൽ അക്ഷരാർഥത്തോട് അടുത്തുവെച്ച് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
