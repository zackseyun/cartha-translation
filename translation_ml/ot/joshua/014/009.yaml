revisions:
- from: 'അന്നു മോശ ശപഥം ചെയ്ത് പറഞ്ഞു: “നിന്റെ കാൽ ചവിട്ടിയ ദേശം തീർച്ചയായും[a] നിനക്കും നിന്റെ പുത്രന്മാർക്കും[b] എന്നേക്കും അവകാശമായിരിക്കും; കാരണം നീ എന്റെ ദൈവമായ യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചു.”'
  to: 'അന്നു മോശെ ശപഥം ചെയ്ത് പറഞ്ഞു: “നിന്റെ കാൽ ചവിട്ടിയ ദേശം തീർച്ചയായും[a] നിനക്കും നിന്റെ പുത്രന്മാർക്കും[b] എന്നേക്കും അവകാശമായിരിക്കും; കാരണം നീ എന്റെ ദൈവമായ യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചു.”'
  rationale: മോശെയുടെ പേര് ആധുനിക നിലവാരമലയാളത്തിലെ ‘മോശെ’ എന്നു തിരുത്തി. ശപഥസൂത്രമായ אִם לֹא സംബന്ധിച്ച അടിക്കുറിപ്പ് അക്ഷരാർഥത്തിലും പ്രയോഗാർഥത്തിലും കൂടുതൽ കൃത്യമാക്കി. വാക്യത്തിന്റെ അർഥമോ വിവർത്തനനയമോ മാറ്റിയിട്ടില്ല.
