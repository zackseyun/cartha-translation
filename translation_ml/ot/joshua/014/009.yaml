id: JOS.14.9
reference: Joshua 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: ml
  text: 'അന്നു മോശെ ശപഥം ചെയ്ത് പറഞ്ഞു: “നിന്റെ കാൽ ചവിട്ടിയ ദേശം തീർച്ചയായും[a] നിനക്കും നിന്റെ പുത്രന്മാർക്കും[b] എന്നേക്കും അവകാശമായിരിക്കും; കാരണം നീ എന്റെ ദൈവമായ യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “അങ്ങനെയല്ലെങ്കിൽ” (അഥവാ “if not”) എന്നതാണ്; ഇവിടെ അത് ശപഥത്തിലെ ഉറപ്പിനെ ഊന്നുന്ന സൂത്രവാക്യമാണ്. അതിനാൽ “തീർച്ചയായും” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്റെ സന്തതിക്കും.” എബ്രായപാഠത്തിൽ “നിന്റെ പുത്രന്മാർക്കും” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ശപഥം ചെയ്ത്
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע എന്ന ക്രിയയുടെ ‘ശപഥം ചെയ്യുക’ എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നു
  rationale: ‘ആ ദിവസം’ എന്ന കാലസൂചനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִם לֹא
  choice: തീർച്ചയായും
  rationale: ഇവിടെ ഇത് യഥാർഥ നിബന്ധനയല്ല, ശപഥത്തിലെ ഉറപ്പുനൽകുന്ന ഊന്നൽപ്രയോഗമാണ്.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: നിന്റെ കാൽ ചവിട്ടിയ ദേശം
  rationale: ദർശിച്ച ദേശത്തിൽ കാലുകുത്തിയതിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ സജീവമായ ദൃശ്യരൂപവും ഏകവചനമായ ‘കാൽ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: നിനക്ക് അവകാശമായിരിക്കും
  rationale: נַחֲלָה എന്നത് ലഭിക്കുന്ന പാരമ്പര്യസ്വത്തെയോ ഭൂവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ മലയാളത്തിൽ ഈ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וּלְבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാർക്കും
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; വിശാലമായ ‘സന്തതി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നീണ്ടുനിൽക്കുന്ന കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: കാരണം നീ ... പൂർണമായി അനുഗമിച്ചു
  rationale: מלא אחרי എന്ന ‘പൂർണമായി/മുഴുവനായി പിന്തുടരുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהָי
  choice: എന്റെ ദൈവമായ
  rationale: മോശ സംസാരിക്കുന്നതിലെ ഒന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്തു.
- issue: וּלְבָנֶיךָ എന്ന ലിംഗസൂചക പദം
  choice: നിന്റെ പുത്രന്മാർക്കും
  alternative: നിന്റെ മക്കൾക്കും; നിന്റെ സന്തതിക്കും
  rationale: എബ്രായത്തിലെ ‘നിന്റെ പുത്രന്മാർ’ എന്ന വ്യക്തമായ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും സന്ദർഭപരമായി വിശാലമാകാവുന്ന അർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
- issue: אִם לֹא എന്ന ശപഥസൂത്രം
  choice: തീർച്ചയായും
  alternative: അല്ലെങ്കിൽ; നിശ്ചയമായും
  rationale: വാക്യത്തിന്റെ ഉപാധിയായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ, ശപഥത്തിൽ ഉറപ്പിനെ ഊന്നുന്ന ഇതിന്റെ പ്രയോഗാർഥം പ്രധാനപാഠത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ശപഥത്തിന്റെ ഗൗരവം, ഭൂമിയുടെ അവകാശസ്വഭാവം, ദൈവനാമം, ‘എന്റെ ദൈവം’ എന്ന വ്യക്തിപരമായ രൂപം എന്നിവ നിലനിർത്തി.
