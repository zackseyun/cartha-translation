source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: ml
  text: എനിക്ക് നാല്പത് വയസ്സുള്ളപ്പോൾ, യഹ്‌വെയുടെ ദാസനായ മോശെ ദേശം ഒറ്റുനോക്കാൻ എന്നെ കാദേശ്-ബർന്നേയയിൽനിന്ന് അയച്ചു. എന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നതുപോലെ ഞാൻ അവന് തിരികെ വിവരം അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരുന്നതിന് ഒത്തവണ്ണം ഞാൻ അവന് തിരികെ വിവരം അറിയിച്ചു.”
    reason: כַּאֲשֶׁר עִם לְבָבִי എന്ന എബ്രായപ്രയോഗം കാലേബിന്റെ ഉള്ളിലെ ചിന്തയോ വിലയിരുത്തലോ സൂചിപ്പിക്കാം; മുഖ്യപാഠം ഹൃദയരൂപകം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: എനിക്ക് നാല്പതു വയസ്സുള്ളപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘നാല്പതു വയസ്സിന്റെ മകൻ’ എന്നുള്ള എബ്രായ പ്രായപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בִּשְׁלֹחַ
  choice: അയച്ചു
  rationale: ב ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘...വയസ്സുള്ളപ്പോൾ ... അയച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വെയുടെ ദാസൻ
  rationale: മോശെയുടെ ദൈവബന്ധമായ ഔദ്യോഗികവും ആദരണീയവുമായ വിശേഷണം നിലനിർത്തുന്നു; עֶבֶד ഇവിടെ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ എന്നാണ് സന്ദർഭോചിതം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയിൽനിന്ന്
  rationale: സംയുക്ത സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്ത്, מִן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽസ്ഥലം വ്യക്തമായി നൽകുന്നു.
- source_word: לְרַגֵּל אֶת הָאָרֶץ
  choice: ദേശം ഒറ്റുനോക്കാൻ
  rationale: רגל എന്ന ക്രിയയുടെ രഹസ്യാന്വേഷണവും സൂക്ഷ്മപരിശോധനയും ഉൾക്കൊള്ളുന്ന അർഥം, അതിനെ വെറും ‘സന്ദർശിക്കുക’ എന്നാക്കി ദുർബലപ്പെടുത്താതെ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: ഞാൻ അവന് വിവരം കൊണ്ടുവന്നു
  rationale: שׁוּב + വ്യക്തികർമം + דָּבָר എന്ന പ്രയോഗം ഇവിടെ ഒരു വിവരം അഥവാ റിപ്പോർട്ട് തിരികെ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വിവരം കൊണ്ടുവന്നു’ സ്വാഭാവികമാണ്.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: എന്റെ ഹൃദയത്തിലുള്ളതുപോലെ
  rationale: കാലേബിന്റെ ഉള്ളിലെ ബോധ്യത്തോടോ വിലയിരുത്തലോടോ ഉള്ള പൊരുത്തം സൂചിപ്പിക്കുന്ന ഹൃദയരൂപകം നിലനിർത്തുന്നു; ‘പൂർണസത്യസന്ധതയോടെ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹ്‌വെ’ മൂലനാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: כַּאֲשֶׁר עִם לְבָבִי എന്നതിൽ കാലേബിന്റെ ഉദ്ദേശ്യം
  choice: എന്റെ ഹൃദയത്തിലുള്ളതുപോലെ
  alternative: പൂർണസത്യസന്ധതയോടെ; എന്റെ മനസ്സിലെ ബോധ്യത്തിനൊത്ത്
  rationale: വാക്യം സത്യസന്ധതയെയോ ആത്മാർഥതയെയോ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ ഒരു നിർദിഷ്ട നൈതിക അവകാശവാദമായി ചുരുക്കാതെ മൂലത്തിലെ ഹൃദയരൂപകവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഹൃദയം’ എന്ന ബൈബിൾരൂപകം നിലനിർത്തിയെങ്കിലും ആശയക്കുഴപ്പം കുറയ്ക്കാൻ അടിക്കുറിപ്പിൽ കൂടുതൽ നേരിട്ടൊരു വ്യാഖ്യാനം നൽകി. സ്ഥലനാമം വായിക്കാൻ എളുപ്പമുള്ള മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
