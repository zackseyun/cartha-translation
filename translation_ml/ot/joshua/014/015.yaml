base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: ml
  text: ഹെബ്രോന്റെ പഴയ പേര് കിര്യത്ത്-അർബാ[a] എന്നായിരുന്നു; അർബാ അനാക്യരിൽ ഏറ്റവും മഹാനായ മനുഷ്യനായിരുന്നു[b]. ദേശത്തിനു യുദ്ധത്തിൽനിന്ന് സ്വസ്ഥത ലഭിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിര്യത്ത്-അർബാ’ എന്നതിന് ‘അർബായുടെ നഗരം’ എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അനാക്യരിലെ മഹാനായ മനുഷ്യൻ’; അർബാ അനാക്യരുമായി ബന്ധപ്പെട്ട ഏറ്റവും പ്രമുഖനായ വ്യക്തിയായിരുന്നു എന്ന് ഹീബ്രു സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘ദേശം യുദ്ധത്തിൽനിന്ന് ശാന്തമായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: ഹെബ്രോന്റെ പഴയ പേര്
  rationale: שֵׁם എന്നത് ‘പേര്’ എന്നും לְפָנִים എന്നത് ‘മുമ്പ്/പണ്ട്’ എന്നും അർഥമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ‘പഴയ പേര്’ എന്നു ചേർത്തു; വാക്യാരംഭത്തിലെ וְ പ്രത്യേകമായി വിവർത്തനം ചെയ്യാതെ ആഖ്യാനബന്ധം നിലനിർത്തി.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബാ
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു. അതിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הָ/אָדָם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא
  choice: അർബാ അനാക്യരിൽ ഏറ്റവും മഹാനായ മനുഷ്യനായിരുന്നു
  rationale: הוּא സൂചിപ്പിക്കുന്ന വ്യക്തിയെ സന്ദർഭത്തിൽനിന്ന് ‘അർബാ’ എന്നു വ്യക്തമാക്കുന്നു. നിർദിഷ്ടമായ הַגָּדוֹל അനാക്യരുടെ ഇടയിലെ മുൻനിരസ്ഥാനം സൂചിപ്പിക്കാമെന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ഏറ്റവും മഹാനായ’ എന്നു നൽകി; ‘മഹാനായ മനുഷ്യൻ’ എന്ന കുറച്ച് നിർണ്ണായകമല്ലാത്ത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה
  choice: ദേശത്തിനു യുദ്ധത്തിൽനിന്ന് സ്വസ്ഥത ലഭിച്ചു
  rationale: שׁקט എന്ന ക്രിയയുടെ ശാന്തത/സ്വസ്ഥത എന്ന ഭാവവും מִן സൂചിപ്പിക്കുന്ന യുദ്ധത്തിൽനിന്നുള്ള വിടുതലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അർബായുടെ സ്ഥാനത്തെക്കുറിച്ചുള്ള הָאָדָם הַגָּדוֹל എന്ന പ്രയോഗം
  choice: അനാക്യരിൽ ഏറ്റവും മഹാനായ മനുഷ്യൻ
  alternative: അനാക്യരിലെ മഹാനായ മനുഷ്യൻ
  rationale: ഹീബ്രു പ്രയോഗം അർബായുടെ പ്രമുഖത്വം സൂചിപ്പിക്കുന്നു; എന്നാൽ അത് നിർബന്ധമായും താരതമ്യത്തിലെ പരമപദമാണോ എന്നതിൽ ചെറിയ അവ്യക്തതയുള്ളതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കിര്യത്ത്-അർബാ’ എന്ന സ്ഥലനാമവും ‘അനാക്യർ’ എന്ന ജനവിഭാഗനാമവും മൂലഭാഷയോട് ചേർന്ന ലിപ്യന്തരണമായി നിലനിർത്തി; യഥാർത്ഥത്തിലെ അർഥവൈവിധ്യം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
