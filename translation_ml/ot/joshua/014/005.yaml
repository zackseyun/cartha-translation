id: JOS.14.5
reference: Joshua 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: ml
  text: യഹോവ മോശയോടു കല്പിച്ചിരുന്നതുപോലെതന്നെ ഇസ്രായേൽമക്കൾ ചെയ്തു, അവർ ദേശം വിഭജിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പനയും ഇസ്രായേലിന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്ന പ്രയോഗം; כֵּן എന്നതിന്റെ ആശയവും സ്വാഭാവികമായി ഇതോടൊപ്പം പ്രകടമാകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവം കല്പന നൽകുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാള ബൈബിൾഭാഷയിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת־מֹשֶׁה
  choice: മോശയോടു
  rationale: צוה എന്ന ക്രിയയിൽ കല്പന ലഭിക്കുന്ന വ്യക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സമ്പ്രദാനരൂപത്തിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: כֵּן עָשׂוּ
  choice: അതുപോലെതന്നെ ... ചെയ്തു
  rationale: മൂലത്തിലെ ലളിതമായ ‘ചെയ്തു’ എന്ന ക്രിയയും കല്പനയോടുള്ള പൊരുത്തവും സംരക്ഷിക്കുന്നു; കർമ്മം അനാവശ്യമായി പൂരിപ്പിക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രു സമൂഹസൂചക പ്രയോഗത്തിന്റെ രൂപവും കോർപ്പറേറ്റ് അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּחְלְקוּ
  choice: പങ്കിട്ടെടുത്തു
  rationale: അവകാശഭൂമി വിവിധ വിഭാഗങ്ങൾക്കായി വിഭജിച്ചു ലഭ്യമാക്കുന്ന സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘വിഭജിച്ചു’ എന്നതിനെക്കാൾ ഭൂവിഹിതത്തിന്റെ ആശയം നന്നായി നൽകുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: യോശുവയുടെ സന്ദർഭത്തിൽ കനാൻ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആഗോളമായ ‘ഭൂമി’ എന്ന അർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റാതെ നിലനിർത്തുന്നു. മലയാളത്തിൽ ഏറെ പരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചെങ്കിലും, ഹീബ്രു ഉച്ചാരണത്തിന്റെ പുനർനിർമാണമായി ‘യാഹ്‌വേ’യും സാധുവായ മറ്റൊരു രൂപമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധസൂചക രൂപം സംരക്ഷിക്കുമ്പോഴും, മുഴുവൻ ഇസ്രായേൽജനത്തെ ഉദ്ദേശിക്കുന്ന സമൂഹസൂചക അർഥം മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘കല്പിച്ചതുപോലെതന്നെ ... ചെയ്തു’ എന്ന ഘടന ഹീബ്രുവിലെ כַּאֲשֶׁר ... כֵּן എന്ന പരസ്പരബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് marker വാചകസ്ഥാനവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ആവർത്തിച്ചിട്ടില്ല; മലയാളത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ തന്നെ മൂലരൂപവും സമൂഹസൂചക അർഥവും മതിയായ രീതിയിൽ വഹിക്കുന്നു.
