- from: യഹോവ മോശയോടു കല്പിച്ചതുപോലെതന്നെ ഇസ്രായേൽമക്കൾ ചെയ്തു; അവർ ദേശം പങ്കിട്ടെടുത്തു.
  to: യഹോവ മോശയോടു കല്പിച്ചിരുന്നതുപോലെതന്നെ ഇസ്രായേൽമക്കൾ ചെയ്തു, അവർ ദേശം വിഭജിച്ചു.
