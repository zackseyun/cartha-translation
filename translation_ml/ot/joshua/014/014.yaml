  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: ml
  text: അതുകൊണ്ട് ഹെബ്രോൻ കെനിസ്യനായ യെഫുന്നെയുടെ മകൻ കാലേബിന് അവകാശമായിത്തീർന്നു; ഇന്നുവരെയും അത് അങ്ങനെതന്നെ തുടരുന്നു. കാരണം അവൻ ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വെയെ പൂർണഹൃദയത്തോടെ അനുഗമിച്ചു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘യാഹ്‌വെയുടെ പിന്നാലെ നിറയ്ക്കുക’ എന്ന ശൈലിയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അത് സമ്പൂർണമായ വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
