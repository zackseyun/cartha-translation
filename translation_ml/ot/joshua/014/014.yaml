  rationale: ആഖ്യാതാവിന്റെ കാലംവരെ ആ അവകാശസ്ഥിതി തുടർന്നുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יַעַן אֲשֶׁר
