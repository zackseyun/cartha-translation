theological_decisions:
- issue: יְהוָה എന്ന ദൈവിക നാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: מִלֵּא אַחֲרֵי എന്ന പ്രയോഗത്തിലെ അനുസരണവും വിശ്വസ്തതയും
  choice: പൂർണമായി അനുഗമിച്ചു
  alternative: പൂർണഹൃദയത്തോടെ അനുസരിച്ചു
  rationale: ഈ ശൈലി സമ്പൂർണമായ വിശ്വസ്തതയും അനുസരണവും ഉൾക്കൊള്ളുന്നു. മുഖ്യപാഠത്തിൽ പിന്തുടരൽരൂപകം നിലനിർത്തുകയും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭൂമി വിഭജിക്കുന്ന സന്ദർഭത്തിലെ ‘അവകാശം’ എന്ന പദവും ദൈവത്തെ ‘അനുഗമിക്കുക’ എന്ന ബൈബിൾരൂപകവും നിലനിർത്തി. ദീർഘമായ എബ്രായ വാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
