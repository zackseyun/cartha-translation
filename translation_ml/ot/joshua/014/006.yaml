  to: 'പിന്നെ യെഹൂദയുടെ പുത്രന്മാർ ഗിൽഗാലിൽ യോശുവയുടെ അടുക്കൽ വന്നു. കെനിസ്യനായ യെഫുന്നെയുടെ മകൻ കാലേബ് അവനോടു പറഞ്ഞു: “എന്നെയും നിന്നെയും സംബന്ധിച്ച് കാദേശ്-ബർന്നേയയിൽവെച്ച് ദൈവപുരുഷനായ മോശെയോടു യാഹ്‌വേ പറഞ്ഞ വചനം[a] നിനക്കറിയാം.”'
