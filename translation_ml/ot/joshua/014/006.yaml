  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: ml
  text: 'പിന്നെ യെഹൂദയുടെ പുത്രന്മാർ ഗിൽഗാലിൽ യോശുവയുടെ അടുക്കൽ വന്നു. കെനിസ്യനായ യെഫുന്നെയുടെ മകൻ കാലേബ് അവനോടു പറഞ്ഞു: “എന്നെയും നിന്നെയും സംബന്ധിച്ച് കാദേശ്-ബർന്നേയയിൽവെച്ച് ദൈവപുരുഷനായ മോശെയോടു യാഹ്‌വേ പറഞ്ഞ വചനം[a] നിനക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാര്യം” അല്ലെങ്കിൽ “വിഷയം.”
    reason: ഹീബ്രായ הַדָּבָר എന്ന പദത്തിന് ‘വചനം,’ ‘കാര്യം,’ ‘വിഷയം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; ഇവിടെ ദൈവം പറഞ്ഞ പ്രത്യേക പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നതിനാൽ പ്രധാനപാഠത്തിൽ ‘വചനം’ ഉപയോഗിച്ചിരിക്കുന്നു.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: അടുക്കൽ വന്നു
  rationale: נגשׁ എന്ന ക്രിയയുടെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന ചലനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ഗോത്ര-കുടുംബ പ്രയോഗവും മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: בַּגִּלְגָּל
  choice: ഗിൽഗാലിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള സ്വാഭാവിക മലയാള സ്ഥാനസൂചക രൂപം.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: കെനിസ്യനായ യെഫുന്നെയുടെ മകൻ കാലേബ്
  rationale: വ്യക്തിനാമങ്ങളും കെനിസ്യൻ എന്ന വംശ/കുലവിശേഷണവും നിലനിർത്തി, മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: אַתָּה יָדַעְתָּ
  choice: നിനക്കറിയാമല്ലോ
  rationale: സംബോധിതന് ഇതിനകം അറിയാവുന്ന കാര്യം ഓർമിപ്പിക്കുന്ന വാക്യപ്രയോഗത്തിന്റെ പ്രസക്തിബലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: ഇവിടെ ദൈവം പറഞ്ഞ പ്രത്യേക പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വചനം’ യോജിക്കുന്നു; ‘കാര്യം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דִּבֶּר יְהוָה
  choice: യഹോവ അരുളിച്ചെയ്ത
  rationale: ദൈവിക പ്രസംഗത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാള പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷനായ മോശ
  rationale: ‘ദൈവത്തിന്റെ പുരുഷൻ’ എന്ന പദവിയുടെ അർഥവും ഔപചാരിക സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: എന്നെയും നിന്നെയും സംബന്ധിച്ച്
  rationale: രണ്ടുപേരെയും കുറിച്ചുള്ള പ്രസ്താവനയെന്ന അർഥം കൃത്യമായി നൽകുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയിൽവെച്ച്
  rationale: പ്രസംഗസംഭവം നടന്ന സ്ഥലമെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം ഒരു പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
- issue: בְנֵי יְהוּדָה എന്ന ഗോത്രവിശേഷണം
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  alternative: യെഹൂദാഗോത്രക്കാർ
  rationale: മൂലത്തിലെ പുത്രന്മാർ എന്ന കുടുംബ/ഗോത്രരൂപകവും പുരുഷലിംഗ സൂചനയും സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഗോത്രക്കാർ എന്ന രൂപം സ്വീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പേരുകളിൽ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ സ്വീകരിച്ചു. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘നിനക്കറിയാമല്ലോ’ എന്ന സ്വാഭാവിക ഓർമിപ്പിക്കൽപ്രയോഗം ഉപയോഗിച്ചു; മൂലത്തിലെ അർഥദ്വയത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
