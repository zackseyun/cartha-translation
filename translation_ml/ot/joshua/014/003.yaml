  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: ml
  text: എന്തെന്നാൽ, യോർദ്ദാനക്കരെ രണ്ടു ഗോത്രങ്ങൾക്കും അരഗോത്രത്തിനും മോശെ ഭൂവിഭാഗം നൽകിയിരുന്നു; എന്നാൽ ലേവ്യർക്ക് അവരുടെ ഇടയിൽ ഭൂവിഭാഗം നൽകിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: נָתַן
  choice: നൽകിയിരുന്നു
  rationale: വിവരണത്തിലെ ഇപ്പോഴത്തെ ഘട്ടത്തിനു മുമ്പ് മോശെ നടത്തിയ ഭൂവിഭജനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മുൻകാലപ്രവൃത്തിയുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלַת / נַחֲלָה
  choice: അവകാശം
  rationale: ഗോത്രങ്ങൾക്ക് ലഭിച്ച പാരമ്പര്യ ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിന്റെ ഇരുഭാഗത്തും ഒരേ പദം നിലനിർത്തുന്നു.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: രണ്ടു ഗോത്രങ്ങൾ
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നും അർഥമുണ്ടെങ്കിലും ഭൂവിഭജനസന്ദർഭത്തിൽ ഇവിടെ ‘ഗോത്രം’ തന്നെയാണ് ഉദ്ദേശ്യം.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: അരഗോത്രം
  rationale: മനശ്ശെയുടെ അരഗോത്രത്തെ സൂചിപ്പിക്കുന്ന ഭൂവിഭജനപ്രയോഗം സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ ദിശാസംബന്ധമായ സ്വാഭാവിക അസ്പഷ്ടത നിലനിർത്തുന്നു; മറ്റൊരു സ്വാഭാവിക വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְלַלְוִיִּם
  choice: എന്നാൽ ലേവ്യർക്ക്
  rationale: വാവ് എന്ന ബന്ധകം അടിസ്ഥാനത്തിൽ ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും ഇവിടെ മറ്റു ഗോത്രങ്ങൾക്കു ലഭിച്ച അവകാശവും ലേവ്യർക്ക് ലഭിക്കാത്തതും തമ്മിലുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: לֹא נָתַן נַחֲלָה
  choice: അവകാശം നൽകിയില്ല
  rationale: നിഷേധവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്യുകയും മുമ്പത്തെ ‘അവകാശം’ എന്ന പദപ്രയോഗം ആവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ
  rationale: മറ്റു ഗോത്രങ്ങളുടെ ഇടയിൽ ലേവ്യർക്ക് സാധാരണ ഗോത്രഭൂവിഹിതം ലഭിച്ചില്ലെന്ന വാക്യത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലേവ്യർക്ക് അവകാശം ലഭിച്ചില്ല എന്നതിന്റെ സ്വഭാവം
  choice: മറ്റു ഗോത്രങ്ങളുടെ ഇടയിൽ ലേവ്യർക്ക് ഗോത്രപരമായ ഭൂവിഹിതം നൽകിയില്ലെന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ലേവ്യർക്ക് യാതൊരു തരത്തിലുള്ള അവകാശമോ കരുതലോ ലഭിച്ചില്ലെന്ന സമ്പൂർണ നിഷേധമായി വായിക്കുക.
  rationale: ‘അവരുടെ ഇടയിൽ’ എന്ന പദപ്രയോഗം നിലനിർത്തുന്നതിലൂടെ ഭൂവിഹിതത്തെക്കുറിച്ചുള്ള സന്ദർഭപരമായ പരിധി വാക്യം തന്നെയായി പ്രകടമാകുന്നു; ലേവ്യർക്കു ലഭിച്ച പട്ടണങ്ങളെയോ യഹോവ അവരുടെ അവകാശമാണെന്ന മറ്റു വചനങ്ങളെയോ ഇവിടെ അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഭൂവിഭജനസന്ദർഭത്തിന് യോജിച്ച ‘അവകാശം’, ‘ഗോത്രം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഭൂമിശാസ്ത്രപരമായ ദൃഷ്ടികോണാസ്പഷ്ടത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
