revisions:
- from: യോസേഫിന്റെ സന്തതികൾ മനശ്ശെയും എഫ്രയീമും എന്നിങ്ങനെ രണ്ടു ഗോത്രങ്ങളായിരുന്നു.[a] ലേവ്യർക്കു ദേശത്തിൽ ഒരു ഓഹരിയും നൽകിയില്ല; താമസിക്കാനുള്ള പട്ടണങ്ങളും അവരുടെ കന്നുകാലികൾക്കും മറ്റു സ്വത്തുക്കൾക്കും വേണ്ടിയുള്ള ആ പട്ടണങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങളും മാത്രമാണ് നൽകിയത്.[b]
  to: യോസേഫിന്റെ സന്തതികൾ മനശ്ശെയും എഫ്രയീമും എന്ന രണ്ടു ഗോത്രങ്ങളായിരുന്നതിനാൽ, ലേവ്യർക്കു ദേശത്തിൽ ഒരു ഓഹരിയും നൽകിയില്ല; താമസിക്കാൻ പട്ടണങ്ങളും അവരുടെ കന്നുകാലികൾക്കും സ്വത്തിനും വേണ്ടിയുള്ള ആ പട്ടണങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങളും മാത്രമാണ് നൽകിയത്.[a][b]
  rationale: The revision explicitly carries the Hebrew explanatory connector כִּי, retains the exception structure (‘only cities ... and their pasturelands’), and removes the unsupported qualifier ‘other’ from the final term. Footnote anchors have been retained and placed at the end of the complete sentence, with footnote a supporting ‘സന്തതികൾ’ and footnote b supporting ‘മേച്ചിൽപ്പുറങ്ങൾ.’
