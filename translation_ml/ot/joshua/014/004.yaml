source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: ml
  text: യോസേഫിന്റെ സന്തതികൾ മനശ്ശെയും എഫ്രയീമും എന്ന രണ്ടു ഗോത്രങ്ങളായിരുന്നതിനാൽ, ലേവ്യർക്കു ദേശത്തിൽ ഒരു ഓഹരിയും നൽകിയില്ല; താമസിക്കാൻ പട്ടണങ്ങളും അവരുടെ കന്നുകാലികൾക്കും സ്വത്തിനും വേണ്ടിയുള്ള ആ പട്ടണങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങളും മാത്രമാണ് നൽകിയത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘യോസേഫിന്റെ പുത്രന്മാർ രണ്ടു ഗോത്രങ്ങളായിരുന്നു.’ ഇവിടെ ‘പുത്രന്മാർ’ എന്നത് യോസേഫിന്റെ ഗോത്രസന്തതികളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നത് ലേവ്യപട്ടണങ്ങളെ ചുറ്റിയിരുന്ന തുറന്ന ഭൂമിയാണ്; പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കുന്നതിനും മറ്റു ആവശ്യങ്ങൾക്കും അത് ഉപയോഗിച്ചിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം (മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി പ്രത്യേകം പദമില്ലാതെ)
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധമാണ്; മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ ആദ്യ പ്രസ്താവന തന്നെയാണ് ആ വിശദീകരണം നൽകുന്നത്.
- source_word: בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ സന്തതികൾ
  rationale: അക്ഷരാർഥമായ ‘പുത്രന്മാർ’ എന്നതിനെക്കാൾ ഇവിടെ ഉദ്ദേശിക്കുന്നത് യോസേഫിൽനിന്നുള്ള ഗോത്രസന്തതികളാണെന്ന് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שְׁנֵי מַטּוֹת
  choice: രണ്ടു ഗോത്രങ്ങൾ
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ מַטּוֹת എന്നത് വടികളെയല്ല, ഗോത്രവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: മനശ്ശെയും എഫ്രയീമും
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: ഒരു ഓഹരിയും നൽകിയില്ല
  rationale: ഹീബ്രുവിലെ സജീവക്രിയാരൂപവും ഭൂവിഭജനത്തിലെ പങ്ക് എന്ന അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: ലേവിയുടെ ഗോത്രത്തിൽപ്പെട്ടവരെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം.
- source_word: בָּאָרֶץ
  choice: ദേശത്തിൽ
  rationale: വിഭജിച്ചുനൽകപ്പെടുന്ന വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי אִם
  choice: മാത്രമാണ്
  rationale: ഭൂമിയിലെ ഗോത്രഓഹരി നിഷേധിച്ചതിനു പിന്നാലെ അനുവദിച്ച അപവാദത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָרִים לָשֶׁבֶת
  choice: താമസിക്കാനുള്ള പട്ടണങ്ങൾ
  rationale: പട്ടണങ്ങൾ നൽകിയതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഹീബ്രു അനന്തക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: מִגְרְשֵׁיהֶם
  choice: ആ പട്ടണങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളെ ചുറ്റിയുള്ള തുറന്ന ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആ പട്ടണങ്ങളുടെ’ എന്നു ചേർത്തത് പ്രത്യയത്തിന്റെ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: לְמִקְנֵיהֶם
  choice: അവരുടെ കന്നുകാലികൾക്കു വേണ്ടി
  rationale: വിവിധ വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന പൊതുവായ ആധുനിക പദപ്രയോഗം.
- source_word: וּלְקִנְיָנָם
  choice: അവരുടെ മറ്റു സ്വത്തുക്കൾക്കു വേണ്ടി
  rationale: കൈവശമുള്ള സമ്പത്ത്/സ്വത്ത് എന്ന വിശാല അർഥം നൽകുന്നു; മുൻപറഞ്ഞ കന്നുകാലികളിൽനിന്ന് വേർതിരിക്കാൻ ‘മറ്റു’ ചേർത്തു.
theological_decisions:
- issue: യോസേഫിന്റെ ‘പുത്രന്മാർ’ എന്ന ഗോത്രപരമായ പ്രയോഗം
  choice: യോസേഫിന്റെ സന്തതികൾ
  alternative: യോസേഫിന്റെ പുത്രന്മാർ
  rationale: വാക്യം ചരിത്രപുരുഷന്മാരായ രണ്ടു പുത്രന്മാരെ മാത്രം അല്ല, അവരിൽനിന്നുണ്ടായ രണ്ടു ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ഗോത്രപരമായ അർഥം തുറന്നുകാട്ടുന്നതിലൂടെ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: ലേവ്യർക്കുള്ള ഭൂമിദാനം
  choice: ദേശത്തിൽ ഗോത്രഓഹരി ലഭിച്ചില്ലെങ്കിലും പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും ലഭിച്ചു
  alternative: ലേവ്യർക്കു ഭൂസ്വത്ത് ഒന്നും ലഭിച്ചില്ല
  rationale: ഹീബ്രു വാചകത്തിലെ നിഷേധവും അപവാദവും ഒരുപോലെ നിലനിർത്തി; ലേവ്യർക്കു യാതൊരു ഭൂമിയും നൽകിയില്ലെന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഭൂവിഭജനസന്ദർഭത്തിലെ ‘ഓഹരി’, ‘ഗോത്രം’, ‘മേച്ചിൽപ്പുറം’ എന്നീ വ്യക്തമായ പദങ്ങൾ സ്വീകരിച്ചു. ഹീബ്രുവിലെ നീണ്ട ഏകവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; എന്നാൽ വിശദീകരണബന്ധവും നിഷേധം–അപവാദ ഘടനയും സംരക്ഷിച്ചു.
