  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: ml
  text: കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക്[a] അവകാശമായി ലഭിച്ചതും പുരോഹിതനായ എലെയാസാർ, നൂന്റെ മകനായ യോശുവ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃഭവനത്തലവന്മാർ[c] എന്നിവർ അവർക്ക് അവകാശമായി വിഭജിച്ചുകൊടുത്തതുമായ ഭൂവിഭാഗങ്ങൾ ഇവയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽമക്കൾ’ എന്നതിന് ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥമായി കുടുംബബന്ധപരമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർക്ക് അവകാശമായി വിഭജിച്ചുകൊടുത്തത്’ എന്നതിന് ‘അവർക്ക് അവകാശമായി നൽകിയത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ ‘അവകാശം’ എന്ന ഒരേ പദമൂലം വാക്യത്തിന്റെ രണ്ടു ഭാഗങ്ങളിലും ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് ഗോത്രങ്ങൾക്കുള്ളിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പുതിയ വിഭാഗം അവതരിപ്പിക്കുന്ന പ്രയോഗം. വാവിന്റെ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: נָחֲלוּ
  choice: അവകാശമായി ലഭിച്ച
  rationale: ഇസ്രായേൽമക്കൾ തങ്ങൾക്ക് അനുവദിക്കപ്പെട്ട ഭൂമി സ്വീകരിച്ചതാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; മരണാനന്തരസ്വത്ത് എന്ന ചുരുങ്ങിയ ധ്വനി ഒഴിവാക്കി അവകാശഭൂമിയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: ‘ദേശം/ഭൂമി’ എന്ന പ്രദേശപരമായ ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: അവർക്കു അവകാശമായി വിഭജിച്ചുകൊടുത്തവ
  rationale: നחל എന്ന ധാതുവിന്റെ ആവർത്തനവും ഔദ്യോഗിക ഭൂവിഭജനത്തിന്റെ causative ആശയവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: പദവിയോടുകൂടിയ വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമത്തിൽ നൽകുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: പിതൃനാമബന്ധം പൂർണമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: ഗോത്രങ്ങളിലെ പിതൃഭവനത്തലവന്മാർ
  rationale: രָאשֵׁי എന്ന നേതൃത്വപദവും אָבוֹת സൂചിപ്പിക്കുന്ന പിതൃവംശാധിഷ്ഠിത കുടുംബഘടനയും ഗോത്രബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ഈ പ്രയോഗം ഗോത്രങ്ങളെ വിശേഷിപ്പിക്കുന്നതായി എടുത്ത് ‘ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങൾ’ എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בני ישראל എന്ന ലിംഗസൂചക ഉടമ്പടിസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപരമായ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തുന്നു; അതേ സമയം മലയാളത്തിൽ സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ സാധാരണയായി മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- issue: אבות എന്ന പിതൃവംശപരമായ സാമൂഹിക പദം
  choice: പിതൃഭവനങ്ങൾ
  alternative: വംശകുടുംബങ്ങൾ
  rationale: മൂലപാഠത്തിലെ പിതൃവംശാധിഷ്ഠിത ഘടന മറച്ചുവയ്ക്കാതെ സൂക്ഷിക്കുന്നു; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: נחל ധാതുവിന്റെ ഇരട്ടപ്രയോഗം
  choice: അവകാശമായി ലഭിച്ച ... അവകാശമായി വിഭജിച്ചുകൊടുത്ത
  alternative: ലഭിച്ച ... വീതിച്ചുകൊടുത്ത
  rationale: ഒരേ ഹീബ്രു ധാതു സ്വീകരിക്കലിനെയും അനുവദിച്ചുകൊടുക്കലിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘അവകാശം’ എന്ന ആശയം രണ്ടു ഖണ്ഡങ്ങളിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദീർഘമായ ഹീബ്രു ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ‘ഇവ’ എന്ന ആവർത്തനം അവയുടെ വ്യാകരണബന്ധം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
