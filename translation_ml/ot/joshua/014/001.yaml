revisions:
- from: കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക് അവകാശമായി ലഭിച്ച പ്രദേശങ്ങൾ ഇവയാണ്.[a] പുരോഹിതനായ എലെയാസാർ, നൂന്റെ മകനായ യോശുവ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃഭവനത്തലവന്മാർ എന്നിവർ അവർക്കു അവകാശമായി വിഭജിച്ചുകൊടുത്തവയാണ് ഇവ.[b][c]
  to: കനാൻദേശത്ത് ഇസ്രായേൽമക്കൾക്ക്[a] അവകാശമായി ലഭിച്ചതും പുരോഹിതനായ എലെയാസാർ, നൂന്റെ മകനായ യോശുവ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃഭവനത്തലവന്മാർ[c] എന്നിവർ അവർക്ക് അവകാശമായി വിഭജിച്ചുകൊടുത്തതുമായ ഭൂവിഭാഗങ്ങൾ ഇവയാണ്.[b]
  rationale: The revision retains the source’s inheritance-root concept in both clauses, retains the explicit familial and ancestral-house terminology, and recasts the verse as one natural Malayalam sentence. It also attaches each footnote marker directly to its referent without introducing interpretive material.
