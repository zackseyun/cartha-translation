  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, യാഹ്‌വേ താൻ അരുളിച്ചെയ്തതുപോലെ, ഇസ്രായേൽ മരുഭൂമിയിലൂടെ സഞ്ചരിച്ചിരുന്ന സമയത്ത് യാഹ്‌വേ മോശെയോടു ഈ വാക്ക്[b] അരുളിച്ചെയ്ത നാൾമുതൽ ഈ നാല്പത്തഞ്ചു വർഷമായി എന്നെ ജീവനോടെ കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു.[a][c] ഇപ്പോൾ ഇതാ, ഇന്ന് എനിക്ക് എൺപത്തഞ്ചു വയസ്സുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെ ജീവനോടെ നിലനിർത്തിയിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ വാക്ക്’ എന്നത് ‘ഈ കാര്യം’ എന്നും, കൂടുതൽ വ്യാഖ്യാനപരമായി ‘ഈ വാഗ്ദാനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഇസ്രായേൽ മരുഭൂമിയിൽ നടന്നുകൊണ്ടിരുന്ന സമയത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: എന്നെ ജീവനോടെ കാത്തിരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ജീവൻ ആദ്യം നൽകുന്നതിനെക്കാൾ, കാലമത്രയും ജീവൻ നിലനിർത്തിയതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ സംരക്ഷണാർഥം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: അരുളിച്ചെയ്തതുപോലെ
  rationale: ദൈവത്തിന്റെ മുൻവചനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാബലം നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: ഈ നാല്പത്തഞ്ചു വർഷവും
  rationale: അന്നുമുതൽ ഇപ്പോൾവരെയുള്ള കാലദൈർഘ്യവും זֶה എന്ന സൂചനാബലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵאָז
  choice: അരുളിച്ചെയ്തതുമുതൽ
  rationale: കഴിഞ്ഞ നാല്പത്തഞ്ചു വർഷത്തിന്റെ ആരംഭബിന്ദുവിനെ വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ വാക്ക്
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ‘കാര്യം’ എന്നും സന്ദർഭപരമായി ‘വാഗ്ദാനം’ എന്നും ഗ്രഹിക്കാവുന്ന തുറന്ന നില അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: ഇസ്രായേൽ മരുഭൂമിയിലൂടെ സഞ്ചരിക്കുകയായിരുന്നു
  rationale: הלך എന്ന ചലനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മരുഭൂമിയിലെ യാത്രയുടെ കാലസാഹചര്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന കണികയുടെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: אָנֹכִי הַיּוֹם
  choice: എനിക്ക് ഇന്ന്
  rationale: കാലേബിന്റെ ഇപ്പോഴത്തെ പ്രായത്തിന്മേലുള്ള ഊന്നൽ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: എൺപത്തഞ്ചു വയസ്സായി
  rationale: ‘എൺപത്തഞ്ചു വർഷങ്ങളുടെ മകൻ’ എന്ന എബ്രായ പ്രായശൈലിയെ സാധാരണ മലയാള പ്രായപ്രയോഗമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല. മലയാള വായനക്കാർക്കിടയിൽ ദീർഘകാലമായി പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു.
- issue: הַדָּבָר הַזֶּה എന്നതിന്റെ അർഥപരിധി
  choice: ഈ വാക്ക്
  alternative: ഈ കാര്യം / ഈ വാഗ്ദാനം
  rationale: മൂലപദത്തിലെ ‘വാക്ക്/കാര്യം’ എന്ന അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. സന്ദർഭം അതിനെ വാഗ്ദാനമായി മനസ്സിലാക്കാൻ അനുവദിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ അതു നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ ദൈവവചനസന്ദർഭത്തിന് യോജിച്ച ഉയർന്നെങ്കിലും പരിചിതമായ പ്രയോഗമാണ്. הִנֵּה എന്ന ആവർത്തനം രണ്ടിടത്തും ‘ഇതാ’യായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
