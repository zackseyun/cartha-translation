source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: ml
  text: ഇപ്പോൾ, യഹ്‌വേ ആ ദിവസം പറഞ്ഞ ഈ മലനാട് എനിക്കു തരിക[a]. അനാക്യരും വലുതും കോട്ടകെട്ടിയതുമായ പട്ടണങ്ങളും അവിടെയുണ്ടെന്ന് ആ ദിവസം നീതന്നെ കേട്ടല്ലോ. ഒരുപക്ഷേ യഹ്‌വേ എന്നോടുകൂടെ ഉണ്ടായിരിക്കും[b]; യഹ്‌വേ പറഞ്ഞതുപോലെ ഞാൻ അവരെ പുറത്താക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ മല’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ הָהָר ഒറ്റ മലയെയോ ഒരു മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ വിശാലമായ പ്രദേശമാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘ഒരുപക്ഷേ യഹ്‌വേ എന്നോടുകൂടെ.’ വരാനിരിക്കുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്ന ക്രിയ എബ്രായത്തിൽ പ്രകടമായി നൽകിയിട്ടില്ല; ദൈവസാന്നിധ്യവും സഹായവും പ്രതീക്ഷിക്കുന്ന സംക്ഷിപ്തപ്രയോഗമാണിത്.
    reason: source_ellipsis
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: കാലേബിന്റെ ഇപ്പോഴത്തെ അപേക്ഷ അവതരിപ്പിക്കുന്ന സംഭാഷണസൂചകം. തുടക്കത്തിലെ וְ എന്ന ബന്ധകത്തിന്റെ ഭാവം മലയാളത്തിലെ പ്രവാഹത്തിൽ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർക്കാതെയും വ്യക്തമാകുന്നു.
- source_word: תְּנָה לִּי
  choice: എനിക്കു തരിക
  rationale: נתן എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥവും കാലേബിന്റെ അപേക്ഷയുടെ ദൃഢതയും നിലനിർത്തുന്നു.
- source_word: אֶת־הָהָר הַזֶּה
  choice: ഈ മലനാട്
  rationale: הַר എന്നത് ഒറ്റ മലയെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ കാലേബ് ഒരു ഭൂപ്രദേശം ആവശ്യപ്പെടുന്നതിനാൽ ‘മലനാട്’ സന്ദർഭത്തിന് കൂടുതൽ യോജിക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹോവ ... പറഞ്ഞ
  rationale: דבר എന്ന ക്രിയയുടെ ‘പറയുക’ എന്ന അടിസ്ഥാനാർഥം സൂക്ഷിക്കുന്നു; സന്ദർഭം വാഗ്ദാനപരമാണെങ്കിലും ‘വാഗ്ദാനം ചെയ്ത’ എന്ന് വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: നീതന്നെ കേട്ടല്ലോ
  rationale: പ്രകടമായ אַתָּה നൽകുന്ന ഊന്നൽ ‘നീതന്നെ’ എന്നതിലൂടെ പകർത്തുന്നു; ‘ല്ലോ’ മുൻപറഞ്ഞ അറിവിനെ അടിസ്ഥാനമാക്കിയുള്ള അപേക്ഷയുടെ സ്വാഭാവിക മലയാളഭാവം നൽകുന്നു.
- source_word: כִּי עֲנָקִים שָׁם
  choice: അനാക്യർ ... അവിടെയുണ്ടെന്ന്
  rationale: ജനവിഭാഗത്തിന്റെ പേര് വിവർത്തനം ചെയ്യാതെ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; കാലേബ് വിവരിക്കുന്ന നിലവിലെ സ്ഥിതിക്ക് അനുയോജ്യമായി വർത്തമാനകാലം ഉപയോഗിക്കുന്നു.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: വലുതും കോട്ടകെട്ടിയതുമായ പട്ടണങ്ങളും
  rationale: രണ്ടു വിശേഷണങ്ങളും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: ദൈവസഹായത്തിലുള്ള പ്രത്യാശയും അതിനെ മുൻകൂട്ടി അവകാശപ്പെടാത്ത വിനയവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: יְהוָה אוֹתִי
  choice: യഹോവ എന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ക്രിയയില്ലാത്ത എബ്രായ വാക്യഭാഗത്തെ വരാനിരിക്കുന്ന പോരാട്ടത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു; ‘സഹായിക്കും’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: וְהוֹרַשְׁתִּים
  choice: ഞാൻ അവരെ അവിടെനിന്ന് ഓടിച്ചുകളയും
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ നിവാസികളെ ദേശത്തുനിന്ന് പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അവിടെനിന്ന്’ ലക്ഷ്യബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: אוּלַי יְהוָה אוֹתִי എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: ഒരുപക്ഷേ യഹോവ എന്നോടുകൂടെ ഉണ്ടായിരിക്കും
  alternative: യഹോവ എന്നെ സഹായിച്ചേക്കാം
  rationale: ‘ഒരുപക്ഷേ’ എന്ന അനിശ്ചിതത്വവും ‘എന്നോടുകൂടെ’ എന്ന ദൈവസാന്നിധ്യഭാഷയും അതേപടി സൂക്ഷിക്കുന്നു; കാലേബിന്റെ വിശ്വാസത്തെ നിർഭയമായ ഉറപ്പോ സംശയമോ ആയി ഏകപക്ഷീയമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തരിക’ അപേക്ഷയുടെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തുന്നു; ‘നീതന്നെ കേട്ടല്ലോ’ സംഭാഷണത്തിന്റെ ഊന്നൽ സ്വാഭാവികമാക്കുന്നു. ജനവിഭാഗനാമമായ ‘അനാക്യർ’ വിശദീകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
