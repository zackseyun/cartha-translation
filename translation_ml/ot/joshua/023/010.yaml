- from: നിങ്ങളിൽ ഒരാൾ ആയിരം പേരെ ഓടിക്കും[a]. കാരണം, നിങ്ങളുടെ ദൈവമായ യഹോവ തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി യുദ്ധം ചെയ്യുന്നത്[b]—അവിടന്ന് നിങ്ങളോട് അരുളിച്ചെയ്തതുപോലെ[c].
