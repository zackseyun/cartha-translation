source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: ml
  text: നിങ്ങളിൽനിന്ന് ഒരുവൻ ആയിരം പേരെ പിന്തുടരും[a], കാരണം നിങ്ങളുടെ ദൈവമായ യാഹ്‌വെ തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി പോരാടുന്നവൻ[b], അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആയിരം പേരെ ഓടിച്ചുപിന്തുടരും.’
    reason: lexical_alternative
  - marker: b
    text: ‘യാഹ്‌വെ’ എന്നത് എബ്രായയിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവൻ നിങ്ങളോടു വാഗ്ദാനം ചെയ്തതുപോലെ’; എബ്രായയിൽ അക്ഷരാർഥത്തിൽ, ‘അവൻ നിങ്ങളോടു പറഞ്ഞതുപോലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: എബ്രായയിലെ ഏകവചന പ്രതിനിധിപ്രയോഗവും מִן എന്നതിന്റെ ഭാഗികാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘ഒരു പുരുഷൻ’ എന്നു പറയുന്നത് ഇവിടെ അനാവശ്യമായി ലിംഗത്തിന് ഊന്നൽ നൽകുന്നതിനാൽ, സന്ദർഭത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
- source_word: יִרְדָּף
  choice: ഓടിക്കും
  rationale: רדף എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ ‘പിന്തുടർന്ന് ഓടിക്കുക’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘പിന്തുടരും’ എന്ന കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אָלֶף
  choice: ആയിരം പേരെ
  rationale: സംഖ്യ അക്ഷരാർഥത്തിൽ നിലനിർത്തി; പ്രത്യക്ഷ കർമത്തിന്റെ മനുഷ്യസൂചന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘പേരെ’ ചേർത്തു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിജയത്തിന് ദൈവത്തിന്റെ പ്രവർത്തനമാണ് കാരണമെന്ന് വ്യക്തമാക്കുന്ന കാരണസൂചകപ്രയോഗം.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ YHWH-നെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളഘടനയിൽ നൽകി.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി യുദ്ധം ചെയ്യുന്നത്
  rationale: הוּא നൽകുന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ സംരക്ഷിച്ചു. നിർദ്ദിഷ്ട കർത്തൃവാചക പങ്കാളിപദം ദൈവത്തിന്റെ സ്വഭാവസവിശേഷവും തുടരുന്നതുമായ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: അവിടന്ന് നിങ്ങളോട് അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സംസാരിക്കുക/പറയുക’ സംരക്ഷിക്കുന്നു; ദൈവത്തെക്കുറിച്ചുള്ള മാന്യമായ ആധുനിക മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ സ്വീകരിച്ചു. ‘വാഗ്ദാനം ചെയ്തു’ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ നാലക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നു. മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ഉച്ചാരണപുനർനിർമാണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: אִישׁ אֶחָד എന്ന പ്രതിനിധിപ്രയോഗത്തിലെ ലിംഗം
  choice: ഒരാൾ
  alternative: ഒരു പുരുഷൻ
  rationale: אִישׁ വ്യാകരണപരമായി പുല്ലിംഗമാണെങ്കിലും ഇവിടെ സൈന്യത്തിലെ ഒരൊറ്റ ഇസ്രായേല്യനെ പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരാൾ’ ആ ഏകത്വം സംരക്ഷിക്കുന്നു; ലിംഗവിവരം ദൈവശാസ്ത്രപരമായി വിപുലീകരിക്കുകയോ നിഷേധിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: דִּבֶּר എന്നതിന്റെ വാഗ്ദാനാർഥം
  choice: അരുളിച്ചെയ്തു
  alternative: വാഗ്ദാനം ചെയ്തു
  rationale: മൂലക്രിയയുടെ ‘സംസാരിച്ചു’ എന്ന രൂപം നിലനിർത്തി, സന്ദർഭത്തിലെ വാഗ്ദാനസൂചന വായനക്കാരന് തുറന്നുവെക്കുന്നു; അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധിതമായി വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ‘അവിടന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യ ഏകവചനമായി ഉപയോഗിച്ചു. സൈനികഭാവം ‘ഓടിക്കും’, ‘യുദ്ധം ചെയ്യുന്നത്’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദങ്ങളിലൂടെ നിലനിർത്തി.
