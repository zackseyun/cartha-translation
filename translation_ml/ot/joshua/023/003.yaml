  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: ml
  text: നിങ്ങളുടെ മുമ്പിൽനിന്ന്[a] ഈ സകല ജനതകളോടു നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ചെയ്തതെല്ലാം നിങ്ങൾതന്നെ കണ്ടിരിക്കുന്നു; നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി പോരാടിയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, “നിങ്ങളുടെ മുമ്പിൽനിന്ന്.” ഇവിടെ ഈ പ്രയോഗം ആ ജനതകൾ ഇസ്രായേലിന്റെ സന്നിധിയിൽനിന്ന് നീക്കിക്കളയപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: നിങ്ങൾതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; വാക്യബന്ധം മലയാളത്തിലെ പ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ וְ വേറിട്ട് പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: רְאִיתֶם
  choice: കണ്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ അനുഭവത്തിനുള്ള ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: ചെയ്തതൊക്കെയും
  rationale: പ്രവൃത്തിയുടെ പൂർണ്ണവ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു; עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ അനാവശ്യമായി സൈനികമായി ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളോടെല്ലാം
  rationale: לְ എന്ന ബന്ധം ബാധിക്കപ്പെട്ട ജനതകളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; 'എതിരായി' എന്നു ചേർത്ത് עשהയുടെ അർഥം അതിയായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ കൺമുന്നിൽ
  rationale: മുഖസന്നിധി എന്ന ദൃശ്യപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ നീക്കിക്കളയൽസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: ;
  rationale: ഹീബ്രുവിലെ വിശദീകരണബന്ധം മലയാളത്തിൽ അർദ്ധവിരാമത്തിനു ശേഷമുള്ള കാരണവാക്യത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הוּא הַנִּלְחָם
  choice: തന്നെയാണ് … പോരാടിയത്
  rationale: הוּאയുടെ ഊന്നലും substantival participle-ന്റെ അർഥവും മലയാളത്തിലെ കേന്ദ്രീകൃത ഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പ്രയോജനത്തിന്റെയും പ്രതിനിധിത്വത്തിന്റെയും ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ 'കർത്താവ്' എന്നതിനു പകരം മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ 'യഹോവ' എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ദൈവമാണ് ഇസ്രായേലിനുവേണ്ടി യുദ്ധം ചെയ്തതെന്ന ഊന്നൽ
  choice: യഹോവ തന്നെയാണ് നിങ്ങൾക്കുവേണ്ടി പോരാടിയത്
  alternative: യഹോവ നിങ്ങൾക്കുവേണ്ടി പോരാടി
  rationale: הוּא എന്ന ഊന്നൽസർവനാമം ദൈവിക പ്രവർത്തനശേഷിയെ പ്രത്യേകം മുൻനിർത്തുന്നു; അതിനെ 'തന്നെയാണ്' എന്നു പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രണ്ടാം പുരുഷ ബഹുവചനം മുഴുവൻ നിലനിർത്തി; ആവർത്തിക്കുന്ന ദൈവനാമവും മൂലപാഠത്തിലെ ഊന്നലുകളും സംരക്ഷിച്ചു.
