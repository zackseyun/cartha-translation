    issue: “നിങ്ങളുടെ കൺമുന്നിൽ” does not preserve the literal ‘from before you’ wording.
    rationale: The Hebrew phrase is idiomatic and can imply removal from Israel’s presence. Retaining “നിങ്ങളുടെ മുമ്പിൽനിന്ന്” in the text and explaining it in a footnote better preserves both form and contextual sense.
