reference: Joshua 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: ml
  text: നോക്കൂ, ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകളെ നിങ്ങളുടെ ഗോത്രങ്ങൾക്ക് അവകാശമായി ഞാൻ നറുക്കിട്ട് നൽകിയിരിക്കുന്നു—യോർദ്ദാൻ മുതൽ, ഞാൻ നശിപ്പിച്ചുകളഞ്ഞ സകല ജനതകളെയും ഉൾപ്പെടുത്തി, സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലെ[a] മഹാസമുദ്രം വരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, പടിഞ്ഞാറ്.
    reason: ഹീബ്രായിയിലെ ‘സൂര്യൻ അസ്തമിക്കുന്ന ദിക്ക്’ എന്ന പ്രയോഗം പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: രביםയെ അഭിസംബോധന ചെയ്യുന്ന ആജ്ഞാരൂപം ശ്രദ്ധ ക്ഷണിക്കുന്നു. ‘നോക്കൂ’ ആ ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִפַּלְתִּי
  choice: നറുക്കിട്ടു നൽകിയിരിക്കുന്നു
  rationale: നറുക്കുവീഴ്ത്തി ഭൂമി വിഭജിച്ചുനൽകുക എന്ന ഹിഫീൽ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘വീഴ്ത്തി’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാക്കും.
- source_word: בְּנַחֲלָה
  choice: അവകാശമായി
  rationale: തലമുറയായി ലഭിക്കുന്ന ഭൂപ്രദേശാവകാശം എന്ന נַחֲלָהയുടെ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְשִׁבְטֵיכֶם
  choice: നിങ്ങളുടെ ഗോത്രങ്ങൾക്ക്
  rationale: വിഭജനത്തിന്റെ ഗുണഭോക്താക്കളായ ഗോത്രങ്ങളെ לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്നു.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകൾ
  rationale: നാട്ടിൽ ഇപ്പോഴും ശേഷിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന നിഫാൽ പങ്കാളിത്തരൂപത്തിന്റെ വാചികസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: ഞാൻ നിർമൂലമാക്കിയ സകല ജനതകളും
  rationale: כרת എന്നതിന്റെ അടിസ്ഥാനചിത്രം ‘വെട്ടിക്കളയുക’ ആണെങ്കിലും, ഇവിടെ ജനതകളെ ഇല്ലാതാക്കുക എന്ന സന്ദർഭാർഥം ‘നിർമൂലമാക്കുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: യോർദ്ദാൻമുതൽ ... മഹാസമുദ്രംവരെ
  rationale: ഹീബ്രായിയിലെ וְ ഉണ്ടായിരിക്കുമ്പോഴും, സന്ദർഭത്തിൽ ഇത് ഭൂപ്രദേശത്തിന്റെ കിഴക്ക്-പടിഞ്ഞാറൻ വ്യാപ്തിയാണ്; മലയാളത്തിലെ ‘മുതൽ … വരെ’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുന്ന ദിക്കിലുള്ള
  rationale: ‘സൂര്യന്റെ പ്രവേശനം’ എന്ന ഹീബ്രായ ദൃശ്യപ്രയോഗം സൂര്യാസ്തമയത്തെയും അതുവഴി പടിഞ്ഞാറിനെയും സൂചിപ്പിക്കുന്നു. വിവർത്തനം ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഹീബ്രായ വാക്യത്തിലെ ഭൂപ്രദേശപരിധി ആദ്യം ചേർത്തത് മലയാളത്തിൽ ബന്ധങ്ങൾ വ്യക്തമാക്കാനാണ്; ശേഷിച്ച ജനതകളെയും നിർമൂലമാക്കിയ ജനതകളെയും വേർതിരിക്കുന്ന പാഠത്തിലെ സംഘർഷം നിലനിർത്തിയിട്ടുണ്ട്.
