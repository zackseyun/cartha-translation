  revision_rationale: The revision restores the source-like order by making the remaining nations the immediate object of allotment, then retaining the compact, potentially appositional relation of the cut-off nations within the stated extent. It preserves the allotment and inheritance terminology, retains the geographic imagery rather than replacing it with “west” in the text, and corrects the footnote to idiomatic Malayalam.
