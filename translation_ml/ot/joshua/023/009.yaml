source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: ml
  text: യാഹ്‌വെ നിങ്ങൾക്കു മുമ്പിൽനിന്ന് വലുതും ശക്തവുമായ ജനതകളെ പുറത്താക്കി[a]. നിങ്ങളുടെ കാര്യത്തിൽ, ഇന്നുവരെ ഒരുവനും നിങ്ങളുടെ മുമ്പിൽ ഉറച്ചുനിൽക്കാൻ കഴിഞ്ഞിട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈവശം നഷ്ടപ്പെടുത്തിച്ചു’ അല്ലെങ്കിൽ ‘ഓടിച്ചുകളഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ, ഇസ്രായേൽ ദേശം കൈവശമാക്കേണ്ടതിന് അവിടെയുള്ള ജനതകളെ ദേശത്തുനിന്ന് നീക്കുന്നതിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരുവനും നിങ്ങളുടെ മുമ്പിൽ നിന്നിട്ടില്ല.’ ഇത് ആർക്കും നിങ്ങളെ ചെറുത്തുനിൽക്കാൻ കഴിഞ്ഞിട്ടില്ല എന്നർഥമുള്ള പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירשׁ ഇവിടെ ഒരു ദേശത്തുനിന്ന് ജനതകളെ ഒഴിപ്പിച്ച് മറ്റുള്ളവർക്ക് അത് കൈവശമാക്കാൻ ഇടയാക്കുക എന്ന ആശയം വഹിക്കുന്നു. ‘നീക്കിക്കളഞ്ഞു’ സ്വാഭാവികമായ മലയാളത്തിൽ പുറത്താക്കൽ/കൈവശം നഷ്ടപ്പെടുത്തൽ എന്നീ അർത്ഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; പകരുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങൾക്കു മുമ്പിൽനിന്ന്
  rationale: מן + פנים എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരവും ഏറ്റുമുട്ടൽസംബന്ധവുമായ ഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: വലുതും ശക്തവുമായ ജനതകൾ
  rationale: גָּדוֹל എന്നതിന്റെ വലുപ്പം/പ്രാധാന്യം, עָצוּם എന്നതിന്റെ ശക്തി എന്നീ ഘടകങ്ങൾ ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאַתֶּם
  choice: നിങ്ങളെ സംബന്ധിച്ചിടത്തോളം
  rationale: മുന്നിൽ നിർത്തിയിരിക്കുന്ന സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നലും വിഷയമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לֹא עָמַד אִישׁ
  choice: ഒരുവനും ... ഉറച്ചുനിൽക്കാൻ കഴിഞ്ഞിട്ടില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പുരുഷനും നിന്നിട്ടില്ല’ എന്ന യുദ്ധസന്ദർഭത്തിലെ പ്രയോഗം എതിർത്തുനിൽക്കാൻ കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ‘ഒരുവനും’ ഏകവചന പുരുഷരൂപം സൂക്ഷിക്കുമ്പോൾ ‘ഉറച്ചുനിൽക്കാൻ കഴിഞ്ഞിട്ടില്ല’ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: בִּפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: ‘മുമ്പിൽ നിൽക്കുക’ എന്ന ഉറവിടപ്രയോഗം നിലനിർത്തി, ‘ഉറച്ചുനിൽക്കുക’ എന്ന ക്രിയയിലൂടെ എതിർപ്പിന്റെ യുദ്ധസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരിക്കപ്പെടുന്ന സ്ഥിതി പ്രസ്തുത ദിവസംവരെ തുടർന്നു എന്ന സാധാരണ എബ്രായ കാലപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: പാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതവും എളുപ്പം തിരിച്ചറിയാവുന്നതുമായ രൂപം ‘യഹോവ’ ആണ്; ഉച്ചാരണപുനർനിർമ്മാണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം കാരണം ‘യാഹ്‌വെ’യും സാധുവായ മറ്റൊരു ലിപ്യന്തരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവണ്ണം ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിന്റെ ഊന്നൽക്രമം ‘നിങ്ങളെ സംബന്ധിച്ചിടത്തോളം’ എന്ന പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു; യുദ്ധസന്ദർഭത്തിലെ ഇടിയത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
