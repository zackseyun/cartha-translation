  - severity: low
    issue: നീക്കിക്കളഞ്ഞു is less specific than the source verb in context.
    rationale: The Hiphil of ירשׁ here denotes dispossessing or driving peoples out so Israel may possess the land. “പുറത്താക്കി” preserves that force more directly.
