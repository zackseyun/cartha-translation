source:
  edition: WLC
  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ തീർച്ചയായും പിന്തിരിഞ്ഞ്, നിങ്ങളോടുകൂടെ ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകളുടെ ശേഷിപ്പിനോട് പറ്റിച്ചേരുകയും[a] അവരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുകയും അവരുമായി ഇടപഴകുകയും അവർ നിങ്ങളുമായി ഇടപഴകുകയും ചെയ്താൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പറ്റിച്ചേരുക’ എന്നതിന് ‘മുറുകെപ്പിടിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ പ്രയോഗത്തെ അടുത്തു പിന്തുടർന്ന്, ‘നിങ്ങൾ അവരുടെ ഇടയിലേക്കു ചെല്ലുകയും അവർ നിങ്ങളുടെ ഇടയിലേക്കു ചെല്ലുകയും’ എന്നും പറയാം; അത് വെറും സ്ഥലമാറ്റത്തേക്കാൾ വിശാലമായ ഇടപഴകലിനെയോ പരസ്പരബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: കാരണം, … ചെയ്താൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പുമായി ബന്ധിപ്പിക്കുന്ന കാരണസൂചകവും ഇവിടെ ആരംഭിക്കുന്ന വ്യവസ്ഥയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: നിങ്ങൾ യഥാർഥത്തിൽ പിന്തിരിഞ്ഞ്
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്നുള്ള ഊന്നൽ ‘യഥാർഥത്തിൽ’കൊണ്ട് പ്രകടമാക്കുന്നു; സന്ദർഭത്തിലെ ഉടമ്പടിവിശ്വസ്തതയിൽനിന്നുള്ള പിന്മാറ്റം ‘പിന്തിരിയുക’ വ്യക്തമാക്കുന്നു.
- source_word: וּדְבַקְתֶּם
  choice: പറ്റിച്ചേരുകയും
  rationale: דבק സൂചിപ്പിക്കുന്ന ദൃഢവും അടുത്തതുമായ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: നിങ്ങളോടുകൂടെ ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകളുടെ ശേഷിപ്പിനോട്
  rationale: יֶתֶר എന്ന ‘ശേഷിപ്പ്’ ആശയവും נִשְׁאָרִים എന്ന തുടർന്നുള്ള വിശദീകരണവും കഴിയുന്നത്ര സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു; ഇവിടെ ‘ശേഷിപ്പ്’ എന്നതിന് അനുകൂലമായ പ്രത്യേക ദൈവശാസ്ത്രാർഥം ചുമത്തുന്നില്ല.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: അവരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടുകയും
  rationale: חתן എന്ന ധാതുവിന്റെ ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന പരസ്പര വിവാഹബന്ധത്തെ ആധുനികവും മാന്യവുമായ ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: അവരുമായി ഇടപഴകുകയും അവർ നിങ്ങളുമായി ഇടപഴകുകയും
  rationale: בוא ב എന്ന പ്രയോഗത്തിന്റെ സാമൂഹിക സമ്പർക്കം ഉൾക്കൊള്ളുന്ന വിശാലതയും തുടർന്നുള്ള സമാന്തരവാക്യത്തിലെ പരസ്പരതയും സംരക്ഷിക്കുന്നു; അതിനെ വെറും ശാരീരിക ചലനമായോ ലൈംഗിക സൂചനയായോ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: שׁוֹב תָּשׁוּבוּ എന്നതിലെ ഉടമ്പടിസംബന്ധമായ മുന്നറിയിപ്പ്
  choice: യഥാർഥത്തിൽ പിന്തിരിഞ്ഞ്
  alternative: വീണ്ടും മടങ്ങി
  rationale: സന്ദർഭം യഹോവയോടുള്ള വിശ്വസ്തതയിൽനിന്ന് ശേഷിച്ച ജനതകളിലേക്കുള്ള പ്രതികൂലമായ തിരിഞ്ഞുപോക്കിനെക്കുറിച്ചാണ്; അതുകൊണ്ട് നിഷ്പക്ഷമായ ‘മടങ്ങുക’ എന്നതിനെക്കാൾ ‘പിന്തിരിയുക’ യോജിക്കുന്നു.
- issue: ‘ശേഷിപ്പ്’ എന്ന പദത്തിന് അനാവശ്യമായ ദൈവശാസ്ത്രാർഥം നൽകാനുള്ള സാധ്യത
  choice: ഈ ജനതകളുടെ ശേഷിപ്പ്
  alternative: ഈ ജനതകളിൽ ബാക്കിയുള്ളവർ
  rationale: ഇവിടെ പദം ജീവനോടെ ശേഷിച്ച ജനവിഭാഗങ്ങളെ മാത്രം സൂചിപ്പിക്കുന്നു; രക്ഷിക്കപ്പെട്ട വിശുദ്ധ ശേഷിപ്പ് എന്ന ആശയം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: וּבָאתֶם בָּהֶם എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: അവരുമായി ഇടപഴകുകയും
  alternative: അവരുടെ ഇടയിൽ ചെല്ലുകയും
  rationale: വിവാഹബന്ധം ഇതിനകം പ്രത്യേകം പറഞ്ഞതിനാൽ, ഈ പ്രയോഗം സൂചിപ്പിക്കാവുന്ന വിശാലമായ സാമൂഹിക സഹവാസവും പരസ്പരബന്ധവും നിലനിർത്തുന്നു; സാധ്യതയില്ലാത്ത ലൈംഗിക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ആവർത്തനവും പരസ്പരതയും സാധ്യമായ പരിധിയിൽ സൂക്ഷിച്ചു.
