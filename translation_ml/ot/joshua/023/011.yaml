id: JOS.23.11
reference: Joshua 23:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ സ്നേഹിക്കാൻ അതീവ ജാഗ്രത പുലർത്തുവിൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: അതുകൊണ്ട് ... ജാഗ്രത പുലർത്തുവിൻ
  rationale: ക്രിയ സ്വയം സൂക്ഷിക്കുന്നതും നിരന്തരം ശ്രദ്ധിക്കുന്നതുമായ ആഹ്വാനമാണ്. മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ וְ എന്നത് ‘അതുകൊണ്ട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: מְאֹד
  choice: അതീവ
  rationale: ജാഗ്രതയുടെ തീവ്രത ഊന്നിപ്പറയുന്ന ശക്തമായ ക്രിയാവിശേഷണമായി സ്വാഭാവിക മലയാളം.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: ‘ജാഗ്രത പുലർത്തുവിൻ’ എന്ന പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്ന സ്വയംസൂക്ഷിക്കൽ
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്നു വേർതിരിച്ച ‘ആത്മാവ്’ എന്നതിലുപരി മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘ജാഗ്രത പുലർത്തുക’ എന്ന പ്രയോഗം ആവശ്യമായ സ്വപ്രതിബദ്ധത സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ വേറിട്ട പദാനുപദ പരിഭാഷ ഒഴിവാക്കി.
- source_word: לְאַהֲבָה
  choice: സ്നേഹിക്കാൻ
  rationale: ലാമെദ് ചേർന്ന ഇൻഫിനിറ്റീവ് ജാഗ്രത പുലർത്തുന്നതിന്റെ ഉദ്ദേശ്യം അഥവാ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന പ്രത്യയം ഇസ്രായേലുമായുള്ള ബന്ധം ‘നിങ്ങളുടെ ദൈവം’ എന്നു നേരിട്ട് വ്യക്തമാക്കുന്നു; മലയാള വാക്യഘടനയ്ക്കായി ‘ദൈവമായ’ എന്നു ബന്ധിപ്പിച്ചു.
theological_decisions:
- issue: ഉടമ്പടി ആഹ്വാനത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ അർഥം
  choice: മുഴുവൻ വ്യക്തിയെ ഉൾക്കൊള്ളുന്ന സ്വയംസൂക്ഷിക്കൽ; ‘ജാഗ്രത പുലർത്തുവിൻ’ എന്നതിൽ ഉൾപ്പെടുത്തി
  alternative: നിങ്ങളുടെ ആത്മാക്കളെ / നിങ്ങളുടെ ജീവനെ / നിങ്ങളെത്തന്നെ സൂക്ഷിക്കുവിൻ
  rationale: ഈ പ്രയോഗം മനുഷ്യന്റെ അഭൗതിക ഘടകത്തെ മാത്രം വേർതിരിക്കുന്നില്ല; ദൈവത്തോടുള്ള സ്നേഹത്തിൽ നിലനിൽക്കാൻ തങ്ങളെത്തന്നെ ശ്രദ്ധാപൂർവം കാക്കണമെന്ന് ഇസ്രായേലിനോടു പറയുന്നു. അതിനാൽ മൂലപാഠം ആവശ്യപ്പെടാത്ത മനുഷ്യസ്വഭാവസംബന്ധമായ സിദ്ധാന്തം ചേർക്കാതെ ആഹ്വാനത്തിന്റെ ഗൗരവം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഹ്വാനശൈലി. ബഹുവചന കല്പനയ്ക്ക് ‘പുലർത്തുവിൻ’ ഉപയോഗിച്ചു. പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി മൂലപാഠത്തിലെ ഊന്നൽ, ഉദ്ദേശ്യബന്ധം, ദൈവനാമം എന്നിവ നിലനിർത്തി.
