source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു കൽപ്പിച്ച ഉടമ്പടി നിങ്ങൾ ലംഘിക്കുകയും[a], ചെന്നു മറ്റു ദേവന്മാരെ സേവിക്കുകയും അവരുടെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്താൽ, യഹ്‌വെയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും; അവൻ നിങ്ങൾക്കു നൽകിയ നല്ല ദേശത്തുനിന്ന് നിങ്ങൾ വേഗത്തിൽ നശിച്ചുപോകും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉടമ്പടി നിങ്ങൾ ലംഘിക്കുമ്പോൾ.’ എബ്രായത്തിലെ ആരംഭപ്രയോഗം കാലസൂചകമായോ (‘ചെയ്യുമ്പോൾ’) വ്യവസ്ഥാസൂചകമായോ (‘ചെയ്താൽ’) വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നല്ല ദേശത്തിന്റെ മുകളിൽനിന്ന്’; യഹ്‌വെ നൽകിയ ദേശത്തുനിന്ന് അവർ നീക്കപ്പെടുന്നതിന് ഈ പ്രയോഗം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם אֶת־בְּרִית
  choice: ഉടമ്പടി നിങ്ങൾ ലംഘിക്കുകയും … ചെയ്താൽ
  rationale: בְּ + infinitive construct ഇവിടെ വ്യവസ്ഥാസൂചകമായി ഗ്രഹിക്കാം; עבר ברית എന്നത് ഉടമ്പടി ‘കടക്കുക’ എന്നല്ല, അതു ലംഘിക്കുക എന്ന സാങ്കേതിക പ്രയോഗമാണ്.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; אֱלֹהֵיכֶם ഏകവചനാർഥത്തിൽ ‘നിങ്ങളുടെ ദൈവം’ എന്നാണ്.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: നിങ്ങളോടു കല്പിച്ച
  rationale: ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പാലിക്കാൻ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: ചെന്നു മറ്റു ദേവന്മാരെ സേവിക്കുകയും
  rationale: הלך എന്ന ചലനക്രിയയും עבד എന്ന ആരാധനാപരമായ സേവനവും നിലനിർത്തുന്നു; אֱלֹהִים אֲחֵרִים ‘മറ്റു ദേവന്മാർ’ എന്നാണ്.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: അവരുടെ മുമ്പിൽ കുമ്പിടുകയും
  rationale: השתחוה സൂചിപ്പിക്കുന്ന ശാരീരികമായ കുനിഞ്ഞുവണങ്ങൽ നിലനിർത്തി, മുൻപുള്ള ‘സേവിക്കുക’ എന്ന ക്രിയയുമായി ലയിപ്പിച്ചിട്ടില്ല.
- source_word: וְחָרָה אַף־יְהוָה בָּכֶם
  choice: യഹ്‌വെയുടെ കോപം നിങ്ങൾക്കെതിരെ ജ്വലിക്കും
  rationale: חרה אף എന്ന എബ്രായ പ്രയോഗത്തിലെ ജ്വലിക്കുന്ന കോപത്തിന്റെ രൂപകം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: നല്ല ദേശത്തുനിന്ന് നിങ്ങൾ വേഗത്തിൽ നശിച്ചുപോകും
  rationale: אבד എന്നതിന്റെ നാശാർഥവും מְהֵרָה എന്നതിന്റെ വേഗതയും, מֵעַל വഴി സൂചിപ്പിക്കുന്ന ദേശത്തുനിന്നുള്ള നീക്കവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ആരംഭവാക്യത്തിന്റെ വ്യവസ്ഥാ-കാല സൂചന
  choice: ‘ചെയ്താൽ’ എന്ന വ്യവസ്ഥാസൂചക വായന
  alternative: ‘ചെയ്യുമ്പോൾ’ എന്ന കാലസൂചക വായന
  rationale: בְּ + infinitive construct ഇരുവിധത്തിലും വായിക്കാവുന്നതാണ്; ഈ മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ വ്യവസ്ഥാസൂചക വായന അനുയോജ്യം, എന്നാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: അനുസരണക്കേടിന്റെ ഫലമായി ദേശം നഷ്ടപ്പെടൽ
  choice: ദേശത്തുനിന്ന് നശിച്ചുപോകും
  alternative: ദേശത്തുനിന്ന് നീക്കപ്പെടും
  rationale: אבד എന്ന ക്രിയയുടെ നാശതീവ്രത കുറയ്ക്കാതെ, מֵעַל הָאָרֶץ സൂചിപ്പിക്കുന്ന ദേശനഷ്ടവും പ്രകടമാക്കി; വെറും രാഷ്ട്രീയ നാടുകടത്തലായി അർഥം ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി’, ‘സേവിക്കുക’, ‘കുമ്പിടുക’, ‘കോപം ജ്വലിക്കുക’ എന്നീ പദങ്ങൾ നിയമപരവും ആരാധനാപരവും രൂപകാത്മകവുമായ മൂലപാഠഭേദങ്ങൾ സംരക്ഷിക്കുന്നു; അതേസമയം വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഒഴുകുന്നു.
