  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: ml
  text: വളരെക്കാലം കഴിഞ്ഞ്[a], യഹ്‌വേ ഇസ്രായേലിന് അവരുടെ ചുറ്റുമുള്ള സകല ശത്രുക്കളിൽനിന്നും വിശ്രമം നൽകിയശേഷം, യോശുവ വൃദ്ധനും വളരെ പ്രായം ചെന്നവനും ആയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അനേകം ദിവസങ്ങൾ കഴിഞ്ഞ്.’'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ: ‘ദിവസങ്ങളിലേക്കു വന്നവൻ.’'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: വളരെക്കാലം കഴിഞ്ഞ്
  rationale: പുതിയ സംഭവരംഗം അവതരിപ്പിക്കുന്ന וַיְהִי എന്ന ആഖ്യാനരൂപവും ഗണ്യമായ കാലയളവ് സൂചിപ്പിക്കുന്ന מִיָּמִים רַבִּים എന്ന പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ശേഷം
  rationale: പ്രധാന വാക്യത്തിന്റെ സമയപശ്ചാത്തലം നിർവചിക്കുന്ന കാലസൂചകബന്ധം ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: הֵנִיחַ
  choice: വിശ്രമം നൽകി
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ശത്രുക്കളിൽനിന്നുള്ള ആശ്വാസവും സമാധാനവും നൽകുക എന്ന കാരണാർത്ഥം വഹിക്കുന്നു; ‘വിശ്രമം നൽകി’ ആ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിന്
  rationale: ജനതയുടെ പേരിനെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗമനുസരിച്ച് ലിപ്യന്തരിച്ചു, ഹീബ്രു ലാമെദിന്റെ ഗുണഭോക്തൃബന്ധം ‘-ന്’ വഴി പ്രകടമാക്കുന്നു.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: ചുറ്റുമുണ്ടായിരുന്ന സകല ശത്രുക്കളിൽനിന്നും
  rationale: എല്ലാ ശത്രുക്കളിൽനിന്നുമുള്ള സമഗ്രമായ വിടുതലിനൊപ്പം מִסָּבִיב എന്നതിന്റെ സ്ഥലപരമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: യോശുവ വൃദ്ധനായി
  rationale: യോശുവയുടെ പ്രായാവസ്ഥ നേരിട്ട് വ്യക്തമാക്കുന്നു; ദീർഘമായ കാലപശ്ചാത്തലത്തിനു ശേഷം വാക്യത്തിന്റെ മുഖ്യവിഷയത്തിലേക്കുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּא בַּיָּמִים
  choice: ഏറെ പ്രായം ചെന്നിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിലേക്കു വന്നവൻ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥമായ അത്യന്തം പ്രായംചെന്ന അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അതിനെ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപമായി ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിശ്രമം നൽകി’ എന്ന ബൈബിൾപരമായ ആശയം നിലനിർത്തുമ്പോഴും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
