  source_fidelity: 'The temporal framing and the sense of rest from surrounding enemies are retained. However, “യോശുവ വൃദ്ധനായി” means that Joshua became old, whereas the Hebrew predicates describe his state: he was old and advanced in years. The divine name should also reflect the project’s Yahweh rendering rather than the Malayalam conventional form corresponding to “Jehovah.”'
