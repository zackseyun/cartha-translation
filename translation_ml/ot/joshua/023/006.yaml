source:
  edition: WLC
  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: ml
  text: അതുകൊണ്ട് മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്നതെല്ലാം പാലിക്കാനും അനുഷ്ഠിക്കാനും, അതിൽനിന്ന് വലത്തോട്ടോ ഇടത്തോട്ടോ മാറാതിരിക്കാനും നിങ്ങൾ അത്യന്തം ഉറച്ചുനിൽക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെയുടെ പ്രബോധനപുസ്തകത്തിൽ.’ എബ്രായത്തിലെ തോറാ എന്ന പദത്തിന് ‘ന്യായപ്രമാണം’ എന്നതിനൊപ്പം ‘പ്രബോധനം’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അത് പ്രത്യേകമായി മോശെയുമായി ബന്ധപ്പെട്ട നിയമസമാഹാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: നിങ്ങൾ അത്യന്തം ഉറച്ചുനിൽക്കുക
  rationale: ബഹുവചനസംബോധനയിലുള്ള חזק എന്ന ക്രിയയുടെ ദൃഢതയും ആഹ്വാനസ്വഭാവവും מְאֹד എന്ന തീവ്രതാസൂചകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: പാലിക്കാനും അനുഷ്ഠിക്കാനും
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സാഹചര്യത്തിൽ שׁמר അനുസരണപൂർവം പാലിക്കുന്നതിനെയും עשה പ്രാവർത്തികമായി അനുഷ്ഠിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു; രണ്ടു ക്രിയകളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כָּל הַכָּתוּב
  choice: എഴുതിയിരിക്കുന്നതെല്ലാം
  rationale: എഴുതപ്പെട്ട ഉള്ളടക്കത്തെ സമഗ്രമായി പരാമർശിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: סֵפֶר എന്നത് പുസ്തകം/ചുരുൾ എന്നു വരാമെങ്കിലും ഇവിടെ അംഗീകൃതമായ രേഖാസമാഹാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുസ്തകം’ യോജിക്കുന്നു. תּוֹרָה ഇവിടെ മോശെയുമായി ബന്ധപ്പെട്ട നിയമ-പ്രബോധനസമാഹാരമാണ്.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: അതിൽനിന്ന് ... മാറരുത്
  rationale: വ്യതിചലിക്കാതിരിക്കാനുള്ള ഉദ്ദേശ്യത്തെ മലയാളത്തിൽ നേരിട്ടുള്ള നിരോധനാഹ്വാനമായി സ്വാഭാവികമായി നൽകുന്നു; ഏകവചന സർവനാമസൂചന ‘അതിൽനിന്ന്’ എന്നു നിലനിർത്തുന്നു.
- source_word: יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഏതു ദിശയിലേക്കും വ്യതിചലിക്കരുതെന്ന എബ്രായ രൂപകം മലയാളത്തിൽ അതേ ദിശാഭാഷയോടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശൈക ഉടമ്പടി സാഹചര്യത്തിൽ תּוֹרָה എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘മോശെയുടെ ന്യായപ്രമാണപുസ്തകം’
  alternative: ‘മോശെയുടെ പ്രബോധനപുസ്തകം’
  rationale: תּוֹרָה എന്നതിന് വിശാലമായി ‘പ്രബോധനം’ എന്ന അർഥമുണ്ടെങ്കിലും ഈ സൂത്രവാക്യസമാനമായ സാഹചര്യത്തിൽ അത് മോശെയുമായി ബന്ധപ്പെട്ട ഉടമ്പടിനിയമസമാഹാരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ ‘ന്യായപ്രമാണം’ ഉപയോഗിക്കുകയും വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ബഹുവചനസംബോധന വ്യക്തമായി സൂക്ഷിച്ചു. ‘പാലിക്കാനും അനുഷ്ഠിക്കാനും’ എന്ന കൂട്ടുപ്രയോഗം മൂലത്തിലെ രണ്ടു ക്രിയകളെയും നിലനിർത്തുന്നു; ‘വലത്തോട്ടോ ഇടത്തോട്ടോ’ എന്ന രൂപകം മാറ്റമില്ലാതെ സംരക്ഷിച്ചു.
