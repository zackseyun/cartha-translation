  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ എല്ലാ ഇസ്രായേലിനെയും—അതിന്റെ മൂപ്പന്മാരെയും, തലവന്മാരെയും[a], ന്യായാധിപന്മാരെയും, ഉദ്യോഗസ്ഥന്മാരെയും—വിളിച്ചുകൂട്ടി[b] അവരോടു പറഞ്ഞു: “ഞാൻ വൃദ്ധനായിരിക്കുന്നു; എനിക്ക് പ്രായം ചെന്നിരിക്കുന്നു.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രമുഖരെയും’ അല്ലെങ്കിൽ ‘നേതാക്കളെയും.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അതിന്റെ തലവന്മാരെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിളിച്ചു’ അല്ലെങ്കിൽ ‘വരുത്തി.’ ഇവിടെ എബ്രായക്രിയയ്ക്ക് നേതാക്കളെ തന്റെ അടുക്കൽ വിളിച്ചുചേർക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം ‘ഞാൻ ദിവസങ്ങളിലേക്കു വന്നിരിക്കുന്നു’ എന്നാണ്; അതായത്, ‘എനിക്ക് പ്രായം ചെന്നിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ചുകൂട്ടി
  rationale: קרא എന്ന ക്രിയയ്ക്ക് לְ ചേർന്നിരിക്കുന്നതിനാൽ ആളുകളെ തന്റെ അടുക്കൽ വിളിച്ചുചേർക്കുക എന്ന അർഥമാണ് ഇവിടെ. ‘വിളിച്ചുകൂട്ടി’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: לְכָל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിനെയും
  rationale: എബ്രായപാഠത്തിലെ സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള പദവിപ്പട്ടിക ആ സമൂഹത്തെ പ്രതിനിധാനം ചെയ്ത നേതാക്കളെ വ്യക്തമാക്കുന്നു.
- source_word: לִזְקֵנָיו
  choice: അതിന്റെ മൂപ്പന്മാരെയും
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം സമൂഹമായി കാണുന്ന ‘ഇസ്രായേൽ’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്. അതിനാൽ ‘അതിന്റെ’ എന്നത് കൃത്യമാണ്.
- source_word: וּלְרָאשָׁיו
  choice: തലവന്മാരെയും
  rationale: רֹאשׁ എന്ന മൂലപദത്തിലെ ‘തല’ എന്ന രൂപകം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട് ഭരണനേതാക്കളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദമാണ് ‘തലവന്മാർ’.
- source_word: וּלְשֹׁפְטָיו
  choice: ന്യായാധിപന്മാരെയും
  rationale: ഈ പൗരഭരണസന്ദർഭത്തിൽ שׁפט നീതിന്യായ ചുമതലയുള്ള ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു; ‘ന്യായാധിപന്മാർ’ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമാണ്.
- source_word: וּלְשֹׁטְרָיו
  choice: ഉദ്യോഗസ്ഥന്മാരെയും
  rationale: שֹׁטְרִים കീഴ്തല ഭരണനിർവഹണ ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു. ‘എഴുത്തുകാർ’ എന്നത് അനാവശ്യമായി ഇടുങ്ങിയ അർഥം നൽകുന്നതിനാൽ ‘ഉദ്യോഗസ്ഥന്മാർ’ അനുയോജ്യം.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: അവരോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: אֲנִי זָקַנְתִּי
  choice: ഞാൻ വൃദ്ധനായിരിക്കുന്നു
  rationale: എബ്രായ perfect രൂപം പ്രായം ചെന്നതിന്റെ ഫലമായ ഇപ്പോഴത്തെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּאתִי בַּיָּמִים
  choice: എനിക്ക് പ്രായം വളരെ ചെന്നിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞാൻ ദിവസങ്ങളിലേക്കു വന്നിരിക്കുന്നു’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം വളരെ പ്രായമായിരിക്കുന്നു എന്നതാണ്. സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പിന്നാലെയുള്ള നേതൃപദവികളുടെ പട്ടികയുടെ വെളിച്ചത്തിൽ ‘എല്ലാ ഇസ്രായേലും’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘എല്ലാ ഇസ്രായേലിനെയും’ എന്ന സമൂഹസൂചന നിലനിർത്തി, പിന്നാലെ പ്രതിനിധികളായ നേതൃവിഭാഗങ്ങളെ പാഠത്തിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ഇസ്രായേലിന്റെ എല്ലാ നേതാക്കളെയും’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി സമൂഹസൂചനയെ നേതാക്കളിലേക്കു ചുരുക്കുക.
  rationale: എബ്രായപാഠം ആദ്യം ‘എല്ലാ ഇസ്രായേൽ’ എന്നു വ്യക്തമായി പറയുകയും തുടർന്ന് മൂപ്പന്മാർ, തലവന്മാർ, ന്യായാധിപന്മാർ, ഉദ്യോഗസ്ഥന്മാർ എന്നിവരെ പട്ടികപ്പെടുത്തുകയും ചെയ്യുന്നു. ഇവയിൽ ഒന്നിനെയും വ്യാഖ്യാനപരമായി ഒഴിവാക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ഭരണപദവികൾ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി; ‘എല്ലാ ഇസ്രായേൽ’ എന്ന സമൂഹസൂചനയെ വ്യാഖ്യാനപരമായി ചുരുക്കിയില്ല. പ്രധാന പാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിൽ ചേർത്തിരിക്കുന്നു.
