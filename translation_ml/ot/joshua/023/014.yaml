id: JOS.23.14
reference: Joshua 23:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: ml
  text: ഇതാ, ഇന്ന് ഞാൻ എല്ലാവരും പോകുന്ന വഴിയിലൂടെ പോകുന്നു.[a] നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ നിങ്ങളെക്കുറിച്ച് പറഞ്ഞ സകല നല്ല വാക്കുകളിലും ഒരു വാക്കുപോലും പാഴായിപ്പോയിട്ടില്ലെന്ന് നിങ്ങളുടെ മുഴു ഹൃദയത്തോടും മുഴു ജീവനുംകൊണ്ട് നിങ്ങൾ അറിയുന്നു.[b] അവയെല്ലാം നിങ്ങൾക്കു വന്നെത്തിയിരിക്കുന്നു; അവയിൽ ഒരു വാക്കുപോലും പാഴായിപ്പോയിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘എല്ലാവരും പോകുന്ന വഴി’ എന്നത് എല്ലാവർക്കും പൊതുവായ വിധിയെ, പ്രത്യേകിച്ച് മരണത്തെ, സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. അക്ഷരാർഥത്തിൽ: ‘സകല ഭൂമിയുടെയും വഴി.’'
    reason: cultural_note
  - marker: b
    text: 'അഥവാ, ‘ഒന്നുപോലും പരാജയപ്പെട്ടിട്ടില്ല’ / ‘ഒരു വാഗ്ദാനവും നിറവേറാതെ പോയിട്ടില്ല.’ ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഒരു വാക്കുപോലും വീണിട്ടില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പ്രസംഗത്തിന്റെ ആരംഭത്തിൽ ശ്രദ്ധ ക്ഷണിക്കുകയും വാക്കുകൾക്ക് ഗൗരവം നൽകുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: സകല ഭൂവാസികളുടെയും വഴിയേ
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം നേരിട്ട് ‘ഞാൻ മരിക്കാൻ പോകുന്നു’ എന്നു വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു; ‘ഭൂവാസികൾ’ എന്നത് മലയാളത്തിൽ ഉദ്ദേശ്യം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: നിങ്ങളുടെ മുഴുഹൃദയത്തിലും മുഴുപ്രാണനിലും
  rationale: לֵבָב എന്ന ‘ഹൃദയം’, נֶפֶשׁ എന്ന ‘പ്രാണൻ/ജീവൻ’ എന്നീ വ്യത്യസ്ത പദങ്ങളെ നിലനിർത്തി സമഗ്രമായ ആന്തരിക ബോധത്തെ അറിയിക്കുന്നു.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ഒരു വാക്കുപോലും വീണുപോയിട്ടില്ല
  rationale: דָּבָר എന്ന പദത്തിന് ‘വാക്ക്’ എന്നു നൽകി തുടർന്നുള്ള ‘അരുളിച്ചെയ്ത’ എന്ന ആശയവുമായുള്ള പദബന്ധവും נפל എന്ന ക്രിയയുടെ ‘വീഴുക’ എന്ന ഹീബ്രു ചിത്രവും നിലനിർത്തുന്നു; പരാജയപ്പെടുക/നിറവേറാതിരിക്കുക എന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വേ നിങ്ങളെക്കുറിച്ച് അരുളിച്ചെയ്ത
  rationale: עַל എന്ന ബന്ധപദത്തിന്റെ ‘നിങ്ങളെക്കുറിച്ച്/നിങ്ങളെ സംബന്ധിച്ച്’ എന്ന മൂല്യം നിലനിർത്തുന്നു; ദൈവത്തിന്റെ ഗൗരവമുള്ള വചനത്തിന് സ്വാഭാവികമായ മലയാളക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: അവയെല്ലാം നിങ്ങൾക്കു വന്നെത്തിയിരിക്കുന്നു
  rationale: നല്ല വാക്കുകളെല്ലാം ഇസ്രായേലിന് യാഥാർഥ്യമായി വന്നുചേർന്നു എന്ന എത്തിച്ചേരൽ-നിറവേറൽ ചിത്രം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമം ഒരു സ്ഥാനപദംകൊണ്ട് മാറ്റാതെ, സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദൈവത്തിന്റെ നല്ല വാക്കുകൾ നിറവേറിയതിന്റെ അവതരണം
  choice: ‘ഒരു വാക്കുപോലും വീണുപോയിട്ടില്ല’ എന്ന മൂലരൂപകം നിലനിർത്തുന്നു
  alternative: ‘ഒരു വാഗ്ദാനവും പരാജയപ്പെട്ടിട്ടില്ല’
  rationale: വാക്യം ദൈവത്തിന്റെ വിശ്വസ്തത ഉറപ്പിക്കുന്നുവെങ്കിലും דָּבָר എന്നതിനെ നിർബന്ധമായി ‘വാഗ്ദാനം’ എന്നു ചുരുക്കാതെ ‘വാക്ക്’ എന്ന അർഥവ്യാപ്തിയും נפל എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാവുന്നതും പ്രസംഗസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ‘അരുളിച്ചെയ്ത’, ‘മുഴുപ്രാണൻ’ എന്നീ പദങ്ങൾ അല്പം ഉന്നതമായെങ്കിലും ബൈബിൾസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ഇംഗ്ലീഷ് ഉപദേശപാളിയിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ മാറിപ്പോയതായി തോന്നുന്നതിനാൽ, സാംസ്കാരിക കുറിപ്പ് മരണരൂപകത്തിനരികിലും പദപരമായ കുറിപ്പ് ‘വീണുപോയിട്ടില്ല’ എന്ന പ്രയോഗത്തിനരികിലും ചേർത്തിരിക്കുന്നു.
