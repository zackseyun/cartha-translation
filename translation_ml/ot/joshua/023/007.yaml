  verdict: revise
  source_fidelity: മുഖ്യമായും മൂലനിര ശരിയായി നിലനിൽക്കുന്നു. എന്നിരുന്നാലും לְבִלְתִּי בוֹא-യുടെ ഉദ്ദേശ്യ/തടയൽബന്ധം നിലവിലെ മുഖ്യപാഠത്തിൽ വെറും ആജ്ഞയായി മാറിയിരിക്കുന്നു. കൂടാതെ ‘ഉച്ചരിക്കുക’ הזכיר-ന്റെ ‘പരാമർശിക്കുക’ എന്ന വ്യാപകമായ അർഥത്തെ അനാവശ്യമായി ചുരുക്കുന്നു.
  naturalness: ‘ആരെക്കൊണ്ടും ശപഥം ചെയ്യിക്കുക’ എന്ന പ്രയോഗത്തേക്കാൾ ‘ആരെയും ... ശപഥം ചെയ്യിക്കുക’ ആധുനിക മാനകമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ആ ദേവന്മാരുടെ പേരിൽ’ എന്ന് ആവർത്തിക്കുന്നത് സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കുന്നു.
  terminology: ‘ജനതകൾ,’ ‘ദേവന്മാർ,’ ‘ശപഥം ചെയ്യിക്കുക,’ ‘സേവിക്കുക,’ ‘കുമ്പിടുക’ എന്നിവ യോജിച്ച പദങ്ങളാണ്. הזכיר-നായി ‘പരാമർശിക്കുക’ മുഖ്യപാഠത്തിൽ കൂടുതൽ കൃത്യമാണ്; ‘വിളിച്ചപേക്ഷിക്കുക’ അടിക്കുറിപ്പിൽ സാധ്യതയായി സൂക്ഷിക്കാം.
  issues:
  - severity: medium
    issue: ഉദ്ദേശ്യബന്ധം ഒഴിവായിരിക്കുന്നു
    rationale: לְבִלְתִּי + infinitive-ന് ‘...ചെല്ലാതിരിക്കേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യ/പ്രതിരോധ അർഥമുണ്ട്. കേവലമായ ‘ചെല്ലരുത്’ ആ ബന്ധം നഷ്ടപ്പെടുത്തുന്നു.
