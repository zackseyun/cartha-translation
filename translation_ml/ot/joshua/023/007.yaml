  to: നിങ്ങളോടുകൂടെ ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകളുടെ ഇടയിലേക്കു നിങ്ങൾ കടന്നുചെല്ലാതിരിക്കേണ്ടതിനും, അവരുടെ ദേവന്മാരുടെ നാമം പരാമർശിക്കുകയോ[a] ആ ദേവന്മാരുടെ പേരിൽ ആരെയും ശപഥം ചെയ്യിക്കുകയോ[b] അവരെ സേവിക്കുകയോ അവരുടെ മുമ്പിൽ കുമ്പിടുകയോ അരുത്.
  rationale: മൂലത്തിലെ ഉദ്ദേശ്യസൂചന പുനഃസ്ഥാപിച്ചു; הזכיר-ന്റെ അടിസ്ഥാനാർഥത്തിന് യോജിച്ച് ‘ഉച്ചരിക്കുക’ എന്നത് ‘പരാമർശിക്കുക’ എന്നാക്കി; ശപഥവിലക്കിൽ കാരകാർഥവും ദേവന്മാരിലേക്കുള്ള സൂചനയും കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാക്കി. സേവിക്കുകയും കുമ്പിടുകയും ചെയ്യുന്ന വേർതിരിച്ച പ്രവൃത്തികൾ നിലനിർത്തിയിരിക്കുന്നു.
