  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: ml
  text: നിങ്ങളോടുകൂടെ ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകളുടെ ഇടയിലേക്കു നിങ്ങൾ കടന്നുചെല്ലാതിരിക്കേണ്ടതിനും, അവരുടെ ദേവന്മാരുടെ നാമം പരാമർശിക്കുകയോ[a] ആ ദേവന്മാരുടെ പേരിൽ ആരെയും ശപഥം ചെയ്യിക്കുകയോ[b] അവരെ സേവിക്കുകയോ അവരുടെ മുമ്പിൽ കുമ്പിടുകയോ അരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ദേവന്മാരുടെ നാമം വിളിച്ചപേക്ഷിക്കുകയോ.’ എബ്രായക്രിയയ്ക്ക് ‘പരാമർശിക്കുക’ എന്നും, ഈ സന്ദർഭത്തിൽ ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ ദേവന്മാരുടെ പേരിൽ ശപഥം ചെയ്യുകയോ.’ എബ്രായക്രിയ കാരകരൂപത്തിലാണ്; അക്ഷരാർഥത്തിൽ ‘ശപഥം ചെയ്യിക്കുക’ എന്നാണ്. അതിൽ മറ്റുള്ളവരെ ആ ദേവന്മാരുടെ പേരിൽ ശപഥം ചെയ്യിക്കുന്നതും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: ഈ ജനതകളുടെ ഇടയിൽ നിങ്ങൾ ചെല്ലരുത്
  rationale: לְבִלְתִּי കൂടെയുള്ള infinitive നിരോധനമോ തടയുന്ന ഉദ്ദേശ്യമോ പ്രകടിപ്പിക്കുന്നു. בוא + ב ഇവിടെ വെറും ഭൂമിശാസ്ത്രപരമായ പ്രവേശനത്തേക്കാൾ അവരുടെ ഇടയിലേക്കു ചെന്ന് അവരുമായി ബന്ധപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഇടയിൽ ചെല്ലുക’ ആ രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: നിങ്ങളോടുകൂടെ ശേഷിച്ചിരിക്കുന്ന ഈ ജനതകൾ
  rationale: שׁאר എന്ന participle ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു; אִתְּכֶם എന്നത് അവർ ഇസ്രായേലിനോടുകൂടെ ഇപ്പോഴും നിലനിൽക്കുന്നതായി നേരിട്ട് നൽകുന്നു.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: അവരുടെ ദേവന്മാരുടെ നാമം ഉച്ചരിക്കരുത്
  rationale: Hiphil הזכיר എന്നതിന് ‘പരാമർശിക്കുക/ഉച്ചരിക്കുക’ എന്നും ആരാധനാസന്ദർഭത്തിൽ ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള അർഥം നൽകി സന്ദർഭസാധ്യമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: അവരുടെ പേരിൽ ആരെക്കൊണ്ടും ശപഥം ചെയ്യിക്കരുത്
  rationale: שׁבע എന്നതിന്റെ Hiphil രൂപം കാരകമാണ്—‘ശപഥം ചെയ്യിക്കുക.’ എബ്രായത്തിൽ കർമ്മം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘ആരെക്കൊണ്ടും’ ചേർത്തിരിക്കുന്നു.
- source_word: וְלֹא תַעַבְדוּם
  choice: അവരെ സേവിക്കരുത്
  rationale: עבד എന്നത് മതപരമായ സേവനം ഉൾപ്പെടെ ‘സേവിക്കുക’ എന്നാണ്. അടുത്ത ക്രിയയായ കുമ്പിടുന്നതിൽനിന്നുള്ള പദവ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: അവരുടെ മുമ്പിൽ കുമ്പിടരുത്
  rationale: ഈ രൂപത്തിലുള്ള שׁחה ശരീരം കുനിച്ച് പ്രണമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കുമ്പിടുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട പ്രവൃത്തികളുടെ നിര
  choice: നാമം ഉച്ചരിക്കുക, ശപഥം ചെയ്യിക്കുക, സേവിക്കുക, കുമ്പിടുക എന്നീ വിലക്കുകൾ വെവ്വേറെ നിലനിർത്തി.
  alternative: എല്ലാം പൊതുവായി ‘ആരാധിക്കരുത്’ എന്ന് ചുരുക്കുക.
  rationale: എബ്രായപാഠം അന്യദേവന്മാരോടുള്ള കൂറിന്റെ വ്യത്യസ്ത പ്രവൃത്തികളെ പ്രത്യേകം പറയുന്നു. അവയെ ഒരൊറ്റ പൊതുപദത്തിലാക്കുന്നത് പാഠത്തിന്റെ വ്യക്തമായ നിരയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദേവന്മാർ,’ ‘ശപഥം,’ ‘സേവിക്കുക,’ ‘കുമ്പിടുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ച് മൂലത്തിലെ വ്യത്യസ്ത ആരാധനാപ്രവൃത്തികൾ വേർതിരിച്ചിരിക്കുന്നു. ദീർഘവാക്യത്തിലെ നിരോധനപരമ്പര സ്വാഭാവികമാക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
