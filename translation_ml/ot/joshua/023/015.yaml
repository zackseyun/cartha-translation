  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: ml
  text: 'ഇങ്ങനെ സംഭവിക്കും: നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങളോടു അരുളിച്ചെയ്ത സകല നല്ല വചനവും നിങ്ങളുടെമേൽ വന്നതുപോലെതന്നെ, യഹോവ സകല ദോഷകരമായ വചനവും[a] നിങ്ങളുടെമേൽ വരുത്തും; നിങ്ങളുടെ ദൈവമായ യഹോവ നിങ്ങൾക്കു തന്ന ഈ നല്ല ദേശത്തുനിന്ന് നിങ്ങളെ നശിപ്പിച്ചുകളയുന്നതുവരെ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകല ദോഷവും” അല്ലെങ്കിൽ “സകല അനർഥവും.” എബ്രായത്തിൽ അക്ഷരാർഥം “സകല ദോഷകരമായ വചനവും”; ഇത് വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ “സകല നല്ല വചനവും” എന്ന പ്രയോഗത്തിനു സമാന്തരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അങ്ങനെ സംഭവിക്കും
  rationale: ഭാവിയിൽ ഉറപ്പായി സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്ത് ചേർത്തു.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: വന്നതുപോലെതന്നെ ... വരുത്തും
  rationale: നിറവേറിയ അനുഗ്രഹവും വരാനിരിക്കുന്ന ന്യായവിധിയും തമ്മിലുള്ള തുല്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: בָּא עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ വന്നത്
  rationale: പൂർണമായ ക്രിയ മുൻവാഗ്ദാനങ്ങളുടെ ഇതിനകം യാഥാർഥ്യമായ നിറവേറ്റലിനെ സൂചിപ്പിക്കുന്നു; עַל എന്നതിന്റെ രൂപകപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: സകല നല്ല വചനവും
  rationale: דָּבָר എന്നതിന്റെ ‘വചനം/കാര്യം’ എന്ന വ്യാപ്തിയിൽ ഇവിടെ ദൈവം അരുളിച്ചെയ്തത് ഉദ്ദേശിക്കുന്നു; തുടർന്നുള്ള പ്രതികൂല ‘വചന’വുമായി ഉള്ള മനഃപൂർവമായ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: നിങ്ങളോടു അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ പ്രസംഗത്തിന് യോജിച്ച, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമം പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: നിങ്ങളുടെമേൽ വരുത്തും
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവവും ആവർത്തിച്ച עַל പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כָּל הַדָּבָר הָרָע
  choice: സകല ദോഷകരമായ വചനവും
  rationale: ‘നല്ല വചനം’ എന്നതിനോടുള്ള പദസമാന്തരത സംരക്ഷിക്കുമ്പോൾ, רָע ഇവിടെ ധാർമിക തിന്മയെക്കാൾ പ്രതികൂലമായ ന്യായവിധിഫലത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: നിങ്ങളെ നശിപ്പിച്ചുകളയുന്നതുവരെ
  rationale: ന്യായവിധി എത്തിച്ചേരുന്ന അന്തിമപരിധിയും സമ്പൂർണ ഫലവും വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל הָאֲדָמָה
  choice: ദേശത്തുനിന്ന്
  rationale: ഹീബ്രുവിലെ സ്ഥലപരമായ വേർപെടുത്തൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ദേശത്തിന്റെ മുകളിൽനിന്ന്’ എന്ന അത്യന്തം പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ നിയമനാമത്തെ പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; ആധുനിക മലയാള വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ദൈവത്തിന്റെ ന്യായവിധിയെ വിവരിക്കുന്ന רָע
  choice: ദോഷകരമായ വചനം
  alternative: തിന്മയായ വചനം; അനർഥം; ദുരന്തം
  rationale: ദൈവം ധാർമിക തിന്മ പ്രവർത്തിക്കുന്നു എന്ന ആശയം അനാവശ്യമായി വരുത്താതെ പ്രതികൂല നിയമശിക്ഷ സൂചിപ്പിക്കുന്നു; അതേസമയം ‘നല്ല വചനം/ദോഷകരമായ വചനം’ എന്ന ഹീബ്രു സമാന്തരതയും ദൈവം അരുളിയ വാക്കിന്റെ നിറവേറ്റലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾഗദ്യം. ‘അരുളിച്ചെയ്ത’, ‘സകല’, ‘നശിപ്പിച്ചുകളയുന്നതുവരെ’ തുടങ്ങിയ രൂപങ്ങൾ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ അത്യന്തം പ്രാചീനമായ വാക്യക്രമം ഒഴിവാക്കി. താരതമ്യഘടനയും നല്ല/ദോഷകരമായ വചനം എന്ന ആവർത്തനവും പ്രത്യേകം സംരക്ഷിച്ചു.
