  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ തന്നേ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് തുരത്തിക്കളയും; നിങ്ങളുടെ മുമ്പിൽനിന്ന് അവരെ കുടിയൊഴിപ്പിക്കും. നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കും[a], നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു പറഞ്ഞതുപോലെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ ദേശം നിങ്ങൾ അവകാശമായി നേടും.’ എബ്രായ ക്രിയയ്ക്ക് ‘അവകാശമായി നേടുക’ എന്നും ‘കൈവശമാക്കുക’ എന്നും അർഥമാകാം; കീഴടക്കൽസന്ദർഭം കണക്കിലെടുത്ത് മുഖ്യപാഠത്തിൽ ‘കൈവശമാക്കും’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു പറഞ്ഞതുപോലെ’ എന്നാണ് എബ്രായപാഠം. ഇവിടെ പറഞ്ഞ വാക്കുകൾക്ക് വാഗ്ദാനത്തിന്റെ അർഥവുമുണ്ട്; എങ്കിലും മുഖ്യപാഠം ‘പറഞ്ഞു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: യഹ്‌വെയോടു ചേർന്ന ദ്വിതീയപുരുഷ ബഹുവചന പ്രത്യയം ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הוּא
  choice: തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നൽ നിലനിർത്തി, പ്രവർത്തിക്കുന്നത് യഹ്‌വെ തന്നെയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: יֶהְדֳּפֵם
  choice: അവരെ ... തുരത്തുക
  rationale: הדף എന്ന ക്രിയയിലെ ബലമായി അകറ്റുന്ന അർഥം കീഴടക്കൽസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ആവർത്തിച്ചുവരുന്ന എബ്രായ സ്ഥലസൂചക പ്രയോഗം രണ്ടിടത്തും ഒരേ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: അവരെ ... കുടിയൊഴിപ്പിക്കുക
  rationale: ഹിഫിൽ രൂപം നിലവിലെ നിവാസികളെ അവരുടെ കൈവശഭൂമിയിൽനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻ ക്രിയയായ ‘തുരത്തുക’ എന്നതിൽനിന്നുള്ള അർഥവ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: וִירִשְׁתֶּם
  choice: നിങ്ങൾ ... കൈവശമാക്കും
  rationale: ירש എന്ന ക്രിയയ്ക്ക് ‘അവകാശമായി ലഭിക്കുക’ എന്നും ‘കൈവശമാക്കുക’ എന്നും അർഥമാകാം; ഇവിടെ ദേശം ഏറ്റെടുക്കുന്ന കീഴടക്കൽസന്ദർഭത്തിന് ‘കൈവശമാക്കുക’ യോജിക്കുന്നു.
- source_word: אֶת אַרְצָם
  choice: അവരുടെ ദേശം
  rationale: ജനതകൾ ഇപ്പോൾ അധിവസിക്കുന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥതാപ്രയോഗമാണിത്.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: നിങ്ങളോടു പറഞ്ഞതുപോലെ
  rationale: דבר എന്ന ക്രിയയുടെ ‘പറയുക/സംസാരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വാഗ്ദാനഭാവം വായനക്കാരന് തിരിച്ചറിയാൻ വിടുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ലിപ്യന്തരിച്ചു; സ്ഥാനപ്പേരാക്കി മാറ്റിയില്ല.
- issue: ירש എന്ന ഒരേ ധാതുവിന്റെ ഹിഫിൽ, ഖാൽ രൂപങ്ങളിലെ വ്യത്യാസം
  choice: ‘കുടിയൊഴിപ്പിക്കുക’ / ‘കൈവശമാക്കുക’
  alternative: രണ്ടിടത്തും ‘തുരത്തുക’; അല്ലെങ്കിൽ ഇസ്രായേലിന്റെ പ്രവൃത്തിക്ക് ‘അവകാശമായി നേടുക’
  rationale: ആദ്യപ്രയോഗത്തിൽ ജനതകൾക്ക് കൈവശം നഷ്ടമാകുന്നതും രണ്ടാമത്തേതിൽ ഇസ്രായേൽ ദേശം കൈവശമാക്കുന്നതുമായ പരസ്പരബന്ധിതമായെങ്കിലും വ്യത്യസ്തമായ അർഥങ്ങൾ സംരക്ഷിക്കുന്നു.
- issue: כַּאֲשֶׁר דִּבֶּר എന്നതിലെ വാഗ്ദാനഭാവം
  choice: പറഞ്ഞതുപോലെ
  alternative: വാഗ്ദാനം ചെയ്തതുപോലെ
  rationale: വാക്കുകൾ സന്ദർഭത്തിൽ വാഗ്ദാനമായി പ്രവർത്തിക്കുന്നുവെങ്കിലും, മൂലക്രിയയുടെ പൊതുവായ ‘പറയുക’ എന്ന അർഥം നിലനിർത്തി വാഗ്ദാനഭാവം അമിതമായി നിർവചിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തന്നെയാണ്’ എന്ന പ്രയോഗം എബ്രായ സർവനാമത്തിന്റെ ഊന്നൽ നൽകുന്നു. ആവർത്തിച്ച ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന്’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഘടന മനസ്സിലാകുന്ന വിധം നിലനിർത്തിയിരിക്കുന്നു; ‘കുടിയൊഴിപ്പിക്കുക’ ഭൂമിയുടെ കൈവശം നഷ്ടപ്പെടുത്തുന്ന അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
