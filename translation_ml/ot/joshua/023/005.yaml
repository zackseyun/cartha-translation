  to: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ തന്നേ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് തുരത്തിക്കളയും; നിങ്ങളുടെ മുമ്പിൽനിന്ന് അവരെ കുടിയൊഴിപ്പിക്കും. നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കും[a], നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളോടു പറഞ്ഞതുപോലെ[b].
