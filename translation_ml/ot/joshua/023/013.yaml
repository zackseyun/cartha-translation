source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: ml
  text: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ഇനി ഈ ജനതകളെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയില്ലെന്ന് നിങ്ങൾ തീർച്ചയായും അറിഞ്ഞുകൊള്ളുക.[a] അവർ നിങ്ങൾക്കു കെണിയും കുടുക്കും, നിങ്ങളുടെ പാർശ്വങ്ങളിൽ ചാട്ടവാറടിയും നിങ്ങളുടെ കണ്ണുകളിൽ മുള്ളുകളും ആയിത്തീരും; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു നൽകിയ ഈ നല്ല ദേശത്തുനിന്ന് നിങ്ങൾ നശിച്ചുപോകുന്നതുവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇനി ഈ ജനതകളെ നീക്കിക്കളഞ്ഞുകൊണ്ടിരിക്കുകയില്ല.”
    reason: לֹא יוֹסִיף + infinitive എന്ന പ്രയോഗത്തിൽ തുടരുന്ന പ്രവൃത്തി അവസാനിക്കുന്നതിന്റെ ഭാവം കൂടുതൽ തുറന്നുകാട്ടുന്ന മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: നിങ്ങൾ തീർച്ചയായും അറിഞ്ഞുകൊള്ളുക
  rationale: ידע എന്ന ധാതുവിന്റെ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന പ്രയോഗത്തിലെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: ഇനി ... നീക്കിക്കളയുകയില്ല
  rationale: יסף + infinitive സൂചിപ്പിക്കുന്ന തുടർന്നുള്ള പ്രവൃത്തിയുടെ അവസാനവും, ഹിഫിൽ രൂപത്തിലുള്ള ירש സൂചിപ്പിക്കുന്ന ജനതകളെ ദേശത്തുനിന്ന് പുറത്താക്കലും സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
- source_word: מִלִּפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായത്തിലെ സ്ഥാനസംബന്ധിയായ ദൃശ്യരൂപം നിലനിർത്തുന്ന, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പ്രയോഗം.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: കെണിയും കുടുക്കും
  rationale: രണ്ട് അടുത്ത അർഥമുള്ള എബ്രായപദങ്ങളുടെ ആലങ്കാരിക ഇരട്ടിപ്പ് രണ്ടു വ്യത്യസ്ത മലയാളപദങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: നിങ്ങളുടെ പാർശ്വങ്ങളിൽ ചമ്മട്ടി
  rationale: അർഥം ദുഷ്കരമായ שֹׁטֵט വേദനിപ്പിക്കുന്ന പ്രഹരോപകരണമോ കഠിനബാധയോ സൂചിപ്പിക്കുന്നതായി പരമ്പരാഗതമായി ഗ്രഹിക്കപ്പെടുന്നു; ശരീരദൃശ്യം നിലനിർത്തിക്കൊണ്ട് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകളിൽ മുള്ളുകൾ
  rationale: തുടർച്ചയായ വേദനയും ഉപദ്രവവും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ മൂർച്ചയുള്ള വസ്തുവിന്റെ ദൃശ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד אֲבָדְכֶם
  choice: നിങ്ങൾ നശിച്ചുപോകുന്നതുവരെ
  rationale: עד-നുശേഷമുള്ള infinitive construct ഭീഷണിപ്പെടുത്തപ്പെട്ട ഫലത്തിന്റെ അന്തിമപരിധി വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: ഈ നല്ല ദേശത്തുനിന്ന്
  rationale: אדמה ഇവിടെ വെറും മണ്ണിനെയല്ല, ദൈവം നൽകിയ ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി מעל ലളിതമായി ‘നിന്ന്’ എന്നു പകർന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളലിപിയിൽ പകർന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെയും ‘Jehovah’ എന്ന പിന്നീടുണ്ടായ രൂപം സ്വീകരിക്കാതെയും മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: മുന്നറിയിപ്പിന്റെ ഉടമ്പടിസംബന്ധിയായ സ്വഭാവം
  choice: യഹ്‌വെ ജനതകളെ തുടർന്നും നീക്കിക്കളയാതിരിക്കുക, അവർ ഇസ്രായേലിന് ഉപദ്രവമാകുക, ഒടുവിൽ ദത്തദേശത്തുനിന്ന് ഇസ്രായേൽ നശിച്ചുപോകുക എന്നീ ബന്ധങ്ങൾ അതേപടി നിലനിർത്തി
  alternative: ഇത് ഉടമ്പടിസംബന്ധമില്ലാത്ത ഒരു സൈനിക പ്രവചനമായി മാത്രം വ്യക്തമാക്കുക
  rationale: വാക്യം ദൈവത്തിന്റെ പ്രവർത്തനം നിൽക്കുന്നതും ജനതകളുടെ ഉപദ്രവവും ദൈവം നൽകിയ നല്ല ദേശത്തിന്റെ നഷ്ടവും തമ്മിൽ ബന്ധിപ്പിക്കുന്നു; അതിലപ്പുറം ഒരു വ്യാഖ്യാനരീതി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ ശരീരദൃശ്യങ്ങളും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തി; ദുഷ്കരമായ പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
