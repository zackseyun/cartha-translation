revisions:
- from: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ ഇനി ഈ ജനതകളെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളയുകയില്ലെന്ന് നിങ്ങൾ തീർച്ചയായും അറിഞ്ഞുകൊള്ളുക.[a] അവർ നിങ്ങൾക്കു കെണിയും കുടുക്കും, നിങ്ങളുടെ പാർശ്വങ്ങളിൽ ചമ്മട്ടിയും[b] നിങ്ങളുടെ കണ്ണുകളിൽ മുള്ളുകളും ആയിത്തീരും; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു നൽകിയ ഈ നല്ല ദേശത്തുനിന്ന് നിങ്ങൾ നശിച്ചുപോകുന്നതുവരെ അങ്ങനെതന്നെ ആയിരിക്കും.
