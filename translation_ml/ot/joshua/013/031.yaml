source:
  edition: WLC
  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: ml
  text: ഗിലെയാദിന്റെ പകുതിയും ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ പട്ടണങ്ങളായ[a] അഷ്ടാരോത്തും എദ്രെയിയും മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ പുത്രന്മാർക്ക്—മാഖീരിന്റെ പുത്രന്മാരിൽ പകുതിക്ക്[b]—അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിന്റെ പട്ടണങ്ങൾ.” ഇതിനെ “ബാശാനിലെ ഓഗിന്റെ രാജകീയ പട്ടണങ്ങൾ” എന്നും മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “മാഖീരിന്റെ പുത്രന്മാർ” എന്നത് വിശാലമായ അർഥത്തിൽ മാഖീരിന്റെ പിൻഗാമികളെയും സൂചിപ്പിക്കാം; പരിഭാഷ ഹീബ്രുവിലെ കുടുംബബന്ധപദം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: ഗിലെയാദിന്റെ പകുതിയും
  rationale: വാക്യാരംഭത്തിലെ וַ മുൻവാക്യത്തിലെ അവകാശപ്പട്ടിക തുടരുന്നു; പ്രദേശത്തിന്റെ പകുതി എന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: അഷ്ടാരോത്തും എദ്രെയിയും
  rationale: സ്ഥലപ്പേരുകളുടെ ഹീബ്രു രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ പട്ടണങ്ങളായ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം ഏതെങ്കിലും പ്രത്യേക തലസ്ഥാനപദവി ചുമത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ പുത്രന്മാർക്ക് ... ലഭിച്ചു
  rationale: לְ സൂചിപ്പിക്കുന്ന ഓഹരി നൽകൽ മലയാളത്തിൽ വ്യക്തമാക്കാൻ മൂലത്തിൽ സൂചിതമായ ക്രിയയായി ‘ലഭിച്ചു’ ചേർത്തു; ‘പുത്രന്മാർ’ എന്ന കുടുംബഭാഷ നിലനിർത്തി.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: മാഖീരിന്റെ പുത്രന്മാരിൽ പകുതിക്ക്
  rationale: മാഖീരിന്റെ വംശവിഭാഗത്തിൽ ഒരു പകുതിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അർധഗോത്രം’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആ ഭരണ-വംശാവലി ഭാവം ‘കുലങ്ങൾ’ കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഭൂവിഭജനത്തിന്റെ ഔദ്യോഗിക ഭാവം നിലനിർത്താൻ ‘കുലങ്ങൾക്കനുസരിച്ച്’ ഉപയോഗിച്ചു. ആവർത്തനമുള്ള ഹീബ്രു ഘടന ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
