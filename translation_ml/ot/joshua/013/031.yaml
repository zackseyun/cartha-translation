  source_fidelity: ഹീബ്രു വാക്യത്തിലെ ഭൂവിഭജനപ്പട്ടിക, ‘ഗിലെയാദിന്റെ പകുതി,’ ബാശാനിലെ ഓഗിന്റെ രാജ്യത്തിലെ അഷ്ടാരോത്തും എദ്രെയിയും, മാഖീർ–മനശ്ശെ വംശബന്ധം, മാഖീരിന്റെ പുത്രന്മാരിൽ പകുതി, കുലങ്ങളനുസരിച്ചുള്ള വിഭജനം എന്നിവ കൃത്യമായി പ്രതിഫലിക്കുന്നു. സൂചിതമായ അനുവദന/ലഭ്യതാഭാവം വ്യക്തമാക്കാൻ ‘ലഭിച്ചു’ ചേർത്തത് സ്വാഭാവികവും അർഥനിഷ്ഠവുമാണ്.
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു. ഡാഷുകൾ അവസാനത്തെ വിശദീകരണഘടകത്തെ വ്യക്തമായി വേർതിരിക്കുന്നു; ‘പട്ടണങ്ങളായ അഷ്ടാരോത്തും എദ്രെയിയും’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്.
  terminology: സ്ഥലപ്പേരുകളും വ്യക്തിപേരുകളും സ്ഥിരതയോടെയും ഉപയോഗയോഗ്യമായ ലിപ്യന്തരണത്തോടെയും നൽകിയിരിക്കുന്നു. ‘കുലങ്ങൾക്കനുസരിച്ച്’ ഭൂവിഭജനസന്ദർഭത്തിലെ מִשְׁפְּחוֹת എന്നതിന് യോജിച്ച ഭരണ-വംശാവലിപദമാണ്. അടിക്കുറിപ്പുകൾ മുഖ്യവാചകത്തോട് യോജിക്കുകയും അവയുടെ അടയാളങ്ങൾ പ്രസക്തമായ സ്ഥാനങ്ങളിൽ വരികയും ചെയ്യുന്നു.
