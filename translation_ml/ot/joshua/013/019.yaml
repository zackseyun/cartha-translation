  footnotes:
  - marker: a
    text: 'അഥവാ, പേരിന്റെ രണ്ടാം ഘടകം അർത്ഥമാക്കി പരിഭാഷപ്പെടുത്തിയാൽ: “പ്രഭാതത്തിന്റെ സെരെത്ത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: കിർയാത്തയീം
  rationale: പട്ടണത്തിന്റെ പേരായതിനാൽ അർത്ഥം പരിഭാഷപ്പെടുത്താതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ എഴുതുന്നു.
- source_word: שִׂבְמָה
  choice: സിബ്മാ
  rationale: സ്ഥലപ്പേര് ലിപ്യന്തരണം ചെയ്തു; שׂ എന്ന ആദിവ്യഞ്ജനത്തിന് ഇവിടെ ‘സ’ ഉപയോഗിക്കുന്നു.
- source_word: צֶרֶת הַשַּׁחַר
  choice: സെരെത്ത്-ശഹർ
  rationale: പട്ടണങ്ങളുടെ പട്ടികയിൽ വരുന്ന സംയുക്ത സ്ഥലപ്പേരായി കണ്ട് പ്രധാനപാഠത്തിൽ രണ്ടു ഘടകങ്ങളും ലിപ്യന്തരണം ചെയ്യുന്നു. രണ്ടാം ഘടകമായ הַשַּׁחַר-ന്റെ ‘പ്രഭാതം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּהַר הָעֵמֶק
  choice: താഴ്‌വരയിലെ കുന്നിന്മേലുള്ള
  rationale: בְ എന്ന സ്ഥലസൂചകത്തെ ‘-മേൽ’ എന്നും הַר-നെ പ്രാദേശിക ഭൂപ്രകൃതിക്ക് യോജിച്ച ‘കുന്ന്’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; הָעֵמֶק-മായുള്ള ബന്ധം ‘താഴ്‌വരയിലെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഇത് പട്ടികയുടെ മധ്യത്തിലുള്ള വാക്യഘടകമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി; സ്ഥലപ്പേരുകൾ പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ നൽകി.
