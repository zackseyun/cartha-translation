source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: ml
  text: അവരുടെ പ്രദേശം യാസേറും ഗിലെയാദിലെ എല്ലാ പട്ടണങ്ങളും അമ്മോന്യരുടെ ദേശത്തിന്റെ പകുതിയും റബ്ബായ്ക്ക് എതിർവശത്തുള്ള അരോവേർവരെയും ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “റബ്ബായ്ക്ക് അഭിമുഖമായുള്ള.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “റബ്ബായുടെ മുമ്പിലുള്ള” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: അവരുടെ പ്രദേശം ... ആയിരുന്നു
  rationale: גְּבוּל എന്നത് അതിർത്തിയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ അവകാശമായി ലഭിച്ച സ്ഥലങ്ങളുടെ പട്ടിക വരുന്നതിനാൽ ‘പ്രദേശം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: יַעְזֵר
  choice: യാസേർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: ഗിലെയാദിലെ എല്ലാ പട്ടണങ്ങളും
  rationale: עָרֵי എന്നത് പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഭൂപ്രദേശപ്പട്ടികയിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ ദേശത്തിന്റെ പകുതിയും
  rationale: בְּנֵי עַמּוֹן എന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ ‘അമ്മോന്യർ’ എന്നും אֶרֶץ ഭൂപ്രദേശസന്ദർഭത്തിൽ ‘ദേശം’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: עַד עֲרוֹעֵר
  choice: അരോവേർവരെയും
  rationale: עַד പ്രദേശപരിധി സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ എന്ന അർഥം സംയുക്തരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: റബ്ബയ്ക്ക് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי എന്ന പ്രയോഗം ‘മുമ്പിൽ,’ ‘അഭിമുഖമായി,’ ‘എതിർവശത്ത്’ എന്നീ സ്ഥലബന്ധങ്ങൾ സൂചിപ്പിക്കാം. ദിശ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘അഭിമുഖമായുള്ള’ മൂലത്തിലെ ദൃശ്യഭാവവും അവ്യക്തതയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ പട്ടികാശൈലി നിലനിർത്തിയിരിക്കുന്നു; സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിലാണ്.
