  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: ml
  text: അവരുടെ അതിർത്തി അർന്നോൻ താഴ്വരയുടെ[a] അരികിലുള്ള അരോവേർ മുതൽ, താഴ്വരയുടെ നടുവിലുള്ള പട്ടണവും മേദെബവരെയുള്ള പീഠഭൂമി[b] മുഴുവനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അർന്നോൻ നീർച്ചാലിന്റെ കരയിലുള്ള’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം നീർച്ചാൽ, വരണ്ട നീർച്ചാൽപ്പാത (വാടി), അല്ലെങ്കിൽ ഇടുങ്ങിയ താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിരപ്പായ പ്രദേശം’ അല്ലെങ്കിൽ ‘സമതലം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: അവരുടെ അതിർത്തി ... ആരംഭിച്ചു; ... അതിൽ ഉൾപ്പെട്ടിരുന്നു
  rationale: അതിർത്തിവിവരണത്തിലെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കാൻ ഈ വാക്യഘടന ഉപയോഗിച്ചു; പ്രദേശത്തിന്റെ തുടക്കവും തുടർന്ന് ഉൾപ്പെടുന്ന സ്ഥലങ്ങളും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: מֵעֲרוֹעֵר
  choice: അരോവേർ മുതൽ
  rationale: מִן അതിർത്തിയുടെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ശബ്ദാന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: അർന്നോൻ താഴ്വരയുടെ അരികിലുള്ള
  rationale: שׂפה എന്നത് ‘അരിക്/കര’ എന്നും נחל താഴ്വര, വാടി, നീർച്ചാൽ എന്നിവയും സൂചിപ്പിക്കാം. ഭൂമിശാസ്ത്രപരമായ രൂപം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘താഴ്വര’ തിരഞ്ഞെടുത്തു; പദാർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: താഴ്വരയുടെ നടുവിലുള്ള പട്ടണം
  rationale: בְּתוֹךְ എന്നതിന്റെ ‘നടുവിൽ/ഉള്ളിൽ’ എന്ന സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְכָל הַמִּישֹׁר
  choice: പീഠഭൂമി മുഴുവനും
  rationale: מִישׁוֹר ഇവിടെ യോർദാന്റെ കിഴക്കുള്ള നിരപ്പായ ഉയർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘പീഠഭൂമി’ ആ ഭൂമിശാസ്ത്രസ്വഭാവം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַל מֵידְבָא
  choice: മേദെബവരെയുള്ള
  rationale: അതിർത്തിവിവരണത്തിൽ עַל ഒരു സ്ഥലത്തോളമുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെയുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തിതമായ ബന്ധകഘടന അതേപടി അനുകരിക്കാതെ, അതിർത്തിയുടെ ആരംഭവും അതിൽ ഉൾപ്പെട്ട പ്രദേശങ്ങളും വ്യക്തമായി വേർതിരിച്ചു.
