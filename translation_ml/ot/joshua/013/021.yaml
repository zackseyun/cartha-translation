  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: ml
  text: പീഠഭൂമിയിലെ എല്ലാ പട്ടണങ്ങളും[a], ഹെശ്ബോനിൽ വാണിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോന്റെ രാജ്യം മുഴുവനും—സീഹോനെയും മിദ്യാന്റെ പ്രമാണിമാരായ ഏവി, രേക്കെം, സൂർ, ഹൂർ, രേബ എന്നിവരെയും മോശെ അടിച്ചുതോൽപ്പിച്ചു; അവർ ദേശത്തു പാർത്തിരുന്ന സീഹോന്റെ പ്രഭുക്കന്മാരായിരുന്നു[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമതലപ്രദേശത്തെ പട്ടണങ്ങൾ’ എന്നും ‘നിരപ്പുനിലത്തിലെ പട്ടണങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അടിച്ചു’; ഈ യുദ്ധസന്ദർഭത്തിൽ നിർണായകമായി തോൽപ്പിച്ചു എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായപാഠം രണ്ട് വ്യത്യസ്ത സ്ഥാനപദങ്ങൾ ഉപയോഗിക്കുന്നു: ‘മിദ്യാന്റെ പ്രമാണിമാർ’ (נְשִׂיאֵי), ‘സീഹോന്റെ പ്രഭുക്കന്മാർ’ (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: സമതലപ്രദേശത്തിലെ എല്ലാ പട്ടണങ്ങളും
  rationale: മִישׁוֹר ഇവിടെ യോർദ്ദാനക്കരയിലെ ഉയർന്ന നിരപ്പായ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘സമതലപ്രദേശം’ ഭൂഭാഗത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: സീഹോന്റെ രാജ്യം മുഴുവനും
  rationale: מַמְלְכוּת എന്നത് രാജ്യം അഥവാ രാജാധികാരപരിധി എന്നാണ്. വാക്യാരംഭത്തിലെ כָל മലയാളത്തിൽ സ്വാഭാവികമായി ‘മുഴുവനും’ എന്നു ചേർത്തു.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ
  rationale: ഹീബ്രു നിർമാണബന്ധം നേരിട്ട് നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ വാണിരുന്ന
  rationale: מָלַךְ പ്രത്യേകമായി രാജാവായി വാഴുക എന്നർഥം നൽകുന്നതിനാൽ ‘ഭരിച്ചിരുന്ന’ എന്ന പൊതുപദത്തേക്കാൾ ‘വാണിരുന്ന’ അനുയോജ്യം.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: മോശെ സീഹോനെയും ... സംഹരിച്ചു
  rationale: נכה യുദ്ധസന്ദർഭത്തിൽ അടിച്ചുതകർക്കുക, പരാജയപ്പെടുത്തുക, കൊല്ലുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഈ പട്ടികയിലെ വ്യക്തികളെ സംബന്ധിച്ച സമാന്തരവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘സംഹരിച്ചു’ നിർണായകമായ പരാജയവും മരണവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: മിദ്യാന്യപ്രമുഖന്മാർ
  rationale: נָשִׂיא നേതാവ്, തലവൻ, പ്രഭു എന്നീ അർഥങ്ങളുള്ള സ്ഥാനപദമാണ്. പിന്നാലെയുള്ള വ്യത്യസ്ത പദമായ נְסִיכֵי-യിൽനിന്ന് വേർതിരിക്കാൻ ‘പ്രമുഖന്മാർ’ ഉപയോഗിച്ചു.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: ഏവി, രേക്കെം, സൂർ, ഹൂർ, രേബ
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: נְסִיכֵי סִיחוֹן
  choice: സീഹോന്റെ പ്രഭുക്കന്മാർ
  rationale: נָסִיךְ ഭരണപദവിയുള്ള പ്രഭുവിനെയോ രാജകുമാരനെയോ സൂചിപ്പിക്കുന്നു. ഇവർ സീഹോന്റെ പുത്രന്മാരാണെന്ന് പാഠം പറയാത്തതിനാൽ വംശബന്ധം സൂചിപ്പിക്കാവുന്ന ‘രാജകുമാരന്മാർ’ ഒഴിവാക്കി; മുൻപത്തെ נְשִׂיאֵי-യിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തി.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ആ ദേശത്തു താമസിച്ചിരുന്നവർ
  rationale: ישׁב-ന്റെ കർത്തൃവാചക കൃദന്തം പാർക്കുക/താമസിക്കുക എന്ന ആശയം നൽകുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ഹീബ്രു വാക്യത്തിലെ ദീർഘമായ ബന്ധവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; എന്നാൽ പട്ടണങ്ങളും രാജ്യവും രൂബേൻഗോത്രത്തിന് ലഭിച്ച അവകാശഭാഗമാണെന്ന മുൻവാക്യസന്ദർഭം വ്യക്തമാക്കാൻ ‘അവർക്കു ലഭിച്ചു’ ചേർത്തു. സ്ഥാനപദങ്ങളിലെ ഹീബ്രു വ്യത്യാസം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
