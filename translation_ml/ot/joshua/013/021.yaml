- from: സമതലപ്രദേശത്തിലെ എല്ലാ പട്ടണങ്ങളും[a], ഹെശ്ബോനിൽ വാണിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോന്റെ രാജ്യം മുഴുവനും അവർക്കു ലഭിച്ചു. മോശെ സീഹോനെയും മിദ്യാന്യപ്രമുഖന്മാരായ ഏവി, രേക്കെം, സൂർ, ഹൂർ, രേബ എന്നിവരെയും സംഹരിച്ചു[b]. അവർ സീഹോന്റെ പ്രഭുക്കന്മാരും[c] ആ ദേശത്തു താമസിച്ചിരുന്നവരുമായിരുന്നു.
  to: പീഠഭൂമിയിലെ എല്ലാ പട്ടണങ്ങളും[a], ഹെശ്ബോനിൽ വാണിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോന്റെ രാജ്യം മുഴുവനും—സീഹോനെയും മിദ്യാന്റെ പ്രമാണിമാരായ ഏവി, രേക്കെം, സൂർ, ഹൂർ, രേബ എന്നിവരെയും മോശെ അടിച്ചുതോൽപ്പിച്ചു; അവർ ദേശത്തു പാർത്തിരുന്ന സീഹോന്റെ പ്രഭുക്കന്മാരായിരുന്നു[c][b].
  rationale: The unsupported contextual completion has been removed. The named leaders are retained as an appositional group, identified as Sihon’s princes and inhabitants of the land, as in the Hebrew. The geographical term and military verb have been adjusted for greater source fidelity and idiomatic modern Malayalam, while retaining the lexical alternatives and the distinction between the two Hebrew rank terms.
