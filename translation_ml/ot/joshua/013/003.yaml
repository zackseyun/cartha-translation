source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: ml
  text: ഈജിപ്തിനു മുന്നിലുള്ള[a] ശീഹോർമുതൽ വടക്കോട്ടുള്ള എക്രോന്റെ അതിർത്തിവരെ—അതു കനാന്യരുടെ പ്രദേശമായി കണക്കാക്കപ്പെടുന്നു—ഫെലിസ്ത്യരുടെ അഞ്ചു പ്രഭുക്കന്മാരുടെ പ്രദേശങ്ങൾ, അതായത് ഗസ്സക്കാരന്റേത്, അശ്ദോദുകാരന്റേത്, അശ്കെലോനുകാരന്റേത്, ഗത്തുകാരന്റേത്, എക്രോനുകാരന്റേത്, കൂടാതെ അവ്വീയരുടെയും പ്രദേശം ഉൾപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈജിപ്തിന്റെ കിഴക്കുള്ള.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “ഈജിപ്തിനു മുന്നിലുള്ള” എന്നാണ്.
    reason: עַל־פְּנֵי എന്ന സ്ഥലസൂചന സന്ദർഭത്തിൽ കിഴക്ക് എന്ന് മനസ്സിലാക്കാവുന്നതാണെങ്കിലും മൂലപാഠം ആ ദിശ നേരിട്ട് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ അക്ഷരാർഥസ്ഥലസൂചനയും കുറിപ്പിൽ സാദ്ധ്യമായ ഭൂമിശാസ്ത്രപരമായ വ്യാഖ്യാനവും നൽകുന്നു.
lexical_decisions:
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: ഈജിപ്തിന്റെ മുമ്പിലുള്ള
  rationale: പദസമുച്ചയത്തിന്റെ അടിസ്ഥാന സ്ഥലസൂചനയായ ‘ഈജിപ്തിന്റെ മുമ്പിൽ/അഭിമുഖമായി’ എന്നത് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കിഴക്കുഭാഗം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും ‘കിഴക്ക്’ എന്ന ദിശ മൂലപാഠത്തിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ... പ്രഭുക്കന്മാർ
  rationale: סֶרֶן എന്നത് ഫെലിസ്ത്യ നഗരരാജ്യങ്ങളുടെ ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന പദമാണ്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഔദ്യോഗികവുമായ ‘പ്രഭു’ അനുയോജ്യം.
- source_word: לַכְּנַעֲנִי תֵּחָשֵׁב
  choice: അതു കനാന്യരുടെ പ്രദേശമായി കണക്കാക്കപ്പെടുന്നു
  rationale: സ്ത്രീലിംഗ ക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘പ്രദേശം’ ചേർത്തിരിക്കുന്നു; അവകാശവാദം പരിഹരിക്കാതെ ‘കണക്കാക്കപ്പെടുന്നു’ എന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: הָעַוִּים
  choice: അവ്വീയരും
  rationale: ജനവിഭാഗത്തിന്റെ പേര് ലിപ്യന്തരണം ചെയ്ത് വാക്യത്തിലെ ബന്ധകമായ ‘ഉം’ നിലനിർത്തുന്നു; അവരെ അഞ്ചു ഫെലിസ്ത്യ പ്രഭുക്കന്മാരിൽ ഒരാളായി തെറ്റായി ഉൾപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ഈ ഭൂവിഭാഗം കനാന്യരുടേതായി കണക്കാക്കപ്പെടുന്നതിന്റെ സ്വഭാവം
  choice: ‘കനാന്യരുടെ പ്രദേശമായി കണക്കാക്കപ്പെടുന്നു’ എന്ന മൂലപാഠത്തിലെ വിലയിരുത്തൽഭാഷ നിലനിർത്തി.
  alternative: ‘കനാന്യരുടെ ദേശമാണ്’ എന്ന് നിർണായക അവകാശവാദമായി വിവർത്തനം ചെയ്യുക.
  rationale: תֵּחָשֵׁב എന്ന നിഷ്ക്രിയ ക്രിയയിലെ ‘കണക്കാക്കപ്പെടുന്നു’ എന്ന സൂക്ഷ്മതയും ചരിത്ര-ഭൂമിശാസ്ത്രപരമായ സംഘർഷവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ശൈലി. സ്ഥലനാമങ്ങളും ജനനാമങ്ങളും മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾക്ക് അടുത്തായി ലിപ്യന്തരിച്ചു. ദീർഘമായ എബ്രായ പട്ടികയുടെ ഘടന ഡാഷ്, ദ്വിബിന്ദു, അർധവിരാമം എന്നിവ ഉപയോഗിച്ച് വ്യക്തമായി സൂക്ഷിച്ചു.
