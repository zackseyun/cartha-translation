  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: ml
  text: ശകുനം നോക്കുന്നവനായ ബെയോരിന്റെ മകൻ ബിലെയാമിനെയും ഇസ്രായേൽമക്കൾ തങ്ങൾ കൊന്നവരുടെ കൂട്ടത്തിൽ വാളുകൊണ്ട് കൊന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങൾ കൊന്നവരോടൊപ്പം.” അവസാനത്തെ എബ്രായ പ്രയോഗം അല്പം അസാധാരണമാണ്; ഇസ്രായേൽ കൊന്ന മറ്റുള്ളവരോടു ബന്ധപ്പെട്ടാണ് ബിലെയാം കൊല്ലപ്പെട്ടതെന്ന് അത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: …ബിലെയാമിനെയും
  rationale: וְയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും אֶת സൂചിപ്പിക്കുന്ന കർമസ്ഥാനവും മലയാളത്തിലെ ‘-നെയും’ സ്വാഭാവികമായി ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: ബെയോരിന്റെ മകൻ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങളും പിതൃനാമബന്ധവും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַקּוֹסֵם
  choice: ദിവ്യലക്ഷണം നോക്കുന്നവൻ
  rationale: קֹסֵם എന്നത് ഗൂഢലക്ഷണങ്ങളിലൂടെയോ ദിവ്യജ്ഞാനരീതികളിലൂടെയോ അറിവ് തേടുന്നവനെ സൂചിപ്പിക്കുന്നു. ‘പ്രവാചകൻ’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥം വരാതെയും ‘മന്ത്രവാദി’ എന്ന അതിരുകടന്ന അർഥം ചേർക്കാതെയും ഈ പ്രയോഗം ആശയം വ്യക്തമാക്കുന്നു.
- source_word: הָרְגוּ
  choice: കൊന്നു
  rationale: കൊല്ലുക എന്ന സാധാരണ അർഥം അലങ്കാരമില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായപ്രയോഗം മലയാളത്തിലെ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּחֶרֶב
  choice: വാളുകൊണ്ട്
  rationale: കരണാർഥത്തിലുള്ള בְּയെ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל חַלְלֵיהֶם
  choice: തങ്ങൾ കൊന്നവരുടെ കൂട്ടത്തിൽ
  rationale: അസാധാരണമായ എബ്രായപ്രയോഗത്തിലെ ബന്ധം/കൂട്ടിച്ചേർക്കൽഭാവം നിലനിർത്തുന്നു; ബിലെയാം ഇസ്രായേൽമക്കൾ കൊന്ന മറ്റുള്ളവരുമായി ബന്ധപ്പെട്ട് കൊല്ലപ്പെട്ടുവെന്നതാണ് ആശയം.
