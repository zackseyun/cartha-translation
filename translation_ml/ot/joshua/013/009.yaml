translation:
  language: ml
  text: അർന്നോൻ താഴ്‌വരയുടെ വക്കിലുള്ള അരോവേർ മുതൽ, താഴ്‌വരയുടെ നടുവിലുള്ള പട്ടണവും മേദേബാ മുതൽ ദീബോൻ വരെയുള്ള സമതലപ്രദേശം മുഴുവനും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: അർന്നോൻ താഴ്‌വരയുടെ വക്ക്
  rationale: שָׂפָה എന്നത് അക്ഷരാർഥത്തിൽ ‘അരിക്/വക്ക്’ എന്നാണ്; נַחַל സന്ദർഭത്തിൽ ജലധാരയോടുകൂടിയ താഴ്‌വരയെയോ വാടിയെയോ സൂചിപ്പിക്കാം. ഭൂമിശാസ്ത്രപരമായ സ്വാഭാവികതയും മൂലപാഠത്തിന്റെ വിശാലതയും നിലനിർത്താൻ ‘താഴ്‌വരയുടെ വക്ക്’ സ്വീകരിച്ചു.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: താഴ്‌വരയുടെ നടുവിൽ
  rationale: בְּתוֹךְ എന്നതിന്റെ ‘ഉള്ളിൽ/നടുവിൽ’ എന്ന സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; പട്ടണം ജലത്തിനുള്ളിലാണെന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַמִּישֹׁר
  choice: സമതലപ്രദേശം
  rationale: മോവാബിന്റെ ഉയർന്ന സമതലഭൂമിയെ സൂചിപ്പിക്കുന്ന പദം; സാധാരണ മലയാളത്തിൽ വ്യക്തമായ ‘സമതലപ്രദേശം’ അനുയോജ്യം.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യഘടനയുമായി തുടരുന്ന പട്ടികയായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അൽപവിരാമം നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
