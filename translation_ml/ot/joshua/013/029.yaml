  source_fidelity: 'The draft accurately renders the principal allotment formula: Moses gave to the half-tribe of Manasseh, and the allotment was for the half-tribe of Manasseh''s sons/descendants, by their clans. However, the Malayalam predicate construction “അത് ... പകുതിഗോത്രത്തിന് ... ആയിരുന്നു” is incomplete/awkward for the possessive-distributive force of וַיְהִי in this context.'
