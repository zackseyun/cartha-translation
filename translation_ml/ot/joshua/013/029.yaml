  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ/יְהִ֗י לַ/חֲצִ֛י מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: ml
  text: 'മോശെ മനശ്ശെയുടെ പകുതിഗോത്രത്തിനു നൽകി; അത് മനശ്ശെയുടെ പുത്രന്മാരുടെ[a] പകുതിഗോത്രത്തിനുള്ളതായിരുന്നു, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘മനശ്ശെയുടെ പുത്രന്മാർ’; മനശ്ശെയിൽനിന്നുള്ള ഗോത്രസന്തതികളെ സൂചിപ്പിക്കുന്ന ബന്ധുത്വപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: നൽകി
  rationale: ഭൂവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ נתן എന്ന ക്രിയയുടെ നേരായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നൽകപ്പെട്ടത് അവകാശഭൂമിയാണെന്ന് മുൻവിവരണം വ്യക്തമാക്കുന്നു.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പകുതിഗോത്രത്തിനു
  rationale: חֲצִי എന്നതിന്റെ ‘പകുതി’ എന്ന അർഥവും שֵׁבֶט എന്നതിന്റെ ഗോത്രഘടക അർഥവും സ്വാഭാവികമായ മലയാള സംയുക്തപദത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיְהִי
  choice: അത് … ആയിരുന്നു
  rationale: എബ്രായത്തിലെ ലളിതമായ ‘അത് ആയിരുന്നു’ എന്ന ഘടനയും അതിലെ സൂചനാത്മകമായ വിതരണബന്ധവും അനാവശ്യമായി ‘അവകാശമായി ലഭിച്ചു’ എന്നു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: מַטֶּה എന്നതിന് ‘വടി’ എന്നും അർഥമുണ്ടെങ്കിലും ഈ ഭരണപരവും ഭൂവിഭജനപരവുമായ സന്ദർഭത്തിൽ ഗോത്രം എന്നതാണ് ഉചിതം.
- source_word: בְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ ബന്ധുത്വപ്രയോഗം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു; ഇവിടെ അത് മനശ്ശെയുടെ ഗോത്രപരമ്പരയിലെ സന്തതികളെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: മִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; לְ എന്നതിന്റെ വിതരണാർഥം ‘അനുസരിച്ച്’ എന്നു പ്രകടമാക്കുന്നു.
