translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ആവർത്തനമുള്ള എബ്രായ ഭൂവിഭജനസൂത്രം സ്വാഭാവികമാക്കാൻ ‘അതായത്’ ചേർത്തിരിക്കുന്നു; കർമം മൂലപാഠത്തിലെന്നപോലെ പരോക്ഷമായി നിലനിർത്തി.
