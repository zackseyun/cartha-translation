  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ לְ/מַטֵּה גָ֔ד לִ/בְנֵי גָ֖ד לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: ml
  text: മോശെ ഗാദ് ഗോത്രത്തിന്—ഗാദിന്റെ പുത്രന്മാർക്ക്[a]—അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗാദിന്റെ മക്കൾക്ക്/സന്തതികൾക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഗാദിന്റെ പുത്രന്മാർക്ക്’ എന്നാണ്; ഗോത്രവംശത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ נתן നൽകുക അഥവാ അവകാശമായി ഏൽപ്പിക്കുക എന്നർഥം നൽകുന്നു. എബ്രായത്തിലെന്നപോലെ എന്താണ് കൊടുത്തതെന്ന കർമം ഇവിടെ വ്യക്തമാക്കാതെ വച്ചിരിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ വടി എന്നും വരാമെങ്കിലും ഈ വംശീയ-ഭൂപങ്കിടൽസന്ദർഭത്തിൽ ഗോത്രം എന്നാണ് അർഥം.
- source_word: גָד
  choice: ഗാദ്
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לִבְנֵי
  choice: പുത്രന്മാർക്ക്
  rationale: בְּנֵי എന്നതിന്റെ അക്ഷരാർഥം പുത്രന്മാർ എന്നാണ്; ഗോത്രപരമായ പ്രയോഗത്തിൽ ഗാദിന്റെ സന്തതികളെയോ ഗോത്രാംഗങ്ങളെയോ പൊതുവായി സൂചിപ്പിക്കാം. ആ മൂലപ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്ന ഉപസർഗത്തിന്റെ വിതരണാർഥം ‘അനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
