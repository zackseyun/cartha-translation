reference: Joshua 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: ml
  text: ലേവി ഗോത്രത്തിനു മാത്രം അവൻ അവകാശഭൂമിയൊന്നും നൽകിയില്ല; ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണങ്ങളാണ്[a] അവന്റെ അവകാശം[b]—അവൻ അവനോടു പറഞ്ഞതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വെയുടെ അഗ്നിയർപ്പണങ്ങൾ.”'
    reason: lexical_alternative
  - marker: b
    text: സമീപഭാഗങ്ങളുടെ വെളിച്ചത്തിൽ ചിലർ ഇത് “ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് അവന്റെ അവകാശം” എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: മാത്രം
  rationale: മുമ്പുള്ള ഭൂവിഭജനത്തിൽനിന്ന് ലേവി ഗോത്രത്തെ ഒഴിവാക്കുന്ന നിയന്ത്രണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: ലേവി ഗോത്രത്തിനു
  rationale: ‘കൊടുത്തു’ എന്ന ക്രിയയോടൊപ്പമുള്ള לְ എന്ന മുൻപ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: לֹא נָתַן נַחֲלָה
  choice: അവകാശഭൂമിയൊന്നും നൽകിയില്ല
  rationale: ഇവിടത്തെ നַחֲלָה ഭൂവിഭജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവകാശഭൂമി’ സന്ദർഭം വ്യക്തമാക്കുകയും നിഷേധത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אִשֵּׁי יְהוָה
  choice: യഹ്‌വെയ്ക്ക് അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങൾ
  rationale: אִשֵּׁי എന്ന പദത്തിന്റെ അഗ്നിയർപ്പണസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; അതിനെ പ്രത്യേക യാഗവിഭാഗമായ ‘ദഹനയാഗം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ ശബ്ദാനുസൃതമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായത്തിലെ ബന്ധനിർമ്മിതി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא נַחֲלָתוֹ
  choice: അവന്റെ അവകാശം
  rationale: തൊട്ടുമുമ്പുള്ള യാഗങ്ങളെ അവകാശമായി ഗ്രഹിക്കുന്ന നേരിട്ടുള്ള വാക്യഘടന പിന്തുടരുന്നു; ഏകവചന സർവനാമവും ബഹുവചന ആശയവും തമ്മിലുള്ള എബ്രായ പിരിമുറുക്ക് മലയാളത്തിൽ സ്വാഭാവികമായി കൈകാര്യം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: അവൻ അവനോടു പറഞ്ഞതുപോലെ
  rationale: ‘പറഞ്ഞു’ എന്ന അടിസ്ഥാന ക്രിയാർഥവും സർവനാമങ്ങളുടെ മൂലപാഠത്തിലുള്ള അവ്യക്തതയും നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ലേവിയുടെ അവകാശത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയ്ക്ക് അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളാണ് അവന്റെ അവകാശം
  alternative: ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ തന്നെയാണ് അവന്റെ അവകാശം
  rationale: ഈ വാക്യത്തിലെ തൊട്ടടുത്ത വാക്യഘടന യാഗങ്ങളെ മുൻസൂചനയായി എടുക്കാൻ അനുകൂലമാണ്. സമീപവാക്യങ്ങളുടെ വെളിച്ചത്തിൽ യഹ്‌വെയെ തന്നെയാണ് അവകാശമെന്നു ഗ്രഹിക്കുന്ന പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂവിഭജനസന്ദർഭം വ്യക്തമാക്കാൻ ‘അവകാശഭൂമി’ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. മൂലത്തിലെ സർവനാമാവ്യക്തത ‘അവൻ അവനോടു’ എന്ന രൂപത്തിൽ മനപ്പൂർവം നിലനിർത്തി.
