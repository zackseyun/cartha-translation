  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: ml
  text: അവനോടൊപ്പം[a] രൂബേന്യരും ഗാദ്യരും തങ്ങളുടെ അവകാശഭൂമി കൈപ്പറ്റിയിരുന്നു. യോർദ്ദാന്ന് അപ്പുറം, കിഴക്കുഭാഗത്ത്, യഹ്‌വേയുടെ ദാസനായ മോശ അവർക്കു നൽകിയതുപോലെയായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൻ” എന്നത് മുൻസന്ദർഭത്തിൽ പറഞ്ഞ മനശ്ശെയുടെ പാതിഗോത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: עִמּוֹ
  choice: അവനോടൊപ്പം
  rationale: മുൻസന്ദർഭത്തിലെ മനശ്ശെയുടെ പാതിഗോത്രത്തെയാണ് പുരുഷലിംഗ ഏകവചന പ്രത്യയം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തിഗത/ഗോത്രപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: രൂബേന്യരും ഗാദ്യരും
  rationale: എബ്രായത്തിലെ ഏകവചന ഗോത്രനാമങ്ങൾ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: לָקְחוּ נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശഭൂമി കൈപ്പറ്റിയിരുന്നു
  rationale: לקח ഇവിടെ അനുവദിച്ച ഭൂമി സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. נחלהയുടെ പാരമ്പര്യാവകാശവും ഭൂവിഹിതവുമായ ഭാവം ‘അവകാശഭൂമി’ വ്യക്തമാക്കുന്നു; മുൻകാല സംഭവമെന്ന ബന്ധം ‘കൈപ്പറ്റിയിരുന്നു’ പ്രകടമാക്കുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: യോർദ്ദാനക്കരെ കിഴക്കുഭാഗത്ത്
  rationale: ‘യോർദ്ദാന്റെ മറുകരയിൽ, കിഴക്കോട്ട്’ എന്ന സ്ഥലസൂചന സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വേയുടെ ദാസനായ
  rationale: മോശയുടെ ബഹുമാനസൂചക പദവിയും ദൈവനാമമായ יהוהയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ ആധുനിക മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- issue: נחלה എന്ന പദത്തിന്റെ ഭൂമിയും പാരമ്പര്യാവകാശവും ഉൾക്കൊള്ളുന്ന അർഥം
  choice: അവകാശഭൂമി
  alternative: അവകാശം / ഓഹരി
  rationale: ഇവിടെ നൽകപ്പെട്ടത് ഗോത്രത്തിന്റെ ഭൂവിഹിതമായതിനാൽ, നിയമ-ഉടമ്പടി ഭാവം നഷ്ടപ്പെടുത്താതെ വസ്തുത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനഘടന മലയാളത്തിൽ സ്വാഭാവികമായ രണ്ടു വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തിയിട്ടുണ്ട്.
