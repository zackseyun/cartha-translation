    rationale: The Hebrew denotes the region beyond/across the Jordan; in this context מִזְרָחָה specifies its eastern side. “യോർദ്ദാന്ന് അപ്പുറം, കിഴക്കുഭാഗത്ത്” communicates this more accurately than a term that may mean the riverbank.
