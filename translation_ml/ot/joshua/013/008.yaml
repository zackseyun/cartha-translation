  source_fidelity: The draft correctly identifies the tribal referent of עִמּוֹ, renders the collective gentilics naturally, and retains the land-inheritance sense of נַחֲלָה. However, “യോർദ്ദാനക്കരെ” can suggest the riverbank rather than the territory beyond/across the Jordan, and the final sentence recasts כַּאֲשֶׁר (“just as/as”) as a simple identification rather than retaining its comparative force.
