id: JOS.13.33
reference: Joshua 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: ml
  text: എന്നാൽ ലേവി ഗോത്രത്തിന് മോശെ ഒരു അവകാശവും[a] നൽകിയില്ല; യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ തന്നെയാണ് അവരുടെ അവകാശം, അവൻ അവരോടു പറഞ്ഞതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവകാശം’ എന്നതിന് ഈ വാക്യത്തിലെ രണ്ടിടത്തും ‘ഓഹരി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: എന്നാൽ ലേവി ഗോത്രത്തിന്
  rationale: വാവിന് സന്ദർഭത്തിലെ മുൻ ഗോത്രവിഹിതങ്ങളോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നും, שֵׁבֶט הַלֵּוִי എന്ന ഗോത്രഘടകത്തെ സ്വാഭാവികമായി ‘ലേവി ഗോത്രം’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: മോശെ ഒരു അവകാശവും നൽകിയില്ല
  rationale: നിഷേധത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; נַחֲלָהയുടെ ഭൂവിഹിതപരവും ഉടമ്പടിപരവുമായ അർഥവ്യാപ്തി ‘അവകാശം’ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ദൈവമായ
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ വായനാസുഗമമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הוּא נַחֲלָתָם
  choice: തന്നെയാണ് അവരുടെ അവകാശം
  rationale: ഹീബ്രായയിലെ ഊന്നൽസർവനാമമായ הוּאയെ ‘തന്നെയാണ്’ വഴി പ്രകടമാക്കുകയും ആദ്യത്തെ נַחֲלָהയോടുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: അവിടന്ന് അവരോടു അരുളിച്ചെയ്തതുപോലെ
  rationale: דבר എന്നതിന്റെ ‘പറയുക/സംസാരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: ലേവിയുടെ ‘അവകാശം’ എന്നതിന്റെ സ്വഭാവം
  choice: യഹ്‌വേ തന്നെയാണ് അവരുടെ അവകാശം
  alternative: യഹ്‌വേയാണ് അവരുടെ ഓഹരി
  rationale: ലേവിക്ക് ഭൂവിഹിതമില്ലെന്ന പ്രസ്താവനയ്ക്കൊപ്പം യഹ്‌വേ തന്നെയാണ് അവരുടെ נַחֲלָה എന്ന മൂലപാഠത്തിലെ ശക്തമായ ദൈവശാസ്ത്രപരമായ രൂപകം അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘അരുളിച്ചെയ്തു’ ദൈവത്തിന്റെ സംസാരത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; എന്നാൽ ‘വാഗ്ദാനം ചെയ്തു’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
