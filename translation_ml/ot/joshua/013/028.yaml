  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: ml
  text: ഇതായിരുന്നു ഗാദിന്റെ മക്കളുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇതാണ് ഗാദിന്റെ മക്കളുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി—പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.’ ഹീബ്രുവിലെ ഈ സംഗ്രഹവാക്യം വർത്തമാനകാലത്തിലോ ഭൂതകാലത്തിലോ വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: ഇതായിരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന സൂചകസർവനാമം മുമ്പ് വിവരിച്ച ദേശവിഹിതത്തെ സൂചിപ്പിക്കുന്നു. വിവരണത്തിന്റെ സമാപനസൂത്രമായതിനാൽ ഭൂതകാലരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്; വർത്തമാനകാലരൂപവും സാധ്യമാണ്.
- source_word: נַחֲלַת
  choice: അവകാശഭൂമി
  rationale: ദേശവിഭജനസന്ദർഭത്തിൽ പാരമ്പര്യാവകാശമായി ലഭിച്ച വിഹിതമോ കൈവശഭൂമിയോ എന്ന ആശയം പദം വഹിക്കുന്നു. ‘അവകാശഭൂമി’ അതിന്റെ ഭൂമിയെയും അവകാശത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי גָד
  choice: ഗാദിന്റെ മക്കൾ
  rationale: ഗാദിൽനിന്ന് ഉത്ഭവിച്ച ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന വംശാവലിപരമായ ഹീബ്രു പ്രയോഗം സ്രോതസ്സിനോട് അടുത്ത രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങൾ അനുസരിച്ചുള്ള വിതരണം അല്ലെങ്കിൽ വർഗീകരണം לְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ദേശവിഹിതപ്പട്ടികകളിലെ സ്ഥിരവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണ പദത്തിന് സ്വാഭാവികമായ മലയാള തത്തുല്യം.
- source_word: וְחַצְרֵיהֶם
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട ആശ്രിത ഗ്രാമീണ വാസകേന്ദ്രങ്ങളെയാണ് חָצֵר ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമങ്ങൾ’ ആ ബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ദേശവിഭജനസന്ദർഭത്തിലെ സാങ്കേതിക ആശയം വ്യക്തമാക്കാൻ ‘അവകാശഭൂമി’ ഉപയോഗിച്ചു; ഹീബ്രു വംശാവലിപ്രയോഗം ‘ഗാദിന്റെ മക്കൾ’ എന്നു നിലനിർത്തി.
