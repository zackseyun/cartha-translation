  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതു സൂചിപ്പിക്കാൻ അവസാനത്തെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
