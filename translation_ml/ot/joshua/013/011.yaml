  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: ml
  text: ഗിലെയാദും, ഗെശൂര്യരുടെയും മയഖാത്യരുടെയും പ്രദേശവും[a], ഹെർമ്മോൻ പർവതം മുഴുവനും[b], സൽഖാവരെയുള്ള ബാശാൻ മുഴുവനും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഗെശൂര്യരുടെയും മയഖാത്യരുടെയും അതിർത്തി.” എബ്രായപദം അതിർത്തിരേഖയെയോ ഒരു ജനതയുടെ അധീനപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ പ്രദേശങ്ങളുടെ പട്ടികയായതിനാൽ “പ്രദേശം” എന്ന അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “ഹെർമ്മോൻ പർവതം മുഴുവനും.” ഇത് പർവതശിഖരം മാത്രമല്ല, ഹെർമ്മോൻ മലനിരയെയോ പർവതമേഖലയെയോ മുഴുവനായി സൂചിപ്പിക്കാം.
    reason: cultural_note
