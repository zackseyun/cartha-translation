- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: ഗെശൂര്യരുടെയും മയഖാത്യരുടെയും പ്രദേശം
  rationale: גְּבוּל എന്നത് അതിർത്തിരേഖയെയും ഒരു ജനതയുടെ അധീനപ്രദേശത്തെയും സൂചിപ്പിക്കാം; ഇവിടെ പ്രദേശങ്ങളുടെ പട്ടികയായതിനാൽ ‘പ്രദേശം’ സന്ദർഭത്തിന് യോജിക്കുന്നു. ഏകവചന ജാതിനാമങ്ങൾ മലയാളത്തിൽ കൂട്ടായ അർഥമുള്ള ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: כֹל הַר חֶרְמוֹן
  choice: ഹെർമ്മോൻ പർവതപ്രദേശം മുഴുവനും
  rationale: הַר എന്നത് ഒരു പർവതശിഖരം മാത്രമല്ല, പർവതമേഖലയെയും സൂചിപ്പിക്കാം; כֹל ഉള്ളതിനാൽ ഇവിടെ മുഴുവൻ ഹെർമ്മോൻ മലനിരയോ പർവതമേഖലയോ ഉദ്ദേശിക്കപ്പെടാൻ സാധ്യതയുണ്ട്.
- source_word: כָל הַבָּשָׁן
  choice: ബാശാൻ മുഴുവനും
  rationale: പ്രദേശനാമവും כָּל എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד סַלְכָה
  choice: സൽഖവരെയുള്ള
  rationale: עַד പ്രദേശത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെയുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
