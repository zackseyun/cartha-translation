translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾക്ക് സമീപമായി ലിപ്യന്തരിച്ചു. മൂലത്തിലെ പ്രദേശപ്പട്ടികയുടെ ഘടന വ്യക്തമാക്കാൻ ദ്വിബിന്ദുവും അവസാന കണക്കിന് ദീർഘരേഖയും ഉപയോഗിച്ചു.
