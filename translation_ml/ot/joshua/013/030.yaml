source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: ml
  text: 'അവരുടെ ഭൂപ്രദേശം മഹനയീം മുതൽ ആരംഭിച്ചു: ബാശാൻ മുഴുവനും, ബാശാൻ രാജാവായ ഓഗിന്റെ രാജ്യം മുഴുവനും, ബാശാനിലുള്ള യായീരിന്റെ എല്ലാ ഗ്രാമങ്ങളും[a]—ആകെ അറുപത് പട്ടണങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഹവ്വോത്ത്-യായീർ”; ഈ പാർപ്പിടങ്ങൾക്കുള്ള എബ്രായനാമത്തിന്റെ പരമ്പരാഗത ലിപ്യന്തരണം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: അവരുടെ ഭൂപ്രദേശം
  rationale: גְּבוּל എന്നതിന് അതിർത്തി എന്നും അതിനുള്ളിലെ പ്രദേശം എന്നും അർഥമാകാം. ഗോത്രവിഹിതത്തിന്റെ പശ്ചാത്തലത്തിൽ അതിർത്തിരേഖയെക്കാൾ അനുവദിക്കപ്പെട്ട പ്രദേശമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: מִמַּחֲנַיִם
  choice: മഹനയീംമുതൽ ആരംഭിച്ചു
  rationale: מִן പ്രദേശവിവരണത്തിന്റെ ആരംഭസ്ഥാനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തമാക്കാൻ ‘മുതൽ ആരംഭിച്ചു’ എന്നു നൽകി.
- source_word: כָּל הַבָּשָׁן
  choice: ബാശാൻ മുഴുവനും
  rationale: כָּל എന്നതിന്റെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗിന്റെ രാജ്യം മുഴുവനും
  rationale: מַמְלְכוּת എന്നത് രാജ്യം അഥവാ രാജാധീനപ്രദേശം എന്നർഥം നൽകുന്നു; ഇവിടെ ‘രാജ്യം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חַוֹּת יָאִיר
  choice: യായീരിന്റെ എല്ലാ ഗ്രാമങ്ങളും
  rationale: חַוֹּת ഇവിടെ യായീരുമായി ബന്ധപ്പെട്ട പാർപ്പിടങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതിനാൽ അർഥപരമായി വിവർത്തനം ചെയ്തു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שִׁשִּׁים עִיר
  choice: അറുപത് പട്ടണങ്ങൾ
  rationale: עִיר പട്ടണം അല്ലെങ്കിൽ നഗരം എന്നർഥമുള്ളതാണ്. ആധുനിക മഹാനഗരം എന്ന ധാരണ ഒഴിവാക്കി പുരാതന പാർപ്പിടകേന്ദ്രങ്ങൾക്ക് യോജിക്കുന്ന ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
