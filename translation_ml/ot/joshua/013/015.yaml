  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: ml
  text: മോശെ രൂബേന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രൂബേന്യർ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘രൂബേന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ ഭൂവിഭജനസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവകാശം കൊടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിന്
  rationale: ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; לְ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בְנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ‘രൂബേന്റെ പുത്രന്മാർ’ എന്ന ബന്ധുത്വപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; לְ എന്നതിന്റെ വിതരണപരമായ അർഥം ‘അനുസരിച്ച്’ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കുലം’ ഗോത്രത്തിനുള്ളിലെ കുടുംബാധിഷ്ഠിത വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ നേരിട്ട് പറയാത്തതെങ്കിലും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ഭൂവിഹിതം വ്യക്തമാക്കാൻ ‘അവകാശം’ ചേർത്തിരിക്കുന്നു.
