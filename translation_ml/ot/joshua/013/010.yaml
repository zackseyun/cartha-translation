  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ പ്രദേശപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ, ഹീബ്രുവിലെ ബന്ധകസ്വഭാവം ‘എല്ലാ പട്ടണങ്ങളും’ എന്നതിലെ ‘-ഉം’ വഴി നിലനിർത്തി.
