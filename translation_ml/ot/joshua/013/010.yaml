  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: ml
  text: ഹെശ്ബോനിൽ വാണിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോന്റെ എല്ലാ പട്ടണങ്ങളും, അമ്മോന്യരുടെ[a] അതിർത്തിവരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അമ്മോന്റെ പുത്രന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: എല്ലാ … -ഉം
  rationale: വാക്യഭാഗത്തെ മുൻപുള്ള പ്രദേശവിവരണത്തോടു ബന്ധിപ്പിക്കുന്ന וְ എന്ന സംയോജകവും כֹל എന്നതിന്റെ സമഗ്രതയും മലയാളത്തിലെ ‘-ഉം’ എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: עָרֵי
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപമാണിത്. പ്രദേശങ്ങളുടെ പട്ടികയിൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യാപകവുമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: סִיחוֹן
  choice: സീഹോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകി.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവ്
  rationale: ഹീബ്രു സംയുക്തബന്ധം സുതാര്യമായി നിലനിർത്തുന്നു; ഏകവചന ജനവിഭാഗനാമം സന്ദർഭത്തിൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചന ജനനാമം സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר מָלַךְ
  choice: വാണിരുന്ന
  rationale: מָלַךְ എന്നതിലെ രാജാവായി ഭരിക്കുക എന്ന പ്രത്യേക അർഥം ‘വാണിരുന്നു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘-ൽ’ കൊണ്ടും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തും നൽകി.
- source_word: עַד גְּבוּל
  choice: അതിർത്തിവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന പ്രദേശവ്യാപ്തിയുടെ പരിധി മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്യർ
  rationale: അക്ഷരാർഥത്തിൽ ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇത് അമ്മോൻ ജനതയെ സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു ജനനാമപ്രയോഗമാണ്. വായനാസൗകര്യത്തിനായി ‘അമ്മോന്യർ’ മുഖ്യപാഠത്തിൽ നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
