  language: ml
  text: ഇപ്പോൾ ഈ ദേശം ഒൻപതു ഗോത്രങ്ങൾക്കും മനശ്ശെയുടെ പാതിഗോത്രത്തിനും അവകാശമായി വിഭജിച്ചുകൊടുക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇനി ഈ ദേശം ഒൻപതു ഗോത്രങ്ങൾക്കും മനശ്ശെഗോത്രത്തിന്റെ പകുതിക്കും അവകാശമായി വിഭജിച്ചുകൊടുക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന കല്പനയിലേക്കുള്ള സന്ദർഭമാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ഇനി’ എന്നും സാധ്യമാണ്.
- source_word: חַלֵּק
  choice: വിഭജിച്ചുകൊടുക്കുക
  rationale: യോശുവയോടുള്ള ഏകവചന കല്പനയാണ്. വെറും വിഭജനമല്ല, ഗോത്രങ്ങൾക്കായി പങ്കിട്ടുനൽകുന്നതാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: ചർച്ചയിലുള്ള ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമപദം; ‘ദേശം’ വിശാലവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּנַחֲלָה
  choice: അവകാശമായി
  rationale: ഗോത്രങ്ങൾക്ക് ലഭിക്കുന്ന പാരമ്പര്യഭൂവിഹിതം എന്ന נַחֲלָהയുടെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: ഒൻപതു ഗോത്രങ്ങൾക്കും
  rationale: വിഭജിച്ചുനൽകുന്നതിന്റെ സ്വീകർത്താക്കളെ ദാതിവ് രൂപത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: പാതിഗോത്രത്തിനും
  rationale: അംഗീകൃതമായ ഗോത്രവിഭാഗത്തെ ഒറ്റ സംയുക്തപദമായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ‘ഗോത്രത്തിന്റെ പകുതിക്കും’ എന്ന രൂപവും സാധ്യമാണ്.
- source_word: הַמְנַשֶּׁה
  choice: മനശ്ശെയുടെ
  rationale: വ്യക്തി/ഗോത്രനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
