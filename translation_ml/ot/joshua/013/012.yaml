source:
  edition: WLC
  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: ml
  text: ബാശാനിലെ ഓഗിന്റെ രാജ്യം മുഴുവനും ഇതിൽ ഉൾപ്പെട്ടിരുന്നു. അഷ്ടരോത്തിലും എദ്രെയിയിലും വാണിരുന്ന അവൻ റെഫായീമ്യരിൽ[a] ശേഷിച്ചവനായിരുന്നു. മോശെ അവരെ വെട്ടിവീഴ്ത്തി അവരുടെ ദേശത്തുനിന്ന് ഒഴിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭീമന്മാർ.’ എബ്രായത്തിൽ ‘റെഫായീം’; ഇത് ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: ബാശാനിലെ ഓഗിന്റെ രാജ്യം മുഴുവനും
  rationale: כָּל എന്നത് ഏകവചനമായ מַמְלְכוּת-നോടു ചേർന്ന് ഓഗിന്റെ ഭരണപ്രദേശം മുഴുവനെയും സൂചിപ്പിക്കുന്നു; בּ ഇവിടെ സ്ഥലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: അഷ്ടരോത്തിലും എദ്രെയിയിലും വാണിരുന്ന
  rationale: מָלַךְ എന്നതിന്റെ രാജകീയമായ ‘വാഴുക/ഭരിക്കുക’ എന്ന അർഥം ‘വാണിരുന്ന’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; രണ്ടു സ്ഥലനാമങ്ങളോടുമുള്ള בּ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: അവൻ റെഫായീമ്യരിൽ ശേഷിച്ചവരിൽ ഒരുവനായിരുന്നു
  rationale: നിഫാൽ രൂപമായ נִשְׁאַר ശേഷിച്ചിരിക്കുകയെന്ന ആശയം നൽകുന്നു. ‘ഒരുവൻ’ എന്നത് അവൻ മാത്രം ശേഷിച്ചു എന്നു പറയാതെ, ശേഷിപ്പിൽ അവൻ ഉൾപ്പെട്ടിരുന്നുവെന്ന വാക്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָרְפָאִים
  choice: റെഫായീമ്യർ
  rationale: ഇത് ഒരു പുരാതന ജനവിഭാഗത്തിന്റെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു; ‘മല്ലന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യപാഠത്തിൽ ചുമത്തുന്നില്ല.
- source_word: וַיַּכֵּם
  choice: മോശെ അവരെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ശക്തമായ സൈനികഭാവം നിലനിർത്തുന്നു; ബഹുവചന കർമപ്രത്യയം ഓഗിനെയും അവന്റെ ജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּרִשֵׁם
  choice: അവരുടെ ദേശത്തുനിന്ന് നീക്കിക്കളഞ്ഞു
  rationale: യുദ്ധവിജയത്തിന്റെ പശ്ചാത്തലത്തിൽ ירשׁ എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം അവരെ അവരുടെ കൈവശഭൂമിയിൽനിന്ന് പുറത്താക്കി അവകാശം നഷ്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: רְפָאִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: റെഫായീമ്യർ
  alternative: മല്ലന്മാർ
  rationale: എബ്രായപദം അറിയപ്പെടുന്ന ഒരു ജനവിഭാഗത്തിന്റെ പേരായി സംരക്ഷിക്കുന്നത് അവരുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ, മറ്റു വേദഭാഗങ്ങളുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിന്റെ പട്ടികാസന്ദർഭത്തോടു ചേരാൻ ‘ഇതിൽ ഉൾപ്പെട്ടിരുന്നു’ ചേർത്തിരിക്കുന്നു; ഇത് എബ്രായത്തിലെ നാമവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്. വായനക്കുറിപ്പ് ബാധകമായ പദമായ ‘റെഫായീമ്യർ’ എന്നതിനോടു ചേർത്താണ് [a] നൽകിയിരിക്കുന്നത്.
