source:
  edition: WLC
  text: מִ/תֵּימָ֞ן כָּל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֗י וּ/מְעָרָ֛ה אֲשֶׁ֥ר לַ/צִּידֹנִ֖ים עַד אֲפֵ֑קָ/ה עַ֖ד גְּב֥וּל הָ/אֱמֹרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: ml
  text: തെക്കുമുതൽ കനാന്യരുടെ ദേശം മുഴുവനും, സീദോന്യർക്കുള്ള മെയാരായും, അഫേക്ക് വരെയും അമോര്യരുടെ അതിർത്തി വരെയും[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സീദോന്യർക്കുള്ള ഗുഹയും.” מְעָרָה എന്നത് സ്ഥലനാമമല്ലാതെ ‘ഗുഹ’ എന്ന പൊതുനാമമായി എടുക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘കനാന്യൻ’, ‘അമോര്യൻ’ എന്നീ ജാതിനാമങ്ങൾ ഏകവചനരൂപത്തിലാണെങ്കിലും ഇവിടെ അവ സമൂഹങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: തെക്കുമുതൽ
  rationale: תֵּימָן സാധാരണയായി ‘തെക്ക്’ അഥവാ ‘തെക്കൻ പ്രദേശം’ എന്ന ദിശാപരമായ അർഥം നൽകുന്നു. ഇവിടെ പ്രദേശത്തിന്റെ വ്യാപ്തി വിവരിക്കുന്നതിനാൽ സ്ഥലനാമമായ ‘തേമാൻ’ എന്നതിനെക്കാൾ ‘തെക്കുമുതൽ’ യോജിക്കുന്നു.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: കനാന്യരുടെ ദേശം മുഴുവനും
  rationale: എബ്രായത്തിൽ ജാതിനാമം ഏകവചനത്തിലാണെങ്കിലും അതിന് സമൂഹവാചകശക്തിയുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ സമൂഹത്തെ സൂചിപ്പിക്കാൻ ‘കനാന്യരുടെ’ എന്നു നൽകി.
- source_word: וּמְעָרָה
  choice: മെയാരാ
  rationale: ഈ രൂപത്തിന് ‘ഗുഹ’ എന്ന പൊതുനാമാർഥം സാധ്യമാണെങ്കിലും, പ്രദേശപരിധികളുടെ പട്ടികയിൽ ഇത് ഒരു സ്ഥലനാമമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത. അതിനാൽ അർഥം തീർപ്പാക്കാതെ സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: സീദോന്യർക്കുള്ള
  rationale: לַ എന്ന ബന്ധസൂചകം ഇവിടെ മെയാരായും സീദോന്യരും തമ്മിലുള്ള ഉടമസ്ഥതയോ പ്രദേശബന്ധമോ സൂചിപ്പിക്കുന്നു. ‘സീദോന്യർക്കുള്ള’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד אֲפֵקָה
  choice: അഫേക്ക് വരെ
  rationale: עַד പ്രദേശവ്യാപ്തിയുടെ അറ്റം സൂചിപ്പിക്കുന്നു. സ്ഥലനാമത്തിലെ ദിശാസൂചക പ്രത്യയം മലയാളത്തിൽ ‘വരെ’ എന്നതിലൂടെ മതിയായ രീതിയിൽ പ്രകടമാകുന്നു.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: അമോര്യരുടെ അതിർത്തിവരെയും
  rationale: גְּבוּל ഇവിടെ പ്രദേശത്തിന്റെ അതിർത്തിയെ സൂചിപ്പിക്കുന്നു. ഏകവചന ജാതിനാമമായ הָאֱמֹרִי സമൂഹവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അമോര്യരുടെ’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ അതിർത്തിപ്പട്ടികയുടെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തിയെങ്കിലും ‘മുതൽ…വരെ’ എന്ന മലയാളഘടനയിലൂടെ വായനാസൗകര്യം ഉറപ്പാക്കി. സ്ഥലനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ഉച്ചാരണരീതിക്ക് സമീപമായി ലിപ്യന്തരിച്ചു.
