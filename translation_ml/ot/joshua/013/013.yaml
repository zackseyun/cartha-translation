id: JOS.13.13
reference: Joshua 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കൾ ഗെശൂര്യരെയോ മയഖാത്ത്യരെയോ പുറത്താക്കിയില്ല; ഗെശൂരും മയഖാത്തും ഇസ്രായേല്യരുടെ ഇടയിൽ ഇന്നുവരെ പാർത്തുപോന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: നീക്കിക്കളഞ്ഞില്ല
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ഒരു പ്രദേശത്തുനിന്ന് ജനവിഭാഗങ്ങളെ പുറത്താക്കുക എന്ന അർഥത്തിലാണ്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: പദഘടനയോട് അടുത്തുനിൽക്കുകയും മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: וַיֵּשֶׁב
  choice: പാർത്തുവരുന്നു
  rationale: വിവരണകാലത്തെ ഭൂതകാലസംഭവത്തിൽനിന്ന് ‘ഇന്നുവരെ’ തുടരുന്ന വാസത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മധ്യേ
  rationale: ‘ഇസ്രായേലിന്റെ ഉള്ളിൽ/ഇടയിൽ’ എന്ന മൂലാർത്ഥം നിലനിർത്തുന്ന ഔപചാരികവും ഗ്രാഹ്യവുമായ ഭാഷ.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരണകർത്താവിന്റെ കാലംവരെ സ്ഥിതി തുടർന്നുവെന്ന കാലസൂചന കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണ ശൈലി. ജനവിഭാഗങ്ങളായ ഗെശൂര്യർ, മയഖാത്യർ എന്നിവയും ദേശ/രാഷ്ട്രീയ ഘടകങ്ങളായ ഗെശൂർ, മയഖാത്ത് എന്നിവയും മൂലപാഠത്തിലെ വ്യത്യാസത്തിന് അനുസരിച്ച് വേർതിരിച്ചിരിക്കുന്നു.
