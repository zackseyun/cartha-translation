translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. പട്ടണപ്പട്ടിക വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; എല്ലാ സ്ഥലപ്പേരുകളും മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
