id: JOS.13.17
reference: Joshua 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: ml
  text: ഹെശ്ബോനും സമഭൂമിയിലുള്ള[a] അതിന്റെ എല്ലാ പട്ടണങ്ങളും—ദീബോൻ, ബാമോത്ത്-ബാൽ, ബേത്ത്-ബാൽ-മെയോൻ എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിരന്ന പ്രദേശം’ എന്നോ ‘പീഠഭൂമി’ എന്നോ വിവർത്തനം ചെയ്യാം. എബ്രായപദം യോർദ്ദാനക്കരയിലെ നിരപ്പായ ഉയർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: സ്ഥലപ്പേര് അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְכָל עָרֶיהָ
  choice: അതിന്റെ എല്ലാ പട്ടണങ്ങളും
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹെശ്ബോനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്ഥലത്തെ സൂചിപ്പിക്കാൻ ‘അതിന്റെ’ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: സമഭൂമിയിലുള്ള
  rationale: മִישׁוֹר ഇവിടെ യോർദ്ദാനക്കരയിലെ നിരപ്പായ ഉയർന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘സമഭൂമി’ മൂലപദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ഉയർന്ന പീഠഭൂമി എന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: דִּיבוֹן
  choice: ദീബോൻ
  rationale: സ്ഥലപ്പേര് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבָמוֹת בַּעַל
  choice: ബാമോത്ത്-ബാൽ
  rationale: ഇവിടെ സാധാരണ നാമവാക്യമായി വിവർത്തനം ചെയ്യാതെ സംയുക്ത സ്ഥലപ്പേരായി ലിപ്യന്തരിച്ചു.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: ബേത്ത്-ബാൽ-മെയോൻ
  rationale: ‘ബേത്ത്’ എന്ന ഘടകം ‘ഭവനം’ എന്നു വിവർത്തനം ചെയ്യാതെ സംയുക്ത സ്ഥലപ്പേരിന്റെ ഭാഗമായി ലിപ്യന്തരിച്ചു.
