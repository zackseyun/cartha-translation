  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: ml
  text: ഗെബല്യരുടെ ദേശവും, സൂര്യോദയദിക്കിലുള്ള ലെബാനോൻ മുഴുവനും, ഹെർമ്മോൻ പർവതത്തിനു താഴെയുള്ള ബാൽ-ഗാദ് മുതൽ ലെബോ-ഹമാത്ത്[a] വരെയും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഹമാത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം വരെ.” എബ്രായപ്രയോഗം ഒരു നിശ്ചിത സ്ഥലനാമമായോ അതിർത്തിയെ വിവരിക്കുന്ന പ്രയോഗമായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: ഗെബാല്യരുടെ ദേശം
  rationale: הַגִּבְלִי എന്ന ജനനാമം ഗെബാൽ പ്രദേശവുമായി ബന്ധപ്പെട്ട ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ഗെബാല്യർ’ സ്ഥലനാമബന്ധം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: כָל הַלְּבָנוֹן
  choice: ലെബാനോൻ മുഴുവനും
  rationale: כָל എന്ന സമഗ്രതയും ലെബാനോൻ പ്രദേശനാമവും വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: സൂര്യോദയദിക്കിലുള്ള
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘സൂര്യോദയം’ എന്ന ദിശാസൂചന സംരക്ഷിക്കുമ്പോഴും ഭൂമിശാസ്ത്രപരമായ അതിർത്തിവിവരണത്തിൽ മലയാളത്തിന് സ്വാഭാവികമായ രൂപം നൽകുന്നു.
- source_word: מִבַּעַל גָּד
  choice: ബാൽ-ഗാദ് മുതൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തും מִן സൂചിപ്പിക്കുന്ന ആരംഭപരിധി ‘മുതൽ’ എന്നുപറഞ്ഞും അവതരിപ്പിക്കുന്നു.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: ഹെർമ്മോൻ പർവതത്തിനു താഴെയുള്ള
  rationale: תַּחַת എന്ന ഭൂമിശാസ്ത്രപരമായ ആപേക്ഷിക സ്ഥാനം അധികമായി വ്യാഖ്യാനിക്കാതെ ‘താഴെയുള്ള’ എന്നു നൽകുന്നു.
- source_word: עַד לְבוֹא חֲמָת
  choice: ലെബോ-ഹമാത്ത് വരെ
  rationale: അതിർത്തിസ്ഥലനാമമായി വായിക്കാവുന്ന രൂപം മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; വിവരണാത്മകമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
