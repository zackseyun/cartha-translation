base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: ml
  text: മോശെ മോവാബ് സമതലങ്ങളിൽ, യെരീഹോവിന് കിഴക്കുള്ള യോർദ്ദാനക്കരെ അവകാശമായി വിഭജിച്ചുനൽകിയവ ഇവയാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവകാശമായി നൽകിയത്’ അല്ലെങ്കിൽ ‘അവകാശമായി നിശ്ചയിച്ചുനൽകിയത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ഭൂമി പാരമ്പര്യസ്വത്തായി വിഭജിച്ചുനൽകുന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘യോർദ്ദാന്റെ മറുവശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ എബ്രായ പ്രയോഗം കാഴ്ചപ്പാടനുസരിച്ച് ‘യോർദ്ദാനക്കരെ’ എന്നോ ‘യോർദ്ദാന്റെ മറുവശത്ത്’ എന്നോ നൽകാവുന്ന ഒരു പതിവ് ഭൂമിശാസ്ത്രപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: പ്രദേശങ്ങൾ ഇവയാണ്
  rationale: സംഗ്രഹപ്രസ്താവനയായി വരുന്ന ബഹുവചന സൂചകവും ബന്ധകവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത് വിഭജിച്ചുനൽകിയ ഭൂപ്രദേശങ്ങളാണ്.
- source_word: נִחַל
  choice: അവകാശമായി വിഭജിച്ചുനൽകിയ
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരക അർഥവും ഭൂമി പാരമ്പര്യാവകാശമായി പങ്കിട്ടുനൽകുന്നതെന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: മോവാബിന്റെ സമതലങ്ങളിൽവെച്ച്
  rationale: עֲרָבוֹת എന്ന ഭൂമിശാസ്ത്രപദത്തെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘സമതലങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇവിടെ മോശെ വിഭജിച്ചുനൽകിയ സ്ഥലം സൂചിപ്പിക്കാൻ ‘വെച്ച്’ ചേർത്തു.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: ‘യോർദ്ദാന്റെ മറുവശത്ത്/അക്കരെ’ എന്ന സ്ഥിരമായ ഭൂമിശാസ്ത്രപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കാഴ്ചപ്പാടിലെ അന്തർനിഹിത സാപേക്ഷത പൂർണമായി നീക്കുന്നില്ല.
- source_word: יְרִיחוֹ
  choice: യെരീഹോ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: מִזְרָחָה
  choice: കിഴക്കായി
  rationale: ദിശാസൂചക ക്രിയാവിശേഷണത്തിന്റെ അർഥം നിലനിർത്തി, യെരീഹോയോടുള്ള ഭൂമിശാസ്ത്രബന്ധം വ്യക്തമാക്കുന്നു.
