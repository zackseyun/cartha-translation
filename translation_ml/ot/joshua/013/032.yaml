translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിലെ സ്ഥാനബന്ധങ്ങൾ ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കാൻ പദക്രമം ക്രമീകരിച്ചു; ‘പ്രദേശങ്ങൾ’ സന്ദർഭത്തിൽ നിന്ന് വ്യക്തമാകുന്ന അർഥപൂരകമായി ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
