id: JOS.13.6
reference: Joshua 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: ml
  text: ലെബാനോൻ മുതൽ മിസ്രെഫോത്ത്-മയീം[a] വരെ മലനാട്ടിൽ വസിക്കുന്ന എല്ലാവരെയും, എല്ലാ സീദോന്യരെയും, ഞാൻ തന്നെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളയും.[b] നീ മാത്രം, ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ, ഈ ദേശം ഇസ്രായേലിന് അവകാശമായി നറുക്കിട്ട് വിഹിതമാക്കുക.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മിസ്രെഫോത്ത്-മയീം’ ഒരു സ്ഥലനാമമാണ്. ഈ പേരിന് ‘ജലത്തിന്റെ ദഹനങ്ങൾ’ എന്നതുപോലൊരു അർഥമുണ്ടാകാമെങ്കിലും അതിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘ഞാൻ തന്നെ അവരെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് അവകാശഭ്രഷ്ടരാക്കും.’'
    reason: lexical_alternative
  - marker: c
    text: ‘നറുക്കിട്ട് വിഹിതമാക്കുക’ എന്നത് ദേശം വിഹിതമായി നൽകുന്നതിനുള്ള എബ്രായ പ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: മലനാട്ടിലെ സകല നിവാസികൾ
  rationale: הָהָר ഇവിടെ ഒറ്റ മലയെയല്ല, ഒരു ഭൂപ്രദേശമായ മലനാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; יֹשְׁבֵי എന്നതിന് സ്വാഭാവികമായ സമാനപദം ‘നിവാസികൾ’ ആണ്.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: ലെബാനോൻമുതൽ മിസ്രെഫോത്ത്-മയീംവരെ
  rationale: രണ്ടും സ്ഥലനാമങ്ങളായി നിലനിർത്തി. രണ്ടാമത്തെ പേരിന്റെ വ്യുത്പത്തിപരമായ അർഥം അനിശ്ചിതമായതിനാൽ അർഥപരിഭാഷ ഒഴിവാക്കി.
- source_word: כָּל צִידֹנִים
  choice: എല്ലാ സീദോന്യർ
  rationale: സീദോൻ പ്രദേശത്തെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ജനനാമവും כָּל എന്നതിന്റെ സമഗ്രതയും സംരക്ഷിക്കുന്നു.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: ഞാൻതന്നെ അവരെ നീക്കിക്കളയും
  rationale: אָנֹכִי നൽകുന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നു പ്രകടമാക്കി. ירשׁ എന്ന ഹിഫീൽ രൂപം ഇവിടെ ജനങ്ങളെ ദേശത്തുനിന്നു പുറത്താക്കുക/അവകാശഭ്രഷ്ടരാക്കുക എന്ന അർഥത്തിലാണ്; ‘നീക്കിക്കളയും’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന്
  rationale: മൂലത്തിലെ ബന്ധസൂചക ദൃശ്യവും ‘ഇസ്രായേൽമക്കൾ’ എന്ന വംശപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: רַק
  choice: എന്നാൽ
  rationale: ദൈവം അവരെ നീക്കുമെന്ന വാഗ്ദാനത്തിനും യോശുവ ദേശം പങ്കിടണമെന്ന നിർദേശത്തിനും ഇടയിലെ നിയന്ത്രകമായ വഴിത്തിരിവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַפִּלֶהָ
  choice: ആ ദേശം നറുക്കിട്ടു പങ്കുകൊടുക്കുക
  rationale: נפל എന്ന കാരകപ്രയോഗം ഭൂമി നറുക്കിലൂടെ വിഹിതമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ ദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ ദേശം’ എന്നു വ്യക്തമാക്കി.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: ഇസ്രായേലിന് അവകാശമായി
  rationale: נַחֲלָה എന്നത് നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പാരമ്പര്യാവകാശ ഭൂമിയെ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ ആ ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതുപോലെ
  rationale: യോശുവയോടുള്ള മുൻകാല ദൈവകല്പനയും അതിന്റെ തുടർന്നുള്ള ബാധകതയും നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ വംശപരവും ഉടമ്പടിസംബന്ധവുമായ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് സമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബൈബിൾ പ്രയോഗമാണ്.
- issue: נַחֲלָה എന്ന ഭൂവിഹിത പദം
  choice: അവകാശം
  alternative: സ്വത്ത് / പൈതൃകം
  rationale: ഭൂമി വെറും കൈവശവസ്തുവല്ല, ദൈവം അനുവദിച്ചു നൽകുന്ന അവകാശവിഹിതമാണെന്ന നിയമ-ദൈവശാസ്ത്ര സൂചന സംരക്ഷിക്കുന്നു.
- issue: ദൈവിക പ്രവർത്തനവും യോശുവയുടെ ഉത്തരവാദിത്തവും തമ്മിലുള്ള സംഘർഷം
  choice: ‘ഞാൻതന്നെ... നീക്കിക്കളയും’; ‘എന്നാൽ... പങ്കുകൊടുക്കുക’ എന്നിങ്ങനെ രണ്ടും നിലനിർത്തി
  alternative: ഒന്നിനെ മറ്റൊന്നിന്റെ വിശദീകരണമാക്കി മൃദൂകരിക്കുക
  rationale: ദൈവം നിവാസികളെ നീക്കുമെന്ന വാഗ്ദാനവും യോശുവ ഉടൻ ദേശം വിഹിതമാക്കണമെന്ന കല്പനയും മൂലത്തിൽ ഒപ്പത്തിനൊപ്പം നിൽക്കുന്നു; ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ‘കല്പിക്കുക’, ‘അവകാശം’ തുടങ്ങിയ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തിയെങ്കിലും അനാവശ്യ പുരാതനഭാഷ ഒഴിവാക്കി.
