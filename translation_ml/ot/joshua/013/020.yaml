lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: ബേത്ത്-പെയോർ
  rationale: സ്ഥലനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ഘടകബന്ധം വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: אַשְׁדּוֹת
  choice: ചരിവുകൾ
  rationale: പിസ്ഗയോടു ചേർന്ന ഭൂപ്രകൃതിസൂചനയിൽ പർവതച്ചരിവുകൾ എന്ന അർത്ഥമാണ് ഏറ്റവും സ്വാഭാവികം; പദത്തിനുള്ള മറ്റു ഭൂപ്രകൃതിസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הַפִּסְגָּה
  choice: പിസ്ഗ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ പ്രത്യേക നാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അർത്ഥവിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം സ്വീകരിച്ചു; എബ്രായ നിർദേശക ഉപപദം മലയാള സ്ഥലനാമശൈലിയിൽ പ്രത്യേകം പ്രകടിപ്പിച്ചില്ല.
- source_word: בֵית הַיְשִׁמוֹת
  choice: ബേത്ത്-യെശിമോത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ ‘ശൂന്യതകളുടെ വീട്’ എന്ന പദാനുപദ വിവർത്തനത്തിനു പകരം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ഒടുവിലെ ‘എന്നിവയും’ എബ്രായത്തിലെ ആവർത്തിത സംയോജകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമായി നൽകി.
