  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: ml
  text: 'രൂബേൻമക്കളുടെ അതിർ യോർദ്ദാനും അതിന്റെ അതിരും ആയിരുന്നു.[a] അവരുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള രൂബേൻമക്കളുടെ അവകാശഭാഗം ഇതായിരുന്നു: പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോർദ്ദാൻ അതിരായി.’ ‘യോർദ്ദാനും അതിരും’ എന്ന എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതാണ്; യോർദ്ദാൻ തന്നെയാണ് അതിർത്തിരേഖ എന്നു തിരിച്ചറിയിക്കുന്നതായും ഇതിനെ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: അതിർത്തിവിവരണത്തിലെ היה എന്ന ക്രിയ ഇവിടെ ഒരു മാറ്റം സംഭവിച്ചതിനേക്കാൾ അതിർ എന്തായിരുന്നുവെന്ന് പ്രസ്താവിക്കുന്നു.
- source_word: גְּבוּל
  choice: അതിർ
  rationale: ഭൂവിഭാഗത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേൻമക്കൾ
  rationale: ഗോത്രപരവും വംശാവലിപരവുമായ എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയെന്ന അർത്ഥം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ സ്ഥലനാമം മാത്രം ഉപയോഗിച്ചു.
- source_word: וּגְבוּל
  choice: അതിന്റെ അതിരും
  rationale: എബ്രായത്തിലെ ചുരുക്കിയതും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; യോർദ്ദാൻ തന്നെയാണ് അതിർത്തിയെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: נַחֲלַת
  choice: ലഭിച്ച അവകാശം
  rationale: ഗോത്രത്തിനു വിഹിതമായി ലഭിച്ച ഭൂസ്വത്തിനെ സൂചിപ്പിക്കാൻ ‘അവകാശം’ ഉപയോഗിച്ച്, ലഭിച്ചതാണെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെയാണ് מִשְׁפָּחוֹת ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ ഘടന നിലനിർത്തുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: വിഹിതപ്പട്ടികകളിലെ ജനവാസകേന്ദ്രങ്ങൾക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സമാനപദം.
- source_word: וְחַצְרֵיהֶן
  choice: അവയുടെ ഗ്രാമങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ചേർന്നതോ അവയെ ആശ്രയിച്ചതോ ആയ ചെറിയ ജനവാസകേന്ദ്രങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
