  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അതിർത്തിസൂത്രത്തിന്റെ ചുരുക്കവും ‘യോർദ്ദാനും അതിരും’ എന്ന പ്രയോഗത്തിലെ യഥാർഥ അവ്യക്തതയും മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലുമായി സംരക്ഷിച്ചു.
