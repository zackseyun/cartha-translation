  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֥את הָ/אָ֖רֶץ הַ/נִּשְׁאָ֑רֶת כָּל גְּלִיל֥וֹת הַ/פְּלִשְׁתִּ֖ים וְ/כָל הַ/גְּשׁוּרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: ml
  text: 'ശേഷിച്ചിരിക്കുന്ന ദേശം ഇതാണ്: ഫെലിസ്ത്യരുടെ എല്ലാ പ്രദേശങ്ങളും[a] ഗെശൂര്യർ മുഴുവനും[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രദേശങ്ങൾ’ എന്നതിന് ‘മേഖലകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഫെലിസ്ത്യരുമായി ബന്ധപ്പെട്ട ഭൂപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഗെശൂര്യൻ’ എന്ന ഏകവചനരൂപമാണെങ്കിലും, അത് ഇവിടെ ഒരു ജനസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: ശേഷിച്ചിരിക്കുന്ന ദേശം ഇതാണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന സൂചകസർവനാമവും ‘ശേഷിക്കുക’ എന്ന അർഥമുള്ള നിഫാൽ കൃദന്തവും ചേർന്ന അവതരണവാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל גְּלִילוֹת
  choice: എല്ലാ പ്രദേശങ്ങളും
  rationale: גְּלִילוֹת എന്ന ബഹുവചനം ഭൂപ്രദേശങ്ങളെയോ പ്രാദേശിക മേഖലകളെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക ഭരണവിഭാഗമായ ‘ജില്ലകൾ’ എന്നതിലുപരി ‘പ്രദേശങ്ങൾ’ ഇവിടെ വിശാലവും സ്വാഭാവികവുമാണ്.
- source_word: הַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ
  rationale: എബ്രായപദം ദേശനാമത്തെയല്ല, ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ അവരുടെ പ്രദേശങ്ങൾ എന്ന ഷഷ്ഠീബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: ഗെശൂര്യർ മുഴുവനും
  rationale: രൂപത്തിൽ ഏകവചനമായ ജാതിനാമം ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിലെ ബഹുവചന ജനനാമവും ‘മുഴുവനും’ എന്ന പ്രയോഗവും ആ സമൂഹാർത്ഥം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത പട്ടികയിലേക്ക് തുടരുന്നതായി സൂചിപ്പിക്കാൻ മൂലപാഠത്തിന്റെയും സന്ദർഭത്തിന്റെയും അപൂർണത ദീർഘരേഖയിലൂടെ നിലനിർത്തി.
