id: JOS.13.26
reference: Joshua 13:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: ml
  text: ഹെശ്ബോൻമുതൽ രാമത്ത്-മിസ്പെയും ബെതോനീമും വരെ, മഹനയീംമുതൽ ദെബീറിന്റെ അതിർത്തിവരെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദെബീറിലേക്കുള്ള അതിർത്തിവരെ.” ഹെബ്രായ ഘടനയ്ക്ക് ദിശാസൂചനയായ അർഥവും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻമുതൽ
  rationale: വാവ് സംയോജകവും מִן എന്ന ആരംഭബിന്ദു സൂചിപ്പിക്കുന്ന പൂർവപ്രത്യയവും ചേർന്ന രൂപം; സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַד
  choice: വരെയും
  rationale: അതിർത്തിവിവരണത്തിൽ വ്യാപ്തിയുടെ അന്ത്യബിന്ദു സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ‘മുതൽ…വരെ’ ഘടന ഉപയോഗിച്ചു.
- source_word: רָמַת הַמִּצְפֶּה
  choice: രാമത്ത്-മിസ്പെ
  rationale: ‘കാവൽസ്ഥാനത്തിന്റെ ഉയരം’ എന്ന ഘടകാർത്ഥമുള്ള സ്ഥലനാമമാണെങ്കിലും, ഭൂവിഭാഗപ്പട്ടികയിൽ നാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി.
- source_word: וּ/בְטֹנִים
  choice: ബെതോനീമും
  rationale: വാവ് ചേർന്ന സ്ഥലനാമം; ഏകദേശ ഹീബ്രു ഉച്ചാരണം പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: മഹനയീംമുതൽ
  rationale: സംയോജകവും ആരംഭബിന്ദു സൂചിപ്പിക്കുന്ന പൂർവപ്രത്യയവും സ്ഥലനാമവും ചേർന്ന രൂപം.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ പ്രദേശത്തിന്റെ അതിരാണ് അർത്ഥം; ആധുനിക മലയാളത്തിൽ ‘അതിർത്തി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִדְבִר
  choice: ദെബീറിന്റെ
  rationale: גְּבוּל എന്ന പദത്തിനു പിന്നാലെയുള്ള ലാമെദ് ദെബീറുമായി അതിർത്തിക്കുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദെബീറിന്റെ അതിർത്തി’ എന്ന ബന്ധവിഭക്തി സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. വാക്യം മുൻവാക്യത്തിലെ ഭൂവിഭാഗപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ ക്രിയയില്ലാത്ത പട്ടികാശൈലി നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശകപാഠത്തിലെ അടിക്കുറിപ്പ് ഹെബ്രായിയിൽ ബെതോനീമിനോട് ബന്ധപ്പെട്ടതല്ലെന്നും לִדְבִר എന്ന ഘടനയുടെ വ്യത്യസ്ത വായനയെക്കുറിച്ചാണെന്നും മനസ്സിലാക്കി; എന്നാൽ മലയാളത്തിലെ ‘ദെബീറിന്റെ അതിർത്തി’ മൂലഘടനയും സന്ദർഭവും മതിയായ രീതിയിൽ കൈമാറുന്നതിനാൽ പ്രസിദ്ധീകരണപാഠത്തിൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
