  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: ml
  text: താഴ്വരയിലും ബേത്ത്-ഹാരാം, ബേത്ത്-നിമ്രാ, സുക്കോത്ത്, സാഫോൻ എന്നിവയും—ഹെശ്ബോൻ രാജാവായ സീഹോന്റെ രാജ്യത്തിൽ ശേഷിച്ച ഭാഗവും—യോർദ്ദാൻ അതിർത്തിയായും, കിന്നെരെത്ത് കടലിന്റെ അറ്റംവരെ[a], യോർദ്ദാന്റെ കിഴക്കുവശത്ത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിന്നെരെത്ത് കടലിന്റെ അരികുവരെ.’ ‘താഴത്തെ അറ്റംവരെ’ എന്നും വ്യാഖ്യാനിക്കാം.
    reason: קְצֵה എന്ന എബ്രായപദത്തിന് ‘അറ്റം,’ ‘അരിക്,’ ‘അതിരറ്റം’ എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; ‘താഴത്തെ’ എന്ന ദിശാസൂചന പദത്തിൽ നേരിട്ട് ഇല്ല.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: താഴ്വരയിൽ
  rationale: עֵמֶק ഇവിടെ പട്ടണങ്ങൾ സ്ഥിതിചെയ്യുന്ന താഴ്ന്ന ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘താഴ്വര’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בֵּית הָרָם ... וְ/צָפוֹן
  choice: ബേത്ത്-ഹാരാം, ബേത്ത്-നിമ്രാ, സുക്കോത്ത്, സാഫോൻ
  rationale: ഇവ സ്ഥലനാമങ്ങളായതിനാൽ അർത്ഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ പിന്തുടർന്ന് ലിപ്യന്തരിച്ചു; צָפוֹן ഇവിടെ ‘വടക്ക്’ എന്ന സാധാരണനാമമല്ല.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ രാജാവായ സീഹോന്റെ രാജ്യത്തിൽ ശേഷിച്ച ഭാഗം
  rationale: יֶתֶר എന്നതിന്റെ ‘ശേഷിച്ച ഭാഗം’ എന്ന അർത്ഥവും מַמְלְכוּת എന്നതിന്റെ ‘രാജ്യം’ എന്ന അർത്ഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: യോർദ്ദാൻ അതിർത്തിയായി
  rationale: ചുരുക്കമായ എബ്രായ സംയോജനം യോർദ്ദാൻ നദി പ്രദേശത്തിന്റെ അതിർത്തിയായിരുന്നുവെന്ന ഭൂമിശാസ്ത്രപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: കിന്നെരെത്ത് കടലിന്റെ താഴത്തെ അറ്റംവരെ
  rationale: קְצֵה എന്നത് അറ്റം, അരിക്, അതിരറ്റം എന്നിവ സൂചിപ്പിക്കാം. ഭൂപ്രദേശവിവരണത്തിൽ ‘താഴത്തെ അറ്റം’ ദിശാസംബന്ധമായ ആശയം നൽകുന്നു; അടിസ്ഥാന പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: യോർദ്ദാന്റെ കിഴക്കുവശത്ത്
  rationale: യോർദ്ദാനക്കരയിലെ കിഴക്കൻ പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഭൂമിശാസ്ത്രപ്രയോഗം ലളിതമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ പട്ടികാസ്വഭാവവും ‘ശേഷിച്ച ഭാഗം’ എന്ന അനുബന്ധവിവരണവും ദീർഘരേഖകൾകൊണ്ട് നിലനിർത്തി; സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
