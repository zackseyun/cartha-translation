source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: ml
  text: 'യോശുവ വൃദ്ധനായിരുന്നു, ഏറെ പ്രായം ചെന്നവനുമായിരുന്നു. യഹ്‌വെ അവനോടു പറഞ്ഞു: “നീ വൃദ്ധനായിരിക്കുന്നു, ഏറെ പ്രായം ചെന്നിരിക്കുന്നു; കൈവശമാക്കാൻ ഇനിയും വളരെയധികം ദേശം ശേഷിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അത് അവകാശമായി കൈവശമാക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയയ്ക്ക് ഒരു ദേശം അവകാശമായി നേടുക, കൈവശമാക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: വൃദ്ധനായി
  rationale: യോശുവയുടെ പ്രായാവസ്ഥ നേരിട്ട് വിവരിക്കുന്ന പ്രയോഗം; ‘വൃദ്ധനായി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בָּא בַּיָּמִים
  choice: ഏറെ പ്രായം ചെന്നിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിലേക്കു വന്നവൻ’ എന്ന എബ്രായ പ്രയോഗം വളരെ പ്രായമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: നീ വൃദ്ധനായി, ഏറെ പ്രായം ചെന്നിരിക്കുന്നു
  rationale: ആഖ്യാതാവിന്റെ വിവരണം ദൈവവചനത്തിൽ ആവർത്തിക്കപ്പെടുന്നതു ഊന്നലോടെ നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: യോശുവയുടെ സന്ദർഭത്തിൽ വാഗ്ദത്തഭൂമിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും സ്വാഭാവികവുമായ മലയാള പദം.
- source_word: נִשְׁאֲרָה
  choice: ശേഷിക്കുന്നു
  rationale: നിഫാൽ രൂപം സൂചിപ്പിക്കുന്ന ‘ബാക്കിയുണ്ട്/ശേഷിച്ചിരിക്കുന്നു’ എന്ന അവസ്ഥ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַרְבֵּה מְאֹד
  choice: വളരെയധികം
  rationale: ശേഷിച്ച ദേശത്തിന്റെ വലിയ അളവിനെ സൂചിപ്പിക്കുന്ന ഇരട്ട ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְרִשְׁתָּהּ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയ്ക്ക് കൈവശമാക്കുക, അവകാശമായി നേടുക എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ ദേശം ഇനിയും ഏറ്റെടുത്തു കൈവശപ്പെടുത്തേണ്ടതാണെന്ന സന്ദർഭാർഥം മുൻനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരിനു പകരം അതിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- issue: ירשׁ എന്ന ക്രിയയിലെ കൈവശപ്പെടുത്തൽ–അവകാശലഭ്യത അർഥവ്യാപ്തി
  choice: കൈവശമാക്കാൻ
  alternative: അവകാശമായി കൈവശമാക്കാൻ
  rationale: സൈനികമായി ദേശം ഏറ്റെടുക്കേണ്ട സന്ദർഭം ‘കൈവശമാക്കാൻ’ എന്നതിലൂടെ വ്യക്തമാണ്; അതേസമയം അവകാശലഭ്യതയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ പ്രായവിവരണത്തിന്റെ ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്. വാക്യാരംഭത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. എബ്രായത്തിലെ വാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ദൈവവചനത്തിലെ അവസാന ഖണ്ഡത്തിന് മുമ്പ് ‘എന്നാൽ’ ഉപയോഗിച്ചിട്ടുണ്ട്.
