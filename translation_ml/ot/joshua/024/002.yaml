reference: Joshua 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: ml
  text: 'യോശുവ സകലജനത്തോടും പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇപ്രകാരം പറയുന്നു: പണ്ടുകാലത്ത് നിങ്ങളുടെ പിതാക്കന്മാർ[b] നദിക്കപ്പുറം[a] പാർത്തിരുന്നു—അബ്രാഹാമിന്റെയും നാഹോരിന്റെയും പിതാവായ തേരഹ്—അവർ മറ്റു ദൈവങ്ങളെ സേവിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നദിയുടെ മറുകരയിൽ”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് സാധ്യതയോടെ യൂഫ്രട്ടീസ് നദിയാണ്.
    reason: cultural_note
  - marker: b
    text: “പിതാക്കന്മാർ” എന്നത് ഇവിടെ പൂർവപിതാക്കന്മാരെയോ പൂർവികരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל כָּל הָעָם
  choice: യോശുവ സകലജനത്തോടും പറഞ്ഞു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനരൂപത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലവാക്യമായി നൽകുന്നു; עָם എന്നത് ഇവിടെ ഒത്തുകൂടിയ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക സന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; യഹോവ എന്ന ഉടമ്പടിനാമം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ ബന്ധാർഥം വ്യക്തമായി നൽകുകയും തുടർന്നുവരുന്ന ‘യഹോവ’യുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: מֵעוֹלָם
  choice: പണ്ടുകാലത്ത്
  rationale: ഇവിടെ പദം നിത്യതയെയല്ല, വിദൂരമായ പൂർവകാലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനരൂപം നിലനിർത്തുന്നു; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: നദിക്കപ്പുറം
  rationale: എബ്രായം നദിയുടെ പേര് പറയാത്തതിനാൽ ‘യൂഫ്രട്ടീസ്’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: יָשְׁבוּ
  choice: പാർത്തിരുന്നു
  rationale: ‘ഇരിക്കുക/വസിക്കുക’ എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ താമസാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: അബ്രാഹാമിന്റെയും നാഹോരിന്റെയും പിതാവായ തേരഹ്
  rationale: ബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് എബ്രായ ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കുന്നു.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: അവർ മറ്റു ദൈവങ്ങളെ സേവിച്ചു
  rationale: עבד എന്ന പദത്തിന്റെ മതപരമായ സേവനം/ആരാധന എന്ന അർഥവ്യാപ്തി ‘സേവിച്ചു’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ‘മറ്റു ദൈവങ്ങൾ’ എന്ന എബ്രായപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നേരിട്ട് നൽകുന്നു.
- issue: אֲבוֹתֵיכֶם എന്ന പൂർവികസൂചന
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ പൂർവികർ എന്ന വിശാലസൂചന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: אֱלֹהִים אֲחֵרִים എന്ന പ്രയോഗം
  choice: മറ്റു ദൈവങ്ങൾ
  alternative: അന്യദേവന്മാർ / വിഗ്രഹങ്ങൾ
  rationale: മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ഭാഷയും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; ‘വിഗ്രഹങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ദൈവവചനസൂത്രത്തിന് അല്പം ഔപചാരികമായ ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചെങ്കിലും പഴഞ്ചൻ പദസമുച്ചയങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പുസൂചകങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ‘നദിക്കപ്പുറം’ എന്നതിനും [b] ‘പിതാക്കന്മാർ’ എന്നതിനും ചേർത്ത് മൂലപാഠസാക്ഷ്യത്തിന് അനുസൃതമായി തിരുത്തി.
