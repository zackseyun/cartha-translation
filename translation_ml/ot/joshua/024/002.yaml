  to: 'യോശുവ സകലജനത്തോടും പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യഹോവ ഇപ്രകാരം പറയുന്നു: പണ്ടുകാലത്ത് നിങ്ങളുടെ പിതാക്കന്മാർ[b] നദിക്കപ്പുറം[a] പാർത്തിരുന്നു—അബ്രാഹാമിന്റെയും നാഹോരിന്റെയും പിതാവായ തേരഹ്—അവർ മറ്റു ദൈവങ്ങളെ സേവിച്ചു.”'
