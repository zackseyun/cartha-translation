  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: ml
  text: എന്തെന്നാൽ, നമ്മുടെ ദൈവമായ യഹ്‌വേ തന്നെയാണ് നമ്മെയും നമ്മുടെ പിതാക്കന്മാരെയും മിസ്രയീം ദേശത്തുനിന്ന്, അടിമകളുടെ വീട്ടിൽനിന്ന്[a], കയറ്റിക്കൊണ്ടുവന്നതും നമ്മുടെ കൺമുന്നിൽ ഈ വലിയ അടയാളങ്ങൾ[b] പ്രവർത്തിച്ചതും നാം സഞ്ചരിച്ച വഴിയിലുടനീളവും നാം കടന്നുപോയ സകല ജനതകളുടെയും മധ്യേയും നമ്മെ കാത്തുസൂക്ഷിച്ചതും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിമത്തത്തിന്റെ വീട്ടിൽനിന്ന്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അടിമകളുടെ വീട്ടിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഈ വലിയ അത്ഭുതങ്ങൾ’ അല്ലെങ്കിൽ ‘ഈ വലിയ അത്ഭുതപ്രവൃത്തികൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ജനത്തിന്റെ പ്രതിജ്ഞയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הוּא הַמַּעֲלֶה
  choice: തന്നെയാണ് ... കയറ്റിക്കൊണ്ടുവന്നത്
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തുകയും עלה എന്ന ക്രിയയുടെ ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്ന ദിശാബിംബം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲבוֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ ഉടമ്പടി-ചരിത്രപരമായ പൂർവികസൂചനയെ ഉറവിടത്തിലെ ലിംഗനിർദ്ദിഷ്ട രൂപത്തോടൊപ്പം നിലനിർത്തുന്നു.
- source_word: מִבֵּית עֲבָדִים
  choice: അടിമകളുടെ ഭവനത്തിൽനിന്ന്
  rationale: ‘അടിമകളുടെ വീട്/ഭവനം’ എന്ന മൂർത്തമായ എബ്രായ പ്രയോഗം അമൂർത്തമായ ‘അടിമത്തം’ എന്നാക്കി മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: ഈ വലിയ അടയാളങ്ങൾ
  rationale: אוֹת എന്ന പദത്തിലെ അടയാളസ്വഭാവം നിലനിർത്തുന്നു; അത്ഭുതങ്ങൾ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: നമ്മെ കാത്തുസൂക്ഷിച്ചു
  rationale: യാത്രയിലുടനീളമുള്ള സംരക്ഷണത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: വഴിയിലുടനീളം
  rationale: ‘മുഴുവൻ വഴിയിലും’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ പകരാതെ ശബ്ദാനുസൃതമായി നിലനിർത്തുന്നു.
- issue: בֵּית עֲבָדִים എന്ന പുറപ്പാട്-പ്രയോഗം
  choice: അടിമകളുടെ ഭവനം
  alternative: അടിമത്തത്തിന്റെ ഭവനം
  rationale: עֲבָדִים അമൂർത്തമായ ‘അടിമത്തം’ എന്ന നാമമല്ല, ‘അടിമകൾ’ എന്ന ബഹുവചന നാമമാണ്; അതിനാൽ മൂർത്തമായ സാമൂഹിക അവസ്ഥ നിലനിർത്തുന്നു.
- issue: עלה എന്ന ക്രിയയിലെ ദിശാബിംബം
  choice: കയറ്റിക്കൊണ്ടുവന്നു
  alternative: പുറത്തുകൊണ്ടുവന്നു
  rationale: പുറപ്പാടിനെ ‘മുകളിലേക്കു കൊണ്ടുവരൽ’ ആയി അവതരിപ്പിക്കുന്ന എബ്രായ ബിംബം സംരക്ഷിക്കുന്നു; കൂടുതൽ പൊതുവായ പരിഭാഷ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘ഭവനം,’ ‘പിതാക്കന്മാർ,’ ‘അവിടുന്ന്’ എന്നിവ വാക്യത്തിന്റെ തിരുവെഴുത്തുസംബന്ധമായ ഗൗരവം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാക്കി. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ചിഹ്നം തെറ്റായ സ്ഥാനത്തുണ്ടായിരുന്നുവെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ ഉള്ളടക്കത്തിന് യോജിച്ച ‘അടയാളങ്ങൾ’ എന്ന പദത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
