id: JOS.24.21
reference: Joshua 24:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: ml
  text: 'എന്നാൽ ജനം യോശുവയോടു പറഞ്ഞു: “അല്ല, ഞങ്ങൾ യാഹ്‌വെയെ സേവിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ ഒത്തുകൂടിയ ഇസ്രായേൽ ഉടമ്പടിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: യോശുവയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘-യോടു’ രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא
  choice: അല്ല
  rationale: യോശുവയുടെ മുൻവാക്കിനെ ജനം ശക്തമായി നിരാകരിക്കുന്ന സ്വതന്ത്ര പ്രതികരണമാണ്; ‘അല്ല’ ആ ശക്തി ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כִּי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: לֹאയ്ക്ക് പിന്നാലെയുള്ള כִּי ഇവിടെ തിരുത്തൽ/വിരുദ്ധത സൂചിപ്പിക്കുന്നു. ‘അല്ല, ഞങ്ങൾ…’ എന്ന മലയാളഘടന തന്നെ ‘മറിച്ച്/തീർച്ചയായും’ എന്ന ആശയം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ അധികമായ ‘എന്നാൽ’ ആവർത്തിക്കുന്നത് ഒഴിവാക്കി.
- source_word: אֶת יְהוָה
  choice: യഹോവയെ
  rationale: אֶת നേരിട്ടുള്ള കർമചിഹ്നമാണ്; മലയാളത്തിലെ ‘-യെ’ അതിനെ പ്രകടിപ്പിക്കുന്നു. יהוה എന്ന ദൈവനാമം സഭാപാരമ്പര്യത്തിലെ പദവി ഉപയോഗിച്ച് മാറ്റാതെ ‘യഹോവ’യായി ലിപ്യന്തരിച്ചു.
- source_word: נַעֲבֹד
  choice: ഞങ്ങൾ സേവിക്കും
  rationale: עבד എന്ന ക്രിയയുടെ ഉടമ്പടിപരമായ വിശ്വസ്തസേവനവും ആരാധനയും ഉൾക്കൊള്ളുന്ന വിശാലത നിലനിർത്തുന്നു; ‘ആരാധിക്കും’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം നാലക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപം ഉപയോഗിച്ചു.
- issue: עבד എന്നതിന്റെ ഉടമ്പടിപരമായ അർഥവ്യാപ്തി
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തോടുള്ള ആരാധന മാത്രമല്ല, അനുസരണവും വിശ്വസ്തതയും ഉൾപ്പെട്ട സമഗ്രമായ അധീനതയാണ് ഉദ്ദേശ്യം; ‘സേവിക്കും’ ആ അർഥവ്യാപ്തി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്താൻ മറുപടി ‘അല്ല’ എന്നു നേരിട്ട് ആരംഭിക്കുന്നു; അനാവശ്യമായ പുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
