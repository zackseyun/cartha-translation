revisions:
- from: 'അപ്പോൾ ജനം മറുപടി പറഞ്ഞു: “യഹ്‌വേയെ ഉപേക്ഷിച്ച് അന്യദേവന്മാരെ സേവിക്കാൻ ഞങ്ങൾക്ക് ഇടവരാതിരിക്കട്ടെ[a]!”'
