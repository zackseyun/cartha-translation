id: JOS.24.16
reference: Joshua 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: ml
  text: 'അപ്പോൾ ജനം മറുപടി പറഞ്ഞു: “യഹ്‌വേയെ ഉപേക്ഷിച്ച് മറ്റുദേവന്മാരെ സേവിക്കുക എന്നത് ഞങ്ങൾക്ക് ഒരിക്കലും ഉണ്ടാകാതിരിക്കട്ടെ[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ യഹ്‌വേയെ ഉപേക്ഷിച്ച് മറ്റുദേവന്മാരെ സേവിക്കുകയോ? ഒരിക്കലുമില്ല!” എബ്രായപ്രയോഗം ശക്തമായ നിരാകരണമാണ് സൂചിപ്പിക്കുന്നത്. “ദൈവം അനുവദിക്കാതിരിക്കട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ടെങ്കിലും, ഇവിടെ എബ്രായമൂലത്തിൽ ‘ദൈവം’ എന്നു വ്യക്തമായി പറയുന്നില്ല.
    reason: חָלִילָה לָּנוּ എന്ന ശക്തമായ നിരാകരണപ്രയോഗത്തിന്റെ ബദൽ അവതരണവും, ‘ദൈവം’ എന്ന പദം മൂലത്തിൽ വ്യക്തമല്ലെന്ന വിവരവും നൽകുന്നു.
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: അപ്പോൾ ജനം മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ענה, אמר എന്നീ ക്രിയകളുടെ സ്വാഭാവികമായ ആഖ്യാനരൂപം; ആവർത്തനഭാരം കൂടാതെ രണ്ടിന്റെയും ആശയം നിലനിർത്തുന്നു.
- source_word: חָלִילָה לָּנוּ
  choice: ഞങ്ങൾക്ക് ഇടവരാതിരിക്കട്ടെ
  rationale: ശക്തമായ നിരാകരണം പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ദൈവം’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: מֵעֲזֹב
  choice: ഉപേക്ഷിച്ച്
  rationale: ഉടമ്പടിപരമായ വിശ്വസ്തത കൈവിടുക എന്ന ഗൗരവമുള്ള അർഥം ‘ഉപേക്ഷിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לַעֲבֹד
  choice: സേവിക്കാൻ
  rationale: ദേവന്മാരോടുള്ള ആരാധനയും വിധേയത്വവും ഉൾക്കൊള്ളുന്ന עבד എന്ന പദത്തിന്റെ വിശാലത ‘സേവിക്കുക’ നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ‘മറ്റു ദേവന്മാർ’ എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘വിദേശദേവന്മാർ’ എന്ന അധിക സൂചന ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുകയും, അതിനെ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതിരിക്കുകയും ചെയ്യുന്നു; ‘യഹോവ’യെക്കാൾ ‘യഹ്‌വേ’ Yahweh എന്ന രൂപത്തോട് അടുത്ത ലിപ്യന്തരമാണ്.
- issue: חָלִילָה എന്ന ശക്തമായ നിരാകരണപ്രയോഗം
  choice: ഞങ്ങൾക്ക് ഇടവരാതിരിക്കട്ടെ
  alternative: ദൈവം അനുവദിക്കാതിരിക്കട്ടെ; ഞങ്ങളിൽനിന്ന് അകന്നിരിക്കട്ടെ
  rationale: പ്രയോഗത്തിന്റെ ശക്തമായ നിരാകരണം കാത്തുസൂക്ഷിക്കുമ്പോഴും, എബ്രായത്തിൽ നേരിട്ട് പറയാത്ത ദൈവപരാമർശം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: യഹ്‌വേയെ ഉപേക്ഷിക്കുന്നതും അന്യദേവന്മാരെ സേവിക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ഉപേക്ഷിച്ച് … സേവിക്കാൻ
  alternative: ഉപേക്ഷിക്കാനും … സേവിക്കാനും
  rationale: לַעֲבֹד മുമ്പുള്ള പ്രവൃത്തിയുടെ ലക്ഷ്യമോ ഫലമോ ആയി വായിക്കാവുന്നതിനാൽ ആ ബന്ധം മലയാളത്തിലെ ‘ഉപേക്ഷിച്ച് … സേവിക്കാൻ’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു; രണ്ട് പൂർണമായും സ്വതന്ത്ര പ്രവൃത്തികളായി നിർബന്ധിച്ച് വേർതിരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജനം’ സഭയായി കൂടിയ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ദൈവനാമം ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു; ശക്തമായ നിരാകരണം അതിശയോക്തിയോ അധിക ദൈവപരാമർശമോ ചേർക്കാതെ നൽകിയിരിക്കുന്നു.
