  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: ml
  text: 'ജനങ്ങൾ യോശുവയോടു പറഞ്ഞു: “ഞങ്ങൾ ഞങ്ങളുടെ ദൈവമായ യഹ്‌വെയെ സേവിക്കും[a]; അവന്റെ വാക്ക് അനുസരിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആരാധിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ക്രിയ ദൈവത്തിനു സമർപ്പിക്കുന്ന ആരാധനാപരമായ സേവനത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ‘സേവിക്കും’ എന്നത് ഉടമ്പടിപരമായ വിശ്വസ്തതയുടെ വിശാലമായ അർഥം കൂടുതൽ നന്നായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ ശബ്ദം ഞങ്ങൾ കേൾക്കും.’ ഹീബ്രുവിൽ ഈ പ്രയോഗം അവൻ പറയുന്നതു കേട്ട് അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: ജനങ്ങൾ യോശുവയോടു പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനരീതിയിലെ സാധാരണ പ്രസ്താവന സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: ഞങ്ങളുടെ ദൈവമായ യഹ്‌വെ
  rationale: אֱלֹהֵינוּ സൂചിപ്പിക്കുന്ന ഉടമ്പടി-ബന്ധം ‘ഞങ്ങളുടെ ദൈവം’ എന്നു നിലനിർത്തുന്നു; ദൈവനാമമായ יהוה പദവിയായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נַעֲבֹד
  choice: സേവിക്കും
  rationale: עבד ഇവിടെ ആരാധനയും ഉടമ്പടിപരമായ വിശ്വസ്തസേവനവും ഉൾക്കൊള്ളുന്നു; ‘ആരാധിക്കും’ എന്നതിനെക്കാൾ ‘സേവിക്കും’ അതിന്റെ വിശാലമായ അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: അവന്റെ വാക്കു കേട്ട് അനുസരിക്കുകയും ചെയ്യും
  rationale: അക്ഷരാർഥത്തിലെ ‘അവന്റെ ശബ്ദം കേൾക്കും’ എന്ന ഹീബ്രു പ്രയോഗം അനുസരണപരമായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വാക്കു കേട്ട് അനുസരിക്കുക’ എന്നത് കേൾവിയുടെയും അനുസരണത്തിന്റെയും ഘടകങ്ങൾ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടി-നാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עבד എന്ന ക്രിയയുടെ മതപരവും ഉടമ്പടിപരവുമായ വ്യാപ്തി
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: സന്ദർഭം ആരാധനയിൽ മാത്രം ഒതുങ്ങാതെ ദൈവത്തോടുള്ള വിശ്വസ്തതയും പ്രവർത്തനപരമായ അനുസരണവും ഉൾക്കൊള്ളുന്നതിനാൽ വിശാലമായ അർഥമുള്ള രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള പ്രസംഗത്തിന്റെ ഉടമ്പടിപരമായ ഉറപ്പും മൂലത്തിലെ ‘സേവിക്കുക/ആരാധിക്കുക’, ‘കേൾക്കുക/അനുസരിക്കുക’ എന്നീ അർഥവ്യാപ്തികളും നിലനിർത്തിയിരിക്കുന്നു.
