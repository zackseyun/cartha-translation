source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: ml
  text: എന്നാൽ യഹ്‌വെയെ സേവിക്കുന്നത് നിങ്ങളുടെ ദൃഷ്ടിയിൽ തിന്മയാണെങ്കിൽ[a], നിങ്ങൾ ആരെ സേവിക്കുമെന്ന് ഇന്നു നിങ്ങൾതന്നെ തിരഞ്ഞെടുക്കുക—നദിക്കപ്പുറത്തുവെച്ച്[b] നിങ്ങളുടെ പിതാക്കന്മാർ സേവിച്ച ദേവന്മാരെയോ[c], അതോ നിങ്ങൾ പാർക്കുന്ന ദേശത്തിലെ അമോര്യരുടെ ദേവന്മാരെയോ. എന്നാൽ ഞാനും എന്റെ ഭവനവും[d] യഹ്‌വെയെ സേവിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “അത് നിങ്ങൾക്കു തെറ്റായി തോന്നുന്നുവെങ്കിൽ” അല്ലെങ്കിൽ “അത് നിങ്ങൾക്കു അനിഷ്ടമാണെങ്കിൽ”; അക്ഷരാർഥം: “അത് നിങ്ങളുടെ കണ്ണുകളിൽ തിന്മയാണെങ്കിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: “നദി” എന്നു പറയുന്നത് യൂഫ്രട്ടീസ് നദിയെയാണ്.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ, “നിങ്ങളുടെ പൂർവികർ സേവിച്ച”; എബ്രായത്തിൽ: “നിങ്ങളുടെ പിതാക്കന്മാർ സേവിച്ച.”'
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “എന്റെ വീട്ടുകാർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻ ആഹ്വാനത്തോടുള്ള വ്യവസ്ഥാപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רַע בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ ദൃഷ്ടിയിൽ തിന്മയാണെങ്കിൽ
  rationale: ‘നിങ്ങളുടെ കണ്ണുകളിൽ തിന്മ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിലയിരുത്തൽഭാവവും മൂർച്ചയും നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: സേവിക്കുക
  rationale: ആരാധന ഉൾപ്പെടുന്ന ഉടമ്പടിപരമായ വിധേയത്വത്തിന്റെ വിശാല അർത്ഥവും മൂലപദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: ഇന്നു നിങ്ങൾതന്നെ തിരഞ്ഞെടുക്കുക
  rationale: ആജ്ഞ, ഇന്നത്തെ അടിയന്തരത, לָכֶם എന്ന സ്വയംനിർണയ ഊന്നൽ എന്നിവ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ സേവിച്ച
  rationale: אָבוֹת എന്ന പദത്തിന്റെ പുരുഷലിംഗരൂപം നിലനിർത്തുന്നു; വിശാലമായ ‘പൂർവികർ’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: നദിക്കപ്പുറം
  rationale: അറിയപ്പെടുന്ന ഭൗമസൂചനയായ ‘നദി’യെ സംരക്ഷിക്കുന്നു; അത് യൂഫ്രട്ടീസ് ആണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: നിങ്ങൾ പാർക്കുന്ന ദേശത്തിലെ
  rationale: അമോര്യരുടെ ദേശത്തുള്ള ജനത്തിന്റെ ഇപ്പോഴത്തെ വാസം സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കി വ്യക്തമാക്കുന്നു.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: എന്നാൽ ഞാനും എന്റെ ഭവനവും
  rationale: വാക്യത്തിലെ ഊന്നിയ വ്യക്തിപരമായ വൈരുധ്യവും ‘വീട്/ഭവനം’ എന്ന കൂട്ടായ കുടുംബാർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയായി മാറ്റാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עבד എന്ന മതപരമായ വിധേയത്വപദം
  choice: സേവിക്കുക
  alternative: ആരാധിക്കുക
  rationale: ആരാധനയിൽ മാത്രം ചുരുക്കാതെ ഉടമ്പടിപരമായ സേവനവും വിധേയത്വവും ഉൾക്കൊള്ളുന്നു; വാക്യത്തിലെ ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: אָבוֹתֵיכֶם എന്ന പൂർവികസൂചന
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുരുഷലിംഗ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, വിശാലമായ വംശപരമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְאָנֹכִי וּבֵיתִי എന്ന കുടുംബപ്രസ്താവന
  choice: ഞാനും എന്റെ ഭവനവും
  alternative: ഞാനും എന്റെ കുടുംബാംഗങ്ങളും
  rationale: യോശുവയുടെ ഉറച്ച കൂട്ടായ പ്രഖ്യാപനം സംരക്ഷിക്കുന്നു; വീട്ടിലുള്ള ഓരോ വ്യക്തിയുടെയും അന്തർവിശ്വാസത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ദൃഷ്ടിയിൽ’, ‘ഭവനം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ഔപചാരിക ഊന്നൽ നിലനിർത്തുന്നു; ദുഷ്കരതകൾ അടിക്കുറിപ്പുകളിലൂടെ ലഘൂകരിച്ചിരിക്കുന്നു. പ്രസിദ്ധീകരണക്രമത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗത്തോടുതന്നെ ചേർത്തിരിക്കുന്നു.
