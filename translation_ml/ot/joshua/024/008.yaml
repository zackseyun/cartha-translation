  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: ml
  text: പിന്നെ ഞാൻ നിങ്ങളെ യോർദ്ദാനക്കരെ പാർത്തിരുന്ന അമോര്യരുടെ ദേശത്തേക്കു കൊണ്ടുവന്നു. അവർ നിങ്ങളോടു യുദ്ധം ചെയ്തു. ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു; നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കി. ഞാൻ അവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് നശിപ്പിച്ചുകളഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: പിന്നെ ഞാൻ നിങ്ങളെ ... കൊണ്ടുവന്നു
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫ്ഈൽ രൂപം ‘കൊണ്ടുവരുക’ എന്ന കാരകാർഥം നൽകുന്നു. തുടർച്ച സൂചിപ്പിക്കുന്ന വാവ് മലയാള വിവരണശൈലിയിൽ ‘പിന്നെ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: അമോര്യരുടെ ദേശത്തേക്കു
  rationale: אֶל ഇവിടെ ലക്ഷ്യസ്ഥാനത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. ഏകവചനത്തിലുള്ള ജനനാമം സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘അമോര്യരുടെ’ എന്നു നൽകി.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരയിൽ പാർത്തിരുന്ന
  rationale: ישב എന്ന കൃദന്തരൂപം അമോര്യരെ വിശേഷിപ്പിക്കുന്നു. בְּעֵבֶר എന്നത് ദിശയെ അനാവശ്യമായി കിഴക്ക്/പടിഞ്ഞാറ് എന്നു നിർണ്ണയിക്കാതെ ‘അക്കരയിൽ’ എന്നു നൽകുന്നു.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: അവർ നിങ്ങളോടു യുദ്ധം ചെയ്തു
  rationale: לחם കൂടെ אֵת/עִם എന്ന ഘടന യുദ്ധത്തിൽ എതിരിട്ട് പോരാടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘നിങ്ങളോടു യുദ്ധം ചെയ്തു’ ശത്രുതാപരമായ ഏറ്റുമുട്ടൽ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു
  rationale: נתן ביד എന്ന എബ്രായ പ്രയോഗം ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന അർഥമുള്ളതാണ്. ‘കയ്യിൽ ഏല്പിച്ചു’ രൂപകവും അർഥവും നിലനിർത്തുന്നു.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കി
  rationale: ירש ഇവിടെ ജയത്തിനു പിന്നാലെ ദേശം സ്വന്തമായി അധീനപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈവശമാക്കി’ ഫലം വ്യക്തമായി നൽകുന്നു; ‘അവകാശമായി ലഭിച്ചു’ എന്ന പരിമിത അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: וָאַשְׁמִידֵם
  choice: ഞാൻ അവരെ ... നശിപ്പിച്ചുകളഞ്ഞു
  rationale: שׁמד ശക്തമായ നാശത്തെയോ നീക്കിക്കളയലിനെയോ സൂചിപ്പിക്കുന്നു. ‘നശിപ്പിച്ചുകളഞ്ഞു’ അതിന്റെ തീവ്രത മയപ്പെടുത്താതെ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: പദശഃ ‘നിങ്ങളുടെ മുഖം/സാന്നിധ്യം മുമ്പിൽനിന്ന്’ എന്ന ആശയം. ‘മുമ്പിൽനിന്ന്’ നീക്കം ചെയ്യപ്പെട്ടതിന്റെ സ്ഥലബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ജയിച്ചടക്കലിനെക്കുറിച്ചുള്ള ദൈവിക പ്രസംഗത്തിന്റെ ശക്തി മയപ്പെടുത്താതിരിക്കുക
  choice: ‘ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു ... നിങ്ങൾ അവരുടെ ദേശം കൈവശമാക്കി ... ഞാൻ അവരെ ... നശിപ്പിച്ചുകളഞ്ഞു’ എന്ന നേരിട്ടുള്ള ശക്തമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘പരാജയപ്പെടുത്തി’ അല്ലെങ്കിൽ ‘നീക്കിക്കളഞ്ഞു’ എന്ന മൃദുവായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: മൂലപാഠം യുദ്ധം, ദേശം കൈവശമാക്കൽ, നശിപ്പിക്കൽ എന്നിവ വ്യക്തമായി പറയുന്നു. മതശാസ്ത്രപരമായ വിശദീകരണമോ മയപ്പെടുത്തലോ ചേർക്കാതെ ആ സംഘർഷവും ഉത്തരവാദിത്വവിതരണവും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘യോർദ്ദാനക്കര’ ദിശ അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഭൂമിശാസ്ത്രബന്ധം സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ അടിക്കുറിപ്പ് മാർക്കറുകളില്ല, കാരണം മലയാളരൂപം ഇവിടെ ഉദ്ദേശിച്ച ശത്രുതാപരമായ യുദ്ധത്തെ ആശയക്കുഴപ്പമില്ലാതെ അറിയിക്കുന്നു.
