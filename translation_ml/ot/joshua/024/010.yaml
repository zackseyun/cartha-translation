reference: Joshua 24:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: ml
  text: എന്നാൽ ബിലെയാമിന് ചെവികൊടുക്കാൻ ഞാൻ തയ്യാറായില്ല; അവൻ നിങ്ങളെ തീർച്ചയായും അനുഗ്രഹിച്ചു[a]. അങ്ങനെ ഞാൻ നിങ്ങളെ അവന്റെ കൈയിൽനിന്ന് വിടുവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അനുഗ്രഹിക്കുക’ എന്ന ക്രിയയുടെ ഊന്നൽരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അക്ഷരാർഥത്തിൽ, ‘അവൻ അനുഗ്രഹിച്ചനുഗ്രഹിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיתִי
  choice: ഞാൻ തയ്യാറായില്ല
  rationale: אבה സമ്മതമോ മനസ്സോ സൂചിപ്പിക്കുന്നതിനാൽ, വെറും കഴിവില്ലായ്മയല്ല ദൈവത്തിന്റെ മനഃപൂർവമായ നിരാകരണമാണ് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നത്.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: ബിലെയാമിനു ചെവികൊടുക്കാൻ
  rationale: שׁמע എന്ന ക്രിയയ്ക്ക് ל ചേർന്നാൽ ഒരാളുടെ വാക്കു കേൾക്കുക അഥവാ ചെവികൊടുക്കുക എന്ന അർഥം വരുന്നു. മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: അവൻ നിങ്ങളെ അനുഗ്രഹിക്കുകതന്നെ ചെയ്തു
  rationale: ക്രിയയോടൊപ്പം അതേ ധാതുവിലുള്ള infinitive absolute ഉപയോഗിച്ചിരിക്കുന്നതിന്റെ ഊന്നൽ ‘തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; ആവർത്തിച്ച് അനുഗ്രഹിച്ചു എന്ന് മൂലപാഠം നിർബന്ധമായി പറയാത്തതിനാൽ ആ വ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: וָאַצִּל
  choice: ഞാൻ ... വിടുവിച്ചു
  rationale: נצל എന്നത് ഒരാളുടെ പിടിയിൽനിന്നോ അധികാരത്തിൽനിന്നോ രക്ഷിച്ചു വിടുവിക്കുക എന്ന അർഥം നൽകുന്നു. ഉടമ്പടി-ചരിത്രത്തിന്റെ ഗൗരവമുള്ള ശൈലിക്കും ‘വിടുവിച്ചു’ യോജിക്കുന്നു.
- source_word: מִיָּדוֹ
  choice: അവന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലും വ്യക്തമായതിനാൽ അതേ രൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: അനുഗ്രഹിച്ചവന്റെ കർത്തൃത്വം
  choice: ‘അവൻ’ എന്നത് ബിലെയാമിനെ സൂചിപ്പിക്കുന്നു.
  alternative: അപ്രത്യക്ഷമായ കർത്താവ് ദൈവമാണെന്നും ‘ഞാൻ നിങ്ങളെ അനുഗ്രഹിച്ചു’ എന്നാണെന്നും വായിക്കുക.
  rationale: ക്രിയ മൂന്നാംപുരുഷ ഏകവചനത്തിലാണ്; തൊട്ടുമുമ്പ് പരാമർശിക്കപ്പെട്ട ബിലെയാമാണ് ഏറ്റവും സ്വാഭാവികമായ വ്യാകരണകർത്താവ്. ബിലെയാമിന്റെ ഉദ്ദേശ്യത്തെ ദൈവം മറിച്ചുവിട്ടുവെന്ന വിശാലസന്ദർഭം നിലനിൽക്കുമ്പോഴും മൂലപാഠത്തിന്റെ കർത്തൃത്വം മാറ്റിയിട്ടില്ല.
- issue: അനുഗ്രഹത്തിന്റെ ഊന്നൽ ആവർത്തനമാണോ ഉറപ്പാണോ
  choice: ഊന്നൽ സൂചിപ്പിക്കുന്ന ‘അനുഗ്രഹിക്കുകതന്നെ ചെയ്തു’ എന്നു നൽകി.
  alternative: ‘വീണ്ടും വീണ്ടും അനുഗ്രഹിച്ചു’ എന്നു നൽകുക.
  rationale: finite verb + cognate infinitive നിർമാണം പ്രവൃത്തിയെ ഊന്നിപ്പറയുന്നു; അത് ആവർത്തനത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യഘടന മാത്രം ആവർത്തനം നിർബന്ധമാക്കുന്നില്ല. അതിനാൽ അർഥം അതിരുകടന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘ചെവികൊടുക്കുക’ സ്വാഭാവികമായിരിക്കുമ്പോഴും ‘കേൾക്കുക’ എന്ന മൂലപ്രയോഗത്തിന്റെ അനുസരണ/സ്വീകാര്യതാ ഭാവവും വഹിക്കുന്നു. അർദ്ധവിരാമവും ‘അങ്ങനെ’യും സംഭവങ്ങളുടെ ബന്ധം വ്യക്തമാക്കുന്നു.
