reference: Joshua 24:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: ml
  text: അപ്പോൾ അവർ യാഹ്‌വെയോടു നിലവിളിച്ചു. അവൻ നിങ്ങൾക്കും ഈജിപ്തുകാർക്കും ഇടയിൽ ഇരുട്ടു വരുത്തി; കടലിനെ അവന്റെമേൽ വരുത്തി അവനെ മൂടി[a]. ഈജിപ്തിൽ ഞാൻ ചെയ്തതു നിങ്ങളുടെ കണ്ണുകൾ കണ്ടു. പിന്നെ നിങ്ങൾ അനേകം ദിവസങ്ങൾ മരുഭൂമിയിൽ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെമേൽ’, ‘അവനെ’ എന്നീ സർവനാമങ്ങൾ എബ്രായയിൽ ഏകവചനമാണ്. അവ ഈജിപ്തിനെയോ ഈജിപ്ത്യൻ സൈന്യത്തെയോ ഒരു കൂട്ടമായി സൂചിപ്പിക്കാം; പല പരിഭാഷകളും ഇവിടെ ‘അവരുടെമേൽ’, ‘അവരെ’ എന്നു നൽകുന്നു.
    reason: മൂലപാഠത്തിലെ അസാധാരണമായ ഏകവചനവും സാധ്യതയുള്ള കൂട്ടാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: അവർ യാഹ്‌വെയോടു നിലവിളിച്ചു
  rationale: צעק ദുരിതത്തിൽ സഹായത്തിനായുള്ള അടിയന്തര നിലവിളിയെ സൂചിപ്പിക്കുന്നു; אֶל അതിന്റെ ദിശ യാഹ്‌വെയിലേക്കാണെന്നു വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מַאֲפֵל
  choice: ഇരുട്ട്
  rationale: ഇരുട്ട് അഥവാ അന്ധകാരം എന്ന അടിസ്ഥാന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; തീവ്രത അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: നിങ്ങൾക്കും ഈജിപ്തുകാർക്കും ഇടയിൽ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തെ നിലനിർത്തുന്നു; യോശുവ പൂർവികരുടെ അനുഭവം ഇപ്പോഴത്തെ ഇസ്രായേലിനോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്ന ഉടമ്പടി-പ്രസംഗരീതി ഇതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם וַיְכַסֵּהוּ
  choice: കടലിനെ അവന്റെമേൽ വരുത്തി അവനെ മൂടി
  rationale: עָלָיו, וַיְכַסֵּהוּ എന്നിവയിലെ ഏകവചന പ്രത്യയങ്ങൾ നിലനിർത്തുന്നു. സന്ദർഭം ഈജിപ്തിനെയോ അതിന്റെ സൈന്യത്തെയോ കൂട്ടമായി ഉദ്ദേശിക്കാമെങ്കിലും, പാഠത്തിലെ യഥാർഥ ഏകവചനം ബഹുവചനമാക്കി മിനുക്കുന്നില്ല.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകൾ കണ്ടു
  rationale: ‘നിങ്ങൾ കണ്ടു’ എന്നു ചുരുക്കാതെ, നേരിട്ടുള്ള സാക്ഷ്യത്തിന് ഊന്നൽ നൽകുന്ന ‘നിങ്ങളുടെ കണ്ണുകൾ’ എന്ന എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: ഈജിപ്തിൽ ഞാൻ ചെയ്തതു
  rationale: בְ എന്ന ഉപസർഗത്തെ ‘ഈജിപ്തിൽ’ എന്നു നേരിട്ട് നൽകുന്നു; ‘ഈജിപ്തിനോടു/എതിരായി’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר
  choice: നിങ്ങൾ മരുഭൂമിയിൽ പാർത്തു
  rationale: ישב ഇവിടെ ദീർഘകാല വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘പാർത്തു’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്.
- source_word: יָמִים רַבִּים
  choice: അനേകദിവസം
  rationale: അക്ഷരാർഥമായ ‘അനേകം ദിവസങ്ങൾ’ എന്ന ആശയം നിലനിർത്തുന്നു; ‘ദീർഘകാലം’ എന്ന പരാവർത്തനമോ ‘അനേകവർഷം’ എന്ന വികസനമോ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ Yahweh എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ഈജിപ്ത്യൻ സൈന്യത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമങ്ങൾ
  choice: ‘അവന്റെമേൽ … അവനെ’ എന്ന ഏകവചനം നിലനിർത്തുക
  alternative: ‘അവരുടെമേൽ … അവരെ’ എന്ന കൂട്ടബഹുവചനം; ‘ഈജിപ്ത്യൻ സൈന്യത്തെ’ എന്നു വ്യക്തമാക്കൽ
  rationale: എബ്രായയിലെ עָלָיו, וַיְכַסֵּהוּ എന്നീ പ്രത്യയങ്ങൾ ഏകവചനമാണ്. അത് ഈജിപ്തിനെയോ ഈജിപ്ത്യൻ സേനയെയോ കൂട്ട ഏകവചനമായി സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ അസാധാരണത പരിഹരിക്കാതെ സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: മൂന്നാംപുരുഷമായ ‘അവൻ’ എന്നതിൽനിന്ന് ഒന്നാംപുരുഷമായ ‘ഞാൻ’ എന്നതിലേക്കുള്ള മാറ്റം
  choice: വ്യക്തിമാറ്റം അതേപടി നിലനിർത്തുക
  alternative: രണ്ടും ഒന്നാംപുരുഷത്തിലോ മൂന്നാംപുരുഷത്തിലോ ഏകീകരിക്കുക
  rationale: וַיָּשֶׂם/וַיָּבֵא എന്ന മൂന്നാംപുരുഷ രൂപങ്ങൾക്കു പിന്നാലെ עָשִׂיתִי എന്ന ഒന്നാംപുരുഷ രൂപമാണ് മൂലപാഠത്തിൽ. പ്രസംഗത്തിലെ ഈ മാറ്റം മിനുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യങ്ങൾ വായിക്കാൻ എളുപ്പമാക്കാൻ വിഭജിച്ചെങ്കിലും എബ്രായത്തിലെ സംഭവക്രമവും ‘നിങ്ങളുടെ കണ്ണുകൾ’ എന്ന ഊന്നലും വ്യക്തിമാറ്റങ്ങളും സംരക്ഷിച്ചു.
