reference: Joshua 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: ml
  text: പിന്നീട് മോവാബ് രാജാവായ സിപ്പോരിന്റെ മകൻ ബാലാക്ക് എഴുന്നേറ്റ്[a] ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തു.[b] നിങ്ങളെ ശപിക്കാൻ അവൻ ആളയച്ചു; ബെയോരിന്റെ മകൻ ബിലെയാമിനെ വിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എഴുന്നേറ്റു’ എന്നും പരിഭാഷപ്പെടുത്താം. നിർണായകമായ ഒരു പ്രവർത്തനം ആരംഭിക്കുന്നതിനെ ഈ എബ്രായക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിനെതിരെ യുദ്ധത്തിനിറങ്ങി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയ ആഖ്യാനത്തിൽ വെറും ശാരീരികമായി എഴുന്നേൽക്കുന്നതിനെക്കാൾ നിർണായകമായ പ്രവർത്തനം ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ‘എഴുന്നേറ്റ്’ മൂലപാഠത്തിന്റെ രൂപവും ഈ അർത്ഥസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയോടൊപ്പം ב വന്നിരിക്കുന്നതിനാൽ ഇവിടെ ശത്രുതാപരമായ പോരാട്ടമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇസ്രായേലിനെതിരെ’ എന്ന പ്രയോഗം ആ വൈരുദ്ധ്യബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: ആളയച്ച് ... വിളിപ്പിച്ചു
  rationale: മൂലപാഠത്തിലെ ‘അയച്ചു’, ‘വിളിച്ചു’ എന്നീ തുടർച്ചയായ രണ്ടു പ്രവർത്തനങ്ങളെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: ബെയോരിന്റെ മകൻ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: നിങ്ങളെ ശപിക്കാൻ
  rationale: קלל ഇവിടെ ഒരാളുടെമേൽ ശാപം വരുത്താൻ ഉദ്ദേശിക്കുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; ബഹുവചന അഭിസംബോധനയായ ‘നിങ്ങളെ’ നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: സംഖ്യാപുസ്തകത്തിലെ വിവരണത്തിൽ ബാലാക്കിന്റെ ശാപശ്രമത്തിനാണ് ഊന്നൽ ലഭിക്കുന്നതെങ്കിലും ഇവിടെ അവൻ ‘ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തു’ എന്നു പറയുന്നത്
  choice: യോശുവയുടെ സംഗ്രഹപ്രസംഗത്തിലെ വ്യക്തമായ വാക്കുകൾക്കനുസരിച്ച് ‘ഇസ്രായേലിനെതിരെ യുദ്ധം ചെയ്തു’ എന്നു നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിനോട് ശത്രുതയോടെ പെരുമാറി’ എന്ന വിശാലാർത്ഥമാക്കുകയോ ‘യുദ്ധത്തിന് ഒരുങ്ങി’ എന്നു സമന്വയിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: וַיִּלָּחֶם בְּיִשְׂרָאֵל നേരിട്ട് യുദ്ധം ചെയ്യുന്നതായി പറയുന്നു. മറ്റൊരു ഭാഗവുമായി സമന്വയിപ്പിക്കാനായി ഈ ചരിത്രവിവരണത്തിന്റെ വാക്കുകൾ മയപ്പെടുത്തുന്നത് പരിഭാഷയുടെ പരിധി കടക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ആളയച്ച് ... വിളിപ്പിച്ചു’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ രണ്ടു ക്രിയകളെയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ചരിത്രവിവരണത്തിലെ സാധ്യതയുള്ള അന്തർഗ്രന്ഥ സംഘർഷം പരിഭാഷയിൽ സമന്വയിപ്പിച്ചിട്ടില്ല.
