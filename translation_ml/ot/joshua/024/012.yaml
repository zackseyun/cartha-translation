source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: ml
  text: ഞാൻ നിങ്ങൾക്കു മുമ്പായി കടന്നലിനെ അയച്ചു[a]; അത് അമോര്യരുടെ ആ രണ്ടു രാജാക്കന്മാരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞു—നിങ്ങളുടെ വാൾകൊണ്ടല്ല, വില്ലുകൊണ്ടുമല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഇത് യഥാർഥ കടന്നലുകളെയല്ല, ദൈവം അയച്ച പരിഭ്രാന്തിയെയോ ഭീതിയെയോ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: ഞാൻ ... അയച്ചു
  rationale: שׁלח എന്ന ധാതുവിന്റെ Qal wayyiqtol ഒന്നാംപുരുഷ ഏകവചനരൂപം യഹോവയുടെ കഴിഞ്ഞകാല പ്രവൃത്തിയെ വിവരിക്കുന്നു. മലയാളത്തിൽ വാക്യക്രമംകൊണ്ട് ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങൾക്കു മുമ്പായി
  rationale: അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടെ മുമ്പിൽ’; ഇവിടെ ഇസ്രായേലിനു മുന്നേ അയച്ചതെന്ന ചലനസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַצִּרְעָה
  choice: കടന്നലിനെ
  rationale: പദത്തിന്റെ പ്രാഥമിക അർഥം കടന്നൽ എന്നാണ്. നിർദിഷ്ട ഏകവചനം ഒരു കൂട്ടത്തെയോ പ്രതിനിധിയായ ഏകവചനത്തെയോ സൂചിപ്പിക്കാം; അതിനാൽ വ്യാഖ്യാനപരമായി ‘ഭീതി’ എന്നു മാറ്റാതെ മൂർത്തമായ പദം നിലനിർത്തുന്നു.
- source_word: וַתְּגָרֶשׁ אוֹתָם
  choice: അത് ... ഓടിച്ചുകളഞ്ഞു
  rationale: גרשׁ എന്നതിന് ‘പുറത്താക്കുക/ഓടിച്ചുകളയുക’ എന്നാണ് അർഥം. സ്ത്രീലിംഗ ഏകവചന ക്രിയ കടന്നലിനെ കർത്താവായി ചൂണ്ടുന്നതിനാൽ ‘അത്’ എന്നു വ്യക്തമാക്കി.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ഗ്രാമാറ്റിക്കൽ രൂപവും ശത്രുക്കളെ ഇസ്രായേലിന്റെ സന്നിധിയിൽനിന്ന് നീക്കിയെന്ന ആശയവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ ആ രണ്ടു രാജാക്കന്മാരെ
  rationale: ഹീബ്രു construct ശൃംഖലയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘ആ’ എന്നത് സന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെടുന്ന രണ്ടു ഭരണാധികാരികളെ സൂചിപ്പിക്കുന്നു.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: നിങ്ങളുടെ വാൾകൊണ്ടോ വില്ലുകൊണ്ടോ ആയിരുന്നില്ല
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ ഉപകരണാർഥം ‘കൊണ്ട്’ സംരക്ഷിക്കുന്നു; ആവർത്തിച്ച നിഷേധം മലയാളത്തിലെ ‘-ഓ ... -ഓ ആയിരുന്നില്ല’ എന്ന സമാന്തരഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: הַצִּרְעָה എന്നത് അക്ഷരാർഥത്തിലോ ദൈവം അയച്ച ഭീതിയുടെ രൂപകമായോ അവതരിപ്പിക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘കടന്നൽ’ എന്ന് അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ഭീതി’ അല്ലെങ്കിൽ ‘പരിഭ്രാന്തി’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം കടന്നൽ എന്നാണ്; സന്ദർഭം നിർബന്ധമായി രൂപകാർഥം ആവശ്യപ്പെടുന്നില്ല. ജയം ഇസ്രായേലിന്റെ ആയുധബലത്താലല്ല, ദൈവത്തിന്റെ പ്രവർത്തനത്താലാണെന്ന ഊന്നൽ ഇരു വായനകളിലും നിലനിൽക്കുന്നു. രൂപകസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രസംഗമായതിനാൽ ഒന്നാംപുരുഷരൂപം നിലനിർത്തി. ഹീബ്രുവിലെ ഏകവചന അഭിസംബോധനയ്ക്ക് മലയാളത്തിൽ സാധാരണവും മാന്യവുമായ ‘നിങ്ങളുടെ’ ഉപയോഗിച്ചു; സമുദായത്തെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തോടും ഇത് യോജിക്കുന്നു.
