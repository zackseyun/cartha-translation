reference: Joshua 24:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: ml
  text: പിന്നെ ഞാൻ നിങ്ങളുടെ പിതാക്കന്മാരെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു; നിങ്ങൾ കടലിലെത്തി. ഈജിപ്തുകാർ രഥങ്ങളോടും കുതിരപ്പടയാളികളോടും കൂടി നിങ്ങളുടെ പിതാക്കന്മാരെ ചെങ്കടൽവരെ പിന്തുടർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദശഃ: “ഞാങ്ങണകളുടെ കടൽ.” ഹീബ്രു: യാം സൂഫ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: പിന്നെ ഞാൻ ... പുറപ്പെടുവിച്ചു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക/പുറപ്പെടുവിക്കുക’ എന്നർഥം നൽകുന്നു; തുടർച്ചയായ വാവ് സൂചിപ്പിക്കുന്ന ആഖ്യാനപുരോഗതി ‘പിന്നെ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരെ
  rationale: ഹീബ്രു പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘നിങ്ങളുടെ പിതാക്കന്മാർ’ എന്നാണ്; ഇവിടെ ഇസ്രായേലിന്റെ മുൻതലമുറകളെയാണ് പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്നത്.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന מן എന്ന ഉറവിടസൂചക അവ്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: നിങ്ങൾ കടലിനരികിലെത്തി
  rationale: בוא എന്ന ക്രിയയും ദിശാസൂചകമായ -ה പ്രത്യയവും കടലിന്റെ ദിശയിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കടലിനരികിലെത്തി’ വ്യക്തവും സ്വാഭാവികവും ആണ്. രണ്ടാംപുരുഷ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: ഈജിപ്തുകാർ ... പിന്തുടർന്നു
  rationale: ‘ഈജിപ്ത്’ എന്ന സമൂഹവാചക നാമത്തോടൊപ്പം മൂലത്തിൽ ക്രിയ ബഹുവചനത്തിലാണ്; ഉദ്ദേശിക്കപ്പെടുന്ന ഈജിപ്ഷ്യൻ സൈന്യത്തെ മലയാളത്തിൽ ‘ഈജിപ്തുകാർ’ എന്നു പറയുന്നത് കൃത്യവും സ്വാഭാവികവും ആണ്.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  choice: രഥങ്ങളോടും കുതിരപ്പടയാളികളോടുംകൂടെ
  rationale: רכב യുദ്ധരഥങ്ങളെയും פָּרָשִׁים കുതിരപ്പടയാളികളെയും സൂചിപ്പിക്കുന്നു; സൈനിക അനുഗമനം ‘-ഓടും ... കൂടെ’ എന്ന ഘടനയിൽ വ്യക്തമാണ്.
- source_word: יַם סוּף
  choice: ചെങ്കടൽ
  rationale: പരമ്പരാഗതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ മലയാള പ്രയോഗം; പദശഃ സാധ്യതയായ ‘ഞാങ്ങണക്കടൽ/ഞാങ്ങണകളുടെ കടൽ’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുറപ്പാട് തലമുറയെക്കുറിച്ചുള്ള സംഭവത്തിൽ പിന്നീടുള്ള ഇസ്രായേലിനോടുള്ള പ്രതിനിധിപരമായ രണ്ടാംപുരുഷ അഭിസംബോധന
  choice: ‘നിങ്ങൾ കടലിനരികിലെത്തി’ എന്ന് രണ്ടാംപുരുഷം നിലനിർത്തി
  alternative: ‘അവർ കടലിനരികിലെത്തി’ എന്ന് മൂന്നാംപുരുഷത്തിലാക്കുക
  rationale: യോശുവ ഇപ്പോഴത്തെ ശ്രോതാക്കളെ അവരുടെ പിതാക്കന്മാരുടെ ഉടമ്പടിചരിത്രവുമായി ഉദ്ദേശപൂർവം ഐക്യപ്പെടുത്തുന്നു; രണ്ടാംപുരുഷം ആ വാഗ്മിതാബലം സംരക്ഷിക്കുന്നു.
- issue: יַם סוּף എന്ന സ്ഥലനാമത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യവാചകത്തിൽ ‘ചെങ്കടൽ’
  alternative: ‘ഞാങ്ങണക്കടൽ’ അല്ലെങ്കിൽ ‘ഞാങ്ങണകളുടെ കടൽ’
  rationale: ‘ചെങ്കടൽ’ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പരമ്പരാഗത നാമമാണ്; ഹീബ്രുവിന്റെ കൂടുതൽ പദശഃ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നത് ചരിത്ര-ശാബ്ദിക സുതാര്യത കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പിതാക്കന്മാർ’ എന്ന മൂലഭാഷാനുസൃത കുടുംബപദവും ഉടമ്പടിചരിത്രത്തിലെ ‘നിങ്ങൾ’ എന്ന നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചെങ്കടലിന്റെ പകരമായ പദശഃ വ്യാഖ്യാനം തുറന്നുവെക്കുന്നു.
