  to: പിന്നെ ഞാൻ നിങ്ങളുടെ പിതാക്കന്മാരെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു; നിങ്ങൾ കടലിലെത്തി. ഈജിപ്തുകാർ രഥങ്ങളോടും കുതിരപ്പടയാളികളോടും കൂടി നിങ്ങളുടെ പിതാക്കന്മാരെ ചെങ്കടൽവരെ പിന്തുടർന്നു.[a]
