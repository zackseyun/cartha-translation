reference: Joshua 24:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: ml
  text: യോശുവയുടെ കാലത്തൊക്കെയും, യോശുവയ്ക്കുശേഷവും ജീവിച്ചിരുന്നവരും യാഹ്‌വേ ഇസ്രായേലിനുവേണ്ടി ചെയ്ത എല്ലാ പ്രവൃത്തികളും[a] അറിഞ്ഞിരുന്നവരുമായ മൂപ്പന്മാരുടെ കാലത്തൊക്കെയും ഇസ്രായേൽ യാഹ്‌വേയെ സേവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയുടെ സകല പ്രവർത്തനവും.”
    reason: מַעֲשֶׂה എന്ന ഏകവചന സമാഹാരപദത്തെ ‘പ്രവൃത്തികൾ’ എന്നും ‘പ്രവർത്തനം’ എന്നും സ്വാഭാവികമായി ഗ്രഹിക്കാം.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയ യാഹ്‌വേയെ ലക്ഷ്യമാക്കുമ്പോൾ ആരാധന മാത്രം അല്ല, ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയും അനുസരണവും ഉൾക്കൊള്ളുന്ന വിശാലമായ സേവനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സ്വനലിപ്യന്തരണമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כֹּל יְמֵי
  choice: കാലത്തൊക്കെയും
  rationale: ‘എല്ലാ ദിവസങ്ങളിലും’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികമായ മലയാള കാലപ്രയോഗമായി നൽകുന്നു.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: പ്രായത്തോടൊപ്പം സമൂഹത്തിലെ അംഗീകൃത സ്ഥാനവും നേതൃത്വവും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള പദമാണ്.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: യോശുവയ്ക്കുശേഷവും ജീവിച്ചിരുന്നവർ
  rationale: യോശുവയെ അതിജീവിച്ചു തുടർന്നും ജീവിച്ചിരുന്നുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘മരണം’ എന്ന പദം മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: יָדְעוּ
  choice: അറിഞ്ഞിരുന്നവർ
  rationale: യാഹ്‌വേയുടെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള നേരിട്ടുള്ള, അനുഭവപരമായ അറിവിനെ സൂചിപ്പിക്കാൻ കഴിയുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: യാഹ്‌വേ ... ചെയ്ത എല്ലാ പ്രവൃത്തികളും
  rationale: מַעֲשֶׂה എന്ന പദത്തിന്റെ ‘പ്രവൃത്തി/ചെയ്തത്’ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ഏകവചന സമാഹാരപ്രയോഗത്തിന്റെ കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിനുവേണ്ടി ചെയ്ത
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ ഇസ്രായേലിന്റെ നന്മയ്ക്കായി ചെയ്ത പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വേണ്ടി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്ന് പകരാതെയും ‘Jehovah’ രൂപം സ്വീകരിക്കാതെയും ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: עבד എന്നതിന്റെ ഉടമ്പടിപരമായ വ്യാപ്തി
  choice: സേവിച്ചു
  alternative: ആരാധിച്ചു
  rationale: സന്ദർഭത്തിൽ ആരാധന ഉൾപ്പെടുന്നുവെങ്കിലും ക്രിയയുടെ അർഥം ആരാധനാകർമങ്ങളിൽ മാത്രം ഒതുങ്ങുന്നില്ല; യാഹ്‌വേയോടുള്ള വിശ്വസ്ത സേവനവും അനുസരണവും ഉൾപ്പെടുന്നതിനാൽ വിശാലമായ പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തനഘടനയായ ‘യോശുവയുടെ കാലത്തൊക്കെയും ... മൂപ്പന്മാരുടെ കാലത്തൊക്കെയും’ നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ബന്ധവാക്യങ്ങൾ സ്വാഭാവിക ക്രമത്തിൽ ചേർത്തു.
