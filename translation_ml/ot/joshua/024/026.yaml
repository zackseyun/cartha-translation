  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: ml
  text: യോശുവ ഈ വാക്കുകൾ ദൈവത്തിന്റെ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതി. പിന്നെ അവൻ ഒരു വലിയ കല്ല് എടുത്ത്, യാഹ്‌വേയുടെ വിശുദ്ധസ്ഥാനത്തുണ്ടായിരുന്ന[b] ഓക്കുമരത്തിന്റെ[a] കീഴിൽ അത് നാട്ടിനിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ടെരെബിന്ത് മരത്തിന്റെ കീഴിൽ.” എബ്രായപദം ഓക്കുമരത്തേക്കാൾ ടെരെബിന്ത് മരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യാഹ്‌വേയുടെ വിശുദ്ധസ്ഥാനത്തിനരികിലുണ്ടായിരുന്ന ഓക്കുമരത്തിന്റെ കീഴിൽ.” എബ്രായത്തിലെ മുൻപ്രത്യയം ഈ സന്ദർഭത്തിൽ കൂടുതൽ അയഞ്ഞ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: എഴുതി
  rationale: כתב എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘എഴുതുക’ എന്നാണ്; ഇവിടെ ഒരു പുസ്തകത്തിൽ രേഖപ്പെടുത്തുന്നതാണ് സന്ദർഭം.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: דברים എന്നതിന് ‘വാക്കുകൾ,’ ‘കാര്യങ്ങൾ’ എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ഉടമ്പടിസംബന്ധമായ പ്രസ്താവനകൾ പുസ്തകത്തിൽ എഴുതുന്ന ഈ സന്ദർഭത്തിൽ ‘വാക്കുകൾ’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: ദൈവത്തിന്റെ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: ספר എന്നത് പുസ്തകമോ ചുരുളോ ആകാം; സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ‘പുസ്തകം’ തിരഞ്ഞെടുത്തു. תורה എന്നതിന്റെ ഉപദേശം/നിയമം എന്ന അർഥവ്യാപ്തിയിൽ, ഈ ഉടമ്പടിസന്ദർഭത്തിന് ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: ഒരു വലിയ കല്ലെടുത്ത്
  rationale: גדולה ഇവിടെ കല്ലിന്റെ ഭൗതികവലുപ്പത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വലിയ’ എന്ന സ്വാഭാവിക പദം ഉപയോഗിച്ചു.
- source_word: וַיְקִימֶהָ
  choice: അതു നാട്ടിനിർത്തി
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം കല്ലിനെ നിവർത്തി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്മാരകക്കല്ലിന്റെ പശ്ചാത്തലത്തിൽ ‘നാട്ടിനിർത്തി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַּחַת הָאַלָּה
  choice: ഓക്കുമരത്തിന്റെ കീഴിൽ
  rationale: אַלָּה ഒരു വലിയ വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ ഇനം സംബന്ധിച്ച് അനിശ്ചിതത്വമുണ്ട്. പൊതുവായ വായനയ്ക്കായി ‘ഓക്കുമരം’ മുഖ്യപാഠത്തിൽ നൽകി, ‘ടെരെബിന്ത്’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: യഹോവയുടെ വിശുദ്ധസ്ഥാനത്ത്
  rationale: מקדש എന്നത് വിശുദ്ധസ്ഥലമോ വിശുദ്ധപരിസരമോ സൂചിപ്പിക്കാം. ഇവിടെ ഒരു കെട്ടിടം നിർബന്ധമായി ധ്വനിപ്പിക്കാതെ എബ്രായത്തിന്റെ സ്ഥലാർഥം നിലനിർത്താൻ ‘വിശുദ്ധസ്ഥാനം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവെച്ചില്ല.
- issue: വൃക്ഷവും מקדש יהוה-യും തമ്മിലുള്ള സ്ഥലബന്ധം
  choice: യഹോവയുടെ വിശുദ്ധസ്ഥാനത്തുണ്ടായിരുന്ന
  alternative: യഹോവയുടെ വിശുദ്ധസ്ഥാനത്തിനരികിലുണ്ടായിരുന്ന
  rationale: ב എന്ന മുൻപ്രത്യയത്തിന്റെ സാധാരണ അർഥമായ ‘അകത്ത്/സ്ഥലത്ത്’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി. സന്ദർഭത്തിൽ അത് കൂടുതൽ അയഞ്ഞ സ്ഥലബന്ധമായി ‘അരികിൽ’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ന്യായപ്രമാണപുസ്തകം,’ ‘വിശുദ്ധസ്ഥാനം’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; വൃക്ഷത്തിന്റെ ഇനവും സ്ഥലബന്ധവും സംബന്ധിച്ച മൂലപാഠത്തിലെ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
