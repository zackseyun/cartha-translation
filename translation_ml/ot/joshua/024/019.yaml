  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: ml
  text: 'യോശുവ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾക്കു യഹ്‌വെയെ സേവിക്കാൻ കഴിയുകയില്ല; കാരണം അവൻ പരിശുദ്ധനായ ദൈവമാണ്.[a] അവൻ അസൂയയുള്ള ദൈവമാണ്. നിങ്ങളുടെ അതിക്രമങ്ങളും പാപങ്ങളും അവൻ ക്ഷമിക്കുകയില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘പരിശുദ്ധനായ ദൈവം’ എന്നതിനുള്ള എബ്രായപദങ്ങളിൽ ‘ദൈവം’, ‘പരിശുദ്ധൻ’ എന്നിവയ്ക്ക് ബഹുവചനരൂപമാണുള്ളത്; എന്നാൽ അർഥം ഏകവചനമാണ്. അക്ഷരാർഥത്തിൽ: ‘ദൈവങ്ങൾ പരിശുദ്ധർ—അവൻ.’ ഏകവചന സർവനാമം ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങളുടെ അതിക്രമങ്ങളും പാപങ്ങളും അവൻ വഹിക്കുകയോ നീക്കിക്കളയുകയോ ഇല്ല.’ ഈ എബ്രായപ്രയോഗം സാധാരണയായി ക്ഷമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: കഴിയുകയില്ല
  rationale: יכל കഴിവിനെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കഴിയുകയില്ല’ ഈ അർഥം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: לַעֲבֹד
  choice: സേവിക്കാൻ
  rationale: עבד എന്നത് സേവിക്കുക എന്ന വിശാലമായ അർഥം വഹിക്കുന്നു; ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ആരാധനയും അനുസരണവും ഉൾപ്പെടുന്നതിനാൽ ‘ആരാധിക്കാൻ’ എന്നു മാത്രമായി ചുരുക്കിയില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: അവൻ പരിശുദ്ധനായ ദൈവമാണ്
  rationale: ‘ദൈവം’, ‘പരിശുദ്ധൻ’ എന്നീ പദങ്ങൾക്ക് ബഹുവചനരൂപമുണ്ടെങ്കിലും ഏകവചന സർവനാമമായ הוּא ഇസ്രായേലിന്റെ ഏകദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവചനം ഉപയോഗിച്ചു; രൂപപരമായ പ്രത്യേകത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אֵל קַנּוֹא
  choice: തീക്ഷ്ണതയുള്ള ദൈവം
  rationale: קַנּוֹא ഉടമ്പടിബന്ധത്തിൽ ദൈവത്തിന്റെ അനന്യമായ അവകാശവാദവും മത്സരിക്കുന്ന വിശ്വസ്തതയെ അംഗീകരിക്കാത്ത തീക്ഷ്ണതയും സൂചിപ്പിക്കുന്നു. ‘അസൂയയുള്ള’ എന്നത് മലയാളത്തിൽ അധമമായ അസൂയയായി തെറ്റിദ്ധരിക്കപ്പെടാൻ ഇടയുള്ളതിനാൽ സ്ഥാപിതവും മാന്യവുമായ ‘തീക്ഷ്ണതയുള്ള’ തെരഞ്ഞെടുത്തു.
- source_word: לֹא יִשָּׂא
  choice: ക്ഷമിക്കുകയില്ല
  rationale: പാപങ്ങളോടൊപ്പം נשא ഉപയോഗിക്കുമ്പോൾ ‘വഹിക്കുക/നീക്കിക്കളയുക’ എന്ന ദൃശ്യരൂപത്തിലൂടെ ക്ഷമിക്കുക എന്ന ആശയം സാധാരണയായി പ്രകടമാകുന്നു. മുഖ്യപാഠത്തിൽ ആ പ്രയോഗത്തിന്റെ സന്ദർഭോചിത അർഥം നൽകി; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: פִשְׁעֲכֶם
  choice: നിങ്ങളുടെ അതിക്രമങ്ങൾ
  rationale: פשע അധികാരത്തിനെതിരായ ലംഘനമോ മത്സരമോ സൂചിപ്പിക്കുന്നു. ‘അതിക്രമങ്ങൾ’ ഉടമ്പടിലംഘനത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും തുടർന്ന് വരുന്ന ‘പാപങ്ങൾ’ എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חַטֹּאותֵיכֶם
  choice: നിങ്ങളുടെ പാപങ്ങൾ
  rationale: חטאת എന്ന സാധാരണ പാപപദത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനപദം ഉപയോഗിച്ചു.
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים എന്ന ബഹുവചനരൂപങ്ങളും הוּא എന്ന ഏകവചന സർവനാമവും
  choice: ‘അവൻ പരിശുദ്ധനായ ദൈവമാണ്’ എന്ന ഏകവചന വിവർത്തനം
  alternative: രൂപം അനുകരിച്ച് ‘അവൻ പരിശുദ്ധ ദൈവങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഏകവചന സർവനാമവും യോശുവ 24-ലെ ഏകദൈവസന്ദർഭവും ഏകവചനസൂചന വ്യക്തമാക്കുന്നു. ബഹുവചനരൂപം മലയാളത്തിൽ അതേപടി നൽകിയാൽ ബഹുദൈവവിശ്വാസം എന്ന തെറ്റായ ധാരണ ഉണ്ടാകും; അതിനാൽ അത് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: ദൈവം പാപങ്ങളെ ‘വഹിക്കുകയില്ല’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ക്ഷമിക്കുകയില്ല’
  alternative: ‘നിങ്ങളുടെ അതിക്രമങ്ങളും പാപങ്ങളും വഹിക്കുകയില്ല/നീക്കിക്കളയുകയില്ല’
  rationale: נשא പാപപദങ്ങളോടൊപ്പം വരുമ്പോൾ ക്ഷമയെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗമാണ്. എന്നിരുന്നാലും അതിന്റെ ദൃശ്യരൂപവും മറ്റൊരു വായനാസാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സേവിക്കുക’ എന്നത് ആരാധനയിൽ മാത്രം ഒതുങ്ങാതെ ഉടമ്പടിയോടുള്ള അനുസരണവും വിശ്വസ്തതയും ഉൾക്കൊള്ളുന്നു. ‘തീക്ഷ്ണതയുള്ള ദൈവം’ എന്ന പ്രയോഗം ദൈവത്തിന്റെ അനന്യമായ ഉടമ്പടി അവകാശം സൂചിപ്പിക്കുകയും ‘അസൂയ’ എന്ന പദത്തിന് മലയാളത്തിൽ ഉണ്ടാകാവുന്ന അധമവികാരസൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
