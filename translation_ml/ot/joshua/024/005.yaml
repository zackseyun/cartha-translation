- source_word: וָאֶגֹּף
  choice: ഞാൻ … പ്രഹരിച്ചു
  rationale: נגף എന്ന ക്രിയയിലെ ‘അടിക്കുക/പ്രഹരിക്കുക/ബാധിക്കുക’ എന്ന അർഥവ്യാപ്തിയിൽ, മൂലപാഠത്തിന്റെ ശക്തിയും നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തുന്ന ‘പ്രഹരിച്ചു’ തിരഞ്ഞെടുത്തു; സന്ദർഭം ഈജിപ്തിന്മേലുള്ള ദൈവിക പ്രഹരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: ദേശം അഥവാ അതിലെ ജനസമൂഹം എന്ന കൂട്ടായ സൂചന നിലനിർത്തുന്ന സ്വാഭാവിക നാമരൂപം.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: ഈജിപ്തിന്റെ നടുവിൽ ഞാൻ ചെയ്ത പ്രവൃത്തികളാൽ
  rationale: ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തവും വ്യാകരണപരമായി മുറുകിയതുമാണ്. ദൈവം ഈജിപ്തിനുള്ളിൽ ചെയ്ത കാര്യങ്ങൾ അതിന്മേലുള്ള പ്രഹരത്തിന്റെ മാർഗമോ സ്വഭാവമോ ആയിരുന്നുവെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְאַחַר
