- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളെ പുറത്തുകൊണ്ടുവന്നു
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരണാർഥം സംരക്ഷിക്കുന്നു; രണ്ടാംപുരുഷ ബഹുവചനമായ ‘നിങ്ങളെ’ മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളെ’ എന്ന രണ്ടാംപുരുഷ ബഹുവചനത്തിന്റെ സൂചിതർ
  choice: ഇസ്രായേലിനെ കൂട്ടായ ഉടമ്പടിസമൂഹമായി അഭിസംബോധന ചെയ്യുന്ന ‘നിങ്ങളെ’ എന്ന രൂപം നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ പിതാക്കന്മാരെ’ എന്നു വിശദീകരിച്ച് പുറപ്പാടുതലമുറയിൽ മാത്രം പരിമിതപ്പെടുത്തുക.
  rationale: ഹീബ്രു പാഠം നേരിട്ട് ‘നിങ്ങളെ’ എന്നാണ് പറയുന്നത്. ഇപ്പോഴത്തെ ശ്രോതാക്കളെയും അവരുടെ പൂർവികരെയും കൂട്ടായ ഐക്യത്തിൽ കാണുന്ന ഉടമ്പടിപരമായ വാചാടോപം വിശദീകരണപരമായി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: ഈജിപ്തിന്മേലുള്ള പ്രവൃത്തികളുടെ സ്വഭാവം
  choice: ‘പ്രഹരിച്ചു’ എന്ന വിശാലമായ പദം ഉപയോഗിച്ചു.
  alternative: ‘ബാധകൾ വരുത്തി’ എന്നു പുറപ്പാടിലെ ബാധകളായി വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭം ബാധകളിലേക്കാണ് വിരൽചൂണ്ടുന്നതെങ്കിലും נגף എന്ന മൂലക്രിയയുടെ നേരിട്ടുള്ള ‘പ്രഹരിക്കുക/ബാധിക്കുക’ എന്ന അർഥവ്യാപ്തി നിലനിർത്തി; വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അനാവശ്യമായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സംക്ഷിപ്തമായ മധ്യവാക്യം വായനാസൗകര്യത്തിനായി ‘ചെയ്ത പ്രവൃത്തികളാൽ’ എന്നു നൽകിയെങ്കിലും അതിന്റെ അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘നിങ്ങളെ’ എന്ന കൂട്ടായ അഭിസംബോധന വിശദീകരണപരമായി മാറ്റിയിട്ടില്ല.
