  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: ml
  text: ഈ സംഭവങ്ങൾക്കുശേഷം, യഹോവയുടെ ദാസനായ നൂന്റെ മകൻ യോശുവ മരിച്ചു. അപ്പോൾ അവന് നൂറ്റിപ്പത്ത് വയസ്സായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַיְהִי മലയാളത്തിൽ പ്രത്യേകം ‘സംഭവിച്ചു’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായ കാലസൂചനയിലൂടെ പ്രകടമാകുന്നു. הַדְּבָרִים എന്നത് ഇവിടെ ‘സംഭവങ്ങൾ’ എന്നാണ് സന്ദർഭോചിതം.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവ
  rationale: വംശപരിചയം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തി; പേരുകൾ നിലവാരമുള്ള മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: עֶבֶד יְהוָה
  choice: യഹോവയുടെ ദാസൻ
  rationale: עֶבֶד എന്ന പദത്തിന് ‘അടിമ’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ ദൈവസേവനത്തെ മാന്യമായ സ്ഥാനപ്പേരായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു. יהוה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൃദൂകരിച്ച പ്രയോഗം ഉപയോഗിച്ചിട്ടില്ല.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: അപ്പോൾ അവന് നൂറ്റിപ്പത്ത് വയസ്സായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘നൂറ്റിപ്പത്ത് വയസ്സിന്റെ മകൻ’ എന്ന ഹീബ്രു പ്രായപ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: עֶבֶד എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ദാസൻ
  alternative: അടിമ
  rationale: പദത്തിന് ഇരുവിധ അർഥസാധ്യതയുണ്ടെങ്കിലും യോശുവയെ സംബന്ധിച്ച ഈ ബഹുമാനസൂചകമായ ഉടമ്പടി-സേവന സന്ദർഭത്തിൽ ‘ദാസൻ’ ആണ് ഉചിതം; ബന്ധിത അടിമസ്ഥിതി ഊന്നിപ്പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രു വിവരണശൈലി മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ വാക്യം രണ്ടായി വിഭജിച്ചു; അർഥഘടകങ്ങളൊന്നും ഒഴിവാക്കിയിട്ടില്ല.
