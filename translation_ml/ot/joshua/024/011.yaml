  text: וַ/תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֮ וַ/תָּבֹ֣אוּ אֶל יְרִיחוֹ֒ וַ/יִּלָּחֲמ֣וּ בָ/כֶ֣ם בַּעֲלֵֽי יְ֠רִיחוֹ הָֽ/אֱמֹרִ֨י וְ/הַ/פְּרִזִּ֜י וְ/הַֽ/כְּנַעֲנִ֗י וְ/הַֽ/חִתִּי֙ וְ/הַ/גִּרְגָּשִׁ֔י הַֽ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וָ/אֶתֵּ֥ן אוֹתָ֖/ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: ml
  text: പിന്നെ നിങ്ങൾ യോർദ്ദാൻ കടന്ന് യെരീഹോവിലെത്തി; യെരീഹോവിലെ ആളുകൾ[a]—അമോര്യർ, പെരിസ്യർ, കനാന്യർ, ഹിത്യർ, ഗിർഗാശ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവർ—നിങ്ങളോടു യുദ്ധം ചെയ്തു; ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെരീഹോവിന്റെ അധിപതിമാർ’ അല്ലെങ്കിൽ ‘യെരീഹോവിലെ പ്രമുഖർ.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘യെരീഹോവിന്റെ യജമാനന്മാർ/ഉടമകൾ’ എന്നാണ്; ഇവിടെ അത് നഗരത്തിലെ ഭരണാധികാരികളെയോ പ്രമുഖരെയോ, അല്ലെങ്കിൽ നഗരവാസികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: നിങ്ങൾ യോർദ്ദാൻ കടന്ന്
  rationale: עבר എന്ന ക്രിയയുടെ നദി കടക്കുക എന്ന വ്യക്തമായ ചലനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: യെരീഹോവിലെത്തി
  rationale: בוא + אֶל ഇവിടെ നഗരത്തിൽ എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; നഗരത്തിനകത്ത് പ്രവേശിച്ചതായി അനാവശ്യമായി നിർണയിക്കാതെ ‘എത്തി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: യെരീഹോവിന്റെ അധിപന്മാർ
  rationale: בעל എന്നതിന്റെ ‘ഉടമകൾ/യജമാനന്മാർ/അധികാരികൾ’ എന്ന അർഥപരിധി കാത്തുസൂക്ഷിക്കുന്നു. ഇത് നഗരത്തിലെ ഭരണാധികാരികളെയോ പ്രമുഖരെയോ സൂചിപ്പിക്കാം; അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: നിങ്ങളോടു യുദ്ധം ചെയ്തു
  rationale: לחם + ב എന്ന പ്രയോഗത്തിലെ ശത്രുതാപരമായ ഏറ്റുമുട്ടൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: അമോര്യർ, പെരിസ്യർ, കനാന്യർ, ഹിത്യർ, ഗിർഗാശ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവർ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപങ്ങൾ ജനവിഭാഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പതിവുള്ള ബഹുവചന ജനനാമങ്ങൾ ഉപയോഗിച്ചു.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു
  rationale: נתן + ביד എന്നത് ശത്രുക്കളെ ഒരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുന്നതിന്റെ പ്രയോഗമാണ്; ‘കയ്യിൽ ഏല്പിച്ചു’ എന്നത് ദൃശ്യരൂപവും അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ജയത്തിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: ഞാൻ അവരെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിച്ചു
  alternative: അവരെ ജയിക്കാൻ ഞാൻ നിങ്ങളെ അനുവദിച്ചു
  rationale: മൂലപാഠം ജയം ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവർത്തനമായി പ്രസ്താവിക്കുന്നു. അതിനെ വെറും അനുവാദമോ പരോക്ഷ പരിപാലനമോ ആയി മൃദൂകരിച്ചിട്ടില്ല.
- issue: യെരീഹോവിന്റെ בַּעֲלֵי എന്നവരുടെ തിരിച്ചറിയൽ
  choice: അധിപന്മാർ
  alternative: പുരുഷന്മാർ / നിവാസികൾ
  rationale: പദത്തിന്റെ ഉടമസ്ഥതയോ അധികാരമോ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; എന്നാൽ കൃത്യമായ സാമൂഹിക തിരിച്ചറിയൽ ഉറപ്പില്ലാത്തതിനാൽ അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ കൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. പരിചിതമായ ബൈബിൾ സ്ഥലനാമങ്ങളും ജനനാമങ്ങളും ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായ പുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘എന്നാൽ’ എന്ന ബന്ധകം അവസാനത്തെ ദൈവിക ഇടപെടലിലേക്കുള്ള വാചകമാറ്റം സ്വാഭാവികമാക്കുന്നു.
