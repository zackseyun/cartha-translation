  to: ഇപ്പോൾ യഹ്‌വെയെ ഭയപ്പെടുകയും പൂർണഹൃദയത്തോടും വിശ്വസ്തതയോടുംകൂടെ[a] അവനെ സേവിക്കുകയും ചെയ്യുക. നദിക്കക്കരെ[b]യും ഈജിപ്തിലും നിങ്ങളുടെ പിതാക്കന്മാർ സേവിച്ച ദേവന്മാരെ നീക്കിക്കളയുക; യഹ്‌വെയെ സേവിക്കുക.
