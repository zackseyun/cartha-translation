  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: ml
  text: ഇപ്പോൾ യഹ്‌വെയെ ഭയപ്പെടുകയും പൂർണഹൃദയത്തോടും വിശ്വസ്തതയോടുംകൂടെ[a] അവനെ സേവിക്കുകയും ചെയ്യുക. നദിക്കക്കരെ[b]യും ഈജിപ്തിലും നിങ്ങളുടെ പിതാക്കന്മാർ സേവിച്ച ദേവന്മാരെ നീക്കിക്കളയുക; യഹ്‌വെയെ സേവിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പദങ്ങൾ സമഗ്രത, കപടമില്ലായ്മ, സത്യം, വിശ്വാസ്യത എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു; ‘നിഷ്കളങ്കതയോടും സത്യത്തോടുംകൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യൂഫ്രട്ടീസ് നദിക്കക്കരെ.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻപത്തെ ചരിത്രവിവരണത്തിൽനിന്ന് യോശുവയുടെ ആഹ്വാനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: യഹ്‌വെയെ ഭയപ്പെടുക
  rationale: ദൈവത്തോടുള്ള ഉടമ്പടിപരമായ ഭയഭക്തി ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: അവനെ സേവിക്കുക
  rationale: ആരാധന മാത്രമല്ല, അനുസരണവും വിധേയത്വവും ഉൾപ്പെടുന്ന עבד എന്ന പദത്തിന്റെ വിശാലമായ അർഥം സൂക്ഷിക്കുന്നു.
- source_word: בְּתָמִים
  choice: പൂർണമായ ആത്മാർഥതയോടെ
  rationale: പാപരഹിതത്വമല്ല, വിഭജിക്കപ്പെടാത്ത സമഗ്രവും കപടമില്ലാത്തതുമായ സമർപ്പണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: וּבֶאֱמֶת
  choice: വിശ്വസ്തതയോടെ
  rationale: אמת എന്ന പദത്തിലെ സത്യം, സ്ഥിരത, ആശ്രയയോഗ്യത എന്നീ ഭാവങ്ങളിൽ ഈ ഉടമ്പടി-സന്ദർഭത്തിന് യോജിച്ച വിശ്വസ്തതയെ മുൻനിർത്തുന്നു; ശേഷിക്കുന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהָסִירוּ
  choice: നീക്കിക്കളയുക
  rationale: മത്സരിക്കുന്ന ദേവന്മാരെ വെറുതെ അവഗണിക്കുകയല്ല, പൂർണമായി ഉപേക്ഷിക്കണമെന്ന ആജ്ഞയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദേവന്മാർ
  rationale: മൂലപാഠത്തിൽ ‘അന്യ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് ചേർക്കുന്നില്ല.
- source_word: אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ കുടുംബപദം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: നദിക്കക്കരെ
  rationale: എബ്രായത്തിലെ പരമ്പരാഗത ഭൂമിശാസ്ത്രപ്രയോഗം മുഖ്യപാഠത്തിൽ അതേ പൊതുരൂപത്തിൽ സൂക്ഷിച്ച്, നദിയുടെ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവനാമം നേരിട്ട് നിലനിർത്തുന്നു; ഒരു പദവികൊണ്ട് പകരംവയ്ക്കുന്നില്ല.
- issue: ദൈവത്തെ ‘ഭയപ്പെടുക’ എന്ന പ്രയോഗം മയപ്പെടുത്തണമോ
  choice: ഭയപ്പെടുക
  alternative: ഭക്ത്യാദരത്തോടെ ബഹുമാനിക്കുക
  rationale: സന്ദർഭത്തിൽ ഭക്ത്യാദരവും അനുസരണവും ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, എബ്രായ ക്രിയയിലെ യഥാർഥ ‘ഭയം’ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: בְּתָמִים וּבֶאֱמֶת എന്ന ഇരട്ടപ്രയോഗം
  choice: പൂർണമായ ആത്മാർഥതയോടും വിശ്വസ്തതയോടുംകൂടെ
  alternative: നിഷ്കളങ്കതയോടും സത്യത്തോടുംകൂടെ
  rationale: പാപരഹിത പൂർണത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, സമഗ്രതയും കപടമില്ലായ്മയും വിശ്വാസ്യതയും ഉൾക്കൊള്ളുന്ന ഉടമ്പടിപരമായ സേവനം വ്യക്തമാക്കുന്നു; പദങ്ങളുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אֲבוֹתֵיכֶם എന്ന പദത്തിന്റെ ലിംഗരൂപം
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  alternative: നിങ്ങളുടെ പൂർവികർ
  rationale: മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗ കുടുംബപദം പൊതുലിംഗമാക്കി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ആവർത്തിച്ചുള്ള ‘സേവിക്കുക’ എന്ന ആജ്ഞയും ദൈവനാമത്തിന്റെ ആവർത്തനവും മൂലപാഠത്തിന്റെ വാഗ്‌ശൈലിയനുസരിച്ച് സംരക്ഷിച്ചു.
