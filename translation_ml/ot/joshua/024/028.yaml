source:
  edition: WLC
  text: וַ/יְשַׁלַּ֤ח יְהוֹשֻׁ֨עַ֙ אֶת הָ/עָ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: ml
  text: പിന്നെ യോശുവ ജനത്തെ ഓരോരുത്തനെയും അവനവന്റെ അവകാശഭൂമിയിലേക്ക് പിരിച്ചയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോ പുരുഷനെയും അവന്റെ അവകാശഭൂമിയിലേക്ക്.’ ഹീബ്രുവിലെ אִישׁ എന്ന പുല്ലിംഗ ഏകവചനപദം ഇവിടെ ഓരോ വ്യക്തിയെയും വേർതിരിച്ചു സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: യാത്രയാക്കി
  rationale: പീയേൽ രൂപം ഇവിടെ കൂടിവന്ന ജനത്തെ പിരിച്ചയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്രയാക്കി’ എന്നത് വെറും ‘അയച്ചു’ എന്നതിലുപരി ആ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: הָעָם
  choice: ജനത്തെ
  rationale: സമൂഹമായി കൂടിയിരുന്ന ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്ന עָם എന്ന പദത്തിന്റെ സ്വാഭാവികവും അതിരുകടന്ന് നിർവചിക്കാത്തതുമായ പരിഭാഷ.
- source_word: אִישׁ
  choice: ഓരോരുത്തനും
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ‘ഓരോരുത്തനും’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഹീബ്രു വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְנַחֲלָתוֹ
  choice: അവനവന്റെ അവകാശഭൂമിയിലേക്കു
  rationale: യോശുവയുടെ പശ്ചാത്തലത്തിൽ נַחֲלָה ഗോത്രങ്ങൾക്കും കുടുംബങ്ങൾക്കും ലഭിച്ച പാരമ്പര്യ ഭൂവിഹിതമാണ്. ‘അവകാശഭൂമി’ ഉടമസ്ഥതയും നിയമിത ഭൂവിഹിതവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ പദവിന്യാസം യാന്ത്രികമായി പകർത്താതെ, പിരിച്ചയച്ചതും തുടർന്ന് ഓരോരുത്തരും തങ്ങളുടെ ഭൂവിഹിതത്തിലേക്കു പോയതുമായ അർഥം സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
