- from: പിന്നെ യോശുവ ജനത്തെ യാത്രയാക്കി; ഓരോരുത്തനും അവനവന്റെ അവകാശഭൂമിയിലേക്കു പോയി.[a]
  to: പിന്നെ യോശുവ ജനത്തെ ഓരോരുത്തനെയും അവനവന്റെ അവകാശഭൂമിയിലേക്ക് പിരിച്ചയച്ചു.[a]
  rationale: The revision preserves the single Hebrew verbal action—Joshua dismissed/sent away the people—and incorporates the distributive phrase directly into that action. It retains the land-allotment nuance of נַחֲלָה and keeps the lexical alternative footnote anchored to the distributive expression.
  reviewer_model: gpt-5.6-terra
