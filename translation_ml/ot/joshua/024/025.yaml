id: JOS.24.25
reference: Joshua 24:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ ആ ദിവസം ജനവുമായി ഒരു ഉടമ്പടി ചെയ്തു[a]; ശെഖേമിൽവെച്ച് അവർക്കായി ഒരു ചട്ടവും ഒരു നിയമവിധിയും നിശ്ചയിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം: ‘ഒരു ഉടമ്പടി മുറിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവർക്കായി ഒരു ചട്ടവും ഒരു വിധിയും സ്ഥാപിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: כרת ברית എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഉടമ്പടി മുറിച്ചു’ എന്നാണെങ്കിലും, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥവ്യക്തവുമായ പ്രയോഗം ‘ഉടമ്പടി ചെയ്തു’ എന്നാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לָעָם
  choice: ജനവുമായി
  rationale: ל എന്ന ഉപസർഗം അക്ഷരാർഥത്തിൽ ‘ജനത്തിനായി’ എന്നു വരാമെങ്കിലും, כרת ברית എന്ന ഉടമ്പടി-പ്രയോഗത്തിൽ ജനത്തെ പങ്കാളിയായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനവുമായി’ എന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്നേ ദിവസം
  rationale: കാലസൂചനയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּשֶׂם
  choice: നിശ്ചയിച്ചു
  rationale: שׂים എന്നതിന് ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്ന വിശാല അർഥമുണ്ട്; നിയമപരമായ ചട്ടങ്ങളെ സംബന്ധിച്ചിടത്ത് ‘നിശ്ചയിച്ചു’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לוֹ
  choice: അവർക്കായി
  rationale: വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും, സമൂഹത്തെ ഏകകമായി കാണുന്ന עָם എന്ന മുൻപദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബഹുവചനമായ ‘അവർക്കായി’ സ്വാഭാവികമാണ്.
- source_word: חֹק
  choice: ചട്ടം
  rationale: നിശ്ചിതമായി വിധിക്കപ്പെട്ട നിയമനിബന്ധന എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന നിയമപരമായ പദത്തിൽ നൽകുന്നു.
- source_word: מִשְׁפָּט
  choice: നിയമവിധി
  rationale: ഇവിടെ അമൂർത്തമായ ‘നീതി’യെക്കാൾ നിയമപരമായ വിധിയോ ക്രമീകരണമോ ആണ് ഉദ്ദേശ്യം; ‘നിയമവിധി’ חֹק-ൽ നിന്ന് വ്യത്യാസവും നിയമഭാവവും നിലനിർത്തുന്നു.
- source_word: בִּשְׁכֶם
  choice: ശെഖേമിൽവെച്ച്
  rationale: സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അവിടെ’ എന്ന പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോശുവയുടെ ഉടമ്പടി നടപടിയുടെ സ്വഭാവം
  choice: യോശുവ ജനവുമായി ഒരു ഉടമ്പടി ചെയ്തു
  alternative: യോശുവ ജനത്തിനുവേണ്ടി ഉടമ്പടി ചെയ്തു / യോശുവ ഉടമ്പടി പുതുക്കി
  rationale: ഈ വാക്യം യോശുവയെ പ്രവർത്തനത്തിന്റെ കർത്താവായി അവതരിപ്പിക്കുകയും ജനത്തെ ഉടമ്പടിയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. കർത്താവിനെ മറ്റൊരു ഉടമ്പടി-പങ്കാളിയായി ഇവിടെ തുറന്നുപറയുന്നില്ല; ‘പുതുക്കി’ എന്നും മൂലപാഠത്തിൽ ഇല്ല. അതിനാൽ വിശാലസന്ദർഭത്തിൽ നിന്നുള്ള വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: חֹק וּמִשְׁפָּט എന്ന നിയമപദജോടി
  choice: ഒരു ചട്ടവും ഒരു നിയമവിധിയും
  alternative: ഒരു ചട്ടവും ഒരു നിയമവും / ഒരു ചട്ടവും ഒരു ന്യായവിധിയും
  rationale: രണ്ട് പദങ്ങളുടെയും നിയമപരമായ അടുപ്പവും സൂക്ഷ്മമായ വ്യത്യാസവും നിലനിർത്തുന്നു; ‘ന്യായവിധി’ പ്രത്യേകമായ ന്യായാലയവിധിയായി മാത്രം തെറ്റിദ്ധരിക്കപ്പെടാനുള്ള സാധ്യത കുറയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉടമ്പടി’, ‘ചട്ടം’, ‘നിയമവിധി’ എന്നീ പദങ്ങൾ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
