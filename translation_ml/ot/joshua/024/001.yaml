  source_fidelity: 'The Malayalam accurately reflects the Hebrew sequence and syntax: Joshua gathers all Israel''s tribes toward Shechem, summons the elders, heads, judges, and officers, and they formally present themselves before God. ‘ശെഖേമിലേക്കു’ preserves the directional force of שְׁכֶמָה without excluding the locative sense noted in the footnote. ‘ദൈവസന്നിധിയിൽ’ is an idiomatic rendering of לִפְנֵי הָאֱלֹהִים and does not substitute the divine name or add a sanctuary to the main text.'
