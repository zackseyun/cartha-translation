id: JOS.24.1
reference: Joshua 24:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: ml
  text: പിന്നെ യോശുവ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളെയും ശെഖേമിലേക്കു[a] കൂട്ടിവരുത്തി. ഇസ്രായേലിന്റെ മൂപ്പന്മാരെയും അതിന്റെ തലവന്മാരെയും[b] ന്യായാധിപന്മാരെയും ഉദ്യോഗസ്ഥന്മാരെയും വിളിച്ചുവരുത്തി; അവർ ദൈവസന്നിധിയിൽ[c] ഹാജരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശെഖേമിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഹീബ്രുരൂപം ദിശാസൂചകമാണ്—അക്ഷരാർഥത്തിൽ ‘ശെഖേമിലേക്കു’.
    reason: lexical_alternative
  - marker: b
    text: ‘തലവന്മാർ’ എന്നതിന് ‘നേതാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്നാണ്; ഒരു വിശുദ്ധസ്ഥാനത്തോ ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട പവിത്രസ്ഥലത്തോ ഹാജരാകുന്നതിനെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: കൂട്ടിവരുത്തി
  rationale: ആളുകളെ ഒരു സ്ഥലത്ത് സമ്മേളിപ്പിക്കുക എന്ന ആഖ്യാനസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളെയും
  rationale: ദേശീയ-സാമൂഹിക ഘടനയെ സൂചിപ്പിക്കുന്ന שֵׁבֶט എന്ന പദത്തിന്റെ സ്ഥാപിതവും കൃത്യവുമായ മലയാളരൂപമാണ് ‘ഗോത്രം’.
- source_word: שְׁכֶמָה
  choice: ശെഖേമിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה അവിടേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ശെഖേമിലേക്കു’ രൂപശാസ്ത്രം സംരക്ഷിക്കുന്നു.
- source_word: וַיִּקְרָא לְ
  choice: വിളിച്ചുവരുത്തി
  rationale: നിശ്ചിത നേതാക്കളെ ഔപചാരികമായി വിളിച്ചുകൂട്ടുന്നതാണ് സന്ദർഭം; ‘വിളിച്ചുവരുത്തി’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മൂപ്പന്മാർ
  rationale: അംഗീകൃത നേതൃത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും കൃത്യവുമായ പരിഭാഷ.
- source_word: רָאשָׁיו
  choice: അതിന്റെ തലവന്മാർ
  rationale: ഏകവചന സർവനാമപ്രത്യയം സമൂഹമായി കണക്കാക്കുന്ന ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു; ‘തലവന്മാർ’ ഉറവിടത്തിലെ രൂപകവും പ്രത്യേക പദവിയും നിലനിർത്തുന്നു.
- source_word: שֹׁפְטָיו
  choice: ന്യായാധിപന്മാർ
  rationale: നീതിന്യായപരമായ ഔദ്യോഗിക പദവിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: שֹׁטְרָיו
  choice: ഉദ്യോഗസ്ഥന്മാർ
  rationale: ഭരണനിർവഹണ ചുമതലയുള്ള അധികാരികളെയോ കാര്യനിർവാഹകരെയോ സൂചിപ്പിക്കുന്ന ശֹׁטֵר എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യപദം.
- source_word: וַיִּתְיַצְּבוּ
  choice: ഹാജരായി
  rationale: ഔപചാരികമോ ഉടമ്പടിസംബന്ധമോ ആയ വേദിയിൽ ഒരാളുടെ മുമ്പാകെ നിലകൊള്ളുക/സ്വയം അവതരിപ്പിക്കുക എന്ന ഹിത്പയേൽ ഭാവം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: ദൈവസന്നിധിയിൽ
  rationale: ഹീബ്രുവിലെ ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗത്തിൽ നൽകുന്നു; യഹോവ എന്ന ദിവ്യനാമമോ ദൈവാലയമോ പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഉടമ്പടി-സമ്മേളനസന്ദർഭത്തിലെ לִפְנֵי הָאֱלֹהִים എന്ന പ്രയോഗം
  choice: ദൈവസന്നിധിയിൽ
  alternative: യഹോവയുടെ സന്നിധിയിൽ; ദൈവത്തിന്റെ വിശുദ്ധസ്ഥാനത്തിനു മുമ്പിൽ
  rationale: ഹീബ്രു പാഠത്തിൽ യഹോവ എന്ന ദിവ്യനാമമല്ല, הָאֱלֹהִים ആണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘യഹോവ’ എന്നു പകരുന്നില്ല. ഒരു വിശുദ്ധസ്ഥാനത്ത് ഹാജരാകുന്നതിനെ ഇത് സൂചിപ്പിക്കാമെങ്കിലും ആ സ്ഥലപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതിന്റെ’ എന്ന ഏകവചനരൂപം ഇസ്രായേലിനെ ഒരു സമൂഹമായി കാണുന്ന ഹീബ്രു സർവനാമത്തെ പിന്തുടരുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
