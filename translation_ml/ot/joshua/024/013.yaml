id: JOS.24.13
reference: Joshua 24:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: ml
  text: നിങ്ങൾ അധ്വാനിച്ചിട്ടില്ലാത്ത ഒരു ദേശവും നിങ്ങൾ പണിതിട്ടില്ലാത്ത പട്ടണങ്ങളും ഞാൻ നിങ്ങൾക്കു നൽകി; നിങ്ങൾ അവയിൽ വസിക്കുന്നു. നിങ്ങൾ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളുടെയും ഒലിവുമരങ്ങളുടെയും ഫലം നിങ്ങൾ ഭക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: ഞാൻ നിങ്ങൾക്കു തന്നു
  rationale: נתן എന്ന ക്രിയയുടെ Qal wayyiqtol ഒന്നാംപുരുഷ ഏകവചനരൂപം ദൈവത്തിന്റെ കഴിഞ്ഞകാല പ്രവൃത്തിയെ ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: നിങ്ങൾ അധ്വാനിച്ചിട്ടില്ലാത്ത ഒരു ദേശം
  rationale: יגע എന്നത് അധ്വാനിക്കുക, പ്രയത്നിക്കുക എന്ന ആശയം നൽകുന്നു. ദേശത്തെ സംബന്ധിച്ചുള്ള ב എന്ന ബന്ധം മലയാളത്തിലെ വിശേഷണവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു. എബ്രായത്തിലെ ഏകവചന അഭിസംബോധന ഇസ്രായേലിനെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആദര/ബഹുവചനമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: നിങ്ങൾ പണിതിട്ടില്ലാത്ത പട്ടണങ്ങളും
  rationale: עיר എന്നതിന് ഇവിടെ ‘പട്ടണം’ സ്വാഭാവികമായ സമാനപദമാണ്; בנה എന്ന ക്രിയ നിർമാണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പണിത’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: നിങ്ങൾ അവയിൽ വസിക്കുന്നു
  rationale: ישב എന്നതിന് ഇരിക്കുക, പാർക്കുക, വസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ലഭിച്ച പട്ടണങ്ങളിലെ ഇപ്പോഴത്തെ താമസാവസ്ഥ ഇവിടെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘വസിക്കുന്നു’ ഉറവിടത്തോടടുത്തതും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: כְּרָמִים
  choice: മുന്തിരിത്തോട്ടങ്ങൾ
  rationale: כרם എന്നതിന്റെ സാധാരണ കൃഷിസംബന്ധമായ അർഥം മുന്തിരിത്തോട്ടം എന്നാണ്.
- source_word: וְזֵיתִים
  choice: ഒലിവുമരങ്ങൾ
  rationale: זֵיתִים എന്ന ബഹുവചനം സന്ദർഭത്തിൽ ഒലിവുകളെയോ ഒലിവുമരങ്ങളെയോ സൂചിപ്പിക്കാം. ‘ഒലിവുമരങ്ങൾ’ എന്നത് ഉറവിടത്തിന്റെ നേരിട്ടുള്ള സസ്യസൂചന നിലനിർത്തുന്നു; ‘ഒലിവുതോട്ടങ്ങൾ’ എന്ന് വിപുലീകരിക്കുന്നത് ഒഴിവാക്കി.
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם
  choice: നിങ്ങൾ നട്ടിട്ടില്ലാത്ത
  rationale: נטע എന്നത് ‘നടുക’ എന്നാണ്; വിളവുതരുന്ന കൃഷിസസ്യങ്ങളോടു മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: אַתֶּם אֹכְלִים
  choice: നിങ്ങൾ ഭക്ഷിക്കുന്നു
  rationale: വ്യക്തിപ്രത്യയത്തോടുകൂടിയ participle വർത്തമാനവും ചെറിയ ഊന്നലും നൽകുന്നു. മലയാളത്തിൽ ആവർത്തിച്ച ‘നിങ്ങൾ’ ആ ഊന്നൽ നിലനിർത്തുന്നു; ‘ഭക്ഷിക്കുന്നു’ സ്വാഭാവികമായ വർത്തമാനപ്രയോഗമാണ്.
theological_decisions:
- issue: രണ്ടാംപുരുഷരൂപങ്ങളിലെ ഏകവചന-ബഹുവചന വ്യത്യാസം
  choice: എല്ലായിടത്തും ഇസ്രായേൽ സമൂഹത്തോടുള്ള അഭിസംബോധനയായി ‘നിങ്ങൾ’ ഉപയോഗിച്ചു
  alternative: ആദ്യ ഉപവാക്യത്തിലെ വ്യാകരണ ഏകവചനം പ്രത്യേക കുറിപ്പിലൂടെ അടയാളപ്പെടുത്തുക
  rationale: יגע എന്നതോടുള്ള രൂപം ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള രൂപങ്ങൾ ബഹുവചനമാണ്; അഭിസംബോധന ഉടമ്പടിജനമായ ഇസ്രായേലിനാകെ ഉള്ളതാണ്. മലയാളത്തിൽ ‘നീ/നിങ്ങൾ’ മാറ്റം വരുത്തുന്നത് ഒരൊറ്റ വ്യക്തിയിലേക്കുള്ള അനാവശ്യ അർഥമാറ്റം സൃഷ്ടിക്കും.
- issue: വർത്തമാന താമസവും ഭക്ഷണവും
  choice: ‘വസിക്കുന്നു’, ‘ഭക്ഷിക്കുന്നു’ എന്ന വർത്തമാനരൂപങ്ങൾ
  alternative: ‘വസിച്ചു’, ‘ഭക്ഷിച്ചു’ എന്ന ഭൂതകാലരൂപങ്ങൾ
  rationale: wayyiqtol ആയ וַתֵּשְׁבוּ ആഖ്യാനപരമായി ഭൂതകാലം അനുവദിക്കുന്നുവെങ്കിലും പ്രസംഗസന്ദർഭത്തിൽ ലഭിച്ച ദേശത്തിലെ തുടരുന്ന താമസത്തെ സൂചിപ്പിക്കുന്നു; participle ആയ אֹכְלִים വ്യക്തമായി നിലവിലെ അനുഭവത്തെ മുൻനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു സുഗ്രാഹ്യവുമായ മലയാളം. ‘വസിക്കുന്നു’ ഔപചാരിക ഗൗരവം നിലനിർത്തുന്നു; കൃത്രിമമായ പുരാതനശൈലി ഒഴിവാക്കി. ഈ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
