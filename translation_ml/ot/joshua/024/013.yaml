  source_fidelity: 'കരടിന്റെ അടിസ്ഥാന അർഥം എബ്രായവാക്യത്തോടു വിശ്വസ്തമാണ്: ദൈവം നൽകിയ ദേശം, പണിയാത്ത പട്ടണങ്ങൾ, അവയിലെ വാസം, നട്ടിട്ടില്ലാത്ത കൃഷിവിഭവങ്ങളിൽനിന്നുള്ള ആഹാരം എന്നിവയെല്ലാം സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നിരുന്നാലും അവസാന വാക്യത്തിലെ ‘...മുന്തിരിത്തോട്ടങ്ങളിൽനിന്നും ഒലിവുമരങ്ങളിൽനിന്നും നിങ്ങൾ ഭക്ഷിക്കുന്നു’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഭക്ഷണവസ്തുവിനേക്കാൾ സ്ഥലത്തെയോ മരത്തെയോ നേരിട്ട് ഭക്ഷിക്കുന്നതുപോലെ കേൾക്കാം. എബ്രായത്തിലെ സന്ദർഭസൂചിതമായ വിളവ്/ഫലമെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതു സുരക്ഷിതമാണ്.'
  naturalness: ‘വസിക്കുന്നു’ ആധുനിക നിലവാരമുള്ള മാന്യമായ പ്രയോഗമാണ്. ആദ്യവാക്യത്തിൽ ബന്ധിതമായ രണ്ട് നേരിട്ടുള്ള കർമങ്ങളെ ഒരേ ‘നൽകി’ എന്ന ക്രിയയോടു ചേർക്കുന്നതും അവസാനവാക്യത്തിൽ ‘ഫലം’ വ്യക്തമാക്കുന്നതും വാക്യഘടനയെയും സ്വാഭാവികതയെയും മെച്ചപ്പെടുത്തുന്നു.
  terminology: ‘ദേശം,’ ‘പട്ടണങ്ങൾ,’ ‘മുന്തിരിത്തോട്ടങ്ങൾ,’ ‘ഒലിവുമരങ്ങൾ’ എന്നിവ യോജിച്ചതാണ്. זֵיתִים-ന്റെ ‘ഒലിവുമരങ്ങൾ’ എന്ന നേരിട്ടുള്ള വിവർത്തനം നിലനിർത്തിയിരിക്കുന്നു. ‘ഫലം’ എന്നത് ഒരു വ്യാഖ്യാനപരമായ പകരംവാക്കല്ല; മുന്തിരിത്തോട്ടങ്ങളുടെയും ഒലിവുമരങ്ങളുടെയും ഉൽപന്നം ഭക്ഷിക്കുന്നുവെന്ന എബ്രായസന്ദർഭത്തിലെ സൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതാണ്.
