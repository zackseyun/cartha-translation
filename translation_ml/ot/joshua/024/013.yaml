  revised_text: നിങ്ങൾ അധ്വാനിച്ചിട്ടില്ലാത്ത ഒരു ദേശവും നിങ്ങൾ പണിതിട്ടില്ലാത്ത പട്ടണങ്ങളും ഞാൻ നിങ്ങൾക്കു നൽകി; നിങ്ങൾ അവയിൽ വസിക്കുന്നു. നിങ്ങൾ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളുടെയും ഒലിവുമരങ്ങളുടെയും ഫലം നിങ്ങൾ ഭക്ഷിക്കുന്നു.
