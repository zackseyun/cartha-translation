revisions:
- from: നിങ്ങൾ അധ്വാനിച്ചിട്ടില്ലാത്ത ഒരു ദേശം ഞാൻ നിങ്ങൾക്കു തന്നു; നിങ്ങൾ പണിതിട്ടില്ലാത്ത പട്ടണങ്ങളും തന്നു. നിങ്ങൾ അവയിൽ വസിക്കുന്നു. നിങ്ങൾ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളിൽനിന്നും ഒലിവുമരങ്ങളിൽനിന്നും നിങ്ങൾ ഭക്ഷിക്കുന്നു.
  to: നിങ്ങൾ അധ്വാനിച്ചിട്ടില്ലാത്ത ഒരു ദേശവും നിങ്ങൾ പണിതിട്ടില്ലാത്ത പട്ടണങ്ങളും ഞാൻ നിങ്ങൾക്കു നൽകി; നിങ്ങൾ അവയിൽ വസിക്കുന്നു. നിങ്ങൾ നട്ടിട്ടില്ലാത്ത മുന്തിരിത്തോട്ടങ്ങളുടെയും ഒലിവുമരങ്ങളുടെയും ഫലം നിങ്ങൾ ഭക്ഷിക്കുന്നു.
  rationale: പരിഷ്കാരം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. ആദ്യത്തെ രണ്ടു ദാനവസ്തുക്കളെ ഒരേ ദൈവിക ‘നൽകി’ എന്ന ക്രിയയോടു ബന്ധിപ്പിച്ചു. അവസാനഭാഗത്ത് മുന്തിരിത്തോട്ടങ്ങളെയും ഒലിവുമരങ്ങളെയും നേരിട്ട് ‘ഭക്ഷിക്കുന്നു’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി, ഉറവിടത്തിന്റെ കാർഷികസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ഫലം/ഉൽപന്നം വ്യക്തമാക്കി. രണ്ടാംപുരുഷ ബഹുവചനമായ ‘നിങ്ങൾ,’ ഇപ്പോഴത്തെ ‘വസിക്കുന്നു,’ ‘ഭക്ഷിക്കുന്നു,’ ഒലിവുമരങ്ങൾ എന്ന നേരിട്ടുള്ള സസ്യസൂചന എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
