  - severity: low
    issue: Place-name transliteration
    rationale: The Hebrew has Timnath-serah (סֶרַח) and Gaash (גָּעַשׁ). «തിമ്നത്ത്-സെരഹിൽ» and «ഗാഅശ് പർവതത്തിന്» better reflect these forms than spellings with an added long-vowel/y sound.
  revised_text: അവർ അവനെ അവന്റെ അവകാശഭൂമിയിൽ[a], എഫ്രയീം മലനാട്ടിൽ ഗാഅശ് പർവതത്തിന് വടക്കുള്ള തിമ്നത്ത്-സെരഹിൽ അടക്കം ചെയ്തു.
