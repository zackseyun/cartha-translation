  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ml
  text: അവർ അവനെ അവന്റെ അവകാശഭൂമിയിൽ[a], എഫ്രയീം മലനാട്ടിൽ ഗാഅശ് പർവതത്തിന് വടക്കുള്ള തിമ്നത്ത്-സെരഹിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അവകാശഭൂമിയുടെ അതിർത്തിയിൽ.’ גְּבוּל എന്ന ഹീബ്രു പദത്തിന് അതിർത്തിയെയോ അതിനുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ യോശുവയ്ക്ക് ഓഹരിയായി ലഭിച്ച ഭൂവിഭാഗമാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത കൂടുതലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ ... അടക്കം ചെയ്തു
  rationale: കבר എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനരൂപവും പ്രത്യക്ഷ കർമമായ אֹתוֹയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; വാക്യാരംഭത്തിലെ וַ־ വേറിട്ട് ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ കഥയുടെ തുടർച്ച വാക്യക്രമത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: അവന്റെ അവകാശഭൂമിയുടെ പ്രദേശത്ത്
  rationale: גְּבוּל എന്നതിന് ‘അതിർത്തി’ എന്നും അതിർത്തിക്കുള്ളിലെ ‘പ്രദേശം’ എന്നും അർഥമാകാം. ശവസംസ്കാരസ്ഥലം വ്യക്തമാക്കുന്ന ഈ സന്ദർഭത്തിൽ, യോശുവയ്ക്ക് ഓഹരിയായി ലഭിച്ച ഭൂവിഭാഗമാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത കൂടുതലാണ്; נַחֲלָהയുടെ അവകാശഭൂമി/ഓഹരി എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: בְּתִמְנַת סֶרַח
  choice: തിമ്നത്ത്-സേരഹിൽ
  rationale: സ്ഥലനാമം ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്ത്, സ്ഥലസൂചകമായ בְּ മലയാളത്തിലെ ‘-ിൽ’ വിഭക്തിയാൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിൽ
  rationale: ഇവിടെയുള്ള הַר ഒറ്റ പർവതമല്ല, എഫ്രയീമിന്റെ മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മലനാട്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: ഗായശ് പർവതത്തിന് വടക്കുള്ള
  rationale: ബന്ധിത ഭൂമിശാസ്ത്രസ്ഥാനം കൃത്യമായി നൽകുന്നു. הַר גָּעַשׁ എന്ന പ്രത്യേക ഭൂസൂചകം ‘ഗായശ് പർവതം’ എന്നു പരിഭാഷപ്പെടുത്തി.
