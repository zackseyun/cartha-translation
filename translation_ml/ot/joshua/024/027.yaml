reference: Joshua 24:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: ml
  text: 'യോശുവ എല്ലാ ജനങ്ങളോടും പറഞ്ഞു: “ഇതാ, ഈ കല്ല് നമുക്കെതിരേ സാക്ഷിയായിരിക്കും[a]. യഹോവ നമ്മോടു പറഞ്ഞ എല്ലാ വചനങ്ങളും ഇതു കേട്ടിരിക്കുന്നു[b]. നിങ്ങൾ നിങ്ങളുടെ ദൈവത്തെ നിഷേധിക്കാതിരിക്കാൻ, ഇതു നിങ്ങൾക്കെതിരെയും സാക്ഷിയായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നമുക്കു സാക്ഷിയായിരിക്കും.” എബ്രായ ഉപസർഗം കൂടുതൽ നിഷ്പക്ഷമായി ഗ്രഹിക്കാം; എന്നാൽ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെക്കുറിച്ചുള്ള ഈ മുന്നറിയിപ്പിൽ കല്ല് എതിരായ സാക്ഷ്യമായി നിൽക്കുന്നു എന്നതാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “കേട്ടിരിക്കുന്നു.” ഉടമ്പടിവചനങ്ങൾ കേട്ട സാക്ഷിയായി കല്ലിനെ വ്യക്തിവൽക്കരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאֶבֶן הַזֹּאת
  choice: ഈ കല്ല്
  rationale: אֶבֶן എന്നതിന്റെ സാധാരണ അർഥമായ ‘കല്ല്’ ഉടമ്പടിയുടെ സ്മാരകശിലയായ ഈ സന്ദർഭത്തിൽ കൃത്യമാണ്.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: സാക്ഷിയായിരിക്കും
  rationale: ഉടമ്പടി-നിയമപരമായ സാക്ഷ്യത്തിന്റെ ആശയവും היה എന്ന ക്രിയയുടെ ലളിതമായ ഭാവിരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: בָּנוּ / בָכֶם
  choice: നമുക്കെതിരേ / നിങ്ങൾക്കെതിരെയും
  rationale: ב എന്ന ഉപസർഗം ഇവിടെ ‘നമുക്കു/നിങ്ങൾക്കു സാക്ഷി’ എന്ന നിഷ്പക്ഷ അർഥത്തിലും ഗ്രഹിക്കാമെങ്കിലും, ഉടമ്പടി ലംഘനത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിൽ പ്രതികൂലസാക്ഷ്യം എന്ന സന്ദർഭാർഥം പ്രധാനമാണ്; ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: שָׁמְעָה
  choice: കേട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുകയും കല്ലിനെ വ്യക്തിവൽക്കരിക്കുന്ന മൂലപാഠത്തിന്റെ രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: യഹോവ ... പറഞ്ഞ എല്ലാ വചനങ്ങളും
  rationale: אִמְרֵי എന്നത് ‘വാക്കുകൾ/ചൊല്ലുകൾ’ എന്നു വരാമെങ്കിലും ഉടമ്പടിപ്രസംഗത്തിൽ ‘വചനങ്ങൾ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: നമ്മോടു പറഞ്ഞ
  rationale: עִם സൂചിപ്പിക്കുന്ന ‘നമ്മോടൊപ്പം/നമ്മോടു’ എന്ന ബന്ധപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: פֶּן
  choice: നിഷേധിക്കാതിരിക്കേണ്ടതിന്
  rationale: פֶּן എന്നതിന്റെ പ്രതിരോധപരമായ മുന്നറിയിപ്പ് മലയാളത്തിലെ നിഷേധാത്മക ഉദ്ദേശ്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തെ നിങ്ങൾ നിഷേധിക്കുക
  rationale: כחש ഇവിടെ ദൈവത്തെയും ഉടമ്പടി പ്രതിബദ്ധതയെയും തള്ളിപ്പറയുക എന്ന അർഥം നൽകാം; കൂടുതൽ വിശാലമായ ‘അവിശ്വസ്തമായി പെരുമാറുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: കല്ല് കേൾക്കുകയും സാക്ഷിയാകുകയും ചെയ്യുന്നതായ വ്യക്തിവൽക്കരണം
  choice: മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരിച്ച ഭാഷ അക്ഷരാർഥത്തിൽ നിലനിർത്തി
  alternative: വ്യക്തിവൽക്കരണം ഒഴിവാക്കി കല്ലിനെ ഒരു സ്മാരകം മാത്രമായി വ്യാഖ്യാനിക്കുക
  rationale: എബ്രായപാഠം കല്ല് ‘കേട്ടിരിക്കുന്നു’ എന്നും ‘സാക്ഷിയായിരിക്കും’ എന്നും തുറന്നുപറയുന്നു. ഉടമ്പടി ചടങ്ങിലെ ഈ ശക്തമായ അലങ്കാരഭാഷയെ പരാവർത്തനത്തിലൂടെ ദുർബലമാക്കരുത്.
- issue: കല്ല് ‘നമുക്കെതിരേ/നിങ്ങൾക്കെതിരേ’ സാക്ഷിയാകുന്നു എന്ന വായന
  choice: ഉടമ്പടി ലംഘനത്തിനെതിരായ പ്രതികൂലസാക്ഷ്യം മുഖ്യപാഠത്തിൽ നൽകി
  alternative: ‘നമുക്കു/നിങ്ങൾക്കു സാക്ഷി’ എന്ന നിഷ്പക്ഷ വായന
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ കൃത്യബന്ധത്തിൽ ഭാഷാപരമായ തുറന്ന നിലയുണ്ടെങ്കിലും, തുടർന്നുള്ള മുന്നറിയിപ്പ് പ്രതികൂല സാക്ഷ്യാർഥത്തെ ശക്തമാക്കുന്നു; യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ,’ ‘സാക്ഷി,’ ‘വചനങ്ങൾ’ എന്നീ പദങ്ങൾ തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിക്കുന്ന മാന്യത നൽകുമ്പോഴും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കുന്നു. എബ്രായത്തിലെ ആവർത്തനവും കല്ലിന്റെ വ്യക്തിവൽക്കരണവും സംരക്ഷിച്ചു.
