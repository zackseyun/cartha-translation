  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: ml
  text: ഞാൻ യിസ്ഹാക്കിന് യാക്കോബിനെയും ഏശാവിനെയും നൽകി. ഏശാവിന് കൈവശമാക്കാൻ സേയീർ മലനാട്[a] നൽകി; എന്നാൽ[b] യാക്കോബും അവന്റെ പുത്രന്മാരും ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സേയീർ പർവതം’ അല്ലെങ്കിൽ ‘സേയീർ മലനിരകൾ.’
    reason: הַר എന്ന പദത്തിന് ഒറ്റ മല, മലനിര, മലപ്രദേശം എന്നീ അർഥസാധ്യതകളുണ്ട്.
  - marker: b
    text: അഥവാ ‘യാക്കോബും അവന്റെ പുത്രന്മാരും ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി.’ ഹീബ്രുവിലെ സംയോജകം അക്ഷരാർഥത്തിൽ ‘ഉം/കൂടാതെ’ എന്നാണ്; ഇവിടെ കാണുന്ന വൈരുധ്യം വ്യക്തമാക്കാനാണ് പ്രധാന പാഠത്തിൽ ‘എന്നാൽ’ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: മൂലപാഠത്തിലെ ലളിതമായ സംയോജകവും സന്ദർഭത്തിൽ നിന്നു മനസ്സിലാകുന്ന വൈരുധ്യവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: ഞാൻ നൽകി
  rationale: נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു; വാക്യത്തിലെ ആവർത്തിച്ചുള്ള ദൈവിക പ്രവൃത്തിയും അതേപടി പ്രകടമാക്കുന്നു.
- source_word: לְיִצְחָק
  choice: യിസ്ഹാക്കിന്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം; לְ എന്ന ബന്ധം ദാതൃവിഭക്തിയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: യാക്കോബിനെയും ഏശാവിനെയും
  rationale: നേരിട്ടുള്ള കർമസൂചകമായ אֶת പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, യിസ്ഹാക്കിന് നൽകപ്പെട്ട രണ്ടു പുത്രന്മാരെയും സ്വാഭാവികമായ മലയാള സംയോജനത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַר שֵׂעִיר
  choice: സേയീർ മലനാട്
  rationale: הַר എന്നത് ഒറ്റ മലയെയും മലപ്രദേശത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ ഏശാവിന് കൈവശമായി ലഭിച്ച പ്രദേശമാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘മലനാട്’ പ്രസക്തമായ ഭൂമിശാസ്ത്ര അർഥം നൽകുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: കൈവശമാക്കാൻ
  rationale: ירש ഇവിടെ ഒരു പ്രദേശം സ്വന്തമാക്കി അധിവസിക്കുക/കൈവശപ്പെടുത്തുക എന്ന അർഥത്തിലാണ്. ‘കൈവശമാക്കാൻ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; אֹתוֹ എന്ന സർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ കർമമായ ‘സേയീർ മലനാട്’ മുഖേന വ്യക്തമാകുന്നു.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: എന്നാൽ യാക്കോബും അവന്റെ പുത്രന്മാരും
  rationale: וְ അടിസ്ഥാനമായി ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും, ഏശാവിന് ദേശം ലഭിച്ചതിനും യാക്കോബിന്റെ കുടുംബം ഈജിപ്തിലേക്കു പോയതിനും ഇടയിലെ സന്ദർഭപരമായ വൈരുധ്യം മലയാളത്തിലെ ‘എന്നാൽ’ വഴി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָרְדוּ מִצְרָיִם
  choice: ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി
  rationale: ירד എന്ന ‘ഇറങ്ങുക’ എന്ന ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട്, യാത്രയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ וְ എന്ന സംയോജകത്തിന്റെ വൈരുധ്യഭാവം
  choice: പ്രധാന പാഠത്തിൽ ‘എന്നാൽ’
  alternative: ‘യാക്കോബും അവന്റെ പുത്രന്മാരും ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി’ എന്ന് ‘ഉം’ ഉപയോഗിച്ച് ബന്ധിപ്പിക്കുക
  rationale: ഹീബ്രു സംയോജകം സ്വതവേ ശക്തമായ വൈരുധ്യം നിർബന്ധിക്കുന്നില്ല. എങ്കിലും ഏശാവിന് സേയീർ കൈവശമായി ലഭിച്ചതും യാക്കോബിന്റെ കുടുംബം ഈജിപ്തിലേക്കു പോയതും തമ്മിലുള്ള ആഖ്യാനപരമായ വ്യത്യാസം സന്ദർഭത്തിൽ വ്യക്തമാണ്. ‘എന്നാൽ’ അത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഔപചാരികമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നൽകി’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ഘടന നിലനിർത്തുന്നു. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
