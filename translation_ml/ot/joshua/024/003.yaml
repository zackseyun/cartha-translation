  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: ml
  text: പിന്നെ ഞാൻ നിങ്ങളുടെ പിതാവായ അബ്രാഹാമിനെ ആ നദിക്കപ്പുറത്തുനിന്ന്[a] എടുത്ത് കനാൻദേശം മുഴുവനിലൂടെയും അവനെ നടത്തി; അവന്റെ സന്തതി[b] വർധിപ്പിക്കുകയും അവന് യിസ്ഹാക്കിനെ നൽകുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ നദി’ എന്നു പറയുന്നത് മിക്കവാറും യൂഫ്രട്ടീസ് നദിയെയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘സന്താനങ്ങൾ’; ‘സന്തതി/വിത്ത്’ എന്ന എബ്രായപദം കൂട്ടായ ഏകവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: പിന്നെ ഞാൻ ... എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ കാൽ രൂപം ദൈവത്തിന്റെ കഴിഞ്ഞകാല പ്രവർത്തനത്തെ തുടർകഥനമായി അവതരിപ്പിക്കുന്നു. വാവ്-തുടർച്ചയുടെ ക്രമബോധം സ്വാഭാവികമായി നൽകാൻ ‘പിന്നെ’ ഉപയോഗിച്ചു; ‘എടുത്തു’ എന്നത് മൂലക്രിയയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: אֲבִיכֶם
  choice: നിങ്ങളുടെ പിതാവായ
  rationale: അബ്രാഹാം ഉടനെയുള്ള പിതാവല്ലെങ്കിലും, എബ്രായത്തിലെ പിതൃപുരുഷനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ കുടുംബഭാഷ സംരക്ഷിക്കാൻ ‘പിതാവ്’ നിലനിർത്തി.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: നദിക്കപ്പുറത്തുനിന്ന്
  rationale: മുൻപദത്തോടുകൂടിയ עֵבֶר ഒരു നദിയുടെ മറുകരയിൽനിന്നുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ‘നദി’ എന്ന പൊതുനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: וָאוֹלֵךְ אֹתוֹ
  choice: അവനെ നടത്തി
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം ‘നടത്തി’ എന്ന പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: കനാൻദേശം മുഴുവനിലൂടെയും
  rationale: യാത്രാസന്ദർഭത്തിലെ בְּ, ദേശത്തിലൂടെയുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഴുവനിലൂടെയും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: וָאַרְבֶּה
  choice: ഞാൻ ... വർധിപ്പിക്കുകയും
  rationale: רבה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അനേകമാക്കുക, വർധിപ്പിക്കുക’ എന്ന കാരണാർഥം നൽകുന്നു.
- source_word: זַרְעוֹ
  choice: അവന്റെ സന്തതി
  rationale: זֶרַע ഇവിടെ കൂട്ടായ ഏകവചനമായി വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ ഈ രൂപവും അർഥവ്യാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  choice: അവന് യിസ്ഹാക്കിനെ നൽകുകയും ചെയ്തു
  rationale: പരോക്ഷ കർമവും പ്രത്യക്ഷ കർമവും ഉള്ള എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ച്, യിസ്ഹാക്ക് ദൈവം അബ്രാഹാമിന് നൽകിയവൻ എന്ന ആശയം നിലനിർത്തി.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ പിതൃസ്ഥാനത്തെ സൂചിപ്പിക്കൽ
  choice: നിങ്ങളുടെ പിതാവായ അബ്രാഹാം
  alternative: നിങ്ങളുടെ പൂർവികനായ അബ്രാഹാം
  rationale: മൂലപാഠം ‘നിങ്ങളുടെ പിതാവ്’ എന്നാണ് പറയുന്നത്. അതിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ അഭിസംബോധന പൊതുവായ ‘പൂർവികൻ’ എന്നാക്കി ലഘൂകരിച്ചില്ല.
- issue: ‘നദി’യുടെ തിരിച്ചറിയൽ
  choice: നദി
  alternative: യൂഫ്രട്ടീസ് നദി
  rationale: മൂലപാഠത്തിൽ പ്രത്യേക നാമമല്ല, നിർദിഷ്ട പൊതുനാമമായ ‘നദി’യാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ അതു നിലനിർത്തി; സാധ്യതയുള്ള തിരിച്ചറിയൽ അടിക്കുറിപ്പിലാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പിതാവ്’, ‘നദി’, ‘സന്തതി’ എന്നീ മൂലപാഠസമീപ പദങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷ് കരടിൽ [b] സൂചകം ‘Canaan’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് זַרְעוֹ എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘സന്തതി’യ്ക്കുശേഷം ശരിയായ സ്ഥാനത്ത് ചേർത്തു.
