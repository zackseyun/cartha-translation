  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: ml
  text: നിങ്ങൾ യാഹ്‌വെയെ ഉപേക്ഷിച്ച് അന്യദേവന്മാരെ സേവിച്ചാൽ, അവൻ തിരിഞ്ഞ് നിങ്ങൾക്കു ദോഷം വരുത്തുകയും[a] നിങ്ങളെ നശിപ്പിക്കുകയും[b] ചെയ്യും—അവൻ നിങ്ങൾക്കു നന്മ ചെയ്തശേഷം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെമേൽ ദുരന്തം വരുത്തുകയും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ക്രിയ ധാർമിക തിന്മയെയല്ല, ഹാനിയോ ദുരന്തമോ വരുത്തുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളെ മുടിച്ചുകളയുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: -ആൽ (നിബന്ധനാർഥം)
  rationale: ഈ മുന്നറിയിപ്പിൽ כִּי ഒരു നിബന്ധനാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘…ചെയ്താൽ’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַעַזְבוּ
  choice: ഉപേക്ഷിച്ച്
  rationale: עזב ഇവിടെ യാഹ്‌വെയോടുള്ള ഉടമ്പടിബന്ധം ഉപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഉപേക്ഷിക്കുക’ അതിന്റെ ബന്ധപരമായ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַעֲבַדְתֶּם
  choice: സേവിച്ചാൽ
  rationale: ദേവന്മാരെ സംബന്ധിച്ച עבד മതപരമായ വിധേയത്വവും ആരാധനയും ഉൾക്കൊള്ളുന്നു; ‘സേവിക്കുക’ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും സന്ദർഭത്തിലെ ആരാധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי נֵכָר
  choice: അന്യദേവന്മാർ
  rationale: ഇസ്രായേലിനും യാഹ്‌വെയോടുള്ള വിശ്വസ്തതയ്ക്കും അന്യമായ ദേവന്മാരെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ‘അന്യദേവന്മാർ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְשָׁב
  choice: അവൻ തിരിഞ്ഞ്
  rationale: שׁוב യാഹ്‌വെയുടെ ഇടപാടിലുണ്ടാകുന്ന തിരിച്ചുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരിഞ്ഞ്’ രൂപകം നിലനിർത്തുന്നു; അതിന്റെ സ്വഭാവം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וְהֵרַע לָכֶם
  choice: നിങ്ങൾക്കു ദോഷം വരുത്തുകയും
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള רעה ഇവിടെ ധാർമിക തിന്മ ചെയ്യുക എന്നതിലുപരി ഹാനിയോ ദുരന്തമോ വരുത്തുക എന്നാണ്; ‘ദോഷം വരുത്തുക’ ദൈവിക ന്യായവിധിയുടെ കഠിനത മയപ്പെടുത്താതെ തെറ്റായ ധാർമിക സൂചന ഒഴിവാക്കുന്നു.
- source_word: וְכִלָּה אֶתְכֶם
  choice: നിങ്ങളെ മുടിച്ചുകളയുകയും
  rationale: כלה ഇവിടെ പൂർണമായി അവസാനിപ്പിക്കുക അഥവാ നശിപ്പിക്കുക എന്ന ശക്തമായ ആശയമാണ് നൽകുന്നത്; ‘മുടിച്ചുകളയുക’ ആ സമാപനബലം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: അവൻ നിങ്ങൾക്കു നന്മ ചെയ്തതിനുശേഷവും
  rationale: היטיב എന്നത് നന്മ ചെയ്യുക, ഗുണം ചെയ്യുക എന്നാണ്. മലയാളത്തിൽ ‘-തിനുശേഷവും’ ചേർക്കുന്നത് മുമ്പത്തെ നന്മയും തുടർന്നുള്ള ന്യായവിധിയും തമ്മിലുള്ള ഞെട്ടിപ്പിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മുമ്പ് നന്മ ചെയ്ത ദൈവം പിന്നീട് ന്യായവിധി വരുത്തുന്നു എന്ന ഭാഷ
  choice: വിശ്വാസത്യാഗമുണ്ടായാൽ യാഹ്‌വെ തന്നെയാണ് തന്റെ അനുകൂല ഇടപാട് തിരിച്ചുമാറ്റി ദോഷവും സമ്പൂർണ നാശവും വരുത്തുന്നതെന്ന ഉടമ്പടി മുന്നറിയിപ്പ് നേരിട്ട് നിലനിർത്തി.
  alternative: വിഗ്രഹാരാധനയുടെ സ്വാഭാവിക പ്രത്യാഘാതങ്ങൾ മാത്രമായി ഇതിനെ മൃദൂകരിക്കുക.
  rationale: എബ്രായ ക്രിയകൾ ന്യായവിധിയുടെ പ്രവർത്തനം നേരിട്ട് യാഹ്‌വെയോടാണ് ബന്ധിപ്പിക്കുന്നത്. പിന്നീടുള്ള ഒരു ദൈവശാസ്ത്രസംവിധാനം ഉപയോഗിച്ച് ആ ദൈവിക പ്രവർത്തനശേഷി മയപ്പെടുത്താതെ വാക്യത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ നിബന്ധനാഘടനയും ‘തിരിഞ്ഞ്’ എന്ന രൂപകവും മുൻനന്മയും പിന്നീടുള്ള ന്യായവിധിയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി. ഇംഗ്ലീഷ് മാതൃകയിൽ തെറ്റായ സ്ഥാനത്തുണ്ടായിരുന്ന [a] അടയാളം അതു വിശദീകരിക്കുന്ന ‘ദോഷം വരുത്തുകയും’ എന്ന പദപ്രയോഗത്തിനു പിന്നാലെ സ്ഥാപിച്ചു.
