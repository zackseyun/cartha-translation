  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶלְעָזָ֥ר בֶּֽן אַהֲרֹ֖ן מֵ֑ת וַ/יִּקְבְּר֣וּ אֹת֗/וֹ בְּ/גִבְעַת֙ פִּֽינְחָ֣ס בְּנ֔/וֹ אֲשֶׁ֥ר נִתַּן ל֖/וֹ בְּ/הַ֥ר אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: ml
  text: അഹരോന്റെ മകനായ എലെയാസാർ മരിച്ചു; എഫ്രയീം മലനാട്ടിൽ, അവന്നു നൽകിയിരുന്ന[a] അവന്റെ മകൻ ഫീനെഹാസിന്റെ ഗിബെയത്ത്-ഫീനെഹാസിൽ അവർ അവനെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിലെ “അവന്നു” എന്ന സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ഫീനെഹാസിനെ സൂചിപ്പിക്കുന്നു; എങ്കിലും അതു എലെയാസാറിനെ സൂചിപ്പിക്കാനും സാധ്യതയുണ്ട്. “ഗിബെയത്ത്-ഫീനെഹാസ്” എന്നതിന് “ഫീനെഹാസിന്റെ കുന്ന്” എന്നും അർഥമാകാം.
    reason: לוֹ എന്ന സർവനാമത്തിന്റെ യഥാർഥ പൂർവപദ-അനിശ്ചിതത്വവും גִבְעַת פִּינְחָס എന്ന സ്ഥലനാമ/സാധാരണനാമ പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: ഫീനെഹാസിനു നൽകിയിരുന്ന ഗിബെയയിൽ
  rationale: גִבְעַת എന്ന രൂപത്തെ ഇവിടെ സ്ഥലനാമമായ ഗിബെയ എന്നു സ്വീകരിച്ചു; തുടർന്നുള്ള ‘അവന്റെ മകൻ ഫീനെഹാസ്’ എന്ന ഘടകം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ മുൻപോട്ടു ചേർത്തു. ഈ പ്രയോഗം ‘ഫീനെഹാസിന്റെ കുന്നിൽ’ എന്നും മനസ്സിലാക്കാം.
- source_word: בְהַר אֶפְרָיִם
  choice: എഫ്രയീം മലനാട്ടിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: അനിശ്ചിത ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ പ്രത്യേകം ചേർക്കാതെ ക്രിയയുടെ ബഹുവചനരൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: אֲשֶׁר נִתַּן לוֹ എന്നതിലെ לוֹ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഫീനെഹാസിനു നൽകിയിരുന്ന
  alternative: എലെയാസാറിനു നൽകിയിരുന്ന
  rationale: ഏറ്റവും അടുത്ത പുരുഷ ഏകവചന നാമമായ ഫീനെഹാസാണ് സ്വാഭാവിക പൂർവപദം; എന്നാൽ ഹീബ്രുവിലെ സർവനാമം സ്വതവേ പേര് വ്യക്തമാക്കാത്തതിനാൽ മറ്റൊരു വായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വംശബന്ധവും സ്ഥലവിവരവും വ്യക്തമായി നിലനിർത്തി; ഹീബ്രുവിലെ ആവർത്തനഭാരം ഒഴിവാക്കാൻ സ്വാഭാവിക മലയാള വാക്യക്രമം ഉപയോഗിച്ചു.
