  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: ml
  text: ഈജിപ്തിൽനിന്ന് ഇസ്രായേൽമക്കൾ കൊണ്ടുവന്ന യോസേഫിന്റെ അസ്ഥികൾ അവർ ശെഖേമിൽ, യാക്കോബ് ശെഖേമിന്റെ പിതാവായ[c] ഹമോരിന്റെ പുത്രന്മാരിൽനിന്ന് നൂറ് കെസീതായ്ക്ക്[b] വാങ്ങിയ വയലിന്റെ ഒരു ഭാഗത്ത്[a] അടക്കം ചെയ്തു. അവ യോസേഫിന്റെ പുത്രന്മാർക്ക് അവകാശസ്വത്തായി[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വയലിലെ ഒരു പുരയിടം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഭൂമിയുടെ ഒരു ഖണ്ഡത്തെയോ വിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കെസീതാ’ ഒരു പുരാതന മൂല്യഘടകമോ പണത്തിന്റെ അളവോ ആണ്; അതിന്റെ കൃത്യമായ തുല്യമൂല്യം അറിയില്ല.
    reason: cultural_note
  - marker: c
    text: ‘പിതാവ്’ എന്നത് ഇവിടെ വിശാലമായ വംശപരമായ അർഥത്തിൽ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിൽ, ‘ശെഖേമിന്റെ സ്ഥാപകൻ’ അല്ലെങ്കിൽ ‘മുഖ്യപൂർവികൻ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: d
    text: എബ്രായത്തിൽ ക്രിയ ബഹുവചനത്തിലാണ്—അക്ഷരാർഥത്തിൽ ‘അവ ആയിത്തീർന്നു.’ ‘അവ’ എന്നതിന്റെ കൃത്യമായ സൂചിതവിഷയം വ്യാകരണപരമായി വ്യക്തമായിട്ടില്ല. സന്ദർഭത്തിൽ ഇത് വാങ്ങിയ ഭൂസ്വത്തിനെയോ വയൽഭാഗത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം; അതിനാൽ മുഖ്യവാചകത്തിൽ ബഹുവചനം നിലനിർത്തിയിരിക്കുന്നു.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: അസ്ഥികൾ
  rationale: എബ്രായപദത്തിന്റെ മൂർത്തമായ അർഥമായ ‘അസ്ഥികൾ’ നിലനിർത്തുന്നു; ‘ഭൗതികാവശിഷ്ടങ്ങൾ’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ പൊതുവായ പ്രയോഗമാണ്.
- source_word: הֶעֱלוּ
  choice: കൊണ്ടുവന്ന
  rationale: ഹിഫീൽ രൂപം ‘മുകളിലേക്കു കൊണ്ടുവരുക/കൊണ്ടുവരുക’ എന്നാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം മുൻപ് നടന്ന പ്രവൃത്തിയെ സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ആശയം സ്വാഭാവികവും ബൈബിൾശൈലിക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָבְרוּ
  choice: അവർ ... അടക്കം ചെയ്തു
  rationale: ബഹുവചന കർത്താവിനെ വ്യക്തമാക്കിക്കൊണ്ട് ക്രിയയുടെ ലളിതമായ സജീവരൂപം നൽകുന്നു.
- source_word: בִּשְׁכֶם
  choice: ശെഖേമിൽ
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന എബ്രായ ഉപസർഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: വയലിന്റെ ഒരു ഭാഗത്ത്
  rationale: חֶלְקָה ഒരു ഭൂഖണ്ഡം, ഭാഗം, അല്ലെങ്കിൽ പുരയിടം സൂചിപ്പിക്കുന്നു; ‘ഒരു ഭാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: קָנָה
  choice: വാങ്ങിയ
  rationale: വില പരാമർശിക്കുന്ന സന്ദർഭത്തിൽ ‘സ്വന്തമാക്കി’ എന്നതിനെക്കാൾ കൃത്യമായി വാങ്ങലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי חֲמוֹר
  choice: ഹമോരിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ ബന്ധപദം വ്യാഖ്യാനിച്ച് ‘വംശജർ’ ആക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲבִי שְׁכֶם
  choice: ശെഖേമിന്റെ പിതാവ്
  rationale: നിർമാണബന്ധത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള വിവർത്തനം; ‘സ്ഥാപകൻ/മുഖ്യപൂർവികൻ’ എന്ന വിശാലസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: നൂറു കെസീതായ്ക്ക്
  rationale: കൃത്യമായ ആധുനിക തുല്യം അറിയാത്ത പുരാതന മൂല്യഘടകത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു; വാങ്ങൽവില മലയാളത്തിൽ സ്വാഭാവികമായി രേഖപ്പെടുത്തുന്നു.
- source_word: וַיִּהְיוּ
  choice: അത് ... ആയിത്തീർന്നു
  rationale: ക്രിയ എബ്രായത്തിൽ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ വാങ്ങിയ വയൽഭാഗം/സ്വത്ത് അവകാശമായിത്തീർന്നതാണ് സാധ്യതയേറിയ അർഥം; രൂപപരമായ പിരിമുറുക്ക് അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: לְנַחֲלָה
  choice: അവകാശം
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്ത് എന്ന נַחֲלָהയുടെ സാധാരണ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിബന്ധസൂചക പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ജാതിനാമം മാത്രം ഉപയോഗിക്കാതെ മൂലത്തിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ ഭാവം വായിക്കാവുന്ന മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: קְשִׂיטָה എന്ന അനിശ്ചിത പുരാതന മൂല്യഘടകം
  choice: കെസീതാ
  alternative: പണത്തുണ്ട്
  rationale: ആധുനിക നാണയമൂല്യം അനാവശ്യമായി ചുമത്താതിരിക്കാനും മൂലത്തിലെ അനിശ്ചിതത്വം നിലനിർത്താനും പദം ലിപ്യന്തരണം ചെയ്ത് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- issue: וַיִּהְיוּ എന്ന ബഹുവചന ക്രിയയുടെ സൂചിതവിഷയം
  choice: വാങ്ങിയ വയൽഭാഗം/സ്വത്ത് എന്ന അർഥത്തിൽ ‘അത്’
  alternative: ‘അവ’ എന്ന ബഹുവചനരൂപം
  rationale: അവകാശമായി ലഭിച്ചത് ഭൂസ്വത്താണെന്നതാണ് സന്ദർഭത്തിലെ സ്വാഭാവിക ധാരണ; എന്നാൽ എബ്രായത്തിലെ ബഹുവചനരൂപം സൃഷ്ടിക്കുന്ന വ്യാകരണപിരിമുറുക്ക് അടിക്കുറിപ്പിലൂടെ മറച്ചുവെക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘അസ്ഥികൾ,’ ‘അവകാശം’ എന്നീ പദങ്ങൾ മൂലത്തിന്റെ കുടുംബപരവും മൂർത്തവും പാരമ്പര്യസ്വത്തുസംബന്ധവുമായ ഭാവങ്ങൾ നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനവൈകല്യം തിരുത്തി ഓരോ ചിഹ്നവും ബന്ധപ്പെട്ട മലയാളപദത്തിനരികെ ചേർത്തിരിക്കുന്നു.
