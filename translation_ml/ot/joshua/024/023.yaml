  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: ml
  text: “ഇപ്പോൾ, നിങ്ങളുടെ ഇടയിലുള്ള അന്യദേവന്മാരെ നീക്കിക്കളയുക; നിങ്ങളുടെ ഹൃദയം ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയിലേക്കു തിരിക്കുവിൻ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ ഹൃദയം ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയിലേക്കു ചായിക്കുവിൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: וְ discourse ബന്ധവും עַתָּה അടിയന്തരമായ ആഹ്വാനവും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ നിഗമനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָסִירוּ
  choice: നീക്കിക്കളയുക
  rationale: ഹിഫീൽ ബഹുവചന ആജ്ഞയുടെ ‘അകറ്റുക/നീക്കുക’ എന്ന കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: അന്യദേവന്മാർ
  rationale: വിചിത്രമായ ദേവന്മാർ എന്നല്ല, അന്യജനതകളുടെ ദേവന്മാർ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: בקרבכם ജനസമൂഹത്തിന്റെ മധ്യേ/ഇടയിൽ എന്ന അർഥത്തിലാണ്; അന്തരംഗത്തിലുള്ള എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וְהַטּוּ אֶת לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം … ചായിക്കുവിൻ
  rationale: נטה എന്ന ക്രിയയുടെ ദിശാത്മക രൂപകവും לְבַבְכֶם എന്ന ഏകവചന സമഷ്ടിപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹോവയിലേക്കു
  rationale: אֶל സൂചിപ്പിക്കുന്ന ദിശയും ദൈവനാമമായ יהוהയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: ഹീബ്രു construct പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു; മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി പരിചിതമായ രൂപം സ്വീകരിക്കുന്നു.
- issue: לְבַבְכֶם എന്ന ഏകവചന സമഷ്ടിപ്രയോഗം
  choice: നിങ്ങളുടെ ഹൃദയം
  alternative: നിങ്ങളുടെ ഹൃദയങ്ങൾ
  rationale: ഇസ്രായേൽജനത്തിന്റെ ഏകീകൃതമായ ആന്തരിക വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ഏകവചനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിലവാരമലയാളം. ‘ചായിക്കുവിൻ’ എന്നത് സാധാരണ സംസാരഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ ഹൃദയം ദൈവത്തിലേക്കു ചായിക്കുക എന്ന രൂപകം സംരക്ഷിക്കാനാണ് ഉപയോഗിച്ചത്; കൂടുതൽ സ്വാഭാവികമായ ‘തിരിക്കുവിൻ’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
