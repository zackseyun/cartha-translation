revisions:
- from: യഹ്‌വെ സകല ജനതകളെയും[a], ദേശത്തു പാർത്തിരുന്ന അമോര്യരെയും, ഞങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞു. ഞങ്ങളും യഹ്‌വെയെ സേവിക്കും; കാരണം അവിടുന്നാണ് ഞങ്ങളുടെ ദൈവം.
