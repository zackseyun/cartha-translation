  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: ml
  text: യഹ്‌വെ സകല ജനതകളെയും, ദേശത്ത് പാർത്തിരുന്ന അമോര്യരെയും, ഞങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞു. ഞങ്ങളും യഹ്‌വെയെ സേവിക്കും; കാരണം അവൻ നമ്മുടെ ദൈവമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: ഓടിച്ചുകളഞ്ഞു
  rationale: גרש എന്ന ക്രിയയുടെ ബലമുള്ള ‘പുറത്താക്കുക/ഓടിച്ചുകളയുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כָּל הָעַמִּים
  choice: സകല ജനതകളെയും
  rationale: עמים എന്ന ബഹുവചനം വിവിധ ജനവിഭാഗങ്ങളെയോ വംശീയ-ദേശീയ സമൂഹങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനതകൾ’ എന്നു നൽകി.
- source_word: וְאֶת הָאֱמֹרִי
  choice: അമോര്യരെയും
  rationale: വാക്യത്തിലെ וְ എന്ന സംയോജകത്തെ നേരിട്ട് ‘-യും’ എന്നു നിലനിർത്തുന്നു; മുൻപറഞ്ഞ ജനതകളിൽ ഇവർ ഉൾപ്പെടുന്നു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: ദേശത്തു പാർത്തിരുന്ന
  rationale: തുടർച്ചയായ വാസത്തെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചകത്തെ അമോര്യരെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി നൽകുന്നു.
- source_word: מִפָּנֵינוּ
  choice: ഞങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായ പ്രയോഗത്തിലെ സ്ഥലചിത്രം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: גַּם אֲנַחְנוּ
  choice: ഞങ്ങളും
  rationale: യോശുവയുടെ മുൻപ്രഖ്യാപനത്തോടുള്ള ജനത്തിന്റെ സമാന്തര പ്രതിജ്ഞ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: נַעֲבֹד
  choice: സേവിക്കും
  rationale: עבד ഇവിടെ ആരാധനയും ഉടമ്പടിപരമായ വിധേയത്വവും ഉൾക്കൊള്ളുന്നതിനാൽ, ‘ആരാധിക്കും’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ വിശാലമായ ‘സേവിക്കും’ ഉപയോഗിക്കുന്നു.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: കാരണം അവിടുന്നാണ് ഞങ്ങളുടെ ദൈവം
  rationale: כִּי നൽകുന്ന കാരണബന്ധം വ്യക്തമായി പ്രകടമാക്കുകയും ദൈവത്തെക്കുറിച്ചുള്ള മാന്യമായ ആധുനിക മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ Yahweh എന്ന ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന രൂപമാണ് സ്വീകരിച്ചത്.
- issue: ഉടമ്പടി-സന്ദർഭത്തിലെ עבד എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: സേവിക്കും
  alternative: ആരാധിക്കും
  rationale: ഈ പദത്തിൽ ആരാധന ഉൾപ്പെട്ടിരുന്നാലും അത് ആരാധനാക്രമത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല; വിശ്വസ്തതയും വിധേയത്വവും അടങ്ങിയ വിശാലമായ ഉടമ്പടി-സേവനം നിലനിർത്തുന്നു.
- issue: അമോര്യരും ‘സകല ജനതകളും’ തമ്മിലുള്ള ബന്ധം
  choice: ജനതകളെയും ... അമോര്യരെയും
  alternative: അമോര്യർ ഉൾപ്പെടെ സകല ജനതകളെയും
  rationale: וְ എന്ന സംയോജകത്തിന്റെ നേരിട്ടുള്ള മൂല്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അമോര്യരെ മുൻപറഞ്ഞ ജനതകളുടെ ഉദാഹരണമോ ഉപവിഭാഗമോ ആയി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സമാന്തരതയും ഉടമ്പടി-പ്രതിജ്ഞയുടെ ഗൗരവവും നിലനിർത്തി.
