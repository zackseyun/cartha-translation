  source_fidelity: 'മുഖ്യപാഠം എബ്രായ വാക്യഘടനയോടും അർഥത്തോടും വിശ്വസ്തമാണ്: യഹ്‌വെ ജനതകളെയും അമോര്യരെയും നീക്കിക്കളഞ്ഞതും, അതിനാൽ ഇസ്രായേൽ യഹ്‌വെയെ സേവിക്കുമെന്ന പ്രതിജ്ഞയും വ്യക്തമായി വരുന്നു. അമോര്യർ മുൻപറഞ്ഞ ജനതകളിൽ ഉൾപ്പെടുന്നവരാണോ, വേറിട്ട് കൂട്ടിച്ചേർത്തവരാണോ എന്ന വാക്യഘടനാപരമായ സാധ്യത അടിക്കുറിപ്പ് യുക്തമായി സംരക്ഷിക്കുന്നു.'
  naturalness: ‘അവിടുന്നാണ് ഞങ്ങളുടെ ദൈവം’ ആദരസൂചകമാണെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ ചിലപ്പോൾ സഭാപരമായ/പഴഞ്ചൻ രജിസ്റ്ററിലേക്കു ചായാം. ‘അവൻ നമ്മുടെ ദൈവമാണ്’ കൂടുതൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്; എബ്രായത്തിലെ הוּא എന്ന ഊന്നലും ഇതിൽ നിലനിൽക്കും. ‘ദേശത്ത്’ എന്ന രൂപവും ഇവിടെ കൂടുതൽ സാധാരണമായ ആധുനിക പ്രയോഗമാണ്.
  terminology: ‘യഹ്‌വെ’, ‘ജനതകൾ’, ‘അമോര്യർ’, ‘സേവിക്കും’ എന്നിവ യഥാക്രമം ദൈവനാമം, ബഹുവചന ജനവിഭാഗങ്ങൾ, ജനനാമം, ഉടമ്പടി-സേവനം എന്നിവ നന്നായി കൈമാറുന്നു. ‘ഓടിച്ചുകളഞ്ഞു’ גרש എന്ന ശക്തമായ നീക്കിക്കളയൽ അർഥത്തിന് യോജിച്ചതാണ്.
