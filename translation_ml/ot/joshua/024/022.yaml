revisions:
- from: 'അപ്പോൾ യോശുവ ജനത്തോടു പറഞ്ഞു: “യഹോവയെ സേവിക്കാൻ നിങ്ങൾ അവിടുത്തെ നിങ്ങൾക്കായി തിരഞ്ഞെടുത്തിരിക്കുന്നു എന്നതിന് നിങ്ങൾതന്നെ നിങ്ങൾക്കെതിരെ സാക്ഷികളാണ്.[a]” അവർ പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്.”'
  to: 'അപ്പോൾ യോശുവ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ യാഹ്‌വെയെ നിങ്ങൾക്കായി തിരഞ്ഞെടുത്തിരിക്കുന്നു—അവിടുത്തെ സേവിക്കാനായി—എന്നതിന് നിങ്ങൾ നിങ്ങൾക്കെതിരെ സാക്ഷികളാണ്.[a]” അവർ പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്.”'
  rationale: 'പരിഷ്കരണം മൂലവാക്യത്തിന്റെ ക്രമവും നിയമപരമായ സ്വയംസാക്ഷ്യത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു: ജനം തങ്ങൾക്കായി യാഹ്‌വെയെ തിരഞ്ഞെടുത്തു, അവിടുത്തെ സേവിക്കാനായി; അതിനാൽ അവർ തങ്ങൾക്കെതിരെ സാക്ഷികളാണ്. ബָכֶם-ന്റെ ‘നിങ്ങൾക്കു’ എന്ന ബദൽസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. ‘യാഹ്‌വേ’ എന്ന രൂപം ഇംഗ്ലീഷ് POB audit trail-നോടും ദൈവനാമം സ്ഥാനപ്പേരാക്കാതിരിക്കുന്ന നയത്തോടും യോജിക്കുന്നു.'
