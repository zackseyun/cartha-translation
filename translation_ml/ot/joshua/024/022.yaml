reference: Joshua 24:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ ജനത്തോടു പറഞ്ഞു: “നിങ്ങൾ യാഹ്‌വെയെ നിങ്ങൾക്കായി തിരഞ്ഞെടുത്തിരിക്കുന്നു—അവിടുത്തെ സേവിക്കാനായി—എന്നതിന് നിങ്ങൾ നിങ്ങൾക്കെതിരെ സാക്ഷികളാണ്.[a]” അവർ പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങൾ നിങ്ങൾക്കു സാക്ഷികളാണ്”; അതായത്, നിങ്ങളുടെ സ്വന്തം വാക്കുകൾ നിങ്ങളുടെ തിരഞ്ഞെടുപ്പിനു സാക്ഷ്യം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ ഒത്തുകൂടിയ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനം’ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: നിങ്ങൾതന്നെ നിങ്ങൾക്കെതിരെ സാക്ഷികളാണ്
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ സന്ദർഭത്തിൽ അവരുടെ സ്വന്തം പ്രഖ്യാപനം അവർക്കെതിരായ സാക്ഷ്യമായി നിൽക്കുന്നു; בָכֶם എന്നതിന്റെ സാധ്യതയുള്ള മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: എന്നതിന്
  rationale: അവർ എന്തിനാണ് സാക്ഷികളാകുന്നതെന്ന സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: നിങ്ങൾ ... നിങ്ങൾക്കായി തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: לָכֶם നൽകുന്ന പ്രതിഫലനപരമായ ഊന്നൽ—ഇത് അവരുടെ സ്വന്തം തിരഞ്ഞെടുപ്പാണ്—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לַעֲבֹד אֹתוֹ
  choice: അവിടുത്തെ സേവിക്കാൻ
  rationale: עבד എന്നത് ആരാധനയും വിശ്വസ്തസേവനവും ഉൾക്കൊള്ളുന്നു; ‘സേവിക്കാൻ’ അതിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിക്കുന്നു.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 'അവർ പറഞ്ഞു: “ഞങ്ങൾ സാക്ഷികളാണ്”'
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്ത മറുപടിയിൽ സൂചിതമായ ‘ഞങ്ങൾ ... ആണ്’ സ്വാഭാവിക മലയാളത്തിനായി പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തുന്നു; ആധുനിക മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: בָכֶם എന്നതിലെ സാക്ഷ്യത്തിന്റെ ദിശ
  choice: നിങ്ങൾക്കെതിരെ
  alternative: നിങ്ങൾക്കുതന്നെ / നിങ്ങളെക്കുറിച്ച്
  rationale: ഉടമ്പടിയുടെ നിയമപരമായ പശ്ചാത്തലത്തിൽ അവരുടെ വാക്കുകൾ പിന്നീട് അവർക്കെതിരെ സാക്ഷ്യം വഹിക്കുമെന്ന ശക്തി മുഖ്യപാഠത്തിൽ നൽകുന്നു; യഥാർഥ ഭാഷാപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സാക്ഷി’, ‘സേവിക്കുക’ എന്നീ ഉടമ്പടി-നിയമപരമായ പദങ്ങൾ സംരക്ഷിച്ചിരിക്കുന്നു; അനാവശ്യ സഭാപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
