  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ യോശുവയോടു പറഞ്ഞു: “നിന്റെ കൈയിലുള്ള എറികുന്തം[a] ഹായിക്കു നേരെ നീട്ടുക; ഞാൻ അതിനെ നിന്റെ കയ്യിൽ ഏൽപ്പിക്കും.” അങ്ങനെ യോശുവ തന്റെ കൈയിലുള്ള എറികുന്തം നഗരത്തിനു നേരെ നീട്ടി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കുന്തം” അല്ലെങ്കിൽ “നീളൻകുന്തം.” എബ്രായപദമായ כִּידוֹן സന്ദർഭാനുസരണം എറികുന്തം, കുന്തം, അല്ലെങ്കിൽ നീളൻകുന്തം എന്നിങ്ങനെ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: നീട്ടുക / നീട്ടി
  rationale: ആയുധം ഒരു ദിശയിലേക്കു നീട്ടിപ്പിടിക്കുന്ന ശാരീരിക പ്രവൃത്തി വ്യക്തമാക്കുകയും, കല്പനയിലും അതിന്റെ നിർവഹണത്തിലും ഒരേ ക്രിയ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּידוֹן
  choice: എറിയുന്തം
  rationale: ഈ ആയുധപദത്തിന്റെ സാധ്യമായ പ്രത്യേക അർഥമായ ‘javelin’ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘കുന്തം’ എന്ന വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: നിന്റെ കൈയിലുള്ള / തന്റെ കൈയിലുള്ള
  rationale: എബ്രായത്തിലെ ബന്ധവാക്യം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; ആഖ്യാനഭാഗത്ത് മലയാളത്തിന്റെ സ്വാഭാവിക പ്രത്യയപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: ഹായിക്കു നേരെ / നഗരത്തിനു നേരെ
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചന സംരക്ഷിക്കുകയും, മൂലപാഠത്തിലെ സ്ഥലനാമത്തിൽനിന്ന് ‘നഗരം’ എന്ന പദത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: ഞാൻ അതിനെ നിന്റെ കയ്യിൽ ഏല്പിക്കും
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിലും കൈയുടെ രൂപകം നിലനിർത്തി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ ആധുനിക പണ്ഡിതസമ്മതമായ ഉച്ചാരണത്തെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഹായി’ എന്ന പരിചിതമായ മലയാള സ്ഥലനാമരൂപവും ‘യോശുവ’ എന്ന സാധാരണ ബൈബിൾ നാമരൂപവും ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനങ്ങളും ‘ഹായി/നഗരം’ എന്ന പദവ്യത്യാസവും സംരക്ഷിച്ചു.
