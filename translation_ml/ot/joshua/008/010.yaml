source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יִּפְקֹ֖ד אֶת הָ/עָ֑ם וַ/יַּ֨עַל ה֜וּא וְ/זִקְנֵ֧י יִשְׂרָאֵ֛ל לִ/פְנֵ֥י הָ/עָ֖ם הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: ml
  text: യോശുവ അതിരാവിലെ എഴുന്നേറ്റ് ജനത്തെ അണിനിരത്തി[a]. പിന്നെ അദ്ദേഹവും ഇസ്രായേലിന്റെ മൂപ്പന്മാരും ജനത്തിന്റെ മുമ്പിലായി ഹായിയിലേക്കു കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനത്തെ എണ്ണിത്തിട്ടപ്പെടുത്തി’ അല്ലെങ്കിൽ ‘ജനത്തെ പരിശോധിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് എണ്ണുക, പരിശോധിക്കുക, നിയോഗിക്കുക, അണിനിരത്തുക എന്നീ അർഥങ്ങൾ വരാം; സൈനികസന്ദർഭം ‘അണിനിരത്തി’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്നർഥം നൽകുന്നു; בַּבֹּקֶר എന്ന സമയസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ ഇതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: ജനത്തെ അണിനിരത്തി
  rationale: פקד എന്നതിന് എണ്ണുക, പരിശോധിക്കുക, നിയോഗിക്കുക, സൈനികമായി ഒരുമിച്ചുകൂട്ടുക എന്നീ അർഥങ്ങളുണ്ട്. ഹായിക്കെതിരായ സൈനികനീക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അണിനിരത്തി’ ഏറ്റവും യോജിക്കുന്നു; പദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദം നിലനിർത്തുന്നു; ‘സൈന്യം’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്നത് ‘കയറുക/മുകളിലേക്കു പോകുക’ എന്നാണ്. സൈനിക മുന്നേറ്റവും ഭൂപ്രകൃതിസംബന്ധമായ കയറ്റവും ഒരുപോലെ സൂചിപ്പിക്കാൻ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: അദ്ദേഹവും ഇസ്രായേലിന്റെ മൂപ്പന്മാരും
  rationale: ക്രിയയുടെ കർത്താക്കൾ യോശുവയും മൂപ്പന്മാരും ആണെന്ന മൂലപാഠത്തിലെ വ്യക്തത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിലായി
  rationale: നേരിട്ടുള്ള സ്ഥാനസൂചന നിലനിർത്തുന്നു; ‘ജനത്തെ നയിച്ചുകൊണ്ട്’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: הָעָי
  choice: ഹായി
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സ്വാഭാവിക ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ഹീബ്രുവിലെ നിർദിഷ്ട ഉപപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തുന്നില്ല.
