- from: എന്നാൽ ആ പട്ടണത്തിലെ കന്നുകാലികളും കൊള്ളവസ്തുക്കളും മാത്രം ഇസ്രായേൽ തങ്ങൾക്കായി കൊള്ളയെടുത്തു; യഹോവ യോശുവയോടു കല്പിച്ച വചനപ്രകാരം തന്നെയായിരുന്നു അത്.
  to: ആ പട്ടണത്തിലെ കന്നുകാലികളെയും കൊള്ളവസ്തുക്കളെയും മാത്രം ഇസ്രായേൽ തങ്ങൾക്കായി കൊള്ളയായി എടുത്തു; യാഹ്‌വേ യോശുവയോടു കല്പിച്ച വചനപ്രകാരം.
