id: JOS.8.27
reference: Joshua 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: ml
  text: ആ പട്ടണത്തിലെ കന്നുകാലികളെയും കൊള്ളവസ്തുക്കളെയും മാത്രം ഇസ്രായേൽ തങ്ങൾക്കായി കൊള്ളയായി എടുത്തു; യാഹ്‌വേ യോശുവയോടു കല്പിച്ച വചനപ്രകാരം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ ... മാത്രം
  rationale: മുമ്പ് വിവരിച്ച സമ്പൂർണനാശത്തിൽനിന്ന് കന്നുകാലികളെയും കൊള്ളവസ്തുക്കളെയും ഒഴിവാക്കുന്ന നിയന്ത്രണവും വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַבְּהֵמָה
  choice: കന്നുകാലികൾ
  rationale: യുദ്ധമുതലായി കൈവശപ്പെടുത്തിയ വളർത്തുമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സമൂഹനാമം.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: ആ പട്ടണത്തിലെ ... കൊള്ളവസ്തുക്കൾ
  rationale: שׁלל യുദ്ധത്തിൽ പിടിച്ചെടുക്കുന്ന സാധനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രകടനസർവനാമത്തിന്റെ പ്രത്യേകതയും നിലനിർത്തുന്നു.
- source_word: בָּזְזוּ לָהֶם יִשְׂרָאֵל
  choice: ഇസ്രായേൽ തങ്ങൾക്കായി കൊള്ളയെടുത്തു
  rationale: בזז എന്ന ക്രിയയുടെ യുദ്ധസന്ദർഭവും לָהֶם സൂചിപ്പിക്കുന്ന സ്വപ്രയോജനവും ഉടമസ്ഥതയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവ ... കല്പിച്ച വചനപ്രകാരം
  rationale: സംഭവം ദൈവിക കല്പനയോടു പൊരുത്തപ്പെട്ടതാണെന്ന ആശയം ഔപചാരികവും വായനാസുഖമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: യോശുവയോടു കല്പിച്ച
  rationale: ബന്ധവാക്യം ‘വചനത്തെ’ വിശദീകരിക്കുന്നതായി നിലനിർത്തുകയും കല്പനയുടെ സ്വീകർത്താവ് യോശുവയാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ മുൻനിര നിയന്ത്രണാർഥം ‘എന്നാൽ ... മാത്രം’ എന്ന ഘടനയിലൂടെ നിലനിർത്തി; ആവർത്തനമെന്നു തോന്നാവുന്ന ‘കൊള്ളവസ്തുക്കൾ/കൊള്ളയെടുത്തു’ എന്ന രൂപം മൂലത്തിലെ നാമ-ക്രിയ ബന്ധവും യുദ്ധസന്ദർഭവും സംരക്ഷിക്കുന്നു.
