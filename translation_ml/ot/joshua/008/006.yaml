id: JOS.8.6
reference: Joshua 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: ml
  text: അവർ നമ്മുടെ പിന്നാലെ പുറപ്പെട്ടുവരും. നാം അവരെ പട്ടണത്തിൽനിന്ന് അകറ്റിക്കൊണ്ടുപോകുന്നതുവരെ[a] അവർ നമ്മെ പിന്തുടരും. കാരണം, ‘ആദ്യത്തെപ്പോലെ ഇവർ നമ്മുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകുകയാണ്’[b] എന്ന് അവർ പറയും. അങ്ങനെ നാം അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: ‘നാം അവരെ പട്ടണത്തിൽനിന്ന് വശീകരിച്ച് അകറ്റുന്നതുവരെ.’ എബ്രായ ക്രിയയുടെ അർഥം വലിച്ചകറ്റുക, വേർപെടുത്തുക എന്നതാണ്; ‘വശീകരിച്ച്’ എന്നു പറയുന്നത് ഈ തന്ത്രം കൂടുതൽ വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ആദ്യത്തെപ്പോലെ’ എന്നത് ആയിക്കെതിരായ യിസ്രായേലിന്റെ മുമ്പത്തെ പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്നു (യോശുവ 7:4–5 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: അവർ നമ്മുടെ പിന്നാലെ പുറപ്പെട്ടുവരും
  rationale: ആസൂത്രിതമായ ഭാവിക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; אַחֲרֵינוּ എന്നതിന് ഇവിടെ പിന്തുടരൽ എന്ന സൈനികസന്ദർഭമാണ്.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: നാം അവരെ പട്ടണത്തിൽനിന്ന് അകറ്റിക്കൊണ്ടുപോകുന്നതുവരെ
  rationale: נתק എന്ന ഹിഫീൽ ക്രിയയുടെ വലിച്ചകറ്റുക/വേർപെടുത്തുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; തന്ത്രത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാകുമ്പോഴും ‘വശീകരിക്കുക’ എന്ന അധിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: כִּי יֹאמְרוּ
  choice: കാരണം … എന്ന് അവർ പറയും
  rationale: പദ്ധതി വിജയിക്കാനുള്ള കാരണം അവതരിപ്പിക്കുന്ന כִּי-യുടെ വിശദീകരണബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָסִים לְפָנֵינוּ
  choice: ഇവർ നമ്മുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകുകയാണ്
  rationale: പാർട്ടിസിപ്പിളിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘ഓടിപ്പോകുകയാണ്’ എന്നു നൽകുന്നു; לְפָנֵינוּ സൈനിക പിന്മാറ്റസന്ദർഭത്തിൽ ‘നമ്മുടെ മുമ്പിൽനിന്ന്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: ആദ്യത്തെപ്പോലെ
  rationale: മുമ്പുണ്ടായ ആദ്യ ഏറ്റുമുട്ടലിലേക്കുള്ള നിർദിഷ്ട പരാമർശം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: അങ്ങനെ നാം അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകും
  rationale: ആസൂത്രിത ഭാവിക്രിയയും മുൻവാക്യത്തിലെ נָסִים എന്നതുമായ പദപ്രതിധ്വനിയും നിലനിർത്തുന്നു; ബന്ധത്തിന്റെ ഫലം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അങ്ങനെ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സൈനിക വിവരണശൈലി. ‘പട്ടണം’, ‘പിന്തുടരും’, ‘ഓടിപ്പോകും’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും പദ്ധതിയുടെ ഘട്ടക്രമവും കഴിയുന്നത്ര നിലനിർത്തി.
