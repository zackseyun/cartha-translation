id: JOS.8.5
reference: Joshua 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: ml
  text: ഞാനും എന്നോടുകൂടെയുള്ള സകല ജനവും നഗരത്തെ സമീപിക്കും.[a] അവർ മുമ്പത്തെപ്പോലെ[b] നമ്മെ നേരിടാൻ പുറപ്പെട്ടുവരുമ്പോൾ, നാം അവരുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരത്തിനടുത്തേക്ക് വരും.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ആദ്യത്തേതുപോലെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: സമീപിക്കും
  rationale: קרב എന്ന ക്രിയയുടെ ഖാൽ അപൂർണരൂപം ഇവിടെ ആസൂത്രിതമായ ഭാവിപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘സമീപിക്കും’ നഗരത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായും അധിക വ്യാഖ്യാനമില്ലാതെയും അറിയിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: עם എന്നതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; സന്ദർഭം സൈനികമാണെങ്കിലും ‘സൈന്യം’ എന്നാക്കി പരിധി ചുരുക്കുന്നില്ല.
- source_word: אֲשֶׁר אִתִּי
  choice: എന്നോടുകൂടെയുള്ള
  rationale: യോശുവയോടൊപ്പം വരുന്ന കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി സംക്ഷിപ്തമാക്കുന്നു.
- source_word: וְהָיָה כִּי
  choice: പുറപ്പെട്ടുവരുമ്പോൾ
  rationale: അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്ന എബ്രായ കാലസംബന്ധിയായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിലെ ‘-ുമ്പോൾ’ ഘടനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: നമ്മെ നേരിടാൻ പുറപ്പെട്ടുവരും
  rationale: יצא + לקראת എന്നത് നേരിടാനായി പുറത്തേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട് ചലനവും നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: മുമ്പത്തെപ്പോലെ
  rationale: മുമ്പുണ്ടായ ആയിയുമായുള്ള ഏറ്റുമുട്ടലിലേക്കുള്ള പരാമർശം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അക്ഷരാർഥത്തിന് അടുക്കുന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְנַסְנוּ
  choice: നാം ഓടിപ്പോകും
  rationale: נוס എന്നതിന്റെ ശക്തമായ ‘പലായനം ചെയ്യുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ‘പിൻവാങ്ങും’ എന്നു പറഞ്ഞ് കൃത്രിമമായ പലായനത്തിന്റെ ഭാഷാശക്തി മൃദുവാക്കുന്നില്ല.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽനിന്ന്
  rationale: נוס-നോടൊപ്പം വന്നിരിക്കുന്ന പ്രയോഗം അവരുടെ സന്നിധിയിൽനിന്നോ മുമ്പിൽനിന്നോ ഓടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുമ്പിൽനിന്ന്’ സ്വാഭാവികമാണ്.
- source_word: וַאֲנִי וְכָל הָעָם
  choice: ഞാനും ... സകല ജനവും
  rationale: ആദ്യത്തെ waw മുൻവാക്യത്തിലെ നിർദേശങ്ങളോടുള്ള തുടർച്ചയാണ്; മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഏകോപനഘടന ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സൈനികസന്ദർഭം വ്യക്തമാണെങ്കിലും എബ്രായത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദത്തെ അനാവശ്യമായി ‘സൈന്യം’ എന്നു ചുരുക്കിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
