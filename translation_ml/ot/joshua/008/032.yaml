id: JOS.8.32
reference: Joshua 8:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: ml
  text: അവൻ അവിടെ, ആ കല്ലുകളിൽ, ഇസ്രായേൽപുത്രന്മാരുടെ മുമ്പാകെ മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു പകർപ്പ്[a] എഴുതി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു ആവർത്തനം’ അല്ലെങ്കിൽ ‘മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു തനിപ്പകർപ്പ്.’ എബ്രായപദത്തിന് പകർപ്പ്, ആവർത്തനം, അല്ലെങ്കിൽ തനിപ്പകർപ്പ് എന്ന അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇസ്രായേൽപുത്രന്മാരുടെ സന്നിധിയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: അവൻ എഴുതി
  rationale: כתב എന്ന സാധാരണ എഴുത്തുക്രിയയുടെ ഖാൽ വയ്യിഖ്തോൽ രൂപം. കല്ലിൽ കൊത്തിയെന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും, മൂലക്രിയ നേരിട്ട് ‘എഴുതി’ എന്നാണ്.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ ക്രിയാവിശേഷണം; മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികം.
- source_word: עַל הָאֲבָנִים
  choice: ആ കല്ലുകളിൽ
  rationale: עַל എഴുത്തിന്റെ ഉപരിതലത്തെ സൂചിപ്പിക്കുന്നു; നിർദ്ദിഷ്ട ബഹുവചനത്തെ ‘ആ കല്ലുകൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു പകർപ്പ്
  rationale: מִשְׁנֵה എന്നതിന് പകർപ്പ്, തനിപ്പകർപ്പ്, ആവർത്തിച്ച രൂപം എന്നീ അർഥസാധ്യതകളുണ്ട്. കല്ലുകളിൽ എഴുതുന്ന ഈ സന്ദർഭത്തിൽ ‘ഒരു പകർപ്പ്’ ഏറ്റവും സ്വാഭാവികമാണ്; എഴുതപ്പെട്ട ഭാഗത്തിന്റെ വ്യാപ്തി ഇത് നിർണ്ണയിക്കുന്നില്ല.
- source_word: תּוֹרָה
  choice: ന്യായപ്രമാണം
  rationale: תּוֹרָהയ്ക്ക് ‘ഉപദേശം’ എന്നും അർഥമുണ്ടെങ്കിലും, മോശെയോടു ചേർന്ന ഈ ഉടമ്പടി-നിയമസന്ദർഭത്തിൽ ‘ന്യായപ്രമാണം’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: ഇവിടെ പൊതുസാന്നിധ്യത്തെയും കൺമുന്നിൽ നടന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു; ‘മുമ്പാകെ’ എബ്രായത്തിന്റെ സംക്ഷിപ്തതയും അർഥപരിധിയും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചന ഘടന സുതാര്യമായി നിലനിർത്തുന്നു; ‘ഇസ്രായേൽമക്കൾ’ കൂടുതൽ സ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണ്.
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു പകർപ്പ്’ എന്നു പരിഭാഷപ്പെടുത്തി; മുഴുവൻ തോറയാണോ തിരഞ്ഞെടുത്ത നിയമഭാഗമാണോ എന്ന് നിർണ്ണയിച്ചിട്ടില്ല.
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണത്തിന്റെ ഒരു ആവർത്തിച്ച രൂപം’ അല്ലെങ്കിൽ ‘ഒരു തനിപ്പകർപ്പ്’.
  rationale: എഴുതിയതിന്റെ വ്യാപ്തി വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും സമന്വയവ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: אֲשֶׁר כָּתַב לִפְנֵי בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധവാക്യത്തിന്റെ കർത്താവ്
  choice: പ്രധാനവാക്യത്തിലെ കർത്താവായ യോശുവയുടെ പ്രവൃത്തിയായി, ‘ഇസ്രായേൽപുത്രന്മാരുടെ മുമ്പാകെ ... എഴുതി’ എന്നു സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിച്ചു.
  alternative: മോശെ മുമ്പ് എഴുതിയ പകർപ്പിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: എബ്രായത്തിൽ כָּתַב എന്ന ക്രിയയ്ക്ക് വ്യക്തമാക്കിയ പുതിയ കർത്താവില്ല; സമീപത്തെ പ്രധാനവാക്യകർത്താവിലേക്കുള്ള തുടർച്ചയാണ് ഏറ്റവും നേരായ വായന. മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും പൊതുസാന്നിധ്യം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിയമസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയിരിക്കുന്നു.
