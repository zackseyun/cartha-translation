  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: ml
  text: യോശുവ കുന്തം പിടിച്ച് നീട്ടിയ തന്റെ കൈ, ആയിയിലെ സകല നിവാസികളെയും നാശത്തിനു സമർപ്പിച്ചുതീർക്കുന്നതുവരെ പിൻവലിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആയിയിലെ സകല നിവാസികളെയും പൂർണമായി നശിപ്പിച്ചുതീർക്കുന്നതുവരെ.” എബ്രായക്രിയയ്ക്ക് ഒരാളെ അല്ലെങ്കിൽ ഒന്നിനെ നിരോധനവിധേയമാക്കി നാശത്തിനു സമർപ്പിക്കുക എന്ന അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: പിൻവലിച്ചില്ല
  rationale: ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘തിരികെ കൊണ്ടുവരുക’ എന്ന അടിസ്ഥാനാർഥമുണ്ട്; യുദ്ധസന്ദർഭത്തിൽ നീട്ടിയ കൈയെക്കുറിച്ച് പറയുന്നതിനാൽ ‘പിൻവലിച്ചില്ല’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: יָדוֹ אֲשֶׁר נָטָה
  choice: നീട്ടിയിരുന്ന തന്റെ കൈ
  rationale: കൈ ഇതിനകം നീട്ടിപ്പിടിച്ച നിലയിലായിരുന്നുവെന്ന ബന്ധവാക്യത്തിന്റെ കാലസംബന്ധം ‘നീട്ടിയിരുന്ന’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: בַּכִּידוֹן
  choice: കുന്തം പിടിച്ച്
  rationale: כידון കുന്തം/എറിയുന്ന കുന്തം പോലുള്ള ആയുധത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കുന്തം’ സാധാരണവും സ്വാഭാവികവുമാണ്; בְ എന്ന ഉപസർഗത്തിന്റെ ഉപകരണ/സഹവർത്തിത്വ ഭാവം ‘പിടിച്ച്’ വ്യക്തമാക്കുന്നു.
- source_word: הֶחֱרִים
  choice: നാശത്തിനായി സമർപ്പിച്ചുതീരുംവരെ
  rationale: חרם എന്ന ക്രിയയുടെ നിരോധനവിധേയമാക്കി നാശത്തിന് സമർപ്പിക്കുക എന്ന സാങ്കേതിക-ദൈവശാസ്ത്രപരമായ ഭാവം വെറും ‘നശിപ്പിക്കുക’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: ആയിയിലെ സകല നിവാസികളെയും
  rationale: ‘അവിടെ വസിക്കുന്നവർ/നിവാസികൾ’ എന്ന മൂലാർഥം dignified modern Malayalam-ൽ നേരിട്ട് നൽകുന്നു.
- source_word: וִיהוֹשֻׁעַ
  choice: യോശുവ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സ്വാഭാവിക രൂപം; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി ‘അപ്പോൾ/കൂടാതെ’ എന്ന് പ്രകടിപ്പിക്കാതെ ആഖ്യാനതുടർച്ചയിലൂടെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യുദ്ധവിധിയുടെ പശ്ചാത്തലത്തിൽ חרם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  alternative: പൂർണമായി നശിപ്പിച്ചു
  rationale: ഈ തിരഞ്ഞെടുപ്പ് പദത്തിന്റെ നിരോധനവിധേയമാക്കി നാശത്തിനായി വേർതിരിക്കുന്ന പ്രത്യേക ഭാവം സംരക്ഷിക്കുന്നു; അതേസമയം വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കുന്തം പിടിച്ച് നീട്ടിയിരുന്ന തന്റെ കൈ’ എന്ന ക്രമം ശരീരഭാഗവും ആയുധവും തമ്മിലുള്ള ബന്ധം വ്യക്തമായി നൽകുന്നു. സാങ്കേതികമായ חרם മുഖ്യവാക്യത്തിൽ സംരക്ഷിച്ച് കൂടുതൽ നേരിട്ടുള്ള നാശാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
