translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുവരുന്ന എബ്രായ ചലനക്രിയകളുടെ ക്രമം നിലനിർത്തിയെങ്കിലും മലയാളവായനയ്ക്ക് സ്വാഭാവികമായ വാക്യവിഭജനം ഉപയോഗിച്ചു. ‘പടയാളികൾ’ എന്നത് മൂലത്തിലെ കൂട്ടബോധം നൽകുകയും ഇല്ലാത്ത പുരുഷലിംഗനിർണ്ണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
