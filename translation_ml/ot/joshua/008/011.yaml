language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הָ/עָ֨ם הַ/מִּלְחָמָ֜ה אֲשֶׁ֣ר אִתּ֗/וֹ עָלוּ֙ וַֽ/יִּגְּשׁ֔וּ וַ/יָּבֹ֖אוּ נֶ֣גֶד הָ/עִ֑יר וַֽ/יַּחֲנוּ֙ מִ/צְּפ֣וֹן לָ/עַ֔י וְ/הַ/גַּ֖י בינ/ו וּ/בֵין הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: ml
  text: അവനോടുകൂടെ ഉണ്ടായിരുന്ന പടയാളികളെല്ലാം കയറിച്ചെന്ന് അടുത്തുവന്നു. അവർ പട്ടണത്തിന് അഭിമുഖമായി എത്തി, ഹായിയുടെ വടക്കുഭാഗത്ത് പാളയമിറങ്ങി; താഴ്വര അവനും ഹായിക്കും ഇടയിലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘അവനും ഹായിക്കും ഇടയിൽ’ എന്നാണ്. ഏകവചന സർവനാമം മിക്കവാറും യോശുവയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘അവർക്കും ഹായിക്കും ഇടയിൽ’ എന്ന കൂട്ടമായ അർഥത്തിലും ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: പടയാളികളെല്ലാം
  rationale: അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിന്റെ ജനമെല്ലാം’ എന്ന അസാധാരണമായ പ്രയോഗം മുഴുവൻ സാധാരണ ജനത്തെയല്ല, യുദ്ധത്തിൽ പങ്കെടുക്കുന്ന സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പടയാളികൾ’ ലിംഗം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഈ സൈനികസമൂഹത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: യോശുവയോടൊപ്പം ഉണ്ടായിരുന്ന പടയാളികളെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עָלוּ
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ അടിസ്ഥാന ദിശാസൂചനയായ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ നിലനിർത്തുകയും യാത്രയുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּגְּשׁוּ
  choice: അടുത്തുവന്നു
  rationale: נגשׁ സൂചിപ്പിക്കുന്ന സമീപിക്കൽ വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: അവർ പട്ടണത്തിന് അഭിമുഖമായി എത്തി
  rationale: נֶגֶד എന്നത് പട്ടണത്തിൽ പ്രവേശിച്ചതല്ല, അതിന് എതിർവശത്തോ മുന്നിലോ അഭിമുഖമായോ നിലകൊണ്ടതാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘അഭിമുഖമായി’ ആ സ്ഥാനബന്ധം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന പാളയം സ്ഥാപിക്കുന്ന പ്രവൃത്തിക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: מִצְּפוֹן לָעַי
  choice: ഹായിയുടെ വടക്കുഭാഗത്ത്
  rationale: ഹായി പട്ടണത്തോടുള്ള ഭൂമിശാസ്ത്രപരമായ സ്ഥാനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הַגַּי
  choice: താഴ്വര
  rationale: גַּי എന്നതിന് താഴ്വരയോ മലയിടുക്കോ എന്നർഥം വരാം; സന്ദർഭം കൂടുതൽ സങ്കുചിതമായ ഭൂപ്രകൃതി നിർബന്ധിക്കാത്തതിനാൽ പൊതുവും ഗ്രാഹ്യവുമായ ‘താഴ്വര’ തിരഞ്ഞെടുത്തു.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: അവനും ഹായിക്കും ഇടയിൽ
  rationale: എബ്രായ വ്യഞ്ജനപാഠത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം അതേപടി സംരക്ഷിക്കുന്നു. അത് സ്വാഭാവികമായി യോശുവയെ സൂചിപ്പിക്കാം; കൂട്ടത്തെ ഉദ്ദേശിച്ചുള്ള ഏകവചനപ്രയോഗമായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
