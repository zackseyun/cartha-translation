  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: ml
  text: ഇസ്രായേൽ തങ്ങൾ പിന്തുടർന്ന ആയിനിവാസികളെയെല്ലാം വയലിൽ, വിജനപ്രദേശത്ത് കൊന്നുതീർത്തശേഷം—അവരെല്ലാം വാളിന്റെ വായ്ത്തലയാൽ വീണ് പൂർണമായി ഇല്ലാതാകുന്നതുവരെ[a]—ഇസ്രായേലൊക്കെയും ആയിയിലേക്കു മടങ്ങിച്ചെന്ന് അതിനെ വാളിന്റെ വായ്ത്തലയാൽ പ്രഹരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പൂർണമായി തീരുന്നതുവരെ” / “അവർക്ക് അന്ത്യം വരുന്നതുവരെ.”
    reason: עַד תֻּמָּם എന്ന പ്രയോഗം സമ്പൂർണത, തീർന്നുപോകൽ, അന്ത്യം എന്നിവ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: കൊന്നുതീർത്തപ്പോൾ
  rationale: കാലസൂചകമായ ക്രിയാരൂപവും പ്രവൃത്തി പൂർത്തിയായ ശേഷമുള്ള മടങ്ങിവരവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; וַיְהִי പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ ആഖ്യാനക്രമത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יֹשְׁבֵי הָעַי
  choice: ആയിനിവാസികൾ
  rationale: നഗരത്തിൽ പാർക്കുന്നവരെ സൂചിപ്പിക്കുന്ന കർത്തൃവാചക രൂപത്തിന് ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: വെളിമ്പ്രദേശത്ത്, മരുഭൂമിയിൽവെച്ച്
  rationale: שׂדה നഗരത്തിനു പുറത്തുള്ള തുറന്ന പ്രദേശത്തെയും מִדְבָּר കൃഷിചെയ്യാത്ത വന്യപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; രണ്ടും ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: തങ്ങൾ പിന്തുടർന്ന
  rationale: സ്ഥലവുമായി ബന്ധിപ്പിച്ചുള്ള പിന്തുടരലിനെ മലയാളവാക്യക്രമത്തിൽ മുൻവിശേഷണമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְפִי חֶרֶב
  choice: വാളിന്റെ വായ്ത്തലയാൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാളിന്റെ വായാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത ശൈലി ഉപയോഗിക്കുന്നു.
- source_word: עַד תֻּמָּם
  choice: ഒരാളും ശേഷിക്കാതെ നശിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: സമ്പൂർണതയെയോ അന്ത്യത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; സൈനികസന്ദർഭത്തിലെ പൂർണനാശത്തിന്റെ ശക്തി നിലനിർത്തുന്നു, എന്നാൽ പദത്തിന്റെ മറ്റൊരു നേരിട്ടുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: ഇസ്രായേലൊക്കെയും ആയിയിലേക്കു മടങ്ങിച്ചെന്ന്
  rationale: שוב-ന്റെ മടങ്ങിവരവ് എന്ന അർഥവും ലക്ഷ്യസ്ഥാനമായ ആയിയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: וַיַּכּוּ אֹתָהּ
  choice: അതിനെ ... സംഹരിച്ചു
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം നഗരമായ ആയിയെ സൂചിപ്പിക്കുന്നു. נכה എന്ന പ്രഹര/സംഹാര ക്രിയയുടെ യുദ്ധസന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യുദ്ധവും സമ്പൂർണനാശവും വിവരിക്കുന്ന വാക്യത്തിന്റെ ശക്തി
  choice: കൊല്ലൽ, വാളാൽ വീഴൽ, ശേഷിപ്പില്ലാത്ത നാശം എന്നിവ നേരിട്ട് രേഖപ്പെടുത്തി
  alternative: ‘തോൽപ്പിച്ചു’ പോലുള്ള മൃദുവായ പദങ്ങൾ ഉപയോഗിക്കുകയോ ദൈവിക ന്യായവിധിയെന്ന വ്യാഖ്യാനം ചേർക്കുകയോ ചെയ്യുക
  rationale: മൂലവാക്യത്തിലെ കഠിനമായ യുദ്ധവിവരണം മൃദൂകരിക്കാതെയും വാക്യം പറയാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം കൂട്ടിച്ചേർക്കാതെയും നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനമലയാളം. യുദ്ധത്തിന്റെ കഠിനത മൃദൂകരിച്ചിട്ടില്ല. ‘വാളിന്റെ വായ്ത്തല’ എന്ന പ്രയോഗം എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
