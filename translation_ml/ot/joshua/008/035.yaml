id: JOS.8.35
reference: Joshua 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: ml
  text: മോശ കൽപിച്ച സകലത്തിലും യോശുവ ഇസ്രായേലിന്റെ മുഴുവൻ സഭയുടെയും സ്ത്രീകളുടെയും കുഞ്ഞുങ്ങളുടെയും ഇസ്രായേല്യരുടെ ഇടയിൽ പാർത്തിരുന്ന പരദേശിയുടെയും മുമ്പാകെ വായിക്കാതിരുന്ന ഒരു വാക്കുപോലും ഉണ്ടായിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഇസ്രായേല്യരുടെ ഇടയിൽ നടന്നിരുന്ന പരദേശി.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവരുടെ ഇടയിൽ താമസിച്ചിരുന്ന വിദേശിയാണ്.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: דָבָר
  choice: വാക്ക്
  rationale: തുടർന്നുവരുന്ന ‘വായിച്ചു’ എന്ന ക്രിയയോടു ചേർന്ന്, മോശ കല്പിച്ച വചനങ്ങളുടെ ഒരു ഭാഗവും ഒഴിവായില്ല എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ പശ്ചാത്തലത്തിൽ മോശയുടെ അധികാരപൂർവമായ നിർദേശം വ്യക്തമാക്കുന്നു.
- source_word: קָרָא
  choice: വായിച്ചു
  rationale: നിയമം പൊതുവായി വായിക്കുന്ന സമീപസന്ദർഭത്തിൽ ഏറ്റവും കൃത്യമായ അർഥം ഇതാണ്; ‘പ്രഖ്യാപിച്ചു’ എന്നും അർഥമാകാമെങ്കിലും ഇവിടെ അത്ര നിർദിഷ്ടമല്ല.
- source_word: נֶגֶד
  choice: മുമ്പാകെ
  rationale: കൂടിവന്ന ജനത്തിന്റെ സാന്നിധ്യത്തിൽ നടന്ന പൊതുവായ വായനയെ dignified Malayalam-ൽ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: קְהַל
  choice: സഭ
  rationale: ഔപചാരികമായി കൂടിവന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ പിൽക്കാല സഭാസംഘടനയെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: הַנָּשִׁים
  choice: സ്ത്രീകൾ
  rationale: പൊതുവായ ശ്രവണത്തിൽ സ്ത്രീകളെയും മൂലപാഠം വ്യക്തമായി ഉൾപ്പെടുത്തുന്നത് നിലനിർത്തുന്നു.
- source_word: הַטַּף
  choice: കുഞ്ഞുങ്ങൾ
  rationale: ടഫ് എന്ന പദത്തിന്റെ ചെറിയ കുട്ടികൾ/ആശ്രിതർ എന്ന ആശയത്തിൽ ഇവിടെ പ്രായം കുറഞ്ഞ കുട്ടികളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַגֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന ഇസ്രായേല്യനല്ലാത്ത വ്യക്തിയുടെ സാമൂഹിക-നിയമപരമായ നില സൂചിപ്പിക്കുന്നു; വെറും അപരിചിതൻ എന്ന ആശയം ഒഴിവാക്കുന്നു.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: അവരുടെ ഇടയിൽ പാർത്തിരുന്ന
  rationale: അക്ഷരാർഥമായ ‘നടന്നിരുന്ന’ എന്നതിനെക്കാൾ, സമൂഹത്തിനകത്ത് വസിച്ചിരുന്ന നിലയെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നടക്കുക എന്ന രൂപചിത്രം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: വായിക്കാതിരുന്ന ഒരു വാക്കുപോലും ഉണ്ടായിരുന്നില്ല
  rationale: എബ്രായത്തിലെ ഇരട്ട നിഷേധത്തിന്റെ ഊന്നലും സമ്പൂർണതയും മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടി ഉപദേശം പൊതുവായി കേട്ടവരുടെ വ്യാപ്തി
  choice: മുഴുവൻ ഇസ്രായേൽ സഭയോടൊപ്പം സ്ത്രീകളെയും കുഞ്ഞുങ്ങളെയും അവരുടെയിടയിൽ പാർത്തിരുന്ന പരദേശിയെയും വ്യക്തമായി പരാമർശിച്ചു.
  alternative: ഈ വിഭാഗങ്ങളെ ‘മുഴുവൻ ഇസ്രായേൽ സഭ’ എന്ന പൊതുപദത്തിൽ മാത്രം ഉൾക്കൊള്ളിക്കുക.
  rationale: മൂലപാഠം ഈ വിഭാഗങ്ങളെ പ്രത്യേകം എണ്ണിപ്പറയുന്നതിനാൽ അവരുടെ വ്യക്തമായ ഉൾപ്പെടുത്തൽ വിവർത്തനത്തിലും സംരക്ഷിക്കുന്നു.
- issue: הַהֹלֵךְ എന്ന പദത്തിന്റെ രൂപചിത്രവും സന്ദർഭാർഥവും
  choice: പ്രധാനപാഠത്തിൽ ‘പാർത്തിരുന്ന’ എന്ന് നൽകി സാമൂഹിക താമസസ്ഥിതി വ്യക്തമാക്കി.
  alternative: ‘അവരുടെ ഇടയിൽ നടന്നിരുന്ന’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം.
  rationale: എബ്രായ പങ്കാളിക്രിയയുടെ ‘നടക്കുക’ എന്ന രൂപം യഥാർഥമാണെങ്കിലും ഇവിടെ ഗേറിന്റെ സമൂഹത്തിനകത്തെ സ്ഥിരതാമസമാണ് ഉദ്ദേശ്യം; അക്ഷരാർഥരൂപം മലയാളത്തിൽ കേവല ശാരീരിക സഞ്ചാരമായി തെറ്റിദ്ധരിക്കാം. അതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സമന്വയിപ്പിച്ചു. എബ്രായത്തിലെ ഊന്നലുള്ള ഇരട്ട നിഷേധം ‘ഒരു വാക്കുപോലും ... ഉണ്ടായിരുന്നില്ല’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നിലനിർത്തി. പട്ടികയിലെ എല്ലാ വിഭാഗങ്ങളുടെയും വ്യക്തമായ ഉൾപ്പെടുത്തൽ സംരക്ഷിച്ചു.
