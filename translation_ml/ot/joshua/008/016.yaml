translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ കർമണി/നിഫാൽ ഭാവവും ‘അവരെ’ എന്നതിൽനിന്ന് ‘യോശുവയെ’ എന്നതിലേക്കുള്ള ശ്രദ്ധാമാറ്റവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
