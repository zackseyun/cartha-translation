id: JOS.8.16
reference: Joshua 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזָּעֲק֗וּ כָּל הָ/עָם֙ אֲשֶׁ֣ר ב/עיר לִ/רְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַֽ/יִּרְדְּפוּ֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/יִּנָּתְק֖וּ מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: ml
  text: നഗരത്തിലുണ്ടായിരുന്ന ജനമെല്ലാം അവരെ പിന്തുടരാൻ വിളിച്ചുകൂട്ടപ്പെട്ടു[a]. അവർ യോശുവയെ പിന്തുടർന്നു; അങ്ങനെ അവർ നഗരത്തിൽനിന്ന് അകറ്റപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിലവിളിച്ചു.” എബ്രായക്രിയയ്ക്ക് നിലവിളിക്കുക എന്ന അർഥം വരാമെങ്കിലും, ഇവിടെ പിന്തുടരുന്നതിനായി വിളിച്ചുകൂട്ടുക അഥവാ അണിനിരത്തുക എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നഗരത്തിൽനിന്ന് വേർപെട്ടു” അല്ലെങ്കിൽ “നഗരത്തിൽനിന്ന് വിച്ഛേദിക്കപ്പെട്ടു.” അവരെ പുറത്തേക്കു വലിച്ചുകൊണ്ടുപോയതിനാൽ നഗരത്തിൽനിന്ന് വേർപെട്ടുവെന്ന ആശയം എബ്രായപദത്തിനുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: വിളിച്ചുകൂട്ടപ്പെട്ടു
  rationale: זעק എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ വെറും നിലവിളിയേക്കാൾ, പിന്തുടരുന്നതിനായി ആളുകളെ വിളിച്ചുകൂട്ടുകയോ അണിനിരത്തുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. കർമണി രൂപവും സൈനികസന്ദർഭവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: നഗരത്തിലുണ്ടായിരുന്ന ജനമെല്ലാം
  rationale: עָם എന്നത് പൊതുവായി ‘ജനം’ എന്നും സന്ദർഭത്തിൽ ‘സൈനികർ/ആളുകൾ’ എന്നും വരാം. എബ്രായം പറയുന്നതിലധികമായി ‘പുരുഷന്മാർ’ എന്നു പരിമിതപ്പെടുത്താതെ സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: അവരെ പിന്തുടരാൻ
  rationale: רדף + אחרי പിന്തുടരുക എന്ന പതിവുശൈലിയാണ്; ബഹുവചന സർവനാമം മാറ്റാതെ നിലനിർത്തി.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: അവർ യോശുവയെ പിന്തുടർന്നു
  rationale: മുൻപത്തെ ബഹുവചനമായ ‘അവരെ’ എന്നതിൽനിന്ന് കഥ യോശുവയിലേക്ക് ശ്രദ്ധ മാറ്റുന്നു. ആ മാറ്റം മിനുക്കിക്കളയാതെ അതേപടി സൂക്ഷിച്ചു.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: അവർ നഗരത്തിൽനിന്ന് അകറ്റപ്പെട്ടു
  rationale: נתק എന്ന നിഫാൽ രൂപത്തിന് വലിച്ചകറ്റപ്പെടുക, വേർപെടുക, വിച്ഛേദിക്കപ്പെടുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പിന്തുടർന്നവർ നഗരത്തിന്റെ സംരക്ഷണസ്ഥാനത്തുനിന്ന് പുറത്തേക്കു നയിക്കപ്പെട്ട തന്ത്രപരമായ ഫലം ‘അകറ്റപ്പെട്ടു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
