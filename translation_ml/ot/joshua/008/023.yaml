id: JOS.8.23
reference: Joshua 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת מֶ֥לֶךְ הָ/עַ֖י תָּ֣פְשׂוּ חָ֑י וַ/יַּקְרִ֥בוּ אֹת֖/וֹ אֶל יְהוֹשֻֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: ml
  text: എന്നാൽ ഹായിയിലെ രാജാവിനെ അവർ ജീവനോടെ പിടികൂടി യോശുവയുടെ അടുക്കൽ കൊണ്ടുവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹായിയിലെ രാജാവിനെ അവർ ജീവനോടെ പിടികൂടി യോശുവയുടെ അടുക്കൽ കൊണ്ടുവന്നു.’
    reason: വാക്യാരംഭത്തിലെ וְ എന്ന സംയോജകത്തിന് നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്ന ‘എന്നാൽ’ എന്നതിനു പകരം, മലയാളത്തിൽ പ്രത്യേകം സംയോജകം ചേർക്കാതെ തുടർപ്രവൃത്തിയായി വിവർത്തനം ചെയ്യാനും കഴിയും.
lexical_decisions:
- source_word: וְ/אֶת
  choice: എന്നാൽ
  rationale: വാവ് ഇവിടെ തുടർന്നുള്ള പ്രവൃത്തിയെ അവതരിപ്പിക്കുമ്പോൾ, ചുറ്റുമുള്ള കൂട്ടക്കൊലയുടെ പശ്ചാത്തലത്തിൽ രാജാവിനെ ജീവനോടെ പിടിച്ചതിനോടുള്ള നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കാം. അതിനാൽ സ്വാഭാവികമായ വിവരണപ്രവാഹത്തിൽ ‘എന്നാൽ’ സ്വീകരിച്ചു; ‘അവർ’ എന്നു നേരിട്ട് തുടങ്ങുന്നതും സാധ്യമാണ്.
- source_word: מֶלֶךְ הָעַי
  choice: ഹായിയിലെ രാജാവിനെ
  rationale: എബ്രായ നിർമാണബന്ധത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഹായിയിലെ രാജാവ്’ എന്നു നൽകി; കർമവിഭക്തി സന്ദർഭാനുസൃതമായി ചേർത്തു.
- source_word: תָּפְשׂוּ
  choice: പിടികൂടി
  rationale: സൈനികസന്ദർഭത്തിൽ ഒരാളെ കൈവശപ്പെടുത്തി തടവിലാക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חָי
  choice: ജീവനോടെ
  rationale: രാജാവ് കൊല്ലപ്പെടാതെ പിടിക്കപ്പെട്ടു എന്ന വിധേയവിശേഷണത്തിന്റെ ആശയം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: וַיַּקְרִבוּ
  choice: അടുക്കൽ കൊണ്ടുവന്നു
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: യോശുവയുടെ അടുക്കൽ
  rationale: യോശുവയാണ് കൊണ്ടുവരലിന്റെ ലക്ഷ്യസ്ഥാനം എന്നത് വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ന്യായവിധിയുടെയോ ഔപചാരിക സമർപ്പണത്തിന്റെയോ ആശയം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘അടുക്കൽ കൊണ്ടുവന്നു’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ സമീപത്തേക്ക് കൊണ്ടുവരുന്ന ദിശാഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
