  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ആവർത്തിച്ചുള്ള എബ്രായ സൂചകസർവനാമങ്ങൾ സന്ദർഭത്തിലെ സേനകളുടെ പേരുകളാൽ വ്യക്തമാക്കിയിട്ടുണ്ട്; എന്നാൽ അവസാന ഏകവചനപ്രയോഗത്തിന്റെ യഥാർഥ രൂപപരമായ സംഘർഷം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
