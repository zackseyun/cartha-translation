  text: וְ/אֵ֨לֶּה יָצְא֤וּ מִן הָ/עִיר֙ לִ/קְרָאתָ֔/ם וַ/יִּֽהְי֤וּ לְ/יִשְׂרָאֵל֙ בַּ/תָּ֔וֶךְ אֵ֥לֶּה מִ/זֶּ֖ה וְ/אֵ֣לֶּה מִ/זֶּ֑ה וַ/יַּכּ֣וּ אוֹתָ֔/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֥יד וּ/פָלִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: ml
  text: പതിയിരിപ്പുകാർ നഗരത്തിൽനിന്ന് അവരുടെ നേരെ പുറപ്പെട്ടു. അങ്ങനെ ആയിയിലെ ആളുകൾ ഇസ്രായേല്യരുടെ നടുവിലായി; പതിയിരിപ്പുകാർ ഒരു വശത്തും മറ്റു ഇസ്രായേല്യർ മറുവശത്തും അവരെ വളഞ്ഞു[a]. ഇസ്രായേല്യർ അവരെ അടിച്ചുവീഴ്ത്തി; അവരിൽ ശേഷിച്ചവനോ രക്ഷപ്പെട്ടവനോ ആരും ഉണ്ടായില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഇവർ ഈ വശത്തും അവർ ആ വശത്തും.” നഗരത്തിൽനിന്ന് പുറപ്പെട്ട പതിയിരിപ്പുകാരും മറ്റേ ഇസ്രായേൽസേനയും ആയിയിലെ ആളുകളെ ഇരുവശത്തുനിന്നും വളഞ്ഞുവെന്നാണ് ആശയം.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിലെ അവസാന പ്രയോഗത്തിൽ ക്രിയ ഏകവചനത്തിലും സർവനാമം ഏകവചനത്തിലുമാണ്: അക്ഷരാർഥത്തിന് അടുത്തായി, “അവൻ അവന് ശേഷിച്ചവനെയോ രക്ഷപ്പെട്ടവനെയോ വിട്ടില്ല.” സന്ദർഭത്തിൽ, ആയിയിലെ ആളുകളിൽ ആരും ജീവനോടെ ശേഷിക്കാനോ രക്ഷപ്പെടാനോ ഇടയായില്ല എന്നാണ് അർഥം.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: പതിയിരിപ്പുകാർ
  rationale: മുൻസന്ദർഭത്തിൽ നഗരത്തിൽ പ്രവേശിച്ച പതിയിരിപ്പുസേനയെയാണ് ‘ഇവർ’ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അവ്യക്തമായ സർവനാമം ഒഴിവാക്കി സന്ദർഭസൂചിതമായ ആളുകളെ വ്യക്തമാക്കുന്നു.
- source_word: יָצְאוּ מִן הָעִיר לִקְרָאתָם
  choice: നഗരത്തിൽനിന്ന് അവരുടെ നേരെ പുറപ്പെട്ടു
  rationale: יצא എന്നതിന്റെ പുറപ്പെടുക എന്ന അർഥവും לקראת എന്നതിലെ നേരിടാനുള്ള ഗതിയും നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിലെ ശത്രുത പ്രത്യേകമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: അങ്ങനെ ആയിപട്ടാളം ഇസ്രായേല്യരുടെ നടുവിലായി
  rationale: തന്ത്രപരമായ ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സന്ദർഭപ്രകാരം ആയിപട്ടാളം എന്നു പറയുന്നു.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: ഇസ്രായേല്യർ ഒരു വശത്തും മറ്റുള്ളവർ മറുവശത്തും അവരെ വളഞ്ഞു
  rationale: രണ്ടു വശങ്ങളിൽനിന്നുള്ള ഇസ്രായേൽസേനയുടെ സമ്മർദം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּכּוּ אוֹתָם
  choice: ഇസ്രായേല്യർ അവരെ വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിൽ נכה സൂചിപ്പിക്കുന്ന മാരകമായ പരാജയം ‘വെട്ടിവീഴ്ത്തി’ സ്വാഭാവികമായും ശക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׂרִיד וּפָלִיט
  choice: ശേഷിച്ചവനോ രക്ഷപ്പെട്ടവനോ
  rationale: ജീവനോടെ ശേഷിക്കുന്നവൻ, രക്ഷപ്പെട്ടു പോകുന്നവൻ എന്നീ വ്യത്യസ്ത ആശയങ്ങൾ രണ്ടും നിലനിർത്തുന്നു.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: അവരിൽ ... ആരും ഉണ്ടായില്ല
  rationale: എബ്രായത്തിലെ അസാധാരണമായ ഏകവചന കർത്താവും പരോക്ഷകർമവും മലയാളത്തിൽ യാന്ത്രികമായി പകർത്താതെ, പ്രവർത്തനത്തിന്റെ ഫലം സ്വാഭാവികമായി പറയുന്നു; രൂപപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
