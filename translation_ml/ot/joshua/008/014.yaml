  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: ml
  text: അങ്ങനെ, ആയിയുടെ രാജാവ് അതു കണ്ടപ്പോൾ, അവർ തിടുക്കപ്പെട്ടു അതിരാവിലെ എഴുന്നേറ്റു. നഗരത്തിലെ പുരുഷന്മാർ യിസ്രായേലിനെ യുദ്ധത്തിനായി നേരിടാൻ പുറപ്പെട്ടു—രാജാവും അവന്റെ സകലജനവും—അരാബയ്ക്കു[a] മുന്നിലുള്ള നിശ്ചയിച്ച സ്ഥലത്തേക്ക്. എന്നാൽ നഗരത്തിന്റെ പിന്നിൽ തനിക്കെതിരെ ഒരു പതിയിരിപ്പ് ഉണ്ടെന്ന് അവൻ അറിഞ്ഞിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരുഭൂമിസമതലം.’ അരാബ എന്ന ഹീബ്രുപദം അരാബ പ്രദേശത്തെയോ പൊതുവായി വരണ്ട സമതലത്തെയോ പുൽവെളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: അപ്പോൾ, ... കണ്ടപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവമാറ്റവും കാലസാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ക്രിയയുടെ പരോക്ഷ കർമത്തെ സന്ദർഭാനുസൃതമായി ‘അതു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: അവർ തിടുക്കത്തിൽ അതിരാവിലെ എഴുന്നേറ്റു
  rationale: രണ്ട് ബഹുവചനക്രിയകളുടെയും ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אַנְשֵׁי הָעִיר
  choice: നഗരത്തിലെ പുരുഷന്മാർ
  rationale: സൈനികസന്ദർഭത്തിലും ഹീബ്രുവിലെ ലിംഗസൂചനയിലും യോജിക്കുന്ന കൃത്യമായ വിവർത്തനം.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: യിസ്രായേലിനെ യുദ്ധത്തിൽ നേരിടാൻ
  rationale: ‘എതിരേൽക്കുക/കണ്ടുമുട്ടുക’ എന്ന അടിസ്ഥാനാർഥം യുദ്ധസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന ശത്രുതാപരമായ നേരിടലായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוּא וְכָל עַמּוֹ
  choice: രാജാവും അവന്റെ സകലജനവും ഉൾപ്പെടെ
  rationale: ‘അവനും അവന്റെ സകലജനവും’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘സൈന്യം’ എന്ന് ഹീബ്രുവിലില്ലാത്ത പ്രത്യേകീകരണം വരുത്തുന്നില്ല.
- source_word: לַמּוֹעֵד
  choice: നിശ്ചയിച്ച സ്ഥലത്തേക്ക്
  rationale: מוֹעֵד സമയം അല്ലെങ്കിൽ സ്ഥലം സൂചിപ്പിക്കാമെങ്കിലും, പുറപ്പെടലും പിന്നാലെയുള്ള ഭൂമിശാസ്ത്രസൂചനയും ഇവിടെ സ്ഥലാർഥത്തെ കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നു.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: അരാബയ്ക്കു മുന്നിലുള്ള
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചനയും הָעֲרָבָה എന്ന ഭൂമിശാസ്ത്രനാമവും സംരക്ഷിക്കുന്നു.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: നഗരത്തിന്റെ പിന്നിൽ തനിക്കെതിരെ ഒരു പതിയിരിപ്പുസംഘം
  rationale: אֹרֵב എന്ന ഏകവചന കൂട്ടാർഥത്തെ മലയാളത്തിൽ വ്യക്തമായി ‘പതിയിരിപ്പുസംഘം’ എന്നു നൽകുകയും לוֹ എന്നത് ‘തനിക്കെതിരെ’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
