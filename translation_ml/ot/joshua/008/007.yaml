id: JOS.8.7
reference: Joshua 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: ml
  text: അപ്പോൾ നിങ്ങൾ പതിയിരുന്ന സ്ഥലത്തുനിന്ന് എഴുന്നേറ്റ് നഗരം കൈവശമാക്കണം[a]; നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ അതിനെ നിങ്ങളുടെ കയ്യിൽ ഏല്പിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നഗരം പിടിച്ചടക്കണം.” എബ്രായക്രിയ സൈനികമായി പിടിച്ചെടുക്കുന്നതിനു പുറമേ കൈവശപ്പെടുത്തുക എന്ന അർഥവും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ നിർദേശാത്മക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മറഞ്ഞിരുന്ന നിലയിൽനിന്നുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: מֵהָאוֹרֵב
  choice: പതിയിരുന്ന സ്ഥലത്തുനിന്ന്
  rationale: אֹרֵב ഇവിടെ പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്ന സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്ഥലം വ്യക്തമായി അറിയിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: וְהוֹרַשְׁתֶּם
  choice: കൈവശമാക്കണം
  rationale: ירשׁ എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ഈ സന്ദർഭത്തിൽ വെറും സൈനിക പിടിച്ചടക്കൽ മാത്രമല്ല, നഗരം അധികാരത്തിലാക്കുക/കൈവശപ്പെടുത്തുക എന്ന അർഥവും വഹിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: നിർദ്ദിഷ്ടമായ עִיר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവിക പരിഭാഷ.
- source_word: וּנְתָנָהּ
  choice: അതിനെ ... ഏല്പിക്കും
  rationale: നിർദേശങ്ങളുടെ തുടർച്ചയിൽ വരുന്ന പൂർണക്രിയ ഉറപ്പുള്ള ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഭാവികാലം ആ ഉറപ്പ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയമുള്ള സംയുക്തരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּיֶדְכֶם
  choice: നിങ്ങളുടെ കയ്യിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുകയും മലയാളത്തിൽ മനസ്സിലാകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമമായി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: וְהוֹרַשְׁתֶּם എന്നതിലെ കൈവശാവകാശവും സൈനിക പിടിച്ചടക്കലും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: കൈവശമാക്കണം
  alternative: പിടിച്ചടക്കണം
  rationale: ക്രിയയുടെ കൈവശപ്പെടുത്തൽസംബന്ധിയായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സൈനികസന്ദർഭത്തിൽ സാധ്യമായ കൂടുതൽ സങ്കുചിതമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സൈനിക നിർദേശത്തിന്റെ വ്യക്തത നിലനിർത്തിക്കൊണ്ട് എബ്രായ പ്രയോഗങ്ങളിലെ കൈവശാവകാശത്തിന്റെ അർഥവും ‘കയ്യിൽ ഏല്പിക്കുക’ എന്ന ദൃശ്യരൂപവും സംരക്ഷിച്ചു.
