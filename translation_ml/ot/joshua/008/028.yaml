  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ ഹായിയെ ചുട്ടുകളഞ്ഞ്, അതിനെ ദീർഘകാലം നിലനിൽക്കുന്ന ഒരു അവശിഷ്ടക്കൂമ്പാരമാക്കി[a]; ഇന്നുവരെയും അതു പാഴ്നിലമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നേക്കുമുള്ള ഒരു അവശിഷ്ടക്കൂമ്പാരം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം ദീർഘമായോ അനിശ്ചിതമായോ കാലയളവിനെ സൂചിപ്പിക്കാം; അത് പലപ്പോഴും “എന്നേക്കും” അല്ലെങ്കിൽ “ശാശ്വതമായ” എന്നു പരിഭാഷപ്പെടുത്തപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: ചുട്ടുകളഞ്ഞ്
  rationale: שׂרף തീകൊണ്ട് ദഹിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; നഗരത്തിന്റെ സമ്പൂർണ നശീകരണം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചുട്ടുകളഞ്ഞ്’ വ്യക്തമാക്കുന്നു.
- source_word: הָעָי
  choice: ഹായി
  rationale: സ്ഥലനാമമായതിനാൽ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത, മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപം സ്വീകരിച്ചു.
- source_word: וַיְשִׂימֶהָ
  choice: അതിനെ … ആക്കി
  rationale: שׂים എന്ന ക്രിയയുടെ ഫലസൂചക അർഥം തുടർന്നുവരുന്ന നാമപദങ്ങളോടൊപ്പം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תֵּל
  choice: നാശക്കൂമ്പാരം
  rationale: תֵּל നശിപ്പിക്കപ്പെട്ട പട്ടണത്തിന്റെ ഉയർന്നുകിടക്കുന്ന അവശിഷ്ടക്കൂമ്പാരത്തെ സൂചിപ്പിക്കുന്നു; ‘കൂമ്പാരം’ മാത്രം നൽകുന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עוֹלָם
  choice: ശാശ്വതമായ
  rationale: עוֹלָם ദീർഘമായോ അനിശ്ചിതമായോ നിലനിൽപ്പിനെ സൂചിപ്പിക്കാം; പദത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘ശാശ്വതമായ’ ഉപയോഗിച്ചു, എന്നാൽ കാലപരിധിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: שְׁמָמָה
  choice: ശൂന്യമായി കിടക്കുന്നു
  rationale: നാശത്തിനുശേഷമുള്ള ജനവാസരഹിതവും പാഴുമായ അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: വിവരകർത്താവിന്റെ കാലംവരെ ആ അവസ്ഥ തുടർന്നുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
