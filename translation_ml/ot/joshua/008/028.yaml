translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ഹീബ്രുവിലെ രണ്ട് ഫലവിവരണങ്ങളെ മലയാളത്തിൽ ‘നാശക്കൂമ്പാരമാക്കി; ... ശൂന്യമായി കിടക്കുന്നു’ എന്നു വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
