revisions:
- from: അങ്ങനെ യോശുവ ഹായിയെ ചുട്ടുകളഞ്ഞ് അതിനെ ശാശ്വതമായ ഒരു നാശക്കൂമ്പാരമാക്കി[a]; അത് ഇന്നുവരെയും ശൂന്യമായി കിടക്കുന്നു.
  to: അങ്ങനെ യോശുവ ഹായിയെ ചുട്ടുകളഞ്ഞ്, അതിനെ ദീർഘകാലം നിലനിൽക്കുന്ന ഒരു അവശിഷ്ടക്കൂമ്പാരമാക്കി[a]; ഇന്നുവരെയും അതു പാഴ്നിലമാണ്.
