  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: ml
  text: അങ്ങനെ യോശുവയും യുദ്ധജനമൊക്കെയും ആയിക്കെതിരെ കയറിച്ചെല്ലാൻ[a] എഴുന്നേറ്റു. യോശുവ മുപ്പതിനായിരം പരാക്രമശാലികളായ യോദ്ധാക്കളെ[b] തിരഞ്ഞെടുത്ത് രാത്രിയിൽ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആയിയിലേക്കു കയറിച്ചെല്ലാൻ.’ ഇവിടെ ‘കയറിച്ചെല്ലുക’ എന്ന എബ്രായ പ്രയോഗം ദിശയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് നഗരത്തിനെതിരെയുള്ള സൈനികനീക്കമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വീരശൂരന്മാരായ പുരുഷന്മാരെ.’ എബ്രായ പ്രയോഗം കഴിവും ശക്തിയും ധീരതയും ഉള്ള യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: പുറപ്പെട്ടു
  rationale: קום എന്ന ക്രിയ ഇവിടെ പ്രവർത്തനം ആരംഭിക്കുന്ന കഥാക്രമത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥമായ ‘എഴുന്നേറ്റു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘പുറപ്പെട്ടു’ ഉപയോഗിച്ചു.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: യുദ്ധത്തിനുള്ള ജനമെല്ലാം
  rationale: ‘യുദ്ധത്തിന്റെ ജനമെല്ലാം’ എന്ന അക്ഷരാർഥത്തെ മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് עַם എന്നതിന്റെ സമൂഹവാചക സ്വഭാവം നിലനിർത്തുന്നു; ‘സൈന്യം’ എന്നു സ്ഥാപനപരമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לַעֲלוֹת הָעָי
  choice: ആയിക്കെതിരെ കയറിച്ചെല്ലാൻ
  rationale: עלה എന്നതിലെ ‘കയറുക’ എന്ന ദിശാസൂചനയും സൈനികസന്ദർഭത്തിലെ ശത്രുതാപരമായ നീക്കവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: הָעָי
  choice: ആയി
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּבְחַר
  choice: തിരഞ്ഞെടുത്ത്
  rationale: בחר എന്നതിന്റെ നേരായതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: മുപ്പതിനായിരം
  rationale: തുടർന്നുള്ള ‘യോദ്ധാക്കളെ’ എന്ന പുരുഷവാചക നാമത്തോടൊപ്പം സംഖ്യ സ്വാഭാവികമായി ചേർത്തു; എണ്ണം മാറ്റമില്ലാതെ നിലനിർത്തി.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: പ്രഗല്ഭരായ യോദ്ധാക്കൾ
  rationale: ശക്തിയും യുദ്ധവൈദഗ്ധ്യവും ധീരതയും സൂചിപ്പിക്കുന്ന സൈനികപ്രയോഗം; പഴഞ്ചൻ ശൈലിയില്ലാതെ ആധുനിക മലയാളത്തിൽ അർഥശക്തി നൽകുന്നു.
- source_word: וַיִּשְׁלָחֵם
  choice: അയച്ചു
  rationale: שלח എന്ന ക്രിയയും ബഹുവചന കർമപ്രത്യയവും നേരായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: കാലസൂചകമായ ക്രിയാവിശേഷണപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം.
