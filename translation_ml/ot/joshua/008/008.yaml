id: JOS.8.8
reference: Joshua 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: ml
  text: നിങ്ങൾ നഗരം പിടിച്ചുകഴിയുമ്പോൾ, നഗരത്തിനു തീകൊളുത്തണം. യഹോവയുടെ വചനപ്രകാരം നിങ്ങൾ ചെയ്യണം.[a] നോക്കൂ, ഞാൻ നിങ്ങളോടു കല്പിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹോവയുടെ കല്പനപ്രകാരം അങ്ങനെ ചെയ്യണം.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “യഹോവയുടെ വചനപ്രകാരം നിങ്ങൾ ചെയ്യണം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: നിങ്ങൾ … പിടിച്ചുകഴിയുമ്പോൾ
  rationale: ഈ ഘടന അടുത്ത പ്രവൃത്തിക്കു മുമ്പായി പൂർത്തിയാകുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘പിടിച്ചുകഴിയുമ്പോൾ’ എന്നത് കാലബന്ധവും സൈനികസന്ദർഭത്തിലെ നഗരം കൈവശപ്പെടുത്തലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָעִיר
  choice: നഗരം
  rationale: സൈനികകഥാസന്ദർഭത്തിൽ עִיר എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: നഗരത്തിന് തീയിടണം
  rationale: יצת എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം തീ കൊളുത്തുക എന്ന കാരണാർത്ഥം നൽകുന്നു. ‘തീയിടണം’ ആ അർത്ഥവും കല്പനയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനപ്രകാരം
  rationale: דבר എന്നതിന്റെ ‘വചനം/കാര്യം’ എന്ന അടിസ്ഥാനാർത്ഥം സംരക്ഷിക്കുന്നു; ഇവിടെ ദൈവിക നിർദേശം ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ ‘കല്പനപ്രകാരം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യണം
  rationale: അപൂർണ്ണക്രിയ ഇവിടെ നിർദേശാത്മകമായി പ്രവർത്തിക്കുന്നു. ‘ചെയ്യണം’ ആ കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന കല്പനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: ഞാൻ നിങ്ങളോടു കല്പിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ കല്പന ഇപ്പോഴും ബാധകമാണെന്ന സന്ദർഭഭാവം മലയാളത്തിലെ പൂർണവർത്തമാനരൂപം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: כִּדְבַר എന്നതിലെ ‘വചനം’/‘കല്പന’ അർത്ഥസാധ്യത
  choice: വചനപ്രകാരം
  alternative: കല്പനപ്രകാരം
  rationale: ‘വചനം’ മൂലപദത്തിന്റെ വിശാലവും നേരിട്ടുള്ളതുമായ അർത്ഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് കല്പനയെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ബഹുവചന അഭിസംബോധന നിലനിർത്തി; കല്പനാഭാവത്തിന് സ്വാഭാവികമായ ‘ചെയ്യണം’, ‘തീയിടണം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
