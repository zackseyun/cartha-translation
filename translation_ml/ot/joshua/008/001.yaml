source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ യോശുവയോടു പറഞ്ഞു: “ഭയപ്പെടരുത്; മനസ്സുതളരരുത്. യോദ്ധാക്കളെയെല്ലാം[a] നിന്നോടൊപ്പം കൂട്ടുക; എഴുന്നേൽക്കുക; ഹായിയിലേക്കു കയറിച്ചെല്ലുക. ഇതാ, ഹായിയിലെ രാജാവിനെയും അവന്റെ ജനത്തെയും നഗരത്തെയും ദേശത്തെയും ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “യുദ്ധത്തിന്റെ ജനത്തെയെല്ലാം”; അഥവാ “സൈന്യത്തെ മുഴുവനും.” ഈ ഹീബ്രു പ്രയോഗം പോരാട്ടസേനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ഉച്ചരിക്കാവുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: ഭയപ്പെടരുത്; മനസ്സുതളരരുത്
  rationale: ആദ്യ വിലക്ക് ഭയത്തെയും രണ്ടാമത്തേത് ആന്തരികമായി തകർന്നോ നിരുത്സാഹപ്പെട്ടോ പോകുന്നതിനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ രണ്ടിന്റെയും വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: קַח עִמְּךָ אֵת כָּל עַם הַמִּלְחָמָה
  choice: യോദ്ധാക്കളെയെല്ലാം നിന്നോടൊപ്പം കൂട്ടിക്കൊണ്ട്
  rationale: עִמְּךָ എന്ന ‘നിന്നോടൊപ്പം’ എന്ന ഘടകം തുറന്നുവെക്കുകയും, ‘യുദ്ധത്തിന്റെ ജനം’ എന്ന ഹീബ്രു പ്രയോഗത്തെ സന്ദർഭാനുസൃതമായി യുദ്ധസേനയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്തു.
- source_word: וְקוּם עֲלֵה הָעָי
  choice: എഴുന്നേറ്റ് ഹായിയിലേക്കു കയറിച്ചെല്ലുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളുടെയും ക്രമവും അടിയന്തരതയും നിലനിർത്തുന്നു; עָלָה ഇവിടെ ഹായിയിലേക്കുള്ള സൈനിക മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: רְאֵה
  choice: ഇതാ
  rationale: വെറും കാഴ്ചയ്ക്കുള്ള ആജ്ഞയെന്നതിലുപരി, തുടർന്നുവരുന്ന ദൈവിക ഉറപ്പിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נָתַתִּי בְיָדְךָ
  choice: ഞാൻ നിന്റെ കയ്യിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഹീബ്രു പൂർണ്ണക്രിയ ദൈവവചനത്തിലെ ഉറപ്പിനെ പൂർത്തിയായ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു; ‘കയ്യിൽ’ എന്ന അധികാരത്തിന്റെയും നിയന്ത്രണത്തിന്റെയും രൂപകം നിലനിർത്തി.
- source_word: מֶלֶךְ הָעַי וְאֶת עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: ഹായിയിലെ രാജാവിനെയും അവന്റെ ജനത്തെയും നഗരത്തെയും ദേശത്തെയും
  rationale: രാജാവ്, അവന്റെ ജനം, നഗരം, ദേശം എന്ന ഹീബ്രു പട്ടികാക്രമവും രാജാവിനെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ പ്രത്യയവും സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു പൊതുപദവിയല്ല, ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പാരമ്പര്യരൂപത്തിനുപകരം മൂലനാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തോട് അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: כָּל עַם הַמִּלְחָמָה എന്ന സൈനിക പ്രയോഗത്തിന്റെ പരിധി
  choice: യോദ്ധാക്കളെയെല്ലാം
  alternative: യുദ്ധജനത്തെയെല്ലാം / സൈന്യത്തെ മുഴുവനും
  rationale: ഇത് എല്ലാ നിവാസികളെയും അല്ല, പോരാട്ടസേനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യോദ്ധാക്കൾ’ വ്യക്തികളടങ്ങുന്ന സേനയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എന്നാൽ മൂലത്തിലെ കൂട്ടായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ച ആജ്ഞകളും പട്ടികാക്രമവും ദൈവിക ഉറപ്പിന്റെ പൂർത്തീകരണഭാവവും കഴിയുന്നത്ര നിലനിർത്തി.
