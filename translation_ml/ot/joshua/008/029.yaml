  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: ml
  text: അവൻ ഹായിയുടെ രാജാവിനെ സന്ധ്യാസമയംവരെ ഒരു മരത്തിൽ തൂക്കിയിട്ടു.[a] സൂര്യൻ അസ്തമിച്ചപ്പോൾ[b] യോശുവ കല്പനകൊടുത്തു; അവർ അവന്റെ ശവം മരത്തിൽനിന്ന് ഇറക്കി നഗരവാതിലിന്റെ പ്രവേശനസ്ഥലത്ത് എറിഞ്ഞു. അവന്റെമേൽ അവർ ഒരു വലിയ കൽക്കൂമ്പാരം കൂട്ടി; അത് ഇന്നുവരെയും അവിടെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തൂക്കി’; എബ്രായക്രിയയുടെ അർഥം ‘തൂക്കുക, തൂക്കിയിടുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘സൂര്യൻ വന്നപ്പോൾ’; ഈ എബ്രായ പ്രയോഗം സൂര്യൻ അസ്തമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: idiom_clarification
lexical_decisions:
- source_word: תָּלָה
  choice: തൂക്കിയിട്ടു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘തൂക്കുക/തൂക്കിയിടുക’ എന്നതാണ്. മരണവിധി നടപ്പാക്കിയ രീതി അനാവശ്യമായി ‘കുത്തിനാട്ടുക’ എന്നു പ്രത്യേകീകരിക്കാതെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: הָעֵץ
  choice: ഒരു മരത്തിൽ
  rationale: עֵץ എന്നത് സാധാരണയായി ‘മരം’ എന്നാണ്; ഇവിടെ ഒരു മരമോ മരനിർമിത ഘടനയോ ഉദ്ദേശിക്കാമെങ്കിലും ‘മരം’ എന്ന ലളിതമായ രൂപം മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: עַד עֵת הָעָרֶב
  choice: സന്ധ്യാസമയംവരെ
  rationale: കാലസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിച്ചപ്പോൾ
  rationale: സൂര്യന്റെ അസ്തമയം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נִבְלָתוֹ
  choice: അവന്റെ ശവം
  rationale: മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ കാഠിന്യം ‘ശവം’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיַּשְׁלִיכוּ אוֹתָהּ
  choice: എറിഞ്ഞു
  rationale: പ്രയോഗത്തിലെ ശക്തി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളക്രിയ; സ്ത്രീലിംഗ പ്രത്യയം נְבֵלָה എന്ന നാമത്തെയാണ് സൂചിപ്പിക്കുന്നത്, മലയാളത്തിൽ ‘ശവം’ തന്നെയാണ് സ്വാഭാവികമായി ആവർത്തിക്കുന്നത്.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: പട്ടണവാതിലിന്റെ പ്രവേശനസ്ഥലത്ത്
  rationale: ‘തുറവ്/പ്രവേശനം’ എന്നും ‘പട്ടണവാതിൽ’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: ഒരു വലിയ കൽക്കൂമ്പാരം
  rationale: കല്ലുകളുടെ വലിയ കൂമ്പാരം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് ലളിതവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും അവിടെയുണ്ട്
  rationale: കഥാകൃത്തിന്റെ കാലംവരെ കൂമ്പാരം നിലനിന്നുവെന്ന അർഥം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന് ഏകവചനത്തിൽ നൽകി; സന്ദർഭത്തിൽ യോശുവയാണ് സൂചിത കർത്താവ്
  alternative: ‘അവർ ഹായിപട്ടണത്തിലെ രാജാവിനെ തൂക്കിയിട്ടു’
  rationale: എബ്രായത്തിൽ വ്യക്തമായി പേരുപറയാത്ത മൂന്നാംപുരുഷ ഏകവചന ക്രിയയാണ്. തുടർന്നുള്ള വാക്യത്തിൽ യോശുവയെ പേരെടുത്തുപറയുന്നതിനാൽ അവനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും പാഠത്തിൽ ഇല്ലാത്ത പേര് ആദ്യ ഉപവാക്യത്തിലേക്ക് ചേർക്കാതെ ‘അവൻ’ എന്നു നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഹായി’, ‘യോശുവ’ എന്നീ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. ക്രൂരത മൃദൂകരിക്കാതെയും വധരീതി മൂലപാഠത്തേക്കാൾ പ്രത്യേകീകരിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
