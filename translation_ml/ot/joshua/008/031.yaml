  rationale: 'The revision resolves the principal lexical ambiguity in the Malayalam rendering of שְׁלֵמוֹת: “മുഴുമയുള്ള” denotes whole/intact stones, whereas “മുഴുവൻ” can be understood quantitatively as all stones. It also uses the more natural modern sacrificial verb “അർപ്പിക്കുക” for the peace offerings. Footnote anchors remain attached to the expressions they explain, and the alternatives preserve the source''s semantic range without introducing doctrinal interpretation.'
