id: JOS.8.31
reference: Joshua 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ദാസനായ മോശെ ഇസ്രായേൽമക്കളോടു കല്പിച്ചതുപോലെ, മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതനുസരിച്ച്, ഇരുമ്പുപകരണം പ്രയോഗിച്ചിട്ടില്ലാത്ത മുഴുമയുള്ള കല്ലുകൾകൊണ്ടുള്ള[a] ഒരു യാഗപീഠം. അവർ അതിന്മേൽ യഹ്‌വെക്കു ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും സമാധാനയാഗങ്ങൾ[b] അർപ്പിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെത്താത്ത കല്ലുകൾകൊണ്ടുള്ള.’ എബ്രായത്തിൽ ‘മുഴുമയുള്ള കല്ലുകൾ’ എന്നാണ്; ഇരുമ്പുപകരണംകൊണ്ട് പണിയാതെ കല്ലുകൾ അതേപടി വെച്ചിരുന്നതിന് ഇത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സമാധാനയാഗങ്ങൾ’ എന്നതിന് ‘കൂട്ടായ്മയാഗങ്ങൾ’ എന്നോ ‘ക്ഷേമയാഗങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: മുമ്പ് നൽകിയ കല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന താരതമ്യപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֶבֶד יְהוָה
  choice: യഹ്‌വെയുടെ ദാസൻ
  rationale: മോശെയുടെ ആദരസൂചകമായ സ്ഥാനപ്പേര് നിലനിർത്തുന്നു; ഇവിടെ ‘അടിമ’ എന്നത് അനാവശ്യമായി ബന്ധനസ്ഥിതിക്ക് ഊന്നൽ നൽകും.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബപരവും സമൂഹപരവുമായ പ്രയോഗം മലയാളത്തിലെ പതിവായ ഉൾക്കൊള്ളുന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: ‘പുസ്തകം’ എന്നും תורה എന്ന നിയമോപദേശപരമായ ആശയത്തിന് പരിചിതമായ ‘ന്യായപ്രമാണം’ എന്നും നിലനിർത്തുന്നു.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: മുഴുവൻ കല്ലുകൾകൊണ്ടുള്ള ഒരു യാഗപീഠം
  rationale: שְׁלֵמוֹת എന്ന പദത്തിന്റെ ‘മുഴുവനായ, കേടുവരുത്താത്ത’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; ‘ചെത്താത്ത’ എന്ന വ്യാഖ്യാനപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: ഇരുമ്പുപകരണം പ്രയോഗിച്ചിട്ടില്ലാത്ത
  rationale: കല്ലുകളുടെമേൽ ഇരുമ്പ് ഉയർത്തുക/പ്രയോഗിക്കുക എന്ന എബ്രായപ്രയോഗത്തിന്റെ നിർമാണസംബന്ധമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: അതിന്മേൽ ഹോമയാഗങ്ങൾ അർപ്പിച്ചു
  rationale: עֹלוֹת എന്ന പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘ഹോമയാഗം’ ഉപയോഗിക്കുന്നു.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ കഴിച്ചു
  rationale: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ പേര് ഉപയോഗിക്കുന്നു; അതിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹപരമായ പദപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേൽജനത
  rationale: മൂലത്തിലെ കുടുംബപരമായ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇത് സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർഥപരിധി
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ; ക്ഷേമയാഗങ്ങൾ
  rationale: പരിചിതമായ യാഗസാങ്കേതികപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും കൂട്ടായ്മ/ക്ഷേമം ഉൾപ്പെടുന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഈ വാക്യത്തിന്റെ ആദ്യഭാഗം മുൻവാക്യത്തിലെ ‘പണിതു’ എന്ന ക്രിയയെ ആശ്രയിക്കുന്നതിനാൽ, മൂലപാഠത്തിലെ വാക്യഘടന സംരക്ഷിക്കാൻ ‘ഒരു യാഗപീഠം’ എന്ന നാമഖണ്ഡം സ്വതന്ത്രമായി നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
