revisions:
- from: യഹ്‌വെയുടെ ദാസനായ മോശെ ഇസ്രായേൽമക്കളോടു കല്പിച്ചതുപോലെ, മോശെയുടെ ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതനുസരിച്ച്, ഇരുമ്പുപകരണം പ്രയോഗിച്ചിട്ടില്ലാത്ത മുഴുവൻ കല്ലുകൾകൊണ്ടുള്ള[a] ഒരു യാഗപീഠം. അവർ അതിന്മേൽ യഹ്‌വെക്കു ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും സമാധാനയാഗങ്ങൾ[b] കഴിക്കുകയും ചെയ്തു.
