id: JOS.8.34
reference: Joshua 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֗ן קָרָא֙ אֶת כָּל דִּבְרֵ֣י הַ/תּוֹרָ֔ה הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה כְּ/כָל הַ/כָּת֖וּב בְּ/סֵ֥פֶר הַ/תּוֹרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: ml
  text: അതിനുശേഷം അവൻ ന്യായപ്രമാണത്തിലെ[b] എല്ലാ വചനങ്ങളും—അനുഗ്രഹവും ശാപവും—ന്യായപ്രമാണപുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നതൊക്കെയും അനുസരിച്ച് വായിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിളിച്ചുപറഞ്ഞു’ അല്ലെങ്കിൽ ‘വായിച്ചുകേൾപ്പിച്ചു’; ഈ സന്ദർഭത്തിൽ എബ്രായക്രിയയ്ക്ക് പരസ്യമായി വായിക്കുക എന്നോ പ്രഖ്യാപിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായപ്രമാണം’ എന്ന് പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം തോറാ ആണ്; അതിന് ‘ഉപദേശം’ എന്നും അർഥമാകാം. ഇവിടെ ഉടമ്പടി-രേഖയുടെ സന്ദർഭം ‘ന്യായപ്രമാണം’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: അതിനുശേഷം
  rationale: മുൻവിവരിച്ച പ്രവൃത്തികൾക്കു പിന്നാലെയുള്ള സമയക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קָרָא
  choice: വായിച്ചു
  rationale: ന്യായപ്രമാണത്തിലെ വചനങ്ങളാണ് നേരിട്ടുള്ള കർമം എന്നതിനാൽ ഇവിടെ പൊതുവായി വായിക്കുന്നതിനെയാണ് ക്രിയ പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. പരസ്യവായനയോ വിളിച്ചുപറയലോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת כָּל דִּבְרֵי הַתּוֹרָה
  choice: ന്യായപ്രമാണത്തിലെ എല്ലാ വചനങ്ങളും
  rationale: דִּבְרֵי എന്നതിന്റെ വ്യക്തമായ ‘വചനങ്ങൾ’ എന്ന അർഥം നിലനിർത്തുന്നു. ഉടമ്പടി-രേഖയുടെ പശ്ചാത്തലത്തിൽ תּוֹרָהയ്ക്ക് ‘ന്യായപ്രമാണം’ യോജിക്കുന്നു.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: അനുഗ്രഹവും ശാപവും
  rationale: ഏകവചനരൂപങ്ങൾ ഉടമ്പടിയിലെ അനുഗ്രഹ-ശാപ വിഭാഗങ്ങളെ സമാഹാരമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇതു സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: כְּכָל הַכָּתוּב
  choice: എഴുതിയിരിക്കുന്നതൊക്കെയും അനുസരിച്ച്
  rationale: യോശുവയുടെ വായന എഴുതപ്പെട്ട രേഖയോട് പൂർണമായി ഒത്തിരുന്നുവെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בְּסֵפֶר הַתּוֹרָה
  choice: ന്യായപ്രമാണപുസ്തകത്തിൽ
  rationale: סֵפֶר എന്ന എഴുതപ്പെട്ട രേഖയെയും תּוֹרָהയുടെ നിയമപരമായ ഉടമ്പടി-സന്ദർഭത്തെയും സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അനുഗ്രഹവും ശാപവും എന്ന ഘടകത്തെ മൂലപാഠത്തിലെ സമാനാധികരണബന്ധം സൂചിപ്പിക്കുന്നവിധം ദീർഘരേഖകൾക്കിടയിൽ നൽകിയിരിക്കുന്നു; പൊതുവായ വായനയുടെ സൂചന മുഖ്യപാഠത്തിൽ അധികമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
