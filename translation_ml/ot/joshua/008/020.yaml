  text: וַ/יִּפְנ֣וּ אַנְשֵׁי֩ הָ/עַ֨י אַחֲרֵי/הֶ֜ם וַ/יִּרְא֗וּ וְ/הִנֵּ֨ה עָלָ֜ה עֲשַׁ֤ן הָ/עִיר֙ הַ/שָּׁמַ֔יְמָ/ה וְ/לֹא הָיָ֨ה בָ/הֶ֥ם יָדַ֛יִם לָ/נ֖וּס הֵ֣נָּה וָ/הֵ֑נָּה וְ/הָ/עָם֙ הַ/נָּ֣ס הַ/מִּדְבָּ֔ר נֶהְפַּ֖ךְ אֶל הָ/רוֹדֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: ml
  text: അപ്പോൾ ഹായി നഗരത്തിലെ പുരുഷന്മാർ തിരിഞ്ഞ് പിന്നിലേക്കു നോക്കി. അതാ, നഗരത്തിന്റെ പുക ആകാശത്തേക്ക് ഉയരുകയായിരുന്നു[a]. ഇങ്ങോട്ടോ അങ്ങോട്ടോ ഓടിപ്പോകാൻ അവർക്കു കഴിവില്ലായിരുന്നു[b]. മരുഭൂമിയിലേക്കു ഓടിപ്പോയിരുന്ന ജനം തങ്ങളെ പിന്തുടർന്നവരുടെ നേരെ[c] തിരിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശത്തേക്ക് (അല്ലെങ്കിൽ സ്വർഗത്തേക്ക്) ഉയർന്നു.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ആകാശദിശയിലേക്ക്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായഭാഷയിൽ അക്ഷരാർഥം “അവരിൽ കൈകളില്ലായിരുന്നു” എന്നാണ്; രക്ഷപ്പെടാനുള്ള ശക്തിയോ കഴിവോ അവർക്കില്ലായിരുന്നു എന്നർഥമുള്ള പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: എബ്രായമൂലത്തിൽ “പിന്തുടരുന്നവൻ” എന്ന് ഏകവചനമാണ്; പിന്തുടരുന്ന സൈന്യത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന കൂട്ടവാചകപ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  choice: തിരിഞ്ഞു പിന്നിലേക്കു നോക്കി
  rationale: രണ്ടു ക്രിയകളെയും വേർതിരിച്ചു നിലനിർത്തുകയും, אַחֲרֵיהֶם എന്നതിന്റെ സ്ഥലസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אַנְשֵׁי הָעַי
  choice: ഹായിപട്ടണത്തിലെ പുരുഷന്മാർ
  rationale: അക്ഷരാർഥമായ ‘ഹായിയിലെ പുരുഷന്മാർ’ എന്ന ആശയം നിലനിർത്തുന്നു; സ്ഥലനാമം വ്യക്തമായി വായിക്കാനായി ‘പട്ടണം’ ചേർത്തു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള കാഴ്ചയിലേക്കും തിരിച്ചറിവിലേക്കും ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ ആഖ്യാനസൂചകത്തിന്റെ ശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: പട്ടണത്തിന്റെ പുക ആകാശത്തേക്ക് ഉയരുകയായിരുന്നു
  rationale: പുക മുകളിലേക്ക് ഉയരുന്ന ദൃശ്യവും പ്രവൃത്തിയുടെ തുടരുന്ന സ്വഭാവവും നൽകുന്നു; ‘സ്വർഗത്തിലേക്ക്’ എന്ന മതപരമായ അർഥസൂചന അനാവശ്യമായി വരാതിരിക്കാൻ ‘ആകാശത്തേക്ക്’ തെരഞ്ഞെടുത്തു.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: അവർക്കു കഴിവില്ലാതെയായി
  rationale: ‘അവരിൽ കൈകളില്ലായിരുന്നു’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ പ്രവർത്തിക്കാനോ രക്ഷപ്പെടാനോ ഉള്ള ശേഷിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകി, മൂലപ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: ഇങ്ങോട്ടോ അങ്ങോട്ടോ ഓടിപ്പോകാൻ
  rationale: രണ്ടു ദിശകളിലേതിലേക്കും രക്ഷപ്പെടാൻ കഴിയാത്ത അവസ്ഥയെ എബ്രായത്തിലെ സമാന്തര ദിശാപദങ്ങൾക്ക് അടുത്തുനിന്ന് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: മരുഭൂമിയിലേക്കു ഓടിപ്പോയിരുന്ന ജനം
  rationale: മുമ്പ് മരുഭൂമിയിലേക്കു പിന്മാറിയിരുന്ന കൂട്ടം ഇപ്പോൾ ദിശ മാറ്റുന്നു എന്ന ആഖ്യാനക്രമം വ്യക്തമാക്കുന്നു.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: തങ്ങളെ പിന്തുടർന്നവർക്കെതിരെ തിരിഞ്ഞു
  rationale: യുദ്ധസന്ദർഭത്തിലെ ദിശാമാറ്റവും പ്രത്യാക്രമണഭാവവും നൽകുന്നു; ഏകവചനമായ הָרֹדֵף കൂട്ടവാചകമായി മനസ്സിലാക്കി സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമാക്കി, അതു അടിക്കുറിപ്പിൽ അറിയിച്ചു.
