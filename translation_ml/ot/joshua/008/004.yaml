revisions:
- from: 'അവൻ അവരോടു കല്പിച്ചു: “നോക്കൂ, നിങ്ങൾ നഗരത്തിന്റെ മറുവശത്ത് നഗരത്തിനെതിരെ പതിയിരിക്കണം. നഗരത്തിൽനിന്ന് വളരെ അകന്നുപോകരുത്. നിങ്ങൾ എല്ലാവരും ഒരുങ്ങിയിരിക്കണം.”'
