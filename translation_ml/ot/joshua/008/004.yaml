  text: וַ/יְצַ֨ו אֹתָ֜/ם לֵ/אמֹ֗ר רְ֠אוּ אַתֶּ֞ם אֹרְבִ֤ים לָ/עִיר֙ מֵ/אַחֲרֵ֣י הָ/עִ֔יר אַל תַּרְחִ֥יקוּ מִן הָ/עִ֖יר מְאֹ֑ד וִ/הְיִיתֶ֥ם כֻּלְּ/כֶ֖ם נְכֹנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/004.yaml
  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: ml
  text: 'അവൻ അവരോടു ഇങ്ങനെ കല്പിച്ചു: “നോക്കൂ, നിങ്ങൾ നഗരത്തിനു പിന്നിൽ നഗരത്തിനെതിരായി പതിയിരിക്കുക. നഗരത്തിൽനിന്ന് വളരെ അകലെ പോകരുത്. നിങ്ങൾ എല്ലാവരും സജ്ജരായിരിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു ആജ്ഞയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: אֹרְבִים
  choice: പതിയിരിക്കണം
  rationale: സൈനികാക്രമണത്തിനായി ഒളിച്ചുകാത്തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; സന്ദർഭത്തിൽ ക്രിയാത്മകമായി സ്വാഭാവികമാക്കി.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: നഗരത്തിന്റെ മറുവശത്ത്
  rationale: നഗരത്തിന്റെ പിന്നിലോ എതിർവശത്തോ ഉള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നഗരത്തിന്റെ ഭൗമദൃഷ്ട്യാ പിന്നാമ്പുറം എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נְכֹנִים
  choice: ഒരുങ്ങിയിരിക്കണം
  rationale: സജ്ജരായി കാത്തിരിക്കണമെന്ന സൈനിക നിർദേശം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
