  text: וַ/יִּשְׁלָחֵ֣/ם יְהוֹשֻׁ֗עַ וַ/יֵּֽלְכוּ֙ אֶל הַ/מַּאְרָ֔ב וַ/יֵּשְׁב֗וּ בֵּ֧ין בֵּֽית אֵ֛ל וּ/בֵ֥ין הָ/עַ֖י מִ/יָּ֣ם לָ/עָ֑י וַ/יָּ֧לֶן יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: ml
  text: അങ്ങനെ യോശുവ അവരെ അയച്ചു. അവർ പതിയിരിപ്പിടത്തിലേക്ക്[a] പോയി, ബേഥേലിനും ഹായിക്കും ഇടയിൽ, ഹായിയുടെ പടിഞ്ഞാറുവശത്ത്, നിലയുറപ്പിച്ചു. ആ രാത്രിയിൽ യോശുവ ജനത്തിന്റെ ഇടയിൽ പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പതിയിരിക്കുന്ന സൈന്യത്തിലേക്ക്.” എബ്രായപദം പതിയിരിക്കുന്ന സൈന്യത്തെയോ അവർ നിലകൊള്ളുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം സ്ഥലാർഥത്തിനാണ് കൂടുതൽ അനുകൂലം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: യോശുവ അവരെ അയച്ചു
  rationale: ശָׁלַח എന്ന ക്രിയയുടെ ഇവിടെ ഉള്ള അർഥം നേരിട്ട് ‘അയച്ചു’ എന്നാണ്; കർത്താവിനെയും കർമത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַמַּאְרָב
  choice: പതിയിരിപ്പിടം
  rationale: ഈ നാമം പതിയിരിക്കുന്ന സൈന്യത്തെയോ അവർ നിലകൊള്ളുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം. അടുത്തതായി സ്ഥാനം വിവരിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്ഥലാർഥം സ്വാഭാവികമാണ്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיֵּשְׁבוּ
  choice: നിലയുറപ്പിച്ചു
  rationale: יָשַׁב എന്നത് ഇരിക്കുക, താമസിക്കുക, തുടരുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ഈ സൈനികസന്ദർഭത്തിൽ ഒരു സ്ഥാനത്ത് തങ്ങി നിൽക്കുന്നതിനെ ‘നിലയുറപ്പിച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: ബേഥേലിനും ഹായിക്കും ഇടയിൽ
  rationale: സ്ഥലനാമങ്ങളും അവയ്ക്കിടയിലെ ഭൂമിശാസ്ത്രബന്ധവും നേരിട്ട് പകരുന്നു.
- source_word: מִיָּם לָעָי
  choice: ഹായിയുടെ പടിഞ്ഞാറുവശത്ത്
  rationale: יָם എന്നതിന്റെ അക്ഷരാർഥം ‘കടൽ’ ആണെങ്കിലും ദിശാസൂചനയിൽ അത് ‘പടിഞ്ഞാറ്’ എന്നർഥം നൽകുന്നു.
- source_word: וַיָּלֶן ... בְּתוֹךְ הָעָם
  choice: യോശുവ ... ജനത്തിന്റെ ഇടയിൽ പാർത്തു
  rationale: לוּן ഇവിടെ രാത്രി കഴിക്കുക എന്നർഥമാണ്. ‘ആ രാത്രിയിൽ’ എന്ന സമയസൂചനയോടൊപ്പം ‘പാർത്തു’ എന്നത് ആവർത്തനമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ ആശയം നൽകുന്നു.
