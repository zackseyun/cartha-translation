translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഭൂമിശാസ്ത്രവിവരം വ്യക്തമായി നിലനിർത്തുകയും എബ്രായത്തിലെ ലളിതമായ തുടർച്ചാബന്ധം അനാവശ്യമായ വൈരുധ്യമായി മാറ്റാതിരിക്കുകയും ചെയ്തു.
