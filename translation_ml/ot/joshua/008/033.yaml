  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: ml
  text: എല്ലാ യിസ്രായേലും—അവരുടെ മൂപ്പന്മാരും ഉദ്യോഗസ്ഥരും ന്യായാധിപന്മാരും, അവരോടൊപ്പം വസിച്ചിരുന്ന പരദേശിയും[a] സ്വദേശിയും ഒരുപോലെ—യഹോവയുടെ ഉടമ്പടിയുടെ പെട്ടകം ചുമക്കുന്ന ലേവ്യപുരോഹിതന്മാർക്ക് അഭിമുഖമായി, പെട്ടകത്തിന്റെ ഇരുവശങ്ങളിലും നിന്നു. അവരിൽ പാതി ഗെരിസീം പർവതത്തിനും മറുപാതി ഏബാൽ പർവതത്തിനും അഭിമുഖമായി നിന്നു. യിസ്രായേൽജനത്തെ അനുഗ്രഹിക്കാൻ യഹോവയുടെ ദാസനായ മോശെ ആദ്യം[b] കല്പിച്ചതുപോലെയായിരുന്നു ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താമസക്കാരനായ അന്യദേശക്കാരനും സ്വദേശിയും.”
    reason: גֵּר എന്ന സാമൂഹികപദത്തിന് ‘പരദേശി’ എന്നതിനെക്കാൾ വിശദമായ മറ്റൊരു പരിഭാഷ നൽകുന്നു.
  - marker: b
    text: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “ആദ്യത്തിൽ” എന്നാണ്. ഇത് മോശെയുടെ മുമ്പത്തെ കല്പനയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ അനുഗ്രഹിക്കൽ ആദ്യത്തെ പ്രവൃത്തിയായിരുന്നുവെന്ന് അർഥമാക്കാം.
    reason: בָּרִאשֹׁנָה എന്ന പദം വാക്യത്തിലെ ഏതു ഘടകത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത് എന്ന അവ്യക്തത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: യിസ്രായേൽജനം മുഴുവനും
  rationale: ദേശത്തെ ഒരു സമഗ്രസമൂഹമായി സൂചിപ്പിക്കുന്ന כָל എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: അവരുടെ മൂപ്പന്മാരും ഉദ്യോഗസ്ഥരും ന്യായാധിപന്മാരും
  rationale: ഇവ യിസ്രായേൽസമൂഹത്തിന്റെ നേതൃത്വ-ഭരണ-ന്യായനിർവഹണ വിഭാഗങ്ങളാണ്; שֹׁטְרִים എന്നത് സൈനിക അർഥം നൽകാതെ ‘ഉദ്യോഗസ്ഥർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: പെട്ടകത്തിന്റെ ഇരുവശത്തുമായി
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ സ്ഥലവിതരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യപുരോഹിതന്മാർ
  rationale: പുരോഹിതന്മാരെ ലേവ്യരായി വിശേഷിപ്പിക്കുന്ന ഹീബ്രു ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമന്ന
  rationale: നിലവിലുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കൃദന്തരൂപവും ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: അവരോടൊപ്പം താമസിച്ചിരുന്ന പരദേശിയും സ്വദേശിയും ഒരുപോലെ
  rationale: גֵּר എന്നത് വെറും സന്ദർശകനല്ല, സമൂഹത്തിനിടയിൽ വസിക്കുന്ന അന്യദേശക്കാരനാണ്; אֶזְרָח സ്വദേശാംഗത്തെ സൂചിപ്പിക്കുന്നു. ഇരുവർക്കുമുള്ള തുല്യപങ്കാളിത്തം ‘ഒരുപോലെ’ വ്യക്തമാക്കുന്നു.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: ജനത്തിൽ പകുതി ... മറുപകുതി
  rationale: പ്രത്യയത്തിന്റെ സൂചിതപദം ജനമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കി രണ്ടു വിഭാഗങ്ങളായുള്ള ക്രമീകരണം അവതരിപ്പിക്കുന്നു.
- source_word: בָּרִאשֹׁנָה
  choice: ആദ്യം
  rationale: ‘ആദ്യത്തിൽ/ആദ്യമായി’ എന്ന മൂലപദത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു; കൃത്യമായ ബന്ധം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: גֵּר, אֶזְרָח എന്നീ സാമൂഹിക വിഭാഗങ്ങളുടെ ഉൾപ്പെടുത്തൽ
  choice: അവരോടൊപ്പം താമസിച്ചിരുന്ന പരദേശിയും സ്വദേശിയും ഒരുപോലെ
  alternative: അന്യനും പൗരനും
  rationale: പിന്നീടുള്ള മതശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ, ചടങ്ങിൽ താമസക്കാരനായ പരദേശിക്കും സ്വദേശിക്കും ഉണ്ടായിരുന്ന തുല്യസ്ഥാനം വ്യക്തമാക്കുന്നു.
- issue: בָּרִאשֹׁנָה എന്നതിന്റെ ബന്ധം
  choice: മോശെ ആദ്യം കല്പിച്ചിരുന്നത്
  alternative: ആദ്യത്തെ പ്രവൃത്തിയായി അനുഗ്രഹിക്കുക
  rationale: വാക്യത്തിലെ സാധ്യമായ ഒരു സ്വാഭാവിക വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും മറ്റൊരു വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈർഘ്യമേറിയ ഹീബ്രു വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ആശയക്രമവും സ്ഥലബന്ധങ്ങളും നിലനിർത്തി. ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു.
