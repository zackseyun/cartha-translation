- from: യിസ്രായേൽജനം മുഴുവനും—അവരുടെ മൂപ്പന്മാരും ഉദ്യോഗസ്ഥരും ന്യായാധിപന്മാരും, അവരോടൊപ്പം താമസിച്ചിരുന്ന പരദേശിയും[a] സ്വദേശിയും ഒരുപോലെ—യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമന്ന ലേവ്യപുരോഹിതന്മാർക്ക് അഭിമുഖമായി, പെട്ടകത്തിന്റെ ഇരുവശത്തുമായി നിന്നു. ജനത്തിൽ പകുതി ഗെരിസീം പർവതത്തിനും മറുപകുതി ഏബാൽ പർവതത്തിനും അഭിമുഖമായി നിന്നു. യിസ്രായേൽജനത്തെ അനുഗ്രഹിക്കേണ്ടതിന് യഹോവയുടെ ദാസനായ മോശെ ആദ്യം[b] കല്പിച്ചിരുന്നതുപോലെയായിരുന്നു ഇത്.
  to: എല്ലാ യിസ്രായേലും—അവരുടെ മൂപ്പന്മാരും ഉദ്യോഗസ്ഥരും ന്യായാധിപന്മാരും, അവരോടൊപ്പം വസിച്ചിരുന്ന പരദേശിയും[a] സ്വദേശിയും ഒരുപോലെ—യഹോവയുടെ ഉടമ്പടിയുടെ പെട്ടകം ചുമക്കുന്ന ലേവ്യപുരോഹിതന്മാർക്ക് അഭിമുഖമായി, പെട്ടകത്തിന്റെ ഇരുവശങ്ങളിലും നിന്നു. അവരിൽ പാതി ഗെരിസീം പർവതത്തിനും മറുപാതി ഏബാൽ പർവതത്തിനും അഭിമുഖമായി നിന്നു. യിസ്രായേൽജനത്തെ അനുഗ്രഹിക്കാൻ യഹോവയുടെ ദാസനായ മോശെ ആദ്യം[b] കല്പിച്ചതുപോലെയായിരുന്നു ഇത്.
