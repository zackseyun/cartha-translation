  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה שְׁנֵ֥ים עָשָׂ֖ר אָ֑לֶף כֹּ֖ל אַנְשֵׁ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: ml
  text: ആ ദിവസം പുരുഷന്മാർ മുതൽ സ്ത്രീകൾ വരെ വീണുപോയവരുടെ എണ്ണം പന്ത്രണ്ടായിരം ആയിരുന്നു—ആയിയിലെ ജനങ്ങൾ മുഴുവനും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ആയിയിലെ പുരുഷന്മാർ മുഴുവനും.” ഇവിടെ ഈ ഹീബ്രായ പ്രയോഗം ആയിയിലെ ജനങ്ങളെ അല്ലെങ്കിൽ നിവാസികളെ സമാഹാരമായി സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഹീബ്രായ ഫലസംഗ്രഹവാക്യത്തിലെ അസ്തിത്വ/ബന്ധക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വാക്യാവസാന ക്രിയയായി നൽകി.
- source_word: כָל הַנֹּפְלִים
  choice: വീണുപോയവർ
  rationale: യുദ്ധസന്ദർഭത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന נפל എന്ന പദത്തിന്റെ രൂപകം നിലനിർത്തുകയും അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: ആ ദിവസം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: പുരുഷന്മാർമുതൽ സ്ത്രീകൾവരെ
  rationale: ജനസംഖ്യയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന ഹീബ്രായ പരിധിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: പന്ത്രണ്ടായിരം പേർ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; വ്യക്തികളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: ആയിയിലെ ജനങ്ങൾ മുഴുവനും
  rationale: אַנְשֵׁי എന്നത് അക്ഷരാർഥത്തിൽ ‘പുരുഷന്മാർ’ എന്നായാലും, തൊട്ടുമുമ്പ് പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെടുന്നതായി വ്യക്തമാകുന്നതിനാൽ ഇവിടെ നഗരജനതയെ സമാഹാരമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: നാശനഷ്ടസംഗ്രഹത്തിലെ ലിംഗസൂചനയും സമാഹാരപ്രയോഗവും
  choice: ‘പുരുഷന്മാർമുതൽ സ്ത്രീകൾവരെ’ എന്ന ലിംഗവ്യത്യാസമുള്ള പരിധിപ്രയോഗം നിലനിർത്തി; അവസാനഭാഗം ‘ആയിയിലെ ജനങ്ങൾ മുഴുവനും’ എന്നു നൽകി.
  alternative: ‘ആയിയിലെ പുരുഷന്മാർ മുഴുവനും’
  rationale: മൂലപാഠത്തിലെ ആദ്യപ്രയോഗം ഇരുലിംഗങ്ങളെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു. അതിനാൽ അവസാനത്തെ אַנְשֵׁי הָעָי നഗരജനതയെ സമാഹാരമായി സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നത് സന്ദർഭസമ്മതമാണ്; എന്നാൽ അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വീണുപോയവർ’ യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവർ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തുന്നു; ദീർഘവാക്യത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ഡാഷും അർധവിരാമവും ഉപയോഗിച്ചു.
