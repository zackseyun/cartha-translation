  source_fidelity: 'ആദ്യവാക്യം ഹീബ്രുവിലെ നിഷേധവും ബന്ധവാക്യവും പൊതുവേ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു: ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാത്ത ആരും അവശേഷിച്ചില്ല എന്നതാണ് ആശയം. സ്ഥലനാമങ്ങളും പിന്തുടരൽ എന്ന സൈനികചലനവും യോജിച്ചതാണ്. എന്നാൽ ‘നഗരം തുറന്നുകിടക്കുന്നതായി വിട്ടിട്ട്’ എന്ന പ്രയോഗം ഹീബ്രുവിലെ ‘നഗരത്തെ തുറന്ന നിലയിൽ വിട്ടു’ എന്ന ആശയത്തെ മലയാളത്തിൽ അല്പം അസ്വാഭാവികമായി നൽകുന്നു.'
  naturalness: ‘ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാതെ ഒരു പുരുഷനും ... ശേഷിച്ചില്ല’ എന്ന ക്രമം മനസ്സിലാക്കാവുന്നതാണ്; ‘ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാത്ത ഒരു പുരുഷനും ... ശേഷിച്ചിരുന്നില്ല’ എന്നത് ബന്ധവാക്യത്തിന്റെ അർഥവും ഭൂതകാല ആഖ്യാനഭാവവും കൂടുതൽ വ്യക്തമായി നൽകുന്നു. ‘തുറന്നനിലയിൽ വിട്ട്’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
  terminology: ‘ഹായി,’ ‘ബേഥേൽ,’ ‘ഇസ്രായേൽ,’ ‘പിന്തുടർന്നു’ എന്നിവ അനുയോജ്യമാണ്. אִישׁ-ന്റെ രൂപപരമായ പുല്ലിംഗ ഏകവചനം ‘ഒരു പുരുഷനും’ എന്നതിലൂടെ സൂക്ഷിക്കാം; ഇതു സന്ദർഭത്തിൽ പൊതുവായ പ്രയോഗമാണെന്ന അടിക്കുറിപ്പ് ആവശ്യമായ വിശദീകരണം നൽകുന്നു.
