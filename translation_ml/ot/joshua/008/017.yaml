  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: ml
  text: ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാത്ത ഒരു പുരുഷനും ഹായിയിലോ ബേഥേലിലോ ശേഷിച്ചിരുന്നില്ല[b]. അവർ നഗരം തുറന്നനിലയിൽ വിട്ട്[a] ഇസ്രായേലിനെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അർഥവ്യക്തമായി: ‘അവർ നഗരത്തെ കാവലില്ലാതെ വിട്ടു.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘നഗരം തുറന്നതായി’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരു പുരുഷനും’ എന്നത് ഹീബ്രുവിലെ אִישׁ എന്ന ഏകവചന പുല്ലിംഗരൂപത്തെ പ്രതിഫലിപ്പിക്കുന്നു; ഇവിടെ പിന്നിൽ ശേഷിക്കാവുന്ന ഏതൊരാളെയും പൊതുവായി സൂചിപ്പിക്കാനാണ് അത് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: ഒരു പുരുഷനും ... ശേഷിച്ചില്ല
  rationale: נִשְׁאַר എന്ന നിഷ്ക്രിയ/സ്ഥിതിവാചക ക്രിയയുടെ ‘ശേഷിക്കുക’ എന്ന അർഥവും אִישׁ എന്ന ഏകവചന പുല്ലിംഗ രൂപവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ആരും പിന്നിൽ ശേഷിച്ചില്ല എന്ന പൊതുവായ അർഥത്തിലാണ്.
- source_word: בָּעַי וּבֵית אֵל
  choice: ഹായിയിലോ ബേഥേലിലോ
  rationale: നിഷേധവാക്യത്തിൽ മലയാളത്തിലെ ‘-ലോ ... -ലോ’ എന്ന ഘടന രണ്ടു സ്ഥലങ്ങളിലുമൊരാളും ശേഷിച്ചില്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാതെ
  rationale: ‘പിന്നാലെ പുറപ്പെടുക’ എന്ന ദിശാസൂചക സൈനിക ചലനം നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ കൃതന്തഘടനയിൽ നൽകുന്നു.
- source_word: וַיַּעַזְבוּ
  choice: അവർ ... വിട്ടിട്ട്
  rationale: עזב എന്നതിന്റെ നേരിട്ടുള്ള ‘വിടുക’ എന്ന അർഥം ആഖ്യാനത്തിന്റെ ക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָעִיר פְּתוּחָה
  choice: നഗരം തുറന്നുകിടക്കുന്നതായി
  rationale: פְּתוּחָה എന്നതിന്റെ മൂർത്തമായ ‘തുറന്ന’ എന്ന ചിത്രം നിലനിർത്തുന്നു; ‘കാവലില്ലാതെ’ എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പിന്തുടർന്നു
  rationale: רדף എന്ന സൈനികസന്ദർഭത്തിലെ ‘പിന്തുടരുക’ എന്ന അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
