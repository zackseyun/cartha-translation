  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഹായി’, ‘ബേഥേൽ’ എന്നീ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിച്ചു. അക്ഷരാർഥമായ ‘തുറന്നുകിടക്കുന്നതായി’ മുഖ്യവാചകത്തിൽ സൂക്ഷിച്ച് തന്ത്രപരമായ ‘കാവലില്ലാതെ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
