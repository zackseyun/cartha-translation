  to: ഇസ്രായേലിന്റെ പിന്നാലെ പുറപ്പെടാത്ത ഒരു പുരുഷനും ഹായിയിലോ ബേഥേലിലോ ശേഷിച്ചിരുന്നില്ല[b]. അവർ നഗരം തുറന്നനിലയിൽ വിട്ട്[a] ഇസ്രായേലിനെ പിന്തുടർന്നു.
