source:
  edition: WLC
  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വെക്കായി[a] ഏബാൽ പർവതത്തിൽ ഒരു യാഗപീഠം പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ദൈവത്തിന്റെ സവിശേഷ നാമമായ יהוה (YHWH) ആണ്; അതിന്റെ പുരാതന ഉച്ചാരണം കൃത്യമായി അറിയില്ല. ഇവിടെ അത് ‘യാഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: ദൈവനാമത്തിന്റെ എബ്രായ മൂലരൂപവും പുരാതന ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലസൂചക ക്രിയാവിശേഷണത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം; ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തുന്നു.
- source_word: יִבְנֶה
  choice: പണിതു
  rationale: രൂപപരമായി അപൂർണകാല ക്രിയയാണെങ്കിലും אָז എന്ന പദത്തിനു ശേഷം ആഖ്യാനത്തിൽ ഭൂതകാലസംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ലളിതഭൂതകാലം ഉചിതമാണ്.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സുപരിചിതവും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള പീഠത്തെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിലെ ആദ്യ പരാമർശമായതിനാൽ ‘ഒരു’ സ്വാഭാവികമാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: לְ എന്ന ഉപസർഗം സമർപ്പണം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹോവയെ ഇസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയിക്കുന്ന സംയുക്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണപ്രയോഗമായി നിലനിർത്തുന്നു.
- source_word: בְּהַר עֵיבָל
  choice: ഏബാൽമലയിൽ
  rationale: ഏബാൽ എന്നു പേരുള്ള മലയുടെ മുകളിൽ/പ്രദേശത്ത് നടന്ന സംഭവത്തിന്റെ സ്ഥാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘യാഗപീഠം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കനുസരിച്ചാണ്.
