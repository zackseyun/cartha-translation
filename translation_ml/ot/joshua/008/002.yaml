  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: ml
  text: നീ യെരീഹോവിനോടും അതിന്റെ രാജാവിനോടും ചെയ്തതുപോലെതന്നെ ആയിയോടും അതിന്റെ രാജാവിനോടും ചെയ്യണം. എന്നാൽ, അതിലെ കൊള്ളവസ്തുക്കളും കന്നുകാലികളും നിങ്ങൾക്കു കൊള്ളയായി എടുക്കാം[a]. നഗരത്തിന്റെ പിന്നിൽ ഒരു പതിയിരിപ്പ് ഏർപ്പെടുത്തുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്കായി കൊള്ളയടിക്കും.’ എബ്രായ ക്രിയാരൂപം സാധാരണ ഭാവികാല പ്രസ്താവനയായോ അധികാരം നൽകുന്ന നിർദേശമായോ വായിക്കാം. യെരീഹോവിൽ കൊള്ള വിലക്കപ്പെട്ടിരുന്നതുമായുള്ള വ്യത്യാസം വ്യക്തമാക്കാൻ പ്രധാനപാഠത്തിൽ ‘കൊള്ളയായി എടുക്കാം’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നഗരത്തിന്റെ പിന്നിൽ പതിയിരിപ്പുകാരെ നിയോഗിക്കുക.’ എബ്രായത്തിലെ ഏകവചന കൃദന്തരൂപം പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്ന സൈനികസംഘത്തെ ഒന്നാകെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: നീ ... ചെയ്യണം
  rationale: സംയോജക അവ്യയത്തോടുകൂടിയ ഖാൽ പൂർണ്ണക്രിയ ഇവിടെ യോശുവയോടുള്ള നിർദേശമായി പ്രവർത്തിക്കുന്നു; ആജ്ഞയുടെ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָעַי
  choice: ആയിയോട്
  rationale: സ്ഥലനാമമായ עַי മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപമായ ‘ആയി’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്ന ബന്ധം ‘-യോട്’ വഴി പ്രകടമാക്കി.
- source_word: וּלְמַלְכָּהּ
  choice: അതിന്റെ രാജാവിനോടും
  rationale: നഗരത്തെയും അതിന്റെ രാജാവിനെയും ഒരേ പ്രവൃത്തിയുടെ ലക്ഷ്യങ്ങളായി കാണിക്കുന്ന സമാന്തര ഘടന നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: ചെയ്തതുപോലെതന്നെ
  rationale: യെരീഹോവിനോടു ചെയ്ത പ്രവൃത്തിയെ മാതൃകയാക്കുന്ന താരതമ്യത്തിന്റെ ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִירִיחוֹ וּלְמַלְכָּהּ
  choice: യെരീഹോവിനോടും അതിന്റെ രാജാവിനോടും
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതരൂപത്തിൽ നൽകി, ആവർത്തിച്ച לְ ബന്ധം സ്വാഭാവികമായ ഏകോപനത്തിൽ നിലനിർത്തുന്നു.
- source_word: רַק
  choice: എന്നാൽ
  rationale: യെരീഹോവുമായുള്ള മുൻതാരതമ്യത്തിൽനിന്നുള്ള നിർണായകമായ ഒഴിവ്/വ്യത്യാസം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלָלָהּ
  choice: അതിലെ കൊള്ളവസ്തുക്കൾ
  rationale: യുദ്ധത്തിൽ കൈവശപ്പെടുത്തുന്ന സാധനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കൊള്ളവസ്തുക്കൾ’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וּבְהֶמְתָּהּ
  choice: കന്നുകാലികൾ
  rationale: സ്വത്തായി കണക്കാക്കപ്പെട്ട വീട്ടുമൃഗങ്ങൾ എന്ന സാമ്പത്തിക അർഥം നൽകുന്നു; പൊതുവായ ‘മൃഗങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: תָּבֹזּוּ לָכֶם
  choice: നിങ്ങൾക്കായി കൊള്ളയടിക്കാം
  rationale: രണ്ടാം പുരുഷ ബഹുവചനരൂപം യോശുവയുടെ സൈന്യത്തെയാണ് അഭിസംബോധന ചെയ്യുന്നത്. യെരീഹോവിലെ വിലക്കിന് വിപരീതമായി ഇവിടെ അനുമതി നൽകുന്ന സന്ദർഭബലം ‘കൊള്ളയടിക്കാം’ എന്നു പ്രകടമാക്കുന്നു; לָכֶם എന്നത് ‘നിങ്ങൾക്കായി’ എന്നു നിലനിർത്തുന്നു.
- source_word: שִׂים לְךָ
  choice: നിനക്കായി ... ഒരുക്കുക
  rationale: യോശുവയോടുള്ള ഏകവചന ആജ്ഞയും לְךָയിലെ സ്വപ്രയോജന/സ്വബന്ധ സൂചനയും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֹרֵב
  choice: ഒരു പതിയിരിപ്പ്
  rationale: പദം പതിയിരിപ്പിനെയോ പതിയിരിക്കുന്ന സൈനികസംഘത്തെയോ സൂചിപ്പിക്കാം; പ്രധാനപാഠത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ‘പതിയിരിപ്പ്’ ഉപയോഗിച്ച് മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מֵאַחֲרֶיהָ
  choice: നഗരത്തിന്റെ പിന്നിൽ
  rationale: പട്ടണത്തിന്റെ പിൻവശത്തുള്ള സൈനിക സ്ഥാനത്തെ നേരിട്ടും വ്യക്തമായും രേഖപ്പെടുത്തുന്നു.
