source:
  edition: WLC
  text: וְ/הָ/אוֹרֵ֡ב קָם֩ מְהֵרָ֨ה מִ/מְּקוֹמ֤/וֹ וַ/יָּר֨וּצוּ֙ כִּ/נְט֣וֹת יָד֔/וֹ וַ/יָּבֹ֥אוּ הָ/עִ֖יר וַֽ/יִּלְכְּד֑וּ/הָ וַֽ/יְמַהֲר֔וּ וַ/יַּצִּ֥יתוּ אֶת הָ/עִ֖יר בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: ml
  text: പതിയിരിപ്പുസൈന്യം തങ്ങളുടെ സ്ഥാനത്തുനിന്ന് വേഗത്തിൽ എഴുന്നേറ്റു; അവൻ കൈ നീട്ടിയ ഉടനെ[a] അവർ ഓടി നഗരത്തിൽ പ്രവേശിച്ചു, അതു പിടിച്ചടക്കി, ഉടൻതന്നെ നഗരത്തിനു തീകൊളുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ കൈ നീട്ടിയപ്പോൾ.’ എബ്രായപ്രയോഗം യോശുവയുടെ അടയാളം നൽകിയ നിമിഷത്തെ സൂചിപ്പിക്കുന്നു; ഇതിനെ ‘ഉടനെ’ എന്ന തൽക്ഷണഭാവത്തോടെയോ പൊതുവായ സമയബന്ധത്തോടെയോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: പതിയിരിപ്പുസൈന്യം
  rationale: പതിയിരുന്ന സൈനികസംഘത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം; അമൂർത്തമായ ‘പതിയിരിപ്പ്’ എന്നതിനെക്കാൾ വ്യക്തവും സന്ദർഭോചിതവും.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: തങ്ങളുടെ സ്ഥാനത്തുനിന്ന് വേഗം എഴുന്നേറ്റ്
  rationale: קום ഇവിടെ മറവിൽനിന്ന് പ്രവർത്തനത്തിലേക്കു പെട്ടെന്ന് നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന കൂട്ടനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനസമ്മതത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּרֻצוּ
  choice: ഓടി
  rationale: רוץ എന്ന ക്രിയയുടെ നേരായ അർത്ഥം നിലനിർത്തുന്നു; ‘പാഞ്ഞു’ എന്നത് അനാവശ്യമായ തീവ്രത ചേർക്കാം.
- source_word: כִּנְטוֹת יָדוֹ
  choice: അവൻ കൈ നീട്ടിയ ഉടനെ
  rationale: כ + infinitive construct സമയബന്ധവും തൽക്ഷണ പ്രതികരണവും സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ സൂചന സന്ദർഭത്തിൽ യോശുവയിലേക്കാണെങ്കിലും പേരിനെ പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: നഗരത്തിൽ പ്രവേശിച്ച്
  rationale: בוא എന്ന ചലനക്രിയയും ലക്ഷ്യസ്ഥാനമായ നഗരവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וַיִּלְכְּדוּהָ
  choice: അതു പിടിച്ചടക്കി
  rationale: לכד ഒരു നഗരം സൈനികമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിടിച്ചടക്കി’ ആ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיְמַהֲרוּ
  choice: ഉടൻതന്നെ
  rationale: അടുത്ത പ്രവൃത്തിയുടെ വേഗത മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: നഗരത്തിന് തീയിട്ടു
  rationale: Hiphil രൂപത്തിന്റെ കാരണാർത്ഥമായ ‘തീ കൊളുത്തുക’ എന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
