translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ യുദ്ധവിവരണശൈലി. എബ്രായത്തിലെ കൂട്ടനാമവും തുടർന്ന് വരുന്ന ബഹുവചനക്രിയകളും മലയാളത്തിൽ സ്വാഭാവികമാക്കി; പാഠത്തിൽ വ്യക്തമല്ലാത്ത പേരോ വ്യാഖ്യാനമോ ചേർത്തിട്ടില്ല.
