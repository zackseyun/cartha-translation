id: JOS.8.21
reference: Joshua 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: ml
  text: പതിയിരിപ്പുകാർ നഗരം പിടിച്ചെടുത്തതും നഗരത്തിന്റെ പുക ഉയർന്നതും യോശുവയും യിസ്രായേൽ മുഴുവനും കണ്ടപ്പോൾ, അവർ തിരിഞ്ഞ് ഹായിയിലെ പുരുഷന്മാരെ അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: കണ്ടപ്പോൾ
  rationale: കാഴ്ചയിലൂടെ ഗ്രഹിക്കുന്നതെന്ന മൂർത്തമായ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള രണ്ട് വാക്യാംശങ്ങൾ അവർ കണ്ടതിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: כִּי ... וְכִי
  choice: എന്നും ... എന്നും
  rationale: യോശുവയും യിസ്രായേലും കണ്ട കാര്യങ്ങളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന സമാന്തര ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לָכַד
  choice: പിടിച്ചെടുത്തെന്നും
  rationale: കാണുന്നതിനു മുമ്പേ പൂർത്തിയായ നഗരാധീനപ്പെടുത്തലിനെ സന്ദർഭത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֹרֵב
  choice: പതിയിരിപ്പുകാർ
  rationale: ഹീബ്രു ഏകവചന പങ്കാളിത്തരൂപം പതിയിരിക്കുന്ന സൈനികസംഘത്തെ കൂട്ടായ നാമമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: הָעִיר
  choice: നഗരം / നഗരത്തിന്റെ
  rationale: നിർദിഷ്ട നഗരത്തെ സൂചിപ്പിക്കുന്ന പദം ആവർത്തിച്ചിരിക്കുന്നിടത്ത് അർഥവ്യക്തതയോടെ നിലനിർത്തുന്നു.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: നഗരത്തിന്റെ പുക ഉയർന്നെന്നും
  rationale: ‘നഗരത്തിന്റെ പുക ഉയർന്നു’ എന്ന ഹീബ്രു ദൃശ്യബിംബം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיָּשֻׁבוּ
  choice: അവർ തിരിഞ്ഞ്
  rationale: യുദ്ധത്തിനായി ദിശമാറ്റി വീണ്ടും നേരിട്ടതിനെ സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּכּוּ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ ശക്തിയും സാധാരണയായി സൂചിപ്പിക്കുന്ന മാരകപ്രഹരവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַנְשֵׁי הָעָי
  choice: ഹായിപട്ടണത്തിലെ പുരുഷന്മാരെ
  rationale: ‘ഹായിയിലെ പുരുഷന്മാർ’ എന്ന ലിംഗനിർദിഷ്ട മൂലപദാർഥം നിലനിർത്തുന്നു; ‘യോദ്ധാക്കൾ’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള ആഖ്യാനമലയാളം. ‘യിസ്രായേൽ മുഴുവനും’ എന്നത് כָל יִשְׂרָאֵל എന്ന കൂട്ടായ പ്രയോഗം നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ പ്രധാനമായ പാഠഭേദമോ പ്രസിദ്ധീകരണത്തിന് ആവശ്യമായ അർഥവ്യത്യാസമുള്ള അടിക്കുറിപ്പോ ഇല്ല; അതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് പ്രധാനവാചകത്തിലെ ‘the ambush’ എന്ന പ്രയോഗത്തിന് കൂടുതൽ വ്യക്തമായ മറ്റൊരു രൂപം മാത്രമാണ്; മലയാള പ്രധാനവാചകത്തിൽ ‘പതിയിരിപ്പുകാർ’ എന്നു തന്നെ വ്യക്തമാക്കിയതിനാൽ അത് ആവശ്യമില്ല.
