source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: ml
  text: അങ്ങനെ ജനം നഗരത്തിനു വടക്കുള്ള പാളയം മുഴുവനും, അതിന്റെ പിൻഭാഗം[b] നഗരത്തിനു പടിഞ്ഞാറായി[a] വരത്തക്കവിധം, വിന്യസിച്ചു. യോശുവ ആ രാത്രിയിൽ താഴ്വരയുടെ നടുവിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘നഗരത്തിന്റെ കടൽവശത്ത്’; ഇവിടെ ‘കടൽ’ എന്ന പദം ‘പടിഞ്ഞാറ്’ എന്ന ദിശയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അതിന്റെ പിൻകാവൽപ്പട’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: വിന്യസിച്ചു
  rationale: שׂים എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന വിശാലമായ അർഥമുണ്ട്. ഇവിടെ സൈനികമായ ആസൂത്രിത സ്ഥാനനിർണയം സ്വാഭാവികമായി അറിയിക്കാൻ ‘വിന്യസിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ യോദ്ധാക്കളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘ജനം’ എന്നാണ്; അതിനാൽ മൂലപാഠത്തിന്റെ വിശാലമായ പ്രയോഗം നിലനിർത്തി.
- source_word: כָּל הַמַּחֲנֶה
  choice: പാളയം മുഴുവനും
  rationale: מַחֲנֶה എന്നത് ‘പാളയം/ശിബിരം’ എന്നാണ്. כָּל സഹിതമുള്ള സമഗ്രത ‘പാളയം മുഴുവനും’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: നഗരത്തിനു വടക്കുള്ള
  rationale: പാളയത്തിന്റെ സ്ഥാനം വ്യക്തമാക്കുന്ന ആപേക്ഷികവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עֲקֵבוֹ
  choice: അതിന്റെ പിൻഭാഗം
  rationale: עָקֵב എന്നത് അടിസ്ഥാനമായി ‘കുതികാൽ’ എന്നും വിപുലാർഥത്തിൽ പിന്നറ്റം എന്നും സൂചിപ്പിക്കുന്നു. ‘പിൻകാവൽപ്പട’ എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִיָּם לָעִיר
  choice: നഗരത്തിനു പടിഞ്ഞാറായി
  rationale: יָם അക്ഷരാർഥത്തിൽ ‘കടൽ’ ആണെങ്കിലും ദിശാസൂചനയിൽ സാധാരണയായി ‘പടിഞ്ഞാറ്’ എന്നർഥം നൽകുന്നു; വായനാസ്പഷ്ടതയ്ക്കായി ആ അർഥം മുഖ്യപാഠത്തിൽ നൽകി.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ സന്ദർഭോചിതവും ലളിതവുമായ പരിഭാഷ.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: താഴ്വരയുടെ നടുവിലേക്കു
  rationale: ചലനക്രിയയോടൊപ്പം בְּתוֹךְ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നടുവിലേക്കു’ എന്നു നൽകി.
