translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ വേദപാഠത്തിനു യോജിച്ച ഗൗരവമുള്ള ശൈലി. സൈനികസന്ദർഭം വ്യക്തമാക്കാൻ ‘വിന്യസിച്ചു’ ഉപയോഗിച്ചെങ്കിലും ‘ജനം’, ‘പാളയം’, ‘പിൻഭാഗം’ എന്നിവയിലൂടെ എബ്രായത്തിലെ രൂപപരവും അർഥപരവുമായ വിശാലത നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കരികിൽ ചേർത്തിരിക്കുന്നു.
