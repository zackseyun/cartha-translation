translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ഭൂവിഭജനസന്ദർഭം വ്യക്തമാക്കാൻ ‘ഓഹരികൾ’ എന്നും, עמד എന്ന ക്രിയയുടെ സന്ദർഭാർഥത്തിന് ‘നിലനിൽക്കണം’ എന്നും തെരഞ്ഞെടുത്തു; അതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
