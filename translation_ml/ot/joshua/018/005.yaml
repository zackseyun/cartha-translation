  text: וְ/הִֽתְחַלְּק֥וּ אֹתָ֖/הּ לְ/שִׁבְעָ֣ה חֲלָקִ֑ים יְהוּדָ֞ה יַעֲמֹ֤ד עַל גְּבוּל/וֹ֙ מִ/נֶּ֔גֶב וּ/בֵ֥ית יוֹסֵ֛ף יַעַמְד֥וּ עַל גְּבוּלָ֖/ם מִ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: ml
  text: അവർ അതിനെ ഏഴ് ഓഹരികളായി വിഭജിക്കണം. യെഹൂദാ തെക്കുവശത്ത് തന്റെ അതിർത്തിയിൽ തുടരുകയും യോസേഫിന്റെ ഭവനം വടക്കുവശത്ത് അവരുടെ അതിർത്തിയിൽ തുടരുകയും വേണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അതിർത്തിയിൽ നിൽക്കണം’ / ‘അവരുടെ അതിർത്തിയിൽ നിൽക്കണം.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘നിൽക്കുക’ എന്നാണ്; ഇവിടെ നിലവിലുള്ള ഭൂപരിധികളിൽ തുടരുക എന്ന അർഥമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: അവർ അതിനെ വിഭജിക്കണം
  rationale: חלק എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം ഇവിടെ ദേശം ഗോത്രങ്ങൾക്കായി ഭാഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവായ ‘അവർ’ എന്നത് ക്രിയയിലെ ബഹുവചനത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ഏഴ് ഓഹരികളായി
  rationale: חֲלָקִים ഭൂവിഭജനത്തിൽ ലഭിക്കുന്ന ഭാഗങ്ങളെയോ വിഹിതങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ഓഹരികൾ’ ഈ വിതരണസന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ / יַעַמְדוּ עַל גְּבוּלָם
  choice: തന്റെ അതിർത്തിയിൽത്തന്നെ നിലനിൽക്കണം / അവരുടെ അതിർത്തിയിൽത്തന്നെ നിലനിൽക്കണം
  rationale: עמד എന്നതിന് അക്ഷരാർഥത്തിൽ ‘നിൽക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ നിലവിലുള്ള ഭൂപരിധികൾ മാറ്റമില്ലാതെ തുടരുന്നതാണ് സന്ദർഭാർഥം. ഏകവചനവും ബഹുവചനവും മലയാളത്തിൽ യഥാക്രമം സംരക്ഷിച്ചു.
- source_word: מִנֶּגֶב / מִצָּפוֹן
  choice: തെക്കുവശത്ത് / വടക്കുവശത്ത്
  rationale: ഇവിടെ പദങ്ങൾ പ്രത്യേകിച്ച് നെഗെബ് പ്രദേശത്തെയല്ല, പരസ്പരം സമാന്തരമായ ദിശകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבֵית יוֹסֵף
  choice: യോസേഫിന്റെ ഭവനം
  rationale: בית יוסף യോസേഫിൽനിന്നുള്ള ഗോത്രങ്ങളെ കൂട്ടായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; ‘ഭവനം’ അതിന്റെ വംശീയ-സാമൂഹിക അർഥം നിലനിർത്തുന്നു.
