source:
  edition: WLC
  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി വടക്കോട്ടു വളഞ്ഞ് ഏൻ-ശേമെശിലേക്കു[a] നീണ്ടുചെന്നു; അദുമ്മീം കയറ്റത്തിന്[c] എതിരെയുള്ള ഗെലീലോത്തിലേക്കും[b] നീണ്ടുചെന്നു; രൂബേന്റെ മകനായ ബോഹാന്റെ കല്ലിലേക്കു ഇറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏൻ-ശേമെശ് എന്ന പേരിന്റെ അർത്ഥം ‘സൂര്യന്റെ ഉറവ’ എന്നാണ്; മുഖ്യപാഠത്തിൽ സ്ഥലനാമം ശബ്ദാന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗെലീലോത്ത് എന്ന പദത്തെ ‘വൃത്തങ്ങൾ’ എന്നോ ‘പ്രദേശങ്ങൾ’ എന്നോ അർത്ഥമാക്കാം; ഇവിടെ അതിനെ സ്ഥലനാമമായി എടുത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘അദുമ്മീം ചുരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: പിന്നെ അതു ... വളഞ്ഞ്
  rationale: അതിർത്തിവിവരണത്തിൽ תאר അതിർത്തിരേഖയുടെ ഗതി വളയുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ഈ ഭൂപ്രകൃതിഗതി വ്യക്തമാക്കുന്നു.
- source_word: מִצָּפוֹן
  choice: വടക്കോട്ടു
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയകളുടെ പരമ്പരയിൽ ഇത് ഉത്ഭവസ്ഥാനത്തേക്കാൾ ദിശയെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കുന്നു.
- source_word: וְיָצָא
  choice: ചെന്നു
  rationale: അതിർത്തിയുടെ തുടർച്ചയായ ഗതിയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആദ്യവും രണ്ടാമത്തേതുമായ പ്രയോഗങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: עֵין שֶׁמֶשׁ
  choice: ഏൻ-ശേമെശ്
  rationale: സ്ഥലനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ ശബ്ദാന്തരണം ചെയ്തു; അതിന്റെ പദാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: גְּלִילוֹת
  choice: ഗെലീലോത്ത്
  rationale: ഇവിടെ ഈ രൂപം സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ശബ്ദാന്തരണം ചെയ്തു; സാധ്യമായ പദാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: נֹכַח
  choice: എതിരെയുള്ള
  rationale: സ്ഥലപരമായ അഭിമുഖതയെയോ മറുവശത്തുള്ള നിലയെയോ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: അദുമ്മീം കയറ്റം
  rationale: מעלה എന്ന ഭൂപ്രകൃതിപദത്തിന്റെ കയറ്റം എന്ന അർത്ഥം നിലനിർത്തുകയും അദുമ്മീം എന്ന സ്ഥലനാമം ശബ്ദാന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: וְיָרַד
  choice: താഴേക്ക് ഇറങ്ങി
  rationale: ഭൂപ്രകൃതിയിലെ താഴോട്ടുള്ള അതിർത്തിഗതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: രൂബേന്റെ മകനായ ബോഹന്റെ കല്ല്
  rationale: കല്ലെന്ന അതിർത്തിച്ചിഹ്നം ബോഹന്റെ പേരിലുള്ളതാണെന്നും ബോഹനെ രൂബേന്റെ മകൻ/വംശജൻ എന്നു തിരിച്ചറിയിക്കുന്നുവെന്നും സുതാര്യമായി അവതരിപ്പിക്കുന്നു.
