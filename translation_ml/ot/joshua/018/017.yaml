translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. അതിർത്തിയെ ഏകവചനമായ ‘അതു’ എന്നു പരാമർശിച്ച് എബ്രായത്തിലെ തുടർച്ചയായ ചലനരൂപങ്ങൾ നിലനിർത്തി. എല്ലാ സ്ഥലനാമങ്ങളും മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു; അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യപാഠത്തിൽ [a], [c], [b] എന്നിങ്ങനെ അനുബന്ധ പദങ്ങളോട് ചേർത്തിരിക്കുന്നു.
