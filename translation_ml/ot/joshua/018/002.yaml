source:
  edition: WLC
  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കളിൽ തങ്ങളുടെ അവകാശം ഇനിയും വിഹിതമായി ലഭിക്കാത്ത ഏഴു ഗോത്രങ്ങൾ ശേഷിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ അവകാശം ഇനിയും വിഭജിച്ചിട്ടില്ലാത്ത.’ എബ്രായക്രിയയ്ക്ക് ‘വിഭജിക്കുക,’ ‘ഓഹരിയായി നൽകുക’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഗോത്രങ്ങൾ വിഭജനത്തിൽ പങ്കെടുത്തിട്ടില്ല എന്നതിനോ അവരുടെ അവകാശം ഇനിയും വിഹിതമായി ലഭിച്ചിട്ടില്ല എന്നതിനോ ഊന്നൽ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: ശേഷിച്ചിരുന്നു
  rationale: יתר എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ശേഷിച്ചുനിൽക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വാർഥം നൽകുന്നു.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർക്കിടയിൽ’ എന്ന എബ്രായ കുടുംബപരമായ പ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: ഇനിയും വിഭജിച്ചുകിട്ടാത്ത
  rationale: חלק എന്ന ക്രിയയ്ക്ക് വിഭജിക്കുക/ഓഹരിയായി നൽകുക എന്നർഥമുണ്ട്. ഗോത്രങ്ങൾ വ്യാകരണപരമായ കർത്താവായിരിക്കുമ്പോഴും സന്ദർഭം അവരുടെ ഭൂവിഹിതം ഇതുവരെ നിശ്ചയിക്കപ്പെട്ടിട്ടില്ലെന്ന ഫലാർഥം സൂചിപ്പിക്കുന്നു; ‘വിഭജിച്ചുകിട്ടാത്ത’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു, ‘ഇനിയും’ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന അപൂർണാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: אֶת נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശം
  rationale: נחלה ഇവിടെ ഗോത്രത്തിന് അവകാശമായി ലഭിക്കുന്ന ഭൂവിഹിതമാണ്; ‘അവകാശം’ അതിന്റെ ഭൂസ്വത്തും പാരമ്പര്യവുമായ ഭാവം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: ഏഴു ഗോത്രങ്ങൾ
  rationale: ഇസ്രായേലിന്റെ ഗോത്രഘടനയെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions:
- issue: חלקו എന്ന ക്രിയയുടെ കർത്തൃ-ഫല ബന്ധം
  choice: ‘തങ്ങളുടെ അവകാശം ഇനിയും വിഭജിച്ചുകിട്ടാത്ത’ എന്നു നൽകി, ഗോത്രങ്ങൾക്ക് ഭൂവിഹിതം ഇതുവരെ ലഭിച്ചിട്ടില്ലെന്ന സന്ദർഭാർഥം മുൻനിർത്തി.
  alternative: ‘തങ്ങളുടെ അവകാശം വിഭജിക്കാത്ത’ എന്നു നൽകി ഗോത്രങ്ങളെത്തന്നെ വിഭജനത്തിന്റെ സജീവ കർത്താക്കളായി കൂടുതൽ അക്ഷരാർഥത്തിൽ അവതരിപ്പിക്കാം.
  rationale: എബ്രായ വ്യാകരണത്തിൽ ‘ഏഴു ഗോത്രങ്ങൾ’ കർത്താവാണെങ്കിലും യോശുവ 18-ലെ ഭൂവിഭജനസന്ദർഭം അവർക്കുള്ള വിഹിതം ഇനിയും നിശ്ചയിക്കപ്പെടാത്ത അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. അടിക്കുറിപ്പ് യഥാർഥ ഭാഷാപരമായ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണം. ‘ഇസ്രായേൽമക്കൾ,’ ‘അവകാശം,’ ‘ഗോത്രങ്ങൾ’ എന്നീ പരിചിതമായ വേദപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; വിവർത്തനത്തിൽ വ്യക്തമാക്കിയ കർത്തൃ-ഫല വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
