revisions:
- from: എന്നാൽ ഇസ്രായേൽമക്കളിൽ തങ്ങളുടെ അവകാശം ഇനിയും വിഭജിച്ചുകിട്ടാത്ത ഏഴു ഗോത്രങ്ങൾ ശേഷിച്ചിരുന്നു.[a]
  to: എന്നാൽ ഇസ്രായേൽമക്കളിൽ തങ്ങളുടെ അവകാശം ഇനിയും വിഹിതമായി ലഭിക്കാത്ത ഏഴു ഗോത്രങ്ങൾ ശേഷിച്ചിരുന്നു.[a]
