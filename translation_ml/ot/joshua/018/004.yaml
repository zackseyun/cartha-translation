  to: ഓരോ ഗോത്രത്തിൽനിന്നും മൂന്നു പുരുഷന്മാരെ തിരഞ്ഞെടുക്കുവിൻ[a]; ഞാൻ അവരെ അയക്കും. അവർ എഴുന്നേറ്റ് ദേശമെങ്ങും സഞ്ചരിച്ച് അവകാശവിഹിതങ്ങൾക്കനുസരിച്ച് അതിനെ രേഖപ്പെടുത്തി എന്റെ അടുക്കൽ വരട്ടെ[b].
  rationale: The revision changes the modal ‘അയയ്ക്കാം’ to the committed future ‘അയക്കും,’ improves the opening imperative’s Malayalam idiom, and recasts the sequence as a coherent directive. It retains the Hebrew’s male representatives, distributive tribal sense, traversal, recording of the land, and inheritance-allotment framework. Footnote b is tightened to explain the survey/allotment relationship without adding an unstated future-allotment assertion.
