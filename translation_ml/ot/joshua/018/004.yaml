translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കല്പനയുടെ ഭാവം ‘-വിൻ’ രൂപത്തിലും തുടർന്നുള്ള നിർദേശങ്ങൾ ‘-ണം’ രൂപത്തിലും സ്വാഭാവികമായി അവതരിപ്പിച്ചു; ഗോത്രം, അവകാശവിഹിതം തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി.
