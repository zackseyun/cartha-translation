  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הָב֥וּ לָ/כֶ֛ם שְׁלֹשָׁ֥ה אֲנָשִׁ֖ים לַ/שָּׁ֑בֶט וְ/אֶשְׁלָחֵ֗/ם וְ/יָקֻ֜מוּ וְ/יִֽתְהַלְּכ֥וּ בָ/אָ֛רֶץ וְ/יִכְתְּב֥וּ אוֹתָ֛/הּ לְ/פִ֥י נַֽחֲלָתָ֖/ם וְ/יָבֹ֥אוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: ml
  text: ഓരോ ഗോത്രത്തിൽനിന്നും മൂന്നു പുരുഷന്മാരെ തിരഞ്ഞെടുക്കുവിൻ[a]; ഞാൻ അവരെ അയക്കും. അവർ എഴുന്നേറ്റ് ദേശമെങ്ങും സഞ്ചരിച്ച് അവകാശവിഹിതങ്ങൾക്കനുസരിച്ച് അതിനെ രേഖപ്പെടുത്തി എന്റെ അടുക്കൽ വരട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോ ഗോത്രത്തിനും മൂന്നു പുരുഷന്മാരെ നിയമിക്കുവിൻ.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ദേശത്തെ അവകാശവിഹിതങ്ങളുടെ അടിസ്ഥാനത്തിൽ രേഖപ്പെടുത്തണം.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: നിങ്ങൾക്കായി നിയോഗിക്കുവിൻ
  rationale: പദാനുപദമായി ‘നിങ്ങൾക്കായി തരുവിൻ’ എന്നാകാമെങ്കിലും, ഇവിടെ പ്രതിനിധികളെ ഒരുക്കുകയോ നിയമിക്കുകയോ ചെയ്യുന്നതാണ് സന്ദർഭാർഥം. ‘നിയോഗിക്കുവിൻ’ ആ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: മൂന്നു പുരുഷന്മാരെ
  rationale: എബ്രായപദം പുരുഷന്മാരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: לַשָּׁבֶט
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും
  rationale: ഏകവചനരൂപമാണെങ്കിലും സന്ദർഭത്തിൽ വിതരണാർഥം—ഓരോ ഗോത്രത്തിൽനിന്നും മൂന്നു പേർ—ആണ്.
- source_word: וְאֶשְׁלָחֵם
  choice: ഞാൻ അവരെ അയയ്ക്കാം
  rationale: ദൗത്യത്തിനായി അയയ്ക്കുക എന്ന ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְיָקֻמוּ
  choice: അവർ പുറപ്പെട്ട്
  rationale: അക്ഷരാർഥം ‘അവർ എഴുന്നേൽക്കും’ എന്നാണ്; ഇവിടെ തുടർന്നുള്ള യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുറപ്പെട്ട്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: ദേശമെങ്ങും സഞ്ചരിച്ച്
  rationale: ഹിത്പയേൽ രൂപം ദേശത്തിലൂടെ ചുറ്റിസഞ്ചരിക്കുകയോ പരിശോധിച്ചുനടക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: അതിനെ രേഖപ്പെടുത്തണം
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘രേഖപ്പെടുത്തുക’ എന്നത് എഴുതിവയ്ക്കുക എന്ന അർഥം അനാവശ്യമായി ‘വിവരണം’ ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: לְפִי נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശവിഹിതങ്ങൾക്കനുസരിച്ച്
  rationale: ‘അവരുടെ അവകാശത്തിനനുസരിച്ച്’ എന്ന ഘടന ഭൂപ്രദേശത്തിന്റെ അവകാശവിഹിതങ്ങളോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു. ബഹുവചനമായ ‘വിഹിതങ്ങൾ’ സന്ദർഭം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് പ്രവർത്തനത്തിന്റെ സ്വഭാവം വിശദീകരിക്കുന്നു.
- source_word: וְיָבֹאוּ אֵלָי
  choice: അവർ എന്റെ അടുക്കൽ വരണം
  rationale: എബ്രായത്തിൽ ‘എന്റെ അടുക്കൽ വരുക’ എന്നാണ്; സന്ദർഭപരമായി മടങ്ങിവരികയാണെങ്കിലും പാഠത്തിൽ ഇല്ലാത്ത ‘മടങ്ങി’ ചേർത്തിട്ടില്ല.
