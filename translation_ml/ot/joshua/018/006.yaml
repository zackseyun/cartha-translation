id: JOS.18.6
reference: Joshua 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: ml
  text: നിങ്ങൾ ദേശത്തെ ഏഴു ഭാഗങ്ങളായി രേഖപ്പെടുത്തി അത് ഇവിടെ എന്റെ അടുക്കലേക്ക് കൊണ്ടുവരണം; ഞാൻ ഇവിടെ നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച് നിങ്ങൾക്കായി നറുക്കിടും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: ദേശത്തെ ... രേഖപ്പെടുത്തി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എഴുതുക’ എന്നാണെങ്കിലും, ഇവിടെ ദേശത്തിന്റെ ഭാഗങ്ങൾ രേഖാമൂലം വിവരിച്ചുകുറിക്കുന്നതാണ് സന്ദർഭാർഥം; ‘രേഖപ്പെടുത്തി’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שִׁבְעָה חֲלָקִים
  choice: ഏഴു ഭാഗങ്ങളായി
  rationale: ഭൂവിഭജനത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: ഞാൻ ... നിങ്ങൾക്കുവേണ്ടി നറുക്കിടും
  rationale: ഗּוֹרָל ഏകവചനത്തിലാണെങ്കിലും മലയാളത്തിൽ നറുക്കെടുപ്പ് നടത്തുന്നതിന്റെ സ്വാഭാവിക പ്രയോഗം ‘നറുക്കിടുക’ എന്നാണ്; ദാതൃസൂചകമായ לָכֶם ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച്
  rationale: ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; לִפְנֵי എന്നതിന്റെ ആരാധനാത്മകവും സ്ഥലപരവുമായ ഭാവം ‘സന്നിധിയിൽവെച്ച്’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നറുക്കിടലിലെ ദൈവസന്നിധിയും നിർണയാധികാരവും
  choice: ‘നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച് ഞാൻ ... നറുക്കിടും’ എന്ന ഉറവിടക്രമവും ആശയവും നിലനിർത്തി.
  alternative: നറുക്കിലൂടെ യഹോവ തന്നെ തീരുമാനിക്കുമെന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: വാക്യം നറുക്കിടുന്നത് യോശുവയാണെന്നും അത് യഹോവയുടെ സന്നിധിയിലാണെന്നും മാത്രമാണ് നേരിട്ട് പറയുന്നത്; അതിലധികമായ ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ടാമപുരുഷ ബഹുവചനത്തെ ‘നിങ്ങൾ’ എന്നു നൽകി. ദീർഘമായ ഏകവാക്യത്തെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും പ്രവർത്തനങ്ങളുടെ അനുക്രമവും അർഥബന്ധവും സംരക്ഷിച്ചു.
