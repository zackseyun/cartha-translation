revisions:
- from: നിങ്ങൾ ദേശത്തെ ഏഴു ഭാഗങ്ങളായി രേഖപ്പെടുത്തി ഇവിടെ എന്റെ അടുക്കൽ കൊണ്ടുവരണം. അപ്പോൾ നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച് ഞാൻ ഇവിടെ നിങ്ങൾക്കുവേണ്ടി നറുക്കിടും.
  to: നിങ്ങൾ ദേശത്തെ ഏഴു ഭാഗങ്ങളായി രേഖപ്പെടുത്തി അത് ഇവിടെ എന്റെ അടുക്കലേക്ക് കൊണ്ടുവരണം; ഞാൻ ഇവിടെ നമ്മുടെ ദൈവമായ യഹോവയുടെ സന്നിധിയിൽവെച്ച് നിങ്ങൾക്കായി നറുക്കിടും.
