base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ ലേവ്യർക്ക് ഓഹരിയില്ല; യഹോവയുടെ പൗരോഹിത്യം അവരുടെ അവകാശമായതിനാൽ.[a] ഗാദും രൂബേനും മനശ്ശെയുടെ പകുതി ഗോത്രവും യോർദ്ദാന്ന് അപ്പുറം, കിഴക്കോട്ട്, തങ്ങളുടെ അവകാശം കൈപ്പറ്റിയിരിക്കുന്നു; യഹോവയുടെ ദാസനായ മോശെ അവർക്കത് നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവന്റെ അവകാശം.” ഇവിടെ ഏകവചനം ലേവി ഗോത്രത്തെയോ ലേവ്യരെ ഒരു സമൂഹമായോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; അതിനാൽ മുഖ്യപാഠത്തിൽ “അവരുടെ അവകാശം” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: ഓഹരി
  rationale: ഗോത്രങ്ങൾക്കിടയിലെ ഭൂവിഭജനത്തിൽ ലഭിക്കുന്ന പങ്ക് എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള נַחֲלָה എന്ന ‘അവകാശം’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്ക്
  rationale: ലേവി ഗോത്രത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ഗോത്രങ്ങൾക്കിടയിലെ ഭൂവിഹിതത്തിന്റെ സന്ദർഭത്തിൽ എളുപ്പം മനസ്സിലാകുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: כְהֻנַּת יְהוָה
  choice: യഹോവയുടെ പൗരോഹിത്യം
  rationale: כְהֻנָּה എന്നതിന്റെ പൗരോഹിത്യപദവി/ശുശ്രൂഷ എന്ന സ്ഥാപനപരമായ അർഥവും യഹോവയോടുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അവരുടെ അവകാശം
  rationale: എബ്രായത്തിൽ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയമാണെങ്കിലും ലേവ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; രൂപപരമായ ഏകവചനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לָקְחוּ
  choice: സ്വീകരിച്ചുകഴിഞ്ഞു
  rationale: അക്ഷരാർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും നിയമാനുസൃതമായി നൽകിയ ഭൂവിഹിതം കൈപ്പറ്റിയതാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נַחֲלָתָם
  choice: തങ്ങളുടെ അവകാശം
  rationale: ഗോത്രങ്ങൾക്ക് പാരമ്പര്യമായി അനുവദിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: യോർദ്ദാനക്കരെ കിഴക്കുഭാഗത്ത്
  rationale: യോർദ്ദാന്റെ മറുകര ഏതെന്ന് ‘കിഴക്ക്’ വ്യക്തമാക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עֶבֶד יְהוָה
  choice: യഹോവയുടെ ദാസൻ
  rationale: മോശെയുടെ ഉടമ്പടിപരവും ബഹുമാനസൂചകവുമായ പദവി വ്യക്തമാക്കുന്നു; ഇവിടെ ‘അടിമ’ എന്നതിനെക്കാൾ ‘ദാസൻ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: נַחֲלָתוֹ എന്നതിലെ സമൂഹവാചക ഏകവചനം
  choice: അവരുടെ അവകാശം
  alternative: അവന്റെ അവകാശം
  rationale: എബ്രായരൂപം ഏകവചനമാണെങ്കിലും മുൻപറഞ്ഞ ലേവ്യരെ ഒരു സമൂഹമായി പരാമർശിക്കുന്നു. മലയാളത്തിലെ ബഹുവചനം ഉദ്ദേശിച്ച അർഥം വ്യക്തമാക്കുന്നു; മൂലരൂപത്തിന്റെ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭൂവിഭജനത്തിന്റെ സാങ്കേതിക പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘ഓഹരി’, ‘അവകാശം’ എന്നീ വേറിട്ട പദങ്ങൾ ഉപയോഗിച്ചു; പരമ്പരാഗത മതഭാഷയുടെ അനാവശ്യ സങ്കീർണത ഒഴിവാക്കി.
