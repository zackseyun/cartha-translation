source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽമക്കളുടെ[a] മുഴുവൻ സമൂഹവും ശീലോവിൽ ഒന്നിച്ചുകൂടി; അവിടെ സമാഗമകൂടാരം സ്ഥാപിച്ചു. ദേശം അവരുടെ മുമ്പിൽ കീഴടക്കപ്പെട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ദേശം അവരുടെ മുമ്പിൽ കീഴ്പെട്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: ഒന്നിച്ചുകൂടി
  rationale: קהל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഒരു സമൂഹമായി സമ്മേളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒന്നിച്ചുകൂടി’ ആ കൂട്ടായ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל עֲדַת
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ സംഘടിത ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; כָּל അതിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ഇത് സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: שִׁלֹה
  choice: ശീലോവ്
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיַּשְׁכִּינוּ
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ അക്ഷരാർഥം ‘വസിപ്പിച്ചു’ എന്നാണെങ്കിലും, കൂടാരത്തെ ഒരു സ്ഥലത്ത് നിലയുറപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരാനുള്ള കൂടാരമെന്ന എബ്രായ പദസമുച്ചയത്തിന്റെ അർഥം സുതാര്യമായി നൽകുന്ന, മലയാള ബൈബിൾഭാഷയിൽ മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: נִכְבְּשָׁה
  choice: കീഴടക്കപ്പെട്ടിരുന്നു
  rationale: כבשׁ എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ദേശം അവരുടെ അധികാരത്തിന് കീഴിലായിത്തീർന്ന നിലയെ സൂചിപ്പിക്കുന്നു. പൂർത്തിയായ ഫലാവസ്ഥ പ്രകടമാക്കാൻ ‘കീഴടക്കപ്പെട്ടിരുന്നു’ ഉപയോഗിച്ചു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ദേശം അവരുടെ അധീനതയിൽ കിടന്നുവെന്ന ആശയവും അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ കൂട്ടായ നാമകരണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’
  rationale: മൂലത്തിലെ בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധപരമായ രൂപം നിലനിർത്തിക്കൊണ്ട്, അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ മലയാളത്തിലെ സ്വാഭാവികമായ ‘മക്കൾ’ തെരഞ്ഞെടുത്തു.
- issue: נִכְבְּשָׁה സൂചിപ്പിക്കുന്ന കീഴടക്കലിന്റെ വ്യാപ്തി
  choice: ദേശം അവരുടെ മുമ്പിൽ കീഴടക്കപ്പെട്ടിരുന്നു
  alternative: ദേശം അവരുടെ മുമ്പിൽ കീഴ്പ്പെട്ടിരുന്നു
  rationale: നിഷ്ക്രിയരൂപം ദേശം ഇസ്രായേലിന്റെ നിയന്ത്രണത്തിലായ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു. എന്നാൽ യോശുവയുടെ തുടർന്നുള്ള വിവരണത്തിൽ ശേഷിക്കുന്ന പ്രദേശങ്ങളെ നിഷേധിക്കുന്ന വിധത്തിൽ സമ്പൂർണ കീഴടക്കൽ വ്യാഖ്യാനത്തിലൂടെ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘സമാഗമകൂടാരം’ പോലുള്ള പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി വിഭജിച്ചു.
