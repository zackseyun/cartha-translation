base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: ml
  text: അവിടെനിന്ന് അതിർത്തി ലൂസിലേക്കു കടന്നുപോയി, അതായത് ബേഥേലായ ലൂസിന്റെ തെക്കൻ ചരിവിലേക്കു[b]. പിന്നെ അതിർത്തി താഴത്തെ ബേത്ത്-ഹോരോന്റെ തെക്കുള്ള മലമേൽ അതാരോത്ത്-അദ്ദാറിലേക്കു[c] ഇറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘ലൂസിന്റെ തെക്കുള്ള പാർശ്വത്തിലേക്ക്’; ഇവിടെ ഹീബ്രു പാഠം ഒരു കുന്നിന്റെ വശത്തെയോ ചരിവിനെയോ സൂചിപ്പിക്കാൻ ‘തോൾ’ എന്ന ശരീരഭാഗപദം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ചില ഇംഗ്ലീഷ് പാരമ്പര്യങ്ങളിൽ ഈ സ്ഥലനാമം ‘അത്രോത്ത്-അദ്ദാർ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: കടന്നുപോയി
  rationale: അതിർത്തിരേഖയുടെ ഗതിയെ വിവരിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം; മനുഷ്യർ കടക്കുന്നതായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: הַגְּבוּל
  choice: അതിർത്തി
  rationale: യോശുവയിലെ പ്രദേശപരിധിവിവരണങ്ങൾക്ക് യോജിച്ച സാധാരണ ആധുനിക മലയാളപദം.
- source_word: לוּזָה
  choice: ലൂസിലേക്ക്
  rationale: ദിശാസൂചകമായ ഹീബ്രു പ്രത്യയം മലയാളത്തിലെ ‘-ലേക്ക്’ കൊണ്ടു പ്രതിനിധീകരിച്ചു; സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: ലൂസിന്റെ തെക്കൻ ചരിവിലേക്ക്
  rationale: כֶּתֶף എന്നതിന്റെ അക്ഷരാർഥം ‘തോൾ’ ആണെങ്കിലും ഭൂപ്രകൃതിസന്ദർഭത്തിൽ ഒരു വശമോ ചരിവോ സൂചിപ്പിക്കുന്നു; ‘തെക്കൻ ചരിവ്’ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִיא בֵּית אֵל
  choice: ലൂസ് തന്നെയാണ് ബേഥേൽ
  rationale: ലൂസിനെയും ബേഥേലിനെയും തിരിച്ചറിയിക്കുന്ന ഹീബ്രു സമവാക്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְיָרַד
  choice: ഇറങ്ങി
  rationale: അതിർത്തിയുടെ ഭൂപ്രകൃതിയനുസരിച്ചുള്ള താഴോട്ടുള്ള ഗതി സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: עַטְרוֹת אַדָּר
  choice: അതാരോത്ത്-അദ്ദാർ
  rationale: സംയുക്ത സ്ഥലനാമം ഹീബ്രു വ്യഞ്ജനരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: עַל הָהָר
  choice: മലമേലുള്ള
  rationale: നിർദ്ദിഷ്ടമായ ഏകവചന ഭൂപ്രകൃതിസൂചനയായ ‘ആ മലമേൽ’ എന്ന ആശയം സ്ഥലനാമവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: താഴത്തെ ബേത്ത്-ഹോരോനു തെക്കുള്ള
  rationale: מִנֶּגֶב എന്ന തെക്കൻ സ്ഥാനബന്ധവും תַּחְתּוֹן എന്ന ‘താഴത്തെ’ വിശേഷണവും സംരക്ഷിക്കുന്നു.
