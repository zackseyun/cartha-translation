source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: ml
  text: അതിർത്തി ബെൻ-ഹിന്നോം താഴ്‌വരയ്ക്ക് അഭിമുഖമായുള്ള മലയുടെ അറ്റത്തേക്ക് ഇറങ്ങി; ആ താഴ്‌വര രെഫായീം താഴ്‌വരയുടെ വടക്കേ അറ്റത്താണ്.[a] പിന്നെ അത് ഹിന്നോം താഴ്‌വരയിലൂടെ യെബൂസ്യന്റെ തെക്കൻ ചരിവിലേക്ക്[b] ഇറങ്ങി, തുടർന്ന് ഏൻ-രോഗേലിലേക്ക്[c] ഇറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘ഹിന്നോമിന്റെ മകന്റെ താഴ്‌വര’; ഇവിടെ സ്ഥലനാമമായി ‘ബെൻ-ഹിന്നോം’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘യെബൂസ്യന്റെ തെക്കൻ തോൾ/വശം.’ ഇവിടെ ‘യെബൂസ്യൻ’ യെബൂസ്യരുടെ പാർപ്പിടമായ യെരൂശലേമിനെ സൂചിപ്പിക്കാം; എന്നാൽ മൂലപാഠത്തിൽ ‘നഗരം’ എന്ന പദമില്ല.
    reason: lexical_alternative
  - marker: c
    text: ഏൻ-രോഗേൽ ഒരു സ്ഥലനാമമാണ്; അക്ഷരാർഥത്തിൽ ‘രോഗേലിന്റെ ഉറവ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: അതിർത്തി ... ഇറങ്ങി
  rationale: ירד എന്ന ക്രിയയുടെ ഭൂപ്രകൃതിസംബന്ധമായ ‘താഴേക്ക് പോകുക’ എന്ന അർഥം ‘ഇറങ്ങി’ സ്വാഭാവികമായി നിലനിർത്തുന്നു; גְּבוּל പ്രദേശപരിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിർത്തി’ എന്നു നൽകി.
- source_word: קְצֵה הָהָר
  choice: മലയുടെ അറ്റം
  rationale: קָצֶה എന്നതിന്റെ ‘അറ്റം/അഗ്രഭാഗം’ എന്ന അർഥവും הָר എന്നതിന്റെ സാധാരണ അർഥമായ ‘മല’യും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: ബെൻ-ഹിന്നോം താഴ്‌വരയ്ക്ക് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי ഇവിടെ സ്ഥലപരമായ ‘അഭിമുഖമായി/എതിർവശത്ത്’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: ആ മല രെഫായീം താഴ്‌വരയുടെ വടക്കേ അറ്റത്താണ്
  rationale: צָפוֹנָהയുടെ വടക്കോട്ടുള്ള സ്ഥാനസൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ‘ആ മല’ എന്നത് ബന്ധവാക്യത്തിന്റെ സാധ്യതയേറിയ പൂർവപദം വ്യക്തമാക്കുന്നു.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: യെബൂസ്യന്റെ തെക്കൻ ചരിവിലേക്ക്
  rationale: כֶּתֶף അക്ഷരാർഥത്തിൽ ‘തോൾ’ എങ്കിലും ഭൂപ്രകൃതിയിൽ ‘ചരിവ്/വശം’ എന്നാണ്. മൂലത്തിൽ ‘നഗരം’ ഇല്ലാത്തതിനാൽ അത് ചേർക്കാതെ הַיְבוּסִי എന്ന ഏകവചനരൂപത്തിന്റെ അസ്പഷ്ടത നിലനിർത്തി.
- source_word: עֵין רֹגֵל
  choice: ഏൻ-രോഗേൽ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
