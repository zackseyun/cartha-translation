translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അതിർത്തിവിവരണത്തിന്റെ ആവർത്തനവും ഭൂപ്രകൃതിദിശയും നിലനിർത്തി. ‘യെബൂസ്യൻ’ എന്ന മൂലത്തിലെ അസ്പഷ്ട പരാമർശം മുഖ്യവാചകത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
