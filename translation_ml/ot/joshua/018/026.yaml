lexical_decisions:
- source_word: וְ
  choice: -യും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച സ്ഥലനാമപ്പട്ടികയിലെ ഇനങ്ങളെ ഏകോപിപ്പിക്കുന്ന ഹീബ്രു സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ പട്ടികാസംയോജകമായ ‘-യും’കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: הַמִּצְפֶּה
  choice: ഹമിസ്പേ
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ ‘കാവൽസ്ഥലം’ എന്നു അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു. മുൻപ്രത്യയമായ നിർദേശകോപപദം പേരിന്റെ ഭാഗമായി ‘ഹ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: הַכְּפִירָה
  choice: ഹക്കെഫീര
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ഹീബ്രു നിർദേശകോപപദവും തുടർന്നുള്ള വ്യഞ്ജനത്തിന്റെ ദ്വിത്വവും ‘ഹക്കെ-’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: הַמֹּצָה
  choice: ഹമ്മോസ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; മുൻപ്രത്യയമായ നിർദേശകോപപദവും വ്യഞ്ജനദ്വിത്വവും ‘ഹമ്മോ-’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
