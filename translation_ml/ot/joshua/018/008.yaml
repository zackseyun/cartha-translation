base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ പുരുഷന്മാർ എഴുന്നേറ്റു പുറപ്പെട്ടു. ദേശത്തിന്റെ വിവരണം എഴുതാൻ പോകുന്നവരോട് യോശുവ ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങൾ പോയി ദേശത്തിലൂടെ സഞ്ചരിച്ച് അതിന്റെ വിവരണം എഴുതുക[a]. പിന്നെ എന്റെ അടുക്കൽ മടങ്ങിവരുക. ഇവിടെ ശീലോവിൽ യഹ്‌വെയുടെ സന്നിധിയിൽ ഞാൻ നിങ്ങൾക്കായി നറുക്കിടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ദേശം എഴുതുക” എന്നാണ്; അവകാശവിഭജനത്തിനായി ദേശത്തെ എഴുത്തിൽ രേഖപ്പെടുത്തുകയോ വിവരിക്കുകയോ ചെയ്യുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: ആ പുരുഷന്മാർ എഴുന്നേറ്റു പുറപ്പെട്ടു
  rationale: קום, הלך എന്നീ തുടർച്ചയായ ആഖ്യാനക്രിയകളെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; הָאֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനത്തെ ‘പുരുഷന്മാർ’ എന്നു കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന צוהയുടെ അർഥവും പിന്നാലെയുള്ള ആജ്ഞാരൂപങ്ങളും വ്യക്തമാക്കുന്നു.
- source_word: הַהֹלְכִים לִכְתֹּב אֶת־הָאָרֶץ
  choice: ദേശത്തിന്റെ വിവരണം എഴുതാൻ പോകുന്നവർ
  rationale: എബ്രായത്തിലെ ‘ദേശം എഴുതുക’ എന്ന അസാധാരണ പ്രയോഗത്തിന്റെ എഴുത്തുപരമായ സർവേ/വിവരണ അർഥം വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: ദേശത്തിലൂടെ സഞ്ചരിക്കുക
  rationale: הלך എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപം സൂചിപ്പിക്കുന്ന ദേശമെങ്ങുമുള്ള സഞ്ചാരം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; നിർബന്ധമായി കാൽനടയാത്രയെന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: അതിന്റെ വിവരണം എഴുതുക
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിലെ രേഖാമൂലമായ ദേശവിവരണം വ്യക്തമായി നൽകുന്നു.
- source_word: וְשׁוּבוּ אֵלַי
  choice: എന്റെ അടുക്കൽ മടങ്ങിവരുക
  rationale: שוב എന്ന ക്രിയയുടെ മടങ്ങിവരൽ എന്ന അടിസ്ഥാനാർഥം ഔപചാരികവും സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: ഞാൻ നിങ്ങൾക്കായി നറുക്കിടും
  rationale: അവകാശവിഭജനത്തിനായി നറുക്കിടുന്ന എബ്രായ പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം മലയാളത്തിലെ പതിവുപ്രയോഗത്തിൽ നൽകുന്നു; ഏകവചന גורל മലയാളത്തിൽ സംഖ്യ നിർബന്ധിക്കാത്ത ‘നറുക്ക്’ പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: בְּשִׁלֹה
  choice: ശീലോവിൽ
  rationale: സ്ഥലനാമമായ Shiloh-യുടെ പതിവായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്ത ആധുനിക മലയാളരൂപമാണ്.
- issue: הָאֲנָשִׁים എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: ആ പുരുഷന്മാർ
  alternative: ആ ആളുകൾ
  rationale: ഇവിടെ ദേശസർവേയ്ക്കായി അയയ്ക്കപ്പെട്ട പ്രത്യേക പുരുഷപ്രതിനിധികളെയാണ് പുല്ലിംഗ ബഹുവചനം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- issue: גורל എന്ന ഏകവചനത്തിന്റെ അവതരണം
  choice: നറുക്കിടും
  alternative: ഒരു നറുക്ക് ഇടും / നറുക്കുകൾ ഇടും
  rationale: മൂലത്തിലെ ഏകവചനത്തെ ബഹുവചനമാക്കാതെയും ഒരൊറ്റ വസ്തുനറുക്ക് മാത്രമാണെന്ന അതിവ്യാഖ്യാനം വരുത്താതെയും വിഭജനനടപടിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കല്പിച്ചു’, ‘സന്നിധിയിൽ’ എന്നിവ വാക്യത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തുമ്പോൾ ‘സഞ്ചരിച്ച്’, ‘മടങ്ങിവരുക’, ‘നറുക്കിടും’ എന്നിവ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
