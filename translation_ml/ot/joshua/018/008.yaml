  source_fidelity: 'മൂലപാഠത്തിലെ പ്രവർത്തനക്രമവും അർഥവും കൃത്യമായി പ്രതിഫലിക്കുന്നു: പുരുഷന്മാർ എഴുന്നേറ്റ് പുറപ്പെടുന്നു; യോശുവ ദേശം രേഖപ്പെടുത്താൻ പോകുന്നവരോടു കല്പിക്കുന്നു; ദേശത്തിലൂടെ സഞ്ചരിച്ചു രേഖപ്പെടുത്തി മടങ്ങിവരാൻ പറയുന്നു; ശീലോവിൽ യഹ്‌വെയുടെ സന്നിധിയിൽ നറുക്കിടുമെന്നു പ്രഖ്യാപിക്കുന്നു. הִתְהַלְּכוּ എന്ന ഹിത്പയേൽ രൂപം ‘ദേശത്തിലൂടെ സഞ്ചരിച്ച്’ എന്നതിൽ സ്വാഭാവികമായി വരുന്നു. גורל എന്ന ഏകവചനത്തിന്റെ നടപടിപരമായ അർഥം ‘നറുക്കിടും’ എന്നു നൽകിയത് ഉചിതമാണ്.'
