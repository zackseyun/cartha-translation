source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: ml
  text: തെക്കുഭാഗം കിര്യത്ത്-യെയാരീമിന്റെ അറ്റം മുതലായിരുന്നു. അതിർത്തി പടിഞ്ഞാറോട്ട്[a] നീണ്ട്, നെഫ്തോഹിലെ ജലങ്ങളുടെ ഉറവിലേക്കു[b] ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കടലിലേക്കു’; ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ അതിന്റെ അർഥം ‘പടിഞ്ഞാറോട്ട്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തോട് കൂടുതൽ അടുത്ത രൂപം ‘നെഫ്തോഹിലെ ജലങ്ങളുടെ ഉറവ്’ എന്നാണ്; ഇതിനെ ‘നെഫ്തോഹിന്റെ ഉറവ്’ എന്നും ലളിതമായി പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: തെക്കുഭാഗം
  rationale: פֵאָה എന്നത് ഇവിടെ പ്രദേശത്തിന്റെ ‘ഭാഗം/വശം’ എന്നും נֶגְבָּה തെക്കൻ ദിശയെന്നും സൂചിപ്പിക്കുന്നു. അതിർത്തി എന്ന പദം പിന്നീടു പ്രത്യേകം വരുന്നതിനാൽ ‘തെക്കുഭാഗം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִקְצֵה
  choice: അറ്റംമുതൽ
  rationale: קָצֶה എന്നതിന്റെ സ്ഥലപരമായ ‘അറ്റം, അതിരറ്റം’ എന്ന അർഥം അതിർത്തിവിവരണത്തിന് അനുയോജ്യമായി നൽകുന്നു.
- source_word: קִרְיַת יְעָרִים
  choice: കിര്യത്ത്-യെയാരീം
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְיָצָא הַגְּבוּל
  choice: അതിർത്തി ... നീണ്ട്
  rationale: יָצָא അക്ഷരാർഥത്തിൽ ‘പുറപ്പെട്ടു/പുറത്തേക്കു പോയി’ എന്നാണ്; അതിർത്തിരേഖയുടെ ഗതിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വിവരിക്കാൻ ‘നീണ്ട്’ ഉപയോഗിച്ചു.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: അക്ഷരാർഥം ‘കടലിലേക്കു’ എന്നാണെങ്കിലും ഇസ്രായേൽദേശത്തിന്റെ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ഇത് പടിഞ്ഞാറൻ ദിശയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְיָצָא אֶל
  choice: '...ലേക്കു ചെന്നു'
  rationale: ആവർത്തിക്കുന്ന יָצָא അതിർത്തി അടുത്ത സ്ഥാനത്തേക്കു തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചെന്നു’ ആവർത്തനം പൂർണമായി അനുകരിക്കാതെ അതിന്റെ ചലനാർഥം നിലനിർത്തുന്നു.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: നെഫ്തോഹിലെ വെള്ളത്തിന്റെ ഉറവ്
  rationale: מַעְיַן ‘ഉറവ്’ എന്നും מֵי ‘വെള്ളം/ജലം’ എന്ന പദത്തിന്റെ construct രൂപവുമാണ്. ഉറവിനെയും നെഫ്തോഹിലെ വെള്ളത്തെയും തമ്മിൽ ബന്ധിപ്പിക്കുന്ന എബ്രായ ഘടന പരമാവധി നിലനിർത്തി.
- source_word: נֶפְתּוֹחַ
  choice: നെഫ്തോഹ്
  rationale: സ്ഥലനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു.
