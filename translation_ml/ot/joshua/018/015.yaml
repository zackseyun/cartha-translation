translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ അതിർത്തിവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ക്രിയാരഹിതമായ ആദ്യഖണ്ഡത്തിന് മലയാളത്തിൽ ആവശ്യമായ ‘ആയിരുന്നു’ ചേർത്തു; ആവർത്തിക്കുന്ന അതിർത്തി-സൂത്രവാക്യം സ്വാഭാവികമായി അവതരിപ്പിച്ചെങ്കിലും ദിശയും ലക്ഷ്യസ്ഥാനവും കൃത്യമായി നിലനിർത്തി.
