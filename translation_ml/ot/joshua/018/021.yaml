id: JOS.18.21
reference: Joshua 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: ml
  text: 'അവരുടെ കുലങ്ങൾപ്രകാരം ബെന്യാമീൻമക്കളുടെ ഗോത്രത്തിനുള്ള പട്ടണങ്ങൾ ഇവയായിരുന്നു: യെരീഹോ, ബേത്ത്-ഹൊഗ്ലാ, ഏമെക്-കെസീസ്[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കെസീസ് താഴ്‌വര’; ഈ പേര് ഒരു സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരിപ്പിക്കാതെ വിവരണാത്മകമായ സ്ഥലനാമമായി മനസ്സിലാക്കുന്നുവെങ്കിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: പട്ടണങ്ങൾ ഇവയായിരുന്നു
  rationale: പട്ടണപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സംയുക്തപ്രയോഗത്തിന്റെ ക്രമാനുഗത സ്വഭാവവും ഭൂതകാല ക്രിയയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കളുടെ ഗോത്രത്തിനുള്ള
  rationale: לְ എന്ന മുൻപ്രത്യയം ഇവിടെ ഗോത്രവിഹിതത്തോടുള്ള ബന്ധമോ അവകാശമോ സൂചിപ്പിക്കുന്നു; ‘ഗോത്രത്തിനുള്ള’ എന്നത് മൂലത്തിലെ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു. בְּנֵי എന്ന ബന്ധുത്വപ്രയോഗം ‘മക്കൾ’ എന്നു നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: മִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനകത്തെ ഉപവിഭാഗമായ കുലത്തെ സൂചിപ്പിക്കുന്നു; ലְ എന്നത് വിതരണപരമായ ‘പ്രകാരം’ എന്ന അർഥത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: יְרִיחוֹ
  choice: യെരീഹോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בֵית חָגְלָה
  choice: ബേത്ത്-ഹൊഗ്ലാ
  rationale: בית-സംയുക്തമായ സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: עֵמֶק קְצִיץ
  choice: ഏമെക്-കെസീസ്
  rationale: עֵמֶק എന്നതിന് സാധാരണയായി ‘താഴ്‌വര’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ അത് സംയുക്ത സ്ഥലനാമത്തിന്റെ ഭാഗമായിരിക്കാം; അതിനാൽ പ്രധാനപാഠത്തിൽ മുഴുവൻ പേര് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ബന്ധുത്വപ്രയോഗമായ ‘ബെന്യാമീൻമക്കൾ’ നിലനിർത്തിയപ്പോൾ, ഗോത്രവിഹിതത്തിന്റെ ആശയം അധികമായി വിശദീകരിക്കാതെ ‘ഗോത്രത്തിനുള്ള’ എന്നു സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പിന്റെ അടയാളം അതുമായി യഥാർത്ഥത്തിൽ ബന്ധപ്പെട്ട ഏമെക്-കെസീസ് എന്ന പേരിനോടാണ് ചേർത്തിരിക്കുന്നത്.
