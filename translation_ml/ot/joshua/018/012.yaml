id: JOS.18.12
reference: Joshua 18:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֧ם הַ/גְּב֛וּל לִ/פְאַ֥ת צָפ֖וֹנָ/ה מִן הַ/יַּרְדֵּ֑ן וְ/עָלָ֣ה הַ/גְּבוּל֩ אֶל כֶּ֨תֶף יְרִיח֜וֹ מִ/צָּפ֗וֹן וְ/עָלָ֤ה בָ/הָר֙ יָ֔מָּ/ה ו/היה תֹּֽצְאֹתָ֔י/ו מִדְבַּ֖רָ/ה בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: ml
  text: അവരുടെ വടക്കുഭാഗത്തെ അതിർത്തി യോർദ്ദാനിൽനിന്ന് ആരംഭിച്ചു. ആ അതിർത്തി യെരീഹോയുടെ വടക്കുള്ള ചരിവിലേക്കു കയറി, അവിടെനിന്ന് പടിഞ്ഞാറോട്ടു മലനാട്ടിലേക്കു കയറിച്ചെന്നു; അതിന്റെ അറ്റം ബേത്ത്-ആവെൻ മരുഭൂമിയിലായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘അതിന്റെ പുറപ്പെടുന്ന ഇടങ്ങൾ’ അഥവാ ‘അതിന്റെ അറ്റങ്ങൾ’; ഹീബ്രുവിൽ അതിർത്തിയുടെ അവസാനസ്ഥാനം സൂചിപ്പിക്കുന്ന ബഹുവചന ഭൂമിശാസ്ത്രപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: വടക്കുഭാഗത്തെ
  rationale: പֵאָה അതിർത്തിവിവരണത്തിൽ ഭാഗം, വശം, അറ്റം എന്നീ അർഥങ്ങൾ നൽകുന്നു; ഇവിടെ സ്വാഭാവികമായ മലയാളത്തിൽ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: מִן הַיַּרְדֵּן
  choice: യോർദ്ദാനിൽനിന്ന് ആരംഭിച്ചു
  rationale: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘യോർദ്ദാനിൽനിന്ന്’ എന്നാണ്; അതിർത്തിയുടെ തുടക്കസ്ഥാനം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ആരംഭിച്ചു’ ചേർത്തു.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: യെരീഹോയുടെ വടക്കുള്ള ചരിവിലേക്കു
  rationale: כֶּתֶף എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘തോൾ’ ആണെങ്കിലും ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ വശമോ ചരിവോ സൂചിപ്പിക്കുന്നു; מִצָּפוֹן ഏത് വശമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְעָלָה בָהָר יָמָּה
  choice: പടിഞ്ഞാറോട്ടു മലനാട്ടിലേക്കു കയറിച്ചെന്നു
  rationale: הָר ഇവിടെ ഒറ്റമലയേക്കാൾ മലപ്രദേശത്തെ സൂചിപ്പിക്കാം; יָמָּה ദിശാവാചകമായി ‘പടിഞ്ഞാറോട്ട്’ എന്നാണ്. עלהയിലെ ഉയരത്തിലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: תֹּצְאֹתָיו
  choice: അതിന്റെ അറ്റം
  rationale: രൂപം ബഹുവചനമാണെങ്കിലും അതിർത്തിവിവരണത്തിലെ സാങ്കേതിക പ്രയോഗം അവസാനസ്ഥാനം അല്ലെങ്കിൽ പുറത്തെ അറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: מִדְבָּרָה בֵּית אָוֶן
  choice: ബേത്ത്-ആവെൻ മരുഭൂമിയിലായിരുന്നു
  rationale: ദിശാസൂചകമായ -ָה രൂപം ബേത്ത്-ആവെൻ മരുഭൂമിയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിച്ചാലും תֹּצְאֹתָיו എന്ന അതിർത്തിയുടെ അറ്റവുമായി ചേർന്ന് അന്തിമസ്ഥാനം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി. യോർദ്ദാൻ, യെരീഹോ, ബേത്ത്-ആവെൻ എന്നീ സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾപരമ്പരയോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
