lexical_decisions:
- source_word: הָעַוִּים
  choice: അവ്വീം
  rationale: ദേശവിഭജനവുമായി ബന്ധപ്പെട്ട ഈ സ്ഥലനാമപ്പട്ടികയിൽ ഇതിനെ ഒരു ജനവിഭാഗത്തിന്റെ പേരായി അല്ല, പട്ടണത്തിന്റെ പേരായി സ്വീകരിക്കുന്നു. ഹീബ്രായ പേരിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ നിലനിർത്തുന്നു.
- source_word: הַפָּרָה
  choice: പാരാ
  rationale: ബെന്യാമീന്റെ അവകാശപ്രദേശത്തുള്ള സ്ഥലനാമമാണിത്. ഹീബ്രായ നിർദേശകോപസർഗം വേർതിരിച്ച് പരിഭാഷപ്പെടുത്താതെ പേരിന്റെ സ്വാഭാവിക ശബ്ദരൂപം നൽകുന്നു.
- source_word: עָפְרָה
  choice: ഒഫ്രാ
  rationale: ഇവിടെ സാധാരണനാമമല്ല, സ്ഥലനാമമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ഹീബ്രായ പേരിന്റെ പ്രചാരമുള്ള ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְ
  choice: പട്ടികയിലെ കോമകൾ
  rationale: ആവർത്തിച്ചുവരുന്ന ഹീബ്രായ സംയോജകപദം സ്ഥലനാമങ്ങളെ ഒരു ലളിതമായ പട്ടികയായി ബന്ധിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ കോമകൾകൊണ്ട് ആ ബന്ധം വ്യക്തമാകുന്നു.
