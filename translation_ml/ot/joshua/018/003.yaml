id: JOS.18.3
reference: Joshua 18:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: ml
  text: 'യോശുവ യിസ്രായേൽമക്കളോടു[a] പറഞ്ഞു: “നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവമായ യഹ്‌വെ നിങ്ങൾക്കു നൽകിയിരിക്കുന്ന ദേശത്തു പ്രവേശിച്ചു അതു കൈവശമാക്കുന്നതിൽ നിങ്ങൾ എത്രകാലം അലസത കാണിച്ചുകൊണ്ടിരിക്കും?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യിസ്രായേല്യരോടു.” അക്ഷരാർഥം: “യിസ്രായേലിന്റെ മക്കളോടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയകൊണ്ട് അവതരിപ്പിക്കുന്നു; പ്രത്യേകമായ കാരണബന്ധം ചേർക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധസൂചകമായ ഹീബ്രു പ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַד אָנָה
  choice: എത്രകാലം
  rationale: ശാസനാഭാവമുള്ള ഹീബ്രു കാലപ്രശ്നത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִתְרַפִּים
  choice: മടിച്ചുനിൽക്കും
  rationale: רפה എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന അലസത, വീഴ്ച, പ്രവർത്തിക്കാൻ മനസ്സില്ലായ്മ എന്നീ ഭാവങ്ങൾ അനാവശ്യമായി കടുത്ത ധാർമ്മിക വിധി ചേർക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: לָבוֹא
  choice: ദേശത്തു ചെന്നു
  rationale: ദേശത്തിനകത്തു പ്രവേശിക്കുന്ന ദിശാസൂചന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לָרֶשֶׁת
  choice: അതു കൈവശമാക്കുന്നതിൽ
  rationale: ירשׁ എന്ന ക്രിയയുടെ കൈവശപ്പെടുത്തുക/അവകാശമാക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; നിയമപരമായ ‘അവകാശം ലഭിക്കുക’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട പരാമർശമാണ്.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: നിങ്ങൾക്കു തന്നിരിക്കുന്ന
  rationale: ദേശം ദൈവം ഇതിനകം നൽകിയതായും അതിന്റെ കൈവശപ്പെടുത്തൽ ഇനിയും പൂർത്തിയാകാനുണ്ടെന്നും ഉള്ള പൂർണക്രിയയുടെ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഹീബ്രുവിലെ ഉടമ്പടിപരവും തലമുറബന്ധപരവുമായ സ്ഥിരപ്രയോഗം അതിന്റെ വ്യക്തമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം Yahweh-ന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; ‘യഹോവ’ Jehovah എന്ന വ്യത്യസ്ത പരമ്പരാഗത രൂപത്തോടാണ് കൂടുതൽ അടുത്തത്.
- issue: ദേശം നൽകിയതും ഇനിയും കൈവശമാക്കേണ്ടതുമായുള്ള കാലഭാവം
  choice: നിങ്ങൾക്കു തന്നിരിക്കുന്ന ദേശം
  alternative: നിങ്ങൾക്കു തരുന്ന ദേശം
  rationale: നָתַן എന്ന പൂർണക്രിയ ദൈവിക ദാനം പൂർത്തിയായ യാഥാർഥ്യമായി അവതരിപ്പിക്കുമ്പോഴും ജനങ്ങളുടെ പ്രവേശനവും കൈവശപ്പെടുത്തലും ശേഷിക്കുന്നു; ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘മടിച്ചുനിൽക്കും’ എന്നത് ശാസനാഭാവം നിലനിർത്തുന്നു; ‘ദേശത്തു ചെന്നു അതു കൈവശമാക്കുക’ എന്ന ക്രമം പ്രവേശനവും അധീനതയും രണ്ടും വ്യക്തമാക്കുന്നു.
