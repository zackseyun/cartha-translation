id: JOS.18.11
reference: Joshua 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: ml
  text: ബെന്യാമീൻമക്കളുടെ ഗോത്രത്തിന് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച് നറുക്ക് വീണു; നറുക്കിലൂടെ അവർക്കു ലഭിച്ച പ്രദേശം[a] യെഹൂദാമക്കളുടെയും യോസേഫ്മക്കളുടെയും[b] ഇടയിലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അവരുടെ നറുക്കവകാശത്തിന്റെ അതിർത്തി യെഹൂദാമക്കളുടെയും യോസേഫ്മക്കളുടെയും ഇടയിൽ വന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: “യോസേഫ്മക്കൾ” എന്നത് യോസേഫിൽനിന്നു വന്ന ഗോത്രങ്ങളെ, വിശേഷിച്ച് എഫ്രയീം, മനശ്ശെ ഗോത്രങ്ങളെ, കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: നറുക്ക് വീണു
  rationale: എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘മുകളിലേക്കു വന്നു’ എന്നാണെങ്കിലും, നറുക്കെടുപ്പിന്റെ ഫലം ലഭിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം ‘നറുക്ക് വീണു’ എന്നാണ്.
- source_word: גּוֹרָל
  choice: നറുക്ക്
  rationale: ഭൂമി വിഭജിക്കാൻ ഉപയോഗിച്ച നറുക്കിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ഫലമായ ഓഹരിയേക്കാൾ വിഭജനമാർഗത്തെ ഇത് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഇവിടെ പദം ‘വടി’ എന്ന അക്ഷരാർഥത്തിലല്ല, ഇസ്രായേലിലെ ഗോത്രവിഭാഗം എന്ന അർഥത്തിലാണ്.
- source_word: בְנֵי בִנְיָמִן
  choice: ബെന്യാമീൻമക്കൾ
  rationale: എബ്രായത്തിലെ സന്തതിബന്ധം നിലനിർത്തിക്കൊണ്ട് ഒരു ഗോത്രജനതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശീയ-കുടുംബ വിഭാഗങ്ങളെയാണ് מִשְׁפָּחוֹת സൂചിപ്പിക്കുന്നത്; ‘കുലങ്ങൾ’ ആ സാമൂഹിക ഘടന വ്യക്തമാക്കുന്നു.
- source_word: גְּבוּל גּוֹרָלָם
  choice: നറുക്കിലൂടെ അവർക്കു ലഭിച്ച പ്രദേശം
  rationale: גְּבוּל എന്നതിന് ‘അതിർത്തി’ എന്നും അതിർത്തി നിർണയിക്കുന്ന ‘പ്രദേശം’ എന്നും അർഥമാകാം. രണ്ട് ജനവിഭാഗങ്ങൾക്കിടയിൽ കിടക്കുന്ന ഭൂവിഭാഗമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് എന്നതിനാൽ പ്രധാനവാചകത്തിൽ ‘പ്രദേശം’ സ്വാഭാവികമാണ്; ‘അതിർത്തി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: …യുടെയും …യുടെയും ഇടയിൽ
  rationale: ബെന്യാമീന്റെ ഓഹരി യെഹൂദയുടെയും യോസേഫിന്റെയും ഗോത്രപ്രദേശങ്ങൾക്കിടയിലായിരുന്നുവെന്ന സ്ഥാനബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יְהוּדָה / בְנֵי יוֹסֵף
  choice: യെഹൂദാമക്കൾ / യോസേഫ്മക്കൾ
  rationale: ആദിപാഠത്തിലെ സമാന്തരമായ സന്തതിപ്രയോഗം നിലനിർത്തുന്നു; ഇവ വ്യക്തികളുടെ നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, അവരിൽനിന്നുള്ള ഗോത്രജനതകളെയും സൂചിപ്പിക്കുന്നു.
