translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ബെന്യാമീൻമക്കൾ’, ‘യെഹൂദാമക്കൾ’, ‘യോസേഫ്മക്കൾ’ എന്നീ രൂപങ്ങൾ ആദിപാഠത്തിലെ ബന്ധസൂചന നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഭൂമി വിഭജിക്കുന്ന നറുക്കെടുപ്പിനെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘നറുക്ക് വീണു’ ഉപയോഗിച്ചു.
