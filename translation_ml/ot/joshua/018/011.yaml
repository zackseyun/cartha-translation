  source_fidelity: The translation accurately conveys the lot assigned to Benjamin's tribe according to its clans and the resulting tract situated between Judah and Joseph. ‘നറുക്ക് വീണു’ is a natural Malayalam contextual rendering of וַיַּעַל in a lot-casting setting. Rendering גְּבוּל גּוֹרָלָם as ‘നറുക്കിലൂടെ അവർക്കു ലഭിച്ച പ്രദേശം’ appropriately expresses the territorial sense in context, while the footnote preserves the more literal ‘boundary’ alternative.
