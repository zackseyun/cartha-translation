- source_word: כְפַר העמני
  choice: കെഫർ-ഹാ-അമ്മോനി
  rationale: സ്ഥലനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് അടുത്ത് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള പട്ടികാശൈലിയിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
