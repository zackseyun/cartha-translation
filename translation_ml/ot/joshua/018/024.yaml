translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; പട്ടികയുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തി. ‘അവയുടെ ഗ്രാമങ്ങൾ ഉൾപ്പെടെ’ എന്ന പ്രയോഗം പട്ടണങ്ങളോടനുബന്ധിച്ച ഗ്രാമങ്ങൾ എന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
