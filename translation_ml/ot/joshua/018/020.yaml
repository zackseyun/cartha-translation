  text: וְ/הַ/יַּרְדֵּ֥ן יִגְבֹּל אֹת֖/וֹ לִ/פְאַת קֵ֑דְמָ/ה זֹ֡את נַחֲלַת֩ בְּנֵ֨י בִנְיָמִ֧ן לִ/גְבֽוּלֹתֶ֛י/הָ סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: ml
  text: ബെന്യാമീന്റെ അവകാശഭൂമിയുടെ കിഴക്കുവശത്ത് യോർദ്ദാൻ അതിർത്തിയായിരുന്നു.[a] ചുറ്റുമുള്ള അതിരുകൾക്കനുസരിച്ച്, കുലങ്ങൾക്കനുസരിച്ച്, ഇതായിരുന്നു ബെന്യാമീന്റെ മക്കളുടെ[b] അവകാശഭൂമി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന് അതിരിട്ടു” / “അതിന്റെ അതിർത്തിയായി വർത്തിച്ചു.” യോർദ്ദാൻ ബെന്യാമീന്റെ അവകാശഭൂമിയുടെ അതിർത്തിയായിരുന്നുവെന്നാണ് ഹീബ്രു ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ബെന്യാമീന്റെ മക്കൾ” എന്നത് ബെന്യാമീന്റെ സന്തതികളായ ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പേരായതിനാൽ ‘നദി’ എന്നു വികസിപ്പിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: יִגְבֹּל אֹתוֹ
  choice: അതിന്റെ ... അതിരായിരുന്നു
  rationale: ഈ ഭൂപ്രദേശസന്ദർഭത്തിൽ גבל എന്ന ക്രിയ യോർദ്ദാൻ അതിർത്തിയായി വർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; വസ്തുപ്രത്യയം ബെന്യാമീന്റെ അവകാശഭൂമിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְאַת קֵדְמָה
  choice: കിഴക്കുവശത്ത്
  rationale: פאה എന്നത് വശം/അരിക് എന്നും קֵדְמָה കിഴക്ക് എന്നും സൂചിപ്പിക്കുന്നു; ചേർന്ന രൂപം പ്രദേശത്തിന്റെ കിഴക്കൻ അതിർത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: זֹאת נַחֲלַת
  choice: ലഭിച്ച അവകാശഭൂമി ഇതായിരുന്നു
  rationale: נחלה ഗോത്രത്തിന് ഓഹരിയായി ലഭിച്ച ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ക്രിയാരഹിത വാക്യത്തിന് ആഖ്യാനസന്ദർഭത്തിൽ ‘ഇതായിരുന്നു’ ചേർത്തു.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ മക്കൾ
  rationale: ഹീബ്രുവിലെ വംശീയ-ഗോത്രപരമായ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇത് ബെന്യാമീന്റെ സന്തതികളായ ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: ചുറ്റുമുള്ള അതിരുകൾക്കനുസരിച്ച്
  rationale: അവകാശഭൂമിയുടെ മുഴുവൻ ചുറ്റളവിലും നിർവചിക്കപ്പെട്ട അതിരുകളെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾ തിരിച്ച്
  rationale: מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ വംശകുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഭൂവിഭജനസന്ദർഭത്തിൽ ‘കുലങ്ങൾ തിരിച്ച്’ എന്നത് വിതരണക്രമം വ്യക്തമായി നൽകുന്നു.
