translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഭൂവിഭജനത്തിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം നിലനിർത്താൻ ‘അവകാശഭൂമി’ ഉപയോഗിച്ചു; ഗോത്രത്തിനുള്ളിലെ കുടുംബവിഭാഗങ്ങൾക്ക് ‘കുലങ്ങൾ’ തെരഞ്ഞെടുത്തു.
