  to: പിന്നെ അതിർത്തി വളഞ്ഞ്, തെക്കുവശത്തുള്ള ബേത്ത്-ഹോരോന് അഭിമുഖമായ മലയിൽനിന്ന് പടിഞ്ഞാറുവശത്തേക്കു തെക്കോട്ടു തിരിഞ്ഞു. അതിന്റെ അറ്റം യെഹൂദായുടെ മക്കളുടെ[a] പട്ടണമായ കിര്യത്ത്-ബാലിൽ (അതായത്, കിര്യത്ത്-യെയാരീമിൽ) ആയിരുന്നു. ഇതായിരുന്നു പടിഞ്ഞാറുവശം.
