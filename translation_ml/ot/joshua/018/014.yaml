source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: ml
  text: പിന്നെ അതിർത്തി വളഞ്ഞ്, തെക്കുവശത്തുള്ള ബേത്ത്-ഹോരോന് അഭിമുഖമായ മലയിൽനിന്ന് പടിഞ്ഞാറുവശത്തേക്കു തെക്കോട്ടു തിരിഞ്ഞു. അതിന്റെ അറ്റം യെഹൂദായുടെ മക്കളുടെ[a] പട്ടണമായ കിര്യത്ത്-ബാലിൽ (അതായത്, കിര്യത്ത്-യെയാരീമിൽ) ആയിരുന്നു. ഇതായിരുന്നു പടിഞ്ഞാറുവശം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യെഹൂദായുടെ മക്കൾ’; ഇവിടെ യെഹൂദാഗോത്രത്തിലെ ജനങ്ങളെയോ അവരുടെ സന്തതികളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  choice: അതിർത്തി വളഞ്ഞ്
  rationale: അതിർത്തിയുടെ ഗതി വരച്ചുകാട്ടുകയോ വളഞ്ഞുനീങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗം; സന്ദർഭത്തിലെ ദിശാമാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വളഞ്ഞ്’ എന്നു നൽകി.
- source_word: וְנָסַב
  choice: തിരിഞ്ഞു
  rationale: അതിർത്തി ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: לִפְאַת יָם נֶגְבָּה
  choice: പടിഞ്ഞാറുവശത്തുകൂടെ തെക്കോട്ടു
  rationale: יָם അതിർത്തിവിവരണങ്ങളിൽ ‘പടിഞ്ഞാറ്’ എന്നും נֶגְבָּה ദക്ഷിണദിശയിലേക്കുള്ള നീക്കം എന്നും സൂചിപ്പിക്കുന്നു; פאהയുടെ ‘വശം’ എന്ന അർഥവും നിലനിർത്തി.
- source_word: מִן הָהָר אֲשֶׁר עַל פְּנֵי בֵית חוֹרוֹן נֶגְבָּה
  choice: ബേത്ത്-ഹോരോണിന് അഭിമുഖമായി തെക്കുള്ള മലയിൽനിന്ന്
  rationale: עַל־פְּנֵי എന്നത് ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘അഭിമുഖമായി/എതിർവശത്ത്’ എന്നർഥം നൽകുന്നു; രണ്ടാമത്തെ נֶגְבָּה മലയുടെ തെക്കൻ സ്ഥാനം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി ചേർത്തു.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: അതിന്റെ അറ്റം ... ആയിരുന്നു
  rationale: അതിർത്തിയുടെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം; പിന്നാലെ ഒറ്റ സ്ഥലനാമം വരുന്നതിനാൽ മലയാളത്തിൽ ഏകവചനമായി നൽകി.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: (അതായത്, കിര്യത്ത്-യെയാരീമിൽ)
  rationale: ഒരേ പട്ടണത്തിന്റെ മറ്റൊരു പേര് തിരിച്ചറിയിക്കുന്ന സമാനാധികരണപ്രയോഗം പരാന്തസിസിൽ വ്യക്തമാക്കി.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: യെഹൂദാമക്കളുടെ പട്ടണം
  rationale: בְּנֵי എന്ന കുടുംബബന്ധപദം ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ‘മക്കൾ’ ഉപയോഗിച്ചു.
- source_word: זֹאת פְּאַת יָם
  choice: ഇതായിരുന്നു പടിഞ്ഞാറുവശം
  rationale: അതിർത്തിയുടെ പടിഞ്ഞാറൻ വശത്തെ സംക്ഷിപ്തമായി തിരിച്ചറിയിക്കുന്ന സമാപനവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
