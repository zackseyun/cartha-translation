  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ ഹീബ്രു രൂപങ്ങളോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ഹീബ്രുവിലെ ദിശാസംബന്ധമായ ആവർത്തനവും അതിർത്തിയുടെ ഗതിയും കഴിയുന്നത്ര നിലനിർത്തി.
