lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: ബേത്ത്-അരാബാ
  rationale: നഗരങ്ങളുടെ പട്ടികയിലുള്ള സ്ഥലനാമമായതിനാൽ ഘടകങ്ങളുടെ അർഥം വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: צְמָרַיִם
  choice: സെമാരയീം
  rationale: ഇത് ഒരു സ്ഥലനാമമാണ്; എബ്രായത്തിലെ -ַיִם എന്ന അവസാനത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്ന രൂപം സ്വീകരിച്ചു.
- source_word: בֵית אֵל
  choice: ബേഥേൽ
  rationale: സ്ഥിരപ്രയോഗമായ സ്ഥലനാമമായതിനാൽ ‘ദൈവത്തിന്റെ ഭവനം’ എന്നു വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וּ
  choice: എന്നിവയും
  rationale: ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച നഗരപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ എബ്രായത്തിലെ ആവർത്തിത സംയോജകങ്ങളെ സ്വാഭാവിക മലയാളപ്പട്ടികാശൈലിയിൽ അവസാനത്തെ ‘എന്നിവയും’ കൊണ്ട് പ്രതിനിധീകരിച്ചു.
