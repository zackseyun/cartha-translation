source:
  edition: WLC
  text: וַ/יֵּלְכ֤וּ הָֽ/אֲנָשִׁים֙ וַ/יַּעַבְר֣וּ בָ/אָ֔רֶץ וַ/יִּכְתְּב֧וּ/הָ לֶֽ/עָרִ֛ים לְ/שִׁבְעָ֥ה חֲלָקִ֖ים עַל סֵ֑פֶר וַ/יָּבֹ֧אוּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה שִׁלֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: ml
  text: അങ്ങനെ ആ പുരുഷന്മാർ പുറപ്പെട്ടു ദേശത്തിലൂടെ സഞ്ചരിച്ചു. അവർ അതിനെ നഗരങ്ങൾപ്രകാരം ഏഴു ഭാഗങ്ങളായി ഒരു രേഖയിൽ[a] എഴുതിവെച്ചു; പിന്നെ അവർ ശീലോയിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഒരു പുസ്തകത്തിൽ/ചുരുളിൽ”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് എഴുതപ്പെട്ട ഒരു രേഖയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: പുറപ്പെട്ടു
  rationale: ആഖ്യാനത്തിലെ പ്രവർത്തനപരമ്പര ആരംഭിക്കുന്ന הלך എന്ന ക്രിയയെ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യേക ദിശ സൂചിപ്പിക്കുന്നില്ല.
- source_word: הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാർ
  rationale: മുൻസന്ദർഭത്തിൽ നിയോഗിക്കപ്പെട്ട പുരുഷപ്രതിനിധികളെയാണ് നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: ദേശത്തിലൂടെ സഞ്ചരിച്ചു
  rationale: ഭൂപരിശോധനയ്ക്കായി പ്രദേശം കുറുകെ സഞ്ചരിച്ചതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּכְתְּבוּהָ
  choice: അവർ അതിനെ ... എഴുതിവെച്ചു
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുമ്പുള്ള ‘ദേശം’ എന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; എഴുതിയ രേഖപ്പെടുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: לֶעָרִים
  choice: നഗരങ്ങൾപ്രകാരം
  rationale: ഭൂപരിശോധനാ രേഖ നഗരങ്ങളെ അടിസ്ഥാനമാക്കി ക്രമീകരിച്ചിരുന്നുവെന്ന സാധ്യതയുള്ള അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: ഏഴു ഭാഗങ്ങളായി
  rationale: חל́קים എന്ന പദത്തിന്റെ വിഭജനം/ഭാഗങ്ങൾ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘ഓഹരികൾ’ എന്ന് വ്യാഖ്യാനിച്ച് അധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: עַל סֵפֶר
  choice: ഒരു രേഖയിൽ
  rationale: סֵפֶר ഇവിടെ എഴുത്തുരേഖയെയോ ചുരുളിനെയോ സൂചിപ്പിക്കാം; പുരാതന മാധ്യമത്തെ അനാവശ്യമായി ‘പുസ്തകം’ എന്നു പരിമിതപ്പെടുത്താതെ പ്രവർത്തനാർഥം നൽകുന്നു.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: യോശുവയുടെ അടുക്കൽ വന്നു
  rationale: ഹീബ്രു ക്രിയ ‘വന്നു’ എന്നാണ്; സന്ദർഭത്തിൽ മടങ്ങിവരവ് ഉൾക്കൊള്ളാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: ശീലോയിലെ പാളയത്തിൽ
  rationale: യോശുവ ഉണ്ടായിരുന്ന സ്ഥലം സ്വാഭാവിക മലയാളക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
