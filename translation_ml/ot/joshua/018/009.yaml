translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ പ്രവർത്തനക്രമവും ‘ദേശം’ എന്ന പ്രത്യയസൂചനയും സംരക്ഷിച്ചു. നഗരങ്ങളെ അടിസ്ഥാനമാക്കിയ ക്രമീകരണം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകിയതിനാൽ അതിന് വേറെ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
