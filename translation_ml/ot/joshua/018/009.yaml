  source_fidelity: 'ഹീബ്രു വാചകത്തിലെ പ്രവർത്തനക്രമം കൃത്യമായി നിലനിൽക്കുന്നു: നിയോഗിക്കപ്പെട്ട പുരുഷന്മാർ പോയി ദേശത്തിലൂടെ സഞ്ചരിക്കുന്നു, ദേശത്തെ നഗരങ്ങൾപ്രകാരം ഏഴു ഭാഗങ്ങളായി രേഖപ്പെടുത്തുന്നു, തുടർന്ന് ശീലോവിലെ പാളയത്തിൽ യോശുവയുടെ അടുക്കൽ വരുന്നു. ‘ദേശം’ എന്ന സൂചനയുള്ള പ്രത്യയത്തിന്റെ ആശയവും വിവർത്തനത്തിൽ നിലനിൽക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘നഗരങ്ങൾപ്രകാരം’ ഭൂപരിശോധനയുടെ നഗരാധിഷ്ഠിത ക്രമീകരണം സംക്ഷിപ്തമായി അറിയിക്കുന്നു; ‘ഒരു രേഖയിൽ’ എന്ന പ്രയോഗം സന്ദർഭോചിതമാണ്.
  terminology: ‘ദേശം,’ ‘നഗരങ്ങൾപ്രകാരം,’ ‘ഏഴു ഭാഗങ്ങളായി,’ ‘പാളയം,’ ‘യോശുവ,’ ‘ശീലോ’ എന്നിവ യോജിച്ചതാണ്. עַל־סֵפֶר എന്നതിന് ‘ഒരു രേഖയിൽ’ എന്നു നൽകിയതും അടിക്കുറിപ്പിൽ പുസ്തകം/ചുരുൾ എന്ന മാധ്യമസാധ്യത വ്യക്തമാക്കിയതും പാഠത്തിന്റെ അർഥപരിധി സംരക്ഷിക്കുന്നു.
