translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭൂവിഭാഗ-പട്ടികാശൈലി. അപരിചിത സ്ഥലനാമങ്ങൾ മൂലപാഠത്തോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി. ‘യെബൂസ്യൻ’ എന്ന ജനനാമത്തിന്റെ സ്ഥലസൂചകപ്രയോഗം വായനാസൗകര്യത്തിനായി വാചകത്തിൽ വ്യക്തമാക്കിയെങ്കിലും അതിന്റെ അസാധാരണത അടിക്കുറിപ്പുസംബന്ധമായ തീരുമാനത്തിൽ രേഖപ്പെടുത്തി.
