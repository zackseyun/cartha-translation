base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: ml
  text: സേല[a], ഹായേലെഫ്[b], യെബൂസ്യൻ[d] (അതായത്, യെരൂശലേം), ഗിബെയത്ത്[b], കിര്യത്ത്[c]—ആകെ പതിനാലു പട്ടണങ്ങളും അവയുടെ ഗ്രാമങ്ങളും. ഇതാണ് ബെന്യാമീന്റെ മക്കളുടെ കുലങ്ങൾക്കനുസരിച്ചുള്ള അവകാശഭൂമി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേല’ എന്ന സ്ഥലനാമം ‘സേലാഹ്’ എന്നും ലിപ്യന്തരം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഹായേലെഫ്’ എന്നത് ചില വിവർത്തനങ്ങളിൽ ‘യെലെഫ്’ എന്നും ‘ഗിബെയത്ത്’ എന്നത് ‘ഗിബെയാ’ എന്നും നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ഈ വാക്യത്തിലെ ഹീബ്രു പാഠത്തിൽ ‘കിര്യത്ത്’ എന്നാണ്; ‘കിര്യത്ത്-യെആരീം’ എന്നല്ല.
    reason: textual_variant
  - marker: d
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘യെബൂസ്യൻ; അതാണ് യെരൂശലേം’ എന്നാണ്. ‘യെബൂസ്യൻ’ എന്ന ജനനാമരൂപം ഇവിടെ യെരൂശലേമിന്റെ സ്ഥലസൂചകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: സേല
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ, ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: הָאֶלֶף
  choice: ഹായേലെഫ്
  rationale: ഹീബ്രു പാഠത്തിലെ നിർദ്ദിഷ്ട ഉപസർഗമായ ha- നിലനിർത്തിക്കൊണ്ട് സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרֽוּשָׁלִַם
  choice: യെബൂസ്യർ എന്നു വിളിക്കപ്പെട്ട സ്ഥലം—അതായത് യെരൂശലേം
  rationale: അക്ഷരാർഥത്തിൽ ‘യെബൂസ്യൻ; അതാണ് യെരൂശലേം’ എന്ന അസാധാരണ പ്രയോഗം പട്ടികയിൽ സ്ഥലസൂചനയായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ വ്യക്തത വരുത്തുമ്പോഴും മൂലത്തിലെ ജനനാമരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: גִּבְעַת
  choice: ഗിബെയത്ത്
  rationale: ഇവിടത്തെ വ്യഞ്ജനരൂപം പ്രതിഫലിപ്പിക്കുന്ന സ്ഥലനാമ ലിപ്യന്തരണം; പരിചിതമായ ‘ഗിബെയാ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: קִרְיַת
  choice: കിര്യത്ത്
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു പാഠത്തിൽ ഉള്ളത് ‘കിര്യത്ത്’ മാത്രമായതിനാൽ ‘കിര്യത്ത്-യെയാരീം’ എന്നു വിപുലീകരിച്ചില്ല.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה וְ/חַצְרֵי/הֶן
  choice: അവയുടെ ഗ്രാമങ്ങളും ഉൾപ്പെടെ ആകെ പതിനാലു പട്ടണങ്ങൾ
  rationale: עָרִים എന്നത് ‘പട്ടണങ്ങൾ’ എന്നും ആശ്രിതമായ ചെറുകുടിയിരിപ്പുകളെ സൂചിപ്പിക്കുന്ന חצרים എന്നത് ‘ഗ്രാമങ്ങൾ’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: זֹאת נַחֲלַת
  choice: ഇതായിരുന്നു ... ലഭിച്ച അവകാശഭൂമി
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു സമാപനസൂത്രം വിവരണസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാല മലയാളവാക്യമായി നൽകി.
- source_word: בְּנֵי בִנְיָמִן לְ/מִשְׁפְּחֹתָם
  choice: ബെന്യാമീന്റെ മക്കൾക്ക് അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: ‘മക്കൾ’ എന്ന കുടുംബ-ഗോത്ര പ്രയോഗവും മִשְׁפָּחָה സൂചിപ്പിക്കുന്ന കുലതലത്തിലുള്ള വിഭജനവും നിലനിർത്തി.
