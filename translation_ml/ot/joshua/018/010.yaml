  terminology: യഹോവ എന്ന ദൈവനാമരൂപം മൂലത്തിലെ יהוהയെ പേരായിത്തന്നെ പ്രതിഫലിപ്പിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ ബൈബിൾമലയാളത്തിൽ സ്വീകാര്യമായ കോർപ്പറേറ്റ് പ്രയോഗമാണ്; അടിക്കുറിപ്പ് അതിന്റെ അക്ഷരാർഥവും ഉൾക്കൊള്ളുന്ന അർഥവും വ്യക്തീകരിക്കുന്നു. ‘വിഭാഗങ്ങൾക്കനുസരിച്ച്’ כְּמַחְלְקֹתָם എന്ന പദത്തിന്റെ വിഭജന/ഭരണപരമായ സൂചന സംരക്ഷിക്കുന്നു.
