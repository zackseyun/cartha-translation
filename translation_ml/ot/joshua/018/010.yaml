  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ ശീലോവിൽ യഹോവയുടെ സന്നിധിയിൽ അവർക്കുവേണ്ടി നറുക്കിട്ടു; അവിടെവെച്ച് യോശുവ ദേശം ഇസ്രായേൽമക്കൾക്ക്[a] അവരുടെ വിഭാഗങ്ങൾക്കനുസരിച്ച് വിഭജിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഈ പ്രയോഗം ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: നറുക്കിട്ടു
  rationale: ‘നറുക്ക് എറിയുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന സ്ഥിരപ്രയോഗമാണ് ‘നറുക്കിടുക’; ഭൂവിഭജനത്തിനായുള്ള നറുക്കെടുപ്പാണ് സന്ദർഭം.
- source_word: בְּשִׁלֹה
  choice: ശീലോവിൽ
  rationale: പൊതുപ്രവൃത്തി നടന്ന സ്ഥലത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്ഥലനാമത്തോടു ചേർന്ന ‘-യിൽ’ സ്വാഭാവികമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: യഹോവയുടെ മുമ്പാകെ, അവന്റെ സാന്നിധ്യത്തിൽ നടന്ന പ്രവൃത്തി എന്ന അർഥം വ്യക്തവും ആദരപൂർവവുമായി നൽകുന്നു.
- source_word: וַיְחַלֵּק
  choice: വിഭജിച്ചുകൊടുത്തു
  rationale: ദേശത്തെ വെറും ഭാഗങ്ങളാക്കുക മാത്രമല്ല, ഇസ്രായേൽമക്കൾക്കു വിഹിതമായി നൽകുക എന്ന സന്ദർഭാർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: മുമ്പ് പറഞ്ഞ ശീലോവിലേക്കു വ്യക്തമായി മടങ്ങിച്ചൂണ്ടുകയും പ്രവൃത്തി അവിടെ നടന്നുവെന്ന് സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: യോശുവയുടെ പുസ്തകത്തിൽ ഇസ്രായേലിനു വിഭജിച്ചുനൽകുന്ന നിർദിഷ്ട ഭൂപ്രദേശമാണ് ഉദ്ദേശ്യം; ‘ദേശം’ ഈ ഉടമ്പടി-ഭൗമിക അർഥം നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപത്തോടു അടുത്തുനിൽക്കുന്നതോടൊപ്പം, മുഴുവൻ ഇസ്രായേൽജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബൈബിൾ മലയാളപ്രയോഗമാണിത്.
- source_word: כְּמַחְלְקֹתָם
  choice: അവരുടെ വിഭാഗങ്ങൾക്കനുസരിച്ച്
  rationale: വിഭജനക്രമത്തിലുള്ള ഗോത്രപരമായ വിഭാഗങ്ങളെയോ കൂട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ ഭരണപരമായ അർഥം നിലനിർത്തുന്നു; ‘വിഹിതങ്ങൾ’ എന്ന് മാറ്റി ഫലത്തെ മാത്രം മുൻനിർത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുവായി പരിചിതമായ മലയാളരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ച് ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവപൂർവവുമായ വാക്യഘടന ഉപയോഗിച്ചു. നറുക്കിടൽ, യഹോവയുടെ സന്നിധി, ദേശവിഭജനം എന്നീ മുഖ്യ ആശയങ്ങൾ വ്യക്തമായി നിലനിർത്തി; മൂലത്തിലെ ആവർത്തിച്ച ‘യോശുവ’ ഒഴിവാക്കാതെ സംരക്ഷിച്ചു.
