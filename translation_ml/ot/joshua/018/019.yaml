  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: ml
  text: പിന്നെ അതിർ ബേത്ത്-ഹൊഗ്ലായുടെ വടക്കേ ചുമലിലേക്കു കടന്നു. ആ അതിർ ഉപ്പുകടലിന്റെ വടക്കേ നാവിൽ[a][b]—യോർദ്ദാന്റെ തെക്കേയറ്റത്ത്—അവസാനിച്ചു. ഇതാണ് തെക്കേ അതിർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഉപ്പുകടലിന്റെ നാവ്’; നാവിന്റെ ആകൃതിയിലുള്ള തീരഭാഗത്തെയോ ഉൾക്കടലിനെയോ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ചാവുകടൽ’; എബ്രായപാഠത്തിൽ ‘ഉപ്പുകടൽ’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: പിന്നെ അതിർ ... കടന്നു
  rationale: അതിർത്തിവിവരണങ്ങളിൽ עָבַר അതിർത്തിരേഖ അടുത്ത സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കടന്നു’ എന്നത് മൂലത്തിലെ ചലനഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כֶּתֶף
  choice: ചുമൽ
  rationale: ഭൂമിശാസ്ത്രപരമായി ഒരു സ്ഥലത്തിന്റെ വശമോ ചരിവോ സൂചിപ്പിക്കുന്ന ‘ചുമൽ’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലും മനസ്സിലാക്കാവുന്നതിനാൽ നിലനിർത്തി.
- source_word: בֵּית חָגְלָה
  choice: ബേത്ത്-ഹൊഗ്ലാ
  rationale: സ്ഥലനാമം അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: צָפוֹנָה
  choice: വടക്കേ
  rationale: ആ സ്ഥലത്തിന്റെ വടക്കുവശത്തെ ചുമൽ എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תצאותיו הגבול
  choice: ആ അതിർ ... അവസാനിച്ചു
  rationale: അതിർത്തിസൂത്രങ്ങളിൽ ഈ പദം രേഖയുടെ അവസാനസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; പഴഞ്ചൻ പദപ്രയോഗം ഒഴിവാക്കി അർഥം നേരിട്ട് നൽകി.
- source_word: לְשׁוֹן
  choice: നാവ്
  rationale: ‘നാവ്’ എന്ന മൂലരൂപകം തീരത്തിന്റെ നാവുപോലെ നീണ്ടുനിൽക്കുന്ന ഭാഗത്തെയോ ഉൾക്കടലിനെയോ സൂചിപ്പിക്കുന്നു. ഭൂപ്രകൃതിയുടെ കൃത്യസ്വഭാവം നിർബന്ധിച്ച് തീർപ്പാക്കാതെ രൂപകം നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: മൂലപാഠത്തിലെ ഔപചാരിക നാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ആധുനികമായി പരിചിതമായ ‘ചാവുകടൽ’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: യോർദ്ദാന്റെ തെക്കേയറ്റത്ത്
  rationale: קָצֶה എന്നതിന്റെ ‘അറ്റം’ എന്ന അർഥവും נֶגְבָּה സൂചിപ്പിക്കുന്ന തെക്കുദിശയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: ഇതാണ് തെക്കേ അതിർ
  rationale: ഇവിടെ נֶגֶב ഒരു പ്രദേശനാമമായ ‘നെഗെബ്’ എന്നതിലുപരി തെക്കുവശം സൂചിപ്പിക്കുന്നതിനാൽ ‘തെക്കേ അതിർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
