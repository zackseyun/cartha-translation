  text: וְ/עָבַ֨ר הַ/גְּב֜וּל אֶל כֶּ֣תֶף בֵּית חָגְלָה֮ צָפוֹנָ/ה֒ ו/היה תצאותי/ו הַ/גְּב֗וּל אֶל לְשׁ֤וֹן יָם הַ/מֶּ֨לַח֙ צָפ֔וֹנָ/ה אֶל קְצֵ֥ה הַ/יַּרְדֵּ֖ן נֶ֑גְבָּ/ה זֶ֖ה גְּב֥וּל נֶֽגֶב־־׀־־־׃
base_translation:
