translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ അതിർത്തിവിവരണശൈലി ഉപയോഗിച്ചു. ‘ചുമൽ’, ‘നാവ്’ എന്നീ എബ്രായ ഭൂമിശാസ്ത്രരൂപകങ്ങൾ അർഥം അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തി; ‘നാവ്’ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി. ഇടയ്ക്കുള്ള ദീർഘവിരാമം ഉപ്പുകടലിലെ സ്ഥാനം യോർദ്ദാന്റെ തെക്കേയറ്റവുമായി ബന്ധിപ്പിക്കുന്ന മൂലവാക്യഘടന വ്യക്തമാക്കുന്നു.
