lexical_decisions:
- source_word: גִּבְעוֹן
  choice: ഗിബെയോൻ
  rationale: ബെന്യാമീന്റെ പട്ടണങ്ങളുടെ പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: הָרָמָה
  choice: രാമാ
  rationale: നിശ്ചയോപപദം ചേർന്ന രൂപമാണെങ്കിലും ഇവിടെ ഒരു സ്ഥിരമായ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ‘ഉയരം’ എന്ന് അർഥവിവർത്തനം ചെയ്യാതെ പരിചിതമായ സ്ഥലനാമരൂപം സ്വീകരിച്ചു.
- source_word: בְאֵרוֹת
  choice: ബെയേരോത്ത്
  rationale: ‘കിണറുകൾ’ എന്ന അർഥവുമായി ബന്ധമുള്ള പദമാണെങ്കിലും പട്ടണപ്പട്ടികയിൽ സ്ഥലനാമമായതിനാൽ ഹീബ്രു രൂപം ലിപ്യന്തരണം ചെയ്തു.
