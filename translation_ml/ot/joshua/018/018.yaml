translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അതിര്‍വിവരണത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മറഞ്ഞിരിക്കുന്ന കർത്താവായ ‘അതിര്’ വ്യക്തമാക്കി. എബ്രായത്തിലെ ‘തോൾ’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘മലഞ്ചരിവ്’ എന്നു നൽകി, രൂപകത്തിന്റെ വിശദാംശം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
