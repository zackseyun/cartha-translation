reference: Joshua 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַ֛ר אֶל כֶּ֥תֶף מוּל הָֽ/עֲרָבָ֖ה צָפ֑וֹנָ/ה וְ/יָרַ֖ד הָ/עֲרָבָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: ml
  text: പിന്നെ അതിര് വടക്കുഭാഗത്ത് അരാബയ്ക്കു നേരെയുള്ള മലഞ്ചരിവിലേക്കു കടന്ന് അരാബയിലേക്കു താഴേക്കു ചെന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അരാബ” എന്നത് ഇവിടെ “സമതലം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു പ്രത്യേക ഭൂപ്രദേശത്തിന്റെ പേരായും പൊതുവായ ഭൂപ്രകൃതിപദമായും ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “തോൾ”; ഒരു മലയുടെ വശം, വരമ്പ്, അല്ലെങ്കിൽ ചരിവ് സൂചിപ്പിക്കുന്ന ഭൂപ്രകൃതിരൂപകമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: പിന്നെ അതിരു ... കടന്ന്
  rationale: അതിര്‍വിവരണത്തിൽ ഈ ക്രിയ അതിരുരേഖ അടുത്ത ഭൂപ്രദേശത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവായ ‘അതിര്’ വ്യക്തമാക്കുന്നത് വായന സുഗമമാക്കുന്നു.
- source_word: אֶל כֶּתֶף
  choice: മലഞ്ചരിവിലൂടെ
  rationale: כֶּתֶף അക്ഷരാർഥത്തിൽ ‘തോൾ’ ആണെങ്കിലും ഭൂപ്രകൃതിയിൽ ഒരു വശം, ചരിവ്, അല്ലെങ്കിൽ മലനിരയുടെ പാർശ്വം എന്ന രൂപകപ്രയോഗമാണ്. സ്വാഭാവിക മലയാളത്തിൽ ‘മലഞ്ചരിവ്’ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: מוּל הָעֲרָבָה
  choice: അരാബയ്ക്കു നേരെയുള്ള
  rationale: מוּל സൂചിപ്പിക്കുന്ന അഭിമുഖമായ സ്ഥാനം ‘നേരെയുള്ള’ എന്നു സ്വാഭാവികമായി പകർന്നു; עֲרָבָהയെ ഭൂമിശാസ്ത്രനാമമായ ‘അരാബ’ എന്നു നിലനിർത്തി.
- source_word: צָפֹנָה
  choice: വടക്കുഭാഗത്ത്
  rationale: ഇവിടെ വടക്കോട്ടുള്ള ചലനത്തേക്കാൾ ഭൂപ്രദേശത്തിന്റെ വടക്കൻ സ്ഥാനം അല്ലെങ്കിൽ അഭിമുഖതയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וְיָרַד
  choice: താഴേക്കു ചെന്നു
  rationale: ഭൂപ്രകൃതിയിലൂടെയുള്ള ഇറക്കം സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയ; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הָעֲרָבָתָה
  choice: അരാബയിലേക്കു
  rationale: ദിശാസൂചകമായ അവസാനപ്രത്യയം അരാബയിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശ നിലനിർത്തുന്നു.
