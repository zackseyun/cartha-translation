  source_fidelity: 'എബ്രായപാഠത്തിലെ രണ്ട് സ്ഥലനാമങ്ങളും അവയ്ക്കു പിന്നാലെയുള്ള സ്ത്രീലിംഗ ഏകവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ מִגְרָשֶׁהָ-യും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ഹോലോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ദെബീരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും. പട്ടികയിലെ സംയോജകഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.'
