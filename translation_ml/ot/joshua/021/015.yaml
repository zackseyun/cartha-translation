  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: ml
  text: ഹോലോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ദെബീരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 ദിനവൃത്താന്തം 6:58-ലെ സമാന്തര പട്ടികയിൽ ഈ പട്ടണത്തിന്റെ പേര് ‘ഹീലേൻ’ എന്നാണ്; ഇവിടെ യോശുവയുടെ പാഠത്തിൽ ‘ഹോലോൻ’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: ഹോലോൻ
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. യോശുവയിലെ എബ്രായപാഠം חֹלֹן എന്ന വായനയാണ് നൽകുന്നത്.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കാനും പൊതുവായി ഉപയോഗിക്കാനുമുള്ള തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു. ലേവ്യപട്ടണങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: דְּבִר
  choice: ദെബീർ
  rationale: പട്ടികയിലെ സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: ആവർത്തിക്കുന്ന וְ എന്ന സംയോജകത്തെ മലയാള പട്ടികാശൈലിയിൽ ‘-ഉം’കൊണ്ട് പ്രതിനിധീകരിച്ചു; אֶת എന്ന കർമസൂചകത്തിന് പ്രത്യേക പദം ആവശ്യമില്ല. പട്ടണവും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും ഒരുമിച്ച് പട്ടികപ്പെടുത്തുന്ന എബ്രായഘടന നിലനിർത്തി.
