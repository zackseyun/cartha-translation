id: JOS.21.2
reference: Joshua 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: ml
  text: 'അവർ കനാൻദേശത്തെ ശീലോവിൽ അവരോടു പറഞ്ഞു: “നമുക്കു പാർക്കാനുള്ള പട്ടണങ്ങളും നമ്മുടെ കന്നുകാലികൾക്കായുള്ള അവയുടെ മേച്ചിൽപ്പുറങ്ങളും[b] നൽകാൻ യഹോവ മോശെ മുഖാന്തരം[a] കല്പിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “മോശെയുടെ കൈയാൽ”; ഇവിടെ മോശെ മുഖാന്തരം എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: “മേച്ചിൽപ്പുറങ്ങൾ” എന്നതിന് “തുറസ്സായ നിലങ്ങൾ” അഥവാ “പൊതുനിലങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; പട്ടണങ്ങൾക്കു ചുറ്റും കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ഭൂമിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: അവർ അവരോടു പറഞ്ഞു
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അർഥവും אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖതയും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു; തുടർന്നുള്ള לֵאמֹר പ്രസംഗത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: കനാൻദേശത്തിലെ ശീലോവിൽവെച്ച്
  rationale: ‘കനാൻദേശം’ എന്ന പൂർണ സ്ഥലനാമവും ശീലോവിൽ നടന്ന സംഭാഷണവും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְיַד מֹשֶׁה
  choice: മോശെയുടെ കൈമുഖാന്തരം
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗത്തിലെ ഇടനിലക്കാരൻ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സ്രോതസ്സ്-രൂപവും മലയാളത്തിൽ വായിക്കാവുന്ന വിധം സംരക്ഷിക്കുന്നു.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: നമുക്കു പാർക്കാൻ പട്ടണങ്ങൾ നൽകണമെന്ന്
  rationale: ישׁב ഇവിടെ താമസത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ‘പാർക്കാൻ’ ആ ആശയം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ
  choice: നമ്മുടെ കന്നുകാലികൾക്കായി അവയുടെ മേച്ചിൽപ്പുറങ്ങളും
  rationale: מִגְרָשׁ പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള തുറന്ന പൊതു ഭൂമിയെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിലെ മേച്ചിൽ ഉപയോഗം ‘മേച്ചിൽപ്പുറങ്ങൾ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: בְיַד מֹשֶׁה എന്ന ഇടനില-പ്രയോഗം
  choice: മോശെയുടെ കൈമുഖാന്തരം
  alternative: മോശെ മുഖാന്തരം
  rationale: കല്പനയുടെ ഉറവിടം യഹോവയും അതിന്റെ മനുഷ്യ ഇടനിലക്കാരൻ മോശെയുമാണെന്ന ബന്ധം നിലനിർത്തുന്നു; ‘കൈ’ എന്ന മൂലരൂപം അടിക്കുറിപ്പോടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പാർക്കാൻ’, ‘പട്ടണങ്ങൾ’, ‘കന്നുകാലികൾ’, ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നിവ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദങ്ങളാണ്. മുഖ്യപാഠത്തിൽ മൂലഭാഷയുടെ ഇടനില-പ്രയോഗം സൂക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ അതു വിശദീകരിക്കുകയും ചെയ്തു.
