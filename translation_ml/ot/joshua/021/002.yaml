revisions:
- from: 'അവർ കനാൻദേശത്തിലെ ശീലോവിൽവെച്ച് അവരോടു പറഞ്ഞു: “നമുക്കു പാർക്കാൻ പട്ടണങ്ങളും നമ്മുടെ കന്നുകാലികൾക്കായി അവയുടെ മേച്ചിൽപ്പുറങ്ങളും നൽകണമെന്ന് യഹോവ മോശെയുടെ കൈമുഖാന്തരം[a] കല്പിച്ചു.”[b]'
  to: 'അവർ കനാൻദേശത്തെ ശീലോവിൽ അവരോടു പറഞ്ഞു: “നമുക്കു പാർക്കാനുള്ള പട്ടണങ്ങളും നമ്മുടെ കന്നുകാലികൾക്കായുള്ള അവയുടെ മേച്ചിൽപ്പുറങ്ങളും[b] നൽകാൻ യഹോവ മോശെ മുഖാന്തരം[a] കല്പിച്ചു.”'
  rationale: 'വ്യക്തമായ ഘടനാപരമായ അടിക്കുറിപ്പ്-ആങ്കർ പിശക് പരിഹരിച്ചു: [a] മോശെ മുഖാന്തരം എന്ന ഇടനില-പ്രയോഗത്തോടും [b] മേച്ചിൽപ്പുറങ്ങൾ എന്ന പദത്തോടും ചേർത്തു. മൂലപാഠത്തിന്റെ അർഥം മാറ്റാതെ, അസ്വാഭാവികമായ ‘കൈമുഖാന്തരം’ എന്ന രൂപം സ്വാഭാവികമായ ‘മുഖാന്തരം’ എന്നാക്കി; ‘കൈയാൽ’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി. പട്ടണങ്ങളും അവയുടെ മേച്ചിൽഭൂമിയും തമ്മിലുള്ള ബന്ധം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.'
