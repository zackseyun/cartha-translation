base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: ml
  text: ഗേർശോന്റെ പുത്രന്മാർക്ക്, യിസ്സാഖാർ ഗോത്രത്തിലെ കുടുംബങ്ങളിൽനിന്നും[a] ആശേർ ഗോത്രത്തിൽനിന്നും നഫ്താലി ഗോത്രത്തിൽനിന്നും ബാശാനിലുള്ള മനശ്ശെയുടെ പാതിഗോത്രത്തിൽനിന്നും നറുക്കിലൂടെ പതിമൂന്ന് പട്ടണങ്ങൾ ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «യിസ്സാഖാർ ഗോത്രത്തിലെ കുലങ്ങളിൽനിന്നും.» എബ്രായ മിശ്പഹോത് എന്ന പദം വിപുലകുടുംബങ്ങളെയോ കുലവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർക്ക്
  rationale: ലേവ്യവംശപരമായ സന്ദർഭത്തിൽ בְּנֵי എന്നതിന്റെ രൂപം നിലനിർത്തുന്ന സ്വാഭാവികമായ പ്രയോഗം; ഇവിടെ ഗേർശോന്റെ വംശജരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִמִּשְׁפְּחוֹת
  choice: കുടുംബങ്ങളിൽനിന്നും
  rationale: מִשְׁפָּחוֹת വിപുലകുടുംബങ്ങളെയോ കുലവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം; 'കുടുംബങ്ങൾ' അടിസ്ഥാനാർഥത്തോട് അടുത്തും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഭൂപങ്കിടൽ സന്ദർഭത്തിൽ ഈ പദം ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തിൽനിന്നും
  rationale: മനശ്ശെ ഗോത്രത്തിന്റെ ഭൂമിശാസ്ത്രപരമായി വിഭജിക്കപ്പെട്ട പാതിയെ കൃത്യവും സംക്ഷിപ്തവുമായി രേഖപ്പെടുത്തുന്നു.
- source_word: בַבָּשָׁן
  choice: ബാശാനിലുള്ള
  rationale: ബാശാൻ എന്ന പ്രദേശനാമത്തെ മനശ്ശെയുടെ പാതിഗോത്രവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בַגּוֹרָל
  choice: നറുക്കിലൂടെ
  rationale: പട്ടണങ്ങൾ വിതരണം ചെയ്ത രീതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: പതിമൂന്ന് പട്ടണങ്ങൾ
  rationale: עָרִים എന്നത് പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ സൂചിപ്പിക്കാം; ഈ ഭൂപങ്കിടൽ പട്ടികയിൽ 'പട്ടണങ്ങൾ' സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാസ്വഭാവമുള്ള എബ്രായ വാക്യത്തെ പൂർണ്ണവും സ്വാഭാവികവുമായ മലയാളവാക്യമാക്കാൻ അവസാനം 'ലഭിച്ചു' ചേർത്തിരിക്കുന്നു. ഇത് മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന വിഭജനക്രിയ വ്യക്തമാക്കുന്നതാണ്; പുതിയ ആശയം ചേർക്കുന്നില്ല. ഗോത്രനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
