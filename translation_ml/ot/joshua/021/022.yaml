  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: ml
  text: കിബ്സയീമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ബേത്ത്-ഹോരോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ആകെ നാല് പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊതുഭൂമികൾ’ അല്ലെങ്കിൽ ‘മേയൽനിലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. പട്ടണത്തിന്റേതായ ചുറ്റുമുള്ള തുറന്ന ഭൂമിയെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: കിബ്സയീം
  rationale: സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തിന്റേതായ ചുറ്റുമുള്ള തുറന്ന ഭൂമിയെയോ മൃഗങ്ങളെ മേയ്ക്കാനുള്ള ഭൂമിയെയോ സൂചിപ്പിക്കുന്ന പദം; ലേവ്യപട്ടണങ്ങളുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: בֵּית חוֹרֹן
  choice: ബേത്ത്-ഹോരോൻ
  rationale: സ്ഥിരമായ സ്ഥലനാമം എന്ന നിലയിൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ അവസാനത്തിലെ എണ്ണസംഗ്രഹം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി; עָרִים എന്നതിന് സന്ദർഭോചിതമായി ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וְאֶת ... וְאֶת
  choice: …ഉം …ഉം
  rationale: ആവർത്തിക്കുന്ന സംയോജനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ സമുച്ചയപ്രത്യയത്തിലൂടെ നിലനിർത്തി; നേരിട്ടുള്ള കർമചിഹ്നം പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
