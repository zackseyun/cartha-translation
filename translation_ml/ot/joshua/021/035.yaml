translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ പട്ടികാസ്വഭാവവും സമാപനസംഗ്രഹവും നിലനിർത്തി. പാഠഭേദവും പദാർഥവികല്പവും മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങളുമായി ബന്ധിപ്പിച്ചു.
