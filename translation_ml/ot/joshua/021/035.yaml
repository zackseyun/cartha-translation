source:
  edition: WLC
  text: אֶת דִּמְנָה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶֽת נַהֲלָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/035.yaml
  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: ml
  text: ദിംനയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[b][a], നഹലാലും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ആകെ നാല് പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഭാഗത്തിലെ ചില പട്ടണനാമങ്ങൾ ഉൾപ്പെടുത്തുന്നതിലും ക്രമീകരിക്കുന്നതിലും എബ്രായ കൈയെഴുത്തുപ്രതികളും പുരാതന പരിഭാഷകളും തമ്മിൽ വ്യത്യാസമുണ്ട്; 1 ദിനവൃത്താന്തം 6:62 [ഇംഗ്ലീഷ് വാക്യവിഭജനത്തിൽ 6:77] എന്ന സമാന്തരപ്പട്ടികയും താരതമ്യം ചെയ്യുക.
    reason: textual_variant
  - marker: b
    text: ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നതിന് പകരം ‘പൊതുഭൂമികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: ദിംന
  rationale: സ്ഥലനാമം അർഥവിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ പകർത്തി.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, അതിനുള്ള തുറന്ന പൊതുഭൂമി/മേയൽഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. ലേവ്യപട്ടണങ്ങളുടെ പശ്ചാത്തലത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: נַהֲלָל
  choice: നഹലാൽ
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ പകർത്തി.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ സമാപനത്തിലുള്ള സംഖ്യാ-നാമസംഗ്രഹം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; עִיר എന്നതിന് ഈ ഭൂവിഭജനപ്പട്ടികകളിൽ ‘പട്ടണം’ യോജിക്കുന്നു.
