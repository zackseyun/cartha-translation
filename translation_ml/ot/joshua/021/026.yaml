translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ സംഗ്രഹസൂത്രത്തിന്റെ അർത്ഥം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യക്രമം ഉപയോഗിച്ചു; വംശാവലിപരമായ പദപ്രയോഗവും സാംസ്കാരിക ഭൂവിഭാഗവും സംരക്ഷിച്ചു.
