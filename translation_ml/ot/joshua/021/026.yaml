  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: ml
  text: കെഹാത്തിന്റെ ശേഷിച്ച പുത്രന്മാരുടെ കുലങ്ങൾക്കുള്ള പട്ടണങ്ങൾ, അവയുടെ മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ[b], ആകെ പത്തായിരുന്നു.[a] കെഹാത്തിന്റെ പുത്രന്മാർ[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പട്ടണങ്ങൾ ആകെ പത്ത്.” പട്ടിക അവസാനിപ്പിക്കുന്ന സംഗ്രഹവാക്യമാണ് എബ്രായത്തിലുള്ളത്.'
    reason: lexical_alternative
  - marker: b
    text: “മേച്ചിൽപ്പുറങ്ങൾ” എന്നത് പട്ടണങ്ങളോടു ചേർന്നതും പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കുന്നതിനും അനുബന്ധ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്നതുമായ തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “കെഹാത്തിന്റെ പുത്രന്മാർ” എന്നതിന് “കെഹാത്ത്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: പട്ടണങ്ങൾ ... ആകെ പത്തായിരുന്നു
  rationale: പട്ടികയുടെ അവസാനം ആകെ എണ്ണം സംഗ്രഹിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ആകെ’ כָּל എന്നതിന്റെ സമാഹാരബലം വ്യക്തമാക്കുന്നു.
- source_word: מִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളോടു ചേർന്ന, പ്രധാനമായും കന്നുകാലികളെ മേയ്ക്കുന്നതിനും അനുബന്ധ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറസ്സായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחוֹת
  choice: വംശങ്ങൾക്കു
  rationale: മִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വംശങ്ങൾ’ ഈ സാമൂഹിക ഘടകം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശാവലിപരമായ ‘കെഹാത്തിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ച
  rationale: മുമ്പ് പട്ടണങ്ങൾ ലഭിച്ച കെഹാത്ത്യശാഖയിൽനിന്ന് ഇവരെ വേർതിരിക്കുന്ന വിശേഷണപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
