source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: ml
  text: കെഹാത്തിന്റെ ശേഷിച്ച പുത്രന്മാർക്ക്[a] എഫ്രയീം ഗോത്രത്തിലെ കുലങ്ങളിൽനിന്നും ദാൻ ഗോത്രത്തിൽനിന്നും മനശ്ശെയുടെ പാതിഗോത്രത്തിൽനിന്നും നറുക്കെടുപ്പിലൂടെ പത്തു പട്ടണങ്ങൾ ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശേഷിച്ച കെഹാത്ത്യർക്ക്.’
    reason: ‘കെഹാത്തിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ വംശാവലി പ്രയോഗം കെഹാത്ത്യ വംശജരെയോ കുലാംഗങ്ങളെയോ കൂട്ടമായി സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: കെഹാത്തിന്റെ ശേഷിച്ച പുത്രന്മാർക്ക്
  rationale: לְ എന്ന ദാതൃപ്രത്യയത്തിന്റെ വിതരണാർഥം ‘-ക്ക്’ കൊണ്ട് സൂചിപ്പിക്കുന്നു. בְּנֵי എന്ന വംശാവലി പ്രയോഗം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുന്നു; הַנּוֹתָרִים മുൻവാക്യത്തിൽ പറഞ്ഞവരെ ഒഴിച്ചുള്ള ശേഷിച്ച കെഹാത്ത്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: מִ/מִּשְׁפְּחֹת מַטֵּה אֶפְרַיִם
  choice: എഫ്രയീം ഗോത്രത്തിലെ കുലങ്ങളിൽനിന്നും
  rationale: מִשְׁפָּחוֹת ഇവിടെ ഗോത്രത്തിനുള്ളിലെ സാമൂഹിക ഉപവിഭാഗങ്ങളായതിനാൽ ‘കുലങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; מַטֶּה സന്ദർഭത്തിൽ ‘ഗോത്രം’ എന്നാണ്.
- source_word: וּֽ/מִ/מַּטֵּה דָן
  choice: ദാൻ ഗോത്രത്തിൽനിന്നും
  rationale: എബ്രായ പദക്രമത്തിലെ സമാന്തരമായ ‘നിന്ന്’ ഘടന വ്യക്തതയ്ക്കായി നിലനിർത്തുന്നു.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തിൽനിന്നും
  rationale: മനശ്ശെ ഗോത്രത്തിന്റെ പ്രദേശപരമായ വിഭജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണ് ‘പാതിഗോത്രം’.
- source_word: בַּ/גּוֹרָל
  choice: നറുക്കെടുപ്പിലൂടെ
  rationale: പട്ടണങ്ങൾ നിർണയിച്ച മാർഗം വ്യക്തമാക്കുന്നു; ‘നറുക്കിലൂടെ’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ നടപടിക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עָרִים עָשֶׂר
  choice: പത്തു പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് ഈ ഭൂവിഭജനപ്പട്ടികയിൽ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: implicit verbless clause
  choice: ലഭിച്ചു
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതവും പട്ടികാശൈലിയിലുള്ളതുമായ വാക്യം മലയാളത്തിൽ പൂർണമാക്കാൻ വിതരണസന്ദർഭം സൂചിപ്പിക്കുന്ന ‘ലഭിച്ചു’ ചേർത്തു; ഇത് പുതിയൊരു പ്രവർത്തകനെ നിർദേശിക്കുന്നില്ല.
