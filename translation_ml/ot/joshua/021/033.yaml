translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. എബ്രായ എണ്ണൽസൂത്രം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിലാക്കി; കുടുംബവിഭാഗവും പട്ടണങ്ങളോടു ബന്ധപ്പെട്ട മേച്ചിൽഭൂമിയും വ്യക്തമായി നിലനിർത്തി.
