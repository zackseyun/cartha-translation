  text: כָּל עָרֵ֥י הַ/גֵּרְשֻׁנִּ֖י לְ/מִשְׁפְּחֹתָ֑/ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר וּ/מִגְרְשֵׁי/הֶֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/033.yaml
  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: ml
  text: ഗേർശോന്യരുടെ കുടുംബങ്ങൾക്കുള്ള എല്ലാ പട്ടണങ്ങളും ആകെ പതിമൂന്നായിരുന്നു; അവയുടെ മേച്ചിൽപ്പുറങ്ങളും[a] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവയുടെ മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ.”'
    reason: ബന്ധകമായ וְ ഇവിടെ ‘അവയുടെ മേച്ചിൽപ്പുറങ്ങളും’ എന്നോ, പട്ടണങ്ങളോടൊപ്പം ഉൾപ്പെട്ടവയായി ‘മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ’ എന്നോ സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: പട്ടണങ്ങൾ ആകെ
  rationale: כָּל എണ്ണം സംഗ്രഹിക്കുന്ന പ്രയോഗമാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘ആകെ’ എന്നു നൽകി മൊത്തം പതിമൂന്ന് പട്ടണങ്ങളെന്ന അർഥം വ്യക്തമാക്കുന്നു. עִיר എന്നതിന് ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണം’ അനുയോജ്യമാണ്.
- source_word: הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യർക്കു
  rationale: നിശ്ചയാർഥക ഘടകത്തോടുകൂടിയ ഏകവചന ജനവിഭാഗനാമം ഇവിടെ ഗേർശോന്റെ സന്തതികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗേർശോന്യർ’ എന്ന ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുടുംബംകുടുംബമായി
  rationale: לְ ഇവിടെ കുടുംബവിഭാഗം അനുസരിച്ചുള്ള വിന്യാസം സൂചിപ്പിക്കുന്നു. ‘കുടുംബംകുടുംബമായി’ ഈ വിഭാഗീകരണബോധം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: പതിമൂന്നായിരുന്നു
  rationale: മുമ്പ് പറഞ്ഞ ‘പട്ടണങ്ങൾ’ എന്ന നാമത്തോടു ചേർത്ത്, എബ്രായത്തിലെ എണ്ണൽവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വിധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങളും
  rationale: מִגְרָשׁ പട്ടണത്തോടു ചേർന്ന തുറസ്സായ, കന്നുകാലികളെ മേയിക്കാനുള്ള ഭൂമിയെ സൂചിപ്പിക്കുന്നു. ‘മേച്ചിൽപ്പുറങ്ങൾ’ ആ അർഥം വ്യക്തമായി നൽകുന്നു; וְ എന്ന ബന്ധകത്തിന്റെ നേരിട്ടുള്ള മൂല്യം ‘-ഉം’ നിലനിർത്തുന്നു.
