  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. എബ്രായവാക്യത്തിലെ ദീർഘമായ ഏകവാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; വിവരക്രമവും ബന്ധങ്ങളും നിലനിർത്തി.
