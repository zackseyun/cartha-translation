source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הַ/גּוֹרָ֖ל לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י וַ/יְהִ֡י לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן מִן הַ/לְוִיִּ֗ם מִ/מַּטֵּ֣ה יְ֠הוּדָה וּ/מִ/מַּטֵּ֨ה הַ/שִּׁמְעֹנִ֜י וּ/מִ/מַּטֵּ֤ה בִנְיָמִן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: ml
  text: കെഹാത്യരുടെ കുടുംബങ്ങൾക്കു നറുക്ക് വീണു. ലേവ്യരിൽപ്പെട്ട പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർക്ക് യെഹൂദാഗോത്രത്തിൽനിന്നും ശിമെയോൻഗോത്രത്തിൽനിന്നും ബെന്യാമീൻഗോത്രത്തിൽനിന്നുമായി നറുക്കിലൂടെ പതിമൂന്ന് പട്ടണങ്ങൾ ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: നറുക്ക് വീണു
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘നറുക്ക് പുറത്തുവന്നു’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: കെഹാത്യകുടുംബങ്ങൾക്കായി
  rationale: מִשְׁפָּחוֹת എന്നത് കുടുംബ/കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘കുടുംബങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർക്ക് ... ലഭിച്ചു
  rationale: എബ്രായത്തിലെ അപൂർണവാക്യസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന ബന്ധപദം നിലനിർത്തുന്നു.
- source_word: מִן הַלְוִיִּם
  choice: ലേവ്യരിൽപ്പെട്ട
  rationale: അഹരോന്റെ പുത്രന്മാർ ലേവ്യരുടെ ഒരു ഉപവിഭാഗമാണെന്ന ഭാഗികബന്ധം സംക്ഷിപ്തവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: യെഹൂദാഗോത്രത്തിൽനിന്നും ശിമെയോൻഗോത്രത്തിൽനിന്നും ബെന്യാമീൻഗോത്രത്തിൽനിന്നുമായി
  rationale: מַטֶּה ഇവിടെ ‘ഗോത്രം’ എന്നാണ്; ഉറവിടത്തിലെ ആവർത്തനഘടന മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: בַּגּוֹרָל
  choice: നറുക്കിലൂടെ
  rationale: പട്ടണങ്ങൾ അനുവദിക്കപ്പെട്ട മാർഗം സൂചിപ്പിക്കുന്ന ഉപാധ്യർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: പതിമൂന്ന് പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദത്തിന് ഭൂവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും വ്യാപ്തിയിൽ അനാവശ്യമായ ആധുനിക നഗരസങ്കൽപ്പം ഒഴിവാക്കുന്നതുമാണ്.
