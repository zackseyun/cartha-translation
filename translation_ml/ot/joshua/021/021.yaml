  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: ml
  text: അവർ അവർക്കു എഫ്രയീമിന്റെ മലമ്പ്രദേശത്തുള്ള[b], കൊല ചെയ്തയാൾക്കുള്ള[a] അഭയനഗരമായ ശെഖേമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ഗേസെറും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊല ചെയ്തയാൾ’ എന്ന ഹീബ്രായ നിയമപദം ഒരു മരണത്തിന് കാരണമായതിനാൽ വിധിതീർപ്പുവരെ അഭയം തേടുന്നയാളെ സൂചിപ്പിക്കാം; അയാൾ കുറ്റം തെളിഞ്ഞ കൊലപാതകിയാണെന്നത് ഈ പദംകൊണ്ടു മാത്രം നിർണയിക്കപ്പെടുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എഫ്രയീമിന്റെ മല’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് എഫ്രയീമിന്റെ മലമ്പ്രദേശമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: അവർ അവർക്കു … കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ തുടർച്ചയായ ഭൂതകാല ആഖ്യാനരൂപവും ലേവ്യരെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമസർവനാമവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: കൊല ചെയ്തവന് അഭയം പ്രാപിക്കാനുള്ള നഗരം
  rationale: ഹീബ്രായ നിയമസന്ദർഭത്തിൽ മരണത്തിന് കാരണമായ ഒരാളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; കുറ്റം തെളിഞ്ഞ കൊലപാതകി എന്ന അർഥം മുൻകൂട്ടി ചുമത്താതിരിക്കാൻ ‘കൊല ചെയ്തവൻ’ എന്നു നൽകി.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരത്തോടു ചേർന്ന, കന്നുകാലികളെ മേയ്ക്കുന്നതിനും പൊതുവായ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീമിന്റെ മലനാട്ടിൽ
  rationale: ഇവിടെ הַר ഒരു ഒറ്റമലയെക്കാൾ എഫ്രയീം ഗോത്രപ്രദേശത്തെ മലമ്പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: גֶּזֶר
  choice: ഗേസെർ
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന നിയമപദം കുറ്റം തെളിഞ്ഞ കൊലപാതകിയെ സൂചിപ്പിക്കുന്നുവോ എന്ന ചോദ്യം
  choice: കൊല ചെയ്തവൻ
  alternative: കൊലപാതകി
  rationale: അഭയനഗര നിയമത്തിൽ മനഃപൂർവമല്ലാതെ മരണത്തിന് കാരണമായ ഒരാൾക്കും വിധിതീർപ്പുവരെ അഭയം തേടാം. അതിനാൽ കുറ്റവിധി മുൻകൂട്ടി നിർണയിക്കാത്ത വിശാലമായ ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രായ വാക്യത്തിലെ ശെഖേമിനെ വിശേഷിപ്പിക്കുന്ന അഭയനഗരപ്രയോഗം നിലനിർത്തി; ഭൂമിശാസ്ത്രപരമായ ഇടക്കുറിപ്പ് ഡാഷുകൾകൊണ്ട് വേർതിരിച്ചു.
