translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വംശാവലിയുടെ ഔപചാരികതയ്ക്കായി ‘പുത്രന്മാർ’ നിലനിർത്തിയപ്പോൾ, עָרֵי גוֹרָלָם എന്ന എബ്രായ സംക്ഷിപ്തപ്രയോഗം വായനാസൗകര്യത്തിനായി ‘നറുക്കിലൂടെ ലഭിച്ച പട്ടണങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
