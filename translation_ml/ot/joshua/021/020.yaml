  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: ml
  text: കെഹാത്തിന്റെ പുത്രന്മാരുടെ കുടുംബങ്ങൾക്ക്, അതായത് കെഹാത്തിന്റെ പുത്രന്മാരിൽ ശേഷിച്ചിരുന്ന ലേവ്യർക്ക്, നറുക്കിലൂടെ ലഭിച്ച പട്ടണങ്ങൾ എഫ്രയീം ഗോത്രത്തിൽനിന്നുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: കുടുംബങ്ങളിൽ … ലേവ്യർക്ക്
  rationale: വിതരണസന്ദർഭത്തിലെ לְ എന്ന ബന്ധത്തെ സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു; പട്ടണങ്ങൾ ഈ കുടുംബവിഭാഗങ്ങൾക്കാണ് ലഭിച്ചതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരിക രൂപം നിലനിർത്തുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: കെഹാത്ത്യരെ ലേവി വംശത്തിൽപ്പെട്ടവരായി തിരിച്ചറിയുന്ന പതിവ് ഗോത്രനാമം.
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ചിരുന്ന
  rationale: മുമ്പത്തെ വിഹിതവിതരണങ്ങൾക്കുശേഷം ശേഷിച്ച വിഭാഗത്തെയാണ് കർത്തൃവാചകമായ ഈ രൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: מִבְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാരിൽ
  rationale: കെഹാത്ത്യരുടെ വിശാലവിഭാഗത്തിനുള്ളിലെ ഒരു ശേഷിച്ച ഉപവിഭാഗമെന്ന partitive അർഥം നൽകുന്നു.
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഈ വിഹിതവിവരണത്തിൽ היה ലളിതമായ ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; അനാവശ്യമായ ‘സംഭവിച്ചു’ എന്ന വികസനം ഒഴിവാക്കുന്നു.
- source_word: עָרֵי גוֹרָלָם
  choice: അവർക്കു നറുക്കിലൂടെ ലഭിച്ച പട്ടണങ്ങൾ
  rationale: גורל എന്നത് നറുക്കിനെയും അതിലൂടെ നിശ്ചയിച്ച വിഹിതത്തെയും സൂചിപ്പിക്കുന്നു; എബ്രായ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: എഫ്രയീം ഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രപ്പട്ടികകളിൽ מַטֶּה എന്നതിന് സന്ദർഭോചിതമായ അർഥം ‘ഗോത്രം’ ആണ്; מן ഉറവിടബന്ധം സൂചിപ്പിക്കുന്നു.
