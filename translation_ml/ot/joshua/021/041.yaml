source:
  edition: WLC
  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ[a] കൈവശഭൂമിക്കുള്ളിലെ ലേവ്യരുടെ എല്ലാ പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ[b] ആകെ നാല്പത്തെട്ട് പട്ടണങ്ങളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരുടെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “മേച്ചിൽപ്പുറങ്ങൾ” എന്നതിന് “തുറസ്സായ സ്ഥലങ്ങൾ” എന്നോ “പൊതുഭൂമികൾ” എന്നോ പരിഭാഷപ്പെടുത്താം; പട്ടണങ്ങളെ ചുറ്റിയുള്ള ഭൂമിയെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ആകെ
  rationale: ലേവ്യരുടെ പട്ടണങ്ങളുടെ സമ്പൂർണ എണ്ണം സംഗ്രഹിക്കുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָרֵי הַלְוִיִּם
  choice: ലേവ്യർക്കുണ്ടായിരുന്ന പട്ടണങ്ങൾ
  rationale: ‘ലേവ്യരുടെ പട്ടണങ്ങൾ’ എന്ന ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹךְ
  choice: ഉള്ളിൽ
  rationale: ഇസ്രായേലിന്റെ വിശാലമായ കൈവശഭൂമിയുടെ പരിധിക്കകത്തുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: אֲחֻזַּת
  choice: കൈവശഭൂമി
  rationale: ഭൂസ്വത്തായ കൈവശം എന്ന അർഥം നൽകുന്നു; ‘അവകാശം’ എന്നു പറഞ്ഞ് നിയമപരമോ ദൈവശാസ്ത്രപരമോ ആയ അധിക അർഥം ചുമത്തുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ദേശീയവിളിപ്പേരിന്റെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ മലയാളരൂപം; ജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: പട്ടണങ്ങൾ ആകെ നാല്പത്തെട്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ സംഗ്രഹാത്മക നാമവാക്യത്തെ പൂർണവും സ്വാഭാവികവുമായ മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു; എണ്ണം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: അവയോടൊപ്പം അവയുടെ മേച്ചിൽപ്പുറങ്ങളും
  rationale: പട്ടണങ്ങളോടു ചേർന്ന തുറന്ന ഭൂമിയെ സന്ദർഭാനുസൃതമായി ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; ബന്ധസൂചകമായ וּ־യും ബഹുവചന ഉടമസ്ഥപ്രത്യയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ദേശീയവിളിപ്പേര്
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ എബ്രായരൂപത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. അതിശാബ്ദികമായ ‘പുത്രന്മാർ’ മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
- issue: מִגְרָשׁ എന്ന ഭൂവിഭാഗത്തിന്റെ സ്വഭാവം
  choice: മേച്ചിൽപ്പുറങ്ങൾ
  alternative: തുറസ്സായ സ്ഥലങ്ങൾ / പൊതുഭൂമികൾ
  rationale: ഈ പട്ടണവിഭജനസന്ദർഭത്തിൽ കന്നുകാലികൾക്കായി ഉപയോഗിച്ച പട്ടണപരിസരഭൂമി എന്ന ആശയം ‘മേച്ചിൽപ്പുറങ്ങൾ’ വ്യക്തമായി നൽകുന്നു; മറ്റ് സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സംഗ്രഹഘടനയും നാല്പത്തെട്ട് എന്ന കൃത്യസംഖ്യയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
