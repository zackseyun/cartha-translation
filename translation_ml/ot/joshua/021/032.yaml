source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י אֶת עִ֣יר מִקְלַ֣ט הָֽ/רֹצֵ֗חַ אֶת קֶ֨דֶשׁ בַּ/גָּלִ֤יל וְ/אֶת מִגְרָשֶׁ֨/הָ֙ וְ/אֶת חַמֹּ֥ת דֹּאר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת קַרְתָּ֖ן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שָׁלֹֽשׁ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: ml
  text: 'നഫ്താലിഗോത്രത്തിൽനിന്ന്: കൊല ചെയ്തവന്[a] അഭയനഗരമായ ഗലീലയിലെ കേദെശും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും; ഹമ്മോത്ത്-ദോർ[b] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും; കർത്താനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—മൂന്നു പട്ടണങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊല ചെയ്തവൻ’ എന്ന എബ്രായപദം ഒരാളെ കൊന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; അഭയനഗരത്തെക്കുറിച്ചുള്ള നിയമസന്ദർഭത്തിൽ അത് മുൻകൂട്ടി ആസൂത്രണം ചെയ്ത കൊലപാതകം നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘ഹമ്മോത്ത്-ദോർ’ എന്നാണ്; ചില പാരമ്പര്യങ്ങൾ ഈ സ്ഥലത്തെ ‘ഹമ്മാത്ത്’ എന്ന പേരുമായി തിരിച്ചറിയുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: നഫ്താലിഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഭജനത്തിന്റെ പശ്ചാത്തലത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; സംയോജകവും ഉപസർഗവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: കൊല ചെയ്തവന് അഭയനഗരം
  rationale: עִיר מִקְלַט എന്ന നിയമപരമായ പ്രയോഗത്തിന് ‘അഭയനഗരം’ യോജിക്കുന്നു. הָרֹצֵחַ ഒരാളെ കൊന്നവനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുൻകൂട്ടിയുള്ള കൊലപാതകം നിർബന്ധമായി അർഥമാക്കുന്നില്ല; അതിനാൽ ‘കൊലപാതകി’ എന്ന് ധാർമികമായി വിധിച്ചിട്ടില്ല.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: ഗലീലയിലെ കേദെശ്
  rationale: സ്ഥലപ്പേര് ശബ്ദാന്തരണം ചെയ്തു; പ്രദേശബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീപ്രയോഗത്തിൽ നൽകി.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന പൊതുവായ തുറന്ന ഭൂമിയെയും കന്നുകാലിമേച്ചിലിനുള്ള സ്ഥലത്തെയും സൂചിപ്പിക്കുന്ന പദം; പട്ടികാസന്ദർഭത്തിൽ വ്യക്തമായ ആധുനിക പ്രയോഗം.
- source_word: חַמֹּת דֹּאר
  choice: ഹമ്മോത്ത്-ദോർ
  rationale: മസോററ്റിക് പാഠത്തിലെ സംയുക്ത സ്ഥലപ്പേരിനെ ഹൈഫനോടുകൂടി ശബ്ദാന്തരണം ചെയ്തു.
- source_word: קַרְתָּן
  choice: കർത്താൻ
  rationale: എബ്രായരൂപത്തിൽനിന്നുള്ള നേരിട്ടുള്ള സ്ഥലപ്പേര് ശബ്ദാന്തരണം.
- source_word: עָרִים שָׁלֹשׁ
  choice: ആകെ മൂന്നു പട്ടണങ്ങൾ
  rationale: എബ്രായത്തിലെ അവസാന സംഗ്രഹത്തെ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിച്ചു; ‘ആകെ’ പട്ടികയുടെ സംഖ്യാസംഗ്രഹം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദത്തിന്റെ നിയമപരവും ധാർമികവുമായ വ്യാപ്തി
  choice: കൊല ചെയ്തവൻ
  alternative: കൊലപാതകി
  rationale: അഭയനഗരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം കൊല ചെയ്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പ്രവൃത്തി മുൻകൂട്ടി ആസൂത്രണം ചെയ്ത കൊലപാതകമാണെന്ന് പദം മാത്രം നിർണയിക്കുന്നില്ല. അതിനാൽ കുറ്റത്തിന്റെ സ്വഭാവം മുൻകൂട്ടി തീർപ്പാക്കാത്ത ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. പട്ടികാരൂപത്തിന്റെ ചുരുക്കം കാത്തുസൂക്ഷിച്ചു; സ്ഥലനാമങ്ങൾ എബ്രായപാഠത്തെ അടിസ്ഥാനമാക്കി ശബ്ദാന്തരണം ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പ്രധാനപാഠഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
