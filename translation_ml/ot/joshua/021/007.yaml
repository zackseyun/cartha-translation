id: JOS.21.7
reference: Joshua 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֨י מְרָרִ֜י לְ/מִשְׁפְּחֹתָ֗/ם מִ/מַּטֵּ֨ה רְאוּבֵ֤ן וּ/מִ/מַּטֵּה גָד֙ וּ/מִ/מַּטֵּ֣ה זְבוּלֻ֔ן עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാർക്ക്[a], അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്, രൂബേൻ ഗോത്രത്തിൽനിന്നും ഗാദ് ഗോത്രത്തിൽനിന്നും സെബൂലൂൻ ഗോത്രത്തിൽനിന്നും: പന്ത്രണ്ട് പട്ടണങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മെരാരിയുടെ സന്തതികൾക്ക്.”'
    reason: בְּנֵי എന്ന എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ നേരിട്ടുള്ള പുത്രന്മാരെക്കാൾ വിശാലമായി ‘സന്തതികൾ’ എന്നും അർഥമാക്കാം.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർക്ക്
  rationale: വിതരണസന്ദർഭത്തിലെ לְ എന്ന ഉപസർഗത്തിന്റെ ദാതൃ/നിയോഗ അർഥവും בְּנֵי എന്ന കുടുംബബന്ധപദത്തിന്റെ രൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ കുടുംബ/കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; പട്ടണങ്ങൾ ആ വിഭാഗങ്ങൾക്കനുസരിച്ച് വിഭജിക്കപ്പെട്ടെന്ന ആശയം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: מִמַּטֵּה
  choice: ഗോത്രത്തിൽനിന്നും
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; ആവർത്തിക്കുന്ന പട്ടികാഘടനയും നിലനിർത്തി.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിലെ പതിവായ ലിപ്യന്തരണം.
- source_word: גָד
  choice: ഗാദ്
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: എബ്രായ നാമത്തിന്റെ ശബ്ദരൂപം പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: പന്ത്രണ്ട് പട്ടണങ്ങൾ
  rationale: עִיר എന്നതിന് ഈ ഭൂവിഭജനപ്പട്ടികയിൽ ‘പട്ടണം’ സ്വാഭാവികമാണ്; സംഖ്യ മലയാളത്തിലെ സാധാരണ പദക്രമത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ സംക്ഷിപ്ത നാമവാക്യം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമാക്കാൻ ‘ലഭിച്ചു’ ചേർത്തിരിക്കുന്നു; ഇത് ഭൂവിഭജനസന്ദർഭത്തിൽ സൂചിതമായ ആശയമാണ്.
