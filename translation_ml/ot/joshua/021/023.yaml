  edition: WLC
  text: וּ/מִ/מַּ֨טֵּה דָ֔ן אֶֽת אֶלְתְּקֵ֖א וְ/אֶת מִגְרָשֶׁ֑/הָ אֶֽת גִּבְּת֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: ml
  text: 'ദാൻ ഗോത്രത്തിൽനിന്ന്: എൽതെക്കെയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഗിബ്ബെഥോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘അതിനെ ചുറ്റിയുള്ള മേച്ചിൽഭൂമി’ / ‘അതിന്റെ പൊതുഭൂമി’; എബ്രായം: מִגְרָשֶׁהָ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: ദാൻഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതങ്ങളുടെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ് സൂചിപ്പിക്കുന്നത്. തുടക്കത്തിലെ സംയോജകവും പൂർവപ്രത്യയവും മലയാളത്തിൽ സ്വാഭാവികമായി ഈ ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אֶת
  choice: '[മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: എബ്രായത്തിലെ നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ തുല്യമായ സ്വതന്ത്രപദമില്ല.
- source_word: אֶלְתְּקֵא
  choice: എൽത്തെക്ക
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തെ ചുറ്റിയുള്ള, കന്നുകാലികളെ മേയ്ക്കുന്നതിനും പൊതുവായ ഉപയോഗത്തിനുമുള്ള ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്. ലേവ്യപട്ടണങ്ങളുടെ സന്ദർഭത്തിൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം പട്ടണത്തെ സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: גִּבְּתוֹן
  choice: ഗിബ്ബെഥോൻ
  rationale: സ്ഥലനാമം എബ്രായ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/אֶת
  choice: -യും
  rationale: സംയോജകം മലയാളത്തിലെ സമുച്ചയപ്രത്യയമായ ‘-യും’കൊണ്ട് പ്രതിനിധീകരിച്ചു; കർമസൂചകം പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
