translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാസ്വഭാവമുള്ള മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി. സ്ഥലനാമങ്ങൾ പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു; ‘മേച്ചിൽപ്പുറങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപദത്തിന്റെ പൊതുഭൂമി എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
