translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് വ്യക്തമാക്കി; എബ്രായത്തിലെ മുന്നോട്ടുവച്ച കർമഘടന മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
