  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: ml
  text: ഈ പട്ടണങ്ങളിൽ ഓരോന്നിനും അതിനെ ചുറ്റിയുള്ള മേച്ചിൽപ്പുറങ്ങൾ ഉണ്ടായിരുന്നു[a]; ഈ പട്ടണങ്ങൾക്കെല്ലാം അങ്ങനെതന്നെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “പട്ടണംതോറും, അതിന് ചുറ്റുമുള്ള മേച്ചിൽപ്പുറങ്ങളും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: ഉണ്ടായിരുന്നു
  rationale: Qal imperfect 3fp ഇവിടെ മുൻവിവരങ്ങളെ സംഗ്രഹിക്കുന്ന ഭൂതകാലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടായിരുന്നു’ അതു വ്യക്തമായി നൽകുന്നു.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: עיר എന്നതിന് പട്ടണം/നഗരം എന്നർഥമുണ്ട്; ഈ സ്ഥലവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണം’ സ്വാഭാവികവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: עִיר עִיר
  choice: ഓരോന്നിനും
  rationale: പദത്തിന്റെ ആവർത്തനം വിതരണാർഥം നൽകുന്നു—‘പട്ടണംതോറും’ അഥവാ ഓരോ പട്ടണത്തിനും. മുൻപുള്ള ‘ഈ പട്ടണങ്ങളിൽ’ എന്നതിനോടു ചേർത്ത് ‘ഓരോന്നിനും’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וּמִגְרָשֶׁיהָ
  choice: മേച്ചിൽപ്പുറങ്ങൾ
  rationale: מִגְרָשׁ പട്ടണത്തോടു ചേർന്ന തുറന്ന ഭൂമിയെയോ കന്നുകാലികളുടെ മേച്ചിൽഭൂമിയെയോ സൂചിപ്പിക്കുന്നു; ‘മേച്ചിൽപ്പുറങ്ങൾ’ ഈ വകയിരുത്തൽസന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: סְבִיבֹתֶיהָ
  choice: അതിനെ ചുറ്റിയുള്ള
  rationale: നഗരത്തിന് ചുറ്റുമുള്ള സ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെയായിരുന്നു
  rationale: മുമ്പു പറഞ്ഞ ക്രമം എല്ലാ പട്ടണങ്ങൾക്കും ബാധകമായിരുന്നുവെന്ന സമാപനസംഗ്രഹം നൽകുന്നു.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾക്കെല്ലാം
  rationale: മുഴുവൻ പട്ടണസമൂഹത്തിലേക്കുള്ള പൊതുവത്കരണം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
