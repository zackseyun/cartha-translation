  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: ml
  text: ശേഷിച്ച ലേവ്യരായ മെരാരിയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങൾക്ക് സെബൂലൂൻ ഗോത്രത്തിൽനിന്ന് യൊക്നെയാമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, കർത്തായും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം ചില ഇംഗ്ലീഷ് പരിഭാഷകളിൽ “Kartha” എന്നും എഴുതപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  choice: കുടുംബങ്ങൾക്ക്
  rationale: മുൻവാക്യത്തിലെ നഗരവിഹിതപ്പട്ടിക തുടരുന്ന സംയോജകവും ദാതൃവിഭക്തിയും മലയാളത്തിലെ വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. מִשְׁפְּחוֹת എന്നത് ഗോത്രത്തിനുള്ളിലെ കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരുടെ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സന്തതികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: הַ/לְוִיִּם הַ/נּוֹתָרִים
  choice: ശേഷിച്ച ലേവ്യരായ
  rationale: മുൻപ് വിഹിതം ലഭിക്കാതെ ശേഷിച്ചിരുന്ന ലേവ്യവിഭാഗമാണെന്ന് സംക്ഷിപ്തമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: מֵ/אֵת מַטֵּה זְבוּלֻן
  choice: സെബൂലൂൻ ഗോത്രത്തിൽനിന്ന്
  rationale: വിഹിതം ലഭിച്ച ഉറവിടത്തെ מֵאֵת സൂചിപ്പിക്കുന്നു; ഗോത്രവിഹിതത്തിന്റെ സന്ദർഭത്തിൽ מַטֶּה എന്നതിന് 'ഗോത്രം' യോജിക്കുന്നു.
- source_word: יָקְנְעָם
  choice: യൊക്നെയാം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തിനു ചുറ്റുമുള്ള കന്നുകാലിമേച്ചിലിനും പൊതുപയോഗത്തിനുമുള്ള തുറന്ന ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ 'മേച്ചിൽപ്പുറങ്ങൾ' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: קַרְתָּה
  choice: കർത്ത
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: implicit allotment verb
  choice: നൽകി
  rationale: മസോരറ്റിക് വാക്യത്തിൽ ക്രിയ ഈ വാക്യത്തിൽ പ്രത്യക്ഷമല്ല; മുൻവാക്യങ്ങളിൽനിന്ന് തുടരുന്ന പട്ടികയുടെ അർത്ഥം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമാക്കാൻ 'നൽകി' ചേർത്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ക്രിയാരഹിതമായ തുടർച്ച മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ സന്ദർഭത്തിൽനിന്ന് സൂചിതമായ ‘നൽകി’ ചേർത്തു. എല്ലാ സ്ഥലനാമങ്ങളും എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
