translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ഭൂവിഹിതപ്പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും അവസാനത്തെ അർദ്ധവിരാമവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിന്റെ ആദ്യ പ്രത്യക്ഷതയ്ക്കു പിന്നാലെ ചേർത്തു.
