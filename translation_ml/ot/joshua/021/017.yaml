source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֔ן אֶת גִּבְע֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת גֶּ֖בַע וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
