  yaml_path: translation/ot/joshua/021/017.yaml
  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: ml
  text: 'ബെന്യാമീൻ ഗോത്രത്തിൽനിന്ന്: ഗിബെയോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഗേബായും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊതുഭൂമി’ എന്നും ‘ചുറ്റുമുള്ള തുറസ്സായ ഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഓരോ നഗരത്തിനും ചുറ്റുമുണ്ടായിരുന്ന ഭൂമിയെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതങ്ങളുടെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്. വാക്യാരംഭത്തിലെ וּ മുൻപത്തെ പട്ടികയോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ പട്ടികാശൈലിയിൽ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: גִּבְעוֹן
  choice: ഗിബെയോൻ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന, മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു; אֶת പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരത്തെ ചുറ്റിയുള്ള തുറന്ന പൊതുഭൂമിയെയോ കന്നുകാലികൾക്കുള്ള മേച്ചിൽഭൂമിയെയോ מִגְרָשׁ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വീകരിച്ചു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: גֶּבַע
  choice: ഗേബ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ വേർതിരിവ് നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: וְ/אֶת
  choice: -യും
  rationale: പട്ടികയിലെ നഗരങ്ങളെ ബന്ധിപ്പിക്കുന്ന וְ മലയാളത്തിൽ സ്വാഭാവികമായ സമുച്ചയപ്രത്യയമായ ‘-യും’കൊണ്ട് പ്രകടിപ്പിച്ചു; אֶת പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
