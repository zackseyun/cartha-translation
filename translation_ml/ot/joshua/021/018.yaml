  rationale: മִגְרָש്ׁ പട്ടണത്തോടു ചേർന്ന, അതിന്റെ ഉപയോഗത്തിനുള്ള തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു; മേയിക്കൽ എന്ന സാധാരണ ഉപയോഗസൂചന നിലനിർത്താൻ ‘മേച്ചിൽപ്പുറങ്ങൾ’ സ്വീകരിച്ചു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: עַלְמוֹן
  choice: അൽമോൻ
  rationale: സ്ഥലപ്പേര് എബ്രായ രൂപത്തോട് അടുത്തായി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: പട്ടികപ്പെടുത്തിയ സ്ഥലങ്ങളുടെ സംഗ്രഹസംഖ്യ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; עָרִים എന്നതിന് ഈ വിതരണപ്പട്ടികയുടെ സാഹചര്യത്തിൽ ‘പട്ടണങ്ങൾ’ അനുയോജ്യം.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ‘ഉം’ എന്ന ഏകോപനഘടനയിൽ പ്രതിഫലിപ്പിച്ചു
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നമായ אֶת-ന് മലയാളത്തിൽ പ്രത്യേക സമാനപദമില്ല; പട്ടികയിലെ ഘടകങ്ങളെ ‘ഉം’ ഉപയോഗിച്ച് ബന്ധിപ്പിച്ചു.
