source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/לְוִיִּ֔ם אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה בַּ/גּוֹרָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽമക്കൾ യാഹ്‌വെ മോശെയിലൂടെ[a] കല്പിച്ചതുപോലെ, ഈ പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും നറുക്കിലൂടെ ലേവ്യർക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മോശെയുടെ കയ്യാൽ.” മോശെയെ മധ്യസ്ഥനായി സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കൊടുക്കുക’ ഇവിടെ പട്ടണങ്ങൾ ലേവ്യർക്കു നൽകുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന മൂലപ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: ലേവി ഗോത്രക്കാരെ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ സംപ്രദാനരൂപം.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: മുമ്പ് നിർദേശിക്കപ്പെട്ട പ്രത്യേക പട്ടണങ്ങളിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു.
- source_word: מִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള, കന്നുകാലികളെ മേയിക്കാനും പൊതുവായ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറന്ന നിലങ്ങളെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: നൽകൽ ദൈവിക കല്പനയ്ക്ക് അനുസൃതമായിരുന്നുവെന്ന താരതമ്യവും അനുരൂപതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: നൽകലിനു മുമ്പുണ്ടായ ദൈവിക ആജ്ഞയെ സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ സാധാരണ ഭൂതകാലരൂപം മതിയാകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ശീർഷകമായി പകരംവയ്ക്കാതെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയുടെ കൈമുഖാന്തരം
  rationale: മധ്യസ്ഥമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּגּוֹרָל
  choice: നറുക്കിട്ട്
  rationale: നറുക്കെടുപ്പിലൂടെ പട്ടണങ്ങൾ വിഭജിച്ചുനൽകിയ പ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു പദവിനാമം ഉപയോഗിക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം ‘യാഹ്‌വെ’ എബ്രായ ഉച്ചാരണത്തെ കൂടുതൽ അടുത്ത് പ്രതിനിധീകരിക്കുന്നു.
- issue: בְּיַד מֹשֶׁה എന്ന മധ്യസ്ഥ-കർതൃത്വ പ്രയോഗം
  choice: മോശെയുടെ കൈമുഖാന്തരം
  alternative: മോശെ മുഖാന്തരം
  rationale: കല്പന യാഹ്‌വെയുടേതും മോശെ അതിന്റെ മധ്യസ്ഥനും ആണെന്ന ബന്ധം നിലനിർത്തിക്കൊണ്ട് മൂലത്തിലെ ‘കൈ’ എന്ന ശൈലിപ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ വാക്യബന്ധം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു; ‘നറുക്കിട്ട്’ എന്നത് ക്രിയയോടുള്ള ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
