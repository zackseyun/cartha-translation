  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: ml
  text: യഹ്‌വെ ഇസ്രായേൽഗൃഹത്തോടു പറഞ്ഞ എല്ലാ നല്ല വാക്കുകളിലും ഒന്നുപോലും വിഫലമായില്ല[a]; എല്ലാം നിറവേറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹ്‌വെ ഇസ്രായേൽഗൃഹത്തോടു ചെയ്ത എല്ലാ നല്ല വാഗ്ദാനങ്ങളിലും ഒന്നുപോലും നിറവേറാതെ പോയില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: ഒരു വാക്കുപോലും വിഫലമായില്ല
  rationale: നָפַל എന്നതിന്റെ അക്ഷരാർഥം ‘വീണു’ എന്നാണെങ്കിലും דָּבָר-നോടൊപ്പമുള്ള ഈ പ്രയോഗം പറഞ്ഞ വാക്ക് പരാജയപ്പെടുകയോ ഫലിക്കാതിരിക്കുകയോ ചെയ്തില്ല എന്നർഥം നൽകുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘വിഫലമായില്ല’ ആ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: എല്ലാ നല്ല വാക്കുകളിലും
  rationale: ദൈവം പറഞ്ഞതിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചന-സമാഹാരപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി. ‘വാക്കുകൾ’ എന്നത് ദִּבֶּר എന്ന സംസാരക്രിയയുമായുള്ള ബന്ധം നിലനിർത്തുകയും ‘വാഗ്ദാനങ്ങൾ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר
  choice: പറഞ്ഞ
  rationale: മുൻപ് നടന്ന ദൈവിക പ്രസ്താവനയെ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ പാഠത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹത്തോടു
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉറവിടത്തിലെ ഔപചാരികവും സമൂഹപരവുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הַכֹּל בָּא
  choice: എല്ലാം നിറവേറി
  rationale: בָּא എന്നതിന്റെ അക്ഷരാർഥം ‘വന്നു’ എന്നാണെങ്കിലും ഇവിടെ പറഞ്ഞതെല്ലാം യാഥാർഥ്യമായി എന്ന പൂർത്തീകരണപ്രയോഗമാണ്. ‘നിറവേറി’ മലയാളത്തിൽ അതിന്റെ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: ഉറവിടപാഠം സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: דָּבָר എന്നത് ‘വാക്ക്’ എന്നോ ‘വാഗ്ദാനം’ എന്നോ നൽകുന്നത്
  choice: വാക്ക്
  alternative: വാഗ്ദാനം
  rationale: ‘വാക്ക്’ എന്നത് ഉറവിടത്തിലെ പദവും ‘പറഞ്ഞു’ എന്ന ക്രിയയുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘വാഗ്ദാനം’ സാധുവായ അർഥമാണെങ്കിലും അത് കൂടുതൽ വ്യാഖ്യാനപരമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽഗൃഹം’ എന്ന ഉറവിടരൂപവും ദൈവനാമവും നിലനിർത്തി; ദുഷ്കരമായ എബ്രായ പദക്രമം മലയാളവായനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
