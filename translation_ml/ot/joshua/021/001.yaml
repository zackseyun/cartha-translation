id: JOS.21.1
reference: Joshua 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: ml
  text: അപ്പോൾ ലേവ്യരുടെ പിതൃകുടുംബത്തലവന്മാർ[a] പുരോഹിതനായ എലെയാസറെയും നൂന്റെ മകനായ യോശുവയെയും ഇസ്രായേൽമക്കളുടെ[b] ഗോത്രങ്ങളിലെ പിതൃകുടുംബത്തലവന്മാരെയും സമീപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൂർവികകുടുംബങ്ങളുടെ തലവന്മാർ” അല്ലെങ്കിൽ “കുടുംബത്തലവന്മാർ.” പിതൃനേതൃത്വത്തിലുള്ള കുലാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേല്യർ.” അക്ഷരാർഥം, “ഇസ്രായേലിന്റെ മക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: സമീപിച്ചു
  rationale: נגשׁ എന്ന ക്രിയയുടെ ‘അടുത്തുചെല്ലുക/സമീപിക്കുക’ എന്ന അർഥം സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רָאשֵׁי אֲבוֹת
  choice: പിതൃകുടുംബത്തലവന്മാർ
  rationale: പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളുടെ തലവന്മാരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സാമൂഹിക ഘടന ദൃശ്യമാക്കുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവി ഗോത്രവിഭാഗത്തിനുള്ള പ്രചാരത്തിലുള്ള മലയാള പദം.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസർ
  rationale: כֹּהֵן എന്നത് അധിക വിശദീകരണമില്ലാതെ ‘പുരോഹിതൻ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: എബ്രായ പിതൃനാമഘടന കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: ഗോത്രങ്ങളിലെ പിതൃകുടുംബത്തലവന്മാർ
  rationale: מַטּוֹת എന്ന ഗോത്രഘടകത്തെയും അതിനുള്ളിലെ പിതൃകുടുംബ നേതൃത്വത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബാധിഷ്ഠിത സമൂഹപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഗോത്രഘടനയിലെ ലിംഗസൂചക ബന്ധുത്വഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘പിതൃകുടുംബത്തലവന്മാർ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നീ പ്രയോഗങ്ങൾ നിലനിർത്തി
  alternative: ‘പൂർവികകുടുംബങ്ങളുടെ തലവന്മാർ’, ‘കുടുംബത്തലവന്മാർ’, ‘ഇസ്രായേല്യർ’
  rationale: എബ്രായത്തിലെ പുരുഷബന്ധുത്വ പദങ്ങൾ വെറും പൊതുജനസമൂഹത്തെയല്ല, പ്രതിനിധിത്വപരമായ കുടുംബ-ഗോത്ര ഘടനയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അർഥം ലിംഗനിരപേക്ഷമായി പരത്താതെ, വായനാസൗകര്യത്തോടെ മൂലഭാഷയുടെ രൂപകൽപ്പന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭരണപരവും ഗോത്രപരവുമായ സന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തിയിട്ടുണ്ട്; ദുർഗ്രാഹ്യമായ പദാനുപദരൂപം ഒഴിവാക്കി.
