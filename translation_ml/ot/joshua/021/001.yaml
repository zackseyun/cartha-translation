  source_fidelity: 'മൂലഎബ്രായത്തിലെ ക്രമവും ബന്ധങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ലേവ്യരുടെ പിതൃകുടുംബത്തലവന്മാർ എലെയാസർ പുരോഹിതൻ, നൂന്റെ മകൻ യോശുവ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃകുടുംബത്തലവന്മാർ എന്നിവരെ സമീപിക്കുന്നു. ‘ഗോത്രങ്ങളിലെ’ എന്ന പ്രയോഗം מַטּוֹת ലִבְנֵי יִשְׂרָאֵל എന്ന ഘടനയെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്യുന്നു.'
