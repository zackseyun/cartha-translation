lexical_decisions:
- source_word: קְדֵמוֹת
  choice: കെദേമോത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധത്തിൽ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ഒരു പട്ടണത്തോടു ചേർന്ന പൊതുവായ തുറസ്സായ ഭൂമിയെയോ മൃഗങ്ങളെ മേയ്ക്കാനുള്ള പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്ന מִגְרָשׁ എന്ന പദത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: מֵיפָעַת
  choice: മേഫാത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തോട് അടുത്തതായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ സംഖ്യാത്മക സംഗ്രഹം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി; עָרִים എന്നതിന് ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ അനുയോജ്യമാണ്.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: …ഉം അതിന്റെ …കളും, …ഉം അതിന്റെ …കളും
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമചിഹ്നങ്ങളെ യാന്ത്രികമായി പകർത്താതെ, ഓരോ പട്ടണവും അതിനോടു ചേർന്ന ഭൂമിയും ഒരുമിച്ചുള്ള പട്ടികയായി മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു.
