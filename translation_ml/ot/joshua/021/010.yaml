id: JOS.21.10
reference: Joshua 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാരിൽപ്പെട്ട കെഹാത്യരുടെ കുടുംബങ്ങളിൽനിന്നുള്ള അഹരോന്റെ പുത്രന്മാർക്കായിരുന്നു അത്[a]; കാരണം ആദ്യത്തെ നറുക്ക് അവർക്കായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കെഹാത്യരുടെ കുലങ്ങളിൽനിന്നുള്ള.’
    reason: מִשְׁפְּחוֹת എന്ന പദത്തിന് ‘കുടുംബങ്ങൾ’ എന്നും ‘കുലങ്ങൾ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർക്കായിരുന്നു ഈ പട്ടണങ്ങൾ ലഭിച്ചത്
  rationale: ഹീബ്രു വാക്യം അക്ഷരാർഥത്തിൽ ‘അഹരോന്റെ പുത്രന്മാർക്കായിരുന്നു’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ പട്ടണവിഭജനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഈ പട്ടണങ്ങൾ ലഭിച്ചത്’ എന്നു പൂരിപ്പിച്ചു.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: കെഹാത്യകുടുംബങ്ങളിൽ
  rationale: מִשְׁפָּחוֹת എന്നത് വിപുലമായ കുടുംബവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘കുടുംബങ്ങൾ’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִבְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരിൽപ്പെട്ട
  rationale: മൂലത്തിലെ വംശാവലിപരമായ ‘ലേവിയുടെ പുത്രന്മാർ’ എന്ന പ്രയോഗം സംരക്ഷിക്കുകയും കെഹാത്യകുടുംബങ്ങളുമായുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള വാക്യഭാഗം മുൻപ്രസ്താവനയുടെ കാരണം നൽകുന്നതിനാൽ വ്യക്തമായ കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: ആദ്യത്തെ നറുക്ക് അവർക്കായിരുന്നു
  rationale: പട്ടണങ്ങളുടെ വിഭജനത്തിനായി ഇട്ട നറുക്കിൽ അവർക്കു ലഭിച്ച മുൻഗണനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘പുത്രന്മാർ’, ‘നറുക്ക്’ എന്നീ പദങ്ങൾ വംശാവലി-വിഭജന പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുന്നു; മൂലത്തിൽ നിഗൂഢമായി ഉള്ള ‘പട്ടണങ്ങൾ’ മുൻസന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതായി അടിക്കുറിപ്പിലെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം സൂചിപ്പിക്കുന്നു.
