reference: Joshua 21:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: ml
  text: അവരുടെ പിതാക്കന്മാരോടു താൻ സത്യം ചെയ്തതെല്ലാം അനുസരിച്ച് യഹ്‌വെ അവർക്കു ചുറ്റുമെല്ലാം വിശ്രമം നൽകി. അവരുടെ സകല ശത്രുക്കളിൽ ഒരാൾപോലും അവരുടെ മുമ്പിൽ ഉറച്ചുനിന്നില്ല[a]. അവരുടെ എല്ലാ ശത്രുക്കളെയും യഹ്‌വെ അവരുടെ കൈയിൽ ഏല്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ ചെറുത്തുനിൽക്കാൻ ആർക്കും കഴിഞ്ഞില്ല.” ‘അവരുടെ മുമ്പിൽ നിൽക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം വിജയകരമായി ചെറുത്തുനിൽക്കുക എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കൈയിൽ ഏല്പിക്കുക’ എന്നത് ഒരാളെ മറ്റൊരാളുടെ അധികാരത്തിന് കീഴിലാക്കുക എന്നർഥമുള്ള സാധാരണ ഹീബ്രു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: വിശ്രമം നൽകി
  rationale: നוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘വിശ്രമിക്കാൻ ഇടയാക്കി/വിശ്രമം നൽകി’ എന്നർഥം നൽകുന്നു; ഉടമ്പടിവാഗ്ദത്തത്തിന്റെ പൂർത്തീകരണവും യുദ്ധഭീഷണിയിൽനിന്നുള്ള ആശ്വാസവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന അംഗീകൃത പുനർനിർമാണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מִסָּבִיב
  choice: ചുറ്റുമെല്ലാം
  rationale: ചുറ്റുമുള്ള എല്ലാ ദിക്കുകളിൽനിന്നുമുള്ള സമഗ്ര സുരക്ഷ എന്ന സ്ഥലപരവും സമ്പൂർണവുമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: താൻ സത്യം ചെയ്തതെല്ലാം അനുസരിച്ച്
  rationale: כְּ എന്നതിന്റെ അനുരൂപതയും כֹּל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തി, മുൻപ് ചെയ്ത സത്യത്തിന്റെ കൃത്യമായ പൂർത്തീകരണം വ്യക്തമാക്കുന്നു.
- source_word: לַאֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാരോട്
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ പുരുഷലിംഗ കുടുംബപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: ഒരാൾപോലും അവരുടെ മുമ്പിൽ ഉറച്ചുനിന്നില്ല
  rationale: ‘അവരുടെ മുമ്പിൽ നിൽക്കുക’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, വിജയകരമായി ചെറുത്തുനിൽക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘ഉറച്ചുനിന്നില്ല’ എന്നു നൽകി.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: അവരുടെ സകല ശത്രുക്കളിലും
  rationale: നിഷേധവാക്യത്തിലെ מן-ന്റെ ഭാഗാത്മക അർഥം, ശത്രുക്കളുടെ മുഴുവൻ കൂട്ടത്തിൽനിന്ന് ഒരാൾപോലും എന്ന നിലയിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: נָתַן ... בְּיָדָם
  choice: അവരുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: മറ്റൊരാളുടെ അധികാരത്തിന് കീഴിൽ ഏല്പിക്കുക എന്ന സാധാരണ ഹീബ്രു പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികമായ ‘കൈയിൽ ഏല്പിച്ചു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; മൂലത്തിലെ ഏകവചന ‘കൈ’യും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യക്തിനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ലַאֲבוֹתָם എന്ന പുരുഷലിംഗ പദം
  choice: അവരുടെ പിതാക്കന്മാരോട്
  alternative: അവരുടെ പൂർവികരോട്
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന വ്യക്തമായ പദം ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തി.
- issue: ‘അവരുടെ മുമ്പിൽ നിൽക്കുക’ എന്ന യുദ്ധസന്ദർഭത്തിലെ പ്രയോഗം
  choice: അവരുടെ മുമ്പിൽ ഉറച്ചുനിന്നില്ല
  alternative: അവരെ ചെറുത്തുനിൽക്കാൻ കഴിഞ്ഞില്ല
  rationale: ഹീബ്രു ദൃശ്യരൂപവും അതിന്റെ വിജയകരമായ പ്രതിരോധം എന്ന ആശയവും ഒരുമിച്ചു നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ചുറ്റുമെല്ലാം’, ‘വിശ്രമം നൽകി’, ‘കൈയിൽ ഏല്പിച്ചു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ദൃശ്യരൂപവും ഉടമ്പടി-പൂർത്തീകരണ ഭാവവും നിലനിർത്തുന്നതുമാണ്. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കത്തോട് പൊരുത്തപ്പെടാതെ നീങ്ങിയിരുന്നതിനാൽ, ‘മുമ്പിൽ ഉറച്ചുനിന്നില്ല’ എന്നതിന് [a]യും ‘കൈയിൽ ഏല്പിച്ചു’ എന്നതിന് [b]യും യഥാസ്ഥാനത്ത് ചേർത്തു.
