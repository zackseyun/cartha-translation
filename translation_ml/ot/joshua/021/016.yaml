translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും മാന്യവുമായ മലയാളം. പട്ടികയുടെ എബ്രായ ഘടന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികതയ്ക്കായി ബന്ധകങ്ങൾ ചേർത്തിരിക്കുന്നു; സ്ഥലനാമങ്ങൾ അർത്ഥവിവർത്തനം ചെയ്തിട്ടില്ല.
