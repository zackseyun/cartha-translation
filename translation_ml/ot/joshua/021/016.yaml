  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: ml
  text: അയീനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], യുത്തയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ബേത്ത്-ശേമെശും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ഈ രണ്ടു ഗോത്രങ്ങളിൽനിന്ന് ആകെ ഒൻപതു പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൊതുഭൂമികൾ’ അല്ലെങ്കിൽ ‘ചുറ്റുമുള്ള തുറസ്സായ സ്ഥലങ്ങൾ’; ഓരോ പട്ടണത്തോടും ചേർന്നിരുന്ന ഭൂമി.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: അയീൻ
  rationale: സ്ഥലനാമം അർത്ഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്നതും പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചതുമായ തുറസ്സായ പൊതുഭൂമിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יֻטָּה
  choice: യുത്ത
  rationale: സ്ഥലനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: בֵּית שֶׁמֶשׁ
  choice: ബേത്ത്-ശേമെശ്
  rationale: ഘടകങ്ങളുടെ അർത്ഥം ‘സൂര്യന്റെ ഭവനം’ എന്നാണെങ്കിലും ഇവിടെ സ്ഥാപിതമായ സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: עָרִים תֵּשַׁע
  choice: ആകെ ഒൻപതു പട്ടണങ്ങൾ
  rationale: עָרִים എന്നത് ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്. പട്ടികയുടെ സംഗ്രഹസംഖ്യ വ്യക്തമാക്കാൻ ‘ആകെ’ ചേർത്തു.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: ഈ രണ്ടു ഗോത്രങ്ങളിൽനിന്ന്
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ രണ്ടു ഗോത്രങ്ങളിൽനിന്നുള്ള വിഹിതമാണെന്ന ഉറവിടബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
