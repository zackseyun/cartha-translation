  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: ml
  text: 'ആശേർ ഗോത്രത്തിൽനിന്ന്: മിശാൽ പട്ടണവും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], അബ്ദോൻ പട്ടണവും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നത് പട്ടണത്തോടു ചേർന്ന, പ്രധാനമായും കന്നുകാലികളെ മേയ്ക്കുന്നതിനും മറ്റു പൊതുവായ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה אָשֵׁר
  choice: ആശേർ ഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതത്തിന്റെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; മുൻപ്രത്യയങ്ങൾ ബന്ധകവും ‘നിന്ന്’ എന്ന അർഥവും നൽകുന്നു.
- source_word: מִשְׁאָל
  choice: മിശാൽ
  rationale: എബ്രായ വ്യഞ്ജനരൂപത്തോട് അടുത്തുനിൽക്കുന്ന സ്ഥലനാമലിപ്യന്തരണം.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കാനും പൊതുവായ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്.
- source_word: עַבְדּוֹן
  choice: അബ്ദോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: אֶת / וְאֶת
  choice: പട്ടണവും … പട്ടണവും
  rationale: אֶת എന്ന കർമസൂചകത്തിന് മലയാളത്തിൽ നേരിട്ടുള്ള പരിഭാഷ ആവശ്യമില്ല; പട്ടണപ്പട്ടികയുടെ വാക്യഘടന വ്യക്തമാക്കാൻ ‘പട്ടണം’ ചേർത്തും וְ എന്ന ബന്ധകം ‘വും’കൊണ്ടും പ്രതിനിധീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികാസ്വഭാവം നിലനിർത്താൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു. ‘പട്ടണം’ മൂലപാഠത്തിൽ പ്രത്യേകം ഇല്ലെങ്കിലും മേച്ചിൽപ്പുറങ്ങൾ ഏതിനോടു ബന്ധപ്പെട്ടതാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനായി ചേർത്തിരിക്കുന്നു. ‘മിശാൽ/മിശെയാൽ’ എന്ന ഇംഗ്ലീഷ് ലിപ്യന്തരണവ്യത്യാസം മലയാള പരിഭാഷയ്ക്ക് നിർണായകമല്ലാത്തതിനാൽ പ്രത്യേക അടിക്കുറിപ്പാക്കിയിട്ടില്ല.
