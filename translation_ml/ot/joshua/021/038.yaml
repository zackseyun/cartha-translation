reference: Joshua 21:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: ml
  text: 'ഗാദ് ഗോത്രത്തിൽനിന്ന്: കൊന്നയാളുടെ അഭയനഗരമായ ഗിലെയാദിലെ രാമോത്തും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[b], മഹനയീമും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗിലെയാദ്-രാമോത്ത്’ എന്നും പറയാം. എബ്രായപദപ്രയോഗം ‘ഗിലെയാദിലെ രാമോത്ത്’ എന്നോ സംയുക്ത സ്ഥലനാമമായോ നൽകാം.
    reason: alternative_reading
  - marker: b
    text: ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നത് നഗരത്തോടൊപ്പം ഉപയോഗത്തിനായി അനുവദിച്ച, അതിനു ചുറ്റുമുള്ള ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: ഗാദ് ഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതങ്ങളുടെ സന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; മുൻപദമായ וּ തുടർന്നുവരുന്ന പട്ടികയോടുള്ള ബന്ധം മലയാളത്തിലെ വിരാമചിഹ്നവും വാക്യഘടനയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עִיר מִקְלַט
  choice: അഭയനഗരം
  rationale: അഭയം തേടാവുന്ന നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട നഗരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ പ്രയോഗത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הָרֹצֵחַ
  choice: കൊന്നവൻ
  rationale: അഭയനഗരത്തിന്റെ നിയമസന്ദർഭത്തിൽ ഈ പദം മുൻകൂട്ടിയുള്ള ഉദ്ദേശത്തോടെ കൊല ചെയ്തവനെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; അതിനാൽ കുറ്റത്തിന്റെ സ്വഭാവം മുൻകൂട്ടി തീർപ്പാക്കാത്ത വിശാലമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: רָמֹת בַּ/גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്ത്
  rationale: בַּ എന്ന സ്ഥലബന്ധം ‘ഗിലെയാദിലെ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരങ്ങളോടു ചേർത്ത് അനുവദിച്ച, കന്നുകാലികളെ മേയിക്കാനുള്ള ചുറ്റുമുള്ള പൊതുഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്.
- source_word: מַחֲנַיִם
  choice: മഹനയീം
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദം കുറ്റത്തിന്റെ നിയമസ്വഭാവം എങ്ങനെ പ്രതിനിധീകരിക്കണം
  choice: കൊന്നവൻ
  alternative: കൊലപാതകി
  rationale: ‘കൊലപാതകി’ മുൻകൂട്ടിയുള്ള ഉദ്ദേശവും നിയമപരമായ കുറ്റവിധിയും സൂചിപ്പിക്കാം. അഭയനഗരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ അത്തരം വിധി മുൻകൂട്ടി ചുമത്താതെ ഉറവിടത്തിലെ വ്യാപ്തിയും നിയമപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. പട്ടികാസ്വഭാവം നിലനിർത്താൻ ദ്വിബിന്ദുവും ഏകോപിത ഘടനയും ഉപയോഗിച്ചു. ‘കൊന്നവൻ’ എന്നത് നിയമപരമായ കുറ്റത്തിന്റെ അളവ് അനാവശ്യമായി നിർണ്ണയിക്കാതെ മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തി കാക്കുന്നു.
