  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת תַּעְנַךְ֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: ml
  text: 'മനശ്ശെഗോത്രത്തിന്റെ പകുതിയിൽനിന്ന്: താനാക്ക്[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ഗത്ത്-രിമ്മോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ആകെ രണ്ടു പട്ടണങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഹീബ്രായ കൈയെഴുത്തുപ്രതികളിലും 1 ദിനവൃത്താന്തം 6:70-ലെ സമാന്തരപാഠത്തിലും മനശ്ശെയിൽനിന്ന് നൽകിയ പട്ടണങ്ങളുടെ പേരുകൾ വ്യത്യസ്തമാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה
  choice: മനശ്ശെയുടെ പാതിഗോത്രത്തിൽനിന്ന്
  rationale: മִן ഉറവിടവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; מַחֲצִית מַטֵּה എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പാതിഗോത്രം’ എന്നു നൽകി.
- source_word: תַּעְנַךְ
  choice: താനാക്ക്
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർന്നു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന, കന്നുകാലികളെ മേയ്ക്കുന്നതിനുള്ള തുറസ്സായ പൊതുഭൂമിയാണ് מִגְרָשׁ; ആവർത്തിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: גַּת רִמּוֹן
  choice: ഗത്ത്-രിമ്മോൻ
  rationale: സംയുക്ത സ്ഥലനാമം ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്ത്, വായനാസൗകര്യത്തിന് ഹൈഫനോടെ ലിപ്യന്തരിച്ചു.
- source_word: עָרִים שְׁתָּיִם
  choice: ആകെ രണ്ടു പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ അവസാനത്തിലെ എണ്ണസംഗ്രഹം വ്യക്തമായി നൽകുന്നു; עִיר ഇവിടെ വലുപ്പമേറിയ നഗരമെന്ന നിർബന്ധമില്ലാത്തതിനാൽ ‘പട്ടണം’ യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തുകയും അവസാനത്തെ എണ്ണസംഗ്രഹത്തിന് വ്യക്തതയ്ക്കായി ‘ആകെ’ ചേർക്കുകയും ചെയ്തു.
