  terminology: “മേച്ചിൽപ്പുറങ്ങൾ” is an acceptable contextual rendering of מִגְרָשֶׁהָ, and “പട്ടണങ്ങൾ” suitably renders עָרִים in this settlement list. The transliterated names are retained.
