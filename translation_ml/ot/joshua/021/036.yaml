source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֖צֶר וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: ml
  text: 'രൂബേൻ ഗോത്രത്തിൽനിന്ന്: ബേസെരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[b], യഹ്സായും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സ്ഥലനാമം ചില പരിഭാഷകളിൽ യഹാസ്, യഹസാ, യഹാസാ എന്നീ രൂപങ്ങളിലും കാണപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ചില ഹീബ്രു കൈയെഴുത്തുപ്രതികളിലും പുരാതന സാക്ഷ്യപാഠങ്ങളിലും യോശുവ 21:36–37 ഇല്ല. ഇവിടെ പറയുന്ന നഗരങ്ങൾ 1 ദിനവൃത്താന്തം 6:78–79-ലെ പട്ടികയ്ക്കു സമാന്തരമാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה רְאוּבֵן
  choice: രൂബേൻഗോത്രത്തിൽനിന്ന്
  rationale: ഗോത്രവിഹിതങ്ങളുടെ പട്ടികയിൽ מִן + מַטֶּה ഒരു ഗോത്രത്തിൽനിന്നുള്ള നഗരങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ പട്ടികാശൈലിക്ക് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണിത്.
- source_word: בֶּצֶר
  choice: ബേസെർ
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁהָ
  choice: മേച്ചിൽപ്പുറങ്ങളോടുകൂടിയ
  rationale: ലേവ്യനഗരങ്ങളുടെ സന്ദർഭത്തിൽ מִגְרָשׁ നഗരം ചുറ്റുമുള്ള തുറന്ന പൊതുഭൂമിയെയോ കന്നുകാലികൾക്കുള്ള മേച്ചിൽഭൂമിയെയോ സൂചിപ്പിക്കുന്നു. ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יַהְצָה
  choice: യഹ്‌സ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ രൂപം മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു; മറ്റു ഭാഷകളിലെ വ്യത്യസ്ത പരമ്പരാഗത രൂപങ്ങൾ മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. വാക്യം ഒരു നഗരപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
