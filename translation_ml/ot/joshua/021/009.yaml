id: JOS.21.9
reference: Joshua 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ מִ/מַּטֵּה֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן אֵ֚ת הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרָ֥א אֶתְ/הֶ֖ן בְּ/שֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: ml
  text: 'അവർ യെഹൂദയുടെ മക്കളുടെ ഗോത്രത്തിൽനിന്നും ശിമെയോന്റെ മക്കളുടെ ഗോത്രത്തിൽനിന്നും പേരുപറഞ്ഞിരിക്കുന്ന ഈ പട്ടണങ്ങൾ[a] കൊടുത്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പേരിട്ടു സൂചിപ്പിച്ചിരിക്കുന്ന” അല്ലെങ്കിൽ “പേരുകൾ പ്രത്യേകം പറഞ്ഞിരിക്കുന്ന.” തുടർന്നുള്ള പട്ടികയിൽ പട്ടണങ്ങൾ ഓരോന്നായി പേരോടെ നൽകപ്പെടുന്നു എന്നാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: അവർ കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ഈ ഭൂവിഭജനസന്ദർഭത്തിൽ പട്ടണങ്ങൾ ലേവ്യർക്കു വിഹിതമായി നൽകിയത് എന്ന അർഥവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: מִמַּטֵּה
  choice: ഗോത്രത്തിൽനിന്നും
  rationale: מַטֶּה എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘വടി’ എന്നായിരിക്കാമെങ്കിലും, ഇവിടെ ഭൂവിഭജനസന്ദർഭത്തിലെ സ്ഥിരമായ അർഥം ‘ഗോത്രം’ ആണ്.
- source_word: בְּנֵי יְהוּדָה
  choice: യെഹൂദയുടെ മക്കളുടെ
  rationale: ‘യെഹൂദയുടെ പുത്രന്മാർ/മക്കൾ’ എന്ന കുടുംബവംശപരമായ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഗോത്രപരമായ സന്തതിയെ സൂചിപ്പിക്കാൻ ‘മക്കൾ’ സ്വാഭാവികമാണ്.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ മക്കളുടെ ഗോത്രത്തിൽനിന്നും
  rationale: മുൻവാക്യഘടകത്തോടുള്ള എബ്രായ സമാന്തരഘടനയും വംശപരമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: നേരിട്ടുള്ള കർമപദത്തെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; עָרִים എന്നതിന് പട്ടികാസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ അനുയോജ്യം.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: പേരുപറഞ്ഞിരിക്കുന്ന
  rationale: തുടർന്നുള്ള പട്ടികയിൽ ഓരോ പട്ടണവും പേരോടെ സൂചിപ്പിക്കപ്പെടുന്നു എന്ന എബ്രായ വ്യവഹാരപ്രയോഗത്തിന്റെ അർഥം നൽകുന്നു; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കുമ്പോഴും അതിന്റെ സൂചന സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യെഹൂദയുടെ മക്കൾ’, ‘ശിമെയോന്റെ മക്കൾ’ എന്നീ വംശപരമായ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ സമാന്തരത നിലനിർത്തുന്നു. പട്ടിക ആരംഭിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
