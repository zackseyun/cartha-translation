  to: ലേവ്യരുടെ കുലങ്ങളിൽപ്പെട്ട ഗേർശോന്റെ പുത്രന്മാർക്ക് മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന് കൊല ചെയ്തവന് അഭയം നൽകുന്ന നഗരമായ ബാശാനിലെ ഗോലാനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ബെഎശ്തെരാ[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും ലഭിച്ചു—രണ്ടു നഗരങ്ങൾ.
