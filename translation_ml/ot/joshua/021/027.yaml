source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: ml
  text: ലേവ്യരുടെ കുലങ്ങളിൽപ്പെട്ട ഗേർശോന്റെ പുത്രന്മാർക്ക് മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന് കൊല ചെയ്തവന് അഭയം നൽകുന്ന നഗരമായ ബാശാനിലെ ഗോലാനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ബെഎശ്തെരാ[a]യും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും ലഭിച്ചു—രണ്ടു നഗരങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ബെഎശ്തെരാ; 1 ദിനവൃത്താന്തം 6:71-ൽ അശ്താരോത്ത് എന്നു കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർക്ക്
  rationale: בני എന്നതിന്റെ വംശാവലിസംബന്ധമായ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; ദാനത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കാൻ ദത്തിവിഭക്തി ഉപയോഗിച്ചു.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: ലേവ്യരുടെ കുലങ്ങളിൽ
  rationale: מִשְׁפָּחוֹת ഇവിടെ ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുലങ്ങൾ’ ഈ ഭരണ-വംശാവലി പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ അർധഗോത്രത്തിൽനിന്ന്
  rationale: യോശുവയിലെ ഭൂവിഭജനസന്ദർഭത്തിൽ מַטֶּה ‘ഗോത്രം’ എന്നാണ്; חֲצִי എന്നത് ‘അർധ-’ ആയി സ്വാഭാവികമായി നൽകി.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: കൊല ചെയ്തവനുള്ള അഭയനഗരം
  rationale: עִיר מִקְלָט എന്ന നിയമപരമായ സ്ഥിരപ്രയോഗത്തിന് ‘അഭയനഗരം’ ഉപയോഗിച്ചു. הָרֹצֵחַ എന്ന പദം ഇവിടെ മുൻകൂട്ടിയുള്ള ഉദ്ദേശ്യം നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ ‘കൊലപാതകി’ എന്നതിനു പകരം നിഷ്പക്ഷമായ ‘കൊല ചെയ്തവൻ’ സ്വീകരിച്ചു.
- source_word: גלון בַּ/בָּשָׁן
  choice: ബാശാനിലെ ഗോലാൻ
  rationale: സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; בַּבָּשָׁן എന്ന സ്ഥലബന്ധം ‘ബാശാനിലെ’ എന്നു നൽകി.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യനഗരത്തിനു ചുറ്റുമുള്ള കന്നുകാലിമേച്ചിലിനും അനുബന്ധ ഉപയോഗങ്ങൾക്കുമുള്ള തുറസ്സായ ഭൂമിയെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּעֶשְׁתְּרָה
  choice: ബെയെശ്തെരാ
  rationale: മസോററ്റിക് പാഠത്തിലെ സ്ഥലനാമം സമാന്തരവാക്യവുമായി ഒത്തുചേർക്കാതെ ലിപ്യന്തരിച്ചു; വ്യത്യസ്ത നാമരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: עָרִים שְׁתָּיִם
  choice: ആകെ രണ്ടു നഗരങ്ങൾ
  rationale: പട്ടികയുടെ അവസാനത്തിലുള്ള സംഗ്രഹസംഖ്യ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: implicit verbal sense in allotment list
  choice: കൊടുത്തു
  rationale: ഈ വാക്യത്തിൽ വ്യക്തമായ സമാപികാക്രിയ ഇല്ലെങ്കിലും ചുറ്റുപാടുള്ള വിഭജനപ്പട്ടികയിലെ ക്രിയാഭാവം ഇവിടെ തുടർന്നുവരുന്നു; പൂർണമായ മലയാളവാക്യത്തിനായി ‘കൊടുത്തു’ ചേർത്തു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന നിയമപദത്തിന്റെ ഉദ്ദേശ്യസൂചന
  choice: കൊല ചെയ്തവൻ
  alternative: കൊലപാതകി
  rationale: അഭയനഗരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ മനഃപൂർവമല്ലാത്ത കൊലയും പരിഗണിക്കപ്പെടുന്നു. എന്നാൽ ഈ പദം ഒറ്റയ്ക്ക് ഉദ്ദേശ്യത്തെ തീർച്ചപ്പെടുത്താത്തതിനാൽ, മലയാളത്തിൽ കുറ്റത്തിന്റെ മനഃപൂർവത മുൻകൂട്ടി വിധിക്കാത്ത രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യക്രമം സ്വാഭാവികമാക്കി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പുസൂചകം തെറ്റായി ‘Gershon’ എന്നതിനു പിന്നാലെയുണ്ടായിരുന്നെങ്കിലും, അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം അനുസരിച്ച് അത് ‘ബെയെശ്തെരാ’യ്ക്കു പിന്നാലെ ശരിയായി സ്ഥാപിച്ചു.
