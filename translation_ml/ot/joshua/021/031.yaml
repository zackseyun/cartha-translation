  terminology: ‘മേച്ചിൽപ്പുറങ്ങൾ’ is an appropriate, accessible rendering of מִגְרָשֶׁהָ in this Levitical-city context. ‘പട്ടണങ്ങൾ’ suitably renders עָרִים here. ‘രെഹോബ്’ is an acceptable transliteration of רְחֹב.
