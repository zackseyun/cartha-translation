translation:
  language: ml
  text: ഹെൽക്കത്തും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും രെഹോബും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ആകെ നാല് പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: ഹെൽക്കാത്ത്
  rationale: സ്ഥലപ്പേര് അർഥപരിഭാഷ ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന് കന്നുകാലികളെ മേയ്ക്കുന്നതുൾപ്പെടെയുള്ള പൊതുപയോഗങ്ങൾക്കായിരുന്ന തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: רְחֹב
  choice: രെഹോബ്
  rationale: സ്ഥലപ്പേര് അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: ഈ വാക്യത്തിലും മുൻവാക്യത്തിലും പട്ടികപ്പെടുത്തിയ പട്ടണങ്ങളുടെ മൊത്തം എണ്ണം സൂചിപ്പിക്കുന്ന സംഗ്രഹപ്രയോഗം; മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘ആകെ’ ചേർത്തു.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: …ഉം …ഉം
  rationale: ആവർത്തിക്കുന്ന നേരിട്ടുള്ള കർമസൂചകം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; പട്ടികയുടെ ഏകോപനം ‘ഉം’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
