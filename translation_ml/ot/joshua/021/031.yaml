translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. പട്ടികാരൂപത്തിന്റെ ചുരുക്കം നിലനിർത്തിയിട്ടുണ്ട്; ‘മേച്ചിൽപ്പുറങ്ങൾ’ ലേവ്യപട്ടണങ്ങളോടു ചേർന്ന ഭൂമിയുടെ പ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
