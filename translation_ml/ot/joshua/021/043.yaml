id: JOS.21.43
reference: Joshua 21:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: ml
  text: അങ്ങനെ യഹോവ ഇസ്രായേലിന് അവരുടെ പിതാക്കന്മാർക്കു കൊടുക്കുമെന്ന് താൻ സത്യംചെയ്ത ദേശം മുഴുവനും കൊടുത്തു. അവർ അത് കൈവശമാക്കി അവിടെ പാർത്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH-നെ മലയാള ബൈബിൾ വായനയിൽ സുപരിചിതവും വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നതുമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ലളിതമായ ദാനാർഥം നേരിട്ട് പകരുന്നു; അനാവശ്യമായ വ്യാഖ്യാനഭാരം ചേർക്കുന്നില്ല.
- source_word: כָּל הָאָרֶץ
  choice: ദേശം മുഴുവനും
  rationale: ഇവിടെ אָרֶץ ഭൂമി മുഴുവനെയല്ല, ഇസ്രായേലിനു വാഗ്ദാനംചെയ്ത ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: കൊടുക്കുമെന്ന് താൻ സത്യംചെയ്ത
  rationale: നിഫാൽ രൂപത്തിലുള്ള שׁבע-യുടെ ശപഥബന്ധിതമായ പ്രതിജ്ഞ വ്യക്തമായി പകരുകയും, ആ സത്യം മുമ്പ് ചെയ്തതാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לַאֲבוֹתָם
  choice: അവരുടെ പിതാക്കന്മാർക്കു
  rationale: എബ്രായത്തിലെ വ്യക്തമായ പുരുഷലിംഗ കുടുംബപദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പൂർവപിതാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּרָשׁוּהָ
  choice: അവർ അത് കൈവശമാക്കി
  rationale: ירשׁ എന്നതിന് കൈവശപ്പെടുത്തുക, അവകാശമാക്കുക, അവകാശമായി ലഭിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ വാഗ്ദത്തദേശം യാഥാർഥ്യമായി സ്വന്തമാക്കിയതിനെ ‘കൈവശമാക്കി’ സ്വാഭാവികമായി പകരുന്നു.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: അവിടെ പാർത്തു
  rationale: ישׁב + ב എന്ന ഘടനയുടെ താമസിക്കുക/വസിക്കുക എന്ന അർഥം dignified modern Malayalam-ൽ നേരിട്ട് നൽകുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: ആദ്യത്തെ waw കഥയുടെ തുടർച്ചയ്ക്കൊപ്പം മുൻവിവരണത്തിന്റെ ഫലസംഗ്രഹവും സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദേശവാഗ്ദത്തത്തിന്റെ നിവൃത്തിയെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തിയും ശക്തിയും
  choice: യഹോവ വാഗ്ദാനംചെയ്ത ദേശം മുഴുവനും ഇസ്രായേലിനു കൊടുത്തുവെന്നും അവർ അത് കൈവശമാക്കി അവിടെ പാർത്തെന്നും വാക്യം ശക്തമായി പ്രസ്താവിക്കുന്നതുപോലെ തന്നേ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മുഴുവനും’ എന്നതിനെ മയപ്പെടുത്തുകയോ, മറുവശത്ത് ഈ വാക്യത്തെ മറ്റു കീഴടക്കവിവരണങ്ങളെ നിർബന്ധമായി അസാധുവാക്കുന്ന സമ്പൂർണ വ്യവസ്ഥാപിത അവകാശവാദമായി വികസിപ്പിക്കുകയോ ചെയ്യുക.
  rationale: כָּל എന്ന പദവും തുടർന്നുള്ള കൈവശപ്പെടുത്തൽ-വാസ ക്രിയകളും ശക്തമായ നിവൃത്തി-സംഗ്രഹം നൽകുന്നു. വാക്യത്തിന്റെ സ്വന്തം ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് വിശാലമായ കാനോനികമോ സിദ്ധാന്തപരമോ ആയ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. എബ്രായ വാക്യത്തിന്റെ സംഗ്രഹാത്മക ഫലബന്ധം ‘അങ്ങനെ’കൊണ്ട് പ്രകടിപ്പിച്ചു; ചെറുതും നേരിട്ടുമുള്ള വാക്യഘടന ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് കരടിലെ [a] അടിക്കുറിപ്പ് ലַאֲבוֹתָם-നോട് പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; ירשׁ-ന്റെ പ്രസക്തമായ അർഥവൈവിധ്യം lexical decision-ൽ രേഖപ്പെടുത്തി.
