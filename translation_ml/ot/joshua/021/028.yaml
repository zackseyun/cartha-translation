  terminology: ‘യിസ്സാഖാർ ഗോത്രത്തിൽനിന്ന്’ accurately renders the tribal source. ‘കിശ്യോൻ’ is retained. ‘ദാബ്രത്ത്’ is adjusted to correspond to the WLC consonantal form דָּבְרַת and the English POB audit spelling Dabrath. ‘മേച്ചിൽസ്ഥലം’ renders מִגְרָשׁ without importing a doctrinal interpretation.
