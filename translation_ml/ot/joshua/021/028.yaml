  source_fidelity: The verse is rendered as a list of two towns from Issachar with their respective מִגְרָשׁ (surrounding pasture/common land). The draft's plural ‘മേച്ചിൽപ്പുറങ്ങൾ’ is understandable but does not reflect the singular Hebrew form used for each town.
