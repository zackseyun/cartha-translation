  yaml_path: translation/ot/joshua/021/028.yaml
  text: 'And from the tribe of Issachar: Kishion with its pasturelands, and Dabrath with its pasturelands.'
translation:
  language: ml
  text: 'യിസ്സാഖാർ ഗോത്രത്തിൽനിന്ന്: കിശ്യോനും അതിന്റെ മേച്ചിൽസ്ഥലവും, ദാബ്രത്തും അതിന്റെ മേച്ചിൽസ്ഥലവും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה יִשָּׂשכָר
  choice: യിസ്സാഖാർ ഗോത്രം
  rationale: מַטֶּה ഇവിടെ ഇസ്രായേലിലെ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഗോത്രം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: קִשְׁיוֹן
  choice: കിശ്യോൻ
  rationale: ഹീബ്രായ സ്ഥലനാമത്തിന്റെ വ്യഞ്ജന-സ്വരരൂപം മലയാളത്തിൽ അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളെ ചുറ്റിയുള്ള കന്നുകാലി മേയ്ക്കാനുള്ള തുറസ്സായ പ്രദേശങ്ങളെയാണ് מִגְרָשׁ സൂചിപ്പിക്കുന്നത്; ബഹുവചനസദൃശമായ മലയാളപ്രയോഗം ഭൂപ്രദേശങ്ങളുടെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: דָּבְרַת
  choice: ദാബെരത്ത്
  rationale: WLC-യിലെ ഹീബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ മൂലപാഠത്തിലെ ‘നിന്ന്’ എന്ന ഘടനയും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയിലെ വിരാമചിഹ്നവും അനുസരിച്ച് ദ്വിബിന്ദു ഉപയോഗിച്ചു.
