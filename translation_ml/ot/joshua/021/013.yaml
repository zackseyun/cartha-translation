  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: ml
  text: 'പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർക്ക് അവർ കൊടുത്തു: ഒരാളെ കൊന്നവനുള്ള അഭയനഗരമായ ഹെബ്രോനും[a] അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും, ലിബ്നയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കൊലയാളിക്കുള്ള അഭയനഗരം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഒരാളുടെ മരണത്തിന് കാരണമായതിനാൽ അഭയനഗരത്തിലേക്ക് ഓടിപ്പോകാവുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നിയമപദമാണ്; അത് മുൻകൂട്ടി ആസൂത്രണം ചെയ്ത കൊലപാതകത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ പുത്രന്മാർക്ക്
  rationale: לְ എന്നത് സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു. ‘പുത്രന്മാർ’ എന്ന രൂപം എബ്രായ പ്രയോഗം നിലനിർത്തുകയും ഇവിടെ അഹരോന്റെ പുരോഹിതവംശത്തെ ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: נָתְנוּ
  choice: അവർ കൊടുത്തത്
  rationale: נתן എന്ന സാധാരണ ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊടുക്കുക’ നിലനിർത്തുന്നു; നഗരവിഹിതത്തിന്റെ പശ്ചാത്തലത്തിലും മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: കൊലയാളിക്കുള്ള അഭയനഗരം
  rationale: ‘അഭയനഗരം’ നിയമപരമായ സ്ഥാപനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. רֹצֵחַ ഒരാളെ കൊന്നവനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ സന്ദർഭത്തിൽ മുൻകൂട്ടി ആസൂത്രണം ചെയ്ത കൊലപാതകം നിർബന്ധമായും അർഥമാക്കുന്നില്ല; ആ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരത്തോടു ചേർന്ന പൊതുവായ തുറസ്സായ ഭൂമി/മൃഗമേയൽ പ്രദേശം എന്ന അർഥം ഈ ലേവ്യനഗരസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִבְנָה
  choice: ലിബ്ന
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന നിയമപദം ഉദ്ദേശപൂർവ കൊലപാതകിയെ മാത്രമാണോ സൂചിപ്പിക്കുന്നത്
  choice: പ്രധാനവാചകത്തിൽ ‘കൊലയാളി’ ഉപയോഗിച്ച് നിയമപരമായ സന്ദർഭം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു
  alternative: ‘നരഹത്യ ചെയ്തവൻ’ അല്ലെങ്കിൽ ‘അബദ്ധത്തിൽ കൊന്നവൻ’
  rationale: എബ്രായപദം സ്വതവേ മരണത്തിന് കാരണമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ഈ അഭയനഗരസന്ദർഭം മനഃപൂർവമല്ലാത്ത നരഹത്യയും ഉൾക്കൊള്ളുന്നു. എന്നാൽ പ്രധാനവാചകത്തിൽ ‘അബദ്ധത്തിൽ’ ചേർക്കുന്നത് ഈ വാക്യത്തിൽ തുറന്നുപറയാത്ത വിശദീകരണം ഇറക്കുമതി ചെയ്യുന്നതാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ സ്വീകർത്താവ്–ദാനം എന്ന ഘടനയും സ്ഥലനാമങ്ങളും ആവർത്തിച്ച ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്ന രൂപവും നിലനിർത്തി.
