  yaml_path: translation/ot/joshua/021/014.yaml
  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: ml
  text: യത്തീരും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], എശ്തെമോവയും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൊതുഭൂമി’; ഓരോ പട്ടണത്തെയും ചുറ്റിയിരുന്ന ഭൂമി.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַתִּר
  choice: യത്തീർ
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങളെ ചുറ്റിയുള്ള തുറന്ന പൊതുഭൂമിയെയോ മേയൽഭൂമിയെയോ സൂചിപ്പിക്കുന്ന പദം. സന്ദർഭത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ബഹുവചനരൂപം സ്വീകരിച്ചു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഓരോ പട്ടണത്തെയും സൂചിപ്പിക്കുന്ന ‘അതിന്റെ’ എന്നു നൽകി.
- source_word: אֶשְׁתְּמֹעַ
  choice: എസ്തെമോവ
  rationale: എബ്രായ സ്ഥലനാമം അതിന്റെ ധ്വനിരൂപത്തോട് അടുത്തായി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְאֶת
  choice: -ഉം
  rationale: ആവർത്തിക്കുന്ന കർമസൂചകത്തിന് മലയാളത്തിൽ പ്രത്യേക പരിഭാഷ ആവശ്യമില്ല; സംയോജകമായ וְ പട്ടികയുടെ ഘടന നിലനിർത്താൻ ‘-ഉം’ ആയി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഇത് തുടർന്നുകൊണ്ടിരിക്കുന്ന പട്ടികയിലെ ഒരു വാക്യഖണ്ഡമായതിനാൽ അവസാനത്തിൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു. എല്ലാ സ്ഥലനാമങ്ങൾക്കും ഏകീകൃതമായ എബ്രായാധിഷ്ഠിത ലിപ്യന്തരണം പിന്തുടർന്നു.
