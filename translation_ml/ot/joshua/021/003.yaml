id: JOS.21.3
reference: Joshua 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: ml
  text: അങ്ങനെ യിസ്രായേൽമക്കൾ[a] യഹ്‌വെയുടെ കല്പനപ്രകാരം[b] തങ്ങളുടെ അവകാശഭൂമിയിൽനിന്ന് ഈ പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും[c] ലേവ്യർക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യിസ്രായേലിന്റെ പുത്രന്മാർ.’ ‘യിസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’; അതായത്, ‘യഹ്‌വെയുടെ കല്പനപ്രകാരം.’'
    reason: lexical_alternative
  - marker: c
    text: പട്ടണങ്ങളോടു ചേർന്നിരുന്ന തുറസ്സായ സ്ഥലങ്ങളെയോ കന്നുകാലികളെ മേയിക്കാനുള്ള പ്രദേശങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: കൊടുത്തു
  rationale: നָתַן എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കൊടുക്കുക’ ഭൂവിഹിതത്തിന്റെ ഈ സന്ദർഭത്തിലും സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗം പൂർണമായി ലിംഗനിരപേക്ഷമാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ പരമ്പരാഗത കൂട്ടനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദാതിവ് ഘടന നേരിട്ട് പകർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִנַּחֲלָתָם
  choice: തങ്ങളുടെ അവകാശഭൂമിയിൽനിന്ന്
  rationale: נַחֲלָה ഇവിടെ ഗോത്രങ്ങൾക്ക് അവകാശമായി ലഭിച്ച ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; ‘അവകാശഭൂമി’ ആ സന്ദർഭാർഥം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  rationale: ‘വായനുസരിച്ച്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നതിനാൽ, അർഥം കൃത്യമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ശബ്ദരൂപത്തിന് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ
  rationale: നിർദേശകസർവനാമത്തോടുകൂടിയ എബ്രായ പദസമുച്ചയത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണങ്ങളോടു ചേർന്ന തുറസ്സായ ഇടമോ കന്നുകാലികളെ മേയിക്കുന്ന പ്രദേശമോ സൂചിപ്പിക്കുന്ന מִגְרָשׁ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രായോഗിക അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു. ‘യഹോവ’ എന്ന പരമ്പരാഗത സംയുക്തസ്വരരൂപത്തിനു പകരം ‘Yahweh’ എന്ന രൂപത്തോട് ചേർന്ന ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപ്രയോഗം നിലനിർത്തണമോ കൂട്ടനാമമായി മാറ്റണമോ
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ; യിസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധരൂപത്തിന്റെ സാന്നിധ്യം ‘മക്കൾ’ വഴി നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായി തോന്നാവുന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ വായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യക്രമം നിർബന്ധമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക ക്രമം ഉപയോഗിച്ചു; എങ്കിലും ഭൂവിഹിതം, ദൈവകല്പന, പട്ടണങ്ങളോടു ചേർന്ന സ്ഥലങ്ങൾ എന്നീ പ്രധാന ആശയങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
