source:
  edition: WLC
  text: כָּל הֶ֨/עָרִ֜ים לִ/בְנֵ֤י מְרָרִי֙ לְ/מִשְׁפְּחֹתָ֔/ם הַ/נּוֹתָרִ֖ים מִ/מִּשְׁפְּח֣וֹת הַ/לְוִיִּ֑ם וַ/יְהִי֙ גּוֹרָלָ֔/ם עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: ml
  text: മെരാരിയുടെ പുത്രന്മാർക്ക്[a], അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്—ലേവ്യരുടെ കുടുംബങ്ങളിൽ ശേഷിച്ചവരായ[b]—നറുക്കിലൂടെ ലഭിച്ച പട്ടണങ്ങൾ എല്ലാം പന്ത്രണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മെരാരിയുടെ സന്തതികൾക്ക്’ അല്ലെങ്കിൽ ‘മെരാര്യർക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ലേവ്യകുടുംബങ്ങളിൽ ശേഷിച്ചവർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: പട്ടണങ്ങൾ ആകെ
  rationale: עִיר എന്നത് പട്ടണം/നഗരം എന്നർഥമുള്ളതാണ്. ഗോത്രവിഹിതപ്പട്ടികയിലെ ജനവാസകേന്ദ്രങ്ങൾക്ക് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു; כָּל എന്ന സമഗ്രത ‘ആകെ’ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർക്ക്
  rationale: בְּנֵי എന്ന പദത്തിന്റെ അക്ഷരാർഥരൂപം നിലനിർത്തുന്നു; വംശാവലി സന്ദർഭത്തിൽ ഇത് സന്തതികളെയും സൂചിപ്പിക്കാം, അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുടുംബങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה കുടുംബം അല്ലെങ്കിൽ കുലം എന്നു വരാം. കുടുംബവിഭാഗങ്ങൾപ്രകാരമുള്ള വിതരണം വ്യക്തമാക്കാൻ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: ലേവ്യകുടുംബങ്ങളിൽ ശേഷിച്ചവർക്ക്
  rationale: הַנּוֹתָרִים എന്ന substantival participle-ന്റെ ‘ശേഷിച്ചവർ’ എന്ന അർഥവും, അവർ ലേവ്യകുടുംബങ്ങളുടെ ഭാഗമാണെന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וַיְהִי גּוֹרָלָם
  choice: നറുക്കിലൂടെ ലഭിച്ച
  rationale: ഗോത്രവിഹിതം നറുക്കിട്ടു നിർണയിച്ചതാണെന്ന גּוֹרָל ആശയം സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ സംയോജിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘അവരുടെ നറുക്ക് ആയിരുന്നു’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: പട്ടണങ്ങൾ ആകെ പന്ത്രണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ നാമം-സംഖ്യ ക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിലാക്കി, എണ്ണം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായവാക്യത്തിലെ അനുബന്ധവിശദീകരണം ദീർഘരേഖകൾക്കിടയിൽ നിലനിർത്തി; ‘നറുക്കിലൂടെ ലഭിച്ച’ എന്ന പ്രയോഗം വിഹിതനിർണയത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
