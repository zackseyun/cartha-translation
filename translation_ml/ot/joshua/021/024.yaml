  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: ml
  text: അയ്യാലോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും[a], ഗത്ത്-രിമ്മോനും അതിന്റെ മേച്ചിൽപ്പുറങ്ങളും—ആകെ നാല് പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ പൊതുഭൂമി’ അല്ലെങ്കിൽ ‘അതിന്റെ ചുറ്റുമുള്ള ഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം പട്ടണത്തിന്റേതായ, പലപ്പോഴും കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ചിരുന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: അയ്യാലോൻ
  rationale: സ്ഥലനാമം അർഥവിവർത്തനം ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി.
- source_word: מִגְרָשֶׁהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തോടു ചേർന്ന് അതിന് അനുവദിച്ചിരുന്ന, സാധാരണയായി കന്നുകാലികളെ മേയ്ക്കാൻ ഉപയോഗിച്ച ഭൂമിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിലെ പ്രധാന ഉപയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: גַּת רִמּוֹן
  choice: ഗത്ത്-രിമ്മോൻ
  rationale: സംയുക്ത സ്ഥലനാമം എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ഒറ്റ സ്ഥലനാമമാണെന്ന് വ്യക്തമാക്കാൻ ഹൈഫൻ ഉപയോഗിച്ചു.
- source_word: עָרִים אַרְבַּע
  choice: ആകെ നാല് പട്ടണങ്ങൾ
  rationale: പട്ടികയുടെ സംഖ്യാത്മക സംഗ്രഹം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; עָרִים എന്നതിന് ഈ പശ്ചാത്തലത്തിൽ ‘പട്ടണങ്ങൾ’ അനുയോജ്യം.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: പട്ടികാക്രമവും ‘-ഉം’ എന്ന സംയോജകവുംകൊണ്ട് പ്രകടിപ്പിച്ചു
  rationale: ആവർത്തിക്കുന്ന എബ്രായ കർമസൂചകത്തിന് മലയാളത്തിൽ നേരിട്ടൊരു പദസമം ഇല്ല; പട്ടണങ്ങളും അവയുടെ ഭൂമിയും ‘-ഉം’ ഉപയോഗിച്ച് നിരത്തുന്നത് സ്വാഭാവികമാണ്.
