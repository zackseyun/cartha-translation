source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: ml
  text: അങ്ങനെ അവർ യെഹൂദായിലെ മലനാട്ടിലുള്ള കിര്യത്ത്-അർബാ (അർബാ അനാക്കിന്റെ പിതാവായിരുന്നു[a])—അതായത് ഹെബ്രോൻ—അതിനു ചുറ്റുമുള്ള മേച്ചിൽപ്പുറങ്ങളോടുകൂടെ അവർക്കു കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനാക്കിന്റെ പിതാവോ പൂർവപിതാവോ ആയ അർബാ.’ എബ്രായപ്രയോഗം നേരിട്ടുള്ള പിതൃത്വത്തെയോ കൂടുതൽ അകലെയുള്ള പൂർവികബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: അങ്ങനെ അവർ ... കൊടുത്തു
  rationale: വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായി ആ പുരോഗതി നിലനിർത്തുന്നു.
- source_word: לָהֶם
  choice: അവർക്കു
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ബഹുവചന സർവനാമം സന്ദർഭത്തിലെ സ്വീകർത്താക്കളെ പേരെടുത്തു വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: קִרְיַת אַרְבַּע
  choice: കിര്യത്ത്-അർബാ
  rationale: സ്ഥിരമായ സ്ഥലനാമമായതിനാൽ ‘അർബായുടെ നഗരം’ എന്നു വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲבִי הָעֲנֹוק
  choice: അർബാ അനാക്കിന്റെ പിതാവായിരുന്നു
  rationale: അർബായെ അനാക്കുമായുള്ള ബന്ധത്തിലൂടെ തിരിച്ചറിയുന്ന സമാനാധികരണപ്രയോഗം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യമായി നൽകി; ‘പിതാവ്’ എന്ന മൂലാർത്ഥം നിലനിർത്തി.
- source_word: הִיא חֶבְרוֹן
  choice: അതായത് ഹെബ്രോൻ
  rationale: സർവനാമവും സ്ഥലനാമവും ചേർന്ന പ്രയോഗം കിര്യത്ത്-അർബായെ ഹെബ്രോൻ എന്നു വിശദീകരിച്ചറിയിക്കുന്നു.
- source_word: בְּהַר יְהוּדָה
  choice: യെഹൂദാമലനാട്ടിലുള്ള
  rationale: ഇവിടെ הַר ഒറ്റമലയെയല്ല, യെഹൂദായിലെ ഉയർന്ന ഭൂപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മലനാട്’ ആ ഭൂമിശാസ്ത്രാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִגְרָשֶׁיהָ
  choice: അതിന്റെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: പട്ടണത്തിനു ചുറ്റും പൊതുവായ ഉപയോഗത്തിനും പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയ്ക്കുന്നതിനുമായി നീക്കിവെച്ച തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
- source_word: סְבִיבֹתֶיהָ
  choice: അതിനു ചുറ്റുമുള്ള
  rationale: മേച്ചിൽപ്പുറങ്ങൾ നഗരത്തെ ചുറ്റിയാണെന്ന സ്ഥലബന്ധം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: אֲבִי എന്ന ബന്ധപദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘പിതാവ്’
  alternative: ‘പൂർവപിതാവ്’
  rationale: എബ്രായ אָב നേരിട്ടുള്ള പിതാവിനെയോ കൂടുതൽ അകലെയുള്ള പൂർവികനെയോ സൂചിപ്പിക്കാം. മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർത്ഥം പ്രധാന പാഠത്തിൽ നിലനിർത്തി, യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ പരിചിതമായ ബൈബിൾരൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു; ഭൂമിശാസ്ത്രപദങ്ങളും ഭൂവിനിയോഗപദവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകി.
