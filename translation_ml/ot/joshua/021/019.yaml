revisions:
- from: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാർക്കുള്ള പട്ടണങ്ങൾ ആകെ പതിമൂന്നും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും ആയിരുന്നു.[a]
  to: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാരുടെ എല്ലാ പട്ടണങ്ങളും മേച്ചിൽപ്പുറങ്ങളോടുകൂടിയ പതിമൂന്നായിരുന്നു.[a]
  rationale: The revision explicitly makes thirteen the number of cities and presents the pasturelands as belonging to or accompanying those cities. It also renders ‘all the cities of the sons of Aaron, the priests’ more directly and naturally in Malayalam, while retaining the English audit trail’s acknowledged syntactic alternative in the footnote.
