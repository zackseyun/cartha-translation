  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: ml
  text: പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാരുടെ എല്ലാ പട്ടണങ്ങളും മേച്ചിൽപ്പുറങ്ങളോടുകൂടിയ പതിമൂന്നായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പതിമൂന്ന് പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും.” എബ്രായത്തിൽ ‘അവയുടെ മേച്ചിൽപ്പുറങ്ങൾ’ എന്ന പദസമുച്ചയം ‘ഉം/യും’ എന്ന സംയോജകത്താൽ ചേർത്തിരിക്കുന്നു. അതിനാൽ ഇതിനെ “മേച്ചിൽപ്പുറങ്ങളോടുകൂടിയ പതിമൂന്ന് പട്ടണങ്ങൾ” എന്നും “പതിമൂന്ന് പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും” എന്നും അവതരിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ആകെ
  rationale: പട്ടണങ്ങളുടെ മുഴുവൻ എണ്ണവും സംഗ്രഹിക്കുന്ന പ്രയോഗം; മലയാളത്തിലെ സ്വാഭാവികമായ കണക്കുസംഗ്രഹരീതി.
- source_word: עָרֵי
  choice: പട്ടണങ്ങൾ
  rationale: യോശുവയിലെ ഭൂവിഭജനപ്പട്ടികകളിൽ עִיר സൂചിപ്പിക്കുന്ന ജനവാസകേന്ദ്രങ്ങൾക്ക് വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: בְנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ഔപചാരിക വംശപരമ്പരാപ്രയോഗം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; ‘സന്തതികൾ’ എന്ന വ്യാഖ്യാനപരമായ പൊതുവാക്കൽ ഒഴിവാക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരായ
  rationale: അഹരോന്റെ പുത്രന്മാരെ സമാനാധികരണമായി തിരിച്ചറിയുന്ന ഘടകം സ്വാഭാവിക മലയാളത്തിൽ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: പട്ടണങ്ങൾ ആകെ പതിമൂന്ന്
  rationale: സംഖ്യയും നാമവും മലയാളത്തിലെ സ്വാഭാവിക സംഗ്രഹവാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങളും
  rationale: מִגְרָשׁ ലേവ്യപട്ടണങ്ങളോടു ചേർന്ന തുറന്നതും മൃഗങ്ങളെ മേയ്ക്കാനുപയോഗിച്ചതുമായ ഭൂമിയെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ וְ എന്ന ലളിതമായ സംയോജനവും നിലനിർത്തുന്നു.
