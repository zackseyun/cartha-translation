  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കണക്കുസംഗ്രഹശൈലി. പുരോഹിതവംശത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരികമായ ‘അഹരോന്റെ പുത്രന്മാർ’ നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
