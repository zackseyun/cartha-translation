  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ ആഖാനോടു പറഞ്ഞു: “മകനേ, ദയവായി ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയ്ക്കു മഹത്ത്വം നൽകുകയും അവിടത്തോടു നന്ദി പറയുകയും ചെയ്യുക.[a] നീ എന്താണ് ചെയ്തതെന്ന് ദയവായി എന്നോടു പറയുക; എന്നിൽനിന്ന് അതു മറച്ചുവെക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവിടത്തോടു സ്തോത്രം അർപ്പിക്കുക”; ഈ സന്ദർഭത്തിൽ “അവിടത്തോടു ഏറ്റുപറയുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: മകനേ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിലുള്ള പിതൃസ്നേഹവും ഗൗരവവുമുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שִׂים נָא כָבוֹד
  choice: ദയവായി ... മഹത്ത്വം നൽകുക
  rationale: അക്ഷരാർഥത്തിലെ ‘മഹത്ത്വം വെക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ആശയം, ദൈവത്തിന്റെ മഹത്ത്വം അംഗീകരിക്കുക എന്ന നിലയിൽ സ്വാഭാവികമായി നൽകുന്നു; נָאയുടെ വിനീതമായ അഭ്യർഥന ‘ദയവായി’ എന്നു സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയ്ക്കു
  rationale: ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്ത്, സമാസബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: അവിടത്തോടു നന്ദി പറയുക
  rationale: תוֹדָהയുടെ നന്ദി/സ്തോത്രം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ഈ ന്യായവിധി-ഏറ്റുപറച്ചിൽ സന്ദർഭത്തിൽ സാധ്യതയുള്ള ‘ഏറ്റുപറയുക’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְהַגֶּד נָא לִי מֶה עָשִׂיתָ
  choice: നീ എന്താണ് ചെയ്തതെന്ന് ദയവായി എന്നോടു പറയുക
  rationale: נגד എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘പറയുക/അറിയിക്കുക’ എന്ന അർഥവും נָאയുടെ വിനീതതയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: എന്നിൽനിന്ന് അതു മറച്ചുവെക്കരുത്
  rationale: כחדയുടെ മറയ്ക്കുക/ഒളിച്ചുവെക്കുക എന്ന അർഥം വ്യക്തമാക്കുന്നു; ഹീബ്രുവിൽ പരോക്ഷമായ കർമം മലയാളത്തിൽ ‘അതു’ എന്നു ചേർക്കുന്നു.
theological_decisions:
- issue: ഏറ്റുപറച്ചിലിന്റെ പശ്ചാത്തലത്തിൽ תוֹדָה എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നന്ദി പറയുക’; ‘ഏറ്റുപറയുക’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: ‘അവിടത്തോടു സ്തോത്രം അർപ്പിക്കുക’ അല്ലെങ്കിൽ ‘അവിടത്തോടു ഏറ്റുപറയുക’
  rationale: ഈ ഹീബ്രു നാമം നന്ദി, സ്തോത്രം, ഏറ്റുപറച്ചിൽ എന്നീ ആശയങ്ങൾ വഹിക്കാം. ആഖാനോട് സത്യം വെളിപ്പെടുത്താൻ ആവശ്യപ്പെടുന്ന സന്ദർഭം ഏറ്റുപറച്ചിലിന്റെ നിഴൽ നൽകുന്നുവെങ്കിലും, പ്രധാനപാഠത്തിൽ അതിനെ മാത്രം നിർബന്ധിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യോശുവയുടെ ഗൗരവമുള്ളതും പിതൃസ്നേഹപൂർവവുമായ അഭ്യർഥന നിലനിർത്തിയിരിക്കുന്നു.
