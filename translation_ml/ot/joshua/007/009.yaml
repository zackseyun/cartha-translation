id: JOS.7.9
reference: Joshua 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: ml
  text: കനാന്യരും ദേശത്തിലെ സകല നിവാസികളും ഇതു കേൾക്കും; അവർ ഞങ്ങളെ വളഞ്ഞ് ഭൂമുഖത്തുനിന്ന് ഞങ്ങളുടെ പേര് ഇല്ലാതാക്കും.[a] അപ്പോൾ അങ്ങയുടെ മഹത്തായ നാമത്തിനുവേണ്ടി അങ്ങ് എന്തു ചെയ്യും?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങളുടെ പേര് ഇല്ലാതാക്കും’ എന്നത് ഒരു ജനതയുടെ നിലനിൽപ്പും ഓർമയും പൂർണമായി മായിച്ചുകളയുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘അങ്ങയുടെ മഹത്തായ നാമത്തെക്കുറിച്ച് അങ്ങ് എന്തു ചെയ്യും?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: ഇതു കേൾക്കും
  rationale: ശָׁמַע എന്ന ക്രിയയുടെ അപൂർണരൂപം ഇവിടെ യിസ്രായേലിന്റെ പരാജയവാർത്ത ചുറ്റുമുള്ള ജനങ്ങൾ അറിയാനിടയാകുന്ന ഭാവിപരിണതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായ ‘ഇതു’ ചേർത്തു.
- source_word: הַכְּנַעֲנִי
  choice: കനാന്യർ
  rationale: എബ്രായത്തിൽ രൂപപരമായി ഏകവചനമാണെങ്കിലും ഒരു ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: ദേശത്തിലെ സകല നിവാസികളും
  rationale: יֹשְׁבֵי എന്നത് ‘വസിക്കുന്നവർ/നിവാസികൾ’ എന്നാണ്. ഇവിടെ הָאָרֶץ ലോകമൊട്ടാകെയല്ല, സമീപദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: അവർ ഞങ്ങളെ വളഞ്ഞ്
  rationale: נסב എന്ന ക്രിയ עַל എന്നതിനോടൊപ്പം സൈനികമായി ചുറ്റിവളയുക എന്ന ആശയം നൽകുന്നു.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: ഭൂമുഖത്തുനിന്ന് ഞങ്ങളുടെ പേര് ഇല്ലാതാക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘ഞങ്ങളുടെ പേര് ഛേദിക്കും’ എന്ന പ്രയോഗം ഒരു ജനതയുടെ നിലനിൽപ്പും ഓർമയും പൂർണമായി ഇല്ലാതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. അർഥം വ്യക്തമായി നൽകിക്കൊണ്ട് ‘പേര്’ നിലനിർത്തി.
- source_word: וּמַה תַּעֲשֶׂה
  choice: അപ്പോൾ ... അങ്ങ് എന്തു ചെയ്യും?
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ഭാവികാലസ്വഭാവം നിലനിർത്തി. മുൻവാക്യത്തിലെ ഭീഷണിയുടെ പരിണതിയാണിത് എന്നു സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: അങ്ങയുടെ മഹത്തായ നാമത്തിനുവേണ്ടി
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ ദൈവത്തിന്റെ നാമത്തിന്റെ മാനവും കീർത്തിയും സംബന്ധിച്ച യോശുവയുടെ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
theological_decisions:
- issue: ‘അങ്ങയുടെ മഹത്തായ നാമം’ എന്ന അപേക്ഷയുടെ അർഥം
  choice: യിസ്രായേലിന്റെ ഭാവിയുമായി ബന്ധപ്പെട്ടു ജനതകളുടെ മുമ്പിലുള്ള ദൈവത്തിന്റെ പൊതുമാനത്തെക്കുറിച്ചുള്ള അപേക്ഷ
  alternative: ദൈവത്തിന്റെ മഹത്തായ നാമത്തെക്കുറിച്ച് അങ്ങ് എന്തു ചെയ്യും?
  rationale: യിസ്രായേൽ നശിച്ചാൽ ചുറ്റുമുള്ള ജനതകൾ യഹോവയെക്കുറിച്ച് എന്തു കരുതും എന്നതാണ് സന്ദർഭത്തിലെ ആശങ്ക. ഉടമ്പടിസംബന്ധമായ ഈ മാനമാനം സൂചിപ്പിക്കുമ്പോഴും മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. എബ്രായ ശൈലിയിലെ ‘പേര്’ നിലനിർത്തിയെങ്കിലും ‘ഛേദിക്കുക’ എന്ന അസ്വാഭാവിക പദപ്രയോഗത്തിന് പകരം അർഥവ്യക്തമായ ‘ഇല്ലാതാക്കുക’ ഉപയോഗിച്ചു.
