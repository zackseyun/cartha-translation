  naturalness: The rendering is fluent, modern standard Malayalam with an appropriately solemn register. «അങ്ങ്/അങ്ങയുടെ» is a natural respectful direct address to God. The connective «അപ്പോൾ» makes the rhetorical consequence clear without materially altering the sense.
