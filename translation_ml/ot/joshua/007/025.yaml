source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: ml
  text: 'യോശുവ പറഞ്ഞു: “നീ ഞങ്ങളെ കഷ്ടത്തിലാക്കിയത് എന്തിന്? ഇന്ന് യഹ്‌വെ നിന്നെ കഷ്ടത്തിലാക്കും.”[a] ഇസ്രായേൽജനം മുഴുവനും അവനെ കല്ലെറിഞ്ഞു; പിന്നെ അവർ അവരെ[b] തീയിൽ ചുട്ടുകളയുകയും കല്ലെറിയുകയും ചെയ്തു.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കഷ്ടത്തിലാക്കി … കഷ്ടത്തിലാക്കും” എന്നിടത്ത് എബ്രായപാഠം ഒരേ ക്രിയ ആവർത്തിച്ച് പദപ്രയോഗം സൃഷ്ടിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ഇവിടെ ‘അവനെ’ എന്ന ഏകവചനത്തിൽനിന്ന് ‘അവരെ’ എന്ന ബഹുവചനത്തിലേക്ക് മാറുന്നു. ആഖാനോടൊപ്പം മറ്റുള്ളവരോ അവന്റെ കുടുംബവും വസ്തുക്കളുമോ ഉൾപ്പെടുന്നുണ്ടാകാം; വിവർത്തനം ഈ മാറ്റം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: c
    text: ഈ വാക്യത്തിൽ കല്ലെറിയുന്നതിന് എബ്രായത്തിൽ രണ്ടു വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; മലയാളത്തിൽ രണ്ടും ‘കല്ലെറിയുക’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכָּרְךָ
  choice: ഞങ്ങളെ കഷ്ടത്തിലാക്കി / നിന്നെ കഷ്ടത്തിലാക്കും
  rationale: עכר എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനവും യോശുവയുടെ വാക്കുകളിലെ പ്രത്യുത്തരസ്വഭാവമുള്ള പദപ്രയോഗവും മലയാളത്തിൽ ഒരേ പ്രയോഗംകൊണ്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ഉടനടിയുള്ള കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: അവനെ കല്ലെറിഞ്ഞു
  rationale: רגם കല്ലെറിഞ്ഞുള്ള വധശിക്ഷയെ സൂചിപ്പിക്കുന്നു; ‘കല്ലെറിഞ്ഞു’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: അവരെ തീയിൽ ചുട്ടുകളഞ്ഞു
  rationale: മൂലപാഠത്തിലെ ഏകവചനത്തിൽനിന്നുള്ള ബഹുവചനമാറ്റം നിലനിർത്തുകയും തീ എന്ന ഉപാധി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: അവരെ കല്ലെറിഞ്ഞു
  rationale: סקל എന്ന രണ്ടാമത്തെ കല്ലെറിയൽക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘കല്ലെറിഞ്ഞു’ എന്നു നൽകുന്നു; മൂലത്തിലെ വ്യത്യസ്ത ക്രിയകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ആഖാനെ സൂചിപ്പിക്കുന്ന ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘അവനെ’ എന്ന ഏകവചനവും തുടർന്ന് ‘അവരെ’ എന്ന ബഹുവചനവും അതേപടി നിലനിർത്തുന്നു.
  alternative: എല്ലാ പരാമർശങ്ങളും ആഖാനെ മാത്രം സൂചിപ്പിക്കുന്ന ഏകവചനമാക്കുക; അല്ലെങ്കിൽ ബഹുവചനം അവന്റെ വസ്തുക്കളെ മാത്രം സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: മസോരാ പാഠം വ്യക്തമായി ഏകവചനത്തിൽനിന്ന് ബഹുവചനത്തിലേക്ക് മാറുന്നു. ബഹുവചനത്തിൽ ആരൊക്കെ അല്ലെങ്കിൽ എന്തൊക്കെ ഉൾപ്പെടുന്നു എന്നു വിവർത്തനം സ്വമേധയാ തീരുമാനിക്കാതെ പാഠത്തിലെ ആശയസംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനം, ഏകവചന-ബഹുവചനമാറ്റം, പ്രവൃത്തികളുടെ ക്രമം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
