  terminology: ‘യഹ്‌വെ’ ഇംഗ്ലീഷ് POB തീരുമാനത്തോടും ലക്ഷ്യപരിഭാഷാ നയത്തോടും യോജിക്കുന്നു. ‘കഷ്ടത്തിലാക്കുക’ עכר എന്ന ക്രിയയുടെ trouble/disaster എന്ന ആശയത്തെ മതിയായ രീതിയിൽ നൽകുകയും ഇരട്ടപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ആഖാൻ എന്ന പേര് ഈ വാക്യത്തിൽ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കാതിരുന്നതും ശരിയാണ്.
