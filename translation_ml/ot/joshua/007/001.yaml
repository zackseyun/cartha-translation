reference: Joshua 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കൾ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളുടെ[a] കാര്യത്തിൽ അവിശ്വസ്തത കാണിച്ചു. യെഹൂദാഗോത്രത്തിൽപ്പെട്ട സേരഹിന്റെ മകനായ സബ്ദിയുടെ മകൻ കർമിയുടെ മകൻ ആഖാൻ, നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളിൽ ചിലത് എടുത്തു. അതുകൊണ്ട് യഹോവയുടെ കോപം ഇസ്രായേൽമക്കൾക്കെതിരെ ജ്വലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കൾ’; കൂടുതൽ പദാനുപദമായി ‘നിരോധിതവസ്തുക്കൾ.’ എബ്രായത്തിലെ חֵרֶם എന്ന പദം ദൈവത്തിനായി വേർതിരിച്ച് നാശത്തിനോ സാധാരണ മനുഷ്യോപയോഗത്തിൽനിന്നുള്ള നീക്കത്തിനോ വിധേയമാക്കിയ ആളുകളെയോ വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: അവിശ്വസ്തത കാണിച്ചു
  rationale: מעל എന്ന ധാതുവും അതിന്റെ സമാനപദപ്രയോഗവും വിശ്വാസലംഘനത്തിന്റെ ആശയം ഊന്നുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ഉടമ്പടിസംബന്ധമായ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബപരമായ കൂട്ടായ തിരിച്ചറിയൽ സൂക്ഷിക്കുകയും ഒരാളുടെ പ്രവൃത്തിയോടൊപ്പം ജനതയുടെ കൂട്ടുത്തരവാദിത്വം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തുക്കൾ
  rationale: חֵרֶם ഇവിടെ ദൈവത്തിനായി വേർതിരിച്ച് സാധാരണ മനുഷ്യോപയോഗത്തിൽനിന്ന് നീക്കിയതും ഈ സന്ദർഭത്തിൽ നശിപ്പിക്കേണ്ടതുമായ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. സാങ്കേതികപദം മാത്രം ഉപയോഗിക്കാതെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקַּח ... מִן
  choice: ചിലത് എടുത്തു
  rationale: מן നൽകുന്ന ഭാഗികാർഥം ‘ചിലത്’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; എടുത്ത അളവിനെക്കുറിച്ച് അനാവശ്യമായ കൃത്യത ചേർക്കുന്നില്ല.
- source_word: לְמַטֵּה יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിൽപ്പെട്ട
  rationale: വംശാവലിസന്ദർഭത്തിലെ מַטֶּה എന്ന പദത്തിന് ‘ഗോത്രം’ യോജിച്ചതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וַיִּחַר אַף יְהוָה
  choice: യഹോവയുടെ കോപം ... ജ്വലിച്ചു
  rationale: കോപം കത്തുന്നതായ എബ്രായ ദൃശ്യരൂപം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഒരാളായ ആഖാന്റെ പ്രവൃത്തിയെ തുടർന്ന് ‘ഇസ്രായേൽമക്കൾ’ അവിശ്വസ്തത കാണിച്ചുവെന്ന കൂട്ടായ ഉത്തരവാദിത്വം
  choice: ആദ്യവാക്യത്തിൽ കൂട്ടായ കർത്താവായ ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തി, അടുത്ത വാക്യത്തിൽ ആഖാനെ വ്യക്തിപരമായ പ്രവർത്തകനായി വ്യക്തമാക്കുന്നു.
  alternative: കുറ്റം പൂർണമായി ആഖാനിലേക്കു മാത്രം ചുരുക്കുക, അല്ലെങ്കിൽ ‘ഇസ്രായേൽ’ എന്നു പൊതുവാക്കി കുടുംബപരമായ പ്രയോഗം ഒഴിവാക്കുക.
  rationale: മൂലപാഠം വ്യക്തിയുടെ പാപവും സമൂഹത്തിന്റെ ഉത്തരവാദിത്വവും ഒരുമിച്ച് നിലനിർത്തുന്നു; വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വംശാവലി ബന്ധങ്ങൾ മൂലപാഠത്തിന്റെ ക്രമത്തിൽ സൂക്ഷിച്ചു; ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
