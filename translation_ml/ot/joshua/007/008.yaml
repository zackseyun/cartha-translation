id: JOS.7.8
reference: Joshua 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: ml
  text: അയ്യോ, കർത്താവേ, ഇസ്രായേൽ തന്റെ ശത്രുക്കളുടെ മുമ്പിൽ പിൻവാങ്ങിയശേഷം ഞാൻ എന്തു പറയും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേൽ തന്റെ ശത്രുക്കളുടെ മുമ്പിൽ തന്റെ പുറം (അല്ലെങ്കിൽ കഴുത്തിന്റെ പിൻഭാഗം) തിരിച്ചതിനുശേഷം.’ യുദ്ധത്തിൽ തോറ്റ് പിൻവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: അയ്യോ
  rationale: മേലധികാരിയോടുള്ള ആദരപൂർവമായ അപേക്ഷയിലും വിലാപത്തിലും ഉപയോഗിക്കുന്ന ഈ വികാരനിപാതം ഇവിടെ യോശുവയുടെ തീവ്രവേദന പ്രകടമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അയ്യോ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲדֹנָי
  choice: കർത്താവേ
  rationale: ദൈവത്തെ നേരിട്ട് ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്ന ശീർഷകമായതിനാൽ ‘കർത്താവേ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇവിടെ ഇല്ലാത്ത ദൈവനാമം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: מָה אֹמַר
  choice: ഞാൻ എന്തു പറയും?
  rationale: ഹീബ്രു വാക്യത്തിന്റെ ഭാവികാലസദൃശമായ ചോദ്യം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു; നിസ്സഹായതയുടെ ധ്വനി സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ശേഷം
  rationale: യോശുവയുടെ ചോദ്യത്തിന് കാരണമായ സംഭവത്തെ ലളിതമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הָפַךְ ... עֹרֶף
  choice: പിന്തിരിഞ്ഞോടിയ
  rationale: അക്ഷരാർഥത്തിൽ ‘കഴുത്തിന്റെ പിൻഭാഗം തിരിക്കുക’ എന്ന യുദ്ധസന്ദർഭത്തിലെ ഹീബ്രു പ്രയോഗം പരാജയപ്പെട്ട് പിൻവാങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിന്തിരിഞ്ഞോടുക’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: ശത്രുവിനെ നേരിട്ടിരുന്ന നിലയിൽനിന്നുള്ള പിൻവാങ്ങൽ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֹיְבָיו
  choice: ശത്രുക്കളുടെ
  rationale: ഏകവചനസമൂഹനാമമായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന പ്രത്യയം മലയാളവാക്യത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ ബന്ധരൂപത്തിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു.
theological_decisions:
- issue: אֲדֹנָי എന്ന ദൈവിക ശീർഷകത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: എന്റെ കർത്താവേ
  rationale: ഇവിടെ אֲדֹנָי ദൈവത്തോടുള്ള ആദരപൂർവമായ സ്ഥിരശീർഷകമായി പ്രവർത്തിക്കുന്നു. ‘കർത്താവേ’ എന്നത് അതിനെ സ്വാഭാവികമായി നിലനിർത്തുകയും പാഠത്തിൽ ഇല്ലാത്ത ഉടമ്പടിനാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ പ്രാർഥനയുടെ ആദരവും വിലാപത്തിന്റെ തീവ്രതയും ഒരുമിച്ച് നിലനിർത്തി. സൈനിക പരാജയത്തിന്റെ ഹീബ്രു പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ പ്രധാനപാഠത്തിൽ അർഥാനുസൃതമായി നൽകി; അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
