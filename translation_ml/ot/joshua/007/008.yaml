  to: അയ്യോ, കർത്താവേ, ഇസ്രായേൽ തന്റെ ശത്രുക്കളുടെ മുമ്പിൽ പിൻവാങ്ങിയശേഷം ഞാൻ എന്തു പറയും?[a]
