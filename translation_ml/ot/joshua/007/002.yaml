  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: ml
  text: യോശുവ യെരീഹോവിൽനിന്ന് ബേഥേലിന് കിഴക്കായി ബേത്ത്-ആവെന് സമീപമുള്ള ഹായിയിലേക്ക്[a] പുരുഷന്മാരെ അയച്ചു. അവരോട്, “കയറിച്ചെന്ന് ആ ദേശം ഒറ്റുനോക്കുക” എന്നു പറഞ്ഞു. അങ്ങനെ അവർ കയറിച്ചെന്ന് ഹായിയെ ഒറ്റുനോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബേത്ത്-ആവെനോടു ചേർന്നുള്ള ഹായി” എന്നും വിവർത്തനം ചെയ്യാം; ഹീബ്രുവിൽ അക്ഷരാർഥം “ബേത്ത്-ആവെനോടുകൂടെയുള്ള” എന്നാണ്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഉപസർഗം ഭൂമിശാസ്ത്രപരമായ സമീപസ്ഥിതിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ലളിതവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: אֲנָשִׁים
  choice: ആളുകളെ
  rationale: സന്ദർഭത്തിൽ ചാരനിരീക്ഷണത്തിനയച്ച പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആളുകൾ’ സ്വാഭാവികമായ സംഘസൂചന നൽകുന്നു, എന്നാൽ അനാവശ്യമായി ലിംഗവ്യത്യാസം ഊന്നുന്നില്ല.
- source_word: מִירִיחוֹ
  choice: യെരീഹോവിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണത്തിൽ നൽകി; מִן എന്ന ഉപസർഗത്തിന്റെ പുറപ്പെടുന്ന സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: הָעַי
  choice: ഹായി
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം; നിർദ്ദേശക ആർട്ടിക്കിൾ സ്ഥലനാമത്തോടൊപ്പം പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: ബേത്ത്-ആവെന് സമീപമുള്ള
  rationale: עִם അക്ഷരാർഥത്തിൽ ‘കൂടെ’ എന്നാണെങ്കിലും ഭൂമിശാസ്ത്രവിവരണത്തിൽ സമീപസ്ഥിതിയെ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘സമീപമുള്ള’ സ്വീകരിച്ചു, അർഥവൈകല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: ബേഥേലിന് കിഴക്കായി
  rationale: ഭൂമിശാസ്ത്രപരമായി ബേഥേലിനെ അപേക്ഷിച്ചുള്ള കിഴക്കൻ സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: עלה സൂചിപ്പിക്കുന്ന ഉയർന്ന പ്രദേശത്തേക്കോ ലക്ഷ്യത്തിലേക്കോ ഉള്ള മുകളോട്ടുള്ള നീക്കം സംരക്ഷിക്കുകയും മലയാളത്തിലെ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: וְרַגְּלוּ
  choice: ചാരനിരീക്ഷണം നടത്തുക
  rationale: רגל എന്ന പീയേൽ രൂപത്തിന്റെ സൈനികമായ രഹസ്യപരിശോധനാഭാവം ‘പര്യവേക്ഷണം’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת הָאָרֶץ
  choice: ആ ദേശം
  rationale: אָרֶץ ഇവിടെ നിരീക്ഷിക്കേണ്ട ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേശം’ വിശാലത നിലനിർത്തുന്ന സാധാരണ ബൈബിൾ-മലയാള പ്രയോഗമാണ്.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്ന്
  rationale: മുമ്പത്തെ കല്പനയിലെ עלה ആവർത്തിക്കുന്നതിലൂടെ ഹീബ്രു ആഖ്യാനത്തിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: וַיְרַגְּלוּ
  choice: ചാരനിരീക്ഷണം നടത്തി
  rationale: കല്പനയിലെ רגל-നോടുള്ള പദസാമ്യം നിലനിർത്തി പൂർത്തിയായ പ്രവൃത്തി സ്വാഭാവിക ഭൂതകാലത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾക്ക് പരിചിതമായ മലയാള ബൈബിൾ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ‘കയറുക’ എന്നും ‘ചാരനിരീക്ഷണം നടത്തുക’ എന്നും വരുന്ന ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി.
