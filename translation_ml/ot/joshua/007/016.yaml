source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: ml
  text: യോശുവ അതിരാവിലെ എഴുന്നേറ്റ് ഇസ്രായേലിനെ അതിന്റെ ഗോത്രങ്ങൾപ്രകാരം സമീപത്തേക്കു കൊണ്ടുവന്നു[a]; യെഹൂദാഗോത്രം പിടിക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇസ്രായേലിനെ അതിന്റെ ഗോത്രങ്ങൾപ്രകാരം മുന്നോട്ടു കൊണ്ടുവന്നു.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘യെഹൂദാഗോത്രം പിടിക്കപ്പെട്ടു.’ ഇവിടെ ഇത് പരിശോധനാക്രമത്തിൽ പ്രത്യേകം വേർതിരിക്കപ്പെടുകയോ തിരിച്ചറിയപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റ്
  rationale: שׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; בַּבֹּקֶר അതിന്റെ സമയമായി പ്രഭാതത്തെ വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ഇവ രണ്ടും സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וַיַּקְרֵב
  choice: അടുത്തു വരുത്തി
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘അടുത്തേക്കു കൊണ്ടുവരുക/അടുത്തു വരുത്തുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘ഹാജരാക്കി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: ഉടമ്പടിജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സമാനരൂപം.
- source_word: לִשְׁבָטָיו
  choice: ഗോത്രങ്ങൾപ്രകാരം
  rationale: ഇസ്രായേലിനെ ഗോത്രവിഭാഗങ്ങളനുസരിച്ച് സമീപിപ്പിച്ച വിതരണാത്മക ആശയം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: וַיִּלָּכֵד
  choice: പിടിക്കപ്പെട്ടു
  rationale: לכד എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ ‘പിടിക്കപ്പെടുക’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ അത് പരിശോധനാക്രമത്തിൽ വേർതിരിച്ചറിയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: שֵׁבֶט יְהוּדָה
  choice: യെഹൂദാഗോത്രം
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ വ്യക്തവും പതിവുമായ മലയാളരൂപം.
theological_decisions:
- issue: וַיִּלָּכֵד സൂചിപ്പിക്കുന്ന തിരഞ്ഞെടുപ്പ്/തിരിച്ചറിയൽ പ്രക്രിയയുടെ സ്വഭാവം
  choice: പ്രധാനവാക്യത്തിൽ ‘പിടിക്കപ്പെട്ടു’ എന്ന രൂപകാത്മക കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘തിരഞ്ഞെടുക്കപ്പെട്ടു,’ ‘നറുക്കെടുപ്പിലൂടെ കണ്ടെത്തപ്പെട്ടു,’ അല്ലെങ്കിൽ ‘തിരിച്ചറിയപ്പെട്ടു.’
  rationale: ഈ വാക്യഭാഗം പ്രക്രിയയുടെ കൃത്യമായ മാർഗമോ പ്രവർത്തകനോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ‘നറുക്കെടുപ്പിലൂടെ’ എന്നോ ‘യഹോവയാൽ’ എന്നോ ചേർക്കാതെ എബ്രായത്തിലെ അർഥതീവ്രതയും സന്ദിഗ്ധതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അടുത്തു വരുത്തി,’ ‘പിടിക്കപ്പെട്ടു’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ നടപടിക്രമപരമായ സ്വഭാവവും രൂപകാത്മകതയും നിലനിർത്തുന്നു; ആവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പുകളിലേക്കു പരിമിതപ്പെടുത്തി.
