source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ സേരഹിന്റെ മകനായ ആഖാനെയും, വെള്ളിയും, മേലങ്കിയും, നാവിന്റെ ആകൃതിയിലുള്ള സ്വർണക്കഷണവും[a], അവന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും, അവന്റെ കാളയെയും കഴുതയെയും ആട്ടിൻപറ്റത്തെയും കൂടാരത്തെയും, അവനുള്ള സകലത്തെയും, യിസ്രായേൽ മുഴുവനെയും കൂടെക്കൊണ്ടു; അവർ അവരെയെല്ലാം ആഖോർ താഴ്‌വരയിലേക്കു കയറ്റിക്കൊണ്ടുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “സ്വർണത്തിന്റെ നാവ്”; അതായത് നാവുപോലെയുള്ള ഒരു സ്വർണക്കഷണം. പരമ്പരാഗതമായി “സ്വർണആപ്പ്” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “ആഖോർ” എന്ന പേര് “കഷ്ടം” അഥവാ “ദുരിതം” എന്നർഥമുള്ള എബ്രായപദത്തോടു ശബ്ദസാമ്യമുള്ളതാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അപ്പോൾ ... കൂട്ടിക്കൊണ്ടുപോയി
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു. പട്ടികയിൽ ആളുകളും വസ്തുക്കളും മൃഗങ്ങളും ഉൾപ്പെടുന്നതിനാൽ മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; ബലപ്രയോഗം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: עָכָן בֶּן זֶרַח
  choice: സേരഹിന്റെ മകനായ ആഖാൻ
  rationale: പിതൃനാമബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: മൂലപദം നേരിട്ട് വെള്ളിയെ സൂചിപ്പിക്കുന്നു; ‘പണം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: הָאַדֶּרֶת
  choice: മേലങ്കി
  rationale: പ്രത്യേകമായ പുറംവസ്ത്രം എന്ന അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְשׁוֹן הַזָּהָב
  choice: നാവിന്റെ ആകൃതിയിലുള്ള സ്വർണക്കട്ടി
  rationale: לשון എന്ന പദത്തിന്റെ ‘നാവ്’ എന്ന ദൃശ്യരൂപവും ഇവിടെ ഉദ്ദേശിക്കുന്ന സ്വർണവസ്തുവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ‘ആപ്പ്’ പോലുള്ള അതിവിശിഷ്ട രൂപം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: അവന്റെ പുത്രന്മാരെയും പുത്രിമാരെയും
  rationale: മൂലത്തിലെ പുത്രന്മാർ–പുത്രിമാർ എന്ന വ്യക്തമായ വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: שׁוֹרוֹ
  choice: അവന്റെ കാള
  rationale: ഏകവചനമായ കന്നുകാലിയെ സൂചിപ്പിക്കുന്ന മൂലരൂപത്തിന് യോജിക്കുന്നു.
- source_word: חֲמֹרוֹ
  choice: അവന്റെ കഴുത
  rationale: ആധുനിക മലയാളത്തിലെ നേരിട്ടുള്ള സാധാരണ പദം.
- source_word: צֹאנוֹ
  choice: അവന്റെ ആട്ടിൻപറ്റം
  rationale: ചെറുകന്നുകാലികളുടെ കൂട്ടം എന്ന സമൂഹാർഥം സ്വാഭാവികമായി നൽകുന്നു; ഇനത്തെ പൂർണമായി നിർണയിക്കാത്ത മൂലത്തിന്റെ പരിധി ഏകദേശമായി സൂക്ഷിക്കുന്നു.
- source_word: אָהֳלוֹ
  choice: അവന്റെ കൂടാരം
  rationale: മൂലത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: അവനുള്ള സകലവും
  rationale: അവന്റെ എല്ലാ സ്വത്തുക്കളെയും ഉൾക്കൊള്ളുന്ന സംഗ്രഹപ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: യിസ്രായേൽജനം മുഴുവനും അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ‘അവൻ’ ഏറ്റവും സ്വാഭാവികമായി യോശുവയെ സൂചിപ്പിക്കുന്നു. ദീർഘമായ പട്ടികയ്ക്കുശേഷം പ്രത്യേക വാക്യമാക്കുന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം കുറയ്ക്കുന്നു.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: അവർ അവരെയെല്ലാം ആഖോർ താഴ്‌വരയിലേക്കു കൊണ്ടുപോയി
  rationale: ബഹുവചന കർത്താവും ബഹുവചന കർമവും നിലനിർത്തുന്നു. ‘കയറ്റിക്കൊണ്ടുപോയി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
theological_decisions:
- issue: ആഖാന്റെ പുത്രന്മാരുടെയും പുത്രിമാരുടെയും കുറ്റബോധമോ നിരപരാധിത്വമോ ഈ വാക്യത്തിൽ സൂചിപ്പിക്കണമോ
  choice: അവർ പട്ടികയിൽ ഉൾപ്പെട്ടിരിക്കുന്നതുമാത്രം പറയുക; പങ്കാളിത്തത്തെയോ ശിക്ഷയെയോ കുറിച്ച് വിശദീകരണം ചേർക്കാതിരിക്കുക
  alternative: അവർ കുറ്റത്തിൽ പങ്കാളികളായിരുന്നുവെന്നോ വെറും സാക്ഷികളായിരുന്നുവെന്നോ വ്യാഖ്യാനകുറിപ്പ് ചേർക്കുക
  rationale: ഈ വാക്യം അവരുടെ സാന്നിധ്യം പറയുന്നു, എന്നാൽ കുറ്റത്തിലുള്ള പങ്കോ തുടർന്നുണ്ടായ കാര്യങ്ങളോ സ്വതന്ത്രമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരവും വ്യാഖ്യാനപരവുമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, മാന്യമായ മലയാളം. ദീർഘമായ എബ്രായ പട്ടികയുടെ ഭാരത്വം നിലനിർത്തിക്കൊണ്ട് വ്യക്തതയ്ക്കായി മൂന്ന് വാക്യങ്ങളാക്കി. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾക്ക് സമീപമായി ലിപ്യന്തരിച്ചു; കുടുംബത്തിന്റെ കുറ്റത്തെക്കുറിച്ച് വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
