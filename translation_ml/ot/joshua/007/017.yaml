  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: ml
  text: തുടർന്ന് അവൻ യെഹൂദയുടെ കുലത്തെ മുന്നോട്ടു കൊണ്ടുവന്നു; സേരഹ്യരുടെ കുലം തിരഞ്ഞെടുക്കപ്പെട്ടു. പിന്നെ അവൻ സേരഹ്യരുടെ കുലത്തിലെ പുരുഷന്മാരെ ഓരോരുത്തരായി മുന്നോട്ടു കൊണ്ടുവന്നു[a]; സബ്ദി തിരഞ്ഞെടുക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരുഷന്മാരുടെ അടിസ്ഥാനത്തിൽ” അല്ലെങ്കിൽ “പുരുഷന്മാരനുസരിച്ച്.” ഹീബ്രു പ്രയോഗത്തിന് ഈ അർഥവും സാധ്യമാണ്; എന്നാൽ ഈ തിരിച്ചറിയൽ നടപടിയുടെ സന്ദർഭത്തിൽ, കുലത്തിലെ പുരുഷന്മാരെ ഓരോരുത്തരായി മുന്നോട്ടു കൊണ്ടുവന്നു എന്നതാണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: മുന്നോട്ടു കൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക/ഹാജരാക്കുക’ എന്നാണ്. തിരിച്ചറിയൽ നടപടിക്കായി കുലങ്ങളെയും വ്യക്തികളെയും മുന്നിൽ ഹാജരാക്കുന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഇവിടെ ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘കുലം’ ഈ സാമൂഹിക ഘടകത്തിന് അനുയോജ്യമാണ്.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടു
  rationale: ഇവിടെ സൈനികമായി ‘പിടിക്കപ്പെട്ടു’ എന്നല്ല, നറുക്കിലൂടെയോ ദൈവിക തിരിച്ചറിയൽ നടപടിയിലൂടെയോ വേർതിരിക്കപ്പെട്ടു എന്ന സന്ദർഭാർഥമാണ്. കർമണിപ്രയോഗം നിലനിർത്തി.
- source_word: הַזַּרְחִי
  choice: സേരഹ്യർ
  rationale: സേരഹിന്റെ സന്തതികളെയോ അവരുടെ കുലത്തെയോ സൂചിപ്പിക്കുന്ന വംശനാമം സ്വാഭാവികമായ മലയാള ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: לַגְּבָרִים
  choice: പുരുഷന്മാരെ ഓരോരുത്തരായി
  rationale: പദശഃ ‘പുരുഷന്മാർക്ക്/പുരുഷന്മാരാൽ’ എന്നായിരിക്കാമെങ്കിലും, തിരിച്ചറിയൽ ക്രമത്തിൽ കുലത്തിലെ പുരുഷന്മാരെ വ്യക്തിപരമായി മുന്നോട്ടു കൊണ്ടുവന്നുവെന്ന വിതരണാർഥം സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളതാണ്. യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: זַבְדִּי
  choice: സബ്ദി
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: തിരഞ്ഞെടുപ്പിന്റെ കർത്താവും കൃത്യമായ രീതിയും
  choice: കർമണിപ്രയോഗമായ ‘തിരഞ്ഞെടുക്കപ്പെട്ടു’ നിലനിർത്തി; ദൈവം നേരിട്ട് തിരഞ്ഞെടുത്തു എന്നോ നറുക്കാണ് സ്വതന്ത്രമായി നിർണയിച്ചതെന്നോ വാചകത്തിൽ കൂട്ടിച്ചേർത്തില്ല.
  alternative: ‘യഹോവ തിരഞ്ഞെടുത്തു’ അല്ലെങ്കിൽ ‘നറുക്കിൽ പേര് വന്നു’
  rationale: ഹീബ്രു വാക്യം കർത്താവിനെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗമാണ്; അതിനാൽ ദൈവശാസ്ത്രപരമായ വിശദീകരണം പരിഭാഷയിൽ ചേർക്കാതെ സന്ദർഭത്തിലെ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നടപടിക്രമത്തിന്റെ ആവർത്തനഘടനയും ഹീബ്രുവിലെ കർമണിപ്രയോഗവും പരമാവധി നിലനിർത്തി.
