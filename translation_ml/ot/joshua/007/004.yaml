    issue: ‘ഹായിപട്ടണത്തിലെ ആളുകൾ’ adds ‘പട്ടണം’ (‘town/city’).
    rationale: אַנְשֵׁי הָעָי means ‘the men/people of Ai.’ Although Ai is a place, the Hebrew wording does not include a noun meaning ‘town/city’ in this clause. ‘ഹായിയിലെ ആളുകൾ’ is closer and remains natural.
  revised_text: അങ്ങനെ ജനത്തിൽനിന്ന് ഏകദേശം മൂവായിരം പേർ അവിടേക്കു കയറിച്ചെന്നു; എന്നാൽ അവർ ഹായിയിലെ ആളുകളുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.
