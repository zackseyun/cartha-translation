id: JOS.7.4
reference: Joshua 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ מִן הָ/עָם֙ שָׁ֔מָּ/ה כִּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּנֻ֕סוּ לִ/פְנֵ֖י אַנְשֵׁ֥י הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: ml
  text: അങ്ങനെ ജനത്തിൽനിന്ന് ഏകദേശം മൂവായിരം പേർ അവിടേക്കു കയറിച്ചെന്നു; എന്നാൽ അവർ ഹായിയിലെ ആളുകളുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിച്ചെല്ലുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ഹായിയിലേക്കുള്ള സൈനിക നീക്കം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘ആക്രമിച്ചു’ എന്ന ആശയം ക്രിയയിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: מִן הָעָם
  choice: ജനത്തിൽനിന്ന്
  rationale: עם എന്നതിന്റെ നേരായ അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; ഇസ്രായേൽജനത്തിൽനിന്നു തിരഞ്ഞെടുത്ത ഒരു സംഘത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: שָׁמָּה
  choice: അവിടേക്കു
  rationale: മുമ്പ് പരാമർശിച്ച ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു അവ്യയത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: ഏകദേശം മൂവായിരം പേർ
  rationale: כִּ സംഖ്യയുടെ ഏകദേശസ്വഭാവം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ ഉപയോഗിച്ചു. אִישׁ ഇവിടെ ആളുകളെ എണ്ണുന്നതിനുള്ള പദമായതിനാൽ ‘പേർ’ എന്നു നൽകി; ‘പടയാളികൾ’ എന്നു കൂടുതൽ നിർവചിച്ചില്ല.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: נוס എന്നതിന്റെ ‘പലായനം ചെയ്യുക’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: ഓടിപ്പോകുക എന്ന ക്രിയയോടൊപ്പം എതിരാളികളുടെ സന്നിധിയിൽനിന്നുള്ള പിന്മാറ്റമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘മുമ്പിൽനിന്ന്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי הָעָי
  choice: ഹായിപട്ടണത്തിലെ ആളുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഹായിയിലെ പുരുഷന്മാർ’ എന്നാണ്; സന്ദർഭത്തിൽ നഗരത്തിന്റെ പ്രതിരോധക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്ഥലനാമം വ്യക്തമായി തിരിച്ചറിയാൻ ‘പട്ടണം’ ചേർത്തു, എന്നാൽ ‘സൈനികർ’ എന്നു മൂലപദത്തേക്കാൾ കൂടുതൽ നിർവചിച്ചില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. ‘കയറിച്ചെന്നു’ എന്നത് ഭൂമിശാസ്ത്രപരവും ഹീബ്രു ശൈലിപരവുമായ ഉയർന്നുപോകൽ നിലനിർത്തുന്നു. ‘എന്നാൽ’ ഉപയോഗിച്ച് മുന്നേറ്റവും പരാജയവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കി.
