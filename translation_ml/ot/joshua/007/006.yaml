id: JOS.7.6
reference: Joshua 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ തന്റെ വസ്ത്രങ്ങൾ കീറി, യഹ്‌വെയുടെ പെട്ടകത്തിനുമുമ്പിൽ മുഖം നിലത്താക്കി വീണു. അവനും ഇസ്രായേലിലെ മൂപ്പന്മാരും സന്ധ്യവരെ അങ്ങനെ കിടന്നു; അവർ തങ്ങളുടെ തലയിൽ പൊടി വിതറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: തലയിൽ പൊടി വിതറുന്നത് ദുഃഖം, വിലാപം, അല്ലെങ്കിൽ താഴ്മ പ്രകടിപ്പിക്കുന്ന പതിവ് അടയാളമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖത്തിന്റെയോ അത്യന്തവ്യസനത്തിന്റെയോ അടയാളമായി വസ്ത്രം കീറുന്ന വ്യക്തമായ പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: മുഖം നിലത്താക്കി വീണു
  rationale: നിലത്തു സാഷ്ടാംഗം വീഴുന്ന ശരീരനില മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; എബ്രായപ്രയോഗത്തിന്റെ ഭൗതികതയും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: യഹ്‌വെയുടെ പെട്ടകത്തിനുമുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥവും אֲרוֹן എന്ന പെട്ടകവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണരൂപം നൽകുന്നു.
- source_word: עַד הָעֶרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: അവനും ഇസ്രായേലിലെ മൂപ്പന്മാരും
  rationale: യോശുവയോടൊപ്പം മൂപ്പന്മാരും നിലത്തു കിടന്നുവെന്ന പിന്നീടുചേർത്ത കർത്തൃവിവരം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: തങ്ങളുടെ തലയിൽ പൊടി വാരിയിട്ടു
  rationale: വാച്യമായി ‘പൊടി തലമേൽ കയറ്റി’ എന്ന ആശയമുള്ള ദുഃഖാചാരം സ്വാഭാവിക മലയാളത്തിൽ സജീവമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമം നിലനിർത്തുന്നു; ‘യഹോവ’യെക്കാൾ ‘യഹ്‌വെ’ എബ്രായനാമത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: യോശുവയോടൊപ്പം മൂപ്പന്മാരും നിലത്തു വീണുകിടന്നോ എന്ന വാക്യഘടന
  choice: അവനും ഇസ്രായേലിലെ മൂപ്പന്മാരും സന്ധ്യവരെ അങ്ങനെ കിടന്നു
  alternative: യോശുവ മാത്രം വീണു; മൂപ്പന്മാർ പൊടി തലയിൽ ഇട്ടു
  rationale: വചനത്തിലെ הוּא וְזִקְנֵי יִשְׂרָאֵל എന്ന പിന്നീടുചേർത്ത കർത്തൃഘടകം യോശുവയെയും മൂപ്പന്മാരെയും മുൻപ്രവൃത്തിയിൽ ഒരുമിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; ‘അങ്ങനെ’ എന്നത് ആ ഭാവം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വീണു ... അങ്ങനെ കിടന്നു’ എന്ന ഘടന എബ്രായത്തിലെ ഏകവചനക്രിയയെയും തുടർന്ന് വരുന്ന യോശുവയും മൂപ്പന്മാരും എന്ന സംയുക്തകർത്താവിനെയും വായനാസൗകര്യത്തോടെ പ്രതിഫലിപ്പിക്കുന്നു.
