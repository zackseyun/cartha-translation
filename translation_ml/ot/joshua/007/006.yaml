revisions:
- from: അപ്പോൾ യോശുവ തന്റെ വസ്ത്രങ്ങൾ കീറി, യഹ്‌വെയുടെ പെട്ടകത്തിനുമുമ്പിൽ മുഖം നിലത്താക്കി വീണു. അവനും ഇസ്രായേലിലെ മൂപ്പന്മാരും സന്ധ്യവരെ അങ്ങനെ കിടന്നു; അവർ തങ്ങളുടെ തലയിൽ പൊടി വാരിയിട്ടു.[a]
