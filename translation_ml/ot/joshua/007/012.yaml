  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇസ്രായേൽമക്കൾക്ക് തങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ ഉറച്ചുനിൽക്കാൻ കഴിയുന്നില്ല; അവർ ശത്രുക്കളുടെ മുമ്പിൽ പുറംതിരിഞ്ഞുപോകുന്നു. കാരണം, അവർ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീർന്നിരിക്കുന്നു.[a] നിങ്ങളുടെ ഇടയിൽനിന്ന് നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത് നശിപ്പിച്ചുകളയാത്തപക്ഷം ഞാൻ ഇനി നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ חֵרֶם (ഖേരെം) എന്ന പദം നിരോധനവിധിയിൻകീഴിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടതും നശിപ്പിക്കപ്പെടേണ്ടതുമായതിനെയാണ് സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗത പരിഭാഷകളിൽ ഇത് പലപ്പോഴും ‘ശപിക്കപ്പെട്ടത്’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബ-ജനസമൂഹ ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ബൈബിൾശൈലി നൽകുകയും ചെയ്യുന്നു.
- source_word: יֻכְלוּ ... לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: ശത്രുക്കളുടെ മുമ്പിൽ ഉറച്ചുനിൽക്കാൻ കഴിയുന്നില്ല
  rationale: ശത്രുവിനെ നേരിട്ട് ചെറുത്തുനിൽക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘ഉറച്ചുനിൽക്കുക’ ഉപയോഗിച്ചു; വർത്തമാന സാഹചര്യത്തിലെ അസമർഥതയും നിലനിർത്തുന്നു.
- source_word: עֹרֶף יִפְנוּ
  choice: പുറംതിരിഞ്ഞ് ഓടുന്നു
  rationale: അക്ഷരാർഥമായ ‘കഴുത്ത്/പുറം തിരിക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, യുദ്ധത്തിൽ പരാജയപ്പെട്ട് പിന്മാറുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָיוּ לְחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവരായിത്തീർന്നിരിക്കുന്നു
  rationale: חֵרֶם എന്നത് ദൈവത്തിനു വേർതിരിക്കപ്പെട്ടതും നിരോധനവിധിപ്രകാരം നശിപ്പിക്കപ്പെടേണ്ടതുമായ നിലയെ സൂചിപ്പിക്കുന്നു; വെറും ‘ശപിക്കപ്പെട്ടവർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: ഞാൻ ഇനി നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയില്ല
  rationale: אוֹסִיף + infinitive സൂചിപ്പിക്കുന്ന തുടർച്ചയുടെ അവസാനത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִם לֹא
  choice: നശിപ്പിച്ചുകളയാത്തപക്ഷം
  rationale: നിഷേധാത്മക വ്യവസ്ഥ മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: תַשְׁמִידוּ הַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തു നശിപ്പിച്ചുകളയുക
  rationale: ശിബിരത്തിനുള്ളിലുള്ള നിർദിഷ്ട חֵרֶם-വസ്തുവിനെയും അതിനെ നിർണായകമായി നശിപ്പിക്കണമെന്ന കല്പനയെയും വ്യക്തമാക്കുന്നു.
- source_word: מִקִּרְבְּכֶם
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: സമൂഹത്തിനകത്തുനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ חֵרֶם എന്ന പദത്തിന്റെ നിലയും നിർദിഷ്ട വസ്തുവും
  choice: ആദ്യസ്ഥാനത്ത് ‘നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവർ’, രണ്ടാംസ്ഥാനത്ത് ‘നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട വസ്തു’
  alternative: ‘ശപിക്കപ്പെട്ടവർ / ശപിക്കപ്പെട്ട വസ്തു’ അല്ലെങ്കിൽ ‘നിരോധനത്തിൻകീഴിലുള്ളവർ / നിരോധിത വസ്തു’
  rationale: ഒരേ എബ്രായ പദത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ആദ്യപ്രയോഗത്തിലെ ന്യായവിധിക്കു വിധേയമായ നിലയും രണ്ടാംപ്രയോഗത്തിലെ സമൂഹത്തിനുള്ളിലുള്ള നിർദിഷ്ട വസ്തുവും വേർതിരിക്കുന്നു. ‘ശാപം’ എന്ന ഒറ്റ ആശയത്തിലേക്ക് ആരാധനാ-ന്യായവിധി ഭാവം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനാശൈലി. חֵרֶם എന്ന പ്രധാന പദത്തിന്റെ ആവർത്തനബന്ധം നിലനിർത്തി; അസ്പഷ്ടമായ ‘സമർപ്പിതം’ എന്ന സാനുകൂല ധ്വനി ഒഴിവാക്കാൻ ‘നാശത്തിനായി’ എന്നു വ്യക്തമാക്കി.
