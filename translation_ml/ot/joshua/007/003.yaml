base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: ml
  text: 'അവർ യോശുവയുടെ അടുക്കൽ മടങ്ങിവന്ന് അവനോടു പറഞ്ഞു: “ജനം മുഴുവനും കയറിപ്പോകേണ്ട. ഏകദേശം രണ്ടായിരമോ മൂവായിരമോ പേർ കയറിച്ചെന്ന് ഹായിയെ ആക്രമിക്കട്ടെ. അവിടെ ജനം മുഴുവനെയും അധ്വാനിപ്പിക്കേണ്ട[a]; അവർ എണ്ണത്തിൽ കുറവാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ ജനം മുഴുവനെയും ബുദ്ധിമുട്ടിക്കേണ്ട.” എബ്രായ ക്രിയയ്ക്ക് അനാവശ്യമായ പ്രയത്നംകൊണ്ട് ക്ഷീണിപ്പിക്കുക, അധ്വാനിപ്പിക്കുക, അല്ലെങ്കിൽ ബുദ്ധിമുട്ടിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: അവർ യോശുവയുടെ അടുക്കൽ മടങ്ങിവന്ന് അവനോടു പറഞ്ഞു
  rationale: ശוב് എന്ന ക്രിയയുടെ മടങ്ങിവരവ് എന്ന അർഥവും אמרിന്റെ സാധാരണ പ്രയോഗവും സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: אַל־יַעַל כָּל־הָעָם
  choice: ജനം മുഴുവനും കയറിപ്പോകേണ്ട
  rationale: אַל + jussive നൽകുന്ന വിലക്കോ ഉപദേശമോ മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധനിർദേശമായി നൽകുന്നു. עלהയുടെ ഉയർന്നിടത്തേക്കോ ആക്രമണത്തിനായോ പോകുന്ന ഭാവം ‘കയറിപ്പോകുക’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: ഏകദേശം രണ്ടായിരം പേരോ മൂവായിരം പേരോ
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ഏകദേശസംഖ്യാഭാവം ‘ഏകദേശം’ കൊണ്ട് വ്യക്തമാക്കുന്നു. אִישׁ ഇവിടെ യുദ്ധത്തിനുപോകുന്ന പുരുഷന്മാരെ സൂചിപ്പിച്ചാലും മലയാളത്തിൽ സംഖ്യയോടൊപ്പം ‘പേർ’ സ്വാഭാവികമാണ്.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: കയറിച്ചെന്ന് ഹായിയെ ആക്രമിക്കട്ടെ
  rationale: עלהയുടെ കയറിപ്പോകൽഭാവം നിലനിർത്തുകയും נכהയുടെ സൈനികസന്ദർഭത്തിലുള്ള അർഥം സ്വാഭാവികമായി ‘ആക്രമിക്കുക’ എന്നു നൽകുകയും ചെയ്യുന്നു; ‘തോൽപ്പിക്കുക’ എന്നത് ഫലം മുൻകൂട്ടി നിർണയിക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: אַל־תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: ജനം മുഴുവനെയും അങ്ങോട്ടു കൊണ്ടുപോയി അധ്വാനിപ്പിക്കേണ്ട
  rationale: Piel രൂപത്തിലുള്ള יגע അനാവശ്യമായ പ്രയത്നം മൂലം ക്ഷീണിപ്പിക്കുകയോ ബുദ്ധിമുട്ടിക്കുകയോ ചെയ്യുക എന്ന ഭാവം നൽകുന്നു. שָׁמָּהയുടെ ദിശാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: כִּי מְעַט הֵמָּה
  choice: അവർ ചുരുക്കംപേരേയുള്ളൂ
  rationale: ഹായിയിലെ ജനങ്ങളെയോ പ്രതിരോധസേനയെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ നിലനിർത്തി, എണ്ണം കുറവാണെന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ യുദ്ധസേനയെ സൂചിപ്പിക്കാമെങ്കിലും എബ്രായത്തിലെ വിശാലമായ ‘ജനം’ എന്ന പദം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; ‘സൈന്യം’ എന്നു ചുരുക്കുന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
