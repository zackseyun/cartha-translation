  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: ml
  text: 'ആഖാൻ യോശുവയോടു മറുപടിയായി പറഞ്ഞു: “സത്യമായും ഞാൻ ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേയോടു പാപം ചെയ്തിരിക്കുന്നു. ഞാൻ ചെയ്തത് ഇതാണ്:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇങ്ങനെയും ഇങ്ങനെയും ഞാൻ ചെയ്തു.” താൻ ചെയ്തതിന്റെ വിശദാംശങ്ങൾ തുടർന്നു പറയാൻ തുടങ്ങുന്ന ഒരു എബ്രായ ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ ഇരട്ട ക്രിയാരൂപം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אָמְנָה
  choice: സത്യമായും
  rationale: കുറ്റസമ്മതത്തിന്റെ ഗൗരവമുള്ള ഉറപ്പിക്കൽ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אָנֹכִי חָטָאתִי
  choice: ഞാൻ ... പാപം ചെയ്തിരിക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിലെ ഊന്നലും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വേയോടു
  rationale: חטא എന്ന ക്രിയയോടുള്ള ל കുറ്റം ആരോടാണെന്നു സൂചിപ്പിക്കുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യാഹ്‌വേയെ തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തപദപ്രയോഗം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: ഞാൻ ചെയ്തത് ഇതാണ്
  rationale: തുടർന്ന് പറയാനിരിക്കുന്ന വിശദാംശങ്ങളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ശൈലീപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ അടുത്ത ലിപ്യന്തരണമായി നൽകുന്നു.
- issue: חטא ל എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: യാഹ്‌വേയോടു പാപം ചെയ്തു
  alternative: യാഹ്‌വേക്കു പാപം ചെയ്തു
  rationale: ദൈവം കുറ്റം ചെയ്യപ്പെട്ട വ്യക്തിയാണെന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സംഭാഷണത്തിലെ ഔപചാരികതയും കുറ്റസമ്മതത്തിന്റെ ഭാവവും നിലനിർത്തി.
