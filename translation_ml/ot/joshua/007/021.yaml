translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരാതന അളവായ ‘ശേക്കെൽ’ നിലനിർത്തി; രൂപചിത്രമുള്ള ‘സ്വർണനാവ്’ മുഖ്യവാചകത്തിൽ വിശദീകരണാത്മകമായി നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
