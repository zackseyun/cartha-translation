source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: ml
  text: കൊള്ളയിൽ ശിനാറിൽനിന്നുള്ള മനോഹരമായ ഒരു മേലങ്കിയും[a] ഇരുനൂറു ശേക്കെൽ വെള്ളിയും അമ്പതു ശേക്കെൽ തൂക്കമുള്ള ഒരു സ്വർണക്കട്ടിയും[b] ഞാൻ കണ്ടു. ഞാൻ അവ മോഹിച്ചു, എടുത്തു. നോക്കൂ, അവ എന്റെ കൂടാരത്തിനുള്ളിൽ നിലത്തിനുള്ളിൽ ഒളിപ്പിച്ചിരിക്കുന്നു; വെള്ളി ആ മേലങ്കിയുടെ അടിയിലാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശിനാറിൽനിന്നുള്ള വിശിഷ്ടമായ ഒരു പുറംവസ്ത്രം.” എബ്രായപദം ഭംഗിയുള്ള മേലങ്കിയെയോ പുറംവസ്ത്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി “ഒരു സ്വർണനാവ്”; നാവിന്റെ ആകൃതിയിലുള്ള ഒരു സ്വർണവസ്തുവായിരിക്കാം ഉദ്ദേശിക്കുന്നത്. ചില പരിഭാഷകളിൽ “സ്വർണക്കീൽ” എന്നും കാണാം.
    reason: lexical_alternative
  - marker: c
    text: 'അവസാനത്തെ എബ്രായ സർവനാമപ്രത്യയം സ്ത്രീലിംഗ ഏകവചനമാണ്; അത് മിക്കവാറും മേലങ്കിയെയാണ് സൂചിപ്പിക്കുന്നത്: “വെള്ളി അതിന്റെ അടിയിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: കൊള്ളയിൽ
  rationale: യുദ്ധത്തിൽ പിടിച്ചെടുത്ത വസ്തുക്കളെയാണ് שָׁלָל സൂചിപ്പിക്കുന്നത്; സ്ഥലസൂചകമായ ב സ്വാഭാവികമായി ‘കൊള്ളയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: ശിനാറിൽനിന്നുള്ള മനോഹരമായ ഒരു മേലങ്കി
  rationale: אַדֶּרֶת ഭംഗിയുള്ള പുറംവസ്ത്രമോ മേലങ്കിയോ ആകാം; שִׁנְעָר ഉത്ഭവസ്ഥലമായി അവതരിപ്പിക്കുകയും טוֹבָה ഗുണഭംഗി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: ഇരുനൂറു ശേക്കെൽ വെള്ളി
  rationale: പുരാതന തൂക്കയളവായ ശേക്കെൽ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: നാവിന്റെ ആകൃതിയിലുള്ള ഒരു സ്വർണക്കട്ടി
  rationale: לָשׁוֹן എന്നതിന്റെ അക്ഷരാർഥമായ ‘നാവ്’ എന്ന രൂപചിത്രവും സന്ദർഭത്തിലെ സ്വർണക്കട്ടിയെന്ന വസ്തുസൂചനയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: അമ്പതു ശേക്കെൽ തൂക്കമുള്ള
  rationale: വസ്തുവിന്റെ തൂക്കം വ്യക്തമാക്കുന്ന എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: וָאֶחְמְדֵם
  choice: ഞാൻ അവ മോഹിച്ചു
  rationale: חמד ശക്തമായ ആഗ്രഹവും ഇവിടെ തെറ്റായ സ്വന്തമാക്കലിന്റെ ധാർമിക ഭാരവും വഹിക്കുന്നു; ‘മോഹിച്ചു’ അത് സംരക്ഷിക്കുന്നു.
- source_word: וָאֶקָּחֵם
  choice: എടുത്തു
  rationale: לקח എന്ന സാധാരണ ‘എടുക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി.
- source_word: וְהִנָּם
  choice: നോക്കൂ, അവ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה-യുടെ തത്സമയഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: നിലത്ത് മറച്ചുവെച്ചിരിക്കുന്നു
  rationale: ടെന്റിനുള്ളിലെ മണ്ണിൽ ഒളിപ്പിച്ചിരിക്കുന്നതെന്ന ആശയം വ്യക്തമാക്കുന്നു; ‘കുഴിച്ചിട്ടിരിക്കുന്നു’ എന്നതിലധികം മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: എന്റെ കൂടാരത്തിനുള്ളിൽ
  rationale: അകത്തെ സ്ഥാനം ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: വെള്ളി ആ മേലങ്കിയുടെ അടിയിലാണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി മേലങ്കിയെ സൂചിപ്പിക്കുന്നു; അവ്യക്തമായ മലയാള സർവനാമം ഒഴിവാക്കി സൂചന വ്യക്തമാക്കി.
