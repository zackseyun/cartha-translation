  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. എബ്രായത്തിലെ യുദ്ധഭാഷയും ഹൃദയം ഉരുകി വെള്ളംപോലെയായി എന്ന രൂപകവും നിലനിർത്തിയിട്ടുണ്ട്. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
