  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: ml
  text: ആയി നഗരത്തിലെ പുരുഷന്മാർ അവരിൽ ഏകദേശം മുപ്പത്താറു പേരെ അടിച്ചുവീഴ്ത്തി. അവർ പട്ടണവാതിലിന്റെ മുമ്പിൽനിന്ന് ശെബാരീംവരെ[a] അവരെ പിന്തുടർന്നു; ഇറക്കത്തിൽ വെച്ച് അവരെ അടിച്ചുവീഴ്ത്തി. അപ്പോൾ ജനത്തിന്റെ ഹൃദയം ഉരുകി വെള്ളംപോലെയായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൽവെട്ടുസ്ഥലങ്ങൾവരെ’ എന്നും ‘തകർന്ന സ്ഥലങ്ങൾവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പദമായ ശെബാരീം ഒരു സ്ഥലനാമമായോ വിവരണാത്മകമായ പൊതുനാമമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ / וַיַּכּוּם
  choice: വെട്ടിവീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിലെ נכה എന്ന ക്രിയയുടെ ശക്തിയും മാരകമോ നിർണായകമോ ആയ പ്രഹരത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം അതിയായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: מֵהֶם
  choice: അവരിൽ
  rationale: യിസ്രായേൽ സൈന്യത്തിൽനിന്നുള്ളവരാണ് വീണതെന്ന വിഭാഗാത്മക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַנְשֵׁי הָעַי
  choice: ആയിപട്ടണത്തിലെ പുരുഷന്മാർ
  rationale: ആയിയോടു ബന്ധപ്പെട്ട പുരുഷന്മാർ എന്ന നിർമാണബന്ധം വ്യക്തമാക്കുന്നു; സൈനികസന്ദർഭത്തിൽ പുരുഷന്മാർ എന്നത് യോജിക്കുന്നു.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: ഏകദേശം മുപ്പത്താറുപേരെ
  rationale: സംഖ്യയ്ക്കുമുമ്പുള്ള כ־ നൽകുന്ന ഏകദേശഭാവം ‘ഏകദേശം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּרְדְּפוּם
  choice: അവരെ പിന്തുടർന്ന്
  rationale: רדף എന്ന സൈനിക പിന്തുടർച്ചയുടെ അർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: പട്ടണവാതിലിന്റെ മുമ്പിൽനിന്ന്
  rationale: ‘വാതിലിന്റെ മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ സ്ഥലസൂചന നിലനിർത്തുന്നു; സന്ദർഭവ്യക്തതയ്ക്കായി ‘പട്ടണവാതിൽ’ ഉപയോഗിക്കുന്നു.
- source_word: עַד הַשְּׁבָרִים
  choice: ശെബാരീംവരെ
  rationale: ലക്ഷ്യസ്ഥാനമായി പ്രവർത്തിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്ഥലനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പൊതുനാമമായുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בַּמּוֹרָד
  choice: ഇറക്കത്തിൽവെച്ച്
  rationale: מורד എന്നതിന്റെ ഇറക്കം/താഴോട്ടുള്ള ചരിവ് എന്ന ഭൂപ്രകൃതിസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: ജനത്തിന്റെ ഹൃദയം ഉരുകി
  rationale: ധൈര്യം തകർന്നതിനെ സൂചിപ്പിക്കുന്ന ദൃശ്യമായ എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: וַיְהִי לְמָיִם
  choice: വെള്ളംപോലെയായി
  rationale: മനോധൈര്യം പൂർണമായി തകർന്നെന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
