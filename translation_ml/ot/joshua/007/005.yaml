- from: ആയിപട്ടണത്തിലെ പുരുഷന്മാർ അവരിൽ ഏകദേശം മുപ്പത്താറുപേരെ വെട്ടിവീഴ്ത്തി. പട്ടണവാതിലിന്റെ മുമ്പിൽനിന്ന് ശെബാരീംവരെ[a] അവരെ പിന്തുടർന്ന് ഇറക്കത്തിൽവെച്ചും അവരെ വെട്ടിവീഴ്ത്തി. അപ്പോൾ ജനത്തിന്റെ ഹൃദയം ഉരുകി വെള്ളംപോലെയായി.
  to: ആയി നഗരത്തിലെ പുരുഷന്മാർ അവരിൽ ഏകദേശം മുപ്പത്താറു പേരെ അടിച്ചുവീഴ്ത്തി. അവർ പട്ടണവാതിലിന്റെ മുമ്പിൽനിന്ന് ശെബാരീംവരെ[a] അവരെ പിന്തുടർന്നു; ഇറക്കത്തിൽ വെച്ച് അവരെ അടിച്ചുവീഴ്ത്തി. അപ്പോൾ ജനത്തിന്റെ ഹൃദയം ഉരുകി വെള്ളംപോലെയായി.
