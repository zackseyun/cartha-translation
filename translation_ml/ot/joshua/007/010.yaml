id: JOS.7.10
reference: Joshua 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל יְהוֹשֻׁ֖עַ קֻ֣ם לָ֑/ךְ לָ֣/מָּה זֶּ֔ה אַתָּ֖ה נֹפֵ֥ל עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: ml
  text: 'യഹ്‌വേ യോശുവയോടു പറഞ്ഞു: “എഴുന്നേൽക്കുക. നീ ഇങ്ങനെ കവിണ്ണുവീണു കിടക്കുന്നത് എന്തിന്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ വാക്കായ אמר-ന്റെ സ്വാഭാവിക മലയാള ഭൂതകാലരൂപം.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതവും ഉറച്ചതുമായ രൂപം.
- source_word: קֻם לָךְ
  choice: എഴുന്നേൽക്കുക
  rationale: קום എന്ന ആജ്ഞയുടെ നേരായ അർഥം നൽകി; പിന്നാലെയുള്ള לָךְ ഇവിടെ ആജ്ഞയെ ഊന്നുന്ന പ്രയോഗമായതിനാൽ വേർതിരിച്ച് വിവർത്തനം ചെയ്തില്ല.
- source_word: לָמָּה זֶּה
  choice: ഇങ്ങനെ ... എന്തിന്
  rationale: ലളിതമായ ‘എന്തിന്’ എന്നതിലുപരി זֶּה നൽകുന്ന ചൂണ്ടിക്കാണിക്കൽ/ഊന്നൽ ‘ഇങ്ങനെ’ എന്നതിലൂടെ സ്വാഭാവികമായി സൂക്ഷിച്ചു.
- source_word: אַתָּה
  choice: നീ
  rationale: എബ്രായത്തിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിരിക്കുന്നതിനാൽ അതിന്റെ ഊന്നൽ മലയാളത്തിലും നിലനിർത്തി.
- source_word: נֹפֵל עַל־פָּנֶיךָ
  choice: കവിണ്ണുവീണു കിടക്കുന്നത്
  rationale: പദശഃ ‘മുഖത്തിന്മേൽ വീഴുക’ എന്ന പ്രയോഗം ഇവിടെ യോശുവയുടെ നിലവിലുള്ള സാഷ്ടാംഗ/മുഖം നിലത്തായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദൃശ്യവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ആ വ്യത്യാസം ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണം. לָמָּה זֶּה എന്ന ഊന്നൽ ‘ഇങ്ങനെ ... എന്തിന്’ എന്ന സ്വാഭാവിക വാക്യക്രമത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു. ഈ വാക്യത്തിന് അടിക്കുറിപ്പ് ആവശ്യമില്ല.
