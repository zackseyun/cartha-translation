revisions:
- from: 'യോശുവ പറഞ്ഞു: “അയ്യോ, കർത്താവായ യഹോവേ,[a] ഞങ്ങളെ അമോര്യരുടെ കൈയിൽ ഏല്പിച്ചു നശിപ്പിക്കാനായി അങ്ങ് ഈ ജനത്തെ യോർദാനക്കരെ കടത്തിക്കൊണ്ടുവന്നത് എന്തിന്? ഞങ്ങൾ യോർദാന്റെ അക്കരെത്തന്നെ പാർക്കാൻ സമ്മതിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!”'
  to: 'യോശുവ പറഞ്ഞു: “അയ്യോ, കർത്താവായ യാഹ്‌വേ,[a] ഞങ്ങളെ അമോര്യരുടെ കൈയിൽ ഏല്പിച്ച് നശിപ്പിക്കാനായി അങ്ങ് ഈ ജനത്തെ യോർദാൻ കടത്തി കൊണ്ടുവന്നത് എന്തിന്? ഞങ്ങൾ യോർദാന്റെ അക്കരെത്തന്നെ പാർക്കാൻ സമ്മതിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!”'
  rationale: The revision preserves the Hebrew lament and purpose structure while clarifying the crossing action. It also resolves the inconsistent divine-name forms and follows the supplied POB audit trail’s Yahweh policy. The conditional wish retains הוֹאַלְנוּ as willingness/consent, not contentment.
