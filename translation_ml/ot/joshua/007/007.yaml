reference: Joshua 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: ml
  text: 'യോശുവ പറഞ്ഞു: “അയ്യോ, കർത്താവായ യാഹ്‌വേ,[a] ഞങ്ങളെ അമോര്യരുടെ കൈയിൽ ഏല്പിച്ച് നശിപ്പിക്കാനായി അങ്ങ് ഈ ജനത്തെ യോർദാൻ കടത്തി കൊണ്ടുവന്നത് എന്തിന്? ഞങ്ങൾ യോർദാന്റെ അക്കരെത്തന്നെ പാർക്കാൻ സമ്മതിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ “അദോനായ് യഹ്വെ” എന്ന സംയുക്ത ദൈവസംബോധനയാണ്; “അദോനായ്” “കർത്താവ്” എന്നും യഹ്വെ എന്ന ദൈവനാമം “യാഹ്‌വേ” എന്നും ഇവിടെ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: മൂലപാഠത്തിലെ കർത്താവെന്ന അഭിസംബോധനയും ദൈവനാമവും വ്യക്തമാക്കാനും മുഖ്യപാഠത്തിലെ ദൈവനാമരൂപം സ്ഥിരമായി നിലനിർത്താനും.
lexical_decisions:
- source_word: אֲהָהּ
  choice: അയ്യോ
  rationale: ദുഃഖവും സംഭ്രമവും പ്രകടിപ്പിക്കുന്ന വിലാപസ്വരം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന അധികാരപദവും യְהוִה എന്ന ദൈവനാമവും വേർതിരിച്ചറിയിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംബോധനയായി നൽകുന്നു.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: കടത്തിക്കൊണ്ടുവന്നത്
  rationale: ഹിഫ്ഇൽ ക്രിയയുടെയും അതോടൊപ്പമുള്ള infinitive absolute-ന്റെയും കാരണാർത്ഥവും ഊന്നലും സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു; ചോദ്യം മുഴുവനിലെ ‘എന്തിന്?’ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֶת־הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: עָם എന്ന ഏകവചന സമൂഹവാചകത്തിന്റെ ദേശീയ-സമൂഹ അർത്ഥം നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: אֶת־הַיַּרְדֵּן
  choice: യോർദാനക്കരെ
  rationale: עבר എന്ന ക്രിയയോടൊപ്പം നദി കടന്ന് മറുകരയിലെത്തിയ ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: ഞങ്ങളെ അമോര്യരുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ അധികാരരൂപകം നിലനിർത്തുന്നു; הָאֱמֹרִי സമൂഹവാചകമായതിനാൽ ‘അമോര്യർ’ എന്നു ബഹുവചനത്തിൽ നൽകുന്നു.
- source_word: לְהַאֲבִידֵנוּ
  choice: നശിപ്പിക്കാനായി
  rationale: പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യപ്രയോഗം നേരിട്ടും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: וְלוּ
  choice: എത്ര നന്നായിരുന്നു
  rationale: നടക്കാതെപോയ ഒരു കാര്യത്തെക്കുറിച്ചുള്ള ശക്തമായ അഭിലാഷം മലയാളത്തിലെ സ്വാഭാവിക പ്രത്യാശാവാക്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הוֹאַלְנוּ
  choice: സമ്മതിച്ചിരുന്നെങ്കിൽ
  rationale: יאל എന്ന ക്രിയയിലെ മനസ്സോടെയുള്ള സമ്മതം/തീരുമാനം സൂക്ഷിക്കുന്നു; ‘തൃപ്തരായിരുന്നെങ്കിൽ’ എന്ന മൂലത്തിലില്ലാത്ത സംതൃപ്തിഭാവം ഒഴിവാക്കുന്നു.
- source_word: וַנֵּשֶׁב
  choice: പാർക്കാൻ
  rationale: ישב എന്നതിലെ താമസിക്കുക/വസിക്കുക എന്ന അർത്ഥം ആഗ്രഹനിർമാണത്തോടു ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: യോർദാന്റെ അക്കരെത്തന്നെ
  rationale: സംസാരകന്റെ ഇപ്പോഴത്തെ കനാൻദേശീയ കാഴ്ചപ്പാടിൽ യോർദാന്റെ മറുവശം സൂചിപ്പിക്കുന്നു; ‘തന്നെ’ അവിടെ തുടരാനുള്ള ആഗ്രഹത്തിന്റെ ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവസംബോധനയുടെ പരിഭാഷ
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ; എന്റെ കർത്താവേ, യഹോവേ
  rationale: മൂലപാഠത്തിലെ യְהוִה എന്ന ദൈവനാമം മറയ്ക്കാതെ ‘യഹോവ’ എന്നു നൽകുകയും אֲדֹנָי എന്ന പദവും പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു. ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: യോശുവയുടെ ചോദ്യത്തിലെ ദൈവത്തോടുള്ള വിലാപവും കുറ്റാരോപണസദൃശമായ സംഘർഷവും
  choice: നേരിട്ടുള്ള ‘എന്തിന്?’ ചോദ്യം നിലനിർത്തി
  alternative: വിനയപരമായ വിശദീകരണമാക്കി മൃദൂകരിക്കുക
  rationale: മൂലത്തിലെ വേദനാഭരിതമായ ദൈവസംബോധനയും ദൈവത്തിന്റെ പ്രവൃത്തിയെ ചോദ്യം ചെയ്യുന്ന യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ശമിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, എന്നാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ശൈലി. വിലാപത്തിന്റെ തീവ്രതയ്ക്ക് ‘അയ്യോ’, അധികാരരൂപകം സംരക്ഷിക്കാൻ ‘കൈയിൽ ഏല്പിച്ചു’, വാസത്തിന്റെ ഭാവത്തിന് ‘പാർക്കാൻ’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ [a] ആയി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
