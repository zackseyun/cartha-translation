  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: ml
  text: '“എഴുന്നേൽക്കുക; ജനത്തെ വിശുദ്ധീകരിക്കുക; അവരോടു പറയുക: ‘നാളേക്കായി നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ. യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: യിസ്രായേലേ, നിന്റെ മധ്യേ നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത്[a] ഉണ്ട്. നിങ്ങളുടെ മധ്യേനിന്ന് നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത് നീക്കിക്കളയുന്നതുവരെ നിന്റെ ശത്രുക്കളുടെ മുമ്പിൽ നിൽക്കാൻ നിനക്കു കഴിയുകയില്ല.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ חֵרֶם (ഖേരെം) എന്ന പദം തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് നശിപ്പിക്കാനായി നീക്കിവെച്ച വസ്തുവാണ്. പരമ്പരാഗതമായി ‘നിരോധിതവസ്തു’ എന്നും ‘സമർപ്പിതവസ്തു’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: എഴുന്നേൽക്കുക
  rationale: യോശുവയോട് ഉടൻ പ്രവർത്തിക്കാൻ കല്പിക്കുന്ന ഏകവചന ആജ്ഞയുടെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: വിശുദ്ധീകരിക്കുക / നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ
  rationale: ആദ്യത്തെ പീയേൽ ആജ്ഞയുടെയും പിന്നത്തെ ആത്മനേപദസ്വഭാവമുള്ള ഹിത്പയേൽ ആജ്ഞയുടെയും ബന്ധം ഒരേ പദമൂലത്തിലൂടെ നിലനിർത്തുന്നു; രണ്ടാമത്തേതിലെ പ്രത്യാവർത്തക അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: לְמָחָר
  choice: നാളേക്കായി
  rationale: അടുത്ത ദിവസത്തെ നേരിടാനുള്ള ഒരുക്കമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ലക്ഷ്യാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അടുത്തുള്ള ശബ്ദലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: חֵרֶם
  choice: നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത്
  rationale: തിരിച്ചെടുക്കാനാവാത്തവിധം ദൈവത്തിനു നീക്കിവെച്ചതും ഈ സന്ദർഭത്തിൽ നാശത്തിനു വിധേയമായതുമായ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ‘ശാപവസ്തു’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ചുരുക്കരൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: യിസ്രായേലേ, നിന്റെ മധ്യേ
  rationale: യിസ്രായേലിനെ ഒരു സമൂഹവ്യക്തിയായി അഭിസംബോധന ചെയ്യുന്ന എബ്രായ ഏകവചനവും നേരിട്ടുള്ള വിളിയും സംരക്ഷിക്കുന്നു.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിൽക്കാൻ നിങ്ങൾക്കു കഴിയുകയില്ല
  rationale: ശത്രുക്കളെ ചെറുത്തുനിൽക്കാനോ അവർക്കെതിരെ നിലനിൽക്കാനോ കഴിയില്ലെന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד הֲסִירְכֶם
  choice: നീക്കിക്കളയുന്നതുവരെ
  rationale: ആ വസ്തു സമൂഹത്തിൽനിന്നു പൂർണമായി മാറ്റണമെന്ന നിബന്ധനയും അതിന്റെ സമയപരിധിയും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חֵרֶם എന്ന പദത്തിന്റെ ന്യായവിധി-യുദ്ധ പശ്ചാത്തലം
  choice: നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത്
  alternative: നിരോധിതവസ്തു / ശാപവസ്തു / സമർപ്പിതവസ്തു
  rationale: ഈ പദം വെറും ശപിക്കപ്പെട്ട വസ്തുവെന്നല്ല, തിരിച്ചെടുക്കാനാവാത്തവിധം നീക്കിവെക്കപ്പെട്ടതും ഇവിടെ നാശത്തിനു വിധിക്കപ്പെട്ടതുമായ ഒന്നെന്ന അർഥം വഹിക്കുന്നു. വിവർത്തനം സമർപ്പണത്തിന്റെയും നാശത്തിന്റെയും ഘടകങ്ങൾ രണ്ടും നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവികൊണ്ട് പകരാതെ സുതാര്യമായി ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: യിസ്രായേലിനെ ഏകവചനത്തിലും ബഹുവചനത്തിലും അഭിസംബോധന ചെയ്യുന്നത്
  choice: ‘നിന്റെ മധ്യേ’ എന്ന ഏകവചനവും ‘നിങ്ങളുടെ മധ്യേനിന്ന്’ എന്ന ബഹുവചനവും നിലനിർത്തുന്നു
  alternative: രണ്ടിടത്തും ഒരേ വ്യാകരണവചനം ഉപയോഗിക്കുക
  rationale: മസോററ്റിക് പാഠത്തിലെ സമൂഹത്തെ ഏകകമായി കാണുന്ന അഭിസംബോധനയും സമൂഹാംഗങ്ങളോടുള്ള ബഹുവചന കല്പനയും തമ്മിലുള്ള യഥാർഥ വ്യാകരണവലിവ് ഒതുക്കിക്കളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവിക പ്രസ്താവനയ്ക്ക് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മാന്യരൂപം ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിലെ [a] അടയാളം വിശദീകരിക്കപ്പെടുന്ന חֵרֶם-പദത്തിന്റെ ആദ്യ പ്രത്യക്ഷതയോടു ചേർത്തിരിക്കുന്നു.
