revisions:
- from: '“എഴുന്നേൽക്കുക. ജനത്തെ വിശുദ്ധീകരിച്ച് അവരോടു പറയുക: ‘നാളേക്കായി നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ. യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: യിസ്രായേലേ, നിന്റെ മധ്യേ നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത്[a] ഉണ്ട്. നിങ്ങളുടെ മധ്യേനിന്ന് നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത് നീക്കിക്കളയുന്നതുവരെ നിങ്ങളുടെ ശത്രുക്കളുടെ മുമ്പിൽ നിൽക്കാൻ നിങ്ങൾക്കു കഴിയുകയില്ല.’”'
  to: '“എഴുന്നേൽക്കുക; ജനത്തെ വിശുദ്ധീകരിക്കുക; അവരോടു പറയുക: ‘നാളേക്കായി നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ. യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: യിസ്രായേലേ, നിന്റെ മധ്യേ നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത്[a] ഉണ്ട്. നിങ്ങളുടെ മധ്യേനിന്ന് നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടത് നീക്കിക്കളയുന്നതുവരെ നിന്റെ ശത്രുക്കളുടെ മുമ്പിൽ നിൽക്കാൻ നിനക്കു കഴിയുകയില്ല.’”'
  rationale: The revision corrects the singular pronouns in the clause about Israel’s enemies while retaining the plural pronoun in the final command addressed to the people. It also restores the Hebrew’s sequence of coordinated imperatives. No change has been made to the rendering or explanation of חֵרֶם.
