id: JOS.7.11
reference: Joshua 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: ml
  text: ഇസ്രായേൽ പാപം ചെയ്തിരിക്കുന്നു. ഞാൻ അവരോടു കല്പിച്ച എന്റെ ഉടമ്പടിയും അവർ ലംഘിച്ചിരിക്കുന്നു. നശിപ്പിക്കാനായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കളിൽനിന്ന് അവർ എടുത്തിട്ടുമുണ്ട്[a]; അവർ മോഷ്ടിച്ചിട്ടുമുണ്ട്, വഞ്ചിച്ചിട്ടുമുണ്ട്[b], അവ സ്വന്തം വസ്തുവകകൾക്കിടയിൽ വെച്ചിട്ടുമുണ്ട്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘നിരോധനത്തിനു വിധേയമാക്കിയവയിൽനിന്ന്’ അഥവാ ‘സമ്പൂർണമായി നശിപ്പിക്കാനായി മാറ്റിവെച്ചവയിൽനിന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: ‘കള്ളം പറഞ്ഞിട്ടുമുണ്ട്’ അഥവാ ‘അത് നിഷേധിച്ചിട്ടുമുണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘അവരുടെ പാത്രങ്ങൾ/വസ്തുവകകൾക്കിടയിൽ’; എടുത്ത വസ്തുക്കൾ സ്വന്തം സാധനങ്ങൾക്കിടയിൽ ഒളിപ്പിച്ചുവെച്ചതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: പാപം ചെയ്തിരിക്കുന്നു
  rationale: ദൈവത്തിനെതിരായ പാപം എന്ന പദത്തിന്റെ ധാർമ്മികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: കുറ്റം ചെയ്തത് ഉടൻസന്ദർഭത്തിൽ ഒരാളാണെങ്കിലും എബ്രായപാഠം കുറ്റം സമൂഹമായ ഇസ്രായേലിനാണ് ചുമത്തുന്നത്; ആ കൂട്ടുത്തരവാദിത്വം അതേപടി നിലനിർത്തുന്നു.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി അവർ ലംഘിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: ഉടമ്പടിയുടെ പരിധി അതിക്രമിക്കുക, അതിനെ ലംഘിക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘-യും’ എന്ന ഘടന കുറ്റാരോപണങ്ങളുടെ സഞ്ചയവും സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: ഞാൻ അവരോടു കല്പിച്ച
  rationale: ‘പാലിക്കാൻ’ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവയിൽനിന്ന് അവർ എടുത്തിരിക്കുന്നു
  rationale: חֵרֶם ഇവിടെ ദൈവത്തിനായി മാറ്റിവെച്ച് നശിപ്പിക്കേണ്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ അർഥം വ്യക്തമാക്കുകയും കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: גָּנְבוּ
  choice: അവർ മോഷ്ടിക്കുകയും
  rationale: മോഷണം എന്ന കുറ്റാരോപണം നേരിട്ട് നൽകുന്നു; ആവർത്തിച്ചുള്ള ‘-യും’ ഘടന എബ്രായത്തിലെ וְגַם എന്ന പദത്തിന്റെ സഞ്ചിത ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כִּחֲשׁוּ
  choice: വഞ്ചന കാണിക്കുകയും
  rationale: ഈ ക്രിയയ്ക്ക് കള്ളം പറയുക, വഞ്ചിക്കുക, നിഷേധിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘വഞ്ചന കാണിക്കുക’ വിശാലമായ അർഥപരിധി സംരക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: അവ സ്വന്തം സാധനങ്ങളുടെ ഇടയിൽ വെക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: כְּלִים എന്നത് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, വസ്തുവകകൾ എന്നിങ്ങനെ വിശാലമായ പദമാണ്. ഈ സന്ദർഭത്തിൽ സ്വന്തം വസ്തുവകകളുടെ ഇടയിൽ ഒളിപ്പിച്ചുവെച്ചത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: ലംഘിക്കുകയും ... മോഷ്ടിക്കുകയും ... വഞ്ചന കാണിക്കുകയും ... വെക്കുകയും
  rationale: ഒന്നിനുപിറകെ ഒന്നായി ചുമത്തുന്ന കുറ്റങ്ങളുടെ ഊന്നൽ, അസ്വാഭാവികമായി ‘കൂടാതെ’ ആവർത്തിക്കാതെ, മലയാളത്തിലെ ആവർത്തിച്ചുള്ള ‘-യും’ സമുച്ചയഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒരാളുടെ പ്രവൃത്തിയായിരിക്കെ കുറ്റം സമൂഹമായ ഇസ്രായേലിന് ചുമത്തുന്നത്
  choice: ‘ഇസ്രായേൽ’ എന്ന കൂട്ടായ കർത്താവും തുടർന്ന് ബഹുവചനരൂപങ്ങളും നിലനിർത്തി.
  alternative: വാക്യം ആഖാനെ മാത്രം സൂചിപ്പിക്കുന്നവിധം വ്യക്തിവൽക്കരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപാഠം ഉടമ്പടിജനമായ ഇസ്രായേലിനാണ് പാപം ചുമത്തുന്നത്. ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ വിശദീകരിച്ചോ ലഘൂകരിച്ചോ മാറ്റാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിച്ച’, ‘ഉടമ്പടി’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾപദങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. മൂലത്തിലെ ആവർത്തിച്ചുള്ള കുറ്റാരോപണങ്ങളെ മലയാളത്തിലെ ‘-യും’ സമുച്ചയഘടനയിലൂടെ പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
