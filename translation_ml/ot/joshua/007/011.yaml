revisions:
- from: ഇസ്രായേൽ പാപം ചെയ്തിരിക്കുന്നു. ഞാൻ അവരോടു കല്പിച്ച എന്റെ ഉടമ്പടി അവർ ലംഘിക്കുകയും ചെയ്തിരിക്കുന്നു. നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടവയിൽനിന്ന് അവർ എടുത്തിരിക്കുന്നു[a]; അവർ മോഷ്ടിക്കുകയും വഞ്ചന കാണിക്കുകയും[b] അവ സ്വന്തം സാധനങ്ങളുടെ ഇടയിൽ വെക്കുകയും ചെയ്തിരിക്കുന്നു[c].
  to: ഇസ്രായേൽ പാപം ചെയ്തിരിക്കുന്നു. ഞാൻ അവരോടു കല്പിച്ച എന്റെ ഉടമ്പടിയും അവർ ലംഘിച്ചിരിക്കുന്നു. നശിപ്പിക്കാനായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കളിൽനിന്ന് അവർ എടുത്തിട്ടുമുണ്ട്[a]; അവർ മോഷ്ടിച്ചിട്ടുമുണ്ട്, വഞ്ചിച്ചിട്ടുമുണ്ട്[b], അവ സ്വന്തം വസ്തുവകകൾക്കിടയിൽ വെച്ചിട്ടുമുണ്ട്[c].
  rationale: The revision retains the draft’s meaning and register while restoring the repeated accumulative force of וְגַם, making the final list of charges idiomatic and grammatically parallel, and using ‘വസ്തുക്കൾ’ to specify naturally that the חֵרֶם concerns items. Footnote anchors remain attached to their respective lexical issues.
