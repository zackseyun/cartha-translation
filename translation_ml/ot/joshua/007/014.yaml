source:
  edition: WLC
  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: ml
  text: രാവിലെ നിങ്ങൾ ഗോത്രംതോറും അടുത്തുവരണം. യഹോവ തിരഞ്ഞെടുക്കുന്ന ഗോത്രം വംശംതോറും അടുത്തുവരണം; യഹോവ തിരഞ്ഞെടുക്കുന്ന വംശം കുടുംബംതോറും അടുത്തുവരണം; യഹോവ തിരഞ്ഞെടുക്കുന്ന കുടുംബം പുരുഷൻതോറും അടുത്തുവരണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തിരഞ്ഞെടുക്കുന്ന” എന്നതിന് “പിടിക്കുന്ന” അഥവാ “കൈവശപ്പെടുത്തുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് അത്തരം അർഥങ്ങളുണ്ട്; ഇവിടെ യഹോവ സൂചിപ്പിക്കുന്ന ഗോത്രത്തെയോ വംശത്തെയോ കുടുംബത്തെയോ ആണ് ഉദ്ദേശിക്കുന്നത്, ഒരുപക്ഷേ വിശുദ്ധ ചീട്ടിലൂടെ.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “പുരുഷന്മാരുടെ അടുക്കൽ” എന്നാണ്. ഇവിടെ കുടുംബത്തിലെ പുരുഷന്മാരുടെ ഇടയിൽനിന്ന് ഓരോരുത്തരായി അവസാനമായി വ്യക്തിയെ തിരിച്ചറിയുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: അടുത്തുവരണം
  rationale: קרב എന്ന ആവർത്തിത ക്രിയയുടെ ഔപചാരികമായി മുമ്പാകെ വരുക എന്ന ആശയവും വാക്യത്തിലുടനീളമുള്ള ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: לְשִׁבְטֵיכֶם
  choice: ഗോത്രംതോറും
  rationale: ക്രമാനുസൃതവും വിതരണാത്മകവുമായ ‘by your tribes’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: പിടിക്കുന്ന
  rationale: לכד എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘പിടിക്കുക/കൈവശപ്പെടുത്തുക’ എന്ന ദൃശ്യബലം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ചീട്ടിലൂടെയോ മറ്റൊരു വിശുദ്ധ നിർണയരീതിയിലൂടെയോ യഹോവ സൂചിപ്പിക്കുന്ന ഘടകത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പതിവായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לַמִּשְׁפָּחוֹת
  choice: വംശംതോറും
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനും കുടുംബത്തിനും ഇടയിലുള്ള സാമൂഹിക ഘടകമാണ്; ‘വംശം’ ആ തലവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: לַבָּתִּים
  choice: കുടുംബംതോറും
  rationale: בַּיִת ഇവിടെ കെട്ടിടമല്ല, ഒരേ ഗൃഹനാഥന്റെ കീഴിലുള്ള കുടുംബഘടകമാണ്.
- source_word: לַגְּבָרִים
  choice: പുരുഷൻതോറും
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിന്റെയും ഓരോ വ്യക്തിയിലേക്കും ചുരുക്കുന്ന വിതരണാത്മക പ്രയോഗത്തിന്റെയും ബലം നിലനിർത്തുന്നു.
- source_word: וְהָיָה
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്താതെ നടപടിക്രമത്തിന്റെ തുടർച്ചയിൽ ഉൾപ്പെടുത്തി
  rationale: ഹീബ്രു ഫലസൂചക ഘടന മലയാളത്തിലെ തുടർച്ചയായ നിർദേശവാക്യങ്ങളിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: יִלְכֹּד എന്ന ക്രിയ ദൈവിക തിരഞ്ഞെടുപ്പിനെ എങ്ങനെ സൂചിപ്പിക്കുന്നു
  choice: പിടിക്കുന്ന
  alternative: തിരഞ്ഞെടുക്കുന്ന
  rationale: ‘തിരഞ്ഞെടുക്കുക’ നടപടിക്രമത്തിന്റെ ഉദ്ദേശം വ്യക്തമാക്കുമെങ്കിലും, മൂലക്രിയയിലെ പിടിക്കുക/കൈവശപ്പെടുത്തുക എന്ന ശക്തമായ രൂപകം ഇല്ലാതാക്കും. പ്രധാന പാഠത്തിൽ മൂലരൂപം നിലനിർത്തി സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ഗോത്രം → വംശം → കുടുംബം → പുരുഷൻ എന്ന ക്രമാനുസൃത ചുരുക്കവും ‘അടുത്തുവരണം’ എന്ന ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു. ‘പിടിക്കുന്ന’ എന്ന അസാധാരണമായെങ്കിലും മൂലപാഠസന്നിഹിതമായ പ്രയോഗം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
