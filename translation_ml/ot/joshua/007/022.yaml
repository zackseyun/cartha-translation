id: JOS.7.22
reference: Joshua 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: ml
  text: അപ്പോൾ യോശുവ ദൂതന്മാരെ അയച്ചു; അവർ കൂടാരത്തിലേക്ക് ഓടി. അതാ, അത് അവന്റെ കൂടാരത്തിൽ ഒളിപ്പിച്ചുവെച്ചതായിരുന്നു; വെള്ളി അതിന്റെ അടിയിലായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ שׁלח എന്ന ക്രിയയുടെ സ്വാഭാവികവും കൃത്യവുമായ വിവർത്തനം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഇവിടെ യോശുവ അയച്ച മനുഷ്യദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതന്മാർ’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: וַיָּרֻצוּ
  choice: ഓടി
  rationale: רץ എന്ന ക്രിയയുടെ ദൃശ്യവൈഭവം നിലനിർത്തുന്നു; ‘തിടുക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ ഉറവിടത്തോട് നേരിട്ടു ചേരുന്നു.
- source_word: הָאֹהֱלָה
  choice: കൂടാരത്തിലേക്ക്
  rationale: ദിശാസൂചകമായ ה־യെ ലക്ഷ്യത്തിലേക്കുള്ള ചലനമായി വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ അത് ആഖാന്റെ കൂടാരമാണ്.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കണ്ടെത്തലിന്റെ നാടകീയവും ദൃശ്യസൂചകവുമായ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: טְמוּנָה
  choice: ഒളിപ്പിച്ചുവെച്ചിരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചനരൂപം മുൻവാക്യത്തിലെ വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു; ഭൂമിക്കടിയിൽ കുഴിച്ചിട്ടു എന്ന അധികവിശദീകരണം ചേർക്കാതെ മറച്ചുവെച്ച നില പ്രകടമാക്കുന്നു.
- source_word: בְּאָהֳלוֹ
  choice: അവന്റെ കൂടാരത്തിൽ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള സ്ഥാനസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: וְהַכֶּסֶף
  choice: വെള്ളി
  rationale: וְ എന്ന സംയോജകത്തെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിലൂടെ പ്രകടമാക്കുന്നു; ‘വെള്ളി’ ഇവിടെ പണമായ വെള്ളിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּחְתֶּיהָ
  choice: അതിന്റെ അടിയിൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം മുൻവാക്യത്തിലെ വസ്ത്രത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
