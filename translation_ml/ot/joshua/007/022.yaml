translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ചെറുവാക്യങ്ങൾ ഹീബ്രു വിവരണത്തിന്റെ വേഗവും കണ്ടെത്തലിന്റെ നാടകീയതയും നിലനിർത്തുന്നു. ‘അതാ’ എന്നത് וְהִנֵּהയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു. അവസാനത്തെ ഹീബ്രു ഏകോപനം മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്ര ഉപവാക്യമായി നൽകിയിരിക്കുന്നു.
