revisions:
- from: അപ്പോൾ യോശുവ ദൂതന്മാരെ അയച്ചു. അവർ കൂടാരത്തിലേക്ക് ഓടി. അതാ, അത് അവന്റെ കൂടാരത്തിൽ ഒളിപ്പിച്ചുവെച്ചിരുന്നു; വെള്ളി അതിന്റെ അടിയിലായിരുന്നു.
  to: അപ്പോൾ യോശുവ ദൂതന്മാരെ അയച്ചു; അവർ കൂടാരത്തിലേക്ക് ഓടി. അതാ, അത് അവന്റെ കൂടാരത്തിൽ ഒളിപ്പിച്ചുവെച്ചതായിരുന്നു; വെള്ളി അതിന്റെ അടിയിലായിരുന്നു.
