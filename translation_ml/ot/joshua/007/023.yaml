source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: ml
  text: അവർ അവയെ കൂടാരത്തിനകത്തുനിന്ന് എടുത്ത് യോശുവയുടെയും എല്ലാ ഇസ്രായേൽമക്കളുടെയും അടുക്കൽ കൊണ്ടുവന്നു; യാഹ്‌വേയുടെ സന്നിധിയിൽ അവയെ നിരത്തിവെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിരത്തിവെച്ചു’ എന്നിടത്ത് അക്ഷരാർഥത്തിൽ ‘ഒഴിച്ചിട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ സാധാരണയായി ‘ഒഴിക്കുക’ എന്നാണ് അർഥമാക്കുന്നത്; ഇവിടെ കണ്ടെടുത്ത വസ്തുക്കളെ യാഹ്‌വേയുടെ സന്നിധിയിൽ വെച്ചതിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: അവർ അവയെ എടുത്ത്
  rationale: לקח എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം ‘എടുക്കുക’ എന്നതാണ്; ‘പിടിച്ചെടുക്കുക’ അനാവശ്യമായ ബലപ്രയോഗഭാവം നൽകും.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: കൂടാരത്തിനകത്തുനിന്ന്
  rationale: מִתּוֹךְ സൂചിപ്പിക്കുന്ന അകത്തുനിന്നുള്ള ദിശാസംബന്ധമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיְבִאוּם
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ അടിസ്ഥാനപരമായി ‘കൊണ്ടുവരുക’ എന്നാണ്; ‘സമർപ്പിച്ചു’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആചാരപരമായ ഭാവം ചേർക്കും.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: യോശുവയുടെയും ഇസ്രായേൽമക്കളെല്ലാവരുടെയും അടുക്കൽ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന אֶל എന്നതിന്റെ ലക്ഷ്യസൂചന മലയാളത്തിൽ സംയുക്തമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ജനനാമം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיַּצִּקֻם
  choice: അവയെ നിരത്തിവെച്ചു
  rationale: יצק സാധാരണയായി ‘ഒഴിക്കുക’ എന്നർഥമുള്ളതാണെങ്കിലും ഇവിടെ ദ്രവമല്ല, കൂടാരത്തിൽനിന്ന് കണ്ടെടുത്ത വസ്തുക്കളാണ് കർമം. അവയെ സന്നിധിയിൽ വെക്കുകയോ പ്രദർശിപ്പിക്കുകയോ ചെയ്ത സന്ദർഭാർഥം ‘നിരത്തിവെച്ചു’ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സാന്നിധ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന നാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിച്ചു. ഉച്ചാരണത്തിന്റെ കൃത്യരൂപം പൂർണമായി ഉറപ്പില്ലെങ്കിലും പേരെന്ന സ്വഭാവം നിലനിൽക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്. ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബ-ഉടമ്പടി ഭാഷ നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൂടാരത്തിനകത്തുനിന്ന്’, ‘അടുക്കൽ’, ‘സന്നിധിയിൽ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ സ്ഥലം-ദിശാസൂചനകൾ വ്യക്തമാക്കുന്നു. സെമിറ്റിക് വാക്യഘടന അതേപടി അനുകരിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക സംയോജനം ഉപയോഗിച്ചു.
