  source_fidelity: 'The verse is substantially faithful: it retains the household presentation, the terse male-related procedural phrase with a qualifying note, Achan''s full genealogy, Judahite affiliation, and the passive identification formula. However, the Malayalam wording for the procedural phrase is grammatically and idiomatically weak, and the genealogy is reversed from the Hebrew''s foregrounded identification of Achan.'
