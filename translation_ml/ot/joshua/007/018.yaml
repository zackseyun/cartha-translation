translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളം. നറുക്കിലൂടെ തിരിച്ചറിയുന്ന സന്ദർഭത്തിലെ എബ്രായ ശൈലി ‘പിടിക്കപ്പെട്ടു’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് മൂലപാഠത്തിലെ നടപടിക്രമപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
