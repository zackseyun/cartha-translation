source:
  edition: WLC
  text: וַ/יַּקְרֵ֥ב אֶת בֵּית֖/וֹ לַ/גְּבָרִ֑ים וַ/יִּלָּכֵ֗ד עָכָ֞ן בֶּן כַּרְמִ֧י בֶן זַבְדִּ֛י בֶּן זֶ֖רַח לְ/מַטֵּ֥ה יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ കുടുംബത്തെ പുരുഷൻതോറും മുന്നിൽ വരുത്തി[a]. അപ്പോൾ യെഹൂദാഗോത്രത്തിൽപ്പെട്ട സേരഹിന്റെ മകൻ സബ്ദിയുടെ മകൻ കർമിയുടെ മകനായ ആഖാൻ പിടിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പുരുഷന്മാരനുസരിച്ച്.’ എബ്രായപ്രയോഗം ചുരുക്കമുള്ളതാണ്; നറുക്കെടുപ്പിനായി കുടുംബത്തെ പുരുഷന്മാരുടെ ഉപവിഭാഗങ്ങളായി മുന്നിൽ വരുത്തിയതിനെ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: അടുത്തുകൊണ്ടുവന്നു
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘അടുത്തുകൊണ്ടുവരുക/മുന്നിൽ ഹാജരാക്കുക’ എന്നാണ്. നറുക്കെടുപ്പിനായി മുന്നിലെത്തിക്കുന്ന സന്ദർഭത്തിൽ മൂലരൂപം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: בֵּיתוֹ
  choice: അവന്റെ കുടുംബത്തെ
  rationale: בַּיִת ഇവിടെ കെട്ടിടമല്ല, കുടുംബഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘കുടുംബം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לַגְּבָרִים
  choice: ഓരോ പുരുഷനായി
  rationale: ചുരുക്കമുള്ള എബ്രായപ്രയോഗം കുടുംബത്തിലെ പുരുഷന്മാരെ ഓരോരുത്തരായി മുന്നിലെത്തിച്ചതോ പുരുഷവിഭാഗങ്ങളനുസരിച്ച് ഹാജരാക്കിയതോ സൂചിപ്പിക്കാം. ‘ഓരോ പുരുഷനായി’ നടപടിക്രമപരമായ അർഥം നൽകുകയും പുരുഷലിംഗ ബഹുവചനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיִּלָּכֵד
  choice: പിടിക്കപ്പെട്ടു
  rationale: לכד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിന്റെ അടിസ്ഥാനാർഥം ‘പിടിക്കപ്പെടുക’ എന്നാണ്. ഇവിടെ നറുക്കിലൂടെ തിരിച്ചറിയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി വ്യാഖ്യാനിച്ച് ‘തിരഞ്ഞെടുക്കപ്പെട്ടു’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: עָכָן
  choice: ആഖാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: സേരഹിന്റെ മകൻ സബ്ദിയുടെ മകൻ കർമിയുടെ മകൻ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വംശാവലിക്രമത്തിൽ പൂർവികനിൽനിന്ന് ആഖാനിലേക്കുള്ള ബന്ധം വ്യക്തമായി അവതരിപ്പിക്കുമ്പോഴും മൂലപാഠത്തിലെ മുഴുവൻ വംശപരമ്പരയും സംരക്ഷിക്കുന്നു.
- source_word: לְמַטֵּה יְהוּדָה
  choice: യെഹൂദാഗോത്രത്തിലെ
  rationale: ഗോത്രസന്ദർഭത്തിൽ מַטֶּה എന്നത് ‘ഗോത്രം’ എന്നാണ്; മലയാളത്തിൽ ബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടമാക്കുന്നു.
