  terminology: ‘കുടുംബം,’ ‘ഗോത്രം,’ and ‘പിടിക്കപ്പെട്ടു’ are suitable. The revised genealogy keeps Achan first, as in Hebrew, while using standard Malayalam genitive phrasing.
