  text: וַ/יָּקִ֨ימוּ עָלָ֜י/ו גַּל אֲבָנִ֣ים גָּד֗וֹל עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יָּ֥שָׁב יְהוָ֖ה מֵ/חֲר֣וֹן אַפּ֑/וֹ עַל כֵּ֠ן קָרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ עֵ֣מֶק עָכ֔וֹר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: ml
  text: അവർ അവന്റെമേൽ ഒരു വലിയ കൽക്കൂമ്പാരം കൂട്ടി; അതു ഇന്നുവരെയും അവിടെയുണ്ട്. അപ്പോൾ യഹോവ തന്റെ ജ്വലിക്കുന്ന കോപത്തിൽനിന്ന് പിന്തിരിഞ്ഞു. അതുകൊണ്ട് ആ സ്ഥലത്തെ ഇന്നുവരെയും ആഖോർ താഴ്വര[a] എന്നു വിളിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആഖോർ” എന്ന പേര് ‘ദുരിതം’ അഥവാ ‘കുഴപ്പം’ എന്നർഥമുള്ള എബ്രായ പദത്തോട് ശബ്ദസാദൃശ്യമുള്ളതാണ്; യോശുവ 7:25 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: അവർ അവന്റെമേൽ ഒരു വലിയ കൽക്കൂമ്പാരം കൂട്ടി
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ കല്ലുകൾ കൂട്ടിയുയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൽക്കൂമ്പാരം കൂട്ടി’ എന്നത് പ്രവൃത്തിയെ സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു; עָלָיו എന്നത് ‘അവന്റെമേൽ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: രചയിതാവിന്റെ കാലംവരെ തുടരുന്ന സ്മാരകാവസ്ഥയെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: യഹോവ തന്റെ ജ്വലിക്കുന്ന കോപത്തിൽനിന്ന് പിന്മാറി
  rationale: שׁוב എന്നതിലെ തിരിയുക/പിന്മാറുക എന്ന രൂപകം നിലനിർത്തുകയും חֲרוֹן אַף എന്ന ‘കത്തുന്ന കോപം’ എന്ന ദൃശ്യഭാഷയെ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: സ്ഥലനാമത്തിനുള്ള കാരണവിവരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക ബന്ധം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്തിന് ... എന്നു പേരായിരിക്കുന്നു
  rationale: പേരിടൽ സൂത്രവാക്യത്തിലെ അജ്ഞാത ഏകവചന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ഫലാവസ്ഥയായി അവതരിപ്പിക്കുന്നു; ‘ഇന്നുവരെയും’ എന്നതോടൊപ്പം തുടരുന്ന പേരിനെ വ്യക്തമാക്കുന്നു.
- source_word: עֵמֶק עָכוֹר
  choice: ആഖോർ താഴ്വര
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്തി അർത്ഥം മാത്രം നൽകാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; עכר എന്ന ‘കുഴപ്പം/ദുരിതം വരുത്തുക’ എന്ന പദവുമായുള്ള ശബ്ദബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: מֵחֲרוֹן אַפּוֹ എന്ന ദൈവകോപപ്രയോഗം
  choice: തന്റെ ജ്വലിക്കുന്ന കോപത്തിൽനിന്ന് പിന്മാറി
  alternative: തന്റെ ഉഗ്രകോപം ശമിപ്പിച്ചു
  rationale: മൂലത്തിലെ ‘തിരിയുക/പിന്മാറുക’ എന്നും ‘കത്തുന്ന കോപം’ എന്നും ഉള്ള രൂപകങ്ങൾ മൃദൂകരിക്കാതെയും ദൈവിക വികാരത്തെ വ്യവസ്ഥാപിതമായി വിശദീകരിക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ആദ്യത്തെ ‘ഇന്നുവരെയും’ കൽക്കൂമ്പാരത്തിന്റെ തുടർച്ചയെയാണ് സൂചിപ്പിക്കുന്നത് എന്ന അർത്ഥം മലയാളത്തിൽ അസ്പഷ്ടമാകാതിരിക്കാൻ ‘അത് ഇന്നുവരെയും അവിടെയുണ്ട്’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു. ദൈവനാമത്തിന് മലയാളസഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
