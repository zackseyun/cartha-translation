  source_fidelity: 'മുഖ്യഅർഥം നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്: חֵרֶם-നോടുള്ള ബന്ധം, കുറ്റക്കാരനും അവനുള്ള സകലവും ഉൾപ്പെടുന്ന ശിക്ഷ, യഹ്‌വേയുടെ ഉടമ്പടി ലംഘനം, ഇസ്രായേലിൽ നടന്ന നിന്ദ്യമായ പ്രവൃത്തി എന്നിവ വ്യക്തമാണ്. എന്നാൽ יִשָּׂרֵף എന്ന നിഷ്ക്രിയ ശിക്ഷാവിധിയെ ‘ചുട്ടുകളയണം’ എന്ന സകർമക/കർതൃസൂചനയുള്ള രൂപം അല്പം മങ്ങിക്കുന്നു. നിഷ്ക്രിയമായ നിയമവിധിരൂപം ഉപയോഗിക്കുന്നത് കൂടുതൽ യോജ്യം.'
  naturalness: ‘നിരോധിതമായി സമർപ്പിച്ച വസ്തുവുമായി’ എന്ന രൂപം ‘വസ്തുവോടുകൂടെ’ എന്നതിനെക്കാൾ ആധുനിക നിലവാരമലയാളത്തിൽ ഒതുക്കമുള്ളതാണ്. ‘...ലംഘിച്ചതിനാലും ...ചെയ്തതിനാലും’ എന്ന സമാന്തര കാരണപ്രയോഗം എബ്രായത്തിലെ ഇരട്ട כִּי-യെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
  terminology: ‘യഹ്‌വേ,’ ‘ഉടമ്പടി,’ ‘നിന്ദ്യമായ പ്രവൃത്തി’ എന്നിവ അനുയോജ്യമാണ്. חֵרֶם-ന്റെ മുഖ്യവിവർത്തനവും അടിക്കുറിപ്പിലെ പരമ്പരാഗത ബദലും ഉറവിടത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
  issues:
  - severity: medium
    issue: യִשָּׂרֵף-ന്റെ നിഷ്ക്രിയത
    rationale: ‘തീയിൽ ചുട്ടുകളയണം’ സാധാരണയായി ആരോ ചുട്ടുകളയണം എന്ന സകർമക ഭാവം ഉണർത്താം. എബ്രായ നിഫാൽ രൂപം ശിക്ഷിക്കപ്പെടുന്നവന്റെ നിഷ്ക്രിയാവസ്ഥയെ മുൻനിറുത്തുന്നു; ‘തീയിൽ ദഹിപ്പിക്കപ്പെടണം’ അത് വ്യക്തമായി നൽകുന്നു.
  - severity: low
    issue: ഇരട്ട കാരണസൂചനയുടെ അവതരണം
    rationale: എബ്രായത്തിൽ כִּי ... וְכִי ... എന്നിങ്ങനെ രണ്ടു കാരണങ്ങൾ സമാന്തരമായി വരുന്നു. ‘ലംഘിച്ചതിനാലും ... ചെയ്തതിനാലും’ എന്നു നൽകുമ്പോൾ ഈ ഘടന കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാകും.
  revised_text: നിരോധിതമായി സമർപ്പിച്ച വസ്തുവുമായി പിടിക്കപ്പെടുന്നവൻ തീയിൽ ദഹിപ്പിക്കപ്പെടണം[a]—അവനും അവനുള്ള സകലവും. അവൻ യഹ്‌വേയുടെ ഉടമ്പടി ലംഘിച്ചതിനാലും ഇസ്രായേലിൽ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്തതിനാലുമാണ് അത്.
  revised_footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘ശപിക്കപ്പെട്ട വസ്തു.’ എബ്രായത്തിലെ חֵרֶם (ഖേരെം) സാധാരണ ഉപയോഗത്തിൽനിന്ന് നിരോധിച്ച് ദൈവത്തിനായി മാറ്റിവെച്ചതും ഈ സന്ദർഭത്തിൽ നശിപ്പിക്കപ്പെടേണ്ടതുമായ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  revision_rationale: നിഷ്ക്രിയ ശിക്ഷാവിധി വ്യക്തമായി നിലനിർത്തുന്നതിനും, രണ്ടു കാരണവാക്യങ്ങളുടെ സമാന്തരത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നതിനുമായി ചെറിയ തിരുത്തലുകൾ വരുത്തി. ‘അവനും അവനുള്ള സകലവും’ എന്ന പ്രയോഗം ഉറവിടത്തിലെ വ്യക്തിയെയും അവനോടു ബന്ധപ്പെട്ട സകലത്തെയും ഉൾക്കൊള്ളുന്ന, എന്നാൽ കൂടുതൽ വിശദീകരിക്കാത്ത വ്യാപ്തി നിലനിർത്തുന്നു.
