source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: ml
  text: നിരോധിതമായി സമർപ്പിച്ച വസ്തുവുമായി പിടിക്കപ്പെടുന്നവൻ തീയിൽ ദഹിപ്പിക്കപ്പെടണം[a]—അവനും അവനുള്ള സകലവും. അവൻ യഹ്‌വേയുടെ ഉടമ്പടി ലംഘിച്ചതിനാലും ഇസ്രായേലിൽ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്തതിനാലുമാണ് അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘ശപിക്കപ്പെട്ട വസ്തു.’ എബ്രായത്തിലെ חֵרֶם (ഖേരെം) സാധാരണ ഉപയോഗത്തിൽനിന്ന് നിരോധിച്ച് ദൈവത്തിനായി മാറ്റിവെച്ചതും ഈ സന്ദർഭത്തിൽ നശിപ്പിക്കപ്പെടേണ്ടതുമായ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: പിടിക്കപ്പെടുന്നവൻ
  rationale: לכד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം; ഇവിടെ യുദ്ധത്തിൽ പിടിക്കപ്പെടുന്നതല്ല, ചീട്ടിടൽ മുഖേന കുറ്റക്കാരനായി തിരിച്ചറിയപ്പെടുന്നതാണ് സൂചന. ‘പിടിക്കപ്പെടുന്നവൻ’ ഈ ന്യായവിധിസന്ദർഭത്തിലെ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בַּחֵרֶם
  choice: നിരോധിതമായി സമർപ്പിച്ച വസ്തുവോടുകൂടെ
  rationale: חֵרֶם സാധാരണ ഉപയോഗത്തിൽനിന്ന് മാറ്റിവെച്ച് ദൈവത്തിനായി സമർപ്പിക്കപ്പെട്ടതും പലപ്പോഴും നശിപ്പിക്കപ്പെടേണ്ടതുമായ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘ശപിക്കപ്പെട്ട വസ്തു’ എന്നു മാത്രം പറഞ്ഞാൽ സമർപ്പണത്തിന്റെ ആശയം നഷ്ടപ്പെടാം; അതിനാൽ നിരോധനവും സമർപ്പണവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: തീയിൽ ചുട്ടുകളയണം
  rationale: നിഫാൽ അപൂർണ്ണക്രിയയും അഗ്നിയെ സൂചിപ്പിക്കുന്ന പദബന്ധവും ചേർന്ന ശക്തമായ ശിക്ഷാവിധി. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: അവനെയും അവനുള്ള സകലത്തെയും
  rationale: കുറ്റക്കാരനും അവനുള്ള എല്ലാം വിധിയിൽ ഉൾപ്പെടുന്നതായി അനുബന്ധവാക്യം വ്യക്തമാക്കുന്നു. ‘അവനുള്ള സകലവും’ ഉടമസ്ഥതയുടെ വ്യാപ്തി നിലനിർത്തുന്നു; സന്ദർഭം വ്യക്തമാക്കാത്ത വിഭാഗങ്ങളെ പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: യഹ്‌വേയുടെ ഉടമ്പടി ലംഘിച്ചു
  rationale: ഉടമ്പടിയുടെ അതിരുകൾ മറികടക്കുകയോ അതിനെ ലംഘിക്കുകയോ ചെയ്യുന്നതാണ് עבר ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ലംഘിച്ചു’ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാരം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സാധാരണമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: נְבָלָה
  choice: നിന്ദ്യമായ പ്രവൃത്തി
  rationale: ഇത് ബുദ്ധിഹീനതയെക്കാൾ ധാർമികമായി ഹീനവും സമൂഹത്തെ ഞെട്ടിക്കുന്നതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘നിന്ദ്യമായ പ്രവൃത്തി’ ആ ധാർമിക ഗൗരവം വ്യക്തമായി പകരുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: കുറ്റം ഉടമ്പടിസമൂഹത്തിനുള്ളിൽ നടന്നുവെന്ന സ്ഥാനസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉടമ്പടിന്യായവിധിയുടെ സന്ദർഭത്തിൽ חֵרֶם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നിരോധിതമായി സമർപ്പിച്ച വസ്തു
  alternative: ശപിക്കപ്പെട്ട വസ്തു; നശിപ്പിക്കാനായി സമർപ്പിച്ച വസ്തു; നിരോധനത്തിൻ കീഴിലുള്ളത്
  rationale: ഈ പദം ദൈവത്തിനായി മാറ്റിവെക്കപ്പെട്ടതിനാൽ സാധാരണ ഉപയോഗത്തിൽനിന്ന് നിരോധിക്കപ്പെട്ടതും ഈ സന്ദർഭത്തിൽ നാശത്തിനായി വിധിക്കപ്പെട്ടതുമായ വസ്തുവിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം സമർപ്പണവും നിരോധനവും കാത്തുസൂക്ഷിക്കുന്നു; പരമ്പരാഗതമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ അവതരിപ്പിക്കുന്നു.
- issue: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ എന്നതിന്റെ വ്യാപ്തി
  choice: അവനെയും അവനുള്ള സകലത്തെയും
  alternative: അവനെയും അവന്റെ വസ്തുവകകളെയും; അവനെയും അവന്റെ കുടുംബത്തെയും സകലത്തെയും
  rationale: എബ്രായവാക്യം വ്യാപകമാണെങ്കിലും ആരെയെല്ലാം അല്ലെങ്കിൽ എന്തെല്ലാം ഉൾക്കൊള്ളുന്നു എന്നു ഇവിടെ പട്ടികപ്പെടുത്തുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ വ്യാപ്തിയും അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ന്യായവിധിശൈലി. ദീർഘമായ ആദ്യവാക്യം വായനാസൗകര്യത്തിനായി ഡാഷും തുടർന്ന് കാരണവാക്യവും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി. പരമ്പരാഗത മതപദങ്ങളുടെ അനാവശ്യ സാന്ദ്രത ഒഴിവാക്കി; എന്നാൽ ‘ഉടമ്പടി,’ ‘യഹ്‌വേ’ തുടങ്ങിയ ഉറവിടപ്രധാന പദങ്ങൾ നിലനിർത്തി.
