  to: നിരോധിതമായി സമർപ്പിച്ച വസ്തുവുമായി പിടിക്കപ്പെടുന്നവൻ തീയിൽ ദഹിപ്പിക്കപ്പെടണം[a]—അവനും അവനുള്ള സകലവും. അവൻ യഹ്‌വേയുടെ ഉടമ്പടി ലംഘിച്ചതിനാലും ഇസ്രായേലിൽ നിന്ദ്യമായ പ്രവൃത്തി ചെയ്തതിനാലുമാണ് അത്.
