reference: Joshua 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קְצֵ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יַּעַבְר֥וּ הַ/שֹּׁטְרִ֖ים בְּ/קֶ֥רֶב הַֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/002.yaml
  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: ml
  text: മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ, ഉദ്യോഗസ്ഥർ പാളയത്തിന്റെ നടുവിലൂടെ കടന്നുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയത്തിനുള്ളിലൂടെ പോയി.”
    reason: עבר എന്ന ക്രിയയും בְּקֶרֶב എന്ന സ്ഥാനപ്രയോഗവും ചേർന്നതിന്റെ കൂടുതൽ ലളിതമായ പരിഭാഷ.
lexical_decisions:
- source_word: וַיְהִי
  choice: …പ്പോൾ
  rationale: ഇവിടെ היהയുടെ വിവരണാത്മക രൂപം അടുത്ത സംഭവത്തിലേക്കുള്ള കാലസൂചന നൽകുന്നു. പഴയ ശൈലിയിലുള്ള ‘സംഭവിച്ചു’ എന്ന പ്രയോഗത്തേക്കാൾ, കാലവാക്യവുമായി ചേർന്ന ‘…പ്പോൾ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מִקְצֵה
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: מן + קצה എന്ന ഘടന മൂന്നു ദിവസത്തിന്റെ അറ്റത്തെയോ പൂർത്തിയെയോ സൂചിപ്പിക്കുന്നു. ‘മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ’ എന്നത് ഈ സമയബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസം
  rationale: സംഖ്യയും കാലനാമവും ചേർന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: וַיַּעַבְרוּ
  choice: കടന്നുപോയി
  rationale: עברയ്ക്ക് ‘കടന്നുപോകുക/അതിലൂടെ പോകുക’ എന്ന അർഥമുണ്ട്. ഇവിടെ നദിയോ അതിരോ കടക്കുന്നതല്ല, പാളയത്തിനുള്ളിലൂടെയുള്ള സഞ്ചാരമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: הַשֹּׁטְרִים
  choice: ഉദ്യോഗസ്ഥർ
  rationale: שֹׁטְרִים നിർദേശങ്ങൾ അറിയിക്കുകയും നടപ്പാക്കുകയും ചെയ്യുന്ന നിയമിത അധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉദ്യോഗസ്ഥർ’ എന്നത് ഭരണപരവും സൈനികവുമായ ഈ സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ പദമാണ്.
- source_word: בְּקֶרֶב
  choice: നടുവിലൂടെ
  rationale: קרב എന്നത് ‘മധ്യം, ഉൾഭാഗം’ എന്നാണ്. ചലനക്രിയയോടൊപ്പം വന്നതിനാൽ പാളയത്തിന്റെ ഉൾഭാഗത്തിലൂടെയുള്ള നീക്കം ‘നടുവിലൂടെ’ വ്യക്തമാക്കുന്നു.
- source_word: הַמַּחֲנֶה
  choice: പാളയം
  rationale: ഇവിടെ מחנה ഇസ്രായേലിന്റെ താവളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാളയം’ സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ പരിഭാഷയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഹീബ്രു വാക്യത്തിലെ കാലബന്ധവും പാളയത്തിന്റെ ഉൾഭാഗത്തിലൂടെയുള്ള ഉദ്യോഗസ്ഥരുടെ നീക്കവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുചിഹ്നം ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തോടാണ് ഇവിടെ ചേർത്തിരിക്കുന്നത്.
