  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. പുരാതന പശ്ചാത്തലം നിലനിർത്താൻ ‘ഉടമ്പടിയുടെ പെട്ടകം’, ‘പുരോഹിതന്മാർ’, ‘കല്പിക്കുക’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും അനാവശ്യമായി പുരാതനമോ വിഭാഗീയമോ ആയ ഭാഷ ഒഴിവാക്കി.
