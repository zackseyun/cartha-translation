  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: ml
  text: 'ഉടമ്പടിയുടെ പെട്ടകം ചുമക്കുന്ന പുരോഹിതന്മാരോട് നീ ഇങ്ങനെ കല്പിക്കണം: “നിങ്ങൾ യോർദ്ദാനിലെ വെള്ളത്തിന്റെ അരികിൽ[a] എത്തുമ്പോൾ, യോർദ്ദാനിൽ നിൽക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യോർദ്ദാനിലെ വെള്ളത്തിന്റെ വക്കുവരെ.”
    reason: קְצֵה എന്ന പദത്തിന്റെയും עַד ചേർന്ന പ്രയോഗത്തിന്റെയും ‘അരിക്’/‘വക്കുവരെ’ എന്ന സാധുവായ പദപ്രയോഗവ്യത്യാസം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וְאַתָּה
  choice: നീ
  rationale: സ്വതന്ത്ര സർവനാമം യോശുവയ്ക്കുള്ള ഊന്നൽ നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിലെ സ്വാഭാവിക തുടർച്ചയിൽ പ്രത്യേകം ‘എന്നാൽ/പിന്നെ’ എന്നു ചേർക്കാതെ പ്രകടമാകുന്നു.
- source_word: תְּצַוֶּה
  choice: കല്പിക്കണം
  rationale: പീയേൽ അപൂർണക്രിയ ഇവിടെ യോശുവയ്ക്കു നൽകുന്ന നിർദേശമാണ്; ‘കല്പിക്കണം’ അതിന്റെ ആജ്ഞാത്മക ബലവും ഗൗരവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: ചുമക്കുന്ന പുരോഹിതന്മാരോട്
  rationale: נֹשְׂאֵי എന്ന ബഹുവചന കർത്തൃവാചക കൃദന്തത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഹീബ്രായ സംയുക്തപദബന്ധം നേരിട്ട് നിലനിർത്തുകയും ‘ഉടമ്പടി’ എന്ന ദൈവശാസ്ത്രപരമായ ആശയം അനാവശ്യ വിശദീകരണമില്ലാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: כְּבֹאֲכֶם
  choice: നിങ്ങൾ … എത്തുമ്പോൾ
  rationale: כְּ സഹിതമായ infinitive construct-ന്റെ കാലസൂചനയും ബഹുവചന അഭിസംബോധനയും വ്യക്തമായി നൽകുന്നു.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: യോർദ്ദാനിലെ വെള്ളത്തിന്റെ അരികിൽ
  rationale: קָצֶה എന്നതിന്റെ ‘അരിക്/അറ്റം’ എന്ന സ്ഥലംസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; עַד സൂചിപ്പിക്കുന്ന അതിരുവരെ എത്തുക എന്ന ആശയം ‘എത്തുമ്പോൾ’ എന്ന ക്രിയയോടൊപ്പം പ്രകടമാകുന്നു.
- source_word: בַּיַּרְדֵּן
  choice: യോർദ്ദാനിൽത്തന്നെ
  rationale: בְּ എന്ന സ്ഥലസൂചകത്തെ ‘യോർദ്ദാനിൽ’ എന്നു നേരിട്ട് നൽകുന്നു; മുമ്പുള്ള അരികുമായി ആശയക്കുഴപ്പം ഒഴിവാക്കി നദിക്കുള്ളിൽ നിൽക്കണമെന്ന നിർദേശം വ്യക്തമാക്കാൻ ‘ത്തന്നെ’ ചേർത്തിരിക്കുന്നു.
- source_word: תַּעֲמֹדוּ
  choice: നിൽക്കണം
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നിൽക്കുക’യും ഇവിടെ ഉള്ള നിർദേശബലവും സംരക്ഷിക്കുന്നു.
