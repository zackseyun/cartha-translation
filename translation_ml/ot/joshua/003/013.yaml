reference: Joshua 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: ml
  text: യഹോവയുടെ[a] പെട്ടകം വഹിക്കുന്ന പുരോഹിതന്മാരുടെ കാൽപ്പാദങ്ങളുടെ അടിഭാഗങ്ങൾ യോർദ്ദാനിലെ വെള്ളത്തിൽ തൊട്ടുനിൽക്കുമ്പോൾ, സർവഭൂമിയുടെയും കർത്താവായ യഹോവയുടെ പെട്ടകം വഹിക്കുന്ന അവരുടെ മുമ്പിൽ, യോർദ്ദാനിലെ മുകളിൽനിന്ന് ഒഴുകിവരുന്ന വെള്ളം നിലച്ചുപോകും; അത് ഒറ്റ കൂമ്പാരമായി നിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സർവഭൂമിയുടെയും കർത്താവിന്റെ പെട്ടകം.” ‘സർവഭൂമിയുടെയും കർത്താവ്’ എന്ന പദസമുച്ചയം ‘പെട്ടകം’ എന്നതിനോട് അടുത്ത് ബന്ധിപ്പിച്ചും ഹീബ്രു വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: തൊട്ടുനിൽക്കുമ്പോൾ
  rationale: നוח എന്ന ക്രിയയിലെ ‘വിശ്രമിക്കുക/നിലയുറപ്പിക്കുക’ എന്ന അർഥവും כְּയുടെ കാലസൂചനയും സ്വാഭാവികമായി നൽകുന്നു; വെള്ളവുമായി കാലുകൾ സമ്പർക്കത്തിലായി നിൽക്കുന്ന പ്രവൃത്തി സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּפּוֹת רַגְלֵי
  choice: കാൽപ്പാദങ്ങൾ
  rationale: കാൽപ്പാദത്തിന്റെ അടിഭാഗം എന്ന കൃത്യമായ ആശയം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: പെട്ടകം വഹിക്കുന്ന പുരോഹിതന്മാർ
  rationale: നשא എന്ന വർത്തമാനകൃതന്തത്തിന്റെ തുടർച്ചയായ വഹിക്കൽ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: സർവഭൂമിയുടെയും കർത്താവ്
  rationale: אדון എന്ന അധികാര-കർത്തൃത്വ പദവിയും כל הארץ എന്ന സർവവ്യാപക പരിധിയും നിലനിർത്തുന്നു.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: യോർദ്ദാനിലെ വെള്ളത്തിൽ
  rationale: בְּയുടെ സ്ഥല/സമ്പർക്ക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יִכָּרֵתוּן
  choice: നിലച്ചുപോകും
  rationale: നദീജലത്തിന്റെ ഒഴുക്ക് ‘മുറിച്ചുനിർത്തപ്പെടും’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥമായ ‘ഛേദിക്കപ്പെടും’ ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: മുകളിൽനിന്ന് ഒഴുകിവരുന്ന വെള്ളം
  rationale: യֹרְדִים എന്ന താഴേക്കുള്ള ചലനവും നദീസന്ദർഭത്തിലെ മേലൊഴുക്ക്/ഉപരിഭാഗം എന്ന സാധ്യതയും അമിതമായി വ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: അത് ഒറ്റ കൂമ്പാരമായി നിൽക്കും
  rationale: נֵד എന്ന കൂമ്പാരം/കെട്ടിനിൽക്കുന്ന ജലരാശി എന്ന ദൃശ്യരൂപവും אֶחָד എന്ന ഏകത്വവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ സൂക്ഷിക്കുന്നു; ‘കർത്താവ്’ എന്നത് വേറിട്ട אֲדוֹן എന്ന പദത്തിനായി നിലനിർത്തുന്നു.
- issue: ‘സർവഭൂമിയുടെയും കർത്താവ്’ എന്നതിന്റെ വ്യാകരണബന്ധം
  choice: യഹോവയെ വിശദീകരിക്കുന്ന സമാനാധികരണ പദവി
  alternative: ‘സർവഭൂമിയുടെയും കർത്താവിന്റെ പെട്ടകം’ എന്ന് പെട്ടകത്തോട് അടുത്ത് ബന്ധിപ്പിക്കൽ
  rationale: ഹീബ്രു പദക്രമം രണ്ടുവായനകൾക്കും ഇടനൽകുന്നു. മുഖ്യപാഠം യഹോവയെ ‘സർവഭൂമിയുടെയും കർത്താവ്’ എന്നു തിരിച്ചറിയുന്ന വായന സ്വീകരിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പെട്ടകം’, ‘പുരോഹിതന്മാർ’, ‘സർവഭൂമി’ എന്നീ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച പദങ്ങൾ നിലനിർത്തി. ഹീബ്രുവിലെ ബന്ധസന്ദിഗ്ധത [a]-യിൽയും ‘മുകളിൽ/മേലൊഴുക്ക്’ എന്ന അർഥവ്യാപ്തി [b]-യിൽയും സംരക്ഷിച്ചു.
