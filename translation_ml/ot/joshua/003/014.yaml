  source_fidelity: The temporal setting, departure from the tents, purpose of crossing the Jordan, and the priests’ position ahead of the people are conveyed accurately. However, "ചുമന്ന" can read as a completed/past action, whereas נֹשְׂאֵי is a participle describing the priests as carrying the ark at that time. "വഹിച്ചുകൊണ്ടിരുന്ന" better preserves the ongoing attendant action.
