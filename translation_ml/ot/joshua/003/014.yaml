source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: ml
  text: ജനം യോർദ്ദാൻ കടക്കാനായി തങ്ങളുടെ കൂടാരങ്ങളിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ, ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ചുകൊണ്ടിരുന്ന പുരോഹിതന്മാർ ജനത്തിനു മുന്നിലുണ്ടായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനത്തിനു മുമ്പിലുണ്ടായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: —പ്പോൾ … ആയിരുന്നു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവാരംഭസൂചകമായ וַיְהִיയെ മലയാളത്തിൽ കൃത്രിമമായ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു വേർതിരിക്കാതെ കാലവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּנְסֹעַ הָעָם
  choice: ജനം … പുറപ്പെട്ടപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു; נסע ഇവിടെ പാളയം വിട്ടു യാത്ര പുറപ്പെടുന്നതാണ്.
- source_word: מֵאָהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങളിൽനിന്ന്
  rationale: אֹהֶל എന്നതിന്റെ മൂർത്തമായ അർഥമായ ‘കൂടാരം’ നിലനിർത്തുന്നു; പ്രത്യയം ജനത്തെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടക്കാനായി
  rationale: לְ ചേർന്ന infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; നദി കടക്കുന്നതിന് മലയാളത്തിൽ ‘കടക്കുക’ സ്വാഭാവികമാണ്.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: … ചുമന്ന പുരോഹിതന്മാർ
  rationale: ‘പുരോഹിതന്മാർ, വഹിക്കുന്നവർ’ എന്ന ഹീബ്രു നാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധകക്രിയാവിശേഷണ ഘടനയാക്കി, പുരോഹിതന്മാരെ സ്വതന്ത്ര കർത്താവായി നിലനിർത്തുന്നു.
- source_word: אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ആരാധനാസംബന്ധമായ אֲרוֹן എന്നതിന് സ്ഥാപിതമായ ‘പെട്ടകം’യും בְּרִית എന്നതിന് ബൈബിൾസന്ദർഭത്തിലെ ‘ഉടമ്പടി’യും ഉപയോഗിക്കുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിനു മുമ്പിലായിരുന്നു
  rationale: ജനത്തോടുള്ള സ്ഥലപരമായ മുൻനില നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘ജനത്തെക്കാൾ മുന്നിലായിരുന്നു’ എന്നതും സാധുവായ വ്യാഖ്യാനമാണ്.
