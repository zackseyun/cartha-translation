translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഹീബ്രുവിലെ ദീർഘവാക്യഘടന വായനാസൗകര്യത്തിന് സ്വാഭാവിക കാലവാക്യമായി നൽകിയിരിക്കുന്നു; അടുത്ത വാക്യത്തിലേക്കുള്ള ആഖ്യാനബന്ധം നിലനിൽക്കുന്നു.
