source:
  edition: WLC
  text: וְ/עַתָּ֗ה קְח֤וּ לָ/כֶם֙ שְׁנֵ֣י עָשָׂ֣ר אִ֔ישׁ מִ/שִּׁבְטֵ֖י יִשְׂרָאֵ֑ל אִישׁ אֶחָ֥ד אִישׁ אֶחָ֖ד לַ/שָּֽׁבֶט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: ml
  text: ഇപ്പോൾ ഇസ്രായേൽ ഗോത്രങ്ങളിൽനിന്ന് നിങ്ങൾക്കായി പന്ത്രണ്ടു പുരുഷന്മാരെ എടുക്കുക—ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോരുത്തനെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരു പുരുഷൻ, ഒരു പുരുഷൻ വീതം ഗോത്രത്തിന്”; ഓരോ ഗോത്രത്തിൽനിന്നും ഒരു പ്രതിനിധി എന്നർഥമുള്ള വിതരണപ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന നിർദേശത്തിലേക്കുള്ള പ്രഭാഷണപരമായ മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ വ് ബന്ധകത്തെ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: קְחוּ לָכֶם
  choice: നിങ്ങൾക്കായി ... എടുക്കുക
  rationale: ബഹുവചന ആജ്ഞയും לָכֶם എന്ന ഗുണഭോക്തൃ/ദാതൃസൂചനയും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ തിരഞ്ഞെടുക്കുക എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, അടിസ്ഥാന ക്രിയയുടെ ‘എടുക്കുക’ എന്ന രൂപം സംരക്ഷിക്കുന്നു.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: പന്ത്രണ്ടു പുരുഷന്മാരെ
  rationale: ഓരോ ഗോത്രത്തെയും പ്രതിനിധീകരിക്കുന്ന പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് אִישׁ ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ഗോത്രങ്ങളിൽനിന്ന്
  rationale: ആളുകളെ എടുക്കേണ്ട ഉറവിടം/കൂട്ടം എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോരുത്തനെ
  rationale: ഹീബ്രുവിലെ ആവർത്തനാത്മക വിതരണപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മുൻപേ ‘പുരുഷന്മാർ’ എന്നു വ്യക്തമാക്കിയതിനാൽ ‘ഓരോരുത്തൻ’ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
