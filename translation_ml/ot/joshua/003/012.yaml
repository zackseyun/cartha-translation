translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, മാന്യമായ മലയാളം. ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവവും ഹീബ്രു വിതരണപ്രയോഗത്തിന്റെ ഊന്നലും നിലനിർത്താൻ ഡാഷും അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
