id: JOS.3.7
reference: Joshua 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: ml
  text: 'യാഹ്‌വെ യോശുവയോടു പറഞ്ഞു: “ഇന്ന് ഞാൻ സകല ഇസ്രായേലിന്റെയും ദൃഷ്ടിയിൽ നിന്നെ മഹാനാക്കിത്തുടങ്ങും; ഞാൻ മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കുമെന്ന് അവർ അറിയേണ്ടതിന്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപത്തിന് സ്വാഭാവികമായ മലയാള ഭൂതകാലപ്രയോഗം.
- source_word: הַיּוֹם הַזֶּה
  choice: ഇന്ന്
  rationale: അക്ഷരാർഥമായ ‘ഈ ദിവസം’ എന്നതിന്റെ കാലസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
- source_word: אָחֵל
  choice: തുടങ്ങും
  rationale: ഇവിടെയുള്ള ഹിഫീൽ രൂപം ‘ആരംഭിക്കുക’ എന്നാണ്; ദൈവിക പ്രഖ്യാപനത്തിന്റെ സമീപഭാവി അർഥം പ്രകടമാക്കുന്നു.
- source_word: גַּדֶּלְךָ
  choice: നിന്നെ മഹാനാക്കാൻ
  rationale: പീയേൽ രൂപത്തിന്റെ ‘മഹാനാക്കുക/ഉയർത്തുക’ എന്ന കാരകാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: സകല ഇസ്രായേലിന്റെയും ദൃഷ്ടിയിൽ
  rationale: പൊതുജനങ്ങളുടെ കാഴ്ചപ്പാടിലും അംഗീകാരത്തിലും എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: അങ്ങനെ ... അവർ അറിയും
  rationale: ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള ഹീബ്രു ബന്ധത്തിലെ ചെറിയ തുറന്നത്വം നിലനിർത്തുന്ന മലയാള ഘടന.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: ഞാൻ മോശെയോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ
  rationale: മോശെയോടും യോശുവയോടുമുള്ള ദൈവസാന്നിധ്യത്തിന്റെ വ്യക്തമായ താരതമ്യം സംരക്ഷിക്കുന്നു.
- source_word: אֶהְיֶה עִמָּךְ
  choice: നിന്നോടുകൂടെയും ഉണ്ടായിരിക്കും
  rationale: ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഭാവിവാഗ്ദാനം നേരിട്ട് പ്രകടമാക്കുന്നു; ‘-യും’ താരതമ്യസമാന്തരത ഉറപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിൽ നിലനിർത്തി.
- issue: യോശുവയെ ‘മഹാനാക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: സകല ഇസ്രായേലിന്റെയും ദൃഷ്ടിയിൽ നിന്നെ മഹാനാക്കുക
  alternative: നിന്നെ ഉയർത്തുക; നിനക്കു മഹത്ത്വം നൽകുക
  rationale: വാക്യം യോശുവയുടെ അന്തർലീന മഹത്വത്തെക്കുറിച്ചല്ല, ഇസ്രായേലിന്റെ മുമ്പാകെയുള്ള അവന്റെ പൊതുസ്ഥാനവും അംഗീകാരവും ഉയർത്തുന്നതിനെക്കുറിച്ചാണ്; അതുകൊണ്ട് മൂലത്തിലെ കാരകാർഥവും പൊതുദൃശ്യപരതയും നിലനിർത്തി.
- issue: אֲשֶׁר ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യ/ഫല ബന്ധം
  choice: അങ്ങനെ ... അവർ അറിയും
  alternative: അവർ അറിയേണ്ടതിന്
  rationale: ഹീബ്രു ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. ‘അങ്ങനെ’ രണ്ടിന്റെയും ഭാവം അനുവദിക്കുന്നതിനാൽ അനാവശ്യമായി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു ആഖ്യാനത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തി; അതേസമയം ‘ദൃഷ്ടിയിൽ’, ‘-ഓടുകൂടെ’ തുടങ്ങിയ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഔപചാരിക പദങ്ങൾ മിതമായി ഉപയോഗിച്ചു.
