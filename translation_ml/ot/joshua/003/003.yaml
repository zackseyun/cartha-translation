id: JOS.3.3
reference: Joshua 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: ml
  text: 'അവർ ജനത്തോട് ഇങ്ങനെ കല്പിച്ചു: “നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം ലേവ്യരായ പുരോഹിതന്മാർ[a] വഹിക്കുന്നതു നിങ്ങൾ കാണുമ്പോൾ, നിങ്ങളുടെ സ്ഥലത്തുനിന്ന് പുറപ്പെട്ട് അതിന്റെ പിന്നാലെ പോകണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരോഹിതന്മാർ—ലേവ്യർ.”
    reason: הַכֹּהֲנִים הַלְוִיִּם എന്ന ഹീബ്രു പ്രയോഗം വിശേഷണപരമായോ നാമസമാനാധികരണമായോ അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְצַוּוּ אֶת־הָעָם לֵאמֹר
  choice: അവർ ജനത്തോട് ഇങ്ങനെ കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ ആധികാരികമായ കല്പനാഭാവം ‘കല്പിച്ചു’ നിലനിർത്തുന്നു; לֵאמֹר മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇങ്ങനെ’ എന്ന നേരിട്ടുള്ള വാക്കുകളുടെ ആമുഖത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: כִּרְאוֹתְכֶם
  choice: നിങ്ങൾ കാണുമ്പോൾ
  rationale: כ + infinitive construct ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; ഉടനടിത്തം അധികമായി ചേർക്കാതെ സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: אֲרוֹן בְּרִית എന്നത് ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട വിശുദ്ധ പെട്ടകമാണ്; ‘ഉടമ്പടിപ്പെട്ടകം’ അർഥം വ്യക്തവും മലയാളത്തിൽ സംക്ഷിപ്തവുമാക്കുന്നു. ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ
  rationale: യഹ്‌വെ എന്ന ദൈവനാമത്തോടുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ചേർക്കുന്നു.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ലേവ്യരായ പുരോഹിതന്മാർ
  rationale: ഹീബ്രു പദസമുച്ചയം പുരോഹിതന്മാരെ ലേവ്യരായി തിരിച്ചറിയുന്നു. രണ്ട് വ്യത്യസ്ത സംഘങ്ങളെന്ന ധാരണ ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളമാണിത്; വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: വഹിക്കുന്നതു
  rationale: വിശുദ്ധ പെട്ടകം എടുത്തുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന נשא എന്ന ക്രിയയ്ക്ക് ‘വഹിക്കുക’ യോജിച്ച, മാന്യമായ മലയാളമാണ്.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: നിങ്ങളുടെ സ്ഥലത്തുനിന്ന് പുറപ്പെട്ട്
  rationale: נסע യാത്രയ്ക്കായി പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; പാളയം പൊളിക്കുക എന്ന് മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കാതെ ചലനകല്പന വ്യക്തമാക്കുന്നു.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: അതിന്റെ പിന്നാലെ പോകണം
  rationale: הלך אחרי എന്നതിലെ സ്ഥലപരമായ ‘പിന്നാലെ പോകുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും കല്പനയുടെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പുനർനിർമിത ഉച്ചാരണമായ Yahweh-ന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הַכֹּהֲנִים הַלְוִיִּם എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ലേവ്യരായ പുരോഹിതന്മാർ
  alternative: പുരോഹിതന്മാർ—ലേവ്യർ
  rationale: മുഖ്യപാഠം പുരോഹിതന്മാരെ ലേവ്യരായി വിശേഷിപ്പിക്കുന്ന വായന വ്യക്തമാക്കുന്നു. എന്നാൽ ഹീബ്രുവിലെ നാമസമാനാധികരണ ഘടന അടിക്കുറിപ്പിലെ കൂടുതൽ ഔപചാരികമായ രൂപത്തിനും ഇട നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കല്പിച്ചു,’ ‘വഹിച്ചു,’ ‘പുറപ്പെട്ട്’ തുടങ്ങിയ പദങ്ങൾ സംഭവത്തിന്റെ ആധികാരികവും ആരാധനാസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായ പഴമൊഴിനട ഒഴിവാക്കി.
