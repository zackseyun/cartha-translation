    rationale: പാദക്കുറിപ്പ് വַ/הוֹרֵשׁ יוֹרִישׁ എന്ന ക്രിയാപ്രയോഗത്തിനുള്ള പദവ്യത്യാസമാണ്. അതിനാൽ ചിഹ്നം ‘ഓടിച്ചുകളയും’ എന്ന പദത്തോടു ചേർക്കണം; ഉദ്ധരണിയുടെ അവസാനത്ത് വയ്ക്കരുത്.
