source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: ml
  text: 'യോശുവ പറഞ്ഞു: “ജീവിക്കുന്ന ദൈവം നിങ്ങളുടെ മധ്യേ ഉണ്ടെന്നും കനാന്യർ, ഹിത്യർ, ഹിവ്യർ, പെരിസ്യർ, ഗിർഗാശ്യർ, അമോര്യർ, യെബൂസ്യർ എന്നിവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് അവൻ നിശ്ചയമായും ഓടിച്ചുകളയും[a] എന്നും ഇതിലൂടെ നിങ്ങൾ അറിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചയമായും ദേശത്തുനിന്ന് അവകാശഭ്രഷ്ടരാക്കും.” ഹീബ്രായ ക്രിയ അവരെ ദേശത്തുനിന്ന് ഉറപ്പായും നീക്കുന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: യോശുവ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി പ്രത്യേകമായി ‘പിന്നെ’ എന്ന കാലക്രമസൂചന ചേർത്തിട്ടില്ല.
- source_word: בְּזֹאת
  choice: ഇതിലൂടെ
  rationale: തുടർന്നുണ്ടാകുന്ന അടയാളം മുഖേന അവർ അറിയുമെന്ന ഉപകരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: תֵּדְעוּן
  choice: നിങ്ങൾ അറിയും
  rationale: സന്ദർഭത്തിൽ ഭാവികാലബലമുള്ള രണ്ടാം പുരുഷ ബഹുവചന അപൂർണക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֵל חַי
  choice: ജീവിക്കുന്ന ദൈവം
  rationale: ദൈവം യഥാർഥത്തിൽ ജീവിക്കുന്നവനാണെന്ന ഗുണാത്മക ഊന്നൽ നിലനിർത്തുന്നു; ഇവിടെ എഴുതിയിട്ടില്ലാത്ത ദൈവനാമം ചേർക്കുന്നില്ല.
- source_word: בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ മധ്യേ
  rationale: ജനസമൂഹത്തിന്റെ നടുവിലുള്ള ദൈവസാന്നിധ്യമാണ് ഉദ്ദേശ്യം; വ്യക്തികളുടെ ഉള്ളിലുള്ള വാസം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: അവൻ നിശ്ചയമായും ഓടിച്ചുകളയും
  rationale: infinitive absolute + finite verb നൽകുന്ന ഉറപ്പും ഊന്നലും ‘നിശ്ചയമായും’ വഴി പ്രകടമാക്കുന്നു; יָרַשׁ എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ നീക്കിക്കളയൽ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രായത്തിലെ സ്ഥലസംബന്ധമായ പ്രയോഗവും ഇസ്രായേലിന്റെ വഴിയിൽനിന്നുള്ള നീക്കവും നിലനിർത്തുന്നു.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: കനാന്യർ ... യെബൂസ്യർ
  rationale: ഹീബ്രായത്തിൽ ഏകവചനരൂപത്തിലുള്ള സമൂഹനാമങ്ങളെ മലയാളത്തിൽ ജനവിഭാഗങ്ങളുടെ പട്ടികയ്ക്കു സ്വാഭാവികമായ ബഹുവചനത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: אֵל חַי എന്ന ദൈവവിശേഷണം
  choice: ജീവിക്കുന്ന ദൈവം
  alternative: ജീവനുള്ള ദൈവം
  rationale: വാക്യം אֵל എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്, יהוה എന്ന ദൈവനാമമല്ല. ‘ജീവിക്കുന്ന ദൈവം’ എന്നത് ദൈവത്തിന്റെ സജീവസാന്നിധ്യത്തെ വ്യക്തമാക്കുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത ദൈവനാമം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ജയിച്ചടക്കലുമായി ബന്ധപ്പെട്ട וְהוֹרֵשׁ יוֹרִישׁ എന്ന ക്രിയയുടെ ശക്തി
  choice: അവൻ നിശ്ചയമായും ഓടിച്ചുകളയും
  alternative: അവൻ നിശ്ചയമായും അവരുടെ കൈവശാവകാശം നീക്കും
  rationale: പട്ടികപ്പെടുത്തിയ ജനവിഭാഗങ്ങളെ നിർണായകമായി നീക്കുമെന്ന വാചകത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ നൽകുന്നു; അതേസമയം പ്രവർത്തനത്തെക്കുറിച്ച് മൂലപാഠത്തിനു പുറത്തുള്ള ന്യായീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനവിഭാഗങ്ങളുടെ പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന ലിപ്യന്തരണത്തിൽ ബഹുവചനമായി നൽകിയിരിക്കുന്നു. ഹീബ്രായവാക്യത്തിലെ ഉറപ്പിന്റെ ഊന്നൽ നിലനിർത്തിയിട്ടുണ്ട്.
