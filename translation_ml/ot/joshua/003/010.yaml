  to: 'യോശുവ പറഞ്ഞു: “ജീവിക്കുന്ന ദൈവം നിങ്ങളുടെ മധ്യേ ഉണ്ടെന്നും കനാന്യർ, ഹിത്യർ, ഹിവ്യർ, പെരിസ്യർ, ഗിർഗാശ്യർ, അമോര്യർ, യെബൂസ്യർ എന്നിവരെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് അവൻ നിശ്ചയമായും ഓടിച്ചുകളയും[a] എന്നും ഇതിലൂടെ നിങ്ങൾ അറിയും.”'
  rationale: മുഖ്യ വിവർത്തനത്തിന്റെ അർഥം മാറ്റിയിട്ടില്ല. പാദക്കുറിപ്പുചിഹ്നം അതു വിശദീകരിക്കുന്ന ക്രിയയിലേക്കു മാറ്റി; മലയാളത്തിൽ അസ്വാഭാവികമായിരുന്ന ബദൽപ്രയോഗം, മൂലപാഠത്തിന്റെ നിർണായക നീക്കൽ/അവകാശഭ്രഷ്ടതാ അർഥം വ്യക്തമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമായി പരിഷ്കരിച്ചു.
