reference: Joshua 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: ml
  text: യഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ച പുരോഹിതന്മാർ യോർദ്ദാന്റെ മധ്യത്തിൽ ഉണങ്ങിയ നിലത്ത് ഉറച്ചുനിന്നു.[a] ഇസ്രായേലൊക്കെയും ഉണങ്ങിയ നിലത്തുകൂടി കടന്നുപോകുകയായിരുന്നു; ജനത മുഴുവൻ യോർദ്ദാൻ കടന്നുതീരുംവരെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ, പുരോഹിതന്മാർ നദീതടത്തിൽ ഉറച്ചോ സ്ഥിരമായോ നിന്നു എന്ന ആശയമാണ്.
    reason: הָכֵן എന്ന ക്രിയാവിശേഷണം സൂചിപ്പിക്കുന്ന സ്ഥിരത വ്യക്തമാക്കുന്നു.
  - marker: b
    text: “ജനത മുഴുവൻ” എന്നതിന് എബ്രായത്തിൽ ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ഏകവചനപദമാണ്; “ജനമെല്ലാം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: כָּל הַגּוֹי എന്ന ഏകവചന കൂട്ടായ പ്രയോഗത്തിന്റെ പരിഭാഷാവികല്പം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: ഉറച്ചുനിന്നു
  rationale: עמד എന്ന ക്രിയയോടൊപ്പം വരുന്ന הָכֵן എന്ന പദം സൂചിപ്പിക്കുന്ന സ്ഥിരതയും അനങ്ങാതെയുള്ള നില്പും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: ചുമന്ന പുരോഹിതന്മാർ
  rationale: നിലവിലുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന participle പുരോഹിതന്മാർ പെട്ടകം ചുമന്നുകൊണ്ടിരുന്നുവെന്ന അർഥത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: എബ്രായ construct chain-ന്റെ ബന്ധം വ്യക്തമായി നൽകുകയും ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בֶּחָרָבָה
  choice: ഉണങ്ങിയ നിലത്ത് / ഉണങ്ങിയ നിലത്തിലൂടെ
  rationale: വെള്ളം മാറി വെളിപ്പെട്ട വരണ്ട നിലമാണ് ഉദ്ദേശ്യം; പുരോഹിതരുടെ സ്ഥാനം പറയുമ്പോൾ ‘നിലത്ത്’, ജനത്തിന്റെ സഞ്ചാരം പറയുമ്പോൾ ‘നിലത്തിലൂടെ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ നടുവിൽ
  rationale: നദിയുടെ ഉൾഭാഗത്തുള്ള സ്ഥാനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הָכֵן
  choice: ഉറച്ചു
  rationale: ഇവിടെ ‘ഒരുക്കപ്പെട്ട്’ എന്നതിലുപരി സ്ഥിരമായി, അനങ്ങാതെ നിലകൊള്ളുന്ന ഭാവമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: ഇസ്രായേൽ മുഴുവനും ... കടന്നുകൊണ്ടിരുന്നു
  rationale: participle സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവൃത്തി നിലനിർത്തുന്നു; പുരോഹിതർ നിന്നിരുന്ന സമയത്തുതന്നെ കടക്കൽ നടന്നുവെന്ന ബന്ധവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: കടന്നുതീരുന്നതുവരെ
  rationale: പ്രവൃത്തി പൂർണമായതിനെ സൂചിപ്പിക്കുന്ന תם മലയാളത്തിൽ സ്വാഭാവികമായ സമാപ്തിപ്രയോഗമായി നൽകുന്നു.
- source_word: כָּל הַגּוֹי
  choice: ജനത മുഴുവനും
  rationale: גּוֹי എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ കൂട്ടായ അർഥം സംരക്ഷിക്കുന്നു; ഇവിടെ ഇസ്രായേലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടന്നുതീരുക
  rationale: ലക്ഷ്യപ്രവൃത്തിയും അതിന്റെ പൂർത്തീകരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; സ്വരീകരണത്തെക്കുറിച്ചുള്ള ചരിത്രപരമായ അനിശ്ചിതത്വം അംഗീകരിച്ചുകൊണ്ട് വ്യാപകമായ പണ്ഡിതോപയോഗം പിന്തുടരുന്നു.
- issue: בְּרִית יְהוָה എന്ന ബന്ധത്തിന്റെ അവതരണം
  choice: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം
  alternative: യഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഇരുവിധവും construct chain-ന്റെ അർഥം നൽകാം; ‘ഉടമ്പടിപ്പെട്ടകം’ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും വസ്തുവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ രണ്ട് സമകാലിക ദൃശ്യങ്ങൾ വേർതിരിച്ച വാക്യങ്ങളിലൂടെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചിരിക്കുന്നു; ഉണങ്ങിയ നിലം എന്ന അത്ഭുതസന്ദർഭവും പുരോഹിതരുടെ സ്ഥിരമായ നില്പും നിലനിർത്തിയിരിക്കുന്നു.
