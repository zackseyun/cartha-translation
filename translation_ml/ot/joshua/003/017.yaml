revisions:
- from: യഹ്‌വേയുടെ ഉടമ്പടിപ്പെട്ടകം ചുമന്ന പുരോഹിതന്മാർ യോർദ്ദാന്റെ നടുവിൽ ഉണങ്ങിയ നിലത്ത് ഉറച്ചുനിന്നു.[a] ജനത മുഴുവനും യോർദ്ദാൻ കടന്നുതീരുന്നതുവരെ ഇസ്രായേൽ മുഴുവനും ഉണങ്ങിയ നിലത്തിലൂടെ കടന്നുകൊണ്ടിരുന്നു.[b]
  to: യഹ്‌വേയുടെ ഉടമ്പടിയുടെ പെട്ടകം വഹിച്ച പുരോഹിതന്മാർ യോർദ്ദാന്റെ മധ്യത്തിൽ ഉണങ്ങിയ നിലത്ത് ഉറച്ചുനിന്നു.[a] ഇസ്രായേലൊക്കെയും ഉണങ്ങിയ നിലത്തുകൂടി കടന്നുപോകുകയായിരുന്നു; ജനത മുഴുവൻ യോർദ്ദാൻ കടന്നുതീരുംവരെ.[b]
  rationale: The revision preserves all narrative and aspectual elements of the Hebrew while resolving the Malayalam subject-order problem. It also makes the ark’s construct relationship explicit and uses a more natural participial expression for the priests carrying it.
