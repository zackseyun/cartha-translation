  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. എബ്രായവാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനത്തിലെ തുടർച്ചയും, നടുവിലെ പശ്ചാത്തലവിവരത്തിന്റെ പരാന്തറ്റിക് സ്വഭാവവും ദീർഘവിരാമചിഹ്നങ്ങളിലൂടെ നിലനിർത്തി.
