base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: ml
  text: പെട്ടകം ചുമന്നവർ യോർദ്ദാനരികെ[a] എത്തിയപ്പോൾ, പെട്ടകം ചുമന്ന പുരോഹിതന്മാരുടെ കാലുകൾ വെള്ളത്തിന്റെ വക്കിൽ വെള്ളത്തിൽ മുക്കപ്പെട്ടു (കൊയ്ത്തുകാലം മുഴുവനും യോർദ്ദാൻ അതിന്റെ എല്ലാ കരകളും കവിഞ്ഞ് നിറഞ്ഞൊഴുകുകയായിരുന്നു[b]),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യോർദ്ദാൻവരെ.” സന്ദർഭത്തിൽ ഇത് നദിയുടെ വെള്ളം തുടങ്ങുന്ന അരികുവരെയുള്ള എത്തിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, കൊയ്ത്തുകാലത്ത് യോർദ്ദാൻ പ്രളയനിലയിലായി കരകവിഞ്ഞൊഴുകുകയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: എത്തിയപ്പോൾ
  rationale: വാവ്, കാലസൂചകമായ כְּ, ഇൻഫിനിറ്റീവ് കൺസ്ട്രക്റ്റ് എന്നിവ ചേർന്ന് ‘വന്നപ്പോൾ/എത്തിയപ്പോൾ’ എന്ന കാലവാക്യം രൂപപ്പെടുത്തുന്നു. സന്ദർഭത്തിൽ നദിക്കരയിലേക്കുള്ള സഞ്ചാരത്തിന്റെ ലക്ഷ്യപ്രാപ്തി വ്യക്തമാക്കാൻ ‘എത്തിയപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: പെട്ടകം ചുമന്നവർ
  rationale: പെട്ടകം വഹിച്ചുകൊണ്ടിരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പാർട്ടിസിപ്പിളിന്റെ സജീവവും വ്യക്തവുമായ മലയാളരൂപം. എബ്രായത്തിലെ ആവർത്തനം രണ്ടാം പ്രയോഗത്തിലും നിലനിർത്തി.
- source_word: עַד הַיַּרְדֵּן
  choice: യോർദ്ദാനരികെ
  rationale: עַד ലക്ഷ്യസ്ഥാനത്തോളം എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ നദിയുടെ വെള്ളത്തിലേക്കു കാൽവയ്ക്കുന്നതിനു തൊട്ടുമുമ്പുള്ള എത്തിച്ചേരലായതിനാൽ ‘യോർദ്ദാനരികെ’ സ്വാഭാവികമായി അർഥം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: പുരോഹിതന്മാരുടെ കാലുകൾ
  rationale: എബ്രായ കൺസ്ട്രക്റ്റ് ശൃംഖലയുടെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נִטְבְּלוּ
  choice: മുങ്ങി
  rationale: טבל എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം വെള്ളത്തിൽ കടക്കുകയോ മുക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. വെറും ‘തൊട്ടു’ എന്നതിനെക്കാൾ ശക്തവും, പൂർണമായി ആഴ്ന്നുപോയി എന്ന് അതിശയോക്തി വരുത്താത്തതുമായ പ്രയോഗമാണിത്.
- source_word: בִּקְצֵה הַמָּיִם
  choice: വെള്ളത്തിന്റെ വക്കിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വെള്ളത്തിന്റെ അറ്റത്ത്/വക്കിൽ’. കാലുകൾ വെള്ളത്തിന്റെ അതിരിലുള്ള ഭാഗത്തേക്ക് കടന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: യോർദ്ദാൻ അതിന്റെ കരകളെല്ലാം കവിഞ്ഞ് നിറഞ്ഞൊഴുകുകയായിരുന്നു
  rationale: മָלֵאയും ‘എല്ലാ കരകൾക്കും മീതെ’ എന്ന തുടർപ്രയോഗവും ചേർന്ന് പ്രളയനിലയിലുള്ള നദിയുടെ ചിത്രം നൽകുന്നു. ‘നിറഞ്ഞൊഴുകുകയായിരുന്നു’ എന്നത് നിറവും കരകവിഞ്ഞ നിലയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יְמֵי קָצִיר
  choice: കൊയ്ത്തുകാലം മുഴുവനും
  rationale: കൊയ്ത്തിന്റെ മുഴുവൻ കാലയളവിനെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
