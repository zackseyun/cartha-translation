id: JOS.3.6
reference: Joshua 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ പുരോഹിതന്മാരോടു പറഞ്ഞു: “ഉടമ്പടിയുടെ പെട്ടകം എടുത്ത് ജനത്തിന്റെ മുമ്പിൽ കടന്നുപോകുവിൻ.” അങ്ങനെ അവർ ഉടമ്പടിയുടെ പെട്ടകം എടുത്ത് ജനത്തിന്റെ മുമ്പിൽ പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ഇസ്രായേലിന്റെ ആരാധനാശുശ്രൂഷ നിർവഹിച്ചവരെ സൂചിപ്പിക്കുന്ന നിർദ്ദിഷ്ട ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: שְׂאוּ / וַיִּשְׂאוּ
  choice: എടുത്ത് / എടുത്ത്
  rationale: נשא ഇവിടെ പെട്ടകം ഉയർത്തി ചുമക്കാൻ എടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കല്പനയിലും അതിന്റെ അനുസരണവിവരണത്തിലും ഒരേ മലയാള ക്രിയ നിലനിർത്തുന്നു.
- source_word: אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട വിശുദ്ധ പെട്ടകത്തെ സൂചിപ്പിക്കുന്ന സുതാര്യവും മലയാളത്തിൽ പരിചിതവുമായ പ്രയോഗം.
- source_word: וְעִבְרוּ
  choice: കടന്നുപോകുവിൻ
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും യോർദ്ദാൻ കടക്കാനുള്ള പശ്ചാത്തലത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: לִפְנֵי הָעָם
  choice: ജനത്തിന്റെ മുമ്പിൽ
  rationale: ജനത്തിന് മുന്നിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന ലִפְנֵי എന്ന പദത്തിന്റെ ഔപചാരികവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וַיֵּלְכוּ
  choice: നടന്നു
  rationale: הלך എന്ന സാധാരണ സഞ്ചാരക്രിയയെ ഇവിടെ ‘നടന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് പുരോഹിതർ പെട്ടകവുമായി ജനത്തിനു മുമ്പിൽ നീങ്ങിയ ദൃശ്യത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പോയി’ എന്നും സാധ്യമാണ്.
theological_decisions:
- issue: ആരാധനാപശ്ചാത്തലത്തിലെ ഉടമ്പടി-പദപ്രയോഗം
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  alternative: ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രു ഘടനയിലെ ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും അധിക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനയ്ക്ക് സുഗ്രാഹ്യമായ ശൈലി. നേരിട്ടുള്ള കല്പനയിൽ ബഹുമാനസൂചക ബഹുവചനമായ ‘കടന്നുപോകുവിൻ’ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന പദസാന്ദ്രത ഒഴിവാക്കി.
