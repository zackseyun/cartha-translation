id: JOS.3.9
reference: Joshua 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: ml
  text: 'യോശുവ ഇസ്രായേൽമക്കളോടു[a] പറഞ്ഞു: “ഇങ്ങോട്ട് അടുത്തുവരുവിൻ; നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേയുടെ വാക്കുകൾ കേൾക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപമാണിത്; നേരിട്ടുള്ള സംഭാഷണം അവതരിപ്പിക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; എന്നാൽ ഈ സന്ദർഭത്തിൽ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത വംശീയനാമമായതിനാൽ ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മൂലപ്രയോഗത്തിന്റെ രൂപവും ഉൾക്കൊള്ളുന്ന അർഥവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: גֹּשׁוּ הֵנָּה
  choice: ഇവിടെ അടുത്തുവന്ന്
  rationale: נגשׁ എന്ന ബഹുവചന ആജ്ഞ അടുത്തേക്കു നീങ്ങുന്നതും הֵנָּה സംസാരിക്കുന്നവന്റെ അടുക്കലേക്കുള്ള ദിശയും സൂചിപ്പിക്കുന്നു; രണ്ടും ചേർന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְשִׁמְעוּ
  choice: കേൾക്കുവിൻ
  rationale: שׁמע എന്ന ബഹുവചന ആജ്ഞ ശ്രദ്ധയോടെ കേൾക്കുക എന്ന ആശയം ഉൾക്കൊള്ളുന്നു; സമൂഹത്തോടുള്ള ഗൗരവമുള്ള ആഹ്വാനത്തിന് ‘കേൾക്കുവിൻ’ യോജിക്കുന്നു.
- source_word: דִּבְרֵי
  choice: വചനങ്ങൾ
  rationale: דבר എന്നതിന്റെ ബഹുവചന സംയുക്തരൂപം ‘വാക്കുകൾ’ എന്നാണ് അക്ഷരാർഥം; ദൈവം അരുളുന്ന വാക്കുകൾ എന്ന സന്ദർഭത്തിൽ ‘വചനങ്ങൾ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്, ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוהയെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസാദൃശ്യമുണ്ടെങ്കിലും ഇവിടെ יהוהയെ സൂചിപ്പിക്കുന്ന ഏകവചന ദൈവനാമമാണ്; כֶם രണ്ടാംപുരുഷ ബഹുവചന ഉടമസ്ഥപ്രത്യയം ‘നിങ്ങളുടെ’ എന്നു നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ നിലനിർത്തി. ശാസ്ത്രീയ പുനർനിർമാണമായ ‘യാഹ്‌വേ’ സാധ്യമാണെങ്കിലും, ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് കൂടുതൽ പരിചിതവും ദൈവനാമമെന്ന നിലയിൽ സുതാര്യവുമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ / ഇസ്രായേല്യർ
  rationale: എബ്രായരൂപം വ്യാകരണപരമായി പുല്ലിംഗമാണെങ്കിലും ഇത് മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് വംശീയപ്രയോഗമാണ്. ‘പുത്രന്മാർ’ എന്ന് നൽകിയാൽ പുരുഷന്മാർക്കു മാത്രമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം; ‘ഇസ്രായേൽമക്കൾ’ രൂപസാദൃശ്യം സംരക്ഷിച്ചുകൊണ്ട് സമൂഹപരമായ അർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അടുത്തുവന്ന്’ മൂലത്തിലെ സമീപിക്കാനുള്ള ആജ്ഞ വ്യക്തമാക്കുന്നു; ‘കേൾക്കുവിൻ’ സമൂഹത്തോടുള്ള ബഹുവചന ആജ്ഞയുടെ ഔന്നത്യം നിലനിർത്തുന്നു. ദൈവനാമം ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി നൽകിയിരിക്കുന്നു.
