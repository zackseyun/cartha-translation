id: JOS.3.5
reference: Joshua 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: ml
  text: 'അപ്പോൾ യോശുവ ജനത്തോടു പറഞ്ഞു: “നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ; കാരണം നാളെ യഹോവ നിങ്ങളുടെ മധ്യേ അത്ഭുതങ്ങൾ പ്രവർത്തിക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ
  rationale: ഹിത്പയേൽ ആജ്ഞാരൂപത്തിന്റെ സ്വയം ഒരുക്കുകയും വിശുദ്ധമായി വേർതിരിക്കുകയും ചെയ്യുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: തുടർന്നുള്ള യഹോവയുടെ പ്രവൃത്തി മുൻകല്പനയ്ക്കുള്ള കാരണമായി അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בְּקִרְבְּכֶם
  choice: നിങ്ങളുടെ മധ്യേ
  rationale: ജനസമൂഹത്തിനുള്ളിൽ/അവരുടെ ഇടയിൽ എന്ന സ്ഥലപരവും സമൂഹപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נִפְלָאוֹת
  choice: അത്ഭുതങ്ങൾ
  rationale: ദൈവത്തിന്റെ അസാധാരണവും വിസ്മയകരവുമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു; പദത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- issue: വിശുദ്ധീകരണത്തിലെ കർത്തൃത്വം
  choice: നിങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കുവിൻ
  alternative: വിശുദ്ധരാകുവിൻ
  rationale: ഹിത്പയേൽ രൂപം ജനങ്ങളോടുള്ള സജീവമായ സ്വയം ഒരുക്കലിന്റെ ആജ്ഞയാണെന്ന സൂചന സംരക്ഷിക്കുന്നു; അതിന്റെ കൃത്യമായ ആചാരപരമായ നടപടികൾ വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അവ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും പൊതുവായ വായനാസൗകര്യവും ഉള്ള മലയാളം. വചനത്തിന്റെ സംക്ഷിപ്തമായ ആജ്ഞയും കാരണവാക്യവും നിലനിർത്തിയിരിക്കുന്നു.
