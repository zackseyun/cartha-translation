  to: ഇതാ, സർവഭൂമിയുടെയും കർത്താവിന്റെ ഉടമ്പടിയുടെ പെട്ടകം നിങ്ങൾക്കു മുമ്പായി യോർദ്ദാനിലേക്കു കടക്കുന്നു.[a]
