    issue: The em dashes make “സർവഭൂമിയുടെയും കർത്താവ്” appositional to “ഉടമ്പടിയുടെ പെട്ടകം.”
    rationale: The Hebrew phrase identifies the ark as belonging to “the Lord of all the earth,” rather than equating the ark with the Lord. The current wording therefore changes the referential relationship in the verse.
