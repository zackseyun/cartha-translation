source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: ml
  text: ഇതാ, സർവഭൂമിയുടെയും കർത്താവിന്റെ ഉടമ്പടിയുടെ പെട്ടകം നിങ്ങൾക്കു മുമ്പായി യോർദ്ദാനിലേക്കു കടക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോർദ്ദാനിൽ കടന്നുപോകുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ ഉപസർഗം സ്ഥാനത്തെയും, സന്ദർഭത്തിൽ ദിശയെയും, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവത്തിന്റെ തത്സമയഭാവം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֲרוֹן הַבְּרִית
  choice: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഹീബ്രായ നിർമാണബന്ധം സുതാര്യമായി നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: സർവഭൂമിയുടെയും കർത്താവ്
  rationale: אֲדוֹן സൂചിപ്പിക്കുന്ന പരമാധികാരപദവിയുടെ ഗൗരവം സംരക്ഷിക്കുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: עֹבֵר
  choice: കടക്കുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന പുരോഗമിക്കുന്നതോ ഉടൻ സംഭവിക്കാനിരിക്കുന്നതോ ആയ പ്രവർത്തനത്തിന്റെ സജീവത മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങൾക്കു മുമ്പായി
  rationale: ജനത്തെക്കാൾ മുന്നിൽ നീങ്ങുന്നതെന്ന ദിശാസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: בַּיַּרְדֵּן
  choice: യോർദ്ദാനിലേക്കു
  rationale: בְ എന്ന ഉപസർഗം അടിസ്ഥാനമായി സ്ഥാനസൂചന നൽകാമെങ്കിലും, ചലനക്രിയയായ עֹבֵר നോടും സന്ദർഭത്തോടും ചേർന്ന് നദിയിലേക്കുള്ള പ്രവേശനദിശ ഇവിടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: אֲדוֹן כָּל הָאָרֶץ എന്ന പരമാധികാരപദവിയുടെ വിവർത്തനം
  choice: സർവഭൂമിയുടെയും കർത്താവ്
  alternative: സർവഭൂമിയുടെയും യജമാനൻ
  rationale: ‘കർത്താവ്’ ദൈവിക പരമാധികാരത്തിന്റെ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദമാണ്; ‘യജമാനൻ’ നിഘണ്ടുപരമായി സാധ്യമെങ്കിലും ഇവിടെ ആവശ്യമായ പദവീഗൗരവം കുറയ്ക്കാം.
- issue: אֲרוֹן הַבְּרִית എന്നതിനും אֲדוֹן כָּל הָאָרֶץ എന്നതിനും ഇടയിലെ ബന്ധം
  choice: 'വിരാമചിഹ്നങ്ങളിലൂടെ സമാനാധികരണബന്ധം നിലനിർത്തി: ‘ഉടമ്പടിയുടെ പെട്ടകം—സർവഭൂമിയുടെയും കർത്താവ്—’'
  alternative: ‘സർവഭൂമിയുടെയും കർത്താവിന്റെ ഉടമ്പടിയുടെ പെട്ടകം’
  rationale: മസോററ്റിക് പാഠത്തിന്റെ പദക്രമവും הַבְּרִית എന്നിടത്തെ വിഭജനവും ശക്തമായ സമാനാധികരണവായനയ്ക്ക് ഇട നൽകുന്നു. ദൈവസാന്നിധ്യവും പെട്ടകവും തമ്മിലുള്ള വാചകത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷകപദവും ‘കർത്താവ്’ എന്ന പരമാധികാരപദവിയും ബൈബിൾഗൗരവം നിലനിർത്തുന്നു. സമാനാധികരണത്തിന്റെ അസാധാരണതയും യോർദ്ദാനോടുള്ള ഉപസർഗത്തിന്റെ അർത്ഥവ്യാപ്തിയും മായ്ച്ചുകളയാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
