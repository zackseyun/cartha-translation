id: JOS.3.1
reference: Joshua 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: ml
  text: യോശുവ അതിരാവിലെ എഴുന്നേറ്റു. അവനും ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരും[a] ശിത്തീമിൽനിന്ന് പുറപ്പെട്ട് യോർദ്ദാനരികിലെത്തി. അവർ കടന്നുപോകുന്നതിനുമുമ്പ് അവിടെ രാത്രി പാർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘എല്ലാ ഇസ്രായേല്യരും.’ എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: അതിരാവിലെ എഴുന്നേറ്റു
  rationale: ശׁכם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം നേരത്തേ എഴുന്നേൽക്കുക എന്ന ആശയം നൽകുന്നു. ബַּבֹּקֶר ഉൾക്കൊള്ളുന്ന പ്രഭാതസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ‘അതിരാവിലെ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണത്തിൽ נסע പാളയം നീക്കി യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: מֵהַשִּׁטִּים
  choice: ശിത്തീമിൽനിന്ന്
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ ‘അക്കേഷ്യാവനം’ എന്നു അർത്ഥപരമായി വിവർത്തനം ചെയ്യാതെ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: യോർദ്ദാനരികിലെത്തി
  rationale: עד ഉള്ള ഘടന യോർദ്ദാൻവരെ എത്തിച്ചേർന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ നദിയുടെ സമീപത്തെത്തുക എന്ന അർത്ഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: അവനും ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരും
  rationale: הוּא യോശുവയെ വീണ്ടും വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ ‘അവനും’ നിലനിർത്തി. בְּנֵי എന്ന പദത്തിന്റെ പുത്രന്മാർ എന്ന രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; ദേശീയസമൂഹത്തെ ഉദ്ദേശിക്കുന്ന സ്വാഭാവിക അർത്ഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיָּלִנוּ שָׁם
  choice: അവിടെ രാത്രി പാർത്തു
  rationale: לון ഇവിടെ ഒരു രാത്രി തങ്ങുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ മലയാളപ്രയോഗം വ്യക്തവും സാധാരണവുമാണ്.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: അവർ കടന്നുപോകുന്നതിനുമുമ്പ്
  rationale: טֶרֶם മുൻകാലബന്ധം സൂചിപ്പിക്കുന്നു; עבר യോർദ്ദാൻ കടക്കുന്നതിനെ ഉദ്ദേശിക്കുന്നതിനാൽ കടന്നുപോകുക എന്ന ക്രിയ ഉപയോഗിച്ചു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ-ബന്ധുത്വപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരും
  alternative: എല്ലാ ഇസ്രായേല്യരും / ഇസ്രായേൽമക്കൾ എല്ലാവരും
  rationale: ഇവിടെ പ്രത്യേക സിദ്ധാന്തവിവാദമില്ല. എങ്കിലും എബ്രായത്തിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ ദൃശ്യമാക്കി; മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന സ്വാഭാവിക വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ ശബ്ദാന്തരണം ചെയ്തു. എബ്രായ വാക്യക്രമം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ വാക്യം വിഭജിച്ചെങ്കിലും സംഭവക്രമവും യോശുവയെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമവും നിലനിർത്തി.
