  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
