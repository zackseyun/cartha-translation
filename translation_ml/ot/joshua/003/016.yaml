  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: ml
  text: മുകളിൽനിന്ന് ഒഴുകിവന്ന വെള്ളം നിന്നു[a]; അത് വളരെ ദൂരെയുള്ള, സാരെഥാന്റെ സമീപത്തുള്ള നഗരമായ ആദാമിൽ ഒരൊറ്റ കൂമ്പാരമായി ഉയർന്നു. അരാബാക്കടലായ ഉപ്പുകടലിലേക്ക്[b] ഒഴുകിക്കൊണ്ടിരുന്ന വെള്ളത്തിന്റെ ഒഴുക്ക് പൂർണമായി നിലച്ചു. ജനം യെരീഹോവിന് എതിർവശത്ത് അക്കരെ കടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവ ഒരൊറ്റ കൂമ്പാരമായി ഉയർന്നുനിന്നു.’ വെള്ളം ഒന്നിച്ചുകൂടി ഉയർന്ന ഒരു തടസ്സമായിത്തീർന്ന ദൃശ്യമാണ് എബ്രായ പ്രയോഗം ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉപ്പുകടൽ’ പിന്നീട് സാധാരണയായി ‘ചാവുകടൽ’ എന്നു അറിയപ്പെട്ട ജലാശയമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘നിൽക്കുക’ എന്ന ദൃശ്യഭാവവും, സന്ദർഭത്തിലെ ഒഴുക്ക് നിലച്ചതും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നു.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: മുകളിൽനിന്ന് ഒഴുകിവന്ന വെള്ളം
  rationale: ഉയർന്ന ഭാഗത്തുനിന്ന് താഴേക്കുള്ള ഒഴുക്കിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: קָמוּ נֵד אֶחָד
  choice: ഒരൊറ്റ കൂമ്പാരമായി ഉയർന്നുനിന്നു
  rationale: קום എന്നതിലെ ഉയർന്നുനിൽക്കുന്ന ഭാവവും נֵד אֶחָד എന്ന ഏകീകൃത ജലക്കൂമ്പാരത്തിന്റെ മൂർത്തമായ ചിത്രവും നിലനിർത്തുന്നു.
- source_word: הַרְחֵק מְאֹד
  choice: വളരെ ദൂരെ
  rationale: ദൂരത്തെ ഊന്നിപ്പറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി നേരിട്ട് നൽകുന്നു.
- source_word: בְאָדָם
  choice: ആദാം പട്ടണത്തിനരികെ
  rationale: אָדָם ഇവിടെ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പൊതുനാമമല്ല, പട്ടണത്തിന്റെ സ്ഥലനാമമാണ്.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: സാരെഥാന്റെ സമീപത്തുള്ള ആദാം പട്ടണം
  rationale: מִצַּד സൂചിപ്പിക്കുന്ന സ്ഥലസാമീപ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: അരാബാ കടലിലേക്കു ഒഴുകിയിരുന്ന വെള്ളം
  rationale: താഴോട്ടുള്ള ജലപ്രവാഹവും കടലിലേക്കുള്ള ദിശയും വ്യക്തമാക്കുന്നു.
- source_word: יָם הַמֶּלַח
  choice: ഉപ്പുകടൽ
  rationale: എബ്രായ ഭൂമിശാസ്ത്രനാമത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: പൂർണമായി നിലച്ചു; മുറിച്ചുകളയപ്പെട്ടു
  rationale: രണ്ട് എബ്രായ ക്രിയകളെയും വേർതിരിച്ചു പ്രതിഫലിപ്പിച്ച് സമ്പൂർണമായ അവസാനിപ്പിക്കലും വിച്ഛേദിക്കലും ഉൾക്കൊള്ളുന്ന ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: וְהָעָם עָבְרוּ
  choice: ജനം അക്കരെ കടന്നു
  rationale: עבר എന്ന ക്രിയയുടെ അതിർത്തിയോ ജലധാരയോ കടക്കുന്നതായ ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נֶגֶד יְרִיחוֹ
  choice: യെരീഹോവിന് എതിർവശത്തുകൂടി
  rationale: נֶגֶד സൂചിപ്പിക്കുന്ന അഭിമുഖമായ ഭൂമിശാസ്ത്രസ്ഥാനം നിലനിർത്തുന്നു.
