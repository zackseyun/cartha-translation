translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പുരാതന അളവായ ‘മുഴം’ മുഖ്യവാക്യത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. ഇംഗ്ലീഷ് മാതൃകയിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ ഉള്ളടക്കക്രമം തെറ്റിയിരുന്നതിനാൽ, [a] ‘മുഴം’ എന്നതിനോടും [b] ‘മുമ്പ്’ എന്നതിനോടും യഥാർത്ഥമായി ബന്ധിപ്പിച്ചു.
