base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾക്കും അതിനും ഇടയിൽ അളവുപ്രകാരം ഏകദേശം രണ്ടായിരം മുഴം[a] അകലം ഉണ്ടായിരിക്കണം. നിങ്ങൾ പോകേണ്ട വഴി അറിയേണ്ടതിന് അതിനോട് അടുക്കരുത്; കാരണം, മുമ്പ്[b] നിങ്ങൾ ഈ വഴിയിലൂടെ കടന്നുപോയിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ‘മുഴം’ കൈമുട്ടുമുതൽ നടുവിരലിന്റെ അറ്റംവരെയുള്ള നീളത്തെ അടിസ്ഥാനമാക്കിയിരുന്ന ഒരു പുരാതന അളവാണ്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇന്നലെയും മിനിഞ്ഞാന്നും മുതൽ’; ‘മുമ്പ്’ അല്ലെങ്കിൽ ‘ഇതിനുമുമ്പ്’ എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻനിർദേശത്തോടു ചേർന്ന നിയന്ത്രണാത്മകമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: നിങ്ങൾക്കും അതിനും ഇടയിൽ ... അകലം ഉണ്ടായിരിക്കണം
  rationale: ഹീബ്രുവിലെ അകലത്തിന്റെ നിലനിൽപ്പ് പ്രകടിപ്പിക്കുന്ന ഘടന കാത്തുകൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സർവനാമം സന്ദർഭത്തിലെ നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: അളവുപ്രകാരം ഏകദേശം രണ്ടായിരം മുഴം
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ ഏകദേശാർഥവും പുരാതന അളവായ ‘മുഴം’ എന്നതും നിലനിർത്തുന്നു.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: അതിനോട് അടുക്കരുത്
  rationale: സ്ഥലപരമായ നിരോധനം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: അങ്ങനെ ... നിങ്ങൾക്കു അറിയാം
  rationale: ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന ഘടന മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: നിങ്ങൾ പോകേണ്ട വഴി ഏതെന്ന്
  rationale: യാത്രയ്ക്കുള്ള പ്രായോഗിക മാർഗനിർദേശത്തെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘പോകേണ്ട’ സന്ദർഭജന്യ ആവശ്യകത അറിയിക്കുന്നു, എന്നാൽ പുതിയ ദൈവശാസ്ത്രപരമായ നിർബന്ധം ചേർക്കുന്നില്ല.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: കാരണം ... നിങ്ങൾ ഈ വഴിയിലൂടെ കടന്നുപോയിട്ടില്ല
  rationale: עָבַר എന്ന ക്രിയയുടെ കടന്നുപോകുക എന്ന അടിസ്ഥാനഗതിയാർഥം നിലനിർത്തുന്നു.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: മുമ്പ്
  rationale: ‘ഇന്നലെയും മിനിഞ്ഞാന്നും മുതൽ’ എന്ന അക്ഷരാർഥമുള്ള ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
