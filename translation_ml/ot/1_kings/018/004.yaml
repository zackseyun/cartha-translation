  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: ml
  text: ഈസേബെൽ യഹ്‌വേയുടെ പ്രവാചകന്മാരെ കൊന്നൊടുക്കിക്കൊണ്ടിരുന്നപ്പോൾ[a], ഓബദ്യാവ് നൂറ് പ്രവാചകന്മാരെ കൂട്ടി, ഒരു ഗുഹയിൽ അമ്പതുപേർ വീതം[b] ഒളിപ്പിച്ച്, അപ്പവും വെള്ളവും നൽകി അവരെ പോറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നശിപ്പിച്ചുകൊണ്ടിരുന്നപ്പോൾ”; അക്ഷരാർഥത്തിൽ, “മുറിച്ചുകളഞ്ഞുകൊണ്ടിരുന്നപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഗുഹയിൽ അമ്പത് പേർ.” നൂറുപേരെ അമ്പതുപേർ വീതമുള്ള രണ്ടു സംഘങ്ങളായി, പ്രത്യക്ഷത്തിൽ വേറെ വേറെ ഗുഹകളിൽ, ഒളിപ്പിച്ചുവെന്നാണ് എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: കൊന്നൊടുക്കിക്കൊണ്ടിരുന്നപ്പോൾ
  rationale: היה + infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. כרת എന്നതിന്റെ അക്ഷരാർഥം ‘മുറിച്ചുകളയുക’ എന്നാണെങ്കിലും ഇവിടെ പ്രവാചകന്മാരെ ഇല്ലാതാക്കുകയോ കൊല്ലുകയോ ചെയ്യുന്നതാണ് സന്ദർഭാർഥം; മലയാളത്തിൽ സ്വാഭാവികമായ ‘കൊന്നൊടുക്കുക’ അത് വ്യക്തമാക്കുന്നു.
- source_word: אִיזֶבֶל
  choice: ഈസബെൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: נְבִיאֵי יְהוָה
  choice: യഹ്‌വേയുടെ പ്രവാചകന്മാർ
  rationale: Construct chain സ്വാഭാവികമായ മലയാള ഷഷ്ഠീവ്യാകരണത്തിൽ അവതരിപ്പിക്കുന്നു; ദൈവനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: לקח എന്നത് അടിസ്ഥാനമായി ‘എടുക്കുക’ എന്നാണ്; ആളുകളെ സംരക്ഷിക്കാൻ തന്റെ ചുമതലയിലാക്കി മാറ്റിയ ഈ സന്ദർഭത്തിൽ ‘കൂട്ടിക്കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്, എന്നാൽ തുടർന്നുള്ള ഒളിപ്പിക്കൽക്കപ്പുറം അനാവശ്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: עֹבַדְיָהוּ
  choice: ഓബദ്യാവ്
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מֵאָה נְבִאִים
  choice: നൂറു പ്രവാചകന്മാർ
  rationale: സംഖ്യാവാക്യം നേരിട്ടും വ്യക്തമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וַיַּחְבִּיאֵם
  choice: അവരെ ഒളിപ്പിച്ച്
  rationale: חבא എന്ന Hiphil രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഒളിപ്പിക്കുക’ എന്നതാണ്.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: ഒരു ഗുഹയിൽ അമ്പതുപേർ വീതം
  rationale: അക്ഷരാർഥം ‘ഗുഹയിൽ അമ്പതു പേർ’ എന്നാണ്. നൂറുപേരെ അമ്പതു വീതമുള്ള സംഘങ്ങളായി ഗുഹകളിൽ ഒളിപ്പിച്ചെന്ന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എബ്രായത്തിലെ ഏകവചനവും അതിലെ അവ്യക്തതയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: וְכִלְכְּלָם
  choice: നൽകി പോറ്റി
  rationale: כלכל എന്ന ക്രിയ തുടർച്ചയായി പരിപാലിക്കുകയോ ആവശ്യങ്ങൾ നൽകി പോറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അപ്പവും വെള്ളവും എന്ന രണ്ടു വസ്തുക്കളോടും യോജിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: לֶחֶם וָמָיִם
  choice: അപ്പവും വെള്ളവും
  rationale: മൂലത്തിലെ സാധാരണ മൂർത്തപദങ്ങൾ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യാഹ്‌വെ; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസഹായകമായ ‘യഹ്‌വേ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: הַכְרִית എന്നതിലെ നാശത്തിന്റെ സ്വഭാവം
  choice: കൊന്നൊടുക്കുക
  alternative: നശിപ്പിക്കുക; മുറിച്ചുകളയുക
  rationale: പ്രവാചകന്മാർക്കെതിരായ നടപടിയിൽ ക്രിയയുടെ സന്ദർഭാർഥം കൊലപ്പെടുത്തലാണ്. എങ്കിലും മൂലത്തിലെ ‘മുറിച്ചുകളയുക/ഇല്ലാതാക്കുക’ എന്ന ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് വ്യാഖ്യാനസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘പ്രവാചകന്മാർ’, ‘അപ്പം’, ‘പോറ്റി’ തുടങ്ങിയ പൊതുവേ മനസ്സിലാകുന്ന ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ അക്ഷരാനുകരണം ഒഴിവാക്കി, മൂലത്തിലെ യഥാർഥ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
