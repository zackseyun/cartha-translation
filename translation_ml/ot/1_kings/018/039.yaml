id: 1KI.18.39
reference: 1 Kings 18:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: ml
  text: ജനമെല്ലാം ഇത്[a] കണ്ടപ്പോൾ മുഖം നിലത്താക്കി വീണു. അവർ, “യഹ്‌വെ—അവനാണ് ദൈവം![b] യഹ്‌വെ—അവനാണ് ദൈവം!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കണ്ടപ്പോൾ’ എന്നു മാത്രം; കണ്ടത് എന്താണെന്ന് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നു.
    reason: മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ചേർത്ത സൂചകസർവനാമം വ്യക്തമാക്കുന്നു.
  - marker: b
    text: എബ്രായത്തിൽ ‘ദൈവം’ എന്ന പദത്തിന് നിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന രൂപമുണ്ട്; ബാലിനോടുള്ള വൈരുധ്യത്തിൽ യഹ്‌വെയാണ് സത്യദൈവം എന്ന തിരിച്ചറിവാണ് ഇതിൽ പ്രകടമാകുന്നത്.
    reason: മലയാളത്തിൽ നേരിട്ട് പ്രതിഫലിക്കാത്ത എബ്രായ നിശ്ചിതരൂപത്തിന്റെയും അതിന്റെ വൈരുധ്യബലത്തിന്റെയും വിശദീകരണം.
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: ജനമെല്ലാം ഇത് കണ്ടപ്പോൾ
  rationale: וַיַּרְא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കണ്ടു’ എന്നാണ്. എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ തീ ഇറങ്ങിയ സംഭവമാണ് സന്ദർഭത്തിൽ സൂചിതം; സ്വാഭാവിക മലയാളത്തിനായി ‘ഇത്’ ചേർത്തിരിക്കുന്നു.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: മുഖം നിലത്താക്കി വീണു
  rationale: ശരീരം കമിഴ്ത്തി ആദരപൂർവം വീഴുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: എന്നു പറഞ്ഞു
  rationale: സാധാരണ സംസാരക്രിയയായതിനാൽ മൂലപാഠം പറയാത്ത ശബ്ദതീവ്രതയോ വികാരമോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണരൂപം മലയാളലിപിയിൽ നൽകുന്നു.
- source_word: הוּא
  choice: അവനാണ്
  rationale: എബ്രായത്തിലെ പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘അവൻ മാത്രം’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: ബാലിനോടുള്ള വൈരുധ്യത്തിൽ യഹ്‌വെയെ സത്യദൈവമായി തിരിച്ചറിയുന്ന നിശ്ചിതരൂപമാണ്. മലയാളത്തിൽ ‘ദൈവം’ എന്നതാണ് സ്വാഭാവിക വിധേയനാമപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനുപകരം ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: יְהוָה הוּא הָאֱלֹהִים എന്ന പ്രഖ്യാപനത്തിലെ ഊന്നൽ
  choice: യഹ്‌വെ—അവനാണ് ദൈവം!
  alternative: യഹ്‌വെയാണ് ദൈവം!; യഹ്‌വെ മാത്രമാണ് ദൈവം!
  rationale: പ്രകടമായ הוּא എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘അവനാണ്’ എന്നു നിലനിർത്തുന്നു. ‘മാത്രമാണ്’ എന്നത് സന്ദർഭസൂചന വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിൽ പ്രത്യേകമായി ഇല്ലാത്ത പദം ചേർക്കുന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘മുഖം നിലത്താക്കി വീണു’ എന്ന പ്രയോഗം മൂലത്തിലെ ദൃശ്യത നിലനിർത്തുന്നു; ആവർത്തനവും ആശ്ചര്യചിഹ്നങ്ങളും ജനത്തിന്റെ ഉച്ചകോടിയായ പ്രഖ്യാപനത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
