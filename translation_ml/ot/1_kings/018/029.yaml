source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: ml
  text: ഉച്ച കഴിഞ്ഞപ്പോൾ, ധാന്യയാഗം അർപ്പിക്കുന്ന സമയംവരെ[b] അവർ പ്രവചിച്ചുകൊണ്ടിരുന്നു[a]. എന്നാൽ ഒരു ശബ്ദവും ഉണ്ടായില്ല; ഉത്തരം പറയാൻ ആരുമില്ലായിരുന്നു; ശ്രദ്ധിക്കാൻ ആരുമില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഉന്മാദാവസ്ഥയിൽ പെരുമാറിക്കൊണ്ടിരുന്നു.” ഇവിടെ എബ്രായപാഠം പ്രവചിക്കുക എന്നതിനുള്ള പതിവു ക്രിയയാണ് ഉപയോഗിക്കുന്നത്; ഈ സന്ദർഭത്തിൽ അത് ബാലിന്റെ പ്രവാചകന്മാരുടെ ആവേശഭരിതമായ പെരുമാറ്റത്തെ വിവരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ധാന്യയാഗം അർപ്പിക്കുന്ന സമയംവരെ” എന്നത് പതിവുള്ള സന്ധ്യായാഗത്തിന്റെ സമയംവരെ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: ഉച്ച കഴിഞ്ഞപ്പോൾ
  rationale: כ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന സമയബന്ധം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: וַיִּתְנַבְּאוּ
  choice: അവർ പ്രവചിച്ചുകൊണ്ടിരുന്നു
  rationale: נבא എന്ന സാധാരണ ‘പ്രവചിക്കുക’ എന്ന ക്രിയയുടെ Hitpael രൂപമാണിത്. സന്ദർഭത്തിലെ തുടർച്ചയായ ആവേശഭരിതമായ പ്രവൃത്തിയെ ‘-കൊണ്ടിരുന്നു’ വ്യക്തമാക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: ധാന്യയാഗം അർപ്പിക്കുന്നതുവരെ
  rationale: മിൻഹാ അർപ്പിക്കപ്പെടുന്നതിനെ പദസമീപമായി അവതരിപ്പിക്കുന്നു; ഇവിടെ ‘സന്ധ്യ’ എന്നത് മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ പ്രധാന വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וְאֵין קוֹל
  choice: ഒരു ശബ്ദവും ഉണ്ടായില്ല
  rationale: קוֹל എന്നത് ശബ്ദമോ സ്വരമോ ആകാം. പ്രതീക്ഷിച്ച ദൈവിക പ്രതികരണത്തിന്റെ യാതൊരു ശ്രാവ്യലക്ഷണവും ഇല്ലെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאֵין עֹנֶה
  choice: ഉത്തരം പറയാൻ ആരുമില്ലായിരുന്നു
  rationale: ഉത്തരം നൽകുന്ന ഒരാളും ഇല്ലെന്ന participial പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: וְאֵין קָשֶׁב
  choice: ശ്രദ്ധിക്കാൻ ആരുമില്ലായിരുന്നു
  rationale: קָשֶׁב സൂചിപ്പിക്കുന്ന ശ്രദ്ധിക്കലും ചെവികൊടുക്കലും വ്യക്തിപരമായ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മുൻപുള്ള രണ്ടു നിഷേധങ്ങളോടുള്ള ഉച്ചകോടിസദൃശമായ ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബാലിന്റെ പ്രവാചകന്മാരുടെ ആവേശഭരിതമായ പ്രവർത്തിയുടെ പരിഭാഷ
  choice: അവർ പ്രവചിച്ചുകൊണ്ടിരുന്നു
  alternative: അവർ ഉന്മാദാവസ്ഥയിൽ പെരുമാറിക്കൊണ്ടിരുന്നു
  rationale: എബ്രായത്തിൽ പ്രവചനത്തിനുള്ള പതിവു ക്രിയ തന്നെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. പ്രധാന വാചകത്തിൽ അതിന്റെ പദബന്ധം നിലനിർത്തുകയും, സന്ദർഭോചിതമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: מִנְחָה എന്നതിന്റെ സമയസൂചന
  choice: ധാന്യയാഗം അർപ്പിക്കുന്നതുവരെ
  alternative: പതിവുള്ള സന്ധ്യായാഗത്തിന്റെ സമയംവരെ
  rationale: മൂലപാഠം യാഗം അർപ്പിക്കുന്നതിനെ പറയുന്നു; അത് പതിവുള്ള സന്ധ്യായാഗത്തിന്റെ സമയത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘സന്ധ്യ’ ഇവിടെ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. എബ്രായത്തിലെ മൂന്നു തുടർച്ചയായ നിഷേധങ്ങളുടെ താളവും ശക്തിയും അർധവിരാമങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
