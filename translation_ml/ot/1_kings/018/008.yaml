source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഞാൻ തന്നെയാണ്[a]. നീ ചെന്ന് നിന്റെ യജമാനനോട്, ‘ഇതാ, ഏലിയാവ്’ എന്നു പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാനാണ്.” എബ്രായപാഠത്തിൽ ഊന്നലോടെയുള്ള “ഞാൻ” എന്ന സർവനാമം മാത്രമാണുള്ളത്; ഇവിടെ അത് സ്വയം തിരിച്ചറിയിക്കലായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ wayyiqtol രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനക്രമം നിലനിർത്താൻ ‘അവൻ പറഞ്ഞു’ എന്നു നൽകി.
- source_word: לוֹ
  choice: അവനോടു
  rationale: ל എന്ന ഉപസർഗവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אָנִי
  choice: ഞാൻ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമം ഇവിടെ ഊന്നലോടെയുള്ള സ്വയം തിരിച്ചറിയിക്കലാണ്; മുൻവാക്യത്തിലെ ഓബദ്യാവിന്റെ തിരിച്ചറിവിനുള്ള മറുപടിയായി മലയാളത്തിൽ ‘ഞാൻ തന്നെയാണ്’ സ്വാഭാവികമാണ്.
- source_word: לֵךְ
  choice: നീ ചെന്ന്
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; തുടർന്നുള്ള ‘പറയുക’ എന്ന ആജ്ഞയുമായി സ്വാഭാവികമായി ചേരാൻ ‘നീ ചെന്ന്’ എന്നു നൽകി.
- source_word: אֱמֹר
  choice: പറയുക
  rationale: אמר എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം; നേരിട്ടുള്ള സന്ദേശത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: לַאדֹנֶיךָ
  choice: നിന്റെ യജമാനനോട്
  rationale: ഇവിടെ אָדוֹן ദൈവത്തെ അല്ല, ഓബദ്യാവിന്റെ മനുഷ്യാധികാരിയായ ആഹാബിനെ സൂചിപ്പിക്കുന്നു; ‘യജമാനൻ’ ആ ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുള്ള കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് കണം; ആധുനിക മലയാളത്തിലും ഗൗരവമുള്ള ആഖ്യാനശൈലിയിലും ‘ഇതാ’ സ്വാഭാവികമാണ്.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: മനുഷ്യാധികാരിയെ സൂചിപ്പിക്കുന്ന אָדוֹן എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യജമാനൻ
  alternative: കർത്താവ് / നാഥൻ
  rationale: സന്ദർഭത്തിൽ പരാമർശിക്കുന്നത് ആഹാബ് എന്ന ഭൗമിക മേലധികാരിയെയാണ്; ‘യജമാനൻ’ ദൈവിക പദവിയുമായുള്ള ആശയക്കുഴപ്പം ഒഴിവാക്കി സേവക-യജമാന ബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ ശ്രദ്ധാകർഷക കണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘യജമാനൻ’ മനുഷ്യാധികാരിയെയും ദൈവിക പദവിയെയും വേർതിരിക്കുന്നു.
