  revised_text: അവർ നമുക്കായി രണ്ടു കാളകളെ നൽകട്ടെ. അവയിൽ ഒരു കാളയെ അവർ തങ്ങൾക്കായി തിരഞ്ഞെടുത്ത് കഷണങ്ങളാക്കി വിറകിന്മേൽ വെക്കട്ടെ; എന്നാൽ തീ വെക്കരുത്. മറ്റേ കാളയെ ഞാൻ ഒരുക്കി വിറകിന്മേൽ വെക്കും; ഞാനും തീ വെക്കുകയില്ല.
  revised_footnotes: []
  revision_rationale: ആദ്യ ക്രിയയെ മാത്രം ‘നൽകട്ടെ’ എന്നു തിരുത്തി എബ്രായത്തിലെ נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം പുനഃസ്ഥാപിച്ചു. ‘അവയിൽ ഒരു കാള,’ ‘മറ്റേ കാള,’ യാഗത്തിനായുള്ള ‘ഒരുക്കി,’ തീ വെക്കാതിരിക്കാനുള്ള ഇരുപക്ഷ വ്യവസ്ഥ എന്നിവ മൂലപാഠത്തോടും സ്വാഭാവിക മലയാളശൈലിയോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
