  naturalness: തിരുത്തിയ രൂപം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘വിറകിന്മേൽ’ എന്ന കൂട്ടനാമപ്രയോഗവും ‘തീ വെക്കരുത്/വെക്കുകയില്ല’ എന്ന സമാന്തരരൂപങ്ങളും വ്യക്തമാണ്.
  terminology: ‘കാളകൾ,’ ‘കഷണങ്ങളാക്കി,’ ‘വിറകിന്മേൽ,’ ‘ഒരുക്കി’ എന്നിവ യാഗസന്ദർഭത്തിന് യോജിച്ച, അമിത സാങ്കേതികതയില്ലാത്ത പദങ്ങളാണ്. മൂലത്തിൽ ഇല്ലാത്ത ‘അടിയിൽ’ ചേർക്കാതിരുന്നതു ശരിയാണ്; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
