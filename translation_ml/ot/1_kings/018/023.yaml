id: 1KI.18.23
reference: 1 Kings 18:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: ml
  text: അവർ നമുക്കായി രണ്ടു കാളകളെ നൽകട്ടെ. അവയിൽ ഒരു കാളയെ അവർ തങ്ങൾക്കായി തിരഞ്ഞെടുത്ത് കഷണങ്ങളാക്കി വിറകിന്മേൽ വെക്കട്ടെ; എന്നാൽ തീ വെക്കരുത്. മറ്റേ കാളയെ ഞാൻ ഒരുക്കി വിറകിന്മേൽ വെക്കും; ഞാനും തീ വെക്കുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: അവർ നമുക്കായി ... കൊണ്ടുവരട്ടെ
  rationale: സന്ദർഭത്തിൽ രണ്ടു കാളകളെ മത്സരത്തിനായി ലഭ്യമാക്കുക എന്നതാണ് ആശയം. മലയാളത്തിൽ ‘കൊണ്ടുവരട്ടെ’ സ്വാഭാവികമായി ഈ നിർദേശഭാവം നൽകുന്നു; ‘നൽകട്ടെ’ എന്നതിലേക്കാൾ സാഹചര്യത്തിന് യോജിച്ചതാണ്.
- source_word: שְׁנַיִם פָּרִים
  choice: രണ്ടു കാളകൾ
  rationale: പָּר യാഗസന്ദർഭത്തിലെ ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. പ്രായം പ്രത്യേകം പറയാത്തതിനാൽ ‘ഇളം കാളകൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: അവയിൽ ഒരു കാളയെ അവർ തങ്ങൾക്കായി തിരഞ്ഞെടുത്ത്
  rationale: לָהֶם എന്നത് മത്സരത്തിൽ തങ്ങളുടെ ഭാഗത്തേക്കുള്ള തിരഞ്ഞെടുപ്പാണെന്ന് വ്യക്തമാക്കുന്നു. രണ്ടു കാളകളിൽ ഒന്നെന്ന ബന്ധം ‘അവയിൽ ഒരു കാള’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וִינַתְּחֻהוּ
  choice: കഷണങ്ങളാക്കി
  rationale: נתח യാഗത്തിനായി മൃഗത്തെ ഭാഗങ്ങളായി മുറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കഷണങ്ങളാക്കി’ കൃത്യവും വായനാസൗകര്യമുള്ളതുമാണ്.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: വിറകിന്മേൽ വെക്കട്ടെ
  rationale: הָעֵצִים ഇവിടെ യാഗത്തിനായി അടുക്കിയ ഇന്ധനവിറകാണ്. ‘വിറക്’ എന്ന കൂട്ടനാമം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: എന്നാൽ തീ വെക്കരുത്
  rationale: എബ്രായം അക്ഷരാർഥത്തിൽ ‘തീ വെക്കരുത്’ എന്നാണ്. ‘അടിയിൽ’ എന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കാതെ, മലയാളത്തിൽ പൂർണവും സന്ദർഭോചിതവുമായ രൂപം നിലനിർത്തി.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: മറ്റേ കാളയെ ഞാൻ ഒരുക്കി
  rationale: യാഗമൃഗത്തോടൊപ്പം עשה ഉപയോഗിക്കുമ്പോൾ അതിനെ യാഗത്തിനായി ഒരുക്കുക എന്ന സന്ദർഭാർഥമുണ്ട്. ആദ്യത്തെ കാള അവർക്കായി തിരഞ്ഞെടുത്തതിനാൽ ശേഷിക്കുന്നതിനെ ‘മറ്റേ കാള’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: വിറകിന്മേൽ വെക്കും
  rationale: נתן ഇവിടെ വെക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്; മുൻവാക്യത്തോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: ഞാനും തീ വെക്കുകയില്ല
  rationale: ആദ്യ സംഘത്തിന് നൽകിയ വ്യവസ്ഥ ഏലിയാവും പാലിക്കുമെന്ന് ‘ഞാനും’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലില്ലാത്ത സ്ഥാനസൂചന ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യാഗത്തിനുള്ള ഒരുക്കത്തെ വിവരിക്കുന്ന ഭാഷയിൽ പിന്നീടുള്ള മതശാസ്ത്രപരമായ ആശയങ്ങൾ ചേർക്കാതിരിക്കൽ
  choice: മുറിക്കൽ, വിറകിന്മേൽ വെക്കൽ, തീ വെക്കാതിരിക്കൽ എന്നീ മൂർത്തമായ പ്രവൃത്തികൾ സാധാരണ ഭാഷയിൽ അവതരിപ്പിച്ചു
  alternative: സാങ്കേതികമായ യാഗപരിഭാഷകൾ ഉപയോഗിച്ച് ‘അർപ്പിക്കുക’ എന്നിങ്ങനെ വിവർത്തനം ചെയ്യുക
  rationale: വാക്യം കർമ്മേൽമലയിൽ നടക്കുന്ന പരീക്ഷയുടെ പ്രായോഗിക ഒരുക്കമാണ് വിവരിക്കുന്നത്; യാഗത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തവ്യാഖ്യാനം നൽകുന്നില്ല. അതിനാൽ മൂലപാഠം പറയുന്ന പ്രവൃത്തികളിലേക്കു മാത്രം വിവർത്തനം പരിമിതപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നവണ്ണം ഗൗരവമുള്ള സ്വാഭാവിക ശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ഇരുപക്ഷത്തിനുമുള്ള സമാന്തര വ്യവസ്ഥയും നിലനിർത്തി. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘അടിയിൽ’ എന്ന വിശദീകരണം ഒഴിവാക്കിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
