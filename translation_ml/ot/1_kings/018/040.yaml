reference: 1 Kings 18:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് അവരോടു പറഞ്ഞു: “ബാലിന്റെ പ്രവാചകന്മാരെ പിടികൂടുക; അവരിൽ ഒരാൾപോലും രക്ഷപ്പെടരുത്.” അവർ അവരെ പിടികൂടി; ഏലിയാവ് അവരെ കീശോൻ നീർച്ചാലിലേക്ക്[a] കൊണ്ടിറക്കി, അവിടെവെച്ച് അവരെ അറുത്തുകൊന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കീശോൻ തോട്” എന്നും വിവർത്തനം ചെയ്യാം. നാഹാൽ എന്ന ഹീബ്രുപദം ഒരു നീർച്ചാലിനെയോ തോടിനെയോ കാലാവസ്ഥാനുസൃതമായി വരണ്ടുകിടക്കുന്ന ഒഴുക്കുതാഴ്വരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  choice: പിടികൂടുക / പിടികൂടി
  rationale: תפשׂ എന്ന ക്രിയയുടെ ബലപ്രയോഗത്തോടെയുള്ള പിടിച്ചടക്കൽ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും കല്പനയിലും തുടർവിവരണത്തിലും പദസാമ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נְבִיאֵי הַבַּעַל
  choice: ബാലിന്റെ പ്രവാചകന്മാർ
  rationale: ഹീബ്രു സംയുക്തപദത്തിന്റെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; സംഘത്തിന്റെ തിരിച്ചറിയലിൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ വരുത്തുന്നില്ല.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: അവരിൽ ഒരാൾപോലും രക്ഷപ്പെടരുത്
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ‘ഒരാൾപോലും’ എന്നത് ലിംഗപരമായി അനാവശ്യമായി ചുരുക്കാതെ ‘not even one of them’ എന്ന ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיּוֹרִדֵם
  choice: അവരെ ... താഴേക്ക് കൊണ്ടുപോയി
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥവും സ്ഥലത്തിന്റെ താഴ്ന്ന ഭൂപ്രകൃതിയും സംരക്ഷിക്കുന്നു.
- source_word: נַחַל קִישׁוֹן
  choice: കീശോൻ നീർച്ചാൽ
  rationale: נַחַל എന്നത് നീരൊഴുക്കിനെയോ അതിന്റെ ചാലിനെയോ കാലാവസ്ഥാനുസൃതമായി വരണ്ടുകിടക്കുന്ന താഴ്വരയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ വായനാസൗകര്യമുള്ള ‘നീർച്ചാൽ’ ഉപയോഗിച്ച് പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשְׁחָטֵם
  choice: അറുത്തുകൊന്നു
  rationale: שׁחט എന്ന ക്രിയയുടെ അറുക്കൽ/കശാപ്പ് എന്ന ശക്തവും ഹിംസാത്മകവുമായ അർഥം ‘കൊന്നു’ എന്നു മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: שָׁם
  choice: അവിടെവെച്ച്
  rationale: ലളിതമായ സ്ഥലസൂചകത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ബാലിന്റെ പ്രവാചകന്മാർക്കെതിരായ ഹിംസാത്മക നടപടി
  choice: ഏലിയാവ് അവരെ ‘അറുത്തുകൊന്നു’ എന്ന് സംഭവം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘വധിച്ചു’ അല്ലെങ്കിൽ ‘കൊന്നുകളഞ്ഞു’ എന്നു മൃദുവാക്കുക; അതല്ലെങ്കിൽ ദൈവിക അനുമതി സൂചിപ്പിക്കുന്ന വിശദീകരണം ചേർക്കുക.
  rationale: ഹീബ്രു വാചകം പിടികൂടലും അറുത്തുകൊല്ലലും വ്യക്തമായി വിവരിക്കുന്നു. അതിന്റെ കാഠിന്യം മറയ്ക്കാതെയും ഈ വാക്യം പ്രസ്താവിക്കാത്ത ദൈവശാസ്ത്രപരമായ ന്യായീകരണം ചേർക്കാതെയും വിവർത്തനം ചെയ്യണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. കല്പനയുടെ അടിയന്തരതയും അവസാന ക്രിയയുടെ ഹിംസാത്മക ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു; ഭൂപ്രകൃതിപദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
