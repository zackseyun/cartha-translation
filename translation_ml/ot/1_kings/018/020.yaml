source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אַחְאָ֖ב בְּ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקְבֹּ֥ץ אֶת הַ/נְּבִיאִ֖ים אֶל הַ֥ר הַ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: ml
  text: അങ്ങനെ ആഹാബ് എല്ലാ ഇസ്രായേൽമക്കൾക്കും[a] ആളയച്ച് പ്രവാചകന്മാരെ കർമ്മേൽമലയിലേക്കു കൂട്ടിച്ചേർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ ഇസ്രായേല്യർക്കും.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘എല്ലാ ഇസ്രായേൽമക്കൾക്കും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ രാജാവ് ആളുകളെത്തന്നെ അയച്ചുവെന്നല്ല, അറിയിപ്പുമായി ദൂതന്മാരെ അയച്ചുവെന്ന സ്വാഭാവിക ആശയം മലയാളത്തിൽ ‘ആളയച്ചു’ വ്യക്തമാക്കുന്നു; ‘വിളിച്ചുകൂട്ടി’ എന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കൾക്കും
  rationale: בְּ ഇവിടെ അയയ്ക്കലിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്നു. בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ ഹീബ്രു പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തി; സ്വാഭാവിക മലയാള വാക്യഘടനയ്ക്കായി ‘-ക്കും’ ഉപയോഗിച്ചു.
- source_word: וַיִּקְבֹּץ
  choice: കൂട്ടിച്ചേർത്തു
  rationale: קבץ എന്നതിന്റെ ‘കൂട്ടുക, ഒരുമിച്ചുചേർക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ഇവിടെ പ്രവാചകന്മാരെ ഒരു സ്ഥലത്ത് സമ്മേളിപ്പിച്ചതാണ് ഉദ്ദേശ്യം.
- source_word: הַנְּבִיאִים
  choice: പ്രവാചകന്മാരെ
  rationale: נביאים എന്ന സാധാരണ ബഹുവചന പദത്തിന്റെ നിലവാരമുള്ള മലയാള പരിഭാഷ.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: കർമ്മേൽമലയിൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ הַר എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘കർമ്മേൽമല’ എന്നാണ്. ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനത്തെ മലയാളത്തിൽ സമ്മേളനസ്ഥലമായി ‘-യിൽ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘ഇസ്രായേൽമക്കൾ’ എന്നത് മൂലഭാഷയിലെ കുടുംബബന്ധപരമായ പ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
