id: 1KI.18.34
reference: 1 Kings 18:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “നാലു കുടങ്ങളിൽ[a] വെള്ളം നിറച്ച് ഹോമയാഗത്തിന്മേലും വിറകിന്മേലും ഒഴിക്കുവിൻ.” പിന്നെ അവൻ പറഞ്ഞു: “രണ്ടാം പ്രാവശ്യവും അങ്ങനെ ചെയ്യുവിൻ.” അവർ രണ്ടാം പ്രാവശ്യവും അങ്ങനെ ചെയ്തു. പിന്നെ അവൻ പറഞ്ഞു: “മൂന്നാം പ്രാവശ്യവും അങ്ങനെ ചെയ്യുവിൻ.” അവർ മൂന്നാം പ്രാവശ്യവും അങ്ങനെ ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നാലു ജലപാത്രങ്ങളിൽ”; ദ്രാവകങ്ങൾ കൊണ്ടുപോകാൻ ഉപയോഗിച്ചിരുന്ന ഒരു പാത്രത്തെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത പ്രവൃത്തിയെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִלְאוּ
  choice: നിറച്ച്
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തെ തുടർന്നുവരുന്ന ഒഴിക്കൽപ്രവൃത്തിയുമായി ചേർത്ത് സ്വാഭാവികമായ മലയാള ആജ്ഞാവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: אַרְבָּעָה כַדִּים
  choice: നാലു കുടങ്ങളിൽ
  rationale: כַּדִּים ദ്രാവകം കൊണ്ടുപോകാൻ ഉപയോഗിക്കുന്ന കുടങ്ങളെയോ സമാന പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘കുടങ്ങൾ’ വ്യക്തവും അതിന്റെ രൂപം അനാവശ്യമായി നിർണയിക്കാത്തതുമാണ്.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: സാധാരണ ഹീബ്രു നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: וְיִצְקוּ
  choice: ഒഴിക്കുവിൻ
  rationale: ശ്രോതാക്കളോടുള്ള ബഹുവചന ആജ്ഞയെ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; വെള്ളമാണ് ഒഴിക്കപ്പെടുന്നതെന്ന് മുൻവാക്യഭാഗത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: עַל הָעֹלָה
  choice: ഹോമയാഗത്തിന്മേൽ
  rationale: עֹלָה എന്ന യാഗപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ തത്തുല്യം; עַל എന്നതിന്റെ സ്ഥലസംബന്ധമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: וְעַל הָעֵצִים
  choice: വിറകിന്മേൽ
  rationale: യാഗത്തിനായി ക്രമപ്പെടുത്തിയ കത്തിക്കാനുള്ള മരം എന്ന സന്ദർഭാർഥം ‘വിറക്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: രണ്ടാം പ്രാവശ്യവും അങ്ങനെ ചെയ്യുവിൻ / അവർ രണ്ടാം പ്രാവശ്യവും അങ്ങനെ ചെയ്തു
  rationale: ആവർത്തനത്തോടൊപ്പം എണ്ണപ്പെട്ട രണ്ടാം തവണ എന്ന പുരോഗതിയും കല്പന-നിവർത്തന സമാന്തരതയും വ്യക്തമാക്കുന്നു.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: മൂന്നാം പ്രാവശ്യവും അങ്ങനെ ചെയ്യുവിൻ / അവർ മൂന്നാം പ്രാവശ്യവും അങ്ങനെ ചെയ്തു
  rationale: മൂന്നാം തവണ ചെയ്യാനുള്ള കല്പനയും അതിന്റെ നിവർത്തനവും ഹീബ്രുവിലെ ആവർത്തിത ഘടന അനുസരിച്ച് നൽകുന്നു.
theological_decisions:
- issue: עֹלָה എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: ഹോമയാഗം
  alternative: സമ്പൂർണ ദഹനയാഗം
  rationale: ഈ പദം തീയിൽ പൂർണമായി അർപ്പിക്കപ്പെടുന്ന ഇസ്രായേല്യ യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ഹോമയാഗം’ മലയാളത്തിൽ സ്ഥാപിതവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ്; മൂലവാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. കല്പനകളിൽ ബഹുവചനത്തെ വ്യക്തമാക്കാൻ ‘ഒഴിക്കുവിൻ/ചെയ്യുവിൻ’ നിലനിർത്തി; ആവർത്തനത്തിന്റെ രണ്ടാം-മൂന്നാം ഘട്ടങ്ങൾ ഹീബ്രു ഘടനയോട് ചേർന്ന് സമാന്തരമായി അവതരിപ്പിച്ചു.
