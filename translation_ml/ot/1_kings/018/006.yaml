source:
  edition: WLC
  text: וַֽ/יְחַלְּק֥וּ לָ/הֶ֛ם אֶת הָ/אָ֖רֶץ לַֽ/עֲבָר בָּ֑/הּ אַחְאָ֞ב הָלַ֨ךְ בְּ/דֶ֤רֶךְ אֶחָד֙ לְ/בַדּ֔/וֹ וְ/עֹֽבַדְיָ֛הוּ הָלַ֥ךְ בְּ/דֶרֶךְ אֶחָ֖ד לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: ml
  text: അങ്ങനെ, ദേശത്തിലൂടെ കടന്നുപോകാനായി അവർ ദേശം തങ്ങൾക്കിടയിൽ വിഭജിച്ചു. ആഹാബ് തനിച്ച് ഒരു വഴിക്കു പോയി; ഓബദ്യാവ് തനിച്ച് മറ്റൊരു വഴിക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായമൂലത്തിൽ ഇരുവരെയും കുറിച്ച് അക്ഷരാർഥത്തിൽ ഒരേ പദപ്രയോഗമാണ് ആവർത്തിക്കുന്നത്: “ആഹാബ് തനിച്ച് ഒരു വഴിക്കു പോയി; ഓബദ്യാവ് തനിച്ച് ഒരു വഴിക്കു പോയി.” വേറിട്ട വഴികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ രണ്ടാമത്തെ ഭാഗത്ത് “മറ്റൊരു വഴിക്കു” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: അവർ അത് തങ്ങൾക്കിടയിൽ വിഭജിച്ചു
  rationale: പീയേൽ ക്രിയയായ חלק സജീവമായി വിഭജിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; לָהֶם ഇവിടെ രണ്ടുപേർക്കുമിടയിലെ വിതരണാർഥം നൽകുന്നു.
- source_word: אֶת הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אֶרֶץ അവർ സഞ്ചരിച്ചു പരിശോധിക്കാനിരുന്ന പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; 'ദേശം' സ്വാഭാവികവും വിശാലവുമായ മലയാള പദമാണ്.
- source_word: לַעֲבָר בָּהּ
  choice: ദേശത്തിലൂടെ കടന്നുപോകേണ്ടതിന്
  rationale: עבר എന്ന ധാതുവിന്റെ infinitive construct, בָּהּ സഹിതം, ദേശത്തിനുള്ളിലൂടെ സഞ്ചരിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: הָלַךְ
  choice: പോയി
  rationale: വഴിയോ ദിശയോ വിവരിക്കുന്ന ഈ ആഖ്യാനസന്ദർഭത്തിൽ 'പോയി' സ്വാഭാവികമാണ്; കാൽനടയായി മാത്രമാണ് പോയതെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ഒരു വഴിക്കു / മറ്റൊരു വഴിക്കു
  rationale: എബ്രായത്തിൽ ഇരു ഭാഗത്തും 'ഒരു വഴി' എന്ന് ആവർത്തിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ രണ്ടാമത്തെ പദപ്രയോഗം 'മറ്റൊരു വഴി' എന്നാക്കുന്നത് വേറിട്ട വഴികളിലൂടെയുള്ള യാത്ര വ്യക്തമാക്കുന്നു.
- source_word: לְבַדּוֹ
  choice: തനിച്ച്
  rationale: ഓരോരുത്തരും വേർപിരിഞ്ഞാണ് പോയതെന്ന ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחְאָב / עֹבַדְיָהוּ
  choice: ആഹാബ് / ഓബദ്യാവ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ക്രമവും ആവർത്തനത്തിന്റെ അർഥവും കഴിയുന്നത്ര സംരക്ഷിച്ചുകൊണ്ട്, മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടാമത്തെ 'ഒരു വഴി' എന്നത് 'മറ്റൊരു വഴി' എന്നു നൽകി.
