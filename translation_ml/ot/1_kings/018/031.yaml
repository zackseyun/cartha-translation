  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: ml
  text: 'ഏലീയാവ് യാക്കോബിന്റെ പുത്രന്മാരുടെ[a] ഗോത്രങ്ങളുടെ എണ്ണത്തിനൊത്ത പന്ത്രണ്ട് കല്ലുകൾ എടുത്തു. യഹോവ യാക്കോബിനോട് അരുളിച്ചെയ്തിരുന്നു: “ഇസ്രായേൽ ആയിരിക്കും നിന്റെ പേര്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാക്കോബിന്റെ മക്കളുടെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “യാക്കോബിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: യാക്കോബിന് ദൈവം “ഇസ്രായേൽ” എന്നു പേരിട്ട ഉല്പത്തി 32:28; 35:10 എന്നീ ഭാഗങ്ങളെ ഇത് അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം; കല്ലുകൾ ശേഖരിച്ച് എടുക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം.
- source_word: אֵלִיָּהוּ
  choice: ഏലീയാവ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: പന്ത്രണ്ടു കല്ലുകൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട്, സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כְּמִסְפַּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: כְּ എന്ന താരതമ്യ/അനുരൂപതാസൂചനയും מִסְפָּר എന്ന ‘എണ്ണം’ എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְטֵי
  choice: ഗോത്രങ്ങളുടെ
  rationale: ദേശീയ-വംശാവലിപരമായ ഈ സന്ദർഭത്തിൽ שׁבט എന്ന പദത്തിന്റെ സ്ഥിരവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: בְנֵי יַעֲקֹב
  choice: യാക്കോബിന്റെ പുത്രന്മാരുടെ
  rationale: എബ്രായത്തിലെ ലിംഗസൂചകമായ കുടുംബപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; വിശാലാർഥമായ ‘മക്കൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: യാക്കോബിനോട് യഹോവയുടെ അരുളപ്പാട് ഉണ്ടായത്
  rationale: ഏകവചന സർവനാമത്തിന്റെ സൂചിതപദം യാക്കോബ് ആണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ദൈവിക വചനസംഭവത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇങ്ങനെയായിരുന്നു:'
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന എബ്രായപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: ഇസ്രായേൽ എന്നായിരിക്കും നിന്റെ പേര്
  rationale: ‘ഇസ്രായേൽ’ എന്ന പദത്തിന്റെ ആരംഭസ്ഥാനത്തെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് പേരിടൽപ്രഖ്യാപനത്തിന്റെ ഭാവാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: אֲשֶׁר ... אֵלָיו എന്ന ബന്ധവാക്യത്തിന്റെ സൂചിതപദം
  choice: അരുളപ്പാട് ലഭിച്ച വ്യക്തി യാക്കോബ് എന്നു വ്യക്തമായി അവതരിപ്പിച്ചു
  alternative: ബന്ധവാക്യം ‘പുത്രന്മാർ/ഗോത്രങ്ങൾ’ എന്നതിനോട് ചേർന്നതായി തോന്നാവുന്ന വിധം അക്ഷരക്രമത്തിൽ നിലനിർത്തുക
  rationale: אֵלָיו ഏകവചനമാണ്; തുടർന്നുള്ള ‘ഇസ്രായേൽ എന്നായിരിക്കും നിന്റെ പേര്’ എന്ന വാക്കുകൾ യാക്കോബിന്റെ പേരുമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വ്യാകരണപരവും അന്തർപാഠപരവുമായ സൂചന പിന്തുടർന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം നിലനിർത്താൻ ആദ്യവാക്യത്തിൽ ദീർഘവിരാമം ഉപയോഗിച്ചു. ‘അരുളപ്പാട്’ എന്ന പദം ദൈവത്തിൽനിന്നുള്ള വചനത്തെ സാധാരണ വായനക്കാരന് വ്യക്തവും മാന്യവുമായി അറിയിക്കുന്നു.
