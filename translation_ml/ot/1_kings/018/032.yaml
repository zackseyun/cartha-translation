language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: ml
  text: അവൻ ആ കല്ലുകൾകൊണ്ട് യാഹ്‌വേയുടെ നാമത്തിൽ ഒരു യാഗപീഠം പണിതു. യാഗപീഠത്തിനു ചുറ്റും രണ്ടു സെയാ വിത്തിന്റെ അളവിനൊത്ത[a] ഒരു കിടങ്ങും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ പ്രയോഗം: ‘രണ്ടു സെയാ വിത്തിന്റെ അളവുപോലെ.’ ഈ ദുഷ്കരമായ പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അത് കിടങ്ങിന്റെ വലുപ്പത്തെയോ ഉൾക്കൊള്ളാവുന്ന അളവിനെയോ സൂചിപ്പിക്കാം.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: അവൻ ആ കല്ലുകൾകൊണ്ട് ഒരു യാഗപീഠം പണിതു
  rationale: എബ്രായത്തിലെ ‘കല്ലുകളെ യാഗപീഠമായി പണിതു’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഉപകരണാർഥത്തിൽ അവതരിപ്പിക്കുന്നു; മുൻവാക്യത്തിൽനിന്ന് ‘പുനർനിർമിച്ചു’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: בְּשֵׁם יְהוָה
  choice: യാഹ്‌വേയുടെ നാമത്തിൽ
  rationale: בְּשֵׁם എന്നതിന്റെ സ്വാഭാവികമായ ‘നാമത്തിൽ’ എന്ന അർഥവും ദൈവനാമത്തിന്റെ വ്യക്തിത്വവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: ഒരു കിടങ്ങും ഉണ്ടാക്കി
  rationale: תְּעָלָה യാഗപീഠത്തിനു ചുറ്റുമുള്ള കിടങ്ങിനെയോ ചാലിനെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കിടങ്ങ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: രണ്ടു സെയാ വിത്തു കൊള്ളുന്നതുപോലെയുള്ള
  rationale: ദുഷ്കരവും സംക്ഷിപ്തവുമായ എബ്രായപ്രയോഗത്തിലെ അളവ്/ഉൾക്കൊള്ളൽ ആശയം നിലനിർത്തുന്നു; കൃത്യമായ ആധുനിക അളവ് നിർബന്ധിച്ച് ചേർക്കാതെ പുരാതന ഏകകമായ ‘സെയാ’ സൂക്ഷിക്കുന്നു.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനു ചുറ്റും
  rationale: ചുറ്റിയുള്ള സ്ഥാനം ലളിതവും കൃത്യവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’യെക്കാൾ മൂലോച്ചാരണത്തോട് അടുത്ത രൂപമാണ് ‘യാഹ്‌വേ’.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘യാഗപീഠം’, ‘കിടങ്ങ്’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; പുരാതന അളവായ ‘സെയാ’ അടിക്കുറിപ്പോടുകൂടെ നിലനിർത്തി.
