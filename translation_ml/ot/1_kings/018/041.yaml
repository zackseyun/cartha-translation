translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പെരുമഴയുടെ ഇരമ്പൽ’ മൂലത്തിലെ ശ്രാവ്യചിത്രം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് പദാനുസൃത രൂപവും പദസമുച്ചയത്തിന്റെ അർത്ഥവ്യാപ്തിയും രേഖപ്പെടുത്തുന്നു.
