base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: ml
  text: 'ഏലിയാവ് ആഹാബിനോടു പറഞ്ഞു: “കയറിച്ചെന്ന് തിന്നുകയും കുടിക്കയും ചെയ്യുക; കാരണം പെരുമഴയുടെ മുഴക്കത്തിന്റെ ശബ്ദമുണ്ട്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “മഴയുടെ ഇരമ്പലിന്റെ ശബ്ദം.” എബ്രായപ്രയോഗം സംക്ഷിപ്തവും സജീവവുമാണ്; ‘ഇരമ്പൽ’ എന്നത് മഴയുടെ മുഴക്കത്തെയോ സമൃദ്ധിയെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ’ ചേർക്കാതെ ക്രിയാരൂപം സ്വാഭാവികമായി ആ തുടർച്ച നൽകുന്നു.
- source_word: אֵלִיָּהוּ לְאַחְאָב
  choice: ഏലിയാവ് ആഹാബിനോടു
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപങ്ങളിൽ നൽകി; לְ സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-നോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: עֲלֵה
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്നതിന്റെ ഉയരത്തിലേക്കുള്ള ചലനം നിലനിർത്തുകയും തുടർന്നുള്ള ആജ്ഞകളുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱכֹל וּשְׁתֵה
  choice: ഭക്ഷിച്ചു പാനം ചെയ്യുക
  rationale: രണ്ട് ആജ്ഞകളെയും ചുരുക്കാതെ നിലനിർത്തുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ പ്രയോഗം.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമം
  rationale: മുൻ ആജ്ഞയ്ക്കുള്ള കാരണം പിന്നാലെ വരുന്നു; മലയാളത്തിൽ അർധവിരാമം ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: പെരുമഴയുടെ ഇരമ്പൽ
  rationale: קוֹל എന്ന ‘ശബ്ദ’ ആശയവും הֲמוֹן എന്ന ‘ഇരമ്പൽ/കോലാഹലം/സമൃദ്ധി’യുടെ സജീവതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വെറും മഴയുടെ അളവായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
