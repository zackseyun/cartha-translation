  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: ml
  text: യഹ്‌വേ, എനിക്ക് ഉത്തരമരുളേണമേ; എനിക്ക് ഉത്തരമരുളേണമേ. അങ്ങനെ, അങ്ങ്, യഹ്‌വേ, ദൈവം[a] ആണെന്നും അങ്ങുതന്നെ അവരുടെ ഹൃദയത്തെ[b] തിരികെ തിരിച്ചിരിക്കുന്നതെന്നും ഈ ജനം അറിയട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ്, യഹ്‌വേ, ആ ദൈവം തന്നെയാണ്.”
    reason: ഹീബ്രുവിലെ הָאֱלֹהִים എന്ന രൂപത്തിലെ നിർദേശകാവയവത്തെ കൂടുതൽ അക്ഷരാർഥത്തിൽ പ്രകടിപ്പിക്കുന്ന വിവർത്തനസാധ്യത.
  - marker: b
    text: ഹീബ്രുവിൽ “അവരുടെ ഹൃദയം” എന്നു ഏകവചനത്തിലാണ്; ജനത്തെ ഒന്നാകെ കാണുന്ന ഒരു സമൂഹപ്രയോഗമാണിത്. “അവരുടെ ഹൃദയങ്ങളെ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: മൂലപാഠത്തിലെ ഏകവചനരൂപവും മലയാളത്തിലെ ബഹുവചന വിവർത്തനസാധ്യതയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: עֲנֵנִי
  choice: എനിക്ക് ഉത്തരമരുളേണമേ
  rationale: പ്രാർഥനാസന്ദർഭത്തിൽ ദൈവം പ്രവൃത്തിയിലൂടെ പ്രതികരിക്കണമെന്ന അപേക്ഷയാണ്; ആവർത്തനം ഊന്നലോടെ അതേപടി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ ശബ്ദരൂപം അവതരിപ്പിക്കുന്നു.
- source_word: וְיֵדְעוּ
  choice: അങ്ങനെ ... അറിയട്ടെ
  rationale: ഇവിടെയുള്ള സംയോജകവും അപൂർണ്ണക്രിയയും ഏലിയാവിന്റെ അപേക്ഷയുടെ ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: ഏകവചനത്തിലുള്ള സമൂഹവാചകമായ עם എന്ന പദത്തിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: അങ്ങ്, യഹ്‌വേ, ദൈവം ആണെന്ന്
  rationale: ബാലിനോടുള്ള വൈരുധ്യത്തിൽ യഹ്‌വേ തന്നെയാണ് ദൈവം എന്ന തിരിച്ചറിയലാണ് വാക്യം ഉറപ്പിക്കുന്നത്; ഹീബ്രു നിർദേശകാവയവം അനുവദിക്കുന്ന ‘ആ ദൈവം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הֲסִבֹּתָ
  choice: തിരികെ കൊണ്ടുവന്നത്
  rationale: ഹിഫീൽ രൂപത്തിലെ കാരണകർത്തൃത്വവും പൂർത്തിയായ ദൈവിക പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת לִבָּם
  choice: അവരുടെ ഹൃദയത്തെ
  rationale: ബഹുവചന ഉടമസ്ഥപ്രത്യയത്തോടുകൂടിയ ഏകവചന ‘ഹൃദയം’ എന്ന ഹീബ്രു സമൂഹപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: אֲחֹרַנִּית
  choice: തിരികെ
  rationale: മടക്കം അഥവാ തിരിച്ചുവരവ് എന്ന ആശയം അനാവശ്യമായി പ്രത്യേക ലക്ഷ്യസ്ഥാനം ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: ജനത്തിന്റെ മടങ്ങിവരവിലുള്ള ദൈവിക പ്രവർത്തനം
  choice: അങ്ങുതന്നെയാണ് അവരുടെ ഹൃദയത്തെ തിരികെ കൊണ്ടുവന്നത്
  alternative: അങ്ങ് അവരുടെ ഹൃദയത്തെ തിരികെ കൊണ്ടുവരുന്നു
  rationale: പൂർണ്ണക്രിയയെ പൂർത്തിയായ പ്രവർത്തനമായി അവതരിപ്പിക്കുകയും ജനത്തിന്റെ മടങ്ങിവരവിൽ ദൈവത്തിനുള്ള ശക്തമായ കാരണകർത്തൃത്വം നിലനിർത്തുകയും ചെയ്യുന്നു; അതിൽനിന്ന് വിപുലമായ ഒരു സിദ്ധാന്തവ്യവസ്ഥ നിർബന്ധിച്ച് കണ്ടെത്തുന്നില്ല.
- issue: הָאֱלֹהִים എന്നതിലെ നിർദേശകാവയവം
  choice: ദൈവം
  alternative: ആ ദൈവം
  rationale: പ്രധാനപാഠത്തിൽ മലയാളത്തിലെ സ്വാഭാവികമായ തിരിച്ചറിയൽവാക്യം ഉപയോഗിക്കുന്നു; എന്നാൽ നിർദേശകാവയവത്തെ കൂടുതൽ പ്രത്യക്ഷമായി പ്രകടിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രാർഥനാഭാവം നിലനിർത്താൻ ‘അങ്ങ്’, ‘ഉത്തരമരുളേണമേ’ എന്നിവ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനവും ദൈവിക കാരണകർത്തൃത്വവും കൂട്ടായ ഏകവചനമായ ‘ഹൃദയം’ എന്ന രൂപവും സംരക്ഷിച്ചു.
