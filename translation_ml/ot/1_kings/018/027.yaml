  source_fidelity: 'മുഖ്യവാചകം എബ്രായത്തിലെ ക്രമവും പരിഹാസഭാവവും നന്നായി കൈവരിക്കുന്നു: ഉച്ചസമയം, ഏലിയാവിന്റെ പരിഹാസം, ഉച്ചത്തിൽ വിളിക്കാനുള്ള കല്പന, ബാലിനെ പരിഹാസത്തോടെ ‘ഒരു ദേവൻ’ എന്നു വിളിക്കുന്നത്, ചിന്ത/മാറിപ്പോക്ക്/യാത്ര/ഉറക്കം എന്നീ സാധ്യതകൾ എല്ലാം സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. שִׂיג לוֹ എന്ന പരോക്ഷപ്രയോഗവും അടിക്കുറിപ്പിൽ സാധ്യതാപരമായ വ്യക്തമായ അർത്ഥവും ഉചിതമാണ്.'
  naturalness: ‘അവൻ ഉറങ്ങുകയായിരിക്കും; അവൻ ഉണരും’ എന്ന അവസാനഭാഗം മലയാളത്തിൽ അല്പം മുറിഞ്ഞതുപോലെ കേൾക്കുന്നു. ‘പിന്നെ ഉണരും’ എന്നു ചേർക്കുന്നത് എബ്രായ വാക്യബന്ധം നഷ്ടപ്പെടുത്താതെ കൂടുതൽ സ്വാഭാവികമാക്കുന്നു. ‘ഒന്നു മാറിനിന്നിരിക്കാം’ എന്നത് പ്രധാനപാഠത്തിലെ പരോക്ഷത നിലനിർത്തിക്കൊണ്ട് ‘gone aside’ എന്ന ആശയം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
