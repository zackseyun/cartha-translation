source:
  edition: WLC
  text: וַ/יְהִ֨י בַֽ/צָּהֳרַ֜יִם וַ/יְהַתֵּ֧ל בָּ/הֶ֣ם אֵלִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ קִרְא֤וּ בְ/קוֹל גָּדוֹל֙ כִּֽי אֱלֹהִ֣ים ה֔וּא כִּ֣י שִׂ֧יחַ וְ/כִֽי שִׂ֛יג ל֖/וֹ וְ/כִֽי דֶ֣רֶךְ ל֑/וֹ אוּלַ֛י יָשֵׁ֥ן ה֖וּא וְ/יִקָֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: ml
  text: 'ഉച്ചയായപ്പോൾ ഏലിയാവ് അവരെ പരിഹസിച്ചുകൊണ്ട് പറഞ്ഞു: “ഉച്ചത്തിൽ വിളിക്കൂ! അവൻ ഒരു ദേവനാണല്ലോ. ഒരുപക്ഷേ അവൻ ആലോചനയിൽ മുഴുകിയിരിക്കാം; അല്ലെങ്കിൽ ഒന്നു മാറിനിന്നിരിക്കാം[a]; അതുമല്ലെങ്കിൽ യാത്രയിലായിരിക്കാം. ഒരുപക്ഷേ അവൻ ഉറങ്ങുകയായിരിക്കും; പിന്നെ ഉണരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ ശരീരവിസർജനത്തിന് പോയിരിക്കാം.” എബ്രായ പ്രയോഗം ഒരുപക്ഷേ ഒരു സൗമ്യോക്തിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: ഉച്ചയായപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും സമയസൂചന വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: അവരെ പരിഹസിച്ചുകൊണ്ട്
  rationale: ക്രിയയിലെ നിന്ദാപരമായ പരിഹാസഭാവം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: ഉച്ചത്തിൽ വിളിക്കൂ
  rationale: കല്പനയുടെ ശക്തിയും വലിയ ശബ്ദത്തിൽ വിളിക്കുക എന്ന അർത്ഥവും മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: כִּי אֱלֹהִים הוּא
  choice: അവൻ ഒരു ദേവനാണല്ലോ
  rationale: ഇവിടെ ബാൽ എന്ന വിജാതീയദേവനെക്കുറിച്ചുള്ള ഏലിയാവിന്റെ പരിഹാസവാക്കുകളാണ്; ‘-ല്ലോ’ പരിഹാസസന്ദർഭത്തിലെ ഊന്നൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: שִׂיחַ
  choice: അവൻ ആലോചനയിൽ മുഴുകിയിരിക്കാം
  rationale: അന്തരംഗചിന്തയിലോ ധ്യാനത്തിലോ മുഴുകിയിരിക്കുന്നതെന്ന സാധ്യത നൽകുന്നു; അപൂർവമായ പദത്തെ അനാവശ്യമായി കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: שִׂיג לוֹ
  choice: ഒന്നു മാറിപ്പോയിരിക്കാം
  rationale: എബ്രായത്തിലെ പരോക്ഷവും സാധ്യതയുള്ള സൗമ്യോക്തിപരവുമായ ഭാഷ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: דֶרֶךְ לוֹ
  choice: യാത്രയിലായിരിക്കാം
  rationale: വഴിയിലോ യാത്രയിലോ ആയിരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: ഒരുപക്ഷേ അവൻ ഉറങ്ങുകയായിരിക്കും; അവൻ ഉണരും
  rationale: പരിഹാസപരമായ സാധ്യതാസൂചനയും തുടർന്ന് വരുന്ന അകർമകമായ ‘ഉണരുക’ എന്ന ക്രിയയും വ്യാഖ്യാനാത്മകമായി ‘ഉണർത്തണം’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബാലിനെ സൂചിപ്പിക്കുന്ന אֱלֹהִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഒരു ദേവൻ
  alternative: ദൈവം
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ ദൈവത്തെക്കുറിച്ചുള്ള വിശ്വാസപ്രഖ്യാപനമല്ല, ബാലിനെക്കുറിച്ചുള്ള പരിഹാസമാണ്. അതിനാൽ അനിർദിഷ്ടമായ ‘ഒരു ദേവൻ’ എന്നത് സന്ദർഭവും പരിഹാസവും സംരക്ഷിക്കുന്നു.
- issue: שִׂיג לוֹ എന്ന സൗമ്യോക്തിപരമായ പ്രയോഗം
  choice: ഒന്നു മാറിപ്പോയിരിക്കാം
  alternative: ശരീരവിസർജനത്തിനു പോയിരിക്കാം
  rationale: മൂലത്തിലെ പരോക്ഷത പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും സാധ്യതയുള്ള വ്യക്തമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഏലിയാവിന്റെ പരിഹാസം ‘ദേവനാണല്ലോ’ എന്ന രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു; അപൂർവമായ എബ്രായ പ്രയോഗത്തിന്റെ പരോക്ഷത പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
