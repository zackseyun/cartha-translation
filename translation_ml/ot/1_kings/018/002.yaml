translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പ്രതിഫലനാത്മക പ്രയോഗവും പശ്ചാത്തലവാക്യത്തിന്റെ സ്വഭാവവും നിലനിർത്തി; ശമര്യ നഗരം ആണോ വിശാലപ്രദേശം ആണോ എന്നത് അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
