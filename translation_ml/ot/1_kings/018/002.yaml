source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ אֵֽלִיָּ֔הוּ לְ/הֵרָא֖וֹת אֶל אַחְאָ֑ב וְ/הָ/רָעָ֖ב חָזָ֥ק בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: ml
  text: അങ്ങനെ ഏലിയാവ് ആഹാബിന്റെ മുമ്പാകെ പ്രത്യക്ഷപ്പെടാൻ[a] പോയി. ശമര്യയിൽ ക്ഷാമം രൂക്ഷമായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആഹാബിന് തന്നെത്തന്നെ കാണിക്കാനായി’ അല്ലെങ്കിൽ ‘ആഹാബിന്റെ മുമ്പാകെ തന്നെത്തന്നെ അവതരിപ്പിക്കാനായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശമര്യയിൽ ക്ഷാമം അതിതീവ്രമായിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ ... പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുകയും മുൻവാക്യത്തിലെ കല്പനയോടുള്ള പ്രതികരണം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘അങ്ങനെ’ ഈ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: ആഹാബിനു തന്നെത്താൻ കാണിക്കാനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ അനന്തക്രിയ ഇവിടെ ‘പ്രത്യക്ഷപ്പെടുക/തന്നെത്താൻ കാണിക്കുക’ എന്ന പ്രതിഫലനാത്മക അർഥം നൽകുന്നു; മുഖ്യപാഠം ആ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: וְהָרָעָב
  choice: അപ്പോൾ ... ക്ഷാമം
  rationale: വാവ് ഇവിടെ അടുത്ത സംഭവത്തെക്കാൾ പശ്ചാത്തലസാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ സാഹചര്യപരമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: חָזָק
  choice: അതികഠിനമായിരുന്നു
  rationale: ‘ക്ഷാമം’ എന്ന നാമത്തോടൊപ്പം חָזָק ഭൗതിക ശക്തിയല്ല, തീവ്രതയാണ് സൂചിപ്പിക്കുന്നത്; ‘അതികഠിനം’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: ב സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ ശമര്യ നഗരം ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും, മൂലപാഠം അതിനെ കൂടുതൽ നിർദിഷ്ടമാക്കാത്തതിനാൽ സാധാരണ സ്ഥലനിർദ്ദേശം നിലനിർത്തി.
