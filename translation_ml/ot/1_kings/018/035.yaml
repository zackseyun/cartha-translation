id: 1KI.18.35
reference: 1 Kings 18:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ הַ/מַּ֔יִם סָבִ֖יב לַ/מִּזְבֵּ֑חַ וְ/גַ֥ם אֶת הַ/תְּעָלָ֖ה מִלֵּא מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: ml
  text: വെള്ളം യാഗപീഠത്തിനു ചുറ്റും ഒഴുകി; അത് കിടങ്ങിലും വെള്ളം നിറച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ഒഴുകി
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പോയി’ എന്നാണെങ്കിലും, വെള്ളത്തിന്റെ ചലനത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘ഒഴുകി’ എന്നാണ്.
- source_word: הַמַּיִם
  choice: വെള്ളം
  rationale: എബ്രായയിലെ ബഹുവചനരൂപത്തിലുള്ള ജലനാമത്തിന് സ്വാഭാവികമായ മലയാള ഏകവചന ദ്രവ്യനാമം.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനു ചുറ്റും
  rationale: യാഗപീഠത്തെ ചുറ്റിയുള്ള സ്ഥലത്തേക്ക് വെള്ളം വ്യാപിച്ചതെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: וְגַם
  choice: അത് ... -ലും
  rationale: രണ്ടാമത്തെ സംഭവവും കൂടെ നടന്നുവെന്ന കൂട്ടിച്ചേർക്കൽ മലയാളത്തിലെ ‘-ലും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת־הַתְּעָלָה
  choice: കിടങ്ങ്
  rationale: യാഗപീഠത്തിനു ചുറ്റും ഉണ്ടാക്കിയ trench/channel എന്ന അർഥത്തിന് ഈ സന്ദർഭത്തിൽ സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന സ്വാഭാവിക പദം.
- source_word: מִלֵּא
  choice: നിറച്ചു
  rationale: ‘നിറയ്ക്കുക’ എന്ന സകർമക ക്രിയയുടെ നേരിട്ടുള്ള മലയാള പരിഭാഷ; എബ്രായത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മുൻവാക്യത്തിലെ വെള്ളത്തെ സൂചിപ്പിക്കുന്ന ‘അത്’ ചേർത്തു.
- source_word: מָיִם
  choice: വെള്ളം
  rationale: കിടങ്ങ് എന്തുകൊണ്ടാണ് നിറഞ്ഞതെന്നു വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ‘പോയി’ എന്ന അക്ഷരാർഥത്തിനു പകരം വെള്ളത്തിന്റെ ചലനത്തിന് യോജിച്ച ‘ഒഴുകി’ സ്വീകരിച്ചു; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ ചേർത്തിട്ടില്ല.
