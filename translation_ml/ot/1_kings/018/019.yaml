source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: ml
  text: ഇപ്പോൾ ആളയച്ച്, എല്ലാ ഇസ്രായേലിനെയും കർമ്മേൽമലയിലേക്ക്[a] എന്റെ അടുക്കൽ കൂട്ടിവരുത്തുക. ബാലിന്റെ നാനൂറ്റമ്പത് പ്രവാചകന്മാരെയും അശേരയുടെ[c] നാനൂറു പ്രവാചകന്മാരെയും—ഈസബെലിന്റെ മേശയിൽ ഭക്ഷണം കഴിക്കുന്നവരെ[b]—കൂട്ടിവരുത്തുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കർമ്മേൽമലയിൽ.’ ഹീബ്രു ഉപസർഗം കൂടിവരേണ്ട സ്ഥലത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഈസബെലിന്റെ മേശയിൽ ഭക്ഷണം കഴിക്കുന്നവർ.’ ഈ പ്രയോഗം അവളുടെ രാജകീയ പരിപാലനത്തിൽ കഴിഞ്ഞിരുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അശേര’ എന്നത് അശേരദേവതയെയോ ചില സന്ദർഭങ്ങളിൽ അവളുമായി ബന്ധപ്പെട്ട ഒരു ആരാധനാവസ്തുവിനെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘ബാൽ’ എന്നതിനോടുള്ള സമാന്തര്യം ദേവതയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ധാരണയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: ഉടൻ നടപ്പാക്കേണ്ട ഏലിയാവിന്റെ കല്പനയെ പരിചയപ്പെടുത്തുന്ന സംവാദസൂചകം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: שְׁלַח קְבֹץ
  choice: ആളയച്ച് … കൂട്ടിവരുത്തുക
  rationale: 'രണ്ട് കല്പനകളുടെയും ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു: സന്ദേശവാഹകരെ അയച്ച് ജനത്തെ നിശ്ചിത സ്ഥലത്തേക്ക് കൂട്ടിച്ചേർക്കണം.'
- source_word: אֵלַי
  choice: എന്റെ അടുക്കൽ
  rationale: ഏലിയാവിന്റെ അടുത്തേക്കുള്ള ദിശ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിനെയും
  rationale: ഇസ്രായേൽ ജനതയെ മുഴുവനായി സൂചിപ്പിക്കുന്ന ഹീബ്രു ദേശീയ-സമൂഹപ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: കർമ്മേൽമലയിലേക്ക്
  rationale: אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: נְבִיאֵי הַבַּעַל
  choice: ബാലിന്റെ … പ്രവാചകന്മാർ
  rationale: ബാലുമായി ബന്ധപ്പെട്ട പ്രവാചകന്മാരെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: നാനൂറ്റമ്പത്
  rationale: എണ്ണം മലയാള സാഹിത്യശൈലിയിൽ വാക്കായി നൽകുന്നു.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: അശേരയുടെ … പ്രവാചകന്മാർ
  rationale: ബാലിന്റെ പ്രവാചകന്മാർ എന്ന സമാന്തരപ്രയോഗം ഇവിടെ ദേവതയുടെ പേരായിരിക്കാനുള്ള സാധ്യത ശക്തമാക്കുന്നു; എങ്കിലും അടിക്കുറിപ്പിൽ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: אַרְבַּע מֵאוֹת
  choice: നാനൂറു
  rationale: എണ്ണം വാക്കായി നൽകി മുൻസംഖ്യയുമായുള്ള ശൈലിസമത്വം പാലിക്കുന്നു.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: ഈസബെലിന്റെ മേശയിൽനിന്ന് ഭക്ഷിക്കുന്നവർ
  rationale: പദചിത്രം നിലനിർത്തിക്കൊണ്ട് രാജകീയ പരിപാലനത്തിന്റെ സൂചനയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ אֲשֵׁרָה എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ദേവതയുടെ പേരായി ‘അശേര’
  alternative: അശേരയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തു അഥവാ പ്രതിഷ്ഠ
  rationale: ‘ബാലിന്റെ പ്രവാചകന്മാർ’ എന്ന സമാന്തരഘടന വ്യക്തിപരമായ ദൈവനാമത്തെ അനുകൂലിക്കുന്നു. എന്നാൽ മറ്റു സന്ദർഭങ്ങളിൽ ഈ പദം ആരാധനാവസ്തുവിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘എല്ലാ ഇസ്രായേലും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാ ഇസ്രായേലിനെയും’ എന്ന ദേശീയ-സമൂഹപ്രയോഗം നിലനിർത്തി
  alternative: ‘എല്ലാ ഇസ്രായേല്യരെയും’ എന്ന വ്യക്തിവിതരണപരമായ പരിഭാഷ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ വാഗ്‌വ്യാപ്തിയും ജനതയെ ഒരു സമഗ്രസമൂഹമായി കാണുന്ന ഭാവവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമാർന്നതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പ്രവാചകന്മാർ’ എന്ന ബൈബിൾപരിചിത പദം നിലനിർത്തി; ദിശാസൂചകമായ ഹീബ്രു ഘടനയും ആവർത്തിച്ച കല്പനയുടെ ശക്തിയും സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ അവതരിപ്പിച്ചു.
