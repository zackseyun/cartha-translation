id: 1KI.18.13
reference: 1 Kings 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: ml
  text: ഈസേബെൽ യഹ്‌വേയുടെ പ്രവാചകന്മാരെ കൊന്നുകൊണ്ടിരുന്നപ്പോൾ ഞാൻ ചെയ്തതു—യഹ്‌വേയുടെ പ്രവാചകന്മാരിൽ നൂറുപേരെ, ഓരോ ഗുഹയിലും അമ്പതുപേർ വീതം[a], ഒളിപ്പിക്കുകയും അവർക്കു അപ്പവും വെള്ളവും നൽകി പരിപാലിക്കുകയും ചെയ്തതു—എന്റെ യജമാനനോട് അറിയിച്ചിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അമ്പത് അമ്പത് പേർ ഗുഹയിൽ.” ഇത് അമ്പതുപേർ വീതമുള്ള വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; “ഓരോ ഗുഹയിലും അമ്പതുപേർ” എന്നോ “ഗുഹകളിൽ അമ്പതുപേർ വീതമുള്ള രണ്ടു കൂട്ടങ്ങളായി” എന്നോ മനസ്സിലാക്കാം.
    reason: എബ്രായത്തിലെ ആവർത്തിച്ച സംഖ്യ വിതരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘ഗുഹ’ ഏകവചനമായതിനാൽ മലയാളത്തിൽ സാദ്ധ്യമായ വായനകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: എന്റെ യജമാനനോട് അറിയിച്ചിട്ടില്ലേ?
  rationale: הֲלֹא അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. הֻגַּד എന്ന കർമണിപ്രയോഗം ‘അറിയിച്ചിട്ടില്ലേ’ എന്നു സ്വാഭാവികമായി നൽകി. אֲדֹנִי ഇവിടെ ഏലിയാവിനോടുള്ള ആദരസൂചക അഭിസംബോധന ആയതിനാൽ ദൈവിക അർഥം വരാത്ത ‘എന്റെ യജമാനൻ’ ഉപയോഗിച്ചു.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: ഈസേബെൽ ... കൊന്നുകൊണ്ടിരുന്നപ്പോൾ
  rationale: ב + infinitive construct കാലസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലം മലയാളത്തിലെ ‘കൊന്നുകൊണ്ടിരുന്നപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: യഹ്‌വേയുടെ പ്രവാചകന്മാരിൽ നൂറുപേരെ
  rationale: מִן ഭാഗികബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവാചകന്മാരിൽ’ എന്നു നൽകി; מֵאָה אִישׁ എന്ന മനുഷ്യരുടെ എണ്ണൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘നൂറുപേരെ’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: ഓരോ ഗുഹയിലും അമ്പതുപേർ വീതം
  rationale: സംഖ്യയുടെ ആവർത്തനം അമ്പതുവീതമുള്ള വിതരണത്തെ സൂചിപ്പിക്കുന്നു. ഏകവചനമായ ‘ഗുഹ’ വിതരണപരമായി മനസ്സിലാക്കാവുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഓരോ ഗുഹയിലും ... വീതം’ എന്നു നൽകി; രൂപപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: അവർക്കു അപ്പവും വെള്ളവും നൽകി സംരക്ഷിച്ച
  rationale: כלכל ഇവിടെ ആവശ്യമായ ആഹാരം നൽകി നിലനിർത്തുക/സംരക്ഷിക്കുക എന്ന അർഥത്തിലാണ്. വസ്തുക്കളായ ‘അപ്പവും വെള്ളവും’ നിലനിർത്തി, ക്രിയയുടെ സംരക്ഷണഭാവവും വ്യക്തമാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവർണ ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אֲדֹנִי എന്ന അഭിസംബോധനയുടെ സ്വഭാവം
  choice: എന്റെ യജമാനൻ
  alternative: എന്റെ കർത്താവ്
  rationale: ഇത് ഏലിയാവിനോടുള്ള മനുഷ്യപരമായ ആദരസൂചക അഭിസംബോധനയാണ്; ദൈവിക പദവിയുമായി കലരാതിരിക്കാനാണ് ‘യജമാനൻ’ തിരഞ്ഞെടുത്തത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും കഥനസന്ദർഭത്തിന് യോജിച്ചതുമായ ഭാഷ. നീണ്ട എബ്രായ വാക്യത്തിന്റെ അലങ്കാരചോദ്യഘടന നിലനിർത്തിക്കൊണ്ട്, പ്രവർത്തികളുടെ ബന്ധം ഡാഷുകൾ ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
