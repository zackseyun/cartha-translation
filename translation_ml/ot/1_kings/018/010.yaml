revisions:
- from: നിന്റെ ദൈവമായ യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ, എന്റെ യജമാനൻ നിന്നെ അന്വേഷിക്കാൻ ആളയച്ചിട്ടില്ലാത്ത ഒരു ജനതയോ രാജ്യമോ ഇല്ല. ‘അവൻ ഇവിടെയില്ല’ എന്ന് അവർ പറഞ്ഞപ്പോൾ, നിന്നെ കണ്ടെത്താനായില്ലെന്ന് അദ്ദേഹം ആ രാജ്യത്തെയും ജനതയെയുംകൊണ്ട് സത്യം ചെയ്യിച്ചു.
