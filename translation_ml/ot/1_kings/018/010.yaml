id: 1KI.18.10
reference: 1 Kings 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: ml
  text: നിന്റെ ദൈവമായ യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ, നിന്നെ അന്വേഷിക്കാൻ എന്റെ യജമാനൻ അയച്ചിട്ടില്ലാത്ത ഒരു ജനതയോ രാജ്യമോ ഇല്ല. ‘അവൻ ഇവിടെയില്ല’ എന്ന് അവർ പറഞ്ഞപ്പോൾ, നിന്നെ കണ്ടെത്താനായില്ലെന്ന് അദ്ദേഹം ആ രാജ്യത്തെയും ജനതയെയും സത്യം ചെയ്യിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ
  rationale: ദൈവത്തിന്റെ ജീവനെ ആധാരമാക്കിയുള്ള ഹീബ്രു ശപഥസൂത്രത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായ മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: '... ഒരു ജനതയോ രാജ്യമോ ഇല്ല'
  rationale: ശപഥസന്ദർഭത്തിലെ אִם വ്യവസ്ഥയല്ല, ശക്തമായ നിഷേധാത്മക ഉറപ്പാണ്; മലയാളത്തിൽ അതിന്റെ അർഥബലം നേരിട്ട് നൽകുന്നു.
- source_word: גּוֹי וּמַמְלָכָה
  choice: ജനതയോ രാജ്യമോ
  rationale: രാഷ്ട്രീയ-ഭൗമിക സമാന്തരപദജോടിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: നിന്നെ അന്വേഷിക്കാൻ ആളയച്ചിട്ടില്ലാത്ത
  rationale: അന്വേഷണത്തിനായി അയയ്ക്കുക എന്ന ക്രിയാക്രമം നിലനിർത്തുന്നു; മലയാളത്തിൽ അയയ്ക്കപ്പെട്ട ആളുകൾ എന്നത് ക്രിയയിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇവിടെ ദൈവത്തെയല്ല, അഹാബ് രാജാവിനെയാണ് ആദരപൂർവം സൂചിപ്പിക്കുന്നത്.
- source_word: וְאָמְרוּ אָיִן
  choice: ‘അവൻ ഇവിടെയില്ല’ എന്ന് അവർ പറഞ്ഞപ്പോൾ
  rationale: ആയിൻ സൂചിപ്പിക്കുന്ന അഭാവവും സന്ദർഭത്തിൽ പരോക്ഷമായ ഏലിയാവെന്ന കർത്താവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהִשְׁבִּיעַ
  choice: സത്യം ചെയ്യിച്ചു
  rationale: שבע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ശപഥം ചെയ്യാൻ ഇടയാക്കുക’ എന്ന causative അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: നിന്നെ കണ്ടെത്താനായില്ലെന്ന്
  rationale: ശപഥത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന כִּי-യെയും കഴിഞ്ഞ അന്വേഷണത്തിന്റെ പരാജയത്തെയും സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിനാമം നിലനിർത്താൻ ഹീബ്രു നാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; പദവിനാമം പകരംവയ്ക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ ജീവനെ ആധാരമാക്കിയ ശപഥസൂത്രം
  choice: നിന്റെ ദൈവമായ യഹ്‌വേ ജീവനുള്ളവൻ എന്നാണേ
  alternative: നിന്റെ ദൈവമായ യഹ്‌വേയുടെ ജീവനാണേ
  rationale: ദൈവം ജീവനുള്ളവൻ എന്ന പ്രഖ്യാപനവും ശപഥത്തിന്റെ ഗൗരവവും ഒരുമിച്ച് നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷ. രാജസദസ്സിലെ ആദരസൂചനയ്ക്കായി ‘യജമാനൻ’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആവർത്തനവും ശപഥത്തിന്റെ ശക്തിയും പരമാവധി നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
