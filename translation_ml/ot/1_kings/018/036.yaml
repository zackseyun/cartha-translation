  to: 'ധാന്യയാഗം അർപ്പിക്കുന്ന സമയത്ത്, പ്രവാചകനായ ഏലിയാവ് അടുത്തുവന്ന് പറഞ്ഞു: “അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യിസ്രായേലിന്റെയും[a] ദൈവമായ യഹ്‌വേ, അങ്ങ് യിസ്രായേലിൽ ദൈവമാണെന്നും ഞാൻ അങ്ങയുടെ ദാസനാണെന്നും അങ്ങയുടെ വചനത്താൽ[b] ഞാൻ ഈ കാര്യങ്ങളെല്ലാം ചെയ്തുവെന്നും ഇന്ന് അറിയപ്പെടട്ടെ.”'
