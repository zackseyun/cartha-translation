source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: ml
  text: 'ധാന്യയാഗം അർപ്പിക്കുന്ന സമയത്ത്, പ്രവാചകനായ ഏലിയാവ് അടുത്തുവന്ന് പറഞ്ഞു: “അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യിസ്രായേലിന്റെയും[a] ദൈവമായ യഹ്‌വേ, അങ്ങ് യിസ്രായേലിൽ ദൈവമാണെന്നും ഞാൻ അങ്ങയുടെ ദാസനാണെന്നും അങ്ങയുടെ വചനത്താൽ[b] ഞാൻ ഈ കാര്യങ്ങളെല്ലാം ചെയ്തുവെന്നും ഇന്ന് അറിയപ്പെടട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ‘യിസ്രായേൽ’ എന്നാണ്; കൂടുതൽ പരിചിതമായ പിതൃനാമസൂത്രത്തിലെ ‘യാക്കോബ്’ എന്നല്ല.
    reason: alternative_reading
  - marker: b
    text: ‘അങ്ങയുടെ വചനപ്രകാരം’ എന്നോ ‘അങ്ങയുടെ വാക്കനുസരിച്ച്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: ധാന്യയാഗം അർപ്പിക്കുന്ന സമയമായപ്പോൾ
  rationale: מִנְחָה ഇവിടെ ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു; עֲלוֹת യാഗം അർപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. സമയസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുചെന്ന്
  rationale: נגשׁ എന്ന ക്രിയയുടെ സമീപിക്കൽ എന്ന വ്യക്തമായ ചലനാർഥവും സന്ദർഭത്തിലെ ഗൗരവവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ വ്യഞ്ജനചതുഷ്ടയമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ദൈവനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യിസ്രായേലിന്റെയും ദൈവം
  rationale: മൂലപാഠത്തിൽ ‘യാക്കോബ്’ എന്നല്ല, ‘യിസ്രായേൽ’ എന്നാണ്; അതിനാൽ പരിചിതമായ മറ്റൊരു സൂത്രവാക്യവുമായി സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: הַיּוֹם יִוָּדַע
  choice: ഇന്ന് അറിയപ്പെടട്ടെ
  rationale: ידע-യുടെ നിഫാൽ അപൂർണരൂപത്തിന് ഇവിടെ പ്രാർഥനാപരമായ ആജ്ഞാർഥമുണ്ട്; ‘അറിയപ്പെടട്ടെ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: യിസ്രായേലിൽ ദൈവം
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള ‘യിൽ’ എന്ന അർഥം നിലനിർത്തി, ‘മേൽ’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: പ്രവാചകന്റെ നിയോഗിത സേവനത്തെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ദാസൻ’ സ്വാഭാവികവും മാന്യവുമായ പദമാണ്.
- source_word: וּבִדְבָרֶךָ
  choice: അങ്ങയുടെ വചനത്താൽ
  rationale: ב ഉപസർഗം ഉപകരണാർഥമോ മാനദണ്ഡാർഥമോ നൽകാം; ‘വചനത്താൽ’ ദൈവവചനത്തിന്റെ അധികാരവും പ്രവർത്തനത്തിന് അതുമായുള്ള ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ഞാൻ ഈ കാര്യങ്ങളെല്ലാം ചെയ്തു
  rationale: דברים ഇവിടെ സംസാരിച്ച വാക്കുകളെക്കാൾ കാര്യങ്ങളെയോ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ പ്രവർത്തനം മലയാളത്തിൽ ലളിതമായ ഭൂതകാലത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ഉടമ്പടിനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പിതൃനാമങ്ങളുടെ സൂത്രവാക്യത്തിൽ ‘യിസ്രായേൽ’ എന്ന വായന
  choice: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യിസ്രായേലിന്റെയും ദൈവം
  alternative: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം
  rationale: എബ്രായ പാഠത്തിലെ ‘യിസ്രായേൽ’ അതേപടി നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ ‘യാക്കോബ്’ എന്ന രൂപത്തിലേക്ക് പാഠത്തെ സമന്വയിപ്പിക്കുന്നില്ല.
- issue: וּבִדְבָרֶךָയിലെ ב ഉപസർഗത്തിന്റെ ബന്ധം
  choice: അങ്ങയുടെ വചനത്താൽ
  alternative: അങ്ങയുടെ വചനപ്രകാരം / അങ്ങയുടെ കല്പനയനുസരിച്ച്
  rationale: ഉപകരണാർഥവും മാനദണ്ഡാർഥവും രണ്ടും സാദ്ധ്യമാണ്. മുഖ്യപാഠം സംക്ഷിപ്തമായ ഉപകരണാർഥം സ്വീകരിക്കുന്നു; മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ മാന്യരൂപമായ ‘അങ്ങ്’ സ്വീകരിച്ചു. വാക്യഘടന മൂലപാഠത്തിന്റെ മൂന്ന് ‘എന്നും’ ഘടകങ്ങളെയും നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
