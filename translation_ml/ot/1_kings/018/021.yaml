source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് ജനമെല്ലാവരുടെയും അടുത്തുചെന്നു പറഞ്ഞു: “നിങ്ങൾ എത്രകാലം രണ്ടു ശാഖകൾക്കിടയിൽ മുടന്തിനടക്കും?[a] യാഹ്‌വെയാണ് ദൈവമെങ്കിൽ അവനെ അനുഗമിക്കൂ; ബാലാണ് ദൈവമെങ്കിൽ അവനെ അനുഗമിക്കൂ.” എന്നാൽ ജനം അവനോട് ഒരു വാക്കുപോലും ഉത്തരം പറഞ്ഞില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ട് അഭിപ്രായങ്ങൾക്കിടയിൽ ചാഞ്ചാടും?” എബ്രായം അക്ഷരാർഥത്തിൽ രണ്ടു ശാഖകളുടെയോ പിരിവുകളുടെയോ മീതെ, അല്ലെങ്കിൽ അവയ്ക്കിടയിൽ, മുടന്തിനടക്കുന്നതിനെക്കുറിച്ചു പറയുന്നു. ഇത് വിഭജിത വിശ്വസ്തതയെ സൂചിപ്പിക്കാവുന്ന രൂപകമാണ്.
    reason: എബ്രായ രൂപകത്തിന്റെ അക്ഷരാർഥവും പരമ്പരാഗതമായ ആശയാർഥവും നൽകുന്നു; സ്ഥാനസൂചകത്തിന്റെ അനിശ്ചിതത്വം തുറന്നുവയ്ക്കുന്നു.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തേക്കു ചെന്നു
  rationale: നגשׁ എന്ന ക്രിയയുടെ സമീപിക്കുക എന്ന ഭൗതികവും നേരിടുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാവരും
  rationale: അവിടെ കൂടിയിരുന്ന ജനസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: עַד מָתַי
  choice: എത്രകാലം
  rationale: കാലപരിധിയെ ചോദ്യം ചെയ്യുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക മലയാള തുല്യപ്രയോഗം.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: രണ്ടു ശാഖകൾക്കിടയിൽ മുടന്തിനടക്കും
  rationale: פסח എന്നതിലെ മുടന്തൽ/ഞൊണ്ടൽ എന്ന ദൃശ്യരൂപവും סעפים എന്നതിലെ പിരിഞ്ഞ ശാഖകളുടെ രൂപകവും നിലനിർത്തുന്നു; വിഭജിത വിശ്വസ്തത എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ മാത്രം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: യാഹ്‌വെയാണ് ദൈവമെങ്കിൽ
  rationale: ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുകയും ആരാണ് യഥാർഥ ദൈവം എന്ന വാക്യത്തിലെ വെല്ലുവിളി വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לְכוּ אַחֲרָיו
  choice: അവനെ അനുഗമിക്കൂ
  rationale: പിന്നാലെ പോകുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശ്വസ്തതയും അനുസരണവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം.
- source_word: הַבַּעַל
  choice: ബാൽ
  rationale: നിർദ്ദിഷ്ട കനാന്യ ദേവനെ സൂചിപ്പിക്കുന്ന നാമമായി സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: എന്നാൽ ജനം അവനോട് ഒരു വാക്കുപോലും ഉത്തരം പറഞ്ഞില്ല
  rationale: ജനത്തിന്റെ സമ്പൂർണ മൗനത്തെ ഊന്നിപ്പറയുന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים എന്ന രൂപകം
  choice: രണ്ടു ശാഖകൾക്കിടയിൽ മുടന്തിനടക്കുക എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു
  alternative: രണ്ട് അഭിപ്രായങ്ങൾക്കിടയിൽ ചാഞ്ചാടുക
  rationale: വിഭജിത വിശ്വസ്തതയാണ് സന്ദർഭത്തിലെ ആശയമെങ്കിലും, എബ്രായത്തിലെ ദൃഢമായ മുടന്തൽ/ശാഖകൾ എന്ന രൂപകത്തെ അമൂർത്തമായ വ്യാഖ്യാനമായി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- issue: בעל ഉൾപ്പെട്ട സമാന്തര നിബന്ധനയിലെ ഒഴിവാക്കിയ വിധേയപദം
  choice: ബാലാണ് ദൈവമെങ്കിൽ
  alternative: ബാലാണെങ്കിൽ
  rationale: എബ്രായത്തിൽ രണ്ടാമത്തെ വാക്യത്തിൽ ‘ദൈവം’ അധ്യാഹൃതമാണെങ്കിലും ആദ്യ നിബന്ധനയുമായുള്ള സമാന്തരത മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ബാലിന്റെ ദൈവത്വത്തെ വക്താവ് അംഗീകരിക്കുന്നുവെന്നല്ല, പരിശോധനയ്ക്കുള്ള നിബന്ധനയായി മാത്രം അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവാചകന്റെ വെല്ലുവിളിയുടെ തീക്ഷ്ണത നിലനിർത്താൻ നേരിട്ടുള്ള ചോദ്യവും ആവർത്തിച്ചുള്ള ‘അവനെ അനുഗമിക്കൂ’ എന്ന കല്പനയും സംരക്ഷിച്ചു. അപരിചിതമായ മൂലരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകി.
