  to: 'അപ്പോൾ ഏലിയാവ് ജനമെല്ലാവരുടെയും അടുത്തുചെന്നു പറഞ്ഞു: “നിങ്ങൾ എത്രകാലം രണ്ടു ശാഖകൾക്കിടയിൽ മുടന്തിനടക്കും?[a] യാഹ്‌വെയാണ് ദൈവമെങ്കിൽ അവനെ അനുഗമിക്കൂ; ബാലാണ് ദൈവമെങ്കിൽ അവനെ അനുഗമിക്കൂ.” എന്നാൽ ജനം അവനോട് ഒരു വാക്കുപോലും ഉത്തരം പറഞ്ഞില്ല.'
  rationale: 'ഒരു ചെറു ശൈലിപരമായ തിരുത്തൽ മാത്രമാണ് ആവശ്യമായത്: ഏലിയാവ് ജനത്തെ യഥാർഥത്തിൽ സമീപിച്ചുവെന്ന എബ്രായ ക്രിയയുടെ ഭാവം “അടുത്തുചെന്നു” കൂടുതൽ വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പും വ്യാഖ്യാനസാദ്ധ്യതയെ ഉറപ്പിച്ചുതീർക്കാതെ, അക്ഷരാർഥരൂപകവും ആശയാർഥവും ഒരുപോലെ കാണിക്കുന്നവിധം മിതമാക്കി.'
