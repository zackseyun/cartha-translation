  edition: WLC
  text: וַ/יְהִ֣י עַד כֹּ֣ה וְ/עַד כֹּ֗ה וְ/הַ/שָּׁמַ֨יִם֙ הִֽתְקַדְּרוּ֙ עָבִ֣ים וְ/ר֔וּחַ וַ/יְהִ֖י גֶּ֣שֶׁם גָּד֑וֹל וַ/יִּרְכַּ֥ב אַחְאָ֖ב וַ/יֵּ֥לֶךְ יִזְרְעֶֽאלָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: ml
  text: അല്പസമയത്തിനകം[a] ആകാശം മേഘങ്ങളും കാറ്റുംകൊണ്ട് ഇരുണ്ടു; കനത്ത മഴ പെയ്തു[b]. അപ്പോൾ അഹാബ് രഥത്തിൽ കയറി യിസ്രെയേലിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായ ഭാഷാശൈലി: ‘ഇങ്ങനെവരെ, ഇങ്ങനെവരെ.’ ഇവിടെ അതിന്റെ അർഥം ‘അല്പസമയത്തിനകം’ അല്ലെങ്കിൽ ‘ഇതിനിടെ’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘വലിയ മഴ ഉണ്ടായി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: അല്പസമയത്തിനകം
  rationale: ‘അതുവരെ ഇങ്ങനെ, ഇതുവരെ ഇങ്ങനെ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ സമയസൂചക പ്രയോഗം ഇവിടെ വളരെ കുറച്ചു സമയം കഴിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അല്പസമയത്തിനകം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַשָּׁמַיִם
  choice: ആകാശം
  rationale: കാലാവസ്ഥയുടെ ഈ സന്ദർഭത്തിൽ ദൃശ്യമായ ആകാശത്തെയാണ് ഉദ്ദേശിക്കുന്നത്; എബ്രായത്തിലെ ബഹുവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനമായ ‘ആകാശം’ എന്നു നൽകുന്നു.
- source_word: הִתְקַדְּרוּ
  choice: ഇരുണ്ടു
  rationale: ക്രിയ ആകാശം ഇരുണ്ടതോ മേഘാവൃതമോ ആകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇരുണ്ടു’ കൊടുങ്കാറ്റിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: עָבִים וְרוּחַ
  choice: മേഘങ്ങളും കാറ്റുംകൊണ്ട്
  rationale: ആകാശം ഇരുണ്ടതിന്റെ കാരണമോ അനുബന്ധ സാഹചര്യങ്ങളോ ഈ പദങ്ങൾ വ്യക്തമാക്കുന്നു. ‘മേഘങ്ങളും കാറ്റുംകൊണ്ട്’ എബ്രായ ഘടനയുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: കനത്ത മഴ പെയ്തു
  rationale: അക്ഷരാർഥം ‘വലിയ മഴ ഉണ്ടായി’ എന്നാണ്; മലയാളത്തിലെ സ്വാഭാവിക കാലാവസ്ഥാപ്രയോഗമായ ‘കനത്ത മഴ പെയ്തു’ മഴയുടെ തീവ്രത കൃത്യമായി നൽകുന്നു.
- source_word: וַיִּרְכַּב
  choice: രഥത്തിൽ കയറി
  rationale: ക്രിയയ്ക്ക് ‘കയറി/സവാരി ചെയ്തു’ എന്ന അർഥമുണ്ട്. വാക്യത്തിൽ വാഹനം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സമീപസന്ദർഭം അഹാബിന്റെ രഥത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: יִזְרְעֶאלָה
  choice: യിസ്രെയേലിലേക്കു
  rationale: സ്ഥാനനാമത്തോടു ചേർന്ന ദിശാസൂചക ה ചലനത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ലേക്കു’ അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
