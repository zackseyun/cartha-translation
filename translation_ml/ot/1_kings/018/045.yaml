translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. കാലാവസ്ഥാസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘ആകാശം’, ‘കനത്ത മഴ’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; അഹാബിന്റെ വാഹനം സമീപസന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ‘രഥം’ എന്നു തുറന്നുപറഞ്ഞു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
