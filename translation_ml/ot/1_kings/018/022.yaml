id: 1KI.18.22
reference: 1 Kings 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് ജനത്തോടു പറഞ്ഞു: “യാഹ്‌വേയുടെ പ്രവാചകനായി ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു[a]; എന്നാൽ ബാലിന്റെ പ്രവാചകന്മാർ നാനൂറ്റമ്പത് പുരുഷന്മാരുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏലിയാവിന്റെ ഈ വാക്കുകൾ അന്നത്തെ പരസ്യമായ ഏറ്റുമുട്ടലിൽ തനിക്കുണ്ടായിരുന്ന നിലയെ പ്രതിഫലിപ്പിക്കുന്നു. എന്നാൽ ഒബദ്യാവ് മറ്റു പ്രവാചകന്മാരെ ഒളിപ്പിച്ചുവെന്ന് ഇതേ വിവരണത്തിൽ പറയുന്നു (1 രാജാക്കന്മാർ 18:4, 13).
    reason: മുഖ്യപാഠത്തിൽ കഥനപരമായ പിരിമുറുക്കം ഒത്തുതീർപ്പാക്കാതെ, ബന്ധപ്പെട്ട വിവരണസന്ദർഭം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל הָעָם
  choice: ജനത്തോടു
  rationale: עָם ഇവിടെ കൂടിവന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനം’ നേരിട്ടും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲנִי ... לְבַדִּי
  choice: ഞാൻ മാത്രം
  rationale: ക്രിയയിൽ തന്നെ ഒന്നാംപുരുഷൻ വ്യക്തമാകുന്നുണ്ടെങ്കിലും ‘ഞാൻ’ നിലനിർത്തി, לְבַדִּיയെ ‘മാത്രം’ എന്നു ചേർത്തതിലൂടെ എബ്രായത്തിലെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: נוֹתַרְתִּי
  choice: ശേഷിച്ചിരിക്കുന്നു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ശേഷിച്ചുനിൽക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥയെ ഈ രൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: נָבִיא לַיהוָה
  choice: യഹോവയുടെ പ്രവാചകനായി
  rationale: לַיהוָה പ്രവാചകൻ യഹോവയോടു ചേർന്നവനും അവനുവേണ്ടി സംസാരിക്കുന്നവനും ആണെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി ‘യഹോവയുടെ’ എന്നു വരുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: എന്നാൽ ബാലിന്റെ പ്രവാചകന്മാർ
  rationale: വാവ് ഇവിടെ ഏലിയാവിന്റെ ഏകാന്തസ്ഥാനത്തെയും ബാലിന്റെ അനേകം പ്രവാചകന്മാരെയും തമ്മിൽ വിരുദ്ധമായി ബന്ധിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: നാനൂറ്റമ്പത് പേരുണ്ട്
  rationale: പൂർണ്ണ സംഖ്യയും വ്യക്തികളെ എണ്ണുന്ന אִישׁ എന്ന പദത്തിന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നിലനിർത്തി.
- issue: താൻ മാത്രം ശേഷിച്ച പ്രവാചകനാണെന്ന ഏലിയാവിന്റെ പ്രസ്താവന
  choice: യഹോവയുടെ പ്രവാചകനായി ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു
  alternative: യഹോവയുടെ പ്രവാചകനായി ശേഷിച്ചിരിക്കുന്നത് ഞാൻ മാത്രമാണ്
  rationale: ഏലിയാവിന്റെ പ്രസ്താവനയെ 1 രാജാക്കന്മാർ 18:4, 13-ൽ ഒബദ്യാവ് ഒളിപ്പിച്ച പ്രവാചകന്മാരെക്കുറിച്ചുള്ള വിവരവുമായി മുഖ്യപാഠത്തിൽ ഒത്തുതീർപ്പാക്കാതെ അതേപടി നിലനിർത്തുന്നു; പകരരൂപം വ്യാകരണപരമായ ഊന്നൽമാറ്റം മാത്രമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവാചകന്മാർ’ എന്നത് ബൈബിൾസന്ദർഭത്തിൽ സാധാരണക്കാർക്ക് പരിചിതമായ രൂപമായി നിലനിർത്തി; വാക്യഘടന അമിതമായി പദാനുപദമാക്കാതെ എബ്രായത്തിലെ ഊന്നലും വൈരുധ്യവും സംരക്ഷിച്ചു.
