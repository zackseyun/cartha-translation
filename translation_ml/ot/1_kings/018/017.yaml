  terminology: ‘അഹാബ്,’ ‘ഏലിയാവ്,’ ‘യിസ്രായേൽ’ എന്നിവ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ നാമരൂപങ്ങളാണ്. ‘കുഴപ്പത്തിലാക്കുന്നവൻ’ עֹכֵר-ന്റെ അടിസ്ഥാനമായ ദുരിതം/കുഴപ്പം വരുത്തുന്നവൻ എന്ന ആശയം വഹിക്കുന്നു; അടിക്കുറിപ്പ് ‘അനർഥം’ എന്നും ‘ദുരിതം’ എന്നും ഉള്ള ശക്തമായ സന്ദർഭാനുസൃത സാധ്യതകൾ ഉചിതമായി രേഖപ്പെടുത്തുന്നു.
