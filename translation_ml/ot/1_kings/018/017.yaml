reference: 1 Kings 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: ml
  text: 'അഹാബ് ഏലിയാവിനെ കണ്ടപ്പോൾ അവനോടു പറഞ്ഞു: “യിസ്രായേലിനെ കുഴപ്പത്തിലാക്കുന്നവൻ നീ തന്നെയാണോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യിസ്രായേലിന് അനർഥം വരുത്തുന്നവൻ” അല്ലെങ്കിൽ “യിസ്രായേലിനെ ദുരിതത്തിലാക്കുന്നവൻ.”'
    reason: עֹכֵר എന്ന പദത്തിന് കുഴപ്പം ഉണ്ടാക്കുക എന്നതോടൊപ്പം അനർഥമോ ദുരിതമോ വരുത്തുക എന്ന കൂടുതൽ ശക്തമായ അർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: കണ്ടപ്പോൾ
  rationale: היה എന്ന ആഖ്യാനരൂപവും כ ചേർന്ന infinitive construct-ഉം ഇവിടെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായി ആ അർഥം വഹിക്കുന്നു; വേറൊരു ‘സംഭവിച്ചു’ എന്ന പ്രയോഗം ആവശ്യമില്ല.
- source_word: אַחְאָב
  choice: അഹാബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം; വിഭക്തിക്കനുസരിച്ച് ‘ഏലിയാവിനെ’ എന്നു ചേർത്തു.
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: സംസാരക്രിയയും അതിന്റെ പരോക്ഷ കർമവും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַאַתָּה זֶה
  choice: നീ തന്നെയാണോ?
  rationale: ചോദ്യകണികയും സർവനാമ-നിർദ്ദേശക സംയോജനവും നൽകുന്ന ഊന്നലും നേരിടുന്ന ഭാവവും ‘നീ തന്നെയാണോ?’ എന്ന പ്രയോഗം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: עֹכֵר
  choice: കുഴപ്പത്തിലാക്കുന്നവൻ
  rationale: עכר എന്ന ധാതുവിന്റെ participle രൂപം കുഴപ്പം, ദുരിതം, അല്ലെങ്കിൽ അനർഥം വരുത്തുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘കുഴപ്പത്തിലാക്കുന്നവൻ’ കുറ്റാരോപണത്തിന്റെ സജീവഭാവം സൂക്ഷിക്കുകയും അതിന്റെ കൂടുതൽ കടുത്ത അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יִשְׂרָאֵל
  choice: യിസ്രായേൽ
  rationale: ദേശനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ വ്യാപകമായ രൂപം.
theological_decisions:
- issue: അഹാബിന്റെ കുറ്റാരോപണത്തിന്റെ സ്വരവും വ്യാപ്തിയും
  choice: ‘യിസ്രായേലിനെ കുഴപ്പത്തിലാക്കുന്നവൻ’ എന്ന നേരിട്ടുള്ള കുറ്റാരോപണം
  alternative: ‘യിസ്രായേലിന് അനർഥം വരുത്തുന്നവൻ’ / ‘യിസ്രായേലിനെ ദുരിതത്തിലാക്കുന്നവൻ’
  rationale: വാക്യം യിസ്രായേലിന്റെ ദുരവസ്ഥയ്ക്ക് ഏലിയാവിനെ അഹാബ് കുറ്റപ്പെടുത്തുന്നതായി അവതരിപ്പിക്കുന്നു. വിവർത്തനം ഈ ആരോപണം വ്യക്തമായി നിലനിർത്തുന്നു; എന്നാൽ അഹാബിന്റെ വിലയിരുത്തൽ ശരിയാണെന്ന് അംഗീകരിക്കുകയോ തുടർന്നുള്ള വാക്യത്തിന്റെ വെളിച്ചത്തിൽ മുൻകൂട്ടി തിരുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അഹാബിന്റെ നേരിടുന്ന, കുറ്റപ്പെടുത്തുന്ന സ്വരം ‘നീ തന്നെയാണോ?’ എന്ന ഊന്നലിലൂടെ സൂക്ഷിച്ചിട്ടുണ്ട്. ‘യിസ്രായേൽ’ എന്നത് മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ നാമരൂപമായി നിലനിർത്തി.
