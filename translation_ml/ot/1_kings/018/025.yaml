id: 1KI.18.25
reference: 1 Kings 18:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് ബാലിന്റെ പ്രവാചകന്മാരോടു പറഞ്ഞു: “നിങ്ങൾ അനേകരായതിനാൽ കാളകളിൽ ഒന്ന് നിങ്ങൾക്കായി തിരഞ്ഞെടുത്ത് ആദ്യം ഒരുക്കുക. പിന്നെ നിങ്ങളുടെ ദൈവത്തിന്റെ നാമത്തിൽ വിളിച്ചപേക്ഷിക്കുക; എന്നാൽ തീ വെക്കരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “തീ വെക്കരുത്.” യാഗത്തിന്റെ സന്ദർഭത്തിൽ ബലിവസ്തുവിന്റെ അടിയിൽ തീ വെക്കരുത് എന്നാണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: ബാലിന്റെ പ്രവാചകന്മാരോട്
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിന്റെ ഉടമസ്ഥതാബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: കാളകളിൽ ഒന്ന് നിങ്ങൾക്കായി തിരഞ്ഞെടുത്ത്
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ രണ്ട് കാളകളിൽ ഒന്നിനെയാണ് സൂചിപ്പിക്കുന്നത്; לָכֶם എന്നത് ‘നിങ്ങൾക്കായി’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: ആദ്യം ഒരുക്കുക
  rationale: യാഗസന്ദർഭത്തിൽ עשה മൃഗത്തെ യാഗത്തിനായി ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; רִאשֹׁנָה പ്രവർത്തനക്രമത്തിലെ മുൻഗണന വ്യക്തമാക്കുന്നു.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: നിങ്ങൾ അനേകരായതിനാൽ
  rationale: അവർ ആദ്യം പ്രവർത്തിക്കേണ്ടതിന്റെ കാരണം അവരുടെ അംഗസംഖ്യയാണെന്ന് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുക
  rationale: קרא בשם എന്ന പ്രയോഗത്തിന്റെ ‘ദേവതയെ വിളിച്ചപേക്ഷിക്കുക’ എന്ന അർഥവും ‘നാമം’ എന്ന ഹീബ്രു ഘടകവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: എന്നാൽ തീ വെക്കരുത്
  rationale: ഹീബ്രു വാചകം തീ എവിടെ വെക്കരുതെന്ന് വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘അടിയിൽ’ ചേർക്കാതെ അതിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֱלֹהֵיכֶם എന്ന പദം ബാലിനെ സൂചിപ്പിക്കുന്നത്
  choice: നിങ്ങളുടെ ദൈവം
  alternative: നിങ്ങളുടെ ദൈവങ്ങൾ
  rationale: אֱלֹהִים രൂപപരമായി ബഹുവചനമാകാമെങ്കിലും ഉടൻമുമ്പുള്ള സന്ദർഭത്തിലെ ഏകലക്ഷ്യം ബാൽ തന്നെയാണ്; അതിനാൽ ഏകവചനം സന്ദർഭത്തിന് യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നത് ആരാധനാപരമായ ആഹ്വാനത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു. മുഖ്യപാഠത്തിൽ ഹീബ്രുവിൽ ഇല്ലാത്ത ‘അടിയിൽ’ ചേർത്തിട്ടില്ല; സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
