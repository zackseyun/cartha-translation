id: 1KI.18.18
reference: 1 Kings 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇസ്രായേലിന് അനർഥം വരുത്തിയത് ഞാനല്ല; നീയും നിന്റെ പിതാവിന്റെ ഭവനവുമാണ്. നിങ്ങൾ യാഹ്‌വേയുടെ കല്പനകൾ ഉപേക്ഷിക്കുകയും, നീ ബാൽദേവന്മാരുടെ[a] പിന്നാലെ പോകുകയും ചെയ്തതുകൊണ്ടാണ്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ബാൽദേവന്മാർ’ ബഹുവചനമാണ്; ഇത് ബാൽ ആരാധനയുടെ വിവിധ പ്രാദേശിക രൂപങ്ങളെയോ പ്രത്യക്ഷീകരണങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: സാംസ്കാരിക കുറിപ്പ്
  - marker: b
    text: എബ്രായത്തിൽ ‘നിങ്ങൾ ഉപേക്ഷിച്ചതിൽ’ ബഹുവചനമുണ്ട്; എന്നാൽ ‘നീ ... പിന്നാലെ പോയി’ എന്നതിൽ ഏകവചനമാണ്. ഈ മാറ്റം ആഹാബിനെയും അവന്റെ പിതാവിന്റെ ഭവനത്തെയും ഉൾക്കൊള്ളുന്ന കുറ്റാരോപണത്തിൽനിന്ന് ആഹാബിനെ വ്യക്തിപരമായി അഭിസംബോധന ചെയ്യുന്നതിലേക്കുള്ള മാറ്റമായിരിക്കാം.
    reason: വ്യാകരണപരമായ വ്യക്തീകരണം
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: ഇസ്രായേലിന്മേൽ അനർത്ഥം വരുത്തിയത്
  rationale: עכר എന്ന ക്രിയ ഒരു സമൂഹത്തിന്മേൽ കഷ്ടതയോ അനർത്ഥമോ വരുത്തുക എന്ന അർഥത്തിലാണ് ഇവിടെ; മുൻവാക്യത്തിലെ ആരോപണത്തോടുള്ള ബന്ധവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: ഞാനല്ല … നീയും … ആണ്
  rationale: എതിർപ്പും കുറ്റാരോപണത്തിന്റെ തിരിച്ചുവിടലും സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבֵית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനം
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ പിതാവിന്റെ ഭവനം’ എന്ന കുടുംബ-വംശ ആശയം നിലനിർത്തുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: בַּעֲזָבְכֶם
  choice: നിങ്ങൾ … ഉപേക്ഷിച്ച് … പോയതുകൊണ്ടാണ്
  rationale: ബേത് + infinitive construct നൽകുന്ന കാരണാർഥം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ബഹുവചന അഭിസംബോധനയും ‘നിങ്ങൾ’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: מִצְוֺת
  choice: കല്പനകൾ
  rationale: നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാരം നിലനിർത്തുന്ന സാധാരണ ബൈബിൾ മലയാള പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നേരിട്ടുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: പിന്നാലെ പോയി
  rationale: ആരാധനയിലും വിശ്വസ്തതയിലും അനുഗമിക്കുക എന്ന ആശയം ഉൾക്കൊള്ളുന്ന എബ്രായ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַבְּעָלִים
  choice: ബാൽദേവന്മാർ
  rationale: എബ്രായത്തിലെ വ്യക്തമായ ബഹുവചനം സംരക്ഷിക്കുമ്പോൾ ‘ബാൽമാർ’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി ഇവ ദേവതാരൂപങ്ങളാണെന്ന് വായനക്കാരന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കുന്നു; ആധുനിക മലയാള വായനക്കാർക്കിടയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന രൂപമാണ് ‘യഹോവ’. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: הַבְּעָלִים എന്ന ബഹുവചനം
  choice: ബാൽദേവന്മാർ
  alternative: ബാൽ
  rationale: ഏകവചനമാക്കി സമതലപ്പെടുത്താതെ, വിവിധ പ്രാദേശിക ബാൽ ആരാധനാരൂപങ്ങളെയോ പ്രത്യക്ഷീകരണങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- issue: ആഹാബിനോടുള്ള ഏകവചനത്തിൽനിന്ന് കൂട്ടുത്തരവാദിത്വമുള്ള ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘നീ’ എന്നും തുടർന്ന് ‘നിങ്ങൾ’ എന്നും വേർതിരിച്ചു
  alternative: എല്ലായിടത്തും ‘നീ’
  rationale: ‘നിന്റെ പിതൃഭവനം’ എന്ന ഏകവചന അഭിസംബോധനയ്ക്കുശേഷം ‘നിങ്ങൾ ഉപേക്ഷിച്ചതുകൊണ്ട്’ എന്ന ബഹുവചനം വരുന്നതിനെ മൂലപാഠപ്രകാരം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. കുറ്റാരോപണത്തിന്റെ ശക്തി നിലനിർത്താൻ രണ്ട് വാക്യങ്ങളാക്കി; ഏകവചന-ബഹുവചന മാറ്റവും ബാൽ എന്ന പദത്തിന്റെ ബഹുവചനവും സൂക്ഷിച്ചു.
