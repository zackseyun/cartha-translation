revisions:
- from: 'അവൻ പറഞ്ഞു: “ഞാനല്ല ഇസ്രായേലിന്മേൽ അനർത്ഥം വരുത്തിയത്; നീയും നിന്റെ പിതൃഭവനവുമാണ്[a]. നിങ്ങൾ യഹോവയുടെ കല്പനകൾ ഉപേക്ഷിച്ച് ബാൽദേവന്മാരുടെ പിന്നാലെ പോയതുകൊണ്ടാണ് ഇത്.”[b]'
  to: 'അവൻ പറഞ്ഞു: “ഇസ്രായേലിന് അനർഥം വരുത്തിയത് ഞാനല്ല; നീയും നിന്റെ പിതാവിന്റെ ഭവനവുമാണ്. നിങ്ങൾ യാഹ്‌വേയുടെ കല്പനകൾ ഉപേക്ഷിക്കുകയും, നീ ബാൽദേവന്മാരുടെ[a] പിന്നാലെ പോകുകയും ചെയ്തതുകൊണ്ടാണ്.”[b]'
