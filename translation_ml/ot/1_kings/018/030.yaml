  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: ml
  text: 'അപ്പോൾ ഏലിയാവ് ജനത്തോടൊക്കെയും പറഞ്ഞു: “എന്റെ അടുത്തേക്കു വരുവിൻ.” ജനമെല്ലാം അവന്റെ അടുത്തേക്കു വന്നു. ഇടിച്ചുകളഞ്ഞിരുന്ന യഹ്‌വേയുടെ യാഗപീഠം അവൻ നന്നാക്കി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുനഃസ്ഥാപിച്ചു”; ഹീബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “സുഖപ്പെടുത്തി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּשׁוּ / וַיִּגְּשׁוּ
  choice: എന്റെ അടുത്തേക്കു വരുവിൻ / അവന്റെ അടുത്തേക്കു വന്നു
  rationale: അടുത്തേക്കു ചെല്ലുക എന്ന ഭൗതികവും ദിശാസൂചകവുമായ അർഥം നിലനിർത്തുകയും കല്പനയും അതിന്റെ നിർവഹണവും ഒരേ മലയാളപ്രയോഗത്തിലൂടെ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְרַפֵּא
  choice: നന്നാക്കി
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘സുഖപ്പെടുത്തി’ എന്നാണെങ്കിലും യാഗപീഠത്തെ സംബന്ധിച്ച് കേടുപാടുകൾ തീർത്ത് വീണ്ടും ഉപയോഗയോഗ്യമാക്കി എന്ന ആശയമാണ്; ‘നന്നാക്കി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִזְבַּח יְהוָה
  choice: യഹ്‌വേയുടെ യാഗപീഠം
  rationale: ഹീബ്രായ നിർമാണബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥബന്ധത്തിലൂടെ അവതരിപ്പിക്കുന്നു; ദൈവനാമം ശീർഷകമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֶהָרוּס
  choice: ഇടിച്ചുകളഞ്ഞിരുന്ന
  rationale: മുൻപ് തകർക്കപ്പെട്ട നിലയിലായിരുന്നുവെന്ന നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: കഥയുടെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָל הָעָם
  choice: ജനത്തോടൊക്കെയും / ജനമെല്ലാം
  rationale: സമൂഹത്തിന്റെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് ഓരോ വാക്യത്തിലും സ്വാഭാവികമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: וַיְרַפֵּא എന്ന രൂപകപ്രയോഗം
  choice: നന്നാക്കി
  alternative: സുഖപ്പെടുത്തി; പുനഃസ്ഥാപിച്ചു
  rationale: ‘സുഖപ്പെടുത്തി’ എന്ന അക്ഷരാർഥത്തിലെ രൂപകഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ പ്രധാനപാഠത്തിൽ യാഗപീഠവുമായി യോജിക്കുന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; ‘പുനഃസ്ഥാപിച്ചു’ എന്നു പറഞ്ഞാൽ നിർമ്മാണം മുഴുവൻ പഴയ നിലയിലാക്കി എന്ന അധികസൂചന ഉണ്ടാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വരുവിൻ’ എന്ന ബഹുവചന കല്പനാരൂപം തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ക്രിയയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
