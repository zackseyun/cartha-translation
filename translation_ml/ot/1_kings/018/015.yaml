source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: ml
  text: 'ഏലീയാവ് പറഞ്ഞു: “ഞാൻ സന്നിധിയിൽ നിൽക്കുന്ന സൈന്യങ്ങളുടെ യഹ്വേ ജീവിച്ചിരിക്കുന്നതുപോലെ, ഇന്ന് ഞാൻ തീർച്ചയായും അവന്റെ മുമ്പാകെ ഹാജരാകും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ അവനു പ്രത്യക്ഷനാകും” / “ഞാൻ എന്നെത്തന്നെ അവനു കാണിക്കും.” എബ്രായക്രിയയ്ക്ക് ‘കാണപ്പെടുക,’ ‘പ്രത്യക്ഷനാകുക,’ ‘സ്വയം ഹാജരാകുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: യഹ്വേ ജീവിച്ചിരിക്കുന്നതുപോലെ
  rationale: എബ്രായത്തിലെ solemn oath formulaയുടെ അർഥവും സത്യപ്രതിജ്ഞാസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ
  rationale: ദൈവിക ബിരുദത്തിന്റെ സൈനികവും വിശാലവുമായ കൂട്ടസേനാഭാവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ
  rationale: മേലധികാരിയുടെ മുമ്പിൽ സന്നിഹിതനായി സേവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ദർബാർചിത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כִּי הַיּוֹם
  choice: ഇന്ന്
  rationale: כִּי ഇവിടെ സത്യപ്രതിജ്ഞയുടെ ഉറപ്പുള്ള ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; അതിന്റെ ഊന്നൽ വാക്യത്തിലെ സത്യപ്രതിജ്ഞയും ‘തീർച്ചയായും’ എന്ന പ്രയോഗവും ചേർന്ന് നൽകുന്നു.
- source_word: אֵרָאֶה אֵלָיו
  choice: ഞാൻ തീർച്ചയായും അവന്റെ മുമ്പാകെ ഹാജരാകും
  rationale: ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ‘കാണപ്പെടുക/പ്രത്യക്ഷനാകുക/സ്വയം ഹാജരാകുക’ എന്ന ആശയം നൽകുന്നു. അഹാബിന്റെ മുമ്പിൽ മനപ്പൂർവം ചെല്ലുമെന്ന ഉറപ്പ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോൾ പദത്തിന്റെ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ യഹ്വേ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. സത്യപ്രതിജ്ഞയുടെ ഔപചാരികതയും പ്രവാചകൻ ദൈവസന്നിധിയിൽ നിൽക്കുന്ന ദർബാർചിത്രവും സംരക്ഷിച്ചു; അവസാന ക്രിയയിലെ യഥാർഥ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
