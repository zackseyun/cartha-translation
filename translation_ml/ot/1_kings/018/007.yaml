    rationale: The Hebrew וְהִנֵּה אֵלִיָּהוּ לִקְרָאתוֹ, in this past narrative, presents Elijah as coming to meet Obadiah. The Malayalam progressive present ‘വരുന്നു’ disrupts the past narrative, and ‘എതിരേൽക്കുക’ may imply receiving/welcoming. ‘അവന്റെ നേരെ വന്നു’ preserves the directional encounter without adding that implication.
