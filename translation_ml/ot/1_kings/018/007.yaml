id: 1KI.18.7
reference: 1 Kings 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י עֹבַדְיָ֨הוּ֙ בַּ/דֶּ֔רֶךְ וְ/הִנֵּ֥ה אֵלִיָּ֖הוּ לִ/קְרָאת֑/וֹ וַ/יַּכִּרֵ֨/הוּ֙ וַ/יִּפֹּ֣ל עַל פָּנָ֔י/ו וַ/יֹּ֕אמֶר הַ/אַתָּ֥ה זֶ֖ה אֲדֹנִ֥/י אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: ml
  text: 'ഓബദ്യാവ് വഴിയിലായിരിക്കുമ്പോൾ, ഇതാ, ഏലിയാവ് അവന്റെ നേരെ വന്നു. ഓബദ്യാവ് ഏലിയാവിനെ തിരിച്ചറിഞ്ഞപ്പോൾ സാഷ്ടാംഗം വീണു പറഞ്ഞു: “എന്റെ യജമാനനായ ഏലിയാവേ, അങ്ങുതന്നെയാണോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വവും വിവരണത്തിലെ ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ എതിരേറ്റുവരുന്നു
  rationale: ഏലിയാവ് ഓബദ്യാവിന്റെ നേരെ വരുന്നതായി സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: സാഷ്ടാംഗം വീണു
  rationale: മുഖം നിലത്താക്കി ആദരപൂർവം വീഴുന്ന പ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനായ
  rationale: പ്രവാചകനോടുള്ള ആദരസൂചകമായ മാനുഷിക അഭിസംബോധനയാണ്; ദൈവനാമമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: הַאַתָּה זֶה
  choice: അങ്ങുതന്നെയാണോ?
  rationale: തിരിച്ചറിവിനോടൊപ്പം ഉറപ്പുവരുത്തുന്ന ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ആദരസൂചക സർവനാമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഓബദ്യാവ് ഏലിയാവിനെ ‘യജമാനൻ’ എന്നു വിളിക്കുന്നത്
  choice: എന്റെ യജമാനനായ ഏലിയാവേ
  alternative: എന്റെ കർത്താവായ ഏലിയാവേ
  rationale: ഇവിടെ אֲדֹנִי മനുഷ്യനോടുള്ള ആദരസൂചക അഭിസംബോധനയായതിനാൽ, ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കപ്പെടാവുന്ന ‘കർത്താവ്’ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ വിവരണശൈലി. ‘ഇതാ’ എന്ന ബൈബിൾസവിശേഷമായ ശ്രദ്ധാകർഷക പദം മൂലപാഠത്തിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കാൻ നിലനിർത്തി; സംഭാഷണത്തിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
