source:
  edition: WLC
  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: ml
  text: 'ഇപ്പോൾ അങ്ങ് എന്നോടു പറയുന്നു: ‘പോയി നിന്റെ യജമാനനോടു, “ഇതാ, ഏലിയാവ് ഇവിടെ ഉണ്ട്” എന്നു പറയുക,’ അപ്പോൾ അദ്ദേഹം എന്നെ കൊല്ലും!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ ഇപ്പോഴത്തെ സാഹചര്യത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ എന്നു നൽകേണ്ടതില്ല.
- source_word: לַאדֹנֶיךָ
  choice: നിന്റെ യജമാനനോട്
  rationale: אָדוֹן ഇവിടെ മനുഷ്യനായ അഹാബിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ദൈവനാമമോ ദൈവിക പദവിയോ സൂചിപ്പിക്കാതെ ‘യജമാനൻ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ഏലിയാവിന്റെ സാന്നിധ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണപദത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: וַהֲרָגָנִי
  choice: എന്നാൽ അദ്ദേഹം എന്നെ കൊല്ലും
  rationale: രൂപം അക്ഷരാർഥത്തിൽ ‘അവൻ എന്നെ കൊല്ലും’ എന്നാണ്; സന്ദർഭത്തിലെ ഭയപ്പെട്ട ഫലത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: וַהֲרָגָנִי എന്നതിലെ കർത്താവിന്റെ സൂചന
  choice: അദ്ദേഹം
  alternative: അവൻ
  rationale: സമീപസ്ഥനായ ‘നിന്റെ യജമാനൻ’ അഥവാ അഹാബാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. ആദരസൂചകമായ ‘അദ്ദേഹം’ ഒബദ്യാവിന്റെ രാജാവിനെക്കുറിച്ചുള്ള സംസാരരീതിയോട് യോജിക്കുന്നു; വ്യാഖ്യാനപരമായ അധികവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സംഭാഷണസഹജവുമായ ശൈലി. രാജാവിനോടു സംസാരിക്കുന്നതിനാൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ഉദ്ധരണിക്കുള്ളിലെ ‘നിന്റെ’ മൂലപാഠത്തിലെ രണ്ടാംപുരുഷ ഏകവചനത്തെ നിലനിർത്തുന്നു.
