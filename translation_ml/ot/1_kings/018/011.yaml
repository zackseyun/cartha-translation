  text: 'ഇപ്പോൾ നീ പറയുന്നു: ‘പോയി നിന്റെ യജമാനനോടു, “ഇതാ, ഏലിയാവ് ഇവിടെയുണ്ട്” എന്നു പറയുക.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: വാക്യത്തിന്റെ മുൻസന്ദർഭത്തോടുള്ള വിരുദ്ധഭാവവും കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַאדֹנֶיךָ
  choice: നിന്റെ യജമാനനോട്
  rationale: ഇവിടെ אֲדֹנִים മനുഷ്യാധികാരിയായ ആഹാബിനെ സൂചിപ്പിക്കുന്നതിനാൽ ദൈവനാമസൂചനയില്ലാത്ത ‘യജമാനൻ’ അനുയോജ്യം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു അവതരണപദത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള സ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
