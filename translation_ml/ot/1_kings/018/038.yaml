  text: וַ/תִּפֹּ֣ל אֵשׁ יְהוָ֗ה וַ/תֹּ֤אכַל אֶת הָֽ/עֹלָה֙ וְ/אֶת הָ֣/עֵצִ֔ים וְ/אֶת הָ/אֲבָנִ֖ים וְ/אֶת הֶ/עָפָ֑ר וְ/אֶת הַ/מַּ֥יִם אֲשֶׁר בַּ/תְּעָלָ֖ה לִחֵֽכָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെയുടെ തീ[a] ഇറങ്ങിവീണ് ഹോമയാഗവും വിറകും കല്ലുകളും പൊടിയും ദഹിപ്പിച്ചു; കിടങ്ങിലുണ്ടായിരുന്ന വെള്ളവും നക്കിയെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യഹ്‌വെയിൽനിന്നുള്ള തീ.’ തീയുടെ ദൈവിക ഉറവിടത്തിനാണ് ഹീബ്രു പ്രയോഗം ഊന്നൽ നൽകുന്നതെന്ന് മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: യഹ്‌വെയുടെ തീ
  rationale: ഹീബ്രുവിലെ ചേർന്നുനിൽക്കുന്ന നാമപ്രയോഗം തീ യഹ്‌വെയുമായി ബന്ധപ്പെട്ടതാണെന്ന് സൂചിപ്പിക്കുന്നു. ഉടമസ്ഥതയോ ദൈവിക ഉറവിടമോ എന്ന സൂക്ഷ്മത പൂർണമായി നിർണയിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתִּפֹּל
  choice: ഇറങ്ങിവീണ്
  rationale: נפל എന്ന ക്രിയയുടെ ‘വീഴുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും മുകളിൽനിന്ന് തീ വന്നുവെന്ന സന്ദർഭം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַתֹּאכַל
  choice: ദഹിപ്പിച്ചു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘തിന്നു’ എന്നാണെങ്കിലും തീയെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം ‘ദഹിപ്പിച്ചു’ എന്നതാണ്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി അർപ്പിച്ചു ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും കൃത്യവുമായ മലയാള പദം.
- source_word: הָעֵצִים
  choice: വിറക്
  rationale: യാഗപീഠത്തിൽ അടുക്കിവെച്ച കത്തിക്കാനുള്ള മരക്കഷണങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הָאֲבָנִים
  choice: കല്ലുകൾ
  rationale: നേരിട്ടുള്ള പദാന്തരം; തീ കല്ലുകളെയും ദഹിപ്പിച്ച അത്ഭുതത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: הֶעָפָר
  choice: പൊടി
  rationale: עפר എന്ന പദത്തിന്റെ പൊടി/അയഞ്ഞ മണ്ണ് എന്ന ദൃശ്യാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: לִחֵכָה
  choice: നക്കിയെടുത്തു
  rationale: ‘നക്കുക’ എന്ന സജീവ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് വെള്ളം പൂർണമായി ഇല്ലാതായതായി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: കിടങ്ങിലുണ്ടായിരുന്ന വെള്ളം
  rationale: യാഗപീഠത്തിനു ചുറ്റുമുള്ള തോടുപോലുള്ള കുഴിയെ ‘കിടങ്ങ്’ എന്ന് വ്യക്തവും സന്ദർഭോചിതവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַ
  choice: അപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ആ ക്രമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ, ആധുനിക മലയാളത്തിൽ അതിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത ‘യഹ്‌വെ’ എന്നു നൽകുന്നു.
- issue: אֵשׁ יְהוָה എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: യഹ്‌വെയുടെ തീ
  alternative: യഹ്‌വെയിൽനിന്നുള്ള തീ
  rationale: തീയുടെ ദൈവിക ബന്ധവും പ്രവർത്തനവും നിലനിർത്തുന്നു; എന്നാൽ ഹീബ്രു വ്യാകരണം അനുവദിക്കുന്ന ഉടമസ്ഥത/ഉറവിടം എന്നീ സൂക്ഷ്മവായനകളിൽ ഒന്നിനെ മാത്രം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദഹിപ്പിച്ചു’ എന്ന സ്വാഭാവിക അഗ്നിപ്രയോഗത്തോടൊപ്പം ‘നക്കിയെടുത്തു’ എന്ന മൂലപാഠത്തിലെ സജീവ ദൃശ്യരൂപവും നിലനിർത്തിയിരിക്കുന്നു.
