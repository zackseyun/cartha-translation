  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: ml
  text: യഹ്‌വെയുടെ കൈ ഏലിയാവിന്മേൽ ഉണ്ടായിരുന്നു[a]. അവൻ ഓടാനായി തന്റെ വസ്ത്രം അരയിൽ ഒതുക്കിക്കെട്ടി[b], അഹാബിനു മുമ്പിലായി യിസ്രെയേലിലേക്കുള്ള പ്രവേശനസ്ഥലംവരെ ഓടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരമ്പരാഗത പരിഭാഷ: “യഹ്‌വെയുടെ കൈ ഏലിയാവിന്മേൽ വന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവൻ തന്റെ അര മുറുക്കി”; അതായത്, ഓടുന്നതിനായി തന്റെ നീണ്ട വസ്ത്രം ഉയർത്തി അരയിൽ ഒതുക്കിക്കെട്ടി.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായ ഉച്ചാരണത്തിന്റെ അംഗീകരിക്കപ്പെട്ട ആധുനിക ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: യഹ്‌വെയുടെ കൈ ... മേൽ ഉണ്ടായിരുന്നു
  rationale: ദൈവിക ശക്തിയെയോ സ്വാധീനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം അതിന്റെ ദൃശ്യരൂപവും അർഥവ്യാപ്തിയും നിലനിർത്തിക്കൊണ്ട് പരിഭാഷപ്പെടുത്തി; ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘ഉണ്ടായിരുന്നു’ സംരക്ഷിച്ചു.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: തന്റെ വസ്ത്രം അരയിൽ ഒതുക്കിക്കെട്ടി
  rationale: ഓടാൻ തടസ്സമാകാതിരിക്കാനായി നീണ്ട വസ്ത്രം ഉയർത്തിക്കെട്ടുന്ന പ്രവൃത്തിയാണ് ഈ സാംസ്കാരിക പ്രയോഗം സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥമായ ‘അരക്കെട്ടു കെട്ടി’ എന്നതിനെക്കാൾ ആധുനിക വായനക്കാർക്ക് പ്രവർത്തി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּרָץ לִפְנֵי אַחְאָב
  choice: അഹാബിനു മുമ്പിലായി ... ഓടി
  rationale: അഹാബിന്റെ മുന്നിലായി ഓടിയെന്ന സ്ഥലബന്ധം നിലനിർത്തുന്നു; ഇത് ഔപചാരികമായ അകമ്പടിസേവനമാണെന്ന് വിവർത്തനംകൊണ്ട് നിർബന്ധിക്കുന്നില്ല.
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: യിസ്രെയേലിലേക്കുള്ള പ്രവേശനസ്ഥലംവരെ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ഈ ഘടന പട്ടണത്തിലേക്കുള്ള സമീപനമോ പ്രവേശനസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; യിസ്രെയേലിനകത്തേക്ക് എത്തിയെന്ന് അതിലധികം വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ഏലിയാവിനു ലഭിച്ച ദൈവിക ശക്തിയുടെ സ്വഭാവം
  choice: ‘യഹ്‌വെയുടെ കൈ ഏലിയാവിന്മേൽ ഉണ്ടായിരുന്നു’ എന്ന ദൈവിക പ്രവർത്തനത്തിന്റെ വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: അതിമാനുഷിക വേഗത്തിനായുള്ള പ്രത്യേക അത്ഭുതശക്തി ലഭിച്ചു എന്നോ പ്രവാചകപ്രേരണ മാത്രം ലഭിച്ചു എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായവാക്യം ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ രീതി നിർവചിക്കുന്നില്ല. അതിനാൽ അത്ഭുതശക്തി, പ്രവാചകപ്രേരണ, അല്ലെങ്കിൽ രണ്ടും എന്ന സാധ്യതകൾക്കിടയിലെ അർഥവ്യാപ്തി പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. അപരിചിതമായ ശരീരഭാഗപ്രയോഗം മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ച് പ്രവൃത്തി വ്യക്തമാക്കിയിരിക്കുന്നു; എബ്രായത്തിലെ ദൈവിക ‘കൈ’ എന്ന രൂപകം മാറ്റാതെ നിലനിർത്തിയിരിക്കുന്നു.
