language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: ml
  text: 'ഏഴാം പ്രാവശ്യം ആയപ്പോൾ അവൻ പറഞ്ഞു: “ഇതാ, ഒരു മനുഷ്യന്റെ ഉള്ളങ്കൈപോലെ[a] ചെറിയൊരു മേഘം കടലിൽനിന്ന് ഉയർന്നുവരുന്നു.” അപ്പോൾ അവൻ പറഞ്ഞു: “മുകളിലേക്കു കയറി ആഹാബിനോടു പറയുക: ‘രഥം കെട്ടി[b] താഴേക്കു പോകുക; മഴ നിന്നെ തടഞ്ഞുവെക്കാതിരിക്കാൻ[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മനുഷ്യന്റെ കൈപ്പത്തിപോലെ.”
    reason: lexical_alternative
  - marker: b
    text: “രഥം കെട്ടുക” എന്നത് കുതിരകളെ രഥത്തിൽ പൂട്ടി യാത്രയ്ക്കായി ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ “മഴ നിന്നെ വൈകിപ്പിക്കാതിരിക്കാൻ” അല്ലെങ്കിൽ “മഴ നിന്നെ പിടിച്ചുവെക്കാതിരിക്കാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: ഏഴാം പ്രാവശ്യം
  rationale: സേവകൻ ആവർത്തിച്ച് നോക്കാൻ പോയ പശ്ചാത്തലത്തിൽ ഇത് ഏഴാമത്തെ അവസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം ഉപയോഗിച്ചു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: കാണുന്ന കാര്യത്തിലേക്ക് ഉടൻ ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ നിപാതത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: עָב קְטַנָּה
  choice: ചെറിയൊരു മേഘം
  rationale: മേഘത്തിന്റെ ചെറുപ്പം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: כְּכַף אִישׁ
  choice: ഒരു മനുഷ്യന്റെ ഉള്ളങ്കൈപോലെ
  rationale: כַּף എന്ന പദത്തിന്റെ ‘ഉള്ളങ്കൈ’ എന്ന അർഥവും അളവ്/രൂപസാദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: עֹלָה מִיָּם
  choice: കടലിൽനിന്ന് ഉയർന്നുവരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ദൃശ്യപ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: עֲלֵה
  choice: മുകളിലേക്കു ചെന്ന്
  rationale: ആജ്ഞയുടെ ദിശാസൂചന നിലനിർത്തുന്നു; വെറും ‘പോകുക’ എന്നതിനെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: אֱסֹר
  choice: രഥം കെട്ടിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ കെട്ടുക/ബന്ധിക്കുക എന്ന ക്രിയ ഇവിടെ യാത്രയ്ക്കായി രഥത്തെയും കുതിരകളെയും ഒരുക്കുന്ന സന്ദർഭപ്രയോഗമാണ്; മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സൂചിത കർമം വ്യക്തമാക്കി.
- source_word: וָרֵד
  choice: താഴേക്കു പോകുക
  rationale: കർമ്മേൽ പ്രദേശത്തുനിന്നുള്ള താഴോട്ടുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന ദിശാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: മഴ നിന്നെ തടഞ്ഞുവെക്കാതിരിക്കട്ടെ
  rationale: עצר എന്ന ക്രിയയുടെ തടയുക, പിടിച്ചുവെക്കുക, യാത്ര വൈകിപ്പിക്കുക എന്നീ സാധ്യതകളെ അതിയായി നിർണ്ണയിക്കാതെ പ്രായോഗിക മുന്നറിയിപ്പിന്റെ ഭാവം നൽകുന്നു.
theological_decisions:
- issue: രണ്ടാമത്തെ וַיֹּאמֶר എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ പറഞ്ഞു
  alternative: ഏലിയാവ് പറഞ്ഞു
  rationale: സന്ദർഭത്തിൽ കർത്താവ് ഏലിയാവാണെന്ന് മനസ്സിലാകുന്നുവെങ്കിലും മൂലപാഠം പേര് ആവർത്തിക്കുന്നില്ല; അതിനാൽ പാഠത്തിലെ സർവനാമപരമായ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ച ‘അവൻ പറഞ്ഞു’ എന്ന ഘടന മൂലപാഠത്തിന്റെ കർത്തൃസൂചനയും ചെറിയ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു; രഥസജ്ജീകരണത്തിന്റെ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
