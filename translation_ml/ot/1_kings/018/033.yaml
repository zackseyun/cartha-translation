  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ ക്രിയാരൂപങ്ങളെ ‘പിന്നെ’ എന്നും അനുബന്ധ ക്രിയാരൂപങ്ങളിലൂടെയും സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
