translation:
  language: ml
  text: പിന്നെ അവൻ വിറക് ക്രമമായി അടുക്കി, കാളയെ കഷണങ്ങളാക്കി മുറിച്ച് വിറകിന്മേൽ വെച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: ക്രമമായി അടുക്കി
  rationale: ערך എന്ന ക്രിയയ്ക്ക് ഈ യാഗസന്ദർഭത്തിൽ ക്രമപ്പെടുത്തുക, അടുക്കിവെക്കുക എന്ന അർഥമാണ്; വിറകിനെക്കുറിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: הָעֵצִים
  choice: വിറക്
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം ഇവിടെ യാഗത്തിനുള്ള ഇന്ധനമരത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ആ അർഥം ആധുനിക മലയാളത്തിൽ ‘വിറക്’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְנַתַּח
  choice: കഷണങ്ങളാക്കി മുറിച്ച്
  rationale: נתח യാഗമൃഗത്തെ ഭാഗങ്ങളായി വിഭജിക്കുന്ന പ്രവൃത്തിയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതികമോ അമിതമായി ദൃശ്യവൽക്കരിക്കുന്നതോ ആകാതെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַפָּר
  choice: കാളയെ
  rationale: פַּר യാഗസന്ദർഭത്തിൽ ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; പ്രായം വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘കാള’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַיָּשֶׂם
  choice: വെച്ചു
  rationale: שׂים എന്ന സാധാരണ ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
- source_word: עַל הָעֵצִים
  choice: വിറകിന്മേൽ
  rationale: עַל എന്ന സ്ഥലസൂചക അവ്യയത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും യാഗപീഠത്തിലെ ഒരുക്കം വ്യക്തമായി കാണിക്കുകയും ചെയ്യുന്നു.
