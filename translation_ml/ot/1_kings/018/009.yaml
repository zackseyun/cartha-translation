  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസുഗമവുമായ ശൈലി. ഏലിയാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ “അങ്ങ്/അങ്ങയുടെ” ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ വ്യത്യസ്ത വായന ആവശ്യപ്പെടുന്ന ഘടകം ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് അതിന്റെ മുഖ്യപാഠത്തിലെ marker-നോട് പൊരുത്തപ്പെടുന്നില്ലെന്നും അത് വാക്യാന്ത്യത്തിലെ lexical alternative ആണെന്നും കണക്കിലെടുത്തു.
