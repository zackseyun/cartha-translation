source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ എന്തു പാപമാണ് ചെയ്തത്? അങ്ങ് അങ്ങയുടെ ദാസനെ ആഹാബിന്റെ കൈയിൽ ഏല്പിച്ച് കൊല്ലുന്നതിനായല്ലോ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ പതിവ് wayyiqtol പ്രയോഗം; സന്ദർഭത്തിൽ ഓബദ്യാവിന്റെ മറുപടി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מֶה חָטָאתִי
  choice: ഞാൻ എന്തു പാപമാണ് ചെയ്തത്?
  rationale: חטא എന്ന പദത്തിന്റെ പാപം/തെറ്റ് എന്ന ധാർമിക ഭാരം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യരൂപം നൽകുന്നു.
- source_word: כִּי אַתָּה נֹתֵן
  choice: അങ്ങ് ... ഏല്പിക്കുന്നുവല്ലോ
  rationale: പ്രത്യക്ഷവും ആസന്നവുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന participle-ന്റെ ഭാവവും പരാതിയുടെ ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനെ
  rationale: മേലധികാരിയോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശമാണ്; അടിമത്തത്തെ അനാവശ്യമായി മുൻനിർത്താതെ ദാസൻ എന്നു നൽകുന്നു.
- source_word: בְּיַד אַחְאָב
  choice: ആഹാബിന്റെ കൈയിൽ
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ കീഴിൽ ഏല്പിക്കുക എന്ന ഹീബ്രായ രൂപകം സംരക്ഷിക്കുന്നു; മലയാളത്തിലും അർത്ഥവത്താണ്.
- source_word: לַהֲמִיתֵנִי
  choice: കൊല്ലുന്നതിനായി
  rationale: מות എന്ന ക്രിയയുടെ causative infinitive ഇവിടെ ഉദ്ദേശിക്കുന്ന മരണത്തിലേക്കുള്ള ഏല്പിക്കൽ വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ നേരിട്ടും ഗൗരവത്തോടെയും സ്വാഭാവികമാണ്.
