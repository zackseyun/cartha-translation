source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: ml
  text: ആഹാബ് രാജഗൃഹത്തിന്റെ ചുമതലക്കാരനായ ഓബദ്യാവിനെ[a] വിളിച്ചു. ഓബദ്യാവ് യാഹ്‌വെയെ അത്യന്തം ഭയപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “കൊട്ടാരത്തിന്റെ ചുമതലക്കാരനായ.” എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “വീടിന്മേൽ ഉണ്ടായിരുന്നവൻ” എന്നാണ്; രാജഗൃഹത്തിന്റെ മേൽനോട്ടം വഹിച്ചിരുന്ന ഒരു ഉന്നത ഉദ്യോഗസ്ഥനെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: വിളിച്ചു
  rationale: קרא + אֶל ഇവിടെ ഓബദ്യാവിനെ തന്റെ അടുക്കൽ വിളിക്കുന്ന ആഹാബിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. രാജകീയ അധികാരത്തിന്റെ ശക്തമായ ഭാവം നിർബന്ധമായി ചേർക്കുന്ന ‘ആജ്ഞാപിച്ചു വരുത്തി’ എന്നതിനെക്കാൾ ‘വിളിച്ചു’ മൂലപാഠത്തോട് ചേർന്നതും സ്വാഭാവികവുമാണ്.
- source_word: עֹבַדְיָהוּ
  choice: ഓബദ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: രാജഗൃഹത്തിന്റെ ചുമതലക്കാരനായ
  rationale: അക്ഷരാർഥത്തിൽ ‘വീടിന്മേൽ’ എന്ന പ്രയോഗം രാജാവിന്റെ ഗൃഹകാര്യങ്ങളുടെയോ രാജഗൃഹത്തിന്റെയോ മേൽനോട്ടം വഹിച്ചിരുന്ന ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ഈ ഭരണപരമായ അർഥം വ്യക്തമായി നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: וְעֹבַדְיָהוּ הָיָה יָרֵא
  choice: ഓബദ്യാവ് ... ഭയപ്പെട്ടിരുന്നു
  rationale: വാവ് ഇവിടെ ഓബദ്യാവിനെക്കുറിച്ചുള്ള പശ്ചാത്തലവിവരം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പേര് ആവർത്തിച്ചുകൊണ്ട് പുതിയ വാക്യം തുടങ്ങുന്നത് സ്വാഭാവികമാണ്. ക്രിയാരൂപം അദ്ദേഹത്തിന്റെ സ്ഥിരമായ സ്വഭാവനിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: יָרֵא אֶת יְהוָה
  choice: യാഹ്‌വെയെ ... ഭയപ്പെട്ടിരുന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘ഭയപ്പെട്ടു’ നിലനിർത്തുന്നു; ‘ആദരിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് അർഥം മൃദൂകരിച്ചിട്ടില്ല.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: ഓബദ്യാവിന്റെ യാഹ്‌വാഭയത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന ശക്തമായ, എന്നാൽ മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: יָרֵא എന്നതിലെ ഭയവും ഭക്തിയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: ഭയപ്പെട്ടിരുന്നു
  alternative: ഭക്തിയോടെ ആദരിച്ചിരുന്നു
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, മൂലപദത്തിലെ യഥാർഥ ‘ഭയം’ എന്ന ഘടകം നഷ്ടപ്പെടാതിരിക്കാനാണ് നേരിട്ടുള്ള പദം നിലനിർത്തിയത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. രാജസഭാ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘രാജഗൃഹം’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും ഓബദ്യാവിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പശ്ചാത്തലവിവരവും നിലനിർത്തി.
