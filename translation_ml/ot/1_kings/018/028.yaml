translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. എബ്രായ വാക്യത്തിന്റെ ആചാരപരമായ പശ്ചാത്തലവും രക്തം ഒഴുകുന്ന ദൃശ്യഭാവവും നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി വികാരതീവ്രത കൂട്ടിയിട്ടില്ല.
