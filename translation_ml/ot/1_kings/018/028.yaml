  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: ml
  text: അങ്ങനെ അവർ ഉച്ചത്തിൽ നിലവിളിച്ചു; തങ്ങളുടെ പതിവനുസരിച്ച്[b] വാളുകളും കുന്തങ്ങളുംകൊണ്ട്, അവരുടെ ദേഹത്ത് രക്തം ഒഴുകുന്നതുവരെ, തങ്ങളെത്തന്നെ മുറിവേൽപ്പിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളെത്തന്നെ കീറിമുറിച്ചു.’ എബ്രായപദം ആചാരപരമായി സ്വന്തം ശരീരത്തിൽ മുറിവേൽപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തങ്ങളുടെ ആചാരപ്രകാരം’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ രീതിയനുസരിച്ച്.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: അവർ ഉച്ചത്തിൽ നിലവിളിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ബാൽദേവനെ തീവ്രമായി വിളിച്ചപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ ആ ആചാരപരമായ ഉച്ചവിളിയുടെ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּקוֹל גָּדוֹל
  choice: ഉച്ചത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വലിയ ശബ്ദത്തോടെ’; ‘ഉച്ചത്തിൽ’ എന്നത് അതേ ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיִּתְגֹּדְדוּ
  choice: തങ്ങളെത്തന്നെ മുറിവേൽപ്പിച്ചു
  rationale: പ്രത്യാവർത്തക ക്രിയാരൂപം ആചാരത്തിന്റെ ഭാഗമായി സ്വന്തം ശരീരം മുറിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തിരുവെഴുത്തിൽ ഇല്ലാത്ത അധിക തീവ്രത ചേർക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: כְּמִשְׁפָּטָם
  choice: തങ്ങളുടെ പതിവനുസരിച്ച്
  rationale: ഇവിടെ מִשְׁפָּט നിയമവിധിയേക്കാൾ അവരുടെ സ്ഥാപിതമായ ആചാരരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: വാളുകളും കുന്തങ്ങളുംകൊണ്ട്
  rationale: בְ ഉപകരണത്തെ സൂചിപ്പിക്കുന്നു; חֶרֶב, רֹמַח എന്നീ ആയുധപദങ്ങൾക്ക് യഥാക്രമം സ്വാഭാവികമായ മലയാളസമാനങ്ങൾ ഉപയോഗിച്ചു.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: അവരുടെ ദേഹത്ത് രക്തം ഒഴുകുന്നതുവരെ
  rationale: עַד പ്രവൃത്തിയുടെ പരിധി സൂചിപ്പിക്കുന്നു; שׁפךְ דָּם എന്ന ദൃശ്യഭാവം ‘രക്തം ഒഴുകുക’ എന്നു സ്വാഭാവികമായി നൽകി, עֲלֵיהֶם എന്നത് ദേഹത്തിന്മേൽ രക്തം ഒഴുകിയതായി വ്യക്തമാക്കി.
