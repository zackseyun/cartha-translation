source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: ml
  text: ഞാൻ അങ്ങയെ വിട്ടുപോയാൽ, യഹോവയുടെ ആത്മാവ്[a] എനിക്കറിയാത്ത എവിടേക്കെങ്കിലും അങ്ങയെ എടുത്തുകൊണ്ടുപോയേക്കാം. പിന്നെ ഞാൻ ചെന്നു ആഹാബിനെ അറിയിച്ചിട്ടും അവൻ അങ്ങയെ കണ്ടെത്താതിരുന്നാൽ, അവൻ എന്നെ കൊന്നുകളയും. എങ്കിലും അങ്ങയുടെ ദാസനായ ഞാൻ എന്റെ ചെറുപ്പം മുതൽ യഹോവയെ ഭയപ്പെട്ടുപോരുന്നവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹോവയുടെ കാറ്റ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ רוּחַ എന്ന പദത്തിന് ‘ആത്മാവ്’, ‘കാറ്റ്’, ‘ശ്വാസം’ എന്നീ അർഥങ്ങളുണ്ട്. ഈ സന്ദർഭത്തിൽ ‘ആത്മാവ്’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: ഞാൻ അങ്ങയെ വിട്ടുപോയിക്കഴിഞ്ഞാൽ
  rationale: ഭാവിയിലെ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവികമായ മലയാള ഉപാധിവാക്യമായി അവതരിപ്പിക്കുന്നു; ഏലിയാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയെ’ ഉപയോഗിച്ചു.
- source_word: רוּחַ יְהוָה
  choice: യഹോവയുടെ ആത്മാവ്
  rationale: רוּחַ എന്നതിന് ‘ആത്മാവ്’, ‘കാറ്റ്’, ‘ശ്വാസം’ എന്നീ അർഥങ്ങൾ ഉണ്ടെങ്കിലും, പ്രവാചകനെ ദൈവികമായി മാറ്റിക്കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘ആത്മാവ്’ ഏറ്റവും യോജിക്കുന്നു; യഹോവ എന്ന ദിവ്യനാമം നിലനിർത്തി.
- source_word: יִשָּׂאֲךָ
  choice: അങ്ങയെ എടുത്തുകൊണ്ടുപോയേക്കാം
  rationale: נשא എന്നതിലെ എടുത്തുയർത്തുക/വഹിക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; ഓബദ്യാവിന്റെ ആശങ്കാപൂർണമായ സാധ്യതയെ ‘പോയേക്കാം’ വ്യക്തമാക്കുന്നു.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: എനിക്ക് അറിയാത്ത ഏതെങ്കിലും സ്ഥലത്തേക്ക്
  rationale: അജ്ഞാതമായ ലക്ഷ്യസ്ഥാനത്തെ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പറയുന്നു; ഉറപ്പില്ലായ്മയും സംരക്ഷിക്കുന്നു.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: പിന്നെ ഞാൻ ചെന്ന് ആഹാബിനോടു വിവരം അറിയിക്കുകയും
  rationale: തുടർന്നുള്ള ക്രിയാക്രമം വ്യക്തമാക്കുകയും הגיד എന്നത് ഇവിടെ രാജാവിനോടുള്ള റിപ്പോർട്ടായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: അയാൾ അങ്ങയെ കണ്ടെത്താതിരിക്കുകയും ചെയ്താൽ, അയാൾ എന്നെ കൊന്നുകളയും
  rationale: കണ്ടെത്താതിരിക്കുന്നതിന്റെ ഫലമായി ഓബദ്യാവിനു സംഭവിക്കുമെന്ന് ഭയപ്പെടുന്ന മരണത്തെ നേരായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: וְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ഞാൻ
  rationale: ഇവിടെ עבד അടിമത്തത്തെ ഊന്നുന്നതിനെക്കാൾ ആദരപൂർവമായ സ്വയംപരാമർശമാണ്; അതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: എന്റെ ചെറുപ്പംമുതൽ യഹോവയെ ഭയപ്പെടുന്നവനാണ്
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ഭയവും ചെറുപ്പംമുതൽ ഇപ്പോഴും തുടരുന്ന നിലയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: רוּחַ יְהוָה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ ആത്മാവ്
  alternative: യഹോവയുടെ കാറ്റ്
  rationale: ദൈവിക പ്രവർത്തനശക്തി ഏലിയാവിനെ അജ്ഞാതസ്ഥാനത്തേക്ക് കൊണ്ടുപോകുമെന്ന പ്രവാചകസന്ദർഭം ‘ആത്മാവ്’ എന്ന വായനയ്ക്ക് മുൻതൂക്കം നൽകുന്നു; എന്നാൽ മൂലപദത്തിന്റെ യഥാർഥ ബഹുവ്യഞ്ജകത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- issue: അവസാന വാക്യത്തിന്റെ ബന്ധം
  choice: എന്നാൽ അങ്ങയുടെ ദാസനായ ഞാൻ...
  alternative: എങ്കിലും അങ്ങയുടെ ദാസനായ ഞാൻ...
  rationale: വധഭീഷണിക്കു വിരുദ്ധമായി ഓബദ്യാവിന്റെ ദീർഘകാല ദൈവഭക്തി ഉന്നയിക്കുന്ന വാക്യത്തിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏലിയാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ആഹാബിനെക്കുറിച്ച് ‘അയാൾ’ ഉപയോഗിച്ച് വ്യക്തത നൽകി. വാക്യത്തിന്റെ ആശങ്കയും ദൈവഭക്തിയെക്കുറിച്ചുള്ള അവസാന പ്രതിവാദവും നിലനിർത്തി.
