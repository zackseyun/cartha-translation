source:
  edition: WLC
  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: ml
  text: അങ്ങനെ ആഹാബ് ഭക്ഷിക്കാനും കുടിക്കാനും കയറിപ്പോയി. എന്നാൽ ഏലിയാവ് കർമ്മേലിന്റെ മുകളിലേക്കു കയറിച്ചെന്ന് നിലത്തേക്ക് കുനിഞ്ഞ് തന്റെ മുഖം മുട്ടുകൾക്കിടയിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ശരീരനില പ്രാർഥനയോടു ബന്ധപ്പെട്ടതാണെന്ന് സന്ദർഭം സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ഈ വാക്യം ഏലിയാവ് ‘പ്രാർഥിച്ചു’ എന്നു നേരിട്ട് പറയുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: കയറിപ്പോയി
  rationale: עלה എന്ന സാധാരണ ദിശാസൂചക ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: ഭക്ഷിക്കാനും കുടിക്കാനും
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന രണ്ടു infinitive രൂപങ്ങളെയും സമാന്തരമായി, സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְאֵלִיָּהוּ
  choice: എന്നാൽ ഏലിയാവ്
  rationale: ഹീബ്രു ബന്ധകം അക്ഷരാർഥത്തിൽ ‘ഉം/അപ്പോൾ’ ആണെങ്കിലും, ആഹാബിന്റെയും ഏലിയാവിന്റെയും പ്രവൃത്തികൾ തമ്മിലുള്ള വാക്യഘടനാപരമായ വൈരുധ്യം മലയാളത്തിലെ ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: കർമ്മേലിന്റെ മുകളിലേക്കു കയറിച്ചെന്ന്
  rationale: רֹאשׁ എന്നതിന്റെ സന്ദർഭോചിതമായ ‘മുകൾ/ഉച്ചഭാഗം’ എന്ന അർഥവും עלה എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പർവതം’ പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַיִּגְהַר אַרְצָה
  choice: നിലത്തേക്ക് കുനിഞ്ഞ്
  rationale: അപൂർവമായ גהר സൂചിപ്പിക്കുന്ന ശരീരം താഴ്ത്തിയ ഭാവം വ്യക്തമാക്കുന്നു; അതിനെ ആരാധനയോ പ്രാർഥനയോ എന്നു വ്യാഖ്യാനിച്ച് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָיו
  choice: തന്റെ മുഖം മുട്ടുകൾക്കിടയിൽ വെച്ചു
  rationale: ഏലിയാവിന്റെ ശരീരനിലയെ മൂലപാഠം വിവരിക്കുന്നതുപോലെ മൂർത്തവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ ശരീരനിലയെ പ്രധാന പാഠത്തിൽ പ്രാർഥനയായി വ്യാഖ്യാനിക്കണമോ
  choice: ശാരീരിക ഭാവം മാത്രം വിവരിച്ച് ‘പ്രാർഥിച്ചു’ എന്നു ചേർക്കാതിരിക്കുക
  alternative: ‘അവൻ കുനിഞ്ഞ് പ്രാർഥിച്ചു’ അല്ലെങ്കിൽ ‘മുട്ടുകൾക്കിടയിൽ മുഖംവെച്ച് പ്രാർഥിച്ചു’
  rationale: വിശാലമായ സന്ദർഭം പ്രാർഥനയെ സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യം ശരീരനില മാത്രമാണ് നേരിട്ട് പറയുന്നത്. അതിനാൽ മൂലപാഠത്തിന്റെ പരിധിയും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കർമ്മേൽ’ എന്ന പേരിൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘പർവതം’ ചേർത്തിട്ടില്ല. വൈരുധ്യം സ്വാഭാവികമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചെങ്കിലും പ്രവൃത്തികളുടെ വ്യക്തമായ വിവരണം മാറ്റിയിട്ടില്ല.
