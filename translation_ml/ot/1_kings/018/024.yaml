id: 1KI.18.24
reference: 1 Kings 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/שֵׁ֣ם אֱלֹֽהֵי/כֶ֗ם וַֽ/אֲנִי֙ אֶקְרָ֣א בְ/שֵׁם יְהוָ֔ה וְ/הָיָ֧ה הָ/אֱלֹהִ֛ים אֲשֶׁר יַעֲנֶ֥ה בָ/אֵ֖שׁ ה֣וּא הָ/אֱלֹהִ֑ים וַ/יַּ֧עַן כָּל הָ/עָ֛ם וַ/יֹּאמְר֖וּ ט֥וֹב הַ/דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: ml
  text: '“നിങ്ങൾ നിങ്ങളുടെ ദേവന്റെ നാമം വിളിച്ചപേക്ഷിക്കുവിൻ[a]; ഞാനോ യഹ്‌വേയുടെ നാമം വിളിച്ചപേക്ഷിക്കും. ഏതു ദൈവമാണോ തീകൊണ്ട് ഉത്തരം നൽകുന്നത്, അവൻ തന്നെയാണ് ദൈവം.” ജനമെല്ലാം മറുപടിയായി പറഞ്ഞു: “ഈ നിർദേശം നല്ലതാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ദേവന്മാരുടെ.” אֱלֹהֵיכֶם എന്ന രൂപം യഥാർഥ ബഹുവചനമായി വായിക്കാനും കഴിയും; എന്നാൽ ഈ മത്സരത്തിന്റെ സന്ദർഭത്തിൽ അത് ബാലെന്ന ഏക ദേവതയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈ വാക്ക് നല്ലതാണ്” അല്ലെങ്കിൽ “ഈ കാര്യം നല്ലതാണ്.” ഹീബ്രായിലെ דָּבָר എന്ന പദത്തിന് ‘വാക്ക്,’ ‘കാര്യം,’ ‘നിർദേശം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: നാമം വിളിച്ചപേക്ഷിക്കുവിൻ
  rationale: קרא בשם എന്ന പ്രയോഗം ഒരു ദേവതയുടെ നാമം വിളിച്ച് സഹായം അഭ്യർഥിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നത് ആരാധനാപരമായ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദേവന്റെ
  rationale: രൂപപരമായി ബഹുവചനമാകാമെങ്കിലും, സന്ദർഭത്തിൽ ബാലിനെ പ്രതിനിധീകരിക്കുന്ന ഏക ദേവതയെയാണ് പ്രവാചകന്മാർ വിളിക്കേണ്ടത്; അതിനാൽ ഏകവചനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַאֲנִי אֶקְרָא
  choice: ഞാനോ ... വിളിച്ചപേക്ഷിക്കും
  rationale: ഹീബ്രായിലെ സമന്വയത്തോടൊപ്പം സന്ദർഭത്തിലുള്ള വൈരുധ്യവും ‘ഞാനോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: ഏതു ദൈവമാണോ തീകൊണ്ട് ഉത്തരം നൽകുന്നത്
  rationale: בָאֵשׁ എന്നത് ഇവിടെ ഉപാധിയോ പ്രതികരണത്തിന്റെ രൂപമോ ആയി ‘തീകൊണ്ട്’ എന്നു സ്വാഭാവികമായി വരുന്നു. ‘ഏതു ... ആണോ’ എന്ന ഘടന മത്സരത്തിന്റെ നിബന്ധന വ്യക്തമാക്കുന്നു.
- source_word: הוּא הָאֱלֹהִים
  choice: അവൻ തന്നെയാണ് ദൈവം
  rationale: הוּא നൽകുന്ന ഊന്നൽ ‘തന്നെയാണ്’ കൊണ്ട് നിലനിർത്തി; ഉത്തരം നൽകുന്നവനാണ് യഥാർഥ ദൈവം എന്ന വിധിനിർണയവും സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് രണ്ടു ക്രിയകളുടെയും പ്രതികരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: טוֹב הַדָּבָר
  choice: ഈ നിർദേശം നല്ലതാണ്
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘നിർദേശം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഇവിടെ ഏലിയാവിന്റെ നിർദേശിച്ച പരീക്ഷയെ ജനങ്ങൾ അംഗീകരിക്കുന്നതിനാൽ ‘നിർദേശം’ സന്ദർഭോചിതമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: אֱלֹהֵיכֶם ഏകവചനമോ ബഹുവചനമോ
  choice: നിങ്ങളുടെ ദേവൻ
  alternative: നിങ്ങളുടെ ദേവന്മാർ
  rationale: രൂപം ബഹുവചനമായി വായിക്കാമെങ്കിലും ബാലുമായുള്ള ഏകദേവതാ മത്സരസന്ദർഭം ഏകവചനത്തെ പിന്തുണയ്ക്കുന്നു. ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: הוּא הָאֱלֹהִים എന്ന വിധിനിർണയം
  choice: അവൻ തന്നെയാണ് ദൈവം
  alternative: ആ ദേവൻ തന്നെയാണ് ദൈവം
  rationale: ആരാണ് തീകൊണ്ട് ഉത്തരം നൽകുന്നതോ അവനാണ് യഥാർഥ ദൈവം എന്ന വാക്യത്തിലെ ഊന്നലും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ ശൈലി. ആരാധനാപരമായ പ്രയോഗത്തിന് ‘വിളിച്ചപേക്ഷിക്കുക’ ഉപയോഗിച്ചു; കൃത്രിമമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കിയെങ്കിലും ഹീബ്രായിലെ ഊന്നലും പദാർഥസാധ്യതകളും നിലനിർത്തി.
