id: 1KI.18.1
reference: 1 Kings 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: ml
  text: 'ഏറെ നാളുകൾ കഴിഞ്ഞപ്പോൾ, മൂന്നാം വർഷത്തിൽ യഹ്‌വെയുടെ അരുളപ്പാട് ഏലിയാവിന് ലഭിച്ചു: “നീ ചെന്ന് ആഹാബിന്റെ മുമ്പാകെ പ്രത്യക്ഷപ്പെടുക; ഞാൻ ദേശത്തിന്മേൽ മഴ നൽകും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഞാൻ ദേശത്ത് മഴ പെയ്യിക്കും.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥം: “ഞാൻ ദേശത്തിന്റെ മുഖത്തിന്മേൽ മഴ നൽകും.”'
    reason: ‘നൽകും’ എന്ന മൂലക്രിയയും ‘ദേശത്തിന്റെ മുഖത്തിന്മേൽ’ എന്ന എബ്രായ പ്രയോഗവും വ്യക്തമാക്കുന്നതിനൊപ്പം സ്വാഭാവികമായ മലയാള വ്യത്യസ്തവായന നൽകുന്നു.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: ഏറെ നാൾ കഴിഞ്ഞപ്പോൾ
  rationale: ഒരു പുതിയ സംഭവഘട്ടം ആരംഭിക്കുന്ന എബ്രായ ആഖ്യാനശൈലിയെയും ദീർഘമായ കാലയളവിനെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: യഹ്‌വെയുടെ അരുളപ്പാട് ... ഉണ്ടായി
  rationale: പ്രവാചകനു ലഭിക്കുന്ന ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ അർഥം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: മൂന്നാം വർഷത്തിൽ
  rationale: കാലസൂചനയെ നേരിട്ടും അതിന്റെ അവ്യക്തത നിലനിർത്തിയും പരിഭാഷപ്പെടുത്തുന്നു; ഏത് സംഭവത്തിൽനിന്നാണ് വർഷം കണക്കാക്കുന്നതെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: നീ ചെന്ന് ആഹാബിന് നിന്നെത്തന്നെ കാണിച്ചുകൊടുക്കുക
  rationale: הלך എന്ന ആജ്ഞയും ראה എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ‘കാണപ്പെടുക/സ്വയം കാണിക്കുക’ എന്ന പ്രതിഫലനാർഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֶתְּנָה מָטָר
  choice: ഞാൻ ... മഴ നൽകും
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘നൽകുക’ നിലനിർത്തി മഴ ദൈവത്തിന്റെ ദാനമാണെന്ന മൂലപാഠത്തിലെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ദേശത്തിന്മേൽ
  rationale: ക്ഷാമത്തിന്റെ പ്രാദേശിക പശ്ചാത്തലത്തിന് യോജിക്കുന്ന ‘ദേശം’ സ്വീകരിക്കുന്നു; പദാനുപദമായ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: മഴയെക്കുറിച്ചുള്ള ദൈവിക പ്രവർത്തനം
  choice: മഴ നൽകും
  alternative: മഴ പെയ്യിക്കും / അയക്കും
  rationale: മൂലത്തിലെ נתן എന്ന ‘നൽകുക’ എന്ന ക്രിയയെ സംരക്ഷിക്കുന്നു; അതിനെ കൂടുതൽ കാര്യകാരണപരമായ മറ്റൊരു പ്രയോഗമായി വ്യാഖ്യാനിച്ചു മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അതിപുരാതന പ്രയോഗങ്ങൾ ഒഴിവാക്കി; പ്രവാചകസന്ദേശത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘അരുളപ്പാട്’ ഉപയോഗിച്ചു. ‘മൂന്നാം വർഷം’ ഏത് ആരംഭബിന്ദുവിൽനിന്നാണെന്ന മൂലപാഠത്തിലെ അവ്യക്തത വിശദീകരിച്ചു തീർക്കാതെ സൂക്ഷിച്ചു.
