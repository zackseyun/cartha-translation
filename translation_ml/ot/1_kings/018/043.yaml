source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: ml
  text: പിന്നെ അവൻ തന്റെ പരിചാരകനോട്[a], “ദയവായി മുകളിലേക്കു കയറി കടലിന്റെ ദിശയിലേക്കു നോക്കുക[b]” എന്നു പറഞ്ഞു. അവൻ കയറിച്ചെന്നു നോക്കിയിട്ട്, “ഒന്നുമില്ല” എന്നു പറഞ്ഞു. അപ്പോൾ അവൻ, “ഏഴു പ്രാവശ്യം മടങ്ങിച്ചെല്ലുക[c]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ യുവാവിനോട്” അല്ലെങ്കിൽ “തന്റെ ശുശ്രൂഷകനോട്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “കടലിന്റെ ദിശയിൽ നോക്കുക.”
    reason: lexical_alternative
  - marker: c
    text: അതായത്, യാത്രയും നിരീക്ഷണവും ആവർത്തിച്ച് ആകെ ഏഴു പ്രാവശ്യം പൂർത്തിയാക്കുക.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: തന്റെ പരിചാരകനോട്
  rationale: נַעַר എന്നതിന് യുവാവ്, ബാല്യക്കാരൻ, ദാസൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഏലീയാവിന്റെ നിർദേശം അനുസരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പരിചാരകൻ’ സന്ദർഭത്തിന് യോജിച്ചതും സ്വാഭാവികവുമാണ്; പ്രായം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: עֲלֵה נָא
  choice: ദയവായി മുകളിലേക്കു കയറി
  rationale: עֲלֵה കയറാനുള്ള ആജ്ഞയും נָא അതിനെ മയപ്പെടുത്തുന്ന അപേക്ഷാഭാവവും പ്രകടിപ്പിക്കുന്നു. ‘ദയവായി’ ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: കടലിന്റെ ദിശയിലേക്കു നോക്കുക
  rationale: הַבֵּט ‘നോക്കുക’ എന്നും דֶּרֶךְ יָם ഇവിടെ കടലിന്റെ ദിശയിലേക്കെന്നും അർഥമാക്കുന്നു. മൂലപാഠത്തിലെ ദിശാസൂചന വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
- source_word: אֵין מְאוּמָה
  choice: ഒന്നുമില്ല
  rationale: ഈ പ്രയോഗം ഒന്നും ദൃശ്യമല്ലെന്ന ഊന്നിയ നിഷേധമാണ്. ‘ഒന്നുമില്ല’ സംക്ഷിപ്തവും സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: שֻׁב
  choice: മടങ്ങിച്ചെല്ലുക
  rationale: שׁוּב എന്നത് ‘മടങ്ങുക/തിരിച്ചുപോകുക’ എന്നാണ്. മുമ്പത്തെ കയറ്റവും നിരീക്ഷണവും ആവർത്തിക്കാനുള്ള നിർദേശം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘മടങ്ങിച്ചെല്ലുക’ യോജിക്കുന്നു.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: ആവർത്തനത്തിന്റെ എണ്ണം നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതമായ സംഖ്യാവാചകമാണ്.
