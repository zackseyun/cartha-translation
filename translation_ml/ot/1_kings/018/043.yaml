translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ വിവരണശൈലി സ്വീകരിച്ചു. സംഭാഷണം സ്വാഭാവികമാക്കി; മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും അവസാന നിർദേശത്തിലെ ആവർത്തനസൂചനയും നിലനിർത്തി.
