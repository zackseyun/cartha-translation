source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ עֹבַדְיָ֛הוּ לִ/קְרַ֥את אַחְאָ֖ב וַ/יַּגֶּד ל֑/וֹ וַ/יֵּ֥לֶךְ אַחְאָ֖ב לִ/קְרַ֥את אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: ml
  text: അങ്ങനെ ഓബദ്യാവ് ആഹാബിനെ കാണാൻ ചെന്നു വിവരം അറിയിച്ചു[a]. ആഹാബ് ഏലിയാവിനെ കാണാൻ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവനോടു പറഞ്ഞു.’ എബ്രായ ക്രിയയ്ക്ക് ‘പറഞ്ഞു,’ ‘വിവരം അറിയിച്ചു,’ ‘അറിയിച്ചു’ എന്നീ അർഥങ്ങളാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ചെന്നു
  rationale: הלך എന്ന ക്രിയയുടെ വയിക്തോൽ രൂപം ഇവിടെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘ചെന്നു’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: עֹבַדְיָהוּ
  choice: ഓബദ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപത്തിന് അനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: לִקְרַאת
  choice: കാണാൻ
  rationale: ഒരാളെ അഭിമുഖീകരിക്കാനോ കണ്ടുമുട്ടാനോ അയാളുടെ അടുത്തേക്കുള്ള സഞ്ചാരമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. രണ്ട് സന്ദർഭങ്ങളിലും ‘കാണാൻ’ സ്വാഭാവികമായി ആ ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחְאָב
  choice: ആഹാബ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּגֶּד לוֹ
  choice: വിവരം അറിയിച്ചു
  rationale: נגד എന്ന ഹിഫീൽ ക്രിയയ്ക്ക് ‘പറയുക, അറിയിക്കുക, റിപ്പോർട്ട് ചെയ്യുക’ എന്നീ അർഥങ്ങളുണ്ട്. അറിയിച്ച കാര്യത്തിന്റെ ഉള്ളടക്കം എബ്രായത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘വിവരം അറിയിച്ചു’ ആ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: ആഹാബ് ... ചെന്നു
  rationale: ആവർത്തിച്ച വയിക്തോൽ തുടർന്നുള്ള സംഭവത്തെ രേഖപ്പെടുത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമത്തിൽ രണ്ടാമത്തെ സ്വതന്ത്രവാക്യമായി നൽകി.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപത്തിന് അനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
