  register: ലളിതവും ആധുനികവും മാന്യവുമായ വിവരണശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ സംഭവക്രമം സ്വാഭാവിക മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളായി അവതരിപ്പിച്ചു; പരാമർശിക്കാത്ത സന്ദേശത്തിന്റെ ഉള്ളടക്കം കൂട്ടിച്ചേർത്തിട്ടില്ല.
