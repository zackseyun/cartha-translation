  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: ml
  text: അങ്ങനെ അവർ തങ്ങൾക്കു കൊടുത്ത കാളയെ എടുത്ത് ഒരുക്കി. രാവിലെമുതൽ ഉച്ചവരെ, “ബാലേ, ഞങ്ങൾക്ക് ഉത്തരം തരണമേ!” എന്നു പറഞ്ഞുകൊണ്ട് അവർ ബാലിന്റെ നാമം വിളിച്ചപേക്ഷിച്ചു. എന്നാൽ ഒരു ശബ്ദവും ഉണ്ടായില്ല; ഉത്തരം നൽകാൻ ആരുമുണ്ടായില്ല. ഉണ്ടാക്കിയിരുന്ന യാഗപീഠത്തിനു ചുറ്റും അവർ മുടന്തിനടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവർ അതിനു ചുറ്റും നൃത്തം ചെയ്തു” എന്നോ “ചാടിനടന്നു” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ മുടന്തിയുള്ളതോ ചാടിയുള്ളതോ ആയ ഒരു ആചാരചലനത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; 21-ാം വാക്യത്തിൽ ഏലീയാവ് ഉപയോഗിക്കുന്ന അതേ ധാതുവുമായുള്ള മനഃപൂർവമായ ശബ്ദാർഥബന്ധവും ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־הַפָּר
  choice: കാളയെ എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘എടുത്തു’ നിലനിർത്തുന്നു; פַּר യാഗത്തിനുള്ള കാളയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: തങ്ങൾക്കു കൊടുത്ത
  rationale: മുൻവാക്യത്തിൽ ഏലീയാവ് അവർക്കു നൽകിയ കാളയിലേക്കുള്ള സൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲשׂוּ
  choice: ഒരുക്കി
  rationale: യാഗസന്ദർഭത്തിലെ സന്ദിഗ്ധമായ עשׂה ഇവിടെ കാളയെ ബലിക്കായി ഒരുക്കിയെന്ന അർഥത്തിൽ എടുത്തു; ‘അർപ്പിച്ചു’ എന്ന് പറഞ്ഞ് തുടർന്നുള്ള സംഭവത്തെ മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: ബാലിന്റെ നാമം വിളിച്ചപേക്ഷിച്ചു
  rationale: ദേവതയെ അഭിസംബോധന ചെയ്ത് സഹായം അപേക്ഷിക്കുന്ന קרא בשם എന്ന പ്രയോഗത്തിന്റെ ആരാധനാസംബന്ധിയായ ശക്തിയും ‘നാമം’ എന്ന ഘടകവും സംരക്ഷിക്കുന്നു.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: രാവിലെമുതൽ ഉച്ചവരെ
  rationale: സമയപരിധിയുടെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: ബാലേ, ഞങ്ങൾക്ക് ഉത്തരം തരണമേ!
  rationale: നേരിട്ടുള്ള സംബോധനയും പ്രാർഥനാപരമായ അപേക്ഷയും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: ഒരു ശബ്ദവും ഉണ്ടായില്ല; ഉത്തരം നൽകാൻ ആരുമുണ്ടായില്ല
  rationale: ‘ശബ്ദമില്ല’ എന്നും ‘ഉത്തരം നൽകുന്നവനില്ല’ എന്നും വരുന്ന എബ്രായത്തിലെ ഊന്നലുള്ള ഇരട്ട നിഷേധം സംരക്ഷിക്കുന്നു.
- source_word: וַיְפַסְּחוּ
  choice: മുടന്തിനടന്നു
  rationale: ആചാരപരമായ മുടന്തിയുള്ളതോ ചാടിയുള്ളതോ ആയ ചലനത്തെ സൂചിപ്പിക്കാവുന്ന ക്രിയയുടെ അടിസ്ഥാനഭാവവും 21-ാം വാക്യത്തിലെ അതേ ധാതുവുമായുള്ള സാഹിത്യബന്ധവും പരമാവധി നിലനിർത്തുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനു ചുറ്റും
  rationale: ഈ ചലനക്രിയയോടൊപ്പം עַל യാഗപീഠത്തിന്മേൽ കയറിനടക്കുന്നതിനെക്കാൾ അതിന്റെ ചുറ്റുമുള്ള ആചാരചലനത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: ഉണ്ടാക്കിയിരുന്ന
  rationale: എബ്രായത്തിലെ ഏകവചന ക്രിയയെ മലയാളത്തിലെ ലിംഗ-വചനനിരപേക്ഷമായ സംബന്ധകൃതന്തത്തിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു; ആരാണ് ഉണ്ടാക്കിയതെന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: ബാലിന്റെ നാമം വിളിക്കുന്ന പ്രയോഗം
  choice: ബാലിന്റെ നാമം വിളിച്ചപേക്ഷിച്ചു
  alternative: ബാലിനെ വിളിച്ചു
  rationale: തിരുവെഴുത്തിലെ ദേവനാമാഹ്വാന പ്രയോഗത്തോടുള്ള ഭാഷാപരമായ സമാന്തരത നിലനിർത്തുന്നു; എന്നാൽ ബാലാരാധനയെ സാധൂകരിക്കുന്ന ഒരു ആശയവും ചേർക്കുന്നില്ല.
- issue: וַיְפַסְּחוּ എന്ന ആചാരചലനം
  choice: മുടന്തിനടന്നു
  alternative: നൃത്തം ചെയ്തു / ചാടിനടന്നു
  rationale: ക്രിയയുടെ കൃത്യമായ ചലനരീതി അനിശ്ചിതമായതിനാൽ പ്രധാന പാഠത്തിൽ ധാതുവിന്റെ ‘മുടന്തൽ’ ഭാവവും സാഹിത്യപരമായ പരിഹാസവും നിലനിർത്തി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: യാഗപീഠം ഉണ്ടാക്കിയവന്റെ തിരിച്ചറിയൽ
  choice: ഉണ്ടാക്കിയിരുന്ന യാഗപീഠം
  alternative: അവൻ ഉണ്ടാക്കിയിരുന്ന യാഗപീഠം
  rationale: എബ്രായത്തിൽ ക്രിയ ഏകവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമായി പറയപ്പെട്ടിട്ടില്ല; മലയാളത്തിൽ കർത്താവിനെ ചേർക്കാതെ ഈ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘വിളിച്ചപേക്ഷിച്ചു’, ‘ഉത്തരം തരണമേ’ എന്നിവ ആരാധനാസന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘മുടന്തിനടന്നു’ എന്ന പദത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
