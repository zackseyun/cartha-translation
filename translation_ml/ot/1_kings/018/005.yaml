source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: ml
  text: 'അഹാബ് ഓബദ്യാവിനോടു പറഞ്ഞു: “ദേശമെങ്ങും സഞ്ചരിച്ച് എല്ലാ നീരുറവകളുടെയും എല്ലാ നീർച്ചാലുകളുടെയും[a] അടുക്കൽ പോകുക. ഒരുപക്ഷേ നമുക്കു പുല്ല് കണ്ടെത്തി കുതിരകളെയും കോവർകഴുതകളെയും ജീവനോടെ നിലനിർത്താൻ കഴിഞ്ഞേക്കാം; അങ്ങനെ മൃഗസമ്പത്തിലെ ചിലതിനെ ഒഴിവാക്കേണ്ടിവരാതിരിക്കാം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം തോട്, ഒഴുക്കുപാത, അല്ലെങ്കിൽ മഴക്കാലത്തു മാത്രം വെള്ളമൊഴുകുന്ന ചാൽ എന്നിവയെ സൂചിപ്പിക്കാം. ഈ വരൾച്ചാസന്ദർഭത്തിൽ കാലിക ജലപാതകളായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “മൃഗസമ്പത്തിൽനിന്ന് വെട്ടിമാറ്റുക.” തീറ്റക്കുറവുമൂലം മൃഗസമ്പത്തിലെ ചിലതിനെ ഇല്ലാതാക്കുകയോ ഉപേക്ഷിക്കുകയോ ചെയ്ത് അവയുടെ എണ്ണം കുറയ്ക്കേണ്ടിവരുന്നതാണ് സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: ദേശമെങ്ങും സഞ്ചരിച്ച്
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ വെറും സ്ഥലസ്ഥിതി മാത്രമല്ല, തിരച്ചിലിനായി ദേശത്തുടനീളം സഞ്ചരിക്കുന്നതും സൂചിപ്പിക്കുന്നു.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: എല്ലാ നീരുറവകൾ
  rationale: സ്വാഭാവിക ജലസ്രോതസ്സുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ മൂർത്തമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנְּחָלִים
  choice: എല്ലാ നീർച്ചാലുകൾ
  rationale: നחל സ്ഥിരമായി ഒഴുകുന്ന തോടിനെയോ വരൾച്ചക്കാലത്ത് വറ്റിപ്പോകാവുന്ന കാലിക ജലപാതയെയോ സൂചിപ്പിക്കാം. ‘നീർച്ചാൽ’ ഈ അർഥവ്യാപ്തി താരതമ്യേന തുറന്നുവെക്കുന്നു; അടിക്കുറിപ്പ് ഭൂമിശാസ്ത്രപരമായ സാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: אוּלַי נִמְצָא
  choice: ഒരുപക്ഷേ നമുക്കു ... കണ്ടെത്താൻ കഴിഞ്ഞേക്കാം
  rationale: തിരച്ചിലിന്റെ കൂട്ടായ ഉദ്ദേശ്യവും ഫലത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: חָצִיר
  choice: പുല്ല്
  rationale: മൃഗങ്ങൾക്ക് തീറ്റയാകുന്ന സസ്യവളർച്ചയാണ് സന്ദർഭം; ഉണക്കി സൂക്ഷിച്ച തീറ്റ എന്ന ആശയം മൂലപാഠത്തിലില്ലാത്തതിനാൽ ‘വയ്ക്കോൽ’ ഒഴിവാക്കി.
- source_word: וּנְחַיֶּה
  choice: ജീവനോടെ നിലനിർത്താൻ
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘ജീവിക്കാൻ ഇടയാക്കുക/ജീവൻ സംരക്ഷിക്കുക’ എന്ന കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: סוּס וָפֶרֶד
  choice: കുതിരകളെയും കോവർകഴുതകളെയും
  rationale: എബ്രായ ഏകവചനങ്ങൾ ഇവിടെ മൃഗവർഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം സന്ദർഭാർഥം കൂടുതൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: കന്നുകാലികളുടെ എണ്ണം കുറയ്ക്കേണ്ടിവരാതിരിക്കാം
  rationale: כרת എന്നതിന്റെ അടിസ്ഥാനമായ ‘വെട്ടിമാറ്റുക’ എന്ന ആശയവും מן സൂചിപ്പിക്കുന്ന ഭാഗികതയും ചേർന്ന്, തീറ്റക്കുറവിനാൽ മൃഗസമ്പത്തിൽ ചിലതിനെ ഒഴിവാക്കേണ്ടിവരുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ മുഖ്യവാചകം അതിനെ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
