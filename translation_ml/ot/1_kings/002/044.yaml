id: 1KI.2.44
reference: 1 Kings 2:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ശിമെയിയോടു പറഞ്ഞു: “നിന്റെ ഹൃദയം അറിയുന്ന[a] സകല തിന്മയും—എന്റെ പിതാവായ ദാവീദിനോടു നീ ചെയ്തതെല്ലാം—നിനക്കറിയാം. യാഹ്‌വെ നിന്റെ തിന്മ നിന്റെ സ്വന്തം തലമേൽ തിരികെ വരുത്തിയിരിക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ഹൃദയത്തിൽ നിനക്കറിയാവുന്ന.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “നിന്റെ ഹൃദയം അറിയുന്ന” എന്നു പറയുന്നു; ഇത് ശിമെയിക്ക് തന്റെ കുറ്റത്തെക്കുറിച്ചുണ്ടായിരുന്ന ആന്തരിക ബോധത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തിരികെ കൊണ്ടുവന്നിരിക്കുന്നു” അല്ലെങ്കിൽ “പ്രതിഫലം നൽകിയിരിക്കുന്നു.” ശിമെയിയുടെ തിന്മ അവന്റെമേൽതന്നെ തിരിച്ചുവരാൻ ഇടയാക്കുക എന്ന ആശയം എബ്രായക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: അപ്പോൾ രാജാവ് ശിമെയിയോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നതുകൊണ്ട് ‘അപ്പോൾ’ സ്വാഭാവികമായ ആഖ്യാനക്രമം നൽകുന്നു; രാജാവിനെയും ശിമെയിയെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אַתָּה יָדַעְתָּ
  choice: നിനക്കറിയാം
  rationale: എബ്രായത്തിലെ ഊന്നൽസർവനാമത്തിന്റെ ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു; വർത്തമാനകാലരൂപം ശിമെയിയുടെ നിലവിലുള്ള അറിവിനെ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הָרָעָה
  choice: സകല തിന്മയും
  rationale: רָעָה ഇവിടെ വെറും ദോഷഫലമല്ല, ദാവീദിനെതിരായ ധാർമിക കുറ്റകൃത്യമാണ്; ‘തിന്മ’ ആ ധാർമിക ഭാരം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: നിന്റെ ഹൃദയം അറിയുന്ന
  rationale: അറിവ് ഹൃദയത്തിനാണ് ആരോപിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തി, ശിമെയിയുടെ ആന്തരിക കുറ്റബോധത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: നീ എന്റെ പിതാവായ ദാവീദിനോടു ചെയ്ത
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥവും ദാവീദുമായുള്ള ശലോമോന്റെ ബന്ധവും നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהֵשִׁיב
  choice: തിരികെ വരുത്തിയിരിക്കുന്നു
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘മടങ്ങിവരാൻ ഇടയാക്കുക’ എന്ന പ്രതിചിത്രം സംരക്ഷിക്കുന്നു; ‘പ്രതിഫലം നൽകി’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ ലിപ്യന്തരണം നൽകുന്നു.
- source_word: אֶת רָעָתְךָ
  choice: നിന്റെ തിന്മ
  rationale: മുൻപുള്ള רָעָה എന്ന പദവുമായി ഒരേ വിവർത്തനം ഉപയോഗിച്ച് പ്രവൃത്തിയും അതിന്റെ തിരിച്ചുവരവും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: בְּרֹאשֶׁךָ
  choice: നിന്റെ സ്വന്തം തലമേൽ
  rationale: കുറ്റഫലം കുറ്റം ചെയ്തവന്റെമേൽ തന്നെ തിരിച്ചുവരുന്നു എന്ന എബ്രായ ശൈലി അതിന്റെ ശക്തിയോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ‘Yahweh’ എന്ന രൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ദൈവിക പ്രതികാരത്തിലെ പ്രവർത്തകത്വം
  choice: യാഹ്‌വെ നിന്റെ തിന്മ ... തിരികെ വരുത്തിയിരിക്കുന്നു
  alternative: യാഹ്‌വെ നിന്റെ തിന്മയ്ക്ക് പ്രതിഫലം നൽകിയിരിക്കുന്നു
  rationale: ശിമെയിയുടെ തിന്മ അവന്റെമേൽ തിരിച്ചുവരുത്തിയത് യാഹ്‌വെയാണെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നു. ദൈവിക പ്രവർത്തകത്വം മയപ്പെടുത്താതെയും വാക്യത്തിനപ്പുറം സിദ്ധാന്തവത്കരിക്കാതെയും അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നിന്റെ ഹൃദയം അറിയുന്ന’ എന്ന അല്പം അസാധാരണമായ പ്രയോഗം മൂലപാഠത്തിലെ ആന്തരിക ധാർമികബോധത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി. അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്യഘടകങ്ങൾക്കു പിന്നാലെ വെച്ചു.
