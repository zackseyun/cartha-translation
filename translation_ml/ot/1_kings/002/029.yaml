source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: ml
  text: 'യോവാബ് യഹോവയുടെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയെന്നും, ഇതാ, അവൻ യാഗപീഠത്തിനരികിലുണ്ടെന്നും ശലോമോൻ രാജാവിന് അറിയിക്കപ്പെട്ടു. അപ്പോൾ ശലോമോൻ യെഹോയാദയുടെ മകനായ ബെനായാവിനെ അയച്ചുകൊണ്ട് പറഞ്ഞു: “പോയി അവനെ പ്രഹരിക്കുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പോയി അവനെ ആക്രമിക്കുക” അല്ലെങ്കിൽ “അവന്റെമേൽ ചാടിവീഴുക.” എബ്രായ ക്രിയയ്ക്ക് ‘പ്രഹരിക്കുക,’ ‘ആക്രമിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; ഈ സന്ദർഭത്തിൽ അത് മാരകമായ ആക്രമണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിച്ചു
  rationale: נגד എന്ന ധാതുവിന്റെ ഹോഫാൽ രൂപം വിവരം ഒരാളെ അറിയിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കർമണ്യാർഥം നൽകുന്നു.
- source_word: נָס
  choice: ഓടിപ്പോയി
  rationale: അഭയം തേടി പലായനം ചെയ്തതെന്ന കഥാസന്ദർഭം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל אֹהֶל יְהוָה
  choice: യഹോവയുടെ കൂടാരത്തിലേക്ക്
  rationale: אֹהֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കൂടാരം’ നിലനിർത്തുകയും יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന വ്യവഹാരകണത്തിന്റെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികിൽ
  rationale: אֵצֶל സൂചിപ്പിക്കുന്ന സമീപസ്ഥിതി കൃത്യമായി നൽകുന്നു.
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വിവരം ലഭിച്ചതിനെത്തുടർന്നുള്ള കഥയുടെ മുന്നേറ്റവും ഫലബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: פְּגַע בּוֹ
  choice: അവനെ വെട്ടിക്കൊല്ലുക
  rationale: פגע ב എന്ന പ്രയോഗത്തിന് പ്രഹരിക്കുക/ആക്രമിക്കുക എന്ന അർഥവ്യാപ്തിയുണ്ട്; വധശിക്ഷയുടെ ഈ സന്ദർഭത്തിൽ മാരകമായ പ്രഹരം ഉദ്ദേശിക്കുന്നുവെന്ന് ‘വെട്ടിക്കൊല്ലുക’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു; പദവിയായ ‘കർത്താവ്’ കൊണ്ട് അതിനെ പകരംവയ്ക്കുന്നില്ല.
- issue: യാഗപീഠത്തിനരികിലെ യോവാബിനെ കൊല്ലാനുള്ള കല്പന
  choice: വധം ഉദ്ദേശിക്കുന്ന മാരകപ്രഹരമായി പരിഭാഷപ്പെടുത്തി
  alternative: അവനെ ആക്രമിക്കുക
  rationale: പദത്തിന്റെ വിശാല അർഥം ആക്രമണമാകാമെങ്കിലും തുടർന്നുള്ള കഥാസന്ദർഭം ഇത് വധകല്പനയാണെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ sanctuary-യുമായി ബന്ധപ്പെട്ട ധാർമ്മിക സംഘർഷത്തെ വിശദീകരിച്ച് പരിഹരിക്കുന്ന ഒന്നും പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാശൈലി ഉപയോഗിച്ചു. ‘അതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക കണം നിലനിർത്തുന്നു. ദൈവനാമം ‘യഹോവ’ എന്നും אֹהֶל ‘കൂടാരം’ എന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
