source:
  edition: WLC
  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: ml
  text: അങ്ങനെ ശലോമോൻ അബ്യാഥാരിനെ യഹോവയുടെ പുരോഹിതനായിരിക്കുന്നതിൽനിന്ന് പുറത്താക്കി. ഇതിലൂടെ ശീലോവിൽ ഏലിയുടെ ഭവനത്തെക്കുറിച്ച് യഹോവ അരുളിച്ചെയ്ത വചനം നിറവേറി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യഹോവയുടെ വചനം നിറവേറ്റേണ്ടതിന്.” എബ്രായപ്രയോഗം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: ഏലിയുടെ ഭവനത്തിനെതിരെ അരുളിച്ചെയ്ത വചനത്തെക്കുറിച്ച് 1 ശമൂവേൽ 2:27–36; 3:11–14 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: പുറത്താക്കി
  rationale: גרשׁ ബലമായ നീക്കിക്കളയലിനെയോ പുറത്താക്കലിനെയോ സൂചിപ്പിക്കുന്നു. രാജ്യം വിട്ടുള്ള നാടുകടത്തൽ എന്ന് അതിരുകടക്കാതെ, പദവിയിൽനിന്നുള്ള നിർണായക നീക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: യഹോവയുടെ പുരോഹിതനായിരിക്കുന്നതിൽനിന്ന്
  rationale: מִן + היה എന്ന ഘടന ഒരു നിലയിലോ ചുമതലയിലോ തുടരുന്നതിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; לַיהוָה പുരോഹിതസേവനത്തിന്റെ യഹോവയോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְמַלֵּא
  choice: ഇതിലൂടെ ... നിറവേറി
  rationale: ל ഘടിത ക്രിയാനാമം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ഫലസംബന്ധം സ്വാഭാവികമായി നൽകുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവ ... അരുളിച്ചെയ്ത വചനം
  rationale: ദൈവിക പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ മലയാള പ്രയോഗം; അֲשֶׁר דִּבֶּר എന്ന ബന്ധവാക്യവും ഇതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: עַל בֵּית עֵלִי
  choice: ഏലിയുടെ ഭവനത്തെക്കുറിച്ച്
  rationale: עַל ഇവിടെ ‘കുറിച്ച്’ എന്നും ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘എതിരായി’ എന്നും ഗ്രഹിക്കാം. വിശാലമായ അർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּשִׁלֹה
  choice: ശീലോവിൽ
  rationale: בְ സ്ഥലസൂചന നൽകുന്നതിനാൽ സ്വാഭാവികമായ മലയാള അധികരണരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ശലോമോന്റെ നടപടിയും മുൻപ്രഖ്യാപിത ദൈവവചനവും തമ്മിലുള്ള ബന്ധം
  choice: ശലോമോന്റെ നടപടി യഹോവയുടെ മുൻവചനം നിറവേറിയ ഫലമായി അവതരിപ്പിക്കുന്നു.
  alternative: ‘യഹോവയുടെ വചനം നിറവേറ്റേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യവായന.
  rationale: לְמַלֵּא ഉദ്ദേശ്യമോ ഫലമോ പ്രകടിപ്പിക്കാം. ‘ഇതിലൂടെ ... നിറവേറി’ എന്നത് പ്രവചനനിവൃത്തിയുടെ ബന്ധം വ്യക്തമാക്കുന്നു; ശലോമോന്റെ ഉള്ളിലുള്ള ഉദ്ദേശ്യം പാഠം പറയുന്നതിലധികമായി ഉറപ്പിക്കുന്നില്ല. മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ഏലിയുടെ ഭവനത്തെപ്പറ്റിയുള്ള വചനത്തിന്റെ സ്വഭാവം
  choice: ‘ഭവനത്തെക്കുറിച്ച്’ എന്ന വിശാലമായ വിവർത്തനം.
  alternative: ‘ഭവനത്തിനെതിരെ’ എന്ന ന്യായവിധി ഊന്നുന്ന വിവർത്തനം.
  rationale: עַל രണ്ടു നിഴലുകളും അനുവദിക്കുന്നു. മുൻസന്ദർഭം ന്യായവിധിയാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ അസ്പഷ്ടത സംരക്ഷിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുരോഹിതനായിരിക്കുന്നതിൽനിന്ന്’ മൂലഘടനയിലെ പദവിനീക്കത്തെ കൃത്യമായി സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
