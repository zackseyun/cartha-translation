  terminology: ‘യഹ്‌വെ,’ ‘ശപഥം,’ ‘കല്പന,’ ‘പാലിക്കുക,’ and ‘നിന്റെമേൽ ചുമത്തിയ’ are suitable for modern standard Malayalam and preserve the royal/legal register. ‘നിന്റെമേൽ ചുമത്തിയ’ appropriately conveys the force of עָלֶיךָ without requiring a wooden repetition of ‘കല്പിക്കുക.’
