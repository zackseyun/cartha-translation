  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: ml
  text: പിന്നെ, നീ യഹ്‌വെയുടെ ശപഥം[a]യും ഞാൻ നിന്റെമേൽ ചുമത്തിയ കല്പന[b]യും പാലിക്കാതിരുന്നത് എന്തുകൊണ്ടാണ്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹ്‌വെയുടെ ശപഥം’ എന്നതിന് യഹ്‌വെയുടെ നാമത്തിൽ അല്ലെങ്കിൽ അവന്റെ അധികാരത്തിൻ കീഴിൽ ചെയ്ത ശപഥം എന്നർഥമാകാം; ‘യഹ്‌വെയോടു ചെയ്ത ശപഥം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞാൻ നിനക്കു കല്പിച്ച കല്പന.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘ഞാൻ നിന്റെമേൽ കല്പിച്ച കല്പന’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: പിന്നെ എന്തുകൊണ്ടാണ്
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണവുമായി ബന്ധിപ്പിക്കുന്ന וּ എന്ന ഘടകത്തെ സ്വാഭാവികമായി ‘പിന്നെ’ എന്നു പ്രതിനിധീകരിക്കുകയും מַדּוּעַയുടെ ‘എന്തുകൊണ്ട്?’ എന്ന ചോദ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לֹא שָׁמַרְתָּ
  choice: നീ ... പാലിക്കാതിരുന്നത്
  rationale: שׁמר എന്നതിന് ശപഥവും കല്പനയും സംബന്ധിച്ച് ‘പാലിക്കുക’ എന്നത് സ്വാഭാവികവും ബാധ്യതയുടെ ആശയം സൂക്ഷിക്കുന്നതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: שְׁבֻעַת יְהוָה
  choice: യഹ്‌വെയുടെ നാമത്തിൽ ചെയ്ത ശപഥം
  rationale: രൂപപരമായി ‘യഹ്‌വെയുടെ ശപഥം’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ യഹ്‌വെ ചെയ്ത ശപഥമല്ല, അവന്റെ നാമത്തിൽ അഥവാ അധികാരത്തിൻ കീഴിൽ ശിമെയി ചെയ്ത ശപഥമാണ് ഉദ്ദേശിക്കുന്നത്. പ്രധാനപാഠം തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; കൂടുതൽ രൂപസമീപമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וְאֶת הַמִּצְוָה
  choice: കല്പനയും
  rationale: מִצְוָה ഇവിടെ രാജകീയമായി നൽകിയ നിർദേശം അല്ലെങ്കിൽ കല്പനയാണ്; ‘കല്പന’ ആ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: ഞാൻ നിന്റെമേൽ ചുമത്തിയ
  rationale: צוה എന്ന കല്പന നൽകുന്ന ക്രിയയെയും עַל എന്ന ‘മേൽ’ എന്ന ബാധ്യതാസൂചനയെയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; ഹീബ്രുവിലെ ഒരേ ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിൽ നിർബന്ധമായി ആവർത്തിക്കാതെ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: שְׁבֻעַת יְהוָה എന്ന ബന്ധത്തിന്റെ അർഥം
  choice: യഹ്‌വെയുടെ നാമത്തിൽ ചെയ്ത ശപഥം
  alternative: യഹ്‌വെയുടെ ശപഥം / യഹ്‌വെയോടു ചെയ്ത ശപഥം
  rationale: ഹീബ്രു ഘടനയ്ക്ക് ഒന്നിലധികം ബന്ധാർഥങ്ങൾ സാധ്യമെങ്കിലും സന്ദർഭത്തിൽ ശപഥം യഹ്‌വെ ഉച്ചരിച്ചതല്ല; ശിമെയി യഹ്‌വെയുടെ സന്നിധിയിലോ നാമത്തിലോ ചെയ്തതാണ്. യഥാർത്ഥ ഘടനയുടെ അസന്ദിഗ്ധമല്ലാത്ത സ്വഭാവം അടിക്കുറിപ്പിലൂടെ സൂക്ഷിക്കുന്നു.
- issue: צִוִּיתִי עָלֶיךָ എന്ന പ്രയോഗം
  choice: ഞാൻ നിന്റെമേൽ ചുമത്തിയ
  alternative: ഞാൻ നിന്നോടു കല്പിച്ച
  rationale: עָלֶיךָയിലെ ‘നിന്റെമേൽ’ എന്ന ബാധ്യതാഭാവം സംരക്ഷിക്കുന്നു; കൂടുതൽ സാധാരണമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നിന്റെമേൽ ചുമത്തിയ’ എന്ന പ്രയോഗം രാജാവിന്റെ കല്പനയായി ഏൽപ്പിച്ച ബാധ്യതയെ പ്രകടമാക്കുന്നു. ‘ശപഥം’ എന്നത് സന്ദർഭത്തിലെ ഗൗരവമുള്ള സത്യപ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നു.
