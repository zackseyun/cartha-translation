id: 1KI.2.17
reference: 1 Kings 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִמְרִי נָא֙ לִ/שְׁלֹמֹ֣ה הַ/מֶּ֔לֶךְ כִּ֥י לֹֽא יָשִׁ֖יב אֶת פָּנָ֑יִ/ךְ וְ/יִתֶּן לִ֛/י אֶת אֲבִישַׁ֥ג הַ/שּׁוּנַמִּ֖ית לְ/אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി ശലോമോൻ രാജാവിനോടു പറയുക; അദ്ദേഹം നിന്നെ നിരസിക്കുകയില്ല[a]. ശൂനേംകാരിയായ അബീശഗിനെ എനിക്കു ഭാര്യയായി തരാൻ പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അദ്ദേഹം നിന്റെ മുഖം മടക്കുകയില്ല.” ഒരാളെയോ അയാളുടെ അപേക്ഷയെയോ നിരസിക്കുകയില്ല എന്നർഥമുള്ള ഹീബ്രായ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: ദയവായി ... പറയുക
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപത്തോടു ചേർന്ന נָא വിനീതമായ അപേക്ഷ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ “ദയവായി ... പറയുക” സ്വാഭാവികവും ആദരപൂർവവുമാണ്.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: ശലോമോൻ രാജാവിനോട്
  rationale: ഹീബ്രായയിലെ പേരും രാജപദവിയും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: כִּי לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: അദ്ദേഹം നിന്നെ നിരസിക്കുകയില്ല
  rationale: അക്ഷരാർഥത്തിൽ “നിന്റെ മുഖം മടക്കുകയില്ല” എന്ന ഹീബ്രായ പ്രയോഗം ഇവിടെ അപേക്ഷ നിരസിക്കാതിരിക്കുക എന്ന അർഥത്തിലാണ്. പ്രധാന വാചകത്തിൽ വ്യക്തമായ അർഥം നൽകി, ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְיִתֶּן לִי
  choice: എനിക്കു ... തരാൻ പറയുക
  rationale: മുൻപുള്ള സംസാരിക്കാനുള്ള അപേക്ഷയുടെ ഉള്ളടക്കമാണ് ഈ ക്രിയാഭാഗം നൽകുന്നത്. മലയാളത്തിൽ പരോക്ഷമായ അഭ്യർഥന സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: ശൂനേംകാരിയായ അബീശഗ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; സ്ത്രീലിംഗ ജനവിഭാഗ/സ്ഥലവിശേഷണം മലയാളത്തിൽ “ശൂനേംകാരിയായ” എന്നു വ്യക്തമാക്കി.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: ഈ ഘടന വിവാഹബന്ധത്തിനായി സ്ത്രീയെ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; “ഭാര്യയായി” സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. രാജാവിനെക്കുറിച്ച് ബത്‌ശേബയോടു സംസാരിക്കുന്ന സാഹചര്യത്തിൽ “അദ്ദേഹം” എന്ന ആദരസൂചക സർവനാമം സ്വീകരിച്ചു; ഹീബ്രായ ഭാഷാശൈലിയുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
