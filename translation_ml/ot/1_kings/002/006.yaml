  text: וְ/עָשִׂ֖יתָ כְּ/חָכְמָתֶ֑/ךָ וְ/לֹֽא תוֹרֵ֧ד שֵׂיבָת֛/וֹ בְּ/שָׁלֹ֖ם שְׁאֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: ml
  text: നിന്റെ ജ്ഞാനപ്രകാരം പ്രവർത്തിക്കുക; അവന്റെ നരച്ച തല സമാധാനത്തോടെ ഷെയോലിലേക്കു[b] ഇറങ്ങിപ്പോകാൻ അനുവദിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവന്റെ നരച്ച തലയെ സമാധാനത്തോടെ ഷെയോലിലേക്കു ഇറക്കരുത്.”'
    reason: lexical_alternative
  - marker: b
    text: “ഷെയോൽ” എന്നത് മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പദമാണ്; “കല്ലറ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: പ്രവർത്തിക്കുക
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഈ ആജ്ഞാസന്ദർഭത്തിൽ സ്വാഭാവികവും പ്രായോഗികവുമായ നിർദേശസ്വരം നൽകുന്നു.
- source_word: כְּחָכְמָתֶךָ
  choice: നിന്റെ ജ്ഞാനത്തിനൊത്തവിധം
  rationale: כְּ എന്ന ഉപസർഗം ശലോമോന്റെ വിവേകത്തിന് അനുസൃതമായി പ്രവർത്തിക്കുക എന്ന ആശയം സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא תוֹרֵד
  choice: ഇറങ്ങാൻ അനുവദിക്കരുത്
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നേരിട്ട് ‘ഇറക്കരുത്’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: שֵׂיבָתוֹ
  choice: അവന്റെ നരച്ച തലയെ
  rationale: നര/വാർധക്യം എന്ന ആശയത്തോടൊപ്പം മൂലഭാഷയിലെ ദൃശ്യമായ ശിരസ്സിന്റെ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: בְּשָׁלֹם
  choice: സമാധാനത്തോടെ
  rationale: ശിക്ഷിക്കപ്പെടാതെ സമാധാനപരമായി മരിക്കുക എന്ന സന്ദർഭാർഥം അമിതമായി വിശദീകരിക്കാതെ നൽകുന്നു.
- source_word: שְׁאֹל
  choice: പാതാളം
  rationale: മരിച്ചവരുടെ ലോകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ആശയം മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘പാതാളം’ കൊണ്ട് നൽകുന്നു; അതിനെ വെറും കല്ലറയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: שְׁאֹל എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാതാളം
  alternative: കല്ലറ; മരിച്ചവരുടെ ലോകം
  rationale: ‘പാതാളം’ മരിച്ചവരുടെ അധോലോകം/വാസസ്ഥലം എന്ന മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘കല്ലറ’ എന്നത് അർഥത്തെ ശവസംസ്കാരസ്ഥലമായി ചുരുക്കാം.
- issue: וְלֹא תוֹרֵד എന്ന കാരണാർത്ഥപ്രയോഗം
  choice: ഇറങ്ങാൻ അനുവദിക്കരുത്
  alternative: ഇറക്കരുത്
  rationale: മൂലത്തിലെ കാരണാർത്ഥം നിലനിർത്തിക്കൊണ്ട് ആരാണ് നേരിട്ട് പ്രവർത്തിക്കുന്നത് എന്നത് അനാവശ്യമായി നിർണ്ണയിക്കാതിരിക്കുന്നു; കൂടുതൽ നേരിട്ടുള്ള കാരണാർത്ഥവിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ‘നരച്ച തല’, ‘സമാധാനത്തോടെ’, ‘പാതാളം’ എന്നീ ദൃശ്യങ്ങളും ആശയപരമായ വിശാലതയും നിലനിർത്തിയിരിക്കുന്നു.
