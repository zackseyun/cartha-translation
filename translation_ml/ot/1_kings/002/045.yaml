id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: ml
  text: എന്നാൽ ശലോമോൻ രാജാവ് അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും[a]; ദാവീദിന്റെ സിംഹാസനം യഹ്‌വെയുടെ സന്നിധിയിൽ എന്നേക്കും ഉറപ്പിക്കപ്പെട്ടിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശലോമോൻ രാജാവ് അനുഗ്രഹിക്കപ്പെട്ടവനാണ്.” ഹീബ്രു നാമവാക്യം വർത്തമാനകാല പ്രഖ്യാപനമായും വായിക്കാം; എന്നാൽ സന്ദർഭം മുഖ്യപാഠത്തിലെ ഭാവിമുഖമായ വിവർത്തനത്തെയും പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: എന്നാൽ ശലോമോൻ രാജാവ്
  rationale: וְ ഇവിടെ മുൻവാക്യത്തിലെ ശിമെയിയുടെ ശിക്ഷയോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു നൽകി. പദക്രമം മലയാളശൈലിക്ക് അനുയോജ്യമായി ക്രമപ്പെടുത്തി.
- source_word: בָּרוּךְ
  choice: അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും
  rationale: ഈ നാമവാക്യത്തിലെ വിശേഷണ/കർമണി കൃദന്തരൂപം ‘അനുഗ്രഹിക്കപ്പെട്ടവൻ’ എന്ന അർഥം നൽകുന്നു. തുടർന്നുള്ള ഭാവികാല ക്രിയയോടും സന്ദർഭത്തിലെ രാജകീയ പ്രഖ്യാപനത്തോടും ചേർന്ന് ഭാവിമുഖമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; വർത്തമാനകാല സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְ/כִסֵּא דָוִד
  choice: ദാവീദിന്റെ സിംഹാസനം
  rationale: Construct ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ നൽകി; ഏകോപനചിഹ്നമായ וְ വാക്യത്തിലെ അർദ്ധവിരാമത്തിനു ശേഷം സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: יִהְיֶה נָכוֹן
  choice: ഉറപ്പിക്കപ്പെട്ടിരിക്കും
  rationale: היה + נכון എന്ന സംയോജനം സിംഹാസനം സ്ഥാപിതവും സ്ഥിരവുമായിരിക്കും എന്ന ആശയം നൽകുന്നു. ‘ഉറപ്പിക്കപ്പെട്ടിരിക്കും’ രാജവംശപരമായ സ്ഥിരത സൂചിപ്പിക്കുമ്പോഴും അതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לִ/פְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന സ്ഥലം-ബന്ധ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകി; ദൈവനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് സാധാരണ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ തുല്യപദം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരിച്ചു.
- issue: בָּרוּךְ എന്ന അനുഗ്രഹപ്രസ്താവനയുടെ കാലസൂചന
  choice: ഭാവിമുഖമായി ‘അനുഗ്രഹിക്കപ്പെട്ടവനായിരിക്കും’
  alternative: വർത്തമാനകാലമായി ‘അനുഗ്രഹിക്കപ്പെട്ടവനാണ്’
  rationale: ഹീബ്രു നാമവാക്യത്തിൽ കാലം തുറന്ന നിലയിലാണ്. തുടർന്നുള്ള יִהְיֶה എന്ന ഭാവിമുഖ രൂപവും ന്യായവിധി പ്രഖ്യാപനത്തിന്റെ സന്ദർഭവും മുഖ്യപാഠത്തിലെ ഭാവിവായനയെ പിന്തുണയ്ക്കുന്നു; യഥാർഥമായ വർത്തമാനകാല സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സന്നിധിയിൽ’, ‘സിംഹാസനം’ എന്നിവ വാക്യത്തിന്റെ രാജകീയവും ദൈവസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു. ഹീബ്രുവിലെ കാലസംബന്ധമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ വ്യക്തമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
