  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, അവനെ കുറ്റവിമുക്തനാക്കരുത്; നീ ജ്ഞാനിയായ മനുഷ്യനാണ്, അവനോട് എന്തു ചെയ്യണമെന്ന് നിനക്കറിയാം; അവന്റെ നരച്ച തലയെ രക്തത്തോടെ ഷെയോലിലേക്ക്[a] ഇറക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഷെയോൽ’ എന്നതിന് ‘കല്ലറ’ എന്നും ‘മരിച്ചവരുടെ ലോകം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: അവനെ കുറ്റവിമുക്തനാക്കരുത്
  rationale: נקה എന്ന ക്രിയയുടെ പിയേൽ രൂപം ഇവിടെ ഒരാളെ കുറ്റമില്ലാത്തവനായി കണക്കാക്കുക, ശിക്ഷയിൽനിന്ന് ഒഴിവാക്കുക എന്ന ന്യായവിധിസംബന്ധമായ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കുറ്റവിമുക്തനാക്കരുത്’ ആ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ חָכָם
  choice: ജ്ഞാനിയായ മനുഷ്യൻ
  rationale: ശലോമോൻ എന്ന പുരുഷവ്യക്തിയോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും ‘ജ്ഞാനി’ എന്ന ആശയവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: അവനോട് എന്തു ചെയ്യണമെന്ന് നിനക്കറിയാം
  rationale: ഹീബ്രു രൂപം സന്ദർഭത്തിൽ ഉറപ്പോടെയുള്ള അറിവ് പ്രകടിപ്പിക്കാം. ‘നിനക്കറിയാം’ എന്നത് അനാവശ്യമായി ഭാവികാലമോ ധാർമിക ബാധ്യതയോ ചേർക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: וְהוֹרַדְתָּ
  choice: ഇറക്കുക
  rationale: ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥമായ ‘താഴേക്ക് കൊണ്ടുപോകുക/ഇറക്കുക’ എന്ന ആശയം നേരിട്ടുള്ള നിർദേശമായി നൽകുന്നു.
- source_word: שֵׂיבָתוֹ
  choice: അവന്റെ നരച്ച തല
  rationale: ‘നര’ അഥവാ ‘വാർധക്യം’ എന്ന മൂലാർഥത്തോടൊപ്പം ഹീബ്രുവിലെ ദൃശ്യമായ ശിരസ്സിന്റെ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: בְּדָם
  choice: രക്തത്തോടെ
  rationale: രക്തച്ചൊരിച്ചിലോടുകൂടിയ അക്രമമരണത്തിന്റെ കഠിനമായ ഹീബ്രു പ്രയോഗം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: שְׁאוֹל
  choice: പാതാളം
  rationale: മരിച്ചവരുടെ അധോലോകം/മരണലോകം എന്ന ശെഓലിന്റെ വിശാലമായ ആശയം മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘പാതാളം’ കൊണ്ട് നൽകുന്നു; അതിനെ വെറും കല്ലറയായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: שְׁאוֹל എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാതാളം
  alternative: കല്ലറ; മരിച്ചവരുടെ ലോകം
  rationale: ‘പാതാളം’ ഹീബ്രു ലോകബോധത്തിലെ മരണലോകത്തെ സൂചിപ്പിക്കുന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്നു. ‘കല്ലറ’ എന്നു മാത്രം പറഞ്ഞാൽ ആശയം അനാവശ്യമായി ഭൗതിക ശവക്കുഴിയിലേക്ക് ചുരുങ്ങാം; ‘മരിച്ചവരുടെ ലോകം’ കൂടുതൽ വിശദീകരണാത്മകമാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ന്യായവിധിയുടെ കാഠിന്യവും ‘നരച്ച തല’, ‘രക്തത്തോടെ’, ‘പാതാളം’ എന്നീ ദൃശ്യപ്രയോഗങ്ങളും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിന് പിന്നാലെ മുഖ്യവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
