  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: ml
  text: അങ്ങനെ, അവരുടെ രക്തം[a] യോവാബിന്റെ തലയിന്മേലും അവന്റെ സന്തതിയുടെ തലയിന്മേലും എന്നേക്കും മടങ്ങിവരും. എന്നാൽ ദാവീദിനും അവന്റെ സന്തതിക്കും അവന്റെ ഭവനത്തിനും അവന്റെ സിംഹാസനത്തിനും യഹ്‌വേയിൽനിന്ന് എന്നേക്കും സമാധാനം ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ രക്തം’ എന്നത് അവർ ചൊരിഞ്ഞ രക്തത്തിനുള്ള ഉത്തരവാദിത്വം യോവാബിന്റെയും അവന്റെ സന്തതിയുടെയുംമേൽ വരുമെന്ന് സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: മടങ്ങിവരും
  rationale: സന്ദർഭത്തിൽ ഇത് ന്യായവിധി പ്രഖ്യാപിക്കുന്ന ഭാവികാല അർഥത്തിലാണ്; രക്തച്ചൊരിച്ചിലിന്റെ ഉത്തരവാദിത്വം കുറ്റക്കാരന്റെമേൽ തിരിച്ചെത്തുന്നതെന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: דְמֵיהֶם
  choice: അവരുടെ രക്തം
  rationale: മൂലത്തിലെ രക്തം എന്ന പ്രയോഗം അതേപടി സൂക്ഷിക്കുന്നു; ഇവിടെ കൊല്ലപ്പെട്ടവരുടെ രക്തച്ചൊരിച്ചിലിനുള്ള ഉത്തരവാദിത്വമാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: בְּרֹאשׁ
  choice: തലയിന്മേൽ
  rationale: കുറ്റവും അതിന്റെ പരിണതഫലവും ഒരാളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ന്യായവിധി-രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: זַרְעוֹ
  choice: അവന്റെ സന്തതി
  rationale: കൂട്ടായ പിന്‍തലമുറയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: ഇരുവിടത്തുമുള്ള ദീർഘവും നിലനിൽക്കുന്നതുമായ കാലപരിധിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִהְיֶה שָׁלוֹם
  choice: സമാധാനം ഉണ്ടായിരിക്കും
  rationale: ശാലോം എന്ന പദത്തിന്റെ സമാധാനം, ക്ഷേമം, സ്ഥിരത എന്നീ വിശാല സൂചനകളെ ചുരുക്കാതെ മുഖ്യ അർഥം നിലനിർത്തുന്നു.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: ദാവീദിനും അവന്റെ സന്തതിക്കും അവന്റെ ഭവനത്തിനും അവന്റെ സിംഹാസനത്തിനും
  rationale: ആവർത്തിച്ചുള്ള ബന്ധ/ഗുണഭോക്തൃ സൂചന സംരക്ഷിക്കുകയും ‘ഭവനം’, ‘സിംഹാസനം’ എന്നീ രാജവംശപരമായ രൂപങ്ങൾ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מֵעִם יְהוָה
  choice: യഹോവയിൽനിന്ന്
  rationale: സമാധാനത്തിന്റെ ഉറവിടം യഹോവയാണെന്ന് വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: യോവാബിന്റെ വംശത്തിനുള്ള ന്യായവിധിയും ദാവീദിന്റെ വംശത്തിനുള്ള സമാധാനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്നാൽ’ ഉപയോഗിച്ച് വൈരുധ്യം വ്യക്തമാക്കുക
  alternative: ലളിതമായ ‘കൂടാതെ/ഉം’ ഉപയോഗിക്കുക
  rationale: എബ്രായ സംയോജകം രൂപത്തിൽ സാധാരണ ബന്ധകമാണെങ്കിലും, വാക്യത്തിലെ ആശയം യോവാബിനുള്ള വിധിയും ദാവീദിനുള്ള സമാധാനവും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യമാണ്.
- issue: שָׁלוֹם എന്നതിന്റെ രാജവംശപരമായ അർഥവ്യാപ്തി
  choice: ‘സമാധാനം’
  alternative: ‘ക്ഷേമം’ അല്ലെങ്കിൽ ‘ഐശ്വര്യം’
  rationale: ദൈവദത്തമായ സമാധാനം, ക്ഷേമം, സ്ഥിരത എന്നിവയുടെ വിശാലത നിലനിർത്താൻ ‘സമാധാനം’ ഏറ്റവും യോജിക്കുന്നു.
- issue: യോവാബിന്റെ സന്തതിയുടെമേലുള്ള വിധിയുടെ ദൈർഘ്യം
  choice: മൂലത്തിലെ ‘എന്നേക്കും’ അതേപടി നിലനിർത്തുക
  alternative: പരിമിതമായ ചരിത്രകാലമായി വിശദീകരിച്ച് വിവർത്തനം ചെയ്യുക
  rationale: עוֹלָם എന്ന പദത്തിന്റെ ദൈർഘ്യത്തെ വാചകത്തിൽ തന്നെ പരിമിതപ്പെടുത്താതെ, അതിലെ യഥാർഥ തീവ്രതയും വ്യാഖ്യാനസമ്മർദവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ന്യായവിധിയുടെ ‘തലയിന്മേൽ’ എന്ന മൂലരൂപകവും ദാവീദിന്റെ ‘ഭവനം’, ‘സിംഹാസനം’ എന്നീ രാജവംശപരമായ പദങ്ങളും നിലനിർത്തി. ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
