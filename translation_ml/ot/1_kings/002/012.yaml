id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: ml
  text: ശലോമോൻ തന്റെ പിതാവായ ദാവീദിന്റെ സിംഹാസനത്തിൽ ഇരുന്നു; അവന്റെ രാജത്വം വളരെ ഉറപ്പിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ഭരണം വളരെ ഉറപ്പിക്കപ്പെട്ടു”; അല്ലെങ്കിൽ, “അവന്റെ രാജ്യം വളരെ ഉറപ്പിക്കപ്പെട്ടു.”
    reason: מַלְכוּת എന്ന പദത്തിന് ‘രാജത്വം,’ ‘ഭരണം,’ ‘രാജ്യം’ എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം; ഇവിടെ כון എന്ന ക്രിയ ഉറപ്പിക്കപ്പെടുക, സ്ഥാപിതമാകുക എന്ന ആശയം നൽകുന്നു.
lexical_decisions:
- source_word: יָשַׁב
  choice: ഇരുന്നു
  rationale: עַל כִּסֵּא എന്ന സിംഹാസനസന്ദർഭത്തിൽ രാജസ്ഥാനത്ത് ഇരിക്കുകയും അത് ഏറ്റെടുക്കുകയും ചെയ്യുന്ന ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: כִּסֵּא
  choice: സിംഹാസനം
  rationale: ദാവീദിക രാജകീയ പിൻഗാമിത്വത്തിന്റെ സന്ദർഭത്തിൽ പൊതുവായ ‘ഇരിപ്പിടം’ എന്നതിലുപരി രാജസിംഹാസനമാണ് ഉദ്ദേശ്യം.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: ദാവീദ് ശലോമോന്റെ യഥാർഥ പിതാവായതിനാൽ നേരിട്ടുള്ള ബന്ധപദം ഉപയോഗിച്ചു.
- source_word: וַתִּכֹּן
  choice: ദൃഢമായി സ്ഥാപിതമായി
  rationale: כון എന്ന നിഫാൽ രൂപത്തിന്റെ സ്ഥാപിതമാകുക, ഉറപ്പുപ്രാപിക്കുക എന്ന ഫലാവസ്ഥയും സ്വാഭാവികമായ മലയാളപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: מַלְכֻתוֹ
  choice: അവന്റെ രാജത്വം
  rationale: מַלְכוּת എന്ന പദത്തിന് രാജത്വം, ഭരണം, രാജ്യം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ ശലോമോന്റെ രാജാധികാരവും ഭരണസ്ഥിരതയും മുൻനിൽക്കുന്നതിനാൽ ‘രാജത്വം’ തിരഞ്ഞെടുത്തു; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מְאֹד
  choice: അത്യന്തം
  rationale: സ്ഥാപിതമായതിന്റെ ശക്തമായ തീവ്രത നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ സിംഹാസനവുമായി ബന്ധപ്പെട്ട രാജകീയ പിൻഗാമിത്വം
  choice: ശലോമോന്റെ സിംഹാസനാരോഹണവും അവന്റെ രാജത്വം ഉറപ്പുപ്രാപിച്ചതും വിവരിക്കുന്ന ചരിത്രപ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: വംശപരമായ നിയമസാധുതയെയോ പിന്നീടുള്ള മശീഹാ അർഥങ്ങളെയോ കൂടുതൽ വ്യക്തമായി മുൻനിർത്തുന്ന വിവർത്തനം.
  rationale: വാക്യം നേരിട്ട് പറയുന്നത് ശലോമോൻ ദാവീദിന്റെ സിംഹാസനത്തിൽ ഇരുന്നതും അവന്റെ രാജത്വം ഉറപ്പിക്കപ്പെട്ടതുമാണ്. വിശാലമായ കാനോനിക പ്രാധാന്യം മുഖ്യവാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജകീയ ദൃശ്യഭാഷ നിലനിർത്തിക്കൊണ്ട് ഹീബ്രു പദങ്ങളുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
