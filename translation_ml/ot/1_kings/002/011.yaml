id: 1KI.2.11
reference: 1 Kings 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ml
  text: ദാവീദ് ഇസ്രായേലിന്മേൽ രാജാവായി വാണ കാലം നാല്പതു വർഷമായിരുന്നു. ഹെബ്രോനിൽ അവൻ ഏഴു വർഷവും യെരൂശലേമിൽ മുപ്പത്തിമൂന്നു വർഷവും വാണു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: രാജാവായി വാണ കാലം
  rationale: ഹീബ്രു പ്രയോഗത്തിലെ ‘ദിവസങ്ങൾ’ എന്നത് ഇവിടെ ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകാൻ ‘വാണ കാലം’ എന്നു പരിഭാഷപ്പെടുത്തി; מָלַךְ എന്ന ക്രിയയുടെ രാജഭരണസൂചന നിലനിർത്താൻ ‘രാജാവായി’ ചേർത്തു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ
  rationale: מָלַךְ എന്ന ക്രിയയോടൊപ്പമുള്ള עַל ഒരു ജനതയുടെമേലുള്ള ഭരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിന്മേൽ’ ഈ ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: സംഖ്യയും കാലയളവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്ന സാധാരണ മലയാളരൂപം.
- source_word: בְּחֶבְרוֹן
  choice: ഹെബ്രോനിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക അവ്യയത്തെ മലയാളത്തിലെ ‘-യിൽ’ വിഭക്തിയാൽ സ്വാഭാവികമായി നൽകി.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: അവൻ ഏഴു വർഷം വാണു
  rationale: മൂലത്തിലെ ഭരണക്രിയയുടെ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: וּבִירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: നഗരനാമത്തോടുള്ള സ്ഥലസൂചന മലയാളത്തിലെ ‘-യിൽ’ രൂപത്തിൽ നൽകി; മുൻഖണ്ഡത്തോടുള്ള ബന്ധം ‘-വും’ എന്ന സമുച്ചയപ്രത്യയത്തിലൂടെ പ്രകടമാക്കി.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: മുപ്പത്തിമൂന്നു വർഷം
  rationale: ഹീബ്രുവിലെ ‘മുപ്പതും മൂന്നും’ എന്ന സംയുക്തസംഖ്യയെ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ കൃത്യമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ‘ഭരിച്ചു’ എന്നതിനു പകരം രാജഭരണസന്ദർഭത്തിന് അനുയോജ്യമായ ‘വാണു’ ഉപയോഗിച്ചു. മൂലത്തിലെ ആകെ ഭരണകാലവും രണ്ടിടങ്ങളിലെ കാലവിഭജനവും വ്യക്തമായി നിലനിർത്തി.
