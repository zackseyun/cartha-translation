  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: ml
  text: ഇതാ, ഗേരായുടെ മകനും ബഹൂരീമിൽനിന്നുള്ള ബെന്യാമീന്യനുമായ ശിമെയി നിന്റെ കൂടെയുണ്ട്. ഞാൻ മഹനയീമിലേക്കു പോയ ദിവസം അവൻ അതികഠിനമായ ശാപംകൊണ്ട് എന്നെ ശപിച്ചു. എന്നാൽ യോർദാനിൽവെച്ച് എന്നെ എതിരേൽക്കാൻ അവൻ ഇറങ്ങിവന്നു. ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല’[a] എന്നു ഞാൻ യഹ്‌വെയുടെ നാമത്തിൽ അവനോടു ശപഥം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊന്നാൽ...’ ശാപത്തിന്റെ തുടർഭാഗം പറയാതെവിട്ടിരിക്കുന്ന ഒരു ശപഥപ്രയോഗമാണിത്; അതിന്റെ അർഥം: ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല.’'
    reason: മൂലത്തിലെ അപൂർണ ശപഥസൂത്രത്തിന്റെ അക്ഷരാർഥരൂപവും ഉദ്ദേശിച്ച നിഷേധാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ അവതാരകപദത്തിന്റെ സൂചനാശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עִמְּךָ
  choice: നിന്റെ കൂടെയുണ്ട്
  rationale: ശിമെയി ശലോമോന്റെ അധികാരപരിധിയിലോ സാന്നിധ്യത്തിലോ ഉണ്ടെന്ന ആശയം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  choice: ബഹൂരീമിൽനിന്നുള്ള ബെന്യാമീന്യനായ ഗേരായുടെ മകൻ ശിമെയി
  rationale: വ്യക്തിനാമങ്ങളും സ്ഥലനാമവും ലിപ്യന്തരണം ചെയ്യുകയും הַיְמִינִי എന്ന ജനവിഭാഗസൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ബെന്യാമീന്യൻ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: കഠിനമായ ശാപം ചൊല്ലി എന്നെ ശപിച്ചു
  rationale: മൂലത്തിലെ സമാനധാതുപദങ്ങളുടെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് נִמְרֶצֶת സൂചിപ്പിക്കുന്ന ശാപത്തിന്റെ തീവ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: ഞാൻ മഹനയീമിലേക്കു പോയ ദിവസം
  rationale: കാലസൂചനയും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ഗതിയും നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: യോർദാനിൽവെച്ച് എന്നെ എതിരേൽക്കാൻ അവൻ ഇറങ്ങിവന്നു
  rationale: יָרַד എന്ന ഇറക്കദിശയിലുള്ള ചലനവും לִקְרָאתִי എന്ന എതിരേൽപ്പിന്റെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: ഞാൻ യഹ്‌വെയുടെ നാമത്തിൽ അവനോടു സത്യം ചെയ്തു
  rationale: ശപഥപ്രയോഗം വ്യക്തമായി നൽകുകയും יהוה എന്ന ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല
  rationale: אִם എന്ന പദത്തോടെ തുടങ്ങുന്ന, ശാപഭാഗം വിട്ടുകളഞ്ഞ എബ്രായ ശപഥസൂത്രത്തിന്റെ ഉദ്ദേശിച്ച നിഷേധാർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אִם אֲמִיתְךָ בֶּחָרֶב എന്ന അപൂർണ ശപഥസൂത്രം
  choice: പ്രധാനപാഠത്തിൽ ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല’ എന്ന നിഷേധാർഥം
  alternative: ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊന്നാൽ...’ എന്ന അക്ഷരാർഥരൂപം
  rationale: എബ്രായ ശപഥത്തിൽ പറയാതെവിട്ട സ്വയംശാപം മൂലം വാക്യത്തിന് ശക്തമായ നിഷേധാർഥമാണുള്ളത്. തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ആ അർഥം പ്രധാനപാഠത്തിൽ നൽകുകയും രൂപപരമായ അപൂർണത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പഴഞ്ചൻ അഭിസംബോധനകളും അനാവശ്യമായ സഭാപരമായ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി; എന്നാൽ പേരുകൾ, ദൈവനാമം, ശപഥത്തിന്റെ ഔപചാരികത എന്നിവ നിലനിർത്തി.
