revisions:
- from: ഇതാ, ബഹൂരീമിൽനിന്നുള്ള ബെന്യാമീന്യനായ ഗേരായുടെ മകൻ ശിമെയി നിന്റെ കൂടെയുണ്ട്. ഞാൻ മഹനയീമിലേക്കു പോയ ദിവസം അവൻ കഠിനമായ ശാപം ചൊല്ലി എന്നെ ശപിച്ചു. എന്നാൽ യോർദാനിൽവെച്ച് എന്നെ എതിരേൽക്കാൻ അവൻ ഇറങ്ങിവന്നു. ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല’[a] എന്നു ഞാൻ യഹ്‌വെയുടെ നാമത്തിൽ അവനോടു സത്യം ചെയ്തു.
  to: ഇതാ, ഗേരായുടെ മകനും ബഹൂരീമിൽനിന്നുള്ള ബെന്യാമീന്യനുമായ ശിമെയി നിന്റെ കൂടെയുണ്ട്. ഞാൻ മഹനയീമിലേക്കു പോയ ദിവസം അവൻ അതികഠിനമായ ശാപംകൊണ്ട് എന്നെ ശപിച്ചു. എന്നാൽ യോർദാനിൽവെച്ച് എന്നെ എതിരേൽക്കാൻ അവൻ ഇറങ്ങിവന്നു. ‘ഞാൻ നിന്നെ വാൾകൊണ്ട് കൊല്ലുകയില്ല’[a] എന്നു ഞാൻ യഹ്‌വെയുടെ നാമത്തിൽ അവനോടു ശപഥം ചെയ്തു.
  rationale: ശിമെയിയാണ് ബെന്യാമീന്യൻ എന്ന മൂലപാഠത്തിലെ ബന്ധം വ്യക്തമാക്കാൻ നാമവിശേഷണക്രമം പുനഃക്രമീകരിച്ചു. ശാപത്തിന്റെ തീവ്രതയും എബ്രായത്തിലെ ആവർത്തനഊന്നലും കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിച്ചു. ദൈവനാമത്താൽ നടത്തിയ ഔപചാരിക പ്രതിജ്ഞയ്ക്കു ‘ശപഥം ചെയ്തു’ ഉപയോഗിച്ചു. ശപഥസൂത്രത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പും അതിന്റെ ആങ്കറും മാറ്റമില്ലാതെ നിലനിർത്തി.
