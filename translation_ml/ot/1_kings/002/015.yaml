  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “രാജത്വം എനിക്കുള്ളതായിരുന്നെന്നും, ഞാൻ രാജാവാകാൻ ഇസ്രായേൽ മുഴുവനും എന്നിലേക്കു മുഖം തിരിച്ചിരുന്നുവെന്നും നിനക്കറിയാമല്ലോ.[a] എന്നാൽ രാജത്വം വഴിമാറി എന്റെ സഹോദരന്റേതായി; കാരണം അത് യഹോവയിൽനിന്ന് അവനുള്ളതായിരുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ രാജാവാകുമെന്ന് ഇസ്രായേൽ മുഴുവനും എന്നെ പ്രതീക്ഷയോടെ നോക്കിയിരുന്നു.” എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം, “എന്നിലേക്കു തങ്ങളുടെ മുഖം തിരിച്ചിരുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അത് അവന് യഹോവയിൽനിന്നു ലഭിച്ചതായിരുന്നു.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: രാജത്വം
  rationale: ഇവിടെ ഭൂപ്രദേശത്തേക്കാൾ രാജാവിന്റെ പദവിയെയും ഭരണാവകാശത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജത്വം’ തിരഞ്ഞെടുത്തു.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: ഇസ്രായേൽ മുഴുവനും എന്നിലേക്കു മുഖം തിരിച്ചിരുന്നു
  rationale: പ്രതീക്ഷയോടെയും ഉദ്ദേശ്യത്തോടെയും ഒരാളിലേക്കു തിരിയുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִמְלֹךְ
  choice: ഞാൻ രാജാവാകാൻ
  rationale: സന്ദർഭത്തിൽ അദോനീയാവ് രാജാധികാരം ഏറ്റെടുക്കുമെന്ന ഇസ്രായേലിന്റെ പ്രതീക്ഷയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: וַתִּסֹּב
  choice: വഴിമാറി
  rationale: സംഭവഗതിയിലെ തിരിവിനെയും രാജത്വത്തിന്റെ കൈമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന രൂപകം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: וַתְּהִי לְאָחִי
  choice: എന്റെ സഹോദരന്റേതായി
  rationale: രാജത്വം സഹോദരനായ ശലോമോനിലേക്കു കൈമാറപ്പെട്ടതിന്റെ ഉടമസ്ഥതാഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: കാരണം അത് യഹോവയിൽനിന്ന് അവനുള്ളതായിരുന്നു
  rationale: രാജത്വത്തിന്റെ ദൈവിക ഉറവിടം വ്യക്തമാക്കുമ്പോഴും ‘കൊടുത്തു’ എന്ന വാക്ക് ചേർത്ത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകുന്നത് ഒഴിവാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരൻ
  rationale: അദോനീയാവിന്റെ കാഴ്ചപ്പാടിൽ ശലോമോനുമായുള്ള കുടുംബബന്ധം നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: അവസാന ഉപവാക്യത്തിലെ ദൈവിക നിയമനത്തിന്റെ വ്യക്തത
  choice: അത് യഹോവയിൽനിന്ന് അവനുള്ളതായിരുന്നു
  alternative: യഹോവ അത് അവനു കൊടുത്തിരുന്നു
  rationale: രാജത്വം യഹോവയിൽനിന്നാണെന്ന അവകാശവാദം നിലനിർത്തുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യക്തമായ ‘കൊടുക്കുക’ എന്ന ക്രിയ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘രാജത്വം’ എന്ന പദം രാഷ്ട്രീയ പദവിയും ഭരണാവകാശവും അടയാളപ്പെടുത്തുന്നു. എബ്രായ രൂപകമായ ‘മുഖം തിരിക്കുക’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ പ്രതീക്ഷാഭാവം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
