  terminology: ‘രാജത്വം’ suitably denotes kingship/royal office in this context. ‘യഹോവ’ consistently represents the Tetragrammaton, and ‘എന്റെ സഹോദരൻ’ correctly leaves the referent implicit as in the Hebrew.
  issues:
