source:
  edition: WLC
  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: ml
  text: 'അപ്പോൾ ശലോമോൻ രാജാവ് യഹ്‌വെയെച്ചൊല്ലി[a] ശപഥം ചെയ്തു: “ദൈവം എനിക്ക് അങ്ങനെ ചെയ്യട്ടെ; അതിലുമധികം ചെയ്യട്ടെ! കാരണം, അദോനീയാവ് ഈ വാക്ക് സ്വന്തം ജീവന് എതിരായി പറഞ്ഞിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ദൈവനാമം יהוה (YHWH) എന്നാണ്; ഇവിടെ അത് “യഹ്‌വെ” എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: divine_name
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “തന്റെ ജീവനോടുകൂടെ/തന്റെ ജീവന് എതിരായി ഈ വാക്ക് സംസാരിച്ചു.” അദോനീയാവിന്റെ വാക്ക് അവന്റെ ജീവനെ അപകടത്തിലാക്കുന്നതോ അവന്റെ ജീവൻ നഷ്ടപ്പെടാൻ ഇടയാക്കുന്നതോ ആണെന്ന് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: സത്യംചെയ്തു
  rationale: ശപഥം ചെയ്യുക എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
- source_word: בַּיהוָה
  choice: യഹ്‌വെയെച്ചൊല്ലി
  rationale: בְ എന്ന ഉപസർഗം ആരെ സാക്ഷിയാക്കി ശപഥം ചെയ്തുവെന്ന് സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: ദൈവം എന്നോട് അങ്ങനെ ചെയ്യട്ടെ; അതിലധികവും ചെയ്യട്ടെ
  rationale: വിധി എന്താണെന്ന് വ്യക്തമാക്കാതെ സ്വയം ശാപം വിളിച്ചുവരുത്തുന്ന സ്ഥിരമായ ഹീബ്രു ശപഥസൂത്രത്തിന്റെ ശക്തിയും ഇരുഭാഗ ഘടനയും നിലനിർത്തുന്നു.
- source_word: כִּי
  choice: അദോനീയാവ്… പറഞ്ഞിരിക്കുന്നത്
  rationale: ഇവിടെ כִּי ശപഥത്തിന്റെ കാരണമോ ഉറച്ച പ്രഖ്യാപനമോ അവതരിപ്പിക്കുന്നു; ഇല്ലാത്ത നിഷേധം ചേർത്ത് സോപാധികവാക്യമാക്കാതെ പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: בְנַפְשׁוֹ
  choice: സ്വന്തം ജീവനു വിരോധമായി
  rationale: അദോനീയാവിന്റെ വാക്ക് അവന്റെ ജീവനെ അപകടത്തിലാക്കുകയോ ജീവൻ നഷ്ടപ്പെടാൻ ഇടയാക്കുകയോ ചെയ്യുന്നു എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ന്യായവിധിസ്വരം നിലനിർത്തുന്നു.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: ഈ വാക്ക് പറഞ്ഞിരിക്കുന്നത്
  rationale: ‘ഈ വാക്ക്/കാര്യം സംസാരിച്ചു’ എന്ന മൂലഭാഷയുടെ ആവർത്തനഘടന അമിതമായ കൃത്രിമത്വമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנִיָּהוּ
  choice: അദോനീയാവ്
  rationale: പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പരിചിത ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ദൈവത്തിന്റെ ഉടമ്പടിനാമം പൊതുനാമമാക്കി മാറ്റാതെ, ഹീബ്രു വ്യഞ്ജനരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള വ്യാപകമായ പണ്ഡിതോചിത ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകി.
- issue: כִּי എന്നതിന്റെ ശപഥസന്ദർഭത്തിലുള്ള ബന്ധം
  choice: കാരണാത്മക/ഉറപ്പുനൽകുന്ന പ്രസ്താവന
  alternative: ‘എങ്കിൽ’ എന്ന സോപാധിക വായന
  rationale: സന്ദർഭത്തിൽ ശലോമോൻ അദോനീയാവിന്റെ വാക്ക് അവന്റെ ജീവൻ നഷ്ടപ്പെടാൻ കാരണമാകുമെന്ന് ഉറപ്പിച്ചു പ്രഖ്യാപിക്കുന്നു. സോപാധിക വായന സാധ്യമെങ്കിലും മലയാളത്തിൽ അത് പൂർത്തിയാക്കാൻ മൂലത്തിൽ ഇല്ലാത്ത നിഷേധമോ നിഗൂഢവാക്യഭാഗമോ ചേർക്കേണ്ടിവരും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ശപഥസൂത്രത്തിന്റെ ഔപചാരിക ആവർത്തനവും בְנַפְשׁוֹ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശപൂർവമായ കടുപ്പവും നിലനിർത്തി; അപരിചിതമായ ഹീബ്രു പ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
