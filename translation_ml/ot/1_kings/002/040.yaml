source:
  edition: WLC
  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: ml
  text: അപ്പോൾ ശിമെയി എഴുന്നേറ്റ് തന്റെ കഴുതയെ കോപ്പിട്ടു; തന്റെ അടിമകളെ[a] അന്വേഷിക്കാൻ ഗത്തിലേക്ക് ആഖീശിന്റെ അടുക്കൽ പോയി. ശിമെയി പോയി തന്റെ അടിമകളെ ഗത്തിൽനിന്ന് കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സേവകരെ.’ എബ്രായപദമായ עֲבָדָיו ‘സേവകർ’ അല്ലെങ്കിൽ ‘അടിമകൾ’ എന്നു അർഥമാക്കാം; ഈ സന്ദർഭത്തിൽ ‘അടിമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും തുടർച്ചയായ ആഖ്യാനപ്രവാഹവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: തന്റെ കഴുതയ്ക്കു കോപ്പിട്ടു
  rationale: യാത്രയ്ക്കായി കഴുതയെ സജ്ജമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന חבש എന്ന ക്രിയയ്ക്ക് മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: גַּתָה
  choice: ഗത്തിലേക്ക്
  rationale: സ്ഥലത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന directional he മലയാളത്തിലെ ‘-ലേക്ക്’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶל־אָכִישׁ
  choice: ആഖീശിന്റെ അടുക്കൽ
  rationale: אֶל എന്നതിന്റെ വ്യക്തിയിലേക്കുള്ള ദിശ വ്യക്തമാക്കുകയും אָכִישׁ എന്ന പേര് ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לְבַקֵּשׁ
  choice: അന്വേഷിക്കാൻ
  rationale: കാണാതായ ആളുകളെ തേടുന്ന ഈ സന്ദർഭത്തിൽ בקש എന്നതിന്റെ concrete അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ അടിമകളെ
  rationale: עֶבֶד എന്ന പദത്തിന് ദാസൻ/സേവകൻ/അടിമ എന്നീ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും, ഓടിപ്പോയവരെ ഉടമ തിരികെ കൊണ്ടുവരുന്ന ഈ സന്ദർഭത്തിൽ ബന്ധിതമായ സാമൂഹികപദവി ‘അടിമകൾ’ കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיָּבֵא אֶת־עֲבָדָיו מִגַּת
  choice: തന്റെ അടിമകളെ ഗത്തിൽനിന്ന് തിരികെ കൊണ്ടുവന്നു
  rationale: Hiphil രൂപമായ וַיָּבֵא ‘കൊണ്ടുവന്നു’ എന്നാണ്; തിരച്ചിലിനുശേഷമുള്ള മടക്കിക്കൊണ്ടുവരൽ സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘തിരികെ’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: עֲבָדָיו എന്ന പദത്തിലെ സാമൂഹികപദവിയുടെ അവ്യക്തത
  choice: പ്രധാനവാചകത്തിൽ ‘അടിമകൾ’
  alternative: ‘ദാസന്മാർ’ അല്ലെങ്കിൽ ‘സേവകർ’
  rationale: ഇത് പ്രത്യേക ദൈവശാസ്ത്രനിലപാട് ചുമത്തുന്നില്ല; ഓടിപ്പോയവരെ ശിമെയി അന്വേഷിച്ച് കൊണ്ടുവരുന്ന സമീപസന്ദർഭം സ്വതന്ത്ര സേവനത്തേക്കാൾ ബന്ധിതാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. എങ്കിലും മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. പേരുകൾ ‘ശിമെയി,’ ‘ഗത്ത്,’ ‘ആഖീശ്’ എന്നിങ്ങനെ ലിപ്യന്തരം ചെയ്തു. മൂലവാചകത്തിലെ ക്രിയാതുടർച്ച മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ നിലനിർത്തി; രണ്ടാം വാക്യത്തിലെ ‘തിരികെ’ സന്ദർഭം സൂചിപ്പിക്കുന്ന മടക്കിക്കൊണ്ടുവരൽ സ്വാഭാവികമാക്കുന്നു.
