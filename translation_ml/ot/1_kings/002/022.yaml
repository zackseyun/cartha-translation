base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: ml
  text: 'ശലോമോൻ രാജാവ് തന്റെ അമ്മയോടു മറുപടി പറഞ്ഞു: “അദോനീയാവിനുവേണ്ടി ശൂനേമ്യക്കാരിയായ അബീശഗിനെ നീ ചോദിക്കുന്നത് എന്തിന്? അവനുവേണ്ടി രാജത്വവും[a] ചോദിച്ചുകൊള്ളൂ! അവൻ എന്റെ മൂത്ത സഹോദരനല്ലോ—അവനുവേണ്ടിയും പുരോഹിതനായ അബ്യാഥാറിനുവേണ്ടിയും സെരൂയയുടെ മകനായ യോവാബിനുവേണ്ടിയും!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജ്യം’ എന്നും ‘രാജാധികാരം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ എബ്രായപദം രാജാവായി ഭരിക്കുന്ന പദവിയെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: രണ്ട് എബ്രായ ആഖ്യാനക്രിയകളുടെയും പ്രതികരണാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘ഉത്തരം പറഞ്ഞുകൊണ്ട് പറഞ്ഞു’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: ശൂനേമ്യസ്ത്രീയായ അബീശഗ്
  rationale: വ്യക്തിനാമവും ശൂനേം സ്വദേശിനിയെന്ന തിരിച്ചറിയലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: അവനുവേണ്ടി രാജത്വവും ചോദിച്ചുകൊള്ളൂ
  rationale: വ്യംഗ്യഭരിതമായ ആജ്ഞയും അഭ്യർഥനയുടെ രാജവാഴ്ചാവകാശപരമായ സൂചനയും നിലനിർത്തുന്നു; ‘രാജത്വം’ പ്രദേശത്തേക്കാൾ ഭരിക്കാനുള്ള പദവിയെയാണ് മുൻനിർത്തുന്നത്.
- source_word: אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: എന്റെ മൂത്ത സഹോദരൻ
  rationale: ജനനക്രമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן־צְרוּיָה
  choice: അവനുവേണ്ടിയും പുരോഹിതനായ അബ്യാഥാറിനുവേണ്ടിയും സെരൂയയുടെ മകനായ യോവാബിനുവേണ്ടിയും
  rationale: എബ്രായത്തിലെ അപൂർണവാക്യസ്വഭാവമുള്ള, ആവർത്തനാത്മകമായ ഉച്ചകോടി മലയാളത്തിലും നിലനിർത്തുന്നു; ഇവർ അദോനീയാവിന്റെ പക്ഷക്കാരാണെന്നത് വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അബീശഗിനെ ചോദിച്ചതിന്റെ രാജവംശപരമായ അർഥസൂചന
  choice: הַמְּלוּכָה എന്നത് ‘രാജത്വം’ എന്നു വിവർത്തനം ചെയ്തു; അഭ്യർഥനയെ രാജാധികാരാവകാശവുമായി ശലോമോൻ ബന്ധിപ്പിക്കുന്നതു പ്രകടമാക്കി.
  alternative: ‘രാജ്യം’ അല്ലെങ്കിൽ ‘സിംഹാസനം’
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ഭൂപ്രദേശമല്ല, രാജാവായി ഭരിക്കാനുള്ള നിലയും അവകാശവുമാണ്; അതേസമയം ‘സിംഹാസനം’ മൂലപദത്തേക്കാൾ രൂപകാത്മകമായി നിർദിഷ്ടമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ സ്വാഭാവികവുമായ മലയാളം. ശലോമോന്റെ ചോദ്യത്തിലെ വ്യംഗ്യവും അവസാന ഭാഗത്തിലെ രോഷഭരിതമായ ആവർത്തനവും ആശ്ചര്യചിഹ്നവും ദീർഘവിരാമവും ഉപയോഗിച്ച് നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘രാജത്വം’ എന്ന പദത്തിനുശേഷം വെച്ചു.
