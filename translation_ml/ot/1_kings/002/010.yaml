source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב דָּוִ֖ד עִם אֲבֹתָ֑י/ו וַ/יִּקָּבֵ֖ר בְּ/עִ֥יר דָּוִֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/010.yaml
  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: ml
  text: അങ്ങനെ ദാവീദ് തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു; ദാവീദിന്റെ നഗരത്തിൽ അടക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു” എന്നത് മരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: שׁכב എന്ന ക്രിയയ്ക്ക് ‘കിടക്കുക/ഉറങ്ങുക’ എന്നാണ് അടിസ്ഥാനാർഥം. ഇവിടെ രാജാവിന്റെ മരണവിവരണത്തിൽ വരുന്ന പതിവുശൈലിയായതിനാൽ മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം’ എന്നത് ഉറവിടത്തിലെ ബന്ധസൂചനയും വംശപരമായ അനുരണനവും കാത്തുസൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് മുൻഗാമികളെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: ദാവീദുമായി ബന്ധപ്പെട്ട യെരൂശലേമിലെ സ്ഥലത്തിന്റെ സ്ഥിരമായ നാമവിശേഷണം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാവ് തുടർന്നുള്ള സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനക്രമം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു’ എന്ന മരണപ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: എബ്രായത്തിലെ നിദ്രാപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ മരണാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘മരിച്ചു’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: നേരിട്ടുള്ള അർഥം മാത്രം നൽകിയാൽ ആശയം വ്യക്തമാകുമെങ്കിലും, രാജകീയ മരണവിവരണങ്ങളുടെ സാഹിത്യബന്ധവും ഉറവിടത്തിലെ രൂപകവും നഷ്ടപ്പെടും. അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുമ്പോൾ മുഖ്യപാഠം യഥാർഥ പ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ മരണപ്രയോഗത്തിന്റെ സാഹിത്യഭാവം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
