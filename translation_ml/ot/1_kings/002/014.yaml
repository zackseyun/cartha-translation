  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്ക് നിന്നോടു ഒരു വാക്ക്/കാര്യം ഉണ്ട്’ എന്ന ഘടനയായിരുന്നാലും, ഇത് ഒരാളോടു പറയാനുള്ള കാര്യമുണ്ടെന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്. മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം തിരഞ്ഞെടുത്തു.
