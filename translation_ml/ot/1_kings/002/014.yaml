- source_word: דַּבֵּר
  choice: പറയൂ
  rationale: דבר എന്ന ക്രിയയുടെ പുരുഷലിംഗ ഏകവചന കല്പനാരൂപം. സംഭാഷണസന്ദർഭത്തിൽ ‘പറയൂ’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളമാണ്.
