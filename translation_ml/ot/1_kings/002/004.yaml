revisions:
- from: 'യഹ്‌വെ എന്നെക്കുറിച്ച്[a] അരുളിച്ചെയ്ത തന്റെ വചനം ഉറപ്പിക്കേണ്ടതിനുമാണിത്. അവിടന്ന് അരുളിച്ചെയ്തത്: “നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി സൂക്ഷിച്ച്, പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ എന്റെ സന്നിധിയിൽ വിശ്വസ്തതയോടെ[b] നടന്നാൽ, ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ നിന്റെ വംശത്തിൽ ഒരു പുരുഷൻ ഇല്ലാതെപോകുകയില്ല[c].”'
  to: 'യഹ്‌വെ എന്നെക്കുറിച്ച്[a] അരുളിച്ചെയ്ത തന്റെ വചനം ഉറപ്പിക്കേണ്ടതിന്, അവിടന്ന് അരുളിച്ചെയ്തത്: “നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി കാത്തുസൂക്ഷിച്ച്, പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ എന്റെ മുമ്പാകെ വിശ്വസ്തതയോടെ[b] നടന്നാൽ, ‘ഇസ്രായേലിന്റെ സിംഹാസനത്തിന്മേൽനിന്ന് നിനക്കുള്ള ഒരു പുരുഷൻ ഛേദിക്കപ്പെടുകയില്ല’ എന്ന്.”'
  rationale: The revision restores the dependent purposive syntax, represents both speech-introducing elements without an unnatural double quotation structure, and keeps the Hebrew passive dynastic assurance in the main text. Footnote c is retained and clarified as an idiom explanation, though its marker is not necessary in the main text because the literal wording is now translated there.
