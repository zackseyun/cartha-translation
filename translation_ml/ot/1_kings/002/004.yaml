source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: ml
  text: 'യഹ്‌വെ എന്നെക്കുറിച്ച്[a] അരുളിച്ചെയ്ത തന്റെ വചനം ഉറപ്പിക്കേണ്ടതിന്, അവിടന്ന് അരുളിച്ചെയ്തത്: “നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി കാത്തുസൂക്ഷിച്ച്, പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ എന്റെ മുമ്പാകെ വിശ്വസ്തതയോടെ[b] നടന്നാൽ, ‘ഇസ്രായേലിന്റെ സിംഹാസനത്തിന്മേൽനിന്ന് നിനക്കുള്ള ഒരു പുരുഷൻ ഛേദിക്കപ്പെടുകയില്ല’ എന്ന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എന്നെക്കുറിച്ച് അരുളിച്ചെയ്തത്’; ചിലർ ‘എന്നോട് അരുളിച്ചെയ്തത്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ‘വിശ്വസ്തതയോടെ’ എന്നതിന് ‘സത്യസന്ധമായി’ അല്ലെങ്കിൽ ‘നിഷ്കളങ്കതയോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ഉറപ്പിക്കേണ്ടതിനുമാണിത്
  rationale: ഈ പദം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു. മുൻവാക്യവുമായി ബന്ധമുള്ള ഹീബ്രു ഉദ്ദേശ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יָקִים
  choice: ഉറപ്പിക്കുക
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ പറഞ്ഞ വചനം നിലനിറുത്തുക, സ്ഥിരീകരിക്കുക എന്ന അർഥത്തിലാണ്; ‘ഉറപ്പിക്കുക’ വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, ആ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം നൽകിയിരിക്കുന്നു.
- source_word: דְּבָרוֹ
  choice: തന്റെ വചനം
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘അവന്റെ വചനം’ എന്നാണ്; സന്ദർഭത്തിൽ വാഗ്ദാനത്തെ സൂചിപ്പിച്ചാലും മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: דִּבֶּר עָלַי
  choice: എന്നെക്കുറിച്ച് അരുളിച്ചെയ്ത
  rationale: עַל എന്ന ഉപസർഗത്തിന്റെ സാധാരണ അർഥമായ ‘കുറിച്ച്/സംബന്ധിച്ച്’ നിലനിർത്തുന്നു; ‘എന്നോട്’ എന്ന സന്ദർഭാധിഷ്ഠിത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: തങ്ങളുടെ വഴി സൂക്ഷിച്ച്
  rationale: שׁמר എന്നത് ഇവിടെ ശ്രദ്ധയോടെ കാത്തുപാലിക്കുക എന്ന അർഥം വഹിക്കുന്നു; ‘വഴി’ ജീവിതനടപ്പിന്റെ ഹീബ്രു രൂപകം നിലനിർത്തുന്നു.
- source_word: לָלֶכֶת לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ ... നടന്നാൽ
  rationale: ദൈവത്തിന്റെ മുമ്പാകെ നടക്കുക എന്ന ഉടമ്പടിപരമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ ‘എന്റെ സന്നിധിയിൽ നടക്കുക’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: בֶּאֱמֶת
  choice: വിശ്വസ്തതയോടെ
  rationale: אמת ഇവിടെ സത്യം, വിശ്വസ്തത, ആത്മാർഥത എന്നീ അർഥവ്യാപ്തിയുള്ള പദമാണ്. ജീവിതനടപ്പിനെ വിശേഷിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘വിശ്വസ്തതയോടെ’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ
  rationale: സമ്പൂർണമായ ആന്തരിക സമർപ്പണം സൂചിപ്പിക്കുന്ന ഇരട്ട ഹീബ്രു പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ നിന്റെ വംശത്തിൽ ഒരു പുരുഷൻ ഇല്ലാതെപോകുകയില്ല
  rationale: ‘നിനക്കുള്ള ഒരു പുരുഷൻ സിംഹാസനത്തിന്മേൽനിന്ന് ഛേദിക്കപ്പെടുകയില്ല’ എന്ന ഹീബ്രു ശൈലിയുടെ വംശപരമ്പരാസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥ ഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിനോടുള്ള വാഗ്ദാനത്തിന്റെ വ്യവസ്ഥാധീനത
  choice: ‘നിന്റെ പുത്രന്മാർ ... നടന്നാൽ’ എന്ന വ്യക്തമായ വ്യവസ്ഥ നിലനിർത്തി.
  alternative: മറ്റിടങ്ങളിലെ നിരുപാധിക വാഗ്ദാനങ്ങളോട് പൊരുത്തപ്പെടുത്താൻ ഇതിനെ ഒരു പൊതുവായ ഉപദേശമായി മയപ്പെടുത്തുക.
  rationale: ഹീബ്രു വാക്യം ദാവീദിന്റെ സന്തതികളുടെ ജീവിതനടപ്പുമായി വാഗ്ദാനത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു. വിശാലമായ ഉടമ്പടി-ദൈവശാസ്ത്ര ചർച്ച ഇവിടെ പരിഹരിക്കാതെ വാചകത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ‘നിന്റെ വംശത്തിൽ ഒരു പുരുഷൻ ഇല്ലാതെപോകുകയില്ല’ എന്ന രാജവംശീയ പ്രയോഗം
  choice: വാഗ്ദാനം ദാവീദിന്റെ പുരുഷവംശജനെയും ഇസ്രായേൽ സിംഹാസനത്തെയും സംബന്ധിക്കുന്നതായി ലിംഗവും രാജവംശീയ ദിശയും നിലനിർത്തി.
  alternative: ‘നിന്റെ സന്തതി ഒരിക്കലും ഇല്ലാതാകുകയില്ല’ എന്ന പൊതുവായ, ലിംഗനിരപേക്ഷ രൂപം.
  rationale: אִישׁ എന്നത് ഇവിടെ പുരുഷ രാജാവിനെ സൂചിപ്പിക്കുകയും സിംഹാസനാവകാശത്തിന്റെ പ്രത്യേക പശ്ചാത്തലം വഹിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്തു’, ‘വചനം’, ‘സന്നിധി’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; ദുഷ്കരമായ ഹീബ്രു ശൈലികൾ മുഖ്യവാക്യത്തിൽ അർഥസുതാര്യമായി നൽകിയിട്ടും രൂപകങ്ങളും ദൈവശാസ്ത്രപരമായ വ്യവസ്ഥയും സംരക്ഷിച്ചിട്ടുണ്ട്.
