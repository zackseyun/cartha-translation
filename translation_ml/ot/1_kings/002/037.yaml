source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/עָֽבַרְתָּ֙ אֶת נַ֣חַל קִדְר֔וֹן יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת דָּמְ/ךָ֖ יִהְיֶ֥ה בְ/רֹאשֶֽׁ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: ml
  text: നീ പുറപ്പെട്ട് കിദ്രോൻ താഴ്‌വര[a] കടക്കുന്ന ദിവസം, നീ നിശ്ചയമായും മരിക്കുമെന്ന് ഉറപ്പായി അറിഞ്ഞുകൊള്ളുക; നിന്റെ രക്തം നിന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിദ്രോൻ തോട് കടക്കുക.’ എബ്രായത്തിലെ נחל എന്ന പദം ഒരു താഴ്‌വരയെയോ വാടിയെയോ കാലിക നീരൊഴുക്കിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ രക്തം നിന്റെ തലമേൽ’ എന്നത് ഒരു എബ്രായ ശൈലിപ്രയോഗമാണ്; നിന്റെ മരണത്തിന്റെ ഉത്തരവാദിത്വം നീ തന്നെയാണ് വഹിക്കുക എന്നാണ് അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: ദിവസം
  rationale: സന്ദർഭത്തിൽ നിബന്ധനയും അതിന്റെ അനിവാര്യ ഫലവും അവതരിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗമാണിത്. ‘ദിവസം’ എന്ന രൂപം മുന്നറിയിപ്പിന്റെ ഗൗരവമുള്ള നിയമഭാവം നിലനിർത്തുന്നു.
- source_word: צֵאתְךָ
  choice: നീ പുറപ്പെട്ട്
  rationale: നിയന്ത്രിത പ്രദേശത്തുനിന്ന് ശിമെയി പുറത്തുപോകുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: കിദ്രോൻ താഴ്‌വര കടക്കുന്ന
  rationale: נחל എന്ന പദത്തിന് താഴ്‌വര, വാടി, കാലിക നീരൊഴുക്ക് എന്നീ അർഥസാധ്യതകളുണ്ട്. ഭൂമിശാസ്ത്രപരമായ പേരായി ‘കിദ്രോൻ താഴ്‌വര’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יָדֹעַ תֵּדַע
  choice: ഉറപ്പായി അറിഞ്ഞുകൊള്ളുക
  rationale: ക്രിയയുടെ infinitive absolute രൂപവും finite verb-ഉം ചേർന്നുള്ള ഊന്നൽ, ഉറച്ച അറിവിനുള്ള ആജ്ഞയായി മലയാളത്തിൽ പകർന്നു.
- source_word: כִּי מוֹת תָּמוּת
  choice: നീ നിശ്ചയമായും മരിക്കുമെന്ന്
  rationale: മരണത്തിന്റെ ഉറപ്പിനെ ഊന്നുന്ന എബ്രായ ആവർത്തനഘടന ‘നിശ്ചയമായും’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: നിന്റെ രക്തം നിന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും
  rationale: മരണത്തിന്റെ ഉത്തരവാദിത്വം ആ വ്യക്തിക്കുതന്നെയാണെന്ന എബ്രായ നിയമപരമായ രൂപകം വിശദീകരിച്ചുമാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമപരമായ മരണത്തിന്റെയും വ്യക്തിപരമായ ഉത്തരവാദിത്വത്തിന്റെയും പ്രയോഗം
  choice: ‘നിന്റെ രക്തം നിന്റെ സ്വന്തം തലമേൽ ആയിരിക്കും’ എന്ന എബ്രായ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നിന്റെ മരണത്തിന് നീ തന്നെയായിരിക്കും ഉത്തരവാദി.’
  rationale: ഇത് പ്രത്യേക മതവിഭാഗത്തിന്റെ സിദ്ധാന്തമല്ല, ന്യായവിധിയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പും വ്യക്തിപരമായ ബാധ്യതയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. രൂപകം നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ നിയമപരവും ധാർമികവുമായ ശക്തി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ഗൗരവമുള്ള നിയമപരമായ മുന്നറിയിപ്പിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട്, സാധാരണ ആധുനിക മലയാളവായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന ഉപയോഗിച്ചു. ഇരട്ട എബ്രായ ഊന്നലുകൾ യഥാക്രമം ‘ഉറപ്പായി’ എന്നും ‘നിശ്ചയമായും’ എന്നും പകർന്നു; ഉത്തരവാദിത്വത്തിന്റെ രൂപകം വിശദീകരിച്ചുമാറ്റാതെ സംരക്ഷിച്ചു.
