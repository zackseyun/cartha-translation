- from: 'നിന്റെ ദൈവമായ യഹ്‌വേ നിന്നെ ഏൽപ്പിച്ചിരിക്കുന്ന ഉത്തരവാദിത്വം നിറവേറ്റുക: അവന്റെ വഴികളിൽ നടക്കുകയും മോശയുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ അവന്റെ ചട്ടങ്ങളും കല്പനകളും ന്യായവിധികളും സാക്ഷ്യങ്ങളും പാലിക്കുകയും ചെയ്യുക. അങ്ങനെ നീ ചെയ്യുന്നതിലെല്ലാം, നീ തിരിയുന്നിടത്തെല്ലാം, വിവേകത്തോടെ പ്രവർത്തിക്കും.[a]'
