base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: ml
  text: 'നിന്റെ ദൈവമായ യഹ്‌വേ നിനക്കു ഏൽപ്പിച്ചിരിക്കുന്ന ചുമതല നിർവഹിക്കുക: അവന്റെ വഴികളിൽ നടക്കുകയും മോശയുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ അവന്റെ ചട്ടങ്ങളും കല്പനകളും ന്യായവിധികളും സാക്ഷ്യങ്ങളും പാലിക്കുകയും ചെയ്യുക. അങ്ങനെ നീ ചെയ്യുന്ന എല്ലാറ്റിലും, നീ എവിടേക്കു തിരിഞ്ഞാലും, വിവേകത്തോടെ പ്രവർത്തിക്കേണ്ടതിന്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിജയിക്കേണ്ടതിന്.” എബ്രായ ക്രിയയ്ക്ക് വിവേകത്തോടെ പ്രവർത്തിക്കുക എന്ന അർഥവും അതിൽനിന്നുണ്ടാകുന്ന വിജയം എന്ന അർഥവും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: നിന്നെ ഏൽപ്പിച്ചിരിക്കുന്ന ഉത്തരവാദിത്വം നിറവേറ്റുക
  rationale: מִשְׁמֶרֶת ഏൽപ്പിക്കപ്പെട്ട കർത്തവ്യം അഥവാ ചുമതല സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘കാവൽ കാക്കുക’ എന്നതിനേക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ് ഈ പ്രയോഗം.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוה ഒരു പദവികൊണ്ട് പകരാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; אֱלֹהֶיךָ എന്നത് ഏകവചന രണ്ടാംപുരുഷ രൂപത്തിൽ നിലനിർത്തി.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: അവന്റെ വഴികളിൽ നടക്കുകയും
  rationale: അനുസരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ നടത്തത്തിന്റെ രൂപകം മലയാളത്തിലും സ്വാഭാവികമായതിനാൽ സംരക്ഷിച്ചു.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: അവന്റെ ചട്ടങ്ങളും കല്പനകളും ന്യായവിധികളും സാക്ഷ്യങ്ങളും
  rationale: നിയമപരവും ഉടമ്പടിപരവുമായ നാല് വ്യത്യസ്ത പദങ്ങളുടെ ഭേദം കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: മോശയുടെ ന്യായപ്രമാണത്തിൽ
  rationale: ഇവിടെ תּוֹרָה മോശയിലൂടെ ലഭിച്ച എഴുതപ്പെട്ട നിയമബോധനത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥാപിതമായ മലയാള ബൈബിൾ പ്രയോഗം സ്വീകരിച്ചു.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: അങ്ങനെ … വിവേകത്തോടെ പ്രവർത്തിക്കും
  rationale: שׂכל എന്ന ക്രിയയുടെ മുഖ്യമായ വിവേകപൂർവ പ്രവർത്തനഭാവം പ്രകടിപ്പിക്കുന്നു; അതിൽനിന്നുണ്ടാകുന്ന വിജയസൂചന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: നീ തിരിയുന്നിടത്തെല്ലാം
  rationale: എബ്രായ ദിശാരൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക ഉച്ചാരണപരമ്പര നിർബന്ധിക്കുന്നില്ല.
- issue: תַּשְׂכִּיל എന്നതിലെ വിവേകവും വിജയവും
  choice: വിവേകത്തോടെ പ്രവർത്തിക്കും
  alternative: വിജയിക്കും / അഭിവൃദ്ധിപ്പെടും
  rationale: ക്രിയയ്ക്ക് വിവേകപൂർവം പ്രവർത്തിക്കുക എന്നും അതിന്റെ ഫലമായി വിജയിക്കുക എന്നും അർഥസാധ്യതകളുണ്ട്. മുഖ്യപാഠം ആദ്യം പറയുന്ന ഭാവം സ്വീകരിക്കുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
- issue: അനുസരണവും വിജയവും തമ്മിലുള്ള ബന്ധം
  choice: വാക്യത്തിലെ ഉദ്ദേശ്യ/ഫലബന്ധം അതേപടി നിലനിർത്തി
  alternative: ഭൗതിക സമൃദ്ധിയുടെ പൊതുവാഗ്ദാനമായി വിപുലീകരിക്കൽ
  rationale: സന്ദർഭം ദാവീദ് ശലോമോനു നൽകുന്ന രാജകീയ-ഉടമ്പടി ഉപദേശമാണ്; അതിനപ്പുറം ഒരു സമൃദ്ധിസിദ്ധാന്തം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചട്ടങ്ങൾ, കല്പനകൾ, ന്യായവിധികൾ, സാക്ഷ്യങ്ങൾ’ എന്ന നിയമപദനിരയുടെ വ്യത്യാസങ്ങൾ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
