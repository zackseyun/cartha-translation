id: 1KI.2.35
reference: 1 Kings 2:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: ml
  text: രാജാവ് യെഹോയാദയുടെ മകനായ ബെനായാവിനെ അവന്റെ സ്ഥാനത്ത് സൈന്യത്തിന്റെ മേധാവിയായി നിയമിച്ചു[a]; അബ്യാഥാരിന്റെ സ്ഥാനത്ത് സാദോക്ക് പുരോഹിതനെയും രാജാവ് നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവന്റെ സ്ഥാനത്ത്’ എന്നാണ്; തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ സ്ഥാനത്തുനിന്ന് നീക്കപ്പെട്ട സൈന്യാധിപനായ യോവാബിനെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: നിയമിച്ചു
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘വെച്ചു/നൽകി’ എന്നാണെങ്കിലും, ഇവിടെ ഒരാളെ ഔദ്യോഗിക സ്ഥാനത്ത് സ്ഥാപിക്കുന്ന ഭരണപരമായ അർഥമാണ്; ‘നിയമിച്ചു’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: മുൻ സ്ഥാനക്കാരനെ മാറ്റി പകരം നിയമിക്കുന്ന ആശയവും എബ്രായത്തിലെ സർവനാമത്തിന്റെ പരാമർശസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: עַל הַצָּבָא
  choice: സൈന്യത്തിന്റെ മേധാവിയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘സൈന്യത്തിന്മേൽ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ സൈന്യത്തിന്റെ നേതൃത്വച്ചുമതലയാണ് സൂചിപ്പിക്കുന്നത്; ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: എബ്രായ പിതൃനാമഘടന സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുകയും വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: צָדוֹק הַכֹּהֵן
  choice: സാദോക്ക് പുരോഹിതൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്ത്, അനുബന്ധ പദവിയായ ‘പുരോഹിതൻ’ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תַּחַת אֶבְיָתָר
  choice: അബ്യാഥാരിന്റെ സ്ഥാനത്ത്
  rationale: ഒരു ഔദ്യോഗിക സ്ഥാനത്ത് മറ്റൊരാളെ പകരം സ്ഥാപിക്കുന്ന ആശയം കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിത രാജപദവി നേരിട്ട് പരിഭാഷപ്പെടുത്തി; എബ്രായത്തിൽ രണ്ടാമത്തെ ഉപവാക്യത്തിലും ആവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലും ആവർത്തിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭരണപരമായ സന്ദർഭത്തിൽ ‘നിയമിച്ചു’ എന്നും സൈനിക നേതൃത്വത്തെ വ്യക്തമാക്കാൻ ‘സൈന്യത്തിന്റെ മേധാവിയായി’ എന്നും ഉപയോഗിച്ചു; എബ്രായത്തിലെ ആവർത്തനവും പകരംവെക്കൽ ആശയവും നിലനിർത്തി.
