id: 1KI.2.7
reference: 1 Kings 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: ml
  text: എന്നാൽ ഗിലെയാദ്യനായ ബർസില്ലായിയുടെ പുത്രന്മാരോട് വിശ്വസ്തമായ ദയ കാണിക്കുക[a]. അവർ നിന്റെ മേശയിൽനിന്ന് ഭക്ഷിക്കുന്നവരുടെ കൂട്ടത്തിൽ ഉണ്ടായിരിക്കട്ടെ[b]. കാരണം, നിന്റെ സഹോദരനായ അബ്ശാലോമിൽനിന്ന് ഞാൻ ഓടിപ്പോയപ്പോൾ അവർ ഇങ്ങനെയാണ് എന്റെ അടുക്കൽ വന്നത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബർസില്ലായിയുടെ പുത്രന്മാരോട് വിശ്വസ്തതയോടെ പെരുമാറുക.’ ‘ദയ കാണിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപ്രയോഗം വെറും വികാരമല്ല, വിശ്വസ്തതയോടെ ചെയ്യുന്ന നന്മയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ നിന്റെ മേശയുടെ ഭക്ഷകരുടെ കൂട്ടത്തിൽ ഉണ്ടായിരിക്കട്ടെ.’ രാജാവിന്റെ തുടർച്ചയായ പരിപാലനവും പ്രീതിയും ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘അവർ എന്റെ അടുക്കൽ വന്നു’ / ‘അവർ എന്നോടൊപ്പം നിന്നു.’ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘അടുത്തുവന്നു’ എന്നാണ്; ഇവിടെ ദാവീദിന്റെ പലയാനസമയത്ത് അവർ നൽകിയ പിന്തുണയും അത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: എന്നാൽ ... പുത്രന്മാരോട്
  rationale: മുൻ നിർദേശത്തോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം സൂചിപ്പിക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നു നൽകി. בְנֵי എന്നത് ഇവിടെ ബർസില്ലായിയുടെ പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: ഗിലെയാദ്യനായ ബർസില്ലായി
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; പ്രദേശബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: വിശ്വസ്തമായ ദയ കാണിക്കുക
  rationale: עשה חסד എന്ന പ്രയോഗത്തിലെ പ്രവർത്തനാത്മകമായ ദയയും חֶסֶד എന്ന പദത്തിലെ വിശ്വസ്തതയുടെ ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു; പ്രത്യേക ഉടമ്പടി സാങ്കേതികപദം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: וְהָיוּ
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: നിർദേശപരമായ സന്ദർഭത്തിൽ ഇതിന്റെ ആജ്ഞാസൂചക/അനുവാദസൂചക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: നിന്റെ മേശയിൽനിന്ന് ഭക്ഷിക്കുന്നവരുടെ കൂട്ടത്തിൽ
  rationale: എബ്രായ പങ്കാളിത്തപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുകയും സ്ഥിരമായ രാജകീയ പരിപാലനത്തിന്റെയും അനുഗ്രഹത്തിന്റെയും ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי כֵן
  choice: കാരണം ... ഇങ്ങനെയാണ്
  rationale: כִּי യുടെ കാരണസൂചക ശക്തിയും כֵן എന്നതിലെ രീതിസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָרְבוּ אֵלַי
  choice: അവർ ... എന്റെ അടുക്കൽ വന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർത്ഥമായ ‘അടുത്തുവരുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അതു പിന്തുണയ്ക്കാനെത്തിയതിനെ സൂചിപ്പിക്കാമെങ്കിലും മുഖ്യവാചകത്തിൽ ആ വ്യാഖ്യാനം നിർബന്ധമാക്കുന്നില്ല.
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: ഞാൻ ... നിന്നു ഓടിപ്പോയപ്പോൾ
  rationale: ഇൻഫിനിറ്റീവ് ഘടനയുടെ കാലസൂചനയും പലയാനസന്ദർഭത്തിലെ മִפְּנֵי യുടെ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: നിന്റെ സഹോദരനായ അബ്ശാലോം
  rationale: പേര് ലിപ്യന്തരിച്ചു; ശലോമോനുമായുള്ള കുടുംബബന്ധം മൂലപാഠംപോലെ വ്യക്തമായി നിലനിർത്തി.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിന്റെ അർത്ഥപരിധി
  choice: വിശ്വസ്തമായ ദയ
  alternative: ഉടമ്പടിവിശ്വസ്തത / ദയ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രത്യുപകാരപരമായ വിശ്വസ്തതയും കരുണാപൂർവമായ പ്രവൃത്തിയും രണ്ടും പ്രസക്തമാണ്. എന്നാൽ ഉടമ്പടി എന്ന ആശയം പാഠത്തിൽ വ്യക്തമായി പറയാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: קָרְבוּ אֵלַי എന്നതിലെ പിന്തുണയുടെ സൂചന
  choice: എന്റെ അടുക്കൽ വന്നു
  alternative: എന്നെ പിന്തുണച്ചു / എന്റെ സഹായത്തിനെത്തി
  rationale: ചരിത്രസന്ദർഭം സഹായത്തെയും പിന്തുണയെയും സൂചിപ്പിക്കുന്നു; എങ്കിലും എബ്രായക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം ‘അടുത്തുവരുക’ എന്നതിനാൽ വ്യാഖ്യാനപരമായ വിപുലീകരണം അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രാജകീയ മേശ എന്ന ദൃശ്യപ്രയോഗവും ‘അടുക്കൽ വന്നു’ എന്ന മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തിയും സംരക്ഷിച്ചു. പേരുകൾ മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
