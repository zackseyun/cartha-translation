id: 1KI.2.41
reference: 1 Kings 2:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: ml
  text: ശിമെയി യെരൂശലേമിൽനിന്ന് ഗത്തിലേക്കു പോയി മടങ്ങിവന്നതായി ശലോമോനു വിവരം ലഭിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: വിവരം ലഭിച്ചു
  rationale: ആരാണ് അറിയിച്ചതെന്നു വ്യക്തമാക്കാതെ, വിവരം ശലോമോനെ അറിയിച്ചുവെന്ന ഹീബ്രു നിഷ്ക്രിയപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോനു
  rationale: ל എന്ന ഉപസർഗം റിപ്പോർട്ട് ലഭിക്കുന്ന പരോക്ഷകർമത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: തായി
  rationale: അറിയിക്കപ്പെട്ട വിവരത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പരോക്ഷവാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָלַךְ
  choice: പോയി
  rationale: הלך എന്നത് പോകുക അഥവാ യാത്രചെയ്യുക എന്നർഥം നൽകുന്നു; തുടർന്നുള്ള മടങ്ങിവരവിനോടു ചേർന്ന പൂർത്തിയായ പ്രവൃത്തിയായി ഇവിടെ വിവർത്തനം ചെയ്തു.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: വ്യക്തിനാമം മൂലഭാഷയിലെ രൂപത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִירוּשָׁלִַם
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: מִן ഉപസർഗം യെരൂശലേമിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: גַּת
  choice: ഗത്തിലേക്കു
  rationale: പ്രത്യേക ഉപസർഗമില്ലെങ്കിലും സ്ഥലനാമം הלך എന്ന ക്രിയയുടെ ലക്ഷ്യസ്ഥാനമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ദിശാസൂചകം ആവശ്യമാണ്.
- source_word: וַיָּשֹׁב
  choice: മടങ്ങിവന്നതായി
  rationale: שׁוב മടങ്ങുക എന്ന പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; റിപ്പോർട്ടിന്റെ ഉള്ളടക്കത്തിനുള്ളിൽ മുൻപ്രവൃത്തിയോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ കർത്താവിനെ വ്യക്തമാക്കാത്ത നിഷ്ക്രിയപ്രയോഗം മലയാളത്തിൽ ‘വിവരം ലഭിച്ചു’ എന്നു നൽകി; അനാവശ്യമായി ഒരു ദൂതനെയോ റിപ്പോർട്ടറെയോ ചേർത്തിട്ടില്ല.
