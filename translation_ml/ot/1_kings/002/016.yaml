  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തി അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
