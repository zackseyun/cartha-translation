  text: וְ/עַתָּ֗ה שְׁאֵלָ֤ה אַחַת֙ אָֽנֹכִי֙ שֹׁאֵ֣ל מֵֽ/אִתָּ֔/ךְ אַל תָּשִׁ֖בִי אֶת פָּנָ֑/י וַ/תֹּ֥אמֶר אֵלָ֖י/ו דַּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: ml
  text: ഇപ്പോൾ, ഞാൻ നിന്നോട് ഒരു അപേക്ഷ ഉന്നയിക്കുന്നു; എന്നെ നിരസിക്കരുത്[a]. അവൾ അവനോട്, “പറയൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായഭാഷയിലെ പ്രയോഗം: അക്ഷരാർഥം, “എന്റെ മുഖം തിരിച്ചു അയക്കരുത്”; അർഥം, “എന്നെ നിരസിക്കരുത്” അഥവാ “എന്റെ അപേക്ഷ തള്ളിക്കളയരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിലെ അടുത്ത നീക്കത്തെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം; മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമായി അതിന്റെ കാലപരവും സന്ദർഭപരവുമായ ശക്തി നൽകുന്നു.
- source_word: שְׁאֵלָה אַחַת
  choice: ഒരു അപേക്ഷ
  rationale: שְׁאֵלָה എന്നത് ഇവിടെ അപേക്ഷയെയോ അഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു; אַחַת എന്ന എണ്ണത്തെ ‘ഒരു’ എന്നു നിലനിർത്തുന്നു.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: ഞാൻ നിന്നോട് … ഉന്നയിക്കുന്നു
  rationale: സ്വതന്ത്ര സർവനാമവും കർത്തൃവാചക ക്രിയാരൂപവും അപേക്ഷയുടെ നേരിട്ടുള്ള, ഇപ്പോഴത്തെ സ്വഭാവം ഊന്നുന്നു; ‘അപേക്ഷ ഉന്നയിക്കുന്നു’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: എന്റെ മുഖം തിരിച്ചുകളയരുത്
  rationale: അപേക്ഷകനെ നിരസിക്കരുത് എന്നർഥമുള്ള എബ്രായ ദൃശ്യപ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: അവൾ അവനോട് … എന്നു പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനക്രമം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: דַּבֵּר
  choice: പറയൂ
  rationale: അപേക്ഷ എന്താണെന്ന് പറയാൻ ക്ഷണിക്കുന്ന ഏകവചന ആജ്ഞ; ‘പറയൂ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
