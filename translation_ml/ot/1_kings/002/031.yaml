  naturalness: “അവൻ പറഞ്ഞതുപോലെ ചെയ്യുക; അവനെ വധിച്ച് അടക്കം ചെയ്യുക” ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. “എന്റെ പിതാവിന്റെ ഭവനത്തിൽനിന്നും” എന്നത് ‘പിതൃഭവനം’ എന്നതിനെക്കാൾ തെളിമയോടെ കുടുംബ/വംശഭാവം നിലനിർത്തുന്നു.
