  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് അവനോടു പറഞ്ഞു: “അവൻ പറഞ്ഞതുപോലെ ചെയ്യുക; അവനെ വധിച്ച്[a] അടക്കം ചെയ്യുക. അങ്ങനെ യോവാബ് ചൊരിഞ്ഞ നിരപരാധികളുടെ രക്തം[b] എന്നിൽനിന്നും എന്റെ പിതാവിന്റെ ഭവനത്തിൽനിന്നും നീക്കിക്കളയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെമേൽ പതിക്കുക”; ഈ സന്ദർഭത്തിൽ അവനെ വധിക്കുക എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “നിരപരാധികളുടെ രക്തം” ന്യായമായ കാരണമില്ലാതെ ചൊരിയപ്പെട്ട രക്തത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിയമ-ധാർമിക പ്രയോഗമാണ്; അത്തരം രക്തച്ചൊരിച്ചിലിൽനിന്നുള്ള രക്തപാതകക്കുറ്റവും ഇതിൽ ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: അവൻ പറഞ്ഞതുപോലെ ചെയ്യുക
  rationale: മുമ്പ് പറഞ്ഞ വാക്കനുസരിച്ച് പ്രവർത്തിക്കാനുള്ള നേരിട്ടുള്ള കല്പന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וּפְגַע בּוֹ
  choice: അവനെ വധിച്ച്
  rationale: פגע ב എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ആക്രമിച്ച് കൊല്ലുക, അഥവാ വധശിക്ഷ നടപ്പാക്കുക, എന്നാണ്; അക്ഷരാർഥം അസ്വാഭാവികമായതിനാൽ സന്ദർഭാർഥം നൽകി.
- source_word: וּקְבַרְתּוֹ
  choice: അടക്കം ചെയ്യുക
  rationale: മരണത്തിനു പിന്നാലെയുള്ള സംസ്കാരകല്പന ലളിതമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: וַהֲסִירֹתָ
  choice: അങ്ങനെ ... നീക്കിക്കളയുക
  rationale: മുൻ കല്പനകളുടെ ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കാവുന്ന ഹീബ്രു രൂപം നിലനിർത്തുന്നതിനൊപ്പം കല്പനയുടെ നേരിട്ടുള്ള ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: דְּמֵי חִנָּם
  choice: നിരപരാധരക്തത്തിന്റെ കുറ്റം
  rationale: അന്യായമായി ചൊരിയപ്പെട്ട രക്തവും അതിൽനിന്നുണ്ടാകുന്ന രക്തപാതകക്കുറ്റവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന നിയമ-ധാർമിക പ്രയോഗത്തിന്റെ ഭാരം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: എന്നിൽനിന്നും എന്റെ പിതൃഭവനത്തിൽനിന്നും
  rationale: വ്യക്തിയുടെയും രാജവംശത്തിന്റെയും മേൽ നിലനിൽക്കുന്ന കുറ്റബാധ്യത നീങ്ങുന്നതെന്ന രൂപകം സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: നിരപരാധരക്തവും രാജഭവനത്തിന്മേലുള്ള കുറ്റബാധ്യതയും
  choice: “നിരപരാധരക്തത്തിന്റെ കുറ്റം ... നീക്കിക്കളയുക”
  alternative: “നിരപരാധരക്തം ... നീക്കിക്കളയുക”
  rationale: ഹീബ്രു വാചകം രക്തത്തെക്കുറിച്ച് മൂർത്തമായി പറയുമ്പോഴും, അത് സോളമോന്റെയും പിതൃഭവനത്തിന്റെയും മേൽ വന്നുനിൽക്കുന്ന കുറ്റബാധ്യതയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘കുറ്റം’ ചേർത്തു; എന്നാൽ പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതൃഭവനം’ വ്യക്തിയുടെ പിതാവിന്റെ കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിട്ടുണ്ട്.
