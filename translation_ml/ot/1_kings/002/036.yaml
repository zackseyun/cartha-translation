  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הַ/מֶּ֨לֶךְ֙ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֔י וַ/יֹּ֣אמֶר ל֗/וֹ בְּֽנֵה לְ/ךָ֥ בַ֨יִת֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/יָשַׁבְתָּ֖ שָׁ֑ם וְ/לֹֽא תֵצֵ֥א מִ/שָּׁ֖ם אָ֥נֶה וָ/אָֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ആളയച്ച് ശിമെയിയെ വിളിപ്പിച്ചു. അവനോട് പറഞ്ഞു: “നീ യെരൂശലേമിൽ നിനക്കായി ഒരു വീട് പണിത് അവിടെ താമസിക്കണം. അവിടെനിന്ന് എങ്ങോട്ടും പോകരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ഇങ്ങോട്ടോ അങ്ങോട്ടോ” എന്നാണ്; അതായത്, “എങ്ങോട്ടും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: രാജാവ് ആളയച്ച് ശിമെയിയെ വിളിപ്പിച്ചു
  rationale: 'രണ്ട് എബ്രായ ക്രിയകളുടെയും ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു: രാജാവ് ആളെ അയയ്ക്കുകയും അതുവഴി ശിമെയിയെ രാജസന്നിധിയിലേക്കു വിളിപ്പിക്കുകയും ചെയ്തു.'
- source_word: בְּנֵה לְךָ בַיִת
  choice: നീ ... നിനക്കായി ഒരു വീട് പണിത്
  rationale: നേരിട്ടുള്ള കല്പനയും לְךָ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പ്രയോജനവും നിലനിർത്തുന്നു; בַיִת എന്നത് ഇവിടെ താമസിക്കാനുള്ള ഭൗതിക വീടാണ്.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപവും സ്ഥാനസൂചകപ്രയോഗവും.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: അവിടെ താമസിക്കണം
  rationale: ישׁב ഇവിടെ തുടർച്ചയായ വാസത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: അവിടെനിന്ന് ... പോകരുത്
  rationale: പുറപ്പെടുകയോ സ്ഥലം വിട്ടുപോകുകയോ ചെയ്യരുതെന്ന നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָנֶה וָאָנָה
  choice: എങ്ങോട്ടും
  rationale: ‘ഇങ്ങോട്ടോ അങ്ങോട്ടോ’ എന്ന വിതരണാർഥമുള്ള എബ്രായ പ്രയോഗം ഈ നിരോധനസന്ദർഭത്തിൽ ‘എങ്ങോട്ടും’ എന്ന് സ്വാഭാവികമായി അർഥമാക്കുന്നു.
