translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. രാജകീയ കല്പനയുടെ ഉറപ്പ് ‘താമസിക്കണം’, ‘പോകരുത്’ എന്നീ രൂപങ്ങളിലൂടെ പ്രകടമാക്കി; അനാവശ്യമായ പുരാതനപദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
