  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר יֻתַּ֖ן אֶת אֲבִישַׁ֣ג הַ/שֻּׁנַמִּ֑ית לַ/אֲדֹנִיָּ֥הוּ אָחִ֖י/ךָ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ശൂനേംകാരിയായ അബീശഗിനെ നിന്റെ സഹോദരനായ അദോനീയാവിന് ഭാര്യയായി നൽകട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അവൾ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ പ്രവാഹം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെയുള്ള ഈ രൂപം സ്വാഭാവികമായി ആ പ്രവാഹം നിലനിർത്തുന്നു.
- source_word: יֻתַּן
  choice: നൽകട്ടെ
  rationale: നിഷ്ക്രിയ ജുസ്സീവ് ഒരു അഭ്യർഥനയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘നൽകട്ടെ’ അതിന്റെ ഇച്ഛാർത്ഥഭാവം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת אֲבִישַׁג
  choice: അബീശഗിനെ
  rationale: אֶת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ കർമവിഭക്തിയിലൂടെ അതു പ്രകടമാക്കുന്നു. വ്യക്തിനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: הַשֻּׁנַמִּית
  choice: ശൂനേംകാരിയായ
  rationale: ഈ ദേശനാമവിശേഷണം അബീശഗിന്റെ സ്വദേശം സൂചിപ്പിക്കുന്നു; ‘ശൂനേംകാരിയായ’ ആ തിരിച്ചറിയൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַאֲדֹנִיָּהוּ
  choice: അദോനീയാവിന്
  rationale: ל സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി അതിനെ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: אָחִיךָ
  choice: അങ്ങയുടെ സഹോദരനായ
  rationale: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയം ശലോമോനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു; രാജാവിനോടുള്ള സംഭാഷണത്തിന് യോജിച്ച ആദരസൂചകമായ ‘അങ്ങയുടെ’ ബന്ധവും അഭിസംബോധനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: לְאִשָּׁה
  choice: ഭാര്യയായി
  rationale: വിവാഹസന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്ത്രീയെ വിവാഹത്തിനായി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഭാര്യയായി’ ഔപചാരികമായ വിവാഹബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജാവായ ശലോമോനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു; മൂലത്തിലെ അഭ്യർഥനാഭാവവും വാക്യത്തിന്റെ സംക്ഷിപ്തതയും സംരക്ഷിച്ചു.
