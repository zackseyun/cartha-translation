  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് യെഹോയാദയുടെ മകനായ ബെനായാവിനോടു കൽപ്പിച്ചു; അവൻ പുറത്തേക്കു പോയി അവനെ പ്രഹരിച്ചു, അവൻ മരിച്ചു. അങ്ങനെ രാജ്യം ശലോമോന്റെ കൈയിൽ ഉറപ്പിക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജ്യം ശലോമോന്റെ ഭരണത്തിൻകീഴിൽ ഉറപ്പിക്കപ്പെട്ടു.” “ശലോമോന്റെ കൈയിൽ” എന്ന ഹീബ്രായ പ്രയോഗം അവന്റെ നിയന്ത്രണത്തെയോ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് ... കല്പിച്ചു
  rationale: צוה എന്നത് അധികാരപൂർവമായ കല്പനയെ സൂചിപ്പിക്കുന്നു. തുടർച്ചയായ ആഖ്യാനത്തിന് സ്വാഭാവികമായ മലയാളമായി ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: ഹീബ്രായ നാമങ്ങൾ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾരൂപത്തോടടുത്ത് ലിപ്യന്തരിച്ചു; construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: וַיֵּצֵא
  choice: അവൻ പുറപ്പെട്ടുചെന്ന്
  rationale: יצאയുടെ ‘പുറപ്പെടുക’ എന്ന അടിസ്ഥാനാർഥവും തുടർന്നുള്ള പ്രവൃത്തിയിലേക്കുള്ള നീക്കവും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּפְגַּע־בּוֹ
  choice: ശിമെയിയെ വെട്ടിവീഴ്ത്തി
  rationale: ഈ വധശിക്ഷാസന്ദർഭത്തിൽ פגע ב־ മാരകമായി പ്രഹരിക്കുക എന്ന അർഥത്തിലാണ്. ‘വെട്ടിവീഴ്ത്തി’ അക്രമപ്രവൃത്തി വ്യക്തമാക്കുകയും പിന്നാലെയുള്ള ‘മരിച്ചു’ എന്ന ഫലവാക്യത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു. സർവനാമത്തിന്റെ ലക്ഷ്യം മുൻസന്ദർഭത്തിലെ ശിമെയിയാണെന്ന് വായനാസൗകര്യത്തിന് വ്യക്തമാക്കി.
- source_word: וַיָּמֹת
  choice: അങ്ങനെ അവൻ മരിച്ചു
  rationale: מותയുടെ ഫലം പ്രത്യേകം നിലനിർത്തുന്നു; മലയാളത്തിൽ പ്രവൃത്തിയും ഫലവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അങ്ങനെ’ ചേർത്തു.
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: അങ്ങനെ രാജ്യം ... ഉറച്ചുനിന്നു
  rationale: כון നിഫാൽ രൂപത്തിലെ സ്ഥാപിതമാകുക, ഉറപ്പുപ്രാപിക്കുക എന്ന ഭാവം ‘ഉറച്ചുനിന്നു’ സ്വാഭാവികമായി നൽകുന്നു; വാക്യത്തിന്റെ പരിണാമസൂചനയും സംരക്ഷിച്ചു.
- source_word: בְּיַד שְׁלֹמֹה
  choice: ശലോമോന്റെ കൈയിൽ
  rationale: നിയന്ത്രണമോ അധികാരമോ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ‘കൈയിൽ’ എന്ന രൂപകം നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
