  naturalness: ‘യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ മുറുകെപ്പിടിച്ചു’ എന്നതിനു പകരം ‘യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിമുറുക്കി’ സ്വാഭാവികമായ ആഖ്യാനമലയാളമാണ്. ഇതു കൊമ്പുകളിൽ പിടിച്ച് അഭയം തേടുന്ന ദൃശ്യത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
