id: 1KI.2.28
reference: 1 Kings 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: ml
  text: ആ വാർത്ത യോവാബിന്റെ അടുക്കൽ എത്തി. യോവാബ് അദോനീയാവിന്റെ പിന്നാലെ തിരിഞ്ഞിരുന്നു—അബ്ശാലോമിന്റെ പിന്നാലെയാകട്ടെ തിരിഞ്ഞിരുന്നില്ല[a]. അതുകൊണ്ട് യോവാബ് യഹ്‌വെയുടെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയി യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ[b] പിടിമുറുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അദോനീയാവിന്റെ പക്ഷം ചേർന്നിരുന്നു; എന്നാൽ അബ്ശാലോമിന്റെ പക്ഷം ചേർന്നിരുന്നില്ല.’ എബ്രായയിൽ അക്ഷരാർഥം ‘പിന്നാലെ തിരിഞ്ഞിരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘കൊമ്പുകൾ’ യാഗപീഠത്തിന്റെ നാലു കോണുകളിലുമുണ്ടായിരുന്ന കൊമ്പിന്റെ ആകൃതിയിലുള്ള തള്ളിനിൽക്കുന്ന ഭാഗങ്ങളായിരുന്നു. അവയിൽ പിടിക്കുന്നത് അഭയത്തിനോ കരുണയ്ക്കോ വേണ്ടിയുള്ള അപേക്ഷയെ സൂചിപ്പിച്ചു.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: ആ വാർത്ത
  rationale: ഇവിടെ ഈ പദം യോവാബിന്റെ അടുക്കൽ എത്തിയ വിവരം അഥവാ വാർത്തയെ സൂചിപ്പിക്കുന്നു. ‘കിംവദന്തി’ എന്നതിലടങ്ങുന്ന അനിശ്ചിതത്വം മൂലപാഠം നിർബന്ധിക്കുന്നില്ല.
- source_word: בָּאָה עַד יוֹאָב
  choice: യോവാബിന്റെ അടുക്കൽ എത്തി
  rationale: ‘ഒരാളുടെ അടുക്കൽവരെ വന്നു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ചലനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָטָה אַחֲרֵי
  choice: പിന്നാലെ തിരിഞ്ഞിരുന്നു
  rationale: രാഷ്ട്രീയ പക്ഷചേരലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം അദോനീയാവിനെയും അബ്ശാലോമിനെയും കുറിച്ചുള്ള രണ്ടു വാക്യഭാഗങ്ങളിലും ഒരേ രീതിയിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പക്ഷം ചേർന്നു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּנָס
  choice: ഓടിപ്പോയി
  rationale: അപകടത്തിൽനിന്ന് അഭയം തേടി പെട്ടെന്ന് പോകുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആഖ്യാനമലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֹהֶל יְהוָה
  choice: യഹ്‌വെയുടെ കൂടാരം
  rationale: ‘യഹ്‌വെയുടെ കൂടാരം’ എന്ന മൂലപാഠത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തുന്നു; ‘സമാഗമകൂടാരം’ പോലുള്ള കൂടുതൽ സാങ്കേതിക തിരിച്ചറിയൽ പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ മുറുകെപ്പിടിച്ചു
  rationale: ആരാധനാസംബന്ധമായ ദൃശ്യപ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു; അതിന്റെ സാംസ്കാരിക പ്രസക്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: נָטָה אַחֲרֵי എന്ന രാഷ്ട്രീയ പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തണമോ വ്യാഖ്യാനിച്ച് നൽകണമോ
  choice: പിന്നാലെ തിരിഞ്ഞിരുന്നു
  alternative: പക്ഷം ചേർന്നിരുന്നു; പിന്തുടർന്നിരുന്നു
  rationale: അദോനീയാവിനെയും അബ്ശാലോമിനെയും കുറിച്ച് ആവർത്തിക്കുന്ന ഒരേ എബ്രായ പ്രയോഗം അതേ രൂപകത്തോടെ നൽകുന്നത് പാഠത്തിന്റെ ആവർത്തനവും രാഷ്ട്രീയ സൂചനയിലെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പിന്നാലെ തിരിയുക’ എന്ന അല്പം അസാധാരണമായ രൂപകം മൂലപാഠത്തിന്റെ ആവർത്തനം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; അതിന്റെ സാഹചര്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘യാഗപീഠം’, ‘കൂടാരം’ എന്നീ സാധാരണ ബൈബിൾ പദങ്ങൾ സാങ്കേതികത അധികരിക്കാതെ ഉപയോഗിച്ചു.
