  to: ആ വാർത്ത യോവാബിന്റെ അടുക്കൽ എത്തി. യോവാബ് അദോനീയാവിന്റെ പിന്നാലെ തിരിഞ്ഞിരുന്നു—അബ്ശാലോമിന്റെ പിന്നാലെയാകട്ടെ തിരിഞ്ഞിരുന്നില്ല[a]. അതുകൊണ്ട് യോവാബ് യഹ്‌വെയുടെ കൂടാരത്തിലേക്ക് ഓടിപ്പോയി യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ[b] പിടിമുറുക്കി.
  rationale: യാഗപീഠത്തിന്റെ കൊമ്പുകൾ പിടിക്കുന്ന പ്രവൃത്തിയെ കൂടുതൽ വ്യാകരണസമ്പൂർണവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ആക്കുന്നതിനായി മാത്രം ചെറു ശൈലിപരിഷ്കാരം വരുത്തി. അർഥം, മൂലത്തിലെ ആവർത്തനം, ദൈവനാമം, അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കം എന്നിവ മാറ്റിയിട്ടില്ല.
