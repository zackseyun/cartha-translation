source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר שְׁאֵלָ֨ה אַחַ֤ת קְטַנָּה֙ אָֽנֹכִי֙ שֹׁאֶ֣לֶת מֵֽ/אִתָּ֔/ךְ אַל תָּ֖שֶׁב אֶת פָּנָ֑/י וַ/יֹּֽאמֶר לָ֤/הּ הַ/מֶּ֨לֶךְ֙ שַׁאֲלִ֣י אִמִּ֔/י כִּ֥י לֹֽא אָשִׁ֖יב אֶת פָּנָֽיִ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ഞാൻ അങ്ങയോടു ഒരു ചെറിയ കാര്യം ചോദിക്കുന്നു; എന്നെ നിരസിക്കരുതേ.” രാജാവ് അവളോടു പറഞ്ഞു: “അമ്മേ, ചോദിച്ചുകൊള്ളൂ; ഞാൻ അമ്മയെ നിരസിക്കുകയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: ഒരു ചെറിയ അപേക്ഷ
  rationale: ‘ഒരു ചെറുതായ അപേക്ഷ’ എന്ന ആശയം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; אַחַת എന്നതിലെ ഏകത്വവും ‘ഒരു’ വഴി നിലനിർത്തുന്നു.
- source_word: שֹׁאֶלֶת מֵאִתָּךְ
  choice: അങ്ങയോട് ... ചോദിക്കുകയാണ്
  rationale: സ്ത്രീലിംഗ വർത്തമാന കൃദ്‌രൂപത്തിന്റെ തുടരുന്ന അഭ്യർഥനാഭാവം നിലനിർത്തുകയും രാജാവിനോടുള്ള ആദരസൂചകമായ ‘അങ്ങ്’ പ്രയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: אַל תָּשֶׁב אֶת פָּנָי
  choice: എന്റെ മുഖം തിരിച്ചുകളയരുതേ
  rationale: ഹീബ്രായയിലെ മുഖം തിരിച്ചുകളയുക എന്ന ദൃശ്യരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു; വെറും ‘നിരസിക്കരുത്’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: שַׁאֲלִי אִמִּי
  choice: എന്റെ അമ്മേ, ചോദിച്ചുകൊള്ളുക
  rationale: ആജ്ഞാരൂപവും സ്നേഹാദരമുള്ള അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: ഞാൻ അമ്മയുടെ മുഖം തിരിച്ചുകളയുകയില്ല
  rationale: ആദ്യവാക്യത്തിലെ രൂപകവുമായി സമാന്തരത സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാംപുരുഷ ആദരസർവനാമത്തിനു പകരം ‘അമ്മയുടെ’ എന്നു ആവർത്തിക്കുന്നു.
