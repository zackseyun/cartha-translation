translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ഹീബ്രായയിലെ ‘മുഖം തിരിച്ചുകളയുക’ എന്ന ആവർത്തിത പ്രയോഗം വ്യാഖ്യാനപരമായി ‘അപേക്ഷ നിരസിക്കുക’ എന്നു മാറ്റാതെ സൂക്ഷിച്ചിരിക്കുന്നു.
