  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: ml
  text: ഇപ്പോൾ, എന്നെ സ്ഥിരപ്പെടുത്തുകയും എന്റെ പിതാവായ ദാവീദിന്റെ സിംഹാസനത്തിൽ എന്നെ ഇരുത്തുകയും താൻ അരുളിച്ചെയ്തതുപോലെ എനിക്കൊരു ഭവനം[a] ഉണ്ടാക്കുകയും ചെയ്ത യഹോവ ജീവനോടെയിരിക്കുന്നതുപോലെ, അദോനിയാവ് ഇന്ന് വധിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എനിക്കായി ഒരു രാജവംശം സ്ഥാപിച്ചു.’ ഇവിടെ ‘ഭവനം’ എന്ന എബ്രായപദം ഒരു കെട്ടിടത്തെക്കാൾ, നിലനിൽക്കുന്ന രാജകുടുംബപരമ്പരയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: ജീവനുള്ള യഹോവയാണ
  rationale: യഹോവയുടെ ജീവനുള്ള യാഥാർഥ്യത്തെ സാക്ഷിയാക്കി ചെയ്യുന്ന എബ്രായ ശപഥസൂത്രത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: הֱכִינַנִי
  choice: എന്നെ ഉറപ്പിക്കുകയും
  rationale: כון എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള ‘സ്ഥിരപ്പെടുത്തുക, ഉറപ്പിക്കുക’ എന്ന രാജകീയസന്ദർഭത്തിലെ അർഥം നൽകുന്നു.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: സിംഹാസനത്തിൽ എന്നെ ഇരുത്തുകയും
  rationale: രാജസ്ഥാനാരോഹണം സൂചിപ്പിക്കുന്ന causative അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: എന്റെ പിതാവായ ദാവീദിന്റെ സിംഹാസനം
  rationale: എബ്രായ ബന്ധഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עָשָׂה לִי בַּיִת
  choice: എനിക്കൊരു ഭവനം ഉണ്ടാക്കുകയും
  rationale: മൂലത്തിലെ ‘ഭവനം’ എന്ന പ്രതീകം നിലനിർത്തി ദാവീദീയ വാഗ്ദാനവുമായുള്ള പദബന്ധം സംരക്ഷിക്കുന്നു; രാജവംശം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: താൻ അരുളിച്ചെയ്തതുപോലെ
  rationale: ദൈവത്തിന്റെ മുൻപ്രസ്താവനയെയോ വാഗ്ദാനത്തെയോ സൂചിപ്പിക്കുന്ന സന്ദർഭബലം മാന്യമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്നു വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: כִּי
  choice: ശപഥവാക്യത്തിന്റെ ഉറപ്പിലൂടെ പ്രകടിപ്പിക്കുന്നു
  rationale: പ്രത്യേക പദമായി കൃത്രിമമായി ചേർക്കാതെ, ‘ജീവനുള്ള യഹോവയാണ ... വധിക്കപ്പെടും’ എന്ന മലയാള ശപഥഘടനയിൽ ഊന്നൽ ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: יוּמַת
  choice: വധിക്കപ്പെടും
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപത്തിലുള്ള causative-passive അർഥം—മറ്റൊരാളാൽ മരണശിക്ഷയ്ക്ക് വിധേയനാക്കപ്പെടുക—വ്യക്തമായി നൽകുന്നു.
- source_word: אֲדֹנִיָּהוּ
  choice: അദോനിയാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: രാജകീയ ഉടമ്പടിഭാഷയിലെ בַּיִת (‘ഭവനം’) എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘ഭവനം’ നിലനിർത്തുകയും രാജവംശപരമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
  alternative: ‘രാജവംശം’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: ഇവിടെ ‘ഭവനം’ ദീർഘകാലം നിലനിൽക്കുന്ന രാജകുടുംബപരമ്പരയെ സൂചിപ്പിക്കാനുള്ള ശക്തമായ സാധ്യതയുണ്ട്. എങ്കിലും മൂലപദത്തിന്റെ പ്രതീകവും ദാവീദീയ വാഗ്ദാനവുമായുള്ള അന്തർപാഠബന്ധവും സംരക്ഷിക്കാനും യഥാർഥമായ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കാനും പ്രധാനവാക്യത്തിൽ ‘ഭവനം’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള രാജകീയ ശപഥശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്തത്’ ദൈവവചനസന്ദർഭത്തിന് യോജിച്ച മാന്യത നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കി.
