  terminology: '''യഹോവ,'' ''ദാവീദ്,'' ''സിംഹാസനം,'' ''ഭവനം,'' and ''അദോനിയാവ്'' are appropriate. Retaining ''ഭവനം'' preserves the Hebrew lexical image, while the footnote properly identifies its likely dynastic sense.'
