  to: യാഹ്‌വേ അവന്റെ രക്തം അവന്റെ സ്വന്തം തലമേൽ തിരികെ വരുത്തും[a]. കാരണം, അവനെക്കാൾ നീതിമാന്മാരും നല്ലവരുമായ രണ്ടു പുരുഷന്മാരെ അവൻ ആക്രമിച്ച് വാൾകൊണ്ട് കൊന്നു; എന്റെ പിതാവായ ദാവീദ് അറിയാതെയാണ് അവൻ യിസ്രായേൽ സൈന്യാധിപനായ നേരിന്റെ മകൻ അബ്നേരെയും യെഹൂദാ സൈന്യാധിപനായ യേഥെരിന്റെ മകൻ അമാസായെയും കൊന്നത്.
  rationale: The revision aligns the divine-name rendering with the POB audit trail, keeps the Hebrew blood-on-head idiom with an explanatory alternative, and joins the named victims to the clause about David’s lack of knowledge. No doctrinal interpretation beyond the idiom’s evident sense of culpability and requital has been introduced.
