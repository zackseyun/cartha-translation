id: 1KI.2.32
reference: 1 Kings 2:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: ml
  text: യാഹ്‌വേ അവന്റെ രക്തം അവന്റെ സ്വന്തം തലമേൽ തിരികെ വരുത്തും[a]. കാരണം, അവനെക്കാൾ നീതിമാന്മാരും നല്ലവരുമായ രണ്ടു പുരുഷന്മാരെ അവൻ ആക്രമിച്ച് വാൾകൊണ്ട് കൊന്നു; എന്റെ പിതാവായ ദാവീദ് അറിയാതെയാണ് അവൻ യിസ്രായേൽ സൈന്യാധിപനായ നേരിന്റെ മകൻ അബ്നേരെയും യെഹൂദാ സൈന്യാധിപനായ യേഥെരിന്റെ മകൻ അമാസായെയും കൊന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ രക്തച്ചൊരിച്ചിലിന്റെ കുറ്റം അവന്റെ തലമേൽ വരുത്തും.” രക്തച്ചൊരിച്ചിലിന്റെ ഉത്തരവാദിത്വവും അതിനുള്ള ശിക്ഷയും കുറ്റക്കാരന്റെ മേൽതന്നെ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: തിരികെ വരുത്തും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ചെയ്ത രക്തച്ചൊരിച്ചിലിന്റെ ഉത്തരവാദിത്വവും അതിനുള്ള പ്രതിഫലവും കുറ്റവാളിയിലേക്കുതന്നെ മടക്കിവരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: അവന്റെ രക്തം അവന്റെ സ്വന്തം തലമേൽ
  rationale: രക്തച്ചൊരിച്ചിലിന്റെ കുറ്റവും ഉത്തരവാദിത്വവും കുറ്റവാളിയുടെ മേൽതന്നെ വരുന്നു എന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു. ‘സ്വന്തം’ എന്നത് പ്രത്യാവർത്തക ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: פָּגַע
  choice: ആക്രമിച്ച്
  rationale: ഈ അക്രമസന്ദർഭത്തിൽ ക്രിയ ശത്രുതാപൂർവം നേരിടുകയോ ആക്രമിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘കൊന്നു’ എന്ന ക്രിയയിൽ നിന്ന് അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: അവനെക്കാൾ നീതിമാന്മാരും നല്ലവരുമായ
  rationale: ധാർമികവും നിയമപരവുമായ താരതമ്യം സൂചിപ്പിക്കുന്ന ‘നീതിമാന്മാർ’ എന്നും പൊതുവായ മൂല്യനിർണയം സൂചിപ്പിക്കുന്ന ‘നല്ലവർ’ എന്നും രണ്ടു വിശേഷണങ്ങളും വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: വാൾകൊണ്ട് കൊന്നു
  rationale: കൊലയും അതിന്റെ ഉപകരണവും നേരിട്ടും വ്യക്തമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: എന്റെ അപ്പനായ ദാവീദ് അത് അറിഞ്ഞിരുന്നില്ല
  rationale: ദാവീദ് കൊലകളെക്കുറിച്ച് അറിഞ്ഞിരുന്നില്ല എന്ന സാഹചര്യാർഥം വ്യക്തമാക്കാൻ ‘അത്’ ചേർക്കുന്നു; മൂലത്തിലെ അറിവില്ലായ്മയുടെ പ്രസ്താവന സംരക്ഷിക്കുന്നു.
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: യിസ്രായേൽ സൈന്യാധിപൻ / യെഹൂദാ സൈന്യാധിപൻ
  rationale: പുരാതന സൈനിക പദവിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ചുരുക്കവുമായ ‘സൈന്യാധിപൻ’ എന്നു നൽകുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഏകീകരണം പാലിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ലിപ്യന്തരണരൂപം ഉപയോഗിക്കുന്നു.
- issue: രക്തം തലമേൽ മടങ്ങിവരുന്ന ശൈലിയുടെ അർഥം
  choice: ദൈവം രക്തച്ചൊരിച്ചിലിന്റെ കുറ്റവും അതിനുള്ള പ്രതിഫലവും കുറ്റവാളിയുടെ മേൽ വരുത്തുന്നു എന്ന ശൈലി നിലനിർത്തുക
  alternative: ‘അവന്റെ രക്തപാതകക്കുറ്റം അവന്റെ തലമേൽ വരുത്തും’ എന്ന് അർഥം തുറന്നുപറയുക
  rationale: വാചകം ന്യായമായ ദൈവിക പ്രതിഫലത്തെ സൂചിപ്പിക്കുന്നു; അതേസമയം മൂലത്തിലെ ശക്തമായ ദൃശ്യശൈലി പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; എബ്രായ രക്തം-തല ശൈലി അടിക്കുറിപ്പോടെ നിലനിർത്തിയിരിക്കുന്നു.
