source:
  edition: WLC
  text: וַ/תָּבֹ֤א בַת שֶׁ֨בַע֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה לְ/דַבֶּר ל֖/וֹ עַל אֲדֹנִיָּ֑הוּ וַ/יָּקָם֩ הַ/מֶּ֨לֶךְ לִ/קְרָאתָ֜/הּ וַ/יִּשְׁתַּ֣חוּ לָ֗/הּ וַ/יֵּ֨שֶׁב֙ עַל כִּסְא֔/וֹ וַ/יָּ֤שֶׂם כִּסֵּא֙ לְ/אֵ֣ם הַ/מֶּ֔לֶךְ וַ/תֵּ֖שֶׁב לִֽ/ימִינֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: ml
  text: അങ്ങനെ ബത്ത്-ശേബ അദോനിയാവിനുവേണ്ടി സംസാരിക്കാൻ ശലോമോൻ രാജാവിന്റെ അടുക്കൽ ചെന്നു. രാജാവ് അവളെ എതിരേൽക്കാൻ എഴുന്നേറ്റ് അവളുടെ മുമ്പിൽ കുനിഞ്ഞു. പിന്നെ അവൻ തന്റെ സിംഹാസനത്തിൽ ഇരുന്നു; രാജമാതാവിനായി ഒരു സിംഹാസനം വെപ്പിച്ചു. അവൾ അവന്റെ വലതുഭാഗത്ത് ഇരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: അദോനിയാവിനുവേണ്ടി
  rationale: עַל എന്ന പദബന്ധം സന്ദർഭത്തിൽ അദോനിയാവിന്റെ അപേക്ഷയ്ക്കുവേണ്ടിയുള്ള മധ്യസ്ഥസംസാരത്തെ സൂചിപ്പിക്കുന്നു; വെറും ‘അദോനിയാവിനെക്കുറിച്ച്’ എന്നതിനെക്കാൾ ഈ അർഥം വ്യക്തമാണ്.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: അവളുടെ മുമ്പിൽ കുനിഞ്ഞു
  rationale: ഹിസ്തഫേൽ ക്രിയ സൂചിപ്പിക്കുന്ന ആദരപൂർവമായ ദേഹഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആരാധന എന്ന ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: כִּסֵּא לְאֵם הַמֶּלֶךְ
  choice: രാജമാതാവിനായി ഒരു സിംഹാസനം
  rationale: '‘രാജാവിന്റെ അമ്മ’ എന്ന പദശ: രൂപത്തെക്കാൾ ഈ രാജസഭാസന്ദർഭത്തിൽ ‘രാജമാതാവ്’ സ്വാഭാവികവും പദവിയുടെ മാന്യത നിലനിർത്തുന്നതുമാണ്; כִּסֵּאയ്ക്ക് ഇരുവിടത്തും ‘സിംഹാസനം’ ഉപയോഗിച്ച് ആവർത്തനം സംരക്ഷിക്കുന്നു.'
- source_word: לִימִינוֹ
  choice: അവന്റെ വലത്തുഭാഗത്ത്
  rationale: സ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം അർഥവ്യാഖ്യാനം കൂട്ടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശലോമോൻ ബത്ത്-ശേബയുടെ മുമ്പിൽ കുനിയുന്നതിന്റെ സ്വഭാവം
  choice: ആദരസൂചകമായ ‘അവളുടെ മുമ്പിൽ കുനിഞ്ഞു’
  alternative: ‘അവളെ നമസ്കരിച്ചു’ / ‘അവളെ ആരാധിച്ചു’
  rationale: ക്രിയയ്ക്ക് കുനിയുക, ആദരിക്കുക, ആരാധിക്കുക എന്നീ സന്ദർഭാധിഷ്ഠിത സാധ്യതകളുണ്ട്. ഇവിടെ രാജമാതാവിനോടുള്ള രാജകീയ ആദരമാണ് സന്ദർഭം; ‘ആരാധിച്ചു’ എന്നു നൽകുന്നത് പാഠം ആവശ്യപ്പെടാത്ത ദൈവശാസ്ത്രപരമായ ധ്വനി സൃഷ്ടിക്കും.
- issue: വലത്തുഭാഗത്ത് ഇരുത്തിയതിന്റെ പ്രതീകാർഥം
  choice: സ്ഥലവിവരണം മാത്രം വിവർത്തനം ചെയ്യുന്നു
  alternative: ബഹുമാനത്തിന്റെയോ അധികാരത്തിന്റെയോ സ്ഥാനം എന്നു പാഠത്തിൽ വിശദീകരിക്കുക
  rationale: മൂലപാഠം സ്ഥാനം രേഖപ്പെടുത്തുന്നു, അതിന്റെ പ്രതീകാർഥം തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ സുഗമവുമായ മലയാളം. ഹീബ്രുവിലെ സംഭവക്രമം വ്യക്തമായ ചെറുവാക്യങ്ങളാക്കി; എല്ലാ പ്രവൃത്തികളും സംരക്ഷിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾപ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രൂപത്തിൽ നൽകി.
