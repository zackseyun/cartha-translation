reference: 1 Kings 2:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: ml
  text: 'മൂന്നു വർഷം കഴിഞ്ഞപ്പോൾ, ശിമെയിയുടെ രണ്ട് അടിമകൾ ഗത്തിലെ രാജാവായ മാഖായുടെ മകൻ ആഖീശിന്റെ അടുക്കലേക്ക് ഓടിപ്പോയി. ശിമെയിയോടു ഇങ്ങനെ അറിയിച്ചു: “ഇതാ, നിന്റെ അടിമകൾ ഗത്തിലുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം കഴിഞ്ഞപ്പോൾ
  rationale: മൂന്നു വർഷക്കാലത്തിന്റെ അവസാനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി; ‘മൂന്നു വർഷത്തിന്റെ അവസാനത്തിൽ’ എന്നതിനേക്കാൾ വായനാസുഖമുള്ളതാണ്.
- source_word: וַיִּבְרְחוּ
  choice: ഓടിപ്പോയി
  rationale: ברח എന്ന ക്രിയ ഇവിടെ യജമാനനെ വിട്ട് രക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോയി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: അടിമകൾ / നിന്റെ അടിമകൾ
  rationale: עבד എന്നതിന് ‘ദാസൻ/വേലക്കാരൻ’ എന്നും ‘അടിമ’ എന്നും അർഥമാകാം. ഇവർ ശിമെയിയെ വിട്ട് ഓടിപ്പോകുകയും അവരെ തിരികെ കൊണ്ടുവരാൻ അവൻ പുറപ്പെടുകയും ചെയ്യുന്ന സന്ദർഭത്തിൽ അവരുടെ ബന്ധിതാവസ്ഥ പ്രധാനമായതിനാൽ ‘അടിമകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: אֶל אָכִישׁ
  choice: ആഖീശിന്റെ അടുക്കലേക്ക്
  rationale: വ്യക്തിയിലേക്കുള്ള ചലനമാണ് אֶל സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അടുക്കലേക്ക്’ എന്നു നൽകി.
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: ഗത്തിലെ രാജാവായ മയഖയുടെ മകൻ
  rationale: ആഖീശിന്റെ പിതൃപരിചയവും രാജപദവിയും മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: ചിലർ ശിമെയിയോട് … എന്നു പറഞ്ഞു
  rationale: എബ്രായത്തിലെ മൂന്നാം പുരുഷ ബഹുവചനത്തിന് വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്ത കർത്താവുണ്ട്. മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ചിലർ’ ഉപയോഗിച്ചു; അറിയിപ്പ് നേരിട്ടുള്ള വചനമായി നിലനിർത്തി.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ദെയ്ക്റ്റിക് കണത്തിന്റെ ഉടൻതന്നെയുള്ള ഊന്നൽ ‘ഇതാ’ നിലനിർത്തുന്നു.
- source_word: בְּגַת
  choice: ഗത്തിലുണ്ട്
  rationale: בְּ ഇവിടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘ഗത്തിൽ ഉണ്ട്’ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ബന്ധിത സേവനസ്ഥിതിയെ മറയ്ക്കാതിരിക്കാനായി ‘അടിമകൾ’ ഉപയോഗിച്ചു; പേരുകൾ ആഖീശ്, മയഖ, ശിമെയി എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു.
