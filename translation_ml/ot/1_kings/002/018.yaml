source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר בַּת שֶׁ֖בַע ט֑וֹב אָנֹכִ֕י אֲדַבֵּ֥ר עָלֶ֖י/ךָ אֶל הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/018.yaml
  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: ml
  text: 'ബത്ത്-ശേബ പറഞ്ഞു: “ശരി; ഞാൻ നിനക്കുവേണ്ടി[a] രാജാവിനോടു സംസാരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെക്കുറിച്ച്” അല്ലെങ്കിൽ “നിന്റെ പക്ഷത്തുനിന്ന്.” എബ്രായ പ്രയോഗത്തിന് ഒരാളെക്കുറിച്ച് സംസാരിക്കുക എന്ന അർഥവും വരാം; ഈ സന്ദർഭത്തിൽ അത് അദോനീയാവിനുവേണ്ടിയുള്ള മധ്യസ്ഥതയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന ക്രിയയുടെ സാധാരണ കഥനരൂപം; നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בַּת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: טוֹב
  choice: ശരി
  rationale: ഇവിടെ സമ്മതം അറിയിക്കുന്ന ഹ്രസ്വ പ്രതികരണമാണ്; ആധുനിക മലയാളസംഭാഷണത്തിൽ ‘ശരി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אָנֹכִי אֲדַבֵּר
  choice: ഞാൻ ... സംസാരിക്കാം
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ വ്യക്തമായ കർത്തൃത്വവും אֲדַבֵּר എന്ന ക്രിയയുടെ ഉദ്ദേശ്യ/വാഗ്ദാനഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָלֶיךָ
  choice: നിനക്കുവേണ്ടി
  rationale: പദപ്രയോഗത്തിന് ‘നിന്നെക്കുറിച്ച്’ എന്നും ‘നിന്റെ പക്ഷമായി’ എന്നും അർത്ഥസാധ്യതയുണ്ട്; സന്ദർഭത്തിലെ മധ്യസ്ഥത സൂചിപ്പിക്കാൻ ‘നിനക്കുവേണ്ടി’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു, എന്നാൽ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: ‘രാജാവിനോട് സംസാരിക്കുക’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമാണ്; രാജപദവി സൂചിപ്പിക്കുന്ന സാധാരണ നാമമായി നൽകി.
theological_decisions:
- issue: ബത്ത്-ശേബയുടെ പ്രസംഗം അദോനീയാവിനുവേണ്ടിയുള്ള മധ്യസ്ഥതയാണോ, അവനെക്കുറിച്ചുള്ള പരാമർശമാത്രമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘നിനക്കുവേണ്ടി’
  alternative: ‘നിന്നെക്കുറിച്ച്’
  rationale: രാജാവിനോടു അപേക്ഷ അവതരിപ്പിക്കുന്ന സന്ദർഭം ഗുണകരമായ പ്രതിനിധാനത്തെ സൂചിപ്പിക്കുന്നു; എങ്കിലും എബ്രായ עָלֶיךָ എന്നതിന്റെ വിശാലമായ അർത്ഥപരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സംഭാഷണം സംക്ഷിപ്തമായി നിലനിർത്തി; ഉറവിടത്തിലെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
