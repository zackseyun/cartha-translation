  terminology: ബത്ത്-ശേബ is a suitable Malayalam transliteration, and രാജാവ് is correctly a common royal title. The footnote appropriately retains the lexical range of עַל. Its wording has been lightly regularized for idiomatic Malayalam and to avoid treating the contextual implication as certain.
