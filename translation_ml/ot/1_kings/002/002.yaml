  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: ml
  text: “ഞാൻ സകലഭൂവാസികളും പോകുന്ന വഴിക്കു പോകുകയാണ്. അതുകൊണ്ട് നീ ശക്തനായിരിക്കുക; ഒരു പുരുഷനായിരിക്കുക[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പുരുഷനാണെന്നു തെളിയിക്കുക” അല്ലെങ്കിൽ “പുരുഷോചിതനായി പ്രവർത്തിക്കുക.” പുരുഷനായിരിക്കുക എന്ന ആശയത്തോടൊപ്പം ധൈര്യത്തോടെയും ഉത്തരവാദിത്വത്തോടെയും പ്രവർത്തിക്കുക എന്ന ആശയവും ഹീബ്രു പ്രയോഗത്തിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: ഞാൻ
  rationale: സ്വതന്ത്രമായ ഒന്നാംപുരുഷ ഏകവചന സർവനാമം; ഇവിടെ പ്രത്യേക ഊന്നൽ കൂട്ടാതെ സ്വാഭാവികമായി ‘ഞാൻ’ എന്നു നൽകുന്നു.
- source_word: הֹלֵךְ
  choice: പോകുകയാണ്
  rationale: സർവനാമത്തോടൊപ്പമുള്ള ഖാൽ കൃദന്തം സമീപിച്ചിരിക്കുന്ന മരണത്തിലേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; ‘പോകുകയാണ്’ ആ ആസന്നതയും മൂലരൂപകവും നിലനിർത്തുന്നു.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: സകലഭൂവാസികളും പോകുന്ന വഴിക്ക്
  rationale: അക്ഷരാർഥത്തിലെ ‘സകല ഭൂമിയുടെയും വഴി’ മലയാളത്തിൽ അസ്പഷ്ടമാകാം. ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഭൂമിയിൽ ജീവിക്കുന്ന എല്ലാവർക്കും പൊതുവായ മരണപഥമാണ്; ‘സകലഭൂവാസികളും പോകുന്ന വഴി’ രൂപകം നിലനിർത്തിക്കൊണ്ട് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְחָזַקְתָּ
  choice: അതുകൊണ്ട് നീ ശക്തനായിരിക്കുക
  rationale: വാവ് ചേർന്ന പൂർണക്രിയാരൂപമാണെങ്കിലും സന്ദർഭത്തിൽ ഇത് പ്രബോധനാത്മകമായ ആജ്ഞയായി പ്രവർത്തിക്കുന്നു. മുൻവാക്യത്തിന്റെ ഫലബന്ധം ‘അതുകൊണ്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: ഒരു പുരുഷനായി നിലകൊള്ളുക
  rationale: ‘ഒരു പുരുഷനായിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം ധൈര്യത്തോടെയും പക്വമായ ഉത്തരവാദിത്വത്തോടെയും പ്രവർത്തിച്ചു സ്വയം അങ്ങനെ തെളിയിക്കുക എന്ന സന്ദർഭനിറവും ‘നിലകൊള്ളുക’ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; ലിംഗസൂചന നിഷ്പക്ഷമാക്കിയിട്ടില്ല.
theological_decisions:
- issue: ശലോമോനോടുള്ള പ്രബോധനത്തിലെ ലിംഗസൂചക പ്രയോഗം
  choice: ഒരു പുരുഷനായി നിലകൊള്ളുക
  alternative: ഒരു പുരുഷനായിരിക്കുക; പുരുഷോചിതനായി പ്രവർത്തിക്കുക
  rationale: לְאִישׁ പുരുഷലിംഗ ഏകവചനമാണ്; ഒരു പിതാവ് തന്റെ മകനോടു പറയുന്ന പ്രബോധനമാണിത്. അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു. അതേസമയം ആധുനിക സാംസ്കാരിക പുരുഷത്വധാരണകൾ വാക്യത്തിൽ ചേർക്കാതെ, ധൈര്യവും പക്വമായ ഉത്തരവാദിത്വവും ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പിതൃപ്രബോധനശൈലി. മരണത്തെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തിയെങ്കിലും ‘സകല ഭൂമിയുടെയും വഴി’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘സകലഭൂവാസികളും പോകുന്ന വഴി’ എന്നു നൽകി.
