id: 1KI.2.13
reference: 1 Kings 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֲדֹנִיָּ֣הוּ בֶן חַגֵּ֗ית אֶל בַּת שֶׁ֨בַע֙ אֵם שְׁלֹמֹ֔ה וַ/תֹּ֖אמֶר הֲ/שָׁל֣וֹם בֹּאֶ֑/ךָ וַ/יֹּ֖אמֶר שָׁלֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: ml
  text: അനന്തരം ഹഗ്ഗീത്തിന്റെ മകനായ അദോനിയാവ് ശലോമോന്റെ അമ്മയായ ബത്ത്-ശേബയുടെ അടുക്കൽ വന്നു. അവൾ അവനോട്, “നീ സമാധാനത്തോടെയാണോ വരുന്നത്?” എന്നു ചോദിച്ചു. “സമാധാനത്തോടെ,” എന്ന് അവൻ ഉത്തരം പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയ സന്ദർഭത്തിനനുസരിച്ച് ‘വരുക’ അല്ലെങ്കിൽ ‘പോകുക’ എന്നാകാം; ബത്ത്-ശേബയെ ദൃശ്യകേന്ദ്രമാക്കുന്ന ആഖ്യാനത്തിൽ ‘അടുക്കൽ വന്നു’ സ്വാഭാവികമാണ്.
- source_word: אֲדֹנִיָּהוּ
  choice: അദോനിയാവ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: בֶן חַגִּית
  choice: ഹഗ്ഗീത്തിന്റെ മകനായ
  rationale: മാതാവിന്റെ പേരിലൂടെ അദോനിയാവിനെ തിരിച്ചറിയിക്കുന്ന എബ്രായ പുത്രബന്ധഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: എബ്രായ നാമത്തിന്റെ ഘടകവിഭജനം വ്യക്തമാക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സൗകര്യമുള്ള ലിപ്യന്തരണം.
- source_word: אֵם שְׁלֹמֹה
  choice: ശലോമോന്റെ അമ്മയായ
  rationale: ബത്ത്-ശേബയെ ശലോമോനോടുള്ള രാജകീയ കുടുംബബന്ധത്തിലൂടെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: നീ സമാധാനത്തോടെയാണോ വരുന്നത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ വരവ് സമാധാനമാണോ?’ എന്നർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ സന്ദർശനത്തിന്റെ സമാധാനപരമായ ഉദ്ദേശ്യം അന്വേഷിക്കുന്നു; ആ ആശയം സ്വാഭാവിക മലയാളചോദ്യമായി നൽകുന്നു.
- source_word: שָׁלוֹם
  choice: സമാധാനത്തോടെതന്നെ
  rationale: അദോനിയാവിന്റെ ഒറ്റവാക്കിലുള്ള ഉറപ്പുനൽകുന്ന മറുപടിയുടെ ചുരുക്കവും മുൻചോദ്യത്തോടുള്ള പ്രതിധ്വനിയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അടുക്കൽ വന്നു’, ‘എന്നു ചോദിച്ചു’, ‘ഉത്തരം പറഞ്ഞു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; സംഭാഷണത്തിലെ സംശയവും ചുരുക്കമുള്ള ഉറപ്പും സംരക്ഷിച്ചിട്ടുണ്ട്.
