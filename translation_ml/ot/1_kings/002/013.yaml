  terminology: Personal names are consistently transliterated and the familial apposition ‘ശലോമോന്റെ അമ്മയായ’ is accurate. ‘സമാധാനത്തോടെ’ appropriately represents the dialogue’s peaceful-intent sense without importing additional theological meaning.
