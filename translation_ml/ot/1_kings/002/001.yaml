  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: ml
  text: 'ദാവീദിന്റെ മരണസമയം അടുത്തുവന്നപ്പോൾ[a], അവൻ തന്റെ മകനായ ശലോമോനോട് ഇങ്ങനെ കല്പിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ദാവീദിന്റെ ദിവസങ്ങൾ മരിക്കാനായി അടുത്തുവന്നു’; ദാവീദിന്റെ മരണസമയം അടുത്തുവന്നുവെന്നാണ് ഈ എബ്രായ ശൈലിയുടെ അർഥം.
