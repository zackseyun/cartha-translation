lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: ദാവീദ് മരിക്കേണ്ട സമയം അടുത്തുവന്നപ്പോൾ
  rationale: ‘ദാവീദിന്റെ ദിവസങ്ങൾ മരിക്കാൻ അടുത്തു’ എന്ന എബ്രായ കാലസംബന്ധിയായ പ്രയോഗത്തിന്റെ സാമീപ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ മരണസമയം സമീപിച്ചതായി പറയുന്നു.
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയിലെ അധികാരപൂർവവും ഗൗരവമുള്ളതുമായ അന്തിമനിർദേശത്തിന്റെ ശക്തി ‘കല്പിച്ചു’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת־שְׁלֹמֹה בְנוֹ
  choice: തന്റെ മകനായ ശലോമോനോട്
  rationale: നേരിട്ടുള്ള കർമത്തെയും ‘അവന്റെ മകൻ’ എന്ന ബന്ധത്തെയും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവും അതേ പ്രവർത്തനം നിർവഹിക്കുന്നു.
