  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ‘അടുത്തുവരുക’ എന്ന രൂപകം നിലനിർത്തി; ‘കല്പിച്ചു’ എന്നത് അന്തിമനിർദേശത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
