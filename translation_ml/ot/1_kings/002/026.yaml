revisions:
- from: 'പുരോഹിതനായ അബ്യാഥാരിനോടു രാജാവ് പറഞ്ഞു: “അനാഥോത്തിലേക്കു, നിന്റെ നിലത്തിലേക്കു പോകുക. നീ മരണശിക്ഷയ്ക്ക് അർഹനാണ്.[a] എങ്കിലും ഇന്ന് ഞാൻ നിന്നെ കൊല്ലുകയില്ല; എന്തെന്നാൽ നീ എന്റെ പിതാവായ ദാവീദിന്റെ മുമ്പിൽ കർത്താവായ യഹോവയുടെ പെട്ടകം ചുമന്നു; എന്റെ പിതാവ് അനുഭവിച്ച എല്ലാ കഷ്ടതകളിലും നീയും പങ്കുചേർന്നു.”'
  to: 'പുരോഹിതനായ അബ്യാഥാരിനോടു രാജാവ് പറഞ്ഞു: “അനാഥോത്തിലെ നിന്റെ നിലത്തേക്കു പോകുക. നീ മരണശിക്ഷയ്ക്ക് അർഹനാണ്.[a] എങ്കിലും ഇന്ന് ഞാൻ നിന്നെ വധിക്കുകയില്ല; എന്തെന്നാൽ നീ എന്റെ പിതാവായ ദാവീദിന്റെ മുമ്പിൽ കർത്താവായ യഹോവയുടെ പെട്ടകം ചുമന്നു; എന്റെ പിതാവ് അനുഭവിച്ച എല്ലാ കഷ്ടതകളിലും നീയും പങ്കുചേർന്നതുകൊണ്ടും.”'
