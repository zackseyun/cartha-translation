  rationale: לִפְנֵיയുടെ സ്ഥലപരവും ബന്ധപരവുമായ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
