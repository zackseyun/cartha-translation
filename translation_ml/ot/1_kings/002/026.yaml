  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: ml
  text: 'പുരോഹിതനായ അബ്യാഥാരിനോടു രാജാവ് പറഞ്ഞു: “അനാഥോത്തിലെ നിന്റെ നിലത്തേക്കു പോകുക. നീ മരണശിക്ഷയ്ക്ക് അർഹനാണ്.[a] എങ്കിലും ഇന്ന് ഞാൻ നിന്നെ വധിക്കുകയില്ല; എന്തെന്നാൽ നീ എന്റെ പിതാവായ ദാവീദിന്റെ മുമ്പിൽ കർത്താവായ യഹോവയുടെ പെട്ടകം ചുമന്നു; എന്റെ പിതാവ് അനുഭവിച്ച എല്ലാ കഷ്ടതകളിലും നീയും പങ്കുചേർന്നതുകൊണ്ടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നീ മരണത്തിന്റെ മനുഷ്യനാണ്”; അതായത്, വധശിക്ഷയ്ക്ക് വിധേയനാണ്.'
    reason: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരരൂപവും സന്ദർഭാർഥവും അറിയിക്കാൻ.
