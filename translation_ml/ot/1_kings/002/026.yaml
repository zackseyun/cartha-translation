- issue: אִישׁ מָוֶת എന്ന പ്രയോഗത്തിലെ കുറ്റവിധി
  choice: മരണശിക്ഷയ്ക്ക് അർഹനാണ്
  alternative: നീ മരണത്തിന്റെ മനുഷ്യനാണ്
  rationale: ഇത് അന്തിമ ദൈവശാസ്ത്രവിധിയെന്നതിലുപരി രാജാവിന്റെ ന്യായവിധിപ്രഖ്യാപനമാണ്; അതിനാൽ വധശിക്ഷയ്ക്ക് വിധേയൻ എന്ന സന്ദർഭാർഥം നൽകുന്നു.
