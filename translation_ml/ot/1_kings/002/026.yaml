  choice: നീ കർത്താവായ യഹോവയുടെ പെട്ടകം ചുമന്നു
  rationale: נשאയുടെ ശാരീരികമായി ചുമക്കുക എന്ന അർഥം സംരക്ഷിക്കുന്നു. אֲדֹנָי יְהוִהയിലെ രണ്ടു ഘടകങ്ങളും ‘കർത്താവായ യഹോവ’ എന്നു നൽകി ദൈവനാമം മറച്ചുവയ്ക്കുന്നില്ല.
- source_word: לִפְנֵי דָוִד אָבִי
