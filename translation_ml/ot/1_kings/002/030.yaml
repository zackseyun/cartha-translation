source:
  edition: WLC
  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: ml
  text: 'അപ്പോൾ ബെനായാവ് യഹ്‌വെയുടെ കൂടാരത്തിൽ[a] ചെന്ന് യോവാബിനോട് പറഞ്ഞു: “രാജാവ് ഇങ്ങനെ പറയുന്നു: ‘പുറത്തുവരിക.’” എന്നാൽ യോവാബ് പറഞ്ഞു: “ഇല്ല; ഞാൻ ഇവിടെത്തന്നെ മരിക്കും.” ബെനായാവ് രാജാവിന്റെ അടുക്കൽ മടങ്ങിച്ചെന്ന് വിവരം അറിയിച്ചു: “യോവാബ് ഇങ്ങനെ പറഞ്ഞു; അവൻ എനിക്ക് ഇങ്ങനെയാണ് ഉത്തരം നൽകിയത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ തിരുനിവാസത്തിൽ.” എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “യഹ്‌വെയുടെ കൂടാരം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: യഹ്‌വെയുടെ കൂടാരം
  rationale: אֹהֶל എന്നത് അക്ഷരാർഥത്തിൽ ‘കൂടാരം’ എന്നാണ്. പരമ്പരാഗതമായ ‘തിരുനിവാസം’ എന്ന വ്യാഖ്യാനപരമായ പദത്തേക്കാൾ എബ്രായവാചകത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇങ്ങനെ പറയുന്നു
  rationale: ദൂതസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: צֵא
  choice: പുറത്തുവരിക
  rationale: അകത്തുള്ള ഒരാളോടു പറയുന്ന ആജ്ഞയായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ദിശാബോധം നൽകുന്നു.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: ഇല്ല; ഞാൻ ഇവിടെത്തന്നെ മരിക്കും
  rationale: യോവാബിന്റെ നിരാകരണവും അവിടെവച്ചുതന്നെ മരിക്കാനുള്ള ഉറച്ച നിലപാടും പ്രകടമാക്കുന്നു; כִּי എന്നതിന്റെ ബന്ധം മലയാളത്തിൽ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: മടങ്ങിച്ചെന്ന് വിവരം അറിയിച്ചു
  rationale: തിരികെച്ചെന്ന് റിപ്പോർട്ട് നൽകുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: യോവാബ് ഇങ്ങനെ പറഞ്ഞു; അവൻ എനിക്ക് ഇങ്ങനെയാണ് ഉത്തരം നൽകിയത്
  rationale: ആവർത്തിച്ചുള്ള כֹּה നിലനിർത്തി ഔപചാരിക റിപ്പോർട്ടിന്റെ ശൈലി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമമാണ് ഉള്ളത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യോവാബിന്റെ വാക്കുകളിലെ כִּי എന്നതിന്റെ ബന്ധം
  choice: 'നിരാകരണത്തിനു പിന്നാലെയുള്ള ഉറച്ച തീരുമാനം: “ഇല്ല; ഞാൻ ഇവിടെത്തന്നെ മരിക്കും”'
  alternative: 'കാരണം സൂചിപ്പിച്ച്: “ഇല്ല, കാരണം ഞാൻ ഇവിടെ മരിക്കും”'
  rationale: ഈ സന്ദർഭത്തിൽ כִּי വിശദീകരണമോ എതിർനിലപാടിലേക്കുള്ള മാറ്റമോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ അർധവിരാമം ഉപയോഗിക്കുന്നത് ആ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കഥനോചിതവുമായ ശൈലി. ദൂതസന്ദേശത്തിലെ ആവർത്തനം സംരക്ഷിച്ചിട്ടുണ്ടെങ്കിലും അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി. വ്യക്തതയ്ക്കായി യോവാബിന്റെ പേര് സംഭാഷണഭാഗങ്ങളിൽ ചേർത്തിരിക്കുന്നു; എബ്രായത്തിൽ അവിടെ സർവനാമങ്ങളാണ്.
