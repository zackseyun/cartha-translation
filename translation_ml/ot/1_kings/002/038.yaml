  register: ആധുനികവും മാന്യവുമായ രാജസഭാ ഗദ്യം. ‘അങ്ങ്/അങ്ങയുടെ’, ‘യജമാനൻ’, ‘ദാസൻ’, ‘അരുളിച്ചെയ്തു’ എന്നിവ ആദരവും ഔപചാരികതയും നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിട്ടുണ്ട്.
