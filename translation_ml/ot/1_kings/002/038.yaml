  text: וַ/יֹּ֨אמֶר שִׁמְעִ֤י לַ/מֶּ֨לֶךְ֙ ט֣וֹב הַ/דָּבָ֔ר כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וַ/יֵּ֧שֶׁב שִׁמְעִ֛י בִּ/ירוּשָׁלִַ֖ם יָמִ֥ים רַבִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: ml
  text: 'ശിമെയി രാജാവിനോടു പറഞ്ഞു: “വാക്ക് നല്ലതാണ്.[a] എന്റെ പ്രഭുവായ രാജാവ് അരുളിച്ചെയ്തതുപോലെതന്നെ അങ്ങയുടെ ദാസൻ ചെയ്യും.” അങ്ങനെ ശിമെയി യെരൂശലേമിൽ അനേകം ദിവസം പാർത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കാര്യം നല്ലതാണ്” അല്ലെങ്കിൽ “അങ്ങ് പറയുന്നതു നല്ലതാണ്.”
    reason: דָּבָר എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘വാക്ക്,’ ‘കാര്യം,’ അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി ‘അങ്ങ് പറയുന്നത്’ എന്ന അർഥം വരാം.
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: അങ്ങയുടെ വാക്ക് നല്ലത്
  rationale: דָּבָר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘പ്രസ്താവന’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ശിമെയി രാജാവിന്റെ കല്പനയോടു പ്രതികരിക്കുന്നതിനാൽ ‘അങ്ങയുടെ വാക്ക്’ എന്നത് സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും മൂലത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസന്നിധിയിലെ ആദരപൂർവമായ അഭിസംബോധനയാണ്. ‘യജമാനൻ’ ആദരവും അധികാരബന്ധവും നിലനിർത്തുന്നു; ഉടമസ്ഥതയുടെ അതിരൂക്ഷമായ സൂചന ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: അങ്ങയുടെ ദാസൻ ചെയ്യും
  rationale: ‘അങ്ങയുടെ ദാസൻ’ രാജാവിന്റെ മുമ്പാകെയുള്ള വിനയപൂർവമായ ആത്മപരാമർശമാണ്; നിർബന്ധിത അടിമത്തമെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല. ക്രിയയ്ക്ക് സന്ദർഭാനുസൃതമായ ഭാവികാല പ്രതിജ്ഞയുടെ ശക്തിയുണ്ട്.
- source_word: וַיֵּשֶׁב
  choice: പാർത്തു
  rationale: יָשַׁב ഇവിടെ താമസിക്കുക എന്ന അർഥത്തിലാണ്. ‘പാർത്തു’ ആധുനിക മലയാള ബൈബിൾ ഗദ്യത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יָמִים רַבִּים
  choice: അനേകദിവസം
  rationale: മൂലത്തിലെ ‘വളരെ ദിവസങ്ങൾ’ എന്ന പ്രയോഗരൂപം നിലനിർത്തി, നിർദ്ദിഷ്ടമല്ലാത്ത ദീർഘകാലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שִׁמְעִי
  choice: ശിമെയി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ രൂപവും בְּ എന്ന സ്ഥലസൂചക അവ്യയത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനവും.
