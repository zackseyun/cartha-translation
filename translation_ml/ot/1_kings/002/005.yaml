revisions:
- from: സെരൂയയുടെ മകനായ യോവാബ് എന്നോടു ചെയ്തതും ഇസ്രായേലിന്റെ സൈന്യങ്ങളുടെ രണ്ടു സേനാധിപന്മാരായ നേരിന്റെ മകൻ അബ്നേരിനോടും യേഥെരിന്റെ മകൻ അമാസയോടും ചെയ്തതും നിനക്കും അറിയാമല്ലോ. അവൻ അവരെ കൊന്നു; സമാധാനകാലത്ത് യുദ്ധരക്തം ചൊരിയുകയും[a] തന്റെ അരയിലെ കച്ചയിലും കാലിലെ ചെരിപ്പുകളിലും യുദ്ധരക്തം പുരട്ടുകയും ചെയ്തു.[b]
  to: സെരൂയയുടെ മകനായ യോവാബ് എന്നോടു ചെയ്തതും, ഇസ്രായേൽസൈന്യത്തിന്റെ രണ്ട് സേനാനായകരായ നേരിന്റെ മകൻ അബ്നേരിനോടും യെഥെരിന്റെ മകൻ അമാസയോടും ചെയ്തതും നിനക്കും അറിയാമല്ലോ. അവൻ അവരെ കൊന്നു; സമാധാനകാലത്ത് യുദ്ധരക്തം ചൊരിയുകയും[a] തന്റെ അരയിലെ കച്ചയിലും കാലിലെ ചെരിപ്പുകളിലും യുദ്ധരക്തം പുരട്ടുകയും ചെയ്തു.[b]
  rationale: The revision makes only safe stylistic and transliteration adjustments. It preserves the Hebrew’s direct address, the two named victims, the war-versus-peace contrast, the repeated war-blood image, and the tentative nature of the explanatory note.
