id: 1KI.2.5
reference: 1 Kings 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: ml
  text: സെരൂയയുടെ മകനായ യോവാബ് എന്നോടു ചെയ്തതും, ഇസ്രായേൽസൈന്യത്തിന്റെ രണ്ട് സേനാനായകരായ നേരിന്റെ മകൻ അബ്നേരിനോടും യെഥെരിന്റെ മകൻ അമാസയോടും ചെയ്തതും നിനക്കും അറിയാമല്ലോ. അവൻ അവരെ കൊന്നു; സമാധാനകാലത്ത് യുദ്ധരക്തം ചൊരിയുകയും[a] തന്റെ അരയിലെ കച്ചയിലും കാലിലെ ചെരിപ്പുകളിലും യുദ്ധരക്തം പുരട്ടുകയും ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “സമാധാനത്തിൽ യുദ്ധരക്തം വെച്ചു.” സമാധാനപരമായ സാഹചര്യത്തിൽ യുദ്ധകാലത്തേതുപോലുള്ള രക്തച്ചൊരിച്ചിൽ നടത്തിയെന്നാണ് ഈ എബ്രായപ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: യോവാബിന്റെ കച്ചയിലും ചെരിപ്പുകളിലും രക്തം പതിഞ്ഞിരിക്കുന്ന ഈ ദൃശ്യം, ഈ കൊലപാതകങ്ങൾ മൂലമുള്ള രക്തക്കുറ്റം അവനോടു പറ്റിപ്പിടിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: നിനക്കും അറിയാമല്ലോ
  rationale: ചേർക്കൽസൂചകമായ גַם എന്ന ഊന്നലും സോളമോനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: എന്നോടു ചെയ്തതും
  rationale: לִי എന്നത് ഈ സാഹചര്യത്തിൽ ദാവീദിനു ദോഷമായി ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ പരാമർശം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സൈന്യങ്ങളുടെ രണ്ടു സേനാധിപന്മാരായ
  rationale: שָׂרֵי എന്ന സൈനിക നേതൃത്വപദവും צִבְאוֹת എന്ന ബഹുവചനവും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיַּהַרְגֵם
  choice: അവൻ അവരെ കൊന്നു
  rationale: ക്രിയയെയും ബഹുവചന കർമപ്രത്യയത്തെയും ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: സമാധാനകാലത്ത് യുദ്ധരക്തം ചൊരിയുകയും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘സമാധാനത്തിൽ യുദ്ധരക്തം വെച്ചു’ എന്ന ദൃശ്യത്തെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവതരിപ്പിക്കുമ്പോഴും യുദ്ധവും സമാധാനവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: തന്റെ അരയിലെ കച്ചയിലും കാലിലെ ചെരിപ്പുകളിലും യുദ്ധരക്തം പുരട്ടുകയും ചെയ്തു
  rationale: യോവാബിന്റെ വസ്ത്രോപകരണങ്ങളിൽ രക്തം പതിഞ്ഞിരിക്കുന്ന മൂലപാഠത്തിലെ മൂർത്തമായ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘യുദ്ധരക്തം’ എന്ന പ്രയോഗത്തിന്റെ നൈതിക അർഥം
  choice: പ്രധാനപാഠത്തിൽ മൂലരൂപകം നിലനിർത്തി, സമാധാനകാലത്തെ കൊലപാതകമെന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ‘സമാധാനകാലത്ത് യുദ്ധത്തിലെന്നപോലെ രക്തച്ചൊരിച്ചിൽ നടത്തി’ എന്ന് രൂപകം പൂർണമായി വിശദീകരിക്കുക
  rationale: യോവാബിന്റെ കുറ്റത്തിന്റെ ഗൗരവം വ്യക്തമാക്കുന്നതിനൊപ്പം എബ്രായത്തിലെ ഉദ്ദേശപൂർവമായ യുദ്ധം–സമാധാനം സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: കച്ചയിലും ചെരിപ്പിലും രക്തം എന്ന ദൃശ്യത്തിന്റെ വ്യാഖ്യാനം
  choice: ദൃശ്യം പ്രധാനപാഠത്തിൽ അതേപടി സൂക്ഷിച്ച് സാധ്യതാപരമായ രക്തപാതകക്കുറ്റത്തിന്റെ സൂചന അടിക്കുറിപ്പിൽ നൽകി
  alternative: ഇത് നേരിട്ട് ‘അവന്റെമേൽ രക്തപാതകക്കുറ്റം വരുത്തി’ എന്ന് വിവർത്തനം ചെയ്യുക
  rationale: രൂപകത്തിന്റെ കൃത്യമായ വ്യാഖ്യാനം ഉറപ്പിച്ച് പറയാതെ, മൂലപാഠത്തിന്റെ ദൃശ്യവും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. പേരുകൾ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകിയിരിക്കുന്നു. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കിയെങ്കിലും ആശയക്രമവും ആവർത്തിക്കുന്ന ‘യുദ്ധരക്തം’ എന്ന രൂപകവും നിലനിർത്തി.
