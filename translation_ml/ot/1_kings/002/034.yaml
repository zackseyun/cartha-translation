translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. פגע, מות എന്നീ തുടർച്ചയായ രണ്ടു ക്രിയകളെ ‘പ്രഹരിക്കുകയും കൊല്ലുകയും’ എന്നു വേർതിരിച്ച് മൂലത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തി. മുൻസന്ദർഭത്തിലെ കൊല്ലപ്പെട്ട വ്യക്തി യോവാബാണെന്നത് മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ അടക്കവാക്യത്തിൽ പേരെടുത്ത് വ്യക്തമാക്കി.
