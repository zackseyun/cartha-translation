  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: ml
  text: അപ്പോൾ യെഹോയാദാവിന്റെ മകനായ ബെനായാവ് കയറിച്ചെന്ന്[a] അവനെ പ്രഹരിച്ച് കൊന്നു; യോവാബ് മരുഭൂമിയിലെ തന്റെ വീട്ടിൽ[b] അടക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കയറിച്ചെന്ന്’ എന്നതിന് ‘മുകളിലേക്കു പോയി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ കയറിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ ഭൂപ്രകൃതി ഇവിടെ വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അവന്റെ വീട്ടിൽ.’ ഇവിടെ ‘വീട്’ എന്നത് കുടുംബത്തിന്റെ വസ്തുവകയെയോ എസ്റ്റേറ്റിനെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: അവിടേക്കു കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിച്ചെല്ലുക/മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ബെനായാവ് രാജകല്പന നടപ്പാക്കാൻ യോവാബിന്റെ അടുത്തേക്കു ചെന്നതും സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: וַיִּפְגַּע בּוֹ
  choice: അവനെ പ്രഹരിക്കുകയും
  rationale: פגע ב എന്ന പ്രയോഗത്തിന് ഇവിടെ ശത്രുതാപരമായി ആക്രമിക്കുക അഥവാ പ്രഹരിക്കുക എന്ന അർഥമാണ്. തുടർന്നുള്ള ‘കൊല്ലുകയും ചെയ്തു’ എന്ന വേറിട്ട ക്രിയയിൽ ലയിപ്പിക്കാതെ ആക്രമണത്തെ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: וַיְמִתֵהוּ
  choice: കൊല്ലുകയും ചെയ്തു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മരണത്തിനിടയാക്കുക/കൊല്ലുക’ എന്നാണ്. മലയാളത്തിൽ ‘കൊന്നു’ എന്നത് സ്വാഭാവികവും വധനിർവഹണത്തിന്റെ ഫലം വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: וַיִּקָּבֵר
  choice: അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഫാൽ രൂപം അർഥത്തിൽ കർമണിയാണ്. മലയാളത്തിൽ യോവാബിനെ കർമമായി മുന്നിൽ നിർത്തിയ സകർമക പ്രയോഗം കൂടുതൽ സ്വാഭാവികമാണെങ്കിലും, അടക്കം ചെയ്ത വ്യക്തിയെ വ്യക്തമാക്കാതെ മൂലത്തിലെ വിവരപരിധി പാലിക്കുന്നു.
- source_word: בְּבֵיתוֹ
  choice: അവന്റെ വീട്ടുവളപ്പിൽ
  rationale: בית എന്നത് വീടിനെയും അതോടു ചേർന്ന കുടുംബസ്വത്തിനെയും വസ്തുവകയെയും സൂചിപ്പിക്കാം. ശവസംസ്കാരസന്ദർഭത്തിൽ വീടിന്റെ അകത്ത് എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, സ്ഥലസംബന്ധമായ വിശാല അർഥം ‘വീട്ടുവളപ്പിൽ’ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലെ
  rationale: מדבר ജനവാസം കുറഞ്ഞ വനാന്തരമോ വരണ്ട പ്രദേശമോ സൂചിപ്പിക്കുന്നു. ‘മരുഭൂമി’ ആ ഭൂവിഭാഗത്തെ മലയാളത്തിൽ ചുരുക്കമായും പരിചിതമായും അറിയിക്കുന്നു.
