  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: ml
  text: അങ്ങനെ ശലോമോൻ രാജാവ് യെഹോയാദയുടെ മകനായ ബെനായാവിനെ അയച്ചു[a]. അവൻ അവനെ പ്രഹരിച്ചു; അവൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യെഹോയാദയുടെ മകനായ ബെനായാവിന്റെ കൈയാൽ അയച്ചു’; ബെനായാവിനെ തന്റെ പ്രതിനിധിയായി അയച്ചു എന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; വധത്തിനായി നിയോഗിച്ചു എന്ന ആശയം തുടർന്നുള്ള പ്രവൃത്തിയിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ്
  rationale: രാജപദവിയും വ്യക്തിനാമവും ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיַד
  choice: ബെനായാവിനെ അയച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ബെനായാവിന്റെ കൈയാൽ’ എന്നാണെങ്കിലും ഇവിടെ ഒരാളെ തന്റെ പ്രതിനിധിയായി നിയോഗിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളവും അടിക്കുറിപ്പിൽ രൂപകത്തിന്റെ അക്ഷരാർഥവും നൽകുന്നു.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: പിതൃനാമബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיִּפְגַּע בּוֹ
  choice: അവൻ അദോനിയാവിനെ വെട്ടിവീഴ്ത്തി
  rationale: פגע ב എന്നത് ഈ വധസന്ദർഭത്തിൽ ആക്രമിച്ചു മാരകമായി പ്രഹരിക്കുക എന്ന ആശയം നൽകുന്നു. ‘വെട്ടിവീഴ്ത്തി’ മരണഫലം അടുത്ത വാക്യത്തിൽ പ്രത്യേകം നിലനിർത്തിക്കൊണ്ട് ശക്തമായ പ്രഹരം വ്യക്തമാക്കുന്നു.
- source_word: וַיָּמֹת
  choice: അദോനിയാവ് മരിച്ചു
  rationale: ഹീബ്രുവിലെ തുടർച്ചയായ മരണപ്രസ്താവന പ്രത്യേകം നിലനിർത്തുന്നു; സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ നിന്നുള്ള പേര് ആവർത്തിക്കുന്നു.
