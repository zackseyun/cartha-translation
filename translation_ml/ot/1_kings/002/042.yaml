  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֗י וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/ל֧וֹא הִשְׁבַּעְתִּ֣י/ךָ בַֽ/יהוָ֗ה וָ/אָעִ֤ד בְּ/ךָ֙ לֵ/אמֹ֔ר בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/הָֽלַכְתָּ֙ אָ֣נֶה וָ/אָ֔נָה יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת וַ/תֹּ֧אמֶר אֵלַ֛/י ט֥וֹב הַ/דָּבָ֖ר שָׁמָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ആളയച്ച് ശിമെയിയെ വിളിപ്പിച്ചു; അവനോടു പറഞ്ഞു: “യാഹ്‌വെയെച്ചൊല്ലി നിന്നെക്കൊണ്ടു സത്യം ചെയ്യിക്കുകയും, ‘നീ പുറത്തുപോയി എങ്ങോട്ടെങ്കിലും പോകുന്ന ദിവസം, നീ തീർച്ചയായും മരിക്കുമെന്ന് ഉറപ്പായിക്കൊള്ളുക’ എന്നു പറഞ്ഞ് നിന്നോടു സാക്ഷ്യപ്പെടുത്തുകയും ഞാൻ ചെയ്തില്ലേ? അപ്പോൾ നീ എന്നോടു, ‘ഈ വാക്ക് നല്ലതാണ്[b]; ഞാൻ കേട്ടിരിക്കുന്നു’ എന്നു പറഞ്ഞല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “ഈ കാര്യം നല്ലതാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: നിന്നെ യഹോവയുടെ നാമത്തിൽ സത്യം ചെയ്യിച്ചു
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സത്യപ്രതിജ്ഞയുടെ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘നാമത്തിൽ’ ചേർത്തിരിക്കുന്നു.
- source_word: וָאָעִד בְּךָ
  choice: നിന്നോട് കർശനമായി മുന്നറിയിപ്പു നൽകി
  rationale: ഔപചാരികവും ഗൗരവമുള്ളതുമായ മുന്നറിയിപ്പാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; സാക്ഷ്യം പറയുക/കർശനമായി ചുമതലപ്പെടുത്തുക എന്ന നിയമപരമായ നിറവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: എവിടെയെങ്കിലും പോകുക
  rationale: അക്ഷരാർഥമായ ‘ഇങ്ങോട്ടോ അങ്ങോട്ടോ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അനിശ്ചിതവും സമഗ്രവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָדֹעַ תֵּדַע
  choice: ഉറപ്പായി അറിഞ്ഞുകൊള്ളുക
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയയും ചേർന്നുള്ള ഊന്നൽ മലയാളത്തിൽ ‘ഉറപ്പായി’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: מוֹת תָּמוּת
  choice: തീർച്ചയായും മരിക്കും
  rationale: മരണത്തിന്റെ നിശ്ചിതത്വം ഊന്നുന്ന ഹീബ്രു ഘടനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: טוֹב הַדָּבָר
  choice: ഈ വാക്ക് നല്ലതാണ്
  rationale: דבר എന്ന പദത്തിന്റെ ‘വാക്ക്/കാര്യം’ എന്ന അർഥവ്യാപ്തിയിൽ, ശലോമോന്റെ പ്രസ്താവനയോടുള്ള പ്രതികരണമായതിനാൽ ‘വാക്ക്’ തിരഞ്ഞെടുത്തു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שָׁמָעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: കേൾക്കുക എന്ന മൂലാർഥം സംരക്ഷിക്കുന്നു; സമ്മതം അല്ലെങ്കിൽ അനുസരണം എന്ന ശക്തമായ വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: שָׁמָעְתִּי എന്നതിൽ സമ്മതമോ അനുസരണമോ ഉൾപ്പെടുത്തി പരിഭാഷപ്പെടുത്തണോ
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  alternative: ഞാൻ കേട്ട് സമ്മതിച്ചിരിക്കുന്നു
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ സമ്മതത്തിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും, മൂലപാഠം ‘കേട്ടു’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനപരമായ ശക്തീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. രാജകീയ-നിയമപരമായ പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തിയെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ഹീബ്രുവിലെ ‘ഇങ്ങോട്ടും അങ്ങോട്ടും’ എന്ന ഇടിയം മലയാളത്തിൽ ‘എവിടെയെങ്കിലും’ എന്നു സ്വാഭാവികമാക്കിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
