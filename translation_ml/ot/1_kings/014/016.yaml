  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: ml
  text: യൊരോബെയാം ചെയ്തതും ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചതുമായ പാപങ്ങൾ നിമിത്തം അവൻ ഇസ്രായേലിനെ വിട്ടുകൊടുക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിനെ ഏൽപ്പിച്ചുകൊടുക്കും.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “കൊടുക്കും” എന്നാണ്; ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ ഒരു ജനത്തെ ദുരന്തത്തിനോ ശത്രുക്കൾക്കോ ഏൽപ്പിച്ചുകൊടുക്കുക എന്ന അർഥത്തിലാണ് അത് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: അവൻ … വിട്ടുകൊടുക്കും
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ എന്നാണ്. എന്നാൽ ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ ഒരു ജനത്തെ ദുരന്തത്തിനോ ശത്രുക്കൾക്കോ ഏല്പിച്ചുകൊടുക്കുക എന്ന ആശയമാണ്; ആരുടെ കൈയിലേക്കാണ് ഏല്പിക്കുന്നത് എന്നു വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന അടയാളത്തോടുകൂടിയ ദേശീയനാമം; ഇവിടെ വടക്കൻ രാജ്യത്തെയും അതിലെ ജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּגְלַל
  choice: നിമിത്തം
  rationale: കാരണത്തെയോ ഹേതുവെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിൽ ഗൗരവമുള്ളതും വ്യക്തവുമായ സമാനപദം.
- source_word: חַטֹּאות
  choice: പാപങ്ങൾ
  rationale: മൂലത്തിൽ ബഹുവചനമാണ്; അതിനാൽ ബഹുവചനം നിലനിർത്തി.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר חָטָא
  choice: സ്വയം ചെയ്തതും
  rationale: യൊരോബെയാമിന്റെ സ്വന്തം പാപപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സ്വയം’ എന്നത് തുടർന്നുള്ള കാരകപ്രയോഗവുമായി ഉള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കൊണ്ട് ചെയ്യിച്ചതുമായ
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകബലം—ഇസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയത്—നിലനിർത്തുന്നു; മുൻപുള്ള ‘പാപങ്ങൾ’ എന്ന നാമത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയിലെ പ്രവർത്തകത്വം
  choice: അവൻ ഇസ്രായേലിനെ വിട്ടുകൊടുക്കും
  alternative: അവൻ ഇസ്രായേലിനെ ഏല്പിച്ചുകൊടുക്കും
  rationale: ദൈവിക ന്യായവിധിയുടെ ശക്തി നിലനിർത്തുമ്പോഴും, ഈ വാക്യത്തിൽ പറയാത്ത ശത്രുവിനെയോ ചരിത്രപരമായ ഉപാധിയെയോ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: യൊരോബെയാമിന്റെ സ്വന്തം കുറ്റവും ഇസ്രായേലിനെ പാപത്തിലാക്കിയ ഉത്തരവാദിത്വവും
  choice: സ്വയം ചെയ്തതും ഇസ്രായേലിനെക്കൊണ്ട് ചെയ്യിച്ചതുമായ പാപങ്ങൾ
  alternative: താൻ പാപം ചെയ്തതും ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ചതും
  rationale: മൂലപാഠം യൊരോബെയാമിന്റെ വ്യക്തിപരമായ കുറ്റവും ജനത്തെ പാപം ചെയ്യിച്ച കാരകപങ്കും ഒരുമിച്ച് അവതരിപ്പിക്കുന്നു; പരിഭാഷ രണ്ടും വേർതിരിച്ചും വ്യക്തമായും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ കാരണബന്ധം, ബഹുവചനം, കാരകക്രിയ എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമാക്കാത്ത ന്യായവിധിയുടെ ഉപാധി കൂട്ടിച്ചേർത്തിട്ടില്ല.
