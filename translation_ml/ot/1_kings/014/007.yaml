source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: ml
  text: 'നീ പോയി യൊരോബെയാമിനോടു പറയുക: ‘ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ജനത്തിന്റെ ഇടയിൽനിന്ന് ഞാൻ നിന്നെ ഉയർത്തുകയും[a] എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ ഭരണാധികാരിയാക്കുകയും[b] ചെയ്തതുകൊണ്ട്—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്നെ ഉന്നതനാക്കി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നിന്നെ നേതാവായി നിയമിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥം “നിന്നെ ഭരണാധികാരിയായി നൽകി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: നീ പോയി ... പറയുക
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപങ്ങളാണ്; മലയാളത്തിൽ ലിംഗവ്യത്യാസം രൂപത്തിൽ പ്രകടമല്ലെങ്കിലും സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ആജ്ഞയായി വിവർത്തനം ചെയ്തു.
- source_word: לְיָרָבְעָם
  choice: യൊരോബെയാമിനോടു
  rationale: לְ എന്ന ഉപസർഗം സന്ദേശം ആരോടാണ് പറയേണ്ടതെന്ന് സൂചിപ്പിക്കുന്നു; പേരിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔപചാരിക സന്ദേശസൂത്രം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: സംബന്ധനിർമാണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַעַן אֲשֶׁר
  choice: ചെയ്തതുകൊണ്ട്
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിവചനത്തിന്റെ കാരണത്തെ അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാരണാർഥം നിലനിർത്തുന്നു; വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ ദീർഘവിരാമം ചേർത്തു.
- source_word: הֲרִימֹתִיךָ
  choice: ഞാൻ നിന്നെ ഉയർത്തുകയും
  rationale: רוּם എന്ന ധാതുവിന്റെ ഉയർത്തുക എന്ന രൂപകവും സ്ഥാനോന്നതിയുടെ ആശയവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: מִתּוֹךְ הָעָם
  choice: ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ജനസമൂഹത്തിനുള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ അടുത്തും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: ഭരണാധികാരിയാക്കുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്നെ ഭരണാധികാരിയായി നൽകി’ എന്നാണെങ്കിലും, പദസമുച്ചയം ഔദ്യോഗിക അധികാരസ്ഥാനത്തേക്കുള്ള നിയമനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി നൽകി.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ
  rationale: ദൈവത്തിന്റെ ‘എന്റെ ജനം’ എന്ന അവകാശവാക്കും യൊരോബെയാമിന്റെ അധികാരപരിധിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ഇംഗ്ലീഷ് പരിശോധനാപാളിയിലെ ‘Yahweh’ എന്ന തീരുമാനത്തോട് ഒത്തുപോകുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: נָגִיד എന്ന അധികാരപദത്തിന്റെ വിവർത്തനം
  choice: ഭരണാധികാരി
  alternative: നേതാവ് / പ്രഭു
  rationale: ഇവിടെ ദൈവം നൽകിയ ഔദ്യോഗിക ഭരണാധികാരമാണ് ഉദ്ദേശ്യം. ‘ഭരണാധികാരി’ ആ രാഷ്ട്രീയ അധികാരം വ്യക്തമാക്കുന്നു; ‘പ്രഭു’ അനാവശ്യമായ വംശപരമോ പദവിപരമോ ആയ സൂചനകൾ വരുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ മാന്യമായ പ്രവാചകശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് സന്ദേശസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. വാക്യം കാരണവാക്യമായി അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമം ഉപയോഗിച്ചു; പാദക്കുറിപ്പുകളുടെ അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
