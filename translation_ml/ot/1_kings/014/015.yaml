source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: ml
  text: വെള്ളത്തിൽ ഞാങ്ങണ ആടിയുലയുന്നതുപോലെ യഹ്‌വേ ഇസ്രായേലിനെ അടിക്കും. അവരുടെ പിതാക്കന്മാർക്ക് അവൻ നൽകിയ ഈ നല്ല ദേശത്തുനിന്ന് അവൻ ഇസ്രായേലിനെ വേരോടെ പിഴുതെറിയുകയും നദിക്കപ്പുറം[a] അവരെ ചിതറിക്കുകയും ചെയ്യും. അവർ തങ്ങളുടെ അശേരീം[b] ഉണ്ടാക്കി യഹ്‌വേയെ പ്രകോപിപ്പിച്ചതുകൊണ്ടാണിത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യൂഫ്രട്ടീസ് നദിക്കപ്പുറം’; ഈ സന്ദർഭത്തിൽ ‘നദി’ എന്നു പറയുന്നത് യൂഫ്രട്ടീസിനെയാണ്.
    reason: cross_reference
  - marker: b
    text: എബ്രായത്തിൽ ‘അവരുടെ അശേരീം’; അശേരാ ദേവിയുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുക്കൾ. ഇവയെ സാധാരണയായി മരത്തൂണുകളോ പ്രതിമകളോ ആയി മനസ്സിലാക്കാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: അടിക്കും
  rationale: പ്രവാചകസന്ദർഭത്തിൽ ഭാവികാല വിധിയെ സൂചിപ്പിക്കുന്ന ക്രിയയെ ലളിതവും ശക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: വെള്ളത്തിൽ ഞാങ്ങണ ആടിയുലയുന്നതുപോലെ
  rationale: ജലത്തിൽ സ്ഥിരതയില്ലാതെ ചലിക്കുന്ന ഞാങ്ങണയുടെ ദൃശ്യോപമ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנָתַשׁ
  choice: വേരോടെ പിഴുതെറിയുകയും
  rationale: ദേശത്തുനിന്നുള്ള നീക്കത്തെ വേരോടെ പറിച്ചെടുക്കുന്ന കാർഷികരൂപകമായി സംരക്ഷിക്കുന്നു.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: ഈ നല്ല ദേശം
  rationale: ദൈവം നൽകിയ ഉടമ്പടിദേശത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ 'ദേശം' അനുയോജ്യം.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: അവരുടെ പിതാക്കന്മാർക്ക് അവൻ നൽകിയ
  rationale: എബ്രായത്തിലെ ബന്ധപരവും ഉടമ്പടിപരവുമായ പിതൃപരാമർശം നിലനിർത്തുന്നു.
- source_word: וְזֵרָם
  choice: അവരെ ചിതറിക്കുകയും ചെയ്യും
  rationale: പ്രവാസവിധിയുടെ പശ്ചാത്തലത്തിൽ ജനത്തെ പലിടങ്ങളിലായി വിതറുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: നദിക്കപ്പുറം
  rationale: മൂലപാഠത്തിലെ വിശേഷനാമസദൃശമായ 'നദി' എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: തങ്ങളുടെ അശേരീം ഉണ്ടാക്കി
  rationale: ആരാധനാവസ്തുക്കളുടെ കൃത്യരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം തീർപ്പാക്കാതെ എബ്രായ ബഹുവചനപദം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: യഹ്‌വേയെ പ്രകോപിപ്പിച്ചു
  rationale: വിഗ്രഹാരാധന ദൈവകോപത്തിന് ഇടയാക്കിയെന്ന ക്രിയയുടെ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: '''നദി''യുടെ സൂചിതസ്ഥലം'
  choice: മുഖ്യപാഠത്തിൽ 'നദി'; അടിക്കുറിപ്പിൽ യൂഫ്രട്ടീസ് എന്ന് വിശദീകരണം
  alternative: യൂഫ്രട്ടീസ് നദിക്കപ്പുറം
  rationale: എബ്രായപാഠത്തിന്റെ പദപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാരന് ചരിത്രഭൂമിശാസ്ത്രപരമായ സൂചന നൽകുന്നു.
- issue: אֲשֵׁרֵיהֶם എന്ന ആരാധനാപദം
  choice: അശേരീം
  alternative: അശേരാ-സ്തംഭങ്ങൾ; അശേരാ-പ്രതിമകൾ
  rationale: ഇവ മരംകൊണ്ടുള്ള തൂണുകളോ പ്രതിമകളോ മറ്റു ആരാധനാചിഹ്നങ്ങളോ ആയിരുന്നോ എന്ന അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വിധിപ്രഖ്യാപനത്തിന്റെ ശക്തിയും ഞാങ്ങണയുടെയും വേരോടെ പിഴുതെറിയുന്നതിന്റെയും ദൃശ്യരൂപകങ്ങളും നിലനിർത്തി. സാങ്കേതിക ആരാധനാപദമായ 'അശേരീം' വായനാസഹായിയായ അടിക്കുറിപ്പോടെയാണ് നൽകിയിരിക്കുന്നത്.
