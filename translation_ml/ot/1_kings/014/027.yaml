translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അപരിചിതമായ രാജകീയ പദവി വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ‘ഓട്ടക്കാർ’ എന്ന ഉറവിടരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
