base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: ml
  text: അങ്ങനെ രെഹബെയാം രാജാവ് അവയ്ക്കു പകരം വെങ്കല പരിചകൾ ഉണ്ടാക്കി; രാജകൊട്ടാരം[b] പ്രവേശനകവാടത്തിനു കാവൽ നിന്നിരുന്ന ഓട്ടക്കാരുടെ[a] തലവന്മാരെ അവ ഏൽപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, ‘അംഗരക്ഷകരുടെ തലവന്മാർ.’ ഹീബ്രായിൽ പദശഃ ‘ഓട്ടക്കാരുടെ തലവന്മാർ’ എന്നാണ്; ഇവർ രാജകീയ അംഗരക്ഷകരോ സന്ദേശവാഹകരോ ആയിരുന്നിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘രാജകൊട്ടാരം’ എന്നത് ഹീബ്രായിലെ ‘രാജാവിന്റെ വീട്’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ עשה എന്ന ക്രിയയുടെ നേരായ അർഥം ‘ഉണ്ടാക്കുക’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: രെഹബെയാം രാജാവ്
  rationale: വ്യക്തിനാമത്തിനു ശേഷം സ്ഥാനപ്പേര് ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: תַּחְתָּם
  choice: അവയ്ക്കു പകരം
  rationale: പ്രത്യയം മുൻവാക്യത്തിലെ സ്വർണപരിചകളെ സൂചിപ്പിക്കുന്നു; പകരംവെക്കൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: വെങ്കലപരിചകൾ
  rationale: נְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; പുരാതന ലോഹനിർമാണസന്ദർഭത്തിൽ ‘വെങ്കലം’ യോജിച്ച പൊതുവായ തെരഞ്ഞെടുപ്പാണ്.
- source_word: וְהִפְקִיד עַל יַד
  choice: ഏൽപ്പിച്ചു
  rationale: ഒരു വസ്തു മറ്റൊരാളുടെ ചുമതലയിലാക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שָׂרֵי הָרָצִים
  choice: ഓട്ടക്കാരുടെ പ്രമാണിമാർ
  rationale: ഹീബ്രായിലെ ‘ഓട്ടക്കാർ’ എന്ന പദപ്രയോഗം വ്യാഖ്യാനിച്ച് മറയ്ക്കാതെ നിലനിർത്തുന്നു; שָׂרֵי എന്നതിന്റെ അധികാരസൂചന ‘പ്രമാണിമാർ’ നൽകുന്നു.
- source_word: הַשֹּׁמְרִים
  choice: കാവൽനിന്നിരുന്ന
  rationale: തുടർച്ചയായ ചുമതലയെ സൂചിപ്പിക്കുന്ന പങ്കുപദത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആപേക്ഷികരൂപത്തിൽ നൽകുന്നു.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിന്റെ പ്രവേശനകവാടം
  rationale: പദശഃ ‘രാജാവിന്റെ വീട്’ എന്നത് സന്ദർഭത്തിൽ രാജകൊട്ടാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
