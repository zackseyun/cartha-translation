  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: ml
  text: ദാവീദിന്റെ ഭവനത്തിൽനിന്ന്[a] ഞാൻ രാജ്യം പറിച്ചെടുത്ത് നിനക്കു തന്നു. എന്നാൽ, എന്റെ കല്പനകൾ പാലിക്കുകയും എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു മാത്രം ചെയ്യാൻ പൂർണഹൃദയത്തോടെ എന്റെ പിന്നാലെ നടക്കുകയും[b] ചെയ്ത എന്റെ ദാസനായ ദാവീദിനെപ്പോലെ നീ ആയിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാവീദിന്റെ ഭവനം’ എന്നത് ദാവീദിന്റെ രാജവംശത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘എന്നെ അനുഗമിക്കുകയും.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘എന്റെ പിന്നാലെ നടക്കുകയും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: പറിച്ചെടുത്ത്
  rationale: קרע എന്ന ക്രിയയുടെ ബലപ്രയോഗത്തോടെയുള്ള വേർപെടുത്തൽ എന്ന ദൃശ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘രാജ്യം കീറിയെടുത്തു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ വ്യക്തമാണ്.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: രാഷ്ട്രീയ അധികാരമേഖലയെയും രാജഭരണത്തെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണവുമായ തർജമ.
- source_word: מִבֵּית דָּוִד
  choice: ദാവീദിന്റെ ഭവനത്തിൽനിന്ന്
  rationale: ‘ദാവീദിന്റെ ഭവനം’ എന്ന രാജവംശസൂചകമായ എബ്രായ ശൈലി പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: നിനക്കു തന്നു
  rationale: മുൻകാല ചരിത്രസംഭവത്തെ വിവരിക്കുന്ന ക്രിയാക്രമം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കർമം മുമ്പുള്ള ‘രാജ്യം’ തന്നെയാണ്.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസനായ
  rationale: ദൈവത്തോടുള്ള ആദരണീയമായ ഉടമ്പടിസേവനബന്ധമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്; ‘അടിമ’ എന്നത് സന്ദർഭത്തിന് അനാവശ്യമായ സാമൂഹിക അർഥം നൽകും.
- source_word: שָׁמַר מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ പാലിക്കുകയും
  rationale: ശമർ എന്ന ക്രിയയ്ക്ക് കല്പനകളോടൊപ്പം ‘പാലിക്കുക/അനുസരിക്കുക’ എന്ന അർഥമാണ് സ്വാഭാവികം.
- source_word: הָלַךְ אַחֲרַי
  choice: എന്റെ പിന്നാലെ നടക്കുകയും
  rationale: ‘എന്റെ പിന്നാലെ നടന്നു’ എന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു; അർഥം ‘എന്നെ അനുഗമിച്ചു’ എന്നാണ്.
- source_word: בְּכָל לְבָבוֹ
  choice: പൂർണഹൃദയത്തോടെ
  rationale: വിഭജിക്കപ്പെടാത്ത ആന്തരിക സമർപ്പണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു മാത്രം ചെയ്യാൻ
  rationale: ലക്ഷ്യം/പ്രവണത സൂചിപ്പിക്കുന്ന infinitive രൂപവും רַק എന്ന ‘മാത്രം’ എന്ന നിയന്ത്രണവും ദൈവത്തിന്റെ വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന ‘എന്റെ ദൃഷ്ടിയിൽ’ എന്ന ശൈലിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മറ്റിടങ്ങളിൽ രേഖപ്പെടുത്തിയിരിക്കുന്ന ദാവീദിന്റെ പാപങ്ങൾക്കിടയിലും ഈ വാക്യം അദ്ദേഹത്തെ മാതൃകയായി വിലയിരുത്തുന്നത്
  choice: ഈ വാക്യത്തിലെ ദാവീദിനെക്കുറിച്ചുള്ള ഉടമ്പടിപരമായ അനുകൂല വിലയിരുത്തൽ യാതൊരു ശമനവാക്കും ചേർക്കാതെ നിലനിർത്തി.
  alternative: ‘പൊതുവേ’ അല്ലെങ്കിൽ ‘മിക്കവാറും’ എന്നിങ്ങനെയുള്ള വിശദീകരണപദങ്ങൾ ചേർക്കുക.
  rationale: യൊരോബെയാമിനോടുള്ള വൈരുധ്യത്തിൽ ദാവീദിനെ കല്പനകൾ പാലിച്ചവനും ദൈവദൃഷ്ടിയിൽ ശരിയായതു മാത്രം ചെയ്തവനുമായി പാഠം തന്നെ അവതരിപ്പിക്കുന്നു. മറ്റു ഭാഗങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ ഈ വാക്യത്തിന്റെ വാചകബലം കുറയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ രാജവംശപ്രയോഗവും ‘പിന്നാലെ നടക്കുക’ എന്ന ഉടമ്പടിരൂപകവും പ്രധാനപാഠത്തിൽ നിലനിർത്തി; അവയുടെ അർഥം അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
