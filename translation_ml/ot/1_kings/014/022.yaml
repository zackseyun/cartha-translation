  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: ml
  text: യഹൂദാ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; അവർ ചെയ്ത പാപങ്ങളാൽ, അവരുടെ പിതാക്കന്മാർ ചെയ്ത എല്ലാറ്റിനെക്കാളും അധികമായി അവർ അവിടുത്തെ അസൂയ ഉണർത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവിടുത്തെ അസൂയയ്ക്ക് ഇടയാക്കി.” ഇവിടെ എബ്രായം ഉപയോഗിക്കുന്നത് യഹൂദായുടെ അവിശ്വസ്തതയോടുള്ള യഹോവയുടെ ഉടമ്പടിബന്ധപരമായ അസൂയയെ സൂചിപ്പിക്കുന്ന ഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: യഹൂദാ
  rationale: തെക്കൻ രാജ്യത്തെയും അതിലെ ജനങ്ങളെയും കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്ഥലനാമം. അതുകൊണ്ടാണ് തുടർന്നുള്ള എബ്രായ ക്രിയ ബഹുവചനത്തിലുള്ളത്.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: עשה + הרע എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും നാമരൂപത്തേക്കാൾ പ്രവൃത്തിയുടെ ദുഷ്ടസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: അവിടുത്തെ അസൂയയ്ക്കു പ്രകോപിപ്പിച്ചു
  rationale: קנא എന്ന പദത്തിലെ ഉടമ്പടിബന്ധപരമായ അസൂയ എന്ന ആശയം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; സാധാരണ പാപകരമായ അസൂയയാണ് ഉദ്ദേശ്യമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ ചെയ്തതിനെക്കാളെല്ലാം അധികമായി
  rationale: താരതമ്യാർഥമുള്ള מִן + כֹּל ഘടനയും മുൻതലമുറകളെ സൂചിപ്പിക്കുന്ന אֲבֹתָם എന്ന പദവും ഉറവിടത്തോട് അടുത്തുനിന്ന് നൽകുന്നു.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: അവർ ചെയ്ത പാപങ്ങളാൽ
  rationale: എബ്രായത്തിലെ ഒരേ ധാതുവിലുള്ള നാമ-ക്രിയ ആവർത്തനം മലയാളത്തിൽ അനാവശ്യമായി കഠിനമാകാതെ, בְּ എന്ന ഉപകരണ/കാരണബന്ധം ‘-ആൽ’ വഴി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ അസൂയയെക്കുറിച്ചുള്ള ഭാഷ
  choice: അവിടുത്തെ അസൂയയ്ക്കു പ്രകോപിപ്പിച്ചു
  alternative: അവിടുത്തെ അസൂയ ഉണർത്തി / അവിടുത്തെ തീക്ഷ്ണത ഉണർത്തി
  rationale: യഹൂദയുടെ അവിശ്വസ്തതയോടുള്ള യഹോവയുടെ ഉടമ്പടിബന്ധപരമായ പ്രതികരണമാണ് വാക്യം വിവരിക്കുന്നത്. ‘അസൂയ’ എന്ന ബൈബിൾപരമായ ആശയം ‘കോപം’ അല്ലെങ്കിൽ ‘തീക്ഷ്ണത’ എന്നു മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; എന്നാൽ അത് പാപകരമായ ഈർഷ്യയല്ലെന്ന് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും മനസ്സിലാകുന്ന ശൈലി. യഹൂദാ എന്ന ഏകവചന കൂട്ടനാമത്തിനുശേഷം ജനങ്ങളെ സൂചിപ്പിക്കാൻ ‘അവർ’ ഉപയോഗിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന കർമരൂപമായി ആദരസൂചകമായ ‘അവിടുത്തെ’ തിരഞ്ഞെടുത്തു.
