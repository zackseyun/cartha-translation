  text: എന്നാൽ നീ എഴുന്നേറ്റ് നിന്റെ വീട്ടിലേക്കു പോകുക. നിന്റെ കാലുകൾ നഗരത്തിൽ പ്രവേശിക്കുമ്പോൾ[a] കുട്ടി മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നിന്റെ കാലുകൾ നഗരത്തിൽ പ്രവേശിക്കുമ്പോൾ.’ എത്തിച്ചേരുന്ന നിമിഷത്തെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ‘നിന്റെ കാലുകൾ’ എന്ന പ്രയോഗം ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: എന്നാൽ നീ
  rationale: സംയോജകപദത്തോടുകൂടിയ സ്വതന്ത്ര രണ്ടാംപുരുഷ ഏകവചന സ്ത്രീലിംഗ സർവനാമം സ്ത്രീയെ പ്രത്യേകം അഭിസംബോധന ചെയ്യുന്ന വൈരുധ്യാത്മക ഊന്നൽ നൽകുന്നു.
- source_word: ק֖וּמִי
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം; തുടർന്നുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: לְכִ֣י
  choice: പോകുക
  rationale: הלך എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപം; ലളിതവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: നിന്റെ വീട്ടിലേക്കു
  rationale: בַּיִת ഇവിടെ ലക്ഷ്യസ്ഥാനമായ വീടിനെയോ ഭവനത്തെയോ സൂചിപ്പിക്കുന്നു; ദിശാബോധം '-ലേക്കു' വഴി വ്യക്തമാക്കുന്നു.
- source_word: בְּ/בֹאָ֥ה
  choice: പ്രവേശിക്കുമ്പോൾ
  rationale: ב എന്ന ഉപസർഗവും בוא എന്ന ക്രിയയുടെ infinitive construct രൂപവും ചേർന്ന് സമയബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: רַגְלַ֛יִ/ךְ
  choice: നിന്റെ കാലുകൾ
  rationale: എബ്രായത്തിലെ ശരീരാവയവചിത്രം നിലനിർത്തുന്നു; എത്തിച്ചേരുന്ന നിമിഷത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: הָ/עִ֖ירָ/ה
  choice: നഗരത്തിൽ
  rationale: ദിശാസൂചകമായ ה ചേർന്നതിനാൽ നഗരത്തിനകത്തേക്കുള്ള പ്രവേശനമാണ് അർഥം; 'പ്രവേശിക്കുക' എന്ന ക്രിയയോടൊപ്പം 'നഗരത്തിൽ' സ്വാഭാവികമാണ്.
- source_word: וּ/מֵ֥ת
  choice: മരിക്കും
  rationale: പ്രവചനസന്ദർഭത്തിലെ ഈ ക്രിയാരൂപം ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הַ/יָּֽלֶד
  choice: കുട്ടി
  rationale: יֶלֶד എന്നത് കുട്ടി, ബാലൻ എന്നീ അർഥങ്ങൾക്കാകാം; ഇവിടെ ലിംഗത്തേക്കാൾ പരാമർശിക്കപ്പെട്ട കുട്ടിയാണ് പ്രധാനം.
