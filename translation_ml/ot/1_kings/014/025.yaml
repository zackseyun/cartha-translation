  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: ml
  text: രെഹബെയാം രാജാവിന്റെ വാഴ്ചയുടെ അഞ്ചാം വർഷത്തിൽ, ഈജിപ്തിലെ രാജാവായ ശീശക്ക് യെരൂശലേമിനെതിരെ പടയേറി വന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെരൂശലേമിനെതിരെ കയറിച്ചെന്നു.’ പ്രമുഖമായ ഒരു നഗരത്തിലേക്കുള്ള സൈനിക മുന്നേറ്റത്തെ സൂചിപ്പിക്കാൻ എബ്രായത്തിൽ ‘കയറിപ്പോകുക/കയറിവരുക’ എന്ന പ്രയോഗം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה ആഖ്യാനത്തിലെ പുതിയ സംഭവവികാസം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ അധികമായ ‘അപ്പോൾ’ അല്ലെങ്കിൽ പഴഞ്ചൻ ‘സംഭവിച്ചു’ ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ഈ പ്രവർത്തനം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: രെഹബെയാം രാജാവിന്റെ വാഴ്ചയുടെ അഞ്ചാം വർഷത്തിൽ
  rationale: ഇത് രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്ന പതിവു പ്രയോഗമാണ്. ‘വാഴ്ചയുടെ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ വർഷം രാജാവിന്റെ ഭരണകാലത്തേതാണെന്ന് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עָלָה ... עַל
  choice: എതിരെ പടയേറി വന്നു
  rationale: ഈ സൈനികപ്രയോഗം ഒരു നഗരത്തിനെതിരെ മുന്നേറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പടയേറി വന്നു’ ദിശാബോധവും വൈരപരമായ സൈനികനീക്കവും നിലനിർത്തുന്നു; ‘ആക്രമിച്ചു’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ നിർണായകമായിരിക്കും.
- source_word: שושק
  choice: ശീശക്ക്
  rationale: എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള പരമ്പരാഗത ബൈബിൾ ലിപ്യന്തരണം സ്വീകരിച്ചു; ചരിത്രപരമായ ഈജിപ്ഷ്യൻ തിരിച്ചറിയലായ ‘ഷോഷെങ്ക്’ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തുരാജാവായ
  rationale: ശീശക്കിന്റെ പദവിയും രാജ്യവും വ്യക്തമാക്കുന്ന സംയുക്തനാമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: יְרוּשָׁלִָם
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതവും മൂലരൂപത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
