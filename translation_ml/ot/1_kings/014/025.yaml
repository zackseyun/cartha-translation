  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. രാജവാഴ്ചാ തീയതി സ്വാഭാവികമായി വ്യക്തമാക്കുകയും സൈനിക മുന്നേറ്റത്തിന്റെ എബ്രായ ദിശാപ്രയോഗം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ക്രിയാപ്രയോഗത്തിനു പിന്നാലെ വെച്ചു.
