id: 1KI.14.4
reference: 1 Kings 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תַּ֤עַשׂ כֵּן֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תָּ֨קָם֙ וַ/תֵּ֣לֶךְ שִׁלֹ֔ה וַ/תָּבֹ֖א בֵּ֣ית אֲחִיָּ֑ה וַ/אֲחִיָּ֨הוּ֙ לֹֽא יָכֹ֣ל לִ/רְא֔וֹת כִּ֛י קָ֥מוּ עֵינָ֖י/ו מִ/שֵּׂיבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: ml
  text: യൊരോബെയാമിന്റെ ഭാര്യ അങ്ങനെതന്നെ ചെയ്തു. അവൾ എഴുന്നേറ്റ് ശീലോവിലേക്കു പോയി അഹീയാവിന്റെ വീട്ടിലെത്തി. അഹീയാവിന് കാണാൻ കഴിഞ്ഞില്ല; വാർധക്യം നിമിത്തം അദ്ദേഹത്തിന്റെ കണ്ണുകൾ കാഴ്ചയറ്റുപോയിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വാർധക്യം നിമിത്തം അദ്ദേഹത്തിന്റെ കണ്ണുകൾ നിന്നിരുന്നു”; വാർധക്യത്താൽ ഉണ്ടായ കാഴ്ചനഷ്ടത്തെ വിവരിക്കുന്ന ഒരു എബ്രായ പ്രയോഗം.
    reason: മൂലപാഠത്തിലെ അസാധാരണമായ ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുകയും പ്രധാനപാഠത്തിലെ പ്രവർത്തനാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: അങ്ങനെതന്നെ ചെയ്തു
  rationale: മുമ്പു നൽകിയ നിർദേശം അവൾ അനുസരിച്ചുവെന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭാര്യ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ നൽകി.
- source_word: וַתָּקָם
  choice: അവൾ എഴുന്നേറ്റ്
  rationale: തുടർന്നുള്ള യാത്രയിലേക്കു നയിക്കുന്ന ആഖ്യാനക്രമം നിലനിർത്തുന്ന ലളിതമായ പ്രയോഗം.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: ശീലോവിലേക്കു പോയി
  rationale: ചലനവും ലക്ഷ്യസ്ഥാനവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: അഹീയാവിന്റെ വീട്ടിലെത്തി
  rationale: വീട്ടിനകത്തു കടന്നുവെന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കാതെ, അവിടെ എത്തിയെന്ന മൂലപാഠത്തിന്റെ അർഥപരിധി സൂക്ഷിക്കുന്നു.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: അദ്ദേഹത്തിനു കാണാൻ കഴിഞ്ഞിരുന്നില്ല
  rationale: കാണാനുള്ള കഴിവില്ലായ്മ നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: קָמוּ עֵינָיו
  choice: കണ്ണുകൾ കാഴ്ചയറ്റുപോയിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘കണ്ണുകൾ നിന്നുപോയി’ എന്ന അപൂർവമായ പ്രയോഗം വാർധക്യജന്യമായ കാഴ്ചനഷ്ടത്തെ സൂചിപ്പിക്കുന്നു; പ്രധാനപാഠത്തിൽ അതിന്റെ പ്രവർത്തനാർഥം നൽകി, ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מִשֵּׂיבוֹ
  choice: വാർധക്യം നിമിത്തം
  rationale: കാരണം സൂചിപ്പിക്കുന്ന മുൻപ്രത്യയവും ‘വാർധക്യം’ എന്ന നാമവും സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പേരുകൾ സാധാരണ മലയാള ബൈബിൾരീതിയോടു ചേർന്ന രൂപങ്ങളിൽ നൽകി; ആവർത്തനഭാരം ഒഴിവാക്കിക്കൊണ്ട് എബ്രായ വാക്യക്രമത്തിലെ സംഭവപരമ്പര നിലനിർത്തി.
