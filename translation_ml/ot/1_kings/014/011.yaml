id: 1KI.14.11
reference: 1 Kings 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: ml
  text: യൊരോബെയാമിന്റെ വീട്ടിൽപ്പെട്ട ആരെങ്കിലും പട്ടണത്തിൽ മരിച്ചാൽ, നായ്ക്കൾ അവനെ തിന്നും; അവരിൽ ആരെങ്കിലും വയലിൽ മരിച്ചാൽ, ആകാശത്തിലെ പക്ഷികൾ അവനെ തിന്നും; കാരണം യഹ്‌വെ അരുളിച്ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: യൊരോബെയാമിന്റെ വീട്ടിൽപ്പെട്ട ആരെങ്കിലും ... മരിച്ചാൽ
  rationale: എബ്രായപ്രയോഗം യൊരോബെയാം വ്യക്തിപരമായി മരിക്കുന്നതിനെക്കുറിച്ചല്ല, അവന്റെ കുടുംബത്തിലോ രാജവംശത്തിലോ ഉൾപ്പെട്ട ഏതൊരാളെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘വീട്ടിൽപ്പെട്ട ആരെങ്കിലും’ എന്നത് ഈ ബന്ധവും അർഥവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּעִיר
  choice: പട്ടണത്തിൽ
  rationale: നിർദ്ദിഷ്ട സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ വിവർത്തനം; വയലുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: നായ്ക്കൾ തിന്നും
  rationale: אָכַל എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘തിന്നുക’ നിലനിർത്തുന്നു; മൂലപാഠത്തിലില്ലാത്ത തീവ്രത ചേർക്കുന്നില്ല.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: ആരെങ്കിലും വയലിൽ മരിച്ചാൽ
  rationale: ആദ്യ ഉപവാക്യത്തിനു സമാന്തരമായി വിതരണാർഥം വ്യക്തമാക്കുന്നു. שָׂדֶה എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വയൽ’ സ്വീകരിച്ചു.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: עוֹף എന്ന സമൂഹവാചകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി; הַשָּׁמָיִם എന്നത് ‘ആകാശം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: യഹ്‌വെ അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: כִּי നൽകുന്ന വിധിപ്രഖ്യാപനത്തിന്റെ അടിസ്ഥാനവും ഉറപ്പും മലയാളത്തിലെ അവസാന സ്വതന്ത്രവാക്യത്തിലൂടെ നിലനിർത്തുന്നു. പൂർത്തിക്രിയയായ דִּבֵּר പ്രഖ്യാപനത്തിന്റെ ഉറപ്പിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: വിധിപ്രഖ്യാപനത്തിന്റെ ഉറപ്പ്
  choice: അരുളിച്ചെയ്തിരിക്കുന്നു
  alternative: പറഞ്ഞു; അരുളിച്ചെയ്തു
  rationale: എബ്രായത്തിലെ പൂർത്തിക്രിയ പ്രഖ്യാപനം ഇതിനകം നിശ്ചയിക്കപ്പെട്ടതാണെന്ന ഭാവം നൽകുന്നു; മലയാളത്തിലെ പൂർണ്ണകാലപ്രയോഗം അത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. കടുത്ത വിധിയുടെ ദൃശ്യഭാവം മൃദൂകരിക്കാതെയും ‘വിഴുങ്ങും’ പോലുള്ള അധിക തീവ്രത ചേർക്കാതെയും നിലനിർത്തി. രണ്ട് സമാന്തര ഉപവാക്യങ്ങളിലും ‘ആരെങ്കിലും ... മരിച്ചാൽ’ എന്ന ഘടന ഉപയോഗിച്ച് എബ്രായത്തിലെ വിതരണാർഥം വ്യക്തമാക്കി.
