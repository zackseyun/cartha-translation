source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: ml
  text: അവരും തങ്ങൾക്കായി ഉയർന്ന ആരാധനാസ്ഥലങ്ങളും സ്തംഭങ്ങളും അശേരാപ്രതീകങ്ങളും[a] എല്ലാ ഉയർന്ന കുന്നുകളിലും എല്ലാ പച്ചപ്പാർന്ന വൃക്ഷങ്ങളുടെയും കീഴിലും പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശേരകൾ’ അല്ലെങ്കിൽ ‘അശേരാത്തൂണുകൾ’; എബ്രായപദം അശേരയുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പണിയുക’ നിലനിർത്തുന്നു; ആരാധനാസ്ഥലങ്ങളും അവയോടു ബന്ധപ്പെട്ട സംവിധാനങ്ങളും സ്ഥാപിച്ചതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: גַם הֵמָּה
  choice: അവരും
  rationale: മുൻസന്ദർഭത്തോടുള്ള കൂട്ടിച്ചേർക്കലും ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לָהֶם
  choice: തങ്ങൾക്കായി
  rationale: ഇവ സ്വന്തം ഉപയോഗത്തിനായി സ്ഥാപിച്ചതെന്ന പ്രത്യാവർത്തക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന ബാമോത്തിന്റെ ആരാധനാസംബന്ധിയായ അർഥവും ഉയർന്ന സ്ഥലമെന്ന ഘടകവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: מַצֵּבוֹת
  choice: സ്തംഭങ്ങൾ
  rationale: സ്ഥാപിച്ചുനിർത്തിയ ആരാധനാപരമായ കല്ലുകളെയോ സ്തംഭങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദം; പട്ടികയുടെ സന്ദർഭം അവയുടെ പൂജാപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֵׁרִים
  choice: അശേരാപ്രതീകങ്ങൾ
  rationale: അശേരയുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുക്കളെയാണ് ഇവിടെ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; അവ നിർബന്ധമായും മരത്തൂണുകളായിരുന്നുവെന്ന് മുഖ്യപാഠത്തിൽ തീർച്ചപ്പെടുത്തുന്നില്ല.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: എല്ലാ ഉയർന്ന കുന്നുകളിലും
  rationale: ഭൂപ്രകൃതിയും ആവർത്തനാത്മകമായ ‘എല്ലാ’ എന്ന വാചകശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: എല്ലാ തഴച്ചുവളരുന്ന മരങ്ങളുടെയും കീഴിലും
  rationale: רַעֲנָן എന്നതിലെ പച്ചപ്പും സമൃദ്ധമായ ഇലച്ചാർത്തും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: אֲשֵׁרִים എന്നത് അശേരാദേവിയെയാണോ അവളുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുക്കളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: അശേരയുമായി ബന്ധപ്പെട്ട പൂജാവസ്തുക്കൾ എന്ന നിലയിൽ ‘അശേരാപ്രതീകങ്ങൾ’
  alternative: അശേരകൾ; അശേരാത്തൂണുകൾ; അശേരാവിഗ്രഹങ്ങൾ
  rationale: ‘പൂജാഗിരികൾ’, ‘സ്തംഭങ്ങൾ’ എന്നിവയ്ക്കൊപ്പമുള്ള പട്ടികയിൽ ഭൗതിക പൂജാവസ്തുക്കളാണ് കൂടുതൽ സാധ്യത. എന്നാൽ അവയുടെ കൃത്യരൂപം ഉറപ്പില്ലാത്തതിനാൽ ‘തൂണുകൾ’ എന്ന് മുഖ്യപാഠത്തിൽ പരിമിതപ്പെടുത്താതെ മൂലപദത്തിലെ ബന്ധവും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗതമായി പരിചിതമായെങ്കിലും അസ്പഷ്ടമാകാവുന്ന ‘പൂജാഗിരികൾ’ സന്ദർഭാനുസൃതമായി ഉപയോഗിച്ചു; അശേരിം എന്ന പദത്തിന്റെ കൃത്യമായ വസ്തുരൂപത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
