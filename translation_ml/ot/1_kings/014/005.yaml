  to: 'യഹ്‌വെ അഹീയാവിനോടു പറഞ്ഞു: “ഇതാ, യൊരോബെയാമിന്റെ ഭാര്യ രോഗിയായിരിക്കുന്ന തന്റെ മകനെക്കുറിച്ച് നിന്നോട് അന്വേഷിക്കാൻ വരുന്നു. നീ അവളോട് ഇങ്ങനെയും അങ്ങനെയും പറയണം.[a] അവൾ വരുമ്പോൾ, തിരിച്ചറിയപ്പെടാതിരിക്കാൻ അവൾ വേഷംമാറിയിരിക്കും.[b]”'
