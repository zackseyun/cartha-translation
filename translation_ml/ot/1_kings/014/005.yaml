  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: ml
  text: 'യഹ്‌വെ അഹീയാവിനോടു പറഞ്ഞു: “ഇതാ, യൊരോബെയാമിന്റെ ഭാര്യ രോഗിയായിരിക്കുന്ന തന്റെ മകനെക്കുറിച്ച് നിന്നോട് അന്വേഷിക്കാൻ വരുന്നു. നീ അവളോട് ഇങ്ങനെയും അങ്ങനെയും പറയണം.[a] അവൾ വരുമ്പോൾ, തിരിച്ചറിയപ്പെടാതിരിക്കാൻ അവൾ വേഷംമാറിയിരിക്കും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഇപ്രകാരവും അപ്രകാരവും’; ഉള്ളടക്കം ഇവിടെ ഇനിയും വ്യക്തമാക്കിയിട്ടില്ലാത്ത ഒരു നിർദ്ദിഷ്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മറ്റൊരു സ്ത്രീയാണെന്നു നടിച്ചുകൊണ്ടായിരിക്കും വരുന്നത്.’ തിരിച്ചറിയപ്പെടാതിരിക്കാൻ സ്വയം മറച്ചുവയ്ക്കുക എന്ന ആശയം ഹീബ്രു ക്രിയയ്ക്കുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ יהוה-യെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ‘കർത്താവ്’ എന്ന സ്ഥാനപദമോ ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപമോ ഉപയോഗിച്ച് മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കുന്നില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തെ മുന്നോട്ടുവയ്ക്കുകയും ചെയ്യുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: בָּאָה
  choice: വരുന്നു
  rationale: സന്ദർഭത്തിൽ അടുത്തുതന്നെ സംഭവിക്കാനിരിക്കുന്ന വരവിനെ സൂചിപ്പിക്കുന്ന രൂപം.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל־בְּנָהּ
  choice: തന്റെ മകനെക്കുറിച്ച് നിന്നോട് അന്വേഷിക്കാൻ
  rationale: דרשׁ എന്ന ക്രിയയുടെ അന്വേഷിക്കുക/ചോദിച്ചറിയുക എന്ന അർഥവും പ്രവാചകനോടുള്ള ആലോചനയുടെ സന്ദർഭവും ലളിതമായി നിലനിർത്തുന്നു; דָּבָר-നെ നിർബന്ധമായി ‘അരുളപ്പാട്’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: כִּי חֹלֶה הוּא
  choice: രോഗിയായിരിക്കുന്ന
  rationale: മകനെക്കുറിച്ചുള്ള അന്വേഷണത്തിന്റെ കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: כָּזֹה וְכָזֶה
  choice: ഇന്നിന്നവിധം
  rationale: തുടർന്ന് വ്യക്തമാക്കപ്പെടാനിരിക്കുന്ന നിർദ്ദിഷ്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സമാനപ്രയോഗം.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: നീ അവളോട് … പറയണം
  rationale: നിർദേശാത്മകമായ ഭാവാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: തിരിച്ചറിയപ്പെടാതിരിക്കാൻ വേഷം മാറിയിട്ടായിരിക്കും വരുന്നത്
  rationale: സ്വയം തിരിച്ചറിയപ്പെടാത്തവിധമാക്കുക എന്ന ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനിഷ്ഠ അർഥവും വരവിന്റെ സമയത്തെ വേഷമാറ്റവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ വ്യക്തിനാമമായി നിലനിർത്തുകയും ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുത്തായി പ്രതിനിധീകരിക്കുകയും ചെയ്യുന്നു.
- issue: דָּבָר എന്ന പദം പ്രവാചകീയ ‘അരുളപ്പാട്’ ആണോ പൊതുവായ കാര്യം/വിവരമാണോ
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകമായി ‘അരുളപ്പാട്’ എന്നു ചേർക്കാതെ ‘നിന്നോട് അന്വേഷിക്കാൻ’
  alternative: നിന്നിൽനിന്ന് ഒരു അരുളപ്പാട് തേടാൻ
  rationale: പ്രവാചകനോടുള്ള അന്വേഷണസന്ദർഭം അരുളപ്പാടിനെ സൂചിപ്പിക്കാമെങ്കിലും, דָּבָר എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിച്ച് വ്യാഖ്യാനം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘ഇന്നിന്നവിധം’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ഊന്നലും സൂചനാത്മകതയും നിലനിർത്തുന്നു; അതേസമയം അതിപുരാതനമോ സഭാവിഭാഗസവിശേഷമോ ആയ ഭാഷ ഒഴിവാക്കുന്നു.
