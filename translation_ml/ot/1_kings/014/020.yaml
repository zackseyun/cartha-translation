  terminology: The established Malayalam name forms ‘യൊരോബെയാം’ and ‘നാദാബ്’ are suitable. ‘രാജാവായി വാണ കാലം’ is acceptable, though ‘രാജാവായി ഭരിച്ച കാലം’ is more direct modern standard Malayalam for the regnal formula.
