base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: ml
  text: യൊരോബെയാം രാജാവായി ഭരിച്ച കാലം ഇരുപത്തിരണ്ടു വർഷമായിരുന്നു. പിന്നെ അവൻ തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നു[a]. അവന്റെ മകനായ നാദാബ് അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ പരമ്പരാഗതമായി, “തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു.” ഈ ഹീബ്രായ പ്രയോഗം രാജകീയ പിന്തുടർച്ചാവിവരണങ്ങളിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന ഒരു പതിവു സൂത്രമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: രാജാവായി വാണ കാലം
  rationale: ഹീബ്രായ രാജഭരണസംഗ്രഹ സൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ആരംഭത്തിലെ സംയോജകത്തെ കൃത്രിമമായി നിലനിർത്തുന്നില്ല.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ഇരുപത്തിരണ്ടു വർഷം
  rationale: ഹീബ്രായ സംഖ്യാവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന രാജകീയ വിവരണസൂത്രത്തിലെ രൂപകം നിലനിർത്തുന്നു; വെറും ‘മരിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് മൂലഭാഷയുടെ ഭാവം ഇല്ലാതാക്കുന്നില്ല.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ
  choice: അവന്റെ മകനായ നാദാബ് ... രാജാവായി
  rationale: ഇവിടെ ക്രിയ ഭരണകാലദൈർഘ്യത്തേക്കാൾ അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജാവായി’ എന്നു നൽകി.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയിൽ ഒരാളുടെ സ്ഥാനത്ത് മറ്റൊരാൾ അധികാരമേൽക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: രാജകീയ സൂത്രത്തിലെ മരണപ്രയോഗം
  choice: ‘പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്ന ഹീബ്രായ രൂപകം നിലനിർത്തി.
  alternative: ‘മരിച്ചു’ അല്ലെങ്കിൽ ‘പിതാക്കന്മാരോടുകൂടെ കിടന്നു’.
  rationale: ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ആഖ്യാനപ്രയോഗമാണ്; പരലോകത്തെക്കുറിച്ചുള്ള വികസിത ഉപദേശമായി അതിനെ വ്യാഖ്യാനിക്കാതെയും രൂപകം പരത്തിക്കളയാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജകീയ സൂത്രഭാഷയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതനമായ പദക്രമം ഒഴിവാക്കി.
