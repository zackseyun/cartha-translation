  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: രെഹബെയാമിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദാരാജാക്കന്മാരുടെ വാർഷികവൃത്താന്തത്തിൽ.’ ‘ദിനവൃത്താന്തം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ പ്രയോഗം സംഭവങ്ങളുടെ രാജകീയ രേഖയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: രെഹബെയാമിന്റെ മറ്റു പ്രവൃത്തികളും
  rationale: יֶתֶר എന്നത് ശേഷിക്കുന്ന ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; രാജാവിനെക്കുറിച്ചുള്ള ചരിത്രരചനാസൂത്രത്തിൽ דִּבְרֵי എന്നത് വെറും വാക്കുകളല്ല, അദ്ദേഹത്തിന്റെ കാര്യങ്ങളെയോ പ്രവൃത്തികളെയോ ആണ് സൂചിപ്പിക്കുന്നത്. സ്വാഭാവികമായ മലയാളത്തിനായി ‘മറ്റു പ്രവൃത്തികൾ’ എന്നു നൽകി.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: עשה എന്ന ക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുകയും നേട്ടമോ ധാർമിക വിലയിരുത്തലോ അധികമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ നിഷേധാത്മക ചോദ്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: עַל סֵפֶר എന്നത് രേഖയെ ഉദ്ധരിക്കുന്ന ഈ സാഹചര്യത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നാണ് സ്വാഭാവികം. דִּבְרֵי הַיָּמִים രാജകീയ സംഭവരേഖയെയോ വാർഷികവൃത്താന്തത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ
  rationale: לְ ഇവിടെ രേഖയുടെ ശീർഷകത്തിലെ ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഉടമസ്ഥബന്ധരൂപം യോജിക്കുന്നു.
- source_word: רְחַבְעָם
  choice: രെഹബെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണം.
