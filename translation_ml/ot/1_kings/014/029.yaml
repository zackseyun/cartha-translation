translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടക്കസംയോജകമായ וְ-യ്ക്ക് അനാവശ്യമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല; ചോദ്യരൂപവും രേഖാപരാമർശവും സംരക്ഷിച്ചു.
