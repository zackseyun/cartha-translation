    issue: «അടകൾ» is overly specific for נִקֻּדִים.
    rationale: The Hebrew term is rare and its precise food type is uncertain. In Malayalam, «അട» identifies a recognizable, culturally particular item; the accompanying footnote cannot fully remove that unwarranted specificity from the main text.
