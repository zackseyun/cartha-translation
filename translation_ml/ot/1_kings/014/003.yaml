source:
  edition: WLC
  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: ml
  text: പത്ത് അപ്പവും ചില പലഹാരങ്ങളും ഒരു ഭരണി തേനും കൈയിൽ എടുത്ത് അവന്റെ അടുക്കൽ ചെല്ലുക. ബാലന് എന്തു സംഭവിക്കുമെന്ന് അവൻ നിന്നോടു പറയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: പത്ത് അപ്പം
  rationale: לֶחֶם ഇവിടെ എണ്ണത്തോടുകൂടെ വരുന്നതിനാൽ പൊതുവായ ‘ഭക്ഷണം’ എന്നതിനെക്കാൾ അപ്പത്തിന്റെ പത്ത് വേർതിരിച്ച അളവുകളെയോ അപ്പങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘പത്ത് അപ്പം’ എന്നു നൽകി.
- source_word: נִקֻּדִים
  choice: കുറെ അടകൾ
  rationale: ഈ അപൂർവ പദം ഒരു പ്രത്യേകതരം ചെറിയ അപ്പമോ പലഹാരമോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; കൃത്യമായ ഇനം അനിശ്ചിതമായതിനാൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ‘അടകൾ’ ഉപയോഗിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: ഒരു ഭരണി തേൻ
  rationale: בַּקְבֻּק ഒരു ചെറുപാത്രത്തെയും דְּבַשׁ തേനും സൂചിപ്പിക്കുന്നു; ‘ഒരു ഭരണി തേൻ’ സ്വാഭാവികവും മൂലത്തിന്റെ അർത്ഥത്തോട് അടുത്തതുമാണ്.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: ബാലന് എന്തു സംഭവിക്കും
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ ഭാവികാല അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; രോഗിയായ കുട്ടിയുടെ അന്തിമഫലം മുൻകൂട്ടി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ബാലന്റെ ഭാവിയെക്കുറിച്ചുള്ള പ്രവചനത്തിന്റെ ഉള്ളടക്കം
  choice: ‘ബാലന് എന്തു സംഭവിക്കുമെന്ന്’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ‘ബാലൻ ജീവിക്കുമോ മരിക്കുമോ’ എന്നിങ്ങനെ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം ഫലം വ്യക്തമാക്കാതെ ‘എന്തു സംഭവിക്കും’ എന്നു മാത്രം പറയുന്നു; തുടർന്നുള്ള വെളിപ്പെടുത്തൽ മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കാൻ ഈ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. സ്ത്രീയോടുള്ള ഏകവചന അഭിസംബോധന മലയാളത്തിൽ പ്രത്യേകം ലിംഗചിഹ്നമില്ലാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
