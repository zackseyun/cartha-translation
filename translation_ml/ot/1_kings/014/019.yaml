translation:
  language: ml
  text: യൊരോബെയാമിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ[a]—അവൻ എങ്ങനെ യുദ്ധം ചെയ്തുവെന്നും എങ്ങനെ ഭരിച്ചുവെന്നും—ഇതാ, അവ ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തഗ്രന്ഥത്തിൽ[b] എഴുതപ്പെട്ടിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യൊരോബെയാമിന്റെ ശേഷിച്ച കാര്യങ്ങൾ.” രാജഭരണത്തെ സംഗ്രഹിക്കുന്ന ഈ പ്രയോഗത്തിൽ രാജാവിന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളും ഭരണകാര്യങ്ങളുമാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഇത് ഒരു ഔദ്യോഗിക രാജവൃത്താന്തമോ ചരിത്രരേഖയോ ആണ്; ബൈബിളിലെ 1–2 ദിനവൃത്താന്തങ്ങൾ അല്ല.
    reason: cross_reference
  - marker: c
    text: 'എബ്രായത്തിൽ: “ഇതാ, അവ എഴുതപ്പെട്ടിരിക്കുന്നു.” അവ രേഖപ്പെടുത്തിയിരിക്കുന്നുവെന്ന പ്രസ്താവനയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: ദִּבְרֵי എന്നതിന്റെ അക്ഷരാർഥം ‘കാര്യങ്ങൾ/വാക്കുകൾ’ എന്നാണെങ്കിലും, രാജഭരണസംഗ്രഹസൂത്രത്തിൽ അത് രാജാവിന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘ശേഷിച്ച പ്രവൃത്തികൾ’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר נִלְחַם
  choice: അവൻ എങ്ങനെ യുദ്ധം ചെയ്തുവെന്നും
  rationale: נלחם എന്നത് ‘യുദ്ധം ചെയ്യുക/പോരാടുക’ എന്നാണ്. אֲשֶׁר ഇവിടെ പ്രവൃത്തികളുടെ വിശദീകരണം അവതരിപ്പിക്കുന്നതിനാൽ ‘എങ്ങനെ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: എങ്ങനെ ഭരിച്ചുവെന്നും
  rationale: מָלַךְ ഇവിടെ ‘രാജാവായി ഭരിക്കുക’ എന്ന അർഥത്തിലാണ്; സമാന്തരഘടന നിലനിർത്താൻ ‘എങ്ങനെ ഭരിച്ചുവെന്നും’ എന്ന് നൽകി.
- source_word: הִנָּם כְּתוּבִים
  choice: ഇതാ, അവ ... എഴുതിയിരിക്കുന്നു
  rationale: הִנָּם തുടർന്നുവരുന്ന രേഖയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന അവതരണപദമാണ്. ‘ഇതാ’ അതിന്റെ വ്യവഹാരശക്തി നിലനിർത്തുന്നു; ബഹുവചനസൂചന ‘അവ’യിൽ പ്രകടമാണ്.
- source_word: עַל סֵפֶר
  choice: ഗ്രന്ഥത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഗ്രന്ഥത്തിന്മേൽ/ചുരുളിന്മേൽ’ എന്നായാലും, രേഖപ്പെടുത്തലിനെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളപ്രയോഗം ‘ഗ്രന്ഥത്തിൽ എഴുതിയിരിക്കുന്നു’ എന്നതാണ്.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തഗ്രന്ഥം
  rationale: ഈ സ്ഥിരപ്രയോഗം ഇസ്രായേൽരാജാക്കന്മാരെക്കുറിച്ചുള്ള ഔദ്യോഗിക രാജവൃത്താന്തമോ ചരിത്രരേഖയോ സൂചിപ്പിക്കുന്നു. ‘ദിനവൃത്താന്തഗ്രന്ഥം’ മൂലരൂപത്തോടു ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: പരാമർശിക്കപ്പെടുന്ന ഗ്രന്ഥത്തിന്റെ തിരിച്ചറിയൽ
  choice: ഇത് ഔദ്യോഗിക രാജവൃത്താന്തമോ ചരിത്രരേഖയോ ആണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി
  alternative: ബൈബിളിലെ 1–2 ദിനവൃത്താന്തങ്ങളായി വായിക്കുക
  rationale: സന്ദർഭത്തിലെ രാജഭരണസംഗ്രഹസൂത്രം നഷ്ടപ്പെട്ട ഒരു രാജകീയ രേഖയെയാണ് സൂചിപ്പിക്കുന്നത്; കാനോനിക ദിനവൃത്താന്തഗ്രന്ഥങ്ങളുമായി അതിനെ സമീകരിക്കുന്നത് ചരിത്രപരമായി തെറ്റിദ്ധരിപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. ‘ഇതാ’ എന്ന ഔപചാരിക അവതരണപദം മൂലത്തിലെ ശ്രദ്ധാകർഷണശക്തി നിലനിർത്തുന്നു. ഇടയ്ക്കുള്ള വിശദീകരണഖണ്ഡം ദീർഘവാക്യം വ്യക്തമായി വായിക്കാനായി ഡാഷുകൾക്കിടയിൽ നൽകിയിരിക്കുന്നു.
