  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: ml
  text: യിസ്രായേൽ മുഴുവനും അവനെക്കുറിച്ചു വിലപിച്ച് അവനെ അടക്കം ചെയ്യും. യൊരോബെയാമിന്റെ ഭവനത്തിൽനിന്ന് അവൻ മാത്രമേ കല്ലറയിലെത്തുകയുള്ളൂ[a]. കാരണം, യൊരോബെയാമിന്റെ ഭവനത്തിൽ യിസ്രായേലിന്റെ ദൈവമായ യഹോവയോടുള്ള എന്തോ നന്മ അവനിൽ കണ്ടെത്തിയിരിക്കുന്നു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൻ മാത്രമേ യൊരോബെയാമിന്, കല്ലറയിലേക്ക് വരുകയുള്ളൂ.” സന്ദർഭത്തിൽ, യൊരോബെയാമിന്റെ ഭവനത്തിൽനിന്ന് സംസ്കാരം ലഭിക്കുന്നത് അവനു മാത്രമാണെന്നതാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: “എന്തോ നന്മ” എന്നതിന് “ഒരു നല്ല കാര്യം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “യഹോവയോടുള്ള” എന്ന ഹീബ്രു പ്രയോഗം യഹോവയിലേക്കു തിരിഞ്ഞ ഒരു മനോഭാവത്തെയോ, യഹോവയുമായി ബന്ധപ്പെട്ടോ അവിടുത്തേക്ക് പ്രസാദകരമായോ ഉള്ള ഒരു ഗുണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ
  choice: വിലപിക്കും
  rationale: മരിച്ചവനെക്കുറിച്ചുള്ള ദുഃഖാചരണത്തെ സൂചിപ്പിക്കുന്ന ספד എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: അവനെ അടക്കം ചെയ്യും
  rationale: ക്രിയയുടെയും പ്രത്യയരൂപത്തിലുള്ള കർമത്തിന്റെയും നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: അവൻ മാത്രമേ
  rationale: യൊരോബെയാമിന്റെ മറ്റു കുടുംബാംഗങ്ങളിൽനിന്നുള്ള ഏകമായ വ്യത്യാസം ഊന്നിപ്പറയുന്നു.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: യൊരോബെയാമിന്റെ ഭവനത്തിൽനിന്ന് അവൻ മാത്രമേ കല്ലറയിലെത്തുകയുള്ളൂ
  rationale: ഹീബ്രുവിലെ അസാധാരണമായ പദക്രമം അക്ഷരാർഥത്തിൽ അവ്യക്തമാകുന്നതിനാൽ, കുടുംബബന്ധവും സംസ്കാരം ലഭിക്കുന്നതുമായ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സൂചിപ്പിക്കുന്നു.
- source_word: קָבֶר
  choice: കല്ലറ
  rationale: ശവകുടീരം അഥവാ സംസ്കാരസ്ഥലം എന്ന നാമത്തിന്റെ മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: נִמְצָא בוֹ
  choice: അവനിൽ ... കണ്ടെത്തിയിരിക്കുന്നു
  rationale: നിഫാൽ സമാപ്തരൂപത്തിന്റെ നിഷ്ക്രിയഭാവവും കണ്ടെത്തപ്പെട്ട ഗുണത്തിന്റെ നിലവിലുള്ള പ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: דָּבָר טוֹב
  choice: എന്തോ നന്മ
  rationale: דָּבָר എന്ന വിശാലവും അനിശ്ചിതവുമായ പ്രയോഗത്തെ ഒരു നിർദിഷ്ട പ്രവൃത്തിയായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹോവയോടുള്ള
  rationale: אֶל സൂചിപ്പിക്കുന്ന ദൈവത്തിലേക്കുള്ള അഭിമുഖതയോ ബന്ധമോ നിലനിർത്തുന്നു; ദൈവത്തിന് പ്രസാദകരമായത് എന്നു വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മലയാളത്തിൽ ദൈവനാമത്തിന്റെ സുപരിചിതവും മാന്യവുമായ ലിപ്യന്തരണം ഉപയോഗിച്ച് വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: בְּבֵית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭവനത്തിൽ
  rationale: ഭവനം എന്നത് കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ദൈവനാമം നിലനിർത്തുന്നു; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് ‘യഹോവ’ കൂടുതൽ പരിചിതമാണ്.
- issue: דָּבָר טוֹב אֶל יְהוָה എന്നതിന്റെ അർഥം
  choice: യഹോവയോടുള്ള എന്തോ നന്മ
  alternative: യഹോവയ്ക്ക് പ്രസാദകരമായ എന്തോ ഒന്ന്
  rationale: ഈ വാചകം ഒരു നല്ല മനോഭാവമോ ഗുണമോ പ്രവൃത്തിയോ സൂചിപ്പിക്കാം. ‘പ്രസാദകരമായ’ എന്നു പറഞ്ഞ് അർഥപരിധി ചുരുക്കാതെ മൂലത്തിലെ ദിശാസൂചനയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം’ രാജകുടുംബം/വംശം എന്ന ബൈബിൾപരമായ അർഥത്തിൽ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം ഒഴിവാക്കാതെ, എന്നാൽ മലയാളത്തിൽ ബന്ധം വ്യക്തമാകുന്ന വിധം വാക്യക്രമം ക്രമപ്പെടുത്തി.
