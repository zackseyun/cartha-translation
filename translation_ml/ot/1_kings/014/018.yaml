  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: ml
  text: അവർ അവനെ അടക്കം ചെയ്തു; യഹ്‌വെ തന്റെ ദാസനായ അഹീയാവ് പ്രവാചകൻ മുഖാന്തരം പറഞ്ഞ വചനപ്രകാരം ഇസ്രായേൽ മുഴുവനും അവന്നുവേണ്ടി വിലപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ അടക്കം ചെയ്തു
  rationale: קבר എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; ആവർത്തിക്കുന്ന ഹീബ്രു സംയോജകം സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: അവനെക്കുറിച്ചു വിലപിച്ചു
  rationale: ספד മരണസന്ദർഭത്തിലെ പരസ്യമായ ദുഃഖാചരണത്തെയും വിലാപത്തെയും സൂചിപ്പിക്കുന്നു; ശബ്ദത്തോടെ കരഞ്ഞു എന്ന അധികവിവരം ചേർക്കാതെ അർഥം നൽകുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ജനസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹ്‌വെ ... അരുളിച്ചെയ്ത വചനപ്രകാരം
  rationale: כְּ־യുടെ അനുരൂപത/നിവൃത്തി എന്ന ആശയവും דָבָר എന്ന പ്രവാചകവചനപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്ത
  rationale: മുമ്പ് പ്രസ്താവിക്കപ്പെട്ട ദൈവവചനത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യത്തിന്റെ ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּיַד עַבְדּוֹ
  choice: തന്റെ ദാസനായ ... മുഖാന്തരം
  rationale: ‘കൈയാൽ’ എന്ന ഹീബ്രു ഇടയവാക്യം ഇവിടെ പ്രവാചകന്റെ മാധ്യമത്വം സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഖാന്തരം’ എന്നു വിവർത്തനം ചെയ്യുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: അഹീയാവ് പ്രവാചകൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്യുകയും നിർദിഷ്ടമായ പ്രവാചകപദവി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണമായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: בְּיַד עַבְדּוֹ എന്ന പ്രവാചക-മാധ്യമത്വ പ്രയോഗം
  choice: തന്റെ ദാസനായ ... മുഖാന്തരം
  alternative: തന്റെ ദാസനായ ... കൈയാൽ
  rationale: ദൈവവചനം അഹീയാവിലൂടെ അറിയിക്കപ്പെട്ടു എന്ന മൂലപാഠത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; പ്രചോദനത്തെക്കുറിച്ച് പാഠം പറയുന്നതിലധികം ദൈവശാസ്ത്രവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്ത’ എന്ന പദം ദൈവത്തിന്റെ പ്രസ്താവനയ്ക്ക് യോജിച്ച ഔന്നത്യം നൽകുന്നു; വാക്യക്രമം പ്രവാചകവചനത്തിന്റെ നിവൃത്തി എന്ന ബന്ധം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
