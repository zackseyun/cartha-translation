  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: ml
  text: ശലോമോന്റെ മകനായ രെഹബെയാം യെഹൂദയിൽ[a] ഭരിച്ചു. രാജാവായപ്പോൾ രെഹബെയാമിന് നാൽപ്പത്തൊന്നു വയസ്സായിരുന്നു; യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും അവിടെ തന്റെ നാമം സ്ഥാപിക്കാൻ യഹ്‌വെ തിരഞ്ഞെടുത്ത നഗരമായ യെരൂശലേമിൽ അവൻ പതിനേഴു വർഷം ഭരിച്ചു[b]. അവന്റെ അമ്മയുടെ പേര് നയമ എന്നായിരുന്നു; അവൾ അമ്മോന്യസ്ത്രീയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദയെ ഭരിച്ചു.”
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവിടെ തന്റെ നാമം വെക്കാൻ.” യഹ്‌വെയുടെ സാന്നിധ്യത്തോടും ആരാധനയോടും പ്രത്യേകമായി ബന്ധപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ പ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: രാജാവായി വാണു / വാണു
  rationale: രാജഭരണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ രണ്ട് പ്രയോഗങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; അധികാരാരോഹണത്തെ സൂചിപ്പിക്കുന്ന בְּמָלְכוֹയിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: בִּיהוּדָה
  choice: യെഹൂദയിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സാധാരണ സ്ഥലാർഥം നിലനിർത്തുന്നു; രാജഭരണസന്ദർഭത്തിൽ ‘യെഹൂദയെ ഭരിച്ചു’ എന്നും മനസ്സിലാക്കാം.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: അധികാരാരോഹണസമയത്തെ സൂചിപ്പിക്കുന്ന infinitive construct സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: തന്റെ നാമം സ്ഥാപിക്കാൻ
  rationale: ‘തന്റെ നാമം അവിടെ വെക്കാൻ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉടമ്പടിപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘വസിപ്പിക്കാൻ’ എന്ന വിപുലീകരണം ചേർക്കുന്നില്ല.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും
  rationale: ഗോത്രങ്ങളുടെ ഇടയിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന מִן എന്നതിന്റെ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָעַמֹּנִית
  choice: അമ്മോന്യസ്ത്രീ
  rationale: സ്ത്രീലിംഗ ജനവിഭാഗനാമം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ പ്രചാരത്തിലുള്ള ശാസ്ത്രീയ ലിപ്യന്തരണത്തോട് ചേർന്ന രൂപം സ്വീകരിക്കുന്നു.
- issue: ‘തന്റെ നാമം സ്ഥാപിക്കാൻ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഹീബ്രു രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: തന്റെ സാന്നിധ്യത്തിന്റെയും ആരാധനയുടെയും സ്ഥലമാക്കാൻ
  rationale: മൂലത്തിലെ ഉടമ്പടിപരമായ പ്രയോഗത്തെ വ്യാഖ്യാനപരമായ പരാവർത്തനത്തിലൂടെ ഏകാർഥമാക്കാതെ അതിന്റെ സാന്ദ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; പുരാതന ക്രിയാരൂപങ്ങളും അനാവശ്യമായ സംസ്കൃതഭാരവും ഒഴിവാക്കി.
