source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇതാ, ഞാൻ യൊരോബെയാമിന്റെ ഭവനത്തിന്മേൽ വിപത്ത് വരുത്തും. യൊരോബെയാമിന്റെ ഭവനത്തിലെ ഇസ്രായേലിൽ അടിമയായാലും സ്വതന്ത്രനായാലും സകല പുരുഷന്മാരെയും[a][b] ഞാൻ ഛേദിച്ചുകളയും. ചാണകം പൂർണമായി നീക്കിക്കളയുന്നതുപോലെ യൊരോബെയാമിന്റെ ഭവനത്തെ ഞാൻ തുടച്ചുനീക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം, ‘ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്നവൻ’; പുരുഷനെ സൂചിപ്പിക്കുന്ന പരുഷമായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘അടിമയായാലും സ്വതന്ത്രനായാലും’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ദ്വന്ദ്വപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘തടഞ്ഞുവെക്കപ്പെട്ടവനും വിട്ടയക്കപ്പെട്ടവനും’ എന്നാണ്; ഇവിടെ അത് ആരെയും ഒഴിവാക്കാതെയുള്ള സമഗ്രതയെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: അനർഥം
  rationale: ന്യായവിധിയുടെ അരുളപ്പാടിൽ ഇത് ധാർമികമായ തിന്മയെയല്ല, ദൈവം വരുത്തുന്ന കഠിനമായ ദുരന്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהִכְרַתִּי
  choice: ഞാൻ ഛേദിച്ചുകളയും
  rationale: כרת എന്ന ക്രിയയുടെ വംശത്തെയോ വ്യക്തികളെയോ പൂർണമായി ഇല്ലാതാക്കുന്ന ന്യായവിധിസ്വരം നിലനിർത്തുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: സകല പുരുഷന്മാരെയും
  rationale: അക്ഷരാർഥത്തിൽ വിചിത്രമായി കേൾക്കുന്ന പരുഷമായ എബ്രായ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പരുഷത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: עָצוּר וְעָזוּב
  choice: അടിമയോ സ്വതന്ത്രനോ ആയ
  rationale: അർഥവ്യാഖ്യാനത്തിൽ അനിശ്ചിതത്വമുള്ള പരമ്പരാഗത ദ്വന്ദ്വപ്രയോഗം സമഗ്രത സൂചിപ്പിക്കുന്നതായി എടുത്ത്, എല്ലാ സാമൂഹിക നിലകളിലുള്ളവരെയും ഉൾക്കൊള്ളുന്ന മേരിസമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭവനത്തിൽ ശേഷിക്കുന്നതെല്ലാം ഞാൻ നീക്കിക്കളയും
  rationale: אַחֲרֵי എന്ന ഘടകത്തിലെ ‘ശേഷിപ്പ്/പിന്നിൽ ശേഷിച്ചത്’ എന്ന ആശയവും, തുടർന്നുള്ള ചാണകോപമയിലെ സമ്പൂർണ നീക്കലും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: הַגָּלָל
  choice: ചാണകം
  rationale: മൂലത്തിലെ മനഃപൂർവമായ നിന്ദാത്മകവും ചിത്രാത്മകവുമായ പദപ്രയോഗം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: עַד תֻּמּוֹ
  choice: പൂർണമായി
  rationale: ഒന്നും ശേഷിക്കാത്ത സമ്പൂർണ നീക്കലാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ കാഠിന്യം മൃദൂകരിക്കാതെ അവതരിപ്പിക്കൽ
  choice: ‘അനർഥം വരുത്തും,’ ‘ഛേദിച്ചുകളയും,’ ‘ചാണകം,’ ‘നീക്കിക്കളയും’ എന്നീ നേരിട്ടും ശക്തവുമായ പ്രയോഗങ്ങൾ
  alternative: ‘പ്രയാസം,’ ‘മാറ്റിക്കളയും’ തുടങ്ങിയ മൃദുവായ പ്രയോഗങ്ങൾ
  rationale: എബ്രായ അരുളപ്പാട് കഠിനവും നിന്ദാത്മകവുമാണ്; അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ന്യായവിധിയുടെ തീവ്രതയും പരിഭാഷയിൽ നിലനിർത്തണം.
- issue: עָצוּר וְעָזוּב എന്ന ദ്വന്ദ്വപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം
  choice: പ്രധാനവാചകത്തിൽ ‘അടിമയോ സ്വതന്ത്രനോ ആയ’ എന്നും അടിക്കുറിപ്പിൽ പദശഃ സാധ്യതയും സമഗ്രതാസൂചനയും നൽകുന്നു
  alternative: ‘തടഞ്ഞുവെക്കപ്പെട്ടവനോ വിട്ടയക്കപ്പെട്ടവനോ’ എന്ന പദശഃ പരിഭാഷ
  rationale: സന്ദർഭത്തിൽ സമ്പൂർണ ഉന്മൂലനമാണ് പ്രബലമായ അർഥം; എങ്കിലും മൂലപ്രയോഗത്തിന്റെ കൃത്യമായ വർഗീകരണം ഉറപ്പില്ലാത്തതിനാൽ ആ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി. ‘ഇതാ’ എന്ന അരുളപ്പാട്-സൂചകം നിലനിർത്തി. വാക്യഘടന വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; മൂലത്തിലെ കഠിനതയും ചാണകോപമയുടെ നിന്ദാത്മക ശക്തിയും മൃദൂകരിച്ചിട്ടില്ല.
