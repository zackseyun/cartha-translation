  to: അതുകൊണ്ട്, ഇതാ, ഞാൻ യൊരോബെയാമിന്റെ ഭവനത്തിന്മേൽ വിപത്ത് വരുത്തും. യൊരോബെയാമിന്റെ ഭവനത്തിലെ ഇസ്രായേലിൽ അടിമയായാലും സ്വതന്ത്രനായാലും സകല പുരുഷന്മാരെയും[a][b] ഞാൻ ഛേദിച്ചുകളയും. ചാണകം പൂർണമായി നീക്കിക്കളയുന്നതുപോലെ യൊരോബെയാമിന്റെ ഭവനത്തെ ഞാൻ തുടച്ചുനീക്കും.
