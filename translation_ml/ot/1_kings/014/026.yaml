source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ആലയത്തിലെ[a] നിധികളും രാജകൊട്ടാരത്തിലെ നിധികളും എടുത്തു; എല്ലാം അവൻ എടുത്തു. ശലോമോൻ ഉണ്ടാക്കിയ സ്വർണപ്പരിചകളെല്ലാം അവൻ എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: “യഹോവയുടെ ഭവനം”; അതായത്, ആലയം.'
    reason: മൂലഭാഷയിലെ ‘ഭവനം’ എന്ന രൂപകം അറിയിച്ചുകൊണ്ട് മുഖ്യപാഠത്തിലെ സന്ദർഭോചിതമായ ‘ആലയം’ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘എടുക്കുക’ നിലനിർത്തുന്നു. കൊള്ളയടിച്ചു, പിടിച്ചെടുത്തു എന്നീ ശക്തമായ അർഥങ്ങൾ സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും അവ മൂലപദത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കും. ആവർത്തനം വാക്യത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
- source_word: אֹצְרוֹת
  choice: നിക്ഷേപങ്ങൾ
  rationale: ഇവിടെ എടുത്തുകൊണ്ടുപോകുന്നത് സംഭരണശാലകളെയല്ല, അവയിൽ സൂക്ഷിച്ചിരുന്ന വിലപിടിപ്പുള്ള വസ്തുക്കളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ ഭവനം’ എന്നാണ്. സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ദേവാലയമായതിനാൽ സ്വാഭാവികവും വ്യക്തവുമായ ‘ആലയം’ മുഖ്യപാഠത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരം
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ ഭവനം’ എന്നാണെങ്കിലും സന്ദർഭത്തിലെ രാജകീയ വസതിയും ഭണ്ഡാരവും സ്വാഭാവിക മലയാളത്തിൽ ‘രാജകൊട്ടാരം’ വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: എല്ലാം അവൻ എടുത്തു
  rationale: കൊള്ളയുടെ സമ്പൂർണത ഊന്നിപ്പറയുന്ന സംഗ്രഹവാക്യത്തിന്റെ ശക്തിയും ഹീബ്രുവിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: מָגִנֵּי הַזָּהָב
  choice: സ്വർണപ്പരിചകൾ
  rationale: מָגֵן എന്നത് പ്രതിരോധത്തിനുള്ള പരിചയാണ്; ‘കവചം’ ശരീരം മൂടുന്ന armor എന്ന തെറ്റായ ധാരണ നൽകാം. construct പ്രയോഗം സ്വാഭാവികമായി ‘സ്വർണപ്പരിചകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: ശലോമോൻ ഉണ്ടാക്കിയ
  rationale: പരിചകളെ തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം ലളിതവും സ്വാഭാവികവുമായ മലയാളക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു. മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം ‘യഹോവ’യാണ്.
