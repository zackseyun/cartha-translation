  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ഹീബ്രുവിലെ ‘എടുത്തു … എല്ലാം എടുത്തു … എടുത്തു’ എന്ന ആവർത്തന ഊന്നൽ മലയാളത്തിലും ഉദ്ദേശപൂർവം നിലനിർത്തി.
