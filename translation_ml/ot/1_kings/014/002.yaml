source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: ml
  text: 'യൊരോബെയാം തന്റെ ഭാര്യയോടു പറഞ്ഞു: “ദയവായി എഴുന്നേറ്റ് വേഷം മാറുക; അങ്ങനെ നീ യൊരോബെയാമിന്റെ ഭാര്യയാണെന്ന് അവർ അറിയാതിരിക്കാൻ[a]. പിന്നെ ശീലോവിലേക്കു പോകുക. ഇതാ, അഹീയാ പ്രവാചകൻ അവിടെയുണ്ട്. ഈ ജനത്തിന്റെ രാജാവാകുമെന്ന് എന്നെക്കുറിച്ച് പറഞ്ഞത് അവനാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർ അറിയുകയില്ല”; എബ്രായത്തിൽ ‘അവർ’ ആരെന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഈ ജനത്തിന്റെ രാജാവാകുന്നതിനെക്കുറിച്ച് എന്നെപ്പറ്റി പറഞ്ഞത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: യൊരോബെയാം തന്റെ ഭാര്യയോടു പറഞ്ഞു
  rationale: സാധാരണ എബ്രായ ആഖ്യാനരീതിയും ഭാര്യയെന്ന ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קוּמִי נָא
  choice: ദയവായി എഴുന്നേറ്റ്
  rationale: സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയും നָא നൽകുന്ന അപേക്ഷാഭാവവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְהִשְׁתַּנִּית
  choice: വേഷം മാറുക
  rationale: ഈ സന്ദർഭത്തിലെ ഹിത്പയേൽ രൂപം തിരിച്ചറിയപ്പെടാതിരിക്കാനായി സ്വന്തം രൂപഭാവം മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വേഷം മാറുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: וְלֹא יֵדְעוּ
  choice: അവർ അറിയാതിരിക്കട്ടെ
  rationale: ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു അനിർദിഷ്ടമായിത്തന്നെ സൂക്ഷിക്കുകയും മുൻ ആജ്ഞയുടെ ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: പിന്നെ ശീലോവിലേക്കു പോകുക
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രമവാചക സമ്പൂർണരൂപത്തിന്റെ നിർദേശബലം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הִנֵּה שָׁם
  choice: ഇതാ, ... അവിടെയുണ്ട്
  rationale: הִנֵּה എന്ന ശ്രദ്ധാകർഷക പദത്തിന്റെ ദൈക്തികബലം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: അഹീയാ പ്രവാചകൻ
  rationale: വ്യക്തിനാമം ഉറവിടരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്യുകയും പദവി നേരിട്ട് പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: הוּא דִבֶּר
  choice: പറഞ്ഞത് അവനാണ്
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּא നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘അവനാണ്’ എന്ന ഘടനയിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: עָלַי לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: ഈ ജനത്തിന്മേൽ ഞാൻ രാജാവാകുമെന്ന് എന്നെക്കുറിച്ചു
  rationale: עָלַי എന്നതിന്റെ ‘എന്നെക്കുറിച്ച്’ എന്ന അർഥവും לְמֶלֶךְ സൂചിപ്പിക്കുന്ന രാജപദവിയും നിലനിർത്തി, പ്രവചനത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: עָלַי לְמֶלֶךְ എന്ന ഘടനയുടെ ബന്ധം
  choice: ഈ ജനത്തിന്മേൽ ഞാൻ രാജാവാകുമെന്ന് എന്നെക്കുറിച്ചു പറഞ്ഞത്
  alternative: ഈ ജനത്തിന്മേൽ രാജാവാകുന്നതിനെക്കുറിച്ച് എന്നോട് പറഞ്ഞത്
  rationale: עַל + ഒന്നാംപുരുഷ പ്രത്യയം സാധാരണയായി ‘എന്നെക്കുറിച്ച്/എന്നെ സംബന്ധിച്ച്’ എന്നതാണ്; അതിനെ ‘എന്നോട്’ എന്നു മാറ്റാതെ സൂക്ഷിച്ചു. לְמֶלֶךְ എന്നതിന്റെ സംക്ഷിപ്തവും ചിലവട്ടം ദ്വയാർഥസാധ്യതയുള്ള ബന്ധം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ പോലുള്ള ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ചെങ്കിലും ഇന്നും ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ നിലനിർത്തി; അതിപുരാതന ക്രിയാരൂപങ്ങളും വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
