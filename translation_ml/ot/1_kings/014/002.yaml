  to: 'യൊരോബെയാം തന്റെ ഭാര്യയോടു പറഞ്ഞു: “ദയവായി എഴുന്നേറ്റ് വേഷം മാറുക; അങ്ങനെ നീ യൊരോബെയാമിന്റെ ഭാര്യയാണെന്ന് അവർ അറിയാതിരിക്കാൻ[a]. പിന്നെ ശീലോവിലേക്കു പോകുക. ഇതാ, അഹീയാ പ്രവാചകൻ അവിടെയുണ്ട്. ഈ ജനത്തിന്റെ രാജാവാകുമെന്ന് എന്നെക്കുറിച്ച് പറഞ്ഞത് അവനാണ്[b].”'
  rationale: The revision replaces a potentially jussive Malayalam formulation with a clear purpose clause, smooths the expression for kingship over the people, and makes footnote b a complete and readable alternative. It preserves the source’s indefinite plural, the emphasis on Ahijah, and the ambiguity reflected by the existing footnote.
