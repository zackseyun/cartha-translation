    rationale: ‘അവർ അറിയാതിരിക്കട്ടെ’ may mean ‘let them not know.’ The context calls for ‘so that they will not know,’ best rendered with ‘അറിയാതിരിക്കാൻ.’
  - severity: low
    issue: ‘ഈ ജനത്തിന്മേൽ രാജാവാകുക’ is stiff Malayalam
    rationale: While understandable and source-close, ‘ഈ ജനത്തിന്റെ രാജാവാകുക’ communicates kingship over the people more idiomatically without changing the meaning.
