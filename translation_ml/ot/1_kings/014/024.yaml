  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: ml
  text: നിരോധിത ആരാധനാചാരങ്ങളോടു ബന്ധപ്പെട്ട പുരുഷന്മാരും ദേശത്തുണ്ടായിരുന്നു[a]. യഹോവ യിസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളഞ്ഞ ജനതകൾ ചെയ്തിരുന്ന അറപ്പുളവാക്കുന്ന സകല പ്രവൃത്തികളും അവർ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം കാദേശ് വ്യാകരണപരമായി ഏകവചനവും പുല്ലിംഗവുമാണ്; ഇവിടെ അത് ഒരു വിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘ആരാധനയോടനുബന്ധിച്ച പുരുഷൻ’ എന്നാണ് പൊതുവായ അർഥം. ‘ആരാധനാകേന്ദ്രത്തിലെ പുരുഷവേശ്യ’ എന്നും വിവർത്തനം ചെയ്യാം, എന്നാൽ അവരുടെ കൃത്യമായ പങ്കും ലൈംഗികപ്രവർത്തനവുമായുള്ള ബന്ധവും ഉറപ്പായിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: '...കളും'
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണത്തോടു മറ്റൊന്ന് കൂട്ടിച്ചേർക്കുന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קָדֵשׁ
  choice: ആരാധനാചാരങ്ങളുമായി ബന്ധപ്പെട്ട പുരുഷവേശ്യകൾ
  rationale: പുല്ലിംഗ ഏകവചനരൂപം ഇവിടെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന അസ്തിത്വപ്രയോഗമായി മനസ്സിലാക്കുന്നു. നിരോധിത ആരാധനയുമായുള്ള ബന്ധവും ലൈംഗികപങ്കും വ്യക്തമാക്കുമ്പോൾ, പരമ്പരാഗതമായെങ്കിലും തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു; പദത്തിന്റെ കൃത്യമായ സ്ഥാപനപരമായ പങ്കിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הָיָה בָאָרֶץ
  choice: ദേശത്തുണ്ടായിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ അസ്തിത്വാർഥവും בארץ എന്ന സ്ഥലസൂചനയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָשׂוּ
  choice: അവർ ചെയ്തു
  rationale: എബ്രായത്തിലെ പൊതുവായ ക്രിയയെ അതേ വിശാലതയോടെ നിലനിർത്തുന്നു; ‘അനുഷ്ഠിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: അറപ്പുളവാക്കുന്ന സകല പ്രവൃത്തികളും
  rationale: താരതമ്യാനുസരണത്തിന്റെ ആശയവും תועבות എന്ന പദത്തിന്റെ ശക്തമായ ധാർമിക-മതപരമായ അപലപനവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַגּוֹיִם
  choice: ജനതകൾ
  rationale: ഇവിടെ കനാനിലെ യിസ്രായേലേതര ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല സാങ്കേതിക മതാർഥങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: הוֹרִישׁ
  choice: ഓടിച്ചുകളഞ്ഞ
  rationale: ഹിഫിൽ രൂപം മുൻനിവാസികളെ അവരുടെ സ്ഥലത്തുനിന്ന് നീക്കിയതിനെ സൂചിപ്പിക്കുന്നു; ജയം-കൈവശപ്പെടുത്തൽ പശ്ചാത്തലത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מִפְּנֵי
  choice: മുമ്പിൽനിന്ന്
  rationale: ഒരാളുടെ സന്നിധിയിൽനിന്നോ മുന്നിൽനിന്നോ നീക്കുക എന്ന ജയസൂത്രപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ കുടുംബബന്ധരൂപം മലയാളത്തിലെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ ജനസമൂഹസൂചനയായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: קָדֵשׁ എന്ന പദത്തിന്റെ ആരാധനാ-ലൈംഗിക പശ്ചാത്തലം
  choice: ആരാധനാചാരങ്ങളുമായി ബന്ധപ്പെട്ട പുരുഷവേശ്യകൾ
  alternative: ആരാധനാകേന്ദ്രത്തിലെ പുരുഷവേശ്യകൾ; സമർപ്പിത പുരുഷന്മാർ
  rationale: പദം വ്യാകരണപരമായി പുല്ലിംഗമാണ്; നിരോധിത ആരാധനയുമായി ബന്ധപ്പെട്ട ഒരു പുരുഷവിഭാഗത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അവരുടെ കൃത്യമായ സ്ഥാപനപങ്കും ‘വേശ്യാവൃത്തി’ എന്ന നിർവചനത്തിന്റെ വ്യാപ്തിയും പദം മാത്രം പൂർണമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ പ്രധാനവാചകം സാധാരണമായി അംഗീകരിച്ച അർഥം നൽകുകയും അടിക്കുറിപ്പ് ശേഷിക്കുന്ന അനിശ്ചിതത്വം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: עָשׂוּ എന്ന ബഹുവചനക്രിയയുടെ കർത്താവ്
  choice: അവർ
  alternative: ദേശവാസികൾ; യെഹൂദാജനം
  rationale: വാക്യത്തിൽ കർത്താവ് വ്യക്തമായി ആവർത്തിച്ചിട്ടില്ല. മുൻസന്ദർഭത്തെ ആശ്രയിച്ചുള്ള സൂചനയെ ‘അവർ’ എന്നു നിലനിർത്തുന്നത്, അത് ആരാധനാചാരങ്ങളിലെ പുരുഷവേശ്യകളെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വിവർത്തനത്തിൽ തീർപ്പാക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമം
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലത്തിലെ വ്യക്തിനാമസ്വഭാവം മറയ്ക്കാതെ മലയാളവായനക്കാർക്ക് സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘അറപ്പുളവാക്കുന്ന പ്രവൃത്തികൾ’ എന്ന പ്രയോഗം മതപരവും ധാർമികവുമായ അപലപനം വ്യക്തമാക്കുന്നു. ‘യിസ്രായേൽമക്കൾ’ മൂലത്തിലെ ബന്ധപദരൂപം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
