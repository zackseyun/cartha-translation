source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב רְחַבְעָ֜ם עִם אֲבֹתָ֗י/ו וַ/יִּקָּבֵ֤ר עִם אֲבֹתָי/ו֙ בְּ/עִ֣יר דָּוִ֔ד וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִ֑ית וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: ml
  text: രെഹബെയാം തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു; ദാവീദിന്റെ നഗരത്തിൽ തന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കം ചെയ്യപ്പെട്ടു. അവന്റെ അമ്മയുടെ പേര് അമ്മോന്യസ്ത്രീയായ നയമാ എന്നായിരുന്നു. അവന്റെ മകൻ അബീയാം[a] അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മറ്റു ചില വാക്യങ്ങളിൽ ഇതേ രാജാവിനെ ‘അബീയാവ്’ എന്നു വിളിക്കുന്നു; ഇവിടെ എബ്രായപാഠത്തിലുള്ള പേര് ‘അബീയാം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു
  rationale: രാജാവിന്റെ മരണത്തെ അറിയിക്കുന്ന പതിവുശൈലിയാണിത്. വ്യാഖ്യാനപരമായ ‘മരിച്ചു’ എന്നതിനു പകരം എബ്രായരൂപകവും രാജവംശപരമായ അറിയിപ്പിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കംചെയ്യപ്പെട്ടു
  rationale: קבר എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും രാജവംശത്തിന്റെ കല്ലറകളോടുള്ള ബന്ധവും വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: സ്ഥലനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: അമ്മോന്യസ്ത്രീയായ നയമാ
  rationale: സ്ത്രീലിംഗ ജനവിഭാഗനാമമായ הָעַמֹּנִית അവൾ അമ്മോന്യവംശജയായ സ്ത്രീയാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അമ്മോന്യസ്ത്രീ’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: അവനു പകരം രാജാവായി
  rationale: ഇത് ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ രാജാവിന്റെ സ്ഥാനത്തേക്കുള്ള പിൻഗാമിത്വത്തെ അറിയിക്കുന്ന സൂത്രവാക്യമാണ്; അതിനാൽ ‘രാജാവായി’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אֲבִיָּם
  choice: അബീയാം
  rationale: ഈ വാക്യത്തിലെ മസോററ്റിക് രൂപം אֲבִיָּם തന്നെയായതിനാൽ, മറ്റു ഭാഗങ്ങളിൽ കാണുന്ന ‘അബീയാവ്’ എന്ന രൂപത്തിലേക്ക് ഏകീകരിക്കാതെ ഇവിടെ അതു നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി സ്വീകരിച്ചു. മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രാജകീയ സൂത്രവാക്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയെങ്കിലും, വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
