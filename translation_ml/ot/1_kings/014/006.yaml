base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: ml
  text: 'അഹീയാവ് അവൾ വാതിൽക്കൽ പ്രവേശിക്കുമ്പോൾ അവളുടെ കാലടിയൊച്ച കേട്ടയുടനെ പറഞ്ഞു: “യൊരോബെയാമിന്റെ ഭാര്യയേ, അകത്തേക്കു വരിക. നീ വേഷം മാറി വരുന്നത് എന്തിന്? കഠിനമായൊരു സന്ദേശവുമായി ഞാൻ നിന്റെ അടുക്കലേക്ക് അയക്കപ്പെട്ടിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഞാൻ നിന്റെ അടുക്കലേക്ക് കഠിനമായതുമായി അയക്കപ്പെട്ടിരിക്കുന്നു.” എബ്രായത്തിൽ ‘സന്ദേശം’ എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല; കഠിനമായ സന്ദേശമോ ദുഃഖകരമായ വാർത്തയോ ആണ് ഉദ്ദേശ്യം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: അവളുടെ കാലടിയൊച്ച
  rationale: എബ്രായത്തിലെ ‘അവളുടെ കാലുകളുടെ ശബ്ദം’ എന്ന ദൃശ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കാലടിയൊച്ച’ എന്നു നൽകുന്നു.
- source_word: בָּאָה בַפֶּתַח
  choice: അവൾ വാതിൽക്കൽ പ്രവേശിക്കുമ്പോൾ
  rationale: פֶּתַח വാതിൽപ്പടി/പ്രവേശനസ്ഥലം സൂചിപ്പിക്കുന്നു; ചലനം ഉൾപ്പെടുന്ന സന്ദർഭത്തിൽ ‘വാതിൽക്കൽ പ്രവേശിക്കുമ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: בֹּאִי
  choice: അകത്തേക്കു വരിക
  rationale: സ്ത്രീയോടുള്ള ഏകവചന കല്പനയെ സന്ദർഭോചിതവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭാര്യയേ
  rationale: സംയുക്തനാമബന്ധവും നേരിട്ടുള്ള അഭിസംബോധനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: നീ വേഷം മാറി വരുന്നത് എന്തിന്?
  rationale: התנכר എന്ന ക്രിയയുടെ സ്വയം തിരിച്ചറിയാനാകാത്തവളാക്കുക/മറ്റൊരാളായി നടിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: ഞാൻ നിന്റെ അടുക്കലേക്ക് അയക്കപ്പെട്ടിരിക്കുന്നു
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ നിലവിലുള്ള നിയോഗാവസ്ഥ നിലനിർത്തുന്നു; അയച്ചയാൾ ആരെന്നത് പാഠം വ്യക്തമാക്കാത്തതിനാൽ ചേർക്കുന്നില്ല.
- source_word: קָשָׁה
  choice: കഠിനമായൊരു സന്ദേശവുമായി
  rationale: എബ്രായത്തിൽ വിശേഷണം മാത്രം വന്നതിനാൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘സന്ദേശം’ ചേർക്കുന്നു; ‘കഠിനമായ’ എന്നത് മൂലത്തിലെ സംക്ഷിപ്തതയും ഗൗരവവും സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: קָשָׁה എന്നതിന് ശേഷം നാമം വ്യക്തമല്ല
  choice: ‘കഠിനമായൊരു സന്ദേശവുമായി’ എന്നു നൽകി ‘സന്ദേശം’ പൂരിപ്പിച്ചു
  alternative: ‘ദുഃഖകരമായ വാർത്തയുമായി’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘കഠിനമായതുമായി’
  rationale: പ്രവാചകസന്ദർഭത്തിൽ കടുത്ത വാക്കോ വാർത്തയോ ഉദ്ദേശിക്കപ്പെടുന്നു. ‘സന്ദേശം’ ഏറ്റവും കുറച്ച് വ്യാഖ്യാനം ചേർക്കുന്ന സ്വാഭാവിക പൂരിപ്പിക്കലാണ്; മൂലത്തിലെ നാമലോപം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. മൂലത്തിലെ നേരിട്ടുള്ള അഭിസംബോധനയും പ്രവാചകവചനത്തിന്റെ കാഠിന്യവും നിലനിർത്തി.
