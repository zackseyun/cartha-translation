  choice: യുദ്ധം ഉണ്ടായിരുന്നു
  rationale: מִלְחָמָה എന്നത് ‘യുദ്ധം’ അഥവാ ‘യുദ്ധാവസ്ഥ’ എന്നും היה ഇവിടെ അസ്തിത്വം സൂചിപ്പിക്കുന്ന ക്രിയയായും വരുന്നു. അതിനാൽ ലളിതവും സ്വാഭാവികവുമായ ‘യുദ്ധം ഉണ്ടായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘തുടർന്നുകൊണ്ടിരുന്നു’ എന്ന ആശയം ക്രിയയിൽ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: בֵין ... וּ/בֵין
