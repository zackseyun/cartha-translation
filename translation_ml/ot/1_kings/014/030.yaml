  rationale: അക്ഷരാർഥം ‘എല്ലാ ദിവസങ്ങളും’ എന്നാണ്. ഇവിടെ പരാമർശിച്ചിരിക്കുന്ന ഇരുവരുടെയും ജീവിതകാലമോ ഭരണകാലമോ മുഴുവൻ സംഘർഷം നിലനിന്നുവെന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ജീവിതകാലം, ഭരണകാലം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിശ്ചയിക്കുന്നില്ല.
