source:
  edition: WLC
  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: ml
  text: നിനക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും കൂടുതൽ തിന്മ നീ ചെയ്തു. നീ പോയി നിനക്കുവേണ്ടി അന്യദേവന്മാരെയും വാർപ്പുപ്രതിമകളെയും[a] ഉണ്ടാക്കി, എന്നെ കോപിപ്പിക്കാനായി; എന്നെയാകട്ടെ നീ നിന്റെ പിന്നിലേക്ക് എറിഞ്ഞുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉരുക്കിവാർത്ത പ്രതിമകളെയും”; എബ്രായപദം സാധാരണയായി ലോഹം ഉരുക്കി മൂശയിൽ വാർത്ത് നിർമിച്ച ആരാധനാചിത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת
  choice: അധികം തിന്മ നീ ചെയ്തു
  rationale: רעה + לעשות എന്ന പ്രയോഗം ‘തിന്മ ചെയ്യുക’ എന്ന അർഥത്തിലാണ്; തുടർന്നുള്ള מִכֹּל താരതമ്യം ‘അധികം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: നിനക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും
  rationale: לְפָנֶיךָ ഇവിടെ സ്ഥലപരമല്ല, കാലപരമായി ‘നിനക്കു മുമ്പ്’ എന്നാണ്; താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַתֵּלֶךְ
  choice: നീ പോയി
  rationale: അടുത്ത പ്രവൃത്തിയിലേക്കു നയിക്കുന്ന എബ്രായ ക്രമപ്രയോഗത്തിന്റെ ഊന്നൽ ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: നിനക്കുവേണ്ടി ... ഉണ്ടാക്കി
  rationale: לְּךָയിലെ സ്വയംലക്ഷ്യവും പ്രയോജനാർഥകവുമായ ഭാവം നേരിട്ട് നൽകുന്നു.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാർ
  rationale: ഉടമ്പടിസന്ദർഭത്തിലെ നിരോധിത ദേവന്മാരെ സൂചിപ്പിക്കുന്ന പതിവുപദം; ‘വിദേശദേവന്മാർ’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: וּמַסֵּכוֹת
  choice: വാർപ്പുവിഗ്രഹങ്ങൾ
  rationale: മൂശയിൽ ഉരുക്കിയൊഴിച്ച് നിർമിച്ച ആരാധനാചിത്രങ്ങൾ എന്ന നിർമാണരീതി വ്യക്തമാക്കുന്നു; സാധാരണ വായനക്കാർക്കും ഗ്രാഹ്യമാണ്.
- source_word: לְהַכְעִיסֵנִי
  choice: എന്നെ കോപിപ്പിച്ചു
  rationale: כעסയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും ഒന്നാംപുരുഷ കർമപ്രത്യയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: എന്നെയോ നീ നിന്റെ പുറകിലേക്ക് എറിഞ്ഞുകളഞ്ഞു
  rationale: ദൈവത്തെ അവജ്ഞയോടെ തള്ളിക്കളഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ ശാരീരിക രൂപകം അമൂർത്തമാക്കാതെ നിലനിർത്തുന്നു; וְאֹתִיയിലെ കർമഊന്നൽ ‘എന്നെയോ’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയുടെ ഉടമ്പടിലംഘനം മയപ്പെടുത്താതെ അവതരിപ്പിക്കൽ
  choice: അന്യദേവന്മാരെയും വാർപ്പുവിഗ്രഹങ്ങളെയും
  alternative: വിദേശദേവന്മാരെയും വിഗ്രഹങ്ങളെയും
  rationale: ദൈവശാസ്ത്രപരമായ വിഭാഗമായ ‘അന്യദേവന്മാർ’ എന്നും ഭൗതിക ആരാധനാവസ്തുക്കളായ ‘വാർപ്പുവിഗ്രഹങ്ങൾ’ എന്നും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- issue: ദൈവത്തെ നിരസിക്കുന്ന രൂപകത്തിന്റെ ശക്തി
  choice: എന്നെയോ നീ നിന്റെ പുറകിലേക്ക് എറിഞ്ഞുകളഞ്ഞു
  alternative: നീ എന്നെ അവഗണിച്ചു
  rationale: മൂലപാഠത്തിലെ ശക്തവും അസ്വസ്ഥമാക്കുന്നതുമായ രൂപകത്തെ വ്യാഖ്യാനാത്മകമായ അമൂർത്തവാക്യമായി ലഘൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘വാർപ്പുവിഗ്രഹങ്ങൾ’ നിർമാണരീതിയും ആരാധനാപരമായ സ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; അവസാനത്തെ ദൃശ്യരൂപകം ഉദ്ദേശപൂർവം ശക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
