translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ എബ്രായ wayyiqtol രൂപങ്ങൾ മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ സംക്ഷിപ്തമായ ക്രിയാശൃംഖലയായി നൽകി. ‘ഉമ്മരപ്പടി’ കൃത്യവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദമായി തിരഞ്ഞെടുത്തു.
