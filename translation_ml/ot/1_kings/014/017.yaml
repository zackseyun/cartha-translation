  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: ml
  text: അപ്പോൾ യൊരോബെയാമിന്റെ ഭാര്യ എഴുന്നേറ്റ് യാത്രയായി തിര്‍സയിൽ എത്തി. അവൾ വീടിന്റെ ഉമ്മരപ്പടിയിൽ എത്തിയപ്പോൾ[a] ബാലൻ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ വീടിന്റെ ഉമ്മരപ്പടിയിലേക്കു വന്നുകൊണ്ടിരിക്കുമ്പോൾ.”
    reason: הִיא בָּאָה בְסַף הַבַּיִת എന്ന ഘടനയെ എത്തിച്ചേരുന്ന നിമിഷമായോ അതിലേക്കുള്ള പുരോഗമനപ്രവൃത്തിയായോ മനസ്സിലാക്കാം; മൂലത്തിലെ സമയപരമായ സൂക്ഷ്മതയ്ക്കുള്ള മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: וַתָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആഖ്യാനക്രമത്തിലുള്ള രൂപം അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ എബ്രായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭാര്യ
  rationale: Construct chain സൂചിപ്പിക്കുന്ന വൈവാഹികബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ സംബന്ധികാരൂപത്തിൽ നൽകി.
- source_word: וַתֵּלֶךְ
  choice: യാത്രയായി
  rationale: הלך ഇവിടെ സ്ഥലമാറ്റം സൂചിപ്പിക്കുന്നു. മുമ്പുള്ള ‘എഴുന്നേറ്റ്’ എന്നതിനുശേഷം വെറും ‘പോയി’ എന്നതിനെക്കാൾ ‘യാത്രയായി’ ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമാണ്; യാത്രയുടെ വിധം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: തിര്‍സയിൽ എത്തി
  rationale: בואയും ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന -ה അന്ത്യവും തിര്‍സയിലേക്കുള്ള വരവും അവിടെ എത്തിച്ചേരലും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തിര്‍സയിൽ എത്തി’ സ്വാഭാവികമാണ്.
- source_word: הִיא בָּאָה
  choice: അവൾ ... എത്തിയപ്പോൾ
  rationale: സ്വതന്ത്ര സർവനാമത്തോടുകൂടിയ participle നിർണായക സംഭവത്തിന്റെ സമയപരമായ പശ്ചാത്തലം നൽകുന്നു. ‘എത്തിയപ്പോൾ’ ഈ സാഹചര്യാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְסַף הַבַּיִת
  choice: വീടിന്റെ ഉമ്മരപ്പടിയിൽ
  rationale: סַף വീടിന്റെ threshold/sill ആണ്. ‘ഉമ്മരപ്പടി’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാള പദമാണ്; בְ എന്നതിന്റെ സ്ഥലാർഥവും നിലനിർത്തുന്നു.
- source_word: וְהַנַּעַר
  choice: ബാലൻ
  rationale: נַעַר പ്രസംഗസന്ദർഭത്തിൽ യൊരോബെയാമിന്റെ മകനെ സൂചിപ്പിക്കുന്നു. പ്രായം അനാവശ്യമായി കൃത്യമാക്കാതെ dignified Malayalam നൽകുന്നു.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ qatal രൂപം മുൻവാക്യത്തിലെ പ്രവചനത്തിന്റെ നിറവേറലായി അന്നേരം സംഭവിച്ച മരണത്തെ സൂചിപ്പിക്കുന്നു; സംഭവാർഥം ‘മരിച്ചു’ വ്യക്തമായി നൽകുന്നു.
