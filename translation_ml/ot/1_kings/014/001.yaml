  yaml_path: translation/ot/1_kings/014/001.yaml
  text: At that time Abijah son of Jeroboam became sick.
translation:
  language: ml
  text: ആ കാലത്ത് യൊരോബെയാമിന്റെ മകൻ അബീയാവിന് രോഗം പിടിപെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ആ കാലത്ത്
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികവും ആധുനികവുമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: חָלָה
  choice: രോഗം പിടിപെട്ടു
  rationale: ഇത് രോഗാവസ്ഥയുടെ ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; വെറും സ്ഥിതിവിവരണമായ ‘രോഗിയായിരുന്നു’ എന്നതിനെക്കാൾ കഥയുടെ പുരോഗതിക്ക് യോജിക്കുന്നു.
- source_word: אֲבִיָּה
  choice: അബീയാവ്
  rationale: എബ്രായ വ്യക്തിനാമമായ אֲבִיָּהയുടെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു; വിഭക്തിപ്രയോഗത്തിൽ ‘അബീയാവിന്’ എന്നു വരുന്നു.
- source_word: בֶן יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ മകൻ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചക ഘടന സ്വാഭാവിക മലയാളത്തിൽ ഉടമസ്ഥതാസൂചക രൂപത്തിലൂടെ കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രോഗം ആരംഭിച്ചതെന്ന ക്രിയാത്മക അർഥം നിലനിർത്തിയിരിക്കുന്നു.
