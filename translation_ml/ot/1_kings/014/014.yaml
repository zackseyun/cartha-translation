    text: 'എബ്രായത്തിലെ സമാപനം പെട്ടെന്നുള്ളതും ദുഷ്കരവുമാണ്. അക്ഷരാർഥത്തിൽ: ‘എന്നിട്ട് എന്ത്? ഇപ്പോൾത്തന്നെ’ (എബ്രായ സംയോജകം സാധാരണയായി ‘ഒപ്പം/എന്നിട്ട്’ എന്നാണ്). ന്യായവിധിയുടെ ആസന്നതയെ ഊന്നിപ്പറയുന്ന ഒരു ഉദ്ഗാരമായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു: ‘എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ!’ അല്ലെങ്കിൽ ‘ഇനി എന്ത്? ഇതിനകം ഇപ്പോൾത്തന്നെ.’'
