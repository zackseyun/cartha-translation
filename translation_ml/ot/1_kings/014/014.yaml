source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: ml
  text: യഹ്‌വെ തനിക്കായി ഇസ്രായേലിന്മേൽ ഭരിക്കാൻ ഒരു രാജാവിനെ ഉയർത്തും; അവൻ യൊരോബെയാമിന്റെ ഭവനത്തെ ഛേദിച്ചുനീക്കും—ഈ ദിവസം. എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിലെ സമാപനം പെട്ടെന്നുള്ളതും ദുഷ്കരവുമാണ്. അക്ഷരാർഥത്തിൽ: ‘എന്നിട്ട് എന്ത്? ഇപ്പോൾത്തന്നെ’ (എബ്രായ സംയോജകം സാധാരണയായി ‘ഒപ്പം/എന്നിട്ട്’ എന്നാണ്). ന്യായവിധിയുടെ ആസന്നതയെ ഊന്നിപ്പറയുന്ന ഒരു ഉദ്ഗാരമായി ചിലർ ഇതിനെ മനസ്സിലാക്കുന്നു: ‘എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ!’ അല്ലെങ്കിൽ ‘ഇനി എന്ത്? ഇതിനകം ഇപ്പോൾത്തന്നെ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: ഉയർത്തും
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ദൈവം ഒരു ഭരണാധികാരിയെ രംഗത്തുകൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉയർത്തും’ എന്നത് നിയമനത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതെ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לּוֹ
  choice: തനിക്കായി
  rationale: സർവനാമപ്രത്യയം വാക്യത്തിന്റെ കർത്താവായ യഹ്‌വെയിലേക്കു മടങ്ങുന്നതായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേൽ ഒരു രാജാവ്
  rationale: രാജകീയ ഭരണത്തോടൊപ്പം വരുന്ന עַל ആധിപത്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇസ്രായേലിന്മേൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר יַכְרִית
  choice: അവൻ ... ഛേദിച്ചുകളയും
  rationale: כרת എന്നതിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘ഛേദിക്കുക, ഇല്ലാതാക്കുക’ എന്ന ന്യായവിധിസംബന്ധമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: בֵּית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭവനം
  rationale: ‘ഭവനം’ കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ വംശപദമാണ്; ‘രാജവംശം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: זֶה הַיּוֹם
  choice: ഇന്നുതന്നെ
  rationale: അക്ഷരാർഥമായ ‘ഈ ദിവസം’ എന്നതിന്റെ കാലസംബന്ധമായ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּמֶה גַּם עָתָּה
  choice: എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ.
  rationale: എബ്രായത്തിന്റെ ദുഷ്കരവും അപൂർണ്ണവുമായ സമാപനം വിശദീകരിച്ച് തീർക്കാതെ അതിന്റെ പെട്ടെന്നുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: וּמֶה גַּם עָתָּה എന്ന ദുഷ്കരമായ അവസാനവാക്യം
  choice: എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ.
  alternative: ഇനി എന്തു പറയണം? അതു ഇപ്പോൾത്തന്നെ ആരംഭിച്ചിരിക്കുന്നു.
  rationale: എബ്രായ വാക്യം വ്യാകരണപരമായി സംക്ഷിപ്തവും അർഥത്തിൽ അനിശ്ചിതവുമാണ്. ന്യായവിധി ഇതിനകം ആരംഭിച്ചുവെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അതിന്റെ അപ്രതീക്ഷിതത്വവും അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജവംശപരമായ ‘ഭവനം’, ന്യായവിധിയുടെ രൂപകമായ ‘ഛേദിച്ചുകളയും’ എന്നിവ മൂലപാഠത്തിന്റെ ആശയലോകം നിലനിർത്തുന്നു; അവസാനഭാഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
