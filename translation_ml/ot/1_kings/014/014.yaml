revisions:
- from: യഹ്‌വെ തനിക്കായി ഇസ്രായേലിന്മേൽ ഒരു രാജാവിനെ ഉയർത്തും; അവൻ യൊരോബെയാമിന്റെ ഭവനത്തെ ഇന്നുതന്നെ ഛേദിച്ചുകളയും.[a] എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ.
  to: യഹ്‌വെ തനിക്കായി ഇസ്രായേലിന്മേൽ ഭരിക്കാൻ ഒരു രാജാവിനെ ഉയർത്തും; അവൻ യൊരോബെയാമിന്റെ ഭവനത്തെ ഛേദിച്ചുനീക്കും—ഈ ദിവസം. എന്നാൽ എന്ത്? ഇപ്പോൾത്തന്നെ.[a]
