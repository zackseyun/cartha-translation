  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: ml
  text: രാജാവ് യഹ്വേയുടെ ആലയത്തിൽ പ്രവേശിക്കുമ്പോഴെല്ലാം, കാവൽക്കാർ[a] അവയെ[b] എടുത്തുകൊണ്ടുപോകുകയും പിന്നീട് കാവൽക്കാരുടെ മുറിയിലേക്കു തിരികെ കൊണ്ടുവരുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ഓട്ടക്കാർ’; ഈ രാജകീയ പശ്ചാത്തലത്തിൽ രാജാവിന്റെ കാവൽക്കാരെയോ അംഗരക്ഷകരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ശീശക് കൊണ്ടുപോയ സ്വർണപരിചകൾക്കു പകരം രെഹബെയാം ഉണ്ടാക്കിയ വെങ്കലപരിചകൾ (1 രാജാക്കന്മാർ 14:27 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: പ്രവേശിക്കുമ്പോഴെല്ലാം
  rationale: מִדֵּי + infinitive ആവർത്തിച്ചുണ്ടാകുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ ഈ ആവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു; וַיְהִי പ്രത്യേകം വാക്കാക്കി മാറ്റാതെ ആഖ്യാനത്തിന്റെ ഒഴുക്കിൽ ഉൾപ്പെടുത്തി.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ രെഹബെയാമിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട നാമം.
- source_word: בֵּית יְהוָה
  choice: യഹ്വേയുടെ ആലയം
  rationale: בַּיִת ഇവിടെ വിശുദ്ധമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആലയം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; יְהוָה എന്ന ദൈവനാമം ‘യഹ്വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: הָרָצִים
  choice: കാവൽക്കാർ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘ഓട്ടക്കാർ’ എന്നാണെങ്കിലും രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ രാജാവിനെ അനുഗമിച്ചിരുന്ന കാവൽക്കാരെയോ അംഗരക്ഷകരെയോ സൂചിപ്പിക്കുന്നു. പ്രവർത്തനാർഥം മുഖ്യപാഠത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יִשָּׂאוּם
  choice: അവയെ എടുത്തുകൊണ്ടുപോകുകയും ചെയ്തിരുന്നു
  rationale: ആവർത്തിതമായ ഭൂതകാലപ്രവർത്തനം സൂചിപ്പിക്കുന്ന imperfect രൂപം. പ്രത്യയം മുൻവാക്യത്തിലെ വെങ്കലപരിചകളെ സൂചിപ്പിക്കുന്നു.
- source_word: וֶהֱשִׁיבוּם
  choice: തിരികെ കൊണ്ടുവരുകയും ചെയ്തിരുന്നു
  rationale: שׁוב എന്ന ധാതുവിന്റെ Hiphil രൂപത്തിന് ‘തിരികെ കൊണ്ടുവരുക’ എന്ന കാരണാർഥമുണ്ട്. പതിവായി നടന്ന പ്രവൃത്തിയെന്ന ഭാവവും മലയാള ക്രിയാരൂപത്തിൽ നിലനിർത്തി.
- source_word: אֶל תָּא הָרָצִים
  choice: കാവൽക്കാരുടെ മുറിയിലേക്ക്
  rationale: תָּא ഒരു മുറിയെയോ അറയെയോ സൂചിപ്പിക്കുന്നു. ‘കാവൽക്കാരുടെ മുറി’ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
