translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആവർത്തിതമായ രാജകീയ ആചാരം ‘പ്രവേശിക്കുമ്പോഴെല്ലാം’ എന്നും ‘ചെയ്തിരുന്നു’ എന്നും വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
