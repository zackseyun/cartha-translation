source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: ml
  text: എന്റെ യജമാനനായ രാജാവേ, അങ്ങ്[a] എന്റെ യജമാനനായ രാജാവിന്റെ സിംഹാസനത്തിൽ അദ്ദേഹത്തിനുശേഷം ആരാണ് ഇരിക്കുകയെന്ന് അവരോട് അറിയിക്കേണ്ടതിനായി ഇസ്രായേൽ മുഴുവന്റെയും കണ്ണുകൾ അങ്ങയിലേക്കാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ വാക്യത്തിൽ ഊന്നലോടെയുള്ള ‘അങ്ങ്’ ആദ്യം വരുന്നു.
    reason: discourse_emphasis
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഇസ്രായേൽ മുഴുവന്റെയും കണ്ണുകൾ അങ്ങയുടെമേലാണ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: ആദരപൂർവമായ അഭിസംബോധനയും രാജപദവിയും നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: ഇസ്രായേൽ മുഴുവന്റെയും കണ്ണുകൾ അങ്ങയിലേക്കാണ്
  rationale: പ്രതീക്ഷയോടെയുള്ള ശ്രദ്ധയെ സൂചിപ്പിക്കുന്ന എബ്രായ ദൃശ്യപ്രയോഗം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: לְהַגִּיד לָהֶם
  choice: അറിയിച്ചുതരുമെന്നു പ്രതീക്ഷിച്ച്
  rationale: נגד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം വിവരം അറിയിക്കുക എന്ന അർഥം നൽകുന്നു; വാക്യഘടനയിൽ ഉദ്ദേശ്യവും പ്രതീക്ഷയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִי יֵשֵׁב
  choice: ആരാണ് ... ഇരിക്കേണ്ടത്
  rationale: രാജാവിന്റെ ഔദ്യോഗിക പ്രഖ്യാപനത്തിലൂടെ നിശ്ചയിക്കപ്പെടാനിരിക്കുന്ന അവകാശിയെക്കുറിച്ചുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל כִּסֵּא
  choice: സിംഹാസനത്തിൽ
  rationale: כִּסֵּא എന്നതിന്റെ നേരിട്ടുള്ള രാജകീയ അർഥം നിലനിർത്തുന്നു.
- source_word: אַחֲרָיו
  choice: അദ്ദേഹത്തിനുശേഷം
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം നിലനിർത്തുകയും രാജാവായ ദാവീദിനുശേഷമുള്ള പിൻഗാമിത്വം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: אַחֲרָיו എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: അദ്ദേഹത്തിനുശേഷം—രാജാവായ ദാവീദിനുശേഷം
  alternative: അതിനുശേഷം / പിന്നീട്
  rationale: എബ്രായരൂപത്തിൽ മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയം വ്യക്തമാണ്; അടുത്തുള്ള അഭിസംബോധിതനായ രാജാവിനെയാണ് അത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. സന്ദർഭം ദാവീദിനുശേഷമുള്ള രാജകീയ പിൻഗാമിത്വമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. രാജസഭാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ കണ്ണുകളുടെ ദൃശ്യപ്രയോഗവും പിൻഗാമിത്വസൂചനയും സംരക്ഷിച്ചു.
