  terminology: The transliterated names are suitable. ‘ശൂനേംകാരിയായ’ clearly conveys the gentilic, and ‘പരിചരിച്ചുകൊണ്ടിരുന്നു’ fits the caregiving/court-service context without ecclesiastical overtones.
