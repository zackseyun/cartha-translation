source:
  edition: WLC
  text: וַ/תָּבֹ֨א בַת שֶׁ֤בֶע אֶל הַ/מֶּ֨לֶךְ֙ הַ/חַ֔דְרָ/ה וְ/הַ/מֶּ֖לֶךְ זָקֵ֣ן מְאֹ֑ד וַֽ/אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית מְשָׁרַ֖ת אֶת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: ml
  text: അങ്ങനെ ബത്ത്-ശേബ രാജാവിന്റെ മുറിയിലേക്കു ചെന്നു.[a] രാജാവ് വളരെ വൃദ്ധനായിരുന്നു; ശൂനേംകാരിയായ അബീശഗ് രാജാവിനെ പരിചരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാജാവ് ഉണ്ടായിരുന്ന മുറിയിലേക്കു കടന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: ചെന്ന്
  rationale: വഴികാട്ടുന്ന ആഖ്യാനക്രിയയായി വരുന്നതിനാൽ, ബത്ത്-ശേബ രാജാവിന്റെ സ്വകാര്യ ഇടത്തേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: രാജാവിന്റെ സ്വകാര്യ മുറിയിലേക്ക് ചെന്ന് അദ്ദേഹത്തിന്റെ അടുക്കൽ എത്തി
  rationale: ദിശാസൂചകമായ הַחַדְרָה മുറിയിലേക്കുള്ള പ്രവേശനത്തെയും אֶל־הַמֶּלֶךְ രാജാവിന്റെ അടുക്കലേക്കുള്ള നീക്കത്തെയും സൂചിപ്പിക്കുന്നു. חֶדֶר എന്നതിന്റെ സ്വകാര്യമായ അകമുറി എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: രാജാവ് വളരെ വൃദ്ധനായിരുന്നു
  rationale: വാവ് ഇവിടെ പശ്ചാത്തലവിവരം നൽകുന്നു; മലയാളത്തിൽ പ്രത്യേക ബന്ധകമില്ലാതെയും ഈ വ്യത്യാസം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: ശൂനേംകാരിയായ അബീശഗ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും സ്ത്രീ സ്വദേശിവാചകത്തെ സ്വാഭാവിക മലയാളത്തിൽ സ്ഥലബന്ധമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: מְשָׁרַת
  choice: പരിചരിച്ചുകൊണ്ടിരുന്നു
  rationale: പാർട്ടിസിപ്പിൾ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനം നിലനിർത്തുന്നു. വൃദ്ധനായ രാജാവിന്റെ സാഹചര്യത്തിൽ സേവിക്കുക എന്നതോടൊപ്പം വ്യക്തിപരമായ ശുശ്രൂഷയുടെ ഭാവവും ഈ പ്രയോഗം നൽകുന്നു.
