translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജകീയ സ്വകാര്യ ഇടം സൂചിപ്പിക്കാൻ ‘സ്വകാര്യ മുറി’ ഉപയോഗിച്ചു; പരിചരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘പരിചരിച്ചുകൊണ്ടിരുന്നു’ തെരഞ്ഞെടുത്തു. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ [b] അടിക്കുറിപ്പ് ‘very old’ എന്നതിനു ചേർത്തിട്ടുണ്ടെങ്കിലും അതിന്റെ വാചകം מְשָׁרַת എന്ന പദത്തിന്റെ പര്യായമാണ്; അതിനാൽ തെറ്റായ മാർക്കർ ആവർത്തിക്കാതെ പ്രസക്തമായ പര്യായം മുഖ്യ lexical decision-ൽ രേഖപ്പെടുത്തി.
