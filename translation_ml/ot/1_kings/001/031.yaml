  to: 'അപ്പോൾ ബത്ത്-ശേബ മുഖം നിലത്തേക്കു കുനിഞ്ഞ് രാജാവിന്റെ മുമ്പിൽ പ്രണമിച്ചു പറഞ്ഞു: “എന്റെ പ്രഭുവായ ദാവീദ് രാജാവ് എന്നേക്കും ജീവിച്ചിരിക്കട്ടെ.”'
