    issue: “സാഷ്ടാംഗം” over-specifies the action.
    rationale: The Hebrew verb denotes bowing/prostration but does not specify the eight-limbed posture conventionally denoted by this Malayalam term.
  - severity: medium
    issue: “യജമാനനായ” is not the best modern equivalent for the royal address.
    rationale: In contemporary Malayalam it can primarily mean an owner/master. “പ്രഭുവായ” naturally conveys the respectful courtly title intended here.
