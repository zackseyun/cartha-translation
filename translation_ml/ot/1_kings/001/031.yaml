id: 1KI.1.31
reference: 1 Kings 1:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּקֹּ֨ד בַּת שֶׁ֤בַע אַפַּ֨יִם֙ אֶ֔רֶץ וַ/תִּשְׁתַּ֖חוּ לַ/מֶּ֑לֶךְ וַ/תֹּ֕אמֶר יְחִ֗י אֲדֹנִ֛/י הַ/מֶּ֥לֶךְ דָּוִ֖ד לְ/עֹלָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: ml
  text: 'അപ്പോൾ ബത്ത്-ശേബ മുഖം നിലത്തേക്കു കുനിഞ്ഞ് രാജാവിന്റെ മുമ്പിൽ പ്രണമിച്ചു പറഞ്ഞു: “എന്റെ പ്രഭുവായ ദാവീദ് രാജാവ് എന്നേക്കും ജീവിച്ചിരിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: കുനിച്ച്
  rationale: קָדַד ശരീരം താഴ്ത്തി വണങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ശക്തമായ സാഷ്ടാംഗപ്രണാമത്തിൽനിന്ന് വേർതിരിച്ചും സ്വാഭാവികമായും ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: אַפַּיִם אֶרֶץ
  choice: മുഖം നിലത്തോളം
  rationale: ‘മുഖം/മൂക്ക്—നിലം’ എന്ന എബ്രായ പ്രയോഗം അത്യന്തം താഴ്ന്ന് വണങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദൃശ്യഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַתִּשְׁתַּחוּ
  choice: സാഷ്ടാംഗം വീണു
  rationale: שׁחה എന്ന ക്രിയ ഇവിടെ രാജാവിനോടുള്ള ആദരസൂചകമായ പൂർണ പ്രണാമത്തെ സൂചിപ്പിക്കുന്നു; ആദ്യത്തെ ‘കുനിച്ച്’ എന്ന ക്രിയയേക്കാൾ തീവ്രമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ
  rationale: ലാമെദ് അക്ഷരാർത്ഥത്തിൽ ‘രാജാവിന്/രാജാവിനോട്’ എന്നാണെങ്കിലും, ആദരപ്രണാമത്തിന്റെ സാഹചര്യത്തിൽ ‘രാജാവിന്റെ മുമ്പിൽ’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְחִי
  choice: ജീവിച്ചിരിക്കട്ടെ
  rationale: ജുസ്സീവ് രൂപത്തിലുള്ള ആശംസയെയും രാജകീയ അഭിവാദ്യത്തെയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനായ
  rationale: രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന ആദരപദമാണ്; ഉടമസ്ഥതയുടെ ശബ്ദാർത്ഥവും കൊട്ടാരസന്ദർഭത്തിലെ ബഹുമാനവും നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: പദവിയും പേരും സ്വാഭാവികമായ ആധുനിക മലയാളക്രമത്തിൽ ചേർക്കുന്നു.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: രാജാവിന്റെ ദീർഘായുസ്സിനായുള്ള അതിശയോക്തിപരമായ രാജകീയ ആശംസയെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള കൊട്ടാരഭാഷ ഉപയോഗിച്ചു. രണ്ട് പ്രണാമക്രിയകളുടെയും ക്രമവും തീവ്രതാവ്യത്യാസവും സൂക്ഷിച്ചു; ‘എന്നേക്കും ജീവിച്ചിരിക്കട്ടെ’ എന്നത് രാജകീയ ആശംസയായി വായിക്കാവുന്ന വിധത്തിൽ അക്ഷരസമീപതയും സ്വാഭാവികതയും തുലനം ചെയ്തു.
