review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two successive gestures of obeisance, the royal setting, and the jussive acclamation. However, “സാഷ്ടാംഗം” specifies an eight-limbed prostration not stated in the Hebrew, and “യജമാനൻ” in modern Malayalam commonly suggests an owner or master rather than the courtly address intended by אֲדֹנִי.
  naturalness: The sentence is generally clear, but “മുഖം നിലത്തോളം കുനിച്ച്” is less idiomatic than “മുഖം നിലത്തേക്കു കുനിഞ്ഞ്,” and “സാഷ്ടാംഗം വീണു” is both culturally over-specific and stylistically less neutral for this context.
  terminology: Use “എന്റെ പ്രഭുവായ” for the respectful royal address “my lord.” This retains courtly deference without importing the modern ownership sense of “യജമാനൻ.”
  issues:
