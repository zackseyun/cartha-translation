id: 1KI.1.34
reference: 1 Kings 1:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: ml
  text: അവിടെ പുരോഹിതനായ സാദോക്കും പ്രവാചകനായ നാഥാനും അവനെ ഇസ്രായേലിന്മേൽ രാജാവായി അഭിഷേകം ചെയ്യണം. പിന്നെ നിങ്ങൾ കാഹളം[a] ഊതി, ‘ശലോമോൻ രാജാവ് നീണാൾ വാഴട്ടെ!’ എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ശോഫാർ’; പൊതുസൂചനകൾക്കും വിളംബരങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന ഒരു കൊമ്പുവാദ്യം. പാരമ്പര്യമായി ‘കാഹളം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: അഭിഷേകം ചെയ്യണം
  rationale: നിർദേശങ്ങളുടെ ഈ പരമ്പരയിൽ സംയോജകാക്ഷരത്തോടുകൂടിയ ഖാൽ പൂർണരൂപം ആജ്ഞാത്മക അർഥത്തിലാണ്; മലയാളത്തിലെ ‘ചെയ്യണം’ ആ നിർദേശം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സ്ഥലത്തെയാണ് സ്ഥാനസൂചക ക്രിയാവിശേഷണം ചൂണ്ടിക്കാണിക്കുന്നത്.
- source_word: צָדוֹק הַכֹּהֵן
  choice: പുരോഹിതനായ സാദോക്ക്
  rationale: പേര് ലിപ്യന്തരണം ചെയ്യുകയും പദവി സാധാരണ മലയാളത്തിൽ വിവർത്തനം ചെയ്യുകയും ചെയ്തു.
- source_word: וְנָתָן הַנָּבִיא
  choice: പ്രവാചകനായ നാഥാനും
  rationale: അഭിഷേകം ചെയ്യുന്ന രണ്ടാമത്തെ വ്യക്തിയെ ആദ്യത്തെയാളോടു സമനിലയിൽ ബന്ധിപ്പിക്കുന്നു; נָבִיא എന്നതിന് പതിവായ ‘പ്രവാചകൻ’ ഉപയോഗിച്ചു.
- source_word: לְמֶלֶךְ
  choice: രാജാവായി
  rationale: അഭിഷേകത്തിന്റെ ഫലമായ പദവിയെ ലാമെദ് സൂചിപ്പിക്കുന്നു; ‘രാജാവായി’ മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു
  rationale: രാജകീയ സന്ദർഭത്തിൽ עַל ജനത്തിന്മേലുള്ള ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിനു രാജാവായി’ എന്ന പ്രയോഗം ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: നിങ്ങൾ കാഹളം ഊതി
  rationale: ക്രിയ രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള തുടർനിർദേശമാണ്. שׁוֹפָר ഒരു കൊമ്പിൽനിന്നുള്ള വാദ്യമാണെങ്കിലും രാജകീയ വിളംബരസന്ദർഭത്തിൽ ‘കാഹളം’ സ്വാഭാവികവും പാരമ്പര്യപരവുമായ വിവർത്തനമാണ്; കൃത്യമായ വാദ്യസ്വഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַאֲמַרְתֶּם
  choice: എന്നു പറയണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള നിർദേശപരമ്പര തുടരുന്നു; മലയാളത്തിൽ കർത്താവ് മുൻഖണ്ഡത്തിൽനിന്ന് സ്വാഭാവികമായി തുടരുന്നു.
- source_word: יְחִי
  choice: നീണാൾ വാഴട്ടെ
  rationale: חיה എന്ന ക്രിയയുടെ ജസ്സീവ് രൂപത്തിലുള്ള രാജകീയ അഭിവാദനസൂത്രം അക്ഷരാർഥമായി ‘ജീവിക്കട്ടെ’ എന്നതിലുപരി മലയാളത്തിലെ പതിവായ ‘നീണാൾ വാഴട്ടെ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ്
  rationale: രാജകീയ അഭിവാദനത്തിൽ മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമമനുസരിച്ച് പേരിനു ശേഷം പദവി ചേർത്തു.
