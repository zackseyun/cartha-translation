translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. നിർദേശപരമ്പര ‘ചെയ്യണം/പറയണം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; രാജകീയ അഭിവാദനം മലയാളത്തിലെ സ്വാഭാവിക സൂത്രവാക്യമായി നൽകി.
