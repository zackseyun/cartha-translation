  source_fidelity: മൂലത്തിലെ നിഷ്ക്രിയമായ ‘അറിയിക്കപ്പെട്ടു,’ ഇരട്ട ശ്രദ്ധാകർഷണപദമായ הִנֵּה (‘ഇതാ’), അദോനീയാവിന്റെ ഭയം, യാഗപീഠത്തിന്റെ കൊമ്പുകൾ, ഇന്നുതന്നെ സത്യം ചെയ്യണമെന്ന അപേക്ഷ, വാളാൽ കൊല്ലാതിരിക്കൽ എന്നിവ കരട് വിശ്വസ്തമായി നൽകുന്നു. എന്നാൽ אָחַז എന്ന പൂർണ/സ്ഥിതിവാചക ക്രിയയുടെ ഫലം ‘പിടിച്ചിരിക്കുന്നു’ എന്നതിലൂടെ കൂടുതൽ കൃത്യമായി പ്രതിഫലിക്കും; ‘പിടിച്ചുകൊണ്ട്’ പ്രവൃത്തിയുടെ രീതിയെയോ സമകാലികതയെയോ അനാവശ്യമായി മുൻനിറുത്തുന്നു.
  naturalness: ഭാഷ പൊതുവേ ആധുനികവും വ്യക്തവുമാണ്. ‘കൊമ്പുകളിൽ പിടിച്ചിരിക്കുന്നു; ഇങ്ങനെ പറഞ്ഞു’ എന്ന ക്രമം മലയാള ആഖ്യാനശൈലിയിൽ കൂടുതൽ സ്വാഭാവികവും സംഭവക്രമത്തോട് കൂടുതൽ യോജിച്ചതുമാണ്.
  terminology: ‘യാഗപീഠം,’ ‘വാളുകൊണ്ട്,’ ‘സത്യം ചെയ്യട്ടെ,’ ‘ദാസൻ’ എന്നിവ ഉചിതമായ മാന്യമായ പദങ്ങളാണ്. ‘തന്റെ ദാസനെ’ രാജാവിന്റെ ദാസനെന്ന അദോനീയാവിന്റെ മൂന്നാംപുരുഷ വിനയപരമായ സ്വയംപരാമർശം സൂക്ഷിക്കുന്നു.
  issues:
