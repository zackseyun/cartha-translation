    issue: אָחַז-ന്റെ വിവർത്തനം ‘പിടിച്ചുകൊണ്ട്’ എന്നാണ്.
    rationale: ഇത് ‘പിടിച്ചിരിക്കുന്നു/പിടിച്ചുനിൽക്കുന്നു’ എന്ന നിലയേക്കാൾ പ്രവൃത്തിയുടെ അനുബന്ധരീതി സൂചിപ്പിക്കാൻ ഇടയാക്കുന്നു. മൂലത്തിലെ അവൻ ഇതിനകം കൊമ്പുകൾ പിടിച്ചിരിക്കുന്ന സ്ഥിതി വ്യക്തമായി നൽകുന്നതാണ് നല്ലത്.
  revised_text: 'ശലോമോനോട് ഇങ്ങനെ അറിയിക്കപ്പെട്ടു: “ഇതാ, അദോനീയാവ് ശലോമോൻ രാജാവിനെ ഭയപ്പെടുന്നു. ഇതാ, അവൻ യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിച്ചിരിക്കുന്നു; ഇങ്ങനെ പറഞ്ഞു: ‘തന്റെ ദാസനെ വാളുകൊണ്ട് കൊല്ലുകയില്ലെന്ന് ശലോമോൻ രാജാവ് ഇന്ന് എന്നോട് സത്യം ചെയ്യട്ടെ.’”'
