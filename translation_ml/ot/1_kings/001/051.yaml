  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: ml
  text: 'ശലോമോനോട് ഇങ്ങനെ അറിയിക്കപ്പെട്ടു: “ഇതാ, അദോനീയാവ് ശലോമോൻ രാജാവിനെ ഭയപ്പെടുന്നു. ഇതാ, അവൻ യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിച്ചിരിക്കുന്നു; ഇങ്ങനെ പറഞ്ഞു: ‘തന്റെ ദാസനെ വാളുകൊണ്ട് കൊല്ലുകയില്ലെന്ന് ശലോമോൻ രാജാവ് ഇന്ന് എന്നോട് സത്യം ചെയ്യട്ടെ.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: അറിയിക്കപ്പെട്ടു
  rationale: ഹീബ്രായ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാള പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: വാർത്തയിലെ അടിയന്തരതയും ശ്രദ്ധ ക്ഷണിക്കുന്ന ആവർത്തനവും രണ്ടിടത്തും സംരക്ഷിക്കുന്നു.
- source_word: יָרֵא
  choice: ഭയപ്പെടുന്നു
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഭയത്തിന്റെയോ ആദരത്തിന്റെയോ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ കൊമ്പുകൾ
  rationale: പുരാതന യാഗപീഠത്തിന്റെ സാങ്കേതിക ഭാഗത്തെ സൂചിപ്പിക്കുന്ന രൂപകം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: כַיּוֹם
  choice: ഇന്ന്
  rationale: ഈ സന്ദർഭത്തിൽ ഉടൻതന്നെ ഉറപ്പ് ലഭിക്കണമെന്ന അഭ്യർഥനയാണ് സ്വാഭാവികമായി പ്രകടമാക്കുന്നത്.
- source_word: אִם יָמִית
  choice: കൊല്ലുകയില്ലെന്ന്
  rationale: സത്യവാചകത്തിനു ശേഷമുള്ള ഹീബ്രായ നിഷേധാത്മക ശപഥസൂത്രത്തിന്റെ ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനെ
  rationale: അദോനീയാവ് രാജാവിനോടുള്ള കീഴ്വഴക്കം പ്രകടിപ്പിക്കാൻ സ്വയം ഉപയോഗിക്കുന്ന മൂന്നാംപുരുഷ വിനയപ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിക്കുന്ന പ്രവൃത്തിയുടെ അർഥം
  choice: പ്രവൃത്തി മാത്രം പരിഭാഷപ്പെടുത്തി; അഭയാവകാശമെന്ന വ്യാഖ്യാനം വാക്യത്തിൽ ചേർത്തില്ല
  alternative: അഭയം തേടി യാഗപീഠത്തിൽ പിടിച്ചു എന്ന് വ്യക്തമാക്കുക
  rationale: മൂലപാഠം പ്രവൃത്തിയെ വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ നിയമപരമോ ആചാരപരമോ ആയ അർഥം ഇവിടെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല.
- issue: אִם എന്ന ശപഥസൂത്രം
  choice: ‘കൊല്ലുകയില്ലെന്ന് ... സത്യം ചെയ്യട്ടെ’
  alternative: ‘കൊന്നാൽ...’ എന്ന അപൂർണ ശാപസൂത്രം ഔപചാരികമായി നിലനിർത്തുക
  rationale: ഹീബ്രായത്തിൽ പരോക്ഷമായിരിക്കുന്ന നിഷേധാർഥം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നൽകുന്നു; ദൈവശിക്ഷയെയോ മറ്റേതെങ്കിലും പൂർത്തീകരണത്തെയോ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായത്തിലെ ഇരട്ട ‘ഇതാ’യും അദോനീയാവിന്റെ മൂന്നാംപുരുഷ വിനയപ്രയോഗവും നിലനിർത്തി; അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കി.
