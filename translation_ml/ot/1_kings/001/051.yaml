revisions:
- from: 'ശലോമോനോട് ഇങ്ങനെ അറിയിക്കപ്പെട്ടു: “ഇതാ, അദോനീയാവ് ശലോമോൻ രാജാവിനെ ഭയപ്പെടുന്നു. ഇതാ, അവൻ യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിച്ചുകൊണ്ട് ഇങ്ങനെ പറയുന്നു: ‘തന്റെ ദാസനെ വാളുകൊണ്ട് കൊല്ലുകയില്ലെന്ന് ശലോമോൻ രാജാവ് ഇന്ന് എന്നോട് സത്യം ചെയ്യട്ടെ.’”'
  to: 'ശലോമോനോട് ഇങ്ങനെ അറിയിക്കപ്പെട്ടു: “ഇതാ, അദോനീയാവ് ശലോമോൻ രാജാവിനെ ഭയപ്പെടുന്നു. ഇതാ, അവൻ യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിച്ചിരിക്കുന്നു; ഇങ്ങനെ പറഞ്ഞു: ‘തന്റെ ദാസനെ വാളുകൊണ്ട് കൊല്ലുകയില്ലെന്ന് ശലോമോൻ രാജാവ് ഇന്ന് എന്നോട് സത്യം ചെയ്യട്ടെ.’”'
  rationale: യാഗപീഠത്തിന്റെ കൊമ്പുകൾ പിടിച്ചിരിക്കുന്ന അദോനീയാവിന്റെ നിലവിലുള്ള അവസ്ഥയെ കൂടുതൽ നേരിട്ട് അറിയിക്കാൻ ‘പിടിച്ചുകൊണ്ട്’ എന്നത് ‘പിടിച്ചിരിക്കുന്നു’ എന്നാക്കി. ഉദ്ധരണിയുടെ ആഖ്യാനപരമായ അവതരണം അതിനനുസരിച്ച് ഭൂതകാലമായ ‘പറഞ്ഞു’ എന്നാക്കി. അർഥം, ആവർത്തനം, വിനയപരമായ മൂന്നാംപുരുഷ സ്വയംപരാമർശം എന്നിവ മാറ്റിയിട്ടില്ല.
