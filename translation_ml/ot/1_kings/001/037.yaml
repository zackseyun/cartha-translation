  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകി.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: …ഉപോലെ, …ഉം
  rationale: മുൻകാലത്തെ ദൈവസാന്നിധ്യവും ശലോമോനെക്കുറിച്ചുള്ള ആശംസയും തമ്മിലുള്ള എബ്രായ താരതമ്യഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָיָה ... עִם
  choice: …നോടുകൂടെ ഉണ്ടായിരുന്നതു
  rationale: ദാവീദിനൊപ്പമുള്ള യഹോവയുടെ മുൻകാലവും തുടർന്നുവന്നതുമായ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന പൂർണ്ണക്രിയയുടെ പശ്ചാത്തലബോധം സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരസൂചക അഭിസംബോധനയും രാജപദവിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: יהי
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: ആശംസയെയോ അനുഗ്രഹപ്രാർത്ഥനയെയോ സൂചിപ്പിക്കുന്ന ജസ്സീവ് ഭാവം നൽകുന്നു; എബ്രായത്തിലെ പരോക്ഷ കർത്താവിനെ നിർബന്ധമായി ആവർത്തിക്കുന്നില്ല.
- source_word: וִיגַדֵּל
  choice: മഹത്താക്കട്ടെ
  rationale: גדל എന്ന ധാതുവിന്റെ കാരണാർഥം ‘മഹത്താക്കുക’ എന്നു നൽകുകയും സിംഹാസനത്തിന്റെ ഉന്നതിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּסְאוֹ
  choice: അവന്റെ സിംഹാസനം
  rationale: രാജത്വം എന്ന പരോക്ഷ അർഥം സാധ്യമെങ്കിലും മൂലത്തിലെ ദൃശ്യരൂപമായ ‘സിംഹാസനം’ നിലനിർത്തുന്നു.
- source_word: מִכִּסֵּא
  choice: സിംഹാസനത്തെക്കാൾ
  rationale: מן സൂചിപ്പിക്കുന്ന താരതമ്യം മലയാളത്തിലെ ‘-ത്തെക്കാൾ’ ഘടനയിലൂടെ വ്യക്തമായി നൽകുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: എന്റെ യജമാനനായ ദാവീദ്‌രാജാവ്
  rationale: ദാവീദിനോടുള്ള ആദരസൂചക പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിലുള്ള രാജനാമരൂപവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തി.
- issue: יהי എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: കർത്താവിനെ ആവർത്തിക്കാതെ ‘ഉണ്ടായിരിക്കട്ടെ’
  alternative: ‘യഹോവ ശലോമോനോടും കൂടെ ഉണ്ടായിരിക്കട്ടെ’
  rationale: കർത്താവ് മുൻവാക്യത്തിലെ യഹോവയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; എങ്കിലും എബ്രായം കർത്താവിനെ വീണ്ടും പ്രസ്താവിക്കാത്തതിനാൽ ആ ഘടനയും ചെറിയ വ്യാകരണപരമായ അനിശ്ചിതത്വവും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജസദസ്സ് ഭാഷ ഉപയോഗിച്ചു. ‘എന്റെ യജമാനനായ രാജാവ്’, ‘സിംഹാസനം’, ‘മഹത്താക്കട്ടെ’ എന്നീ രൂപങ്ങൾ മൂലത്തിലെ ആദരവും രാജകീയ ദൃശ്യഭാഷയും നിലനിർത്തുന്നു.
