  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: ml
  text: “യഹോവ എന്റെ യജമാനനായ രാജാവിനോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ, ശലോമോനോടും കൂടെ ഉണ്ടായിരിക്കട്ടെ[a]; ശലോമോന്റെ സിംഹാസനത്തെ എന്റെ യജമാനനായ ദാവീദ് രാജാവിന്റെ സിംഹാസനത്തെക്കാൾ മഹത്തരമാക്കട്ടെ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവ ശലോമോനോടും കൂടെ ഉണ്ടായിരിക്കട്ടെ.” എബ്രായത്തിലെ ആശംസാസൂചകമായ “ഉണ്ടായിരിക്കട്ടെ” എന്ന ക്രിയയുടെ കർത്താവ് പരോക്ഷമാണ്; മുൻവാക്യത്തിലെ യഹോവയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
