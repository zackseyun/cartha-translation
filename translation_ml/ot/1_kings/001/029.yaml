  text: 'രാജാവ് ആണയിട്ടു പറഞ്ഞു: “സകല കഷ്ടതകളിൽനിന്നും എന്റെ ജീവനെ[a] വീണ്ടെടുത്ത യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതുപോലെ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എന്റെ പ്രാണനെ.” എബ്രായത്തിലെ നെഫെഷ് എന്ന പദത്തിന് പ്രാണൻ, വ്യക്തി, ജീവൻ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അപകടത്തിൽനിന്നു സംരക്ഷിക്കപ്പെട്ട ദാവീദിന്റെ ജീവനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ആണയിട്ടു
  rationale: നിഫാൽ രൂപത്തിലുള്ള ക്രിയയ്ക്ക് ‘ശപഥം ചെയ്തു/ആണയിട്ടു’ എന്ന അർഥമുണ്ട്. കഥാഖ്യാനത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗമായി ‘ആണയിട്ടു’ തിരഞ്ഞെടുത്തു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: മൂലപാഠം ദാവീദ് എന്ന വ്യക്തിനാമത്തിനു പകരം നിശ്ചിതമായ സ്ഥാനപ്പേരാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതേ രൂപം നിലനിർത്തി.
- source_word: וַיֹּאמַר
  choice: പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ സംസാരക്രിയയ്ക്ക് അധികമായ വാചാടോപബലം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതുപോലെ
  rationale: ഇത് എബ്രായത്തിലെ പതിവ് ആണയിടൽ സൂത്രവാക്യമാണ്. മലയാളത്തിൽ ആണയിടലിന്റെ അർഥം വ്യക്തമാകുന്ന വിധത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന മലയാളരൂപത്തിൽ നൽകി.
- source_word: פָּדָה
  choice: വീണ്ടെടുത്ത
  rationale: פדה എന്ന ക്രിയയിലെ വിടുവിക്കൽ/വിലകൊടുത്തു മോചിപ്പിക്കൽ എന്ന സമൃദ്ധമായ അർഥം നിലനിർത്താൻ ‘വീണ്ടെടുത്ത’ ഉപയോഗിച്ചു.
- source_word: נַפְשִׁי
  choice: എന്റെ ജീവനെ
  rationale: ഇവിടെ נֶפֶשׁ ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കാൾ അപകടത്തിൽനിന്നു സംരക്ഷിക്കപ്പെട്ട ദാവീദിന്റെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִכָּל צָרָה
  choice: സകല കഷ്ടതകളിൽനിന്നും
  rationale: כָּל എന്ന പദത്തിന്റെ സമഗ്രതയും צָרָה സൂചിപ്പിക്കുന്ന ദുരിതം/ഞെരുക്കവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തി, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതിരിക്കാൻ ‘Yahweh’ എന്ന രൂപത്തോട് അടുത്ത മലയാളലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: נַפְשִׁי എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: എന്റെ ജീവനെ
  alternative: എന്റെ പ്രാണനെ; എന്നെത്തന്നെ
  rationale: വാക്യം അപകടങ്ങളിൽനിന്നുള്ള ദൈവിക രക്ഷയെക്കുറിച്ചാണ്; മനുഷ്യന്റെ അഭൗതിക ഘടകത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇവിടെ നിർബന്ധമല്ല. അതിനാൽ സന്ദർഭോചിതമായ ‘ജീവൻ’ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവമുള്ള കഥാഖ്യാനശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്ന ആണയിടലിന്റെ ആരംഭമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
