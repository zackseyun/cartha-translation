  text: וַ/יִּשְׁמַ֣ע אֲדֹנִיָּ֗הוּ וְ/כָל הַ/קְּרֻאִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וְ/הֵ֖ם כִּלּ֣וּ לֶ/אֱכֹ֑ל וַ/יִּשְׁמַ֤ע יוֹאָב֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר וַ/יֹּ֕אמֶר מַדּ֥וּעַ קֽוֹל הַ/קִּרְיָ֖ה הוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: ml
  text: അദോനീയാവും അവനോടുകൂടെ ഉണ്ടായിരുന്ന ക്ഷണിക്കപ്പെട്ടവരെല്ലാവരും ഭക്ഷണം കഴിച്ചുതീർക്കുമ്പോൾ ആ ശബ്ദം കേട്ടു.[a] യോവാബ് കാഹളത്തിന്റെ[b] ശബ്ദം കേട്ടപ്പോൾ, “നഗരത്തിൽ ഇങ്ങനെ കോലാഹലമുണ്ടാകുന്നതെന്തുകൊണ്ട്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ ഭക്ഷണം കഴിച്ചുതീർന്ന ഉടനെ.” ഭക്ഷണം അവസാനിച്ചുകഴിഞ്ഞ നിമിഷത്തെയോ അവർ കഴിച്ചുതീർക്കുന്ന ഘട്ടത്തെയോ ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഷോഫാർ’; പൊതുജനങ്ങൾക്കു സൂചന നൽകാൻ ഉപയോഗിച്ചിരുന്ന കൊമ്പുകൊണ്ടുള്ള കാഹളം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ആ ശബ്ദം കേട്ടു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘കേട്ടു’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ ആഘോഷശബ്ദത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആ ശബ്ദം’ ചേർത്തു.
- source_word: הַקְּרֻאִים
  choice: ക്ഷണിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപം; വിരുന്നിന്റെ സന്ദർഭത്തിൽ ക്ഷണിക്കപ്പെട്ട അതിഥികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: ഭക്ഷണം കഴിച്ചുതീർക്കുമ്പോൾ
  rationale: ഭക്ഷണം അവസാനിക്കുന്ന സമയത്താണ് അവർ ശബ്ദം കേട്ടതെന്ന കാലബന്ധം സ്വാഭാവികമായി നൽകുന്നു; പൂർത്തിയായ ഉടനെയോ പൂർത്തിയാകുന്ന ഘട്ടത്തിലോ എന്ന എബ്രായത്തിലെ സൂക്ഷ്മമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: קוֹל הַשּׁוֹפָר
  choice: കാഹളത്തിന്റെ ശബ്ദം
  rationale: שׁוֹפָר പൊതുസൂചനയ്ക്കായി ഊതിയിരുന്ന കൊമ്പുകൊണ്ടുള്ള കാഹളമാണ്. മുഖ്യവാചകത്തിൽ വ്യക്തവും പരിചിതവുമായ ‘കാഹളം’ ഉപയോഗിച്ചു; സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מַדּוּעַ
  choice: എന്താണ്?
  rationale: ശബ്ദത്തിന്റെ കാരണം അന്വേഷിക്കുന്ന നേരിട്ടുള്ള ചോദ്യം മലയാളത്തിൽ ‘ഈ കോലാഹലം എന്താണ്?’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: നഗരത്തിൽ ഈ കോലാഹലം
  rationale: קוֹל, הוֹמָה എന്നിവ ചേർന്ന് നഗരത്തിലെ മുഴങ്ങുന്ന കലഹശബ്ദത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥഘടന നിർബന്ധിക്കാതെ അർഥവും ചോദ്യംചെയ്യുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: אֲדֹנִיָּהוּ
  choice: അദോനീയാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾപാരമ്പര്യത്തോടും എബ്രായ ഉച്ചാരണത്തോടും യോജിക്കുന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായവാക്യത്തിലെ ഭക്ഷണം പൂർത്തിയാകുന്ന സമയസൂചനയുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
