  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: ml
  text: 'രാജാവിന്റെ ദാസന്മാരും നമ്മുടെ യജമാനനായ ദാവീദ് രാജാവിനെ അനുഗ്രഹിക്കാൻ വന്ന് ഇങ്ങനെ പറഞ്ഞു: “അങ്ങയുടെ ദൈവം ശലോമോന്റെ പേര് അങ്ങയുടെ പേരിനെക്കാൾ ശ്രേഷ്ഠമാക്കട്ടെ[a]; അവന്റെ സിംഹാസനം അങ്ങയുടെ സിംഹാസനത്തെക്കാൾ മഹത്താക്കട്ടെ.” രാജാവ് കിടക്കമേൽ കുനിഞ്ഞു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “പേര്” എന്നത് പ്രശസ്തി, കീർത്തി എന്നീ അർത്ഥങ്ങളും വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് “കുനിഞ്ഞു” എന്നും “ആരാധിച്ചു” എന്നും അർത്ഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: -ഉം
  rationale: മുൻവിവരണത്തോടുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ ദാസന്മാർ
  rationale: രാജസദസ്സിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ ഉൾക്കൊള്ളാവുന്ന വിശാലവും ഉറവിടത്തോട് ചേർന്നതുമായ പ്രയോഗം.
- source_word: לְבָרֵךְ
  choice: അനുഗ്രഹിക്കാൻ
  rationale: ഇവിടെ പറയപ്പെടുന്ന ഔപചാരികമായ ആശംസയുടെയും അനുഗ്രഹവചനത്തിന്റെയും മതപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: നമ്മുടെ യജമാനനായ ദാവീദ് രാജാവ്
  rationale: രാജകീയ ബഹുമാനസൂചകമായ אֲדֹנֵינוּ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: ശലോമോന്റെ പേര് അങ്ങയുടെ പേരിനെക്കാൾ ശ്രേഷ്ഠമാക്കട്ടെ
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥവും מן-ന്റെ താരതമ്യബലവും നിലനിർത്തുന്നു; ‘പേര്’ എന്ന ഉറവിടരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: അവന്റെ സിംഹാസനം അങ്ങയുടെ സിംഹാസനത്തെക്കാൾ മഹത്താക്കട്ടെ
  rationale: രാജാധികാരത്തിന്റെയും വംശപരമ്പരയുടെയും സിംഹാസനരൂപകവും താരതമ്യഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  rationale: ശാരീരികമായി കുനിയുക, ഭക്തിപൂർവം നമസ്കരിക്കുക എന്നീ അർത്ഥസാധ്യതകൾ ഒന്നും പൂർണമായി ഒഴിവാക്കാത്ത മലയാളപ്രയോഗം.
- source_word: עַל הַמִּשְׁכָּב
  choice: കിടക്കമേൽ
  rationale: പ്രകടമായ ഉടമസ്ഥസൂചന ചേർക്കാതെ എബ്രായത്തിലെ നിർദ്ദിഷ്ട ‘കിടക്ക’യെ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ എന്നത് വ്യക്തമായ ദൈവാരാധനയാണോ ശാരീരികമായി കുനിയലാണോ
  choice: കുനിഞ്ഞു നമസ്കരിച്ചു
  alternative: ആരാധിച്ചു / കുനിഞ്ഞു
  rationale: ഈ വാക്യത്തിൽ പ്രവൃത്തിയുടെ ലക്ഷ്യം വ്യക്തമല്ല. അതിനാൽ ദൈവാരാധനയെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെയും വെറും ശരീരചലനമായി ചുരുക്കാതെയും മൂലത്തിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ ഉപയോഗിച്ച് സദസ്സിലെ ബഹുമാനം നിലനിർത്തി; അത്യന്തം പുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
