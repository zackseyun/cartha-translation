  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: ml
  text: പിന്നെ നിങ്ങൾ അവന്റെ പിന്നാലെ കയറിച്ചെല്ലണം. അവൻ വന്ന് എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും; അവൻ എനിക്കു പകരം വാഴും. ഇസ്രായേലിനും യെഹൂദയ്ക്കുംമേൽ ഭരണാധികാരിയായിരിക്കാൻ ഞാൻ അവനെ നിയോഗിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിനും യെഹൂദയ്ക്കുംമേൽ നേതാവായിരിക്കാൻ ഞാൻ അവനോടു കല്പിച്ചിരിക്കുന്നു.” എബ്രായ ക്രിയയ്ക്ക് സാധാരണയായി “കല്പിക്കുക” എന്നും נָגִיד എന്ന പദത്തിന് “പ്രഭു” അല്ലെങ്കിൽ “നേതാവ്” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: നിങ്ങൾ കയറിച്ചെല്ലണം
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറുക/മുകളിലേക്കു പോകുക’ എന്ന ദിശാബോധം നിലനിർത്തുന്നു; ഘോഷയാത്രയുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായ മലയാള പ്രയോഗമാണിത്.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: ഘോഷയാത്രയിൽ അവനെ പിന്തുടരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: וּבָא
  choice: അവൻ വന്ന്
  rationale: בוא എന്നതിന്റെ വിശാലമായ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥത്തിൽ, തുടർന്നുള്ള സിംഹാസനാരോഹണ പ്രവൃത്തിയെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ ഏറ്റവും ലളിതമായ അർഥം നൽകുന്നു.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: എന്റെ സിംഹാസനത്തിൽ ഇരിക്കട്ടെ
  rationale: രാജകീയ സിംഹാസനാരോഹണത്തിന്റെ ദൃശ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു. നിർദേശങ്ങളുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അനുമതിപരമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: അവൻ എനിക്കു പകരം രാജാവായി വാഴും
  rationale: תַּחְתָּי ഇവിടെ സ്ഥാനത്തിലും അധികാരത്തിലും പകരം വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എനിക്കു ശേഷം’ എന്ന വെറും കാലക്രമാർഥം ഒഴിവാക്കി സ്ഥാനപിന്തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: צִוִּיתִי
  choice: ഞാൻ അവനെ നിയോഗിച്ചിരിക്കുന്നു
  rationale: צוה സാധാരണയായി ‘കല്പിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ഒരാളെ ഭരണസ്ഥാനത്തേക്കു നിശ്ചയിക്കുന്ന നിർവഹണപരമായ ആശയം സന്ദർഭം നൽകുന്നു. അടിസ്ഥാനമായ ‘കല്പിച്ചു’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לִהְיוֹת נָגִיד
  choice: ഭരണാധികാരിയായിരിക്കാൻ
  rationale: נָגִיד എന്നത് നേതാവ്, പ്രഭു, ഭരണാധികാരി എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. מלך എന്ന ‘വാഴുക’ എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് രാജകീയ സന്ദർഭത്തിന് യോജിക്കുന്ന പൊതുവായ പദം തെരഞ്ഞെടുത്തു.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: ഇസ്രായേലിനും യെഹൂദയ്ക്കും മേൽ
  rationale: രണ്ടു ജനവിഭാഗങ്ങളുടെയും മേലുള്ള അധികാരം വ്യക്തമാക്കുന്നു; ആവർത്തിച്ച עַל എന്നതിന്റെ വ്യാപ്തി മലയാളത്തിലെ സമാന്തര ദാതൃവിഭക്തിയും ‘മേൽ’ എന്ന പദവും ചേർത്ത് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: נָגִיד എന്ന രാജകീയ സ്ഥാനപ്പേരും מלך എന്ന വാഴ്ചാസൂചക ക്രിയയും തമ്മിലുള്ള വ്യത്യാസം
  choice: מלך എന്നത് ‘രാജാവായി വാഴും’ എന്നും נָגִיד എന്നത് ‘ഭരണാധികാരി’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: נָגִיד എന്നത് ‘പ്രഭു’ അല്ലെങ്കിൽ ‘നേതാവ്’ എന്നും നൽകാം.
  rationale: രണ്ടു എബ്രായ പദങ്ങളെയും ഒരേ ‘രാജാവ്’ എന്ന പദത്തിലേക്ക് ചുരുക്കാതെ അവയുടെ വ്യത്യസ്ത സൂക്ഷ്മത നിലനിർത്തുന്നു; പ്രത്യേക സമുദായത്തിന്റെ ഭരണശാസ്ത്രപരമായ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ രാജകീയ പ്രസംഗത്തിന് യോജിച്ച അന്തസ്സുള്ള മലയാളം. ‘കയറിച്ചെല്ലണം’, ‘സിംഹാസനം’, ‘രാജാവായി വാഴും’, ‘ഭരണാധികാരി’ എന്നിവ ദിശ, സിംഹാസനാരോഹണം, സ്ഥാനപിന്തുടർച്ച, ഔദ്യോഗിക നിയമനം എന്നീ ഘടകങ്ങൾ നിലനിർത്തുന്നു.
