id: 1KI.1.27
reference: 1 Kings 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: ml
  text: “ഈ കാര്യം[a] എന്റെ യജമാനനായ രാജാവിൽനിന്ന് ഉണ്ടായതാണെങ്കിൽ, അദ്ദേഹത്തിനുശേഷം എന്റെ യജമാനനായ രാജാവിന്റെ സിംഹാസനത്തിൽ ആരാണ് ഇരിക്കുകയെന്ന് അങ്ങ് അങ്ങയുടെ ദാസന്മാരെ അറിയിച്ചിട്ടില്ലേ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈ സംഗതി” അല്ലെങ്കിൽ “ഈ സംഭവം.”'
    reason: דבר എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘കാര്യം,’ ‘സംഗതി,’ ‘സംഭവം’ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: אִם
  choice: …ആണോ?
  rationale: ഇവിടെ אִם ഒരു നിബന്ധനയായോ സൂക്ഷ്മമായ ചോദ്യം ഉന്നയിക്കുന്ന ഘടകമായോ ഗ്രഹിക്കാം. സന്ദർഭത്തിലെ ചോദ്യഭാവം സ്വാഭാവികമായ മലയാള ചോദ്യംകൊണ്ട് നിലനിർത്തുന്നു; ആരോപണത്തിന്റെ തീവ്രത അനാവശ്യമായി കൂട്ടുന്നില്ല.
- source_word: מֵאֵת … נִהְיָה
  choice: …യിൽനിന്ന് ഉണ്ടായതാണോ
  rationale: കാര്യത്തിന്റെ ഉറവിടമോ രാജകീയ അംഗീകാരമോ രാജാവാണെന്ന ആശയം ഈ സംയുക്തപ്രയോഗം നൽകുന്നു. ‘യിൽനിന്ന് ഉണ്ടായത്’ ഉറവിടത്തെ വ്യക്തമാക്കുകയും തീരുമാനമോ കല്പനയോ എന്നു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: രാജസന്നിധിയിലെ ആദരപൂർവമായ അഭിസംബോധന സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דבר ഇവിടെ റിപ്പോർട്ട് ചെയ്യപ്പെട്ട രാജകീയ നടപടിയെയോ സംഭവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കാര്യം’ എന്നത് അതിന്റെ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: അങ്ങ് അറിയിച്ചില്ലല്ലോ?
  rationale: ידע എന്ന ക്രിയയുടെ ഹിഫ്ഈൽ രൂപം ‘അറിയിക്കുക’ എന്നാണ്. വാക്യത്തിന്റെ ആക്ഷേപസൂചകമായ ചോദ്യഭാവം ‘ഇല്ലല്ലോ?’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരെ
  rationale: രാജധാനിയിലെ ഉദ്യോഗസ്ഥർ രാജാവിനോടു വിനയത്തോടെ സ്വയം വിശേഷിപ്പിക്കുന്ന പ്രയോഗമാണിത്; ഇവിടെ അടിമത്തത്തെ മുൻനിറുത്തുന്നതിനേക്കാൾ ‘ദാസന്മാർ’ അനുയോജ്യം.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: സിംഹാസനത്തിൽ … ആരാണ് ഇരിക്കുകയെന്ന്
  rationale: ‘സിംഹാസനത്തിൽ ഇരിക്കുക’ എന്ന മൂലഭാഷയിലെ രാജാവകാശചിത്രം ‘ഭരിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אַחֲרָיו
  choice: അദ്ദേഹത്തിനുശേഷം
  rationale: നിലവിലെ രാജാവിനു ശേഷമുള്ള പിൻഗാമിത്വത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘അദ്ദേഹത്തിന്റെ സ്ഥാനത്ത്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: രാജസന്നിധിയിലെ עבד എന്ന സ്വയംവിശേഷണം
  choice: അങ്ങയുടെ ദാസന്മാർ
  alternative: അങ്ങയുടെ അടിമകൾ
  rationale: ഈ സന്ദർഭത്തിൽ പദം രാജാവിനോടുള്ള കീഴ്വഴക്കവും വിനയവും സൂചിപ്പിക്കുന്ന കൊട്ടാരപ്രയോഗമാണ്; വ്യക്തികളുടെ നിയമപരമായ അടിമസ്ഥിതി പ്രസ്താവിക്കുകയാണ് പ്രധാന ഉദ്ദേശ്യമല്ല.
- issue: אִם ഉൾപ്പെട്ട വാക്യത്തിന്റെ ചോദ്യാത്മകത
  choice: ‘…ആണോ?’ എന്ന നേരിട്ടുള്ള ചോദ്യം
  alternative: ‘ഈ കാര്യം അങ്ങയിൽനിന്നാണ് ഉണ്ടായതെങ്കിൽ…’ എന്ന നിബന്ധനാവാക്യം
  rationale: സന്ദർഭത്തിൽ ഇത് രാജാവിന്റെ അനുമതിയോടെയാണോ സംഭവം നടന്നതെന്ന് ചോദിക്കുന്ന ആക്ഷേപസൂചക വാക്യമാണ്. എങ്കിലും ഉറവിടഭാഷയിലെ അനിശ്ചിതത്വം ‘തീർച്ചയായും’ പോലുള്ള പദങ്ങൾ ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ രാജസദസ്സ്-രജിസ്റ്റർ ഉപയോഗിച്ചു. രാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ എന്നും പരാമർശിക്കുമ്പോൾ ‘അദ്ദേഹം’ എന്നും നൽകി. മൂലത്തിലെ സിംഹാസനചിത്രവും ചോദ്യം ഉയർത്തുന്ന സംഘർഷവും നിലനിർത്തി.
