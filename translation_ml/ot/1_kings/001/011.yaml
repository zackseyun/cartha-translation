base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: ml
  text: 'അപ്പോൾ നാഥാൻ ശലോമോന്റെ അമ്മയായ ബത്ത്-ശേബയോടു പറഞ്ഞു: “ഹഗ്ഗീത്തിന്റെ മകനായ അദോനീയാവ് രാജാവായിരിക്കുന്നു[a] എന്നും നമ്മുടെ പ്രഭുവായ ദാവീദ് അത് അറിഞ്ഞിട്ടില്ല എന്നും നീ കേട്ടില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്നെത്തന്നെ രാജാവാക്കിയിരിക്കുന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “രാജാവായിരിക്കുന്നു/വാഴുന്നു” എന്നാണ്. സന്ദർഭം സ്വയം ഉയർത്തലിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം അത് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  choice: ശലോമോന്റെ അമ്മയായ ബത്ത്-ശേബ
  rationale: ബന്ധസൂചകമായ എബ്രായ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: നീ കേട്ടില്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ സ്വരം മലയാളത്തിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായിരിക്കുന്നു
  rationale: രാജാവാകുക/രാജാവായി വാഴുക എന്ന സംഭവാർഥം സൂക്ഷിക്കുന്നു; അദോനീയാവ് സ്വയം ഉയർത്തിയെന്ന സന്ദർഭസൂചന വാക്യത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: ഹഗ്ഗീത്തിന്റെ മകനായ അദോനീയാവ്
  rationale: പുത്രബന്ധം വ്യക്തമായി നൽകുകയും പേരുകൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: നമ്മുടെ യജമാനനായ ദാവീദ്
  rationale: രാജാവിനുള്ള മാനുഷിക ബഹുമാനപദവി സൂക്ഷിക്കുന്നു; ദൈവിക അഭിസംബോധനയായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘യജമാനൻ’ ഉപയോഗിക്കുന്നു.
- source_word: לֹא יָדָע
  choice: അത് അറിഞ്ഞിട്ടില്ല
  rationale: എബ്രായത്തിൽ പരോക്ഷമായി നിൽക്കുന്ന കർമം മലയാളത്തിൽ ‘അത്’ എന്നു വ്യക്തമാക്കുകയും ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള അറിവില്ലായ്മ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദാവീദിനെക്കുറിച്ചുള്ള אֲדֹנֵינוּ എന്ന ബഹുമാനപദവിയുടെ പരിഭാഷ
  choice: നമ്മുടെ യജമാനനായ ദാവീദ്
  alternative: നമ്മുടെ പ്രഭുവായ ദാവീദ്
  rationale: ഇവിടെ പദം ദൈവിക നാമമോ പദവിയോ അല്ല, രാജാവിനുള്ള രാജസഭാ ബഹുമാനപദവിയാണ്. ‘യജമാനൻ’ ആ മാനുഷിക ബന്ധവും ബഹുമാനവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- issue: מָלַךְ എന്ന ക്രിയയിൽ അദോനീയാവിന്റെ സ്വയം-രാജത്വപ്രഖ്യാപനം വ്യക്തമാക്കണമോ
  choice: രാജാവായിരിക്കുന്നു
  alternative: സ്വയം രാജാവാക്കിയിരിക്കുന്നു
  rationale: സന്ദർഭം സ്വയം ഉയർത്തലിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ഈ ക്രിയ തന്നെ ‘സ്വയം’ എന്ന ആശയം തുറന്നുപറയുന്നില്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ അർഥസമ്മർദം ഒഴിവാക്കി മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവം നിലനിർത്തിയിട്ടുണ്ട്; പേരുകൾ പ്രചാരത്തിലുള്ള ബൈബിൾ-മലയാള രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
