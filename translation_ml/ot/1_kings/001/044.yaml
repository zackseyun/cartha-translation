translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ആഖ്യാനശൈലി. പട്ടികയിലെ ആവർത്തിച്ച കർമപ്രത്യയങ്ങൾ വ്യക്തതയ്ക്കായി നിലനിർത്തി; അപൂർവ സംഘനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരം ചെയ്തു.
