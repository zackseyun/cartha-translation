id: 1KI.1.44
reference: 1 Kings 1:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אִתּֽ/וֹ הַ֠/מֶּלֶךְ אֶת צָד֨וֹק הַ/כֹּהֵ֜ן וְ/אֶת נָתָ֣ן הַ/נָּבִ֗יא וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וַ/יַּרְכִּ֣בוּ אֹת֔/וֹ עַ֖ל פִּרְדַּ֥ת הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: ml
  text: രാജാവ് സാദോക്ക് പുരോഹിതനെയും നാഥാൻ പ്രവാചകനെയും യെഹോയാദയുടെ മകൻ ബെനായാവിനെയും ക്രേത്യരെയും പ്ലേത്യരെയും അവനോടൊപ്പം അയച്ചു; അവർ അവനെ രാജാവിന്റെ കോവർകഴുതപ്പുറത്ത്[a] കയറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ കൃത്യമായി, ‘രാജാവിന്റെ പെൺകോവർകഴുതപ്പുറത്ത്.’ എബ്രായനാമം പെൺകോവർകഴുതയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: പ്രത്യയത്തോടുകൂടിയ പദം സഹഗമനത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായപാഠം ദാവീദ് എന്ന പേര് ഉപയോഗിക്കാതെ സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന രാജാവിനെ പദവിയാൽ സൂചിപ്പിക്കുന്നു.
- source_word: צָדוֹק הַכֹּהֵן
  choice: സാദോക്ക് പുരോഹിതൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരം ചെയ്യുകയും പദവി വിവർത്തനം ചെയ്യുകയും ചെയ്ത് സമാനാധികരണ ഘടന നിലനിർത്തുന്നു.
- source_word: נָתָן הַנָּבִיא
  choice: നാഥാൻ പ്രവാചകൻ
  rationale: വ്യക്തിനാമം ലിപ്യന്തരം ചെയ്യുകയും נביא എന്ന പദം ‘പ്രവാചകൻ’ എന്നു കൃത്യമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകൻ ബെനായാവ്
  rationale: എബ്രായ പിതൃനാമബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכְּרֵתִי
  choice: ക്രേത്യർ
  rationale: ഒരു ജനവിഭാഗത്തിന്റെയോ പ്രത്യേക സൈനികസംഘത്തിന്റെയോ പേരായതിനാൽ വ്യാഖ്യാനാത്മകമായ വിവർത്തനത്തിനു പകരം ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: הַפְּלֵתִי
  choice: പ്ലേത്യർ
  rationale: ക്രേത്യർ എന്ന സമാന്തര സംഘനാമത്തോടൊപ്പം പ്രത്യേക നാമസ്വഭാവം നിലനിർത്താൻ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּרְכִּבוּ
  choice: അവർ അവനെ ... കയറ്റി
  rationale: רכב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: രാജാവിന്റെ കോവർകഴുതപ്പുറത്ത്
  rationale: പദബന്ധത്തിന്റെ ഉടമസ്ഥതയും ‘മേൽ’ എന്ന സ്ഥാനബന്ധവും നിലനിർത്തുന്നു; פִּרְדָּהയുടെ അടിസ്ഥാന അർത്ഥം ‘കോവർകഴുത’ എന്നാണ്.
