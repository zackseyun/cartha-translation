source:
  edition: WLC
  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതനായ സാദോക്ക് കൂടാരത്തിൽനിന്ന്[a] എണ്ണക്കൊമ്പ് എടുത്ത് ശലോമോനെ അഭിഷേകം ചെയ്തു. തുടർന്ന് അവർ ആട്ടുകൊമ്പ്[b] ഊതി; ജനമെല്ലാം, “ശലോമോൻ രാജാവ് നീണാൾ വാഴട്ടെ!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തിരുനിവാസത്തിൽനിന്ന്”; എബ്രായത്തിൽ അക്ഷരാർഥമായി “കൂടാരത്തിൽനിന്ന്.”
    reason: alternative_reading
  - marker: b
    text: അഥവാ “കാഹളം”; എബ്രായത്തിലെ ശോഫാർ കൊമ്പുകൊണ്ടുള്ള ഒരു കാഹളമാണ്, സാധാരണയായി ആട്ടുകൊമ്പ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എടുത്ത്’ എന്നു നൽകി.
- source_word: צָדוֹק הַכֹּהֵן
  choice: പുരോഹിതനായ സാദോക്ക്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; הַכֹּהֵן എന്ന സ്ഥാനപ്പേര് സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകി.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: എണ്ണക്കൊമ്പ്
  rationale: קֶרֶן എന്നതിന്റെ മൂർത്തമായ ‘കൊമ്പ്’ എന്ന ചിത്രം നിലനിർത്തുന്നു; എണ്ണ സൂക്ഷിച്ചിരുന്ന കൊമ്പുകൊണ്ടുള്ള അഭിഷേകപാത്രമാണ് ഉദ്ദേശ്യം.
- source_word: מִן הָאֹהֶל
  choice: കൂടാരത്തിൽനിന്ന്
  rationale: אֹהֶל എന്ന സാധാരണ നാമത്തിന്റെ നേരായ അർഥം ‘കൂടാരം’ എന്നാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത സാങ്കേതികവിശദീകരണം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיִּמְשַׁח
  choice: അഭിഷേകം ചെയ്തു
  rationale: משׁח എന്നത് എണ്ണകൊണ്ടുള്ള ആചാരപരമായ അഭിഷേകത്തിനുള്ള പതിവുപദമാണ്; രാജപ്രതിഷ്ഠയുടെ ആശയവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: അവർ ആട്ടുകൊമ്പ് ഊതി
  rationale: שׁוֹפָר ഒരു കൊമ്പുകൊണ്ടുള്ള കാഹളമാണ്, സാധാരണയായി ആട്ടുകൊമ്പ്; വസ്തുവിന്റെ മൂർത്തമായ രൂപം വായനക്കാരന് വ്യക്തമാക്കുന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: כָּל הָעָם
  choice: ജനമെല്ലാം
  rationale: പൊതുവായ സമൂഹഘോഷണത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ് നീണാൾ വാഴട്ടെ!
  rationale: יְחִי എന്ന ആശംസാത്മക രൂപത്തിന്റെ രാജകീയ ഘോഷണഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘നീണാൾ വാഴട്ടെ’ എന്നു നൽകി.
theological_decisions:
- issue: രാജാഭിഷേകസന്ദർഭത്തിലെ הָאֹהֶל എന്ന പദത്തിന്റെ കൃത്യത
  choice: കൂടാരം
  alternative: തിരുനിവാസം / വിശുദ്ധകൂടാരം
  rationale: എബ്രായപാഠത്തിൽ നിർദ്ദിഷ്ട സാങ്കേതികനാമത്തിനു പകരം നിർദേശകപ്രത്യയത്തോടുകൂടിയ സാധാരണ ‘കൂടാരം’ എന്ന നാമമാണ്. അതിനാൽ ആരാധനാസംബന്ധമായ പശ്ചാത്തലം അംഗീകരിച്ചുകൊണ്ടുതന്നെ പ്രധാനപാഠം അതിനെ കൂടുതൽ നിർദ്ദിഷ്ടമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എണ്ണക്കൊമ്പ്’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ആചാരപരമായ മൂർത്തചിത്രം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർഥ പദങ്ങളോടു പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാളത്തിൽ [a] ‘കൂടാരം’ എന്നതിനും [b] ‘ആട്ടുകൊമ്പ്’ എന്നതിനും ചേർത്ത് ക്രമപ്പെടുത്തി.
