id: 1KI.1.30
reference: 1 Kings 1:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: ml
  text: ഞാൻ ഇസ്രായേലിന്റെ ദൈവമായ യഹോവയെക്കൊണ്ട് നിന്നോടു സത്യംചെയ്തു പറഞ്ഞതുപോലെ, ‘നിന്റെ മകനായ ശലോമോൻ എനിക്കുശേഷം രാജാവാകും; അവൻ എനിക്കുപകരം എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും,’ അങ്ങനെതന്നെ ഞാൻ ഇന്നു ചെയ്യും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: '...പോലെ ... അങ്ങനെതന്നെ'
  rationale: ആദ്യഭാഗത്തിലെ താരതമ്യവും അവസാനത്തെ כִּי כֵן എന്ന അനുബന്ധപ്രയോഗവും ചേർന്ന ‘എങ്ങനെ—അങ്ങനെ’ എന്ന പ്രതിജ്ഞാഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: നിന്നോടു സത്യംചെയ്തു
  rationale: മുമ്പ് നടത്തിയ പൂർത്തിയായ ശപഥത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: בַּיהוָה
  choice: യഹോവയെക്കൊണ്ട്
  rationale: ശപഥം ആരെ സാക്ഷിയാക്കി ചെയ്തുവെന്ന בְּ-യുടെ അർഥം പ്രകടമാക്കുകയും ദൈവനാമം ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹോവയെ തിരിച്ചറിയിക്കുന്ന ഹീബ്രു സംയുക്തപദം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: നിന്റെ മകനായ ശലോമോൻ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ ബന്ധവും പേരും വ്യക്തമായി നൽകുന്നു.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: എനിക്കുശേഷം രാജാവാകും
  rationale: מָלַךְ എന്നത് രാജാവായി ഭരിക്കുക എന്ന അർഥമുള്ളതും אַחֲרַי രാജകീയ പിൻഗാമിത്വം സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: അവൻ എനിക്കുപകരം എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും
  rationale: സിംഹാസനത്തിൽ ഇരിക്കുക എന്ന രാജാഭിഷേകപ്രയോഗവും תַּחְתָּיയുടെ പകരം/സ്ഥാനത്ത് എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: כִּי כֵן אֶעֱשֶׂה הַיּוֹם הַזֶּה
  choice: അങ്ങനെതന്നെ ഞാൻ ഇന്നു ചെയ്യും
  rationale: തുടക്കത്തിലെ ‘പോലെ’ എന്ന ഘടനയ്ക്ക് മറുപടിയായ ഉറച്ച നടപ്പാക്കൽപ്രഖ്യാപനവും അതിന്റെ തൽക്ഷണതയും നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള പ്രത്യേക ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: תַּחְתָּי എന്നതിലെ പിൻഗാമിത്വവും സ്ഥാനപകരവും
  choice: എനിക്കുപകരം
  alternative: എനിക്കുശേഷം
  rationale: മുൻവാക്യത്തിൽ ‘എനിക്കുശേഷം’ ഇതിനകം വന്നതിനാൽ ഇവിടെ സ്ഥാനമേറ്റെടുക്കൽ എന്ന വ്യത്യസ്ത സൂക്ഷ്മത നിലനിർത്തുന്നു; രാജാവിന്റെ സിംഹാസനം കൈക്കൊള്ളുന്നതാണ് സന്ദർഭം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഹീബ്രുവിലെ ‘പോലെ—അങ്ങനെതന്നെ’ ഘടനയും പ്രതിജ്ഞയുടെ ഔപചാരികഭാവവും നിലനിർത്തി; അനാവശ്യമായ പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
