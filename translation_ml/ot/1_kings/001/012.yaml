  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֕ה לְכִ֛י אִיעָצֵ֥/ךְ נָ֖א עֵצָ֑ה וּ/מַלְּטִי֙ אֶת נַפְשֵׁ֔/ךְ וְ/אֶת נֶ֥פֶשׁ בְּנֵ֖/ךְ שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: ml
  text: ഇപ്പോൾ, വരൂ[a]; ഞാൻ നിനക്കൊരു ഉപദേശം പറയട്ടെ[b]. നിന്റെ ജീവനും[c] നിന്റെ മകൻ ശലോമോന്റെ ജീവനും രക്ഷിക്കൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘പോകൂ’; ഇവിടെ നേരിട്ടുള്ള സംഭാഷണത്തിലെ അടിയന്തര ആഹ്വാനമായതിനാൽ ‘വരൂ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഞാൻ നിനക്കു ഉപദേശം ഉപദേശിക്കട്ടെ’; ഒരേ ധാതുവിലുള്ള ക്രിയയും നാമവും ചേർന്ന ഈ പ്രയോഗത്തിന് ‘നിനക്കൊരു ഉപദേശം പറയട്ടെ’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിലെ נֶפֶשׁ (നെഫെഷ്) ഇവിടെ ‘ആത്മാവ്’ എന്നല്ല, ‘ജീവൻ’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തിൽ അടിയന്തരമായ ഒരു വഴിത്തിരിവ് അവതരിപ്പിക്കുന്നു; ബന്ധകമായ וְ മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: לְכִי
  choice: വരൂ
  rationale: മൂലക്രിയയുടെ അക്ഷരാർഥം ‘പോകുക/നടക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ നേരിട്ടുള്ള സംഭാഷണത്തിലെ അടിയന്തര ആഹ്വാനമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘വരൂ’ സ്വാഭാവികമാണ്.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: ഞാൻ നിനക്കൊരു ഉപദേശം തരട്ടെ
  rationale: ക്രിയയും അതേ ധാതുവിലുള്ള നാമവും ചേർന്ന ‘ഉപദേശം ഉപദേശിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; נָא സൂചിപ്പിക്കുന്ന അഭ്യർഥനാഭാവം ‘തരട്ടെ’യിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: וּמַלְּטִי
  choice: രക്ഷിക്കൂ
  rationale: ഇവിടെ അപകടത്തിൽനിന്ന് ജീവൻ നിലനിർത്താൻ വേണ്ട നടപടി സ്വീകരിക്കുക എന്നതാണ് ആജ്ഞയുടെ സന്ദർഭോചിതമായ അർഥം.
- source_word: נַפְשֵׁךְ ... נֶפֶשׁ בְּנֵךְ
  choice: നിന്റെയും നിന്റെ മകൻ ശലോമോന്റെയും ജീവൻ
  rationale: נֶפֶשׁ ഇവിടെ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നല്ല, അപകടത്തിലായിരിക്കുന്ന ജീവൻ എന്ന അർഥത്തിലാണ്; സമാന്തരഘടന മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
