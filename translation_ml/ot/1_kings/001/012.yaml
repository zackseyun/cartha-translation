translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ബത്‌ശേബയോടുള്ള സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപത്തിന് മലയാളത്തിൽ ലിംഗവ്യത്യാസമില്ല; ‘വരൂ’, ‘രക്ഷിക്കൂ’ എന്നീ രൂപങ്ങൾ അടിയന്തരതയോടൊപ്പം മാന്യതയും നിലനിർത്തുന്നു.
