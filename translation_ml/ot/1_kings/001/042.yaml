source:
  edition: WLC
  text: עוֹדֶ֣/נּוּ מְדַבֵּ֔ר וְ/הִנֵּ֧ה יוֹנָתָ֛ן בֶּן אֶבְיָתָ֥ר הַ/כֹּהֵ֖ן בָּ֑א וַ/יֹּ֤אמֶר אֲדֹנִיָּ֨הוּ֙ בֹּ֔א כִּ֣י אִ֥ישׁ חַ֛יִל אַ֖תָּה וְ/ט֥וֹב תְּבַשֵּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: ml
  text: 'അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഇതാ, പുരോഹിതനായ അബ്യാഥാരിന്റെ മകൻ യോനാഥാൻ വന്നു. അദോനീയാവ് പറഞ്ഞു: “അകത്തേക്കു വരിക; നീ പ്രാപ്തനായ മനുഷ്യനല്ലോ, നല്ല വാർത്തയാണല്ലോ കൊണ്ടുവരുന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: അവൻ ഇനിയും സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന സംസാരത്തിനിടയിൽ അടുത്ത സംഭവം ഉണ്ടായെന്ന കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: പെട്ടെന്നുണ്ടാകുന്ന ശ്രദ്ധേയമായ സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: പുരോഹിതനായ അബ്യാഥാരിന്റെ മകൻ
  rationale: הַכֹּהֵן എന്ന വിശേഷണം അബ്യാഥാരിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സ്വാഭാവിക ഘടന വ്യക്തമായി നൽകുന്നു.
- source_word: בֹּא
  choice: അകത്തേക്കു വരിക
  rationale: സമ്മേളനസ്ഥലത്തേക്ക് പ്രവേശിക്കാനുള്ള ക്ഷണമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אִישׁ חַיִל
  choice: പ്രാപ്തനായ മനുഷ്യൻ
  rationale: חַיִל ഇവിടെ നിർബന്ധമായും യുദ്ധവീരതയല്ല; കഴിവ്, വിശ്വാസ്യത, മാന്യസ്ഥാനം എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗമാണ്. ‘പ്രാപ്തനായ’ എന്നത് സന്ദർഭത്തിലെ കഴിവും വിശ്വാസ്യതയും മുൻനിർത്തുമ്പോഴും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: നല്ല വാർത്തയുമായിട്ടായിരിക്കും വന്നിരിക്കുന്നത്
  rationale: വാർത്ത നല്ലതാണെന്ന അദോനീയാവിന്റെ പ്രതീക്ഷയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനെ മലയാളത്തിൽ സ്വാഭാവികമായ അനുമാനഭാവത്തോടെ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. וְהִנֵּה എന്നതിന്റെ സജീവത ‘ഇതാ’ എന്നു നിലനിർത്തി; അദോനീയാവിന്റെ പ്രതീക്ഷയെ ഉറപ്പായ വസ്തുതയായി മാറ്റാതെ അനുമാനഭാവത്തിൽ അവതരിപ്പിച്ചു.
