lexical_decisions:
- source_word: וְגַם
  choice: ഇരിക്കുകയും
  rationale: മുൻവിവരത്തോടു മറ്റൊരു കാര്യത്തെ കൂട്ടിച്ചേർക്കുന്ന ‘കൂടാതെ/also’ എന്ന അർഥം സ്വാഭാവികമായ മലയാള സംയോജനത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: יָשַׁב
  choice: ഇരിക്കുന്നു
  rationale: ക്രിയയുടെ സമാപ്തഫലവും ഇപ്പോഴത്തെ നിലയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ രൂപം; ശലോമോൻ സിംഹാസനം ഏറ്റെടുത്തുവെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: כִּסֵּא הַמְּלוּכָה
  choice: രാജസിംഹാസനം
  rationale: അക്ഷരാർഥത്തിലെ ‘രാജത്വത്തിന്റെ സിംഹാസനം’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
