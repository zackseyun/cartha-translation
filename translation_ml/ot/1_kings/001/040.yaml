  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ כָל הָ/עָם֙ אַֽחֲרָ֔י/ו וְ/הָ/עָם֙ מְחַלְּלִ֣ים בַּ/חֲלִלִ֔ים וּ/שְׂמֵחִ֖ים שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/תִּבָּקַ֥ע הָ/אָ֖רֶץ בְּ/קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: ml
  text: ജനമെല്ലാം അവന്റെ പിന്നാലെ കയറിച്ചെന്നു; ജനം കുഴലുകൾ[a] വായിക്കുകയും അത്യന്തം ആനന്ദത്തോടെ ആഹ്ലാദിക്കുകയും ചെയ്തു. അവരുടെ ശബ്ദത്താൽ ഭൂമി പിളർന്നുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കുഴൽവാദ്യങ്ങൾ’; എബ്രായപദം കുഴൽവർഗത്തിലുള്ള വിവിധ കാറ്റുവാദ്യങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ആഘോഷത്തിന്റെ അത്യുച്ചമായ ശബ്ദത്തെ വർണിക്കുന്ന അതിശയോക്തിയായിരിക്കാം ഈ പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന മൂർത്തമായ ചലനാർഥം ഘോഷയാത്രയുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָל הָעָם
  choice: ജനമെല്ലാം
  rationale: כָל ചേർന്ന സമൂഹവാചക നാമത്തിന്റെ സമഗ്രത ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחֲרָיו
  choice: അവന്റെ പിന്നാലെ
  rationale: ഘോഷയാത്രയിൽ അവനെ പിന്തുടർന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: കുഴലുകൾ വായിക്കുകയും
  rationale: ഇവിടെ חלל കാറ്റുവാദ്യം വായിക്കുന്നതിനെയും חלילים കുഴൽവർഗത്തിലുള്ള വാദ്യങ്ങളെയും സൂചിപ്പിക്കുന്നു; ‘കുഴലുകൾ വായിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: അത്യന്തം ആനന്ദത്തോടെ ആഹ്ലാദിക്കുകയും ചെയ്തു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർത്ത് ഊന്നൽ നൽകുന്ന എബ്രായഘടനയുടെ തീവ്രത, അസ്വാഭാവികമായ പദാവർത്തനം ഒഴിവാക്കി, ‘അത്യന്തം ആനന്ദത്തോടെ ആഹ്ലാദിച്ചു’ എന്നതിലൂടെ പകരുന്നു.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: ഭൂമി പിളർന്നുപോയി
  rationale: בקע എന്നതിന്റെ ശക്തമായ ‘പിളരുക’ എന്ന ദൃശ്യരൂപം മയപ്പെടുത്താതെ സജീവക്രിയയായി നിലനിർത്തുന്നു.
- source_word: בְּקוֹלָם
  choice: അവരുടെ ശബ്ദത്താൽ
  rationale: קוֹל ജനത്തിന്റെ സ്വരത്തെയും വാദ്യങ്ങളുടെ ശബ്ദത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ‘ശബ്ദം’ എന്ന വിശാലപദം തെരഞ്ഞെടുത്തു; בְ ഇവിടെ ശബ്ദവുമായി ബന്ധപ്പെട്ട കാരണം/മാധ്യമം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘ജനം’ എന്ന ആവർത്തനം ഭാഗികമായി നിലനിർത്തുകയും, ആഘോഷത്തിന്റെ തീവ്രതയും ‘ഭൂമി പിളർന്നു’ എന്ന ശക്തമായ ദൃശ്യരൂപവും മയപ്പെടുത്താതിരിക്കുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
