id: 1KI.1.36
reference: 1 Kings 1:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: ml
  text: 'യെഹോയാദയുടെ മകനായ ബെനായാവ് രാജാവിനോടു മറുപടി പറഞ്ഞു: “ആമേൻ! എന്റെ പ്രഭുവായ രാജാവിന്റെ ദൈവമായ യഹ്‌വെ അങ്ങനെ പറയട്ടെ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അങ്ങനെ പറയട്ടെ.” ഇവിടെ “പറയുക” എന്ന എബ്രായക്രിയയ്ക്ക് രാജാവിന്റെ ആഗ്രഹത്തെ സ്ഥിരീകരിക്കുകയോ നടപ്പാകാൻ വിധിക്കുകയോ ചെയ്യുന്ന അർഥസൂചന ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടി പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ഒരൊറ്റ വാക്യപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; മറുപടിയുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുകയും എബ്രായ പിതൃനാമഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אָמֵן
  choice: ആമേൻ!
  rationale: സമ്മതവും ആഗ്രഹവും പ്രകടിപ്പിക്കുന്ന പരിചിതമായ മതപരമായ ഉദ്‌ഘോഷമായി മൂലപദത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: כֵּן יֹאמַר
  choice: അങ്ങനെ അരുളിച്ചെയ്യട്ടെ
  rationale: ഇംപെർഫെക്ടിന്റെ ഈ സന്ദർഭത്തിലെ ആശംസാത്മക ഭാവം ‘-ട്ടെ’കൊണ്ട് വ്യക്തമാക്കുന്നു. ദൈവം വിഷയമായതിനാൽ ‘അരുളിച്ചെയ്യുക’ മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമാണ്; എന്നാൽ മൂലക്രിയയുടെ അക്ഷരാർഥം ‘പറയുക’ എന്നാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിന്റെ ദൈവം
  rationale: രാജസദസ്സിലെ ആദരസൂചകമായ ‘എന്റെ യജമാനൻ’ എന്ന ഭാവവും ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഹീബ്രു നാമത്തിന്റെ സാധാരണ പുനർനിർമിത ഉച്ചാരണത്തോട് ‘യഹ്‌വെ’ കൂടുതൽ അടുത്തതാണ്.
- issue: יֹאמַר എന്ന ക്രിയയുടെ ഭാവം
  choice: അരുളിച്ചെയ്യട്ടെ
  alternative: പറയും / പറയട്ടെ
  rationale: ‘ആമേൻ’ എന്ന ഉദ്‌ഘോഷത്തിനു പിന്നാലെയുള്ള സന്ദർഭം സാധാരണ ഭാവികാലത്തേക്കാൾ ആശംസയോ അഭ്യർഥനയോ സൂചിപ്പിക്കുന്നു. ദൈവം രാജാവിന്റെ ഉദ്ദേശ്യം സ്ഥിരീകരിക്കണമെന്ന ആശയം സൂചിപ്പിച്ചാലും, അത് വിശദീകരിച്ച് പാഠത്തിൽ ചേർക്കാതെ ‘പറയുക’ എന്ന മൂലരൂപത്തിലെ സംഘർഷം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. രാജസദസ്സിലെ ആദരഭാവത്തിന് ‘യജമാനൻ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനാത്മകമായ സംഭാഷണസൂത്രം മലയാളത്തിലെ സ്വാഭാവിക ‘മറുപടി പറഞ്ഞു’ എന്ന രൂപത്തിലാക്കി; ദൈവനാമം പദവിയാൽ പകരംവച്ചിട്ടില്ല.
