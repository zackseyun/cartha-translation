id: 1KI.1.14
reference: 1 Kings 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: ml
  text: “ഇതാ, നീ അവിടെ രാജാവിനോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, ഞാൻ നിന്റെ പിന്നാലെ അകത്തു വന്ന് നിന്റെ വാക്കുകൾ സ്ഥിരീകരിക്കും[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ വാക്കുകൾ പൂർത്തിയാക്കും” അല്ലെങ്കിൽ “നീ പറയുന്നതിന് കൂടുതൽ വിശദാംശങ്ങൾ ചേർക്കും.” മറ്റൊരാളുടെ പ്രസ്താവനയെ പിന്തുണയ്ക്കുന്ന വിവരങ്ങൾ ചേർത്ത് ഉറപ്പിക്കുക എന്ന അർത്ഥം ഈ ഹീബ്രു പ്രയോഗത്തിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്ന് നടപ്പാക്കാനിരിക്കുന്ന പദ്ധതിയിലേക്കും അതിന്റെ സമയത്തിലേക്കും ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: നീ ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: രണ്ടാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയത്തോടുകൂടിയ עוֹדָךְ-ഉം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപവും ചേർന്ന്, ബത്ത്-ശേബ സംസാരിച്ചുകൊണ്ടിരിക്കെതന്നെ നാഥാൻ പ്രവർത്തിക്കുമെന്ന സമയബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: അവിടെ രാജാവിനോടു
  rationale: שָׁם എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; עִם എന്നത് രാജാവുമായുള്ള സംഭാഷണത്തെ ഇവിടെ സ്വാഭാവികമായി ‘രാജാവിനോടു’ എന്നു നൽകുന്നു.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: ഞാൻ നിന്റെ പിന്നാലെ അകത്തു വന്ന്
  rationale: കൊട്ടാരസാഹചര്യത്തിൽ בוא രാജാവിന്റെ സന്നിധിയിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; אַחֲרַיִךְ പ്രവർത്തനക്രമം വ്യക്തമാക്കുന്നു.
- source_word: וּמִלֵּאתִי אֶת־דְּבָרָיִךְ
  choice: നിന്റെ വാക്കുകൾ സ്ഥിരീകരിക്കും
  rationale: മറ്റൊരാളുടെ പ്രസ്താവനയിൽ പിന്തുണയ്ക്കുന്ന വിവരങ്ങൾ ചേർത്ത് അതിനെ പൂർത്തിയാക്കുക അഥവാ ഉറപ്പിക്കുക എന്ന ഈ സന്ദർഭത്തിലെ ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രായോഗിക അർത്ഥം നൽകുന്നു; അടിസ്ഥാന രൂപകത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രാജസഭാ സന്ദർഭത്തിന് അനുയോജ്യമായ ഭാഷ. സ്ത്രീയെ അഭിസംബോധന ചെയ്യുന്നതു മലയാളത്തിൽ ലിംഗചിഹ്നമില്ലാത്ത ‘നീ’ വഴി സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു. ‘ഇതാ’ ശ്രദ്ധാകർഷക നിപാതത്തിന്റെ ഗൗരവവും തത്സമയഭാവവും നിലനിർത്തുന്നു.
