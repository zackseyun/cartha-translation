id: 1KI.1.32
reference: 1 Kings 1:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֣לֶךְ דָּוִ֗ד קִרְאוּ לִ֞/י לְ/צָד֤וֹק הַ/כֹּהֵן֙ וּ/לְ/נָתָ֣ן הַ/נָּבִ֔יא וְ/לִ/בְנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וַ/יָּבֹ֖אוּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് രാജാവ് പറഞ്ഞു: “പുരോഹിതനായ സാദോക്കിനെയും പ്രവാചകനായ നാഥാനെയും യെഹോയാദായുടെ മകനായ ബെനായാവിനെയും എന്റെ അടുക്കൽ വിളിക്കൂ.” അവർ രാജാവിന്റെ മുമ്പിൽ വന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത ബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: ദാവീദിനെ രാജപദവിയാൽ തിരിച്ചറിയുന്ന പ്രയോഗം; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു.
- source_word: קִרְאוּ לִי
  choice: എന്റെ അടുക്കൽ വിളിക്കൂ
  rationale: ബഹുവചന ആജ്ഞയും സംസാരിക്കുന്നവന്റെ സന്നിധിയിലേക്കു വരുത്തുക എന്ന לִי-യുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: പുരോഹിതനായ സാദോക്ക്
  rationale: വ്യക്തിനാമത്തോടൊപ്പം പദവി വ്യക്തമായി നൽകുന്നു; כֹּהֵן എന്നതിന് സന്ദർഭോചിതമായ ‘പുരോഹിതൻ’ ഉപയോഗിച്ചു.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: പ്രവാചകനായ നാഥാൻ
  rationale: വ്യക്തിനാമവും നിർദ്ദിഷ്ട പദവിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: בן എന്ന വംശപരമായ തിരിച്ചറിയൽ വ്യക്തമായി സംരക്ഷിക്കുകയും പേരുകൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: וַיָּבֹאוּ
  choice: അവർ ... വന്നു
  rationale: ബഹുവചന ക്രിയയും ആഖ്യാനത്തിലെ തുടർച്ചയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജസന്നിധിയിൽ
  rationale: രാജാവിന്റെ മുമ്പിൽ, അദ്ദേഹത്തിന്റെ സാന്നിധ്യത്തിൽ എന്ന അർഥം dignified, സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പരിചിതമായ ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചെങ്കിലും, വാക്യഘടന അനാവശ്യമായി പുരാതനമാക്കിയിട്ടില്ല. മൂലത്തിൽ യഥാർത്ഥമായ ആശയദ്വന്ദ്വമോ പാഠഭേദമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
