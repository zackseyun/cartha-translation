reference: 1 Kings 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אֲדֹנִ/י֙ אַתָּ֨ה נִשְׁבַּ֜עְתָּ בַּֽ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לַֽ/אֲמָתֶ֔/ךָ כִּֽי שְׁלֹמֹ֥ה בְנֵ֖/ךְ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: ml
  text: 'അവൾ അവനോടു പറഞ്ഞു: “എന്റെ യജമാനനേ, ‘അങ്ങയുടെ മകൻ ശലോമോൻ എനിക്കുശേഷം രാജാവാകും; അവൻ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും’ എന്ന് അങ്ങ് അങ്ങയുടെ ദൈവമായ യഹോവയുടെ നാമത്തിൽ അങ്ങയുടെ ദാസിയോടു സത്യം ചെയ്തുവല്ലോ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  rationale: രാജാവിനോടുള്ള ബഹുമാനപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַיהוָה
  choice: യഹോവയെക്കൊണ്ട്
  rationale: ദൈവനാമമായ יהוה ലിപ്യന്തരണം ചെയ്ത്, സത്യത്തിന്റെ ആധാരത്തെ സൂചിപ്പിക്കുന്ന בְ എന്ന ഉപസർഗത്തിന്റെ അർഥവും പ്രകടമാക്കുന്നു.
- source_word: לַאֲמָתֶךָ
  choice: അങ്ങയുടെ ദാസിയോടു
  rationale: אָמָה എന്ന സ്ത്രീലിംഗ പദത്തിന്റെ സ്വയംതാഴ്ത്തിയുള്ള രാജസഭാ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘അടിമസ്ത്രീ’ ഇവിടെ അനാവശ്യമായി കഠിനമായിരിക്കും.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഇവിടെ സത്യവാചകത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നതായി എടുത്തു; പ്രസ്താവനയുടെ ഉറപ്പ് മലയാളത്തിലെ ‘സത്യം ചെയ്തതാണല്ലോ’ എന്ന ഘടനയിൽ വ്യക്തമാണ്.
- source_word: יִמְלֹךְ
  choice: രാജാവാകും
  rationale: ശലോമോൻ ദാവീദിനുശേഷം രാജാധികാരം ഏറ്റെടുക്കുമെന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּסְאִי
  choice: എന്റെ സിംഹാസനം
  rationale: രാജകീയ അധികാരത്തിന്റെ ഇരിപ്പിടം എന്ന മൂലരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മറയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകുന്നു; ഇത് ഒരു പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: כִּי എന്ന പദത്തിന് ഉറപ്പുനൽകുന്ന പ്രത്യേക ക്രിയാവിശേഷണം ചേർക്കണമോ
  choice: പ്രത്യേകമായി ‘തീർച്ചയായും’ ചേർത്തില്ല
  alternative: ‘തീർച്ചയായും ശലോമോൻ...’
  rationale: כִּי ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന സത്യവാചകത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നതായിരിക്കാം. മൂലത്തിൽ സ്വതന്ത്രമായ ഉറപ്പുപദം ഇല്ലാത്തതിനാൽ അനിശ്ചിതമായ ഊന്നൽ അധികമായി ചേർക്കാതെ വാക്യഘടനയിലൂടെ ഉറപ്പ് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ രാജസഭാ ഭാഷ ഉപയോഗിച്ചു. ദാവീദിനോടുള്ള ബഹുമാനസൂചകമായി ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ബത്‌ശേബയുടെ സ്വയംവിശേഷണത്തിന് ‘ദാസി’ എന്നും തെരഞ്ഞെടുത്തു.
