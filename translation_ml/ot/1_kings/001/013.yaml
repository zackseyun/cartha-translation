  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: ml
  text: 'നീ ദാവീദ് രാജാവിന്റെ അടുക്കൽ ചെന്ന് അദ്ദേഹത്തോട് ഇങ്ങനെ പറയുക: “എന്റെ യജമാനനായ രാജാവേ, ‘എന്റെ പിന്നാലെ അങ്ങയുടെ മകൻ ശലോമോൻ രാജാവാകും; അവൻ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും’ എന്ന് അങ്ങ് അങ്ങയുടെ ദാസിയോട്[a] സത്യം ചെയ്തില്ലേ? പിന്നെ എന്തുകൊണ്ടാണ് അദോനിയാവ് രാജാവായത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിലെ പദം സ്ത്രീലിംഗമാണ്. രാജാവിന്റെ മുമ്പിൽ ബത്ത്-ശേബ തന്നെ വിനയത്തോടെ ‘അങ്ങയുടെ ദാസി’ എന്നു വിളിക്കുന്നതാണ് ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: അടുക്കൽ ചെന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചനത്തിലുള്ള തുടർച്ചയായ രണ്ട് ആജ്ഞകൾ ‘പോകുക, അകത്തു ചെല്ലുക’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പ്രവേശനം ‘അടുക്കൽ ചെന്ന്’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവിന്റെ അടുക്കൽ
  rationale: രാജപദവിയും പേരും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: അദ്ദേഹത്തോട് ഇങ്ങനെ പറയുക
  rationale: എബ്രായ തുടർക്രിയയുടെ ആജ്ഞാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഇങ്ങനെ’ തുടർന്ന് വരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ വ്യക്തമാക്കുന്നു.
- source_word: הֲלֹא
  choice: ചെയ്തില്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ നിഷേധചോദ്യത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: ദൈവനാമമല്ലാത്ത, രാജാവിനോടുള്ള ആദരപൂർവമായ കൊട്ടാരസംബോധനയാണ് ഇവിടെ; ‘യജമാനൻ’ ആ മനുഷ്യബഹുമാനപദവി വ്യക്തമാക്കുന്നു.
- source_word: נִשְׁבַּעְתָּ
  choice: സത്യം ചെയ്തില്ലേ
  rationale: സാധാരണ വാഗ്ദാനത്തേക്കാൾ ഗൗരവമുള്ള ശപഥത്തിന്റെ അർഥം ‘സത്യം ചെയ്യുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַאֲמָתְךָ
  choice: അങ്ങയുടെ ദാസിയോട്
  rationale: മൂലപദം സ്ത്രീലിംഗമാണ്; ബത്ത്-ശേബ രാജാവിന്റെ മുമ്പിൽ തന്നെ വിനയത്തോടെ ‘അങ്ങയുടെ ദാസി’ എന്നു വിശേഷിപ്പിക്കുന്നതു നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: നിന്റെ മകൻ ശലോമോൻ
  rationale: ബന്ധവും പേരും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: എന്റെ പിന്നാലെ ... രാജാവാകും
  rationale: ദാവീദിനു ശേഷമുള്ള രാജാവകാശപരമ്പരയും രാജത്വവും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: അവൻ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും
  rationale: രാജാഭിഷേകവും ഭരണാവകാശവും സൂചിപ്പിക്കുന്ന സിംഹാസനഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: പിന്നെ എന്തുകൊണ്ടാണ് അദോനിയാവ് രാജാവായത്?
  rationale: മുൻപറഞ്ഞ ശപഥത്തിൽനിന്ന് ഉയരുന്ന വൈരുധ്യം ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; മָלַךְ എന്ന ക്രിയയുടെ ‘രാജാവാകുക/ഭരിക്കുക’ എന്ന അർഥത്തിൽ സന്ദർഭോചിതമായി ‘രാജാവായത്’ തെരഞ്ഞെടുത്തു.
