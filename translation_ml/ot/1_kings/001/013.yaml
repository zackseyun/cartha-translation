  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആദരപൂർവമായ മലയാളം ഉപയോഗിച്ചു. രാജാവിനോടുള്ള സംഭാഷണത്തിൽ ‘അങ്ങ്’ എന്നും വിവരണത്തിൽ ‘അദ്ദേഹം’ എന്നും ഉപയോഗിച്ച് കൊട്ടാരമര്യാദ നിലനിർത്തി; ശപഥവും സിംഹാസനാവകാശവും സംബന്ധിച്ച ഔപചാരികത സംരക്ഷിച്ചു.
