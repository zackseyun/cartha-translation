  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: ml
  text: ഹഗ്ഗീത്തിന്റെ മകനായ അദോനീയാവ്, “ഞാൻ രാജാവാകും” എന്നു പറഞ്ഞ് സ്വയം ഉയർത്തി[a]. അവൻ തനിക്കായി ഒരു രഥവും കുതിരപ്പടയാളികളെയും തന്റെ മുമ്പിൽ ഓടുന്ന അമ്പത് പുരുഷന്മാരെയും ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വയം മഹാനാക്കിക്കൊണ്ടിരുന്നു,” അല്ലെങ്കിൽ “സ്വയം ഉയർന്ന സ്ഥാനത്ത് പ്രതിഷ്ഠിച്ചു.” എബ്രായ ക്രിയ സ്വയം ഉയർത്തുന്നതോ മഹത്താക്കുന്നതോ ആയ ഭാവം വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: സ്വയം ഉയർത്തി
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ആത്മനിർദ്ദേശക അർഥവും സ്വയം മഹത്താക്കുകയോ ഉയർന്ന സ്ഥാനം അവകാശപ്പെടുകയോ ചെയ്യുന്ന നിഷേധാത്മക സൂചനയും നിലനിർത്തുന്നു.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: “ഞാൻ രാജാവാകും” എന്നു പറഞ്ഞ്
  rationale: אֶמְלֹךְ എന്ന ക്രിയയുടെ രാജത്വാവകാശവാദം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ഞാൻ ഭരിക്കും’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: וַיַּעַשׂ לוֹ
  choice: അവൻ തനിക്കായി ... ഒരുക്കി
  rationale: עשה എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘ഉണ്ടാക്കി/ചെയ്തു’ എന്നാണെങ്കിലും, രഥവും രാജകീയ പരിവാരവും സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ‘ഒരുക്കി’ എന്നത് സ്വാഭാവികവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: רֶכֶב
  choice: ഒരു രഥം
  rationale: ഏകവചനവും രാജകീയ വാഹനമെന്ന സന്ദർഭാർഥവും സൂക്ഷിക്കുന്നു.
- source_word: פָרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തുള്ള അനുചരന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദം.
- source_word: חֲמִשִּׁים אִישׁ
  choice: അമ്പത് പുരുഷന്മാർ
  rationale: אִישׁ എന്ന വ്യക്തമായ പുല്ലിംഗ സൂചന നിലനിർത്തുന്നു.
- source_word: רָצִים לְפָנָיו
  choice: തന്റെ മുമ്പിൽ ഓടാൻ
  rationale: രാജകീയ ഘോഷയാത്രയിൽ അവന്റെ മുമ്പിൽ ഓടുന്നവരെന്ന അവരുടെ ചുമതല സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അദോനീയാവിന്റെ പ്രവൃത്തിയുടെ ചിത്രീകരണം
  choice: ‘സ്വയം ഉയർത്തി’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘സ്വയം രാജാവായി സ്ഥാപിച്ചു’ / ‘സ്വയം മഹാനാക്കി’
  rationale: മൂലപാഠത്തിലെ ആത്മപ്രശംസയുടെയും അനധികൃത അഭിലാഷത്തിന്റെയും സൂചന നിലനിർത്തുന്നു; എന്നാൽ ‘രാജാവായി സ്ഥാപിച്ചു’ എന്ന് ചേർത്ത് അർഥം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: രാജകീയ പരിവാരത്തിലെ ലിംഗസൂചന
  choice: ‘അമ്പത് പുരുഷന്മാർ’ എന്ന് നിലനിർത്തി
  alternative: ‘അമ്പത് പേർ’ / ‘അമ്പത് ഓട്ടക്കാർ’
  rationale: എബ്രായത്തിലെ אִישׁ ഇവിടെ പുരുഷ അനുചരന്മാരെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യാരംഭത്തിലെ וַ എന്നതിന് പ്രത്യേക കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. ഇംഗ്ലീഷ് consultation layer-ലെ [b] അടിക്കുറിപ്പ് തെറ്റായ സ്ഥാനത്താണ് പ്രത്യക്ഷപ്പെടുന്നത്; അതിലെ ഉള്ളടക്കം ‘I will be king’ എന്നതിന് പകരവായനയായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അനാവശ്യമായ marker ചേർത്തിട്ടില്ല.
