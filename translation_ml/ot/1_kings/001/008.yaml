  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: ml
  text: എന്നാൽ സാദോക്ക് പുരോഹിതൻ, യെഹോയാദയുടെ മകനായ ബെനായാവ്, നാഥാൻ പ്രവാചകൻ, ശിമെയി, രേയി, ദാവീദിന്റെ വീരന്മാർ[a] എന്നിവർ അദോനീയാവിനോടൊപ്പം ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിനുള്ള വീരന്മാർ.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ദാവീദിനുള്ളവരായിരുന്ന വീരന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ/כֹּהֵן
  choice: എന്നാൽ സാദോക്ക് പുരോഹിതൻ
  rationale: മുൻവാക്യത്തിലെ അദോനീയാവിനെ പിന്തുണച്ചവരുടെ പട്ടികയോടുള്ള വൈരുധ്യം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ וְ എന്ന ബന്ധകത്തെ സ്വാഭാവികമായി ‘എന്നാൽ’ എന്നു നൽകി; כֹּהֵן എന്ന പദവി ‘പുരോഹിതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവ്
  rationale: ഹീബ്രു പിതൃനാമബന്ധം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നിലനിർത്തി.
- source_word: וְ/נָתָן הַ/נָּבִיא
  choice: നാഥാൻ പ്രവാചകൻ
  rationale: നָבִיא എന്ന പദവിക്ക് സാധാരണവും കൃത്യവുമായ ‘പ്രവാചകൻ’ ഉപയോഗിച്ചു.
- source_word: וְ/שִׁמְעִי וְ/רֵעִי
  choice: ശിമെയി, രേയി
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; പട്ടിക സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: וְ/הַ/גִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  choice: ദാവീദിനോടു ചേർന്നിരുന്ന വീരന്മാർ
  rationale: גִּבּוֹרִים എന്നത് ‘വീരന്മാർ’ എന്നും אֲשֶׁר לְדָוִד എന്ന ബന്ധസൂചന ‘ദാവീദിനോടു ചേർന്നിരുന്ന’ എന്നും നൽകി; ഇത് ഉടമസ്ഥതയെയോ സേവനബന്ധത്തെയോ അതിയായി നിർവചിക്കാതെ മൂലത്തിലെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  choice: അദോനീയാവിനോടുകൂടെ ഉണ്ടായിരുന്നില്ല
  rationale: രാഷ്ട്രീയമായി പക്ഷംചേർന്നില്ല എന്ന സന്ദർഭാർഥം ഉണ്ടെങ്കിലും, മൂലത്തിലെ ലളിതമായ ‘കൂടെ ഉണ്ടായിരുന്നില്ല’ എന്ന പ്രയോഗത്തിന്റെ സംയമനം നിലനിർത്തി.
