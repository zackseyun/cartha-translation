translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജസഭാ ഔപചാരികത സൂചിപ്പിക്കാൻ ‘സന്നിധിയിൽ’ ഉപയോഗിച്ചു; എന്നാൽ മൂലപാഠത്തിലെ ആവർത്തനം വ്യക്തമാക്കാൻ രണ്ടാം ഘട്ടത്തിൽ ‘രാജാവിന്റെ മുമ്പിൽ’ നിലനിർത്തി.
