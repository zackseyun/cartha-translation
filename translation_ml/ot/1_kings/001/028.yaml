source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/מֶּ֤לֶךְ דָּוִד֙ וַ/יֹּ֔אמֶר קִרְאוּ לִ֖/י לְ/בַת שָׁ֑בַע וַ/תָּבֹא֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַֽ/תַּעֲמֹ֖ד לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: ml
  text: 'അപ്പോൾ ദാവീദ് രാജാവ് മറുപടി പറഞ്ഞു[a]: “ബത്ത്-ശേബയെ എന്റെ അടുക്കൽ വിളിക്കൂ.” അവൾ രാജാവിന്റെ സന്നിധിയിൽ വന്ന് രാജാവിന്റെ മുമ്പിൽ നിന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രതികരിച്ചു.” തൊട്ടുമുമ്പ് ഒരു ചോദ്യം ഇല്ലെങ്കിലും, എബ്രായ ആഖ്യാനത്തിൽ സംസാരത്തിന് ആമുഖമായി “മറുപടി പറഞ്ഞു” എന്ന പ്രയോഗം പതിവായി വരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: മറുപടി പറഞ്ഞു
  rationale: ענה എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘മറുപടി പറയുക’ നിലനിർത്തുന്നു; തൊട്ടുമുമ്പ് നേരിട്ടൊരു ചോദ്യം ഇല്ലെങ്കിലും ഇത് എബ്രായ ആഖ്യാനത്തിലെ പതിവ് സംസാര-ആമുഖമാണ്.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: പദവിയും പേരും ചേർന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: אמר എന്ന സാധാരണ സംസാരക്രിയയുടെ നേരിട്ടുള്ള മലയാളരൂപം; וַיַּעַן-നോടൊപ്പം ചേർന്ന് ‘മറുപടി പറഞ്ഞു’ എന്ന സ്വാഭാവിക പ്രയോഗമാകുന്നു.
- source_word: קִרְאוּ לִי
  choice: എന്റെ അടുക്കൽ വിളിക്കൂ
  rationale: കרא + ל എന്ന ഘടനയിലെ വിളിച്ചുവരുത്തൽ എന്ന ആശയം രാജകൽപ്പനയുടെ നേരിട്ടുള്ള ഭാവത്തോടെ നിലനിർത്തുന്നു.
- source_word: לְבַת שָׁבַע
  choice: ബത്ത്-ശേബയെ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഘടകങ്ങളും ഉച്ചാരണവും തിരിച്ചറിയാവുന്ന വിധത്തിലുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: അവൾ രാജാവിന്റെ സന്നിധിയിൽ വന്നു
  rationale: בוא + לפני എന്നത് രാജാവിന്റെ സാന്നിധ്യത്തിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സന്നിധിയിൽ’ ഔപചാരിക രാജസഭാ പശ്ചാത്തലത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ നിന്നു
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘നിൽക്കുക’ സംരക്ഷിക്കുകയും, മൂലത്തിലെ ‘രാജാവിന്റെ മുമ്പിൽ’ എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
