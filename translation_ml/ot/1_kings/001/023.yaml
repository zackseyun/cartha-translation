  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: ml
  text: 'അപ്പോൾ അവർ രാജാവിനെ അറിയിച്ചു: “ഇതാ, നാഥാൻ പ്രവാചകൻ.” നാഥാൻ രാജസന്നിധിയിൽ വന്ന്, മുഖം നിലത്തേക്കു കുനിച്ച് രാജാവിനെ വണങ്ങി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ആഗമനം അറിയിക്കുന്ന ശ്രദ്ധാകർഷക പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ
  choice: വണങ്ങി
  rationale: രാജാവിനോടുള്ള ദേഹപ്രണാമത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും മതപരമായി അനാവശ്യ അർഥം ചുമത്താത്തതുമായ പദം.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: നിലംവരെ മുഖം കുനിച്ച്
  rationale: മുഖം നിലത്തേക്കാക്കി നടത്തിയ ആഴമായ പ്രണാമത്തിന്റെ ശാരീരിക ഭാവം വ്യക്തമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ആവർത്തിച്ചുള്ള ‘രാജാവ്’ എന്ന പ്രയോഗം അമിതമാകാതിരിക്കാൻ לִפְנֵי הַמֶּלֶךְ എന്നത് ‘രാജസന്നിധിയിൽ’ എന്നു നൽകി; എന്നാൽ അവസാനത്തെ രാജാവിനോടുള്ള പ്രണാമം വ്യക്തമായി നിലനിർത്തി.
