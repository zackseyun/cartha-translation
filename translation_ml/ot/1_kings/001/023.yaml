- from: 'അപ്പോൾ അവർ രാജാവിനെ അറിയിച്ചു: “ഇതാ, നാഥാൻ പ്രവാചകൻ വന്നിരിക്കുന്നു.” നാഥാൻ രാജസന്നിധിയിൽ വന്ന്, നിലംവരെ മുഖം കുനിച്ച് രാജാവിനെ വണങ്ങി.'
  to: 'അപ്പോൾ അവർ രാജാവിനെ അറിയിച്ചു: “ഇതാ, നാഥാൻ പ്രവാചകൻ.” നാഥാൻ രാജസന്നിധിയിൽ വന്ന്, മുഖം നിലത്തേക്കു കുനിച്ച് രാജാവിനെ വണങ്ങി.'
