translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആശയവ്യക്തതയ്ക്കായി സമൂഹനാമങ്ങൾ വ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരം ചെയ്തിരിക്കുന്നു; വാക്യത്തിലെ തുടർച്ചയായ പ്രവർത്തനങ്ങൾ ചുരുക്കവും ഒഴുക്കുമുള്ള രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
