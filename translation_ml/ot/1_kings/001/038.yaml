  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: ml
  text: അങ്ങനെ പുരോഹിതനായ സാദോക്കും പ്രവാചകനായ നാഥാനും യെഹോയാദയുടെ മകനായ ബെനായാവും കെരേത്യരും പെലേത്യരും ഇറങ്ങിച്ചെന്ന് ശലോമോനെ ദാവീദ് രാജാവിന്റെ കോവർകഴുതപ്പുറത്ത്[a] കയറ്റി ഗീഹോനിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കോവർകഴുത’ എന്നതിനുള്ള ഹീബ്രായ നാമം വ്യാകരണപരമായി സ്ത്രീലിംഗത്തിലാണ്; അത് ഒരു പെൺ കോവർകഴുതയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ירד എന്ന ക്രിയയുടെ താഴോട്ടുള്ള ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: כהן എന്ന പദത്തിന്റെ മാനക മലയാള പരിഭാഷ; സാദോക്കിന്റെ സ്ഥാനപ്പേര് സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: הַנָּבִיא
  choice: പ്രവാചകനായ
  rationale: נביא എന്ന പദത്തിന്റെ മാനക പരിഭാഷയും നാഥാന്റെ സ്ഥാനപ്പേരും നിലനിർത്തുന്നു.
- source_word: בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ
  rationale: ഹീബ്രായ പിതൃനാമബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: കെരേത്യരും പെലേത്യരും
  rationale: കൃത്യമായ വംശീയമോ ഔദ്യോഗികമോ ആയ അർത്ഥം തർക്കവിധേയമായതിനാൽ, ‘രാജകാവൽക്കാർ’ എന്ന് വ്യാഖ്യാനിക്കാതെ ഹീബ്രായത്തിലെ സമൂഹനാമങ്ങൾ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַיַּרְכִּבוּ
  choice: കയറ്റി
  rationale: רכב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘സവാരി ചെയ്യിച്ചു/മേൽ കയറ്റി’ എന്ന കാരകാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: פִּרְדַּת
  choice: കോവർകഴുത
  rationale: ഈ നാമം വ്യാകരണപരമായി സ്ത്രീലിംഗവും പെൺ കോവർകഴുതയെ സൂചിപ്പിക്കാവുന്നതുമാണ്; മുഖ്യവാചകത്തിൽ മലയാളത്തിലെ സാധാരണ പൊതുപദം ഉപയോഗിച്ച് സൂക്ഷ്മത അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവിന്റെ
  rationale: ‘ദാവീദ് രാജാവിന്റെ കോവർകഴുത’ എന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: കൊണ്ടുപോയി
  rationale: הלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘പോകാൻ ഇടയാക്കുക/നയിക്കുക’ എന്ന ആശയം ഇവിടെ സവാരിയിലുള്ള ശലോമോനെ ലക്ഷ്യസ്ഥാനത്തേക്ക് കൊണ്ടുപോയതായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל גִּחוֹן
  choice: ഗീഹോനിലേക്കു
  rationale: ചലനസന്ദർഭത്തിൽ עַל ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-ലേക്ക്’ എന്നത് സ്വാഭാവികമാണ്.
