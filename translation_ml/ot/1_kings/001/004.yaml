id: 1KI.1.4
reference: 1 Kings 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: ml
  text: ആ യുവതി അതിസുന്ദരിയായിരുന്നു. അവൾ രാജാവിന്റെ പരിചാരികയായി അവനെ ശുശ്രൂഷിച്ചു; എന്നാൽ രാജാവ് അവളെ അറിഞ്ഞില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടില്ല.’ ഇവിടെ ‘അറിയുക’ എന്ന എബ്രായ പ്രയോഗം ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഒരു പരോക്ഷപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ആ യുവതി
  rationale: נַעֲרָה ഒരു യുവതിയെ സൂചിപ്പിക്കുന്നു. ‘യുവതി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പ്രായം അനാവശ്യമായി കുറച്ചുകാണിക്കാത്തതുമാണ്.
- source_word: יָפָה עַד מְאֹד
  choice: അതിസുന്ദരിയായിരുന്നു
  rationale: עַד מְאֹד നൽകുന്ന ശക്തമായ തീവ്രത സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: סֹכֶנֶת
  choice: പരിചാരിക
  rationale: രാജാവിനോടു ചേർന്ന് അദ്ദേഹത്തെ പരിചരിക്കുകയും സേവിക്കുകയും ചെയ്യുന്ന ചുമതലയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘പരിചാരിക’ വൈദ്യപരമായ ശുശ്രൂഷയോ പ്രണയബന്ധമോ അനാവശ്യമായി നിർദേശിക്കുന്നില്ല.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: അവനെ ശുശ്രൂഷിച്ചു
  rationale: שרת എന്നതിന്റെ സേവിക്കുക, പരിചരിക്കുക എന്ന ആശയം രാജാവിന്റെ വാർധക്യസന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: יְדָעָהּ
  choice: അവളെ അറിഞ്ഞില്ല
  rationale: ידע എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശാബ്ദിക രൂപവും ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന യൂഫെമിസവും മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഉദ്ദേശിച്ച അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കഥനത്തിലെ ലൈംഗിക യൂഫെമിസം
  choice: ‘അവളെ അറിഞ്ഞില്ല’ എന്ന മൂലഭാഷയിലെ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ ലൈംഗിക അർഥം വ്യക്തമാക്കുന്നു.
  alternative: ‘അവളുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെട്ടില്ല’ എന്ന് മുഖ്യവാചകത്തിൽ നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: ഇത് എബ്രായ വാചകത്തിന്റെ സാഹിത്യരീതിയും യഥാർഥ ദ്വയാർഥസാധ്യതയും സംരക്ഷിക്കുമ്പോൾ, ദാവീദും അബീശഗും തമ്മിൽ ലൈംഗികബന്ധം ഉണ്ടായില്ലെന്ന കഥാപരമായ പ്രസക്തി വായനക്കാരനു വ്യക്തമായി ലഭ്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പരിചാരിക’യും ‘ശുശ്രൂഷിച്ചു’വും രാജസദസ്സിലെ സേവനസന്ദർഭത്തിന് യോജിക്കുന്നു. മൂലഭാഷയിലെ യൂഫെമിസം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് അടിക്കുറിപ്പിലൂടെ അർഥം തുറന്നുകാട്ടിയിരിക്കുന്നു.
