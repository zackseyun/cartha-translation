  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ രാജാവ് ആളയച്ചു; അവർ അദോനീയാവിനെ യാഗപീഠത്തിൽനിന്ന് ഇറക്കിക്കൊണ്ടുവന്നു.[a] അവൻ വന്ന് ശലോമോൻ രാജാവിന്റെ മുമ്പിൽ കുമ്പിട്ടു. ശലോമോൻ അവനോട്, “നിന്റെ വീട്ടിലേക്കു പോകുക,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഗപീഠത്തിന്മേൽനിന്ന് അവനെ താഴെയിറക്കിക്കൊണ്ടുവന്നു.” എബ്രായപാഠം കൂടുതൽ അക്ഷരാർഥത്തിൽ, “യാഗപീഠത്തിന്മേൽനിന്ന് അവനെ താഴേക്കു വരുത്തി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയ്ക്ക് ഇവിടെ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും, പിന്നാലെ പേരില്ലാത്ത ദൂതന്മാർ അദോനീയാവിനെ ഇറക്കിക്കൊണ്ടുവരുന്നതായി വരുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ ‘ആളയച്ചു’ എന്നു നൽകി.
- source_word: וַיֹּרִדֻהוּ
  choice: അവർ അദോനീയാവിനെ ... ഇറക്കിക്കൊണ്ടുവന്നു
  rationale: ירד എന്നതിന്റെ കാരണാർത്ഥരൂപം, പേരുപറയാത്ത ബഹുവചന കർത്താക്കൾ അവനെ താഴേക്കിറക്കി കൊണ്ടുവന്നുവെന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ സന്ദർഭത്തിലെ പേര് ചേർത്തു.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികിൽനിന്ന്
  rationale: מֵעַל അക്ഷരാർഥത്തിൽ ‘മുകളിൽനിന്ന്/മേൽനിന്ന്’ എന്നാകാമെങ്കിലും, മുൻസന്ദർഭത്തിൽ അദോനീയാവ് യാഗപീഠത്തിന്റെ കൊമ്പുകൾ പിടിച്ചുനിൽക്കുന്നതിനാൽ ‘അരികിൽനിന്ന്’ സ്ഥലബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיָּבֹא
  choice: അവൻ വന്ന്
  rationale: בוא എന്ന സാധാരണ ഗതിക്രിയയെ കഥയുടെ തുടർച്ചയ്ക്കൊത്ത സ്വാഭാവിക മലയാള സംയോജക രൂപത്തിൽ നൽകി.
- source_word: וַיִּשְׁתַּחוּ
  choice: കുമ്പിട്ടു
  rationale: שׁחה സൂചിപ്പിക്കുന്ന വണങ്ങൽ/സാഷ്ടാംഗപ്രണാമത്തിന്റെ കൃത്യമായ ശരീരഭാവം നിർണയിക്കാതെ, രാജാവിനോടുള്ള ആദരപ്രകടനത്തെ സാധാരണവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: നിന്റെ വീട്ടിലേക്കു പോകുക
  rationale: ആജ്ഞയും ലക്ഷ്യസ്ഥാനവും നേരിട്ട് നിലനിർത്തുന്നു; ‘വീട്ടിലേക്കു പൊയ്ക്കൊൾക’ എന്നതിനെക്കാൾ നിഷ്പക്ഷവും രാജകീയ വിടവാങ്ങലിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘യാഗപീഠം’, ‘കുമ്പിട്ടു’ തുടങ്ങിയ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ തുടർച്ചയായ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി വിഭജിച്ചു.
