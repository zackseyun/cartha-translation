  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: ml
  text: 'ശലോമോൻ പറഞ്ഞു: “അവൻ യോഗ്യനാണെന്ന് തെളിഞ്ഞാൽ[a], അവന്റെ ഒരു രോമംപോലും നിലത്തു വീഴുകയില്ല[b]; എന്നാൽ അവനിൽ തിന്മ കണ്ടെത്തിയാൽ, അവൻ മരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദാനുപദമായി, ‘ശക്തിയുടെ/വീരത്തിന്റെ മകൻ.’ സന്ദർഭമനുസരിച്ച് ഈ എബ്രായ ശൈലിക്ക് യോഗ്യനും കഴിവുള്ളവനും ധീരനുമായ മനുഷ്യൻ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, ‘അവന്റെ ഒരു രോമംപോലും നിലത്തു വീഴുകയില്ല’; അവന് യാതൊരു അപായവും സംഭവിക്കുകയില്ല എന്നർഥമുള്ള ശൈലി.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: യോഗ്യനായവൻ
  rationale: പദാനുപദമായി ‘ശക്തിയുടെ/വീര്യത്തിന്റെ മകൻ’ എന്നാണെങ്കിലും, ഇവിടെ സൈനികവീര്യത്തേക്കാൾ ആദോനീയാവിന്റെ സ്വഭാവവും വിശ്വാസ്യതയും വിലയിരുത്തുന്ന പ്രയോഗമാണ്. ‘യോഗ്യനായവൻ’ എന്നത് സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്.
- source_word: יִהְיֶה
  choice: ആണെന്നു തെളിഞ്ഞാൽ
  rationale: രൂപപരമായി ‘ആയിരിക്കും/ആകും’ എന്നാണെങ്കിലും, തുടർന്നുള്ള പെരുമാറ്റത്തിലൂടെ അവന്റെ സ്വഭാവം വെളിപ്പെടുന്നതാണ് നിബന്ധനയുടെ പ്രായോഗിക അർഥം. അതിനാൽ ‘തെളിഞ്ഞാൽ’ എന്നു നൽകി.
- source_word: מִשַּׂעֲרָתוֹ
  choice: അവന്റെ ഒരു രോമംപോലും
  rationale: എബ്രായത്തിലെ ഏകവചന സമാഹാരനാമമായ ‘അവന്റെ രോമം’ മലയാളത്തിൽ ഈ സംരക്ഷണപ്രയോഗത്തിന് സ്വാഭാവികമായി ‘ഒരു രോമംപോലും’ എന്നു വരുന്നു.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: നിലത്തു വീഴുകയില്ല
  rationale: പൂർണമായി അപായത്തിൽനിന്നു കാക്കപ്പെടും എന്നർഥമുള്ള എബ്രായ ശൈലിയെ അതിന്റെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: רָעָה
  choice: തിന്മ
  rationale: നീതിന്യായപരമായ ഈ സന്ദർഭത്തിൽ ധാർമിക ദോഷത്തെയോ കുറ്റകരമായ പ്രവൃത്തിയെയോ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണ്; ഒരു പ്രത്യേക കുറ്റമായി ചുരുക്കാതെ ‘തിന്മ’ എന്നു നിലനിർത്തി.
- source_word: תִמָּצֵא בוֹ
  choice: അവനിൽ ... കണ്ടെത്തിയാൽ
  rationale: തിന്മ അവനിൽ ഉള്ളതായി കണ്ടെത്തപ്പെടുന്നു എന്ന എബ്രായ ഘടനയും വ്യക്തിയുടെ കുറ്റബാധ്യതയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: וָמֵת
  choice: അവൻ മരിക്കും
  rationale: തിന്മ കണ്ടെത്തപ്പെടുന്നതിന്റെ ഗൗരവമുള്ള പരിണതഫലമാണ് വാക്യം പ്രസ്താവിക്കുന്നത്. ഇത് പ്രവചനമാണോ വിധിപ്രഖ്യാപനമാണോ എന്നു അനാവശ്യമായി നിർണയിക്കാതെ ലളിതമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നീതിന്യായഭാവം നിലനിർത്തി. മൂലത്തിലെ നിബന്ധനാഘടനയും ‘രോമം നിലത്തു വീഴുക’ എന്ന ദൃശ്യശൈലിയും സംരക്ഷിച്ചു; അവയുടെ അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
