id: 1KI.1.9
reference: 1 Kings 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: ml
  text: അദോനിയാവ് ഏൻ-രോഗേലിന് സമീപമുള്ള സോഹേലെത്ത് കല്ലിനരികെ ആടുകളെയും കന്നുകാലികളെയും കൊഴുപ്പിച്ച മൃഗങ്ങളെയും ബലിയർപ്പിച്ചു. രാജാവിന്റെ പുത്രന്മാരായ തന്റെ എല്ലാ സഹോദരന്മാരെയും രാജാവിന്റെ സേവകരായ യെഹൂദയിലെ എല്ലാ പുരുഷന്മാരെയും അവൻ ക്ഷണിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാജാവിന്റെ സേവകർ” എന്നത് രാജപരിചാരകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: ബലിയർപ്പിച്ചു
  rationale: זבח ഇവിടെ ബലിവിരുന്നിനായുള്ള ആചാരപരമായ മൃഗവധത്തെ സൂചിപ്പിക്കുന്നു; വെറും അറുക്കൽ എന്നതിലുപരി അതിന്റെ ആരാധനാപരവും രാഷ്ട്രീയവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: צֹאן וּבָקָר וּמְרִיא
  choice: ആടുമാടുകളെയും കൊഴുപ്പിച്ച മൃഗങ്ങളെയും
  rationale: צֹאן, בָקָר എന്നിവയെ മലയാളത്തിലെ സ്വാഭാവികമായ കൂട്ടുപദമായ ‘ആടുമാടുകൾ’കൊണ്ട് അവതരിപ്പിക്കുന്നു; מְרִיא പ്രത്യേകമായി കിടാക്കളെന്നല്ല, വിരുന്നിനായി കൊഴുപ്പിച്ച കന്നുകാലികളെയോ മൃഗങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ വിശാലമായ പദം ഉപയോഗിച്ചു.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: സോഹേലെത്ത് കല്ലിനരികെ
  rationale: עִם ഇവിടെ സ്ഥാനസൂചകമായി പ്രവർത്തിക്കുന്നു. זֹחֶלֶת എന്ന സ്ഥലനാമത്തിന്റെ അർഥം അനിശ്ചിതമായതിനാൽ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: עֵין רֹגֵל
  choice: ഏൻ-രോഗേൽ
  rationale: തിരിച്ചറിയപ്പെട്ട സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיִּקְרָא
  choice: ക്ഷണിച്ചു
  rationale: ബലിവിരുന്നിന്റെ പശ്ചാത്തലത്തിൽ ‘വിളിച്ചു’ എന്നതിനെക്കാൾ സമ്മേളനത്തിൽ പങ്കെടുക്കാൻ ക്ഷണിച്ചു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ പുത്രന്മാരായ തന്റെ എല്ലാ സഹോദരന്മാരെയും
  rationale: ‘രാജാവിന്റെ പുത്രന്മാർ’ എന്ന സമാനാധികരണ പ്രയോഗം ഏതു സഹോദരന്മാരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי יְהוּדָה עַבְדֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ സേവകരായ യെഹൂദാപുരുഷന്മാരെയെല്ലാം
  rationale: രണ്ടാമത്തെ സമാനാധികരണ ഘടന പ്രകാരം ഇവർ യെഹൂദയിൽനിന്നുള്ള രാജസേവകരാണെന്ന് വ്യക്തമാക്കുന്നു. אַנְשֵׁי എന്ന പദത്തിന്റെ പുരുഷലിംഗ സൂചന ‘പുരുഷന്മാർ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: אַנְשֵׁי יְהוּדָה എന്നതിലെ ലിംഗസൂചന
  choice: യെഹൂദാപുരുഷന്മാർ
  alternative: യെഹൂദയിലെ ആളുകൾ
  rationale: എബ്രായപദം വ്യക്തമായി പുരുഷലിംഗ ബഹുവചനമായതിനാൽ അതു പൊതുവാക്കി മാറ്റാതെ നിലനിർത്തി.
- issue: עַבְדֵי הַמֶּלֶךְ എന്നതിന്റെ സാമൂഹിക പദവി
  choice: രാജാവിന്റെ സേവകർ
  alternative: രാജാവിന്റെ ഉദ്യോഗസ്ഥർ
  rationale: ‘സേവകർ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ രാജഭരണത്തിലെ ഔദ്യോഗിക പദവി മാത്രമായി അർഥം ചുരുക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടുവാക്യങ്ങളാക്കി; സമാനാധികരണ ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്തി.
