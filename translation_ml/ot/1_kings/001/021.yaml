    rationale: Without a death-specific qualifier, it may be heard as sleeping alongside one’s fathers rather than as the conventional Hebrew idiom for death.
  - severity: low
    issue: ‘യജമാനനായ രാജാവ്’ is less natural than ‘പ്രഭുവായ രാജാവ്’ for a deferential royal address.
    rationale: ‘പ്രഭു’ is the customary respectful Malayalam courtly/Biblical register and avoids the more servant-master connotation of ‘യജമാനൻ.’
