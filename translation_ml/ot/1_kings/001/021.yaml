source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: ml
  text: എന്റെ പ്രഭുവായ രാജാവ് തന്റെ പിതാക്കന്മാരോടൊപ്പം അന്ത്യനിദ്ര പ്രാപിക്കുമ്പോൾ[a], ഞാനും എന്റെ മകൻ ശലോമോനും കുറ്റക്കാരായി കണക്കാക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അന്ത്യനിദ്ര പ്രാപിക്കുക” ഇവിടെ മരിക്കുക എന്നർഥമുള്ള പ്രയോഗമാണ്. “കുറ്റക്കാർ” എന്നതിനു “പാപികൾ” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം കുറ്റമുള്ളവരായി അഥവാ ശിക്ഷാർഹരായി കരുതപ്പെടുന്നവരെ സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ നിയമ-രാഷ്ട്രീയ നിലയാണ് പ്രധാനമായി ഉദ്ദേശിക്കുന്നത്.
    reason: idiom_and_lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: കണക്കാക്കപ്പെടും
  rationale: ഈ ഘടന ബത്ത്‌ശേബയുടെ ആശങ്കയുടെ ഫലം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭാവികാലവാക്യമായി നൽകി.
- source_word: כִּשְׁכַב
  choice: നിദ്രപ്രാപിക്കുമ്പോൾ
  rationale: ‘പിതാക്കന്മാരോടൊപ്പം’ എന്ന തുടർപ്രയോഗവുമായി ചേർന്ന് മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്; മരണത്തിന്റെ ആശയം വ്യക്തമാകുന്നതിനൊപ്പം രൂപകഭാവവും നിലനിർത്തുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവ്
  rationale: ദാവീദിനോടുള്ള രാജസഭാപരമായ ആദരവും ബത്ത്‌ശേബയുടെ വിനയമുള്ള അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം
  rationale: മരിച്ച പൂർവികരോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ കുടുംബപരവും രൂപകാത്മകവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: וְהָיִיתִי אֲנִי
  choice: ഞാനും ... കണക്കാക്കപ്പെടും
  rationale: ഇവിടെ ‘ആയിരിക്കും’ എന്നതിലുപരി ഒരു നിയമ-രാഷ്ട്രീയ നിലയിൽ അങ്ങനെ പരിഗണിക്കപ്പെടുമെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: എന്റെ മകൻ ശലോമോനും
  rationale: ബന്ധവും വ്യക്തിനാമവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളക്രമം.
- source_word: חַטָּאִים
  choice: കുറ്റക്കാരായി
  rationale: പദത്തിന് ‘പാപികൾ’ എന്നും അർഥമാകാമെങ്കിലും, രാജാവകാശത്തെച്ചൊല്ലിയുള്ള ഈ സന്ദർഭത്തിൽ കുറ്റം ചുമത്തപ്പെട്ടവരോ ശിക്ഷാർഹരായി കണക്കാക്കപ്പെടുന്നവരോ എന്ന നിയമ-രാഷ്ട്രീയ ഭാവമാണ് മുൻനിൽക്കുന്നത്.
theological_decisions:
- issue: חַטָּאִים എന്ന പദത്തിന്റെ ധാർമികമോ നിയമ-രാഷ്ട്രീയമോ ആയ ഭാവം
  choice: പ്രധാന പാഠത്തിൽ ‘കുറ്റക്കാരായി’
  alternative: ‘പാപികളായി’
  rationale: രാജ്യാവകാശസന്ദർഭം ബത്ത്‌ശേബയും ശലോമോനും കുറ്റവാളികളായി കണക്കാക്കി ശിക്ഷിക്കപ്പെടാനുള്ള ഭീഷണിയെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലപദത്തിന്റെ ധാർമിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജസഭാപരമായ ആദരം നിലനിർത്താൻ ‘യജമാനനായ രാജാവ്’ ഉപയോഗിച്ചു; മരണത്തെക്കുറിച്ചുള്ള എബ്രായ രൂപകം ‘നിദ്രപ്രാപിക്കുക’ എന്ന സ്വാഭാവിക ബൈബിൾ-മലയാള പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
