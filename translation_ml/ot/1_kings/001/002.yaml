id: 1KI.1.2
reference: 1 Kings 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ עֲבָדָ֗י/ו יְבַקְשׁ֞וּ לַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ נַעֲרָ֣ה בְתוּלָ֔ה וְ/עָֽמְדָה֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וּ/תְהִי ל֖/וֹ סֹכֶ֑נֶת וְ/שָׁכְבָ֣ה בְ/חֵיקֶ֔/ךָ וְ/חַ֖ם לַ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ദാസന്മാർ അവനോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിനുവേണ്ടി കന്യകയായ ഒരു യുവതിയെ അവർ അന്വേഷിക്കട്ടെ. അവൾ രാജാവിനെ ശുശ്രൂഷിക്കട്ടെ[a]; അവന്റെ പരിചാരികയായിരിക്കട്ടെ[b]. അവൾ അങ്ങയുടെ മടിയിൽ കിടക്കട്ടെ[c]; അങ്ങനെ എന്റെ യജമാനനായ രാജാവിനു ചൂടു ലഭിക്കട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവൾ രാജാവിന്റെ മുമ്പിൽ നിൽക്കട്ടെ.’ എബ്രായ പ്രയോഗത്തിന് ഒരാളുടെ മുമ്പിൽ സേവനത്തിനായി സന്നിഹിതയായിരിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിചാരിക’ എന്നതിന് ‘ശുശ്രൂഷക’ അല്ലെങ്കിൽ ‘പരിപാലക’ എന്നും പരിഭാഷപ്പെടുത്താം. അപൂർവമായ എബ്രായപദം മറ്റൊരാളെ ശുശ്രൂഷിക്കുകയോ പരിചരിക്കുകയോ ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അങ്ങയുടെ മടിയിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: അവന്റെ ദാസന്മാർ
  rationale: രാജകൊട്ടാരത്തിന്റെ പശ്ചാത്തലത്തിൽ രാജാവിനെ സേവിക്കുന്നവരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്ന പൊതുവായ പദപ്രയോഗം; അടിമത്തം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: יְבַקְשׁוּ
  choice: അവർ അന്വേഷിക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ബഹുവചനത്തിലെ നിർദേശാത്മക ഭാവം മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിനുവേണ്ടി
  rationale: ഒന്നാം പുരുഷ ഉടമസ്ഥതയും രാജസദസ്സിലെ ആദരസൂചകമായ അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: נַעֲרָה בְתוּלָה
  choice: കന്യകയായ ഒരു യുവതി
  rationale: נַעֲרָה സൂചിപ്പിക്കുന്ന യുവത്വവും בְתוּלָה വ്യക്തമാക്കുന്ന കന്യകാത്വവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: അവൾ രാജാവിനെ ശുശ്രൂഷിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘രാജാവിന്റെ മുമ്പിൽ നിൽക്കുക’ എന്നാണെങ്കിലും രാജസദസ്സിലെ പ്രയോഗത്തിൽ സേവനത്തിനായി സന്നിഹിതയായിരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: סֹכֶנֶת
  choice: പരിചാരിക
  rationale: അപൂർവമായ ഈ പദം മറ്റൊരാളെ പരിചരിക്കുകയും ശുശ്രൂഷിക്കുകയും ചെയ്യുന്ന സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വ്യക്തമല്ലാത്ത ലൈംഗിക സൂചനകൾ ചേർക്കുന്നില്ല.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: അവൾ അങ്ങയുടെ മടിയിൽ കിടക്കട്ടെ
  rationale: חֵיק എന്നതിന്റെ ശരീരസാന്നിധ്യം സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപവും രാജാവിനോടുള്ള ആദരമുള്ള രണ്ടാംപുരുഷ അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: וְחַם
  choice: അങ്ങനെ എന്റെ യജമാനനായ രാജാവിനു ചൂടു ലഭിക്കട്ടെ
  rationale: ഈ ക്രമീകരണത്തിന്റെ ഉദ്ദേശിച്ച ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. രാജസദസ്സിലെ ആദരഭാവം ‘എന്റെ യജമാനനായ രാജാവ്’, ‘അങ്ങയുടെ’ എന്നീ പ്രയോഗങ്ങളിലൂടെ സൂക്ഷിച്ചു; അപൂർവ പദത്തിന്റെയും രാജസദസ്സിലെ പ്രയോഗത്തിന്റെയും അർഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
