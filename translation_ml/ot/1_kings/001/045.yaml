  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: ml
  text: പുരോഹിതനായ സാദോക്കും പ്രവാചകനായ നാഥാനും ഗീഹോനിൽവെച്ച് അവനെ രാജാവായി അഭിഷേകം ചെയ്തിരിക്കുന്നു. അവർ അവിടെനിന്ന് ആനന്ദിച്ചുകൊണ്ട് കയറിവന്നു; നഗരം ആരവംകൊണ്ട് ഇളകിമറിഞ്ഞു.[a] നിങ്ങൾ കേട്ട ശബ്ദം അതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നഗരം മുഴങ്ങിപ്പോയി” അല്ലെങ്കിൽ “നഗരം ഇളകിമറിഞ്ഞു”; എബ്രായക്രിയ വലിയ ശബ്ദത്തോടെയുള്ള കോലാഹലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: അവനെ ... അഭിഷേകം ചെയ്തിരിക്കുന്നു
  rationale: രാജകീയ പദവിയിലേക്കുള്ള എണ്ണാഭിഷേകത്തെ സൂചിപ്പിക്കുന്ന משׁח എന്ന ക്രിയയുടെ പതിവായ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; ഇപ്പോൾ കേൾക്കുന്ന ആരവത്തിന്റെ കാരണമായ പൂർത്തിയായ സംഭവമെന്ന സന്ദർഭഭാവം ‘ചെയ്തിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: צָדוֹק הַכֹּהֵן
  choice: പുരോഹിതനായ സാദോക്ക്
  rationale: പേര് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; പദവി സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകി.
- source_word: נָתָן הַנָּבִיא
  choice: പ്രവാചകനായ നാഥാൻ
  rationale: നാമം ലിപ്യന്തരിച്ചു; נביא എന്ന പദത്തിന് സാധാരണയും വ്യക്തവുമായ ‘പ്രവാചകൻ’ ഉപയോഗിച്ചു.
- source_word: לְמֶלֶךְ
  choice: രാജാവായി
  rationale: അഭിഷേകം ഏത് പദവിയിലേക്കാണെന്ന് സൂചിപ്പിക്കുന്ന לְ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּגִחוֹן
  choice: ഗീഹോനിൽവെച്ച്
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; അഭിഷേകം നടന്ന സ്ഥലം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: അവർ അവിടെനിന്ന് ... കയറിവന്നു
  rationale: עלה എന്നതിലെ മുകളിലേക്കുള്ള ചലനവും സംസാരിക്കുന്നവരുടെ ദിശയിലേക്കുള്ള വരവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: שְׂמֵחִים
  choice: ആനന്ദിച്ചുകൊണ്ട്
  rationale: മടങ്ങിവരുന്നവരുടെ സന്തോഷപൂർണമായ പ്രവൃത്തിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: നഗരം ആരവംകൊണ്ട് ഇളകിമറിഞ്ഞു
  rationale: הום സൂചിപ്പിക്കുന്ന വലിയ ശബ്ദവും പൊതുവായ ചലനക്ഷോഭവും ഒരുമിച്ച് പകർത്തുന്നു; തുടർന്നുള്ള ‘ശബ്ദം’ എന്ന പരാമർശത്തോടും യോജിക്കുന്നു.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: നിങ്ങൾ കേട്ട ശബ്ദം അതാണ്
  rationale: הוּאയുടെ ചൂണ്ടിക്കാണിക്കുന്ന ബലം നിലനിർത്തി, קוֹל എന്ന വിശാലപദം ‘ശബ്ദം’ എന്നു പരിഭാഷപ്പെടുത്തി.
