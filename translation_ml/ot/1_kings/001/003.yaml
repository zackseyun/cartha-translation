id: 1KI.1.3
reference: 1 Kings 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഇസ്രായേലിന്റെ ദേശമെങ്ങും സുന്ദരിയായ ഒരു യുവതിയെ അന്വേഷിച്ചു; ശൂനേംകാരിയായ[a] അബീശഗിനെ കണ്ടെത്തി രാജാവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശൂനേംകാരി’ എന്നത് ശൂനേം പട്ടണത്തിൽനിന്നുള്ള സ്ത്രീ എന്നർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: അവർ അന്വേഷിച്ചു
  rationale: בקשׁ എന്ന ക്രിയ സജീവമായി അന്വേഷിക്കുക എന്ന അർഥം നൽകുന്നു; ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: נַעֲרָה יָפָה
  choice: സുന്ദരിയായ ഒരു യുവതി
  rationale: נַעֲרָה വിവാഹപ്രായത്തോടടുത്തോ വിവാഹപ്രായത്തിലുള്ളതോ ആയ യുവസ്ത്രീയെ സൂചിപ്പിക്കാം; ‘യുവതി’ ആധുനിക മലയാളത്തിൽ പ്രായം അനാവശ്യമായി കുറച്ചുകാണിക്കാതെ അർഥം നൽകുന്നു. יָפָה നേരിട്ട് ‘സുന്ദരി’ എന്നാണ്.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദേശമെങ്ങും
  rationale: ഇവിടെ גְּבוּל അതിർത്തിരേഖകളെ മാത്രമല്ല, ഇസ്രായേലിന്റെ മുഴുവൻ ഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; ‘ദേശമെങ്ങും’ അന്വേഷണത്തിന്റെ വ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיִּמְצְאוּ
  choice: കണ്ടെത്തി
  rationale: അന്വേഷണത്തിനുശേഷം കണ്ടെത്തിയതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ ആഖ്യാനക്രിയ.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: ശൂനേംകാരിയായ അബീശഗ്
  rationale: വ്യക്തിനാമം ശബ്ദാനുസൃതമായി നൽകുന്നു; gentilic ആയ הַשּׁוּנַמִּית അവൾ ശൂനേമിൽ നിന്നുള്ളവളാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള בוא ഇവിടെ ‘കൊണ്ടുവരുക’ എന്നാണ്; לַמֶּלֶךְ ലക്ഷ്യസ്ഥാനമായി രാജാവിനെ സൂചിപ്പിക്കുന്നു.
