translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലഭാഷയിലെ ആഖ്യാനക്രമം നിലനിർത്തിക്കൊണ്ട് വാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
