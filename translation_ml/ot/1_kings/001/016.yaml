  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. തുടർച്ചയായ രണ്ടു വണക്കക്രിയകളുടെ വ്യത്യാസം ‘കുനിഞ്ഞ്’ എന്നും ‘സാഷ്ടാംഗം നമസ്കരിച്ചു’ എന്നും നിലനിർത്തി. രാജാവിന്റെ ചോദ്യം നേരിട്ടതും സൗമ്യവുമായ രൂപത്തിൽ നൽകി.
