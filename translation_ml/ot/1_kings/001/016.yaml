  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: ml
  text: ബത്ത്-ശേബ കുനിഞ്ഞ് രാജാവിന്റെ മുമ്പിൽ സാഷ്ടാംഗം നമസ്കരിച്ചു. രാജാവ് അവളോട്, “നിനക്ക് എന്താണ് വേണ്ടത്?[a]” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം: “നിനക്ക് എന്ത്?” സന്ദർഭമനുസരിച്ച് ഇതിന് “നിനക്ക് എന്താണ് വേണ്ടത്?” എന്നോ “എന്താണ് നിന്നെ വിഷമിപ്പിക്കുന്നത്?” എന്നോ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: കുനിഞ്ഞ്
  rationale: קָדַד ശരീരം താഴ്ത്തി വണങ്ങുന്ന ഭാവത്തെ സൂചിപ്പിക്കുന്നു. മുട്ടുകുത്തിയെന്ന് അതിരുകടന്ന് നിർവചിക്കാതെ ശാരീരിക ചലനം വ്യക്തമാക്കുന്നു.
- source_word: בַּת שֶׁבַע
  choice: ബത്ത്-ശേബ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: וַתִּשְׁתַּחוּ
  choice: സാഷ്ടാംഗം നമസ്കരിച്ചു
  rationale: שׁחה എന്ന ക്രിയ ഇവിടെ രാജാവിന്റെ മുമ്പിൽ നിലംവരെ താഴ്ന്ന് ആദരവ് പ്രകടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻപുള്ള קָדַד-ൽനിന്നുള്ള തീവ്രതാഭേദവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ
  rationale: വണക്കത്തിന്റെ ദിശയും രാജസന്നിധിയിലെ ആദരഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: രാജാവ് അവളോട് ... എന്നു ചോദിച്ചു
  rationale: വാക്കുതോറും 'രാജാവ് പറഞ്ഞു' എന്നാണെങ്കിലും, തുടർന്നുവരുന്ന ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ 'ചോദിച്ചു' എന്നു പരിഭാഷപ്പെടുത്തി; 'അവളോട്' സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: מַה לָּךְ
  choice: നിനക്ക് എന്താണ് വേണ്ടത്?
  rationale: അക്ഷരാർഥത്തിൽ 'നിനക്ക് എന്ത്?' എന്ന എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ അവളുടെ അഭ്യർഥനയെയോ വിഷമത്തെയോ കുറിച്ചുള്ള അന്വേഷണമാണ്. രാജസദസ്സിലെ സാഹചര്യത്തിൽ 'നിനക്ക് എന്താണ് വേണ്ടത്?' സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് യഥാർഥ പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
