translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചയായ പ്രവർത്തനക്രമം നിലനിർത്താൻ അർധവിരാമം ഉപയോഗിച്ചു; വ്യാഖ്യാനപരമായ വർധന ഒഴിവാക്കി.
