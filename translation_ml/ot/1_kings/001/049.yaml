  yaml_path: translation/ot/1_kings/001/049.yaml
  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: ml
  text: അപ്പോൾ അദോനീയാവിന്റെ ക്ഷണിതാക്കളെല്ലാം വിറച്ചു എഴുന്നേറ്റു; ഓരോരുത്തനും അവനവന്റെ വഴിക്കുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: ഭയത്താൽ വിറച്ച്
  rationale: חרד എന്ന ക്രിയ ഭയമോ പരിഭ്രമമോ മൂലമുള്ള വിറയലിനെ സൂചിപ്പിക്കുന്നു. വെറും ‘ഭയപ്പെട്ടു’ എന്നതിനെക്കാൾ ഇതിലെ ശാരീരികവും മാനസികവുമായ പ്രതികരണം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיָּקֻמוּ
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന സാധാരണ ക്രിയയുടെ ‘എഴുന്നേൽക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ നൽകുന്നു.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: അദോനീയാവിന്റെ ക്ഷണിക്കപ്പെട്ടവരെല്ലാം
  rationale: הַקְּרֻאִים എന്ന നിഷ്ക്രിയ കൃദന്തം ‘ക്ഷണിക്കപ്പെട്ടവർ’ എന്നാണ്. സന്ദർഭത്തിൽ ഇവർ അദോനീയാവിന്റെ വിരുന്നിലേക്കു ക്ഷണിക്കപ്പെട്ട അതിഥികളാണെങ്കിലും, എബ്രായത്തിന്റെ രൂപം നേരിട്ട് നിലനിർത്താൻ ‘ക്ഷണിക്കപ്പെട്ടവർ’ എന്നു നൽകി.
- source_word: וַיֵּלְכוּ
  choice: പോയി
  rationale: הלך എന്ന അടിസ്ഥാന ചലനക്രിയയെ ലളിതമായ ‘പോയി’ എന്നു പരിഭാഷപ്പെടുത്തി; തുടർന്നുള്ള പ്രയോഗം അവർ പിരിഞ്ഞുപോയതിനെ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ വഴിക്കു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോ പുരുഷനും തന്റെ വഴിക്ക്’ എന്ന വിതരണാർഥമുള്ള പ്രയോഗമാണിത്. പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സന്ദർഭവും ഓരോരുത്തരും വേർപിരിഞ്ഞുപോയെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ ‘ഓരോരുത്തനും അവനവന്റെ വഴിക്കു’ എന്നു നിലനിർത്തുന്നു.
