source:
  edition: WLC
  text: וַ/יֶּֽחֶרְדוּ֙ וַ/יָּקֻ֔מוּ כָּל הַ֨/קְּרֻאִ֔ים אֲשֶׁ֖ר לַ/אֲדֹנִיָּ֑הוּ וַ/יֵּלְכ֖וּ אִ֥ישׁ לְ/דַרְכּֽ/וֹ־׃
