source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: ml
  text: അദോനീയാവ് ശലോമോനെ ഭയപ്പെട്ടു. അതുകൊണ്ട് അവൻ എഴുന്നേറ്റു ചെന്ന് യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിക്കുന്നത് വിശുദ്ധസ്ഥാനത്ത് അഭയമോ കരുണയോ തേടുന്നതിന്റെ ഒരു സൂചനയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: ശലോമോനെ ഭയപ്പെട്ടു
  rationale: യָרֵא എന്ന ക്രിയയും מִפְּנֵי എന്ന ബന്ധപ്രയോഗവും ചേർന്ന് ഇവിടെ ഭയത്തിന്റെ കാരണത്തെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ശലോമോനെ ഭയപ്പെട്ടു’ എന്നത് അതിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണ്; സ്ഥലം സൂചിപ്പിക്കുന്ന ‘സന്നിധിയിൽനിന്ന്’ എന്ന അക്ഷരാർഥം ഇവിടെ ചുമത്തുന്നില്ല.
- source_word: וַיָּקָם
  choice: അവൻ എഴുന്നേറ്റു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ തുടർച്ചയായ പ്രവർത്തനത്തെ ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיֵּלֶךְ
  choice: ചെന്ന്
  rationale: പ്രവർത്തനക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്ന നേരിട്ടുള്ള തർജമ.
- source_word: וַיַּחֲזֵק
  choice: പിടിച്ചു
  rationale: അവൻ കൊമ്പുകളിൽ കൈവെച്ച് മുറുകെ പിടിച്ച പ്രവൃത്തിയെ അതിശയോക്തിയില്ലാതെ വ്യക്തമാക്കുന്നു; ‘പിടിച്ചടക്കി’ പോലുള്ള ഹിംസാസൂചന ഒഴിവാക്കുന്നു.
- source_word: קַרְנוֹת
  choice: കൊമ്പുകൾ
  rationale: യാഗപീഠത്തിന്റെ പുറത്തേക്കു തള്ളിനിൽക്കുന്ന കൊമ്പാകൃതിയിലുള്ള മൂലകൾക്കുള്ള മൂലപാഠത്തിലെ ആരാധനാസംബന്ധിയായ സാങ്കേതികപദം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണവുമായി ബന്ധപ്പെട്ട מִזְבֵּחַ എന്ന പദത്തിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ മതഭാഷയിലും പരിചിതമായ സമാനപദം.
- source_word: וַאֲדֹנִיָּהוּ
  choice: അദോനീയാവ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകുന്നു; തുടക്കത്തിലെ waw-ന്റെ ആഖ്യാനബന്ധം വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാഗപീഠത്തിന്റെ കൊമ്പുകളിൽ പിടിക്കുന്ന അഭയാർഥനാസൂചന
  choice: പ്രധാനപാഠത്തിൽ ശാരീരികപ്രവൃത്തി മാത്രം അക്ഷരാർഥത്തിൽ നൽകി, അതിന്റെ സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘അഭയം തേടി യാഗപീഠത്തിലേക്ക് ഓടി’ എന്ന വിപുലീകരിച്ച പരിഭാഷ.
  rationale: മൂലപാഠം അഭയം അഥവാ കരുണ തേടിയെന്ന് നേരിട്ട് പറയാതെ പ്രവൃത്തിയെ മാത്രം വിവരിക്കുന്നു. അതിനാൽ സൂചിതമായ നിയമപരമോ ആരാധനാപരമോ ആയ അർഥം പ്രധാനപാഠത്തിൽ ഉറപ്പിച്ചുപറയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാഗപീഠം’, ‘കൊമ്പുകൾ’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തി; സാംസ്കാരികമായി അപരിചിതമായ പ്രവൃത്തിയുടെ അർഥം അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കി.
