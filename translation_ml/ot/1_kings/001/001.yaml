  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിനെ പരാമർശിക്കുമ്പോൾ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. മൂലത്തിലെ ‘വസ്ത്രങ്ങൾ’ നിലനിർത്തി; ‘പുതപ്പുകൾ’ എന്ന വ്യാഖ്യാനപരമായ പദം ഒഴിവാക്കി.
