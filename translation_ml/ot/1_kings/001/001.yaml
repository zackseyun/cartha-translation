source:
  edition: WLC
  text: וְ/הַ/מֶּ֤לֶךְ דָּוִד֙ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יְכַסֻּ֨/הוּ֙ בַּ/בְּגָדִ֔ים וְ/לֹ֥א יִחַ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: ml
  text: ദാവീദ് രാജാവ് വയസ്സായവനും വളരെ പ്രായംചെന്നവനുമായിരുന്നു.[a] അവർ അദ്ദേഹത്തെ വസ്ത്രങ്ങൾകൊണ്ട് മൂടി, എന്നാൽ അദ്ദേഹത്തിന് ചൂടുകിട്ടിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ദിവസങ്ങളിലേക്കു വന്നവൻ’; വളരെ പ്രായമായിരുന്നു എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: ദാവീദ് രാജാവ്
  rationale: ആരംഭത്തിലെ וְ ഇവിടെ പുതിയ രംഗത്തിന്റെ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ സ്വാഭാവികമായി വിടാം. מֶלֶךְ എന്ന പദവും ദാവീദ് എന്ന പേരും ചേർന്ന രാജകീയ പദവി ‘ദാവീദ് രാജാവ്’ എന്നു നൽകി.
- source_word: זָקֵן
  choice: വയസ്സുചെന്ന്
  rationale: വാർധക്യം നേരിട്ട് സൂചിപ്പിക്കുന്ന പദം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: בָּא בַּ/יָּמִים
  choice: പ്രായം വളരെ മുന്നേറിയവനായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളിലേക്കു വന്നവൻ’ എന്ന എബ്രായ ശൈലി വളരെ പ്രായമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകിക്കൊണ്ട് മൂലത്തിലെ ആവർത്തിച്ച ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַ/יְכַסֻּהוּ
  choice: അവർ അദ്ദേഹത്തെ ... മൂടിയിട്ടും
  rationale: ക്രിയയിലെ അനിശ്ചിത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തി. തുടർന്നുള്ള പരാജയഫലത്തോടുള്ള വൈരുധ്യം മലയാളത്തിലെ ‘മൂടിയിട്ടും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּ/בְּגָדִים
  choice: വസ്ത്രങ്ങൾകൊണ്ട്
  rationale: בְּגָדִים എന്നതിന്റെ സാധാരണ അർഥം വസ്ത്രങ്ങൾ എന്നാണ്. ‘പുതപ്പുകൾ’ എന്നു പറയുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: അദ്ദേഹത്തിന് ചൂടുകിട്ടിയില്ല
  rationale: חם ഇവിടെ ചൂടാകുക എന്ന ആശയവും לּוֹ അദ്ദേഹത്തിന് ചൂട് ലഭിക്കാതിരുന്നതും സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം സ്വാഭാവികമായി അവസ്ഥ അവതരിപ്പിക്കുന്നു.
