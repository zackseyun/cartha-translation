  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לָ/הֶ֗ם קְח֤וּ עִמָּ/כֶם֙ אֶת עַבְדֵ֣י אֲדֹנֵי/כֶ֔ם וְ/הִרְכַּבְתֶּם֙ אֶת שְׁלֹמֹ֣ה בְנִ֔/י עַל הַ/פִּרְדָּ֖ה אֲשֶׁר לִ֑/י וְ/הוֹרַדְתֶּ֥ם אֹת֖/וֹ אֶל גִּחֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: ml
  text: 'രാജാവ് അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ യജമാനന്റെ പരിചാരകരെ നിങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുക. എന്റെ മകനായ ശലോമോനെ എനിക്കുള്ള കോവർകഴുതപ്പുറത്ത് കയറ്റി[a] ഗീഹോനിലേക്കു കൊണ്ടിറങ്ങുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്റെ മകനായ ശലോമോനെ എനിക്കുള്ള കോവർകഴുതപ്പുറത്ത് സവാരി ചെയ്യാൻ ഇടയാക്കുക.” എബ്രായ ക്രിയ കാരണാർത്ഥകമാണ്; പരിചാരകർ ശലോമോനെ കോവർകഴുതപ്പുറത്ത് കയറ്റണമെന്നാണ് അർത്ഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: ദാസന്മാർ
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ ഇത് രാജാവിന്റെ അധികാരത്തിൻകീഴിലുള്ള സേവകരെയോ പരിചാരകരെയോ സൂചിപ്പിക്കുന്നു; ബന്ധിത അടിമത്തം അനാവശ്യമായി വ്യക്തമാക്കാതെ ദാസന്മാർ എന്നത് സ്വാഭാവികമാണ്.
- source_word: אֲדֹנֵיכֶם
  choice: നിങ്ങളുടെ യജമാനൻ
  rationale: രാജാവ് തന്നെക്കുറിച്ച് മൂന്നാംപുരുഷനിൽ ആദരപൂർവം പറയുന്ന രാജകീയ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְהִרְכַּבְתֶּם
  choice: കയറ്റി
  rationale: 'רכב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു: ശലോമോൻ സ്വയം കയറുക എന്നതിലുപരി, പരിചാരകർ അവനെ മൃഗപ്പുറത്ത് കയറ്റണം.'
- source_word: הַפִּרְדָּה
  choice: കോവർകഴുത
  rationale: פִּרְדָּה കോവർകഴുതയെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ പദം സ്ത്രീലിംഗമാണെങ്കിലും ഈ വാക്യത്തിൽ മൃഗത്തിന്റെ ലിംഗം പ്രത്യേകം മുന്നോട്ടുവയ്ക്കേണ്ടതില്ല.
- source_word: אֲשֶׁר לִי
  choice: എനിക്കുള്ള
  rationale: കോവർകഴുത രാജാവിന്റേതാണെന്ന ബന്ധവാക്യത്തിന്റെ നേരിട്ടുള്ള ഊന്നൽ നിലനിർത്തുകയും രാജകീയ അംഗീകാരത്തിന്റെ സൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהוֹרַדְתֶּם
  choice: കൊണ്ടിറങ്ങുക
  rationale: ירד എന്ന ക്രിയയുടെ കാരണാർത്ഥവും ഗീഹോനിലേക്കുള്ള താഴോട്ടുള്ള ഭൂപ്രകൃതിദിശയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: גִּחוֹן
  choice: ഗീഹോൻ
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְנִי
  choice: എന്റെ മകനായ
  rationale: രാജാവും ശലോമോനും തമ്മിലുള്ള പുത്രബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: രാജാവ് അവരോടു പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്സ്-ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘എനിക്കുള്ള’ എന്ന പ്രയോഗം ഉറവിടത്തിലെ ബന്ധവാക്യവും രാജാവിന്റെ ഉടമസ്ഥതയ്ക്കുള്ള ഊന്നലും നിലനിർത്തുന്നു; ‘കൊണ്ടിറങ്ങുക’ ഭൂപ്രകൃതിദിശ വ്യക്തമാക്കുന്നു.
