id: 1KI.1.18
reference: 1 Kings 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֥ה אֲדֹנִיָּ֖ה מָלָ֑ךְ וְ/עַתָּ֛ה אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לֹ֥א יָדָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: ml
  text: ഇപ്പോൾ, ഇതാ, അദോനീയാവ് രാജാവായിരിക്കുന്നു; ഇപ്പോൾ, എന്റെ പ്രഭുവായ രാജാവേ, അങ്ങ് അത് അറിയുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോഴിതാ / എന്നാൽ
  rationale: ആദ്യ പ്രയോഗം സാഹചര്യത്തിന്റെ അടിയന്തരതയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്നു; രണ്ടാം പ്രയോഗം രാജാവിന്റെ അറിവില്ലായ്മയുമായുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ശക്തി ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: מָלָךְ
  choice: രാജാവായിരിക്കുന്നു
  rationale: അദോനീയാവ് രാജത്വം ഏറ്റെടുത്തതായി അല്ലെങ്കിൽ രാജാവായി നിലകൊള്ളുന്നതായി പ്രസ്താവിക്കുന്ന പൂർത്തീകരിച്ച ക്രിയയുടെ സന്ദർഭോചിത അർഥം നൽകുന്നു; ഔദ്യോഗിക നിയമസാധുതയെ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: യജമാനനായ രാജാവേ
  rationale: ആദരസൂചകമായ 'എന്റെ യജമാനൻ, രാജാവ്' എന്ന അഭിസംബോധനയെ മലയാളത്തിൽ dignified and direct ആയി നൽകുന്നു.
- source_word: לֹא יָדָעְתָּ
  choice: അങ്ങ് അത് അറിഞ്ഞിട്ടില്ല
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തെ ആദരസൂചകമായ 'അങ്ങ്' കൊണ്ടും പ്രസ്താവനയുടെ പൂർത്തീകരണഭാവത്തെ 'അറിഞ്ഞിട്ടില്ല' കൊണ്ടും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അദോനീയാവിന്റെ രാജത്വത്തിന്റെ സ്വഭാവം
  choice: രാജാവായിരിക്കുന്നു
  alternative: രാജാവായി വാഴുന്നു / തന്നെത്താൻ രാജാവാക്കിയിരിക്കുന്നു
  rationale: മൂലപാഠം ഇവിടെ അവന്റെ അവകാശവാദത്തിന്റെ നിയമസാധുത നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ സ്വയം കിരീടമണിഞ്ഞുവെന്ന വ്യാഖ്യാനം ചേർക്കാതെയും പൂർണമായി നിയമാനുസൃത രാജത്വം സൂചിപ്പിക്കാതെയും പ്രസ്താവന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും രാജസഭാസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളം. വാചകത്തിലെ അടിയന്തരതയും ദാവീദിനോടുള്ള വിനയമുള്ള അഭിസംബോധനയും നിലനിർത്തി; അനാവശ്യ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി.
