revisions:
- from: ഇപ്പോഴിതാ, അദോനീയാവ് രാജാവായിരിക്കുന്നു. എന്നാൽ, യജമാനനായ രാജാവേ, അങ്ങ് അത് അറിഞ്ഞിട്ടില്ല.
  to: ഇപ്പോൾ, ഇതാ, അദോനീയാവ് രാജാവായിരിക്കുന്നു; ഇപ്പോൾ, എന്റെ പ്രഭുവായ രാജാവേ, അങ്ങ് അത് അറിയുന്നില്ല.
  rationale: The revision preserves both occurrences of וְעַתָּה as “ഇപ്പോൾ,” retains the attention-getting force of הִנֵּה with “ഇതാ,” and makes the possessive courtly address “my lord the king” explicit. It does not imply either legitimate accession or merely a self-proclaimed claim.
