  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נָתָן֒ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אַתָּ֣ה אָמַ֔רְתָּ אֲדֹנִיָּ֖הוּ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: ml
  text: 'അപ്പോൾ നാഥാൻ പറഞ്ഞു[a]: “എന്റെ പ്രഭുവായ രാജാവേ, ‘എനിക്കുശേഷം അദോനീയാവ് രാജാവാകും; അവൻ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും’ എന്നു അങ്ങ് പറഞ്ഞിട്ടുണ്ടോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പറഞ്ഞോ.” ഈ ചോദ്യത്തിലെ ഹീബ്രു പൂർണകാലരൂപം മലയാളത്തിൽ “പറഞ്ഞിട്ടുണ്ടോ” എന്നോ “പറഞ്ഞോ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: ദാവീദിനോടുള്ള ആദരപൂർവമായ രാജസഭാസംബോധനത്തിലെ ഉടമസ്ഥസൂചക ബഹുമാനപദവും രാജപദവിയും നിലനിർത്തുന്നു.
- source_word: אַתָּה אָמַרְתָּ
  choice: അങ്ങ് പറഞ്ഞിട്ടുണ്ടോ
  rationale: ചോദ്യത്തിലുള്ള ഹീബ്രു പൂർണകാലരൂപം രാജാവ് ഇത്തരമൊരു പ്രഖ്യാപനം നടത്തിയിട്ടുണ്ടോ എന്നു ചോദിക്കുന്നു; മലയാളത്തിലെ അനുഭവപൂർണ ഭൂതരൂപം ആ പ്രസക്തി സ്വാഭാവികമായി നൽകുന്നു. ‘അങ്ങ് പറഞ്ഞോ’ എന്നും സാധ്യമാണ്.
- source_word: אֲדֹנִיָּהוּ
  choice: അദോനീയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יִמְלֹךְ
  choice: രാജാവാകും
  rationale: ക്രിയയ്ക്ക് ‘രാജാവായിരിക്കുക/വാഴുക’ എന്ന അർഥമുണ്ട്; രാജാവിന്റെ പിൻഗാമിത്വസന്ദർഭത്തിൽ ‘രാജാവാകും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אַחֲרַי
  choice: എനിക്കുശേഷം
  rationale: പിൻഗാമിത്വത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: അവൻ എന്റെ സിംഹാസനത്തിൽ ഇരിക്കും
  rationale: രാജകീയ പിൻഗാമിത്വത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്ന നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളപരിഭാഷയാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസഭാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അങ്ങ്’ എന്ന ആദരസൂചക സർവനാമം രാജാവിനോടുള്ള നാഥാന്റെ ബഹുമാനം വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ ചോദ്യം യഥാർഥ ചോദ്യം തന്നെയോ സ്ഥിരീകരണം തേടുന്ന ചോദ്യം തന്നെയോ എന്ന സൂക്ഷ്മത നിർബന്ധമായി തീർപ്പാക്കിയിട്ടില്ല.
