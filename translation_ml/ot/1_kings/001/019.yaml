  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദാവീദിനെ അഭിസംബോധന ചെയ്യുന്ന ആദരഭാവത്തിന് ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ക്രിയാപുനരാവർത്തനം ‘ക്ഷണിച്ചു/ക്ഷണിച്ചില്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തി; പട്ടിക വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി.
