  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: ml
  text: അവൻ കന്നുകാലികളെയും തടിപ്പിച്ചു വളർത്തിയ മൃഗങ്ങളെയും ആട്ടിൻപറ്റങ്ങളെയും[a] ധാരാളമായി യാഗമായി അറുത്തു. രാജാവിന്റെ എല്ലാ പുത്രന്മാരെയും പുരോഹിതനായ അബ്യാഥാരിനെയും സൈന്യാധിപനായ യോവാബിനെയും അവൻ ക്ഷണിച്ചു[b]; എന്നാൽ അങ്ങയുടെ ദാസനായ ശലോമോനെ അവൻ ക്ഷണിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആട്ടിൻപറ്റങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വിളിച്ചു’ അഥവാ ‘വരുത്തി’; യാഗവിരുന്നിൽ പങ്കെടുക്കാൻ വിളിച്ചതിനാൽ മുഖ്യവാചകത്തിൽ ‘ക്ഷണിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു. വാക്യത്തിന്റെ അവസാനത്തിലും ഇതേ ക്രിയയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: യാഗമായി അറുത്തു
  rationale: זבח ഇവിടെ സാധാരണ മൃഗവധമല്ല, യാഗാർഥമുള്ള അറുക്കലാണ് സൂചിപ്പിക്കുന്നത്. ‘യാഗമായി അറുത്തു’ എന്നത് ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שׁוֹר
  choice: കാളകൾ
  rationale: ബോവൈൻ വർഗത്തിലെ യാഗമൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന പൊതുവായ പദമായി സന്ദർഭത്തിന് യോജിക്കുന്നു; ലിംഗം അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: מְרִיא
  choice: കൊഴുപ്പിച്ച കന്നുകാലികൾ
  rationale: പ്രത്യേകം തീറ്റകൊടുത്ത് കൊഴുപ്പിച്ച വളർത്തുമൃഗങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പട്ടികയിലെ കൂട്ടർഥം മലയാളത്തിൽ ബഹുവചനമായി സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: צֹאן
  choice: ആട്ടിൻപറ്റങ്ങൾ
  rationale: ഈ എബ്രായ കൂട്ടപ്പദത്തിന് ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാം. ഒരൊറ്റ ഇനത്തിലേക്ക് ചുരുക്കാതെ പറ്റമൃഗങ്ങളുടെ കൂട്ടർഥം നിലനിർത്തുന്നു.
- source_word: לָרֹב
  choice: ധാരാളമായി
  rationale: മൃഗങ്ങളുടെ വലിയ അളവും വിരുന്നിന്റെ വിപുലതയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: ക്ഷണിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വിളിച്ചു’ എന്നാണെങ്കിലും, യാഗവിരുന്നിൽ പങ്കെടുക്കാൻ ആളുകളെ വിളിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ക്ഷണിച്ചു’ എന്നാണ് സാമൂഹിക പ്രവർത്തനം വ്യക്തമായി പ്രകടമാകുന്നത്.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ എല്ലാ പുത്രന്മാരെയും
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗസൂചനയും രാജകുമാരന്മാരെ സംബന്ധിക്കുന്ന വ്യക്തമായ പരാമർശവും നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: പുരോഹിതനായ അബ്യാഥാരിനെയും
  rationale: വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും ഔദ്യോഗിക പദവി സ്വാഭാവിക മലയാളത്തിൽ വിവർത്തനം ചെയ്യുകയും ചെയ്തു.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: സൈന്യാധിപനായ യോവാബിനെയും
  rationale: שַׂר הַצָּבָא സൂചിപ്പിക്കുന്ന സൈനിക നേതൃത്വപദവി ആധുനികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: എന്നാൽ അങ്ങയുടെ ദാസനായ ശലോമോനെ
  rationale: ബത്ത്‌ശേബ ദാവീദിനോടു സംസാരിക്കുമ്പോൾ ഉപയോഗിക്കുന്ന ആദരസൂചകമായ ‘അങ്ങയുടെ ദാസൻ’ നിലനിർത്തി. ക്ഷണിക്കപ്പെട്ടവരോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
- source_word: לֹא קָרָא
  choice: അവൻ ക്ഷണിച്ചില്ല
  rationale: മുൻപ് വന്ന קרא എന്ന ക്രിയയോടുള്ള ഏകീകരണം നിലനിർത്തുകയും ശലോമോന്റെ ഒഴിവാക്കൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
