- from: അവന്റെ അപ്പൻ അവന്റെ ജീവിതത്തിൽ ഒരിക്കൽപോലും[a] അവനെ വിഷമിപ്പിച്ചിരുന്നില്ല[b]; “നീ എന്തിനാണ് ഇങ്ങനെ ചെയ്തത്?” എന്ന് അയാളോട് ചോദിച്ചിരുന്നില്ല. അവൻ കാഴ്ചയിൽ അതിസുന്ദരനുമായിരുന്നു. അബ്ശാലോമിനുശേഷമാണ് അവന്റെ അമ്മ അവനെ പ്രസവിച്ചത്.
