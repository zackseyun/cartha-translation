translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. עצב എന്ന പദത്തെ നേരിട്ട് ‘ശാസിക്കുക’ എന്നു മാത്രം നിർവചിക്കാതെ അതിലെ വേദനയുടെയോ അസ്വസ്ഥതയുടെയോ അർഥവ്യാപ്തി മുഖ്യവാക്യത്തിൽ നിലനിർത്തി; സന്ദർഭപരമായ ‘ശാസിക്കുക’ അടിക്കുറിപ്പിൽ നൽകി.
