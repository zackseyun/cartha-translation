  rationale: The revision preserves the Hebrew syntax by making the father's unspoken corrective question the means/content of his never causing Adonijah displeasure. It uses idiomatic modern Malayalam for physical appearance and keeps the source's implicit maternal subject explicit only where Malayalam naturally benefits from it. The combined note is anchored to the clause containing both the idiom ‘from his days’ and the verb עצב; combining these closely related lexical notes avoids an unnatural duplicate anchor while retaining all supplied alternative information.
