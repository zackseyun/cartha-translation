translation_notes:
  register: ആധുനികവും മാന്യവുമായ രാജസദസ്സിന്റെ ഭാഷ ഉപയോഗിച്ചു. ‘അങ്ങയുടെ ദാസൻ’ എന്ന പ്രയോഗം അരമനയിലെ ആദരപൂർവമായ സ്വയംവിശേഷണം നിലനിർത്തുന്നു. ഹീബ്രുവിലെ മുന്നിലേക്കു കൊണ്ടുവന്ന പട്ടിക മലയാളത്തിലെ കർമപ്രത്യയങ്ങളുടെ ആവർത്തനത്തിലൂടെ വ്യക്തമായി പുനരാവിഷ്കരിച്ചു.
