  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: ml
  text: എന്നാൽ അങ്ങയുടെ ദാസനായ എന്നെയും പുരോഹിതനായ സാദോക്കിനെയും യെഹോയാദയുടെ മകനായ ബെനായാവിനെയും അങ്ങയുടെ ദാസനായ ശലോമോനെയും അവൻ ക്ഷണിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിളിച്ചില്ല” അല്ലെങ്കിൽ “വരുത്തിയില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് വിളിക്കുക, വരുത്തുക, ക്ഷണിക്കുക എന്നീ അർഥങ്ങൾ വരാം; അദോനിയാവിന്റെ യാഗവിരുന്നിന്റെ സന്ദർഭത്തിന് “ക്ഷണിച്ചില്ല” യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: എന്നാൽ അങ്ങയുടെ ദാസനായ എന്നെയും
  rationale: മുൻപു ക്ഷണിക്കപ്പെട്ടവരോടുള്ള വ്യത്യാസം וְ־ ഇവിടെ സൂചിപ്പിക്കുന്നു; לִיയും സ്വതന്ത്ര സർവനാമമായ אֲנִיയും നൽകുന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു. עַבְדֶּךָ രാജസന്നിധിയിലെ ആദരസൂചകമായ സ്വയംവിശേഷണമാണ്.
- source_word: צָדֹק הַכֹּהֵן
  choice: പുരോഹിതനായ സാദോക്കിനെയും
  rationale: നിശ്ചിത പദവിയായ הַכֹּהֵן സ്വാഭാവികമായി ‘പുരോഹിതനായ’ എന്നു പരിഭാഷപ്പെടുത്തി; വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: യെഹോയാദയുടെ മകനായ ബെനായാവിനെയും
  rationale: ഹീബ്രു പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘യെഹോയാദയുടെ മകനായ’ എന്നു നൽകി; പേരുകൾ ഉറവിടഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ശലോമോനെയും
  rationale: ശലോമോനെ രാജാവിനോടുള്ള ബന്ധത്തിൽ വിശേഷിപ്പിക്കുന്ന ആദരസൂചകമായ ‘ദാസൻ’ നിലനിർത്തി.
- source_word: לֹא קָרָא
  choice: അവൻ ക്ഷണിച്ചില്ല
  rationale: קרא എന്ന ക്രിയയ്ക്ക് ‘വിളിക്കുക’, ‘വരുത്തുക’, ‘ക്ഷണിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം; അദോനിയാവിന്റെ യാഗവിരുന്നിന്റെ തത്സമയസന്ദർഭത്തിൽ ‘ക്ഷണിക്കുക’ ഏറ്റവും സ്വാഭാവികമാണ്. ക്രിയയിലെ കർത്താവിനെ മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി ‘അവൻ’ എന്നു പ്രകടമാക്കി.
