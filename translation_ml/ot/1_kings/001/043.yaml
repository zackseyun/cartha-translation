  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: ml
  text: 'യോനാഥാൻ അദോനീയാവിനോടു മറുപടിയായി പറഞ്ഞു: “നേരെ മറിച്ച്, നമ്മുടെ യജമാനനായ ദാവീദ് രാജാവ് ശലോമോനെ രാജാവാക്കിയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്നാൽ, നമ്മുടെ യജമാനനായ ദാവീദ് രാജാവ് ശലോമോനെ രാജാവാക്കിയിരിക്കുന്നു.” എബ്രായത്തിലെ אֲבָל എന്ന പദം ലളിതമായി “എന്നാൽ” എന്നു പരിഭാഷപ്പെടുത്താം; ഇവിടെ അതിന് മുൻധാരണയെ തിരുത്തുന്ന ശക്തിയുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ടു ക്രിയകളുടെയും മറുപടി-സംസാര അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לַאֲדֹנִיָּהוּ
  choice: അദോനീയാവിനോടു
  rationale: ל എന്ന ഉപസർഗം സംഭാഷണത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ‘-വിനോടു’ ആയി നൽകിയിരിക്കുന്നു; വ്യക്തിനാമം മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֲבָל
  choice: നേരെ മറിച്ച്
  rationale: ഇവിടെ മുൻധാരണയെ ശക്തമായി തിരുത്തുന്ന വിരുദ്ധാർഥബലം ഉണ്ട്; വെറും ‘എന്നാൽ’ എന്നതിനെക്കാൾ അത് വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: നമ്മുടെ യജമാനനായ ദാവീദ് രാജാവ്
  rationale: രാജസദസ്സിലെ ആദരസൂചകമായ ‘നമ്മുടെ യജമാനൻ’ എന്ന അർഥവും ‘ദാവീദ് രാജാവ്’ എന്ന സ്വാഭാവിക മലയാള പദക്രമവും സംരക്ഷിക്കുന്നു.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: ശലോമോനെ രാജാവാക്കിയിരിക്കുന്നു
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘ഒരാളെ രാജാവാക്കുക/രാജസ്ഥാനത്ത് സ്ഥാപിക്കുക’ എന്നാണ്; ‘അഭിഷേകം ചെയ്തു’ എന്നത് മൂലക്രിയയിൽ ഇല്ലാത്ത പ്രത്യേകത ചേർക്കും.
