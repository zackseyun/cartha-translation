  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസദസ്സിന്റെ ആദരഭാവം നിലനിർത്താൻ ‘യജമാനൻ’ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ഇരട്ട സംസാരക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടിയായി പറഞ്ഞു’ എന്നു ചുരുക്കി.
