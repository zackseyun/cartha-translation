source:
  edition: WLC
  text: כִּ֣י יָרַ֣ד הַ/יּ֗וֹם וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֩ לְ/כָל בְּנֵ֨י הַ/מֶּ֜לֶךְ וּ/לְ/שָׂרֵ֤י הַ/צָּבָא֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וְ/הִנָּ֛/ם אֹכְלִ֥ים וְ/שֹׁתִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ יְחִ֖י הַ/מֶּ֥לֶךְ אֲדֹנִיָּֽהוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: ml
  text: കാരണം, അവൻ ഇന്ന് താഴേക്കു പോയി കാളകളെയും കൊഴുപ്പിച്ച കന്നുകാലികളെയും ആടുകളെയും ധാരാളമായി ബലിയർപ്പിച്ചു[a]. രാജാവിന്റെ എല്ലാ പുത്രന്മാരെയും സൈന്യാധിപന്മാരെയും പുരോഹിതനായ അബ്യാഥാരിനെയും അവൻ ക്ഷണിച്ചിരിക്കുന്നു. ഇതാ, അവർ അവന്റെ മുമ്പിൽ തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നു; “അദോനീയാരാജാവ് നീണാൾ വാഴട്ടെ!” എന്നു പറയുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവൻ ഇന്ന് താഴേക്കു പോയി.” ഹീബ്രായക്രിയയിൽ ഈ ദിശാസൂചന ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “അദോനീയാരാജാവ് നീണാൾ വാഴട്ടെ!” എന്നത് “അദോനീയാവ് രാജാവ് ജീവിക്കട്ടെ” എന്ന ഹീബ്രായ രാജകീയ ആശംസയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ അറിയിപ്പിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: יָרַד הַיּוֹם
  choice: ഇന്ന് താഴേക്കു പോയി
  rationale: יָרַד എന്ന ക്രിയയിലെ ദിശാസൂചന നിലനിർത്തുന്നു; മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: וַיִּזְבַּח
  choice: യാഗം കഴിച്ചു
  rationale: വെറും അറുക്കൽ എന്നതിലുപരി ബലിയർപ്പണവുമായി ബന്ധപ്പെട്ട വിരുന്നിന്റെ ആരാധനാപരമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: കാളകളെയും കൊഴുപ്പിച്ച കന്നുകാലികളെയും ആടുകളെയും
  rationale: പട്ടികയിലെ മൃഗവിഭാഗങ്ങളുടെ വ്യത്യാസം നിലനിർത്തുന്നു; מְרִיא പ്രായം നിർബന്ധമായി സൂചിപ്പിക്കാത്തതിനാൽ വിശാലമായ ‘കന്നുകാലികൾ’ തെരഞ്ഞെടുത്തു.
- source_word: לָרֹב
  choice: ധാരാളമായി
  rationale: ബലിമൃഗങ്ങളുടെ വലിയ അളവ് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא
  choice: ക്ഷണിച്ചിരിക്കുന്നു
  rationale: לְ സഹിതമുള്ള קרא വിരുന്നിലേക്കു വിളിക്കുകയോ ക്ഷണിക്കുകയോ ചെയ്യുന്നതാണ്; ഇപ്പോഴത്തെ സാഹചര്യവുമായി ബന്ധപ്പെട്ട സമീപകാല പ്രവർത്തനം മലയാള പൂർണ്ണകാലം വ്യക്തമാക്കുന്നു.
- source_word: שָׂרֵי הַצָּבָא
  choice: സൈന്യാധിപന്മാർ
  rationale: സൈനിക നേതൃത്വത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: וְהִנָּם
  choice: ഇതാ
  rationale: കാണിച്ചുകൊടുക്കുന്ന ശ്രദ്ധാകർഷകഭാവം ഔന്നത്യമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: לְפָנָיו
  choice: അവന്റെ സന്നിധിയിൽ
  rationale: ‘അവന്റെ മുമ്പിൽ’ എന്ന സ്ഥലപരവും രാജസന്നിധി സൂചിപ്പിക്കാവുന്നതുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: അദോനീയാരാജാവ് നീണാൾ വാഴട്ടെ
  rationale: ഹീബ്രായ ആശംസയുടെ ഉദ്ദേശ്യം മലയാളത്തിലെ പതിവായ രാജകീയ അഭിവാദ്യരൂപത്തിൽ നൽകുന്നു.
