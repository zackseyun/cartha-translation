translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘സന്നിധിയിൽ’, ‘നീണാൾ വാഴട്ടെ’ എന്നിവ ഔന്നത്യം നിലനിർത്തുമ്പോഴും അർഥഗ്രഹണം ദുഷ്കരമാക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
