id: 1KI.1.48
reference: 1 Kings 1:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: ml
  text: 'രാജാവും ഇപ്രകാരം പറഞ്ഞു: “ഇന്ന് എന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരാളെ നൽകിയ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ വാഴ്ത്തപ്പെട്ടവൻ; എന്റെ കണ്ണുകൾ അതു കാണുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘കാണുന്നു’ എന്ന ക്രിയയുടെ കർമം പ്രസ്താവിച്ചിട്ടില്ല; സന്ദർഭത്തിൽനിന്ന് ‘അതു’ എന്നു പൂരിപ്പിച്ചിരിക്കുന്നു. ‘ഇരിക്കുന്ന ഒരാളെ’ എന്നതിന് ‘ഇരിക്കാൻ ഒരാളെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: יֹשֵׁב എന്ന പങ്കാളിയുടെ സന്ദർഭാനുസൃതമായ മറ്റൊരു അവതരണവും רֹאוֹת എന്ന ക്രിയയുടെ പ്രസ്താവിക്കാത്ത കർമവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇങ്ങനെയും പറഞ്ഞു
  rationale: וְגַם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും כָּכָה എന്നതിന്റെ മുന്നോട്ടു ചൂണ്ടുന്ന അർഥവും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ദൈവത്തെ സ്തുതിക്കുന്ന ആശീർവാദസൂത്രത്തിന്റെ ഗൗരവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വാ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റിസ്ഥാപിക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സുതാര്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר נָתַן הַיּוֹם יֹשֵׁב עַל כִּסְאִי
  choice: ഇന്ന് എന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ ഒരാളെ നൽകിയവൻ
  rationale: נָתַן എന്ന സാധാരണ ക്രിയയെ ‘നൽകി’ എന്ന അർഥത്തിൽ നിലനിർത്തുകയും יֹשֵׁב എന്ന കർത്തൃവാചക പങ്കാളിയെ രാജസ്ഥാനത്ത് ഇരിക്കാൻ ലഭിച്ച വ്യക്തിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְעֵינַי רֹאוֹת
  choice: അതെന്റെ കണ്ണുകൾ കാണുന്നു
  rationale: എബ്രായത്തിലെ ലളിതമായ സംയോജനവും ദാവീദിന്റെ നേരിട്ടുള്ള സാക്ഷ്യവും നിലനിർത്തുന്നു; ‘അത്’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വാ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: നൽകപ്പെട്ടത് ആരെന്നതും ‘കാണുന്നു’ എന്നതിന്റെ കർമവും
  choice: വ്യക്തിയുടെ പേര് ചേർക്കാതെ ‘ഒരാളെ’ എന്നും, കാണുന്നതിന്റെ കർമം സന്ദർഭാനുസൃതമായി ‘അത്’ എന്നും
  alternative: ശലോമോനെ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ കർമം പറയാതെ വിടുക
  rationale: വാക്യം വ്യക്തിയുടെ പേര് പറയുന്നില്ല; അതിനാൽ പേര് ചേർക്കുന്നില്ല. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി കാണുന്നതിന്റെ സന്ദർഭസിദ്ധമായ കർമം പൂരിപ്പിച്ചെങ്കിലും അടിക്കുറിപ്പിൽ മൂലത്തിലെ അവ്യക്തത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും രാജകീയ-സ്തുതിപരമായ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എന്നാൽ പ്രധാനവാചകത്തിലെ ‘അതെന്റെ കണ്ണുകൾ കാണുന്നു’ എന്ന ഘടനയെ കൂടുതൽ സ്വാഭാവികമാക്കാൻ പ്രസിദ്ധീകരണരൂപത്തിൽ ‘എന്റെ കണ്ണുകൾ അതു കാണുകയും ചെയ്യുന്നു’ എന്ന രൂപം പരിഗണിക്കാം.
