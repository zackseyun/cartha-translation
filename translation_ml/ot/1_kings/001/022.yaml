  text: וְ/הִנֵּ֛ה עוֹדֶ֥/נָּה מְדַבֶּ֖רֶת עִם הַ/מֶּ֑לֶךְ וְ/נָתָ֥ן הַ/נָּבִ֖יא בָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: ml
  text: അവൾ രാജാവിനോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, അതാ[a], നാഥാൻ പ്രവാചകൻ അകത്തേക്കു വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നോക്കൂ”; രംഗത്തിലെ പെട്ടെന്നുള്ള പുതിയ സംഭവവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: രംഗത്തിലെ പെട്ടെന്നുള്ള പുതിയ സംഭവവികാസത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരചിഹ്നത്തിന്റെ സജീവത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: അവൾ ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: സ്ത്രീലിംഗ കർത്താവിന്റെ തുടരുന്ന പ്രവൃത്തിയും അതിനിടയിൽ മറ്റൊരു സംഭവം നടന്നതും വ്യക്തമാക്കുന്നു.
- source_word: עִם הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: ഹീബ്രുവിലെ 'കൂടെ/ഒപ്പം' എന്ന ആശയം മലയാളത്തിലെ സംസാരക്രിയയോടു സ്വാഭാവികമായി ചേരുന്ന വിധത്തിൽ നേരിട്ടുള്ള സംവാദമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְנָתָן הַנָּבִיא
  choice: നാഥാൻ പ്രവാചകൻ
  rationale: വ്യക്തിനാമവും അതിനെ തിരിച്ചറിയിക്കുന്ന പദവിയും ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּא
  choice: അകത്തേക്കു വന്നു
  rationale: രാജസന്നിധിയിലെ മുറിയിലേക്കോ സദസ്സിലേക്കോ വന്നെത്തിയതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; മൂലക്രിയയുടെ 'വന്നു/പ്രവേശിച്ചു' എന്ന അർഥപരിധിയോട് യോജിക്കുന്നു.
