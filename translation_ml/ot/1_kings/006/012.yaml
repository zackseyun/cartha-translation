source:
  edition: WLC
  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: ml
  text: 'നീ പണിയുന്ന ഈ ആലയത്തെക്കുറിച്ചാകട്ടെ: നീ എന്റെ ചട്ടങ്ങളിൽ നടക്കുകയും, എന്റെ ന്യായവിധികൾ നടപ്പാക്കുകയും, എന്റെ സകല കല്പനകളും പാലിച്ച് അവയിൽ നടക്കുകയും ചെയ്താൽ, നിന്റെ അപ്പനായ ദാവീദിനോടു ഞാൻ അരുളിച്ചെയ്ത എന്റെ വചനം ഞാൻ നിന്നോടു ഉറപ്പിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ വചനം നിന്നോടു സ്ഥിരീകരിക്കും’ അല്ലെങ്കിൽ ‘നിന്നോടുള്ള എന്റെ വാഗ്ദാനം നിവർത്തിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘വചനം ഉറപ്പിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം മുമ്പ് അരുളിയതിനെ സ്ഥിരീകരിക്കുകയോ പ്രാബല്യത്തിൽ വരുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: ഈ ആലയം
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വീട്’ ആണെങ്കിലും ഇവിടെ ദേവാലയനിർമാണമാണ് സന്ദർഭം. മലയാളത്തിൽ ‘ഈ വീട്’ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുമെന്നതിനാൽ ‘ആലയം’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: നീ പണിയുന്ന
  rationale: പങ്കുപദരൂപമായ בֹנֶה സൂചിപ്പിക്കുന്ന പുരോഗമിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ വർത്തമാന വിശേഷണരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: നീ എന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുകയും ... ചെയ്താൽ
  rationale: הלך എന്ന ജീവിതനടപ്പിന്റെ രൂപകം ‘നടക്കുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു; בְּ എന്നതിന്റെ അനുസരണാർഥം വ്യക്തമാക്കാൻ ‘അനുസരിച്ച്’ ചേർത്തിരിക്കുന്നു. אִם ആരംഭിക്കുന്ന നിബന്ധന മലയാളവാക്യത്തിന്റെ അവസാനത്തിലുള്ള ‘ചെയ്താൽ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: എന്റെ ന്യായവിധികൾ നടപ്പാക്കുകയും
  rationale: מִשְׁפָּטִים എന്ന പദത്തിന്റെ നിയമപരവും ഉടമ്പടിപരവുമായ ഭാവം ‘ന്യായവിധികൾ’ നിലനിർത്തുന്നു; תעשה ഇവിടെ ‘നടപ്പാക്കുക’ എന്ന് വിവർത്തനം ചെയ്യുന്നത് സ്വാഭാവികമാണ്.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: എന്റെ സകല കല്പനകളും പാലിച്ച്
  rationale: שׁמר കല്പനകളോടൊപ്പം വരുമ്പോൾ അനുസരിച്ച് സൂക്ഷിക്കുക എന്ന അർഥമുള്ളതിനാൽ ‘പാലിക്കുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: לָלֶכֶת בָּהֶם
  choice: അവയനുസരിച്ച് നടക്കുകയും
  rationale: കല്പനകൾ ജീവിതത്തിൽ പ്രാവർത്തികമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആവർത്തിച്ചുള്ള ‘നടക്കുക’ രൂപകം സംരക്ഷിക്കുന്നു; സർവനാമം ചട്ടങ്ങൾ, ന്യായവിധികൾ, കല്പനകൾ എന്നിവയുടെ സമാഹാരത്തെ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിലെ വ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: ഞാൻ ... എന്റെ വചനം നിന്നോടു ഉറപ്പിക്കും
  rationale: הקים דבר എന്ന പ്രയോഗം മുമ്പ് അരുളിയ വാക്കിനെ സ്ഥിരീകരിക്കുകയോ പ്രാബല്യത്തിൽ വരുത്തുകയോ ചെയ്യുന്നതാണ്. ‘വചനം ഉറപ്പിക്കും’ എന്നത് ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു; אִתָּךְ ‘നിന്നോടു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: דְּבָרִי
  choice: എന്റെ വചനം
  rationale: דבר എന്നത് ‘വാക്ക്/വചനം’ എന്നും സന്ദർഭത്തിൽ ‘വാഗ്ദാനം’ എന്നും ഗ്രഹിക്കാം. തുടർന്നുള്ള דִּבַּרְתִּי എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്താനും വാഗ്ദാനാർഥം നിർബന്ധമായി ചുരുക്കാതിരിക്കാനും ‘വചനം’ തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: നിന്റെ അപ്പനായ ദാവീദിനോടു അരുളിച്ചെയ്ത
  rationale: דבר എന്ന ‘പറയുക’ എന്ന ക്രിയയെ ദൈവവചനത്തിന്റെ ഗൗരവമുള്ള മലയാളപ്രയോഗമായ ‘അരുളിച്ചെയ്യുക’ കൊണ്ട് നൽകുന്നു. אָבִיךָ എന്ന ബന്ധം ‘നിന്റെ അപ്പനായ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആലയനിർമാണം, ശലോമോന്റെ അനുസരണം, ദാവീദിനോടുള്ള വചനം എന്നിവ തമ്മിലുള്ള നിബന്ധനാപരമായ ബന്ധം
  choice: ശലോമോൻ ഉടമ്പടിപരമായ അനുസരണത്തിൽ നടന്നാൽ ദൈവം ദാവീദിനോടു പറഞ്ഞ വചനം അവനോടു ഉറപ്പിക്കുമെന്ന വ്യക്തമായ നിബന്ധനയായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് നിബന്ധനയില്ലാത്ത ദാവീദിക ഉടമ്പടിയുടെ വെറും പുനരുറപ്പിക്കൽ എന്നു വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ മുൻ വാഗ്ദാനത്തിന്റെ എല്ലാ വശങ്ങളെയും റദ്ദാക്കുന്ന സമ്പൂർണ നിബന്ധനയായി അവതരിപ്പിക്കുക.
  rationale: אִם എന്ന നിബന്ധനയും അതിനെ തുടർന്നുള്ള וַהֲקִמֹתִי എന്ന ഫലവാക്യവും ഹീബ്രുവിൽ വ്യക്തമാണ്. ഈ വാക്യം നിബന്ധനാപരതയും വിപുലമായ ദാവീദിക വാഗ്ദാനവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സ്വയം പരിഹരിക്കുന്നില്ല; വിവർത്തനവും അതിനെ പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. ‘ആലയം,’ ‘ചട്ടങ്ങൾ,’ ‘ന്യായവിധികൾ,’ ‘കല്പനകൾ,’ ‘വചനം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിലെ വ്യത്യസ്ത നിയമ-ഉടമ്പടി പദങ്ങളെ വേർതിരിക്കുന്നതുമാണ്. ‘അരുളിച്ചെയ്ത’ എന്നത് ദൈവത്തിന്റെ സംസാരത്തിന് യോജിച്ച ബൈബിൾഗൗരവം നൽകുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലാണ്.
