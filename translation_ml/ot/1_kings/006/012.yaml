revisions:
- from: 'നീ പണിയുന്ന ഈ ആലയത്തെക്കുറിച്ചാകട്ടെ: നീ എന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുകയും എന്റെ ന്യായവിധികൾ നടപ്പാക്കുകയും എന്റെ സകല കല്പനകളും പാലിച്ച് അവയനുസരിച്ച് നടക്കുകയും ചെയ്താൽ, ഞാൻ നിന്റെ അപ്പനായ ദാവീദിനോടു അരുളിച്ചെയ്ത എന്റെ വചനം നിന്നോടു ഉറപ്പിക്കും.[a]'
  to: 'നീ പണിയുന്ന ഈ ആലയത്തെക്കുറിച്ചാകട്ടെ: നീ എന്റെ ചട്ടങ്ങളിൽ നടക്കുകയും, എന്റെ ന്യായവിധികൾ നടപ്പാക്കുകയും, എന്റെ സകല കല്പനകളും പാലിച്ച് അവയിൽ നടക്കുകയും ചെയ്താൽ, നിന്റെ അപ്പനായ ദാവീദിനോടു ഞാൻ അരുളിച്ചെയ്ത എന്റെ വചനം ഞാൻ നിന്നോടു ഉറപ്പിക്കും.[a]'
  rationale: The revision preserves the draft’s sound lexical choices and its explicit conditional relationship. It renders the repeated בְּ (‘in’) imagery as ‘ചട്ടങ്ങളിൽ’ and ‘അവയിൽ,’ and supplies a footnote alternative that does not replace ‘with you’ with the materially different ‘in you.’
