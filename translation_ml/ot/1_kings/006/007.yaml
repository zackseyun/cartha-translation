translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘ആലയം’, ‘പാകപ്പെടുത്തിയ കല്ലുകൾ’, ‘ചുറ്റിക’, ‘മഴു’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ അപൂർവമായ מַסָּע എന്ന പദത്തിന്റെ യഥാർഥ പരിധി മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് നിശ്ചയിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
