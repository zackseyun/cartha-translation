source:
  edition: WLC
  text: וְ/הַ/בַּ֨יִת֙ בְּ/הִבָּ֣נֹת֔/וֹ אֶֽבֶן שְׁלֵמָ֥ה מַסָּ֖ע נִבְנָ֑ה וּ/מַקָּב֤וֹת וְ/הַ/גַּרְזֶן֙ כָּל כְּלִ֣י בַרְזֶ֔ל לֹֽא נִשְׁמַ֥ע בַּ/בַּ֖יִת בְּ/הִבָּנֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: ml
  text: ആലയം പണിതപ്പോൾ, മുൻകൂട്ടി പാകപ്പെടുത്തിയ കല്ലുകൾകൊണ്ടാണ് പണിതത്; അതു പണിയുന്ന സമയത്ത് ചുറ്റികയുടെയോ മഴുവിന്റെയോ ഇരുമ്പുകൊണ്ടുള്ള യാതൊരു ഉപകരണത്തിന്റെയോ ശബ്ദം ആലയത്തിൽ കേട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുൻകൂട്ടി പാകപ്പെടുത്തിയ” എന്നതിന് “കൽക്കനിയിൽവെച്ച് പാകപ്പെടുത്തിയ” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന מַסָּע എന്ന എബ്രായപദം അപൂർവവും സാങ്കേതികവുമാണ്; അത് കല്ലുകൾ ഖനനം ചെയ്തതിനെയോ ഖനിയിൽവെച്ചുതന്നെ പാകപ്പെടുത്തി കൊണ്ടുവന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ഭവനം’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളവായനക്കാർക്ക് ഉദ്ദേശ്യം ഉടൻ വ്യക്തമാകുന്നതിനാൽ ‘ആലയം’ തെരഞ്ഞെടുത്തു.
- source_word: בְּהִבָּנֹתוֹ
  choice: പണിതപ്പോൾ / പണിയുന്ന സമയത്ത്
  rationale: בְ ചേർന്ന infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഗതിക്കനുസരിച്ച് ആദ്യം സംക്ഷിപ്തമായും പിന്നീട് ദൈർഘ്യസൂചനയോടെയും നൽകി.
- source_word: אֶבֶן שְׁלֵמָה מַסָּע
  choice: മുൻകൂട്ടി പാകപ്പെടുത്തിയ കല്ലുകൾ
  rationale: שְׁלֵמָה കല്ലുകൾ പൂർണമായി ഒരുക്കിയവയാണെന്ന ആശയം നൽകുന്നു; അപൂർവവും സാങ്കേതികവുമായ מַסָּע ഖനിയിലോ അവിടെനിന്ന് കൊണ്ടുവരുന്നതിനു മുമ്പോ തയ്യാറാക്കിയതിനെ സൂചിപ്പിക്കാം. നിർമാണസ്ഥലത്ത് എത്തുംമുമ്പേ കല്ലുകൾ പാകപ്പെടുത്തിയിരുന്നു എന്ന പ്രായോഗിക അർഥം മുഖ്യവാചകത്തിൽ നൽകി, അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נִבְנָה
  choice: പണിതത്
  rationale: നിഫാൽ പൂർണക്രിയ നിർമാണം നടന്ന രീതിയെ പ്രസ്താവിക്കുന്നു; മലയാളത്തിൽ ‘പണിതത്’ സ്വാഭാവികമാണ്.
- source_word: מַקָּבוֹת
  choice: ചുറ്റിക
  rationale: രൂപപരമായി ബഹുവചനമാണെങ്കിലും ഉപകരണവർഗങ്ങളുടെ പട്ടികയിൽ മലയാളത്തിൽ ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: הַגַּרְזֶן
  choice: മഴു
  rationale: സാധാരണ അർഥമായ ‘axe’ എന്നതിന് സന്ദർഭോചിതവും നിലവാരമുള്ളതുമായ മലയാളപദം ‘മഴു’ ആണ്; ‘വായ്ച്ചുളി’ പോലുള്ള കൂടുതൽ പ്രത്യേക അർഥം ഉറപ്പില്ല.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: മറ്റേതെങ്കിലും ഇരുമ്പുപകരണം
  rationale: כָּל എന്നതിന്റെ വിതരണാത്മകവും സമഗ്രവുമായ അർഥം ‘ഏതെങ്കിലും’കൊണ്ട് നൽകി; മുൻപറഞ്ഞ ഉപകരണങ്ങളും ഇരുമ്പുകൊണ്ടുള്ളവയായതിനാൽ പട്ടികയുടെ സ്വാഭാവികതയ്ക്കായി ‘മറ്റേതെങ്കിലും’ ചേർത്തു.
- source_word: לֹא נִשְׁמַע
  choice: ശബ്ദം ... കേട്ടില്ല
  rationale: ഹീബ്രു നിഫാൽ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ഉപകരണങ്ങളുടെ ‘ശബ്ദം കേട്ടില്ല’ എന്നു നൽകി.
