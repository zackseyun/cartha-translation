translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ‘ഭവനം’ എന്ന പദം നിലനിർത്തി, സന്ദർഭാർഥമായ ‘ദൈവാലയം’ അടിക്കുറിപ്പിൽ നൽകി.
