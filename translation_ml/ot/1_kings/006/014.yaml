  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവാലയം.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ഭവനം’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ദൈവാലയത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന ധാതുവിന്റെ Qal wayyiqtol രൂപം തുടർച്ചയായ ആഖ്യാനത്തിൽ പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘പണിതു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: הַבַּיִת
  choice: ആ ഭവനം
  rationale: בַּיִת എന്നതിന്റെ അക്ഷരാർഥം ‘വീട്/ഭവനം’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് ദൈവാലയത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിന്റെ പദപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് മുൻസന്ദർഭത്തിലെ നിർദിഷ്ട കെട്ടിടത്തെ വ്യക്തമാക്കാൻ ‘ആ ഭവനം’ എന്നു നൽകി.
- source_word: וַיְכַלֵּהוּ
  choice: പൂർത്തിയാക്കി
  rationale: כלה എന്ന ധാതുവിന്റെ Piel രൂപവും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും ചേർന്ന് ‘അതിനെ പൂർത്തിയാക്കി’ എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ കർമം മുൻപേ വ്യക്തമാകുന്നതിനാൽ ‘പൂർത്തിയാക്കി’ സ്വാഭാവികമാണ്.
