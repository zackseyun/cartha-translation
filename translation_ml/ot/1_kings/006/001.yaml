  rationale: പ്രധാനവാചകത്തിൽ മൂലത്തിലെ הַבַּיִת-ന്റെ നേരിട്ടുള്ള സമാനപദമായ ‘ഭവനം’ പുനഃസ്ഥാപിച്ചു; ‘യഹ്‌വേക്കുള്ള’ എന്ന പ്രയോഗം അതിന്റെ ആലയസന്ദർഭം വ്യക്തമാക്കുന്നു. രാജഭരണത്തെ അടിസ്ഥാനമാക്കിയ കാലനിർണ്ണയം കൂടുതൽ സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകി. വַיְהִי എന്ന ആഖ്യാനാരംഭകം മലയാളത്തിൽ സ്വതന്ത്രമായ അർഥഘടകമല്ലാത്തതിനാൽ കാലനിർണ്ണയവാക്യത്തിലൂടെ സ്വാഭാവികമായി ഉൾക്കൊണ്ടിരിക്കുന്നു. അടിക്കുറിപ്പുസൂചകങ്ങളും അവയുടെ ഉള്ളടക്കവും സംരക്ഷിച്ചു.
