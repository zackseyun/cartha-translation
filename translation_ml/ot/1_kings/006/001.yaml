id: 1KI.6.1
reference: 1 Kings 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടതിന്റെ നാനൂറ്റി എൺപതാം വർഷത്തിൽ, ശലോമോൻ ഇസ്രായേലിന്റെ രാജാവായി വാണ നാലാം വർഷത്തിൽ, സീവ് മാസത്തിൽ—അതായത് രണ്ടാം മാസത്തിൽ[a]—അവൻ യഹ്‌വേക്കുള്ള ഭവനം പണിതു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സീവ് എന്നത് എബ്രായ കലണ്ടറിലെ രണ്ടാം മാസത്തിന്റെ പഴയ പേരായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: സന്ദർഭത്തിൽ ‘ആലയം പണിയാൻ തുടങ്ങി’ എന്നും മനസ്സിലാക്കാം; എബ്രായ ക്രിയ അക്ഷരാർഥത്തിൽ ‘പണിതു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: സംഭവിച്ചു എന്നതിന് പ്രത്യേക പദപ്രയോഗം ചേർക്കാതെ കാലനിർണ്ണയവാക്യമായി അവതരിപ്പിച്ചു
  rationale: ഇവിടെ וַיְהִי ഒരു ചരിത്രകാലസൂചന അവതരിപ്പിക്കുന്ന ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ ‘സംഭവിച്ചത് ഇങ്ങനെയാണ്’ എന്നത് അനാവശ്യഭാരം സൃഷ്ടിക്കുന്നതിനാൽ സ്വാഭാവികമായ കാലവാക്യം മതിയാകുന്നു.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: നാനൂറ്റി എൺപതാം വർഷത്തിൽ
  rationale: എബ്രായ പ്രയോഗം 480 വർഷം കഴിഞ്ഞശേഷമെന്ന പൊതുവായ ദൈർഘ്യമല്ല, നിർദിഷ്ടമായ 480-ാം വർഷത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: ഇസ്രായേൽമക്കൾ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടതിന്റെ
  rationale: לְצֵאת എന്ന കാലപരാമർശവും ‘ദേശം’ എന്ന ഘടകവും നിലനിർത്തുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബാത്മക സമൂഹനാമത്തിന് സ്വാഭാവികമായ മലയാളരൂപമാണ് ‘ഇസ്രായേൽമക്കൾ’.
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്മേലുള്ള ശലോമോന്റെ വാഴ്ചയുടെ നാലാം വർഷത്തിൽ
  rationale: രാജവാഴ്ചയെ അടിസ്ഥാനമാക്കിയ കാലനിർണ്ണയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: സീവ് മാസത്തിൽ—അതായത് രണ്ടാം മാസത്തിൽ
  rationale: പുരാതന മാസനാമവും മൂലപാഠത്തിലെ വിശദീകരണവും രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിതു’ എന്നാണ്. സന്ദർഭം നിർമാണാരംഭത്തെ സൂചിപ്പിക്കാമെങ്കിലും ‘പണിയാൻ തുടങ്ങി’ എന്ന ഘടകം ക്രിയയിൽ വ്യക്തമല്ല; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: അക്ഷരാർഥം ‘വീട്/ഭവനം’ ആണെങ്കിലും ഇവിടെ യഹ്‌വേക്കുള്ള വിശുദ്ധമന്ദിരമാണ് വ്യക്തമായ പരാമർശം; ആധുനിക മലയാളത്തിൽ ‘ആലയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ലിപ്യന്തരിച്ചു സംരക്ഷിക്കുകയും לְ എന്ന ബന്ധത്തെ ‘-ക്കായി’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഇവിടെ മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വേ’ അത് ഒരു പൊതുപദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബാത്മക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: ‘മക്കൾ’ എന്നത് മൂലത്തിലെ בְּנֵי എന്ന കുടുംബാത്മക ഭാവം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ മുഴുവൻ ജനസമൂഹത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- issue: וַיִּבֶן നിർമാണത്തിന്റെ ആരംഭമോ സമ്പൂർണ പ്രവൃത്തിയോ
  choice: പണിതു
  alternative: പണിയാൻ തുടങ്ങി
  rationale: ലളിതക്രിയയായ ‘പണിതു’ എന്ന മൂലരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു. കാലനിർണ്ണയസന്ദർഭത്തിൽ നിർമാണാരംഭമാണ് ഉദ്ദേശ്യമെന്ന വായന സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. നീണ്ട എബ്രായ കാലനിർണ്ണയഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ക്രമപ്പെടുത്തി; മൂലത്തിലെ എല്ലാ സമയഘടകങ്ങളും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
