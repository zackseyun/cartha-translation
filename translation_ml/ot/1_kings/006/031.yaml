translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിശുദ്ധമന്ദിരം’ എന്നത് അകത്തെ വിശുദ്ധ അറയെ വ്യക്തമാക്കുന്നു; ‘കട്ടിളക്കാലുകൾ’ വാതിലിന്റെ വശത്തുള്ള തൂണുകൾക്കുള്ള സ്വാഭാവിക വാസ്തുപദമായി ഉപയോഗിച്ചു. എബ്രായത്തിലെ അവസാന പദസമുച്ചയത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
