  text: וְ/אֵת֙ פֶּ֣תַח הַ/דְּבִ֔יר עָשָׂ֖ה דַּלְת֣וֹת עֲצֵי שָׁ֑מֶן הָ/אַ֥יִל מְזוּז֖וֹת חֲמִשִֽׁית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: ml
  text: അകത്തെ വിശുദ്ധമന്ദിരത്തിന്റെ പ്രവേശനത്തിന് ഒലിവുമരംകൊണ്ട് വാതിലുകൾ ഉണ്ടാക്കി; വാതിൽച്ചട്ടവും കട്ടിളക്കാലുകളും അഞ്ചുവശമുള്ളവയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വാതിൽച്ചട്ടവും കട്ടിളക്കാലുകളും അഞ്ചിലൊന്നായിരുന്നു.” ഇത് പരമ്പരാഗതമായ ഒരു വിവർത്തനമാണെങ്കിലും, വാസ്തുവിദ്യാപരമായി അതിന്റെ അർഥം വ്യക്തമല്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: പ്രവേശനം
  rationale: വാതിൽപ്പാളികളെയല്ല, അകത്തേക്കുള്ള തുറവിനെയോ പ്രവേശനസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘വാതിലുകൾ’ എന്നതിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: הַדְּבִיר
  choice: അകത്തെ വിശുദ്ധമന്ദിരം
  rationale: ദേവാലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധ അറയെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സാങ്കേതിക ആരാധനാപദം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: דַּלְתֹות
  choice: വാതിലുകൾ
  rationale: ജോടിയായ വാതിൽപ്പാളികളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עֲצֵי שָׁמֶן
  choice: ഒലിവുമരം
  rationale: അക്ഷരാർഥത്തിൽ ‘എണ്ണമരത്തിന്റെ മരം’; ഈ വാസ്തുസന്ദർഭത്തിൽ ഒലിവുമരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הָאַיִל
  choice: വാതിൽച്ചട്ടം
  rationale: വാസ്തുവിദ്യാപരമായി വാതിലിന്റെ ചട്ടത്തെയോ അതിലെ താങ്ങുഘടകത്തെയോ സൂചിപ്പിക്കാം; അടുത്ത പദമായ കട്ടിളക്കാലുകളിൽനിന്ന് വേർതിരിക്കാൻ വിശാലമായ ‘വാതിൽച്ചട്ടം’ തെരഞ്ഞെടുത്തു.
- source_word: מְזוּזוֹת
  choice: കട്ടിളക്കാലുകൾ
  rationale: വാതിൽത്തുറവിന്റെ ഇരുവശത്തുമുള്ള ലംബമായ കട്ടിളഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: חֲמִשִׁית
  choice: അഞ്ചുവശമുള്ളവയായിരുന്നു
  rationale: എബ്രായപ്രയോഗം അത്യന്തം സംക്ഷിപ്തവും വാസ്തുവിദ്യാപരമായി അവ്യക്തവുമാണ്; സന്ദർഭത്തിൽ രൂപത്തെ സൂചിപ്പിക്കുന്ന സാധ്യതയുള്ള വായന പ്രധാനവാചകത്തിൽ നൽകി, പരമ്പരാഗത അനുപാതവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
