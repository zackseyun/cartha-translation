lexical_decisions:
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: ക്ഷേത്രനിർമാണസന്ദർഭത്തിൽ צפה എന്ന ക്രിയ ഒരു വസ്തുവിന്റെ മേൽ ലോഹത്തിന്റെ പാളി ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ ‘പൊതിഞ്ഞു’ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമാണ്.
- source_word: אֶת
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: אֶת നിശ്ചിത പ്രത്യക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനത ആവശ്യമില്ല.
- source_word: הַכְּרוּבִים
  choice: കെരൂബുകളെ
  rationale: കെരൂബ് എന്ന ബൈബിൾപരമായ രൂപം നിലനിർത്തുകയും, എബ്രായത്തിലെ നിർദിഷ്ട ബഹുവചനത്തെ മലയാളത്തിലെ കർമരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: זָהָב
  choice: പൊന്നുകൊണ്ട്
  rationale: ആവരണത്തിന് ഉപയോഗിച്ച വസ്തുവാണ് זָהָב. ‘പൊന്നുകൊണ്ട്’ എന്ന പ്രയോഗം എബ്രായത്തിലെ വസ്തുസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
