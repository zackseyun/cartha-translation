  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: ml
  text: അവൻ അകത്തെ പ്രാകാരം ചെത്തിയ കല്ലിന്റെ മൂന്നു നിരകളും മുറിച്ചൊരുക്കിയ ദേവദാരുത്തടികളുടെ ഒരു നിരയുംകൊണ്ട് പണിതു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ചെത്തിയ കല്ലിന്റെ മൂന്നു പടവുകളും മുറിച്ചൊരുക്കിയ ദേവദാരുത്തടികളുടെ ഒരു പടവുംകൊണ്ട്.”'
    reason: നിർമാണസന്ദർഭത്തിലെ טוּר എന്ന പദത്തിന് 'നിര' എന്നും കെട്ടിടപ്പണിയിലെ 'പടവ്' എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: അവൻ ... പണിതു
  rationale: വയിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാക്രമം ഉപയോഗിച്ചു.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: അകത്തെ പ്രാകാരം
  rationale: ക്ഷേത്രനിർമാണസന്ദർഭത്തിൽ חָצֵר എന്നത് പ്രാകാരത്തെയും פְּנִימִית അതിന്റെ അകത്തെ സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: മൂന്നു നിരകൾ
  rationale: നിർമാണസന്ദർഭത്തിൽ טוּר കല്ലുകളുടെ നിരയെയോ പടവിനെയോ സൂചിപ്പിക്കാം; സാധാരണ വായനക്കാർക്ക് 'നിര' വ്യക്തമാണ്.
- source_word: גָזִית
  choice: ചെത്തിയ കല്ല്
  rationale: നിർമാണത്തിനായി മുറിച്ചൊരുക്കിയ കല്ലാണ് ഉദ്ദേശ്യം; 'ചെത്തിയ കല്ല്' ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְטוּר
  choice: ഒരു നിര
  rationale: എബ്രായത്തിൽ സംഖ്യാവാചകം പ്രകടമല്ലെങ്കിലും ഏകവചനമായ טוּר, മുമ്പുള്ള മൂന്നു നിരകളോടൊപ്പം മറ്റൊരു ഏക നിരയെ സൂചിപ്പിക്കുന്നു.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: ദേവദാരുത്തടികൾ
  rationale: മുറിച്ചൊരുക്കിയ ദേവദാരുമരക്കഷണങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; നിർമാണസന്ദർഭത്തിൽ 'തടികൾ' അവയുടെ ഉപയോഗം വ്യക്തമായി നൽകുന്നു.
