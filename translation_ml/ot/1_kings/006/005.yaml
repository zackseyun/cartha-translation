    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: അവൻ പണിതു
  rationale: ഹീബ്രു വിവരണശൈലിയിലെ wayyiqtol ക്രിയയെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: עַל קִיר הַבַּיִת
  choice: ആലയത്തിന്റെ ചുവരിനോടു ചേർന്ന്
  rationale: നിർമാണസന്ദർഭത്തിൽ עַל എന്നത് ചുവരിന്റെ മുകളിൽ എന്നതിനെക്കാൾ ചുവരിനോട് ചേർന്നുള്ള നിർമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יצוע
  choice: ഒരു കെട്ടിടഭാഗം
  rationale: അപൂർവമായ ഈ വാസ്തുപദത്തിന്റെ കൃത്യരൂപം അനിശ്ചിതമായതിനാൽ, പാർശ്വമുറികൾ എന്ന് മുൻകൂട്ടി നിർണയിക്കാതെ പൊതുവായ വാസ്തുവിദ്യാർഥം നിലനിർത്തുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും / ചുറ്റി / ചുറ്റുമായി
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപഭേദങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: ആലയത്തിന്റെ ചുവരുകളെ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനമായ ‘ചുവരുകൾ’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לַהֵיכָל
  choice: പ്രധാനമണ്ഡപത്തിന്
  rationale: അന്തർമന്ദിരത്തിൽനിന്ന് വേറിട്ട ആലയത്തിന്റെ പ്രധാന ഹാളിനെയാണ് ഇവിടെ הֵיכָל സൂചിപ്പിക്കുന്നത്.
- source_word: וְלַדְּבִיר
  choice: അന്തർമന്ദിരത്തിന്
  rationale: דְּבִיר എന്നത് ആലയത്തിലെ ഏറ്റവും അകത്തുള്ള വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; പിന്നീട് പ്രചാരത്തിലായ സാങ്കേതിക വിശേഷണം മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ സ്ഥലവ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: പാർശ്വമുറികളും അവൻ ഉണ്ടാക്കി
  rationale: צְלָעוֹת എന്നതിന്റെ അക്ഷരാർഥം ‘വശങ്ങൾ/വാരിയെല്ലുകൾ’ ആകാമെങ്കിലും, ഈ വാസ്തുസന്ദർഭത്തിൽ ആലയത്തോടു ചേർന്ന പാർശ്വമുറികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: דְּבִיר എന്ന ആന്തരിക സ്ഥലത്തിന്റെ നാമകരണം
  choice: അന്തർമന്ദിരം
  alternative: അതിവിശുദ്ധസ്ഥലം
  rationale: മൂലത്തിലെ വാസ്തുപരമായ വേർതിരിവ് വ്യക്തമാക്കുകയും പരിചിതമായ മറ്റൊരു പദപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു; മുഖ്യപാഠം വ്യാഖ്യാനപരമായി അധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാസ്തുവിവരണശൈലി ഉപയോഗിച്ചു. ‘ഘടന’ പോലുള്ള സാങ്കേതികവും അസ്വാഭാവികവുമായ പദം ഒഴിവാക്കി ‘കെട്ടിടഭാഗം’ സ്വീകരിച്ചു; അതേസമയം അപൂർവമായ יצוע എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി. סָבִיב എന്ന പദത്തിന്റെ ആവർത്തന ഊന്നൽ മലയാളത്തിലും സംരക്ഷിച്ചു.
