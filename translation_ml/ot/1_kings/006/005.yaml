  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: ml
  text: അവൻ ആലയത്തിന്റെ ചുവരിനോടു ചേർത്ത്, പ്രധാനമണ്ഡപത്തിന്റെയും[b] അന്തർമന്ദിരത്തിന്റെയും[c] ചുറ്റുമുള്ള ആലയചുവരുകൾക്കു ചുറ്റും, ഒരു കെട്ടിടഭാഗം പണിതു[a]; ചുറ്റും പാർശ്വമുറികളും ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അപൂർവമായ എബ്രായപദം יצוע ഇവിടെ ആലയത്തിന്റെ ചുവരുകളെ ചുറ്റിപ്പണിത ഒരു പുറംകെട്ടിടത്തെയോ ചുറ്റുകെട്ടിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം הֵיכָל, അന്തർമന്ദിരത്തിൽനിന്ന് വേറിട്ട ആലയത്തിന്റെ പ്രധാന ഹാളിനെയാണ് സൂചിപ്പിക്കുന്നത്.
