  revised_text: അവൻ ആലയത്തിന്റെ ചുവരിനോടു ചേർത്ത്, പ്രധാനമണ്ഡപത്തിന്റെയും[b] അന്തർമന്ദിരത്തിന്റെയും[c] ചുറ്റുമുള്ള ആലയചുവരുകൾക്കു ചുറ്റും, ഒരു കെട്ടിടഭാഗം പണിതു[a]; ചുറ്റും പാർശ്വമുറികളും ഉണ്ടാക്കി.
