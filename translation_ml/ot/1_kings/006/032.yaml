  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁתֵּי֮ דַּלְת֣וֹת עֲצֵי שֶׁמֶן֒ וְ/קָלַ֣ע עֲ֠לֵי/הֶם מִקְלְע֨וֹת כְּרוּבִ֧ים וְ/תִמֹר֛וֹת וּ/פְטוּרֵ֥י צִצִּ֖ים וְ/צִפָּ֣ה זָהָ֑ב וַ/יָּ֛רֶד עַל הַ/כְּרוּבִ֥ים וְ/עַל הַ/תִּֽמֹר֖וֹת אֶת הַ/זָּהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: ml
  text: ഒലിവുമരംകൊണ്ടുള്ള രണ്ടു വാതിലുകളിൽ അവൻ കെരൂബുകളുടെയും ഈന്തപ്പനകളുടെയും വിടർന്ന പൂക്കളുടെയും രൂപങ്ങൾ കൊത്തിവെച്ച് അവയെ പൊന്നുകൊണ്ടു പൊതിഞ്ഞു. കെരൂബുകളുടെയും ഈന്തപ്പനകളുടെയും മേൽ അവൻ പൊന്ന് പരത്തിവെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരത്തിവെച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘താഴേക്ക് ഇറക്കി’ എന്നാണ്; കൊത്തിയ രൂപങ്ങളുടെ മേൽ പൊന്ന് പതിപ്പിച്ചതിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: ഒലിവുമരംകൊണ്ടുള്ള രണ്ടു വാതിലുകൾ
  rationale: דַּלְתוֹת എന്നത് ഇവിടെ വാതിലുകളെയോ വാതിൽപ്പാളികളെയോ സൂചിപ്പിക്കുന്നു; עֲצֵי שֶׁמֶן എന്നത് ഒലിവുമരത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പ്രയോഗമാണ്. സന്ദർഭത്തിൽ സ്വാഭാവികമായതിനാൽ ‘വാതിലുകൾ’ എന്നു നൽകി.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: അവയിൽ … രൂപങ്ങൾ കൊത്തിവെച്ച്
  rationale: ക്രിയയും നാമവും ചേർന്ന് മരത്തിൽ അലങ്കാരരൂപങ്ങൾ കൊത്തിയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആവർത്തനഭാരം ഒഴിവാക്കി അർത്ഥം വ്യക്തമായി പകർന്നു.
- source_word: כְּרוּבִים
  choice: കെരൂബുകൾ
  rationale: ദേവാലയചിത്രണത്തിലെ പ്രത്യേക സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ അംഗീകൃത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: תִמֹרוֹת
  choice: ഈന്തപ്പനകൾ
  rationale: ദേവാലയത്തിലെ അലങ്കാരമായി കൊത്തിയ പനമരരൂപങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തമായ ദൃശ്യരൂപം നൽകുന്നു.
- source_word: פְּטוּרֵי צִצִּים
  choice: വിടർന്ന പൂക്കൾ
  rationale: പുഷ്പാകൃതിയിലുള്ള അലങ്കാരത്തെ സൂചിപ്പിക്കുന്നു. സസ്യവർഗം അനാവശ്യമായി നിർണയിക്കാതെ വിരിഞ്ഞ പുഷ്പരൂപം പകർന്നു.
- source_word: וְצִפָּה זָהָב
  choice: അവയെ പൊന്നുകൊണ്ടു പൊതിഞ്ഞു
  rationale: മരപ്പണിയുടെ ഉപരിതലത്തിൽ സ്വർണം ആവരണമായി പതിപ്പിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: പൊന്ന് പരത്തിവെച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘താഴേക്ക് ഇറക്കി’ എന്ന ദൃശ്യഭാവമുള്ള അപൂർവ പ്രയോഗമാണിത്; ഇവിടെ കൊത്തുരൂപങ്ങളുടെ മേൽ പൊന്ന് പതിപ്പിച്ചു പരത്തിയതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ദൃശ്യഭാവം പൂർണമായി അപ്രത്യക്ഷമാക്കാതെ പ്രസക്തമായ അർത്ഥം നൽകി.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: കെരൂബുകളുടെയും ഈന്തപ്പനകളുടെയും മേൽ
  rationale: ആവർത്തിച്ച עַל സ്വർണം പതിപ്പിച്ച പ്രത്യേക കൊത്തുരൂപങ്ങളെ ഊന്നുന്നു; ‘മേൽ’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
