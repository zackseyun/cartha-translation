translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ദേവാലയനിർമാണ വിവരണത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിന്റെ കൂട്ടിയിണക്കിയ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; അലങ്കാരരൂപങ്ങളുടെ പട്ടികയും സ്വർണാവരണത്തിന്റെ ആവർത്തിച്ച ഊന്നലും നിലനിർത്തി.
