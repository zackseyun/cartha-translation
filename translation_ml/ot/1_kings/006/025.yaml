translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾ പദമായ ‘കെരൂബ്’ നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഉയരം’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
