id: 1KI.6.25
reference: 1 Kings 6:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עֶ֨שֶׂר֙ בָּֽ/אַמָּ֔ה הַ/כְּר֖וּב הַ/שֵּׁנִ֑י מִדָּ֥ה אַחַ֛ת וְ/קֶ֥צֶב אֶחָ֖ד לִ/שְׁנֵ֥י הַ/כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: ml
  text: രണ്ടാമത്തെ കെരൂബും പത്തു മുഴം[a] ആയിരുന്നു; രണ്ടു കെരൂബുകൾക്കും ഒരേ അളവും ഒരേ രൂപവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ടു കെരൂബുകളും ഒരേ അളവും അനുപാതവും ഉള്ളവയായിരുന്നു.’
    reason: ‘അളവ്’, ‘രൂപം/അനുപാതം’ എന്നീ പദങ്ങളുടെ കൂട്ടപ്രയോഗം രണ്ടു കെരൂബുകളുടെ സമാനമായ വലിപ്പവും ഘടനയും സൂചിപ്പിക്കുന്നതിനാൽ ഈ പകരവായന നൽകി.
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: പത്തു മുഴം ആയിരുന്നു
  rationale: എബ്രായപാഠം അളവ് മാത്രം വ്യക്തമാക്കുന്നു; ‘ഉയരം’ എന്ന് പ്രത്യേകം പറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിൽനിന്ന് ഉയരം ചേർക്കാതെ നിഷ്പക്ഷമായ അളവുപ്രയോഗം നിലനിർത്തി.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കെരൂബ്
  rationale: നിശ്ചിത ഏകവചന നാമവും ക്രമസംഖ്യയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִדָּה אַחַת
  choice: ഒരേ അളവ്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു അളവ്’ എന്നാണെങ്കിലും, രണ്ടു കെരൂബുകൾക്കും അളവ് തുല്യമായിരുന്നു എന്ന താരതമ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഒരേ അളവ്’ എന്നു വ്യക്തമാക്കി.
- source_word: וְקֶצֶב אֶחָד
  choice: ഒരേ രൂപം
  rationale: קֶצֶב ഇവിടെ രൂപം, ആകൃതി, അനുപാതം എന്നിവയെ സൂചിപ്പിക്കാം. വിശാലവും സ്വാഭാവികവുമായ ‘രൂപം’ തിരഞ്ഞെടുത്തു; പദത്തിന്റെ സാധ്യതയുള്ള അനുപാതാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: രണ്ടു കെരൂബുകൾക്കും
  rationale: ‘രണ്ടു കെരൂബുകൾക്കായി’ എന്ന എബ്രായ ഘടനയെ മലയാളത്തിൽ ഉടമസ്ഥത/ബാധകത വ്യക്തമാക്കുന്ന സ്വാഭാവിക ദത്തിവിഭക്തിയായി നൽകി.
