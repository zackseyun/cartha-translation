translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ക്ഷേത്രനിർമാണസന്ദർഭം വ്യക്തമാക്കാൻ ‘വീട്’ എന്ന അക്ഷരാർഥത്തിനു പകരം ‘ആലയം’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ടു സമാന്തര നിർമാണപദങ്ങളുടെ വ്യത്യാസം ‘വിശദാംശങ്ങൾ’ എന്നും ‘നിശ്ചയിച്ചിരുന്ന രൂപരേഖ’ എന്നും നിലനിർത്തി.
