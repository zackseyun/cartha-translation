id: 1KI.6.37
reference: 1 Kings 6:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: ml
  text: നാലാം വർഷത്തിൽ, സീവ് മാസത്തിൽ, യാഹ്‌വേയുടെ ആലയത്തിന് അടിത്തറയിടപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയുടെ ആലയം സ്ഥാപിക്കപ്പെട്ടു.”
    reason: יסד എന്ന എബ്രായക്രിയയ്ക്ക് ഈ നിർമാണസന്ദർഭത്തിൽ ‘അടിത്തറയിടുക’ എന്നും ‘സ്ഥാപിക്കുക’ എന്നും അർഥമാകാം; പദപ്രയോഗത്തിലെ ആ സാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: നാലാം വർഷത്തിൽ
  rationale: എബ്രായപാഠത്തിലെ കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് ശലോമോന്റെ ഭരണവർഷമാണെങ്കിലും, ഈ വാക്യത്തിൽ ആ വിവരം ആവർത്തിക്കാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: יֻסַּד
  choice: അടിത്തറയിടപ്പെട്ടു
  rationale: יסד എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം ഒരു കെട്ടിടത്തിന്റെ അടിത്തറയിടുകയോ അതിനെ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിർമാണസന്ദർഭത്തിൽ ‘അടിത്തറയിടപ്പെട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ഭവനം’ ആണെങ്കിലും, ഇവിടെ അത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളവായനക്കാർക്ക് സന്ദർഭം വ്യക്തമായി ലഭിക്കാൻ ‘ആലയം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരി നാമത്തെ വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּיֶרַח זִו
  choice: സീവ് മാസത്തിൽ
  rationale: יֶרַח എന്നത് ‘മാസം’ എന്നും זִו മാസത്തിന്റെ പേരുമാണ്. ഈ വാക്യത്തിൽ പറയാത്ത ‘രണ്ടാം മാസം’ എന്ന വിവരം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പൊതുവായ സ്ഥാനനാമംകൊണ്ട് പകരാതെ ഉടമ്പടിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: בֵּית יְהוָה എന്ന പ്രയോഗത്തിലെ രൂപകം
  choice: യഹോവയുടെ ആലയം
  alternative: യഹോവയുടെ ഭവനം
  rationale: ‘ഭവനം’ മൂലപദത്തിന്റെ രൂപകം കൂടുതൽ അക്ഷരാർഥത്തിൽ സൂക്ഷിക്കുമെങ്കിലും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദേവാലയമാണെന്ന് ‘ആലയം’ വ്യക്തമായി അറിയിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ഇതിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സീവ്’ എന്ന പുരാതന മാസനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ശലോമോന്റെ ഭരണകാലം’ അല്ലെങ്കിൽ ‘രണ്ടാം മാസം’ എന്നീ വിശദീകരണങ്ങൾ ചേർത്തിട്ടില്ല.
