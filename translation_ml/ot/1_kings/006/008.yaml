id: 1KI.6.8
reference: 1 Kings 6:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פֶּ֗תַח הַ/צֵּלָע֙ הַ/תִּ֣יכֹנָ֔ה אֶל כֶּ֥תֶף הַ/בַּ֖יִת הַ/יְמָנִ֑ית וּ/בְ/לוּלִּ֗ים יַֽעֲלוּ֙ עַל הַ/תִּ֣יכֹנָ֔ה וּ/מִן הַ/תִּֽיכֹנָ֖ה אֶל הַ/שְּׁלִשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: ml
  text: നടുവിലത്തെ പാർശ്വമുറിയിലേക്കുള്ള പ്രവേശനവാതിൽ ആലയത്തിന്റെ വലതുവശത്തായിരുന്നു. ചുറ്റിപ്പോകുന്ന പടവുകളിലൂടെ[a] ആളുകൾ നടുവിലത്തെ നിലയിലേക്കു കയറി; നടുവിലത്തെ നിലയിൽനിന്ന് മൂന്നാമത്തെ നിലയിലേക്കും കയറി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ചുഴിപ്പടവുകളിലൂടെ.” എബ്രായപദം വളഞ്ഞോ ചുറ്റിപ്പോകുന്നതോ ആയ പടവുകളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നടുവിലത്തേതിൽനിന്ന് മൂന്നാമത്തേതിലേക്ക്”; ഇവിടെ നടുവിലത്തെ നിലയിൽനിന്ന് മൂന്നാമത്തെ നിലയിലേക്കെന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: പ്രവേശനവാതിൽ
  rationale: പ്രവേശിക്കാനുള്ള തുറവിനെയോ വാതിലിനെയോ സൂചിപ്പിക്കുന്നു; വാസ്തുവിവരണത്തിൽ ‘പ്രവേശനവാതിൽ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: നടുവിലത്തെ പാർശ്വമുറി
  rationale: ആലയനിർമാണസന്ദർഭത്തിൽ צֵלָע പാർശ്വമുറിയെയോ പാർശ്വഘടനയെയോ സൂചിപ്പിക്കുന്നു; ഏകവചനവും ‘നടുവിലത്തെ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: ആലയത്തിന്റെ വലതുവശത്ത്
  rationale: כֶּתֶף എന്നതിന്റെ അക്ഷരാർഥം ‘തോൾ’ ആണെങ്കിലും ഇവിടെ കെട്ടിടത്തിന്റെ വശമാണ്; יְמָנִית എന്ന സ്ഥലസൂചനയെ വ്യാഖ്യാനിച്ച് ‘തെക്ക്’ എന്നാക്കാതെ ‘വലത്’ എന്നു നിലനിർത്തുന്നു.
- source_word: וּבְלוּלִּים
  choice: ചുറ്റിപ്പോകുന്ന പടവുകളിലൂടെ
  rationale: അപൂർവമായ ഈ പദം വളഞ്ഞോ ചുറ്റിപ്പോകുന്നതോ ആയ പടവുകളെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കുന്നു; പദത്തിന്റെ സാധ്യതാപരമായ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַעֲלוּ
  choice: ആളുകൾ ... കയറി
  rationale: മൂന്നാംപുരുഷ ബഹുവചനക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിത കർത്താവോടുകൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: עַל הַתִּיכֹנָה
  choice: നടുവിലത്തെ നിലയിലേക്ക്
  rationale: മൂന്ന് നിലകളുടെ ക്രമമാണ് സന്ദർഭം; അതിനാൽ ‘മുറി’ എന്നതിനെക്കാൾ ‘നില’ ഇവിടെ വാസ്തുപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: നടുവിലത്തെ നിലയിൽനിന്ന് മൂന്നാമത്തെ നിലയിലേക്ക്
  rationale: എബ്രായത്തിലെ ‘നടുവിലത്തേതിൽനിന്ന് മൂന്നാമത്തേതിലേക്ക്’ എന്ന സംക്ഷിപ്ത പ്രയോഗം മലയാളവായനക്കാർക്കായി സൂചിതമായ ‘നില’ ചേർത്ത് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാസ്തുവിവരണശൈലി ഉപയോഗിച്ചു. ‘ആലയം’ എന്നത് പ്രസക്തമായ ദൈവാലയത്തെ സൂചിപ്പിക്കുന്നു. അപൂർവമായ וּבְלוּלִּים എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അതിരുകടന്ന് നിർണയിക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
