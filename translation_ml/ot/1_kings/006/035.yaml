  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: ml
  text: അവൻ കെരൂബുകളെയും ഈന്തപ്പനകളെയും വിരിഞ്ഞ പൂക്കളെയും കൊത്തിവെച്ചു; കൊത്തുപണിക്കു മീതെ ഒതുക്കിച്ചേർത്ത് അവയെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: രൂപങ്ങൾ കൊത്തിവെച്ചു
  rationale: വാതിലുകളിൽ അലങ്കാരരൂപങ്ങൾ കൊത്തിയുണ്ടാക്കുന്നതാണ് സന്ദർഭം; മലയാളത്തിൽ സ്വാഭാവികമായി പ്രവർത്തിയും ഫലവും വ്യക്തമാക്കുന്നു.
- source_word: כְרוּבִים
  choice: കെരൂബുകൾ
  rationale: തിരുവെഴുത്തിലെ പ്രത്യേക സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന പദം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: תִמֹרוֹת
  choice: ഈന്തപ്പനകൾ
  rationale: ഈന്തപ്പനയുടെ അലങ്കാരരൂപങ്ങളെയാണ് ഹീബ്രു പദം സൂചിപ്പിക്കുന്നത്.
- source_word: פְטֻרֵי צִצִּים
  choice: വിടർന്ന പൂക്കൾ
  rationale: പൂക്കളുടെ തുറന്നതോ വിടർന്നതോ ആയ അലങ്കാരരൂപങ്ങൾ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: കൊത്തുപണിക്കുമേൽ പാകമായി ചേർന്നുനിൽക്കത്തക്കവിധം
  rationale: സ്വർണം കൊത്തിയ രൂപങ്ങളുടെ ഉപരിതലത്തോട് ഒത്തുചേർത്ത് പതിപ്പിച്ചതെന്ന ആശയം നൽകുന്നു; അപൂർവമായ രൂപത്തിന്റെ കൃത്യന്യൂവാൻസിൽ അനിശ്ചിതത്വമുള്ളതിനാൽ അതിരുകടന്ന സാങ്കേതിക വിശദീകരണം ഒഴിവാക്കുന്നു.
