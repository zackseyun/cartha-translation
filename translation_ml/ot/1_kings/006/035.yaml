translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ക്ഷേത്രാലങ്കാരത്തിന്റെ സാങ്കേതിക വിവരണം സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു; മൂലത്തിലെ അർഥപരമായ അനിശ്ചിതത്വം അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
