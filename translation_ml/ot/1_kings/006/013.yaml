id: 1KI.6.13
reference: 1 Kings 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: ml
  text: ഞാൻ ഇസ്രായേൽമക്കളുടെ മധ്യേ വസിക്കും[a]; എന്റെ ജനമായ ഇസ്രായേലിനെ ഞാൻ ഉപേക്ഷിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെ ഇടയിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കളുടെ മധ്യേ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: ഞാൻ ... വസിക്കും
  rationale: שׁכן ദൈവം തന്റെ ജനത്തിന്റെ മധ്യേ സന്നിഹിതനായി പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വസിക്കും’ എന്നത് അതിന്റെ ഉടമ്പടിപരമായ അർഥഗൗരവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ
  choice: മധ്യേ
  rationale: ഒരു ജനസമൂഹത്തിനുള്ളിലെ സാന്നിധ്യമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘മധ്യേ’ എന്നത് എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ.’ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരമ്പരാഗത ജനനാമം സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന മുഴുവൻ ഉടമ്പടിജനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְלֹא אֶעֱזֹב
  choice: ഞാൻ ഉപേക്ഷിക്കുകയുമില്ല
  rationale: עזב ഇവിടെ വെറുതെ വിട്ടുപോകുക എന്നതിലുപരി ബന്ധപരമായും ഉടമ്പടിപരമായും കൈവിടുക എന്ന ആശയം വഹിക്കുന്നു. ‘ഉപേക്ഷിക്കുക’ ആ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: עַמִּי
  choice: എന്റെ ജനം
  rationale: ഉടമ്പടിബന്ധത്തെ വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള ഉടമസ്ഥപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തിനാമവും ജനനാമവും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions:
- issue: ദൈവം വസിക്കുന്നു എന്ന ഭാഷയും ദേവാലയസന്ദർഭവും
  choice: ‘ഇസ്രായേൽമക്കളുടെ മധ്യേ വസിക്കും’
  alternative: ‘ഇസ്രായേല്യരുടെ ഇടയിൽ പാർക്കും’
  rationale: വാക്യം ദേവാലയവുമായി ബന്ധപ്പെട്ട് ദൈവത്തിന്റെ ഉടമ്പടിസാന്നിധ്യം വാഗ്ദാനം ചെയ്യുന്നുവെങ്കിലും ദൈവത്തെ ദേവാലയത്തിനുള്ളിൽ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല. വിവർത്തനം ഈ അർഥസംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇസ്രായേൽമക്കൾ,’ ‘വസിക്കും,’ ‘ഉപേക്ഷിക്കുക’ എന്നീ പദങ്ങൾ മൂലഭാഷയുടെ ഉടമ്പടിപരമായ ഭാവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
