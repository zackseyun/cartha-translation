id: 1KI.6.11
reference: 1 Kings 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁלֹמֹ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/011.yaml
  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: ml
  text: 'യാഹ്‌വേയുടെ വചനം ശലോമോനോടു വന്നു; ഇപ്രകാരം:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ലഭിച്ചു
  rationale: ഇവിടെ היה-യുടെ വാവ്-തുടർച്ചാരൂപം ആഖ്യാനത്തിന്റെ സ്വാഭാവിക പുരോഗതിയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംഭവിച്ചു’ എന്ന പദാനുപദരൂപം ഒഴിവാക്കി, ദൈവിക അരുളപ്പാട് ഒരാളിലേക്കു വന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ലഭിച്ചു’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: דְּבַר
  choice: അരുളപ്പാട്
  rationale: דְּבַר יְהוָה എന്ന സ്ഥിരപ്രയോഗത്തിൽ ഇത് ദൈവത്തിൽനിന്നുള്ള വചനസന്ദേശത്തെ സൂചിപ്പിക്കുന്നു. ആ അർഥവും ഗൗരവവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകാൻ ‘അരുളപ്പാട്’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: ശലോമോനു
  rationale: സ്വീകർത്താവിനെ അടയാളപ്പെടുത്തുന്ന אֶל എന്ന പൂർവപ്രത്യയത്തിന്റെ അർഥം മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-നു’ വഴി സ്വാഭാവികമായി നൽകി.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള ദൈവവചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രസ്താവനാസൂചകമാണ്. മലയാളത്തിൽ ‘ഇപ്രകാരം’ ചേർക്കാതെ ദ്വിബിന്ദു ഉപയോഗിക്കുന്നത് അതിന്റെ പ്രവർത്തനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് ഉപയോഗിച്ചില്ല. മലയാള വായനക്കാർക്കു വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ പ്രധാനപാഠത്തിൽ നൽകി; ഉച്ചാരണത്തെ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന ‘യാഹ്‌വേ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: לֵאמֹר എന്നതിന്റെ പ്രകടനം
  choice: ദ്വിബിന്ദു
  alternative: ഇപ്രകാരം അരുളിച്ചെയ്തു
  rationale: ഈ ക്രിയാരൂപം അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ദ്വിബിന്ദു അതേ ബന്ധം കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘അരുളിച്ചെയ്തു’ ചേർത്താൽ മൂലത്തിലെ ലളിതമായ ‘പറഞ്ഞുകൊണ്ട്/പറയാൻ’ എന്നതിനേക്കാൾ വ്യാഖ്യാനപരമാകും.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളം. ആവർത്തിച്ചുവരുന്ന പ്രവാചകസൂത്രത്തിന്റെ ദൈവിക ആശയവിനിമയസ്വഭാവം ‘അരുളപ്പാട്’ വഴി നിലനിർത്തി; അടുത്ത വാക്യവുമായി ഉള്ള വ്യാകരണബന്ധം ദ്വിബിന്ദുവിലൂടെ പ്രകടമാക്കി.
