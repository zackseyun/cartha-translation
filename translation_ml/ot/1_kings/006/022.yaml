  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: ml
  text: ആലയം മുഴുവനും പൂർത്തിയാകുന്നതുവരെ അവൻ ആലയം മുഴുവൻ സ്വർണംകൊണ്ടു പൊതിഞ്ഞു. അകത്തെ വിശുദ്ധമന്ദിരത്തോടു ബന്ധപ്പെട്ട യാഗപീഠം മുഴുവനും അവൻ സ്വർണംകൊണ്ടു പൊതിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അകത്തെ വിശുദ്ധമന്ദിരത്തിലുള്ള യാഗപീഠം” അല്ലെങ്കിൽ “അകത്തെ വിശുദ്ധമന്ദിരത്തിനുള്ള യാഗപീഠം.” എബ്രായപ്രയോഗം യാഗപീഠത്തിന്റെ ബന്ധമോ സ്ഥാനമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘വീട്’ എന്നാണെങ്കിലും, ഇവിടെ ശലോമോൻ പണിത യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘ആലയം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: צִפָּה
  choice: പൊതിഞ്ഞു
  rationale: ഒരു പ്രതലത്തിനുമേൽ സ്വർണം ആവരണമായി പതിപ്പിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: ആലയം മുഴുവനും പൂർത്തിയാകുന്നതുവരെ
  rationale: പൂർത്തീകരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ക്രിയാത്മകമായി മലയാളത്തിലാക്കി; മൂലത്തിലെ ‘മുഴുവൻ ആലയം’ എന്ന ആവർത്തനവും നിലനിർത്തി.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: മִזְבֵּחַ എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ പ്രചാരത്തിലുള്ള വ്യക്തമായ മലയാളരൂപം.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: അകത്തെ വിശുദ്ധമന്ദിരത്തോടു ബന്ധപ്പെട്ട
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന് ഉടമസ്ഥതയോ സ്ഥാനബന്ധമോ സൂചിപ്പിക്കാം. കൃത്യമായ സ്ഥാനം നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ മൂലത്തിലെ ബന്ധപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: דְּבִיר
  choice: അകത്തെ വിശുദ്ധമന്ദിരം
  rationale: ദേവാലയത്തിലെ ഏറ്റവും അകത്തുള്ള വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപം; ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന പരമ്പരാഗത വ്യാഖ്യാനപരമായ നാമം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: യാഗപീഠവും അകത്തെ വിശുദ്ധമന്ദിരവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അകത്തെ വിശുദ്ധമന്ദിരത്തോടു ബന്ധപ്പെട്ട’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: ‘അകത്തെ വിശുദ്ധമന്ദിരത്തിലുള്ള’ അല്ലെങ്കിൽ ‘അകത്തെ വിശുദ്ധമന്ദിരത്തിനുമുമ്പിലുള്ള’
  rationale: എബ്രായത്തിലെ לַדְּבִיר ബന്ധമോ നിയോഗമോ സ്ഥാനമോ സൂചിപ്പിക്കാവുന്നതിനാൽ, യാഗപീഠത്തിന്റെ കൃത്യമായ സ്ഥാനം വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കാതെ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനം ആശയത്തിലെ സമഗ്രത ഊന്നിപ്പറയുന്നതിനാൽ ഭാഗികമായി നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ഉള്ളടക്കവും തമ്മിലുള്ള പൊരുത്തക്കേട് പിന്തുടരാതെ, അടിക്കുറിപ്പ് പ്രസക്തമായ സ്ഥാനത്ത് ചേർത്തു.
