id: 1KI.6.24
reference: 1 Kings 6:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָמֵ֣שׁ אַמּ֗וֹת כְּנַ֤ף הַ/כְּרוּב֙ הָֽ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת כְּנַ֥ף הַ/כְּר֖וּב הַ/שֵּׁנִ֑ית עֶ֣שֶׂר אַמּ֔וֹת מִ/קְצ֥וֹת כְּנָפָ֖י/ו וְ/עַד קְצ֥וֹת כְּנָפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: ml
  text: കെരൂബിന്റെ ഒരു ചിറകിന് അഞ്ചു മുഴവും രണ്ടാമത്തെ ചിറകിന് അഞ്ചു മുഴവും ഉണ്ടായിരുന്നു; അതിന്റെ ഒരു ചിറകിന്റെ അറ്റംമുതൽ മറ്റേ ചിറകിന്റെ അറ്റംവരെ പത്തു മുഴമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അതിന്റെ ചിറകുകളുടെ അറ്റംമുതൽ ചിറകുകളുടെ അറ്റംവരെ”; അതായത്, ഒരു ചിറകിന്റെ അറ്റംമുതൽ മറ്റേ ചിറകിന്റെ അറ്റംവരെയുള്ള പൂർണ വീതി.
    reason: ഉറവിടത്തിലെ ആവർത്തനഘടനയും അറ്റംമുതൽ അറ്റംവരെയുള്ള അളവാണെന്ന അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: അഞ്ചു മുഴം
  rationale: ക്ഷേത്രനിർമാണത്തിന്റെ അളവുകൾ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ אַמָּה എന്ന പുരാതന നീളയളവിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ തുല്യപദമാണ് ‘മുഴം’.
- source_word: כְּנַף
  choice: ചിറക്
  rationale: കെരൂബിന്റെ രൂപത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ഈ പദം അറ്റം എന്ന പൊതുവായ അർഥത്തിലല്ല, ചിറകിനെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: הַכְּרוּב
  choice: കെരൂബ്
  rationale: കൊത്തിയുണ്ടാക്കിയ സ്വർഗീയ ജീവരൂപങ്ങളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്ന ഏകവചന നാമം; ഉറവിടപദത്തിന്റെ പരമ്പരാഗത മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: הָאֶחָת
  choice: ഒരു
  rationale: എബ്രായപാഠം ‘ഒന്നാമത്തെ’ എന്ന് വ്യക്തമാക്കാതെ ‘ഒരു’ എന്നു പറയുന്നു; അതിനാൽ ആ സൂക്ഷ്മത സംരക്ഷിച്ചു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: ‘ചിറക്’ എന്നതോടു ചേർന്ന ക്രമസംഖ്യയെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: עֶשֶׂר אַמּוֹת
  choice: പത്തു മുഴം
  rationale: രണ്ടു ചിറകുകളുടെയും ആകെ വീതിയെ സൂചിപ്പിക്കുന്ന അളവ് നേരിട്ട് നൽകുന്നു.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: ഒരു ... അറ്റംമുതൽ മറ്റേ ... അറ്റംവരെ
  rationale: ഒരു അഗ്രത്തിൽനിന്ന് മറുവശത്തെ അഗ്രംവരെയുള്ള പൂർണ വ്യാപ്തിയാണ് വാക്യം അളക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രീതിയിൽ അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: כְּנָפָיו
  choice: അതിന്റെ ... ചിറക്
  rationale: എബ്രായത്തിലെ പുരുഷ ഏകവചന പ്രത്യയം കെരൂബിനെ സൂചിപ്പിക്കുന്നു; കൊത്തിയ രൂപത്തെ അനാവശ്യമായി പുരുഷലിംഗ വ്യക്തിയായി അവതരിപ്പിക്കാതിരിക്കാൻ മലയാളത്തിലെ നപുംസകസൂചന ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. അളവുപദമായി വായനക്കാർക്ക് പരിചിതമായ ‘മുഴം’ നിലനിർത്തി; ഉറവിടത്തിലെ ‘ഒരു/രണ്ടാമത്തെ’ എന്ന വ്യത്യാസവും സംരക്ഷിച്ചു.
