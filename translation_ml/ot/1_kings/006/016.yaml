  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: ml
  text: ആലയത്തിന്റെ പിൻഭാഗത്തായി ഇരുപതു മുഴം ഭാഗം ദേവദാരുപലകകൾകൊണ്ട്, തറമുതൽ ചുവരുകൾവരെ[a], അവൻ പണിതു. ആലയത്തിനുള്ളിൽ അതിനെ അന്തർമന്ദിരമായി[b]—അതിവിശുദ്ധസ്ഥലമായി[c]—പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തറമുതൽ ഉത്തരങ്ങൾ/മേൽക്കൂരത്തണ്ടുകൾവരെ.’ ഹീബ്രു പാഠത്തിൽ ‘ചുവരുകൾവരെ’ എന്നാണ്; അതാണ് ഇവിടെ നിലനിർത്തിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: 'ഹീബ്രു: ദെബീർ; ദേവാലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധമുറി.'
    reason: cultural_note
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘വിശുദ്ധസ്ഥലങ്ങളുടെ വിശുദ്ധസ്ഥലം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: ആലയത്തിന്റെ പിൻഭാഗത്തുള്ള
  rationale: ഈ പ്രയോഗം കെട്ടിടത്തിന്റെ അകന്ന അഥവാ പിൻഭാഗത്തെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ആലയം’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: ദേവദാരുപ്പലകകൾകൊണ്ട്
  rationale: צֵלָעוֹת എന്നതിന് വാരിയെല്ലുകൾ, പാർശ്വഘടകങ്ങൾ, പലകകൾ തുടങ്ങിയ അർഥങ്ങൾ വരാം. ഇവിടെ അകത്തെ മുറി വേർതിരിച്ചു പണിയുന്ന നിർമാണസന്ദർഭമായതിനാൽ ‘പലകകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: തറമുതൽ ചുവരുകൾവരെ
  rationale: മസോററ്റിക് പാഠത്തിൽ ‘ചുവരുകൾവരെ’ എന്നാണ്. വാസ്തുവിദ്യാപരമായി പ്രയോഗം ദുഷ്കരമാണെങ്കിലും മൂലപാഠം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി, ‘ഉത്തരങ്ങൾ/മേൽക്കൂരത്തണ്ടുകൾവരെ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: ആലയത്തിനുള്ളിൽ അതിനെ ... പണിതു
  rationale: ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമാണ്; ആലയത്തിനകത്ത് ഒരു പ്രത്യേക അന്തർഭാഗം നിർമിച്ചതാണ് സന്ദർഭാർഥം. മലയാളത്തിൽ കർമ്മവും സ്ഥാനവും വ്യക്തമാക്കിയാണ് നൽകിയിരിക്കുന്നത്.
- source_word: לִדְבִיר
  choice: അന്തർമന്ദിരമായി
  rationale: דְּבִיר ദേവാലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധമുറിക്കുള്ള സാങ്കേതിക പദമാണ്. അപരിചിതമായ ലിപ്യന്തരണത്തിനു പകരം അതിന്റെ പ്രവർത്തനവും സ്ഥാനവും വ്യക്തമാക്കുന്നു.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥലമായി
  rationale: ഹീബ്രുവിലെ ഈ അതിശയോക്തിരൂപം ഏറ്റവും വിശുദ്ധമായ അകത്തെ മുറിയെ സൂചിപ്പിക്കുന്നു. ‘അതിവിശുദ്ധസ്ഥലം’ ആ ആരാധനാപരമായ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന അളവായ ക്യൂബിറ്റിന് മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ഉപയോഗത്തിലും പരിചിതമായ തത്തുല്യപദം ‘മുഴം’ ആണ്; ആധുനിക അളവിലേക്കുള്ള അനാവശ്യ പരിവർത്തനം ഒഴിവാക്കുന്നു.
