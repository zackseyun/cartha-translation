  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. ‘വീട്’ എന്ന പദത്തിനു പകരം ഈ ദേവാലയസന്ദർഭത്തിൽ ‘ആലയം’ തിരഞ്ഞെടുത്തു. വാസ്തുവിദ്യാപരമായി ദുഷ്കരമായ ‘ചുവരുകൾവരെ’ എന്ന മസോററ്റിക് വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും വ്യത്യസ്ത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
