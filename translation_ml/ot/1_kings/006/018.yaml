source:
  edition: WLC
  text: וְ/אֶ֤רֶז אֶל הַ/בַּ֨יִת֙ פְּנִ֔ימָה מִקְלַ֣עַת פְּקָעִ֔ים וּ/פְטוּרֵ֖י צִצִּ֑ים הַ/כֹּ֣ל אֶ֔רֶז אֵ֥ין אֶ֖בֶן נִרְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: ml
  text: ആലയത്തിന്റെ ഉൾവശത്തെ ദേവദാരുപാളികളിൽ ചുരയ്ക്കയുടെ ആകൃതികളും[a] വിരിഞ്ഞ പൂക്കളും[b] കൊത്തിയിരുന്നു. എല്ലാം ദേവദാരുവായിരുന്നു; ഒരു കല്ലും കാണപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചുരയ്ക്കയുടെ ആകൃതികൾ” എന്നതിന് “മുകുളങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം വൃത്താകാരമായ അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു; ഈ ആലയസന്ദർഭത്തിൽ അവ ചുരയ്ക്കയുടെ ആകൃതിയിലുള്ള കൊത്തുപണികളായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിരിഞ്ഞ പൂക്കൾ” എന്നതിന് “പുഷ്പവിരിയലുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം കൊത്തിയ പുഷ്പവികാസരൂപങ്ങളെയാണു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: ദേവദാരം / ദേവദാരുപ്പലകകൾ
  rationale: ഇവിടെ ഈ നാമം ആലയത്തിന്റെ ഉൾവശം പൊതിഞ്ഞ ദേവദാരുമരത്തെയും അതിന്റെ പലകപ്പണിയെയും സൂചിപ്പിക്കുന്നു. ആദ്യവാക്യത്തിൽ 'ദേവദാരുപ്പലകകൾ' എന്നത് ഉപരിതലത്തിലെ കൊത്തുപണി വ്യക്തമാക്കുന്നു; തുടർവാക്യത്തിൽ 'ദേവദാരം' വസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: ആലയത്തിന്റെ ഉൾവശത്തെ
  rationale: ദേവദാരു ആലയത്തിനകത്ത് വെറുതെ ഉണ്ടായിരുന്നുവെന്നതിലുപരി, ഉൾവശത്തെ ആവരണമായിരുന്നുവെന്ന സ്ഥാനാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִקְלַעַת
  choice: കൊത്തിയിരുന്നു
  rationale: വാസ്തുവിദ്യാപരമായ അലങ്കാരക്കൊത്തുപണിയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ലളിതവും കൃത്യവുമായ പ്രയോഗം.
- source_word: פְּקָעִים
  choice: കായുടെ ആകൃതികൾ
  rationale: വൃത്താകാരമായ, സാധ്യതയോടെ കായപോലുള്ള അലങ്കാരരൂപങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ഏതൊരു പ്രത്യേക സസ്യത്തിന്റെ പേരും അനാവശ്യമായി ഉറപ്പിക്കാതെ ദൃശ്യരൂപം പകരുന്നു.
- source_word: וּפְטוּרֵי צִצִּים
  choice: വിടർന്ന പൂക്കൾ
  rationale: കൊത്തിയ പുഷ്പവികാസരൂപങ്ങളെയാണ് ഈ അപൂർവ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. 'വിടർന്ന' എന്നത് പൂത്തതോ തുറന്നതോ ആയ രൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: הַכֹּל אֶרֶז
  choice: എല്ലായിടവും ദേവദാരുകൊണ്ട് മൂടിയിരുന്നതിനാൽ
  rationale: കാണാവുന്ന ഉൾപ്രതലം മുഴുവൻ ദേവദാരു പൊതിഞ്ഞിരുന്നുവെന്ന സന്ദർഭാർഥം പകരുകയും പിന്നാലെയുള്ള 'കല്ല് കാണാനില്ല' എന്ന പ്രസ്താവനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: ഒരു കല്ലുപോലും കാണാനില്ലായിരുന്നു
  rationale: മൂലത്തിലെ ദൃശ്യതയില്ലായ്മ ഊന്നിപ്പറയുന്ന സ്വാഭാവിക മലയാളരൂപം; കല്ലുകൊണ്ടുള്ള ഘടന ദേവദാരുകൊണ്ട് മറഞ്ഞിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
