translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. അലങ്കാരപ്പണിയുടെ സാങ്കേതികത അതിരുകടന്ന് നിർവചിക്കാതെ, മൂലത്തിലെ സ്ഥലപരമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
