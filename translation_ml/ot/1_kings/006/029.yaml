  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: ml
  text: മന്ദിരത്തിന്റെ[a] എല്ലാ ചുവരുകളിലും, അകത്തും പുറത്തും[c], കെരൂബുകളുടെയും ഈന്തപ്പനകളുടെയും വിടർന്ന പൂക്കളുടെയും[b] രൂപങ്ങൾ അവൻ കൊത്തിവെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘വീടിന്റെ’; ഇവിടെ ദൈവാലയമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘പൂമൊട്ടുകൾ’ അല്ലെങ്കിൽ ‘വിരിയുന്ന പൂക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗം പുഷ്പാലങ്കാരങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അവയുടെ കൃത്യമായ കലാരൂപം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഈ അവസാന പ്രയോഗം വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തെയും പുറത്തെയും ഭാഗങ്ങളെയോ ചുവരുകളെയോ സൂചിപ്പിക്കാം; കൂടുതൽ പൊതുവായി ‘അകത്തും പുറത്തും’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: മന്ദിരത്തിന്റെ ചുവരുകൾ
  rationale: בַּיִת എന്നതിന്റെ അക്ഷരാർഥം ‘വീട്’ എന്നാണെങ്കിലും, ഈ നിർമാണസന്ദർഭത്തിൽ അത് ദൈവാലയമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ‘മന്ദിരം’ തിരഞ്ഞെടുത്തു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: מֵסַב
  choice: ചുറ്റും
  rationale: ചുവരുകളുടെ എല്ലാ വശങ്ങളിലുമുള്ള വ്യാപ്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: קָלַע / פִּתּוּחֵי מִקְלְעוֹת
  choice: രൂപങ്ങൾ കൊത്തിവെച്ചു
  rationale: അലങ്കാരരൂപങ്ങൾ ഉപരിതലത്തിൽ കൊത്തിയുണ്ടാക്കിയെന്ന സംയുക്ത ആശയം വ്യക്തമായി നൽകുന്നു; ആവർത്തനഭാരം ഒഴിവാക്കുന്നു.
- source_word: כְּרוּבִים
  choice: കെരൂബുകൾ
  rationale: ദൈവാലയസന്ദർഭത്തിലെ സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന അംഗീകൃത ബൈബിൾപരമായ ലിപ്യന്തരണം.
- source_word: תִמֹרֹת
  choice: ഈന്തപ്പനകൾ
  rationale: അലങ്കാരത്തിൽ ഉപയോഗിച്ച പനമരരൂപങ്ങളെ ലളിതവും ദൃശ്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: פְטוּרֵי צִצִּים
  choice: വിടർന്ന പൂക്കൾ
  rationale: തുറന്നതോ വിരിയുന്നതോ ആയ പുഷ്പാലങ്കാരങ്ങളുടെ ആശയം നൽകുന്നു; കൃത്യമായ കലാരൂപം അനിശ്ചിതമായതിനാൽ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: അകത്തും പുറത്തും
  rationale: എബ്രായപ്രയോഗത്തിന്റെ പൊതുവായ സ്ഥലവ്യത്യാസം നിലനിർത്തുന്നു; അത് വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തെയും പുറത്തെയും ഭാഗങ്ങളെയോ ചുവരുകളെയോ സൂചിപ്പിക്കാമെന്ന സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
