source:
  edition: WLC
  text: וַ/יְצַ֨ף שְׁלֹמֹ֧ה אֶת הַ/בַּ֛יִת מִ/פְּנִ֖ימָה זָהָ֣ב סָג֑וּר וַ/יְעַבֵּ֞ר ב/רתיקות זָהָב֙ לִ/פְנֵ֣י הַ/דְּבִ֔יר וַ/יְצַפֵּ֖/הוּ זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: ml
  text: ശലോമോൻ ആലയത്തിന്റെ ഉൾഭാഗം ശുദ്ധമായ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു[a]. അവൻ അന്തർമന്ദിരത്തിന്റെ[c] മുൻവശത്ത് കുറുകെ സ്വർണച്ചങ്ങലകൾ നീട്ടി[b]; അതിനെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശുദ്ധീകരിച്ച സ്വർണം.’ ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘അടച്ച സ്വർണം’ എന്നാണ്; ഇത് മേന്മയുള്ള സ്വർണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അന്തർമന്ദിരത്തിന്റെ മുമ്പിൽ സ്വർണച്ചങ്ങലകൾ സ്ഥാപിച്ചു.’ ‘കടത്തുക/നീട്ടുക’ എന്ന ക്രിയയുടെ സാദ്ധ്യമായ അർഥത്തെ അടിസ്ഥാനമാക്കിയാണ് ‘മുൻവശത്ത് കുറുകെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: c
    text: ‘അന്തർമന്ദിരം’ എന്നത് ഹീബ്രുവിലെ ദെബീർ എന്ന പദമാണ്. ഇത് ആലയത്തിലെ ഏറ്റവും അകത്തെ മുറിയെ, പിന്നീട് ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു വിളിക്കപ്പെട്ട ഭാഗത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: പൊതിഞ്ഞു
  rationale: ക്ഷേത്രനിർമാണസന്ദർഭത്തിൽ צפה ഒരു പ്രതലത്തിന്മേൽ ലോഹത്തിന്റെ പാളി പതിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ് ‘പൊതിഞ്ഞു’.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘വീട്’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് യഹോവയുടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകാൻ ‘ആലയം’ ഉപയോഗിച്ചു.
- source_word: מִפְּנִימָה
  choice: അകവശം
  rationale: ആലയത്തിന്റെ ഉൾഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זָהָב סָגוּר
  choice: ശുദ്ധമായ സ്വർണം
  rationale: ‘അടച്ച സ്വർണം’ എന്ന അക്ഷരാർഥത്തിനു പകരം ഉന്നതഗുണമുള്ള, ശുദ്ധീകരിച്ച സ്വർണം എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സാദ്ധ്യമായ അർഥം നൽകുന്നു; മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיְעַבֵּר
  choice: വലിച്ചുകെട്ടി
  rationale: ഹിഫീൽ രൂപം ‘കടത്തുക/കുറുകെ നീട്ടുക’ എന്ന ആശയം നൽകുന്നു; ചങ്ങലകൾ മുൻവശത്ത് കുറുകെ നീട്ടിയ ക്രമീകരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּרַתּוּקוֹת
  choice: ച്ചങ്ങലകൾ
  rationale: അപൂർവമായ ഈ നാമത്തിന് സന്ദർഭത്തിൽ ഏറ്റവും വ്യാപകമായി അംഗീകരിക്കപ്പെടുന്ന അർഥം ‘ചങ്ങലകൾ’ എന്നതാണ്.
- source_word: לִפְנֵי הַדְּבִיר
  choice: അന്തർമന്ദിരത്തിന്റെ മുൻവശത്ത് കുറുകെ
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലാർഥവും וַיְעַבֵּר സൂചിപ്പിക്കുന്ന കുറുകെ നീട്ടലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു; ‘മുമ്പിൽ’ എന്ന കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: הַדְּבִיר
  choice: അന്തർമന്ദിരം
  rationale: ആലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധമുറിയെ സൂചിപ്പിക്കുന്ന ദְּבִיר എന്ന സാങ്കേതിക പദത്തിന് വ്യക്തവും സംക്ഷിപ്തവുമായ മലയാളസമാനപദം.
- source_word: וַיְצַפֵּהוּ
  choice: അതും സ്വർണംകൊണ്ട് പൊതിഞ്ഞു
  rationale: ഹീബ്രുവിലെ ഏകവചന കർമപ്രത്യയം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ കൃത്യമായ പൂർവപദം അനാവശ്യമായി നിർണയിക്കാതെ ‘അതും’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: וַיְצַפֵּהוּ എന്നതിലെ ഏകവചന കർമപ്രത്യയത്തിന്റെ സൂചകം
  choice: ‘അതും’ എന്ന സർവനാമത്തിലൂടെ അവ്യക്തത നിലനിർത്തി
  alternative: ‘അന്തർമന്ദിരവും’ അല്ലെങ്കിൽ ‘അതിന്റെ മുൻവശവും’ എന്നു വ്യക്തമാക്കുക
  rationale: പ്രത്യയം അന്തർമന്ദിരത്തെയോ അതിന്റെ മുൻവശത്തെ ക്രമീകരണത്തെയോ സൂചിപ്പിക്കാം; മൂലപാഠം നിർണായകമായി വ്യക്തമാക്കാത്തത് വിവർത്തനം സ്വമേധയാ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആലയം’, ‘അന്തർമന്ദിരം’ എന്നീ പദങ്ങൾ സന്ദർഭവ്യക്തത നൽകുന്നു. വാക്യഘടന സ്വാഭാവികമാക്കാൻ രണ്ടായി വിഭജിച്ചെങ്കിലും ഹീബ്രുവിലെ പ്രവർത്തനക്രമവും അവസാന സർവനാമത്തിലെ അവ്യക്തതയും സംരക്ഷിച്ചു.
