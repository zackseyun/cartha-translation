  language: ml
  text: ഒരു കെരൂബിന്റെ ഉയരം പത്തു മുഴം[a] ആയിരുന്നു; രണ്ടാമത്തെ കെരൂബിന്റേതും അങ്ങനെതന്നെ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുഴം പുരാതനകാലത്തെ ഒരു നീളയളവായിരുന്നു; അത് കൈമുട്ടിൽനിന്ന് വിരൽത്തുമ്പുവരെയുള്ള ദൂരത്തിന് ഏകദേശം തുല്യമായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: ഉയരം
  rationale: ക്ഷേത്രത്തിലെ ശില്പരൂപത്തിന്റെ ലംബമായ അളവിനെ സൂചിപ്പിക്കുന്നതിനാൽ, קוֹמָה എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം ‘ഉയരം’ ആണ്.
- source_word: הַכְּרוּב
  choice: കെരൂബ്
  rationale: ഏകവചനത്തിലുള്ള כְּרוּב ഒരു കെരൂബിനെ സൂചിപ്പിക്കുന്നു; ദേവാലയസന്ദർഭത്തിലെ പരമ്പരാഗത ബൈബിൾ സംജ്ഞ നിലനിർത്തുന്നു.
- source_word: הָאֶחָד
  choice: ഒരു
  rationale: ഹീബ്രുവിലെ ‘ഒന്ന്/ഒരു’ എന്ന വേർതിരിവ് നിലനിർത്തുന്നു; ‘ഒന്നാമത്തെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: പത്തു മുഴം
  rationale: קוֹמַת ഇതിനകം ഉയരത്തെ വ്യക്തമാക്കുന്നതിനാൽ അളവ് മാത്രം പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തനരഹിതവുമാണ്.
- source_word: וְכֵן
  choice: അങ്ങനെതന്നെ ആയിരുന്നു
  rationale: രണ്ടു കെരൂബുകളുടെയും ഉയരം തുല്യമായിരുന്നുവെന്ന താരതമ്യാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കെരൂബ്
  rationale: മൂലപാഠത്തിലെ ‘രണ്ടാമത്തെ’ എന്ന വ്യക്തമായ ക്രമസൂചന സംരക്ഷിക്കുന്നു.
