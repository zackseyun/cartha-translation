source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים בָּ/אַמָּ֖ה הָיָ֣ה הַ/בָּ֑יִת ה֖וּא הַ/הֵיכָ֥ל לִ/פְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: ml
  text: മന്ദിരം[a]—അതായത്, അന്തർമന്ദിരത്തിനു മുമ്പിലുള്ള പ്രധാന മണ്ഡപം—നാൽപ്പതു മുഴം നീളമുള്ളതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിന്റെ മുമ്പിലുള്ള പ്രധാന മണ്ഡപം.’ എബ്രായപാഠം ‘മന്ദിരം’ എന്നു പറഞ്ഞതിനെ הֵיכָל (ഹേഖാൽ), അതായത് അന്തർമന്ദിരത്തിനു മുമ്പിലുള്ള പ്രധാന മുറി, എന്ന് കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: നാൽപ്പതു
  rationale: വാസ്തുവിവരണത്തിന്റെ തുടർച്ച മലയാളവാക്യത്തിന്റെ ഘടനയിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ സംയോജകത്തെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സംഖ്യ കൃത്യമായി നൽകി.
- source_word: בָּ/אַמָּה
  choice: മുഴം നീളമുള്ള
  rationale: അമ്മാ എന്ന പുരാതന നീളയളവിന് മലയാളത്തിൽ പ്രചാരമുള്ള ‘മുഴം’ ഉപയോഗിച്ചു; അളവിന്റെ ദിശ വ്യക്തമാക്കാൻ സന്ദർഭാനുസൃതമായി ‘നീളമുള്ള’ ചേർത്തു.
- source_word: הָיָה
  choice: ആയിരുന്നു
  rationale: വിവരണാത്മകമായ ഭൂതകാല അസ്തിത്വക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הַ/בָּיִת
  choice: മന്ദിരം
  rationale: ഇവിടെ ‘ഭവനം’ ദേവാലയകെട്ടിടത്തെ സൂചിപ്പിക്കുന്നു. ‘മന്ദിരം’ അർത്ഥം സ്വാഭാവികമായി നൽകുകയും തുടർന്നുള്ള വിശദീകരണത്തിലൂടെ ഉദ്ദേശിച്ച ഭാഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ה֖וּא
  choice: അതായത്
  rationale: സർവനാമം ഇവിടെ മുൻപുള്ള ‘മന്ദിരം’ എന്നതിനെ കൂടുതൽ കൃത്യമായി തിരിച്ചറിയിക്കുന്ന വിശദീകരണപ്രയോഗമാണ്.
- source_word: הַ/הֵיכָל
  choice: പ്രധാന മണ്ഡപം
  rationale: ഹേഖാൽ ഇവിടെ അന്തർമന്ദിരത്തിൽനിന്ന് വേറിട്ട ദേവാലയത്തിന്റെ പ്രധാന മുറിയെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന കൃത്യമായ വാസ്തുപദമായി ‘പ്രധാന മണ്ഡപം’ തിരഞ്ഞെടുത്തു.
- source_word: לִ/פְנָֽ/י
  choice: അന്തർമന്ദിരത്തിനു മുമ്പിലുള്ള
  rationale: ‘മുമ്പിൽ’ എന്ന സ്ഥലബന്ധം കൃത്യമായി നൽകുന്നു; മുൻവാക്യത്തിലെ അന്തർമന്ദിരമാണ് സന്ദർഭത്തിലെ സൂചിത ആശ്രയം എന്നത് മലയാളത്തിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: לִפְנָי എന്നതിന്റെ സൂചിത ആശ്രയം മൂലപാഠത്തിൽ പേരെടുത്ത് ആവർത്തിച്ചിട്ടില്ല
  choice: അന്തർമന്ദിരത്തിനു മുമ്പിലുള്ള
  alternative: അതിന്റെ മുമ്പിലുള്ള
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച അന്തർമന്ദിരത്തെയാണ് ഈ പ്രയോഗം സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നത്. പ്രധാന പാഠത്തിൽ അത് വ്യക്തമാക്കിയെങ്കിലും മൂലപാഠത്തിന്റെ ചുരുക്കരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഇതിലൂടെ പുതിയ ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അപൂർവമായ സാങ്കേതിക പദത്തിനു പകരം ‘പ്രധാന മണ്ഡപം’ ഉപയോഗിച്ചു; ‘അന്തർമന്ദിരം’ വാസ്തുഭാഗങ്ങളുടെ വ്യത്യാസം ചുരുക്കമായി നിലനിർത്തുന്നു.
