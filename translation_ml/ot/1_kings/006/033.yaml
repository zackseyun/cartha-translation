id: 1KI.6.33
reference: 1 Kings 6:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֵ֥ן עָשָׂ֛ה לְ/פֶ֥תַח הַֽ/הֵיכָ֖ל מְזוּז֣וֹת עֲצֵי שָׁ֑מֶן מֵ/אֵ֖ת רְבִעִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: ml
  text: അതുപോലെ, ആലയത്തിന്റെ പ്രധാനമുറിയിലേക്കുള്ള പ്രവേശനത്തിന് ഒലിവുമരത്തടി കൊണ്ടുള്ള കട്ടിളക്കാലുകൾ അവൻ ഉണ്ടാക്കി; അവ നാലുവശമുള്ളവയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നാലുവശമുള്ള ചട്ടക്കൂടോടുകൂടിയവ” എന്നും “ചതുരാകൃതിയിലുള്ളവ” എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥത്തിൽ “നാലാമത്തെ ഭാഗത്തിൽനിന്ന്” എന്നുള്ള എബ്രായപ്രയോഗം വാസ്തുശാസ്ത്രപരമായി ദുഷ്കരമാണ്; അത് വാതിൽത്തുറയുടെ ആകൃതിയെ വിവരിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ നിർമാണവിവരണത്തോടുള്ള സാമ്യവും തുടർച്ചയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עָשָׂה
  choice: അവൻ ഉണ്ടാക്കി
  rationale: നിർമാണസന്ദർഭത്തിൽ ലളിതവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: לְפֶתַח הַהֵיכָל
  choice: ആലയത്തിന്റെ പ്രധാനമുറിയിലേക്കുള്ള പ്രവേശനത്തിന്
  rationale: הֵיכָל ഇവിടെ അതിവിശുദ്ധസ്ഥലത്തിൽനിന്നു വേറിട്ട ആലയത്തിന്റെ പ്രധാനമുറിയെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്കായി സാങ്കേതികമല്ലാത്ത വ്യക്തമായ പദപ്രയോഗം സ്വീകരിച്ചു.
- source_word: מְזוּזוֹת
  choice: കട്ടിളക്കാലുകൾ
  rationale: വാതിൽത്തുറയുടെ ഇരുവശത്തുമുള്ള ലംബമായ തൂണുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള വാസ്തുപദം.
- source_word: עֲצֵי שָׁמֶן
  choice: ഒലിവുമരത്തടി കൊണ്ടുള്ള
  rationale: നിർമാണവസ്തുവായി ഉപയോഗിച്ച ഒലിവുമരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מֵאֵת רְבִעִית
  choice: അവ നാലുവശമുള്ളവയായിരുന്നു
  rationale: വാസ്തുശാസ്ത്രപരമായി ദുഷ്കരമായ എബ്രായപ്രയോഗത്തെ അതിന്റെ സാധ്യതയുള്ള ചതുർവശരൂപസൂചനയോടെ വായനാസൗകര്യപ്രദമായി നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രധാനമുറി’ എന്നത് സാങ്കേതികമായ ‘നേവ്’ എന്ന പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപമാണ്; ദുഷ്കരമായ അവസാന പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
