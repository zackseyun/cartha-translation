id: 1KI.6.19
reference: 1 Kings 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: ml
  text: യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം അവിടെ വെക്കുന്നതിനായി, ആലയത്തിന്റെ ഏറ്റവും ഉള്ളിലുള്ള അന്തർമന്ദിരം[a] അവൻ ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ദെബീർ; പരമ്പരാഗതമായി ‘അരുളപ്പാടുസ്ഥലം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. ഇവിടെ അത് ആലയത്തിലെ ഏറ്റവും അകത്തുള്ള മുറിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: അന്തർമന്ദിരം
  rationale: ആലയത്തിലെ ഏറ്റവും അകത്തുള്ള മുറിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. പരമ്പരാഗതമായെങ്കിലും ഇവിടെ അവ്യക്തമായേക്കാവുന്ന ‘അരുളപ്പാടുസ്ഥലം’ എന്നതിനേക്കാൾ ‘അന്തർമന്ദിരം’ സ്ഥാനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: ആലയത്തിന്റെ ഏറ്റവും ഉള്ളിലുള്ള
  rationale: בְּתוֹךְ എന്ന സ്ഥലസൂചനയും מִפְּנִימָה നൽകുന്ന അകത്തേക്കുള്ള ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ בַּיִת ശലോമോന്റെ ആലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആലയം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הֵכִין
  choice: ഒരുക്കി
  rationale: ഒരു നിർദിഷ്ട ഉദ്ദേശ്യത്തിനായി സജ്ജമാക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; നിർമാണരീതിയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לְתִתֵּן שָׁם
  choice: അവിടെ വെക്കുന്നതിനായി
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന അനന്തക്രിയാരൂപവും ‘അവിടെ’ എന്ന സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: എബ്രായത്തിലെ ബന്ധപദശൃംഖലയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്ന മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്താൻ മലയാളത്തിലെ നേരിട്ടുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു; ഒരു പദവിനാമം പകരംവെച്ചില്ല.
- issue: דְבִיר എന്ന പദത്തിന്റെ ക്ഷേത്രസന്ദർഭത്തിലുള്ള അർഥം
  choice: അന്തർമന്ദിരം
  alternative: അരുളപ്പാടുസ്ഥലം; അതിവിശുദ്ധസ്ഥലം
  rationale: ഇവിടെ പദം ആലയത്തിലെ ഏറ്റവും അകത്തുള്ള മുറിയെ സൂചിപ്പിക്കുന്നു. ‘അതിവിശുദ്ധസ്ഥലം’ പ്രവർത്തനപരമായ തിരിച്ചറിയൽ നൽകുമെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത ഒരു സ്ഥിരസാങ്കേതിക നാമം മുൻനിർത്താതിരിക്കാൻ സ്ഥാനസൂചകമായ പരിഭാഷ തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഏറ്റവും ഉള്ളിലുള്ള’ എന്ന പ്രയോഗം മൂലത്തിലെ ആവർത്തിച്ചുള്ള ആന്തരിക സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘അന്തർമന്ദിരം’ ക്ഷേത്രവാസ്തുവിദ്യാ സന്ദർഭത്തിലെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
