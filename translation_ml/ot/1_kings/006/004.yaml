  choice: അവൻ ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ ലളിതമായ ഭൂതകാലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לַבָּיִת
  choice: ആലയത്തിനായി
  rationale: സന്ദർഭത്തിൽ בַּיִת ശലോമോന്റെ ദേവാലയകെട്ടിടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്ന ഉപസർഗം ഇവിടെ ‘ആലയത്തിനായി’ എന്നു സ്വാഭാവികമായി നൽകാം.
- source_word: חַלּוֹנֵי
  choice: ജനാലകൾ
  rationale: חלון എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളം.
- source_word: שְׁקֻפִים
  choice: അകത്തേക്കു ചാഞ്ഞ ചട്ടക്കൂടുകളുള്ള
  rationale: അപൂർവമായ ഈ വാസ്തുശില്പപദം ചരിഞ്ഞതോ ഉള്ളിലേക്കു വീതികൂടുന്നതോ ആയ ജനാലച്ചട്ടങ്ങളെ സൂചിപ്പിച്ചേക്കാം; കൃത്യമായ രൂപം ഉറപ്പില്ലാത്തതിനാൽ സാധ്യത സൂചിപ്പിക്കുന്ന വായനാസൗകര്യമുള്ള പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: אֲטֻמִים
  choice: അടഞ്ഞ
  rationale: אטם എന്ന ധാതുവിന്റെ ‘അടയ്ക്കുക/മൂടുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് ജനാലകളുടെ അടഞ്ഞതോ സ്ഥിരമായി ഘടിപ്പിച്ചതോ ആയ സ്വഭാവത്തെ വിവരിച്ചേക്കാം.
