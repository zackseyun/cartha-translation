translation:
  language: ml
  text: അവൻ ആലയത്തിനായി ഉൾവാങ്ങിയ ചട്ടക്കൂടുകളുള്ളതും അടച്ചതുമായ ജനാലകൾ[a] ഉണ്ടാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വാസ്തുശില്പപദങ്ങൾ അപൂർവമാണ്; അവയുടെ കൃത്യമായ അർഥം ഉറപ്പില്ല. ഈ പ്രയോഗം ‘ഉൾവാങ്ങിയതോ ചെരിഞ്ഞതോ ആയ ചട്ടക്കൂടുകളുള്ള ജനാലകൾ,’ ‘ഇടുങ്ങുന്ന വശങ്ങളുള്ള ജനാലകൾ,’ അല്ലെങ്കിൽ ‘പുറത്ത് ഇടുങ്ങിയതും അകത്ത് വീതിയുള്ളതുമായ ജനാലകൾ’ എന്നും മനസ്സിലാക്കാം. ‘അടച്ചതായ’ എന്ന പദത്തിന് ‘സ്ഥിരമായി ഘടിപ്പിച്ച’ അല്ലെങ്കിൽ ‘മൂടിയ’ എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
