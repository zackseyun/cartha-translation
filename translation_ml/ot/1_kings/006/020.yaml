  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: ml
  text: അന്തർമന്ദിരം ഇരുപതു മുഴം നീളവും ഇരുപതു മുഴം വീതിയും ഇരുപതു മുഴം ഉയരവും ഉള്ളതായിരുന്നു. അവൻ അതു ശുദ്ധസ്വർണംകൊണ്ടു പൊതിഞ്ഞു[a]; ദേവദാരുമര യാഗപീഠവും അവൻ പൊതിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മേന്മയേറിയ സ്വർണംകൊണ്ടു.” എബ്രായപ്രയോഗം ഉയർന്ന ഗുണമേന്മയുള്ള ശുദ്ധീകരിച്ച സ്വർണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദേവദാരുകൊണ്ടുള്ള ഒരു യാഗപീഠം.” എബ്രായപദസമുച്ചയം ഇങ്ങനെ മനസ്സിലാക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: അന്തർമന്ദിരത്തിന്റെ അകം
  rationale: ദൈർഘ്യം, വീതി, ഉയരം എന്നിവ തുടർന്ന് പറയുന്നതിനാൽ ഇവിടെ അളക്കപ്പെടുന്നത് അന്തർമന്ദിരത്തിന്റെ ഉൾവശമാണ്. എബ്രായത്തിലെ സംക്ഷിപ്തമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הַדְּבִיר
  choice: അന്തർമന്ദിരം
  rationale: ദേവാലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധമുറിയെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സാങ്കേതിക പദപ്രയോഗം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: ഇരുപതു മുഴം നീളവും ഇരുപതു മുഴം വീതിയും ഇരുപതു മുഴം ഉയരവും
  rationale: മൂലത്തിലെ അളവുകോലായ ‘മുഴം’ നിലനിർത്തുകയും ഘനാകൃതിയിലുള്ള മൂന്ന് അളവുകളും വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: וַיְצַפֵּהוּ
  choice: അവൻ അതു ... പൊതിഞ്ഞു
  rationale: צפה എന്ന ക്രിയ ഇവിടെ ഒരു പ്രതലം വിലയേറിയ വസ്തുകൊണ്ട് ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: זָהָב סָגוּר
  choice: തങ്കം
  rationale: സָגוּר ഉയർന്ന ഗുണമേന്മയുള്ള ശുദ്ധീകരിച്ച തങ്കത്തെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘തങ്കം’ ഉപയോഗിച്ച് ഗുണവിശേഷം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: ദേവദാരുകൊണ്ടുള്ള യാഗപീഠവും അവൻ പൊതിഞ്ഞു
  rationale: മസോററ്റിക് വാചകം സംക്ഷിപ്തമാണ്. אָרֶז യാഗപീഠത്തിന്റെ നിർമ്മാണവസ്തുവായി വായിക്കുന്ന സ്വാഭാവിക സാധ്യത മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചെങ്കിലും മറ്റൊരു വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
