  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദേവാലയവിവരണത്തിന് യോജിച്ച ‘അന്തർമന്ദിരം’, ‘യാഗപീഠം’, ‘മുഴം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ സംക്ഷിപ്തത മൂലമുള്ള അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
