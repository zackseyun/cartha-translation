  text: ആലയത്തിന്റെ നിലം അവൻ അകത്തും പുറത്തും സ്വർണംകൊണ്ട് പൊതിഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഭവനത്തിന്റെ നിലം’ എന്നാണ്. ‘അകത്തും പുറത്തും’ എന്ന പ്രയോഗം നിലം അകത്തെ ഭാഗംമുതൽ പുറത്തെ ഭാഗംവരെ സ്വർണംകൊണ്ട് പൊതിഞ്ഞിരുന്നു എന്നർഥമാകാം.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: നിലം
  rationale: ആലയനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം കെട്ടിടത്തിന്റെ തറപ്രതലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘നിലം’ സ്വാഭാവികമാണ്.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഭവനം’ എന്നാണെങ്കിലും ഈ സന്ദർഭത്തിൽ അത് യഹോവയുടെ ആലയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആലയം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: צִפָּה
  choice: പൊതിഞ്ഞു
  rationale: ഒരു പ്രതലത്തിന്മേൽ മറ്റൊരു വസ്തു ആവരണമായി പതിപ്പിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ; ‘പൊതിഞ്ഞു’ നിർമാണസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: അകത്തും പുറത്തും മുഴുവനായി
  rationale: അകത്തെ ഭാഗം മുതൽ പുറത്തെ ഭാഗംവരെ നിലം സ്വർണംകൊണ്ട് പൊതിഞ്ഞിരുന്നു എന്ന സാധ്യതയുള്ള വ്യാപ്തിയർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എങ്കിലും എബ്രായപ്രയോഗത്തിന്റെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
