translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വീട്/ഭവനം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘ആലയം’ ഉപയോഗിച്ചു; ഉറവിടത്തിലെ സ്ഥലവ്യാപ്തിയുടെ സംക്ഷിപ്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
