translation:
  language: ml
  text: സൈപ്രസ് മരത്തടികൊണ്ടുള്ള[a] രണ്ടു വാതിലുകളും ഉണ്ടാക്കി; ഒന്നാമത്തെ വാതിലിന് മടക്കാവുന്ന രണ്ടു പാളികളും[b] രണ്ടാമത്തെ വാതിലിന് മടക്കാവുന്ന രണ്ടു പാളികളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘ഫിർമരം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്; എബ്രായപദം സൈപ്രസ് അഥവാ സമാനമായ ഒരു കോണിഫർ വൃക്ഷത്തെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ വാസ്തുവിദ്യാപദങ്ങൾ അപൂർവമാണ്. ‘രണ്ടു വശഭാഗങ്ങൾ’ എന്നും ‘തിരിയുന്ന/കറങ്ങുന്ന ഭാഗങ്ങൾ’ എന്നും വ്യാഖ്യാനിക്കാം; സാധാരണയായി മടക്കുപാളികളെന്നാണ് മനസ്സിലാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: വാതിലുകൾ
  rationale: രണ്ടു വാതിൽഘടനകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം; തുടർന്നുള്ള ഏകവചനപ്രയോഗം ഓരോ വാതിലിനെയും വേർതിരിക്കുന്നു.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: സരളമരത്തടി
  rationale: בְּרוֹשׁ സൈപ്രസ് അഥവാ അതിനോടു സാമ്യമുള്ള ഒരു കോണിഫർ വൃക്ഷത്തെ സൂചിപ്പിക്കാം; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മാന്യവുമായ ‘സരളമരം’ ഉപയോഗിച്ചു, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: צְלָעִים
  choice: പാളികൾ
  rationale: സാധാരണയായി ‘വശങ്ങൾ/വാരിയെല്ലുകൾ’ എന്നർഥമുള്ള അപൂർവ വാസ്തുവിദ്യാപ്രയോഗം; ഇവിടെ വാതിലിന്റെ ചലിക്കുന്ന വിഭാഗങ്ങൾ എന്ന സന്ദർഭാർഥം ‘പാളികൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גְּלִילִים
  choice: മടക്കാവുന്ന
  rationale: തിരിയുക, ചുറ്റുക, മടങ്ങുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന അപൂർവ പദം; വാതിൽപ്പാളികളുടെ പ്രവർത്തനം വ്യക്തമാക്കാൻ ‘മടക്കാവുന്ന’ എന്നു നൽകി, ‘കറങ്ങുന്ന’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: קְלָעִים
  choice: മടക്കാവുന്ന പാളികൾ
  rationale: അപൂർവമായ ഈ പദം ആദ്യ വാതിലിന്റെ ഭാഗങ്ങളോടു സമാന്തരമായി രണ്ടാമത്തെ വാതിലിന്റെ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; സമാന്തരഘടന വ്യക്തമായി നിലനിർത്തി.
- source_word: הַדֶּלֶת הָאַחַת
  choice: ഒരു വാതിൽ
  rationale: രണ്ടിൽ ഒന്നാമത്തേതിനെ വേർതിരിച്ചുകാട്ടുന്ന പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായ വിരുദ്ധജോടി സൃഷ്ടിക്കുന്നു.
- source_word: הַדֶּלֶת הַשֵּׁנִית
  choice: രണ്ടാമത്തെ വാതിൽ
  rationale: മുൻപറഞ്ഞ വാതിലിനോടുള്ള ക്രമസൂചകമായ വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
