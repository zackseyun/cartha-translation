translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി. എബ്രായത്തിലെ അപൂർവ വാസ്തുവിദ്യാപദങ്ങളുടെ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ച് അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
