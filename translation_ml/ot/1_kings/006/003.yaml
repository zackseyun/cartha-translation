  rationale: പുരാതന അളവായ אַמָּה മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു; ആധുനിക അളവിലേക്ക് പരിവർത്തനം ചെയ്യുന്നില്ല.
