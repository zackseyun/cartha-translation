  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: ml
  text: ആലയത്തിന്റെ പ്രധാനമന്ദിരത്തിന്റെ[b] മുൻവശത്തുള്ള മുഖമണ്ഡപത്തിന്[a], ആലയത്തിന്റെ വീതിക്കൊത്തവണ്ണം ഇരുപത് മുഴം നീളവും ആലയത്തിന്റെ മുൻവശത്തേക്ക് പത്തു മുഴം ആഴവും[c] ഉണ്ടായിരുന്നു.
