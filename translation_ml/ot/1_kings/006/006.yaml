  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: ml
  text: താഴത്തെ നിലയ്ക്ക് അഞ്ചു മുഴം വീതിയും നടുവിലത്തെ നിലയ്ക്ക് ആറു മുഴം വീതിയും മൂന്നാമത്തെ നിലയ്ക്ക് ഏഴ് മുഴം വീതിയും ഉണ്ടായിരുന്നു. ആലയത്തിന്റെ പുറത്ത് ചുറ്റുമായി ഒതുക്കുകൾ[a] ഉണ്ടാക്കിയിരുന്നത്, തുലാങ്ങൾ ആലയത്തിന്റെ ചുവരുകളിൽ ഉറപ്പിക്കാതിരിക്കാനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തട്ടുകൾ’, ‘പിന്നോട്ടൊതുക്കലുകൾ’, അല്ലെങ്കിൽ ‘ചുവരിലെ പിന്നോട്ടൊതുക്കിയ ഭാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ആലയത്തിന്റെ ചുവരുകളിൽ ഉറപ്പിക്കാതിരിക്കേണ്ടതിന്.’ പാർശ്വഘടനയുടെ തുലാങ്ങൾ ആലയത്തിന്റെ ചുവരുകളിൽ കയറ്റി ഉറപ്പിക്കാതിരിക്കാനാണ് ഈ പുറംഒതുക്കലുകൾ ഉണ്ടായിരുന്നതെന്നതാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: היצוע
  choice: നില
  rationale: ആലയത്തെ ചുറ്റിയുള്ള പാർശ്വഘടനയുടെ വിവിധ തട്ടുകളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘നില’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַתַּחְתֹּנָה / הַתִּיכֹנָה / הַשְּׁלִישִׁית
  choice: താഴത്തെ നില / നടുവിലത്തെ നില / മൂന്നാമത്തെ നില
  rationale: മൂന്നു വാസ്തുശില്പതലങ്ങളുടെ ക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּאַמָּה
  choice: മുഴം
  rationale: പുരാതന അളവായ ‘ക്യൂബിറ്റ്’ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികമായ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു; ആധുനിക അളവിലേക്ക് മാറ്റുന്നില്ല.
- source_word: מִגְרָעוֹת
  choice: പടവുകൾ
  rationale: ചുവരിന്റെ പുറംഭാഗത്ത് ഓരോ നിലയിലും പിന്നോട്ടൊതുക്കി രൂപപ്പെടുത്തിയ താങ്ങുപടികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. കൃത്യമായ രൂപത്തെക്കുറിച്ചുള്ള ശാബ്ദിക സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: ആലയത്തിന്റെ പുറത്ത് ചുറ്റുമായി ... ഉണ്ടാക്കിയിരുന്നതിനാൽ
  rationale: ‘ഭവനം’ എന്നതിന്റെ സന്ദർഭാർഥം ആലയം ആണെന്ന് വ്യക്തമാക്കുകയും ഹീബ്രായയിലെ ചുറ്റുമുള്ള പുറംക്രമീകരണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: തുലാങ്ങൾ ആലയത്തിന്റെ ചുവരുകളിൽ ഉറപ്പിക്കേണ്ടിവന്നില്ല
  rationale: ഹീബ്രായിൽ കർത്താവ് പരോക്ഷമാണെങ്കിലും വാസ്തുശില്പസന്ദർഭത്തിൽ പാർശ്വനിലകളെ താങ്ങുന്ന തുലാങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്. അർഥം ഗ്രഹിക്കാൻ അത് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
