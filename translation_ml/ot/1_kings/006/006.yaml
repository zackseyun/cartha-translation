  text: ה/יצוע הַ/תַּחְתֹּנָ֜ה חָמֵ֧שׁ בָּ/אַמָּ֣ה רָחְבָּ֗/הּ וְ/הַ/תִּֽיכֹנָה֙ שֵׁ֤שׁ בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/הַ֨/שְּׁלִישִׁ֔ית שֶׁ֥בַע בָּ/אַמָּ֖ה רָחְבָּ֑/הּ כִּ֡י מִגְרָעוֹת֩ נָתַ֨ן לַ/בַּ֤יִת סָבִיב֙ ח֔וּצָ/ה לְ/בִלְתִּ֖י אֲחֹ֥ז בְּ/קִֽירוֹת הַ/בָּֽיִת־׃
base_translation:
