  to: താഴത്തെ നിലയ്ക്ക് അഞ്ചു മുഴം വീതിയും നടുവിലത്തെ നിലയ്ക്ക് ആറു മുഴം വീതിയും മൂന്നാമത്തെ നിലയ്ക്ക് ഏഴ് മുഴം വീതിയും ഉണ്ടായിരുന്നു. ആലയത്തിന്റെ പുറത്ത് ചുറ്റുമായി ഒതുക്കുകൾ[a] ഉണ്ടാക്കിയിരുന്നത്, തുലാങ്ങൾ ആലയത്തിന്റെ ചുവരുകളിൽ ഉറപ്പിക്കാതിരിക്കാനായിരുന്നു.[b]
