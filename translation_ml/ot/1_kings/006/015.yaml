  terminology: “ആലയം,” “ചുവരുകൾ,” “ദേവദാരുപ്പലകകൾ,” and “സൈപ്രസ് മരപ്പലകകൾ” are suitable modern-standard Malayalam choices. The footnotes properly preserve the uncertainty of the upper architectural term and of בְּרוֹשִׁים. The markers are placed directly on the phrases they explain.
