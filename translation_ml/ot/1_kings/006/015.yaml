  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാസ്തുവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തി; അസാധാരണമായ മുകൾഘടനാപ്രയോഗവും വൃക്ഷനാമത്തിലെ അനിശ്ചിതത്വവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
