source:
  edition: WLC
  text: וַ/יִּבֶן֩ אֶת קִיר֨וֹת הַ/בַּ֤יִת מִ/בַּ֨יְתָ/ה֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִ/קַּרְקַ֤ע הַ/בַּ֨יִת֙ עַד קִיר֣וֹת הַ/סִּפֻּ֔ן צִפָּ֥ה עֵ֖ץ מִ/בָּ֑יִת וַ/יְצַ֛ף אֶת קַרְקַ֥ע הַ/בַּ֖יִת בְּ/צַלְע֥וֹת בְּרוֹשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: ml
  text: അവൻ ആലയത്തിന്റെ അകത്തെ ചുവരുകൾ ദേവദാരുപ്പലകകൾകൊണ്ട് പണിതു. ആലയത്തിന്റെ നിലംമുതൽ മേൽത്തട്ടിന്റെ ചുവരുകൾവരെ[a] അവൻ ആലയത്തിന്റെ അകം മരംകൊണ്ട് പൊതിഞ്ഞു; ആലയത്തിന്റെ നിലം സൈപ്രസ് മരപ്പലകകൾകൊണ്ട്[b] പൊതിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേൽത്തട്ടിന്റെ ചുവരുകൾവരെ’ എന്ന പ്രയോഗം അകത്തെ മേൽത്തട്ടോ മേൽക്കൂരയുടെ അടിവശത്തെ മരാവരണമോ വരെയെന്ന് അർഥമാക്കുന്നതായിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: എബ്രായ വൃക്ഷനാമം സൈപ്രസ്, ജൂനിപ്പർ തുടങ്ങിയ ഒരു സൂചിമരവർഗത്തെ സൂചിപ്പിക്കാം; പരമ്പരാഗതമായി ‘ഫിർമരം’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: അവൻ ... പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ സാധാരണ നിർമാണാർഥം നിലനിർത്തുന്നു; മലയാള ആഖ്യാനത്തിൽ തുടക്കത്തിലെ വാവിനെ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ ക്രമബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: ആലയത്തിന്റെ അകത്തെ ചുവരുകൾ
  rationale: קִירוֹת എന്നതിനെ ‘ചുവരുകൾ’ എന്നും מִבַּיְתָה സൂചിപ്പിക്കുന്ന ആന്തരിക സ്ഥാനം ‘അകത്തെ’ എന്നും നൽകുന്നു. സന്ദർഭത്തിൽ הַבַּיִת ദൈവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘ആലയം’ തിരഞ്ഞെടുത്തു.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: ദേവദാരുപ്പലകകൾകൊണ്ട്
  rationale: אֲרָזִים ദേവദാരുവിനെയും നിർമാണസന്ദർഭത്തിലെ צַלְעוֹת മരപ്പലകകളെയും സൂചിപ്പിക്കുന്നു; ‘വാരിയെല്ലുകൾ’ എന്ന അക്ഷരാർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: ആലയത്തിന്റെ നിലംമുതൽ
  rationale: കെട്ടിടത്തിന്റെ അകത്തെ ഉപരിതലത്തെ സൂചിപ്പിക്കുന്ന קַרְקַעയ്ക്ക് ‘നിലം’ സ്വാഭാവികമായ വാസ്തുവിദ്യാപദമാണ്.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: മേൽത്തട്ടിന്റെ ചുവരുകൾവരെ
  rationale: അസാധാരണമായ എബ്രായ ഘടനയിലെ קִירוֹת എന്ന ‘ചുവരുകൾ’ നിലനിർത്തുകയും הַסִּפֻּן എന്ന മൂടിയ മുകൾഘടനയെ ‘മേൽത്തട്ട്’ എന്നു നൽകുകയും ചെയ്തു; സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: അകം മരംകൊണ്ട് പൊതിഞ്ഞു
  rationale: צפה ഇവിടെ ഒരു ഉപരിതലം ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻപറഞ്ഞ ചുവരുകളാണ് പരോക്ഷ കർമം; ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അത് സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: ആലയത്തിന്റെ നിലം ... മൂടി
  rationale: നിലത്തിന്റെ മേൽ മരപ്പലകകൾ വിരിച്ച് ആവരണം ചെയ്തതിനെ ‘മൂടി’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: സൈപ്രസ് മരപ്പലകകൾകൊണ്ട്
  rationale: צַלְעוֹת എന്നത് വീണ്ടും പലകകളെ സൂചിപ്പിക്കുന്നു. בְּרוֹשִׁים എന്ന വൃക്ഷനാമത്തിന് സൈപ്രസ് എന്നത് യുക്തമായ ആധുനിക സമാനപദമാണ്; വൃക്ഷവർഗത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
