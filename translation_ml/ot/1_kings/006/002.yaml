  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: ml
  text: യഹ്‌വെയ്ക്കായി[a] ശലോമോൻ രാജാവ് പണിത ആലയം[b] അറുപതു മുഴം നീളവും ഇരുപതു മുഴം വീതിയും[c] മുപ്പതു മുഴം ഉയരവും ഉള്ളതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH (יהוה); ഇവിടെ ‘യഹ്‌വെ’ എന്നു നൽകിയിരിക്കുന്നു. ‘കർത്താവ്’ എന്നും ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്തുന്ന പതിവുകളുമുണ്ട്.'
    reason: alternative_reading
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഭവനം’; തുടക്കത്തിലെ സംയോജകം ‘വ-’ അഥവാ ‘-ഉം’ എന്ന അർഥത്തിൽ നൽകാം.'
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ ഈ ഭാഗത്ത് ‘മുഴം’ എന്ന അളവുപദം ആവർത്തിച്ചിട്ടില്ല; മുൻപും പിന്നാലെയുമുള്ള അളവുകളിൽനിന്ന് അത് മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: ആലയം
  rationale: בַּיִת എന്നതിന്റെ അക്ഷരാർഥം ‘ഭവനം’ എന്നാണ്; ഇവിടെ ശലോമോൻ പണിത ദൈവാലയമാണ് ഉദ്ദേശിക്കുന്നത്. സാധാരണ മലയാളത്തിൽ സന്ദർഭം വ്യക്തമായി അറിയിക്കാൻ ‘ആലയം’ ഉപയോഗിച്ചു; അക്ഷരാർഥവും ആരംഭത്തിലെ וְ എന്ന സംയോജകവും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ് പണിത
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി; בָּנָה പൂർത്തിയായ നിർമാണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കായി
  rationale: לְ ഇവിടെ സമർപ്പണത്തെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: അറുപതു മുഴം നീളം
  rationale: אַמָּה എന്ന പുരാതന അളവിനെ പതിവായ മലയാളരൂപമായ ‘മുഴം’ എന്നു നൽകി; אָרְכּוֹ അതിന്റെ നീളത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: ഇരുപതു മുഴം വീതി
  rationale: ഈ ഘടകത്തിൽ ‘മുഴം’ എന്ന അളവുപദം ഹീബ്രുവിൽ ആവർത്തിക്കുന്നില്ലെങ്കിലും സമാന്തരമായ അളവുപട്ടികയിൽനിന്ന് വ്യക്തമായി മനസ്സിലാകുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ചേർത്തു; വിവരം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: മുപ്പതു മുഴം ഉയരം
  rationale: קוֹמָה ഇവിടെ കെട്ടിടത്തിന്റെ ഉയരത്തെ സൂചിപ്പിക്കുന്നു; അളവും അർഥവും നേരിട്ട് നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അത് ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; പകരം ഉപയോഗിക്കപ്പെടുന്ന രൂപങ്ങൾ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: בַּיִת എന്ന പദത്തിന്റെ ദൈവാലയസന്ദർഭം
  choice: ആലയം
  alternative: ഭവനം
  rationale: ‘ഭവനം’ എന്ന അക്ഷരാർഥം ദൈവത്തിന്റെ വാസസ്ഥലമെന്ന ആശയപ്രതിധ്വനി നിലനിർത്തുന്നു; എന്നാൽ ഈ നിർമാണസന്ദർഭത്തിൽ സാധാരണ വായനക്കാരന് വ്യക്തവും സ്വാഭാവികവുമായ ‘ആലയം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. അളവുപട്ടികയുടെ സമാന്തരത നിലനിർത്താൻ ‘നീളവും… വീതിയും… ഉയരവും’ എന്ന രൂപം ഉപയോഗിച്ചു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
