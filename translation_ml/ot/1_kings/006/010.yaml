  rationale: עַל എന്നതിന്റെ സ്ഥലപരമായ ചേർച്ചയും כָּל എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ בַּיִת ആലയത്തെ സൂചിപ്പിക്കുന്നു.
