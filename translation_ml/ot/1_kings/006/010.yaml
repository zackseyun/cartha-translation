  text: അവൻ ആലയത്തിന്റെ മുഴുവൻ ഭാഗങ്ങളോടും ചേർന്ന് പാർശ്വനിർമാണം പണിതു[a]. അതിന്റെ ഉയരം അഞ്ച് മുഴം ആയിരുന്നു. ദേവദാരുത്തടികൾകൊണ്ട് അതിനെ ആലയത്തോടു ചേർത്തുറപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാർശ്വമുറികൾ”; എബ്രായപദം ആലയത്തോടു ചേർന്ന് അതിന്റെ വശങ്ങളിലൂടെ നീണ്ടിരുന്ന നിർമാണത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ദേവദാരുകഴുക്കോലുകൾകൊണ്ട് അതിനെ ആലയത്തോടു ചേർത്തു.”
    reason: lexical_alternative
