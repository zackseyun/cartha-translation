translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘വീട്’ എന്നതിനു പകരം സന്ദർഭോചിതമായി ‘ആലയം’ ഉപയോഗിച്ചു. വാസ്തുവിദ്യയിലെ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചു.
