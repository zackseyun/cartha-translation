  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
