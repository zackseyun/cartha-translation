  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: ml
  text: അവൻ കെരൂബുകളെ ആലയത്തിന്റെ ഉൾമന്ദിരത്തിൽ[a] സ്ഥാപിച്ചു. കെരൂബുകൾ ചിറകുകൾ വിരിച്ചു; ഒന്നിന്റെ ചിറക് ഒരു ചുവരിലും രണ്ടാമത്തെ കെരൂബിന്റെ ചിറക് മറുചുവരിലും തൊട്ടു. ആലയത്തിന്റെ മധ്യഭാഗത്തേക്കുള്ള അവരുടെ ചിറകുകൾ ചിറകോടു ചിറക് തൊട്ടുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അകത്തെ ഭവനത്തിൽ’; ഇത് ആലയത്തിന്റെ ഏറ്റവും അകത്തെ മന്ദിരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: സ്ഥാപിച്ചു
  rationale: נתן എന്നതിന് ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്നർഥമുണ്ട്; നിർമിതിക്കുള്ളിൽ കെരൂബുകളെ നിശ്ചിത സ്ഥാനത്ത് വെച്ചതിനെ ‘സ്ഥാപിച്ചു’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַכְּרוּבִים
  choice: കെരൂബുകൾ
  rationale: ആരാധനാപരവും ദൈവശാസ്ത്രപരവുമായ പ്രത്യേക അർഥം നിലനിർത്താൻ പരമ്പരാഗത ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: ആലയത്തിന്റെ ഉൾമന്ദിരത്തിൽ
  rationale: എബ്രായത്തിലെ ‘അകത്തെ ഭവനം’ എന്ന പ്രയോഗം ആലയത്തിന്റെ ഏറ്റവും അകത്തെ ഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഉൾമന്ദിരം’ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമാക്കുന്നു.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: കെരൂബുകൾ ചിറകുകൾ വിരിച്ചു
  rationale: എബ്രായ വാക്യഘടനയിലെ ബഹുവചന കർത്താവിനെ സന്ദർഭാനുസരണം കെരൂബുകളായി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: തൊട്ടു / തൊട്ടുനിന്നു
  rationale: נגע യഥാർഥ സമ്പർക്കത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തിക്കുന്ന സ്ഥലവിവരണത്തിൽ ‘തൊടുക’ നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: כְּנַף הָאֶחָד
  choice: ഒന്നിന്റെ ചിറക്
  rationale: ‘ഒന്നാമത്തേതിന്റെ’ എന്നു വ്യാഖ്യാനിക്കാതെ, എബ്രായത്തിലെ ‘ഒന്നിന്റെ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കെരൂബ്
  rationale: എബ്രായത്തിലെ ക്രമസംഖ്യയെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: മറുചുവർ
  rationale: രണ്ടു ചുവരുകൾ തമ്മിലുള്ള താരതമ്യത്തിൽ ‘മറുചുവർ’ സ്വാഭാവിക മലയാളമാണ്; ‘രണ്ടാമത്തെ ചുവർ’ എന്ന മൂലാർഥവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: ആലയത്തിന്റെ മധ്യഭാഗത്തേക്കുള്ള അവരുടെ ചിറകുകൾ
  rationale: תּוֹךְ ഇവിടെ അകത്തളം/മധ്യം സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യഭാഗത്തിൽ ചിറകുകൾ തമ്മിൽ ചേരുന്ന സ്ഥലബന്ധം ‘മധ്യഭാഗത്തേക്ക്’ വ്യക്തമാക്കുന്നു.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: ചിറകോടു ചിറക് തൊട്ടുനിന്നു
  rationale: ‘ചിറകോടു ചിറക്’ എന്ന ദൃശ്യമായ എബ്രായ പ്രയോഗം നിലനിർത്തി, തുടർന്നുള്ള നിലയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിച്ചു.
