lexical_decisions:
- source_word: בַּדְּבִיר
  choice: അകത്തെ വിശുദ്ധമന്ദിരത്തിൽ
  rationale: ദേവാലയത്തിലെ ഏറ്റവും അകത്തെ വിശുദ്ധമുറിയെയാണ് דְּבִיר സൂചിപ്പിക്കുന്നത്. ഈ പരിഭാഷ സ്ഥാനം വ്യക്തമായി അറിയിക്കുകയും പിൽക്കാല സാങ്കേതിക പ്രയോഗം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כְרוּבִים
  choice: കെരൂബുകൾ
  rationale: പ്രത്യേക ബൈബിൾ ജീവികളെ സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ പരമ്പരാഗത രൂപം നിലനിർത്തുന്നു; സാധാരണ ദൂതന്മാർ എന്നാക്കി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: עֲצֵי שָׁמֶן
  choice: ഒലിവുമരംകൊണ്ട്
  rationale: ഒലിവുമരത്തിന്റെ തടിയാണ് ഉദ്ദേശിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വസ്തു വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗം.
- source_word: עֶשֶׂר אַמּוֹת
  choice: പത്തു മുഴം
  rationale: പുരാതന അളവായ אַמָּהയ്ക്ക് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ സമാനപദം 'മുഴം' ആണ്.
- source_word: קוֹמָתוֹ
  choice: ഓരോന്നിനും പത്തു മുഴം ഉയരമുണ്ടായിരുന്നു
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥമായി ഏകവചനത്തിൽ 'അതിന്റെ ഉയരം' എന്നാണ്; രണ്ടു കെരൂബുകളെയും സംബന്ധിക്കുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: עשה എന്ന സാധാരണ 'ഉണ്ടാക്കുക/ചെയ്യുക' ക്രിയയുടെ സന്ദർഭോചിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
