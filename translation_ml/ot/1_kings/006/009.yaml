  yaml_path: translation/ot/1_kings/006/009.yaml
  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: ml
  text: അങ്ങനെ അവൻ ആലയം പണിതു പൂർത്തിയാക്കി; ദേവദാരുകൊണ്ടുള്ള തുലാങ്ങളാലും നിരകളാലും അതിന് മേൽക്കൂരയിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת (habbayit)
  choice: ആലയം
  rationale: സന്ദർഭത്തിൽ ഇത് ശലോമോൻ പണിയുന്ന യഹോവയുടെ ആലയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: וַיְכַלֵּהוּ (wayekhallehu)
  choice: പൂർത്തിയാക്കി
  rationale: ക്രിയയുടെ സമാപനാർഥവും അതിലെ പ്രത്യയത്തിന്റെ ആലയത്തെ സൂചിപ്പിക്കുന്നതും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּסְפֹּן (wayyispōn)
  choice: മേൽക്കൂരയിട്ടു
  rationale: ഈ നിർമ്മാണസന്ദർഭത്തിൽ മുകളിൽ മൂടുക अथवा മേൽക്കൂര പണിയുക എന്ന അർഥം നൽകുന്നു.
- source_word: גֵּבִים (gēbîm)
  choice: തുലാങ്ങൾ
  rationale: അപൂർവമായ ഈ പദം മേൽക്കൂരയുടെ താങ്ങായ മരഘടകങ്ങളെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; ഉറപ്പിലധികം വിശദീകരിക്കാതെ 'തുലാങ്ങൾ' എന്നു നൽകി.
- source_word: שְׂדֵרֹת (śədērōt)
  choice: നിരകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ നിരയോ വരിയോ എന്ന ആശയം നിലനിർത്തുന്നു; അവ എന്തിന്റെ നിരകളാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ നിർവചിച്ചില്ല.
- source_word: בָּאֲרָזִים (bāʾărāzîm)
  choice: ദേവദാരുകൊണ്ടുള്ള
  rationale: നിർമാണഘടകങ്ങളുടെ വസ്തു ദേവദാരുവാണെന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ രണ്ട് നിർമ്മാണഘടകങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുകയും അപൂർവപദങ്ങളുടെ അർഥം അനാവശ്യമായി വികസിപ്പിക്കാതിരിക്കുകയും ചെയ്തു.
