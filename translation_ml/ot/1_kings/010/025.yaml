id: 1KI.10.25
reference: 1 Kings 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: ml
  text: അവർ ഓരോരുത്തരും തങ്ങളുടെ സമ്മാനമായി[a] വെള്ളികൊണ്ടുള്ള വസ്തുക്കൾ, പൊന്നുകൊണ്ടുള്ള വസ്തുക്കൾ, വസ്ത്രങ്ങൾ[b], ആയുധങ്ങൾ[c], സുഗന്ധദ്രവ്യങ്ങൾ, കുതിരകൾ, കോവർകഴുതകൾ എന്നിവ ആണ്ടുതോറും കൊണ്ടുവന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമ്മാനം’ എന്നതിനു പകരം ‘കാഴ്ച’ എന്നോ, രാജകീയ സന്ദർഭത്തിൽ ‘കപ്പം’ എന്നോ പരിഭാഷപ്പെടുത്താം; എബ്രായ പദമായ מִנְחָה സമ്മാനം, വഴിപാട്, കപ്പം എന്നീ അർഥങ്ങൾക്കു വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വസ്ത്രങ്ങൾ’ എന്നതിനു പകരം ‘മേലങ്കികൾ’ എന്നോ ‘അങ്കികൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ആയുധങ്ങൾ’ എന്നതിനു പകരം ‘കവചങ്ങൾ’ എന്നോ വിശാലമായി ‘യുദ്ധോപകരണങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: കൊണ്ടുവന്നിരുന്നു
  rationale: הֵמָּה എന്ന സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം സന്ദർഭത്തിൽ പതിവായി ആവർത്തിച്ചിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ഭൂതകാലത്തിലെ പതിവ് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אִישׁ מִנְחָתוֹ
  choice: ഓരോരുത്തരും താന്താങ്ങളുടെ കാഴ്ചയായി
  rationale: אִישׁ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും מִנְחָה രാജാവിനു നൽകുന്ന സമ്മാനം, വഴിപാട്, കപ്പം എന്നിവയും സൂചിപ്പിക്കാം. രാജകീയ സന്ദർഭത്തിനു യോജിക്കുകയും നിർബന്ധിത കപ്പം എന്ന ആശയം അമിതമായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നതിനാൽ ‘കാഴ്ച’ തിരഞ്ഞെടുത്തു.
- source_word: כְּלֵי כֶסֶף
  choice: വെള്ളികൊണ്ടുള്ള വസ്തുക്കൾ
  rationale: כְּלִי പാത്രം, ഉപകരണം, വസ്തു തുടങ്ങിയ വിശാല അർഥമുള്ള പദമാണ്; നിർദിഷ്ട രൂപം പറയാത്തതിനാൽ ‘വസ്തുക്കൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וּכְלֵי זָהָב
  choice: പൊന്നുകൊണ്ടുള്ള വസ്തുക്കൾ
  rationale: വെള്ളിവസ്തുക്കളോടുള്ള സമാന്തരതയും כְּלִי എന്ന പദത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
- source_word: שְׂלָמוֹת
  choice: വസ്ത്രങ്ങൾ
  rationale: പുറങ്കുപ്പായങ്ങളെയോ മേലങ്കികളെയോ സൂചിപ്പിക്കാവുന്ന പദമാണെങ്കിലും പൊതുവായ പട്ടികയിൽ ‘വസ്ത്രങ്ങൾ’ സ്വാഭാവികവും ആവശ്യമായ അർഥവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: נֵשֶׁק
  choice: ആയുധങ്ങൾ
  rationale: ഈ പദം യുദ്ധോപകരണങ്ങളെയോ ആയുധങ്ങളെയോ കവചങ്ങളെയോ സൂചിപ്പിക്കാം; ആധുനിക മലയാളത്തിൽ ‘ആയുധങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְשָׂמִים
  choice: സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: വ്യാപാരത്തിലോ കാഴ്ചയിലോ ഉൾപ്പെടുന്ന സുഗന്ധമുള്ള മസാലകളും സുഗന്ധവസ്തുക്കളും ഉൾക്കൊള്ളുന്ന വിശാലമായ മലയാളപ്രയോഗം.
- source_word: סוּסִים
  choice: കുതിരകൾ
  rationale: പദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: פְרָדִים
  choice: കോവർകഴുതകൾ
  rationale: ആൺകഴുതയും പെൺകുതിരയും തമ്മിലുള്ള സങ്കരജന്തുവായ mule-നെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ആണ്ടുതോറും
  rationale: ഓരോ വർഷവും പതിവായി സംഭവിച്ച ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ പട്ടികാക്രമം നിലനിർത്തി; ആവർത്തിച്ചിരുന്ന പതിവ് ‘കൊണ്ടുവന്നിരുന്നു’ എന്നും വാർഷികത ‘ആണ്ടുതോറും’ എന്നും വ്യക്തമാക്കി. പ്രധാന പാഠത്തിൽ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് തൊട്ടുപിന്നിൽ ചേർത്തിരിക്കുന്നു.
