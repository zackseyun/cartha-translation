  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: ml
  text: ശലോമോൻ അവളുടെ എല്ലാ ചോദ്യങ്ങൾക്കെല്ലാം ഉത്തരം പറഞ്ഞു[a]. രാജാവിന് മറഞ്ഞിരുന്നിട്ട് അദ്ദേഹം അവളോടു പറയാതിരുന്ന ഒരു കാര്യവും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ശലോമോൻ അവളുടെ എല്ലാ വാക്കുകളും/കാര്യങ്ങളും അവളോടു പറഞ്ഞു.” സന്ദർഭത്തിൽ ഇത് രാജ്ഞിയുടെ ചോദ്യങ്ങൾക്കു ശലോമോൻ നൽകിയ ഉത്തരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: ഉത്തരം പറഞ്ഞു
  rationale: נגד എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അറിയിക്കുക/പറയുക’ എന്നാണെങ്കിലും, രാജ്ഞി ദുഷ്കരമായ ചോദ്യങ്ങളാൽ ശലോമോനെ പരീക്ഷിക്കുന്ന സന്ദർഭത്തിൽ ഇത് അവളുടെ അന്വേഷണങ്ങൾക്ക് മറുപടി നൽകിയതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: דְּבָרֶיהָ
  choice: അവളുടെ എല്ലാ ചോദ്യങ്ങൾക്കും
  rationale: דבר എന്ന പദത്തിന് ‘വാക്ക്, കാര്യം’ തുടങ്ങിയ വിശാലാർഥങ്ങളുണ്ട്. മുൻസന്ദർഭത്തിലെ ദുഷ്കരമായ ചോദ്യങ്ങളെ പരിഗണിച്ച് ഇവിടെ ‘ചോദ്യങ്ങൾ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: ഒന്നും രാജാവിന് മറഞ്ഞിരുന്നില്ല
  rationale: ‘രാജാവിൽനിന്ന് മറഞ്ഞിരുന്ന ഒരു കാര്യവും ഉണ്ടായിരുന്നില്ല’ എന്ന എബ്രായ ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്; ‘രാജാവ്’ എന്ന മൂലപദവും മറച്ചുവെക്കപ്പെട്ടതിന്റെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: അവളോടു വിശദീകരിച്ചുപറയാൻ കഴിയാത്ത
  rationale: ബന്ധവാക്യം ശലോമോന് അവളോട് വെളിപ്പെടുത്താനോ വിശദീകരിക്കാനോ കഴിയാത്ത കാര്യമൊന്നും ഉണ്ടായിരുന്നില്ല എന്ന ആശയം നൽകുന്നു. ആവർത്തനം ഒഴിവാക്കി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
