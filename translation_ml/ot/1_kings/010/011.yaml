  text: ഓഫീരിൽനിന്ന് സ്വർണം കൊണ്ടുവന്ന ഹീരാമിന്റെ കപ്പൽപ്പടയും[a] ഓഫീരിൽനിന്ന് അൽമുഗ് മരത്തടി വളരെ അധികവും[b] വിലയേറിയ കല്ലുകളും കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ഹീരാമിന്റെ കപ്പൽ”; എബ്രായനാമം ഏകവചനമാണെങ്കിലും ഹീരാമിന്റെ സമുദ്രഗതാഗതസംവിധാനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “അൽമുഗ്” എന്നതിന് “അൽഗും” എന്നും പറയാറുണ്ട്; ഏതു വൃക്ഷവർഗമാണെന്ന് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: കപ്പൽപ്പടയും
  rationale: മുൻവിവരണത്തോടു പുതിയ വിവരത്തെ കൂട്ടിച്ചേർക്കുന്ന ‘കൂടാതെ/അതുപോലെ’ എന്ന ആശയം മലയാളത്തിലെ ‘-യും’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֳנִי חִירָם
  choice: ഹീരാമിന്റെ കപ്പൽപ്പട
  rationale: നാമം രൂപത്തിൽ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ഹീരാമിന്റെ സമുദ്രഗതാഗതസംവിധാനത്തെ കൂട്ടമായി സൂചിപ്പിക്കാം; അതിനാൽ സ്വാഭാവികമായ കൂട്ടർത്ഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: സ്വർണം കൊണ്ടുവന്ന
  rationale: נשׂא എന്ന ക്രിയയുടെ ‘വഹിക്കുക/കൊണ്ടുവരുക’ എന്ന അർത്ഥം കടൽമാർഗമുള്ള ചരക്കുനീക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מֵאוֹפִיר
  choice: ഓഫീരിൽനിന്ന്
  rationale: സ്ഥലനാമവും ‘നിന്ന്’ എന്ന ഉറവിടസൂചക മുൻപ്രത്യയത്തിന്റെ അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: הֵבִיא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കൊണ്ടുവരുക’ എന്ന സാധാരണ അർത്ഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: അൽമുഗ് മരത്തടി
  rationale: കൃത്യമായ വൃക്ഷവർഗം അനിശ്ചിതമായതിനാൽ പ്രത്യേക സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ ചുമത്താതെ എബ്രായപദത്തെ ലിപ്യന്തരണം ചെയ്യുന്നു; ചരക്കായി കൊണ്ടുവന്ന മരവസ്തുവെന്ന അർത്ഥത്തിന് ‘മരത്തടി’ സ്വാഭാവികമാണ്.
- source_word: הַרְבֵּה מְאֹד
  choice: വളരെ വലിയ അളവിൽ
  rationale: അളവിന്റെ സമൃദ്ധിയെ ശക്തമായി ഊന്നുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְאֶבֶן יְקָרָה
  choice: വിലയേറിയ കല്ലുകളും
  rationale: എബ്രായത്തിലെ രൂപപരമായ ഏകവചനം ചരക്കുപട്ടികയിൽ കൂട്ടർത്ഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിക്കുന്നു; ‘വിലയേറിയ’ എന്നത് മൂലപദത്തിന്റെ മൂല്യാർഥം നിലനിർത്തുന്നു.
