id: 1KI.10.18
reference: 1 Kings 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב מוּפָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: ml
  text: പിന്നെ രാജാവ് ആനക്കൊമ്പ് കൊണ്ടുള്ള ഒരു വലിയ സിംഹാസനം ഉണ്ടാക്കി; അതിനു മേൽ മേന്മയേറിയ സ്വർണം പൊതിഞ്ഞു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുദ്ധസ്വർണം’ അല്ലെങ്കിൽ ‘നല്ല സ്വർണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: പിന്നെ ... ഉണ്ടാക്കി
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘പിന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ശലോമോനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട രാജപദവി; മലയാളത്തിൽ സ്വാഭാവികമായി നിർദിഷ്ടത പ്രകടമാണ്.
- source_word: כִּסֵּא
  choice: സിംഹാസനം
  rationale: രാജകീയ സന്ദർഭത്തിൽ പൊതുവായ ‘ഇരിപ്പിടം’ എന്നതിനെക്കാൾ ‘സിംഹാസനം’ കൃത്യമാണ്.
- source_word: שֵׁן
  choice: ആനക്കൊമ്പുകൊണ്ട്
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘പല്ല്’ എന്നാണെങ്കിലും, നിർമാണവസ്തുവിനെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിൽ ആനക്കൊമ്പാണ് ഉദ്ദേശ്യം; ‘കൊണ്ട്’ ചേർക്കുന്നത് വസ്തുസംബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: גָּדוֹל
  choice: മഹത്തായ
  rationale: വലുപ്പവും രാജകീയ പ്രൗഢിയും ഒരുപോലെ ഉൾക്കൊള്ളാൻ ‘വലിയ’ എന്നതിനെക്കാൾ ‘മഹത്തായ’ അനുയോജ്യം.
- source_word: וַיְצַפֵּהוּ
  choice: അതിനെ ... പൊതിഞ്ഞു
  rationale: צפה എന്ന ക്രിയ ഇവിടെ ഒരു വസ്തുവിന്റെ മേൽ മറ്റൊരു വസ്തു ആവരണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പൊതിഞ്ഞു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കരകൗശലസന്ദർഭത്തിൽ യോജിച്ചതുമാണ്.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: ലോഹത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ ആധുനിക മലയാളപദം.
- source_word: מוּפָז
  choice: ശുദ്ധീകരിച്ച
  rationale: ഉയർന്ന ഗുണമേന്മയുള്ള, ശുദ്ധീകരിക്കപ്പെട്ട സ്വർണം എന്ന ആശയം നൽകുന്നു; പദത്തിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
