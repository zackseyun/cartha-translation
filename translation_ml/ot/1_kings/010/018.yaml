  to: പിന്നെ രാജാവ് ആനക്കൊമ്പ് കൊണ്ടുള്ള ഒരു വലിയ സിംഹാസനം ഉണ്ടാക്കി; അതിനു മേൽ മേന്മയേറിയ സ്വർണം പൊതിഞ്ഞു[a].
