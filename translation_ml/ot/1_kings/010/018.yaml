translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജകീയ പ്രൗഢി നിലനിർത്താൻ ‘മഹത്തായ സിംഹാസനം’ ഉപയോഗിച്ചു; സാങ്കേതികമായി കടുപ്പമുള്ള പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
