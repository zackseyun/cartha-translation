source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה לֹא בָא֩ כַ/בֹּ֨שֶׂם הַ/ה֥וּא עוֹד֙ לָ/רֹ֔ב אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: ml
  text: അവൾ രാജാവിന് നൂറ്റിയിരുപത് താലന്ത് സ്വർണവും[a] വളരെ വലിയ അളവിൽ സുഗന്ധദ്രവ്യങ്ങളും വിലയേറിയ കല്ലുകളും കൊടുത്തു. ശേബാ രാജ്ഞി രാജാവായ ശലോമോന് നൽകിയതുപോലെ ഇത്ര സമൃദ്ധിയായി സുഗന്ധദ്രവ്യങ്ങൾ പിന്നീടൊരിക്കലും വന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താലന്ത്’ ഒരു പുരാതന ഭാരമാനമാണ്; അതിന്റെ കൃത്യഭാരം കാലവും പ്രദേശവും അനുസരിച്ച് വ്യത്യാസപ്പെട്ടിരുന്നു.
    reason: ancient_measure
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: അവൾ ... കൊടുത്തു
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല ക്രിയ ഇതു വ്യക്തമാക്കുന്നു.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: നൂറ്റിയിരുപത് താലന്ത് സ്വർണം
  rationale: כִּכָּר പുരാതന ഭാരമാനമാണ്; അനിശ്ചിതമായ ആധുനിക പരിവർത്തനം ഒഴിവാക്കി പരമ്പരാഗതമായ ‘താലന്ത്’ നിലനിർത്തുന്നു.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: വളരെ വലിയ അളവിൽ സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: בְּשָׂמִים സുഗന്ധമുള്ള മസാലകളെയോ സുഗന്ധവസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നു; הַרְבֵּה מְאֹד അളവിനെ ശക്തമായി ഊന്നുന്നു.
- source_word: וְאֶבֶן יְקָרָה
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: എബ്രായത്തിലെ ഏകവചനം ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: לֹא בָא ... עוֹד
  choice: പിന്നീടൊരിക്കലും വന്നിട്ടില്ല
  rationale: בוא ഇവിടെ എത്തുക അഥവാ കൊണ്ടുവരപ്പെടുക എന്ന അർഥത്തിലാണ്; നിഷേധവും עוֹד-ഉം ചേർന്ന് ‘പിന്നീട് ഒരിക്കലും ഇല്ല’ എന്ന ആശയം നൽകുന്നു.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: അതുപോലെ അത്രയധികം സുഗന്ധദ്രവ്യങ്ങൾ
  rationale: ഏകവചനമായ בֹּשֶׂם സമൂഹവാചകമായി എടുത്ത്, לָרֹב സൂചിപ്പിക്കുന്ന അസാധാരണമായ അളവ് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מַלְכַּת שְׁבָא
  choice: ശെബാരാജ്ഞി
  rationale: സ്ഥലനാമവും പദവിയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻരാജാവിന്
  rationale: പദവിയും പേരും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
