translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന അളവായ ‘താലന്ത്’ സുതാര്യതയ്ക്കായി നിലനിർത്തി; സമൂഹവാചകമായ എബ്രായ ഏകവചനങ്ങൾ ആവശ്യമായിടത്ത് സ്വാഭാവികമായ മലയാള ബഹുവചനമായി നൽകി.
