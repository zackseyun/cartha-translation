  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ വന്ന് സ്വന്തം കണ്ണുകളാൽ കാണുന്നതുവരെ ആ വാർത്തകൾ വിശ്വസിച്ചില്ല. ഇതാ, പകുതിപോലും എന്നോടു പറഞ്ഞിരുന്നില്ല. ജ്ഞാനത്തിലും സമൃദ്ധിയിലും[a] ഞാൻ കേട്ട വാർത്തയെ അങ്ങ് മറികടന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജ്ഞാനത്തിലും സമ്പത്തിലും ഞാൻ കേട്ട വാർത്തയെ അങ്ങ് മറികടന്നിരിക്കുന്നു.’ എബ്രായത്തിലെ טוֹב എന്ന പദം പൊതുവായ സമൃദ്ധിയെയോ ക്ഷേമത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ശലോമോന്റെ അഭിവൃദ്ധിയുടെ ഭാഗമായി സമ്പത്തും അതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: വിശ്വസിച്ചില്ല
  rationale: ഹിഫിൽ രൂപം ഇവിടെ കേട്ട കാര്യങ്ങളെ സത്യമെന്നോ വിശ്വസനീയമെന്നോ കരുതുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിശ്വസിച്ചില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לַדְּבָרִים
  choice: ആ വാർത്തകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ ശലോമോനെക്കുറിച്ചു പറഞ്ഞുകേട്ട വിവരങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: സ്വന്തം കണ്ണുകളാൽ കാണുന്നതുവരെ
  rationale: ‘എന്റെ കണ്ണുകൾ കണ്ടു’ എന്ന എബ്രായ പ്രയോഗത്തിലെ നേരിട്ടുള്ള ദൃക്സാക്ഷ്യത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ആശ്ചര്യവും ഊന്നലും നൽകുന്ന എബ്രായ വ്യവഹാരചിഹ്നത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: പകുതിപോലും എന്നോടു പറഞ്ഞിരുന്നില്ല
  rationale: വിവരം യാഥാർഥ്യത്തേക്കാൾ വളരെ കുറവായിരുന്നുവെന്ന അതിശയോക്തിപരമായ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הוֹסַפְתָּ
  choice: അങ്ങ് മറികടന്നിരിക്കുന്നു
  rationale: אֶל ചേർന്ന ഈ താരതമ്യഘടനയിൽ ക്രിയയ്ക്ക് ‘കൂടുതലായിരിക്കുക/അതിക്രമിക്കുക’ എന്ന അർഥമാണ്; പൂർത്തിയായ തിരിച്ചറിവും പുരുഷ ഏകവചന ആദരസംബോധനയും നിലനിർത്തുന്നു.
- source_word: חָכְמָה וָטוֹב
  choice: ജ്ഞാനത്തിലും സമൃദ്ധിയിലും
  rationale: חָכְמָה ‘ജ്ഞാനം’ എന്നാണ്. രാജകീയ വിജയത്തിന്റെയും പ്രഭയുടെയും പശ്ചാത്തലത്തിൽ טוֹב പൊതുവായ ക്ഷേമവും അഭിവൃദ്ധിയും സൂചിപ്പിക്കുന്നതിനാൽ ‘സമൃദ്ധി’ തിരഞ്ഞെടുത്തു; ‘സമ്പത്ത്’ എന്ന പരിമിതമായ അർഥവും സാധ്യമാണ്.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: ഞാൻ കേട്ട വാർത്തയെ
  rationale: שְׁמוּעָה ഒരാളെക്കുറിച്ചു കേട്ട വാർത്തയെയോ വിവരത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വാർത്ത’ ഔപചാരികവും നിഷ്പക്ഷവുമാണ്.
