translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. രാജ്ഞി ശലോമോനോടു സംസാരിക്കുന്നതിനാൽ ‘അങ്ങ്’ എന്ന ആദരസംബോധന സ്വീകരിച്ചു. എബ്രായത്തിലെ ആശ്ചര്യസൂചകമായ ‘ഇതാ’ നിലനിർത്തുകയും ടוֹב എന്ന പദത്തിന്റെ വിശാലത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിക്കുകയും ചെയ്തു.
