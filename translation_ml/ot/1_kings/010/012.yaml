id: 1KI.10.12
reference: 1 Kings 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: ml
  text: രാജാവ് അൽമുഗ് മരം[b]കൊണ്ട് യഹ്‌വെയുടെ ആലയത്തിനും രാജകൊട്ടാരത്തിനും വേണ്ട താങ്ങുകളും[a] ഗായകർക്കുവേണ്ടി കിന്നരങ്ങളും വീണകളും ഉണ്ടാക്കി. ഇതുപോലെയുള്ള അൽമുഗ് മരം മുമ്പൊരിക്കലും വന്നിട്ടില്ല; ഇന്നുവരെ കണ്ടിട്ടുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “താങ്ങുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്; അത് പടികൾ, കൈവരികൾ, അല്ലെങ്കിൽ മറ്റേതെങ്കിലും വാസ്തുഘടകം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഈ വിലയേറിയ മരയിനത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്. സമാന്തര പാരമ്പര്യത്തിൽ ഇതിന്റെ പേര് “അൽഗും” എന്ന വ്യത്യസ്ത രൂപത്തിലും കാണപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: അൽമുഗ് മരം
  rationale: വിലയേറിയ ഇറക്കുമതി മരത്തിന്റെ കൃത്യമായ സസ്യശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ, എബ്രായ നാമം ലിപ്യന്തരണം ചെയ്ത് കൂട്ടർത്ഥമുള്ള ഏകവചനമായ ‘മരം’ ഉപയോഗിച്ചു.
- source_word: מִסְעָד
  choice: താങ്ങുകൾ
  rationale: അപൂർവവും അർത്ഥം അനിശ്ചിതവുമായ വാസ്തുശില്പപദമാണിത്. ‘പടികൾ’ അല്ലെങ്കിൽ ‘കൈവരികൾ’ എന്നു പരിമിതപ്പെടുത്താതെ പൊതുവായ വാസ്തുഘടകത്തെ സൂചിപ്പിക്കാൻ ‘താങ്ങുകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לְבֵית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയത്തിന്
  rationale: ‘യഹ്‌വെയുടെ ഭവനം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആലയം’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: രാജകൊട്ടാരത്തിന്
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥം ‘രാജാവിന്റെ ഭവനം’ എന്നാണെങ്കിലും, രാജാവിന്റെ വസതിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കാൻ ‘രാജകൊട്ടാരം’ ഉപയോഗിച്ചു.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: കിന്നരങ്ങളും വീണകളും
  rationale: രണ്ടു വ്യത്യസ്ത തന്ത്രിവാദ്യങ്ങളെ വേർതിരിച്ചുതന്നെ സൂചിപ്പിച്ചു; അവയുടെ കൃത്യമായ ആധുനിക വാദ്യസമാനത നിർണയിക്കാൻ കഴിയാത്തതിനാൽ പരിചിതമായ മലയാള ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു.
- source_word: לַשָּׁרִים
  choice: ഗായകർക്കുവേണ്ടി
  rationale: שׁיר എന്ന ‘പാടുക’ എന്ന ധാതുവിൽനിന്നുള്ള രൂപമായതിനാൽ പൊതുവായ ‘സംഗീതജ്ഞർ’ എന്നതിനെക്കാൾ കൃത്യമായ ‘ഗായകർ’ ഉപയോഗിച്ചു.
- source_word: לֹא בָא כֵן ... וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: ഇതുപോലെയുള്ള ... മുമ്പൊരിക്കലും വന്നിട്ടില്ല; ഇന്നുവരെ കണ്ടിട്ടുമില്ല
  rationale: അത്തരം മരത്തിന്റെ വരവ് അഭൂതപൂർവമായിരുന്നെന്നും ആ സ്ഥിതി ആഖ്യാതാവിന്റെ കാലംവരെ തുടർന്നെന്നും സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു; ‘ഇതുപോലെയുള്ള’ എന്നത് അളവോ ഗുണമോ എന്നു അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ നിലനിർത്തുകയും മലയാളത്തിൽ വായിക്കാവുന്ന രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. അപൂർവമായ വാസ്തുപദത്തിന്റെയും മരയിനത്തിന്റെയും അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നേരിട്ട് നൽകി.
