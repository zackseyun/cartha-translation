  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכַּ֥ר זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: ml
  text: ഒരു വർഷത്തിൽ ശലോമോന് ലഭിച്ച സ്വർണത്തിന്റെ തൂക്കം അറുനൂറ്റി അറുപത്താറ് താലന്ത് സ്വർണമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: താലന്ത് ഭാരത്തിന്റെ ഒരു വലിയ പുരാതന ഏകകമായിരുന്നു; ഈ വാക്യം വാർഷിക അളവ് ആധുനിക ഏകകത്തിലേക്ക് മാറ്റാതെ പുരാതന അളവിൽത്തന്നെ പറയുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ പുതിയ പ്രസ്താവനയെ സ്വാഭാവികമായ മലയാള വാക്യാവസാന ക്രിയയിലൂടെ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത്തരം കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: מִשְׁקַל
  choice: തൂക്കം
  rationale: കണക്കെടുപ്പിന്റെ ഈ സന്ദർഭത്തിൽ സ്വർണത്തിന്റെ ഭാരമോ അളവോ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ആധുനിക മലയാള പദമാണ്.
- source_word: הַזָּהָב ... זָהָב
  choice: സ്വർണത്തിന്റെ ... സ്വർണം
  rationale: ആദ്യ പ്രയോഗം തൂക്കപ്പെട്ട വസ്തുവിനെയും രണ്ടാമത്തേത് താലന്ത് എന്ന അളവിന്റെ വസ്തുവിനെയും വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: ശലോമോന് ലഭിച്ച
  rationale: ശലോമോന്റെ അടുക്കൽ എത്തിച്ചേർന്നത് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ആരാണ് കൊണ്ടുവന്നതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ കർത്താവിനെ നിർണയിക്കുന്നില്ല.
- source_word: בְּשָׁנָה אֶחָת
  choice: ഒരു വർഷത്തിൽ
  rationale: ഒരു വർഷക്കാലയളവിനുള്ളിൽ ലഭിച്ച അളവെന്ന ഹീബ്രു അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: അറുനൂറ്റി അറുപത്താറു
  rationale: ഹീബ്രു സംഖ്യയുടെ നേരിട്ടുള്ള, സാധാരണ മലയാള രൂപം.
- source_word: כִּכַּר
  choice: താലന്ത്
  rationale: പുരാതന ഭാരയൂണിറ്റിന്റെ പരമ്പരാഗതവും പരിചിതവുമായ പേരാണ്; മുഖ്യപാഠത്തിൽ ആധുനിക ഏകകത്തിലേക്ക് അനിശ്ചിതമായ പരിവർത്തനം നടത്തിയിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ കണക്കെടുപ്പ് ശൈലി. ‘ലഭിച്ച’ എന്നത് സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചെങ്കിലും, വരവിന്റെ ഉറവിടമോ പ്രവർത്തകനോ നിർണയിക്കുന്നില്ല. എല്ലാ സംഖ്യകളും വാക്കുകളായി നൽകിയിരിക്കുന്നു.
