revisions:
- from: ഈജിപ്തിൽനിന്ന് ഒരു രഥം ഇറക്കുമതി ചെയ്യുന്നതിന് അറുനൂറ് ശേക്കെൽ വെള്ളിയും ഒരു കുതിരയ്ക്ക് നൂറ്റമ്പത് ശേക്കെൽ വെള്ളിയും വിലയായിരുന്നു.[a] അതുപോലെ, ഹിത്യരുടെ എല്ലാ രാജാക്കന്മാർക്കും അരാമിലെ രാജാക്കന്മാർക്കും അവയെ അവരുടെ ഇടനിലയിലൂടെ കയറ്റുമതി ചെയ്തിരുന്നു.[b]
  to: ഈജിപ്തിൽനിന്ന് ഒരു രഥം അറുനൂറ് ശേക്കെൽ വെള്ളിക്കു ഇറക്കുമതി ചെയ്തിരുന്നു; ഒരു കുതിര നൂറ്റമ്പത് ശേക്കെൽ വെള്ളിക്കുമായിരുന്നു.[a] അങ്ങനെ അവ ഹിത്യരുടെ എല്ലാ രാജാക്കന്മാർക്കും അരാമിലെ രാജാക്കന്മാർക്കും അവരുടെ മുഖാന്തരം കയറ്റുമതി ചെയ്തു.[b]
  rationale: രഥത്തിന്റെ വിലയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതിനായി ‘ഇറക്കുമതി ചെയ്യുന്നതിന്’ എന്ന രൂപം ‘... വെള്ളിക്കു ഇറക്കുമതി ചെയ്തിരുന്നു’ എന്നു തിരുത്തി. മൂലത്തിലെ בְּיָדָם എന്ന പ്രയോഗത്തിന്റെ ഏജൻസി-അവ്യക്തത സംരക്ഷിക്കുന്നതിനായി ‘ഇടനിലയിലൂടെ’ എന്ന ഇടുങ്ങിയ വ്യാഖ്യാനത്തിനു പകരം ‘അവരുടെ മുഖാന്തരം’ ഉപയോഗിച്ചു. വിലകളിലെ സൂചിത ഏകകത്തെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് നിലനിർത്തി; അരാം, ഹിത്യർ എന്നീ പേരുകളും വ്യാപാരസന്ദർഭത്തിലെ കയറ്റുമതി അർഥവും മാറ്റിയിട്ടില്ല.
