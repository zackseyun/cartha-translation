  source_fidelity: വിലനിർണയത്തിലെ വ്യാപാരസന്ദർഭം ‘ഇറക്കുമതി/കയറ്റുമതി’ എന്ന രീതിയിൽ നൽകിയത് യോജിച്ചതാണ്. എന്നാൽ ‘ഒരു രഥം ഇറക്കുമതി ചെയ്യുന്നതിന് ... വിലയായിരുന്നു’ എന്ന രൂപം രഥത്തിന്റെ വിലയ്ക്കുപകരം ഇറക്കുമതി നടത്തുന്നതിനുള്ള ചെലവിനെ സൂചിപ്പിക്കാം. בְּיָדָם-നെ ‘അവരുടെ ഇടനിലയിലൂടെ’ എന്നു നൽകുന്നത് ‘ഇടനിലക്കാർ’ എന്ന കൂടുതൽ ഇടുങ്ങിയ അർഥം ചേർക്കുന്നു; മൂലത്തിലെ ഏജൻസി-സൂചനയും സർവനാമസൂചകത്തിലെ അവ്യക്തതയും നിലനിർത്തണം.
  naturalness: തിരുത്തിയ പാഠത്തിൽ യൂണിറ്റ്-വിലകൾ സ്വാഭാവികമായ സമാന്തരവാക്യങ്ങളായി വരുന്നു. ‘അവരുടെ മുഖാന്തരം’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്; അതേസമയം അതിനെ വ്യാപാര-ഇടനിലക്കാരിൽ ഒതുക്കുന്നില്ല.
  terminology: ‘രഥം,’ ‘ശേക്കെൽ വെള്ളി,’ ‘ഹിത്യർ,’ ‘അരാം’ എന്നിവ അനുയോജ്യമാണ്. ‘അരാം’ എന്ന മൂലസ്ഥാനനാമം നിലനിർത്തിയിരിക്കുന്നു.
  issues:
