    issue: ‘ഒരു രഥം ഇറക്കുമതി ചെയ്യുന്നതിന് ... വിലയായിരുന്നു’
    rationale: ഇത് രഥത്തിന്റെ യൂണിറ്റ് വിലയെന്നതിനു പകരം ഇറക്കുമതിച്ചെലവെന്ന വായന സൃഷ്ടിക്കുന്നു. മൂലപാഠം ഒരു രഥം നിശ്ചിത തുകയ്ക്ക് കൊണ്ടുവന്നു/ഇറക്കുമതി ചെയ്തു എന്നു പറയുന്നു.
  - severity: medium
