source:
  edition: WLC
  text: וַֽ֠/תַּעֲלֶה וַ/תֵּצֵ֨א מֶרְכָּבָ֤ה מִ/מִּצְרַ֨יִם֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַ/חִתִּ֛ים וּ/לְ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יֹצִֽאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: ml
  text: ഈജിപ്തിൽനിന്ന് ഒരു രഥം അറുനൂറ് ശേക്കെൽ വെള്ളിക്കു ഇറക്കുമതി ചെയ്തിരുന്നു; ഒരു കുതിര നൂറ്റമ്പത് ശേക്കെൽ വെള്ളിക്കുമായിരുന്നു.[a] അങ്ങനെ അവ ഹിത്യരുടെ എല്ലാ രാജാക്കന്മാർക്കും അരാമിലെ രാജാക്കന്മാർക്കും അവരുടെ മുഖാന്തരം കയറ്റുമതി ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ വിലകൾ അക്ഷരാർഥത്തിൽ ‘അറുനൂറ് വെള്ളി’, ‘നൂറ്റമ്പത്’ എന്നാണ്; തൂക്ക-നാണയ ഏകകമായ ‘ശേക്കെൽ’ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ചിരിക്കുന്നു.
    reason: implicit_unit
  - marker: b
    text: ‘അവരുടെ മുഖാന്തരം’ എന്നതിന്റെ എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈയാൽ’ എന്നാണ്; ഇത് അവരിലൂടെയോ അവരുടെ പ്രതിനിധികളിലൂടെയോ എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: ഇറക്കുമതി ചെയ്യുന്നതിന്
  rationale: രണ്ടു ചലനക്രിയകളുടെയും അക്ഷരാർഥം ‘കയറിവന്നു/പുറത്തുവന്നു’ എന്നാണെങ്കിലും, ഈജിപ്തിൽനിന്നുള്ള വ്യാപാരസന്ദർഭത്തിൽ സാധനം കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘ഇറക്കുമതി’ ആ അർഥം നൽകുന്നു.
- source_word: מֶרְכָּבָה
  choice: ഒരു രഥം
  rationale: ഏകവചനത്തിലുള്ള വസ്തുവിനുള്ള യൂണിറ്റ് വിലയാണ് പ്രസ്താവിക്കുന്നത്.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: അറുനൂറ് ശേക്കെൽ വെള്ളി
  rationale: എബ്രായത്തിൽ അളവിന്റെ പേര് വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും തൂക്ക-നാണയ ഏകകം ശേക്കെൽ ആണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘വെള്ളി’ എന്ന മൂലപദവും നിലനിർത്തുന്നു.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: ഒരു കുതിരയ്ക്ക് നൂറ്റമ്പത് ശേക്കെൽ വെള്ളി
  rationale: ‘കുതിര’ എന്ന പൊതുവായ അർഥം നിലനിർത്തി; സമാന്തരമായ വിലപ്രസ്താവനയിൽ സൂചിതമായ ശേക്കെലും വെള്ളിയും വ്യക്തതയ്ക്കായി പൂരിപ്പിച്ചു.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: ഹിത്യരുടെ എല്ലാ രാജാക്കന്മാർക്കും
  rationale: സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന לְ സ്വാഭാവിക മലയാളത്തിലെ ദത്തിവിഭക്തിയാൽ നൽകി.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: അരാമിലെ രാജാക്കന്മാർക്കും
  rationale: പരമ്പരാഗതമായ ‘സിറിയ’ എന്ന വ്യാഖ്യാനപരമായ പേരിനു പകരം എബ്രായ സ്ഥലനാമമായ അരാം നിലനിർത്തി.
- source_word: בְּיָדָם
  choice: അവരുടെ ഇടനിലയിലൂടെ
  rationale: അക്ഷരാർഥം ‘അവരുടെ കൈയാൽ’; ഇവിടെ വ്യാപാര ഏജൻസിയെയോ ഇടനിലയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. സർവനാമത്തിന്റെ കൃത്യമായ സൂചകം വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ രൂപം നിലനിർത്തി.
- source_word: יֹצִאוּ
  choice: കയറ്റുമതി ചെയ്തിരുന്നു
  rationale: ഹിഫിൽ രൂപത്തിന്റെ ‘പുറത്തേക്കു കൊണ്ടുപോകുക’ എന്ന കാരണാർഥം ഈ വ്യാപാരസന്ദർഭത്തിൽ ‘കയറ്റുമതി ചെയ്യുക’ എന്നായി സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വ്യാപാരഭാഷ ഉപയോഗിച്ചു. ചലനക്രിയകളെ സന്ദർഭാനുസൃതമായി ‘ഇറക്കുമതി/കയറ്റുമതി’ എന്നു നൽകി; ‘അരാം’ എന്ന മൂലസ്ഥാനനാമവും בְּיָדָם എന്ന പ്രയോഗത്തിലെ ഏജൻസി-അവ്യക്തതയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
