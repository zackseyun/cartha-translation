id: 1KI.10.21
reference: 1 Kings 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: ml
  text: ശലോമോൻ രാജാവിന്റെ പാനപാത്രങ്ങളെല്ലാം സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു; ലെബാനോൻ വനമന്ദിരത്തിലെ പാത്രങ്ങളെല്ലാം ശുദ്ധസ്വർണംകൊണ്ടുള്ളവയായിരുന്നു.[a] ശലോമോന്റെ കാലത്ത് വെള്ളിക്ക് ഒരു വിലയും കൽപ്പിച്ചിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധീകരിച്ച സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു.”
    reason: זָהָב סָגוּר എന്ന പ്രയോഗം സ്വർണത്തിന്റെ ശുദ്ധിയെയോ ശുദ്ധീകരിച്ച ഗുണനിലവാരത്തെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “വെള്ളി ഒന്നായും കണക്കാക്കപ്പെട്ടിരുന്നില്ല.”'
    reason: എബ്രായ മൂലത്തിലെ ‘ഒന്നിനായും കണക്കാക്കപ്പെട്ടില്ല’ എന്ന ശക്തമായ പ്രയോഗം വെള്ളിയുടെ അന്നത്തെ നിസ്സാരമൂല്യം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: പാനപാത്രങ്ങൾ
  rationale: കുടിക്കാനുപയോഗിക്കുന്ന വിവിധതരം പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലമായ പ്രയോഗമാണ്; ‘പാനപാത്രങ്ങൾ’ എന്നത് അതിനെ ‘കപ്പുകൾ’ എന്നു അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം; വാക്യത്തിലെ ആവർത്തനം ശലോമോന്റെ സമ്പത്തും പ്രൗഢിയും ഊന്നിപ്പറയുന്നു.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ലെബാനോൻ വനമന്ദിരം
  rationale: ഒരു പ്രത്യേക രാജകീയ കെട്ടിടത്തിന്റെ പേരുപോലെ ഉപയോഗിച്ചിരിക്കുന്ന ‘ലെബാനോന്റെ വനത്തിന്റെ ഭവനം’ എന്ന എബ്രായ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രൂപം.
- source_word: זָהָב סָגוּר
  choice: ശുദ്ധസ്വർണം
  rationale: സָגוּר ഇവിടെ ഉയർന്ന നിലവാരമുള്ളതോ ശുദ്ധീകരിച്ചതോ ആയ സ്വർണത്തെ സൂചിപ്പിക്കുന്നു; ‘ശുദ്ധസ്വർണം’ ഗുണനിലവാരത്തെ വ്യക്തമാക്കുന്നു, ‘കട്ടിസ്വർണം’ എന്നതുപോലെ ഘടനയെക്കുറിച്ച് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: ഒരു വിലയും കൽപ്പിച്ചിരുന്നില്ല
  rationale: വെള്ളി ഇല്ലായിരുന്നു എന്നല്ല, അതിന് കാര്യമായ മൂല്യമോ പ്രാധാന്യമോ നൽകിയിരുന്നില്ല എന്ന വിലയിരുത്തൽഭാവമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ കാലത്ത്
  rationale: കാലസൂചനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും ആഖ്യാനശൈലിക്ക് യോജിച്ചും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ രാജവൃത്താന്തത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘വനമന്ദിരം’ പ്രത്യേക രാജകീയ കെട്ടിടത്തിന്റെ പേരുപോലുള്ള സ്വഭാവം സംരക്ഷിക്കുന്നു; അവസാന വാക്യം എബ്രായ പ്രയോഗത്തിന്റെ മൂല്യനിർണയഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
