id: 1KI.10.22
reference: 1 Kings 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: ml
  text: രാജാവിന് ഹീരാമിന്റെ കപ്പലുകളോടൊപ്പം കടലിൽ തർശീശ് കപ്പലുകൾ ഉണ്ടായിരുന്നു. മൂന്നു വർഷത്തിലൊരിക്കൽ തർശീശ് കപ്പലുകൾ പൊന്ന്, വെള്ളി, ആനക്കൊമ്പ്, കുരങ്ങുകൾ, മയിലുകൾ[a] എന്നിവ കൊണ്ടുവന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മയിലുകൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; ചിലർ ഇത് മറ്റൊരു വിദേശപ്പക്ഷിയെ സൂചിപ്പിക്കുന്നതായി കരുതുന്നു.
    reason: അപൂർവമായ תֻכִּיִּים എന്ന പദത്തിന്റെ യഥാർഥ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ ഉറപ്പില്ല; ആ ഭാഷാപരമായ അനിശ്ചിതത്വം വായനക്കാരനോട് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: തർശീശ് കപ്പലുകൾ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘തർശീശിന്റെ കപ്പൽ/കപ്പലുകൾ’ എന്ന പ്രയോഗം ലക്ഷ്യസ്ഥാനത്തെയോ ദീർഘദൂര വ്യാപാരക്കപ്പലുകളുടെ തരത്തെയോ സൂചിപ്പിക്കാം. അവ്യക്തത നിലനിർത്താൻ സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ സൂക്ഷിച്ചു.
- source_word: שֶׁנְהַבִּים
  choice: ആനക്കൊമ്പ്
  rationale: ഈ പദം സാധാരണയായി ivory എന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘ആനക്കൊമ്പ്’ അനുയോജ്യം.
- source_word: קֹפִים
  choice: കുരങ്ങുകൾ
  rationale: പദത്തിന്റെ പൊതുവായ അർഥം apes/monkeys ആണ്; ഇനം നിർണ്ണയിക്കാതെ വിശാലമായ മലയാളപദം ഉപയോഗിച്ചു.
- source_word: תֻכִּיִּים
  choice: മയിലുകൾ[a]
  rationale: പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ തിരിച്ചറിയൽ ‘മയിലുകൾ’ ആണെങ്കിലും അപൂർവപദമായതിനാൽ അർഥം പൂർണമായി ഉറപ്പില്ല; അടിക്കുറിപ്പിലൂടെ അത് അറിയിച്ചു.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷത്തിലൊരിക്കൽ
  rationale: എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ‘fleet’ എന്ന വ്യാഖ്യാനപരമായ ഏകവചനത്തിന് പകരം മൂലപാഠത്തിലെ കപ്പൽപ്രയോഗം നിലനിർത്തി; ആദ്യഘട്ടത്തിലെ ഏകവചനസമാഹാരപ്രയോഗവും തുടർന്നുള്ള ക്രിയയുടെ വ്യാകരണസൂചനയും മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി അവതരിപ്പിച്ചു.
