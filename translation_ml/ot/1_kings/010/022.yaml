  source_fidelity: എബ്രായത്തിലെ אֳנִי תַרְשִׁישׁ (‘തർശീശ് കപ്പലുകൾ’), עִם אֳנִי חִירָם (‘ഹീരാമിന്റെ കപ്പലുകളോടൊപ്പം’), אַחַת לְשָׁלֹשׁ שָׁנִים (‘മൂന്നു വർഷത്തിലൊരിക്കൽ’), ചരക്കുപട്ടിക എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ‘കപ്പലുകൾ’ എന്ന ബഹുവചനം മലയാളത്തിൽ സ്വാഭാവികമാണ്; മൂലത്തിലെ കപ്പൽ-പ്രയോഗത്തിന്റെ കൂട്ടായ അർഥത്തോടും ഇംഗ്ലീഷ് POB-യോടും യോജിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ചരിത്രവിവരണശൈലിയിലാണ്. ‘പൊന്ന്, വെള്ളി, ആനക്കൊമ്പ്, കുരങ്ങുകൾ, മയിലുകൾ’ എന്ന പട്ടിക ലളിതവും വായനാസൗകര്യമുള്ളതുമാണ്.
  terminology: ‘തർശീശ്’ എന്ന സ്ഥല/കപ്പൽനാമം വിവർത്തനം ചെയ്യാതെ നിലനിർത്തിയിരിക്കുന്നു. שֶׁנְהַבִּים-ന് ‘ആനക്കൊമ്പ്’യും קֹפִים-ന് ഇനം നിർണ്ണയിക്കാത്ത ‘കുരങ്ങുകൾ’യും ഉചിതമാണ്. അപൂർവമായ תֻכִּיִּים-നെ ‘മയിലുകൾ’ എന്നു നൽകിയതും അതിന്റെ തിരിച്ചറിയൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തിയതും യുക്തമാണ്.
