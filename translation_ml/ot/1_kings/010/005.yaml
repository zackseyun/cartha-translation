source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: ml
  text: അവന്റെ മേശയിലെ ഭക്ഷണവും, അവന്റെ ദാസന്മാരുടെ ഇരിപ്പിടക്രമവും, അവന്റെ പരിചാരകരുടെ സേവനക്രമവും അവരുടെ വസ്ത്രങ്ങളും, അവന്റെ പാനപാത്രവാഹകരും, യഹോവയുടെ ആലയത്തിൽ അവൻ അർപ്പിച്ച ദഹനയാഗവും[a] കണ്ടപ്പോൾ അവളിൽ പിന്നെ ശ്വാസം ശേഷിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെ ആലയത്തിലേക്കുള്ള അവന്റെ കയറിച്ചെല്ലൽ”; അവൻ കയറിപ്പോയ പടിപ്പുരയെയോ ആലയത്തിലേക്കുള്ള ഔപചാരിക ഘോഷയാത്രയെയോ ഇതു സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: അവന്റെ മേശയിലെ ഭക്ഷണം
  rationale: ഭക്ഷിക്കാനുള്ള ആഹാരം എന്ന മൂർത്തമായ അർഥവും രാജമേശയുടെ ദൃശ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: അവന്റെ ദാസന്മാരുടെ ഇരിപ്പിടക്രമം
  rationale: מוֹשָׁב എന്നതിലെ ഇരിപ്പ്/സ്ഥാനം എന്ന ആശയവും രാജസഭയിലെ ക്രമീകരണവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: അവന്റെ ശുശ്രൂഷകരുടെ നിലയുറപ്പ്
  rationale: מַעֲמָד എന്നതിലെ നിൽപ്പ് അഥവാ നിയുക്തസ്ഥാനം എന്ന ആശയം സംരക്ഷിക്കുകയും ഔദ്യോഗിക സേവനക്രമം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מְשָׁרְתָיו
  choice: ശുശ്രൂഷകർ
  rationale: മുൻപുള്ള പൊതുവായ ദാസന്മാരിൽനിന്ന് ഔദ്യോഗികമായി സേവിക്കുന്ന രാജപരിചാരകരെ വേർതിരിക്കുന്നു.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: അവരുടെ വസ്ത്രങ്ങൾ
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַשְׁקָיו
  choice: അവന്റെ പാനപാത്രവാഹകർ
  rationale: രാജസഭാപശ്ചാത്തലത്തിൽ പാനം വിളമ്പുന്ന ഉദ്യോഗസ്ഥരെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; പാനീയങ്ങൾ എന്നതിനെക്കാൾ വ്യക്തിസൂചന ഇവിടെ യോജിക്കുന്നു.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയത്തിൽ അവൻ അർപ്പിച്ച ദഹനയാഗം
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങൾ അനുസരിച്ചുള്ള ‘ദഹനയാഗം’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ‘കയറ്റം/കയറിപ്പോകൽ’ എന്ന യഥാർഥ പാഠസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ‘യഹോവയുടെ ഭവനം’ എന്ന അക്ഷരാർഥത്തെ സന്ദർഭത്തിലെ ദേവാലയസൂചനയോടെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: רוּחַ
  choice: ശ്വാസം
  rationale: വിസ്മയംകൊണ്ട് ശ്വാസം മുട്ടിയ അവസ്ഥ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: അവളിൽ ശ്വാസം ശേഷിച്ചില്ല
  rationale: അതിശയഭരിതയായ അവളുടെ അവസ്ഥ വ്യക്തമാകുന്ന വിധത്തിൽ എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: പാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: עֹלָתוֹ എന്ന പദത്തിന്റെ വ്യാഖ്യാനം
  choice: അവന്റെ ദഹനയാഗം
  alternative: യഹോവയുടെ ആലയത്തിലേക്കുള്ള അവന്റെ കയറ്റം, അഥവാ അവൻ കയറിപ്പോയ പടിപ്പുര
  rationale: മസോററ്റിക് സ്വരീകരണം ‘ദഹനയാഗം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ വ്യഞ്ജനപാഠം ‘കയറ്റം’ എന്ന വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ ആ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജസഭയിലെ ക്രമീകരണങ്ങളെ വ്യക്തമാക്കാൻ ‘ഇരിപ്പിടക്രമം’, ‘നിലയുറപ്പ്’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം മുൻസന്ദർഭത്തിൽ ആരംഭിച്ച ‘കണ്ടപ്പോൾ’ എന്ന ഘടനയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ അത് തുറന്നുപറഞ്ഞ് വായന സുഗമമാക്കി.
