    issue: The final verb “നിർത്തി” is semantically weaker and potentially misleading for military stationing.
    rationale: וַיַּנְחֵם denotes placing or stationing the forces. “നിയോഗിച്ചു” naturally conveys assignment/deployment without adding details.
