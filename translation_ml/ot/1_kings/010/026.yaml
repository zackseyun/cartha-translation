base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ml
  text: ശലോമോൻ രഥങ്ങളും കുതിരപ്പടയാളികളെയും[a] ശേഖരിച്ചു. അവന് 1,400 രഥങ്ങളും 12,000 കുതിരപ്പടയാളികളും ഉണ്ടായിരുന്നു. അവൻ അവരെ രഥനഗരങ്ങളിലും യെരൂശലേമിൽ രാജാവിനോടൊപ്പവും നിയോഗിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുതിരപ്പട’; എബ്രായപദം കൂടുതൽ അക്ഷരാർഥത്തിൽ കുതിരപ്പുറത്തുള്ള യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: ശേഖരിച്ചു
  rationale: אסף എന്ന ക്രിയ ഇവിടെ സൈനിക വിഭവങ്ങൾ ഒരുമിച്ചുകൂട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ശേഖരിച്ചു’ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: רֶכֶב
  choice: രഥങ്ങൾ
  rationale: ഏകവചനരൂപം സമൂഹവാചകമായി ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും സംഖ്യയോടുകൂടിയ സന്ദർഭത്തിൽ ‘രഥങ്ങൾ’ എന്ന ബഹുവചനം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: פָרָשִׁים
  choice: കുതിരപ്പടയാളികൾ
  rationale: ഈ നാമം കുതിരകളെയല്ല, കുതിരപ്പുറത്തു സഞ്ചരിക്കുന്ന സൈനികരെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കുതിരപ്പടയാളികൾ’ തിരഞ്ഞെടുത്തു.
- source_word: וַיְהִי לוֹ
  choice: അവന് ... ഉണ്ടായിരുന്നു
  rationale: കൈവശമുണ്ടായിരിക്കുക എന്ന ആശയം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 രഥങ്ങൾ
  rationale: സംഖ്യാവാക്യം ആധുനിക മലയാളത്തിൽ നേരിട്ടും വ്യക്തമായും നൽകിയിരിക്കുന്നു.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 കുതിരപ്പടയാളികൾ
  rationale: സംഖ്യ നേരിട്ട് നൽകിയതോടൊപ്പം פָרָשִׁים എന്ന പദത്തിന്റെ അർത്ഥം വാക്യത്തിലുടനീളം ഒരേവിധം നിലനിർത്തി.
- source_word: וַיַּנְחֵם
  choice: അവൻ അവരെ ... നിർത്തി
  rationale: נוח എന്ന ക്രിയയുടെ ഹിഫീൽരൂപം ഇവിടെ സൈനികരെ നിശ്ചിത സ്ഥലങ്ങളിൽ നിലയുറപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘നിർത്തി’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: രഥനഗരങ്ങളിൽ
  rationale: രഥസേനയുമായി ബന്ധപ്പെട്ട് പ്രത്യേകം നിയോഗിക്കപ്പെട്ട നഗരങ്ങളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്ഥാപിതവുമായ പ്രയോഗമാണിത്.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: യെരൂശലേമിൽ രാജാവിനോടൊപ്പവും
  rationale: സേനയുടെ ഒരു ഭാഗം യെരൂശലേമിൽ രാജാവിന്റെ സമീപം നിർത്തിയിരുന്നുവെന്ന ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
