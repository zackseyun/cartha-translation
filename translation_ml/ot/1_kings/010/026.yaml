translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. സൈനിക പദാവലിയിൽ കൃത്യത നിലനിർത്തിക്കൊണ്ട് എബ്രായവാക്യത്തിന്റെ ആവർത്തനവും ഘടനയും സ്വാഭാവിക മലയാളത്തിലാക്കി.
