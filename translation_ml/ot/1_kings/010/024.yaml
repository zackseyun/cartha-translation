source:
  edition: WLC
  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: ml
  text: ദൈവം അവന്റെ ഹൃദയത്തിൽ നൽകിയിരുന്ന ജ്ഞാനം കേൾക്കാൻ ഭൂമിയിലെ സകലരും ശലോമോന്റെ സന്നിധി[a] തേടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ശലോമോന്റെ മുഖം തേടി’; അദ്ദേഹത്തെ നേരിൽ കാണാനോ അദ്ദേഹവുമായി കൂടിക്കാഴ്ച നേടാനോ ശ്രമിച്ചു എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָרֶץ
  choice: ഭൂമിയിലെ സകലരും
  rationale: രാജകീയ പശ്ചാത്തലത്തിലെ ഈ വിശാലമായ സമൂഹവാചകം അറിയപ്പെട്ടിരുന്ന ലോകത്തിലെ ജനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ഭൂമി മുഴുവനും’ എന്നതിനെക്കാൾ വ്യക്തികളെ കർത്താവായി കാണിക്കുന്ന ‘ഭൂമിയിലെ സകലരും’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; അതിശയോക്തിപരമായ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: מְבַקְשִׁים
  choice: തേടി
  rationale: ഹീബ്രു കൃദന്തം പതിവായോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനസംഗ്രഹത്തിൽ മലയാളത്തിലെ ഭൂതകാലരൂപമായ ‘തേടി’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֶת פְּנֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ സന്നിധി
  rationale: അക്ഷരാർഥം ‘ശലോമോന്റെ മുഖം’ എന്നാണ്; എന്നാൽ പ്രയോഗത്തിന്റെ അർഥം അദ്ദേഹത്തെ നേരിൽ കാണാനോ അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ പ്രവേശിക്കാനോ ശ്രമിക്കുക എന്നതാണ്. ‘സന്നിധി’ ഹീബ്രു ദൃശ്യഭാവം ഒരു പരിധിവരെ നിലനിർത്തുകയും മലയാളത്തിൽ അർഥവത്താകുകയും ചെയ്യുന്നു.
- source_word: לִ/שְׁמֹעַ
  choice: കേൾക്കേണ്ടതിന്
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ഹീബ്രു അനന്തരൂപത്തെ മലയാളത്തിൽ വ്യക്തവും dignifiedവുമായ ഉദ്ദേശ്യപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: חָכְמָת/וֹ
  choice: അവന്റെ … ജ്ഞാനം
  rationale: ഹീബ്രുവിലെ ഏകവചന ഉടമസ്ഥപ്രത്യയം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ശലോമോനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: ദൈവം … നൽകിയിരുന്ന
  rationale: נָתַן എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘നൽകുക’ നിലനിർത്തുന്നു. ജനങ്ങൾ കേൾക്കാൻ ശ്രമിക്കുന്നതിന് മുമ്പേ ജ്ഞാനം നൽകപ്പെട്ടിരുന്നു എന്ന കാലബന്ധം ‘നൽകിയിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: בְּ/לִבּ/וֹ
  choice: അവന്റെ ഹൃദയത്തിൽ
  rationale: ഹീബ്രു ചിന്തയിൽ ‘ഹൃദയം’ ബുദ്ധി, ഇച്ഛ, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളുന്നു. അതിനെ ‘മനസ്സ്’ എന്നാക്കി ചുരുക്കാതെ ഉറവിടത്തിന്റെ മനുഷ്യദർശനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമനാമമല്ലാത്ത സാഹചര്യത്തിൽ אֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: യഹോവ / കർത്താവ്
  rationale: ഇവിടെ ഉറവിടപാഠം അֱלֹהִים ആണ് ഉപയോഗിക്കുന്നത്, ദൈവനാമമായ יהוה അല്ല. അതിനാൽ ‘ദൈവം’ എന്നത് മൂലപാഠത്തിലെ പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സകലരും’, ‘സന്നിധി’, ‘കേൾക്കേണ്ടതിന്’ എന്നിവ വാക്യത്തിന് തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; എങ്കിലും അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
