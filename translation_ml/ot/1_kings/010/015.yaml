  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/בַד֙ מֵ/אַנְשֵׁ֣י הַ/תָּרִ֔ים וּ/מִסְחַ֖ר הָ/רֹכְלִ֑ים וְ/כָל מַלְכֵ֥י הָ/עֶ֖רֶב וּ/פַח֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: ml
  text: സഞ്ചരിക്കുന്ന വ്യാപാരികളിൽനിന്നും[a], കച്ചവടക്കാരുടെ വ്യാപാരത്തിൽനിന്നും, അറേബ്യയിലെ സകല രാജാക്കന്മാരിൽനിന്നും[b], ദേശത്തിലെ ഭരണാധികാരികളിൽനിന്നും[c] ലഭിച്ചിരുന്നതിനു പുറമെയായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുറ്റിസഞ്ചരിച്ചിരുന്ന ആളുകളിൽനിന്ന്.’ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; പൊതുവായി സഞ്ചാരികളായ കച്ചവടക്കാരെ ഇത് സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കലർന്ന ജനവിഭാഗങ്ങളുടെ സകല രാജാക്കന്മാരിൽനിന്നും.’ എബ്രായപദത്തിന് ചില സന്ദർഭങ്ങളിൽ ആ അർഥം വരാമെങ്കിലും ഇവിടെ ‘അറേബ്യ’ എന്നതാണ് കൂടുതൽ യോജിച്ചത്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘പ്രവിശ്യാധിപന്മാരിൽനിന്നും’ അല്ലെങ്കിൽ ‘സത്രാപന്മാരിൽനിന്നും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: ഇതിനു പുറമേയായിരുന്നു
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വാർഷിക സ്വർണവരുമാനത്തിനു പുറമേ ലഭിച്ച മറ്റു വരുമാനസ്രോതസ്സുകളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: സഞ്ചാരവ്യാപാരികളിൽനിന്നു ലഭിച്ചതും
  rationale: ഈ ദുഷ്കരമായ എബ്രായ പ്രയോഗം സഞ്ചരിക്കുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു; വാണിജ്യസന്ദർഭത്തിൽ യാത്രചെയ്തു വ്യാപാരം നടത്തുന്നവരെന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്. വരുമാനസ്രോതസ്സ് വ്യക്തമാക്കാൻ ‘ലഭിച്ചതും’ ചേർത്തിരിക്കുന്നു.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: കച്ചവടക്കാരുടെ വ്യാപാരത്തിൽനിന്നു ലഭിച്ചതും
  rationale: מִסְחַר വാണിജ്യമോ വ്യാപാര ഇടപാടുകളോ എന്നും רֹכְלִים വ്യാപാരികൾ/കച്ചവടക്കാർ എന്നും അർഥമാക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപമാണിത്.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: അറേബ്യയിലെ സകല രാജാക്കന്മാരിൽനിന്നും
  rationale: ഈ ഭൗമരാഷ്ട്രീയ പട്ടികയിൽ עֶרֶב അറേബ്യയെയോ അറേബ്യൻ ജനവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്; ‘കലർന്ന ജനങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: ദേശത്തിലെ ഭരണാധികാരികളിൽനിന്നും
  rationale: פַּחוֹת മേലധികാരത്തിനു കീഴിലുള്ള പ്രാദേശിക ഭരണകർത്താക്കളെ സൂചിപ്പിക്കുന്നു. ‘ഭരണാധികാരികൾ’ വ്യക്തവും കാലഘട്ടപരമായി അതിവിശിഷ്ടമല്ലാത്തതുമായ മലയാളപ്രയോഗമാണ്.
