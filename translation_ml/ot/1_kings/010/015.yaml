translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ രാജകീയ-സാമ്പത്തിക സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. എബ്രായത്തിലെ ദുഷ്കരമായ വ്യാപാരപ്രയോഗവും עֶרֶב എന്ന പദത്തിന്റെ ബദൽസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
