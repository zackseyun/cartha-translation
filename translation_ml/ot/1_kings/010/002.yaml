source:
  edition: WLC
  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: ml
  text: അവൾ അതിവലിയൊരു പരിവാരവുമായി[a] യെരൂശലേമിലെത്തി. സുഗന്ധദ്രവ്യങ്ങൾ വഹിച്ച ഒട്ടകങ്ങളും വളരെയധികം സ്വർണവും വിലയേറിയ കല്ലുകളും അവളോടൊപ്പമുണ്ടായിരുന്നു. അവൾ ശലോമോന്റെ അടുക്കൽ വന്ന് തന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നതെല്ലാം അവനോടു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതിവലിയൊരു അനുചരസംഘവുമായി’; കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വളരെ വലിയ സമ്പത്ത്/ശക്തിയുമായി.’ എബ്രായപദമായ חַיִל സമ്പത്ത്, ശക്തി, സൈന്യം, അല്ലെങ്കിൽ വലിയൊരു സംഘം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: അതിവലിയൊരു പരിവാരവുമായി
  rationale: חַיִל എന്നതിന് സമ്പത്ത്, ശക്തി, സൈന്യം, വലിയ അനുചരസംഘം എന്നീ അർഥങ്ങൾ വരാം. രാജകീയ യാത്രയുടെ ഈ സന്ദർഭത്തിൽ സൈനികബലം മാത്രം സൂചിപ്പിക്കാതെ കൂടെയുണ്ടായിരുന്ന വിപുലമായ സംഘത്തെ ‘പരിവാരം’ സ്വാഭാവികമായി അറിയിക്കുന്നു; כָּבֵד מְאֹד സൂചിപ്പിക്കുന്ന അസാധാരണ വലുപ്പം ‘അതിവലിയൊരു’ നിലനിർത്തുന്നു.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: സുഗന്ധദ്രവ്യങ്ങൾ ... വഹിക്കുന്ന ഒട്ടകങ്ങൾ
  rationale: നിരന്തര വിവരണസ്വഭാവമുള്ള എബ്രായ കർത്തൃവാചകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘വഹിക്കുന്ന’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു. בְּשָׂמִים ഇവിടെ സുഗന്ധമുള്ള വിലപിടിപ്പുള്ള ദ്രവ്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְזָהָב רַב מְאֹד
  choice: വളരെയധികം സ്വർണം
  rationale: רַב מְאֹד അളവിന്റെ അത്യധികതയെ ഊന്നുന്നു; ‘വളരെയധികം’ ആ ഊന്നൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְאֶבֶן יְקָרָה
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: אֶבֶן ഏകവചനത്തിലാണെങ്കിലും ഇവിടെ സമൂഹവാചകമായി വരുന്നു. അതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്; ‘രത്നങ്ങൾ’ എന്നതിനെക്കാൾ ‘വിലയേറിയ കല്ലുകൾ’ മൂലരൂപത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: അവൾ ശലോമോന്റെ അടുക്കൽവന്ന്
  rationale: ആദ്യത്തെ യെരൂശലേമിലേക്കുള്ള വരവിനുശേഷം ശലോമോനെ സമീപിക്കുന്ന രണ്ടാമത്തെ ഘട്ടം ആവർത്തിച്ച וַתָּבֹא വ്യക്തമാക്കുന്നു; ‘അടുക്കൽവന്ന്’ ഈ ആവർത്തനവും പുരോഗതിയും നിലനിർത്തുന്നു.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: അവനോടു സംസാരിച്ചു
  rationale: אֶל അടിസ്ഥാനമായി ‘അവനോട്’ എന്ന ദിശ സൂചിപ്പിച്ചാലും ‘സംസാരിച്ചു’ എന്ന ക്രിയയോടൊപ്പം ‘അവനോടു’ സ്വാഭാവിക മലയാളമാണ്; പൂർണമായ പരസ്പരസംഭാഷണം അനിവാര്യമായി നിർദേശിക്കുന്നില്ല.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: തന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നതെല്ലാം
  rationale: ഇത് അവളുടെ ഉള്ളിലെ ചിന്തകൾ, ചോദ്യങ്ങൾ, ആശങ്കകൾ എന്നിവയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. ‘ഹൃദയത്തിലുണ്ടായിരുന്നതെല്ലാം’ രൂപകവും അതിന്റെ തുറന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
