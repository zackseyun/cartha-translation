translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ആദ്യ വാക്യത്തിന്റെ അമിതഭാരം ഒഴിവാക്കാൻ ഒട്ടകങ്ങളെക്കുറിച്ചുള്ള വിവരണം രണ്ടാമത്തെ വാക്യമായി നൽകി; അവ യാത്രാസംഘത്തിന്റെ ഭാഗമാണെന്ന ബന്ധം ‘അവളോടൊപ്പമുണ്ടായിരുന്നു’ വ്യക്തമാക്കുന്നു. ‘ഹൃദയം’ എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
