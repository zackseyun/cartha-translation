  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മുഖ്യവാക്യത്തിൽ താരതമ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘മറികടന്നു’ ഉപയോഗിച്ചു; ഹീബ്രു ക്രിയയുടെ കൂടുതൽ രൂപാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
