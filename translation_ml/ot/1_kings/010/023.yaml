  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: ml
  text: അങ്ങനെ ശലോമോൻ രാജാവ് സമ്പത്തിലും ജ്ഞാനത്തിലും ഭൂമിയിലെ സകല രാജാക്കന്മാരെയും മറികടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “അങ്ങനെ ശലോമോൻ രാജാവ് സമ്പത്തിലും ജ്ഞാനത്തിലും ഭൂമിയിലെ സകല രാജാക്കന്മാരെക്കാളും വലിയവനായിത്തീർന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: മറികടന്നു
  rationale: גדל എന്ന ക്രിയ מן ചേർന്ന താരതമ്യഘടനയിൽ മറ്റുള്ളവരെക്കാൾ വലിയവനായിത്തീരുക അഥവാ ശ്രേഷ്ഠനാകുക എന്ന അർഥം നൽകുന്നു. ‘മറികടന്നു’ ഈ താരതമ്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ്
  rationale: നിശ്ചിത രാജപദവിയും വ്യക്തിനാമവും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല രാജാക്കന്മാരെയും
  rationale: אֶרֶץ എന്നതിന് ‘ദേശം’ എന്നും ‘ഭൂമി’ എന്നും അർഥമാകാം. രാജ്യാന്തരമായ രാജതാരതമ്യത്തിന്റെ ഈ സന്ദർഭത്തിൽ വിശാലമായ ‘ഭൂമി’ എന്ന അർഥം യോജിക്കുന്നു; מִן ഉള്ള താരതമ്യം മലയാളത്തിൽ കർമരൂപത്തോടുകൂടിയ ‘മറികടന്നു’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לְעֹשֶׁר
  choice: സമ്പത്തിൽ
  rationale: עֹשֶׁר ഭൗതികസമ്പത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്. താരതമ്യത്തിന്റെ മേഖല വ്യക്തമാക്കാൻ ‘സമ്പത്തിൽ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: וּלְחָכְמָה
  choice: ജ്ഞാനത്തിലും
  rationale: חָכְמָה എന്നത് ജ്ഞാനം/വിവേകം എന്ന ആശയമാണ്. ഇവിടെ ശലോമോന്റെ പ്രസിദ്ധമായ ജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജ്ഞാനം’ യോജിക്കുന്നു; ആവർത്തിച്ച לְ മലയാളത്തിൽ ‘-ലും’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: വാവ് ഇവിടെ മുൻവിവരണത്തിന്റെ സംഗ്രഹഫലത്തിലേക്ക് ആഖ്യാനം നീക്കുന്നു. ‘അങ്ങനെ’ ആ ഫലസൂചകബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൂടുതൽ രൂപാനുസൃതമായി ‘അപ്പോൾ/യും’ സാധ്യമാണ്.
