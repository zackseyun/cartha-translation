  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָיִ֗ים עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹֽא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: ml
  text: പന്ത്രണ്ട് സിംഹങ്ങൾ അവിടെ ആറ് പടികളുടെ ഇരുവശങ്ങളിലുമായി നിന്നിരുന്നു; ഒരു രാജ്യത്തും ഇതുപോലൊന്ന് ഉണ്ടാക്കിയിരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: പന്ത്രണ്ട് സിംഹങ്ങൾ
  rationale: സംഖ്യയും ബഹുവചന നാമവും നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; സിംഹരൂപങ്ങളാണെന്ന സന്ദർഭാർഥം അനാവശ്യമായി വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: עֹמְדִים שָׁם
  choice: അവിടെ നിന്നിരുന്നു
  rationale: ബഹുവചന പങ്കാളിത്തരൂപത്തിന്റെ ദൃശ്യവിവരണ സ്വഭാവവും സ്ഥലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: ആറ് പടികളിലായി
  rationale: സിംഹങ്ങൾ പടികളോടനുബന്ധിച്ച് നിരത്തപ്പെട്ടിരുന്നുവെന്ന സ്ഥിതിവിവരം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; עַל എന്നതിന്റെ കൃത്യമായ സ്ഥാനബന്ധം സന്ദർഭത്തിൽ അല്പം ഇളവുള്ളതാണ്.
- source_word: מִזֶּה וּמִזֶּה
  choice: ഇപ്പുറത്തും അപ്പുറത്തുമായി
  rationale: ഇരുവശങ്ങളിലുമുള്ള സമമിതമായ വിന്യാസം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: ഇതുപോലൊന്ന് ഉണ്ടാക്കിയിരുന്നില്ല
  rationale: ‘അങ്ങനെ ഉണ്ടാക്കപ്പെട്ടിരുന്നില്ല’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവിക മലയാളത്തിൽ താരതമ്യാത്മകമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְכָל מַמְלָכוֹת
  choice: ഒരു രാജ്യത്തിനുവേണ്ടിയും
  rationale: നിഷേധവാക്യത്തിലെ כָל എന്നതിന്റെ വിതരണാർഥം ‘ഒരു ... പോലും’ എന്ന മലയാള ഘടനയിൽ നൽകുകയും לְ എന്ന ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘ഇപ്പുറത്തും അപ്പുറത്തുമായി’ എന്നത് മൂലത്തിലെ സമമിതമായ സ്ഥലപ്രയോഗം നിലനിർത്തുന്നു; അർഥവ്യക്തതയ്ക്കായി വിരാമചിഹ്നം ഉപയോഗിച്ചിരിക്കുന്നു.
