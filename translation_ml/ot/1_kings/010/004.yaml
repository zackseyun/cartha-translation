  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ വാക്യം തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു.
