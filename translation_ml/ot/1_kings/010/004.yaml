  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: ml
  text: ശേബാരാജ്ഞി ശലോമോന്റെ സകല ജ്ഞാനവും അവൻ പണിത ഭവനവും[a] കണ്ടപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ പണിത കൊട്ടാരവും.” ഇവിടെ “ഭവനം” എന്ന എബ്രായപദം സന്ദർഭത്തിൽ രാജവസതിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: കണ്ടപ്പോൾ
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; അടുത്ത വാക്യത്തിൽ തുടരുന്ന ദീർഘവാക്യത്തിന്റെ ആരംഭമായതിനാൽ കാലസൂചകമായ ‘കണ്ടപ്പോൾ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מַלְכַּת שְׁבָא
  choice: ശെബാരാജ്ഞി
  rationale: ശെബയുടെ ഭരണാധികാരിണിയെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֵת
  choice: '[നേരിട്ടുള്ള കർമചിഹ്നം; പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിതമായ നേരിട്ടുള്ള കർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകമാണിത്; മലയാളത്തിൽ പ്രത്യേകം പദം ആവശ്യമില്ല.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: ശലോമോന്റെ സകല ജ്ഞാനവും
  rationale: כָּל എന്നത് ജ്ഞാനത്തിന്റെ സമഗ്രത സൂചിപ്പിക്കുന്നു; ബന്ധം മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וְהַבַּיִת
  choice: അവൻ പണിത ഭവനവും
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ഭവനം’ നിലനിർത്തുന്നു. രാജകീയ സന്ദർഭത്തിൽ കൊട്ടാരം ഉദ്ദേശിച്ചിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בָּנָה
  choice: അവൻ പണിത
  rationale: ‘ഭവനം’ എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം; പൂർത്തിയായ നിർമാണം രാജ്ഞി കണ്ടതെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
