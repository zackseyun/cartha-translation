  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: ml
  text: ശേബാരാജ്ഞി യഹ്‌വേയുടെ നാമത്തോടു ബന്ധപ്പെട്ട ശലോമോന്റെ കീർത്തിയെക്കുറിച്ചു കേട്ടു[a]. കടങ്കഥകൾകൊണ്ട്[b] അവനെ പരീക്ഷിക്കാൻ അവൾ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ നാമവുമായി ബന്ധപ്പെട്ട ശലോമോന്റെ കീർത്തിയെക്കുറിച്ചുള്ള വാർത്ത.” എബ്രായപ്രയോഗം സങ്കുചിതമാണ്; ശലോമോന്റെ കീർത്തി യഹ്‌വേയുടെ നാമവുമായോ പ്രസിദ്ധിയുമായോ ബന്ധപ്പെട്ടിരുന്നു എന്നും ഇതിനു ഭാവമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദുഷ്കരമായ ചോദ്യങ്ങൾകൊണ്ട്.” എബ്രായപദം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘കടങ്കഥകൾ’ അഥവാ ‘ഗൂഢപ്രശ്നങ്ങൾ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: ശേബാരാജ്ഞി
  rationale: വാക്യാരംഭത്തിലെ ו narrative ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ‘അപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി പുതിയ രംഗം ആരംഭിക്കുന്നു. Construct രൂപമായ ‘ശേബായുടെ രാജ്ഞി’യെ ‘ശേബാരാജ്ഞി’ എന്നു സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിച്ചു.
- source_word: שֹׁמַעַת
  choice: കേട്ടു
  rationale: ആഖ്യാനപശ്ചാത്തലത്തിൽ ഈ participle തുടർന്നുള്ള വരവിന് കാരണമായ വിവരം ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കേട്ടു’ സ്വാഭാവികമാണ്.
- source_word: אֶת שֵׁמַע שְׁלֹמֹה
  choice: ശലോമോന്റെ കീർത്തിയെക്കുറിച്ചു
  rationale: שֵׁמַע എന്നതിന് വാർത്ത, കേൾവി, കീർത്തി എന്നീ അർഥങ്ങളുണ്ട്. ദൂരദേശത്തെ രാജ്ഞി കേട്ട് അന്വേഷിക്കാൻ വരുന്നതായ സന്ദർഭത്തിൽ ‘കീർത്തി’ യോജിക്കുന്നു; ‘യെക്കുറിച്ചു’ കേൾവിയുടെ വിഷയബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לְשֵׁם יְהוָה
  choice: യഹ്‌വേയുടെ നാമത്തോടു ബന്ധപ്പെട്ട
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന്റെ കൃത്യമായ ഭാവം ഇവിടെ ദുഷ്കരമാണ്. കാരണം, ഉദ്ദേശ്യം എന്നിവ ഉറപ്പിച്ചുപറയാതെ ശലോമോന്റെ കീർത്തിക്കും യഹ്‌വേയുടെ നാമത്തിനുമിടയിലെ ബന്ധം ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ יהוה ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ സാധാരണവും ഉച്ചാരണസഹജവുമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַתָּבֹא
  choice: അവൾ വന്നു
  rationale: Wayyiqtol ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ രണ്ടാം വാക്യമായി നൽകുന്നത് സംഭവക്രമം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: לְנַסֹּתוֹ
  choice: അവനെ പരീക്ഷിക്കാൻ
  rationale: נסה എന്ന ക്രിയയ്ക്ക് ‘പരീക്ഷിക്കുക, പരിശോധിക്കുക’ എന്നർഥം. ഇവിടെ ശലോമോന്റെ ജ്ഞാനം പരിശോധിക്കുന്ന ബൗദ്ധിക പരീക്ഷണമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּחִידוֹת
  choice: കടങ്കഥകൾകൊണ്ട്
  rationale: חִידוֹת എന്നത് കടങ്കഥകൾ, ഗൂഢവാക്യങ്ങൾ, ദുഷ്കരമായ ചോദ്യങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. നേരിട്ടുള്ള പദസമാനതയായ ‘കടങ്കഥകൾ’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: ശലോമോന്റെ കീർത്തിയും യഹ്‌വേയുടെ നാമവും തമ്മിലുള്ള ബന്ധം
  choice: യഹ്‌വേയുടെ നാമത്തോടു ബന്ധപ്പെട്ട ശലോമോന്റെ കീർത്തി
  alternative: യഹ്‌വേയുടെ നാമം നിമിത്തമുള്ള ശലോമോന്റെ കീർത്തി
  rationale: לְשֵׁם എന്ന സങ്കുചിത പ്രയോഗം ബന്ധം, കാരണം, പരിഗണന തുടങ്ങിയ ഭാവങ്ങൾ അനുവദിക്കുന്നു. ദൈവനാമമാണ് കീർത്തിയുടെ കാരണം എന്ന് നിർണയിക്കാതെ മൂലത്തിലെ അർഥസന്ദിഗ്ധത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; സംഭവക്രമവും ബന്ധങ്ങളും മാറ്റിയിട്ടില്ല. പേരുകൾ ‘ശേബാ’, ‘ശലോമോൻ’, ‘യഹ്‌വേ’ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു.
