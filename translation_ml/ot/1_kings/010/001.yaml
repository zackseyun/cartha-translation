  naturalness: ‘ശേബാരാജ്ഞി’, ‘യഹ്‌വേയുടെ നാമത്തോടു ബന്ധപ്പെട്ട’, ‘കടങ്കഥകൾകൊണ്ട്’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യമായ ആഖ്യാനരജിസ്റ്ററിനൊത്തതുമാണ്. ‘കേട്ടു’ എന്ന ക്രിയയുടെ വിഷയമായ കീർത്തി/വാർത്തയോടുള്ള ‘യെക്കുറിച്ചു’ പ്രയോഗം സ്വീകരിക്കാവുന്നതാണ്.
