  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: ml
  text: ശലോമോൻ രാജാവ് ശേബാരാജ്ഞിക്കു അവൾ ആഗ്രഹിച്ചതെല്ലാം, അവൾ ചോദിച്ചതൊക്കെയും നൽകി; അതിനു പുറമേ, ശലോമോൻ രാജാവിന്റെ ഔദാര്യത്തിനൊത്തവണ്ണം അവൾക്കു നൽകിയതും ഉണ്ടായിരുന്നു.[a] പിന്നെ അവൾ തന്റെ ഭൃത്യന്മാരോടൊപ്പം സ്വന്തം ദേശത്തേക്കു തിരിഞ്ഞുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ശലോമോൻ രാജാവിന്റെ കൈക്കനുസരിച്ച്.” ഈ പ്രയോഗം അദ്ദേഹത്തിന്റെ കഴിവിനെയോ സമ്പത്തിനെയോ ഔദാര്യത്തെയോ സൂചിപ്പിക്കാം.'
    reason: മൂലഭാഷയിലെ പ്രയോഗവും അതിന്റെ യഥാർഥ അർഥപരിധിയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: נָתַן
  choice: നൽകി
  rationale: ‘കൊടുക്കുക’ എന്ന സാധാരണ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളുടെയും ആശയം നിലനിർത്തുന്നു.
- source_word: מַלְכַּת שְׁבָא
  choice: ശേബാരാജ്ഞി
  rationale: സ്ഥാനനാമത്തോടു ചേർന്ന രാജകീയ പദവി മലയാളത്തിൽ സ്വാഭാവികമായി സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: അവൾ ആഗ്രഹിച്ചതെല്ലാം, അവൾ ചോദിച്ചതൊക്കെയും
  rationale: חֵפֶץ എന്നതിലെ ആഗ്രഹവും שׁאל എന്നതിലെ ചോദിക്കൽ/അഭ്യർഥിക്കൽ എന്ന ആശയവും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: מִלְּבַד
  choice: അതിനു പുറമേ
  rationale: മുമ്പു പറഞ്ഞതിനു പുറമേ നൽകിയതിനെ സൂചിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ ഔദാര്യത്തിനൊത്തവണ്ണം
  rationale: അക്ഷരാർഥത്തിൽ ‘ശലോമോൻ രാജാവിന്റെ കൈക്കൊത്ത്’; ഇവിടെ രാജാവിന്റെ കഴിവിനെയോ സമ്പത്തിനെയോ ഔദാര്യത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ വായനാസൗകര്യത്തോടെ അർഥം നൽകുന്നു.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: സ്വദേശത്തേക്കു മടങ്ങിപ്പോയി
  rationale: ‘തിരിഞ്ഞ് തന്റെ ദേശത്തേക്കു പോയി’ എന്ന രണ്ടു ക്രിയകളുടെ യാത്രാസന്ദർഭത്തിലുള്ള സംയുക്ത ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: അവൾ തന്റെ ഭൃത്യന്മാരോടൊപ്പം
  rationale: രാജകീയ പരിവാരസന്ദർഭത്തിൽ עֲבָדִים എന്നത് സേവകരെയോ അനുചരരെയോ സൂചിപ്പിക്കാം; ‘ഭൃത്യന്മാർ’ നേരിട്ടുള്ളതും പ്രസക്തവുമായ പദമാണ്.
theological_decisions:
- issue: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ശലോമോൻ രാജാവിന്റെ ഔദാര്യത്തിനൊത്തവണ്ണം
  alternative: ശലോമോൻ രാജാവിന്റെ കൈക്കൊത്ത് / ശലോമോൻ രാജാവിന്റെ കഴിവിനൊത്തവണ്ണം
  rationale: ‘കൈ’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ ഉദ്ദേശിച്ച ആശയം സ്വാഭാവികമായി അറിയിക്കില്ല. മൂലപ്രയോഗത്തിൽ ശേഷി, സമ്പത്ത്, ഔദാര്യം എന്നീ അർഥസാധ്യതകൾ ഉള്ളതിനാൽ പ്രധാനവാചകത്തിൽ പ്രസക്തമായ ഔദാര്യാർഥം നൽകി, അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും സൂചിപ്പിക്കുന്നു.
- issue: עֲבָדֶיהָ എന്ന പദത്തിന്റെ സാമൂഹിക അർഥപരിധി
  choice: ഭൃത്യന്മാർ
  alternative: സേവകർ / പരിചാരകർ / അടിമകൾ
  rationale: ഈ സന്ദർഭം രാജ്ഞിയോടൊപ്പം യാത്രചെയ്യുന്ന ആളുകളെ മാത്രം തിരിച്ചറിയുന്നു; അവരുടെ നിയമപരമായ സാമൂഹികസ്ഥാനം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തിരിഞ്ഞ് പോയി’ എന്ന ഹീബ്രു ക്രമം മലയാളത്തിൽ ‘മടങ്ങിപ്പോയി’ എന്നു സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
