  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. സിംഹാസനത്തിന്റെ ഘടന ദൃശ്യമായി വ്യക്തമാക്കാൻ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിച്ചു; എബ്രായത്തിലെ സംക്ഷിപ്തത മൂലമുള്ള സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
