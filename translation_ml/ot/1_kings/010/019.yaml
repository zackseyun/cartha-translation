  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: ml
  text: സിംഹാസനത്തിന് ആറു പടികൾ ഉണ്ടായിരുന്നു. സിംഹാസനത്തിന്റെ പിന്നിൽ വൃത്താകൃതിയിലുള്ള ഒരു മേൽഭാഗം ഉണ്ടായിരുന്നു[a]. ഇരിപ്പിടത്തിന്റെ ഇരുവശങ്ങളിലും കൈത്താങ്ങുകൾ ഉണ്ടായിരുന്നു; കൈത്താങ്ങുകൾക്കരികെ രണ്ടു സിംഹങ്ങൾ നിന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “അതിന്റെ പിന്നിൽ വൃത്താകൃതിയിലുള്ള ഒരു തല/മേൽഭാഗം.” എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: പടികൾ
  rationale: സിംഹാസനത്തിലേക്കു കയറാനുള്ള പടികളെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: לַכִּסֵּה
  choice: സിംഹാസനത്തിന് … ഉണ്ടായിരുന്നു
  rationale: ലാമെദ് ഉപസർഗത്തെ ഇവിടെ വാസ്തുവിവരണത്തിലെ ഉടമസ്ഥതാസംബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רֹאשׁ עָגֹל
  choice: വൃത്താകൃതിയിലുള്ള ഒരു മുകൾഭാഗം
  rationale: അക്ഷരാർഥത്തിലെ ‘വൃത്താകൃതിയിലുള്ള തല/മുകൾഭാഗം’ എന്ന ആശയം നിലനിർത്തുന്നു; ‘തലയണ’ എന്നു അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: מֵאַחֲרָיו
  choice: അതിന്റെ പിൻഭാഗത്ത്
  rationale: വൃത്താകൃതിയിലുള്ള മുകൾഭാഗം സിംഹാസനത്തിന്റെ പിന്നിലായിരുന്നുവെന്ന സ്ഥാനവിവരം വ്യക്തമായി നൽകുന്നു.
- source_word: יָדֹת
  choice: കൈത്താങ്ങുകൾ
  rationale: ഫർണിച്ചറിന്റെ സന്ദർഭത്തിൽ ഇരിപ്പിടത്തിന്റെ വശങ്ങളിലുള്ള കൈവയ്ക്കാനുള്ള ഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִזֶּה וּמִזֶּה
  choice: ഇരുവശത്തും
  rationale: എബ്രായപ്രയോഗത്തിലെ ഇരുപാർശ്വങ്ങളിലുമുള്ള വിന്യാസം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: ഇരിപ്പിടത്തിന്റെ … ഇരുവശത്തും
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇരിക്കുന്ന സ്ഥലം’ എന്നത് സന്ദർഭാനുസൃതമായി ‘ഇരിപ്പിടം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲרָיוֹת
  choice: സിംഹങ്ങൾ
  rationale: സിംഹാസനത്തോടു ചേർന്നിരുന്ന സിംഹരൂപങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ബഹുവചനപരിഭാഷ.
- source_word: עֹמְדִים
  choice: നിന്നിരുന്നു
  rationale: പങ്ക്തിപദം സിംഹരൂപങ്ങളുടെ സ്ഥിരമായ നിൽപ്പ് വിവരിക്കുന്നു.
- source_word: אֵצֶל הַיָּדוֹת
  choice: കൈത്താങ്ങുകൾക്കരികെ
  rationale: രണ്ട് സിംഹങ്ങളുടെയും സ്ഥാനം കൈത്താങ്ങുകളോടു ചേർന്നാണെന്ന് വ്യക്തമായി പറയുന്നു.
