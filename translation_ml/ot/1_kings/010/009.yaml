  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: ml
  text: നിന്നിൽ പ്രസാദിച്ച് നിന്നെ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരുത്തിയ നിന്റെ ദൈവമായ യഹ്‌വാ വാഴ്ത്തപ്പെടുമാറാകട്ടെ! ഇസ്രായേലിനോടുള്ള യഹ്‌വായുടെ ശാശ്വതസ്നേഹം നിമിത്തം[a] നീ ന്യായവും നീതിയും നടപ്പാക്കേണ്ടതിന് അവൻ നിന്നെ രാജാവാക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വാ ഇസ്രായേലിനെ എന്നേക്കും സ്നേഹിക്കുന്നതിനാൽ.” എബ്രായത്തിൽ ‘സ്നേഹം’ നാമരൂപത്തിലാണ്; ഈ പ്രയോഗത്തിന് കാരണാർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ആജ്ഞാർത്ഥസദൃശ രൂപവും בָּרוּךְ എന്ന വിശേഷണവും ചേർന്ന അനുഗ്രഹപ്രഖ്യാപനത്തിന്റെ ആശംസാഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വാ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: നിന്നിൽ പ്രസാദിച്ച്
  rationale: חפץ ב എന്ന പ്രയോഗത്തിലെ സന്തോഷപൂർവമായ അനുകൂലത വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി കാരണബന്ധത്തിലേക്ക് നയിക്കുകയും ചെയ്യുന്നു.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: നിന്നെ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരുത്തിയ
  rationale: രാജകീയ നിയമനവും സിംഹാസനാരോഹണത്തിന്റെ ദൃശ്യവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: ഇസ്രായേലിനോടുള്ള യഹ്‌വായുടെ ശാശ്വതസ്നേഹം നിമിത്തം
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സന്ദർഭോചിതമായ കാരണാർഥവും אַהֲבָה എന്ന നാമരൂപവും לְעֹלָם എന്നതിന്റെ സ്ഥിരതാഭാവവും നിലനിർത്തുന്നു.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: അവൻ നിന്നെ രാജാവാക്കിയിരിക്കുന്നു
  rationale: שׂים + לְ സൂചിപ്പിക്കുന്ന രാജകീയ നിയമനം, ഇപ്പോഴും പ്രസക്തമായ പൂർത്തിയായ പ്രവൃത്തിയായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: നീ നീതിയും ന്യായവും നടപ്പാക്കേണ്ടതിന്
  rationale: രാജാവിന്റെ ഭരണ-ന്യായനിർവഹണ ദൗത്യത്തെ വ്യക്തമാക്കുന്നു; വ്യത്യസ്തമായ രണ്ടു എബ്രായ നൈതിക-ന്യായ ആശയങ്ങളും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വാ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പൊതുസ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְּאַהֲבַת יְהוָה എന്നതിന്റെ വ്യാകരണബലം
  choice: യഹ്‌വായുടെ ശാശ്വതസ്നേഹം നിമിത്തം
  alternative: യഹ്‌വാ ഇസ്രായേലിനെ എന്നേക്കും സ്നേഹിക്കുന്നതിനാൽ
  rationale: എബ്രായത്തിലെ നാമപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ കാരണബന്ധം വ്യക്തമാക്കുന്നു; ക്രിയാരൂപത്തിലുള്ള വായനയും അർത്ഥപരമായി സാധ്യമാണ്.
- issue: מִשְׁפָּט וּצְדָקָה എന്ന ഇരട്ടപ്രയോഗം
  choice: നീതിയും ന്യായവും
  alternative: ന്യായവും നീതിയും / ന്യായവിധിയും ധാർമികതയും
  rationale: രാജകീയ ഭരണത്തിലെ നിയമനിഷ്ഠയും ശരിയായ സാമൂഹിക ക്രമവും സൂചിപ്പിക്കുന്ന രണ്ടു ബന്ധപ്പെട്ടെങ്കിലും വേർതിരിച്ച ആശയങ്ങൾ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. അതിപുരാതന പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി; രാജകീയവും ദൈവശാസ്ത്രപരവുമായ ഭാവം സംരക്ഷിച്ചു.
