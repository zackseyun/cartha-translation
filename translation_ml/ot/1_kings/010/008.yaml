reference: 1 Kings 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָֽ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד הַ/שֹּׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: ml
  text: നിന്റെ പുരുഷന്മാർ ഭാഗ്യവാന്മാർ! നിന്റെ മുമ്പിൽ നിരന്തരം നിന്നുകൊണ്ട് നിന്റെ ജ്ഞാനം കേൾക്കുന്ന ഈ നിന്റെ ദാസന്മാർ ഭാഗ്യവാന്മാർ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ഭാഗ്യവാന്മാർ
  rationale: അസൂയാർഹമായ നന്മയുടെയും സൗഭാഗ്യത്തിന്റെയും അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ആശംസാപ്രയോഗമാണിത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ഭാഗ്യവാന്മാർ’ അതിന്റെ ധ്വനി നിലനിർത്തുന്നു.
- source_word: אֲנָשֶׁיךָ
  choice: നിന്റെ ആളുകൾ
  rationale: രാജാവിനോടു ബന്ധപ്പെട്ട പുരുഷന്മാരെയോ രാജസദസ്സിലുള്ളവരെയോ സൂചിപ്പിക്കുന്നു. ‘ആളുകൾ’ എന്നത് ‘ജനം’ എന്നതിനെക്കാൾ വ്യക്തിപരമായ ബന്ധം സൂക്ഷിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: עֲבָדֶיךָ
  choice: നിന്റെ ദാസന്മാർ
  rationale: രാജസദസ്സിൽ രാജാവിനെ സേവിക്കുന്നവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘അടിമകൾ’ എന്നതിനെക്കാൾ ‘ദാസന്മാർ’ ഇവിടെ ഉദ്ദേശിക്കുന്ന ഔദ്യോഗിക സേവനബന്ധത്തിന് യോജിക്കുന്നു.
- source_word: אֵלֶּה
  choice: ഈ
  rationale: സമീപസ്ഥരെ ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ നിർദേശകപദത്തിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: നിന്റെ മുമ്പിൽ ... നിന്നുകൊണ്ട്
  rationale: രാജാവിന്റെ സന്നിധിയിൽ നിന്നു സേവിക്കുകയും ഹാജരായിരിക്കുകയും ചെയ്യുന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘പരിചരിക്കുന്ന’ എന്നു മാത്രം പറഞ്ഞ് മൂലരൂപം മറച്ചിട്ടില്ല.
- source_word: תָּמִיד
  choice: നിരന്തരം
  rationale: പതിവായും തുടർച്ചയായും ഉള്ള സന്നിധാനത്തെ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും ഓരോ നിമിഷവും എന്ന അതിശക്തമായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הַשֹּׁמְעִים
  choice: കേൾക്കുന്ന
  rationale: എബ്രായത്തിലെ പങ്കാളിത്തരൂപം സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: חָכְמָתֶךָ
  choice: നിന്റെ ജ്ഞാനം
  rationale: മൂലപാഠത്തിലെ ലളിതമായ പ്രത്യക്ഷകർമം അതേപടി നൽകുന്നു; ‘നീ പറയുന്ന ജ്ഞാനവാക്കുകൾ’ പോലുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജസദസ്സ്-സന്ദർഭ ഭാഷ. ആവർത്തിച്ചുള്ള אַשְׁרֵי എന്ന ആശംസാപ്രയോഗം രണ്ടു വിസ്മയവാക്യങ്ങളായി നിലനിർത്തി. ‘നീ/നിന്റെ’ എന്ന ഏകവചന സംബോധന മൂലത്തിലെ രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
