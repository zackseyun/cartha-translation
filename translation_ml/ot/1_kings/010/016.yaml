    text: ഇവിടെ ‘പരിച’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം വലിയ പരിചയെ സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിൽ പറയുന്ന ചെറിയതരം പരിചയിൽനിന്ന് ഇത് വ്യത്യസ്തമായിരിക്കാം.
    reason: lexical_alternative
