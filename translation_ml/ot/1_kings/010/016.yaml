  text: ശലോമോൻ രാജാവ് അടിച്ചുപരത്തിയ സ്വർണംകൊണ്ട് ഇരുനൂറ് വലിയ പരിചകൾ[b] ഉണ്ടാക്കി. ഓരോ പരിചയ്ക്കും അറുനൂറ് ശേക്കേൽ[a] സ്വർണം ഉപയോഗിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ആ ഒരു പരിചയുടെമേൽ അറുനൂറ് സ്വർണം കയറി’; തൂക്കത്തിന്റെ ഏകകമായ ‘ശേക്കേൽ’ സൂചിതമാണ്.
    reason: lexical_alternative
