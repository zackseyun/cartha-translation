- source_word: מָאתַיִם
  choice: ഇരുനൂറ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: צִנָּה
  choice: വലിയ പരിചകൾ
  rationale: צִנָּה സാധാരണയായി വലിയ പരിചയെ സൂചിപ്പിക്കുകയും അടുത്ത വാക്യത്തിലെ ചെറിയതരം പരിചയിൽനിന്ന് വ്യത്യസ്തമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: זָהָב שָׁחוּט
  choice: അടിച്ചുപരത്തിയ സ്വർണം
  rationale: שָׁחוּט സ്വർണം അടിച്ചോ ചുറ്റികകൊണ്ട് തട്ടിയോ പരത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ഈ പ്രക്രിയ മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: അറുനൂറ് ശേക്കേൽ സ്വർണം
  rationale: എബ്രായത്തിൽ അളവിന്റെ ഏകകം പറഞ്ഞിട്ടില്ലെങ്കിലും തൂക്കത്തിന്റെ ഏകകമായ ‘ശേക്കേൽ’ സന്ദർഭത്തിൽ അധ്യാഹരിക്കപ്പെടുന്നു; അത് ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יַעֲלֶה עַל
  choice: വേണ്ടിവന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘മേൽ കയറി’ എന്നാണെങ്കിലും, ഓരോ പരിചയ്ക്കും ഉപയോഗിച്ച സ്വർണത്തിന്റെ അളവ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘വേണ്ടിവന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַצִּנָּה הָאֶחָת
  choice: ഓരോ പരിചയ്ക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘ആ ഒരു പരിച’ ഇവിടെ വിതരണാർഥം വഹിക്കുന്നു; മലയാളത്തിൽ ‘ഓരോ പരിചയ്ക്കും’ അതു കൃത്യമായി അറിയിക്കുന്നു.
