reference: 1 Kings 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൾ രാജാവിനോടു പറഞ്ഞു: “അങ്ങയുടെ വാക്കുകളെയും[a] ജ്ഞാനത്തെയും കുറിച്ച് എന്റെ നാട്ടിൽ ഞാൻ കേട്ട വാർത്ത സത്യമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അങ്ങയെ സംബന്ധിച്ച കാര്യങ്ങളെയും” അഥവാ “അങ്ങയുടെ നേട്ടങ്ങളെയും.” “അങ്ങയുടെ വാക്കുകൾ” എന്ന എബ്രായ പ്രയോഗത്തിന് അങ്ങയെ സംബന്ധിച്ച കാര്യങ്ങൾ എന്ന വിശാലമായ അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: അപ്പോൾ അവൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ, അതിന്റെ ക്രമാനുഗത ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: אֶל־הַמֶּלֶךְ
  choice: രാജാവിനോടു
  rationale: രാജാവിനെ അഭിസംബോധന ചെയ്ത് പറഞ്ഞുവെന്ന പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: വാർത്ത സത്യമായിരുന്നു
  rationale: ഇവിടെ דָּבָר ശലോമോനെക്കുറിച്ച് കേട്ട വിവരത്തെയോ റിപ്പോർട്ടിനെയോ സൂചിപ്പിക്കുന്നു; ‘വാർത്ത’ സന്ദർഭോചിതവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר שָׁמַעְתִּי בְּאַרְצִי
  choice: എന്റെ നാട്ടിൽവെച്ച് ഞാൻ കേട്ട
  rationale: ആദ്യപുരുഷ ഉടമസ്ഥപ്രത്യയവും കേട്ട സ്ഥലവും വ്യക്തമായി, സ്വാഭാവികമായ പദക്രമത്തിൽ നൽകുന്നു.
- source_word: עַל־דְּבָרֶיךָ
  choice: അങ്ങയുടെ വാക്കുകളെക്കുറിച്ച്
  rationale: ദְּבָרִים എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘വാക്കുകൾ’ നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ അതിന് കാര്യങ്ങൾ, പ്രവൃത്തികൾ, നേട്ടങ്ങൾ എന്നിങ്ങനെ വിശാലമായ അർഥസാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: ജ്ഞാനത്തെക്കുറിച്ച്
  rationale: മൂലത്തിലെ സമാന്തര ഘടനയും സന്ദർഭത്തിന്റെ കേന്ദ്രവിഷയവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം സ്വീകരിച്ചു; മൂലപാഠത്തിലെ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
