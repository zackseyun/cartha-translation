reference: 1 Kings 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: ml
  text: രാജാവ് യെരൂശലേമിൽ വെള്ളിയെ കല്ലുകൾപോലെ സുലഭമാക്കി; ശെഫേലായിലുള്ള[a] കാട്ടത്തിമരങ്ങൾ[b]പോലെ ദേവദാരുക്കളെ ധാരാളമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശെഫേലാ’ യെഹൂദ്യയിലെ മലനാടിനും തീരസമതലത്തിനും ഇടയിലുള്ള താഴ്ന്ന കുന്നിൻപ്രദേശത്തിന്റെ പേരാണ്. അഥവാ, ‘താഴ്ന്ന പ്രദേശത്തുള്ള.’
    reason: cultural_note
  - marker: b
    text: എബ്രായപദം കാട്ടത്തിമരങ്ങളെ, അതായത് സിക്കമോർ അത്തിമരങ്ങളെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: സാധാരണമാക്കി / സമൃദ്ധമാക്കി
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കൊടുത്തു/വെച്ചു’ എന്നാണെങ്കിലും, ഈ താരതമ്യപ്രയോഗത്തിൽ വസ്തുക്കൾ ധാരാളമായി ലഭ്യമാകുന്ന അവസ്ഥ രാജാവ് ഉണ്ടാക്കി എന്ന കാരണാർഥമാണ്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: മൂലപാഠം ശലോമോനെ പേരെടുത്ത് പറയാതെ ‘രാജാവ്’ എന്നു മാത്രമാണ് പറയുന്നത്; അതുതന്നെ നിലനിർത്തി.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: ഇവിടെ ഒരു ചരക്കായ വെള്ളിയെ പൊതുവായി സൂചിപ്പിക്കുന്ന ദ്രവ്യനാമമാണ്.
- source_word: בִּירוּשָׁלִַם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ നേരിട്ടുള്ള അധികരണപ്രയോഗം.
- source_word: כָּאֲבָנִים
  choice: കല്ലുകൾപോലെ
  rationale: כְּ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָאֲרָזִים
  choice: ദേവദാരുക്കൾ
  rationale: ബഹുവചന നാമത്തെ മരങ്ങളായിത്തന്നെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മരത്തടി ഉൾപ്പെടാമെങ്കിലും അതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: כַּשִּׁקְמִים
  choice: കാട്ടത്തിമരങ്ങൾപോലെ
  rationale: שִׁקְמִים ലെവാന്തിൽ വളരുന്ന sycamore fig മരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ മനസ്സിലാകുന്ന സസ്യനാമം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: ശെഫേലായിലുള്ള
  rationale: പൊതുവായ ‘താഴ്ന്ന പ്രദേശം’ എന്നതിലുപരി യെഹൂദ്യയിലെ നിർദിഷ്ട ഭൂമേഖലയെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമം നിലനിർത്തി.
- source_word: לָרֹב
  choice: സമൃദ്ധമാക്കി
  rationale: വളരെ വലിയ അളവോ സമൃദ്ധിയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ താരതമ്യത്തിന്റെ ഭാഗമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ രണ്ടു സമാന്തര താരതമ്യങ്ങളും രാജാവിനെ പേരെടുത്ത് പറയാത്ത രീതിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദബന്ധത്തിനു ശേഷം ചേർത്തു.
