  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: ml
  text: അടിച്ചുപരത്തിയ സ്വർണംകൊണ്ട് മുന്നൂറു പരിചകളും[a] ഉണ്ടാക്കി. ഓരോ പരിചയിലും മൂന്നു മിനാ സ്വർണം പതിച്ചു[b]. രാജാവ് അവയെ ലെബാനോൻ വനമന്ദിരത്തിൽ[c] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചുറ്റികകൊണ്ട് പരത്തിയ സ്വർണംകൊണ്ട്’ അല്ലെങ്കിൽ ‘അടിച്ചു നേർത്തതാക്കിയ സ്വർണംകൊണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ഒരു പരിചയുടെമേൽ മൂന്നു മിനാ സ്വർണം കയറി’; അതായത് ഓരോ പരിചയിലും മൂന്നു മിനാ സ്വർണം പതിച്ചു. ‘മിനാ’ ഒരു പുരാതന തൂക്കയളവാണ്.'
    reason: lexical_alternative
  - marker: c
    text: ‘ലെബാനോൻ വനമന്ദിരം’ ശലോമോന്റെ കൊട്ടാരസമുച്ചയവുമായി ബന്ധപ്പെട്ടിരുന്ന ഒരു രാജകീയ കെട്ടിടത്തിന്റെയോ ആയുധപ്പുരയുടെയോ പേരായിരുന്നു; 1 രാജാക്കന്മാർ 7:2 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: പരിചകൾ
  rationale: മുൻവാക്യത്തിലെ ചെറുതരം പരിചകളിൽനിന്ന് വ്യത്യസ്തമായ വലിയ പ്രതിരോധപരിചകളെയാണ് מָגֵן സൂചിപ്പിക്കുന്നത്; ആ വ്യത്യാസം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: זָהָב שָׁחוּט
  choice: അടിച്ചുപരത്തിയ സ്വർണം
  rationale: സ്വർണം അടിച്ചോ ചുറ്റികകൊണ്ട് പരത്തിയോ നേർത്ത തകിടാക്കിയെന്ന നിർമ്മാണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: മൂന്നു മിനാ
  rationale: מָנֶה ഒരു പുരാതന തൂക്കയളവാണ്; അതിനെ ആധുനിക അളവിലേക്കു അനിശ്ചിതമായി പരിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יַעֲלֶה עַל
  choice: പതിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ സ്വർണം പരിചയുടെമേൽ ‘കയറി’ എന്നു പറയുന്ന പ്രയോഗം അതിൽ സ്വർണം പ്രയോഗിച്ചു/പതിച്ചു എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘പതിച്ചു’ ആ ദൃശ്യബിംബവും അർഥവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הַמָּגֵן הָאֶחָת
  choice: ഓരോ പരിചയിലും
  rationale: ഹീബ്രുവിലെ ‘ആ ഒരു പരിചയിൽ’ എന്ന ഏകവചനരൂപം ഇവിടെ വിതരണാർഥകമാണ്; മലയാളത്തിലെ ‘ഓരോ’ അതു വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּתְּנֵם
  choice: അവയെ ... വെച്ചു
  rationale: נתן ഇവിടെ ഒരു സ്ഥലത്ത് സ്ഥാപിക്കുക എന്ന സാധാരണ അർഥത്തിലാണ്.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ലെബാനോൻ വനമന്ദിരം
  rationale: ശലോമോന്റെ കൊട്ടാരസമുച്ചയത്തിലെ ഒരു പ്രത്യേക രാജകീയ കെട്ടിടത്തിന്റെ പേരായി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം ഉപയോഗിക്കുന്നു.
