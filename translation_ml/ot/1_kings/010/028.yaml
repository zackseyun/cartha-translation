  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: ml
  text: ശലോമോനുവേണ്ടിയുള്ള കുതിരകളുടെ ഇറക്കുമതി ഈജിപ്തിൽനിന്നും കൂവേയിൽനിന്നും[a][b] ആയിരുന്നു; രാജാവിന്റെ വ്യാപാരികൾ അവയെ കൂവേയിൽനിന്ന് വിലയ്ക്ക് വാങ്ങിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ദുഷ്കരമായ എബ്രായപാഠത്തിന്റെ മറ്റൊരു വായന അനുസരിച്ച്: “ഒരു കുതിരക്കൂട്ടത്തിൽനിന്നും; രാജാവിന്റെ വ്യാപാരികൾ ഒരു കുതിരക്കൂട്ടത്തെ വിലയ്ക്ക് വാങ്ങിയിരുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിലെ מִקְוֶה/מִקְוֵה എന്ന എബ്രായപദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. അത് കിലിക്ക്യയിലായിരുന്നിരിക്കാവുന്ന ‘കൂവേ’ എന്ന സ്ഥലനാമമോ, ‘കൂട്ടം’ അല്ലെങ്കിൽ ‘ശേഖരം’ എന്നർഥമുള്ള സാധാരണനാമമോ ആയിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: מוֹצָא
  choice: ഇറക്കുമതി ചെയ്തിരുന്നു
  rationale: പദത്തിന് ‘പുറപ്പെടൽ’, ‘ഉത്ഭവം’, ‘കയറ്റുമതി/ഇറക്കുമതി’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ശലോമോനുവേണ്ടി മറ്റു ദേശങ്ങളിൽനിന്ന് കുതിരകൾ എത്തിക്കുന്ന വ്യാപാരസന്ദർഭത്തിൽ ‘ഇറക്കുമതി’ സ്വാഭാവികമാണ്.
- source_word: הַסּוּסִים
  choice: കുതിരകളെ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരായ മലയാള പരിഭാഷ.
- source_word: אֲשֶׁר לִשְׁלֹמֹה
  choice: ശലോമോനുവേണ്ടിയുള്ള
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ‘ശലോമോനുവേണ്ടിയുള്ള’ എന്ന അർഥം നിലനിർത്തുന്നു; ഉടമസ്ഥത മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്നും
  rationale: സ്ഥലനാമത്തിന്റെ പതിവ് മലയാളരൂപം.
- source_word: וּמִקְוֵה
  choice: കൂവേയിൽനിന്നും
  rationale: ദുഷ്കരമായ מקוה എന്ന പദത്തെ ഇവിടെ കിലിക്ക്യയിലെ കൂവേ എന്ന സ്ഥലനാമമായി ഗ്രഹിക്കുന്നു. സാധാരണനാമമായ ‘കൂട്ടം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ വ്യാപാരികൾ
  rationale: രാജസേവനത്തിലുള്ള വാണിജ്യപ്രതിനിധികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: יִקְחוּ
  choice: വാങ്ങിയിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക/നേടുക’ എന്നാണെങ്കിലും בִּמְחִיר (‘വിലയ്ക്ക്’) എന്ന പ്രയോഗം ഇവിടെ വാങ്ങൽ ഇടപാടിനെ വ്യക്തമാക്കുന്നു.
- source_word: מִקְוֵה
  choice: കൂവേയിൽനിന്ന്
  rationale: ആദ്യത്തെ പ്രയോഗത്തോടു യോജിച്ച സ്ഥലനാമവായന സ്വീകരിക്കുന്നു; പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּמְחִיר
  choice: വിലയ്ക്ക്
  rationale: വാണിജ്യ ഇടപാടിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
