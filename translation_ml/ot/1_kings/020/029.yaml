  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: ml
  text: ഇക്കൂട്ടർ അക്കൂട്ടർക്കു നേരെ ഏഴു ദിവസം പാളയമിറങ്ങി. ഏഴാം ദിവസം യുദ്ധം അടുത്തുവന്നു; ഇസ്രായേൽമക്കൾ[a] അരാമിന്റെ[b] ഒരു ലക്ഷം കാലാൾപ്പടയാളികളെ[c] ഒറ്റ ദിവസംകൊണ്ട് അടിച്ചുവീഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അരാമ്യരുടെ.” “അരാം” എന്ന എബ്രായനാമം അരാമ്യ രാജ്യത്തെയോ അരാമ്യ ജനതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കാലാൾസൈന്യം.” എബ്രായപദം അക്ഷരാർഥത്തിൽ കാൽനടയായി പോരാടുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയ സൈന്യം പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ ആധുനിക മലയാളമാണ്.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: ഇക്കൂട്ടർ അക്കൂട്ടർക്കു നേരെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ‘ഇവർ—അവർക്കു നേരെ’ എന്ന സൈനിക വിന്യാസവും נֹכַח എന്ന പദത്തിന്റെ അഭിമുഖമായ സ്ഥാനബന്ധവും നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: എബ്രായ ആഖ്യാനസൂത്രമായ ויהי അനാവശ്യമായി വാക്കിന് വാക്കായി പകർത്താതെ സമയസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: യുദ്ധം അടുത്തുവന്നു
  rationale: קרב എന്ന ക്രിയയുടെ ‘അടുത്തുവരുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് സൈന്യങ്ങൾ ഏറ്റുമുട്ടിയതിന്റെ ആരംഭത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּכּוּ
  choice: വെട്ടിവീഴ്ത്തി
  rationale: נכה യുദ്ധത്തിൽ പ്രഹരിച്ച് വീഴ്ത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ വലിയ മരണസംഖ്യയുള്ള സൈനികസന്ദർഭത്തിന് യോജിച്ച ശക്തമായ പ്രയോഗമാണിത്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപം മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇവിടെ അത് ഇസ്രായേലിന്റെ പോരാളികളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ഭൗമരാഷ്ട്രീയ നാമം പകരാതെ എബ്രായത്തിലെ ജനത/രാജ്യനാമം നിലനിർത്തുന്നു.
- source_word: מֵאָה אֶלֶף
  choice: ഒരു ലക്ഷം
  rationale: എബ്രായ സംഖ്യയുടെ കൃത്യവും സാധാരണ മലയാളത്തിലുള്ളതുമായ രൂപം.
- source_word: רַגְלִי
  choice: കാലാൾപ്പടയാളികൾ
  rationale: കാൽനടയായി പോരാടുന്ന സൈനികരെ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തമായ ആധുനിക സൈനികപദം.
- source_word: בְּיוֹם אֶחָד
  choice: ഒറ്റ ദിവസംകൊണ്ട്
  rationale: പരാജയം സംഭവിച്ച കാലപരിധിയായ ഒരേയൊരു ദിവസത്തിന് എബ്രായം നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ രൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധപരവും പുരുഷലിംഗ ബഹുവചനവുമായ രൂപം നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ ഇത് പോരാളികളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- issue: אֲרָם എന്ന നാമം ജനതയെയോ രാജ്യത്തെയോ സൂചിപ്പിക്കുന്നത്
  choice: അരാം
  alternative: അരാമ്യർ
  rationale: മൂലപാഠം ജനനാമവിശേഷണം ഉപയോഗിക്കാതെ ‘അരാം’ എന്ന നാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിലെ രാജ്യ/ജനത എന്ന അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇക്കൂട്ടർ അക്കൂട്ടർ’ എന്ന രൂപം മൂലത്തിലെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്ത വിരുദ്ധഘടന നിലനിർത്തുന്നു. ‘യുദ്ധം അടുത്തുവന്നു’ എന്നത് എബ്രായ ദൃശ്യരൂപം സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിൽ ഏറ്റുമുട്ടൽ ആരംഭിച്ചതായി വായിക്കാവുന്നതാണ്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
