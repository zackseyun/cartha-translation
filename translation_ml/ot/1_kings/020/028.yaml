revisions:
- from: 'ദൈവപുരുഷൻ അടുത്തുവന്ന് ഇസ്രായേൽരാജാവിനോടു പറഞ്ഞു: “യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘യഹ്‌വേ പർവതങ്ങളുടെ ദൈവമാണ്, എന്നാൽ താഴ്‌വരകളുടെ ദൈവമല്ല’ എന്ന് അരാം[a] പറഞ്ഞതുകൊണ്ട്, ഈ വലിയ സൈന്യക്കൂട്ടത്തെ മുഴുവൻ ഞാൻ നിന്റെ കൈയിൽ ഏല്പിക്കും. അപ്പോൾ ഞാൻ യഹ്‌വേയാണെന്ന് നിങ്ങൾ[c] അറിയും.”[b]'
  to: 'ദൈവപുരുഷൻ അടുത്തുവന്ന് ഇസ്രായേലിന്റെ രാജാവിനോട് പറഞ്ഞു: “യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ‘യഹ്‌വേ പർവതങ്ങളുടെ ഒരു ദൈവമാണ്, എന്നാൽ താഴ്‌വരകളുടെ ദൈവമല്ല’[b] എന്ന് അരാം[a] പറഞ്ഞതിനാൽ, ഈ വലിയ സൈന്യക്കൂട്ടത്തെ മുഴുവൻ ഞാൻ നിന്റെ കൈയിൽ ഏൽപ്പിക്കും. അപ്പോൾ ഞാൻ യഹ്‌വേയാണെന്ന് നിങ്ങൾ[c] അറിയും.”'
