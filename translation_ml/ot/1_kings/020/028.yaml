source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: ml
  text: 'ദൈവപുരുഷൻ അടുത്തുവന്ന് ഇസ്രായേലിന്റെ രാജാവിനോട് പറഞ്ഞു: “യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ‘യഹ്‌വേ പർവതങ്ങളുടെ ഒരു ദൈവമാണ്, എന്നാൽ താഴ്‌വരകളുടെ ദൈവമല്ല’[b] എന്ന് അരാം[a] പറഞ്ഞതിനാൽ, ഈ വലിയ സൈന്യക്കൂട്ടത്തെ മുഴുവൻ ഞാൻ നിന്റെ കൈയിൽ ഏൽപ്പിക്കും. അപ്പോൾ ഞാൻ യഹ്‌വേയാണെന്ന് നിങ്ങൾ[c] അറിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അരാം’; ചില പരമ്പരാഗത പരിഭാഷകളിൽ ‘സിറിയ’.
    reason: alternative_reading
  - marker: b
    text: ‘പർവതങ്ങൾ ... താഴ്‌വരകൾ’ എന്നതിന് ‘കുന്നുകൾ ... സമതലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായം ഉയർന്ന ഭൂപ്രദേശത്തെയും താഴ്ന്ന ഭൂപ്രദേശത്തെയും തമ്മിൽ വിരുദ്ധമാക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘നിങ്ങൾ അറിയും’ എന്ന എബ്രായ ക്രിയ ബഹുവചനമാണ്; വാക്കുകൾ രാജാവിനോടു പറയുന്നുവെങ്കിലും ഇസ്രായേൽജനത്തെ കൂട്ടായ്മയായി ഉൾക്കൊള്ളുന്നു.
    reason: grammatical_clarification
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: സന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ട പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വിശേഷണമായതിനാൽ നിർദിഷ്ടതയും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുവന്ന്
  rationale: നגשׁ എന്ന ക്രിയയുടെ സമീപിക്കുക എന്ന നേരിട്ടുള്ള ചലനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ ഔദ്യോഗിക പ്രഖ്യാപനസൂത്രം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ അതിന്റെ വ്യക്തിനാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ‘സിറിയ’ എന്ന ഭൂമിശാസ്ത്രനാമം കൊണ്ടുവരാതെ എബ്രായ നാമം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: പർവതങ്ങളുടെ ദൈവമാണ്, എന്നാൽ താഴ്‌വരകളുടെ ദൈവമല്ല
  rationale: ഉയർന്ന ഭൂപ്രദേശവും താഴ്ന്ന ഭൂപ്രദേശവും തമ്മിലുള്ള എബ്രായ വൈരുധ്യം നേരിട്ട് നിലനിർത്തുകയും അരാമ്യരുടെ പ്രദേശപരിമിത ദൈവസങ്കൽപ്പം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ഈ വലിയ സൈന്യക്കൂട്ടത്തെ മുഴുവൻ
  rationale: הָמוֹן എന്നതിന്റെ വലിയ ജനസമൂഹം എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് യുദ്ധസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: בְּיָדֶךָ
  choice: നിന്റെ കൈയിൽ ഏല്പിക്കും
  rationale: രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനവും ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ വിജയരൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וִידַעְתֶּם
  choice: നിങ്ങൾ അറിയും
  rationale: ക്രിയ രണ്ടാം പുരുഷ ബഹുവചനമായതിനാൽ രാജാവിനപ്പുറം ഇസ്രായേൽ സമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന രൂപം ഉപയോഗിക്കുന്നു.
- source_word: כִּי אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേയാണെന്ന്
  rationale: ദൈവത്തിന്റെ സ്വയംതിരിച്ചറിയിക്കൽ വ്യക്തിനാമത്തോടുകൂടി നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: അരാമ്യരുടെ പ്രദേശപരിമിത ദൈവസങ്കൽപ്പം
  choice: പർവതങ്ങളുടെ ദൈവമാണ്, എന്നാൽ താഴ്‌വരകളുടെ ദൈവമല്ല
  alternative: കുന്നുകളുടെ ദൈവം, സമതലങ്ങളുടെ ദൈവമല്ല
  rationale: അവരുടെ തെറ്റായ അവകാശവാദം തിരുത്താതെ ഉദ്ധരിക്കുകയും പർവതം–താഴ്‌വര എന്ന മൂലവൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: וִידַעְתֶּם എന്ന ക്രിയയുടെ വചനം
  choice: 'ബഹുവചനം: ‘നിങ്ങൾ അറിയും’'
  alternative: 'ഏകവചനം: ‘നീ അറിയും’'
  rationale: പ്രസംഗം രാജാവിനോടാണെങ്കിലും എബ്രായ ക്രിയ വ്യക്തമായി ബഹുവചനമാണ്; അതിനാൽ ഫലം ഇസ്രായേലിലേക്കു കൂട്ടായ്മയായി വ്യാപിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. പ്രവാചകപ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു; രാജാവിനോടുള്ള ഏകവചനമായ ‘നിന്റെ’യും ഇസ്രായേലിനെ ഉൾക്കൊള്ളുന്ന ബഹുവചനമായ ‘നിങ്ങൾ’യും വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
