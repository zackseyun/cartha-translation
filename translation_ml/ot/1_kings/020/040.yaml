  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ രാജസദസ്സ്-നിയമഭാഷ ഉപയോഗിച്ചു. ‘അങ്ങയുടെ’ എന്ന രൂപം രാജാവിനോടുള്ള ബഹുമാനം വ്യക്തമാക്കുന്നു; അവസാന വാക്യത്തിൽ സ്വയം വിധി നിർണയിച്ചെന്ന ഊന്നൽ നിലനിർത്തി.
