  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: ml
  text: 'അങ്ങയുടെ ദാസൻ അവിടെയും ഇവിടെയും തിരക്കിലായിരിക്കുമ്പോൾ[a], അവൻ അവിടെ ഉണ്ടായിരുന്നില്ല[b]. അപ്പോൾ ഇസ്രായേൽരാജാവ് അവനോടു പറഞ്ഞു: “നിന്റെ വിധി അങ്ങനെതന്നെ[c]; നീതന്നെയാണ് അത് തീരുമാനിച്ചത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതും അതും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ.” വിവിധ ദിശകളിലോ ജോലികളിലോ വ്യാപൃതനായിരിക്കുക എന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അവൻ ഇല്ല”; അതായത്, കാവലിലുണ്ടായിരുന്ന ആ മനുഷ്യൻ ഇനി അവിടെ ഉണ്ടായിരുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: “വിധി” എന്നതിന് ഇവിടെ “ശിക്ഷാനിർണയം” അല്ലെങ്കിൽ “ന്യായവിധി” എന്നും പരിഭാഷപ്പെടുത്താം. സംസാരിച്ചവൻ പറഞ്ഞ മാനദണ്ഡം രാജാവ് അവനുതന്നെ ബാധകമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോഴുള്ള വിനയപൂർവമായ ആത്മപരാമർശമാണിത്. ‘അടിമ’ എന്ന അർഥം സാധ്യമാണെങ്കിലും, ഈ രാജസദസ്സിലെ സന്ദർഭത്തിൽ ‘ദാസൻ’ സാമൂഹികമായ താഴ്മയും ബഹുമാനഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: അവിടെയും ഇവിടെയും തിരക്കിലായിരിക്കുമ്പോൾ
  rationale: വിവിധ ദിശകളിലോ കാര്യങ്ങളിലോ വ്യാപൃതനായിരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ശ്രദ്ധ ചിതറിയിരുന്നതിന്റെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: וְהוּא אֵינֶנּוּ
  choice: അവൻ അവിടെ ഇല്ലാതായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ ഇല്ല’ എന്നാണ്. കാവലിലുണ്ടായിരുന്ന മനുഷ്യൻ ഇനി അവിടെ ഉണ്ടായിരുന്നില്ലെന്ന ആശയം നൽകുന്നു; അവൻ എങ്ങനെ പോയി എന്ന് പാഠം പറയുന്നതിലധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: എബ്രായത്തിലെ സാധാരണ പദവിനിർമാണം മലയാളത്തിൽ സ്വാഭാവികമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: നിന്റെ വിധി അങ്ങനെതന്നെ ആയിരിക്കട്ടെ
  rationale: രാജാവ് ഔപചാരികമായി പ്രസ്താവിക്കുന്ന ന്യായവിധിയുടെ ഭാവം നിലനിർത്തുന്നു. מִשְׁפָּט എന്നത് ഇവിടെ ആ മനുഷ്യനു ബാധകമായ വിധിയെയോ ശിക്ഷാനിർണയത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אַתָּה חָרָצְתָּ
  choice: നീതന്നെയാണ് അതു തീരുമാനിച്ചത്
  rationale: പ്രകടമായ אַתָּה എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നീതന്നെയാണ്’ എന്നു നൽകി. חרץ എന്ന ക്രിയയുടെ തീരുമാനിക്കുക/നിർണയിക്കുക എന്ന നിയമസന്ദർഭത്തിലെ അർഥം സംരക്ഷിക്കുന്നു.
