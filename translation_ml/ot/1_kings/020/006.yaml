  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: ml
  text: അല്ല[a], മറിച്ച്, നാളെ ഈ സമയത്ത് ഞാൻ എന്റെ ദാസന്മാരെ നിന്റെ അടുക്കലേക്ക് അയക്കും; അവർ നിന്റെ വീടും നിന്റെ ദാസന്മാരുടെ വീടുകളും തിരയും. നിന്റെ കണ്ണുകൾക്കു പ്രിയപ്പെട്ടതെല്ലാം അവർ കൈവശപ്പെടുത്തി കൊണ്ടുപോകും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറിച്ച്.’ ഈ ഹീബ്രു പ്രയോഗം മുമ്പ് പറഞ്ഞ പരിധിയെ തള്ളിക്കളഞ്ഞ് ഭീഷണി കടുപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം, ‘തങ്ങളുടെ കൈകളിൽ വെച്ച് എടുക്കും’; അതായത്, കൈവശപ്പെടുത്തി കൊണ്ടുപോകും.
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי אִם
  choice: അല്ല
  rationale: മുൻപ് പറഞ്ഞ പരിധിയെ തള്ളിക്കളഞ്ഞ് ഭീഷണി കടുപ്പിക്കുന്ന തിരുത്തൽഭാവം സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു; ‘അല്ല’ ആ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּעֵת מָחָר
  choice: നാളെ ഏകദേശം ഈ സമയത്ത്
  rationale: അടുത്ത ദിവസം ഏതാണ്ട് ഇതേ സമയത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עֲבָדַי
  choice: എന്റെ ദാസന്മാർ
  rationale: രാജാവിന്റെ ദൂതന്മാരെയോ ഔദ്യോഗിക സേവകരെയോ ഇവിടെ സൂചിപ്പിക്കുന്നു; അടിമസ്ഥിതി ഊന്നിപ്പറയാത്ത പൊതുവായ പദം അനുയോജ്യം.
- source_word: וְחִפְּשׂוּ
  choice: പരിശോധിക്കും
  rationale: സമഗ്രമായി തിരഞ്ഞുനോക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ ബലപ്രയോഗം അനാവശ്യമായി വർധിപ്പിക്കാതെ അന്വേഷണത്തിന്റെ തീവ്രത അറിയിക്കുന്നു.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: നിന്റെ ഭവനവും നിന്റെ ദാസന്മാരുടെ ഭവനങ്ങളും
  rationale: בַּיִת എന്ന പദത്തിന് അരമന എന്നും അർഥമാകാമെങ്കിലും, ആവർത്തനവും സമാന്തരഘടനയും നിലനിർത്താൻ ‘ഭവനം’ ഉപയോഗിച്ചു.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: നിന്റെ കണ്ണുകൾക്ക് പ്രിയമായതെല്ലാം
  rationale: ഒരാൾക്ക് അമൂല്യവും അഭിലഷണീയവും ആനന്ദകരവുമായതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ദൃശ്യപ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: അവർ തങ്ങളുടെ കൈകളിലാക്കി കൊണ്ടുപോകും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തങ്ങളുടെ കൈയിൽ വെച്ച് എടുക്കും’ എന്ന ക്രമം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിച്ച്, കൈവശപ്പെടുത്തി നീക്കിക്കൊണ്ടുപോകുന്ന ഭീഷണി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. രാജകീയ പശ്ചാത്തലത്തിന് ചേരാൻ ‘ദാസന്മാർ’, ‘ഭവനം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രു ദൃശ്യപ്രയോഗമായ ‘കണ്ണുകൾക്ക് പ്രിയമായത്’ സംരക്ഷിച്ചു.
