- from: അല്ല[a]; നാളെ ഏകദേശം ഈ സമയത്ത് ഞാൻ എന്റെ ദാസന്മാരെ നിന്റെ അടുക്കൽ അയക്കും. അവർ നിന്റെ ഭവനവും നിന്റെ ദാസന്മാരുടെ ഭവനങ്ങളും പരിശോധിക്കും. നിന്റെ കണ്ണുകൾക്ക് പ്രിയമായതെല്ലാം[b] അവർ തങ്ങളുടെ കൈകളിലാക്കി കൊണ്ടുപോകും.
