  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ യുദ്ധത്തിനായി അണിനിരക്കുകയും ആവശ്യമായ സാധനങ്ങളാൽ സജ്ജരാകുകയും ചെയ്തു; അവർ അരാമ്യരെ നേരിടാൻ പുറപ്പെട്ടു. ഇസ്രായേൽമക്കൾ അവരുടെ എതിർവശത്ത് രണ്ടു ചെറിയ ആട്ടിൻകൂട്ടങ്ങളെപ്പോലെ[a] പാളയമടിച്ചു; എന്നാൽ അരാമ്യർ ദേശം നിറഞ്ഞുനിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രണ്ടു ചെറിയ ആട്ടിൻകൂട്ടങ്ങൾ” എന്നിടത്തെ എബ്രായപ്രയോഗത്തിൽ അപൂർവമായ חֲשִׂפֵי എന്ന പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അരാമ്യരുടെ വിപുലമായ സൈന്യത്തോടു താരതമ്യപ്പെടുത്തുമ്പോൾ ഇസ്രായേല്യർ രണ്ടു തീരെ ചെറിയ കൂട്ടങ്ങളായി കാണപ്പെട്ടുവെന്നതാണ് ഉപമയുടെ ആശയം.
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: സൈന്യത്തിനായി അണിനിരത്തി
  rationale: פקד എന്ന ക്രിയയുടെ ഈ രൂപം യുദ്ധത്തിനായി ആളുകളെ കണക്കെടുത്ത് സജ്ജരാക്കുകയോ അണിനിരത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭം വ്യക്തമാക്കാൻ ‘സൈന്യത്തിനായി’ ചേർത്തു.
- source_word: וְכָלְכְּלוּ
  choice: അവർക്കു വേണ്ട സാധനങ്ങൾ നൽകി
  rationale: כלכל ഇവിടെ യുദ്ധയാത്രയ്ക്കാവശ്യമായ വിഭവങ്ങൾ നൽകി സജ്ജമാക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: לִקְרָאתָם
  choice: അരാമ്യരെ നേരിടാൻ
  rationale: ഈ ഘടന ‘അവരെ കാണാൻ/എതിരിടാൻ പുറപ്പെടുക’ എന്നർഥം വഹിക്കുന്നു; സൈനികസന്ദർഭത്തിലെ പ്രതിയോഗിത്വം ‘നേരിടാൻ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘അരാമ്യരെ’ എന്നു നൽകി.
- source_word: נֶגְדָּם
  choice: അവരുടെ എതിർവശത്ത്
  rationale: נגד എതിർവശത്തോ അഭിമുഖമായോ ഉള്ള സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; പാളയങ്ങളുടെ നേർക്കുനേർ സ്ഥാനം ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: രണ്ടു ചെറിയ ആട്ടിൻകൂട്ടങ്ങളെപ്പോലെ
  rationale: חֲשִׂפֵי അപൂർവമായ പദമാണ്; സന്ദർഭത്തിൽ അരാമ്യസൈന്യത്തോടു താരതമ്യപ്പെടുത്തുമ്പോൾ രണ്ടു ചെറുകൂട്ടങ്ങളായി കണ്ട ഇസ്രായേലിനെ ചിത്രീകരിക്കുന്നു. അപൂർവത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: എന്നാൽ അരാമ്യർ ദേശം നിറഞ്ഞുനിന്നു
  rationale: മൂലത്തിലെ waw ലളിതമായ സംയോജകമാണെങ്കിലും രണ്ടു ചെറിയ ഇസ്രായേൽ കൂട്ടങ്ങളും ദേശം നിറച്ച അരാമ്യരും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് പ്രകടമാക്കുന്നു. ബഹുവചനക്രിയ അരാമ്യസൈനികരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അരാമ്യർ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: പരമ്പരാഗത സമൂഹനാമമായ ‘ഇസ്രായേൽമക്കൾ’ എബ്രായപ്രയോഗത്തിന്റെ സ്വഭാവം സംരക്ഷിക്കുകയും മലയാളത്തിൽ പരിചിതവും മാന്യവുമായി നിലനിൽക്കുകയും ചെയ്യുന്നു.
