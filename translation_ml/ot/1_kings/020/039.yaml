  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: ml
  text: 'രാജാവ് കടന്നുപോകുമ്പോൾ, അവൻ രാജാവിനോടു ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “അങ്ങയുടെ ദാസൻ യുദ്ധത്തിന്റെ നടുവിലേക്കു പോയിരുന്നു. അപ്പോൾ ഒരാൾ മാറിവന്ന് മറ്റൊരാളെ എന്റെ അടുക്കൽ കൊണ്ടുവന്ന് പറഞ്ഞു: ‘ഈ മനുഷ്യനെ കാത്തുകൊള്ളുക. ഇവനെ എങ്ങനെയെങ്കിലും കാണാതായാൽ[a], ഇവന്റെ ജീവന് പകരം നിന്റെ ജീവൻ കൊടുക്കേണ്ടിവരും[b]; അല്ലെങ്കിൽ നീ ഒരു താലന്ത് വെള്ളി തൂക്കിക്കൊടുക്കണം.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവനെ കാണാതാകുകയോ ഇവൻ കണക്കുകിട്ടാതാകുകയോ ചെയ്താൽ.” ഹീബ്രുവിൽ ഒരേ ക്രിയയുടെ രണ്ടു രൂപങ്ങൾ ചേർത്ത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “നിന്റെ ജീവൻ അവന്റെ ജീവന്റെ സ്ഥാനത്ത്”; ഇത് പകരംവെക്കലിനെ സൂചിപ്പിക്കുന്ന നിയമപരമായ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: കടന്നുപോകുമ്പോൾ
  rationale: ויהי സഹിതമുള്ള വർത്തമാനകൃദന്തം പശ്ചാത്തലത്തിലെ തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: צָעַק
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: അടിയന്തരവും ഉച്ചത്തിലുള്ളതുമായ വിളി എന്ന ക്രിയയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള സഭ്യമായ സ്വയംപരാമർശമാണ്; ഇവിടെ അടിമ എന്നതിനെക്കാൾ ദാസൻ സന്ദർഭോചിതം.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: യുദ്ധത്തിന്റെ നടുവിലേക്കു
  rationale: קֶרֶב സൂചിപ്പിക്കുന്ന യുദ്ധത്തിന്റെ മധ്യഭാഗം അഥവാ കനത്ത പോരാട്ടത്തിനുള്ളിലെ സ്ഥാനം നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ
  rationale: ഹീബ്രുവിലെ പെട്ടെന്നുള്ള ദൃശ്യാവതരണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ סָר
  choice: ഒരാൾ പോരിൽനിന്നു മാറിവന്ന്
  rationale: סור എന്നതിന്റെ മാറിനിൽക്കുക/വഴിമാറുക എന്ന അർഥം നിലനിർത്തുകയും യുദ്ധസന്ദർഭത്തിലെ സൂചിത ചലനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: മറ്റൊരാളെ എന്റെ അടുക്കൽ കൊണ്ടുവന്ന്
  rationale: ആദ്യത്തെ ആളും കാവലേൽപ്പിക്കപ്പെട്ട രണ്ടാമത്തെ ആളും വ്യത്യസ്തരാണെന്ന വാക്യഘടന വ്യക്തമാക്കുന്നു.
- source_word: שְׁמֹר
  choice: കാത്തുകൊള്ളുക
  rationale: തടവിലുള്ള ഒരാളെ ഉത്തരവാദിത്വത്തോടെ കാവൽ ചെയ്യുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: ഇവനെ എങ്ങനെയെങ്കിലും കാണാതായാൽ
  rationale: നിഫാൽ infinitive absolute-ഉം finite verb-ഉം ചേർന്ന ഊന്നൽ ‘എങ്ങനെയെങ്കിലും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; കണക്കിൽപ്പെടാതാകുക/കാണാതാകുക എന്ന സാധ്യത നിലനിർത്തുന്നു.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ഇവന്റെ ജീവന് പകരം നിന്റെ ജീവൻ കൊടുക്കേണ്ടിവരും
  rationale: נפש ഇവിടെ ‘ജീവൻ’ എന്നും תחת നിയമപരമായ പകരംവെക്കൽ എന്നും ഗ്രഹിച്ച് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּכַּר כֶּסֶף
  choice: ഒരു താലന്ത് വെള്ളി
  rationale: പുരാതന തൂക്കയളവായ ככר പരമ്പരാഗതമായ ‘താലന്ത്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּשְׁקוֹל
  choice: തൂക്കിക്കൊടുക്കണം
  rationale: വെള്ളി തൂക്കത്തിന്റെ അടിസ്ഥാനത്തിൽ നൽകുന്ന ഭൗതിക ദൃശ്യം ‘പണം കൊടുക്കണം’ എന്ന പൊതുവായ പരിഭാഷയേക്കാൾ നന്നായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ജീവന് പകരം ജീവൻ എന്ന നിയമപരമായ സൂത്രവാക്യം
  choice: ഇവന്റെ ജീവന് പകരം നിന്റെ ജീവൻ കൊടുക്കേണ്ടിവരും
  alternative: നിന്റെ ജീവൻ ഇവന്റെ ജീവന്റെ സ്ഥാനത്തായിരിക്കും
  rationale: ശിക്ഷയുടെ പകരംവെക്കൽ സ്വഭാവം വ്യക്തമാക്കുമ്പോഴും വാക്യത്തെ പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തവുമായി ബന്ധിപ്പിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. രാജാവിനോടുള്ള ആദരസൂചകമായി ‘അങ്ങയുടെ’ എന്നും ഉദ്ധരിച്ച ഉത്തരവിൽ ഏകവചനമായ ‘നിന്റെ’ എന്നും നൽകി. ‘താലന്ത്’ പുരാതന തൂക്കയളവായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
