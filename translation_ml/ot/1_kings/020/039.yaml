  to: 'രാജാവ് കടന്നുപോകുമ്പോൾ, അവൻ രാജാവിനോടു ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “അങ്ങയുടെ ദാസൻ യുദ്ധത്തിന്റെ നടുവിലേക്കു പോയിരുന്നു. അപ്പോൾ ഒരാൾ മാറിവന്ന് മറ്റൊരാളെ എന്റെ അടുക്കൽ കൊണ്ടുവന്ന് പറഞ്ഞു: ‘ഈ മനുഷ്യനെ കാത്തുകൊള്ളുക. ഇവനെ എങ്ങനെയെങ്കിലും കാണാതായാൽ[a], ഇവന്റെ ജീവന് പകരം നിന്റെ ജീവൻ കൊടുക്കേണ്ടിവരും[b]; അല്ലെങ്കിൽ നീ ഒരു താലന്ത് വെള്ളി തൂക്കിക്കൊടുക്കണം.’”'
