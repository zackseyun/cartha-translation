source:
  edition: WLC
  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ രാജാവ് ദേശത്തിലെ എല്ലാ മൂപ്പന്മാരെയും വിളിച്ചുവരുത്തി പറഞ്ഞു: “ദയവായി മനസ്സിലാക്കി നോക്കൂ, ഈ മനുഷ്യൻ കുഴപ്പം ഉണ്ടാക്കാനാണ് ശ്രമിക്കുന്നത്. എന്റെ ഭാര്യമാരെയും മക്കളെയും വെള്ളിയെയും പൊന്നിനെയും ആവശ്യപ്പെട്ട് അവൻ എന്റെ അടുക്കലേക്ക് ആളയച്ചു; ഞാൻ അവനിൽനിന്ന് അവയൊന്നും തടഞ്ഞുവെച്ചില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּעוּ נָא וּרְאוּ
  choice: ദയവായി മനസ്സിലാക്കി നോക്കൂ
  rationale: ידע (‘അറിയുക/മനസ്സിലാക്കുക’) എന്നും ראה (‘കാണുക/ശ്രദ്ധിക്കുക’) എന്നും ഉള്ള ഇരട്ട ആഹ്വാനവും נָאയുടെ വിനയപൂർവമായ അഭ്യർഥനാഭാവവും നിലനിർത്തുന്നു.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: ഈ മനുഷ്യൻ അനർഥമാണ് അന്വേഷിക്കുന്നത്
  rationale: רָעָה എന്നത് ‘തിന്മ’, ‘ദോഷം’, ‘ദുരന്തം/അനർഥം’ എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ രാജാവിന് ദോഷം വരുത്താനുള്ള ഉദ്ദേശ്യമാണ് മുൻനിൽക്കുന്നത്; ‘അനർഥം’ ആ അർത്ഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
- source_word: שָׁלַח אֵלַי לְנָשַׁי וּלְבָנַי וּלְכַסְפִּי וְלִזְהָבִי
  choice: എന്റെ ഭാര്യമാരെയും മക്കളെയും വെള്ളിയെയും പൊന്നിനെയും ആവശ്യപ്പെട്ട് അവൻ എന്റെ അടുക്കൽ ആളയച്ചു
  rationale: שָׁלַח אֵלַי എന്നത് അക്ഷരാർഥത്തിൽ ‘എന്റെ അടുക്കൽ അയച്ചു’ എന്നാണ്; സന്ദർഭം ദൂതന്മാരെ അയച്ച് ഇവ ആവശ്യപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ആളയച്ചു’ എന്നും ഉദ്ദേശ്യം ‘ആവശ്യപ്പെട്ട്’ എന്നും പ്രകടമാക്കി.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: ഞാൻ അവനിൽനിന്ന് അവയൊന്നും തടഞ്ഞുവെച്ചില്ല
  rationale: מנע מן എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ‘ഒരാളിൽനിന്ന് ഒന്നിനെ തടഞ്ഞുവെക്കുക/നിഷേധിക്കുക’ എന്ന അർത്ഥം സംരക്ഷിക്കുന്നു; കർമം മുൻപത്തെ പട്ടികയിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നതിനാൽ മലയാളത്തിൽ ‘അവയൊന്നും’ ചേർത്തു.
theological_decisions:
- issue: רָעָה എന്ന പദത്തിന്റെ ധാർമ്മികമോ സാഹചര്യപരമോ ആയ അർത്ഥം
  choice: അനർഥം
  alternative: തിന്മ / കുഴപ്പം
  rationale: വ്യക്തിയുടെ അന്തർധാർമ്മിക നിലയെ മാത്രം വിധിക്കാതെ, അവൻ ലക്ഷ്യമിടുന്ന ദോഷകരമായ ഫലത്തെയും ഉൾക്കൊള്ളുന്ന പദം തിരഞ്ഞെടുത്തു. ഇതിലൂടെ മൂലത്തിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും നേരിട്ടുള്ള സംഭാഷണശൈലിയും നിലനിർത്തി. ‘മൂപ്പന്മാർ’, ‘വെള്ളി’, ‘പൊന്ന്’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
