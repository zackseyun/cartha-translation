translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആജ്ഞകളുടെ നേരിട്ടുള്ള ശക്തിയും ‘അറിയുക—കാണുക’ എന്ന യുഗ്മവും കാലപ്രയോഗത്തിലെ രൂപകവും പരമാവധി നിലനിർത്തി; എന്നാൽ സാധാരണ വായനക്കാർക്ക് അസ്വാഭാവികമാകുന്ന പദാനുപദഘടന ഒഴിവാക്കി.
