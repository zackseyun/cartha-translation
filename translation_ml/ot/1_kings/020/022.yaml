  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: ml
  text: 'പിന്നെ പ്രവാചകൻ ഇസ്രായേൽരാജാവിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “പോയി സ്വയം ശക്തിപ്പെടുത്തുക; നീ എന്തു ചെയ്യണമെന്ന്[b] അറിഞ്ഞു നോക്കുക. കാരണം, വർഷം തിരിയുമ്പോൾ[a] അരാംരാജാവ്[c] നിനക്കെതിരെ കയറിവരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘വർഷത്തിന്റെ മടക്കത്തിൽ/തിരിവിൽ.’ സൈനികയാത്രകൾ വീണ്ടും ആരംഭിച്ചിരുന്ന കാലത്തെ, പലപ്പോഴും അടുത്ത വസന്തകാലത്തെ, ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നീ എന്തു ചെയ്യുമെന്ന്.’ എബ്രായക്രിയ രൂപത്തിൽ ഭാവികാലമാണെങ്കിലും, ഇവിടെ രാജാവ് ഒരുക്കമായി എന്തു ചെയ്യണം എന്ന പ്രായോഗിക അർഥമാണ് സാധ്യതയേറിയത്.
    reason: lexical_alternative
  - marker: c
    text: പരമ്പരാഗതമായി ‘സിറിയാരാജാവ്’; എബ്രായത്തിൽ ‘അരാം.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുക്കൽ വന്നു
  rationale: נגשׁ എന്ന ക്രിയയുടെ ‘സമീപിക്കുക/അടുത്തുവരുക’ എന്ന മൂർത്തമായ അർഥം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നിലനിർത്തുന്നു.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: നിശ്ചയാർഥകപ്രത്യയമുള്ള ഈ പദം സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന പ്രവാചകനെ സൂചിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രു construct chain-നെ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തനാമമായി നൽകുന്നു.
- source_word: לֵךְ
  choice: പോയി
  rationale: הלך എന്നതിന്റെ ആജ്ഞാരൂപം; തുടർന്നുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: הִתְחַזַּק
  choice: സ്വയം ശക്തിപ്പെടുത്തുക
  rationale: Hitpael രൂപത്തിന്റെ ആത്മനിർദ്ദേശക ഭാവവും വരാനിരിക്കുന്ന സംഘർഷത്തിനുള്ള ഒരുക്കത്തിന്റെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: וְדַע וּרְאֵה
  choice: അറിഞ്ഞു നോക്കുക
  rationale: ‘അറിയുക’, ‘കാണുക’ എന്നീ രണ്ടു ഹീബ്രു ആജ്ഞകളെയും മലയാളത്തിൽ സ്വാഭാവികമായ ഒരു യുഗ്മപ്രയോഗമായി നിലനിർത്തുന്നു; വെറും ധൈര്യപ്പെടുക എന്നോ ആലോചിക്കുക എന്നോ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: നീ എന്തു ചെയ്യണമെന്ന്
  rationale: രൂപപരമായി ഭാവികാലസാധ്യതയുണ്ടെങ്കിലും സന്ദർഭത്തിലെ പ്രായോഗിക ഉപദേശഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘എന്തു ചെയ്യുമെന്ന്’ എന്ന പകരംവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള ആജ്ഞകൾക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: വർഷം തിരിയുമ്പോൾ
  rationale: ‘വർഷത്തിന്റെ മടക്കം/തിരിവ്’ എന്ന ഹീബ്രു കാലപ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: പിന്നീടുള്ള ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’യ്ക്കു പകരം ഹീബ്രുവിലെ אֲרָם നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: עֹלֶה עָלֶיךָ
  choice: നിനക്കെതിരെ കയറിവരും
  rationale: עלה על എന്ന സൈനികപ്രയോഗത്തിലെ ‘എതിരെ കയറിവരുക’ എന്ന ദൃശ്യഭാവവും participle നൽകുന്ന ഉറപ്പുള്ള സമീപഭാവി അർഥവും നിലനിർത്തുന്നു.
