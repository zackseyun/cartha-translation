  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: ml
  text: അരാം[b]രാജാവായ ബെൻ-ഹദദ് തന്റെ സൈന്യത്തെ മുഴുവൻ ഒരുമിച്ചുകൂട്ടി.[a] മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും കുതിരകളും രഥങ്ങളും അവനോടൊപ്പം ഉണ്ടായിരുന്നു. അവൻ കയറിച്ചെന്ന് ശമര്യയെ ഉപരോധിക്കുകയും അതിനെതിരെ യുദ്ധം ചെയ്യുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു വാക്യം ഒരു ബന്ധകത്തോടെ ആരംഭിക്കുന്നു. കൂടുതൽ ഔപചാരികമായ പരിഭാഷയിൽ വാക്യത്തിന്റെ തുടക്കത്തിൽ ‘അങ്ങനെ’ എന്നൊരു ബന്ധകപദം ചേർക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അരാം’ എന്നത് ഹീബ്രു സ്ഥലനാമമാണ്; പരമ്പരാഗത പരിഭാഷകളിൽ ‘സിറിയ’ എന്നും കാണാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. വാക്യാരംഭത്തിലെ ו സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെയും ബന്ധാർഥം നിലനിർത്താം.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ എന്നതിനു പകരം ഹീബ്രു സ്ഥലനാമമായ אֲרָם നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: തന്റെ സൈന്യത്തെ മുഴുവൻ ഒരുമിച്ചുകൂട്ടി
  rationale: קבץ എന്ന ക്രിയയുടെ കൂട്ടിച്ചേർക്കൽ/ഒരുമിച്ചുകൂട്ടൽ എന്ന അർഥവും חַיִל എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ സൈനിക അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും ... അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: രാജാക്കന്മാർ ബെൻ-ഹദദിനൊപ്പം ഉണ്ടായിരുന്നുവെന്ന അനുഗമനാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְסוּס וָרָכֶב
  choice: കുതിരകളും രഥങ്ങളും
  rationale: ഹീബ്രുവിലെ ഏകവചന സമൂഹനാമങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി അവതരിപ്പിക്കുന്നു; സൈനിക ഉപകരണങ്ങളുടെ മൂർത്തമായ ചിത്രം നിലനിർത്തുന്നു.
- source_word: וַיַּעַל
  choice: അവൻ പുറപ്പെട്ടുചെന്ന്
  rationale: עלה എന്നതിന്റെ മുന്നേറ്റാർഥം സാഹചര്യാനുസൃതമായി നൽകുന്നു. ‘കയറിച്ചെന്നു’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭൂപ്രകൃതിയെ മുൻനിറുത്താൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: ശമര്യയെ ഉപരോധിക്കുകയും
  rationale: സൈനികസന്ദർഭത്തിലെ צור על എന്ന പ്രയോഗത്തിന് കൃത്യവും സാധാരണവുമായ മലയാള പദം ‘ഉപരോധിക്കുക’ ആണ്.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: അതിനെതിരെ യുദ്ധം ചെയ്യുകയും ചെയ്തു
  rationale: לחם ב എന്നതിലെ എതിർലക്ഷ്യബന്ധം ‘അതിനെതിരെ’ എന്നു സംരക്ഷിക്കുന്നു; മൂലപാഠത്തെക്കാൾ ശക്തമായ ‘ആക്രമിച്ചു’ എന്ന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സൈനിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നൽകി; ഹീബ്രു സ്ഥലനാമമായ ‘അരാം’ നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിലെ [b] ചിഹ്നം ‘horses and chariots’ എന്നതിന് ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് ‘Aram’ എന്ന നാമത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘അരാംരാജാവ്’ എന്നതിനോടടുത്ത പ്രസക്ത സ്ഥാനത്തേക്ക് മാറ്റുന്നതാണ് ആശയപരമായി ഉചിതം; എന്നാൽ എല്ലാ ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
