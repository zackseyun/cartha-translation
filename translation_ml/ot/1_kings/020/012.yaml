translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത സൈനിക കല്പനയും דבר എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
