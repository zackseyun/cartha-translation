  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: ml
  text: 'അവൻ ഈ സന്ദേശം[a] കേട്ടപ്പോൾ, അവനും രാജാക്കന്മാരും താൽക്കാലിക കുടിലുകളിൽ[b] പാനം ചെയ്തുകൊണ്ടിരിക്കുകയായിരുന്നു. അവൻ തന്റെ സേവകരോടു പറഞ്ഞു: “നിലയുറപ്പിക്കൂ!”[c] അങ്ങനെ അവർ നഗരത്തിനെതിരെ നിലയുറപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ വാക്ക്’ എന്നോ ‘ഈ കാര്യം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അഭയകുടിലുകളിൽ’ എന്നും പറയാം; പരമ്പരാഗതമായി ‘പന്തലുകളിൽ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രായ കല്പന അക്ഷരാർഥത്തിൽ ‘വെക്കൂ!’ എന്ന ഒറ്റവാക്കാണ്. നഗരത്തിനെതിരെ സൈനിക നിലയുറപ്പിക്കൽ സൂചിപ്പിക്കുന്ന ചുരുക്കിയ സൈനിക ഉത്തരവായിരിക്കാം ഇത്.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: ആ സന്ദേശം
  rationale: דבר എന്നതിന് ‘വാക്ക്’, ‘കാര്യം’, ‘സന്ദേശം’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ബെൻ-ഹദദ് ആഹാബിന്റെ അറിയിക്കപ്പെട്ട മറുപടി കേൾക്കുന്നതിനാൽ ‘സന്ദേശം’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: അവനും രാജാക്കന്മാരും ... മദ്യപിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഹീബ്രായ പങ്കാളിത്തരൂപം അപ്പോൾ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പാനീയത്തിന്റെ സ്വഭാവം സന്ദർഭത്തിൽ മദ്യപാനമാണെന്ന് വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ഇങ്ങനെ നൽകി.
- source_word: בַּסֻּכּוֹת
  choice: താത്കാലിക കൂടാരങ്ങളിൽ
  rationale: סֻכּוֹת താത്കാലികമായി നിർമിച്ച അഭയസ്ഥലങ്ങളെയോ കൂടാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘താത്കാലിക കൂടാരങ്ങൾ’ ആ സൈനികപ്പാളയസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: שִׂימוּ
  choice: സ്ഥാനമുറപ്പിക്കൂ
  rationale: ശാബ്ദികമായി ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നർഥമുള്ള ഈ ഏകപദ കല്പന ഇവിടെ സംക്ഷിപ്തമായ സൈനിക ഉത്തരവാണ്. ആക്രമണം ആരംഭിക്കണമെന്ന് അതിരുകടന്ന് വ്യക്തമാക്കാതെ സൈനിക വിന്യാസം സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: അവർ നഗരത്തിനെതിരെ സ്ഥാനമുറപ്പിച്ചു
  rationale: ഹീബ്രായ പ്രയോഗം സംക്ഷിപ്തമാണ്; על ഇവിടെ നഗരത്തിനെതിരായ ശത്രുതാപരമായ വിന്യാസം സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ആവർത്തനവും ചുരുക്കവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
