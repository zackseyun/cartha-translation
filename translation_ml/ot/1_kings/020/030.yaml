  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സ്ഥലനാമവും വ്യക്തിനാമവും മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. സംഖ്യയും യുദ്ധസന്ദർഭത്തിലെ പുരുഷസൂചനയും നിലനിർത്തി; חֶדֶר בְּחָדֶר എന്ന പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
