  text: וַ/יָּנֻ֨סוּ הַ/נּוֹתָרִ֥ים אֲפֵקָ/ה֮ אֶל הָ/עִיר֒ וַ/תִּפֹּל֙ הַ/חוֹמָ֔ה עַל עֶשְׂרִ֨ים וְ/שִׁבְעָ֥ה אֶ֛לֶף אִ֖ישׁ הַ/נּוֹתָרִ֑ים וּ/בֶן הֲדַ֣ד נָ֔ס וַ/יָּבֹ֥א אֶל הָ/עִ֖יר חֶ֥דֶר בְּ/חָֽדֶר׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: ml
  text: ശേഷിച്ചവർ അഫേക്കിലേക്കു, നഗരത്തിനകത്തേക്കു, ഓടിപ്പോയി. അപ്പോൾ ശേഷിച്ചിരുന്ന ഇരുപത്തേഴായിരം പുരുഷന്മാരുടെമേൽ മതിൽ വീണു. ബെൻ-ഹദദും ഓടിപ്പോയി നഗരത്തിനകത്തേക്കു കടന്ന് അകത്തെ ഒരു മുറിയിലേക്കു ചെന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “മുറിക്കുള്ളിലെ മുറിയിലേക്ക്”; കൂടുതൽ ഉള്ളിലുള്ളതോ ഏറ്റവും ഉള്ളിലുള്ളതോ ആയ ഒരു മുറി എന്ന അർഥസൂചനയുള്ള പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: ശേഷിച്ചവർ
  rationale: യുദ്ധത്തിനുശേഷം ജീവനോടെ ശേഷിച്ചവരെയാണ് ഈ രൂപം സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ സ്വാഭാവികവും മൂലപദത്തിന്റെ ആവർത്തനവുമായി ബന്ധം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: אֲפֵקָה
  choice: അഫേക്കിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה, അഫേക്കിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֶל הָעִיר
  choice: നഗരത്തിൽ അഭയം തേടി
  rationale: അക്ഷരാർഥം ‘നഗരത്തിലേക്ക്/നഗരത്തിനകത്തേക്ക്’ എന്നാണ്. പലായനത്തിന്റെ സന്ദർഭത്തിൽ നഗരത്തിനകത്തു കടക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: മതിൽ വീണു
  rationale: നിശ്ചിതവാചകമുള്ള חוֹמָה നഗരമതിലിനെയോ അതിന്റെ ഒരു ഭാഗത്തെയോ സൂചിപ്പിക്കാം; ഏതു ഭാഗമെന്ന് അതിരുകടന്ന് വ്യക്തമാക്കാതെ മൂലത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ הַנּוֹתָרִים
  choice: ശേഷിച്ചിരുന്ന ഇരുപത്തേഴായിരം പുരുഷന്മാരുടെമേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ’ എന്ന അർഥവും സൈനികസന്ദർഭത്തിലെ אִישׁ എന്നതിന്റെ പുരുഷസൂചനയും സംഖ്യയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבֶן הֲדַד נָס
  choice: ബെൻ-ഹദദും ഓടിപ്പോയി
  rationale: ആദ്യവാക്യത്തിലെ പലായനവുമായി സമാന്തരമായി ബെൻ-ഹദദും പലായനം ചെയ്തുവെന്ന ബന്ധം ‘-ഉം’ വ്യക്തമാക്കുന്നു; נוּס എന്ന ധാതുവിന്റെ അടിയന്തരത ‘ഓടിപ്പോയി’ പകരുന്നു.
- source_word: חֶדֶר בְּחָדֶר
  choice: ഒരു അകത്തെ മുറിയിൽ
  rationale: ‘മുറിക്കുള്ളിലെ മുറി’ എന്ന എബ്രായപ്രയോഗം മറഞ്ഞിരിക്കുന്ന കൂടുതൽ ഉള്ളിലുള്ള മുറിയെ സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി സ്വാഭാവികരൂപം മുഖ്യപാഠത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകുന്നു.
