  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלָ֛י/ו כָּל הַ/זְּקֵנִ֖ים וְ/כָל הָ/עָ֑ם אַל תִּשְׁמַ֖ע וְ/ל֥וֹא תֹאבֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: ml
  text: 'അപ്പോൾ എല്ലാ മൂപ്പന്മാരും ജനമെല്ലാം അവനോടു പറഞ്ഞു: “കേൾക്കരുത്; സമ്മതിക്കരുത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനുസരിക്കരുത്; സന്നദ്ധനാകരുത്” അല്ലെങ്കിൽ “അനുസരിക്കരുത്; സമ്മതിക്കരുത്.” എബ്രായ ക്രിയകൾക്ക് കേൾക്കുക/അനുസരിക്കുക (שׁמע), സന്നദ്ധനാകുക/സമ്മതിക്കുക (אבה) എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനോട്
  rationale: എബ്രായപാഠത്തിൽ വ്യക്തിനാമത്തിനു പകരം സർവനാമമാണ്; അതിനാൽ സന്ദർഭത്തിലെ രാജാവിനെ പേരെടുത്ത് വ്യക്തമാക്കാതെ സർവനാമം നിലനിർത്തുന്നു.
- source_word: כָּל הַזְּקֵנִים
  choice: എല്ലാ മൂപ്പന്മാരും
  rationale: ഇവിടെ זְקֵנִים പ്രായമായ പുരുഷന്മാരെ മാത്രം അല്ല, സമൂഹനേതാക്കളായ മൂപ്പന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: മൂപ്പന്മാരോടൊപ്പം പരാമർശിക്കുന്ന വിശാല ജനസമൂഹത്തെ സ്വാഭാവികവും സമഗ്രവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אַל תִּשְׁמַע
  choice: അവന്റെ വാക്കു കേൾക്കരുത്
  rationale: שׁמע എന്നതിന് കേൾക്കുക, ചെവികൊടുക്കുക, അനുസരിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ആവശ്യത്തിനു വഴങ്ങരുതെന്ന സന്ദർഭാർഥം നിലനിർത്തിക്കൊണ്ട് ‘വാക്കു കേൾക്കരുത്’ ആ ദ്വയാർഥം മലയാളത്തിൽ ഭാഗികമായി സംരക്ഷിക്കുന്നു; ‘അവന്റെ’ എന്നത് സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി പൂരിപ്പിച്ചതാണ്.
- source_word: וְלֹא תֹאבֶה
  choice: സമ്മതിക്കുകയും അരുത്
  rationale: אבה സന്നദ്ധതയെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ ആവശ്യത്തോടുള്ള പ്രതികരണസന്ദർഭത്തിൽ ‘സമ്മതിക്കുക’ യോജിച്ചതാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മൂപ്പന്മാർ’ സമൂഹനേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ-മലയാള പ്രയോഗമായി നിലനിർത്തി. അടിക്കുറിപ്പിലെ [a] ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
