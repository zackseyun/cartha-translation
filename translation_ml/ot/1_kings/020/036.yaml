id: 1KI.20.36
reference: 1 Kings 20:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ יַ֚עַן אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה הִנְּ/ךָ֤ הוֹלֵךְ֙ מֵֽ/אִתִּ֔/י וְ/הִכְּ/ךָ֖ הָ/אַרְיֵ֑ה וַ/יֵּ֨לֶךְ֙ מֵֽ/אֶצְל֔/וֹ וַ/יִּמְצָאֵ֥/הוּ הָ/אַרְיֵ֖ה וַ/יַּכֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അയാളോടു പറഞ്ഞു: “നീ യഹോവയുടെ വാക്ക് അനുസരിക്കാതിരുന്നതിനാൽ, ഇതാ, നീ എന്നെ വിട്ടുപോകുമ്പോൾ സിംഹം നിന്നെ അടിച്ചുവീഴ്ത്തും.” അയാൾ അവനെ വിട്ടുപോയപ്പോൾ സിംഹം അയാളെ കണ്ടെത്തി അടിച്ചുവീഴ്ത്തി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: ശബ്ദം അനുസരിക്കുക
  rationale: എബ്രായ പ്രയോഗത്തിൽ കേൾക്കുക എന്നതോടൊപ്പം അനുസരണം എന്ന അർഥവും ഉൾപ്പെടുന്നു; ‘ശബ്ദം അനുസരിക്കുക’ എന്നത് രണ്ടും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ പേരുരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ഒരു സാധാരണ സ്ഥാനപ്പേര് കൊണ്ട് മറച്ചിട്ടില്ല.
- source_word: הִנְּךָ
  choice: ഇതാ
  rationale: വരാനിരിക്കുന്ന വിധിയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ സൂചനയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: അടിച്ചുവീഴ്ത്തും / അടിച്ചുവീഴ്ത്തി
  rationale: ഒരേ എബ്രായ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു; പ്രഹരത്തിന്റെ മാരകസ്വഭാവം സൂചിപ്പിക്കുമ്പോഴും ‘കൊന്നു’ എന്ന് പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: מֵאִתִּי / מֵאֶצְלוֹ
  choice: എന്നെ വിട്ട് / അവനെ വിട്ട്
  rationale: വക്താവിന്റെ സന്നിധിയിൽനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ ‘കർത്താവ്’ എന്ന പദമല്ല, പ്രത്യേക ദൈവനാമമായ יהוה ആണ്; അതിനാൽ പേരുരൂപം ഉപയോഗിച്ചു.
- issue: സിംഹത്തിന്റെ പ്രഹരം മരണമായി വ്യക്തമാക്കണോ
  choice: അടിച്ചുവീഴ്ത്തി
  alternative: കൊന്നുകളഞ്ഞു
  rationale: സന്ദർഭം മരണത്തെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും ഈ വാക്യത്തിലെ ക്രിയ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്നതാണ്; മൂലപാഠം പറയുന്നതിലധികം വ്യക്തമാക്കാതെ അതിന്റെ ആവർത്തനം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രണ്ടു പുരുഷന്മാരെ വേർതിരിക്കാൻ വക്താവിനെ ‘അവൻ’ എന്നും അഭിസംബോധിതനെ ‘അയാൾ’ എന്നും നൽകി; അനാവശ്യ വ്യാഖ്യാനചേർക്കലുകൾ ഒഴിവാക്കി.
