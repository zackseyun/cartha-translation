  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: ml
  text: പിന്നെ അവൻ മറ്റൊരു മനുഷ്യനെ കണ്ടു. അവനോട്, “ദയവായി എന്നെ അടിക്കൂ” എന്നു പറഞ്ഞു. അപ്പോൾ ആ മനുഷ്യൻ അവനെ അടിച്ചു മുറിവേൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അടിക്കുക’ എന്ന ക്രിയ ഊന്നലിനായി ആവർത്തിക്കുന്നു; അക്ഷരാർഥത്തിൽ, ‘ആ മനുഷ്യൻ അവനെ അടിച്ചു—അടിക്കുകയും മുറിവേൽപ്പിക്കുകയും ചെയ്തു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: പിന്നെ അവൻ ... കണ്ടു
  rationale: വയീഖ്തോൽ രൂപം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്കു നീക്കുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ സംഭവക്രമവും מצא എന്നതിന്റെ അടിസ്ഥാന അർഥവും നൽകുന്നു.
- source_word: אִישׁ אַחֵר
  choice: മറ്റൊരു മനുഷ്യനെ
  rationale: אִישׁ എന്ന ഏകവചന പുല്ലിംഗനാമവും אַחֵר എന്ന ‘മറ്റൊരു’ എന്ന വിശേഷണവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הַכֵּינִי נָא
  choice: ദയവായി എന്നെ അടിക്കൂ
  rationale: נכה എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും ഒന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും ‘എന്നെ അടിക്കൂ’ എന്നു നൽകുന്നു; נָא അപേക്ഷയുടെ ഭാവം ചേർക്കുന്നതിനാൽ ‘ദയവായി’ ഉപയോഗിച്ചു.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: അപ്പോൾ ആ മനുഷ്യൻ അവനെ അടിച്ചു
  rationale: കർമപ്രത്യയം ‘അവനെ’ എന്നും വ്യക്തമായ കർത്താവ് ‘ആ മനുഷ്യൻ’ എന്നും നിലനിർത്തുന്നു; ‘അപ്പോൾ’ അഭ്യർഥനയ്ക്കു പിന്നാലെയുള്ള ആഖ്യാനതുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַכֵּה וּפָצֹעַ
  choice: അടിച്ചു മുറിവേൽപ്പിച്ചു
  rationale: എബ്രായത്തിലെ ആവർത്തനവും ഫലമായി ഉണ്ടായ പരിക്കും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ആവർത്തനത്തിന്റെ ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
