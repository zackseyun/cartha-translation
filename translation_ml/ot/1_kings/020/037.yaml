translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ദയവായി’ അപേക്ഷയുടെ ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അസ്വാഭാവികമായ ക്രിയാവർത്തനം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി അതിന്റെ എബ്രായ ഊന്നൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
