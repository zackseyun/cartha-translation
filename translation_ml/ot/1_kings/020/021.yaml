  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ സൈനികഭാവവും ‘അരാം’ എന്ന പദത്തിന്റെ രാജ്യം/സേന എന്ന അർഥസന്ദിഗ്ധതയും നിലനിർത്തി.
