id: 1KI.20.21
reference: 1 Kings 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽരാജാവ് പുറപ്പെട്ട് കുതിരകളെയും രഥങ്ങളെയും ആക്രമിച്ചു; അരാമിന് വലിയൊരു പ്രഹരം ഏൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അരാമ്യർക്ക്’; എബ്രായത്തിലെ ‘അരാം’ രാജ്യമെയോ അതിന്റെ സൈന്യത്തെയോ സൂചിപ്പിക്കാം. ചില പരമ്പരാഗത പരിഭാഷകളിൽ ‘സിറിയ’ എന്നുണ്ടെങ്കിലും എബ്രായത്തിലെ പേരാണ് ‘അരാം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥം നിലനിർത്തുന്നു; സൈനികസന്ദർഭം സൂചിപ്പിച്ചാലും ‘പടനയിച്ചു’ എന്ന അധികവിവരം ചേർക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ സമാസരൂപത്തിൽ കർത്താവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: וַיַּךְ
  choice: ആക്രമിച്ചു
  rationale: נכה എന്നതിന് ‘അടിച്ചു/പ്രഹരിച്ചു’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും കുതിരകളും രഥങ്ങളും യുദ്ധലക്ഷ്യങ്ങളായിരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘ആക്രമിച്ചു’ സ്വാഭാവികവും ഫലത്തെ അതിരുകടന്ന് നിർണ്ണയിക്കാത്തതുമാണ്.
- source_word: הַסּוּס
  choice: കുതിരകളെ
  rationale: രൂപത്തിൽ ഏകവചനമായെങ്കിലും സൈനികസന്ദർഭത്തിൽ കൂട്ടാർഥമുള്ളതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הָרָכֶב
  choice: രഥങ്ങളെ
  rationale: רכב ഇവിടെ രഥസേനയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘രഥങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണ്.
- source_word: וְהִכָּה
  choice: ഏൽപ്പിച്ചു
  rationale: തുടർന്നുള്ള സമാനധാതു നാമമായ מַכָּהയോടൊപ്പം മലയാളത്തിലെ സ്വാഭാവികമായ ‘പ്രഹരം ഏൽപ്പിച്ചു’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: בַאֲרָם
  choice: അരാമിന്
  rationale: എബ്രായത്തിലെ ദേശ/ജനനാമമായ അരാം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘സിറിയ’ എന്ന പകരപ്പേര് ഉപയോഗിക്കുന്നില്ല. ദത്തിവിഭക്തി ‘പ്രഹരം ഏൽപ്പിച്ചു’ എന്ന മലയാളഘടനയ്ക്ക് യോജിക്കുന്നു.
- source_word: מַכָּה גְדוֹלָה
  choice: വലിയൊരു പ്രഹരം
  rationale: അക്ഷരാർഥത്തോടടുത്ത രൂപം നിലനിർത്തി; ‘വലിയ കൂട്ടക്കൊല’ അല്ലെങ്കിൽ ‘കനത്ത പരാജയം’ എന്ന് ഫലത്തെ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
