  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും ആഖ്യാനാത്മകവുമായ ശൈലി. രാജാവിനോടുള്ള ‘അങ്ങയുടെ’ എന്ന അഭിസംബോധന മാന്യത സൂചിപ്പിക്കുന്നു. ദുഷ്കരമായ എബ്രായ പ്രയോഗങ്ങളുടെ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
