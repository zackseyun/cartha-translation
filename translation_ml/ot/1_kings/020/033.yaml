  text: וְ/הָ/אֲנָשִׁים֩ יְנַחֲשׁ֨וּ וַֽ/יְמַהֲר֜וּ וַ/יַּחְלְט֣וּ הֲ/מִמֶּ֗/נּוּ וַ/יֹּֽאמְרוּ֙ אָחִ֣י/ךָ בֶן הֲדַ֔ד וַ/יֹּ֖אמֶר בֹּ֣אוּ קָחֻ֑/הוּ וַ/יֵּצֵ֤א אֵלָי/ו֙ בֶּן הֲדַ֔ד וַֽ/יַּעֲלֵ֖/הוּ עַל הַ/מֶּרְכָּבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: ml
  text: ആ മനുഷ്യർ ശകുനം നോക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു[a]; അവർ ഉടൻതന്നെ അവൻ പറഞ്ഞ വാക്ക് ഏറ്റുപിടിച്ച്[b], “ബെൻ-ഹദദ് അങ്ങയുടെ സഹോദരനാണ്” എന്നു പറഞ്ഞു. അപ്പോൾ അവൻ, “അവനെ കൊണ്ടുവരൂ” എന്നു പറഞ്ഞു. ബെൻ-ഹദദ് അവന്റെ അടുക്കലേക്കു പുറത്തുവന്നു; അവൻ ബെൻ-ഹദദിനെ രഥത്തിൽ കയറ്റി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശകുനം അന്വേഷിക്കുകയായിരുന്നു,” “ദിവ്യവാചനം നടത്തുകയായിരുന്നു,” അഥവാ “അതിനെ ശകുനമായി കണക്കാക്കുകയായിരുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ ശകുനം അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കാം; ഇവിടെ ആഹാബിന്റെ വാക്കുകളിൽ അനുകൂലമായ ഒരു സൂചനയ്ക്കായി അവർ ജാഗ്രതയോടെ കാത്തിരുന്നതാണ് സന്ദർഭസൂചന.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്. ആഹാബ് പറഞ്ഞ വാക്കിനെ അനുകൂലമായ ഒരു സമ്മതമായി അവർ പെട്ടെന്ന് ഏറ്റുപിടിച്ചു എന്നതാണ് സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
  - marker: c
    text: '“അവനെ രഥത്തിൽ കയറാൻ ഇടയാക്കി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയ കാരണാർഥത്തിലാണ്: ആഹാബ് ബെൻ-ഹദദിനെ രഥത്തിൽ കയറാൻ ഇടയാക്കി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: ശകുനം നോക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: נחשׁ എന്ന ക്രിയയുടെ ശകുനം അന്വേഷിക്കുക/ശകുനമായി കണക്കാക്കുക എന്ന അർഥം നിലനിർത്തുന്നു. ഇവിടെ ഔപചാരികമായ മന്ത്രവാദച്ചടങ്ങിനേക്കാൾ, ആഹാബിന്റെ വാക്കുകളിൽ അനുകൂലമായ ഒരു സൂചന കണ്ടെത്താനുള്ള ജാഗ്രതയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיְמַהֲרוּ
  choice: ഉടൻതന്നെ
  rationale: അനുകൂലമായി തോന്നിയ വാക്കിനോട് അവർ താമസമില്ലാതെ പ്രതികരിച്ചുവെന്ന ആഖ്യാനക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: അവന്റെ വാക്ക് പിടിച്ചെടുത്ത്
  rationale: ദുഷ്കരമായ ഈ എബ്രായ പ്രയോഗം, ആഹാബ് ഉപയോഗിച്ച ‘സഹോദരൻ’ എന്ന വാക്കിനെ അവർ തങ്ങൾക്ക് അനുകൂലമായ ഉറപ്പായി പെട്ടെന്ന് ഏറ്റുപിടിച്ചു എന്ന സന്ദർഭാർഥത്തിൽ വിവർത്തനം ചെയ്യുന്നു. മൂലത്തിൽ വ്യക്തമല്ലാത്ത കർമം സന്ദർഭത്തിൽനിന്ന് ‘വാക്ക്’ എന്നു പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: אָחִיךָ
  choice: അങ്ങയുടെ സഹോദരൻ
  rationale: ‘സഹോദരൻ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും രാജാവിനോടുള്ള അഭിസംബോധന ആധുനിക മാന്യമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בֹּאוּ קָחֻהוּ
  choice: പോയി അവനെ കൊണ്ടുവരൂ
  rationale: ബെൻ-ഹദദിനെ ആഹാബിന്റെ സന്നിധിയിലേക്കു കൊണ്ടുവരാനുള്ള കല്പന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭാനുസൃതമായി ‘പോകുക/വരുക’ എന്ന ചലനാർഥം വരാം.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: അവനെ രഥത്തിൽ കയറ്റി
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ആഹാബ് ബെൻ-ഹദദിനെ ശാരീരികമായി ഉയർത്തിയെന്ന നിർബന്ധിത ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: הַמֶּרְכָּבָה
  choice: രഥം
  rationale: മൂലപാഠത്തിലെ നിർദേശകത നിലനിർത്തുന്നു; അത് ആഹാബിന്റെ രഥമാണെന്നത് സന്ദർഭത്തിൽ മനസ്സിലാകുന്നുവെങ്കിലും ‘അവന്റെ’ എന്ന ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
