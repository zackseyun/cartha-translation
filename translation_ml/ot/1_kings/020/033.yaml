  to: ആ മനുഷ്യർ ശകുനം നോക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു[a]; അവർ ഉടൻതന്നെ അവൻ പറഞ്ഞ വാക്ക് ഏറ്റുപിടിച്ച്[b], “ബെൻ-ഹദദ് അങ്ങയുടെ സഹോദരനാണ്” എന്നു പറഞ്ഞു. അപ്പോൾ അവൻ, “അവനെ കൊണ്ടുവരൂ” എന്നു പറഞ്ഞു. ബെൻ-ഹദദ് അവന്റെ അടുക്കലേക്കു പുറത്തുവന്നു; അവൻ ബെൻ-ഹദദിനെ രഥത്തിൽ കയറ്റി[c].
