source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ מֶֽלֶךְ יִשְׂרָאֵ֛ל עַל בֵּית֖/וֹ סַ֣ר וְ/זָעֵ֑ף וַ/יָּבֹ֖א שֹׁמְרֽוֹנָ/ה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽരാജാവ് നീരസത്തോടെയും കോപത്തോടെയും[a] തന്റെ വീട്ടിലേക്കു പോയി; അവൻ ശമര്യയിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീരസപ്പെട്ടും കോപിച്ചും.’ סַר וְזָעֵף എന്ന എബ്രായ പദജോടി നീരസവും കോപവും ചേർന്ന മനോഭാവം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: കർത്താവിനെ തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עַל בֵּיתוֹ
  choice: തന്റെ വീട്ടിലേക്കു
  rationale: ചലനക്രിയയോടുകൂടിയ עַל ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; രാജമന്ദിരം എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘വീട്’ എന്ന മൂലചിത്രം നിലനിർത്തുന്നു.
- source_word: סַר
  choice: മനംമടുത്തും
  rationale: זָעֵף എന്ന പദത്തോടൊപ്പം ഉള്ളിലെ അതൃപ്തിയും മൂടിക്കെട്ടിയ മനോഭാവവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഭാവം പകരുന്നു.
- source_word: וְזָעֵף
  choice: കോപിച്ചും
  rationale: വ്യക്തമായ അസഹിഷ്ണുതയോ രോഷമോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളസമം; ഇരട്ട മനോഭാവവിവരണം നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא
  choice: അവൻ … എത്തി
  rationale: בוא എന്ന ക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തെത്തൽ മലയാളത്തിൽ ‘എത്തി’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: שֹׁמְרוֹנָה
  choice: ശമര്യയിൽ
  rationale: ദിശാസൂചകമായ ה ശമര്യയിലേക്കുള്ള ചലനം കാണിക്കുന്നു; ‘എത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം ‘ശമര്യയിൽ’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
