translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും അന്തസ്സുള്ളതുമായ ആഖ്യാനശൈലി. ‘രാജമന്ദിരം’ എന്നു വിശദീകരിക്കാതെ ‘വീട്’ എന്ന എബ്രായപ്രയോഗം സൂക്ഷിച്ചു; വികാരത്തെ സൂചിപ്പിക്കുന്ന പദജോടിയുടെ ചെറിയ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
