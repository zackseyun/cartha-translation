revisions:
- from: 'ഇവരാണ് നഗരത്തിൽനിന്ന് പുറപ്പെട്ടത്: പ്രവിശ്യാധിപന്മാരുടെ യുവാക്കൾ[a], അവരുടെ പിന്നാലെയുണ്ടായിരുന്ന സൈന്യവും.'
  to: 'ഇവർ നഗരത്തിൽനിന്ന് പുറപ്പെട്ടു: പ്രവിശ്യാതലവന്മാരുടെ യുവാക്കളും അവരുടെ പിന്നാലെ ഉണ്ടായിരുന്ന സൈന്യവും.'
  rationale: The revision restores a direct narrative rendering of ‘these went out,’ explicitly coordinates the two groups that departed, and uses a broader equivalent for the provincial שָׂרִים. The lexical-alternative footnote remains necessary and its anchor is retained.
