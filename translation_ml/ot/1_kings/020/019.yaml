source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: ml
  text: 'ഇവർ നഗരത്തിൽനിന്ന് പുറപ്പെട്ടു: പ്രവിശ്യാതലവന്മാരുടെ യുവാക്കളും അവരുടെ പിന്നാലെ ഉണ്ടായിരുന്ന സൈന്യവും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരാണ്
  rationale: മുൻവാക്യത്തിൽ എണ്ണിപ്പറഞ്ഞ സംഘത്തെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יָצְאוּ מִן הָעִיר
  choice: നഗരത്തിൽനിന്ന് പുറപ്പെട്ടത്
  rationale: പുറപ്പെടലും അതിന്റെ ആരംഭസ്ഥാനവും നേരിട്ട് പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: נַעֲרֵי
  choice: യുവാക്കൾ
  rationale: പദത്തിന്റെ പ്രാഥമികമായ പ്രായസൂചന നിലനിർത്തുന്നു; സേവകർ/പരിചാരകർ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: പ്രവിശ്യാധിപന്മാരുടെ
  rationale: ഭരണപ്രദേശങ്ങളായ പ്രവിശ്യകളുടെ മേൽ അധികാരമുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ബന്ധഘടന സംക്ഷിപ്തവും വ്യക്തവുമായി പകരുന്നു.
- source_word: וְהַחַיִל
  choice: സൈന്യവും
  rationale: ഈ യുദ്ധസന്ദർഭത്തിൽ חַיִל എന്നത് സൈനികസേനയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: അവരുടെ പിന്നാലെയുണ്ടായിരുന്ന
  rationale: സൈന്യം യുവാക്കളുടെ പിന്നിലായി നീങ്ങിയിരുന്നുവെന്ന സ്ഥാനപരവും അനുഗമനപരവുമായ അർഥം നിലനിർത്തുന്നു.
