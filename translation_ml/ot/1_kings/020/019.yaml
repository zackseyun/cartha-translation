translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ഹീബ്രുവിലെ നַעֲרֵי എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലുമായി സംരക്ഷിച്ചു.
