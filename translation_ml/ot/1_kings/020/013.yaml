source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: ml
  text: 'ഇതാ, ഒരു പ്രവാചകൻ ഇസ്രായേലിന്റെ രാജാവായ ആഹാബിന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “യഹ്‌വ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഈ വലിയ സൈന്യക്കൂട്ടമൊക്കെയും നീ കണ്ടോ? ഇതാ, ഞാൻ ഇന്ന് അതിനെ നിന്റെ കയ്യിൽ ഏൽപ്പിക്കുന്നു; ഞാൻ യഹ്‌വ ആണെന്ന് നീ അറിയും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: ആഖ്യാനത്തിലെ പുതിയതും അപ്രതീക്ഷിതവുമായ സംഭവത്തിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സംഭാഷണചിഹ്നപരവും ദൃശ്യവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: נָבִיא אֶחָד
  choice: ഒരു പ്രവാചകൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പ്രവാചകൻ’ എന്നാണെങ്കിലും ഇവിടെ തിരിച്ചറിയപ്പെടാത്ത ഒരാളെ അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: נִגַּשׁ אֶל
  choice: അടുത്തുവന്ന്
  rationale: സമീപിക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ സ്ഥിരസൂത്രവാക്യത്തിന്റെ ഔപചാരികതയും ദൈവിക പ്രസ്താവനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הֲרָאִיתָ
  choice: നീ കണ്ടുവല്ലോ?
  rationale: രാജാവിന്റെ മുമ്പിലുള്ള സൈന്യത്തെ ചൂണ്ടിക്കാട്ടുന്ന ചോദ്യത്തിന്റെ സാക്ഷ്യപ്പെടുത്തുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ഈ വലിയ സൈന്യക്കൂട്ടത്തെ മുഴുവൻ
  rationale: הָמוֹן എന്നത് വലിയ ജനസഞ്ചയമോ സൈനികക്കൂട്ടമോ സൂചിപ്പിക്കാം; സന്ദർഭം ശത്രുസേനയായതിനാൽ ‘സൈന്യക്കൂട്ടം’ അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ സേനയുടെ കൃത്യഘടന അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: הִנְנִי נֹתְנוֹ
  choice: ഇതാ, ഞാൻ അതിനെ ... ഏല്പിക്കും
  rationale: הִנְנִי നൽകുന്ന ഊന്നലും ആസന്നവും ഉറപ്പുള്ളതുമായ ദൈവിക പ്രവർത്തനവും മലയാളത്തിലെ ഭാവികാലത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בְיָדְךָ
  choice: നിന്റെ കൈയിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന ഹീബ്രു രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: അപ്പോൾ ഞാൻ യഹ്‌വ ആകുന്നു എന്നു നീ അറിയും
  rationale: ദൈവിക വിടുതലിലൂടെ യഹ്‌വയുടെ വ്യക്തിത്വവും അധികാരവും തിരിച്ചറിയുമെന്ന ഫലസൂചന നിലനിർത്തുന്നു; അറിവിന്റെ സ്വഭാവം കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി പ്രതിനിധീകരിക്കുന്നു.
- issue: וְיָדַעְתָּ כִּי אֲנִי יְהוָה എന്ന തിരിച്ചറിവുസൂത്രത്തിന്റെ വ്യാപ്തി
  choice: “ഞാൻ യഹ്‌വ ആകുന്നു എന്നു നീ അറിയും” എന്ന തുറന്ന രൂപം
  alternative: യഹ്‌വയുടെ പരമാധികാരം നീ അനുഭവിച്ചറിയും
  rationale: ഈ ‘അറിവ്’ ബൗദ്ധിക തിരിച്ചറിവോ അനുഭവപരമായ അംഗീകാരമോ ഉൾക്കൊള്ളാം; മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായ, എന്നാൽ പ്രവാചകവചനത്തിന് യോജിച്ച മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗം രണ്ടിടത്തും നിലനിർത്തി. ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പ് തെറ്റായ സ്ഥാനത്താണെന്ന് തോന്നുന്നതിനാൽ അതിനെ അനുകരിച്ചിട്ടില്ല; മലയാളത്തിലെ ‘സൈന്യക്കൂട്ടം’ സന്ദർഭാർഥം നേരിട്ട് വ്യക്തമാക്കുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
