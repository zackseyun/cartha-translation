translation:
  language: ml
  text: അപ്പോൾ അവൻ തന്റെ കണ്ണുകൾക്കുമീതെ കെട്ടിയിരുന്ന മറ[a] വേഗത്തിൽ നീക്കി. അവൻ പ്രവാചകന്മാരിൽ ഒരാളാണെന്ന് ഇസ്രായേലിന്റെ രാജാവ് തിരിച്ചറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായപദമായ הָאֲפֵר പരമ്പരാഗതമായി ചിലർ ‘ചാരം’ എന്നു മനസ്സിലാക്കുന്നു. എന്നാൽ ഈ സന്ദർഭത്തിൽ കണ്ണുകൾക്കുമീതെ വേഷംമാറാൻ ഉപയോഗിച്ച ഒരു മറയെയോ കെട്ടിനെയോ ആയിരിക്കാം അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: അപ്പോൾ അവൻ വേഗത്തിൽ
  rationale: מהר എന്ന ക്രിയയുടെ തിടുക്കം നിലനിർത്തുന്നു; കഥാക്രമത്തിലെ വാവിനെ ‘അപ്പോൾ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּסַר
  choice: നീക്കി
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള סור ഇവിടെ ഒരു വസ്തു എടുത്തുമാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നീക്കി’ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: הָאֲפֵר
  choice: കെട്ട്
  rationale: אֵפֶר സാധാരണയായി ‘ചാരം’ എന്നാണെങ്കിലും, 20:38-ലെ വേഷംമാറൽസന്ദർഭവും കണ്ണുകൾക്കുമീതെ ധരിച്ച് പിന്നീട് നീക്കുന്നതും പരിഗണിക്കുമ്പോൾ ഒരു മറയോ കെട്ടോ ഉദ്ദേശിക്കുന്നതായി തോന്നുന്നു. ‘കെട്ട്’ ഈ പ്രവർത്തനാർഥം സ്വാഭാവികമായി നൽകുന്നു; പാഠഭേദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵעַל עֵינָיו
  choice: തന്റെ കണ്ണുകൾക്കുമീതെയുണ്ടായിരുന്ന
  rationale: מן + על എന്ന സംയോജനത്തിലെ ‘മുകളിൽനിന്ന്/മീതെനിന്ന്’ എന്ന സ്ഥാനസൂക്ഷ്മത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: തിരിച്ചറിഞ്ഞു
  rationale: ഹിഫീൽ נכר ഇവിടെ ആളെ തിരിച്ചറിയുക എന്ന അർഥത്തിലാണ്.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തനാമമായി നൽകുന്നു.
- source_word: כִּי
  choice: എന്ന്
  rationale: ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നതിനെക്കാൾ തിരിച്ചറിവിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമാണ്.
- source_word: מֵהַנְּבִאִים
  choice: പ്രവാചകന്മാരിൽ ഒരാൾ
  rationale: מן ഇവിടെ സമൂഹത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്ന ഭാഗികപ്രയോഗമാണ്.
- source_word: הוּא
  choice: ആണ്
  rationale: ഹീബ്രായത്തിലെ ക്രിയാരഹിത നാമവാക്യം മലയാളത്തിൽ ഉദ്ധരണാത്മക ഉള്ളടക്കവാക്യമായി സ്വാഭാവികമായി നൽകുന്നു.
