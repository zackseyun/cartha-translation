source:
  edition: WLC
  text: וַ/יַּכּוּ֙ אִ֣ישׁ אִישׁ֔/וֹ וַ/יָּנֻ֣סוּ אֲרָ֔ם וַֽ/יִּרְדְּפֵ֖/ם יִשְׂרָאֵ֑ל וַ/יִּמָּלֵ֗ט בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם עַל ס֖וּס וּ/פָרָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: ml
  text: ഓരോരുത്തനും താന്താന്റെ എതിരാളിയെ വീഴ്ത്തി[a]. അരാമ്യർ ഓടിപ്പോയി; ഇസ്രായേൽ അവരെ പിന്തുടർന്നു. എന്നാൽ അരാംരാജാവായ ബെൻ-ഹദദ് ഒരു കുതിരപ്പുറത്ത് കുതിരപ്പടയാളികളോടൊപ്പം രക്ഷപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഓരോ പുരുഷനും തന്റെ പുരുഷനെ വീഴ്ത്തി”; അതായത്, ഓരോരുത്തനും തനിക്കെതിരെ നിന്നയാളെ വീഴ്ത്തി.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “കുതിരപ്പുറത്തും കുതിരപ്പടയാളികളോടൊപ്പവും രക്ഷപ്പെട്ടു.” ബെൻ-ഹദദ് കുതിരപ്പുറത്തു കയറി മറ്റു കുതിരപ്പടയാളികളുടെ അകമ്പടിയോടെ രക്ഷപ്പെട്ടുവെന്നായിരിക്കാം എബ്രായപ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: വീഴ്ത്തി
  rationale: യുദ്ധസന്ദർഭത്തിൽ נכה ശക്തിയായി പ്രഹരിച്ച് എതിരാളിയെ പരാജയപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വീഴ്ത്തി’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ ‘കൊന്നു’ എന്നു പറഞ്ഞ് മരണത്തെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אִישׁ אִישׁוֹ
  choice: ഓരോരുത്തനും താന്താന്റെ എതിരാളിയെ
  rationale: അക്ഷരാർഥം ‘ഓരോ പുരുഷനും തന്റെ പുരുഷനെ’ എന്നാണ്; ഇവിടെ ഓരോ പോരാളിയും തനിക്കെതിരെ നിന്നയാളെ ആക്രമിച്ചു എന്നതാണ് പ്രയോഗാർഥം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ മലയാളം ഉപയോഗിക്കുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- source_word: אֲרָם
  choice: അരാമ്യർ
  rationale: അരാം എന്ന രാജ്യനാമം ഇവിടെ ബഹുവചന ക്രിയയോടുകൂടെ അതിന്റെ സൈനികരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അരാമ്യർ’ എന്നു പറയുന്നത് ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיָּנֻסוּ
  choice: ഓടിപ്പോയി
  rationale: യുദ്ധഭൂമിയിൽനിന്നുള്ള പലായനത്തെ വ്യക്തമാക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: וַיִּרְדְּפֵם
  choice: അവരെ പിന്തുടർന്നു
  rationale: רדף എന്ന ക്രിയയുടെ സാധാരണ സൈനികാർഥമായ ‘പിന്തുടരുക’ നേരിട്ട് പകർന്നു.
- source_word: וַיִּמָּלֵט
  choice: രക്ഷപ്പെട്ടു
  rationale: അപകടത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറിയെന്ന സന്ദർഭാർഥം നൽകുന്നു; ദൈവശാസ്ത്രപരമായ പ്രവർത്തകനെ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർത്തി.
- source_word: עַל סוּס
  choice: ഒരു കുതിരപ്പുറത്ത്
  rationale: ഏകവചനത്തിലുള്ള סוּס എന്ന പദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וּפָרָשִׁים
  choice: കുതിരപ്പടയാളികളോടൊപ്പം
  rationale: פָרָשִׁים എന്നത് കുതിരപ്പുറത്തു സഞ്ചരിക്കുന്ന യോദ്ധാക്കളെ സൂചിപ്പിക്കുന്നു. മുൻപുള്ള വാക്യഘടനയോടുള്ള ബന്ധം സഹവാസമായി വായിച്ച് ‘ഒപ്പം’ എന്നു വിവർത്തനം ചെയ്തു; മറ്റൊരു ഘടനാപരമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
