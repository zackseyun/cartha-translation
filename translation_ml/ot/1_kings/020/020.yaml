translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തനഭാരമുള്ള എബ്രായപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. കുതിരയെയും കുതിരപ്പടയാളികളെയും ബന്ധിപ്പിക്കുന്ന വാക്യഘടനയിലെ ചെറിയ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
