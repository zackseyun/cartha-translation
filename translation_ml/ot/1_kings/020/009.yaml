translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. രാജകീയ നയതന്ത്രഭാഷയിലെ ബഹുമാനക്രമം ‘അങ്ങ്,’ ‘അടിയൻ,’ ‘യജമാനൻ’ എന്നിവയിലൂടെ നിലനിർത്തി.
