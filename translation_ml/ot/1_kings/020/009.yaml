source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ ബെൻ-ഹദദിന്റെ ദൂതന്മാരോടു പറഞ്ഞു: “എന്റെ യജമാനനായ രാജാവിനോടു പറയുക: ‘ആദ്യം അങ്ങ് അടിയന്റെ അടുക്കലേക്ക് അയച്ചതെല്ലാം ഞാൻ ചെയ്യാം; എന്നാൽ ഈ കാര്യം എനിക്കു ചെയ്യാൻ കഴിയില്ല.’” ദൂതന്മാർ പോയി ബെൻ-ഹദദിനെ മറുപടി അറിയിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: ദൂതന്മാർ
  rationale: രാജതന്ത്രപരമായ ഈ സന്ദർഭത്തിൽ രാജാവിന്റെ സന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; അത supernatural അർഥം നൽകുന്നില്ല.
- source_word: בֶן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവിനോട്
  rationale: രാജാവിനോടുള്ള ഔപചാരിക ബഹുമാനവും കീഴടങ്ങിയ നയതന്ത്രഭാവവും നിലനിർത്തുന്നു.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: അങ്ങ് അടിയന്റെ അടുക്കൽ പറഞ്ഞയച്ചതെല്ലാം
  rationale: ശാബ്ദികമായ ‘അയച്ചു’ എന്ന ആശയത്തോടൊപ്പം സന്ദേശമായി ആവശ്യപ്പെട്ടതാണെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അടിയൻ
  rationale: രാജകീയ സംഭാഷണത്തിലെ വിനയപൂർവമായ സ്വയംപരാമർശം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָרִאשֹׁנָה
  choice: ആദ്യം
  rationale: മുമ്പ് അയച്ച ആദ്യ സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהַדָּבָר הַזֶּה
  choice: എന്നാൽ ഈ കാര്യം
  rationale: דָּבָר എന്ന പദത്തിന്റെ ‘കാര്യം’ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ‘ആവശ്യം’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: എനിക്കു ചെയ്യാൻ കഴിയില്ല
  rationale: കഴിവില്ലായ്മയെയോ അസാധ്യതയെയോ നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: ഈ മറുപടി അവനെ അറിയിച്ചു
  rationale: തിരിച്ചുചെന്ന് മറുപടി അറിയിച്ചുവെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
