source:
  edition: WLC
  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: ml
  text: 'ഈ കാര്യം ചെയ്യുക: രാജാക്കന്മാരെ, ഓരോരുത്തരെയും അവരുടെ സ്ഥാനത്തുനിന്ന് നീക്കി, അവർക്കു പകരം പ്രവിശ്യാധിപന്മാരെ നിയമിക്കുക.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: ഈ കാര്യം ചെയ്യുക
  rationale: മുൻനിരയിൽ വന്ന കർമവും ആജ്ഞാരൂപവും മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള നിർദേശമായി നൽകുന്നു; דָּבָר ഇവിടെ വാക്കിനേക്കാൾ കാര്യം/നടപടി എന്ന അർഥത്തിലാണ്.
- source_word: הָסֵר
  choice: നീക്കി
  rationale: ഹിഫീൽ ആജ്ഞാരൂപത്തിന്റെ ‘നീക്കുക’ എന്ന കാരണാർഥം നിലനിർത്തുന്നു; പൂർണമായി സ്ഥാനഭ്രഷ്ടരാക്കുന്നതാണോ സൈനിക ചുമതലയിൽനിന്നു മാത്രം മാറ്റുന്നതാണോ എന്ന് അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: രാജാക്കന്മാരെ ഓരോരുത്തനെയും അവനവന്റെ സ്ഥാനത്തുനിന്ന്
  rationale: ബഹുവചനമായ ‘രാജാക്കന്മാർ’ എന്നതും אִישׁ എന്ന പദത്തിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തൻ’ എന്നതും ഒരുപോലെ പ്രകടമാക്കുന്നു. מָקוֹם എന്നതിലെ സ്ഥലം/പദവി എന്ന സ്വാഭാവിക ഇരട്ടസാധ്യത ‘സ്ഥാനം’ സൂക്ഷിക്കുന്നു.
- source_word: וְשִׂים
  choice: നിയമിക്കുക
  rationale: שים എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വെക്കുക’ ആണെങ്കിലും ഭരണാധികാരികളെ പകരം സ്ഥാപിക്കുന്ന ഈ സാഹചര്യത്തിൽ ‘നിയമിക്കുക’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: פַּחוֹת
  choice: ദേശാധിപന്മാർ
  rationale: പദം പ്രവിശ്യാതല ഭരണോദ്യോഗസ്ഥരെയോ ഗവർണർമാരെയോ സൂചിപ്പിക്കുന്നു. ‘ദേശാധിപന്മാർ’ ഭരണപരമായ അർഥം നൽകുകയും ‘സേനാനായകർ’ എന്ന അനാവശ്യമായ സൈനിക ചുരുക്കം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: תַּחְתֵּיהֶם
  choice: അവർക്കു പകരം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കീഴിൽ’ എന്നും വരാമെങ്കിലും ഇവിടെ വ്യക്തമായ പ്രതിസ്ഥാപനബന്ധമാണ്; ‘അവർക്കു പകരം’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
