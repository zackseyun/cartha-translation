translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഭരണപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുമ്പോഴും രാജാക്കന്മാരെ ഏതു പരിധിവരെ നീക്കുന്നു എന്ന മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചിരിക്കുന്നു.
