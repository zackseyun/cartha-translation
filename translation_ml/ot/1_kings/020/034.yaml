  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവനോടു പറഞ്ഞു: “എന്റെ അപ്പൻ നിന്റെ അപ്പനിൽനിന്ന് പിടിച്ചെടുത്ത പട്ടണങ്ങൾ ഞാൻ തിരികെ നൽകാം. എന്റെ അപ്പൻ ശമര്യയിൽ സ്ഥാപിച്ചതുപോലെ, നിനക്കു ദമസ്കൊസിൽ നിനക്കായി വീഥികൾ[a] സ്ഥാപിക്കാം.” ആഹാബ് പറഞ്ഞു: “ഞാനോ, ഈ ഉടമ്പടിപ്രകാരം[b] നിന്നെ വിട്ടയയ്ക്കാം.” അങ്ങനെ ആഹാബ് അവനുമായി ഒരു ഉടമ്പടി ചെയ്തു[c], അവനെ വിട്ടയച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചന്തകൾ” അല്ലെങ്കിൽ “പ്രത്യേക മേഖലകൾ.” ഹീബ്രു പദത്തിന്റെ അക്ഷരാർഥം “വീഥികൾ/തുറസ്സായ ഇടങ്ങൾ” എന്നാണ്; ഇവിടെ ഉടമ്പടിയിലൂടെ അനുവദിച്ച വ്യാപാരമേഖലകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഈ ഉടമ്പടിയോടെ നിന്നെ വിട്ടയയ്ക്കാം.” ഹീബ്രു പദം ‘ഉടമ്പടി’ എന്നും, ഈ രാഷ്ട്രീയസന്ദർഭത്തിൽ ‘കരാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥം “അവനുമായി ഒരു ഉടമ്പടി മുറിച്ചു.” ബന്ധനബലമുള്ള ഔപചാരിക ഉടമ്പടി ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്ന പദം പട്ടണം/നഗരം എന്നർഥം നൽകുന്നു; രാജാക്കന്മാർക്കിടയിലെ പ്രദേശിക കൈമാറ്റത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: לָקַח ... אָשִׁיב
  choice: പിടിച്ചെടുത്ത ... തിരികെ നൽകാം
  rationale: കൈവശപ്പെടുത്തിയതും അതിന്റെ ഉടമസ്ഥാവകാശം മടക്കിനൽകുന്നതും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וְחוּצוֹת
  choice: വീഥികൾ
  rationale: חוּצוֹת എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ വീഥികൾ/തുറസ്സായ ഇടങ്ങൾ നിലനിർത്തുന്നു; ഉടമ്പടിയിലൂടെ അനുവദിച്ച വ്യാപാരമേഖലകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: നിനക്കായി ദമസ്കൊസിൽ ... സ്ഥാപിക്കാം
  rationale: שׂוּם എന്ന ക്രിയയുടെ വെക്കുക/സ്ഥാപിക്കുക എന്ന അർഥവും, അംഗീകൃത നഗരാവകാശങ്ങൾ ഏർപ്പെടുത്തുന്ന നയതന്ത്രസന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: എന്റെ അപ്പൻ ശമര്യയിൽ സ്ഥാപിച്ചതുപോലെ
  rationale: മുൻപുണ്ടായിരുന്ന പരസ്പര നഗരാവകാശക്രമീകരണത്തോടുള്ള താരതമ്യം വ്യക്തമാക്കുന്നു; കർമം മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കാം.
- source_word: בַּבְּרִית
  choice: ഒരു ഉടമ്പടി പ്രകാരം
  rationale: ഇവിടെ בְּרִית രാജാക്കന്മാർക്കിടയിലെ രാഷ്ട്രീയ ഉടമ്പടിയാണ്; ‘പ്രകാരം’ എന്നത് വിടുതൽ ഉടമ്പടിയുടെ അടിസ്ഥാനത്തിലാണെന്ന ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു, എന്നാൽ ഹീബ്രു പ്രയോഗത്തിലെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשַׁלְּחֶךָּ
  choice: നിന്നെ വിട്ടയയ്ക്കാം
  rationale: തടഞ്ഞുവെച്ചിരുന്ന രാജാവിനെ ധാരണയ്ക്കുശേഷം സ്വതന്ത്രനാക്കുന്നതാണ് സന്ദർഭം.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: അവനുമായി ഒരു ഉടമ്പടി ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: അവനെ വിട്ടയച്ചു
  rationale: മുൻപ് പറഞ്ഞ വാഗ്ദാനം നടപ്പാക്കിയതിനെ അതേ ക്രിയാഭാവത്തോടെ അറിയിക്കുന്നു.
theological_decisions:
- issue: രാഷ്ട്രീയ കരാറിലെ בְּרִית എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉടമ്പടി
  alternative: നിയമം; സഖ്യക്കരാർ
  rationale: ഇത് ദൈവവും മനുഷ്യരും തമ്മിലുള്ള ഉടമ്പടിയല്ല, രാജാക്കന്മാർക്കിടയിലെ ബന്ധനബലമുള്ള രാഷ്ട്രീയ ധാരണയാണ്. ‘ഉടമ്പടി’ രണ്ടു പ്രയോഗങ്ങളിലും ഉപയോഗിക്കുന്നത് ഹീബ്രുവിലെ ആവർത്തനവും വിശാലമായ പദബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: വാക്യത്തിലെ സംസാരിക്കുന്നവരുടെ മാറിവരവ്
  choice: രണ്ടാം വാക്കുകൾ ആഹാബിന്റെ മറുപടിയായി വ്യക്തമായി അവതരിപ്പിച്ചു
  alternative: മുഴുവൻ വാക്കുകളും ഒരേ സംസാരക്കാരന്റെ ഉദ്ധരണിയായി വായിക്കുക
  rationale: ‘ഞാനോ ... നിന്നെ വിട്ടയയ്ക്കാം’ എന്ന വാക്കുകൾ തടവുകാരനെ വിടുവിക്കാൻ അധികാരമുള്ള ആഹാബിനാണ് സന്ദർഭപരമായി യോജിക്കുന്നത്. ഹീബ്രു പാഠം സംസാരക്കാരന്റെ പേര് ആവർത്തിക്കുന്നില്ലെങ്കിലും, മലയാളത്തിലെ ഗ്രഹണസൗകര്യത്തിനായി പേര് ചേർത്തു; പാഠത്തിന്റെ അർഥത്തിൽ പുതിയ അവകാശവാദം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ’ എന്നത് പിതൃബന്ധത്തെ സ്വാഭാവികമായി നൽകുന്നു; ‘ദമസ്കൊസ്,’ ‘ശമര്യ’ എന്നീ പരിചിതമായ ബൈബിൾ സ്ഥലനാമരൂപങ്ങൾ ഉപയോഗിച്ചു. ഉദ്ധരണികളുടെ വിഭജനം സംസാരക്കാരുടെ സന്ദർഭപരമായ മാറ്റം വ്യക്തമാക്കുന്നു.
