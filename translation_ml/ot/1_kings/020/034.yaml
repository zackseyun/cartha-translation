  to: 'അപ്പോൾ അവൻ അവനോടു പറഞ്ഞു: “എന്റെ അപ്പൻ നിന്റെ അപ്പനിൽനിന്ന് പിടിച്ചെടുത്ത പട്ടണങ്ങൾ ഞാൻ തിരികെ നൽകാം. എന്റെ അപ്പൻ ശമര്യയിൽ സ്ഥാപിച്ചതുപോലെ, നിനക്കു ദമസ്കൊസിൽ നിനക്കായി വീഥികൾ[a] സ്ഥാപിക്കാം.” ആഹാബ് പറഞ്ഞു: “ഞാനോ, ഈ ഉടമ്പടിപ്രകാരം[b] നിന്നെ വിട്ടയയ്ക്കാം.” അങ്ങനെ ആഹാബ് അവനുമായി ഒരു ഉടമ്പടി ചെയ്തു[c], അവനെ വിട്ടയച്ചു.'
