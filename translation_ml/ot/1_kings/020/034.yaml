  revision_rationale: നിർണിതമായ ഹീബ്രു പ്രയോഗമായ בַּבְּרִית പ്രതിഫലിപ്പിക്കാൻ ‘ഒരു ഉടമ്പടി പ്രകാരം’ എന്നത് ‘ഈ ഉടമ്പടിപ്രകാരം’ എന്നാക്കി. ദമസ്കൊസിലെ വീഥികൾ സ്ഥാപിക്കാനുള്ള അവകാശം/അനുമതി ബെൻ-ഹദദ് ആഹാബിനു നൽകുന്നതാണെന്നത് മലയാള പദക്രമത്തിൽ കൂടുതൽ തെളിച്ചമാക്കി. ആഹാബിന്റെ പേര് ചേർക്കുന്നത് മൂലപാഠത്തിലെ സന്ദർഭസൂചിതമായ സംസാരക്കാരനെ മാത്രം വ്യക്തമാക്കുന്നതാണ്; പുതിയ ആശയം ചേർക്കുന്നില്ല.
