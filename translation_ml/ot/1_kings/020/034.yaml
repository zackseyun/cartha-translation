    rationale: ‘രാഷ്ട്രീയ കരാറിനെയും “ഉടമ്പടി”യെയും’ എന്നു പറയുന്നത് വിരുദ്ധമല്ലെങ്കിലും അവ്യക്തമാണ്. രാഷ്ട്രീയസന്ദർഭത്തിൽ ‘ഉടമ്പടി’യ്ക്ക് പകരം ‘കരാർ’ എന്നും പറയാം എന്ന രീതിയിൽ വ്യക്തമാക്കുന്നതാണ് ഉചിതം.
  revised_text: 'അപ്പോൾ അവൻ അവനോടു പറഞ്ഞു: “എന്റെ അപ്പൻ നിന്റെ അപ്പനിൽനിന്ന് പിടിച്ചെടുത്ത പട്ടണങ്ങൾ ഞാൻ തിരികെ നൽകാം. എന്റെ അപ്പൻ ശമര്യയിൽ സ്ഥാപിച്ചതുപോലെ, നിനക്കു ദമസ്കൊസിൽ നിനക്കായി വീഥികൾ[a] സ്ഥാപിക്കാം.” ആഹാബ് പറഞ്ഞു: “ഞാനോ, ഈ ഉടമ്പടിപ്രകാരം[b] നിന്നെ വിട്ടയയ്ക്കാം.” അങ്ങനെ ആഹാബ് അവനുമായി ഒരു ഉടമ്പടി ചെയ്തു[c], അവനെ വിട്ടയച്ചു.'
  revised_footnotes:
