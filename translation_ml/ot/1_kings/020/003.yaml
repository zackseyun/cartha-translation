source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ כֹּ֚ה אָמַ֣ר בֶּן הֲדַ֔ד כַּסְפְּ/ךָ֥ וּֽ/זְהָבְ/ךָ֖ לִֽ/י ה֑וּא וְ/נָשֶׁ֧י/ךָ וּ/בָנֶ֛י/ךָ הַ/טּוֹבִ֖ים לִ/י הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ബെൻ-ഹദദ് ഇപ്രകാരം പറയുന്നു: ‘നിന്റെ വെള്ളിയും സ്വർണവും എനിക്കുള്ളതാണ്; നിന്റെ ഭാര്യമാരും നിന്റെ പുത്രന്മാരും—ഏറ്റവും മികച്ചവർ[a]—എനിക്കുള്ളവരാണ്.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിന്റെ ഭാര്യമാരും നിന്റെ ഏറ്റവും മികച്ച പുത്രന്മാരും എനിക്കുള്ളവരാണ്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വിശേഷണത്തിന് “നല്ല,” “ഏറ്റവും മികച്ച,” അല്ലെങ്കിൽ “ഏറ്റവും വിശിഷ്ടമായ” എന്നിങ്ങനെ അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: אָמַר എന്ന സാധാരണ ആഖ്യാനക്രിയയും לּוֹ എന്ന പരോക്ഷ കർമവും സുതാര്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ഔപചാരികമായ ദൂതസന്ദേശം അവതരിപ്പിക്കുന്ന സൂത്രവാക്യത്തിന്റെ വർത്തമാനകാല ഭാവവും പ്രഖ്യാപനശക്തിയും നിലനിർത്തുന്നു.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: നിന്റെ വെള്ളിയും സ്വർണവും
  rationale: כֶּסֶף എന്നത് പൊതുവായ ‘പണം’ എന്നു മാറ്റാതെ മൂലപാഠത്തിലെ നിർദിഷ്ട വിലപിടിപ്പുള്ള ലോഹങ്ങളെ നിലനിർത്തുന്നു.
- source_word: לִי הוּא
  choice: എനിക്കുള്ളതാണ്
  rationale: രണ്ട് വസ്തുക്കളിന്മേലുള്ള കൈവശാവകാശവാദം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; എബ്രായയിലെ ഏകവചന സർവനാമത്തെ യാന്ത്രികമായി അനുകരിക്കുന്നില്ല.
- source_word: וְנָשֶׁיךָ
  choice: നിന്റെ ഭാര്യമാർ
  rationale: കുടുംബബന്ധത്തിന്റെ ഈ സന്ദർഭത്തിൽ נָשִׁים എന്നത് പൊതുവായി സ്ത്രീകളെയല്ല, ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבָנֶיךָ
  choice: നിന്റെ പുത്രന്മാർ
  rationale: בָּנִים എന്ന പദത്തിന്റെ പുരുഷസന്തതി എന്ന നിർദിഷ്ട അർഥം നിലനിർത്തുന്നു.
- source_word: הַטּוֹבִים
  choice: ഏറ്റവും മികച്ചവർ
  rationale: ഈ പിടിച്ചെടുക്കൽസന്ദർഭത്തിൽ വിശേഷണം ധാർമികമായി ‘നല്ലവർ’ എന്നതിലുപരി ഏറ്റവും അഭിലഷണീയരായവരെയോ ശ്രേഷ്ഠരായവരെയോ സൂചിപ്പിക്കാം; ഇടയ്ക്കിട്ട പ്രയോഗം മൂലപാഠത്തിന്റെ വാക്യക്രമവും പരിധിയിലെ ചെറിയ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: לִי הֵם
  choice: എനിക്കുള്ളവരാണ്
  rationale: ആവർത്തിച്ചുള്ള നേരിട്ടുള്ള അവകാശവാദവും മുൻവാക്യത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
