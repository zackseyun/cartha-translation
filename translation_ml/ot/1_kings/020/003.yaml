translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജദൂതന്റെ ഔപചാരിക പ്രഖ്യാപനം വ്യക്തമാക്കാൻ പുറം ഉദ്ധരണിക്കുള്ളിൽ സന്ദേശത്തിന്റെ നേരിട്ടുള്ള ഉദ്ധരണി നിലനിർത്തി; ‘ഏറ്റവും മികച്ചവർ’ എന്നതിന്റെ അർഥപരിധിയും വാക്യബന്ധവും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
