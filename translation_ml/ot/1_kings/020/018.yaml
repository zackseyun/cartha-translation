id: 1KI.20.18
reference: 1 Kings 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “അവർ സമാധാനത്തിനായി പുറത്തുവന്നതാണെങ്കിൽ, അവരെ ജീവനോടെ പിടിക്കുവിൻ; യുദ്ധത്തിനായി പുറത്തുവന്നതാണെങ്കിൽ, അവരെ ജീവനോടെ പിടിക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִם
  choice: എങ്കിൽ
  rationale: രണ്ടു സാധ്യതകളെയും വ്യവസ്ഥകളായി അവതരിപ്പിക്കുന്ന സോപാധിക അവ്യയത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: לְשָׁלוֹם
  choice: സമാധാനത്തിനായിട്ടാണ്
  rationale: לְ എന്ന ഉപസർഗവും שָׁלוֹם എന്ന നാമവും ചേർന്ന് ഇവിടെ സമാധാനപരമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; നാമരൂപവും ലക്ഷ്യാർഥവും നിലനിർത്തുന്നു.
- source_word: יָצָאוּ
  choice: പുറപ്പെട്ടുവന്നത്
  rationale: നഗരത്തിൽനിന്ന് സംസാരിക്കുന്നവന്റെ ദിശയിലേക്കു ആളുകൾ പുറത്തുവരുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִּפְשׂוּם
  choice: അവരെ പിടിക്കുവിൻ
  rationale: സൈനികസന്ദർഭത്തിലെ പിടിച്ചടക്കൽ/ബന്ധിയാക്കൽ എന്ന ശക്തമായ കല്പന വ്യക്തമാക്കുന്നു.
- source_word: חַיִּים
  choice: ജീവനോടെ
  rationale: അവരെ പിടിക്കേണ്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאִם
  choice: എങ്കിലും
  rationale: രണ്ടാമത്തെ വ്യവസ്ഥയെ ആദ്യത്തേതിനോട് ചേർക്കുകയും, ഫലം രണ്ടിലും ഒരേത് എന്ന ആശ്ചര്യകരമായ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְמִלְחָמָה
  choice: യുദ്ധത്തിനായിട്ടാണ്
  rationale: യുദ്ധോദ്ദേശ്യത്തോടെ എന്ന അർഥം നൽകുകയും ആദ്യ പാദത്തിലെ 'സമാധാനത്തിനായിട്ടാണ്' എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: חַיִּים תִּפְשׂוּם
  choice: അവരെ ജീവനോടെ പിടിക്കുവിൻ
  rationale: ഹീബ്രുവിലെ മറിച്ചുള്ള പദക്രമം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ സ്വാഭാവിക കല്പനാക്രമം സ്വീകരിക്കുന്നു; ആവർത്തിച്ച കല്പന പൂർണമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനിക കല്പനയുടെ ദൃഢതയും രണ്ടു വ്യവസ്ഥകളിലുമുള്ള ഒരേ കല്പനയുടെ ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു.
