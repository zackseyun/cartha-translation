lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അവൻ … അയച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഭൂതകാല സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ കർത്താവും ക്രിയയും വേർപെടുന്നു; അധികമായ വ്യവഹാരസൂചന ചേർക്കാതെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലത്തിൽ ഇത് സന്ദേശവുമായി അയയ്ക്കപ്പെട്ട മനുഷ്യപ്രതിനിധികളെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വർഗീയ ദൂതന്മാരെയല്ല.
- source_word: אֶל
  choice: അടുക്കൽ
  rationale: അയച്ചതിന്റെ മനുഷ്യസ്വീകർത്താവായ ആഹാബിനെ വ്യക്തമാക്കുന്ന ലക്ഷ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַחְאָב
  choice: ആഹാബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ആഹാബിന്റെ രാജപദവി വ്യക്തമാക്കുന്ന ഹീബ്രു സംയുക്തനാമത്തെ മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: הָעִירָה
  choice: നഗരത്തിലേക്ക്
  rationale: עִיר എന്ന പദത്തിലെ ദിശാസൂചകമായ ה നഗരത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. അകത്തേക്കുള്ള പ്രവേശനം നിർബന്ധമായി തീർപ്പാക്കാതെ ദിശയുടെ യഥാർഥ വ്യാപ്തി നിലനിർത്തുന്നു.
