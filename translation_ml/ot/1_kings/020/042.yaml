reference: 1 Kings 20:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ഞാൻ നാശത്തിനായി സമർപ്പിച്ചിരുന്ന മനുഷ്യനെ[a] നീ നിന്റെ കൈയിൽനിന്നു വിട്ടയച്ചതിനാൽ, അവന്റെ ജീവന് പകരം നിന്റെ ജീവനും അവന്റെ ജനത്തിന് പകരം നിന്റെ ജനവും ആയിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ നാശവിധിക്കു കീഴിലായിരുന്ന മനുഷ്യനെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ദൈവിക ന്യായവിധിയിൽ നാശത്തിനായി സമർപ്പിക്കപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമത്തെ മലയാളത്തിൽ പ്രചാരമുള്ളതും വ്യക്തവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַעַן
  choice: …തിനാൽ
  rationale: ന്യായവിധിയുടെ കാരണത്തെ സ്വാഭാവികമായ മലയാള കാരണപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: നീ നിന്റെ കൈയിൽനിന്നു വിട്ടയച്ചു
  rationale: പിടിയിലോ അധികാരത്തിലോ ഉണ്ടായിരുന്നയാളെ മോചിപ്പിച്ചുവെന്ന അർഥം നിലനിർത്തുകയും ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אִישׁ חֶרְמִי
  choice: ഞാൻ നാശത്തിനായി സമർപ്പിച്ചിരുന്ന മനുഷ്യൻ
  rationale: ഒന്നാംപുരുഷ പ്രത്യയം ദൈവത്തിന്റെ അവകാശവാദമായി പ്രകടിപ്പിക്കുകയും חֵרֶם എന്ന ദൈവിക ന്യായവിധി-സമർപ്പണത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: അവന്റെ ജീവന് പകരം നിന്റെ ജീവൻ
  rationale: נֶפֶשׁ ഇവിടെ ‘ആത്മാവ്’ എന്നതിലുപരി ‘ജീവൻ’ എന്നാണ്; תַּחַת സൂചിപ്പിക്കുന്ന പകരംവയ്ക്കൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: അവന്റെ ജനത്തിന് പകരം നിന്റെ ജനം
  rationale: മുൻവാക്യത്തിലെ സമാന്തരഘടനയും പകരമായുള്ള ന്യായവിധിയുടെ ആശയവും നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ സ്ഥിരസൂത്രം മാന്യവും മലയാള ബൈബിൾ ശൈലിക്ക് യോജിച്ചതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: חֵרֶם എന്ന ന്യായവിധി-പദത്തിന്റെ വിവർത്തനം
  choice: നാശത്തിനായി സമർപ്പിച്ചിരുന്ന
  alternative: എന്റെ നിരോധനത്തിൻ കീഴിലായിരുന്ന / നാശത്തിന് വിധിച്ചിരുന്ന
  rationale: ഇത് വ്യക്തിപരമായ വൈരമല്ല, ദൈവിക ന്യായവിധിക്കായി വേർതിരിച്ചുവെക്കലാണെന്ന ഭാരം സംരക്ഷിക്കുന്നു; അതേസമയം ‘നിരോധനം’ പോലുള്ള അവ്യക്തമായ സാങ്കേതികപദം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ സ്വാഭാവികവുമായ പ്രവാചക-ന്യായവിധി ശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് ദൂതസൂത്രത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ അടയാളം മുഖ്യവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
