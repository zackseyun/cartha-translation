  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ അരയിൽ ചാക്കുവസ്ത്രം ചുറ്റിക്കെട്ടി, തലയിൽ കയറുകളും വെച്ച് ഇസ്രായേൽരാജാവിന്റെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “അങ്ങയുടെ ദാസനായ ബെൻ-ഹദദ് ഇങ്ങനെ പറയുന്നു: ‘ദയവായി എന്നെ ജീവനോടെ വിടണമേ.’[a]” രാജാവ് ചോദിച്ചു: “അവൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ? അവൻ എന്റെ സഹോദരനാണ്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “ദയവായി എന്റെ ജീവൻ രക്ഷിക്കണമേ.” അക്ഷരാർഥം: “ദയവായി എന്റെ ജീവൻ ജീവിക്കട്ടെ.”'
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ സഹോദരൻ” എന്നത് ഇവിടെ യഥാർഥ കുടുംബബന്ധത്തെക്കാൾ രാഷ്ട്രീയമോ ഉടമ്പടിസംബന്ധമായോ ഉള്ള സാഹോദര്യം സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: ചുറ്റിക്കെട്ടി
  rationale: חגר എന്ന ക്രിയയുടെ കെട്ടുക, അരയിൽ ചുറ്റുക എന്ന മൂർത്തമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שַׂקִּים
  choice: ചാക്കുവസ്ത്രം
  rationale: ദുഃഖം, അപമാനം, കീഴടങ്ങൽ എന്നിവ സൂചിപ്പിക്കുന്ന പരുക്കൻ വസ്ത്രവസ്തുവിനുള്ള പരിചിതമായ ബൈബിൾപരവും വ്യക്തവുമായ മലയാളപദം.
- source_word: בְּמָתְנֵיהֶם
  choice: അരയിൽ
  rationale: מָתְנַיִם സൂചിപ്പിക്കുന്ന അര/കടിപ്രദേശം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: തലയിൽ കയറുകളും വെച്ച്
  rationale: കീഴടങ്ങലിന്റെ അടയാളമായി കയറുകൾ തലയിൽ ഉണ്ടായിരുന്നുവെന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; അവ എങ്ങനെ ക്രമീകരിച്ചുവെന്ന് പാഠം പറയാത്തതിനാൽ അതിലധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: രാജാവിനോടുള്ള സ്വയംതാഴ്ത്തിയ നയതന്ത്ര അഭിസംബോധനയാണ് ഇവിടെ മുൻനിൽക്കുന്നത്; അതിനാൽ അടിമ എന്നതിനെക്കാൾ ദാസൻ യോജിക്കുന്നു.
- source_word: בֶן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: ദയവായി എന്നെ ജീവനോടെ വിടണമേ
  rationale: അക്ഷരാർഥത്തിൽ ‘ദയവായി എന്റെ ജീവൻ ജീവിക്കട്ടെ’ എന്ന അപേക്ഷ ജീവൻ രക്ഷിക്കണമെന്ന അർഥമുള്ള ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ അതിന്റെ അഭ്യർഥനാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַעוֹדֶנּוּ חַי
  choice: അവൻ ഇപ്പോഴും ജീവനോടെയുണ്ടോ?
  rationale: അവൻ ഇനിയും ജീവനോടെ തുടരുന്നുണ്ടോ എന്ന ചോദ്യം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָחִי הוּא
  choice: അവൻ എന്റെ സഹോദരനാണ്
  rationale: സഹോദരൻ എന്ന മൂലബന്ധപദം അതേപടി നിലനിർത്തി, രക്തബന്ധമോ രാഷ്ട്രീയ സഹോദരത്വമോ എന്ന സന്ദർഭപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആഹാബിന്റെ മറുപടിയിലെ ‘സഹോദരൻ’ എന്നതിന്റെ അർഥം
  choice: 'ബന്ധപദം നേരിട്ട് നിലനിർത്തി: ‘അവൻ എന്റെ സഹോദരനാണ്.’'
  alternative: ‘അവൻ എന്റെ സഖ്യകക്ഷിയാണ്’ അഥവാ ‘അവൻ എനിക്ക് സഹോദരനെപ്പോലെയാണ്’
  rationale: ഹീബ്രുവിൽ സാധാരണ ബന്ധപദമായ אָחִי തന്നെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. സന്ദർഭത്തിൽ അത് രാഷ്ട്രീയമോ ഉടമ്പടിസംബന്ധമായോ ഉള്ള സാഹോദര്യം സൂചിപ്പിക്കാമെങ്കിലും പാഠം അത് തുറന്നു നിർവചിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം അവ്യക്തതയും കഥയിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്നും അപേക്ഷയിൽ ‘വിടണമേ’ എന്നും ഉപയോഗിച്ച് ഔപചാരികത നിലനിർത്തി. മൂലപാഠത്തിലെ ദൃശ്യരൂപങ്ങളും ‘സഹോദരൻ’ എന്ന പദത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അവ്യക്തതയും സംരക്ഷിച്ചു.
