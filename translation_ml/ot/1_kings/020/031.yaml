id: 1KI.20.31
reference: 1 Kings 20:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: ml
  text: 'അവന്റെ ദാസന്മാർ അവനോടു പറഞ്ഞു: “ഇതാ, ദയവായി കേൾക്കേണമേ; ഇസ്രായേൽഗൃഹത്തിലെ രാജാക്കന്മാർ കരുണയുള്ള രാജാക്കന്മാരാണെന്നു ഞങ്ങൾ കേട്ടിരിക്കുന്നു. നമുക്ക് അരയിൽ ചാക്കുവസ്ത്രം ധരിക്കുകയും തലയിൽ കയറുകൾ ഇടുകയും ഇസ്രായേൽരാജാവിന്റെ അടുക്കലേക്കു ചെല്ലുകയും ചെയ്യാം; ഒരുപക്ഷേ അദ്ദേഹം അങ്ങയുടെ ജീവൻ രക്ഷിച്ചേക്കാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: കരുണയുള്ള രാജാക്കന്മാർ
  rationale: חֶסֶד ഇവിടെ ഉടമ്പടിവിശ്വസ്തതയെക്കാൾ പരാജിതനോടു കാണിക്കുന്ന ദയയെയോ കരുണയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: ഞങ്ങളുടെ അരയിൽ ചാക്കുടുപ്പും
  rationale: ശോകത്തിന്റെയും കീഴടങ്ങലിന്റെയും അടയാളമായ sackcloth അരയിൽ ധരിക്കുന്നതിനെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: തലയിൽ കയറുകളും കെട്ടി
  rationale: എബ്രായത്തിലെ അസാധാരണവും അപമാനകരമായ കീഴടങ്ങൽചിത്രവും വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: അങ്ങയുടെ ജീവൻ രക്ഷിച്ചേക്കാം
  rationale: വാച്യമായി ‘നിന്റെ ജീവനെ ജീവനോടെ നിലനിർത്തുക’; മലയാളത്തിൽ രാജാവിനോടുള്ള ആദരസൂചക അഭിസംബോധനയോടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: חֶסֶד എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: കരുണയുള്ള
  alternative: ദയാലുക്കളായ / ഉടമ്പടിവിശ്വസ്തരായ
  rationale: അരാമ്യ ദാസന്മാർ ഇസ്രായേൽരാജാക്കന്മാരുടെ കീഴടങ്ങിയ ശത്രുക്കളോടുള്ള സൗമ്യതയെക്കുറിച്ചാണ് പറയുന്നത്; ഇവിടെ പ്രത്യേക ഉടമ്പടിസങ്കൽപ്പം ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജാവായ ബെൻ-ഹദദിനോടുള്ള ദാസന്മാരുടെ അഭിസംബോധനയിൽ ‘അങ്ങയുടെ’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു; ആവർത്തിച്ച נָאയുടെ വിനയഭാവം ‘ദയവായി’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
