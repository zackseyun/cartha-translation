translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. സൈനികമായ ‘muster’ എന്ന ആശയം ‘എണ്ണി അണിനിരത്തി’ എന്നു വ്യക്തമാക്കി; ഉറവിടത്തിലെ ആവർത്തനവും സംഘങ്ങളുടെ ക്രമവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ തെറ്റായ സ്ഥാനത്തുണ്ടായിരുന്ന അടിക്കുറിപ്പുസൂചകം അതിന്റെ യഥാർഥ വിഷയമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നിടത്ത് ചേർത്തു.
