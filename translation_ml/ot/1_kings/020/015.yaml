  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: ml
  text: അങ്ങനെ അവൻ പ്രവിശ്യാധിപന്മാരുടെ യുവാക്കളെ എണ്ണി അണിനിരത്തി; അവർ ഇരുനൂറ്റിമുപ്പത്തിരണ്ടുപേരായിരുന്നു. അവർക്കു പിന്നാലെ അവൻ ജനത്തെ മുഴുവനും, ഇസ്രായേൽമക്കളെയെല്ലാം[a], എണ്ണി അണിനിരത്തി—ഏഴായിരംപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യരെയെല്ലാം.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാരെയെല്ലാം’; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: എണ്ണി അണിനിരത്തി
  rationale: സൈനികസന്ദർഭത്തിൽ ഈ ക്രിയ വെറും എണ്ണലല്ല, വിന്യാസത്തിനായി ആളുകളെ കണക്കെടുത്ത് ഒരുമിച്ചുകൂട്ടുന്നതും സൂചിപ്പിക്കുന്നു; രണ്ടു ഘടകങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נַעֲרֵי
  choice: യുവാക്കൾ
  rationale: പദത്തിന് യുവാക്കൾ, സേവകർ, പരിചാരകർ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ അവരുടെ സാമൂഹികപദവി അമിതമായി നിർണ്ണയിക്കാതെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: പ്രവിശ്യാധിപന്മാർ
  rationale: ഭരണപ്രദേശങ്ങളുടെ നേതാക്കളെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘സൈനികമേധാവികൾ’ എന്ന് അതിയായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: ഇരുനൂറ്റിമുപ്പത്തിരണ്ട്
  rationale: ഹീബ്രു സംഖ്യയുടെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
- source_word: וְאַחֲרֵיהֶם
  choice: അവർക്കു പിന്നാലെ
  rationale: ആദ്യസംഘത്തിനു ശേഷം രണ്ടാമത്തെ സംഘം അണിനിരത്തിയ ക്രമം മൂലപാഠത്തിലെ വ്യക്തമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעָם
  choice: ജനത്തെ മുഴുവനും
  rationale: സൈനികസന്ദർഭമാണെങ്കിലും മൂലപാഠത്തിലെ ‘ജനം’ എന്ന വിശാലമായ പദം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളെയെല്ലാം
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധസൂചക ഹീബ്രു പ്രയോഗം മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളാവുന്നതുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകുന്നു.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ഏഴായിരം
  rationale: മൂലപാഠത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
