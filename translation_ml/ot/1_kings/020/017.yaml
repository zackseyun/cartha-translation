source:
  edition: WLC
  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: ml
  text: അപ്പോൾ പ്രവിശ്യകളിലെ അധിപന്മാരുടെ യുവാക്കൾ ആദ്യം പുറപ്പെട്ടു. ബെൻ-ഹദദ് അയച്ചു; അവർ അവനോട്, “ശമര്യയിൽനിന്ന് ആളുകൾ പുറപ്പെട്ടിരിക്കുന്നു,” എന്ന് അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי
  choice: യuvാക്കൾ
  rationale: നַעַר എന്ന പദത്തിന് യുവാവ്, സേവകൻ, പരിചാരകൻ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സൈനികസന്ദർഭമാണെങ്കിലും പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘യുവാക്കൾ’ നിലനിർത്തുന്നു; തുടർന്നുള്ള ബന്ധവാചകം അവർ അധിപന്മാരോടു ചേർന്നവരാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: പ്രവിശ്യകളിലെ അധിപന്മാർ
  rationale: שָׂרִים ഭരണാധികാരികളെയോ ഉദ്യോഗസ്ഥരെയോ സൈനികമേധാവികളെയോ സൂചിപ്പിക്കാം; מְדִינוֹת ഭരണപ്രദേശങ്ങളാണ്. സന്ദർഭത്തിന് യോജിക്കുകയും പദത്തിന്റെ ഭരണ-സൈനിക വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്ന പ്രയോഗമാണിത്.
- source_word: בָּרִאשֹׁנָה
  choice: ആദ്യം
  rationale: ക്രമത്തിലെ മുൻഗണന നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘ആദ്യ ആക്രമണനിര’ എന്നതുപോലുള്ള അധിക സൈനികവിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: וַיִּשְׁלַח
  choice: ആളുകളെ അയച്ചു
  rationale: എബ്രായത്തിൽ ക്രിയയുടെ കർമം വ്യക്തമാക്കിയിട്ടില്ല. എന്നാൽ തുടർന്നുള്ള ബഹുവചന റിപ്പോർട്ട് ആളുകളെ അയച്ചുവെന്നത് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി പൊതുവായ കർമം വ്യക്തമാക്കിയിരിക്കുന്നു, പ്രത്യേകമായി ‘ചാരന്മാർ’ എന്നു നിർണയിച്ചിട്ടില്ല.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: അവർ അവനോട് … എന്ന് അറിയിച്ചു
  rationale: നגד എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അറിയിക്കുക/റിപ്പോർട്ട് ചെയ്യുക’ എന്ന അർഥവും നേരിട്ടുള്ള വാക്കുകളുടെ അവതരണവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲנָשִׁים
  choice: ആളുകൾ
  rationale: ഇവിടെ നഗരത്തിൽനിന്നു പുറത്തുവന്ന മനുഷ്യരുടെ സംഘത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആളുകൾ’ സ്വാഭാവികവും സന്ദർഭത്തിൽ പുരുഷ പോരാളികളെ ഉൾക്കൊള്ളുന്നതുമായ പ്രയോഗമാണ്.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: ശമര്യയിൽനിന്ന് ആളുകൾ പുറപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവർത്തനത്തെ റിപ്പോർട്ടായി അവതരിപ്പിക്കുന്ന എബ്രായ പൂർണ്ണകാലത്തിന്റെ ഭാവം ‘പുറപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം നൽകുന്നു; שֹׁמְרוֹן എന്ന സ്ഥലനാമം പതിവുപോലെ ‘ശമര്യ’ എന്നു നൽകി.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ഉറവിട ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിലെ തുടർച്ച മലയാളത്തിൽ ചെറുവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; വ്യക്തമല്ലാത്ത കർമത്തെ ‘ചാരന്മാർ’ എന്നു നിർവചിക്കാതെ പൊതുവായി നിലനിർത്തി.
