  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: ml
  text: 'ബെൻ-ഹദദ് അവന്റെ അടുക്കൽ ആളയച്ചു പറഞ്ഞു: “ദേവന്മാർ എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ; ശമര്യയിലെ പൊടി എന്റെ കാൽക്കലുള്ള സകല ജനത്തിനും ഓരോ കൈപ്പിടി വീതം എടുക്കാൻ തികയുമെങ്കിൽ!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിന്റെ പദാനുപദരൂപം: “ശമര്യയിലെ പൊടി എന്റെ കാൽക്കലുള്ള സകല ജനങ്ങൾക്കും കൈക്കുമ്പിളുകൾക്ക്/കൈപ്പിടികൾക്ക് തികയുമെങ്കിൽ.” തന്റെ അനുചരരിൽ ഓരോരുത്തർക്കും ഓരോ കൈപ്പിടി പൊടിപോലും നൽകാൻ കഴിയാത്തത്ര ചെറുതാണ് ശമര്യ എന്നു ബെൻ-ഹദദ് വീമ്പിളക്കുകയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: അവന്റെ അടുക്കൽ ആളയച്ചു
  rationale: നയതന്ത്രസന്ദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ശׁלח אֶל എന്ന പ്രയോഗം സന്ദേശവാഹകരെ അയയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ‘സന്ദേശം’ എന്ന കർമം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: വ്യക്തിനാമം സാധാരണ മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: ദേവന്മാർ എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ
  rationale: ശാപം സ്വയം വിളിച്ചുവരുത്തുന്ന സത്യവാചകസൂത്രത്തിന്റെ ശക്തിയും ആവർത്തനഘടനയും നിലനിർത്തുന്നു.
- source_word: אִם
  choice: …തികയുമെങ്കിൽ
  rationale: സത്യവാചകത്തിലെ വ്യവസ്ഥാസൂചകമായ ഉപവാക്യം അതേപടി നിലനിർത്തുന്നു; ‘തീർച്ചയായും ഇല്ല’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: יִשְׂפֹּק
  choice: തികയുക
  rationale: ‘മതിയാകുക, പര്യാപ്തമാകുക’ എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: ശമര്യയിലെ പൊടി
  rationale: ശമര്യയുടേതോ അവിടെയുള്ളതോ ആയ പൊടി എന്ന നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לִשְׁעָלִים
  choice: ഓരോ കൈപ്പിടി വീതം എടുക്കാൻ
  rationale: സന്ദർഭത്തിൽ പടയാളികളുടെ എണ്ണത്തോട് താരതമ്യപ്പെടുത്തിയ പൊടിയുടെ അപര്യാപ്തതയാണ് ഉദ്ദേശ്യം; അപൂർവപദത്തിന്റെ ‘കൈക്കുഴി/കൈപ്പിടി’ എന്ന പരമ്പരാഗത അർഥം വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: എന്റെ കാൽക്കലുള്ള സകല ജനത്തിനും
  rationale: തന്റെ അധികാരത്തിൻ കീഴിലോ അനുചരസംഘത്തിലോ ഉള്ളവരെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒരു വിജാതീയ രാജാവിന്റെ സത്യവാചകത്തിൽ אֱלֹהִים എന്നതിന്റെ വിവർത്തനം
  choice: ദേവന്മാർ
  alternative: ദൈവം
  rationale: സംസാരിക്കുന്നത് അരാമ്യനായ ബെൻ-ഹദദ് ആയതിനാലും ക്രിയ ബഹുവചനത്തിലായതിനാലും ഇവിടെ അയാളുടെ ദേവതകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വായിക്കുന്നത് കഥാസന്ദർഭത്തിനും വ്യാകരണത്തിനും യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. സത്യവാചകത്തിന്റെ ഔപചാരികതയും വീമ്പിന്റെ അതിശയോക്തിയും നിലനിർത്തി; അപൂർവമായ ‘കൈപ്പിടി’ പ്രയോഗം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
