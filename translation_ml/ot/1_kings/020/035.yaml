  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: ml
  text: പ്രവാചകപുത്രന്മാരിൽ[b] ഒരാൾ യഹ്‌വേയുടെ വചനപ്രകാരം[a] തന്റെ കൂട്ടുകാരനോട്, “ദയവായി എന്നെ അടിക്കുക” എന്നു പറഞ്ഞു. എന്നാൽ അയാൾ അവനെ അടിക്കാൻ വിസമ്മതിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹ്‌വേയുടെ കല്പനപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “പ്രവാചകപുത്രന്മാർ” എന്നത് ഒരു പ്രവാചകസംഘത്തെയോ പ്രവാചകശിഷ്യന്മാരെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: ഒരാൾ
  rationale: കഥാഖ്യാനത്തിൽ ഒരു വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരാൾ’ എന്നു നൽകിയിരിക്കുന്നു; ആരംഭത്തിലെ וְ പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു യാന്ത്രികമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: പ്രവാചകപുത്രന്മാരിൽ
  rationale: പ്രവാചകസംഘത്തിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതികസാദ്ധ്യത നിലനിൽക്കുമ്പോഴും, മുഖ്യപാഠത്തിൽ എബ്രായരൂപകം സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- source_word: רֵעֵהוּ
  choice: തന്റെ കൂട്ടുകാരനോട്
  rationale: സുഹൃത്ത് എന്ന അടുപ്പം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, കൂട്ടത്തിലുള്ള മറ്റൊരാളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനപ്രകാരം
  rationale: പ്രവാചകവചനത്തിന്റെ അധികാരമോ കല്പനയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; ‘കല്പനപ്രകാരം’ എന്ന വ്യാഖ്യാനസാദ്ധ്യത അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הַכֵּינִי נָא
  choice: ദയവായി എന്നെ അടിക്കുക
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അടിക്കുക’ നിലനിർത്തുകയും נָאയിലെ വിനീതമായ അപേക്ഷ ‘ദയവായി’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיְמָאֵן
  choice: വിസമ്മതിച്ചു
  rationale: വെറും മടിയല്ല, വ്യക്തമായ നിരാകരണമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: לְהַכֹּתוֹ
  choice: അവനെ അടിക്കാൻ
  rationale: ആദ്യത്തെ കല്പനയോടുള്ള പദസാമ്യം നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിൽ വ്യക്തമാകുന്ന പരിക്കിന്റെ ഫലം ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അത് ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּנֵי הַנְּבִיאִים എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രവാചകപുത്രന്മാർ
  alternative: പ്രവാചകസംഘം / പ്രവാചകശിഷ്യന്മാർ
  rationale: ഇത് ഒരു പ്രവാചകസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമായിരിക്കാം; എന്നാൽ അതിന്റെ സാമൂഹികഘടന തീർപ്പാക്കാതെ എബ്രായരൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥാഖ്യാനശൈലി. ‘അടിക്കുക’ എന്ന പദം രണ്ടിടത്തും ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തനം സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് [b] ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ വരേണ്ടതിനാൽ അന്തിമ മുഖ്യപാഠത്തിൽ അതിന്റെ സ്ഥാനം തിരുത്തേണ്ടതുണ്ടെന്ന് പരിശോധനയിൽ കണ്ടെത്തി.
