revisions:
- from: അവർ ഉച്ചയ്ക്കു പുറപ്പെട്ടു. അപ്പോൾ ബെൻ-ഹദദ് കുടിച്ചു മത്തനായിരിക്കുകയായിരുന്നു; അവനും അവനെ സഹായിച്ചിരുന്ന മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും കുടിലുകളിലായിരുന്നു[a].
  to: അവർ ഉച്ചയ്ക്ക് പുറപ്പെട്ടു. അതേസമയം, ബെൻ-ഹദദ് കുടിച്ചുകൊണ്ട് മത്തനായിരിക്കുകയായിരുന്നു; അവനും അവനെ സഹായിച്ചിരുന്ന മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും കുടിലുകളിലായിരുന്നു[a].
