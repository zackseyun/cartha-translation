  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: ml
  text: അവർ ഉച്ചയ്ക്ക് പുറപ്പെട്ടു. അതേസമയം, ബെൻ-ഹദദ് കുടിച്ചുകൊണ്ട് മത്തനായിരിക്കുകയായിരുന്നു; അവനും അവനെ സഹായിച്ചിരുന്ന മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും കുടിലുകളിലായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തണൽക്കൂടുകളിൽ’ അല്ലെങ്കിൽ ‘പവിലിയനുകളിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘കുടിലുകളിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: יצא എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം; നഗരത്തിൽനിന്നുള്ള സൈനിക പുറപ്പാട് അധിക വർണം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: בַּצָּהֳרָיִם
  choice: ഉച്ചയ്ക്കു
  rationale: ദിവസത്തിന്റെ മധ്യസമയത്തെ സൂചിപ്പിക്കുന്ന രൂപത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളം.
- source_word: וּבֶן הֲדַד
  choice: അപ്പോൾ ബെൻ-ഹദദ്
  rationale: വാവ് ഇവിടെ ഒരേസമയം നടന്ന പശ്ചാത്തലസാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: കുടിച്ചു മത്തനായിരിക്കുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ തുടരുന്ന പ്രവൃത്തിയെയും שִׁכּוֹר അതിന്റെ ലഹരിസ്ഥിതിയെയും സൂചിപ്പിക്കുന്നു. പാനീയത്തിന്റെ ഇനം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘വീഞ്ഞ്’ അല്ലെങ്കിൽ ‘മദ്യം’ ചേർത്തിട്ടില്ല.
- source_word: בַּסֻּכּוֹת
  choice: കുടിലുകളിൽ
  rationale: סֻכּוֹת എന്നതിന്റെ മൂർത്തമായ അർഥമായ താത്കാലിക കുടിലുകൾ/തണൽക്കൂടുകൾ നിലനിർത്തുന്നു; കൂടുതൽ രാജകീയമായ ‘പവിലിയനുകൾ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הוּא וְהַמְּלָכִים שְׁלֹשִׁים וּשְׁנַיִם
  choice: അവനും ... മുപ്പത്തിരണ്ടു രാജാക്കന്മാരും
  rationale: ബെൻ-ഹദദിനെയും ബന്ധപ്പെട്ട രാജാക്കന്മാരെയും ഒരുമിച്ച് ഉൾപ്പെടുത്തുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עֹזֵר אֹתוֹ
  choice: അവനെ സഹായിച്ചിരുന്ന
  rationale: עזר എന്ന പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ സഹായബന്ധം സ്വാഭാവികമായ വിശേഷണവാക്യമായി നൽകുന്നു.
