translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സാഹചര്യബന്ധവും തുടരുന്ന മദ്യലഹരിസ്ഥിതിയും നിലനിർത്തി; മൂലപാഠത്തിൽ ഇല്ലാത്ത പാനീയത്തിന്റെ ഇനം ചേർത്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുസൂചകം ‘ഉച്ചയ്ക്ക്’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് בַּסֻּכּוֹת എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ‘കുടിലുകളിൽ’ എന്നതിനുശേഷം ചേർത്തു.
