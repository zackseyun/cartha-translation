id: 1KI.20.11
reference: 1 Kings 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֣אמֶר דַּבְּר֔וּ אַל יִתְהַלֵּ֥ל חֹגֵ֖ר כִּ/מְפַתֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: ml
  text: 'ഇസ്രായേൽരാജാവ് മറുപടിയായി പറഞ്ഞു: “അവനോടു പറയുക: ‘യുദ്ധസന്നാഹം അണിയുന്നവൻ അത് അഴിച്ചുമാറ്റുന്നവനെപ്പോലെ വീമ്പിളക്കരുത്.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ, “അരകെട്ടുന്നവൻ കെട്ടഴിക്കുന്നവനെപ്പോലെ വീമ്പിളക്കരുത്.” യുദ്ധസന്ദർഭത്തിൽ യുദ്ധത്തിനൊരുങ്ങി സന്നാഹം അണിയുന്നതും പിന്നീട് അത് അഴിക്കുന്നതുമായ വിരുദ്ധചിത്രങ്ങളാണ് പഴമൊഴിയിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ‘മറുപടി പറഞ്ഞു’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ ഇരട്ട സംഭാഷണസൂത്രം വാക്കുതോറും ആവർത്തിച്ച് അസ്വാഭാവികമാക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: സംസാരിക്കുന്നയാളെ ഔപചാരികമായും സംക്ഷിപ്തമായും തിരിച്ചറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: דַּבְּרוּ
  choice: അവനോടു പറയുക
  rationale: ബഹുവചന ആജ്ഞ സന്ദേശവാഹകരോടാണ്; സന്ദർഭത്തിൽ സൂചിതമായ സ്വീകർത്താവിനെ ‘അവനോട്’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: אַל יִתְהַלֵּל
  choice: വീമ്പിളക്കരുത്
  rationale: സ്വയം പുകഴ്ത്തുക, ജയമുറപ്പിച്ചതുപോലെ അഹങ്കരിക്കുക എന്നീ അർഥങ്ങൾ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി നൽകുന്നു.
- source_word: חֹגֵר
  choice: യുദ്ധസന്നാഹം അണിയുന്നവൻ
  rationale: പദശഃ ‘അരകെട്ടുന്നവൻ’; സൈനികസന്ദർഭത്തിൽ യുദ്ധത്തിനായി ആയുധസന്നാഹം ധരിക്കുന്നവനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘യുദ്ധസന്നാഹം’ കവചത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: כִּמְפַתֵּחַ
  choice: അത് അഴിച്ചുമാറ്റുന്നവനെപ്പോലെ
  rationale: פתח ഇവിടെ കെട്ടഴിക്കുക എന്ന അർഥത്തിൽ; മുൻപറഞ്ഞ യുദ്ധസന്നാഹം പോരാട്ടത്തിനുശേഷം അഴിച്ചുമാറ്റുന്നവനുമായുള്ള വിരുദ്ധസമാന്തര്യം നിലനിർത്തുന്നു.
