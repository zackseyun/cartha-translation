  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ പഴമൊഴിശൈലി. യുദ്ധത്തിന്റെ ഫലം ‘വിജയം’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല; ഉപമയിലെ സൂചന മാത്രം നിലനിർത്തി.
