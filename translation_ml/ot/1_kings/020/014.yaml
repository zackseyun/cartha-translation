source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: ml
  text: 'അഹാബ് ചോദിച്ചു: “ആരിലൂടെ?” അവൻ പറഞ്ഞു: “യഹ്‌വേ ഇപ്രകാരം പറയുന്നു: ‘പ്രവിശ്യാധികാരികളുടെ യുവാക്കന്മാരിലൂടെ[a].’” അഹാബ് ചോദിച്ചു: “ആരാണ് യുദ്ധം ആരംഭിക്കുക?” അവൻ പറഞ്ഞു: “നീ തന്നെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവിശ്യാധികാരികളുടെ സേവകരിലൂടെ/പരിചാരകരിലൂടെ.” “യുവാക്കന്മാർ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു പദം ഉദ്യോഗസ്ഥരുടെ സേവകരെയോ സഹായികളെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: ആരിലൂടെ?
  rationale: בְּ ഇവിടെ പ്രവർത്തനത്തിന്റെ ഉപാധിയെയോ ഏജന്റിനെയോ സൂചിപ്പിക്കുന്നു. ‘ആരിലൂടെ?’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വെ ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּנַעֲרֵי
  choice: യുവാക്കളിലൂടെ
  rationale: נַעַר എന്ന പദത്തിന്റെ പ്രാഥമിക പ്രായസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ ‘സേവകർ/പരിചാരകർ’ എന്ന പ്രവർത്തനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: പ്രവിശ്യാധികാരികളുടെ
  rationale: שָׂרִים എന്നത് അധികാരികളെയും ഉദ്യോഗസ്ഥരെയും, מְדִינוֹת ഭരണപ്രവിശ്യകളെയും സൂചിപ്പിക്കുന്നു; സൈനികപദവി അനാവശ്യമായി നിർണ്ണയിക്കാതെ ഭരണപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: ആരാണ് യുദ്ധം ആരംഭിക്കേണ്ടത്?
  rationale: אָסַר എന്നതിന്റെ അക്ഷരാർഥം ‘കെട്ടുക’ എന്നാണെങ്കിലും, യുദ്ധത്തോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ പോരാട്ടം തുടങ്ങുക എന്നതാണ് സന്ദർഭാർഥം.
- source_word: אָתָּה
  choice: നീ തന്നെ
  rationale: സ്വതന്ത്രമായ രണ്ടാംപുരുഷ ഏകവചന സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: സംസാരിക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: അവൻ പറഞ്ഞു
  alternative: പ്രവാചകൻ പറഞ്ഞു
  rationale: ഹീബ്രു പാഠം ആവർത്തിച്ച് ‘അവൻ പറഞ്ഞു’ എന്നുമാത്രമാണ് പറയുന്നത്. മുൻസന്ദർഭത്തിൽ പ്രവാചകനാണെന്ന് മനസ്സിലാക്കാമെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ മൂലത്തിലെ പരാമർശരീതി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ ചുരുക്കവും ആവർത്തിച്ചുള്ള ഹീബ്രു ഘടനയും കഴിയുന്നത്ര നിലനിർത്തി; വ്യക്തതയ്ക്കായി രണ്ടാമത്തെ ചോദ്യത്തിൽ ‘അഹാബ് വീണ്ടും’ എന്നു ചേർത്തു. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
