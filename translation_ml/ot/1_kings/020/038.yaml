translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട്, ലַמֶּלֶךְ എന്നതിന്റെ സന്ദർഭപരമായ ഉദ്ദേശ്യം ‘രാജാവിനെ കാത്ത്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു. אֵפֶר എന്ന പദത്തിലെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സംരക്ഷിക്കുന്നു.
