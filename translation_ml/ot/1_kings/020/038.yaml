source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ הַ/נָּבִ֔יא וַ/יַּעֲמֹ֥ד לַ/מֶּ֖לֶךְ עַל הַ/דָּ֑רֶךְ וַ/יִּתְחַפֵּ֥שׂ בָּ/אֲפֵ֖ר עַל עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: ml
  text: അങ്ങനെ പ്രവാചകൻ പോയി രാജാവിനെ കാത്ത് വഴിയരികിൽ നിന്നു. തന്റെ കണ്ണുകൾക്കുമീതെ ചാരം പുരട്ടി[a] അയാൾ വേഷംമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘തന്റെ കണ്ണുകൾക്കുമീതെ ചാരത്തോടെ’ എന്നാണ്. ഇവിടെ യഥാർഥ ചാരത്തെയോ, വേഷംമാറാൻ ഉപയോഗിച്ച ഒരു മറയെയോ കെട്ടിനെയോ ഈ പ്രയോഗം സൂചിപ്പിക്കാമെന്ന് ചിലർ കരുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ ... പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ സംഭവക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലി നൽകുന്നു.
- source_word: הַנָּבִיא
  choice: പ്രവാചകൻ
  rationale: നിശ്ചയാർഥത്തിലുള്ള എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ עַל הַדָּרֶךְ
  choice: രാജാവിനെ കാത്ത് വഴിയരികിൽ നിന്നു
  rationale: രാജാവ് കടന്നുവരുന്ന വഴിയിൽ അയാളെ തടഞ്ഞുനിർത്താനായി പ്രവാചകൻ സ്ഥാനംപിടിച്ചുവെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വഴിയരികിൽ’ എന്നത് עַל הַדָּרֶךְ എന്നതിന്റെ ഇവിടെ യോജിച്ച സ്ഥലാർഥമാണ്.
- source_word: וַיִּתְחַפֵּשׂ
  choice: വേഷംമാറി
  rationale: ഹിത്പയേൽ രൂപം സ്വയം തിരിച്ചറിയാനാകാത്തവിധം വേഷംമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בָּאֲפֵר
  choice: ഒരു കെട്ടിട്ട്
  rationale: אֵפֶר സാധാരണയായി ‘ചാരം’ എന്നാണ്; എന്നാൽ ‘കണ്ണുകൾക്കുമീതെ’ എന്ന പ്രയോഗവും തിരിച്ചറിയപ്പെടാതിരിക്കാനുള്ള സന്ദർഭവും ഇവിടെ കണ്ണുകൾ മറയ്ക്കുന്ന ഒരു കെട്ട് എന്ന അപൂർവാർഥത്തെ പിന്തുണയ്ക്കുന്നു. യഥാർഥ പദാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עַל עֵינָיו
  choice: തന്റെ കണ്ണുകൾക്കുമീതെ
  rationale: ശരീരഭാഗത്തിനു മുകളിൽ മറയിട്ട സ്ഥാനം കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക വിവർത്തനം.
