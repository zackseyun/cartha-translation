  to: അങ്ങനെ പ്രവാചകൻ പോയി രാജാവിനെ കാത്ത് വഴിയരികിൽ നിന്നു. തന്റെ കണ്ണുകൾക്കുമീതെ ചാരം പുരട്ടി[a] അയാൾ വേഷംമാറി.
