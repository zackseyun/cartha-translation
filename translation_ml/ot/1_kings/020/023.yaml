source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: ml
  text: 'അരാംരാജാവിന്റെ ദാസന്മാർ അവനോടു പറഞ്ഞു: “അവരുടെ ദേവന്മാർ മലകളിലെ ദേവന്മാരാണ്[a]. അതുകൊണ്ടാണ് അവർ നമ്മെക്കാൾ ശക്തരായത്. എന്നാൽ സമഭൂമിയിൽവെച്ച് നാം അവരോടു യുദ്ധംചെയ്താൽ, തീർച്ചയായും നാം അവരെക്കാൾ ശക്തരാകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ദൈവം മലകളിലെ ഒരു ദൈവമാണ്.” എബ്രായപാഠത്തിൽ ബഹുവചനരൂപങ്ങളാണ് (“ദേവന്മാർ”) ഉപയോഗിച്ചിരിക്കുന്നത്; ഇസ്രായേലിന്റെ ദൈവത്തെക്കുറിച്ചുള്ള അരാമ്യരുടെ ബഹുദൈവവിശ്വാസപരമായ സംസാരരീതിയാണ് ഇതിൽ പ്രതിഫലിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: ദാസന്മാർ
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ ഉദ്യോഗസ്ഥരെയും സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും ‘രാജാവിന്റെ ദാസന്മാർ’ എന്ന സ്വാഭാവിക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ എന്നതിനുപകരം മൂലപാഠത്തിലെ ജനതാനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാർ മലകളിലെ ദേവന്മാരാണ്
  rationale: അരാമ്യരുടെ ബഹുദൈവവിശ്വാസപരമായ സംസാരരീതി പ്രതിഫലിപ്പിക്കുന്ന ബഹുവചനരൂപങ്ങൾ സംരക്ഷിക്കുന്നു; ഇത് ആ വാക്കുകളെ ആഖ്യാതാവിന്റെ ദൈവശാസ്ത്രപ്രസ്താവനയാക്കുന്നില്ല.
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: കാരണവും ഫലവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: അവർ നമ്മെക്കാൾ ശക്തരായത്
  rationale: חזק എന്ന ക്രിയയുടെയും מן ഉപയോഗിച്ചുള്ള താരതമ്യത്തിന്റെയും അർഥം നിലനിർത്തുകയും പിന്നീടുള്ള സമാനവാക്യവുമായി പദാവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּמִּישׁוֹר
  choice: സമഭൂമിയിൽവെച്ച്
  rationale: മലകൾക്കു വിപരീതമായ നിരപ്പായ യുദ്ധഭൂമിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אִם לֹא
  choice: തീർച്ചയായും
  rationale: ഇവിടെ അക്ഷരാർഥത്തിലുള്ള നിഷേധനിബന്ധനയല്ല, ശക്തമായ ഉറപ്പുപറച്ചിലാണ്; മലയാളത്തിൽ അത് സ്വാഭാവികമായി പകരുന്നു.
- source_word: נֶחֱזַק מֵהֶם
  choice: നാം അവരെക്കാൾ ശക്തരാകും
  rationale: താരതമ്യഘടനയും മുൻവാക്യത്തിലെ ‘ശക്തർ’ എന്ന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അരാമ്യർ ഇസ്രായേലിന്റെ ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന രീതി
  choice: അവരുടെ ദേവന്മാർ മലകളിലെ ദേവന്മാരാണ്
  alternative: അവരുടെ ദൈവം മലകളിലെ ദൈവമാണ്
  rationale: ഈ വാക്യം അരാമ്യരുടെ തെറ്റായ ബഹുദൈവവിശ്വാസപരമായ ധാരണ റിപ്പോർട്ട് ചെയ്യുന്നതാണ്. എബ്രായത്തിലെ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ഏകവചനമായി മനസ്സിലാക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; അങ്ങനെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജസദസ്സിനും യുദ്ധസന്ദർഭത്തിനും യോജിച്ച പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു; അരാമ്യരുടെ മതപരമായ തെറ്റിദ്ധാരണ തിരുത്താതെ ഉദ്ധരണിയിൽ തന്നെ സംരക്ഷിച്ചിരിക്കുന്നു.
