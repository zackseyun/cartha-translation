  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: ml
  text: 'ദൂതന്മാർ മടങ്ങിവന്ന് പറഞ്ഞു: “ബെൻ-ഹദദ് ഇപ്രകാരം പറയുന്നു: ‘നിന്റെ വെള്ളിയും സ്വർണവും നിന്റെ ഭാര്യമാരെയും പുത്രന്മാരെയും എനിക്കു തരണം എന്ന് ഞാൻ നിന്നോടു പറഞ്ഞയച്ചിരുന്നെങ്കിലും[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാരണം ഞാൻ നിന്നോടു പറഞ്ഞയച്ചത് …” ഹീബ്രുവിലെ כִּי എന്ന പദത്തിന് പലവിധ അർഥങ്ങൾ സാധ്യമാണ്. അടുത്ത വാക്യത്തിൽ ആവശ്യം കൂടുതൽ കടുപ്പിക്കുന്നതിനാൽ ഇവിടെ അത് “എങ്കിലും” എന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: ദൂതന്മാർ മടങ്ങിവന്ന്
  rationale: രാഷ്ട്രീയ-സൈനിക പശ്ചാത്തലത്തിൽ מַלְאָכִים മനുഷ്യദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. וַיָּשֻׁבוּ എന്നത് അവർ വീണ്ടും വന്നതിനെ തുടർച്ചയായ സംഭവമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: ദൂതസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം മാന്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഉദ്ധരിക്കപ്പെടുന്ന രാജാവിന്റെ നിലവിലെ പ്രഖ്യാപനമായി വർത്തമാനകാലം ഉപയോഗിക്കുന്നു.
- source_word: בֶּן הֲדַד
  choice: ബെൻ-ഹദദ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം.
- source_word: כִּי
  choice: എങ്കിലും
  rationale: അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ആവശ്യത്തിന്റെ കടുപ്പിക്കൽ കണക്കിലെടുത്ത് concessive അർഥം സ്വീകരിക്കുന്നു; എന്നാൽ ഹീബ്രു കണത്തിന്റെ ബഹുവിധസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: ഞാൻ നിന്നോടു പറഞ്ഞയച്ചിരുന്നെങ്കിലും
  rationale: മുമ്പ് ദൂതന്മാർ മുഖേന അയച്ച സന്ദേശമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ 'പറഞ്ഞയച്ചു' എന്നത് മൂലത്തിൽ പ്രത്യേകം ഇല്ലാത്ത ഒരു നാമം ചേർക്കാതെ ആശയവിനിമയപ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: നിന്റെ വെള്ളിയും സ്വർണവും
  rationale: വിലയേറിയ ലോഹങ്ങളായ വെള്ളി, സ്വർണം എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: നിന്റെ ഭാര്യമാരെയും പുത്രന്മാരെയും
  rationale: നָשִׁים ഇവിടെ ഭാര്യമാരെയും בָּנִים പുത്രന്മാരെയും കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: לִי תִתֵּן
  choice: എനിക്കു തരണമെന്ന്
  rationale: ആവശ്യപ്പെടുന്ന നിർബന്ധത്തിന്റെ ശക്തി പരോക്ഷമായി ആവർത്തിക്കപ്പെടുന്ന നേരിട്ടുള്ള സന്ദേശത്തിനുള്ളിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
