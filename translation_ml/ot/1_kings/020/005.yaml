  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ ആഖ്യാനശൈലി. രാജകീയ ദൂതസൂത്രത്തിന് ഔപചാരികത നിലനിർത്തി; വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതു സൂചിപ്പിക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
