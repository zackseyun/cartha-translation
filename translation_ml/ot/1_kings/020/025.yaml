id: 1KI.20.25
reference: 1 Kings 20:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִֽמְנֶה לְ/ךָ֣ חַ֡יִל כַּ/חַיִל֩ הַ/נֹּפֵ֨ל מֵ/אוֹתָ֜/ךְ וְ/ס֣וּס כַּ/סּ֣וּס וְ/רֶ֣כֶב כָּ/רֶ֗כֶב וְ/נִֽלָּחֲמָ֤ה אוֹתָ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶ֑ם וַ/יִּשְׁמַ֥ע לְ/קֹלָ֖/ם וַ/יַּ֥עַשׂ כֵּֽן־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: ml
  text: നീയും, നിന്നിൽനിന്ന് നഷ്ടപ്പെട്ട സൈന്യത്തിനു തുല്യമായൊരു സൈന്യത്തെ നിനക്കായി അണിനിരത്തുക; കുതിരയ്ക്കു പകരം കുതിരയും രഥത്തിനു പകരം രഥവും ഒരുക്കുക. പിന്നെ നമുക്ക് സമതലത്തിൽവെച്ച് അവരോടു യുദ്ധം ചെയ്യാം. തീർച്ചയായും നാം അവരെക്കാൾ ശക്തരായിരിക്കും.” അവൻ അവരുടെ വാക്കു കേട്ട് അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה
  choice: അണിനിരത്തുക
  rationale: ഇവിടെ ക്രിയയുടെ അർഥം സൈന്യത്തെ എണ്ണുക/നിയോഗിക്കുക/സജ്ജമാക്കുക എന്ന പരിധിയിലാണ്; സന്ദർഭത്തിൽ യുദ്ധത്തിനായി സൈന്യത്തെ വീണ്ടും സമാഹരിച്ചു ക്രമപ്പെടുത്തുന്നതാണ് ഉദ്ദേശ്യം. സ്വാഭാവിക മലയാളത്തിൽ ‘അണിനിരത്തുക’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: הַנֹּפֵל מֵאוֹתָךְ
  choice: നിന്നിൽനിന്ന് നഷ്ടപ്പെട്ട
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്നിൽനിന്ന് വീണ’ എന്നാണെങ്കിലും, ഇവിടെ മുൻയുദ്ധത്തിൽ നശിച്ച സൈന്യത്തെ സൂചിപ്പിക്കുന്നു. ‘നഷ്ടപ്പെട്ട’ എന്നത് രാജാവിന്റെ സൈനികനഷ്ടം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: കുതിരയ്ക്കു പകരം കുതിരയും രഥത്തിനു പകരം രഥവും
  rationale: നഷ്ടപ്പെട്ട ഓരോ വിഭാഗവും തത്തുല്യമായി പുനഃസ്ഥാപിക്കണമെന്ന ഹീബ്രു താരതമ്യപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: בַּמִּישׁוֹר
  choice: സമതലത്തിൽവെച്ച്
  rationale: പർവതപ്രദേശത്തിന് വിപരീതമായ നിരപ്പായ ഭൂപ്രദേശത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; പശ്ചാത്തലത്തിലെ സൈനികതന്ത്രവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: തീർച്ചയായും നാം അവരെക്കാൾ ശക്തരായിരിക്കും
  rationale: ‘ഇല്ലെങ്കിൽ...’ എന്ന രൂപത്തിലുള്ള ഹീബ്രു സത്യപ്രതിജ്ഞാത്മക ഉറപ്പാണ് ഇത്; മലയാളത്തിൽ ഉറച്ച പ്രതീക്ഷയായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: അവൻ അവരുടെ വാക്കു കേട്ട്
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരുടെ ശബ്ദം കേട്ടു’ ഇവിടെ അവരുടെ ഉപദേശം അംഗീകരിച്ചു അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; പതിവ് മലയാള ബൈബിൾഭാഷയിൽ ‘വാക്കു കേട്ട്’ ഈ അർഥം വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനിക ഉപദേശത്തിന്റെ നേരിട്ടുള്ള ശൈലിയും ഉപദേശകരുടെ ആത്മവിശ്വാസവും നിലനിർത്തി; അനാവശ്യമായ ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
