  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר כִּ/דְבָרְ/ךָ֖ אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ לְ/ךָ֥ אֲנִ֖י וְ/כָל אֲשֶׁר לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: ml
  text: 'ഇസ്രായേൽരാജാവ് മറുപടിയായി പറഞ്ഞു[a]: “എന്റെ യജമാനനായ രാജാവേ, അങ്ങയുടെ വാക്കുപോലെ, ഞാനും എനിക്കുള്ളതെല്ലാം അങ്ങയുടേതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദാനുപദമായി: “ഉത്തരം നൽകി പറഞ്ഞു.” മറ്റൊരു വിവർത്തനം: “ഇസ്രായേൽരാജാവ് പറഞ്ഞു: ‘എന്റെ യജമാനനായ രാജാവേ, അങ്ങ് പറഞ്ഞതുപോലെ, ഞാനും എനിക്കുള്ളതെല്ലാം അങ്ങയുടേതാണ്.’”'
    reason: എബ്രായത്തിലെ ഇരട്ട സംഭാഷണക്രിയയും כִּדְבָרְךָ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു അവതരണവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘ഉത്തരം നൽകി പറഞ്ഞു’ എന്ന ഇരട്ട പ്രയോഗത്തിന്റെ സംഭാഷണപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ രൂപസമീപമായ വിവർത്തനം നൽകുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: Construct chain-ന്റെ സുതാര്യവും മലയാളകഥനത്തിൽ സ്വാഭാവികവുമായ രൂപം.
- source_word: כִּדְבָרְךָ
  choice: അങ്ങയുടെ വാക്കുപോലെ
  rationale: כְּ + דָּבָר എന്ന ഘടനയെ അടുത്തായി പ്രതിഫലിപ്പിക്കുകയും കീഴടങ്ങലിന്റെ ഔപചാരിക ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: എന്റെ യജമാനനായ രാജാവേ
  rationale: മനുഷ്യരാജാവിനോടുള്ള ബഹുമാനപൂർവമായ അഭിസംബോധനയാണെന്ന് വ്യക്തമാക്കുന്നു; ദൈവിക ശീർഷകത്തിന്റെ അർഥം വരുത്തുന്നില്ല.
- source_word: לְךָ אֲנִי
  choice: ഞാനും ... അങ്ങയുടേതാണ്
  rationale: സ്വത്താവകാശത്തെയോ വിധേയത്വത്തെയോ സൂചിപ്പിക്കുന്ന ദാതൃസർവനാമഘടനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר לִי
  choice: എനിക്കുള്ളതെല്ലാം
  rationale: വ്യക്തിയുടെ സകല സ്വത്തും ഉൾപ്പെടുന്ന വിശാലമായ അർഥപരിധി വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന പദം മനുഷ്യരാജാവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: എന്റെ യജമാനനായ
  alternative: എന്റെ കർത്താവായ
  rationale: ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്നത് മനുഷ്യനായ ബെൻ-ഹദദ് ആണ്. അതിനാൽ സാമൂഹിക-രാജകീയ മേൽക്കോയ്മ സൂചിപ്പിക്കുന്ന ‘യജമാനൻ’ തിരഞ്ഞെടുത്തു; അനാവശ്യമായ ദൈവിക സൂചന ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കഥനശൈലി. രാജാവിനോടുള്ള ഔപചാരിക ബഹുമാനം ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും സാമൂഹിക കീഴ്വഴക്കം ‘യജമാനൻ’ എന്നും പ്രകടിപ്പിച്ചു; മൂലത്തിലെ കീഴടങ്ങൽഭാവം നിലനിർത്തി.
