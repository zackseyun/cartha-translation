- source_word: מֵאָה וְעֶשְׂרִים
  choice: നൂറ്റിയിരുപത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ആധുനിക മലയാളരൂപം.
- source_word: כִּכַּר
  choice: താലന്ത്
  rationale: പുരാതന ഭാരയളവായ כִּכָּר എന്ന പദത്തിന് ബൈബിൾപരിചിതമായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; അളവുപദമായി സംഖ്യയ്ക്കുശേഷം ഏകവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: זָהָב
  choice: സ്വർണം
  rationale: എബ്രായ നാമത്തിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാള സമാനപദം.
