  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: ml
  text: എന്നാൽ ഫറവോന്റെ മകൾ ദാവീദിന്റെ നഗരത്തിൽനിന്ന് അവളുടെ സ്വന്തം ഭവനത്തിലേക്കു കയറിച്ചെന്നു; അവൾക്കായി അവൻ അതു പണിതിരുന്നു. അതിനുശേഷം അവൻ മില്ലോ[a] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നികത്തിയ ഭാഗം” അഥവാ “തട്ടുകൾ.” “മില്ലോ” എന്ന ഹീബ്രു പദം ഒരുപക്ഷേ ഒരു കോട്ടനിർമാണത്തെയോ മണ്ണുനിറച്ച പിന്താങ്ങുഘടനയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: ചുറ്റുമുള്ള വിവരണവുമായി ഒരു മാറ്റമോ വ്യത്യാസമോ സൂചിപ്പിക്കുന്ന കണികയായതിനാൽ സ്വാഭാവികമായ പ്രതിയോഗസൂചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾ
  rationale: ബന്ധസൂചകമായ ഹീബ്രു ഘടനയുടെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: עָלְתָה
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയിലെ ഉയരത്തിലേക്കുള്ള സഞ്ചാരഭാവം നിലനിർത്തുകയും ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽനിന്ന്
  rationale: സ്ഥലനാമവും പുറപ്പെടുന്ന ഇടത്തെ സൂചിപ്പിക്കുന്ന മുൻപ്രത്യയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶל בֵּיתָהּ
  choice: അവൾക്കായി പണിതിരുന്ന ഭവനത്തിലേക്ക്
  rationale: בַּיִת എന്നതിനെ രാജകീയ പശ്ചാത്തലത്തിലും അതിരുകടന്ന വ്യാഖ്യാനം ഒഴിവാക്കിയും മാന്യമായ 'ഭവനം' എന്നു നൽകി; ഉടമസ്ഥതയുടെ ആശയം തുടർന്നുള്ള 'അവൾക്കായി' എന്ന പ്രയോഗത്തോടൊപ്പം വ്യക്തമാണ്.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: ശലോമോൻ അവൾക്കായി പണിതിരുന്ന
  rationale: ഹീബ്രുവിൽ കർത്താവ് പരോക്ഷമായിരുന്നാലും സന്ദർഭത്തിൽ ശലോമോനാണെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ചേർത്തു; മുൻപ് പൂർത്തിയായ പ്രവൃത്തിയെന്ന സന്ദർഭഭാവം 'പണിതിരുന്ന' നിലനിർത്തുന്നു.
- source_word: אָז
  choice: അതിനുശേഷം
  rationale: വിവരണത്തിലെ കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּנָה
  choice: അവൻ ... പണിതു
  rationale: ലളിതമായ പൂർത്തീകരിച്ച പ്രവൃത്തിയായി നൽകുന്നു; 'പണിയാൻ തുടങ്ങി' എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: הַמִּלּוֹא
  choice: മില്ലോ
  rationale: കൃത്യമായ വാസ്തുഘടന വിവാദമായ സാങ്കേതിക സ്ഥലനാമം/നിർമാണപദം ആയതിനാൽ ലിപ്യന്തരണം ചെയ്ത്, സാധ്യതയുള്ള അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
