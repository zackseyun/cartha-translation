  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സാങ്കേതിക പദമായ 'മില്ലോ' വിവർത്തനം ചെയ്യാതെ നിലനിർത്തി അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
