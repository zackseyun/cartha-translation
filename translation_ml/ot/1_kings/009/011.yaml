  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിലെ പശ്ചാത്തലപ്രവൃത്തിയും തുടർന്നുള്ള മുഖ്യസംഭവവും രണ്ട് വാക്യങ്ങളാക്കി വ്യക്തമായി അവതരിപ്പിച്ചു; ‘അവൻ’ എന്നത് ശലോമോനെയാണ് സൂചിപ്പിക്കുന്നത്.
