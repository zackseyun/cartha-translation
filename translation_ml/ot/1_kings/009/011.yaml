  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: ml
  text: സോർ രാജാവായ ഹീരാം ശലോമോന് ദേവദാരുമരത്തടിയും സരളമരത്തടിയും[a] പൊന്നും, ശലോമോൻ ആഗ്രഹിച്ചതെല്ലാം, നൽകിയിരുന്നു. അപ്പോൾ ശലോമോൻ രാജാവ് ഹീരാമിന് ഗലീലാദേശത്തിലെ ഇരുപതു പട്ടണങ്ങൾ കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സൈപ്രസ്’, ‘ജൂനിപ്പർ’, ‘ഫിർ’, അല്ലെങ്കിൽ മറ്റൊരു കോണിഫർ വൃക്ഷം; എബ്രായത്തിലെ ബെറോഷ് എന്ന പദം സൂചിപ്പിക്കുന്ന കൃത്യമായ വൃക്ഷവർഗം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: നൽകിയിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘വഹിക്കുക/ചുമക്കുക’ എന്നാണെങ്കിലും, വ്യക്തിയെ കർമമായും സാമഗ്രികളെ בְּ ഉപയോഗിച്ചും ചേർക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സാമഗ്രികൾ നൽകി സഹായിച്ചു/വിതരണം ചെയ്തു’ എന്ന അർഥമാണ്. തുടർന്നുള്ള മുഖ്യസംഭവത്തിനു മുമ്പുള്ള പശ്ചാത്തലപ്രവൃത്തിയായതിനാൽ ‘നൽകിയിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: ദേവദാരുമരം
  rationale: עֵץ + വൃക്ഷനാമം ഇവിടെ ജീവനുള്ള മരങ്ങളെയല്ല, നിർമാണത്തിനുള്ള മരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: സരളമരം[a]
  rationale: בְּרוֹשׁ സൂചിപ്പിക്കുന്ന കൃത്യമായ വൃക്ഷവർഗം അനിശ്ചിതമാണ്. മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും കോണിഫർ വർഗത്തെ സൂചിപ്പിക്കാൻ യോജിച്ചതുമായ ‘സരളമരം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וּבַזָּהָב
  choice: പൊന്ന്
  rationale: സാമഗ്രിയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള പദം; സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: לְכָל חֶפְצוֹ
  choice: അവൻ ആഗ്രഹിച്ചതെല്ലാം
  rationale: חֵפֶץ എന്നതിന്റെ ‘ആഗ്രഹം/ഇഷ്ടം’ എന്ന വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ശലോമോൻ ആവശ്യപ്പെട്ട സാമഗ്രികളുടെ പൂർണത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אָז יִתֵּן
  choice: അപ്പോൾ ... കൊടുത്തു
  rationale: אָז കാലക്രമസൂചകമാണ്; അപൂർണക്രിയാരൂപമായ יִתֵּן ഇവിടെ ഭൂതകാല ആഖ്യാനസംഭവമായി പ്രവർത്തിക്കുന്നു.
- source_word: עֶשְׂרִים עִיר
  choice: ഇരുപതു പട്ടണങ്ങൾ
  rationale: עִיר പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം. ഗലീലാപ്രദേശത്തെ ഇരുപതു കുടിയിരിപ്പുകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും അതിരുകടന്ന മഹാനഗരധ്വനി ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: ഗലീലാദേശത്തിലെ
  rationale: ‘ഗലീലാദേശത്തിൽ’ എന്ന എബ്രായ ഘടനയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: ഹീരാം ... ശലോമോൻ ... സോർ ... ഗലീലാ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
