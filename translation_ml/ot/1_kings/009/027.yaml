- from: ഹീരാം കപ്പലിൽ തന്റെ ദാസന്മാരെ ശലോമോന്റെ ദാസന്മാരോടൊപ്പം അയച്ചു—അവർ കപ്പൽക്കാരും കടലിനെ അറിയുന്നവരുമായിരുന്നു.
  to: ഹീരാം തന്റെ ദാസന്മാരെ—കപ്പൽക്കാരും കടലറിയുന്നവരുമായ ആളുകളെ—ശലോമോന്റെ ദാസന്മാരോടൊപ്പം കപ്പലിൽ അയച്ചു.
