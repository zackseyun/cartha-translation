  yaml_path: translation/ot/1_kings/009/027.yaml
  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: ml
  text: ഹീരാം തന്റെ ദാസന്മാരെ—കപ്പൽക്കാരും കടലറിയുന്നവരുമായ ആളുകളെ—ശലോമോന്റെ ദാസന്മാരോടൊപ്പം കപ്പലിൽ അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֳנִי
  choice: കപ്പലിൽ
  rationale: ഏകവചനമായ ‘കപ്പലിൽ’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യാത്രാസംഘം അതേ കപ്പലിലാണെന്നത് സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: കപ്പൽക്കാർ
  rationale: അക്ഷരാർഥത്തിലെ ‘കപ്പലുകളുടെ ആളുകൾ’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കപ്പൽക്കാർ’ എന്നു നൽകുന്നു; നാവികപരിചയമുള്ളവരെന്ന ആശയം അടുത്ത ഘടകം വിശദീകരിക്കുന്നു.
- source_word: יֹדְעֵי הַיָּם
  choice: കടലിനെ അറിയുന്നവർ
  rationale: ‘കടൽ അറിയുന്നവർ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അനുഭവപരിചയത്തിന്റെ അർഥവും സംരക്ഷിക്കുന്നു; ‘വിദഗ്ധ നാവികർ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ ദാസന്മാരോടൊപ്പം
  rationale: עִם എന്നതിന്റെ സഹവർത്തിത്വാർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മലയാളം. ഹീബ്രായത്തിലെ വിശദീകരണാത്മക പദസമുച്ചയം ഡാഷിനു ശേഷം നിലനിർത്തിയിരിക്കുന്നു.
