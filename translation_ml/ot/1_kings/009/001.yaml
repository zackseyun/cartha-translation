id: 1KI.9.1
reference: 1 Kings 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: ml
  text: ശലോമോൻ യഹോവയുടെ ആലയവും രാജാവിന്റെ അരമനയും താൻ നിർവഹിക്കാൻ ആഗ്രഹിച്ചതെല്ലാം[a] പണിതുതീർത്തപ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശലോമോന്റെ എല്ലാ ആഗ്രഹങ്ങളും”; സന്ദർഭത്തിൽ, “ശലോമോൻ ചെയ്യാൻ ആഗ്രഹിച്ച എല്ലാ പദ്ധതികളും” എന്നും ഗ്രഹിക്കാം.
    reason: חֵשֶׁק എന്ന പദം ആഗ്രഹത്തെയോ ആഗ്രഹിക്കപ്പെട്ട കാര്യത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: പണിതുതീർത്തപ്പോൾ
  rationale: וַיְהִי തുടർന്നുവരുന്ന സംഭവത്തിലേക്കുള്ള ആഖ്യാനപരമായ പ്രവേശനമാണ്; כְּ + infinitive construct കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘...പ്പോൾ’ എന്ന ഉപവാക്യം ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; മുഖ്യസംഭവം അടുത്ത വാക്യത്തിലാണ്.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: בַּיִת അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ഇവിടെ ദൈവാരാധനയ്ക്കുള്ള നിർമിതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആലയം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലുള്ള ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജാവിന്റെ അരമന
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ വീട്’ എന്നാണ്; രാജകീയ വാസസ്ഥലം ഉദ്ദേശിക്കുന്നതിനാൽ ‘അരമന’ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: താൻ നിർവഹിക്കാൻ ആഗ്രഹിച്ചതെല്ലാം
  rationale: חֵשֶׁק എന്നത് ‘ആഗ്രഹം’ എന്നോ ‘ആഗ്രഹിച്ച കാര്യം’ എന്നോ ഗ്രഹിക്കാം. തുടർന്നുള്ള אֲשֶׁר חָפֵץ לַעֲשׂוֹת സഹിതം, പ്രവർത്തനങ്ങളെയോ പദ്ധതികളെയോ അനാവശ്യമായി നിർദിഷ്ടമാക്കാതെ ‘ആഗ്രഹിച്ചതെല്ലാം’ എന്ന് നൽകി.
- source_word: לִבְנוֹת ... לַעֲשׂוֹת
  choice: പണിതുതീർത്തു ... നിർവഹിക്കാൻ
  rationale: നിർമാണങ്ങളെക്കുറിച്ച് לִבְנוֹת ‘പണിയുക’ എന്നും, വിശാലാർഥമുള്ള עשה ആവർത്തനം ഒഴിവാക്കി ‘നിർവഹിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്തി; ഇതിലൂടെ നിർമാണത്തിനപ്പുറമുള്ള സാധ്യതയും തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമസ്വഭാവം നിലനിർത്തി.
- issue: חֵשֶׁק എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ആഗ്രഹിച്ചതെല്ലാം
  alternative: ശലോമോന്റെ എല്ലാ പദ്ധതികളും
  rationale: ‘പദ്ധതികൾ’ എന്നു പറയുന്നത് സന്ദർഭത്തിൽ സാധ്യതയുള്ളതാണെങ്കിലും മൂലപദത്തെ കൂടുതൽ നിർദിഷ്ടമാക്കും. ആഗ്രഹത്തിന്റെ വസ്തുവോ ആഗ്രഹം തന്നെയോ എന്ന ചെറിയ അർഥവ്യാപ്തി പ്രധാന പാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഹീബ്രു ഘടനയാണെന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി. ‘ആലയം’–‘അരമന’ എന്ന പദജോടി ആശയം വ്യക്തമായി വേർതിരിക്കുന്നു.
