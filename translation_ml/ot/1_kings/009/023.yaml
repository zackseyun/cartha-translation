  source_fidelity: The draft correctly preserves the construct relation in שָׂרֵי הַנִּצָּבִים as leaders/chiefs of appointed officials, the relation of the work to Solomon, the number 550, and the final description of authority over those doing the work. The verb רֹדִים carries a stronger sense than mere supervision; ‘ഭരിച്ചിരുന്നവർ’ conveys this naturally without overstating the nature of the labor.
