  - severity: low
    issue: The number is written as the closed form ‘അഞ്ഞൂറ്റമ്പതുപേർ’.
    rationale: ‘അഞ്ഞൂറ്റമ്പത് പേർ’ is the clearer standard orthographic presentation in modern Malayalam.
