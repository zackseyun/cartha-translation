  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: ml
  text: 'ശലോമോനുവേണ്ടിയുള്ള വേലയുടെ ചുമതല വഹിച്ചിരുന്ന നിയുക്ത ഉദ്യോഗസ്ഥരുടെ[a] മേധാവികൾ ഇവരായിരുന്നു: അഞ്ഞൂറ്റമ്പത് പേർ; വേല ചെയ്തിരുന്ന ജനത്തെ ഭരിച്ചിരുന്നവർ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേൽനോട്ടക്കാർ’; എബ്രായപദം നിയമിക്കപ്പെട്ട ഉദ്യോഗസ്ഥരെയോ മറ്റുള്ളവരുടെ മേൽ നിയോഗിക്കപ്പെട്ടവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വേല ചെയ്തിരുന്ന ജനത്തിന്റെ മേൽനോട്ടം വഹിച്ചിരുന്നവർ’; എബ്രായക്രിയയ്ക്ക് ഭരിക്കുക, ചുമതല വഹിക്കുക, അല്ലെങ്കിൽ അധികാരം പ്രയോഗിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: മേധാവികൾ
  rationale: ഭരണപരമായ ഈ സന്ദർഭത്തിൽ ഉദ്യോഗസ്ഥരുടെയോ നേതാക്കളുടെയോ തലവന്മാരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപദം.
- source_word: הַנִּצָּבִים
  choice: നിയുക്ത ഉദ്യോഗസ്ഥർ
  rationale: നിയമിക്കപ്പെട്ടവരോ മറ്റുള്ളവരുടെ മേൽ നിർത്തപ്പെട്ടവരോ എന്ന അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള മേൽനോട്ടവിവരണത്തിൽനിന്ന് വേർതിരിക്കാനും സഹായിക്കുന്നു.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: വേലയുടെ ചുമതല വഹിച്ചിരുന്ന
  rationale: അക്ഷരാർഥത്തിലെ ‘വേലയുടെ മേൽ’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോനുവേണ്ടിയുള്ള
  rationale: വേല ശലോമോന്റെ സേവനത്തിനോ ആവശ്യത്തിനോ ആയിരുന്നു എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ്റമ്പതുപേർ
  rationale: സംഖ്യയുടെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: הָרֹדִים
  choice: അധികാരം നടത്തിയിരുന്നവർ
  rationale: ഭരിക്കുക, അധികാരം ചെലുത്തുക, ചുമതല വഹിക്കുക എന്നീ അർഥസാധ്യതകളിൽ എബ്രായ ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; ‘മേൽനോട്ടം വഹിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: בָּעָם
  choice: ജനത്തിന്മേൽ
  rationale: മൂലത്തിലെ പൊതുവായ ‘ജനം’ എന്ന പദം നിലനിർത്തുന്നു; അടുത്ത വാക്യഭാഗം അവർ വേല ചെയ്തിരുന്നവരാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: വേല ചെയ്തിരുന്ന
  rationale: പങ്കാളിത്തരൂപത്തിലുള്ള എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. שָׂרֵי הַנִּצָּבִים എന്ന ബന്ധഘടന ‘നിയുക്ത ഉദ്യോഗസ്ഥരുടെ മേധാവികൾ’ എന്നു നിലനിർത്തി; ഭരണപരമായ പദങ്ങളിൽ അനാവശ്യ സൈനികഭാവം ഒഴിവാക്കി.
