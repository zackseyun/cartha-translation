revisions:
- from: അപ്പോൾ ഞാൻ നിന്റെ പിതാവായ ദാവീദിനോട്, ‘ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽനിന്ന് നിനക്കൊരു പുരുഷൻ അറ്റുപോകുകയില്ല’ എന്നു പറഞ്ഞതുപോലെ, ഇസ്രായേലിന്മേലുള്ള നിന്റെ രാജത്വത്തിന്റെ സിംഹാസനം എന്നേക്കും ഉറപ്പിക്കും.
  to: 'അപ്പോൾ ഞാൻ ഇസ്രായേലിന്മേലുള്ള നിന്റെ രാജത്വത്തിന്റെ സിംഹാസനം എന്നേക്കും ഉറപ്പിക്കും; നിന്റെ പിതാവായ ദാവീദിനോടു ഞാൻ പറഞ്ഞതുപോലെ: ‘നിന്റെ വംശത്തിൽനിന്നുള്ള ഒരാൾ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽനിന്ന് അറ്റുപോകുകയില്ല.’'
