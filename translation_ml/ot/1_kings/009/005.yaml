id: 1KI.9.5
reference: 1 Kings 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ ഇസ്രായേലിന്മേലുള്ള നിന്റെ രാജത്വത്തിന്റെ സിംഹാസനം എന്നേക്കും ഉറപ്പിക്കും; നിന്റെ പിതാവായ ദാവീദിനോടു ഞാൻ പറഞ്ഞതുപോലെ: ‘നിന്റെ വംശത്തിൽനിന്നുള്ള ഒരാൾ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽനിന്ന് അറ്റുപോകുകയില്ല.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: അപ്പോൾ ഞാൻ ... ഉറപ്പിക്കും
  rationale: הקים എന്ന ക്രിയയുടെ കാരണാർഥമായ ‘സ്ഥാപിക്കുക/ഉറപ്പിക്കുക’ എന്ന ആശയം സന്ദർഭോചിതമായി ‘ഉറപ്പിക്കും’ എന്നു നൽകി; മുൻവാക്യത്തിലെ നിബന്ധനയോടുള്ള ഫലബന്ധം וַ സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ ചേർത്തു.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: നിന്റെ രാജത്വത്തിന്റെ സിംഹാസനം
  rationale: ‘നിന്റെ രാജ്യത്തിന്റെ സിംഹാസനം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, രാജവംശീയ ഭരണാധികാരത്തെയും സിംഹാസനത്തെയും സൂചിപ്പിക്കുന്ന മിശ്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְעֹלָם
  choice: എന്നേക്കും
  rationale: കാലപരിധിയില്ലാത്ത ദൈർഘ്യം സൂചിപ്പിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: നിനക്കൊരു പുരുഷൻ അറ്റുപോകുകയില്ല
  rationale: כרת നിഫാൽ രൂപത്തിലെ ‘ഛേദിക്കപ്പെടുക/അറ്റുപോകുക’ എന്ന ശക്തമായ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; വെറും ‘കുറവുണ്ടാകുകയില്ല’ എന്നു മൃദൂകരിക്കുന്നില്ല. לְךָയുടെ ബന്ധാർഥം ‘നിനക്ക്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽനിന്ന്
  rationale: מֵעַל എന്നതിലെ ‘മേൽനിന്ന്/സ്ഥാനത്തുനിന്ന്’ എന്ന വേർപാടിന്റെ ആശയം ‘സിംഹാസനത്തിൽനിന്ന്’ എന്നു നൽകി.
theological_decisions:
- issue: ദാവീദിക രാജവംശവാഗ്ദാനത്തിന്റെ നിബന്ധനാപരതയും ‘എന്നേക്കും’ എന്ന ഭാഷയും
  choice: മൂലപാഠത്തിലെ ‘എന്നേക്കും’ അതേപടി നിലനിർത്തി; മുൻവാക്യങ്ങളിലെ അനുസരണനിബന്ധനയെ ഈ വാക്യത്തിൽ വിശദീകരിച്ച് ചേർത്തില്ല.
  alternative: വാഗ്ദാനത്തെ വ്യക്തമായി നിബന്ധനാപരമാക്കുകയോ നിരുപാധികമാക്കുകയോ ചെയ്യുന്ന വ്യാഖ്യാനപരമായ വാക്കുകൾ ചേർക്കുക.
  rationale: വാക്യത്തിന്റെ വിശാലസന്ദർഭം നിബന്ധന ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ രാജവംശീയ വാഗ്ദാനത്തിന്റെ ശക്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷയിൽ തുറന്ന നിലയിൽ സൂക്ഷിക്കണം.
- issue: לֹא יִכָּרֵת എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘അറ്റുപോകുകയില്ല’ എന്ന ശക്തമായ രൂപം
  alternative: ‘സിംഹാസനത്തിൽ ഇരിക്കാൻ ഒരാൾ കുറവുണ്ടാകുകയില്ല’
  rationale: മൂലത്തിലെ כרת എന്ന ക്രിയയുടെ ഛേദനദൃശ്യവും מֵעַל സൂചിപ്പിക്കുന്ന വേർപാടും നിലനിർത്തുന്നു; തുടർച്ചയായ സിംഹാസനാരോഹണം എന്ന വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ചേർത്തു. ‘രാജത്വത്തിന്റെ സിംഹാസനം’ എന്ന രാജവംശീയ പ്രയോഗവും ‘അറ്റുപോകുകയില്ല’ എന്ന മൂലപാഠസന്നിഹിതമായ ഭാഷയും മനപ്പൂർവം നിലനിർത്തി.
