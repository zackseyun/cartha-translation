  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: ml
  text: ശലോമോൻ രാജാവ് യഹ്‌വേയുടെ ഭവനം, തന്റെ അരമന, മില്ലോ[b], യെരൂശലേമിന്റെ മതിൽ, ഹാസോർ, മെഗിദ്ദോ, ഗേസെർ എന്നിവ പണിയാൻ ചുമത്തിയ നിർബന്ധിത തൊഴിലിന്റെ[a] വിവരണം ഇതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിർബന്ധിത തൊഴിൽ’ എന്നത് പണമായി അടയ്ക്കുന്ന നികുതിയെയല്ല, ഭരണകൂടം നിർബന്ധമായി ഏർപ്പെടുത്തിയ തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വേലയെടുപ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘മില്ലോ’ യെരൂശലേമിലെ അറിയപ്പെട്ടിരുന്ന ഒരു പ്രതിരോധനിർമാണമോ തട്ടുതട്ടായി മണ്ണുനിറച്ച ഘടനയോ ആയിരിക്കാം. ഹീബ്രുപദത്തിന് ‘നിറവ്’ എന്ന അർഥവുമുണ്ടാകാം; അതിന്റെ കൃത്യമായ രൂപം അനിശ്ചിതമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: വിവരണം
  rationale: വേലയെടുപ്പിനെക്കുറിച്ചുള്ള വിശദീകരണപരമായ അറിയിപ്പാണ് ഈ നാമം ഇവിടെ അവതരിപ്പിക്കുന്നത്; ‘കാര്യം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി സന്ദർഭം അറിയിക്കുന്നു.
- source_word: הַמַּס
  choice: നിർബന്ധിതവേല
  rationale: പണമായ നികുതിയല്ല, രാജകീയ നിർമാണങ്ങൾക്കായി നിർബന്ധമായി ഏർപ്പെടുത്തിയ തൊഴിൽസേവനമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: הֶעֱלָה
  choice: ചുമത്തിയ
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ വേലയെടുപ്പ് ഏർപ്പെടുത്തുക അഥവാ ചുമത്തുക എന്ന ഭരണപരമായ അർഥത്തിലാണ്.
- source_word: לִבְנוֹת
  choice: പണിയാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-നെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: בֵּית എന്നതിന്റെ ‘ഭവനം’ എന്ന രൂപകത്വം നിലനിർത്തിക്കൊണ്ട്, ഈ നിർമാണസന്ദർഭത്തിൽ മലയാളവായനക്കാർക്ക് വ്യക്തമായ ‘ആലയം’ ഉപയോഗിക്കുന്നു; ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֵּיתוֹ
  choice: തന്റെ അരമന
  rationale: ശലോമോന്റെ രാജകീയ ഭവനസമുച്ചയമാണ് സൂചന; ‘തന്റെ’ എന്നത് യഹ്‌വേയുടെ ആലയത്തോടുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּלּוֹא
  choice: മില്ലോ
  rationale: യെരൂശലേമിലെ ഒരു പ്രത്യേക നിർമാണമോ മണ്ണുനിറച്ച ഉറപ്പിക്കലോ ആയിരിക്കാവുന്ന സാങ്കേതിക സ്ഥലനാമം; കൃത്യമായ തിരിച്ചറിവ് അനിശ്ചിതമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: യെരൂശലേമിന്റെ മതിൽ
  rationale: ഹീബ്രു construct phrase-ന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: חָצֹר
  choice: ഹാസോർ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מְגִדּוֹ
  choice: മെഗിദ്ദോ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: גָּזֶר
  choice: ഗേസെർ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בֵּית יְהוָה എന്നതിലെ בֵּית-ന്റെ അവതരണം
  choice: ആലയം
  alternative: യഹ്‌വേയുടെ ഭവനം
  rationale: ‘ഭവനം’ മൂലരൂപത്തോട് കൂടുതൽ അടുത്തതാണെങ്കിലും, ശലോമോന്റെ നിർമാണപട്ടികയിൽ ഉദ്ദേശിക്കുന്നത് ദേവാലയമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘ആലയം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
