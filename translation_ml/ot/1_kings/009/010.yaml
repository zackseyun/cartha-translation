source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: ml
  text: ഇരുപത് വർഷം അവസാനിച്ചപ്പോൾ[a], ശലോമോൻ ആ രണ്ടു ഭവനങ്ങൾ[b]—യഹ്‌വെയുടെ ഭവനവും രാജാവിന്റെ ഭവനവും—പണിതുതീർത്തിരുന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇരുപത് വർഷം കഴിഞ്ഞപ്പോൾ.’ ഒരു ഇരുപതുവർഷ കാലയളവ് പൂർത്തിയായതിനെ ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ആ രണ്ടു ഭവനങ്ങൾ’; അതായത്, യഹ്‌വെയുടെ ഭവനവും രാജാവിന്റെ ഭവനവും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ കാലസൂചക വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി)
  rationale: ഇവിടെ ഈ ഹീബ്രു ആഖ്യാനസൂത്രം ഒരു പുതിയ ഘട്ടത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതിനാൽ അതിന്റെ പ്രവർത്തനം വാക്യത്തിന്റെ കാലസൂചക തുടക്കത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: ഇരുപതു വർഷത്തിന്റെ ഒടുവിൽ
  rationale: ഒരു ഇരുപതുവർഷ കാലയളവ് പൂർത്തിയായ ഘട്ടത്തെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ഒടുവിൽ’ മൂലപാഠത്തിലെ קצה എന്ന ആശയം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: ശലോമോൻ … പണിതുതീർത്തിരുന്നു
  rationale: ഇരുപതു വർഷം അവസാനിക്കുമ്പോഴേക്കും നിർമാണം പൂർത്തിയായിരുന്നുവെന്ന കാലബന്ധം ‘പണിതുതീർത്തിരുന്നു’ വ്യക്തമാക്കുന്നു; അശേർ ബന്ധവാക്യത്തിന്റെ വിവരം മലയാള വാക്യക്രമത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിച്ചു.
- source_word: שְׁנֵי הַבָּתִּים
  choice: രണ്ടു ഭവനങ്ങൾ
  rationale: ‘ഭവനങ്ങൾ’ എന്നത് בָּתִּים എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപവും പിന്നാലെയുള്ള രണ്ടു സമാന്തര നിർദേശങ്ങളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; ‘കെട്ടിടങ്ങൾ’ എന്നത് കൂടുതൽ പൊതുവായ വ്യാഖ്യാനമായേനേ.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ഭവനം
  rationale: ‘യഹ്‌വെയുടെ ഭവനം’ എന്നത് ഹീബ്രു ഘടനയും ദൈവനാമവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ദേവാലയം’ സന്ദർഭപരമായി ശരിയായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ടെട്രാഗ്രാമറ്റോൺ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ദൈവത്തിന്റെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: בֵּית הַמֶּלֶךְ
  choice: രാജാവിന്റെ ഭവനം
  rationale: ഇത് ഹീബ്രുവിലെ ‘രാജാവിന്റെ വീട്/ഭവനം’ എന്ന രൂപം നിലനിർത്തുകയും ‘യഹ്‌വെയുടെ ഭവനം’ എന്നതിനോടുള്ള പദസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘രാജകൊട്ടാരം’ കൂടുതൽ സന്ദർഭവ്യാഖ്യാനമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദംകൊണ്ട് പകരാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഭവനം’ എന്ന പദം രണ്ടു നിർമാണങ്ങൾക്കുമിടയിലെ ഹീബ്രു പദസമാന്തര്യം നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
