  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: ml
  text: ശലോമോൻ യഹോവയ്ക്കായി പണിത യാഗപീഠത്തിന്മേൽ വർഷത്തിൽ മൂന്നുപ്രാവശ്യം ഹോമയാഗങ്ങളും സമാധാനയാഗങ്ങളും അർപ്പിച്ചു. യഹോവയുടെ സന്നിധിയിൽ അതോടുകൂടെ ധൂപം കത്തിക്കുകയും ചെയ്തു[a]. ഇങ്ങനെ അവൻ ആ ഭവനം പൂർത്തിയാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതോടുകൂടെ യാഗവസ്തുക്കൾ പുകയാക്കി.” എബ്രായക്രിയ ധൂപം കത്തിക്കുന്നതിനെ മാത്രമല്ല, യാഗവസ്തു പുകയാക്കുന്നതിനെയും കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഭവനം” എന്നത് ഇവിടെ ദൈവാലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ആരാധനാസംബന്ധിയായ അർഥം വ്യക്തവുമാണ്.
- source_word: עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: യാഗപീഠത്തിൽ പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന അംഗീകൃത മലയാള ബൈബിൾപദം.
- source_word: וּשְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: കൂട്ടായ്മയുടെയും ക്ഷേമത്തിന്റെയും ആശയം ഉൾക്കൊള്ളുന്ന യാഗവിഭാഗം; പരിചിതമായ മലയാള സാങ്കേതികപദം നിലനിർത്തുന്നു.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: വർഷത്തിൽ മൂന്നുപ്രാവശ്യം
  rationale: എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: וְהַקְטֵיר אִתּוֹ
  choice: അതിന്മേൽ ധൂപവും കത്തിച്ചു
  rationale: קטר ധൂപം കത്തിക്കുന്നതിനെയോ കൂടുതൽ പൊതുവായി യാഗവസ്തു പുകയാക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. אִתּוֹ യാഗപീഠത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്ത് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; വിശാലമായ മറ്റർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: ഇങ്ങനെ അവൻ ആ ഭവനം പൂർത്തിയാക്കി
  rationale: שלם എന്ന പീയേൽ രൂപത്തിന്റെ ‘പൂർത്തിയാക്കുക’ എന്ന അർഥം നൽകുന്നു. הַבָּיִת എന്നത് ‘ഭവനം’ എന്നു നിലനിർത്തുകയും സന്ദർഭത്തിലെ ദൈവാലയസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശലോമോൻ യാഗകർമങ്ങൾ നേരിട്ട് നിർവഹിച്ചോ ക്രമീകരിച്ചോ എന്നത്
  choice: എബ്രായവാക്യംപോലെ പ്രവൃത്തികൾ ശലോമോനോട് നേരിട്ട് ബന്ധപ്പെടുത്തി അവതരിപ്പിച്ചു
  alternative: പുരോഹിതന്മാരെക്കൊണ്ട് ശലോമോൻ ഇവ ചെയ്യിച്ചു എന്നു വ്യക്തമായി വിവർത്തനം ചെയ്യുക
  rationale: രാജകീയ സംഗ്രഹഭാഷ നേരിട്ടുള്ള നിർവഹണമോ രാജകീയ മേൽനോട്ടത്തിലുള്ള നിർവഹണമോ സൂചിപ്പിക്കാം. മൂലപാഠം തീർപ്പാക്കാത്ത കാര്യം വിവർത്തനം ഒരു പ്രത്യേക പുരോഹിതശാസ്ത്രവായനയിലൂടെ തീർപ്പാക്കുന്നില്ല.
- issue: וְהַקְטֵיר എന്നതിന്റെ ആചാരപരമായ അർഥം
  choice: ധൂപവും കത്തിച്ചു
  alternative: യാഗവസ്തുക്കൾ പുകയാക്കി
  rationale: ദൈവാലയസന്ദർഭത്തിലും കർമരഹിതമായ പ്രയോഗത്തിലും ‘ധൂപം കത്തിച്ചു’ സ്വാഭാവികമാണ്; എന്നാൽ ക്രിയയുടെ വിശാലമായ ബലിസംബന്ധിയായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹോമയാഗം,’ ‘സമാധാനയാഗം,’ ‘യാഗപീഠം’ എന്നീ പരിചിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തി. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം ‘ഇങ്ങനെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
