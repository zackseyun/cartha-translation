source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: ml
  text: 'യഹ്‌വെ അവനോടു പറഞ്ഞു: “നിന്റെ പ്രാർഥനയും, എന്റെ സന്നിധിയിൽ നീ നടത്തിയ കൃപയ്ക്കായുള്ള വിനീതമായ അപേക്ഷയും ഞാൻ കേട്ടിരിക്കുന്നു. അവിടെ എന്നേക്കും എന്റെ നാമം സ്ഥാപിക്കാനായി, നീ പണിത ഈ ഭവനം[a] ഞാൻ വിശുദ്ധീകരിച്ചിരിക്കുന്നു. എന്റെ കണ്ണുകളും എന്റെ ഹൃദയവും എല്ലാ നാളുകളിലും അവിടെ ഉണ്ടായിരിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ഭവനം’ എന്നു പറഞ്ഞിരിക്കുന്നത് ശലോമോൻ പണിത ദേവാലയത്തെയാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ കണ്ണുകളും എന്റെ ഹൃദയവും’ എന്നത് യഹ്‌വെയുടെ നിരന്തര ശ്രദ്ധയും കരുതലും സൂചിപ്പിക്കുന്ന മനുഷ്യരൂപകമായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമത്തിന്റെ സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘കർത്താവ്’ എന്ന പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: שָׁמַעְתִּי
  choice: ഞാൻ കേട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്കും ഇപ്പോഴത്തെ പ്രസക്തിക്കും ഇടം നൽകുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: תְּפִלָּתְךָ
  choice: നീ ... അർപ്പിച്ച പ്രാർഥന
  rationale: അപേക്ഷാസന്ദർഭത്തിലെ സാധാരണ അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാസംബന്ധവും നൽകുന്നു.
- source_word: תְּחִנָּתְךָ / הִתְחַנַּנְתָּה
  choice: കൃപയ്ക്കായുള്ള അപേക്ഷ
  rationale: പ്രാർഥന എന്ന സമാന്തരപദത്തിൽനിന്ന് വേർതിരിച്ച്, അനുഗ്രഹമോ കൃപയോ തേടുന്ന വിനീതമായ യാചനയുടെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ
  rationale: ‘എന്റെ മുമ്പാകെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: הִקְדַּשְׁתִּי
  choice: ഞാൻ വിശുദ്ധീകരിച്ചിരിക്കുന്നു
  rationale: ദൈവിക ഉപയോഗത്തിനായി വിശുദ്ധമായി വേർതിരിക്കുന്നതിന്റെ ആരാധനാസംബന്ധമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: הַבַּיִת הַזֶּה
  choice: ഈ ഭവനം
  rationale: മൂലത്തിലെ ‘വീട്/ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ശലോമോൻ പണിത ദേവാലയമാണ്.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: എന്റെ നാമം ... അവിടെ സ്ഥാപിക്കേണ്ടതിന്
  rationale: ദൈവം തന്റെ നാമം അവിടെ സ്ഥാപിക്കുന്നു എന്ന ഉടമ്പടി-ദേവാലയ പ്രയോഗത്തെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: עַד עוֹלָם
  choice: എന്നേക്കും
  rationale: നിലനിൽക്കുന്ന ഉദ്ദേശ്യവും സ്ഥിരതയും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള സമാനപദം.
- source_word: עֵינַי וְלִבִּי
  choice: എന്റെ കണ്ണുകളും എന്റെ ഹൃദയവും
  rationale: ദൈവത്തിന്റെ നിരന്തര ശ്രദ്ധയും കരുതലും സൂചിപ്പിക്കുന്ന മനുഷ്യരൂപകഭാഷയെ പരാവർത്തനം ചെയ്ത് മങ്ങിക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാ നാളുകളിലും
  rationale: ‘എപ്പോഴും’ എന്നു ചുരുക്കാതെ എബ്രായത്തിലെ മൂർത്തമായ കാലപ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ കണ്ണുകളും എന്റെ ഹൃദയവും അവിടെ ഉണ്ടായിരിക്കും’ എന്ന ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യരൂപകഭാഷ
  choice: മനുഷ്യരൂപക പ്രയോഗം അക്ഷരസമീപമായി നിലനിർത്തി
  alternative: ‘എന്റെ ശ്രദ്ധയും കരുതലും എപ്പോഴും അവിടെയുണ്ടാകും’
  rationale: ദൈവത്തിന്റെ നിരന്തര ശ്രദ്ധയും ഉടമ്പടിപരമായ കരുതലും എബ്രായം ശരീരാവയവങ്ങളുടെ ശക്തമായ പ്രതിച്ഛായയിലൂടെ പറയുന്നു. അതിനെ വിശദീകരണപരമായി പരത്തുന്നത് മൂലത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം കുറയ്ക്കും.
- issue: ‘എന്റെ നാമം അവിടെ സ്ഥാപിക്കുക’ എന്നതിന്റെ അർഥം
  choice: ദേവാലയ-നാമ പ്രയോഗം അതേപടി സംരക്ഷിച്ചു
  alternative: ‘ഞാൻ അവിടെ എന്നേക്കും വസിക്കേണ്ടതിന്’
  rationale: വാക്യം ദൈവം തന്നെ അവിടെ ഭൗതികമായി പരിമിതനാകുന്നു എന്നു പറയാതെ, അവന്റെ നാമം സ്ഥാപിക്കുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ ബന്ധപ്പെട്ട ദൈവശാസ്ത്ര നിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. അമിതമായി പുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ‘സന്നിധി’, ‘വിശുദ്ധീകരിക്കുക’, ‘നാമം സ്ഥാപിക്കുക’ തുടങ്ങിയ മൂലപാഠത്തിന്റെ ആരാധനാ-ഉടമ്പടി ഭാവം വഹിക്കുന്ന പദങ്ങൾ നിലനിർത്തി.
