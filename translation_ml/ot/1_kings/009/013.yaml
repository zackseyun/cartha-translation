  text: וַ/יֹּ֕אמֶר מָ֚ה הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר נָתַ֥תָּה לִּ֖/י אָחִ֑/י וַ/יִּקְרָ֤א לָ/הֶם֙ אֶ֣רֶץ כָּב֔וּל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “എന്റെ സഹോദരാ, നീ എനിക്കു തന്ന ഈ പട്ടണങ്ങൾ എങ്ങനെയുള്ളവയാണ്?” തുടർന്ന് അവൻ അവയെ കാബൂൽ ദേശം[a] എന്നു വിളിച്ചു; ഇന്നുവരെയും അവ അങ്ങനെ വിളിക്കപ്പെടുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാബൂൽ” ഒരുപക്ഷേ ഒരു സ്ഥലനാമമാണ്. എന്നാൽ എബ്രായപദത്തിൽ നിന്ദാസൂചകമായ ഒരു വാക്കുകളി ഉണ്ടായിരിക്കാം; “ഒന്നിനും കൊള്ളാത്തത്” എന്നോ “ബന്ധിക്കപ്പെട്ടത്/പരിമിതമായത്” എന്നോ ഉള്ള ആശയം അതു സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങൾ എങ്ങനെയുള്ളവയാണ്?
  rationale: מָה ഇവിടെ പട്ടണങ്ങളുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അതൃപ്തി നിറഞ്ഞ ചോദ്യം സൂചിപ്പിക്കുന്നു. ‘എങ്ങനെയുള്ളവയാണ്?’ എന്നത് ആ ഗുണാത്മക പരാതിയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: നീ എനിക്കു തന്ന
  rationale: പൂർത്തിയായ ദാനക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല പ്രയോഗത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: പ്രത്യയം സൂചിപ്പിക്കുന്ന ‘എന്റെ’ എന്ന അർഥവും രാജതന്ത്രപരമായ ബന്ധസംബോധനയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא לָהֶם
  choice: അവൻ അവയ്ക്ക് ... എന്നു പേരിട്ടു
  rationale: קרא ל എന്ന നാമകരണപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֶרֶץ כָּבוּל
  choice: കാബൂൽദേശം
  rationale: כָּבוּל ഇവിടെ പ്രധാനമായും സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ വ്യാഖ്യാനിച്ച് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ ലിപ്യന്തരണം ചെയ്തു; സാധ്യതയുള്ള നിന്ദാസൂചക പദപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും ആ പേര് നിലനിൽക്കുന്നു
  rationale: എബ്രായത്തിലെ കാലസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിലനിൽക്കുന്നത് ആ നാമകരണമാണെന്ന സന്ദർഭാർഥം തുറന്നുകാട്ടുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജതന്ത്രപരമായ ‘എന്റെ സഹോദരാ’ എന്ന സംബോധന അക്ഷുണ്ണമായി സൂക്ഷിച്ചു; സ്ഥലനാമത്തിലെ അനിശ്ചിത പദവിനോദം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിലാക്കി.
