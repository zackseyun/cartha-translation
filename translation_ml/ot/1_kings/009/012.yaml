source:
  edition: WLC
  text: וַ/יֵּצֵ֤א חִירָם֙ מִ/צֹּ֔ר לִ/רְאוֹת֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁ֥ר נָתַן ל֖/וֹ שְׁלֹמֹ֑ה וְ/לֹ֥א יָשְׁר֖וּ בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: ml
  text: അങ്ങനെ ഹീരാം സോരിൽനിന്ന് പുറപ്പെട്ട്, ശലോമോൻ തനിക്കു നൽകിയ പട്ടണങ്ങൾ കാണാൻ ചെന്നു. എന്നാൽ അവ അവന്റെ കണ്ണിൽ നല്ലതായി തോന്നിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവ അവനെ പ്രസാദിപ്പിച്ചില്ല.” എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “അവ അവന്റെ കണ്ണിൽ നേരുള്ളവയായിരുന്നില്ല/ശരിയായിരുന്നില്ല” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ട്
  rationale: יצא എന്ന ക്രിയയുടെ പുറത്തേക്കു പോകുക/പുറപ്പെടുക എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സോരിൽനിന്നുള്ള യാത്ര സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִצֹּר
  choice: സോരിൽനിന്ന്
  rationale: מן എന്ന ഉപസർഗം പുറപ്പെട്ട സ്ഥലം സൂചിപ്പിക്കുന്നു. צֹר എന്ന സ്ഥലനാമത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ‘സോർ’ ആണ്.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: ראה എന്നതിന്റെ അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ പരിശോധിക്കുക എന്ന സൂചന ഉണ്ടെങ്കിലും അത് പാഠത്തിലേക്ക് അധികമായി ചേർക്കുന്നില്ല.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עיר നഗരം/പട്ടണം എന്നർഥമുള്ളതാണ്; ഈ പ്രദേശിക പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തെരഞ്ഞെടുത്തു.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: ശലോമോൻ തനിക്കു നൽകിയ
  rationale: പട്ടണങ്ങൾ ഹീരാമിനു നൽകിയതാണെന്ന ബന്ധവും, ആ നൽകൽ അവൻ അവ കാണുന്നതിനു മുമ്പുണ്ടായതാണെന്ന സംഭവക്രമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: എന്നാൽ അവ അവന്റെ കണ്ണിൽ നല്ലതായി തോന്നിയില്ല
  rationale: ‘അവന്റെ കണ്ണിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ ഉദ്ദേശിക്കുന്ന അസന്തൃപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ധാർമികമായി ‘ശരിയല്ല’ എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
