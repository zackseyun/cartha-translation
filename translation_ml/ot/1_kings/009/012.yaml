translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ‘അവന്റെ കണ്ണിൽ’ എന്ന പ്രയോഗം വായനാസൗകര്യം നഷ്ടപ്പെടാതെ നിലനിർത്തി; വാക്യത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
