translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഫറവോൻ,’ ‘ഗേസെർ,’ ‘കനാന്യർ,’ ‘ശലോമോൻ’ എന്നീ പ്രചാരത്തിലുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; സംഭവക്രമവും മുൻകാല പശ്ചാത്തലഭാവവും സംരക്ഷിച്ചു.
