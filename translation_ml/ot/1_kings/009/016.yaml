  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: ml
  text: ഈജിപ്തുരാജാവായ ഫറവോൻ ഗേസെരിലേക്കു കയറിച്ചെന്ന് അതു പിടിച്ചടക്കി തീകൊളുത്തി ചുട്ടിരുന്നു. നഗരത്തിൽ താമസിച്ചിരുന്ന കനാന്യരെ അവൻ കൊന്നു. പിന്നെ ആ നഗരം ശലോമോന്റെ ഭാര്യയായ തന്റെ മകൾക്ക് വിവാഹസമ്മാനമായി[a] കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിവാഹധനമായി.” എബ്രായപദം വിവാഹത്തോടനുബന്ധിച്ച് നൽകുന്ന ഒരു സമ്മാനത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ സാമൂഹികസ്വഭാവം വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: കയറിച്ചെന്ന്
  rationale: സൈനികനീക്കത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിലെ ‘കയറിപ്പോകുക’ എന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള സന്ദർഭം മുൻകാല സംഭവമാണെന്നതിനാൽ ക്രിയാശൃംഖലയുടെ അവസാനം ‘ചുട്ടുകളഞ്ഞിരുന്നു’ ഉപയോഗിച്ചു.
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചടക്കി
  rationale: നഗരം സൈനികമായി കൈവശപ്പെടുത്തിയെന്ന לכד എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: തീയിട്ടു ചുട്ടുകളഞ്ഞിരുന്നു
  rationale: ‘തീകൊണ്ട് ചുട്ടു’ എന്ന എബ്രായത്തിലെ വ്യക്തമായ അഗ്നിപ്രയോഗവും സമ്പൂർണ നശീകരണത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: നഗരത്തിൽ താമസിച്ചിരുന്ന കനാന്യരെ
  rationale: വ്യാകരണപരമായി ഏകവചനമായ ജനനാമം ഇവിടെ സമൂഹവാചകമായി വരുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: הָרָג
  choice: കൊന്നുകളഞ്ഞു
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം അലങ്കാരമില്ലാതെ നൽകുന്നു.
- source_word: וַיִּתְּנָהּ
  choice: ആ നഗരം ... കൊടുത്തു
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ഗേസെർ നഗരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ ‘ആ നഗരം’ എന്നു വ്യക്തമാക്കി.
- source_word: שִׁלֻּחִים
  choice: വിവാഹസമ്മാനമായി
  rationale: വിവാഹവുമായി ബന്ധപ്പെട്ട സമ്മാനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘സ്ത്രീധനം’ പോലുള്ള ആധുനിക സാമൂഹിക-നിയമപരമായ പ്രത്യേക അർഥങ്ങൾ അനാവശ്യമായി ചുമത്താതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: തന്റെ മകളും ശലോമോന്റെ ഭാര്യയുമായവൾക്ക്
  rationale: ഫറവോന്റെ മകളെത്തന്നെ ശലോമോന്റെ ഭാര്യയായി തിരിച്ചറിയുന്ന സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
