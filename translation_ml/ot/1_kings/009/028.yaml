  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אוֹפִ֔ירָ/ה וַ/יִּקְח֤וּ מִ/שָּׁם֙ זָהָ֔ב אַרְבַּע מֵא֥וֹת וְ/עֶשְׂרִ֖ים כִּכָּ֑ר וַ/יָּבִ֖אוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: ml
  text: അവർ ഓഫീറിലേക്കു ചെന്നു[a]. അവിടെനിന്ന് നാനൂറ്റിയിരുപത് താലന്ത് സ്വർണം എടുത്ത് ശലോമോൻ രാജാവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ ഓഫീറിൽ എത്തി.” എബ്രായക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് “ചെന്നു” എന്നും “വന്നു/എത്തി” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: അവർ ... ചെന്നു
  rationale: בוא എന്ന ചലനക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വന്നു’ എന്നും ‘ചെന്നു’ എന്നും അർഥമാകാം. യാത്രക്കാരെക്കുറിച്ചുള്ള ഈ ആഖ്യാനത്തിന്റെ ദൃഷ്ടികോണത്തിൽ മലയാളത്തിൽ ‘ചെന്നു’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אוֹפִירָה
  choice: ഓഫീറിലേക്കു
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന directional he ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു; അത് ‘-ലേക്കു’ എന്ന വിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: അവിടെനിന്ന് ... എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ക്രിയയ്ക്ക് ‘എടുത്തു’ യോജിക്കുന്നു; מן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടാർഥം ‘അവിടെനിന്ന്’ എന്ന് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: זָהָב אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: നാനൂറ്റിയിരുപത് താലന്ത് സ്വർണം
  rationale: കൃത്യമായ സംഖ്യ വാക്കുകളിൽ നൽകുന്നു; כִּכָּר എന്ന പുരാതന ഭാരയൂണിറ്റിന് മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ ‘താലന്ത്’ ഉപയോഗിക്കുന്നു.
- source_word: וַיָּבִאוּ
  choice: കൊണ്ടുവന്നു
  rationale: בוא-യുടെ ഹിഫീൽ രൂപം ഇവിടെ വസ്തു ഒരാളുടെ അടുക്കൽ എത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊണ്ടുവന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ അടുക്കൽ
  rationale: എബ്രായത്തിലെ രാജപദവിയും വ്യക്തിനാമവും സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നൽകുകയും אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യം ‘അടുക്കൽ’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
