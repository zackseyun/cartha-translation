translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭാരയൂണിറ്റ് ആധുനിക അളവിലേക്കു മാറ്റാതെ ‘താലന്ത്’ എന്നു നിലനിർത്തി. ചലനക്രിയയിലെ യഥാർഥ ദൃഷ്ടികോണവ്യത്യാസം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
