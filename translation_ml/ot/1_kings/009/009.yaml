reference: 1 Kings 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: ml
  text: 'അവർ പറയും: “അവരുടെ പിതാക്കന്മാരെ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച അവരുടെ ദൈവമായ യാഹ്‌വേയെ അവർ ഉപേക്ഷിക്കുകയും, അന്യദേവന്മാരോടു പറ്റിച്ചേരുകയും, അവരെ കുനിഞ്ഞ് വണങ്ങുകയും സേവിക്കുകയും ചെയ്തതുകൊണ്ടാണ് യാഹ്‌വേ ഈ ദുരന്തമെല്ലാം അവരുടെമേൽ വരുത്തിയത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ പൂർവികരെ.” ഹീബ്രു പദം അക്ഷരാർഥത്തിൽ “അവരുടെ പിതാക്കന്മാരെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: അപ്പോൾ അവർ പറയും
  rationale: മുൻവാക്യത്തിലെ ചോദ്യത്തിന് നിരീക്ഷകർ നൽകുന്ന മറുപടിയിലേക്കുള്ള തുടർച്ചയും ഭാവിസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל אֲשֶׁר
  choice: ചെയ്തതുകൊണ്ടാണ്
  rationale: വിധിയുടെ കാരണം വ്യക്തമാക്കുന്ന ഹീബ്രു ഘടനയെ മലയാളത്തിലെ സ്വാഭാവിക കാരണപ്രയോഗമായി നൽകുന്നു.
- source_word: עָזְבוּ
  choice: ഉപേക്ഷിക്കുകയും
  rationale: വെറും വിട്ടുപോകലല്ല, ദൈവത്തോടുള്ള ഉടമ്പടിബന്ധം കൈവിടുന്നതും വ്യക്തമാക്കുന്ന ആധുനിക പദം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵיהֶם
  choice: അവരുടെ ദൈവമായ
  rationale: ഇവിടെ യഹോവയാണ് ഏകവചന സൂചിതൻ; അതിനാൽ ഏകവചനമായ ‘ദൈവം’ ആവശ്യമാണ്.
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച
  rationale: പുറപ്പാടിന്റെ സ്ഥിരപ്രയോഗം മൂലത്തോടടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാരെ
  rationale: ഹീബ്രുവിലെ പുരുഷലിംഗ ബഹുവചനത്തെ നേരിട്ട് നിലനിർത്തുന്നു; വിശാലമായ പൂർവികർ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരോടു പറ്റിച്ചേർന്ന്
  rationale: חזק ב എന്നത് ഇവിടെ ദൃഢമായി ചേർന്നുനിൽക്കുന്നതും വിശ്വസ്തത മാറ്റിവെക്കുന്നതും സൂചിപ്പിക്കുന്നു; ‘പറ്റിച്ചേർന്ന്’ ഈ സജീവബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וישתחו להם
  choice: അവരെ നമസ്കരിക്കുകയും
  rationale: കുനിഞ്ഞുവണങ്ങുന്ന ആരാധനാക്രിയയെ സൂചിപ്പിക്കുകയും അടുത്ത ‘സേവിച്ചു’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּעַבְדֻם
  choice: സേവിക്കുകയും
  rationale: വിഗ്രഹാരാധനാസന്ദർഭത്തിലെ മതപരമായ സേവനം സൂചിപ്പിക്കുന്നു; മുൻക്രിയയുമായുള്ള ക്രമവികാസം സംരക്ഷിക്കുന്നു.
- source_word: עַל כֵּן
  choice: ചെയ്തതുകൊണ്ടാണ്
  rationale: കാരണം-ഫലം ബന്ധം മലയാളവാക്യത്തിന്റെ സമാപനത്തിൽ ഊന്നിപ്പറയുന്നു.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: ഈ അനർഥമെല്ലാം അവരുടെമേൽ വരുത്തിയത്
  rationale: רָעָה ഇവിടെ ധാർമിക തിന്മയല്ല, ന്യായവിധിയായി വന്ന ദുരന്തമാണ്; ‘അനർഥം’ ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപം നിലനിർത്തുന്നു.
- issue: אֲבֹתָם എന്ന പൂർവികപദത്തിന്റെ ലിംഗവും വ്യാപ്തിയും
  choice: അവരുടെ പിതാക്കന്മാർ
  alternative: അവരുടെ പൂർവികർ
  rationale: പ്രധാനപാഠത്തിൽ ഹീബ്രുവിലെ പുരുഷലിംഗരൂപം സംരക്ഷിക്കുന്നു; വംശപരമായ വിശാല അർഥം അടിക്കുറിപ്പിലൂടെ അറിയിക്കുന്നു.
- issue: רָעָהയുടെ ന്യായവിധിസന്ദർഭത്തിലുള്ള അർഥം
  choice: അനർഥം
  alternative: തിന്മ
  rationale: ഇവിടെ ദൈവം ധാർമിക തിന്മ വരുത്തിയെന്നല്ല, വിശ്വാസത്യാഗത്തിന് ന്യായവിധിയായി ദുരന്തം വരുത്തിയെന്നാണ് പ്രസംഗസന്ദർഭം; അതിനാൽ സന്ദർഭാർഥം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കാരണം-ഫലം ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട്, ഉപേക്ഷിക്കൽ–പറ്റിച്ചേരൽ–നമസ്കരിക്കൽ–സേവിക്കൽ എന്ന ഹീബ്രു ക്രിയാക്രമം സംരക്ഷിച്ചിരിക്കുന്നു.
