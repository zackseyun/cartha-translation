revisions:
- from: 'അപ്പോൾ അവർ പറയും: “അവരുടെ പിതാക്കന്മാരെ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച അവരുടെ ദൈവമായ യഹോവയെ അവർ ഉപേക്ഷിക്കുകയും അന്യദേവന്മാരോടു പറ്റിച്ചേർന്ന് അവരെ നമസ്കരിക്കുകയും സേവിക്കുകയും ചെയ്തതുകൊണ്ടാണ് യഹോവ ഈ അനർഥമെല്ലാം അവരുടെമേൽ വരുത്തിയത്.”'
  to: 'അവർ പറയും: “അവരുടെ പിതാക്കന്മാരെ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ച അവരുടെ ദൈവമായ യാഹ്‌വേയെ അവർ ഉപേക്ഷിക്കുകയും, അന്യദേവന്മാരോടു പറ്റിച്ചേരുകയും, അവരെ കുനിഞ്ഞ് വണങ്ങുകയും സേവിക്കുകയും ചെയ്തതുകൊണ്ടാണ് യാഹ്‌വേ ഈ ദുരന്തമെല്ലാം അവരുടെമേൽ വരുത്തിയത്.”'
  rationale: 'The revision aligns the rendering of יהוה with the project’s Yahweh policy, makes the bowing verb more lexically precise, and uses a clear modern Malayalam term for judgmental calamity. It preserves the Hebrew causal construction and its threefold progression: holding fast to other gods, bowing to them, and serving them.'
