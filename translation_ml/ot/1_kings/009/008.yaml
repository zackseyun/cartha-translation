  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: ml
  text: 'ഈ ആലയം ഒരു നാശാവശിഷ്ടമായിത്തീരും[a]. അതിന്റെ അരികിലൂടെ കടന്നുപോകുന്ന ഏവനും സ്തംഭിച്ചുപോകുകയും ചൂളമടിക്കുകയും ചെയ്യും[b]. അവർ ചോദിക്കും: ‘യാഹ്‌വെ ഈ ദേശത്തോടും ഈ ആലയത്തോടും ഇങ്ങനെ ചെയ്തത് എന്തുകൊണ്ട്?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ഈ ആലയം ഉയർന്നതായിരിക്കും.” എന്നാൽ ഈ സന്ദർഭത്തിൽ ഇതിനെ നാശാവസ്ഥയെ സൂചിപ്പിക്കുന്നതായി പലരും മനസ്സിലാക്കുന്നു; 2 ദിനവൃത്താന്തം 7:21 താരതമ്യം ചെയ്യുക.'
    reason: textual_variant
  - marker: b
    text: അഥവാ, “പരിഹാസത്തോടെ ചൂളമടിക്കും.” എബ്രായക്രിയ ആശ്ചര്യമോ ഭീതിയോ പരിഹാസമോ പ്രകടിപ്പിക്കുന്ന മൂർച്ചയുള്ള ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: ഈ ആലയം
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വീട്’ ആണെങ്കിലും ഇവിടെ ദേവാലയമാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘ആലയം’ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാക്യാവസാനത്തും അതേ പദം ആവർത്തിച്ച് എബ്രായത്തിലെ സാഹിത്യബന്ധം നിലനിർത്തുന്നു.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: ഒരു നാശാവശിഷ്ടമായിത്തീരും
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ പാഠത്തിന് അക്ഷരാർഥത്തിൽ ‘ഉയർന്നതായിരിക്കും’ എന്നാണ്. എന്നാൽ ന്യായവിധിയുടെ സന്ദർഭവും 2 ദിനവൃത്താന്തം 7:21-ലെ സമാന്തരവും നാശാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. ആ അർഥം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകി പാഠപ്രശ്നം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל עֹבֵר עָלָיו
  choice: അതിന്റെ അരികിലൂടെ കടന്നുപോകുന്ന ഏവനും
  rationale: വഴിയിലൂടെ അതിനെ കടന്നുപോകുന്ന എല്ലാവരെയും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יִשֹּׁם
  choice: സ്തബ്ധരായി
  rationale: നാശം കണ്ട് ഭീതിയോടും ഞെട്ടലോടും പ്രതികരിക്കുന്ന അർഥം ഉൾക്കൊള്ളുന്നു. ‘സ്തബ്ധരായി’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וְשָׁרָק
  choice: ചൂളമടിക്കും
  rationale: ആശ്ചര്യം, ഭീതി, അല്ലെങ്കിൽ പരിഹാസം പ്രകടിപ്പിക്കുന്ന മൂർച്ചയുള്ള ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചൂളമടിക്കുക’ ഏറ്റവും നേരിട്ടുള്ള സമാനപ്രയോഗമാണ്; പരിഹാസസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְאָמְרוּ
  choice: അവർ ചോദിക്കും
  rationale: തുടരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘പറയും’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ‘ചോദിക്കും’ സ്വാഭാവികമാണ്; ബഹുവചനത്തിലെ അനിശ്ചിത കർത്താവ് നിലനിർത്തുന്നു.
- source_word: עַל מֶה
  choice: എന്തുകൊണ്ട്
  rationale: ന്യായവിധിയുടെ കാരണം അന്വേഷിക്കുന്ന ചോദ്യത്തിന് സ്വാഭാവിക മലയാള സമാനം.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כָּכָה
  choice: ഇങ്ങനെ
  rationale: കാണപ്പെടുന്ന ന്യായവിധിയുടെ രീതിയെയും ഫലത്തെയും ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക മലയാള രൂപം.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: ഈ ദേശത്തോടും ഈ ആലയത്തോടും
  rationale: אֶרֶץ ഇവിടെ ‘ഭൂമി’ എന്ന പൊതുവർത്ഥത്തേക്കാൾ ഈ പ്രത്യേക ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിക്കുന്ന בַּיִת സന്ദർഭോചിതമായി ‘ആലയം’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരം ചെയ്യുന്നത് പാഠത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: ന്യായവിധിയുടെ സന്ദർഭത്തിലെ עֶלְיוֹן എന്ന പദത്തിന്റെ അർഥം
  choice: സന്ദർഭാനുസൃതമായി ‘നാശാവശിഷ്ടം’
  alternative: ഉയർന്നത്; ഉന്നതമായത്
  rationale: അക്ഷരാർഥം സന്ദർഭത്തിൽ ദുഷ്കരമാണ്. സമാന്തരപാഠവും ശാപവിധിയുടെ പശ്ചാത്തലവും നാശത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും യഥാർത്ഥ പാഠത്തിലെ സംഘർഷം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ആലയം’, ‘നാശാവശിഷ്ടം’, ‘സ്തബ്ധരായി’ എന്നീ പദങ്ങൾ സന്ദർഭം വ്യക്തമാക്കുന്നു; മൂലപാഠത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുന്നു.
