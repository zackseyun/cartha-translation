  to: അവർക്കുശേഷം ദേശത്ത് ശേഷിച്ചിരുന്ന അവരുടെ സന്തതികളെ—ഇസ്രായേൽമക്കൾക്ക് നാശത്തിനായി സമർപ്പിക്കാൻ കഴിയാതിരുന്നവരെ[a]—ശലോമോൻ നിർബന്ധിത വേലയ്ക്കായി നിയോഗിച്ചു; അവർ ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു.
  rationale: അവസാനത്തെ എബ്രായ കാലസൂത്രം ശലോമോന്റെ പ്രവർത്തിയുടെ ദൈർഘ്യമല്ല, നിർബന്ധിതവേലയിലുള്ള ജനങ്ങളുടെ നില തുടർന്നതാണെന്ന് വ്യക്തമാക്കാൻ വാക്യം പുനഃക്രമീകരിച്ചു. മുഖ്യപാഠത്തിലെ חרם-ബന്ധിതമായ ദ്വയാർഥവും നിർബന്ധിതവേലയുടെ സ്വഭാവവും നിലനിർത്തി. അടിക്കുറിപ്പിലെ സാങ്കേതിക ബദൽ കൂടുതൽ സ്വാഭാവികവും വിശദീകരണത്തോടു യോജിച്ചതുമാക്കി.
