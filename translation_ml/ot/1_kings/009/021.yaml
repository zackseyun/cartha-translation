  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: ml
  text: അവർക്കുശേഷം ദേശത്ത് ശേഷിച്ചിരുന്ന അവരുടെ സന്തതികളെ—ഇസ്രായേൽമക്കൾക്ക് നാശത്തിനായി സമർപ്പിക്കാൻ കഴിയാതിരുന്നവരെ[a]—ശലോമോൻ നിർബന്ധിത വേലയ്ക്കായി നിയോഗിച്ചു; അവർ ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് ‘നാശത്തിനായി സമർപ്പിക്കുക’ എന്നാണ് അക്ഷരാർഥം; ‘ഹേരെമിനു വിധേയമാക്കുക’ എന്നോ ‘പൂർണമായി നശിപ്പിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്താം. ആളുകളെയോ വസ്തുക്കളെയോ חרם (ഹേരെം) എന്ന നിലയിൽ, ന്യായവിധിക്കായി തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കുന്നതിനെ ഈ ക്രിയ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: അവരുടെ സന്തതികൾ
  rationale: ബഹുവചനത്തിലുള്ള בֵּן ഇവിടെ മുൻപ് പരാമർശിച്ച ജനവിഭാഗങ്ങളുടെ പിന്നീടുള്ള തലമുറയെ സൂചിപ്പിക്കുന്നു. ‘സന്തതികൾ’ എന്നത് പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കാതെ തലമുറബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: അവർക്കുശേഷം ശേഷിച്ചിരുന്നവർ
  rationale: മുൻതലമുറയ്ക്കുശേഷം ശേഷിച്ചവരെന്ന ഫലാവസ്ഥയും കാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָּאָרֶץ
  choice: ദേശത്ത്
  rationale: ചരിത്രസന്ദർഭത്തിലെ നിർദിഷ്ട ദേശത്തെ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന് ലളിതവും സ്വാഭാവികവുമായ തർജമ.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: നാശത്തിനായി സമർപ്പിക്കാൻ കഴിയാതിരുന്നവർ
  rationale: חרם എന്ന ആശയത്തിലെ നശിപ്പിക്കലും ന്യായവിധിക്കായി തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കലും ഒരുമിച്ച് നിലനിർത്തുന്നു; വെറും ‘നശിപ്പിക്കുക’ എന്നു പറഞ്ഞ് ആശയം ചുരുക്കുന്നില്ല.
- source_word: וַיַּעֲלֵם
  choice: അവരെ ... വിധേയരാക്കി
  rationale: ആളുകളെ വേലച്ചുമതലയിലേക്കു ഭരണപരമായി കൊണ്ടുവരുന്ന ഹിഫീൽ ക്രിയയുടെ കാരകഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמַס עֹבֵד
  choice: നിർബന്ധിതവേലയ്ക്ക്
  rationale: מַס עֹבֵד സൂചിപ്പിക്കുന്ന തൊഴിൽച്ചുമതലയുടെ നിർബന്ധിതസ്വഭാവം സാങ്കേതികപദം ഉപയോഗിക്കാതെ വ്യക്തമായി അറിയിക്കുന്നു; നിയമപരമായ അടിമസ്ഥിതി അനാവശ്യമായി ആരോപിക്കുന്നില്ല.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെയും
  rationale: എബ്രായത്തിലെ പതിവ് കാലസൂത്രത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ജയവും ന്യായവിധിയും സംബന്ധിച്ച സന്ദർഭത്തിൽ החרים എന്ന ക്രിയയുടെ അർഥം
  choice: നാശത്തിനായി സമർപ്പിക്കുക
  alternative: പൂർണമായി നശിപ്പിക്കുക; വിലക്കിനുകീഴിലാക്കുക
  rationale: എബ്രായപദത്തിൽ നശിപ്പിക്കലിന്റെയും ദൈവിക ന്യായവിധിക്കായി മാറ്റിവെക്കലിന്റെയും ഭാവങ്ങൾ ഒത്തുചേരുന്നു. മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. ദീർഘമായ എബ്രായബന്ധവാക്യം വായനാസൗകര്യത്തിനായി ഇടവരകളാൽ വേർതിരിച്ചെങ്കിലും അതിന്റെ വ്യാകരണബന്ധം നിലനിർത്തി. ‘സന്തതികൾ’ തലമുറാസൂചന സംരക്ഷിക്കുന്നു; ‘നിർബന്ധിതവേല’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും ‘corvée’ പോലുള്ള സാങ്കേതികത ഒഴിവാക്കുന്നതുമാണ്.
