  naturalness: ‘അവർ ഇന്നുവരെയും അങ്ങനെതന്നെ തുടരുന്നു’ എന്ന വേർതിരിച്ച വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘നിർബന്ധിത വേലയ്ക്കായി നിയോഗിച്ചു’ ഭരണപരമായ നിയമനത്തിന്റെ ആശയവും ബലപ്രയോഗസ്വഭാവവും വ്യക്തമായി നൽകുന്നു.
  terminology: ‘നാശത്തിനായി സമർപ്പിക്കുക’ חרם എന്ന പദത്തിന്റെ നശീകരണ-സമർപ്പണ ദ്വയാർഥം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പിൽ സാങ്കേതിക ബദലായ ‘ഹേരെമിനു വിധേയമാക്കുക’ ചേർക്കുന്നതു ‘വിലക്കിനുകീഴിലാക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികവും കൃത്യവുമാണ്. ‘സന്തതികൾ,’ ‘ദേശത്ത്,’ ‘നിർബന്ധിത വേല’ എന്നിവ സന്ദർഭോചിതമാണ്.
  issues:
