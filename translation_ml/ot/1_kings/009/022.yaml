  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കളിൽ ആരെയും ശലോമോൻ അടിമയാക്കിയില്ല; അവർ യോദ്ധാക്കളും അവന്റെ സേവകരും സേനാധിപന്മാരും സൈനിക ഉദ്യോഗസ്ഥരും[a] അവന്റെ രഥസേനാധിപന്മാരും കുതിരപ്പടയാളികളും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ സൈനിക സഹായികൾ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ഉന്നതപദവിയിലുള്ള സൈനിക സഹായികളെയോ രഥസേനാ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിച്ചിരിക്കാം; കൃത്യമായ പദവി അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: എന്നാൽ ഇസ്രായേൽമക്കളിൽ ആരെയും
  rationale: മുൻവാക്യത്തിലെ ഇസ്രായേല്യരല്ലാത്ത നിർബന്ധിത തൊഴിലാളികളോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നിഷേധവാക്യത്തിന്റെ മലയാളഘടനയ്ക്കായി ‘ആരെയും’ ചേർത്തു.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: ശലോമോൻ അടിമയാക്കിയില്ല
  rationale: ഇവിടെ ‘ഒരാളെ അടിമയായി ആക്കുക/നിയോഗിക്കുക’ എന്ന ആശയമാണ്. ചുറ്റുപാടിലെ നിർബന്ധിതവേലയുടെ പശ്ചാത്തലത്തിൽ ‘സേവകനാക്കിയില്ല’ എന്നത് സാമൂഹിക നിലയുടെ കഠിനത അനാവശ്യമായി മയപ്പെടുത്തും.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: യോദ്ധാക്കൾ
  rationale: യുദ്ധത്തിൽ സേവിക്കുന്ന പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: וַעֲבָדָיו
  choice: അവന്റെ സേവകർ
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ עבד ഔദ്യോഗിക സേവകരെയോ രാജഭൃത്യരെയോ സൂചിപ്പിക്കാം. ആദ്യഭാഗത്തിലെ അടിമസ്ഥിതിയുമായി തെറ്റായി സമീകരിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְשָׂרָיו
  choice: സേനാധിപന്മാർ
  rationale: ഈ സൈനിക പട്ടികയിൽ שׂר എന്നത് നേതാക്കളെയോ കമാൻഡർമാരെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രഭുക്കന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: וְשָׁלִשָׁיו
  choice: സൈനിക ഉദ്യോഗസ്ഥർ
  rationale: שָׁלִישׁ എന്ന പദത്തിന്റെ കൃത്യമായ ചരിത്രപരമായ പദവി അനിശ്ചിതമാണ്. പ്രധാനവാചകത്തിൽ അതിനെ അമിതമായി നിർവചിക്കാതെ പൊതുവായ സൈനികപദം ഉപയോഗിച്ചു; സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: അവന്റെ രഥസേനാധിപന്മാർ
  rationale: ശലോമോന്റെ രഥസേനയുടെ മേൽനോട്ടക്കാരെ വ്യക്തമായും ചുരുക്കമായും സൂചിപ്പിക്കുന്നു.
- source_word: וּפָרָשָׁיו
  choice: കുതിരപ്പടയാളികൾ
  rationale: കുതിരപ്പുറത്തു പോരാടുന്ന സൈനികരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
theological_decisions:
- issue: עָבֶד സൂചിപ്പിക്കുന്ന സാമൂഹിക നില
  choice: അടിമയാക്കിയില്ല
  alternative: സേവകനാക്കിയില്ല / നിർബന്ധിത തൊഴിലാളിയാക്കിയില്ല
  rationale: മുൻവാക്യങ്ങളിലെ നിർബന്ധിതവേലയുടെ പശ്ചാത്തലം കണക്കിലെടുത്ത് അടിമത്തത്തിന്റെ കഠിനത മയപ്പെടുത്താതിരിക്കാൻ ‘അടിമ’ നിലനിർത്തി. അതേസമയം ‘തൊഴിലാളി’ എന്ന് ചേർത്ത് പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കിയില്ല.
- issue: ആദ്യത്തെ עָבֶד എന്നതും പിന്നീട് വരുന്ന וַעֲבָדָיו എന്നതും
  choice: ആദ്യത്തേത് ‘അടിമ’; രണ്ടാമത്തേത് ‘സേവകർ’
  alternative: രണ്ടിടത്തും ‘അടിമകൾ’
  rationale: ഒരേ മൂലപദത്തിന് സന്ദർഭമനുസരിച്ച് വ്യത്യസ്ത സാമൂഹിക-ഭരണപരമായ അർഥങ്ങൾ ഉണ്ടാകാം. രാജാവിന്റെ സൈനിക-ഭരണ ഉദ്യോഗസ്ഥരുടെ പട്ടികയിൽ രണ്ടാമത്തെ പ്രയോഗം രാജസേവകരെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; അവരെ അടിമകളായി നിർണ്ണയിക്കുന്നത് മൂലപാഠത്തേക്കാൾ അധികമായ വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ചരിത്രവിവരണശൈലി. സൈനിക പദവികൾ വ്യക്തമായി വിവർത്തനം ചെയ്തെങ്കിലും שָׁלִישׁ എന്ന അപൂർവപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
