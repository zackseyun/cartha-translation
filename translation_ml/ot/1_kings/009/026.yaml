id: 1KI.9.26
reference: 1 Kings 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: ml
  text: ശലോമോൻ രാജാവ് എദോംദേശത്ത്, ചെങ്കടലിന്റെ[a] തീരത്ത് ഏലോത്തിനരികെയുള്ള എസ്യോൻ-ഗേബെരിൽ ഒരു കപ്പൽപ്പടയും പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘ഞാങ്ങണക്കടൽ’; പരമ്പരാഗതമായി ‘ചെങ്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: ഒരു കപ്പൽപ്പടയും
  rationale: אֳנִי എന്ന ഏകവചന നാമം ഇവിടെ ഒരു കപ്പലിനെയോ കൂട്ടമായി കപ്പലുകളെയോ സൂചിപ്പിക്കാം. സമുദ്രവ്യാപാരസന്ദർഭവും עָשָׂה എന്ന ക്രിയയും കണക്കിലെടുത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒരു കപ്പൽപ്പട’ എന്നു നൽകി; വാവിന്റെ ബന്ധകഭാവം ‘യും’കൊണ്ട് പ്രതിനിധീകരിച്ചു.
- source_word: עָשָׂה
  choice: പണിതു
  rationale: അടിസ്ഥാന അർഥം ‘ഉണ്ടാക്കി/ചെയ്തു’ എന്നാണെങ്കിലും, കപ്പൽപ്പടയുടെ നിർമ്മാണസന്ദർഭത്തിൽ ‘പണിതു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: എസ്യോൻ-ഗേബെരിൽ
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു; בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം മലയാളത്തിലെ ‘-ഇൽ’കൊണ്ട് നൽകി.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: ഏലോത്തിനരികെയുള്ള
  rationale: ഈ അപൂർവ സ്ഥാനസംബന്ധ നിർമാണം ഏലോത്തുമായുള്ള സമീപ്യം സൂചിപ്പിക്കുന്നു. ‘അരികെയുള്ള’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുകയും കൃത്യമായ ഭൗമബന്ധം അനാവശ്യമായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עַל שְׂפַת יַם סוּף
  choice: ചെങ്കടലിന്റെ[a] തീരത്ത്
  rationale: שְׂפַת എന്നതിന്റെ ഭൗമിക അർഥം ‘തീരം’ എന്നാണ്. יַם־סוּף പരമ്പരാഗതവും വായനക്കാർക്ക് പരിചിതവുമായ ‘ചെങ്കടൽ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: എദോംദേശത്ത്
  rationale: ‘എദോമിന്റെ ദേശത്ത്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഭൗമിക ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
