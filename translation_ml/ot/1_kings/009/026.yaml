translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രു വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കാൻ സ്ഥലസൂചനകൾ ക്രമപ്പെടുത്തി; എല്ലാ വിവരങ്ങളും നിലനിർത്തി.
