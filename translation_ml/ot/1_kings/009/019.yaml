  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: ml
  text: കൂടാതെ, ശലോമോനുണ്ടായിരുന്ന എല്ലാ സംഭരണനഗരങ്ങളും[a], രഥനഗരങ്ങളും, കുതിരപ്പടയാളികളുടെ നഗരങ്ങളും[b], യെരൂശലേമിലും ലെബാനോനിലും തന്റെ ആധിപത്യത്തിലുള്ള ദേശത്തെങ്ങും പണിയാൻ ശലോമോൻ ആഗ്രഹിച്ചതെല്ലാം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കലവറനഗരങ്ങൾ’ അല്ലെങ്കിൽ ‘വിതരണനഗരങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം. സംഭരണത്തിനോ വിഭവവിതരണത്തിനോ നിയോഗിച്ച നഗരങ്ങളെയാണ് ഹീബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘കുതിരപ്പടയുടെ നഗരങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഹീബ്രായപദം കുതിരകളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനെക്കാൾ വ്യക്തമായി കുതിരപ്പടയാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘ശലോമോന്റെ ആഗ്രഹം—അവൻ പണിയാൻ ആഗ്രഹിച്ചത്.’ ശലോമോൻ പണിയാൻ ശക്തമായി ആഗ്രഹിച്ച കാര്യങ്ങൾക്ക് ഊന്നൽ നൽകുന്ന ഹീബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: സംഭരണനഗരങ്ങൾ
  rationale: ധാന്യം, ആയുധങ്ങൾ, മറ്റു വിഭവങ്ങൾ എന്നിവ സംഭരിക്കാനോ വിതരണം ചെയ്യാനോ നിശ്ചയിച്ച നഗരങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘സംഭരണനഗരങ്ങൾ’ ആ ഭരണപരമായ ധ്വനി വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: ശലോമോനുണ്ടായിരുന്ന
  rationale: ഹീബ്രായ ദത്തിവ് ഘടനയിലെ ഉടമസ്ഥതയുടെയോ രാജാവിനായി നീക്കിവെച്ചിരുന്നതിന്റെയോ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָרֵי הָרֶכֶב
  choice: രഥനഗരങ്ങൾ
  rationale: രഥസേനയ്ക്കും അതിന്റെ സംവിധാനങ്ങൾക്കും വേണ്ടി നിയോഗിച്ച നഗരങ്ങൾ എന്ന സംക്ഷിപ്തവും നേരിട്ടുമായ അർഥം നൽകുന്നു.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: കുതിരപ്പടയാളികളുടെ നഗരങ്ങൾ
  rationale: פָּרָשִׁים എന്നത് പൊതുവേ കുതിരകളെയല്ല, കുതിരപ്പുറത്തു പോരാടുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ രഥനഗരങ്ങളിൽനിന്നുള്ള വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: ശലോമോൻ ആഗ്രഹിച്ചതെല്ലാം
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള നാമവും ക്രിയയും ചേർന്ന ഹീബ്രായ ഊന്നൽ മലയാളത്തിൽ അസ്വാഭാവികമായി ആവർത്തിക്കാതെ, അതിന്റെ വ്യാപ്തി ‘എല്ലാം’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: לִבְנוֹת
  choice: പണിയാൻ
  rationale: രാജകീയ നിർമാണപ്രവർത്തനങ്ങളുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: യെരൂശലേമിലും ലെബാനോനിലും
  rationale: രണ്ടിടങ്ങളെയും സ്ഥലസൂചകമായി നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ലെബാനോനെ വെറും ദേവദാരുമരത്തിന്റെ ഉറവിടമായി ചുരുക്കുന്നില്ല.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: തന്റെ ആധിപത്യത്തിലുള്ള ദേശത്തെങ്ങും
  rationale: מֶמְשָׁלָה എന്നതിലെ രാജകീയ ഭരണാധികാരവും אֶרֶץ എന്നതിലെ ഭൂപ്രദേശപരമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിലെ നിർമാണപ്രവർത്തനങ്ങളുടെ പട്ടിക തുടരുന്നതിനാൽ ‘കൂടാതെ’ എന്ന ബന്ധകം നിലനിർത്തി. സാങ്കേതിക രാജകീയ-സൈനിക പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപത്തിൽ നൽകി.
