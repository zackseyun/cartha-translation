  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: ml
  text: അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ എന്നിവരിൽ ശേഷിച്ചിരുന്നവരും ഇസ്രായേൽമക്കളിൽ ഉൾപ്പെടാത്തവരുമായ സകല ജനവും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם
  choice: സകല ജനവും
  rationale: כָּל definite collective noun ആയ הָעָם-നെ സമഗ്രമായി ഉൾക്കൊള്ളുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കൂട്ടവാചകമാണ് ‘സകല ജനവും’.
- source_word: הַנּוֹתָר מִן
  choice: എന്നിവരിൽ ശേഷിച്ചിരുന്നവർ
  rationale: Niphal participle ശേഷിച്ചവരെ സൂചിപ്പിക്കുന്നു; מִן ഇവിടെ പട്ടികപ്പെടുത്തിയ ജനവിഭാഗങ്ങളിൽനിന്നുള്ള ശേഷിപ്പിനെ അടയാളപ്പെടുത്തുന്നു. ‘എന്നിവരിൽ’ മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: അമോര്യർ, ഹിത്യർ, പെരിസ്യർ, ഹിവ്യർ, യെബൂസ്യർ
  rationale: ജനവിഭാഗനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ നൽകി; ഹീബ്രുവിലെ ഏകവചന-കൂട്ടാർത്ഥം മലയാളത്തിൽ ബഹുവചന ജനനാമങ്ങളായി സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: ഇസ്രായേൽമക്കളിൽ ഉൾപ്പെടാത്തവരുമായ
  rationale: അക്ഷരാർഥം ‘അവർ ഇസ്രായേലിന്റെ പുത്രന്മാരിൽനിന്നുള്ളവരല്ല’ എന്നാണ്. മലയാളത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടരൂപം നിലനിർത്തുകയും ‘ഉൾപ്പെടാത്തവർ’ ജനസമൂഹത്തിലെ അംഗത്വമില്ലായ്മ സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന വംശീയ-ഉടമ്പടിപദത്തിന്റെ ലിംഗരൂപം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപത്തോട് സുതാര്യമായ ബന്ധം നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ സ്ത്രീകളെ ഒഴിവാക്കുന്നതായി നിർബന്ധമായും വായിക്കേണ്ടതില്ല. ‘ഇസ്രായേല്യർ’ കൂടുതൽ ഭാഷാസ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണ്, എങ്കിലും ഉറവിടത്തിന്റെ ബന്ധവാചകം അതിൽ മങ്ങുന്നു.
- issue: വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്ന ഘടന
  choice: അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം (—)
  alternative: പൂർണ്ണവിരാമം
  rationale: ഹീബ്രു വാക്യഘടന 21-ാം വാക്യത്തിൽ തുടരുന്നതിനാൽ, ഇവിടെ ആശയം സമാപിച്ചതായി തോന്നിക്കാതിരിക്കാൻ തുറന്ന തുടർച്ച സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടിക നീണ്ടതായതിനാൽ മുഖ്യനാമമായ ‘സകല ജനവും’ അവസാനം വെച്ച് മലയാള വാക്യക്രമം സുതാര്യമാക്കി. ഉറവിടത്തിൽ യഥാർത്ഥ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണാവശ്യമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല.
