source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ ശലോമോന് രണ്ടാം പ്രാവശ്യം[a] പ്രത്യക്ഷനായി; ഗിബെയോനിൽവെച്ച് അവന് പ്രത്യക്ഷനായതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വീണ്ടും’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘രണ്ടാം പ്രാവശ്യം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവികമായ പ്രത്യക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രത്യക്ഷനായി’ എന്നത് സ്വാഭാവികവും തുടർന്നുള്ള נִרְאָה എന്ന സമാന്തരരൂപത്തോടു യോജിക്കുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ഇത് ക്രമത്തിൽ രണ്ടാമത്തെ സംഭവമാണെന്ന് എബ്രായ ക്രിയാവിശേഷണം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘വീണ്ടും’ എന്നതിനെക്കാൾ ഈ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: ഗിബെയോനിലെ മുൻ പ്രത്യക്ഷപ്പെടലുമായുള്ള താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: נִרְאָה
  choice: പ്രത്യക്ഷനായത്
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം മുൻകാലത്തെ അതേ തരത്തിലുള്ള പ്രത്യക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ മുൻകാലബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אֵלָיו
  choice: അവന്
  rationale: אֶל എന്ന പൂർവപ്രത്യയത്തിന്റെ ദിശാത്മകവും ബന്ധാത്മകവുമായ അർഥം ഇവിടെ സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യക്ഷപ്പെടലിന്റെ രീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: בְּגִבְעוֹן
  choice: ഗിബെയോനിൽവെച്ച്
  rationale: בְ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മുൻ പ്രത്യക്ഷപ്പെടൽ നടന്ന സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ ആ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ശലോമോൻ’, ‘ഗിബെയോൻ’ എന്നീ രൂപങ്ങൾ എബ്രായ നാമങ്ങളോട് അടുപ്പം പാലിക്കുന്നു. മുഖ്യവാക്യത്തിൽ എബ്രായ ക്രമസൂചനയും മുൻ പ്രത്യക്ഷപ്പെടലുമായുള്ള താരതമ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
