id: 1KI.9.7
reference: 1 Kings 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ ഇസ്രായേലിനെ അവർക്കു ഞാൻ നൽകിയ ദേശത്തുനിന്ന് നീക്കിക്കളയും. എന്റെ നാമത്തിനായി[b] ഞാൻ വിശുദ്ധീകരിച്ച ഭവനത്തെ[a] എന്റെ മുമ്പിൽനിന്ന് തള്ളിക്കളയും[c]. ഇസ്രായേൽ സകല ജനതകളുടെയും ഇടയിൽ ഒരു പഴഞ്ചൊല്ലും പരിഹാസവാക്കും[d] ആയിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘ആലയത്തെ.’ എബ്രായം: ‘ഭവനത്തെ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ നാമത്തിനായി’ എന്നത് ദൈവത്തിന്റെ നാമം വഹിക്കാനും അതിനെ ബഹുമാനിക്കാനുമായി സമർപ്പിക്കപ്പെട്ടത് എന്നർഥമുള്ള എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘എന്റെ സന്നിധിയിൽനിന്ന് അയച്ചുകളയും.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘ഒരു പഴഞ്ചൊല്ലും നിന്ദാവാക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: ഛേദിച്ചുകളയും
  rationale: כרת എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ഛേദിക്കുക/നീക്കിക്കളയുക’ എന്ന ന്യായവിധിയുടെ ശക്തി നിലനിർത്തുന്നു; പൂർണ ഉന്മൂലനം എന്ന് അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ദേശത്തിന്റെ മുഖത്തുനിന്ന്
  rationale: എബ്രായയിലെ ‘ദേശത്തിന്റെ മുഖം’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുന്നു; തുടർന്നുള്ള ദാനദേശസന്ദർഭം കാരണം ‘ഭൂമി’ എന്നതിനെക്കാൾ ‘ദേശം’ യോജിക്കുന്നു.
- source_word: הַבַּיִת
  choice: ഭവനം
  rationale: മൂലത്തിലെ ‘വീട്/ഭവനം’ എന്ന പദം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ആലയമാണെന്ന് വ്യക്തമാണ്.
- source_word: הִקְדַּשְׁתִּי
  choice: വിശുദ്ധീകരിച്ച
  rationale: ദൈവിക ഉപയോഗത്തിനായി വിശുദ്ധമായി വേർതിരിച്ചുവെക്കുക എന്ന קדשׁ-ന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לִשְׁמִי
  choice: എന്റെ നാമത്തിനായി
  rationale: രാജാക്കന്മാരിലെ പ്രധാനപ്പെട്ട എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: എന്റെ മുമ്പിൽനിന്ന് തള്ളിക്കളയും
  rationale: ശുദ്ധമായ ‘അയയ്ക്കുക’ എന്നതിനെക്കാൾ ഇവിടെ ഉദ്ദേശിക്കുന്ന നിരാകരണത്തിന്റെയും പുറത്താക്കലിന്റെയും ശക്തി വ്യക്തമാക്കുന്നു; ‘എന്റെ മുമ്പിൽനിന്ന്’ എന്നത് മുഖം/സാന്നിധ്യം എന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: ഒരു പഴഞ്ചൊല്ലും പരിഹാസവാക്കും
  rationale: מָשָׁל എന്ന ചൊല്ലിനെയും שְׁנִינָה എന്ന പരിഹാസപ്രയോഗത്തെയും വേർതിരിച്ച്, രണ്ടാമത്തേതിലെ നിന്ദാഭാവം നിലനിർത്തുന്നു.
- source_word: בְּכָל הָעַמִּים
  choice: സകല ജനതകളുടെയും ഇടയിൽ
  rationale: ആധുനിക രാഷ്ട്രങ്ങളെ മാത്രം സൂചിപ്പിക്കാതെ עַמִּים എന്ന ബഹുവചന ജനസമൂഹാർഥം നൽകുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-ന്യായവിധിയുടെ ഭാഷ പൂർണ ഉന്മൂലനമായി അതിശയിപ്പിക്കാതിരിക്കുക
  choice: ഇസ്രായേലിനെ ... ഛേദിച്ചുകളയും
  alternative: ഇസ്രായേലിനെ ... നശിപ്പിച്ചുകളയും / പിഴുതെറിയും
  rationale: വാക്യം ദാനദേശത്തുനിന്നുള്ള പുറത്താക്കലും കഠിന ന്യായവിധിയും ഭീഷണിപ്പെടുത്തുന്നു. ‘ഛേദിച്ചുകളയും’ എന്നത് വിധിയുടെ ശക്തി നിലനിർത്തുമ്പോഴും സമ്പൂർണ വംശനാശം എന്ന ആശയം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: הַבַּיִת എന്നത് ‘ഭവനം’ എന്നോ ‘ആലയം’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ഭവനം
  alternative: ആലയം
  rationale: മൂലപദത്തിന്റെ രൂപകവും ‘ദൈവനാമത്തിനായുള്ള ഭവനം’ എന്ന പ്രമേയവും നിലനിർത്തുന്നു; സന്ദർഭവും അടിക്കുറിപ്പും ആലയമാണ് ഉദ്ദേശ്യമെന്ന് വ്യക്തമാക്കുന്നു.
- issue: ദൈവത്തിന്റെ ‘മുഖം’ എന്ന മനുഷ്യരൂപക ഭാഷയുടെ പരിഭാഷ
  choice: എന്റെ മുമ്പിൽനിന്ന്
  alternative: എന്റെ സന്നിധിയിൽനിന്ന് / എന്റെ മുഖത്തുനിന്ന്
  rationale: ദൈവത്തിന്റെ നിരാകരണവും സാന്നിധ്യത്തിൽനിന്നുള്ള പുറത്താക്കലും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ അതിപദാനുപദ രൂപം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ദേശത്തിന്റെ മുഖം,’ ‘എന്റെ നാമത്തിനായി,’ ‘ഭവനം’ എന്നീ പ്രധാന എബ്രായ ദൃശ്യങ്ങളും പ്രമേയങ്ങളും കഴിയുന്നത്ര നിലനിർത്തി; അസ്വാഭാവികത ഒഴിവാക്കാൻ ‘എന്റെ മുമ്പിൽനിന്ന്’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു.
