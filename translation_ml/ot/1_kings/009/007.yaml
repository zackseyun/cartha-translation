revisions:
- from: അപ്പോൾ ഞാൻ ഇസ്രായേലിനെ അവർക്കു നൽകിയ ദേശത്തിന്റെ മുഖത്തുനിന്ന് ഛേദിച്ചുകളയും. എന്റെ നാമത്തിനായി[b] ഞാൻ വിശുദ്ധീകരിച്ച ഭവനത്തെ[a] എന്റെ മുമ്പിൽനിന്ന് തള്ളിക്കളയും[c]. ഇസ്രായേൽ സകല ജനതകളുടെയും ഇടയിൽ ഒരു പഴഞ്ചൊല്ലും പരിഹാസവാക്കും[d] ആയിത്തീരും.
  to: അപ്പോൾ ഞാൻ ഇസ്രായേലിനെ അവർക്കു ഞാൻ നൽകിയ ദേശത്തുനിന്ന് നീക്കിക്കളയും. എന്റെ നാമത്തിനായി[b] ഞാൻ വിശുദ്ധീകരിച്ച ഭവനത്തെ[a] എന്റെ മുമ്പിൽനിന്ന് തള്ളിക്കളയും[c]. ഇസ്രായേൽ സകല ജനതകളുടെയും ഇടയിൽ ഒരു പഴഞ്ചൊല്ലും പരിഹാസവാക്കും[d] ആയിത്തീരും.
  rationale: The revision replaces only the stiff, overly literal Malayalam rendering of removal ‘from the face of the land.’ ‘ദേശത്തുനിന്ന് നീക്കിക്കളയും’ remains faithful to the Hebrew covenant-judgment context and is clearer in modern standard Malayalam. All other wording and footnote anchors are retained because they are faithful, natural, and structurally sound.
