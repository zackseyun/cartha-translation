source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളും നിങ്ങളുടെ പുത്രന്മാരും എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന് പൂർണമായി പിന്തിരിയുകയും, ഞാൻ നിങ്ങളുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന എന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിക്കാതിരിക്കുകയും, ചെന്ന് അന്യദേവന്മാരെ സേവിച്ച് അവരെ വണങ്ങുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: אִם നിബന്ധനയെ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തോടുള്ള വൈപരീത്യം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ചേർത്തു.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: പൂർണമായി പിന്തിരിയുകയും
  rationale: ക്രിയാനാമവും സമാപികക്രിയയും ചേർന്ന പ്രയോഗത്തിലെ ഊന്നൽ ‘പൂർണമായി’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു. מֵאַחֲרַי കൂടെ വരുന്നതിനാൽ ഇവിടെ മാനസാന്തരമല്ല, യഹോവയെ അനുഗമിക്കുന്നതിൽനിന്നുള്ള വിശ്വാസത്യാഗമാണ് അർഥം.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: നീയോ നിന്റെ പുത്രന്മാരോ
  rationale: രാജവംശീയ സന്ദർഭത്തിൽ ശലോമോനെയോ അവന്റെ പുരുഷസന്തതിയെയോ ബാധിക്കുന്ന നിബന്ധനാപരമായ മുന്നറിയിപ്പ് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ കൂട്ടിച്ചേർക്കൽരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מֵאַחֲרַי
  choice: എന്നെ അനുഗമിക്കുന്നതിൽനിന്ന്
  rationale: ‘എന്റെ പിന്നാലെനിന്ന്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ഉടമ്പടിബന്ധത്തിലുള്ള അനുഗമനം അവസാനിപ്പിക്കുന്നതിനെ ഈ സ്വാഭാവിക മലയാളപ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: പാലിക്കാതിരിക്കുകയും
  rationale: കല്പനകളുമായി ബന്ധപ്പെട്ട שׁמר എന്ന ക്രിയയുടെ നിയമ-ഉടമ്പടി അർഥം ‘പാലിക്കുക’ കൃത്യമായി നൽകുന്നു.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: എന്റെ കല്പനകളും ചട്ടങ്ങളും
  rationale: രണ്ട് വ്യത്യസ്ത നിയമപദങ്ങൾ തമ്മിലുള്ള വേർതിരിവ് നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പദങ്ങളാണ് ഇവ.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: ഞാൻ നിങ്ങളുടെ മുമ്പിൽ വെച്ചിരിക്കുന്ന
  rationale: נתן + לפני എന്ന പ്രയോഗത്തിന്റെ ‘മുമ്പിൽ വെക്കുക’ എന്ന ആശയം സ്വാഭാവികമായി പകരുന്നു. പ്രവൃത്തിയുടെ നിലവിലുള്ള പ്രസക്തി മലയാളത്തിലെ ‘വെച്ചിരിക്കുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: וַהֲלַכְתֶּם
  choice: ചെന്ന്
  rationale: തുടർന്നുള്ള വിഗ്രഹാരാധനാപ്രവൃത്തികൾക്ക് തുടക്കം കുറിക്കുന്ന הלך എന്ന ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ സേവിച്ച്
  rationale: עבד എന്നതിന്റെ ‘സേവിക്കുക’ എന്ന അർഥം നിലനിർത്തി, തുടർന്നുള്ള നമസ്കാരക്രിയയുമായി ലയിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: അവരെ നമസ്കരിക്കുകയും
  rationale: ശരീരം കുനിച്ചുള്ള ആദരവോ ആരാധനയോ സൂചിപ്പിക്കുന്ന השתחוה എന്ന ക്രിയയുടെ ദൃശ്യഭാവം ‘നമസ്കരിക്കുക’ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ രാജവംശീയ വ്യാപ്തി
  choice: ‘നീയോ നിന്റെ പുത്രന്മാരോ’ എന്നു നൽകി, മുന്നറിയിപ്പ് ശലോമോനെയോ അവന്റെ രാജവംശത്തിലെ പുത്രന്മാരെയോ ബാധിക്കുന്നതായി പ്രകടമാക്കി.
  alternative: ‘നിങ്ങളും നിങ്ങളുടെ പുത്രന്മാരും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന.
  rationale: സന്ദർഭത്തിൽ ദൈവം ശലോമോനോടു ദാവീദിന്റെ രാജവംശത്തെയും ആലയത്തെയും കുറിച്ചാണ് സംസാരിക്കുന്നത്. അതിനാൽ പൊതുജനത്തെയല്ല, ശലോമോനെയും അവന്റെ വംശപരമ്പരയെയും ലക്ഷ്യമിടുന്ന നിബന്ധനാപരമായ മുന്നറിയിപ്പ് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുന്നു; എബ്രായരൂപത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. നിയമ-ഉടമ്പടി പദങ്ങളായ ‘കല്പനകൾ’, ‘ചട്ടങ്ങൾ’, ‘പാലിക്കുക’ എന്നിവ വേർതിരിവോടെ നിലനിർത്തി; വിഗ്രഹാരാധനയുടെ രണ്ട് പ്രവൃത്തികളെ ‘സേവിക്കുക’, ‘നമസ്കരിക്കുക’ എന്നിങ്ങനെ പ്രത്യേകം പ്രകടമാക്കി.
