id: 1KI.9.17
reference: 1 Kings 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֤בֶן שְׁלֹמֹה֙ אֶת גָּ֔זֶר וְ/אֶת בֵּ֥ית חֹרֹ֖ן תַּחְתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/017.yaml
  text: And Solomon built Gezer and Lower Beth-horon,[a]
translation:
  language: ml
  text: ശലോമോൻ ഗേസെരും താഴത്തെ ബേത്ത്-ഹോരോനും[a] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബേത്ത്-ഹോരോൻ—താഴത്തേത്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: Qal wayyiqtol രൂപത്തിലുള്ള בנה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിതു’ എന്നാണ്. രാജകീയ നിർമാണസന്ദർഭത്തിൽ പുനർനിർമാണമോ കോട്ടകെട്ടലോ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, മൂലപാഠം അത് വ്യക്തമായി പറയാത്തതിനാൽ പൊതുവായ അർഥം നിലനിർത്തി.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: גָּזֶר
  choice: ഗേസെർ
  rationale: ഹീബ്രായ സ്ഥലനാമമായ גָּזֶר എന്നതിന്റെ ഉച്ചാരണത്തോട് അടുത്ത, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: താഴത്തെ ബേത്ത്-ഹോരോൻ
  rationale: תַּחְתּוֹן എന്ന വിശേഷണം രണ്ട് ബേത്ത്-ഹോരോൻ പട്ടണങ്ങളിൽ താഴെയുള്ളതിനെ തിരിച്ചറിയിക്കുന്നു. ‘താഴത്തെ ബേത്ത്-ഹോരോൻ’ ആ ഭൂമിശാസ്ത്രപരമായ വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶת / וְאֶת
  choice: പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവ പ്രത്യക്ഷകർമത്തെ അടയാളപ്പെടുത്തുന്ന വ്യാകരണഘടകങ്ങളാണ്; മലയാളവാക്യഘടനയിൽ അവയ്ക്ക് പ്രത്യേക പദം ആവശ്യമില്ല. וְ എന്ന സംയോജകം ‘-ഉം’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു; ‘പണിതു’ എന്ന പൊതുവായ ക്രിയ ഉപയോഗിച്ച് പുനർനിർമാണം, കോട്ടകെട്ടൽ തുടങ്ങിയ മൂലപാഠം വ്യക്തമാക്കാത്ത ആശയങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
