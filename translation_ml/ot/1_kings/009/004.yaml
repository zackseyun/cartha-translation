- source_word: תֵּלֵךְ לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ നടക്കുക
  rationale: ദൈവസന്നിധിയിലെ ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: നിന്റെ പിതാവായ ദാവീദ് എന്റെ സന്നിധിയിൽ നടന്നതുപോലെ
  rationale: ദാവീദിന്റെ ജീവിതനടപ്പുമായുള്ള താരതമ്യവും ആവർത്തിക്കുന്ന 'നടക്കുക' എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: בְּתָם לֵבָב
  choice: ഹൃദയപരമാർഥതയോടെ
  rationale: תָּם സൂചിപ്പിക്കുന്ന ഹൃദയത്തിന്റെ സമഗ്രതയും കാപട്യമില്ലായ്മയും അറിയിക്കുന്നു; പൂർണ പാപരാഹിത്യം ധ്വനിപ്പിക്കുന്നില്ല.
- source_word: וּבְיֹשֶׁר
  choice: നേരോടുംകൂടെ
  rationale: ധാർമികമായ നേർമ്മയും ശരിയായ നടത്തവും ലളിതവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ചു പ്രവർത്തിക്കുക
  rationale: കല്പനകളുടെ സമഗ്രമായ അനുസരണത്തെ സൂചിപ്പിക്കുന്ന כְּכֹל എന്നതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: חֻקַּי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: ഉടമ്പടി-നിയമസന്ദർഭത്തിലെ നിശ്ചിത വ്യവസ്ഥകളെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള מִשְׁפָּטַי എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וּמִשְׁפָּטַי
  choice: എന്റെ ന്യായവിധികൾ
  rationale: നീതിന്യായപരമായ തീരുമാനങ്ങൾ/നിയമനിർദേശങ്ങൾ എന്ന ഹീബ്രു നിയമസൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: תִּשְׁמֹר
  choice: പാലിക്കുക
  rationale: ഉടമ്പടിസന്ദർഭത്തിൽ കല്പനകൾ സൂക്ഷിച്ച് ആചരിക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ മാതൃകയുടെ സ്വഭാവവിവരണം
  choice: ഹൃദയപരമാർഥതയോടും നേരോടുംകൂടെ നടന്നവനായി അവതരിപ്പിക്കുന്നു; പൂർണ പാപരാഹിത്യം സൂചിപ്പിക്കുന്നില്ല.
  alternative: കുറ്റമറ്റ ഹൃദയത്തോടെ എന്നു കൂടുതൽ ശക്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ദാവീദിനെ ഉടമ്പടിയോടുള്ള വിശ്വസ്തതയുടെ മാതൃകയായി അവതരിപ്പിക്കുന്നു; എല്ലാ കാര്യങ്ങളിലും ധാർമികമായി പൂർണനായവനായി പ്രഖ്യാപിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ പ്രശംസ നിലനിർത്തിക്കൊണ്ട് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ഹീബ്രുവിലെ 'എന്റെ സന്നിധിയിൽ നടക്കുക' എന്ന രൂപകം നിലനിർത്തിയിട്ടുണ്ട്. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനയുടെ മുൻഭാഗമായതിനാൽ അവസാനം അർധവിരാമസദൃശമായ കോമ നിലനിർത്തുന്നു.
