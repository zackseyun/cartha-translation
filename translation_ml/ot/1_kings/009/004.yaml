  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: ml
  text: നീയോ, നിന്റെ പിതാവായ ദാവീദ് നടന്നതുപോലെ, ഹൃദയപരമാർഥതയോടും[a] നേർമയോടും എന്റെ സന്നിധിയിൽ നടക്കുകയും, ഞാൻ നിന്നോടു കല്പിച്ചതെല്ലാം അനുസരിച്ചു പ്രവർത്തിക്കുകയും, എന്റെ ചട്ടങ്ങളും ന്യായവിധികളും[b] പാലിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഹൃദയത്തിന്റെ നിഷ്കളങ്കതയോടെ.” ഹീബ്രു പദം ഹൃദയത്തിന്റെ സമഗ്രതയെയോ പരമാർഥതയെയോ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും പൂർണ പാപരാഹിത്യം എന്നല്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ നിയമനിർദേശങ്ങൾ.”
    reason: lexical_alternative
