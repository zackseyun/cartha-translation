id: 1KI.9.18
reference: 1 Kings 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֛ת וְ/אֶת תמר בַּ/מִּדְבָּ֖ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/018.yaml
  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: ml
  text: ബാലാത്തിനെയും ദേശത്തിലെ മരുഭൂമിയിലുള്ള താമാറിനെയും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു പാഠം: ‘താമാർ’; സമാന്തരഭാഗമായ 2 ദിനവൃത്താന്തം 8:4-ൽ ‘തദ്മോർ’ എന്നാണ്.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: -നെയും
  rationale: വְ എന്ന സംയോജനവും אֵת എന്ന നിർദിഷ്ട കർമചിഹ്നവും മലയാളത്തിൽ മുൻവാക്യത്തിലെ ക്രിയയോടു ചേരുന്ന കർമവിഭക്തിയോടുകൂടിയ ‘-നെയും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בַּעֲלָת
  choice: ബാലാത്ത്
  rationale: സ്ഥലനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: וְ/אֶת
  choice: -നെയും
  rationale: പട്ടികയിലെ രണ്ടാമത്തെ നിർദിഷ്ട കർമത്തെയും മുൻപത്തേതിനോട് ഏകോപിപ്പിക്കുന്നതിനായി അതേ കർമവിഭക്തി-സംയോജനരൂപം നിലനിർത്തി.
- source_word: תמר
  choice: താമാർ
  rationale: WLC-യിലെ വ്യഞ്ജനപാഠം תמר ആയതിനാൽ ‘താമാർ’ എന്നു ലിപ്യന്തരിച്ചു; 2 ദിനവൃത്താന്തം 8:4-ലെ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בַּ/מִּדְבָּר
  choice: മരുഭൂമിയിലുള്ള
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശത്തെയോ വിജനപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ ‘മരുഭൂമി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בָּ/אָֽרֶץ
  choice: ദേശത്തിലെ
  rationale: אֶרֶץ എന്നതിന്റെ വിശാലമായ ഭൂവിഭാഗസൂചന നിലനിർത്തിക്കൊണ്ട്, ‘മരുഭൂമി’യെ ഉൾക്കൊള്ളുന്ന സ്ഥലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ നിർമാണക്രിയയുടെ കർമപ്പട്ടിക തുടരുന്നതിനാൽ സ്ഥലനാമങ്ങൾക്ക് കർമവിഭക്തി നൽകി. പാഠവ്യത്യാസക്കുറിപ്പ് ബന്ധപ്പെട്ട ‘താമാർ’ എന്ന പേരിനോടുതന്നെ ചേർത്തു.
