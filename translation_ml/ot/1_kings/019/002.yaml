reference: 1 Kings 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: ml
  text: 'അപ്പോൾ ഈസബെൽ ഏലിയാവിനോട് ഇങ്ങനെ പറയാൻ ഒരു ദൂതനെ അയച്ചു: “നാളെ ഈ സമയത്തിനകം നിന്റെ ജീവനെ അവരിൽ ഒരാളുടെ ജീവനെപ്പോലെ ഞാൻ ആക്കിയില്ലെങ്കിൽ ദേവന്മാർ[a] എന്നോടു ഇതും ഇതിലധികവും ചെയ്യട്ടെ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം എന്നോട് ഇതും ഇതിലധികവും ചെയ്യട്ടെ.” എബ്രായത്തിലെ אֱלֹהִים എന്ന പദം ഏകവചനത്തിൽ ‘ദൈവം’ എന്നും ബഹുവചനത്തിൽ ‘ദേവന്മാർ’ എന്നും വായിക്കാം. ഇവിടെ ഈസബെലിന്റെ പശ്ചാത്തലവും ശപഥത്തിലെ ബഹുവചന ക്രിയകളും ‘ദേവന്മാർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: അപ്പോൾ ... അയച്ചു
  rationale: വയ്യക്ഷോൽ രൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: מַלְאָךְ
  choice: ദൂതൻ
  rationale: രാജസഭാസംബന്ധമായ ഈ സാഹചര്യത്തിൽ മനുഷ്യസന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ദൂതൻ’ യോജിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറയിച്ചു
  rationale: ദൂതൻ മുഖേന നേരിട്ടുള്ള വാക്കുകൾ അറിയിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: ദേവന്മാർ എന്നോടു ഇതും ഇതിലധികവും ചെയ്യട്ടെ
  rationale: ഇത് ശിക്ഷ സ്വയം ഏറ്റുവിളിക്കുന്ന പതിവു ശപഥസൂത്രമാണ്. ‘എന്നോടു’ മൂലപാഠത്തിൽ പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും സൂത്രത്തിന്റെ അർത്ഥത്തിൽ ഉൾക്കൊള്ളുന്നതും മലയാളത്തിൽ ശപഥം മനസ്സിലാകാൻ സഹായിക്കുന്നതുമാണ്.
- source_word: אֱלֹהִים
  choice: ദേവന്മാർ
  rationale: ഈസബെലിന്റെ മതപരമായ പശ്ചാത്തലവും അനുബന്ധ ക്രിയകളുടെ ബഹുവചനരൂപവും ഇവിടെ ബഹുവചനാർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: כִּי
  choice: '...ഇല്ലെങ്കിൽ'
  rationale: ശപഥത്തിലെ വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ നിഷേധവ്യവസ്ഥയായ ‘ഇല്ലെങ്കിൽ’ ഉപയോഗിച്ചു.
- source_word: כָעֵת מָחָר
  choice: നാളെ ഈ സമയത്തിനകം
  rationale: അടുത്ത ദിവസത്തെ ഇതേ സമയത്തെ അന്തിമപരിധിയായി അവതരിപ്പിക്കുന്ന ഭീഷണിയുടെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: നിന്റെ ജീവനെ ... ഞാൻ ആക്കിയില്ലെങ്കിൽ
  rationale: ‘കൊന്നില്ലെങ്കിൽ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, שׂים എന്ന ക്രിയയെയും נֶפֶשׁ എന്ന കർമത്തെയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: נַפְשְׁךָ / כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: നിന്റെ ജീവനെ അവരിൽ ഒരാളുടെ ജീവനെപ്പോലെ
  rationale: נֶפֶשׁ ഇവിടെ അഭൗതികമായ ‘ആത്മാവ്’ എന്നതിലുപരി ജീവൻ/ജീവിതവിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; എബ്രായത്തിലെ ആവർത്തനവും വിവർത്തനത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ഈസബെലിന്റെ ശപഥത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ വചനം
  choice: 'ബഹുവചനം: ‘ദേവന്മാർ’'
  alternative: 'ഏകവചനം: ‘ദൈവം’'
  rationale: אֱלֹהִים ഏകവചനമായോ ബഹുവചനമായോ വായിക്കാവുന്നതാണ്. എന്നാൽ ഈസബെലിന്റെ പശ്ചാത്തലവും יַעֲשׂוּן, יוֹסִפוּן എന്നീ ബഹുവചന ക്രിയകളും ഇവിടെ ബഹുവചന വായനയ്ക്ക് കൂടുതൽ ഭാരം നൽകുന്നു; യഥാർത്ഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ശപഥത്തിന്റെ ശക്തിയും എബ്രായത്തിലെ ‘ജീവൻ’ എന്ന ആവർത്തനവും നിലനിർത്തി; വചനത്തിലെ യഥാർത്ഥ ഏകവചന/ബഹുവചന അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
