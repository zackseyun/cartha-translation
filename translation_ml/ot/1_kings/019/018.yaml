source:
  edition: WLC
  text: וְ/הִשְׁאַרְתִּ֥י בְ/יִשְׂרָאֵ֖ל שִׁבְעַ֣ת אֲלָפִ֑ים כָּל הַ/בִּרְכַּ֗יִם אֲשֶׁ֤ר לֹֽא כָֽרְעוּ֙ לַ/בַּ֔עַל וְ/כָ֨ל הַ/פֶּ֔ה אֲשֶׁ֥ר לֹֽא נָשַׁ֖ק לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേലിൽ ഏഴായിരം പേരെ ഞാൻ ശേഷിപ്പിച്ചിട്ടുണ്ട്[a]—അതായത്, ബാലിന് മുട്ടുമടക്കാത്ത എല്ലാ മുട്ടുകളെയും അവനെ ചുംബിക്കാത്ത എല്ലാ വായുകളെയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിൽ ഏഴായിരം പേരെ ഞാൻ കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘... സംരക്ഷിച്ചുവെച്ചിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ഒരു വിഗ്രഹത്തെ ചുംബിക്കുന്നത് അതിനോടുള്ള ആദരവിന്റെയോ ആരാധനയുടെയോ പ്രവൃത്തിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: എന്നാൽ ... ഞാൻ ശേഷിപ്പിച്ചിട്ടുണ്ട്
  rationale: שׁאר എന്ന ധാതുവിന്റെ ഹിഫീൽ ഒന്നാംപുരുഷ ഏകവചനരൂപം ‘ശേഷിക്കാൻ ഇടയാക്കുക/ശേഷിപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ ഏലിയാവിന്റെ പരാതിക്കുള്ള വിരുദ്ധപ്രതികരണമായി וְ എന്നത് ‘എന്നാൽ’ എന്നും, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കാൻ perfect രൂപം ‘ശേഷിപ്പിച്ചിട്ടുണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്തി. ദൈവത്തിനായുള്ള സംരക്ഷണം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും, ഹീബ്രു വാക്യത്തിൽ പ്രത്യേകമായി ഇല്ലാത്ത ‘എനിക്കായി’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בְיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: സ്ഥാനസൂചകമായ בְ സ്വാഭാവികമായി ‘ഇസ്രായേലിൽ’ എന്നു പരിഭാഷപ്പെടുന്നു.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ഏഴായിരം പേരെ
  rationale: സംഖ്യ ഏഴായിരമാണ്. തുടർന്നുള്ള മുട്ടുകളും വായുകളും മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ കർമസൂചകമായി ‘പേരെ’ ചേർക്കുന്നത് സ്വാഭാവികവും അർത്ഥം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: כָּל הַבִּרְכַּיִם
  choice: എല്ലാ മുട്ടുകളും
  rationale: ആളുകളെ സൂചിപ്പിക്കുന്ന ശരീരാവയവരൂപകം നിലനിർത്തി; ഇതിലൂടെ ആരാധനയ്ക്കായി മുട്ടുമടക്കുക എന്ന ദൃശ്യബിംബവും അടുത്ത സമാന്തരവാക്യവുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: ബാലിന്റെ മുമ്പിൽ മുട്ടുമടക്കാത്ത
  rationale: כרע എന്നത് മുട്ടുകുത്തുക/കുനിയുക എന്നാണ്. മലയാളത്തിലെ ‘മുമ്പിൽ മുട്ടുമടക്കുക’ ആരാധനാപരമായ കീഴടങ്ങലിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; לַבַּעַל ആരാധനയുടെ ലക്ഷ്യം ബാലാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הַבַּעַל
  choice: ബാൽ
  rationale: ഹീബ്രുവിൽ നിർദ്ദേശകപ്രത്യയം ഉണ്ടായിട്ടും, മലയാളത്തിൽ ദേവനാമമായി ‘ബാൽ’ എന്നു നൽകുന്നതാണ് സ്വാഭാവികം.
- source_word: וְכָל הַפֶּה
  choice: എല്ലാ വായുകളും
  rationale: ഹീബ്രുവിലെ ഏകവചന സമാഹാരപ്രയോഗം മലയാളത്തിൽ ബഹുവചനമായി നൽകുന്നത് സ്വാഭാവികമാണ്; ‘മുട്ടുകൾ’ എന്ന ശരീരാവയവരൂപകത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: അവനെ ചുംബിക്കാത്ത
  rationale: נשׁק എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘ചുംബിക്കുക’ ആണ്. לוֹ എന്ന സർവനാമത്തിന്റെ പൂർവപദം ബാൽ ആയതിനാൽ ‘അവനെ’ എന്നു പരിഭാഷപ്പെടുത്തി; വിഗ്രഹത്തെ ചുംബിക്കുന്നതിന്റെ ആരാധനാപരമായ സാംസ്കാരിക അർത്ഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
theological_decisions:
- issue: ശേഷിപ്പിക്കപ്പെട്ട വിശ്വസ്തരെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കാതിരിക്കുക
  choice: ഇസ്രായേലിൽ ഏഴായിരം പേരെ ഞാൻ ശേഷിപ്പിച്ചിട്ടുണ്ട്
  alternative: ഇസ്രായേലിൽ എനിക്കായി ഏഴായിരം പേരെ ഞാൻ കാത്തുസൂക്ഷിച്ചിട്ടുണ്ട്
  rationale: വാക്യം ദൈവം വിശ്വസ്തരെ ശേഷിപ്പിച്ചതായി പറയുന്നു; എന്നാൽ ഹീബ്രു പാഠത്തിൽ തുറന്നുപറയാത്ത ‘ശേഷിപ്പ്’ എന്ന സാങ്കേതിക ദൈവശാസ്ത്രപദമോ ‘എനിക്കായി’ എന്ന ഘടകമോ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. ‘ശേഷിപ്പിച്ചിട്ടുണ്ട്’ ദൈവത്തിന്റെ പ്രവർത്തനവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുട്ടുകൾ/വായുകൾ’ എന്ന ഹീബ്രു ശരീരാവയവരൂപകം നിലനിർത്തിയിട്ടുണ്ട്. മുഖ്യപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ [a], [b] ആയി ചേർത്തിരിക്കുന്നു.
