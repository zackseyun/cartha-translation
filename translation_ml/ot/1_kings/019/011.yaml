  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “പുറത്തേക്കു ചെന്നു പർവതത്തിൽ യഹ്‌വെയുടെ മുമ്പാകെ നിൽക്കുക.” അപ്പോൾ ഇതാ, യഹ്‌വെ കടന്നുപോകുകയായിരുന്നു. യഹ്‌വെയുടെ മുമ്പിൽ പർവതങ്ങളെ പിളർക്കുകയും പാറകളെ തകർക്കുകയും ചെയ്യുന്ന വലുതും ശക്തവുമായ ഒരു കാറ്റ് ഉണ്ടായി; എന്നാൽ യഹ്‌വെ കാറ്റിൽ ഉണ്ടായിരുന്നില്ല[a]. കാറ്റിനു ശേഷം ഒരു ഭൂകമ്പം ഉണ്ടായി; എന്നാൽ യഹ്‌വെ ഭൂകമ്പത്തിൽ ഉണ്ടായിരുന്നില്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെ കാറ്റിൽ ഉണ്ടായിരുന്നില്ല.” അവൻ അതിൽ വെളിപ്പെട്ടില്ല എന്ന ആശയം ഇതിൽ സൂചിപ്പിക്കപ്പെട്ടേക്കാം; എന്നാൽ പരിഭാഷ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പ്രയോഗം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെ ഭൂകമ്പത്തിൽ ഉണ്ടായിരുന്നില്ല.” ഈ സംഭവം യഹ്‌വെയുടെ പരമാധികാരത്തിനു പുറത്തായിരുന്നുവെന്ന് പാഠം പറയുന്നില്ല; ആഖ്യാനം പ്രകടിപ്പിക്കുന്ന അർഥത്തിൽ അവൻ അതിൽ ഉണ്ടായിരുന്നില്ല എന്നാണ് പ്രസ്താവിക്കുന്നത്.'
    reason: theological_tension
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവിക നാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: צֵא וְעָמַדְתָּ
  choice: പുറത്തേക്കു ചെന്നു ... നിൽക്കുക
  rationale: ആശ്രയസ്ഥലത്തുനിന്നു പുറത്തേക്കുള്ള ചലനവും തുടർന്ന് നിൽക്കാനുള്ള കല്പനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ മുമ്പാകെ / യഹ്‌വെയുടെ മുമ്പിൽ
  rationale: സ്ഥാനപരവും സാന്നിധ്യസൂചകവുമായ എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: വിവരണത്തിലെ നാടകീയമായ ഉടൻശ്രദ്ധ ക്ഷണിക്കൽ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֹבֵר
  choice: കടന്നുപോകുകയായിരുന്നു
  rationale: കൃതന്തത്തിന്റെ പുരോഗമനപരമായ ദൃശ്യഭാവം നിലനിർത്തുന്നു; അത് പൂർത്തിയായ ഭൂതകാലമോ വെറും ഭാവിയോ ആയി ചുരുക്കുന്നില്ല.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: വലുതും ശക്തവുമായ ഒരു കാറ്റ്
  rationale: സന്ദർഭത്തിലെ ഭൗതിക പ്രതിഭാസത്തിന് ‘കാറ്റ്’ യോജിക്കുന്നു; രണ്ട് വിശേഷണങ്ങളുടെയും ഊന്നൽ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: പർവതങ്ങളെ പിളർക്കുകയും പാറകളെ തകർക്കുകയും ചെയ്യുന്ന
  rationale: തുടർച്ചയായ, പ്രബലമായ പ്രവർത്തനത്തെ സമാന്തരമായ മലയാള ക്രിയാപ്രയോഗങ്ങളിലൂടെ സജീവമായി അവതരിപ്പിക്കുന്നു.
- source_word: רַעַשׁ
  choice: ഭൂകമ്പം
  rationale: ഈ പ്രകൃതിപ്രതിഭാസങ്ങളുടെ ക്രമത്തിൽ ‘ഭൂകമ്പം’ എന്ന അർഥം സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവിക നാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ നേരിട്ട് വരുന്ന വ്യക്തിനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യഹ്‌വെ കാറ്റിലും ഭൂകമ്പത്തിലും ‘ഉണ്ടായിരുന്നില്ല’ എന്ന പ്രസ്താവന
  choice: സ്ഥാനസൂചകമായ ‘ൽ ഉണ്ടായിരുന്നില്ല’ എന്ന പ്രയോഗം നിലനിർത്തുക
  alternative: യഹ്‌വെ കാറ്റിലൂടെയോ ഭൂകമ്പത്തിലൂടെയോ വെളിപ്പെട്ടില്ല
  rationale: എബ്രായപാഠം പ്രതിഭാസങ്ങളിൽ യഹ്‌വെ ‘ഇല്ലായിരുന്നു’ എന്നു മാത്രം പറയുന്നു. അത് ദൈവിക വെളിപ്പാടിനെക്കുറിച്ചോ പ്രവർത്തനത്തെക്കുറിച്ചോ ഉള്ള സമ്പൂർണ സിദ്ധാന്തമായി വികസിപ്പിക്കാതെ ആഖ്യാനത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക ഘടകത്തെ നിലനിർത്തുന്നു. അതേസമയം അപൂർവമായ പഴഞ്ചൊല്ലുകളോ വിഭാഗീയ ദൈവശാസ്ത്ര പദപ്രയോഗങ്ങളോ ഒഴിവാക്കിയിരിക്കുന്നു.
