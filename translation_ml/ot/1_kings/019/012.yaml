source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: ml
  text: ഭൂകമ്പത്തിനുശേഷം തീ വന്നു; യഹ്‌വെ തീയിലുണ്ടായിരുന്നില്ല. തീയ്ക്കുശേഷം നേർത്ത നിശ്ശബ്ദതയുടെ ഒരു ശബ്ദം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൃദുവായ ഒരു മന്ത്രണം,’ ‘നേർത്ത ഒരു മർമരം,’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘മന്ദമായ ഒരു ചെറുസ്വരം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘നേർത്ത നിശ്ശബ്ദതയുടെ ഒരു ശബ്ദം/സ്വരം’ എന്നാണ്; ഇത് മനപ്പൂർവം സൂക്ഷ്മവും ദുഷ്കരവുമായ ഒരു പ്രയോഗമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר הָרַעַשׁ
  choice: ഭൂകമ്പത്തിനുശേഷം
  rationale: തുടർച്ചയായ സംഭവക്രമം വ്യക്തമാക്കുകയും רַעַשׁ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ‘ഭൂകമ്പം’ എന്ന സ്വാഭാവിക അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: אֵשׁ
  choice: തീ വന്നു
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്ത നാമവാക്യം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ ‘വന്നു’ ചേർത്തു; പുതിയ പ്രതിഭാസമായി തീയെ അവതരിപ്പിക്കുന്നു.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: യഹ്‌വെ തീയിലുണ്ടായിരുന്നില്ല
  rationale: ב എന്ന സ്ഥലസൂചകത്തിന്റെ ലളിതമായ അർഥം നിലനിർത്തി; ദൈവസാന്നിധ്യത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: קוֹל
  choice: ഒരു ശബ്ദം
  rationale: ‘ശബ്ദം’ എന്നു നൽകുന്നത് ‘സ്വരം’ അഥവാ സംസാരമെന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ പദത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: דְּמָמָה דַקָּה
  choice: നേർത്ത നിശ്ശബ്ദത
  rationale: ‘നിശ്ശബ്ദത’യും ‘നേർത്ത’തും ചേർന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ മനപ്പൂർവമായ സൂക്ഷ്മതയും വൈരുധ്യഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് സ്ഥാനപ്പേരായി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: קוֹל דְּמָמָה דַקָּה എന്ന ദുഷ്കരമായ പ്രയോഗം
  choice: നേർത്ത നിശ്ശബ്ദതയുടെ ഒരു ശബ്ദം
  alternative: മൃദുവായ ഒരു മന്ത്രണം
  rationale: ഹീബ്രുവിലെ ‘ശബ്ദം/നിശ്ശബ്ദത’ എന്ന സംഘർഷവും דַקָּה എന്നതിന്റെ ‘നേർത്ത, സൂക്ഷ്മമായ’ അർഥവും പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു; അത് വ്യക്തമായ സംസാരമോ മന്ത്രണമോ ആണെന്ന് തീർപ്പാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അവസാനത്തെ ഹീബ്രു പ്രയോഗത്തിന്റെ അസാധാരണത പൂർണമായി മിനുക്കിക്കളയാതെ നിലനിർത്തിയിരിക്കുന്നു; മലയാളവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘വന്നു,’ ‘കേട്ടു’ എന്നീ ക്രിയകൾ ചേർത്തു.
