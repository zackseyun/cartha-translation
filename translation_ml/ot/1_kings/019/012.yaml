- from: ഭൂകമ്പത്തിനുശേഷം തീ വന്നു; എന്നാൽ യഹ്‌വെ തീയിലുണ്ടായിരുന്നില്ല. തീയ്ക്കുശേഷം നേർത്ത നിശ്ശബ്ദതയുടെ ഒരു ശബ്ദം കേട്ടു.[a]
  to: ഭൂകമ്പത്തിനുശേഷം തീ വന്നു; യഹ്‌വെ തീയിലുണ്ടായിരുന്നില്ല. തീയ്ക്കുശേഷം നേർത്ത നിശ്ശബ്ദതയുടെ ഒരു ശബ്ദം.[a]
