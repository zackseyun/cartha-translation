base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: ml
  text: 'ഏലീയാവ് അതു കേട്ടപ്പോൾ[a], തന്റെ മേലങ്കികൊണ്ട് മുഖം മൂടി പുറത്തേക്കു ചെന്ന് ഗുഹയുടെ പ്രവേശനകവാടത്തിൽ നിന്നു. അപ്പോൾ ഇതാ, ഒരു ശബ്ദം അവനോടു പറഞ്ഞു: “ഏലീയാവേ, നീ ഇവിടെ എന്തു ചെയ്യുന്നു?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതു’ എന്ന കർമം ഹീബ്രായയിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; തൊട്ടുമുമ്പ് വിവരിച്ച ശബ്ദത്തെയോ സ്വരത്തെയോ സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ഇവിടെ നിനക്ക് എന്തു കാര്യം?” ഈ ഹീബ്രായ പ്രയോഗം ഈ സ്ഥലത്ത് ഏലീയാവിന്റെ കാര്യമോ ഉദ്ദേശ്യമോ എന്താണെന്നു ചോദിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כ ചേർന്ന infinitive construct ഒരു കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘കേട്ടപ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: തന്റെ മേലങ്കികൊണ്ട് മുഖം മൂടി
  rationale: ക്രിയയുടെ പൊതിയുക/മൂടുക എന്ന അർഥവും בְּ എന്ന ഉപകരണപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. אַדֶּרֶת ഇവിടെ പുറമേ ധരിക്കുന്ന വസ്ത്രമാണ്.
- source_word: וַיֵּצֵא
  choice: പുറത്തേക്കു ചെന്ന്
  rationale: ഗുഹയുടെ അകത്തുനിന്നുള്ള പുറത്തേക്കുള്ള നീക്കം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: ഒരു സ്ഥാനത്ത് നിലയുറപ്പിച്ചതിനെ ലളിതമായ ആഖ്യാനഭാഷയിൽ നൽകുന്നു.
- source_word: פֶּתַח הַמְּעָרָה
  choice: ഗുഹയുടെ പ്രവേശനകവാടം
  rationale: פֶּתַח എന്നതിന്റെ opening/entrance അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: הִנֵּה നൽകുന്ന സജീവമായ ശ്രദ്ധാകർഷണപ്രഭാവം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പെട്ടെന്ന്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: אֵלָיו קוֹל וַיֹּאמֶר
  choice: ഒരു ശബ്ദം അവനോടു പറഞ്ഞു
  rationale: വാക്യത്തിലെ ക്രിയാരഹിതമായ ‘അവനോട് ഒരു ശബ്ദം’ എന്ന ഘടനയും തുടർന്നുള്ള ‘അതു പറഞ്ഞു’ എന്ന ആശയവും വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാളത്തിൽ ഏകീകരിക്കുന്നു.
- source_word: מַה לְּךָ פֹה
  choice: നീ ഇവിടെ എന്തു ചെയ്യുന്നു?
  rationale: ആ സ്ഥലത്ത് ഏലീയാവിന്റെ കാര്യമോ ഉദ്ദേശ്യമോ എന്താണെന്ന് ചോദിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളസമാനതയാണ്; ‘എന്തുകൊണ്ട്’ എന്നു മാത്രം പറഞ്ഞ് ഉദ്ദേശ്യത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: אֵלִיָּהוּ
  choice: ഏലീയാവ് / ഏലീയാവേ
  rationale: മലയാള ബൈബിൾപരിചയത്തിലുള്ള പേരുരൂപം ഉപയോഗിക്കുന്നു; നേരിട്ടുള്ള സംബോധനത്തിൽ ‘ഏലീയാവേ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: ‘കേട്ടപ്പോൾ’ എന്നതിനുശേഷമുള്ള പരോക്ഷ കർമം
  choice: അതു കേട്ടപ്പോൾ
  alternative: ശബ്ദം കേട്ടപ്പോൾ / സ്വരം കേട്ടപ്പോൾ
  rationale: ഈ വാക്യത്തിൽ ഹീബ്രായ പാഠം കർമം തുറന്നുപറയുന്നില്ല. മുൻസന്ദർഭത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ ഉപയോഗിക്കുന്നത് എന്താണ് കേട്ടതെന്നത് ശബ്ദമോ സ്വരമോ എന്ന് അതിരുകടന്ന് നിർണ്ണയിക്കാതെ ആഖ്യാനത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: מַה לְּךָ פֹה എന്ന ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: നീ ഇവിടെ എന്തു ചെയ്യുന്നു?
  alternative: നീ എന്തുകൊണ്ട് ഇവിടെയുണ്ട്? / ഇവിടെ നിനക്ക് എന്തു കാര്യം?
  rationale: ഈ പ്രയോഗം കാരണമാത്രമല്ല, ഈ സ്ഥലത്തെ ഏലീയാവിന്റെ കാര്യം, ഉദ്ദേശ്യം, സാന്നിധ്യം എന്നിവയെക്കുറിച്ചും ചോദിക്കാം. തിരഞ്ഞെടുത്ത രൂപം ആ വിശാലത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘മേലങ്കി’, ‘പ്രവേശനകവാടം’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ദൃശ്യവിവരം കാത്തുസൂക്ഷിക്കുന്നതുമാണ്. ശ്രദ്ധാകർഷകമായ הִנֵּהയ്ക്ക് ‘അപ്പോൾ ഇതാ’ നൽകി ആഖ്യാനത്തിന്റെ സജീവത നിലനിർത്തി.
