  terminology: ‘ഏലീയാവ്/ഏലീയാവേ’ follows established Malayalam biblical name usage. ‘മേലങ്കി’ is a natural, non-interpretive rendering for אַדֶּרֶת. The footnotes use accurate terminology and are attached to the appropriate Malayalam phrases.
