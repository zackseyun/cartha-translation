  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: ml
  text: 'യാഹ്‌വെ അവനോടു പറഞ്ഞു: “പോകുക; നിന്റെ വഴിയേ ദമസ്കൊസിന്റെ മരുഭൂമിയിലേക്കു[a] മടങ്ങുക. അവിടെ എത്തുമ്പോൾ ഹസായേലിനെ അരാമിനു[b] രാജാവായി അഭിഷേകം ചെയ്യുക.”


    [a] അഥവാ, ‘ദമസ്കൊസിന്റെ മരുഭൂമിയുടെ ദിശയിലേക്കു.’ ‘മരുഭൂമി’ എന്ന എബ്രായപദത്തിന് ദിശ സൂചിപ്പിക്കുന്ന പ്രത്യയം ചേർന്നിരിക്കുന്നു.

    [b] ‘അരാം’ എന്ന എബ്രായനാമം പലപ്പോഴും ‘സിറിയ’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദമസ്കൊസിന്റെ മരുഭൂമിയുടെ ദിശയിലേക്കു.’ ‘മരുഭൂമി’ എന്ന എബ്രായപദത്തിന് ദിശ സൂചിപ്പിക്കുന്ന പ്രത്യയം ചേർന്നിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അരാം’ എന്ന എബ്രായനാമം പലപ്പോഴും ‘സിറിയ’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, എബ്രായ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לֵךְ שׁוּב
  choice: പോകുക; ... മടങ്ങുക
  rationale: എബ്രായത്തിലെ രണ്ടു ആജ്ഞാരൂപങ്ങളും വേർതിരിച്ചു നിലനിർത്തുന്നു; മലയാളത്തിൽ നിർദേശത്തിന്റെ ഗൗരവവും സ്വാഭാവികതയും കാക്കുന്നു.
- source_word: לְדַרְכְּךָ
  choice: നിന്റെ വഴിയേ
  rationale: ‘നിന്റെ വഴി’ എന്ന എബ്രായ പ്രയോഗം ചുരുക്കുകയോ വ്യക്തമല്ലാത്ത വിവരങ്ങൾ ചേർക്കുകയോ ചെയ്യാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: ദമസ്കൊസിന്റെ മരുഭൂമിയിലേക്കു
  rationale: ‘മരുഭൂമി’ എന്ന പദത്തിലെ ദിശാസൂചക പ്രത്യയം ലക്ഷ്യത്തിലേക്കുള്ള ചലനമായി പരിഭാഷപ്പെടുത്തി; ‘ദിശയിലേക്കു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וּבָאתָ
  choice: അവിടെ എത്തുമ്പോൾ
  rationale: അക്ഷരാർഥമായ ‘നീ വരും’ എന്നതിന്റെ സന്ദർഭപരമായ ക്രമസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּמָשַׁחְתָּ
  choice: അഭിഷേകം ചെയ്യുക
  rationale: സംയോജകത്തോടെ വന്ന പൂർണക്രിയ മുൻ ആജ്ഞയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ ആജ്ഞാരൂപമായി നൽകി.
- source_word: חֲזָאֵל
  choice: ഹസായേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തെ മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: അരാമിനു രാജാവായി
  rationale: രാജനിയമനത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘സിറിയ’ എന്ന പിൽക്കാല പരമ്പരാഗത സമാനപദത്തിനു പകരം എബ്രായ സ്ഥലനാമം നിലനിർത്തുകയും ചെയ്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമംകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ എന്ന പരമ്പരാഗത സംയുക്ത ഉച്ചാരണത്തിൽനിന്നും വേർതിരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു ആജ്ഞകൾ നിലനിർത്തി; അനാവശ്യമായ വ്യാഖ്യാനവിവരങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ ശരിയായ സ്ഥാനത്ത് ചേർത്തിരിക്കുന്നു.
