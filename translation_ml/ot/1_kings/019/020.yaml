source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב אֶת הַ/בָּקָ֗ר וַ/יָּ֨רָץ֙ אַחֲרֵ֣י אֵֽלִיָּ֔הוּ וַ/יֹּ֗אמֶר אֶשְּׁקָה נָּא֙ לְ/אָבִ֣/י וּ/לְ/אִמִּ֔/י וְ/אֵלְכָ֖ה אַחֲרֶ֑י/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ שׁ֔וּב כִּ֥י מֶה עָשִׂ֖יתִי לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ കാളകളെ വിട്ട് ഏലിയാവിന്റെ പിന്നാലെ ഓടി ചെന്നു പറഞ്ഞു[a]: “എന്റെ അപ്പനെയും അമ്മയെയും ചുംബിക്കാൻ ദയവായി എന്നെ അനുവദിക്കണമേ; അതിനുശേഷം ഞാൻ അങ്ങയുടെ പിന്നാലെ വരാം.” ഏലിയാവ് അവനോട് പറഞ്ഞു: “തിരിച്ചുപോകുക[b]; ഞാൻ നിന്നോട് എന്താണ് ചെയ്തിരിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പൊതുവായി: “എന്റെ അപ്പനോടും അമ്മയോടും യാത്രപറയാൻ ദയവായി എന്നെ അനുവദിക്കണമേ.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “ചുംബിക്കുക” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ഏലിയാവിന്റെ ഈ മറുപടി ദുഷ്കരമാണ്. “തിരിച്ചുപോകുക; ഞാൻ നിനക്കുവേണ്ടി എന്താണ് ചെയ്തിരിക്കുന്നത്?” എന്നോ, തീരുമാനം എലീശയ്ക്കുതന്നെ വിട്ടുകൊടുക്കുന്ന ഒരു അപൂർണപ്രയോഗമായോ ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב אֶת־הַבָּקָר
  choice: അവൻ കാളകളെ വിട്ട്
  rationale: עזב എന്നത് ഇവിടെ ‘വിടുക’ എന്ന സ്വാഭാവിക അർഥത്തിലാണ്; ഉഴവിനുപയോഗിച്ച മൃഗങ്ങളായതിനാൽ בקר എന്നതിന് ‘കാളകൾ’ യോജിക്കുന്നു.
- source_word: וַיָּרָץ אַחֲרֵי אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ പിന്നാലെ ഓടിച്ചെന്ന്
  rationale: ചലനവും പിന്തുടരലും വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אֶשְּׁקָה נָּא
  choice: ചുംബിച്ച് യാത്രപറയാൻ ദയവായി എന്നെ അനുവദിക്കണമേ
  rationale: נשק എന്നതിന്റെ മൂർത്തമായ ‘ചുംബിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും സന്ദർഭത്തിലെ വിടപറയൽഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; נָא വിനയപൂർവമായ അപേക്ഷയായി പ്രതിഫലിക്കുന്നു.
- source_word: לְאָבִי וּלְאִמִּי
  choice: എന്റെ അപ്പനെയും അമ്മയെയും
  rationale: എബ്രായം ഇരുവരെയും പ്രത്യേകം പറയുന്നതിനാൽ ‘മാതാപിതാക്കൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: അതിനുശേഷം ഞാൻ അങ്ങയുടെ പിന്നാലെ വരാം
  rationale: הלך אחרי എന്നതിലെ പിന്നാലെ ചെല്ലുന്ന ആശയം നിലനിർത്തുന്നു; ആദരസൂചകമായ ‘അങ്ങയുടെ’ സംഭാഷണത്തിന് യോജിക്കുന്നു.
- source_word: לֵךְ שׁוּב
  choice: പോയി മടങ്ങിവരിക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളുടെയും സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു; ‘തിരിച്ചുപോകുക’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാചകത്തെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: ഞാൻ നിന്നോട് എന്താണ് ചെയ്തിരിക്കുന്നത്?
  rationale: ദുഷ്കരവും സന്ദിഗ്ധവുമായ എബ്രായചോദ്യം വ്യാഖ്യാനിച്ചു തീർപ്പാക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ മറുപടിയായ כִּי מֶה עָשִׂיתִי לָךְ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ‘ഞാൻ നിന്നോട് എന്താണ് ചെയ്തിരിക്കുന്നത്?’ എന്ന നേരിട്ടുള്ള ചോദ്യം നിലനിർത്തി.
  alternative: ‘ഞാൻ നിനക്കുവേണ്ടി എന്താണ് ചെയ്തിരിക്കുന്നത്?’ അല്ലെങ്കിൽ തീരുമാനമെടുക്കുന്നത് എലീശയ്ക്കുതന്നെ വിട്ടുകൊടുക്കുന്ന അപൂർണപ്രയോഗം.
  rationale: ഈ വാക്യം അനുമതി, ശാസന, അഥവാ ഏലിയാവ് ചെയ്ത പ്രവൃത്തിയെ ഓർമിപ്പിക്കൽ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കപ്പെട്ടിട്ടുണ്ട്. മുഖ്യപാഠം ഒരു വ്യാഖ്യാനം മാത്രം തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ സംഘർഷം നീക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. സംഭാഷണത്തിൽ എലീശ ഏലിയാവിനെ ‘അങ്ങ്’ എന്നു ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നു; ഏലിയാവ് അവനോട് ‘നീ’ ഉപയോഗിക്കുന്നു. എബ്രായത്തിലെ ദുഷ്കരമായ അവസാനവാചകത്തിന്റെ സന്ദിഗ്ധത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
