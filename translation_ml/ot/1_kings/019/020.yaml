  to: 'അപ്പോൾ അവൻ കാളകളെ വിട്ട് ഏലിയാവിന്റെ പിന്നാലെ ഓടി ചെന്നു പറഞ്ഞു[a]: “എന്റെ അപ്പനെയും അമ്മയെയും ചുംബിക്കാൻ ദയവായി എന്നെ അനുവദിക്കണമേ; അതിനുശേഷം ഞാൻ അങ്ങയുടെ പിന്നാലെ വരാം.” ഏലിയാവ് അവനോട് പറഞ്ഞു: “തിരിച്ചുപോകുക[b]; ഞാൻ നിന്നോട് എന്താണ് ചെയ്തിരിക്കുന്നത്?”'
