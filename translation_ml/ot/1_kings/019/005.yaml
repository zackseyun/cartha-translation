  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: ml
  text: പിന്നെ അവൻ ഒരു ചൂൽച്ചെടിയുടെ കീഴിൽ കിടന്നുറങ്ങി. അതാ, ഒരു മാലാഖ[a] അവനെ തൊട്ട് അവനോട്, “എഴുന്നേറ്റ് ഭക്ഷിക്കൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സന്ദേശവാഹകൻ.” എബ്രായപദമായ מַלְאָךְ മനുഷ്യനായ ഒരു സന്ദേശവാഹകനെയോ ഒരു മാലാഖയെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം “മാലാഖ” എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: കിടന്നുറങ്ങി
  rationale: തുടർച്ചയായ രണ്ടു ക്രിയകളായ ‘കിടന്നു’, ‘ഉറങ്ങി’ എന്നിവയുടെ അർഥം സ്വാഭാവികമായ മലയാള സംയുക്തക്രിയയിൽ നിലനിർത്തുന്നു.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: ഒരു ചൂൽക്കുറ്റിച്ചെടിയുടെ കീഴിൽ
  rationale: רֹתֶם മരുഭൂമിയിൽ വളരുന്ന broom shrub-നെ സൂചിപ്പിക്കുന്നു; ‘കുറ്റിച്ചെടി’ സസ്യത്തിന്റെ രൂപം വ്യക്തമാക്കുകയും אֶחָד ഇവിടെ അനിശ്ചിത ഏകവചനമായി ‘ഒരു’ എന്നു വരികയും ചെയ്യുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പുതിയതും അപ്രതീക്ഷിതവുമായ സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ ആഖ്യാനചിഹ്നത്തിന്റെ സജീവത ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: מַלְאָךְ
  choice: മാലാഖ
  rationale: പദത്തിന് മനുഷ്യസന്ദേശവാഹകനെയോ സ്വർഗീയദൂതനെയോ സൂചിപ്പിക്കാം; തുടർന്നുള്ള അത്ഭുതകരമായ പരിപാലനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവിടെ സ്വർഗീയ ജീവിയാണ് കൂടുതൽ സാധ്യതയുള്ളത്. മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: נֹגֵעַ בּוֹ
  choice: അവനെ തൊട്ട്
  rationale: നגע എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം ആഖ്യാനമലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രവർത്തിയായി നൽകുന്നു.
- source_word: וַיֹּאמֶר לוֹ
  choice: അവനോട് … എന്നു പറഞ്ഞു
  rationale: എബ്രായത്തിലെ പരോക്ഷ കർമസർവനാമം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള സംഭാഷണഘടന.
- source_word: קוּם אֱכֹל
  choice: എഴുന്നേറ്റ് ഭക്ഷിക്കൂ
  rationale: രണ്ട് ഹ്രസ്വ ആജ്ഞകളുടെയും നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു; ‘ഭക്ഷിക്കൂ’ ആധുനികവും മാന്യവുമായ പ്രയോഗമാണ്.
theological_decisions:
- issue: מַלְאָךְ എന്നത് ‘മാലാഖ’ എന്നോ ‘സന്ദേശവാഹകൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മാലാഖ
  alternative: സന്ദേശവാഹകൻ / ദൂതൻ
  rationale: പദം സ്വതവേ രണ്ടർഥവും അനുവദിക്കുന്നുവെങ്കിലും, ഈ സന്ദർഭത്തിലെ അതിമാനുഷിക സന്ദർശനവും തുടർന്നുള്ള പരിപാലനവും ‘മാലാഖ’ എന്ന അർഥത്തെ അനുകൂലിക്കുന്നു. എങ്കിലും യഥാർഥ ശബ്ദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ എന്നത് ഹിന്നേഹിന്റെ ശ്രദ്ധാകർഷകശക്തി നിലനിർത്തുന്നു; സംഭാഷണം ചുരുക്കവും നേരിട്ടതുമാണ്.
