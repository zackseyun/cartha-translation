  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: ml
  text: 'അവിടെ അവൻ ആ ഗുഹയിലേക്കു വന്നു; അവിടെ രാത്രി കഴിച്ചു. ഇതാ, യഹോവയുടെ വചനം അവന്റെ അടുക്കൽ വന്നു; അവനോടു പറഞ്ഞു: “ഏലിയാവേ, നീ ഇവിടെ എന്തു ചെയ്യുന്നു?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഏലിയാവേ, നീ ഇവിടെ എന്തിനാണ്?” ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം: “ഏലിയാവേ, നിനക്ക് ഇവിടെ എന്ത്?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: അവിടെ അവൻ ആ ഗുഹയ്ക്കരികിൽ എത്തി
  rationale: בוא എന്ന ചലനക്രിയയും אֶל എന്ന ദിശാസൂചകവും ചേർന്ന പ്രയോഗം ഗുഹയിലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു; ‘ഗുഹയ്ക്കരികിൽ എത്തി’ എന്നത് അകത്തു പ്രവേശിച്ചു എന്ന് മൂലപാഠത്തേക്കാൾ കൂടുതലായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നു. നിർദ്ദിഷ്ടാർഥമുള്ള הַ എന്ന ഘടകം ‘ആ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיָּלֶן שָׁם
  choice: അവിടെ രാത്രി കഴിച്ചു
  rationale: לון/לין എന്ന ക്രിയയുടെ ‘രാത്രി പാർക്കുക/കഴിക്കുക’ എന്ന കാലപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ
  rationale: הִנֵּה നൽകുന്ന പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണവും ആഖ്യാനത്തിലെ സജീവതയും ‘ഇതാ’ നിലനിർത്തുന്നു; ‘അപ്പോൾ’ മലയാളത്തിലെ വാക്യബന്ധം സുഗമമാക്കുന്നു.
- source_word: דְבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: പ്രവാചകീയ വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ ദൈവിക സന്ദേശഭാരം ‘അരുളപ്പാട്’ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വഹിക്കുന്നു; ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ദൈവത്തിന്റെ വ്യക്തിനാമമായി മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: מַה לְּךָ פֹה
  choice: നീ ഇവിടെ എന്തു ചെയ്യുന്നു?
  rationale: അക്ഷരാർഥത്തിൽ ‘നിനക്ക് ഇവിടെ എന്ത്?’ എന്ന ഹീബ്രു ശൈലി സാഹചര്യത്തിൽ ഏലിയാവിന്റെ ഇവിടെ ഉണ്ടായിരിപ്പിനെ ചോദ്യം ചെയ്യുന്ന അന്വേഷണമാണ്. മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യപ്രയോഗം തെരഞ്ഞെടുത്തു; കാരണമാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം ഉപയോഗിക്കുന്നു; സംബോധനയിൽ ‘ഏലിയാവേ’ ആകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള ടെട്രാഗ്രാമറ്റൺ ഒരു പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി നൽകുന്നു. ‘യഹോവ’ മലയാളവായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണമാണ്; എങ്കിലും ഉച്ചാരണപുനർനിർമാണമായി ‘യാഹ്‌വെ’ എന്ന രൂപവും നിലവിലുണ്ട്.
- issue: דְבַר יְהוָה എന്ന വെളിപ്പാടുസൂത്രം
  choice: യഹോവയുടെ അരുളപ്പാട് അവന് ഉണ്ടായി
  alternative: യഹോവയുടെ വചനം അവന്റെ അടുക്കൽ വന്നു; യഹോവയിൽനിന്ന് ഒരു സന്ദേശം അവന് ലഭിച്ചു
  rationale: ഹീബ്രുവിലെ സ്ഥിരമായ പ്രവാചകീയ സൂത്രത്തിന്റെ ദൈവിക അധികാരവും സംഭവസ്വഭാവവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘സന്ദേശം’ എന്നത് അർഥം അമിതമായി സാധാരണവൽക്കരിച്ചേക്കാം.
- issue: מַה לְּךָ פֹה എന്ന ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: നീ ഇവിടെ എന്തു ചെയ്യുന്നു?
  alternative: നീ എന്തിനാണ് ഇവിടെ?
  rationale: മൂലത്തിലെ പ്രയോഗം ഉദ്ദേശ്യം മാത്രമല്ല, ഏലിയാവിന്റെ സാന്നിധ്യവും സാഹചര്യവും വിളിച്ചുചോദിക്കാം. അതിനാൽ വിശാലമായ ചോദ്യം മുഖ്യപാഠത്തിൽ വച്ച് കാരണത്തെ മുൻനിർത്തുന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അരുളപ്പാട്’ പ്രവാചകീയ സൂത്രത്തിന്റെ ഭാരം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുകൾക്കും ചതുരക്കൊളുത്തിലുള്ള സൂചകം ചേർത്തിരിക്കുന്നു.
