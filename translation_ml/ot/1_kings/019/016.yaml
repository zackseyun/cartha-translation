source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: ml
  text: നിംശിയുടെ മകനായ യേഹൂവിനെ ഇസ്രായേലിന്റെ രാജാവായി നീ അഭിഷേകം ചെയ്യണം. ആബേൽ-മെഹോലയിൽനിന്നുള്ള ശാഫാത്തിന്റെ മകനായ എലീശായെ നിന്റെ സ്ഥാനത്ത്[a] പ്രവാചകനായി അഭിഷേകം ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിനക്കുശേഷം’ എന്നും ‘നിനക്കു പകരം’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപ്രയോഗം പിൻഗാമിത്വത്തെയോ പകരംവരലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: നീ അഭിഷേകം ചെയ്യണം
  rationale: Qal imperfect രണ്ടാം പുരുഷ ഏകവചന പുല്ലിംഗരൂപം ഈ ദൈവിക നിയോഗസന്ദർഭത്തിൽ നിർദേശത്തിന്റെ ബലം വഹിക്കുന്നു. ‘അഭിഷേകം ചെയ്യണം’ ആ ബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְמֶלֶךְ
  choice: രാജാവായി
  rationale: לְ ഇവിടെ പദവിയിലേക്കുള്ള നിയമനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘രാജാവായി’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി
  rationale: עַל രാജകീയ അധികാരം സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേലിന്റെ രാജാവ്’ എന്ന മലയാളപ്രയോഗം ഇസ്രായേലിന്മേലുള്ള ഭരണാധികാരം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: ആബേൽ-മെഹോലയിൽനിന്നുള്ള
  rationale: מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; എലീശയുടെ സ്വദേശം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְנָבִיא
  choice: പ്രവാചകനായി
  rationale: לְ ഒരു പദവിയിലേക്കുള്ള നിയമനം സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവാചകനായി’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: תַּחְתֶּיךָ
  choice: നിന്റെ സ്ഥാനത്ത്
  rationale: תַּחַת ഇവിടെ സ്ഥാനമേറ്റെടുക്കലോ പകരം വരലോ സൂചിപ്പിക്കാം. ‘നിന്റെ സ്ഥാനത്ത്’ ഈ രണ്ടിനോടുമുള്ള തുറന്ന നില പരമാവധി നിലനിർത്തുന്നു.
- source_word: בֶן
  choice: മകനായ
  rationale: പിതൃനാമത്തെ അടിസ്ഥാനമാക്കിയുള്ള തിരിച്ചറിയൽ മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തുന്നു.
- source_word: וְאֵת ... וְאֶת
  choice: വാക്യക്രമത്തിലൂടെയും രണ്ടു സമാന്തര നിർദേശങ്ങളിലൂടെയും പ്രതിഫലിപ്പിച്ചു
  rationale: אֵת നേരിട്ട് വിവർത്തനം ചെയ്യപ്പെടാത്ത നിർദ്ദിഷ്ട കർമചിഹ്നമാണ്; וְ യുടെ ഏകോപനം മലയാളത്തിലെ തുടർച്ചയായ രണ്ടു വാക്യങ്ങളിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു.
theological_decisions:
- issue: תַּחְתֶּיךָ എന്നതിൽ ഏലിയാവിനോടുള്ള എലീശയുടെ ബന്ധം
  choice: പ്രവാചകസ്ഥാനത്ത് എലീശ ഏലിയാവിന്റെ സ്ഥാനമേറ്റെടുക്കുന്നു എന്ന അർഥത്തിൽ ‘നിന്റെ സ്ഥാനത്ത്’
  alternative: ‘നിനക്കുശേഷം’ എന്ന കാലക്രമപ്രധാനമായ അർഥം, അല്ലെങ്കിൽ ‘നിനക്കു പകരം’ എന്ന കൂടുതൽ ശക്തമായ പകരംവെക്കൽ അർഥം
  rationale: എബ്രായപദം പിൻഗാമിത്വത്തെയും പകരംവരലിനെയും ഉൾക്കൊള്ളാൻ കഴിയും. ‘നിന്റെ സ്ഥാനത്ത്’ പ്രവാചകദൗത്യത്തിന്റെ കൈമാറ്റം അറിയിക്കുമ്പോഴും പെട്ടെന്നുള്ള പുറത്താക്കൽ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ ലിപ്യന്തരണത്തോട് ചേർത്ത് നൽകിയിരിക്കുന്നു. ആവർത്തിച്ചിരിക്കുന്ന അഭിഷേകനിർദേശം രണ്ടു വാക്യങ്ങളായി നൽകി വ്യക്തത വർധിപ്പിച്ചെങ്കിലും മൂലപാഠത്തിന്റെ സമാന്തരഘടന നിലനിർത്തി.
