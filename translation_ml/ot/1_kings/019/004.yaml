    rationale: ‘അല്ലല്ലോ’ സംസാരഭാവം നൽകുന്നുണ്ടെങ്കിലും ‘കാരണം’ ചേർക്കുന്നത് മൂലത്തിലെ ന്യായീകരണബന്ധം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
  revised_text: 'എന്നാൽ അവൻതന്നെ മരുഭൂമിയിലേക്ക് ഒരു ദിവസത്തെ യാത്ര പോയി. അവൻ ഒരു ചൂൽച്ചെടിയുടെ[a] ചുവട്ടിൽ എത്തി ഇരുന്നു. താൻ മരിക്കണമെന്ന് അവൻ അപേക്ഷിച്ചു: “മതി! യഹ്‌വേ, ഇപ്പോൾ എന്റെ ജീവൻ എടുത്തുകൊള്ളണമേ; കാരണം, ഞാൻ എന്റെ പിതാക്കന്മാരെക്കാൾ മെച്ചപ്പെട്ടവനല്ല.”'
  revised_footnotes:
