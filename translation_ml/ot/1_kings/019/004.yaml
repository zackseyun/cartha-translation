  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻതന്നെ മരുഭൂമിയിലേക്ക് ഒരു ദിവസത്തെ യാത്ര പോയി. അവൻ ഒരു ചൂൽച്ചെടിയുടെ[a] ചുവട്ടിൽ എത്തി ഇരുന്നു. താൻ മരിക്കണമെന്ന് അവൻ അപേക്ഷിച്ചു: “മതി! യഹ്‌വേ, ഇപ്പോൾ എന്റെ ജീവൻ എടുത്തുകൊള്ളണമേ; കാരണം, ഞാൻ എന്റെ പിതാക്കന്മാരെക്കാൾ മെച്ചപ്പെട്ടവനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദമായ רֹתֶם മരുഭൂമിയിൽ വളരുന്ന, വൃക്ഷംപോലെ ഉയരാവുന്ന ഒരു കുറ്റിച്ചെടിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ചൂൽമരം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: എന്നാൽ അവൻ തനിച്ച്
  rationale: സ്വതന്ത്ര സർവനാമമായ הוּאയ്ക്ക് ഇവിടെ ഊന്നലുണ്ട്; മുൻസന്ദർഭത്തിലെ ദാസനിൽനിന്ന് ഏലിയാവിനെ വേർതിരിക്കുന്നതിനാൽ ‘അവൻ തനിച്ച്’ എന്നത് സ്വാഭാവികമായി ആ ഊന്നൽ നൽകുന്നു.
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: മരുഭൂമിയിലൂടെ ഒരു ദിവസത്തെ വഴി
  rationale: מִדְבָּר ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയും דֶּרֶךְ יוֹם ഒരു ദിവസത്തെ യാത്രാദൂരത്തെയും സൂചിപ്പിക്കുന്നു. ചലനവും യാത്രയുടെ അളവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: רֹתֶם אַחַת
  choice: ഒരു ചൂൽച്ചെടി
  rationale: רֹתֶם മരുഭൂമിയിൽ വളരുന്ന broom shrub ആണ്. സസ്യശാസ്ത്രപരമായി ‘ചെടി’ എന്നത് ‘വൃക്ഷം’ എന്നതിനെക്കാൾ കൃത്യം; אַחַת ഇവിടെ അനിശ്ചിത ഏകവചനമായി ‘ഒരു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: താൻ മരിക്കണമെന്ന് അവൻ അപേക്ഷിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ നഫെഷിനെ സംബന്ധിച്ച് മരിക്കാനായി അപേക്ഷിച്ചു’ എന്ന ഹീബ്രു പ്രയോഗം സന്ദർഭത്തിൽ സ്വന്തം മരണത്തിനായുള്ള അപേക്ഷയാണ്. അസ്വാഭാവികമായ ‘ആത്മാവ് മരിക്കുക’ എന്ന ഭാഷ ഒഴിവാക്കി അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: רַב עַתָּה
  choice: മതി! … ഇപ്പോൾ
  rationale: רַב ഇവിടെ ‘മതി’ എന്ന വികാരഭരിതമായ ഉദ്ഗാരമാണ്; עַתָּהയുടെ ‘ഇപ്പോൾ’ തുടർന്നുള്ള അപേക്ഷയോടു ചേർത്തത് ഹീബ്രു പദക്രമം അനുവദിക്കുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ വ്യാപകമായ ശബ്ദലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: קַח נַפְשִׁי
  choice: എന്റെ ജീവൻ എടുത്തുകൊള്ളണമേ
  rationale: נֶפֶשׁ ഇവിടെ വ്യക്തിയുടെ ജീവനെ സൂചിപ്പിക്കുന്നു; മരണത്തിനായുള്ള അപേക്ഷയായതിനാൽ ‘ജീവൻ’ സന്ദർഭോചിതവും ദേഹി-ആത്മാവ് സംബന്ധിച്ച അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: ഞാൻ എന്റെ പിതാക്കന്മാരെക്കാൾ മെച്ചപ്പെട്ടവനല്ലല്ലോ
  rationale: מִן താരതമ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘മെച്ചപ്പെട്ടവൻ അല്ല’ എന്നതാണ് അർഥം. אֲבֹתַיയുടെ പിതൃ/പൂർവിക സൂചന ‘പിതാക്കന്മാർ’ എന്നു നിലനിർത്തുന്നു; כִּיയുടെ കാരണം/ന്യായീകരണ ഭാവം ‘അല്ലല്ലോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘കർത്താവ്’ എന്നു നൽകിയാൽ മൂലത്തിലെ നാമവും സ്ഥാനപ്പേരും തമ്മിലുള്ള വ്യത്യാസം മറയും.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ മാനവസ്വഭാവശാസ്ത്രപരമായ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഏലിയാവ് മരണം അപേക്ഷിക്കുന്ന ഈ സന്ദർഭത്തിൽ പദം അവന്റെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആത്മാവ്’ എന്നു നൽകുന്നത് ശരീരത്തിൽനിന്ന് വേറിട്ട അമരഘടകത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാം.
- issue: ഏലിയാവിന്റെ അപേക്ഷയുടെ സ്വഭാവം
  choice: താൻ മരിക്കണമെന്ന് അപേക്ഷിച്ചു
  alternative: തന്റെ ആത്മാവ് മരിക്കണമെന്ന് അപേക്ഷിച്ചു
  rationale: വാചകം ആത്മഹത്യ ചെയ്തുവെന്നോ ആത്മാവിന്റെ നാശത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തം പഠിപ്പിക്കുന്നുവെന്നോ പറയുന്നില്ല; അവൻ തന്റെ മരണം ദൈവത്തോട് അപേക്ഷിച്ചതാണ്. ഈ സംഘർഷം കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏലിയാവിന്റെ ക്ഷീണവും അപേക്ഷയുടെ തീവ്രതയും ചെറുവാക്യങ്ങളും ഉദ്ഗാരവും വഴി നിലനിർത്തി. ‘ഒരു ദിവസത്തെ വഴി’ എന്ന ബൈബിൾശൈലി വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
