  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘അങ്ങയുടെ’ എന്ന ആദരസംബോധന നേരിട്ടുള്ള ദൈവാഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു. ‘ഇസ്രായേൽമക്കൾ’ സന്ദർഭത്തിൽ മനസ്സിലാക്കാവുന്നതും, അതിന്റെ ജനസമൂഹാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കിയതുമാണ്.
