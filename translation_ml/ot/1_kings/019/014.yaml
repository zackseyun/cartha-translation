id: 1KI.19.14
reference: 1 Kings 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സൈന്യങ്ങളുടെ ദൈവമായ യഹോവയ്ക്കുവേണ്ടി ഞാൻ അത്യന്തം തീക്ഷ്ണത കാണിച്ചിരിക്കുന്നു[a]. കാരണം ഇസ്രായേൽമക്കൾ[b] അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു, അങ്ങയുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു, അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു. ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു; എന്റെ ജീവൻ എടുക്കാൻ അവർ ശ്രമിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിയായി അസൂയപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ക്രിയയുടെ ആശയം ശക്തിപ്പെടുത്തുന്ന infinitive absolute-ഉം finite verb-ഉം ഒരുമിച്ച് ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഇസ്രായേൽ ജനസമൂഹമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: ഞാൻ അത്യന്തം തീക്ഷ്ണത കാണിച്ചിരിക്കുന്നു
  rationale: ക്രിയയുടെ ആശയം ശക്തിപ്പെടുത്തുന്ന infinitive absolute-ഉം finite verb-ഉം ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഊന്നൽ ‘അത്യന്തം’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു. ‘തീക്ഷ്ണത’ ഇവിടെ അസൂയയേക്കാൾ യഹോവയോടുള്ള ജ്വലിക്കുന്ന ഉടമ്പടിവിശ്വസ്തതയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുവേണ്ടി
  rationale: ל എന്ന ഉപസർഗം ഏലിയാവിന്റെ തീക്ഷ്ണതയുടെ ലക്ഷ്യവും പക്ഷവും സൂചിപ്പിക്കുന്നു; ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ ദൈവം
  rationale: צבאות എന്ന ബഹുവചനപദത്തിന്റെ വിശാലത നിലനിർത്തുന്ന സ്ഥിരദൈവിക ബിരുദമാണിത്; ഭൂമിയിലെ സൈന്യങ്ങൾ മാത്രമെന്നോ സ്വർഗീയ സൈന്യങ്ങൾ മാത്രമെന്നോ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു
  rationale: עזב എന്നതിന്റെ ‘വിട്ടുകളയുക, ഉപേക്ഷിക്കുക’ എന്ന ഗൗരവമുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ജനസമൂഹപരവും ഉടമ്പടിപരവുമായ സംജ്ഞ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: അങ്ങയുടെ ബലിപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു
  rationale: הרס എന്നതിലെ പൊളിച്ചുനശിപ്പിക്കൽ എന്ന ശക്തമായ ദൃശ്യാർഥം ‘ഇടിച്ചുകളഞ്ഞു’ വ്യക്തമാക്കുന്നു.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു
  rationale: കൊലയുടെ ഉപകരണത്തെ വ്യക്തമാക്കുന്ന בֶחָרֶב എന്ന ഘടകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു
  rationale: אני לבדי നൽകുന്ന ഏലിയാവിന്റെ ഒറ്റപ്പെടലിലെ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: എന്റെ ജീവൻ എടുക്കാൻ അവർ ശ്രമിക്കുന്നു
  rationale: נפש ഇവിടെ അഭൗതികമായ ‘ആത്മാവ്’ അല്ല, വ്യക്തിയുടെ ജീവൻ തന്നെയാണ്. മുഴുവൻ എബ്രായ പ്രയോഗവും കൊല്ലാനുള്ള ശ്രമം എന്ന അർഥത്തിൽ സ്വാഭാവിക മലയാളത്തിലാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: קַנֹּא קִנֵּאתִי എന്നതിലെ വികാരത്തിന്റെ സ്വഭാവം
  choice: അത്യന്തം തീക്ഷ്ണത കാണിച്ചിരിക്കുന്നു
  alternative: അതിയായി അസൂയപ്പെട്ടിരിക്കുന്നു
  rationale: പ്രയോഗത്തിന് ‘അസൂയ’ എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, ഇവിടെ ഏലിയാവ് യഹോവയ്ക്കുവേണ്ടിയുള്ള ജ്വലിക്കുന്ന വിശ്വസ്തതയെക്കുറിച്ചാണ് പറയുന്നത്. പ്രധാന പാഠത്തിൽ പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച ‘തീക്ഷ്ണത’ നൽകി, മറ്റൊരു അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ രൂപം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം പരാമർശിക്കുന്നതല്ല, ഇസ്രായേൽ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തിത ഊന്നലും ഏലിയാവിന്റെ ഒറ്റപ്പെടലും നിലനിർത്തിയപ്പോൾ, ‘ജീവനെ തേടുന്നു’ എന്ന അസ്വാഭാവിക അക്ഷരപരിഭാഷയ്ക്ക് പകരം മലയാളത്തിലെ ‘ജീവൻ എടുക്കാൻ ശ്രമിക്കുന്നു’ എന്ന സുതാര്യമായ പ്രയോഗം സ്വീകരിച്ചു.
