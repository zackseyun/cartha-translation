base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: ml
  text: അങ്ങനെ അവൻ എഴുന്നേറ്റ് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു. ആ ഭക്ഷണത്തിൽനിന്നു ലഭിച്ച ശക്തിയാൽ[a] അവൻ നാൽപ്പതു പകലും നാൽപ്പതു രാത്രിയും ദൈവത്തിന്റെ പർവതമായ ഹോരേബിലേക്കു യാത്ര ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ ഭക്ഷണത്തിന്റെ ബലത്താൽ.” എബ്രായപ്രയോഗം അവൻ കഴിച്ചതിൽനിന്നു ലഭിച്ച പോഷണവും ശക്തിയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: അങ്ങനെ അവൻ എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ കഥനപരമായ തുടർച്ചയെ ‘അങ്ങനെ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ എന്നത് അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തു
  rationale: രണ്ടു ലളിത കഥനക്രിയകളെയും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּלֶךְ
  choice: നടന്നു
  rationale: הלך എന്നത് ഇവിടെ ദീർഘമായ കാൽനടയാത്രയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നടന്നു’ സന്ദർഭോചിതമാണ്; ‘യാത്ര ചെയ്തു’ എന്നതിനെക്കാൾ അടിസ്ഥാന ചലനാർഥത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: ആ ഭക്ഷണത്തിന്റെ ശക്തിയാൽ
  rationale: ‘ആ ഭക്ഷണം നൽകിയ ബലത്താൽ’ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; അֲכִילָה എന്നതിലെ ‘ഭക്ഷിക്കൽ/ഭക്ഷണം’ എന്ന അർഥപരിധി പൂർണമായി ‘ആഹാരം’ എന്ന വസ്തുവിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: നാൽപ്പതു പകലും നാൽപ്പതു രാത്രിയും
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ കൃത്യവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: യാത്രയുടെ അന്തിമസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന עַד എന്നതിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: הַר הָאֱלֹהִים
  choice: ദൈവത്തിന്റെ പർവതം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ ഔപചാരികതയും ദൈവത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: חֹרֵב
  choice: ഹോരേബ്
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: הָאֱלֹהִים എന്നതിന്റെ അർഥം
  choice: ദൈവം
  alternative: ദിവ്യമായ
  rationale: ‘ദൈവത്തിന്റെ പർവതം’ എന്ന സ്ഥിരമായ ബൈബിൾ സ്ഥാനവിശേഷണത്തിൽ വ്യക്തിപരമായ ദൈവസൂചനയാണ് ഏറ്റവും സ്വാഭാവികം; ‘ദിവ്യമായ’ എന്നു മാറ്റുന്നത് ബന്ധസൂചനയെ ഗുണവിശേഷമാക്കി മാറ്റും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘പർവതം’ എന്ന പദം הַר എന്നതിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട യാത്രാവാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
