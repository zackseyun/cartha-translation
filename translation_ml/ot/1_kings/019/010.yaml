revisions:
- from: 'അവൻ പറഞ്ഞു: “സൈന്യങ്ങളുടെ ദൈവമായ യഹ്‌വേക്കുവേണ്ടി ഞാൻ അത്യന്തം തീക്ഷ്ണതയോടെ നിലകൊണ്ടിരിക്കുന്നു. കാരണം, ഇസ്രായേൽമക്കൾ അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു; അങ്ങയുടെ യാഗപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു; അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു. ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു; എന്റെ ജീവൻ അപഹരിക്കാൻ അവർ ശ്രമിക്കുന്നു.”'
  to: 'അവൻ പറഞ്ഞു: “സൈന്യങ്ങളുടെ ദൈവമായ യഹ്‌വേയ്ക്കുവേണ്ടി ഞാൻ അത്യന്തം തീക്ഷ്ണത കാട്ടിയിരിക്കുന്നു. കാരണം, ഇസ്രായേൽമക്കൾ അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു; അങ്ങയുടെ യാഗപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു; അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു. ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു; അവർ എന്റെ ജീവൻ എടുക്കാൻ നോക്കുന്നു.”'
  rationale: 'The revision preserves every clause and the emphatic force of the Hebrew while replacing an unnatural, potentially misleading expression for the threat to Elijah’s life. No footnote is needed: the source presents no textual ambiguity requiring one in this Malayalam rendering.'
