id: 1KI.19.10
reference: 1 Kings 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സൈന്യങ്ങളുടെ ദൈവമായ യഹ്‌വേയ്ക്കുവേണ്ടി ഞാൻ അത്യന്തം തീക്ഷ്ണത കാട്ടിയിരിക്കുന്നു. കാരണം, ഇസ്രായേൽമക്കൾ അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു; അങ്ങയുടെ യാഗപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു; അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു. ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു; അവർ എന്റെ ജീവൻ എടുക്കാൻ നോക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: ഞാൻ അത്യന്തം തീക്ഷ്ണതയോടെ നിലകൊണ്ടിരിക്കുന്നു
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപികക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ തീവ്രത ‘അത്യന്തം’ എന്നു പ്രകടമാക്കുന്നു. അസൂയ എന്നതിലുപരി യഹ്‌വേക്കായുള്ള ഉടമ്പടിസംബന്ധമായ തീക്ഷ്ണതയാണ് സന്ദർഭം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുവേണ്ടി
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു; לְ എന്ന ഉപസർഗത്തിന്റെ അർഥം ‘വേണ്ടി’ എന്നു നൽകി.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: സൈന്യങ്ങളുടെ ദൈവം
  rationale: צְבָאוֹת എന്നതിന്റെ സൈന്യങ്ങൾ/വ്യൂഹങ്ങൾ എന്ന അർഥം നിലനിർത്തുന്നു; മറ്റൊരു ദൈവികപദവി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: അങ്ങയുടെ ഉടമ്പടി ഉപേക്ഷിച്ചു
  rationale: עָזַב എന്നതിന്റെ ഉപേക്ഷിക്കുക/വിട്ടുകളയുക എന്ന അർഥവും ഉടമ്പടിലംഘനത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന മൂലരൂപം ചുരുക്കവും പരിചിതവുമായ മലയാളപ്രയോഗത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: അങ്ങയുടെ യാഗപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു
  rationale: הָרַס എന്നത് കെട്ടിടമോ പീഠമോ ഇടിച്ചുതകർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇടിച്ചുകളഞ്ഞു’ വ്യക്തവും ദൃശ്യവുമാണ്.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: അങ്ങയുടെ പ്രവാചകന്മാരെ വാളുകൊണ്ട് കൊന്നു
  rationale: കൊല്ലൽക്രിയയും അതിന്റെ ഉപകരണമായ വാളും മൂലപാഠത്തിനനുസരിച്ച് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: ഞാൻ മാത്രം ശേഷിച്ചിരിക്കുന്നു
  rationale: ഏലിയാവിന്റെ ഏകാന്തശേഷിപ്പെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: എന്റെ ജീവൻ അപഹരിക്കാൻ അവർ ശ്രമിക്കുന്നു
  rationale: נֶפֶשׁ ഇവിടെ സാങ്കേതികമായ ‘ആത്മാവ്’ അല്ല, ജീവൻ തന്നെയാണ്. ‘ജീവൻ അപഹരിക്കുക’ എന്നത് കൊല്ലാൻ അന്വേഷിക്കുന്നു എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പദവിയാൽ പകരംവെച്ചില്ല.
- issue: കַנֹּא קִנֵּאתִי എന്ന പ്രയോഗത്തിലെ തീക്ഷ്ണതയും അസൂയയും
  choice: അത്യന്തം തീക്ഷ്ണതയോടെ നിലകൊണ്ടിരിക്കുന്നു
  alternative: അതിയായി അസൂയപ്പെട്ടിരിക്കുന്നു
  rationale: പദത്തിന് ‘അസൂയ’ എന്ന സാധ്യതയുണ്ടെങ്കിലും, ഇവിടെ ഏലിയാവ് ദൈവത്തിനുവേണ്ടിയുള്ള തീക്ഷ്ണമായ വിശ്വസ്തതയെക്കുറിച്ചാണ് പറയുന്നത്. എങ്കിലും തീവ്രത മൂലത്തിലെ ആവർത്തനഘടനയ്ക്ക് അനുസരിച്ച് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ വ്യത്യസ്തവായന ആവശ്യപ്പെടുന്ന നിർണായക അനിശ്ചിതത്വമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
