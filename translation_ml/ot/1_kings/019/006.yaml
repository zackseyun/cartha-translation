  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: ml
  text: അവൻ നോക്കി; ഇതാ, അവന്റെ തലയ്ക്കൽ ചൂടാക്കിയ കല്ലുകളിൽ ചുട്ട ഒരു അപ്പം[a]യും ഒരു തുരുത്തി വെള്ളവും ഉണ്ടായിരുന്നു. അവൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തു; വീണ്ടും കിടന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചൂടാക്കിയ കല്ലുകളിൽ ചുട്ട അപ്പം’ എന്നതിന് പകരം ‘കനലിന്മേലുള്ള അപ്പം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ רְצָפִים എന്ന പദം അപ്പം ചുടാൻ ഉപയോഗിച്ച ചൂടാക്കിയ കല്ലുകളെയോ കനലുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: അവൻ നോക്കി
  rationale: נבט എന്ന ക്രിയയുടെ ‘നോക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ദിശ ചേർക്കുന്നില്ല.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കാണുന്ന കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ സജീവമായ ആഖ്യാനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְרַאֲשֹׁתָיו
  choice: അവന്റെ തലയ്ക്കൽ
  rationale: കിടക്കുന്നവന്റെ തലയുടെ സമീപസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: עֻגַת
  choice: ഒരു അപ്പം
  rationale: עֻגָה ഇവിടെ വട്ടത്തിലുള്ള അപ്പത്തെയോ അപ്പക്കട്ടയെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കേക്ക്’ മധുരപലഹാരമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാക്കാം.
- source_word: רְצָפִים
  choice: ചൂടാക്കിയ കല്ലുകളിൽ ചുട്ട
  rationale: ഈ പദം അപ്പം ചുടാൻ ഉപയോഗിച്ച ചൂടാക്കിയ കല്ലുകളെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ‘കനൽ’ എന്ന അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְצַפַּחַת מָיִם
  choice: ഒരു തുരുത്തി വെള്ളം
  rationale: צַפַּחַת സൂചിപ്പിക്കുന്ന ചെറിയ ജലപാത്രത്തിന് ബൈബിൾ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: അവൻ തിന്നുകയും കുടിക്കുകയും ചെയ്തു
  rationale: തുടർച്ചയായ രണ്ടു പ്രവൃത്തികളെയും എബ്രായ ആഖ്യാനത്തിന്റെ ലളിതമായ താളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: പിന്നെ വീണ്ടും കിടന്നു
  rationale: שׁוּב + שׁכב എന്നത് വീണ്ടും കിടക്കുക എന്ന ആശയം നൽകുന്നു; ‘മടങ്ങി’ എന്ന് യാന്ത്രികമായി ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതാ’ മൂലപാഠത്തിന്റെ ശ്രദ്ധാകർഷകഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട വിവർത്തനഘടകത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
