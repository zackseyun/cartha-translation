id: 1KI.19.7
reference: 1 Kings 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: ml
  text: 'പിന്നെ യഹ്‌വെയുടെ ദൂതൻ[a] രണ്ടാം പ്രാവശ്യം മടങ്ങിവന്ന് അവനെ തൊട്ടു പറഞ്ഞു: “എഴുന്നേറ്റ് ഭക്ഷിക്കുക; കാരണം യാത്ര നിനക്കു താങ്ങാനാവുന്നതിലും അധികമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിവന്ന്
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ שוב എന്ന ക്രിയയുടെ സ്വാഭാവിക അർഥം ‘തിരികെ വരുക’ എന്നാണ്; തുടർന്നുള്ള പ്രവൃത്തിയുമായി ചേർത്ത് ‘മടങ്ങിവന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഇവിടെ ദൈവിക ദൂതനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ആവർത്തനം മാത്രമല്ല, ഇത് കൃത്യമായി രണ്ടാം തവണയാണെന്ന എബ്രായപദത്തിന്റെ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: וַיִּגַּע בּוֹ
  choice: അവനെ തൊട്ടു
  rationale: נגע എന്ന ക്രിയയും അതോടു ചേർന്ന സർവനാമവും നേരിട്ട് ‘അവനെ തൊട്ടു’ എന്നാണ്; ആവർത്തനം ഇതിനുമുമ്പുള്ള ‘രണ്ടാം പ്രാവശ്യം’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: קוּם אֱכֹל
  choice: എഴുന്നേറ്റ് ഭക്ഷിക്കുക
  rationale: രണ്ട് നേരിട്ടുള്ള ആജ്ഞകളുടെയും ശക്തി നിലനിർത്തുന്ന, ആധുനികവും മാന്യവുമായ പ്രയോഗം.
- source_word: כִּי
  choice: ;
  rationale: തുടർന്നുവരുന്ന വാക്യം ആജ്ഞയുടെ കാരണം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള പ്രസ്താവന ഈ കാരണബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘കാരണം’ എന്നും ചേർക്കാമെങ്കിലും അത് നിർബന്ധമല്ല.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: യാത്ര നിനക്കു താങ്ങാനാവുന്നതിലും അധികമാണ്
  rationale: എബ്രായപ്രയോഗം യാത്ര ഏലിയാവിന്റെ ശേഷിക്ക് അതീതമാണെന്ന് സൂചിപ്പിക്കുന്നു. ദൂരം മാത്രം ഉദ്ദേശിച്ച് ‘വളരെ നീണ്ടതാണ്’ എന്നു ചുരുക്കാതെ, ശേഷിക്കതീതമെന്ന അർഥവും മൂലത്തിലെ വിശാലതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഉടമ്പടിനാമം ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: സന്ദർഭം യഹ്‌വെയിൽനിന്നുള്ള അതിമാനുഷിക ദൂതനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; എങ്കിലും പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘സന്ദേശവാഹകൻ’ അടിക്കുറിപ്പിൽ നൽകി യഥാർഥമായ പദാർഥവൈവിധ്യം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘യാത്ര നിനക്കു താങ്ങാനാവുന്നതിലും അധികമാണ്’ എന്ന പ്രയോഗം മൂലത്തിലെ ശേഷിക്കതീതത്വം നിലനിർത്തുകയും അത് ദൂരം മാത്രമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
