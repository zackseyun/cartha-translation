  text: וַ/יָּ֨שָׁב מֵ/אַחֲרָ֜י/ו וַ/יִּקַּ֣ח אֶת צֶ֧מֶד הַ/בָּקָ֣ר וַ/יִּזְבָּחֵ֗/הוּ וּ/בִ/כְלִ֤י הַ/בָּקָר֙ בִּשְּׁלָ֣/ם הַ/בָּשָׂ֔ר וַ/יִּתֵּ֥ן לָ/עָ֖ם וַ/יֹּאכֵ֑לוּ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אַחֲרֵ֥י אֵלִיָּ֖הוּ וַ/יְשָׁרְתֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: ml
  text: പിന്നെ അവൻ അവനെ പിന്തുടരുന്നതിൽനിന്ന് മടങ്ങി, ഒരു ജോടി കാളകളെ[a] എടുത്ത് അവയെ ബലിയായി അറുത്തു. കാളകളുടെ പണിയുപകരണങ്ങൾകൊണ്ട്[b] അവൻ മാംസം പുഴുങ്ങി ജനങ്ങൾക്കു കൊടുത്തു; അവർ അതു തിന്നു. പിന്നെ അവൻ എഴുന്നേറ്റ് ഏലിയാവിന്റെ പിന്നാലെ ചെന്ന് അവനെ ശുശ്രൂഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാളകളുടെ ഒരു നുകം.’
    reason: צֶמֶד എന്ന പദത്തിന് ‘ജോടി’ എന്നും ‘നുകം/നുകത്തിൽ പൂട്ടിയ ജോടി’ എന്നും അർഥസാധ്യതയുണ്ട്.
  - marker: b
    text: അഥവാ ‘കാളകളുടെ നുകവും മറ്റു പണിക്കോപ്പുകളും ഉപയോഗിച്ച്.’
    reason: כְּלִי എന്ന പദം ഉപകരണം, പണിക്കോപ്പ്, സാമഗ്രി എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ കാളകളുടെ നുകമുൾപ്പെടെയുള്ള മരപ്പണിക്കോപ്പുകൾ ഉദ്ദേശിച്ചിരിക്കാം.
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: അവന്റെ പിന്നാലെ പോയിടത്തുനിന്ന് മടങ്ങി
  rationale: ‘അവന്റെ പിന്നാലെനിന്ന് മടങ്ങി’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: צֶמֶד הַבָּקָר
  choice: ഒരു ജോടി കാളകളെ
  rationale: צֶמֶד ഇവിടെ ഒന്നിച്ചു പൂട്ടിയ രണ്ടു കാളകളെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള അറുക്കൽക്രിയയുമായി ‘ജോടി’ വ്യക്തമായി ചേരുന്നു.
- source_word: וַיִּזְבָּחֵהוּ
  choice: അവയെ ബലിയായി അറുത്തു
  rationale: זבח എന്ന പദത്തിലെ ബലിസംബന്ധമായ ഭാവവും യഥാർഥ അറുക്കൽക്രിയയും ഒരുപോലെ വ്യക്തമാക്കുന്നു; ബലി ആർക്കാണ് അർപ്പിച്ചതെന്നോ ഏതു ആചാരക്രമത്തിലാണെന്നോ പാഠത്തിൽ ഇല്ലാത്ത വിവരം ചേർക്കുന്നില്ല.
- source_word: וּבִכְלִי הַבָּקָר
  choice: കാളകളുടെ പണിയുപകരണങ്ങൾകൊണ്ട്
  rationale: כְּלִי എന്ന വിശാലപദത്തിന് ‘ഉപകരണങ്ങൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; അവ നുകമോ മറ്റു പണിക്കോപ്പുകളോ ആയിരുന്നുവെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: മാംസം പുഴുങ്ങി
  rationale: בשל എന്ന ക്രിയയുടെ ‘പുഴുങ്ങുക/വേവിക്കുക’ എന്ന അർഥങ്ങളിൽ കൂടുതൽ നിർദിഷ്ടമായ അർഥം സ്വീകരിക്കുകയും בשר സ്വാഭാവികമായ മലയാളത്തിൽ ‘മാംസം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: לָעָם
  choice: ജനങ്ങൾക്കു
  rationale: പ്രാദേശിക സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും നിഷ്പക്ഷവുമായ പരിഭാഷ.
- source_word: וַיָּקָם
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ തുടർക്രമവും ക്രിയയുടെ അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ പിന്നാലെ ചെന്ന്
  rationale: ‘ഏലിയാവിന്റെ പിന്നാലെ പോയി’ എന്ന ദൃശ്യവും മുമ്പത്തെ ‘പിന്നാലെ’ എന്ന പ്രയോഗവുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וַיְשָׁרְתֵהוּ
  choice: അവനെ ശുശ്രൂഷിച്ചു
  rationale: שרת സൂചിപ്പിക്കുന്ന സേവകപരമായ ശുശ്രൂഷയെ വിശാലമായി നിലനിർത്തുന്നു; ഔദ്യോഗിക പദവിയെന്ന അധികനിഗമനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: זבח എന്ന ക്രിയയിൽ ബലിയുടെ ആശയം വ്യക്തമായി പ്രകടിപ്പിക്കണമോ
  choice: ‘ബലിയായി അറുത്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അറുത്തു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ക്രിയയുടെ സാധാരണ ബലിസംബന്ധമായ നിറം നിലനിർത്തുന്നു; എന്നാൽ ബലി ആർക്കാണ് അർപ്പിച്ചതെന്നോ ഔപചാരിക ആരാധനാക്രമം ഉണ്ടായിരുന്നുവെന്നോ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രായത്തിലെ ക്രിയാശൃംഖല ‘പിന്നെ’ എന്ന ബന്ധകത്തിലൂടെ പ്രകടമാക്കി; പാഠം വ്യക്തമാക്കാത്ത ആചാരപരമായ വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
