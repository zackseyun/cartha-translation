  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിക്കും: ഹസായേലിന്റെ വാളിൽനിന്ന് ആരെങ്കിലും രക്ഷപ്പെട്ടാൽ യേഹൂ അവനെ വധിക്കും; യേഹൂവിന്റെ വാളിൽനിന്ന് ആരെങ്കിലും രക്ഷപ്പെട്ടാൽ എലീശാ അവനെ വധിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എലീശാ കൊല്ലും.” എബ്രായത്തിലെ ക്രിയ ഹിഫീൽ (കാരക) രൂപത്തിലാണ്; “മരണത്തിനിടയാക്കും” എന്നും പറയാം. സന്ദർഭത്തിൽ, എലീശാ നേരിട്ട് വധിക്കുമെന്നോ, അദ്ദേഹത്തിന്റെ പ്രവാചകശുശ്രൂഷയിലൂടെ നടപ്പാകുന്ന ന്യായവിധി മുഖേന ഇതു സംഭവിക്കുമെന്നോ മനസ്സിലാക്കാവുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അങ്ങനെ സംഭവിക്കും
  rationale: തുടർന്ന് ഉണ്ടാകാനിരിക്കുന്ന ഫലം പ്രഖ്യാപിക്കുന്ന എബ്രായ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: രക്ഷപ്പെടുന്നവനെ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കൃദന്തം ഇവിടെ പൊതുവായ അർഥത്തിൽ നാമവാചകമായി പ്രവർത്തിക്കുന്നു; ആവർത്തിക്കുന്ന രണ്ടു പ്രയോഗങ്ങളും ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: מֵחֶרֶב
  choice: വാളിൽനിന്ന്
  rationale: חֶרֶב എന്ന പദത്തിന്റെ നേരിട്ടുള്ള ‘വാൾ’ എന്ന ദൃശ്യരൂപവും മാരകമായ സായുധന്യായവിധിയുടെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: חֲזָאֵל
  choice: ഹസായേൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകി.
- source_word: יָמִית
  choice: വധിക്കും
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം മരണത്തിനിടയാക്കുക/കൊല്ലുക എന്ന കാരക അർഥം വഹിക്കുന്നു. ‘വധിക്കും’ ആ മാരകപ്രവർത്തനത്തെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יֵהוּא
  choice: യേഹൂ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകി.
- source_word: אֱלִישָׁע
  choice: എലീശാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകി.
theological_decisions:
- issue: ‘വധിക്കും’ എന്നതിൽ എലീശായുടെ പ്രവർത്തകത്വം
  choice: യേഹൂവിന്റെ വാളിൽനിന്ന് രക്ഷപ്പെടുന്നവനെ എലീശാ വധിക്കും എന്ന നേരിട്ടുള്ള സമാന്തരവാക്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: എലീശായുടെ പ്രവാചകശുശ്രൂഷയിലൂടെയോ അവന്റെ ന്യായവിധിവചനത്തിലൂടെയോ മരണം സംഭവിക്കുമെന്ന പരോക്ഷ അർഥം സ്വീകരിക്കുക.
  rationale: എബ്രായ വാക്യഘടന ഹസായേലിനെയും യേഹൂവിനെയും എലീശായെയും മാരക ന്യായവിധിയുടെ സമാന്തര പ്രവർത്തകരായി അവതരിപ്പിക്കുന്നു. എലീശായുടെ പങ്ക് മുഖ്യപാഠത്തിൽ പരോക്ഷമാക്കുന്നത് പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുന്നതായിരിക്കും; അതിനാൽ സാധ്യതയുള്ള പരോക്ഷ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനവും ഹസായേൽ–യേഹൂ–എലീശാ സമാന്തരഘടനയും നിലനിർത്തി. ഇംഗ്ലീഷ് ആലോചനാപാഠത്തിലെ അടിക്കുറിപ്പുസൂചിക ഹസായേലിന് പിന്നാലെയുണ്ടായിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം എലീശായുടെ ‘വധിക്കും’ എന്ന പ്രവർത്തകത്വത്തെക്കുറിച്ചായതിനാൽ, മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട അന്തിമ ക്രിയയ്ക്കുശേഷം [a] ചേർത്തു.
