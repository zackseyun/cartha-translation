    issue: ‘അവൻ പന്ത്രണ്ടാമത്തേതിനോടൊപ്പമായിരുന്നു’ എന്ന പ്രയോഗം അനിശ്ചിതമാണ്.
    rationale: ഹീബ്രുവിലെ സംഖ്യാവാചകം മുമ്പു പറഞ്ഞ צְמָדִים (‘ജോടികൾ’) എന്ന നാമത്തെ എലിപ്റ്റിക്കായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നാമം വിട്ടുകളയുമ്പോൾ ‘പന്ത്രണ്ടാമത്തേത്’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാകുന്നില്ല. ‘പന്ത്രണ്ടാമത്തെ ജോടിയോടൊപ്പമായിരുന്നു’ എന്നു നൽകുന്നത് സൂചിത നാമം മാത്രം പൂരിപ്പിക്കുന്നു; അർഥം മാറ്റുന്നില്ല.
