  revised_text: അങ്ങനെ ഏലിയാവ് അവിടെനിന്നു പോയി, ശാഫാത്തിന്റെ മകനായ ഏലീശായെ കണ്ടു. ഏലീശാ ഉഴുതുകൊണ്ടിരിക്കുകയായിരുന്നു; അവന്റെ മുമ്പിൽ പന്ത്രണ്ട് നുകജോടികൾ[a] ഉണ്ടായിരുന്നു, അവൻ പന്ത്രണ്ടാമത്തെ ജോടിയോടൊപ്പമായിരുന്നു. ഏലിയാവ് അവന്റെ അരികിലൂടെ കടന്നുചെന്ന് തന്റെ മേലങ്കി[b] അവന്റെമേൽ എറിഞ്ഞു.
