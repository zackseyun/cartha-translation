  text: וַ/יֵּ֣לֶךְ מִ֠/שָּׁם וַ/יִּמְצָ֞א אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ וְ/ה֣וּא חֹרֵ֔שׁ שְׁנֵים עָשָׂ֤ר צְמָדִים֙ לְ/פָנָ֔י/ו וְ/ה֖וּא בִּ/שְׁנֵ֣ים הֶ/עָשָׂ֑ר וַ/יַּעֲבֹ֤ר אֵלִיָּ֨הוּ֙ אֵלָ֔י/ו וַ/יַּשְׁלֵ֥ךְ אַדַּרְתּ֖/וֹ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: ml
  text: അങ്ങനെ ഏലിയാവ് അവിടെനിന്നു പോയി, ശാഫാത്തിന്റെ മകനായ ഏലീശായെ കണ്ടു. ഏലീശാ ഉഴുതുകൊണ്ടിരിക്കുകയായിരുന്നു; അവന്റെ മുമ്പിൽ പന്ത്രണ്ട് നുകജോടികൾ[a] ഉണ്ടായിരുന്നു, അവൻ പന്ത്രണ്ടാമത്തെ ജോടിയോടൊപ്പമായിരുന്നു. ഏലിയാവ് അവന്റെ അരികിലൂടെ കടന്നുചെന്ന് തന്റെ മേലങ്കി[b] അവന്റെമേൽ എറിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പന്ത്രണ്ട് കാളജോടികൾ.’ ഹീബ്രു പദം ഉഴവിനായി നുകത്തിൽ ചേർത്ത പന്ത്രണ്ട് ജോടികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, ‘മാന്റിൽ.’ ചുറ്റുപാടുള്ള സന്ദർഭത്തിൽ ഈ വസ്ത്രം ഏലിയാവിന്റെ പ്രവാചകദൗത്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: അങ്ങനെ ഏലിയാവ് അവിടെനിന്നു പോയി
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനബന്ധം ‘അങ്ങനെ’ കൊണ്ട് സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും מִשָּׁם എന്നതിന്റെ സ്ഥലസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: ശാഫാത്തിന്റെ മകനായ ഏലീശായെ കണ്ടു
  rationale: מָצָא എന്ന സാധാരണ ക്രിയയെ ‘കണ്ടു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി; പേരുകൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകി.
- source_word: וְהוּא חֹרֵשׁ
  choice: ഏലീശാ ഉഴുതുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഹീബ്രു വർത്തമാനകൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘ഉഴുതുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: പന്ത്രണ്ട് നുകജോടികൾ
  rationale: צֶמֶד കൃഷിക്കായി നുകത്തിൽ ചേർത്ത മൃഗജോടിയെ സൂചിപ്പിക്കുന്നു. ‘നുകജോടികൾ’ കൃഷിചിത്രം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കാളകളാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെങ്കിലും മൂലപാഠത്തിൽ അവയെ വ്യക്തമായി പറയുന്നില്ല.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പിൽ
  rationale: ജോടികൾ ഏലീശായുടെ മുന്നിലായിരുന്നുവെന്ന സ്ഥലബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: അവൻ പന്ത്രണ്ടാമത്തേതിനോടൊപ്പമായിരുന്നു
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ ‘പന്ത്രണ്ടാമത്തേതിനൊപ്പം’ എന്ന ആശയം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: ഏലിയാവ് അവന്റെ അരികിലൂടെ കടന്നുചെന്ന്
  rationale: עָבַר എന്ന കടന്നുപോകൽപ്രവൃത്തിയും אֶל എന്ന സമീപനദിശയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: തന്റെ മേലങ്കി അവന്റെമേൽ എറിഞ്ഞു
  rationale: אַדֶּרֶת എന്ന പ്രത്യേക പുറംവസ്ത്രത്തിന് ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ ‘മേലങ്കി’ തെരഞ്ഞെടുത്തു; പ്രതീകാത്മക പ്രവൃത്തിയെ വ്യാഖ്യാനിക്കാതെ അതേപടി വിവരിക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന്റെ വസ്ത്രത്തിന്റെ പ്രതീകാത്മക പ്രാധാന്യം
  choice: ‘തന്റെ മേലങ്കി അവന്റെമേൽ എറിഞ്ഞു’ എന്ന് പ്രവൃത്തി മാത്രം വിവരിക്കുക
  alternative: ‘പ്രവാചകസ്ഥാനത്തിന്റെ പിൻഗാമിയായി നിയമിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് പറയുക, അല്ലെങ്കിൽ പരമ്പരാഗതമായ ‘മാന്റിൽ’ എന്ന പദം ഉപയോഗിക്കുക
  rationale: ഈ വാക്യത്തിൽ ഹീബ്രു പാഠം പ്രതീകാത്മക പ്രവൃത്തിയെ വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ അർഥം നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ പിൻഗാമിത്വത്തെ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ സന്ദർഭത്തിൽ നിന്നു മനസ്സിലാക്കാൻ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ആവർത്തിച്ച സർവനാമഘടന വായനാസൗകര്യത്തിനായി വ്യക്തമായ നാമങ്ങളോടെ അവതരിപ്പിച്ചു; എങ്കിലും പ്രവർത്തനക്രമവും മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും സംരക്ഷിച്ചു.
