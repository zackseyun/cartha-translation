  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: ml
  text: ഏലിയാവ് ചെയ്തതെല്ലാം ആഹാബ് ഈസബെലിനോടു പറഞ്ഞു; എല്ലാ പ്രവാചകന്മാരെയും അവൻ വാളുകൊണ്ട് കൊന്നതും അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: പറഞ്ഞു ... അറിയിച്ചു
  rationale: ഹീബ്രു ക്രിയയുടെ ‘അറിയിക്കുക/വിവരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: אִיזֶבֶל
  choice: ഈസബെൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: הָרַג
  choice: കൊന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും വിവരണത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: בֶּחָרֶב
  choice: വാളുകൊണ്ട്
  rationale: ഉപകരണം സൂചിപ്പിക്കുന്ന ഹീബ്രു മുൻപ്രത്യയത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവാചകന്മാരെ കൊന്നതിന്റെ കർത്താവ്
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി; അടുത്ത സന്ദർഭത്തിൽ അത് ഏലിയാവിനെ സൂചിപ്പിക്കുന്നു
  alternative: ഏലിയാവ് ... കൊന്നതും
  rationale: മൂലപാഠത്തിലെ സർവനാമരൂപം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിൽ വ്യക്തവുമാണ്; അധികമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘എല്ലാ പ്രവാചകന്മാർ’ ആരെന്ന്
  choice: മൂലപാഠംപോലെ ‘എല്ലാ പ്രവാചകന്മാരെയും’
  alternative: ബാലിന്റെ എല്ലാ പ്രവാചകന്മാരെയും
  rationale: ഈ വാക്യത്തിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ മുൻസന്ദർഭത്തിൽനിന്ന് ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും സന്ദർഭാശ്രിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണ ശൈലി. ആവർത്തിക്കുന്ന כָּל אֲשֶׁר ഘടനയുടെ ഉള്ളടക്കം സംരക്ഷിച്ചുകൊണ്ട്, വാക്കിന് വാക്കായ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി.
