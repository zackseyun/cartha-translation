  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: ml
  text: അവൻ കണ്ടു; പിന്നെ തന്റെ ജീവൻ രക്ഷിക്കാനായി എഴുന്നേറ്റ് യാത്രയായി. അവൻ യെഹൂദായിൽപ്പെട്ട ബേർ-ശേബയിൽ എത്തി, തന്റെ പരിചാരകനെ അവിടെ വിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പാഠത്തിൽ “അവൻ കണ്ടു” എന്നാണ്. ചില പുരാതന വിവർത്തനങ്ങളിലും കൈയെഴുത്തുപാരമ്പര്യങ്ങളിലും “അവൻ ഭയപ്പെട്ടു” എന്ന വായന കാണപ്പെടുന്നു.
    reason: WLCയുടെ “അവൻ കണ്ടു” എന്ന വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട് പ്രസക്തമായ പുരാതന വ്യത്യസ്ത വായന രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וַיַּרְא
  choice: അവൻ അതു കണ്ടപ്പോൾ
  rationale: മസോരറ്റിക് പാഠത്തിലെ ‘അവൻ കണ്ടു’ എന്ന വായന നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഭീഷണിയെ ‘അതു’ എന്നു സൂചിപ്പിക്കുമ്പോഴും ‘ഭയപ്പെട്ടു’ എന്ന വ്യത്യസ്ത പാഠവായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: തന്റെ ജീവൻ രക്ഷിക്കാനായി പുറപ്പെട്ടു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തന്റെ ജീവനുവേണ്ടി പോയി’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ മലയാള രൂപം; അവൻ ജീവരക്ഷ തേടി പോയെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּאֵר שֶׁבַע
  choice: ബേർ-ശേബ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: യെഹൂദായിലുള്ള
  rationale: ‘യെഹൂദായ്ക്കുള്ളത്/യെഹൂദായിൽപ്പെട്ടത്’ എന്ന പ്രദേശിക-രാഷ്ട്രീയ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיַּנַּח אֶת־נַעֲרוֹ שָׁם
  choice: തന്റെ ദാസനെ അവിടെ നിർത്തി
  rationale: נַעַר ഇവിടെ അനുചരനെയോ സേവകനെയോ സൂചിപ്പിക്കുന്നു; ‘ദാസൻ’ സന്ദർഭത്തിൽ വ്യക്തവും പരമ്പരാഗതവുമാണ്. ‘വിട്ടു’ എന്നതിനെക്കാൾ ‘നിർത്തി’ ഉപേക്ഷിച്ചെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: וַיַּרְא എന്ന മസോരറ്റിക് വായനയും ‘അവൻ ഭയപ്പെട്ടു’ എന്ന പുരാതന വ്യത്യസ്ത വായനയും
  choice: അവൻ അതു കണ്ടപ്പോൾ
  alternative: അവൻ ഭയപ്പെട്ടു
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠത്തെ മുഖ്യമായി പിന്തുടർന്ന് ‘കണ്ടു’ നിലനിർത്തുന്നു; കഥാസന്ദർഭം മാത്രം ആശ്രയിച്ച് ‘ഭയപ്പെട്ടു’ എന്നു തിരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായത്തിലെ തുടർച്ചയായ ‘അവൻ… അവൻ…’ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി.
