  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: ml
  text: കാരണം, ബേഥേലിലുള്ള യാഗപീഠത്തിനെതിരെയും ശമര്യയിലെ പട്ടണങ്ങളിലുള്ള ഉന്നത പൂജാസ്ഥലങ്ങളിലെ സകല ക്ഷേത്രങ്ങൾക്കെതിരെയും യാഹ്‌വേയുടെ വചനത്താൽ അവൻ വിളിച്ചുപറഞ്ഞ വചനം നിശ്ചയമായും[a] നിറവേറും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ഉറപ്പിനെ ശക്തിപ്പെടുത്താൻ ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപർഫെക്റ്റും ചേർന്നിരിക്കുന്നു; «തീർച്ചയായും സംഭവിക്കും» എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ അടക്കത്തെക്കുറിച്ചുള്ള അഭ്യർഥനയ്ക്കു കാരണം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָיֹה יִהְיֶה
  choice: നിശ്ചയമായും നിറവേറും
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ഇംപർഫെക്റ്റും ചേർന്ന പ്രയോഗത്തിലെ ശക്തമായ ഉറപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: ഇവിടെ ഒരു സംഭവത്തെയല്ല, പ്രവാചകൻ ഉച്ചരിച്ച ദൈവിക സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר קָרָא
  choice: അവൻ വിളിച്ചുപറഞ്ഞ
  rationale: പ്രവാചകന്റെ പരസ്യവും ശക്തവുമായ പ്രഖ്യാപനത്തിന്റെ വാചികസ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാടനുസരിച്ച്
  rationale: പ്രവാചകൻ ദൈവിക വെളിപ്പാടിന്റെ അടിസ്ഥാനത്തിൽ സംസാരിച്ചുവെന്ന ഉപാധി/അധികാരഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל
  choice: എതിരെയും
  rationale: ന്യായവിധിപ്രഖ്യാപനത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രതികൂലഭാവം നൽകുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബേഥേലിലെ ആരാധനാസംബന്ധിയായ പീഠത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിലുള്ള
  rationale: സ്ഥലനാമത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്ത് ബന്ധവാക്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: സകല പൂജാഗിരികളിലെ ആരാധനാലയങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പൂജാഗിരികളുടെ വീടുകൾ’ മലയാളത്തിൽ അസ്പഷ്ടമായതിനാൽ, בָּתֵּיയുടെ ആരാധനാകേന്ദ്രഭാവവും בָּמוֹתയുടെ പ്രാദേശിക പൂജാസ്ഥലഭാവവും ചേർത്ത് വ്യക്തമാക്കുന്നു.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: ശമര്യയിലെ പട്ടണങ്ങളിൽ
  rationale: നിർമാണബന്ധം നേരിട്ട് നൽകുന്നു; പാഠത്തിലെ ചരിത്രപരമായ സ്ഥലസൂചനയെ തിരുത്തുകയോ മൃദൂകരിക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: הָיֹה יִהְיֶה എന്ന പ്രയോഗത്തിലെ പ്രവാചകീയ ഉറപ്പ്
  choice: നിശ്ചയമായും നിറവേറും
  alternative: തീർച്ചയായും സംഭവിക്കും
  rationale: പദഘടനയിലെ ഊന്നൽ സംരക്ഷിക്കുകയും പ്രവാചകവചനത്തിന്റെ സാക്ഷാത്കാരഭാവം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു; പാഠത്തിനു പുറത്തുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: בָּתֵּי הַבָּמוֹת എന്ന ആരാധനാസംബന്ധിയായ സംയുക്തപ്രയോഗം
  choice: പൂജാഗിരികളിലെ ആരാധനാലയങ്ങൾ
  alternative: പൂജാഗിരികളുടെ വീടുകൾ
  rationale: അക്ഷരാർഥരൂപം മലയാളവായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ ആരാധനാകേന്ദ്രങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; അവയുടെ മതപരമായ സാധുതയെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ കാരണം-ഫലം ബന്ധവും പ്രവാചകപ്രഖ്യാപനത്തിലെ ഉറപ്പും നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദാവലി ഒഴിവാക്കി.
