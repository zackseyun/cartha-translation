    rationale: «പൂജാഗിരികൾ» implies literal hills, whereas בָּמוֹת denotes high places/cult sites and need not identify each site as a hill. The Hebrew also specifically refers to their ‘houses,’ best conveyed contextually as cult buildings/temples.
  - severity: medium
    issue: «യഹോവയുടെ അരുളപ്പാടനുസരിച്ച്» for בִּדְבַר יְהוָה
