translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിച്ചു; ക്ഷണം സ്വാഭാവികമാക്കാൻ തുടർക്രിയയും വിനയസൂചകമായ ‘കഴിക്കൂ’ എന്ന രൂപവും ഉപയോഗിച്ചു.
