  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר הַ/מֶּ֨לֶךְ֙ אֶל אִ֣ישׁ הָ/אֱלֹהִ֔ים בֹּאָ/ה אִתִּ֥/י הַ/בַּ֖יְתָ/ה וּֽ/סְעָ֑דָ/ה וְ/אֶתְּנָ֥ה לְ/ךָ֖ מַתָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ദൈവപുരുഷനോടു പറഞ്ഞു: “എന്നോടൊപ്പം വീട്ടിലേക്കു വന്ന് ഭക്ഷണം കഴിക്കൂ[a]. ഞാൻ നിനക്ക് ഒരു സമ്മാനം തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വയം ശക്തിപ്പെടുത്തുക” / “ആഹാരം കഴിക്കുക”; എബ്രായ ക്രിയയ്ക്ക് സ്വയം ശക്തിപ്പെടുത്തുക അഥവാ പോഷിപ്പിക്കുക എന്നർഥമുണ്ട്; പലപ്പോഴും ഭക്ഷണത്തിലൂടെയുള്ള ഉന്മേഷമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ആഖ്യാനക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വമുള്ള നാമത്തിന്റെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരപ്രയോഗം വ്യാഖ്യാനിച്ച് ‘പ്രവാചകൻ’ എന്നാക്കാതെ അതിന്റെ സവിശേഷ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֹּאָה
  choice: വന്ന്
  rationale: ക്ഷണത്തിന്റെ ഭാഗമായ ആജ്ഞാരൂപം മലയാളത്തിൽ തുടർക്രിയയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אִתִּי הַבַּיְתָה
  choice: എന്നോടൊപ്പം വീട്ടിലേക്കു
  rationale: ദിശാസൂചക പ്രത്യയമുള്ള പദം ‘വീട്ടിലേക്കു’ എന്നും אִתִּי ‘എന്നോടൊപ്പം’ എന്നും കൃത്യമായി നൽകി; വീട് രാജാവിന്റേതാണെന്ന് മൂലപാഠത്തിൽ നേരിട്ട് പറയാത്തതിനാൽ ‘എന്റെ വീട്ടിലേക്ക്’ എന്ന് വ്യക്തമാക്കിയില്ല.
- source_word: וּסְעָדָה
  choice: ഭക്ഷണം കഴിക്കൂ
  rationale: סעד എന്ന ക്രിയയ്ക്ക് സ്വയം ശക്തിപ്പെടുത്തുക/പോഷിപ്പിക്കുക എന്ന വിശാല അർഥമുണ്ടെങ്കിലും ഇവിടെ ഭക്ഷണം നൽകുന്ന ക്ഷണമാണ് സന്ദർഭസൂചന; സാധാരണ മലയാളത്തിൽ അതിനെ ‘ഭക്ഷണം കഴിക്കൂ’ എന്ന് സ്വാഭാവികമായി നൽകി, വിശാല അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: וְאֶתְּנָה לְךָ
  choice: ഞാൻ നിനക്ക് ... തരാം
  rationale: രാജാവിന്റെ വാഗ്ദാനം അല്ലെങ്കിൽ നിർദേശം സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷ ക്രിയയെ സ്വാഭാവിക മലയാള ഭാവികാലത്തിൽ നൽകി.
- source_word: מַתָּת
  choice: ഒരു സമ്മാനം
  rationale: പ്രതിഫലം എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ നിഷ്പക്ഷമായ ‘സമ്മാനം’ തിരഞ്ഞെടുത്തു.
