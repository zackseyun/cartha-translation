translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ആവർത്തനവും ദൃശ്യവിവരവും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ ഒഴിവാക്കിയിടത്ത് അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
