base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: ml
  text: അവൻ പോയി, വഴിയിൽ എറിഞ്ഞിട്ടിരുന്ന അവന്റെ ശവം[a] കണ്ടു. കഴുതയും സിംഹവും ശവത്തിനരികെ നിൽക്കുന്നുണ്ടായിരുന്നു. സിംഹം ശവം തിന്നിരുന്നില്ല; കഴുതയെ കീറിമുറിച്ചിട്ടുമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശവം’ എന്നതിനുപകരം ‘മൃതശരീരം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ נְבֵלָה മരണത്തിന്റെ യാഥാർഥ്യം ഊന്നിപ്പറയുന്ന ശക്തമായ പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘കഴുതയെ തകർത്തിരുന്നില്ല.’ ഇവിടെ സിംഹം കഴുതയെ കീറിമുറിക്കുകയോ കടിച്ചുകീറുകയോ ചെയ്തില്ല എന്നതാണ് സന്ദർഭത്തിലെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: ശവം
  rationale: നְבֵלָה മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്ന ശക്തവും നേരിട്ടുള്ളതുമായ പദമാണ്. മനുഷ്യനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘ശവം’ സ്വാഭാവികവും മൂലപാഠത്തിന്റെ കാഠിന്യം നിലനിർത്തുന്നതുമാണ്.
- source_word: מֻשְׁלֶכֶת
  choice: എറിഞ്ഞിട്ടിരുന്ന
  rationale: שלך എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തം ശരീരം അവിടെ എറിഞ്ഞിടപ്പെട്ട നിലയിലായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു; ‘കിടന്നിരുന്ന’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ ശക്തി ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽ
  rationale: ഇവിടെ דֶּרֶךְ യാത്രാമാർഗത്തെയോ വഴിയെയോ സൂചിപ്പിക്കുന്നു. ‘വഴിയിൽ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: עֹמְדִים אֵצֶל
  choice: അരികെ നിൽക്കുന്നുണ്ടായിരുന്നു
  rationale: കഴുതയും സിംഹവും ശവത്തിനടുത്ത് നിലകൊണ്ടിരുന്ന ദൃശ്യവിവരം ഈ പ്രയോഗം സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: לֹא אָכַל
  choice: തിന്നിരുന്നില്ല
  rationale: אָכַל എന്ന സാധാരണ ‘തിന്നുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; ‘വിഴുങ്ങുക’ പോലുള്ള ശക്തിപ്പെടുത്തൽ ഒഴിവാക്കുന്നു.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: കഴുതയെ കീറിമുറിച്ചിട്ടുമില്ല
  rationale: שׁבר അടിസ്ഥാനമായി ‘തകർക്കുക/ഒടിക്കുക’ എന്നാണ്. സിംഹം ഒരു മൃഗത്തോട് ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘കീറിമുറിക്കുക’ ഉദ്ദേശ്യാർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘കഴുതയെ തകർത്തില്ല’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: അവൻ പോയി ... കണ്ടു
  rationale: തുടർച്ചയായ ആഖ്യാനക്രിയകളുടെ ലളിതമായ പ്രവാഹം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
