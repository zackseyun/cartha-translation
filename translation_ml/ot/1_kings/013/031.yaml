id: 1KI.13.31
reference: 1 Kings 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֮ אַחֲרֵ֣י קָבְר֣/וֹ אֹת/וֹ֒ וַ/יֹּ֤אמֶר אֶל בָּנָי/ו֙ לֵ/אמֹ֔ר בְּ/מוֹתִ/י֙ וּ/קְבַרְתֶּ֣ם אֹתִ֔/י בַּ/קֶּ֕בֶר אֲשֶׁ֛ר אִ֥ישׁ הָ/אֱלֹהִ֖ים קָב֣וּר בּ֑/וֹ אֵ֚צֶל עַצְמֹתָ֔י/ו הַנִּ֖יחוּ אֶת עַצְמֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: ml
  text: 'അവനെ അടക്കംചെയ്തശേഷം, അവൻ തന്റെ പുത്രന്മാരോടു പറഞ്ഞു: “ഞാൻ മരിക്കുമ്പോൾ, ദൈവപുരുഷനെ അടക്കംചെയ്തിരിക്കുന്ന കല്ലറയിൽ എന്നെയും അടക്കംചെയ്യണം. അവന്റെ അസ്ഥികളുടെ അരികിൽ എന്റെ അസ്ഥികളും വെക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: അവനെ അടക്കംചെയ്തശേഷം
  rationale: വാക്യാരംഭത്തിലെ וַיְהִי ഇവിടെ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കൃത്രിമമായ ‘അങ്ങനെ സംഭവിച്ചു’ ചേർക്കാതെ കാലവാക്യത്തിലൂടെ സ്വാഭാവികമായി അതിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: בָּנָיו
  choice: തന്റെ പുത്രന്മാരോട്
  rationale: എബ്രായപദം പൊതുവായി മക്കളെയല്ല, പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തന്റെ’ എന്നത് സർവനാമബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בְּמוֹתִי
  choice: ഞാൻ മരിക്കുമ്പോൾ
  rationale: ഒന്നാംപുരുഷ പ്രത്യയമുള്ള കാലസൂചക രൂപത്തിന്റെ ഭാവികാലസന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: എന്നെയും അടക്കംചെയ്യണം
  rationale: സന്ദർഭത്തിലെ നിർദേശാത്മക ശക്തി ‘ചെയ്യണം’ എന്ന രൂപത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘എന്നെയും’ എന്നത് മുമ്പ് അടക്കംചെയ്ത ദൈവപുരുഷനോടുള്ള ബന്ധം തെളിയിക്കുന്നു.
- source_word: בַּקֶּבֶר
  choice: കല്ലറയിൽ
  rationale: ഒന്നിലധികം അസ്ഥികൾ സൂക്ഷിക്കാവുന്ന നിർദിഷ്ട ശവസംസ്കാരസ്ഥലത്തെ ‘കല്ലറ’ യോജിച്ച വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പാഠത്തിലെ സ്ഥിരമായ പദവിയെ നേരിട്ട് പകർത്തുന്നു; ‘പ്രവാചകൻ’ എന്ന കൂടുതൽ ചുരുങ്ങിയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: קָבוּר בּוֹ
  choice: അടക്കംചെയ്തിരിക്കുന്ന
  rationale: എബ്രായത്തിലെ സ്ഥിതിവാചക കർമണി രൂപം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֵצֶל
  choice: അരികിൽ
  rationale: സമീപസ്ഥാനം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: അവന്റെ അസ്ഥികൾ ... എന്റെ അസ്ഥികൾ
  rationale: ‘ശേഷിപ്പുകൾ’ എന്ന് പൊതുവാക്കാതെ മൂലപാഠത്തിലെ ദൃശ്യവും പിന്നീട് കഥാപരമായി പ്രധാനവുമായ ‘അസ്ഥികൾ’ നിലനിർത്തുന്നു.
- source_word: הַנִּיחוּ
  choice: വെക്കണം
  rationale: പുത്രന്മാർക്കുള്ള നേരിട്ടുള്ള നിർദേശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മൂലത്തിലെ ആവർത്തനമായ ‘അസ്ഥികൾ’ സംരക്ഷിച്ചു; കഥാപ്രവാഹം അസ്വാഭാവികമാക്കുന്ന ശാബ്ദിക വാക്യാരംഭം ഒഴിവാക്കി.
