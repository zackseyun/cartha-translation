  to: 'അപ്പോൾ രാജാവ് ദൈവപുരുഷനോടു മറുപടിയായി പറഞ്ഞു: “ദയവായി നിന്റെ ദൈവമായ യഹ്‌വെയുടെ പ്രീതി യാചിച്ച്[a] എനിക്കുവേണ്ടി പ്രാർഥിക്കണമേ; എന്റെ കൈ എനിക്കു പുനഃസ്ഥാപിക്കപ്പെടട്ടെ.” അങ്ങനെ ദൈവപുരുഷൻ യഹ്‌വെയുടെ പ്രീതി യാചിച്ചു; രാജാവിന്റെ കൈ അവനു പുനഃസ്ഥാപിക്കപ്പെടുകയും മുമ്പത്തേതുപോലെ ആകുകയും ചെയ്തു.'
