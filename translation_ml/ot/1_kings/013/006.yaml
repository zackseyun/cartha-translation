  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് ദൈവപുരുഷനോടു മറുപടിയായി പറഞ്ഞു: “ദയവായി നിന്റെ ദൈവമായ യഹ്‌വെയുടെ പ്രീതി യാചിച്ച്[a] എനിക്കുവേണ്ടി പ്രാർഥിക്കണമേ; എന്റെ കൈ എനിക്കു പുനഃസ്ഥാപിക്കപ്പെടട്ടെ.” അങ്ങനെ ദൈവപുരുഷൻ യഹ്‌വെയുടെ പ്രീതി യാചിച്ചു; രാജാവിന്റെ കൈ അവനു പുനഃസ്ഥാപിക്കപ്പെടുകയും മുമ്പത്തേതുപോലെ ആകുകയും ചെയ്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ പ്രസാദം തേടി.” എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം “യഹ്‌വെയുടെ മുഖം യാചിച്ച്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: യഹ്‌വെയുടെ പ്രീതി യാചിക്കുക / യാചിച്ചു
  rationale: ‘മുഖത്തോട് അപേക്ഷിക്കുക’ എന്ന എബ്രായ ശൈലി ഒരാളുടെ പ്രീതി തേടുകയോ യാചിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രീതി യാചിക്കുക’ എന്നത് ആ ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘പ്രസാദിപ്പിക്കുക’ എന്നത് സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം ശമിപ്പിക്കൽ എന്ന ആശയം നൽകാനിടയുണ്ട്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ
  rationale: രാജാവ് യഹ്‌വെയെ ദൈവപുരുഷന്റെ ദൈവമായി അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചനരൂപം അതേപടി നിലനിർത്തുന്നു.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: എനിക്കുവേണ്ടി പ്രാർഥിക്കണമേ
  rationale: בעד ചേർന്ന ഹിത്പഅേൽ ക്രിയ മറ്റൊരാളിനുവേണ്ടിയുള്ള പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ആ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: എന്റെ കൈ എനിക്കു തിരികെ ലഭിക്കട്ടെ / രാജാവിന്റെ കൈ അവനു തിരികെ ലഭിച്ചു
  rationale: ‘കൈ അവനിലേക്കു മടങ്ങുക’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് രോഗാവസ്ഥയിൽനിന്നുള്ള പുനഃസ്ഥാപനം മലയാളത്തിൽ മനസ്സിലാകുന്നവിധം അവതരിപ്പിക്കുന്നു.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: മുമ്പത്തെപ്പോലെയായി
  rationale: കൈ അതിന്റെ മുൻസ്ഥിതിയിലേക്കു പുനഃസ്ഥാപിക്കപ്പെട്ടുവെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ പ്രത്യേക ബിരുദം ‘പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ‘ഉത്തരം നൽകി പറഞ്ഞു’ എന്ന എബ്രായ ആഖ്യാനസംയോജനത്തിന്റെ ഇരട്ടസ്വഭാവം അസ്വാഭാവികമായ ആവർത്തനമില്ലാതെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: രാജാവിന്റെ വാക്കുകളിൽ യഹ്‌വെയെ ‘നിന്റെ ദൈവം’ എന്നു വിളിക്കുന്നത്
  choice: നിന്റെ ദൈവമായ യഹ്‌വെ
  alternative: നമ്മുടെ ദൈവമായ യഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ രണ്ടാംപുരുഷ ഏകവചനം രാജാവിനും ദൈവപുരുഷനും ഇടയിലെ നിലപാടുവ്യത്യാസമോ അകൽച്ചയോ തുറന്നുവെക്കുന്നു. ‘നമ്മുടെ’ എന്നു മാറ്റുന്നത് പാഠത്തിൽ ഇല്ലാത്ത ഉടമ്പടിസൗഹൃദം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘യഹ്‌വെ’ എന്ന വ്യക്തിനാമവും ‘ദൈവപുരുഷൻ’ എന്ന മൂലബിരുദവും നിലനിർത്തി; പ്രാർഥനാഭ്യർഥനയിൽ ആദരസൂചകമായ ‘പ്രാർഥിക്കണമേ’ ഉപയോഗിച്ചു.
