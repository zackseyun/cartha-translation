source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: ml
  text: ഈ കാര്യം[a] യൊരോബെയാമിന്റെ ഭവനത്തിന് പാപമായിത്തീർന്നു; അതിനെ ഭൂമുഖത്തുനിന്ന്[b] തുടച്ചുനീക്കാനും നശിപ്പിക്കാനും ഇടയാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാര്യം” എന്നതിന് “സംഭവം” അഥവാ “പ്രവൃത്തി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “നിലത്തിന്റെ മുഖത്തുനിന്ന്”; ഭൂമിയിൽനിന്നോ ദേശത്തുനിന്നോ പൂർണമായി നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിത്തീർന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയ മുൻപ് വിവരിച്ച കാര്യം യൊരോബെയാമിന്റെ ഭവനത്തിന് പാപമായി പരിണമിച്ചതിന്റെ ഫലം സൂചിപ്പിക്കുന്നു.
- source_word: בַּדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דָּבָר ഇവിടെ ഒരു വാക്കിനെയല്ല, മുമ്പ് വിവരിച്ച പ്രവൃത്തിയെയോ സംഭവപരമ്പരയെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְחַטָּאת
  choice: പാപം
  rationale: היה לְחַטָּאת എന്ന പ്രയോഗത്തിന്റെ ഫലസൂചക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭവനം
  rationale: בֵּית എന്ന എബ്രായ രൂപകം കുടുംബവംശത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കാം; 'ഭവനം' ആ രൂപകവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: וּלְהַכְחִיד
  choice: തുടച്ചുനീക്കാൻ
  rationale: Hiphil രൂപത്തിലുള്ള כחד അപ്രത്യക്ഷമാക്കുക, ഇല്ലാതാക്കുക എന്ന കാരണാർഥം നൽകുന്നു; അടുത്തുള്ള 'നശിപ്പിക്കുക' എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും ഇത് കാക്കുന്നു.
- source_word: וּלְהַשְׁמִיד
  choice: നശിപ്പിക്കാൻ
  rationale: שמד എന്ന ക്രിയയുടെ ശക്തമായ വിനാശാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്തുനിന്ന്
  rationale: എബ്രായത്തിലെ 'നിലത്തിന്റെ മുഖത്തുനിന്ന്' എന്ന ശൈലിയുടെ ഗൗരവവും പൂർണമായ നീക്കത്തിന്റെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിനാശക്രിയകളുടെ സൂചിത കർമം
  choice: യൊരോബെയാമിന്റെ ഭവനം/വംശം
  alternative: പാപകരമായ കാര്യം തന്നെയാണ് കർമം
  rationale: വാക്യഘടനയിലും കഥാസന്ദർഭത്തിലും ഏറ്റവും അടുത്തതും യോജിച്ചതുമായ കർമം 'യൊരോബെയാമിന്റെ ഭവനം' ആണ്. മലയാളത്തിലെ 'അതിനെ' ഈ സൂചിത കർമം വ്യക്തമാക്കുന്നു.
- issue: അവസാനത്തെ ഉദ്ദേശ്യ/ഫലബന്ധം
  choice: ന്യായവിധിയുടെ ഫലത്തിലേക്ക് നയിച്ചുവെന്ന അർഥത്തിൽ 'ഇടയാക്കി'
  alternative: നേരിട്ടുള്ള ഉദ്ദേശ്യമായി 'ചെയ്യേണ്ടതിന്'
  rationale: לְ പ്രത്യയമുള്ള infinitive-കൾ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. ഇവിടെ പാപത്തിന്റെ പരിണതിയായ വംശനാശം എന്ന കഥാസംബന്ധം സ്വാഭാവികമാണ്; അതിനാൽ ഫലസൂചന നൽകി, നിർബന്ധിതമായ ദൈവശാസ്ത്രപരമായ ഉദ്ദേശ്യവായന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'ഭവനം' എന്ന പദം കുടുംബം/രാജവംശം എന്ന എബ്രായ രൂപകത്തിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ക്രമമായി ചേർത്തിരിക്കുന്നു.
