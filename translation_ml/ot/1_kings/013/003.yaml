id: 1KI.13.3
reference: 1 Kings 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: ml
  text: 'ആ ദിവസം അവൻ ഒരു അടയാളം[a] നൽകി; അവൻ പറഞ്ഞു: “യഹ്‌വെ അരുളിച്ചെയ്ത അടയാളം ഇതാണ്: ഇതാ, യാഗപീഠം പിളർന്നുപോകും; അതിന്മേലുള്ള ചാരം[b] ചൊരിയപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടയാളം” എന്നതിനുള്ള എബ്രായപദം (מוֹפֵת) “അത്ഭുതം” എന്നോ “മുൻസൂചന” എന്നോ അർഥമാക്കാനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: “ചാരം” എന്ന എബ്രായപദം യാഗങ്ങളിൽനിന്നുള്ള കൊഴുപ്പുകലർന്ന ചാരത്തെയോ ശേഷിപ്പുകളെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: നൽകി
  rationale: נתן എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘നൽകുക’ എന്നത് מוֹפֵת-നോടൊപ്പം പ്രവചനത്തെ സ്ഥിരീകരിക്കുന്ന അടയാളം നൽകിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מוֹפֵת
  choice: അടയാളം
  rationale: ഇവിടെ ഈ പദം പ്രവചനവചനത്തെ സ്ഥിരീകരിക്കുന്ന ദൃശ്യസംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘അത്ഭുതം’ എന്നതിനെക്കാൾ ‘അടയാളം’ സന്ദർഭത്തിന് യോജിക്കുകയും പദത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തതിന്റെ
  rationale: ദൈവനാമം നിലനിർത്തിക്കൊണ്ട്, മുമ്പ് ഉച്ചരിക്കപ്പെട്ട പ്രവചനവചനത്തെയാണ് ഈ അടയാളം സ്ഥിരീകരിക്കുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: പ്രവചനപ്രഖ്യാപനത്തിലെ ശ്രദ്ധാകർഷകവും ഗൗരവമുള്ളതുമായ ദൈക്തിക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പണത്തിനുള്ള ആരാധനാസംബന്ധിയായ പീഠത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: נִקְרָע
  choice: പിളർന്നുപോകും
  rationale: നിഫാൽ രൂപത്തിന്റെ സംഭവാത്മക/നിഷ്ക്രിയ ഭാവവും സന്ദർഭത്തിലെ ഭാവികാല പ്രവചനവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְנִשְׁפַּךְ
  choice: ചൊരിഞ്ഞുപോകും
  rationale: שׁפך എന്ന പദത്തിന്റെ ‘ഒഴുകിപ്പോകുക/ചൊരിയപ്പെടുക’ എന്ന അർഥം, പീഠത്തിന്മേലുള്ള ചാരം താഴേക്ക് വീഴുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַדֶּשֶׁן
  choice: ചാരം
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം; യാഗങ്ങളിൽനിന്നുള്ള കൊഴുപ്പുകലർന്ന ചാരാവശിഷ്ടം എന്ന പ്രത്യേക സാംസ്കാരിക സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר עָלָיו
  choice: അതിന്മേലുള്ള
  rationale: ചാരം യാഗപീഠത്തിന്മേലാണെന്ന ബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു; മലയാളത്തിൽ സാധാരണ വായിക്കാവുന്ന രൂപമാണ് ‘യഹ്‌വെ’.
- issue: അടയാളവും അത്ഭുതവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: അടയാളം
  alternative: അത്ഭുതം / ശകുനം
  rationale: സംഭവം അത്ഭുതകരമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അതിന്റെ പ്രധാന ധർമ്മം പ്രവചനത്തെ സ്ഥിരീകരിക്കലാണ്. അതിനാൽ ‘അടയാളം’ തിരഞ്ഞെടുക്കുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവചനവിവരണശൈലി സ്വീകരിച്ചു. ‘ഇതാ’ എന്ന പദം മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. സാങ്കേതിക യാഗപദാവലി മുഖ്യവാക്യത്തിൽ ഭാരം കൂട്ടാതിരിക്കാൻ അതിന്റെ പ്രത്യേക സൂചന അടിക്കുറിപ്പിലാക്കി.
