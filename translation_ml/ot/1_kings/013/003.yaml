  terminology: “അടയാളം” suitably renders מוֹפֵת in this validating-prophetic context; “യാഗപീഠം,” “യഹ്‌വെ,” and “ചാരം” are appropriate. The footnotes preserve the lexical and cultic nuances without overinterpreting them.
