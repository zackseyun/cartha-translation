  source_fidelity: The draft accurately conveys the sign, Yahweh’s speech, the altar’s rupture, and the sacrificial ashes. However, “ചൊരിഞ്ഞുപോകും” is less precise for the Niphal וְנִשְׁפַּךְ (“will be poured out/spilled”); a passive Malayalam form better represents the Hebrew.
