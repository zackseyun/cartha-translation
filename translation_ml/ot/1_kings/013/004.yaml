base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: ml
  text: ബേഥേലിലെ യാഗപീഠത്തിനെതിരെ വിളിച്ചുപറഞ്ഞ ദൈവപുരുഷന്റെ വാക്കു രാജാവു കേട്ടപ്പോൾ, യൊരോബെയാം യാഗപീഠത്തിന്മേൽനിന്നു കൈ നീട്ടി, “അവനെ പിടിക്കുവിൻ!” എന്നു പറഞ്ഞു. എന്നാൽ അവനെതിരെ നീട്ടിയ അവന്റെ കൈ വരണ്ടുപോയി[a]; അത് തന്റെ അടുക്കലേക്കു തിരികെ കൊണ്ടുവരാൻ അവനു കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ശോഷിച്ചുപോയി.” എബ്രായത്തിൽ അക്ഷരാർഥം: “വരണ്ടുപോയി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: വാക്ക്
  rationale: പ്രവാചകപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം നിലനിർത്തുകയും ‘സന്ദേശം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ബഹുമാനസൂചക പദവിയെ ‘ദൈവത്തിന്റെ പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിച്ചുമാറ്റാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: קָרָא עַל
  choice: എതിരെ വിളിച്ചുപറഞ്ഞ
  rationale: קרא എന്നതിലെ ഉച്ചത്തിലുള്ള പ്രഖ്യാപനവും על എന്നതിലെ പ്രതികൂല ദിശയും സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിലെ
  rationale: സ്ഥലനാമത്തെ മലയാളത്തിലെ പതിവു ലിപ്യന്തരണത്തിൽ നൽകുകയും യാഗപീഠത്തിന്റെ സ്ഥലം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽനിന്നു കൈ നീട്ടി
  rationale: കൈ നീട്ടുന്ന ശത്രുതാപരമായ ആംഗ്യവും מֵעַל എന്ന സ്ഥലബന്ധവും ഉറവിടത്തോട് അടുത്തുനിന്ന് സംരക്ഷിക്കുന്നു.
- source_word: תִּפְשֻׂהוּ
  choice: അവനെ പിടിക്കുവിൻ!
  rationale: ബഹുവചന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; ‘അറസ്റ്റുചെയ്യുക’ എന്ന ആധുനിക നിയമപരമായ സൂചന ചേർക്കുന്നില്ല.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: അവന്റെ കൈ വരണ്ടുപോയി
  rationale: יבש എന്ന ക്രിയയുടെ അടിസ്ഥാന ദൃശ്യരൂപം നേരിട്ട് നൽകുന്നു; വൈദ്യശാസ്ത്രപരമായ രോഗനിർണയം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: അവനെതിരെ നീട്ടിയ
  rationale: ആ കൈ ഏതാണെന്നു തിരിച്ചറിയിക്കുന്ന ആവർത്തനവും ആംഗ്യത്തിന്റെ ശത്രുതാപരമായ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: അതു തിരികെ തന്റെ അടുക്കലേക്കു വലിക്കാൻ
  rationale: ശരീരത്തിലേക്കു കൈ മടക്കിക്കൊണ്ടുവരാൻ കഴിയാതിരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യൊരോബെയാമിന്റെ കൈക്കുണ്ടായ ന്യായവിധിയുടെ സ്വഭാവം
  choice: കൈ പെട്ടെന്നു പ്രവർത്തനരഹിതമായതിനെ ‘വരണ്ടുപോയി’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; വൈദ്യശാസ്ത്രപരമായ വിശദീകരണം നൽകുന്നില്ല.
  alternative: ‘ശോഷിച്ചുപോയി’ അല്ലെങ്കിൽ ‘വാടിപ്പോയി’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: വിവരണം ഉടനടിയുള്ള അത്ഭുതകരമായ ന്യായവിധിയായി സംഭവത്തെ അവതരിപ്പിക്കുന്നു. മൂലപദത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നത് സംഭവത്തിന്റെ ശക്തി സംരക്ഷിക്കുകയും പാഠത്തിനപ്പുറമുള്ള വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ദൈവപുരുഷൻ,’ ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘വരണ്ടുപോയി’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
