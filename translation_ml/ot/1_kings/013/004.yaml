    issue: The final expression “അതു തിരികെ തന്റെ അടുക്കലേക്കു വലിക്കാൻ” is somewhat awkward for an incapacitated hand.
    rationale: The Hebrew לַהֲשִׁיבָהּ אֵלָיו means to cause it to return to himself. Replacing “വലിക്കാൻ” with “തിരികെ കൊണ്ടുവരാൻ” is more idiomatic Malayalam while preserving the physical sense and ambiguity.
