source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: ml
  text: 'യൂദായിൽനിന്ന് വന്ന ദൈവപുരുഷനോട് അവൻ ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നീ യഹോവയുടെ വാക്കിനെതിരെ മത്സരിക്കുകയും[a] നിന്റെ ദൈവമായ യഹോവ നിന്നോടു കല്പിച്ച കല്പന പാലിക്കാതിരിക്കുകയും ചെയ്തതിനാൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “യഹോവയുടെ വായ്ക്കെതിരെ മത്സരിച്ചു”; യഹോവ അരുളിച്ചെയ്തതിനെ ധിക്കരിച്ചു എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: പ്രവാചകീയമായ ഈ കുറ്റപ്രഖ്യാപനത്തിന്റെ ശക്തി പ്രകടമാക്കുന്നതിനൊപ്പം ‘വിളിക്കുക/പ്രഖ്യാപിക്കുക’ എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ ബഹുമാനപദവി വ്യാഖ്യാനിച്ച് ‘പ്രവാചകൻ’ എന്നാക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מִיהוּדָה
  choice: യൂദായിൽനിന്നു
  rationale: ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ പതിവു പ്രഖ്യാപനസൂത്രം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: יַעַן כִּי
  choice: ചെയ്തതിനാൽ
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מָרִיתָ
  choice: മത്സരിച്ചു
  rationale: കേവലമായ അനുസരണക്കേടിനെക്കാൾ ശക്തമായ എതിർപ്പും കലാപഭാവവും ഈ ക്രിയയിൽ ഉള്ളതിനാൽ ‘മത്സരിച്ചു’ എന്നു നൽകുന്നു.
- source_word: פִּי יְהוָה
  choice: യഹോവയുടെ വാക്ക്
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായ്’ എന്നുള്ള എബ്രായ പ്രയോഗം യഹോവ അരുളിച്ചെയ്തതിനെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ സ്വാഭാവിക മലയാള തുല്യം ഉപയോഗിക്കുന്നു.
- source_word: שָׁמַרְתָּ
  choice: പാലിച്ചില്ല
  rationale: കല്പനയോടൊപ്പം വരുമ്പോൾ ‘കാത്തുസൂക്ഷിക്കുക/അനുഷ്ഠിക്കുക’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמִּצְוָה
  choice: കല്പന
  rationale: ഏകവചനത്തിലുള്ള ദൈവിക നിർദേശം സംക്ഷിപ്തവും സ്ഥാപിതവുമായ മലയാള പദത്തിലൂടെ നൽകുന്നു.
- source_word: צִוְּךָ
  choice: നിന്നോടു കല്പിച്ച
  rationale: צוה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കല്പനാർഥവും രണ്ടാംപുരുഷ ഏകവചനവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: നിന്റെ ദൈവമായ യഹോവ
  rationale: ഉടമ്പടിസംബന്ധിയായ വ്യക്തിപരമായ ബന്ധവും ദൈവനാമവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: מָרִיתָ എന്ന ക്രിയയുടെ ശക്തി
  choice: മത്സരിച്ചു
  alternative: അനുസരിച്ചില്ല
  rationale: ഈ ക്രിയ സാധാരണ അനുസരണക്കേടിനെക്കാൾ ശക്തമായ ധിക്കാരവും കലാപവും സൂചിപ്പിക്കുന്നു; അതിനാൽ കുറ്റാരോപണത്തിന്റെ ഉടമ്പടിപരമായ ഗൗരവം ലഘൂകരിച്ചില്ല.
- issue: פִּי יְהוָה എന്ന പ്രയോഗം
  choice: യഹോവയുടെ വാക്ക്
  alternative: യഹോവയുടെ വായ്
  rationale: അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചുകൊണ്ട്, പ്രധാനപാഠത്തിൽ യഹോവ അരുളിച്ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയുടെ സ്വാഭാവിക അർഥം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള പ്രവാചകീയ ശൈലി ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്യുന്നു’, ‘കല്പന’, ‘ദൈവപുരുഷൻ’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച മാന്യത നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എബ്രായവാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിലെ അപൂർണമായ കാരണഘടനയും ചിഹ്നനവും സംരക്ഷിച്ചു.
