  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “എനിക്ക് നിന്നോടൊപ്പം മടങ്ങാനോ നിന്നോടൊപ്പം വരാനോ കഴിയില്ല. ഈ സ്ഥലത്തുവെച്ച് ഞാൻ നിന്നോടൊപ്പം അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്യില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യത്തെ രണ്ടു ‘നിന്നോടൊപ്പം’ പ്രയോഗങ്ങളിലും ഹീബ്രു സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഉപയോഗിക്കുന്നു; തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള പ്രയോഗത്തിൽ പുരുഷലിംഗ ഏകവചന പ്രത്യയമാണ്. മലയാളത്തിലെ ‘നിന്നോടൊപ്പം’ ഈ ലിംഗവ്യത്യാസം പ്രകടമാക്കുന്നില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനതുടർച്ച നൽകുന്നു; וַ־യെ പ്രത്യേകം ‘പിന്നെ/എന്നാൽ’ എന്നു വ്യാഖ്യാനിച്ച് അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: לֹא אוּכַל
  choice: എനിക്ക് … കഴിയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ יכל ഇവിടെ കഴിവില്ലായ്മയെയോ അനുമതിയില്ലായ്മയെയോ സൂചിപ്പിക്കുന്നു. ‘കഴിയില്ല’ ഈ അർഥവ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לָשׁוּב
  choice: മടങ്ങാൻ
  rationale: שׁוב എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘മടങ്ങുക’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: וְלָבוֹא אִתָּךְ
  choice: കൂടെ വരാൻ
  rationale: בוא സന്ദർഭവും ദൃഷ്ടികോണവും അനുസരിച്ച് ‘വരുക/പോകുക/പ്രവേശിക്കുക’ എന്നാകാം. ഇവിടെ ക്ഷണിച്ചയാളോടൊപ്പം അവന്റെ വീട്ടിലേക്കുള്ള സഞ്ചാരമാണ് ഉദ്ദേശിക്കുന്നത്; ലക്ഷ്യസ്ഥാനത്തിലേക്ക് ‘പ്രവേശിക്കുക’ എന്ന ആശയം നിർബന്ധമായി ചേർക്കാതെ ‘കൂടെ വരാൻ’ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: അപ്പം തിന്നുകയോ … ഇല്ല
  rationale: לֶחֶם എന്നത് പൊതുവായി ഭക്ഷണത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, ചുറ്റുപാടിലുള്ള ആവർത്തിത കല്പനയുടെ വാചകരൂപം നിലനിർത്താൻ ‘അപ്പം’ എന്ന മൂർത്തപദം ഉപയോഗിക്കുന്നു. אֹכַל ഇവിടെ יכל അല്ല, ‘തിന്നുക’ എന്ന אכל ക്രിയയാണ്.
- source_word: וְלֹא אֶשְׁתֶּה … מַיִם
  choice: വെള്ളം കുടിക്കുകയോ ഇല്ല
  rationale: അപ്പം തിന്നുന്നതും വെള്ളം കുട Jenningsിക്കുന്നതും ഒരേ നിഷേധഘടനയിൽ സ്വാഭാവിക മലയാളത്തിൽ ഏകോപിപ്പിക്കുന്നു; ‘വെള്ളം’ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തുവെച്ച്
  rationale: സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം നൽകുന്നു.
