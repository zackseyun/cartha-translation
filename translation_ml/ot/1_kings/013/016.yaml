  source_fidelity: The draft accurately conveys the overall refusal and retains the Hebrew’s shift between inability (‘cannot’) and resolve (‘will not’). However, the second occurrence of ‘with you’ in the first coordinated pair is reduced to ‘കൂടെ’ (‘together’), rather than being explicitly retained. The source repeats the prepositional phrase, and the Malayalam can preserve this without becoming unnatural.
