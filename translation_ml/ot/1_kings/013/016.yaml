  terminology: ‘അപ്പം,’ ‘വെള്ളം,’ ‘മടങ്ങുക,’ and ‘നിന്നോടൊപ്പം’ are appropriate. The footnote correctly identifies the Hebrew feminine-to-masculine suffix shift and appropriately explains that Malayalam does not express it in this wording.
  issues:
