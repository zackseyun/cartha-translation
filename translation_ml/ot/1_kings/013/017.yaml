id: 1KI.13.17
reference: 1 Kings 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, യഹോവയുടെ വചനത്താൽ എന്നോട് ഇപ്രകാരം അരുളിച്ചെയ്തിരുന്നു: ‘നീ അവിടെ അപ്പം തിന്നരുത്; വെള്ളം കുടിക്കരുത്; നീ പോയ വഴിയിലൂടെ മടങ്ങിപ്പോകരുത്.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനത്താൽ എന്നോട് ഇപ്രകാരം അരുളിച്ചെയ്തിരുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യഹോവയുടെ വചനത്താൽ ഒരു വചനം എന്നിലേക്കുണ്ടായി’ എന്ന ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ദൈവിക സന്ദേശം ലഭിച്ചതെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: നീ ... അപ്പം തിന്നരുത്
  rationale: לֶחֶם എന്നത് ഇവിടെ സാധാരണ അർഥമായ ‘അപ്പം/ഭക്ഷണം’ സൂചിപ്പിക്കുന്നു; മൂലപദത്തോട് അടുത്തുനിൽക്കാൻ ‘അപ്പം’ നിലനിർത്തി.
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: മടങ്ങിപ്പോകരുത്
  rationale: ‘തിരിഞ്ഞ് പോകുക/മടങ്ങിപ്പോകുക’ എന്ന സംയുക്ത ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: നീ പോയ വഴിയിലൂടെ
  rationale: ‘നീ ഏതു വഴിയിലൂടെ പോയോ, ആ വഴിയിലൂടെ’ എന്ന ബന്ധവാക്യത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമം יהוה
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ പ്രതിനിധീകരിക്കുന്നു; പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- issue: דָבָר ... בִּדְבַר יְהוָה എന്ന ഇരട്ട ‘വചനം’ പ്രയോഗം
  choice: യഹോവയുടെ വചനത്താൽ എന്നോട് ഇപ്രകാരം അരുളിച്ചെയ്തിരുന്നു
  alternative: യഹോവയുടെ വചനത്താൽ ഒരു വചനം എന്നിലേക്കു വന്നു
  rationale: ദൈവിക വെളിപ്പാടെന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യവും അസ്വാഭാവികവുമായ പദാവർത്തനം ഒഴിവാക്കുന്നു; സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തിൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും തിരുവെഴുത്തിന് യോജിച്ച മാന്യതയുള്ളതുമായ ശൈലി. ഉദ്ധരിച്ച കല്പനകളിൽ ഏകവചന അഭിസംബോധന നിലനിർത്തി; മൂലത്തിലെ നിരോധനങ്ങളുടെ ക്രമവും സ്ഥലസൂചനയും സംരക്ഷിച്ചു.
