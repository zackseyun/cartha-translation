  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ദൈവപുരുഷൻ’ എന്ന സ്ഥാപിത ബൈബിൾപദവി നിലനിർത്തി. മൂലപാഠത്തിലെ ഏകവചനത്തിൽനിന്നുള്ള ബഹുവചനമാറ്റം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചതിനാൽ അവസാന ഭാഗം സാധാരണ മലയാളത്തേക്കാൾ അല്പം അസാധാരണമായി കേൾക്കാം.
