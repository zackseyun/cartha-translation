base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: ml
  text: ബേഥേലിൽ താമസിച്ചിരുന്ന വൃദ്ധനായ ഒരു പ്രവാചകൻ[a] ഉണ്ടായിരുന്നു. അവന്റെ മകൻ വന്ന്, ദൈവപുരുഷൻ അന്ന് ബേഥേലിൽ ചെയ്ത പ്രവൃത്തി മുഴുവനും രാജാവിനോടു പറഞ്ഞ വാക്കുകളും അവനോടു വിവരിച്ചു; അവർ അവയെ തങ്ങളുടെ അപ്പനോടു വിവരിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു പ്രത്യേക വൃദ്ധനായ പ്രവാചകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ אֶחָד എന്ന പദം അനിശ്ചിതമായ ഒരാളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠം ആദ്യം ‘അവന്റെ മകൻ വന്ന് അവനോടു വിവരിച്ചു’ എന്ന് ഏകവചനത്തിലും, അവസാനം ‘അവർ അവയെ തങ്ങളുടെ അപ്പനോടു വിവരിച്ചു’ എന്ന് ബഹുവചനത്തിലും പറയുന്നു. ഒന്നിലധികം പുത്രന്മാർ ഉണ്ടായിരുന്നുവെന്ന് ഇത് സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ പാഠത്തിലോ ആഖ്യാനത്തിലോ ഉള്ള ക്രമക്കേടായിരിക്കാം. ഈ പരിഭാഷ ആ മാറ്റം പൊരുത്തപ്പെടുത്തി നീക്കാതെ നിലനിർത്തുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: വൃദ്ധനായ ഒരു പ്രവാചകൻ
  rationale: אֶחָד ഇവിടെ അനിശ്ചിതനായ ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘വൃദ്ധനായ ഒരു പ്രവാചകൻ’ എന്നത് അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘ഒരു പ്രത്യേക പ്രവാചകൻ’ എന്ന ഊന്നൽ മൂലപാഠം നിർബന്ധിക്കുന്നില്ല.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: ബേഥേലിൽ താമസിച്ചിരുന്ന
  rationale: יֹשֵׁב എന്നതിന്റെ അക്ഷരാർഥം ‘ഇരിക്കുന്ന’ എന്നാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് അവിടെ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּבֹא בְנוֹ
  choice: അവന്റെ മകൻ വന്ന്
  rationale: בְנוֹ വ്യാകരണപരമായി ഏകവചനമാണ്. അതിനാൽ പിന്നീട് വരുന്ന ബഹുവചനവുമായി പൊരുത്തപ്പെടുത്താൻ ഏകവചനം മാറ്റിയിട്ടില്ല.
- source_word: וַיְסַפֶּר לוֹ
  choice: അവനോടു വിവരിച്ചു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ നടന്നതും പറഞ്ഞതും വിശദമായി അറിയിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: ചെയ്ത പ്രവൃത്തി മുഴുവനും
  rationale: מַעֲשֶׂה ഏകവചനമായതിനാൽ ‘പ്രവൃത്തി’ എന്ന ഏകവചനം നിലനിർത്തി; כָּל നൽകുന്ന സമഗ്രത ‘മുഴുവനും’ എന്നതിലൂടെ അറിയിച്ചു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: മുൻപ്രവാചകഗ്രന്ഥങ്ങളിൽ പ്രവാചകനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പദവിയാണ്; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ രൂപം ഉപയോഗിച്ചു.
- source_word: הַיּוֹם
  choice: അന്ന്
  rationale: ഭൂതകാല ആഖ്യാനത്തിൽ ‘അന്ന്’ സ്വാഭാവികമാണ്; സംഭവദിവസത്തെ തന്നെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: രാജാവിനോടു പറഞ്ഞ വാക്കുകളും
  rationale: דְּבָרִים എന്ന ‘വാക്കുകൾ’ പ്രവൃത്തിയിൽനിന്നു വേറിട്ട പ്രവാചകപ്രസംഗമായി മൂലപാഠം അവതരിപ്പിക്കുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തി.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: അവർ അവയെ തങ്ങളുടെ അപ്പനോടു വിവരിച്ചു
  rationale: ക്രിയയും ‘തങ്ങളുടെ അപ്പൻ’ എന്ന പ്രത്യയവും ബഹുവചനത്തിലാണ്; ബഹുവചന കർമപ്രത്യയവും ‘അവയെ’ എന്ന് നിലനിർത്തി. മുൻവാക്യത്തിലെ ഏകവചനവുമായി പൊരുത്തപ്പെടുത്താതെ മൂലപാഠത്തിലെ മാറ്റം സംരക്ഷിച്ചു.
