translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആഖ്യാനത്തിന്റെ തുടർച്ച നിലനിർത്താൻ ആദ്യവാക്യത്തിൽ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; ‘വൃദ്ധപ്രവാചകൻ’ പ്രായസൂചനയായി വായിക്കപ്പെടുന്ന വിധം ചേർത്തെഴുതി.
