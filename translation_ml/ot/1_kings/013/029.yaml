id: 1KI.13.29
reference: 1 Kings 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: ml
  text: അപ്പോൾ ആ പ്രവാചകൻ ദൈവപുരുഷന്റെ ശവശരീരം എടുത്ത് കഴുതപ്പുറത്തു വെച്ച് തിരികെ കൊണ്ടുവന്നു. വിലപിക്കാനും[a] അവനെ അടക്കം ചെയ്യാനുമായി അവൻ വൃദ്ധപ്രവാചകന്റെ പട്ടണത്തിലെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചരമവിലാപം നടത്താനും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയയ്ക്ക് ശവസംസ്കാരത്തോടനുബന്ധിച്ച വിലാപത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: എടുത്ത്
  rationale: נשא എന്ന ക്രിയയുടെ ‘എടുക്കുക, ഉയർത്തുക, ചുമക്കുക’ എന്നീ അർഥങ്ങളിൽ, തുടർന്നുള്ള ഗതാഗതപ്രവർത്തനവുമായി സ്വാഭാവികമായി ചേരുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: נִבְלַת אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷന്റെ ശവശരീരം
  rationale: נבלה മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്നു; ‘ശവശരീരം’ കൃത്യവും മാന്യവുമാണ്. אִישׁ הָאֱלֹהִים എന്ന സ്ഥിരമായ വിശേഷണം ‘ദൈവപുരുഷൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: കഴുതപ്പുറത്തു വെച്ച്
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ‘വയ്ക്കുക/സ്ഥാപിക്കുക’ എന്നാണ്; אֶל എന്നത് ഈ സാഹചര്യത്തിൽ കഴുതയുടെ മേൽ വയ്ക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיְשִׁיבֵהוּ
  choice: തിരികെ കൊണ്ടുവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ കൊണ്ടുവരുക’ എന്നാണ്. മലയാളത്തിൽ കർമം മുൻവാക്യഭാഗത്തിൽ വ്യക്തമായതിനാൽ സർവനാമം ആവർത്തിക്കാതെ നൽകിയിരിക്കുന്നു.
- source_word: עִיר הַנָּבִיא הַזָּקֵן
  choice: വൃദ്ധപ്രവാചകന്റെ പട്ടണം
  rationale: ഈ നിർമാണബന്ധം പ്രവാചകൻ താമസിച്ചിരുന്ന പട്ടണത്തെ സൂചിപ്പിക്കുന്നു; הַזָּקֵן ഇവിടെ ഔദ്യോഗിക പദവിയല്ല, പ്രായസൂചനയാണ്.
- source_word: לִסְפֹּד
  choice: വിലപിക്കാൻ
  rationale: ספד ദുഃഖാചരണത്തെയും പ്രത്യേകിച്ച് മരണാനന്തര വിലാപത്തെയും സൂചിപ്പിക്കുന്നു. ‘വിലപിക്കുക’ ആ പ്രത്യേക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּלְקָבְרוֹ
  choice: അവനെ അടക്കം ചെയ്യാൻ
  rationale: קבר എന്നത് ‘അടക്കം ചെയ്യുക’ എന്നാണ്; പുരുഷ ഏകവചന പ്രത്യയം ദൈവപുരുഷനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ എന്നു വ്യക്തമായി നൽകിയിരിക്കുന്നു.
