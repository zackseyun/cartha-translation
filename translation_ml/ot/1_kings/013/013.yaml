id: 1KI.13.13
reference: 1 Kings 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּנָ֔י/ו חִבְשׁוּ לִ֖/י הַ/חֲמ֑וֹר וַ/יַּחְבְּשׁוּ ל֣/וֹ הַ/חֲמ֔וֹר וַ/יִּרְכַּ֖ב עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/013.yaml
  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: ml
  text: അവൻ തന്റെ പുത്രന്മാരോട്, “എനിക്കുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടുവിൻ” എന്നു പറഞ്ഞു. അപ്പോൾ[a] അവർ അവനുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടി; അവൻ അതിന്റെമേൽ സവാരി ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവർ അവനുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടി.”'
    reason: ഹീബ്രു വാക്യത്തിലെ וַ־ എന്ന സാധാരണ ആഖ്യാനബന്ധകത്തെ ‘അപ്പോൾ’ എന്നു സന്ദർഭാനുസൃതമായി നൽകിയിരിക്കുന്നു; അതിനെ പ്രത്യേക കാലഫലബന്ധം വ്യക്തമാക്കാതെ വിവർത്തനം ചെയ്യാനും കഴിയും.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּנָיו
  choice: അവൻ തന്റെ പുത്രന്മാരോട് … എന്നു പറഞ്ഞു
  rationale: וַיֹּאמֶר ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; בָּנָיו പുരുഷലിംഗ ബഹുവചനമായതിനാൽ ‘പുത്രന്മാർ’ എന്ന് വിവർത്തനം ചെയ്തു.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: എനിക്കുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടുവിൻ
  rationale: ഈ സന്ദർഭത്തിൽ חבש എന്നത് സവാരിക്കായി മൃഗത്തെ ഒരുക്കുക, പ്രത്യേകിച്ച് ജീനി കെട്ടുക, എന്നാണ്. കല്പനയുടെ ബഹുവചനരൂപവും നിലനിർത്തി.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: അപ്പോൾ അവർ അവനുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടി
  rationale: കല്പനയിൽ വന്ന അതേ ക്രിയ ആവർത്തിച്ച്, പുത്രന്മാർ അത് അനുസരിച്ചതായി സ്വാഭാവിക മലയാളത്തിൽ അറിയിച്ചു.
- source_word: וַיִּרְכַּב עָלָיו
  choice: അവൻ അതിന്മേൽ കയറി
  rationale: רכב על എന്നത് മൃഗത്തിന്റെമേൽ കയറി സവാരി ചെയ്യുക എന്നാണ്; മലയാളത്തിൽ ‘അതിന്മേൽ കയറി’ എന്നത് പ്രവർത്തിയെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുത്രന്മാർ’ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു; ‘ജീനി കെട്ടുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സവാരിസംബന്ധമായ പ്രയോഗമാണ്.
