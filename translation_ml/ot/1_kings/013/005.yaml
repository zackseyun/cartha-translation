  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: ml
  text: യാഗപീഠം പിളർന്നുപോയി; ദൈവപുരുഷൻ യഹോവയുടെ വചനത്താൽ നൽകിയ അടയാള[a]പ്രകാരം യാഗപീഠത്തിൽനിന്ന് ചാരം ചൊരിയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അടയാളമെന്ന നിലയിൽ” എന്നും “അത്ഭുതചിഹ്നത്തിനനുസരിച്ച്” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ מוֹפֵת എന്ന പദത്തിന് അടയാളം, അത്ഭുതചിഹ്നം, ശകുനസൂചന എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന മִזְבֵּחַ എന്ന പദത്തിന് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ.
- source_word: נִקְרָע
  choice: പിളർന്നുപോയി
  rationale: קרע എന്ന ധാതുവിന്റെ കീറുക/പിളരുക എന്ന അർഥവും ഇവിടെ യാഗപീഠത്തിനുണ്ടായ ഭൗതികവിഭജനവും വ്യക്തമാക്കുന്നു.
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: ചാരം ചിതറിവീണു
  rationale: שׁפך എന്നതിന്റെ ഒഴുകിപ്പോകുക/ചൊരിയപ്പെടുക എന്ന ആശയം, യാഗപീഠം പിളർന്നപ്പോൾ ചാരം പുറത്തേക്കുവീണ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִן הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിൽനിന്ന്
  rationale: מן സൂചിപ്പിക്കുന്ന ഉറവിടസ്ഥാനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּמּוֹפֵת
  choice: അടയാളപ്രകാരം
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ അനുരൂപത/നിവൃത്തി സൂചിപ്പിക്കുന്ന ശക്തിയും מוֹפֵת എന്നതിന്റെ അടയാളം, അത്ഭുതചിഹ്നം, ശകുനസൂചന എന്നീ അർഥവ്യാപ്തിയും പ്രധാന പാഠത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകൻ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ എബ്രായത്തിലെ സ്ഥിരമായ ബഹുമാനപദവി നിലനിർത്തുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനത്താൽ
  rationale: דבר എന്നതിനെ കല്പനയായി മാത്രം ചുരുക്കാതെ സൂത്രവാക്യത്തിന്റെ രൂപവും പ്രവർത്തകമാധ്യമത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: מוֹפֵת എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അടയാളം
  alternative: അത്ഭുതചിഹ്നം / ശകുനസൂചന
  rationale: സംഭവം മുമ്പ് പ്രഖ്യാപിച്ച വാക്കിന്റെ സ്ഥിരീകരണചിഹ്നമായതിനാൽ ‘അടയാളം’ ഏറ്റവും നിഷ്പക്ഷമാണ്; പദത്തിന്റെ വിപുലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവപുരുഷൻ’, ‘യഹോവയുടെ വചനത്താൽ’ എന്നീ മൂലപാഠസൂത്രങ്ങൾ സംരക്ഷിച്ചു; വാക്യക്രമം മലയാളവായനയ്ക്ക് അനുയോജ്യമാക്കി.
