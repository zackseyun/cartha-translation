  source_fidelity: The draft accurately renders the altar's rupture, the altar residue, the man-of-God title, and the divine name. However, “ചിതറിവീണു” (‘scattered/fell’) introduces a scattering-and-falling nuance not expressed by the passive Hebrew וַיִּשָּׁפֵךְ, ‘was poured/spilled out.’
