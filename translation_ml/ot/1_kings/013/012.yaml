language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: ml
  text: 'അവരുടെ പിതാവ് അവരോടു ചോദിച്ചു: “അദ്ദേഹം ഏതു വഴിയാണു പോയത്?” കാരണം, യെഹൂദയിൽനിന്ന് വന്ന ദൈവപുരുഷൻ പോയ വഴി ആ പിതാവിന്റെ പുത്രന്മാർ കണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ചോദിച്ചു
  rationale: പദശഃ ‘സംസാരിച്ചു/പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചു’ യോജിക്കുന്നു.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: ഏതു വഴി
  rationale: ഇത് വെറും സ്ഥാനം അന്വേഷിക്കുന്നതല്ല, അദ്ദേഹം സ്വീകരിച്ച വഴി തിരിച്ചറിയാനുള്ള ചോദ്യമാണ്.
- source_word: הָלָךְ
  choice: പോയത് / പോയ
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ അടിസ്ഥാന അർഥം നിലനിർത്തി, മലയാള വാക്യഘടനയ്ക്കനുസരിച്ച് രൂപഭേദം വരുത്തി.
- source_word: וַיִּרְאוּ
  choice: കണ്ടിരുന്നു
  rationale: പിതാവ് ചോദിക്കുന്നതിനു മുമ്പുതന്നെ പുത്രന്മാർ വഴി കണ്ടിരുന്നു എന്ന സംഭവക്രമം വ്യക്തമാക്കുന്നു.
- source_word: בָנָיו
  choice: അദ്ദേഹത്തിന്റെ പുത്രന്മാർ
  rationale: ഏകവചന ഉടമസ്ഥപ്രത്യയം പിതാവിനെ സൂചിപ്പിക്കുന്നു; മാന്യവും വ്യക്തവുമായ ആധുനിക പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: എബ്രായത്തിലെ സ്ഥിരപ്രയോഗം ‘പ്രവാചകൻ’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִיהוּדָה
  choice: യെഹൂദയിൽനിന്നു
  rationale: ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ദൈവപുരുഷനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; രണ്ടാം വാക്യത്തിലെ അതേ സർവനാമം പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്, വാക്യക്രമം അത് വ്യക്തമാക്കുന്നു.
