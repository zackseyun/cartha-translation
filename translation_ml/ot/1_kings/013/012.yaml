revisions:
- from: 'അവരുടെ പിതാവ് അവരോടു ചോദിച്ചു: “അദ്ദേഹം ഏതു വഴിയാണു പോയത്?” യെഹൂദയിൽനിന്നു വന്ന ദൈവപുരുഷൻ പോയ വഴി അദ്ദേഹത്തിന്റെ പുത്രന്മാർ കണ്ടിരുന്നു.'
  to: 'അവരുടെ പിതാവ് അവരോടു ചോദിച്ചു: “അദ്ദേഹം ഏതു വഴിയാണു പോയത്?” കാരണം, യെഹൂദയിൽനിന്ന് വന്ന ദൈവപുരുഷൻ പോയ വഴി ആ പിതാവിന്റെ പുത്രന്മാർ കണ്ടിരുന്നു.'
