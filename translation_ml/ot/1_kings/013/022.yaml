base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: ml
  text: എന്നാൽ നീ മടങ്ങിവന്ന്, ‘അപ്പം തിന്നരുത്; വെള്ളം കുടിക്കരുത്’ എന്നു അവൻ നിന്നോടു പറഞ്ഞ സ്ഥലത്തുവെച്ച് അപ്പം തിന്നുകയും വെള്ളം കുടിക്കുകയും ചെയ്തു. അതുകൊണ്ട് നിന്റെ മൃതശരീരം നിന്റെ പിതാക്കന്മാരുടെ കല്ലറയിൽ എത്തുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ മൃതശരീരം നിന്റെ പിതാക്കന്മാരുടെ കല്ലറയിൽ പ്രവേശിക്കുകയില്ല.” ഹീബ്രുവിൽ അക്ഷരാർഥമായി, “നിന്റെ പിതാക്കന്മാരുടെ കല്ലറയിലേക്കു വരുകയില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: നീ മടങ്ങിവന്ന്
  rationale: שׁוב എന്ന ക്രിയയുടെ മടങ്ങിവരുക/തിരിച്ചുവരുക എന്ന അർഥവും നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַתֹּאכַל לֶחֶם
  choice: അപ്പം തിന്നുകയും
  rationale: ലֶחֶם എന്ന മൂർത്തപദത്തെ ‘ഭക്ഷണം’ എന്നു പൊതുവാക്കാതെ ‘അപ്പം’ എന്നു നൽകി മുമ്പത്തെ വിലക്കിന്റെ ആവർത്തനം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: വെള്ളം കുടിക്കുകയും ചെയ്തു
  rationale: വിലക്കിലും ലംഘനത്തിലും ആവർത്തിക്കുന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: അവൻ നിന്നോടു പറഞ്ഞ സ്ഥലത്തുവെച്ചുതന്നെ
  rationale: ആ സ്ഥലത്തെക്കുറിച്ചാണ് കല്പന പറഞ്ഞതെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘വെച്ചുതന്നെ’ ലംഘനം അതേ സ്ഥലത്തു നടന്നുവെന്ന ഊന്നൽ നൽകുന്നു.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘അപ്പം തിന്നരുത്; വെള്ളം കുടിക്കരുത്’
  rationale: രണ്ടു ഹീബ്രു വിലക്കുകളെയും അവയിലെ ആവർത്തിച്ച നാമങ്ങളെയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: נִבְלָתְךָ
  choice: നിന്റെ മൃതശരീരം
  rationale: മരിച്ച ശരീരം എന്ന കഠിനമായ അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: നിന്റെ മൃതശരീരം നിന്റെ പിതാക്കന്മാരുടെ കല്ലറയിൽ എത്തുകയില്ല
  rationale: ‘വരുക/എത്തുക’ എന്ന ഹീബ്രു ദൃശ്യരൂപം നിലനിർത്തുകയും കുടുംബകല്ലറയിൽ സംസ്കാരം ലഭിക്കില്ലെന്ന ആശയം അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲבֹתֶיךָ
  choice: നിന്റെ പിതാക്കന്മാർ
  rationale: പിതൃവംശീയ കുടുംബസംസ്കാരസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ബഹുവചനം ‘പൂർവികർ’ എന്നു പൊതുവാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധിപ്രസ്താവത്തിന്റെ സ്വഭാവം
  choice: ദൈവപുരുഷന്റെ മൃതശരീരം പിതാക്കന്മാരുടെ കുടുംബകല്ലറയിൽ എത്തുകയില്ലെന്ന മൂർത്തമായ പ്രഖ്യാപനം
  alternative: മരണാനന്തര അപമാനത്തെക്കുറിച്ചുള്ള വിശാലമായ ആലങ്കാരിക പ്രസ്താവന
  rationale: ഹീബ്രു വാചകം മൃതശരീരവും പിതാക്കന്മാരുടെ കല്ലറയും നേരിട്ട് പരാമർശിക്കുന്നു. അതിനാൽ കുടുംബകല്ലറയിലെ സംസ്കാരം നിഷേധിക്കപ്പെടുമെന്ന മൂർത്തമായ അർഥം സംരക്ഷിക്കുന്നു; അധിക ദൈവശാസ്ത്ര നിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അപ്പം’, ‘വെള്ളം’, ‘മൃതശരീരം’, ‘പിതാക്കന്മാരുടെ കല്ലറ’ എന്നീ മൂർത്തപദങ്ങൾ ഉറവിടത്തിലെ ആവർത്തനവും വിധിയുടെ കഠിനതയും നിലനിർത്തുന്നു.
