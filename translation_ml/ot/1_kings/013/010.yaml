  yaml_path: translation/ot/1_kings/013/010.yaml
  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: ml
  text: അങ്ങനെ അവൻ മറ്റൊരു വഴിയിലൂടെ പോയി; താൻ ബേഥേലിലേക്കു വന്ന വഴിയിലൂടെ മടങ്ങിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ അവൻ ... പോയി
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുകയും മുൻസന്ദർഭത്തിലെ നിർദേശത്തിന്റെ ഫലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ആധുനിക മലയാളത്തിൽ ‘അങ്ങനെ’ ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: മറ്റൊരു വഴിയിലൂടെ
  rationale: דֶּרֶךְ എന്നത് വഴി, പാത, യാത്രാമാർഗം എന്നിവയെ സൂചിപ്പിക്കാം; ഇവിടെ വന്ന വഴിയോടുള്ള വ്യക്തമായ വ്യത്യാസം ‘മറ്റൊരു വഴിയിലൂടെ’ നിലനിർത്തുന്നു.
- source_word: וְלֹא שָׁב
  choice: മടങ്ങിയില്ല
  rationale: שׁוּב യാത്രാസന്ദർഭത്തിൽ തിരികെ വരുക അഥവാ മടങ്ങുക എന്നാണ്; ‘മടങ്ങിയില്ല’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: താൻ ... വന്ന വഴിയിലൂടെ
  rationale: ബന്ധവാക്യം അവൻ മുമ്പ് സഞ്ചരിച്ച അതേ വഴിയെ വ്യക്തമാക്കുന്നു. בָהּ എന്ന സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം דֶּרֶךְ-നെ സൂചിപ്പിക്കുന്നത് മലയാളത്തിലെ ‘വഴിയിലൂടെ’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אֶל בֵּית אֵל
  choice: ബേഥേലിലേക്കു
  rationale: בֵּית אֵל സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരണം ചെയ്തു; אֶל മുൻപ് അവൻ വന്നതിന്റെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലേക്കു’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിക്കുന്ന ‘വഴി’ എന്ന പദം ഉദ്ദേശ്യപൂർവം രണ്ടിടത്തും നിലനിർത്തി. അർദ്ധവിരാമം തുടർച്ചയും വൈരുധ്യവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
