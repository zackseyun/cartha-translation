source:
  edition: WLC
  text: וַ/יֵּ֖לֶךְ בְּ/דֶ֣רֶךְ אַחֵ֑ר וְ/לֹֽא שָׁ֣ב בַּ/דֶּ֔רֶךְ אֲשֶׁ֛ר בָּ֥א בָ֖/הּ אֶל בֵּֽית אֵֽל־־־׃פ
