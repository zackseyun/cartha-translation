id: 1KI.13.20
reference: 1 Kings 13:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: ml
  text: അവർ മേശയ്ക്കരികിൽ ഇരിക്കുമ്പോൾ, അവനെ തിരിച്ചുകൊണ്ടുവന്ന പ്രവാചകനു യഹ്‌വേയുടെ വചനം വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: സംഭവപരമ്പരയിൽ പുതിയ സംഭവം അവതരിപ്പിക്കുന്ന wayyiqtol രൂപം. മലയാളത്തിൽ വേറിട്ട് ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കാതെ, വാക്യത്തിന്റെ മുഖ്യക്രിയയായ ‘അരുളപ്പാടുണ്ടായി’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הֵם יֹשְׁבִים
  choice: അവർ ... ഇരിക്കുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കൃദന്തരൂപം തുടരുന്ന പശ്ചാത്തലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ഇരിക്കുമ്പോൾ’ അതിന്റെ ദൈർഘ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל הַשֻּׁלְחָן
  choice: മേശയ്ക്കരികിൽ
  rationale: ישב എന്ന ക്രിയയോടൊപ്പം אֶל ഇവിടെ ഭക്ഷണമേശയോടു ചേർന്ന് ഇരിക്കുന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘മേശയ്ക്കരികിൽ’ മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനപ്രയോഗമാണ്.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വേയുടെ അരുളപ്പാട്
  rationale: പ്രവാചകീയ വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരസൂത്രം. ‘അരുളപ്പാട്’ ദൈവത്തിൽനിന്നുള്ള സന്ദേശമെന്ന ആശയം മാന്യവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമം പൊതുപദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל הַנָּבִיא
  choice: പ്രവാചകനു
  rationale: דבר יהוה എന്ന സൂത്രത്തോടുള്ള אֶל വെളിപ്പാടിന്റെ സ്വീകർത്താവിനെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി ഇത് വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: അവനെ തിരിച്ചുകൊണ്ടുവന്ന
  rationale: שוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപവും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും ചേർന്ന് ‘അവനെ മടങ്ങിവരാൻ ഇടയാക്കിയവൻ’ എന്ന കാര്യകഭാവം നൽകുന്നു; സന്ദർഭത്തിൽ ‘തിരിച്ചുകൊണ്ടുവന്ന’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. പ്രവാചകീയ സൂത്രത്തിന് ‘അരുളപ്പാട്’ ഉപയോഗിച്ചു; അനാവശ്യമായ പുരാതന ഭാഷയും വ്യാഖ്യാനവിപുലീകരണവും ഒഴിവാക്കി.
