source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אִישׁ הָֽ/אֱלֹהִים֙ אֶל הַ/מֶּ֔לֶךְ אִם תִּתֶּן לִ/י֙ אֶת חֲצִ֣י בֵיתֶ֔/ךָ לֹ֥א אָבֹ֖א עִמָּ֑/ךְ וְ/לֹֽא אֹ֤כַל לֶ֨חֶם֙ וְ/לֹ֣א אֶשְׁתֶּה מַּ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: ml
  text: 'എന്നാൽ ദൈവപുരുഷൻ രാജാവിനോടു പറഞ്ഞു: “അങ്ങ് എനിക്ക് അങ്ങയുടെ ഭവനത്തിന്റെ പകുതി[a] തന്നാലും ഞാൻ അങ്ങയോടൊപ്പം വരികയില്ല; ഈ സ്ഥലത്തുവെച്ച് അപ്പം തിന്നുകയോ വെള്ളം കുടിക്കുകയോ ചെയ്യുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “നിന്റെ ഭവനത്തിന്റെ പകുതി.” ഈ പ്രയോഗം അത്യന്തം വലിയ പ്രതിഫലത്തെയോ എസ്റ്റേറ്റിനെയോ സൂചിപ്പിച്ചേക്കാമെങ്കിലും വിവർത്തനം അക്ഷരാർഥത്തിലുള്ള വാക്കുകൾ നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്താൽ നിയോഗിക്കപ്പെട്ട ദൂതനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ബൈബിൾപരമായ ഭാവവും നിലനിർത്തുന്നു; ‘ദൈവത്തിന്റെ പ്രവാചകൻ’ എന്ന വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുന്നു.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: അങ്ങ് എനിക്ക് അങ്ങയുടെ ഭവനത്തിന്റെ പകുതി തന്നാലും
  rationale: സങ്കൽപ്പാധിഷ്ഠിത നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുകയും ‘ഭവനത്തിന്റെ പകുതി’ എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בֵיתֶךָ
  choice: അങ്ങയുടെ ഭവനം
  rationale: בַּיִת എന്നതിന് വീട്, കുടുംബം, സ്വത്ത്/എസ്റ്റേറ്റ് എന്നീ അർഥസാധ്യതകളുണ്ട്. രാജാവിന്റെ വലിയ സമ്പത്തെയോ പ്രതിഫലത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും മൂലപാഠത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ ദൃശ്യരൂപം സംരക്ഷിക്കാൻ ‘ഭവനം’ തിരഞ്ഞെടുത്തു.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: ഞാൻ അങ്ങയോടൊപ്പം വരികയില്ല
  rationale: אָבוֹא എന്ന ‘വരുക’ എന്ന ദിശാസൂചന അതേപടി നിലനിർത്തുന്നു; നിബന്ധനയുടെ ഫലവാക്യത്തിൽ ഉറച്ച നിരാകരണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא אֹכַל לֶחֶם
  choice: അപ്പം തിന്നുകയോ ഇല്ല
  rationale: לֶחֶם ഭക്ഷണം/ആഹാരം എന്ന വിപുലാർഥം വഹിക്കാമെങ്കിലും ‘അപ്പം’ സ്വാഭാവികവും മൂലപാഠത്തിന്റെ ഭാഷാചിത്രം സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: വെള്ളം കുടിക്കുകയോ ഇല്ല
  rationale: മൂലപാഠത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ വിവർത്തനം; മുൻ ക്രിയയുമായി സമാന്തര ഘടന പാലിക്കുന്നു.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തുവെച്ച്
  rationale: സൂചകപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ പ്രവൃത്തി നടക്കുന്ന ഇടം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
