translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ‘ഭവനത്തിന്റെ പകുതി’ എന്ന പ്രയോഗം വ്യക്തമായതിനാൽ പാഠത്തിൽ തന്നെ നിലനിർത്തി; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമായില്ല.
