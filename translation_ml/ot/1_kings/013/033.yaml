  to: ഈ സംഭവത്തിനുശേഷം യൊരോബെയാം തന്റെ ദുഷിച്ച വഴിയിൽനിന്ന് തിരിഞ്ഞില്ല. അവൻ വീണ്ടും ജനവിഭാഗങ്ങളിലെല്ലാംനിന്നും പൂജാഗിരികളിലെ പുരോഹിതന്മാരെ നിയമിച്ചു. ആഗ്രഹിച്ചവനെയെല്ലാം അവൻ പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു[a]; അങ്ങനെ അയാൾ പൂജാഗിരികളിലെ പുരോഹിതന്മാരിൽ ഒരാളായിത്തീർന്നു.
