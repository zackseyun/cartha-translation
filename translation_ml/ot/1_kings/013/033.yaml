id: 1KI.13.33
reference: 1 Kings 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: ml
  text: ഈ സംഭവത്തിനുശേഷം യൊരോബെയാം തന്റെ ദുഷിച്ച വഴിയിൽനിന്ന് തിരിഞ്ഞില്ല. അവൻ വീണ്ടും ജനവിഭാഗങ്ങളിലെല്ലാംനിന്നും പൂജാഗിരികളിലെ പുരോഹിതന്മാരെ നിയമിച്ചു. ആഗ്രഹിച്ചവനെയെല്ലാം അവൻ പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു[a]; അങ്ങനെ അയാൾ പൂജാഗിരികളിലെ പുരോഹിതന്മാരിൽ ഒരാളായിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ കൈ നിറച്ചു.” പുരോഹിതശുശ്രൂഷയിൽ ഒരാളെ നിയമിക്കുകയോ പ്രതിഷ്ഠിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: ഈ സംഭവത്തിനുശേഷവും
  rationale: דָּבָר എന്നതിന് ‘കാര്യം,’ ‘സംഭവം’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ മുൻവിവരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഭവം’ സ്വാഭാവികമാണ്; ‘-വും’ എന്നത് തുടർന്നുള്ള വിരുദ്ധഫലം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: തന്റെ ദുഷിച്ച വഴിയിൽനിന്ന് തിരിഞ്ഞില്ല
  rationale: שׁוּב എന്നതിന്റെ ‘തിരിയുക/മടങ്ങുക’ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു; ‘മാനസാന്തരപ്പെട്ടില്ല’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: അവൻ വീണ്ടും ... നിയമിച്ചു
  rationale: തുടർന്നുള്ള പ്രവൃത്തി ആവർത്തിക്കുകയോ പുനരാരംഭിക്കുകയോ ചെയ്തു എന്ന שׁוּב-ന്റെ ക്രിയാവിശേഷണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִקְצוֹת הָעָם
  choice: ജനത്തിന്റെ എല്ലാ വിഭാഗങ്ങളിൽനിന്നും
  rationale: അക്ഷരാർഥത്തിൽ ‘ജനത്തിന്റെ അറ്റങ്ങളിൽനിന്ന്’ എന്ന ദുഷ്കരമായ പ്രയോഗമാണിത്. രാജാവ് അംഗീകൃതമായ ഒരു പരിമിതിയും പാലിക്കാതെ പൊതുജനത്തിലെ വിവിധ വിഭാഗങ്ങളിൽനിന്ന് ആളുകളെ എടുത്തുവെന്ന സന്ദർഭാർഥം ഈ പരിഭാഷ നൽകുന്നു.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: പൂജാഗിരികളിലെ പുരോഹിതന്മാർ
  rationale: בָמוֹת ഇവിടെ പ്രാദേശികമായ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ ‘പൂജാഗിരികൾ’ എന്ന പദം ഉപയോഗിക്കുന്നു.
- source_word: הֶחָפֵץ
  choice: ആഗ്രഹിച്ചവനെയെല്ലാം
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന കൃദന്തം സാമാന്യമായി ‘ആഗ്രഹിക്കുന്ന ഏതൊരാളും’ എന്ന അർഥം നൽകുന്നു. വിവേചനമില്ലാത്ത നിയമനത്തിന്റെ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു
  rationale: ‘അവന്റെ കൈ നിറച്ചു’ എന്ന എബ്രായ പ്രയോഗം പുരോഹിതശുശ്രൂഷയിൽ ഒരാളെ ഔദ്യോഗികമായി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ അർഥം സ്വാഭാവികമായി നൽകി അക്ഷരരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: അങ്ങനെ അയാൾ പൂജാഗിരികളിലെ പുരോഹിതന്മാരിൽ ഒരാളായിത്തീർന്നു
  rationale: ഏകവചന ക്രിയയ്ക്കുശേഷമുള്ള ബഹുവചന നാമപ്രയോഗം ആ ഗണത്തിൽ ഉൾപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരാൾ’ എന്നു വ്യക്തമാക്കുന്നത് അർഥം കൃത്യമായി പകരുന്നു.
theological_decisions:
- issue: שׁוּב എന്ന ക്രിയയെ മതപരമായ സാങ്കേതികപദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ദുഷിച്ച വഴിയിൽനിന്ന് തിരിഞ്ഞില്ല
  alternative: ദുഷിച്ച വഴിയെക്കുറിച്ച് മാനസാന്തരപ്പെട്ടില്ല
  rationale: വാക്യത്തിന് ധാർമ്മികവും മതപരവുമായ ഭാവമുണ്ടെങ്കിലും മൂലപാഠം ‘തിരിയുക’ എന്ന വഴിയുടെ രൂപകം ഉപയോഗിക്കുന്നു. അതിനാൽ കൂടുതൽ വികസിതമായ ദൈവശാസ്ത്രപദം പ്രധാനപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: יְמַלֵּא אֶת יָדוֹ എന്ന പുരോഹിതനിയമനപ്രയോഗം എങ്ങനെ നൽകണം
  choice: പുരോഹിതനായി പ്രതിഷ്ഠിച്ചു
  alternative: അവന്റെ കൈ നിറച്ചു
  rationale: പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു; അതിന്റെ സവിശേഷ എബ്രായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പൂജാഗിരി’ എന്ന പരിചിതമായ ബൈബിൾ പദം സാങ്കേതികമായ בָמָה എന്ന ആശയം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പിന്റെ സൂചിക ‘event’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം יְמַלֵּא אֶת יָדוֹ എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ സൂചിക ബന്ധപ്പെട്ട ‘പ്രതിഷ്ഠിച്ചു’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
