id: 1KI.13.15
reference: 1 Kings 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו לֵ֥ךְ אִתִּ֖/י הַ/בָּ֑יְתָ/ה וֶ/אֱכֹ֖ל לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/015.yaml
  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ അവനോടു പറഞ്ഞു: “എന്നോടൊപ്പം വീട്ടിലേക്കു വന്ന് അപ്പം കഴിക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ അവൻ പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാരൂപം കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമബോധം സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയവും മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയവും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: לֵךְ
  choice: വന്ന്
  rationale: മൂലക്രിയയുടെ അക്ഷരാർഥം ‘പോകുക’ എന്നാണെങ്കിലും, സംസാരിക്കുന്നവൻ ‘എന്നോടൊപ്പം’ ക്ഷണിക്കുന്ന സാഹചര്യത്തിൽ മലയാളത്തിൽ ‘വരുക’ എന്നതാണ് സ്വാഭാവികം; ക്ഷണത്തിന്റെ ദിശയും ഭാവവും ഇതു നിലനിർത്തുന്നു.
- source_word: אִתִּי
  choice: എന്നോടൊപ്പം
  rationale: ഒന്നാം പുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ മുൻപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള അർഥം.
- source_word: הַבָּיְתָה
  choice: വീട്ടിലേക്കു
  rationale: ‘വീട്’ എന്ന പദത്തിലെ ദിശാസൂചകമായ -ה ലക്ഷ്യത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു. ‘എന്റെ വീട്ടിലേക്ക്’ എന്നത് സാഹചര്യത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഉടമസ്ഥത മൂലപദത്തിൽ പ്രകടമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וֶאֱכֹל
  choice: കഴിക്കുക
  rationale: ആദ്യ ആജ്ഞാരൂപത്തോടു ചേർന്ന രണ്ടാമത്തെ ക്ഷണാത്മക ആജ്ഞയെ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: לָחֶם
  choice: അപ്പം
  rationale: അടിസ്ഥാന അർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; എബ്രായത്തിൽ ഈ പദം സന്ദർഭാനുസരണം ഭക്ഷണത്തെയോ ഒരു നേരത്തെ ആഹാരത്തെയോ വിശാലമായി സൂചിപ്പിക്കാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘വന്ന്’ എന്നത് ക്ഷണസന്ദർഭത്തിലെ മലയാളപ്രയോഗം; ‘അപ്പം’ മൂലപദത്തിന്റെ ദൃശ്യരൂപവും വിശാലമായ ഭക്ഷണാർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
