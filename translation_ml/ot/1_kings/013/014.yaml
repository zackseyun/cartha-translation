  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: ml
  text: അങ്ങനെ അവൻ ദൈവപുരുഷന്റെ പിന്നാലെ പോയി. ആ തേരെബിന്ത്[a] മരത്തിന്റെ ചുവട്ടിൽ ഇരിക്കുന്ന അവനെ കണ്ടെത്തി അവനോട്, “യെഹൂദയിൽനിന്നു വന്ന ദൈവപുരുഷൻ നീ തന്നെയാണോ?” എന്നു ചോദിച്ചു. “അതെ, ഞാൻ തന്നെയാണ്,” അവൻ മറുപടി പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഓക്ക് മരത്തിന്റെ ചുവട്ടിൽ.” എബ്രായ പദമായ אֵלָה കൂടുതൽ പ്രത്യേകമായി തേരെബിന്ത് വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: പിന്നാലെ പോയി
  rationale: הלך + אַחֲרֵי എന്ന പ്രയോഗം ഒരാളുടെ പിന്നാലെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനത്തിലെ ചലനവും പിന്തുടരലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ഭാഗമൊട്ടാകെ ആവർത്തിക്കുന്ന എബ്രായ സ്ഥാനപ്പേരിന്റെ നേരിട്ടുള്ള രൂപമാണിത്; ‘ദൈവത്തിന്റെ പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിച്ച് പദത്തിന്റെ പരിധി ചുരുക്കുന്നില്ല.
- source_word: וַיִּמְצָאֵהוּ יֹשֵׁב
  choice: ഇരിക്കുന്ന അവനെ കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘കണ്ടെത്തുക’യും, יֹשֵׁב സൂചിപ്പിക്കുന്ന അപ്പോഴത്തെ ഇരിപ്പുനിലയും സംരക്ഷിക്കുന്നു.
- source_word: תַּחַת הָאֵלָה
  choice: ഒരു തേരെബിന്ത് മരത്തിന്റെ ചുവട്ടിൽ
  rationale: אֵלָה പ്രത്യേകിച്ച് terebinth വൃക്ഷത്തെ സൂചിപ്പിക്കുന്നു. മലയാളവായനക്കാർക്ക് അപരിചിതമായ സസ്യനാമം വ്യക്തമായി വൃക്ഷമാണെന്നു ബോധ്യപ്പെടുത്താൻ ‘മരം’ ചേർത്തു.
- source_word: הַאַתָּה
  choice: നീ തന്നെയാണോ
  rationale: തിരിച്ചറിയൽ ഉറപ്പാക്കുന്ന ചോദ്യത്തിലെ സർവനാമപ്രാധാന്യം മലയാളത്തിൽ ‘തന്നെ’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: യെഹൂദയിൽനിന്നു വന്ന
  rationale: മിൻ എന്ന ഉപസർഗം സ്ഥലമൂലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യെഹൂദയിൽനിന്നു’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: אָנִי
  choice: അതെ, ഞാൻ തന്നെയാണ്
  rationale: ക്രിയയില്ലാത്ത ‘ഞാൻ’ എന്ന എബ്രായ മറുപടി മുൻചോദ്യത്തിനുള്ള സ്ഥിരീകരണമാണ്; മലയാളസംഭാഷണത്തിൽ അതിന്റെ പൂർണബലം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: ദൈവപുരുഷൻ
  alternative: ദൈവത്തിന്റെ പ്രവാചകൻ
  rationale: മൂലത്തിലെ അംഗീകൃത സ്ഥാനപ്പേര് നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘പ്രവാചകൻ’ എന്നു നൽകിയാൽ മൂലപദത്തിൽ ഇല്ലാത്ത കൂടുതൽ നിർദിഷ്ടമായ ഔദ്യോഗിക തിരിച്ചറിയൽ ചേർക്കപ്പെടും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദൈവപുരുഷൻ’ എന്ന മുഖ്യപദം ഏകീകൃതമായി നിലനിർത്തി. അപരിചിതമായ സസ്യനാമത്തിന് ‘തേരെബിന്ത് മരം’ എന്നു വ്യക്തത നൽകി; പ്രസക്തമായ പാഠഭേദമോ അനിവാര്യമായ അടിക്കുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
