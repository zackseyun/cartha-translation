id: 1KI.13.9
reference: 1 Kings 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: ml
  text: 'കാരണം, യഹോവ തന്റെ വചനത്താൽ എന്നോടു ഇങ്ങനെ കല്പിച്ചു: ‘നീ അപ്പം തിന്നരുത്; വെള്ളം കുടിക്കരുത്; നീ പോയ വഴിയിലൂടെ മടങ്ങിപ്പോകരുത്.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനത്താൽ
  rationale: ഉറവിടത്തിലെ ദൈവനാമവും ഉപാധി/അധികാരം സൂചിപ്പിക്കുന്ന בְּ പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: സന്ദർഭത്തിൽ ഭക്ഷണത്തെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും, ഉറവിടപദത്തിന്റെ അടിസ്ഥാന ദൃശ്യവും സമാന്തരഘടനയും നിലനിർത്തുന്നു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: നീ പോയ വഴിയിലൂടെ
  rationale: הלך എന്ന ക്രിയയെ ‘പോയ’ എന്നു വിവർത്തനം ചെയ്ത്, ‘വന്ന’ എന്ന സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനം ചേർക്കാതെ ഉറവിടവാചകത്തോട് ചേർന്ന് നിൽക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തമാക്കുന്നു; ഒരു പദവി കൊണ്ട് അതിനെ മറയ്ക്കുന്നില്ല.
- issue: കല്പനയുടെ ഉറവിടവും പ്രവർത്തകനും
  choice: ‘യഹോവയുടെ വചനത്താൽ എന്നോട് ... കല്പിച്ചിരിക്കുന്നു’ എന്ന കർമണിപ്രയോഗം
  alternative: ‘അവൻ യഹോവയുടെ വചനത്താൽ എന്നോട് കല്പിച്ചു’
  rationale: ഹീബ്രുവിലെ צִוָּה എന്ന ക്രിയയുടെ വ്യക്തമായ പുരുഷ ഏകവചന കർത്താവ് മലയാളത്തിൽ ‘അവൻ’ എന്നു നൽകാമെങ്കിലും അതിന്റെ സൂചനാപൂർവമായ പരാമർശം അനാവശ്യമായി തീർക്കാതിരിക്കാനും ദൈവിക അധികാരം വ്യക്തമാക്കാനും സ്വാഭാവിക കർമണി ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആവർത്തിച്ച നിരോധനങ്ങളുടെ താളം ‘അരുത്’ ഉപയോഗിച്ച് സംരക്ഷിച്ചു; ഉദ്ധരണിയുടെ നേരിട്ടുള്ള സ്വഭാവവും നിലനിർത്തി.
