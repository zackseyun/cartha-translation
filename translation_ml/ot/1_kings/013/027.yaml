language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר אֶל בָּנָי/ו֙ לֵ/אמֹ֔ר חִבְשׁוּ לִ֖/י אֶֽת הַ/חֲמ֑וֹר וַֽ/יַּחֲבֹֽשׁוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/027.yaml
  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ പുത്രന്മാരോടു പറഞ്ഞു: “എനിക്കുവേണ്ടി കഴുതയ്ക്കു ജീനി കെട്ടുക.” അങ്ങനെ അവർ അതിനു ജീനി കെട്ടി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങനെ അവർ കഴുതയ്ക്കു ജീനി കെട്ടി.”
    reason: അവസാനത്തെ എബ്രായ ക്രിയയ്ക്ക് വ്യക്തമായി പറഞ്ഞ കർമമില്ല; മലയാളത്തിൽ അതിനെ സർവനാമംകൊണ്ടോ മുൻപറഞ്ഞ ‘കഴുത’ ആവർത്തിച്ചോ വ്യക്തമാക്കാം.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ അവൻ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘പിന്നെ’ സ്വാഭാവികമാണ്; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണിക്കുമുമ്പ് ‘പറഞ്ഞു’ എന്നത് דִּבֵּר എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל בָּנָיו
  choice: തന്റെ പുത്രന്മാരോട്
  rationale: בָּנִים എന്ന പുല്ലിംഗ ബഹുവചനവും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും കൃത്യമായി പ്രതിഫലിപ്പിക്കാൻ ‘തന്റെ പുത്രന്മാർ’ ഉപയോഗിച്ചു; ‘മക്കൾ’ എന്നത് ലിംഗവ്യത്യാസം മങ്ങിച്ചേക്കാം.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കാതെ ഉദ്ധരണിക്കുമുമ്പുള്ള ‘പറഞ്ഞു:’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: חִבְשׁוּ לִי
  choice: എനിക്കുവേണ്ടി ... ജീനി കെട്ടുക
  rationale: കഴുതയുടെ സന്ദർഭത്തിൽ חבשׁ എന്നത് ജീനി കെട്ടുക എന്നാണ്; לִי പ്രവർത്തനം അവന്റെ ഉപയോഗത്തിനോ പ്രയോജനത്തിനോ വേണ്ടിയാണെന്ന് സൂചിപ്പിക്കുന്നതിനാൽ ‘എനിക്കുവേണ്ടി’ എന്ന് നിലനിർത്തി.
- source_word: אֶת הַחֲמוֹר
  choice: കഴുതയ്ക്ക്
  rationale: חֲמוֹר എന്ന സാധാരണ മൃഗനാമത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദം ‘കഴുത’യാണ്; ‘ജീനി കെട്ടുക’ എന്ന മലയാള ക്രിയാസംയോജനത്തിന് അനുസരിച്ച് ദാതൃവിഭക്തി ഉപയോഗിച്ചു.
- source_word: וַיַּחֲבֹשׁוּ
  choice: അങ്ങനെ അവർ അതിനു ജീനി കെട്ടി
  rationale: ആദ്യത്തെ חבשׁ ആവർത്തിക്കുന്നതിനാൽ ‘ജീനി കെട്ടി’ എന്നതും ആവർത്തിച്ചു. എബ്രായത്തിൽ അവസാനക്രിയയുടെ കർത്താവ് ബഹുവചനമാണ്; വസ്തു പ്രസക്തിയിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ ‘അതിനു’ എന്ന് സ്വാഭാവികമായി ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആജ്ഞാരൂപത്തിൽ അത്യന്തം പുരാതനമായ ‘കെട്ടുവിൻ’ ഒഴിവാക്കി, സന്ദർഭത്തിൽ ബഹുവചന ആജ്ഞയായി സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന ‘കെട്ടുക’ ഉപയോഗിച്ചു.
