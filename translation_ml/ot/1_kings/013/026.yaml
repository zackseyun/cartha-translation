  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: ml
  text: 'അവനെ വഴിയിൽനിന്ന് തിരിച്ചുകൊണ്ടുവന്ന പ്രവാചകൻ അതു കേട്ടപ്പോൾ പറഞ്ഞു: “യഹോവയുടെ വചനത്തോടു മത്സരിച്ച[a] ദൈവപുരുഷൻ തന്നെയാണിത്. അതുകൊണ്ട് യഹോവ അവനെ സിംഹത്തിന് ഏല്പിച്ചു; യഹോവ അവനോട് അരുളിച്ചെയ്ത വചനപ്രകാരം സിംഹം അവനെ കടിച്ചുകീറി കൊന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹോവയുടെ വചനത്തോടു മത്സരിച്ച” എന്നതിന് “യഹോവയുടെ കല്പനയെ ധിക്കരിച്ച” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം “യഹോവയുടെ വായോടു മത്സരിച്ച” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: അവനെ വഴിയിൽനിന്ന് തിരിച്ചുകൊണ്ടുവന്ന
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥവും מן־הדרך എന്നതിലെ യാത്രാമാർഗത്തിൽനിന്നുള്ള മടക്കവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്താൽ നിയോഗിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ആവർത്തിത ആഖ്യാനപദവിയുടെ ചുരുക്കവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: യഹോവയുടെ വചനത്തോടു മത്സരിച്ച
  rationale: מרה എന്നതിന്റെ എതിർക്കുക/മത്സരിക്കുക എന്ന ശക്തി നിലനിർത്തുന്നു; ‘യഹോവയുടെ വായ്’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, ഇവിടെ വായിൽനിന്നു പുറപ്പെട്ട കല്പനയെ സൂചിപ്പിക്കുന്ന ‘വചനം’ ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: അവനെ സിംഹത്തിന് ഏല്പിച്ചു
  rationale: נתן + ל എന്നത് ഇവിടെ സിംഹത്തിന്റെ അധികാരത്തിനോ ആക്രമണത്തിനോ വിട്ടുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഏല്പിച്ചു’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: കടിച്ചുകീറി
  rationale: שבר അക്ഷരാർഥത്തിൽ ‘തകർക്കുക’ എന്നാണെങ്കിലും സിംഹം കർത്താവായിരിക്കുന്ന ഈ സന്ദർഭത്തിൽ മൃഗാക്രമണത്തിലെ തകർക്കൽ/കീറിമുറിക്കൽ സൂചിപ്പിക്കുന്നു; ‘കടിച്ചുകീറി’ ദൃശ്യവും സ്വാഭാവികവുമാണ്.
- source_word: וַיְמִתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപമായ ‘മരണത്തിനിടയാക്കുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: യഹോവ അവനോട് അരുളിച്ചെയ്ത വചനപ്രകാരം
  rationale: മുൻപ് യഹോവ പറഞ്ഞ വചനത്തിന്റെ നിറവേറലാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ബന്ധവാക്യക്രമം ഉപയോഗിച്ച് സൂചനകൾ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: פִּי יְהוָה എന്ന ശരീരാവയവാധിഷ്ഠിത പ്രയോഗം
  choice: യഹോവയുടെ വചനം
  alternative: യഹോവയുടെ വായ് / യഹോവയുടെ കല്പന
  rationale: അക്ഷരാർഥമായ ‘വായ്’ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കും. ‘വചനം’ സംസാരിക്കപ്പെട്ട ദൈവിക നിർദേശത്തെ നിലനിർത്തുകയും, ‘കല്പന’ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ശിക്ഷയിൽ യഹോവയുടെ പ്രവർത്തകത്വം
  choice: യഹോവ അവനെ സിംഹത്തിന് ഏല്പിച്ചു
  alternative: അവൻ സിംഹത്തിന്റെ ഇരയാകാൻ യഹോവ അനുവദിച്ചു
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള וַיִּתְּנֵהוּ יְהוָה എന്ന പ്രസ്താവനയെ ‘അനുവദിച്ചു’ എന്നു മൃദൂകരിക്കാതെ അതിലെ ദൈവിക പ്രവർത്തകത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അരുളിച്ചെയ്ത’ എന്ന ബൈബിൾപരിചിത പദം ദൈവിക പ്രസ്താവനയെ വ്യക്തമാക്കാൻ പരിമിതമായി ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
