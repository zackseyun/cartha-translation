source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: ml
  text: പ്രവാചകൻ അപ്പം ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്തശേഷം, അവനെ തിരിച്ചുകൊണ്ടുവന്നവൻ ആ പ്രവാചകനുവേണ്ടി കഴുതയ്ക്കു കോപ്പിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[Malayalam narrative sequence conveyed by the finite clause without a separate formula]'
  rationale: The Hebrew wayyiqtol discourse marker advances the narrative. A separate literal equivalent such as ‘അങ്ങനെ സംഭവിച്ചു’ would be cumbersome here; natural Malayalam expresses the sequence through the completed temporal clause and main verb.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: അവൻ അപ്പം ഭക്ഷിച്ചശേഷം
  rationale: Preserves the temporal construction and the explicit noun לֶחֶם (‘bread’), while using a natural Malayalam conjunctive form.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: കുടിക്കുകയും … ചെയ്തശേഷം
  rationale: Maintains the parallel action without supplying an unstated object such as water or wine.
- source_word: וַיַּחֲבָשׁ
  choice: കോപ്പിട്ടു
  rationale: In context חבש denotes fitting a donkey for riding. ‘കഴുതയ്ക്കു കോപ്പിട്ടു’ is a natural, precise Malayalam expression for saddling.
- source_word: לוֹ … לַנָּבִיא
  choice: പ്രവാചകനുവേണ്ടി
  rationale: The dative indicates that the donkey was saddled for the prophet’s use. Malayalam naturally combines the pronominal and appositional expressions rather than repeating ‘അവനുവേണ്ടി, പ്രവാചകനുവേണ്ടി.’
- source_word: הַחֲמוֹר
  choice: കഴുത
  rationale: Standard modern Malayalam equivalent for ‘donkey.’
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: താൻ തിരിച്ചുകൊണ്ടുവന്ന
  rationale: The Hiphil of שוב is causative, ‘bring back/cause to return.’ ‘തിരിച്ചുകൊണ്ടുവന്ന’ is idiomatic and fits the narrative context; reflexive ‘താൻ’ clarifies that the subject is the one saddling the donkey without adding a new referent.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. ‘അപ്പം’ എന്ന വ്യക്തമായ മൂലപദം നിലനിർത്തിയിട്ടുണ്ട്; കുടിച്ചതിന്റെ വസ്തു മൂലഭാഷയിൽ പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല. ആവർത്തനഭാരം ഒഴിവാക്കാൻ לוֹ … לַנָּבִיא എന്നത് ‘പ്രവാചകനുവേണ്ടി’ എന്നു സ്വാഭാവികമായി ഏകീകരിച്ചു.
