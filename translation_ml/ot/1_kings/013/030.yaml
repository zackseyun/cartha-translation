  to: 'അവൻ അവന്റെ ശവശരീരം തന്റെ കല്ലറയിൽ വെച്ചു. അവർ അവനെച്ചൊല്ലി വിലപിച്ചു[a]: “അയ്യോ, എന്റെ സഹോദരാ[b]!”'
