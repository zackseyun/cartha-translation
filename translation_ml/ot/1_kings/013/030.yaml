id: 1KI.13.30
reference: 1 Kings 13:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: ml
  text: 'അവൻ അവന്റെ ശവശരീരം തന്റെ കല്ലറയിൽ വെച്ചു. അവർ അവനെച്ചൊല്ലി വിലപിച്ചു[a]: “അയ്യോ, എന്റെ സഹോദരാ[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിലപിച്ചു’ എന്ന എബ്രായക്രിയ മരിച്ചയാളെച്ചൊല്ലിയുള്ള ദുഃഖാചരണത്തെ, പലപ്പോഴും ഔപചാരികമായ വിലാപത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ സഹോദരാ’ എന്നത് ജൈവസഹോദരബന്ധത്തെ നിർബന്ധമായി സൂചിപ്പിക്കണമെന്നില്ല; അടുപ്പമോ ഐക്യദാർഢ്യമോ പ്രകടിപ്പിക്കുന്ന ഒരു വിലാപപ്രയോഗമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: വെച്ചു
  rationale: നוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ ഒരു സ്ഥലത്ത് വെക്കുക എന്നർഥത്തിലാണ്; സംസ്കാരസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: נִבְלָתוֹ
  choice: അവന്റെ ശവശരീരം
  rationale: נְבֵלָה ജീവനറ്റ ശരീരത്തെ സൂചിപ്പിക്കുന്നു. ‘ശവശരീരം’ മൂലപദത്തിന്റെ വ്യക്തത നിലനിർത്തുകയും മനുഷ്യനെ സംബന്ധിച്ച് മാന്യമായ ആധുനിക ഭാഷ നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּקִבְרוֹ
  choice: സ്വന്തം കല്ലറയിൽ
  rationale: קֶבֶר കല്ലറയെയോ ശവകുടീരത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ പഴയ പ്രവാചകന്റെ സ്വന്തം അടക്കസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; ‘കല്ലറ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: וַיִּסְפְּדוּ
  choice: അവർ ... വിലപിച്ചു
  rationale: ספד മരിച്ചയാളെക്കുറിച്ചുള്ള ദുഃഖാചരണത്തെയും ഔപചാരിക വിലാപത്തെയും സൂചിപ്പിക്കുന്നു. ബഹുവചന ക്രിയ മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: עָלָיו
  choice: അവനെച്ചൊല്ലി
  rationale: ספד എന്ന ക്രിയയോടുകൂടിയ עַל ഇവിടെ ആരെയോർത്ത് അഥവാ ആരെക്കുറിച്ച് വിലപിച്ചു എന്ന ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: הוֹי
  choice: അയ്യോ
  rationale: הוֹי ദുഃഖം പ്രകടിപ്പിക്കുന്ന വിലാപോദ്ഗാരമാണ്. ‘അയ്യോ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ വികാരം നൽകുന്നു; ന്യായവിധിയുടെ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אָחִי
  choice: എന്റെ സഹോദരാ
  rationale: אָח എന്ന പദത്തിന്റെ കുടുംബബന്ധഭാഷയും അഭിസംബോധനയുടെ വൈകാരിക ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്റെ സഹോദരാ’ എന്ന അഭിസംബോധനയുടെ ബന്ധാർഥം
  choice: വാചകത്തിൽ അക്ഷരാർഥമായ ‘എന്റെ സഹോദരാ’ നിലനിർത്തി; കുറിപ്പിൽ വിലാപസൂത്രവാക്യമായിരിക്കാമെന്ന് വ്യക്തമാക്കി.
  alternative: ‘എന്റെ ബന്ധുവേ’ അല്ലെങ്കിൽ ‘എന്റെ സഹചരാ’ എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ജൈവസഹോദരബന്ധം മൂലപാഠം നിർബന്ധമായി സ്ഥാപിക്കുന്നില്ലെങ്കിലും അതിലെ കുടുംബബന്ധരൂപകം പരിഭാഷയിൽ മായ്ച്ചുകളയരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശവശരീരം’, ‘കല്ലറ’, ‘വിലപിച്ചു’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ സംസ്കാര-വിലാപസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു. എബ്രായത്തിലെ ഏകവചന കർത്താവിൽനിന്ന് ബഹുവചനമായ ‘അവർ വിലപിച്ചു’ എന്ന മാറ്റം വ്യാഖ്യാനിച്ച് ഏകീകരിക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്.
