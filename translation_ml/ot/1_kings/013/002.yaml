id: 1KI.13.2
reference: 1 Kings 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: ml
  text: 'അവൻ യഹ്‌വേയുടെ വചനത്താൽ[a] യാഗപീഠത്തിനെതിരെ വിളിച്ചുപറഞ്ഞു: “യാഗപീഠമേ, യാഗപീഠമേ, യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇതാ, ദാവീദിന്റെ ഭവനത്തിന് ഒരു മകൻ ജനിക്കും; അവന്റെ പേര് യോശീയാവ് ആയിരിക്കും. നിന്റെമേൽ ധൂപം അർപ്പിക്കുന്ന ഉന്നതാരാധനാസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ അവൻ നിന്റെമേൽ ബലിയർപ്പിക്കും[b]; മനുഷ്യരുടെ അസ്ഥികൾ നിന്റെമേൽ ദഹിപ്പിക്കപ്പെടും[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹ്‌വേയുടെ വചനപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ബִּדְבַר എന്ന പ്രയോഗം യഹ്‌വേയുടെ വചനത്തിന്റെ അധികാരത്തിലോ നിയോഗത്തിലോ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാം; ‘പ്രകാരം’ എന്ന വായനയും സാധ്യമാണ്.
  - marker: b
    text: “അവൻ നിന്റെമേൽ യാഗമായി അറുക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായക്രിയയ്ക്ക് യാഗാർഥമുള്ള ‘അറുക്കുക’ എന്ന ഭാവമുണ്ട്.
    reason: זבח യാഗത്തിനായി അറുക്കുന്നതിനെ സൂചിപ്പിക്കാം. അതിനാൽ ഈ പ്രവൃത്തിയിൽ ബലിയർപ്പണത്തിന്റെയും വധത്തിന്റെയും ഭാവങ്ങൾ ഒന്നിച്ചുണ്ട്.
  - marker: c
    text: “മനുഷ്യരുടെ അസ്ഥികൾ” എന്നതിലെ ഹീബ്രായ പദം אָדָם ആണ്; ഇവിടെ അത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ, ലിംഗവിശേഷമില്ലാത്ത അർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיִּקְרָא עַל
  choice: യാഗപീഠത്തിനെതിരെ വിളിച്ചുപറഞ്ഞു
  rationale: קרא with עַל ഇവിടെ യാഗപീഠത്തോടുള്ള സാധാരണ അഭിസംബോധന മാത്രമല്ല, അതിനെതിരായ ശക്തമായ പ്രവാചകപ്രഖ്യാപനമാണ്; ‘വിളിച്ചുപറഞ്ഞു’ അതിന്റെ ശബ്ദശക്തിയും ‘എതിരെ’ പ്രതികൂലദിശയും നിലനിർത്തുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מזבח എന്നതിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപം; തുടർന്നുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിലെ ആലങ്കാരിക വ്യക്തിവൽക്കരണവും നിലനിൽക്കുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനത്താൽ
  rationale: പ്രഖ്യാപനം ദൈവിക നിയോഗത്താലോ അധികാരത്താലോ നടത്തപ്പെടുന്നു എന്ന ഉപകരണാർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ബന്ധാർഥത്തിലെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: യാഗപീഠമേ, യാഗപീഠമേ
  rationale: ആവർത്തനവും അഭിസംബോധനയുടെ ഗൗരവവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകദൂതന്റെ പരമ്പരാഗത പ്രഖ്യാപനസൂത്രത്തിന്റെ ഔന്നത്യവും നേരിട്ടുള്ള ദൈവിക വചനത്തിന്റെ ഭാവവും നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള പ്രവാചകപ്രഖ്യാപനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: ദാവീദിന്റെ ഭവനത്തിൽ ഒരു മകൻ ജനിക്കും
  rationale: പ്രവചനസന്ദർഭത്തിൽ participle ഭാവിയെ സൂചിപ്പിക്കുന്നു; ‘ഭവനം’ രാജവംശപരമായ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: അവന്റെ പേര് യോശീയാവ്
  rationale: ഹീബ്രായ നാമകരണസൂത്രം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְזָבַח עָלֶיךָ
  choice: അവൻ നിന്റെമേൽ യാഗമായി അറുക്കും
  rationale: זבח എന്ന ക്രിയയിലെ ബലിയർപ്പണസ്വരവും യഥാർഥ അറുക്കലിന്റെ ഭീകരതയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; പുരോഹിതന്മാരെ അവരുടെ തന്നെ പീഠത്തിൽ ബലിയാക്കുന്ന വ്യംഗ്യവും തെളിയുന്നു.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: പൂജാമേടുകളിലെ പുരോഹിതന്മാർ
  rationale: במות പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പൂജാമേടുകൾ’ അവയുടെ ആരാധനാപരവും ഉയർന്ന ഇടങ്ങളുമായ ബന്ധം ചുരുക്കമായി നൽകുന്നു.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: നിന്റെമേൽ ധൂപം അർപ്പിക്കുന്ന
  rationale: Hiphil מקטיר പലപ്പോഴും ധൂപമോ യാഗവസ്തുവോ കത്തിച്ച് പുക ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ധൂപം അർപ്പിക്കുന്ന’ വായന സ്വാഭാവികമാണ്, എന്നാൽ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְעַצְמוֹת אָדָם
  choice: മനുഷ്യരുടെ അസ്ഥികൾ
  rationale: אָדָם ഇവിടെ ഒരു പ്രത്യേക പുരുഷനെയല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ബഹുവചനസദൃശമായ സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: יִשְׂרְפוּ עָלֶיךָ
  choice: നിന്റെമേൽ ദഹിപ്പിക്കപ്പെടും
  rationale: നിർണ്ണയിക്കപ്പെടാത്ത ബഹുവചന കർത്താവിനെ കൃത്രിമമായി ചേർക്കാതെ ഹീബ്രായത്തിന്റെ അർഥം സ്വാഭാവിക കർമണിപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം നിയമബന്ധപരമായ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; പദവിയായി മാറ്റാതെ അതിന്റെ പേരായ സ്വഭാവം നിലനിർത്തുന്നു.
- issue: പുരോഹിതന്മാരെക്കുറിച്ചുള്ള וְזָבַח എന്ന ക്രിയയുടെ ബലിയർപ്പണസ്വരം
  choice: യാഗമായി അറുക്കും
  alternative: കൊല്ലും / ബലിയർപ്പിക്കും
  rationale: അവരെ കൊല്ലുമെന്ന വസ്തുത മാത്രം പറയാതെ, അനധികൃത ആരാധനയുടെ പീഠം അതിലെ പുരോഹിതന്മാരാൽ അശുദ്ധമാക്കപ്പെടുന്ന ആരാധനാപരമായ വ്യംഗ്യവും ന്യായവിധിയുടെ ഭീകരതയും നിലനിർത്തുന്നു.
- issue: אָדָם എന്നതിന്റെ പൊതുവായ അർഥം
  choice: മനുഷ്യരുടെ അസ്ഥികൾ
  alternative: മനുഷ്യന്റെ അസ്ഥികൾ / പുരുഷന്മാരുടെ അസ്ഥികൾ
  rationale: ഇവിടെ אָדָם ലിംഗവിശേഷമുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നില്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം വാക്യം ക്രമപ്പെടുത്തി; പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവത്തിനായി ‘അരുളിച്ചെയ്യുന്നു’, ‘ഇതാ’ എന്നിവ നിലനിർത്തി. ‘പൂജാമേടുകൾ’ എന്നത് ബാമോത്തിന്റെ പ്രാദേശിക ആരാധനാകേന്ദ്രസ്വഭാവം ചുരുക്കമായി നൽകുന്നു. നേരിട്ടുള്ള അഭിസംബോധനയും ആവർത്തനവും ഭാവിപ്രവചനത്തിന്റെ ഉറപ്പും സംരക്ഷിച്ചു.
