- from: 'അവൻ യഹ്‌വേയുടെ വചനത്താൽ[a] യാഗപീഠത്തിനെതിരെ വിളിച്ചുപറഞ്ഞു: “യാഗപീഠമേ, യാഗപീഠമേ, യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇതാ, ദാവീദിന്റെ ഭവനത്തിൽ ഒരു മകൻ ജനിക്കും; അവന്റെ പേര് യോശീയാവ്. നിന്റെമേൽ ധൂപം അർപ്പിക്കുന്ന പൂജാമേടുകളിലെ പുരോഹിതന്മാരെ അവൻ നിന്റെമേൽ യാഗമായി അറുക്കും[b]; മനുഷ്യരുടെ അസ്ഥികൾ നിന്റെമേൽ ദഹിപ്പിക്കപ്പെടും[c].’”'
  to: 'അവൻ യഹ്‌വേയുടെ വചനത്താൽ[a] യാഗപീഠത്തിനെതിരെ വിളിച്ചുപറഞ്ഞു: “യാഗപീഠമേ, യാഗപീഠമേ, യഹ്‌വേ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇതാ, ദാവീദിന്റെ ഭവനത്തിന് ഒരു മകൻ ജനിക്കും; അവന്റെ പേര് യോശീയാവ് ആയിരിക്കും. നിന്റെമേൽ ധൂപം അർപ്പിക്കുന്ന ഉന്നതാരാധനാസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ അവൻ നിന്റെമേൽ ബലിയർപ്പിക്കും[b]; മനുഷ്യരുടെ അസ്ഥികൾ നിന്റെമേൽ ദഹിപ്പിക്കപ്പെടും[c].’”'
