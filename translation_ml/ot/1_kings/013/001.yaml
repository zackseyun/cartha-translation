reference: 1 Kings 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: ml
  text: ഇതാ, യഹോവയുടെ വചനപ്രകാരം[a] യെഹൂദയിൽനിന്ന് ഒരു ദൈവപുരുഷൻ ബേഥേലിലേക്കു വന്നു; യൊരോബെയാം ധൂപം കാട്ടാൻ യാഗപീഠത്തിനരികെ നിൽക്കുകയായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യഹോവയുടെ വചനത്താൽ” അല്ലെങ്കിൽ “യഹോവയുടെ വചനമനുസരിച്ച്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “യൊരോബെയാം യാഗപീഠത്തിങ്കൽ നിൽക്കുകയായിരുന്നു” എന്നും വായിക്കാം; ഹീബ്രുവിലെ ബന്ധകം ലളിതമായി “അപ്പോൾ/കൂടാതെ” എന്ന ബന്ധവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ ശ്രദ്ധ ക്ഷണിക്കുന്നതും രംഗം സജീവമാക്കുന്നതുമായ പ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ אֱלֹהִים
  choice: ഒരു ദൈവപുരുഷൻ
  rationale: ‘പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, മൂലപാഠത്തിലെ സ്ഥിരപ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: מִיהוּדָה
  choice: യെഹൂദയിൽനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ പുറപ്പെടൽസ്ഥലം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനപ്രകാരം
  rationale: അയാളുടെ വരവ് യഹോവയുടെ വചനത്തോടുള്ള അനുസരണത്തിലും അതിന്റെ അധികാരത്തിൻ കീഴിലുമായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ബന്ധകത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל בֵּית אֵל
  choice: ബേഥേലിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: യൊരോബെയാം … നിൽക്കുകയായിരുന്നു
  rationale: പങ്കെടുക്കുന്ന ക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലപ്രവർത്തനം ഭൂതകാല പുരോഗമനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; വാവിന്റെ ലളിതമായ ‘അപ്പോൾ/കൂടാതെ’ ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികെ
  rationale: ആചാരപരമായ സാഹചര്യത്തിൽ പീഠത്തിന്റെ മുകളിൽ എന്ന അസ്വാഭാവിക ധാരണ ഒഴിവാക്കി, അതിനടുത്തുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു; ‘യാഗപീഠത്തിങ്കൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְהַקְטִיר
  choice: ധൂപം കാട്ടാൻ
  rationale: ഈ ആരാധനാസന്ദർഭത്തിൽ പുക ഉയർത്തുന്ന ആചാരത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: אִישׁ אֱלֹהִים എന്ന വിശേഷണം
  choice: ദൈവപുരുഷൻ
  alternative: പ്രവാചകൻ
  rationale: ഈ വ്യക്തി പ്രവാചകദൗത്യം നിർവഹിക്കുന്നുവെങ്കിലും, മൂലപാഠം ഉപയോഗിക്കുന്ന വിശേഷണം നിലനിർത്തി അതിനെ വ്യാഖ്യാനപരമായി ‘പ്രവാചകൻ’ എന്നു മാത്രം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഇതാ’, ‘ദൈവപുരുഷൻ’, ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി.
