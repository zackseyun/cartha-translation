translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഭക്ഷണം കഴിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപത്തിനു പകരം കഥയിലെ അപ്പം–വെള്ളം ആവർത്തനം സംരക്ഷിച്ചു. പ്രധാനവാചകത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നം [a] ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
