  yaml_path: translation/ot/1_kings/013/019.yaml
  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: ml
  text: അങ്ങനെ അവൻ അയാളോടൊപ്പം മടങ്ങിപ്പോയി, അയാളുടെ വീട്ടിൽവെച്ച് അപ്പം തിന്നുകയും വെള്ളം കുടിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അപ്പം തിന്നു.’ ഈ പ്രയോഗത്തിന് ഭക്ഷണം കഴിച്ചു എന്ന അർഥവും വരാം. എന്നാൽ ചുറ്റുപാടിലുള്ള വിവരണത്തിൽ ‘അപ്പം,’ ‘വെള്ളം’ എന്നിവയ്ക്ക് പ്രത്യേക പ്രാധാന്യമുള്ളതിനാൽ അക്ഷരാർഥത്തോടടുത്ത പദപ്രയോഗം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: മടങ്ങിപ്പോയി
  rationale: שׁוב എന്ന ധാതുവിന്റെ wayyiqtol രൂപം കഥയിലെ പൂർത്തിയായ മടക്കയാത്രയെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും സന്ദർഭത്തിലെ ദിശാമാറ്റം വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: אִתּוֹ
  choice: അയാളോടൊപ്പം
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുൽലിംഗ പ്രത്യയത്തോടുകൂടിയ ഉപസർഗം സഹഗമനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു. ഒരേ വാക്യത്തിലെ രണ്ടു പുരുഷന്മാരെ വേർതിരിച്ചറിയാൻ ‘അയാൾ’ സഹായിക്കുന്നു.
- source_word: וַיֹּאכַל לֶחֶם
  choice: അപ്പം തിന്നുകയും
  rationale: അക്ഷരാർഥം ‘അപ്പം തിന്നു’ എന്നാണ്. ഇത് ഭക്ഷണം കഴിക്കുക എന്ന പൊതുവായ അർഥമുള്ള പ്രയോഗമാകാമെങ്കിലും, ചുറ്റുപാടിലുള്ള വിവരണത്തിൽ അപ്പത്തിന് വിഷയപരമായ പ്രാധാന്യമുള്ളതിനാൽ മൂർത്തമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בְּבֵיתוֹ
  choice: അയാളുടെ വീട്ടിൽവെച്ച്
  rationale: ‘അവന്റെ വീട്ടിൽ’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; സന്ദർഭത്തിൽ വീട് പ്രായമായ പ്രവാചകന്റേതാണ്. ‘വെച്ച്’ പ്രവർത്തനത്തിന്റെ സ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: വെള്ളം കുടിക്കുകയും ചെയ്തു
  rationale: ക്രിയാപദസമുച്ചയത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ. ഈ സംഭവപരമ്പരയിൽ പ്രത്യേകമായി വിലക്കപ്പെട്ട പ്രവൃത്തി ആവർത്തിക്കുന്നതിനാൽ ‘വെള്ളം’ നിലനിർത്തുന്നു.
