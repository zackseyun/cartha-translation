language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: ml
  text: 'അവൻ അവനോട് പറഞ്ഞു: “ഞാനും നിന്നെപ്പോലെ ഒരു പ്രവാചകനാണ്. ഒരു ദൂതൻ[a] യഹ്‌വെയുടെ വചനപ്രകാരം എന്നോട് ഇങ്ങനെ സംസാരിച്ചു: ‘അവൻ അപ്പം തിന്നാനും വെള്ളം കുടിക്കാനും വേണ്ടി അവനെ നിന്നോടൊപ്പം നിന്റെ വീട്ടിലേക്കു തിരികെ കൊണ്ടുവരിക.’” എന്നാൽ അവൻ അവനോട് കള്ളം പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു സന്ദേശവാഹകൻ.” എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
    reason: മൂലപദമായ מַלְאָךְ-ന്റെ പദാർഥവ്യാപ്തി സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: נָבִיא
  choice: പ്രവാചകൻ
  rationale: ദൈവത്തിന്റെ സന്ദേശം അറിയിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പതിവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: מַלְאָךְ
  choice: ദൂതൻ
  rationale: എബ്രായപദത്തിന് സ്വർഗീയ ദൂതൻ എന്നും മനുഷ്യസന്ദേശവാഹകൻ എന്നും അർഥമാകാം. മലയാളത്തിലെ ‘ദൂതൻ’ ഈ സന്ദർഭത്തിൽ സ്വർഗീയ ദൂതനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുമ്പോഴും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר אֵלַי
  choice: എന്നോട് സംസാരിച്ചു
  rationale: നേരിട്ടുള്ള ആശയവിനിമയം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: בִּדְבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനപ്രകാരം
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള പ്രവാചകീയ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הֲשִׁבֵהוּ
  choice: അവനെ … തിരികെ കൊണ്ടുവരിക
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—മടങ്ങിവരാൻ ഇടയാക്കുക—വ്യക്തമായി നൽകുന്നു.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: നിന്നോടൊപ്പം നിന്റെ വീട്ടിലേക്ക്
  rationale: കൂടെ വരുന്നതും ലക്ഷ്യസ്ഥാനവും മൂലപാഠത്തോട് ചേർന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְיֹאכַל לֶחֶם וְיֵשְׁתְּ מָיִם
  choice: അവൻ അപ്പം തിന്നുകയും വെള്ളം കുടിക്കുകയും ചെയ്യേണ്ടതിന്
  rationale: കല്പനയ്ക്കു പിന്നാലെയുള്ള ഉദ്ദേശ്യാർഥം നിലനിർത്തുകയും ‘അപ്പം’, ‘വെള്ളം’ എന്നീ മൂർത്തപദങ്ങൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּחֵשׁ לוֹ
  choice: എന്നാൽ അവൻ അവനോട് കള്ളം പറഞ്ഞു
  rationale: വ്യാജം പറഞ്ഞതിനെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ വെളിപ്പെടുത്തൽ നേരിട്ടും വ്യക്തമായും നൽകുന്നു; ‘എന്നാൽ’ മുൻവാദവും യാഥാർഥ്യവും തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള പ്രത്യേക ഉടമ്പടിനാമം പൊതുപദമായി മാറ്റാതെ നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: מַלְאָךְ സ്വർഗീയ ദൂതനെയോ മനുഷ്യസന്ദേശവാഹകനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: സന്ദർഭം സ്വർഗീയ ദൂതനെന്ന വായനയ്ക്ക് അനുകൂലമായിരുന്നാലും എബ്രായപദം അതിൽ മാത്രം ഒതുങ്ങുന്നില്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘ദൂതൻ’ നൽകി പദത്തിന്റെ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ആവർത്തിക്കുന്ന സർവനാമങ്ങൾ മൂലപാഠത്തിലെ സൂചന നിലനിർത്തുന്നതിനായി സംരക്ഷിച്ചിട്ടുണ്ട്; വിവരണകർത്താവിന്റെ അവസാന വിലയിരുത്തൽ ചുരുക്കവും നേരിട്ടതുമാണ്.
