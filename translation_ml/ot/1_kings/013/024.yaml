  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: ml
  text: അവൻ പോയി; വഴിയിൽവെച്ച് ഒരു സിംഹം അവനെ കണ്ടെത്തി കൊന്നു. അവന്റെ ശവം വഴിയിൽ എറിയപ്പെട്ടുകിടന്നു[a]. കഴുത അതിന്റെ അരികിലും സിംഹം ശവത്തിന്റെ അരികിലും നിന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴിയിൽ എറിയപ്പെട്ട നിലയിലായിരുന്നു.” എബ്രായത്തിലെ കർമണി പങ്കാളിക രൂപം ശവം വെറുതെ അവിടെ കിടക്കുകയായിരുന്നു എന്നതിലുപരി, അത് അവിടെ എറിയപ്പെട്ട നിലയിലായിരുന്നുവെന്ന് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവൻ പോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമവിവരണമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּמְצָאֵהוּ
  choice: അവനെ കണ്ടെത്തി
  rationale: מצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കണ്ടെത്തുക’ നിലനിർത്തുന്നു; അപ്രതീക്ഷിതമായ അഭിമുഖീകരണം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אַרְיֵה
  choice: ഒരു സിംഹം
  rationale: ഇവിടെ ആദ്യം പരാമർശിക്കപ്പെടുന്ന മൃഗമായതിനാൽ അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച് / വഴിയിൽ
  rationale: യാത്രാസന്ദർഭത്തിലെ דרך എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യപ്രയോഗം; ആദ്യ occurrence-ൽ ‘വഴിയിൽവെച്ച്’, ശവത്തെക്കുറിച്ചുള്ള ദൃശ്യവിവരണത്തിൽ ‘വഴിയിൽ’ എന്നു നൽകി.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ഇവിടെ മരണത്തിന് ഇടയാക്കുക, അഥവാ കൊല്ലുക, എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്.
- source_word: נִבְלָתוֹ
  choice: അവന്റെ ശവം
  rationale: נבלה മരിച്ച ശരീരത്തെ സൂചിപ്പിക്കുന്നു. ‘ശവം’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദമാണ്.
- source_word: מֻשְׁלֶכֶת
  choice: എറിയപ്പെട്ടുകിടന്നു
  rationale: שלך എന്ന ധാതുവിന്റെ ഹോഫാൽ കർമണി പങ്കാളിക രൂപത്തിലുള്ള ‘എറിയപ്പെട്ട’ എന്ന അർഥവും, വഴിയിൽ അങ്ങനെ കിടന്നിരുന്ന ദൃശ്യാവസ്ഥയും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: കഴുത അതിന്റെ അരികിൽ നിന്നിരുന്നു
  rationale: עֹמֵד എന്ന പങ്കാളിക രൂപത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ദൃശ്യാവസ്ഥ ‘നിന്നിരുന്നു’ എന്നു നൽകി; സ്ത്രീലിംഗ പ്രത്യയം മുൻപുള്ള ‘ശവം’ എന്ന ആശയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: സിംഹം ശവത്തിന്റെ അരികിൽ നിന്നിരുന്നു
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച നാമം സർവനാമമാക്കി മാറ്റാതെ ‘ശവം’ എന്നു വീണ്ടും നൽകി; പങ്കാളിക രൂപത്തിന്റെ ദൃശ്യവിവരണ സ്വഭാവം ‘നിന്നിരുന്നു’ എന്നതിൽ നിലനിർത്തി.
