  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആഖ്യാനക്രമവും അവസാനത്തെ ദൃശ്യവിവരണവും നിലനിർത്തിയപ്പോൾ, മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കുന്ന സംയോജകങ്ങൾ ഒഴിവാക്കി. ‘കഴുത ... അരികിലും സിംഹം ... അരികിലും’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിലെ ആവർത്തനം സംക്ഷിപ്തമായും വ്യക്തമായും സൂക്ഷിക്കുന്നു.
