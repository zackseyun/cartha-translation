base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: ml
  text: ഞാൻ പ്രസവിച്ച് മൂന്നാം ദിവസം ഈ സ്ത്രീയും പ്രസവിച്ചു. ഞങ്ങൾ ഒരുമിച്ചായിരുന്നു; വീട്ടിൽ ഞങ്ങളോടൊപ്പം പുറത്തുനിന്നുള്ള ആരും[a] ഉണ്ടായിരുന്നില്ല. ഞങ്ങൾ രണ്ടുപേർ മാത്രമേ വീട്ടിൽ ഉണ്ടായിരുന്നുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യനായ ആരും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ആ കൂട്ടത്തിലോ വീട്ടുകാരിലോ പെടാത്ത ഒരാളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: ഞാൻ പ്രസവിച്ച് മൂന്നാം ദിവസം
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും പ്രസവത്തെ ആധാരമാക്കിയ സമയബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; എബ്രായത്തിലെ ക്രമവിവരണസൂത്രം വേറിട്ടൊരു കൃത്രിമ പ്രയോഗമായി ആവർത്തിക്കുന്നില്ല.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: ഈ സ്ത്രീയും പ്രസവിച്ചു
  rationale: הַזֹּאת എന്ന ചൂണ്ടിക്കാട്ടൽ ‘ഈ’ എന്നും גַּם എന്ന ഉൾപ്പെടുത്തൽ ‘-യും’ എന്നും നിലനിർത്തുന്നു.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: ഞങ്ങൾ ഒരുമിച്ചായിരുന്നു
  rationale: יַחְדָּו എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഒരുമിച്ച്’ നിലനിർത്തുന്നു; മറ്റാരും ഉണ്ടായിരുന്നില്ലെന്ന ആശയം തുടർന്നുള്ള വാക്യത്തിൽത്തന്നെ വ്യക്തമാകുന്നതിനാൽ ഇവിടെ ‘തനിച്ച്’ ചേർക്കുന്നില്ല.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: വീട്ടിൽ ഞങ്ങളോടൊപ്പം അന്യനായ ആരും ഉണ്ടായിരുന്നില്ല
  rationale: זָר എന്നത് കൂട്ടത്തിലോ വീട്ടുകാരിലോ പെടാത്ത അന്യനെ സൂചിപ്പിക്കുന്നു. ‘അന്യനായ ആരും’ അതിന്റെ പദാർഥം നിലനിർത്തുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: ഞങ്ങൾ രണ്ടുപേർ മാത്രമേ വീട്ടിൽ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: זוּלָתִי അവതരിപ്പിക്കുന്ന ഒഴിവാക്കലും രണ്ടുപേർ മാത്രമെന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ആവർത്തിച്ച ‘വീട്ടിൽ’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കോടതിവിവരണശൈലി ഉപയോഗിച്ചു. സ്ത്രീയുടെ ചൂണ്ടിക്കാട്ടലും സാക്ഷികളാരും ഇല്ലായിരുന്നുവെന്ന ആവർത്തിച്ച ഊന്നലും നിലനിർത്തി.
