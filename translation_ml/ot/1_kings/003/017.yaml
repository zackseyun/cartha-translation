source:
  edition: WLC
  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הָֽ/אַחַת֙ בִּ֣י אֲדֹנִ֔/י אֲנִי֙ וְ/הָ/אִשָּׁ֣ה הַ/זֹּ֔את יֹשְׁבֹ֖ת בְּ/בַ֣יִת אֶחָ֑ד וָ/אֵלֵ֥ד עִמָּ֖/הּ בַּ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/017.yaml
  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീകളിൽ ഒരാൾ പറഞ്ഞു: “യജമാനനേ, ദയവായി കേൾക്കണമേ! ഞാനും ഈ സ്ത്രീയും ഒരേ വീട്ടിൽ താമസിക്കുന്നു. അവൾ വീട്ടിൽ എന്നോടുകൂടെ ഉണ്ടായിരിക്കുമ്പോൾ ഞാൻ ഒരു കുഞ്ഞിനെ പ്രസവിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: യജമാനനേ, ദയവായി കേൾക്കണമേ
  rationale: ബִּי എന്ന അപേക്ഷാസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥവും അֲדֹנִי എന്ന ആദരപൂർവമായ അഭിസംബോധനയും ചേർത്ത് നൽകുന്നു; രാജാവിനോടുള്ള അപേക്ഷയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: ഒരേ വീട്ടിൽ താമസിക്കുന്നു
  rationale: യֹשְׁבֹת എന്ന വർത്തമാന പങ്കാളിത്തരൂപത്തിന്റെ നിലനിൽക്കുന്ന താമസാവസ്ഥയും בַיִת אֶחָד എന്നതിന്റെ ‘ഒരേ വീട്’ എന്ന ആശയവും വ്യക്തമായി പകരുന്നു.
- source_word: וָאֵלֵד
  choice: ഞാൻ ഒരു കുഞ്ഞിനെ പ്രസവിച്ചു
  rationale: ക്രിയയ്ക്ക് നേരിട്ടുള്ള കർമപദം ഇല്ലെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സൂചിതമായ ‘ഒരു കുഞ്ഞിനെ’ ചേർത്തിരിക്കുന്നു.
- source_word: עִמָּהּ בַּבָּיִת
  choice: അവൾ വീട്ടിൽ എന്നോടുകൂടെ ഉണ്ടായിരിക്കുമ്പോൾ
  rationale: עִמָּהּ എന്നത് അക്ഷരാർഥത്തിൽ ‘അവളോടുകൂടെ’ എന്നാണെങ്കിലും പ്രസവിച്ച സ്ത്രീയുടെ കാഴ്ചപ്പാടിൽ ഇംഗ്ലീഷ് consultation layer വ്യക്തമാക്കുന്ന സഹസാന്നിധ്യം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രാജസഭയിലെ ആദരപൂർവമായ അപേക്ഷ ‘യജമാനനേ, ദയവായി കേൾക്കണമേ’ എന്നു നൽകിയിരിക്കുന്നു.
