language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസൻ അങ്ങ് തിരഞ്ഞെടുത്ത അങ്ങയുടെ ജനത്തിന്റെ മധ്യേയിലാണ്; ആ ജനം എണ്ണാനോ കണക്കാക്കാനോ കഴിയാത്തത്ര ബഹുസംഖ്യമായ വലിയൊരു ജനസമൂഹമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ദൈവത്തോടുള്ള ശലോമോന്റെ വിനയപൂർവമായ അഭിസംബോധനയിൽ עֶבֶד എന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളം ‘ദാസൻ’ ആണ്; കീഴ്പ്പെട്ട ബന്ധവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: അങ്ങയുടെ ജനത്തിന്റെ മധ്യേ
  rationale: בְּתוֹךְ എന്നത് ജനത്തിനിടയിൽ സ്ഥിതിചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മധ്യേ’ മൂലപാഠത്തിന്റെ രൂപഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: അങ്ങ് തിരഞ്ഞെടുത്ത
  rationale: ദൈവം ഈ ജനത്തെ തിരഞ്ഞെടുത്തുവെന്ന എബ്രായ പാഠത്തിലെ വ്യക്തമായ പ്രസ്താവന വിപുലീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַם רָב
  choice: വലിയൊരു ജനസമൂഹം
  rationale: ഇവിടെ רַב പ്രധാനമായി സംഖ്യാബാഹുല്യത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള എണ്ണാനാകാത്തതിനെക്കുറിച്ചുള്ള വാക്യം ഈ അർഥം ഉറപ്പിക്കുന്നു. ‘ജനസമൂഹം’ എന്നത് മലയാളത്തിൽ ഈ കൂട്ടായ, സംഖ്യാപരമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: എണ്ണാനോ തിട്ടപ്പെടുത്താനോ കഴിയുകയില്ല
  rationale: מנה, ספר എന്നീ സമാന്തര ക്രിയകളുടെ എണ്ണൽ/കണക്കാക്കൽ ഭാവം രണ്ടു വ്യത്യസ്ത മലയാളക്രിയകളിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֵרֹב
  choice: പെരുപ്പം നിമിത്തം
  rationale: എണ്ണാനും തിട്ടപ്പെടുത്താനും കഴിയാത്തതിന്റെ കാരണം ജനത്തിന്റെ ബാഹുല്യമാണെന്ന മൂലപാഠത്തിലെ കാരണബന്ധം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ ദൈവം തിരഞ്ഞെടുത്ത ജനമാണെന്ന ഉടമ്പടിപരമായ പ്രസ്താവന
  choice: അങ്ങ് തിരഞ്ഞെടുത്ത അങ്ങയുടെ ജനം
  alternative: അങ്ങയുടെ ജനം
  rationale: אֲשֶׁר בָּחָרְתָּ എന്ന വാക്കുകൾ തിരഞ്ഞെടുപ്പിനെ വ്യക്തമായി പറയുന്നു; അതിനാൽ അവ ഒഴിവാക്കാതെയും പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ വിശദീകരണങ്ങൾ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ജനത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടനാമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ തുടർവാക്യത്തിൽ ‘അവർ’ ഉപയോഗിച്ചു.
