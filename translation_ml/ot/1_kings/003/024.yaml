id: 1KI.3.24
reference: 1 Kings 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ קְח֣וּ לִ/י חָ֑רֶב וַ/יָּבִ֥אוּ הַ/חֶ֖רֶב לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പറഞ്ഞു: “എനിക്ക് ഒരു വാൾ കൊണ്ടുവരിക.” അവർ ആ വാൾ രാജാവിന്റെ മുമ്പിൽ കൊണ്ടുവന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതത്വമുള്ള ‘രാജാവ്’ എന്ന നാമത്തിന് മലയാളത്തിൽ പ്രസക്തമായ സ്വാഭാവിക രൂപം.
- source_word: קְחוּ לִי
  choice: എനിക്ക് ... കൊണ്ടുവരിക
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ സംസാരിക്കുന്നയാളുടെ അടുക്കലേക്ക് വാൾ എത്തിക്കാനുള്ള കല്പനയായതിനാൽ ‘കൊണ്ടുവരിക’ സന്ദർഭോചിതമാണ്.
- source_word: חָרֶב
  choice: ഒരു വാൾ
  rationale: ആദ്യ പരാമർശം നിർദേശക ഉപപദമില്ലാത്തതാണ്; അതിനാൽ അനിശ്ചിതമായ ‘ഒരു വാൾ’ യോജിക്കുന്നു.
- source_word: וַיָּבִאוּ
  choice: അവർ ... കൊണ്ടുവന്നു
  rationale: ബഹുവചന ക്രിയയും കല്പനയ്ക്കു പിന്നാലെയുള്ള പ്രവൃത്തിയും നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിൽ വേറൊരു ബന്ധപദം ചേർക്കാതെ തുടർച്ച സ്വാഭാവികമാണ്.
- source_word: הַחֶרֶב
  choice: ആ വാൾ
  rationale: രണ്ടാം പരാമർശത്തിൽ നിശ്ചിത ഉപപദമുണ്ട്; മുമ്പ് ആവശ്യപ്പെട്ട വാളിലേക്കുള്ള തിരിച്ചുസൂചന മലയാളത്തിലെ ‘ആ’ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പിൽ
  rationale: രാജസന്നിധിയിലേക്കു കൊണ്ടുവന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവും ഉറവിടത്തോട് അടുത്തതുമായ പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കല്പനയിൽ ‘കൊണ്ടുവരിക’ ഉപയോഗിച്ച് ഔപചാരികത നിലനിർത്തി; ആദ്യത്തെയും രണ്ടാമത്തെയും ‘വാൾ’ പരാമർശങ്ങളിലെ അനിശ്ചിതത്വവും നിശ്ചിതത്വവും യഥാക്രമം ‘ഒരു’, ‘ആ’ എന്നിങ്ങനെ പ്രകടമാക്കി.
