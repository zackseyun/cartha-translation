id: 1KI.3.4
reference: 1 Kings 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: ml
  text: രാജാവ് അവിടെ ബലിയർപ്പിക്കാൻ ഗിബെയോനിലേക്കു പോയി; കാരണം, അതായിരുന്നു പ്രധാന ഉന്നത ആരാധനാസ്ഥലം[a]. ശലോമോൻ ആ യാഗപീഠത്തിന്മേൽ ആയിരം ഹോമയാഗങ്ങൾ അർപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയ ഉന്നത ആരാധനാസ്ഥലം.’ എബ്രായ വിശേഷണം വലിപ്പത്തെയോ പ്രാമുഖ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַמֶּלֶךְ גִּבְעֹנָה
  choice: രാജാവ് ഗിബെയോനിലേക്കു പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയും സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ ה-യും സ്വാഭാവിക മലയാളത്തിൽ ‘ഗിബെയോനിലേക്കു പോയി’ എന്നു നൽകുന്നു.
- source_word: לִזְבֹּחַ שָׁם
  choice: അവിടെ ബലിയർപ്പിക്കാൻ
  rationale: זבח പൊതുവായ ബലിയർപ്പണപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ബലിയർപ്പിക്കാൻ’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: הַבָּמָה הַגְּדוֹלָה
  choice: പ്രധാന പൂജാഗിരി
  rationale: במה ആരാധനയ്ക്കുള്ള ഉയർന്ന സ്ഥലമാണ്; ‘പൂജാഗിരി’ ചരിത്ര-ആരാധനാപരമായ അർത്ഥം നിലനിർത്തുന്നു. גדולה ഇവിടെ വലിപ്പത്തെയോ പ്രാമുഖ്യത്തെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ ‘പ്രധാന’ സ്വാഭാവികമാണ്, എന്നാൽ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: אֶלֶף עֹלוֹת
  choice: ആയിരം ഹോമയാഗങ്ങൾ
  rationale: עֹלוֹת പൂർണമായി ദഹിപ്പിക്കുന്ന പ്രത്യേക യാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘ഹോമയാഗങ്ങൾ’ ഉപയോഗിക്കുന്നു; സംഖ്യ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַעֲלֶה שְׁלֹמֹה
  choice: ശലോമോൻ ... അർപ്പിച്ചു
  rationale: עלה എന്ന ഹിഫീൽ രൂപം ഹോമയാഗവുമായി ചേർന്ന് ‘അർപ്പിക്കുക’ എന്ന യാഗസാങ്കേതിക അർത്ഥം നൽകുന്നു. ഈ ആഖ്യാനസന്ദർഭത്തിൽ യിഖ്തോൽ രൂപം അനാവശ്യമായ പതിവർത്ഥം ചുമത്താതെ ലളിതമായ ഭൂതകാലമായി നൽകുന്നു.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: ആ യാഗപീഠത്തിന്മേൽ
  rationale: മുൻപറഞ്ഞ ആരാധനാസ്ഥലത്തോടു ബന്ധപ്പെട്ട നിർദ്ദിഷ്ട യാഗപീഠത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദേവാലയനിർമാണത്തിനു മുമ്പുള്ള ആരാധനാസന്ദർഭത്തിൽ בָּמָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പൂജാഗിരി
  alternative: ആരാധനാസ്ഥലം
  rationale: കൂടുതൽ പൊതുവായ ‘ആരാധനാസ്ഥലം’ എന്നത് സ്ഥലത്തിന്റെ ഉയർന്നതും പ്രത്യേക ആരാധനാപരവുമായ സ്വഭാവം മൃദൂകരിക്കും. ‘പൂജാഗിരി’ ആ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: יַעֲלֶה എന്ന രൂപത്തിന്റെ കാല-ഭാവാർഥം
  choice: അർപ്പിച്ചു
  alternative: അർപ്പിക്കാറുണ്ടായിരുന്നു
  rationale: യിഖ്തോൽ ചിലപ്പോൾ പതിവിനെ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ ആയിരം ഹോമയാഗങ്ങൾ എന്ന നിർദ്ദിഷ്ട സംഭവത്തോടൊപ്പം ലളിതമായ ഭൂതകാലമാണ് സന്ദർഭോചിതം; പതിവർത്ഥം നിർബന്ധമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പൂജാഗിരി,’ ‘യാഗപീഠം,’ ‘ഹോമയാഗം’ എന്നീ പദങ്ങൾ പുരാതന ആരാധനാസന്ദർഭത്തിന്റെ പ്രത്യേകത സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
