id: 1KI.3.13
reference: 1 Kings 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: ml
  text: 'നീ ചോദിക്കാത്തതും ഞാൻ നിനക്കു തന്നിരിക്കുന്നു: സമ്പത്തും ബഹുമാനവും. അങ്ങനെ, നിന്റെ ആയുഷ്കാലമൊക്കെയും രാജാക്കന്മാരുടെ ഇടയിൽ നിന്നെപ്പോലെ ഒരു മനുഷ്യനും ഉണ്ടായിരിക്കുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ആയുഷ്കാലമൊക്കെയും രാജാക്കന്മാരുടെ ഇടയിൽ നിന്നെപ്പോലെ ഒരു മനുഷ്യനും ഉണ്ടായിട്ടില്ല.”
    reason: לֹא הָיָה എന്ന ഹീബ്രു പൂർണ്ണക്രിയയെ ഭൂതകാല/പൂർണ്ണകാല അർഥത്തിൽ വായിക്കാവുന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ ... -വും
  rationale: മുമ്പ് ശലോമോൻ ചോദിച്ചതിന് ലഭിച്ച ഉത്തരത്തോടൊപ്പം മറ്റൊരു ദാനവും ചേർക്കുന്നതാണ് ഈ സംയോജകപ്രയോഗം; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ വർധകബലം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: നീ ചോദിക്കാത്തതും
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ നാമവൽക്കരിച്ച രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ശലോമോൻ അഭ്യർഥിക്കാത്ത കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נָתַתִּי לָךְ
  choice: ഞാൻ നിനക്കു തന്നിരിക്കുന്നു
  rationale: ഹീബ്രു പൂർണ്ണക്രിയ ദാനം ഉറപ്പായി നൽകിയതും അതിന് ഇപ്പോഴത്തെ പ്രസക്തിയുള്ളതുമാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: സമ്പത്തും ബഹുമാനവും കൂടെ
  rationale: ആവർത്തിച്ചുള്ള גַּם രണ്ടു അനുഗ്രഹങ്ങളെയും പ്രത്യേകം കൂട്ടിച്ചേർക്കുന്നു. രാജകീയ-മാനുഷിക പശ്ചാത്തലത്തിൽ כָּבוֹד എന്നതിന് ‘മഹത്വം’ എന്നതിനെക്കാൾ ‘ബഹുമാനം’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: അതിനാൽ ... നിന്നെപ്പോലെ ഒരു മനുഷ്യൻ ഉണ്ടായിരിക്കുകയില്ല
  rationale: ദാനത്തിന്റെ ഫലമായി ശലോമോന്റെ സമാനതയില്ലായ്മ വ്യക്തമാക്കുന്നു; אִישׁ എന്ന പദത്തിന്റെ പുരുഷലിംഗ ഏകവചനസൂചന ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בַּמְּלָכִים
  choice: രാജാക്കന്മാരുടെ ഇടയിൽ
  rationale: ശലോമോനെ രാജാക്കന്മാരുടെ ഗണത്തിനുള്ളിൽ താരതമ്യം ചെയ്യുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל יָמֶיךָ
  choice: നിന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ‘നിന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ജീവിതകാലം മുഴുവൻ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: രാജാക്കന്മാരോടുള്ള താരതമ്യത്തിൽ אִישׁ എന്ന പദത്തിന്റെ അവതരണം
  choice: നിന്നെപ്പോലെ ഒരു മനുഷ്യൻ
  alternative: നിന്നെപ്പോലെ ആരും / നിന്നെപ്പോലെ ഒരു രാജാവും
  rationale: മൂലപാഠം പൊതുവായ അനിശ്ചിത സർവനാമമോ ‘രാജാവ്’ എന്ന പദമോ അല്ല, אִישׁ (‘മനുഷ്യൻ/പുരുഷൻ’) എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ നിലനിർത്തുന്നത് പാഠത്തിന്റെ കൃത്യത സംരക്ഷിക്കുന്നു.
- issue: לֹא הָיָה എന്ന പൂർണ്ണക്രിയയുടെ കാലസൂചന
  choice: ഉണ്ടായിരിക്കുകയില്ല
  alternative: ഉണ്ടായിട്ടില്ല
  rationale: ദൈവം ഇപ്പോൾ നൽകുന്ന സമ്പത്തിന്റെയും ബഹുമാനത്തിന്റെയും ഫലവും ‘നിന്റെ ആയുഷ്കാലമൊക്കെയും’ എന്ന ഭാവിമുഖമായ പരിധിയും കണക്കിലെടുത്ത് മലയാളത്തിൽ ഭാവികാലം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഹീബ്രു പൂർണ്ണക്രിയ മൂലം ഭൂത/പൂർണ്ണകാല വായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: രണ്ടാമത്തെ אֲשֶׁר-ന്റെ ബന്ധം
  choice: അതിനാൽ
  alternative: അങ്ങനെ / അതായത്
  rationale: ഈ ഉപവാക്യം നൽകിയ സമ്പത്തിന്റെയും ബഹുമാനത്തിന്റെയും ഫലം വ്യക്തമാക്കുന്നതായി വായിക്കുന്നു; ഹീബ്രു ബന്ധകത്തിന്റെ ലാഘവം കണക്കിലെടുത്ത് അതിനെ അത്യന്തം കർശനമായ ഉദ്ദേശ്യവാക്യമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സമ്പത്ത്’, ‘ബഹുമാനം’, ‘ആയുഷ്കാലം’ എന്നീ പദങ്ങൾ രാജകീയ പശ്ചാത്തലത്തിന് യോജിച്ചുകൊണ്ട് അനാവശ്യമായ പുരാതനഭാഷ ഒഴിവാക്കുന്നു.
