  terminology: '''യഹ്‌വെ,'' ''ചട്ടങ്ങൾ,'' ''യാഗങ്ങൾ അർപ്പിക്കുക,'' and ''ധൂപം കത്തിക്കുക'' are suitable. The revised rendering replaces only the potentially misleading term for בָּמוֹת. The contrastive ''എന്നാൽ'' remains a defensible rendering of the restrictive רַק without turning the qualification into an outright condemnation.'
