  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: ml
  text: ശലോമോൻ തന്റെ പിതാവായ ദാവീദിന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് ജീവിച്ചുകൊണ്ട് യഹ്‌വെയെ സ്നേഹിച്ചു; എന്നാൽ[a] അവൻ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളിൽ[b] യാഗങ്ങൾ അർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവൻ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളിൽ യാഗങ്ങൾ അർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തിരുന്നു എന്നൊരു അപവാദം മാത്രം ഉണ്ടായിരുന്നു.’'
    reason: רַק എന്ന പദം മുൻപ്രസ്താവനയ്ക്കുള്ള ഒരു അപവാദമോ പരിമിതിയോ ആയി കൂടുതൽ വ്യക്തമായി വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: ‘ഉയർന്ന ആരാധനാസ്ഥലങ്ങൾ’ പ്രാദേശികമായ, സാധാരണയായി ഉയർന്ന സ്ഥലങ്ങളിലുള്ള ആരാധനാകേന്ദ്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: പുരാതന ഇസ്രായേലിലെ ആരാധനാസംബന്ധമായ സാംസ്കാരിക പദം വിശദീകരിക്കുന്നു.
  - marker: c
    text: ഇവിടെയുള്ള എബ്രായപദം ധൂപമോ മറ്റു യാഗവസ്തുക്കളോ പുകയായി ഉയർത്തുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: וּמַקְטִיר എന്ന പദത്തിന്റെ ആരാധനാസന്ദർഭത്തിലുള്ള അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: സ്നേഹിച്ചു
  rationale: אהב എന്ന ക്രിയയുടെ സ്നേഹവും ആത്മബന്ധവും നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തിന്റെ മലയാളലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: ചട്ടങ്ങൾ അനുസരിച്ച് ജീവിച്ചുകൊണ്ട്
  rationale: ‘നടക്കുക’ എന്ന എബ്രായ രൂപകം തുടർച്ചയായ ജീവിതചര്യയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും חֻקּוֹת എന്നതിന്റെ നിയമപരമായ ഭാവം ‘ചട്ടങ്ങൾ’കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ
  rationale: ബന്ധവും നാമവും മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻപുള്ള അനുകൂല വിലയിരുത്തലിന് പരിധി കുറിക്കുന്ന വിരുദ്ധഭാവം നൽകുന്നു; അതിനെ അതിരുകടന്ന് കുറ്റവിധിയാക്കി മാറ്റുന്നില്ല.
- source_word: בַּבָּמוֹת
  choice: പൂജാമേടുകളിൽ
  rationale: במות സൂചിപ്പിക്കുന്ന പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങൾക്ക് സംക്ഷിപ്തമായ മലയാളപദം; സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מְזַבֵּחַ
  choice: യാഗങ്ങൾ അർപ്പിക്കുകയും … ചെയ്തിരുന്നു
  rationale: പങ്കുപദരൂപം പതിവായോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്തിരുന്നു’ എന്ന അപൂർണഭൂതരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וּמַקְטִיר
  choice: ധൂപം കത്തിക്കുകയും
  rationale: ആരാധനാസന്ദർഭത്തിൽ സ്വാഭാവികമായ അർഥം നൽകുന്നു; ധൂപത്തിനോ പുകയായി ഉയർത്തുന്ന മറ്റു യാഗവസ്തുക്കൾക്കോ പദം ബാധകമാകാമെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശലോമോന്റെ ആരാധനാരീതിയെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ വിലയിരുത്തൽ
  choice: ശലോമോൻ യഹ്‌വെയെ സ്നേഹിച്ചു എന്ന അനുകൂല പ്രസ്താവന നിലനിർത്തി, പൂജാമേടുകളിലെ ആരാധനയെ ‘എന്നാൽ’ എന്ന പരിധിനിർണയത്തോടെ ചേർക്കുന്നു.
  alternative: ആരംഭത്തിലെ പ്രശംസയെ പരിഹാസമോ കടുത്ത വിമർശനമോ ആയി വായിക്കുക; അല്ലെങ്കിൽ പൂജാമേടുകളിലെ ആരാധനയെ പൂർണമായി അംഗീകരിച്ചതായി വായിക്കുക.
  rationale: വാക്യഘടന ആദ്യം അനുകൂല വിലയിരുത്തലും തുടർന്ന് רַק മുഖേന അതിനൊരു പരിമിതിയും നൽകുന്നു. പരിഭാഷ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘യഹ്‌വെ’ ദൈവനാമമായി നിലനിർത്തുന്നു. എബ്രായത്തിലെ ‘നടക്കുക’ എന്ന രൂപകത്തെ അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവികമായ ‘ജീവിക്കുക’ എന്നു നൽകുന്നു; എന്നാൽ വാക്യത്തിലെ അനുകൂല വിലയിരുത്തലും അതിനെ പരിമിതപ്പെടുത്തുന്ന ആരാധനാരീതിയും തമ്മിലുള്ള സംഘർഷം സംരക്ഷിക്കുന്നു.
