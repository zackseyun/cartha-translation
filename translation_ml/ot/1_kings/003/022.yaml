  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: ml
  text: 'എന്നാൽ മറ്റേ സ്ത്രീ പറഞ്ഞു[a]: “അല്ല! ജീവനുള്ളവൻ എന്റെ മകനാണ്; മരിച്ചവൻ നിന്റെ മകനാണ്.” ഈ സ്ത്രീ പറഞ്ഞു: “അല്ല! മരിച്ചവൻ നിന്റെ മകനാണ്; ജീവനുള്ളവൻ എന്റെ മകനാണ്.” ഇങ്ങനെ അവർ രാജാവിന്റെ മുമ്പാകെ സംസാരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യവഹാരികമായി: “എന്റെ മകൻ ജീവനോടെയുണ്ട്; നിന്റെ മകൻ മരിച്ചിരിക്കുന്നു ... നിന്റെ മകൻ മരിച്ചിരിക്കുന്നു; എന്റെ മകൻ ജീവനോടെയുണ്ട്.” മുഖ്യപാഠം എബ്രായത്തിലെ ‘ജീവനുള്ളവൻ / മരിച്ചവൻ’ എന്ന വൈരുധ്യം നിലനിർത്തുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനത്തിലെ സംസാരക്രിയയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: മറ്റേ സ്ത്രീ
  rationale: തർക്കത്തിലുള്ള രണ്ടാമത്തെ സ്ത്രീയെയാണ് സൂചിപ്പിക്കുന്നത്; വിവാഹബന്ധമെന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: לֹא כִי
  choice: അല്ല!
  rationale: ശക്തമായ നിഷേധവും എതിർവാദത്തിന്റെ മൂർച്ചയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנִי הַחַי
  choice: ജീവനുള്ളവൻ എന്റെ മകനാണ്
  rationale: നിർദിഷ്ടരായ രണ്ടു ശിശുക്കളിൽ ജീവനുള്ളവനെയും മരിച്ചവനെയും എതിർനിർത്തുന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: וּבְנֵךְ הַמֵּת
  choice: മരിച്ചവൻ നിന്റെ മകനാണ്
  rationale: ‘ജീവനുള്ളവൻ’ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരതയും തിരിച്ചറിയൽ സംബന്ധമായ തർക്കഭാവവും നിലനിർത്തുന്നു.
- source_word: וְזֹאת אֹמֶרֶת
  choice: അപ്പോൾ ഇവൾ പറഞ്ഞു
  rationale: זֹאת എന്ന സ്ത്രീലിംഗ നിർദേശകപദത്തിന്റെ ‘ഇവൾ’ എന്ന സൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മറുപടി സ്വാഭാവികമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിക്കുന്നു.
- source_word: וַתְּדַבֵּרְנָה
  choice: ഇങ്ങനെ അവർ ... സംസാരിച്ചു
  rationale: സ്ത്രീലിംഗ ബഹുവചന ക്രിയ രണ്ടു സ്ത്രീകളുടെയും വാദപ്രതിവാദത്തെ സംഗ്രഹിക്കുന്നു.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: രാജാവിന്റെ മുമ്പാകെ
  rationale: രാജസന്നിധിയിലെ ഔപചാരിക സാഹചര്യത്തിന് യോജിച്ച, മൂലത്തോട് അടുത്ത മലയാളപ്രയോഗമാണ്.
