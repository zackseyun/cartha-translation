  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കോടതിസദൃശമായ തർക്കത്തിന്റെ മൂർച്ചയും മൂലപാഠത്തിലെ സമാന്തര വൈരുധ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
