  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. ‘കൊടുത്താലും’ concessive അർഥം (‘കൊടുത്താലും മതി’) സൂചിപ്പിക്കുന്നു; ഇവിടെ അമ്മയുടെ അടിയന്തരമായ അപേക്ഷയായ ‘കൊടുക്കണമേ’ വേണം. בִּי അപ്പീലിലെ അപേക്ഷാസൂചകമാണ്; ‘അയ്യോ’ മാത്രം അതിനെ മതിയായി അറിയിക്കുന്നില്ല. നിഖ്മെറു രഹമേഹാ എന്ന പ്രയോഗത്തിലെ കരുണയുടെ തീവ്രത ‘മകനോടുള്ള അവളുടെ കരുണ ഉള്ളിൽ തിളച്ചുപൊങ്ങി’ എന്നതിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: നിലവിലെ വാക്യത്തിൽ ‘...തിനാൽ അവൾ പറഞ്ഞു:’ എന്നതിന് പിന്നാലെ അതേ സ്ത്രീയുടെ നേരിട്ടുള്ള വാക്കുകൾ വരുന്നത് അല്പം ഭാരമുള്ളതായിരുന്നു. കാരണവാക്യം ‘രാജാവിനോടു പറഞ്ഞു’ എന്നതോടു ചേർത്ത് പുനഃക്രമീകരിച്ചിരിക്കുന്നു. ‘ദയവായി, യജമാനനേ’ ആധുനികവും ആദരസൂചകവുമായ അടിയന്തര അപേക്ഷയാണ്.
  terminology: ‘ജീവനുള്ള കുഞ്ഞ്,’ ‘മറ്റേ സ്ത്രീ,’ ‘അവൻ എനിക്കുമല്ല, നിനക്കുമല്ല,’ ‘രണ്ടായി വെട്ടുക’ എന്നിവ എബ്രായ പാഠത്തിലെ വ്യത്യാസവും ക്രൂരമായ ആജ്ഞയുടെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു. ‘യജമാനനേ’ ഇവിടെ രാജാവിനോടുള്ള ബഹുമാനപൂർവമായ അഭിസംബോധനയായി ഉപയോഗിച്ചിരിക്കുന്നു.
