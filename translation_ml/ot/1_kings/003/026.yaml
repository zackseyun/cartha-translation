base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: ml
  text: 'അപ്പോൾ ജീവനുള്ള കുഞ്ഞിന്റെ അമ്മ, മകനോടുള്ള അവളുടെ കരുണ ഉള്ളിൽ തിളച്ചുപൊങ്ങിയതിനാൽ[a], രാജാവിനോടു പറഞ്ഞു: “ദയവായി, യജമാനനേ, ജീവനുള്ള കുഞ്ഞിനെ അവൾക്കു കൊടുക്കണമേ; അവനെ ഒരിക്കലും കൊല്ലരുതേ!” എന്നാൽ മറ്റേ സ്ത്രീ പറഞ്ഞു: “അവൻ എനിക്കുമല്ല, നിനക്കുമല്ല; അവനെ രണ്ടായി വെട്ടുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം, ‘അവളുടെ കരുണകൾ മകനെച്ചൊല്ലി ചൂടുപിടിച്ചു’ എന്നതിനോടു ചേർന്നതാണ്; അതു തീവ്രമായ മാതൃകരുണയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: അവളുടെ വാത്സല്യം ഉള്ളിൽ തിളച്ചുപൊങ്ങി
  rationale: כמר എന്ന ക്രിയയുടെ ‘ചൂടുപിടിക്കുക/തീവ്രമായി ഇളകുക’ എന്ന ദൃശ്യവും רחמים എന്ന മാതൃസഹജമായ ആർദ്രവാത്സല്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בִּי אֲדֹנִי
  choice: അയ്യോ, യജമാനനേ
  rationale: നേരിട്ടുള്ള അപേക്ഷയിലെ അടിയന്തരതയും രാജാവിനോടുള്ള ആദരവും പ്രകടമാക്കുന്ന സ്വാഭാവിക മലയാള അഭിസംബോധന.
- source_word: הַיָּלוּד הַחַי
  choice: ജീവനുള്ള കുഞ്ഞ്
  rationale: יַלוּד ജനിച്ച ശിശുവിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച പ്രായഭാവവും ‘ജീവനുള്ള’ എന്ന വൈരുധ്യവും സൂക്ഷിക്കുന്നു.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: അവനെ ഒരിക്കലും കൊല്ലരുതേ
  rationale: infinitive absolute-ഉം finite verb-ഉം ചേർന്ന ശക്തമായ നിരോധനം ‘ഒരിക്കലും’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וְזֹאת אֹמֶרֶת
  choice: എന്നാൽ മറ്റേ സ്ത്രീ പറഞ്ഞു
  rationale: പ്രകടമായ വിരുദ്ധതയും രണ്ടാമത്തെ സ്ത്രീയിലേക്കുള്ള സൂചനയും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: അവൻ എനിക്കുമല്ല, നിനക്കുമല്ല
  rationale: അധ്യാഹൃത കർത്താവ് ആൺകുഞ്ഞാണെന്ന സന്ദർഭസൂചനയും ഇരുവർക്കും അവകാശമില്ലെന്ന ക്രൂരമായ നിലപാടും സൂക്ഷിക്കുന്നു.
- source_word: גְּזֹרוּ
  choice: അവനെ രണ്ടായി വെട്ടിക്കളയൂ
  rationale: മുൻവാക്യത്തിൽ നിർദേശിച്ച വിഭജനത്തെ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കി, ആജ്ഞയുടെ പെട്ടെന്നുള്ള ക്രൂരത നിലനിർത്തുന്നു.
