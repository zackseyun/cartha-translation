- from: 'അപ്പോൾ ജീവനുള്ള കുഞ്ഞിന്റെ അമ്മ രാജാവിനോടു പറഞ്ഞു—മകനോടുള്ള അവളുടെ വാത്സല്യം ഉള്ളിൽ തിളച്ചുപൊങ്ങിയതിനാൽ[a] അവൾ പറഞ്ഞു: “അയ്യോ, യജമാനനേ, ജീവനുള്ള കുഞ്ഞിനെ അവൾക്കു കൊടുത്താലും; അവനെ ഒരിക്കലും കൊല്ലരുതേ!” എന്നാൽ മറ്റേ സ്ത്രീ പറഞ്ഞു: “അവൻ എനിക്കുമല്ല, നിനക്കുമല്ല; അവനെ രണ്ടായി വെട്ടിക്കളയൂ.”'
  to: 'അപ്പോൾ ജീവനുള്ള കുഞ്ഞിന്റെ അമ്മ, മകനോടുള്ള അവളുടെ കരുണ ഉള്ളിൽ തിളച്ചുപൊങ്ങിയതിനാൽ[a], രാജാവിനോടു പറഞ്ഞു: “ദയവായി, യജമാനനേ, ജീവനുള്ള കുഞ്ഞിനെ അവൾക്കു കൊടുക്കണമേ; അവനെ ഒരിക്കലും കൊല്ലരുതേ!” എന്നാൽ മറ്റേ സ്ത്രീ പറഞ്ഞു: “അവൻ എനിക്കുമല്ല, നിനക്കുമല്ല; അവനെ രണ്ടായി വെട്ടുക.”'
  rationale: പ്രധാന തിരുത്തലുകൾ അപേക്ഷയുടെ ക്രിയാരൂപവും ബഹുമാനപൂർവമായ അപേക്ഷാസൂചകവും കൃത്യമാക്കുന്നതിനാണ്. ‘ഒരിക്കലും കൊല്ലരുതേ’ എബ്രായത്തിലെ infinitive absolute ചേർന്ന ശക്തമായ നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. പാഠത്തിലെ വ്യാഖ്യാനസാധ്യതകൾ അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
