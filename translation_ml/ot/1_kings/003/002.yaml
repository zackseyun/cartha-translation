id: 1KI.3.2
reference: 1 Kings 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: ml
  text: എന്നാൽ ജനങ്ങൾ ഉന്നത സ്ഥലങ്ങളിൽ[a] യാഗങ്ങൾ അർപ്പിച്ചുപോന്നു; യഹ്‌വെയുടെ നാമത്തിനായി ഒരു ഭവനം പണിയപ്പെട്ടിരുന്നില്ലായിരുന്നതിനാൽ അക്കാലംവരെ അവർ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം ഉയർന്നതോ പ്രാദേശികമോ ആയ ആരാധനാസ്ഥലങ്ങളെയും യാഗപീഠങ്ങളുള്ള ആരാധനാകേന്ദ്രങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: ബָּמוֹת എന്ന പദത്തിന്റെ സാംസ്കാരികവും ആരാധനാസംബന്ധവുമായ അർത്ഥം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: רַק
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ശലോമോനെക്കുറിച്ചുള്ള അനുകൂല വിലയിരുത്തലിന് ഒരു പരിമിതി സൂചിപ്പിക്കുന്ന concessive പ്രയോഗം; മലയാളത്തിൽ ‘എന്നാൽ’ സ്വാഭാവികമായി ആ തിരിവ് നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: സാങ്കേതികമായി ഒരു പ്രത്യേക സാമൂഹിക വിഭാഗമല്ല, പൊതുവായ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מְזַבְּחִים
  choice: യാഗങ്ങൾ അർപ്പിച്ചുപോന്നു
  rationale: ഹീബ്രു participle സൂചിപ്പിക്കുന്ന പതിവായോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בַּבָּמוֹת
  choice: പൂജാഗിരികളിൽ
  rationale: במות എന്നത് ആരാധനയ്ക്കും യാഗത്തിനും ഉപയോഗിച്ചിരുന്ന ഉയർന്ന പൂജാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗത അർത്ഥവും സാധാരണ വായനക്കാരനുള്ള വ്യക്തതയും ഒരുമിപ്പിക്കുന്ന പദം.
- source_word: כִּי
  choice: കാരണം
  rationale: ജനങ്ങൾ പൂജാഗിരികളിൽ യാഗമർപ്പിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לֹא נִבְנָה בַיִת
  choice: ഒരു ആലയം പണിയപ്പെട്ടിരുന്നില്ല
  rationale: בַיִת അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും ഇവിടെ യഹ്‌വെയുടെ നാമത്തിനായി പണിയപ്പെടേണ്ട വിശുദ്ധ മന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആലയം’ അർത്ഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְשֵׁם יְהוָה
  choice: യഹ്‌വെയുടെ നാമത്തിനായി
  rationale: ദൈവനാമവുമായി ബന്ധപ്പെട്ട മന്ദിരഭാഷ സംക്ഷിപ്തമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ പദവിയായി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַד הַיָּמִים הָהֵם
  choice: ആ നാളുകൾവരെ
  rationale: עַד എന്ന പരിധിസൂചകത്തിന്റെ ബലം നിലനിർത്തുകയും ഉറവിടത്തിലെ കാലപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: בַיִת എന്ന പദം ‘വീട്’ എന്നോ ‘ആലയം’ എന്നോ നൽകുന്നത്
  choice: ആലയം
  alternative: വീട്
  rationale: അക്ഷരാർഥം ‘വീട്’ ആണെങ്കിലും ‘യഹ്‌വെയുടെ നാമത്തിനായി’ എന്ന സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് യെരൂശലേമിലെ ദൈവാലയമാണ്; ‘ആലയം’ ആ സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- issue: പൂജാഗിരികളിലെ യാഗത്തെ ഈ വാക്യം കുറ്റപ്പെടുത്തുന്നുവോ എന്ന ചോദ്യം
  choice: വാക്യത്തിലെ കാരണബന്ധം മാത്രം നിലനിർത്തി; അധിക കുറ്റവിധി ചേർത്തില്ല
  alternative: നിയമവിരുദ്ധ ആരാധനയായി തുറന്നുപറയുക
  rationale: മൂലവാക്യം ആലയമില്ലായ്മയെ കാരണമായി പറയുന്നു; ഇവിടെ വ്യക്തമല്ലാത്ത നൈതിക വിലയിരുത്തൽ പരിഭാഷയിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യാഗങ്ങൾ അർപ്പിച്ചുപോന്നു’ പതിവായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ആ നാളുകൾവരെ’ എന്നത് ഹീബ്രു עַד-ന്റെ കാലപരിധി സൂക്ഷിക്കുന്നു.
