  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ ഉണർന്നു; അതാ, അത് ഒരു സ്വപ്നമായിരുന്നു. അവൻ യെരൂശലേമിലേക്കു വന്ന് കർത്താവിന്റെ ഉടമ്പടിപ്പെട്ടകത്തിന്റെ മുമ്പിൽ നിന്നു. അവൻ ഹോമയാഗങ്ങൾ അർപ്പിക്കുകയും സമാധാനയാഗങ്ങൾ[a] അർപ്പിക്കുകയും തന്റെ സകല ദാസന്മാർക്കും ഒരു വിരുന്നു നടത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൂട്ടായ്മയാഗങ്ങൾ’; ഈ യാഗത്തോടനുബന്ധിച്ച പങ്കിട്ട യാഗഭോജനത്തിലെ കൂട്ടായ്മയെ ഈ പരിഭാഷ കൂടുതൽ എടുത്തുകാട്ടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: ഉണർന്നു
  rationale: ഉറക്കത്തിൽനിന്ന് ഉണരുക എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: പെട്ടെന്നുള്ള തിരിച്ചറിവിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യവഹാരകണത്തിന്റെ പ്രഭാവം നിലനിർത്തുന്നു.
- source_word: חֲלוֹם
  choice: അത് ഒരു സ്വപ്നമായിരുന്നു
  rationale: മൂലത്തിലെ ചുരുക്കപ്രയോഗമായ ‘അതാ, ഒരു സ്വപ്നം’ എന്നതിനെ അർഥം കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവിക മലയാളവാക്യമാക്കുന്നു.
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: യെരൂശലേമിലേക്കു വന്നു
  rationale: בוא എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘മടങ്ങിവന്നു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: മുമ്പിൽ നിന്നു
  rationale: സന്നിധിയിൽ നിലകൊള്ളുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: കർത്താവിന്റെ ഉടമ്പടിപ്പെട്ടകം
  rationale: എബ്രായ സംയുക്തപദബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും ദൈവിക സ്ഥാനനാമത്തിന് പ്രചാരത്തിലുള്ള ആദരപൂർവ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: עֹלוֹת
  choice: ഹോമയാഗങ്ങൾ
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന ഈ യാഗവിഭാഗത്തിന് മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ പദമാണിത്.
- source_word: וַיַּעַל
  choice: അർപ്പിച്ചു
  rationale: യാഗപശ്ചാത്തലത്തിൽ ബലിപീഠത്തിന്മേൽ കയറ്റി അർപ്പിക്കുക എന്ന ഹിഫീൽ ക്രിയയുടെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁלָמִים
  choice: സമാധാനയാഗങ്ങൾ
  rationale: യാഗവിഭാഗത്തിന്റെ പരമ്പരാഗതവും മൂലപദത്തോടു അടുത്തതുമായ പേര് നിലനിർത്തുന്നു; അതിലെ കൂട്ടായ്മാഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁתֶּה
  choice: ഒരു വിരുന്നു
  rationale: പാനീയവും ഭക്ഷണവും ഉൾപ്പെടാവുന്ന ആഘോഷവിരുന്നിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְכָל עֲבָדָיו
  choice: തന്റെ സകല ദാസന്മാർക്കും
  rationale: עֲבָדִים എന്നതിന്റെ വിശാലമായ നേരർഥം നിലനിർത്തുന്നു; ‘ഉദ്യോഗസ്ഥർ’ എന്ന കൂടുതൽ ഇടുങ്ങിയ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: אֲרוֹן בְּרִית אֲדֹנָי എന്നതിലെ ദൈവിക സ്ഥാനനാമം
  choice: കർത്താവിന്റെ
  alternative: യഹോവയുടെ
  rationale: നൽകിയിരിക്കുന്ന WLC പാഠത്തിൽ אֲדֹנָי (‘കർത്താവ്’) എന്നാണ് ഉള്ളത്. അതിനാൽ മൂലരൂപത്തെ മുൻനിർത്തി ‘കർത്താവിന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇത് ഉടമ്പടിയുടെ ദൈവമായ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്ന പ്രയോഗം മൂലത്തിലെ ശ്രദ്ധാകർഷകത നിലനിർത്തുന്നു. യാഗസാങ്കേതിക പദങ്ങളായ ‘ഹോമയാഗം’, ‘സമാധാനയാഗം’ എന്നിവ വായനാപാരമ്പര്യവുമായി തുടർച്ച പുലർത്തുന്നതിനായി ഉപയോഗിച്ചു.
