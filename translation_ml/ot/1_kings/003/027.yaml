source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/מֶּ֜לֶךְ וַ/יֹּ֗אמֶר תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת לֹ֣א תְמִיתֻ֑/הוּ הִ֖יא אִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് മറുപടിയായി പറഞ്ഞു: “ജീവനുള്ള കുഞ്ഞിനെ അവൾക്കു കൊടുക്കുക; അവനെ തീർച്ചയായും കൊല്ലരുത്.[a] അവളാണ് അവന്റെ അമ്മ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘മരിക്കുക’ എന്ന ക്രിയയുടെ ഊന്നിയ രൂപത്തോടൊപ്പം ‘മരിക്കാൻ ഇടയാക്കുക’ എന്ന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിന്റെ അർഥം, “അവനെ തീർച്ചയായും കൊല്ലരുത്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: അപ്പോൾ രാജാവ് മറുപടിയായി പറഞ്ഞു
  rationale: ענה + אמר എന്ന എബ്രായ ആഖ്യാനപ്രയോഗത്തിലെ പ്രതികരണവും തുടർന്ന് പറയുന്നതും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അപ്പോൾ’ ആഖ്യാനതുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: תְּנוּ לָהּ
  choice: അവൾക്കു കൊടുക്കുക
  rationale: נתן എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപവും സ്ത്രീലിംഗ ഏകവചന പരോക്ഷകർമവും വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַיָּלוּד הַחַי
  choice: ജീവനുള്ള കുഞ്ഞിനെ
  rationale: יַלּוּד ഇവിടെ ജനിച്ച ശിശുവിനെയും הַחַי ജീവനോടിരിക്കുന്ന അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘കുഞ്ഞ്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: അവനെ ഒരിക്കലും കൊല്ലരുത്
  rationale: מות എന്ന ധാതുവിന്റെ infinitive absolute-ഉം Hiphil ക്രിയാരൂപവും ചേർന്ന ഊന്നിയ നിരോധനം ലളിതവും ശക്തവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הִיא אִמּוֹ
  choice: അവളാണ് അവന്റെ അമ്മ
  rationale: ക്രിയയില്ലാത്ത തിരിച്ചറിയൽവാക്യത്തിലെ ഊന്നൽ ‘അവളാണ്’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും 3ാം പുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയം ‘അവന്റെ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
