source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: ml
  text: “ഇതാ, നിന്റെ വാക്കുകൾപ്രകാരം ഞാൻ ചെയ്തിരിക്കുന്നു. ഇതാ, നിനക്കു മുമ്പ് നിന്നെപ്പോലെ ആരും ഉണ്ടായിട്ടില്ലാത്തതും നിനക്കു ശേഷം നിന്നെപ്പോലെ ആരും എഴുന്നേൽക്കാത്തതുമായ ജ്ഞാനവും വിവേചനവുമുള്ള ഒരു ഹൃദയം[a] ഞാൻ നിനക്കു നൽകിയിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിവേകമുള്ള ഹൃദയം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗത്തിൽ “ഹൃദയം” വികാരത്തെ മാത്രമല്ല, ചിന്തിക്കാനും വിധിനിർണയം നടത്താനും വിവേചിക്കാനുമുള്ള ആന്തരിക ശേഷിയെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ദൈവിക പ്രഖ്യാപനത്തിന്റെ ഗാംഭീര്യം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: നിന്റെ വാക്കുകൾക്കനുസരിച്ച് ഞാൻ ചെയ്തിരിക്കുന്നു
  rationale: ‘നിന്റെ അപേക്ഷപ്രകാരം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, ‘നിന്റെ വാക്കുകൾ’ എന്ന എബ്രായപ്രയോഗവും പൂർത്തിയായ ദൈവിക പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: נָתַתִּי לְךָ
  choice: ഞാൻ നിനക്കു തന്നിരിക്കുന്നു
  rationale: നൽകൽ ഇതിനകം നടപ്പായതായി അവതരിപ്പിക്കുന്ന എബ്രായ പൂർണ്ണക്രിയയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵב חָכָם וְנָבוֹן
  choice: ജ്ഞാനവും വിവേചനവുമുള്ള ഒരു ഹൃദയം
  rationale: לֵב എന്നതിനെ ‘മനസ്സ്’ എന്നു ചുരുക്കാതെ ‘ഹൃദയം’ ആയി നിലനിർത്തുന്നു; חָכָם, נָבוֹן എന്നിവയുടെ ജ്ഞാനം, സൂക്ഷ്മമായി തിരിച്ചറിയാനുള്ള കഴിവ് എന്നീ വ്യത്യസ്ത ഭാവങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: നിനക്കു ശേഷം നിന്നെപ്പോലെ ഒരുവൻ എഴുന്നേൽക്കുകയുമില്ല
  rationale: יקום എന്ന ക്രിയയിലെ ‘എഴുന്നേൽക്കുക/ചരിത്രത്തിൽ ഉയർന്നുവരുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശലോമോന്റെ സമാനതയില്ലായ്മയുടെ വ്യാപ്തി
  choice: താരതമ്യം ഈ സന്ദർഭത്തിൽ ലഭിച്ച ജ്ഞാനവും വിവേചനവുമുള്ള ഹൃദയത്തോടു ബന്ധപ്പെടുത്തി വായിക്കാവുന്ന വിധത്തിൽ വാക്യം നിലനിർത്തി.
  alternative: എല്ലാ കാര്യങ്ങളിലും ശലോമോൻ മറ്റെല്ലാവരിലും ശ്രേഷ്ഠനാണെന്ന സമഗ്ര അവകാശവാദം.
  rationale: അടുത്ത സന്ദർഭം ഭരണത്തിനും ന്യായവിധിക്കും വേണ്ട ജ്ഞാനത്തിന്റെ ദാനത്തെക്കുറിച്ചാണ്; മൂലപാഠം പറയുന്നതിലധികം വ്യാപകമായ സിദ്ധാന്താവകാശവാദം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ദൈവിക പ്രസംഗത്തിന് യോജിച്ച ഗാംഭീര്യമുള്ളതുമായ ശൈലി. ‘ഇതാ’ എന്ന ആവർത്തനവും ‘ഹൃദയം’ എന്ന എബ്രായ മനുഷ്യശാസ്ത്രപരമായ രൂപകവും സംരക്ഷിച്ചു.
