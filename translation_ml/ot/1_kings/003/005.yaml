  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: ml
  text: 'ഗിബെയോനിൽ യഹോവ ശലോമോന് രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ പ്രത്യക്ഷനായി[a], ദൈവം പറഞ്ഞു: “ഞാൻ നിനക്കു എന്തു നൽകണമെന്ന് ചോദിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “രാത്രിയുടെ സ്വപ്നത്തിൽ”; അതായത്, രാത്രിയിലുണ്ടായ ഒരു സ്വപ്നത്തിൽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: ഗിബെയോനിൽവെച്ച്
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִרְאָה
  choice: പ്രത്യക്ഷനായി
  rationale: ראה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവിക പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്; വെളിപ്പെടുത്തലിന്റെ രീതി അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: יְהֹוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ പേരായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: אֶל שְׁלֹמֹה
  choice: ശലോമോന്
  rationale: אֶל ഇവിടെ പ്രത്യക്ഷത ആരിലേക്കാണെന്നു സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: രാത്രിയിൽ ഒരു സ്വപ്നത്തിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘രാത്രിയുടെ സ്വപ്നത്തിൽ’ എന്ന ഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: മൂലപാഠം יהוה എന്നതിൽനിന്ന് אֱלֹהִים എന്നതിലേക്കു മാറുന്നതു മലയാളത്തിലും യഹോവ/ദൈവം എന്ന വ്യത്യാസത്തോടെ സംരക്ഷിക്കുന്നു.
- source_word: שְׁאַל
  choice: ചോദിച്ചുകൊള്ളുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ആവശ്യപ്പെടാവുന്ന കാര്യം തുറന്ന നിലയിൽ തന്നെ വയ്ക്കുന്നു.
- source_word: מָה אֶתֶּן לָךְ
  choice: ഞാൻ നിനക്ക് എന്തു തരണമെന്ന്
  rationale: ‘ഞാൻ നിനക്ക് എന്തു തരും?’ എന്ന ആശയം שְׁאַל എന്ന ക്രിയയോടു ചേർന്ന പരോക്ഷചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ പൊതുപദവിയാക്കി മാറ്റാതെ ദൈവനാമമായി സംരക്ഷിക്കുന്നു.
- issue: יהוה എന്നതിൽനിന്ന് אֱלֹהִים എന്നതിലേക്കുള്ള പദമാറ്റം
  choice: യഹോവ ... ദൈവം
  alternative: രണ്ടിടത്തും ദൈവം എന്ന് ഏകീകരിക്കുക
  rationale: മൂലഭാഷയിലെ അടുത്തടുത്തുള്ള രണ്ടു വ്യത്യസ്ത ദൈവസംബോധനകൾ നിലനിർത്തി വ്യാഖ്യാനപരമായ മിനുക്കൽ ഒഴിവാക്കുന്നു.
- issue: מָה אֶתֶּן לָךְ എന്നതിലെ ഭാവാർഥം
  choice: ഞാൻ നിനക്ക് എന്തു തരണമെന്ന്
  alternative: ഞാൻ നിനക്ക് എന്തു തരും എന്നു
  rationale: ഹീബ്രു രൂപം സാധ്യത, ഉദ്ദേശ്യം, ഭാവി എന്നിവയ്ക്കിടയിൽ കർശനമായ സാങ്കേതിക വ്യത്യാസം നിർബന്ധിക്കുന്നില്ല; മലയാളത്തിലെ ഈ പരോക്ഷചോദ്യരൂപം അനാവശ്യമായ ഉറപ്പോ അനിശ്ചിതത്വമോ ചേർക്കാതെ പ്രസംഗസന്ദർഭം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ശലോമോൻ’, ‘യഹോവ’ എന്നീ രൂപങ്ങൾ പേരുകളായി ഉപയോഗിച്ചു; ഹീബ്രു വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കിക്കൊണ്ട് ദൈവസംബോധനകളിലെ വ്യത്യാസം സംരക്ഷിച്ചു.
