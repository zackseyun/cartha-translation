id: 1KI.3.25
reference: 1 Kings 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ גִּזְר֛וּ אֶת הַ/יֶּ֥לֶד הַ/חַ֖י לִ/שְׁנָ֑יִם וּ/תְנ֤וּ אֶֽת הַ/חֲצִי֙ לְ/אַחַ֔ת וְ/אֶֽת הַ/חֲצִ֖י לְ/אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/025.yaml
  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പറഞ്ഞു: “ജീവിച്ചിരിക്കുന്ന കുഞ്ഞിനെ രണ്ടായി മുറിക്കുവിൻ; പകുതി ഒരുവൾക്കും പകുതി മറ്റവൾക്കും കൊടുക്കുവിൻ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ഒരുവൾക്ക് ... ഒരുവൾക്ക്”; സ്ത്രീലിംഗരൂപങ്ങൾ ആഖ്യാനത്തിലെ രണ്ടു സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-ക്രമപ്രയോഗം ആഖ്യാനത്തെ അടുത്ത സംഭവത്തിലേക്ക് നയിക്കുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: നിശ്ചിതനാമത്തിന്റെ സന്ദർഭപരമായ നിർണ്ണയം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: גִּזְרוּ
  choice: മുറിക്കുവിൻ
  rationale: גזר എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ ശരീരത്തെ വെട്ടി വേർപെടുത്താനുള്ള നേരിട്ടുള്ള കല്പനയാണ്; ‘മുറിക്കുവിൻ’ അതിന്റെ ശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: הַיֶּלֶד הַחַי
  choice: ജീവിച്ചിരിക്കുന്ന കുഞ്ഞിനെ
  rationale: ചത്ത കുഞ്ഞിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്ന הַחַי എന്ന വിശേഷണത്തിന്റെ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לִשְׁנָיִם
  choice: രണ്ടായി
  rationale: രണ്ടു ഭാഗങ്ങളാക്കുക എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: וּתְנוּ
  choice: '... കൊടുക്കുവിൻ'
  rationale: ആദ്യ ആജ്ഞയോട് ചേർന്ന രണ്ടാമത്തെ ബഹുവചന ആജ്ഞ; മലയാളത്തിൽ വാക്യസംയോജനത്തിലൂടെ ക്രമവും ഏകോപനവും നിലനിർത്തുന്നു.
- source_word: הַחֲצִי
  choice: പകുതി
  rationale: കുഞ്ഞിന്റെ ഓരോ പാതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: לְאַחַת ... לְאֶחָת
  choice: ഒരുവൾക്കും ... മറ്റവൾക്കും
  rationale: എബ്രായത്തിലെ സ്ത്രീലിംഗ ഏകവചനരൂപങ്ങൾ സന്ദർഭത്തിലെ രണ്ടു സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു; ‘ഒരുവൾ ... മറ്റവൾ’ എന്നത് വിതരണാർഥം വ്യക്തമാക്കുകയും അനാവശ്യമായ നാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജകീയ കല്പനയുടെ ബഹുവചന ആജ്ഞാരൂപം ‘മുറിക്കുവിൻ ... കൊടുക്കുവിൻ’ എന്നതിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിതരണപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
