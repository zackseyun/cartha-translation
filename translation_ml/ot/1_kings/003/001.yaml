id: 1KI.3.1
reference: 1 Kings 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: ml
  text: ശലോമോൻ ഈജിപ്തിലെ രാജാവായ ഫറവോനുമായി വിവാഹബന്ധത്തിലൂടെ സഖ്യം സ്ഥാപിച്ചു[a]. അവൻ ഫറവോന്റെ മകളെ വിവാഹം കഴിച്ച് ദാവീദിന്റെ നഗരത്തിലേക്കു കൊണ്ടുവന്നു; തന്റെ ഭവനവും യഹോവയുടെ ആലയവും[b] യെരൂശലേമിനു ചുറ്റുമുള്ള മതിലും പണിതീർക്കുന്നതുവരെ അവൾ അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫറവോനുമായി വിവാഹബന്ധത്തിലായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ വിവാഹബന്ധത്തിൽ പ്രവേശ Jennings??
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “യഹോവയുടെ ഭവനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: വിവാഹബന്ധത്തിലൂടെ സഖ്യം സ്ഥാപിച്ചു
  rationale: ഹിത്പയേൽ രൂപം വിവാഹബന്ധത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; രാജകീയ പശ്ചാത്തലത്തിൽ കുടുംബബന്ധവും രാഷ്ട്രീയ സഖ്യവും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: ഈജിപ്തുരാജാവായ ഫറവോനുമായി
  rationale: ഫറവോനെ ഈജിപ്തിന്റെ രാജാവായി തിരിച്ചറിയുന്ന സമാനാധികരണ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകളെ വിവാഹം കഴിച്ച്
  rationale: ഒരു സ്ത്രീയെ ‘എടുക്കുക’ എന്ന ഹീബ്രു പ്രയോഗം ഇവിടെ വിവാഹം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ മലയാളം തെറ്റിദ്ധാരണ സൃഷ്ടിക്കുമെന്നതിനാൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിലേക്കു കൊണ്ടുവന്നു
  rationale: ചലനവും ലക്ഷ്യസ്ഥാനവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: പണിതീർക്കുന്നതുവരെ
  rationale: עַד എന്നത് സൂചിപ്പിക്കുന്ന സമയപരിധിയുടെ അവസാനബിന്ദുവും നിർമാണം പൂർത്തിയാക്കുന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אֶת בֵּיתוֹ
  choice: തന്റെ അരമന
  rationale: രാജാവായ ശലോമോന്റെ ‘വീട്’ ഈ സന്ദർഭത്തിൽ രാജവാസമോ അരമനാസമുച്ചയമോ ആണെന്ന അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: וְאֶת בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ‘യഹോവയുടെ വീട്’ എന്ന അക്ഷരാർഥത്തെ ആരാധനാലയസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളമായി അവതരിപ്പിക്കുന്നു; അക്ഷരാർഥപരമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: യെരൂശലേമിനു ചുറ്റുമുള്ള മതിൽ
  rationale: ഏകവചനമായ ‘മതിൽ’ എന്നതും അതിന്റെ ചുറ്റിയുള്ള വ്യാപ്തിയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുകയും സ്ഥാനപ്പേരിലേക്കുള്ള മാറ്റം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: בֵּית יְהוָה എന്നതിന്റെ അവതരണം
  choice: യഹോവയുടെ ആലയം
  alternative: യഹോവയുടെ ഭവനം
  rationale: ഈ സന്ദർഭത്തിൽ നിർമിക്കപ്പെടുന്ന ദൈവാലയത്തെയാണ് ഉദ്ദേശിക്കുന്നത്; എങ്കിലും ‘ഭവനം’ എന്ന മൂലരൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഫറവോന്റെ മകൾ ദാവീദിന്റെ നഗരത്തിൽ കഴിഞ്ഞ കാലയളവ്
  choice: അവൾ അവിടെ താമസിച്ചു എന്നത് സന്ദർഭത്തിൽ വ്യക്തമാക്കി
  alternative: കൊണ്ടുവന്നു ... പണിതീർക്കുന്നതുവരെ എന്ന മൂലവാക്യത്തിന്റെ അപൂർണമായ ഉപരിതലഘടന അതേപടി നിലനിർത്തുക
  rationale: ഹീബ്രു വാക്യത്തിലെ עַד ഘടന അവളുടെ താൽക്കാലിക പാർപ്പിടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആവശ്യമായ പരോക്ഷക്രിയ ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ തുടർന്നുള്ള താമസസ്ഥലത്തെക്കുറിച്ച് ഒന്നും നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദീർഘമായ ഹീബ്രു സംയുക്തവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ബന്ധങ്ങളും സമയപരിധിയും സംരക്ഷിച്ചു. ‘അരമന’യും ‘ആലയം’യും സന്ദർഭോചിതമായി ഉപയോഗിച്ചപ്പോൾ മൂലപദത്തിന്റെ പ്രധാന ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
