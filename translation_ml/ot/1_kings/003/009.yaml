  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: ml
  text: അതുകൊണ്ട്, അങ്ങയുടെ ജനത്തെ ന്യായം വിധിക്കാനും നന്മയും തിന്മയും തമ്മിൽ വിവേചിച്ചറിയാനും അങ്ങയുടെ ദാസന് കേൾക്കുന്ന ഒരു ഹൃദയം[a] നൽകണമേ. അങ്ങയുടെ ഈ മഹത്തായ ജനത്തെ[b] ന്യായം വിധിക്കാൻ ആർക്കു കഴിയും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗ്രഹണശേഷിയുള്ള ഒരു ഹൃദയം’; അക്ഷരാർഥത്തിൽ ‘കേൾക്കുന്ന ഒരു ഹൃദയം.’
    reason: lexical_alternative
  - marker: b
    text: ‘മഹത്തായ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘ഭാരമുള്ള’ അല്ലെങ്കിൽ ‘ഭാരമേറിയ’ എന്നാണ്; ഇവിടെ അത് ജനത്തിന്റെ പ്രാധാന്യത്തെയോ അവരെ ഭരിക്കുന്നതിലെ ഭാരിച്ച ഉത്തരവാദിത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: അതുകൊണ്ട് ... നൽകണമേ
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് ഉരുത്തിരിയുന്ന അപേക്ഷയാണ് ഇവിടെ വാവ് ചേർന്ന ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘അതുകൊണ്ട്’ ആ തുടർച്ചയും ‘നൽകണമേ’ പ്രാർഥനാപരമായ അപേക്ഷയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസന്
  rationale: ദൈവരാജാവിന്റെ മുമ്പിൽ ശലോമോൻ സ്വയം താഴ്മയോടെ വിശേഷിപ്പിക്കുന്ന പതിവ് രാജകീയ പ്രയോഗമാണിത്; ഇവിടെ ‘ദാസൻ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: לֵב שֹׁמֵעַ
  choice: കേൾക്കുന്ന ഒരു ഹൃദയം
  rationale: ‘കേൾക്കുന്ന/ശ്രദ്ധിക്കുന്ന ഹൃദയം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു. ജ്ഞാനപൂർവമായ ന്യായവിധിക്കാവശ്യമായ സ്വീകാര്യത, ശ്രദ്ധ, അനുസരണസന്നദ്ധത എന്നിവ ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: לִשְׁפֹּט
  choice: ന്യായം വിധിക്കാൻ
  rationale: שפט എന്ന ക്രിയയ്ക്ക് ഭരിക്കുക, നീതി നടത്തുക എന്നീ വിശാല അർഥങ്ങളുണ്ടെങ്കിലും നന്മയും തിന്മയും വിവേചിക്കുന്ന ഈ സന്ദർഭത്തിൽ അതിന്റെ ന്യായവിധിസംബന്ധമായ കേന്ദ്രാർഥം നിലനിർത്തുന്നു.
- source_word: עַמְּךָ
  choice: അങ്ങയുടെ ജനം
  rationale: രണ്ടാംപുരുഷ പ്രത്യയത്തോടുകൂടിയ עם എന്ന പദത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം; ഉടമ്പടിപരവും രാഷ്ട്രീയവുമായ സൂചനകൾ നിലനിൽക്കുന്നു.
- source_word: לְהָבִין
  choice: വിവേചിച്ചറിയാൻ
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള בין ഇവിടെ വേർതിരിച്ചറിവോടെയുള്ള ഗ്രഹണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിവേചിച്ചറിയുക’ ന്യായവിധിയുടെ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: בֵּין טוֹב לְרָע
  choice: നന്മയും തിന്മയും തമ്മിൽ
  rationale: എബ്രായത്തിലെ ധാർമിക-മൂല്യനിർണയ ഭാഷയായ ‘നന്മയും തിന്മയും’ അതേപടി നിലനിർത്തുന്നു; അതിനെ ‘ശരിയും തെറ്റും’ എന്ന ചുരുങ്ങിയ പ്രയോഗമാക്കി മാറ്റുന്നില്ല.
- source_word: כִּי מִי יוּכַל
  choice: ആർക്കു കഴിയും?
  rationale: ചുമതലയുടെ വലുപ്പത്തിനുമുമ്പിലുള്ള സ്വന്തം അപര്യാപ്തത ചൂണ്ടിക്കാട്ടി അപേക്ഷയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന അലങ്കാരചോദ്യമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: הַכָּבֵד
  choice: മഹത്തായ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ഭാരമുള്ളത്’ എന്നാണെങ്കിലും ഇവിടെ ജനത്തിന്റെ വലുപ്പം, പ്രാധാന്യം, അവരെ ഭരിക്കുന്നതിലെ ഭാരിച്ച ഉത്തരവാദിത്വം എന്നിവ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘മഹത്തായ’ ഉപയോഗിച്ച് അക്ഷരാർഥസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശലോമോന്റെ അപേക്ഷയിലെ ഹൃദയസംബന്ധമായ മനുഷ്യശാസ്ത്ര രൂപകം
  choice: കേൾക്കുന്ന ഒരു ഹൃദയം
  alternative: ഗ്രഹണശേഷിയുള്ള ഒരു ഹൃദയം
  rationale: എബ്രായചിന്തയിൽ ബോധം, ഇച്ഛ, പ്രതികരണം എന്നിവയുടെ കേന്ദ്രമായി ‘ഹൃദയം’ വരുന്നു. ആ രൂപകം നിലനിർത്തുകയും വെറും ബൗദ്ധികശേഷിയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; വ്യാഖ്യാനപരമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രാർഥനയുടെ വിനയവും ഗൗരവവും നിലനിർത്താൻ ‘നൽകണമേ’ സ്വീകരിച്ചു. ‘കേൾക്കുന്ന ഹൃദയം’ എന്ന എബ്രായ രൂപകം അല്പം അപരിചിതമായിരുന്നാലും മനസ്സിലാക്കാവുന്ന വിധത്തിൽ സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
