  source_fidelity: 'മുഖ്യപാഠം എബ്രായവാക്യത്തിന്റെ ഘടനയും പ്രധാനപദങ്ങളും വിശ്വസ്തമായി പകരുന്നു: യഹോവയോടുള്ള അഭിസംബോധന, ‘അങ്ങയുടെ ദാസൻ,’ ദാവീദിന്റെ പിൻഗാമിയായുള്ള രാജത്വം, നַעַר קָטֹן എന്ന വിനയപൂർവമായ സ്വയംവിവരണം, צֵאת וָבֹא എന്ന ദൃശ്യപ്രയോഗം എന്നിവ നിലനിൽക്കുന്നു. ‘എങ്ങനെ പുറപ്പെടണം, എങ്ങനെ അകത്തുവരണം’ എന്ന പ്രയോഗം ലֹא אֵדַע എന്നതിലെ പ്രായോഗിക അശക്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; നേതൃത്വാർഥം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.'
