id: 1KI.3.7
reference: 1 Kings 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: ml
  text: ഇപ്പോൾ, എന്റെ ദൈവമായ യഹോവേ, അങ്ങ് അങ്ങയുടെ ദാസനെ എന്റെ അപ്പനായ ദാവീദിന്റെ സ്ഥാനത്ത് രാജാവാക്കിയിരിക്കുന്നു. എന്നാൽ ഞാൻ ഒരു കൊച്ചുകുട്ടി മാത്രമാണ്[a]; എങ്ങനെ പുറപ്പെടണം, എങ്ങനെ അകത്തുവരണം എന്നു എനിക്കറിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു ചെറുപ്പക്കാരൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപ്രയോഗം യൗവനവും പരിചയക്കുറവും ഊന്നുന്ന വിനയപൂർവമായ സ്വയംവിവരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘പുറപ്പെടുക, അകത്തുവരുക’ എന്നത് ഒരാളുടെ ചുമതലകൾ നിർവഹിക്കുന്നതിനെ, പ്രത്യേകിച്ച് പൊതുനേതൃത്വം വഹിക്കുന്നതിനെ, സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായി മാറ്റാതെ, മലയാളത്തിൽ പരക്കെ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהַי
  choice: എന്റെ ദൈവമായ
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥബന്ധവും അഭിസംബോധനയുടെ സ്വാഭാവിക മലയാളഘടനയും വ്യക്തമാക്കുന്നു.
- source_word: הִמְלַכְתָּ
  choice: രാജാവാക്കിയിരിക്കുന്നു
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—ഒരാളെ രാജാവാക്കുക—സ്വാഭാവികമായി പകരുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനെ
  rationale: രാജകീയ പ്രാർഥനയിലെ വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്; അടിമത്തം മുൻനിർത്താതെ സേവനബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: תַּחַת
  choice: സ്ഥാനത്ത്
  rationale: ദാവീദിന്റെ പിൻഗാമിയായി രാജത്വം ഏറ്റതെന്ന സ്ഥാനപൂരക അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: נַעַר קָטֹן
  choice: ഒരു കൊച്ചുകുട്ടി മാത്രം
  rationale: യൗവനവും പരിചയക്കുറവും ഊന്നുന്ന വിനയപൂർവമായ സ്വയംവിവരണം നിലനിർത്തുന്നു; കൃത്യമായ പ്രായം നിർണയിക്കുന്നില്ല.
- source_word: לֹא אֵדַע
  choice: എനിക്കറിയില്ല
  rationale: തുടർന്നുള്ള പ്രവൃത്തികൾ എങ്ങനെ നിർവഹിക്കണമെന്ന പ്രായോഗിക അജ്ഞത നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: צֵאת וָבֹא
  choice: എങ്ങനെ പുറപ്പെടണം, എങ്ങനെ അകത്തുവരണം
  rationale: പൊതുചുമതലകളും നേതൃത്വവും നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ശലോമോന്റെ נַעַר קָטֹן എന്ന സ്വയംവിവരണം
  choice: ഒരു കൊച്ചുകുട്ടി മാത്രം
  alternative: ഒരു ചെറുപ്പക്കാരൻ മാത്രം
  rationale: പദസമുച്ചയത്തിന്റെ പ്രായപരിധി വിശാലമാണെങ്കിലും, അതിലെ സ്വയംതാഴ്ത്തലും അപരിചയബോധവും നിലനിർത്തുന്നു; പദത്തെ നിർബന്ധിതമായ കൃത്യപ്രായവിവരണമായി അവതരിപ്പിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർക്കുന്നു.
- issue: צֵאת וָבֹא എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: എങ്ങനെ ഭരിക്കണം എന്നു എനിക്കറിയില്ല
  rationale: ‘ഭരിക്കുക’ എന്നത് സന്ദർഭസൂചിതമായ അർഥമാണെങ്കിലും എബ്രായത്തിൽ നേരിട്ട് ഇല്ല; അതിനാൽ വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷ. ദൈവത്തോടുള്ള ആദരസൂചകമായി ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ വിനയവും നേതൃത്വപരിചയക്കുറവും നിലനിർത്തിക്കൊണ്ട് സാംസ്കാരിക പ്രയോഗം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
