id: 1KI.3.11
reference: 1 Kings 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: ml
  text: 'ദൈവം അവനോടു അരുളിച്ചെയ്തു: “നീ ഇക്കാര്യം അപേക്ഷിച്ചതിനാലും നിനക്കായി ദീർഘായുസ്സ് അപേക്ഷിക്കാതെയും നിനക്കായി സമ്പത്ത് അപേക്ഷിക്കാതെയും നിന്റെ ശത്രുക്കളുടെ ജീവൻ അപേക്ഷിക്കാതെയും, ന്യായവിധി കേൾക്കാൻ നിനക്കായി വിവേകം അപേക്ഷിച്ചതിനാലും,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: ദീർഘായുസ്സ്
  rationale: അക്ഷരാർഥത്തിൽ ‘അനേകം ദിവസങ്ങൾ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ദീർഘമായ ആയുസ്സാണ് ഉദ്ദേശ്യം; സ്വാഭാവിക മലയാളത്തിൽ അതു വ്യക്തമായി നൽകുന്നു.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: ശത്രുക്കളുടെ ജീവൻ
  rationale: נֶפֶשׁ ഇവിടെ ശത്രുക്കളുടെ ‘ജീവൻ’ ആവശ്യപ്പെടുക, അഥവാ അവരുടെ മരണം തേടുക, എന്ന അർഥത്തിലാണ്; ഉറവിടത്തിലെ പരോക്ഷപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  choice: ന്യായം കേട്ടറിഞ്ഞ് വിവേചിക്കാനുള്ള കഴിവ്
  rationale: ‘കേൾക്കുക’, ‘ഗ്രഹിക്കുക/വിവേചിക്കുക’, ‘ന്യായം’ എന്നീ ഉറവിടഘടകങ്ങൾ നിലനിർത്തിക്കൊണ്ട് രാജാവിന്റെ ന്യായനിർവഹണസന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്ക് പരിചയപ്പെടുത്തുന്ന ഗൗരവമുള്ളതും മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
theological_decisions:
- issue: מִשְׁפָּט എന്നതിന്റെ വിവർത്തനം
  choice: ന്യായം
  alternative: വിധി / നീതി
  rationale: ഇവിടെ ഭരണാധികാരി കേസുകൾ കേട്ട് ശരിയായ ന്യായം തിരിച്ചറിയുന്നതാണ് പ്രമേയം. ‘ന്യായം’ എന്നത് നിയമവിധിയുടെയും നീതിയുടെയും അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായവാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്നതിനാൽ അവസാനത്തിലെ അപൂർണത സൂചിപ്പിക്കാൻ കോമ നിലനിർത്തിയിരിക്കുന്നു.
