revisions:
- from: 'ശലോമോൻ പറഞ്ഞു: “അങ്ങ് എന്റെ പിതാവായ ദാവീദ് എന്ന അങ്ങയുടെ ദാസനോട് വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത[a] കാണിച്ചു. കാരണം, അവൻ അങ്ങയുടെ മുമ്പാകെ വിശ്വസ്തതയിലും[b] നീതിയിലും അങ്ങയോടുള്ള ഹൃദയപരമാർഥതയിലും നടന്നു. അങ്ങ് അവനുവേണ്ടി ഈ വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത കാത്തുപാലിക്കുകയും അവന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരു മകനെ അവനു നൽകുകയും ചെയ്തു—ഇന്നുള്ളതുപോലെതന്നെ[c].”'
  to: 'ശലോമോൻ പറഞ്ഞു: “അങ്ങ് അങ്ങയുടെ ദാസനും എന്റെ പിതാവുമായ ദാവീദിനോട് വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത[a] കാണിച്ചു. കാരണം, അവൻ അങ്ങയുടെ മുമ്പാകെ വിശ്വസ്തതയിലും[b] നീതിയിലും ഹൃദയപരമാർഥതയിലും അങ്ങയോടുകൂടെ നടന്നു. അങ്ങ് അവനുവേണ്ടി ഈ വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത കാത്തുപാലിക്കുകയും അവന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരു മകനെ അവനു നൽകുകയും ചെയ്തു—ഇന്നുള്ളതുപോലെതന്നെ[c].”'
