id: 1KI.3.6
reference: 1 Kings 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: ml
  text: 'ശലോമോൻ പറഞ്ഞു: “അങ്ങ് അങ്ങയുടെ ദാസനും എന്റെ പിതാവുമായ ദാവീദിനോട് വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത[a] കാണിച്ചു. കാരണം, അവൻ അങ്ങയുടെ മുമ്പാകെ വിശ്വസ്തതയിലും[b] നീതിയിലും ഹൃദയപരമാർഥതയിലും അങ്ങയോടുകൂടെ നടന്നു. അങ്ങ് അവനുവേണ്ടി ഈ വലിയ ഉടമ്പടിപരമായ വിശ്വസ്തത കാത്തുപാലിക്കുകയും അവന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരു മകനെ അവനു നൽകുകയും ചെയ്തു—ഇന്നുള്ളതുപോലെതന്നെ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉടമ്പടിപരമായ വിശ്വസ്തത” എന്നതിന് “അചഞ്ചലസ്നേഹം” എന്നോ “വിശ്വസ്തസ്നേഹം” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസ്തതയിൽ” എന്നതിന് എബ്രായത്തിൽ അക്ഷരാർഥമായി “സത്യത്തിൽ”; “ആത്മാർഥതയോടെ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായ ശൈലി: “ഈ ദിവസംപോലെ”; ഇപ്പോഴത്തെ ദൃശ്യസ്ഥിതി അതിനെ സ്ഥിരീകരിക്കുന്നു എന്നാണ് അർഥം.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: ഉടമ്പടിപരമായ വിശ്വസ്തത
  rationale: ദാവീദിനോടുള്ള ദൈവത്തിന്റെ വിശ്വസ്തവും വാഗ്ദാനബന്ധിതവുമായ പെരുമാറ്റവും രാജവംശപരമ്പരയിലൂടെ അതിന്റെ തുടർച്ചയും ഇവിടെ മുൻനിൽക്കുന്നു. സ്നേഹത്തിന്റെയും ദയയുടെയും ഭാവം നിഷേധിക്കാതെ ഉടമ്പടിസംബന്ധമായ അർഥബലം നിലനിർത്തുന്നു.
- source_word: עָשִׂיתָ עִם
  choice: കാണിച്ചു
  rationale: חֶסֶד-നോടു ചേർന്നുള്ള ഈ എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള രൂപം; ഒരാളോടു വിശ്വസ്തത കാണിക്കുക എന്ന പ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ദൈവസന്നിധിയിലെ ദാവീദിന്റെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന രാജകീയ പ്രാർഥനാഭാഷയിൽ ‘ദാസൻ’ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: כַּאֲשֶׁר
  choice: കാരണം
  rationale: തുടർന്നുള്ള വാക്യം ദാവീദിനോടു ദൈവം വിശ്വസ്തത കാണിച്ചതിന്റെ അടിസ്ഥാനമോ സാഹചര്യവിവരണമോ നൽകുന്നു; കാരണസൂചന ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: അങ്ങയുടെ മുമ്പാകെ ... നടന്നു
  rationale: ദൈവസാന്നിധ്യത്തിലെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാള ബൈബിൾ ഭാഷയിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
- source_word: בֶּאֱמֶת
  choice: വിശ്വസ്തതയിൽ
  rationale: אֱמֶת എന്ന പദത്തിന് സത്യം, വിശ്വസ്തത, വിശ്വാസ്യത എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ നൈതിക ത്രയത്തിൽ ‘വിശ്വസ്തത’ സന്ദർഭോചിതമാണ്; മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: בִּצְדָקָה
  choice: നീതിയിൽ
  rationale: ദൈവസന്നിധിയിലെ ദാവീദിന്റെ നേരായ നൈതിക പെരുമാറ്റത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി രേഖപ്പെടുത്തുന്നു.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: ഹൃദയപരമാർഥതയിൽ
  rationale: ഉള്ളിലെ നേരും ആത്മാർഥതയും സൂചിപ്പിക്കുന്ന പ്രയോഗം; അക്ഷരാർഥമായ ‘ഹൃദയത്തിന്റെ നേരിൽ’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കുന്നു.
- source_word: עִמָּךְ
  choice: അങ്ങയോടുള്ള
  rationale: എബ്രായത്തിലെ ‘അങ്ങയോടുകൂടെ/അങ്ങയോടുള്ള’ എന്ന ബന്ധസൂചന നിലനിർത്തി, മുമ്പാകെ എന്ന ആശയം അനാവശ്യമായി ആവർത്തിക്കുന്നില്ല.
- source_word: וַתִּשְׁמָר לוֹ
  choice: അവനുവേണ്ടി ... കാത്തുപാലിച്ചു
  rationale: മുമ്പു പറഞ്ഞ חֶסֶד തുടർന്നും പ്രാബല്യത്തിൽ സൂക്ഷിച്ചതെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: അവന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരു മകൻ
  rationale: യֹשֵׁב എന്ന വർത്തമാന പങ്കാളിത്തരൂപം സൂചിപ്പിക്കുന്ന, ഇപ്പോൾ സിംഹാസനാരൂഢനായ മകന്റെ സാക്ഷാത്കൃത സ്ഥിതി നിലനിർത്തുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെതന്നെ
  rationale: ഇപ്പോഴത്തെ ദൃശ്യസ്ഥിതി മുൻപറഞ്ഞ ദൈവിക വിശ്വസ്തതയെ സ്ഥിരീകരിക്കുന്നു എന്ന എബ്രായ കാലസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: രാജകീയ ഉടമ്പടി പശ്ചാത്തലത്തിലുള്ള חֶסֶד-ന്റെ വിവർത്തനം
  choice: ഉടമ്പടിപരമായ വിശ്വസ്തത
  alternative: അചഞ്ചലസ്നേഹം / വിശ്വസ്തസ്നേഹം
  rationale: ദാവീദിനോടുള്ള ദൈവത്തിന്റെ വിശ്വസ്തമായ ഇടപെടലും ദാവീദിന്റെ മകന്റെ സിംഹാസനാരോഹണത്തിൽ അതിന്റെ തുടർച്ചയും വാക്യം ബന്ധിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം വാഗ്ദാനപരവും ബന്ധപരവുമായ ബലം വ്യക്തമാക്കുന്നു; സ്നേഹഭാവമുള്ള മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദാവീദിന്റെ നടപ്പും ദൈവിക חֶסֶד-വും തമ്മിലുള്ള ബന്ധം
  choice: ‘കാരണം’ എന്ന കാരണസൂചന നിലനിർത്തുന്നു
  alternative: ‘എപ്രകാരം’ / ‘അതുപോലെ’
  rationale: כַּאֲשֶׁר ഇവിടെ കാരണപരമായി വായിക്കാവുന്നതാണ്; എന്നാൽ ഇതിനെ സമ്പൂർണ പ്രതിഫലസിദ്ധാന്തമാക്കി വിശദീകരിക്കാതെ വാക്യത്തിലെ ദൈവിക വിശ്വസ്തതയും ദാവീദിന്റെ ജീവിതവും തമ്മിലുള്ള യഥാർഥ സംഘർഷവും ബന്ധവും അതേപടി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചക ഏകവചനമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. പ്രാർഥനയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടന തിരഞ്ഞെടുത്തു. ‘നടന്നു’, ‘സിംഹാസനത്തിൽ ഇരിക്കുന്ന’ എന്നീ മൂലഭാഷാ ദൃശ്യരൂപങ്ങൾ സംരക്ഷിച്ചു; ദുഷ്കരമായ പദസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
