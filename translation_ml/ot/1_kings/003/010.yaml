theological_decisions:
- issue: אֲדֹנָי എന്ന ദൈവിക സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിൽ יהוה അല്ല, אֲדֹנָי ആണ്. അതിനാൽ ദൈവനാമം ഇറക്കുമതി ചെയ്യാതെ സ്ഥാനനാമം തന്നെയാണ് പരിഭാഷപ്പെടുത്തിയത്.
- issue: വാക്യത്തിലെ ദൈവിക അംഗീകാരത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിന്റെ ദൃഷ്ടിയിൽ നല്ലതായിരുന്നു
  alternative: കർത്താവിനെ പ്രസാദിപ്പിച്ചു
  rationale: ‘നല്ലതായിരുന്നു’ എന്നത് എബ്രായ മൂല്യനിർണയപ്രയോഗം നിലനിർത്തുന്നു; ‘പ്രസാദിപ്പിച്ചു’ എന്നത് വികാരപ്രതികരണത്തെ കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായത്തിലെ കാരണം-ഫലം ക്രമം മലയാള വായനാസൗകര്യത്തിനായി മറിച്ചിട്ടുണ്ടെങ്കിലും അർഥബന്ധം പൂർണമായി നിലനിർത്തുന്നു.
