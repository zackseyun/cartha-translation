id: 1KI.3.28
reference: 1 Kings 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ כָל יִשְׂרָאֵ֗ל אֶת הַ/מִּשְׁפָּט֙ אֲשֶׁ֣ר שָׁפַ֣ט הַ/מֶּ֔לֶךְ וַ/יִּֽרְא֖וּ מִ/פְּנֵ֣י הַ/מֶּ֑לֶךְ כִּ֣י רָא֔וּ כִּֽי חָכְמַ֧ת אֱלֹהִ֛ים בְּ/קִרְבּ֖/וֹ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: ml
  text: രാജാവ് വിധിച്ച ന്യായവിധിയെക്കുറിച്ച് ഇസ്രായേൽ മുഴുവനും കേട്ടു. ന്യായം നടത്താൻ[b] ദൈവത്തിന്റെ ജ്ഞാനം അവന്റെ ഉള്ളിലുണ്ടെന്ന് അവർ കണ്ടതിനാൽ, അവർ രാജാവിനെ ഭയപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ രാജാവിനെ ഭയാദരത്തോടെ കണ്ടു’ അല്ലെങ്കിൽ ‘അവർ രാജാവിനെ ഭക്ത്യാദരത്തോടെ കണ്ടു.’ എബ്രായപ്രയോഗത്തിന് അംഗീകരിക്കപ്പെട്ട അധികാരത്തോടുള്ള ഭയം, ആദരം, വിസ്മയം എന്നിവ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നീതി പ്രവർത്തിക്കാൻ’ അല്ലെങ്കിൽ ‘വിധി നടത്താൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: കേട്ടു
  rationale: ശׁמעയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ‘ന്യായവിധിയെക്കുറിച്ച്’ എന്ന പ്രയോഗം വാർത്ത അറിഞ്ഞെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ജനതയെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന എബ്രായ സമാഹാരപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: രാജാവ് വിധിച്ച ന്യായവിധി
  rationale: מִשְׁפָּט എന്ന നിയമപരമായ പദവും שׁפט എന്ന ക്രിയയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: അവർ രാജാവിനെ ഭയപ്പെട്ടു
  rationale: יראയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ഭയത്തോടൊപ്പം ആദരവും ഭക്ത്യാദരവും ഉൾപ്പെടാമെന്ന വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: חָכְמַת אֱלֹהִים
  choice: ദൈവത്തിന്റെ ജ്ഞാനം
  rationale: אֱלֹהִים എന്ന വ്യക്തമായ ദൈവപരാമർശം വിശേഷണമായി ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בְּקִרְבּוֹ
  choice: അവന്റെ ഉള്ളിൽ
  rationale: ശലോമോന്റെ ഉള്ളിൽ വസിക്കുന്ന ഗുണമെന്ന ആന്തരികതയുടെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: ന്യായം നടത്താൻ
  rationale: രാജകീയ ന്യായനിർവഹണത്തെ സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യപ്രയോഗം; ഒറ്റ വിധിപ്രസ്താവനയിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: אֱלֹהִים എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: ദൈവികം
  rationale: മൂലപാഠം ദൈവത്തെ വ്യക്തമായി പരാമർശിക്കുകയും രാജാവിന്റെ ജ്ഞാനം ദൈവത്തിൽനിന്നുള്ളതാണെന്ന് പ്രസ്താവിക്കുകയും ചെയ്യുന്നു.
- issue: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ എന്നതിലെ വികാരഭാവം
  choice: രാജാവിനെ ഭയപ്പെട്ടു
  alternative: രാജാവിനെ ഭക്ത്യാദരത്തോടെ കണ്ടു / രാജാവിനോട് ഭയാദരം തോന്നി
  rationale: മൂലപദത്തിന്റെ ഭയം എന്ന ശക്തമായ അർഥം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അധികാരത്തോടുള്ള ആദരവും വിസ്മയവും ഉൾപ്പെടാവുന്ന യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നിയമപരമായ ‘ന്യായവിധി’യും ദൈവദത്ത ജ്ഞാനത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; ഭയം–ആദരം എന്ന അർഥവ്യാപ്തി പ്രധാനപാഠത്തിൽ ഏകപക്ഷീയമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
