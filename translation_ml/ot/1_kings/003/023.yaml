id: 1KI.3.23
reference: 1 Kings 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ זֹ֣את אֹמֶ֔רֶת זֶה בְּנִ֥/י הַ/חַ֖י וּ/בְנֵ֣/ךְ הַ/מֵּ֑ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֥/י הֶ/חָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് പറഞ്ഞു[a]: “ഇവൾ പറയുന്നു: ‘ഇവനാണ് എന്റെ മകൻ—ജീവനുള്ളവൻ; നിന്റെ മകനാണ് മരിച്ചവൻ.’ മറ്റവൾ പറയുന്നു: ‘അല്ല; നിന്റെ മകനാണ് മരിച്ചവൻ, എന്റെ മകനാണ് ജീവനുള്ളവൻ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഈ ഒരുത്തി പറയുന്നു ... ഈ ഒരുത്തി പറയുന്നു ...” എബ്രായത്തിൽ രണ്ടു സ്ത്രീകളെയും സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ചൂണ്ടുപദമാണ് രണ്ടിടത്തും ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായത്തിൽ വ്യക്തിനാമത്തിനു പകരം നിശ്ചിതമായ പദവിനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതുതന്നെ നിലനിർത്തുന്നു.
- source_word: זֹאת ... וְזֹאת
  choice: ഇവൾ ... മറ്റവൾ
  rationale: സ്ത്രീലിംഗ സൂചകസർവനാമങ്ങൾ മുമ്പ് പറഞ്ഞ രണ്ടു സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു. ആദ്യത്തേതിന്റെ ചൂണ്ടിക്കാണിക്കൽ നിലനിർത്തിക്കൊണ്ട്, രണ്ടാമത്തേതിനെ ‘മറ്റവൾ’ എന്നു പറയുന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֹמֶרֶת
  choice: പറയുന്നു
  rationale: വർത്തമാനകൃതന്തം രാജാവ് അവരുടെ വിരുദ്ധവാദങ്ങൾ സജീവമായി സംഗ്രഹിക്കുന്നതായി കാണിക്കുന്നു; മലയാള വർത്തമാനകാലം അത് നിലനിർത്തുന്നു.
- source_word: זֶה בְּנִי הַחַי
  choice: ഇവനാണ് എന്റെ മകൻ—ജീവനുള്ളവൻ
  rationale: കുഞ്ഞിനെ ചൂണ്ടിക്കാണിക്കുന്ന זֶה-യുടെ ഊന്നലും, ‘എന്റെ മകൻ’ എന്ന തിരിച്ചറിയലിനു പിന്നാലെയുള്ള ‘ജീവനുള്ളവൻ’ എന്ന വിശേഷണാത്മക സമാനാധികരണവും നിലനിർത്തുന്നു.
- source_word: בְּנִי / בְּנֵךְ
  choice: എന്റെ മകൻ / നിന്റെ മകൻ
  rationale: בֵּן ഇവിടെ ആൺകുഞ്ഞിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മകൻ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: הַחַי / הַמֵּת
  choice: ജീവനുള്ളവൻ / മരിച്ചവൻ
  rationale: നാമവൽക്കരിച്ച രൂപങ്ങളായ ഇവയുടെ സമാന്തരവിരോധം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: לֹא כִי
  choice: അല്ല;
  rationale: ഈ ഘടന ആദ്യം നിഷേധിക്കുകയും തുടർന്ന് വിരുദ്ധ അവകാശവാദം ഉറപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ ‘അല്ല;’ എന്നത് ആ തിരുത്തൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കാരണം സൂചിപ്പിക്കുന്ന പദം ചേർത്താൽ പ്രസംഗത്തിന്റെ തർക്കഭാവം അനാവശ്യമായി കടുപ്പപ്പെടാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രണ്ടു സ്ത്രീകളുടെ വിരുദ്ധവാദങ്ങളിലെ സമാന്തരതയും ‘ജീവനുള്ളവൻ / മരിച്ചവൻ’ എന്ന ആവർത്തനവും ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
