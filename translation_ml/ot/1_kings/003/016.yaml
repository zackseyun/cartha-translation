  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֣ז תָּבֹ֗אנָה שְׁתַּ֛יִם נָשִׁ֥ים זֹנ֖וֹת אֶל הַ/מֶּ֑לֶךְ וַֽ/תַּעֲמֹ֖דְנָה לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/016.yaml
  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: ml
  text: അപ്പോൾ വേശ്യകളായ രണ്ടു സ്ത്രീകൾ രാജാവിന്റെ അടുക്കൽ വന്ന് അവന്റെ മുമ്പാകെ നിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അപ്പോൾ രണ്ടു വേശ്യകൾ രാജാവിന്റെ അടുക്കൽ വന്ന് അവന്റെ മുമ്പാകെ നിന്നു.” זֹנוֹת എന്ന ഹീബ്രു കൃദന്തരൂപം “വേശ്യകൾ” എന്ന് നേരിട്ടോ “വേശ്യകളായ സ്ത്രീകൾ” എന്ന് വിശദമായോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുവരുന്ന സംഭവത്തെ കഥാക്രമത്തിൽ അവതരിപ്പിക്കുന്ന കാലസൂചകമായി സ്വാഭാവികമാണ്.
- source_word: תָּבֹאנָה
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ സ്ത്രീലിംഗ ബഹുവചനരൂപം ഇവിടെ ഭൂതകാല കഥനത്തിലാണ്; രാജാവിന്റെ അടുക്കലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു.
- source_word: שְׁתַּיִם נָשִׁים
  choice: രണ്ടു സ്ത്രീകൾ
  rationale: സംഖ്യയും നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: זֹנוֹת
  choice: വേശ്യകളായ
  rationale: സ്ത്രീകളെ വിശേഷിപ്പിക്കുന്ന ഹീബ്രു കൃദന്തരൂപത്തിന്റെ അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶל הַמֶּלֶךְ
  choice: രാജാവിന്റെ അടുക്കൽ
  rationale: രാജാവിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: וַתַּעֲמֹדְנָה
  choice: നിന്നു
  rationale: തുടർകഥനത്തിലെ עמד എന്ന ക്രിയയുടെ ലളിതമായ അർഥം; രണ്ടു സ്ത്രീകളാണ് കർത്താക്കളെങ്കിലും മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: לְפָנָיו
  choice: അവന്റെ മുമ്പാകെ
  rationale: അധികാരിയുടെയോ ന്യായാധിപന്റെയോ സന്നിധിയിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗം.
