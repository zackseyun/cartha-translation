translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലപാഠത്തിലെ ചലനവും രാജസന്നിധിയിലെ നില്പും വേർതിരിച്ചു നിലനിർത്തിയിരിക്കുന്നു.
