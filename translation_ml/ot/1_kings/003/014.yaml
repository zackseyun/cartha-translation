  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: ml
  text: എന്നാൽ, നിന്റെ പിതാവായ ദാവീദ് നടന്നതുപോലെ, എന്റെ ചട്ടങ്ങളും കല്പനകളും പാലിച്ചുകൊണ്ട് നീ എന്റെ വഴികളിൽ നടന്നാൽ, ഞാൻ നിന്റെ ആയുസ്സ് ദീർഘിപ്പിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഞാൻ നിന്റെ ദിവസങ്ങളെ ദീർഘിപ്പിക്കും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: നടന്നാൽ
  rationale: വ്യവസ്ഥാസൂചകമായ אִם മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൽ’ രൂപത്തിൽ നൽകി. മുൻവാക്യത്തോടുള്ള ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ וְ വേറൊരു ‘കൂടാതെ’കൊണ്ട് ഭാരപ്പെടുത്തുന്നില്ല.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: നീ എന്റെ വഴികളിൽ നടന്നാൽ
  rationale: ഉടമ്പടിപരമായ ധാർമികജീവിതത്തെ സൂചിപ്പിക്കുന്ന ‘വഴികളിൽ നടക്കുക’ എന്ന എബ്രായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹר
  choice: പാലിച്ചുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ വഴികളിൽ നടക്കുന്നതിന്റെ രീതിയും ഉള്ളടക്കവും വ്യക്തമാക്കുന്ന infinitive രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: חֻקַּי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: നിയമപരവും ഉടമ്പടിപരവുമായ പ്രത്യേക പദമായി ‘ചട്ടങ്ങൾ’ ഉപയോഗിച്ച് തുടർന്നുള്ള ‘കല്പനകൾ’ എന്ന പദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: וּמִצְוֺתַי
  choice: കല്പനകളും
  rationale: מִצְוֹת എന്ന ഉടമ്പടിപരമായ ആജ്ഞാപദത്തിന് മലയാള ബൈബിൾ ശൈലിയിലും പൊതുഭാഷയിലും വ്യക്തമായ ‘കല്പനകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: നടന്നതുപോലെ
  rationale: മുൻപത്തെ תֵּלֵךְ എന്ന ക്രിയയുമായുള്ള എബ്രായ ആവർത്തനം സംരക്ഷിക്കുകയും ദാവീദിന്റെ ജീവിതനടപ്പുമായുള്ള താരതമ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: דָּוִיד אָבִיךָ
  choice: നിന്റെ പിതാവായ ദാവീദ്
  rationale: ബന്ധവും വ്യക്തിനാമവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: ഞാൻ നിന്റെ ആയുസ്സു ദീർഘിപ്പിക്കും
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ ദിവസങ്ങളെ ദീർഘിപ്പിക്കും’ എന്നത് ദീർഘായുസ്സിന്റെ എബ്രായ പ്രയോഗമാണ്; അർഥം വ്യക്തമായി പകരുന്ന സ്വാഭാവിക മലയാളം മുഖ്യപാഠത്തിൽ നൽകി, രൂപപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി അനുസരണത്തോട് ബന്ധിപ്പിച്ചിരിക്കുന്ന ദീർഘായുസ്സിന്റെ വ്യവസ്ഥാപിത വാഗ്ദാനം
  choice: ‘നടന്നാൽ ... ദീർഘിപ്പിക്കും’ എന്നു വ്യവസ്ഥയും വാഗ്ദാനവും നേരിട്ട് നിലനിർത്തി.
  alternative: ഇത് വ്യവസ്ഥയില്ലാത്ത രാജവംശവാഗ്ദാനമായോ പൊതുവായ അനുഗ്രഹമായോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ശലോമോന്റെ അനുസരണത്തെ വ്യക്തമായ വ്യവസ്ഥയായി അവതരിപ്പിക്കുകയും അതിന്റെ ഫലമായി ദീർഘായുസ്സ് വാഗ്ദാനം ചെയ്യുകയും ചെയ്യുന്നു; പിന്നീടുള്ള ദൈവശാസ്ത്രപരമായ ചട്ടക്കൂടുകൾ ചേർക്കാതെ ഈ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വഴികളിൽ നടക്കുക’ എന്ന പ്രധാന ഉടമ്പടി രൂപകം സംരക്ഷിച്ചു; ‘ദിവസങ്ങൾ ദീർഘിപ്പിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
