translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. וְהִנֵּה എന്നതിന്റെ നാടകീയ ഊന്നലും בַּבֹּקֶר എന്നതിന്റെ ആവർത്തനവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘my son’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും, അതിന്റെ കുറിപ്പ് וָאֶתְבּוֹנֵן എന്ന ക്രിയയെ സംബന്ധിക്കുന്നതിനാൽ ഉറവിടബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘സൂക്ഷിച്ചുനോക്കിയപ്പോൾ’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
