source:
  edition: WLC
  text: וָ/אָקֻ֥ם בַּ/בֹּ֛קֶר לְ/הֵינִ֥יק אֶת בְּנִ֖/י וְ/הִנֵּה מֵ֑ת וָ/אֶתְבּוֹנֵ֤ן אֵלָי/ו֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֛ה לֹֽא הָיָ֥ה בְנִ֖/י אֲשֶׁ֥ר יָלָֽדְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: ml
  text: രാവിലെ എന്റെ മകനെ മുലയൂട്ടാൻ ഞാൻ എഴുന്നേറ്റപ്പോൾ, അതാ, അവൻ മരിച്ചുകിടന്നു. എന്നാൽ രാവിലെ ഞാൻ അവനെ ശ്രദ്ധയോടെ നോക്കിയപ്പോൾ[a], അതാ, അവൻ ഞാൻ പ്രസവിച്ച എന്റെ മകനല്ലായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ അവനെ ശ്രദ്ധാപൂർവം പരിശോധിച്ചപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഞാൻ പ്രസവിച്ചവൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקֻם
  choice: ഞാൻ എഴുന്നേറ്റപ്പോൾ
  rationale: קום എന്ന ക്രിയയുടെ ഒന്നാംപുരുഷ ഏകവചന ആഖ്യാനരൂപം; തുടർന്നുള്ള ഉദ്ദേശ്യപ്രയോഗവുമായി സ്വാഭാവികമായ കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: സാധാരണ കാലസൂചന. എബ്രായത്തിലെ ആവർത്തനം ആഖ്യാനത്തിന്റെ ഗതി നിലനിർത്താൻ രണ്ടിടത്തും സൂക്ഷിച്ചു.
- source_word: לְהֵינִיק
  choice: മുലയൂട്ടാൻ
  rationale: ינק എന്ന ക്രിയയുടെ ഹിഫീൽ അനന്തരൂപം ഇവിടെ ശിശുവിന് മുലപ്പാൽ കൊടുക്കുക എന്നർഥം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും.
- source_word: אֶת־בְּנִי
  choice: എന്റെ മകനെ
  rationale: בן എന്ന പദം ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടെ പ്രത്യേകമായി ‘എന്റെ മകൻ’ എന്നാണ്.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: הִנֵּה പെട്ടെന്നുള്ള തിരിച്ചറിവിനും നാടകീയ ഊന്നലിനും ഉപയോഗിക്കുന്നു; എബ്രായത്തിലെപ്പോലെ രണ്ടിടത്തും ആവർത്തിച്ചു.
- source_word: מֵת
  choice: അവൻ മരിച്ചുകിടക്കുന്നു
  rationale: അമ്മ കണ്ട സമയത്തെ കുഞ്ഞിന്റെ മരിച്ച അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘അവൻ’ എന്നത് വ്യക്തിപരമായ സൂചന നിലനിർത്തുന്നു.
- source_word: וָאֶתְבּוֹנֵן
  choice: ഞാൻ സൂക്ഷിച്ചുനോക്കിയപ്പോൾ
  rationale: בין/בון എന്ന ധാതുവിന്റെ ഈ രൂപം ശ്രദ്ധാപൂർവമായ നിരീക്ഷണമോ പരിശോധനയോ സൂചിപ്പിക്കുന്നു; തിരിച്ചറിവിലേക്കു നയിച്ച അടുത്തുനോട്ടം വ്യക്തമാക്കുന്നു.
- source_word: אֵלָיו
  choice: അവനെ
  rationale: നോക്കുക എന്ന മലയാളക്രിയയോടൊപ്പം സ്വാഭാവികമായി വരുന്ന കർമരൂപം.
- source_word: לֹא הָיָה בְנִי
  choice: അവൻ എന്റെ മകനല്ലായിരുന്നു
  rationale: എബ്രായത്തിലെ വ്യക്തിപരമായ പുല്ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: ഞാൻ പ്രസവിച്ച
  rationale: ഒന്നാംപുരുഷത്തിലുള്ള ילד ഇവിടെ പ്രസവത്തെ സൂചിപ്പിക്കുന്നു; ചുരുക്കവും നേരിട്ടുമുള്ള വിവർത്തനം.
