    issue: “അർധരാത്രിയിൽ” is overly specific.
    rationale: The Hebrew locative expression means ‘in the middle of the night,’ not necessarily ‘at midnight.’
  - severity: low
    issue: Footnote wording and anchor need adjustment.
    rationale: “മാറോടുചേർത്ത്” is not a parallel lexical rendering of “മടിയിൽ,” and the marker should directly follow the term under discussion.
