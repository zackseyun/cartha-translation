base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: ml
  text: അവൾ രാത്രിയുടെ നടുവിൽ എഴുന്നേറ്റ്, അങ്ങയുടെ ദാസി ഉറങ്ങിക്കിടക്കുമ്പോൾ എന്റെ അരികിൽനിന്ന് എന്റെ മകനെ എടുത്ത് അവളുടെ മടിയിൽ[a] കിടത്തി; അവളുടെ മരിച്ച മകനെ എന്റെ മടിയിലും കിടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മടിയിൽ” എന്നതിന് “മാറിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ חֵיק നെഞ്ചിനോടുചേർന്ന ഭാഗത്തെയോ മടിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: അർധരാത്രിയിൽ
  rationale: രാത്രിയുടെ മധ്യഭാഗം എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: מֵאֶצְלִי
  choice: എന്റെ അരികിൽനിന്ന്
  rationale: ഉറങ്ങിക്കിടന്ന സംസാരിക്കുന്നവളുടെ തൊട്ടരികിലുള്ള സ്ഥാനം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַאֲמָתְךָ
  choice: അങ്ങയുടെ ദാസി
  rationale: രാജാവിനോടുള്ള സ്ത്രീയുടെ വിനയപൂർവമായ സ്വയംപരാമർശവും സ്ത്രീലിംഗവും നിലനിർത്തുന്നു.
- source_word: יְשֵׁנָה
  choice: ഉറങ്ങിക്കിടക്കുമ്പോൾ
  rationale: മകനെ എടുത്ത സമയത്ത് തുടരുകയായിരുന്ന പശ്ചാത്തലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתַּשְׁכִּיבֵהוּ / הִשְׁכִּיבָה
  choice: കിടത്തി
  rationale: ശയിപ്പിക്കുക എന്ന ഹിഫീൽ ക്രിയയുടെ കാരണാർത്ഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: അവളുടെ മടിയിൽ / എന്റെ മടിയിൽ
  rationale: חֵיק സൂചിപ്പിക്കുന്ന നെഞ്ചോടുചേർന്ന മടി/മാർവ്വിടം എന്ന ശരീരഭാഗത്തിന് ആധുനിക മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമായ സമാനപദം; രണ്ടു സമാന്തര പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തുന്നു.
- source_word: בְּנָהּ הַמֵּת
  choice: അവളുടെ മരിച്ച മകനെ
  rationale: മരിച്ച എന്ന കർത്തൃവിശേഷണത്തിന്റെ സ്വാഭാവിക മലയാളക്രമം പാലിക്കുന്നു.
