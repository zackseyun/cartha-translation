id: 1KI.17.8
reference: 1 Kings 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ വചനം അവന്റെ അടുക്കൽ വന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ … ഉണ്ടായി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; היהയുടെ ആശയം ‘ഉണ്ടായി’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: דְבַר
  choice: അരുളപ്പാട്
  rationale: דְבַר יְהוָה എന്ന സ്ഥിരമായ പ്രവാചകസൂത്രത്തിൽ ഇത് ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അരുളപ്പാട്’ ദൈവത്തിൽനിന്നുള്ള വചനമെന്ന ആശയം സ്വാഭാവികമായും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: אֵלָיו
  choice: അവന്
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുരുഷലിംഗ പ്രത്യയത്തോടുകൂടിയ אֶל എന്നത് ഇവിടെ ‘അവന്/അവന്റെ അടുക്കൽ’ എന്നാണ്; സന്ദർഭത്തിൽ ‘അവന്’ സ്വാഭാവികമാണ്.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ രൂപത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ പ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: דְבַר יְהוָה എന്ന പ്രവാചകസൂത്രം
  choice: യഹോവയുടെ അരുളപ്പാട്
  alternative: യഹോവയുടെ വചനം
  rationale: ‘അരുളപ്പാട്’ ദൈവത്തിൽനിന്നുള്ള ആശയവിനിമയമെന്ന സൂചന നിലനിർത്തുന്നു; എന്നാൽ അതിനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തിന് ദ്വിബിന്ദു വഴിയൊരുക്കുന്നു; അനാവശ്യമായ പുരാതന ശൈലി ഒഴിവാക്കി.
