id: 1KI.17.17
reference: 1 Kings 17:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: ml
  text: ഈ സംഭവങ്ങൾക്കുശേഷം, വീട്ടുടമയായ ആ സ്ത്രീയുടെ മകൻ രോഗബാധിതനായി. അവന്റെ രോഗം അതീവ ഗുരുതരമായി; ഒടുവിൽ അവനിൽ ശ്വാസം ശേഷിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘അവനിൽ ജീവൻ ശേഷിച്ചില്ല.’ എബ്രായഭാഷയിൽ അക്ഷരാർഥം: ‘അവനിൽ ശ്വാസം ശേഷിച്ചില്ല.’'
    reason: נְשָׁמָה എന്ന പദത്തിന് ഇവിടെ ‘ശ്വാസം’ എന്ന അക്ഷരാർഥത്തോടൊപ്പം ‘ജീവൻ’ എന്ന സന്ദർഭാർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: എബ്രായ ആഖ്യാനത്തിലെ കാലസൂചകമായ പ്രയോഗവും הַדְּבָרִים എന്ന ബഹുവചനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: חָלָה
  choice: രോഗബാധിതനായി
  rationale: രോഗാവസ്ഥയിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭാവം വ്യക്തമാക്കുന്നു; വെറും സ്ഥിതിവിവരണമാകുന്ന ‘രോഗിയായിരുന്നു’ എന്നതിനെക്കാൾ യോജിച്ചത്.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: വീട്ടുടമയായ ആ സ്ത്രീയുടെ മകൻ
  rationale: בַּעֲלַת הַבָּיִת എന്നത് സ്ത്രീലിംഗത്തിൽ ‘വീടിന്റെ ഉടമ/നാഥ’ എന്നാണ്. കാലഹരണപ്പെട്ട പദപ്രയോഗമില്ലാതെ ഉടമസ്ഥതയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: അവന്റെ രോഗം അതീവ ഗുരുതരമായി
  rationale: രോഗം കടുത്തതായിത്തീർന്ന പുരോഗതി സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: ഒടുവിൽ അവനിൽ ശ്വാസം ശേഷിച്ചില്ല
  rationale: נְשָׁמָה എന്നതിന്റെ പ്രാഥമികമായ ‘ശ്വാസം’ എന്ന അർഥം നിലനിർത്തി, മരണത്തെ വ്യാഖ്യാനമായി നേരിട്ട് പ്രസ്താവിക്കാതെ എബ്രായവാക്യത്തിന്റെ സൂചന സംരക്ഷിക്കുന്നു. ‘ഒടുവിൽ’ עַד אֲשֶׁר സൂചിപ്പിക്കുന്ന പര്യവസാനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അവസാന വാക്യഭാഗം മരണം എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യണമോ, എബ്രായ ശ്വാസപ്രയോഗം നിലനിർത്തണമോ
  choice: ‘അവനിൽ ശ്വാസം ശേഷിച്ചില്ല’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘അവൻ മരിച്ചു’ അല്ലെങ്കിൽ ‘അവനിൽ ജീവൻ ശേഷിച്ചില്ല.’
  rationale: മൂലപാഠം മരണം എന്ന ലളിതക്രിയ ഉപയോഗിക്കാതെ נְשָׁמָה (‘ശ്വാസം’) ഒന്നും ശേഷിച്ചില്ല എന്നു പറയുന്നു. അതിനാൽ വാചകത്തിന്റെ യഥാർഥ രൂപവും അതിലെ വ്യാഖ്യാനസാധ്യതയും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വീട്ടുടമയായ’ എന്നത് വ്യക്തവും സമകാലികവും; ‘അതീവ ഗുരുതരമായി’ എന്നത് ഗൗരവമുള്ള തിരുവെഴുത്തുഭാഷയ്ക്ക് യോജിച്ചതുമാണ്. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന [a] അതുമായി ബന്ധപ്പെട്ട അവസാന വാക്യഭാഗത്തോടു ചേർത്തിരിക്കുന്നു.
