  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ യഹോവയോടു നിലവിളിച്ചു പറഞ്ഞു: “എന്റെ ദൈവമായ യഹോവേ, ഞാൻ അതിഥിയായി താമസിക്കുന്ന[a] വിധവയ്ക്കും അങ്ങ് അവളുടെ മകനെ മരിപ്പിച്ചുകൊണ്ട് അനർഥം വരുത്തിയോ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ പരദേശിയായി പാർക്കുന്ന’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം അതിഥിയായോ ആശ്രിതനായോ താൽക്കാലികമായി താമസിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഈ വിധവയോടും അങ്ങ് തിന്മ ചെയ്തുവോ?’ എബ്രായക്രിയയ്ക്ക് ഹാനി ചെയ്യുക, ദുരന്തം വരുത്തുക, മോശമായി പെരുമാറുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: യഹോവയോടു നിലവിളിച്ചു
  rationale: പ്രാർഥനയുടെ സന്ദർഭത്തിൽ קרא אל അടിയന്തരവും വികാരതീവ്രവുമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה אֱלֹהָי
  choice: എന്റെ ദൈവമായ യഹോവേ
  rationale: നേരിട്ടുള്ള സംബോധനയും ‘എന്റെ ദൈവം’ എന്ന വ്യക്തിപരമായ ബന്ധവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: ഞാൻ അതിഥിയായി താമസിക്കുന്ന
  rationale: ഹിത്പയേൽ രൂപത്തിലുള്ള גור താൽക്കാലികമായോ ആശ്രിതനായ അതിഥിയായോ പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അതിഥിയായി താമസിക്കുന്ന’ ഈ സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: הֲרֵעוֹתָ
  choice: അങ്ങ് അനർഥം വരുത്തിയോ
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ധാർമിക തിന്മ ചെയ്യുക എന്നതിലുപരി ഹാനിയോ ദുരന്തമോ വരുത്തുക എന്ന അർഥം വഹിക്കാം. ‘അനർഥം വരുത്തുക’ കാരണാത്മകതയും വിലാപത്തിന്റെ തീവ്രതയും നിലനിർത്തുന്നു.
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: അവളുടെ മകനെ മരിപ്പിച്ചുകൊണ്ട്
  rationale: മരണത്തിന് കാരണമാകുക എന്ന ഹിഫീൽ അർഥവും മുൻക്രിയയോടുള്ള മാർഗം/ഫലം ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു; בן എന്നത് ‘മകൻ’ എന്നാണ് വിവർത്തനം ചെയ്തിരിക്കുന്നത്.
theological_decisions:
- issue: ഏലിയാവ് ദൈവത്തെ ധാർമിക തിന്മ ചെയ്തതായി കുറ്റപ്പെടുത്തുന്നുവോ, ദൈവം ദുരന്തം വരുത്തിയതിനെക്കുറിച്ച് വിലപിക്കുന്നുവോ
  choice: ‘അങ്ങ് അനർഥം വരുത്തിയോ?’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘അങ്ങ് ഈ വിധവയോടു തിന്മ ചെയ്തുവോ?’
  rationale: ഹീബ്രു ക്രിയയ്ക്ക് ഹാനി, ദുരന്തം, മോശമായി പെരുമാറൽ എന്നീ അർഥങ്ങൾ വരാം. തിരുവെഴുത്തിലെ ധാർമിക-ദൈവശാസ്ത്ര സംഘർഷം മായ്ച്ചുകളയാതെ, മലയാളത്തിൽ നിർബന്ധമായും ധാർമിക ദുഷ്ടത ആരോപിക്കുന്നതിലേക്കു വാചകം ചുരുക്കാതിരിക്കാനാണ് ഈ തിരഞ്ഞെടുപ്പ്.
- issue: മകന്റെ മരണത്തിൽ ദൈവത്തിന്റെ പ്രവർത്തനത്തെ എത്ര നേരിട്ട് അവതരിപ്പിക്കണം
  choice: ‘മകനെ മരിപ്പിച്ചുകൊണ്ട്’ എന്ന നേരിട്ടുള്ള കാരണാത്മക ഭാഷ നിലനിർത്തി
  alternative: ‘മകൻ മരിക്കാൻ അനുവദിച്ചുകൊണ്ട്’
  rationale: לְהָמִית എന്ന ഹിഫീൽ ക്രിയയെ വെറും അനുവാദമായി മാറ്റുന്നത് മൂലപാഠത്തിലെ കാരണാത്മക പ്രസ്താവനയെ മൃദൂകരിക്കും. ഏലിയാവിന്റെ ധീരമായ വിലാപത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ചോദ്യം, വികാരതീവ്രത, ദൈവിക കാരണാത്മകത എന്നിവ മൃദൂകരിക്കാതെ നിലനിർത്തി.
