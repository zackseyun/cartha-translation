source:
  edition: WLC
  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ ബാലന്റെമേൽ മൂന്നുപ്രാവശ്യം ശരീരം നീട്ടിക്കിടന്നു. അവൻ യഹോവയോടു നിലവിളിച്ചു പറഞ്ഞു: “യഹോവേ, എന്റെ ദൈവമേ, ദയവായി ഈ ബാലന്റെ ജീവൻ അവനിലേക്കു മടങ്ങിവരട്ടെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ഈ ബാലന്റെ പ്രാണൻ അവന്റെ ഉള്ളിലേക്കു മടങ്ങിവരട്ടെ.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ: “ഈ ബാലന്റെ נֶפֶשׁ അവന്റെ ആന്തരഭാഗത്തിലേക്കു മടങ്ങിവരട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: നിവർന്നുകിടന്നു
  rationale: അപൂർവമായ ഈ ഹിത്പാഎൽ ക്രിയ ഇവിടെ ഏലിയാവ് ബാലന്റെമേൽ തന്റെ ശരീരം നീട്ടിക്കിടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘നിവർന്നുകിടന്നു’ എന്നത് അളക്കുക എന്ന പദശ അർഥം അനാവശ്യമായി മുന്നോട്ടുകൊണ്ടുവരാതെ സ്വാഭാവിക മലയാളത്തിൽ ആ ദേഹഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עַל הַיֶּלֶד
  choice: ബാലന്റെമേൽ
  rationale: עַל ഇവിടെ ദേഹപരമായ സ്ഥാനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ബാലന്റെമേൽ’ അതിനെ നേരായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നുപ്രാവശ്യം
  rationale: എണ്ണവും ആവർത്തനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: യഹോവയോടു നിലവിളിച്ചു
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ קרא אל-ന്റെ തീവ്രമായ അപേക്ഷാഭാവം ‘നിലവിളിച്ചു’ വ്യക്തമാക്കുന്നു; വെറും ‘വിളിച്ചു’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה אֱלֹהָי
  choice: എന്റെ ദൈവമായ യഹോവേ
  rationale: ദൈവനാമത്തോടൊപ്പം ഒന്നാംപുരുഷ ഉടമസ്ഥതയും നേരിട്ടുള്ള സംബോധനവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: תָּשָׁב נָא
  choice: ദയവായി ... മടങ്ങിവരട്ടെ
  rationale: ജസ്സീവും נָא-യും ചേർന്ന വിനീതവും അടിയന്തരവുമായ അപേക്ഷയെ ‘ദയവായി ... മടങ്ങിവരട്ടെ’ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: മരിച്ച ബാലൻ വീണ്ടും ജീവിക്കണമെന്ന കഥാസന്ദർഭത്തിൽ נֶפֶשׁ അവന്റെ ജീവനെ സൂചിപ്പിക്കുന്നു. പ്രത്യേകമായ ഒരു ആത്മശരീര സിദ്ധാന്തം ഉറപ്പിക്കാതെ ‘ജീവൻ’ സന്ദർഭാർഥം നൽകുന്നു; ‘പ്രാണൻ/ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַיֶּלֶד הַזֶּה
  choice: ഈ ബാലൻ
  rationale: יַלֶד-ന്റെ പുരുഷലിംഗവും കഥയിലെ വിധവയുടെ മകനെന്ന തിരിച്ചറിയലും കാത്തുസൂക്ഷിക്കുന്ന വ്യക്തമായ ആധുനിക പ്രയോഗം.
- source_word: עַל קִרְבּוֹ
  choice: അവന്റെ ഉള്ളിലേക്കു
  rationale: പദശമായി ‘അവന്റെ ആന്തരഭാഗത്തിലേക്ക്/മേൽ’ എന്ന ദേഹാന്തര സൂചന മലയാളത്തിൽ അതിരുകടന്ന ശാരീരിക വ്യാഖ്യാനമില്ലാതെ ‘അവന്റെ ഉള്ളിലേക്കു’ എന്നു സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുനർജീവന സന്ദർഭത്തിൽ נֶפֶשׁ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ജീവൻ
  alternative: പ്രാണൻ അഥവാ ആത്മാവ്
  rationale: പ്രാർഥനയുടെ നേരിട്ടുള്ള ലക്ഷ്യം ബാലന്റെ ജീവൻ മടങ്ങിവരിക എന്നതാണ്. ‘ജീവൻ’ കഥാസന്ദർഭം വ്യക്തമായി നൽകുകയും മനുഷ്യഘടനയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു. നാമപദത്തിന്റെ വിശാലമായ അർഥപരിധിയും പരമ്പരാഗത സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. കഥയുടെ അടിയന്തരതയ്ക്കായി ‘നിലവിളിച്ചു’ എന്നും അപേക്ഷാഭാവത്തിനായി ‘ദയവായി ... മടങ്ങിവരട്ടെ’ എന്നും ഉപയോഗിച്ചു. പദശമായ ആന്തരദേഹ സൂചന പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ ‘അവന്റെ ഉള്ളിലേക്കു’ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രാർഥനാവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
