  source_fidelity: The Malayalam accurately represents the Hebrew address, the idiom of protest/distance (מַה־לִּי וָלָךְ), the formal title “man of God,” the rhetorical question, the causative force of both infinitives, and the explicitly male “son.” “എന്റെ കുറ്റം” appropriately leaves עֲוֺנִי broad enough to encompass wrongdoing and guilt without forcing a single interpretation.
