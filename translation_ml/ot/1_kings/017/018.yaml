id: 1KI.17.18
reference: 1 Kings 17:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אֵ֣לִיָּ֔הוּ מַה לִּ֥/י וָ/לָ֖/ךְ אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּ֧אתָ אֵלַ֛/י לְ/הַזְכִּ֥יר אֶת עֲוֺנִ֖/י וּ/לְ/הָמִ֥ית אֶת בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: ml
  text: 'അവൾ ഏലിയാവിനോടു പറഞ്ഞു: “ദൈവപുരുഷനേ, എനിക്കും അങ്ങേക്കും തമ്മിൽ എന്തു കാര്യം? എന്റെ കുറ്റം[a] ഓർമയിൽ കൊണ്ടുവരാനും എന്റെ മകനെ മരിപ്പിക്കാനുമാണോ അങ്ങ് എന്റെ അടുക്കൽ വന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ പാപം’ എന്നോ ‘എന്റെ കുറ്റബാധ്യത’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് തെറ്റായ പ്രവൃത്തി, അതിന്റെ കുറ്റബാധ്യത, അതിന്റെ പരിണതഫലം എന്നിവയെ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: എനിക്കും അങ്ങേക്കും തമ്മിൽ എന്തു കാര്യം?
  rationale: അകലം പാലിക്കാനുള്ള പ്രതിഷേധവും പരാതിയും പ്രകടിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സംഘർഷഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷനേ
  rationale: പ്രവാചകനെയോ ദൈവിക ദൂതനെയോ സൂചിപ്പിക്കുന്ന ഔപചാരിക എബ്രായ സ്ഥാനപ്പേര് സംരക്ഷിക്കുന്നു.
- source_word: בָּאתָ אֵלַי
  choice: അങ്ങ് എന്റെ അടുക്കൽ വന്നത്
  rationale: നേരിട്ടുള്ള സംഭാഷണത്തിലെ കുറ്റപ്പെടുത്തൽ നിറഞ്ഞ ചോദ്യഭാവം മലയാളത്തിലെ ചോദ്യഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לְהַזְכִּיר
  choice: ഓർമയിൽ കൊണ്ടുവരാനും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥം നിലനിർത്തുന്നു; ആരുടെ ഓർമയിൽ എന്നത് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അത് നിർണയിക്കുന്നില്ല.
- source_word: עֲוֺנִי
  choice: എന്റെ കുറ്റം
  rationale: തെറ്റായ പ്രവൃത്തി, കുറ്റബോധം, കുറ്റബാധ്യത എന്നീ അർത്ഥവശങ്ങൾ ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപദം; അർത്ഥപരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּלְהָמִית
  choice: മരിപ്പിക്കാനും
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരണാർത്ഥം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘കൊല്ലുക’ എന്നതിനെക്കാൾ കാരണഭാവം വ്യക്തമാണ്.
- source_word: בְּנִי
  choice: എന്റെ മകനെ
  rationale: മൂലപദം പ്രത്യേകമായി ‘മകൻ’ എന്നാണ് അർത്ഥമാക്കുന്നത്; അതിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധവയുടെ ആരോപണത്തിലെ עֲוֺנִי എന്ന പദത്തിന്റെ അർത്ഥം
  choice: എന്റെ കുറ്റം
  alternative: എന്റെ പാപം; എന്റെ കുറ്റബാധ്യത
  rationale: മകന്റെ മരണത്തെ സ്വന്തം ധാർമിക കുറ്റവുമായി വിധവ ബന്ധിപ്പിക്കുന്നു. എബ്രായപദം തെറ്റായ പ്രവൃത്തിയെയും അതിൽനിന്നുള്ള കുറ്റബാധ്യതയെയും സൂചിപ്പിക്കാം; അതിനാൽ പ്രവൃത്തിയോ നിലയോ മാത്രം എന്ന് ചുരുക്കാതെ അർത്ഥസംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘അങ്ങ്’ എന്ന ആദരസംബോധന സ്വാഭാവികത നൽകുന്നു; അതേസമയം ചോദ്യത്തിന്റെ പ്രതിഷേധഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘കുറ്റം’ എന്ന പദത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
