  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: ml
  text: “എഴുന്നേറ്റ്, സീദോനോടു ബന്ധപ്പെട്ട സാരെഫാത്തിലേക്കു പോയി അവിടെ താമസിക്കുക.[a] ഇതാ, അവിടെ ഒരു വിധവ നിന്നെ പോറ്റാൻ ഞാൻ കൽപ്പിച്ചിരിക്കുന്നു.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സീദോനിലുള്ള” അല്ലെങ്കിൽ “സീദോനിനടുത്തുള്ള.” ഹീബ്രു പദപ്രയോഗം സാരെഫാത്തിനെ സീദോനുമായി ബന്ധപ്പെടുത്തുന്നു; ഇത് പ്രദേശികമോ രാഷ്ട്രീയമോ ആയ അനുബന്ധത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവിടെ ഒരു വിധവ നിന്നെ പോറ്റാൻ ഞാൻ നിയമിച്ചിരിക്കുന്നു.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “ഞാൻ കൽപ്പിച്ചിരിക്കുന്നു” എന്നാണ്. വിധവയ്ക്ക് അതിനെക്കുറിച്ച് അപ്പോൾ ബോധമുണ്ടായിരുന്നുവെന്ന് തുടർന്നുള്ള വിവരണം വ്യക്തമാക്കുന്നില്ലെങ്കിലും, ഈ പ്രയോഗം ദൈവത്തിന്റെ പരമാധികാരമുള്ള നിർദേശത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ആജ്ഞാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള ആജ്ഞയുമായി ചേർന്ന പ്രവാഹവും നിലനിർത്തുന്നു.
- source_word: לֵ֤ךְ
  choice: പോയി
  rationale: הלך എന്ന ചലനക്രിയയുടെ ആജ്ഞാർഥം. ‘പോകുക’ എന്ന കല്പന മലയാളത്തിലെ സംയുക്ത ആജ്ഞാരൂപത്തിൽ ‘പോയി … താമസിക്കുക’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: צָרְפַתָה
  choice: സാരെഫാത്തിലേക്കു
  rationale: സ്ഥലനാമം ശബ്ദലിപ്യന്തരണം ചെയ്ത്, ദിശാസൂചകമായ ה־യുടെ അർഥം ‘-ലേക്കു’ എന്ന രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: സീദോനോടു ബന്ധപ്പെട്ട
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന്റെ പ്രദേശികമോ രാഷ്ട്രീയമോ ആയ അനുബന്ധം നിലനിർത്തുന്നു; ‘സീദോനിൽ’ അല്ലെങ്കിൽ ‘സീദോനിനടുത്ത്’ എന്ന് ഏകാർത്ഥമാക്കുന്നില്ല.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: അവിടെ താമസിക്കുക
  rationale: മുൻ ആജ്ഞകളെ തുടർന്നുള്ള നിർദേശമായി പ്രവർത്തിക്കുന്ന രൂപം; ‘താമസിക്കുക’ എന്നത് സ്ഥിരമായി പാർക്കുക/കഴിയുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു നിപാതത്തിന്റെ പ്രസംഗധർമ്മം, മാന്യവും പരിചിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִוִּיתִי
  choice: ഞാൻ കല്പിച്ചിരിക്കുന്നു
  rationale: צוה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കല്പിക്കുക’ നിലനിർത്തുന്നു; വിധവ ഈ കല്പനയെ ബോധപൂർവം അറിഞ്ഞിരുന്നോ എന്ന ആഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കുന്നില്ല.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ഒരു വിധവ
  rationale: ‘ഒരു സ്ത്രീ, ഒരു വിധവ’ എന്ന ഹീബ്രു പ്രയോഗത്തെ അർഥനഷ്ടമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കുന്നു.
- source_word: לְכַלְכְּלֶךָ
  choice: നിന്നെ പോറ്റണമെന്ന്
  rationale: כלכל എന്ന ക്രിയയിലെ ആഹാരവും ഉപജീവനസഹായവും ഉൾപ്പെടുന്ന പരിപാലനാർഥം ‘പോറ്റുക’ സ്വാഭാവികമായി നൽകുന്നു; ഉദ്ദേശ്യഘടന ‘-ണമെന്ന്’ വഴി കല്പനയുമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിധവയോട് ദൈവം ‘കല്പിച്ചിരിക്കുന്നു’ എന്ന പ്രസ്താവനയുടെ അർഥം
  choice: ‘ഞാൻ കല്പിച്ചിരിക്കുന്നു’ എന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ഞാൻ നിയമിച്ചിരിക്കുന്നു’ / ‘ഞാൻ ഒരുക്കിയിരിക്കുന്നു’
  rationale: צוה സാധാരണയായി ‘കല്പിക്കുക’ എന്നാണ്. തുടർന്നുള്ള വിവരണത്തിൽ വിധവയ്ക്ക് മുൻകൂട്ടി ലഭിച്ച ദൈവിക കല്പനയെക്കുറിച്ചുള്ള ബോധം വ്യക്തമല്ലെങ്കിലും, അതിനെ ‘നിയമിച്ചു’ അല്ലെങ്കിൽ ‘ഒരുക്കി’ എന്നു മൃദൂകരിക്കുന്നത് പാഠത്തിലെ ദൈവിക പ്രവർത്തനവുമായി ബന്ധപ്പെട്ട യഥാർഥ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘ഇതാ’ എന്ന ബൈബിൾപരിചിത പദം പുരാതനഭാവം അമിതമാക്കാതെ ശ്രദ്ധക്ഷണക നിപാതത്തെ നിലനിർത്തുന്നു. സ്ഥലബന്ധത്തിലെ അവ്യക്തതയും ‘കല്പിച്ചു’ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷവും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
