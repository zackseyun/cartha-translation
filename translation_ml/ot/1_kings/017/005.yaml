  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: ml
  text: അങ്ങനെ അവൻ പോയി യഹ്‌വേയുടെ വചനപ്രകാരം ചെയ്തു; അവൻ പോയി യോർദ്ദാന്റെ എതിർവശത്തുള്ള[b] കെരീത്ത് നീർച്ചാലിൽ[a] താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കെരീത്ത് തോട്’ അല്ലെങ്കിൽ ‘കെരീത്ത് കാലിക ജലപാത’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഒരു നീർച്ചാലിനെയോ മലയിടുക്കിനെയോ കാലികമായി വെള്ളമൊഴുകുന്ന ജലപാതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘യോർദ്ദാന്റെ മുമ്പിലുള്ള/എതിർവശത്തുള്ള.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അങ്ങനെ അവൻ പോയി
  rationale: തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനവും മുമ്പത്തെ കല്പനയോടുള്ള പ്രതികരണവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനപ്രകാരം ചെയ്തു
  rationale: ദൈവം അരുളിയ കല്പന അനുസരിച്ച് പ്രവർത്തിച്ചു എന്ന ഔപചാരിക അർഥം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ചതുരക്ഷര ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: ഇവിടെ ക്രിയ ഒരു സ്ഥലത്ത് പാർക്കുകയോ കുറേക്കാലം കഴിയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בְּנַחַל כְּרִית
  choice: കെരീത്ത് നീർച്ചാലിന്റെ അരികിൽ
  rationale: נחל എന്നത് നീർച്ചാൽ, തോട്, മഴക്കാല ജലപാത, അല്ലെങ്കിൽ അതിനോടു ചേർന്ന താഴ്‌വര എന്നിവയെ സൂചിപ്പിക്കാം. സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; בְ എന്നതിന്റെ സ്ഥലബന്ധം സന്ദർഭോചിതമായി ‘അരികിൽ’ എന്നു നൽകി.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: യോർദ്ദാന് അഭിമുഖമായുള്ള
  rationale: עַל־פְּנֵי എന്ന പ്രയോഗത്തിലെ ‘മുമ്പിൽ/എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന അർഥവ്യാപ്തി ദിശയായി ‘കിഴക്ക്’ എന്നു തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പതിവായ മലയാള ലിപ്യന്തരണം; സന്ദർഭത്തിൽ ‘നദി’ ചേർക്കേണ്ടതില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: עַל פְּנֵי הַיַּרְדֵּן എന്ന ഭൂമിശാസ്ത്രപ്രയോഗം
  choice: യോർദ്ദാന് അഭിമുഖമായുള്ള
  alternative: യോർദ്ദാന്റെ മുമ്പിലുള്ള; യോർദ്ദാന്റെ എതിർവശത്തുള്ള; യോർദ്ദാന്റെ കിഴക്കുള്ള
  rationale: മൂലപ്രയോഗം ദിശയെ വ്യക്തമായി ‘കിഴക്ക്’ എന്നു പറയുന്നില്ല. അതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്ന ‘അഭിമുഖമായുള്ള’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആഖ്യാനത്തിന്റെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്. ഭൂമിശാസ്ത്രപരമായ ദിശ മൂലപാഠത്തേക്കാൾ കൃത്യമാക്കി നിർണയിച്ചിട്ടില്ല.
