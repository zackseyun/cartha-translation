id: 1KI.17.16
reference: 1 Kings 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: ml
  text: ഭരണിയിലെ മാവ് തീർന്നുപോയില്ല; എണ്ണക്കുടുക്കയിലെ എണ്ണ കുറഞ്ഞുപോയതുമില്ല—യഹോവ ഏലിയാവിലൂടെ പറഞ്ഞ വചനപ്രകാരം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: ഭരണിയിലെ മാവ്
  rationale: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘മാവിന്റെ ഭരണി’ എന്നാണ്. എന്നാൽ തീരുന്നത് പാത്രമല്ല, അതിലെ മാവാണ് എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא כָלָתָה
  choice: തീർന്നുപോയില്ല
  rationale: כלה ഇവിടെ പൂർണമായി ഉപയോഗിച്ചുതീരുക, അവസാനിക്കുക എന്ന അർഥത്തിലാണ്; തുടർന്നുനിന്ന അത്ഭുതകരമായ ലഭ്യതയെ ഈ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: എണ്ണക്കുടുക്കയിലെ എണ്ണ
  rationale: צַפַּחַת എണ്ണ സൂക്ഷിക്കാനുള്ള ചെറിയ പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മാവിന്റെ ഭരണിയിൽനിന്ന് വേർതിരിച്ചറിയാനും വീട്ടുപയോഗസന്ദർഭത്തിന് ചേരാനും ‘എണ്ണക്കുടുക്ക്’ തിരഞ്ഞെടുത്തു.
- source_word: לֹא חָסֵר
  choice: കുറഞ്ഞുപോയതുമില്ല
  rationale: חסר കുറയുക, അപര്യാപ്തമാകുക, ഇല്ലാതാകുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട് വ്യത്യസ്തമായ എബ്രായ ക്രിയയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യഹോവയുടെ വചനപ്രകാരംതന്നെ
  rationale: സംഭവം യഹോവയുടെ മുൻപ്രഖ്യാപനത്തിന്റെ കൃത്യമായ നിറവേറ്റലാണെന്ന ബന്ധം നിലനിർത്തുന്നു; יהוה എന്ന ദൈവനാമം ‘യഹോവ’യായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്ത
  rationale: ദൈവം മുമ്പ് പറഞ്ഞ വചനത്തെ സൂചിപ്പിക്കുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: ഏലിയാവിലൂടെ
  rationale: അക്ഷരാർഥം ‘ഏലിയാവിന്റെ കൈയാൽ’ എന്നാണെങ്കിലും, ഇത് പ്രവാചകനെ മാധ്യമമാക്കിയുള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. ‘ഏലിയാവിലൂടെ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, ചതുർവ്യഞ്ജന ദൈവനാമമാണ് ഉള്ളത്. അതിനാൽ വ്യക്തിനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിലെ പരിചിത ലിപ്യന്തരണമായ ‘യഹോവ’ ഉപയോഗിക്കുന്നു.
- issue: പ്രവാചകമാധ്യമത്തെ സൂചിപ്പിക്കുന്ന בְּיַד എന്ന പ്രയോഗം
  choice: ഏലിയാവിലൂടെ
  alternative: ഏലിയാവിന്റെ കൈയാൽ
  rationale: വചനത്തിന്റെ ഉറവിടം യഹോവയും അത് അറിയിച്ച മനുഷ്യപ്രതിനിധി ഏലിയാവുമാണെന്ന വ്യത്യാസം നിലനിർത്തുന്നു. മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാക്കാവുന്ന അക്ഷരാനുവാദത്തിനു പകരം മാധ്യമത്തെ വ്യക്തമാക്കുന്ന രൂപം മുഖ്യപാഠത്തിൽ നൽകുന്നു.
- issue: രണ്ടു നിഷേധവാക്യങ്ങളിലെ ക്രിയാഭേദം
  choice: മാവ് ‘തീർന്നുപോയില്ല’; എണ്ണ ‘കുറഞ്ഞുപോയതുമില്ല’
  alternative: രണ്ടും ‘തീർന്നുപോയില്ല’
  rationale: כלה, חסר എന്നീ വ്യത്യസ്ത എബ്രായ ക്രിയകളുടെ സൂക്ഷ്മഭേദം നിലനിർത്തുന്നു; അതേസമയം രണ്ടും ദൈവിക പരിപാലനത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഭരണി’, ‘എണ്ണക്കുടുക്ക്’ എന്നിവ വീട്ടുപയോഗസന്ദർഭം വ്യക്തമാക്കുന്നു. വാക്യാവസാനത്തിലെ ‘പ്രകാരംതന്നെ’ മുൻപ് അരുളിച്ചെയ്ത വചനം കൃത്യമായി നിറവേറിയെന്ന ഊന്നൽ നൽകുന്നു; പുതിയ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
