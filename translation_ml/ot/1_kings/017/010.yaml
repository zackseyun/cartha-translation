  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: ml
  text: അങ്ങനെ അവൻ എഴുന്നേറ്റ് സാരെഫാത്തിലേക്കു പോയി. അവൻ പട്ടണത്തിന്റെ പ്രവേശനസ്ഥലത്ത്[a] എത്തിയപ്പോൾ, അതാ, അവിടെ ഒരു വിധവ വിറക് പെറുക്കുകയായിരുന്നു. അവൻ അവളെ വിളിച്ച്, “ദയവായി, ഒരു പാത്രത്തിൽ കുറച്ച് വെള്ളം എനിക്കു കൊണ്ടുവരൂ; എനിക്കു കുടിക്കാനാണ്,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പട്ടണത്തിന്റെ കവാടത്തിൽ.’ എബ്രായത്തിലെ פֶּתַח എന്ന പദത്തിന് ‘പ്രവേശനം’ അല്ലെങ്കിൽ ‘തുറവ്’ എന്നാണ് വിശാലമായ അർഥം; ‘കവാടം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പദമല്ല ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: അവൻ എഴുന്നേറ്റ് ... പോയി
  rationale: രണ്ട് തുടർച്ചയായ ആഖ്യാനക്രിയകളെയും സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു; קום എന്നതിലെ എഴുന്നേൽക്കൽ/പ്രവർത്തനത്തിനൊരുങ്ങൽ എന്ന ഭാവവും הלך എന്നതിലെ പോകലും പ്രകടമാണ്.
- source_word: צָרְפַתָה
  choice: സാരെഫാത്തിലേക്കു
  rationale: ദിശാസൂചകമായ ה־യെ മലയാളത്തിലെ ‘-ലേക്കു’കൊണ്ട് പ്രതിഫലിപ്പിക്കുകയും സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: פֶּתַח הָעִיר
  choice: പട്ടണത്തിന്റെ പ്രവേശനസ്ഥലത്ത്
  rationale: פֶּתַח എന്നത് നിർദിഷ്ടമായി ‘കവാടം’ എന്നല്ല, വിശാലമായി തുറവ്/പ്രവേശനം എന്നാണ്; അതിനാൽ മൂലപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ശ്രദ്ധ ആകർഷിക്കുകയും രംഗത്തിന് ആഖ്യാനജീവന്തത നൽകുകയും ചെയ്യുന്ന הִנֵּהയുടെ പ്രയോഗശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ഒരു വിധവ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒരു സ്ത്രീ, ഒരു വിധവ’ എന്ന അനുബന്ധപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു വിധവ’ എന്നു ചുരുക്കുന്നു.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: വിറകുകൊള്ളികൾ പെറുക്കിക്കൊണ്ടിരുന്നു
  rationale: קשׁשׁ ചെറിയ വിറകുകഷണങ്ങളോ കൊള്ളികളോ ശേഖരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വലിയ മരത്തടി എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: അവൻ അവളെ വിളിച്ച്
  rationale: קרא אֶל എന്നത് ഒരാളെ വിളിക്കുകയോ വിളിച്ചുപറയുകയോ ചെയ്യുന്നതാണ്; സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: קְחִי נָא
  choice: ദയവായി ... കൊണ്ടുവരാമോ
  rationale: לקח അക്ഷരാർഥത്തിൽ ‘എടുക്കുക’ ആണെങ്കിലും സംസാരിക്കുന്നവനുവേണ്ടി വെള്ളം ലഭ്യമാക്കുന്ന അഭ്യർഥനയിൽ ‘കൊണ്ടുവരുക’ സ്വാഭാവികമാണ്; נָאയുടെ വിനയഭാവം ‘ദയവായി’യും ചോദ്യംരൂപവും ചേർന്ന് പ്രകടിപ്പിക്കുന്നു.
- source_word: מְעַט מַיִם
  choice: കുറച്ചു വെള്ളം
  rationale: ചെറിയ അളവിനെ സൂചിപ്പിക്കുന്ന מְעַטയുടെ സാധാരണ മലയാള തുല്യം.
- source_word: בַּכְּלִי
  choice: ഒരു പാത്രത്തിൽ
  rationale: כְּלִי ഒരു പൊതുപദമായതിനാൽ ‘കുടം’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ പദം ഒഴിവാക്കി.
- source_word: וְאֶשְׁתֶּה
  choice: എനിക്കു കുടിക്കാൻ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ ഉദ്ദേശ്യ/ആഗ്രഹഭാവം സ്വാഭാവിക മലയാള അഭ്യർഥനയിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
