translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അതാ’ എന്നത് മൂലത്തിലെ ശ്രദ്ധാകർഷക കണത്തിന്റെ ജീവന്തത നിലനിർത്തുന്നു. അഭ്യർഥന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ചോദ്യംരൂപം ഉപയോഗിച്ചെങ്കിലും അതിലെ വിനയവും ഉദ്ദേശ്യവും സംരക്ഷിച്ചു.
