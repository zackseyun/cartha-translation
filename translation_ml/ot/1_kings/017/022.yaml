id: 1KI.17.22
reference: 1 Kings 17:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: ml
  text: യഹോവ ഏലിയാവിന്റെ ശബ്ദം കേട്ടു; കുട്ടിയുടെ ജീവൻ അവന്റെ ഉള്ളിലേക്കു മടങ്ങിവന്നു[a]; അവൻ ജീവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുട്ടിയുടെ പ്രാണൻ അവന്റെ ഉള്ളിലേക്കു മടങ്ങിവന്നു.’ എബ്രായത്തിലെ നെഫെഷ് എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘ജീവൻ,’ ‘പ്രാണൻ/ആത്മാവ്,’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: പ്രാർഥനാസന്ദർഭത്തിൽ שׁמע കേൾക്കുകയും അനുകൂലമായി പ്രതികരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ശബ്ദം കേട്ടു’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് ആ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּקוֹל
  choice: ശബ്ദം
  rationale: അക്ഷരാർഥമായ ‘ശബ്ദം’ നിലനിർത്തുന്നു; ‘പ്രാർഥന’ അല്ലെങ്കിൽ ‘അപേക്ഷ’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: וַתָּשָׁב
  choice: മടങ്ങിവന്നു
  rationale: שׁוב ഇവിടെ നഷ്ടപ്പെട്ട ജീവൻ തിരികെ ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘മടങ്ങിവന്നു’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: נֶפֶשׁ
  choice: ജീവൻ
  rationale: മരിച്ച കുട്ടി വീണ്ടും ജീവിക്കുന്ന ഈ സന്ദർഭത്തിൽ נֶפֶשׁ എന്നതിന്റെ മുഖ്യസന്ദർഭാർഥം ‘ജീവൻ’ ആണ്. ‘പ്രാണൻ/ആത്മാവ്’ എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הַיֶּלֶד
  choice: കുട്ടി
  rationale: יֶלֶד എന്ന പദത്തിന്റെ പൊതുവായ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עַל קִרְבּוֹ
  choice: അവന്റെ ഉള്ളിലേക്ക്
  rationale: קֶרֶב സൂചിപ്പിക്കുന്ന ശരീരത്തിന്റെ അകം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘അവനിലേക്ക്’ എന്നു ചുരുക്കി മൂലപാഠത്തിലെ ആന്തരികത നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: וַיֶּחִי
  choice: അവൻ വീണ്ടും ജീവിച്ചു
  rationale: חיהയുടെ ഫലാർഥം വ്യക്തമായി നൽകുന്നു. മലയാളത്തിൽ പുനർജീവനത്തിന്റെ സന്ദർഭം വ്യക്തമാക്കാൻ ‘വീണ്ടും’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: പുനർജീവനസന്ദർഭത്തിലെ נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജീവൻ
  alternative: പ്രാണൻ / ആത്മാവ്
  rationale: വാക്യം കുട്ടിയുടെ ജീവൻ പുനഃസ്ഥാപിക്കപ്പെട്ടതിനെ വിവരിക്കുന്നു. ‘ജീവൻ’ എന്നത് ഉടൻ മനസ്സിലാകുന്ന കഥാസന്ദർഭാർഥം നൽകുകയും, മനുഷ്യഘടനയെക്കുറിച്ചുള്ള പ്രത്യേക ദാർശനികമോ മതശാസ്ത്രപരമോ ആയ നിലപാട് പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു. എങ്കിലും ‘പ്രാണൻ/ആത്മാവ്’ ഭാഷാപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. എബ്രായത്തിലെ അനുക്രമ ക്രിയകൾ അർധവിരാമങ്ങളാൽ വേർതിരിച്ച് വായനാസൗകര്യം നൽകി. ദൈവനാമത്തിന് ‘യഹോവ’ ഉപയോഗിച്ചു; נֶפֶשׁ എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
