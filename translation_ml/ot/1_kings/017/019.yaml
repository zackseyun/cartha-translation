  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായ വാക്യത്തിലെ തുടർച്ചയായ പ്രവൃത്തികൾ സംക്ഷിപ്തമായി നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമോ പഴഞ്ചനോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
