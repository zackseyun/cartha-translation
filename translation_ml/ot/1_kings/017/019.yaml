id: 1KI.17.19
reference: 1 Kings 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלֶ֖י/הָ תְּנִֽי לִ֣/י אֶת בְּנֵ֑/ךְ וַ/יִּקָּחֵ֣/הוּ מֵ/חֵיקָ֗/הּ וַֽ/יַּעֲלֵ֨/הוּ֙ אֶל הָ/עֲלִיָּ֗ה אֲשֶׁר הוּא֙ יֹשֵׁ֣ב שָׁ֔ם וַ/יַּשְׁכִּבֵ֖/הוּ עַל מִטָּתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “നിന്റെ മകനെ എനിക്കു തരിക.” പിന്നെ അവൻ അവളുടെ മടിയിൽനിന്ന്[a] അവനെ എടുത്ത്, താൻ താമസിച്ചിരുന്ന മുകളിലത്തെ മുറിയിലേക്കു[b] കൊണ്ടുപോയി, തന്റെ കിടക്കയിൽ കിടത്തി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം നെഞ്ചോടോ മടിയിലോ ചേർത്തുപിടിക്കുന്ന ഭാഗത്തെ സൂചിപ്പിക്കാം; ‘അവളുടെ നെഞ്ചിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘മേൽമുറി’ അല്ലെങ്കിൽ ‘മാളികമുറി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: എനിക്കു തരിക
  rationale: ആജ്ഞാരൂപത്തോടുകൂടിയ לִי സ്വാഭാവികമായി ‘എനിക്കു തരിക’ എന്നു വരുന്നു; അഭ്യർഥനയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵךְ
  choice: നിന്റെ മകനെ
  rationale: בֵּן എന്നത് പൊതുവായ ‘കുട്ടി’ എന്നതിനെക്കാൾ വ്യക്തമായി ‘മകൻ’ എന്നാണ്.
- source_word: מֵחֵיקָהּ
  choice: അവളുടെ മടിയിൽനിന്ന്
  rationale: חֵיק നെഞ്ചോടോ മടിയോടോ ചേർത്തുപിടിക്കുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘മടിയിൽനിന്ന്’ സ്വാഭാവികവും ദൃശ്യവുമായ മലയാളമാണ്; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּעֲלֵהוּ
  choice: കൊണ്ടുപോയി
  rationale: ലക്ഷ്യസ്ഥാനമായ മുകളിലത്തെ മുറി വ്യക്തമാക്കിയതിനാൽ മുകളിലേക്കുള്ള ചലനം സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ ശാരീരികമായി ബാലനെ എടുത്തുകൊണ്ടുപോയ പ്രവൃത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָעֲלִיָּה
  choice: മുകളിലത്തെ മുറി
  rationale: עֲלִיָּה വീടിന്റെ മുകളിലെ മുറിയെയോ മേൽമുറിയെയോ സൂചിപ്പിക്കുന്നു. ‘മുകളിലത്തെ മുറി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗമാണ്.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: താൻ താമസിച്ചിരുന്ന
  rationale: ഇവിടെ ישב ഇരിക്കുക എന്നതിലുപരി പാർക്കുക/താമസിക്കുക എന്നാണ്; ‘താൻ’ എന്നത് കർത്താവായ ഏലിയാവിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: കിടത്തി
  rationale: שׁכב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കിടക്കാൻ ഇടയാക്കുക’ എന്നാണ്; ‘കിടത്തി’ അതിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: עַל מִטָּתוֹ
  choice: തന്റെ കിടക്കയിൽ
  rationale: പ്രത്യയം ചുറ്റുമുള്ള ക്രിയകളുടെ കർത്താവായ ഏലിയാവിനെ സൂചിപ്പിക്കുന്നു; ‘തന്റെ’ എന്നത് ഈ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
