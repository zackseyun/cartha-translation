id: 1KI.17.1
reference: 1 Kings 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: ml
  text: 'ഗിലെയാദിലെ താമസക്കാരിൽനിന്നുള്ള തിശ്ബ്യനായ ഏലിയാവ്[a] ആഹാബിനോടു പറഞ്ഞു: “ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ, ആ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ—എന്റെ വാക്കുപ്രകാരമല്ലാതെ[c] ഈ വർഷങ്ങളിൽ മഞ്ഞോ മഴയോ ഉണ്ടാകുകയില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഗിലെയാദിലെ താമസക്കാരിൽ ഒരാളായ തിശ്ബ്യനായ ഏലിയാവ്.” എബ്രായപ്രയോഗം അവിടത്തെ താമസക്കാരെയോ കുടിയേറ്റക്കാരെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ശപഥപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഉണ്ടാകുമെങ്കിൽ…” എന്നാണ്; സന്ദർഭത്തിൽ അതിന്റെ അർഥം “ഉണ്ടാകുകയില്ല” എന്നതാണ്.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: “എന്റെ വാക്കിനനുസരിച്ചല്ലാതെ”; “എന്റെ വാക്കിൽ അല്ലാതെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ
  rationale: തിശ്ബെയുമായുള്ള ഉത്ഭവബന്ധം സൂചിപ്പിക്കുന്ന നാമവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: ഗിലെയാദിലെ താമസക്കാരിൽ ഒരാളായ
  rationale: תּוֹשָׁב എന്ന പദത്തിലെ താമസക്കാരൻ/കുടിയേറ്റക്കാരൻ എന്ന സൂക്ഷ്മത നിലനിർത്തുകയും, കേവലം ‘ഗിലെയാദുകാരൻ’ എന്നു ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിക്കുന്നതാണേ
  rationale: ഇത് ശപഥസൂത്രമാണെന്നത് മലയാളത്തിലെ ഉറപ്പുപ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമം പദവിയായി മാറ്റാതെ പേരായി പകർത്തുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഉടമ്പടിപരമായ പ്രാധാന്യമുള്ള സമാസബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ഞാൻ സന്നിധിയിൽ നിൽക്കുന്നവനായ
  rationale: ദൈവസന്നിധിയിലെ നില്പും അതിലടങ്ങിയ സേവനസൂചനയും സംരക്ഷിക്കുന്നു; ‘ഞാൻ സേവിക്കുന്ന’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אִם יִהְיֶה
  choice: ഉണ്ടാകുകയില്ല
  rationale: ശപഥസന്ദർഭത്തിൽ אִם ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നിഷേധം തുറന്നുപറയുന്നു.
- source_word: טַל וּמָטָר
  choice: മഞ്ഞോ മഴയോ
  rationale: ടַל എന്നത് രാത്രിയിൽ രൂപപ്പെടുന്ന മഞ്ഞ്/തുഷാരം എന്ന അർഥത്തിൽ, മഴയിൽനിന്നു വേർതിരിച്ച് നൽകുന്നു.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: ഈ വർഷങ്ങളിൽ
  rationale: ദീർഘകാല വരൾച്ചയെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כִּי אִם
  choice: അല്ലാതെ
  rationale: പ്രസ്താവനയിലെ ഏക അപവാദം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְפִי דְבָרִי
  choice: എന്റെ വാക്കുപ്രകാരം
  rationale: അക്ഷരാർഥമായ ‘എന്റെ വാക്കിന്റെ വായനുസരിച്ച്’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കി, പ്രവാചകവചനത്തോടനുബന്ധിച്ച നിബന്ധന നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: לְפִי דְבָרִי എന്നതിലെ പ്രവാചകാധികാരം
  choice: എന്റെ വാക്കുപ്രകാരമല്ലാതെ
  alternative: എന്റെ വാക്കിനാലല്ലാതെ / എന്റെ വാക്കുകേട്ടല്ലാതെ
  rationale: മഴയും മഞ്ഞും ഏലിയാവിന്റെ വചനത്തോടനുബന്ധിച്ചേ ഉണ്ടാകൂ എന്ന മൂലപാഠത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; അത് സ്വതന്ത്രമായ മാനുഷിക ശക്തിയാണെന്ന് വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- issue: אֲשֶׁר עָמַדְתִּי לְפָנָיו എന്ന പ്രയോഗം
  choice: ഞാൻ സന്നിധിയിൽ നിൽക്കുന്നവനായ
  alternative: ഞാൻ സേവിക്കുന്ന
  rationale: സന്നിധിയും സേവനവും തമ്മിലുള്ള അർഥവിസ്താരം ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ എബ്രായ ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ശപഥത്തിന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും എബ്രായത്തിലെ സന്നിധി-നില്പ് പ്രയോഗവും സ്ഥലപരമായ തിരിച്ചറിയലിലെ സൂക്ഷ്മതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
