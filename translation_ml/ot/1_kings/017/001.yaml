revisions:
- from: 'ഗിലെയാദിലെ താമസക്കാരിൽ ഒരാളായ തിശ്ബ്യനായ ഏലിയാവ്[a] ആഹാബിനോടു പറഞ്ഞു: “ഞാൻ സന്നിധിയിൽ നിൽക്കുന്നവനായ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിക്കുന്നതാണേ—എന്റെ വാക്കുപ്രകാരമല്ലാതെ[c] ഈ വർഷങ്ങളിൽ മഞ്ഞോ മഴയോ ഉണ്ടാകുകയില്ല.[b]”'
  to: 'ഗിലെയാദിലെ താമസക്കാരിൽനിന്നുള്ള തിശ്ബ്യനായ ഏലിയാവ്[a] ആഹാബിനോടു പറഞ്ഞു: “ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ, ആ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ—എന്റെ വാക്കുപ്രകാരമല്ലാതെ[c] ഈ വർഷങ്ങളിൽ മഞ്ഞോ മഴയോ ഉണ്ടാകുകയില്ല.[b]”'
  rationale: ബന്ധവാക്യത്തിന്റെ കർത്താവും ദൈവസന്നിധിയുമായുള്ള ബന്ധവും വ്യക്തമായി പ്രകടിപ്പിക്കാൻ വാക്യക്രമം പരിഷ്കരിച്ചു. ഗിലെയാദുമായുള്ള ബന്ധം ‘താമസക്കാരിൽനിന്നുള്ള’ എന്നു നൽകി, എബ്രായത്തിലെ താമസക്കാരൻ/കുടിയേറ്റക്കാരൻ എന്ന സൂക്ഷ്മതയും מִן എന്ന ബന്ധവും സംരക്ഷിച്ചു. അർഥത്തിലും ശപഥത്തിന്റെ ശക്തിയിലും മാറ്റമില്ല; അടിക്കുറിപ്പ് അടയാളങ്ങൾ എല്ലാം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
