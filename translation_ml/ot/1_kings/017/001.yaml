  revised_text: 'ഗിലെയാദിലെ താമസക്കാരിൽനിന്നുള്ള തിശ്ബ്യനായ ഏലിയാവ്[a] ആഹാബിനോടു പറഞ്ഞു: “ഞാൻ ആരുടെ സന്നിധിയിൽ നിൽക്കുന്നുവോ, ആ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ—എന്റെ വാക്കുപ്രകാരമല്ലാതെ[c] ഈ വർഷങ്ങളിൽ മഞ്ഞോ മഴയോ ഉണ്ടാകുകയില്ല.[b]”'
