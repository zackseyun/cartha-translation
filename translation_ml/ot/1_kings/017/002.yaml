id: 1KI.17.2
reference: 1 Kings 17:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ[a] വചനം അവന്റെ അടുക്കൽ വന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: YHWH (יהוה). ഇവിടെ അത് ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; ഇംഗ്ലീഷ് പരമ്പരാഗത പരിഭാഷകളിൽ സാധാരണ ‘the LORD’ എന്നാണ് നൽകിയിരിക്കുന്നത്.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരംവായനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ ... അരുളപ്പെട്ടു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה കഥയിലെ അടുത്ത സംഭവവികാസത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ ആ ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘അരുളപ്പെട്ടു’ എന്ന ക്രിയയോടൊപ്പം വാക്യഘടനയും സുലഭമാകുന്നു.
- source_word: דְבַר
  choice: വചനം
  rationale: ദൈവനാമത്തോടു ചേർന്ന ഈ പദം പ്രവാചകവെളിപ്പാടിന്റെ സ്ഥിരപ്രയോഗമാണ്. ‘വചനം’ അതിന്റെ ഔപചാരികവും വെളിപ്പാടുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസൂചനയോടെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֵלָיו
  choice: അവന്
  rationale: אֶל എന്ന പൂർവപ്രത്യയവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ചേർന്ന് വചനം ആരിലേക്കാണ് വന്നതെന്ന് സൂചിപ്പിക്കുന്നു. ‘അവന്’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക ദാതൃരൂപമാണ്.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഈ അനന്തക്രിയാരൂപം നേരിട്ടുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘എന്നു പറഞ്ഞുകൊണ്ട്’ എന്ന യാന്ത്രിക രൂപത്തേക്കാൾ ദ്വിബിന്ദു അതേ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വേ’ എന്ന ലിപ്യന്തരണം അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ സംരക്ഷിക്കുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ സാധ്യതയുള്ള എബ്രായ ഉച്ചാരണത്തെ ഇത് അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകവചനശൈലി. ‘അരുളപ്പെട്ടു’ എന്ന ആദരസൂചക നിഷ്ക്രിയപ്രയോഗം ദൈവിക വെളിപ്പാടിന്റെ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തിന് ദ്വിബിന്ദു ഉപയോഗിച്ചിരിക്കുന്നു.
