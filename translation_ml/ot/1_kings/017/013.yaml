base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: ml
  text: 'ഏലിയാവ് അവളോടു പറഞ്ഞു: “ഭയപ്പെടേണ്ടാ. പോയി[a] നീ പറഞ്ഞതുപോലെ ചെയ്യുക. എന്നാൽ ആദ്യം അവിടെനിന്ന് എനിക്കായി ഒരു ചെറിയ അപ്പം[b] ഉണ്ടാക്കി, അത് പുറത്തുകൊണ്ടുവന്ന് എനിക്കു തരുക. അതിനുശേഷം നിനക്കും നിന്റെ മകനുംവേണ്ടി ഉണ്ടാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വരിക; നീ പറഞ്ഞതുപോലെ ചെയ്യുക.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “വരിക” എന്നാണ്; എന്നാൽ ഇവിടെ പ്രവർത്തിക്കാൻ മുന്നോട്ടുപോകാനുള്ള പ്രേരണയായും അതിനെ മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: עֻגָה എന്ന എബ്രായപദം ചെറിയ ചുട്ട അപ്പത്തെയോ കേക്ക് പോലുള്ള ഭക്ഷണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധത്തോടുകൂടിയ ירא ഭയപ്പെടരുതെന്ന വിലക്കാണ് സൂചിപ്പിക്കുന്നത്. ‘ഭയപ്പെടേണ്ടാ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആശ്വാസം നൽകുന്ന നേരിട്ടുള്ള പ്രയോഗവുമാണ്.
- source_word: בֹּאִי
  choice: പോയി
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘വരിക’ എന്നാണെങ്കിലും, തുടർന്നുള്ള ആജ്ഞകൾ നടപ്പാക്കാൻ മുന്നോട്ടുപോകാനുള്ള പ്രേരണയായി ഇവിടെ ഉപയോഗിക്കുന്നു. ഭക്ഷണം തയ്യാറാക്കാൻ അവൾ പോകുന്ന സന്ദർഭത്തിൽ ‘പോയി’ സ്വാഭാവികമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: നീ പറഞ്ഞതുപോലെ ചെയ്യുക
  rationale: അവൾ മുമ്പ് പറഞ്ഞ പദ്ധതിക്കനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുമ്പുള്ള നിർദേശത്തിന് ഒരു വ്യവസ്ഥയോ ഭേദഗതിയോ ചേർക്കുന്ന വിരുദ്ധസംബന്ധം മാന്യവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: എബ്രായത്തിലെ സ്ഥാനസൂചകപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ലഭ്യമായ മാവിനെയും എണ്ണയെയും സൂചിപ്പിക്കുന്നു.
- source_word: עֻגָה קְטַנָּה
  choice: ഒരു ചെറിയ അപ്പം
  rationale: עֻגָה ചുട്ടുണ്ടാക്കുന്ന ചെറിയ അപ്പത്തെയോ കേക്ക് പോലുള്ള ഭക്ഷണത്തെയോ സൂചിപ്പിക്കാം. ആധുനിക മധുരകേക്കെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് പൊതുവായ അർഥം നൽകാൻ ‘അപ്പം’ തെരഞ്ഞെടുത്തു.
- source_word: בָרִאשֹׁנָה
  choice: ആദ്യം
  rationale: ഏലിയാവിനുള്ള പങ്ക് അവൾക്കും മകനുമുള്ളതിനുമുമ്പ് തയ്യാറാക്കണമെന്ന സമയക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְהוֹצֵאתְ לִי
  choice: അത് പുറത്തുകൊണ്ടുവന്ന് എനിക്കു തരുക
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്ന ഭാവം ‘പുറത്തുകൊണ്ടുവന്ന്’ നിലനിർത്തുന്നു; ലക്ഷ്യസ്വീകർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എനിക്കു തരുക’ ഉപയോഗിച്ചു.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: നിനക്കും നിന്റെ മകനുംവേണ്ടി ഉണ്ടാക്കുക
  rationale: മുമ്പ് പറഞ്ഞ അപ്പം എന്ന കർമം ഇവിടെ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു; അത് അനാവശ്യമായി ആവർത്തിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം പിന്തുടരുന്നു.
- source_word: בָּאַחֲרֹנָה
  choice: അതിനു ശേഷം
  rationale: വിശാലമായ അർഥത്തിൽ ‘അവസാനം’ എന്നതിനെക്കാൾ, ഇവിടെ ഉദ്ദേശിക്കുന്ന തുടർക്രമം കൃത്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഏലിയാവിന് ആദ്യം ഭക്ഷണം നൽകണമെന്ന കല്പന സൃഷ്ടിക്കുന്ന ധാർമികവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം
  choice: ‘ആദ്യം’, ‘അതിനു ശേഷം’ എന്നീ സമയക്രമസൂചനകൾ മൃദൂകരിക്കാതെ വ്യക്തമായി പരിഭാഷപ്പെടുത്തി
  alternative: ഏലിയാവിന്റെ അഭ്യർഥനയുടെ ശക്തി കുറയ്ക്കുന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം
  rationale: എബ്രായപാഠം ഏലിയാവിനുള്ള ചെറിയ അപ്പം ആദ്യം ഉണ്ടാക്കണമെന്നും വിധവയ്ക്കും മകനുമുള്ളത് അതിനു ശേഷം ഉണ്ടാക്കണമെന്നും തുറന്നുപറയുന്നു. പാഠത്തിലെ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തിയപ്പോൾ പുരാതന ഭക്ഷണപദത്തെ ആധുനിക മധുരകേക്കായി അമിതമായി നിർവചിക്കുന്നത് ഒഴിവാക്കി. സ്ത്രീലിംഗ ഏകവചന ആജ്ഞാരൂപങ്ങൾക്ക് മലയാളത്തിൽ പ്രത്യേക ലിംഗചിഹ്നമില്ലാത്തതിനാൽ സ്വാഭാവിക ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു.
