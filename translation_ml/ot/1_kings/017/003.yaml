  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: ml
  text: ഇവിടെനിന്ന് പുറപ്പെട്ട് കിഴക്കോട്ടു തിരിയുക. യോർദ്ദാന്റെ കിഴക്കുവശത്തുള്ള[a] കെരീത്ത് നീർച്ചാലിനരികിൽ[b] ഒളിച്ചിരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “യോർദ്ദാന്റെ മുമ്പിലുള്ളത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന് “യോർദ്ദാന് അഭിമുഖമായുള്ളത്” അല്ലെങ്കിൽ “യോർദ്ദാന്റെ എതിർവശത്തുള്ളത്” എന്നും അർഥമാകാം. കിഴക്കോട്ടു പോകണമെന്ന മുൻകല്പനയുടെ അടിസ്ഥാനത്തിലാണ് മുഖ്യവാചകത്തിൽ “കിഴക്കുവശത്തുള്ള” എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “നീർച്ചാൽ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു പദം വെള്ളം കാലികമായി മാത്രം ഒഴുകുന്ന വാദിയെയോ തോട്ടെയോ അതിന്റെ താഴ്വരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: ഇവിടെനിന്ന് പുറപ്പെടുക
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും מן + זה എന്ന പ്രയോഗവും ചേർന്ന് ഇപ്പോഴുള്ള സ്ഥലത്തുനിന്ന് പോകാനുള്ള നേരിട്ടുള്ള കല്പന നൽകുന്നു. ‘ഇവിടെനിന്ന് പുറപ്പെടുക’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: കിഴക്കോട്ടു തിരിയുക
  rationale: פנהയും ദിശാസൂചകമായ קֵדְמָהയും കിഴക്കോട്ടുള്ള ദിശാമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്. לְךָ ഇവിടെ ഒരു സ്വാഭാവിക ഹീബ്രു പ്രയോഗമാണ്; മലയാളത്തിൽ ‘സ്വയം തിരിയുക’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമായതിനാൽ ക്രിയയുടെ അർഥത്തിൽ തന്നെയാണ് അത് ഉൾക്കൊള്ളിച്ചിരിക്കുന്നത്.
- source_word: וְנִסְתַּרְתָּ
  choice: ഒളിച്ചിരിക്കുക
  rationale: סתר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ സ്വയം മറഞ്ഞിരിക്കുകയെന്ന സന്ദർഭാർഥം നൽകുന്നു. ‘ഒളിച്ചിരിക്കുക’ കല്പനയുടെ പ്രവർത്തിയും തുടർന്നുള്ള അവസ്ഥയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנַחַל
  choice: നീർച്ചാലിനരികിൽ
  rationale: נחל എന്നത് തോട്, നീർച്ചാൽ, കാലികമായി വെള്ളമൊഴുകുന്ന വാദി, അല്ലെങ്കിൽ അതിന്റെ താഴ്വര എന്നിവയെ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ വെള്ളം ലഭിക്കുന്ന സ്ഥലമെന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് ‘നീർച്ചാൽ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്; בְ എന്ന സ്ഥലസൂചകത്തിന് ‘അരികിൽ’ സ്വാഭാവികമാണ്.
- source_word: כְּרִית
  choice: കെരീത്ത്
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ആദ്യ വ്യഞ്ജനത്തെ ‘ക’ എന്നും സ്വരത്തെ ചുരുങ്ങിയ ‘എ’ എന്നും പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֲשֶׁר עַל־פְּנֵי הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ കിഴക്കുവശത്തുള്ള
  rationale: עַל־פְּנֵי എന്ന ഭൂമിശാസ്ത്രപ്രയോഗത്തിന് ‘മുമ്പിൽ’, ‘അഭിമുഖമായി’, ‘എതിർവശത്ത്’ തുടങ്ങിയ അർഥസാധ്യതകളുണ്ട്. കിഴക്കോട്ടു പോകാനുള്ള മുൻകല്പനയുടെ വെളിച്ചത്തിൽ ഇവിടെ യോർദ്ദാന്റെ കിഴക്കുവശം എന്നതാണ് സാധ്യതയേറിയ സ്ഥാനസൂചന; യഥാർഥ പദപ്രയോഗത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
