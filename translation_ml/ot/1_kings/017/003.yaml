translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി. സ്ഥലനാമം ‘കെരീത്ത്’ എന്നു ലിപ്യന്തരിച്ചു; അപരിചിതമായ ‘വാദി’ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അതിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
