reference: 1 Kings 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: ml
  text: കാക്കകൾ അവന് രാവിലെ അപ്പവും മാംസവും, വൈകുന്നേരം അപ്പവും മാംസവും കൊണ്ടുവന്നിരുന്നു. അവൻ തോട്ടിൽനിന്ന്[a] കുടിക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീരൊഴുക്കിൽനിന്ന്’ അല്ലെങ്കിൽ ‘കാലാവസ്ഥാനുസൃത നീരൊഴുക്കിൽനിന്ന്’; എബ്രായപദമായ נַחַל ഒരു തോടിനെയോ കാലാവസ്ഥാനുസൃതമായി ഒഴുകുന്ന നീരൊഴുക്കിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: കാക്കകൾ
  rationale: עֹרְבִים എന്നത് സാധാരണയായി കാക്കവർഗത്തിലെ പക്ഷികളായ ravens-നെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം ‘കാക്കകൾ’ ആണ്.
- source_word: מְבִיאִים לוֹ
  choice: അവന് ... കൊണ്ടുവന്നിരുന്നു
  rationale: പങ്കുപദരൂപം സന്ദർഭത്തിൽ ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കൊണ്ടുവന്നിരുന്നു’ അതിന്റെ തുടർച്ചിത/പതിവായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לֶחֶם
  choice: അപ്പം
  rationale: മൂലത്തിലെ മൂർത്തമായ ‘bread’ എന്ന അർഥം പൊതുവായ ‘ഭക്ഷണം’ എന്നു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּבָשָׂר
  choice: മാംസവും
  rationale: ഇവിടെ בָּשָׂר ഭക്ഷിക്കാവുന്ന മാംസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം ‘മാംസം’ ആണ്.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: രാവിലെയും ... വൈകുന്നേരവും
  rationale: പ്രഭാതവും സായാഹ്നവും എന്ന കാലസൂചനകളും മൂലത്തിലെ സമാന്തരഘടനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּמִן הַנַּחַל
  choice: തോട്ടിൽനിന്ന്
  rationale: נַחַל ഒരു നീരൊഴുക്ക്, തോട്, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി ഒഴുകുന്ന ജലപാതയെ സൂചിപ്പിക്കാം. സാധാരണ മലയാളത്തിൽ ‘തോട്’ സ്വാഭാവികമാണ്; അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יִשְׁתֶּה
  choice: കുടിക്കുമായിരുന്നു
  rationale: അപൂർണ്ണക്രിയാരൂപം ഈ ആഖ്യാനസന്ദർഭത്തിൽ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: עֹרְבִים മുഖേന ഏലിയാവിന് ലഭിച്ച ആഹാരത്തിന്റെ സ്വഭാവം
  choice: പക്ഷികളായ കാക്കകൾ
  alternative: അറബികൾ, വ്യാപാരികൾ, അല്ലെങ്കിൽ മറ്റു മനുഷ്യർ
  rationale: עֹרְבִים എന്ന പദത്തിന്റെ നേരിട്ടുള്ള സാധാരണ അർഥം കാക്കവർഗത്തിലെ പക്ഷികളാണ്. അത്ഭുതഘടകത്തെ ഒഴിവാക്കാനായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതായി മാറ്റാൻ അടുത്ത സന്ദർഭത്തിൽ നിർബന്ധകാരണങ്ങളില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ രാവിലെയും വൈകുന്നേരവും ഉള്ള ആവർത്തനം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വിവക്ഷിക്കുന്ന പദമായ ‘തോട്ടിൽനിന്ന്’ എന്നതിനോടു ചേർത്തിരിക്കുന്നു.
