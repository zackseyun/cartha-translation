  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “അങ്ങയുടെ ദൈവമായ യഹ്‌വെ ജീവിക്കുന്നതാണേ, എന്റെ പക്കൽ ഒരു ചെറിയ അപ്പംപോലും ഇല്ല[a]. ഭരണിയിൽ ഒരു പിടി മാവും എണ്ണക്കുപ്പിയിൽ അല്പം എണ്ണയും മാത്രമേയുള്ളൂ. ഇതാ, ഞാൻ രണ്ടു വിറകുകൊള്ളികൾ പെറുക്കുകയാണ്. ഞാൻ അകത്തുചെന്ന് അതുകൊണ്ട് എനിക്കും എന്റെ മകനും വേണ്ടി ഭക്ഷണം ഉണ്ടാക്കും; ഞങ്ങൾ അതു തിന്നിട്ട് മരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു അപ്പമോ ചുട്ട അപ്പമോ ഇല്ല.” എബ്രായപദമായ מָעוֹג ഒരു ചെറിയ അപ്പത്തെയോ വട്ടത്തിലുള്ള അപ്പത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: അങ്ങയുടെ ദൈവമായ യഹ്‌വെ ജീവിക്കുന്നതാണേ
  rationale: ജീവനുള്ള യഹ്‌വെയെ സാക്ഷിയാക്കിയുള്ള ഗൗരവമുള്ള ശപഥസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: എന്റെ പക്കൽ ഒരു അപ്പക്കഷണംപോലും ഇല്ല
  rationale: ശപഥസന്ദർഭത്തിലെ אִם ശക്തമായ നിഷേധമാണ്. מָעוֹג പൊതുവായ ധാന്യമല്ല, തയ്യാറാക്കിയ ചെറിയ വട്ട അപ്പം/അപ്പക്കഷണം സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ സ്വാഭാവികതയും കുറിപ്പിൽ കൃത്യതയും നൽകി.
- source_word: מְלֹא כַף קֶמַח
  choice: ഒരു പിടി മാവ്
  rationale: ‘കൈപ്പത്തി നിറയെ’ എന്ന അക്ഷരാർഥത്തിന്റെ സ്വാഭാവിക മലയാള സമാനപദം; ശേഷിച്ചിരിക്കുന്ന ചെറിയ അളവ് വ്യക്തമാക്കുന്നു.
- source_word: כַּד
  choice: ഭരണി
  rationale: മാവ് സൂക്ഷിക്കുന്ന വീട്ടുപയോഗ പാത്രത്തിന് യോജിച്ച പൊതുവായ മലയാളപദം.
- source_word: צַפַּחַת
  choice: കുപ്പി
  rationale: എണ്ണ സൂക്ഷിക്കുന്ന ചെറിയ പാത്രത്തെ സൂചിപ്പിക്കുകയും മാവിന്റെ ഭരണിയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: ഇതാ, ഞാൻ ... പെറുക്കുകയാണ്
  rationale: הִנְנִי നൽകുന്ന തത്സമയ ശ്രദ്ധയും participle സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവൃത്തിയും സംരക്ഷിക്കുന്നു.
- source_word: שְׁנַיִם עֵצִים
  choice: രണ്ടു വിറകുകൊള്ളികൾ
  rationale: അടുപ്പിനായി പെറുക്കുന്ന ചെറു മരക്കഷണങ്ങളാണ് ഉദ്ദേശ്യം; ‘രണ്ട് വിറകുകൊള്ളികൾ’ ദാരിദ്ര്യത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: וַעֲשִׂיתִיהוּ
  choice: അതുകൊണ്ട് ... ഭക്ഷണം ഉണ്ടാക്കും
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയം മുൻപുള്ള മാവ്/അപ്പസാധനംകൊണ്ടുള്ള തയ്യാറാക്കലിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അസ്വാഭാവികമായ ലിംഗാന്വയം ഒഴിവാക്കി സന്ദർഭാർഥം വ്യക്തമാക്കി.
theological_decisions:
- issue: സീദോന്യ വിധവയുടെ ശപഥത്തിൽ വരുന്ന יהוה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായ പാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു പദവി പകരംവയ്ക്കാതെ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുന്നത് ഉറവിടരൂപം സംരക്ഷിക്കുന്നു.
- issue: “ഞങ്ങൾ തിന്നിട്ട് മരിക്കും” എന്ന അന്തിമ പ്രസ്താവനയുടെ ഭാവം
  choice: നിശ്ചിത പ്രതീക്ഷയായി നേരിട്ട് നിലനിർത്തി
  alternative: ‘പിന്നെ മരിക്കേണ്ടിവരും’ എന്ന സാധ്യതാഭാവം
  rationale: וָמָתְנוּ എന്ന പാഠത്തിന്റെ നേരിട്ടുള്ള, ദാരുണമായ തുടർച്ച മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. വിധവയുടെ ക്ഷാമവും നിരാശയും പ്രകടമാക്കാൻ ചെറുവാക്യങ്ങളും ദൈനംദിന വീട്ടുപയോഗപദങ്ങളും ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹ്‌വെ’ എന്ന് ലിപ്യന്തരിച്ചു.
