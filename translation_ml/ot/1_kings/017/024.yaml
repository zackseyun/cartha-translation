  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: ml
  text: 'അപ്പോൾ ആ സ്ത്രീ ഏലിയാവിനോടു പറഞ്ഞു: “ഇപ്പോൾ എനിക്ക് അറിയാം: അങ്ങ് ദൈവപുരുഷനാണെന്നും അങ്ങയുടെ വായിലെ യഹ്‌വെയുടെ വചനം സത്യമാണെന്നും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അങ്ങയുടെ വായിലെ യഹ്‌വെയുടെ വചനം വിശ്വസനീയമാണെന്നും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രൂ പദത്തിന് സത്യം, സത്യത, വിശ്വസനീയത എന്നീ അർഥഛായകളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֶל אֵלִיָּהוּ
  choice: അപ്പോൾ ആ സ്ത്രീ ഏലിയാവിനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമായ ക്രമസൂചന നൽകുന്നു. ഇവിടെ മുൻപ് പരിചയപ്പെടുത്തിയ വിധവയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഹീബ്രൂവിലെ ‘സ്ത്രീ’ എന്ന പദം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: ഇപ്പോൾ ഞാൻ അറിഞ്ഞിരിക്കുന്നു
  rationale: സംഭവത്തിന്റെ ഫലമായി ഇപ്പോൾ കൈവന്ന ഉറച്ച ബോധ്യമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഫലാവസ്ഥയും വർത്തമാനബോധ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אִישׁ אֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: ദൈവത്തിന്റേതായ പ്രവാചകനെയോ ദൈവത്തിന്റെ പ്രതിനിധിയെയോ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപം.
- source_word: וּדְבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനം
  rationale: דָּבָר എന്നതിന്റെ ‘വചനം’ എന്ന അർഥം പ്രവാചകസന്ദേശത്തിന്റെ പരമ്പരാഗതവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു; ദൈവനാമം יְהוָה ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּפִיךָ
  choice: അങ്ങയുടെ വായിലുള്ള
  rationale: പ്രവാചകൻ ഉച്ചരിക്കുന്ന വചനത്തെ ചിത്രീകരിക്കുന്ന ഹീബ്രൂ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തി.
- source_word: אֱמֶת
  choice: സത്യം തന്നെയാണ്
  rationale: ഹീബ്രൂവിലെ നാമരൂപവും പ്രസ്താവനയുടെ ഊന്നലും നിലനിർത്തുന്നു; പദത്തിന് സത്യത, വിശ്വസ്തത, ആശ്രയയോഗ്യത എന്നീ അർഥഛായകൾ ഉണ്ടെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: אֱמֶת എന്ന പദത്തിലെ സത്യവും വിശ്വസനീയതയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: സത്യം തന്നെയാണ്
  alternative: സത്യമാണ്; വിശ്വസനീയമാണ്
  rationale: പ്രസ്താവനയുടെ ശക്തിയും ഹീബ്രൂ നാമരൂപവും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; സന്ദേശത്തിന്റെ ആശ്രയയോഗ്യത എന്ന യഥാർഥ അർഥഛായ അടിക്കുറിപ്പിലൂടെ തുറന്നുവച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. പ്രവാചകനോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ സ്വീകരിച്ചു. ഹീബ്രൂവിലെ വാക്യക്രമം അതേപടി അനുകരിക്കാതെ, ‘ഇപ്പോൾ ഞാൻ അറിഞ്ഞിരിക്കുന്നു’ എന്ന ഭാഗം അവസാനത്ത് വെച്ച് സ്വാഭാവിക മലയാളവാക്യഘടന പാലിച്ചു.
