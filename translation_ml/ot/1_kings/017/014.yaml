source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “യഹ്‌വെ ഭൂമുഖത്ത്[c] മഴ നൽകുന്ന ദിവസംവരെ മാവിന്റെ ഭരണിയിലെ മാവ് തീർന്നുപോകുകയില്ല[a]; എണ്ണക്കുടുവിയിലെ എണ്ണ കുറഞ്ഞുപോകുകയുമില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തീർന്നുപോകുകയില്ല” എന്നതിന് “ഒഴിഞ്ഞുപോകുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “കുറഞ്ഞുപോകുകയില്ല” എന്നതിന് സന്ദർഭാനുസൃതമായി “വറ്റിപ്പോകുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “നിലത്തിന്റെ മുഖത്തിന്മേൽ.”'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כַּד הַקֶּמַח
  choice: മാവിന്റെ ഭരണി
  rationale: כַּד ഒരു വീട്ടുപയോഗ സംഭരണപാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മാവ് സൂക്ഷിക്കുന്ന പാത്രത്തിന് ‘ഭരണി’ സ്വാഭാവികമാണ്.
- source_word: לֹא תִכְלָה
  choice: തീർന്നുപോകുകയില്ല
  rationale: כלה ഇവിടെ സംഭരിച്ച വസ്തു പൂർണമായി ചെലവായി അവസാനിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: എണ്ണക്കുടുവി
  rationale: צַפַּחַת എണ്ണ വയ്ക്കുന്ന താരതമ്യേന ചെറിയ പാത്രമാണ്; ‘കുടുവി’ അതിനെ ഭരണിയിൽനിന്ന് വേർതിരിക്കുകയും സന്ദർഭത്തിന് ചേരുകയും ചെയ്യുന്നു.
- source_word: לֹא תֶחְסָר
  choice: കുറഞ്ഞുപോകുകയില്ല
  rationale: חסר എന്ന ക്രിയയുടെ ‘കുറയുക, ഇല്ലാതാകുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വറ്റുകയില്ല’ എന്ന ദ്രാവകസംബന്ധമായ വ്യാഖ്യാനത്തേക്കാൾ ഉറവിടത്തിന്റെ രൂപത്തോട് അടുത്തതാണ്.
- source_word: עַד יוֹם
  choice: ദിവസംവരെ
  rationale: ഹീബ്രുവിലെ കാലപരിധി സൂചിപ്പിക്കുന്ന പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: യഹ്‌വെ മഴ നൽകുന്ന
  rationale: נתן എന്ന ‘നൽകുക’ എന്ന ക്രിയയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ‘അയയ്ക്കുക’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്ത്
  rationale: ‘നിലത്തിന്റെ/ഭൂമിയുടെ മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരം ചെയ്യുന്നു; പ്രത്യേക പരമ്പരാഗത ഉച്ചാരണത്തെ നിർബന്ധിക്കാതിരിക്കാൻ ‘യഹ്‌വെ’ സ്വീകരിക്കുന്നു.
- issue: മാവും എണ്ണയും നിലനിൽക്കുമെന്ന വാഗ്ദാനത്തിന്റെ സ്വഭാവം
  choice: പാത്രങ്ങളിലെ സാധനങ്ങൾ തീരുകയോ കുറയുകയോ ചെയ്യില്ലെന്ന ഉറവിടഭാഷയിലെ പ്രസ്താവന അതേപടി നിലനിർത്തുന്നു
  alternative: പാത്രങ്ങൾ അത്ഭുതകരമായി എപ്പോഴും നിറഞ്ഞിരിക്കും
  rationale: ഹീബ്രു പാഠം ക്ഷാമം സംഭവിക്കില്ലെന്നാണ് പറയുന്നത്; പാത്രങ്ങൾ ഓരോ നിമിഷവും നിറഞ്ഞിരിക്കുമെന്ന പ്രവർത്തനരീതി അത് വിശദീകരിക്കുന്നില്ല. അതിനാൽ അതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പ്രവാചകസൂത്രവാക്യത്തിന് ‘ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു. പാത്രങ്ങളെ വേർതിരിക്കാൻ ‘ഭരണി’, ‘കുടുവി’ എന്നീ സ്വാഭാവിക ഗൃഹോപയോഗപദങ്ങൾ സ്വീകരിച്ചു; ഉറവിടത്തിലെ ആവർത്തനവും കാലപരിധിയും നിലനിർത്തി.
