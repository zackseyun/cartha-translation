source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: ml
  text: 'പിന്നെ ഏലിയാവ് ബാലനെ എടുത്ത് മുകളിലെ മുറിയിൽനിന്ന് താഴെ വീടിനകത്തേക്കു കൊണ്ടുവന്ന് അവന്റെ അമ്മയ്ക്കു കൊടുത്തു. ഏലിയാവ് പറഞ്ഞു: “നോക്കൂ, നിന്റെ മകൻ ജീവനോടെയിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ മകൻ ജീവിച്ചിരിക്കുന്നു.”
    reason: חַי എന്ന പദപ്രയോഗം മലയാളത്തിൽ ‘ജീവനോടെയിരിക്കുന്നു’ എന്നും ‘ജീവിച്ചിരിക്കുന്നു’ എന്നും സ്വാഭാവികമായി നൽകാം; രണ്ടാമത്തേത് അവസ്ഥയ്ക്കൊപ്പം ക്രിയാത്മകമായ ഭാവവും നൽകുന്നു.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്ത്
  rationale: לקח എന്ന സാധാരണ ആഖ്യാനക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; എടുത്തുയർത്തിയോ കൈയിൽ വഹിച്ചോയെന്ന രീതി അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: הַיֶּלֶד
  choice: ബാലനെ
  rationale: יֶלֶד എന്നത് കുട്ടിയെയോ ആൺകുട്ടിയെയോ സൂചിപ്പിക്കാം. അമ്മ–മകൻ പശ്ചാത്തലത്തിൽ ‘ബാലൻ’ പ്രായം കൃത്യമായി നിശ്ചയിക്കാതെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: וַיֹּרִדֵהוּ
  choice: താഴെ കൊണ്ടുവന്ന്
  rationale: ירד-ന്റെ കാരക രൂപത്തിലുള്ള ‘താഴേക്കു കൊണ്ടുവരുക’ എന്ന ചലനം വ്യക്തമാക്കുന്നു; എടുത്തുകൊണ്ടുവന്ന രീതി അനുമാനിക്കുന്നില്ല.
- source_word: הָעֲלִיָּה
  choice: മുകളിലെ മുറി
  rationale: עֲלִיָּה വീടിന്റെ മുകളിലുള്ള മുറിയെയോ മേൽമുറിയെയോ സൂചിപ്പിക്കുന്നു. ‘മുകളിലെ മുറി’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַבַּיְתָה
  choice: വീട്ടിലേക്കു
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം വീട്ടിലേക്കോ വീട്ടിനകത്തേക്കോ ഉള്ള ചലനം കാണിക്കുന്നു. മുകളിലെ മുറിയുമായുള്ള ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘വീട്ടിലേക്കു’ അത് നിലനിർത്തുന്നു.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: അവന്റെ അമ്മയ്ക്കു കൊടുത്തു
  rationale: נתן + പരോക്ഷ കർമം എന്ന ഘടനയുടെ നേരിട്ടുള്ള വിവർത്തനം. സന്ദർഭത്തിൽ തിരികെ ഏൽപ്പിക്കലാണെങ്കിലും ‘തിരികെ’ എന്നത് മൂലപാഠത്തിൽ തുറന്നുപറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: רְאִי
  choice: നോക്കൂ
  rationale: അമ്മയോടു പറയുന്ന സ്ത്രീലിംഗ ഏകവചന ആജ്ഞയാണ്. മലയാളത്തിൽ ലിംഗഭേദം ക്രിയയിൽ പ്രകടമാകുന്നില്ലെങ്കിലും ‘നോക്കൂ’ അതിന്റെ നേരിട്ടുള്ള ആഹ്വാനസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חַי בְּנֵךְ
  choice: നിന്റെ മകൻ ജീവനോടെയിരിക്കുന്നു
  rationale: ജീവൻ വീണ്ടെടുത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിശേഷണപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; പുനരുത്ഥാനത്തിന്റെ രീതി സംബന്ധിച്ച അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ജീവൻ വീണ്ടുകിട്ടിയ അത്ഭുതത്തെ എത്രത്തോളം വ്യക്തീകരിക്കണം
  choice: ‘നിന്റെ മകൻ ജീവനോടെയിരിക്കുന്നു’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു.
  alternative: ‘നിന്റെ മകൻ വീണ്ടും ജീവിച്ചിരിക്കുന്നു’ / ‘നിന്റെ മകൻ ജീവൻ പ്രാപിച്ചിരിക്കുന്നു’
  rationale: ഹീബ്രു വാചകം മകൻ ജീവനുള്ളവനാണെന്ന വസ്തുത നേരിട്ട് പ്രസ്താവിക്കുന്നു. മുൻസന്ദർഭം അത്ഭുതം വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ‘വീണ്ടും’ എന്നോ ജീവൻ പ്രാപിച്ച രീതി സംബന്ധിച്ചോ മൂലപാഠത്തിന് അതീതമായ വിശദീകരണം ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മേൽമുറി’ എന്ന പരമ്പരാഗത പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന ‘മുകളിലെ മുറി’ സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന ‘ഏലിയാവ്’ മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ഒഴിവാക്കിയിട്ടില്ല.
