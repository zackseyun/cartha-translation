source:
  edition: WLC
  text: וַ/תֵּ֥לֶךְ וַ/תַּעֲשֶׂ֖ה כִּ/דְבַ֣ר אֵלִיָּ֑הוּ וַ/תֹּ֧אכַל הוא ו/היא וּ/בֵיתָ֖/הּ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: ml
  text: അങ്ങനെ അവൾ പോയി ഏലിയാവിന്റെ വാക്കനുസരിച്ച് ചെയ്തു. അവൾ ഭക്ഷണം കഴിച്ചു—അവനും അവളും അവളുടെ വീട്ടുകാരും—പല ദിവസങ്ങളോളം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവൾ ഭക്ഷണം കഴിച്ചു—അവനും അവളും അവളുടെ വീട്ടുകാരും—ദിവസങ്ങൾ.’ ഭക്ഷിച്ചവരുടെ വ്യക്തമായ പട്ടിക പിന്നാലെ വരുന്നുവെങ്കിലും, എബ്രായത്തിൽ ക്രിയ ഏകവചന സ്ത്രീലിംഗത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: അങ്ങനെ അവൾ പോയി
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അങ്ങനെ’ മുൻവാക്യത്തിലെ നിർദേശത്തോടുള്ള പ്രതികരണം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַתַּעֲשֶׂה
  choice: ചെയ്തു
  rationale: ഇവിടെ עשה എന്നത് ഏലിയാവിന്റെ നിർദേശം നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്തു’ എന്നത് വിശാലവും സ്വാഭാവികവുമായ തുല്യപദമാണ്.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: ഏലിയാവിന്റെ വാക്കുപോലെ
  rationale: דבר ഇവിടെ പറഞ്ഞ നിർദേശം അഥവാ കല്പനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം ഔപചാരികതയും സുതാര്യതയും നിലനിർത്തുന്നു.
- source_word: וַתֹּאכַל
  choice: അവൾ ഭക്ഷിച്ചു
  rationale: ക്രിയ മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗത്തിലാണ്. തുടർന്ന് ഭക്ഷിച്ചവരുടെ പട്ടിക വരുന്നതിനാൽ, ബഹുവചനമാക്കി മിനുക്കാതെ എബ്രായ വാക്യഘടനയിലെ ശ്രദ്ധേയമായ ഏകവചനരൂപം നിലനിർത്തി.
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: അവനും അവളും അവളുടെ വീട്ടുകാരും
  rationale: എബ്രായത്തിലെ ക്രമം—‘അവൻ, അവൾ, അവളുടെ വീട്/വീട്ടുകാർ’—നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘അവൻ’ ഏലിയാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; പേര് ചേർത്ത് അർഥം അതിരുകടന്ന് വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: בֵּיתָהּ
  choice: അവളുടെ വീട്ടുകാർ
  rationale: בַּיִת എന്നതിന് വീടെന്ന കെട്ടിടത്തെയും കുടുംബം/വീട്ടുകാരെയും സൂചിപ്പിക്കാം. ഭക്ഷിക്കുന്നവരെപ്പറ്റിയുള്ള സന്ദർഭത്തിൽ ‘വീട്ടുകാർ’ ഉദ്ദേശിച്ച അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָמִים
  choice: അനേകം ദിവസം
  rationale: ‘ദിവസങ്ങൾ’ എന്ന ബഹുവചനം ഇവിടെ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമാണ്; ‘അനേകം ദിവസം’ സ്വാഭാവികമായ മലയാളത്തിൽ ദീർഘകാലം എന്ന ആശയം നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ഏകവചന സ്ത്രീലിംഗക്രിയയും അതിനു പിന്നാലെയുള്ള പങ്കാളികളുടെ പട്ടികയും മിനുക്കി ബഹുവചനമാക്കാതെ ഡാഷുകൾ ഉപയോഗിച്ച് നിലനിർത്തി; ഈ അസാധാരണ വാക്യഘടന അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
