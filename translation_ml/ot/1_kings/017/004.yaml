  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: ml
  text: നീ ആ തോട്ടിൽനിന്ന്[a] കുടിക്കും; അവിടെ നിന്നെ പരിപാലിക്കാൻ[b] കാക്കകളോടു[c] ഞാൻ കല്പിച്ചിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നീരൊഴുക്കിൽനിന്ന്” അല്ലെങ്കിൽ “വാദിയിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്നെ പോറ്റാൻ” അല്ലെങ്കിൽ “നിന്നെ നിലനിർത്താൻ.”
    reason: lexical_alternative
  - marker: c
    text: “കാക്കകൾ” എന്നതിന് പക്ഷികളല്ലാത്ത മറ്റൊരു വായന ചിലർ നിർദേശിച്ചിട്ടുണ്ടെങ്കിലും, ഹീബ്രായപദത്തിന്റെ സാധാരണ അർഥം പക്ഷികളാണ്; തുടർന്നുള്ള സന്ദർഭവും അതിനെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: (മലയാളത്തിൽ പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: ഈ ഹീബ്രായ പ്രയോഗം തുടർന്നുവരുന്ന സാഹചര്യത്തെ അവതരിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിന്റെ ഭാവാർഥം തുടർന്നുള്ള ഭാവികാല ക്രിയയിലും വാക്യഘടനയിലും ഉൾക്കൊള്ളുന്നു.
- source_word: מֵהַנַּחַל
  choice: ആ തോട്ടിൽനിന്ന്
  rationale: נחל എന്നത് നീരൊഴുക്ക്, തോട്, അല്ലെങ്കിൽ കാലാവസ്ഥാനുസൃതമായി ഒഴുകുന്ന വാദി എന്നൊക്കെ സൂചിപ്പിക്കാം. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായതിനാൽ ‘തോട്’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഭൂമിശാസ്ത്രപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: תִּשְׁתֶּה
  choice: നീ ... കുടിക്കണം
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലെ അപൂർണ്ണക്രിയ ഇവിടെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ ദൈവകല്പനയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ ‘കുടിക്കണം’ സ്വാഭാവികമാണ്.
- source_word: הָעֹרְבִים
  choice: കാക്കകളോട്
  rationale: עֹרֵב സാധാരണയായി raven/corvid പക്ഷിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പൊതുവായ സ്വാഭാവിക സമാനപദം ‘കാക്ക’ ആണ്; മനുഷ്യസംഘമോ സ്ഥലനാമമോ എന്ന അപൂർവ നിർദേശം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: צִוִּיתִי
  choice: ഞാൻ കല്പിച്ചിരിക്കുന്നു
  rationale: 'പൂർത്തിയായ പ്രവൃത്തിക്ക് ഇപ്പോഴത്തെ പ്രസക്തിയുള്ളതായി ക്രിയ സൂചിപ്പിക്കുന്നു: ഏലിയാവിന്റെ പരിപാലനം ദൈവം ഇതിനകം ക്രമീകരിച്ചിരിക്കുന്നു.'
- source_word: לְכַלְכֶּלְךָ
  choice: നിനക്കു വേണ്ടത് നൽകാൻ
  rationale: כלכל എന്ന ക്രിയയ്ക്ക് പോറ്റുക, നിലനിർത്തുക, ആവശ്യങ്ങൾ നിറവേറ്റുക എന്നീ വിശാല അർഥങ്ങളുണ്ട്. തുടർസന്ദർഭത്തിലെ ഭക്ഷണവിതരണം ഉൾക്കൊള്ളുകയും അർഥം ‘ഭക്ഷണം കൊടുക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ തുല്യപദം.
theological_decisions:
- issue: കാക്കകൾക്ക് നൽകിയ ദൗത്യത്തിന്റെ സ്വഭാവം
  choice: ദൈവം ഏലിയാവിനെ പോറ്റാൻ കല്പിച്ച യഥാർഥ പക്ഷികളായ കാക്കകളെയാണ് പാഠം സൂചിപ്പിക്കുന്നത്.
  alternative: പക്ഷികളല്ലാതെ ഒരു സ്ഥലനാമമോ മനുഷ്യസംഘമോ ഇവിടെ ഉദ്ദേശിച്ചിരിക്കാമെന്ന് ചിലർ നിർദേശിച്ചിട്ടുണ്ട്.
  rationale: הָעֹרְבִים എന്നതിന്റെ സാധാരണ ഹീബ്രായ അർഥം കാക്കവർഗത്തിലെ പക്ഷികളാണ്; പിന്നാലെ അവ അപ്പവും മാംസവും കൊണ്ടുവരുന്നതായി സന്ദർഭം പറയുന്നു. അതിനാൽ പാഠത്തിന്റെ സാധാരണ അർഥം മാറ്റാൻ ഭാഷാപരമായോ ദൈവശാസ്ത്രപരമായോ നിർബന്ധമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ദൈവവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഹീബ്രായത്തിന്റെ അർഥപരിധി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിക്കൊണ്ട് മുഖ്യപാഠം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
