  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֖לֶךְ לָ/קַ֑חַת וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר לִֽקְחִי נָ֥א לִ֛/י פַּת לֶ֖חֶם בְּ/יָדֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: ml
  text: 'അവൾ അതു കൊണ്ടുവരാൻ പോയപ്പോൾ, അവൻ അവളോടു വിളിച്ചുപറഞ്ഞു[a]: “ദയവായി, നിന്റെ കൈയിൽ ഒരു കഷണം അപ്പം എനിക്കായി കൊണ്ടുവരിക[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവളുടെ പിന്നാലെ വിളിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒരു തുണ്ട് അപ്പം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: അവൾ അതു കൊണ്ടുവരാൻ പോയപ്പോൾ
  rationale: הלך എന്ന ക്രിയയുടെ ആഖ്യാനതുടർച്ചയും പിന്നാലെയുള്ള ലക്ഷ്യാർഥകമായ לקח എന്ന അനന്തക്രിയയും ഒരുമിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘അതു’ മുൻവാക്യത്തിൽ ആവശ്യപ്പെട്ട വെള്ളത്തെ സൂചിപ്പിക്കുന്നു; ഏലിയാവ് വിളിക്കുമ്പോൾ അവൾ പോകുകയായിരുന്നുവെന്ന സംഭവക്രമവും ‘പോയപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: അവൻ അവളെ വിളിച്ചു
  rationale: קרא אֶל എന്ന പ്രയോഗത്തിന്റെ സാധാരണ അർഥം ഒരാളെ വിളിക്കുക എന്നതാണ്. സന്ദർഭത്തിൽ ‘അവളുടെ പിന്നാലെ വിളിച്ചു’ എന്ന അർഥസാധ്യത ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִקְחִי נָא לִי
  choice: ദയവായി … എനിക്കായി … കൊണ്ടുവരിക
  rationale: לקח എന്ന ആജ്ഞാരൂപം ഇവിടെ വസ്തു എടുത്ത് സംസാരിക്കുന്നവന്റെ അടുക്കൽ എത്തിക്കണമെന്ന അഭ്യർഥനയാണ്; അതിനാൽ ‘കൊണ്ടുവരിക’ സ്വാഭാവികമാണ്. נָא ആജ്ഞയെ മയപ്പെടുത്തുന്ന വിനയസൂചകമായതിനാൽ ‘ദയവായി’ എന്നും, לִי ഗുണഭോക്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എനിക്കായി’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: פַּת לֶחֶם
  choice: ഒരു കഷണം അപ്പം
  rationale: ഈ സംയുക്തപ്രയോഗം അപ്പത്തിന്റെ ചെറിയൊരു ഭാഗത്തെയോ തുണ്ടിനെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഒരു കഷണം അപ്പം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റൊരു സ്വാഭാവിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בְּיָדֵךְ
  choice: നിന്റെ കൈയിൽ
  rationale: എബ്രായത്തിലെ ദൃശ്യവും മൂർത്തവുമായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ഇത് ‘നിന്റെ പക്കൽ’ എന്ന ഉടമസ്ഥതാസൂചനയായും മനസ്സിലാക്കാമെങ്കിലും അങ്ങനെ വ്യാഖ്യാനം ചുരുക്കാതെ മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിച്ചു.
