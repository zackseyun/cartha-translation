translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അഭ്യർഥനയുടെ വിനയം ‘ദയവായി’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ‘നിന്റെ കൈയിൽ’ എന്ന മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും ചെയ്തു.
