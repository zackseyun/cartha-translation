  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: ml
  text: അവൻ അവരെ ലെബാനോനിലേക്ക് അയച്ചു—ഓരോ മാസവും പതിനായിരം പേരെ വീതം, മാറിമാറിയുള്ള സംഘങ്ങളായി[a]. അവർ ഒരു മാസം ലെബാനോനിലും രണ്ടു മാസം സ്വന്തം വീടുകളിലും[b] ആയിരുന്നു. നിർബന്ധിതവേലയുടെ[c] മേൽനോട്ടം അദോനീരാമിനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഊഴമനുസരിച്ചുള്ള സംഘങ്ങളായി.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അവന്റെ വീട്ടിൽ’; ഓരോ തൊഴിലാളിയും ലെബാനോനിലെ ഒരു മാസത്തെ സേവനത്തിനിടയിൽ രണ്ടു മാസം സ്വന്തം വീട്ടിൽ കഴിഞ്ഞിരുന്നു എന്നാണ് സന്ദർഭത്തിലെ അർഥം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘തൊഴിൽച്ചുമതല’; എബ്രായപദം ഭരണകൂടം നിർബന്ധമായി ചുമത്തിയ തൊഴിൽസേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
