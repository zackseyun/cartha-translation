- source_word: עַל הַמַּס
  choice: നിർബന്ധിതവേലയുടെ മേൽനോട്ടം
  rationale: מַס ഭരണകൂടം നിർബന്ധമായി ചുമത്തിയ തൊഴിൽസേവനത്തെ സൂചിപ്പിക്കുന്നു; അതിലെ നിർബന്ധസ്വഭാവം മയപ്പെടുത്താതെ വ്യക്തമാക്കി.
