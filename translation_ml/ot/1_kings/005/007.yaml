  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: ml
  text: ഈ നിയുക്ത ഉദ്യോഗസ്ഥർ[a] ശലോമോൻ രാജാവിനും ശലോമോൻ രാജാവിന്റെ മേശയിലേക്കു വന്ന എല്ലാവർക്കും[b] ആവശ്യമായതെല്ലാം നൽകി. ഓരോരുത്തനും താന്താന്റെ മാസത്തിൽ[c] അങ്ങനെ ചെയ്തു; അവർക്ക് ഒന്നിനും കുറവുണ്ടായില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിയുക്ത ഉദ്യോഗസ്ഥർ’ എന്നതിന് ‘ഭരണാധികാരികൾ’ അല്ലെങ്കിൽ ‘മേൽനോട്ട ഉദ്യോഗസ്ഥർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഓരോ പ്രദേശത്തിന്റെയും ചുമതല ഏൽപ്പിക്കപ്പെട്ട ഭരണനിർവാഹകരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ശലോമോൻ രാജാവിന്റെ മേശയിലേക്കു വന്ന എല്ലാവരും.’ രാജമേശയിൽ പ്രവേശനമോ അവിടെ ഭക്ഷണം ലഭിക്കുന്നതോ ഉണ്ടായിരുന്നവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘ഓരോരുത്തൻ തന്റെ മാസത്തിൽ.’ ഉദ്യോഗസ്ഥർ ഓരോ മാസം വീതം മാറിമാറി ഈ ചുമതല നിർവഹിച്ചിരുന്നുവെന്നാണ് അർഥം.'
    reason: cultural_clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: വേണ്ടതെല്ലാം എത്തിച്ചുകൊടുത്തു
  rationale: പീയേൽ രൂപത്തിലുള്ള ക്രിയ രാജകീയ ഭരണസന്ദർഭത്തിൽ ആവശ്യമായ വിഭവങ്ങളും പരിപാലനവും ലഭ്യമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഈ ആശയം വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: הַנִּצָּבִים
  choice: നിയുക്ത ഉദ്യോഗസ്ഥർ
  rationale: ജില്ലകളുടെ ചുമതല ഏൽപ്പിക്കപ്പെട്ട ഭരണാധികാരികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘നിയുക്ത ഉദ്യോഗസ്ഥർ’ എന്നത് അവരുടെ നിയമിതവും പ്രതിനിധിത്വപരവുമായ ചുമതല വ്യക്തമാക്കുന്നു; ആധുനിക രാഷ്ട്രീയപദവിയായ ‘ഗവർണർ’ എന്ന തെറ്റിദ്ധാരണയും ഒഴിവാക്കുന്നു.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്
  rationale: എബ്രായത്തിലെ സ്ഥാനനാമ-വ്യക്തിനാമ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ മേശയ്ക്കരികെ വന്നിരുന്ന എല്ലാവർക്കും
  rationale: കָרֵב എന്ന പദത്തിന്റെ ‘അടുത്തുവരുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു. ഇവിടെ രാജമേശയിൽ പ്രവേശനമോ പങ്കാളിത്തമോ ഉണ്ടായിരുന്നവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ חָדְשׁוֹ
  choice: ഓരോരുത്തനും താന്താന്റെ മാസത്തിൽ
  rationale: ഓരോ ഉദ്യോഗസ്ഥനും നിശ്ചിത മാസം വീതം ചുമതലയേറ്റിരുന്ന ക്രമം സൂചിപ്പിക്കുന്ന വിതരണാർഥമുള്ള എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: ഒന്നിനും കുറവുണ്ടാകാൻ അവർ ഇടവരുത്തിയില്ല
  rationale: ഒരു ആവശ്യവസ്തുവും ഇല്ലാതാകുകയോ കുറയുകയോ ചെയ്തില്ലെന്ന ഫലമാണ് ഈ സന്ദർഭത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്നത്. ഉദ്യോഗസ്ഥരുടെ ജാഗ്രതയും വാക്യഘടനയും മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
