translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ രാജമേശയ്ക്കരികെ വരുന്നതെന്ന ദൃശ്യരൂപം നിലനിർത്തി, അതിന്റെ ഭരണ-സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ദീർഘമായ മൂലവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
