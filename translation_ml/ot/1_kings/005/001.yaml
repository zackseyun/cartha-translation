id: 1KI.5.1
reference: 1 Kings 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: ml
  text: ശലോമോൻ നദി[a] മുതൽ ഫെലിസ്ത്യരുടെ ദേശംവരെയും ഈജിപ്തിന്റെ അതിർത്തിവരെയും ഉള്ള എല്ലാ രാജ്യങ്ങളുടെയുംമേൽ ഭരിച്ചുകൊണ്ടിരുന്നു. ആ രാജ്യങ്ങളിലെ ജനങ്ങൾ ശലോമോന് കപ്പം[b] കൊണ്ടുവരുകയും അവന്റെ ജീവിതകാലമൊക്കെയും അവനെ സേവിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യൂഫ്രട്ടീസ് നദി.
    reason: cross_reference
  - marker: b
    text: അഥവാ ‘സമ്മാനം.’ എബ്രായപദമായ മിൻഹാ സമ്മാനം, വഴിപാട്, കപ്പം എന്നിവയെ സൂചിപ്പിക്കാം; ഇവിടെ രാഷ്ട്രീയസന്ദർഭം ‘കപ്പം’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: ഭരണം നടത്തിയിരുന്നു
  rationale: היה എന്ന ഭൂതകാല ക്രിയയോടു ചേർന്ന കർത്തൃവാചക രൂപം കഴിഞ്ഞകാലത്തെ തുടർച്ചയായ ഭരണസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ദീർഘത നിലനിർത്തുന്നു.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: എല്ലാ രാജ്യങ്ങളുടെയുംമേൽ
  rationale: משל എന്ന ക്രിയയോടുള്ള בְ ആധിപത്യത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്നു; ബഹുവചനം ശലോമോന്റെ കീഴിലുള്ള പല രാജ്യങ്ങളെയാണ് കാണിക്കുന്നത്.
- source_word: מִן הַנָּהָר
  choice: നദി മുതൽ
  rationale: മൂലത്തിലെ നിർദിഷ്ടമായ ‘നദി’ എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ദേശം
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ അർഥഘടന നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: ഈജിപ്തിന്റെ അതിർത്തിവരെയും
  rationale: ഭരണപ്രദേശത്തിന്റെ അറ്റംവരെയുള്ള വ്യാപ്തി ലളിതമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: מַגִּשִׁים מִנְחָה
  choice: കപ്പം കൊണ്ടുവരുകയും
  rationale: מִנְחָה സമ്മാനം, വഴിപാട്, കപ്പം എന്നീ അർഥങ്ങൾ വഹിക്കാം; കീഴ്രാജ്യങ്ങളുടെ രാഷ്ട്രീയ പശ്ചാത്തലത്തിൽ ‘കപ്പം’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: അവനെ സേവിക്കുകയും ചെയ്തു
  rationale: മേലധികാരിയോടുള്ള സേവനമോ വിധേയത്വമോ സൂചിപ്പിക്കുന്ന עבד എന്ന ക്രിയയുടെ രാഷ്ട്രീയ നിഴൽ നിലനിർത്തുന്നു; നിർബന്ധിതവേല എന്ന് അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: כָּל יְמֵי חַיָּיו
  choice: അവന്റെ ജീവിതകാലമൊക്കെയും
  rationale: ‘അവന്റെ ജീവന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
