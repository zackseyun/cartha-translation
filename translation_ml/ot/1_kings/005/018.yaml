  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ എന്റെ ദൈവമായ യഹോവ എല്ലാ ഭാഗത്തുനിന്നും എനിക്ക് സമാധാനം നൽകിയിരിക്കുന്നു; എതിരാളിയുമില്ല[a], ദോഷകരമായ സംഭവവുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിരോധി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം ഒരു പൊതുനാമമാണ്; അത് ‘സാത്താൻ’ എന്ന വ്യക്തിനാമമായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘അനർത്ഥം,’ ‘വിപത്ത്,’ അല്ലെങ്കിൽ ‘ദുരന്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻകാല സാഹചര്യങ്ങളിൽനിന്ന് ഇപ്പോഴത്തെ അവസ്ഥയിലേക്കുള്ള വൈരുധ്യപരമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֵנִיחַ ... לִי
  choice: എനിക്ക് ... സ്വസ്ഥത നൽകിയിരിക്കുന്നു
  rationale: נוח എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം—സ്വസ്ഥത നൽകുക—സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה אֱלֹהַי
  choice: എന്റെ ദൈവമായ യഹോവ
  rationale: ദൈവനാമമായ יהוה നേരിട്ട് ‘യഹോവ’ എന്നും, אֱלֹהַי വ്യക്തിപരമായ ഉടമസ്ഥബന്ധത്തോടെ ‘എന്റെ ദൈവം’ എന്നും നൽകുന്നു.
- source_word: מִסָּבִיב
  choice: ചുറ്റും
  rationale: ചുറ്റുമുള്ള എല്ലാ ഭാഗങ്ങളിൽനിന്നുമുള്ള ഭീഷണികളിൽനിന്നുള്ള സ്വസ്ഥതയെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵין שָׂטָן
  choice: എതിരാളിയുമില്ല
  rationale: ഇവിടെ שָׂטָן ഒരു പൊതുനാമമായി രാഷ്ട്രീയമോ സൈനികമോ ആയ എതിരാളിയെ സൂചിപ്പിക്കുന്നു; വ്യക്തിനാമമായ ‘സാത്താൻ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וְאֵין פֶּגַע רָע
  choice: ദോഷകരമായ സംഭവവുമില്ല
  rationale: פֶּגַע רָע എന്ന പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തി, അനർത്ഥം, ദുരന്തം, ഉപദ്രവം എന്നിവയിൽ ഒറ്റ അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായിരിക്കുന്ന ഉടമ്പടിനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ദൈവനാമരൂപമായി നൽകുന്നു.
- issue: שָׂטָן വ്യക്തിനാമമാണോ പൊതുനാമമാണോ
  choice: പൊതുനാമമായ ‘എതിരാളി’
  alternative: സാത്താൻ
  rationale: സന്ദർഭം ശലോമോന്റെ രാജ്യത്തിന് ചുറ്റുമുള്ള സമാധാനത്തെയും എതിർപ്പില്ലായ്മയെയും കുറിച്ചാണ്; ഒരു ദുഷ്ടാത്മിക വ്യക്തിയെക്കുറിച്ചുള്ള അവകാശവാദം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജകീയ-രാഷ്ട്രീയ പശ്ചാത്തലം വ്യക്തമാകുന്ന വിധത്തിൽ ലളിതമായ പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു; മൂലത്തിലെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പുകളിൽ നിലനിർത്തുന്നു.
