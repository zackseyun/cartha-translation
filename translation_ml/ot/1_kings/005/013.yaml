id: 1KI.5.13
reference: 1 Kings 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּר֮ עַל הָֽ/עֵצִים֒ מִן הָ/אֶ֨רֶז֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וְ/עַד֙ הָ/אֵז֔וֹב אֲשֶׁ֥ר יֹצֵ֖א בַּ/קִּ֑יר וַ/יְדַבֵּר֙ עַל הַ/בְּהֵמָ֣ה וְ/עַל הָ/ע֔וֹף וְ/עַל הָ/רֶ֖מֶשׂ וְ/עַל הַ/דָּגִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: ml
  text: അവൻ വൃക്ഷങ്ങളെക്കുറിച്ചു സംസാരിച്ചു—ലെബാനോനിലെ ദേവദാരു മുതൽ മതിലിൽനിന്ന് വളരുന്ന ഈസോപ്പുചെടി[a] വരെ. മൃഗങ്ങൾ, പക്ഷികൾ, ഇഴജന്തുക്കൾ, മത്സ്യങ്ങൾ എന്നിവയെക്കുറിച്ചും അവൻ സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ചെറിയൊരു സുഗന്ധസസ്യം.’ എബ്രായത്തിലെ אֵזוֹב എന്ന സസ്യത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ അനിശ്ചിതമാണ്; ‘ഈസോപ്പ്’ എന്നത് പരമ്പരാഗത പരിഭാഷയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: കുറിച്ചു സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയ עַל എന്ന അവ്യയത്തോടൊപ്പം ഇവിടെ ഒരു വിഷയത്തെക്കുറിച്ചു സംസാരിക്കുക എന്നാണ്; സാങ്കേതികമായി വിവരിച്ചു എന്ന അധിക അർഥം ചേർക്കാതെ സ്വാഭാവികമായി വിഷയം സൂചിപ്പിക്കുന്നു.
- source_word: הָעֵצִים
  choice: വൃക്ഷങ്ങൾ
  rationale: ദേവദാരു മുതൽ ചെറിയ മരച്ചെടിവരെ ഉൾക്കൊള്ളുന്ന സസ്യപരമായ സന്ദർഭത്തിൽ עֵץ എന്നതിന്റെ ബഹുവചനം വൃക്ഷങ്ങളെയോ മരച്ചെടികളെയോ സൂചിപ്പിക്കുന്നു; പ്രധാന പദമായി വൃക്ഷങ്ങൾ സ്വാഭാവികമാണ്.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: ലെബാനോനിലെ ദേവദാരു
  rationale: אֶרֶז ലെബാനോനുമായി പ്രസിദ്ധമായി ബന്ധപ്പെട്ട ദേവദാരുവാണ്; ബന്ധവാക്യം മലയാളത്തിൽ സംക്ഷിപ്തമായ സ്ഥലവിശേഷണമായി സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: מִן ... וְעַד
  choice: മുതൽ ... വരെ
  rationale: എബ്രായത്തിലെ പരിധി സൂചിപ്പിക്കുന്ന സമാന്തര ഘടന മലയാളത്തിലെ ‘മുതൽ ... വരെ’ എന്ന രൂപത്തിൽ കൃത്യവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: הָאֵזוֹב
  choice: ഈസോപ്പുചെടി
  rationale: പരമ്പരാഗത സസ്യനാമം നിലനിർത്തുന്നു; എന്നാൽ കൃത്യമായ സസ്യശാസ്ത്ര തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ അടിക്കുറിപ്പിൽ അത് വ്യക്തമാക്കുന്നു.
- source_word: יֹצֵא בַּקִּיר
  choice: മതിലിൽ മുളച്ചുവരുന്ന
  rationale: יצא അക്ഷരാർഥത്തിൽ ‘പുറത്തുവരുക’ എന്നാണ്; സസ്യസന്ദർഭത്തിൽ മതിലിൽനിന്നോ മതിലിന്റെ ഇടുക്കിൽനിന്നോ വളരുന്നതിനെ ‘മുളച്ചുവരുന്ന’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבְּהֵמָה
  choice: മൃഗങ്ങൾ
  rationale: പക്ഷികൾ, ഇഴജന്തുക്കൾ, മത്സ്യങ്ങൾ എന്നിവയ്‌ക്കൊപ്പമുള്ള വർഗപ്പട്ടികയിൽ ഇത് കന്നുകാലികൾ എന്ന ചുരുങ്ങിയ അർഥത്തേക്കാൾ പൊതുവായ മൃഗവർഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: הָעוֹף
  choice: പക്ഷികൾ
  rationale: עוֹף പറക്കുന്ന ജീവികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും ഈ വർഗപ്പട്ടികയിൽ ‘പക്ഷികൾ’ ഏറ്റവും സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: הָרֶמֶשׂ
  choice: ഇഴജന്തുക്കൾ
  rationale: רֶמֶשׂ ഇഴയുകയോ നിലത്തുകൂടി നീങ്ങുകയോ ചെയ്യുന്ന ജീവികളുടെ വിശാല വിഭാഗമാണ്; ‘ഉരഗങ്ങൾ’ എന്നു ചുരുക്കാതെ ഈ പരിധി നിലനിർത്തുന്നു.
- source_word: הַדָּגִים
  choice: മത്സ്യങ്ങൾ
  rationale: ജലജീവികളുടെ ഈ സാധാരണ വിഭാഗനാമത്തിന് dignified modern Malayalam രൂപമായ ‘മത്സ്യങ്ങൾ’ ഉപയോഗിച്ചു.
