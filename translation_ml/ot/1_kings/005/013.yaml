  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ വിഷയപ്പട്ടികയും ‘മുതൽ ... വരെ’ എന്ന പരിധിഘടനയും നിലനിർത്തി. ആവർത്തിച്ച וַיְדַבֵּר രണ്ടുതവണയും ‘സംസാരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി; സോളമനെ സാങ്കേതിക ശാസ്ത്രഗ്രന്ഥകാരനായി ചിത്രീകരിക്കുന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കി.
