  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവൻ നദിക്കപ്പുറമുള്ള സകല പ്രദേശവും, തിഫ്സഹ് മുതൽ ഗസ്സ വരെ, നദിക്കപ്പുറമുള്ള സകല രാജാക്കന്മാരെയും ഭരിച്ചുകൊണ്ടിരുന്നു; അവന്നു ചുറ്റുമുള്ള എല്ലാ ദിക്കുകളിലും സമാധാനമുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “നദി” എന്നു പറയുന്നത് യൂഫ്രട്ടീസ് നദിയെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: അവന്റെ ഭരണത്തിൻകീഴിലായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ആധിപത്യത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു കർത്തൃവാചകത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: നദിക്കക്കരെയുള്ള പ്രദേശം മുഴുവനും
  rationale: עֵבֶר הַנָּהָר എന്ന ഭൂമിശാസ്ത്രപ്രയോഗത്തിന്റെ പ്രാദേശിക അർഥം വ്യക്തമാക്കുന്നു; ഹീബ്രുവിലെ ‘നദി’ എന്ന പൊതുനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַנָּהָר
  choice: നദി
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ട പൊതുനാമം അതേപടി സംരക്ഷിക്കുന്നു; അത് യൂഫ്രട്ടീസ് നദിയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: തിഫ്സഹ് മുതൽ ഗസ്സ വരെ
  rationale: ഭരണപ്രദേശത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി നേരിട്ട് നൽകുകയും സ്ഥലനാമങ്ങളെ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: നദിക്കക്കരെയുള്ള സകല രാജാക്കന്മാരും ഉൾപ്പെടെ
  rationale: ആ പ്രദേശത്തെ രാജാക്കന്മാരിന്മേലുള്ള മേൽക്കോയ്മയെ മുൻവാക്യത്തിലെ ഭരണപ്രദേശത്തിന്റെ പരിധിയോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: അവന് സമാധാനം ഉണ്ടായിരുന്നു
  rationale: സന്ദർഭത്തിലെ രാഷ്ട്രീയ സമാധാനവും സുരക്ഷയും ഉൾക്കൊള്ളുന്ന שָׁלוֹם എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: ചുറ്റുമുള്ള എല്ലാ ഭാഗത്തുനിന്നും
  rationale: ചുറ്റുമുള്ള സകല ദിക്കുകളിൽനിന്നുമുള്ള സമാധാനം എന്ന സ്ഥലപരമായ ആശയം നിലനിർത്തുന്നു; ‘അയൽരാജ്യങ്ങൾ’ എന്ന് അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള ‘നദിക്കക്കരെ’ എന്ന ഭൂമിശാസ്ത്രപ്രയോഗം മൂലപാഠത്തിന്റെ ഘടന പിന്തുടർന്ന് നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [b] അടിക്കുറിപ്പ് പുതിയ വിവരമൊന്നും നൽകാത്തതിനാൽ ഉൾപ്പെടുത്തിയില്ല; മുഖ്യപാഠത്തിലെ ഏക അടിക്കുറിപ്പ് സൂചകം [a] അതിന്റെ അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
