  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: ml
  text: യഹ്‌വെ ശലോമോനോടു പറഞ്ഞിരുന്നതുപോലെ[a] അവനു ജ്ഞാനം നൽകി. ഹീരാമിനും ശലോമോനും ഇടയിൽ സമാധാനം ഉണ്ടായിരുന്നു; അവർ ഇരുവരും ഒരു ഉടമ്പടി ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാഗ്ദാനം ചെയ്തിരുന്നതുപോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “പറഞ്ഞു” എന്നാണ്; സന്ദർഭത്തിൽ അത് യഹ്‌വെ മുമ്പ് ശലോമോനോടു പറഞ്ഞ വചനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു ഉടമ്പടി മുറിച്ചു”; ഇത് ‘ഉടമ്പടി ചെയ്തു’ എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: חָכְמָה
  choice: ജ്ഞാനം
  rationale: ഇവിടെ ദൈവം ശലോമോനു നൽകിയ പ്രായോഗികവും രാജകീയവുമായ വിവേകത്തെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപദം.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: ശലോമോനോടു പറഞ്ഞിരുന്നതുപോലെ
  rationale: דִּבֶּר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘പറഞ്ഞു/സംസാരിച്ചു’ നിലനിർത്തുന്നു; അതിനെ മുഖ്യപാഠത്തിൽ ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കുന്നില്ല.
- source_word: וַיְהִי שָׁלוֹם
  choice: സമാധാനം ഉണ്ടായിരുന്നു
  rationale: രണ്ടു രാജാക്കന്മാർ തമ്മിലുള്ള സമാധാനപരമായ ബന്ധത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘സൗഹൃദം’ എന്ന് കൂടുതൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: ഒരു ഉടമ്പടി ചെയ്തു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഉടമ്പടി മുറിച്ചു’ എന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ അർഥവത്തും സ്വാഭാവികവുമായി നൽകുന്നു; בְרִית എന്ന പ്രധാന പദത്തിന്റെ ഉടമ്പടിസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: שְׁנֵיהֶם
  choice: അവർ ഇരുവരും
  rationale: ഉടമ്പടിയിൽ രണ്ടു കക്ഷികളുടെയും പരസ്പര പങ്കാളിത്തം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മറ്റൊരു ഉച്ചാരണപരമ്പരയെ നിർബന്ധിക്കുന്നില്ല.
- issue: בְרִית എന്ന പദം രാഷ്ട്രീയ ‘സന്ധി’ എന്നോ ‘ഉടമ്പടി’ എന്നോ നൽകുന്നത്
  choice: ഉടമ്പടി
  alternative: സന്ധി
  rationale: സന്ദർഭം രാജ്യാന്തര രാഷ്ട്രീയബന്ധമാണെങ്കിലും, മൂലപാഠത്തിലെ പതിവ് ഉടമ്പടിപദത്തിന്റെ പദസുതാര്യതയും തിരുവെഴുത്തിലുടനീളമുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- issue: דִּבֶּר എന്നത് ‘പറഞ്ഞു’ എന്നോ ‘വാഗ്ദാനം ചെയ്തു’ എന്നോ നൽകുന്നത്
  choice: പറഞ്ഞിരുന്നതുപോലെ
  alternative: വാഗ്ദാനം ചെയ്തിരുന്നതുപോലെ
  rationale: മുൻപുണ്ടായ ദൈവവചനം സന്ദർഭത്തിൽ വാഗ്ദാനമായി മനസ്സിലാക്കാമെങ്കിലും, ക്രിയയുടെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഹീബ്രു വാക്യത്തിന്റെ രണ്ടു പ്രധാന പ്രസ്താവനകളും പരസ്പരബന്ധവും നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരപരിഭാഷ ഒഴിവാക്കി. നൽകിയ ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകൾ തെറ്റായ സ്ഥാനങ്ങളിൽ സൂചിപ്പിച്ചിരുന്നതായി തോന്നുന്നതിനാൽ, അവ ബന്ധപ്പെട്ട മലയാളവാക്യഭാഗങ്ങളിൽ യഥാക്രമം [a], [b] ആയി ചേർത്തു.
