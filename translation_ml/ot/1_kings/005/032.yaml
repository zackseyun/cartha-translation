source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: ml
  text: അങ്ങനെ ശലോമോന്റെ പണിക്കാരും ഹീരാമിന്റെ പണിക്കാരും ഗെബാൽദേശക്കാരും[a] തടിയും കല്ലുകളും ചെത്തി, ഭവനം[b] പണിയുന്നതിനായി അവ ഒരുക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഗെബാല്യർ’ അല്ലെങ്കിൽ ‘ഗിബ്ല്യർ’; അതായത് ഗെബാലിൽനിന്നുള്ളവർ (ബിബ്ലോസ്).
    reason: lexical_alternative
  - marker: b
    text: അതായത് യഹോവയുടെ ഭവനം—ആലയം.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: ചെത്തി
  rationale: פסל എന്ന ക്രിയ നിർമാണസാമഗ്രികൾ മുറിച്ച് രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചെത്തി’ എന്നത് മരത്തിനും കല്ലിനും യോജിക്കുന്ന, സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ പണിക്കാർ
  rationale: ഇവിടെ בֹּנֵי എന്നത് ‘പണിയുന്നവർ/നിർമാണത്തൊഴിലാളികൾ’ എന്ന പങ്കിനെ സൂചിപ്പിക്കുന്നു; ‘പണിക്കാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וּבֹנֵי חִירוֹם
  choice: ഹീരാമിന്റെ പണിക്കാർ
  rationale: മുൻപത്തെ സമാന്തരപ്രയോഗത്തിന്റെ ഘടന നിലനിർത്തുകയും ഹീബ്രുവിലെ സമമിതി മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהַגִּבְלִים
  choice: ഗെബാൽദേശക്കാർ
  rationale: ഈ ജനനാമം ഗെബാലിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്നു. അപരിചിതമായ രൂപം മാത്രം ഉപയോഗിക്കുന്നതിനെക്കാൾ ‘ഗെബാൽദേശക്കാർ’ അർത്ഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וַיָּכִינוּ
  choice: ഒരുക്കി
  rationale: Hiphil രൂപത്തിലുള്ള כון ഇവിടെ ‘തയ്യാറാക്കുക’ എന്നാണ്; ‘ഒരുക്കി’ നിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הָעֵצִים
  choice: മരം
  rationale: നിർമാണത്തിനുള്ള മരസാമഗ്രിയാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ ‘മരം’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: וְהָאֲבָנִים
  choice: കല്ല്
  rationale: ഹീബ്രു പൊതുവായി ‘കല്ലുകൾ’ എന്നു മാത്രമാണ് പറയുന്നത്; ‘കൽപ്പാളികൾ’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ ആശയം ചേർക്കാതെ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: לִבְנוֹת הַבָּיִת
  choice: ആ ഭവനം പണിയുന്നതിനായി
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാന അർത്ഥമായ ‘ഭവനം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യഹോവയുടെ ആലയമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הַבָּיִת എന്ന പദം നേരിട്ട് ‘ആലയം’ എന്നു പരിഭാഷപ്പെടുത്തണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ആ ഭവനം’ എന്ന് നൽകി സന്ദർഭപരമായ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആലയം’ അല്ലെങ്കിൽ ‘യഹോവയുടെ ആലയം’
  rationale: ഹീബ്രുവിലെ ‘ഭവനം’ എന്ന രൂപകം സംരക്ഷിക്കുമ്പോഴും ഇത് യഹോവയുടെ ക്ഷേത്രത്തെ സൂചിപ്പിക്കുന്നുവെന്നത് വായനക്കാരനു വ്യക്തമാക്കുന്നു; പ്രധാനപാഠത്തിൽ വിശദീകരണവാക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പണിക്കാർ,’ ‘ചെത്തി,’ ‘ഒരുക്കി’ എന്നീ വാക്കുകൾ നിർമാണസന്ദർഭം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നവിധം നൽകുന്നു. ഹീബ്രുവിലെ മൂന്ന് കർത്താക്കളുടെ സമാന്തരക്രമവും മരം–കല്ല് എന്ന ദ്വയവും നിലനിർത്തി.
