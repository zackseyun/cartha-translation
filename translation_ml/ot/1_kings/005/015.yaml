translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'ദാസന്മാർ' എന്ന പദം രാജസേവകരെയും ഉദ്യോഗസ്ഥരെയും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായവാക്യം മലയാളവായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; കാരണബന്ധം നിലനിർത്തി.
