  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: ml
  text: പിന്നെ സോർരാജാവായ ഹീരാം തന്റെ ദാസന്മാരെ ശലോമോന്റെ അടുക്കൽ അയച്ചു. ശലോമോൻ തന്റെ പിതാവിനു പകരം രാജാവായി അഭിഷേകം ചെയ്യപ്പെട്ടെന്നു കേട്ടതുകൊണ്ടാണ് അദ്ദേഹം അങ്ങനെ ചെയ്തത്; ഹീരാം ദാവീദിനെ എല്ലാക്കാലവും സ്നേഹിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഹീരാം ദാവീദിനോടു എല്ലാ നാളുകളിലും സൗഹൃദഭാവമുള്ളവനായിരുന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഹീരാം എല്ലാ നാളുകളിലും ദാവീദിനെ സ്നേഹിക്കുന്നവനായിരുന്നു” എന്നാണ്; ഇത് ദീർഘകാലം നിലനിന്ന അനുകൂലബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: തുടർച്ചയായ എബ്രായ ആഖ്യാനക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: സോർരാജാവായ ഹീരാം
  rationale: പേരും രാജപദവിയും ദേശവും സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: עֲבָדָיו
  choice: തന്റെ ദാസന്മാരെ
  rationale: രാജസദസ്സിലെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാവുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; 'ഉദ്യോഗസ്ഥർ' എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: אֶל שְׁלֹמֹה
  choice: ശലോമോന്റെ അടുക്കൽ
  rationale: ശലോമോനെ ലക്ഷ്യമാക്കിയുള്ള അയക്കലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത സന്ദർശനോദ്ദേശ്യം ചേർക്കുന്നില്ല.
- source_word: כִּי שָׁמַע
  choice: കേട്ടിരുന്നു
  rationale: അയയ്ക്കുന്നതിനു മുമ്പേ അറിഞ്ഞിരുന്ന പശ്ചാത്തലസംഭവത്തെ പൂർവഭൂതകാലഭാവത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ מָשְׁחוּ לְמֶלֶךְ
  choice: രാജാവായി അവനെ അഭിഷേകം ചെയ്തു
  rationale: രാജസ്ഥാനത്തേക്കുള്ള അഭിഷേകത്തിന്റെ ഔപചാരിക അർഥം നേരിട്ട് നിലനിർത്തുന്നു; നിർദ്ദിഷ്ടമല്ലാത്ത കർത്താവിനെ മലയാളത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: תַּחַת אָבִיהוּ
  choice: അവന്റെ പിതാവിനു പകരം
  rationale: രാജകീയ പിൻഗാമിത്തത്തിൽ תחת സൂചിപ്പിക്കുന്ന സ്ഥാനമേറ്റെടുക്കൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: കാരണം ഹീരാം ദാവീദിനോട് എല്ലാക്കാലവും സ്നേഹമുള്ളവനായിരുന്നു
  rationale: തുടർന്നുനിന്ന അനുകൂലവും സ്നേഹപൂർവവുമായ ബന്ധം നിലനിർത്തുന്നു; അതിനെ സൗഹൃദമെന്ന രാഷ്ട്രീയമോ വ്യക്തിപരമോ ആയ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
