  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: ml
  text: ദൈവം ശലോമോന് ജ്ഞാനവും അത്യധികമായ വിവേകവും കടൽത്തീരത്തെ മണൽപോലെ വിശാലമായ മനസ്സും[a] നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഹൃദയത്തിന്റെ വിശാലത.’ എബ്രായത്തിൽ ‘ഹൃദയം’ എന്ന പദം മനസ്സിനെയോ ഗ്രഹണശേഷിയെയോ കൂടി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: നൽകി
  rationale: נתן എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ മലയാളസമാനപദം; ദൈവം നൽകുന്ന വരങ്ങളെന്ന സന്ദർഭത്തിനും യോജിക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചനക്രിയയോടുകൂടെ ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: חָכְמָה
  choice: ജ്ഞാനം
  rationale: ശലോമോന്റെ പ്രായോഗികവും ഭരണപരവുമായ ജ്ഞാനത്തെ ഉൾക്കൊള്ളുന്ന പതിവായ വിശാലപദം.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോന്
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം.
- source_word: וּתְבוּנָה
  choice: വിവേകം
  rationale: തിരിച്ചറിയാനും ഗ്രഹിക്കാനുമുള്ള ശേഷിയെ സൂചിപ്പിക്കുന്നു; ജ്ഞാനം എന്നതിനോടൊപ്പം സ്വാഭാവികമായും അർത്ഥവ്യത്യാസത്തോടെയും നിൽക്കുന്നു.
- source_word: הַרְבֵּה מְאֹד
  choice: അത്യധികമായ
  rationale: അളവിനെയും വ്യാപ്തിയെയും ശക്തമായി ഊന്നുന്ന ഇരട്ട പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: וְרֹחַב לֵב
  choice: ഹൃദയവിശാലത
  rationale: ‘ഹൃദയത്തിന്റെ വിശാലത’ എന്ന എബ്രായ രൂപകം ചുരുക്കമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു; ബൗദ്ധിക ശേഷിയെന്ന അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: കടൽത്തീരത്തെ മണൽപോലെയുള്ള
  rationale: മൂലത്തിലെ ഉപമയും കടൽത്തീരം എന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְרֹחַב לֵב എന്ന മനുഷ്യസ്വഭാവസംബന്ധിയായ എബ്രായ രൂപകം
  choice: പ്രധാനപാഠത്തിൽ ‘ഹൃദയവിശാലത’ എന്നു രൂപകം നിലനിർത്തി
  alternative: മനസ്സിന്റെ വിശാലത; അപാരമായ ഗ്രഹണശേഷി
  rationale: ലֵב എന്നത് വികാരകേന്ദ്രം മാത്രമല്ല, മനസ്സ്, ബുദ്ധി, ഗ്രഹണശേഷി എന്നിവയെയും സൂചിപ്പിക്കാം. ‘ഹൃദയവിശാലത’ മൂലരൂപകത്തെ സംരക്ഷിക്കുന്നു; ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് അർത്ഥം ചുരുക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് അർത്ഥപരിധി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഹൃദയവിശാലത’ ഇന്നത്തെ മലയാളത്തിൽ ഔദാര്യത്തെയും സൂചിപ്പിക്കാമെന്നതിനാൽ, ഇവിടെ ഉദ്ദേശിക്കുന്ന വിശാലമായ മാനസിക-ബൗദ്ധിക ശേഷി അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
