  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: ml
  text: 'പിന്നെ ഹീരാം ശലോമോന്റെ അടുക്കൽ ഇങ്ങനെ പറഞ്ഞയച്ചു: “നീ എനിക്ക് അയച്ചതു ഞാൻ കേട്ടു[a]. ദേവദാരുത്തടിയുടെയും സൈപ്രസ് തടിയുടെയും[b] കാര്യത്തിൽ നിന്റെ ആഗ്രഹമെല്ലാം ഞാൻ നിറവേറ്റും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീ എന്നോട് അഭ്യർഥിച്ചത്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘നീ എനിക്ക് അയച്ചത്’ എന്നാണ്; ഇതു ശലോമോന്റെ സന്ദേശത്തിലെ അഭ്യർഥനയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായ വൃക്ഷനാമത്തിന്റെ കൃത്യമായ ഇനം അനിശ്ചിതമാണ്; ‘ജൂനിപ്പർമരം’ എന്നോ ‘ഫിർമരം’ എന്നോ ഇതു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל־שְׁלֹמֹה לֵאמֹר
  choice: പിന്നെ ഹീരാം ശലോമോന്റെ അടുക്കൽ ഇങ്ങനെ പറഞ്ഞയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘പിന്നെ’ എന്നു നൽകി. ‘പറഞ്ഞയച്ചു’ എന്നത് അയയ്ക്കുക എന്ന ക്രിയയും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളും സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: שָׁמַעְתִּי אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: നീ എനിക്ക് അയച്ചതു ഞാൻ കേട്ടു
  rationale: ‘അയച്ചത്’ എന്ന എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘അഭ്യർഥിച്ചത്’ എന്നാക്കാതെ നിലനിർത്തുന്നു; സന്ദേശത്തിന്റെ ഉള്ളടക്കം കേട്ടു എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֶעֱשֶׂה אֶת כָּל חֶפְצְךָ
  choice: നിന്റെ ആഗ്രഹമെല്ലാം ഞാൻ നിറവേറ്റും
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ ആഗ്രഹമെല്ലാം ചെയ്യും’ മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, ചെയ്യാനുള്ള പ്രതിബദ്ധത വ്യക്തമാക്കുന്ന ‘നിറവേറ്റും’ ഉപയോഗിച്ചു.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: ദേവദാരുത്തടിയുടെ കാര്യത്തിൽ
  rationale: നിർമാണസന്ദർഭത്തിൽ മരങ്ങളെക്കാൾ ഉപയോഗത്തിനുള്ള തടിയാണ് ഉദ്ദേശ്യമെന്നത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ב എന്ന ഉപസർഗം വിഷയപരിധി സൂചിപ്പിക്കുന്നതായി ‘കാര്യത്തിൽ’ എന്നു നൽകി.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: സൈപ്രസ് തടിയുടെയും
  rationale: בְּרוֹשִׁים എന്ന വൃക്ഷനാമത്തിന്റെ കൃത്യമായ ഇനം അനിശ്ചിതമാണെങ്കിലും ‘സൈപ്രസ്’ പൊതുവായി സ്വീകരിക്കപ്പെട്ട ഒരു സാധ്യതയാണ്; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
