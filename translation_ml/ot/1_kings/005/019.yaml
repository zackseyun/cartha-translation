base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: ml
  text: '“ഇതാ,[a] എന്റെ ദൈവമായ യഹ്‌വെയുടെ നാമത്തിനായി ഒരു ഭവനം[b] പണിയാൻ ഞാൻ ഉദ്ദേശിക്കുന്നു. യഹ്‌വെ എന്റെ പിതാവായ ദാവീദിനോടു പറഞ്ഞതുപോലെ: ‘നിനക്കു പകരം നിന്റെ സിംഹാസനത്തിൽ ഞാൻ ഇരുത്തുന്ന[c] നിന്റെ മകൻ—അവൻ തന്നെയാണ് എന്റെ നാമത്തിനായി ആ ഭവനം പണിയുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതാ’ എന്നത് ശ്രദ്ധ ക്ഷണിച്ച് തുടർന്നുള്ള പ്രഖ്യാപനത്തിന് ഊന്നൽ നൽകുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: discourse_note
  - marker: b
    text: അഥവാ ‘ദേവാലയം’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഭവനം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിന്റെ പിൻഗാമിയായി ഞാൻ നിയമിക്കുന്ന’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിനക്കു പകരം ഞാൻ നൽകുന്ന/ഇരുത്തുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിച്ചുകൊണ്ട് ശലോമോന്റെ ഇപ്പോഴത്തെ പ്രഖ്യാപനം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വ്യവഹാരശക്തി നിലനിർത്തുന്നു.
- source_word: אֹמֵר לִבְנוֹת
  choice: പണിയാൻ ഞാൻ ഉദ്ദേശിക്കുന്നു
  rationale: ഇവിടെ പങ്കാളിക്രിയയും അനന്തക്രിയയും ചേർന്ന പ്രയോഗം വെറും ‘പറയുന്നു’ എന്നതിലുപരി ഇപ്പോഴത്തെ ദൃഢമായ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു.
- source_word: בַּיִת
  choice: ഭവനം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘വീട്/ഭവനം’ നിലനിർത്തുകയും സന്ദർഭത്തിൽ അത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാകുകയും ചെയ്യുന്നു.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: എന്റെ ദൈവമായ യഹ്‌വെയുടെ നാമത്തിനായി
  rationale: ദൈവനാമത്തിനായി സമർപ്പിച്ച ഭവനം എന്ന ദേവാലയസംബന്ധിയായ എബ്രായ സൂത്രവാക്യം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: ശലോമോന്റെ ഉദ്ദേശ്യവും മുമ്പുണ്ടായ ദൈവിക വാഗ്ദാനവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം പ്രകടമാക്കുന്നു; ദൈവത്തിന്റെ വാക്കിന് യോജിച്ച ആദരഭാവവും നൽകുന്നു.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: നിനക്കു പകരം നിന്റെ സിംഹാസനത്തിൽ ഞാൻ ഇരുത്തുന്ന
  rationale: രാജകീയ പിൻഗാമിയെ നിയമിക്കുന്ന സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും ‘നിന്റെ സ്ഥാനത്ത്’ എന്നും ‘നിന്റെ സിംഹാസനത്തിൽ’ എന്നും ഉള്ള മൂലഘടകങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: הוּא
  choice: അവൻ തന്നെയാണ്
  rationale: നിർദിഷ്ടനായ മകനാണ് ഭവനം പണിയുക എന്ന എബ്രായ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ അംഗീകരിക്കപ്പെടുന്ന ‘Yahweh’ ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: ‘യഹ്‌വെയുടെ നാമത്തിനായി’ എന്ന ദേവാലയപ്രയോഗം
  choice: വാച്യഘടന നിലനിർത്തി
  alternative: യഹ്‌വെയെ ബഹുമാനിക്കാനായി
  rationale: ‘നാമം’ എന്ന ആശയം വെറും ബഹുമാനമായി ചുരുക്കാതെ, ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട നാമത്തോടും സാന്നിധ്യത്തോടും സമർപ്പണത്തോടും ബന്ധപ്പെട്ട മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ രാജകീയവും ദൈവികവുമായ പ്രസംഗത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഭവനം,’ ‘നാമത്തിനായി,’ ‘അവൻ തന്നെയാണ്’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു.
