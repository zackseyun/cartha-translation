  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: ml
  text: അവൻ സകല മനുഷ്യരിലും ജ്ഞാനിയായിരുന്നു—എസ്രാഹ്യനായ ഏഥാനെക്കാളും[a], മാഹോലിന്റെ പുത്രന്മാരായ ഹേമാൻ, കൽകോൽ, ദർദാ എന്നിവരെക്കാളും. ചുറ്റുമുള്ള സകല ജനതകളിലും അവന്റെ പേര് പ്രസിദ്ധമായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എസ്രാഹ്യൻ’ ഒരു വംശനാമമോ കുടുംബനാമമോ ആയിരിക്കാം; ചിലർ ഇതിനെ ‘സേരഹ്യൻ’ എന്നതുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ചുറ്റുമുള്ള സകല ജനതകളിലും അവന്റെ പേര് ഉണ്ടായിരുന്നു.’ ഇവിടെ ‘പേര്’ എന്നത് പ്രശസ്തിയെയോ കീർത്തിയെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם מִכָּל הָאָדָם
  choice: അവൻ സകല മനുഷ്യരിലും ജ്ഞാനിയായിരുന്നു
  rationale: חכם എന്ന ക്രിയയോടൊപ്പമുള്ള מן താരതമ്യത്തിന്റെ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘സകല മനുഷ്യരിലും ജ്ഞാനിയായിരുന്നു’ എന്നത് ജ്ഞാനത്തിലെ ശ്രേഷ്ഠത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; אָדָם എന്നതിന്റെ കൂട്ടായ മനുഷ്യവർഗ അർഥവും അനാവശ്യമായി പുരുഷന്മാരിൽ മാത്രം ചുരുക്കുന്നില്ല.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: എസ്രാഹ്യനായ ഏഥാനെക്കാളും
  rationale: הָאֶזְרָחִי എന്ന അനിശ്ചിത വംശ/കുടുംബനാമത്തെ വ്യാഖ്യാനിച്ച് തീർക്കാതെ ‘എസ്രാഹ്യൻ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: ഹേമാൻ, കൽകോൽ, ദർദാ
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנֵי מָחוֹל
  choice: മാഹോലിന്റെ പുത്രന്മാരായ
  rationale: പേരുകളുടെ പട്ടികയിൽ ഇത് ഏറ്റവും സ്വാഭാവികമായി പിതൃനാമമോ കുടുംബസൂചനയോ ആണ്; ‘നൃത്തത്തിന്റെ പുത്രന്മാർ’ പോലുള്ള അനുമാനവ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: וַיְהִי שְׁמוֹ בְכָל הַגּוֹיִם סָבִיב
  choice: ചുറ്റുമുള്ള സകല ജനതകളിലും അവന്റെ പേര് പ്രസിദ്ധമായി
  rationale: അക്ഷരാർഥം ‘അവന്റെ പേര് ... ഉണ്ടായിരുന്നു’ എന്നാണെങ്കിലും ഇവിടെ שֵׁם പ്രശസ്തിയെയോ കീർത്തിയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. സ്വാഭാവിക മലയാളത്തിനായി അർഥം വ്യക്തമാക്കി; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം നൽകി.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: സകല മനുഷ്യരിലും
  alternative: എല്ലാ പുരുഷന്മാരെക്കാളും
  rationale: אָדָם ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കാം; പിന്നാലെ പുരുഷജ്ഞാനികളുടെ പേരുകൾ വരുന്നത് അതിന്റെ വ്യാപ്തി നിർബന്ധമായി പുരുഷന്മാരിൽ മാത്രം ചുരുക്കുന്നില്ല. അതിനാൽ ഉറവിടത്തിലെ വിശാലസാധ്യത നിലനിർത്തി.
- issue: שְׁמוֹ എന്ന എബ്രായ പ്രയോഗം
  choice: അവന്റെ പേര് പ്രസിദ്ധമായി
  alternative: അവന്റെ പേര് ഉണ്ടായിരുന്നു
  rationale: സന്ദർഭത്തിൽ ‘പേര്’ എന്നത് കീർത്തിയെയോ പ്രസിദ്ധിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അക്ഷരാർഥം മാത്രം അസ്വാഭാവികവും അർഥം മങ്ങിയതുമായതിനാൽ ആശയം വ്യക്തമാക്കി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വ്യക്തിനാമങ്ങൾ ഉറവിട എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു. താരതമ്യഘടന വ്യക്തമായി നിലനിർത്തുകയും എബ്രായ ഭാഷാശൈലിയായ ‘പേര്’ എന്ന പ്രയോഗം വായനാസൗകര്യത്തിനായി അർഥസൂചനയോടെ പരിഭാഷപ്പെടുത്തുകയും ചെയ്തു.
