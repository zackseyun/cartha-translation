  yaml_path: translation/ot/1_kings/005/016.yaml
  text: Then Solomon sent to Hiram[a], saying[b],
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ ഹീരാമിന്റെ അടുക്കലേക്ക് ആളയച്ചു, ഇപ്രകാരം പറഞ്ഞു:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നിട്ട് ശലോമോൻ ഹീരാമിന്റെ അടുക്കലേക്ക് ആളയച്ചു, ഇപ്രകാരം പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ആഖ്യാനബന്ധകം സന്ദർഭമനുസരിച്ച് ‘അപ്പോൾ’ എന്നോ ‘എന്നിട്ട്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: മറ്റു ചില വാക്യങ്ങളിൽ ഈ പേര് ‘ഹൂരാം’ എന്ന രൂപത്തിൽ കാണുന്നു; ഇവിടെ ഹീബ്രുവിലുള്ള രൂപം ‘ഹീരാം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അപ്പോൾ ... ആളയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘അപ്പോൾ’ ക്രമാനുഗതത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സന്ദർഭത്തിൽ ഒരാളുടെ പക്കൽ ദൂതനെ അയയ്ക്കുക എന്ന അർഥം വ്യക്തമാക്കാൻ ‘ആളയച്ചു’ ഉപയോഗിച്ചു.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶל
  choice: അടുക്കൽ
  rationale: സ്വീകർത്താവിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന ഉപസർഗം; ‘ആളയച്ചു’ എന്ന ക്രിയയോടൊപ്പം ‘അടുക്കൽ’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: חִירָם
  choice: ഹീരാം
  rationale: ഈ വാക്യത്തിലെ חִירָם എന്ന ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കിയുള്ള ലിപ്യന്തരണം.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞത്:'
  rationale: അയച്ച സന്ദേശത്തിലെ തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖം നൽകുന്ന infinitive construct. മലയാളത്തിൽ ‘പറഞ്ഞത്:’ എന്നത് ഈ ഉദ്ധരണി-ആമുഖം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർന്നുവരുന്ന സന്ദേശത്തിന് ആമുഖമാകുന്നതിനാൽ വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു ചേർത്തിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
