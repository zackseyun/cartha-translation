  to: അപ്പോൾ ശലോമോൻ ഹീരാമിന്റെ അടുക്കലേക്ക് ആളയച്ചു, ഇപ്രകാരം പറഞ്ഞു:[a][b]
  rationale: The revision changes only the malformed Malayalam speech-introducing syntax. It preserves the narrative sequence, the direction toward Hiram, the implicit sending of a person/message, and the function of לֵאמֹר as an introduction to the following speech. Footnote a is revised to be grammatical and to state the conjunctional alternative accurately; footnote b remains substantively sound.
