    text: ‘കുതിരശാലകൾ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദം കൂടുതൽ കൃത്യമായി കുതിരകളെ കെട്ടിയിടുന്നതിനും തീറ്റ നൽകുന്നതിനുമുള്ള പ്രത്യേക ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
