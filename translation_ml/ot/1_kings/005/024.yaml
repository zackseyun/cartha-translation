  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: ml
  text: ഹീരാം ശലോമോൻ ആഗ്രഹിച്ചതെല്ലാം അനുസരിച്ച് ദേവദാരു മരത്തടികളും സൈപ്രസ് മരത്തടികളും[a] ശലോമോന് കൊടുത്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ജൂനിപ്പർ മരത്തടികൾ’; പരമ്പരാഗതമായി ‘ഫിർ മരത്തടികൾ’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്. എബ്രായത്തിലെ ‘ബെരോഷീം’ എന്ന പദം സൂചിപ്പിക്കുന്ന കൃത്യമായ വൃക്ഷജാതി അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... נֹתֵן
  choice: കൊടുത്തുകൊണ്ടിരുന്നു
  rationale: വർത്തമാനകൃദന്തത്തോടുകൂടിയ ഭൂതകാല ആഖ്യാനഘടന തുടരുന്ന അഥവാ പതിവായിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൊടുത്തുകൊണ്ടിരുന്നു’ ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חִירוֹם
  choice: ഹീരാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോന്
  rationale: לְ എന്ന ദിശാ/സ്വീകർത്തൃബന്ധം മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-ന്’ വഴി വ്യക്തമാക്കുന്നു; പേര് എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: עֲצֵי אֲרָזִים
  choice: ദേവദാരുമരത്തടികൾ
  rationale: നിർമാണസാമഗ്രികളുടെ സന്ദർഭത്തിൽ עֵץ എന്നത് ജീവനുള്ള മരങ്ങളേക്കാൾ ഉപയോഗത്തിനുള്ള മരം/മരത്തടി എന്ന അർഥത്തിലാണ്; ‘ദേവദാരു’ אֶרֶז എന്ന പദത്തിന്റെ പതിവായ അനുയോജ്യനാമമാണ്.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: സരളമരത്തടികൾ
  rationale: בְּרוֹשׁ ഒരു നിർമാണയോഗ്യമായ ശങ്കുവൃക്ഷത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും കൃത്യമായ വൃക്ഷജാതി അനിശ്ചിതമാണ്. മലയാളത്തിൽ പരിചിതമായ ‘സരളം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל חֶפְצוֹ
  choice: അവൻ ആഗ്രഹിച്ചതൊക്കെയും അനുസരിച്ച്
  rationale: חֵפֶץ എന്നത് ഇവിടെ ശലോമോന്റെ ആഗ്രഹം അഥവാ അഭ്യർഥനയുടെ പൂർണപരിധി സൂചിപ്പിക്കുന്നു. ‘അനുസരിച്ച്’ എന്നത് അളവിന്റെയും ആവശ്യത്തിനനുസൃതമായ വിതരണത്തിന്റെയും ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
