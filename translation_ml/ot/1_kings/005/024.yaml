translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഭൂതകാലത്തിലെ തുടർച്ചയായ വിതരണത്തെ ‘കൊടുത്തുകൊണ്ടിരുന്നു’ എന്നു നിലനിർത്തി; സാങ്കേതിക വൃക്ഷജാതി സംബന്ധിച്ച അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
