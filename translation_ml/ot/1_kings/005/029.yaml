source:
  edition: WLC
  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: ml
  text: ശലോമോന് ചുമടു വഹിക്കുന്ന എഴുപതിനായിരം പേരും മലമ്പ്രദേശത്ത് കല്ലുവെട്ടുന്ന എൺപതിനായിരം പേരും ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മലയിൽ വെട്ടുന്നവർ.” എബ്രായത്തിലെ “വെട്ടുന്നവർ” എന്നത് ഈ നിർമാണസന്ദർഭത്തിൽ കല്ലുവെട്ടുന്നവരെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: ശലോമോന് … ഉണ്ടായിരുന്നു
  rationale: היה + ל എന്ന എബ്രായ ഘടന അസ്തിത്വത്തോടുകൂടിയ ഉടമസ്ഥതയെയോ ഒരാളുടെ കീഴിൽ ആളുകൾ ഉണ്ടായിരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ വാക്യക്രമം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שִׁבְעִים אֶלֶף
  choice: എഴുപതിനായിരം പേർ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; തൊഴിലാളികളെയാണ് എണ്ണുന്നതെന്ന് വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
- source_word: נֹשֵׂא סַבָּל
  choice: ചുമട്ടുകാർ
  rationale: ‘ചുമടു വഹിക്കുന്നവർ’ എന്ന തൊഴിൽപരമായ അർഥം ആധുനിക മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: എൺപതിനായിരം പേർ
  rationale: സംഖ്യ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മനുഷ്യത്തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: חֹצֵב
  choice: കല്ലുവെട്ടുകാർ
  rationale: חצב എന്നത് വെട്ടിയെടുക്കുക/കൊത്തിയെടുക്കുക എന്നാണ്. നിർമാണസന്ദർഭം സൂചിപ്പിക്കുന്ന കല്ല് എന്ന കർമം മൂലപാഠത്തിൽ പ്രസ്താവിച്ചിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ ശക്തമായി നിഗൂഢമാണ്; ‘കല്ലുവെട്ടുകാർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: בָּהָר
  choice: മലമ്പ്രദേശത്ത്
  rationale: ഏകവചനമായ הַר ഇവിടെ ഭൂപ്രദേശത്തെ സമാഹാരമായി സൂചിപ്പിക്കാം. ‘മലമ്പ്രദേശത്ത്’ എന്നത് ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥമായ ‘മലയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
