translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. ‘ചുമട്ടുകാർ’, ‘കല്ലുവെട്ടുകാർ’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന തൊഴിൽപദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ചുരുക്കവും വാക്യസമത്വവും സാധ്യമായത്ര നിലനിർത്തി.
