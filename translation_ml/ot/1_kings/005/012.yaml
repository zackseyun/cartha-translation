id: 1KI.5.12
reference: 1 Kings 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֕ר שְׁלֹ֥שֶׁת אֲלָפִ֖ים מָשָׁ֑ל וַ/יְהִ֥י שִׁיר֖/וֹ חֲמִשָּׁ֥ה וָ/אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/012.yaml
  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: ml
  text: അവൻ മൂവായിരം സദൃശവാക്യങ്ങൾ[a] പറഞ്ഞു; അവന്റെ ഗാനങ്ങൾ ആയിരത്തിയഞ്ച് ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മൂവായിരം ജ്ഞാനവചനങ്ങൾ,’ ‘മൂവായിരം പഴഞ്ചൊല്ലുകൾ,’ അല്ലെങ്കിൽ ‘മൂവായിരം ഉപമകൾ’; എബ്രായത്തിലെ מָשָׁל (മാശാൽ) എന്ന പദത്തിന് ‘സദൃശവാക്യം’ എന്നതിനെക്കാൾ വിശാലമായ അർഥവ്യാപ്തിയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: പീയേൽ രൂപത്തിലുള്ള דבר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘സംസാരിക്കുക/പറയുക’ എന്നതാണ്. സന്ദർഭത്തിൽ രചിച്ചു എന്ന ആശയം ഉൾപ്പെടാമെങ്കിലും, മൂലപദം അതു വ്യക്തമാക്കുന്നില്ല.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: മൂവായിരം
  rationale: സംഖ്യയെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപത്തിൽ നൽകി.
- source_word: מָשָׁל
  choice: സദൃശവാക്യങ്ങൾ
  rationale: ശലോമോന്റെ ജ്ഞാനപാരമ്പര്യത്തോട് യോജിക്കുന്ന പരിചിതമായ മലയാള ബൈബിൾപദമാണിത്. എങ്കിലും എബ്രായപദത്തിന് പഴഞ്ചൊല്ല്, ജ്ഞാനവചനം, ഉപമ തുടങ്ങിയ വിശാലമായ അർഥവ്യാപ്തിയുള്ളതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היה ആകെ എണ്ണം സൂചിപ്പിക്കുന്ന ബന്ധകക്രിയയായി പ്രവർത്തിക്കുന്നു; ‘ആയിരുന്നു’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: שִׁירוֹ
  choice: അവന്റെ ഗാനങ്ങൾ
  rationale: എബ്രായത്തിൽ ഏകവചനരൂപമാണെങ്കിലും സംഖ്യയ്ക്കുശേഷം കൂട്ടാർഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: ആയിരത്തിയഞ്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘അഞ്ചും ആയിരവും’ എന്ന എബ്രായക്രമത്തെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകി; കൃത്യമായ എണ്ണം 1,005 നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറഞ്ഞു’ എന്നത് മൂലക്രിയയുടെ വാചികസ്വഭാവം നിലനിർത്തുന്നു; ‘രചിച്ചു’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല. സംഖ്യകളും കൂട്ടാർഥ ഏകവചനങ്ങളും മലയാളവ്യാകരണത്തിന് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
