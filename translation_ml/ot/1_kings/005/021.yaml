id: 1KI.5.21
reference: 1 Kings 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: ml
  text: 'ഹീരാം ശലോമോന്റെ വാക്കുകൾ കേട്ടപ്പോൾ അത്യന്തം സന്തോഷിച്ചു പറഞ്ഞു: “ഈ വലിയ ജനതയുടെ മേൽ ഭരണാധികാരിയായി ജ്ഞാനിയായ ഒരു മകനെ ദാവീദിന് നൽകിയ യഹോവ ഇന്ന് വാഴ്ത്തപ്പെട്ടവനായിരിക്കട്ടെ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ/കാര്യങ്ങൾ’ എന്ന അർഥമുള്ള ദְּבָרִים ഇവിടെ ശലോമോൻ അറിയിച്ച സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലരൂപത്തോട് ചേർന്ന് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: അത്യന്തം സന്തോഷിച്ചു
  rationale: מְאֹד നൽകുന്ന ശക്തമായ തീവ്രത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: യഹോവ ഇന്ന് വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: ബാരൂഖ് എന്ന ആശീർവാദ/സ്തുതിസൂത്രത്തിന്റെ അർഥവും ‘ഇന്ന്’ എന്ന കാലസൂചനയും നിലനിർത്തുന്നു; ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു പ്രത്യക്ഷമായി നൽകിയിരിക്കുന്നു.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: ഈ വലിയ ജനതയെ ഭരിക്കാൻ
  rationale: עַל എന്നത് മകൻ ഈ ജനത്തിനുമേൽ അധികാരസ്ഥാനത്താണെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായി ‘ഭരിക്കാൻ’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ തുറന്നുവെക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനപരമായ നിലപാട് ചേർക്കുന്നില്ല.
- issue: ഹീരാമിന്റെ വാക്കുകളുടെ സ്വഭാവം
  choice: നേരിട്ടുള്ള യഹോവാസ്തുതിയായി നിലനിർത്തി
  alternative: ഹീരാം യിസ്രായേലിന്റെ വിശ്വാസം പൂർണമായി ഏറ്റെടുത്തുവെന്ന സൂചന നൽകുക
  rationale: വാക്യം ഹീരാമിന്റെ ആന്തരിക മതനിലപാട് നിർണയിക്കുന്നില്ല; അതിനാൽ പാഠത്തിൽ ഉള്ള സ്തുതി മാത്രം പരിഭാഷപ്പെടുത്തി, അധിക നിഗമനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രു വാക്യക്രമത്തിന്റെ ഭാരം ഒഴിവാക്കി സ്വാഭാവിക മലയാളക്രമം സ്വീകരിച്ചു; രാജഭരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘ഭരിക്കാൻ’ ഉപയോഗിച്ചു.
