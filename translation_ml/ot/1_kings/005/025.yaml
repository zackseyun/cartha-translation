id: 1KI.5.25
reference: 1 Kings 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁלֹמֹה֩ נָתַ֨ן לְ/חִירָ֜ם עֶשְׂרִים֩ אֶ֨לֶף כֹּ֤ר חִטִּים֙ מַכֹּ֣לֶת לְ/בֵית֔/וֹ וְ/עֶשְׂרִ֥ים כֹּ֖ר שֶׁ֣מֶן כָּתִ֑ית כֹּֽה יִתֵּ֧ן שְׁלֹמֹ֛ה לְ/חִירָ֖ם שָׁנָ֥ה בְ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: ml
  text: ശലോമോൻ ഹീരാമിന്, അവന്റെ കുടുംബത്തിനുള്ള ഭക്ഷണമായി ഇരുപതിനായിരം കോർ ഗോതമ്പും[a] ഇടിച്ചെടുത്ത എണ്ണ ഇരുപത് കോറും[b] കൊടുത്തു. ഇങ്ങനെ ശലോമോൻ ഹീരാമിന് ആണ്ടുതോറും കൊടുത്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ രാജഗൃഹത്തിനുള്ള ഉപജീവനസാധനങ്ങളായി.’ എബ്രായപ്രയോഗം ഹീരാമിന്റെ രാജകുടുംബത്തിനോ രാജഗൃഹത്തിനോ നൽകിയ ഭക്ഷണസാധനങ്ങളെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇടിച്ചെടുത്ത എണ്ണ’ എന്നത് ഒലിവുകൾ ഇടിച്ചോ ചതച്ചോ, പിന്നീടുള്ള അമർത്തിപ്പിഴിയൽ രീതി ഉപയോഗിക്കാതെ, ഉണ്ടാക്കിയ ഉയർന്ന ഗുണമേന്മയുള്ള എണ്ണയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: കൊടുത്തു / കൊടുത്തുപോന്നു
  rationale: ആദ്യ ക്രിയ പൂർത്തിയായ പ്രവൃത്തിയെയും, כֹּה എന്നതോടുകൂടിയ രണ്ടാമത്തെ അപൂർണക്രിയ ആണ്ടുതോറുമുള്ള പതിവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: כֹּר
  choice: കോർ
  rationale: പുരാതനകാലത്തെ നിർദിഷ്ടമായ അളവുഘടകം പൊതുവായ ‘അളവ്’ എന്നു മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: חִטִּים
  choice: ഗോതമ്പ്
  rationale: ഈ പദം പൊതുവെ ധാന്യമല്ല, പ്രത്യേകമായി ഗോതമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: അവന്റെ കുടുംബത്തിനുള്ള ഭക്ഷണമായി
  rationale: מַכֹּלֶת ഭക്ഷണമോ ഉപജീവനസാധനങ്ങളോ എന്നും בֵּיתוֹ ഇവിടെ ഹീരാമിന്റെ കുടുംബത്തെയോ രാജഗൃഹത്തെയോ എന്നും സൂചിപ്പിക്കുന്നു.
- source_word: שֶׁמֶן כָּתִית
  choice: ഇടിച്ചെടുത്ത എണ്ണ
  rationale: כָּתִית അമർത്തിപ്പിഴിയുന്നതിനു പകരം ഇടിച്ചോ ചതച്ചോ എടുത്ത ഉയർന്ന ഗുണമേന്മയുള്ള എണ്ണയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഒലിവ് എന്ന പദം വ്യക്തമല്ല.
- source_word: כֹּה
  choice: ഇങ്ങനെ
  rationale: മുമ്പ് പറഞ്ഞ അളവുകൾ തുടർന്നുള്ള വാർഷിക പതിവിന്റെ രീതിയായി അവതരിപ്പിക്കുന്നു.
- source_word: שָׁנָה בְשָׁנָה
  choice: ആണ്ടുതോറും
  rationale: പതിവായ വാർഷിക ആവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പുരാതന അളവുഘടകമായ ‘കോർ’ നിലനിർത്തി. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളുമായി കൃത്യമായി ചേർത്തിരിക്കുന്നു.
