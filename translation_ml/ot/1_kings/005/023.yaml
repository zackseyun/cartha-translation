source:
  edition: WLC
  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: ml
  text: എന്റെ സേവകർ അവയെ ലെബാനോനിൽനിന്ന് കടലിലേക്കു ഇറക്കിക്കൊണ്ടുവരും. നീ എന്നോടു നിർദേശിക്കുന്ന സ്ഥലത്തേക്കു ഞാൻ അവയെ കടലിലൂടെ ചങ്ങാടങ്ങളാക്കി എത്തിക്കും; അവിടെവെച്ചു അവയെ അഴിച്ചുപിരിക്കും, നീ അവ കൊണ്ടുപോകും. എന്റെ ഭവനത്തിലുള്ളവർക്കു ഭക്ഷണം നൽകിക്കൊണ്ട് നീ എന്റെ ആഗ്രഹം നിറവേറ്റും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എന്റെ ഭവനത്തിന് അപ്പം നൽകിക്കൊണ്ട്”; ഇവിടെ “അപ്പം” ഭക്ഷണമോ ഭക്ഷണസാധനങ്ങളോ പൊതുവായി സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: എന്റെ ദാസന്മാർ
  rationale: രാജകീയ ഭരണ-തൊഴിൽ പശ്ചാത്തലത്തിൽ ഹീരാമിന്റെ കീഴിലുള്ള സേവകരെയോ തൊഴിലാളികളെയോ സൂചിപ്പിക്കുന്നു; അടിമത്തസ്ഥിതി ഇവിടെ ഊന്നിപ്പറയുന്നില്ല.
- source_word: יֹרִדוּ
  choice: ഇറക്കിക്കൊണ്ടുവരും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർത്ഥവും ലെബാനോനിൽനിന്ന് തീരത്തേക്കുള്ള താഴോട്ടുള്ള നീക്കവും പ്രകടമാക്കുന്നു.
- source_word: יָמָּה
  choice: കടലിലേക്ക്
  rationale: രൂപത്തിന് ‘കടൽവശത്തേക്ക്’ എന്ന അർഥവുമുണ്ടെങ്കിലും, ഈ സമുദ്രഗതാഗതസന്ദർഭത്തിൽ കടൽ എന്ന ലക്ഷ്യസ്ഥാനം വ്യക്തമാണ്.
- source_word: אֲשִׂימֵם דֹּבְרוֹת בַּיָּם
  choice: അവയെ കടലിൽ ചങ്ങാടങ്ങളാക്കി എത്തിക്കും
  rationale: മരത്തടികൾ കൂട്ടിക്കെട്ടിയൊഴുക്കുന്ന ചങ്ങാടങ്ങളാക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള തുടർന്നുള്ള ഗതിയും വാക്യത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: നീ എന്നോടു നിർദേശിക്കുന്ന സ്ഥലത്തേക്ക്
  rationale: ശലഹ് ഇവിടെ സന്ദേശം അയച്ച് ലക്ഷ്യസ്ഥാനം അറിയിക്കുക/നിർദേശിക്കുക എന്ന പ്രായോഗിക അർഥത്തിൽ ഗ്രഹിക്കപ്പെടുന്നു.
- source_word: וְנִפַּצְתִּים
  choice: അവയെ അഴിച്ചുവിടും
  rationale: ചങ്ങാടങ്ങളായി കൂട്ടിക്കെട്ടിയ മരത്തടികളെ ലക്ഷ്യസ്ഥാനത്ത് വേർപെടുത്തുന്നതാണ് സന്ദർഭാർത്ഥം; ‘തകർക്കും’ എന്നു പറഞ്ഞാൽ മരത്തടികൾ നശിപ്പിക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
- source_word: וְאַתָּה תִשָּׂא
  choice: നീ അവ കൊണ്ടുപോകണം
  rationale: നശാ എന്ന വിശാലമായ ‘എടുക്കുക/ചുമക്കുക/കൊണ്ടുപോകുക’ അർഥം ചരക്കുനീക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֶפְצִי
  choice: എന്റെ ആഗ്രഹം
  rationale: ഹീരാമിന്റെ ഇഷ്ടമോ അഭ്യർഥനയോ എന്ന വ്യക്തിപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: എന്റെ ഭവനത്തിനു ഭക്ഷണം നൽകിക്കൊണ്ട്
  rationale: ‘അപ്പം’ ഇവിടെ ഭക്ഷണം/ഉപജീവനസാധനങ്ങൾ എന്ന വിപുലമായ അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കാം; ‘ഭവനം’ രാജകീയ ഗൃഹത്തെയും ആശ്രിതരെയും ഉൾക്കൊള്ളുന്നു.
