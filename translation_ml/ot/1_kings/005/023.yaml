  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. രാജകീയ സന്ദേശത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്താൻ ഭാവികാലത്തിനുപകരം നിർദേശാത്മകമായ ‘വേണം’ ചിലിടങ്ങളിൽ ഉപയോഗിച്ചു. മൂലത്തിലെ ദീർഘമായ ഏകവാക്യം വായനാസൗകര്യത്തിന് രണ്ട് വാക്യങ്ങളാക്കി.
