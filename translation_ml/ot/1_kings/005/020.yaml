- source_word: וְעַתָּה
  choice: ആകയാൽ ഇപ്പോൾ
  rationale: അഭ്യർഥനയിലേക്കുള്ള ആശയമാറ്റം സൂചിപ്പിക്കുന്ന പ്രയോഗം; സന്ദർഭബന്ധവും ‘ഇപ്പോൾ’ എന്ന കാലസൂചനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: എനിക്കുവേണ്ടി ... വെട്ടാൻ കല്പിക്കുക
  rationale: കല്പനയ്ക്കു പിന്നാലെയുള്ള അഭ്യർഥനാത്മക ക്രിയാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ infinitive construction ആയി നൽകുന്നു.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: ലെബാനോനിൽനിന്ന് ... ദേവദാരുമരങ്ങൾ
  rationale: אֲרָזִים എന്ന വൃക്ഷനാമവും മരം ലഭിക്കുന്ന സ്ഥലവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: എന്റെ ദാസന്മാർ നിന്റെ ദാസന്മാരോടൊപ്പം ഉണ്ടായിരിക്കും
  rationale: രണ്ടുവിഭാഗം തൊഴിലാളികൾ ഒരുമിച്ചു പ്രവർത്തിക്കുമെന്ന ക്രമീകരണം നിലനിർത്തുകയും ആവർത്തിച്ച עבד എന്ന പദം ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: നിന്റെ ദാസന്മാരുടെ കൂലി ... ഞാൻ നിനക്കു തരാം
  rationale: שְׂכַר തൊഴിൽക്കുള്ള കൂലിയെയോ പ്രതിഫലത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൂലി’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: നീ പറയുന്നതുപോലെ മുഴുവനും
  rationale: തീരുമാനിക്കുന്ന മുഴുവൻ തുകയും നിബന്ധനയും അംഗീകരിക്കുന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: אֵין בָּנוּ אִישׁ
  choice: ഒരാൾപോലും ഞങ്ങളുടെ ഇടയിൽ ഇല്ല
  rationale: אִישׁ ഇവിടെ ആവശ്യമായ വൈദഗ്ധ്യമുള്ള വ്യക്തിയുടെ അഭാവം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരാൾപോലും’ സ്വാഭാവികവും അർത്ഥവിശ്വസ്തവുമാണ്.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: മരം വെട്ടാൻ അറിയുന്ന
  rationale: ക്രിയാപ്രയോഗം വൈദഗ്ധ്യം സൂചിപ്പിക്കുന്നു; നിർമാണത്തിനായുള്ള മരം ശേഖരിക്കുന്ന സന്ദർഭത്തിൽ ‘മരം വെട്ടുക’ സ്വാഭാവികമാണ്, അതേസമയം പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כַּצִּדֹנִים
  choice: സീദോന്യരെപ്പോലെ
  rationale: മരംവെട്ടുന്നതിലെ സീദോന്യരുടെ പ്രസിദ്ധമായ വൈദഗ്ധ്യത്തോടുള്ള നേരിട്ടുള്ള താരതമ്യം സംരക്ഷിക്കുന്നു.
