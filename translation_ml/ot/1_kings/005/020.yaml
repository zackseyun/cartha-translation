  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: ml
  text: ഇപ്പോൾ ലെബാനോനിൽനിന്ന് എനിക്കുവേണ്ടി ദേവദാരുക്കൾ വെട്ടാൻ കൽപ്പിക്കണമേ. എന്റെ ദാസന്മാർ നിന്റെ ദാസന്മാരോടുകൂടെ ഇരിക്കട്ടെ; നിന്റെ ദാസന്മാരുടെ കൂലി, നീ പറയുന്നതെല്ലാം അനുസരിച്ച്, ഞാൻ നിനക്കു തരാം. സീദോന്യരെപ്പോലെ മരം[b] വെട്ടാൻ അറിയുന്ന ഒരാൾപോലും[a] ഞങ്ങളുടെ ഇടയിൽ ഇല്ലെന്ന് നിനക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ പദശഃ ‘ഞങ്ങളുടെ ഇടയിൽ ഒരു പുരുഷനും ഇല്ല.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് സമാനമായ വൈദഗ്ധ്യമുള്ള ആരും ഇല്ല എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരങ്ങൾ വെട്ടാൻ.’ എബ്രായപാഠത്തിൽ പദശഃ ‘മരങ്ങൾ/വൃക്ഷങ്ങൾ വെട്ടുക’ എന്നാണ്; സന്ദർഭം നിർമാണത്തിനായുള്ള മരം മുറിച്ചെടുക്കുന്നതാണ്.
    reason: lexical_alternative
