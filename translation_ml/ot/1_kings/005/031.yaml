translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ നിർമാണപദാവലി ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ ക്രമാനുസൃത പ്രവർത്തനവും കല്ലുകളെ വിശേഷിപ്പിക്കുന്ന സമാന്തര പദങ്ങളും നിലനിർത്തി; എന്നാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി വിശേഷണങ്ങൾ ഏകോപിപ്പിച്ചു. അടിക്കുറിപ്പുകളുടെ വിഷയത്തോട് പൊരുത്തപ്പെടുന്നതിനായി [a] ‘ചെത്തിയ കല്ലുകൾ’ എന്നതിനോടും [b] ‘ആലയം’ എന്നതിനോടും ചേർത്തു.
