  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് കല്പിച്ചു; ആലയത്തിന്റെ[b] അടിത്തറയിടാൻ അവർ വലിയ കല്ലുകളും വിലയേറിയ കല്ലുകളും ചെത്തിയ കല്ലുകളും[a] എടുത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊത്തിയ കല്ലുകൾ’ അല്ലെങ്കിൽ ‘മിനുക്കിയൊരുക്കിയ കല്ലുകൾ.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ദൈവാലയം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഭവനം.’
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: അപ്പോൾ രാജാവ് കല്പിച്ചു
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന wayyiqtol രൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു പ്രകടിപ്പിക്കുന്നു; ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കല്പിച്ചു’ എന്നാണ്.
- source_word: וַיַּסִּעוּ
  choice: ഖനിയിൽനിന്നു വെട്ടിയെടുത്തു
  rationale: נסע എന്ന ക്രിയയുടെ അടിസ്ഥാന ആശയം നീക്കുക/പിഴുതെടുക്കുക എന്നതാണെങ്കിലും, നിർമാണത്തിനുള്ള വലിയ കല്ലുകളുടെ പശ്ചാത്തലത്തിൽ ഖനിയിൽനിന്ന് കല്ലുകൾ വെട്ടിയെടുക്കുന്നതാണ് ഉദ്ദേശ്യമെന്നു വ്യക്തമാക്കുന്ന സന്ദർഭോചിത പരിഭാഷ.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: വലിപ്പമേറിയ ... കല്ലുകൾ
  rationale: കല്ലുകളുടെ ഭൗതിക വലിപ്പമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: אֲבָנִים יְקָרוֹת
  choice: വിലയേറിയ ... കല്ലുകൾ
  rationale: יקר ഇവിടെ രത്നങ്ങളെയല്ല, ചെലവേറിയതോ ഉന്നതഗുണമുള്ളതോ ആയ നിർമാണക്കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְיַסֵּד
  choice: അടിത്തറയിടാൻ
  rationale: നിർമാണസന്ദർഭത്തിൽ יסד എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַבָּיִת
  choice: ആലയം
  rationale: എബ്രായത്തിലെ പദം അക്ഷരാർഥത്തിൽ ‘ഭവനം/വീട്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ശലോമോൻ പണിയുന്ന ദൈവാലയമാണ്; ‘ആലയം’ ഉറവിടത്തിലെ ഭവനസങ്കൽപ്പവും സന്ദർഭവും ഒരുമിച്ച് സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: אַבְנֵי גָזִית
  choice: ചെത്തിയ കല്ലുകൾ
  rationale: גזית ഖനിയിൽനിന്നെടുത്തശേഷം അളവൊപ്പിച്ച് ചെത്തി ഒരുക്കിയ നിർമാണക്കല്ലുകളെ സൂചിപ്പിക്കുന്നു; ‘ചെത്തിയ കല്ലുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
