  yaml_path: translation/ot/1_kings/005/002.yaml
  text: Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
translation:
  language: ml
  text: ശലോമോന്റെ ഒരു ദിവസത്തേക്കുള്ള ഭക്ഷണസാധനങ്ങൾ[a] മുപ്പത് കോർ[b] നന്നായി അരിച്ച മാവും അറുപത് കോർ മാവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘അപ്പം’; ഇവിടെ ശലോമോന്റെ ദിവസേനയുള്ള ഭക്ഷണസാധനങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കോർ’ പുരാതനകാലത്തെ വലിയൊരു ഉണങ്ങിയ അളവായിരുന്നു. എബ്രായപാഠത്തിൽ ‘മുപ്പത് കോർ’ എന്നും ‘അറുപത് കോർ’ എന്നും വായിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയിൽ അവസ്ഥ വ്യക്തമാക്കുന്ന היה എന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: לֶחֶם
  choice: ഭക്ഷണസാധനങ്ങൾ
  rationale: അക്ഷരാർഥം ‘അപ്പം’ എന്നാണെങ്കിലും, അളന്ന മാവിനെക്കുറിച്ചുള്ള ഈ രാജകീയ ഭരണസന്ദർഭത്തിൽ ദിവസേന വേണ്ട ഭക്ഷ്യവകകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹמֹה
  choice: ശലോമോന്റെ
  rationale: പേരിന്റെ അംഗീകൃത മലയാളരൂപവും ഹീബ്രായിലെ ഉടമസ്ഥബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְיוֹם אֶחָד
  choice: ഒരു ദിവസത്തേക്കുള്ള
  rationale: ഒരു ദിവസത്തേക്ക് ആവശ്യമായ അളവ് എന്ന ആശയം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: שְׁלֹשִׁים כֹּר
  choice: മുപ്പത് കോർ
  rationale: പുരാതന അളവിനെ അനിശ്ചിതമായ ആധുനിക അളവാക്കി മാറ്റാതെ മൂലത്തിലെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: നന്നായി അരിച്ചോ പൊടിച്ചോ തയ്യാറാക്കിയ ഉന്നതഗുണമുള്ള നേർമാവിനെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള קָמַח-ൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְשִׁשִּׁים כֹּר
  choice: അറുപത് കോർ
  rationale: അതേ അളവുപദം ഏകീകൃതമായി നിലനിർത്തുന്നു.
- source_word: קָמַח
  choice: സാധാരണ മാവ്
  rationale: സֹלֶת എന്ന നേർമാവിനോടുള്ള വ്യത്യാസം വായനക്കാരന് വ്യക്തമാക്കുന്നു; മൂലത്തിലെ പൊതുവായ മാവെന്ന അർഥം സംരക്ഷിക്കുന്നു.
