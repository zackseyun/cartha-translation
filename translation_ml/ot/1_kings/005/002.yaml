  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഭരണവിവരണശൈലി. പുരാതന അളവുപദമായ ‘കോർ’ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തി; സֹלֶת, קָמַח എന്നീ രണ്ടുതരം മാവുകളുടെ വ്യത്യാസം ‘നേരിയ മാവ്’, ‘സാധാരണ മാവ്’ എന്നിങ്ങനെ വ്യക്തമാക്കി.
