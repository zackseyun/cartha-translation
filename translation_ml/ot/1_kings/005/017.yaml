  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: ml
  text: “എന്റെ പിതാവായ ദാവീദിന്, അവനെ ചുറ്റിയിരുന്ന യുദ്ധം നിമിത്തം, അവന്റെ ദൈവമായ യാഹ്‌വെയുടെ നാമത്തിനായി ഒരു ഭവനം പണിയാൻ കഴിഞ്ഞില്ല; യാഹ്‌വെ അവരെ അവന്റെ പാദതലങ്ങൾക്കു കീഴിലാക്കുന്നതുവരെ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കാലുകൾക്കു കീഴിൽ.’ എബ്രായപാഠത്തിൽ കൂടുതൽ പൂർണമായി ‘അവന്റെ പാദതലങ്ങൾക്കു കീഴിൽ’ എന്നാണ്; ഇത് കീഴടക്കലിന്റെ ദൃശ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: നിനക്കറിയാമല്ലോ
  rationale: ക്രിയയുടെ പൂർണരൂപത്തിന് ഇവിടെ വർത്തമാനകാല അറിവിന്റെ അർഥമാണ്. സ്വതന്ത്ര സർവനാമമായ אַתָּה നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘-ല്ലോ’ വഴി സൂചിപ്പിച്ചു.
- source_word: דָּוִד אָבִי
  choice: എന്റെ പിതാവായ ദാവീദ്
  rationale: ബന്ധവും പേരും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בַּיִת
  choice: ഒരു ആലയം
  rationale: അക്ഷരാർഥം ‘ഒരു ഭവനം’ എന്നാണെങ്കിലും ഇവിടെ ഉദ്ദേശിക്കുന്നത് യാഹ്‌വെയ്ക്കായി പണിയേണ്ട വിശുദ്ധമന്ദിരമാണ്. ‘ക്ഷേത്രം’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘ആലയം’ തിരഞ്ഞെടുത്തു.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: അവന്റെ ദൈവമായ യാഹ്‌വെയുടെ നാമത്തിനായി
  rationale: ‘നാമത്തിനായി’ എന്ന ഉടമ്പടിസംബന്ധമായ എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: അവനെ ചുറ്റിയിരുന്ന യുദ്ധങ്ങൾ നിമിത്തം
  rationale: ‘യുദ്ധം’ എന്ന ഏകവചന സമാഹാരനാമത്തോടൊപ്പം ബഹുവചന ക്രിയയും തുടർന്ന് ‘അവയെ’ എന്ന ബഹുവചന സർവനാമവും വരുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായി ‘യുദ്ധങ്ങൾ’ എന്നു നൽകി. ചുറ്റിയിരിക്കുക എന്ന മൂലദൃശ്യവും നിലനിർത്തി.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: യാഹ്‌വെ ആ യുദ്ധങ്ങളെ … കീഴിലാക്കുന്നതുവരെ
  rationale: נתן എന്ന ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘വെക്കുക/നൽകുക’ എന്നാണെങ്കിലും കാലുകൾക്കു കീഴിൽ വെക്കുക എന്ന പ്രയോഗത്തിൽ കീഴടക്കലാണ് ഉദ്ദേശ്യം. മുമ്പുള്ള ബഹുവചനത്തെ ‘ആ യുദ്ധങ്ങളെ’ എന്നു വ്യക്തമായി പുനരെടുത്തു.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: അവന്റെ കാൽപ്പാദങ്ങൾക്കു കീഴിൽ
  rationale: כַּפּוֹת എന്നത് പാദത്തിന്റെ അടിവശങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘കാൽപ്പാദങ്ങൾ’ മൂലരൂപത്തിന്റെ പൂർണമായ കീഴടക്കൽദൃശ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: യുദ്ധങ്ങളെ കാല്പാദങ്ങൾക്കു കീഴിലാക്കുന്ന ദൃശ്യം
  choice: യുദ്ധങ്ങളെ വ്യക്തിവൽക്കരിക്കുന്ന മൂലദൃശ്യം നിലനിർത്തി
  alternative: ശത്രുക്കളെ അവന്റെ കാലുകൾക്കു കീഴിലാക്കി
  rationale: ‘അവരെ’ എന്നത് ശത്രുക്കളെ ഉദ്ദേശിക്കുന്നതായി വ്യാഖ്യാനിക്കാനാകുമെങ്കിലും മൂലപാഠത്തിൽ നേരിട്ട് ‘ശത്രുക്കൾ’ എന്നില്ല. അതിനാൽ യുദ്ധങ്ങളെ കീഴിലാക്കുന്നു എന്ന അസാധാരണമായെങ്കിലും അർഥവത്തായ ദൃശ്യം നിശ്ശബ്ദമായി പരിഹരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘നാമത്തിനായി’, ‘കാൽപ്പാദങ്ങൾക്കു കീഴിൽ’ എന്നീ പ്രധാന എബ്രായ ദൃശ്യങ്ങൾ സംരക്ഷിച്ചപ്പോൾ, ക്ഷേത്രത്തെ സൂചിപ്പിക്കുന്ന בַּיִת സ്വാഭാവികമായി ‘ആലയം’ എന്നു നൽകി. അവസാനത്തെ ‘അതു സാധിച്ചില്ല’ ദീർഘവാക്യത്തിന്റെ സമയബന്ധം മലയാളത്തിൽ വ്യക്തതയോടെ പ്രകടിപ്പിക്കുന്നു.
