- from: “എന്റെ പിതാവായ ദാവീദിനെ ചുറ്റിയിരുന്ന യുദ്ധങ്ങൾ നിമിത്തം, അവന്റെ ദൈവമായ യാഹ്‌വെയുടെ നാമത്തിനായി ഒരു ആലയം പണിയാൻ അവനു കഴിഞ്ഞില്ലെന്നു നിനക്കറിയാമല്ലോ. യാഹ്‌വെ ആ യുദ്ധങ്ങളെ അവന്റെ കാൽപ്പാദങ്ങൾക്കു കീഴിലാക്കുന്നതുവരെ[a] അതു സാധിച്ചില്ല.”
  to: “എന്റെ പിതാവായ ദാവീദിന്, അവനെ ചുറ്റിയിരുന്ന യുദ്ധം നിമിത്തം, അവന്റെ ദൈവമായ യാഹ്‌വെയുടെ നാമത്തിനായി ഒരു ഭവനം പണിയാൻ കഴിഞ്ഞില്ല; യാഹ്‌വെ അവരെ അവന്റെ പാദതലങ്ങൾക്കു കീഴിലാക്കുന്നതുവരെ[a].”
  rationale: The revision restores the source’s ‘could not build ... until’ structure, translates the anarthrous ‘house’ without prematurely substituting ‘sanctuary,’ and preserves the disputed/implicit referent of the final plural object rather than resolving it as ‘wars’ or ‘enemies.’
