source:
  edition: WLC
  text: וְ/הַ/שְּׂעֹרִ֣ים וְ/הַ/תֶּ֔בֶן לַ/סּוּסִ֖ים וְ/לָ/רָ֑כֶשׁ יָבִ֗אוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִֽהְיֶה שָּׁ֔ם אִ֖ישׁ כְּ/מִשְׁפָּטֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: ml
  text: കുതിരകൾക്കും സവാരിമൃഗങ്ങൾക്കും[a] വേണ്ട യവവും വൈക്കോലും, ഓരോരുത്തൻ ഉണ്ടായിരുന്ന സ്ഥലത്തേക്ക്, അവരവരുടെ നിശ്ചിതക്രമമനുസരിച്ച്,[b] എത്തിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സവാരിമൃഗങ്ങൾ’ എന്നതിനുള്ള എബ്രായപദം പ്രത്യേക ഇനത്തിലുള്ള മേൽത്തരം സവാരിമൃഗങ്ങളെയാകാം സൂചിപ്പിക്കുന്നത്; കോവർകഴുതകളോ രഥക്കുതിരകളോ ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഓരോ മനുഷ്യൻ’ എന്ന ഏകവചനം വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; അർഥം ‘ഓരോരുത്തൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: യവം
  rationale: മൃഗങ്ങൾക്കുള്ള തീറ്റധാന്യമായ barley-യെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: וְהַתֶּבֶן
  choice: വൈക്കോൽ
  rationale: മൃഗത്തീറ്റയായി ഉപയോഗിക്കുന്ന തണ്ടുവർഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പതിർ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: לַסּוּסִים
  choice: കുതിരകൾക്കു വേണ്ട
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന לַ എന്ന ഉപസർഗവും סוּסִים എന്ന സാധാരണ കുതിരപ്പദവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְלָרָכֶשׁ
  choice: സവാരിമൃഗങ്ങൾക്കും
  rationale: רֶכֶשׁ എന്ന പദം രാജകീയ പശ്ചാത്തലത്തിലെ പ്രത്യേക സവാരിമൃഗങ്ങളെ സൂചിപ്പിക്കാം; കൃത്യമായ ഇനം ഉറപ്പില്ലാത്തതിനാൽ ‘കഴുതകൾ’ അല്ലെങ്കിൽ ‘രഥക്കുതിരകൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: יָבִיאוּ
  choice: കൊണ്ടുവന്നിരുന്നു
  rationale: ഹീബ്രുവിലെ സജീവ ബഹുവചനക്രിയ നിലനിർത്തുകയും സന്ദർഭത്തിലെ പതിവായ വിതരണപ്രവർത്തനം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: അവ ആവശ്യമായിരുന്ന സ്ഥലത്തേക്ക്
  rationale: പദശഃ ‘അവിടെ ഉണ്ടായിരിക്കേണ്ട സ്ഥലത്തേക്ക്’ എന്ന അസ്വാഭാവിക ഘടനയെ സന്ദർഭാനുസൃതമായി പകരുന്നു; സൂചിപ്പിക്കപ്പെടുന്ന കർത്താവിനെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: אִישׁ כְּמִשְׁפָּטוֹ
  choice: ഓരോരുത്തനും തനിക്കു നിശ്ചയിച്ച ചുമതലയനുസരിച്ച്
  rationale: אִישׁ എന്ന ഏകവചനം ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നും מִשְׁפָּטוֹ നിയമവിധിയല്ല, നിശ്ചയിക്കപ്പെട്ട ഭരണപരമായ ചുമതല അല്ലെങ്കിൽ വിഹിതം എന്നും ഗ്രഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭരണപരമായ ശൈലി സ്വീകരിച്ചു. ‘ഓരോരുത്തനും’ എന്നത് ഹീബ്രുവിലെ വിതരണാർഥ ഏകവചനത്തെ സ്വാഭാവികമായി പകരുന്നു. വാക്യത്തിലെ സ്ഥാനസംബന്ധിയായ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അതിയായി ദുഷ്കരമാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
