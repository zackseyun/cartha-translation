source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ מִ/כָּל הָ֣/עַמִּ֔ים לִ/שְׁמֹ֕עַ אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה מֵ/אֵת֙ כָּל מַלְכֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר שָׁמְע֖וּ אֶת חָכְמָתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: ml
  text: സകല ജനതകളിൽനിന്നും ആളുകൾ ശലോമോന്റെ ജ്ഞാനം കേൾക്കാൻ വന്നു[a], അവന്റെ ജ്ഞാനത്തെക്കുറിച്ചു കേട്ടിരുന്ന ഭൂമിയിലെ സകല രാജാക്കന്മാരിൽനിന്നും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സകല ജനവിഭാഗങ്ങളിൽനിന്നും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ബഹുവചനമാണ്; അത് ജനവിഭാഗങ്ങളെയോ ജനതകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഭൂമിയിലെ സകല രാജാക്കന്മാരിൽനിന്ന്.’ ശലോമോന്റെ ജ്ഞാനത്തെക്കുറിച്ചു കേട്ടിരുന്ന രാജാക്കന്മാരുടെ ഭാഗത്തുനിന്നു വന്നവരോ അവർ അയച്ചവരോ ആയ സന്ദർശകരെയാണ് ഈ സംക്ഷിപ്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: വഴിയിഖ്തോൽ രൂപം ആഖ്യാനക്രമത്തിലെ ഭൂതകാലസംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ലളിതമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִכָּל הָעַמִּים
  choice: സകല ജനതകളിൽനിന്നും ആളുകൾ
  rationale: עַמִּים എന്ന ബഹുവചനം വ്യത്യസ്ത ജനവിഭാഗങ്ങളെയോ ജനതകളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആളുകളാണ് വന്നത് എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കിക്കൊണ്ട് ‘ജനതകൾ’ എന്ന ബഹുവചനഭാവം നിലനിർത്തുന്നു.
- source_word: לִשְׁמֹעַ
  choice: കേൾക്കാൻ
  rationale: വരവിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: ശലോമോന്റെ ജ്ഞാനം
  rationale: എബ്രായ സംയുക്തപദബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥഘടനയിൽ നൽകി.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല രാജാക്കന്മാരുടെ അടുക്കൽനിന്നായിരുന്നു അവർ വന്നത്
  rationale: מֵאֵת സൂചിപ്പിക്കുന്ന ഉറവിടം നിലനിർത്തുന്നു. സന്ദർശകർ രാജാക്കന്മാരിൽനിന്നു വന്നവരോ അവരാൽ അയക്കപ്പെട്ടവരോ എന്ന സംക്ഷിപ്തമായ എബ്രായപ്രയോഗത്തിലെ അവ്യക്തത മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: അവന്റെ ജ്ഞാനത്തെക്കുറിച്ചു കേട്ടിരുന്ന
  rationale: ഇവിടെ നേരിട്ട് ജ്ഞാനം ശ്രവിച്ചതല്ല, അതിന്റെ കീർത്തിയോ വാർത്തയോ കേട്ടതാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘ജ്ഞാനത്തെക്കുറിച്ചു കേട്ടിരുന്നു’ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സകല’ എന്ന പദം വാക്യത്തിന്റെ രാജകീയ-ആഖ്യാന ഭാവം കാത്തുസൂക്ഷിക്കുന്നു; അപരിചിതമായ പദാനുപദഘടന ഒഴിവാക്കി, എബ്രായത്തിലെ ഉറവിടസൂചനയും സാധ്യതയുള്ള അവ്യക്തതയും അടിക്കുറിപ്പോടെ നിലനിർത്തി.
