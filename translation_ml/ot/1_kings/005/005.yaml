source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: ml
  text: ദാൻ മുതൽ ബേർ-ശേബവരെ, ശലോമോന്റെ എല്ലാ കാലത്തും, യെഹൂദയും യിസ്രായേലും സുരക്ഷിതരായി വസിച്ചു; ഓരോ പുരുഷനും[a] തന്റെ മുന്തിരിവള്ളിയുടെ കീഴിലും തന്റെ അത്തിവൃക്ഷത്തിന്റെ കീഴിലും[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഓരോരുത്തനും.’ എബ്രായത്തിൽ ‘പുരുഷൻ’ എന്ന ഏകവചന പുല്ലിംഗരൂപം ഇവിടെ വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ മുന്തിരിവള്ളിയുടെ കീഴിലും തന്റെ അത്തിവൃക്ഷത്തിന്റെ കീഴിലും’ എന്നത് ദേശത്തിലെ സമാധാനം, സുരക്ഷ, സമൃദ്ധി എന്നിവ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ദൃശ്യപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: വസിച്ചു
  rationale: മൂലക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘ഇരുന്നു/പാർത്തു’ എന്നർഥമുണ്ടെങ്കിലും, לָבֶטַח എന്നതോടൊപ്പം ഇവിടെ സ്ഥിരമായും സുരക്ഷിതമായും ജീവിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വസിച്ചു’ സ്വാഭാവികവും ഭാവാർഥത്തോട് ചേർന്നതുമാണ്.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: യെഹൂദയും യിസ്രായേലും
  rationale: എബ്രായപാഠത്തിൽ പേരെടുത്തുപറയുന്ന രണ്ടു ജന-രാഷ്ട്രീയ ഘടകങ്ങളെയും പൊതുവാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: לָבֶטַח
  choice: സുരക്ഷിതരായി
  rationale: ഭീഷണിയില്ലാത്ത സുരക്ഷിതാവസ്ഥയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: אִישׁ
  choice: ഓരോ പുരുഷനും
  rationale: എബ്രായത്തിലെ ഏകവചന പുല്ലിംഗരൂപം ഇവിടെ വിതരണാർഥത്തിലാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിന്റെ രൂപവും അർഥവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: തന്റെ മുന്തിരിവള്ളിയുടെയും അത്തിവൃക്ഷത്തിന്റെയും കീഴിൽ
  rationale: സമാധാനം, സുരക്ഷ, സമൃദ്ധി എന്നിവയുടെ പരമ്പരാഗത ദൃശ്യരൂപമാണിത്; വ്യാഖ്യാനപരമായി പരാവർത്തനം ചെയ്യാതെ മൂലത്തിലെ ചിത്രം നിലനിർത്തുന്നു.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: ദാൻമുതൽ ബേർ-ശേബവരെ
  rationale: ദേശത്തിന്റെ വടക്കേയറ്റംമുതൽ തെക്കേയറ്റംവരെയുള്ള മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ യുഗ്മപ്രയോഗം സ്ഥലനാമങ്ങളോടെ നിലനിർത്തുന്നു.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ കാലമൊക്കെയും
  rationale: ഈ സുരക്ഷിതാവസ്ഥ ശലോമോന്റെ ഭരണകാലം മുഴുവൻ നിലനിന്നുവെന്ന ദൈർഘ്യസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: വിതരണാർഥത്തിലുള്ള പുല്ലിംഗ ഏകവചനം אִישׁ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോരുത്തനും
  rationale: മൂലത്തിലെ പുല്ലിംഗരൂപം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു; അതേസമയം ഇത് ജനത്തിലെ അംഗങ്ങളെ ഓരോരുത്തരായി പ്രതിനിധീകരിക്കുന്ന വിതരണപ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘തന്റെ മുന്തിരിവള്ളിയുടെയും അത്തിവൃക്ഷത്തിന്റെയും കീഴിൽ’ എന്ന സമൃദ്ധിദൃശ്യം എങ്ങനെ കൈകാര്യം ചെയ്യണം
  choice: ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ അക്ഷുണ്ണമായി നിലനിർത്തുക
  alternative: ‘സമാധാനത്തിലും സമൃദ്ധിയിലും ജീവിച്ചു’ എന്നു പരാവർത്തനം ചെയ്യുക
  rationale: ഈ പരമ്പരാഗത ചിത്രം സമാധാനം, സുരക്ഷ, സ്വന്തം ദേശത്തിലെ അനുഗ്രഹപൂർണമായ ജീവിതം എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു. അതിനെ നിലനിർത്തുന്നത് സാഹിത്യപരവും അന്തർപാഠപരവുമായ ശക്തി സംരക്ഷിക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിന്റെ അവസാനം വരുന്ന കാലസൂചന മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സ്വതന്ത്രമായ രണ്ടാം വാക്യമായി അവതരിപ്പിച്ചു; ‘അങ്ങനെതന്നെയായിരുന്നു’ എന്നത് മുൻവാക്യത്തിലെ മുഴുവൻ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
