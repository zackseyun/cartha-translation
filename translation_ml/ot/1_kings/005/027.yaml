  language: ml
  text: ശലോമോൻ രാജാവ് ഇസ്രായേൽ മുഴുവനിൽനിന്നും നിർബന്ധിത തൊഴിൽസേവനത്തിനായി ആളുകളെ നിയോഗിച്ചു[b][a]; ആ തൊഴിൽസേനയിൽ മുപ്പതിനായിരം പുരുഷന്മാർ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇസ്രായേൽ മുഴുവനിൽനിന്നും ഒരു തൊഴിൽസേനയെ നിർബന്ധിതമായി നിയോഗിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദമായ מַס ഇവിടെ പ്രധാനമായും പണനികുതിയെയല്ല, നിർബന്ധിത തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ആളുകളെ ചേർത്തു
  rationale: מַס എന്ന പദത്തോടൊപ്പമുള്ള ഹിഫിൽ രൂപം നിർബന്ധിത തൊഴിൽസേവനത്തിനായി ആളുകളെ നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ഉദ്ദേശ്യം ചേർത്ത് വിവർത്തനം ചെയ്തു.
- source_word: מַס
  choice: നിർബന്ധിത വേല / വേലക്കാർ
  rationale: ശലോമോന്റെ നിർമാണപ്രവർത്തനങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഇത് പണനികുതിയെയല്ല, നിർബന്ധിത തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലിൽനിന്നും
  rationale: തൊഴിൽസേനയെ ഇസ്രായേൽ ജനതയുടെ മുഴുവൻ വിഭാഗങ്ങളിൽനിന്നും എടുത്തുവെന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: וַיְהִי הַמַּס
  choice: ആ വേലക്കാരുടെ എണ്ണം ... ആയിരുന്നു
  rationale: തൊഴിൽസേനയുടെ ആകെ എണ്ണം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: മുപ്പതിനായിരം പുരുഷന്മാർ
  rationale: אִישׁ ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷ തൊഴിലാളികളെ എണ്ണുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
