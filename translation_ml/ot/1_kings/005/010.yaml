id: 1KI.5.10
reference: 1 Kings 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: ml
  text: ശലോമോന്റെ ജ്ഞാനം കിഴക്കൻ ദേശങ്ങളിലെ സകല ജനങ്ങളുടെയും ജ്ഞാനത്തെയും ഈജിപ്തിലെ സകല ജ്ഞാനത്തെയും കവിഞ്ഞിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “കിഴക്കിന്റെ പുത്രന്മാർ”; കിഴക്കൻ ദേശങ്ങളിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: കവിയുന്നതായിരുന്നു
  rationale: רבה എന്ന ക്രിയയ്ക്ക് പിന്നാലെയുള്ള താരതമ്യസൂചകമായ מִן ഇവിടെ ജ്ഞാനത്തിന്റെ അളവിലുള്ള മേന്മയെ സൂചിപ്പിക്കുന്നു. ‘കവിയുന്നതായിരുന്നു’ എന്നത് ആ താരതമ്യബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: ശലോമോന്റെ ജ്ഞാനം
  rationale: חָכְמָה ഇവിടെ പ്രായോഗിക വൈദഗ്ധ്യം മാത്രമല്ല, വിശാലമായ ജ്ഞാനവും ബൗദ്ധിക മികവും സൂചിപ്പിക്കുന്നു; ശലോമോൻ എന്നത് പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപമാണ്.
- source_word: כָּל בְּנֵי קֶדֶם
  choice: കിഴക്കൻ ദേശങ്ങളിലെ സകല ജനങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘കിഴക്കിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, בְּנֵי קֶדֶם ഒരു ജനവിഭാഗത്തെയും പ്രദേശത്തെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: ഈജിപ്തിലെ സകല ജ്ഞാനത്തെയും
  rationale: രണ്ടാമത്തെ מִן-താരതമ്യവും അതേ ക്രിയയോട് ചേർന്നതാണ്. ആവർത്തനം കൂടാതെ മലയാളത്തിൽ താരതമ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമഗ്രത സൂചിപ്പിക്കുന്ന כָּל എന്ന പദത്തിന്റെ ബലം രണ്ടിടത്തും ‘സകല’ എന്നു നിലനിർത്തി; പ്രാദേശിക ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
