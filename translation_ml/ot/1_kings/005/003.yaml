translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഭക്ഷ്യവിതരണപ്പട്ടികയുടെ ലയവും ഇനങ്ങൾ തമ്മിലുള്ള വ്യത്യാസവും നിലനിർത്തി. അനിശ്ചിതമായ ജന്തുനാമങ്ങളിൽ അമിതകൃത്യത ഒഴിവാക്കി അടിക്കുറിപ്പുകളിൽ പകരവായനകൾ നൽകി.
