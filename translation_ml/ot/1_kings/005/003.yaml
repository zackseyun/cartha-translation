source:
  edition: WLC
  text: עֲשָׂרָ֨ה בָקָ֜ר בְּרִאִ֗ים וְ/עֶשְׂרִ֥ים בָּקָ֛ר רְעִ֖י וּ/מֵ֣אָה צֹ֑אן לְ֠/בַד מֵֽ/אַיָּ֤ל וּ/צְבִי֙ וְ/יַחְמ֔וּר וּ/בַרְבֻּרִ֖ים אֲבוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: ml
  text: കൊഴുപ്പിച്ച പത്ത് കന്നുകാലികൾ, മേച്ചിൽപ്പുറത്തു വളർത്തിയ ഇരുപത് കന്നുകാലികൾ, നൂറ് ചെമ്മരിയാടുകൾ[a] എന്നിവയ്ക്കു പുറമേ മാനുകൾ, കലമാനുകൾ, യഹ്മൂർമാനുകൾ[b], കൊഴുപ്പിച്ച പക്ഷികൾ[c] എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: צֹאן എന്ന പദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: יַחְמוּר ഏതു മൃഗത്തെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നതെന്നത് അനിശ്ചിതമാണ്; ചിലർ ഇതിനെ പുള്ളിമാൻ എന്നും ചിലർ മറ്റൊരു മാൻവർഗമെന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: בַרְבֻּרִים സൂചിപ്പിക്കുന്ന പക്ഷിയിനം അനിശ്ചിതമാണ്; ‘കൊഴുപ്പിച്ച വാത്തുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: കൊഴുപ്പിച്ച കന്നുകാലികൾ
  rationale: בָקָר എന്നത് കന്നുകാലികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; בְּרִיאִים ഇവിടെ നന്നായി തീറ്റകൊടുത്തു കൊഴുപ്പിച്ച മൃഗങ്ങൾ എന്നർഥം നൽകുന്നു.
- source_word: בָּקָר רְעִי
  choice: മേച്ചിൽപ്പുറത്തു വളർത്തിയ കന്നുകാലികൾ
  rationale: רְעִי മേച്ചിലിനെയോ മേയുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള കൊഴുപ്പിച്ച കന്നുകാലികളോടുള്ള പരിപാലനരീതിയിലെ വ്യത്യാസം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: צֹאן
  choice: ചെമ്മരിയാടുകൾ
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ കന്നുകാലികളെ വിശാലമായി സൂചിപ്പിക്കാമെങ്കിലും, ഭക്ഷ്യവിതരണപ്പട്ടികയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പരമ്പരാഗത അർഥമായി ‘ചെമ്മരിയാടുകൾ’ ഉപയോഗിച്ചു; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְבַד
  choice: എന്നിവയ്ക്കു പുറമേ
  rationale: മുഖ്യപ്പട്ടികയ്ക്കു പുറമേ ചേർക്കുന്ന ഇനങ്ങളെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אַיָּל
  choice: മാനുകൾ
  rationale: പദം മാൻവർഗത്തിലെ മൃഗത്തെ, പലപ്പോഴും ആൺമാനിനെ, സൂചിപ്പിക്കുന്നു; ഈ ഭക്ഷ്യപ്പട്ടികയിൽ പൊതുവായ ‘മാനുകൾ’ സ്വാഭാവികമാണ്.
- source_word: צְבִי
  choice: കലമാനുകൾ
  rationale: צְבִי സാധാരണ gazelle-നെ സൂചിപ്പിക്കുന്നു; അതിനുള്ള പ്രചാരത്തിലുള്ള മലയാളനാമമായി ‘കലമാൻ’ സ്വീകരിച്ചു.
- source_word: יַחְמוּר
  choice: യഹ്മൂർമാനുകൾ
  rationale: മൃഗത്തിന്റെ കൃത്യമായ ജന്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ, ഏതെങ്കിലും പ്രത്യേക ഇനമായി അമിതമായി നിർണയിക്കാതെ എബ്രായനാമത്തിന്റെ ലിപ്യന്തരണത്തോടൊപ്പം പൊതുവർഗമായ ‘മാൻ’ ചേർത്തു.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: കൊഴുപ്പിച്ച പക്ഷികൾ
  rationale: אֲבוּסִים തീറ്റകൊടുത്തു കൊഴുപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; בַרְבֻּרִים ഏതു പക്ഷിയിനമാണെന്നത് അനിശ്ചിതമായതിനാൽ പൊതുവായ ‘പക്ഷികൾ’ ഉപയോഗിച്ചു.
