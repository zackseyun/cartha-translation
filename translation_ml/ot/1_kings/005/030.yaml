  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: ml
  text: വേലയുടെ ചുമതലയുണ്ടായിരുന്ന ശലോമോന്റെ മുഖ്യ ഉദ്യോഗസ്ഥന്മാർക്കു പുറമേ[a], വേല ചെയ്തിരുന്ന ജനത്തിന്മേൽ[c] അധികാരം പ്രയോഗിച്ചിരുന്ന[b] മൂവായിരത്തി മുന്നൂറുപേരും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുഖ്യ ഉദ്യോഗസ്ഥന്മാർ” എന്നതിന് “മുഖ്യ അധികാരികൾ” എന്നോ “മുഖ്യ മേൽനോട്ടക്കാർ” എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ ഭരണപദങ്ങൾ പദവിയുടെയും മേൽനോട്ടത്തിന്റെയും ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അധികാരം പ്രയോഗിച്ചിരുന്ന” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയ അധികാരം പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കാം; ഇവിടെ അത് തൊഴിലാളികളുടെ മേലുള്ള മേൽനോട്ടത്തെയാണ് കുറിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ജനം”; ഇവിടെ പദ്ധതിയുടെ വേലയിൽ ഏർപ്പെട്ടിരുന്ന തൊഴിലാളികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: പുറമേ
  rationale: മുമ്പു പറഞ്ഞ എണ്ണത്തിനു പുറമേയുള്ള മറ്റൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: മുഖ്യ ഉദ്യോഗസ്ഥന്മാർ
  rationale: പദസമുച്ചയം പദവിയും നിയമിക്കപ്പെട്ട മേൽനോട്ടച്ചുമതലയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള רדה എന്ന ക്രിയയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോന്റെ
  rationale: ഇവിടെ ל ബന്ധമോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സംബന്ധികരൂപം സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: വേലയുടെ മേൽ ചുമതലയുണ്ടായിരുന്ന
  rationale: പദ്ധതിയുടെയോ വേലയുടെയോ ഭരണ-മേൽനോട്ടച്ചുമതല വ്യക്തമാക്കുന്ന, എബ്രായഘടനയോട് അടുത്ത സ്വാഭാവിക പരിഭാഷ.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: മൂവായിരത്തി മുന്നൂറുപേർ
  rationale: മനുഷ്യരുടെ എണ്ണം മലയാളത്തിൽ സ്വാഭാവികമായി വാക്കുകളാൽ രേഖപ്പെടുത്തുന്നു.
- source_word: הָרֹדִים
  choice: മേൽ അധികാരം നടത്തിയിരുന്ന
  rationale: רדה എന്ന ശക്തമായ അധികാരപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുകയും തൊഴിൽസന്ദർഭത്തിലെ മേൽനോട്ടം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בָּעָם
  choice: ജനത്തിന്റെ മേൽ
  rationale: എബ്രായത്തിലെ ‘ജനം’ എന്ന പൊതുപദം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അവർ തൊഴിലാളികളാണെന്നത് അനുബന്ധവാക്യം വ്യക്തമാക്കുന്നു.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: വേല ചെയ്തിരുന്ന
  rationale: ജനത്തെ വേലയിൽ ഏർപ്പെട്ടവരായി തിരിച്ചറിയിക്കുന്ന പങ്കാളിക്രിയ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
