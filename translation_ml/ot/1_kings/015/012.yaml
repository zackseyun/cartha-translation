source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר הַ/קְּדֵשִׁ֖ים מִן הָ/אָ֑רֶץ וַ/יָּ֨סַר֙ אֶת כָּל הַ/גִּלֻּלִ֔ים אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: ml
  text: അവൻ ദേശത്തുനിന്ന് പുരുഷ ആരാധനാവേശ്യകളെ[a][b] നീക്കിക്കളഞ്ഞു; തന്റെ പിതാക്കന്മാർ[d] ഉണ്ടാക്കിയ സകല വിഗ്രഹങ്ങളും[c] എടുത്തുമാറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുറത്താക്കി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ഒരു സ്ഥലത്തുനിന്ന് ഒരാളെ നീക്കുക, പുറത്താക്കുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘പുരുഷ ആരാധനാവേശ്യകൾ’ എന്നത് ഹീബ്രുവിലെ קְדֵשִׁים എന്ന പദത്തിന്റെ സന്ദർഭാർഥമാണ്. നിരോധിത ആരാധനയുമായി ബന്ധപ്പെട്ട ലൈംഗികാചാരങ്ങളോടു ബന്ധമുള്ള പുരുഷന്മാരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘വിഗ്രഹങ്ങൾ’ എന്നതിനുള്ള ഹീബ്രുപദം കടുത്ത നിന്ദാസൂചകമാണ്; ‘അറപ്പുളവാക്കുന്ന വിഗ്രഹങ്ങൾ’ എന്ന ഭാവം അതിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘തന്റെ പൂർവികർ’ / ‘തന്റെ പൂർവപിതാക്കന്മാർ.’ ‘പിതാക്കന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം മുൻതലമുറകളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: നീക്കിക്കളഞ്ഞു
  rationale: ഇവിടെയുള്ള עבר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരു സ്ഥലത്തുനിന്ന് നീക്കുക അഥവാ പുറത്താക്കുക എന്ന അർഥത്തിലാണ്. ‘നീക്കിക്കളഞ്ഞു’ സ്വാഭാവികവും നിർവഹിച്ച പരിഷ്കാരത്തിന്റെ ശക്തി സൂചിപ്പിക്കുന്നതുമാണ്; പുറത്താക്കിയ രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַקְּדֵשִׁים
  choice: പുരുഷ ക്ഷേത്രവേശ്യകളെ
  rationale: ഈ സന്ദർഭത്തിൽ ഈ പദം നിരോധിത ആരാധനയോടു ബന്ധപ്പെട്ട ലൈംഗികാചാരങ്ങളിൽ ഏർപ്പെട്ടിരുന്ന പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശുദ്ധന്മാർ’ എന്ന പദശഃ അർഥമല്ല. ലിംഗവും ആരാധനാപരമായ പശ്ചാത്തലവും വ്യക്തമായി നിലനിർത്താൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: מִן הָאָרֶץ
  choice: ദേശത്തുനിന്ന്
  rationale: ഹീബ്രുവിലെ ‘ദേശത്തുനിന്ന്’ എന്ന രൂപം അടുത്തായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യെഹൂദയുടെ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
- source_word: וַיָּסַר
  choice: എടുത്തുമാറ്റി
  rationale: סור എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് നീക്കുക, അകറ്റുക എന്നീ അർഥങ്ങളുണ്ട്. ആദ്യ ക്രിയയിലെ ‘നീക്കിക്കളഞ്ഞു’ എന്നതിന്റെ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: כָּל הַגִּלֻּלִים
  choice: സകല വിഗ്രഹങ്ങളും
  rationale: גִּלּוּלִים വിഗ്രഹങ്ങൾക്കുള്ള ശക്തമായ നിന്ദാസൂചക പദമാണ്. മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ ‘വിഗ്രഹങ്ങൾ’ ഉപയോഗിച്ച് അതിന്റെ അവജ്ഞാഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാർ ഉണ്ടാക്കിയ
  rationale: ‘അവന്റെ പിതാക്കന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗം മുൻതലമുറകളെയോ പൂർവപിതാക്കളെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കാൻ ‘തന്റെ’ എന്നും, ഉറവിടത്തിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്താൻ ‘പിതാക്കന്മാർ’ എന്നും നൽകി.
theological_decisions:
- issue: אֲבֹתָיו എന്നതിന്റെ പരിഭാഷ
  choice: തന്റെ പിതാക്കന്മാർ
  alternative: തന്റെ പൂർവികർ / തന്റെ പൂർവപിതാക്കന്മാർ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും മുൻതലമുറകളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം നൽകുകയും ചെയ്യുന്നു. ‘പൂർവികർ’ കൂടുതൽ ലിംഗനിരപേക്ഷമാണ്; അത് അടിക്കുറിപ്പിൽ അർഥവികല്പമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ സമാന്തര ഘടന നിലനിർത്തിയിട്ടുണ്ട്. ആരാധനാപരമായ ലൈംഗികാചാരത്തെ സൂചിപ്പിക്കുന്ന അപൂർവ പദത്തിന് മുഖ്യവാക്യത്തിൽ വ്യക്തമായ പരിഭാഷയും അടിക്കുറിപ്പിൽ വിശദീകരണവും നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
