  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: ml
  text: അപ്പോൾ ആസാ രാജാവ് യെഹൂദാ മുഴുവനെയും വിളിച്ചുകൂട്ടി[a]—ഒരാൾക്കും ഒഴിവില്ലായിരുന്നു[b]. ബയെശാ പണിയാൻ ഉപയോഗിച്ചിരുന്ന[c] രാമായിലെ കല്ലുകളും അവിടത്തെ മരത്തടികളും അവർ എടുത്തുകൊണ്ടുപോയി. അവകൊണ്ട് ആസാ രാജാവ് ബെന്യാമീനിലെ ഗേബായും മിസ്പായും പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യെഹൂദാ മുഴുവനിലും വിളംബരം ചെയ്യിച്ചു.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കേൾപ്പിച്ചു’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: ‘ഒഴിവുള്ള ഒരാളുമില്ല.’ അതായത്, ഈ വേലയിൽനിന്ന് ആരെയും ഒഴിവാക്കിയില്ല.'
    reason: lexical_alternative
  - marker: c
    text: ‘ബയെശാ പണിയാൻ ഉപയോഗിച്ചിരുന്ന’ എന്ന വാക്യഭാഗം കല്ലുകളെയും മരത്തടികളെയും സൂചിപ്പിക്കുന്നു; രാമാ ഉറപ്പിക്കാൻ ബയെശാ ഉപയോഗിച്ച നിർമാണസാമഗ്രികളായിരുന്നു അവ.
