- source_word: הִשְׁמִיעַ
  choice: വിളിച്ചുകൂട്ടി
  rationale: ശמע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് അക്ഷരാർഥത്തിൽ ‘കേൾപ്പിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ രാജാവ് രാജ്യവ്യാപകമായി ആളുകളെ നിർബന്ധിത വേലയ്ക്കായി വിളിച്ചുവരുത്തിയതാണ് സന്ദർഭാർഥം. ‘വിളിച്ചുകൂട്ടി’ ഈ പ്രായോഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת כָּל יְהוּדָה
  choice: യെഹൂദാ മുഴുവനെയും
  rationale: ഇവിടെ സ്ഥലത്തെക്കാൾ യെഹൂദായിലെ ജനസമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നത്. മൂലപാഠത്തിലെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֵין נָקִי
  choice: ഒരാൾക്കും ഒഴിവില്ലായിരുന്നു
  rationale: נָקִי ഇവിടെ ധാർമികമായ ‘നിർദോഷൻ’ എന്നല്ല, നിർബന്ധിത സേവനത്തിൽനിന്ന് ഒഴിവാക്കപ്പെട്ടവൻ എന്ന അർഥത്തിലാണ്. ഈ സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׂאוּ
