  rationale: രാമായിൽനിന്ന് നിർമാണസാമഗ്രികൾ നീക്കി മറ്റിടത്തേക്കു കൊണ്ടുപോയതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, ‘ചുമന്നു’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אַבְנֵי הָרָמָה
  choice: രാമായിലെ കല്ലുകൾ
  rationale: നിർമാണസാമഗ്രികൾ രാമാ പട്ടണത്തിൽ ഉണ്ടായിരുന്നുവെന്നും അവിടെനിന്നാണ് നീക്കിയതെന്നും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֵצֶיהָ
  choice: അവിടത്തെ മരത്തടികൾ
  rationale: ബഹുവചനരൂപം നിർമാണത്തിന് ഉപയോഗിച്ചിരുന്ന മരം അല്ലെങ്കിൽ തടികൾ സൂചിപ്പിക്കുന്നു. ‘മരത്തടികൾ’ സാധാരണ വായനക്കാർക്ക് നിർമാണസാമഗ്രി എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
