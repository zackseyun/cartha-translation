revisions:
- from: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു; യൊരോബെയാമിന്റെ വഴിയിലും, അവൻ ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച അവന്റെ പാപത്തിലും നടന്നു.
  to: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്തു; യൊരോബെയാമിന്റെ വഴിയിലും, യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയ അവന്റെ പാപത്തിലും നടന്നു.
  rationale: The revision preserves the Hebrew sequence and parallel expressions ('in the way of Jeroboam' and 'in his sin') while explicitly identifying Jeroboam as the one whose sin caused Israel to sin. It also uses a more idiomatic modern Malayalam rendering of the standard Kings evaluation formula.
