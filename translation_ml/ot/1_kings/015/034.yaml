reference: 1 Kings 15:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്തു; യൊരോബെയാമിന്റെ വഴിയിലും, യൊരോബെയാം ഇസ്രായേലിനെ പാപം ചെയ്യാൻ ഇടയാക്കിയ അവന്റെ പാപത്തിലും നടന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരിൽ ആവർത്തിക്കുന്ന വിലയിരുത്തൽസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യാരംഭത്തിലെ ഹീബ്രു ബന്ധകത്തെ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപകം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുവായി പരിചിതമായ മലയാളരൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ വഴിയിൽ നടന്നു
  rationale: ജീവിതാചരണത്തെ വഴിയിലൂടെ നടക്കുന്നതായി ചിത്രീകരിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וּבְחַטָּאתוֹ
  choice: അവന്റെ പാപത്തിലും
  rationale: ഏകവചന നാമവും യൊരോബെയാമിനെ സൂചിപ്പിക്കുന്ന പ്രത്യയവും അതേപടി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ദൈവനാമരൂപത്തിൽ നൽകുന്നു.
- issue: യൊരോബെയാമിന്റെ ഉത്തരവാദിത്തത്തിന്റെ കാരണാർഥം
  choice: ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച
  alternative: ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ച
  rationale: മൂലത്തിലെ causative രൂപം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; ഇസ്രായേലിന്റെ സ്വന്തം ധാർമിക ഉത്തരവാദിത്തത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള ബൈബിൾ ആഖ്യാനശൈലി. ആവർത്തനസൂത്രവും ‘വഴിയിൽ നടന്നു’ എന്ന ഹീബ്രു രൂപകവും സംരക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന ഉപയോഗിച്ചു.
