  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജവാഴ്ചാ കാലഗണനാശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ചുരുക്കവും ഔപചാരികതയും നിലനിർത്തി; ‘ആണ്ട്’ എന്ന പദം ഭരണവർഷസന്ദർഭത്തിന് യോജിച്ചതാണ്.
