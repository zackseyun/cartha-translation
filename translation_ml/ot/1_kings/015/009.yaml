base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: ml
  text: ഇസ്രായേൽ രാജാവായ യെരോബെയാമിന്റെ ഇരുപതാം വർഷത്തിൽ ആസാ യെഹൂദയുടെ രാജാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ ഔപചാരികമായി: “ആസാ യെഹൂദയുടെ രാജാവായി വാഴാൻ തുടങ്ങി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: ഇരുപതാം ആണ്ടിൽ
  rationale: രാജവാഴ്ചയുടെ കാലഗണന സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിൽ പ്രത്യേകം ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. സംഖ്യാവാചകമായ ‘ഇരുപത്’ ഇവിടെ ക്രമസംഖ്യാർത്ഥത്തിൽ വരുന്നതിനാൽ ‘ഇരുപതാം’ എന്നു നൽകി.
- source_word: לְ/יָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ യൊരോബെയാമിന്റെ
  rationale: לְ ഇവിടെ ഭരണവർഷം കണക്കാക്കുന്നതിനുള്ള രാജാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക കാലഗണനാരീതിക്കനുസരിച്ച് ഷഷ്ഠീവിഭക്തി ഉപയോഗിച്ചു; രാജപദവി വ്യക്തമായി നിലനിർത്തി.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജാക്കന്മാരുടെ ഭരണവിവരണങ്ങളിൽ ഈ ക്രിയ സാധാരണയായി ഭരണാരോഹണം സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ എന്നത് അത് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: אָסָא
  choice: ആസാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദയുടെ രാജാവായി
  rationale: എബ്രായ ഘടന അക്ഷരാർഥത്തിൽ ‘യെഹൂദയുടെ രാജാവ്’ എന്നാണ്. മലയാളത്തിൽ מָלַךְ എന്ന ക്രിയയോടു ചേർന്ന് ‘യെഹൂദയുടെ രാജാവായി’ എന്നു നൽകിയിരിക്കുന്നു.
