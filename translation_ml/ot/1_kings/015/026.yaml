id: 1KI.15.26
reference: 1 Kings 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; തന്റെ അപ്പന്റെ വഴിയിലും, തന്റെ അപ്പൻ ഇസ്രായേലിനെക്കൊണ്ടു പാപം ചെയ്യിച്ച പാപത്തിലും നടന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: രാജാക്കന്മാരെ വിലയിരുത്തുന്ന പതിവു പ്രയോഗത്തിന്റെ അർഥവും ചുരുക്കവും നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: എബ്രായത്തിലെ ‘കണ്ണുകളിൽ’ എന്ന വിലയിരുത്തൽപ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: തന്റെ അപ്പന്റെ വഴിയിൽ നടന്നു
  rationale: ജീവിതരീതിയെ ‘വഴി’യും ‘നടക്കുക’യുംകൊണ്ട് സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: וּבְחַטָּאתוֹ
  choice: തന്റെ അപ്പന്റെ ... പാപത്തിൽ
  rationale: വ്യാകരണപരമായി സർവനാമപ്രത്യയം അടുത്തുള്ള ‘അപ്പൻ’ എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അത് വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: തന്റെ അപ്പൻ ഇസ്രായേലിനെക്കൊണ്ടു പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: חַטָּאתוֹ എന്നതിലെ സർവനാമത്തിന്റെ സൂചന
  choice: തന്റെ അപ്പന്റെ പാപം
  alternative: അവന്റെ പാപം
  rationale: എബ്രായ വ്യാകരണവും സന്ദർഭവും ഇത് പിതാവിന്റെ പാപത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ശക്തമായി കാണിക്കുന്നു; മലയാളത്തിലെ ‘അവന്റെ’ എന്ന രൂപം മകനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വഴിയിൽ നടന്നു’ എന്ന തിരുവെഴുത്തുസവിശേഷമായ നൈതികരൂപകം മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
