translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗോത്രബന്ധവും സൈനികസന്ദർഭവും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ വ്യക്തമാക്കി; മൂലത്തിലെ ഉടമസ്ഥത/നിയന്ത്രണം, അടിക്കുക/കൊല്ലുക എന്നീ സൂക്ഷ്മതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
