  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: ml
  text: യിസ്സാഖാർഗോത്രത്തിൽപ്പെട്ട അഹീയാവിന്റെ മകൻ ബയെശാ നാദാബിനെതിരെ ഗൂഢാലോചന നടത്തി[a]. നാദാബും യിസ്രായേലൊക്കെയും ഫെലിസ്ത്യരുടെ അധീനതയിലായിരുന്ന[b] ഗിബ്ബെഥോനെ ഉപരോധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ബയെശാ ഗിബ്ബെഥോനിൽവെച്ച് അവനെ അടിച്ചുവീഴ്ത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവനെതിരെ കൂട്ടുകെട്ടുണ്ടാക്കി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഫെലിസ്ത്യർക്കുള്ളതായിരുന്ന.”'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “അവനെ കൊന്നു”; എബ്രായപദത്തിന്റെ അക്ഷരാർഥം “അവനെ അടിച്ചു” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: നാദാബിനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: קשר על എന്ന പ്രയോഗം ഒരാൾക്കെതിരായ രാഷ്ട്രീയ ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽ പരാമർശിച്ച നാദാബിന്റെ പേര് ആവർത്തിക്കുന്നത് മലയാളത്തിൽ സൂചന വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: അഹീയാവിന്റെ മകൻ ബയെശാ
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വംശബന്ധക്രമത്തിൽ പിതാവിന്റെ പേര് ആദ്യം നൽകി; പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: לְבֵית יִשָּׂשכָר
  choice: യിസ്സാഖാർഗോത്രത്തിൽപ്പെട്ട
  rationale: ഇവിടെയുള്ള בֵּית വംശീയ/ഗോത്രബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഭവനം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് ‘ഗോത്രത്തിൽപ്പെട്ട’ എന്നത് ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/വീഴ്ത്തുക’ എന്ന ദൃശ്യഭാവവും സന്ദർഭത്തിലെ മാരകഫലവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്നത് സാധ്യമായ കൂടുതൽ വ്യക്തമായ പരിഭാഷയാണ്.
- source_word: בְּגִבְּתוֹן
  choice: അവിടെവെച്ച്
  rationale: മുൻപേ ഗിബ്ബെഥോൻ പറഞ്ഞതിനുശേഷം സ്ഥലം സ്വാഭാവികമായി തിരിച്ചുപറയുന്നു; എബ്രായത്തിലെ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ അധീനതയിലായിരുന്ന
  rationale: ל־ ഉടമസ്ഥതയെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കാം. സൈനികസന്ദർഭത്തിൽ ‘അധീനതയിൽ’ എന്നത് നിയന്ത്രണം സ്വാഭാവികമായി അറിയിക്കുകയും കർശനമായ നിയമപരമായ ഉടമസ്ഥത നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: നാദാബും യിസ്രായേൽസൈന്യം മുഴുവനും ... കൊണ്ടിരിക്കുമ്പോൾ
  rationale: വാക്യത്തിലെ וְ പശ്ചാത്തലമായ സമകാലിക സാഹചര്യം അവതരിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘എല്ലാ യിസ്രായേലും’ എന്നത് സൈന്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ അർഥം വ്യക്തമായി നൽകി.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: ഗിബ്ബെഥോനെ ഉപരോധിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: צור על എന്ന സൈനികപ്രയോഗത്തിന്റെ അർഥം ‘ഉപരോധിക്കുക’ എന്നാണ്; പങ്കാളിക്രിയയുടെ തുടരുന്ന പ്രവർത്തനം ‘കൊണ്ടിരിക്കുമ്പോൾ’ പ്രകടമാക്കുന്നു.
