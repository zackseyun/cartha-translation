id: 1KI.15.2
reference: 1 Kings 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ മൂന്നു വർഷം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് മയഖാ എന്നായിരുന്നു; അവൾ അബീശാലോമിന്റെ മകളായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായ നാമരൂപം ‘അബീശാലോം’ എന്നാണ്; പല വിവർത്തനങ്ങളിലും ഇതിന്റെ മറ്റൊരു രൂപമായ ‘അബ്ശാലോം’ കാണാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായ വംശാവലിപ്രയോഗങ്ങളിൽ ‘മകൾ’ എന്ന പദം ചിലപ്പോൾ പേരക്കുട്ടിയെയോ മറ്റൊരു സ്ത്രീവംശജയെയോ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: സംഖ്യയും ബഹുവചന നാമവും ചേർന്ന ഈ പ്രയോഗം ഭരണകാലത്തിന്റെ ദൈർഘ്യം സൂചിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: ഇവിടെ מלך എന്ന ക്രിയ രാജാധികാരം പ്രയോഗിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥാനാരോഹണത്തെയല്ല.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: ב എന്ന ഉപസർഗം സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: രാജാക്കന്മാരുടെ ഗ്രന്ഥത്തിലെ പതിവ് രാജവംശീയ സൂത്രവാക്യം അർഥം കാത്തുകൊണ്ട് സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: מַעֲכָה
  choice: മയഖാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בַּת
  choice: മകൾ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘മകൾ’ എന്നാണ്; വംശാവലിസന്ദർഭത്തിൽ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲבִישָׁלוֹם
  choice: അബീശാലോം
  rationale: ഇവിടെയുള്ള എബ്രായ നാമരൂപമായ אֲבִישָׁלוֹם നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: בַּת אֲבִישָׁלוֹם എന്ന വംശാവലിപ്രയോഗം
  choice: പ്രധാന പാഠത്തിൽ ‘അബീശാലോമിന്റെ മകൾ’ എന്നു നിലനിർത്തി.
  alternative: ‘അബീശാലോമിന്റെ പേരക്കുട്ടി/സ്ത്രീവംശജ’
  rationale: എബ്രായ പാഠം നേരിട്ട് ‘മകൾ’ എന്നാണ് പറയുന്നത്. എന്നാൽ വംശാവലിപ്രയോഗത്തിൽ ഈ പദത്തിന് വിശാലമായ ബന്ധം സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത വ്യാഖ്യാനിച്ച് തീർക്കാതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ‘ഭരിച്ചു’ എന്ന സ്വാഭാവിക ക്രിയയും രാജവംശീയ അറിയിപ്പിന്റെ ഔപചാരികതയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വംശാവലിവാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
