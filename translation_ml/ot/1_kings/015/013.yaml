  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: ml
  text: തന്റെ അമ്മയായ മയഖായെയും രാജമാതാവിന്റെ സ്ഥാനത്തുനിന്ന് അവൻ നീക്കിക്കളഞ്ഞു[a]; കാരണം, അവൾ അശേരയ്ക്കുവേണ്ടി[c] അറപ്പുളവാക്കുന്ന ഒരു ആരാധനാവസ്തു[b] ഉണ്ടാക്കിയിരുന്നു. ആസാ അവളുടെ ആരാധനാവസ്തു വെട്ടിമുറിച്ച് കിദ്രോൻ താഴ്‌വരയിൽവെച്ച് ചുട്ടുകളഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അവന്റെ അമ്മ’; രാജവംശസംബന്ധമായ പ്രയോഗത്തിൽ ഇത് ചിലപ്പോൾ മുത്തശ്ശിയെയോ മറ്റൊരു സ്ത്രീപൂർവികയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അറപ്പുളവാക്കുന്ന ഒരു രൂപം’ അല്ലെങ്കിൽ ‘ഭീകരമായ ഒരു വസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ആരാധനാവസ്തുവിന്റെ കൃത്യമായ രൂപം വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘അശേര’ എന്നത് അശേര എന്ന ദേവതയെയോ അവളുടെ ആരാധനാചിഹ്നത്തെയോ സൂചിപ്പിക്കാം; രണ്ടാമത്തേതിനെ ചില പരിഭാഷകൾ ‘അശേരാത്തൂൺ’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: '...യെയും'
  rationale: മുൻവാക്യത്തിലെ പരിഷ്കാരങ്ങളോടുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מַעֲכָה אִמּוֹ
  choice: തന്റെ അമ്മയായ മയഖ
  rationale: എബ്രായത്തിലെ ‘അവന്റെ അമ്മ’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; രാജവംശസന്ദർഭത്തിൽ സ്ത്രീപൂർവികയെയും സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: രാജമാതാവിന്റെ സ്ഥാനത്തുനിന്ന് അവൻ നീക്കിക്കളഞ്ഞു
  rationale: ഗെബീറാ എന്ന രാജസഭാപദവിയും ഹിഫീൽ ക്രിയയുടെ സ്ഥാനഭ്രഷ്ടയാക്കുന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: കാരണം, അവൾ ... ഉണ്ടാക്കിയിരുന്നു
  rationale: സന്ദർഭത്തിലെ കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפְלֶצֶת
  choice: അറപ്പുളവാക്കുന്ന ഒരു വിഗ്രഹം
  rationale: ആരാധനാവസ്തുവിന്റെ വെറുപ്പുളവാക്കുന്ന സ്വഭാവം പ്രകടിപ്പിക്കുമ്പോഴും അതിന്റെ കൃത്യമായ രൂപം നിർണയിക്കുന്നില്ല.
- source_word: לָאֲשֵׁרָה
  choice: അശേരയ്ക്കായി
  rationale: അശേര ദേവതയെയോ അവളുടെ ആരാധനാചിഹ്നത്തെയോ സൂചിപ്പിക്കാമെന്ന മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: അവളുടെ വിഗ്രഹം വെട്ടിമുറിച്ച്
  rationale: כרת എന്ന ക്രിയയുടെ വെട്ടുക/മുറിക്കുക എന്ന മൂർത്തമായ അർഥം സംരക്ഷിക്കുന്നു; വസ്തു തൂണായിരുന്നു എന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: וַיִּשְׂרֹף
  choice: ചുട്ടുകളഞ്ഞു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാള പരിഭാഷ.
- source_word: בְּנַחַל קִדְרוֹן
  choice: കിദ്രോൻ താഴ്‌വരയിൽവെച്ച്
  rationale: נחל എന്നത് തോട്, വരണ്ട നീർച്ചാൽ, താഴ്‌വര എന്നിവ സൂചിപ്പിക്കാം; സ്ഥലസൂചനയ്ക്ക് ‘താഴ്‌വര’ സ്വാഭാവികവും അതിരുകടന്ന് നിർണയിക്കാത്തതുമാണ്.
theological_decisions:
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചിതാർത്ഥം
  choice: ‘അശേര’ എന്നു ലിപ്യന്തരിച്ചു; ദേവതയോ ആരാധനാചിഹ്നമോ എന്ന് മുഖ്യപാഠത്തിൽ തീരുമാനിച്ചില്ല.
  alternative: ‘അശേരാദേവി’ അല്ലെങ്കിൽ ‘അശേരാത്തൂൺ’
  rationale: വാക്യത്തിൽ നിർമ്മിച്ച മറ്റൊരു വസ്തു പ്രത്യേകം പറയുന്നതിനാലും אֲשֵׁרָה ഇരുവിധത്തിൽ ഉപയോഗിക്കപ്പെടാമെന്നതിനാലും ഒരു വ്യാഖ്യാനം നിർബന്ധമായി സ്വീകരിക്കാതെ മൂലപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘രാജമാതാവ്’ രാജസഭയിലെ ഔദ്യോഗിക സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തോട് ചേർന്ന് ‘മയഖ’, ‘ആസാ’, ‘കിദ്രോൻ’ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ വംശബന്ധവും അശേരയുടെ സൂചിതാർത്ഥവും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചിരിക്കുന്നു.
