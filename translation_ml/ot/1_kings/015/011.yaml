id: 1KI.15.11
reference: 1 Kings 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: ml
  text: ആസാ യാഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്തു, തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പൂർവികനായ ദാവീദിനെപ്പോലെ.’ ഇവിടെ ‘പിതാവ്’ എന്നത് നേരിട്ടുള്ള പിതാവിനെയല്ല, രാജവംശത്തിലെ ഒരു പൂർവികനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് സാധാരണയായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണ് അർഥം. രാജാവിനെ വിലയിരുത്തുന്ന ഈ പ്രയോഗത്തിൽ ‘ശരിയായതു ചെയ്തു’ എന്നതാണ് സ്വാഭാവികമായ മലയാളം.
- source_word: אָסָא
  choice: ആസാ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: הַיָּשָׁר
  choice: ശരിയായതു
  rationale: יָשָׁר എന്നതിന് ‘നേരായ, ശരിയായ, സത്യനിഷ്ഠമായ’ എന്നീ അർഥങ്ങളുണ്ട്. עשה-യോടൊപ്പമുള്ള ഈ ഘടനയിൽ ധാർമിക വിലയിരുത്തൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നത് ‘ശരിയായതു ചെയ്തു’ എന്നാണ്.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘കണ്ണുകളിൽ’ എന്നായിരുന്നാലും, ഒരാളുടെ വിലയിരുത്തലിൽ അല്ലെങ്കിൽ കാഴ്ചപ്പാടിൽ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ ‘ദൃഷ്ടിയിൽ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിലെ വ്യാപകമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: כְּדָוִד
  choice: ദാവീദിനെപ്പോലെ
  rationale: כְּ എന്ന ഉപസർഗം താരതമ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദാവീദിനെപ്പോലെ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: אָב എന്ന മൂലപദത്തിന്റെ ‘പിതാവ്’ എന്ന രൂപം നിലനിർത്തുന്നു. ഇവിടെ ദാവീദ് ആസായുടെ നേരിട്ടുള്ള പിതാവല്ല, രാജവംശീയ പൂർവികനാണ്; അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: ‘ദാവീദ് തന്റെ പിതാവ്’ എന്നതിലെ ബന്ധം
  choice: മൂലത്തിലെ ‘പിതാവ്’ എന്ന രാജവംശീയ പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: തന്റെ പൂർവികനായ ദാവീദ്
  rationale: ഹീബ്രു אָבִיו എന്ന് പറയുന്നു; രാജവംശീയ ഭാഷയിൽ ഇത് മുൻഗാമിയെയും സൂചിപ്പിക്കാം. മൂലരൂപം സംരക്ഷിച്ചുകൊണ്ട് തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രുവിലെ വിലയിരുത്തൽസൂത്രത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിയിട്ടുണ്ട്; ‘ദൃഷ്ടിയിൽ’ എന്നത് മൂലത്തിലെ കാഴ്ചയുടെ രൂപകം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
