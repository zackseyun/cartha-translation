- from: ആസാ തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തു.[a]
  to: ആസാ യാഹ്‌വേയുടെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്തു, തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ.[a]
