source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാവിന്റെ വിശുദ്ധവസ്തുക്കളും തന്റെ സ്വന്തം വിശുദ്ധവസ്തുക്കളും[a]—വെള്ളിയും പൊന്നും പാത്രങ്ങളും—യഹ്‌വെയുടെ ആലയത്തിലേക്കു കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തന്റെ പിതാവ് സമർപ്പിച്ച വസ്തുക്കളും താൻതന്നെ സമർപ്പിച്ച വസ്തുക്കളും.’
    reason: קדשׁ എന്ന പദം വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട വസ്തുക്കളെയോ സമർപ്പിത വസ്തുക്കളെയോ സൂചിപ്പിക്കാം; രണ്ടാമത്തെ അർഥം ഇവിടെ പ്രസക്തമാണ്.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്നു
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘കൊണ്ടുവരുക’ എന്നാണ്; ലക്ഷ്യസ്ഥാനം പ്രത്യേകം പറഞ്ഞിരിക്കുന്നതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: קָדְשֵׁי אָבִיו
  choice: തന്റെ പിതാവിന്റെ വിശുദ്ധവസ്തുക്കൾ
  rationale: קדשׁ എന്ന ബഹുവചന സംയുക്തരൂപം വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട അഥവാ സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധവസ്തുക്കൾ’ മൂലപദത്തിന്റെ ആരാധനാസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְקָדְשׁוֹ
  choice: തന്റെ സ്വന്തം വിശുദ്ധവസ്തുക്കൾ
  rationale: ഏകവചനരൂപം ഇവിടെ സമാഹാരാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. ‘സ്വന്തം’ എന്നത് പിതാവിന്റെ വസ്തുക്കളുമായുള്ള സമാന്തരതയും വ്യത്യാസവും വ്യക്തമാക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: ‘യഹ്‌വെയുടെ ഭവനം’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ഈ സന്ദർഭത്തിലെ വിശുദ്ധമന്ദിരത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത് ‘ആലയം’ ആണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: വെള്ളിയും പൊന്നും പാത്രങ്ങളും
  rationale: സമർപ്പിത വസ്തുക്കളുടെ ഉള്ളടക്കം അഥവാ ഉദാഹരണങ്ങൾ വ്യക്തമാക്കുന്ന പട്ടികയായി ഇത് വായിക്കാം. כלים എന്ന വിശാലപദത്തിന് ആലയസന്ദർഭത്തിൽ ‘പാത്രങ്ങൾ’ യോജിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: קדשׁ എന്നതിന്റെ അർഥപരിധി
  choice: വിശുദ്ധവസ്തുക്കൾ
  alternative: സമർപ്പിച്ച വസ്തുക്കൾ
  rationale: വസ്തുക്കൾ വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ടവയാണെന്ന ആരാധനാസംബന്ധിയായ ആശയം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും, അവ സമർപ്പിത ദാനങ്ങളാണെന്ന സാദ്ധ്യമായ പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വിശുദ്ധവസ്തുക്കൾ’ എന്ന രൂപം ഹീബ്രുവിലെ സമാന്തരഘടന നിലനിർത്തുന്നു; നീണ്ട പട്ടിക വ്യക്തമായി വായിക്കാനായി ഡാഷുകൾ ഉപയോഗിച്ചു.
