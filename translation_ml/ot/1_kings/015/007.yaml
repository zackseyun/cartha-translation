id: 1KI.15.7
reference: 1 Kings 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: ml
  text: അബീയാമിന്റെ[a] ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലയോ? അബീയാമും യൊരോബെയാമും തമ്മിൽ യുദ്ധം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില സമാന്തരമോ ബന്ധപ്പെട്ടതോ ആയ ഭാഗങ്ങളിൽ അബീയാമിനെ ‘അബീയാവ്’ എന്നു വിളിക്കുന്നു; ഇവിടെ എബ്രായ പാഠത്തിൽ ‘അബീയാം’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘യെഹൂദാരാജാക്കന്മാരുടെ ഭരണവൃത്താന്തങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജകീയ ഭരണസംഗ്രഹങ്ങളിൽ ഈ പ്രയോഗം വിവരിക്കാതെ ശേഷിക്കുന്ന രാജാവിന്റെ പ്രവൃത്തികളെയും സംഭവങ്ങളെയും സൂചിപ്പിക്കുന്നു; ‘ശേഷിച്ച പ്രവൃത്തികൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲבִיָּם
  choice: അബീയാം
  rationale: മസോരറ്റിക് പാഠത്തിലെ അֲבִיָּם എന്ന പേരിനെ സമാന്തര ഭാഗങ്ങളിലെ ‘അബീയാവ്’ എന്ന രൂപവുമായി ഏകീകരിക്കാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: എബ്രായ വാക്യത്തിന്റെ വ്യാപകവും പൊതുവുമായ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: രാജകീയ സംഗ്രഹങ്ങളിൽ പതിവായ നിഷേധരൂപത്തിലുള്ള അലങ്കാരചോദ്യം മലയാളത്തിലും അതേ ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: രാജാക്കന്മാരെ സംബന്ധിച്ച ഔദ്യോഗിക ചരിത്രരേഖയുടെ ശീർഷകം വ്യക്തമാക്കുന്ന, മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: യുദ്ധം ഉണ്ടായിരുന്നു
  rationale: ദൈർഘ്യം പോലുള്ള അധിക ആശയം ചേർക്കാതെ എബ്രായത്തിലെ ലളിതമായ അസ്തിത്വവാക്യം നേരിട്ട് നൽകുന്നു.
- source_word: בֵּין...וּבֵין
  choice: തമ്മിൽ
  rationale: രണ്ടു വ്യക്തികൾക്കിടയിലെ പരസ്പരവിരോധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപം.
