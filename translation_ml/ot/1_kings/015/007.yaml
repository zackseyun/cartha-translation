translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി പാലിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [b] അടയാളം ആശയപരമായി ബന്ധപ്പെട്ട ഗ്രന്ഥശീർഷകത്തിനരികിലേക്ക് വെച്ചു.
