  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: ml
  text: ബെൻ-ഹദദ് ആസാ രാജാവിന്റെ വാക്ക് കേട്ട്[a], തന്റെ സൈന്യങ്ങളുടെ അധിപന്മാരെ ഇസ്രായേലിലെ പട്ടണങ്ങൾക്കെതിരെ അയച്ചു. അവൻ ഇയ്യോൻ, ദാൻ, ആബേൽ-ബേത്ത്-മയഖാ, കിന്നെരോത്ത് പ്രദേശം മുഴുവനും[b], നഫ്താലിദേശം മുഴുവനും ആക്രമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആസാ രാജാവിന്റെ അഭ്യർഥന ചെവിക്കൊണ്ടു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗം അനുകൂലമായി കേട്ട് അതനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥം നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: “കിന്നെരോത്ത്” ഇവിടെ ഒരു സ്ഥലനാമമാണ്; സാധ്യതയനുസരിച്ച് ഒരു ജില്ലയെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: വാക്കു കേട്ട്
  rationale: ഈ എബ്രായ പ്രയോഗം അനുകൂലമായി കേട്ട് അഭ്യർഥനപ്രകാരം പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘അനുസരിച്ചു’ എന്നു പറഞ്ഞാൽ ആസായുടെ അധികാരം അതിരുകടന്ന് സൂചിപ്പിക്കാം.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: തന്റെ സൈന്യങ്ങളുടെ അധിപന്മാരെ
  rationale: സൈനികസന്ദർഭത്തിലെ നേതാക്കളെയും ബെൻ-ഹദദിനോടുള്ള അവരുടെ അധീനബന്ധത്തെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപട്ടണങ്ങൾക്കെതിരെ
  rationale: שלח എന്ന ക്രിയയോടൊപ്പമുള്ള עַל ഇവിടെ സൈനികനീക്കത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּךְ
  choice: ആക്രമിച്ചു
  rationale: נכה എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ സൈനിക അർഥം നൽകുന്നു; ‘തോൽപ്പിച്ചു’ എന്നു പറഞ്ഞ് ഫലം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: עִיּוֹן
  choice: ഇയ്യോൻ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: ആബേൽ-ബേത്ത്-മയഖാ
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ ഘടന നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: כָּל כִּנְרוֹת
  choice: കിന്നെരോത്ത് പ്രദേശം മുഴുവനും
  rationale: ഇവിടെ כִּנְרוֹת ഒരു സ്ഥലനാമമാണ്; ‘പ്രദേശം’ എന്നത് സന്ദർഭത്തിലെ ഭൗമപരമായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: നഫ്താലിദേശം മുഴുവനും ആക്രമിച്ചു
  rationale: അവസാനത്തെ עַל സൈനികപ്രവർത്തനത്തിന്റെ പരിധി നഫ്താലിയുടെ മുഴുവൻ ദേശത്തേക്കും വ്യാപിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയയോടു ബന്ധിപ്പിച്ച് അർഥം വ്യക്തമാക്കുന്നു.
