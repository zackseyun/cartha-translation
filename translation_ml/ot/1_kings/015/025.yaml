  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. രാജവാഴ്ചാ സൂത്രവാക്യത്തിന്റെ ചരിത്രസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പഴമൊഴിച്ചായവും വ്യാഖ്യാനച്ചേർക്കലുകളും ഒഴിവാക്കി.
