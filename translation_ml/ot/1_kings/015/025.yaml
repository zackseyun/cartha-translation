source:
  edition: WLC
  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ രണ്ടാം വർഷത്തിൽ യൊരോബെയാമിന്റെ മകനായ നാദാബ് ഇസ്രായേലിന്റെ രാജാവായി. അവൻ ഇസ്രായേലിനെ രണ്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב בֶּן יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ മകനായ നാദാബ്
  rationale: വംശപരമായ തിരിച്ചറിയൽ സ്വാഭാവിക മലയാളത്തിൽ നാമത്തിനു മുമ്പായി നൽകി. വാക്യാരംഭത്തിലെ וְ ആഖ്യാനതുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘അപ്പോൾ’ എന്നു ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തി.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ രാജാവായി
  rationale: ആദ്യത്തെ מָלַךְ ഇവിടെ രാജാരോഹണം സൂചിപ്പിക്കുന്നു. ‘വാണു’ എന്ന ദൈർഘ്യാർത്ഥത്തിൽനിന്ന് വേർതിരിക്കാൻ ‘രാജാവായി’ എന്നു പരിഭാഷപ്പെടുത്തി; עַל എന്ന ഭരണബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇസ്രായേലിൽ’ കൊണ്ട് പ്രകടമാക്കി.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ രണ്ടാം വർഷത്തിൽ
  rationale: എബ്രായ രാജവാഴ്ചാ കാലഗണനയിലെ ‘ആസയ്ക്ക് രണ്ടാം വർഷത്തിൽ’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל שְׁנָתָיִם
  choice: അവൻ ഇസ്രായേലിൽ രണ്ടു വർഷം വാണു
  rationale: രണ്ടാമത്തെ രാജവാഴ്ചാക്രിയ കാലദൈർഘ്യത്തോടൊപ്പം വരുന്നതിനാൽ ‘വാണു’ എന്നു നൽകി; שְׁנָתָיִם നേരിട്ട് ‘രണ്ടു വർഷം’ എന്നാണ്.
