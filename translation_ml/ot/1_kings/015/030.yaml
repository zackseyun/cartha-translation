    issue: The second clause is not grammatically linked to ‘പാപങ്ങൾ.’
    rationale: Hebrew says ‘the sins of Jeroboam which he sinned and by which he caused Israel to sin.’ The draft says, more independently, ‘because he caused Israel to sin.’ A relative construction preserves the source syntax and makes clear that his sins are the means/cause.
