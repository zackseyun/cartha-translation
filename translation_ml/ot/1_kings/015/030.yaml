lexical_decisions:
- source_word: עַל חַטֹּאות
  choice: പാപങ്ങൾ നിമിത്തവും
  rationale: עַל ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; חַטֹּאות ബഹുവചനമായതിനാൽ ‘പാപങ്ങൾ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: חָטָא
  choice: ചെയ്ത
  rationale: ‘പാപങ്ങൾ’ എന്ന നാമത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ചെയ്ത’ ഉപയോഗിച്ചു; ‘പാപം ചെയ്തു’ എന്ന ആവർത്തനം ഒഴിവാക്കി.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു; യൊരോബെയാം ഇസ്രായേലിന്റെ പാപത്തിന് കാരണമായെന്ന ആശയം മാത്രം പറയുന്നു, അതിന്റെ രീതി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: בְּכַעְסוֹ
  choice: അവന്റെ പ്രകോപനം നിമിത്തവും
  rationale: כַּעַס എന്നതിന് ‘കോപം’ എന്നും ‘പ്രകോപനം’ എന്നും അർഥമാകാം. തുടർന്നുള്ള הִכְעִיס എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്താൻ ‘പ്രകോപനം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הִכְעִיס
  choice: പ്രകോപിപ്പിച്ച
  rationale: ദൈവത്തെ കോപിപ്പിച്ചു എന്ന കാരണാർഥക ക്രിയയുടെ ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ ബന്ധം മലയാളത്തിൽ സുതാര്യമായും പതിവായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’യെക്കാൾ മൂലോച്ചാരണത്തോട് അടുത്ത രൂപമായി ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: כַּעַס എന്ന പദത്തിലെ കോപം/പ്രകോപനം എന്ന അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രകോപനം’; അടിക്കുറിപ്പിൽ ‘കോപം’
  alternative: മുഖ്യപാഠത്തിൽ ‘കോപം’
  rationale: തുടർന്നുള്ള ‘പ്രകോപിപ്പിച്ച’ എന്ന ക്രിയയുമായുള്ള എബ്രായ പദബന്ധം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; എന്നാൽ ആന്തരിക വികാരമായ ‘കോപം’ എന്ന അർഥസാധ്യത ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലവാക്യം മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന കാരണവാചകഖണ്ഡമായതിനാൽ പൂർണ്ണവാക്യമാക്കാൻ ‘അതായിരുന്നു’ പോലുള്ള പദങ്ങൾ ചേർത്തിട്ടില്ല. ‘പാപം ചെയ്യിച്ചു’ എന്ന പ്രയോഗം കാരണാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
