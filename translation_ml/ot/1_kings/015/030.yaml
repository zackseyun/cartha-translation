  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: ml
  text: 'യൊരോബെയാം ചെയ്തതും ഇസ്രായേലിനെ പാപം ചെയ്യിച്ചതുമായ പാപങ്ങൾ നിമിത്തവും, അവൻ ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയെ പ്രകോപിപ്പിച്ച തന്റെ പ്രകോപനം[a] നിമിത്തവും.


    [a] അഥവാ, “അവന്റെ കോപം.” എബ്രായപദത്തിന് ‘കോപം’ എന്നും ‘പ്രകോപനം’ എന്നും അർഥമാകാം; ഇവിടെ തുടർന്നുവരുന്ന “പ്രകോപിപ്പിച്ച” എന്ന ക്രിയയോടാണ് “പ്രകോപനം” കൂടുതൽ യോജിക്കുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കോപം.” എബ്രായപദത്തിന് ‘കോപം’ എന്നും ‘പ്രകോപനം’ എന്നും അർഥമാകാം; ഇവിടെ തുടർന്നുവരുന്ന “പ്രകോപിപ്പിച്ച” എന്ന ക്രിയയോടാണ് “പ്രകോപനം” കൂടുതൽ യോജിക്കുന്നത്.
