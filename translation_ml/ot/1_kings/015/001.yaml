source:
  edition: WLC
  text: וּ/בִ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ יָרָבְעָ֣ם בֶּן נְבָ֑ט מָלַ֥ךְ אֲבִיָּ֖ם עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: ml
  text: നെബാത്തിന്റെ മകനായ യൊരോബെയാം രാജാവിന്റെ പതിനെട്ടാം ആണ്ടിൽ അബീയാം[a] യെഹൂദയുടെ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായപാഠത്തിൽ: “അബീയാം”; മറ്റു ഭാഗങ്ങളിൽ ഇതേ രാജാവിനെ “അബീയാവ്” എന്നു വിളിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: '... ആണ്ടിൽ'
  rationale: എബ്രായ കഥനത്തിലെ പതിവായ കാലനിർണ്ണയസൂത്രം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ וּ വേർതിരിച്ച് ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ഇവിടെ അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: പതിനെട്ടാം
  rationale: രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്നതിനാൽ ക്രമസംഖ്യാരൂപമാണ് മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: לַ/מֶּלֶךְ
  choice: രാജാവിന്റെ
  rationale: പറയുന്ന വർഷം യൊരോബെയാമിന്റെ രാജവാഴ്ചയിലെ വർഷമാണെന്ന ബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഈ സ്ഥാനാരോഹണ അറിയിപ്പിൽ ക്രിയ രാജത്വത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു; മുഴുവൻ ഭരണകാലത്തെയും സൂചിപ്പിക്കാവുന്ന ‘ഭരിച്ചു’ എന്നതിനെക്കാൾ ഇത് കൃത്യമാണ്.
- source_word: אֲבִיָּם
  choice: അബീയാം
  rationale: മസോററ്റിക് പാഠത്തിലെ പ്രത്യേക നാമരൂപം നിലനിർത്തുന്നു; മറ്റു ഭാഗങ്ങളിലെ ‘അബീയാവ്’ എന്ന രൂപം പ്രധാനപാഠത്തിൽ പകരംവയ്ക്കുന്നില്ല.
- source_word: עַל יְהוּדָה
  choice: യെഹൂദയുടെ രാജാവായി
  rationale: യെഹൂദയുടെ മേലുള്ള രാജാധികാരം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘യെഹൂദയുടെമേൽ’ എന്ന പ്രയോഗത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
