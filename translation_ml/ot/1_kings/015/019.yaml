- from: “എനിക്കും നിനക്കും തമ്മിലും എന്റെ അപ്പനും നിന്റെ അപ്പനും തമ്മിലും ഒരു ഉടമ്പടിയുണ്ട്. ഇതാ, ഞാൻ നിനക്കു വെള്ളിയും പൊന്നും കൈക്കൂലിയായി അയച്ചിരിക്കുന്നു. നീ ചെന്ന് ഇസ്രായേൽരാജാവായ ബയെശയോടുള്ള നിന്റെ ഉടമ്പടി ലംഘിക്കുക; അപ്പോൾ അവൻ എന്നെ വിട്ടുപോകും.”
  to: “എനിക്കും നിനക്കും ഇടയിൽ, എന്റെ അപ്പനും നിന്റെ അപ്പനും ഇടയിൽ ഒരു ഉടമ്പടിയുണ്ട്. ഇതാ, ഞാൻ നിനക്കു വെള്ളിയും പൊന്നും കൈക്കൂലിയായി അയച്ചിരിക്കുന്നു. നീ ചെന്ന് ഇസ്രായേൽരാജാവായ ബയെശായുമായുള്ള നിന്റെ ഉടമ്പടി ലംഘിക്കുക; അവൻ എന്നെ വിട്ടുപോകേണ്ടതിന്.”
