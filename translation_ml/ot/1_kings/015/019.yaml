source:
  edition: WLC
  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ בֵּ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּה֩ שָׁלַ֨חְתִּֽי לְ/ךָ֥ שֹׁ֨חַד֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֣ךְ הָפֵ֗רָ/ה אֶת בְּרִֽיתְ/ךָ֙ אֶת בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: ml
  text: “എനിക്കും നിനക്കും ഇടയിൽ, എന്റെ അപ്പനും നിന്റെ അപ്പനും ഇടയിൽ ഒരു ഉടമ്പടിയുണ്ട്. ഇതാ, ഞാൻ നിനക്കു വെള്ളിയും പൊന്നും കൈക്കൂലിയായി അയച്ചിരിക്കുന്നു. നീ ചെന്ന് ഇസ്രായേൽരാജാവായ ബയെശായുമായുള്ള നിന്റെ ഉടമ്പടി ലംഘിക്കുക; അവൻ എന്നെ വിട്ടുപോകേണ്ടതിന്.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: ഉടമ്പടി
  rationale: വ്യക്തികളെയും രാജാക്കന്മാരെയും ബന്ധിപ്പിക്കുന്ന ഔപചാരിക ധാരണ എന്ന എബ്രായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שֹׁחַד
  choice: കൈക്കൂലി
  rationale: രാഷ്ട്രീയ തീരുമാനം സ്വാധീനിക്കാൻ അയച്ച വെള്ളിയും പൊന്നുമാണ് സന്ദർഭം; അതിനാൽ നിഷ്പക്ഷമായ ‘സമ്മാനം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ പ്രതികൂല സൂചന ‘കൈക്കൂലി’ സംരക്ഷിക്കുന്നു.
- source_word: הָפֵרָה
  choice: ലംഘിക്കുക
  rationale: ഉടമ്പടി റദ്ദാക്കുകയോ തകർക്കുകയോ ചെയ്യുക എന്ന ഹിഫീൽ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: അവൻ എന്നെ വിട്ടുപോകും
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ മേൽനിന്ന് കയറിപ്പോകുക’; സന്ദർഭത്തിൽ സൈനിക സമ്മർദം പിൻവലിക്കുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു, എന്നാൽ ‘സൈന്യം’ എന്ന അപ്രസ്തുത പദം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള രാജകീയ സന്ദേശശൈലി. ആവർത്തിച്ചുള്ള ‘തമ്മിലും’ ഘടന മൂലപാഠത്തിലെ സമാന്തരത നിലനിർത്തുന്നു. ‘ഇതാ’ എന്നത് הִנֵּהയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
