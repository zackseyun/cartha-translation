translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നിദ്രപ്രാപിച്ചു’ എന്ന സാഹിത്യപരമായ മരണപ്രയോഗം മൂലപാഠത്തിലെ രാജകീയ സൂത്രവാക്യം സംരക്ഷിക്കുന്നു; അവ്യക്തത ഒഴിവാക്കാതെ ആവശ്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
