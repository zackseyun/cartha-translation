  text: וַ/יִּשְׁכַּ֤ב אָסָא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: ml
  text: ആസാ തന്റെ പിതാക്കന്മാരോടുകൂടെ[a] നിദ്ര പ്രാപിച്ചു; തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ[b] തന്റെ പിതാക്കന്മാരോടുകൂടെ അടക്കം ചെയ്യപ്പെട്ടു. അവന്റെ മകൻ യെഹോശാഫാത്ത് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തന്റെ പൂർവികരോടുകൂടെ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ’ എന്നാണ്; മരണത്തെക്കുറിച്ചും അടക്കത്തെക്കുറിച്ചും രാജവിവരണങ്ങളിൽ പതിവായി ഉപയോഗിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘തന്റെ പിതാവ്’ എന്നു പറയുന്നത് ആസായുടെ നേരിട്ടുള്ള പിതാവിനെയല്ല, രാജവംശത്തിലെ പൂർവപിതാവായ ദാവീദിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജാക്കന്മാരുടെ മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിലെ ‘കിടന്നു/ഉറങ്ങി’ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭം മരണമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: മരണവും അടക്കവും സംബന്ധിച്ച പതിവ് രാജകീയ പ്രയോഗത്തിന്റെ പൂർവിക-വംശപരമായ ധ്വനി നിലനിർത്തുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കം ചെയ്യപ്പെട്ടു
  rationale: നിഫാൽ ക്രിയയുടെ കർമണി അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ
  rationale: എബ്രായ വാക്യഘടനയും ദാവീദുമായുള്ള രാജവംശബന്ധവും സംരക്ഷിക്കുന്നു; ഇവിടെ ‘പിതാവ്’ നേരിട്ടുള്ള ജനകനെയല്ല, രാജവംശത്തിലെ പൂർവപിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיִּמְלֹךְ
  choice: രാജ്യം ഭരിച്ചു
  rationale: രാജാവായി ഭരിക്കുക എന്ന ക്രിയയുടെ അർഥം രാജസ്ഥാനാവകാശ അറിയിപ്പിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: കേവലം കാലക്രമമല്ല, രാജസ്ഥാനത്തെ പിൻഗാമിത്വമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
