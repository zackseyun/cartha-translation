source:
  edition: WLC
  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: ml
  text: ഇസ്രായേൽരാജാവായ ബയെശാ യെഹൂദായ്ക്കെതിരെ പടയെടുത്തു. യെഹൂദാരാജാവായ ആസയുടെ അടുക്കലേക്കു ആരും പോകാനോ വരാനോ അനുവദിക്കാതിരിക്കാനായി അവൻ രാമ പണിതു[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാമയെ കോട്ടയാക്കി ബലപ്പെടുത്തി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം “പണിതു” എന്നാണ്; എന്നാൽ സന്ദർഭം തന്ത്രപ്രധാനമായ ഒരു സൈനികനിർമാണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പോകുക, വരുക” എന്നത് സഞ്ചാരത്തെയും പ്രവേശനത്തെയും പൊതുവായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ആസയുടെ അടുക്കലേക്കുള്ള ആളുകളുടെ ഗതാഗതം തടയുകയായിരുന്നു ബയെശായുടെ ലക്ഷ്യം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: യെഹൂദായ്ക്കെതിരെ പടയെടുത്തു
  rationale: സൈനികസന്ദർഭത്തിൽ עלה ... על എന്ന പ്രയോഗം ശത്രുതാപരമായി മുന്നേറുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പടയെടുത്തു’ എന്നത് ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ ബയെശാ
  rationale: രാജപദവിയും രാജ്യവും സ്വാഭാവികമായ മലയാള വിശേഷണഘടനയിൽ ചേർത്തു; വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: രാമാ പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘പണിയുക’ നിലനിർത്തി. സന്ദർഭം കോട്ടകെട്ടി ബലപ്പെടുത്തലിനെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: לְבִלְתִּי תֵּת
  choice: അനുവദിക്കാതിരിക്കാനായി
  rationale: തടയുക എന്ന ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന എബ്രായ ഉദ്ദേശ്യഘടന സ്വാഭാവികമായി പകർന്നു.
- source_word: יֹצֵא וָבָא
  choice: പുറത്തുപോകാനോ അകത്തുവരാനോ
  rationale: സഞ്ചാരത്തെയും പ്രവേശനത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ ദ്വന്ദപ്രയോഗത്തിന്റെ രൂപവും ആശയവും കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ അടുക്കലേക്ക്
  rationale: לְ എന്ന ബന്ധസൂചകത്തിന്റെ ലക്ഷ്യദിശ ഇവിടെ നിലനിർത്തി; ഉപരോധം ആസയിലേക്കുള്ള സഞ്ചാരത്തെ തടയുന്നതായി പാഠം അവതരിപ്പിക്കുന്നു.
