translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സൈനികഭാവം ‘പടയെടുത്തു’ എന്നതിലൂടെ വ്യക്തമാക്കി; ‘പണിതു’ എന്ന പദത്തിന്റെ യഥാർഥ lexical വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘പുറത്തുപോകുക, അകത്തുവരുക’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
