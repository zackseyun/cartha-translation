  source_fidelity: 'മുഖ്യപാഠം എബ്രായ വാക്യക്രമത്തിനും അർത്ഥത്തിനും വിശ്വസ്തമാണ്: മരണത്തിന്റെ പതിവുപ്രയോഗം, സജീവ ബഹുവചനമായ ‘അവർ അടക്കം ചെയ്തു,’ ദാവീദിന്റെ നഗരം, ആസായുടെ അധികാരാരോഹണം എന്നിവ ശരിയായി നൽകിയിരിക്കുന്നു. എന്നാൽ ഇംഗ്ലീഷ് POB-യുടെ നാമരൂപ-കുറിപ്പ് മലയാളത്തിൽ ഒഴിവാക്കിയിരിക്കുന്നു; ബന്ധപ്പെട്ട പാഠാന്തര/സമാന്തര നാമരൂപത്തെക്കുറിച്ചുള്ള ഈ ഉപകാരപ്രദമായ വിവരം അബീയാം എന്ന നാമത്തോടു ശരിയായ ആങ്കറിൽ ചേർക്കണം.'
  naturalness: ‘നിദ്രപ്രാപിച്ചു,’ ‘അടക്കം ചെയ്തു,’ ‘അവനു പകരം രാജാവായി’ എന്നിവ ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാള ബൈബിൾ രജിസ്റ്ററിൽ സ്വാഭാവികമാണ്. ആദ്യ അടിക്കുറിപ്പിലെ ‘പൂർവികരോടു ചേരുക’ എന്ന വിശദീകരണം മരണാനന്തര-ചേരലിനെക്കുറിച്ചുള്ള ആവശ്യമില്ലാത്ത സൂചന നൽകാം; അതിനെ മരണത്തെയും പിതാക്കന്മാരുടെ അടക്കവുമായി ബന്ധപ്പെട്ട പതിവ് പ്രയോഗമെന്നു പരിമിതപ്പെടുത്തുന്നതാണ് ഉചിതം.
