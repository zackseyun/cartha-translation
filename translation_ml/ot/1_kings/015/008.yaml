source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב אֲבִיָּם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: ml
  text: അബീയാം[b] തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]. അവർ അവനെ ദാവീദിന്റെ നഗരത്തിൽ അടക്കം ചെയ്തു. അവന്റെ മകനായ ആസാ അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു” എന്നത് മരണത്തെയും പിതാക്കന്മാരോടൊപ്പമുള്ള അടക്കത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: ചില സമാന്തരമോ ബന്ധപ്പെട്ടതോ ആയ വാക്യങ്ങളിൽ അബീയാം ‘അബീയാവ്’ എന്നു വിളിക്കപ്പെടുന്നു; ഇവിടെ എബ്രായ പാഠത്തിൽ ‘അബീയാം’ എന്നാണ് ഉള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെയും പൂർവികരോടു ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ രൂപകഭാവവും വംശപരമായ സൂചനയും നിലനിർത്തുന്നു; വെറും ‘മരിച്ചു’ എന്നു പറഞ്ഞ് പ്രയോഗത്തെ നിരപ്പാക്കുന്നില്ല.
- source_word: אֲבִיָּם
  choice: അബീയാം
  rationale: ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം അֲבִיָּם ആയതിനാൽ അതിനനുസരിച്ചുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: അവർ അവനെ ... അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ സജീവ ബഹുവചന ക്രിയയെ അതേപടി നിലനിർത്തുന്നു; കർത്താക്കൾ ആരെന്ന് പാഠം വ്യക്തമാക്കാത്തതിനാൽ തിരിച്ചറിയൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: സ്ഥലനാമപ്രയോഗത്തെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഇവിടെ രാജഭരണത്തിന്റെ ദൈർഘ്യമല്ല, സിംഹാസനാരോഹണമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אָסָא בְנוֹ
  choice: അവന്റെ മകനായ ആസാ
  rationale: ബന്ധം വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാള പദക്രമം.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജകീയ പിന്തുടർച്ചയിൽ ഒരാളുടെ സ്ഥാനത്ത് മറ്റൊരാൾ അധികാരമേൽക്കുന്നതെന്ന അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മരണത്തെക്കുറിച്ചുള്ള എബ്രായ രൂപകം നിലനിർത്തിയെങ്കിലും തെറ്റിദ്ധാരണ കുറയ്ക്കാൻ അടിക്കുറിപ്പ് നൽകി. ഇംഗ്ലീഷ് കരടിലെ [b] കുറിപ്പ് ‘ദാവീദിന്റെ നഗരം’ എന്ന ഭാഗത്തോട് പൊരുത്തപ്പെടുന്നില്ലെന്നും ഈ വാക്യത്തിലെ നാമരൂപത്തെക്കുറിച്ചുള്ള വിവരമാണെന്നും കണക്കാക്കി, പ്രധാന പാഠത്തിലെ ‘അബീയാം’ എന്ന ലിപ്യന്തരണംകൊണ്ട് വിഷയം നേരിട്ട് കൈകാര്യം ചെയ്തു; അതിനാൽ അനാവശ്യമായ രണ്ടാമത്തെ അടിക്കുറിപ്പ് ചേർത്തില്ല.
