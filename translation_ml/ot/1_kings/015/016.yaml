translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. എബ്രായവാക്യത്തിലെ ദൈർഘ്യപ്രയോഗത്തിന്റെ അവ്യക്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തി; അക്ഷരാർഥവും മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ നൽകി.
