  text: וּ/מִלְחָמָ֨ה הָיְתָ֜ה בֵּ֣ין אָסָ֗א וּ/בֵ֛ין בַּעְשָׁ֥א מֶֽלֶךְ יִשְׂרָאֵ֖ל כָּל יְמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/016.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: ml
  text: ആസായും ഇസ്രായേൽരാജാവായ ബയെശയും തമ്മിൽ അവരുടെ എല്ലാ നാളുകളിലും യുദ്ധം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അവരുടെ ദിവസങ്ങളെല്ലാം.” “അവരുടെ ജീവിതകാലമൊക്കെയും” എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: യുദ്ധം ഉണ്ടായിരുന്നു
  rationale: מִלְחָמָה എന്നത് ‘യുദ്ധം/പോരാട്ടം’ എന്നും היה ചേർന്ന അസ്തിത്വവാക്യം ‘ഉണ്ടായിരുന്നു’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിലെ തുടർച്ച സൂചിപ്പിക്കാൻ വേറെ ക്രിയ ചേർക്കാതെ എബ്രായഘടന സംരക്ഷിക്കുന്നു.
- source_word: בֵּין ... וּ/בֵין
  choice: …യും …യും തമ്മിൽ
  rationale: രണ്ടു പക്ഷങ്ങൾക്കിടയിലെ പരസ്പരവിരോധം സൂചിപ്പിക്കുന്ന ജോടിപൂർവപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אָסָא
  choice: ആസാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּעְשָׁא
  choice: ബയെശ
  rationale: എബ്രായ വ്യക്തിനാമമായ Baʿšāയിലെ വ്യഞ്ജനക്രമവും തൊണ്ടധ്വനിയും വായനാസൗകര്യത്തോടെ പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ബയെശയുടെ രാജപദവി സൂചിപ്പിക്കുന്ന സംയുക്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל יְמֵי/הֶם
  choice: അവരുടെ കാലമൊക്കെയും
  rationale: അക്ഷരാർഥം ‘അവരുടെ ദിവസങ്ങളെല്ലാം’ എന്നാണ്. എന്നാൽ ഈ രാജവൃത്താന്തസന്ദർഭത്തിൽ ജീവിതകാലമോ ഭരണകാലമോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കാതെ ദൈർഘ്യം സൂചിപ്പിക്കാൻ ‘കാലമൊക്കെയും’ ഉപയോഗിക്കുന്നു.
