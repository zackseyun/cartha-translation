source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: ml
  text: എന്നാൽ ഉയർന്ന ആരാധനാസ്ഥലങ്ങൾ നീക്കിക്കളഞ്ഞില്ല. എങ്കിലും ആസായുടെ ഹൃദയം അവന്റെ ആയുഷ്കാലമൊക്കെയും യഹോവയോടു പൂർണമായി അർപ്പിതമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആസായുടെ ഹൃദയം അവന്റെ ആയുഷ്കാലമൊക്കെയും യഹോവയോട് അവിഭക്തമായിരുന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥം: “ആസായുടെ ഹൃദയം യഹോവയോടുകൂടെ പൂർണമായിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: പൂജാഗിരികൾ
  rationale: בָּמוֹת എന്നത് പ്രാദേശിക ആരാധനയ്ക്കായി ഉപയോഗിച്ചിരുന്ന ഉയർന്ന സ്ഥലങ്ങളെയോ അവിടത്തെ ആരാധനാകേന്ദ്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘പൂജാഗിരികൾ’ എന്നത് സ്ഥലത്തിന്റെ ഉയരവും ആരാധനാപരമായ സ്വഭാവവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: לֹא סָרוּ
  choice: നീക്കിക്കളഞ്ഞില്ല
  rationale: ഇവിടെ סוּר എന്ന ക്രിയ പൂജാഗിരികളെ പരിഷ്കാരനടപടികളിലൂടെ ഇല്ലാതാക്കുക എന്ന അർഥത്തിലാണ്; അതിനാൽ സ്വാഭാവികമായ മലയാള പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: רַק
  choice: എങ്കിലും
  rationale: പൂജാഗിരികൾ നീക്കപ്പെടാതിരുന്നതും ആസായുടെ അടിസ്ഥാനപരമായ വിശ്വസ്തതയും തമ്മിലുള്ള concessive contrast സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבַב אָסָא
  choice: ആസായുടെ ഹൃദയം
  rationale: לְבַב ഉള്ളിലെ വ്യക്തിത്വം, ഇച്ഛ, ഭക്തി, വിശ്വസ്തത എന്നിവയെ ഉൾക്കൊള്ളുന്നു; മൂലരൂപത്തിലെ ഹൃദയരൂപകം നിലനിർത്തി.
- source_word: שָׁלֵם
  choice: പൂർണമായി അർപ്പിതമായിരുന്നു
  rationale: ഈ ഉടമ്പടിപരമായ സന്ദർഭത്തിൽ שָׁלֵם പാപരഹിതമായ പരിപൂർണതയെയല്ല, വിഭജിക്കപ്പെടാത്ത അടിസ്ഥാന വിശ്വസ്തതയെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഭക്തിയുടെ ദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവിക പരിഭാഷയാണിത്.
- source_word: עִם יְהוָה
  choice: യഹോവയോടു
  rationale: עִם എന്നതിന്റെ ‘കൂടെ/യോടു’ എന്ന ബന്ധഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘അർപ്പിതം’ എന്ന പ്രയോഗത്തോടും ഇത് സ്വാഭാവികമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כָּל יָמָיו
  choice: അവന്റെ ആയുഷ്കാലമൊക്കെയും
  rationale: ‘അവന്റെ എല്ലാ ദിവസങ്ങളും’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ജീവിതകാലമൊട്ടാകെയുള്ള വ്യാപ്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പൂജാഗിരികൾ നിലനിന്നിട്ടും ആസായുടെ ഹൃദയം ‘പൂർണം’ എന്നു പറയുന്നതിന്റെ അർഥം
  choice: ആസായുടെ അടിസ്ഥാനപരവും അവിഭക്തവുമായ ഉടമ്പടി-വിശ്വസ്തതയെ ഉറപ്പിക്കുന്നു; പാപരഹിതത്വമോ പരിഷ്കാരങ്ങളുടെ സമ്പൂർണ വിജയമോ അവകാശപ്പെടുന്നില്ല.
  alternative: ആസാ എല്ലാ കാര്യത്തിലും ധാർമികമായി കുറ്റമറ്റവനായിരുന്നു എന്ന വായന.
  rationale: നീക്കപ്പെടാത്ത പൂജാഗിരികളെയും שָׁלֵם ആയ ഹൃദയത്തെയും വാക്യം ഒരുമിച്ചു നിർത്തുന്നു. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ ‘പൂർണമായി അർപ്പിതം’ എന്നു പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പൂജാഗിരികൾ’ പുരാതന പ്രാദേശിക ഉയർന്ന ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ ഹീബ്രുവിലെ ‘പൂർണ ഹൃദയം’ എന്ന രൂപകവും ‘അവിഭക്തം’ എന്ന മറ്റൊരു സാധ്യതയും സംരക്ഷിക്കുകയും ചെയ്തു.
