  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: ml
  text: എങ്കിലും, ദാവീദിന്റെ നിമിത്തം യഹോവയായ അവന്റെ ദൈവം അവന് യെരൂശലേമിൽ ഒരു ദീപം[a] നൽകി, അവനുശേഷം അവന്റെ മകനെ ഉയർത്താനും യെരൂശലേമിനെ നിലനിർത്താനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിച്ചം’; ‘യെരൂശലേമിൽ ഒരു ദീപം നൽകി’ എന്നത് അവിടെ ദാവീദിന്റെ രാജവംശം തുടർന്നുനിൽക്കുമാറാക്കി എന്നർഥമുള്ള രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിലെ അബീയാമിന്റെ പാപത്തോട് വിരുദ്ധമായി, അവൻ പൂർണമായി ഛേദിക്കപ്പെടാതിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന സന്ദർഭോചിതമായ concessive ബന്ധകം.
- source_word: לְמַעַן דָּוִד
  choice: ദാവീദിനെ ഓർത്ത്
  rationale: ദാവീദിന്റെ നിമിത്തം അഥവാ അവനെ പരിഗണിച്ച് യഹോവ പ്രവർത്തിച്ചു എന്ന വ്യക്തികേന്ദ്രിതമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהָיו
  choice: അവന്റെ ദൈവം
  rationale: ഹീബ്രായിലെ സർവനാമത്തിന്റെ അവ്യക്തത പരിഹരിക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അത് അബീയാമിനെ സൂചിപ്പിക്കുന്നു.
- source_word: נִיר
  choice: ദീപം
  rationale: ദാവീദിന്റെ രാജവംശം തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: בִּירוּשָׁלָם
  choice: യെരൂശലേമിൽ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: അവന്റെ മകനെ അവനുശേഷം ഉയർത്താൻ
  rationale: രാജവംശീയ പിൻഗാമിയെ ഉയർത്തുക എന്ന causative അർഥവും ഹീബ്രായിലെ infinitive ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: യെരൂശലേമിനെ നിലനിർത്താൻ
  rationale: നഗരത്തെ രാജകീയ കേന്ദ്രമായി നിലനിൽക്കുമാറാക്കുക എന്ന עמד എന്ന ക്രിയയുടെ causative അർഥം സ്വാഭാവികമായി നൽകുന്നു; 'സ്ഥാപിക്കുക' എന്നത് ഇതിനകം നിലവിലുള്ള നഗരത്തെക്കുറിച്ച് അസ്വാഭാവികമാകാം.
theological_decisions:
- issue: നִיר എന്ന രൂപകവും ദാവീദിക ഉടമ്പടിയും
  choice: മുഖ്യപാഠത്തിൽ ‘ദീപം’ നിലനിർത്തുക
  alternative: രാജവംശം; വംശപരമ്പര; വെളിച്ചം
  rationale: ദാവീദിന്റെ രാജവംശത്തിന്റെ തുടർച്ചയെ വ്യാഖ്യാനമായി പകരംവെക്കാതെ ഹീബ്രായിലെ രൂപകവും അതിന്റെ അന്തർപാഠബന്ധങ്ങളും സംരക്ഷിക്കുന്നു.
- issue: ‘അവന്റെ ദൈവം’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘അവന്റെ ദൈവം’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി വ്യാകരണപരമായ തുറന്ന നില സംരക്ഷിക്കുക
  alternative: അബീയാമിന്റെ ദൈവം; ദാവീദിന്റെ ദൈവം
  rationale: സന്ദർഭത്തിൽ ഏറ്റവും സമീപവും സാധ്യതയേറിയതുമായ സൂചിതൻ അബീയാമാണെങ്കിലും, മൂലപാഠം പേര് ആവർത്തിക്കുന്നില്ല; അതിനാൽ പരിഭാഷ അതിനെ അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- issue: യെരൂശലേമിനെ ‘നിലനിർത്തുക’ എന്നതിന്റെ വ്യാപ്തി
  choice: പാഠത്തിൽ നഗരനാമം തന്നെ നിലനിർത്തുക
  alternative: യെരൂശലേം കേന്ദ്രീകരിച്ച ദാവീദിക രാജത്വം നിലനിർത്തുക
  rationale: നഗരം രാജത്വത്തെ പരോക്ഷമായി പ്രതിനിധാനം ചെയ്യാമെങ്കിലും, മൂലപാഠം യെരൂശലേമിനെ തന്നെയാണ് നാമകരണം ചെയ്യുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദാവീദിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘ദീപം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു. സമാന്തര infinitive ഘടനകൾ ‘ഉയർത്താനും ... നിലനിർത്താനും’ എന്നായി നിലനിർത്തി.
