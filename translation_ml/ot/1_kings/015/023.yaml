id: 1KI.15.23
reference: 1 Kings 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: ml
  text: ആസായുടെ മറ്റെല്ലാ പ്രവൃത്തികളും അവന്റെ സകല പരാക്രമവും അവൻ ചെയ്തതൊക്കെയും അവൻ പണിത നഗരങ്ങളും—ഇവയെല്ലാം യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തഗ്രന്ഥത്തിൽ[a] എഴുതിയിട്ടില്ലേ? എന്നാൽ വാർധക്യകാലത്ത് അവന്റെ കാലുകൾക്ക് രോഗം ബാധിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദാരാജാക്കന്മാരുടെ രാജവൃത്താന്തഗ്രന്ഥത്തിൽ.”
    reason: ഗ്രന്ഥനാമത്തിലെ דִּבְרֵי הַיָּמִים എന്ന പ്രയോഗം ‘ദിനവൃത്താന്തം’ എന്നും ഔദ്യോഗിക ‘രാജവൃത്താന്തം’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, “അവന്റെ കാലുകൾക്ക് അസുഖം വന്നു.” ഏതു രോഗമായിരുന്നുവെന്ന് ഹീബ്രു പാഠം വ്യക്തമാക്കുന്നില്ല; ബാധിക്കപ്പെട്ട ശരീരഭാഗം മാത്രമാണ് പറയുന്നത്.
    reason: ഹീബ്രു ക്രിയ രോഗാവസ്ഥയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; നിർദിഷ്ട രോഗനിർണയം പരിഭാഷയിൽ ചേർക്കാതിരിക്കണം.
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: ആസായുടെ മറ്റെല്ലാ പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വാക്കുകളെയല്ല, രാജാവിന്റെ പ്രവൃത്തികളെയും ഭരണസംഭവങ്ങളെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; וְיֶתֶר כָּל എന്നതിന്റെ ശേഷിക്കുന്നവ എന്ന ആശയം ‘മറ്റെല്ലാ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: അവന്റെ സകല പരാക്രമവും
  rationale: גְּבוּרָה ശക്തി, വീര്യം, പരാക്രമം എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘അവൻ ചെയ്തതൊക്കെയും’ എന്നതിൽനിന്ന് വേറിട്ട ഒരു അമൂർത്ത നാമമായി ‘പരാക്രമം’ നിലനിർത്തുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: ബന്ധവാക്യത്തിന്റെ വിശാലമായ അർഥപരിധി ചുരുക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: അവൻ പണിത നഗരങ്ങളും
  rationale: בָּנָה എന്നത് ‘പണിതു’ എന്നാണ്; സന്ദർഭത്തിൽ കോട്ടകെട്ടൽ ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും മൂലപാഠം വ്യക്തമാക്കാത്തത് പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: ഇവയെല്ലാം ... എഴുതിയിട്ടില്ലേ?
  rationale: ഹീബ്രുവിലെ നിഷേധരൂപത്തിലുള്ള അലങ്കാരചോദ്യവും ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തഗ്രന്ഥത്തിൽ
  rationale: ഔദ്യോഗിക രാജവൃത്താന്തത്തെ സൂചിപ്പിക്കുന്ന ഗ്രന്ഥനാമം ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: എന്നാൽ വാർധക്യകാലത്ത്
  rationale: רַק ഇവിടെ പരിമിതിപ്പെടുത്തുന്ന വൈരുധ്യസൂചനയാണ്; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നൽകുന്നു. കാലസൂചന ‘വാർധക്യകാലത്ത്’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: חָלָה אֶת רַגְלָיו
  choice: അവന്റെ കാലുകൾക്ക് രോഗം ബാധിച്ചു
  rationale: രോഗത്തിന്റെ കൃത്യസ്വഭാവം പറയാതെ ബാധിക്കപ്പെട്ട ശരീരഭാഗം മാത്രം വ്യക്തമാക്കുന്ന ഹീബ്രു പ്രയോഗം അതേ അനിശ്ചിതത്വത്തോടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. രാജഭരണസംഗ്രഹത്തിന്റെ ആവർത്തനഘടനയും അലങ്കാരചോദ്യവും നിലനിർത്തി; രോഗത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിലെ അനിശ്ചിതത്വം പരിഹരിച്ചിട്ടില്ല.
