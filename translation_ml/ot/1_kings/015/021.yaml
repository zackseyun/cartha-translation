  naturalness: ‘ബാശാ അതു കേട്ടപ്പോൾ, രാമാ പണിയുന്നത് നിർത്തി തിർസയിൽത്തന്നെ പാർത്തു’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായ ആഖ്യാനവാക്യമാണ്. സ്ഥലനാമം ‘തിർസാ’ എന്ന പൂർണരൂപത്തിൽ നൽകുകയും വിഭക്തിയോടെ ‘തിർസയിൽ’ എന്നു പ്രയോഗിക്കുകയും ചെയ്യുന്നു.
