id: 1KI.15.28
reference: 1 Kings 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמִתֵ֣/הוּ בַעְשָׁ֔א בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസായുടെ ഭരണത്തിന്റെ മൂന്നാം വർഷത്തിൽ ബയെശാ അവനെ കൊന്നുകളഞ്ഞു[a]; അവന്റെ സ്ഥാനത്ത് അവൻ രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ മരിപ്പിച്ചു.” ഹീബ്രു ക്രിയ കാരണാർത്ഥകമാണ്; അക്ഷരാർഥത്തിൽ, “അവൻ മരിക്കാൻ ഇടയാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: അവനെ കൊന്നുകളഞ്ഞു
  rationale: מות എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘മരിക്കാൻ ഇടയാക്കി/കൊന്നു’ എന്ന കാരണാർത്ഥം നൽകുന്നു. കഥാസന്ദർഭത്തിൽ ‘കൊന്നുകളഞ്ഞു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בַעְשָׁא
  choice: ബയെശാ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തതായി ലിപ്യന്തരിച്ചു.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ഭരണത്തിന്റെ മൂന്നാം വർഷത്തിൽ
  rationale: രാജഭരണവർഷം സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ഭരണത്തിന്റെ’ എന്നു ചേർത്തു.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ
  rationale: לְ ഇവിടെ ഭരണവർഷത്തിന്റെ അവലംബം സൂചിപ്പിക്കുന്നു; രാജപദവിയും രാജ്യവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിച്ചു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: מלך എന്ന ക്രിയയ്ക്ക് ഈ അവകാശപിന്തുടർച്ചാസന്ദർഭത്തിൽ ‘രാജാവായി/ഭരണം തുടങ്ങി’ എന്ന അർഥമുണ്ട്. ‘രാജാവായി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: תחת pronominal suffix സഹിതം പകരക്കാരനാകൽ അഥവാ രാജാവകാശപിന്തുടർച്ച സൂചിപ്പിക്കുന്നു.
