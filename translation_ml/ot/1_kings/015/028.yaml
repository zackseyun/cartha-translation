translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. രാജവാഴ്ചയുടെ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘ഭരണത്തിന്റെ’ ചേർത്തെങ്കിലും മൂലത്തിന്റെ അർഥം വികസിപ്പിച്ചിട്ടില്ല; കാരണാർത്ഥക ക്രിയയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
