  to: നാദാബിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതെല്ലാം ഇസ്രായേൽ രാജാക്കന്മാരുടെ വൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
