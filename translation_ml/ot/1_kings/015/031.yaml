  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: നാദാബിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതെല്ലാം ഇസ്രായേൽ രാജാക്കന്മാരുടെ വൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ വാർഷികരേഖകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ഒരു രാജകീയ രേഖാസ്രോതസ്സിനെയാണ് സൂചിപ്പിക്കുന്നത്; അത് ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകമാകണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: നാദാബിനെക്കുറിച്ചുള്ള ശേഷിച്ച കാര്യങ്ങളും
  rationale: יֶתֶר എന്നത് ‘ശേഷിച്ചവ’ എന്നും דִּבְרֵי ഇവിടെ രാജാവിനെക്കുറിച്ചുള്ള കാര്യങ്ങൾ/പ്രവൃത്തികൾ എന്നും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘അവൻ ചെയ്തതെല്ലാം’ എന്ന വാക്യഭാഗത്തോടൊപ്പം സ്വാഭാവികമായി വായിക്കാനായി ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതെല്ലാം
  rationale: എബ്രായ ആപേക്ഷികവാക്യത്തിന്റെ സമഗ്രതയും ലളിതമായ ചരിത്രാഖ്യാനശൈലിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: ഹֲלֹא അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. മലയാളത്തിലെ നിഷേധചോദ്യരൂപം അതിന്റെ ഭാവം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്മേൽ/ചുരുളിന്മേൽ’ എന്നാണെങ്കിലും ഒരു രേഖാസ്രോതസ്സിലെ ഉള്ളടക്കത്തെ പരാമർശിക്കുമ്പോൾ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ വൃത്താന്തപുസ്തകം
  rationale: דִּבְרֵי הַיָּמִים ഇവിടെ രാജകീയ സംഭവരേഖകളെയോ വാർഷികവൃത്താന്തങ്ങളെയോ സൂചിപ്പിക്കുന്നു. കാനോനിക ദിനവൃത്താന്തപുസ്തകവുമായി അനാവശ്യമായി സമീകരിക്കാതെ സ്രോതസ്സിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ അലങ്കാരചോദ്യം പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തി; അടിക്കുറിപ്പിന്റെ സൂചകം അതു വിശദീകരിക്കുന്ന വൃത്താന്തപുസ്തകത്തിനരികിൽ ചേർത്തു.
