source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: ml
  text: 'അപ്പോൾ ആസാ യഹ്‌വേയുടെ ആലയത്തിലെ ഭണ്ഡാരങ്ങളിലും രാജാവിന്റെ ഭവനത്തിലെ[a] ഭണ്ഡാരങ്ങളിലും ശേഷിച്ചിരുന്ന വെള്ളിയും സ്വർണവും മുഴുവൻ എടുത്ത് തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏൽപ്പിച്ചു. തുടർന്ന് ആസാ രാജാവ് അവയെ ദമസ്‌കൊസിൽ വസിച്ചിരുന്ന അരാമിന്റെ[b] രാജാവായ, ഹെസിയോന്റെ മകനായ തബ്രിമ്മോന്റെ മകൻ ബെൻ-ഹദദിന്റെ അടുക്കലേക്ക് അയച്ചു, ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജാവിന്റെ കൊട്ടാരത്തിലെ’.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘അരാം’ എബ്രായ നാമമാണ്; പരമ്പരാഗതമായി ‘സിറിയ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അപ്പോൾ ആസാ ... എടുത്ത്
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: ശേഷിച്ചിരുന്ന വെള്ളിയും സ്വർണവും മുഴുവൻ
  rationale: כָּל എന്ന സമഗ്രതയും הַנּוֹתָרִים എന്ന ശേഷിപ്പിന്റെ ആശയവും സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּאוֹצְרוֹת בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയത്തിലെ ഭണ്ഡാരങ്ങളിൽ
  rationale: אֹצָרוֹת വിലപിടിപ്പുള്ള വസ്തുക്കളുടെ ഭണ്ഡാരങ്ങളെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു നൽകിയിരിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘ആലയം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: രാജാവിന്റെ ഭവനത്തിലെ ഭണ്ഡാരങ്ങളിൽ
  rationale: ‘രാജാവിന്റെ വീട്/ഭവനം’ എന്ന എബ്രായരൂപത്തോട് അടുത്തുനിൽക്കുന്നു; സന്ദർഭത്തിൽ കൊട്ടാരം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിയന്ത്രണം ഏല്പിക്കൽ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; കൈ എന്ന ദൃശ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁלָחֵם
  choice: അവരെ ... അയച്ച്
  rationale: എബ്രായത്തിലെ കർമപ്രത്യയം വ്യാകരണപരമായി വെള്ളിയും സ്വർണവും സൂചിപ്പിക്കാമെങ്കിലും, അവ ദാസന്മാരുടെ കൈയിൽ ഏല്പിച്ച സാഹചര്യത്തിൽ മലയാളത്തിൽ ‘അവരെ’ ദൂതരായ ദാസന്മാരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അവർ കൊണ്ടുപോയ വസ്തുക്കൾ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: ഹെസ്യോന്റെ മകൻ തബ്രിമ്മോന്റെ മകൻ ബെൻ-ഹദദ്
  rationale: എബ്രായ വംശാവലിക്രമം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി പൂർവികനിൽനിന്ന് വ്യക്തിയിലേക്കുള്ള സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: പിന്നീടുള്ള ‘സിറിയ’ എന്ന പേരിനു പകരം എബ്രായ ചരിത്ര-ഭൂമിശാസ്ത്ര നാമമായ അരാം നിലനിർത്തുന്നു.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: ദമസ്‌കൊസിൽ വസിച്ചിരുന്ന
  rationale: ישב എന്ന കൃതന്തത്തിന്റെ താമസിക്കുക എന്ന അർഥം ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇപ്രകാരം പറയിച്ചു:'
  rationale: അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്ന സൂചനയായി മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാൽ മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: אֲרָם എന്ന ചരിത്ര-ഭൂമിശാസ്ത്ര നാമം
  choice: അരാം
  alternative: സിറിയ
  rationale: മൂല എബ്രായ നാമം നിലനിർത്തി പിന്നീടുള്ള പരമ്പരാഗത ഭൂമിശാസ്ത്രസമീകരണം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. ‘ഭണ്ഡാരം’, ‘ആലയം’, ‘വസിച്ചിരുന്ന’ തുടങ്ങിയ പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു; പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി.
