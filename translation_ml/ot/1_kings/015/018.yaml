  to: 'അപ്പോൾ ആസാ യഹ്‌വേയുടെ ആലയത്തിലെ ഭണ്ഡാരങ്ങളിലും രാജാവിന്റെ ഭവനത്തിലെ[a] ഭണ്ഡാരങ്ങളിലും ശേഷിച്ചിരുന്ന വെള്ളിയും സ്വർണവും മുഴുവൻ എടുത്ത് തന്റെ ദാസന്മാരുടെ കൈയിൽ ഏൽപ്പിച്ചു. തുടർന്ന് ആസാ രാജാവ് അവയെ ദമസ്‌കൊസിൽ വസിച്ചിരുന്ന അരാമിന്റെ[b] രാജാവായ, ഹെസിയോന്റെ മകനായ തബ്രിമ്മോന്റെ മകൻ ബെൻ-ഹദദിന്റെ അടുക്കലേക്ക് അയച്ചു, ഇപ്രകാരം പറഞ്ഞു:'
