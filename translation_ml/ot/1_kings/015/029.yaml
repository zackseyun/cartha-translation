source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ യൊരോബെയാമിന്റെ ഗൃഹം മുഴുവനെയും സംഹരിച്ചു. യൊരോബെയാമിനുവേണ്ടി ജീവനോടെ ആരെയും ശേഷിപ്പിച്ചില്ല[a]; അവനെ നശിപ്പിക്കുന്നതുവരെ[b]. തന്റെ ദാസനായ ശീലോന്യനായ അഹീയാവിലൂടെ യാഹ്‌വെ അരുളിച്ചെയ്ത വചനപ്രകാരമായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു ശ്വാസവും ശേഷിപ്പിച്ചില്ല’; അതായത്, ആരെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിനെ നശിപ്പിക്കുന്നതുവരെ’; ഇവിടെ ‘അതിനെ’ എന്നത് യൊരോബെയാമിന്റെ ഗൃഹത്തെ ഒരു സമഷ്ടിയായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: ഹീബ്രായ കാലസൂചക ആഖ്യാനപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു; രാജാരോഹണസന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: הִכָּה
  choice: വെട്ടിവീഴ്ത്തി
  rationale: വംശനിർമൂലനത്തിന്റെ സന്ദർഭത്തിൽ ക്രിയയുടെ ഹിംസാത്മക ശക്തിയും മരണസൂചനയും നിലനിർത്തുന്നു.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഗൃഹം മുഴുവനെയും
  rationale: രാജകീയ സന്ദർഭത്തിലെ ‘ഗൃഹം’ കുടുംബം, ഭവനം, രാജവംശം എന്നീ ബന്ധിത അർഥങ്ങൾ വഹിക്കാം; ‘വംശം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: ജീവനുള്ള ഒരുവനെയും ശേഷിപ്പിക്കാതെ
  rationale: ‘ഒരു ശ്വാസവും ശേഷിപ്പിച്ചില്ല’ എന്ന ഹീബ്രായ ദൃശ്യപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികവും മാനുഷികസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: לְיָרָבְעָם
  choice: യൊരോബെയാമിന്
  rationale: 'ബന്ധമോ അവകാശബന്ധമോ സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു: യൊരോബെയാമിന്റെ ആളുകളിൽ ആരും അവനുവേണ്ടി ശേഷിച്ചില്ല.'
- source_word: עַד הִשְׁמִידוֹ
  choice: അവനെ നശിപ്പിക്കുന്നതുവരെ
  rationale: ഏകവചന പുംലിംഗ പ്രത്യയം ‘അവനെ’ എന്നു ഔപചാരികമായി നിലനിർത്തുന്നു; അത് യൊരോബെയാമിന്റെ ഗൃഹത്തെ ഒരു സമഷ്ടിയായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּדְבַר יְהוָה
  choice: യാഹ്‌വെ അരുളിച്ചെയ്ത വചനപ്രകാരം
  rationale: നിവൃത്തിസൂത്രത്തിന്റെ അർഥം നിലനിർത്തുകയും ദൈവനാമം ഒരു പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: בְּיַד עַבְדּוֹ
  choice: തന്റെ ദാസനായ ... കൈമുഖാന്തരം
  rationale: പ്രവാചകമധ്യസ്ഥത സൂചിപ്പിക്കുന്ന ‘കൈമുഖാന്തരം’ എന്ന ഹീബ്രായ ശൈലി മലയാള ബൈബിൾഭാഷയിൽ ഗ്രഹിക്കാവുന്ന വിധം നിലനിർത്തുന്നു.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: ശീലോന്യൻ അഹീയാവ്
  rationale: പേരിനെ ലിപ്യന്തരം ചെയ്യുകയും സ്വദേശസൂചക വിശേഷണത്തെ സംക്ഷിപ്തമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ അതിനെ പദവിയാൽ പകരാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: עַד הִשְׁמִידוֹ എന്നതിലെ ഏകവചന സൂചന
  choice: അവനെ നശിപ്പിക്കുന്നതുവരെ
  alternative: അതിനെ—യൊരോബെയാമിന്റെ ഗൃഹത്തെ—നശിപ്പിക്കുന്നതുവരെ
  rationale: ഹീബ്രായത്തിലെ പുംലിംഗ ഏകവചനരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; അത് വ്യക്തിയായ യൊരോബെയാമിനെയോ അവന്റെ ഗൃഹത്തെ സമഷ്ടിയായോ സൂചിപ്പിക്കുന്നതിലെ സംഘർഷം വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിലവാരമലയാളം. ‘ഗൃഹം’, ‘കൈമുഖാന്തരം’, ‘അരുളിച്ചെയ്ത’ എന്നീ ബൈബിൾശൈലിയിലുള്ള പദങ്ങൾ മൂലത്തിലെ രാജവംശപരവും പ്രവാചകപരവുമായ ഭാവം സംരക്ഷിക്കുന്നതിനായി ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തി.
