source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: ml
  text: അവൻ തന്റെ അപ്പൻ തനിക്കുമുമ്പാകെ ചെയ്ത എല്ലാ പാപങ്ങളിലും നടന്നു.[a] തന്റെ പിതാവായ ദാവീദിന്റെ ഹൃദയംപോലെ അവന്റെ ഹൃദയം തന്റെ ദൈവമായ യഹോവയോട്[c] പൂർണമായി അർപ്പിതമായിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തനിക്കുമുമ്പാകെ’ എന്ന എബ്രായ പ്രയോഗത്തിന് ‘അവന്റെ സാന്നിധ്യത്തിൽ’ എന്നോ ‘അവനു മുമ്പ്/അവന്റെ കാലത്തിനു മുമ്പ്’ എന്നോ അർഥമാകാം. അപ്പന്റെ പാപങ്ങൾ അവൻ പിന്തുടർന്ന മാതൃകയായി അവന്റെ മുമ്പിൽ നിന്നു എന്ന സൂചനയും ഈ വാക്കുകളിൽ ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവന്റെ ഹൃദയം തന്റെ ദൈവമായ യഹോവയോട് പൂർണമായി വിശ്വസ്തമായിരുന്നില്ല.’'
    reason: alternative_reading
  - marker: c
    text: 'എബ്രായം: YHWH; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: എല്ലാ പാപങ്ങളിലും നടന്നു
  rationale: הלך എന്ന ക്രിയ בְּ ചേർന്ന ധാർമിക സന്ദർഭത്തിൽ ഒരാളുടെ ജീവിതനടപ്പിനെയോ പെരുമാറ്റരീതിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘പാപങ്ങളിൽ നടന്നു’ എന്ന ബൈബിൾസഹജ പ്രയോഗം രൂപകവും ധാർമിക അർഥവും നിലനിർത്തുന്നു.
- source_word: אָבִיו
  choice: തന്റെ അപ്പൻ
  rationale: ആദ്യ പരാമർശം ഉടനെയുള്ള പിതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘അപ്പൻ’ ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: തനിക്കുമുമ്പാകെ ചെയ്ത
  rationale: לְפָנָיו എന്നതിന് ‘അവന്റെ സാന്നിധ്യത്തിൽ’ എന്നും ‘അവനു മുമ്പ്’ എന്നും അർഥസാധ്യതയുണ്ട്. ‘തനിക്കുമുമ്പാകെ’ ഈ സ്ഥലകാല ദ്വയാർഥം ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
- source_word: לְבָבוֹ
  choice: അവന്റെ ഹൃദയം
  rationale: לֵבָב ഇച്ഛ, വിശ്വസ്തത, ആന്തരിക വ്യക്തിത്വം എന്നിവ ഉൾക്കൊള്ളുന്നു; ‘ഹൃദയം’ അതിന്റെ പാരമ്പര്യവും വിശാലതയും സംരക്ഷിക്കുന്നു.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: തന്റെ ദൈവമായ യഹോവയോട് പൂർണമായി അർപ്പിതമായിരുന്നില്ല
  rationale: שָׁלֵם ഇവിടെ പാപരഹിതമായ പൂർണതയേക്കാൾ വിഭജിക്കപ്പെടാത്ത ഉടമ്പടി-വിശ്വസ്തതയാണ് സൂചിപ്പിക്കുന്നത്. ‘പൂർണമായി അർപ്പിതം’ ആ ദൈവോന്മുഖ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ ഹൃദയംപോലെ
  rationale: താരതമ്യം വ്യക്തികൾക്കിടയിൽ പൊതുവായി അല്ല, അവരുടെ ഹൃദയങ്ങൾക്കിടയിലാണ്; അതിനാൽ മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തി. ഇവിടെ വംശപിതാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിതാവ്’ യോജിക്കുന്നു.
theological_decisions:
- issue: ‘ഹൃദയം ശാലേം ആയിരുന്നില്ല’ എന്നതിന്റെ അർഥം
  choice: ദൈവത്തോടുള്ള അവന്റെ ആന്തരിക സമർപ്പണം പൂർണവും അവിഭക്തവും ആയിരുന്നില്ല
  alternative: അവന്റെ ഹൃദയം ദൈവത്തോട് പൂർണ വിശ്വസ്തമായിരുന്നില്ല
  rationale: ദാവീദുമായുള്ള താരതമ്യം ഉടമ്പടി-വിശ്വസ്തതയെയാണ് വിലയിരുത്തുന്നത്; സമ്പൂർണ പാപരഹിതത്വത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി ഇതിനെ മാറ്റിയിട്ടില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ബഹുമാനസൂചക സ്ഥാനപ്പേരാൽ പകരാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘പാപങ്ങളിൽ നടന്നു’ എന്ന ധാർമിക രൂപകം മൂലപാഠത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു; ‘പൂർണമായി അർപ്പിതം’ എന്നത് ശാലേമിന്റെ ഉടമ്പടി-വിശ്വസ്തതാ ഭാവം പാപരഹിതത്വമായി തെറ്റിദ്ധരിപ്പിക്കാതെ നൽകുന്നു.
