id: 1KI.15.10
reference: 1 Kings 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ നാല്പത്തൊന്നു വർഷം രാജ്യം ഭരിച്ചു. അവന്റെ അമ്മയുടെ പേര് അബീശാലോമിന്റെ[a] മകൾ[b] മാഖാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘അബീശാലോം’; പല വിവർത്തനങ്ങളിലും ‘അബ്ശാലോം’ എന്ന പേരുരൂപം കാണുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘മകൾ’; വംശാവലിസന്ദർഭങ്ങളിൽ ഈ പദം കൂടുതൽ അകലെയുള്ള സ്ത്രീസന്തതിയെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: നാല്പത്തൊന്നു വർഷം
  rationale: എബ്രായയിലെ ‘നാല്പതും ഒന്നും വർഷം’ എന്ന സംഖ്യാഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജ്യം ഭരിച്ചു
  rationale: ഇവിടെ ക്രിയ രാജസ്ഥാനാരോഹണമല്ല, രാജഭരണത്തിന്റെ ദൈർഘ്യമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בִּירוּשָׁלִָם
  choice: യെരൂശലേമിൽ
  rationale: בְּ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അധികരണവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: וְשֵׁם אִמּוֹ
  choice: അവന്റെ അമ്മയുടെ പേര് … എന്നായിരുന്നു
  rationale: എബ്രായ ഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും മാന്യവുമായ മലയാളവാക്യം നൽകുന്നു.
- source_word: מַעֲכָה
  choice: മാഖാ
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בַּת
  choice: മകൾ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘മകൾ’ എന്നതാണ്; കൂടുതൽ അകലെയുള്ള സ്ത്രീസന്തതിയെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲבִישָׁלוֹם
  choice: അബീശാലോം
  rationale: ഇവിടത്തെ എബ്രായരൂപമായ אֲבִישָׁלוֹם നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: മാഖായുടെ ബന്ധനിർദേശം
  choice: പ്രധാനപാഠത്തിൽ ‘അബീശാലോമിന്റെ മകൾ’ എന്നു നിലനിർത്തി.
  alternative: ‘അബീശാലോമിന്റെ പേരക്കുട്ടി’ അല്ലെങ്കിൽ ‘അബീശാലോമിന്റെ സ്ത്രീസന്തതി’.
  rationale: എബ്രായപാഠം വ്യക്തമായി ‘മകൾ’ എന്നു പറയുന്നു. വംശാവലിപരമായ താരതമ്യത്തെ ആശ്രയിച്ച് ചരിത്രപരമായ ചോദ്യം വിവർത്തനത്തിൽ തീർപ്പാക്കാതെ, വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. രാജഭരണസന്ദർഭത്തിന് സ്വാഭാവികമായ ‘രാജ്യം ഭരിച്ചു’ ഉപയോഗിച്ചു; ബന്ധപദത്തിലെ യഥാർഥ പാഠരൂപവും അതിലെ വ്യാഖ്യാനസമ്മർദവും നിലനിർത്തി.
