- from: യെഹൂദാരാജാവായ ആസയുടെ ഭരണത്തിന്റെ മൂന്നാം വർഷത്തിൽ അഹീയാവിന്റെ മകനായ ബയെശാ തിർസയിൽവെച്ച് ഇസ്രായേൽ മുഴുവനും രാജാവായി; അവൻ ഇരുപത്തിനാലു വർഷം ഭരിച്ചു.
