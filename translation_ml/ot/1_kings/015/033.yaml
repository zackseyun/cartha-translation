  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസയുടെ ഭരണത്തിന്റെ മൂന്നാം വർഷത്തിൽ അഹീയാവിന്റെ മകനായ ബയെശാ ഇസ്രായേൽ മുഴുവനും രാജാവായി; അവൻ തിർസയിൽ ഇരുപത്തിനാലു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: ഭരണത്തിന്റെ മൂന്നാം വർഷത്തിൽ
  rationale: ב prefixed to the construct year phrase establishes the temporal setting. Malayalam requires the supplied idea ‘ഭരണം’ to make the regnal-year formula immediately clear and natural.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ
  rationale: The lamed identifies the reign by reference to Asa. The adjectival Malayalam construction naturally preserves both his name and royal title.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: In this context the first occurrence marks Baasha’s accession, distinct from the following statement of the duration of his reign.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: അഹീയാവിന്റെ മകനായ ബയെശാ
  rationale: The Hebrew patronymic is preserved in idiomatic Malayalam, with the names transliterated from the source.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: With מלך, עַל denotes royal rule over a people. This wording preserves the emphatic scope of כָּל without unnecessarily inserting a separate verb of ruling.
- source_word: בְּתִרְצָה
  choice: തിർസയിൽവെച്ച്
  rationale: The prefixed ב marks the location. ‘യിൽവെച്ച്’ naturally associates Tirzah with the accession/reign statement while retaining the source’s structural ambiguity about its precise attachment.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: ഇരുപത്തിനാലു വർഷം
  rationale: The numeral phrase directly states the duration of Baasha’s reign and is rendered in standard Malayalam form.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. രാജഭരണകാല നിർണ്ണയസൂത്രം വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി ‘ഭരണം’ സന്ദർഭാനുസൃതമായി പൂരിപ്പിച്ചു; മൂലപാഠത്തിലെ വിവരക്രമവും തിർസയുടെ സ്ഥാനബന്ധത്തിലെ സൂക്ഷ്മമായ അവ്യക്തതയും നിലനിർത്തി.
