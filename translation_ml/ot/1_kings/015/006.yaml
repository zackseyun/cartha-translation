id: 1KI.15.6
reference: 1 Kings 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל יְמֵ֥י חַיָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: ml
  text: രഹബെയാമിനും യൊരോബെയാമിനും ഇടയിൽ അവന്റെ ആയുഷ്കാലമൊക്കെയും യുദ്ധം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രഹബെയാമിന്റെ ആയുഷ്കാലമൊക്കെയും.’ ചുറ്റുപാടുള്ള സന്ദർഭവും പാഠസംബന്ധമായ ചർച്ചയും പരിഗണിച്ച് ചിലർ ഈ സർവനാമം അബീയാവിനെ (അബീയാമിനെ) സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: യുദ്ധം
  rationale: מִלְחָמָה എന്നത് ‘യുദ്ധം’ അഥവാ ‘പോരാട്ടം’ എന്നാണ്. ഇവിടെ ഏകവചനമായ ‘യുദ്ധം’ സ്വാഭാവികവും മൂലപദത്തോട് ചേർന്നതുമാണ്; വാക്യബന്ധം മലയാളത്തിലെ ക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ וּ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: הָיְתָה
  choice: ഉണ്ടായിരുന്നു
  rationale: היה എന്ന ക്രിയയുടെ ഈ അസ്തിത്വസൂചക പ്രയോഗത്തിന് ‘ഉണ്ടായിരുന്നു’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്. സന്ദർഭം തുടർന്നുനിന്ന ശത്രുത സൂചിപ്പിച്ചാലും, ക്രിയയിൽ ഇല്ലാത്ത ‘തുടർന്നു’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: בֵין ... וּ/בֵין
  choice: '...നും ...നും ഇടയിൽ'
  rationale: ആവർത്തിച്ചുള്ള ഹീബ്രു പൂർവപ്രത്യയങ്ങൾ സംഘർഷത്തിലെ രണ്ടു കക്ഷികളെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘...നും ...നും ഇടയിൽ’ എന്ന ഘടന അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: רְחַבְעָם
  choice: രഹബെയാം
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: כָּל יְמֵי
  choice: ആയുഷ്കാലമൊക്കെയും
  rationale: അക്ഷരാർഥത്തിൽ ‘എല്ലാ ദിവസങ്ങളും’ എന്ന ഈ ഹീബ്രു പ്രയോഗം ഒരാളുടെ മുഴുവൻ ജീവിതകാലത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആയുഷ്കാലമൊക്കെയും’ അർഥം കൃത്യവും സ്വാഭാവികവുമായാണ് നൽകുന്നത്.
- source_word: חַיָּיו
  choice: അവന്റെ ആയുഷ്കാലം
  rationale: പുരുഷ ഏകവചന സർവനാമപ്രത്യയമുള്ള രൂപത്തിന്റെ അർഥം ‘അവന്റെ ജീവിതം/ആയുഷ്കാലം’ എന്നാണ്. ‘അവന്റെ’ എന്നു നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ അനിശ്ചിത പൂർവപദബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ആയുഷ്കാലം’ എന്നതിലെ സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാന പാഠത്തിൽ പൂർവപദം വ്യക്തമാക്കാതെ ‘അവന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: രഹബെയാമിന്റെ ആയുഷ്കാലം; അല്ലെങ്കിൽ അബീയാവിന്റെ (അബീയാമിന്റെ) ആയുഷ്കാലം
  rationale: ഹീബ്രു രൂപത്തിൽ പുരുഷ ഏകവചനമായ ‘അവന്റെ’ എന്നതു മാത്രമേ ഉള്ളൂ; ഈ ഉപവാക്യം ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല. ചുറ്റുപാടുള്ള സന്ദർഭവും പാഠസാക്ഷ്യങ്ങളിലെ ചർച്ചയും കാരണം രഹബെയാമിനെയോ അബീയാവിനെയോ സൂചിപ്പിക്കുന്നതായി വ്യത്യസ്തമായി മനസ്സിലാക്കപ്പെടുന്നു. അതിനാൽ അനിശ്ചിതത്വം പ്രധാന പാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘യുദ്ധം ഉണ്ടായിരുന്നു’ എന്ന ലളിതമായ പ്രയോഗം മൂലത്തിലെ അസ്തിത്വഘടന നിലനിർത്തുന്നു. സർവനാമത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിച്ചു; [a] എന്ന അടിക്കുറിപ്പുസൂചകം പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തി.
