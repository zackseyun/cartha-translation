reference: 1 Kings 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: ml
  text: കാരണം, ദാവീദ് യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്യുകയും, ഹിത്യനായ ഊരീയാവിന്റെ കാര്യത്തിൽ[a] ഒഴികെ, തന്റെ ജീവിതകാലം മുഴുവൻ യഹോവ ദാവീദിനോടു കല്പിച്ച യാതൊന്നിൽനിന്നും വ്യതിചലിക്കാതിരിക്കുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹിത്യനായ ഊരീയാവിന്റെ വിഷയത്തിൽ.’
    reason: בִּדְבַר എന്ന പ്രയോഗത്തിന്റെ ‘കാര്യം/വിഷയം’ എന്ന വിശാലമായ പദവികല്പം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം ഈ ബന്ധകപദം ഇവിടെ അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം വ്യക്തമാക്കി.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: ശരിയായതു ചെയ്യുക
  rationale: ശരിയോ നീതിയോ ആയതു പ്രവർത്തിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ പേരായിത്തന്നെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְלֹא סָר
  choice: വ്യതിചലിക്കാതിരിക്കുക
  rationale: കല്പിക്കപ്പെട്ട വഴിയിൽനിന്ന് മാറിപ്പോകാതിരിക്കുക എന്ന ആശയം ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: യഹോവ തന്നോടു കല്പിച്ച യാതൊന്നിൽനിന്നും
  rationale: כֹּל സൂചിപ്പിക്കുന്ന സമഗ്രത ‘യാതൊന്നിൽനിന്നും’ എന്ന നിഷേധഘടനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കല്പിക്കുന്നവനും സ്വീകരിക്കുന്നവനും ആരെന്നത് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: തന്റെ ജീവിതകാലം മുഴുവൻ
  rationale: മുഴുവൻ ആയുഷ്കാലത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ സമയപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം.
- source_word: רַק
  choice: ഒഴികെ
  rationale: മുൻപുള്ള സമഗ്രമായ പ്രശംസയ്ക്ക് ഏക അപവാദം അവതരിപ്പിക്കുന്ന പദത്തിന്റെ പ്രവർത്തനം നേരിട്ട് നൽകുന്നു.
- source_word: בִּדְבַר אוּרִיָּה
  choice: ഊരീയാവിന്റെ കാര്യത്തിൽ
  rationale: דָּבָר ഇവിടെ വിഷയം, കാര്യം, സംഭവം എന്നീ അർഥങ്ങളുള്ളതിനാൽ മൂലത്തിലെ വ്യാപ്തി നിലനിർത്തുന്ന ‘കാര്യത്തിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: אוּרִיָּה הַחִתִּי
  choice: ഹിത്യനായ ഊരീയാവ്
  rationale: വ്യക്തിനാമവും ജനവിഭാഗസൂചനയും മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ അറിയപ്പെടുന്ന മറ്റു പാപങ്ങൾക്കിടയിലും അവന്റെ അനുസരണത്തെക്കുറിച്ചുള്ള സമഗ്രമായ വിലയിരുത്തൽ
  choice: വാക്യത്തിലെ വിശാലമായ പ്രശംസയും അതിൽ വ്യക്തമാക്കിയ ഏക അപവാദവും വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ദാവീദ് പൊതുവേ വിശ്വസ്തനായിരുന്നു എന്നോ അവന്റെ മാനസാന്തരത്തെക്കുറിച്ചോ വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർക്കുക.
  rationale: മൂലവാക്യം സൃഷ്ടിക്കുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിവർത്തനം പരിഹരിക്കരുത്; പ്രശംസയും അപവാദവും അതേപടി വായനക്കാരന്റെ മുമ്പിൽ നിൽക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘യഹോവയുടെ ദൃഷ്ടിയിൽ’ എന്ന മൂലരൂപകവും വാക്യത്തിലെ കാരണബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്.
