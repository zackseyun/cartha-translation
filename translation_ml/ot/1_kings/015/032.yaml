translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ ആരംഭത്തിലെ וְ മലയാളത്തിൽ നിർബന്ധമായി ‘അങ്ങനെ/കൂടാതെ’ എന്നു ചേർക്കാതെ, കഥാസന്ദർഭത്തിലെ ബന്ധം സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ നിലനിർത്തി.
