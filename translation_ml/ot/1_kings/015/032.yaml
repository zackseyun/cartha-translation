  yaml_path: translation/ot/1_kings/015/032.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: ml
  text: ആസായും ഇസ്രായേൽ രാജാവായ ബയെശായും തമ്മിൽ അവരുടെ കാലമൊക്കെയും യുദ്ധം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദാനുപദമായി: ‘അവരുടെ ദിവസങ്ങളൊക്കെയും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: യുദ്ധം ഉണ്ടായിരുന്നു
  rationale: മִלְחָמָה എന്നത് ‘യുദ്ധം’ എന്നും היה ഇവിടെ അസ്തിത്വസൂചകമായി ‘ഉണ്ടായിരുന്നു’ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; ക്രിയയിൽ വ്യക്തമല്ലാത്ത തുടർച്ചാഭാവം അധികമായി ചേർക്കുന്നില്ല.
- source_word: בֵּין ... וּ/בֵין
  choice: …യും …യും തമ്മിൽ
  rationale: ആവർത്തിച്ചുള്ള എബ്രായ മുൻനിലപദത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אָסָא
  choice: ആസാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בַּעְשָׁא
  choice: ബയെശ
  rationale: എബ്രായ בַּעְשָׁא എന്ന വ്യക്തിനാമത്തിന്റെ സ്വരഘടനയോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ബയെശയെ തിരിച്ചറിയിക്കുന്ന സംയുക്തപദപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל יְמֵי/הֶם
  choice: അവരുടെ കാലമൊക്കെയും
  rationale: അക്ഷരാർഥത്തിലെ ‘അവരുടെ ദിവസങ്ങളൊക്കെയും’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിശാലമായ കാലപരിധി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആരുടെ ജീവിതകാലമാണ് ഉദ്ദേശ്യമെന്ന സാധ്യതാപരമായ അസ്പഷ്ടത തീർപ്പാക്കുന്നില്ല.
