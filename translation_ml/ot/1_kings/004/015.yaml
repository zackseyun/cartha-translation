  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲחִימַ֖עַץ בְּ/נַפְתָּלִ֑י גַּם ה֗וּא לָקַ֛ח אֶת בָּשְׂמַ֥ת בַּת שְׁלֹמֹ֖ה לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: ml
  text: നഫ്താലിയിൽ[a] അഹീമാസ്; അവനും ശലോമോന്റെ മകളായ ബാസ്മത്തിനെ ഭാര്യയായി സ്വീകരിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഫ്താലിയുടെ മേൽ’ അല്ലെങ്കിൽ ‘നഫ്താലിക്കുവേണ്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ ഭരണാധികാരിപ്പട്ടികയിൽ ഹീബ്രു ഉപസർഗം അഹീമാസിനു ചുമതലപ്പെടുത്തിയ പ്രദേശത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ശലോമോന്റെ മകളായ ബാസ്മത്തിനെ ഭാര്യയായി എടുത്തു’; ഇത് അവളെ വിവാഹം കഴിച്ചു എന്നർഥമുള്ള സ്ഥിരപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: അഹീമാസ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנַפְתָּלִי
  choice: നഫ്താലിയിൽ
  rationale: ഭരണാധികാരികളുടെ ഈ പട്ടികയിൽ בְ എന്ന ഉപസർഗം അഹീമാസിന്റെ ചുമതലയിലുള്ള ഗോത്രപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; വ്യാഖ്യാനം അമിതമായി ഉറപ്പിക്കാതെ സ്ഥലസംബന്ധമായ സ്വാഭാവിക അർഥം നിലനിർത്തുന്നു.
- source_word: גַּם הוּא
  choice: അവനും
  rationale: മുൻപു പറഞ്ഞവരോടൊപ്പം അഹീമാസിനെയും ചേർക്കുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לָקַח ... לְאִשָּׁה
  choice: ഭാര്യയായി സ്വീകരിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഭാര്യയായി എടുത്തു’ എന്നാണെങ്കിലും, ഇത് വിവാഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണ്; ആ അർഥം മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: בָּשְׂמַת
  choice: ബാസ്മത്ത്
  rationale: വ്യക്തിനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּת שְׁלֹמֹה
  choice: ശലോമോന്റെ മകളായ
  rationale: ഹീബ്രു സംയുക്തപദബന്ധത്തിലെ പിതൃപുത്രീബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
