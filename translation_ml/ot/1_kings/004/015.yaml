translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം. പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്താൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു; വിവാഹത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
