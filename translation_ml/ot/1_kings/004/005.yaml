id: 1KI.4.5
reference: 1 Kings 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: ml
  text: നാഥാന്റെ മകൻ അസർയാഹു പ്രവിശ്യാധികാരികളുടെ ചുമതലയുള്ളവനായിരുന്നു. നാഥാന്റെ മകൻ സാബൂദ് പുരോഹിതനും[a] രാജാവിന്റെ സുഹൃത്തുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ രാജസഭാസന്ദർഭത്തിൽ ‘മുഖ്യമന്ത്രി’ എന്നോ ‘രാജോപദേഷ്ടാവ്’ എന്നോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: അസർയാഹു
  rationale: എബ്രായപേരിലെ -യാഹു എന്ന പൂർണരൂപം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶן
  choice: മകൻ
  rationale: വംശപരവും ബന്ധപരവുമായ പട്ടികകളിൽ സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: עַל
  choice: മേൽനോട്ടം വഹിച്ചിരുന്നു
  rationale: ഈ ഭരണസന്ദർഭത്തിൽ അധികാരവും മേൽനോട്ടവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാരൂപത്തിൽ അവതരിപ്പിച്ചു.
- source_word: הַנִּצָּבִים
  choice: പ്രവിശ്യാധികാരികൾ
  rationale: ശലോമോന്റെ ഭരണക്രമത്തിൽ നിയോഗിക്കപ്പെട്ട പ്രദേശിക ഉദ്യോഗസ്ഥരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘പ്രവിശ്യാധികാരികൾ’ അവരുടെ ഭരണപരമായ ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: זָבוּד
  choice: സാബൂദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: כֹּהֵן
  choice: പുരോഹിതൻ
  rationale: പദത്തിന്റെ പ്രാഥമിക അർഥം നിലനിർത്തി; രാജസഭാസന്ദർഭത്തിൽ സാധ്യമായ ‘മുഖ്യമന്ത്രി/രാജോപദേഷ്ടാവ്’ എന്ന അർഥസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: രാജാവിന്റെ സുഹൃത്ത്
  rationale: രാജാവിന്റെ അടുത്ത വിശ്വസ്തനെയോ സഹചാരിയെയോ സൂചിപ്പിക്കുന്ന പദബന്ധത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
theological_decisions:
- issue: രാജസഭാ-ഭരണസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പുരോഹിതൻ’ എന്നു നൽകി, രാജസഭയിലെ ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
  alternative: മുഖ്യമന്ത്രി അല്ലെങ്കിൽ രാജോപദേഷ്ടാവ്
  rationale: എബ്രായപദത്തിന്റെ സാധാരണ അർഥം ‘പുരോഹിതൻ’ എന്നാണ്. എന്നാൽ ഭരണപട്ടികയായ ഈ സന്ദർഭത്തിൽ രാജസഭയിലെ ഉന്നത പദവിയും ഉദ്ദേശിച്ചിരിക്കാം; അതിനാൽ അവ്യക്തത വ്യാഖ്യാനത്തിലൂടെ നീക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഭരണഭാഷ ഉപയോഗിച്ചു. പേരുകൾ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. രണ്ട് ചുമതലകളും സാബൂദിനാണെന്നത് ‘പുരോഹിതനും … സുഹൃത്തുമായിരുന്നു’ എന്ന ഏകോപിത ഘടനയിൽ വ്യക്തമാക്കി.
