source:
  edition: WLC
  text: וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם בֶּן ח֖וּר בְּ/הַ֥ר אֶפְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/008.yaml
  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: ml
  text: 'അവരുടെ പേരുകൾ ഇവയാണ്: എഫ്രയീമിലെ മലനാട്ടിൽ ബെൻ-ഹൂർ[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഇത് വ്യക്തിനാമമായല്ല പിതൃനാമമായി എടുക്കുന്നുവെങ്കിൽ, ‘ഹൂരിന്റെ മകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ സംയോജക-സൂചക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വാക്യാരംഭത്തിലെ וְ ഇവിടെ നിർബന്ധമായി ‘And’ എന്നു വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: שְׁמוֹתָם
  choice: അവരുടെ പേരുകൾ
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിതമായ ‘ഇവ അവരുടെ പേരുകൾ’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവരുടെ പേരുകൾ ഇവയാണ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: בֶּן חוּר
  choice: ബെൻ-ഹൂർ
  rationale: ജില്ലാ ഉദ്യോഗസ്ഥരുടെ പട്ടികയിൽ ഇതിനെ വ്യക്തിനാമമായി വായിക്കാവുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ‘ഹൂരിന്റെ മകൻ’ എന്ന പിതൃനാമസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּהַר אֶפְרָיִם
  choice: എഫ്രയീമിലെ മലനാട്ടിൽ
  rationale: הַר ഇവിടെ ഒറ്റ മലയേക്കാൾ എഫ്രയീമിന്റെ ഉയർന്ന മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഭൂപ്രദേശിക പ്രയോഗമാണ്; ‘മലനാട്’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. വ്യക്തിനാമത്തിന് ‘ബെൻ-ഹൂർ’ എന്നും പ്രദേശത്തിന് സ്വാഭാവികമായ ‘എഫ്രയീമിലെ മലനാട്’ എന്നും ഉപയോഗിച്ചു.
