translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്ഥലനാമങ്ങളിൽ സ്ഥിരതയുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു. മൂലത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, സ്വതന്ത്രമായി വായിക്കുമ്പോൾ അർഥം പൂർത്തിയാകാൻ സന്ദർഭത്തിൽ നിന്നുള്ള ‘അവന്റെ അധികാരപരിധിയിലായിരുന്നു’ എന്ന ക്രിയാഭാഗം ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
