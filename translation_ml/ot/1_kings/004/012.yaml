base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: ml
  text: 'അഹീലൂദിന്റെ മകൻ ബാനാ: താനാക്കും മെഗിദ്ദോയും, യിസ്രെയേലിനു താഴെയുള്ള സാരേഥാനോടു ചേർന്നുള്ള ബേത്ത്-ശെയാൻ പ്രദേശം മുഴുവനും—ബേത്ത്-ശെയാൻ മുതൽ ആബേൽ-മെഹോലാ വരെ, യോക്മെയാമിന് അപ്പുറത്തോളം[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോക്മെയാമിന് അപ്പുറമുള്ള പ്രദേശംവരെ.” ഹീബ്രൂ അതിർത്തിപ്രയോഗം സംക്ഷിപ്തവും അർഥനിർണയം പ്രയാസമുള്ളതുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: അഹീലൂദിന്റെ മകൻ ബാനാ
  rationale: വ്യക്തിനാമങ്ങൾ ഹീബ്രൂ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ബന്ധം സ്വാഭാവിക മലയാള ഷഷ്ഠീവിഭക്തിയിൽ നൽകി.
- source_word: תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ
  choice: താനാക്കും മെഗിദ്ദോയും
  rationale: സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്ത് ഹീബ്രൂ സംയോജകബന്ധം മലയാളത്തിലെ ‘-ഉം’ രൂപത്തിൽ നിലനിർത്തി.
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  choice: ബേത്ത്-ശെയാൻ പ്രദേശം മുഴുവനും
  rationale: כָל എന്നതും സ്ഥലനാമവും ചേർന്ന പ്രയോഗം ഇവിടെ പട്ടണം മാത്രമല്ല, അതിനോടു ബന്ധപ്പെട്ട മുഴുവൻ ഭരണപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രദേശം’ വ്യക്തമാക്കി.
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  choice: സാരെഥാന്റെ സമീപത്തുള്ള
  rationale: אֵצֶל എന്ന സ്ഥലബന്ധപദത്തിന്റെ ‘അരികിൽ/സമീപത്ത്’ എന്ന അർഥം ദൂരം അമിതമായി നിർണയിക്കാതെ നൽകി.
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  choice: യിസ്രെയേലിനു താഴെ
  rationale: ഭൂപ്രകൃതിയിലെ താഴ്ന്ന സ്ഥാനം സൂചിപ്പിക്കുന്ന ഹീബ്രൂ പ്രയോഗം ദിശയായി വ്യാഖ്യാനിക്കാതെ ഔപചാരികമായി സംരക്ഷിച്ചു.
- source_word: מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: ബേത്ത്-ശെയാൻമുതൽ ആബേൽ-മെഹോലാവരെ
  rationale: ഭരണപ്രദേശത്തിന്റെ വ്യാപ്തി അടയാളപ്പെടുത്തുന്ന ‘മുതൽ…വരെ’ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  choice: യോക്മെയാമിന് അപ്പുറംവരെ
  rationale: അതിർത്തിവിവരണം ഹീബ്രുവിൽ സംക്ഷിപ്തവും ദുഷ്കരവുമാണ്; ‘അപ്പുറംവരെ’ എന്നത് മֵעֵבֶר എന്നതിന്റെ സ്ഥലപരമായ അർഥം അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: רשימת המחוז המשתמעת מן הפסוק
  choice: അവന്റെ അധികാരപരിധിയിലായിരുന്നു
  rationale: ഹീബ്രൂ വാക്യം മുൻവാക്യങ്ങളിൽ നിന്നുള്ള ഉദ്യോഗസ്ഥ-ജില്ല പട്ടികയുടെ അപൂർണ്ണ വാക്യഘടന തുടരുന്നു. ഒറ്റവാക്യമായി വായിക്കാവുന്ന മലയാളത്തിനായി സന്ദർഭത്തിൽ വ്യക്തമായ ഭരണബന്ധം പൂരിപ്പിച്ചു.
