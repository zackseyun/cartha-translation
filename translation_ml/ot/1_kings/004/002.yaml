source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הַ/שָּׂרִ֖ים אֲשֶׁר ל֑/וֹ עֲזַרְיָ֥הוּ בֶן צָד֖וֹק הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: ml
  text: 'അവന്റെ ഉന്നത ഉദ്യോഗസ്ഥർ[a] ഇവരായിരുന്നു: സാദോക്കിന്റെ മകൻ അസര്യാവ്, പുരോഹിതൻ[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉന്നത ഉദ്യോഗസ്ഥർ’ എന്നതിനുള്ള എബ്രായപദത്തിന് ‘പ്രഭുക്കന്മാർ,’ ‘മേധാവികൾ,’ ‘അധികാരികൾ’ എന്നീ അർഥങ്ങളും വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: ‘സാദോക്കിന്റെ മകൻ അസര്യാവ്, പുരോഹിതൻ.’ ‘പുരോഹിതൻ’ എന്നത് സാദോക്കിനെ തിരിച്ചറിയിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു; മറ്റുചിലർ അത് അസര്യാവിന്റെ പദവിയായി കാണുന്നു. മൂലപാഠം ‘മഹാപുരോഹിതൻ’ എന്നു വ്യക്തമായി പറയുന്നില്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന സംയോജക-സൂചകപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മുൻവിവരണത്തോടുള്ള ബന്ധം വാക്യസന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: הַשָּׂרִים
  choice: ഉന്നത ഉദ്യോഗസ്ഥർ
  rationale: രാജഭരണത്തിലെ അധികാരമുള്ള ഭരണകർത്താക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘പ്രഭുക്കന്മാർ’ എന്ന പാരമ്പര്യാർഥത്തിലേക്ക് ചുരുക്കാതെ ഭരണപരമായ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: അവന്റെ
  rationale: ഈ ഉദ്യോഗസ്ഥർ രാജാവിന്റെ ഭരണസംവിധാനത്തിൽപ്പെട്ടവരാണെന്ന ബന്ധം ചുരുക്കമായും വ്യാഖ്യാനാതിക്രമമില്ലാതെയും അറിയിക്കുന്നു.
- source_word: עֲזַרְיָהוּ
  choice: അസര്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בֶן צָדוֹק
  choice: സാദോക്കിന്റെ മകൻ
  rationale: പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: എബ്രായപദം നിർദിഷ്ട ഏകവചനത്തിൽ ‘പുരോഹിതൻ’ എന്നാണ്; മൂലത്തിൽ ഇല്ലാത്ത ‘മഹാപുരോഹിതൻ’ എന്ന പദവി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പുരോഹിതൻ’ എന്ന വിശേഷണം അസര്യാവിനെയോ സാദോക്കിനെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: ‘സാദോക്കിന്റെ മകൻ അസര്യാവ്, പുരോഹിതൻ’ എന്നു മൂലത്തിന്റെ പദക്രമത്തോട് അടുത്തുനിന്ന് പരിഭാഷപ്പെടുത്തി, നിർണയം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
  alternative: ‘പുരോഹിതനായ സാദോക്കിന്റെ മകൻ അസര്യാവ്’ അല്ലെങ്കിൽ ‘സാദോക്കിന്റെ മകനും പുരോഹിതനുമായ അസര്യാവ്’
  rationale: എബ്രായവാചകം ‘പുരോഹിതൻ’ ആരെ വിശേഷിപ്പിക്കുന്നു എന്ന് വ്യാകരണപരമായി പൂർണമായി തീർപ്പാക്കുന്നില്ല; കൂടാതെ ‘മഹാപുരോഹിതൻ’ എന്നും വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ പരിഭാഷ ഒരു വായന നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. രാജഭരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘ഉന്നത ഉദ്യോഗസ്ഥർ’ ഉപയോഗിച്ചു; പേരുകളും പുരോഹിതപദവും സഭാവിഭാഗപരമായ വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ നൽകി.
