  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: ml
  text: യെഹോയാദായുടെ മകനായ ബെനായാവു സൈന്യത്തിന്റെ ചുമതല വഹിച്ചു; സാദോക്കും അബ്യാഥാറും പുരോഹിതന്മാരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ രാജസഭാപരമായ സന്ദർഭത്തിൽ כֹּהֲנִים എന്ന പദം വിശാലമായ ഭരണപരമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നെങ്കിൽ, “മുഖ്യ ശുശ്രൂഷകർ” അല്ലെങ്കിൽ “ഉന്നത ഉദ്യോഗസ്ഥർ.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: സൈന്യത്തിന്റെ ചുമതല വഹിച്ചു
  rationale: עַל എന്ന പദം ഇവിടെ ഒരു അധികാരമേഖലയുടെയോ മേൽനോട്ടത്തിന്റെയോ ചുമതലയെ സൂചിപ്പിക്കുന്നു. എബ്രായപാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക സൈനികപദവി ചേർക്കാതെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַצָּבָא
  choice: സൈന്യം
  rationale: ഈ സന്ദർഭത്തിൽ צָבָא സംഘടിതമായ സൈനികശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ തത്തുല്യപദം ഉപയോഗിച്ചു.
- source_word: כֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ഈ പദത്തിന്റെ സാധാരണവും പ്രാഥമികവുമായ അർഥം ‘പുരോഹിതന്മാർ’ എന്നാണ്. സാദോക്കും അബ്യാഥാറും പുരോഹിതരായി അറിയപ്പെടുന്നതിനാൽ ഈ അർഥം നിലനിർത്തി; രാജസഭാ ഉദ്യോഗസ്ഥർ എന്ന വിശാലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: בְנָיָהוּ
  choice: ബെനായാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: יְהוֹיָדָע
  choice: യഹോയാദ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: צָדוֹק
  choice: സാദോക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶבְיָתָר
  choice: അബ്യാഥാർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: രാജഭരണ ഉദ്യോഗസ്ഥരുടെ പട്ടികയായ ഈ സന്ദർഭത്തിൽ כֹּהֲנִים എന്നത് ആരാധനാസംബന്ധമല്ലാത്ത അർഥത്തിൽ വിവർത്തനം ചെയ്യണമോ എന്ന ചോദ്യം.
  choice: പുരോഹിതന്മാർ
  alternative: മുഖ്യ ശുശ്രൂഷകർ / ഉന്നത ഉദ്യോഗസ്ഥർ
  rationale: എബ്രായപദത്തിന്റെ സാധാരണ അർഥവും സാദോക്കിന്റെയും അബ്യാഥാറിന്റെയും അറിയപ്പെടുന്ന പൗരോഹിത്യസ്ഥാനവും ‘പുരോഹിതന്മാർ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ രാജസഭാപരമായ സന്ദർഭത്തിൽ വിശാലമായ ഭരണപര അർഥം നിർദേശിക്കപ്പെട്ടിട്ടുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘സൈന്യത്തിന്റെ ചുമതല വഹിച്ചു’ എന്ന പ്രയോഗം അധികാരവും മേൽനോട്ടവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എബ്രായത്തിൽ ഇല്ലാത്ത ‘സേനാധിപൻ’ എന്ന പ്രത്യേക പദവി ചേർത്തിട്ടില്ല.
