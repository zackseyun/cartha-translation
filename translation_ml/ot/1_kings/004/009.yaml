  yaml_path: translation/ot/1_kings/004/009.yaml
  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: ml
  text: ബെൻ-ദേക്കെർ[a]—മാക്കാസിലും ശാൽബീമിലും ബേത്ത്-ശേമെശിലും ഏലോൻ-ബേത്ത്-ഹാനാനിലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ദേക്കെറിന്റെ മകൻ’; ഇവിടെ എബ്രായ നാമകരണരൂപം ‘ബെൻ-ദേക്കെർ’ എന്ന വ്യക്തിനിർദേശമായി നിലനിർത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: ബെൻ-ദേക്കെർ
  rationale: ഭരണാധികാരികളുടെ ഈ പട്ടികയിൽ בֶּן + വ്യക്തിനാമം ഒരു വിവരണവാക്യത്തേക്കാൾ വ്യക്തിയുടെ പേരോ സ്ഥാനനിർദേശമോ ആയി പ്രവർത്തിക്കുന്നു. അതിനാൽ എബ്രായ നാമരൂപം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּ/מָקַץ
  choice: മാക്കാസിൽ
  rationale: בְ ഈ ഉദ്യോഗസ്ഥനുമായി ബന്ധപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ഭരണപരമായ അർഥം പദത്തിൽ ചേർക്കാതെ നേരിട്ടുള്ള സ്ഥാനസൂചകമായി വിവർത്തനം ചെയ്തു.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: ശാൽബീമിലും
  rationale: സംയോജകവും സ്ഥാനസൂചക ഉപസർഗവും സ്വാഭാവികമായ മലയാളത്തിലെ ‘-ഉം/-ഇലും’ രൂപത്തിൽ നൽകി; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: ബേത്ത്-ശേമെശിലും
  rationale: മുൻപുള്ള സ്ഥാനസൂചകത്തിന്റെ പ്രഭാവം ഈ പട്ടികയിലും തുടരുന്നു. സ്ഥലനാമം അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: ഏലോൻ-ബേത്ത്-ഹാനാനിലും
  rationale: പട്ടികയിലെ ഒരു സംയുക്ത സ്ഥലനാമമായി എടുത്തു; മുൻപുള്ള സ്ഥാനസൂചകബന്ധം മലയാളത്തിൽ ‘-ഇലും’കൊണ്ട് വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഭരണപട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി. എല്ലാ വ്യക്തി-സ്ഥലനാമങ്ങളും അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
