translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭരണപര പദാവലി ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണശൈലിയിൽ നൽകി. രണ്ട് വ്യത്യസ്ത രാജസഭാപദവികൾ തമ്മിലുള്ള വ്യത്യാസം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; പദങ്ങളുടെ പരിധിയും സമാന്തരപാഠത്തിലെ പേരുവ്യത്യാസവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
