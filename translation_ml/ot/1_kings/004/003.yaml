  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: ml
  text: എലീഹോരെഫും അഹീയാവും—ശീശയുടെ പുത്രന്മാർ[a]—രാജകാര്യലേഖകരായിരുന്നു[b]. അഹീലൂദിന്റെ മകനായ യെഹോശാഫാത്ത് രാജസഭയിലെ രേഖാധികാരിയായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “ശീശയുടെ പുത്രന്മാർ.” സമാന്തരഭാഗമായ 2 ശമൂവേൽ 8:17-ൽ ഇതുമായി ബന്ധപ്പെട്ട മറ്റൊരു പേരുരൂപം കാണുന്നു; അത് ചിലപ്പോൾ “ശവ്ശാ” എന്നു ലിപ്യന്തരണം ചെയ്യപ്പെടുന്നു.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “രാജകീയ എഴുത്തുകാർ”; ഹീബ്രുപദം രാജാവിനുവേണ്ടിയുള്ള എഴുത്തും രേഖകളും കൈകാര്യം ചെയ്ത ഉദ്യോഗസ്ഥരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “വൃത്താന്തരേഖാധികാരി” അല്ലെങ്കിൽ “രാജാവിനെ കാര്യങ്ങൾ ഓർമിപ്പിക്കുന്ന ഉദ്യോഗസ്ഥൻ”; രാജകീയ രേഖകൾ സൂക്ഷിക്കുകയും കാര്യങ്ങൾ രാജാവിന്റെ ശ്രദ്ധയിൽപ്പെടുത്തുകയും ചെയ്തിരുന്ന ഒരു രാജസഭാ ഉദ്യോഗസ്ഥനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: എലീഹോരെഫ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַאֲחִיָּה
  choice: അഹീയാവും
  rationale: വ്യക്തിനാമത്തോടൊപ്പം ഹീബ്രുവിലെ സംയോജകവും മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: בְּנֵי שִׁישָׁא
  choice: ശീശയുടെ പുത്രന്മാർ
