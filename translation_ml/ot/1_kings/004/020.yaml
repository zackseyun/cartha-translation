  yaml_path: translation/ot/1_kings/004/020.yaml
  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: ml
  text: യെഹൂദയും ഇസ്രായേലും എണ്ണത്തിൽ കടൽക്കരയിലെ മണൽപോലെ വളരെയേറെയായിരുന്നു[a]; അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും സന്തോഷിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കടലിനരികിലെ മണൽപോലെ.’ അതിവലിയ ജനസംഖ്യയെ സൂചിപ്പിക്കുന്ന ഒരു സാധാരണ എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: യെഹൂദയും ഇസ്രായേലും
  rationale: രണ്ട് ജനവിഭാഗങ്ങളുടെയും പേരുകൾ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ സംയുക്ത കർത്താവായി നൽകി.
- source_word: רַבִּים
  choice: അസംഖ്യരായിരുന്നു
  rationale: ‘അനേകർ/വളരെപ്പേർ’ എന്ന ആശയം തുടർന്നുള്ള മണലുമായുള്ള ഉപമയോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: എണ്ണത്തിൽ കടൽത്തീരത്തെ മണൽപോലെ
  rationale: അപരിമിതമായ ജനസംഖ്യയെ സൂചിപ്പിക്കുന്ന എബ്രായ ഉപമ നിലനിർത്തുകയും לָרֹב സൂചിപ്പിക്കുന്ന എണ്ണത്തിലെ പെരുപ്പം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֹכְלִים וְשֹׁתִים וּשְׂמֵחִים
  choice: ഭക്ഷിക്കുകയും കുടിക്കുകയും ആനന്ദിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: മൂന്നു രൂപങ്ങളുടെയും സമാന്തരതയും തുടരുന്ന, സുഖസമൃദ്ധമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയാഭാവവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ മണൽ-ഉപമയും തുടർച്ചയെ സൂചിപ്പിക്കുന്ന ക്രിയാഭാവവും സംരക്ഷിച്ചു.
