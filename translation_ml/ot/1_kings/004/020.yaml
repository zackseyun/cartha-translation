  to: യെഹൂദയും ഇസ്രായേലും എണ്ണത്തിൽ കടൽക്കരയിലെ മണൽപോലെ വളരെയേറെയായിരുന്നു[a]; അവർ ഭക്ഷിക്കുകയും കുടിക്കുകയും സന്തോഷിക്കുകയും ചെയ്തു.
