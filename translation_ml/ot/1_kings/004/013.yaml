translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണ ശൈലി സ്വീകരിച്ചു. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗങ്ങളോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി. ഭരണപരമായ സന്ദർഭം വ്യക്തമാക്കാൻ לֹו എന്നത് ‘ചുമതലയിലായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയെങ്കിലും മൂലപാഠത്തിലെ ആവർത്തനവും പേരുകളുടെ ഭൂമിശാസ്ത്രബന്ധവും നിലനിർത്തി.
