  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: ml
  text: രാമോത്ത്-ഗിലെയാദിൽ ബെൻ-ഗേബെർ[a]; ഗിലെയാദിലുള്ള മനശ്ശെയുടെ മകനായ യായീരിന്റെ ഗ്രാമങ്ങൾ[b] അയാളുടെ ചുമതലയിലായിരുന്നു; ബാശാനിലുള്ള അർഗോബിന്റെ പ്രദേശവും[c] അയാളുടെ ചുമതലയിലായിരുന്നു—മതിലുകളും വെങ്കല ഓടാമ്പലുകളും ഉള്ള അറുപത് വലിയ പട്ടണങ്ങൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഗേബെറിന്റെ മകൻ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘യായീരിന്റെ കൂടാരവാസകേന്ദ്രങ്ങൾ’; ലിപ്യന്തരണത്തിൽ ‘ഹവ്വോത്ത്-യായീർ’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അർഗോബിന്റെ ജില്ല’ അല്ലെങ്കിൽ ‘അർഗോബിന്റെ ഭൂപ്രദേശം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: ബെൻ-ഗേബെർ
  rationale: ഭരണാധികാരികളുടെ ഈ പട്ടികയിൽ പ്രയോഗം ഒരു പേരുപോലെ പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; ‘ഗേബെറിന്റെ മകൻ’ എന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּרָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗവും സംയുക്ത സ്ഥലനാമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹו
  choice: അയാളുടെ ചുമതലയിലായിരുന്നു
  rationale: ഭരണപരമായ പട്ടികയിൽ ഇത് വ്യക്തിപരമായ ഉടമസ്ഥതയെക്കാൾ ഏൽപ്പിക്കപ്പെട്ട അധികാരപരിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭോചിതമായി പരിഭാഷപ്പെടുത്തി; ആവർത്തനം മൂലപാഠത്തിലെ ഘടനയും ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: חַוֺּת יָאִיר
  choice: യായീരിന്റെ ഗ്രാമങ്ങൾ
  rationale: ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പൊതുപദം ഉപയോഗിച്ചു; ‘കൂടാരവാസകേന്ദ്രങ്ങൾ’ എന്ന കൂടുതൽ വ്യുത്പത്തിപരമായ അർഥവും ‘ഹവ്വോത്ത്-യായീർ’ എന്ന സ്ഥലനാമരൂപവും അടിക്കുറിപ്പിൽ നൽകി.
- source_word: חֶבֶל אַרְגֹּב
  choice: അർഗോബിന്റെ പ്രദേശം
  rationale: חֶבֶל ഇവിടെ അളന്നുനിശ്ചയിച്ച ഭൂപ്രദേശം അഥവാ ജില്ലയെ സൂചിപ്പിക്കുന്നു; ‘പ്രദേശം’ സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: അറുപത് വലിയ പട്ടണങ്ങൾ
  rationale: גְּדֹלוֹת എന്നത് ഇവിടെ നഗരകേന്ദ്രങ്ങളുടെ വലുപ്പമോ പ്രാധാന്യമോ സൂചിപ്പിക്കാം; ‘വലിയ’ ഈ രണ്ടിനെയും അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: חוֹמָה וּבְרִיחַ נְחֹשֶׁת
  choice: മതിലുകളും വെങ്കല ഓടാമ്പലുകളും ഉള്ള
  rationale: בְרִיחַ കവാടമല്ല, കവാടം ഉറപ്പിക്കുന്ന അഴിയോ ഓടാമ്പലോ ആണ്; ‘വെങ്കല ഓടാമ്പലുകൾ’ കോട്ടസംവിധാനത്തിന്റെ മൂർത്തമായ ചിത്രം കൃത്യമായി നൽകുന്നു.
