  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. രാജകീയ ഭരണസന്ദർഭം വ്യക്തമാക്കാൻ ‘നിയുക്ത ഉദ്യോഗസ്ഥർ’ എന്നും, ഭക്ഷണം മാത്രം എന്നു ചുരുക്കാതെ രാജസഭയ്ക്കാവശ്യമായ വിഭവങ്ങളെ ഉൾക്കൊള്ളാൻ ‘വേണ്ട സാധനങ്ങൾ എത്തിച്ചുകൊടുത്തു’ എന്നും ഉപയോഗിച്ചു.
