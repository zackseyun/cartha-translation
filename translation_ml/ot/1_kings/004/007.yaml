  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: ml
  text: ശലോമോന് ഇസ്രായേൽ മുഴുവനും ചുമതലയുള്ള പന്ത്രണ്ട് നിയുക്ത ഉദ്യോഗസ്ഥർ[a] ഉണ്ടായിരുന്നു. അവർ രാജാവിനും അദ്ദേഹത്തിന്റെ ഭവനത്തിനും ആവശ്യമായ സാധനങ്ങൾ എത്തിച്ചുകൊടുത്തു. വർഷത്തിൽ ഒരു മാസം വീതം സാധനങ്ങൾ എത്തിക്കേണ്ട ചുമതല ഓരോരുത്തർക്കുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഉദ്യോഗസ്ഥർ,” “ഭരണാധികാരികൾ,” “മേൽനോട്ടക്കാർ,” അല്ലെങ്കിൽ “പ്രതിനിധികൾ.” എബ്രായപദം ഭരണകാര്യത്തിനായി നിയമിക്കപ്പെട്ട ഉദ്യോഗസ്ഥരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: ശലോമോന് ... ഉണ്ടായിരുന്നു
  rationale: ലാമെദ് ഇവിടെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്നതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വ-ഉടമസ്ഥതാ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: שְׁנֵים עָשָׂר
  choice: പന്ത്രണ്ട്
  rationale: മൂലപാഠത്തിലെ സംഖ്യ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: נִצָּבִים
  choice: നിയുക്ത ഉദ്യോഗസ്ഥർ
  rationale: രാജകീയ ഭരണകാര്യത്തിനായി നിയമിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദമാണിത്; ‘ഭരണാധികാരികൾ’ എന്നതിനെക്കാൾ പദവിയുടെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനിലും
  rationale: ഈ ഉദ്യോഗസ്ഥരുടെ ചുമതല രാജ്യമെങ്ങും വിഭജിച്ചിരുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘മേൽ’ എന്ന അധികാരാർഥവും സാദ്ധ്യമാണെന്നതിനാൽ പദവിവരത്തിലെ പൊതുവായ സ്വഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְכִלְכְּלוּ
  choice: വേണ്ട സാധനങ്ങൾ എത്തിച്ചുകൊടുത്തു
  rationale: כלכל ഇവിടെ രാജാവിനെയും രാജകുടുംബത്തെയും പോറ്റുന്നതിനാവശ്യമായ വിഭവങ്ങൾ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും സാമ്പത്തിക പരിപാലനം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: രാജാവിനും അദ്ദേഹത്തിന്റെ കുടുംബത്തിനും
  rationale: בֵּיתוֹ ഇവിടെ കെട്ടിടമല്ല, രാജാവിന്റെ കുടുംബം അഥവാ ഗൃഹസംഘമാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: חֹדֶשׁ בַּשָּׁנָה יִהְיֶה עַל אֶחָד לְכַלְכֵּל
  choice: വർഷത്തിൽ ഓരോ മാസം വീതം സാധനങ്ങൾ എത്തിക്കേണ്ട ചുമതല ഓരോരുത്തർക്കുമായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘വർഷത്തിൽ ഒരു മാസം ഒരാളുടെമേൽ ആയിരുന്നു’ എന്ന ഘടനയ്ക്ക് പകരം, പന്ത്രണ്ടുപേരുടെ ഊഴമനുസരിച്ചുള്ള പ്രതിമാസ ബാധ്യത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
