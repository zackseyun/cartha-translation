lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം അതിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പദത്തിന് സ്വാഭാവികമായ മലയാള തുല്യപദം.
- source_word: פָּרוּחַ
  choice: പാരൂവഹ്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു; അവസാനത്തെ ח എന്ന വ്യഞ്ജനശബ്ദം ‘ഹ്’ കൊണ്ട് സൂചിപ്പിച്ചു.
- source_word: בְּ/יִשָׂשכָר
  choice: യിസ്സാഖാറിൽ
  rationale: בְ എന്ന ഉപസർഗത്തിന്റെ പ്രാഥമിക സ്ഥലാർഥമായ ‘-ൽ’ നിലനിർത്തുന്നു. ഈ ഭരണാധികാരിപ്പട്ടികയിൽ അത് അദ്ദേഹത്തിന്റെ ചുമതലയിലുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മുഖ്യപാഠത്തിൽ ആ വ്യാഖ്യാനം നിർബന്ധിതമാക്കുന്നില്ല.
