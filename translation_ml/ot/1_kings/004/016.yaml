  yaml_path: translation/ot/1_kings/004/016.yaml
  text: Baana son of Hushai[a], in Asher and Bealoth.
translation:
  language: ml
  text: ഹൂശായിയുടെ മകൻ ബാനാ—ആശേരിലും ബെയാലോത്തിലും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അലോത്തിലും.” അവസാനത്തെ സ്ഥലനാമത്തിന്റെ പാഠരൂപവും ഭൂമിശാസ്ത്രപരമായ തിരിച്ചറിയലും പരിഭാഷാപാരമ്പര്യത്തിൽ അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: ബാനാ
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: חוּשָׁי
  choice: ഹൂശായി
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּ/אָשֵׁר
  choice: ആശേരിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു; ഭരണാധികാരപരമായ ‘ആശേരിന്റെ മേൽ’ എന്ന വ്യാഖ്യാനം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וּ/בְעָלֽוֹת
  choice: ബെയാലോത്തിലും
  rationale: וּ എന്ന സംയോജകവും സ്ഥലങ്ങളുടെ ഏകോപിത പട്ടികാസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. സ്ഥലനാമത്തിന്റെ തിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
