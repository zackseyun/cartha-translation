translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ഭരണപദവികളുടെ സംക്ഷിപ്ത സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, ‘വീട്’ എന്ന പദത്തിന്റെ രാജസഭാസംബന്ധിയായ അർഥവും מַס എന്നതിന്റെ നിർബന്ധിത തൊഴിൽസേവനാർത്ഥവും സ്വാഭാവികമായി വ്യക്തമാക്കി.
