  to: അഹീശാറും രാജഭവനത്തിന്റെ ചുമതലക്കാരനായിരുന്നു[a]; അബ്ദായുടെ മകനായ അദോനീരാമും നിർബന്ധിത തൊഴിലിന്റെ ചുമതലക്കാരനായിരുന്നു[b].
