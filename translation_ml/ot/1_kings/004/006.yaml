  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: ml
  text: അഹീശാറും രാജഭവനത്തിന്റെ ചുമതലക്കാരനായിരുന്നു[a]; അബ്ദായുടെ മകനായ അദോനീരാമും നിർബന്ധിത തൊഴിലിന്റെ ചുമതലക്കാരനായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജകൊട്ടാരത്തിന്റെ ചുമതലക്കാരനായിരുന്നു’ / ‘രാജഗൃഹത്തിന്റെ മേൽവിചാരകനായിരുന്നു.’ എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘വീടിന്റെ മേൽ’ എന്നാണ്; രാജസഭാസന്ദർഭത്തിൽ ഇത് രാജഗൃഹത്തിന്റെയോ കൊട്ടാരഭരണത്തിന്റെയോ മേൽനോട്ടം വഹിച്ചിരുന്ന ഔദ്യോഗിക പദവിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിർബന്ധിത തൊഴിൽസേവനത്തിന്റെ ചുമതലക്കാരനായിരുന്നു.’ എബ്രായപദം ഭരണകൂടം നിർബന്ധമായി ചുമത്തിയ തൊഴിൽസേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: അഹീശാർ
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളലിപിയിൽ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַל הַבָּיִת
  choice: രാജകുടുംബകാര്യങ്ങളുടെ മേൽവിചാരകനായിരുന്നു
  rationale: പദശഃ ‘വീടിന്റെ മേൽ’ എന്നാണെങ്കിലും രാജസഭാ ഉദ്യോഗപ്പട്ടികയിൽ ഇത് രാജഗൃഹത്തിന്റെയോ കൊട്ടാരഭരണത്തിന്റെയോ ചുമതലയുള്ള ഔദ്യോഗിക പദവിയെ സൂചിപ്പിക്കുന്നു. ‘രാജകുടുംബകാര്യങ്ങൾ’ വ്യക്തമായ കെട്ടിടാർത്ഥത്തിൽ ഒതുക്കാതെ ഭരണച്ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: וַאֲדֹנִירָם
  choice: അദോനീരാം
  rationale: വ്യക്തിനാമം മൂലഭാഷയോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן עַבְדָּא
  choice: അബ്ദായുടെ മകനായ
  rationale: ഉദ്യോഗസ്ഥനെ പിതാവിന്റെ പേരിലൂടെ തിരിച്ചറിയിക്കുന്ന സാധാരണ വംശപരാമർശമായി വിവർത്തനം ചെയ്തു.
- source_word: עַל הַמַּס
  choice: നിർബന്ധിതവേലയുടെ മേൽവിചാരകനായിരുന്നു
  rationale: രാജഭരണസന്ദർഭത്തിലെ מַס നികുതി മാത്രമല്ല, ഭരണകൂടം ചുമത്തിയ നിർബന്ധിത തൊഴിൽസേവനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതികമല്ലാത്ത വ്യക്തമായ മലയാളം തെരഞ്ഞെടുത്തു.
