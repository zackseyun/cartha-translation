  terminology: 'Personal and place names should use consistent Hebrew-based Malayalam transliteration: Hesed is better represented as “ഹെസെദ്,” and Hepher as “ഹെഫെർ.” The locative “അരുബ്ബോത്തിൽ” and the territorial sense of “ദേശം” are appropriate.'
