    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: ബെൻ-ഹേസെദ്
  rationale: ഭരണാധികാരികളുടെ ഈ പട്ടികയിൽ പ്രയോഗം വ്യക്തിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; പദശഃ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בָּאֲרֻבּוֹת
  choice: അരുബ്ബോത്തിൽ
  rationale: മുൻപ്രത്യയം בְּ സ്ഥലസൂചകമായ ‘-ത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: לוֹ
  choice: അവന്റെ ചുമതലയിലായിരുന്നു
  rationale: ജില്ലാഭരണപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ പ്രദേശം ഈ ഉദ്യോഗസ്ഥന് ഏല്പിക്കപ്പെട്ടിരുന്നു എന്ന ഭരണപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥാവകാശം അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: שֹׂכֹה
  choice: സോഖോ
  rationale: സ്ഥലനാമമായതിനാൽ ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: ഹേഫെർദേശമൊക്കെയും
  rationale: אֶרֶץ ഇവിടെ ഭൂമി മുഴുവനെയല്ല, പേരുള്ള ഒരു ദേശത്തെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; כָל എന്നതിന്റെ സമഗ്രത ‘ഒക്കെയും’ വഴി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഭരണപരമായ ശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങളും സ്ഥലനാമങ്ങളും മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; മൂലത്തിലെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തി.
