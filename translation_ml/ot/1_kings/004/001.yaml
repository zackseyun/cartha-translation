id: 1KI.4.1
reference: 1 Kings 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/001.yaml
  text: King Solomon was king over all Israel.
translation:
  language: ml
  text: ശലോമോൻ രാജാവ് ഇസ്രായേൽ മുഴുവനുടെയും രാജാവായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: ഇവിടെ היהയുടെ തുടർച്ചാരൂപം പുതിയ വിവരണഘട്ടത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുമ്പോൾ, വാക്യത്തിന്റെ നിലാവസ്ഥാപരമായ മുഖ്യവിധേയത്വം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആയിരുന്നു’ എന്നതിൽ പ്രകടമാകുന്നു; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത്തരം കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: 'നിശ്ചയാർഥക നാമം വ്യക്തിനാമത്തോടു ചേർന്ന സ്ഥാനപ്പേരാണ്: ‘ശലോമോൻ രാജാവ്’.'
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: מֶלֶךְ
  choice: ഭരിക്കുന്ന രാജാവായിരുന്നു
  rationale: രണ്ടാമത്തെ מֶלֶךְ വിധേയനാമമായി ശലോമോന്റെ രാജപദവിയും അധികാരവും പ്രസ്താവിക്കുന്നു. ആദ്യത്തെ ‘രാജാവ്’ എന്ന പദവുമായി മൂലത്തിലെ ആവർത്തനം നിലനിർത്താൻ ‘രാജാവായിരുന്നു’ സൂക്ഷിച്ചു; עַל സൂചിപ്പിക്കുന്ന ഭരണബന്ധം സ്വാഭാവികമാക്കാൻ ‘ഭരിക്കുന്ന’ ചേർത്തു.
- source_word: עַל
  choice: ഭരിക്കുന്ന
  rationale: രാജഭരണസന്ദർഭത്തിൽ ജനത്തിന്മേലുള്ള അധികാരബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വെറും ‘മേൽ’ എന്നതിനെക്കാൾ ‘ഭരിക്കുന്ന’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כָּל
  choice: മുഴുവനും
  rationale: ഇസ്രായേലിന്റെ സമഗ്രതയെ സൂചിപ്പിക്കുന്ന അളവുപദം.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ദേശനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
theological_decisions:
- issue: מֶלֶךְ എന്ന പദത്തിന്റെ ഇരട്ടപ്രയോഗം
  choice: ‘ശലോമോൻ രാജാവ് ... ഭരിക്കുന്ന രാജാവായിരുന്നു’ എന്ന് രണ്ട് പ്രയോഗങ്ങളും നിലനിർത്തി.
  alternative: ‘ശലോമോൻ ഇസ്രായേൽ മുഴുവനും ഭരിച്ചു’
  rationale: ആദ്യപ്രയോഗം സ്ഥാനപ്പേരായും രണ്ടാമത്തേത് വിധേയനാമമായും വരുന്ന എബ്രായ ആവർത്തനം, ഏകീകൃത ഇസ്രായേലിന്മേലുള്ള ശലോമോന്റെ സ്ഥാപിത രാജത്വത്തെ ഊന്നിപ്പറയുന്നു; അതിനെ ക്രിയ മാത്രമാക്കി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായ പദാവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ‘ഇസ്രായേലിന്മേൽ രാജാവായിരുന്നു’ എന്ന കൃത്രിമ ഘടന ഒഴിവാക്കി സ്വാഭാവിക ഭരണപ്രയോഗം സ്വീകരിച്ചു.
