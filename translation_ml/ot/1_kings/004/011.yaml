source:
  edition: WLC
  text: בֶּן אֲבִֽינָדָ֖ב כָּל נָ֣פַת דֹּ֑אר טָפַת֙ בַּת שְׁלֹמֹ֔ה הָ֥יְתָה לּ֖/וֹ לְ/אִשָּֽׁה־־־׃ס
