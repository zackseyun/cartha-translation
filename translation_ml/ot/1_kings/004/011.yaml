  yaml_path: translation/ot/1_kings/004/011.yaml
  text: Ben-abinadab, over all the height of Dor; Taphath the daughter of Solomon was his wife.
translation:
  language: ml
  text: ബെൻ-അബീനാദാബ് ദോർ പ്രദേശം മുഴുവനും മേൽവിചാരകനായിരുന്നു; ശലോമോന്റെ മകൾ താഫത്ത് അവന്റെ ഭാര്യയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: അബീനാദാബിന്റെ മകൻ
  rationale: ഇത് വ്യക്തിനാമമായ ‘ബെൻ-അബീനാദാബ്’ എന്നും ‘അബീനാദാബിന്റെ മകൻ’ എന്നും മനസ്സിലാക്കാം. പേരില്ലാതെ പിതാവിന്റെ പേരിലൂടെ ഉദ്യോഗസ്ഥനെ തിരിച്ചറിയിക്കുന്ന പട്ടികാശൈലിയോട് സ്വാഭാവികമായി ചേരുന്നതിനാൽ ബന്ധവാചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: כָּל נָפַת דֹּאר
  choice: ദോരിന്റെ മുഴുവൻ കുന്നിൻപ്രദേശം
  rationale: נָפָה എന്ന പദത്തിന് ജില്ല/പ്രദേശം എന്ന അർഥവും ഉയർന്നതോ കുന്നുകളുള്ളതോ ആയ പ്രദേശം എന്ന പ്രത്യേക സൂചനയും ഉണ്ടായേക്കാം. സ്ഥലനാമത്തോടു ചേർന്ന ഈ പ്രയോഗത്തിൽ ആ ഭൂപ്രകൃതിസൂചന നിലനിർത്തുന്ന ‘കുന്നിൻപ്രദേശം’ സ്വീകരിച്ചു.
- source_word: טָפַת
  choice: താഫത്ത്
  rationale: ശലോമോന്റെ മകളുടെ ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ ഉച്ചാരണസമീപമായി ലിപ്യന്തരിച്ചു.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: അവന്റെ ഭാര്യയായിരുന്നു
  rationale: ഹീബ്രു ഉടമസ്ഥതാ-ബന്ധപ്രയോഗത്തെ സ്വാഭാവികവും കൃത്യവുമായ മലയാള ദാമ്പത്യപ്രയോഗമായി നൽകി.
theological_decisions: []
translation_notes:
  register: രാജഭരണ ഉദ്യോഗസ്ഥരുടെ പട്ടികയ്ക്ക് ചേരുന്ന സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. ഹീബ്രുവിൽ ക്രിയ വ്യക്തമല്ലാത്ത ആദ്യ ഉപവാക്യത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘മേൽവിചാരകനായിരുന്നു’ ചേർത്തു; ദോരിലെ നിയുക്ത ഉദ്യോഗസ്ഥനാണെന്ന മുൻവാക്യങ്ങളുടെ ഘടന ഇതിന് ആധാരമാണ്.
