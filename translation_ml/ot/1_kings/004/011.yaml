    rationale: In this list it is the official’s established personal designation/name, not merely an unidentified son of Abinadab. Transliteration preserves the source’s identification and the list’s naming style.
  - severity: medium
    issue: נָפַת דֹּאר is rendered “ദോരിന്റെ മുഴുവൻ കുന്നിൻപ്രദേശം.”
    rationale: The expression denotes the Dor territorial district/region (and may reflect a conventional geographical designation). “കുന്നിൻപ്രദേശം” unnecessarily fixes a disputed or secondary topographical nuance; a neutral regional rendering is safer.
