source:
  edition: WLC
  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: ml
  text: ഊരിയുടെ മകനായ ഗേബെർ ഗിലെയാദ് ദേശത്ത്—അമോര്യരുടെ രാജാവായ സീഹോന്റെയും ബാശാനിലെ രാജാവായ ഓഗിന്റെയും ദേശത്ത്—ഉണ്ടായിരുന്ന[a] ഏക ഭരണാധികാരിയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ ദേശത്തിന്മേൽ അധികാരമുണ്ടായിരുന്ന.” ഹീബ്രായ പദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം “ആ ദേശത്തുണ്ടായിരുന്ന” എന്നാണ്; എന്നാൽ ചിലർ ഇതിനെ ഭരണപരമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: ഗേബെർ
  rationale: വ്യക്തിനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരണം ചെയ്തു.
- source_word: בֶּן אֻרִי
  choice: ഊരിയുടെ മകനായ
  rationale: ഹീബ്രായ പിതൃനാമഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: ഗിലെയാദ് ദേശത്ത്
  rationale: אֶרֶץ എന്ന ‘ദേശം’ എന്ന നാമം നിലനിർത്തുന്നു; തുടർന്നുള്ള സമാനാധികരണ വിശദീകരണവുമായി ഇതു യോജിക്കുന്നു.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: അമോര്യരുടെ രാജാവായ സീഹോന്റെയും ബാശാൻ രാജാവായ ഓഗിന്റെയും ദേശത്ത്
  rationale: ഗിലെയാദിനെ ഈ മുൻരാജാക്കന്മാരുടെ ഭൂപ്രദേശമായി കൂടുതൽ വ്യക്തമാക്കുന്ന ഹീബ്രായ സമാനാധികരണ ഘടന വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: נְצִיב
  choice: ഭരണാധികാരി
  rationale: 1 രാജാക്കന്മാർ 4-ലെ ഭരണസംവിധാനത്തിന്റെ പശ്ചാത്തലത്തിൽ നിയമിതനായ പ്രാദേശിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: אֶחָד
  choice: ഏക
  rationale: ഈ പ്രദേശത്ത് ഒരേയൊരു ഭരണാധികാരിയായിരുന്നു എന്ന സംഖ്യാത്മക ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: ആ ദേശത്തുണ്ടായിരുന്ന
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ പ്രാഥമികമായ ‘ൽ/ഇൽ’ അർഥം പിന്തുടരുന്നു; ഭരണപരമായ ‘ദേശത്തിന്മേൽ അധികാരമുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
