translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന ‘ദേശം’ എന്ന പദവും സ്ഥലവിവരണത്തിന്റെ സമാനാധികരണ സ്വഭാവവും നിലനിർത്താൻ ദീർഘരേഖകൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചർച്ച ചെയ്യുന്ന വാക്യഭാഗത്തുതന്നെ [a] അടയാളം ചേർത്തു.
