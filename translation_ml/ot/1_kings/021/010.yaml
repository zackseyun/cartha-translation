source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: ml
  text: നീചന്മാരായ രണ്ടു പുരുഷന്മാരെ അവന്റെ എതിർവശത്ത് ഇരുത്തണം. അവർ അവനെതിരെ സാക്ഷ്യം പറഞ്ഞ്, ‘നീ ദൈവത്തെയും രാജാവിനെയും ശപിച്ചു[a]’ എന്നു പറയട്ടെ. പിന്നെ അവനെ പുറത്തുകൊണ്ടുപോയി കല്ലെറിഞ്ഞു കൊല്ലണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർത്ഥം: “നീ ദൈവത്തെയും രാജാവിനെയും അനുഗ്രഹിച്ചു.” ഇവിടെ “അനുഗ്രഹിച്ചു” എന്നത് “ശപിച്ചു” എന്നു പറയാനുള്ള ആദരസൂചക പരോക്ഷപ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: ഇരുത്തണം
  rationale: ישׁב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: നീചന്മാരായ രണ്ടു പുരുഷന്മാർ
  rationale: രണ്ട് പുരുഷസാക്ഷികളെക്കുറിച്ചുള്ള നിയമപരമായ സൂചന നിലനിർത്തുകയും, בְּנֵי בְלִיַּעַל എന്ന പ്രയോഗത്തിന്റെ ധാർമിക അധമത്വം വ്യക്തിനാമമെന്ന തെറ്റിദ്ധാരണയില്ലാതെ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: נֶגְדּוֹ
  choice: അവന്റെ എതിർവശത്ത്
  rationale: ഔപചാരികമായ വിചാരണാസാഹചര്യത്തിൽ അവനെ അഭിമുഖീകരിക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: וִיעִדֻהוּ
  choice: അവനെതിരെ സാക്ഷ്യം പറയട്ടെ
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിലുള്ള ഹിഫീൽ ക്രിയയുടെ സാക്ഷ്യം നൽകുക എന്ന അർത്ഥം സംരക്ഷിക്കുന്നു.
- source_word: בֵּרַכְתָּ
  choice: നീ ... ശപിച്ചു
  rationale: പദത്തിന്റെ സാധാരണ അർത്ഥം ‘അനുഗ്രഹിച്ചു’ എന്നാണെങ്കിലും ഇവിടെ ദൈവനാമത്തോടുള്ള ആദരസൂചക പരോക്ഷപ്രയോഗമായി ‘ശപിച്ചു’ എന്നാണ് സന്ദർഭാർത്ഥം; അക്ഷരാർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: ദൈവത്തെയും രാജാവിനെയും
  rationale: വ്യാജാരോപണത്തിൽ ദൈവത്തിനെതിരായ കുറ്റവും രാജാധികാരത്തിനെതിരായ കുറ്റവും ഒരുമിച്ചു വരുന്നതു വ്യക്തമാക്കുന്നു.
- source_word: וְהוֹצִיאֻהוּ
  choice: അവനെ പുറത്തുകൊണ്ടുപോയി
  rationale: വധശിക്ഷ നടപ്പാക്കാനായി പുറത്തേക്കു കൊണ്ടുപോകുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וְסִקְלֻהוּ וְיָמֹת
  choice: കല്ലെറിഞ്ഞു കൊല്ലണം
  rationale: കല്ലെറിയലിന്റെ ഉദ്ദേശിച്ച ഫലമായ മരണം മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവം കർമമായി വരുന്ന בֵּרַךְ എന്ന ക്രിയയുടെ ആദരസൂചക പരോക്ഷപ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘ശപിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘അനുഗ്രഹിച്ചു’ എന്നു അക്ഷരാർത്ഥത്തിൽ നൽകി വിശദീകരിക്കുക
  rationale: കഥാസന്ദർഭം ദൈവത്തെയും രാജാവിനെയും ശപിച്ചെന്ന വ്യാജമായ വധശിക്ഷാർഹ ആരോപണമാണ് സൂചിപ്പിക്കുന്നത്. ‘അനുഗ്രഹിച്ചു’ എന്ന മുഖ്യപാഠം മലയാളവായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കും; എങ്കിലും എബ്രായരൂപം അടിക്കുറിപ്പിൽ സുതാര്യമാക്കുന്നു.
- issue: בְּנֵי בְלִיַּעַל എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ‘നീചന്മാർ’ എന്ന നൈതിക വിശേഷണമായി നൽകുക
  alternative: ‘ബെലിയാലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർത്ഥമോ ‘കൊള്ളരുതാത്തവർ’ എന്ന മറ്റൊരു പ്രയോഗമോ
  rationale: ഇവിടെ ഇത് ദുഷ്ടരും അധാർമികരുമായ ആളുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്; പിൽക്കാലത്തെ ഒരു വ്യക്തിനാമമോ ഭൂതശാസ്ത്രപരമായ ആശയമോ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമവിവരണശൈലി. രണ്ട് പുരുഷസാക്ഷികൾ, വ്യാജസാക്ഷ്യം, കല്ലെറിഞ്ഞുള്ള വധം എന്നീ ഘടകങ്ങൾ വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ഉദ്ധരണിക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
