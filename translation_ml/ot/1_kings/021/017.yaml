id: 1KI.21.17
reference: 1 Kings 21:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവയുടെ അരുളപ്പാട് തിശ്ബ്യനായ ഏലിയാവിന് ഉണ്ടായി:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ ... ഉണ്ടായി
  rationale: വാവ്-ക്രമരൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. ‘അപ്പോൾ’ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഉണ്ടായി’ എന്നത് പ്രവാചകസൂത്രത്തിന്റെ ഘടന നിലനിർത്തുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: ഇത് ദൈവിക വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പ്രവാചകപ്രയോഗമാണ്. മലയാളത്തിൽ ‘അരുളപ്പാട്’ സാധാരണ ‘വാക്ക്’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; അതേസമയം വെറും ‘സന്ദേശം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: ഏലിയാവിന്
  rationale: വെളിപ്പാട് ഒരാളിലേക്കു വരുന്നതിനെ മലയാളത്തിൽ ദത്തിവിഭക്തിയോടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ നിലവിലുള്ള പരമ്പരാഗത രൂപം ഉപയോഗിച്ചു.
- source_word: הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രു വിശേഷണം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘തിശ്ബേയിൽനിന്നുള്ളവൻ’ എന്ന വിപുലീകരണം മൂലത്തിൽ വ്യക്തമാക്കിയതിലധികം നിർണ്ണയിക്കാം.
- source_word: לֵאמֹר
  choice: ':'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള അരുളപ്പാടിനെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു infinitive-ന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: דְּבַר എന്നതിന്റെ പ്രവാചകസന്ദർഭത്തിലുള്ള അർഥം
  choice: അരുളപ്പാട്
  alternative: വചനം / സന്ദേശം
  rationale: ‘അരുളപ്പാട്’ ദൈവത്തിൽനിന്നുള്ള സംസാരവെളിപ്പാടെന്ന ആശയം നിലനിർത്തുന്നു. ‘സന്ദേശം’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്; ‘വചനം’ സാധ്യമെങ്കിലും ഈ സൂത്രവാക്യത്തിൽ മലയാളത്തിൽ കുറച്ച് അസ്വാഭാവികമാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. പ്രവാചക ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തതയും ദൈവനാമവും നിലനിർത്തി. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കുള്ള ലֵאמֹר എന്ന അവതാരകത്തെ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമാക്കി.
