id: 1KI.21.5
reference: 1 Kings 21:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תָּבֹ֥א אֵלָ֖י/ו אִיזֶ֣בֶל אִשְׁתּ֑/וֹ וַ/תְּדַבֵּ֣ר אֵלָ֗י/ו מַה זֶּה֙ רוּחֲ/ךָ֣ סָרָ֔ה וְ/אֵינְ/ךָ֖ אֹכֵ֥ל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ഭാര്യ ഈസേബെൽ അവന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു[a]: “നിന്റെ മനസ്സ് ഇത്ര വിഷണ്ണമായിരിക്കുന്നതും നീ ആഹാരം കഴിക്കാതിരിക്കുന്നതും എന്ത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “ഇതെന്ത്? നിന്റെ മനസ്സ് വിഷണ്ണമായിരിക്കുന്നു; നീ ആഹാരം കഴിക്കുന്നുമില്ല.”'
    reason: മൂലഭാഷയിലെ ‘ഇതെന്ത്?’ എന്ന ചോദ്യാരംഭവും, അതിനെത്തുടരുന്ന രണ്ടു സമാന്തര പ്രസ്താവനകളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: അപ്പോൾ ... വന്ന്
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: אִיזֶבֶל
  choice: ഈസബെൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയായ
  rationale: ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും മലയാള വാക്യത്തിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: അവനോട് ചോദിച്ചു
  rationale: തുടരുന്ന നേരിട്ടുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ, മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമായ സംഭാഷണാവതരണമാണ്.
- source_word: מַה זֶּה
  choice: എന്തുകൊണ്ട്
  rationale: അക്ഷരാർഥം ‘ഇത് എന്ത്?’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ അവന്റെ അവസ്ഥയുടെ കാരണം അന്വേഷിക്കുന്ന പ്രയോഗമാണ്.
- source_word: רוּחֲךָ
  choice: നിന്റെ മനസ്സ്
  rationale: רוּחַ ഇവിടെ ആന്തരിക മനോഭാവത്തെയോ മാനസികാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; ‘മനസ്സ്’ സാധാരണ മലയാളത്തിൽ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: סָרָה
  choice: ഇങ്ങനെ മ്ലാനമായിരിക്കുന്നത്
  rationale: തിരിഞ്ഞുനിൽക്കുന്ന, വിഷാദഭരിതമായ, മുറുകിയ മനോഭാവം സന്ദർഭാനുസൃതമായി നൽകുന്നു; ‘ഇങ്ങനെ’ ചോദ്യത്തിലെ ഊന്നൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: നീ ആഹാരം കഴിക്കാതിരിക്കത്തക്കവിധം
  rationale: ‘അപ്പം തിന്നുക’ എന്ന എബ്രായ പ്രയോഗം പൊതുവായി ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആഹാരം കഴിക്കുക’ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഈ രൂപം രണ്ടാമത്തെ സ്വതന്ത്ര ‘എന്തുകൊണ്ട്’ ചേർക്കാതെ വാക്യബന്ധം നിലനിർത്തുന്നു.
theological_decisions: []
