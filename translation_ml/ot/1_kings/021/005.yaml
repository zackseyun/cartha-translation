  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ചോദ്യം സ്വാഭാവിക മലയാളത്തിലാക്കി; അക്ഷരാർഥ ഘടന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
