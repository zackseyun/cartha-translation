source:
  edition: WLC
  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: ml
  text: അവൻ വിഗ്രഹങ്ങളുടെ[a] പിന്നാലെ പോയി, യാഹ്‌വെ ഇസ്രായേൽമക്കളുടെ[b] മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ അമോര്യർ ചെയ്ത സകലത്തെയുംപോലെ, അത്യന്തം അറപ്പുളവാക്കുന്നവിധം പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഗ്രഹങ്ങൾ” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ശക്തമായ നിന്ദ ഉൾക്കൊള്ളുന്നതാണ്; “അറപ്പുളവാക്കുന്ന വിഗ്രഹങ്ങൾ” എന്നും, കൂടുതൽ അക്ഷരാർഥത്തിൽ “ചാണകവിഗ്രഹങ്ങൾ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേല്യരുടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: അത്യന്തം അറപ്പുളവാക്കുംവിധം പ്രവർത്തിച്ചു
  rationale: ഹിത്പയേൽ ക്രിയയുടെ പ്രവർത്തനാത്മകതയും ശക്തമായ ധാർമ്മിക വിലയിരുത്തലും നിലനിർത്തുന്നു; വെറും ‘അറപ്പുളവാക്കുന്നവനായിത്തീർന്നു’ എന്ന നിലാവസ്ഥാ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: പിന്നാലെ ചെന്ന്
  rationale: മറ്റൊരാളോടോ മറ്റൊന്നിനോടോ ചേർന്ന് അതിനെ അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַגִּלֻּלִים
  choice: വിഗ്രഹങ്ങൾ
  rationale: പ്രധാനവാചകത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ പദം ഉപയോഗിക്കുന്നു; മൂലപദത്തിന്റെ ശക്തമായ നിന്ദാസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: ചെയ്ത സകലത്തിനും ഒത്തവണ്ണം
  rationale: ആഹാബിന്റെ പെരുമാറ്റത്തെ അമോര്യരുടെ പ്രവൃത്തികളുമായി താരതമ്യം ചെയ്യുന്ന മൂലവാക്യഘടന അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ഇവിടെ ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: הוֹרִישׁ
  choice: നീക്കിക്കളഞ്ഞ
  rationale: ദേശത്തിന്റെ മുൻനിവാസികളെ അവരുടെ കൈവശത്തിൽനിന്ന് പുറത്താക്കിയെന്ന ഹിഫീൽ അർത്ഥം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽനിന്ന്
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ‘മുമ്പിൽനിന്ന്’ എന്ന സ്ഥാനബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ശബ്ദാന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ ശബ്ദാന്തരം ഉപയോഗിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക കൂട്ടപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധരൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പാരമ്പര്യവും സ്വാഭാവികതയും ഉള്ള രൂപം തെരഞ്ഞെടുത്തു; ഇത് ഉടമ്പടിജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ ശക്തമായ ധാർമ്മിക വിലയിരുത്തൽ ‘അത്യന്തം അറപ്പുളവാക്കുംവിധം’ എന്ന രൂപത്തിൽ നിലനിർത്തി; അപരിചിതമായ നിന്ദാപദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിലാക്കി.
