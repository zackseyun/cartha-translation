- from: 'അവൾ കത്തുകളിൽ ഇങ്ങനെ എഴുതി: “ഒരു ഉപവാസം പ്രഖ്യാപിച്ച് നാബോത്തിനെ ജനത്തിന്റെ തലസ്ഥാനത്ത്[a] ഇരുത്തുക.”'
  to: 'അവൾ കത്തുകളിൽ ഇങ്ങനെ എഴുതി: “ഒരു ഉപവാസം പ്രഖ്യാപിക്കുവിൻ; നാബോത്തിനെ ജനത്തിന്റെ മുൻനിരയിൽ ഇരുത്തുവിൻ.”'
  rationale: The main text replaces the Malayalam word for “capital” with “ജനത്തിന്റെ മുൻനിരയിൽ,” which faithfully conveys the Hebrew image of placement at the head/front of the people while retaining its contextual ambiguity. The footnote is revised accordingly and uses “സമ്മേളനം” rather than “സഭ” to avoid an unintended specifically ecclesiastical sense.
