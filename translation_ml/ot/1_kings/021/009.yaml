  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּכְתֹּ֥ב בַּ/סְּפָרִ֖ים לֵ/אמֹ֑ר קִֽרְאוּ צ֔וֹם וְ/הוֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: ml
  text: 'അവൾ കത്തുകളിൽ ഇങ്ങനെ എഴുതി: “ഒരു ഉപവാസം പ്രഖ്യാപിക്കുവിൻ; നാബോത്തിനെ ജനത്തിന്റെ മുൻനിരയിൽ ഇരുത്തുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: അവൾ എഴുതി
  rationale: כתב എന്ന ക്രിയയുടെ wayyiqtol മൂന്നാം പുരുഷ ഏകവചന സ്ത്രീലിംഗരൂപം അടുത്ത പ്രവൃത്തി വിവരിക്കുന്നു; സന്ദർഭത്തിൽ കർത്താവ് ഈസബേലാണ്.
- source_word: בַּסְּפָרִים
  choice: കത്തുകളിൽ
  rationale: ഇവിടെ ספרים ആധുനിക അർഥത്തിലുള്ള പുസ്തകങ്ങളല്ല, നഗരത്തിലെ പ്രമാണികൾക്ക് അയച്ച കത്തുകളാണ്; ב എന്ന ഉപസർഗം ‘കത്തുകളിൽ എഴുതി’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ ഉൾപ്പെടുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: ഉദ്ധരണിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പതിവ് എബ്രായപ്രയോഗം; മലയാളത്തിൽ ‘ഇങ്ങനെ എഴുതി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: קִרְאוּ צוֹם
  choice: ഒരു ഉപവാസം പ്രഖ്യാപിച്ച്
  rationale: പൊതുവായ ഒരു സമൂഹാചരണത്തിന് ഔദ്യോഗിക ആഹ്വാനം നൽകുന്നതാണ് അർഥം; തുടർന്നുള്ള സമനിലയിലുള്ള ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ വിനയെച്ചരൂപം ഉപയോഗിച്ചു.
- source_word: וְהוֹשִׁיבוּ
  choice: ഇരുത്തുക
  rationale: ישב എന്ന ധാതുവിന്റെ ഹിഫീൽ ബഹുവചന ആജ്ഞാരൂപം ‘ഇരിക്കാൻ ഇടയാക്കുക’ എന്ന കാരകഭാവം സൂക്ഷിക്കുന്നു.
- source_word: אֶת נָבוֹת
  choice: നാബോത്തിനെ
  rationale: നേരിട്ടുള്ള കർമസൂചകത്തോടുകൂടിയ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּרֹאשׁ הָעָם
  choice: ജനത്തിന്റെ തലസ്ഥാനത്ത്
  rationale: അക്ഷരാർഥം ‘ജനത്തിന്റെ തലയിൽ/മുൻനിരയിൽ’; സഭയിലെ പ്രമുഖമോ എല്ലാവർക്കും ദൃശ്യമോ ആയ സ്ഥാനം എന്ന സാധ്യത തുറന്നുവെക്കാൻ രൂപകം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. എബ്രായത്തിലെ ക്രമാനുസൃത വിവരണവും ആജ്ഞകളുടെ ഔദ്യോഗിക ഭാവവും സൂക്ഷിച്ചു; בְּרֹאשׁ הָעָם എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
