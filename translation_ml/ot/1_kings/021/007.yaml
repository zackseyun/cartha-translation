  to: 'അപ്പോൾ അവന്റെ ഭാര്യയായ ഈസേബെൽ അവനോടു പറഞ്ഞു: “ഇപ്പോൾ ഇസ്രായേലിനെ രാജാവായി ഭരിക്കുന്നത് നീയല്ലേ?[a] എഴുന്നേറ്റ് അപ്പം കഴിക്കൂ[b]; നിന്റെ ഹൃദയം സന്തോഷമായിരിക്കട്ടെ. യിസ്രെയേല്യനായ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടം ഞാൻ നിനക്കു തരാം.”'
