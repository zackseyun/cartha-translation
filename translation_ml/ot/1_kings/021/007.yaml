source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ ഭാര്യയായ ഈസേബെൽ അവനോടു പറഞ്ഞു: “ഇപ്പോൾ ഇസ്രായേലിനെ രാജാവായി ഭരിക്കുന്നത് നീയല്ലേ?[a] എഴുന്നേറ്റ് അപ്പം കഴിക്കൂ[b]; നിന്റെ ഹൃദയം സന്തോഷമായിരിക്കട്ടെ. യിസ്രെയേല്യനായ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടം ഞാൻ നിനക്കു തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്പോൾ ഇസ്രായേലിനെ രാജാവായി ഭരിക്കുന്നത് നീയാണ്.” എബ്രായവാക്യം ചോദ്യമായോ പരിഹാസം കലർന്ന പ്രസ്താവനയായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അപ്പം കഴിക്കുക” എന്നത് ഭക്ഷണം കഴിക്കുക എന്നർഥമുള്ള ഒരു എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: അപ്പോൾ ... അവനോടു പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത സംഭവത്തിലേക്കു നീങ്ങുന്നു; ആ ക്രമം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയായ ഈസേബെൽ
  rationale: സംസാരിക്കുന്നയാളുടെ പേരും ആഹാബുമായുള്ള ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളഘടന.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: ഇപ്പോൾ ഇസ്രായേലിന്മേൽ രാജാധികാരം നടത്തുന്നത് നീയല്ലേ?
  rationale: ‘രാജത്വം ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തെ രാജകീയ അധികാരം പ്രയോഗിക്കുക എന്ന അർഥത്തിൽ നൽകുന്നു. സന്ദർഭത്തിലെ പരിഹാസാത്മകമായ ആലങ്കാരിക ചോദ്യം ‘നീയല്ലേ?’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പ്രസ്താവനയായി വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: קוּם
  choice: എഴുന്നേറ്റ്
  rationale: കല്പനാരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: אֱכָל לֶחֶם
  choice: അപ്പം കഴിക്കൂ
  rationale: മൂലത്തിലെ ‘അപ്പം കഴിക്കുക’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു; അത് ഭക്ഷണം കഴിക്കുക എന്ന വിശാല അർഥമുള്ള എബ്രായ പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וְיִטַב לִבֶּךָ
  choice: നിന്റെ ഹൃദയം സന്തോഷമായിരിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നിന്റെ ഹൃദയം നന്നായിരിക്കട്ടെ’ എന്ന ആശയം മാനസികാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോഴും ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: ഞാൻ നിനക്കു തരാം
  rationale: വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമവും ഭാവിവാഗ്ദാനവും നിലനിർത്തുന്നു; മലയാളത്തിലെ വാക്യക്രമം ‘ഞാൻ’ എന്നതിനുള്ള സന്ദർഭോചിത ഊന്നൽ നൽകുന്നു.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടം
  rationale: എബ്രായ സമാസബന്ധം സ്വാഭാവിക മലയാള ഉടമസ്ഥഘടനയിൽ നൽകി, നാബോത്തിന്റെ ദേശനാമവിശേഷണവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈസേബെലിന്റെ ആരംഭവാക്യത്തിന്റെ ഭാവം
  choice: 'ആലങ്കാരിക ചോദ്യമായി: ‘ഇപ്പോൾ ഇസ്രായേലിന്മേൽ രാജാധികാരം നടത്തുന്നത് നീയല്ലേ?’'
  alternative: 'പ്രസ്താവനയോ പരിഹാസവാക്യമോ ആയി: ‘ഇപ്പോൾ ഇസ്രായേലിന്മേൽ രാജാധികാരം നടത്തുന്നത് നീയാണ്.’'
  rationale: എബ്രായത്തിൽ വ്യക്തമായ ചോദ്യചിഹ്നസൂചകപദമില്ല. എന്നാൽ ആഹാബിന്റെ നിഷ്ക്രിയതയെ കുറ്റപ്പെടുത്തി രാജാവിനെപ്പോലെ പ്രവർത്തിക്കാൻ പ്രേരിപ്പിക്കുന്ന സന്ദർഭം ആലങ്കാരിക ചോദ്യത്തെ പിന്തുണയ്ക്കുന്നു. വ്യാകരണപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. രാജാധികാരവുമായി ബന്ധപ്പെട്ട പ്രയോഗത്തിന്റെ ഗൗരവവും ഈസേബെലിന്റെ പരിഹാസഭാവവും നിലനിർത്തി; അപൂർവമായ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
