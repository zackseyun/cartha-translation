    issue: രാജാധികാരം നടത്തുന്നത് is an awkward collocation in this context.
    rationale: Although intelligible, modern standard Malayalam more naturally says that one ‘rules/governs as king.’ This better communicates the rhetorical rebuke inherent in the Hebrew expression תעשה מלוכה.
