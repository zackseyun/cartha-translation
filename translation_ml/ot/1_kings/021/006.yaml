id: 1KI.21.6
reference: 1 Kings 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֵלֶ֗י/הָ כִּֽי אֲ֠דַבֵּר אֶל נָב֨וֹת הַ/יִּזְרְעֵאלִ֜י וָ/אֹ֣מַר ל֗/וֹ תְּנָ/ה לִּ֤/י אֶֽת כַּרְמְ/ךָ֙ בְּ/כֶ֔סֶף א֚וֹ אִם חָפֵ֣ץ אַתָּ֔ה אֶתְּנָה לְ/ךָ֥ כֶ֖רֶם תַּחְתָּ֑י/ו וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת כַּרְמִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: ml
  text: 'അവൻ അവളോടു പറഞ്ഞു: “ഞാൻ യിസ്രെയേല്യനായ നാബോത്തിനോടു സംസാരിച്ചു. ‘നിന്റെ മുന്തിരിത്തോട്ടം എനിക്കു പണത്തിനു തരുക; അല്ലെങ്കിൽ, നിനക്കു സമ്മതമെങ്കിൽ, അതിനു പകരം മറ്റൊരു മുന്തിരിത്തോട്ടം ഞാൻ നിനക്കു തരാം’ എന്നു ഞാൻ അവനോടു പറഞ്ഞു. എന്നാൽ അവൻ, ‘എന്റെ മുന്തിരിത്തോട്ടം ഞാൻ നിനക്കു തരികയില്ല’ എന്നു പറഞ്ഞു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֶסֶף
  choice: പണത്തിനു
  rationale: ഇവിടെ כֶּסֶף എന്നത് വിനിമയമാധ്യമമായ വെള്ളി/പണം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘പണത്തിനു’ എന്നു നൽകി.
- source_word: אִם חָפֵץ אַתָּה
  choice: നിനക്കു സമ്മതമെങ്കിൽ
  rationale: വാച്യമായി ‘നീ ആഗ്രഹിക്കുന്നുവെങ്കിൽ’; ഇടപാടിനോടുള്ള സന്നദ്ധതയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: כֶּרֶם תַּחְתָּיו
  choice: അതിനു പകരം മറ്റൊരു മുന്തിരിത്തോട്ടം
  rationale: תַּחְתָּיו എന്നത് ‘അതിന്റെ സ്ഥാനത്ത്/അതിനു പകരം’ എന്നാണ്; മലയാളത്തിൽ ആശയം വ്യക്തമാക്കാൻ ‘മറ്റൊരു’ ചേർത്തു.
- source_word: הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ
  rationale: നാബോത്തിന്റെ സ്ഥലപരമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ അർത്ഥം
  choice: നേരിട്ടുള്ള പ്രസ്താവനയിലേക്കുള്ള സ്വാഭാവിക മാറ്റമായി കോളൺ ഉപയോഗിച്ചു
  alternative: ‘കാരണം’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെ כִּי അഹാബിന്റെ മറുപടിയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഉദ്ധരണിസൂചകമായി മനസ്സിലാക്കാം. ‘കാരണം’ എന്നു നൽകിയാൽ മലയാളത്തിൽ കാരണബന്ധം അനാവശ്യമായി ശക്തമാകും; അതിനാൽ വാക്യത്തിന്റെ സാക്ഷ്യഭാവം നിലനിർത്തി നേരിട്ടുള്ള ഉദ്ധരണിയായി നൽകി.
- issue: നാബോത്തിന്റെ നിരസനത്തിൽ മുൻവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ കാരണം ആവർത്തിക്കാത്തത്
  choice: ഈ വാക്യത്തിലുള്ള ചുരുക്കിയ മറുപടി മാത്രം നിലനിർത്തി
  alternative: പിതൃസ്വത്തിന്റെ ദൈവിക വിലക്ക് വിശദീകരിച്ചു ചേർക്കുക
  rationale: 21:3-ൽ കാരണം കാണുന്നുവെങ്കിലും 21:6-ൽ അഹാബ് അത് ഒഴിവാക്കി ‘തരികയില്ല’ എന്നു മാത്രമാണ് അറിയിക്കുന്നത്; വിവരണത്തിലെ ഈ നിർണായക വ്യത്യാസം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, രാജാവിന്റെ സംഭാഷണത്തിന് യോജിച്ച മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമായ ഭാഷ. എബ്രായത്തിലെ ആവർത്തനവും അഹാബിന്റെ സ്വയംന്യായീകരണ സ്വരവും കഴിയുന്നത്ര നിലനിർത്തി; ഉദ്ധരണിതലങ്ങൾ വ്യക്തമായി ചിഹ്നപ്പെടുത്തി.
