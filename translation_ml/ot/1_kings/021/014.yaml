  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ഈസബെലിന് സന്ദേശമയച്ചു: “നാബോത്ത് കല്ലെറിയപ്പെട്ടു; അവൻ മരിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: അപ്പോൾ അവർ … സന്ദേശമയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്തു. പിന്നാലെ സന്ദേശത്തിന്റെ ഉള്ളടക്കം വരുന്നതിനാൽ ‘സന്ദേശമയച്ചു’ എന്നത് സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: אֶל אִיזֶבֶל
  choice: ഈസബെലിന്
  rationale: ദിശ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ സ്വാഭാവികമായി ദാതൃവിഭക്തിയിലൂടെ പ്രകടിപ്പിച്ചു; വ്യക്തിനാമം മലയാളത്തിലെ പതിവുരൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: ഹീബ്രു ഭാഷയിലെ ഉദ്ധരണി-ആമുഖമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ഉദ്ധരണിക്കുമുമ്പുള്ള ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: סֻקַּל נָבוֹת
  choice: നാബോത്തിനെ കല്ലെറിഞ്ഞു
  rationale: പുഅൽ രൂപത്തിലെ നിഷ്ക്രിയ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ കർത്താവില്ലാത്ത പ്രയോഗത്തിലൂടെ നൽകി. ‘കൊന്നു’ എന്നു ചേർത്തിട്ടില്ല, കാരണം മരണം അടുത്ത ക്രിയയിൽ പ്രത്യേകം പറയുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: ക്രിയയുടെ സംഭവാത്മകവും തുടർച്ചാസൂചകവുമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ഫലാവസ്ഥയായി മാത്രം ‘മരിച്ചിരിക്കുന്നു’ എന്നു മാറ്റിയിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ നിഷ്ക്രിയതയും രണ്ടു തുടർച്ചയായ സംഭവങ്ങളും നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ മലയാള നിഷ്ക്രിയപ്രയോഗം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
