source:
  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: ml
  text: “ഇതാ, ഞാൻ നിന്റെമേൽ ദുരന്തം വരുത്തുന്നു. നിന്റെ പിന്നാലെ വരുന്നവരെയെല്ലാം ഞാൻ തൂത്തുനീക്കും; ഇസ്രായേലിൽ ആഹാബിന്റെ ഭവനത്തിൽനിന്ന് സകല പുരുഷന്മാരെയും[a]—അടച്ചുവെക്കപ്പെട്ടവരായാലും സ്വതന്ത്രരായാലും—ഞാൻ ഛേദിച്ചുകളയും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്ന ഏവനെയും”; സകല പുരുഷന്മാരെയും സൂചിപ്പിക്കുന്ന പരുഷമായ ഒരു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: പ്രവാചകീയ പ്രഖ്യാപനത്തിന്റെ അടിയന്തരതയും ഗൗരവവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מֵבִיא ... רָעָה
  choice: ദുരന്തം വരുത്തുന്നു
  rationale: വിധിന്യായസന്ദർഭത്തിൽ רָעָה ധാർമ്മിക തിന്മയേക്കാൾ വിനാശകരമായ അനർത്ഥത്തെയോ ദുരന്തത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: നിന്റെ പിന്നാലെയുള്ളവരെ ഞാൻ തൂത്തുനീക്കും
  rationale: בער എന്ന ക്രിയയുടെ സമൂലമായി നീക്കിക്കളയുക എന്ന ശക്തിയും אַחֲרֶיךָ എന്നതിന്റെ ‘നിന്റെ പിന്നാലെ’ എന്ന രൂപകവും നിലനിർത്തുന്നു; ‘സന്തതി’ എന്നു മാത്രം പറഞ്ഞ് സൂചനയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: ആഹാബിനുള്ള ... ഞാൻ ഛേദിച്ചുകളയും
  rationale: כרת എന്ന വിധിന്യായപ്രയോഗത്തിന്റെ ‘വെട്ടിമാറ്റുക/നശിപ്പിക്കുക’ എന്ന ശക്തി നിലനിർത്തുകയും לְאַחְאָב എന്ന ബന്ധസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: സകല പുരുഷന്മാരെയും
  rationale: അക്ഷരാർഥത്തിൽ പരുഷമായ ഹീബ്രു ശൈലിയായതിനാൽ മുഖ്യവാക്യത്തിൽ അതിന്റെ ഉദ്ദേശ്യാർഥം നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְעָצוּר וְעָזוּב
  choice: അടച്ചുവെക്കപ്പെട്ടവനായാലും സ്വതന്ത്രനായാലും
  rationale: വീട്ടിലോ നിയന്ത്രണത്തിലോ ഉള്ളവനും പുറത്തു സ്വതന്ത്രനായവനും എന്ന വിപരീതജോടിയിലൂടെ ആരും ഒഴിവാകില്ലെന്ന സമഗ്രത പ്രകടമാക്കുന്നു; ദാസൻ/സ്വതന്ത്രൻ എന്ന വ്യാഖ്യാനം ഉറപ്പിച്ചു ചുമത്തുന്നില്ല.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: ദൈവിക വിധിന്യായത്തിലെ רָעָה എന്ന പദം
  choice: ദുരന്തം
  alternative: തിന്മ / അനർത്ഥം
  rationale: ദൈവം ധാർമ്മിക തിന്മ ചെയ്യുന്നു എന്ന അർഥം അനാവശ്യമായി സൃഷ്ടിക്കാതെ, പ്രഖ്യാപിക്കപ്പെടുന്ന ശിക്ഷയുടെ കഠിനത കൃത്യമായി അറിയിക്കുന്നു.
- issue: אַחֲרֶיךָ സൂചിപ്പിക്കുന്നവർ
  choice: നിന്റെ പിന്നാലെയുള്ളവർ
  alternative: നിന്റെ സന്തതി
  rationale: സന്ദർഭം ആഹാബിന്റെ വംശത്തെയും ഭവനത്തെയും ലക്ഷ്യമിടുന്നുവെങ്കിലും, ഹീബ്രു നേരിട്ട് ‘സന്തതി’ എന്നു പറയുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ സൂചനയും വ്യാപ്തിയിലെ ചെറിയ അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: וְעָצוּר וְעָזוּב എന്ന ദ്വന്ദപ്രയോഗം
  choice: അടച്ചുവെക്കപ്പെട്ടവനായാലും സ്വതന്ത്രനായാലും
  alternative: ദാസനായാലും സ്വതന്ത്രനായാലും
  rationale: ഈ പ്രയോഗത്തിന്റെ കൃത്യമായ സാമൂഹിക വിഭാഗീകരണം വിവാദമായതിനാൽ, മൂലപദങ്ങളുടെ വിരുദ്ധദിശകളെയും ‘ഒരാളും ശേഷിക്കില്ല’ എന്ന ആകെ അർഥത്തെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ വിധിന്യായപ്രഖ്യാപന ശൈലി. ‘ഇതാ’, ‘തൂത്തുനീക്കും’, ‘ഛേദിച്ചുകളയും’ എന്നിവ മൂലവാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; പരുഷമായ ഹീബ്രു പുരുഷസൂചകപ്രയോഗം വായനാസൗകര്യത്തിനായി മുഖ്യവാക്യത്തിൽ അർഥാനുസൃതമായി നൽകി അടിക്കുറിപ്പിൽ അക്ഷരാർഥം രേഖപ്പെടുത്തി.
