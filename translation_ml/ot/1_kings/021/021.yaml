revisions:
- from: “ഇതാ, ഞാൻ നിന്റെമേൽ ദുരന്തം വരുത്തുന്നു. നിന്റെ പിന്നാലെയുള്ളവരെ ഞാൻ തൂത്തുനീക്കും; ഇസ്രായേലിൽ ആഹാബിനുള്ള സകല പുരുഷന്മാരെയും[a]—അടച്ചുവെക്കപ്പെട്ടവനായാലും സ്വതന്ത്രനായാലും—ഞാൻ ഛേദിച്ചുകളയും.”
  to: “ഇതാ, ഞാൻ നിന്റെമേൽ ദുരന്തം വരുത്തുന്നു. നിന്റെ പിന്നാലെ വരുന്നവരെയെല്ലാം ഞാൻ തൂത്തുനീക്കും; ഇസ്രായേലിൽ ആഹാബിന്റെ ഭവനത്തിൽനിന്ന് സകല പുരുഷന്മാരെയും[a]—അടച്ചുവെക്കപ്പെട്ടവരായാലും സ്വതന്ത്രരായാലും—ഞാൻ ഛേദിച്ചുകളയും.”
  rationale: ‘ആഹാബിനുള്ള’ എന്ന തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ബന്ധസൂചന ‘ആഹാബിന്റെ ഭവനത്തിൽനിന്ന്’ എന്നു തിരുത്തി, ആഹാബിന്റെ കുടുംബം/ഭവനം ലക്ഷ്യമാക്കുന്ന വിധിന്യായസൂത്രവാക്യം വ്യക്തമായി അറിയിച്ചു. ‘സകല പുരുഷന്മാരെയും’ എന്ന ബഹുവചനത്തോടു യോജിപ്പിക്കാൻ ദ്വന്ദപ്രയോഗത്തിലെ രൂപങ്ങൾ ബഹുവചനമാക്കി. മറ്റെല്ലാ മുഖ്യ വിവർത്തനതീരുമാനങ്ങളും നിലനിർത്തി.
