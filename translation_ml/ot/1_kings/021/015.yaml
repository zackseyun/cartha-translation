  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: ml
  text: 'നാബോത്ത് കല്ലെറിഞ്ഞ് കൊല്ലപ്പെട്ടെന്ന് ഈസബെൽ കേട്ടപ്പോൾ, അവൾ ആഹാബിനോടു പറഞ്ഞു: “എഴുന്നേൽക്കുക; പണം കൊടുത്ത് നിനക്കു നൽകാൻ വിസമ്മതിച്ച യിസ്രെയേല്യനായ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടം കൈവശമാക്കുക. നാബോത്ത് ജീവനോടെയില്ല; അവൻ മരിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: סֻקַּל ... וַיָּמֹת
  choice: കല്ലെറിഞ്ഞുകൊന്നെന്നു
  rationale: കല്ലെറിയൽ മരണശിക്ഷയായിരുന്നുവെന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള വാക്യത്തിൽ മരണം വീണ്ടും ഊന്നിപ്പറയപ്പെടുന്നതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: קוּם
  choice: എഴുന്നേൽക്കുക
  rationale: കൽപ്പനയുടെ നേരിട്ടുള്ള ശക്തിയും മാന്യമായ ആധുനിക ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: רֵשׁ
  choice: കൈവശമാക്കുക
  rationale: ഇവിടെ ഭൂമി അവകാശപ്പെടുത്തി കൈവശപ്പെടുത്തുക എന്ന അർഥമാണ്; ‘അവകാശമാക്കുക’ എന്നതിലുപരി ഉറവിടപദത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: כֶּרֶם
  choice: മുന്തിരിത്തോട്ടം
  rationale: സന്ദർഭത്തിലെ കാർഷികസ്വത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ
  rationale: നാബോത്തിന്റെ സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: പണത്തിനു നിനക്കു തരാൻ വിസമ്മതിച്ച
  rationale: ‘വെള്ളിക്ക് തരുക’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ പണംകൊടുത്തുള്ള കൈമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പണത്തിനു’ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്, എന്നാൽ ‘വിൽക്കാൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אֵין נָבוֹת חַי כִּי מֵת
  choice: നാബോത്ത് ഇപ്പോൾ ജീവനോടെയില്ല; അവൻ മരിച്ചിരിക്കുന്നു
  rationale: ‘ജീവനോടെയില്ല’ എന്നും ‘മരിച്ചിരിക്കുന്നു’ എന്നും വരുന്ന ഇരട്ട പ്രസ്താവനയുടെ നിർദയമായ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ ‘ഈസബെൽ’, ‘ആഹാബ്’, ‘നാബോത്ത്’, ‘യിസ്രെയേല്യൻ’ എന്ന പരിചിത ബൈബിൾരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
