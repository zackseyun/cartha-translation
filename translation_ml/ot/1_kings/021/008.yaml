id: 1KI.21.8
reference: 1 Kings 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: ml
  text: അങ്ങനെ അവൾ ആഹാബിന്റെ പേരിൽ കത്തുകൾ എഴുതി, അവന്റെ മുദ്രകൊണ്ട് അവ മുദ്രവെച്ചു. തുടർന്ന് അവന്റെ പട്ടണത്തിൽ[a] നാബോത്തിനോടൊപ്പം താമസിച്ചിരുന്ന മൂപ്പന്മാർക്കും പ്രഭുക്കന്മാർക്കും ആ കത്തുകൾ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെ പട്ടണം’ എന്നത് ‘ആഹാബിന്റെ പട്ടണം’ എന്നും മനസ്സിലാക്കാം. എബ്രായത്തിലെ സർവനാമപ്രത്യയം നാബോത്തിനെയോ ആഹാബിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: അങ്ങനെ അവൾ എഴുതി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻസന്ദർഭത്തിലെ ഈസബേലാണ് സ്ത്രീലിംഗ ഏകവചന കർത്താവ്.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: കത്തുകൾ / ആ കത്തുകൾ
  rationale: ഔദ്യോഗികമായി പ്രാദേശിക നേതാക്കൾക്ക് അയച്ച എഴുത്തുസന്ദേശങ്ങൾ എന്ന സന്ദർഭത്തിൽ ‘കത്തുകൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּשֵׁם אַחְאָב
  choice: ആഹാബിന്റെ പേരിൽ
  rationale: ആഹാബിന്റെ അധികാരത്തെ പ്രതിനിധാനം ചെയ്ത് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: അവന്റെ മുദ്രകൊണ്ട് അവ മുദ്രവെച്ചു
  rationale: ഔദ്യോഗിക മുദ്ര ഉപയോഗിച്ച് രേഖകൾ മുദ്രവെച്ചുവെന്ന חתם / חותם പ്രയോഗത്തിന്റെ അർഥം നേരിട്ട് പകരുന്നു.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: നഗരത്തിലെ ഭരണപരവും സാമൂഹികവുമായ നേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ പദം.
- source_word: הַחֹרִים
  choice: പ്രഭുക്കന്മാർ
  rationale: ഉന്നത സാമൂഹിക സ്ഥാനമുള്ള പ്രമുഖരെ സൂചിപ്പിക്കുന്ന חֹרִים എന്ന പദത്തിന് ഗൗരവമുള്ളതും മനസ്സിലാകുന്നതുമായ തർജമ.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: അവന്റെ പട്ടണത്തിൽ
  rationale: മൂലത്തിലെ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചന പ്രത്യയം നിലനിർത്തുന്നു; മുഖ്യവായനയിൽ അത് നാബോത്തിനെ സൂചിപ്പിക്കുന്നതായി വാക്യക്രമം വ്യക്തമാക്കുന്നു, എന്നാൽ മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: നാബോത്തിനോടൊപ്പം താമസിച്ചിരുന്ന
  rationale: ישב കൂടെ אֶת വന്നിരിക്കുന്നതിലെ ഒരേ സ്ഥലത്ത് പാർക്കുക എന്ന ബന്ധ-സ്ഥലാർഥം അമിത വ്യാഖ്യാനമില്ലാതെ പകരുന്നു.
theological_decisions:
- issue: בְּעִירוֹ എന്നതിലെ സർവനാമപ്രത്യയത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവന്റെ പട്ടണം’ നാബോത്തിന്റെ പട്ടണത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അവന്റെ പട്ടണം’ ആഹാബിന്റെ പട്ടണത്തെ സൂചിപ്പിക്കുന്നു
  rationale: തുടർന്നുവരുന്ന ‘നാബോത്തിനോടൊപ്പം താമസിച്ചിരുന്ന’ എന്ന പ്രയോഗം അവന്റെ പ്രാദേശിക നേതാക്കളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ വ്യാകരണപരമായി ആഹാബും സാദ്ധ്യമായ സൂചിതവ്യക്തിയായതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മൂപ്പന്മാർ’, ‘പ്രഭുക്കന്മാർ’, ‘മുദ്ര’ എന്നീ സ്ഥാപിത ബൈബിൾ-ഭരണപദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ സൂചനാസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
