  source_fidelity: 'മുഖ്യാർഥം വിശ്വസ്തമാണ്: ആഹാബ് യഹോവയുടെ മുമ്പാകെ സ്വയം താഴ്ത്തിയതും, അതിനാൽ ശിക്ഷാദുരന്തം അവന്റെ കാലത്ത് വരുത്താതെ മകന്റെ കാലത്ത് അവന്റെ വീട്ടിന്മേൽ വരുത്തുമെന്നതും കൃത്യമായി പ്രതിഫലിക്കുന്നു. എന്നാൽ ‘തന്നെത്താൻ’ എന്ന രൂപം ആധുനിക നിലവാരമലയാളത്തിൽ അസ്വാഭാവികമാണ്; ‘സ്വയം താഴ്ത്തിയിരിക്കുന്നു’ കൂടുതൽ സ്വാഭാവികവും എബ്രായ നിഫാലിന്റെ സ്വയംതാഴ്ത്തൽ ഭാവം നിലനിർത്തുന്നതുമാണ്.'
  naturalness: ‘ആഹാബ് എന്റെ മുമ്പാകെ തന്നെത്താൻ താഴ്ത്തിയതു’ എന്നതിനെക്കാൾ ‘ആഹാബ് എന്റെ മുമ്പാകെ സ്വയം താഴ്ത്തിയിരിക്കുന്നു’ എന്നത് സ്വാഭാവികമാണ്. ആവർത്തനത്തിലും അതേ രൂപം ഉപയോഗിക്കാം. ‘ഭവനത്തിന്മേൽ’ സാധുവാണെങ്കിലും രാജവംശസൂചനയുള്ള ഈ സന്ദർഭത്തിൽ ‘വീട്ടിന്മേൽ’ കൂടുതൽ സാധാരണമായ ബൈബിൾ മലയാളമാണ്; അടിക്കുറിപ്പ് അർഥവ്യാപ്തി വ്യക്തമാക്കുന്നു.
  terminology: ‘ദുരന്തം’ הָרָעָהയുടെ ന്യായവിധിസന്ദർഭത്തിലുള്ള അർഥത്തിന് ഉചിതമാണ്. ‘സ്വയം താഴ്ത്തിയിരിക്കുന്നു’ മാനസാന്തരം എന്ന അധികവ്യാഖ്യാനം ചേർക്കാതെ נִכְנַע-ന്റെ അർഥം സംരക്ഷിക്കുന്നു. ‘വീട്’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, കുടുംബം/രാജവംശം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
