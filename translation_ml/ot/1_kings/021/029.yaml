  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: ml
  text: ആഹാബ് എന്റെ മുമ്പാകെ സ്വയം താഴ്ത്തിയിരിക്കുന്നു എന്നു നീ കണ്ടുവോ? അവൻ എന്റെ മുമ്പാകെ സ്വയം താഴ്ത്തിയിരിക്കുന്നതിനാൽ, അവന്റെ കാലത്ത് ഞാൻ ആ ദുരന്തം[a] വരുത്തുകയില്ല; അവന്റെ മകന്റെ കാലത്ത് അവന്റെ വീട്ടിന്മേൽ[b] ആ ദുരന്തം വരുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനർഥം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ അക്ഷരാർഥം ‘തിന്മ/ദുരന്തം.’ ഈ ന്യായവിധിസന്ദർഭത്തിൽ ധാർമ്മിക തിന്മയല്ല, ശിക്ഷാരൂപമായ ദുരന്തമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ വീട്’ എന്നത് അവന്റെ കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: നീ കണ്ടുവോ?
  rationale: ראה എന്ന ധാതുവിന്റെ ഖാൽ പെർഫെക്റ്റ് രണ്ടാം പുരുഷ ഏകവചനരൂപമാണിത്. ഏലിയാവിനോടുള്ള ദൈവത്തിന്റെ നേരിട്ടുള്ള ചോദ്യമായി, ഇതിനകം പ്രകടമായ ആഹാബിന്റെ നിലയെ ശ്രദ്ധയിൽപ്പെടുത്തുന്നു.
- source_word: נִכְנַע
  choice: തന്നെത്താൻ താഴ്ത്തി
  rationale: כנע എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ഇവിടെ ദൈവവിധിയുടെ മുമ്പിലുള്ള സ്വയം താഴ്ത്തലിനെയും കീഴടങ്ങലിനെയും സൂചിപ്പിക്കുന്നു. ‘മാനസാന്തരപ്പെട്ടു’ എന്നു വികസിപ്പിക്കാതെ മൂലപാഠത്തിലെ പ്രവൃത്തിയെ മാത്രം നിലനിർത്തുന്നു.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: എന്റെ മുമ്പാകെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ സന്നിധിയിൽനിന്ന്/മുഖത്തുനിന്ന്’ എന്ന ഘടനയാണെങ്കിലും, ഇവിടെ ദൈവസന്നിധിയിലെ നിലപാടിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ‘എന്റെ മുമ്പാകെ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: יַעַן כִּי
  choice: ആയതിനാൽ
  rationale: വിധി നീട്ടിവെക്കുന്നതിന്റെ കാരണം വ്യക്തമാക്കുന്ന കാരണസൂചക സംയോജകമാണ്.
- source_word: לֹא אָבִיא
  choice: ഞാൻ വരുത്തുകയില്ല
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരു ദുരന്തം സംഭവിപ്പിക്കുക അഥവാ വരുത്തുക എന്ന അർഥത്തിലാണ്.
- source_word: הָרָעָה
  choice: ആ ദുരന്തം
  rationale: വിധിന്യായത്തിന്റെ ഈ സന്ദർഭത്തിൽ רָעָה ധാർമ്മിക തിന്മയെയല്ല, ശിക്ഷാരൂപമായ അനർഥത്തെയോ ദുരന്തത്തെയോ സൂചിപ്പിക്കുന്നു. നിർദ്ദിഷ്ടമായ മുൻപ്രഖ്യാപിത വിധിയായതിനാൽ ‘ആ’ ചേർത്തിരിക്കുന്നു.
- source_word: בְּיָמָיו
  choice: അവന്റെ കാലത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ നാളുകളിൽ’ എന്ന കാലപ്രയോഗം ആഹാബിന്റെ ജീവിതകാലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അവന്റെ കാലത്ത്’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: בִּימֵי בְנוֹ
  choice: അവന്റെ മകന്റെ കാലത്ത്
  rationale: മുൻപുള്ള കാലപ്രയോഗത്തോടുള്ള സമാന്തരതയും ആഹാബിന്റെ കാലവും മകന്റെ കാലവും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: עַל בֵּיתוֹ
  choice: അവന്റെ ഭവനത്തിന്മേൽ
  rationale: രാജകീയ സന്ദർഭത്തിൽ ‘ഭവനം’ കുടുംബത്തെയോ രാജവംശത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം മൂലത്തിലെ രൂപകം നിലനിർത്തുകയും സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആഹാബിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ‘തന്നെത്താൻ താഴ്ത്തി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മാനസാന്തരപ്പെട്ടു’ അല്ലെങ്കിൽ ‘കീഴടങ്ങി’
  rationale: ആഹാബ് ദൈവത്തിന്റെ മുമ്പാകെ തന്നെത്താൻ താഴ്ത്തിയെന്നും അതിനാൽ ദൈവം വിധി വൈകിപ്പിച്ചെന്നും വാക്യം പറയുന്നു. എന്നാൽ മാനസാന്തരത്തിനുള്ള പതിവുപദം ഇവിടെ ഇല്ല; അതിനാൽ അവന്റെ പ്രതികരണത്തിന് പൂർണമായ മാനസാന്തരം എന്ന വ്യാഖ്യാനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: ദൈവം വരുത്തുന്ന הָרָעָה എന്നതിന്റെ അർഥം
  choice: ‘ദുരന്തം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തിന്മ’ അല്ലെങ്കിൽ ‘അനർഥം’
  rationale: ഇത് ആഹാബിന്റെ ഭവനത്തിനെതിരായ ശിക്ഷാവിധിയാണ്, ദൈവത്തിലെ ധാർമ്മിക തിന്മയല്ല. അതിനാൽ ന്യായവിധിയുടെ ദുരന്തസ്വഭാവം വ്യക്തമാക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
- issue: עַל בֵּיתוֹ എന്നതിലെ ‘ഭവനം’
  choice: മുഖ്യപാഠത്തിൽ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘കുടുംബം’ അല്ലെങ്കിൽ ‘രാജവംശം’ എന്നു വ്യക്തീകരിക്കുക
  rationale: രാജാവിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ രണ്ടർഥസാധ്യതയും പ്രസക്തമാണ്. ഒന്നിനെ മാത്രം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘തന്നെത്താൻ താഴ്ത്തി’ എന്ന ആവർത്തനം എബ്രായപാഠത്തിലെ ദൈവിക ചോദ്യവും വിധി വൈകിപ്പിക്കുന്ന കാരണവും തമ്മിലുള്ള ഊന്നൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
