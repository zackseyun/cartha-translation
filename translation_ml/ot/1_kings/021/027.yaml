id: 1KI.21.27
reference: 1 Kings 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אַחְאָ֜ב אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ וַ/יִּקְרַ֣ע בְּגָדָ֔י/ו וַ/יָּֽשֶׂם שַׂ֥ק עַל בְּשָׂר֖/וֹ וַ/יָּצ֑וֹם וַ/יִּשְׁכַּ֣ב בַּ/שָּׂ֔ק וַ/יְהַלֵּ֖ךְ אַֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: ml
  text: ആഹാബ് ഈ വാക്കുകൾ കേട്ടപ്പോൾ, അവൻ തന്റെ വസ്ത്രങ്ങൾ കീറി, ദേഹത്തിന്മേൽ ചാക്കുവസ്ത്രം ധരിച്ചു, ഉപവസിച്ചു, ചാക്കുവസ്ത്രത്തിൽ കിടന്നു, ഒതുങ്ങി നടന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പതുക്കെ നടന്നു,’ ‘ശാന്തമായി നടന്നു,’ അല്ലെങ്കിൽ ‘വിഷണ്ണനായി നടന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ പദം ഒതുങ്ങിയതും താഴ്മ പ്രകടമാക്കുന്നതുമായ ചലനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: ആഹാബ് ... കേട്ടപ്പോൾ
  rationale: ഹീബ്രായിലെ കാലസൂചകമായ ആഖ്യാനപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമായി നൽകി; ‘സംഭവിച്ചു’ എന്നു വേർതിരിച്ചു ചേർക്കുന്നത് ഇവിടെ മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ഈ വാക്കുകൾ
  rationale: ഏലീയാവ് അരുളിച്ചെയ്ത ന്യായവിധിവചനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; דָּבָר എന്ന പദത്തിന്റെ വാചികഭാവം നിലനിർത്തുന്നു.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖത്തിന്റെയും താഴ്മയുടെയും പതിവ് ബാഹ്യചിഹ്നമായ പ്രവൃത്തിയെ നേരിട്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: ദേഹത്തിന്മേൽ ചാക്കുവസ്ത്രം ധരിച്ചു
  rationale: שַׂק എന്ന വിലാപവസ്ത്രത്തെ ‘ചാക്കുവസ്ത്രം’ എന്നും בָּשָׂר എന്ന ശരീരസംബന്ധമായ പ്രതിമയെ ‘ദേഹം’ എന്നും നൽകി; ചാക്കുവസ്ത്രം ശരീരത്തോട് ചേർന്നു ധരിച്ചതെന്ന മൂർത്തഭാവം സൂക്ഷിക്കുന്നു.
- source_word: וַיָּצֹם
  choice: ഉപവസിച്ചു
  rationale: צום എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും പ്രചാരത്തിലുള്ളതുമായ മലയാളപരിഭാഷ.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: ചാക്കുവസ്ത്രത്തിൽ കിടന്നു
  rationale: שׁכב സൂചിപ്പിക്കുന്ന കിടക്കുന്ന നില നിലനിർത്തുന്നു; ‘ഉറങ്ങി’ എന്നു പറഞ്ഞ് ഉറക്കത്തെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וַיְהַלֵּךְ אַט
  choice: ഒതുങ്ങി നടന്നു
  rationale: אַט സൂചിപ്പിക്കുന്ന പതിഞ്ഞ, ശാന്തമായ, താഴ്മ പ്രകടമാക്കുന്ന ചലനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും വേഗക്കുറവായി മാത്രം ചുരുക്കുന്നില്ല, അതേസമയം ആന്തരിക മാനസാന്തരം ഉറപ്പിച്ചുപറയുന്നുമില്ല.
theological_decisions:
- issue: ആഹാബിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: വസ്ത്രം കീറുക, ചാക്കുവസ്ത്രം ധരിക്കുക, ഉപവസിക്കുക, അതിൽ കിടക്കുക, ഒതുങ്ങി നടക്കുക എന്നീ ബാഹ്യമായ വിലാപ-താഴ്മാപ്രവൃത്തികൾ മാത്രം വിവരിക്കുക.
  alternative: ആഹാബ് ഹൃദയപൂർവം മാനസാന്തരപ്പെട്ടു എന്നു പറയുക; അല്ലെങ്കിൽ അവന്റെ പ്രവൃത്തികൾ വെറും പ്രകടനം മാത്രമായിരുന്നു എന്നു പറയുക.
  rationale: ഹീബ്രായ വാക്യം ആഹാബിന്റെ പ്രവൃത്തികളെയാണ് രേഖപ്പെടുത്തുന്നത്; അവന്റെ ഉള്ളിലെ ആത്മാർഥതയെ ഈ വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ആഖ്യാനക്രമം നിലനിർത്തുകയും ആവർത്തിക്കുന്ന ‘ചാക്കുവസ്ത്രം’ എന്ന പ്രതിമ ചുരുക്കാതിരിക്കുകയും ചെയ്തു.
