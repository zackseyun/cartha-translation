  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: ml
  text: 'അപ്പോൾ ആ രണ്ടു ദുഷ്ടന്മാർ[a] വന്ന് നാബോത്തിന്റെ എതിർവശത്ത് ഇരുന്നു. ആ ദുഷ്ടന്മാർ ജനത്തിന്റെ മുമ്പാകെ നാബോത്തിനെതിരെ സാക്ഷ്യം പറഞ്ഞു: “നാബോത്ത് ദൈവത്തെയും രാജാവിനെയും ശപിച്ചു[b].” പിന്നെ അവർ അവനെ നഗരത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി കല്ലുകൾകൊണ്ട് എറിഞ്ഞു; അവൻ മരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ബെലിയാലിന്റെ പുത്രന്മാർ’ / ‘ബെലിയാലിന്റെ ആളുകൾ’; ദുഷ്ടരോ അധമരോ ആയ ആളുകളെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അനുഗ്രഹിച്ചു’; ഇവിടെ ‘ശപിച്ചു’ എന്ന അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ആദരസൂചക പരോക്ഷപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: ദുഷ്ടന്മാർ
  rationale: ഈ എബ്രായ പ്രയോഗം ജൈവവംശത്തെ സൂചിപ്പിക്കുന്നതല്ല; ധാർമികമായി അധമരും നിയമലംഘകരുമായ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദുഷ്ടന്മാർ’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: נֶגְדּוֹ
  choice: നാബോത്തിന്റെ എതിർവശത്ത്
  rationale: നാബോത്തിനെ അഭിമുഖീകരിച്ചുള്ള ഇരിപ്പിടമാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. സർവനാമത്തിനു പകരം പേര് ഉപയോഗിക്കുന്നത് മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: וַיְעִדֻהוּ
  choice: നാബോത്തിനെതിരെ സാക്ഷ്യം പറഞ്ഞത്
  rationale: ഇവിടെ ക്രിയ നിയമപരമായ സാക്ഷ്യവാക്കിനെ സൂചിപ്പിക്കുന്നു; വെറും കുറ്റാരോപണത്തേക്കാൾ ഔപചാരികമായ ന്യായസഭാ പശ്ചാത്തലം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: נֶגֶד הָעָם
  choice: ജനത്തിന്റെ മുമ്പാകെ
  rationale: കുറ്റാരോപണം പരസ്യമായി ജനസന്നിധിയിൽ നടത്തിയെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בֵּרַךְ
  choice: ശപിച്ചു
  rationale: പദത്തിന്റെ ഉപരിതല അർഥം ‘അനുഗ്രഹിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ദൈവദൂഷണാരോപണത്തിൽ ആദരസൂചകമായ പരോക്ഷപ്രയോഗമായി ‘ശപിച്ചു’ എന്നാണ് ഉദ്ദേശ്യം. യഥാർഥ അർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകുന്നു.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: ദൈവത്തെയും രാജാവിനെയും
  rationale: ഇസ്രായേല്യ ന്യായസഭാ പശ്ചാത്തലത്തിൽ אֱלֹהִים ഏകവചനമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ബന്ധകവും രണ്ട് കർമങ്ങളെയും വ്യക്തമായി ചേർക്കുന്നു.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: അവനെ നഗരത്തിനു പുറത്തേക്കു കൊണ്ടുപോയി
  rationale: വധശിക്ഷ നടപ്പാക്കുന്നതിനായി നാബോത്തിനെ നഗരപരിധിക്കു പുറത്തേക്ക് മാറ്റിയതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: കല്ലുകൾകൊണ്ട് എറിഞ്ഞു
  rationale: എബ്രായത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്ന ‘കല്ലുകൾകൊണ്ട്’ എന്ന ഘടകം നിലനിർത്തി ശിക്ഷയുടെ രീതി നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: וַיָּמֹת
  choice: അവൻ മരിച്ചു
  rationale: അന്തിമ ക്രിയയെ വേറിട്ട കഥാക്രമഘടകമായി നിലനിർത്തുന്നു; ‘കൊന്നു’ എന്നു മാത്രം പറഞ്ഞ് ഫലത്തെ മുൻവാക്യത്തിൽ ലയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവദൂഷണാരോപണത്തിലെ בֵּרַךְ എന്ന ആദരസൂചക പരോക്ഷപ്രയോഗം
  choice: മുഖ്യവാചകത്തിൽ ഉദ്ദേശ്യാർഥമായ ‘ശപിച്ചു’
  alternative: അക്ഷരാർഥമായ ‘അനുഗ്രഹിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി അടിക്കുറിപ്പിൽ ‘ശപിച്ചു’ എന്നു വിശദീകരിക്കുക
  rationale: ആരോപണത്തിന്റെ യഥാർഥ ഉള്ളടക്കം നാബോത്ത് ദൈവത്തെയും രാജാവിനെയും ശപിച്ചു എന്നതാണ്. ‘അനുഗ്രഹിച്ചു’ എന്നു മുഖ്യവാചകത്തിൽ നൽകിയാൽ അർഥം തെറ്റിദ്ധരിപ്പിക്കും; എങ്കിലും എബ്രായത്തിലെ ആദരസൂചക പരോക്ഷത അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി സ്വീകരിച്ചു. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കാൻ ‘സാക്ഷ്യം പറഞ്ഞു’, പരസ്യസന്ദർഭത്തിന് ‘ജനത്തിന്റെ മുമ്പാകെ’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. എബ്രായത്തിലെ കഥാക്രമവും അന്തിമമായ ‘അവൻ മരിച്ചു’ എന്ന സ്വതന്ത്ര പ്രസ്താവനയും നിലനിർത്തി.
