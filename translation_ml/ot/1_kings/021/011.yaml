  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: ml
  text: അങ്ങനെ, അവന്റെ നഗരത്തിലെ പുരുഷന്മാർ—അവന്റെ നഗരത്തിൽ താമസിച്ചിരുന്ന മൂപ്പന്മാരും പ്രഭുക്കന്മാരും[a]—ഈസേബെൽ അവർക്കു അയച്ചതുപോലെ, അവൾ അവർക്കു അയച്ച കത്തുകളിൽ എഴുതിയിരുന്നതുപോലെതന്നെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രമുഖർ”; “പ്രഭുക്കന്മാർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം സമൂഹത്തിൽ ഉന്നതസ്ഥാനമുള്ള പുരുഷന്മാരെയോ ഉയർന്ന പദവിയിലുള്ള ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: ആജ്ഞകൾ അനുസരിച്ച് പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ ക്രിയ; എബ്രായ ആഖ്യാനത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי עִירוֹ
  choice: അവന്റെ നഗരത്തിലെ പുരുഷന്മാർ
  rationale: തുടർന്നുവരുന്ന സമാനാധികരണപ്രയോഗം പുരുഷന്മാരായ നഗരനേതാക്കളെ—മൂപ്പന്മാരെയും പ്രഭുക്കന്മാരെയും—വ്യക്തമാക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: പ്രായമേറിയ പുരുഷന്മാർ എന്നതിലുപരി അംഗീകൃത സാമൂഹിക-നഗര നേതാക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: הַחֹרִים
  choice: പ്രഭുക്കന്മാർ
  rationale: ഉയർന്ന സാമൂഹിക പദവിയോ ഔദ്യോഗിക സ്ഥാനമോ ഉള്ള പ്രമുഖരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: അവന്റെ നഗരത്തിൽ താമസിച്ചിരുന്ന
  rationale: ישב എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ താമസിക്കുക/വസിക്കുക എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: ഈസേബെൽ തങ്ങൾക്ക് അയച്ച നിർദേശപ്രകാരം
  rationale: അയച്ചത് എന്തെന്ന കർമം എബ്രായത്തിൽ വ്യക്തമല്ലെങ്കിലും പിന്നാലെ പറയുന്ന കത്തുകളും അവയിലെ നിർദേശങ്ങളും സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്നു; മലയാളത്തിൽ അപൂർണമായി തോന്നാതിരിക്കാൻ നിയന്ത്രിതമായ വ്യക്തമാക്കൽ നൽകി.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: കത്തുകളിൽ എഴുതിയിരുന്നതുപോലെ
  rationale: ഇവിടെ סְפָרִים ഈസേബെൽ അയച്ച എഴുത്തുകുത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; 'കത്തുകൾ' സന്ദർഭോചിതമാണ്.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: അവൾ തങ്ങൾക്ക് അയച്ച
  rationale: കത്തുകളെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം വ്യക്തമായി നിലനിർത്തുന്നു.
