reference: 1 Kings 21:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: ml
  text: എഴുന്നേറ്റ്, ശമര്യയിലുള്ള ഇസ്രായേൽരാജാവായ ആഹാബിനെ കണ്ടുമുട്ടാൻ ഇറങ്ങിച്ചെല്ലുക. ഇതാ, അവൻ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടത്തിലുണ്ട്; അത് കൈവശമാക്കാൻ[a] അവൻ അവിടേക്കു ഇറങ്ങിച്ചെന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത് സ്വന്തമാക്കാൻ.’ ഹീബ്രു ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് കൈവശമാക്കുക, സ്വന്തമാക്കുക, അവകാശമായി പ്രാപിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ഏകവചന ആജ്ഞയുടെ ‘എഴുന്നേൽക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, തുടർന്നുവരുന്ന ആജ്ഞയുമായി സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: רֵד
  choice: ഇറങ്ങിച്ചെല്ലുക
  rationale: ירד എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുകയും ആജ്ഞാരൂപം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לִקְרַאת
  choice: കണ്ടുമുട്ടാൻ
  rationale: ആഹാബിന്റെ അടുക്കലേക്കു ചെന്നു അവനെ നേരിൽ കാണുക എന്ന അർഥം നൽകുന്നു; ‘നേരിടാൻ’ എന്നു പറഞ്ഞ് ഏറ്റുമുട്ടൽ എന്ന ആശയം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ഹീബ്രു സംയുക്ത രാജപദവി നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: ശമര്യയിലുള്ള
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു ബന്ധവാക്യത്തിലെ സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘ശമര്യയിൽ വാഴുന്ന’ എന്ന വ്യാഖ്യാനപരമായ പരിഹാരം ചേർക്കുന്നില്ല.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വിവരണത്തിന് അടിയന്തരത നൽകുകയും ചെയ്യുന്ന ഹീബ്രു സൂചകപദത്തിന് യോജിച്ച, മാന്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: בְּכֶרֶם נָבוֹת
  choice: നാബോത്തിന്റെ മുന്തിരിത്തോട്ടത്തിലുണ്ട്
  rationale: בְּ എന്ന സ്ഥലസൂചനയും നാബോത്തിന്റെ ഉടമസ്ഥബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: അവൻ അവിടേക്കു ഇറങ്ങിച്ചെന്നിരിക്കുന്നു
  rationale: മുൻപ് നടന്ന ഇറങ്ങിച്ചെല്ലലിന്റെ ഫലമായി ആഹാബ് ഇപ്പോൾ അവിടെ ഉണ്ടെന്ന സന്ദർഭബന്ധം മലയാളത്തിലെ പൂർത്തിക്രിയയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: לְרִשְׁתּוֹ
  choice: അത് കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ നിയമപരവും ഉടമസ്ഥതാസംബന്ധവുമായ അർഥം നൽകുന്നു; ക്രിയ സ്വതവേ വ്യക്തമാക്കാത്ത ബലപ്രയോഗം ‘പിടിച്ചെടുക്കുക’ എന്നതിലൂടെ ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആജ്ഞയുടെ ചടുലത നിലനിർത്തിക്കൊണ്ട് ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘ശമര്യയിലുള്ള’ എന്ന പ്രയോഗത്തിലൂടെ മൂലപാഠത്തിലെ സ്ഥലപരമായ അസ്വാഭാവികത പരിഹരിക്കാതെ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘കൈവശമാക്കാൻ’ എന്ന പദത്തോടു ചേർത്തു.
