reference: 1 Kings 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: ml
  text: 'ഈസേബെലിനെക്കുറിച്ചും യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്തു: “യിസ്രെയേലിന്റെ പ്രദേശത്ത്[a] നായ്ക്കൾ ഈസേബെലിനെ തിന്നും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്രെയേലിന്റെ കോട്ടമതിലിനരികെ.” ഇവിടെയുള്ള എബ്രായപദം ദുഷ്കരമാണ്; അത് നഗരത്തിന്റെ കോട്ടകെട്ടിയ പുറംഭാഗത്തെ കൂടുതൽ കൃത്യമായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: -നെക്കുറിച്ചും
  rationale: മുൻവിധിപ്രഖ്യാപനത്തോടുള്ള ബന്ധവും גַם എന്ന പദത്തിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לְאִיזֶבֶל
  choice: ഈസേബെലിനെക്കുറിച്ച്
  rationale: דבר എന്ന ക്രിയയോടുകൂടിയ לְ ഇവിടെ ഈസേബെൽ നേരിട്ടുള്ള ശ്രോതാവാണെന്നതിലുപരി അവളെ സംബന്ധിച്ചുള്ള അരുളപ്പാടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്തു
  rationale: ദൈവിക അരുളപ്പാടിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് דִּבֶּר ... לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכְּלָבִים יֹאכְלוּ
  choice: നായ്ക്കൾ ... തിന്നുകളയും
  rationale: ലളിതമായ പ്രവചനഭാവിയും 'തിന്നുക' എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു; '-കളയും' പ്രവൃത്തിയുടെ നിർണായകമായ സമാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: യിസ്രെയേലിന്റെ പ്രദേശത്ത്
  rationale: חֵל എന്ന ദുഷ്കരപദത്തെ അതിരുകടന്ന കൃത്യതയോടെ നിർവചിക്കാതെ സ്ഥലസൂചന വ്യക്തമാക്കുന്നു; കോട്ടമതിൽസംബന്ധിയായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിലെ സ്ഥിരപ്രചാരമുള്ള ദൈവനാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: לְאִיזֶבֶל എന്നതിന്റെ ബന്ധാർഥം
  choice: ഈസേബെലിനെക്കുറിച്ച്
  alternative: ഈസേബെലിനോട് / ഈസേബെലിനെതിരെ
  rationale: സന്ദർഭത്തിൽ ഈസേബെൽ അരുളപ്പാടിന്റെ നേരിട്ടുള്ള ശ്രോതാവല്ല; അവളെക്കുറിച്ചുള്ള ന്യായവിധിയാണ് ഏലീയാവ് അറിയിക്കുന്നത്.
- issue: בְּחֵל יִזְרְעֶאל എന്ന ദുഷ്കരപ്രയോഗം
  choice: യിസ്രെയേലിന്റെ പ്രദേശത്ത്
  alternative: യിസ്രെയേലിന്റെ കോട്ടമതിലിനരികെ
  rationale: പ്രധാനപാഠത്തിൽ വ്യക്തമായ സ്ഥലാർഥം നൽകുകയും വാസ്തുശില്പപരമായ കൂടുതൽ നിർദിഷ്ട വായനയെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവചനശൈലി. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ‘ഈസേബെൽ’, ‘യിസ്രെയേൽ’ എന്നീ രൂപങ്ങളും ദൈവനാമത്തിന് ‘യഹോവ’യും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം [a] പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
