    issue: ‘തിന്നുകളയും’ is semantically stronger than the Hebrew future verb.
    rationale: The suffixal/completive sense in ‘-കളയും’ can suggest eating up or thorough destruction. Hebrew יֹאכְלוּ simply states that the dogs ‘will eat’ Jezebel; ‘തിന്നും’ preserves that unembellished assertion.
