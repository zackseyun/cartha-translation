source:
  edition: WLC
  text: וַ/יָּבֹא֩ אַחְאָ֨ב אֶל בֵּית֜/וֹ סַ֣ר וְ/זָעֵ֗ף עַל הַ/דָּבָר֙ אֲשֶׁר דִּבֶּ֣ר אֵלָ֗י/ו נָבוֹת֙ הַ/יִּזְרְעֵאלִ֔י וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת נַחֲלַ֣ת אֲבוֹתָ֑/י וַ/יִּשְׁכַּב֙ עַל מִטָּת֔/וֹ וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו וְ/לֹֽא אָ֥כַל לָֽחֶם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: ml
  text: അങ്ങനെ, യിസ്രെയേല്യനായ നാബോത്ത് തന്നോടു പറഞ്ഞ വാക്ക് നിമിത്തം ആഹാബ് മുഷിഞ്ഞും കോപിച്ചും തന്റെ വീട്ടിലേക്കു ചെന്നു.[a] “എന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി ഞാൻ നിനക്കു തരുകയില്ല”[b] എന്നു നാബോത്ത് പറഞ്ഞിരുന്നു. ആഹാബ് തന്റെ കിടക്കയിൽ കിടന്ന് മുഖം തിരിച്ചുകളഞ്ഞു; അപ്പം കഴിക്കാനും വിസമ്മതിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യിസ്രെയേല്യനായ നാബോത്ത് തന്നോടു പറഞ്ഞ കാര്യം നിമിത്തം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് “വാക്ക്,” “കാര്യം,” “സംഭവം” എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: '“എന്റെ പൂർവികരുടെ അവകാശഭൂമി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം: “എന്റെ പിതാക്കന്മാരുടെ.”'
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അപ്പം കഴിച്ചില്ല.” ഇവിടെ “അപ്പം കഴിക്കുക” എന്നത് പൊതുവായി ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: മുഷിഞ്ഞും കോപിച്ചും
  rationale: ആഹാബിന്റെ ഉള്ളിലൊതുക്കിയ നീരസവും പ്രകടമായ കോപവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വേർതിരിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: തന്നോടു പറഞ്ഞ വാക്ക് നിമിത്തം
  rationale: דבר എന്ന പദത്തിന്റെ ‘വാക്ക്/കാര്യം’ എന്ന അർത്ഥവ്യാപ്തി കഴിയുന്നത്ര നിലനിർത്തുകയും കാരണബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ നാബോത്ത്
  rationale: വ്യക്തിനാമവും സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണവും മലയാള ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ച രീതിയിൽ നൽകുന്നു.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: എന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി
  rationale: נחלה സാധാരണ സ്വത്തിനെക്കാൾ പാരമ്പര്യമായി ലഭിച്ച കുടുംബഭൂമിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവകാശഭൂമി’ എന്നു വിവർത്തനം ചെയ്യുന്നു; אבות എന്ന പുരുഷലിംഗ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: തന്റെ കിടക്കയിൽ കിടന്ന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചുകൊണ്ട് കിടക്കയിൽ കിടന്ന പ്രവൃത്തി നേരിട്ട് നൽകുന്നു.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: മുഖം തിരിച്ചുകളഞ്ഞു
  rationale: വെറും ശാരീരിക തിരിവിനപ്പുറം പിണക്കത്തോടെയുള്ള പിൻവാങ്ങൽ സൂചിപ്പിക്കുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְלֹא אָכַל לָחֶם
  choice: അപ്പം കഴിക്കാനും വിസമ്മതിച്ചു
  rationale: לֶחֶם എന്നതിന്റെ അക്ഷരാർഥമായ ‘അപ്പം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മനപ്പൂർവമായ നിരസിക്കൽ ‘വിസമ്മതിച്ചു’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നാബോത്തിന്റെ വാക്കുകളിലെ പുരുഷലിംഗ പൂർവികഭാഷ
  choice: എന്റെ പിതാക്കന്മാരുടെ
  alternative: എന്റെ പൂർവികരുടെ
  rationale: എബ്രായത്തിലെ אֲבוֹתָי പുരുഷലിംഗ ബഹുവചനമാണ്; പിതൃപരമ്പരയിലൂടെ ലഭിച്ച ഭൂമിയെന്ന കുടുംബപരവും അവകാശപരവുമായ ഊന്നൽ മായാതിരിക്കാൻ ‘പിതാക്കന്മാർ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഉറവിടത്തിലെ ആവർത്തിച്ച ഉദ്ധരണി, വികാരപരമായ ഇരട്ടവിശേഷണം, പിതൃപരമ്പരയുടെ ഭാഷ, ‘അപ്പം’ എന്ന മൂർത്തപ്രയോഗം എന്നിവ നിലനിർത്തി; അപൂർവമോ അത്യന്തം പഴഞ്ചനോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
