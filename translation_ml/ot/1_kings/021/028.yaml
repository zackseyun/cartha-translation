id: 1KI.21.28
reference: 1 Kings 21:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേയുടെ വചനം തിശ്ബ്യനായ ഏലിയാവിന് വന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായി
  rationale: ദൈവിക അരുളപ്പാട് പ്രവാചകനിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം; ഹീബ്രുവിലെ സംഭവപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: דָּבָר എന്നത് ‘വാക്ക്’ എന്നും ‘സന്ദേശം’ എന്നും അർഥമാക്കാം; പ്രവാചകീയ വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ ‘അരുളപ്പാട്’ സ്വാഭാവികമായ മലയാളത്തിൽ ദൈവത്തിൽനിന്നുള്ള സന്ദേശത്തെ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל
  choice: ഏലിയാവിന്
  rationale: സ്വീകർത്താവിലേക്കുള്ള ദിശ മലയാളത്തിലെ ദത്തിവിഭക്തിയായ ‘-ന്’ മുഖേന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלִיָּהוּ
  choice: ഏലിയാവ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു; വിഭക്തിയോടെ ‘ഏലിയാവിന്’ എന്നു വരുന്നു.
- source_word: הַתִּשְׁבִּי
  choice: തിശ്ബ്യനായ
  rationale: ഏലിയാവിന്റെ ദേശബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണത്തെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘തിശ്ബേക്കാരനായ’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തേക്കാൾ മൂലത്തിലെ ജനനാമവിശേഷണത്തോട് അടുത്തതാണ്.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള ദൈവവചനം പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിക്കുന്നു; വേർതിരിച്ച ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പ്രയോഗത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ് / യാഹ്‌വേ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു ബിരുദമായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം നിലനിർത്തി. ‘യഹോവ’ ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ ലിപ്യന്തരണമാണ്; ഹീബ്രു ഉച്ചാരണത്തിന്റെ പുനർനിർമാണമായ ‘യാഹ്‌വേ’ മറ്റൊരു സാധ്യതയാണ്.
- issue: דְּבַר എന്നതിന്റെ പ്രവാചകീയ അർഥം
  choice: അരുളപ്പാട്
  alternative: വചനം / സന്ദേശം
  rationale: ഇവിടെ സാധാരണ സംസാരവാക്കല്ല, ദൈവത്തിൽനിന്ന് പ്രവാചകനിലേക്കു ലഭിക്കുന്ന വെളിപ്പാടാണ് ഉദ്ദേശ്യം. ‘അരുളപ്പാട്’ ഈ പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കുന്നു; അതേസമയം അടുത്ത വാക്യത്തിലെ ഉള്ളടക്കം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രവാചകീയ ശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ വെളിപ്പാട്-സൂത്രത്തിന്റെ അർഥം സൂക്ഷിച്ചു. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തിലേക്കുള്ള ബന്ധം ദ്വിബിന്ദുവിലൂടെ നിലനിർത്തി.
