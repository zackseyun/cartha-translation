  terminology: The divine name should follow the project’s stated rendering policy for יהוה, ‘Yahweh’; ‘യാഹ്‌വേ’ is the appropriate Malayalam transliteration. ‘വചനം’ preserves the lexical and formulaic force of דְבַר more faithfully than the interpretive ‘അരുളപ്പാട്.’ ‘തിശ്ബ്യനായ’ appropriately represents the gentilic.
