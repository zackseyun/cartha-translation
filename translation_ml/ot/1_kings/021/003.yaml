reference: 1 Kings 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר נָב֖וֹת אֶל אַחְאָ֑ב חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/תִּתִּ֛/י אֶת נַחֲלַ֥ת אֲבֹתַ֖/י לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: ml
  text: 'എന്നാൽ നാബോത്ത് ആഹാബിനോടു പറഞ്ഞു: “യഹോവ നിമിത്തം, എന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി അങ്ങേക്കു കൊടുക്കുന്നത് എനിക്കു ഒരിക്കലും പാടില്ല!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പ്രയോഗാത്മകമായി: “എന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി അങ്ങേക്കു കൊടുക്കാൻ യഹോവ അരുളിച്ചെയ്യാതിരിക്കട്ടെ.”'
    reason: חָלִילָה לִּי מֵיְהוָה എന്ന ശക്തമായ, യഹോവയോടു ബന്ധിപ്പിച്ച നിരാകരണപ്രയോഗത്തിന്റെ കൂടുതൽ പ്രയോഗാത്മകമായ മലയാള പരിഭാഷ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ ആഹാബിന്റെ നിർദേശത്തോടുള്ള ശക്തമായ എതിർപ്പായതിനാൽ ‘എന്നാൽ’ സന്ദർഭബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נָבוֹת אֶל־אַחְאָב
  choice: നാബോത്ത് ആഹാബിനോടു
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; אֶל അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആഹാബിനോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: യഹോവയെച്ചൊല്ലി ... എനിക്ക് അചിന്ത്യമാണ്
  rationale: ഈ പ്രയോഗം ദൈവനാമവുമായി ബന്ധപ്പെടുത്തിയ ശക്തമായ നിരാകരണമോ ശപഥസദൃശമായ പ്രഖ്യാപനമോ ആണ്. ‘അചിന്ത്യമാണ്’ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു; ‘യഹോവയെച്ചൊല്ലി’ מֵיְהוָהയുടെ ബന്ധവും ശപഥസദൃശ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു, അതിനെ വെറും ‘യഹോവ വിലക്കട്ടെ’ എന്നാക്കി ഒതുക്കുന്നില്ല.
- source_word: מִתִּתִּי
  choice: കൊടുക്കുന്നത്
  rationale: നിരാകരിക്കപ്പെടുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ ക്രിയാനാമരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: נַחֲלַת אֲבֹתַי
  choice: എന്റെ പിതാക്കന്മാരുടെ അവകാശഭൂമി
  rationale: נַחֲלָה ഇവിടെ തലമുറകളിലൂടെ ലഭിച്ച കുടുംബഭൂമിയെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ നിയമപരവും കുടുംബപരവുമായ അർഥം നിലനിർത്തുന്നു; אֲבֹתַיയുടെ പുരുഷലിംഗ ബഹുവചനം ‘പിതാക്കന്മാർ’ എന്നു സംരക്ഷിച്ചു.
- source_word: לָךְ
  choice: അങ്ങേക്കു
  rationale: രാജാവിനോടുള്ള അഭിസംബോധനയിൽ മാന്യമായ ഏകവചനരൂപം സ്വാഭാവികമാണ്; ഹീബ്രായ ദാതൃകാർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: חָלִילָה לִּי מֵיְהוָה എന്ന പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം
  choice: യഹോവയെച്ചൊല്ലി ... എനിക്ക് അചിന്ത്യമാണ്
  alternative: യഹോവ ഇടവരുത്താതിരിക്കട്ടെ
  rationale: മൂലത്തിലെ ശക്തമായ നിരാകരണവും ദൈവനാമത്തോടുള്ള ബന്ധവും സംരക്ഷിച്ചു. ദൈവം നേരിട്ട് വിലക്കുന്നുവെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, കൂടുതൽ പ്രയോഗാത്മകമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രാജാവിനോടുള്ള പ്രസംഗത്തിൽ ‘അങ്ങേക്കു’ എന്ന മാന്യരൂപം ഉപയോഗിച്ചു; പുരാതന കുടുംബഭൂമിയുടെ ആശയം വ്യക്തമാക്കാൻ ‘അവകാശഭൂമി’ തിരഞ്ഞെടുത്തു.
