base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: ml
  text: 'ആഹാബ് നാബോത്തിനോടു പറഞ്ഞു: “നിന്റെ മുന്തിരിത്തോട്ടം എനിക്കു തരിക. അത് എന്റെ വീടിനടുത്തായതിനാൽ, എനിക്കൊരു പച്ചക്കറിത്തോട്ടമായിരിക്കേണ്ടതിന്. അതിനു പകരം അതിനെക്കാൾ നല്ലൊരു മുന്തിരിത്തോട്ടം ഞാൻ നിനക്കു തരാം. അല്ലെങ്കിൽ, നിനക്കു നല്ലതെന്നു തോന്നുന്നെങ്കിൽ[a], അതിന്റെ വില വെള്ളിയിൽ ഞാൻ നിനക്കു തരാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ പദശഃ: “അത് നിന്റെ കണ്ണിൽ നല്ലതാണെങ്കിൽ”; “നിനക്കു സമ്മതമെങ്കിൽ” അല്ലെങ്കിൽ “നിനക്കു സ്വീകാര്യമെങ്കിൽ” എന്നർഥമുള്ള പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל ... לֵאמֹר
  choice: '...നോടു പറഞ്ഞു'
  rationale: സംസാരിച്ച് അഭിസംബോധന ചെയ്യുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു; സംസാരത്തിന്റെ ഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: תְּנָה לִּי
  choice: എനിക്കു തരിക
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അഭ്യർഥന നിലനിർത്തുന്ന വ്യക്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: כַּרְמְךָ
  choice: നിന്റെ മുന്തിരിത്തോട്ടം
  rationale: כֶּרֶם എന്ന പദത്തിന്റെ സാധാരണവും കൃത്യവുമായ മലയാള സമാനപദം.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: എനിക്ക് ഒരു പച്ചക്കറിത്തോട്ടമാക്കാം
  rationale: ആഹാബിന്റെ ഉദ്ദേശ്യവും ഫലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; יָרָק എന്നത് ഭക്ഷ്യയോഗ്യമായ പച്ചച്ചെടികളെയോ പച്ചക്കറികളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: അത് എന്റെ വീടിനടുത്തായതിനാൽ
  rationale: സ്ഥലസാമീപ്യവും അതാണ് അഭ്യർഥനയുടെ കാരണമെന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: അതിനു പകരം ... ഞാൻ നിനക്കു തരാം
  rationale: תַּחְתָּיו സൂചിപ്പിക്കുന്ന പകരംവെക്കൽ അഥവാ കൈമാറ്റം വ്യക്തമായി നൽകുന്നു.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: അതിനെക്കാൾ നല്ലൊരു മുന്തിരിത്തോട്ടം
  rationale: מן ചേർന്നുള്ള താരതമ്യാർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: നിനക്കു നല്ലതെന്നു തോന്നുന്നെങ്കിൽ
  rationale: ‘നിന്റെ കണ്ണിൽ നല്ലത്’ എന്ന എബ്രായ ശൈലിയുടെ സമ്മതം/അംഗീകാരം സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: כֶּסֶף מְחִיר זֶה
  choice: അതിന്റെ വില വെള്ളിയായി
  rationale: വസ്തുവിന്റെ വില വെള്ളിയിൽ നൽകുമെന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വെള്ളി’ ഇവിടെ പണമൂല്യമുള്ള ലോഹത്തെ സൂചിപ്പിക്കുന്നു.
