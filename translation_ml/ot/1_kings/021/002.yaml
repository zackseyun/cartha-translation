translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ നേരിട്ടുള്ള അഭ്യർഥനയും കൈമാറ്റം അല്ലെങ്കിൽ വില നൽകൽ എന്ന രണ്ടു നിർദേശങ്ങളും പ്രത്യേകം നിലനിർത്തിയിരിക്കുന്നു.
