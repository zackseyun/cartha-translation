translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു. എബ്രായത്തിലെ ഉടമസ്ഥതാ ഘടന സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം വായനാസൗകര്യത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
