source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: ml
  text: ഈ സംഭവങ്ങൾക്കുശേഷം, യിസ്രെയേല്യനായ നാബോത്തിന് യിസ്രെയേലിൽ, ശമര്യാരാജാവായ ആഹാബിന്റെ കൊട്ടാരത്തിനരികെ ഒരു മുന്തിരിത്തോട്ടം ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യിസ്രെയേല്യനായ നാബോത്തിന്റേതായി ഒരു മുന്തിരിത്തോട്ടം ഉണ്ടായിരുന്നു.” എബ്രായത്തിൽ ഉടമസ്ഥത അക്ഷരാർഥത്തിൽ “നാബോത്തിന് ... ഉണ്ടായിരുന്നു” എന്ന ഘടനയിലാണ് പ്രകടിപ്പിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: സംഭവങ്ങൾക്കുശേഷം എന്ന കാലസൂചനയിലൂടെ ആഖ്യാനത്തിന്റെ തുടർച്ച പ്രകടമാക്കി
  rationale: ഇത് പുതിയൊരു ആഖ്യാനഘട്ടം ആരംഭിക്കുന്ന രൂപമാണ്. മലയാളത്തിൽ വേറൊരു ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ‘സംഭവിച്ചു’ ചേർക്കാതെ തുടർന്നുള്ള കാലവാക്യത്തിൽ അതിന്റെ വ്യവഹാരധർമ്മം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ഈ സംഭവങ്ങൾക്കുശേഷം
  rationale: എബ്രായത്തിലെ ബഹുവചന കാലാന്തരസൂത്രത്തെ അർഥസഹജവും ആധുനികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כֶּרֶם
  choice: മുന്തിരിത്തോട്ടം
  rationale: ഈ പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം.
- source_word: הָיָה לְנָבוֹת
  choice: നാബോത്തിന് ... ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ അസ്തിത്വ-ഉടമസ്ഥതാ നിർമാണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ദത്തിവ് ഉടമസ്ഥതാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സ്വന്തമായിരുന്നു’ എന്നതിലധികം മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ
  rationale: നാബോത്തിന്റെ ദേശബന്ധമോ സ്വദേശപരമായ തിരിച്ചറിയലോ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: യിസ്രെയേലിൽ
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ ചുരുക്കി മുന്തിരിത്തോട്ടത്തിന്റെ സ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֵצֶל
  choice: അരികെ
  rationale: സമീപസ്ഥിതിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: הֵיכַל
  choice: കൊട്ടാരം
  rationale: രാജകീയ സന്ദർഭത്തിൽ ഇത് ദേവാലയത്തെയല്ല, രാജവസതിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: ശമര്യാരാജാവായ
  rationale: ആഹാബിന്റെ രാജകീയ അധികാരപരിധിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള വിശേഷണരൂപത്തിൽ നൽകുന്നു.
