reference: 1 Kings 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: ml
  text: നീ എന്നെ പ്രകോപിപ്പിക്കുകയും ഇസ്രായേലിനെ പാപം ചെയ്യിപ്പിക്കുകയും ചെയ്തതിനാൽ, ഞാൻ നിന്റെ ഭവനത്തെ[a] നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ ഭവനംപോലെയും അഹീയാവിന്റെ മകനായ ബയെശായുടെ ഭവനംപോലെയും ആക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജവംശത്തെ.’ ഇവിടെ ‘ഭവനം’ എന്നത് അഹാബിന്റെ രാജപരമ്പരയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ഞാൻ ... ആക്കും
  rationale: נתן എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘കൊടുക്കുക’ എന്നാണെങ്കിലും, നശിപ്പിക്കപ്പെട്ട മുൻ രാജവംശങ്ങളോടുള്ള ഈ താരതമ്യവിധിവാക്യത്തിൽ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന ‘ആക്കും’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בֵּיתְךָ
  choice: നിന്റെ ഭവനത്തെ
  rationale: בַּיִת എന്നത് വീട്, കുടുംബം, രാജവംശം എന്നിവ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘ഭവനം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും ഇവിടെ രാജപരമ്പരയാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כְּבֵית ... וּכְבֵית
  choice: '... ഭവനംപോലെയും ... ഭവനംപോലെയും'
  rationale: כְ എന്ന താരതമ്യഘടകം മലയാളത്തിൽ സ്വാഭാവികമായി ‘പോലെ’ എന്നു നൽകി; സമാന്തരഘടനയും നിലനിർത്തി.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമസൂത്രം സ്വാഭാവിക മലയാളക്രമത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: അഹീയാവിന്റെ മകനായ ബയെശ
  rationale: പേരുകൾ ലിപ്യന്തരണം ചെയ്ത് പിതൃനാമബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: നീ എന്നെ പ്രകോപിപ്പിക്കുകയും ... ചെയ്തതിനാൽ
  rationale: ഈ ഘടന വിധിയുടെ കാരണം അവതരിപ്പിക്കുന്നു; כעס-ന്റെ ഹിഫീൽ രൂപം ‘കോപിപ്പിക്കുക/പ്രകോപിപ്പിക്കുക’ എന്നാണ്. ദൈവിക വക്താവായ യഹോവയാണ് പരോക്ഷ കർമമെന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ‘എന്നെ’ ചേർത്തു.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിക്കുകയും
  rationale: חטא-യുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർത്ഥം വ്യക്തമായി സംരക്ഷിക്കുന്നു; അഹാബ് ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ചുവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘പ്രകോപിപ്പിച്ചു’ എന്ന ക്രിയയുടെ പരോക്ഷ ദൈവിക കർമം
  choice: ‘എന്നെ’ എന്നു വ്യക്തമായി ചേർക്കുക
  alternative: കർമം വ്യക്തമാക്കാതെ ‘പ്രകോപിപ്പിച്ചു’ എന്നു മാത്രം നൽകുക
  rationale: എബ്രായത്തിൽ കർമം പ്രത്യക്ഷമായി ഇല്ലെങ്കിലും സംസാരിക്കുന്നത് യഹോവയാണ്; സന്ദർഭം വ്യക്തമായി സൂചിപ്പിക്കുന്ന കർമം ചേർക്കുന്നത് അർഥം പരിഹരിച്ചുമാറ്റാതെ മലയാളത്തിലെ വ്യക്തത ഉറപ്പാക്കുന്നു.
- issue: രാജകീയ വിധിവാക്യത്തിലെ בֵּית
  choice: മുഖ്യപാഠത്തിൽ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘രാജവംശം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  rationale: ‘ഭവനം’ എബ്രായത്തിലെ സാഹിത്യരൂപകവും രാജപരമ്പരയോടുള്ള വിധിയുടെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ഉദ്ദേശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. രാജകീയ ‘ഭവനം’ എന്ന ഉറവിടരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾക്ക് സമീപമായി ലിപ്യന്തരണം ചെയ്തു.
