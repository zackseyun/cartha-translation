source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: ml
  text: 'നീ അവനോടു സംസാരിച്ച് ഇങ്ങനെ പറയണം: ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നീ കൊലപാതകം ചെയ്യുകയും കൈവശപ്പെടുത്തുകയും ചെയ്തോ?’ പിന്നെയും നീ അവനോടു സംസാരിച്ച് ഇങ്ങനെ പറയണം: ‘യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: നാബോത്തിന്റെ രക്തം നായ്ക്കൾ നക്കിയ സ്ഥലത്ത് നായ്ക്കൾ നിന്റെ രക്തവും നക്കും—അതെ, നിന്റേതും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: നീ അവനോടു സംസാരിച്ച് ഇങ്ങനെ പറയണം
  rationale: പ്രവാചകദൗത്യത്തിന്റെ ഔപചാരിക നിർദേശശൈലിയും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു; അതേസമയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כֹּה אָמַר יְהוָה
  choice: യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ സ്ഥിരമായ ദൂതസൂത്രം നിലനിർത്തുകയും ദൈവനാമമായ יהוה എന്നത് ‘യഹോവ’യായി നേരിട്ട് നൽകുകയും ചെയ്യുന്നു.
- source_word: הֲרָצַחְתָּ
  choice: നീ കൊലചെയ്യുകയും
  rationale: רצח എന്ന പദത്തിന്റെ നിയമവിരുദ്ധവും കുറ്റകരവുമായ കൊലയുടെ ശക്തി ‘കൊലചെയ്യുക’ വ്യക്തമാക്കുന്നു; പൊതുവായ ‘കൊല്ലുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: וְגַם יָרָשְׁתָּ
  choice: അതും കൈവശമാക്കുകയും ചെയ്തോ
  rationale: ירש എന്നതിന്റെ കൈവശപ്പെടുത്തുക/സ്വന്തമാക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു. മുന്തിരിത്തോട്ടം എന്നു വാക്യത്തിൽ ചേർക്കാതെ ‘അത്’ ഉപയോഗിച്ച് മൂലത്തിലെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: സ്ഥലത്ത്
  rationale: സ്ഥലസൂചകമായ എബ്രായ ഘടനയെ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: നക്കിയ ... നക്കും
  rationale: ഭൂതകാലത്തും ഭാവികാലത്തും ഒരേ ക്രിയ ആവർത്തിക്കുന്ന മൂലപാഠത്തിന്റെ ഭീകരമായ വാചകപ്രഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: നിന്റെ രക്തവും നക്കും—നിന്റേതുതന്നെ
  rationale: גם אתה എന്ന അവസാനത്തെ ഊന്നൽ മിനുസപ്പെടുത്തി ഇല്ലാതാക്കാതെ, അഹാബിനോടുള്ള വ്യക്തിപരമായ വിധിപ്രഖ്യാപനമായി മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: הֲרָצַחְתָּ എന്ന ആരോപണത്തിന്റെ ധാർമ്മികവും നിയമപരവുമായ ശക്തി
  choice: ‘കൊലചെയ്യുകയും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊല്ലുകയും’
  rationale: רצח സാധാരണ കൊലയെ മാത്രമല്ല, കുറ്റകരമായ മനുഷ്യഹത്യയെ സൂചിപ്പിക്കുന്നു. നാബോത്തിന്റെ മരണത്തിൽ അഹാബിനുള്ള ഉത്തരവാദിത്വത്തെ പ്രവാചകൻ കുറ്റാരോപണമായി ഉന്നയിക്കുന്ന ശക്തി ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: גם אתה എന്ന അവസാന ഊന്നൽ
  choice: ‘നിന്റേതുതന്നെ’ എന്ന വിച്ഛിന്നമായ ഊന്നൽ നിലനിർത്തി.
  alternative: ‘നിന്റെ രക്തവും’ എന്നതിൽ മാത്രം ആശയം ലയിപ്പിക്കുക
  rationale: മൂലപാഠം അഹാബിനെ വ്യക്തിപരമായി ചൂണ്ടിക്കാട്ടി അവസാനിക്കുന്നു. അതിനാൽ വിധിയുടെ വ്യക്തിപരമായ പ്രയോഗവും വാചകത്തിലെ പെട്ടെന്നുള്ള ഊന്നലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രവാചകശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചിരിക്കുന്ന ദൂതസൂത്രം ചുരുക്കാതെ നിലനിർത്തി; അനാവശ്യമായ പഴയകാല പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് ദൈവിക പ്രഖ്യാപനത്തിന് യോജിച്ച മാന്യമായ പൊതുവായ ബൈബിൾ രജിസ്റ്റർ നൽകുന്നു.
