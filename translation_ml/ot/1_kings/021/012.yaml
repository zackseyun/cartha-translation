source:
  edition: WLC
  text: קָרְא֖וּ צ֑וֹם וְ/הֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/012.yaml
  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: ml
  text: അവർ ഒരു ഉപവാസം പ്രഖ്യാപിച്ച് നാബോത്തിനെ ജനത്തിന്റെ മുമ്പന്തിയിൽ[a] ഇരുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനത്തിന്റെ മുമ്പിൽ’ അല്ലെങ്കിൽ ‘ജനത്തിനിടയിലെ ഏറ്റവും പ്രധാനപ്പെട്ട സ്ഥാനത്ത്.’ എബ്രായ പ്രയോഗത്തിന്റെ പദാനുപദ അർഥം ‘ജനത്തിന്റെ തലയിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: പ്രഖ്യാപിച്ച്
  rationale: צוֹם എന്ന പദത്തോടൊപ്പം קרא ഒരു പൊതുവായ ഔദ്യോഗിക ആഹ്വാനം പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഉപവാസം പ്രഖ്യാപിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: צוֹם
  choice: ഒരു ഉപവാസം
  rationale: ഔപചാരികമായി പൊതുജനം ആചരിക്കേണ്ട ഉപവാസത്തെയാണ് നാമപദം സൂചിപ്പിക്കുന്നത്; ‘ഒരു ഉപവാസം’ അതിന്റെ സ്ഥാപനപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: וְהֹשִׁיבוּ
  choice: ഇരുത്തി
  rationale: ישב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ ഇരിക്കാൻ ഇടയാക്കുക, അഥവാ നിശ്ചിത സ്ഥാനത്ത് ഇരുത്തുക, എന്നാണ്.
- source_word: אֶת נָבוֹת
  choice: നാബോത്തിനെ
  rationale: אֶת നാബോത്തിനെ നിർദിഷ്ട കർമമായി അടയാളപ്പെടുത്തുന്നു; പേര് മലയാളത്തിൽ ‘നാബോത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּרֹאשׁ
  choice: മുമ്പന്തിയിൽ
  rationale: പദാനുപദമായി ‘തലയിൽ/മുൻസ്ഥാനത്ത്’ എന്നർഥം. പൊതുയോഗത്തിന്റെ പ്രമുഖമായ മുൻസ്ഥാനത്തെ ‘മുമ്പന്തിയിൽ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘ജനത്തിന്റെ മുമ്പിൽ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם
  choice: ജനത്തിന്റെ
  rationale: עם അടിസ്ഥാനമായി ‘ജനം’ എന്നാണ്; ഇവിടെ കൂടിവന്ന ജനസമൂഹത്തെയോ പൊതുസഭയെയോ സൂചിപ്പിക്കുന്നു.
