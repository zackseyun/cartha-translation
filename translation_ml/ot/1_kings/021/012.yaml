translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ പൊതുപ്രഖ്യാപനവും നാബോത്തിനെ പ്രമുഖ സ്ഥാനത്ത് ഇരുത്തിയതുമായ ദൃശ്യഭാവം നിലനിർത്തി; സ്ഥലസൂചനയിലെ യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
