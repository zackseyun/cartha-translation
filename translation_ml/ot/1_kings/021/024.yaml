  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: ml
  text: അഹാബിന്റെ വീട്ടിൽപ്പെട്ടവരിൽ പട്ടണത്തിൽ മരിക്കുന്നവനെ നായ്ക്കൾ തിന്നും; വയലിൽ മരിക്കുന്നവനെ ആകാശത്തിലെ പക്ഷികൾ തിന്നും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: അഹാബിന്റെ ആളുകളിൽ ... മരിക്കുന്നവനെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പങ്കാളിത്തരൂപം ഇവിടെ പൊതുവായ അർഥത്തിലാണ്; לְאַחְאָב ബന്ധം അഥവാ അഹാബിന്റെ ഭവനത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രീതിയിൽ ഇതു പ്രകടിപ്പിക്കുന്നു.
- source_word: בָּעִיר
  choice: പട്ടണത്തിൽ
  rationale: സ്ഥലസൂചകമായ നേരിട്ടുള്ള വിവർത്തനം; തുടർന്നുള്ള ‘വയലിൽ’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: നായ്ക്കൾ തിന്നും
  rationale: אכל എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘തിന്നുക’ നിലനിർത്തുകയും അപമാനകരമായ മരണാനന്തര വിധിയുടെ കഠിനത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: വയലിൽ മരിക്കുന്നവനെ
  rationale: ആദ്യ ഉപവാക്യത്തിലെ പൊതുവായ പങ്കാളിത്തപ്രയോഗത്തിന് സമാന്തരമായ വിവർത്തനം; നഗരം/വയൽ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വിവർത്തനം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഹീബ്രായ സമാന്തരഘടനയും പട്ടണം/വയൽ വൈരുധ്യവും പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
