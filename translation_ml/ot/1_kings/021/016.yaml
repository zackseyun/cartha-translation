id: 1KI.21.16
reference: 1 Kings 21:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: ml
  text: നാബോത്ത് മരിച്ചെന്നു[a] ആഹാബ് കേട്ടപ്പോൾ, യിസ്രെയേല്യനായ നാബോത്തിന്റെ മുന്തിരിത്തോട്ടം കൈവശമാക്കാൻ[b] ആഹാബ് എഴുന്നേറ്റ് അങ്ങോട്ടു ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരിച്ചുപോയെന്നു’ / ‘മരിച്ച നിലയിലാണെന്നു.’ എബ്രായപദം പൂർത്തിയായ മരണസംഭവത്തെയോ അതിന്റെ ഫലമായ അവസ്ഥയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതു കൈവശം വയ്ക്കാൻ’ അല്ലെങ്കിൽ ‘അതു അവകാശമാക്കാൻ.’ എബ്രായക്രിയയ്ക്ക് സന്ദർഭാനുസരണം കൈവശപ്പെടുത്തുക, കൈവശം വയ്ക്കുക, അവകാശമായി നേടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: היה സഹിതമുള്ള ഈ വാക്യഘടന ആഖ്യാനത്തിലെ കാലബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കേട്ടപ്പോൾ’ സ്വാഭാവികമായി അതു പകരുന്നു; ‘ഉടനെ’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כִּי מֵת נָבוֹת
  choice: നാബോത്ത് മരിച്ചെന്നു
  rationale: כִּי ഇവിടെ കേട്ട വാർത്തയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. מֵת പൂർത്തിയായ മരണസംഭവത്തെയോ അതിന്റെ ഫലസ്ഥിതിയെയോ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ഈ പ്രയോഗം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്, വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום ആഖ്യാനത്തിൽ തുടർന്നുള്ള നിർണായക പ്രവർത്തനത്തിന് ഒരുങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റ്’ ഔപചാരികതയും സ്വാഭാവികതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: לָרֶדֶת אֶל
  choice: അങ്ങോട്ടു ഇറങ്ങിച്ചെന്നു
  rationale: ירד എന്നതിലെ താഴോട്ടുള്ള ദിശാസൂചന നിലനിർത്തുകയും אֶל സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כֶּרֶם
  choice: മുന്തിരിത്തോട്ടം
  rationale: മുന്തിരിവള്ളി കൃഷിചെയ്യുന്ന തോട്ടം എന്ന സാധാരണ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הַיִּזְרְעֵאלִי
  choice: യിസ്രെയേല്യനായ
  rationale: നാബോത്തിന്റെ ദേശബന്ധമോ നിവാസബന്ധമോ സൂചിപ്പിക്കുന്ന ജാതിവാചക വിശേഷണം നേരിട്ട് പകരുന്നു.
- source_word: לְרִשְׁתּוֹ
  choice: കൈവശമാക്കാൻ
  rationale: ירשׁ എന്ന ക്രിയയ്ക്ക് കൈവശപ്പെടുത്തുക, കൈവശം വയ്ക്കുക, അവകാശമായി ലഭിക്കുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം. ഇവിടെ തോട്ടത്തിന്റെ നിയന്ത്രണം ഏറ്റെടുക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കാൻ ‘കൈവശമാക്കാൻ’ യോജിക്കുന്നു; ക്രിയയിൽ തന്നെയില്ലാത്ത ബലപ്രയോഗഭാവം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ദിശാസൂചനയും ירשׁ എന്ന ക്രിയയുടെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്; അനീതിയുടെ പശ്ചാത്തലം നിലനിൽക്കുമ്പോഴും ക്രിയയ്ക്ക് സ്വതവേ ഇല്ലാത്ത ‘പിടിച്ചെടുക്കുക’ എന്ന ശക്തമായ ഭാവം പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
