source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: ml
  text: 'ആഹാബ് ഏലിയാവിനോട് പറഞ്ഞു: “എന്റെ ശത്രുവേ, നീ എന്നെ കണ്ടെത്തിയോ?” ഏലിയാവ് പറഞ്ഞു: “ഞാൻ നിന്നെ കണ്ടെത്തിയിരിക്കുന്നു. യാഹ്‌വെയുടെ[a] ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്യാൻ നീ നിന്നെത്തന്നെ വിറ്റുകളഞ്ഞതുകൊണ്ടാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH.’ ദൈവനാമത്തിന്റെ കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണ്; ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും നൽകിയിട്ടുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: നീ എന്നെ കണ്ടെത്തിയോ?
  rationale: מצא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ചോദ്യരൂപവും ഏറ്റുമുട്ടലിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹיְבִי
  choice: എന്റെ ശത്രുവേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തോടുകൂടിയ നാമത്തിന്റെ സംബോധനസ്വഭാവം മലയാളത്തിലെ ‘-വേ’ രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: מָצָאתִי
  choice: ഞാൻ നിന്നെ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: മുൻചോദ്യത്തിലെ מצא എന്ന അതേ ക്രിയ ആവർത്തിച്ച് സംഭാഷണത്തിലെ വാക്കുകളുടെ പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
- source_word: יַעַן
  choice: …തുകൊണ്ടാണ്
  rationale: ഏലിയാവിന്റെ പ്രസ്താവനയ്ക്കുള്ള കാരണം വ്യക്തമാക്കുന്ന ഹീബ്രു കാരണസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הִתְמַכֶּרְךָ
  choice: നീ നിന്നെത്തന്നെ വിറ്റുകളഞ്ഞു
  rationale: מכר എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിലുള്ള ആത്മനിർദ്ദേശകമായ ‘സ്വയം വിൽക്കുക’ എന്ന ശക്തമായ രൂപകം പരന്നുപോകാതെ സംരക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മയായതു ചെയ്യാൻ
  rationale: തിന്മ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ‘കണ്ണുകളിൽ’ എന്ന പ്രയോഗത്തിന്റെ ആശയവും ഭാഗികമായ ദൃശ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു; ഉച്ചാരണത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: הִתְמַכֶּרְךָ എന്ന സ്വയംവിൽപ്പനയുടെ രൂപകം
  choice: നീ നിന്നെത്തന്നെ വിറ്റുകളഞ്ഞു
  alternative: നീ നിന്നെത്തന്നെ ഏല്പിച്ചുകൊടുത്തു
  rationale: തിന്മയോടുള്ള ആഹാബിന്റെ മനഃപൂർവമായ സമർപ്പണത്തെക്കുറിച്ചുള്ള ശക്തമായ രൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ കടുപ്പവും മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘എന്റെ ശത്രുവേ’ എന്ന സംബോധനത്തിൽ ഹീബ്രുവിലെ വൈരഭാവം നിലനിർത്തി. ‘കണ്ടെത്തുക’ എന്ന ക്രിയ രണ്ടിടത്തും ആവർത്തിച്ച് മൂലത്തിലെ പദപ്രതിധ്വനി സംരക്ഷിച്ചു.
