  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: ml
  text: തീർച്ചയായും, യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്യാൻ തന്നെത്തന്നെ വിറ്റുകളഞ്ഞ ആഹാബിനെപ്പോലെ മറ്റാരും ഉണ്ടായിരുന്നില്ല; അവന്റെ ഭാര്യയായ ഈസേബെൽ അവനെ പ്രേരിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: മറ്റാരും ഉണ്ടായിരുന്നില്ല
  rationale: വാക്യത്തിന്റെ ഊന്നൽ ആഹാബിന്റെ സമാനതയില്ലാത്ത ദുഷ്ടതയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; മലയാളത്തിൽ വേറൊരു ഊന്നൽപദം ചേർക്കാതെ ഈ നിർമാണം ശക്തമായ പ്രസ്താവന നൽകുന്നു.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: ആഹാബിനെപ്പോലെ മറ്റാരും ഉണ്ടായിരുന്നില്ല
  rationale: താരതമ്യത്തിൽ ആഹാബിനു തുല്യനായ ആരുമില്ലായിരുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִתְמַכֵּר
  choice: തന്നെത്തന്നെ വിറ്റുകളഞ്ഞ
  rationale: ഹിത്പയേൽ രൂപത്തിലെ രൂപകാത്മകമായ ‘സ്വയം വിറ്റു’ എന്ന ശക്തമായ ദൃശ്യഭാവം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: לַעֲשׂוֹת הָרַע
  choice: തിന്മ ചെയ്യാൻ
  rationale: തിന്മ പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന അവ്യയപ്രയോഗം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിലെ പതിവായ ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാള ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: הֵסַתָּה
  choice: പ്രേരിപ്പിച്ചു
  rationale: ദോഷത്തിലേക്കു തള്ളിവിടുകയോ ഉത്തേജിപ്പിക്കുകയോ ചെയ്യുന്ന ഹിഫീൽ ക്രിയയുടെ പ്രതികൂല സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യയായ ഈസേബെൽ അവനെ അതിനു പ്രേരിപ്പിച്ചു
  rationale: ബന്ധവാക്യം ആഹാബിനെ വിശേഷിപ്പിക്കുന്നതായിത്തന്നെ നിലനിർത്തുന്നു; ‘അതിനു’ എന്നത് മുൻപറഞ്ഞ തിന്മ ചെയ്യുന്നതിലേക്കുള്ള പ്രേരണ വ്യക്തമാക്കുന്നു, എന്നാൽ കാരണം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തി, അതിനെ ഒരു പദവിയായി മാറ്റുന്നില്ല.
- issue: ഈസേബെലിന്റെ പ്രേരണയും ആഹാബിന്റെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: ബന്ധവാക്യമായി അവതരിപ്പിച്ചു
  alternative: ‘കാരണം’ ചേർത്ത് വ്യക്തമായ കാരണവാക്യമാക്കുക
  rationale: אֲשֶׁר എന്നത് ഇവിടെ ആഹാബിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യമായി വായിക്കാം; വ്യക്തമായ കാരണസൂചകം ചേർക്കാതെ മൂലത്തിലെ സാധ്യതയുള്ള ബന്ധാർഥവും നൈതിക സംഘർഷവും സൂക്ഷിക്കുന്നു. ആഹാബ് തന്നെത്തന്നെ വിറ്റുവെന്ന ഉത്തരവാദിത്വവും ഈസേബെൽ പ്രേരിപ്പിച്ചുവെന്ന സ്വാധീനവും ഒരുമിച്ച് നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തന്നെത്തന്നെ വിറ്റുകളഞ്ഞ’ എന്ന മൂലരൂപകം മനപ്പൂർവം സംരക്ഷിച്ചു; ‘ഈസേബെൽ’ എന്നത് മലയാളത്തിൽ പരിചിതമായ ബൈബിൾ നാമരൂപമാണ്.
