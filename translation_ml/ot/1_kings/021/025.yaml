- from: യഹ്‌വെയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്യാൻ തന്നെത്തന്നെ വിറ്റുകളഞ്ഞ ആഹാബിനെപ്പോലെ മറ്റാരും ഉണ്ടായിരുന്നില്ല; അവന്റെ ഭാര്യയായ ഈസേബെൽ അവനെ അതിനു പ്രേരിപ്പിച്ചു.
