id: 1KI.11.21
reference: 1 Kings 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/הֲדַ֞ד שָׁמַ֣ע בְּ/מִצְרַ֗יִם כִּֽי שָׁכַ֤ב דָּוִד֙ עִם אֲבֹתָ֔י/ו וְ/כִי מֵ֖ת יוֹאָ֣ב שַֽׂר הַ/צָּבָ֑א וַ/יֹּ֤אמֶר הֲדַד֙ אֶל פַּרְעֹ֔ה שַׁלְּחֵ֖/נִי וְ/אֵלֵ֥ךְ אֶל אַרְצִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: ml
  text: 'ഹദദ് മിസ്രയീമിൽവെച്ച്, ദാവീദ് തന്റെ പിതാക്കന്മാരോടൊപ്പം ശയിച്ചെന്നും[a] സൈന്യാധിപനായ യോവാബ് മരിച്ചെന്നും കേട്ടപ്പോൾ, ഫറവോനോട്: “എന്നെ പോകാൻ അനുവദിക്കണമേ;[b] ഞാൻ എന്റെ സ്വന്തം ദേശത്തേക്കു പോകട്ടെ” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തന്റെ പിതാക്കന്മാരോടൊപ്പം കിടന്നു”; മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്നെ അയയ്ക്കണമേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: വാർത്ത അറിഞ്ഞത് എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി ഉൾക്കൊള്ളുമ്പോഴും, എബ്രായ ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം ശയിച്ചു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘മരിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് അതിനെ പരത്തുന്നില്ല. അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵת
  choice: മരിച്ചു
  rationale: യോവാബ് മരിച്ച നിലയിലായിരുന്നു എന്ന എബ്രായ പൂർണക്രിയയുടെ ഫലാവസ്ഥയെ മലയാളത്തിലെ സന്ദർഭസഹജമായ രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שַׂר הַצָּבָא
  choice: സൈന്യാധിപൻ
  rationale: സൈന്യത്തിന്റെ പ്രധാന കമാൻഡറെ സൂചിപ്പിക്കുന്ന, വ്യക്തവും ആധുനികവുമായ മലയാള പദം.
- source_word: שַׁלְּחֵנִי
  choice: എന്നെ പോകാൻ അനുവദിക്കണമേ
  rationale: ഫറവോന്റെ സന്നിധിയിൽനിന്ന് വിട്ടയയ്ക്കണമെന്ന അപേക്ഷ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ‘എന്നെ അയയ്ക്കണമേ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וְאֵלֵךְ
  choice: ഞാൻ ... പോകട്ടെ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ഇച്ഛാ/ഉദ്ദേശ്യഭാവം മലയാളത്തിലെ ‘പോകട്ടെ’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְצִי
  choice: എന്റെ സ്വന്തം ദേശം
  rationale: ‘ദേശം’ എബ്രായ אֶרֶץ എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥമാണ്; ‘സ്വന്തം’ എന്നത് ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയവും സ്വദേശത്തേക്കുള്ള മടക്കവും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മരണത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥതലവും സംരക്ഷിച്ചു; രാജസദസ്സിലെ അപേക്ഷയ്ക്ക് മാന്യമായ ‘ണമേ’ രൂപം ഉപയോഗിച്ചു.
