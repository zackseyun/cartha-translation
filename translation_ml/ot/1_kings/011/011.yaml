  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘നിന്റെ കാര്യത്തിൽ ഇതു ഉണ്ടായിരുന്നതിനാലും’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും ഈ നിയമവിധിപ്രഖ്യാപനത്തിന്റെ ശൈലിക്ക് യോജിക്കുന്നു; അതു അനാവശ്യ വ്യാഖ്യാനവും ഒഴിവാക്കുന്നു.
  terminology: ‘യഹ്‌വെ,’ ‘ഉടമ്പടി,’ ‘ചട്ടങ്ങൾ,’ ‘രാജ്യം,’ ‘ദാസൻ’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. ‘ദാസൻ’ ഇവിടെ രാജാവിന്റെ കീഴാളൻ എന്ന സന്ദർഭാർഥം വഹിക്കാനാകും. ‘കൽപ്പിച്ച’ എന്ന സാധാരണ ആധുനിക അക്ഷരരൂപം ഉപയോഗിച്ചിട്ടുണ്ട്.
