  revised_text: 'അപ്പോൾ യഹ്‌വെ ശലോമോനോടു പറഞ്ഞു: “ഇതു നിന്റെ കാര്യത്തിൽ ഉണ്ടായിരുന്നതിനാലും[a] ഞാൻ നിന്നോടു കൽപ്പിച്ച എന്റെ ഉടമ്പടിയും ചട്ടങ്ങളും നീ പാലിക്കാതിരുന്നതിനാലും, ഞാൻ രാജ്യം തീർച്ചയായും നിന്നിൽനിന്ന് പറിച്ചെടുത്ത് നിന്റെ ദാസനു കൊടുക്കും.”'
