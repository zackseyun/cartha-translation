id: 1KI.11.11
reference: 1 Kings 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ ശലോമോനോടു പറഞ്ഞു: “ഇതു നിന്റെ കാര്യത്തിൽ ഉണ്ടായിരുന്നതിനാലും[a] ഞാൻ നിന്നോടു കൽപ്പിച്ച എന്റെ ഉടമ്പടിയും ചട്ടങ്ങളും നീ പാലിക്കാതിരുന്നതിനാലും, ഞാൻ രാജ്യം തീർച്ചയായും നിന്നിൽനിന്ന് പറിച്ചെടുത്ത് നിന്റെ ദാസനു കൊടുക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഇത് നിന്നോടുകൂടെ ഉണ്ടായിരുന്നതിനാലും.” എബ്രായപ്രയോഗം സംക്ഷിപ്തമാണ്; ശലോമോന്റെ സ്ഥിരമായ അവസ്ഥയെയോ പെരുമാറ്റരീതിയെയോ സൂചിപ്പിക്കാം.
    reason: മൂലത്തിലെ സംക്ഷിപ്തവും അർഥവ്യാപ്തിയുള്ളതുമായ പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ രൂപവും അതിന്റെ സന്ദർഭാർഥപരമായ സാധ്യതകളും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: יַעַן אֲשֶׁר
  choice: —ആയതിനാലും
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിയുടെ കാരണം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: നിന്റെ നില ഇങ്ങനെയായതിനാലും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇത് നിന്നോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ’ എന്ന സംക്ഷിപ്ത പ്രയോഗം ശലോമോന്റെ നിലയെയോ സ്ഥിരപ്പെട്ട പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കാം. ‘നിന്റെ നില’ എന്നത് ഈ പരിധി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: שָׁמַרְתָּ
  choice: പാലിക്കാതിരുന്നതിനാലും
  rationale: ഉടമ്പടിയും ചട്ടങ്ങളും അനുസരിച്ച് കാത്തുനടക്കുക എന്ന നിയമപരവും ഉടമ്പടിപരവുമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: בְּרִיתִי
  choice: എന്റെ ഉടമ്പടി
  rationale: בְּרִית എന്ന പദത്തിന്റെ ബന്ധപരവും നിയമപരവുമായ ഗൗരവം നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള മലയാളപദം.
- source_word: חֻקֹּתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: ദൈവം നിശ്ചയിച്ച നിയമവിധികളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: ഞാൻ നിന്നോടു കല്പിച്ച
  rationale: എബ്രായ മുൻസർഗപ്രയോഗത്തെ വാക്കിന് വാക്കായി അനുകരിക്കാതെ കല്പനയുടെ അധികാരബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָרֹעַ אֶקְרַע
  choice: തീർച്ചയായും ... പറിച്ചെടുത്ത്
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുകയും കീറിപ്പറിക്കുന്ന ദൃശ്യബലം ‘പറിച്ചെടുത്ത്’ എന്നതിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: ഇവിടെ ശലോമോന്റെ ഭരണാധീനമായ രാജ്യത്തെയും രാജാധികാരപരിധിയെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: מֵעָלֶיךָ
  choice: നിന്നിൽനിന്നു
  rationale: ശലോമോന്റെ അധികാരത്തിൽനിന്നുള്ള നീക്കം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְעַבְדֶּךָ
  choice: നിന്റെ ദാസനു
  rationale: עֶבֶד ഇവിടെ രാജാവിന്റെ കീഴിലുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ യോജിക്കുന്നു; ‘അടിമ’ എന്ന കൂടുതൽ സങ്കുചിത അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
- issue: הָיְתָה זֹּאת עִמָּךְ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: നിന്റെ നില ഇങ്ങനെയായതിനാലും
  alternative: ഇത് നിന്നോടുകൂടെ ഉണ്ടായിരുന്നതിനാലും; നീ ഇങ്ങനെ പ്രവർത്തിച്ചതിനാലും
  rationale: സന്ദർഭം ശലോമോന്റെ വിഗ്രഹാരാധനാപരമായ വഴിത്തിരിവിലേക്കാണ് ചൂണ്ടുന്നത്. എന്നാൽ എബ്രായം നിലയെയും പെരുമാറ്റരീതിയെയും വേർതിരിച്ച് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പ്രധാനവാചകം ആ അർഥപരിധി തുറന്നുവയ്ക്കുന്നു, അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉടമ്പടിപരവും രാജകീയവുമായ പദപ്രയോഗങ്ങൾ നിലനിർത്തിയെങ്കിലും അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
