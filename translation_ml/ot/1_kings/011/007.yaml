  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ യെരൂശലേമിന് എതിർവശത്തുള്ള മലയിൽ മോവാബ്യരുടെ വെറുക്കപ്പെടുന്ന ദേവനായ കെമോശിനുവേണ്ടിയും അമ്മോന്യരുടെ വെറുക്കപ്പെടുന്ന ദേവനായ മോലെക്കിനുവേണ്ടിയും[a] ഒരു ഉന്നത ആരാധനാസ്ഥലം പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മിൽക്കോം.” ഇവിടെയുള്ള എബ്രായരൂപം പരമ്പരാഗതമായി “മോലെക്ക്” എന്നു വായിക്കപ്പെടുന്നു; എന്നാൽ ചിലർ അതിനെ അമ്മോന്യദേവനായ മിൽക്കോമുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലക്രിയാവിശേഷണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִבְנֶה
  choice: പണിതു
  rationale: രൂപപരമായി അപൂർണക്രിയയായിരുന്നാലും אָז എന്നതിനുശേഷം കഴിഞ്ഞകാല ആഖ്യാനസംഭവമായി പ്രവർത്തിക്കുന്നു.
- source_word: בָּמָה
  choice: പൂജാഗിരികൾ
  rationale: ആരാധനയ്ക്കായുള്ള ഉയർന്ന സ്ഥലം എന്ന സാങ്കേതിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; രണ്ട് ദേവന്മാർക്കും ഉദ്ദേശിച്ച സ്ഥലങ്ങളായതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: לִכְמוֹשׁ
  choice: കെമോശിന്
  rationale: ലാമെദ് സമർപ്പണബന്ധം സൂചിപ്പിക്കുന്നു; ദേവനാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שִׁקֻּץ מוֹאָב
  choice: മോവാബിന്റെ മ്ലേച്ഛദേവൻ
  rationale: ശִׁקּוּץ എന്ന പദത്തിലെ ശക്തമായ മതപരമായ നിന്ദ നിലനിർത്തുകയും ഇവിടെ ഒരു ദേവനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: യെരൂശലേമിന് എതിരെയുള്ള മലയിൽ
  rationale: സ്ഥലബന്ധമായ עַל־פְּנֵי എന്നതിന്റെ ‘എതിരെയുള്ള/അഭിമുഖമായ’ അർഥം നിലനിർത്തുന്നു; കിഴക്ക് എന്ന കൂടുതൽ നിർദിഷ്ടമായ ഭൂമിശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
- source_word: וּלְמֹלֶךְ
  choice: മോലെക്കിനും
  rationale: മസോരറ്റിക് സ്വരീകരണം സൂചിപ്പിക്കുന്ന മോലെക്ക് എന്ന രൂപം മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു; മിൽക്കോം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: അമ്മോന്യരുടെ മ്ലേച്ഛദേവൻ
  rationale: മുൻ സമാന്തരപ്രയോഗത്തിലെ നിന്ദാത്മക ശക്തി നിലനിർത്തുന്നു; בְּנֵי עַמּוֹן എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘അമ്മോന്യർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: വിദേശദേവന്മാർക്കുള്ള നിന്ദാത്മക വിശേഷണം
  choice: രണ്ട് പ്രയോഗങ്ങളിലും ‘മ്ലേച്ഛദേവൻ’
  alternative: ‘അറപ്പുളവാക്കുന്ന വസ്തു’ അല്ലെങ്കിൽ ‘അറപ്പായ ദേവൻ’
  rationale: എബ്രായപാഠം തന്നെയുള്ള ശക്തമായ പ്രതികൂല മതപരമായ വിലയിരുത്തൽ മയപ്പെടുത്താതെ, മലയാളത്തിൽ പ്രതിപാദ്യം ദേവനാണെന്നത് വ്യക്തമാക്കുന്നു.
- issue: מֹלֶךְ എന്ന പേരിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘മോലെക്ക്’
  alternative: ‘മിൽക്കോം’
  rationale: മസോരറ്റിക് പാഠത്തിന്റെ സ്വരീകരണം ‘മോലെക്ക്’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; അമ്മോന്യദേവനായ മിൽക്കോമുമായി ബന്ധിപ്പിക്കുന്ന വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
