  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘പൂജാഗിരി’ ആരാധനയ്ക്കുള്ള ഉയർന്ന സ്ഥലത്തിന്റെ സാങ്കേതിക ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ‘മ്ലേച്ഛദേവൻ’ മൂലപാഠത്തിലെ നിന്ദാത്മക ശക്തി നിലനിർത്തുന്നു.
