revisions:
- from: 'അവൻ രാജാവിനെതിരെ കൈ ഉയർത്തിയതിന്റെ കാരണം ഇതായിരുന്നു: ശലോമോൻ മില്ലോ പണിയുകയും തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിലെ മതിലിന്റെ വിടവ് അടയ്ക്കുകയും ചെയ്തിരുന്നു.[a][b]'
  to: 'അവൻ രാജാവിനെതിരെ കൈ ഉയർത്തിയതിന്റെ കാരണം ഇതായിരുന്നു: ശലോമോൻ മില്ലോ[b] പണിതു; തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിലെ വിടവ് അടച്ചു.[a]'
