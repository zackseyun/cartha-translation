id: 1KI.11.27
reference: 1 Kings 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: ml
  text: 'അവൻ രാജാവിനെതിരെ കൈ ഉയർത്തിയതിന്റെ കാരണം ഇതായിരുന്നു: ശലോമോൻ മില്ലോ[b] പണിതു; തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിലെ വിടവ് അടച്ചു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “അവൻ രാജാവിനെതിരെ കലഹിച്ചു.” എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം “രാജാവിനെതിരെ കൈ ഉയർത്തി” എന്നാണ്.'
    reason: alternative_reading
  - marker: b
    text: “മില്ലോ” യെരൂശലേമിലെ പേരുള്ള ഒരു കോട്ടനിർമാണമോ തട്ടുതട്ടായ മൺനിറപ്പുനിർമിതിയോ ആയിരുന്നിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: കാരണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കാര്യം’ എന്നാണെങ്കിലും, ഇവിടെ തുടർന്നുവരുന്ന വിശദീകരണത്തെ അവതരിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הֵרִים יָד
  choice: കൈ ഉയർത്തി
  rationale: എതിർപ്പിനെയോ കലാപത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി കഴിയുന്നത്ര അതേ രൂപത്തിൽ നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בַּמֶּלֶךְ
  choice: രാജാവിനെതിരെ
  rationale: മുൻപുള്ള ശൈലിയിൽ ശത്രുതാപരമായ പ്രവർത്തനത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; രാജാവ് ശലോമോനാണെന്ന് അടുത്ത വാക്യഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: הַמִּלּוֹא
  choice: മില്ലോ
  rationale: യെരൂശലേമിലെ ഒരു പ്രത്യേക നിർമാണത്തിന്റെയോ കോട്ടസംവിധാനത്തിന്റെയോ പേരായതിനാൽ വിവർത്തനം നിർബന്ധിക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: סָגַר
  choice: അടച്ചു
  rationale: ‘അടയ്ക്കുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും വിടവിനെ സംബന്ധിച്ച സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: פֶּרֶץ
  choice: മതിലിന്റെ വിടവ്
  rationale: പദം ഒരു പൊട്ടലിനെയോ വിടവിനെയോ സൂചിപ്പിക്കുന്നു; നഗരപ്രതിരോധത്തിന്റെ സന്ദർഭം മലയാളവായനക്കാരന് വ്യക്തമാക്കാൻ ‘മതിലിന്റെ’ എന്ന് സന്ദർഭാനുസൃതമായി ചേർക്കുന്നു.
- source_word: עִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരം
  rationale: ദാവീദുമായി ബന്ധപ്പെട്ട യെരൂശലേമിലെ കോട്ടപ്രദേശത്തിന്റെ സ്ഥിരമായ സ്ഥലനാമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: സർവനാമം ശലോമോനെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമായി നിലനിർത്തി ദാവീദിനെ അവന്റെ പിതാവായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: הֵרִים יָד എന്ന ശൈലിയുടെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘കൈ ഉയർത്തി’ എന്ന ദൃശ്യശൈലി നിലനിർത്തി
  alternative: ‘കലഹിച്ചു’ അഥവാ ‘മത്സരിച്ചു’
  rationale: മൂലഭാഷയിലെ ശൈലിയും അതിലെ അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു; കലാപം എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്ക് മാറ്റുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ‘കൈ ഉയർത്തി’ എന്ന ശൈലി സംരക്ഷിച്ചു; ‘മില്ലോ’ സ്ഥല-നിർമാണനാമമായി ലിപ്യന്തരിച്ചു. വാക്യാവസാനത്തിലെ രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോട് കൂടുതൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ മുഖ്യപാഠത്തിൽ [a] ശൈലിക്കു പിന്നാലെയും [b] ‘മില്ലോ’യ്ക്കു പിന്നാലെയും സ്ഥാപിക്കാമെങ്കിലും, ഇവിടെ നൽകിയ പാഠത്തിൽ ആവശ്യപ്പെട്ട എല്ലാ ചിഹ്നങ്ങളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
