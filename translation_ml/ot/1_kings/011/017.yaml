translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ കൂട്ടാളികളുടെ അനിശ്ചിതസംഖ്യയും ഹദദിന്റെ കുറഞ്ഞ പ്രായത്തിനുള്ള ഊന്നലും നിലനിർത്തി; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവിക വാക്യക്രമം മലയാളശൈലിക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
