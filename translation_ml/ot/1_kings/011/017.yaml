  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: ml
  text: ഹദദ് ഈജിപ്തിലേക്കു ഓടിപ്പോയി[a]; അവനോടൊപ്പം അവന്റെ പിതാവിന്റെ ദാസന്മാരിൽപ്പെട്ട എദോംകാരായ ചില പുരുഷന്മാരും ഉണ്ടായിരുന്നു. ഹദദ് വളരെ ചെറുപ്പമുള്ള ബാലനായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈജിപ്തിലേക്കു വരാൻ.” ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കാൻ എബ്രായഭാഷയിൽ പലപ്പോഴും “വരുക” എന്ന ക്രിയ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ചെറിയ ബാലൻ” അല്ലെങ്കിൽ “ചെറുപ്പക്കാരനായ ബാലൻ.” എബ്രായപദസമുച്ചയം ഹദദ് വളരെ ചെറുപ്പമായിരുന്നെന്നു ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ברח എന്ന ക്രിയ അപകടത്തിൽനിന്നോ ശത്രുവിൽനിന്നോ ഓടി രക്ഷപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ഓടിപ്പോയി’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: אֲדַד
  choice: ഹദദ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദലിപ്യന്തരണപ്രകാരം നൽകിയിരിക്കുന്നു.
- source_word: וַאֲנָשִׁים אֲדֹמִיִּים
  choice: ഏതാനും എദോമ്യർ
  rationale: അനിശ്ചിതമായ ബഹുവചനത്തെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘ഏതാനും’ ചേർത്തു; אֲדֹמִיִּים എന്നത് എദോംദേശക്കാരെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעַבְדֵי אָבִיו
  choice: അവന്റെ അപ്പന്റെ ദാസന്മാരിൽപ്പെട്ട
  rationale: מִן എന്നതിന്റെ ഭാഗികത വ്യക്തമാക്കാൻ ‘ദാസന്മാരിൽപ്പെട്ട’ എന്നു പരിഭാഷപ്പെടുത്തി. עֶבֶד ഇവിടെ പിതാവിന്റെ സേവനത്തിലുള്ളവരെ സൂചിപ്പിക്കുന്നു.
- source_word: אִתּוֹ
  choice: അവനോടൊപ്പം
  rationale: എദോമ്യർ ഹദദിനൊപ്പം പോയെന്ന കൂട്ടായ്മ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לָבוֹא מִצְרָיִם
  choice: ഈജിപ്തിലേക്കു
  rationale: വാക്യഘടനയിൽ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന לָבוֹא മിക്കവാറും ‘ഈജിപ്തിൽ എത്താൻ/വരാൻ’ എന്നാണ് അക്ഷരാർഥം; ‘ഓടിപ്പോയി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം മാത്രം നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: נַעַר קָטָן
  choice: ചെറിയ ബാലൻ
  rationale: נַעַר ബാലനെയോ യുവാവിനെയോ സൂചിപ്പിക്കാം; קָטָן ചേർന്നതിനാൽ വളരെ കുറഞ്ഞ പ്രായമാണ് ഊന്നിപ്പറയുന്നത്. ‘ചെറിയ ബാലൻ’ ഈ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
