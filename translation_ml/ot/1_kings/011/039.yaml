  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ഞാൻ ദാവീദിന്റെ സന്തതിയെ കഷ്ടപ്പെടുത്തും; എങ്കിലും എന്നേക്കുമായി അല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എല്ലാ നാളുകളിലും അല്ല.’'
    reason: ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരരൂപം സംരക്ഷിക്കുമ്പോൾ മുഖ്യപാഠത്തിൽ അതിന്റെ സ്വാഭാവികമായ അർഥം നൽകാൻ.
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: ഞാൻ ... കഷ്ടപ്പെടുത്തും
  rationale: പീയേൽ രൂപത്തിലുള്ള ענה ഇവിടെ കഷ്ടതയോ താഴ്ത്തലോ വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘കഷ്ടപ്പെടുത്തും’ സ്വാഭാവികവും അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്താത്തതുമാണ്.
- source_word: זֶרַע דָּוִד
  choice: ദാവീദിന്റെ സന്തതി
  rationale: זֶרַע ഏകവചനരൂപത്തിലുള്ള സമൂഹവാചകമാണ്. ‘സന്തതി’ ആ സമൂഹവാചക സ്വഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: לְמַעַן זֹאת
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻപറഞ്ഞ സംഭവത്തെ ഈ കഷ്ടതയുടെ കാരണമായി ചൂണ്ടിക്കാണിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: മുൻപറഞ്ഞ ന്യായവിധിക്ക് ഒരു പരിധി കല്പിക്കുന്ന വിരുദ്ധബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא כָל הַיָּמִים
  choice: എന്നേക്കുമായി അല്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘എല്ലാ നാളുകളിലും അല്ല’ എന്നാണെങ്കിലും, ഇവിടെ ഉദ്ദേശിക്കുന്നത് കഷ്ടത ശാശ്വതമല്ല എന്നതാണ്. ‘എന്നേക്കുമായി അല്ല’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ വംശത്തിന്മേലുള്ള ന്യായവിധിയുടെ ദൈർഘ്യം
  choice: ന്യായവിധി യഥാർഥമാണെങ്കിലും ശാശ്വതമല്ലെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: ‘എല്ലാ നാളുകളിലും അല്ല’ എന്ന അക്ഷരസമീപമായ പരിഭാഷ.
  rationale: ഹീബ്രു വാക്യം കഷ്ടതയുടെ കാലദൈർഘ്യത്തെ വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നു. അതിനപ്പുറം അതിന്റെ കൃത്യമായ ദൈർഘ്യമോ ദൈവശാസ്ത്രപരമായ നിറവേറ്റലോ ഈ വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്തതി’ സമൂഹവാചകമായ അർഥം നിലനിർത്തുന്നു; ‘എന്നേക്കുമായി അല്ല’ ഹീബ്രു കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
