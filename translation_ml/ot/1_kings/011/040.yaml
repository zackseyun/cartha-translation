source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ യൊരോബെയാമിനെ കൊല്ലാൻ ശ്രമിച്ചു.[a] എന്നാൽ യൊരോബെയാം എഴുന്നേറ്റ് ഈജിപ്തിലേക്കു ഓടിപ്പോയി; അവിടെ ഈജിപ്തുരാജാവായ ശീശക്കിന്റെ അടുക്കൽ ചെന്നു. ശലോമോൻ മരിക്കുന്നതുവരെ അവൻ ഈജിപ്തിൽ കഴിഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യൊരോബെയാമിനെ വധിക്കാൻ നോക്കി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ശലോമോന്റെ മരണംവരെ അവൻ ഈജിപ്തിൽ ഉണ്ടായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: ശ്രമിച്ചു
  rationale: בקש ഇവിടെ ഒരു പ്രവൃത്തി ചെയ്യാൻ ശ്രമിക്കുക/ഉദ്ദേശിക്കുക എന്ന അർഥത്തിലാണ്; ശ്രമം വിജയിച്ചുവെന്ന സൂചന നൽകാതെ രാജാവിന്റെ ഉദ്ദേശവും നടപടിയും വ്യക്തമാക്കുന്നു.
- source_word: לְהָמִית
  choice: കൊല്ലാൻ
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘മരണത്തിനിടയാക്കുക’ എന്ന കാരകശക്തിയുണ്ട്; മലയാളത്തിൽ ‘കൊല്ലാൻ’ അതിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום ആഖ്യാനത്തിൽ നിർണായകമായ തുടർനടപടിയെ സൂചിപ്പിക്കുന്നു; ‘എഴുന്നേറ്റ്’ എബ്രായ ക്രിയയുടെ രൂപവും ആഖ്യാനചലനവും നിലനിർത്തുന്നു.
- source_word: וַיִּבְרַח
  choice: ഓടിപ്പോയി
  rationale: ברח അപകടത്തിൽനിന്നുള്ള പലായനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓടിപ്പോയി’ ആ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലേക്കു ... ഈജിപ്തുരാജാവായ ശീശക്കിന്റെ അടുക്കൽ
  rationale: ആദ്യം ലക്ഷ്യരാജ്യവും തുടർന്ന് അവിടത്തെ രാജാവും എന്ന എബ്രായ ഘടന സംരക്ഷിക്കുന്നു; ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ‘അവിടെ’ ചേർത്ത് ബന്ധം വ്യക്തമാക്കി.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: അവൻ ഈജിപ്തിൽ കഴിഞ്ഞു
  rationale: പദശഃ ‘ഈജിപ്തിൽ ആയിരുന്നു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള ‘വരെ’ എന്ന കാലപരിധിയോടൊപ്പം തുടർന്നുള്ള താമസം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കഴിഞ്ഞു’ ഉപയോഗിച്ചു.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: ശലോമോൻ മരിക്കുന്നതുവരെ
  rationale: എബ്രായത്തിലെ നാമവാചകഘടന ‘ശലോമോന്റെ മരണംവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ആധുനിക മലയാളത്തിൽ ക്രിയാരൂപം കൂടുതൽ സ്വാഭാവികവും അർഥത്തിൽ തുല്യവുമാണ്.
