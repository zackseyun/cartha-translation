  source_fidelity: 'എബ്രായ വാക്യത്തിന്റെ ക്രമവും അർഥവും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ശലോമോന്റെ യൊരോബെയാമിനെ കൊല്ലാനുള്ള ശ്രമം, യൊരോബെയാമിന്റെ ഈജിപ്തിലേക്കുള്ള പലായനവും ശീശക്കിന്റെ അടുക്കലേക്കുള്ള വരവും, ശലോമോന്റെ മരണംവരെ അവിടെ കഴിഞ്ഞതും വ്യക്തമാണ്. ‘എഴുന്നേറ്റ്’ ആഖ്യാനത്തിലെ നിർണായക പ്രതികരണത്തെ നന്നായി നിലനിർത്തുന്നു; ‘ഓടിപ്പോയി’ അപകടത്തിൽനിന്നുള്ള പലായനത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.'
