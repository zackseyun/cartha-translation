revisions:
- from: അവർ എന്നെ ഉപേക്ഷിച്ച് സീദോന്യരുടെ ദേവനായ അഷ്ടോരെത്തിനെയും[a], മോവാബിന്റെ ദേവനായ കെമോശിനെയും, അമ്മോന്യരുടെ ദേവനായ മിൽക്കോമിനെയും[b] നമസ്കരിച്ചു; തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ എന്റെ ദൃഷ്ടിയിൽ ശരിയായതും എന്റെ ചട്ടങ്ങളും ന്യായവിധികളും അനുഷ്ഠിക്കേണ്ടതിന് അവർ എന്റെ വഴികളിൽ നടന്നില്ല. അതുകൊണ്ടാണ് ഇതു സംഭവിച്ചത്.
  to: കാരണം, അവർ എന്നെ ഉപേക്ഷിച്ച് സീദോന്യരുടെ ദേവനായ അഷ്ടോരെത്തിനെയും[a], മോവാബിന്റെ ദേവനായ കെമോശിനെയും, അമ്മോന്യരുടെ ദേവനായ മിൽക്കോമിനെയും[b] നമസ്കരിച്ചു; തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ, എന്റെ വഴികളിൽ നടന്ന് എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യാനും എന്റെ ചട്ടങ്ങളും വിധികളും പാലിക്കാനും അവർ ചെയ്തില്ല.
