source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: ml
  text: കാരണം, അവർ എന്നെ ഉപേക്ഷിച്ച് സീദോന്യരുടെ ദേവനായ അഷ്ടോരെത്തിനെയും[a], മോവാബിന്റെ ദേവനായ കെമോശിനെയും, അമ്മോന്യരുടെ ദേവനായ മിൽക്കോമിനെയും[b] നമസ്കരിച്ചു; തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ, എന്റെ വഴികളിൽ നടന്ന് എന്റെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്യാനും എന്റെ ചട്ടങ്ങളും വിധികളും പാലിക്കാനും അവർ ചെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഷ്ടോരെത്ത് ഒരു സ്ത്രീദേവതയായിരുന്നതിനാൽ ‘സീദോന്യരുടെ ദേവി’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘സീദോന്യരുടെ ദേവൻ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ എബ്രായപാഠത്തിലെ വായന ‘മിൽക്കോം’ എന്നാണ്; ചിലർ ഈ പേരിനെ ‘മോലെക്ക്’ എന്ന പേരുമായി ബന്ധപ്പെടുത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: അതുകൊണ്ടാണ് ഇതു സംഭവിച്ചത്
  rationale: കാരണം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. വാക്യം മുൻസന്ദർഭത്തിലെ രാജ്യവിഭജനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇതു സംഭവിച്ചത്’ എന്നത് ആവശ്യമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: עֲזָבוּנִי
  choice: അവർ എന്നെ ഉപേക്ഷിച്ച്
  rationale: ഉടമ്പടിബന്ധം ഉപേക്ഷിക്കുന്നതിന്റെ ഗൗരവം ‘ഉപേക്ഷിച്ചു’ നിലനിർത്തുന്നു; ബഹുവചന കർത്താവും ഒന്നാംപുരുഷ കർമവും വ്യക്തമാണ്.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: നമസ്കരിച്ചു
  rationale: ആരാധനാപരമായ കുനിഞ്ഞുവണങ്ങൽ എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ ‘നമസ്കരിച്ചു’ നൽകുന്നു.
- source_word: לְעַשְׁתֹּרֶת
  choice: അഷ്ടോരെത്ത്
  rationale: എബ്രായ നാമരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: സീദോന്യരുടെ ദേവൻ
  rationale: എബ്രായത്തിലെ പദപ്രയോഗം അഷ്ടോരെത്ത് സ്ത്രീദേവതയായിരുന്നുവെന്ന ചരിത്രവിവരത്തിന്റെ അടിസ്ഥാനത്തിൽ മുഖ്യപാഠത്തിൽ തിരുത്താതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: לִכְמוֹשׁ
  choice: കെമോശ്
  rationale: എബ്രായ നാമം മലയാളലിപിയിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וּלְמִלְכֹּם
  choice: മിൽക്കോം
  rationale: മസോററ്റിക് പാഠത്തിലെ നാമരൂപം നിലനിർത്തുന്നു; മോലെക്കുമായുള്ള ബന്ധം അടിക്കുറിപ്പിൽ മാത്രം പറയുന്നു.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: അവർ എന്റെ വഴികളിൽ നടന്നില്ല
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ ‘വഴികളിൽ നടക്കുക’ എന്ന രൂപകം മലയാളത്തിലും വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: എന്റെ ദൃഷ്ടിയിൽ ശരിയായതും എന്റെ ചട്ടങ്ങളും ന്യായവിധികളും അനുഷ്ഠിക്കേണ്ടതിന്
  rationale: ഒരേ എബ്രായ ക്രിയ മൂന്നു കർമങ്ങളെയും ഭരിക്കുന്ന ഘടന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ‘അനുഷ്ഠിക്കുക’ എന്ന ക്രിയ സ്വാഭാവികമായി ഉപയോഗിച്ചു.
- source_word: כְּדָוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ
  rationale: ഏകവചന സർവനാമം ശലോമോനെ സൂചിപ്പിക്കുന്നതും ദാവീദ് അവന്റെ പിതാവാണെന്നതും മറച്ചുവയ്ക്കാതെ പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: സ്ത്രീദേവതയായ അഷ്ടോരെത്തിനോടൊപ്പം אֱלֹהֵי എന്ന പദം
  choice: സീദോന്യരുടെ ദേവൻ
  alternative: സീദോന്യരുടെ ദേവി
  rationale: മുഖ്യപാഠം എബ്രായത്തിന്റെ വ്യാകരണരൂപം പിന്തുടരുന്നു; ചരിത്രപരമായ ലിംഗസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: מִלְכֹּם എന്ന ദേവനാമത്തിന്റെ തിരിച്ചറിയൽ
  choice: മിൽക്കോം
  alternative: മോലെക്ക്
  rationale: ഇവിടെ മസോററ്റിക് പാഠം മിൽക്കോം എന്നാണ് വായിക്കുന്നത്; പരിചിതമായ മറ്റൊരു ബന്ധപ്പെടുത്തൽ പാഠത്തിൽ കലർത്താതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ‘തന്റെ പിതാവായ ദാവീദ്’ എന്നതിലെ സർവനാമബന്ധം
  choice: ശലോമോന്റെ പിതാവായ ദാവീദ്
  alternative: വംശപൂർവികൻ എന്ന പൊതുവായ അർഥം
  rationale: സന്ദർഭത്തിലും വ്യാകരണത്തിലും ഏകവചന സൂചന ശലോമോനിലേക്കാണ് മടങ്ങുന്നത്; ദാവീദ് അവന്റെ നേരിട്ടുള്ള പിതാവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദേവനാമങ്ങൾ എബ്രായരൂപത്തിന് അടുത്തായി ലിപ്യന്തരണം ചെയ്തു. കാരണം സൂചിപ്പിക്കുന്ന എബ്രായ ഉപവാക്യം മലയാളത്തിലെ നീണ്ട മുൻനിര ഘടന ഒഴിവാക്കാൻ അവസാനത്തിൽ സ്വാഭാവികമായ സമാപനവാക്യമായി നൽകി.
