  to: അവൻ പുരുഷന്മാരെ തന്റെ ചുറ്റും കൂട്ടിച്ചേർത്ത്, ദാവീദ് അവരെ കൊന്നപ്പോൾ ഒരു സംഘത്തിന്റെ തലവനായിത്തീർന്നു. അവർ ദമസ്കൊസിലേക്കു പോയി[a], അവിടെ പാർത്തു, ദമസ്കൊസിൽ ഭരിച്ചു.
  rationale: The revision strengthens source fidelity by representing the military masculine plural as ‘പുരുഷന്മാരെ,’ and it improves Malayalam idiom with ‘അവിടെ പാർത്തു’ and ‘ഭരിച്ചു.’ It retains the Hebrew plural verbs and preserves the textual ambiguity noted in the footnote, without harmonizing them to the singular Rezon.
