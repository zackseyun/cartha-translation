source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: ml
  text: അവൻ പുരുഷന്മാരെ തന്റെ ചുറ്റും കൂട്ടിച്ചേർത്ത്, ദാവീദ് അവരെ കൊന്നപ്പോൾ ഒരു സംഘത്തിന്റെ തലവനായിത്തീർന്നു. അവർ ദമസ്കൊസിലേക്കു പോയി[a], അവിടെ പാർത്തു, ദമസ്കൊസിൽ ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'വാക്യത്തിന്റെ അവസാനപകുതിയിലുടനീളം എബ്രായപാഠത്തിൽ ബഹുവചന ക്രിയകളാണ്: ‘അവർ പോയി … പാർത്തു … ഭരിച്ചു.’ സന്ദർഭം രെസോനെ കേന്ദ്രീകരിക്കുന്നതിനാൽ ചില പരിഭാഷകൾ ഇവയെ ‘അവൻ’ എന്നു ഏകവചനമാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: അവൻ ആളുകളെ തന്റെ ചുറ്റും കൂട്ടിച്ചേർത്ത്
  rationale: קבץ എന്ന ക്രിയയും עַל ചേർന്ന സർവനാമപ്രത്യയവും ആളുകളെ സ്വന്തം ചുറ്റും അനുയായികളായി കൂട്ടുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: אֲנָשִׁים
  choice: ആളുകളെ
  rationale: സൈനികസന്ദർഭത്തിൽ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, ഇവിടെ സംഘാംഗങ്ങളെ സൂചിപ്പിക്കാൻ ‘ആളുകൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്; ലിംഗസൂചന സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: שַׂר גְּדוּד
  choice: ഒരു സംഘത്തിന്റെ തലവൻ
  rationale: שַׂר എന്നത് തലവൻ അഥവാ സേനാനായകൻ എന്നും גְּדוּד ഒരു സൈനികസംഘം അഥവാ കൂട്ടം എന്നും അർഥമാക്കാം. മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘കൊള്ളസംഘം’ എന്ന ആശയം ചേർക്കാതെ നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: ദാവീദ് അവരെ കൊന്നപ്പോൾ
  rationale: ב + infinitive construct ഇവിടെ കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ബഹുവചന കർമപ്രത്യയം അതേ സംഘത്തിലെ ആളുകളിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: അവർ ദമസ്കൊസിലേക്കു പോയി
  rationale: ബഹുവചന ക്രിയയും ദമസ്കൊസിലേക്കുള്ള ദിശയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: അവിടെ താമസമാക്കി
  rationale: ישב കുടിയേറി പാർക്കുക അഥവാ സ്ഥിരതാമസമാക്കുക എന്ന അർഥത്തിൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: ദമസ്കൊസിൽ ഭരണം നടത്തി
  rationale: מלך ഭരിക്കുക അഥവാ രാജാവായി വാഴുക എന്നാണ്. മൂലപാഠത്തിലെ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട്, എല്ലാവരും രാജാക്കന്മാരായി എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ മൂന്നു ക്രിയകളും ബഹുവചനത്തിലാണെങ്കിലും വിശാലസന്ദർഭം രെസോനെ കേന്ദ്രീകരിക്കുന്നു
  choice: ‘അവർ പോയി… താമസമാക്കി… ഭരണം നടത്തി’ എന്ന ബഹുവചനം നിലനിർത്തി
  alternative: ‘അവൻ പോയി… താമസമാക്കി… ഭരിച്ചു’ എന്ന് ഏകവചനമാക്കുക
  rationale: എബ്രായപാഠം അവസാനഭാഗമൊട്ടാകെ ബഹുവചന ക്രിയകളാണ് ഉപയോഗിക്കുന്നത്. സന്ദർഭത്തിനനുസരിച്ച് ഏകവചനമാക്കി മിനുക്കാതെ മൂലപാഠത്തിലെ ആഖ്യാനപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൊള്ളസംഘം’ പോലുള്ള അധിക വ്യാഖ്യാനം ഒഴിവാക്കി ‘സംഘം’ എന്ന നിഷ്പക്ഷ പദം സ്വീകരിച്ചു; മൂലപാഠത്തിലെ ബഹുവചനരൂപങ്ങൾ വ്യക്തമായി സംരക്ഷിച്ചു.
