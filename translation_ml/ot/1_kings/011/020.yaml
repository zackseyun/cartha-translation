  edition: WLC
  text: וַ/תֵּ֨לֶד ל֜/וֹ אֲח֣וֹת תַּחְפְּנֵ֗יס אֵ֚ת גְּנֻבַ֣ת בְּנ֔/וֹ וַ/תִּגְמְלֵ֣/הוּ תַחְפְּנֵ֔ס בְּ/ת֖וֹךְ בֵּ֣ית פַּרְעֹ֑ה וַ/יְהִ֤י גְנֻבַת֙ בֵּ֣ית פַּרְעֹ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: ml
  text: തഹ്പെനേസിന്റെ സഹോദരി അവന് അവന്റെ മകനായ ഗെനൂബത്തിനെ പ്രസവിച്ചു[a]. തഹ്പെനേസ് അവനെ ഫറവോന്റെ ഭവനത്തിൽവെച്ച് മുലകുടി മാറ്റി[b]. ഗെനൂബത്ത് ഫറവോന്റെ ഭവനത്തിൽ, ഫറവോന്റെ പുത്രന്മാരുടെ ഇടയിൽ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തഹ്പെനേസിന്റെ സഹോദരി അവന് ഗെനൂബത്ത് എന്നൊരു മകനെ പ്രസവിച്ചു.’ എബ്രായ പദക്രമം ഇരു രീതിയിലും വിവർത്തനം ചെയ്യാം; അർഥത്തിൽ മാറ്റമില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘മുലകുടി മാറ്റി’ എന്നത് കുട്ടി ഇനി മുലപ്പാൽ കുടിക്കാത്ത പ്രായഘട്ടത്തിലെത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; അതിനുശേഷവും അവൻ ഫറവോന്റെ രാജഗൃഹത്തിൽ തുടർന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: അവന് ... പ്രസവിച്ചു
  rationale: ילד എന്ന ക്രിയയോടൊപ്പമുള്ള ל־ ദാതൃബന്ധം ഹദദിനുവേണ്ടി/അവന് ഒരു മകനെ പ്രസവിച്ചു എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അത് ‘അവന് ... പ്രസവിച്ചു’ എന്നു നിലനിർത്തുന്നു.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: തഹ്പെനേസിന്റെ സഹോദരി
  rationale: എബ്രായത്തിലെ നിർമാണബന്ധത്തെ നേരിട്ടും സ്വാഭാവികമായും പ്രതിനിധീകരിക്കുന്നു.
- source_word: גְּנֻבַת
  choice: ഗെനൂബത്ത്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנוֹ
  choice: അവന്റെ മകനായ
  rationale: പ്രത്യയം ഹദദിനെ സൂചിപ്പിച്ച് ഗെനൂബത്ത് അവന്റെ മകനാണെന്ന് വ്യക്തമാക്കുന്നു; മൂലത്തിലെ വ്യക്തമായ പുത്രബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: וַתִּגְמְלֵהוּ
  choice: അവനെ ... മുലകുടി മാറ്റി
  rationale: ഈ സന്ദർഭത്തിൽ גמל ശിശുവിനെ മുലകുടിയിൽനിന്ന് മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘വളർത്തി’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനത്തിൽവെച്ച്
  rationale: രാജവസതിയുടെയും രാജകുടുംബപരിസരത്തിന്റെയും സ്ഥല-സാമൂഹിക അർഥം ഉൾക്കൊള്ളുന്നു; ‘ഭവനം’ എന്നത് എബ്രായത്തിലെ ‘വീട്’ എന്ന രൂപകൽപ്പനയും നിലനിർത്തുന്നു.
- source_word: וַיְהִי
  choice: ആയിരുന്നു
  rationale: കഥാസംഗ്രഹത്തിൽ ഗെനൂബത്തിന്റെ സ്ഥാനം/നില സൂചിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലരൂപം.
- source_word: בֵּית פַּרְעֹה
  choice: ഫറവോന്റെ ഭവനം
  rationale: കൊട്ടാരത്തെയും രാജഗൃഹത്തെയും ഒരുപോലെ സൂചിപ്പിക്കാവുന്ന മൂലഭാഷയിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: ഫറവോന്റെ പുത്രന്മാരുടെ ഇടയിൽ
  rationale: בני എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുത്രന്മാർ’ എന്നു കൃത്യമായി നിലനിർത്തി രാജകുമാരന്മാരോടൊപ്പമുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു.
