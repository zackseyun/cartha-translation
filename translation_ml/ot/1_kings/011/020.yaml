translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥാശൈലി സ്വീകരിച്ചു. ‘ഭവനം’ എന്ന പദം കൊട്ടാരവും രാജകുടുംബവും ഉൾപ്പെടുന്ന בֵּית എന്നതിന്റെ അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു; ‘മുലകുടി മാറ്റി’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും മൂലത്തോട് കൃത്യവുമാണ്.
