source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: ml
  text: സെരേദായിൽനിന്നുള്ള എഫ്രയീമ്യനായ[a] നെബാത്തിന്റെ മകൻ യൊരോബെയാം—അവന്റെ അമ്മയുടെ പേര് സെരൂവാ എന്നായിരുന്നു; അവൾ വിധവയായ ഒരു സ്ത്രീയായിരുന്നു[b]—ശലോമോന്റെ ദാസനായിരുന്നു. അവൻ രാജാവിനെതിരെ കൈ ഉയർത്തി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എഫ്രാത്ത്യൻ’; എന്നാൽ ഇവിടെ ‘എഫ്രയീമ്യൻ’ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഒരു സ്ത്രീ, ഒരു വിധവ.’'
    reason: source_form
  - marker: c
    text: 'അഥവാ, ‘അവൻ രാജാവിനോടു മത്സരിച്ചു.’ എബ്രായത്തിൽ: ‘അവൻ രാജാവിനെതിരെ കൈ ഉയർത്തി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: എഫ്രയീമ്യൻ
  rationale: രാജാക്കന്മാരുടെ പുസ്തകത്തിലെ ഈ സന്ദർഭത്തിൽ ഗോത്രപരമായി എഫ്രയീമിനോടുള്ള ബന്ധമാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം. എഫ്രാത്തുമായി ബന്ധമുള്ളവൻ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַצְּרֵדָה
  choice: സെരേദാ
  rationale: സ്ഥലനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: צְרוּעָה
  choice: സെരൂവാ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אִשָּׁה אַלְמָנָה
  choice: വിധവയായ ഒരു സ്ത്രീ
  rationale: ‘സ്ത്രീ’, ‘വിധവ’ എന്നീ രണ്ടു എബ്രായ ഘടകങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: ശലോമോന്റെ രാജകീയ സേവനത്തിലുള്ള യൊരോബെയാമിന്റെ പദവിയെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ അടിമത്തത്തിന്റെ നിയമപരമായ വശം പ്രത്യേകം മുൻനിർത്തുന്നില്ല.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: രാജാവിനെതിരെ കൈ ഉയർത്തി
  rationale: ശത്രുതാപരമായ നടപടിയെയോ മത്സരത്തെയോ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: וְ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: വാക്യാരംഭത്തിലെ വാവ് ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘രാജാവിനെതിരെ കൈ ഉയർത്തി’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: മൂലഭാഷയിലെ രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘രാജാവിനോടു മത്സരിച്ചു’ അഥവാ ‘രാജാവിനെതിരെ കലഹിച്ചു’
  rationale: പ്രയോഗം മത്സരത്തെയോ കലാപത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, പ്രവൃത്തിയുടെ കൃത്യസ്വഭാവം ഈ വാക്യത്തിൽ കൂടുതൽ നിർവചിക്കാതെ മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ ലിപ്യന്തരണം ചെയ്തു. ഇടയ്ക്കുള്ള മാതൃവിവരം ദീർഘവിരാമചിഹ്നങ്ങൾകൊണ്ട് വേർതിരിച്ച് എബ്രായ വാക്യഘടനയുടെ പ്രവാഹം വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
