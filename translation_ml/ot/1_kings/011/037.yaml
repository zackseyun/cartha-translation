revisions:
- from: നിന്നെ ഞാൻ ഏറ്റെടുക്കും; നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്നതെല്ലാം[a] നീ ഭരിക്കും; നീ ഇസ്രായേലിനു രാജാവായിരിക്കും.
  to: നിന്നെ ഞാൻ എടുക്കും; നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും നീ ഭരിക്കും; ഇസ്രായേലിന്മേൽ നീ രാജാവായിരിക്കും.
  rationale: The revision replaces the potentially misleading ‘ഏറ്റെടുക്കും’ with the direct equivalent ‘എടുക്കും’ and explicitly marks the sphere of rule with ‘സകലത്തിന്മേലും.’ It retains the idiomatic main-text rendering ‘ഉള്ളം’ for נֶפֶשׁ while preserving the literal wording in the anchored footnote. No theological interpretation has been added.
