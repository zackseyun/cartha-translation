source:
  edition: WLC
  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: ml
  text: നിന്നെ ഞാൻ എടുക്കും; നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്ന സകലത്തിന്മേലും നീ ഭരിക്കും; ഇസ്രായേലിന്മേൽ നീ രാജാവായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: ഞാൻ ഏറ്റെടുക്കും
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘എടുക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ദൈവിക നിയമനത്തിന്റെ ഈ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്ന ‘ഏറ്റെടുക്കുക’ ഉപയോഗിച്ചു. ‘തിരഞ്ഞെടുക്കും’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ മൂലപദത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർന്നുപോകും.
- source_word: וּמָלַכְתָּ
  choice: നീ ഭരിക്കും
  rationale: מלך ഇവിടെ രാജത്വം പ്രയോഗിക്കുന്നതിനെ, അതായത് ഭരിക്കുന്ന പ്രവൃത്തിയെ, സൂചിപ്പിക്കുന്നു; വെറും രാജസ്ഥാനാരോഹണം മാത്രമല്ല.
- source_word: בְּכֹל אֲשֶׁר
  choice: ആഗ്രഹിക്കുന്നതെല്ലാം … ഭരിക്കും
  rationale: מלך എന്ന ക്രിയയോടൊപ്പമുള്ള ב ഭരണത്തിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു. മലയാള വാക്യക്രമത്തിൽ ‘എല്ലാം … ഭരിക്കും’ എന്നത് സ്വാഭാവികമായി ആ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്നതെല്ലാം
  rationale: נֶפֶשׁ എന്ന മൂലരൂപത്തിന്റെ വ്യക്തിയുടെ അന്തർലീനമായ ആഗ്രഹം എന്ന ദൃശ്യഭാവം ‘ഉള്ളം’ നിലനിർത്തുന്നു; അതേസമയം ‘പ്രാണൻ ആഗ്രഹിക്കുന്നു’ എന്ന അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാവുന്നതുമായ മലയാളം ഒഴിവാക്കുന്നു. കൂടുതൽ ലളിതമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: നീ … രാജാവായിരിക്കും
  rationale: היה + നാമപദം ഇവിടെ ലഭിക്കുന്ന ഔദ്യോഗിക സ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘രാജാവായിരിക്കും’ പ്രഖ്യാപനത്തിന്റെ ഭാവവും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവായിരിക്കും
  rationale: രാജത്വസന്ദർഭത്തിലെ עַל അധികാരപരിധിയെ സൂചിപ്പിക്കുന്നു. ‘ഇസ്രായേലിന്മേൽ’ എന്നതിനേക്കാൾ ‘ഇസ്രായേലിനു രാജാവ്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഭരണാധികാരത്തിന്റെ അർഥം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: נֶפֶשׁ എന്ന മനുഷ്യസ്വഭാവസൂചക പ്രയോഗം
  choice: ‘നിന്റെ ഉള്ളം ആഗ്രഹിക്കുന്നതെല്ലാം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീ ആഗ്രഹിക്കുന്നതെല്ലാം’ / അക്ഷരാർഥത്തിൽ ‘നിന്റെ പ്രാണൻ ആഗ്രഹിക്കുന്നതെല്ലാം’
  rationale: ഇവിടെ נֶפֶשׁ ആത്മാവിനെക്കുറിച്ചുള്ള സാങ്കേതിക ദൈവശാസ്ത്രപ്രസ്താവനയല്ല; വ്യക്തിയുടെ ആഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ‘ഉള്ളം’ എന്നത് ആ രൂപകം പൂർണമായി ഇല്ലാതാക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു; ലളിതമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിലെ ദൈവിക നിയമനം, ഭരണത്തിന്റെ വ്യാപ്തി, രാജസ്ഥാനത്തിന്റെ പ്രഖ്യാപനം എന്നിവ നിലനിർത്തി; נֶפֶשׁ എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും ലളിതമായ പര്യായവും അടിക്കുറിപ്പിൽ നൽകി.
