  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: ml
  text: അങ്ങനെ സംഭവിച്ചു:[a] ദാവീദ് എദോമിൽ ഉണ്ടായിരുന്നപ്പോൾ,[b] സൈന്യാധിപനായ യോവാബ് കൊല്ലപ്പെട്ടവരെ അടക്കംചെയ്യാൻ കയറി ചെന്നപ്പോൾ, അവൻ എദോമിലെ എല്ലാ പുരുഷന്മാരെയും കൊന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പശ്ചാത്തലവിവരണം അവതരിപ്പിക്കാൻ പതിവായി ഉപയോഗിക്കുന്ന ഒരു ആഖ്യാനപ്രയോഗമാണിത്. ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ദാവീദ് എദോമിനോടൊപ്പം ഉണ്ടായിരുന്നപ്പോൾ’ എന്നാണ്. ഈ സൈനികസന്ദർഭത്തിൽ ഇത് ദാവീദിന്റെ എദോമിലെ സാന്നിധ്യത്തെയോ അവിടത്തെ സൈനികനടപടിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: സംഭവിച്ചതെന്തെന്നാൽ
  rationale: പശ്ചാത്തലവിവരണം അവതരിപ്പിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗം. തുടർന്നുവരുന്ന വിശദീകരണവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: ദാവീദ് എദോമിൽ ഉണ്ടായിരുന്നപ്പോൾ
  rationale: ב ചേർന്ന infinitive construct കാലസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. אֶת אֱדוֹם എന്ന അസാധാരണ പ്രയോഗം ഈ സൈനികസന്ദർഭത്തിൽ ദാവീദിന്റെ എദോമിലെ സാന്നിധ്യമോ അവിടത്തെ സൈനികനടപടിയോ സൂചിപ്പിക്കുന്നു.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: യോവാബ് ... കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שַׂר הַצָּבָא
  choice: സൈന്യാധിപൻ
  rationale: ഔദ്യോഗിക സൈനികപദവിയെ ചുരുക്കവും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְקַבֵּר אֶת הַחֲלָלִים
  choice: കൊല്ലപ്പെട്ടവരെ അടക്കംചെയ്യാൻ
  rationale: ലക്ഷ്യാർഥക infinitive-ഉം യുദ്ധത്തിൽ കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന חֲלָלִים എന്ന പദത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: וַיַּךְ
  choice: അവൻ ... കൊന്നുകളഞ്ഞു
  rationale: സൈനികവിവരണത്തിൽ נכה ഇവിടെ മാരകമായി പ്രഹരിക്കുക അഥവാ കൊല്ലുക എന്നർഥത്തിലാണ്. ‘അവൻ’ എന്ന സർവനാമം എബ്രായത്തിലെ വ്യാകരണപരമായ വിഷയാവ്യക്തത അനാവശ്യമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: כָּל זָכָר
  choice: ആണുങ്ങളെയെല്ലാം
  rationale: זָכָר ലിംഗസൂചകമായി ‘ആൺ’ എന്നാണ്; പൊതുവായ ‘പുരുഷന്മാർ’ എന്നതിനെക്കാൾ മൂലപാഠത്തിന്റെ സമഗ്രവും കടുപ്പമുള്ളതുമായ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: בֶּאֱדוֹם
  choice: എദോമിലെ
  rationale: ב എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; പരിധി മൂലപാഠത്തേക്കാൾ വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: കടുത്ത സൈനികഹിംസയെ വിവരിക്കുന്ന ചരിത്രപ്രസ്താവന
  choice: എദോമിലെ ആണുങ്ങളെയെല്ലാം കൊന്നുകളഞ്ഞുവെന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി
  alternative: ‘എദോമ്യരെ തോൽപ്പിച്ചു’ എന്ന് മയപ്പെടുത്തുക, അല്ലെങ്കിൽ സമ്പൂർണ ഉന്മൂലനം എന്ന് മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക
  rationale: മൂലപാഠത്തിന്റെ കടുപ്പം ശാന്തമാക്കാതെയും അതിൽ പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സൈന്യാധിപൻ’, ‘അടക്കംചെയ്യുക’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
