  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേ ശലോമോനെതിരെ എദോമ്യനായ ഹദദ് എന്ന ഒരു എതിരാളിയെ[a] എഴുന്നേൽപ്പിച്ചു. അവൻ എദോമിലെ രാജവംശത്തിൽപ്പെട്ടവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘സാത്താൻ’ എന്ന പദം ഇവിടെ വ്യക്തിനാമമായ ‘സാത്താൻ’ എന്നല്ല, ‘എതിരാളി’ അഥവാ ‘പ്രതിയോഗി’ എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: എഴുന്നേൽപ്പിച്ചു
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ എതിർപ്പിനായി ഉയർന്നുവരുത്തുക എന്ന ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേൽപ്പിച്ചു’ എന്നത് അതിനെ ഔദ്യോഗിക നിയമനമായി അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שָׂטָן
  choice: ഒരു എതിരാളി
  rationale: ഇവിടെ ഈ പദം ഹദദിനെ സൂചിപ്പിക്കുന്ന പൊതുനാമമാണ്; വ്യക്തിനാമമായ ‘സാത്താൻ’ അല്ല. അനിശ്ചിതത്വം സൂചിപ്പിക്കാൻ ‘ഒരു’ ചേർത്തു.
- source_word: לִשְׁלֹמֹה
  choice: ശലോമോനെതിരെ
  rationale: שָׂטָן എന്ന പദത്തോടൊപ്പം לְ എതിർക്കപ്പെടുന്ന വ്യക്തിയെ അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘എതിരെ’ അതിന്റെ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: הֲדַד הָאֲדֹמִי
  choice: എദോമ്യനായ ഹദദ്
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; ജനതയെയോ ദേശബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ ‘എദോമ്യനായ’ എന്നു നൽകി.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: രാജവംശത്തിൽപ്പെട്ടവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘രാജാവിന്റെ സന്തതിയിൽനിന്നുള്ളവൻ’ എന്ന വംശപരമ്പരാസൂചനയാണിത്. ‘രാജവംശത്തിൽപ്പെട്ടവൻ’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הוּא בֶּאֱדוֹם
  choice: അവൻ എദോമിലെ … ആയിരുന്നു
  rationale: ഊന്നൽ നൽകുന്ന സർവനാമം നിലനിർത്തി, രാജവംശബന്ധം എദോമിനോടാണെന്ന് മലയാള വാക്യഘടനയിൽ വ്യക്തമായി ചേർത്തു.
theological_decisions:
- issue: שָׂטָן എന്ന പദത്തിന്റെ അർഥം
  choice: പൊതുനാമമായ ‘എതിരാളി’
  alternative: വ്യക്തിനാമമായ ‘സാത്താൻ’
  rationale: വാക്യഘടനയും സന്ദർഭവും ശലോമോന്റെ മനുഷ്യനായ രാഷ്ട്രീയ എതിരാളിയായി ഹദദിനെയാണ് തിരിച്ചറിയുന്നത്. അതിനാൽ പിൽക്കാല ദൈവശാസ്ത്രപരമായ വ്യക്തിനാമാർഥം ഇവിടെ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹദദിനെ ‘എതിരാളി’ എന്നതിന്റെ വിശദീകരണമായി സ്വാഭാവികമായി ചേർത്തു; ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
