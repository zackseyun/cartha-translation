source:
  edition: WLC
  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: ml
  text: ശലോമോന്റെ കാലമൊക്കെയും അവൻ ഇസ്രായേലിന് ഒരു എതിരാളിയായിരുന്നു[a]; ഹദദ് വരുത്തിയ ഹാനിക്കു പുറമേയായിരുന്നു ഇത്. അവൻ ഇസ്രായേലിനെ വെറുത്തു; അരാമിനെ ഭരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഹദദ് വരുത്തിയ ഹാനിക്കു പുറമേ.” എബ്രായപ്രയോഗം അപൂർണ്ണവും ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്; ഹദദ് വരുത്തിയ ഹാനിക്കു പുറമേ ഈ എതിരാളിയും ഉയർന്നുവന്നു എന്നായിരിക്കാം അർഥം.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: എതിരാളി
  rationale: ഈ ചരിത്രസന്ദർഭത്തിൽ പദം ഒരു മനുഷ്യനായ രാഷ്ട്രീയശത്രുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സാത്താൻ’ എന്ന പേരാക്കി വിവർത്തനം ചെയ്യുന്നത് പിൽക്കാല ദൈവശാസ്ത്രാർഥം അനാവശ്യമായി ഉൾപ്പെടുത്തും.
- source_word: לְיִשְׂרָאֵל
  choice: ഇസ്രായേലിന്
  rationale: שָׂטָן എന്നതോടൊപ്പം വരുന്ന ל എതിർപ്പിന് വിധേയമായ കക്ഷിയെ അടയാളപ്പെടുത്തുന്നു; ‘ഇസ്രായേലിന് ഒരു എതിരാളി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ കാലമൊക്കെയും
  rationale: ശലോമോന്റെ ജീവിതകാലം അഥവാ ഭരണകാലം മുഴുവൻ എന്ന കാലപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: ഹദദ് വരുത്തിയ ദോഷത്തിനു പുറമേയായിരുന്നു ഇത്
  rationale: മൂലവാക്യം അപൂർണ്ണവും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്. ഹദദുമായി ബന്ധപ്പെട്ട ദോഷത്തിനു പുറമേ ഈ എതിരാളിയും ഉണ്ടായിരുന്നുവെന്ന കൂട്ടിച്ചേർക്കൽഭാവം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: רָעָה
  choice: ദോഷം
  rationale: ഇവിടെ ധാർമികമായ തിന്മയെക്കാൾ ഇസ്രായേലിന് വരുത്തിയ ഹാനി/കഷ്ടതയാണ് ഉദ്ദേശ്യം; ‘ദോഷം’ ആ അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: അവൻ ഇസ്രായേലിനെ വെറുത്തു
  rationale: קוץ എന്ന ക്രിയ പ്രകടിപ്പിക്കുന്ന ശക്തമായ വിരോധവും അറപ്പും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: അരാമിന്മേൽ രാജാവായി വാണു
  rationale: מלך എന്ന ക്രിയയുടെ രാജഭരണാർഥം നിലനിർത്തുകയും അֲרָם എന്ന പുരാതന നാമം ‘സിറിയ’ എന്നു മാറ്റാതെ ‘അരാം’ ആയി ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: שָׂטָן എന്നത് ‘സാത്താൻ’ എന്ന വ്യക്തിനാമമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: മനുഷ്യനായ ‘എതിരാളി’
  alternative: ‘സാത്താൻ’
  rationale: സന്ദർഭം ശലോമോനെതിരെ ഉയർന്ന രാഷ്ട്രീയ എതിരാളികളെക്കുറിച്ചാണ്; ഇവിടെ പദം പൊതുനാമമാണ്. അതിനെ ‘സാത്താൻ’ എന്നു നൽകുന്നത് മൂലപാഠത്തിലില്ലാത്ത പിൽക്കാല ദുഷ്ടാത്മസംബന്ധമായ അർഥം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എതിരാളി,’ ‘ദോഷം,’ ‘വെറുത്തു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയിലെ രാഷ്ട്രീയവിരോധവും ശക്തമായ ശത്രുതയും നിലനിർത്തുന്നു. ദുഷ്കരമായ ഇടവാക്യത്തിന്റെ അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ അതിരുകടന്ന് തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
