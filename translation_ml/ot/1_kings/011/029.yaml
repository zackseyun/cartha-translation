id: 1KI.11.29
reference: 1 Kings 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: ml
  text: ആ കാലത്ത്, യൊരോബെയാം യെരൂശലേമിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ, ശീലോന്യനായ പ്രവാചകൻ അഹീയാവ് വഴിയിൽവെച്ച് അവനെ കണ്ടു. അവൻ ഒരു പുതിയ മേലങ്കി പുതച്ചിരുന്നു; അവർ ഇരുവരും വയലിൽ[a] തനിച്ചായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുറസ്സായ പ്രദേശത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: ആ കാലത്ത്
  rationale: എബ്രായ ആഖ്യാനസൂത്രത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അനാവശ്യമായ പദാനുപദ ഘടന ഒഴിവാക്കുന്നു.
- source_word: יָצָא מִירוּשָׁלָם
  choice: യെരൂശലേമിൽനിന്ന് പുറപ്പെട്ടു
  rationale: יָצָא എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ദിശാബോധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: അവനെ കണ്ടു
  rationale: מצא ഇവിടെ വഴിയിലുണ്ടായ അഭിമുഖീകരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കണ്ടു’ എന്നത് സ്വാഭാവികവും മൂലപദത്തിന്റെ സാധാരണ അർഥത്തോട് അടുത്തതുമാണ്.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: ശീലോന്യനായ അഹീയാപ്രവാചകൻ
  rationale: സ്ഥലനാമത്തിൽനിന്നുള്ള വിശേഷണവും ‘പ്രവാചകൻ’ എന്ന തിരിച്ചറിയലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: സംഭവം നടന്ന ഇടം സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം.
- source_word: וְהוּא מִתְכַּסֶּה בְּשַׂלְמָה חֲדָשָׁה
  choice: അവൻ ഒരു പുതിയ മേലങ്കി പുതച്ചിരുന്നു
  rationale: ഹിത്പായേൽ രൂപത്തിന്റെ സ്വയം പൊതിയുന്ന ഭാവവും പശ്ചാത്തലാവസ്ഥയും ‘പുതച്ചിരുന്നു’ എന്നതിലൂടെ നൽകുന്നു. ‘അവൻ’ എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു എന്ന മൂലപാഠത്തിലെ സാധ്യതാപരമായ അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: അവർ ഇരുവരും ... തനിച്ചായിരുന്നു
  rationale: മറ്റാരും കൂടെയില്ലായിരുന്നുവെന്ന ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שָׂדֶה എന്ന പദത്തിന്റെ അടിസ്ഥാന സ്ഥലാർഥം നേരിട്ട് നൽകുന്നു; ‘തുറസ്സായ പ്രദേശത്ത്’ എന്ന സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ സർവനാമാവ്യക്തത വ്യാഖ്യാനിച്ച് തീർക്കാതെ സൂക്ഷിച്ചിരിക്കുന്നു.
