  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: ml
  text: എങ്കിലും[a] രാജ്യം മുഴുവനും ഞാൻ കീറിയെടുക്കുകയില്ല; ഒരു ഗോത്രം നിന്റെ മകനു ഞാൻ കൊടുക്കും; എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും ഞാൻ തിരഞ്ഞെടുത്ത യെരൂശലേമിന്റെ നിമിത്തവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നാൽ രാജ്യം മുഴുവനും ഞാൻ കീറിയെടുക്കുകയില്ല.”'
    reason: רַק ഇവിടെ മുൻപറഞ്ഞ ന്യായവിധിക്കുള്ള ഒരു പരിമിതിയെയോ യോഗ്യതയെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ പ്രതികൂലമായ ‘എങ്കിലും’ എന്നതിനൊപ്പം ‘എന്നാൽ’ എന്ന പരിമിതിസൂചക വായനയും സാധ്യമാണ്.
lexical_decisions:
- source_word: רַק
  choice: എങ്കിലും
  rationale: മുൻവിധിന്യായത്തിന് ഒരു പരിമിതി വരുത്തുന്ന പ്രതികൂലഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘മാത്രം’ എന്ന പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הַמַּמְלָכָה
  choice: രാജ്യം മുഴുവനും
  rationale: כָּל സൂചിപ്പിക്കുന്ന സമഗ്രത വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶקְרָע
  choice: ഞാൻ കീറിയെടുക്കുകയില്ല
  rationale: קָרַע എന്ന ക്രിയയുടെ സജീവമായ ‘കീറുക’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് രാജ്യം നീക്കിക്കളയുന്ന രാഷ്ട്രീയസന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: שֵׁבֶט אֶחָד
  choice: ഒരു ഗോത്രം
  rationale: രാജ്യവിഭജനത്തിന്റെ സന്ദർഭത്തിൽ שֵׁבֶט ഒരു ദണ്ഡിനെയോ ചെങ്കോലിനെയോ അല്ല, ഇസ്രായേലിലെ ഒരു ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: നിന്റെ മകനു ഞാൻ കൊടുക്കും
  rationale: മൂലത്തിലെ ലളിതമായ ദാനഭാഷയും ഭാവികാലവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: എന്റെ ദാസനായ ദാവീദ് നിമിത്തം
  rationale: ദൈവത്തിന്റെ പരിഗണനയെയോ കാരണത്തെയോ സൂചിപ്പിക്കുന്ന לְמַעַן എന്നതിനെ അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: യെരൂശലേം നിമിത്തം
  rationale: മുൻപത്തെ לְמַעַן പ്രയോഗത്തോടുള്ള സമാന്തരതയും ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: ഞാൻ തിരഞ്ഞെടുത്ത
  rationale: ദൈവം മുമ്പ് നടത്തിയതും ഇപ്പോഴും പ്രസക്തിയുള്ളതുമായ തിരഞ്ഞെടുപ്പിനെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ഒരു ഗോത്രം നിലനിർത്താനുള്ള കാരണം
  choice: ദാവീദ് നിമിത്തവും ദൈവം തിരഞ്ഞെടുത്ത യെരൂശലേം നിമിത്തവും രാജ്യം ഭാഗികമായി നിലനിർത്തപ്പെടുന്നു എന്ന രണ്ട് സമാന്തര കാരണങ്ങളും തുല്യമായി നിലനിർത്തി.
  alternative: ഇത് ദാവീദിക ഉടമ്പടി കൊണ്ടുമാത്രമാണെന്നോ, പ്രധാനമായും ദേവാലയനഗരം കൊണ്ടാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: എബ്രായപാഠം ദാവീദിനെയും യെരൂശലേമിനെയും വേർതിരിച്ചെങ്കിലും സമാന്തരമായ കാരണങ്ങളായി പറയുന്നു. ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കാതെയും കൂടുതൽ സിദ്ധാന്തവ്യവസ്ഥ ചേർക്കാതെയും രണ്ടും പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ നീണ്ട കാരണവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടാമത്തെ വാക്യത്തിൽ ‘അങ്ങനെ ചെയ്യുന്നത്’ എന്നു ചേർത്ത് അവതരിപ്പിച്ചെങ്കിലും ദാവീദും യെരൂശലേമും എന്ന രണ്ട് കാരണങ്ങളുടെ സമാന്തരത നിലനിർത്തി.
