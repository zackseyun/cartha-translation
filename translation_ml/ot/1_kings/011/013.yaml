    rationale: The Hebrew ends with two coordinated motive phrases, “for the sake of David my servant and for the sake of Jerusalem which I have chosen.” Adding “this is why I do so” recasts them as an explanatory independent statement and adds aspect not expressed in the source.
  - severity: low
    issue: The footnote's proposed alternative, “എന്നാൽ ഒരു കാര്യം മാത്രം,” is more expansive than the lexical alternative.
    rationale: רַק can introduce a limiting qualification, but “ഒരു കാര്യം” is not represented in the Hebrew. The note should present the alternative without supplying that extra noun.
