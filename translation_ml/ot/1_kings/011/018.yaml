source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: ml
  text: അവർ മിദ്യാനിൽനിന്ന് പുറപ്പെട്ട് പാരാനിലെത്തി. പാരാനിൽനിന്ന് പുരുഷന്മാരെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ട് അവർ ഈജിപ്തിലേക്കു വന്ന്, ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ അടുക്കൽ എത്തി. ഫറവോൻ അവന് ഒരു വീടു നൽകി, അവനു ഭക്ഷണം ഏർപ്പെടുത്തി[a], ഭൂമിയും നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ, “അപ്പം അവനോടു പറഞ്ഞു.” ഫറവോൻ അവനുവേണ്ടി ഭക്ഷണം നൽകാൻ കല്പിച്ചു അഥവാ ഭക്ഷണസൗകര്യം ഏർപ്പെടുത്തി എന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: קום എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എഴുന്നേൽക്കുക’ എന്നാണെങ്കിലും യാത്രാവിവരണത്തിൽ അത് ‘പുറപ്പെടുക’ എന്ന പ്രയോഗാർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ യാത്രാഭാഷ തിരഞ്ഞെടുത്തു.
- source_word: מִמִּדְיָן
  choice: മിദ്യാനിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണത്തിൽ നിലനിർത്തി.
- source_word: פָּארָן
  choice: പാരാൻ
  rationale: ഹീബ്രു സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: പാരാനിൽനിന്ന് പുരുഷന്മാരെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ട്
  rationale: אֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനം ‘പുരുഷന്മാർ’ എന്നു കൃത്യമായി നൽകി; സംഘത്തിൽ അവരെയും ചേർത്തുകൊണ്ടുപോയെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: ഈ സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള ആധുനിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ അടുക്കൽ
  rationale: ഹീബ്രുവിലെ സമാനാധികരണ ഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: ഫറവോൻ അവന് ഒരു വീടു നൽകി
  rationale: മുൻവാക്യത്തിലെ ഫറവോനാണ് ക്രിയയുടെ കർത്താവെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കി; בַיִת എന്നത് വികസിപ്പിക്കാതെ ‘വീട്’ എന്നു തന്നെയാക്കി.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: അവനു ഭക്ഷണം ഏർപ്പെടുത്തി
  rationale: മസോറെറ്റിക് പാഠത്തിലെ അസാധാരണമായ ‘അപ്പം അവനോടു പറഞ്ഞു’ എന്ന പദക്രമം, ഫറവോൻ അവനുവേണ്ടി ആഹാരസൗകര്യം നിശ്ചയിച്ചു എന്ന സന്ദർഭോചിത അർഥത്തിൽ നൽകി; പാഠത്തിന്റെ പ്രത്യേകത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: ഭൂമിയും നൽകി
  rationale: אֶרֶץ ഇവിടെ ഒരു രാജ്യമെന്നതിലുപരി അനുവദിച്ച ഭൂമി അഥവാ സ്ഥലസ്വത്താണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ വിശാലവും സ്വാഭാവികവുമായ ‘ഭൂമി’ തിരഞ്ഞെടുത്തു.
