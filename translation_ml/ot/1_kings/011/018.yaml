  to: അവർ മിദ്യാനിൽനിന്ന് പുറപ്പെട്ട് പാരാനിലെത്തി. പാരാനിൽനിന്ന് പുരുഷന്മാരെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ട് അവർ ഈജിപ്തിലേക്കു വന്ന്, ഈജിപ്തിലെ രാജാവായ ഫറവോന്റെ അടുക്കൽ എത്തി. ഫറവോൻ അവന് ഒരു വീടു നൽകി, അവനു ഭക്ഷണം ഏർപ്പെടുത്തി[a], ഭൂമിയും നൽകി.
