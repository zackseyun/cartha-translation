    rationale: ഹീബ്രുവിലെ ‘ഈജിപ്തിലേക്കു ... ഫറവോന്റെ അടുക്കൽ’ എന്ന തുടർച്ച മലയാളത്തിൽ രണ്ട് ക്രിയകളിലൂടെ (‘വന്ന് ... എത്തി’) നൽകുമ്പോൾ വായന കൂടുതൽ സുതാര്യമാകുന്നു; അർഥത്തിൽ മാറ്റമില്ല.
