translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഹീബ്രു വിവരണശൈലിയിലെ സംഭവക്രമം നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. അസാധാരണമായ וְלֶחֶם אָמַר לוֹ എന്ന വായനയുടെ രൂപവും അർഥസാധ്യതയും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
