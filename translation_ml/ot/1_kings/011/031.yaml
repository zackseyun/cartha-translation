reference: 1 Kings 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: ml
  text: 'അവൻ യൊരോബെയാമിനോടു പറഞ്ഞു: “നിനക്കായി പത്ത് കഷണങ്ങൾ[a] എടുത്തുകൊള്ളുക; കാരണം, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെ ഇപ്രകാരം പറയുന്നു: ‘ഇതാ, ഞാൻ ശലോമോന്റെ കൈയിൽനിന്ന് രാജ്യം കീറിയെടുക്കുന്നു; ഞാൻ നിനക്കു പത്ത് ഗോത്രങ്ങൾ തരും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കീറിയെടുത്ത പത്ത് കഷണങ്ങൾ.” ഹീബ്രായ നാമം കീറലിലൂടെ ഉണ്ടായ കഷണങ്ങളെ സൂചിപ്പിക്കുന്നു; അഹീയാവ് വസ്ത്രം കീറി നടത്തിയ പ്രതീകാത്മക പ്രവൃത്തിയുമായി ഇത് പൊരുത്തപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: നിനക്കായി ... എടുത്തുകൊള്ളുക
  rationale: കַח എന്ന ആജ്ഞയും לְךָ നൽകുന്ന വ്യക്തിപരമായ ‘നിനക്കായി/നിനക്കുതന്നെ’ എന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קְרָעִים
  choice: കഷണങ്ങൾ
  rationale: קרע (‘കീറുക’) എന്ന ധാതുവിൽനിന്നുള്ള ഈ നാമം കീറിയുണ്ടാക്കിയ വസ്ത്രക്കഷണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യവാചകത്തിൽ ‘കഷണങ്ങൾ’ സ്വാഭാവികമാണ്; കീറിയ കഷണങ്ങൾ എന്ന ധ്വനി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי כֹה אָמַר
  choice: ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയും ‘ഇങ്ങനെ പറയുന്നു’ എന്ന അടിസ്ഥാനാർഥവും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന് അനുയോജ്യമായി മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ സ്വാഭാവിക മലയാള ഷഷ്ഠീബന്ധമായി നൽകുന്നു.
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള ദൈവിക പ്രവർത്തനത്തിന് തത്സമയഭാവം നൽകുകയും ചെയ്യുന്നു; അതിപുരാതനമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: קֹרֵעַ
  choice: കീറിയെടുക്കുന്നു
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ സജീവവും ദൃശ്യവുമായ പ്രവാചകപ്രഖ്യാപനഭാവം നിലനിർത്തുന്നു; രാജ്യം ശലോമോന്റെ അധികാരത്തിൽനിന്ന് വേർപെടുത്തുന്നതും വ്യക്തമാക്കുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: ഭരണരാജ്യത്തെയും അധികാരമേഖലയെയും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാള പദം.
- source_word: מִיַּד שְׁלֹמֹה
  choice: ശലോമോന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരമോ കൈവശമോ നഷ്ടപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ ‘കൈ’ എന്ന രൂപകം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וְנָתַתִּי לְךָ
  choice: നിനക്കു തരും
  rationale: ഹീബ്രായ പൂർണരൂപം പ്രവാചകപ്രസംഗത്തിൽ ഉറപ്പുള്ള ഭാവിക്രിയയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായ ഭാവികാലം ഉപയോഗിക്കുന്നു.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: പത്തു ഗോത്രങ്ങൾ
  rationale: സംഖ്യയോടുകൂടിയ നിർദ്ദിഷ്ട ഗോത്രഘടകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ Yahweh എന്ന രൂപത്തിന് സമീപമായി ലിപ്യന്തരം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ഹീബ്രായ നാമത്തിന്റെ സാധ്യതയുള്ള ഉച്ചാരണത്തോട് ഇത് അടുത്തതാണ്.
- issue: കֹרֵעַ എന്ന കൃദന്തരൂപത്തിന്റെ കാലഭാവം
  choice: കീറിയെടുക്കുന്നു
  alternative: കീറിയെടുക്കാൻ പോകുന്നു / കീറിയെടുക്കും
  rationale: പ്രവാചകവചനത്തിലെ പ്രവർത്തനത്തെ സജീവവും നടന്നുകൊണ്ടിരിക്കുന്നതുപോലെയും അവതരിപ്പിക്കുന്ന ഹീബ്രായ കൃദന്തരൂപത്തിന്റെ ഉദ്ദേശ്യപൂർണമായ സംഘർഷം നിലനിർത്തുന്നു; അതിനെ വെറും സാധാരണ ഭാവികാലമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പ്രവാചകപ്രഖ്യാപനത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ഗൗരവമുള്ളതെങ്കിലും പൊതുവേ ഗ്രഹിക്കാവുന്ന പ്രയോഗം ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ ‘കൈ’യും ‘കീറുക’യും എന്ന ദൃശ്യരൂപങ്ങൾ നിലനിർത്തി.
