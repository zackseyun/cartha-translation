id: 1KI.11.41
reference: 1 Kings 11:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י שְׁלֹמֹ֛ה וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/חָכְמָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתֻבִ֔ים עַל סֵ֖פֶר דִּבְרֵ֥י שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: ml
  text: ശലോമോന്റെ മറ്റുള്ള പ്രവൃത്തികളും അവൻ ചെയ്ത സകലവും അവന്റെ ജ്ഞാനവും—ഇവ ശലോമോന്റെ പ്രവൃത്തികളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടുണ്ടല്ലോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശലോമോന്റെ വൃത്താന്തങ്ങളുടെ പുസ്തകം.’ എബ്രായ ശീർഷകത്തിൽ അക്ഷരാർഥത്തിൽ ‘ശലോമോന്റെ വാക്കുകൾ/കാര്യങ്ങൾ’ എന്നാണുള്ളത്; ഇവിടെ അത് അവന്റെ പ്രവൃത്തികളുടെ രേഖയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ മറ്റുള്ള പ്രവൃത്തികൾ
  rationale: יֶתֶר ശേഷിക്കുന്നവയെ സൂചിപ്പിക്കുന്നു; രാജവാഴ്ചയുടെ സമാപനസൂത്രവാക്യത്തിൽ דִּבְרֵי എന്നത് വെറും ‘വാക്കുകൾ’ എന്നതിലുപരി രാജാവിന്റെ കാര്യങ്ങളെയോ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത സകലവും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് അധികവിശദീകരണം ചേർക്കാതെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
- source_word: וְחָכְמָתוֹ
  choice: അവന്റെ ജ്ഞാനം
  rationale: സർവനാമപ്രത്യയമുള്ള നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ; ശലോമോന്റെ ശ്രദ്ധേയമായ ജ്ഞാനത്തെ പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: ഇവ ... എഴുതിയിട്ടുണ്ടല്ലോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഉണ്ടല്ലോ?’ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകത്തിന്റെ/ചുരുളിന്റെ മേൽ’ എന്നാണെങ്കിലും, രേഖയെ ഉദ്ധരിക്കുന്ന സാഹചര്യത്തിൽ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ എഴുതിയിരിക്കുന്നു’ എന്നതാണ് സ്വാഭാവികം.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ പ്രവൃത്തികളുടെ പുസ്തകം
  rationale: ശലോമോന്റെ ഭരണകാര്യങ്ങൾ രേഖപ്പെടുത്തിയ ഒരു സ്രോതസ്സിന്റെ ശീർഷകമാണിത്. דִּבְרֵי എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം ‘പ്രവൃത്തികൾ’ എന്നു നൽകി; ‘വൃത്താന്തങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അലങ്കാരചോദ്യം പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തി; ആവർത്തനവും പട്ടികാസ്വഭാവവും പരമാവധി സംരക്ഷിച്ചു.
