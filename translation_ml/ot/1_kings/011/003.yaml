revisions:
- from: അവന് രാജകുമാരിമാരായ എഴുനൂറു ഭാര്യമാരും മുന്നൂറു വെപ്പാട്ടികളും ഉണ്ടായിരുന്നു; അവന്റെ ഭാര്യമാർ അവന്റെ ഹൃദയത്തെ വഴിതിരിച്ചുകളഞ്ഞു.
  to: അവന് രാജകുമാരിമാരായ[a] എഴുനൂറ് ഭാര്യമാരും മുന്നൂറ് വെപ്പാട്ടികളും ഉണ്ടായിരുന്നു; അവന്റെ ഭാര്യമാർ അവന്റെ ഹൃദയത്തെ വഴിതിരിച്ചുവിട്ടു.
  rationale: മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ “രാജകുമാരിമാരായ” നിലനിർത്തി; എന്നാൽ മൂലപദത്തിന്റെ വിശാലമായ സാമൂഹിക-പദവി അർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു. അവസാന ക്രിയയെ കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിലേക്ക് മാറ്റി, മൂലവാക്യത്തിലെ വ്യാഖ്യാനപരമായ തുറന്ന നില നിലനിർത്തി.
