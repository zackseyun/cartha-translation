id: 1KI.11.3
reference: 1 Kings 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: ml
  text: അവന് രാജകുമാരിമാരായ[a] എഴുനൂറ് ഭാര്യമാരും മുന്നൂറ് വെപ്പാട്ടികളും ഉണ്ടായിരുന്നു; അവന്റെ ഭാര്യമാർ അവന്റെ ഹൃദയത്തെ വഴിതിരിച്ചുവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഉന്നതപദവിയിലുള്ള സ്ത്രീകൾ.”
    reason: ശָׂרוֹת എന്ന എബ്രായപദത്തിന് “രാജകുമാരിമാർ” എന്ന അർഥത്തിനൊപ്പം ഉയർന്ന പദവിയുള്ള സ്ത്രീകൾ എന്ന വിശാലമായ അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: അവന് ... ഉണ്ടായിരുന്നു
  rationale: היה + ל എന്ന എബ്രായ പ്രയോഗം ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന് ... ഉണ്ടായിരുന്നു’ എന്ന് നൽകി.
- source_word: נָשִׁים שָׂרוֹת
  choice: രാജകുമാരിമാരായ ... ഭാര്യമാർ
  rationale: נָשִׁים ഇവിടെ ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്; שָׂרוֹת ഉന്നത രാജകീയ പദവിയുള്ള സ്ത്രീകളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജകുമാരിമാരായ’ എന്നു നൽകി.
- source_word: שְׁבַע מֵאוֹת
  choice: എഴുനൂറു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וּפִלַגְשִׁים
  choice: വെപ്പാട്ടികളും
  rationale: פִלֶגֶשׁ അംഗീകൃതമായിരുന്നെങ്കിലും ഭാര്യമാരേക്കാൾ താഴ്ന്ന പദവിയിലുള്ള ദാമ്പത്യ/ലൈംഗിക പങ്കാളിയെ സൂചിപ്പിക്കുന്നു; ആ വ്യത്യാസം മലയാളത്തിലെ പരിചിതമായ ‘വെപ്പാട്ടി’ നിലനിർത്തുന്നു.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: മുന്നൂറു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וַיַּטּוּ
  choice: വഴിതിരിച്ചുകളഞ്ഞു
  rationale: נטה ഇവിടെ ദിശമാറ്റുന്നതിനെയും സന്ദർഭത്തിൽ വിശ്വസ്തതയിൽനിന്നുള്ള വ്യതിചലനത്തെയും സൂചിപ്പിക്കുന്നു; കാരണം വ്യക്തമാക്കിക്കൂട്ടാതെ ഈ ചലനാർഥം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָשָׁיו
  choice: അവന്റെ ഭാര്യമാർ
  rationale: അവസാന ഉപവാക്യത്തിലെ കർത്താവ് പ്രത്യേകമായി അവന്റെ ഭാര്യമാരാണ്.
- source_word: אֶת לִבּוֹ
  choice: അവന്റെ ഹൃദയത്തെ
  rationale: לֵב വികാരം മാത്രമല്ല, ചിന്ത, ഇച്ഛ, ഉള്ളിലെ വിശ്വസ്തത എന്നിവയും ഉൾക്കൊള്ളുന്നു; ‘ഹൃദയം’ ഈ സമ്പന്നതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ഹൃദയം’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ശലോമോന്റെ ഉള്ളിലെ വിശ്വസ്തത, ഇച്ഛ, ഭക്തി എന്നിവ ഉൾക്കൊള്ളുന്ന ‘ഹൃദയം’ എന്ന പദം അതേപടി നിലനിർത്തി.
  alternative: വികാരപരമായ സ്നേഹമാറ്റം മാത്രമായി വ്യക്തമാക്കുക.
  rationale: എബ്രായ ചിന്തയിൽ ‘ഹൃദയം’ വികാരത്തിനു പുറമേ ബുദ്ധി, ഇച്ഛ, അനുസരണം എന്നിവയെയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സന്ദർഭം യഹോവയോടുള്ള വിശ്വസ്തതയിൽനിന്നുള്ള വ്യതിചലനമാണെങ്കിലും, ഈ വാക്യത്തിൽ അതിനെ വിശദീകരിച്ച് ചേർക്കാതെ മൂലപാഠത്തിന്റെ വ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമേറിയതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ രണ്ട് വിഭാഗങ്ങൾ—രാജകീയ പദവിയുള്ള ഭാര്യമാരും വെപ്പാട്ടികളും—വ്യക്തമായി വേർതിരിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
