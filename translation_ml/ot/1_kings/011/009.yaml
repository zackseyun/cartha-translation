id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: ml
  text: യഹ്‌വെ ശലോമോനോടു കോപിച്ചു; കാരണം, അവന്റെ ഹൃദയം ഇസ്രായേലിന്റെ ദൈവമായ, അവനു രണ്ടുപ്രാവശ്യം പ്രത്യക്ഷനായ യഹ്‌വെയിൽനിന്ന് തിരിഞ്ഞുപോയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: കോപിച്ചു
  rationale: ക്രിയ ദൈവത്തിന്റെ കോപത്തിന്റെ പ്രകടനത്തെ സൂചിപ്പിക്കുന്നു. ‘കോപിച്ചു’ എന്നത് അതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘അതിക്രുദ്ധനായി’ എന്ന അതിശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ശബ്ദലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בִּשְׁלֹמֹה
  choice: ശലോമോനോടു
  rationale: കോപക്രിയയോടൊപ്പമുള്ള בְּ ഇവിടെ കോപം ആരോടാണെന്നു സൂചിപ്പിക്കുന്നു; ‘ശലോമോനോടു കോപിച്ചു’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: യഹ്‌വെയുടെ കോപത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: נָטָה לְבָבוֹ
  choice: അവന്റെ ഹൃദയം അകന്നുപോയിരുന്നു
  rationale: ഹൃദയം ചായുക/തിരിയുക എന്ന മൂലരൂപകം പൂർണമായി ഉപേക്ഷിക്കാതെ, വിശ്വസ്തതയിൽനിന്നുള്ള അകൽച്ചയെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു. മുൻപേ സംഭവിച്ച മാറ്റം സൂചിപ്പിക്കാൻ പൂർവകാലസമ്പൂർണ ഭാവം ഉപയോഗിക്കുന്നു.
- source_word: מֵעִם
  choice: യിൽനിന്ന്
  rationale: ബന്ധത്തിലും വിശ്വസ്തതയിലും നിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു; ‘അകന്നുപോയിരുന്നു’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമാണ്.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വെയെ ഇസ്രായേലിന്റെ ദൈവമായി തിരിച്ചറിയുന്ന നിർമാണം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: הַנִּרְאָה אֵלָיו
  choice: തനിക്കു പ്രത്യക്ഷനായ
  rationale: നിശ്ചയാർഥക കർത്തൃവാചക കൃദന്തത്തെ യഹ്‌വെയെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു; പ്രത്യക്ഷപ്പെടലുകൾ മുൻകാലത്തേതാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: פַּעֲמָיִם
  choice: രണ്ടുപ്രാവശ്യം
  rationale: ദ്വിവചനരൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനപദം.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ പകരാതെ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകുന്നു.
- issue: ദൈവകോപത്തിന്റെ മനുഷ്യാനുരൂപ ഭാഷ
  choice: കോപിച്ചു
  alternative: അതൃപ്തനായി; അതിക്രുദ്ധനായി
  rationale: ശലോമോന്റെ വിശ്വാസത്യാഗത്തോടുള്ള ദൈവകോപം മൂലപാഠം നേരിട്ട് പ്രസ്താവിക്കുന്നു. അതിനെ മയപ്പെടുത്തുകയോ മൂലത്തേക്കാൾ തീവ്രമാക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ‘ഹൃദയം അകന്നുപോയി’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: രൂപകവും ബന്ധപരമായ അകൽച്ചയും നിലനിർത്തുന്നു
  alternative: അവൻ യഹ്‌വെയെ ഉപേക്ഷിച്ചു
  rationale: മൂലപാഠം ശലോമോന്റെ പ്രവൃത്തിയെ നേരിട്ട് ചുരുക്കിപ്പറയാതെ അവന്റെ ‘ഹൃദയം’ യഹ്‌വെയിൽനിന്ന് തിരിഞ്ഞതായി പറയുന്നു. അതിനാൽ ഉള്ളന്തരമായ വിശ്വസ്തതാമാറ്റവും അതിലെ രൂപകപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യനിർമാണം. ദൈവനാമം ‘യഹ്‌വെ’ എന്നു നിലനിർത്തുന്നു. വാക്യത്തിലെ പ്രധാന ഊന്നൽ ശലോമോന്റെ ഹൃദയത്തിന്റെ അകൽച്ചയിലാണ്; ‘രണ്ടുപ്രാവശ്യം തനിക്കു പ്രത്യക്ഷനായ’ എന്ന ബന്ധവാക്യം അതിനെ ശക്തിപ്പെടുത്തുന്ന സ്ഥാനത്ത് ചേർത്തിരിക്കുന്നു.
