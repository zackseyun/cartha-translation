base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: ml
  text: ഹദദ് ഫറവോന്റെ ദൃഷ്ടിയിൽ വളരെ പ്രീതി നേടി. ഫറവോൻ തന്റെ ഭാര്യയുടെ സഹോദരിയെ[a]—അതായത്, രാജമാതാവായ[b] തഹ്പെനേസിന്റെ സഹോദരിയെ—ഹദദിനു ഭാര്യയായി കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ഭാര്യ’ എന്നത് മിക്കവാറും ഫറവോന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നു; സാധ്യത കുറവാണെങ്കിലും ഹദദിന്റെ ഭാര്യയെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ ‘പ്രമുഖ വനിത’ എന്ന രാജകീയ പദവി; ഇത് രാജമാതാവിനെയോ രാജകുടുംബത്തിലെ മുഖ്യ വനിതയെയോ സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ വളരെ പ്രീതി ലഭിച്ചു
  rationale: ‘ഒരാളുടെ കണ്ണുകളിൽ കൃപ കണ്ടെത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פַרְעֹה
  choice: ഫറവോൻ
  rationale: ഈജിപ്തിലെ രാജാവിന്റെ പദവിക്കുള്ള മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ രൂപം.
- source_word: מְאֹד
  choice: വളരെ
  rationale: ഹദദിനു ലഭിച്ച പ്രീതിയുടെ അളവ് ശക്തിപ്പെടുത്തുന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: ഹദദിനു ഭാര്യയായി കൊടുത്തു
  rationale: സ്ത്രീയെ വിവാഹബന്ധത്തിൽ നൽകിയെന്ന ആശയം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘കൊടുത്തു’ എന്ന മൂലക്രിയയും നിലനിർത്തുന്നു.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: തന്റെ ഭാര്യയുടെ സഹോദരിയെ
  rationale: സന്ദർഭത്തിൽ ‘തന്റെ’ എന്ന സർവനാമം ഫറവോനെ സൂചിപ്പിക്കുന്നതായാണ് പ്രധാന വായന; എങ്കിലും മൂലത്തിലെ സർവനാമസംബന്ധമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: തഹ്പെനേസിന്റെ സഹോദരിയെ
  rationale: മുൻപറഞ്ഞ സ്ത്രീ ആരാണെന്ന് സമാനാധികരണമായി വ്യക്തമാക്കുന്ന എബ്രായ ഘടന നിലനിർത്തുന്നു.
- source_word: תַּחְפְּנֵיס
  choice: തഹ്പെനേസ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: הַגְּבִירָה
  choice: രാജമാതാവ്
  rationale: ഉന്നതസ്ഥാനമുള്ള രാജകീയ സ്ത്രീയെ സൂചിപ്പിക്കുന്ന പദവിയുടെ സാധാരണ ബൈബിൾസന്ദർഭാർത്ഥം; കൃത്യമായ ഈജിപ്ഷ്യൻ രാജസഭാപദവി അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘തന്റെ ഭാര്യയുടെ സഹോദരി’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ‘തന്റെ’ എന്നത് ഫറവോനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘തന്റെ’ എന്നത് ഹദദിനെ സൂചിപ്പിക്കാം.
  rationale: തുടർന്നുള്ള ‘തഹ്പെനേസിന്റെ സഹോദരി’ എന്ന സമാനാധികരണവും ഈജിപ്ഷ്യൻ രാജകുടുംബവുമായി ഹദദിനുണ്ടായ വിവാഹബന്ധം വിവരിക്കുന്ന സന്ദർഭവും ഫറവോനെയാണ് കൂടുതൽ സാധ്യതയുള്ള സൂചിതനാക്കുന്നത്; എന്നാൽ വ്യാകരണപരമായ അവ്യക്തത പൂർണമായി മറച്ചിട്ടില്ല.
- issue: הַגְּבִירָה എന്ന രാജകീയ പദവിയുടെ അർഥം
  choice: രാജമാതാവ്
  alternative: പ്രധാന രാജകീയ വനിത / മഹതി
  rationale: പഴയനിയമത്തിൽ ഈ പദം പലപ്പോഴും രാജമാതാവിനെയോ രാജസഭയിലെ പരമോന്നത വനിതയെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘രാജമാതാവ്’ പ്രധാന പരിഭാഷയായി സ്വീകരിച്ചെങ്കിലും ഈജിപ്ഷ്യൻ സാഹചര്യത്തിലെ പദവി കൃത്യമായി അതുതന്നെയാണോ എന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ദൃഷ്ടിയിൽ പ്രീതി ലഭിച്ചു’ എന്ന രൂപം മൂലത്തിലെ പ്രയോഗഭംഗി നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ദീർഘമായ ബന്ധവിവരണം ഡാഷുകൾ ഉപയോഗിച്ച് വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
