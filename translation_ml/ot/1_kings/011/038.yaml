id: 1KI.11.38
reference: 1 Kings 11:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: ml
  text: ഞാൻ നിന്നോടു കൽപ്പിക്കുന്നതെല്ലാം നീ ശ്രദ്ധിച്ചു കേൾക്കുകയും, എന്റെ വഴികളിൽ നടക്കുകയും, എന്റെ ദാസനായ ദാവീദ് ചെയ്തതുപോലെ എന്റെ ചട്ടങ്ങളും കൽപ്പനകളും പാലിച്ചുകൊണ്ട് എന്റെ ദൃഷ്ടിയിൽ ശരിയായത് ചെയ്യുകയും ചെയ്താൽ, ഞാൻ നിന്നോടുകൂടെ ഉണ്ടായിരിക്കും; ദാവീദിനുവേണ്ടി പണിതതുപോലെ നിനക്കുവേണ്ടിയും സ്ഥിരമായ ഒരു ഭവനം[a] പണിയും; ഇസ്രായേലിനെ നിനക്കു തരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിലനിൽക്കുന്ന ഭവനം,’ ‘ഉറപ്പുള്ള ഭവനം,’ അല്ലെങ്കിൽ ‘വിശ്വസ്തമായ ഭവനം’ എന്നും പരിഭാഷപ്പെടുത്താം; അതായത്, നിലനിൽക്കുന്ന ഒരു രാജവംശം.
    reason: בַיִת נֶאֱמָן എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തിയും ‘ഭവനം’ എന്നതിന്റെ രാജവംശപരമായ അർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ശ്രദ്ധിച്ചു കേൾക്കുക
  rationale: ശׁמע എന്ന പദത്തിന്റെ കേൾക്കുക, ശ്രദ്ധിക്കുക, അനുസരിക്കുക എന്നീ അർഥവ്യാപ്തികളിൽ, തുടർന്നുള്ള അനുസരണവാക്യങ്ങൾ പശ്ചാത്തലം വ്യക്തമാക്കുന്നതിനാൽ ശ്രവണരൂപകം നിലനിർത്തുന്നു.
- source_word: אֲצַוֶּךָ
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്ന
  rationale: നിബന്ധനാപരമായ ഈ നേരിട്ടുള്ള ദൈവവചനത്തിൽ വർത്തമാന-ഭാവി പ്രാബല്യമുള്ള കല്പനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: എന്റെ വഴികളിൽ നടക്കുക
  rationale: ഉടമ്പടിയോടുള്ള വിശ്വസ്തജീവിതത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: എന്റെ ദൃഷ്ടിയിൽ ശരിയായത്
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ ധാർമ്മികമായി ശരിയായതെന്ന ആശയവും ദൃഷ്ടിസംബന്ധിയായ മൂലപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: לִשְׁמֹר
  choice: പാലിച്ചുകൊണ്ട്
  rationale: ശരിയായതു ചെയ്യുന്നതിന്റെ രീതിയാണ് ചട്ടങ്ങളും കല്പനകളും പാലിക്കൽ എന്നു വാക്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: חֻקּוֹתַי
  choice: എന്റെ ചട്ടങ്ങൾ
  rationale: ഉടമ്പടി-നിയമ പശ്ചാത്തലത്തിലുള്ള സ്ഥിരനിർദേശങ്ങളെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִצְוֺתַי
  choice: എന്റെ കല്പനകൾ
  rationale: ദൈവിക ആജ്ഞകളുടെ ഔപചാരിക സ്വഭാവം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസൻ
  rationale: ദാവീദിന്റെ ദൈവസേവനത്തെയും ബഹുമാനപദവിയെയും സൂചിപ്പിക്കുന്ന രാജകീയ-ദൈവശാസ്ത്രപരമായ പ്രയോഗത്തിന് യോജിക്കുന്നു.
- source_word: בַיִת נֶאֱמָן
  choice: സ്ഥിരമായ ഒരു ഭവനം
  rationale: נֶאֱמָן എന്നതിലെ ഉറപ്പ്, സ്ഥിരത, നിലനിൽപ്പ് എന്നീ ആശയങ്ങൾ രാജവംശപരമായ സന്ദർഭത്തിൽ അറിയിക്കുന്നു; ഭവനം എന്ന ബൈബിൾരൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: בַיִת
  choice: ഭവനം
  rationale: ഇവിടെ രാജവംശമാണ് ഉദ്ദേശ്യമെങ്കിലും ദാവീദിനോടുള്ള വാഗ്ദാനവുമായി ബന്ധിപ്പിക്കുന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ നിനക്കു തരും
  rationale: ദൈവം നൽകുന്ന വസ്തുവായി ഇസ്രായേലിനെ മുൻനിർത്തുന്ന മൂലവാക്യഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാഗ്ദാനത്തിലെ ‘ഭവനം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഭവനം’ നിലനിർത്തി രാജകീയ വംശപരമ്പരയെ ഉദ്ദേശിക്കുന്നു
  alternative: ഭൗതികമായ വീട് അഥവാ കൊട്ടാരം
  rationale: രാജാധികാരത്തിന്റെ തുടർച്ചയും ദാവീദിനുവേണ്ടി ദൈവം പണിത ഭവനത്തോടുള്ള താരതമ്യവും ഇവിടെ നിലനിൽക്കുന്ന രാജവംശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു.
- issue: വാഗ്ദാനത്തിന്റെ നിബന്ധനാപരമായ സ്വഭാവം
  choice: യൊരോബെയാമിന്റെ അനുസരണത്തെ ആശ്രയിച്ച യഥാർഥ നിബന്ധനാപരമായ വാഗ്ദാനം
  alternative: നിരുപാധികമായ ദാനം
  rationale: אִם എന്ന നിബന്ധനാസൂചകവും തുടർന്നുള്ള അനുസരണവാക്യങ്ങളും വാഗ്ദാനത്തെ വ്യക്തമായി നിബന്ധനാപരമാക്കുന്നു; മലയാളവാക്യത്തിലെ ‘ചെയ്താൽ’ ഇത് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്റെ വഴികളിൽ നടക്കുക,’ ‘എന്റെ ദൃഷ്ടിയിൽ ശരിയായത്,’ ‘ഭവനം പണിയുക’ എന്നീ ബൈബിൾരൂപകങ്ങൾ നിലനിർത്തിയിരിക്കുമ്പോൾ നീണ്ട എബ്രായ വാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന വിധം ബന്ധിപ്പിച്ചിരിക്കുന്നു.
