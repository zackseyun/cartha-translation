  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ വിശാലമായ גִּבּוֹר חָיִל എന്ന പ്രയോഗം സൈനിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കിയിട്ടില്ല. സാംസ്കാരിക കുറിപ്പായ [b] അതിന് യോജിക്കുന്ന ‘യോസേഫ്‌ഗൃഹം’ എന്ന പദത്തിനരികിലേക്ക് വെച്ചു.
