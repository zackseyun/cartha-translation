source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: ml
  text: യൊരോബെയാം എന്ന മനുഷ്യൻ ശക്തനും കഴിവുള്ളവനുമായിരുന്നു[a]. ആ യുവാവ് അധ്വാനശീലനാണെന്ന് ശലോമോൻ കണ്ടു; അതിനാൽ യോസേഫിന്റെ ഗൃഹത്തിലെ[b] മുഴുവൻ നിർബന്ധിതവേലയ്ക്കും മേൽ അവനെ മേൽവിചാരകനായി നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരാക്രമശാലി’ അല്ലെങ്കിൽ ‘പ്രാപ്തനായവൻ.’ എബ്രായപ്രയോഗത്തിന് ശക്തി, വീര്യം, അല്ലെങ്കിൽ ശ്രദ്ധേയമായ കഴിവ് എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യോസേഫിന്റെ ഗൃഹം’ എന്നത് യോസേഫിൽനിന്ന് ഉത്ഭവിച്ച ഗോത്രങ്ങളെ, പ്രത്യേകിച്ച് എഫ്രയീമിനെയും മനശ്ശെയെയും, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: വാക്യത്തിന്റെ ആഖ്യാനബന്ധം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പ്രകടമാകുന്നതിനാൽ, ‘ആ മനുഷ്യൻ’ എന്ന അനാവശ്യമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കി വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചു.
- source_word: גִּבּוֹר חָיִל
  choice: വളരെ കഴിവും കരുത്തുമുള്ളവൻ
  rationale: ഈ പ്രയോഗത്തിന് വീര്യം, ശക്തി, പ്രാപ്തി എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ യുദ്ധസന്ദർഭമല്ല, ഭരണപരമായ ചുമതല ഏൽപ്പിക്കുന്ന സന്ദർഭമാണ്; അതിനാൽ പ്രാപ്തിയും കരുത്തും ഉൾക്കൊള്ളുന്ന വിശാലമായ ഭാഷ തിരഞ്ഞെടുത്തു.
- source_word: הַנַּעַר
  choice: ആ യുവാവ്
  rationale: נַעַר എന്നതിന് ബാലൻ, യുവാവ്, സേവകൻ എന്നീ അർഥങ്ങൾ വരാം. ഉത്തരവാദിത്വമുള്ള ഭരണചുമതല ലഭിക്കുന്ന യൊരോബെയാമിനെ ഇവിടെ ‘യുവാവ്’ എന്നു പറയുന്നതാണ് സന്ദർഭോചിതം.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: അധ്വാനശീലനാണെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവൻ വേല ചെയ്യുന്നവനായിരുന്നു’ എന്ന ആശയം. നിയമനത്തിന് കാരണമാകുന്ന അവന്റെ ഉത്സാഹവും തൊഴിൽപ്രാപ്തിയും സ്വാഭാവിക മലയാളത്തിൽ ‘അധ്വാനശീലൻ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: മേൽനോട്ടം അവനെ ഏൽപ്പിച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള פקד ഇവിടെ ഒരാളെ ഒരു ചുമതലയ്ക്കു മുകളിൽ നിയമിക്കുക എന്ന അർഥത്തിലാണ്.
- source_word: לְכָל סֵבֶל
  choice: മുഴുവൻ നിർബന്ധിതവേലയുടെയും
  rationale: סֵבֶל ഭാരം ചുമക്കുന്ന വേലയെയോ രാജകീയ പദ്ധതികൾക്കായുള്ള നിർബന്ധിത തൊഴിൽസേവനത്തെയോ സൂചിപ്പിക്കുന്നു. ഈ സാമൂഹിക-ഭരണപരമായ അർഥം ‘നിർബന്ധിതവേല’ വ്യക്തമായി നൽകുന്നു.
- source_word: בֵּית יוֹסֵף
  choice: യോസേഫ്‌ഗൃഹത്തിലെ
  rationale: എഫ്രയീമും മനശ്ശെയും ഉൾപ്പെടെ യോസേഫിൽനിന്ന് ഉത്ഭവിച്ച ഗോത്രങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം നിലനിർത്തി.
