source:
  edition: WLC
  text: וְ/לָקַחְתִּ֥י הַ/מְּלוּכָ֖ה מִ/יַּ֣ד בְּנ֑/וֹ וּ/נְתַתִּ֣י/הָ לְּ/ךָ֔ אֵ֖ת עֲשֶׂ֥רֶת הַ/שְּׁבָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ രാജ്യം അവന്റെ മകന്റെ കൈയിൽനിന്ന് എടുത്ത്[a] നിനക്കു പത്തു ഗോത്രങ്ങളെ തരും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അവന്റെ മകന്റെ കൈയിൽനിന്ന്.’ ഒരാളുടെ അധികാരത്തിലോ കൈവശത്തിലോ ഉള്ളത് അവനിൽനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശൈലിയാണിത്.'
    reason: cultural_note
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഞാൻ അതു നിനക്കു തരും, പത്തു ഗോത്രങ്ങളെ.’ നൽകപ്പെടുന്നത് പത്തു ഗോത്രങ്ങളാണെന്ന് അവസാന പദസമുച്ചയം വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: എന്നാൽ ഞാൻ … എടുത്ത്
  rationale: പ്രവാചകപ്രസംഗത്തിൽ ഭാവികാലാർഥം വഹിക്കുന്ന ഒന്നാംപുരുഷ ഏകവചന ക്രിയയാണ്. മുൻസന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; לקח എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘എടുക്കുക’ നിലനിർത്തി.
- source_word: הַמְּלוּכָה
  choice: രാജ്യം
  rationale: ഇവിടെ സോളമോന്റെ വംശത്തിൽനിന്ന് മാറ്റപ്പെടുന്ന രാജകീയ ഭരണാധീനതയെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘രാജ്യം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘രാജാധികാരം’ എന്നതിനെക്കാൾ മൂലപാഠത്തിലെ ആശയവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: מִיַּד בְּנוֹ
  choice: അവന്റെ മകന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തിലോ കൈവശത്തിലോ നിന്നു നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതായതിനാൽ അതിന്റെ ദൃശ്യരൂപം നിലനിർത്തി. സന്ദർഭത്തിൽ ‘അവന്റെ മകൻ’ സോളമോന്റെ മകനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: നിനക്കു തരും
  rationale: സ്ത്രീലിംഗ പ്രത്യയം ‘രാജ്യം’ എന്നതിലേക്കു മടങ്ങുന്നു. മലയാളത്തിൽ കർമം മുമ്പേ പറഞ്ഞിരിക്കുന്നതിനാൽ പ്രത്യയസർവനാമം ആവർത്തിക്കാതെ ഭാവികാലാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: —പത്തു ഗോത്രങ്ങളെ
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ ഈ പദസമുച്ചയം നൽകപ്പെടുന്ന രാജ്യത്തെ ‘പത്തു ഗോത്രങ്ങൾ’ എന്നു വിശദീകരിക്കുന്ന അനുബന്ധപ്രയോഗമാണ്. മൂലപാഠത്തിന്റെ ഘടനയും ചെറിയ വ്യാകരണപിരിമുറുക്കവും അനാവശ്യമായി വ്യാഖ്യാനിച്ച് തീർക്കാതെ ദീർഘവിരാമത്തിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: നൽകപ്പെടുന്ന ‘രാജ്യം’ പൂർണരാജ്യമാണോ, പത്തു ഗോത്രങ്ങളാൽ നിർവചിക്കപ്പെടുന്ന ഭാഗമാണോ എന്ന ബന്ധം
  choice: ‘നിനക്കു തരും—പത്തു ഗോത്രങ്ങളെ’ എന്ന അനുബന്ധഘടന നിലനിർത്തി.
  alternative: ‘പത്തു ഗോത്രങ്ങൾ അടങ്ങുന്ന രാജ്യം നിനക്കു തരും’
  rationale: പത്തു ഗോത്രങ്ങൾ നൽകപ്പെടുന്ന രാജ്യത്തെ വിശദീകരിക്കുന്നു എന്നത് വ്യക്തമാണെങ്കിലും, ‘അടങ്ങുന്ന’ പോലുള്ള പദം ചേർത്ത് മൂലപാഠത്തേക്കാൾ ബന്ധം കൃത്യമായി നിർവചിക്കാതിരിക്കാൻ അനുബന്ധപ്രയോഗം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ രൂപകം മലയാളത്തിലും സുതാര്യമായതിനാൽ നിലനിർത്തി; അപൂർവമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
