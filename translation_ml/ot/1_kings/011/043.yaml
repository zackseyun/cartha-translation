  text: ശലോമോൻ തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു[a]. അവനെ അവന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ അടക്കം ചെയ്തു. അവന്റെ മകൻ രെഹബെയാം അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു” എന്നത് മരണത്തെയും പൂർവികരോടു ചേരുന്നതിനെയും സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടൊപ്പം നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ രാജകീയ ചരമപ്രയോഗത്തിന്റെ രൂപകവും വംശപരമായ ഊന്നലും നിലനിർത്തുന്നു; വെറും ‘മരിച്ചു’ എന്നു പരാവർത്തനം ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഫാൽ രൂപത്തിന്റെ കർമണി അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ നഗരത്തിൽ
  rationale: അടക്കസ്ഥലത്തെയും ദാവീദ് ശലോമോന്റെ പിതാവാണെന്ന വംശപരമായ സൂചനയെയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിൻഗാമിത്വവിവരണത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പ്രയോഗം.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: കേവലം കാലക്രമത്തിലുള്ള ‘അവനുശേഷം’ എന്നതിലുപരി പകരക്കാരനായുള്ള രാജകീയ പിൻഗാമിത്വം വ്യക്തമാക്കുന്നു.
