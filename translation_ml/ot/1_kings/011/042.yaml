  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: ml
  text: ശലോമോൻ യെരൂശലേമിൽ ഇസ്രായേൽ മുഴുവനും ഭരിച്ച കാലം നാൽപ്പത് വർഷമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: കാലം
  rationale: ‘ഭരിച്ച ദിവസങ്ങൾ’ എന്ന എബ്രായ കാലദൈർഘ്യപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഭരിച്ച കാലം’ എന്നു നൽകി; വാക്യാരംഭത്തിലെ וְ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: מָלַךְ
  choice: ഭരിച്ച
  rationale: ഇവിടെ ക്രിയ രാജാവായി അധികാരം നടത്തിയതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: בִ/ירוּשָׁלִַם
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: ב അടിസ്ഥാനമായി സ്ഥലസൂചന നൽകുന്നു; രാജഭരണത്തിന്റെ ആസ്ഥാനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘യെരൂശലേമിൽനിന്ന്’ എന്നു നൽകി.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനെയും
  rationale: עַל രാജകീയ അധികാരത്തിന്റെ പരിധിയെയും כָּל ദേശീയ സമൂഹത്തിന്റെ സമഗ്രതയെയും സൂചിപ്പിക്കുന്നു.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാല്പതു വർഷം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം നേരിട്ട് നൽകുന്ന സംഖ്യാ-നാമ പ്രയോഗം.
