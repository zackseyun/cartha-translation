source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁר֩ מָלַ֨ךְ שְׁלֹמֹ֤ה בִ/ירוּשָׁלִַ֨ם֙ עַל כָּל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָֽה־־׃
base_translation:
