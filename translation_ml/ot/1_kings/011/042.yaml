  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ ‘ദിവസങ്ങൾ’ എന്ന കാലദൈർഘ്യപ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്താതെ സ്വാഭാവികമായ ‘കാലം’ എന്നു പരിഭാഷപ്പെടുത്തി.
