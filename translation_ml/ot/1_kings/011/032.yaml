source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: ml
  text: എന്നാൽ ഒരു ഗോത്രം അവന്റേതായിരിക്കും[a]—എന്റെ ദാസനായ ദാവീദിന്റെ നിമിത്തവും, ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളിൽനിന്നും ഞാൻ തിരഞ്ഞെടുത്ത നഗരമായ യെരൂശലേമിന്റെ നിമിത്തവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായം: ‘ഒരു ഗോത്രം.’ യെരൂശലേമിന്റെ സ്ഥാനം പരിഗണിച്ച്, ബെന്യാമീൻ യെഹൂദായോടു ചേർന്നിരിക്കുന്നതായി ഇത് പലപ്പോഴും മനസ്സിലാക്കപ്പെടുന്നു; എന്നാൽ പാഠം തന്നെ പറയുന്നത് ‘ഒരു ഗോത്രം’ എന്നാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: എന്നാൽ ഒരു ഗോത്രം
  rationale: ശേഷിക്കുന്ന രാജ്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ שֵׁבֶט എന്നത് ‘ഗോത്രം’ എന്നു വിവർത്തനം ചെയ്തു. മുൻവാക്യത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്നത് ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: יִהְיֶה לּוֹ
  choice: അവനുള്ളതായിരിക്കും
  rationale: അക്ഷരാർഥമായ ‘അവന് ആയിരിക്കും’ എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ശേഷിക്കും’ എന്ന സന്ദർഭാർഥം അനാവശ്യമായി മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: לְמַעַן
  choice: പ്രതി
  rationale: ദാവീദിനോടും യെരൂശലേമിനോടുമുള്ള പരിഗണന നിമിത്തമാണെന്ന ആശയം dignified Malayalam-ൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: עַבְדִּי דָוִד
  choice: എന്റെ ദാസനായ ദാവീദ്
  rationale: രാജകീയ-ഉടമ്പടിപരമായ ബഹുമാനപദവി ‘എന്റെ ദാസൻ’ എന്ന നിലയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: നഗരമായ യെരൂശലേം
  rationale: ഹീബ്രായയിലെ സമാനാധികരണ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: ഞാൻ തിരഞ്ഞെടുത്ത
  rationale: ദൈവത്തിന്റെ പൂർത്തിയായ തിരഞ്ഞെടുപ്പിനെ നേരിട്ട് രേഖപ്പെടുത്തുന്നു; בָהּ എന്നത് മലയാളത്തിലെ ക്രിയാഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സകല ഗോത്രങ്ങളിൽനിന്നും
  rationale: തിരഞ്ഞെടുക്കപ്പെട്ട വലിയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന מִן എന്ന വിഭക്തിയുടെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഒരു ഗോത്രം’ എന്ന പരാമർശവും യെഹൂദാ-ബെന്യാമീൻ കണക്കുകളും തമ്മിലുള്ള സംഖ്യാപരമായ സംഘർഷം
  choice: ഹീബ്രായ പാഠത്തിലുള്ളതുപോലെ ‘ഒരു ഗോത്രം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ബെന്യാമീനെ യെഹൂദായിൽ ഉൾപ്പെട്ടതായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ ‘ഒരു രാജ്യം’/‘രണ്ട് ഗോത്രങ്ങൾ’ എന്ന് സമന്വയിപ്പിക്കുക.
  rationale: മൂലപാഠം വ്യക്തമായി ‘ഒരു ഗോത്രം’ എന്നു പറയുന്നു. അതിനാൽ വ്യാഖ്യാനപരമായ സമന്വയം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ, യഥാർഥ പാഠപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവവചനപരമായ ഭാവത്തിന് യോജിച്ച ‘ദാസൻ’, ‘സകല’, ‘യെരൂശലേം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; സംഖ്യാപരമായ പാഠസംഘർഷം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
