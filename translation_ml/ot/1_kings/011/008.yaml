  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: ml
  text: അങ്ങനെതന്നെ, തന്റെ അന്യദേശക്കാരായ എല്ലാ ഭാര്യമാർക്കുവേണ്ടി അവൻ ചെയ്തു[a]. അവർ തങ്ങളുടെ ദേവന്മാർക്ക് ധൂപം കാട്ടുകയും ബലിയർപ്പിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ അന്യദേശക്കാരായ എല്ലാ ഭാര്യമാർക്കും അവൻ അതേവിധം ചെയ്തു.” എന്താണ് ചെയ്തതെന്ന് എബ്രായപാഠം ഇവിടെ വ്യക്തമാക്കാതെ മുൻവാക്യത്തിലേക്കു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: അങ്ങനെതന്നെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രവൃത്തിയിലേക്കു തിരിഞ്ഞുനോക്കി അതേവിധത്തിലുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: עָשָׂה
  choice: അവൻ ചെയ്തു
  rationale: എന്താണ് ചെയ്തതെന്ന് എബ്രായപാഠം ഈ വാക്യത്തിൽ വ്യക്തമാക്കാതെ മുൻവാക്യത്തിൽനിന്നു മനസ്സിലാക്കാൻ വിടുന്നു; അതിനാൽ ക്രിയയുടെ വിശാലവും അപൂർണ്ണവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: തന്റെ അന്യദേശക്കാരായ എല്ലാ ഭാര്യമാർക്കുംവേണ്ടി
  rationale: לְ എന്ന ബന്ധത്തെ ‘വേണ്ടി’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും נָשָׁיו എന്നത് സന്ദർഭാനുസൃതമായി ‘ഭാര്യമാർ’ എന്നും הַנָּכְרִיּוֹת എന്നത് കാലികമായ ‘അന്യദേശക്കാരായ’ എന്നും പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מַקְטִירוֹת
  choice: ധൂപം കാട്ടുകയും ... ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ആരാധനാസന്ദർഭത്തിലെ ധൂപാർപ്പണവും എബ്രായത്തിലെ സ്ത്രീലിംഗ ബഹുവചന കർത്തൃവാചകത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും പ്രകടമാക്കുന്നു.
- source_word: וּמְזַבְּחוֹת
  choice: ബലിയർപ്പിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: യാഗാർപ്പണത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും മുൻപത്തെ കർത്തൃവാചകത്തോടൊപ്പം തുടരുന്ന പ്രവർത്തനമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לֵאלֹהֵיהֶן
  choice: തങ്ങളുടെ ദേവന്മാർക്ക്
  rationale: സ്ത്രീലിംഗ ബഹുവചന പ്രത്യയം ഭാര്യമാരെ സൂചിപ്പിക്കുന്നു; ബഹുവചനമായ אֱלֹהִים ഇവിടെ ഇസ്രായേലിന്റെ ദൈവമല്ലാത്ത അവരുടെ ദേവതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: מַקְטִירוֹת וּמְזַבְּחוֹת എന്നീ കർത്തൃവാചകങ്ങളുടെ കർത്താവ്
  choice: ധൂപം കാട്ടുകയും ബലിയർപ്പിക്കുകയും ചെയ്തത് അന്യദേശക്കാരായ ഭാര്യമാരാണ്.
  alternative: ശലോമോൻ അവർക്കായി ഉണ്ടാക്കിയ ആരാധനാസ്ഥലങ്ങളുമായി ബന്ധപ്പെട്ട ആചാരങ്ങളെ പൊതുവായി വിവരിക്കുന്നതായി വായിക്കാം.
  rationale: സ്ത്രീലിംഗ ബഹുവചന രൂപങ്ങൾ ‘ഭാര്യമാർ’ എന്ന പദത്തോടാണ് നേരിട്ട് പൊരുത്തപ്പെടുന്നത്; അതിനാൽ കർത്തൃത്വം ശലോമോനിലേക്കോ ആരാധനാസ്ഥലങ്ങളിലേക്കോ മാറ്റുന്നില്ല.
- issue: ശലോമോൻ എന്താണ് ‘ചെയ്തത്’ എന്നതിലെ ലോപം
  choice: ‘അവൻ ചെയ്തു’ എന്ന അപൂർണ്ണപ്രയോഗം നിലനിർത്തി, അതിന്റെ ഉള്ളടക്കം മുൻവാക്യം നൽകാൻ വിടുന്നു.
  alternative: ‘അവൻ തന്റെ എല്ലാ അന്യദേശക്കാരായ ഭാര്യമാർക്കും പൂജാഗിരികൾ പണിതു’ അല്ലെങ്കിൽ ‘അവൻ അതുതന്നെ ചെയ്തു’ എന്നു വ്യക്തമാക്കാം.
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം പ്രവൃത്തിയുടെ കർമം തുറന്നുപറയുന്നില്ല; സന്ദർഭത്തിൽനിന്നുള്ള യഥാർഥ ലോപം പരിഭാഷയിൽ അമിതമായി വിശദീകരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്യദേശക്കാരായ’ എന്നത് പഴഞ്ചനായോ അവഹേളനപരമായോ തോന്നാവുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു. പ്രധാനവാക്യത്തിൽ എബ്രായത്തിലെ ലോപവും സ്ത്രീലിംഗ ബഹുവചന കർത്തൃവാചകങ്ങളുടെ തുടരുന്ന പ്രവർത്തനഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
