id: 1KI.11.1
reference: 1 Kings 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: ml
  text: ശലോമോൻ രാജാവ് ഫറവോന്റെ മകളുൾപ്പെടെ അനേകം വിദേശ സ്ത്രീകളെ[a] സ്നേഹിച്ചു—മോവാബ്യ, അമ്മോന്യ, എദോമ്യ, സീദോന്യ, ഹിത്യ സ്ത്രീകളെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനേകം വിദേശ ഭാര്യമാരെ.’ എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അനേകം വിദേശ സ്ത്രീകളെ’ എന്നാണ്; ശലോമോൻ അവരെ ഭാര്യമാരായോ ഉപഭാര്യമാരായോ സ്വീകരിച്ചിരുന്നുവെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക നാമ-സ്ഥാനക്രമത്തിൽ വ്യക്തിനാമത്തിനു ശേഷം പദവി നൽകി. ആരംഭത്തിലെ וְ ആഖ്യാനം തുടരുന്ന ഘടകമാണ്; പ്രസക്തിയില്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: אָהַב
  choice: സ്നേഹിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘സ്നേഹിക്കുക’ നിലനിർത്തുന്നു; ആസക്തി എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: അനേകം വിദേശസ്ത്രീകളെ
  rationale: നָשִׁים എന്നത് ഇവിടെ നേരിട്ട് ‘സ്ത്രീകൾ’ എന്നാണ്; സന്ദർഭത്തിൽ ഭാര്യമാരോ പങ്കാളികളോ ആണെങ്കിലും മുഖ്യപാഠത്തിൽ അതിലധികം നിർവചിച്ചിട്ടില്ല.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾ ഉൾപ്പെടെ
  rationale: ഫറവോന്റെ മകളെ ശലോമോൻ സ്നേഹിച്ച വിദേശസ്ത്രീകളിൽ ഉൾപ്പെടുത്തുന്ന കൂട്ടിച്ചേർക്കൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: മോവാബ്യർ, അമ്മോന്യർ, എദോമ്യർ, സീദോന്യർ, ഹിത്യർ എന്നീ ജനവിഭാഗങ്ങളിൽപ്പെട്ട സ്ത്രീകളെ
  rationale: സ്ത്രീലിംഗ ജനവിഭാഗവിശേഷണങ്ങളുടെ പട്ടിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; സീദോൻ എന്ന പ്രത്യേകത നിലനിർത്തുന്നു.
theological_decisions:
- issue: נָשִׁים എന്നത് ‘സ്ത്രീകൾ’ എന്നോ ‘ഭാര്യമാർ’ എന്നോ വിവർത്തനം ചെയ്യുക
  choice: സ്ത്രീകൾ
  alternative: ഭാര്യമാർ
  rationale: എബ്രായപാഠത്തിന്റെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തി, വിവാഹബന്ധമെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ഫറവോന്റെ മകൾ വിദേശസ്ത്രീകളിൽ ഉൾപ്പെടുന്നുവോ വേറിട്ട വിഭാഗമാണോ
  choice: ഉൾപ്പെടുന്നു
  alternative: വേറിട്ട വിഭാഗമായി ചേർക്കുന്നു
  rationale: വാക്യഘടന അവളെയും ശലോമോൻ സ്നേഹിച്ച വിദേശസ്ത്രീകളുടെ കൂട്ടത്തിൽ ചേർക്കുന്നതായി ഏറ്റവും സ്വാഭാവികമായി വായിക്കാം; ‘ഉൾപ്പെടെ’ അത് പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ജനവിഭാഗനാമങ്ങൾ സഭാപരമായ പ്രത്യേക പദാവലികൾ ഒഴിവാക്കി പൊതുവായി തിരിച്ചറിയാവുന്ന രൂപത്തിൽ നൽകി.
