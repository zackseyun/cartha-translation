id: 1KI.11.6
reference: 1 Kings 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: ml
  text: അങ്ങനെ ശലോമോൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ യഹോവയെ പൂർണമായി അനുഗമിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “യഹോവയുടെ പിന്നാലെ പൂർണമായി നടന്നില്ല”; അല്ലെങ്കിൽ: “യഹോവയോടു പൂർണഹൃദയത്തോടെ വിശ്വസ്തനായിരുന്നില്ല.” ഈ എബ്രായ ഭാഷാശൈലി അപൂർണമായ വിശ്വസ്തതയെയോ അനുസരണത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയ ഇവിടെ ശലോമോന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘തിന്മയായതു ചെയ്തു’ എന്ന പ്രയോഗത്തിൽ ‘ചെയ്തു’ സ്വാഭാവികവും മൂലഘടനയോട് വിശ്വസ്തവുമാണ്.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വിശേഷണം ഇവിടെ നാമപദമായി പ്രവർത്തിച്ച് ധാർമികമായി തിന്മയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: מִלֵּא אַחֲרֵי
  choice: പൂർണമായി അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പിന്നാലെ നിറച്ചു’ എന്നല്ല, സമ്പൂർണമായി പിന്തുടരുകയോ വിശ്വസ്തമായി അനുഗമിക്കുകയോ ചെയ്യുക എന്നർഥമുള്ള എബ്രായ ഭാഷാശൈലിയാണിത്. ‘പൂർണമായി അനുഗമിച്ചു’ എന്നത് അതിന്റെ പ്രവർത്തനപരമായ അർഥവും അപൂർണമായ വിശ്വസ്തതയുടെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: כְּדָוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിനെപ്പോലെ
  rationale: ദാവീദിന്റെ അനുഗമനരീതിയോടാണ് താരതമ്യം. ‘തന്റെ’ എന്നത് אָבִיוയിലെ ബന്ധസൂചന വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ക്രിയ അനാവശ്യമായി ആവർത്തിച്ചിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതമായ ലിപ്യന്തരണമായ ‘യഹോവ’ ഉപയോഗിക്കുന്നത് പേരിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- issue: מִלֵּא אַחֲרֵי יְהוָה സൂചിപ്പിക്കുന്ന ശലോമോന്റെ പരാജയത്തിന്റെ അളവ്
  choice: യഹോവയെ പൂർണമായി അനുഗമിച്ചില്ല
  alternative: യഹോവയോടു പൂർണഹൃദയത്തോടെ വിശ്വസ്തനായിരുന്നില്ല; യഹോവയുടെ പിന്നാലെ പൂർണമായി നടന്നില്ല
  rationale: ഈ വാക്യഭാഗം പൂർണമായ അനുഗമനത്തിന്റെ അഭാവം പറയുന്നു; സമ്പൂർണ വിശ്വാസത്യാഗം എന്നു ഈ ഭാഗം മാത്രം അടിസ്ഥാനമാക്കി കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായത്തിലെ വിലയിരുത്തൽരൂപകം ‘ദൃഷ്ടിയിൽ’ എന്നു നിലനിർത്തി; അപൂർണമായ ഉടമ്പടി-വിശ്വസ്തതയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ‘പൂർണമായി അനുഗമിച്ചില്ല’ എന്നു നൽകി.
