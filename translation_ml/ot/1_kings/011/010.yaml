  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: ml
  text: 'ഈ കാര്യത്തെക്കുറിച്ച് യാഹ്‌വെ അവനോടു കൽപിച്ചിരുന്നു: അന്യദേവന്മാരുടെ പിന്നാലെ പോകരുതെന്ന്[a]. എന്നാൽ, യാഹ്‌വെ കൽപിച്ചത് അവൻ അനുസരിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അന്യദേവന്മാരുടെ പിന്നാലെ പോകരുത്.’ മറ്റു ദേവന്മാരിലേക്കു തിരിഞ്ഞ് അവരെ ആരാധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഉടമ്പടി-ഭാഷയിലെ പതിവ് പ്രയോഗമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: അവൻ അവനോടു കല്പിച്ചിരുന്നു
  rationale: ചുറ്റുപാടിലെ ആഖ്യാനത്തേക്കാൾ മുമ്പുണ്ടായ ദൈവിക കല്പനയെ സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ പൂർവകാലരൂപം ഉപയോഗിച്ചു; എബ്രായത്തിലെ പരോക്ഷ കർമവും നിലനിർത്തി.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ഈ കാര്യത്തെക്കുറിച്ച്
  rationale: דבר ഇവിടെ വെറും ‘വാക്ക്’ എന്നതിലുപരി മുമ്പ് പരാമർശിച്ച വിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരെ പിന്തുടരരുതെന്ന്
  rationale: നിരോധനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; ‘പിന്നാലെ പോകുക’ എന്ന എബ്രായ ഉടമ്പടി-പ്രയോഗത്തിന്റെ ആരാധനാപരമായ അർഥം ‘പിന്തുടരുക’ വഴി സംരക്ഷിച്ചു.
- source_word: וְלֹא שָׁמַר
  choice: എങ്കിലും … അനുസരിച്ചില്ല
  rationale: വാവ് ഇവിടെ മുൻകല്പനയോടുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു. കല്പന ‘കാക്കുക’ എന്ന വാച്യരൂപത്തേക്കാൾ, ഈ സന്ദർഭത്തിൽ שמר എന്നതിന്റെ പ്രവർത്തനാർഥം ‘അനുസരിക്കുക’ എന്ന് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: യഹോവ കല്പിച്ചത്
  rationale: ബന്ധവാക്യത്തിന്റെ ഉള്ളടക്കം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകി; ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപമായ ‘യഹോവ’ ഉപയോഗിച്ച് മൂലത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരംവെക്കാതിരിക്കുന്നു.
- issue: ‘അന്യദേവന്മാരുടെ പിന്നാലെ പോകുക’ എന്ന ഉടമ്പടി-പ്രയോഗം
  choice: അന്യദേവന്മാരെ പിന്തുടരുക
  alternative: അന്യദേവന്മാരുടെ പിന്നാലെ പോകുക
  rationale: ആ ദേവന്മാരിലേക്കു തിരിഞ്ഞ് അവരെ ആരാധിക്കുകയും സേവിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകത്തിന്റെ ചലനഭാവം സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കല്പിച്ചിരുന്നു’ മുൻകാലബന്ധം വ്യക്തമാക്കുന്നു; ‘അനുസരിച്ചില്ല’ കല്പനാസന്ദർഭത്തിലെ שמר എന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
