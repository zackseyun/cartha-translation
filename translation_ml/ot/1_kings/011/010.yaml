revisions:
- from: 'ഈ കാര്യത്തെക്കുറിച്ച് അവൻ അവനോടു കല്പിച്ചിരുന്നു: അന്യദേവന്മാരെ പിന്തുടരരുതെന്ന്[a]. എങ്കിലും യഹോവ കല്പിച്ചത് അവൻ അനുസരിച്ചില്ല.'
  to: 'ഈ കാര്യത്തെക്കുറിച്ച് യാഹ്‌വെ അവനോടു കൽപിച്ചിരുന്നു: അന്യദേവന്മാരുടെ പിന്നാലെ പോകരുതെന്ന്[a]. എന്നാൽ, യാഹ്‌വെ കൽപിച്ചത് അവൻ അനുസരിച്ചില്ല.'
