source:
  edition: WLC
  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: ml
  text: ദൈവം അവനെതിരെ ഒരു എതിരാളിയെ[a] ഉയർത്തി—എല്യാദാവിന്റെ മകനായ രെസോനെ. അവൻ തന്റെ യജമാനനായ സോബാ രാജാവായ ഹദദേസെരിൽനിന്ന് ഓടിപ്പോയവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം സാത്താൻ; ഇവിടെ അത് സംജ്ഞാനാമമല്ല, ‘എതിരാളി’ അല്ലെങ്കിൽ ‘പ്രതിയോഗി’ എന്നർഥമുള്ള സാധാരണ നാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ഉയർത്തി
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ രംഗത്തുകൊണ്ടുവരുക, എതിരായി എഴുന്നേൽപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; ‘ഉയർത്തി’ ദൈവത്തിന്റെ പ്രവർത്തനവും മൂലപാഠത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לוֹ
  choice: അവനുവേണ്ടി
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ‘എതിരായി’ എന്ന ബന്ധം ‘എതിരാളി’ എന്ന പദം വ്യക്തമാക്കുന്നു.
- source_word: שָׂטָן
  choice: ഒരു എതിരാളിയെ
  rationale: ഇവിടെ ഇത് മനുഷ്യനായ ഒരു രാഷ്ട്രീയ എതിരാളിയെ സൂചിപ്പിക്കുന്ന സാധാരണ നാമമാണ്; ‘സാത്താൻ’ എന്ന സംജ്ഞാനാമം ഉപയോഗിക്കുന്നത് പാഠത്തിലില്ലാത്ത ദുഷ്ടാത്മസംബന്ധമായ അർഥം കൊണ്ടുവരും.
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: എല്യാദാവിന്റെ മകനായ രെസോനെ
  rationale: പുത്രബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകി വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
- source_word: אֲשֶׁר בָּרַח
  choice: ഓടിപ്പോയവനായിരുന്നു
  rationale: രെസോൻ എതിരാളിയായി ഉയർത്തപ്പെടുന്നതിനു മുമ്പുണ്ടായ സംഭവമാണെന്ന പശ്ചാത്തലകാലബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: ഹദദേസെരിന്റെ അടുക്കൽനിന്ന്
  rationale: מֵאֵת ഒരു വ്യക്തിയിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അടുക്കൽനിന്ന്’ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֶלֶךְ צוֹבָה
  choice: സോബാരാജാവ്
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന രാജപദവി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപത്തിൽ നൽകി.
- source_word: אֲדֹנָיו
  choice: തന്റെ യജമാനനായ
  rationale: രാഷ്ട്രീയ-സേവകബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കർത്താവ്’ എന്ന ദൈവിക പദവിയേക്കാൾ ‘യജമാനൻ’ യോജിക്കുന്നു; പ്രതിഫലന സർവനാമം രെസോനുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: שָׂטָן എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: സാധാരണ നാമമായ ‘എതിരാളി’
  alternative: സംജ്ഞാനാമമായ ‘സാത്താൻ’
  rationale: തുടർന്നുതന്നെ എല്യാദാവിന്റെ മകനായ രെസോൻ എന്ന മനുഷ്യനെയാണ് പാഠം തിരിച്ചറിയിക്കുന്നത്. അതിനാൽ ദുഷ്ടാത്മാവിന്റെ സംജ്ഞാനാമമായി വിവർത്തനം ചെയ്യാതെ രാഷ്ട്രീയ എതിരാളി എന്ന അർഥം നിലനിർത്തി.
- issue: ദൈവം എതിരാളിയെ ഉയർത്തിയെന്ന പ്രസ്താവന
  choice: ‘ദൈവം ... ഉയർത്തി’ എന്ന നേരിട്ടുള്ള കാരകപ്രയോഗം
  alternative: ദൈവം അനുവദിച്ചു എന്ന വ്യാഖ്യാനാത്മക മൃദൂകരണം
  rationale: മൂലപാഠം ദൈവത്തെ പ്രവർത്തനത്തിന്റെ കർത്താവായി നേരിട്ട് അവതരിപ്പിക്കുന്നു. അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ ലഘൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദീർഘമായ എബ്രായ ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; appositional ബന്ധം ഡാഷിലൂടെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
