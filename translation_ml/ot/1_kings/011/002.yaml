- from: 'യഹോവ ഇസ്രായേൽമക്കളോട് പറഞ്ഞിരുന്ന ജനതകളിൽനിന്നുള്ളവരായിരുന്നു അവർ: “നിങ്ങൾ അവരുടെ ഇടയിൽ ചെല്ലരുത്; അവർ നിങ്ങളുടെ ഇടയിലും വരരുത്.[a] അവർ തീർച്ചയായും നിങ്ങളുടെ ഹൃദയം അവരുടെ ദേവന്മാരുടെ പിന്നാലെ തിരിക്കും.” എന്നിട്ടും ശലോമോൻ അവരോടു സ്നേഹത്തിൽ പറ്റിച്ചേർന്നു.'
  to: യഹോവ ഇസ്രായേൽമക്കളോടു, “നിങ്ങൾ അവരുടെ ഇടയിൽ ചെല്ലരുത്; അവർ നിങ്ങളുടെ ഇടയിലും വരരുത്.[a] അവർ തീർച്ചയായും നിങ്ങളുടെ ഹൃദയം അവരുടെ ദേവന്മാരുടെ പിന്നാലെ തിരിക്കും,” എന്നു പറഞ്ഞിരുന്ന ജനതകളിൽനിന്നുള്ളവരോടു ശലോമോൻ സ്നേഹപൂർവം പറ്റിച്ചേർന്നു.
