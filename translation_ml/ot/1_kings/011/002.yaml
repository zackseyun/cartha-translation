  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: ml
  text: യഹോവ ഇസ്രായേൽമക്കളോടു, “നിങ്ങൾ അവരുടെ ഇടയിൽ ചെല്ലരുത്; അവർ നിങ്ങളുടെ ഇടയിലും വരരുത്.[a] അവർ തീർച്ചയായും നിങ്ങളുടെ ഹൃദയം അവരുടെ ദേവന്മാരുടെ പിന്നാലെ തിരിക്കും,” എന്നു പറഞ്ഞിരുന്ന ജനതകളിൽനിന്നുള്ളവരോടു ശലോമോൻ സ്നേഹപൂർവം പറ്റിച്ചേർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “നിങ്ങൾ അവരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടരുത്; അവരും നിങ്ങളുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടരുത്.” ഹീബ്രുവിൽ അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്തത്: “നിങ്ങൾ അവരുടെ ഇടയിൽ ചെല്ലരുത്; അവർ നിങ്ങളുടെ ഇടയിലും വരരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: ജനതകളിൽനിന്നുള്ളവർ
  rationale: גּוֹיִם എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; മുൻവാക്യത്തിൽ പറഞ്ഞ വിദേശസ്ത്രീകളിലേക്കുള്ള ബന്ധവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ശീർഷകമാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാള ബൈബിൾഭാഷ.
- source_word: לֹא תָבֹאוּ בָהֶם ... לֹא יָבֹאוּ בָכֶם
  choice: നിങ്ങൾ അവരുടെ ഇടയിൽ ചെല്ലരുത്; അവർ നിങ്ങളുടെ ഇടയിലും വരരുത്
  rationale: വിവാഹബന്ധമാണ് സന്ദർഭാർഥമെങ്കിലും, ഹീബ്രുവിലെ പൊതുവായ ‘ചെല്ലുക/വരുക’ പ്രയോഗവും സമാന്തരഘടനയും പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אָכֵן
  choice: തീർച്ചയായും
  rationale: മുന്നറിയിപ്പിന്റെ ഉറപ്പും ഊന്നലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം ... തിരിക്കും
  rationale: נטה എന്ന ക്രിയയുടെ കാരകാർഥവും ഹൃദയം തിരിയുന്നുവെന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാരുടെ പിന്നാലെ
  rationale: אַחֲרֵי എന്നതിലെ ‘പിന്നാലെ’ എന്ന ഹീബ്രു രൂപകം സംരക്ഷിക്കുകയും മതപരമായ അനുഗമനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: דָּבַק
  choice: പറ്റിച്ചേർന്നു
  rationale: ദൃഢമായ അടുപ്പവും വിട്ടുപിരിയാത്ത ബന്ധവും സൂചിപ്പിക്കുന്ന דבק എന്ന ക്രിയയുടെ തീവ്രത നൽകുന്നു.
- source_word: לְאַהֲבָה
  choice: സ്നേഹത്തിൽ
  rationale: ശലോമോന്റെ ചേർന്നുനിൽപ്പിന്റെ ഭാവമോ മണ്ഡലമോ സൂചിപ്പിക്കുകയും ‘സ്നേഹം’ എന്ന മൂലാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിരോധനം പ്രധാനപാഠത്തിൽ മിശ്രവിവാഹത്തെക്കുറിച്ചാണെന്ന് വ്യക്തമാക്കണമോ
  choice: ഹീബ്രുവിലെ ‘അവരുടെ ഇടയിൽ ചെല്ലുക / നിങ്ങളുടെ ഇടയിൽ വരുക’ എന്ന പൊതുവായ പ്രയോഗം നിലനിർത്തി, സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: “നിങ്ങൾ അവരുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടരുത്; അവരും നിങ്ങളുമായി വിവാഹബന്ധത്തിൽ ഏർപ്പെടരുത്” എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം വിവാഹത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഹീബ്രു വാക്കുകൾ കൂടുതൽ പൊതുവായവയാണ്. അതിനാൽ മൂലത്തിലെ യഥാർഥ വ്യാപ്തി പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിലെ ലിംഗവും സമൂഹസൂചനയും
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: ഹീബ്രു കുടുംബരൂപകം നിലനിർത്തുമ്പോഴും ഉടമ്പടിജനത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗമാണിത്.
- issue: בָּהֶם എന്ന സർവനാമം ജനതകളെയോ അവരിൽപ്പെട്ട സ്ത്രീകളെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: മുൻസന്ദർഭത്തിലെ സ്ത്രീകളെ സൂചിപ്പിക്കുന്ന “അവർ/അവരോട്” എന്ന സ്വാഭാവിക സർവനാമബന്ധം
  alternative: “ആ ജനതകളോട്” എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക
  rationale: വാക്യം 1-ലെ സ്ത്രീകളാണ് വ്യാകരണപരവും സന്ദർഭപരവുമായി ശലോമോന്റെ സ്നേഹബന്ധത്തിന്റെ ലക്ഷ്യം; എന്നാൽ അവരുടെ ജനതാപശ്ചാത്തലം ആദ്യഖണ്ഡത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഖണ്ഡത്തെ മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘അവരായിരുന്നു’ ചേർത്തു. ദൈവവചനത്തിന്റെ ഉദ്ധരണി വ്യക്തമായി വേർതിരിച്ചു; ഹീബ്രുവിലെ വിവാഹസൂചനയുള്ളെങ്കിലും പൊതുവായ ഭാഷ അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
