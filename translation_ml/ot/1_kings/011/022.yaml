source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ פַרְעֹ֗ה כִּ֠י מָה אַתָּ֤ה חָסֵר֙ עִמִּ֔/י וְ/הִנְּ/ךָ֥ מְבַקֵּ֖שׁ לָ/לֶ֣כֶת אֶל אַרְצֶ֑/ךָ וַ/יֹּ֣אמֶר לֹ֔א כִּ֥י שַׁלֵּ֖חַ תְּשַׁלְּחֵֽ/נִי־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫറവോൻ അവനോടു ചോദിച്ചു: “എന്റെ കൂടെ നിനക്ക് എന്തു കുറവാണുള്ളത്, നിന്റെ നാട്ടിലേക്കു പോകാൻ നീ ആഗ്രഹിക്കുന്നത്?” അവൻ മറുപടി പറഞ്ഞു: “ഒന്നുമില്ല; എങ്കിലും എന്നെ പോകാൻ അനുവദിക്കണമേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ “അയയ്ക്കുക, നീ എന്നെ അയയ്ക്കണം” എന്നർഥമുള്ള ഊന്നൽഘടനയാണുള്ളത്: ഒരു infinitive absolute-ഉം അതേ ക്രിയയുടെ finite രൂപവും ചേർന്നിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തു കുറവുണ്ടായിട്ടാണ്
  rationale: ആദ്യത്തെ כִּי ഫറവോന്റെ ചോദ്യത്തിന് വിശദീകരണാത്മകമായ ബന്ധം നൽകുന്നു. മലയാളത്തിൽ വേറൊരു ‘എന്നാൽ’ ചേർക്കാതെ ‘-ഉണ്ടായിട്ടാണ്’ എന്ന ചോദ്യഘടന അതിന്റെ സന്ദർഭോചിതമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: എന്റെ കൂടെ നിനക്ക് എന്തു കുറവുണ്ട്
  rationale: חָסֵר എന്നതിന്റെ ‘കുറവുണ്ടാകുക’ എന്ന അർഥവും עִמִּי എന്നതിന്റെ ബന്ധപരമായ ‘എന്റെ കൂടെ’ എന്ന അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: നീ ... പോകാൻ ആഗ്രഹിക്കുന്നത്
  rationale: הִנֵּה ശ്രദ്ധ ക്ഷണിക്കുന്ന വ്യവഹാരസൂചകമാണ്; ഇവിടെ പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ചോദ്യഘടനയിൽ സ്വാഭാവികമാക്കി. מְבַקֵּשׁ സൂചിപ്പിക്കുന്ന ആഗ്രഹം/ശ്രമം ‘ആഗ്രഹിക്കുന്നത്’ എന്നു നൽകി.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: നിന്റെ നാട്ടിലേക്കു പോകാൻ
  rationale: הלך എന്നത് ഇവിടെ ‘പോകുക’ എന്നാണ്; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘മടങ്ങുക’ എന്ന ആശയം ചേർത്തിട്ടില്ല. possessive suffix ‘നിന്റെ’ എന്നതിൽ നിലനിർത്തി.
- source_word: לֹא
  choice: ഒന്നുമില്ല
  rationale: ഫറവോന്റെ ‘എന്തു കുറവ്?’ എന്ന ചോദ്യത്തിന് ലോപിതമായ മറുപടിയായ לֹא മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ‘ഒന്നുമില്ല’ എന്നു നൽകി.
- source_word: כִּי
  choice: എങ്കിലും
  rationale: മറുപടിയിലെ ‘ഒന്നുമില്ല’ എന്ന സമ്മതത്തിന് പിന്നാലെ ഹദദിന്റെ യഥാർഥ അഭ്യർഥനയിലേക്കുള്ള വിരുദ്ധമാറ്റം ‘എങ്കിലും’ വ്യക്തമാക്കുന്നു.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: എന്നെ പോകാൻ അനുവദിക്കണമേ
  rationale: ‘അയച്ചുകളയുക’ എന്നതിന്റെ സന്ദർഭോചിതമായ അർഥം അനുമതി നൽകി വിടുക എന്നതാണ്. വിനയപൂർവവും ഊന്നലുള്ളതുമായ അഭ്യർഥനയായി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി; ഹീബ്രു ഊന്നൽഘടന അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
