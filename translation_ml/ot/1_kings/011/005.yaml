id: 1KI.11.5
reference: 1 Kings 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ml
  text: ശലോമോൻ സീദോന്യരുടെ ദേവതയായ അസ്തോരെത്തിന്റെ പിന്നാലെയും, അമ്മോന്യരുടെ അറപ്പുളവാക്കുന്ന ദൈവമായ മിൽക്കോമിന്റെ പിന്നാലെയും പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: പിന്നാലെ ചെന്നു
  rationale: הלך אחרי എന്ന എബ്രായപ്രയോഗം ഇവിടെ വെറും ശാരീരികമായി പിന്നാലെ പോകുന്നതല്ല, വിശ്വസ്തതയോടെയോ ആരാധനാപരമായോ അനുഗമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ എബ്രായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിലെ വിശ്വാസത്യാഗസൂചനയും നൽകുന്നു.
- source_word: עַשְׁתֹּרֶת
  choice: അസ്തോരെത്ത്
  rationale: ഈ വാക്യത്തിലെ എബ്രായ നാമരൂപം ലിപ്യന്തരണം ചെയ്തു; കൂടുതൽ പരിചിതമായ ‘അസ്താർത്തെ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: സീദോന്യരുടെ ദേവതയായ
  rationale: אֱלֹהֵי രൂപപരമായി ബഹുവചന നിർമാണരൂപമാണെങ്കിലും പേരെടുത്ത ഏക ദേവതയായ അസ്തോരെത്തിനെ ഇവിടെ സമാനാധികരണമായി വിശേഷിപ്പിക്കുന്നു. ‘ദേവത’ എന്നത് മലയാളത്തിൽ ലിംഗനിർണ്ണയം അമിതമായി മുൻനിർത്താതെ ആശയം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: מִלְכֹּם
  choice: മിൽക്കോം
  rationale: മസോററ്റിക് പാഠം ഇവിടെ മിൽക്കോം എന്നാണ് വായിക്കുന്നത്; മോലെക്ക് എന്ന ബന്ധപ്പെടുത്തൽ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: അമ്മോന്യരുടെ അറപ്പുളവാക്കുന്ന ദേവത
  rationale: שִׁקּוּץ ശക്തമായ മതപരവും ധാർമ്മികവുമായ വെറുപ്പിനെ സൂചിപ്പിക്കുന്ന പദമാണ്; ഇവിടെ മിൽക്കോം ഒരു ദേവതയായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അറപ്പുളവാക്കുന്ന ദേവത’ എന്നു നൽകി.
theological_decisions:
- issue: ശലോമോന്റെ പ്രവൃത്തിയെ മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘ആരാധിച്ചു’ എന്നു വ്യക്തമാക്കണമോ
  choice: എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തി ‘പിന്നാലെ ചെന്നു’ എന്നു നൽകി.
  alternative: ‘അനുഗമിച്ചു’ അല്ലെങ്കിൽ ‘ആരാധിച്ചു’
  rationale: സന്ദർഭം വിഗ്രഹാരാധനയും വിശ്വാസത്യാഗവും വ്യക്തമാക്കുന്നുവെങ്കിലും ഈ വാക്യം הלך אחרי എന്ന പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനം പൂർണമായി മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
- issue: אֱלֹהֵי എന്ന രൂപത്തെ ‘ദൈവം’, ‘ദൈവങ്ങൾ’, അതോ ‘ദേവി’ എന്നു നൽകണമോ
  choice: പേരെടുത്ത സ്ത്രീദേവതയെ സൂചിപ്പിക്കുന്ന ലിംഗപരമായി സൗകര്യമുള്ള ‘ദേവത’ ഉപയോഗിച്ചു; രൂപപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘സീദോന്യരുടെ ദൈവം’, ‘സീദോന്യരുടെ ദൈവങ്ങൾ’, അല്ലെങ്കിൽ ‘സീദോന്യരുടെ ദേവി’
  rationale: അസ്തോരെത്ത് സ്ത്രീദേവതയാണെങ്കിലും എബ്രായത്തിലെ രൂപപരമായ അസ്പഷ്ടത പൂർണമായി മായ്ച്ചുകളയാതെയും മലയാളവാക്യം അസ്വാഭാവികമാക്കാതെയും അർഥം കൈമാറുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പിന്നാലെ ചെന്നു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ഉപമാഭാവം നിലനിർത്തുന്നതുമാണ്. ദൈവനാമങ്ങൾ മലയാളലിപിയിൽ മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
