  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: ml
  text: ശലോമോൻ വൃദ്ധനായപ്പോൾ, അവന്റെ ഭാര്യമാർ അവന്റെ ഹൃദയത്തെ മറ്റു ദേവന്മാരുടെ പിന്നാലെ തിരിച്ചു. അവന്റെ ഹൃദയം, തന്റെ പിതാവായ ദാവീദിന്റെ ഹൃദയംപോലെ, തന്റെ ദൈവമായ യഹ്‌വെയോടു പൂർണമായി അർപ്പിതമായിരുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്റെ ദൈവമായ യഹ്‌വെയോടുകൂടെ അവന്റെ ഹൃദയം പൂർണമായിരുന്നില്ല.” ‘പൂർണമായ’ എന്നാണ് ഹീബ്രു അക്ഷരാർഥം; ഇവിടെ അത് അവിഭക്തമായ വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു.'
    reason: שָׁלֵם എന്ന പദത്തിന്റെ അക്ഷരാർഥവും സ്വാഭാവിക മലയാളത്തിലെ സന്ദർഭാർത്ഥവും ഒരുമിച്ച് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: ശലോമോൻ വൃദ്ധനായപ്പോൾ
  rationale: ‘ശലോമോന്റെ വാർധക്യകാലത്ത്’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സമയസൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: נָשָׁיו
  choice: അവന്റെ ഭാര്യമാർ
  rationale: ഹീബ്രു ബഹുവചനവും ഉടമസ്ഥതാസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: അവന്റെ ഹൃദയത്തെ ... തിരിച്ചു
  rationale: נטה എന്ന ക്രിയയുടെ കാരണാർത്ഥരൂപത്തിലുള്ള ‘തിരിയാൻ ഇടയാക്കി/തിരിച്ചു’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു; ‘വഴിതെറ്റിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: അന്യദേവന്മാരുടെ പിന്നാലെ
  rationale: ‘മറ്റു ദേവന്മാരുടെ പിന്നാലെ’ എന്ന ഉടമ്പടിസംബന്ധിയായ ഹീബ്രു പ്രയോഗത്തിന്റെ ദിശയും പിന്തുടരൽഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: לְבָבוֹ
  choice: അവന്റെ ഹൃദയം
  rationale: ഇച്ഛ, ചിന്ത, വിശ്വസ്തത എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ ഹൃദയബിംബം നിലനിർത്തുന്നു.
- source_word: שָׁלֵם
  choice: പൂർണമായി അർപ്പിതമായ
  rationale: ബന്ധപരവും ഉടമ്പടിപരവുമായ അവിഭക്ത വിശ്വസ്തത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പൂർണം/മുഴുവൻ’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: തന്റെ ദൈവമായ യഹ്‌വെയോടു
  rationale: עִם സൂചിപ്പിക്കുന്ന ബന്ധപരമായ ചേർച്ച ‘-യോട്’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു; ദൈവനാമം ശീർഷകമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ ഹൃദയംപോലെ
  rationale: താരതമ്യം വ്യക്തികൾക്കിടയിൽ മാത്രമല്ല, അവരുടെ ഹൃദയങ്ങൾക്കിടയിലാണെന്ന ഹീബ്രു ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമം ഒരു പൊതുവായ ശീർഷകമായി പകരംവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ശലോമോന്റെ ഹൃദയത്തെക്കുറിച്ചുള്ള שָׁלֵם എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പൂർണമായി അർപ്പിതമായിരുന്നില്ല
  alternative: യഹ്‌വെയോടുകൂടെ പൂർണമായിരുന്നില്ല / അവിഭക്തമായിരുന്നില്ല
  rationale: ദാവീദിനോടുള്ള താരതമ്യത്തിൽ ഉദ്ദേശിക്കുന്നത് ഉടമ്പടിവിശ്വസ്തതയിലെ പൂർണതയാണെന്ന് സ്വാഭാവികമായി അറിയിക്കുന്നു; അതേസമയം പാപരഹിതത്വം എന്ന ആശയം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല. അക്ഷരാർഥത്തിന്റെ ദൃശ്യബിംബം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: אֱלֹהִים אֲחֵרִים എന്ന പ്രയോഗം
  choice: അന്യദേവന്മാർ
  alternative: വിദേശദേവന്മാർ
  rationale: ഹീബ്രു വാചകം ജാതീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ ‘വിദേശ’ വിഭാഗത്തേക്കാൾ ‘മറ്റു ദേവന്മാർ’ എന്ന ആശയമാണ് നേരിട്ട് നൽകുന്നത്; അതിനാൽ വിഗ്രഹാരാധനയെ മൃദൂകരിക്കാതെ വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം’, ‘പിന്നാലെ’, ‘യഹ്‌വെ’ എന്നീ ബൈബിൾപരമായ മുഖ്യപ്രയോഗങ്ങൾ നിലനിർത്തി; അത്യന്തം സംസ്കൃതവൽക്കരിച്ച പദങ്ങളും വിഭാഗീയ ദൈവശാസ്ത്രഭാഷയും ഒഴിവാക്കി. ലഭിച്ച ഇംഗ്ലീഷ് പാളിയിൽ [a] വാർധക്യവാക്യഭാഗത്തിനു ശേഷം കണ്ടുവെങ്കിലും അതിന്റെ ഉള്ളടക്കം שָׁלֵם എന്ന പദത്തെക്കുറിച്ചായതിനാൽ പ്രസക്തമായ വാക്യഭാഗത്തിനു ശേഷമാണ് അടയാളം നൽകിയിരിക്കുന്നത്.
