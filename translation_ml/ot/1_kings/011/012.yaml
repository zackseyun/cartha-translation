source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: ml
  text: എങ്കിലും, നിന്റെ കാലത്ത് ഞാൻ അത്[a] ചെയ്യുകയില്ല; നിന്റെ പിതാവായ ദാവീദിനെ പരിഗണിച്ച്, നിന്റെ മകന്റെ കൈയിൽനിന്ന്[b] ഞാൻ അതു കീറിക്കളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മുൻവാക്യത്തിൽ പ്രഖ്യാപിച്ച രാജ്യം കീറിക്കളയുന്ന പ്രവൃത്തിയെയാണ് ‘അത്’ സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
  - marker: b
    text: ‘കൈയിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗം ഒരാളുടെ അധികാരത്തിൽനിന്നോ കൈവശത്തിൽനിന്നോ എടുത്തുമാറ്റുക എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിൽ പ്രഖ്യാപിച്ച ന്യായവിധിക്കുള്ള നിയന്ത്രണാത്മകവും വൈരുധ്യസൂചകവുമായ ഭേദഗതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּיָמֶיךָ
  choice: നിന്റെ കാലത്ത്
  rationale: ‘നിന്റെ ദിവസങ്ങളിൽ’ എന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ അർഥം കാത്തുകൊണ്ട് ശലോമോന്റെ ജീവിതകാലത്തെയും ഭരണകാലത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: ഞാൻ അത് ചെയ്യുകയില്ല
  rationale: സ്ത്രീലിംഗ പ്രത്യയം മുൻവാക്യത്തിൽ പറഞ്ഞ രാജ്യം കീറിക്കളയുന്ന പ്രവൃത്തിയിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തെ ആശ്രയിക്കുന്ന ആ സൂചന അതേപടി നിലനിർത്തുന്നു.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: നിന്റെ പിതാവായ ദാവീദിനെ കരുതിയാണിത്
  rationale: ദാവീദിനോടുള്ള പരിഗണന നിമിത്തം വിധി മാറ്റിവെക്കുന്നതെന്ന ഉദ്ദേശ്യബന്ധം, കേവല കാരണമായി ചുരുക്കാതെ, ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִיַּד בִּנְךָ
  choice: നിന്റെ മകന്റെ കൈയിൽനിന്ന്
  rationale: അധികാരത്തിൽനിന്നോ കൈവശത്തിൽനിന്നോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶקְרָעֶנָּה
  choice: ഞാൻ അതു കീറിക്കളയും
  rationale: קָרַע എന്ന ക്രിയയുടെ ‘കീറുക’ എന്ന ശക്തമായ ദൃശ്യഭാവവും രാജ്യവിഭജനത്തിന്റെ സന്ദർഭവും സംരക്ഷിക്കുന്നു; കർമം മുൻസന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കപ്പെടുന്നു.
theological_decisions:
- issue: ശലോമോനുമേലുള്ള വിധി മാറ്റിവെക്കുന്നതിന്റെ സ്വഭാവം
  choice: രാജ്യം കീറിക്കളയുമെന്ന പ്രഖ്യാപിത വിധി ശലോമോന്റെ കാലത്ത് നടപ്പാക്കാതെ, അവന്റെ മകന്റെ അധികാരത്തിൽനിന്ന് രാജ്യം നീക്കുമെന്ന് വാക്യം പറയുന്നു.
  alternative: ‘നിന്റെ ജീവിതകാലത്ത് ഞാൻ ഇത് ചെയ്യുകയില്ല’ എന്നു കാലസൂചന കൂടുതൽ വിശദമാക്കാം.
  rationale: എബ്രായം കർമത്തെ വ്യക്തമായി ആവർത്തിക്കാതെ മുൻസന്ദർഭത്തെ ആശ്രയിക്കുകയും ‘നിന്റെ കാലത്ത്’ എന്നു പറയുകയും ചെയ്യുന്നു. വിവർത്തനം ആ സന്ദർഭബന്ധവും ദാവീദിനെ കരുതിയുള്ള വിധിവൈകിപ്പിക്കലും നിലനിർത്തുന്നു; അതിലുപരി ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്റെ കാലത്ത്’, ‘കൈയിൽനിന്ന്’, ‘കീറിക്കളയും’ എന്നീ എബ്രായ ദൃശ്യപ്രയോഗങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ സംരക്ഷിച്ചു.
