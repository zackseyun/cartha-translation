    issue: 'The David motive clause is rendered as a separate sentence: “നിന്റെ പിതാവായ ദാവീദിനെ കരുതിയാണിത്.”'
    rationale: לְמַעַן דָּוִד אָבִיךָ modifies the preceding statement, “I will not do it in your days.” The separate Malayalam statement introduces an unnecessary demonstrative/predicative formulation and weakens the direct syntactic connection. A participial motive phrase is both closer to the Hebrew and more natural.
