  terminology: ‘ഭരണാധികാരി,’ ‘എന്റെ ദാസൻ ദാവീദ്,’ ‘കല്പനകൾ,’ and ‘ചട്ടങ്ങൾ’ are suitable, consistent modern-standard Malayalam choices. ‘ദാവീദിനെ ഓർത്ത്’ naturally conveys ‘for the sake of David’ without doctrinal elaboration.
  issues:
