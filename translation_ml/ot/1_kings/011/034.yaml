id: 1KI.11.34
reference: 1 Kings 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: ml
  text: എങ്കിലും രാജ്യം മുഴുവനും ഞാൻ അവന്റെ കൈയിൽനിന്ന് എടുത്തുകളയുകയില്ല; കാരണം, അവന്റെ ജീവിതകാലം മുഴുവൻ ഞാൻ അവനെ ഭരണാധികാരിയാക്കും. ഞാൻ തിരഞ്ഞെടുത്തവനും എന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിച്ചവനുമായ എന്റെ ദാസൻ ദാവീദിനെ ഓർത്താണ് അത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: ഭരണാധികാരി
  rationale: ഈ സന്ദർഭത്തിൽ രാജ്യം ഭരിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ, പദവിയെ അനാവശ്യമായി ‘രാജാവ്’ എന്നു ചുരുക്കാതെയും പഴയകാലഭാവമുള്ള ‘പ്രഭു’ എന്നു നൽകാതെയും പൊതുവായ ഭരണപദവി നിലനിർത്തുന്നു.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: എന്റെ ദാസൻ ദാവീദിനെ ഓർത്ത്
  rationale: ദാവീദിനോടുള്ള പരിഗണന നിമിത്തമാണ് ഈ നടപടി എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ദാവീദിന്റെ സ്വന്തം യോഗ്യത മാത്രമാണ് കാരണമെന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: מִצְוֹתַי וְחֻקֹּתָי
  choice: എന്റെ കല്പനകളും ചട്ടങ്ങളും
  rationale: രണ്ട് വ്യത്യസ്ത എബ്രായ നിയമപദങ്ങളുടെയും സമാന്തരത സംരക്ഷിക്കുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദാവീദ് ദൈവത്തിന്റെ കല്പനകളും ചട്ടങ്ങളും പാലിച്ചു എന്ന വാക്യത്തിന്റെ വ്യാപ്തി
  choice: ‘പാലിച്ചവനായ’ എന്ന് ഉറവിടത്തിലെ നിർവ്യാജമായ പ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: ദാവീദിന്റെ അറിയപ്പെടുന്ന വീഴ്ചകളുമായി പൊരുത്തപ്പെടുത്താൻ ‘പൊതുവേ പാലിച്ചവനായ’ അല്ലെങ്കിൽ ‘വിശ്വസ്തനായി പാലിക്കാൻ ശ്രമിച്ചവനായ’ എന്ന് വിശദീകരിക്കുക.
  rationale: ഉറവിടവാക്യം ഇവിടെ നൽകുന്ന വിലയിരുത്തലിനെ മയപ്പെടുത്തുകയോ വ്യവസ്ഥപ്പെടുത്തുകയോ ചെയ്യുന്നത് വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നതായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ദീർഘമായ എബ്രായവാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാളവാക്യങ്ങളാക്കിയെങ്കിലും കാരണം–ഫലം ബന്ധവും ആശയക്രമവും സംരക്ഷിച്ചു.
