  source_fidelity: The draft accurately renders the kingdom, David, the commandments, and the statutes, and appropriately renders נָשִׂיא as the non-royal-specific ‘ഭരണാധികാരി.’ However, it does not explicitly express the causal כִּי (‘because/for’) that grounds the non-removal of the whole kingdom in Solomon’s remaining ruler for his lifetime.
