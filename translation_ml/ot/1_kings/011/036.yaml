source:
  edition: WLC
  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: ml
  text: എന്റെ ദാസനായ ദാവീദിന് എന്റെ മുമ്പാകെ എപ്പോഴും ഒരു ദീപം ഉണ്ടായിരിക്കേണ്ടതിന്, അവന്റെ മകന് ഞാൻ ഒരു ഗോത്രം നൽകും[a]—എനിക്കായി എന്റെ നാമം അവിടെ സ്ഥാപിക്കാൻ ഞാൻ തിരഞ്ഞെടുത്ത നഗരമായ യെരൂശലേമിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെളിച്ചം.’ ഇവിടെ ‘ദീപം’ ദാവീദിന്റെ രാജവംശത്തിന്റെ തുടർച്ചയെയോ നിലനിൽക്കുന്ന രാജസാന്നിധ്യത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט אֶחָד
  choice: ഒരു ഗോത്രം
  rationale: രാജ്യം വിഭജിക്കപ്പെടുന്ന സന്ദർഭത്തിൽ שֵׁבֶט ഒരു രാജദണ്ഡത്തെയല്ല, ഗോത്രപരവും രാഷ്ട്രീയവുമായ ഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְמַעַן הֱיוֹת
  choice: അങ്ങനെ ... ഉണ്ടായിരിക്കും
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: נִיר
  choice: ദീപം
  rationale: ദാവീദിന്റെ രാജവംശത്തിന്റെ തുടർച്ചയെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: לְדָוִיד עַבְדִּי
  choice: എന്റെ ദാസനായ ദാവീദിന്
  rationale: ഉടമസ്ഥബന്ധവും ബഹുമാനസൂചകമായ വിശേഷണവും സ്വാഭാവിക മലയാളക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എപ്പോഴും
  rationale: തുടർച്ചയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: לְפָנַי
  choice: എന്റെ സന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പാകെ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സാന്നിധ്യത്തിന്റെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בָּחַרְתִּי לִי
  choice: എനിക്കായി ... ഞാൻ തിരഞ്ഞെടുത്ത
  rationale: לִי എന്ന ആത്മബന്ധസൂചക ദാതിവിന്റെ അർഥം ഒഴിവാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: എന്റെ നാമം സ്ഥാപിക്കാൻ
  rationale: ആവർത്തനപുസ്തകീയ-ദൈവാലയ ഭാഷയിലെ ‘നാമം’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וְלִבְנוֹ
  choice: എന്നാൽ അവന്റെ മകന്
  rationale: മുൻസന്ദർഭത്തിലെ രാജ്യവിഭജനത്തോടുള്ള വൈരുധ്യബന്ധം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: נִיר എന്ന രാജവംശരൂപകം
  choice: ദാവീദിന്റെ തുടർന്നുനിൽക്കുന്ന രാജവംശത്തെയോ രാജസാന്നിധ്യത്തെയോ സൂചിപ്പിക്കുന്ന ‘ദീപം’
  alternative: പൊതുവായ രൂപകമായി ‘വെളിച്ചം’
  rationale: ‘ദീപം’ എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുന്നത് വാക്യത്തിലെ രാജവംശദൈവശാസ്ത്രത്തെ വ്യാഖ്യാനത്തിലൂടെ ചുരുക്കാതെ വായനക്കാരന് ഗ്രഹിക്കാൻ ഇടനൽകുന്നു.
- issue: ‘എന്റെ നാമം സ്ഥാപിക്കാൻ’ എന്ന ദൈവാലയദൈവശാസ്ത്രം
  choice: ‘നാമം’ എന്ന മൂലഭാഷാപ്രയോഗം നിലനിർത്തുക
  alternative: ‘എന്റെ സാന്നിധ്യം സ്ഥാപിക്കാൻ’ അല്ലെങ്കിൽ ‘എന്നെ ആരാധിക്കേണ്ടതിന്’
  rationale: എബ്രായത്തിലെ പ്രധാന ദൈവശാസ്ത്രപരമായ ‘നാമ’ സൂത്രവാക്യം സാന്നിധ്യമോ ആരാധനയോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രാജവംശരൂപകവും ‘നാമം സ്ഥാപിക്കുക’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രയോഗവും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിച്ചു.
