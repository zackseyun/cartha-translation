id: 1KI.11.16
reference: 1 Kings 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: ml
  text: കാരണം, യോവാബ് ഏദോമിലെ സകല ആൺവർഗത്തെയും ഇല്ലാതാക്കുന്നതുവരെ, യോവാബും എല്ലാ ഇസ്രായേലും[a] അവിടെ ആറുമാസം തങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എല്ലാ ഇസ്രായേലും” എന്നത് രാജ്യത്തിലെ ഓരോ വ്യക്തിയെയും എന്നല്ല, യോവാബിനൊപ്പമുണ്ടായിരുന്ന ഇസ്രായേൽ സൈന്യത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന് വിശദീകരണമോ പശ്ചാത്തലകാരണമോ നൽകുന്ന ഘടകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: ആറുമാസം
  rationale: കാലദൈർഘ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: יָשַׁב שָׁם
  choice: അവിടെ താമസിച്ചു
  rationale: സൈനികസന്ദർഭത്തിലെ തുടർച്ചയായ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; സ്ഥിരവാസം നിർബന്ധമായി അർത്ഥമാക്കുന്നില്ല.
- source_word: יוֹאָב
  choice: യോവാബ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ പേരിന്റെ രൂപം.
- source_word: וְכָל יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേലും
  rationale: എബ്രായത്തിലെ സമൂഹനാമം ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യോവാബിനൊപ്പമുള്ള ഇസ്രായേൽ സൈന്യത്തെ സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: പ്രവൃത്തിയുടെ കാലപരമായ അന്ത്യബിന്ദു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הִכְרִית
  choice: ഇല്ലാതാക്കുക
  rationale: ഹിഫീൽ രൂപത്തിന്റെ നശിപ്പിക്കുക, ജനവിഭാഗത്തിൽനിന്ന് നീക്കിക്കളയുക എന്ന ശക്തമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥമായ ‘ഛേദിച്ചുകളയുക’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: כָּל זָכָר
  choice: ആണായ സകലരെയും
  rationale: זָכָר എന്നത് പ്രായപൂർത്തിയായ പുരുഷന്മാർക്ക് മാത്രം പരിമിതമല്ലാത്ത ‘male’ എന്ന അർത്ഥം നൽകുന്നതിനാൽ ‘പുരുഷൻ’ എന്നു ചുരുക്കാതെ ലിംഗസൂചന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: בֶּאֱדוֹם
  choice: ഏദോമിലെ
  rationale: ב എന്ന സ്ഥാനസൂചക ഉപസർഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
