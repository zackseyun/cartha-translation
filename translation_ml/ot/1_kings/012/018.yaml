  to: പിന്നെ രെഹബെയാം രാജാവ് നിർബന്ധിത വേലയുടെ ചുമതലക്കാരനായ അദോരാമിനെ[a] അയച്ചു. ഇസ്രായേൽ മുഴുവനും അവനെ കല്ലുകൊണ്ട് കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു.[b] രെഹബെയാം രാജാവോ യെരൂശലേമിലേക്കു പലായനം ചെയ്യാൻ രഥത്തിൽ കയറാൻ തിടുക്കപ്പെട്ടു.[c]
