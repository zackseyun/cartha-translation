  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת אֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמ֨וּ כָל יִשְׂרָאֵ֥ל בּ֛/וֹ אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: ml
  text: പിന്നെ രെഹബെയാം രാജാവ് നിർബന്ധിത വേലയുടെ ചുമതലക്കാരനായ അദോരാമിനെ[a] അയച്ചു. ഇസ്രായേൽ മുഴുവനും അവനെ കല്ലുകൊണ്ട് കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു.[b] രെഹബെയാം രാജാവോ യെരൂശലേമിലേക്കു പലായനം ചെയ്യാൻ രഥത്തിൽ കയറാൻ തിടുക്കപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിൽ ‘അദോരാം’; ബന്ധപ്പെട്ട ചില ഭാഗങ്ങളിൽ ‘അദോനീരാം’ എന്ന നാമരൂപം കാണുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘അവനെ കല്ലുകൊണ്ട് കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘രഥത്തിൽ കയറാൻ തന്നെത്താൻ ശക്തിപ്പെടുത്തി.’ സന്ദർഭത്തിൽ ഇത് അടിയന്തരമായി രഥത്തിൽ കയറാനുള്ള തിടുക്കത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം; അദോരാമിനെ ഒരു ദൗത്യത്തിനായി അയച്ചതായി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֲדֹרָם
  choice: അദോരാം
  rationale: WLC/മസോരറ്റിക് പാഠത്തിൽ ഇവിടെ കാണുന്ന നാമരൂപം തന്നെയാണ് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയത്.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: നിർബന്ധിതവേലയുടെ മേൽവിചാരകനായിരുന്ന
  rationale: മַס ഇവിടെ പണനികുതിയല്ല, ഭരണകൂടം ചുമത്തിയ നിർബന്ധിത തൊഴിലാണ്; עַל എന്നത് അതിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן וַיָּמֹת
  choice: അവനെ കല്ലെറിഞ്ഞുകൊന്നു
  rationale: ‘കല്ലെറിഞ്ഞു; അവൻ മരിച്ചു’ എന്ന ഹീബ്രു ക്രമത്തിന്റെ ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; കല്ല് എന്ന വ്യക്തമായ ഘടകവും നിലനിർത്തുന്നു.
- source_word: כָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ഈ സന്ദർഭത്തിൽ വടക്കൻ ഗോത്രങ്ങളെ രാഷ്ട്രീയ-സാമൂഹിക സമുച്ചയമായി വിളിക്കുന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הִתְאַמֵּץ
  choice: സർവശക്തിയും പ്രയോഗിച്ചു
  rationale: ഹിത്പഅേൽ രൂപത്തിന്റെ ‘സ്വയം ശക്തിപ്പെടുത്തുക/ശ്രമം സമാഹരിക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് അടിയന്തരമായ രക്ഷപ്പെടൽസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: രഥത്തിൽ കയറുന്നതിനായി
  rationale: עלה ഇവിടെ രഥത്തിൽ കയറുക എന്ന ദിശാസൂചക അർഥത്തിലാണ്.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: യെരൂശലേമിലേക്കു ഓടിപ്പോകാൻ
  rationale: נוּס നിഷ്പക്ഷമായ യാത്രയല്ല, അപകടത്തിൽനിന്നുള്ള പലായനമാണ് സൂചിപ്പിക്കുന്നത്.
