translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘നിർബന്ധിതവേല’ സാധാരണ വായനക്കാർക്ക് corvée എന്ന ആശയം വ്യക്തമായി നൽകുന്നു. ഹീബ്രുവിലെ തുടർച്ചയായ וַ-ഘടന മലയാളത്തിൽ ആവർത്തനഭാരം വരാതിരിക്കാനായി ‘പിന്നെ’, ‘എന്നാൽ’, ‘ആകട്ടെ’ എന്നിവയാൽ ബന്ധിപ്പിച്ചു; എതിർഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
