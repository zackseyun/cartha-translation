id: 1KI.12.26
reference: 1 Kings 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: ml
  text: 'യൊരോബെയാം തന്റെ ഹൃദയത്തിൽ പറഞ്ഞു[a]: “ഇപ്പോൾ രാജ്യം ദാവീദിന്റെ ഭവനത്തിലേക്കു മടങ്ങിപ്പോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മനസ്സിൽ” അല്ലെങ്കിൽ “തന്നോടുതന്നെ.” ഹീബ്രുവിൽ അക്ഷരാർഥം “തന്റെ ഹൃദയത്തിൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിൽ ‘പറഞ്ഞു’ മതിയാകുന്നതിനാൽ നിർബന്ധിതമായി ‘അപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ പേരിന്റെ രൂപം സ്വീകരിച്ചു.
- source_word: בְּלִבּוֹ
  choice: തന്റെ ഹൃദയത്തിൽ
  rationale: അക്ഷരാർഥത്തിലുള്ള ഹീബ്രു രൂപകൽപ്പന നിലനിർത്തുന്നു; ഇവിടെ അത് ഉള്ളിലെ ചിന്തയെ സൂചിപ്പിക്കുന്നു.
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: യൊരോബെയാമിന്റെ ആശങ്കയിലെ അടിയന്തരതയും വർത്തമാന സാഹചര്യവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: תָּשׁוּב
  choice: മടങ്ങിപ്പോകും
  rationale: שׁוב എന്ന ക്രിയയുടെ ‘തിരികെ പോകുക/മടങ്ങുക’ എന്ന അർഥവും രാജ്യം മുൻ രാജവംശത്തിലേക്കു തിരിച്ചെത്തുമെന്ന രാഷ്ട്രീയ സന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמַּמְלָכָה
  choice: രാജ്യം
  rationale: ഇവിടെ രാജാധികാരത്തെയും രാഷ്ട്രീയ രാജ്യത്തെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: לְבֵית דָּוִד
  choice: ദാവീദിന്റെ ഭവനത്തിലേക്ക്
  rationale: ‘ദാവീദിന്റെ ഭവനം’ എന്ന ബൈബിൾ പ്രയോഗം രാജവംശപരമായ അർഥവും മൂലപാഠത്തിന്റെ രൂപവും നിലനിർത്തുന്നു; ‘ദാവീദിന്റെ രാജവംശം’ എന്ന വ്യാഖ്യാനാത്മക രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: בְּלִבּוֹ എന്ന ആന്തരികസംസാര പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: തന്റെ ഹൃദയത്തിൽ
  alternative: മനസ്സിൽ / തന്നോടുതന്നെ
  rationale: ‘ഹൃദയത്തിൽ’ എന്ന മൂലഭാഷാ ദൃശ്യരൂപം അർഥം മറയ്ക്കാതെ നിലനിർത്തുന്നു. അത് ആന്തരിക ചിന്തയാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു; പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയത്തിൽ’ എന്നും ‘ദാവീദിന്റെ ഭവനം’ എന്നും ഉള്ള മൂലപാഠസമീപമായ ബൈബിൾ ദൃശ്യങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി.
