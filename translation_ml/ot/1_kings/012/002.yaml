id: 1KI.12.2
reference: 1 Kings 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: ml
  text: നെബാത്തിന്റെ മകനായ യൊരോബെയാം ഇതു കേട്ടപ്പോൾ[a]—ശലോമോൻ രാജാവിൽനിന്ന് ഓടി എത്തിയ ഈജിപ്തിൽ അവൻ അപ്പോഴും ഉണ്ടായിരുന്നു—യൊരോബെയാം ഈജിപ്തിൽ താമസിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘യൊരോബെയാം കേട്ടപ്പോൾ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അവൻ എന്താണ് കേട്ടതെന്നത് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്.
    reason: മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത കർമത്തെ മലയാളത്തിൽ ‘ഇതു’ എന്നു നൽകിയതു സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: וַיְהִי
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ആഖ്യാനവാക്യത്തിന്റെ ഒഴുക്കിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ ഈ രൂപം ആഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ മലയാളത്തിൽ കൃത്രിമമായ ഒരു തുടക്കപദം ചേർത്തില്ല.
- source_word: כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: כְּ + infinitive construct ഇവിടെ കാലസംബന്ധമായ ഉപവാക്യം അവതരിപ്പിക്കുന്നു; ‘കേട്ടപ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: വ്യക്തിനാമങ്ങളും പിതൃനാമസൂചനയും നിലനിർത്തി, മലയാളത്തിലെ സ്വാഭാവിക ബന്ധരൂപത്തിൽ നൽകി.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: അവൻ അപ്പോഴും ഈജിപ്തിലായിരുന്നു
  rationale: കേൾക്കുന്ന സമയത്ത് അവൻ ഈജിപ്തിൽ തുടർന്നും ഉണ്ടായിരുന്നുവെന്ന സാഹചര്യവിവരം വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ മുമ്പിൽനിന്ന് ഓടിപ്പോയ
  rationale: מִפְּנֵי എന്നതിലെ ‘സന്നിധിയിൽനിന്ന്/അധികാരപരിധിയിൽനിന്ന്’ എന്ന ആശയം ചുരുക്കാതെയും, ഭയം പോലുള്ള വ്യക്തമാക്കാത്ത കാരണം ചേർക്കാതെയും നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: യൊരോബെയാം ഈജിപ്തിൽത്തന്നെ താമസിച്ചുവരികയായിരുന്നു
  rationale: ישׁב എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘താമസിക്കുക’ എന്ന അർഥവും തുടർന്നുള്ള വാസത്തിന്റെ ഭാവവും നൽകുന്നു; മൂലപാഠത്തിലെ യൊരോബെയാമിന്റെയും ഈജിപ്തിന്റെയും ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: מִצְרַיִם
  choice: ഈജിപ്ത്
  rationale: ആധുനിക സാധാരണ മലയാളവായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന നിലവിലെ ഭൂമിശാസ്ത്രനാമം ഉപയോഗിച്ചു.
- source_word: שְׁמֹעַ
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: എബ്രായത്തിൽ കേട്ടതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി സന്ദർഭത്തിൽ സൂചിതമായതിനെ ‘ഇതു’ എന്നു നൽകി, അതിന്റെ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ആവർത്തനവും അല്പം വിചിത്രമായ വാക്യഘടനയും പൂർണമായി മിനുക്കിമാറ്റാതെ നിലനിർത്തി; ദീർഘവാക്യത്തിലെ സാഹചര്യവിവരം വേർതിരിക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
