  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: ml
  text: ഈ കാര്യം പാപമായിത്തീർന്നു; ജനം ആ ഒന്നിന്റെ മുമ്പിലേക്കു ദാൻ വരെ പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ആ ഒന്നിന്റെ മുമ്പിൽ.” യൊരോബെയാം സ്ഥാപിച്ച രണ്ടു കാളക്കുട്ടികളിൽ ഒന്നിനെ—പ്രത്യേകിച്ച് ദാനിലുണ്ടായിരുന്നതിനെ—ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആയിത്തീർന്നു
  rationale: לְחַטָּאת എന്ന പദത്തോടൊപ്പം ഇവിടെ വെറും നിലനിൽപ്പല്ല, ഫലമായി പാപമായിത്തീരുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം
  rationale: דבר എന്ന വിശാലാർഥമുള്ള പദം സന്ദർഭത്തിൽ യൊരോബെയാമിന്റെ ആരാധനാക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നു; 'ഈ കാര്യം' സ്വാഭാവികവും നിർദ്ദേശകഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: לְחַטָּאת
  choice: പാപം
  rationale: ആരാധനാസന്ദർഭത്തിലെ തെറ്റിനെ സൂചിപ്പിക്കുന്ന നാമരൂപം നിലനിർത്തുന്നു; ഇവിടെ 'പാപയാഗം' എന്ന അർഥം യോജിക്കുന്നില്ല.
- source_word: וַיֵּלְכוּ הָעָם
  choice: ജനം ... പോയി
  rationale: הלך എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ 'പോയി' നിലനിർത്തുന്നു; ആരാധിച്ചു എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: പദത്തിന്റെ 'മുമ്പിൽ/സന്നിധിയിൽ' എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തി, ആരാധനയ്ക്കായി എന്ന ആശയം നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: הָאֶחָד
  choice: ആ ഒന്നിന്റെ
  rationale: എബ്രായത്തിൽ നാമം വിട്ടുകളഞ്ഞ് 'ആ ഒന്ന്' എന്നു മാത്രമാണ് ഉള്ളത്. മലയാളത്തിൽ ബന്ധം വ്യക്തമാകാൻ ഷഷ്ഠീരൂപം ഉപയോഗിച്ചെങ്കിലും കാളക്കുട്ടി എന്നു മുഖ്യപാഠത്തിൽ പൂരിപ്പിച്ചിട്ടില്ല.
- source_word: עַד דָּן
  choice: ദാൻവരെ
  rationale: עד സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ അറ്റം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യൊരോബെയാമിന്റെ ആരാധനാക്രമീകരണത്തിലെ പാപത്തിന്റെ സ്വഭാവം
  choice: ഈ കാര്യം പാപമായിത്തീർന്നു എന്നു മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: ഇത് പാപത്തിന് കാരണമായി എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: חַטָּאת ഇവിടെ പാപം എന്ന അർഥത്തിലാണ്; എന്നാൽ വാക്യം വ്യക്തമാക്കുന്നതിലപ്പുറം പ്രത്യേക സിദ്ധാന്തവിഭാഗം ചേർക്കുന്നില്ല.
- issue: '''ആ ഒന്ന്'' എന്നതിന്റെ സൂചിതവസ്തു'
  choice: എബ്രായത്തിലെ സംക്ഷിപ്തവും അസ്പഷ്ടവുമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സാധ്യതയുള്ള സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ 'ആ കാളക്കുട്ടിയുടെ മുമ്പിൽ' എന്നു പൂരിപ്പിക്കുക.
  rationale: മുൻസന്ദർഭത്തിലെ രണ്ടു കാളക്കുട്ടികളിൽ ഒന്നിനെ, പ്രത്യേകിച്ച് ദാനിലുള്ളതിനെ, ഉദ്ദേശിക്കുന്നതാകാം; എങ്കിലും മൂലപാഠത്തിൽ നാമം വ്യക്തമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ അസ്പഷ്ടത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
