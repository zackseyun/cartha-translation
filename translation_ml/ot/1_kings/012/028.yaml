  text: וַ/יִּוָּעַ֣ץ הַ/מֶּ֔לֶךְ וַ/יַּ֕עַשׂ שְׁנֵ֖י עֶגְלֵ֣י זָהָ֑ב וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם רַב לָ/כֶם֙ מֵ/עֲל֣וֹת יְרוּשָׁלִַ֔ם הִנֵּ֤ה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: ml
  text: 'അങ്ങനെ രാജാവ് ആലോചിച്ചശേഷം സ്വർണംകൊണ്ട് രണ്ടു കാളക്കുട്ടികളെ ഉണ്ടാക്കി. അവൻ ജനത്തോടു പറഞ്ഞു: “യെരൂശലേമിലേക്കു കയറിപ്പോകുന്നത് നിങ്ങൾക്കു വലിയ ബുദ്ധിമുട്ടാണ്.[a] ഇസ്രായേലേ, ഈജിപ്തുദേശത്തുനിന്നു നിന്നെ കയറ്റിക്കൊണ്ടുവന്ന നിന്റെ ദേവന്മാർ ഇതാ![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ യെരൂശലേമിലേക്കു കയറിപ്പോയത് മതി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഇസ്രായേലേ, ... നിന്റെ ദൈവം ഇതാ!” എബ്രായത്തിലെ നാമരൂപം ചിലപ്പോൾ ഏകവചന പദവിയായി ഉപയോഗിക്കാം; ഈ വാക്കുകൾ പുറപ്പാട് 32:4-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. എന്നാൽ ഇവിടെ രണ്ടു കാളക്കുട്ടികളും ബഹുവചന ക്രിയയും ഉള്ളതിനാൽ “നിന്റെ ദേവന്മാർ” എന്ന വിവർത്തനത്തിനാണ് മുൻഗണന നൽകിയിരിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ആലോചിച്ചശേഷം
  rationale: നിഫാൽ രൂപം രാജാവ് കൂടിയാലോചിക്കുകയോ ആലോചന നടത്തുകയോ ചെയ്തതായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭത്തോട് സ്വാഭാവികമായി ചേരുന്ന സംക്ഷിപ്ത പ്രയോഗമാണിത്.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: സ്വർണംകൊണ്ട് രണ്ടു കാളക്കുട്ടികളെ
  rationale: എബ്രായത്തിലെ ‘സ്വർണംകൊണ്ടുള്ള രണ്ടു കാളക്കുട്ടികൾ’ എന്ന ഘടനയും പുറപ്പാട് 32-ലെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: യെരൂശലേമിലേക്കു കയറിപ്പോകുന്നത് നിങ്ങൾക്കു വലിയ ബുദ്ധിമുട്ടാണ്
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്ര അവർക്കു അതിരുകടന്ന ഭാരമാണെന്ന രാജാവിന്റെ വാദം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘പോയത് മതി’ എന്ന കാലപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: കാണിച്ചുകൊണ്ടുള്ള ആഹ്വാനത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: ഇസ്രായേലേ ... നിന്റെ ദേവന്മാർ
  rationale: രണ്ടു കാളക്കുട്ടികളും പിന്നാലെയുള്ള ബഹുവചന ക്രിയയും ബഹുവചന വിവർത്തനത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. സംബോധനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הֶעֱלוּךָ
  choice: നിന്നെ കയറ്റിക്കൊണ്ടുവന്ന
  rationale: ഇസ്രായേലിനെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നതിനെക്കുറിച്ചുള്ള പുറപ്പാട്-പ്രയോഗത്തിന്റെ ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്ന ദിശാസൂചന സംരക്ഷിക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്നു
  rationale: എബ്രായത്തിലെ സ്ഥിരമായ പുറപ്പാട്-സൂത്രവാക്യത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֱלֹהֶיךָ എന്നത് ഏകവചനമായോ ബഹുവചനമായോ വിവർത്തനം ചെയ്യണമോ
  choice: 'ബഹുവചനം: ‘നിന്റെ ദേവന്മാർ’'
  alternative: 'ഏകവചനം: ‘നിന്റെ ദൈവം’'
  rationale: אֱלֹהִים ചിലപ്പോൾ ഏകവചന പദവിയായി പ്രവർത്തിക്കാമെങ്കിലും, ഇവിടെ രണ്ടു കാളക്കുട്ടികളാണ് പരാമർശിക്കപ്പെടുന്നത്; കൂടാതെ הֶעֱלוּ എന്ന ക്രിയ ബഹുവചനത്തിലാണ്. അതിനാൽ മുഖ്യപാഠത്തിൽ ബഹുവചനം കൂടുതൽ സാധ്യതയുള്ളതാണ്; യഥാർഥമായ ഏകവചനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഇതാ’, ‘ഇസ്രായേലേ’ എന്നിവ പ്രസംഗത്തിന്റെ ഔപചാരിക ശക്തി നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
