source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: ml
  text: 'യാഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: “നിങ്ങൾ കയറിപ്പോകരുത്; നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളോടു യുദ്ധം ചെയ്യരുത്.[a] ഓരോരുത്തരും അവനവന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകുവിൻ. ഈ കാര്യം എന്നിൽനിന്നുണ്ടായതാണ്.” അപ്പോൾ അവർ യാഹ്‌വെയുടെ വചനം കേട്ട്[b], യാഹ്‌വെയുടെ വചനപ്രകാരം മടങ്ങിപ്പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളോടുകൂടെ”; എന്നാൽ ‘യുദ്ധം ചെയ്യുക’ എന്ന ക്രിയയോടൊപ്പം ഈ പ്രയോഗത്തിന് അവർക്കെതിരായി യുദ്ധം ചെയ്യുക എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യാഹ്‌വെയുടെ വചനം അനുസരിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്നും ‘അനുസരിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: യാഹ്‌വെ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകസന്ദേശത്തിന്റെ ഔപചാരിക സൂത്രവാക്യം നിലനിർത്തുന്നു. യְהוָה എന്ന ദൈവനാമം ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לֹא תַעֲלוּ
  choice: നിങ്ങൾ കയറിപ്പോകരുത്
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനദിശാസൂചന നിലനിർത്തുന്നു; സൈനികമായി പുറപ്പെടുക എന്ന ആശയവും സന്ദർഭത്തിൽ ഗ്രഹിക്കാം.
- source_word: וְלֹא תִלָּחֲמוּן עִם
  choice: യുദ്ധം ചെയ്യുകയുമരുത്
  rationale: לחם എന്ന ക്രിയയുടെ യുദ്ധംചെയ്യുക എന്ന അർഥവും, അതോടുകൂടിയ עִם ഇവിടെ എതിരായി യുദ്ധം ചെയ്യുക എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കൾ
  rationale: ആഭ്യന്തരയുദ്ധം സ്വന്തം സഹോദരജനത്തിനെതിരെയാണെന്ന ബന്ധുത്വഊന്നൽ സംരക്ഷിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകുന്നു.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകുക
  rationale: אִישׁ എന്ന പദത്തിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തൻ’ മലയാളത്തിലെ സ്വാഭാവികമായ ‘അവനവന്റെ’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: ഈ കാര്യം എന്നിൽനിന്നുണ്ടായതാണ്
  rationale: രാഷ്ട്രീയസംഭവത്തിന്റെ ഉറവിടം ദൈവമാണെന്ന പ്രസ്താവന നിലനിർത്തുന്നു; ദൈവിക കാരണപ്രവർത്തനത്തിന്റെ രീതി പാഠത്തിൽ ഉള്ളതിലധികം വിശദീകരിക്കുന്നില്ല.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: അവർ യാഹ്‌വെയുടെ വചനം കേട്ട്
  rationale: שׁמע എന്ന പദത്തിലെ ‘കേൾക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള പ്രവർത്തനം അനുസരണവും സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: യാഹ്‌വെയുടെ വചനപ്രകാരം മടങ്ങിപ്പോയി
  rationale: മടങ്ങുകയും പോകുകയും ചെയ്യുന്ന ഹീബ്രു ക്രിയാസംയോജനം സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കി നൽകുമ്പോഴും, ദൈവവചനത്തോടുള്ള അനുരൂപത വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: ഹീബ്രു പാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധ്യമായത്ര അടുത്ത മലയാളലിപ്യന്തരണമായി നൽകുന്നു.
- issue: אֲחֵיכֶם എന്ന ബന്ധുത്വപദം
  choice: നിങ്ങളുടെ സഹോദരന്മാർ
  alternative: നിങ്ങളുടെ സഹഇസ്രായേല്യർ
  rationale: ഇത് സ്വന്തം ഉടമ്പടിജനത്തിനെതിരായ യുദ്ധമാണെന്ന പാഠത്തിലെ കുടുംബബന്ധപരമായ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- issue: מֵאִתִּי נִהְיָה എന്നതിലെ ദൈവിക കാരണബന്ധം
  choice: എന്നിൽനിന്നുണ്ടായതാണ്
  alternative: എന്റെ ഹിതപ്രകാരം സംഭവിച്ചതാണ്
  rationale: സംഭവം ദൈവത്തിൽനിന്നുള്ളതാണെന്ന് ഉറപ്പിക്കുന്നു; എന്നാൽ അനുവാദം, നിർദേശം, നേരിട്ടുള്ള കാരണപ്രവർത്തനം എന്നിവയിൽ ഏതാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പ്രവാചകസൂത്രവാക്യത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ എന്ന ബൈബിൾപരിചിതമായ ഔപചാരികപ്രയോഗം നിലനിർത്തിയെങ്കിലും, ശേഷിക്കുന്ന വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സ്വാഭാവിക ഭാഷയിലാണ്.
