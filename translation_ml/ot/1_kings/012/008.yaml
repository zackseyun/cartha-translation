translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘മൂപ്പന്മാർ’–‘യുവാക്കൾ’ എന്ന വൈരുധ്യം നിലനിർത്തി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന [a] മുഖ്യവാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
