  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: ml
  text: 'രാജാവ് തങ്ങളുടെ വാക്കു കേട്ടില്ലെന്ന് ഇസ്രായേൽ മുഴുവനും കണ്ടപ്പോൾ, ജനം രാജാവിനോട് ഇങ്ങനെ മറുപടി പറഞ്ഞു: “ദാവീദിൽ നമുക്ക് എന്ത് ഓഹരിയാണുള്ളത്? യിശ്ശായിയുടെ മകനിൽ നമുക്ക് അവകാശമില്ല. ഇസ്രായേലേ, നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോകുവിൻ![a] ദാവീദേ, ഇനി നിന്റെ ഭവനം നീ നോക്കിക്കൊള്ളുക![b]” അങ്ങനെ ഇസ്രായേൽ തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലേ, നിങ്ങളുടെ വീടുകളിലേക്കു പോകുവിൻ!” എബ്രായയിൽ അക്ഷരാർഥം “നിങ്ങളുടെ കൂടാരങ്ങളിലേക്ക്” എന്നാണ്; പിരിഞ്ഞുപോകുകയും രാജാവിനോടുള്ള കൂറ് പിൻവലിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: '“ഭവനം” എന്നതിന് ഇവിടെ “രാജവംശം” എന്ന അർഥവും ഉണ്ടാകാം: “ദാവീദേ, ഇനി നിന്റെ സ്വന്തം രാജവംശം നീ നോക്കിക്കൊള്ളുക!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രാജാവിന്റെ നിലപാട് അവർ തിരിച്ചറിഞ്ഞുവെന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: വ്യക്തികളെ മാത്രം സൂചിപ്പിക്കാതെ രാഷ്ട്രീയ-ദേശീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കൂട്ടായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: തങ്ങളുടെ വാക്കു കേട്ടില്ല
  rationale: שׁמע ഇവിടെ ശബ്ദം കേൾക്കുക എന്നതിലുപരി അവരുടെ വാക്ക് അംഗീകരിക്കാതിരിക്കുക, ചെവിക്കൊള്ളാതിരിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിലെ ഈ പ്രയോഗം രണ്ടും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: ജനം രാജാവിനോട് ഇങ്ങനെ മറുപടി പറഞ്ഞു
  rationale: ‘ഒരു വാക്ക് തിരികെ കൊടുത്തു’ എന്ന എബ്രായ ശൈലിയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: ദാവീദിൽ നമുക്ക് എന്ത് ഓഹരിയാണുള്ളത്?
  rationale: חֵלֶק എന്നതിലെ പങ്ക്/വിഹിതം എന്ന രാഷ്ട്രീയവും അവകാശപരവുമായ ഭാവം ‘ഓഹരി’ നിലനിർത്തുന്നു.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: യിശ്ശായിയുടെ മകനിൽ നമുക്ക് അവകാശമില്ല
  rationale: נַחֲלָה എന്നതിലെ അവകാശം, പൈതൃകവിഹിതം എന്നീ ആശയങ്ങൾ ‘അവകാശം’ വഴി വ്യക്തമായി നൽകുന്നു; ദാവീദിനെ രാജപദവി ഉപയോഗിക്കാതെ പിതൃബന്ധത്താൽ വിളിക്കുന്ന പരിഹാസാത്മക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: ഇസ്രായേലേ, നിങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോകുവിൻ!
  rationale: കൂടാരങ്ങളിലേക്കു പിരിഞ്ഞുപോകാനും രാജനിഷ്ഠ പിൻവലിക്കാനും ഉള്ള ചരിത്രപരമായ ആഹ്വാനം അക്ഷരാർഥ പദം നിലനിർത്തി വിവർത്തനം ചെയ്യുന്നു; പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: ദാവീദേ, ഇനി നിന്റെ ഭവനം നീ നോക്കിക്കൊള്ളുക!
  rationale: ראה എന്നതിന്റെ ‘ശ്രദ്ധിക്കുക/നോക്കിക്കൊള്ളുക’ എന്ന സന്ദർഭാർഥവും בַּיִת എന്നതിലെ ഭവനം-രാജവംശം ദ്വയാർഥവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: അങ്ങനെ ഇസ്രായേൽ തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോയി
  rationale: കൂട്ടായ ഏകവചനമായ ‘ഇസ്രായേൽ’ എന്ന പ്രയോഗവും മുമ്പത്തെ കൂടാര-ആഹ്വാനത്തിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ ഭവനത്തിനെതിരായ രാഷ്ട്രീയ മുദ്രാവാക്യം
  choice: ദാവീദിക രാജവംശത്തോടുള്ള രാഷ്ട്രീയ ബന്ധം നിരസിക്കുന്ന വാക്കുകളായി നേരിട്ട് വിവർത്തനം ചെയ്തു; അതിനപ്പുറമുള്ള ദൈവശാസ്ത്രവിധി ചേർത്തില്ല.
  alternative: ഇത് ദാവീദിക ഉടമ്പടിയെയോ മശീഹാപ്രതീക്ഷയെയോ നേരിട്ട് നിരസിക്കുന്ന പ്രസ്താവനയായി ശക്തിപ്പെടുത്തുക.
  rationale: സന്ദർഭം രെഹബെയാമിനും ദാവീദിക രാജാധിപത്യത്തിനുമെതിരായ ചരിത്രപരമായ കലാപമാണ്. മൂലപാഠത്തിലെ കലാപത്തിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും അതു പ്രസ്താവിക്കാത്ത പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ചരിത്രവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘ഓഹരി’, ‘അവകാശം’, ‘കൂടാരം’, ‘ഭവനം’ എന്നിവ ഉപയോഗിച്ച് മൂലപാഠത്തിലെ രാഷ്ട്രീയവും അവകാശപരവും രാജവംശപരവുമായ പദബന്ധങ്ങൾ നിലനിർത്തി.
