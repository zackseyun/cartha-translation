  source_fidelity: 'The Malayalam accurately reflects the Hebrew sequence and force: Israel recognizes that the king has not heeded them, answers with a political repudiation of David and Jesse’s son, calls for withdrawal to the tents, and departs. “തങ്ങളുടെ വാക്കു കേട്ടില്ല” naturally conveys שמע עם אל in this context, and “ഓഹരി” / “അവകാശം” preserve the paired share–inheritance wording without imposing interpretation.'
