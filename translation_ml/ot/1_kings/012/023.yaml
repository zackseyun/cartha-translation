  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: ml
  text: 'ശലോമോന്റെ മകനും യെഹൂദാരാജാവുമായ രെഹബെയാമിനോടും യെഹൂദാഗൃഹം മുഴുവനോടും[a] ബെന്യാമീനോടും ശേഷിച്ച ജനത്തോടും[b] ഇപ്രകാരം പറയുക:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദാഗൃഹം’ എന്നത് യെഹൂദയോടു ചേർന്ന സമൂഹത്തെയോ രാഷ്ട്രീയ കൂട്ടായ്മയെയോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; ‘യെഹൂദ മുഴുവനും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ ‘ജനം’ എന്നത് യുദ്ധത്തിനായി കൂടിയവരെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ ഹീബ്രു മൂലപാഠം ‘സൈന്യം’ എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: പറയുക
  rationale: אמר എന്ന ക്രിയയുടെ ആജ്ഞാരൂപമാണിത്; തുടർന്നുവരുന്ന ദൈവിക സന്ദേശം അറിയിക്കാനുള്ള നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בֶּן שְׁלֹמֹה
  choice: ശലോമോന്റെ മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രു സംയുക്തഘടനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവ്
  rationale: യെഹൂദയുടെ രാജാവ് എന്ന രാജകീയ പദവി മലയാളത്തിലെ പതിവുള്ള സംയുക്തരൂപത്തിൽ നൽകി.
- source_word: כָּל בֵּית יְהוּדָה
  choice: യെഹൂദാഗൃഹം മുഴുവൻ
  rationale: രാഷ്ട്രീയ-സാമൂഹിക കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന ‘ഗൃഹം’ എന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וּבִנְיָמִין
  choice: ബെന്യാമീൻ
  rationale: ഗോത്രനാമം മൂലപാഠത്തിൽ സ്വതന്ത്രമായി നിൽക്കുന്നതിനാൽ അതേ കൂട്ടായ അർഥത്തോടെ ലിപ്യന്തരിച്ചു.
- source_word: וְיֶתֶר הָעָם
  choice: ശേഷിച്ച ജനം
  rationale: יֶתֶר എന്നതിന്റെ ‘ശേഷിപ്പ്/ബാക്കി’ എന്ന അർഥവും הָעָם എന്നതിന്റെ ‘ജനം’ എന്ന പൊതുവായ അർഥവും നിലനിർത്തുന്നു; സന്ദർഭം യുദ്ധത്തിനായി കൂടിയവരെ സൂചിപ്പിക്കാമെങ്കിലും ‘സൈന്യം’ എന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: לֵאמֹר
  choice: 'ഇപ്രകാരം പറയുക:'
  rationale: അടുത്ത വാക്യത്തിലെ സന്ദേശം അവതരിപ്പിക്കുന്ന ഉദ്ധരണിസൂചക പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ പാരമ്പര്യത്തിലെ പരിചിത രൂപങ്ങൾ ഉപയോഗിച്ചു; ‘യെഹൂദാഗൃഹം’ എന്ന ഹീബ്രു കൂട്ടായ്മാപ്രയോഗം അർഥം ചുരുക്കാതെ നിലനിർത്തി.
