  text: וַ/יְהִי֙ דְּבַ֣ר הָֽ/אֱלֹהִ֔ים אֶל שְׁמַעְיָ֥ה אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ വചനം ദൈവപുരുഷനായ ശെമയ്യാവിന് ലഭിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ‘ദൈവം’ (אֱלֹהִים) എന്നാണ്; സമാനമായ പല പ്രയോഗങ്ങളിലും കാണുന്ന ദൈവനാമമായ യഹോവ (יהוה) എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְּבַר הָאֱלֹהִים אֶל
  choice: ദൈവത്തിന്റെ വചനം ... അരുളിച്ചെയ്യപ്പെട്ടു
  rationale: ഈ പ്രവാചകസന്ദേശ സൂത്രവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു. ‘വചനം’ ദൈവിക വെളിപ്പെടുത്തലിന്റെ ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; ‘അരുളിച്ചെയ്യപ്പെട്ടു’ സന്ദേശം ലഭിച്ചതിന്റെ സംഭവസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: שְׁמַעְיָה
  choice: ശെമയ്യാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം; വാക്യത്തിലെ വിഭക്തിപ്രയോഗത്തിന് ‘ശെമയ്യാവിന്’ എന്നു ചേർത്തു.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ദൈവപുരുഷൻ
  rationale: പ്രവാചകപദവിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപ്രയോഗം; ഇവിടെ ശെമയ്യാവിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ ‘ദൈവപുരുഷനായ’ എന്നു നൽകി.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: എബ്രായത്തിലെ ‘പറഞ്ഞുകൊണ്ട്/പറയാൻ’ എന്ന അവതാരകപ്രയോഗം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; അടുത്ത വാക്യത്തിലെ ദൈവവചനവുമായി ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വെളിപ്പെടുത്തൽസൂത്രത്തിലെ הָאֱלֹהִים എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവനാമമായ יהוה അല്ല, אֱלֹהִים തന്നെയാണ്. അതിനാൽ സമാനമായ മറ്റു സൂത്രവാക്യങ്ങളോട് ഒത്തുനോക്കി മാറ്റാതെ മൂലപാഠത്തിന്റെ കൃത്യമായ പദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും ഉള്ള മലയാളം. ‘ദൈവപുരുഷൻ’, ‘വചനം’, ‘അരുളിച്ചെയ്യപ്പെട്ടു’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; എബ്രായത്തിലെ അവസാന לֵאמֹר മലയാളത്തിൽ അസ്വാഭാവികമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിനു പകരം ദ്വിബിന്ദുവായി അവതരിപ്പിച്ചു.
