id: 1KI.12.12
reference: 1 Kings 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: ml
  text: അങ്ങനെ യൊരോബെയാമും എല്ലാ ജനങ്ങളും മൂന്നാം ദിവസം രെഹബെയാമിന്റെ അടുക്കൽ വന്നു; “മൂന്നാം ദിവസം എന്റെ അടുക്കൽ മടങ്ങിവരുക” എന്നു രാജാവ് പറഞ്ഞതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക’ അല്ലെങ്കിൽ ‘പോകുക’ എന്നാകാം; രെഹബെയാമിന്റെ അടുക്കലേക്കുള്ള നീക്കത്തെ ഇവിടെ സ്വാഭാവികമായി ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: וְכָל הָעָם
  choice: ജനമെല്ലാം
  rationale: രാജാവിനോട് അപേക്ഷിച്ച ജനസമൂഹത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: אֶל רְחַבְעָם
  choice: രെഹബെയാമിന്റെ അടുക്കൽ
  rationale: אֶל ഒരാളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; വ്യക്തിയുടെ സന്നിധിയിലേക്കുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: എബ്രായത്തിലെ സാധാരണ കാലസൂചകപ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: כַּאֲשֶׁר
  choice: പറഞ്ഞിരുന്നതുപോലെതന്നെ
  rationale: ജനത്തിന്റെ പ്രവൃത്തിയും രാജാവിന്റെ മുൻനിർദേശവും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം ‘പോലെതന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: രാജാവ് പറഞ്ഞിരുന്നത്
  rationale: അവർ വന്നതിനു മുമ്പ് രാജാവ് പറഞ്ഞ വാക്കാണെന്ന കാലബന്ധം മലയാളത്തിലെ ഭൂതപൂർവരൂപം വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: എന്നു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള ഉദ്ധരണിചിഹ്നം.
- source_word: שׁוּבוּ אֵלַי
  choice: എന്റെ അടുക്കൽ വീണ്ടും വരുക
  rationale: שׁוּב മടങ്ങിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; രാജാവിന്റെ കാഴ്ചപ്പാടിൽ വീണ്ടും തന്റെ അടുക്കൽ വരണമെന്ന നിർദേശം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ വിവരക്രമവും രാജാവിന്റെ നേരിട്ടുള്ള വാക്കും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ [a] കുറിപ്പ് യഥാർഥ പാഠഭേദമോ വ്യക്തമായ ശബ്ദാർഥവികൽപമോ നൽകാത്തതിനാൽ ഉറവിടസാക്ഷ്യത്തിന്റെ അടിസ്ഥാനത്തിൽ മലയാള കരടിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
