revisions:
- from: അങ്ങനെ, യൊരോബെയാമും ജനമെല്ലാം മൂന്നാം ദിവസം രെഹബെയാമിന്റെ അടുക്കൽ വന്നു. “മൂന്നാം ദിവസം എന്റെ അടുക്കൽ വീണ്ടും വരുക” എന്നു രാജാവ് പറഞ്ഞിരുന്നതുപോലെതന്നെയായിരുന്നു അത്.
  to: അങ്ങനെ യൊരോബെയാമും എല്ലാ ജനങ്ങളും മൂന്നാം ദിവസം രെഹബെയാമിന്റെ അടുക്കൽ വന്നു; “മൂന്നാം ദിവസം എന്റെ അടുക്കൽ മടങ്ങിവരുക” എന്നു രാജാവ് പറഞ്ഞതുപോലെതന്നെ.
