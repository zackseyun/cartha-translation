source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: ml
  text: രെഹബെയാം യെരൂശലേമിൽ എത്തിയപ്പോൾ, യെഹൂദാഗൃഹം മുഴുവനെയും ബെന്യാമീൻ ഗോത്രത്തെയും—തിരഞ്ഞെടുക്കപ്പെട്ട യോദ്ധാക്കളായ ഒരു ലക്ഷത്തി എൺപതിനായിരം പേരെ—വിളിച്ചുകൂട്ടി. യിസ്രായേൽഗൃഹത്തിനെതിരെ യുദ്ധം ചെയ്യാനും രാജ്യം ശലോമോന്റെ മകനായ രെഹബെയാമിന് തിരികെ ഏൽപ്പിക്കാനുമായിരുന്നത് അത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: എത്തിയപ്പോൾ
  rationale: യെരൂശലേം ലക്ഷ്യസ്ഥാനമായതിനാൽ בוא എന്ന ക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എത്തി’ എന്നു നൽകി; വ്യഞ്ജനപാഠത്തിലെ ബഹുവചനരൂപത്തിനിടയിലും സന്ദർഭവും തുടർന്നുള്ള ഏകവചനക്രിയയും രെഹബെയാമെന്ന ഏകവചന കർത്താവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיַּקְהֵל
  choice: വിളിച്ചുകൂട്ടി
  rationale: קהל എന്ന ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘കൂട്ടിച്ചേർക്കുക/സഭചേർക്കുക’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל בֵּית יְהוּדָה
  choice: യെഹൂദാഗൃഹം മുഴുവനെയും
  rationale: പിന്നീടുള്ള ‘യിസ്രായേൽഗൃഹം’ എന്ന സമാന്തര രാഷ്ട്രീയ-സാമൂഹിക പ്രയോഗം നിലനിർത്താൻ ‘ഗൃഹം’ സംരക്ഷിച്ചു.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: ബെന്യാമീൻഗോത്രത്തെയും
  rationale: മൂലത്തിലെ שֵׁבֶט വ്യക്തമായി പരിഭാഷപ്പെടുത്തി ഗോത്രപരമായ വേർതിരിവ് നിലനിർത്തുന്നു.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: ഒരു ലക്ഷത്തി എൺപതിനായിരം
  rationale: 180,000 എന്ന സംഖ്യയുടെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട യോദ്ധാക്കൾ
  rationale: സൈനികസന്ദർഭത്തിൽ בָּחוּר എന്നത് വെറും യുവാക്കളെന്നതിലുപരി തിരഞ്ഞെടുത്തവരെ സൂചിപ്പിക്കുന്നു; עֹשֵׂה מִלְחָמָה എന്നത് യുദ്ധം ചെയ്യുന്നവരെന്ന അർഥത്തിൽ ‘യോദ്ധാക്കൾ’ എന്നു ചുരുക്കി സ്വാഭാവികമാക്കി.
- source_word: לְהִלָּחֵם עִם
  choice: യുദ്ധം ചെയ്ത്
  rationale: ശത്രുതാപരമായ ഏറ്റുമുട്ടലിനെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: בֵּית יִשְׂרָאֵל
  choice: യിസ്രായേൽഗൃഹം
  rationale: വിഭജിതരാജ്യത്തിന്റെ രാഷ്ട്രീയ-സാമൂഹിക കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന ‘ഗൃഹം’ എന്ന രൂപകം സംരക്ഷിച്ചു.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: രാജ്യം തിരികെനേടിക്കൊടുക്കാൻ
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘തിരികെ കൊണ്ടുവരുക/പുനഃസ്ഥാപിക്കുക’ എന്ന ആശയവും രെഹബെയാമിനുവേണ്ടിയുള്ള സൈനികലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: ശലോമോന്റെ മകനായ രെഹബെയാമിനു
  rationale: ലാമെദ് സൂചിപ്പിക്കുന്ന സ്വീകർത്താവിനെയോ ഗുണഭോക്താവിനെയോ ‘-നു’ വഴി വ്യക്തമാക്കി, വംശപരാമർശം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
theological_decisions:
- issue: מַמְלָכָה എന്ന രാഷ്ട്രീയപദത്തിന്റെ അർഥവ്യാപ്തി
  choice: രാജ്യം
  alternative: രാജാധികാരം
  rationale: സന്ദർഭം വിഭജനത്തിനുശേഷം രെഹബെയാമിന്റെ ഭരണപ്രദേശം/ഭരണം വീണ്ടെടുക്കുന്നതിനെക്കുറിച്ചാണ്. ‘രാജ്യം’ സ്വാഭാവികവും വിശാലവുമായ പദമാണ്; എന്നാൽ മൂലപദത്തിൽ രാജാധികാരത്തിന്റെ ഭാവവും ഉൾക്കൊള്ളാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി സ്വീകരിച്ചു. ‘യെഹൂദാഗൃഹം/യിസ്രായേൽഗൃഹം’ എന്നീ മൂലത്തിലെ സമാന്തര രാഷ്ട്രീയപ്രയോഗങ്ങൾ നിലനിർത്തി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളിൽ നൽകി. ഇംഗ്ലീഷ് consultation layer-ൽ നൽകിയ [a] അടിക്കുറിപ്പ് വാക്യത്തിലെ സ്ഥാനവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ആവർത്തിച്ചില്ല; ഹീബ്രു പാഠത്തിലെ പ്രസക്തമായ അർഥം മുഖ്യവാചകത്തിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
