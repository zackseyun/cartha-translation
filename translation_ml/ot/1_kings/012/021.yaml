  to: രെഹബെയാം യെരൂശലേമിൽ എത്തിയപ്പോൾ, യെഹൂദാഗൃഹം മുഴുവനെയും ബെന്യാമീൻ ഗോത്രത്തെയും—തിരഞ്ഞെടുക്കപ്പെട്ട യോദ്ധാക്കളായ ഒരു ലക്ഷത്തി എൺപതിനായിരം പേരെ—വിളിച്ചുകൂട്ടി. യിസ്രായേൽഗൃഹത്തിനെതിരെ യുദ്ധം ചെയ്യാനും രാജ്യം ശലോമോന്റെ മകനായ രെഹബെയാമിന് തിരികെ ഏൽപ്പിക്കാനുമായിരുന്നത് അത്.
