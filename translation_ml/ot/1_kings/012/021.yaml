  terminology: ‘യെഹൂദാഗൃഹം,’ ‘യിസ്രായേൽഗൃഹം,’ ‘തിരഞ്ഞെടുക്കപ്പെട്ട യോദ്ധാക്കൾ,’ ‘രാജ്യം’ എന്നിവ മൂലത്തിലെ രാഷ്ട്രീയ-സൈനിക പ്രയോഗങ്ങളും സമാന്തരതയും നന്നായി സംരക്ഷിക്കുന്നു. ‘തിരികെനേടിക്കൊടുക്കാൻ’ എന്നതിനു പകരം ‘തിരികെ ഏൽപ്പിക്കാനായി’ ഉപയോഗിക്കുന്നത് הָשִׁיב എന്ന ‘തിരികെ നൽകുക/പുനഃസ്ഥാപിക്കുക’ എന്ന ആശയവും ലാമെദിന്റെ സ്വീകർത്തൃസൂചനയും കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
