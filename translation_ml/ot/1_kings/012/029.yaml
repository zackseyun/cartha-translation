source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: ml
  text: അവൻ ഒന്നിനെ ബേഥേലിൽ[a] സ്ഥാപിച്ചു, മറ്റേതിനെ ദാനിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മുൻവാക്യത്തിൽ പറഞ്ഞ രണ്ടു കാളക്കുട്ടികളിൽ ഒന്ന് എന്നാണ് അർഥം. മറ്റൊരു വിധത്തിൽ: “അവൻ ഒരു കാളക്കുട്ടിയെ ബേഥേലിൽ സ്ഥാപിച്ചു, മറ്റേതിനെ ദാനിൽ വെച്ചു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: സ്ഥാപിച്ചു
  rationale: שׂים എന്ന ക്രിയയ്ക്ക് ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥമുണ്ട്. ആരാധനാവസ്തുക്കളെ സ്ഥലങ്ങളിൽ വെച്ചതിനെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: אֶת הָאֶחָד
  choice: ഒന്നിനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ രണ്ടു കാളക്കുട്ടികളിൽ ഒന്നിനെ സൂചിപ്പിക്കുന്ന വിതരണപ്രയോഗമാണിത്. മൂലപാഠത്തിലെ നാമലോപം നിലനിർത്താൻ ‘കാളക്കുട്ടി’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בְּבֵית אֵל
  choice: ബേഥേലിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗവും ബേഥേൽ എന്ന സ്ഥലനാമവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘ബേഥേലിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וְאֶת הָאֶחָד
  choice: മറ്റേതിനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ ഒന്നിനെ’ എന്നാണെങ്കിലും, രണ്ടാമത്തെ വസ്തുവിനെ വേർതിരിച്ചുകാട്ടുന്ന ജോടിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറ്റേതിനെ’ എന്നാണ്.
- source_word: נָתַן
  choice: സ്ഥാപിച്ചു
  rationale: נתן എന്ന ക്രിയയ്ക്ക് ഈ സ്ഥലസൂചക സന്ദർഭത്തിൽ ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്ന അർഥമാണ്. രണ്ട് ക്രിയകളുടെയും അർഥസാമീപ്യം മലയാളത്തിലെ ഏക സംയുക്തക്രിയയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: בְּדָן
  choice: ദാനിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗത്തോടുകൂടിയ ദാൻ എന്ന സ്ഥലനാമം മലയാളത്തിൽ ‘ദാനിൽ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘ഒന്ന്’, ‘മറ്റേത്’ എന്നിവയുടെ സൂചിതവസ്തു
  choice: മുൻവാക്യത്തിലെ രണ്ടു കാളക്കുട്ടികളെയാണ് ഇവ സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠം ഇവിടെ നാമം ആവർത്തിക്കാത്തതിനാൽ മുഖ്യപാഠത്തിലും അത് ചേർത്തിട്ടില്ല.
  alternative: അവൻ ഒരു കാളക്കുട്ടിയെ ബേഥേലിലും മറ്റേതിനെ ദാനിലും സ്ഥാപിച്ചു.
  rationale: സന്ദർഭത്തിൽ സൂചിതവസ്തു വ്യക്തമായിരിക്കുമ്പോഴും എബ്രായപാഠത്തിലെ നാമലോപം സംരക്ഷിക്കുന്നത് മൂലപാഠത്തോടുള്ള വിശ്വസ്തതയും അതിന്റെ സ്വാഭാവിക സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഒന്നിനെ… മറ്റേതിനെ…’ എന്ന ഘടന മൂലപാഠത്തിലെ ജോടിവിതരണവും നാമലോപവും നിലനിർത്തുന്നു; ആവർത്തിച്ച രണ്ടു എബ്രായക്രിയകളെ മലയാളത്തിൽ സ്വാഭാവികമായ ഒറ്റ സംയുക്തക്രിയയാക്കി.
