source:
  edition: WLC
  text: וַ/יִּוָּעַ֞ץ הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הַ/זְּקֵנִים֙ אֲשֶׁר הָי֣וּ עֹמְדִ֗ים אֶת פְּנֵי֙ שְׁלֹמֹ֣ה אָבִ֔י/ו בִּֽ/הְיֹת֥/וֹ חַ֖י לֵ/אמֹ֑ר אֵ֚יךְ אַתֶּ֣ם נֽוֹעָצִ֔ים לְ/הָשִׁ֥יב אֶת הָֽ/עָם הַ/זֶּ֖ה דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: ml
  text: 'അപ്പോൾ രെഹബെയാം രാജാവ്, തന്റെ പിതാവായ ശലോമോൻ ജീവിച്ചിരുന്ന കാലത്ത് അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ സേവിച്ചിരുന്ന[a] മൂപ്പന്മാരോട് ആലോചന ചോദിച്ചു: “ഈ ജനത്തോട് എന്തു മറുപടി പറയണമെന്നാണ് നിങ്ങൾ എനിക്ക് ഉപദേശം നൽകുന്നത്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: “ശലോമോന്റെ മുമ്പിൽ നിന്നിരുന്ന.” രാജസന്നിധിയിൽ നിൽക്കുക എന്ന പ്രയോഗം അവിടെ സേവിക്കുകയോ പരിചരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായ പദപ്രയോഗം പദശഃ: “ഈ ജനത്തിന് ഒരു വാക്ക് മടക്കിനൽകാൻ.” അതിന്റെ അർഥം അവർക്ക് ഒരു മറുപടി നൽകുക എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ആലോചന ചോദിച്ചു
  rationale: יעץ എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ മറ്റുള്ളവരിൽനിന്ന് ഉപദേശം തേടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ആലോചന ചോദിച്ചു’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: രെഹബെയാം രാജാവ്
  rationale: പേരിനു ശേഷം സ്ഥാനപ്പേര് ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിൽ ഇത് പ്രായം ചെന്ന പുരുഷന്മാരെ മാത്രമല്ല, പരിചയസമ്പന്നരായ മുതിർന്ന ഉപദേശകരെയും സൂചിപ്പിക്കുന്നു. ‘മൂപ്പന്മാർ’ ആ ഔദ്യോഗിക-സാമൂഹിക ഭാവം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: ശലോമോന്റെ സന്നിധിയിൽ സേവിച്ചിരുന്ന
  rationale: ‘മുഖത്തിനുമുമ്പിൽ നിന്നിരുന്നു’ എന്ന എബ്രായ പ്രയോഗം രാജസന്നിധിയിലെ പരിചരണമോ സേവനമോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മുഖ്യപാഠത്തിൽ അർഥം സ്വാഭാവികമായി നൽകിയിട്ട് പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: സർവനാമം രെഹബെയാമിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בִּהְיֹתוֹ חַי
  choice: ജീവിച്ചിരുന്ന കാലത്ത്
  rationale: ശലോമോന്റെ ജീവിതകാലത്താണ് ഈ മൂപ്പന്മാർ അദ്ദേഹത്തെ സേവിച്ചതെന്ന് കാലസംബന്ധമായി വ്യക്തമാക്കുന്നു.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: എന്തു ... എന്നാണ് നിങ്ങൾ എനിക്ക് ഉപദേശം നൽകുന്നത്
  rationale: ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം മറുപടിയുടെ രീതിയെക്കാൾ അതിന്റെ ഉള്ളടക്കത്തെക്കുറിച്ചുള്ള ഉപദേശം തേടുന്നതാണ്. ‘എനിക്ക്’ എന്ന കർമം സന്ദർഭത്തിൽ അന്തർലീനമായിരിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: മറുപടി പറയുക
  rationale: പദശഃ ‘ഒരു വാക്ക് മടക്കിനൽകുക’ എന്ന ഘടന ഇവിടെ മറുപടി നൽകുക എന്ന പ്രയോഗാർഥത്തിലാണ്. ‘മറുപടി പറയുക’ സ്വാഭാവിക മലയാളമാണ്; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: עם എന്ന ഏകവചന സമൂഹനാമവും അതോടൊപ്പമുള്ള സൂചകപദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
