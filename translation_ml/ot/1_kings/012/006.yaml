translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. രാജസദസ്സിന്റെ പശ്ചാത്തലം നിലനിർത്താൻ ‘മൂപ്പന്മാർ’, ‘സന്നിധി’ എന്നീ പദങ്ങൾ തെരഞ്ഞെടുത്തു; എന്നാൽ ദുഷ്കരമായ എബ്രായ പ്രയോഗങ്ങൾ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, അവയുടെ പദശഃ രൂപം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
