source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: ml
  text: ഇപ്പോൾ, എന്റെ അപ്പൻ നിങ്ങളുടെ നുകം ഭാരമുള്ളതാക്കി; എന്നാൽ ഞാൻ നിങ്ങളുടെ നുകം ഇനിയും ഭാരപ്പെടുത്തും. എന്റെ അപ്പൻ നിങ്ങളെ ചാട്ടവാറുകൾകൊണ്ട് ശിക്ഷിച്ചു; എന്നാൽ ഞാൻ നിങ്ങളെ തേളുകൾകൊണ്ട്[a] ശിക്ഷിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തേൾ-ചാട്ടവാറുകൾകൊണ്ട്’; അതായത്, കൂടുതൽ വേദനയുണ്ടാക്കാൻ രൂപകൽപ്പന ചെയ്ത ചാട്ടവാറുകളെയോ ചാട്ടവാറടികളെയോ സൂചിപ്പിക്കാം. ഹീബ്രു പാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘തേളുകൾകൊണ്ട്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: ഭാരമുള്ളതാക്കി
  rationale: הֶעְמִיס എന്ന ഹിഫീൽ രൂപം ഒരു ഭാരം ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നുകം’ എന്ന രൂപകത്തോടൊപ്പം ‘ഭാരമുള്ളതാക്കി’ എന്നത് മൂലചിത്രവും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: עֹל / עֻלְּכֶם
  choice: നുകം
  rationale: അടിച്ചമർത്തുന്ന ഭരണം അല്ലെങ്കിൽ നിർബന്ധിത അധ്വാനം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപകം നിലനിർത്താൻ ‘ഭാരം’ എന്ന പൊതുപദത്തിനു പകരം ‘നുകം’ ഉപയോഗിച്ചു; ആവർത്തനവും സംരക്ഷിച്ചു.
- source_word: כָּבֵד
  choice: ഭാരമുള്ള
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഭാരമുള്ള’ എന്നാണ്. ‘കഠിനമായ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് രൂപകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: אוֹסִיף עַל
  choice: ഇനിയും ഭാരപ്പെടുത്തും
  rationale: പ്രയോഗം നുകത്തിന്റെ ഭാരം വർധിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു. ‘നുകത്തോടു കൂട്ടിച്ചേർക്കും’ എന്ന അത്യന്തം അക്ഷരാർഥപരമായ രൂപം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, സന്ദർഭാർഥം നിലനിർത്തുന്ന സ്വാഭാവിക രൂപം തെരഞ്ഞെടുത്തു.
- source_word: יִסַּר / אֲיַסֵּר
  choice: ശിക്ഷിച്ചു / ശിക്ഷിക്കും
  rationale: יסר ശിക്ഷണം, ദണ്ഡനം, തിരുത്തൽ എന്നിവ സൂചിപ്പിക്കാം; ഇവിടെ ചാട്ടവാറുകളും ഭീഷണിയും ഉൾപ്പെട്ട രാഷ്ട്രീയസന്ദർഭമായതിനാൽ ‘ശിക്ഷിക്കുക’ സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമാണ്.
- source_word: בַּשּׁוֹטִים
  choice: ചാട്ടവാറുകൾകൊണ്ട്
  rationale: שׁוֹט എന്നത് ചാട്ടവാറിനെയോ പ്രഹരിക്കാനുള്ള വാറിനെയോ സൂചിപ്പിക്കുന്നു; ഈ തിരഞ്ഞെടുപ്പ് നേരിട്ടും ആധുനിക വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: בָּעַקְרַבִּים
  choice: തേളുകൾകൊണ്ട്
  rationale: ഹീബ്രു പദത്തിന്റെ അക്ഷരാർഥം ‘തേളുകൾ’ എന്നാണ്. പ്രത്യേകമായി വേദനിപ്പിക്കുന്ന ചാട്ടവാറുകളെ ഇത് സൂചിപ്പിച്ചേക്കാമെങ്കിലും, പ്രധാനപാഠത്തിൽ മൂലചിത്രം നിലനിർത്തി സാധ്യതയുള്ള ഉപകരണാർഥം അടിക്കുറിപ്പിൽ നൽകി.
