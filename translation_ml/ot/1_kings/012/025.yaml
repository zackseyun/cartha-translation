id: 1KI.12.25
reference: 1 Kings 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: ml
  text: പിന്നെ യൊരോബെയാം എഫ്രയീം മലനാട്ടിലെ ശെഖേം പണിത് അവിടെ താമസിച്ചു. അവിടെനിന്ന് പുറപ്പെട്ട് പെനൂവേൽ[a] പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിലും ബന്ധപ്പെട്ട മറ്റു വേദഭാഗങ്ങളിലും ഈ സ്ഥലനാമം “പെനിയേൽ” എന്നും എഴുതിയിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പണിയുക’ എന്നാണ്. നഗരത്തിന്റെ പശ്ചാത്തലത്തിൽ പുനർനിർമാണമോ കോട്ടകെട്ടി ബലപ്പെടുത്തലോ സൂചിപ്പിക്കാമെങ്കിലും, എബ്രായപാഠം വ്യക്തമാക്കാത്തത് വിവർത്തനത്തിൽ അധികമായി നിർണയിക്കാതിരിക്കാൻ ‘പണിതു’ എന്നു നൽകി.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: സ്ഥലനാമം ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּהַר אֶפְרַיִם
  choice: എഫ്രയീം മലനാട്ടിലെ
  rationale: הַר ഇവിടെ ഒറ്റ മലയെക്കാൾ വിശാലമായ മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കാം. അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘എഫ്രയീം മലനാട്’ എന്നു നൽകി.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: അവിടെ താമസിച്ചു
  rationale: ישב എന്നതിന് ഇവിടെ പാർക്കുക അഥവാ താമസിക്കുക എന്ന അർഥമാണ്. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ശെഖേം നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവിടെ’ എന്നു നൽകി.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: അവിടെനിന്ന് പുറപ്പെട്ടു
  rationale: יצא എന്ന ചലനക്രിയയുടെ ‘പുറപ്പെടുക/പുറത്തുപോകുക’ എന്ന ആശയം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശെഖേമിൽനിന്നുള്ള പുറപ്പാടാണ്.
- source_word: פְּנוּאֵל
  choice: പെനൂവേൽ
  rationale: ഇവിടത്തെ എബ്രായ വ്യഞ്ജന-സ്വരരൂപത്തെ പിന്തുടർന്നുള്ള സ്ഥലനാമലിപ്യന്തരണം. ബന്ധപ്പെട്ട വേദഭാഗങ്ങളിൽ കാണുന്ന ‘പെനിയേൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ തുടർച്ചയായ ക്രിയാക്രമം ‘പിന്നെ’ എന്നും വാക്യക്രമത്തിലൂടെയും വ്യക്തമാക്കി. ‘പുനർനിർമിച്ചു’ അല്ലെങ്കിൽ ‘കോട്ടകെട്ടി ബലപ്പെടുത്തി’ എന്നു വ്യാഖ്യാനിച്ച് മൂലപാഠത്തിന്റെ അർഥപരിധി ചുരുക്കിയിട്ടില്ല. അടിക്കുറിപ്പ് പ്രസക്തമായ ‘പെനൂവേൽ’ എന്ന പേരിനോടുതന്നെ ചേർത്തു.
