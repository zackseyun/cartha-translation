translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ദീർഘമായ ചോദ്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി തുടർച്ചയായ രണ്ടു ചോദ്യങ്ങളാക്കി; ആശയബന്ധവും പ്രസംഗക്രമവും നിലനിർത്തി. ഉദ്ധരണിക്കുള്ളിലെ ഏകവചന അഭിസംബോധനയും ‘നുകം’ എന്ന മൂലരൂപകവും സംരക്ഷിച്ചു.
