source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്താണ് ഉപദേശിക്കുന്നത്? ‘നിന്റെ അപ്പൻ ഞങ്ങളുടെമേൽ വെച്ച നുകം[b] ലഘൂകരിക്കണം’ എന്ന് എന്നോടു പറഞ്ഞ ഈ ജനത്തോടു നാം എന്തു മറുപടി[a] പറയണം?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു വാക്ക് മടക്കിനൽകുക”; ഇവിടെ അർഥം “മറുപടി പറയുക” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “നുകം” എന്നത് രാജാവ് ജനത്തിന്മേൽ ചുമത്തിയ കഠിനാധ്വാനത്തിന്റെയും മറ്റു ബാധ്യതകളുടെയും രൂപകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: നിങ്ങൾ എന്താണ് ഉപദേശിക്കുന്നത്?
  rationale: വർത്തമാനസന്ദർഭത്തിൽ ഉപദേശകരോടു നേരിട്ട് അഭിപ്രായം ചോദിക്കുന്ന പങ്കാളിത്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנָשִׁיב דָּבָר
  choice: നാം എന്തു മറുപടി പറയണം
  rationale: ‘ഒരു വാക്ക് മടക്കിക്കൊടുക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി ‘മറുപടി പറയുക’ എന്നു നൽകി; ഒന്നാംപുരുഷ ബഹുവചനം ‘നാം’ എന്നും സംരക്ഷിച്ചു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനം
  rationale: עָם എന്ന ഏകവചന സമൂഹനാമവും הַזֶּה എന്ന ചൂണ്ടുപദവും സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: എന്ന് എന്നോടു പറഞ്ഞ
  rationale: ജനത്തിന്റെ അഭ്യർഥനയെ ഉദ്ധരിച്ച് പരിചയപ്പെടുത്തുന്ന ബന്ധവാക്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָקֵל
  choice: ലഘൂകരിക്കണം
  rationale: ഭാരം കുറയ്ക്കണമെന്ന അഭ്യർഥനയുടെ അർഥം വ്യക്തമാക്കുകയും ‘നുകം’ എന്ന രൂപകവുമായി യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: מִן הָעֹל
  choice: നുകം
  rationale: രാജാവ് ചുമത്തിയ അധ്വാനത്തിന്റെയും ബാധ്യതകളുടെയും രൂപകമായ עֹל എന്ന മൂലചിത്രം ‘ഭാരം’ എന്നു പരത്താതെ സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: നിന്റെ അപ്പൻ ഞങ്ങളുടെമേൽ വെച്ച
  rationale: נתן על എന്നതിലെ ചുമത്തിവെക്കുന്ന ദൃശ്യരൂപവും അഭിസംബോധനയിലെ ഏകവചനമായ ‘നിന്റെ’ എന്നതും നിലനിർത്തുന്നു.
