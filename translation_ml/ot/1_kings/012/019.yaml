- from: അങ്ങനെ ഇസ്രായേൽ ദാവീദിന്റെ ഭവനത്തിനെതിരെ മത്സരിച്ചു; ഇന്നുവരെ ആ സ്ഥിതി തുടരുന്നു.[a]
  to: അങ്ങനെ ഇസ്രായേൽ ദാവീദിന്റെ ഭവനത്തിനെതിരെ ഇന്നുവരെ മത്സരിച്ചിരിക്കുന്നു.[a]
  rationale: The revision retains the political sense of the Hebrew verb and the dynastic metaphor ‘house of David,’ while rendering the Hebrew ‘to this day’ idiom through Malayalam ‘ഇന്നുവരെ’ without adding an explanatory second clause. The footnote preserves a more formally narrative-past alternative corresponding to the Hebrew wayyiqtol.
  reviewer_model: gpt-5.6-terra
