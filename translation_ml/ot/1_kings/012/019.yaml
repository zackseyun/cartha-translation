  yaml_path: translation/ot/1_kings/012/019.yaml
  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽ ദാവീദിന്റെ ഭവനത്തിനെതിരെ ഇന്നുവരെ മത്സരിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പദാനുപദമായി: “അങ്ങനെ ഇസ്രായേൽ ദാവീദിന്റെ ഭവനത്തിനെതിരെ ഇന്നുവരെ മത്സരിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: മത്സരിച്ചു; ... ആ സ്ഥിതി തുടരുന്നു
  rationale: രാഷ്ട്രീയസന്ദർഭത്തിൽ פשע പാപം ചെയ്യുക എന്ന പൊതുവായ അർഥത്തേക്കാൾ ഭരണകൂടത്തിനെതിരെ മത്സരിക്കുകയോ കലഹിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു ക്രിയ വിവരിക്കുന്ന ചരിത്രസംഭവവും ‘ഇന്നുവരെ’ എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്ന തുടർച്ചയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഹീബ്രുവിലെ വ്യക്തിനാമം നിലനിർത്തുന്നു; ഇവിടെ അത് ദാവീദിക രാജവംശത്തിൽനിന്നു വേർപെട്ട വടക്കൻ ഗോത്രസമൂഹത്തെ ഏകകമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּבֵית דָּוִד
  choice: ദാവീദിന്റെ ഭവനത്തിനെതിരെ
  rationale: פשע എന്ന ക്രിയയോടൊപ്പം בְ മത്സരം ആരെതിരെയാണെന്നു സൂചിപ്പിക്കുന്നു. ‘ഭവനം’ എന്നത് കുടുംബത്തെ മാത്രമല്ല, ദാവീദിക രാജവംശത്തെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ഇന്നുവരെ
  rationale: വിവരിച്ച സംഭവം മുതൽ ഗ്രന്ഥകാരന്റെ കാലംവരെ അവസ്ഥ തുടരുന്നു എന്നു സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദാവീദിന്റെ ഭവനം’ എന്ന ബൈബിൾപരമായ രാജവംശരൂപകം നിലനിർത്തി; പ്രധാനവാക്യത്തിൽ തുടർച്ചയുടെ അർഥം വ്യക്തമാക്കിയെങ്കിലും അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായ രൂപം നൽകി.
