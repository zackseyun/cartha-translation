- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനൊക്കെയും രാജാവാക്കി
  rationale: ഹിഫീൽ രൂപത്തിലെ ‘രാജാവാക്കുക’ എന്ന കാരണാർഥം നേരിട്ട് നൽകുന്നു; കിരീടധാരണം പോലുള്ള പറയാത്ത ചടങ്ങ് ചേർക്കുന്നില്ല.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: ആരും ദാവീദുഗൃഹത്തെ അനുഗമിച്ചില്ല
  rationale: ‘പിന്നാലെ ആയിരിക്കുക’ എന്ന ഹീബ്രായ പ്രയോഗം ഈ സന്ദർഭത്തിൽ രാഷ്ട്രീയ കൂറോ പക്ഷചേരലോ സൂചിപ്പിക്കുന്നു. ‘അനുഗമിച്ചു’ ആ രൂപകപ്രയോഗവും അർഥവും നിലനിർത്തുന്നു.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: യെഹൂദാഗോത്രം മാത്രമല്ലാതെ
  rationale: זוּלָתִי നൽകുന്ന ഒഴിവാക്കലും לְבַדּוֹ നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
