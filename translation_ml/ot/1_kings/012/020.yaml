base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: ml
  text: യൊരോബെയാം മടങ്ങിവന്നുവെന്ന് ഇസ്രായേൽ മുഴുവനും കേട്ടപ്പോൾ, അവർ ആളയച്ച് അവനെ സഭയിലേക്കു വിളിച്ചുവരുത്തി; മുഴുവൻ ഇസ്രായേലിനും രാജാവാക്കി. യെഹൂദാഗോത്രം മാത്രമൊഴികെ ആരും ദാവീദിന്റെ ഭവനത്തോടു കൂറുപുലർത്തിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യെഹൂദാഗോത്രം മാത്രമൊഴികെ ആരും ദാവീദിന്റെ ഭവനത്തോടൊപ്പം നിലകൊണ്ടില്ല.” ഹീബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ “ദാവീദിന്റെ ഭവനത്തിന്റെ പിന്നാലെ ആയിരുന്നു” എന്നാണ്; ഇവിടെ അത് രാഷ്ട്രീയ കൂറിനെയോ പക്ഷചേരലിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: കേട്ടപ്പോൾ
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ കാലസംബന്ധമായ മാറ്റം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന വാക്ക് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כָּל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: യൊരോബെയാം മടങ്ങിവന്നുവെന്ന്
  rationale: שׁוּב എന്ന ക്രിയയുടെ ‘മടങ്ങിവരുക’ എന്ന അർഥവും തുടർന്ന് നടന്ന കാര്യങ്ങൾക്ക് മുമ്പുള്ള സംഭവവും വ്യക്തമായി നൽകുന്നു.
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ אֹתוֹ אֶל־הָעֵדָה
  choice: അവർ ആളയച്ച് അവനെ സഭയിലേക്കു വിളിച്ചുവരുത്തി
  rationale: അയയ്ക്കുക, സഭയിലേക്കു വിളിക്കുക എന്നീ രണ്ട് പ്രവൃത്തികളും മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോഗത്തിൽ നിലനിർത്തുന്നു. ആരെയാണ് അയച്ചതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ദൂതന്മാർ’ എന്നു നിർണ്ണയിക്കുന്നില്ല.
- source_word: הָעֵדָה
  choice: സഭ
