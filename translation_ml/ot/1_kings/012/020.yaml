  alternative: ആരും ദാവീദുഗൃഹത്തോടൊപ്പം നിലനിന്നില്ല
  rationale: വാക്യം പ്രധാനമായും ചരിത്രപരവും രാഷ്ട്രീയവുമായ പക്ഷചേരലാണ് രേഖപ്പെടുത്തുന്നത്. ‘അനുഗമിച്ചു’ എന്നത് ഹീബ്രായ രൂപകപ്രയോഗം നിലനിർത്തുന്നു; ‘ഒപ്പം നിലനിന്നു’ എന്നത് അതിന്റെ സന്ദർഭാർഥമായ കൂറിനെ കൂടുതൽ തുറന്നുപറയുന്ന സാധുവായ മറ്റൊരു വായനയാണ്.
