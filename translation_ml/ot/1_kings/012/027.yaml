reference: 1 Kings 12:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: ml
  text: ഈ ജനം യെരൂശലേമിലെ യഹ്‌വേയുടെ ആലയത്തിൽ[b] യാഗങ്ങൾ അർപ്പിക്കാൻ കയറിപ്പോയാൽ[a], ഈ ജനത്തിന്റെ ഹൃദയം അവരുടെ അധിപനായ യെഹൂദാരാജാവായ രെഹബെയാമിന്റെ അടുക്കലേക്കു തിരിയും[c]; അവർ എന്നെ കൊല്ലുകയും യെഹൂദാരാജാവായ രെഹബെയാമിന്റെ അടുക്കലേക്കു മടങ്ങുകയും ചെയ്യും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ജനം ... കയറിപ്പോകുമ്പോൾ.” എബ്രായ സോപാധികപദത്തിന് ചില സന്ദർഭങ്ങളിൽ കാലസൂചനയും വരാം; ഇവിടെ യെരോബെയാം ഭയപ്പെട്ടിരുന്ന വ്യവസ്ഥയെന്ന നിലയിൽ “പോയാൽ” എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, “യഹ്‌വേയുടെ ഭവനത്തിൽ”; അതായത്, യെരൂശലേമിലെ ആലയം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “അവരുടെ യജമാനന്റെ” അല്ലെങ്കിൽ “അവരുടെ കർത്താവിന്റെ.” എബ്രായ പദം അധിപനെയോ യജമാനനെയോ സൂചിപ്പിക്കാം; പിന്നാലെ പറയുന്ന രെഹബെയാമിനെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: പോയാൽ
  rationale: യെരോബെയാമിന്റെ ഭയാശങ്കയ്ക്കു കാരണമായ വ്യവസ്ഥയെ മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കാലസൂചനയായ ‘പോകുമ്പോൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יַעֲלֶה
  choice: കയറിപ്പോയാൽ
  rationale: യെരൂശലേമിലേക്കുള്ള തീർത്ഥയാത്രയെ സൂചിപ്പിക്കുന്ന ‘മുകളിലേക്കു പോകുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭൂമിശാസ്ത്രപരവും ആരാധനാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: യാഗങ്ങൾ അർപ്പിക്കാൻ
  rationale: അക്ഷരാർഥമായ ‘യാഗങ്ങൾ ചെയ്യുക’ എന്നതിനേക്കാൾ സ്വാഭാവികമായ മലയാള ആരാധനാപ്രയോഗം; അർഥനഷ്ടമില്ല.
- source_word: בְּבֵית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയത്തിൽ
  rationale: ഇവിടെ ‘വീട്’ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു. ‘ആലയം’ സാധാരണ വായനക്കാർക്കു വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: ഈ ജനത്തിന്റെ ഹൃദയം ... തിരിയും
  rationale: ഹൃദയം തിരിയുക എന്ന സ്രോതസ്സിലെ രൂപകം നിലനിർത്തി, ഉള്ളിലെ ചായ്‌വും വിശ്വസ്തതയിലെ മാറ്റവും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: അവരുടെ യജമാനനായ
  rationale: പദത്തിന് ‘കർത്താവ്/യജമാനൻ’ എന്ന അർഥമുണ്ട്; പിന്നാലെയുള്ള രെഹബെയാം എന്ന സമാനാധികരണം ഏകവചന രാഷ്ട്രീയ അധികാരിയെ വ്യക്തമാക്കുന്നു.
- source_word: רְחַבְעָם מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവ് രെഹബെയാം
  rationale: രാജപദവിയും വ്യക്തിനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: וַהֲרָגֻנִי
  choice: അവർ എന്നെ കൊന്ന്
  rationale: הרג എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, വ്യക്തമായ ആധുനിക മലയാള പരിഭാഷ.
- source_word: וְשָׁבוּ
  choice: മടങ്ങിപ്പോകും
  rationale: അവസാനത്തെ ശാരീരികവും രാഷ്ട്രീയവുമായ മടങ്ങിപ്പോക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മുമ്പത്തെ ‘ഹൃദയം തിരിയും’ എന്ന ആവർത്തനബന്ധവും ആശയപരമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: സ്രോതസ്സിൽ വ്യക്തമായി വരുന്ന ഉടമ്പടിനാമത്തെ പദവിയാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: ‘ഹൃദയം തിരിയുക’ എന്നത് മതപരിവർത്തനമോ രാഷ്ട്രീയ വിശ്വസ്തതയോ
  choice: സ്രോതസ്സിലെ രൂപകം നിലനിർത്തി ‘ഹൃദയം ... തിരിയും’
  alternative: അവർ വീണ്ടും വിശ്വസ്തരാകും
  rationale: സന്ദർഭത്തിൽ രാഷ്ട്രീയ കൂറുമാറ്റമാണ് പ്രധാനമെങ്കിലും, ഉള്ളിലെ ചായ്‌വും ആരാധനബന്ധവും ഉൾപ്പെടാവുന്ന എബ്രായ പ്രയോഗത്തിന്റെ വിപുലത ചുരുക്കുന്നില്ല.
- issue: אֲדֹנֵיהֶם എന്ന അധികാരപദം
  choice: അവരുടെ യജമാനനായ
  alternative: അവരുടെ കർത്താവായ; അവരുടെ അധിപനായ
  rationale: രെഹബെയാമിനെ സൂചിപ്പിക്കുന്ന മാനുഷിക രാഷ്ട്രീയ അധികാരപദമാണെന്ന് വ്യക്തമാക്കുകയും ദൈവിക പദവിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘കയറിപ്പോകുക’, ‘ഹൃദയം തിരിയുക’ എന്നീ സ്രോതസ്സിനോടു ചേർന്ന പ്രയോഗങ്ങൾ സ്വാഭാവികത നഷ്ടപ്പെടാതെ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
