id: 1KI.12.10
reference: 1 Kings 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֣ר לָ/עָ֣ם הַ/זֶּ֡ה אֲשֶׁר֩ דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תְּדַבֵּ֣ר אֲלֵי/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: ml
  text: 'അവനോടൊപ്പം വളർന്ന യുവാക്കൾ അവനോടു പറഞ്ഞു: “നിന്നോടു, ‘നിന്റെ അപ്പൻ ഞങ്ങളുടെ നുകം ഭാരമുള്ളതാക്കി; നീയോ അതു ഞങ്ങൾക്കായി ലഘുവാക്കണം’ എന്നു പറഞ്ഞ ഈ ജനത്തോടു നീ ഇങ്ങനെ പറയണം: ‘എന്റെ ചെറുവിരൽ എന്റെ അപ്പന്റെ അരയെക്കാൾ തടിച്ചതാണ്.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: യുവാക്കൾ
  rationale: സന്ദർഭത്തിൽ രെഹബെയാമിനോടൊപ്പം വളർന്ന സമപ്രായക്കാരായ യുവ ഉപദേശകരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുട്ടികൾ’ എന്നത് മലയാളത്തിൽ തെറ്റായ പ്രായസൂചന നൽകാം.
- source_word: עֻלֵּנוּ
  choice: ഞങ്ങളുടെ നുകം
  rationale: ഭരണഭാരത്തിന്റെയും നിർബന്ധിത അധ്വാനത്തിന്റെയും രൂപകമായ ‘നുകം’ നിലനിർത്തുന്നു.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: അത് ഞങ്ങൾക്ക് ലഘുവാക്കിത്തരണമേ
  rationale: ഭാരം കുറയ്ക്കണമെന്ന അപേക്ഷ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നുകത്തിന്റെ രൂപകം മുൻവാക്യത്തിൽ നിലനിൽക്കുന്നു.
- source_word: קָטָנִּי
  choice: എന്റെ ചെറുവിരൽ
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘എന്റെ ചെറുതായത്’ എന്നാണ്; സന്ദർഭത്തിലും പരമ്പരാഗത ഗ്രഹണത്തിലും ചെറുവിരലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מָתְנֵי אָבִי
  choice: എന്റെ അപ്പന്റെ അരക്കെട്ട്
  rationale: מָתְנַיִם എന്ന ശരീരഭാഗത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു; യുവാക്കളുടെ അതിശയോക്തിപരമായ താരതമ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യുവാക്കളുടെ വാക്കിലെ അഹങ്കാരപരമായ അതിശയോക്തി
  choice: ‘എന്റെ ചെറുവിരൽ എന്റെ അപ്പന്റെ അരക്കെട്ടിനെക്കാൾ തടിച്ചതാണ്’ എന്ന് നേരിട്ട് നിലനിർത്തി
  alternative: അർഥം വിശദീകരിച്ച് ‘ഞാൻ എന്റെ അപ്പനെക്കാൾ ശക്തനാണ്’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠത്തിലെ ദൃശ്യരൂപവും രാഷ്ട്രീയ ഭീഷണിയിലേക്കുള്ള മുന്നൊരുക്കവും വ്യാഖ്യാനിച്ച് സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ രാജകീയ വിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി വ്യക്തമായി ക്രമപ്പെടുത്തി; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
