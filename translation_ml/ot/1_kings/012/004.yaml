source:
  edition: WLC
  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/אַתָּ֡ה עַתָּ֣ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: ml
  text: “നിന്റെ പിതാവ് ഞങ്ങളുടെ നുകം കഠിനമാക്കി.[a] അതുകൊണ്ട് ഇപ്പോൾ നിന്റെ പിതാവിന്റെ കഠിനമായ സേവനം[b] ലഘൂകരിക്കുകയും അദ്ദേഹം ഞങ്ങളുടെമേൽ ചുമത്തിയ ഭാരമേറിയ നുകം ലഘൂകരിക്കുകയും ചെയ്യണമേ; അപ്പോൾ ഞങ്ങൾ നിന്നെ സേവിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളുടെ നുകം ഭാരമുള്ളതാക്കി.” അടിച്ചേൽപ്പിച്ച ബാധ്യതകളെ ചിത്രീകരിക്കാൻ എബ്രായത്തിൽ ‘നുകം’ എന്ന രൂപകം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “കഠിനമായ സേവനം” എന്നത് “കഠിനവേല” എന്നോ “ദുഷ്കരമായ സേവനം” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: ഞങ്ങളുടെ നുകം കഠിനമാക്കി
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ കാരണാർഥം നിലനിർത്തുന്നു. ‘നുകം’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുകയും קָשָׁה എന്നതിന്റെ ‘കഠിനമാക്കുക’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: עֻלֵּנוּ
  choice: ഞങ്ങളുടെ നുകം
  rationale: അടിച്ചേൽപ്പിച്ച സേവനം, നികുതി, ബാധ്യതകൾ എന്നിവയെ സൂചിപ്പിക്കുന്ന നുകത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; ‘ഭാരം’ എന്നു മാത്രം വിവർത്തനം ചെയ്ത് രൂപകം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: עַתָּה הָקֵל
  choice: അതുകൊണ്ട് ഇപ്പോൾ ... ലഘൂകരിച്ചുതരുക
  rationale: ആവശ്യപ്പെടുന്ന ആജ്ഞാഭാവവും മുൻപരാതിയിൽനിന്നുള്ള ആശയബന്ധവും വ്യക്തമാക്കുന്നു. ‘ലഘൂകരിക്കുക’ എന്നത് പിന്നാലെയുള്ള ‘ഭാരമുള്ള’ എന്ന പദത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: നിന്റെ അപ്പൻ ... ചുമത്തിയ കഠിനമായ സേവനം
  rationale: עֲבֹדָה എന്നത് ഇവിടെ ഭരണാധികാരിക്കുള്ള കഠിന സേവനബാധ്യതകളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘ചുമത്തിയ’ എന്ന് പിന്നാലെയുള്ള אֲשֶׁר נָתַן עָלֵינוּ എന്ന ഘടകത്തിൽനിന്ന് യോജിച്ചവിധം ചേർത്തിരിക്കുന്നു.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: ഭാരമുള്ള നുകം
  rationale: כבד എന്നതിന്റെ നേരിട്ടുള്ള ഭാരാർഥവും നുകത്തിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: ഞങ്ങളുടെമേൽ ചുമത്തിയ
  rationale: נתן על എന്ന പ്രയോഗത്തിന്റെ ‘മേൽ വെക്കുക/അടിച്ചേൽപ്പിക്കുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കഠിന സേവനത്തിനും ഭാരമുള്ള നുകത്തിനും ഒരുപോലെ ബാധകമാകുന്ന വിധത്തിൽ വാക്യം ക്രമപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: וְנַעַבְדֶךָּ
  choice: എന്നാൽ ഞങ്ങൾ നിന്നെ സേവിക്കാം
  rationale: അഭ്യർഥന അംഗീകരിക്കപ്പെട്ടാൽ ഉണ്ടാകുന്ന ഫലം അഥവാ വാഗ്ദാനം പ്രകടമാക്കുന്നു. ‘സേവിക്കാം’ ഇവിടെ സന്നദ്ധതയോടുകൂടിയ പ്രതിജ്ഞയുടെ ഭാവം നൽകുന്നു.
- source_word: אָבִיךָ
  choice: നിന്റെ അപ്പൻ
  rationale: രഹബെയാമിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന വ്യക്തമായി നിലനിർത്തുന്നു. ആധുനിക സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അപ്പൻ’ തിരഞ്ഞെടുത്തു.
