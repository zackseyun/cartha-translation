translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ രാജസദസ്സിലെ അഭ്യർഥനയ്ക്ക് ചേരുന്ന മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നുകം’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തിയപ്പോൾ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എബ്രായത്തിലെ കഠിനം/ഭാരം/ലഘൂകരിക്കുക എന്ന ആശയവൈരുധ്യവും സേവിക്കുമെന്ന നിബന്ധനാപരമായ വാഗ്ദാനവും സംരക്ഷിച്ചു.
