  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑ם כִּ֥י שְׁכֶ֛ם בָּ֥א כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: ml
  text: രെഹബെയാം ശെഖേമിലേക്കു പോയി; അവനെ രാജാവാക്കാൻ ഇസ്രായേൽ മുഴുവനും ശെഖേമിൽ വന്നിരുന്നതുകൊണ്ടാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: വാവു-തുടർച്ചയോടുകൂടിയ ക്രിയയെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ലളിത ഭൂതകാലമായി നൽകി.
- source_word: שְׁכֶם
  choice: ശെഖേം
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: כִּי
  choice: കാരണം
  rationale: രണ്ടാം വാക്യഭാഗം രെഹബെയാം ശെഖേമിലേക്കു പോയതിന്റെ കാരണം വ്യക്തമാക്കുന്നതിനാൽ കാരണാർഥം നിലനിർത്തി.
- source_word: כָל יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ജനമെല്ലാം
  rationale: ഇവിടെ രാജ്യത്തിലെ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരപ്രയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: അവനെ രാജാവാക്കാൻ
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരകാർഥം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ കാരണബന്ധവും രാജാവാക്കുക എന്ന കാരകാർഥവും വ്യക്തമായി സംരക്ഷിച്ചു.
