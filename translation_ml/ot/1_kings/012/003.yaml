id: 1KI.12.3
reference: 1 Kings 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: ml
  text: 'അങ്ങനെ അവർ ആളയച്ച് അവനെ വിളിപ്പിച്ചു[a]. യൊരോബെയാമും ഇസ്രായേലിന്റെ മുഴുവൻ ജനസഭയും[b] വന്ന് രെഹബെയാമിനോട് സംസാരിച്ചു. അവർ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ വരാൻ ആളയച്ചു.’ എബ്രായപ്രയോഗം യൊരോബെയാമിനെ വിളിച്ചുവരുത്തിയെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ജനസഭ’ എന്നതിന് ‘ജനസമൂഹം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ പൊതുരാഷ്ട്രീയമായി ഒത്തുചേർന്ന ഇസ്രായേൽജനത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: അവർ ആളയച്ച്
  rationale: שׁלח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ഒരാളെ വരുത്താൻ ആളയയ്ക്കുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: അവനെ വിളിപ്പിച്ചു
  rationale: קרא + ל ഇവിടെ യൊരോബെയാമിനെ വരാൻ വിളിച്ചുവരുത്തുക എന്ന അർഥത്തിലാണ്. ‘വിളിപ്പിച്ചു’ എന്നത് ആ സന്ദർഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיָּבֹאוּ
  choice: വന്ന്
  rationale: בוא എന്ന സാധാരണ ക്രിയയുടെ ‘വരുക’ എന്ന അർഥവും എബ്രായ വാക്യത്തിലെ സംഭവക്രമവും നിലനിർത്തുന്നു.
- source_word: יָרָבְעָם
  choice: യൊരോബെയാം
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְכָל קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുഴുവൻ ജനസഭയും
  rationale: קהל കൂടിവന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ പൊതുരാഷ്ട്രീയമായി ഒത്തുചേർന്ന ഇസ്രായേൽജനത്തെ വ്യക്തമാക്കാൻ ‘ജനസഭ’ യോജിക്കുന്നു; כָל എന്നതിനെ ‘മുഴുവൻ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: രെഹബെയാമിനോട് സംസാരിച്ചു
  rationale: דבר אל എന്ന പ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും തുടർന്നുവരുന്ന ഉദ്ധരണിക്കുള്ള ആഖ്യാനപരമായ അവതരണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: 'അവർ പറഞ്ഞു:'
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ജനസഭ’ എന്ന പദം സഭാപരമായ പ്രത്യേക അർഥം ചുമത്താതെ ഈ സന്ദർഭത്തിലെ പൊതുരാഷ്ട്രീയ കൂടിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ ‘സംസാരിച്ചു—പറഞ്ഞു’ എന്ന ഘടന രണ്ട് മലയാളവാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കിയെങ്കിലും ഉദ്ധരണിയിലേക്കുള്ള ആഖ്യാനക്രമം നിലനിർത്തി.
