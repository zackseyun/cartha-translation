id: 1KI.12.7
reference: 1 Kings 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “ഇന്ന് അങ്ങ് ഈ ജനത്തിന്റെ സേവകനായി അവരെ സേവിക്കുകയും അവർക്കു മറുപടി നൽകുകയും അവരോടു നല്ല വാക്കുകൾ[a] പറയുകയും ചെയ്താൽ, അവർ എല്ലാക്കാലവും അങ്ങയുടെ സേവകരായിരിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദയയുള്ള വാക്കുകൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവർ അങ്ങയെ എപ്പോഴും സേവിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: ദാസൻ
  rationale: രാജാവ് ജനത്തോടു സ്വീകരിക്കേണ്ട സേവനമനോഭാവമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘ദാസൻ’ എന്നത് עבד എന്ന ധാതുവിൽനിന്നുള്ള തുടർന്നുള്ള ക്രിയയുമായുള്ള പദബന്ധവും രാഷ്ട്രീയ രൂപകവും നിലനിർത്തുന്നു.
- source_word: וַעֲבַדְתָּם
  choice: അവരെ സേവിക്കുകയും
  rationale: ‘ദാസനായി’ എന്ന നാമരൂപവുമായുള്ള എബ്രായ പദബന്ധം കാത്തുസൂക്ഷിക്കുകയും ഇവിടെ ഉദ്ദേശിക്കുന്ന ജനസേവനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וַעֲנִיתָם
  choice: അവർക്കു മറുപടി നൽകുകയും
  rationale: ജനത്തിന്റെ അപേക്ഷയ്ക്കു മറുപടി നൽകുക എന്നതാണ് സന്ദർഭത്തിലെ അർഥം; ‘പീഡിപ്പിക്കുക’ എന്ന ענהയുടെ മറ്റൊരു അർഥം ഇവിടെ പ്രസക്തമല്ല.
- source_word: דְּבָרִים טוֹבִים
  choice: നല്ല വാക്കുകൾ
  rationale: എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നതോടൊപ്പം ആധുനിക മലയാളത്തിലും വ്യക്തമാണ്. സന്ദർഭത്തിൽ ‘ദയയുള്ള വാക്കുകൾ’ എന്നും അർഥമാകാം.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: അവർ അങ്ങയുടെ ദാസന്മാരായിരിക്കും
  rationale: രാജാവ് ഇപ്പോൾ ജനത്തെ സേവിച്ചാൽ അവർ പിന്നീട് അവന്റെ ദാസന്മാരായിരിക്കും എന്ന പരസ്പരവിരുദ്ധമായ രാഷ്ട്രീയ ആശയം നാമരൂപം നിലനിർത്തി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל הַיָּמִים
  choice: എല്ലാക്കാലവും
  rationale: ‘എല്ലാ ദിവസങ്ങളും’ എന്ന എബ്രായ കാലപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; സ്ഥിരമായ ഭാവിസേവനമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: אִם הַיּוֹם
  choice: ഇന്ന് … ചെയ്താൽ
  rationale: ഇപ്പോഴത്തെ പ്രതിസന്ധിയിൽ ഉടൻ എടുക്കേണ്ട തീരുമാനത്തിനുള്ള എബ്രായ കാലഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: നൽകിയിരിക്കുന്ന എബ്രായ പാഠത്തിലെ ഏകവചന ക്രിയയും ഏകവചന സർവനാമവും നേരിട്ട് പിന്തുടരുന്നു; לֵאמֹר മലയാളത്തിലെ ഉദ്ധരണി ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: രാജത്വത്തെ സേവനമായി അവതരിപ്പിക്കുന്ന രാഷ്ട്രീയ രൂപകം
  choice: ‘ദാസൻ/സേവിക്കുക/ദാസന്മാർ’ എന്ന പരസ്പരബന്ധമുള്ള ഭാഷ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ജനങ്ങൾക്കുവേണ്ടി പ്രവർത്തിക്കുക’, ‘പ്രജകളായിരിക്കുക’ തുടങ്ങിയ മൃദുവാക്കിയ രാഷ്ട്രീയ പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: വാക്യം രെഹബെയാമിന് നൽകുന്ന പ്രായോഗിക രാഷ്ട്രീയ ഉപദേശമാണ്. പിൽക്കാല ദൈവശാസ്ത്ര ആശയങ്ങൾ ചേർക്കാതെയും മൂലപാഠത്തിലെ വിരോധാഭാസവും പരസ്പരതയും നഷ്ടപ്പെടുത്താതെയും സേവനഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. എബ്രായത്തിലെ സേവനപദങ്ങളുടെ ആവർത്തനവും പരസ്പരതയും വ്യക്തമായി നിലനിർത്തി; ഉദ്ധരണിയിലെ നീണ്ട വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാക്കാൻ ഏകോപിത ക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചു.
