source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: ml
  text: യൊരോബെയാം എട്ടാം മാസം[a], ആ മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം, യെഹൂദയിലെ ഉത്സവംപോലെ ഒരു ഉത്സവം നടത്തി; അവൻ യാഗപീഠത്തിലേക്കു കയറി.[b] താൻ ഉണ്ടാക്കിയ കാളക്കുട്ടികൾക്കു യാഗം അർപ്പിച്ചുകൊണ്ട് അവൻ ബേഥേലിൽ അതുപോലെ ചെയ്തു; താൻ ഉണ്ടാക്കിയ ഉന്നതസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ അവൻ ബേഥേലിൽ നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യെഹൂദയിലെ ഈ ഉത്സവം കൂടാരപ്പെരുന്നാളായിരിക്കാം. അത് ഏഴാം മാസത്തിന്റെ പതിനഞ്ചാം ദിവസമായിരുന്നു; യൊരോബെയാം തന്റെ മത്സരോത്സവം ഒരു മാസം കഴിഞ്ഞാണ് നിശ്ചയിച്ചത്.
    reason: cross_reference
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “യാഗപീഠത്തിന്മേൽ കയറി.” സന്ദർഭത്തിൽ, ആരാധനാകർമം നിർവഹിക്കാൻ യാഗപീഠത്തെ സമീപിച്ച് കയറുന്നതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: ഒരു ഉത്സവം നടത്തി
  rationale: עשה + חג എന്ന പ്രയോഗം ഉത്സവം നടത്തുക/ആചരിക്കുക എന്ന അർഥത്തിലാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: എട്ടാം മാസം
  rationale: കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ തീയതി-പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: യെഹൂദയിൽ ആചരിച്ചിരുന്ന ഉത്സവംപോലെ
  rationale: താരതമ്യം വ്യക്തമായി സൂക്ഷിക്കുന്നു; ഉത്സവത്തിന്റെ പേര് മൂലപാഠം പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിലേക്കു കയറി
  rationale: ആരാധനാകർമത്തിനായി യാഗപീഠത്തെ സമീപിച്ച് കയറുന്ന ആശയം നൽകുന്നു; യാഗപീഠത്തിന്റെ മുകളിലേക്കു കയറി എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: ബേഥേലിലും അവൻ അങ്ങനെ ചെയ്തു
  rationale: മുൻപ്രവൃത്തിയോടുള്ള പൊരുത്തം וכן വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം ഉപയോഗിക്കുന്നു.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: കാളക്കുട്ടികൾക്കു യാഗം അർപ്പിച്ചുകൊണ്ട്
  rationale: യാഗം കാളക്കുട്ടികളെ ലക്ഷ്യമാക്കിയതാണെന്ന ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: הָעֲגָלִים
  choice: കാളക്കുട്ടികൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; വിഗ്രഹങ്ങൾ എന്ന വ്യാഖ്യാനപദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְהֶעֱמִיד
  choice: നിയമിച്ചു
  rationale: ആരാധനാസേവനത്തിലെ ഔദ്യോഗിക സ്ഥാനപ്പെടുത്തൽ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: പൂജാഗിരികളുടെ പുരോഹിതന്മാർ
  rationale: במות എന്നത് പ്രാദേശിക ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു; 'പൂജാഗിരികൾ' മലയാള ബൈബിൾ ഭാഷയിൽ സംക്ഷിപ്തവും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: אֲשֶׁר עָשָׂה
  choice: താൻ ഉണ്ടാക്കിയ
  rationale: കാളക്കുട്ടികളെയും പൂജാഗിരികളെയും യൊരോബെയാമിന്റെ സ്വന്തം നിർമ്മാണം/സ്ഥാപനം എന്ന നിലയിൽ ബന്ധിപ്പിക്കുന്ന ആവർത്തനം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെഹൂദയിലെ ഉത്സവത്തിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ 'യെഹൂദയിൽ ആചരിച്ചിരുന്ന ഉത്സവം' എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: കൂടാരപ്പെരുന്നാൾ എന്നു വ്യക്തമായി പേരിടുക.
  rationale: ഏഴാം മാസത്തിന്റെ പതിനഞ്ചാം ദിവസത്തെ കൂടാരപ്പെരുന്നാളിലേക്കുള്ള സൂചന ശക്തമാണെങ്കിലും ഈ വാക്യം അതിന്റെ പേര് പറയുന്നില്ല; സാധ്യത അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- issue: യൊരോബെയാമിന്റെ ആരാധനാക്രമത്തെക്കുറിച്ചുള്ള വിലയിരുത്തൽ
  choice: പ്രവൃത്തികളെ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: കാളക്കുട്ടികളെ 'വിഗ്രഹങ്ങൾ' എന്നും പുരോഹിതന്മാരെ 'അനധികൃതർ' എന്നും മുഖ്യപാഠത്തിൽ വിശേഷിപ്പിക്കുക.
  rationale: വിശാലമായ ആഖ്യാനം ഈ ആരാധനയെ കുറ്റപ്പെടുത്തുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ നാമങ്ങൾക്ക് അധിക വിലയിരുത്തൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ വിവരണരീതി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുസൃതമായി നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ ആവർത്തനവും ആരാധനാസംബന്ധമായ ഉദ്ദേശ്യപൂർണമായ അസ്പഷ്ടതയും സാധ്യമായത്ര സംരക്ഷിച്ചു.
