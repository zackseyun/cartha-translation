  to: യൊരോബെയാം എട്ടാം മാസം[a], ആ മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം, യെഹൂദയിലെ ഉത്സവംപോലെ ഒരു ഉത്സവം നടത്തി; അവൻ യാഗപീഠത്തിലേക്കു കയറി.[b] താൻ ഉണ്ടാക്കിയ കാളക്കുട്ടികൾക്കു യാഗം അർപ്പിച്ചുകൊണ്ട് അവൻ ബേഥേലിൽ അതുപോലെ ചെയ്തു; താൻ ഉണ്ടാക്കിയ ഉന്നതസ്ഥലങ്ങളിലെ പുരോഹിതന്മാരെ അവൻ ബേഥേലിൽ നിയമിച്ചു.
