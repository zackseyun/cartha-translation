reference: 1 Kings 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: ml
  text: അവൻ ഉന്നതസ്ഥലങ്ങളിലെ ആരാധനാലയങ്ങൾ[a] പണിതു; ജനസമൂഹത്തിലെ വിവിധ വിഭാഗങ്ങളിൽനിന്ന് ലേവിയുടെ പുത്രന്മാരിൽപ്പെട്ടവരല്ലാത്തവരെ[b] പുരോഹിതന്മാരായി നിയമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥത്തിൽ, ‘ഉന്നതസ്ഥലങ്ങളുടെ ഒരു ഭവനം’; ഉന്നതസ്ഥലങ്ങളുമായി ബന്ധപ്പെട്ട ആരാധനാലയങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലേവ്യരല്ലാത്തവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: പണിതു / നിയമിച്ചു
  rationale: עשה എന്ന പൊതുവായ ക്രിയയ്ക്ക് സന്ദർഭാനുസൃതമായി ആദ്യവാക്യത്തിൽ നിർമാണവും രണ്ടാമത്തേതിൽ പുരോഹിതസ്ഥാനത്തേക്കുള്ള നിയമനവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בֵּית בָּמוֹת
  choice: പൂജാഗിരികളിലെ ആരാധനാലയങ്ങൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘പൂജാഗിരികളുടെ ഭവനം’ എന്ന പ്രയോഗം, പൂജാഗിരികളുമായി ബന്ധപ്പെട്ട ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഏകവചനമായ בֵּית-നോടൊപ്പം ബഹുവചനമായ בָּמוֹת ഉള്ള അസാധാരണ ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആരാധനാസന്ദർഭത്തിലെ כהנים എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: מִקְצוֹת הָעָם
  choice: ജനത്തിന്റെ വിവിധ ഭാഗങ്ങളിൽനിന്ന്
  rationale: קצות എന്നതിന്റെ ‘അറ്റങ്ങൾ/പരിധികൾ’ എന്ന ദൃശ്യഭാവം പൂർണമായി മായ്ക്കാതെ, ജനസമൂഹത്തിന്റെ വിവിധ ഭാഗങ്ങളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന സന്ദർഭാർഥം നൽകുന്നു. ‘എല്ലാ ജനങ്ങളിൽനിന്നും’ എന്നതിനെക്കാൾ ഹീബ്രു രൂപത്തോട് അടുത്തതാണ്.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരിൽപ്പെട്ടവരല്ലാത്തവരെ
  rationale: അവർ ലേവിയുടെ വംശത്തിൽപ്പെട്ടവരല്ലെന്ന കുടുംബ-ഗോത്രപരമായ ഭാഷ നിലനിർത്തുന്നു; ‘ലേവ്യരല്ലാത്തവർ’ എന്ന ചുരുക്കരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യൊരോബെയാം സ്ഥാപിച്ച ആരാധനാകേന്ദ്രങ്ങളുടെ വിവർത്തനം
  choice: പൂജാഗിരികളിലെ ആരാധനാലയങ്ങൾ
  alternative: പൂജാഗിരികളുടെ ഭവനം / പൂജാഗിരികളിലെ ക്ഷേത്രങ്ങൾ
  rationale: അനധികൃതതയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാക്യത്തിൽ കൂട്ടിച്ചേർക്കാതെ, സ്ഥലങ്ങളുടെ ആരാധനാപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു. ‘ക്ഷേത്രങ്ങൾ’ പ്രത്യേക മതസാംസ്കാരിക ധ്വനി സൃഷ്ടിക്കാവുന്നതിനാൽ ‘ആരാധനാലയങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- issue: പുരോഹിതന്മാരുടെ ലേവ്യരല്ലാത്ത നില
  choice: ലേവിയുടെ പുത്രന്മാരിൽപ്പെട്ടവരല്ലാത്തവർ
  alternative: ലേവ്യരല്ലാത്തവർ
  rationale: മൂലപാഠത്തിലെ വംശപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; അതിൽക്കവിഞ്ഞുള്ള ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മുഖ്യവാക്യത്തിലെ പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും, പുരോഹിതന്മാർ ലേവിയുടെ വംശത്തിൽപ്പെട്ടവരല്ലെന്ന ബന്ധം അസന്ദിഗ്ധമായി നിലനിർത്തി.
