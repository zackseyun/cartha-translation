  text: וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אָבִ/י֙ הִכְבִּ֣יד אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: ml
  text: 'അവൻ യുവാക്കളുടെ ഉപദേശപ്രകാരം അവരോടു പറഞ്ഞു: “എന്റെ പിതാവ് നിങ്ങളുടെ നുകം ഭാരമുള്ളതാക്കി; ഞാൻ നിങ്ങളുടെ നുകത്തിന്മേൽ ഇനിയും ഭാരം കൂട്ടും. എന്റെ പിതാവ് നിങ്ങളെ ചാട്ടവാറുകൾകൊണ്ട് ശിക്ഷിച്ചു; എന്നാൽ ഞാൻ നിങ്ങളെ തേളുകൾകൊണ്ട്[a] ശിക്ഷിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തേൾച്ചാട്ടവാറുകൾകൊണ്ട്”; അതായത്, മൂർച്ചയുള്ള മുനകളോ കൊളുത്തുകളോ ഘടിപ്പിച്ച ചാട്ടവാറുകൾ. എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “തേളുകൾകൊണ്ട്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അവരോടു പറഞ്ഞു
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക/പറയുക’ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘മറുപടി പറഞ്ഞു’ എന്നു വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: യുവാക്കളുടെ ഉപദേശപ്രകാരം
  rationale: עֵצָה എന്നതിന്റെ ‘ഉപദേശം’ എന്ന അർഥവും כ എന്ന ഉപസർഗത്തിന്റെ ‘പ്രകാരം’ എന്ന ബന്ധവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ הַיְלָדִים കുട്ടികളല്ല, മൂപ്പന്മാരോട് വിപരീതമായി നിൽക്കുന്ന യുവ ഉപദേശകരാണ്.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: നിങ്ങളുടെ നുകം ഭാരമുള്ളതാക്കി
  rationale: ‘നുകം’ എന്ന മൂർത്തമായ രൂപകവും כבד എന്ന ക്രിയയിലെ ഭാരമാക്കുക എന്ന ആശയവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: നിങ്ങളുടെ നുകത്തിന്മേൽ ഇനിയും ഭാരം കൂട്ടും
  rationale: יסף על എന്ന ‘കൂട്ടുക’ എന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; എന്താണ് കൂട്ടുന്നതെന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കാൻ ‘ഭാരം’ ചേർക്കുന്നു.
- source_word: יִסַּר / אֲיַסֵּר
  choice: ശിക്ഷിച്ചു / ശിക്ഷിക്കും
  rationale: ഇവിടെ രാജകീയ ബലപ്രയോഗവും ചാട്ടവാറുകൊണ്ടുള്ള ദണ്ഡനവും ഉദ്ദേശിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ശിക്ഷിക്കുക’ യോജിക്കുന്നു; തിരുത്തൽപരമായ ശാസനയുടെ സാധ്യത പൂർണമായി നിഷേധിക്കുന്നില്ല.
- source_word: בַּשּׁוֹטִים
  choice: ചാട്ടവാറുകൾകൊണ്ട്
  rationale: שׁוֹט എന്ന ചമ്മട്ടി/ചാട്ടവാർ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בָּעַקְרַבִּים
  choice: തേളുകൾകൊണ്ട്
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘തേളുകൾ’ എന്ന പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, മുള്ളുകളോ കൊളുത്തുകളോ ഘടിപ്പിച്ച ചാട്ടവാറുകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
theological_decisions:
- issue: ‘തേളുകൾ’ എന്ന ശിക്ഷാചിത്രത്തിന്റെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ അക്ഷരാർഥമായ ‘തേളുകൾ’ നിലനിർത്തുക
  alternative: ‘തേൾച്ചാട്ടവാറുകൾ’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: עַקְרַבִּים എന്ന എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘തേളുകൾ’ എന്നാണ്. ഇത് മുള്ളുകളോ കൊളുത്തുകളോ ഉള്ള ചാട്ടവാറുകളെ സൂചിപ്പിക്കാം; എന്നാൽ ആ സാധ്യത മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നതാണ് മൂലപാഠത്തോടു കൂടുതൽ സുതാര്യമായ സമീപനം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നുകം’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിച്ചിരിക്കുന്നു; അപരിചിതമാകാവുന്ന ‘തേളുകൾ’ എന്ന പ്രയോഗത്തിന് നിർബന്ധമായ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
