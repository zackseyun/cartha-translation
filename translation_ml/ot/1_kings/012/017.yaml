source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: ml
  text: എന്നാൽ, യെഹൂദായിലെ നഗരങ്ങളിൽ താമസിച്ചിരുന്ന ഇസ്രായേല്യരുടെമേൽ രെഹബെയാം രാജാവായി ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: എന്നാൽ … ഇസ്രായേല്യർ
  rationale: וּ മുൻസന്ദർഭത്തിലെ വടക്കൻ ഗോത്രങ്ങളുടെ കലാപത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ദേശീയസമൂഹത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത് ‘ഇസ്രായേല്യർ’ ആണ്.
- source_word: הַ/יֹּשְׁבִים
  choice: പാർത്തിരുന്ന
  rationale: ישב എന്നതിന്റെ കർത്തൃവാചക പങ്കാളിത്തരൂപം ഇവിടെ തുടർന്നുള്ള വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘പാർത്തിരുന്ന’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: യെഹൂദാനഗരങ്ങളിൽ
  rationale: യെഹൂദാ പ്രദേശത്തിലെ നഗരങ്ങൾ എന്ന സ്ഥാനസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַ/יִּמְלֹךְ
  choice: രാജാവായി വാണു
  rationale: מלך ഇവിടെ രാജത്വം പ്രയോഗിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘വാണു’ മാത്രം ആധുനിക വായനയിൽ അസ്പഷ്ടമാകാവുന്നതിനാൽ ‘രാജാവായി വാണു’ എന്ന് വ്യക്തമാക്കി.
- source_word: עֲלֵי/הֶם
  choice: അവരുടെമേൽ
  rationale: ഭരണബന്ധം സൂചിപ്പിക്കുന്ന עַל-ന്റെ അർഥവും ബഹുവചന സർവനാമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: רְחַבְעָם
  choice: രെഹബെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിലെ വൈരുധ്യബന്ധവും യെഹൂദാനഗരങ്ങളിൽ വസിച്ചിരുന്ന ഇസ്രായേല്യർ എന്ന ദേശീയ തിരിച്ചറിയലും സംരക്ഷിച്ചിട്ടുണ്ട്.
