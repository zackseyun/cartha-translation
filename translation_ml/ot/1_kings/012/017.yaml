  rationale: 'The revision improves modern Malayalam clarity and idiom only: the territorial phrase is unpacked, and the verb for kingship is made more current. The adversative force, collective reference to Israelites, residence in Judah’s cities, and Rehoboam’s rule over them are all preserved.'
