  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: ml
  text: അങ്ങനെ രാജാവ് ജനത്തിന്റെ വാക്കു കേട്ടില്ല; കാരണം, യഹോവ ശീലോന്യനായ അഹീയാവിലൂടെ നെബാത്തിന്റെ മകനായ യൊരോബെയാമിനോടു പറഞ്ഞ തന്റെ വചനം നിവർത്തിക്കേണ്ടതിന്, സംഭവങ്ങളുടെ ഈ വഴിത്തിരിവ് യഹോവയിൽനിന്നുള്ളതായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കാരണം’ അല്ലെങ്കിൽ ‘സാഹചര്യം.’ എബ്രായപദമായ סִבָּה ‘കാരണം,’ ‘സാഹചര്യം,’ അല്ലെങ്കിൽ ‘സംഭവങ്ങളിലെ വഴിത്തിരിവ്’ എന്നിങ്ങനെ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל־הָעָם
  choice: ജനത്തിന്റെ വാക്കു കേട്ടില്ല
  rationale: ഇവിടെ ക്രിയ കേവലം ശബ്ദം കേൾക്കുന്നതല്ല, ജനത്തിന്റെ അപേക്ഷ ചെവിക്കൊള്ളുകയോ അനുസരിക്കുകയോ ചെയ്യുന്നതാണ്. മലയാളത്തിൽ ‘വാക്കു കേൾക്കുക’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: סִבָּה
  choice: കാര്യഗതി
  rationale: ഈ അപൂർവ നാമത്തിന് കാരണം, സാഹചര്യം, സംഭവങ്ങളിലെ വഴിത്തിരിവ് എന്നീ അർഥസാധ്യതകളുണ്ട്. ‘കാര്യഗതി’ സംഭവങ്ങളുടെ പുരോഗതിയെയും ഫലത്തെയും ഉൾക്കൊള്ളുകയും നിർവചനം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: מֵעִם יְהוָה
  choice: യഹോവയിൽനിന്നുള്ളതായിരുന്നു
  rationale: മֵעִם ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ദൈവനാമം യഹോവ എന്നു നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: לְמַעַן הָקִים אֶת־דְּבָרוֹ
  choice: തന്റെ വചനം നിവർത്തിക്കേണ്ടതിന്
  rationale: לְמַעַן ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; הֵקִים ഒരു വചനത്തോടൊപ്പം വരുമ്പോൾ അതിനെ സ്ഥാപിക്കുക, സാക്ഷാത്കരിക്കുക, നിവർത്തിക്കുക എന്ന ആശയം നൽകുന്നു. സാധാരണ മലയാളത്തിൽ ‘നിവർത്തിക്കുക’ പ്രവചനവചനം സംഭവത്തിൽ സാക്ഷാത്കരിക്കപ്പെടുന്നതിനെ വ്യക്തമായി പറയുന്നു.
- source_word: בְּיַד אֲחִיָּה
  choice: അഹീയാവിലൂടെ
  rationale: അക്ഷരാർഥം ‘അഹീയാവിന്റെ കൈയാൽ’ എന്നാണെങ്കിലും, ഇത് പ്രവാചകന്റെ മധ്യസ്ഥതയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. ‘അഹീയാവിലൂടെ’ അതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַשִּׁילֹנִי
  choice: ശീലോന്യനായ
  rationale: ശീലോ സ്വദേശിയെന്ന എബ്രായ വിശേഷണം മലയാളത്തിലെ സ്വാഭാവിക ജന്മദേശവിശേഷണമായി നൽകിയിരിക്കുന്നു.
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക പരിപാലനവും രാജാവിന്റെ മനുഷ്യപ്രവൃത്തിയും
  choice: രാജാവ് ജനത്തിന്റെ വാക്കു കേൾക്കാതിരുന്നതിന്റെ പശ്ചാത്തലത്തിലുള്ള കാര്യഗതി യഹോവയിൽനിന്നുള്ളതായിരുന്നുവെന്നും അതിന് യഹോവയുടെ മുൻവചനം നിവർത്തിക്കുക എന്ന ഉദ്ദേശ്യമുണ്ടായിരുന്നുവെന്നും പാഠം പറയുന്നു.
  alternative: യഹോവ സംഭവം അനുവദിക്കുക മാത്രം ചെയ്തുവെന്ന ദുർബല വ്യാഖ്യാനം; അല്ലെങ്കിൽ രാജാവിന്റെ നിരാകരണത്തിന്റെ എല്ലാ കാരണപ്രവർത്തനവും യഹോവ നേരിട്ട് നിർണയിച്ചുവെന്ന കൂടുതൽ ശക്തമായ പരാവർത്തനം.
  rationale: എബ്രായ പാഠം കാര്യഗതിയുടെ ഉറവിടം യഹോവയാണെന്ന് തുറന്നുപറയുകയും പ്രവചനവചനത്തിന്റെ നിവൃത്തിയെ ഉദ്ദേശ്യമായി നൽകുകയും ചെയ്യുന്നു. എന്നാൽ ദൈവിക പ്രവർത്തനത്തിന്റെ യാന്ത്രികരീതി വിശദീകരിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ജനത്തിന്റെ വാക്കു കേൾക്കുക,’ ‘കാര്യഗതി,’ ‘വചനം നിവർത്തിക്കുക’ തുടങ്ങിയ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലപാഠത്തിന്റെ അർഥസാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
