  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രു വാക്യക്രമത്തിന്റെ പ്രധാന ഊന്നലുകൾ നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി.
