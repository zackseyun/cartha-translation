id: 1KI.12.13
reference: 1 Kings 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/מֶּ֛לֶךְ אֶת הָ/עָ֖ם קָשָׁ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֥ר יְעָצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/013.yaml
  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: ml
  text: രാജാവ് ജനത്തോടു കഠിനമായി ഉത്തരം പറഞ്ഞു; തന്നെ ഉപദേശിച്ച മൂപ്പന്മാരുടെ ഉപദേശം അവൻ ഉപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ענה എന്ന ക്രിയ ഇവിടെ ജനത്തിന്റെ മുമ്പത്തെ അപേക്ഷയ്ക്കുള്ള മറുപടിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗമാണിത്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന രാജാവിനെയാണ് നിർദിഷ്ട നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: אֶת הָעָם
  choice: ജനത്തോടു
  rationale: עָם ഇവിടെ രാജാവിനെ സമീപിച്ച ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു; 'ഉത്തരം പറഞ്ഞു' എന്ന മലയാളപ്രയോഗത്തോടൊപ്പം ദാതൃവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: קָשָׁה
  choice: കഠിനമായി
  rationale: രാജാവിന്റെ മറുപടിയുടെ രൂക്ഷമായ രീതിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ പ്രയോഗം; മൂലത്തിലെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: וַיַּעֲזֹב
  choice: തള്ളിക്കളഞ്ഞു
  rationale: עזב ഇവിടെ ഉപദേശം ഉപേക്ഷിച്ച് നിരസിക്കുന്ന നിർണായക പ്രവൃത്തിയാണ്; വെറും 'വിട്ടു' എന്നതിനെക്കാൾ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עֲצַת
  choice: ആലോചന
  rationale: עֵצָה രാജകാര്യസന്ദർഭത്തിലെ ഉപദേശം/ആലോചനയെ സൂചിപ്പിക്കുന്നു; ആലോചന എന്നത് സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: הַזְּקֵנִים
  choice: മൂപ്പന്മാർ
  rationale: ഇത് പ്രായമായ പുരുഷന്മാരെ മാത്രം അല്ല, അംഗീകൃത മുതിർന്ന ഉപദേശകരെയും സൂചിപ്പിക്കുന്നു; 'മൂപ്പന്മാർ' ആ സാമൂഹിക-രാഷ്ട്രീയ സ്ഥാനം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: തന്നെ ഉപദേശിച്ച
  rationale: ബന്ധവാക്യം രാജാവിന് മുമ്പേ ഉപദേശം നൽകിയവരായി മൂപ്പന്മാരെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ കാലക്രമം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
