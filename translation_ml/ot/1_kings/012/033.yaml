  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: ml
  text: അവൻ ബേഥേലിൽ താൻ ഉണ്ടാക്കിയ യാഗപീഠത്തിലേക്ക് എട്ടാം മാസം പതിനഞ്ചാം ദിവസം കയറിച്ചെന്നു. ആ മാസം അവൻ സ്വന്തം മനസ്സിൽനിന്നു സങ്കല്പിച്ചെടുത്തതായിരുന്നു[a]. അവൻ യിസ്രായേൽമക്കൾക്കായി[b] ഒരു ഉത്സവം നടത്തി; ധൂപം കത്തിക്കാനായി അവൻ യാഗപീഠത്തിലേക്ക് കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “സ്വന്തമായി നിശ്ചയിച്ച മാസം” അല്ലെങ്കിൽ “സ്വന്തം ഇഷ്ടപ്രകാരം തിരഞ്ഞെടുത്ത മാസം.”'
    reason: മִלְּבַד എന്ന പ്രയോഗം സ്വന്തം മനസ്സിൽനിന്നുള്ള സങ്കല്പത്തെയോ സ്വന്തം തിരഞ്ഞെടുപ്പിനെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: എബ്രായത്തിൽ “യിസ്രായേലിന്റെ മക്കൾ”; യിസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ദേശീയനാമം.
    reason: മൂലഭാഷയിലെ രൂപം വ്യക്തമാക്കുകയും പ്രയോഗം ജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നുവെന്ന് അറിയിക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിലേക്ക് കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറുക/മുകളിലേക്കു ചെല്ലുക’ എന്ന ദിശാഭാവവും യാഗപീഠത്തെ സമീപിക്കുന്ന ആരാധനാസന്ദർഭവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; യാഗപീഠത്തിന്റെ മുകളിൽ തന്നെയാണെന്ന അനാവശ്യ നിർണയം ഒഴിവാക്കുന്നു.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: מזבח എന്ന ബലികളും ധൂപവും അർപ്പിക്കുന്ന ആരാധനാസ്ഥലത്തിനുള്ള സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: ബേഥേലിൽ താൻ ഉണ്ടാക്കിയ
  rationale: ബന്ധവാക്യവും സ്ഥലസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു; കർത്താവ് മുമ്പേ വ്യക്തമാകുന്നതിനാൽ ‘താൻ’ സ്വാഭാവികമാണ്.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: എട്ടാം മാസം പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ തീയതിക്രമം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: ആ മാസം അവൻ സ്വന്തം മനസ്സിൽനിന്നു സങ്കല്പിച്ചെടുത്തതായിരുന്നു
  rationale: בדאയുടെ ‘മെനയുക/സങ്കല്പിച്ചുണ്ടാക്കുക’ എന്ന അർഥവും, ദൈവനിയോഗത്തിനു പകരം സ്വന്തം മനസ്സിൽനിന്നുണ്ടാക്കിയതെന്ന ആഖ്യാതാവിന്റെ സൂക്ഷ്മ വിമർശനവും നിലനിർത്തുന്നു.
- source_word: וַיַּעַשׂ חָג
  choice: ഒരു ഉത്സവം നടത്തി
  rationale: עשה + חג എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു; ‘ഉത്സവം ഉണ്ടാക്കി’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾക്കായി
  rationale: ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ദേശീയനാമത്തിന്റെ രൂപഭാവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പ്രയോഗം.
- source_word: לְהַקְטִיר
  choice: ധൂപം കത്തിക്കാനായി
  rationale: הקטיר എന്ന ആരാധനാപരമായ ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ സംക്ഷിപ്ത പരിഭാഷ; പുക ഉയരുന്ന അർപ്പണത്തിന്റെ ധൂപസംബന്ധമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: മִלְּבַד എന്ന പ്രയോഗത്തിൽ യൊരോബെയാമിന്റെ ആരാധനാപരമായ പുതുമയെക്കുറിച്ചുള്ള വിലയിരുത്തൽ
  choice: സ്വന്തം മനസ്സിൽനിന്നു സങ്കല്പിച്ചെടുത്തത്
  alternative: സ്വന്തം ഇഷ്ടപ്രകാരം തിരഞ്ഞെടുത്തത് / തനിയെ നിശ്ചയിച്ചത്
  rationale: ഉത്സവമാസം ദൈവികമായി നിശ്ചയിക്കപ്പെട്ടതല്ല, രാജാവിന്റെ സ്വന്തം ആലോചനയിൽനിന്നുണ്ടായതാണെന്ന ആഖ്യാതാവിന്റെ വിമർശനം വ്യാഖ്യാനാതിശയമില്ലാതെ പ്രകടമാക്കുന്നു.
- issue: בני ישראל എന്ന ദേശീയ സംജ്ഞ
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേൽജനം / യിസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധപരവും ദേശീയവുമായ പരമ്പരാഗത സംജ്ഞ നിലനിർത്തുന്നു; ഇവിടെ പുരുഷന്മാർ മാത്രം ഉദ്ദേശ്യമാണെന്ന വ്യാഖ്യാനം ചേർക്കാതെ ജനതയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- issue: עלה על המזבח എന്നതിന്റെ സ്ഥലപരമായ സൂചന
  choice: യാഗപീഠത്തിലേക്ക് കയറിച്ചെന്നു
  alternative: യാഗപീഠത്തിന്മേൽ കയറി / യാഗപീഠത്തിനരികിലേക്കു ചെന്നു
  rationale: മൂലത്തിലെ ‘കയറുക’ എന്ന ചലനഭാവം സൂക്ഷിക്കുകയും, യാഗപീഠത്തിന്റെ മുകളിൽ കാലെടുത്തുവെച്ചുവെന്നോ വെറും അരികിലേക്കു മാത്രമെന്നോ നിർബന്ധിച്ച് തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാഗപീഠം,’ ‘ധൂപം,’ ‘യിസ്രായേൽമക്കൾ’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി; വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നായി വിഭജിച്ചെങ്കിലും എബ്രായത്തിലെ ആവർത്തിച്ച וַיַּעַל പദപ്രയോഗം രണ്ടിടത്തും ഒരേ രീതിയിൽ സംരക്ഷിച്ചു.
