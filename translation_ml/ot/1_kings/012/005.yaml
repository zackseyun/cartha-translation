source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לְכ֥וּ עֹ֛ד שְׁלֹשָׁ֥ה יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּלְכ֖וּ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “പോകുവിൻ; ഇനി മൂന്നു ദിവസം കഴിഞ്ഞ് എന്റെ അടുക്കൽ മടങ്ങിവരുവിൻ.” അങ്ങനെ ജനം പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനരൂപവും അഭിസംബോധിതരിലേക്കുള്ള אֶל ഉപസർഗപ്രയോഗവും സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: לְכוּ
  choice: പോയിട്ട്
  rationale: הלך എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം. ഇവിടെ പ്രതിനിധിസംഘത്തെ താൽക്കാലികമായി പറഞ്ഞയയ്ക്കുന്നതും തുടർന്നുള്ള മടങ്ങിവരവും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: עֹוד שְׁלֹשָׁה יָמִים
  choice: മൂന്നു ദിവസം കഴിഞ്ഞ്
  rationale: עוֹד സഹിതമുള്ള കാലപ്രയോഗം ഇനിയും മൂന്നു ദിവസത്തെ ഇടവേളയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമയക്രമം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְשׁוּבוּ אֵלָי
  choice: വീണ്ടും എന്റെ അടുക്കൽ വരിക
  rationale: שוב എന്നതിന്റെ മടങ്ങിവരുക എന്ന അടിസ്ഥാനാർഥവും אֵלַי എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു. ‘വീണ്ടും’ മടക്കത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּלְכוּ הָעָם
  choice: അങ്ങനെ ജനം പോയി
  rationale: തുടർച്ചയായ ആഖ്യാനവും ജനത്തിന്റെ അനുസരണവും സൂചിപ്പിക്കുന്നു. הָעָם എന്ന ഏകവചന കൂട്ടനാമത്തിന് മലയാളത്തിലെ സ്വാഭാവിക സമാനരൂപമായ ‘ജനം’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘ഇനിയും മൂന്നു ദിവസം’ എന്ന പ്രയോഗം മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി ‘മൂന്നു ദിവസം കഴിഞ്ഞ്’ എന്നു നൽകി; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
