  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: ml
  text: അവൻ രാജാവായപ്പോൾ, സിംഹാസനത്തിൽ ഇരുന്ന ഉടൻതന്നെ ബാശാവിന്റെ വംശത്തിലെ എല്ലാവരെയും കൊന്നുകളഞ്ഞു. ബാശാവിന് ഒരൊറ്റ പുരുഷനെയും[a], അവന്റെ ബന്ധുക്കളെയോ[b] സുഹൃത്തുക്കളെയോ അവൻ ശേഷിപ്പിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ചുമരിന്മേൽ മൂത്രമൊഴിക്കുന്നവൻ”; പുരുഷനെ സൂചിപ്പിക്കുന്ന പരുക്കനായ ഒരു ഹീബ്രു ശൈലി.
    reason: lexical_alternative
  - marker: b
    text: “അവന്റെ പ്രതികാരകർ” അല്ലെങ്കിൽ “അവന്റെ വീണ്ടെടുപ്പുകാർ” എന്നും വിവർത്തനം ചെയ്യാം; കുടുംബപരമായ ബാധ്യതകളുള്ള അടുത്ത ബന്ധുവിനെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ സംഭവക്രമസൂചകമായ וַיְהִי വേറിട്ടൊരു ഭാരമുള്ള പ്രയോഗമായി മാറ്റാതെ, തുടർന്നുള്ള കാലവാക്യത്തോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְמָלְכוֹ
  choice: അവൻ രാജാവായപ്പോൾ
  rationale: ഇവിടെ പൊതുവായ ഭരണകാലത്തേക്കാൾ രാജപദവിയേറ്റ സന്ദർഭമാണ് പ്രസക്തം.
- source_word: כְשִׁבְתּוֹ עַל־כִּסְאוֹ
  choice: സിംഹാസനത്തിൽ ഇരുന്ന ഉടൻതന്നെ
  rationale: כְּ ഘടനയും സന്ദർഭവും സൂചിപ്പിക്കുന്ന തൽക്ഷണമായ സംഭവക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: הִכָּה
  choice: കൊന്നുകളഞ്ഞു
  rationale: ഈ സന്ദർഭത്തിൽ נכה മാരകമായി പ്രഹരിച്ച് നശിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת כָּל בֵּית בַּעְשָׁא
  choice: ബയെശയുടെ ഭവനം മുഴുവനെയും
  rationale: ‘ഭവനം’ എന്നത് കെട്ടിടമല്ല, കുടുംബവംശത്തെയും രാജകുടുംബത്തെയും സൂചിപ്പിക്കുന്നു; രാജാക്കന്മാരിലെ വംശപരമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: ബയെശയ്ക്ക് ... ശേഷിപ്പിച്ചില്ല
  rationale: ഹീബ്രുവിലെ ദാതൃസർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ പേരിനെ ആവർത്തിച്ച്, ആരുടെ വംശത്തിൽ ആരെയും ജീവനോടെ ശേഷിപ്പിച്ചില്ല എന്ന ആശയം നൽകുന്നു.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ഒരു പുരുഷനെയും
  rationale: അക്ഷരാർഥത്തിൽ പരുക്കനായ ഹീബ്രു ശൈലിയാണിത്; മുഖ്യപാഠത്തിൽ അതിന്റെ ഉദ്ദേശ്യമായ ‘പുരുഷൻ’ നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְגֹאֲלָיו
  choice: അവന്റെ ബന്ധുക്കളിൽ ഒരാളെയും
  rationale: גאל കുടുംബബാധ്യതകളുള്ള അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കാം; ‘പ്രതികാരകൻ’ അല്ലെങ്കിൽ ‘വീണ്ടെടുപ്പുകാരൻ’ എന്ന പ്രത്യേക ചുമതല സന്ദർഭം ഉറപ്പിക്കാത്തതിനാൽ വിശാലമായ കുടുംബബന്ധം നിലനിർത്തുന്നു.
- source_word: וְרֵעֵהוּ
  choice: സുഹൃത്തുക്കളിൽ ഒരാളെയും
  rationale: רֵעַ സുഹൃത്ത്, കൂട്ടാളി, സഹചാരി എന്നിവയെ സൂചിപ്പിക്കാം; ‘സുഹൃത്ത്’ സ്വാഭാവികവും അർത്ഥപരമായി തുറന്നതുമാണ്.
theological_decisions:
- issue: גֹאֲלָיו എന്ന പദത്തിലെ കുടുംബപരവും നിയമപരവുമായ അർത്ഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ബന്ധുക്കൾ’
  alternative: ‘പ്രതികാരകർ’ അല്ലെങ്കിൽ ‘വീണ്ടെടുപ്പുകാർ’
  rationale: ഈ സന്ദർഭം ഗോയേലിന്റെ ഏത് പ്രത്യേക കുടുംബചുമതലയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ അസന്ദിഗ്ധമായി ഒരു ചുമതല അടിച്ചേൽപ്പിക്കാതെ മൂലപദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഭവനം’ വംശപരമായ അർത്ഥത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. പരുക്കനായ ഹീബ്രു ശൈലിയും גאל എന്ന പദത്തിന്റെ യഥാർഥ അർത്ഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
