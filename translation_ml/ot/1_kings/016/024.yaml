  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: ml
  text: അവൻ ശേമെരിൽനിന്ന് ശമര്യാമല രണ്ട് താലന്ത് വെള്ളിക്കു വാങ്ങി. ആ മലയിൽ അവൻ ഒരു നഗരം പണിതു; താൻ പണിത നഗരത്തിന് മലയുടെ ഉടമയായ ശേമെരിന്റെ പേരനുസരിച്ച് ശമര്യ എന്നു പേരിട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘താലന്ത്’ വിലയേറിയ ലോഹങ്ങൾ തൂക്കാൻ ഉപയോഗിച്ചിരുന്ന വലിയൊരു തൂക്കയളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: വാങ്ങി
  rationale: קנה ഇവിടെ വിലകൊടുത്ത് സ്ഥലം സ്വന്തമാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വാങ്ങി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָהָר
  choice: മല
  rationale: הַר എന്നതിന് മല എന്നും കുന്ന് എന്നും അർഥമാകാം. ശമര്യയുടെ ഉയർന്ന നഗരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമായി ‘മല’ സ്വീകരിച്ചു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ആദ്യം മലയും പിന്നീട് നഗരവും ഇതേ പേരിൽ സൂചിപ്പിക്കപ്പെടുന്നു.
- source_word: מֵאֵת שֶׁמֶר
  choice: ശേമെരിൽനിന്ന്
  rationale: מֵאֵת വിൽപ്പനക്കാരനെയോ കൈമാറ്റത്തിന്റെ ഉറവിടത്തെയോ അടയാളപ്പെടുത്തുന്നു.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: രണ്ടു താലന്തു വെള്ളിക്ക്
  rationale: כִּכָּר വിലയേറിയ ലോഹത്തിന്റെ വലിയ തൂക്കയളവാണ്; ദ്വിവചനരൂപം രണ്ടിനെ സൂചിപ്പിക്കുന്നു. ‘വെള്ളിക്ക്’ വിലയായി നൽകിയതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: ആ മലയിൽ പണിതു
  rationale: അക്ഷരാർഥം ‘മലയെ പണിതു’ എന്നാണെങ്കിലും ഉദ്ദേശ്യം മലയിൽ കെട്ടിടങ്ങളോ നഗരമോ പണിതുവെന്നതാണ്; അധികവിവരം ചേർക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: നഗരത്തിന് ... പേരിട്ടു
  rationale: ഹീബ്രായ നാമകരണപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: ശേമെരിന്റെ പേരനുസരിച്ച്
  rationale: നഗരനാമം ശേമെരിന്റെ പേരിനെ ആധാരമാക്കിയതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֲדֹנֵי הָהָר
  choice: മലയുടെ ഉടമയായ
  rationale: אָדוֹן ഇവിടെ അധികാരപദവിയല്ല, വസ്തുവിന്റെ ഉടമസ്ഥതയാണ് സൂചിപ്പിക്കുന്നത്.
