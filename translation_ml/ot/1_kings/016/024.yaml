translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ക്രിയാക്രമം നിലനിർത്തിയെങ്കിലും ‘നഗരത്തിന്റെ പേര് വിളിച്ചു’ എന്ന അസ്വാഭാവിക അക്ഷരാനുവാദത്തിനു പകരം ‘പേരിട്ടു’ ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങളും ഉള്ളടക്കവും തമ്മിൽ മറിച്ചിടപ്പെട്ടതായി തോന്നുന്നതിനാൽ, മൂലവാചകസാക്ഷ്യത്തിനനുസരിച്ച് [a] താലന്തിന്റെ സാംസ്കാരിക വിശദീകരണത്തോടും [b] നാമകരണവാക്യത്തിന്റെ ലളിതമായ പകരവായനയോടും ബന്ധിപ്പിച്ചു.
