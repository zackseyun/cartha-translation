  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: ml
  text: ഒമ്രി യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു; തനിക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും അധികം തിന്മ ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തനിക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും അവൻ ദുഷ്ടനായിരുന്നു.” ഹീബ്രു ക്രിയ ഒമ്രിയുടെ പ്രവൃത്തികളെയോ ഒമ്രിയെത്തന്നെയോ വിവരിക്കുന്നതായി മനസ്സിലാക്കാം; സന്ദർഭത്തിലെ പതിവായ വിലയിരുത്തൽപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയ הָרַע എന്ന പദത്തോടൊപ്പം ഇവിടെ ‘തിന്മയായതു ചെയ്തു’ എന്ന സ്ഥിരമായ വിലയിരുത്തൽപ്രയോഗമാണ്; ‘ഉണ്ടാക്കി’ എന്ന പദാനുപദ പരിഭാഷയെക്കാൾ ‘ചെയ്തു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: നിശ്ചയാർഥകമായ הָרַע ഇവിടെ നാമവൽക്കരിക്കപ്പെട്ട വിശേഷണമായി ‘തിന്മയായത്’ എന്ന അർഥം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘തിന്മയായതു’ എന്നത് സന്ദർഭത്തിലെ പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: בְּעֵינֵי
  choice: ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥം ‘കണ്ണുകളിൽ’ എന്നാണെങ്കിലും, ഒരാളുടെ വിലയിരുത്തലിൽ എന്ന ഹീബ്രു ശൈലിയുടെ ആശയം ‘ദൃഷ്ടിയിൽ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּרַע
  choice: അധികം തിന്മ ചെയ്തു
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും തുടർന്നുള്ള താരതമ്യപ്രയോഗവും ചേർന്ന് ഒമ്രിയുടെ ദുഷ്പ്രവൃത്തികളുടെ വർധിച്ച അളവ് സൂചിപ്പിക്കുന്നു. ആദ്യ ഉപവാക്യവുമായുള്ള ക്രിയാത്മക തുടർച്ചയും ഈ പരിഭാഷ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: തനിക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും
  rationale: മുൻകാല ഭരണാധികാരികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഈ വാക്യത്തിൽ ‘രാജാക്കന്മാർ’ എന്ന് വ്യക്തമല്ലാത്തതിനാൽ, മൂലപാഠത്തിന്റെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יְהוָה നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: וַיָּרַע ഒമ്രിയുടെ പ്രവൃത്തിയെയോ സ്വഭാവത്തെയോ വിവരിക്കുന്നുവോ
  choice: അവൻ അധികം തിന്മ ചെയ്തു
  alternative: അവൻ കൂടുതൽ ദുഷ്ടനായിരുന്നു
  rationale: രാജാക്കന്മാരുടെ പ്രവൃത്തികളെ വിലയിരുത്തുന്ന സമീപസന്ദർഭവും ആദ്യ ഉപവാക്യത്തിലെ ‘തിന്മയായതു ചെയ്തു’ എന്ന പ്രയോഗവുമായുള്ള തുടർച്ചയും മുഖ്യപാഠത്തിലെ ക്രിയാത്മക വായനയെ പിന്തുണയ്ക്കുന്നു; വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഹീബ്രു വിലയിരുത്തൽശൈലിയിലെ ദൃശ്യരൂപം ‘ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുകയും, അനാവശ്യമായി ‘രാജാക്കന്മാർ’ എന്ന് ചേർക്കാതിരിക്കുകയും ചെയ്തു.
