reference: 1 Kings 16:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസായുടെ വാഴ്ചയുടെ ഇരുപത്തിയാറാം വർഷത്തിൽ, ബയെശായുടെ മകനായ ഏലാ തിർസയിൽ ഇസ്രായേലിന്റെ രാജാവായി; അവൻ രണ്ടു വർഷം വാണു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: വാഴ്ചയുടെ ഇരുപത്തിയാറാം വർഷത്തിൽ
  rationale: എബ്രായ രാജവാഴ്ചാ കാലഗണനാസൂത്രത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആവർത്തിച്ചുള്ള ‘വർഷം’ എന്ന പദപ്രയോഗം പകർത്തുന്നില്ല.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ
  rationale: לְ ഇവിടെ ആസയുടെ ഭരണവർഷത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി; അവൻ ... വാണു
  rationale: പ്രവേശനസൂചനയിൽ ക്രിയയുടെ ആരംഭാർഥമായ ‘രാജാവായി’ നിലനിർത്തുകയും, അവസാനം വരുന്ന ‘രണ്ടു വർഷം’ ഭരണകാലദൈർഘ്യമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֵלָה
  choice: ഏലാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶן בַּעְשָׁא
  choice: ബയെശയുടെ മകനായ
  rationale: സാധാരണ പുത്രബന്ധ നിർമാണം; בַּעְשָׁא എന്ന പേരിന്റെ വ്യഞ്ജന-സ്വരഘടനയോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനു രാജാവായി
  rationale: עַל യുടെ ഭരണാധികാരബന്ധം മലയാളത്തിലെ സ്വാഭാവിക രാജവാഴ്ചാ പ്രയോഗത്തിലൂടെ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘രാജ്യം’ ചേർക്കുന്നില്ല.
- source_word: בְּתִרְצָה
  choice: തിർസയിൽവെച്ച്
  rationale: בְ സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം വ്യക്തമാക്കുന്നു; രാജാവായതും വാണതും സംബന്ധിച്ച കേന്ദ്രസ്ഥലമായി തിർസയെ അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנָתָיִם
  choice: രണ്ടു വർഷം
  rationale: എബ്രായ ദ്വിവചനത്തിന്റെ കൃത്യമായ കാലദൈർഘ്യം; ‘വാണു’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
