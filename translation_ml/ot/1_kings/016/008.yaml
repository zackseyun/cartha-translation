translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, രാജവാഴ്ചാ രേഖയുടെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു. മൂലത്തിലെ പ്രവേശനക്രിയയും രണ്ടു വർഷത്തെ ഭരണദൈർഘ്യവും മലയാളത്തിൽ അസന്ദിഗ്ധമാക്കാൻ അർധവിരാമത്തോടെ രണ്ടു ഘടകങ്ങളാക്കി.
