id: 1KI.16.1
reference: 1 Kings 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ വചനം ഹനാനിയുടെ മകനായ യേഹൂവിന് ബയെശയ്ക്കെതിരായി[a] അരുളപ്പെട്ടു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബയെശയെക്കുറിച്ച്.” എബ്രായ ഉപസർഗത്തിന് കൂടുതൽ വിശാലമായ അർത്ഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ അത് ന്യായവിധിയുടെ അരുളപ്പാട് അവതരിപ്പിക്കുന്നതിനാൽ “എതിരായി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ ... അരുളപ്പെട്ടു
  rationale: തുടർന്നുണ്ടാകുന്ന പുതിയ സംഭവവികാസത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പ്രവാചകസന്ദേശം ലഭിക്കുന്നതിനെ മലയാളത്തിൽ ‘അരുളപ്പെട്ടു’ എന്ന് മാന്യമായും വ്യക്തമായും പറയുന്നു.
- source_word: דְבַר יְהוָה
  choice: യഹ്‌വേയുടെ വചനം
  rationale: ദൈവിക വെളിപ്പാടിന്റെ സ്ഥിരമായ പ്രവാചകപ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും ‘വചനം’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: യേഹൂവിന്
  rationale: ദൈവവചനത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിലെ ദത്തിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: ഹനാനിയുടെ മകനായ യേഹൂ
  rationale: എബ്രായ വംശബന്ധപ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל
  choice: ബയെശയ്ക്കെതിരായി
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിപ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ എതിർദിശയിലുള്ള ന്യായവിധിബലം പ്രകടിപ്പിക്കുന്നു; വിശാലമായ ‘സംബന്ധിച്ച്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בַּעְשָׁא
  choice: ബയെശ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: לֵאמֹר
  choice: 'അരുളപ്പെട്ടു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള ദൈവവചനം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ഇരട്ടപ്പുള്ളി ഉപയോഗിച്ച് പ്രസംഗത്തിന്റെ തുടക്കം വ്യക്തമാക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പദാനുപദരൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പ്രവാചകസൂത്രവാക്യത്തിലെ עַל എന്നതിന്റെ ബലം
  choice: ബയെശയ്ക്കെതിരായി
  alternative: ബയെശയെക്കുറിച്ച്
  rationale: ഇത് ന്യായവിധിയുടെ അരുളപ്പാട് അവതരിപ്പിക്കുന്നതിനാൽ ‘എതിരായി’ എന്നത് സന്ദർഭത്തിലെ ന്യായവിധിബലം സൂക്ഷിക്കുന്നു; എന്നാൽ എബ്രായ ഉപസർഗത്തിന്റെ വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾഭാഷ. പ്രവാചകസൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
