  to: ഞാൻ നിന്നെ പൊടിയിൽനിന്ന് ഉയർത്തി എന്റെ ജനമായ ഇസ്രായേലിന്റെ ഭരണാധികാരിയാക്കിയതും, നീ യൊരോബെയാമിന്റെ വഴിയിൽ നടക്കുകയും എന്റെ ജനമായ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച്[a] അവരുടെ പാപങ്ങളാൽ എന്നെ കോപിപ്പിക്കുകയും ചെയ്തതും നിമിത്തം,
  rationale: The revision removes the unmarked concessive implication, clarifies that both the divine elevation and Baasha’s conduct are grounds introduced by the causal expression, and standardizes Jeroboam’s Malayalam name. It retains the Hebrew imagery, causative verb force, plural reference in ‘their sins,’ the source’s open-ended syntax, and the existing footnote anchor and sense.
