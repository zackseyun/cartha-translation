id: 1KI.16.2
reference: 1 Kings 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: ml
  text: ഞാൻ നിന്നെ പൊടിയിൽനിന്ന് ഉയർത്തി എന്റെ ജനമായ ഇസ്രായേലിന്റെ ഭരണാധികാരിയാക്കിയതും, നീ യൊരോബെയാമിന്റെ വഴിയിൽ നടക്കുകയും എന്റെ ജനമായ ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച്[a] അവരുടെ പാപങ്ങളാൽ എന്നെ കോപിപ്പിക്കുകയും ചെയ്തതും നിമിത്തം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ജനമായ ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ച്.’ എബ്രായ ക്രിയ കാരണാർഥകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ചെയ്തതിനാൽ
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന ന്യായവിധിയുടെ കാരണം ഈ പ്രയോഗം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിനായി കാരണസൂചകപ്രയോഗം വാക്യാവസാനത്തോടു ചേർത്തു.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: നിന്നെ പൊടിയിൽനിന്ന് ഉയർത്തി
  rationale: താഴ്ന്ന നിലയിൽനിന്ന് രാജാധികാരത്തിലേക്കുള്ള ഉയർച്ചയെയും മൂലപാഠത്തിലെ പൊടി എന്ന ദൃശ്യപ്രതീകത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: ഭരണാധികാരിയാക്കി
  rationale: נָגִיד ഇവിടെ നിയമിക്കപ്പെട്ട നേതാവിനെയോ ഭരണാധികാരിയെയോ സൂചിപ്പിക്കുന്നു; രാജകീയ സന്ദർഭത്തിൽ വ്യക്തവും ആധുനികവുമായ പദമാണിത്.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിന്റെ
  rationale: ദൈവത്തിന്റെ ജനമെന്ന ഉടമസ്ഥതാഭാവവും ഇസ്രായേലിന്മേലുള്ള ഭരണവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: നീ യൊരോബെയാമിന്റെ വഴിയിൽ നടക്കുകയും
  rationale: ജീവിതരീതിയെയും പെരുമാറ്റമാതൃകയെയും സൂചിപ്പിക്കുന്ന ‘വഴിയിൽ നടക്കുക’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച്
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണാർഥം നേരിട്ട് പ്രകടമാക്കുന്നു; രാജാവിന്റെ നേതൃത്വപരമായ കുറ്റബാധ്യതയും ജനത്തിന്റെ പ്രവൃത്തിയും രണ്ടും നിലനിർത്തുന്നു.
- source_word: לְהַכְעִיסֵנִי
  choice: എന്നെ കോപിപ്പിക്കുകയും
  rationale: ദൈവത്തോടുള്ള വ്യക്തിപരമായ അപരാധവും അതിന്റെ ഫലമായ കോപവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בְּחַטֹּאתָם
  choice: അവരുടെ പാപങ്ങളാൽ
  rationale: בְ എന്നതിന്റെ കാരണാത്മക/കരണാർഥവും ബഹുവചന പ്രത്യയം ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നതും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവരുടെ പാപങ്ങളാൽ’ എന്നതിലെ ബഹുവചന പ്രത്യയത്തിന്റെ സൂചിതർ
  choice: ബയെശയുടെ നേതൃത്വഫലമായി പാപം ചെയ്ത ഇസ്രായേൽജനം
  alternative: യൊരോബെയാമിന്റെ വഴിയുമായി ബന്ധപ്പെട്ട പാപാചാരങ്ങൾ പൊതുവായി, ബയെശയുടെ പങ്കാളിത്തവും ഉൾപ്പെടെ
  rationale: തൊട്ടുമുമ്പുള്ള ‘എന്റെ ജനമായ ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച്’ എന്ന വാക്യഭാഗമാണ് ബഹുവചന പ്രത്യയത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ മുൻപദം. ഇതിലൂടെ രാജാവിന്റെ ഉത്തരവാദിത്വവും ജനത്തിന്റെ സ്വന്തം പാപപങ്കാളിത്തവും ഒരുപോലെ നിലനിൽക്കുന്നു.
- issue: ദൈവം ഉയർത്തിയതും ബയെശ പാപം ചെയ്തതും തമ്മിലുള്ള വ്യത്യാസഭാവം
  choice: ‘ആക്കിയിരിക്കെ’ എന്ന പ്രയോഗത്തിലൂടെ സന്ദർഭത്തിൽ അന്തർലീനമായ വൈരുധ്യം സൂചിപ്പിച്ചു
  alternative: എല്ലാ ഘടകങ്ങളെയും ‘കൂടാതെ/യും’ എന്ന ലളിത സംയോജകത്തോടെ മാത്രം ബന്ധിപ്പിക്കുക
  rationale: എബ്രായത്തിലെ ו സ്വതവേ വൈരുധ്യസൂചകമല്ലെങ്കിലും, ദൈവം താഴ്ന്ന നിലയിൽനിന്ന് ഉയർത്തിയതിനോടുള്ള ബയെശയുടെ അവിശ്വസ്ത പ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാണ്. ‘ആക്കിയിരിക്കെ’ ഈ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പൊടി,’ ‘വഴിയിൽ നടക്കുക’ എന്നീ മൂലപാഠരൂപങ്ങൾ നിലനിർത്തി; വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനം അർധവിരാമസ്വഭാവമുള്ള കോമ ഉപയോഗിച്ചു.
