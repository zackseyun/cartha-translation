  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: ml
  text: ബയെശാ തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]; അവനെ തിർസയിൽ അടക്കം ചെയ്തു. അവന്റെ മകൻ ഏലാ അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ പൂർവികരോടുകൂടെ.” “തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു” എന്നത് ഒരു രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവായ എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജാവിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവായ എബ്രായ അനുസ്മരണസൂത്രത്തിലെ ‘ഉറങ്ങി’ എന്ന രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ dignified and comprehensible ആയ മരണപ്രയോഗമാണിത്.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: എബ്രായത്തിലെ സ്ഥിരപ്രയോഗത്തിന്റെ രൂപവും ആവർത്തനസ്വഭാവവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘പൂർവികരോടുകൂടെ’ എന്ന അർത്ഥവ്യക്തീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിയർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּתִרְצָה
  choice: തിർസയിൽ
  rationale: നഗരനാമത്തോടുള്ള בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: രാജകീയ പിൻഗാമിത്വസന്ദർഭത്തിൽ ‘ഭരിച്ചു’ എന്നതിലുപരി സിംഹാസനാരോഹണത്തിന്റെ ആരംഭം ഇവിടെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֵלָה בְנוֹ
  choice: അവന്റെ മകൻ ഏലാ
  rationale: ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചുകൊണ്ട് ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: നേരിട്ടുള്ള സ്ഥാനപകരവും രാജകീയ പിൻഗാമിത്വവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
