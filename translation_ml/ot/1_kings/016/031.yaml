  source_fidelity: The draft faithfully retains the rhetorical opening, Jeroboam’s sins, Jezebel’s parentage, Ethbaal’s title, and the distinct cultic actions of serving Baal and bowing to him. The footnote appropriately preserves the interrogative construal of the difficult Hebrew opening.
