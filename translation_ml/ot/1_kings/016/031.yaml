reference: 1 Kings 16:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: ml
  text: നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ പാപങ്ങളിൽ നടക്കുന്നത് അവന് നിസ്സാരകാര്യമായതുപോലെ, അവൻ സീദോന്യരുടെ രാജാവായ എത്ത്‌ബാലിന്റെ മകൾ ഈസബേലിനെ ഭാര്യയായി സ്വീകരിച്ചു; പിന്നെ ചെന്ന് ബാലിനെ സേവിക്കുകയും അവന്റെ മുമ്പിൽ കുമ്പിടുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲנָקֵל
  choice: നിസ്സാരമെന്നപോലെ
  rationale: ഹീബ്രു പ്രയോഗം ആഹാബ് യൊരോബെയാമിന്റെ പാപങ്ങളെ നിസ്സാരമായി കണ്ടുവെന്ന ധ്വനിയും തുടർന്ന് അതിലും ഗുരുതരമായ പാപത്തിലേക്കുള്ള വർധനയും നൽകുന്നു; ചോദ്യംരൂപത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: പാപങ്ങളിൽ നടക്കുന്നത്
  rationale: ജീവിതചര്യയെയും പെരുമാറ്റരീതിയെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം മലയാളത്തിലും മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: ഈസബേലിനെ ഭാര്യയായി സ്വീകരിച്ചു
  rationale: അക്ഷരാർഥമായ ‘ഭാര്യയായി എടുത്തു’ എന്ന ഘടനയുടെ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶתְבַּעַל
  choice: എത്ത്‌ബാൽ
  rationale: ഫൊനീഷ്യൻ രാജനാമത്തിന്റെ മൂലരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: צִידֹנִים
  choice: സീദോന്യർ
  rationale: ബഹുവചന ജനനാമത്തെ ‘സീദോന്യരുടെ രാജാവ്’ എന്ന സ്വാഭാവിക മലയാള രൂപത്തിൽ പകർന്നു.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: ബാലിനെ സേവിച്ചു
  rationale: ആരാധനാസംബന്ധിയായ ഭക്തിസേവനത്തെ സൂചിപ്പിക്കുന്ന עבד എന്ന ക്രിയയെ തുടർന്നുള്ള കുമ്പിടൽക്രിയയിൽനിന്ന് വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ടു
  rationale: ശരീരം കുനിച്ച് വണങ്ങുന്ന പ്രത്യേക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ആരാധിച്ചു’ എന്നതിലേക്ക് ലയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: യൊരോബെയാമിന്റെ പാപങ്ങളിൽനിന്ന് ബാലാരാധനയിലേക്കുള്ള ആഹാബിന്റെ അധഃപതനത്തിന്റെ വർധന
  choice: യൊരോബെയാമിന്റെ പാപങ്ങളെ നിസ്സാരമെന്നപോലെ കണ്ടശേഷം ആഹാബ് വിവാഹബന്ധത്തിലൂടെയും ആരാധനാപരമായ സേവനത്തിലൂടെയും ബാലാരാധനയിലേക്ക് കൂടുതൽ മുന്നേറിയതായി വാക്യക്രമം പ്രകടമാക്കുന്നു.
  alternative: ആരംഭം ‘യൊരോബെയാമിന്റെ പാപങ്ങളിൽ നടക്കുന്നത് അവന് നിസ്സാരകാര്യമായിരുന്നോ?’ എന്ന നേരിട്ടുള്ള വാചാടോപചോദ്യമായി വായിക്കാം.
  rationale: הֲנָקֵל എന്ന ഹീബ്രു രൂപം വാചാടോപചോദ്യമായും നിസ്സാരമായി കണക്കാക്കിയെന്ന സൂചനയായും ഗ്രഹിക്കാം. മുഖ്യപാഠം സ്വാഭാവികമായ മലയാളത്തിൽ വർധനയുടെ ധ്വനി നൽകുന്നു; വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘പാപങ്ങളിൽ നടക്കുക’ എന്ന വേദപുസ്തകീയ രൂപകം നിലനിർത്തിയപ്പോൾ, വിവാഹപ്രയോഗം സ്വാഭാവികമാക്കി. ‘സേവിച്ചു’ എന്നും ‘കുമ്പിട്ടു’ എന്നും വേർതിരിച്ച് മൂലത്തിലെ രണ്ടു ആരാധനാക്രിയകളുടെ വ്യത്യാസം കാത്തുസൂക്ഷിച്ചു.
