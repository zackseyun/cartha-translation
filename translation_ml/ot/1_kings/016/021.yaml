id: 1KI.16.21
reference: 1 Kings 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽജനം രണ്ടു വിഭാഗമായി പിരിഞ്ഞു: ജനത്തിൽ പകുതി ഗീനത്തിന്റെ മകനായ തിബ്നിയെ രാജാവാക്കാൻ അവന്റെ പക്ഷം ചേർന്നു; മറ്റേ പകുതി ഒമ്രിയുടെ പക്ഷം ചേർന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: പിരിഞ്ഞു
  rationale: חלק എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ‘വിഭജിക്കപ്പെടുക/പിരിയുക’ എന്ന അർഥം നൽകുന്നു. കൂട്ടനാമമായ ‘ജനം’ എന്ന ഏകവചന കർത്താവിനോട് സ്വാഭാവികമായ മലയാളപ്രയോഗമായി ‘പിരിഞ്ഞു’ ഉപയോഗിച്ചു.
- source_word: הָעָם יִשְׂרָאֵל
  choice: ഇസ്രായേൽജനം
  rationale: ഇവിടെ ദേശീയ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ഇസ്രായേൽജനം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: לַחֵצִי
  choice: രണ്ടു വിഭാഗമായി
  rationale: വാച്യമായി ‘പകുതിയായി’ എന്നാണെങ്കിലും, തുടർന്നുള്ള രണ്ടു പകുതികളുടെ വിവരണം വ്യക്തമായി അവതരിപ്പിക്കാൻ ‘രണ്ടു വിഭാഗമായി’ എന്നു നൽകി.
- source_word: חֲצִי הָעָם
  choice: ജനത്തിൽ പകുതി
  rationale: ജനസമൂഹത്തിന്റെ തുല്യവിഭാഗങ്ങളിലൊന്നിനെ സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָיָה אַחֲרֵי
  choice: പക്ഷം ചേർന്നു
  rationale: വാച്യാർഥം ‘പിന്നാലെ ആയിരുന്നു’ എന്നാണെങ്കിലും ഈ രാഷ്ട്രീയസന്ദർഭത്തിൽ പിന്തുണയും കൂറുമാണ് ഉദ്ദേശ്യം; ‘പക്ഷം ചേർന്നു’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: תִבְנִי בֶן גִּינַת
  choice: ഗീനത്തിന്റെ മകനായ തിബ്നി
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ഹീബ്രു ബന്ധവാക്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: לְהַמְלִיכוֹ
  choice: അവനെ രാജാവാക്കാൻ
  rationale: מלך എന്ന ധാതുവിന്റെ ഹിഫിൽ ക്രിയാനാമരൂപം ‘അവനെ ഭരിക്കാൻ ഇടയാക്കുക’, അതായത് ‘രാജാവാക്കുക’ എന്നാണ്; കിരീടധാരണച്ചടങ്ങ് എന്ന അധിക ആശയം ചേർത്തിട്ടില്ല.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: മറ്റേ പകുതി ഒമ്രിയുടെ പക്ഷം ചേർന്നു
  rationale: ഹീബ്രുവിലെ സമാന്തരഘടനയിൽ രണ്ടാം ഖണ്ഡത്തിലെ ക്രിയ അധ്യാഹരിച്ചിരിക്കുന്നു. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ക്രിയ ആവർത്തിക്കുകയും വിരുദ്ധവിഭാഗം വ്യക്തമാക്കാൻ ‘മറ്റേ’ ചേർക്കുകയും ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. രാഷ്ട്രീയ പിന്തുണ സൂചിപ്പിക്കാൻ ‘പക്ഷം ചേർന്നു’ ഉപയോഗിച്ചു; പാഠത്തിൽ പ്രത്യേക വ്യാഖ്യാനപരമോ സഭാവിഭാഗപരമോ ആയ ആശയങ്ങൾ ചേർത്തിട്ടില്ല.
