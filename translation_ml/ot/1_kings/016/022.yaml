id: 1KI.16.22
reference: 1 Kings 16:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: ml
  text: എന്നാൽ ഒമ്രിയെ പിന്തുണച്ച ജനം ഗീനത്തിന്റെ മകനായ തിബ്നിയെ പിന്തുണച്ച ജനത്തിന്മേൽ മേൽക്കൈ നേടി[a]. തുടർന്ന് തിബ്നി മരിച്ചു; ഒമ്രി രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടുതൽ ശക്തരായി’ / ‘ശക്തിയിൽ വളർന്നു.’ എബ്രായക്രിയയ്ക്ക് ശക്തിയെയോ മേൽക്കോയ്മയെയോ സൂചിപ്പിക്കാം; ഇവിടെ ആഭ്യന്തര രാഷ്ട്രീയപോരാട്ടത്തിൽ ഒമ്രിയുടെ പക്ഷം മേൽക്കൈ നേടിയതാണു സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק ... אֶת
  choice: ജനത്തിന്മേൽ മേൽക്കൈ നേടി
  rationale: חזק എന്ന ക്രിയ אֶת ചേർന്ന ഈ ഘടനയിൽ വെറും ശക്തിപ്പെടൽ മാത്രമല്ല, എതിര്‍വിഭാഗത്തെക്കാൾ ശക്തരായി രാഷ്ട്രീയ പോരാട്ടത്തിൽ മേൽക്കൈ നേടുക എന്ന ആശയമാണ്. ‘മേൽക്കൈ നേടി’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: ഒമ്രിയെ പിന്തുണച്ച ജനം
  rationale: אַחֲרֵי എന്നതിന് അക്ഷരാർഥത്തിൽ ‘പിന്നാലെ’ എന്നാണെങ്കിലും ഇവിടെ അത് രാഷ്ട്രീയമായ അനുഗമനത്തെയും പക്ഷംചേരലിനെയും സൂചിപ്പിക്കുന്നു. ‘പിന്തുണച്ച’ എന്നത് ആ വിശ്വസ്തത വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: തിബ്നിയെ പിന്തുണച്ച ജനം
  rationale: എബ്രായത്തിലെ സമാന്തരഘടന നിലനിർത്തിക്കൊണ്ട് എതിര്‍ രാഷ്ട്രീയവിഭാഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: ഗീനത്തിന്റെ മകനായ തിബ്നി
  rationale: בן എന്ന ബന്ധപദം സ്വാഭാവികമായ മലയാള വംശപരിചയരീതിയിൽ വിവർത്തനം ചെയ്തു; വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּמָת תִּבְנִי
  choice: തുടർന്ന് തിബ്നി മരിച്ചു
  rationale: വാവ്-തുടർച്ചാഘടന കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു. ‘തുടർന്ന്’ സംഭവക്രമം വ്യക്തമാക്കുന്നു; തിബ്നിയുടെ മരണം എങ്ങനെ സംഭവിച്ചു എന്നോ അത് നേരിട്ട് മുൻസംഭവത്തിന്റെ ഫലമായിരുന്നെന്നോ മൂലപാഠം പറയാത്തതിനാൽ അത്തരം വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: ഒമ്രി രാജാവായി
  rationale: ഇവിടെ מלך എതിരാളിയുടെ മരണത്തിനു പിന്നാലെയുള്ള ഒമ്രിയുടെ രാജസ്ഥാനാരോഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘രാജാവായി’ അത് സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. രാഷ്ട്രീയ പക്ഷംചേരൽ വ്യക്തമാക്കാൻ ‘പിന്തുണച്ച’ എന്നും, חזק എന്ന ക്രിയയുടെ സന്ദർഭാർഥത്തിന് ‘മേൽക്കൈ നേടി’ എന്നും തിരഞ്ഞെടുത്തു. മൂലപാഠം വ്യക്തമാക്കാത്ത തിബ്നിയുടെ മരണകാരണമോ രീതിയോ ചേർത്തിട്ടില്ല.
