id: 1KI.16.29
reference: 1 Kings 16:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ മുപ്പത്തെട്ടാം വർഷത്തിൽ ഒമ്രിയുടെ മകനായ ആഹാബ് ഇസ്രായേലിനു രാജാവായി. ഒമ്രിയുടെ മകനായ ആഹാബ് ശമര്യയിൽ ഇരുപത്തിരണ്ടു വർഷം ഇസ്രായേലിനെ ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: രാജവാഴ്ചാസൂത്രവാക്യത്തിൽ ഈ രൂപം ഭരണകാലം മുഴുവനെയല്ല, സിംഹാസനാരോഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പിന്നാലെയുള്ള ഭരണകാലപ്രസ്താവനയിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: വാഴ്ചയുടെ മുപ്പത്തെട്ടാം വർഷത്തിൽ
  rationale: ആസയുടെ ഭരണകാലത്തെ അടിസ്ഥാനമാക്കിയുള്ള കാലസമന്വയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ക്രമസംഖ്യാർഥം നിലനിർത്തുന്നു.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ
  rationale: എബ്രായ തീയതിനിർണ്ണയസൂത്രത്തിലെ ഭരണാധികാരിയെയും രാജ്യത്തെയും വ്യക്തമാക്കി, മലയാളത്തിൽ ആവശ്യമുള്ള ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: ഭരിച്ചു
  rationale: തുടർന്ന് വരുന്ന ഇരുപത്തിരണ്ടു വർഷത്തെ ഭരണദൈർഘ്യമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സിംഹാസനാരോഹണമല്ല.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെ അർഥവും ശമര്യ രാജകീയ ആസ്ഥാനമായിരുന്നുവെന്ന വാക്യസന്ദർഭവും നേരിട്ട് നൽകുന്നു.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ഇരുപത്തിരണ്ടു വർഷം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം മലയാളത്തിലെ സാധാരണ പ്രയോഗത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: וְ
  choice: വാക്യങ്ങൾ തമ്മിലുള്ള തുടർച്ച മലയാള വാക്യക്രമത്തിലൂടെ
  rationale: എബ്രായത്തിലെ തുടക്കബന്ധകം മുൻവിവരണത്തോടുള്ള കഥാതുടർച്ച സൂചിപ്പിക്കുന്നു. എന്നാൽ ഒറ്റവാക്യ വിവർത്തനത്തിൽ നിർബന്ധിതമായ ‘അപ്പോൾ/കൂടാതെ’ ചേർക്കാതെതന്നെ മലയാളത്തിലെ തുടർച്ച നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജവാഴ്ചാവിവരണശൈലി. ‘രാജാവായി’ എന്നത് സ്ഥാനാരോഹണവും ‘ഭരിച്ചു’ എന്നത് ഭരണദൈർഘ്യവും വേർതിരിക്കുന്നു. പേരുകൾ ‘ആസ’, ‘ആഹാബ്’, ‘ഒമ്രി’, ‘ശമര്യ’ എന്ന പരിചിത മലയാള ബൈബിൾരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
