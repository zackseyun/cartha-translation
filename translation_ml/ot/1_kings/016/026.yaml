  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ml
  text: അവൻ നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ വഴി പൂർണമായും പിന്തുടർന്നു; ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച അവന്റെ പാപങ്ങളും പിന്തുടർന്നു. അവരുടെ വിഗ്രഹങ്ങളാൽ[a] ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേയെ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “അവരുടെ വ്യർഥവസ്തുക്കളാൽ” അഥവാ “അവരുടെ വിലയില്ലാത്ത വസ്തുക്കളാൽ”; വിഗ്രഹങ്ങളെ നിന്ദാസൂചകമായി വിശേഷിപ്പിക്കാൻ ഈ പദം ഉപയോഗിക്കാറുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: നടന്നു
  rationale: ഇവിടെ הלך ശാരീരിക സഞ്ചാരത്തെയല്ല, ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു. ‘നടന്നു’ എന്നത് മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: בְּכָל דֶּרֶךְ
  choice: എല്ലാ വഴികളിലും
  rationale: ഒരാളുടെ പെരുമാറ്റമാതൃകയോടുള്ള സമ്പൂർണ അനുരൂപതയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ബഹുവചനരൂപം ഉപയോഗിച്ചു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകി.
- source_word: וּבְחַטֹּאתָיו
  choice: അവന്റെ പാപങ്ങളിലും
  rationale: മൂലത്തിലെ ബഹുവചനവും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർത്ഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְהַכְעִיס
  choice: കോപിപ്പിച്ചു
  rationale: മുൻപറഞ്ഞ നടത്തത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന ക്രിയാഭാവം സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ പ്രതിപാദിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: എബ്രായ സംയുക്തനാമപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: בְּהַבְלֵיהֶם
  choice: അവരുടെ വിഗ്രഹങ്ങളാൽ
  rationale: הֶבֶל എന്നത് അക്ഷരാർഥത്തിൽ ആവി, വ്യർഥത, വിലയില്ലാത്തത് എന്നൊക്കെയാണെങ്കിലും ഇവിടെ വ്യാജാരാധനയുടെ വസ്തുക്കളെ നിന്ദാസൂചകമായി പരാമർശിക്കുന്നു. സന്ദർഭാർത്ഥം മുഖ്യവാചകത്തിൽ നൽകി, മൂലരൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ, അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: בְּהַבְלֵיהֶם എന്നതിന്റെ ആരാധനാസംബന്ധമായ അർത്ഥം
  choice: അവരുടെ വിഗ്രഹങ്ങളാൽ
  alternative: അവരുടെ വ്യർഥവസ്തുക്കളാൽ
  rationale: സന്ദർഭത്തിൽ യൊരോബെയാമിന്റെ വ്യാജാരാധനയാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ ‘വിഗ്രഹങ്ങൾ’ എന്നത് സൂചന വ്യക്തമാക്കുന്നു; അതേസമയം ‘വ്യർഥത’ എന്ന നിന്ദാസൂചക രൂപകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന ‘വഴി/നടക്കുക’ രൂപകം നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി ‘എല്ലാ വഴികളിലും’ എന്നു നൽകി.
