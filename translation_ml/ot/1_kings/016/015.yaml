  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസയുടെ ഇരുപത്തേഴാം വർഷത്തിൽ, സിമ്രി തിർസയിൽ ഏഴു ദിവസത്തേക്ക് രാജാവായി. അതേസമയം ജനം ഫെലിസ്ത്യരുടേതായ ഗിബ്ബെഥോനെതിരെ[a] പാളയമടിച്ചിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഗിബ്ബെഥോനിൽ.’ സൈനികസന്ദർഭത്തിൽ ‘ഗിബ്ബെഥോനെതിരെ’ എന്നത് ജനം ആ നഗരത്തിനെതിരെ പാളയമടിച്ചിരുന്നുവെന്ന അർഥം നൽകാൻ കൂടുതൽ സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ ഇരുപത്തേഴാം വർഷത്തിൽ
  rationale: രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്ന എബ്രായ കാലനിർണയശൈലി സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: സിമ്രി ... രാജാവായി ഏഴു ദിവസം ഭരിച്ചു
  rationale: מָלַךְ എന്ന ക്രിയയുടെ രാജാവാകുക/ഭരിക്കുക എന്ന അർഥവ്യാപ്തി നിലനിർത്തുകയും പിന്നാലെയുള്ള ഏഴുദിവസത്തെ കാലദൈർഘ്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּתִרְצָה
  choice: തിർസയിൽ
  rationale: സ്ഥലസൂചകമായ בְּ മലയാളത്തിലെ ‘-യിൽ’ കൊണ്ട് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: וְהָעָם חֹנִים
  choice: അപ്പോൾ ജനം ... പാളയമടിച്ചിരിക്കുകയായിരുന്നു
  rationale: പങ്ക്തിയുടെ പശ്ചാത്തലസാഹചര്യം വ്യക്തമാക്കുന്ന വർത്തമാനകൃതന്തത്തിന്റെ തുടർച്ചയായ അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל גִּבְּתוֹן
  choice: ഗിബ്ബെഥോനെതിരെ
  rationale: സൈനികസന്ദർഭത്തിൽ עַל നഗരത്തിനെതിരായ നിലപാടോ ആക്രമണമോ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ ‘എതിരെ’ തെരഞ്ഞെടുത്തു; സ്ഥലസൂചകമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: ഫെലിസ്ത്യരുടെ ഗിബ്ബെഥോൻ
  rationale: לַפְּלִשְׁתִּים സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ മലയാളത്തിലെ സംബന്ധിക പ്രയോഗത്തിലൂടെ സംക്ഷിപ്തമായി നൽകുന്നു.
