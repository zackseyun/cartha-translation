id: 1KI.16.4
reference: 1 Kings 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/מֵּ֤ת לְ/בַעְשָׁא֙ בָּ/עִ֔יר יֹֽאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּ֥ת ל/וֹ֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: ml
  text: ബയെശായോടു ബന്ധപ്പെട്ടവരിൽ[a] പട്ടണത്തിൽ മരിക്കുന്നവനെ നായ്ക്കൾ തിന്നും; അവനോടു ബന്ധപ്പെട്ടവരിൽ വയലിൽ മരിക്കുന്നവനെ ആകാശത്തിലെ പക്ഷികൾ[b] തിന്നും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബയെശായുടേതായവരിൽ’ / ‘ബയെശായുടെ ആളുകളിൽ.’ എബ്രായത്തിലെ ബന്ധസൂചക ഘടന ബയെശായോടു ചേർന്നവരെ—സാധ്യതയനുസരിച്ച് അവന്റെ കുടുംബത്തെയോ രാജവംശത്തെയോ—സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വാനത്തിലെ പക്ഷികൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: മരിക്കുന്നവനെ
  rationale: ഏകവചന കർത്തൃവാചക കൃദന്തം ഇവിടെ പൊതുവായ അർഥത്തിൽ, ബയെശായോടു ബന്ധപ്പെട്ടവരിൽ മരിക്കുന്ന ഏതൊരാളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മരിക്കുന്നവനെ’ എന്നത് സ്വാഭാവികമായി ഈ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְבַעְשָׁא
  choice: ബയെശായോടു ബന്ധപ്പെട്ടവരിൽ
  rationale: ലാമെദ് ഇവിടെ ബന്ധമോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കുന്നു. ബയെശായുടെ കുടുംബത്തെയോ രാജവംശത്തെയോ മാത്രം എന്നു വാചകത്തിൽ വ്യക്തമാക്കാതെ, എബ്രായത്തിലെ വിശാലമായ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: בָּעִיר
  choice: പട്ടണത്തിൽ
  rationale: സ്ഥലസൂചകമായ ബെത്ത് ഉപസർഗത്തോടുകൂടിയ עִיר എന്ന പദത്തിന്റെ നേരിട്ടുള്ള, സ്വാഭാവികമായ വിവർത്തനം.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: നായ്ക്കൾ തിന്നും
  rationale: אָכַל എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘തിന്നുക’ നിലനിർത്തുന്നു; സന്ദർഭം തന്നെ അതിന്റെ ഭീകരത വ്യക്തമാക്കുന്നു.
- source_word: וְהַמֵּת לוֹ
  choice: അവനോടു ബന്ധപ്പെട്ടവരിൽ ... മരിക്കുന്നവനെ
  rationale: സർവനാമം ബയെശായെത്തന്നെ സൂചിപ്പിക്കുന്നു. ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരത നിലനിർത്തിക്കൊണ്ട് ബന്ധത്തിന്റെ പരിധി അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: בַּשָּׂדֶה
  choice: വയലിൽ
  rationale: שָׂדֶה എന്ന പദത്തിന്റെ സാധാരണ അർഥം സ്വീകരിക്കുകയും പട്ടണം/വയൽ എന്ന മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: കൂട്ടാർഥമുള്ള עוֹף എന്ന പദത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനത്തിൽ കൊടുക്കുന്നു; הַשָּׁמָיִם എന്നതിന്റെ ആകാശസൂചനയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ രണ്ട് സമാന്തര ഉപവാക്യങ്ങളും പട്ടണം/വയൽ വൈരുധ്യവും നിലനിർത്തി; ‘കുടുംബം’ അല്ലെങ്കിൽ ‘രാജവംശം’ എന്നു മുഖ്യവാചകത്തിൽ ചേർത്ത് ബന്ധം അമിതമായി നിർവചിച്ചിട്ടില്ല.
