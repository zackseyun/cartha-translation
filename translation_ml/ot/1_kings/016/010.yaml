source:
  edition: WLC
  text: וַ/יָּבֹ֤א זִמְרִי֙ וַ/יַּכֵּ֣/הוּ וַ/יְמִיתֵ֔/הוּ בִּ/שְׁנַת֙ עֶשְׂרִ֣ים וָ/שֶׁ֔בַע לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: ml
  text: അപ്പോൾ സിമ്രി അകത്തു ചെന്ന് അവനെ അടിച്ചു കൊന്നു; യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ ഇരുപത്തിയേഴാം വർഷത്തിലായിരുന്നു അത്. തുടർന്ന് സിമ്രി അവന്റെ സ്ഥാനത്ത് രാജാവായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... അകത്തു ചെന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥവും കഥാഖ്യാനത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന വാവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സ്ഥലം ഏതെന്ന് മൂലപാഠം പറയാത്തതിനാൽ അതു വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: זִמְרִי
  choice: സിമ്രി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וַיַּכֵּהוּ
  choice: അവനെ വെട്ടിവീഴ്ത്തി
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന ആശയം കൊലപാതകസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പിന്നാലെയുള്ള ‘കൊന്നു’ എന്ന ക്രിയയുമായി പ്രവർത്തനക്രമവും വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: וַיְמִיתֵהוּ
  choice: കൊന്നു
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘മരണത്തിനിടയാക്കുക/കൊല്ലുക’ എന്നാണ്; ‘കൊന്നു’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע לְאָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസയുടെ വാഴ്ചയുടെ ഇരുപത്തിയേഴാം വർഷത്തിലായിരുന്നു ഇത്
  rationale: രാജവാഴ്ചയുടെ വർഷം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; לְ എന്നത് ആസയുടെ വാഴ്ചയെ കാലനിർണ്ണയത്തിന്റെ മാനദണ്ഡമാക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: തുടർന്ന് ... രാജാവായി
  rationale: מלך ഇവിടെ ‘രാജാവാകുക/ഭരിക്കാൻ തുടങ്ങുക’ എന്ന സ്ഥാനാരോഹണാർഥത്തിൽ വരുന്നു; תחתיו അതിനെ വ്യക്തമാക്കുന്നതിനാൽ ‘രാജാവായി’ സ്വാഭാവികമാണ്.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: രാജകീയ പിൻഗാമിത്വസന്ദർഭത്തിൽ ‘അവന്റെ പകരം/സ്ഥാനത്ത്’ എന്ന അർഥം നൽകുന്നു; ‘അവന്റെ സ്ഥാനത്ത്’ മൂലപ്രയോഗത്തോട് അടുത്തും വ്യക്തവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രാഖ്യാനശൈലി. മൂലപാഠത്തിലെ മൂന്ന് തുടർച്ചയായ സംഭവങ്ങൾ—പ്രവേശിക്കൽ, പ്രഹരിക്കൽ, കൊല്ലൽ—വ്യക്തമായി നിലനിർത്തി. ആദ്യ വാക്യത്തിലെ പുരുഷസർവനാമത്തിന്റെ പൂർവപദം മുൻവാക്യത്തിൽ ഉള്ളതിനാൽ മൂലപാഠംപോലെ ‘അവനെ’ എന്നു തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
