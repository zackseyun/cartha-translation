  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י זִמְרִ֔י וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: സിമ്രിയുടെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ നടത്തിയ ഗൂഢാലോചനയും[a] ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ ഗൂഢാലോചന നടത്തിയ അവന്റെ ഗൂഢാലോചന.’ ഊന്നലിനായി എബ്രായത്തിൽ ഒരേ മൂലത്തിൽനിന്നുള്ള നാമവും ക്രിയയും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: സിമ്രിയുടെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വാക്കുകൾ മാത്രമല്ല, രാജാവിന്റെ പ്രവൃത്തികളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. 'ശേഷിച്ച പ്രവൃത്തികൾ' സ്വാഭാവികമായി ഈ പതിവുശൈലി നിലനിർത്തുന്നു.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: അവൻ നടത്തിയ ഗൂഢാലോചനയും
  rationale: קֶשֶׁר രാജാവിനെതിരായ രാഷ്ട്രീയ ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു; 3-ാം പുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയം 'അവൻ നടത്തിയ' എന്നതിലൂടെ വ്യക്തമാണ്. മൂലത്തിലെ സമമൂലപദ ആവർത്തനം മലയാളത്തിൽ അക്ഷരാർഥമായി പകർത്തുന്നത് അസ്വാഭാവികമായതിനാൽ അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: ഉത്തരം 'അതെ' എന്ന് പ്രതീക്ഷിക്കുന്ന മൂലത്തിലെ നിഷേധരൂപത്തിലുള്ള അലങ്കാരചോദ്യം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: ഈ രാജകീയ രേഖാസൂത്രത്തിൽ סֵפֶר דִּבְרֵי הַיָּמִים ഒരു ചരിത്രവൃത്താന്തരേഖയെ സൂചിപ്പിക്കുന്നു. 'ദിനവൃത്താന്തപുസ്തകം' പദരൂപവും ഗ്രന്ഥസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: ഇവിടെ לְ ഗ്രന്ഥശീർഷകത്തിലെ ബന്ധസൂചകപ്രയോഗമാണ്; അതിനാൽ മലയാളത്തിലെ ഉടമസ്ഥ/ബന്ധവിഭക്തി യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രാജഭരണവിവരണത്തിന്റെ പതിവുശൈലിയും മൂലത്തിലെ അലങ്കാരചോദ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
