source:
  edition: WLC
  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: ml
  text: അവൻ ചെയ്ത പാപങ്ങൾ നിമിത്തം—യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചതിനാലും, യൊരോബെയാമിന്റെ വഴിയിലും ഇസ്രായേലിനെ പാപം ചെയ്യിക്കാനായി അവൻ ചെയ്ത പാപത്തിലും നടന്നതിനാലും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: നിമിത്തം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ന്യായവിധിക്ക് കാരണമോ അടിസ്ഥാനമോ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: അവൻ ചെയ്ത പാപങ്ങൾ
  rationale: ‘അവൻ പാപം ചെയ്ത അവന്റെ പാപം’ എന്ന സമാനധാതുപ്രയോഗത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ പാപപ്രവൃത്തികളുടെ സമാഹാരാർഥം ഉള്ളതിനാൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മ പ്രവർത്തിച്ചതിനാൽ
  rationale: തിന്മ ചെയ്യുക എന്ന ക്രിയാർഥവും ദൈവിക വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന ‘കണ്ണുകളിൽ’ എന്ന ഹീബ്രു ശൈലിയുടെ അർഥവും വ്യക്തവും മാന്യവുമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ വഴിയിൽ നടന്നതിനാൽ
  rationale: ജീവിതരീതിയെയും പെരുമാറ്റമാതൃകയെയും സൂചിപ്പിക്കുന്ന ‘വഴിയിൽ നടക്കുക’ എന്ന ഉറവിടരൂപകം നിലനിർത്തുന്നു.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കൊണ്ട് പാപം ചെയ്യിച്ച പാപത്തിൽ പങ്കുചേർന്നതിനാൽ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘ഇസ്രായേലിനെ പാപം ചെയ്യിക്കുക’ നിലനിർത്തിക്കൊണ്ട്, בְ എന്ന മുൻപ്രത്യയവും യൊരോബെയാമിന്റെ പാപമാർഗത്തിൽ സിമ്രി നടന്നുവെന്ന സന്ദർഭബന്ധവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു.
- issue: അവസാനത്തെ ‘അവന്റെ പാപം’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: യൊരോബെയാമിന്റെ പാപത്തിൽ സിമ്രി പങ്കുചേർന്നു എന്ന സന്ദർഭാർഥം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കി
  alternative: ‘അവൻ ചെയ്ത തന്റെ പാപം’ എന്ന് സിമ്രിയുടെ സ്വന്തം പ്രവൃത്തിയായി മാത്രം വായിക്കുക
  rationale: സമീപവാക്യഘടനയും രാജാക്കന്മാരിലെ ആവർത്തിത ന്യായവിധിസൂത്രവും യൊരോബെയാം ഇസ്രായേലിനെ പാപത്തിലാക്കിയ പാപത്തെ സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും ഹീബ്രുവിലെ പുരുഷസർവനാമത്തിന്റെ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. പ്രധാനവാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന കാരണവാക്യമാണെന്നതിനാൽ മലയാളത്തിൽ പൂർണ്ണവാക്യമായി വായിക്കാനായി ‘ഇതു സംഭവിച്ചു’ ചേർത്തു; ഡാഷുകൾ കാരണംവിവരണം വേർതിരിക്കുന്നു. ബൈബിൾ മലയാളത്തിൽ പരിചിതമായ ‘പാപം’, ‘തിന്മ’, ‘വഴിയിൽ നടക്കുക’ എന്നീ പദപ്രയോഗങ്ങൾ നിലനിർത്തി.
