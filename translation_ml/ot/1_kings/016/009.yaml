source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: ml
  text: അവന്റെ ദാസനും രഥസേനയുടെ പകുതിക്കു സേനാനായകനുമായ സിമ്രി അവനെതിരെ ഗൂഢാലോചന നടത്തി. അവൻ തിർസയിൽ, തിർസയിലെ രാജഗൃഹത്തിന്റെ ചുമതലക്കാരനായ[b] അർസായുടെ വീട്ടിൽ മത്തനാകുന്നതുവരെ കുടിച്ചുകൊണ്ടിരിക്കെയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുടിച്ച് മത്തനായിക്കൊണ്ടിരിക്കെ.’ കുടിക്കുന്ന പ്രവൃത്തിയും അതിന്റെ ഫലമായ മത്തും എബ്രായ പ്രയോഗം സജീവമായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘രാജഗൃഹത്തിന്റെ ചുമതലക്കാരൻ’ എന്നത് രാജഗൃഹത്തിന്റെയോ കൊട്ടാരഭരണത്തിന്റെയോ ചുമതല വഹിച്ചിരുന്ന ഒരു ഉദ്യോഗസ്ഥന്റെ പദവിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: അവനെതിരെ ഗൂഢാലോചന നടത്തി
  rationale: രാജകീയ വിവരണത്തിൽ קשר + עַל ഒരു ഭരണാധികാരിക്കെതിരായ രാഷ്ട്രീയ ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം അർത്ഥവും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: עַבְדּוֹ
  choice: അവന്റെ ദാസൻ
  rationale: עבד എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ദാസൻ’ എന്നാണ്; രാജസഭാ പശ്ചാത്തലത്തിൽ ഉദ്യോഗസ്ഥനെയും സൂചിപ്പിക്കാമെങ്കിലും മൂലപദത്തിന്റെ വിശാലത നിലനിർത്താൻ ‘ദാസൻ’ സ്വീകരിച്ചു.
- source_word: זִמְרִי
  choice: സിമ്രി
  rationale: വ്യക്തിനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: രഥസേനയുടെ പകുതിയുടെ അധിപൻ
  rationale: רכב ഇവിടെ രഥങ്ങളടങ്ങിയ സൈനികവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘രഥസേന’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ കൂട്ടായ അർത്ഥം നൽകുന്നു. שַׂר എന്നതിന് ഔദ്യോഗിക നേതൃത്വപദവിയെ സൂചിപ്പിക്കുന്ന ‘അധിപൻ’ ഉപയോഗിച്ചു.
- source_word: בְתִרְצָה
  choice: തിര്‍സയിൽ
  rationale: സ്ഥലനാമം മലയാള ലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകി.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: മത്താകുവോളം കുടിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന കുടിയും അതിന്റെ ഫലമായ മത്തും ഒരുമിച്ചു പ്രകടമാക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സജീവത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּית אַרְצָא
  choice: അർസയുടെ വീട്ടിൽ
  rationale: בית + വ്യക്തിനാമം എന്ന ഘടനയെ ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: രാജഗൃഹത്തിന്റെ ചുമതലക്കാരൻ
  rationale: ഈ എബ്രായ പ്രയോഗം രാജഗൃഹത്തിന്റെയോ കൊട്ടാരഭരണത്തിന്റെയോ ചുമതലയുള്ള ഔദ്യോഗിക പദവിയെ സൂചിപ്പിക്കുന്നു; പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കി പദവിയുടെ അർത്ഥം വ്യക്തമാക്കി.
- source_word: בְּתִרְצָה
  choice: അവിടത്തെ
  rationale: എബ്രായത്തിലെ തിര്‍സ എന്ന സ്ഥലനാമത്തിന്റെ ആവർത്തനം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാനും അതേ സ്ഥലബന്ധം നിലനിർത്താനും രണ്ടാം പരാമർശം ‘അവിടത്തെ’ എന്നു നൽകി.
