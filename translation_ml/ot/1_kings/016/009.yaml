translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; സാഹചര്യബന്ധം ‘അപ്പോൾ’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] അടയാളം പേരിനുശേഷം തെറ്റായി നിന്നിരുന്നുവെന്നു തോന്നുന്നതിനാൽ, അതിന്റെ കുറിപ്പിനൊത്ത മദ്യപാനപ്രയോഗത്തിനുശേഷമാണ് ചേർത്തത്.
