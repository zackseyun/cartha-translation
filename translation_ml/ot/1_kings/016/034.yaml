  - severity: medium
    issue: “വിലയായി കൊടുത്തുകൊണ്ട്” over-specifies the sons’ role.
    rationale: The Hebrew literally uses ב with Abiram and Segub. In context it strongly conveys loss at the cost of the sons, but it does not state that Hiel gave them as a payment or sacrifice. The Malayalam phrase can imply such a deliberate transaction.
  - severity: low
