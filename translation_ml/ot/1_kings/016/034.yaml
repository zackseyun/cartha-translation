  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: ml
  text: അവന്റെ കാലത്ത് ബേഥേല്യനായ ഹീയേൽ യെരീഹോ പുനർനിർമിച്ചു[a]. തന്റെ ആദ്യജാതനായ അബീരാമിന്റെ നഷ്ടത്തിൽ അവൻ അതിന്റെ അടിത്തറയിട്ടു; തന്റെ ഏറ്റവും ഇളയമകനായ സെഗൂബിന്റെ നഷ്ടത്തിൽ അതിന്റെ കവാടങ്ങൾ സ്ഥാപിച്ചു[b]. നൂന്റെ മകനായ യോശുവ മുഖാന്തരം യഹോവ പറഞ്ഞ വചനപ്രകാരം തന്നേ ഇത് സംഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘യെരീഹോ നിർമിച്ചു.’ മുമ്പ് നശിപ്പിക്കപ്പെട്ട നഗരത്തെ വീണ്ടും പണിത സന്ദർഭം കണക്കിലെടുത്താണ് ‘പുനർനിർമിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ ആദ്യജാതനായ അബീരാമിൽ/അബീരാമോടുകൂടെ ... തന്റെ ഏറ്റവും ഇളയമകനായ സെഗൂബിൽ/സെഗൂബോടുകൂടെ.’ യോശുവ 6:26-ലെ വചനത്തിന്റെ പ്രതിധ്വനിയിൽ, ഈ പുനർനിർമാണം പുത്രന്മാരുടെ നഷ്ടത്തിന്റെ വിലയ്ക്കാണ് നടന്നതെന്ന അർഥം ശക്തമാണ്. എന്നാൽ ഹീബ്രു വാക്യം അവരുടെ മരണത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: അവന്റെ കാലത്ത്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ രാജാവിന്റെ കാലഘട്ടത്തെയാണ് ഈ സ്വാഭാവിക മലയാളപ്രയോഗം സൂചിപ്പിക്കുന്നത്; അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെ നാളുകളിൽ’ എന്നതിനെക്കാൾ ആധുനികമായി വ്യക്തമാണ്.
- source_word: בָּנָה
  choice: പുനർനിർമിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘നിർമിച്ചു’ എന്നാണെങ്കിലും, മുമ്പ് നശിപ്പിക്കപ്പെട്ട യെരീഹോയെ വീണ്ടും പണിത സന്ദർഭാർഥം ‘പുനർനിർമിച്ചു’ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: ബേഥേല്യനായ ഹീയേൽ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന gentilicial രൂപം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: തന്റെ മൂത്തമകനായ അബീരാമിനെ വിലയായി കൊടുത്തുകൊണ്ട്
  rationale: ב പ്രയോഗത്തിന്റെ കൃത്യബന്ധം അസ്പഷ്ടമായിരിക്കുമ്പോഴും യോശുവ 6:26-ലേക്കുള്ള സൂചനയിൽ നിർമാണത്തിന് മകന്റെ നഷ്ടം വിലയായെന്ന അർഥം ശക്തമാണ്; അടിക്കുറിപ്പിൽ അക്ഷരാർഥത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- source_word: יִסְּדָהּ
  choice: അതിന്റെ അടിത്തറയിട്ടു
  rationale: നഗരനിർമാണസന്ദർഭത്തിലെ יסד എന്ന ക്രിയയുടെ നിർദിഷ്ടാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: തന്റെ ഇളയമകനായ സെഗൂബിനെ വിലയായി കൊടുത്തുകൊണ്ട്
  rationale: മുൻ സമാന്തരവാക്യത്തിലെ ב പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; צעיר കുടുംബത്തിലെ ജനനക്രമത്തിൽ ‘ഇളയമകൻ’ എന്നാണ്.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: അതിന്റെ കവാടങ്ങൾ സ്ഥാപിച്ചു
  rationale: דלתות അക്ഷരാർഥത്തിൽ വാതിൽപ്പാളികളാകാമെങ്കിലും നഗരസന്ദർഭത്തിൽ ‘കവാടങ്ങൾ’ സ്വാഭാവികമാണ്; הציב-ന് ‘സ്ഥാപിച്ചു’ യോജിക്കുന്നു.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר בְּיַד
  choice: യഹോവ ... മുഖാന്തരം അരുളിച്ചെയ്ത വചനം
  rationale: ביד എന്നത് പ്രവാചക മധ്യസ്ഥത സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഖാന്തരം’ എന്നു നൽകി; ദൈവവചനത്തിന് യോജിച്ച മാന്യമായ മലയാളമായി ‘അരുളിച്ചെയ്ത’ ഉപയോഗിച്ചു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: പിതൃനാമസൂചന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഹീയേലിന്റെ പുത്രന്മാരെ സംബന്ധിച്ച ശാപനിവൃത്തിയുടെ സ്വഭാവം
  choice: യെരീഹോയുടെ പുനർനിർമാണത്തിന് ഹീയേലിന്റെ മൂത്തമകനും ഇളയമകനും നഷ്ടമായത് വിലയായിരുന്നുവെന്നും അതിലൂടെ യഹോവയുടെ വചനം നിറവേറിയെന്നും മുഖ്യപാഠം സൂചിപ്പിക്കുന്നു.
  alternative: ഹീബ്രുവിലെ ב അക്ഷരാർഥത്തിൽ ‘അബീരാമിൽ/അബീരാമോടുകൂടെ ... സെഗൂബിൽ/സെഗൂബോടുകൂടെ’ എന്നാകാം; നിർമാണഘട്ടങ്ങളും പുത്രന്മാരും തമ്മിലുള്ള ബന്ധം മാത്രം നേരിട്ട് പ്രസ്താവിക്കുന്നു എന്നു വായിക്കാവുന്നതാണ്.
  rationale: യോശുവ 6:26-ന്റെ പ്രതിധ്വനി പുത്രന്മാരുടെ മരണത്തിലൂടെയുള്ള ശാപനിവൃത്തി ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഹീബ്രു വ്യാകരണം മരണത്തെ നേരിട്ട് പറയാത്തതിനാൽ ആ ഭാഷാപരമായ പിരിമുറുക്കം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: כִּדְבַר എന്ന ബന്ധത്തിന്റെ അവതരണം
  choice: ‘അങ്ങനെ ... വചനം നിറവേറി’
  alternative: ‘... വചനപ്രകാരം’
  rationale: സംഭവം മുമ്പ് പ്രസ്താവിച്ച ദൈവവചനത്തോട് ഒത്തുനിൽക്കുന്നുവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പുതിയ കാരണബന്ധമോ ദൈവശാസ്ത്രപരമായ വിശദീകരണമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. വ്യക്തിനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകി. ‘വിലയായി കൊടുത്തുകൊണ്ട്’ സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോൾ മൂലത്തിലെ വ്യാകരണപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു; യഹോവ എന്ന ദൈവനാമം മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തി.
