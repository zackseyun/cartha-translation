    rationale: “അങ്ങനെ ... നിറവേറി” conveys fulfillment but restructures the clause and slightly foregrounds a conclusion not stated in that exact form. A direct “യഹോവ ... പറഞ്ഞ വചനപ്രകാരം” better preserves the Hebrew syntax and sense.
  revised_text: അവന്റെ കാലത്ത് ബേഥേല്യനായ ഹീയേൽ യെരീഹോ പുനർനിർമിച്ചു[a]. തന്റെ ആദ്യജാതനായ അബീരാമിന്റെ നഷ്ടത്തിൽ അവൻ അതിന്റെ അടിത്തറയിട്ടു; തന്റെ ഏറ്റവും ഇളയമകനായ സെഗൂബിന്റെ നഷ്ടത്തിൽ അതിന്റെ കവാടങ്ങൾ സ്ഥാപിച്ചു[b]. നൂന്റെ മകനായ യോശുവ മുഖാന്തരം യഹോവ പറഞ്ഞ വചനപ്രകാരം തന്നേ ഇത് സംഭവിച്ചു.
