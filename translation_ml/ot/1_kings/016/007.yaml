revisions:
- from: കൂടാതെ, ഹനാനിയുടെ മകനായ യേഹൂ പ്രവാചകൻ മുഖാന്തരം യഹോവയുടെ വചനം ബയെശായ്ക്കും അവന്റെ ഭവനത്തിനും എതിരായി വന്നു. യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതെല്ലാം ചെയ്ത്, തന്റെ കൈകളുടെ പ്രവൃത്തികളാൽ അവനെ കോപിപ്പിക്കുകയും യൊരോബെയാമിന്റെ ഭവനംപോലെ ആയിത്തീരുകയും ചെയ്തതിനാലും, അതിനെ തകർത്തുകളഞ്ഞതിനാലും[a] ആയിരുന്നു അത്.
  to: കൂടാതെ, ഹനാനിയുടെ മകനായ യേഹൂ പ്രവാചകൻ മുഖാന്തരം, യഹോവയുടെ വചനം ബയെശായ്ക്കും അവന്റെ ഭവനത്തിനും എതിരായി വന്നു; യഹോവയുടെ ദൃഷ്ടിയിൽ അവൻ ചെയ്ത സകല തിന്മ നിമിത്തവും, തന്റെ കൈകളുടെ പ്രവൃത്തികളാൽ യഹോവയെ കോപിപ്പിച്ചുകൊണ്ട് യൊരോബെയാമിന്റെ ഭവനംപോലെ ആയിത്തീർന്നതിനാലും, അതിനെ നശിപ്പിച്ചതിനാലും[a] ആയിരുന്നു അത്.
  rationale: The revision preserves every source-level element and the existing footnote ambiguity. It clarifies that the enumerated evils are the reasons the word of Yahweh came against Baasha and his house, explicitly identifies Yahweh as the one angered, and uses a natural Malayalam expression for the destruction of the house/dynasty.
