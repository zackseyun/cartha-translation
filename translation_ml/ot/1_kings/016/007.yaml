source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: ml
  text: കൂടാതെ, ഹനാനിയുടെ മകനായ യേഹൂ പ്രവാചകൻ മുഖാന്തരം, യഹോവയുടെ വചനം ബയെശായ്ക്കും അവന്റെ ഭവനത്തിനും എതിരായി വന്നു; യഹോവയുടെ ദൃഷ്ടിയിൽ അവൻ ചെയ്ത സകല തിന്മ നിമിത്തവും, തന്റെ കൈകളുടെ പ്രവൃത്തികളാൽ യഹോവയെ കോപിപ്പിച്ചുകൊണ്ട് യൊരോബെയാമിന്റെ ഭവനംപോലെ ആയിത്തീർന്നതിനാലും, അതിനെ നശിപ്പിച്ചതിനാലും[a] ആയിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ കൊന്നതിനാലും.” എബ്രായത്തിലെ കർമസർവനാമം പുല്ലിംഗ ഏകവചനമാണ്. അത് യൊരോബെയാമിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കാം; എന്നാൽ സന്ദർഭത്തിൽ യൊരോബെയാമിന്റെ ഭവനത്തെയോ രാജവംശത്തെയോ ഒരു കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: മുൻവിധിപ്രസ്താവനയോടുള്ള തുടർച്ചയും കൂട്ടിച്ചേർക്കലും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַד
  choice: മുഖാന്തരം
  rationale: പ്രവാചകനായ യേഹൂ ദൈവിക സന്ദേശത്തിന്റെ ഇടനിലക്കാരനാണെന്ന ഏജൻസി അർത്ഥം നൽകുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹോവയുടെ വചനം
  rationale: പ്രവാചകസന്ദേശത്തിനുള്ള സ്ഥിരമായ എബ്രായ പ്രയോഗവും യഹോവ എന്ന ഉടമ്പടിനാമവും നിലനിർത്തുന്നു.
- source_word: אֶל ... וְאֶל
  choice: '...യ്ക്കും ...നും എതിരായി'
  rationale: വിധിപ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ אֶל എന്നതിന് ഇവിടെ പ്രതികൂല ലക്ഷ്യഭാവമുണ്ട്.
- source_word: בֵּיתוֹ
  choice: അവന്റെ ഭവനം
  rationale: കുടുംബത്തെയും രാജവംശത്തെയും ഉൾക്കൊള്ളാവുന്ന എബ്രായ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: עַל כָּל הָרָעָה
  choice: തിന്മയായതെല്ലാം ... ചെയ്തതിനാൽ
  rationale: עַל ഇവിടെ വിധിയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവിക വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְהַכְעִיסוֹ
  choice: അവനെ കോപിപ്പിക്കുകയും
  rationale: ഹിഫീൽ ക്രിയയുടെ കാരണാത്മക അർത്ഥം നിലനിർത്തുന്നു; സർവനാമം യഹോവയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: തന്റെ കൈകളുടെ പ്രവൃത്തികളാൽ
  rationale: സാധാരണയായി പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ എബ്രായ ശൈലി അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: യൊരോബെയാമിന്റെ ഭവനംപോലെ ആയിത്തീരുകയും
  rationale: ബയെശായുടെ ഭവനം യൊരോബെയാമിന്റെ ഭവനത്തോട് ദുഷ്ടതയിലും വിധിയിലും സാദൃശ്യം പ്രാപിച്ച ഫലം വ്യക്തമാക്കുന്നു.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: അതിനെ തകർത്തുകളഞ്ഞതിനാലും
  rationale: സന്ദർഭത്തിൽ ഏകവചന സർവനാമം യൊരോബെയാമിന്റെ ഭവനത്തെ ഒരു കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത; എങ്കിലും മൂലത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ ഉടമ്പടിനാമമായി നൽകുന്നു.
- issue: הִכָּה אֹתוֹ എന്നതിലെ ഏകവചന കർമസർവനാമത്തിന്റെ സൂചന
  choice: യൊരോബെയാമിന്റെ ഭവനത്തെ കൂട്ടായ ഏകകമായി സൂചിപ്പിക്കുന്ന ‘അതിനെ’
  alternative: യൊരോബെയാമിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന ‘അവനെ’
  rationale: അടുത്തുള്ള ആശയം യൊരോബെയാമിന്റെ ഭവനമായതിനാലും ബയെശാ ആ രാജവംശത്തെ നശിപ്പിച്ചതാണ് ചരിത്രസന്ദർഭമായതിനാലും കൂട്ടായ വായനയ്ക്ക് മുൻഗണന നൽകി; പക്ഷേ വ്യക്തിപരമായ വായന സാധ്യമെന്നത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചക-വിധി ശൈലി സ്വീകരിച്ചു. ‘ഭവനം’, ‘വചനം’, ‘ദൃഷ്ടിയിൽ’ എന്നീ പരിചിതമായ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
