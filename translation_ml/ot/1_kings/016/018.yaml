id: 1KI.16.18
reference: 1 Kings 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: ml
  text: പട്ടണം പിടിക്കപ്പെട്ടെന്നു സിമ്രി കണ്ടപ്പോൾ, അവൻ രാജഗൃഹത്തിന്റെ കോട്ടകൊത്തളത്തിലേക്കു കടന്നു. പിന്നെ അവൻ രാജഗൃഹത്തിനു തീകൊളുത്തി, അതിന്റെ തീയിൽ മരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: കണ്ടപ്പോൾ
  rationale: כְּ + infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു; സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נִלְכְּדָה הָעִיר
  choice: പട്ടണം പിടിക്കപ്പെട്ടെന്നു
  rationale: לכד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം പട്ടണം ശത്രുവിന്റെ അധീനതയിലായതിനെ സൂചിപ്പിക്കുന്നു; ഭൂതകാലസന്ദർഭം മലയാളത്തിലെ ഈ ഘടനയിൽ സ്വാഭാവികമാണ്.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: രാജഗൃഹത്തിലെ കോട്ട
  rationale: אַרְמוֹן ഉറപ്പുള്ള രാജകീയ കെട്ടിടത്തെയോ കോട്ടയെയോ സൂചിപ്പിക്കാം. തുടർന്ന് בֵּית הַמֶּלֶךְ വരുന്നതിനാൽ ‘രാജഗൃഹത്തിലെ കോട്ട’ രണ്ടു പദങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: וַיִּשְׂרֹף עָלָיו אֶת בֵּית מֶלֶךְ בָּאֵשׁ
  choice: രാജഗൃഹത്തിനു തനിക്കു ചുറ്റും തീ കൊളുത്തി
  rationale: ‘തന്റെമേൽ രാജഗൃഹം തീകൊണ്ട് കത്തിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം, കെട്ടിടത്തിനുള്ളിൽ നിന്നുകൊണ്ട് അതിനു തീ കൊളുത്തിയുള്ള സ്വയംനാശമാണ്. ‘തനിക്കു ചുറ്റും’ എന്നത് עָלָיו-യുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കുറിപ്പിൽ അക്ഷരാർഥവും സൂചിപ്പിക്കുന്നു.
- source_word: וַיָּמֹת
  choice: മരിച്ചു
  rationale: മുൻപ്രവൃത്തിയുടെ ഫലം വ്യക്തമാകുന്ന ലളിതമായ ആഖ്യാനതുടർച്ച.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ‘പട്ടണം’, ‘രാജഗൃഹം’, ‘കോട്ട’ എന്നീ വ്യത്യസ്ത ഘടകങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കിയെങ്കിലും അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
