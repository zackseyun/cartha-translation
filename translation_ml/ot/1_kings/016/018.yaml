revisions:
- from: പട്ടണം പിടിക്കപ്പെട്ടെന്നു സിമ്രി കണ്ടപ്പോൾ, അവൻ രാജഗൃഹത്തിലെ കോട്ടയ്ക്കുള്ളിൽ[a] കടന്നു. പിന്നെ രാജഗൃഹത്തിനു തനിക്കു ചുറ്റും തീ കൊളുത്തി[b] മരിച്ചു.
  to: പട്ടണം പിടിക്കപ്പെട്ടെന്നു സിമ്രി കണ്ടപ്പോൾ, അവൻ രാജഗൃഹത്തിന്റെ കോട്ടകൊത്തളത്തിലേക്കു കടന്നു. പിന്നെ അവൻ രാജഗൃഹത്തിനു തീകൊളുത്തി, അതിന്റെ തീയിൽ മരിച്ചു.
  rationale: 'The revision replaces an unidiomatic and syntactically unclear expression with natural Malayalam: Zimri set the royal residence on fire and died in its fire. This retains the Hebrew narrative’s self-destructive action and result without adding a doctrinal or speculative interpretation. “രാജഗൃഹത്തിന്റെ കോട്ടകൊത്തളത്തിലേക്കു” more directly represents the royal fortified structure denoted by אַרְמוֹן while retaining the subsequent repeated reference to the royal house.'
