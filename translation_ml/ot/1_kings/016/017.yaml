  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: ml
  text: അപ്പോൾ ഒമ്രിയും അവനോടുകൂടെയുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേലും ഗിബ്ബെഥോനിൽനിന്ന് കയറിച്ചെന്ന് തിർസയെ ഉപരോധിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന അടിസ്ഥാന ചലനാർഥം നിലനിർത്തുന്നു; ഭൂപ്രകൃതിയെയോ സൈനിക മുന്നേറ്റത്തെയോ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: עָמְרִי
  choice: ഒമ്രി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: അവനോടുകൂടെയുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേലും
  rationale: സൈന്യം എന്ന വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതെ, ഇസ്രായേൽ എന്ന കൂട്ടായ ദേശീയപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: מִגִּבְּתוֹן
  choice: ഗിബ്ബെഥോനിൽനിന്ന്
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; מן എന്ന പൂർവപ്രത്യയത്തിന്റെ അർഥം ‘നിന്ന്’ എന്നു നൽകി.
- source_word: וַיָּצֻרוּ
  choice: ഉപരോധിച്ചു
  rationale: צור എന്ന ക്രിയയുടെ സൈനികസന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: עַל
  choice: തിർസയെ
  rationale: ഉപരോധിക്കുക എന്ന മലയാളക്രിയയുടെ ലക്ഷ്യം പ്രത്യക്ഷകർമമായി അടയാളപ്പെടുത്തുന്നത് സ്വാഭാവികമാണ്.
- source_word: תִּרְצָה
  choice: തിർസ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
