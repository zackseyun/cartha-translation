source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: ഒമ്രിയുടെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്തതും, അവൻ പ്രകടമാക്കിയ പരാക്രമവും[a] ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[b] എഴുതിയിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ വീരപ്രവൃത്തികളും.’ എബ്രായത്തിലെ גְּבוּרָה എന്ന പദം ശക്തിയെയോ പരാക്രമത്തെയോ, അത്തരം ശക്തി വെളിപ്പെടുത്തുന്ന പ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽ രാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം’ എന്നത് രാജകീയ സംഭവരേഖകളുടെ ഒരു സ്രോതസ്സിനെയാണ് സൂചിപ്പിക്കുന്നത്; ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകത്തെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: ഒമ്രിയുടെ ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ ഈ പ്രയോഗം ഒരു രാജാവിന്റെ രേഖപ്പെടുത്തിയ പ്രവൃത്തികളിൽ ശേഷിക്കുന്നവയെ സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തികൾ’ എന്നത് പദത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്ത കാര്യങ്ങളും
  rationale: എബ്രായത്തിലെ അനുബന്ധവാക്യം വേറിട്ട ഘടകമായി നിലനിർത്തുകയും ആവർത്തനം അനാവശ്യമായി നീക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: അവൻ പ്രകടമാക്കിയ പരാക്രമവും
  rationale: גְּבוּרָה ശക്തിയെയോ അതു വെളിപ്പെടുത്തുന്ന വീരപ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം. ‘പ്രകടമാക്കിയ പരാക്രമം’ നാമപദത്തെയും തുടർന്നുള്ള ക്രിയാപ്രയോഗത്തെയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ വാചാടോപചോദ്യത്തിന്റെ ബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: ഇത് ഇസ്രായേൽരാജാക്കന്മാരെ സംബന്ധിച്ച രാജകീയ വാർഷികരേഖയുടെ ശീർഷകമാണ്. ‘പുസ്തകത്തിൽ’ എന്നത് עַל־סֵפֶר എന്നതിന്റെ സന്ദർഭോചിതമായ മലയാളപ്രയോഗമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ വാചാടോപചോദ്യം നിലനിർത്തി; גְּבוּרָה എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
