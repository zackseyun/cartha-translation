translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വാചാടോപചോദ്യം നിലനിർത്തി. ഉറവിടത്തിലെ ആരംഭസംയോജകത്തിന് മലയാളത്തിൽ അനാവശ്യമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുചിഹ്നം ‘Elah’ എന്ന പേരിനു ശേഷമായിരുന്നെങ്കിലും അടിക്കുറിപ്പ് דִּבְרֵי הַיָּמִים എന്ന പ്രയോഗത്തിന്റെ പദപര്യായത്തെക്കുറിച്ചുള്ളതാകയാൽ, മലയാള മുഖ്യപാഠത്തിൽ പ്രസക്തമായ ‘ദിനവൃത്താന്തപുസ്തകത്തിൽ’ എന്നതിനു ശേഷമാണ് [a] വെച്ചത്.
