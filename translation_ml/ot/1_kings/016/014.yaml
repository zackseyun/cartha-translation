  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: ഏലായുടെ മറ്റുള്ള പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിരിക്കുന്നില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽരാജാക്കന്മാരുടെ വാർഷികരേഖയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: ഏലായുടെ മറ്റുള്ള പ്രവൃത്തികളും
  rationale: יֶתֶר എന്നത് ‘ശേഷിക്കുന്നവ/മറ്റുള്ളവ’ എന്നും, ഈ രാജവൃത്താന്തസൂത്രത്തിൽ דִּבְרֵי എന്നത് രാജാവിന്റെ പ്രവൃത്തികളെക്കുറിച്ചുള്ള രേഖ എന്നും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായി ‘മറ്റുള്ള പ്രവൃത്തികൾ’ എന്നു നൽകി.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: עָשָׂה എന്ന പൊതുവായ ക്രിയയുടെ വ്യാപ്തി ചുരുക്കാതെ ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: എഴുതിയിരിക്കുന്നില്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഹീബ്രു വാചാടോപചോദ്യത്തിന്റെ രൂപവും രേഖപ്പെടുത്തിയ നിലയെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר
  choice: പുസ്തകത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘പുസ്തകം/ചുരുൾമേൽ’ എന്നാണെങ്കിലും ഒരു രേഖയിലെ ഉള്ളടക്കത്തെക്കുറിച്ച് പറയുമ്പോൾ മലയാളത്തിൽ ‘പുസ്തകത്തിൽ’ എന്നതാണ് സ്വാഭാവികം.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: ഇത് ഇസ്രായേൽരാജാക്കന്മാരെ സംബന്ധിച്ച ഔദ്യോഗിക കാലാനുക്രമരേഖയുടെ ശീർഷകസൂത്രമാണ്. ‘ദിനവൃത്താന്തം’ മൂലപദത്തിന്റെ രൂപകവും പരമ്പരാഗത ചരിത്രരേഖാഭാവവും നിലനിർത്തുന്നു.
