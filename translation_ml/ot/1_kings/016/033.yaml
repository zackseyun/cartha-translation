  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: ml
  text: ആഹാബ് അശേരയെ[a] ഉണ്ടാക്കി. ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയെ കോപിപ്പിക്കാൻ, തനിക്കുമുമ്പുണ്ടായിരുന്ന എല്ലാ ഇസ്രായേൽ രാജാക്കന്മാരെക്കാളും അധികമായി ആഹാബ് പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അശേരാസ്തംഭം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായയിലെ אֲשֵׁרָה എന്ന പദം അശേരാദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘ഉണ്ടാക്കുക/ചെയ്യുക’ നിലനിർത്തുന്നു. ആരാധനാവസ്തു ‘സ്ഥാപിച്ചു’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കുന്നത് മൂലപാഠം നിർബന്ധിക്കുന്നില്ല.
- source_word: הָאֲשֵׁרָה
  choice: അശേരയെ
  rationale: ദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കാവുന്ന എബ്രായപദം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: പ്രവൃത്തികൾ ... തുടർന്നും ചെയ്തു
  rationale: יסף + infinitive നൽകുന്ന തുടർച്ചയുടെയും വർധനയുടെയും ആശയം, പിന്നാലെയുള്ള താരതമ്യവാക്യത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לְהַכְעִיס
  choice: കോപിപ്പിക്കുന്ന
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—കോപത്തിനു പ്രേരിപ്പിക്കുക—വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: എബ്രായ സംയുക്തപദബന്ധം യഹ്‌വെയെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണപ്രയോഗമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו
  choice: തനിക്കുമുമ്പുണ്ടായിരുന്ന ഇസ്രായേൽരാജാക്കന്മാരെല്ലാവരെയുംകാൾ അധികമായി
  rationale: מן സൂചിപ്പിക്കുന്ന താരതമ്യവും לְפָנָיו സൂചിപ്പിക്കുന്ന മുൻകാല ഭരണാധികാരികളും വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: אֲשֵׁרָה എന്ന പദത്തിന്റെ സൂചിതം
  choice: പ്രധാനപാഠത്തിൽ ‘അശേര’ എന്ന പദം നിലനിർത്തി ദേവതയോ ആരാധനാവസ്തുവോ എന്ന് തീരുമാനിക്കാതിരിക്കുന്നു.
  alternative: ‘അശേരാവിഗ്രഹം/അശേരാസ്തംഭം’ അല്ലെങ്കിൽ ‘അശേരാദേവി’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ഈ സന്ദർഭത്തിലെ എബ്രായപദം അശേരാദേവതയെയോ അവളുമായി ബന്ധപ്പെട്ട ആരാധനാവസ്തുവെയോ സൂചിപ്പിക്കാം. വാക്യം തന്നെ അത് നിർണയിക്കാത്തതിനാൽ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അശേര’ എന്ന അപരിചിതപദത്തിന് അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു; ദൈവനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു. താരതമ്യത്തിന്റെ വ്യക്തതയ്ക്കായി ‘അധികമായി’ ഉപയോഗിച്ചു.
