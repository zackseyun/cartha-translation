source:
  edition: WLC
  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: ml
  text: ബയെശായുടെയും അവന്റെ മകനായ ഏലയുടെയും സകല പാപങ്ങൾ നിമിത്തം—അവർ ചെയ്തതും അവ മുഖാന്തരം ഇസ്രായേലിനെ പാപം ചെയ്യിപ്പിച്ചതുമായ പാപങ്ങൾ നിമിത്തം—തങ്ങളുടെ വ്യർഥവസ്തുക്കളാൽ[a] ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയെ അവർ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “തങ്ങളുടെ വ്യർഥതകളാൽ” അഥവാ “മൂല്യമില്ലാത്ത വസ്തുക്കളാൽ”; വിഗ്രഹങ്ങളെ നിന്ദാപൂർവം സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל כָּל חַטֹּאות
  choice: സകല പാപങ്ങളും നിമിത്തം
  rationale: മുൻവാക്യത്തിലെ ന്യായവിധിയുടെ കാരണത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; כָּל എന്നതിന്റെ സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: בַּעְשָׁא ... אֵלָה בְנוֹ
  choice: ബയെശായുടെയും അവന്റെ മകൻ ഏലായുടെയും
  rationale: വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്യുകയും ഏലാ ബയെശായുടെ മകനാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר חָטְאוּ
  choice: അവർ പാപം ചെയ്യുകയും
  rationale: חטא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിക്കുകയും
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—മറ്റൊരാളെ പാപം ചെയ്യിക്കുക—വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְהַכְעִיס
  choice: കോപിപ്പിക്കുകയും ചെയ്തു
  rationale: ദൈവത്തെ പ്രകോപിപ്പിക്കുക/കോപിപ്പിക്കുക എന്ന കാരണാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: ഹീബ്രു ഘടനയുടെ ബന്ധാർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּהַבְלֵיהֶם
  choice: തങ്ങളുടെ വ്യർഥവസ്തുക്കളാൽ
  rationale: הֶבֶל എന്നതിലെ ‘നീരാവി/വ്യർഥത/മൂല്യമില്ലായ്മ’ എന്ന നിന്ദാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വിഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה തന്നെയാണുള്ളത്. അതിനാൽ ഒരു പദവിയാൽ പകരാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
- issue: בְּהַבְלֵיהֶם എന്നതിന്റെ വിഗ്രഹാരാധനാസംബന്ധിയായ സൂചന
  choice: തങ്ങളുടെ വ്യർഥവസ്തുക്കളാൽ
  alternative: തങ്ങളുടെ വിഗ്രഹങ്ങളാൽ
  rationale: ഹീബ്രുവിലെ രൂപകാത്മകമായ ‘വ്യർഥതകൾ/മൂല്യമില്ലാത്ത വസ്തുക്കൾ’ എന്ന നിന്ദാപ്രയോഗവും വിഗ്രഹങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭസൂചനയും ഒരുപോലെ സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ വിശാലമായ പദവും അടിക്കുറിപ്പിൽ വിശദീകരണവും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ ന്യായവിധിയുടെ കാരണം തുടരുന്നതിനാൽ ‘നിമിത്തം’ എന്ന കാരണഘടന നിലനിർത്തി. ആവർത്തനമുള്ള ഹീബ്രു ഘടന വായനാസൗകര്യത്തിനായി ക്രിയാസമാന്തര്യത്തോടെ അവതരിപ്പിച്ചെങ്കിലും കാരണാർഥവും ദൈവനാമവും വിഗ്രഹങ്ങളെക്കുറിച്ചുള്ള നിന്ദാസൂചനയും സംരക്ഷിച്ചു.
