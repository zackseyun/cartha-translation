id: 1KI.16.3
reference: 1 Kings 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: ml
  text: ഇതാ, ഞാൻ ബയെശായെയും അവന്റെ ഭവനത്തെയും തുടച്ചുനീക്കും[a]; നിന്റെ ഭവനത്തെ നെബാത്തിന്റെ മകനായ യൊരോബെയാമിന്റെ ഭവനംപോലെയാക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ബയെശായുടെ പിന്നാലെ ഞാൻ കത്തിച്ചുകളയുന്നു/ദഹിപ്പിക്കുന്നു.” ബയെശായെയും അവന്റെ വംശപരമ്പരയെയും യഹോവ പൂർണമായി ഇല്ലാതാക്കുമെന്നാണ് ഈ എബ്രായ പ്രയോഗത്തിന്റെ അർഥം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ഇതാ, ഞാൻ
  rationale: ഗൗരവമേറിയ ദൈവിക പ്രഖ്യാപനത്തിന്റെ പ്രവാചകശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מַבְעִיר אַחֲרֵי
  choice: തുടച്ചുനീക്കും
  rationale: അക്ഷരാർഥത്തിൽ കത്തിക്കുക/ദഹിപ്പിക്കുക എന്ന ചിത്രം ഉള്ളതെങ്കിലും, ഈ പ്രയോഗം ബയെശയെയും അവന്റെ പിന്നാലെയുള്ള വംശത്തെയും സമഗ്രമായി ഇല്ലാതാക്കുന്ന ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയം വ്യക്തവും ശക്തവുമായി നൽകുന്നു.
- source_word: בַעְשָׁא
  choice: ബയെശ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: അവന്റെ ഭവനം / നിന്റെ ഭവനം
  rationale: കുടുംബം, രാജവംശം എന്നീ അർഥവ്യാപ്തികൾ ഉൾക്കൊള്ളുന്ന എബ്രായ ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: וְנָתַתִּי
  choice: ആക്കും
  rationale: ഈ ഘടനയിൽ ‘കൊടുക്കും’ എന്നതിലുപരി ഒരവസ്ഥയിലാക്കുക എന്ന അർഥമാണ് സ്വാഭാവികം.
- source_word: כְּבֵית
  choice: ഭവനംപോലെ
  rationale: താരതമ്യത്തിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകനായ യൊരോബെയാം
  rationale: പേരും പിതൃനാമബന്ധവും വ്യക്തമായി നിലനിർത്തുന്ന മലയാള രൂപം.
theological_decisions:
- issue: ബയെശയുടെ വംശത്തിനെതിരായ ന്യായവിധിയുടെ സ്വഭാവം
  choice: പ്രധാനവാചകത്തിൽ രാജവംശത്തിന്റെ സമഗ്രമായ നീക്കം സൂചിപ്പിക്കുന്ന ‘തുടച്ചുനീക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ബയെശയുടെ പിന്നാലെ ഞാൻ കത്തിച്ചുകളയും/ദഹിപ്പിക്കും’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം.
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ ലക്ഷ്യം തീ ഉപയോഗിക്കുന്ന പ്രത്യേക രീതി പ്രസ്താവിക്കുകയല്ല, ബയെശയെയും അവന്റെ രാജവംശത്തെയും പൂർണമായി നീക്കുമെന്ന ദൈവിക ന്യായവിധി അറിയിക്കുകയാണ്. അടിക്കുറിപ്പ് മൂലരൂപത്തിലെ ചിത്രവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവപൂർണവുമായ സാധാരണ മലയാളം. ‘ഭവനം’ എന്ന പദം കുടുംബം/രാജവംശം എന്ന ഇരട്ട അർഥസാധ്യത നിലനിർത്തുന്നു; ‘ഇതാ’ പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
