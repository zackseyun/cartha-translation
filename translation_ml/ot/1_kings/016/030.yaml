  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: ml
  text: ഒമ്രിയുടെ മകനായ അഹാബ് തനിക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെക്കാളും അധികമായി യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹോവയുടെ കണ്ണുകളിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന സാധാരണ ക്രിയയെ, ‘തിന്മയായതു’ എന്ന കർമത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെയ്തു’ എന്നു നൽകി.
- source_word: הָרַע
  choice: തിന്മയായതു
  rationale: നിശ്ചയാർഥപ്രത്യയത്തോടുകൂടിയ വിശേഷണം നാമവാചകമായി പ്രവർത്തിക്കുന്നു; ‘തിന്മയായതു’ എന്നത് അതിന്റെ ധാർമിക വിലയിരുത്തൽ നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥത്തിലെ ‘കണ്ണുകളിൽ’ എന്നതിന് പകരം, യഹോവയുടെ വിലയിരുത്തലിൽ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരക്കെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: തനിക്കു മുമ്പുണ്ടായിരുന്ന എല്ലാവരെയുംകാൾ അധികമായി
  rationale: מן എന്ന താരതമ്യഘടകവും, കാലപരമായി മുൻഗാമികളെ സൂചിപ്പിക്കുന്ന לְפָנָיו എന്ന പ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദമായി മാറ്റാതെ സൂക്ഷിച്ചു; സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: ‘മുമ്പുണ്ടായിരുന്ന എല്ലാവരും’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പാഠത്തിലെ പൊതുവായ പ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: മുൻ രാജാക്കന്മാരെല്ലാവരും
  rationale: സന്ദർഭം മുൻ രാജാക്കന്മാരെ ഉദ്ദേശിക്കുന്നുവെങ്കിലും, ഹീബ്രു വാക്യം ‘എല്ലാവരും’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. താരതമ്യത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കാൻ ‘എല്ലാവരെയുംകാൾ അധികമായി’ ക്രിയയ്ക്കു മുമ്പിൽ വെച്ചു; മൂലത്തിലെ യഥാർഥ പൊതുവായ പരാമർശം ‘എല്ലാവരും’ എന്ന നിലയിൽ സംരക്ഷിച്ചു.
