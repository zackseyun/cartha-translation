id: 1KI.16.5
reference: 1 Kings 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: ബയെശായുടെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്തതും, അവന്റെ ശക്തിയും ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേൽരാജാക്കന്മാരുടെ വാർഷികരേഖകളുടെ പുസ്തകത്തിൽ.’
    reason: ദִּבְרֵי הַיָּמִים എന്ന പ്രയോഗം ‘ദിനവൃത്താന്തങ്ങൾ’ എന്നും രാജകീയ ‘വാർഷികരേഖകൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: ബയെശായുടെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: יֶתֶר എന്നത് ശേഷിച്ച കാര്യങ്ങളെയും, രാജാവിനെക്കുറിച്ചുള്ള ഈ പതിവ് പ്രയോഗത്തിൽ דִּבְרֵי അവന്റെ പ്രവൃത്തികളെയും സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത്തരം ഒരു കാലസൂചകം ചേർത്തിട്ടില്ല.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതും
  rationale: മൂലത്തിലെ ബന്ധവാക്യം അധികമായി ‘എല്ലാം’ എന്നു ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּגְבוּרָתוֹ
  choice: അവന്റെ വീര്യവും
  rationale: גְּבוּרָה ശക്തി, വീര്യം, പ്രകടമായ പരാക്രമം എന്നിവ സൂചിപ്പിക്കാം. ‘വീര്യം’ അമൂർത്തനാമത്തിന്റെ സ്വഭാവവും രാജകീയ സന്ദർഭത്തിലെ ശക്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: രാജാക്കന്മാരിൽ ആവർത്തിക്കുന്ന മൂലത്തിലെ നിഷേധരൂപത്തിലുള്ള അലങ്കാരചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: എഴുത്തുരേഖയിലോ രാജകീയ വാർഷികരേഖയിലോ രേഖപ്പെടുത്തിയിരിക്കുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ
  rationale: לְ ഇവിടെ ആ രേഖ ഇസ്രായേൽരാജാക്കന്മാരെ സംബന്ധിച്ചതാണെന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സംബന്ധിക ഷഷ്ഠി അതു വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ആവർത്തനവും അലങ്കാരചോദ്യവും ചുരുക്കാതെ നിലനിർത്തി; അടിക്കുറിപ്പുസൂചകം അത് വിശദീകരിക്കുന്ന ഗ്രന്ഥനാമത്തോടു ചേർത്തു.
