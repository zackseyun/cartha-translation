revisions:
- from: ബയെശായുടെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതും അവന്റെ വീര്യവും ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  to: ബയെശായുടെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ ചെയ്തതും, അവന്റെ ശക്തിയും ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തങ്ങളുടെ പുസ്തകത്തിൽ[a] എഴുതിയിട്ടില്ലേ?
  rationale: ഗְּבוּרָתוֹയ്ക്ക് കൂടുതൽ വിശാലവും ആധുനിക ഉപയോഗത്തിൽ അവ്യക്തത കുറവുള്ളതുമായ “ശക്തി” ഉപയോഗിച്ചു. ഗ്രന്ഥനാമം സ്വാഭാവികമായ ബന്ധരൂപത്തിലാക്കി; അടിക്കുറിപ്പിൽ ഔദ്യോഗിക വാർഷികരേഖകൾ എന്ന സാധുവായ ബദൽ നൽകി. അർത്ഥത്തിലും അലങ്കാരചോദ്യത്തിന്റെ സ്വഭാവത്തിലും മാറ്റമില്ല.
