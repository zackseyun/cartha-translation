source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: ml
  text: യഹ്‌വേ പ്രവാചകനായ യേഹൂ മുഖാന്തരം ബാശായ്ക്കെതിരെ[a] അരുളിച്ചെയ്ത വചനപ്രകാരം, സിമ്രി ബാശായുടെ രാജവംശത്തെ[b] മുഴുവനും നശിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാശായോട്.’ എബ്രായ ഉപസർഗത്തിന്റെ പദാനുപദ അർഥം ‘-യോട്’ എന്നാണെങ്കിലും, ഇവിടെ അത് ബാശായ്ക്കെതിരായ ന്യായവിധിവചനത്തെ അവതരിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ പദാനുപദമായി, ‘ബാശായുടെ വീട്.’ ഇവിടെ അത് ബാശായുടെ രാജകുടുംബത്തെയോ ഭരണവംശത്തെയോ സൂചിപ്പിക്കുന്നു; അദ്ദേഹത്തിന്റെ ഭൗതിക ഭവനം മാത്രമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: മുഴുവനും നശിപ്പിച്ചു
  rationale: ശׁמד എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം സമ്പൂർണ നാശം വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നശിപ്പിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്; כָּל എന്നതോടുചേർന്ന ‘മുഴുവനും’ നാശത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: ബയെശായുടെ രാജവംശത്തെ മുഴുവനും
  rationale: രാജകീയ പശ്ചാത്തലത്തിൽ ‘വീട്’ എന്ന എബ്രായ പ്രയോഗം ഭൗതിക ഭവനത്തെയോ അടുത്ത കുടുംബത്തെ മാത്രമോ അല്ല, ഭരണവംശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ ‘രാജവംശം’ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּדְבַר
  choice: വചനപ്രകാരം
  rationale: മുമ്പ് പ്രഖ്യാപിച്ച യഹ്‌വേയുടെ വചനത്തോട് സംഭവങ്ങൾ പൊരുത്തപ്പെട്ടതും അത് നിറവേറിയതും ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: אֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്ത
  rationale: ദൈവം മുമ്പ് പ്രവാചകനിലൂടെ പ്രസ്താവിച്ച വചനത്തെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: אֶל בַּעְשָׁא
  choice: ബയെശായ്ക്കെതിരെ
  rationale: אֶל എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാന അർത്ഥം ‘-യോട്/-യിലേക്ക്’ എന്നാണെങ്കിലും, ഇവിടെ ബയെശായെ ലക്ഷ്യമാക്കിയ ന്യായവിധിവചനമാണ് സന്ദർഭം. ‘എതിരെ’ ആ പ്രതികൂല ദിശ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: പ്രവാചകനായ യേഹൂ മുഖാന്തരം
  rationale: ‘കൈയാൽ’ എന്ന എബ്രായ ശൈലി ഇവിടെ ഇടനിലക്കാരൻ അഥവാ ഉപാധി എന്ന ആശയമാണ് നൽകുന്നത്. ‘മുഖാന്തരം’ പ്രവാചകന്റെ മാധ്യമപങ്ക് വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ശബ്ദാന്തരം ചെയ്യുന്നത് മൂലരൂപത്തെ കൂടുതൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: ബയെശായോടുള്ള പ്രവാചകവചനത്തിൽ אֶל എന്ന ഉപസർഗത്തിന്റെ ഭാവം
  choice: ബയെശായ്ക്കെതിരെ
  alternative: ബയെശായോട്
  rationale: ഉപസർഗം പദാനുപദമായി ‘-യോട്’ എന്നു വരാമെങ്കിലും, സന്ദർഭത്തിലെ വചനം ബയെശായ്ക്കെതിരായ ന്യായവിധിയാണ്. പ്രധാന പാഠത്തിൽ പ്രതികൂല ഭാവം വ്യക്തമാക്കിയപ്പോൾ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בֵּית בַּעְשָׁא എന്നതിന്റെ പരിധി
  choice: ബയെശായുടെ രാജവംശം
  alternative: ബയെശായുടെ വീട്; ബയെശായുടെ കുടുംബം
  rationale: രാജകീയ ആഖ്യാനത്തിൽ ‘വീട്’ എന്നത് വംശഭരണത്തെയും രാജകുടുംബരേഖയെയും സൂചിപ്പിക്കുന്നു. ‘രാജവംശം’ എന്നു നൽകുന്നത് ഇത് ഒരു കെട്ടിടത്തിന്റെ നാശമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അരുളിച്ചെയ്ത’, ‘വചനപ്രകാരം’ എന്നീ പ്രയോഗങ്ങൾ പ്രവാചകസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; അപരിചിതമായ പദാനുപദ എബ്രായ ശൈലികൾ ഒഴിവാക്കി അവയുടെ പ്രസക്തമായ വിവരങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
