source:
  edition: WLC
  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: ml
  text: യെഹൂദാരാജാവായ ആസായുടെ വാഴ്ചയുടെ മുപ്പത്തിയൊന്നാം വർഷത്തിൽ, ഒമ്രി ഇസ്രായേലിന്റെ രാജാവായി. അവൻ ആകെ പന്ത്രണ്ടു വർഷം ഭരിച്ചു; അതിൽ ആറു വർഷം തിർസ്സയിൽ ഭരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒമ്രി ഇസ്രായേലിനെ പന്ത്രണ്ടു വർഷം ഭരിച്ചു; തിർസ്സയിൽ ആറു വർഷം ഭരിച്ചു.” മൂലപാഠം അവന്റെ മൊത്തം ഭരണകാലത്തെയും തിർസ്സയിൽനിന്ന് ഭരിച്ച ആറു വർഷത്തെയും വേർതിരിച്ചുപറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת ... שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: വാഴ്ചയുടെ മുപ്പത്തിയൊന്നാം വർഷത്തിൽ
  rationale: എബ്രായ രാജവാഴ്ചാകാല നിർണയസൂത്രം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു; ‘വാഴ്ചയുടെ’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ ആസായുടെ
  rationale: לְ ഇവിടെ ആസായുടെ ഭരണവർഷത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഷഷ്ഠീവിഭക്തി ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ആദ്യപ്രയോഗം ഒമ്രി രാജത്വം ഏറ്റെടുത്തതിനെ സൂചിപ്പിക്കുന്നതിനാൽ, തുടരുന്ന ഭരണത്തെക്കാൾ സ്ഥാനാരോഹണത്തിന്റെ ഭാവം നൽകുന്ന ‘രാജാവായി’ തിരഞ്ഞെടുത്തു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ
  rationale: מלך עַל എന്നത് ഒരു ജനതയുടെമേലുള്ള രാജഭരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേലിന്റെ രാജാവായി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: ആകെ പന്ത്രണ്ടു വർഷം
  rationale: ഇത് ഒമ്രിയുടെ മൊത്തം ഭരണകാലമാണ്; തുടർന്നുള്ള തിർസ്സയിലെ ആറു വർഷത്തോടുള്ള വ്യത്യാസം ‘ആകെ’ വ്യക്തമാക്കുന്നു.
- source_word: בְּ/תִרְצָה
  choice: തിർസ്സയിൽ
  rationale: בְּ ഇവിടെ സ്ഥലസൂചകമാണ്; തിർസ്സയാണ് ഭരണകേന്ദ്രമെന്ന് ‘യിൽ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: അതിൽ ആറു വർഷം തിർസ്സയിൽ ഭരിച്ചു
  rationale: രണ്ടാമത്തെ מָלַךְ തുടരുന്ന ഭരണത്തെ സൂചിപ്പിക്കുന്നു. ‘അതിൽ’ എന്നത് പന്ത്രണ്ടു വർഷത്തിൽ ആറു വർഷം തിർസ്സയിൽ ആയിരുന്നു എന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
