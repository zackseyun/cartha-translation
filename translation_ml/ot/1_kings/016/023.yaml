translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ചരിത്രവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. മൊത്തം പന്ത്രണ്ടു വർഷവും തിർസ്സയിലെ ആറു വർഷവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആകെ’, ‘അതിൽ’ എന്നിവ ചേർത്തു; ഈ വിശദീകരണം അടിക്കുറിപ്പിൽ അക്ഷരാർഥരൂപത്തോടൊപ്പം രേഖപ്പെടുത്തി.
