source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב עָמְרִי֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ אַחְאָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: ml
  text: ഒമ്രി തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]; ശമര്യയിൽ അടക്കപ്പെട്ടു. അവന്റെ മകനായ ആഹാബ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു” എന്നത് രാജവൃത്താന്തങ്ങളിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവായ എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: ഒമ്രി തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു
  rationale: രാജവൃത്താന്തങ്ങളിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും ഗൗരവവും നിലനിർത്തുന്നു; അർഥം വ്യക്തമാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അടക്കപ്പെട്ടു
  rationale: നിഫാൽ ക്രിയയുടെ കർമണി ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തെയും ശമര്യ എന്ന സ്ഥലനാമത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: അടുത്ത ഭരണാധികാരിയായുള്ള സ്ഥാനാരോഹണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ക്രിയയിൽ ഇല്ലാത്ത അധിക കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: രാജവംശപരമായ പിൻഗാമിത്വവും മുൻരാജാവിന്റെ സ്ഥാനമേറ്റെടുക്കലും കൃത്യമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു’ എന്ന മരണപ്രയോഗം
  choice: എബ്രായ ശൈലി മുഖ്യവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘മരിച്ചു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക വ്യാഖ്യാനം ഈ വാക്യത്തിൽ അടിച്ചേൽപ്പിക്കാതെ, രാജവൃത്താന്തത്തിന്റെ സൂത്രവാക്യസ്വഭാവവും യഥാർഥ രൂപകവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ആവർത്തിത രാജകീയ മരണസൂത്രം സംരക്ഷിക്കാൻ ‘നിദ്രപ്രാപിച്ചു’ ഉപയോഗിച്ചു; മറ്റു ഘടകങ്ങളിൽ സ്വാഭാവിക മലയാളവാക്യക്രമം സ്വീകരിച്ചു.
