translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ചരിത്രവിവരണശൈലി. ഹീബ്രുവിലെ സംഭവക്രമവും ‘അന്നുതന്നെ പാളയത്തിൽവെച്ച്’ എന്ന ഊന്നലും സംരക്ഷിച്ചു.
