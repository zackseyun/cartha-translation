  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: ml
  text: പാളയമിറങ്ങിയിരുന്ന ജനം, “സിമ്രി ഗൂഢാലോചന നടത്തുകയും രാജാവിനെ വധിക്കുകയും ചെയ്തിരിക്കുന്നു” എന്നു പറയുന്നതു കേട്ടു. അപ്പോൾ ഇസ്രായേൽജനം മുഴുവനും അന്നുതന്നെ പാളയത്തിൽവെച്ച് ഇസ്രായേലിന്റെ സൈന്യാധിപനായ ഒമ്രിയെ രാജാവാക്കി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: പാളയമിറങ്ങിയിരുന്ന ജനം
  rationale: חנה എന്ന പദത്തിന്റെ സൈനികസന്ദർഭത്തിലെ ‘പാളയമിറങ്ങുക/തമ്പടിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: קָשַׁר
  choice: ഗൂഢാലോചന നടത്തി
  rationale: രാജാവിനെതിരായ രഹസ്യകൂട്ടുകെട്ടിനെയോ അധികാരദ്രോഹത്തെയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: രാജാവിനെ കൊന്നുകളഞ്ഞിരിക്കുന്നു
  rationale: הכה ചിലപ്പോൾ ‘അടിച്ചു/വെട്ടിവീഴ്ത്തി’ എന്നായിരിക്കാമെങ്കിലും ഈ സന്ദർഭത്തിൽ രാജാവിനെ വധിച്ചതാണ് ഉദ്ദേശ്യം; മുൻവാക്യസന്ദർഭവും അതു വ്യക്തമാക്കുന്നു.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: ഒമ്രിയെ ... രാജാവാക്കി
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘രാജാവായി നിയമിച്ചു/വാഴിച്ചു’ എന്ന കാരണാത്മക അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: സൈന്യാധിപനായ
  rationale: ഒമ്രിയുടെ ഔദ്യോഗിക പദവി മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു; ‘ഇസ്രായേലിന്മേലുള്ള സൈന്യാധിപൻ’ എന്ന ഹീബ്രു ഘടന സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ സൈന്യാധിപൻ എന്നതാണ്.
