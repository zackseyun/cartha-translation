id: 1KI.16.32
reference: 1 Kings 16:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥קֶם מִזְבֵּ֖חַ לַ/בָּ֑עַל בֵּ֣ית הַ/בַּ֔עַל אֲשֶׁ֥ר בָּנָ֖ה בְּ/שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: ml
  text: അവൻ ശമര്യയിൽ പണിത ബാലിന്റെ ഭവനത്തിൽ[a] ബാലിനായി ഒരു യാഗപീഠം സ്ഥാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബാലിന്റെ ക്ഷേത്രത്തിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ബാലിന്റെ ഭവനം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള קום ഇവിടെ ഒരു യാഗപീഠം നിലനിറുത്തുക അഥവാ സ്ഥാപിക്കുക എന്ന അർഥം നൽകുന്നു; ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും മൂലത്തോട് ചേർന്നതുമാണ്.
- source_word: מִזְבֵּחַ
  choice: ഒരു യാഗപീഠം
  rationale: യാഗങ്ങളും ബലികളും അർപ്പിക്കുന്ന പീഠത്തെ സൂചിപ്പിക്കുന്ന מזבח എന്ന പദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: לַבָּעַל
  choice: ബാലിനായി
  rationale: ל ഉപസർഗം ഇവിടെ സമർപ്പണമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; ആ പീഠം ബാലിനായി സമർപ്പിച്ചതാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֵּית הַבַּעַל
  choice: ബാലിന്റെ ഭവനം
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ബാലിന്റെ വീട്/ഭവനം’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ബാലിന്റെ ക്ഷേത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲשֶׁר בָּנָה
  choice: അവൻ ... പണിത
  rationale: ബന്ധവാക്യം ബാലിന്റെ ഭവനത്തെയാണ് വിശേഷിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യക്രമം പ്രവർത്തനങ്ങളുടെ മുൻകാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ വേറൊരു പൂർത്തഭൂതകാലരൂപം ആവശ്യമില്ല.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: שֹׁמְרוֹן എന്ന സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം; ב സ്ഥാനം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: בֵּית הַבַּעַל എന്നതിന്റെ പരിഭാഷ
  choice: ബാലിന്റെ ഭവനം
  alternative: ബാലിന്റെ ക്ഷേത്രം
  rationale: ‘ഭവനം’ മൂലഭാഷയിലെ בית എന്ന പദത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; എന്നാൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആരാധനയ്ക്കുള്ള ക്ഷേത്രമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു. ഇതിലൂടെ മൂലപദവും സന്ദർഭാർഥവും രണ്ടും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യാഗപീഠം,’ ‘ശമര്യ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമാകാവുന്ന അക്ഷരാർഥപ്രയോഗത്തിന് അടിക്കുറിപ്പ് നൽകി.
