  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: ml
  text: നാലു ചക്രങ്ങളും ചട്ടക്കൂടുകൾക്കു[a] താഴെയായിരുന്നു. ചക്രങ്ങളുടെ അച്ചുതണ്ടുകൾ[b] പീഠത്തിലായിരുന്നു. ഓരോ ചക്രത്തിന്റെയും ഉയരം ഒന്നര മുഴമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “പാളികൾ” അല്ലെങ്കിൽ “അതിരുകൾ” (എബ്രായം: מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “ചക്രങ്ങളുടെ കൈകൾ”; സന്ദർഭത്തിൽ ഇത് ചക്രങ്ങളുടെ അച്ചുതണ്ടുകളെയോ അവയെ താങ്ങുന്ന ദണ്ഡുകളെയോ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: ചക്രങ്ങൾ / ചക്രം
  rationale: വെങ്കലപീഠത്തിൽ ഘടിപ്പിച്ച യഥാർഥ ചക്രങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ സാധാരണവും കൃത്യവുമായ പദം ഉപയോഗിച്ചു.
- source_word: לְמִתַּחַת
  choice: താഴെ
  rationale: ചട്ടക്കൂടുകളുമായുള്ള സ്ഥാനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַמִּסְגְּרוֹת
  choice: ചട്ടക്കൂടുകൾ
  rationale: מִסְגְּרוֹת എന്നത് പീഠത്തിന്റെ ചട്ടംകൊണ്ടുള്ള ഭാഗങ്ങളെയോ അതിരുകളെയോ സൂചിപ്പിക്കാം. മൂലത്തിലെ രൂപഘടനാപരമായ അർഥം നിലനിർത്താൻ 'ചട്ടക്കൂടുകൾ' തെരഞ്ഞെടുത്തു; 'പാളികൾ' മറ്റൊരു സാധ്യതയാണ്.
- source_word: וִידוֹת
  choice: അച്ചുതണ്ടുകൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം 'കൈകൾ' എന്നാണെങ്കിലും, ഈ യാന്ത്രിക സന്ദർഭത്തിൽ ചക്രങ്ങളെ ഘടിപ്പിക്കുകയോ താങ്ങുകയോ ചെയ്യുന്ന ദണ്ഡുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בַּמְּכוֹנָה
  choice: പീഠത്തോടു ചേർന്നിരുന്നു
  rationale: ב എന്ന ബന്ധസൂചകത്തിന് ഇവിടെ 'പീഠത്തിൽ/പീഠത്തോടു ചേർന്ന്' എന്ന ഘടനാപരമായ അർഥമുണ്ട്. മലയാളത്തിൽ ഘടിപ്പിച്ചിരിക്കുന്ന ബന്ധം വ്യക്തമായി പറയാൻ ഈ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: קוֹמַת
  choice: ഉയരം
  rationale: ലംബമായ അളവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: הָאֶחָד
  choice: ഓരോ
  rationale: അക്ഷരാർഥം 'ഒന്ന്' എന്നാണെങ്കിലും, എല്ലാ ചക്രങ്ങൾക്കും ഒരേ അളവ് വിതരണം ചെയ്തു പറയുന്ന സന്ദർഭത്തിൽ 'ഓരോ' എന്നത് ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ഒന്നര മുഴം
  rationale: പുരാതന അളവായ cubit-ന്റെ പതിവ് മലയാള തുല്യപദം 'മുഴം' ആണ്; ഒന്നര എന്ന രൂപം സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
