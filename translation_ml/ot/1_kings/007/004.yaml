    text: അഥവാ, ‘മൂന്നു നിലകളിലും ജനൽ ജനലിനു നേരെയായിരുന്നു.’ എബ്രായത്തിൽ പദശഃ ‘ജനൽ ജനലിനു നേരെ മൂന്നു പ്രാവശ്യം’ എന്നാണ്; ഒരേ വിന്യാസം മൂന്നു തട്ടുകളിൽ ആവർത്തിച്ചിരുന്നതിനെ ഇത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: ജനൽച്ചട്ടങ്ങൾ
  rationale: ഈ വാസ്തുവിവരണത്തിൽ ഈ പദം വെറും ജനലുകളെയല്ല, ചട്ടമിട്ട തുറസ്സുകളെയോ ജനൽച്ചട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ഘടനാപരമായ അർഥം നിലനിർത്താൻ ‘ജനൽച്ചട്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: മൂന്നു നിരകളിൽ
  rationale: טוּר എന്നത് ക്രമമായി ഒരുക്കിയ നിരയെ സൂചിപ്പിക്കുന്നു. കെട്ടിടത്തിലെ ജനൽച്ചട്ടങ്ങളുടെ വിന്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘മൂന്നു നിരകളിൽ’ എന്നു നൽകി.
- source_word: מֶחֱזָה
  choice: ജനൽ
  rationale: കാണുന്നതിനോ വെളിച്ചം കടക്കുന്നതിനോ ഉള്ള തുറസ്സാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. മുൻപുള്ള വാസ്തുപദത്തോടുള്ള സമാന്തരത കണക്കിലെടുത്ത് വ്യക്തമായ ‘ജനൽ’ തിരഞ്ഞെടുത്തു.
- source_word: אֶל מֶחֱזָה
  choice: ജനലിനു നേരെ ജനൽ
  rationale: אֶל ഇവിടെ തുറസ്സുകൾ തമ്മിലുള്ള അഭിമുഖമായ വിന്യാസം സൂചിപ്പിക്കുന്നു. എബ്രായത്തിലെ സംക്ഷിപ്ത ഘടനയും പരസ്പര അഭിമുഖതയും നിലനിർത്താൻ ‘ജനലിനു നേരെ ജനൽ’ എന്നു നൽകി.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നു പ്രാവശ്യം
  rationale: പദശഃ ‘മൂന്നു പ്രാവശ്യം’ എന്നാണ്. ഇത് മൂന്നു നിലകളിലോ തട്ടുകളിലോ ആവർത്തിച്ച വിന്യാസത്തെ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ പദശഃ രൂപം നിലനിർത്തി, വാസ്തുപരമായ സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
