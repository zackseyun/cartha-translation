  text: ജനൽച്ചട്ടങ്ങൾ മൂന്നു നിരകളിലായിരുന്നു; ജനലിനു നേരെ ജനൽ, ഇങ്ങനെ മൂന്നു പ്രാവശ്യം[a].
  philosophy: optimal-equivalence
  footnotes:
