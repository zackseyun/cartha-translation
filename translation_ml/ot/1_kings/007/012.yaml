id: 1KI.7.12
reference: 1 Kings 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: ml
  text: വലിയ പ്രാകാരത്തിനു ചുറ്റും ചെത്തിയ കല്ലുകളുടെ മൂന്നു നിരകളും വെട്ടിയൊരുക്കിയ ദേവദാരു തടികളുടെ ഒരു നിരയും ഉണ്ടായിരുന്നു[a]—യഹ്‌വെയുടെ ആലയത്തിന്റെ അകത്തെ പ്രാകാരത്തെപ്പോലെയും[b] ആലയത്തിന്റെ പ്രവേശനമണ്ഡപത്തെപ്പോലെയും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചെത്തിയ കല്ലിന്റെ മൂന്നു അടുക്കുകളും വെട്ടിയൊരുക്കിയ ദേവദാരു തടികളുടെ ഒരു അടുക്കും.’ നിർമാണസന്ദർഭത്തിൽ ‘നിര’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം കൽപ്പണിയുടെ ‘അടുക്ക്’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പോലെ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു ഉപസർഗം ബന്ധം സൂചിപ്പിക്കുന്നതായി എടുത്താൽ, ‘യഹ്‌വെയുടെ ആലയത്തിന്റെ അകത്തെ പ്രാകാരത്തിനും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: c
    text: അതായത്, ആലയത്തിന്റെ പ്രധാന കെട്ടിടത്തിലേക്കുള്ള മുൻമണ്ഡപം.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: വലിയ പ്രാകാരം
  rationale: חָצֵר എന്നത് ചുറ്റുമതിലോ കെട്ടിടങ്ങളോകൊണ്ട് വേർതിരിക്കപ്പെട്ട തുറസ്സായ പ്രാകാരത്തെ സൂചിപ്പിക്കുന്നു; ആലയനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പ്രാകാരം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: പ്രാകാരത്തിന്റെ എല്ലാ വശങ്ങളിലുമുള്ള നിർമാണക്രമം സൂചിപ്പിക്കുന്ന സ്ഥലവാചക അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: കൊത്തിയെടുത്ത കല്ലിന്റെ മൂന്നു നിരകൾ
  rationale: നിർമാണസന്ദർഭത്തിൽ טוּרִים കൽപ്പണിയുടെ നിരകളെയോ അടുക്കുകളെയോ, גָּזִית പണിതൊരുക്കിയ കല്ലിനെയോ സൂചിപ്പിക്കുന്നു. സാങ്കേതികമല്ലാത്ത വായനക്കാർക്കും മനസ്സിലാകുന്ന രൂപമാണ് ഇത്.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: ദേവദാരുത്തടികളുടെ ഒരു നിര
  rationale: כְּרֻתֹת അക്ഷരാർഥത്തിൽ വെട്ടിയൊരുക്കിയ ഘടകങ്ങളാണ്; ഇവിടെ കെട്ടിടനിർമാണത്തിനുപയോഗിച്ച ദേവദാരുത്തടികൾ എന്നത് സന്ദർഭോചിതമാണ്, എന്നാൽ അവയുടെ കൃത്യമായ രൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: യഹ്‌വെയുടെ ആലയത്തിന്റെ അകത്തെ പ്രാകാരത്തെപ്പോലെയും
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ നിർമാണത്തിലെ സാദൃശ്യമോ പൊരുത്തമോ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. ‘ആലയം’ എന്നത് ഈ സന്ദർഭത്തിലെ בַּיִת എന്നതിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: אֻלָם הַבָּיִת
  choice: ആലയത്തിന്റെ പ്രവേശനമണ്ഡപം
  rationale: אֻלָם പ്രധാന കെട്ടിടത്തിലേക്കുള്ള മുൻമണ്ഡപത്തെയോ പ്രവേശനശാലയെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രവേശനമണ്ഡപം’ കൃത്യവും ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള നാല് അക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു; വെളിപ്പെടുത്തപ്പെട്ട ഉടമ്പടിനാമത്തിന്റെ വ്യക്തിത്വം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: അവസാനത്തെ לְ ഉപസർഗങ്ങളുടെ ബന്ധം
  choice: സാദൃശ്യം സൂചിപ്പിക്കുന്ന ‘പോലെ’
  alternative: ‘യഹ്‌വെയുടെ ആലയത്തിന്റെ അകത്തെ പ്രാകാരത്തിനും ആലയത്തിന്റെ പ്രവേശനമണ്ഡപത്തിനും’ എന്ന ബന്ധാർഥം
  rationale: വലിയ പ്രാകാരത്തിന്റെ നിർമാണം മുമ്പ് പറഞ്ഞ ആലയഭാഗങ്ങളുടെ നിർമാണവുമായി താരതമ്യപ്പെടുത്തുന്നതായി സന്ദർഭം ശക്തമായി സൂചിപ്പിക്കുന്നു; എങ്കിലും ഹീബ്രു ഉപസർഗം ബന്ധമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാനും കഴിയുന്നതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാസ്തുഭാഷ ഉപയോഗിച്ചു. ‘പ്രാകാരം’, ‘നിര’, ‘പ്രവേശനമണ്ഡപം’ എന്നീ പദങ്ങൾ സാധാരണ വായനാസൗകര്യവും നിർമാണസന്ദർഭത്തിലെ കൃത്യതയും തമ്മിൽ തുലനം ചെയ്യുന്നു. താരതമ്യഘടന വ്യക്തമാക്കാൻ ‘പോലെയും’ ആവർത്തിച്ചെങ്കിലും, ഹീബ്രുവിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
