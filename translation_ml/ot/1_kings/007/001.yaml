  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: ml
  text: ശലോമോൻ സ്വന്തം അരമന പതിമൂന്നു വർഷം പണിതു[a]; തന്റെ അരമന മുഴുവനും പണിതുതീർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം വീട്.’ ഇവിടെ ‘വീട്’ എന്ന എബ്രായപദം രാജകീയ വാസസ്ഥലത്തെയോ അരമനസമുച്ചയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: തന്റെ സ്വന്തം അരമന
  rationale: בַּיִת എന്നതിന് അടിസ്ഥാനമായി ‘വീട്’ എന്നാണർഥമെങ്കിലും, രാജാവിന്റെ വാസസ്ഥലവും അതിനോടനുബന്ധിച്ച കെട്ടിടസമുച്ചയവും വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘അരമന’ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘സ്വന്തം’ എന്നത് മുമ്പത്തെ ദൈവാലയനിർമാണവിവരണത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בָּנָה
  choice: പണിയാൻ … എടുത്തു
  rationale: Qal perfect ഇവിടെ പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കാലദൈർഘ്യം ചേർന്ന മലയാളവാക്യത്തിൽ ‘പണിയാൻ പതിമൂന്നു വർഷമെടുത്തു’ എന്നത് സ്വാഭാവികമായി നിർമാണവും അതിന്റെ ദൈർഘ്യവും അറിയിക്കുന്നു.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: പതിമൂന്നു വർഷം
  rationale: നിർമാണപ്രവൃത്തിയുടെ കാലദൈർഘ്യമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: וַיְכַל
  choice: പണിതുതീർത്തു
  rationale: כלה എന്ന ക്രിയ നിർമാണം പൂർത്തിയാക്കിയതായി പറയുന്നു. മലയാളത്തിൽ ‘പണിതുതീർത്തു’ എന്നത് മുൻക്രിയയുമായി സ്വാഭാവികമായി ബന്ധപ്പെടുകയും പൂർത്തീകരണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל בֵּיתוֹ
  choice: തന്റെ അരമന മുഴുവനും
  rationale: כָּל സമഗ്രതയെ അടയാളപ്പെടുത്തുന്നു. ഇവിടെ താമസക്കാരെയല്ല, രാജകീയ വാസസ്ഥലമോ അരമനസമുച്ചയമോ മുഴുവനായാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְאֶת
  choice: ശലോമോൻ തന്റെ സ്വന്തം…
  rationale: വാക്യാരംഭത്തിലെ സംയോജകവും കർമചിഹ്നവും മുമ്പത്തെ ദൈവാലയവിവരണത്തിൽനിന്ന് ബന്ധപ്പെട്ട പുതിയ വിഷയത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കൃത്രിമമായ നേരിട്ടുള്ള തർജമ ഒഴിവാക്കി ‘സ്വന്തം’ എന്ന പദത്തിലൂടെയും വാക്യക്രമത്തിലൂടെയും ഈ വ്യത്യാസം പ്രകടമാക്കി.
