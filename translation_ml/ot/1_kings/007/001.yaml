translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അരമന’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘വീട്’ എന്ന മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. രണ്ടാം ഉപവാക്യത്തിലെ ‘അങ്ങനെ’ പതിമൂന്നു വർഷത്തെ നിർമാണത്തിനുശേഷമുള്ള പൂർത്തീകരണത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
