  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: ml
  text: അതിന്റെ വായ്[a] മകുടത്തിന്റെ ഉൾഭാഗത്തുനിന്ന് ഒരു മുഴം മുകളിലേക്ക് ഉയർന്നിരുന്നു. അതിന്റെ വായ് വൃത്താകൃതിയിലുള്ളതും പീഠത്തിന്റെ പണിപോലെ നിർമിച്ചതും ഒന്നര മുഴം അളവുള്ളതുമായിരുന്നു.[b] അതിന്റെ വായ്ക്കുമേൽ കൊത്തുപണികളും[c] ഉണ്ടായിരുന്നു; അതിലെ ചട്ടക്കൂടുകൾ വൃത്താകൃതിയിലുള്ളവയല്ല, ചതുരാകൃതിയിലുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തുറവ്’; എബ്രായപാഠം ഈ തുറവിനെ ‘വായ്’ എന്ന വാസ്തുരൂപകത്തിലൂടെ വിശേഷിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പീഠത്തിന്റെ പണിപോലെ’ എന്ന എബ്രായപ്രയോഗം സാങ്കേതികമായി ദുഷ്കരമാണ്; ‘താങ്ങിന്റെ പണിപോലെ’ എന്നോ ‘അടിത്തറപോലെ നിർമിച്ചത്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കൊത്തിവരകൾ,’ ‘അലങ്കാരമാലകൾ,’ അല്ലെങ്കിൽ ‘പുഷ്പഹാരങ്ങൾ’; ഇവിടെ ഉപയോഗിച്ച അലങ്കാരപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: വായ്
  rationale: വാസ്തുഘടനയുടെ മുകളിലെ തുറവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: മകുടത്തിന്റെ ഉൾഭാഗത്തുനിന്ന്
  rationale: ഘടനയുടെ മുകളിലെ മകുടസദൃശ ഭാഗത്തിന്റെ ഉള്ളിൽനിന്നുള്ള സ്ഥാനബന്ധം നേരിട്ട് നൽകുന്നു.
- source_word: וָמַעְלָה בָּאַמָּה
  choice: ഒരു മുഴം മുകളിലേക്ക് ഉയർന്നിരുന്നു
  rationale: മുകളിലേക്കുള്ള നീളവും അതിന്റെ അളവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עָגֹל
  choice: വൃത്താകൃതിയിൽ
  rationale: ആകൃതിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള, ആധുനിക മലയാള പരിഭാഷ.
- source_word: מַעֲשֵׂה כֵן
  choice: പീഠത്തിന്റെ പണിപോലെയുള്ള
  rationale: സാങ്കേതികമായി ദുഷ്കരമായ വാക്യഭാഗത്തെ അതിരുകടന്ന് നിർവചിക്കാതെ പീഠം/താങ്ങ് എന്ന സാധ്യത നിലനിർത്തുന്നു.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ഒന്നര മുഴം
  rationale: പരമ്പരാഗത ബൈബിൾ അളവായ cubit-ന് സ്വാഭാവികമായ മലയാള പദം ഉപയോഗിക്കുന്നു.
- source_word: מִקְלָעוֹת
  choice: കൊത്തുപണികൾ
  rationale: അലങ്കാരത്തിന്റെ കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ മാലയോ വള്ളിപ്പടർപ്പോ എന്നു പ്രത്യേകീകരിക്കാതെ അലങ്കാരപ്പണി സൂചിപ്പിക്കുന്നു.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: അവയുടെ ചട്ടക്കൂടുകൾ
  rationale: ചുറ്റുമുള്ള ഫ്രെയിം ചെയ്ത ഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും പിന്നാലെയുള്ള ചതുരം-വൃത്തം വൈരുധ്യവുമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: വൃത്താകൃതിയിലല്ല, ചതുരാകൃതിയിലായിരുന്നു
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ആകൃതിവൈരുധ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
