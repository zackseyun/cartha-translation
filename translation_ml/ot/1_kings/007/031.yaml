  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാസ്തുവിവരണശൈലി. ദുഷ്കരമായ അളവുവാക്യത്തിൽ ‘വ്യാസം’ എന്ന ആശയം ചേർക്കാതെ ‘അളവ്’ എന്നു നൽകി മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിച്ചു; ‘മകുടം,’ ‘പീഠം,’ ‘ചട്ടക്കൂട്’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ഉപയോഗിച്ചു.
