  source_fidelity: മൂലത്തിലെ സ്ഥാനബന്ധം, മുകളിലേക്കുള്ള ഒരു മുഴം നീളം, വൃത്താകൃതി, ഒന്നര മുഴം അളവ്, അലങ്കാരപ്പണി, ചതുരം/വൃത്തം എന്ന വൈരുധ്യം എന്നിവ കരട് പൊതുവേ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു. എന്നാൽ ‘പീഠത്തിന്റെ പണിപോലെയുള്ള അതിന്റെ അളവ്’ എന്ന ഘടന מַעֲשֵׂה כֵן എന്ന ‘പണിരീതി/നിർമാണം’ എന്ന ആശയത്തെ ‘അളവ്’ എന്നതോടു തെറ്റായി ബന്ധിപ്പിക്കുന്നു.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിലെ ഭാഷ പൊതുവേ സ്വാഭാവികമാണ്. സാങ്കേതിക വിവരണത്തിൽ ‘മകുടം,’ ‘മുഴം,’ ‘കൊത്തുപണികൾ’ എന്നിവ യോജിക്കുന്നു. രണ്ടാം വാക്യം പുനഃക്രമീകരിച്ചാൽ ആശയബന്ധം കൂടുതൽ വ്യക്തവും സ്വാഭാവികവുമാകും. അവസാനത്തെ ‘അവയുടെ ചട്ടക്കൂടുകൾ’ എന്നത് കൊത്തുപണികളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം; ‘അതിലെ ചട്ടക്കൂടുകൾ’ കൂടുതൽ വ്യക്തമാണ്.
  terminology: ‘വായ്’ എന്ന വാസ്തുരൂപകവും അതിനോടൊപ്പമുള്ള കുറിപ്പും യോജിക്കുന്നു. כֵּן-നുള്ള ‘പീഠം’ ഒരു സൂക്ഷ്മമായ തിരഞ്ഞെടുപ്പാണ്; കുറിപ്പിൽ ‘താങ്ങ്,’ ‘അടിത്തറ’ എന്നീ സാധ്യതകൾ സൂക്ഷിച്ചിരിക്കുന്നു. מִסְגְּרֹת എന്ന സാങ്കേതിക പദത്തിന് ‘ചട്ടക്കൂടുകൾ’ സ്വീകാര്യമാണ്, എങ്കിലും സൂചകസർവനാമം തിരുത്തണം.
