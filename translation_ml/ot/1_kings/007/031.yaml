  rationale: മൂലപാഠത്തിലെ ‘പീഠത്തിന്റെ പണിപോലെ’ എന്ന നിർമാണ/പ്രവർത്തന-വിശേഷണം അളവുമായി അല്ല, വൃത്താകൃതിയിലുള്ള തുറവുമായി ബന്ധിപ്പിക്കുന്നതിനായി രണ്ടാം വാക്യം പുനഃക്രമീകരിച്ചു. അവസാനവാക്യത്തിൽ ചട്ടക്കൂടുകളുടെ മുൻസൂചകം മലയാളത്തിൽ തെറ്റായി കൊത്തുപണികളിലേക്കു പോകാതിരിക്കാനായി ‘അവയുടെ’ എന്നത് ‘അതിലെ’ എന്നാക്കി. അളവിന്റെയും സാങ്കേതിക വാസ്തുപദങ്ങളുടെയും അനിശ്ചിതത്വം നിലനിർത്തിയിരിക്കുന്നു.
