id: 1KI.7.48
reference: 1 Kings 7:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: ml
  text: 'ശലോമോൻ യഹ്‌വെയുടെ ഭവനത്തിലെ[a] എല്ലാ ഉപകരണങ്ങളും ഉണ്ടാക്കി: സ്വർണയാഗപീഠവും സാന്നിധ്യത്തിന്റെ അപ്പം[b] വെച്ചിരുന്ന സ്വർണമേശയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘യഹ്‌വെയുടെ ആലയത്തിലെ.’ അക്ഷരാർഥം: ‘യഹ്‌വെയുടെ ഭവനത്തിലെ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘കാഴ്ചയപ്പം.’ അക്ഷരാർഥം: ‘സാന്നിധ്യത്തിന്റെ അപ്പം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഈ ഉപകരണപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികവും അർഥം അമിതമായി നിർണയിക്കാത്തതുമായ പരിഭാഷ.
- source_word: כָּל הַכֵּלִים
  choice: എല്ലാ ഉപകരണങ്ങളും
  rationale: כֵּלִים പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. യാഗപീഠവും മേശയും ഉൾപ്പെടുന്ന ഇവിടെ ‘ഉപകരണങ്ങൾ’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആവശ്യമായത്ര വിശാലവുമാണ്.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ഭവനം
  rationale: ‘യഹ്‌വെയുടെ വീട്/ഭവനം’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ആലയമാണെന്ന് വ്യക്തമാണ്.
- source_word: מִזְבַּח הַזָּהָב
  choice: സ്വർണയാഗപീഠം
  rationale: എബ്രായ നാമവിശേഷണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സ്വർണംകൊണ്ടുണ്ടാക്കിയതോ സ്വർണം പൊതിഞ്ഞതോ എന്നതിനെ അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: അപ്പം വെച്ചിരുന്ന മേശ
  rationale: ‘അതിന്റെമേൽ ഉണ്ടായിരുന്ന’ എന്ന സ്ഥാനബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֶחֶם הַפָּנִים
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  rationale: ദൈവസന്നിധിയിൽ വെച്ചിരുന്ന ആരാധനാപരമായ അപ്പത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: זָהָב
  choice: സ്വർണമേശ
  rationale: വാക്യാവസാനത്തിലെ זָהָב മേശയെ വിശേഷിപ്പിക്കുന്നതായി എടുത്ത് മലയാളത്തിൽ വ്യക്തമായി ചേർക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ പേരായി ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പിൽക്കാല സ്വരീകരണത്തിനുപകരം ‘യഹ്‌വെ’ മൂലരൂപത്തോട് കൂടുതൽ അടുത്തതാണ്.
- issue: לֶחֶם הַפָּנִים എന്ന ആരാധനാപരമായ പ്രയോഗം
  choice: സാന്നിധ്യത്തിന്റെ അപ്പം
  alternative: കാഴ്ചയപ്പം; തിരുസന്നിധിയപ്പം
  rationale: പാരമ്പര്യ സാങ്കേതികപദത്തിലേക്ക് മാത്രം ചുരുക്കാതെ, ദൈവസന്നിധിയുമായി ബന്ധപ്പെട്ട എബ്രായ ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഭവനം’ എന്ന മൂലരൂപകവും ‘സാന്നിധ്യത്തിന്റെ അപ്പം’ എന്ന ആരാധനാപരമായ പ്രയോഗവും നിലനിർത്തി; അവയുടെ കൂടുതൽ പരിചിതമായ പകരങ്ങൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
