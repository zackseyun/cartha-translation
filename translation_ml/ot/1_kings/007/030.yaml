  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: ml
  text: ഓരോ താങ്ങിനും നാലു വെങ്കലച്ചക്രങ്ങളും വെങ്കല അച്ചുതണ്ടുകളും ഉണ്ടായിരുന്നു. അതിന്റെ നാലു പാദങ്ങൾക്കു താങ്ങുകൈകൾ ഉണ്ടായിരുന്നു; തൊട്ടിയുടെ താഴെ ആ താങ്ങുകൈകൾ വാർത്തുണ്ടാക്കിയവയായിരുന്നു—ഓരോന്നും മാലപ്പണിയുടെ അരികിൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മാലപ്പണി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം അപൂർവമാണ്; അത് അലങ്കാരമാലകളെയോ തൂക്കുതോരണങ്ങളെയോ സൂചിപ്പിക്കാം. വാക്യത്തിന്റെ അവസാനഭാഗത്തിന്റെ കൃത്യമായ ഘടനയും അർഥവും അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: വെങ്കലച്ചക്രങ്ങൾ
  rationale: אוֹפַנִּים എന്നത് ചക്രങ്ങളെയും, ദേവാലയത്തിലെ ലോഹപ്പണിയുടെ പശ്ചാത്തലത്തിൽ נְחֹשֶׁת വെങ്കലത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: ഓരോ താങ്ങിനും
  rationale: מְכוֹנָה ഇവിടെ തൊട്ടിയെ വഹിക്കുന്ന ചക്രങ്ങളുള്ള അടിത്താങ്ങാണ്. הָאַחַת ഓരോ പ്രത്യേക താങ്ങിനെയും എടുത്തുപറയുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ വിതരണാർഥം ഉപയോഗിച്ചു.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: വെങ്കല അച്ചുതണ്ടുകൾ
  rationale: ചക്രങ്ങളുടെ പശ്ചാത്തലത്തിൽ അപൂർവമായ סַרְנִים ചക്രങ്ങളെ വഹിക്കുന്ന അച്ചുതണ്ടുകളെയാണ് ഏറ്റവും സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: אַרְבָּעָה פַעֲמֹתָיו
  choice: അതിന്റെ നാലു മൂലകളിലും
  rationale: פַעַם അക്ഷരാർഥത്തിൽ കാൽ/പാദം എന്ന ആശയം നൽകാമെങ്കിലും, ഈ ഘടനാവിവരണത്തിൽ നാല് താഴത്തെ സ്ഥാനങ്ങളെയോ മൂലകളെയോ സൂചിപ്പിക്കുന്നു; ‘മൂലകൾ’ വസ്തുവിന്റെ രൂപം കൂടുതൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּתֵפֹת
  choice: താങ്ങുകൈകൾ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘തോളുകൾ’ എന്നാണ്; ഇവിടെ തൊട്ടിയെ താങ്ങുന്ന പുറത്തേക്കു നീണ്ട ഘടകങ്ങളായതിനാൽ ‘താങ്ങുകൈകൾ’ രൂപവും പ്രവർത്തനവും ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: തൊട്ടിയുടെ അടിയിൽ
  rationale: כִּיּוֹר വലിയ പാത്രമോ basin-ഓ ആണ്; ‘തൊട്ടി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: יְצֻקוֹת
  choice: വാർപ്പുപണിയായി നിർമിച്ചിരുന്നു
  rationale: יצק എന്ന ധാതുവിന്റെ ഈ നിഷ്ക്രിയരൂപം ലോഹം അച്ചിൽ ഒഴിച്ചു വാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעֵבֶר אִישׁ
  choice: ഓരോന്നും … അരികിൽ
  rationale: വിതരണപരമായ ഈ പ്രയോഗം ഓരോ താങ്ങുകൈയുടെയും അലങ്കാരത്തോടുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; കൃത്യമായ ദിശ നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല.
- source_word: לֹיוֹת
  choice: മാലപ്പണി
  rationale: ഈ അപൂർവപദം മാലയോ തോരണമോ പോലുള്ള അലങ്കാരപ്പണിയെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; ഉറപ്പില്ലായ്മ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
