  rationale: ‘മൂലകൾ’ എന്ന വ്യാഖ്യാനപരമായ രൂപത്തിന് പകരം, വസ്തുവിന്റെ നാലു താഴത്തെ പാദങ്ങളെയോ താങ്ങുപോയിന്റുകളെയോ സൂചിപ്പിക്കുന്ന ‘പാദങ്ങൾ’ ഉപയോഗിച്ചു; ഇതു മൂലപാഠത്തോടു കൂടുതൽ അടുത്തുനിൽക്കുകയും ഘടനാപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ലോഹം അച്ചിൽ ഒഴിച്ചു രൂപപ്പെടുത്തിയതിനെ സൂചിപ്പിക്കാൻ ‘വാർത്തുണ്ടാക്കിയവയായിരുന്നു’ ഉപയോഗിച്ചു. അപൂർവമായ അവസാന അലങ്കാരപദത്തിന്റെയും വാക്യഘടനയുടെയും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
