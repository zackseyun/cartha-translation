revisions:
- from: ഓരോ താങ്ങിനും നാലു വെങ്കലച്ചക്രങ്ങളും വെങ്കല അച്ചുതണ്ടുകളും ഉണ്ടായിരുന്നു. അതിന്റെ നാലു മൂലകളിലും താങ്ങുകൈകൾ ഉണ്ടായിരുന്നു; തൊട്ടിയുടെ അടിയിൽ ആ താങ്ങുകൈകൾ വാർപ്പുപണിയായി നിർമിച്ചിരുന്നു—ഓരോന്നും മാലപ്പണിയുടെ അരികിൽ.[a]
