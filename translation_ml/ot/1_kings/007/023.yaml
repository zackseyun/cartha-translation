  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: ml
  text: അവൻ വാർത്തെടുത്ത കടൽ[a] ഉണ്ടാക്കി. അത് ഒരു വക്കുമുതൽ മറുവക്കുവരെ പത്തു മുഴവും ചുറ്റും വൃത്താകാരവുമായിരുന്നു; അതിന്റെ ഉയരം അഞ്ചു മുഴം. മുപ്പതു മുഴമുള്ള ഒരു അളവുചരട്[c] അതിനെ ചുറ്റിയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തൊട്ടി.’ ഈ വലിയ ദേവാലയപാത്രത്തെ എബ്രായപാഠം ഔപചാരികമായി ‘കടൽ’ എന്നു വിളിക്കുന്നു; ആ പേര് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മുപ്പതു മുഴമുള്ള ഒരു ചരട്’; അതായത്, അതിന്റെ ചുറ്റളവ് മുപ്പതു മുഴമായിരുന്നു.
    reason: cultural_note
  - marker: c
    text: ഇവിടത്തെ ലിഖിതരൂപം קוה ആണ്; എന്നാൽ പരമ്പരാഗത വായന קו (‘അളവുചരട്’) എന്നാണ്. 2 ദിനവൃത്താന്തം 4:2-ലെ സമാന്തരവാക്യം താരതമ്യം ചെയ്യുക.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: കടൽ
  rationale: ഇത് ദേവാലയത്തിലെ വലിയ ജലപാത്രത്തിന്റെ ഔപചാരിക നാമമാണ്. അതിന്റെ ഉപയോഗം മാത്രം സൂചിപ്പിക്കുന്ന ‘തൊട്ടി’ എന്നതിലേക്കു ചുരുക്കാതെ എബ്രായത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: מוּצָק
  choice: വാർത്തെടുത്ത
  rationale: ലോഹം ഉരുക്കി അച്ചിൽ ഒഴിച്ചു നിർമിച്ചതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ രൂപം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: ഒരു വക്കുമുതൽ മറുവക്കുവരെ പത്തു മുഴം
  rationale: പാത്രത്തിന്റെ തുറന്ന ഭാഗത്തിനു കുറുകെയുള്ള അളവ് വ്യക്തമാക്കുകയും ശബ്ദാനുവാദത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: שָׂפָה
  choice: വക്ക്
  rationale: പാത്രത്തിന്റെ അരിക് എന്ന അർഥത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപദം.
- source_word: עָגֹל סָבִיב
  choice: ചുറ്റും വൃത്താകാരം
  rationale: വസ്തുവിന്റെ വൃത്താകൃതിയെയും ചുറ്റുമുള്ള സമാനതയെയും സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: קוֹמָתוֹ
  choice: അതിന്റെ ഉയരം
  rationale: നിർമാണപരമായ ഈ സന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: וקוה
  choice: ഒരു അളവുചരട്
  rationale: അളക്കാൻ ഉപയോഗിക്കുന്ന രേഖയെയോ ചരടിനെയോ സൂചിപ്പിക്കുന്ന പദം. സന്ദർഭത്തിൽ ‘അളവുചരട്’ സാധാരണ വായനക്കാരന് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: അതിനെ ചുറ്റിയിരുന്നു
  rationale: ‘ചുറ്റുക’ എന്ന ക്രിയയിൽ തന്നെ എബ്രായത്തിലെ ആവർത്തിത ആശയം സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന കൈമുട്ട്-അളവിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ ഉപയോഗത്തിലും സ്ഥാപിതമായ പദം.
