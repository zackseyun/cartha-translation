  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: ml
  text: 'താങ്ങുപീഠങ്ങളുടെ നിർമാണം ഇങ്ങനെയായിരുന്നു: അവയ്ക്ക് ചട്ടക്കൂടുകൾ[a] ഉണ്ടായിരുന്നു; ബന്ധനഭാഗങ്ങൾക്കിടയിൽ[b] ചട്ടക്കൂടുകളും ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചട്ടക്കൂടുകൾ” എന്നതിന് “ചട്ടംചെയ്ത ഭാഗങ്ങൾ” അഥവാ “പാനലുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉദ്ദേശിക്കുന്ന കൃത്യമായ ഘടനാഭാഗം വ്യക്തമല്ല.
    reason: lexical_alternative
  - marker: b
    text: “ബന്ധനഭാഗങ്ങൾ” എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം കുറുകെയുള്ള ദണ്ഡുകൾ, നെടുകെയുള്ള താങ്ങുകൾ, അല്ലെങ്കിൽ റെയിലുകൾ എന്നിവയെയും സൂചിപ്പിക്കാം; കൃത്യമായ വാസ്തുഘടനാഭാഗം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: ഇങ്ങനെയായിരുന്നു
  rationale: വിവരണാത്മകമായ അടുത്ത ഭാഗം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; മുൻവാക്യത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂה
  choice: നിർമാണരീതി
  rationale: ഇവിടെ പൊതുവായ ‘പ്രവൃത്തി’യെയല്ല, പീഠം എങ്ങനെ നിർമിച്ചിരുന്നുവെന്ന ഘടനാപരമായ വിവരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמְּכוֹנָה
  choice: താങ്ങുപീഠം
  rationale: ഈ സന്ദർഭത്തിൽ ജലപാത്രത്തെ താങ്ങിയിരുന്ന ചലിപ്പിക്കാവുന്ന അടിത്തറയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘താങ്ങുപീഠം’ സാധാരണ വായനക്കാർക്ക് പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: מִסְגְּרֹת
  choice: ചട്ടക്കൂടുകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനമായ ചുറ്റിയടയ്ക്കുന്ന ഘടന എന്ന ആശയം നിലനിർത്തുന്നു; ഇവ ചട്ടംചെയ്ത ഭാഗങ്ങളോ പാനലുകളോ ആയിരിക്കാം എന്ന അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לָהֶם
  choice: അതിന് ... ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ ഉടമസ്ഥതാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. സമീപത്തെ ഏകവചനമായ ‘താങ്ങുപീഠം’ അനുസരിച്ച് മലയാളവാക്യം ക്രമപ്പെടുത്തി.
- source_word: בֵּין
  choice: ഇടയിലും
  rationale: ഘടനാഭാഗങ്ങൾ തമ്മിലുള്ള സ്ഥാനബന്ധം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘-യും’ ആവർത്തിച്ച ചട്ടക്കൂടുകളുടെ രണ്ടാമത്തെ സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: הַשְׁלַבִּים
  choice: ബന്ധനദണ്ഡങ്ങൾ
  rationale: പരസ്പരം ചേർക്കുന്ന ഘടനാഭാഗങ്ങൾ എന്ന പൊതുവായ അർത്ഥം നൽകുന്നു; അവ കുറുകെയുള്ള ദണ്ഡുകളോ നെടുകെയുള്ള താങ്ങുകളോ റെയിലുകളോ ആയിരുന്നോ എന്നത് ഉറപ്പില്ലാത്തതിനാൽ അതിരുകടന്ന കൃത്യത ഒഴിവാക്കുന്നു.
