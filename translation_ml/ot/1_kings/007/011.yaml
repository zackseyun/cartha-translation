id: 1KI.7.11
reference: 1 Kings 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/לְ/מַ֗עְלָ/ה אֲבָנִ֧ים יְקָר֛וֹת כְּ/מִדּ֥וֹת גָּזִ֖ית וָ/אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: ml
  text: മുകളിൽ, അളവനുസരിച്ച് ചെത്തിയ വിലയേറിയ കല്ലുകളും[a] ദേവദാരുവും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ചെത്തിയ കല്ലിന്റെ അളവുകളിലുള്ള വിലയേറിയ കല്ലുകളും.”
    reason: כְּמִדּוֹת גָּזִית എന്ന എബ്രായ പദബന്ധത്തിന്റെ ഘടന ‘അളവനുസരിച്ച് ചെത്തിയ’ എന്നും ‘ചെത്തിയ കല്ലിന്റെ അളവുകൾപ്രകാരം’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: മുകളിൽ
  rationale: കെട്ടിടത്തിന്റെ മേൽഭാഗത്തുണ്ടായിരുന്ന വസ്തുക്കളിലേക്കുള്ള സ്വാഭാവികമായ സ്ഥാനസൂചനയായി ഈ രൂപം ഇവിടെ ‘മുകളിൽ’ എന്നു നൽകുന്നു.
- source_word: אֲבָנִים יְקָרוֹת
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: നിർമാണസന്ദർഭത്തിൽ יְקָרוֹת രത്നങ്ങളെയല്ല, ഉയർന്ന വിലയും ഗുണമേന്മയുമുള്ള കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כְּמִדּוֹת גָּזִית
  choice: അളവനുസരിച്ച് ചെത്തിയ
  rationale: പദാനുപദമായി ‘ചെത്തിയ കല്ലിന്റെ അളവുകൾപ്രകാരം’ എന്നാകാവുന്ന പ്രയോഗം, നിർദ്ദിഷ്ട അളവിൽ പാകപ്പെടുത്തിയ കല്ലുകളെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു; ഘടനാപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וָאָרֶז
  choice: ദേവദാരു
  rationale: നിർമാണവസ്തുവായ cedar-നെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം; എബ്രായത്തിൽ ‘മരം’ എന്ന പദം പ്രത്യേകം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണവിവരണത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ ശൈലി. മലയാളവാക്യം പൂർണമാക്കാൻ എബ്രായത്തിൽ സൂചിതമായ ‘ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു.
