  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി സ്വീകരിച്ചു. അളവുപേരുകൾ അനാവശ്യമായി ആധുനിക ഏകകങ്ങളിലേക്കു മാറ്റിയിട്ടില്ല; മൂലപാഠം വ്യക്തമാക്കാത്ത അളവുദിശ അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിച്ചു.
