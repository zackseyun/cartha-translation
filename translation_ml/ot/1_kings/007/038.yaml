base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: ml
  text: അവൻ വെങ്കലംകൊണ്ട് പത്ത് തൊട്ടികൾ[c] ഉണ്ടാക്കി. ഓരോ തൊട്ടിയിലും നാൽപത് ബത്ത്[a] കൊള്ളുമായിരുന്നു; ഓരോ തൊട്ടിക്കും നാലു മുഴം അളവുണ്ടായിരുന്നു[b]. പത്ത് പീഠങ്ങളിൽ ഓരോന്നിന്മേലും ഓരോ തൊട്ടി ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബത്ത്’ എബ്രായരുടെ ഒരു ദ്രവയളവായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘വ്യാസം നാലു മുഴം.’ എബ്രായപാഠത്തിൽ ഇവിടെ ‘നാലു മുഴം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ.
    reason: lexical_alternative
  - marker: c
    text: ‘തൊട്ടികൾ’ എന്നതിന് ‘കഴുകുപാത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: തൊട്ടികൾ
  rationale: ക്ഷേത്രോപകരണങ്ങളായ വലിയ ജലപാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തൊട്ടികൾ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; കൂടുതൽ പ്രവർത്തനവിവരം ചേർക്കാതെ മൂലപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ഈ ലോഹപദത്തിന് പതിവായും യുക്തമായും നൽകുന്ന മലയാളപരിഭാഷ ‘വെങ്കലം’ ആണ്.
- source_word: בַּת
  choice: ബത്ത്
  rationale: ഇത് എബ്രായ ദ്രവയളവാണ്. ആധുനിക അളവിലേക്കുള്ള കൃത്യതയില്ലാത്ത പരിവർത്തനം ഒഴിവാക്കി മൂലത്തിലെ അളവുപേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: יָכִיל
  choice: കൊള്ളുമായിരുന്നു
  rationale: പാത്രത്തിന്റെ ഉൾക്കൊള്ളൽശേഷിയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְבַּע בָּאַמָּה
  choice: നാലു മുഴം വീതിയുണ്ടായിരുന്നു
  rationale: മൂലത്തിൽ ‘നാലു മുഴം’ എന്നു മാത്രമാണെങ്കിലും വൃത്താകാര പാത്രത്തിന്റെ കുറുകെയുള്ള അളവാണ് സന്ദർഭത്തിൽ സാധ്യതയുള്ളത്. ‘വീതി’ വായനാസൗകര്യം നൽകുന്നു; മൂലത്തിലെ അപൂർണ നിർണ്ണയം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מְכוֹנָה
  choice: പീഠങ്ങൾ
  rationale: ചുറ്റുമുള്ള വാക്യങ്ങളിൽ വിവരിക്കുന്ന പാത്രങ്ങളെ താങ്ങുന്ന ഘടനകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പീഠങ്ങൾ’ അവയുടെ പ്രവർത്തനം വ്യക്തമായി പറയുന്നു; ഈ വാക്യത്തിൽ ആവശ്യമില്ലാത്ത യാന്ത്രിക വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: പത്തു പീഠങ്ങളിൽ ഓരോന്നിന്മേലും ഓരോ തൊട്ടി വെച്ചു
  rationale: എല്ലാ പത്തു പീഠങ്ങളിലും ഒന്നുവീതം തൊട്ടി എന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
