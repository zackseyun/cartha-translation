base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: ml
  text: അവൻ തൂണുകളും ഒരു വലപ്പണിയുടെ ചുറ്റുമായി രണ്ടു നിരകളും ഉണ്ടാക്കി; മാതളപ്പഴങ്ങളുടെ മുകളിൽ ഉണ്ടായിരുന്ന തൂൺമകുടങ്ങളെ മൂടാനായിരുന്നു ഈ രണ്ടു നിരകൾ.[a] രണ്ടാമത്തെ തൂൺമകുടത്തിനും അവൻ അങ്ങനെതന്നെ ചെയ്തു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മാതളപ്പഴങ്ങൾ’ എന്നു പറയുന്നത് മാതളപ്പഴത്തിന്റെ ആകൃതിയിലുള്ള അലങ്കാരഘടകങ്ങളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിന്റെ ഹീബ്രു പാഠം ദുഷ്കരമാണ്. ഓരോ തൂൺമകുടത്തിന്റെയും വലപ്പണിക്കു ചുറ്റുമുള്ള മാതളപ്പഴ അലങ്കാരങ്ങളുടെ രണ്ടു നിരകളെയാണ് ഇത് വിവരിക്കുന്നതെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ഉണ്ടാക്കി
  rationale: ആഖ്യാനക്രമത്തിലെ സാധാരണ ക്രിയയായ עשה-യുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: הָעַמּוּדִים
  choice: തൂണുകൾ
  rationale: നിർമാണസന്ദർഭത്തിൽ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ പദം.
- source_word: שְׁנֵי טוּרִים
  choice: രണ്ടു നിരകൾ
  rationale: അലങ്കാരഘടകങ്ങളുടെ ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്ന טוּר എന്ന പദത്തിന്റെ സ്വാഭാവിക അർഥം.
- source_word: סָבִיב
  choice: ചുറ്റുമായി
  rationale: വലപ്പണിയെ വലയംചെയ്തുള്ള സ്ഥാനക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַשְּׂבָכָה
  choice: വലപ്പണി
  rationale: വലപോലുള്ള അലങ്കാരനിർമാണത്തെ സൂചിപ്പിക്കുന്ന വായനാസൗഹൃദമായ പദം.
- source_word: לְכַסּוֹת
  choice: മൂടുന്നതിനായിരുന്നു
  rationale: ഹീബ്രു അനന്തക്രിയയുടെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: הַכֹּתָרֹת
  choice: തൂൺമകുടങ്ങൾ
  rationale: വാസ്തുവിദ്യാസന്ദർഭത്തിലെ capital എന്ന ഘടകത്തെ സാധാരണ വായനക്കാരന് തിരിച്ചറിയാവുന്ന വിധത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָרִמֹּנִים
  choice: മാതളപ്പഴങ്ങൾ
  rationale: ഹീബ്രുവിലെ മൂർത്തമായ പദം നേരിട്ട് നിലനിർത്തുന്നു; അലങ്കാരരൂപങ്ങളാകാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: וְכֵן עָשָׂה
  choice: അവൻ അങ്ങനെതന്നെ ചെയ്തു
  rationale: അതേ പണി മറ്റേ ഘടകത്തിലും ആവർത്തിച്ചതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: രണ്ടാമത്തെ തൂൺമകുടത്തിനും
  rationale: ഹീബ്രുവിലെ അനുബന്ധ വാസ്തുഘടകത്തെ നേരിട്ടും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
