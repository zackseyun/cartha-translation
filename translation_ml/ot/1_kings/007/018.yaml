  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായനാസൗഹൃദവുമായ മലയാളം ഉപയോഗിച്ചു. ദീർഘവും ദുഷ്കരവുമായ ഹീബ്രു വാക്യഘടന വായനയ്ക്കായി ചെറുവാക്യങ്ങളാക്കി; എന്നാൽ ഘടകങ്ങളുടെ ക്രമവും പാഠത്തിലെ അസ്പഷ്ടതയും അടിക്കുറിപ്പുകളോടെ നിലനിർത്തി.
