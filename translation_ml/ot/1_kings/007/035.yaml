lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: പീഠത്തിന്റെ മുകളിൽ
  rationale: רֹאשׁ ഇവിടെ വസ്തുവിന്റെ ‘മുകൾഭാഗം’ സൂചിപ്പിക്കുന്നു; ഈ അധ്യായത്തിൽ מְכוֹנָה വെങ്കലപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: അര മുഴം ഉയരമുള്ള
  rationale: അളവും ലംബമായ ഉയരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: עָגֹל סָבִיב
  choice: ചുറ്റും വൃത്താകൃതിയിലുള്ള ഒരു വക്ക്
  rationale: עָגֹל സവിശേഷതയുടെ വൃത്താകൃതിയും סָבִיב ചുറ്റിലുമുള്ള വ്യാപ്തിയും സൂചിപ്പിക്കുന്നു. എബ്രായത്തിൽ വിശേഷിപ്പിക്കപ്പെടുന്ന നാമം വ്യക്തമല്ലാത്തതിനാൽ സന്ദർഭത്തിന് യോജിച്ച ‘വക്ക്’ ചേർത്തിരിക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְדֹתֶיהָ
  choice: അതിന്റെ താങ്ങുകൾ
  rationale: יָד എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കൈ’ എന്നാണെങ്കിലും, വസ്തുനിർമാണ വിവരണങ്ങളിൽ പുറത്തേക്കു നീളുന്ന ഘടകമോ പിടിയോ താങ്ങോ സൂചിപ്പിക്കാം. ഇവിടെ ഘടനാപരമായ ‘താങ്ങുകൾ’ യോജിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: ചട്ടക്കൂടുകൾ
  rationale: מִסְגְּרוֹת ചട്ടംകൊടുത്ത ഭാഗങ്ങളെയോ ഫ്രെയിമുകളെയോ സൂചിപ്പിക്കുന്നു. ‘ചട്ടക്കൂടുകൾ’ രൂപപരമായ അർഥം നിലനിർത്തുന്നു; ‘പാളികൾ’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִמֶּנָּה
  choice: അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയവയായിരുന്നു
  rationale: അക്ഷരാർഥമായ ‘അതിൽനിന്ന്’ എന്ന ബന്ധം നിലനിർത്തിക്കൊണ്ട്, ഈ ഘടകങ്ങൾ വേറെ ഘടിപ്പിച്ചതല്ലാതെ പീഠത്തിന്റെ തന്നെ ഭാഗങ്ങളായി രൂപപ്പെടുത്തിയതാണെന്ന സാധ്യത സ്വാഭാവികമായി അറിയിക്കുന്നു.
