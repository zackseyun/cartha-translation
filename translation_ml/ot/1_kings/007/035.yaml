  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: ml
  text: പീഠത്തിന്റെ മുകളിൽ അര മുഴം ഉയരമുള്ള, ചുറ്റും വൃത്താകൃതിയിലുള്ള ഒരു വക്കുണ്ടായിരുന്നു[a]. പീഠത്തിന്റെ മുകളിൽ അതിന്റെ താങ്ങുകളും[b] ചട്ടക്കൂടുകളും[c] അതിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഘടകത്തിന്റെ നാമം എബ്രായപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല; അക്ഷരാർഥം ‘ചുറ്റും വൃത്താകൃതിയിലുള്ളത്’ എന്നാണ്.
    reason: source_ambiguity
  - marker: b
    text: അഥവാ ‘പിടികൾ’ അല്ലെങ്കിൽ ‘പുറത്തേക്കു നീളുന്ന ഭാഗങ്ങൾ’; എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘അതിന്റെ കൈകൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
