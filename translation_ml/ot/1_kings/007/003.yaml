  terminology: “ദേവദാരുമരം” suitably renders cedar. “പാർശ്വഘടനകൾ” responsibly preserves the uncertainty of צלעות in this architectural context; the footnote gives the principal alternatives. “തൂണുകൾക്കുമേലുള്ള” is a natural rendering of the structures’ relation to the pillars.
