  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: ml
  text: തൂണുകൾക്കുമേലുള്ള പാർശ്വഘടനകൾക്കു മീതെ, അത് മുകളിൽ ദേവദാരുമരംകൊണ്ട് പൊതിഞ്ഞിരുന്നു[a]. അവ ആകെ നാല്പത്തഞ്ച്—ഒരു നിരയിൽ പതിനഞ്ച് വീതം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തൂണുകൾക്കുമേലുള്ള പാർശ്വമുറികൾക്കു മീതെ, അത് മുകളിൽ ദേവദാരുമരംകൊണ്ട് ആവരണം ചെയ്തിരുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വാസ്തുവിദ്യാപദങ്ങളുടെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; പ്രത്യേകിച്ച് צלעות എന്ന പദത്തിന് “വശങ്ങൾ,” “വാരിയെല്ലുകൾ,” “പാർശ്വമുറികൾ,” “പാർശ്വഘടനകൾ” എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: പൊതിഞ്ഞിരുന്നു
  rationale: ספן എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം ഒരു വസ്തുകൊണ്ട് മൂടിയതോ ആവരണം ചെയ്തതോ സൂചിപ്പിക്കുന്നു. കൃത്യമായി മേൽക്കൂരയിട്ടു എന്നു നിശ്ചയിക്കാതെ വാസ്തുവിദ്യാ സന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവികമായ പദം.
- source_word: בָּאֶרֶז
  choice: ദേവദാരുമരംകൊണ്ട്
  rationale: ב ഇവിടെ നിർമാണവസ്തുവിനെ സൂചിപ്പിക്കുന്നു; ‘ദേവദാരുമരംകൊണ്ട്’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מִמַּעַל
  choice: മുകൾഭാഗം
  rationale: ഘടനയുടെ മുകളിലുള്ള ഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനാർഥക പ്രയോഗം; ‘മുകളിൽനിന്ന്’ എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עַל הַצְּלָעוֹת
  choice: പാർശ്വഘടനകൾക്കു മീതെ
  rationale: צלעות എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വശങ്ങൾ/വാരിയെല്ലുകൾ’ എന്നും കെട്ടിടസന്ദർഭത്തിൽ പാർശ്വമുറികളോ പാർശ്വഘടനകളോ എന്നും വരാം. രൂപം തീർച്ചപ്പെടുത്താതെ ‘പാർശ്വഘടനകൾ’ എന്ന വിശാലപദം ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യം പാർശ്വഘടനകൾ തൂണുകളോടുള്ള സ്ഥാനബന്ധം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ലളിതമായ സ്ഥാനവിവരണം നിലനിർത്തുന്നു.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: ആകെ നാല്പത്തഞ്ച്
  rationale: പറഞ്ഞ ഘടകങ്ങളുടെ മൊത്തം എണ്ണം നാല്പത്തഞ്ചാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു; ‘ആകെ’ കണക്കിന്റെ സംഗ്രഹസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: ഓരോ നിരയിലും പതിനഞ്ച് വീതം
  rationale: טור ഒരു നിരയെയോ വരിയെയോ സൂചിപ്പിക്കുന്നു. നാല്പത്തഞ്ചിനെ മൂന്ന് നിരകളിലായി പതിനഞ്ച് വീതം ക്രമപ്പെടുത്തിയതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
