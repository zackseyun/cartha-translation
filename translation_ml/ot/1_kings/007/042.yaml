  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാസ്തുവിവരണശൈലി ഉപയോഗിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ മൂലപാഠത്തിന്റെ ഖണ്ഡവാക്യസ്വഭാവം അർധവിരാമത്തോടെ നിലനിർത്തി.
