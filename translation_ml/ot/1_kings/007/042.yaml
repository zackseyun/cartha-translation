id: 1KI.7.42
reference: 1 Kings 7:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הָ/רִמֹּנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנֵֽי טוּרִ֤ים רִמֹּנִים֙ לַ/שְּׂבָכָ֣ה הָֽ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: ml
  text: രണ്ടു വലപ്പണികൾക്കായി[a] നാനൂറു മാതളപ്പഴങ്ങളും—ഓരോ വലപ്പണിയിലും രണ്ടു നിര മാതളപ്പഴങ്ങൾ വീതം—തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന മകുടങ്ങളുടെ കിണ്ണാകൃതിയിലുള്ള രണ്ടു ഭാഗങ്ങളെ[b] മൂടുന്നതിനായി;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലക്കെട്ടുകൾ.’ മകുടങ്ങളിലെ വലപോലുള്ള തുറന്ന അലങ്കാരപ്പണിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘മകുടങ്ങളുടെ രണ്ടു കിണ്ണങ്ങളെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: മാതളപ്പഴങ്ങൾ
  rationale: എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘മാതളപ്പഴങ്ങൾ’ എന്നാണ്. ഇവിടെ അലങ്കാരരൂപങ്ങളാണെങ്കിലും മൂലപാഠം ആ വിശദീകരണം ചേർക്കാത്തതിനാൽ സാക്ഷാൽ നാമം നിലനിർത്തുന്നു.
- source_word: שְׂבָכוֹת
  choice: വലപ്പണികൾ
  rationale: തൂൺമകുടങ്ങളിലെ വലപോലുള്ള തുറന്ന അലങ്കാരപ്പണിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘വലപ്പണികൾ’ ആ രൂപവും കരകൗശലസ്വഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: טוּרִים
  choice: നിര
  rationale: ക്രമമായി അടുക്കിയ വരികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘നിര’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: ഓരോ വലപ്പണിയിലും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വലപ്പണിക്ക്’ എന്നാണെങ്കിലും രണ്ടു വലപ്പണികളിലുമുള്ള ക്രമീകരണം വിവരിക്കുന്നതിനാൽ വിതരണാർഥം ‘ഓരോ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: לְכַסּוֹת
  choice: മൂടുന്നതിനായി
  rationale: ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്ന ക്രിയാരൂപം മലയാളത്തിൽ ‘മൂടുന്നതിനായി’ എന്നു സ്വാഭാവികമായി പകരുന്നു.
- source_word: גֻּלֹּת
  choice: കിണ്ണാകൃതിയിലുള്ള രണ്ടു ഭാഗങ്ങൾ
  rationale: പദം വൃത്താകൃതിയിലോ കിണ്ണംപോലെയോ ഉള്ള രൂപത്തെ സൂചിപ്പിക്കുന്നു. ബന്ധപ്പെട്ട כֹּתָרֹת എന്ന പദത്തോടൊപ്പം ഇത് മകുടങ്ങളുടെ പ്രത്യേക ഭാഗങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כֹּתָרֹת
  choice: മകുടങ്ങൾ
  rationale: വാസ്തുവിദ്യാപരമായ സന്ദർഭത്തിൽ തൂണുകളുടെ മുകളിലെ അലങ്കാരശീർഷങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മകുടങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ പദമാണ്.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിൽ
  rationale: അക്ഷരാർഥം ‘തൂണുകളുടെ മുഖത്ത്/മേൽ’ എന്നായാലും വാസ്തുവിവരണത്തിൽ മകുടങ്ങൾ തൂണുകളുടെ മുകളിലാണെന്ന സ്ഥാനാർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
