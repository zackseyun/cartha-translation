  yaml_path: translation/ot/1_kings/007/037.yaml
  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
translation:
  language: ml
  text: ഇപ്രകാരം അവൻ പത്തു താങ്ങുകളും ഉണ്ടാക്കി; അവയെല്ലാം ഒരേ വാർപ്പും ഒരേ അളവും ഒരേ രൂപവും ഉള്ളവയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവയെല്ലാം ഒരേ വാർപ്പുപണിയും ഒരേ വലുപ്പവും ഒരേ മാതൃകയും ഉള്ളവയായിരുന്നു.” പത്തു താങ്ങുകളും ഒരേ നിർദേശമനുസരിച്ചാണ് ഉണ്ടാക്കിയതെന്ന് ഊന്നിപ്പറയാൻ എബ്രായമൂലത്തിൽ സമാന്തരമായ മൂന്നു സംക്ഷിപ്ത പ്രയോഗങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: ഇപ്രകാരം
  rationale: മുൻവിവരണത്തിലെ രൂപകല്പനയിലേക്കും നിർമാണരീതിയിലേക്കും വിരൽചൂണ്ടുന്ന സംഗ്രഹപ്രയോഗം.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: കരകൗശലനിർമാണത്തിന്റെ പശ്ചാത്തലത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: പത്തു താങ്ങുകൾ
  rationale: ഇവ പാത്രങ്ങൾ വയ്ക്കാനുള്ള ചക്രമുള്ള അടിത്തറകളാണ്; ‘താങ്ങുകൾ’ വസ്തുക്കളുടെ പ്രവർത്തനം വ്യക്തമാക്കുകയും ‘വണ്ടികൾ’ എന്ന അതിനിർണയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: מוּצָק אֶחָד
  choice: ഒരേ വാർപ്പ്
  rationale: ലോഹം ഉരുക്കിയൊഴിച്ചു വാർക്കുന്ന നിർമാണരീതിയും പത്തു താങ്ങുകളുടെയും ഏകതാനതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מִדָּה אַחַת
  choice: ഒരേ അളവ്
  rationale: എല്ലാ താങ്ങുകൾക്കും ഒരേ വലുപ്പമോ അളവുകളോ ഉണ്ടായിരുന്നുവെന്ന സമാന്തരപ്രയോഗം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: קֶצֶב אֶחָד
  choice: ഒരേ രൂപം
  rationale: രൂപം, മാതൃക, അനുപാതം എന്നീ സാധ്യതകളുള്ള പദത്തിന് സന്ദർഭോചിതവും അതിനിർണയമില്ലാത്തതുമായ പരിഭാഷ.
- source_word: לְכֻלָּהְנָה
  choice: അവയെല്ലാം … ഉള്ളവയായിരുന്നു
  rationale: മൂന്നു ഒരേപോലുള്ള സവിശേഷതകളും പത്തു താങ്ങുകൾക്കും ബാധകമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
