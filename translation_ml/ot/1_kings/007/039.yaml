revisions:
- from: അവൻ പീഠങ്ങളിൽ അഞ്ചെണ്ണം ആലയത്തിന്റെ വലതുവശത്തും അഞ്ചെണ്ണം ആലയത്തിന്റെ ഇടതുവശത്തും സ്ഥാപിച്ചു. ‘കടൽ’ ആലയത്തിന്റെ വലതുവശത്ത്—കിഴക്കോട്ട്, തെക്കിന് അഭിമുഖമായി—സ്ഥാപിച്ചു.[a]
  to: അവൻ പീഠങ്ങളിൽ അഞ്ചെണ്ണം ആലയത്തിന്റെ വലതുവശത്തും അഞ്ചെണ്ണം ആലയത്തിന്റെ ഇടതുവശത്തും സ്ഥാപിച്ചു. അവൻ ‘കടൽ’ ആലയത്തിന്റെ വലതുവശത്ത്, കിഴക്കോട്ട്, തെക്കിന് എതിരായി സ്ഥാപിച്ചു.[a]
