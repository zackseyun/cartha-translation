source:
  edition: WLC
  text: וַ/יִּתֵּן֙ אֶת הַ/מְּכֹנ֔וֹת חָמֵ֞שׁ עַל כֶּ֤תֶף הַ/בַּ֨יִת֙ מִ/יָּמִ֔ין וְ/חָמֵ֛שׁ עַל כֶּ֥תֶף הַ/בַּ֖יִת מִ/שְּׂמֹאל֑/וֹ וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֨תֶף הַ/בַּ֧יִת הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגֶב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: ml
  text: അവൻ പീഠങ്ങളിൽ അഞ്ചെണ്ണം ആലയത്തിന്റെ വലതുവശത്തും അഞ്ചെണ്ണം ആലയത്തിന്റെ ഇടതുവശത്തും സ്ഥാപിച്ചു. അവൻ ‘കടൽ’ ആലയത്തിന്റെ വലതുവശത്ത്, കിഴക്കോട്ട്, തെക്കിന് എതിരായി സ്ഥാപിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: “ആലയത്തിന്റെ വലതുവശത്ത്, കിഴക്കോട്ട്, തെക്കിന് എതിരായി.” ഈ സംക്ഷിപ്ത സ്ഥാനവിവരണം ആലയത്തിന്റെ തെക്കുകിഴക്കുവശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: മൂലത്തിലെ ശരീരദിശയും ഭൂമിശാസ്ത്രദിശയും ചേർന്ന പ്രയോഗം വ്യക്തമാക്കുന്നതിനുള്ള കുറിപ്പ്.
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: പീഠങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ ചെമ്പുകൊണ്ടുള്ള ജലപാത്രങ്ങളെ താങ്ങിയിരുന്ന ചക്രങ്ങളുള്ള ഘടനകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പീഠങ്ങൾ’ അവയുടെ പ്രധാന പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘വണ്ടികൾ’ എന്നു പറഞ്ഞാൽ ചലനശേഷിക്ക് അനാവശ്യമായ ഊന്നൽ വരാം.
- source_word: כֶּתֶף
  choice: വശം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘തോൾ’ എന്നാണെങ്കിലും, വാസ്തുവിവരണത്തിൽ കെട്ടിടത്തിന്റെ ഒരു വശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: എബ്രായപദത്തിന്റെ സാധാരണ അർഥം ‘വീട്’ ആണെങ്കിലും, ഇവിടെ ശലോമോന്റെ ദൈവാലയകെട്ടിടമാണ് വ്യക്തമായ സൂചകം. ആധുനിക മലയാളത്തിൽ ‘ആലയം’ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִיָּמִין
  choice: വലതുവശത്ത്
  rationale: എബ്രായത്തിലെ ശരീരദിശയെ അടിസ്ഥാനമാക്കിയുള്ള പ്രയോഗം നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് ‘തെക്കുവശം’ എന്നു മാറ്റുന്നില്ല.
- source_word: מִשְּׂמֹאלוֹ
  choice: ഇടതുവശത്ത്
  rationale: മൂലഭാഷയിലെ ആപേക്ഷിക ദിശാബോധം സംരക്ഷിക്കുന്നു; ഉടൻതന്നെ ഭൂമിശാസ്ത്രദിശയായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: הַיָּם
  choice: ‘കടൽ’
  rationale: ആലയത്തിലെ വലിയ വാർപ്പുജലസംഭരണിയുടെ പരമ്പരാഗത നാമം നിലനിർത്തുന്നു. ഉദ്ധരണിചിഹ്നങ്ങൾ ഇത് പ്രകൃതിദത്തമായ കടലല്ല, ഒരു ആലയോപകരണത്തിന്റെ പേരാണെന്ന് വായനക്കാരനെ സഹായിക്കുന്നു.
- source_word: הַיְמָנִית
  choice: വലതുവശത്ത്
  rationale: മൂലത്തിലെ ‘വലതുഭാഗം’ എന്ന ശരീരദിശാപ്രയോഗം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് തെക്കുവശത്തോട് യോജിക്കുന്നു.
- source_word: קֵדְמָה
  choice: കിഴക്കോട്ട്
  rationale: കിഴക്കോട്ടോ മുൻവശത്തേക്കോ ഉള്ള ദിശയെ സൂചിപ്പിക്കുന്ന പദം; ഇവിടെ കിഴക്കോട്ടുള്ള സ്ഥാനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִמּוּל נֶגֶב
  choice: തെക്കിന് അഭിമുഖമായി
  rationale: ‘തെക്കിന് എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന മൂലത്തിലെ സംക്ഷിപ്തവും അല്പം ദുർഗ്രഹവുമായ സ്ഥാനവിവരണം അനാവശ്യമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആലയോപകരണങ്ങളുടെ സാങ്കേതിക വിവരണം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകിയപ്പോൾ, അവസാന സ്ഥാനവിവരണത്തിലെ മൂലഭാഷാപരമായ ഘടനയും സാധ്യതയുള്ള അസ്പഷ്ടതയും മുഖ്യവാക്യത്തിൽ സംരക്ഷിച്ചു.
