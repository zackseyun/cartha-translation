  source_fidelity: ഹീബ്രു ഉപകരണപ്പട്ടികയും അതിന്റെ ദ്വിഭാഗ ഘടനയും പൊതുവേ നന്നായി പ്രതിഫലിച്ചിട്ടുണ്ട്. הַמְזַמְּרוֹת-നെ വിളക്കുതിരി വെട്ടുന്ന ഉപകരണമായും, מִזְרָקוֹת-നെ തളിപ്പാത്രങ്ങളായും, מַחְתּוֹת-നെ തീച്ചട്ടികളായും നൽകിയിരിക്കുന്നത് സന്ദർഭത്തിനു യോജിക്കുന്നു. എന്നാൽ הַפֹּתוֹת എന്നത് കതക് തിരിയുന്നതിനുള്ള പിവറ്റ്/സോക്കറ്റ് ഉൾപ്പെടുന്ന ഫിറ്റിങ്ങുകളെ സൂചിപ്പിക്കാം; ‘തിരികുറ്റികൾ’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും ഗ്രഹിക്കപ്പെടുന്നില്ല.
  naturalness: പട്ടികയുടെ ഒഴുക്കും ഗൗരവമുള്ള രജിസ്റ്ററും നല്ലതാണ്. ‘കതകുകൾക്കുള്ള കതകുതിരിയുന്ന ഘടകങ്ങൾ’ എന്ന പരിഹാരം ആവർത്തനം ഒഴിവാക്കി കൂടുതൽ സ്വാഭാവികമായി വായിക്കാനായി ‘കതകുകളുടെ തിരിയുപകരണങ്ങൾ’ എന്ന് ഉപയോഗിക്കുന്നു. അടിക്കുറിപ്പിൽ സാങ്കേതിക അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
  terminology: ‘അതിവിശുദ്ധസ്ഥലം’, ‘മുഖ്യശാല’, ‘തളിപ്പാത്രങ്ങൾ’, ‘തീച്ചട്ടികൾ’ എന്നിവ വ്യക്തവും മതപരമായി നിഷ്പക്ഷവുമായ തിരഞ്ഞെടുപ്പുകളാണ്. הַפֹּתוֹതിനു ‘കതകുകളുടെ തിരിയുപകരണങ്ങൾ’ എന്നത് പിവറ്റ്, സോക്കറ്റ്, സമാനമായ പുരാതന കതക്-ഫിറ്റിങ്ങുകൾ എന്ന അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അതിരുവിടാതെ സംരക്ഷിക്കുന്നു.
  issues:
  - severity: medium
    issue: ‘തിരികുറ്റികൾ’ എന്ന പദം അസ്പഷ്ടവും സാധാരണ ആധുനിക മലയാളത്തിൽ അപരിചിതവുമാണ്.
    rationale: ഹീബ്രു പദം കതകു തിരിയുന്നതിനുള്ള ഫിറ്റിങ്ങിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യരൂപം വിവാദമാണ്. ‘തിരികുറ്റികൾ’ എന്ന സംയുക്തം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നില്ല. കൂടുതൽ സുതാര്യമായ പൊതുപദവും വിശദീകരണ അടിക്കുറിപ്പും ചേർന്നാൽ ഉറവിടത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കാം.
  revised_text: ശുദ്ധസ്വർണംകൊണ്ടുള്ള തൊട്ടികളും[a] വിളക്കുതിരി വെട്ടാനുള്ള കത്രികകളും തളിപ്പാത്രങ്ങളും കിണ്ണങ്ങളും തീച്ചട്ടികളും; അതിവിശുദ്ധസ്ഥലമായ[b] ആലയത്തിന്റെ അകത്തെ മുറിയുടെ കതകുകളുടെ തിരിയുപകരണങ്ങളും[c], ആലയത്തിന്റെ മുഖ്യശാലയുടെ[d] കതകുകളുടെ തിരിയുപകരണങ്ങളും—ഇവയും സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു.
