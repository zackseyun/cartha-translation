  revision_rationale: കതകു-ഫിറ്റിങ്ങുകളെ സൂചിപ്പിക്കുന്ന വിവാദാർഥ ഹീബ്രു പദത്തിന് അസ്പഷ്ടമായ ‘തിരികുറ്റികൾ’ എന്നതിന് പകരം, പിവറ്റോ സോക്കറ്റോ എന്ന് ഏകപക്ഷീയമായി നിശ്ചയിക്കാത്ത ‘കതകുകളുടെ തിരിയുപകരണങ്ങൾ’ ഉപയോഗിച്ചു. മറ്റെല്ലാ പദങ്ങളും ഉറവിടത്തിനും ആധുനിക മലയാളപ്രയോഗത്തിനും യോജിച്ചതിനാൽ നിലനിർത്തി.
