  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: ml
  text: ശുദ്ധസ്വർണംകൊണ്ടുള്ള തൊട്ടികളും[a] വിളക്കുതിരി വെട്ടാനുള്ള കത്രികകളും തളിപ്പാത്രങ്ങളും കിണ്ണങ്ങളും തീച്ചട്ടികളും; അതിവിശുദ്ധസ്ഥലമായ[b] ആലയത്തിന്റെ അകത്തെ മുറിയുടെ കതകുകളുടെ തിരിയുപകരണങ്ങളും[c], ആലയത്തിന്റെ മുഖ്യശാലയുടെ[d] കതകുകളുടെ തിരിയുപകരണങ്ങളും—ഇവയും സ്വർണംകൊണ്ടുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തൊട്ടികൾ’ എന്നതിന് ‘വലിയ പാത്രങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗതമായ മറ്റൊരു പ്രയോഗം: ‘വിശുദ്ധാതിവിശുദ്ധസ്ഥലം.’'
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുപദം ആധുനിക വശവിജാഗിരികളെയല്ല, കതക് തിരിയുന്ന അച്ചുതണ്ടുകളെയോ അവ ഇരിക്കുന്ന കുഴികളെയോ പോലുള്ള ഘടകങ്ങളെയാകാം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: d
    text: ‘മുഖ്യശാല’ എന്നത് അകത്തെ അതിവിശുദ്ധമുറിക്കു പുറത്തുള്ള ആലയത്തിന്റെ പ്രധാന മുറിയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: തൊട്ടികൾ
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ പട്ടികയിൽ ഇത് ദ്രാവകം വയ്ക്കുന്ന താരതമ്യേന വലിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള מִזְרָקוֹת എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കാൻ ‘തൊട്ടികൾ’ ഉപയോഗിച്ചു.
- source_word: הַמְזַמְּרוֹת
  choice: വിളക്കുതിരി വെട്ടാനുള്ള കത്രികകൾ
  rationale: ആരാധനാലയസന്ദർഭത്തിൽ വിളക്കുകളുടെ തിരി വെട്ടി ക്രമപ്പെടുത്തുന്ന ഉപകരണമാണ് ഉദ്ദേശിക്കുന്നത്; പദത്തിന്റെ മറ്റിടങ്ങളിലെ ‘കൊമ്പുവെട്ടുകത്തി’ എന്ന അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: הַמִּזְרָקוֹת
  choice: തളിപ്പാത്രങ്ങൾ
  rationale: ആചാരപരമായി ദ്രാവകം കൈകാര്യം ചെയ്യാനോ തളിക്കാനോ ഉപയോഗിച്ച പാത്രമെന്ന പ്രത്യേക ധ്വനി നിലനിർത്തുന്നു.
- source_word: הַכַּפּוֹת
  choice: കിണ്ണങ്ങൾ
  rationale: ചെറിയ കുഴിഞ്ഞ പാത്രത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കരണ്ടികൾ’ എന്നതിനെക്കാൾ രൂപവും ഉപയോഗവും അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הַמַּחְתּוֹת
  choice: തീച്ചട്ടികൾ
  rationale: കനലോ തീയോ കൊണ്ടുപോകാനുള്ള ആരാധനോപകരണത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ‘ധൂപകലശങ്ങൾ’ എന്നു പറഞ്ഞാൽ ധൂപോപയോഗം അനാവശ്യമായി നിർണയിക്കപ്പെടും.
- source_word: זָהָב סָגוּר
  choice: ശുദ്ധസ്വർണം
  rationale: ഉയർന്ന നിലവാരത്തിൽ ശുദ്ധീകരിച്ച സ്വർണം എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הַפֹּתוֹת
  choice: തിരികുറ്റികൾ
  rationale: ആധുനിക വശവിജാഗിരികളെക്കാൾ, കതക് തിരിയാൻ സഹായിക്കുന്ന അച്ചുതണ്ടോ അതിന്റെ ഇരിപ്പിടമോ പോലുള്ള ഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കാൻ സാധ്യത; ‘തിരികുറ്റികൾ’ ആ പുരാതന ഘടനയെ തുറന്നുവയ്ക്കുന്നു.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: ആലയത്തിന്റെ അകത്തെ മുറി
  rationale: ‘അകത്തെ ഭവനം’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപം ഒഴിവാക്കി, ആലയത്തിനുള്ളിലെ പ്രത്യേക മുറിയെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥലം
  rationale: ഹീബ്രുവിലെ അതിശയോക്തിപരമായ വിശുദ്ധതാസൂചനയെ വ്യക്തവും സഭാഭേദനിരപേക്ഷവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: ആലയത്തിന്റെ മുഖ്യശാലയുടെ കതകുകൾക്ക്
  rationale: הֵיכָל ഇവിടെ അകത്തെ അതിവിശുദ്ധമുറിയിൽനിന്നു വേറിട്ട പ്രധാന ആലയശാലയെ സൂചിപ്പിക്കുന്നു; ‘മുഖ്യശാല’ സാധാരണ വായനക്കാർക്ക് ‘നേവ്’ പോലുള്ള സാങ്കേതിക പദത്തെക്കാൾ വ്യക്തമാകുന്നു.
- source_word: זָהָב
  choice: സ്വർണംകൊണ്ടുള്ളവ
  rationale: അവസാനത്തെ ക്രിയാരഹിത ഹീബ്രു പട്ടികയിൽ വാതിൽഘടകങ്ങളുടെ വസ്തു വ്യക്തമാക്കാൻ മലയാളത്തിൽ ആവശ്യമായ വിധേയപ്രയോഗം ചേർത്തു.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്ന വിശുദ്ധതയുടെ പരമപ്രയോഗം
  choice: അതിവിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധാതിവിശുദ്ധസ്ഥലം / വിശുദ്ധസ്ഥലങ്ങളിൽ വിശുദ്ധമായത്
  rationale: സ്ഥലത്തിന്റെ പരമവിശുദ്ധത സംരക്ഷിക്കുമ്പോഴും ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സ്ഥിരപ്രയോഗം നിർബന്ധമാക്കാതെ സാധാരണ വായനക്കാർക്ക് അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രുവിലെ ദീർഘമായ ഉപകരണപ്പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അവസാനം ‘ഇവയും ... ആയിരുന്നു’ എന്നു ചേർത്തു. ‘ആലയം’ എന്ന ഏകീകൃത പദം ക്ഷേത്രഭവനത്തെ സൂചിപ്പിക്കുന്നു; പുരാതന വാതിൽഘടനയിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
