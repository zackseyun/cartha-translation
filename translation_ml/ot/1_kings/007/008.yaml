- from: അവൻ താമസിക്കേണ്ടിയിരുന്ന അവന്റെ ഭവനം[a], മണ്ഡപത്തിനു പിന്നിലായി മറ്റേ പ്രാകാരത്തിൽ, ഇതേ പണിപ്പോലെയായിരുന്നു. ശലോമോൻ വിവാഹം ചെയ്ത[b] ഫറവോന്റെ മകൾക്കുവേണ്ടിയും ഈ മണ്ഡപംപോലെ ഒരു ഭവനം അവൻ പണിതു.
  to: അവൻ താമസിക്കാനിരുന്ന അവന്റെ ഭവനം[a], മണ്ഡപത്തിനു പിന്നിലായിരുന്ന മറ്റേ പ്രാകാരത്തിൽ, ഇതേ നിർമാണരീതിയിലുള്ളതായിരുന്നു. ശലോമോൻ വിവാഹം ചെയ്ത[b] ഫറവോന്റെ മകൾക്കുവേണ്ടിയും ഈ മണ്ഡപംപോലെ ഒരു ഭവനം അവൻ പണിതു.
  rationale: വാസസ്ഥലത്തിന്റെ ഉദ്ദേശ്യസൂചനയെ കർത്തവ്യസൂചനയാക്കാതെ പരിഭാഷപ്പെടുത്തി; നിർമാണത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായ താരതമ്യം സ്വാഭാവിക മലയാള വാസ്തുവിദ്യാഭാഷയിൽ വ്യക്തമാക്കി. സ്ഥലബന്ധത്തിന്റെ വിവാദസ്വഭാവം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു.
