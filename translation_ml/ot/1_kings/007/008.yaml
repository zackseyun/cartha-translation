id: 1KI.7.8
reference: 1 Kings 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: ml
  text: അവൻ താമസിക്കാനിരുന്ന അവന്റെ ഭവനം[a], മണ്ഡപത്തിനു പിന്നിലായിരുന്ന മറ്റേ പ്രാകാരത്തിൽ, ഇതേ നിർമാണരീതിയിലുള്ളതായിരുന്നു. ശലോമോൻ വിവാഹം ചെയ്ത[b] ഫറവോന്റെ മകൾക്കുവേണ്ടിയും ഈ മണ്ഡപംപോലെ ഒരു ഭവനം അവൻ പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മണ്ഡപത്തിൽനിന്ന് കൂടുതൽ അകത്തുള്ള മറ്റൊരു പ്രാകാരത്തിൽ.” ഈ ഹീബ്രായ സ്ഥലസൂചക പ്രയോഗം ദുഷ്കരമാണ്; മണ്ഡപവുമായി ബന്ധപ്പെട്ട് വസതിയുടെ സ്ഥാനം എങ്ങനെ വിവരിക്കണമെന്നതിൽ പരിഭാഷകൾ വ്യത്യാസപ്പെടുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥം: “ശലോമോൻ സ്വീകരിച്ച.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് വിവാഹം ചെയ്തുവെന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: അവന്റെ ഭവനം
  rationale: രാജകൊട്ടാരസമുച്ചയത്തിലെ അടുത്ത കെട്ടിടത്തെ പരിചയപ്പെടുത്തുന്നു. വാക്യാരംഭത്തിലെ וּ സ്വാഭാവികമായ മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: അവൻ താമസിക്കേണ്ടിയിരുന്ന
  rationale: יָשַׁב എന്നതിന് ‘ഇരിക്കുക, വസിക്കുക, താമസിക്കുക’ എന്നർഥങ്ങളുണ്ട്. ഇവിടെ ഭവനത്തിന്റെ ഉദ്ദേശിച്ചിരുന്ന ഉപയോഗം സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: חָצֵר הָאַחֶרֶת
  choice: മറ്റേ പ്രാകാരത്തിൽ
  rationale: חָצֵר കൊട്ടാരത്തിലെ പ്രാകാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; നിർദിഷ്ടതയുള്ള രൂപമായതിനാൽ ‘മറ്റേ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִבֵּית לָאוּלָם
  choice: മണ്ഡപത്തിനു പിന്നിലായി
  rationale: ഇത് വ്യാഖ്യാനിക്കാൻ പ്രയാസമുള്ള സ്ഥലസൂചക പ്രയോഗമാണ്. ഭവനം മണ്ഡപത്തിൽനിന്ന് അകത്തോട്ടോ പിന്നിലോട്ടോ മാറിയിരുന്നുവെന്ന പൊതുവായ സ്ഥലബന്ധം വായനാസൗകര്യത്തോടെ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: ഇതേ പണിപ്പോലെയായിരുന്നു
  rationale: מַעֲשֶׂה ഇവിടെ പ്രവൃത്തിയെക്കാൾ കെട്ടിടത്തിന്റെ പണിയോ നിർമാണശൈലിയോ സൂചിപ്പിക്കുന്നു; താരതമ്യവും നിലനിർത്തുന്നു.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: ഒരു ഭവനം അവൻ പണിതു
  rationale: നിർമാണവിവരണത്തിലെ തുടർച്ചയായ ഭൂതകാലപ്രവൃത്തിയായി yiqtol രൂപം പരിഭാഷപ്പെടുത്തി; וּയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-വേണ്ടിയും’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: לְבַת פַּרְעֹה
  choice: ഫറവോന്റെ മകൾക്കുവേണ്ടി
  rationale: ഹീബ്രായ സംയുക്തബന്ധത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: ശലോമോൻ വിവാഹം ചെയ്ത
  rationale: ഒരു സ്ത്രീയെ സംബന്ധിച്ചുള്ള לָקַח എന്ന ക്രിയയ്ക്ക് ഇവിടെ വിവാഹം കഴിക്കുക എന്ന പതിവർഥമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: כָּאוּלָם הַזֶּה
  choice: ഈ മണ്ഡപംപോലെ
  rationale: אוּלָם രാജകീയ കെട്ടിടസന്ദർഭത്തിലെ വലിയ മണ്ഡപത്തെ സൂചിപ്പിക്കുന്നു; כ താരതമ്യത്തെ ‘പോലെ’ എന്നു നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം ഉപയോഗിച്ചു. കൊട്ടാരവാസ്തുവിദ്യയുടെ പശ്ചാത്തലത്തിൽ ‘ഭവനം’, ‘പ്രാകാരം’, ‘മണ്ഡപം’ എന്നീ പദങ്ങൾ ഏകീകരിച്ചു. ദുഷ്കരമായ സ്ഥലസൂചകവാക്യത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
