base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: ml
  text: അവൻ ദേവാലയത്തിന്റെ പൂമുഖത്ത് തൂണുകൾ സ്ഥാപിച്ചു. വലത്തുവശത്തെ തൂൺ സ്ഥാപിച്ച് അതിന് യാഖീൻ[a] എന്നു പേരിട്ടു; പിന്നെ ഇടത്തുവശത്തെ തൂൺ സ്ഥാപിച്ച് അതിന് ബോവസ് എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യാഖീൻ, ബോവസ് എന്നിവ ഹീബ്രുവിലുള്ള തൂണുകളുടെ പേരുകളുടെ ലിപ്യന്തരങ്ങളാണ്; അവയുടെ സാധ്യതയുള്ള അർഥങ്ങളുടെ വിവർത്തനങ്ങളല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: സ്ഥാപിച്ചു
  rationale: ഹിഫ്ഈൽ രൂപത്തിലുള്ള קום ഇവിടെ ഒരു വസ്തുവിനെ നിർത്തുക അഥവാ അതിന്റെ സ്ഥാനത്ത് ഉറപ്പിക്കുക എന്നർഥം നൽകുന്നു; തൂണുകളുടെ പശ്ചാത്തലത്തിൽ ‘സ്ഥാപിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הָעַמֻּדִים
  choice: തൂണുകൾ
  rationale: עַמּוּד കെട്ടിടത്തിലെ തൂണുകളെയോ സ്തംഭങ്ങളെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ‘തൂണുകൾ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: לְאֻלָם הַהֵיכָל
  choice: ദേവാലയത്തിന്റെ പൂമുഖത്ത്
  rationale: אוּלָם ദേവാലയത്തിന്റെ മുൻഭാഗത്തെ മണ്ഡപം/പൂമുഖം സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ לְ സ്ഥലസൂചനയായി എടുത്തിരിക്കുന്നു.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: വലത്തുവശത്തെ തൂൺ
  rationale: יְמָנִי എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലസൂചന നിലനിർത്തുന്നു; തെക്കുഭാഗം എന്നു വ്യാഖ്യാനിച്ച് അധികം നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: അതിന് … എന്നു പേരിട്ടു
  rationale: ‘അതിന്റെ പേര് വിളിച്ചു’ എന്ന ഹീബ്രു നാമകരണപ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָכִין
  choice: യാഖീൻ
  rationale: തൂണിന്റെ ഹീബ്രു പേര് അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: ഇടത്തുവശത്തെ തൂൺ
  rationale: שְׂמָאלִי എന്ന പദത്തിന്റെ ‘ഇടതുവശത്തുള്ള’ എന്ന അർഥം സമാന്തരഘടനയോടെ നിലനിർത്തുന്നു.
- source_word: בֹּעַז
  choice: ബോവസ്
  rationale: തൂണിന്റെ ഹീബ്രു പേര് അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു; അവസാന വ്യഞ്ജനത്തിന്റെ ഹീബ്രു ഉച്ചാരണം സൂചിപ്പിക്കാൻ ‘സ്’ ഉപയോഗിക്കുന്നു.
