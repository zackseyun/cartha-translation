translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ ആവർത്തനം ഭാഗികമായി നിലനിർത്തുകയും നാമകരണപ്രയോഗം സ്വാഭാവിക മലയാളത്തിലാക്കുകയും ചെയ്തു. അടിക്കുറിപ്പ് ചിഹ്നം ആദ്യ പേരിനോടു ചേർത്തിരിക്കുന്നു; അതിലെ വിശദീകരണം രണ്ടു പേരുകൾക്കും ബാധകമാണ്.
