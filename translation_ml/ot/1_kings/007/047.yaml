translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തൂക്കിനോക്കാതെ വിട്ടു’ എന്നത് സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു; എന്നാൽ എബ്രായവാക്യത്തിന്റെ ഘടനാപരവും പദാർഥപരവുമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
