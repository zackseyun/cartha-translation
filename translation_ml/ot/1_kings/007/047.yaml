source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: ml
  text: ശലോമോൻ എല്ലാ പാത്രങ്ങളും തൂക്കിനോക്കാതെ വിട്ടു; അവ എണ്ണത്തിൽ വളരെ ഏറെയായിരുന്നതിനാൽ[a] വെങ്കലത്തിന്റെ തൂക്കം നിർണയിക്കപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പാത്രങ്ങൾ എണ്ണത്തിൽ വളരെ ഏറെയായിരുന്നതിനാൽ ശലോമോൻ അവയെല്ലാം വിട്ടു; വെങ്കലത്തിന്റെ തൂക്കം അന്വേഷിച്ചറിഞ്ഞില്ല.”'
    reason: וַיַּנַּח എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വിട്ടു/അങ്ങനെതന്നെ വെച്ചു’ എന്നും לֹא נֶחְקַר എന്നതിന് ‘അന്വേഷിച്ചറിഞ്ഞില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘തൂക്കിനോക്കാതെ’ എന്ന ആശയം ആദ്യഭാഗത്തിൽ വ്യക്തമാക്കാതെയും മൂലവാക്യം വായിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: തൂക്കിനോക്കാതെ വിട്ടു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വിട്ടു/അങ്ങനെതന്നെ വെച്ചു’ എന്നാണ്. തുടർന്നുള്ള വാക്യഭാഗം വെങ്കലത്തിന്റെ തൂക്കം നിർണയിക്കപ്പെട്ടില്ലെന്നു വ്യക്തമാക്കുന്നതിനാൽ, ഇവിടെ ചെയ്യാതെ വിട്ട കാര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ കൂടുതൽ അക്ഷരാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הַכֵּלִים
  choice: ആ പാത്രങ്ങളെല്ലാം
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ ഈ സന്ദർഭത്തിൽ כֵּלִים എന്ന വിശാലപദത്തിന് ‘പാത്രങ്ങൾ’ വ്യക്തവും പതിവുമായ മലയാള പരിഭാഷയാണ്; നിർദ്ദിഷ്ടത സൂചിപ്പിക്കാൻ ‘ആ’ ചേർത്തിരിക്കുന്നു.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: അവ അത്യധികം ഉണ്ടായിരുന്നതിനാൽ
  rationale: מִן ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ച മְאֹד ശക്തമായ ഊന്നൽ നൽകുന്നു. ‘അത്യധികം’ ആ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא נֶחְקַר
  choice: നിർണയിക്കപ്പെട്ടില്ല
  rationale: חקר എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ അന്വേഷിച്ചറിഞ്ഞ് കൃത്യമായി നിശ്ചയിക്കുക എന്ന ആശയം നൽകുന്നു. തൂക്കത്തിന്റെ സന്ദർഭത്തിൽ ‘നിർണയിക്കപ്പെട്ടില്ല’ യോജിക്കുന്നു; അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִשְׁקַל
  choice: തൂക്കം
  rationale: അളവായ ഭാരത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദമാണിത്.
- source_word: הַנְּחֹשֶׁת
  choice: വെങ്കലം
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ പശ്ചാത്തലത്തിൽ נְחֹשֶׁת സാധാരണയായി വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു; ‘ചെമ്പ്’ എന്ന സാധ്യതയെക്കാൾ സന്ദർഭോചിതമാണ്.
