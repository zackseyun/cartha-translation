- from: ശലോമോൻ ആ പാത്രങ്ങളെല്ലാം തൂക്കിനോക്കാതെ വിട്ടു; അവ അത്യധികം ഉണ്ടായിരുന്നതിനാൽ[a] വെങ്കലത്തിന്റെ തൂക്കം നിർണയിക്കപ്പെട്ടില്ല.
