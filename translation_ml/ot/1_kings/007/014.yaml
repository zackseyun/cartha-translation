  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: ml
  text: അവൻ നഫ്താലി ഗോത്രത്തിൽപ്പെട്ട ഒരു വിധവയുടെ മകനായിരുന്നു. അവന്റെ പിതാവ് സോരിൽ നിന്നുള്ള ഒരു വെങ്കലപ്പണിക്കാരനായിരുന്നു. വെങ്കലത്തിൽ എല്ലാത്തരം പണികളും ചെയ്യാനുള്ള ജ്ഞാനവും വിവേകവും അറിവുംകൊണ്ട് അവൻ നിറഞ്ഞിരുന്നു.[a] അങ്ങനെ അവൻ ശലോമോൻ രാജാവിന്റെ അടുക്കൽ വന്ന് തന്റെ എല്ലാ ജോലികളും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘വെങ്കലം’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ചെമ്പ് എന്നും വെങ്കലം എന്നും അർഥമാകാം; ആലയോപകരണങ്ങളുടെ ഈ സന്ദർഭത്തിൽ വെങ്കലം യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: ഒരു വിധവയുടെ മകൻ
  rationale: വിധവയായ അമ്മയോടുള്ള ബന്ധത്തെ ഊന്നുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: നഫ്താലിഗോത്രത്തിൽപ്പെട്ട
  rationale: מַטֶּה ഇവിടെ വംശീയ-സാമൂഹിക അർഥത്തിലുള്ള ‘ഗോത്രം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אִישׁ צֹרִי
  choice: സോർദേശക്കാരനായ
  rationale: צֹרִי എന്ന സോർ സ്വദേശസൂചകത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: വെങ്കലപ്പണിക്കാരൻ
  rationale: חֹרֵשׁ ഒരു വൈദഗ്ധ്യമുള്ള ലോഹപ്പണിക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്; ആലയോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ נְחֹשֶׁת എന്നതിന് ‘വെങ്കലം’ യോജിക്കുന്നു.
- source_word: וַיִּמָּלֵא אֶת הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: ജ്ഞാനവും വിവേകവും അറിവും അവനിൽ നിറഞ്ഞിരുന്നു
  rationale: ലഭിച്ച പ്രാപ്തിയെ സൂചിപ്പിക്കുന്ന നിഫാൽ ഭാവവും മൂന്നു ശേഷികളുടെ വേർതിരിവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; നിറച്ചത് ആരെന്ന് പാഠം പറയാത്തതിനാൽ ഒരു കർത്താവിനെയും കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: വെങ്കലത്തിൽ എല്ലാത്തരം പണികളും ചെയ്യാനുള്ള
  rationale: പ്രവൃത്തികളുടെ വിശാലമായ പരിധിയും ഉപയോഗിച്ച വസ്തുവും വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: അങ്ങനെ അവൻ ശലോമോൻ രാജാവിന്റെ അടുക്കൽ വന്ന്
  rationale: വയിക്തോൽ രൂപത്തിന്റെ കഥനതുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: തന്റെ എല്ലാ പണികളും ചെയ്തു
  rationale: പ്രത്യയം ആരാമിന്റെ സ്വന്തം ജോലി/ചുമതല എന്ന സ്വാഭാവിക അർഥത്തിൽ നൽകുന്നു; ‘പൂർത്തിയാക്കി’ അല്ലെങ്കിൽ ‘ഏല്പിച്ച’ എന്ന ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ജ്ഞാനം, വിവേകം, അറിവ് എന്നിവകൊണ്ട് നിറഞ്ഞതിന്റെ പ്രവർത്തകൻ
  choice: പ്രവർത്തകനെ പേരെടുത്ത് പറയാതെ ‘അവനിൽ നിറഞ്ഞിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവം അവനെ നിറച്ചു’
  rationale: സന്ദർഭത്തിൽ ദൈവിക ദാനത്തിന്റെ ആശയം ഉണ്ടായേക്കാമെങ്കിലും ഈ വാക്യത്തിലെ എബ്രായപാഠം പ്രവർത്തകനെ വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ പാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായതിനാൽ സ്വീകരിച്ചു; കരകൗശല വൈദഗ്ധ്യം വ്യക്തമാക്കാൻ ‘വെങ്കലപ്പണിക്കാരൻ’ ഉപയോഗിച്ചു. പാഠത്തിൽ ഇല്ലാത്ത ദൈവിക പ്രവർത്തകനെ ചേർത്തിട്ടില്ല.
