  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാസ്തുവിദ്യാഭാഷ ഉപയോഗിച്ചു. ‘മുഴം’ പരമ്പരാഗത ബൈബിൾ അളവുപദമായി നിലനിർത്തി. എബ്രായവാക്യത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിച്ചെങ്കിലും ആവർത്തിച്ച ബഹുവചന സർവനാമങ്ങൾ മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ സാധ്യതയുള്ള സൂചനകൾ വ്യക്തമാക്കിയിട്ടുണ്ട്.
