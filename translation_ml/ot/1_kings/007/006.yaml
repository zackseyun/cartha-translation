  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: ml
  text: അവൻ തൂണുകളുടെ മണ്ഡപം പണിതു; അതിന് അമ്പതു മുഴം നീളവും മുപ്പതു മുഴം വീതിയും ഉണ്ടായിരുന്നു. തൂണുകളുടെ മുമ്പിൽ ഒരു പൂമുഖവും[a] അവയുടെ മുമ്പിൽ തൂണുകളും ഒരു മേൽമൂടിയും[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മണ്ഡപം’ എന്നും ‘പൂമുഖം’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ടു സ്ഥലങ്ങളിലും എബ്രായത്തിൽ ഒരേ പദമാണ് (אוּלָם). രണ്ടാമത്തെ പ്രയോഗം തൂണുകളുടെ മണ്ഡപത്തോടു ചേർന്ന മുൻവശത്തെ പ്രവേശനഘടകത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മേൽമൂടി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന്റെ (עָב) അർഥം ഈ വാസ്തുവിദ്യാസന്ദർഭത്തിൽ അനിശ്ചിതമാണ്. ‘ഉമ്മറപ്പടി,’ ‘തുലാങ്ങൾകൊണ്ടുള്ള ഘടന,’ അല്ലെങ്കിൽ മറ്റൊരു മൂടിയ ഘടകം എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: തൂണുകളുടെ മണ്ഡപം
  rationale: പ്രധാന കെട്ടിടത്തെ വിശാലമായ ഒരു മണ്ഡപമായി അവതരിപ്പിക്കുകയും ‘തൂണുകളുടെ’ എന്ന വിശേഷണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עָשָׂה
  choice: പണിതു
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ഉണ്ടാക്കി’ എന്നാണെങ്കിലും കെട്ടിടനിർമാണസന്ദർഭത്തിൽ ‘പണിതു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: അതിന് അമ്പതു മുഴം നീളവും മുപ്പതു മുഴം വീതിയും ഉണ്ടായിരുന്നു
  rationale: എബ്രായ അളവുപ്രയോഗവും കൃത്യമായ അളവുകളും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: തൂണുകളുടെ മുമ്പിൽ ഒരു പൂമുഖം
  rationale: രണ്ടാമത്തെ אוּלָם പ്രധാന മണ്ഡപത്തിന്റെ മുൻവശത്തെ പ്രവേശനഘടകത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; ബഹുവചന സർവനാമത്തിന്റെ സാധ്യതയുള്ള മുൻപദമായ തൂണുകളെ വ്യക്തമാക്കുന്നു.
- source_word: וְעַמֻּדִים
  choice: തൂണുകളും
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ഏകോപിത ഘടനയെ അമിതമായി വിശദീകരിക്കാതെ തൂണുകളെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וְעָב
  choice: ഒരു മേൽമൂടിയും
  rationale: ഈ വാസ്തുവിദ്യാസന്ദർഭത്തിലെ അപൂർവവും അനിശ്ചിതവുമായ പദത്തിന് മേൽഭാഗത്തെ മൂടുന്ന ഘടകം എന്ന സാധ്യത സൂചിപ്പിക്കുന്ന പൊതുവായ പരിഭാഷയാണ്; നിർദ്ദിഷ്ട പുനർനിർമാണത്തിൽ അമിതമായി ഉറച്ചുനിൽക്കുന്നില്ല.
- source_word: עַל־פְּנֵיהֶם
  choice: അതിന്റെ മുമ്പിൽ
  rationale: അവസാനത്തെ ബഹുവചനപ്രയോഗത്തിന്റെ കൃത്യമായ വാസ്തുവിദ്യാ സൂചന വ്യക്തമല്ല; മലയാളത്തിൽ മുൻവശത്തെ ഘടനയോടുള്ള സ്ഥാനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
