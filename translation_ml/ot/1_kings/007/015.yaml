id: 1KI.7.15
reference: 1 Kings 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: ml
  text: അവൻ വെങ്കലംകൊണ്ട് രണ്ടു തൂണുകൾ വാർത്തെടുത്തു. ഒരു തൂണിന്റെ ഉയരം പതിനെട്ടു മുഴമായിരുന്നു; പന്ത്രണ്ടു മുഴം നീളമുള്ള ഒരു ചരട് രണ്ടാമത്തെ തൂണിനെ ചുറ്റിയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּצַר
  choice: വാർത്തുണ്ടാക്കി
  rationale: വെങ്കലത്തിൽ നിർമിച്ച വലിയ തൂണുകളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ലോഹം വാർത്തു രൂപപ്പെടുത്തുന്ന പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘രൂപപ്പെടുത്തി’ എന്നതിനെക്കാൾ ‘വാർത്തുണ്ടാക്കി’ കൃത്യമാണ്.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: രണ്ടു തൂണുകൾ
  rationale: ക്ഷേത്രനിർമാണസന്ദർഭത്തിൽ עַמּוּדִים എന്നതിന് സ്വാഭാവികവും പതിവുമായ മലയാളപദം ‘തൂണുകൾ’ ആണ്.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: പുരാതന വാസ്തുവിദ്യാ-ലോഹപ്പണി സന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു; ‘ചെമ്പ്’ എന്നത് സാധ്യതയെ അനാവശ്യമായി ചുരുക്കും.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: പതിനെട്ടു മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ ആധുനിക അളവിലേക്കു മാറ്റാതെ മലയാളത്തിലെ പരമ്പരാഗത സമാനപദമായ ‘മുഴം’ ഉപയോഗിച്ചു.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: ഒരു തൂണിന്റെ ഉയരം
  rationale: എബ്രായ നാമവാക്യഘടനയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം സ്വീകരിച്ചു.
- source_word: וְחוּט
  choice: ഒരു ചരട്
  rationale: חוּט എന്നത് നൂൽ, ചരട്, അളവുകയർ എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ തൂണിന്റെ ചുറ്റളവുമായി ബന്ധപ്പെട്ടതിനാൽ ‘ചരട്’ സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: പന്ത്രണ്ടു മുഴം നീളമുള്ള
  rationale: ചരടിനെക്കുറിച്ചുള്ള അളവ് മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കാൻ ‘നീളമുള്ള’ എന്നു ചേർത്തു; സംഖ്യയും പുരാതന അളവും അതേപടി നിലനിർത്തി.
- source_word: יָסֹב
  choice: ചുറ്റിയിരുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘ചുറ്റുക/വലയം ചെയ്യുക’ നേരിട്ട് നിലനിർത്തുന്നു; ‘ചുറ്റളവ് അളന്നു’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് അധികമായി ചേർത്തിട്ടില്ല.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: രണ്ടാമത്തെ തൂണിനെ
  rationale: ലഭ്യമായ WLC എബ്രായപാഠത്തിൽ വ്യക്തമായി ‘രണ്ടാമത്തെ തൂൺ’ എന്നാണ്; ഇംഗ്ലീഷ് consultation പാഠത്തിലെ ‘it’ എന്നതിനെ പിന്തുടരാതെ മൂലപാഠത്തിലെ അസാധാരണമായ വ്യത്യാസം സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമാണവിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായപാഠം ആദ്യ തൂണിന്റെ ഉയരവും രണ്ടാമത്തെ തൂണിനെ ചുറ്റിയ ചരടും പറയുന്ന അസമത്വം വിശദീകരിച്ചോ ഒത്തുചേർത്തോ മാറ്റാതെ നിലനിർത്തി.
