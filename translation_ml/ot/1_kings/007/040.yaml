source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: ml
  text: ഹീരാം കഴുകുപാത്രങ്ങളും കോരികകളും കിണ്ണങ്ങളും[a] ഉണ്ടാക്കി. അങ്ങനെ, യഹോവയുടെ ആലയത്തിനായി ശലോമോൻ രാജാവിനുവേണ്ടി ചെയ്ത സകല വേലയും ഹീരാം പൂർത്തിയാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തളിക്കാനുള്ള പാത്രങ്ങൾ’; ബലികർമങ്ങളിൽ രക്തമോ മറ്റു ദ്രാവകങ്ങളോ സ്വീകരിക്കാനോ തളിക്കാനോ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങൾ.
    reason: מִּזְרָקוֹת എന്ന പദത്തിന്റെ പ്രത്യേക ബലികർമപരമായ അർഥസാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: കഴുകുപാത്രങ്ങൾ
  rationale: ആലയശുശ്രൂഷയിൽ കഴുകുന്നതിനുപയോഗിച്ച വലിയ പാത്രങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. പൊതുവായ ‘പാത്രങ്ങൾ’ എന്നതിനെക്കാൾ ഉപയോഗം വ്യക്തമാക്കുകയും പുരാതനമായ സാങ്കേതികപദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: יָּעִים
  choice: ചാരം കോരാനുള്ള കോരികകൾ
  rationale: യാഗപീഠത്തിലെ ചാരമോ കനലോ നീക്കാനുള്ള ഉപകരണങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്; ‘കോരികകൾ’ എന്നതിന് നൽകിയ ചുരുങ്ങിയ വിശദീകരണം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: מִּזְרָקוֹת
  choice: കിണ്ണങ്ങൾ
  rationale: ബലികർമങ്ങളിൽ ദ്രാവകങ്ങളോ രക്തമോ സ്വീകരിക്കാനും തളിക്കാനും ഉപയോഗിച്ച പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലവും സ്വാഭാവികവുമായ മലയാളപദം; പ്രത്യേക ആചാരപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיְכַל
  choice: പൂർത്തിയാക്കി
  rationale: ഏൽപ്പിക്കപ്പെട്ട പ്രവൃത്തി മുഴുവനായി തീർത്തുവെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כָּל הַמְּלָאכָה
  choice: സകല വേലയും
  rationale: מְלָאכָה എന്ന വിശാലമായ പദത്തെ കരകൗശലത്തിലേക്കു മാത്രം ചുരുക്കാതെ സംഗ്രഹവാക്യത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹോവയുടെ ആലയം
  rationale: ‘വീട്’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ ഈ സന്ദർഭത്തിലെ ദേവാലയത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ദിവ്യനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: חִירוֹם / חִירָם
  choice: ഹീരാം
  rationale: ഒരേ വ്യക്തിയുടെ എബ്രായ അക്ഷരവ്യത്യാസമുള്ള പേരുകൾക്ക് മലയാളത്തിൽ ഏകീകൃതവും പരിചിതവുമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിനായി ചെയ്ത
  rationale: עשה എന്ന ക്രിയയുടെ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുകയും സംഗ്രഹവാക്യത്തിൽ മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ദിവ്യനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആലയോപകരണങ്ങൾക്ക് അനാവശ്യമായി പുരാതനമോ സഭാവിഭാഗവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; ‘സകല വേലയും’ എന്ന ബൈബിൾശൈലിയിലുള്ള പ്രയോഗം സംഗ്രഹത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
