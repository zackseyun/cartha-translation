    issue: The main text specifies that the shovels are for removing ashes.
    rationale: Although this fits the temple-furnishing context, יָעִים itself simply names shovels/scoops in this verse. Omitting the explanatory addition better preserves the lexical breadth of the source.
  - severity: low
    issue: The paired phrases “ആലയത്തിനുവേണ്ടി ശലോമോൻ രാജാവിനായി” are somewhat heavy in their current order.
    rationale: Reordering them as work done for King Solomon for Yahweh’s house reads more smoothly while preserving the source relationships.
  - severity: low
    issue: The footnote’s alternate term “തളിപ്പുപാത്രങ്ങൾ” is less natural in modern standard Malayalam.
    rationale: “തളിക്കാനുള്ള പാത്രങ്ങൾ” conveys the same ritual alternative more transparently.
