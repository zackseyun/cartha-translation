id: 1KI.7.44
reference: 1 Kings 7:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/יָּ֖ם הָ/אֶחָ֑ד וְ/אֶת הַ/בָּקָ֥ר שְׁנֵים עָשָׂ֖ר תַּ֥חַת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/044.yaml
  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: ml
  text: ആ ഏക സമുദ്രവും[a] സമുദ്രത്തിനടിയിലെ പന്ത്രണ്ട് കാളകളും;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ ഏക ജലസംഭരണിയും അതിനടിയിലെ പന്ത്രണ്ട് കാളകളും.’ വലിയ ജലസംഭരണിയെ എബ്രായഭാഷയിൽ ‘സമുദ്രം’ എന്നു വിളിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: സമുദ്രം
  rationale: ദേവാലയോപകരണങ്ങളുടെ ഈ പട്ടികയിൽ ഈ പദം വലിയ വാർപ്പുലോഹ ജലസംഭരണിയുടെ പരമ്പരാഗത നാമമാണ്. ‘സമുദ്രം’ എന്ന മൂലരൂപകം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ അർത്ഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הָאֶחָד
  choice: ആ ഏക
  rationale: നിശ്ചയാർഥക പ്രത്യയത്തോടുകൂടിയ സംഖ്യ ഒറ്റയായ ഈ സമുദ്രത്തെ ചുറ്റുപാടിലുള്ള അനേകം ഉപകരണങ്ങളിൽനിന്ന് വേർതിരിക്കുന്നു; ‘ആ ഏക’ അതിന്റെ നിശ്ചിതത്വവും എണ്ണൽഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: הַבָּקָר
  choice: കാളകൾ
  rationale: ഇവിടെ സമുദ്രത്തെ താങ്ങിനിൽക്കുന്ന ഗോരൂപങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ആൺലിംഗം നിർബന്ധമായി നിർണയിക്കാതെ തന്നെ, മലയാളത്തിലെ ദേവാലയവിവരണത്തിന് സ്വാഭാവികമായ പൊതുപദമായി ‘കാളകൾ’ ഉപയോഗിക്കുന്നു.
- source_word: שְׁנֵים עָשָׂר
  choice: പന്ത്രണ്ട്
  rationale: മൂലത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: תַּחַת
  choice: അടിയിലെ
  rationale: കാളകളുടെ ഭൗതികസ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְאֶת
  choice: -വും
  rationale: ആവർത്തിച്ചുവരുന്ന സംയോജകവും കർമചിഹ്നവും പട്ടിക തുടരുന്നു; മലയാളത്തിൽ കർമചിഹ്നം പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ ‘-വും’ ബന്ധകശക്തി വഹിക്കുന്നു.
