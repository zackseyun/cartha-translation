translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള നിർമാണവിവരണ ശൈലി ഉപയോഗിച്ചു. അപൂർവ വാസ്തുശില്പപദമായ הַטְּפָחוֹת സംബന്ധിച്ച അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പൊതുവായ പ്രയോഗത്തിലൂടെയും അടിക്കുറിപ്പിൽ വിശദീകരണത്തിലൂടെയും സംരക്ഷിച്ചു.
