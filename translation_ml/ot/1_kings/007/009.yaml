reference: 1 Kings 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: ml
  text: ഇവയെല്ലാം വിലകൂടിയ കല്ലുകളായിരുന്നു[a]; അവ അളവനുസരിച്ച് ചെത്തിയൊരുക്കിയതും അകത്തും പുറത്തും ഈർച്ചവാൾകൊണ്ട് മുറിച്ചൊരുക്കിയതുമായിരുന്നു—അടിത്തറമുതൽ മുകളിലെ അരികുവരെ, പുറത്തുള്ള ഭാഗത്ത് വലിയ അങ്കണംവരെയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിലപിടിപ്പുള്ള കല്ലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ രത്നങ്ങളെയല്ല, വിലകൂടിയതും ഉയർന്ന നിലവാരമുള്ളതുമായ നിർമാണക്കല്ലുകളെയായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ ‘മുകളിലെ അരികുകൾ’ എന്ന പദത്തിന്റെ കൃത്യമായ വാസ്തുശില്പസൂചന വ്യക്തമല്ല. അത് മുകളിലെ പൂർത്തീകരണഭാഗത്തെയോ ഏറ്റവും മുകളിലുള്ള കൽനിരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: വിലകൂടിയ കല്ലുകൾ
  rationale: നിർമാണസന്ദർഭത്തിൽ יְקָרֹת രത്നങ്ങളെയല്ല, വിലകൂടിയതും ഉയർന്ന നിലവാരമുള്ളതുമായ നിർമാണക്കല്ലുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിലകൂടിയ’ എന്നത് ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כְּמִדֹּת גָּזִית
  choice: അളവനുസരിച്ച് ചെത്തിയെടുത്ത്
  rationale: מִדּוֹת സൂചിപ്പിക്കുന്ന കൃത്യമായ അളവും גָּזִית സൂചിപ്പിക്കുന്ന ചെത്തിയൊരുക്കിയ കല്ലിന്റെ ആശയവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: ഈർച്ചവാൾകൊണ്ട് അറുത്തവ
  rationale: ക്രിയയോടൊപ്പം ഉപകരണവും വ്യക്തമായി പറയുന്ന എബ്രായപ്രയോഗം സംരക്ഷിക്കുന്നു; കല്ല് ഈർച്ചവാൾ ഉപയോഗിച്ച് അറുത്തൊരുക്കിയതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִבַּיִת וּמִחוּץ
  choice: അകത്തും പുറത്തും
  rationale: എബ്രായത്തിലെ സ്ഥലപരമായ ദ്വന്ദ്വം നേരിട്ട് നിലനിർത്തുന്നു; ഇത് കല്ലുപണിയുടെ അകത്തെയും പുറത്തെയും വശങ്ങളെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: מִמַּסָּד
  choice: അടിത്തറമുതൽ
  rationale: കെട്ടിടസന്ദർഭത്തിലെ מַסָּד എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാള വാസ്തുശില്പപദം ‘അടിത്തറ’ ആണ്.
- source_word: עַד הַטְּפָחוֹת
  choice: മുകളിലെ അരികുവരെ
  rationale: הַטְּפָחוֹת എന്ന അപൂർവ വാസ്തുശില്പപദത്തിന്റെ കൃത്യമായ സൂചന അനിശ്ചിതമാണ്. കെട്ടിടത്തിന്റെ മുകളിലെ പൂർത്തീകരണഭാഗം എന്ന പൊതുവായ അർഥം നൽകുകയും അതിരുകടന്ന കൃത്യത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: പുറത്ത് വലിയ അങ്കണംവരെയും
  rationale: വിവരണം പുറത്തേക്കു വലിയ അങ്കണംവരെ വ്യാപിക്കുന്നതായി നേരിട്ട് അവതരിപ്പിക്കുന്നു; חָצֵר എന്നതിന് രാജകീയ കെട്ടിടസന്ദർഭത്തിൽ ‘അങ്കണം’ സ്വാഭാവികമാണ്.
