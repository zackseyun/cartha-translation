translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പുരാതന ചക്രനിർമാണത്തിലെ ഘടകങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളിൽ നൽകിയിരിക്കുന്നു; അപൂർവ എബ്രായ സാങ്കേതികപദങ്ങളിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
