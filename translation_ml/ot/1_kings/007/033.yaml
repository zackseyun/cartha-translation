  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: ml
  text: ചക്രങ്ങളുടെ നിർമ്മിതി രഥചക്രത്തിന്റെ നിർമ്മിതിപോലെയായിരുന്നു. അവയുടെ അച്ചുതണ്ടുകളും[a] ചക്രവക്കുകളും ആരക്കാലുകളും ചക്രനാഭികളും[b]—എല്ലാം ലോഹത്തിൽ വാർത്തെടുത്തവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അച്ചുതണ്ടുകൾ” എന്നതിന് “പിടികൾ” എന്നുമാകാം. എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘കൈകൾ’ എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണ്; എന്നാൽ ചക്രത്തിന്റെ ഈ സന്ദർഭത്തിൽ അത് അച്ചുമായി ബന്ധപ്പെട്ട ഭാഗങ്ങളെയോ താങ്ങുകളെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ആരക്കാലുകൾ” എന്നതിന് “വളയപ്പട്ടകൾ” എന്നും “ചക്രനാഭികൾ” എന്നതിന് “ബന്ധനഭാഗങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ രണ്ട് എബ്രായ സാങ്കേതികപദങ്ങളും അപൂർവമായതിനാൽ അവയുടെ കൃത്യമായ അർഥം ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה / כְּמַעֲשֵׂה
  choice: നിർമ്മിതി / നിർമ്മിതിപോലെ
  rationale: കരകൗശലത്തെയും നിർമാണരീതിയെയും സൂചിപ്പിക്കുന്ന താരതമ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הָאֹפַנִּים / אוֹפַן הַמֶּרְכָּבָה
  choice: ചക്രങ്ങൾ / രഥചക്രം
  rationale: പുരാതന പശ്ചാത്തലത്തിലെ ‘രഥം’ എന്ന സാധാരണ അർഥവും താരതമ്യത്തിലെ ഏകവചനവും സംരക്ഷിക്കുന്നു.
- source_word: יְדוֹתָם
  choice: അച്ചുതണ്ടുകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘കൈകൾ/പിടികൾ’ എന്നാണെങ്കിലും, ചക്രഘടകങ്ങളുടെ ഈ പട്ടികയിൽ അച്ചുമായി ബന്ധപ്പെട്ട ഭാഗങ്ങളെയാണ് ഏറ്റവും സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
- source_word: גַבֵּיהֶם
  choice: ചക്രവക്കുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ഉയർന്ന പുറംഭാഗം/പിൻഭാഗം എന്ന ആശയമുള്ള പദം ഇവിടെ ചക്രത്തിന്റെ പുറംവക്കിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു.
- source_word: חִשֻּׁקֵיהֶם
  choice: ആരക്കാലുകൾ
  rationale: അപൂർവമായ സാങ്കേതികപദത്തിന് ചക്രത്തിന്റെ നാഭിയെയും വക്കിനെയും ബന്ധിപ്പിക്കുന്ന ഘടകങ്ങൾ എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: חִשֻּׁרֵיהֶם
  choice: ചക്രനാഭികൾ
  rationale: ചക്രഭാഗങ്ങളുടെ പട്ടികയിൽ കേന്ദ്രഭാഗം എന്ന സാധ്യതയുള്ള അർഥം ലളിതവും കൃത്യവുമായ മലയാള സാങ്കേതികപദത്തിൽ നൽകുന്നു; പദത്തിന്റെ അപൂർവത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַכֹּל מוּצָק
  choice: എല്ലാം ലോഹത്തിൽ വാർത്തെടുത്തവയായിരുന്നു
  rationale: יצק എന്ന ധാതുവിന്റെ ലോഹവാർപ്പിനെ സൂചിപ്പിക്കുന്ന കർമണി അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
