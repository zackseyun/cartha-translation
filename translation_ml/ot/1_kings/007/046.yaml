translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാർത്തെടുത്തു’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ലോഹവാർപ്പുപ്രയോഗമാണ്. മൂലപാഠത്തിലെ പദക്രമം മലയാളസ്വാഭാവികതയ്ക്കായി ക്രമീകരിച്ചെങ്കിലും രാജാവ്, സ്ഥലം, പ്രവൃത്തി എന്നിവയുടെ ബന്ധം സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
