base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: ml
  text: യോർദ്ദാൻ സമതലത്തിൽ[a], സുക്കോത്തിനും സാരെഥാനുമിടയിൽ, കട്ടിയുള്ള കളിമൺ നിലത്ത്[c] രാജാവ് അവയെ വാർത്തെടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോർദ്ദാൻ താഴ്‌വരയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അക്ഷരാർഥത്തിൽ യോർദ്ദാന്റെ പ്രദേശത്തെയോ സമതലത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവയെ ഉരുക്കിയൊഴിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ ലോഹവാർപ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘നിലത്തിന്റെ കട്ടിയിൽ’; ലോഹവാർപ്പിന് അനുയോജ്യമായ സാന്ദ്രമായ കളിമണ്ണായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: യോർദ്ദാൻ സമതലത്തിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ സന്ദർഭത്തിൽ כִּכָּר യോർദ്ദാന്റെ സമതലപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘സമതലം’ എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: יְצָקָם
  choice: അവയെ വാർത്തെടുത്തു
  rationale: יצק ലോഹം ഉരുക്കിയൊഴിച്ച് രൂപപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. വെങ്കലോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ‘വാർത്തെടുത്തു’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികമായ ലോഹവാർപ്പുപദമാണ്; കർമപ്രത്യയം ‘അവയെ’ എന്നു നിലനിർത്തുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമല്ല, നിർദിഷ്ടമായ ‘രാജാവ്’ എന്ന പൊതുനാമമാണ്; അതിനാൽ ശലോമോൻ എന്നു വിശദീകരിച്ചു ചേർത്തിട്ടില്ല.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: കട്ടിയുള്ള കളിമണ്ണിൽവെച്ച്
  rationale: מַעֲבֶה എന്നത് കട്ടി അഥവാ സാന്ദ്രത സൂചിപ്പിക്കുന്നു. ലോഹവാർപ്പിന് അനുയോജ്യമായ കട്ടിയുള്ള മണ്ണാണ് സന്ദർഭസൂചന; ‘കളിമണ്ണ്’ സാധ്യതയുള്ള അർഥം വ്യക്തമാക്കുന്നതിനാൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: സുക്കോത്തിനും സാരെഥാനുമിടയിൽ
  rationale: സ്ഥലനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
