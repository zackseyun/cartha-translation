id: 1KI.7.34
reference: 1 Kings 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַרְבַּ֣ע כְּתֵפ֔וֹת אֶ֚ל אַרְבַּ֣ע פִּנּ֔וֹת הַ/מְּכֹנָ֖ה הָֽ/אֶחָ֑ת מִן הַ/מְּכֹנָ֖ה כְּתֵפֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/034.yaml
  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: ml
  text: ആ ഒരു പീഠത്തിന്റെ നാലു മൂലകളിലും നാലു താങ്ങുകൾ ഉണ്ടായിരുന്നു; അതിന്റെ താങ്ങുകൾ പീഠത്തിന്റെതന്നെ ഭാഗമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפוֹת / כְּתֵפֶיהָ
  choice: താങ്ങുകൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘തോളുകൾ’ എന്നാണെങ്കിലും, ലോഹപ്പീഠത്തിന്റെ ഘടനയിൽ ഇവ താങ്ങിനിൽക്കുന്ന ഘടകങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സാഹചര്യോചിതവുമായ ‘താങ്ങുകൾ’ സ്വീകരിച്ചു.
- source_word: מְכוֹנָה
  choice: പീഠം
  rationale: വെങ്കലത്തൊട്ടിയെ താങ്ങിയിരുന്ന ചലിപ്പിക്കാവുന്ന അടിത്തറയെയോ സ്റ്റാൻഡിനെയോ സൂചിപ്പിക്കുന്നു; ‘പീഠം’ സംക്ഷിപ്തവും മാന്യവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הָאֶחָת
  choice: ആ ഒരു
  rationale: ഹീബ്രായ പാഠത്തിലെ നിർദിഷ്ടമായ ഏകവചനരൂപം നിലനിർത്തുന്നു; ‘ഓരോ’ എന്നു പൊതുവത്കരിക്കാതെ മൂലപാഠത്തിന്റെ അസാധാരണമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: מִן הַמְּכֹנָה
  choice: പീഠത്തിന്റെതന്നെ ഭാഗമായിരുന്നു
  rationale: താങ്ങുകൾ വേറിട്ട് ഘടിപ്പിച്ചതല്ല, പീഠത്തിൽനിന്നുതന്നെ രൂപപ്പെടുത്തിയ ഘടകങ്ങളാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിർമാണവിവരണത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രായത്തിലെ ‘ആ ഒരു പീഠം’ എന്ന നിർദിഷ്ട ഏകവചനത്തിന്റെ സാധ്യതാപരമായ അസ്വാഭാവികത തിരുത്താതെ നിലനിർത്തിയിരിക്കുന്നു.
