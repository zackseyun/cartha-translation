  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: ml
  text: അങ്ങനെ, യഹ്‌വെയുടെ ആലയത്തിനുവേണ്ടി ശലോമോൻ രാജാവ് ചെയ്ത സകല പ്രവൃത്തിയും പൂർത്തിയായി. പിന്നെ ശലോമോൻ തന്റെ പിതാവായ ദാവീദിന്റെ വിശുദ്ധവസ്തുക്കൾ[a]—വെള്ളിയും പൊന്നും പാത്രങ്ങളും—കൊണ്ടുവന്ന് യഹ്‌വെയുടെ ആലയത്തിലെ ഭണ്ഡാരങ്ങളിൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ പിതാവായ ദാവീദ് സമർപ്പിച്ച വസ്തുക്കൾ.” എബ്രായപദം യഹ്‌വെയ്ക്കായി വിശുദ്ധമായി വേർതിരിച്ച വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: പൂർത്തിയായി
  rationale: שלם എന്ന ക്രിയ ഇവിടെ പ്രവൃത്തി മുഴുവനായി തീർന്നു എന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പൂർത്തിയായി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כָּל הַמְּלָאכָה
  choice: സകല പ്രവൃത്തിയും
  rationale: ആലയനിർമാണവും അതിന്റെ ഉപകരണസജ്ജീകരണവും ഉൾപ്പെടുന്ന മുഴുവൻ പ്രവർത്തനത്തെയും מְלָאכָה ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വെയുടെ ആലയം
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ഭവനം’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ ദൈവാലയമാണ് ഉദ്ദേശ്യം; ‘ആലയം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. യְהוָה എന്ന ദിവ്യനാമം ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיָּבֵא
  choice: കൊണ്ടുവന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘അകത്തേക്കു കൊണ്ടുവരുക’ എന്നാണ്; തുടർന്നുള്ള ‘വെച്ചു’ എന്ന ക്രിയയുമായി ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാശൃംഖലയായി നൽകി.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: തന്റെ പിതാവായ ദാവീദിന്റെ വിശുദ്ധവസ്തുക്കൾ
  rationale: קָדְשֵׁי എന്നത് വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട അഥവാ സമർപ്പിക്കപ്പെട്ട വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. മൂലപദത്തിന്റെ വിശുദ്ധി-ബന്ധം നിലനിർത്താൻ ‘വിശുദ്ധവസ്തുക്കൾ’ തെരഞ്ഞെടുത്തു; സമർപ്പിതവസ്തുക്കൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: വെള്ളിയും പൊന്നും പാത്രങ്ങളും
  rationale: כֵּלִים എന്ന വിശാലപദത്തിന് ആലയസന്ദർഭത്തിൽ ‘പാത്രങ്ങൾ’ വ്യക്തവും പതിവുമായ പരിഭാഷയാണ്; വസ്തുക്കളുടെ പട്ടിക മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയരീതിയിൽ നൽകി.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: ഭണ്ഡാരങ്ങളിൽ വെച്ചു
  rationale: נתן ഇവിടെ ‘വയ്ക്കുക’ എന്നും אֹצְרוֹת സംഭരണത്തിനുള്ള ഭണ്ഡാരമുറികൾ എന്നും അർഥമാക്കുന്നു; ബഹുവചനം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ദിവ്യനാമം നേരിട്ട് വന്നതിനാൽ പദവിനാമം ഉപയോഗിക്കാതെ അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: קָדְשֵׁי എന്നതിലെ വിശുദ്ധീകരണം/സമർപ്പണം എന്ന അർഥവ്യാപ്തി
  choice: വിശുദ്ധവസ്തുക്കൾ
  alternative: സമർപ്പിതവസ്തുക്കൾ
  rationale: പദം യഹ്‌വെയ്ക്കായി വേർതിരിച്ച വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധവസ്തുക്കൾ’ മൂലത്തിലെ קדש ധാതുബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; സമർപ്പണത്തിന്റെ ആശയം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘സകല പ്രവൃത്തിയും’, ‘ആലയം’, ‘ഭണ്ഡാരങ്ങൾ’ എന്നിവ വാക്യത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാണ്. എബ്രായത്തിലെ അനുബന്ധവിവരണമായ വെള്ളി, പൊന്ന്, പാത്രങ്ങൾ എന്നിവ ദീർഘവരകൾക്കിടയിൽ നൽകി.
