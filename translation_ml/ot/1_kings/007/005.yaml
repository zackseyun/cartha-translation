  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അപൂർവമായ എബ്രായ വാസ്തുശില്പപദങ്ങളിലെ അനിശ്ചിതത്വവും അവസാന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിരിക്കുന്നു.
