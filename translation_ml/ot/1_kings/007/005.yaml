  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: ml
  text: എല്ലാ വാതിൽത്തുറപ്പുകൾക്കും വാതിൽക്കട്ടിളകൾക്കും ചതുരാകൃതിയിലുള്ള ചട്ടക്കൂടുകളുണ്ടായിരുന്നു[a]; ജനലിനു നേരെ ജനൽ, ഇങ്ങനെ മൂന്നു തവണ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എല്ലാ തുറപ്പുകൾക്കും വാതിൽക്കട്ടിളകൾക്കും ചതുരാകൃതിയിലുള്ള മേൽപ്പടികളുണ്ടായിരുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വാസ്തുശില്പപദം ചട്ടക്കൂടിന്റെ മുകൾഭാഗത്തെയോ മേൽപ്പടിയെയോ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ജനലിനു നേരെ ജനൽ, മൂന്നു തവണ.” ഇത് പരസ്പരം ഒത്തുനിൽക്കുന്ന ജനലുകൾ മൂന്നു നിരകളിലോ നിലകളിലോ ക്രമീകരിച്ചിരുന്നതിനെ സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: വാതിൽത്തുറപ്പുകൾ
  rationale: പദം പൊതുവേ തുറപ്പോ പ്രവേശനമോ സൂചിപ്പിക്കുന്നു; ചലിക്കുന്ന വാതിൽപ്പാളികളെയല്ല, കെട്ടിടത്തിലെ ഘടനാപരമായ തുറപ്പുകളെയാണ് ഇവിടെ വിവരിക്കുന്നത്.
- source_word: מְּזוּזוֹת
  choice: വാതിൽപ്പടികൾ
  rationale: വാതിൽത്തുറപ്പിന്റെ ഇരുവശത്തുമുള്ള കട്ടിളക്കാലുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ വാസ്തുശില്പപദമാണ് ‘വാതിൽപ്പടികൾ’.
- source_word: רְבֻעִים
  choice: ചതുരാകൃതിയിലുള്ള
  rationale: നാലു കോണുകളുള്ള രൂപത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചതുരാകൃതിയിലുള്ള’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: שָׁקֶף
  choice: ചട്ടക്കൂടുകൾ
  rationale: കൃത്യമായ അർഥം അനിശ്ചിതമായ വാസ്തുശില്പപദമാണിത്; മേൽപ്പടിയെ മാത്രം ഉറപ്പിച്ചുപറയാതെ തുറപ്പിനെ ചുറ്റിയുള്ള ഘടന എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מ֧וּל
  choice: എതിരായി
  rationale: പരസ്പരം അഭിമുഖമായോ ഒത്തുനിൽക്കുന്നോ ഉള്ള വിന്യാസമാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: מֶחֱזָה
  choice: ജനൽ
  rationale: ഈ കെട്ടിടവിവരണത്തിൽ കാഴ്ചയ്ക്കുള്ള തുറപ്പിനെയോ ജനലിനെയോ സൂചിപ്പിക്കുന്നു; ‘ജനൽ’ സ്വാഭാവികമായ വാസ്തുശില്പപരിഭാഷയാണ്.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: മൂന്നു തവണ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ ആവർത്തനഭാവം സംരക്ഷിക്കുന്നു; മൂന്നു നിരകളോ നിലകളോ എന്ന വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ നിർബന്ധിക്കുന്നില്ല.
