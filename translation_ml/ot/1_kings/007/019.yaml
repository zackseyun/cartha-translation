  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: ml
  text: പ്രവേശനമണ്ഡപത്തിലുള്ള[a] തൂണുകളുടെ മുകളിലെ മകുടങ്ങൾ ലില്ലിപ്പൂവിന്റെ ആകൃതിയിലുള്ളവയായിരുന്നു[b]—നാലു മുഴം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുഖമണ്ഡപത്തിൽ’ അല്ലെങ്കിൽ ‘പോർട്ടിക്കോയിൽ.’ എബ്രായപദം ദേവാലയത്തിന്റെ പ്രവേശനഹാളിനെയോ മണ്ഡപത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ലില്ലിപ്പൂവിന്റെ പണിയോടുകൂടിയവ.’ ചിലർ ഇവിടെ ഉദ്ദേശിക്കുന്നത് താമരപ്പൂവിന്റെ ആകൃതിയിലുള്ള അലങ്കാരമാണെന്ന് കരുതുന്നു.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠത്തിൽ ‘നാലു മുഴം’ എന്നുമാത്രം. ഈ അളവ് മകുടങ്ങളിലെ ലില്ലിപ്പൂവിന്റെ ആകൃതിയിലുള്ള ഭാഗത്തിന്റെ ഉയരത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתָרֹת
  choice: മകുടങ്ങൾ
  rationale: തൂണുകളുടെ അലങ്കാരപൂർണമായ മുകൾഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന വാസ്തുശില്പപദമായി ‘മകുടങ്ങൾ’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിൽ
  rationale: അക്ഷരാർഥമായ ‘തല’ എന്നതിനുപകരം വാസ്തുശില്പസന്ദർഭത്തിലെ സ്ഥാനം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: ലില്ലിപ്പൂവിന്റെ ആകൃതിയിൽ നിർമിച്ചവ
  rationale: പുഷ്പാകൃതിയിലുള്ള രൂപകല്പനയാണ് ഉദ്ദേശ്യമെന്നു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘പണി’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള പ്രയോഗത്തേക്കാൾ വായനാസൗകര്യമുണ്ട്.
- source_word: בָּאוּלָם
  choice: പ്രവേശനമണ്ഡപത്തിൽ
  rationale: ദേവാലയത്തിന്റെ പ്രവേശനഹാളിനെയോ പോർട്ടിക്കോയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വാസ്തുശില്പാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אַרְבַּע אַמּוֹת
  choice: നാലു മുഴം
  rationale: മൂലപാഠത്തിൽ അളവ് മാത്രമേ നൽകിയിട്ടുള്ളൂ; ‘ഉയരം’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
