translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വാസ്തുശില്പപരമായ കൃത്യതയും മാന്യമായ ശൈലിയും നിലനിർത്തി. മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘ഉയരം’ മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ സാധ്യതയായി മാത്രം സൂചിപ്പിച്ചു.
