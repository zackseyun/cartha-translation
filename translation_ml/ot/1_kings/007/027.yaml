  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: ml
  text: അവൻ വെങ്കലംകൊണ്ട് പത്തു പീഠങ്ങൾ[a] ഉണ്ടാക്കി. ഓരോ പീഠത്തിന്റെയും നീളം നാലു മുഴവും വീതി നാലു മുഴവും ഉയരം മൂന്നു മുഴവും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിത്തറകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ക്ഷേത്രസമുച്ചയത്തിലെ തൊട്ടികളെ താങ്ങിയിരുന്ന വെങ്കലഘടനകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: അവൻ ... ഉണ്ടാക്കി
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമായി ആ തുടർച്ച അറിയിക്കുന്നു.
- source_word: הַמְּכֹנוֹת
  choice: പീഠങ്ങൾ
  rationale: ക്ഷേത്രത്തിലെ തൊട്ടികളെ താങ്ങിനിർത്തിയ വെങ്കലഘടനകളെയാണ് സന്ദർഭത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘പീഠങ്ങൾ’ അവയുടെ പ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു; പദത്തിന്റെ സാധ്യതയുള്ള മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עֶשֶׂר
  choice: പത്തു
  rationale: പീഠങ്ങളുടെ എണ്ണം സൂചിപ്പിക്കുന്ന ലളിതമായ സംഖ്യ.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി പണിതെടുത്ത വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു; മൂലപദത്തിന് ചെമ്പ്/വെങ്കലം എന്ന വിശാല അർഥപരിധിയുണ്ടെങ്കിലും ഇവിടെ ‘വെങ്കലം’ തന്നെയാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: ഓരോ പീഠത്തിനും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു പീഠം’ എന്ന ഘടന ഇവിടെ ഓരോന്നിനെയും പ്രത്യേകം ഉദ്ദേശിക്കുന്ന വിതരണാർഥത്തിലാണ്.
- source_word: אַמָּה
  choice: മുഴം
  rationale: പുരാതന അളവായ ക്യൂബിറ്റിന് മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും സ്വാഭാവികമായ തുല്യപദമാണ് ‘മുഴം’; അനിശ്ചിതമായ ആധുനിക പരിവർത്തനം മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: אֹרֶךְ / רָחְבָּהּ / קוֹמָתָהּ
  choice: നീളം / വീതി / ഉയരം
  rationale: മൂന്നു അളവുകളെയും വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി വേർതിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായത്തിലെ അളവുകൾ ആദ്യം പറഞ്ഞുള്ള വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമായ ഏകവാക്യഘടനയാക്കി; എല്ലാ അളവുകളും സംഖ്യകളും മാറ്റമില്ലാതെ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പിന്റെ അടയാളം ‘cubits’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് מְכֹנוֹת എന്ന പദത്തിന്റെ വിവർത്തനവികല്പത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യവാചകത്തിൽ അതത് ‘പീഠങ്ങൾ’ എന്ന പദത്തിനുശേഷം സ്ഥാപിച്ചു.
