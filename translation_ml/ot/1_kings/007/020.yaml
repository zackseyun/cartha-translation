reference: 1 Kings 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: ml
  text: രണ്ടു തൂണുകളിലും തലപ്പുകൾ ഉണ്ടായിരുന്നു; ജാലികപ്പണിയുടെ[c] അരികിലുള്ള വീർത്ത ഭാഗത്തിന്[b] എതിരേ, അവ മുകളിലുമുണ്ടായിരുന്നു. രണ്ടാമത്തെ തലപ്പിൽ[a] ചുറ്റുമായി നിരനിരയായി ഇരുനൂറ് മാതളനാരങ്ങാ അലങ്കാരങ്ങൾ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘മറ്റേ തലപ്പിൽ.’ ഇവിടെ ‘രണ്ടാമത്തെ’ എന്ന എബ്രായപ്രയോഗം രണ്ടാമത്തെ തൂണിന്റെ സമാനമായ തലപ്പിനെ വേർതിരിച്ചറിയിക്കുന്നതാകാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘വയർ’; തലപ്പിന്റെ വൃത്താകാരമായി വീർത്ത ഭാഗത്തെയാകാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, തലപ്പുകളിൽ ഘടിപ്പിച്ചിരുന്ന അലങ്കാരവല അഥവാ ജാലികപ്പണി.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: തലപ്പുകൾ / തലപ്പിന്
  rationale: തൂണിന്റെ മുകളിലുള്ള അലങ്കാരപരമായ architectural capital ആണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദമായി ‘തലപ്പു’ തെരഞ്ഞെടുത്തു.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: രണ്ടു തൂണുകളുടെയും മുകളിലെ
  rationale: തലപ്പുകളും തൂണുകളും തമ്മിലുള്ള സ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: גַּם מִמַּעַל
  choice: മുകളിലുമുണ്ടായിരുന്നു
  rationale: גַּם എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും מִמַּעַל എന്നതിന്റെ മുകളിലുള്ള സ്ഥാനം എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: വീർത്ത ഭാഗത്തിന് അഭിമുഖമായി
  rationale: הַבֶּטֶן അക്ഷരാർഥത്തിൽ ‘വയർ’ ആണെങ്കിലും ഇവിടെ തലപ്പിന്റെ വൃത്താകാരമായി വീർത്ത ഭാഗമാണ്; לְעֻמַּת എന്നതിന്റെ facing/opposite ഭാവം ‘അഭിമുഖമായി’ നൽകുന്നു.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: വലപ്പണിയുടെ അരികിലുള്ള
  rationale: ശില്പാലങ്കാരമായ വല/ജാലികയെയാണ് שבכה സൂചിപ്പിക്കുന്നത്. ദുഷ്കരമായ സ്ഥലവിവരണത്തിൽ לְעֵבֶר എന്നതിനെ അതിരുകടന്ന് കൃത്യമാക്കാതെ ‘അരികിലുള്ള’ എന്നു നൽകി.
- source_word: הָרִמּוֹנִים
  choice: മാതളനാരങ്ങാരൂപങ്ങൾ
  rationale: യഥാർഥ പഴങ്ങളല്ല, തലപ്പുകളിലെ അലങ്കാരരൂപങ്ങളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘രൂപങ്ങൾ’ ചേർക്കുന്നത് അത് വ്യക്തമാക്കുന്നു.
- source_word: מָאתַיִם
  choice: ഇരുനൂറ്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: טֻרִים סָבִיב
  choice: ചുറ്റും നിരനിരയായി
  rationale: അലങ്കാരങ്ങൾ തലപ്പിനെ വലയംചെയ്ത് വരികളായി ക്രമീകരിച്ചിരുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: രണ്ടാമത്തെ തലപ്പിനുചുറ്റും
  rationale: הַשֵּׁנִית എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘രണ്ടാമത്തെ’ നിലനിർത്തി; עַל, סָבִיב എന്നിവയുടെ സ്ഥലബന്ധം മലയാളത്തിൽ ചേർത്ത് സ്വാഭാവികമാക്കി.
