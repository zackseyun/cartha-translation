  terminology: ‘തലപ്പു’ is a suitable accessible rendering for a column capital. ‘ജാലികപ്പണി,’ ‘വീർത്ത ഭാഗം,’ and ‘മാതളനാരങ്ങാ അലങ്കാരങ്ങൾ’ appropriately communicate the architectural context without claiming excessive precision.
