translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ശില്പങ്ങളുടെ ദിശകൾ ആവർത്തനഘടനയോടെ നിലനിർത്തി. ‘കടൽ’ ക്ഷേത്രോപകരണത്തിന്റെ പേരായി സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് മാതൃകയിലെ [b] അടിക്കുറിപ്പ് മുഖ്യവാചകത്തിലെ വേറൊരു പദപ്രയോഗവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയില്ല; പിൻഭാഗങ്ങളെക്കുറിച്ചുള്ള എബ്രായവാചകം മുഖ്യവാചകത്തിൽ നേരിട്ട് വിവർത്തനം ചെയ്തു.
