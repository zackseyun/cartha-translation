base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: ml
  text: 'അത് പന്ത്രണ്ട് കാളകളുടെമേൽ നിന്നിരുന്നു: മൂന്ന് കാളകൾ വീതം വടക്കോട്ടും, മൂന്ന് പടിഞ്ഞാറോട്ടും[a], മൂന്ന് തെക്കോട്ടും, മൂന്ന് കിഴക്കോട്ടും മുഖം തിരിച്ചുനിന്നു. കടൽ അവയുടെമേൽ മുകളിലായി ഇരുന്നു; അവയുടെയെല്ലാം പിൻഭാഗങ്ങൾ അകത്തോട്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘പടിഞ്ഞാറോട്ട്’ എന്നത് അക്ഷരാർഥത്തിൽ ‘കടലിലേക്ക്’ എന്നാണ്; പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: നിന്നിരുന്നു
  rationale: עמד എന്ന ക്രിയയുടെ കാൽ പങ്കാളിത്തരൂപം ഇവിടെ മുൻവാക്യത്തിലെ കടലിനെ സൂചിപ്പിക്കുന്ന വിവരണാത്മക വിധേയമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘നിന്നിരുന്നു’ സ്വാഭാവികമാണ്.
- source_word: בָּקָר
  choice: കാളകൾ
  rationale: പന്ത്രണ്ട് ഗോരൂപ ശില്പങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. പദം പൊതുവേ കന്നുകാലികൾ എന്നും വരാമെങ്കിലും ഈ ശില്പവിവരണത്തിൽ ‘കാളകൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: פֹנִים
  choice: മുഖംതിരിച്ചിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖങ്ങൾ’ എന്നാണെങ്കിലും ആവർത്തിക്കുന്ന ദിശാനിർദേശത്തിൽ ശില്പങ്ങളുടെ അഭിമുഖീകരണമാണ് ഉദ്ദേശ്യം.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറോട്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘കടലിലേക്ക്’ എന്ന ദിശാസൂചനയാണെങ്കിലും നാല് പ്രധാന ദിക്കുകളുടെ പട്ടികയിൽ ഇത് പതിവായി പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הַיָּם
  choice: കടൽ
  rationale: ക്ഷേത്രത്തിലെ വലിയ വാർപ്പുപാത്രത്തിന്റെ സാങ്കേതിക നാമം തന്നെയാണ്; ‘തൊട്ടി’ എന്നു വിശദീകരിച്ച് മൂലരൂപകം ഇല്ലാതാക്കാതെ ‘കടൽ’ നിലനിർത്തുന്നു.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: അവയുടെമേൽ മുകളിലായി ഇരുന്നു
  rationale: കടൽ കാളകളുടെ മുകളിൽ അവയെ ആശ്രയിച്ച് നിലകൊണ്ടിരുന്നതാണ് വാചകം നേരിട്ട് പറയുന്നത്; ‘സ്ഥാപിച്ചിരുന്നു’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: אֲחֹרֵיהֶם
  choice: അവയുടെയെല്ലാം പിൻഭാഗങ്ങൾ
  rationale: മൃഗരൂപങ്ങളുടെ പിന്നിലത്തെ ഭാഗങ്ങളെ മാന്യമായും വ്യക്തമായും സൂചിപ്പിക്കുന്ന സമീപസ്ഥമായ വിവർത്തനം.
- source_word: בָּיְתָה
  choice: അകത്തോട്ട്
  rationale: ദിശാസൂചക രൂപം ഇവിടെ കേന്ദ്രത്തിലേക്ക്, അഥവാ കടലിന്റെ അടിവശത്തേക്ക്, തിരിഞ്ഞിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
