  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: ml
  text: അവൻ അതിന്റെ താങ്ങുകളുടെ പലകകളിലും ചട്ടക്കൂടുകളിലും കെരൂബുകൾ, സിംഹങ്ങൾ, ഈന്തപ്പനകൾ എന്നിവയും, ഓരോന്നിനും ലഭ്യമായ ഇടത്തിനനുസരിച്ച്,[a] ചുറ്റും മാലാലങ്കാരങ്ങളും[b] കൊത്തിവെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; ‘ഓരോന്നിനും ഇടമുണ്ടായിരുന്നിടത്തെല്ലാം’ എന്നും വിവർത്തനം ചെയ്യാം. ലഭ്യമായ സ്ഥലത്തിനനുസരിച്ച് കൊത്തുരൂപങ്ങൾ ക്രമീകരിച്ചതാകാം അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തോരണാലങ്കാരങ്ങൾ.’ ചുറ്റുമുള്ള മാലപോലെയുള്ള അലങ്കാരപ്പണിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: കൊത്തിവെച്ചു
  rationale: അലങ്കാരരൂപങ്ങൾ ഒരു പ്രതലത്തിൽ കൊത്തിയുണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ശില്പപദപ്രയോഗം.
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: അതിന്റെ താങ്ങുകളിലെ പലകകൾ
  rationale: അക്ഷരാർഥമായ ‘കൈകൾ’ എന്നതിനു പകരം ഈ നിർമാണവിവരണത്തിൽ ഉദ്ദേശിക്കുന്ന താങ്ങുകളെയോ വശത്തെ ഘടകങ്ങളെയോ വ്യക്തമാക്കുന്നു; לֻחֹת ഇവിടെ എഴുത്തുപലകകളല്ല, ഘടനയിലെ പരന്ന പലകകളാണ്.
- source_word: מַסְגְּרֹתֶיהָ
  choice: അതിന്റെ ചട്ടക്കൂടുകൾ
  rationale: പലകകളെ ചുറ്റിയുള്ള ഘടനാപരമായ അതിരുകളെയോ ഫ്രെയിമുകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: כְּרוּבִים
  choice: കെരൂബുകൾ
  rationale: ദേവാലയ അലങ്കാരത്തിലെ പ്രത്യേക സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: אֲרָיוֹת
  choice: സിംഹങ്ങൾ
  rationale: കൊത്തിയ അലങ്കാരരൂപങ്ങളുടെ പട്ടികയിലെ നേരിട്ടുള്ള ജന്തുനാമം.
- source_word: תִמֹרֹת
  choice: ഈന്തപ്പനകൾ
  rationale: ദേവാലയ അലങ്കാരസന്ദർഭത്തിൽ ഈന്തപ്പനയുടെ രൂപങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כְּמַעַר אִישׁ
  choice: ഓരോ രൂപത്തിനും ലഭ്യമായ ഇടത്തിനനുസരിച്ച്
  rationale: ദുഷ്കരമായ ഈ എബ്രായ പ്രയോഗം ഓരോ അലങ്കാരരൂപവും അതിനു ലഭ്യമായ സ്ഥലത്തിനു യോജിച്ചവിധം ക്രമീകരിച്ചതായി മനസ്സിലാക്കുന്നു; പാഠത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לֹיֹת
  choice: മാലാലങ്കാരങ്ങൾ
  rationale: രൂപങ്ങളെ ചുറ്റിയുള്ള മാലയോ തോരണമോ പോലുള്ള അലങ്കാരത്തെ സൂചിപ്പിക്കുന്ന അപൂർവപദത്തിന് സന്ദർഭോചിതമായ വിശാല വിവർത്തനം.
- source_word: סָבִיב
  choice: ചുറ്റിലും
  rationale: അലങ്കാരങ്ങൾ ചുറ്റുമായി ഉണ്ടായിരുന്നുവെന്ന സ്ഥാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
