  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർമാണസാങ്കേതികത വ്യക്തമാക്കാൻ ‘താങ്ങുകൾ’, ‘പലകകൾ’, ‘ചട്ടക്കൂടുകൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. ദുഷ്കരമായ എബ്രായ വാക്യഘടനയെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാക്കി, അതിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
