translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലവാക്യം ഒരു നീണ്ട പട്ടികയുടെ ഭാഗമായതിനാൽ സമാപനഭാവം നൽകാതെ അർദ്ധവിരാമം ഉപയോഗിച്ചു. ‘താങ്ങ്’ എന്നത് ഘടനയുടെ പ്രവർത്തനം വ്യക്തമാക്കുകയും ‘അടിത്തറ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി പാത്രവുമായുള്ള ബന്ധം അറിയിക്കുകയും ചെയ്യുന്നു.
