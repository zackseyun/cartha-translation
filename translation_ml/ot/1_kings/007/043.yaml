  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: ml
  text: പത്ത് താങ്ങുകളും താങ്ങുകളുടെ മുകളിലുള്ള പത്ത് കഴുകുപാത്രങ്ങളും;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: -കളും
  rationale: אֵת നിർദിഷ്ട കർമത്തെ അടയാളപ്പെടുത്തുന്നു; വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. וְ പട്ടികയുടെ തുടർച്ചയും കൂട്ടിച്ചേർക്കലും സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-കളും’ എന്ന സമുച്ചയപ്രത്യയം ഉപയോഗിച്ചു.
- source_word: הַ/מְּכֹנוֹת
  choice: താങ്ങുകൾ
  rationale: ക്ഷേത്രോപകരണങ്ങളുടെ ഈ സന്ദർഭത്തിൽ מְכוֹנוֹת ചുറ്റുമുള്ള വാക്യങ്ങളിൽ വിവരിക്കുന്ന, പാത്രങ്ങളെ താങ്ങുന്ന ചക്രങ്ങളുള്ള ഘടനകളാണ്. ‘താങ്ങുകൾ’ അവയുടെ പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വണ്ടികൾ’ ചലനശേഷിക്ക് അനാവശ്യ ഊന്നൽ നൽകും.
- source_word: עָשֶׂר
  choice: പത്ത്
  rationale: מְכֹנוֹת എന്ന നാമത്തിന്റെ എണ്ണം സൂചിപ്പിക്കുന്ന സാധാരണ സംഖ്യ.
- source_word: הַ/כִּיֹּרֹת
  choice: കഴുകുപാത്രങ്ങൾ
  rationale: כִּיּוֹר കഴുകുന്നതിനുള്ള വലിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ‘കഴുകുപാത്രങ്ങൾ’ ആ ഉപയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: עֲשָׂרָה
  choice: പത്ത്
  rationale: כִּיּוֹרוֹת എന്ന നാമത്തിന്റെ എണ്ണം സൂചിപ്പിക്കുന്ന സാധാരണ സംഖ്യ.
- source_word: עַל
  choice: മുകളിൽ
  rationale: പാത്രങ്ങൾ അവയുടെ താങ്ങുകളുടെ മീതെ സ്ഥാപിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുകളിൽ’ സ്വാഭാവികമാണ്.
- source_word: הַ/מְּכֹנוֹת
  choice: താങ്ങുകൾ
  rationale: ഒരേ എബ്രായപദം വാക്യത്തിനുള്ളിൽ ഒരേ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
