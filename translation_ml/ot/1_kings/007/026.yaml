translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. പുരാതന അളവായ ‘ബത്ത്’ സംരക്ഷിച്ചു; ‘ടെഫഹ്’ എന്ന സാങ്കേതിക ലിപ്യന്തരണത്തിനു പകരം അർത്ഥസുതാര്യമായ ‘കൈവീതി’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
