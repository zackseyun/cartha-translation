source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת֛/וֹ כְּ/מַעֲשֵׂ֥ה שְׂפַת כּ֖וֹס פֶּ֣רַח שׁוֹשָׁ֑ן אַלְפַּ֥יִם בַּ֖ת יָכִֽיל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: ml
  text: അതിന്റെ കനം ഒരു കൈവീതിയായിരുന്നു; അതിന്റെ വക്ക് പാനപാത്രത്തിന്റെ വക്കുപോലെ, ലില്ലിപ്പൂവിന്റെ വിടർന്ന പുഷ്പത്തിന്റെ ആകൃതിയിൽ നിർമിച്ചിരുന്നതായിരുന്നു. അതിൽ രണ്ടായിരം ബത്ത്[a] കൊള്ളുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബത്ത്’ ഒരു പുരാതന ദ്രവയളവാണ്. 2 ദിനവൃത്താന്തം 4:5-ലെ സമാന്തരവിവരണത്തിൽ ഈ പാത്രം മൂവായിരം ബത്ത് കൊള്ളുന്നതായി പറയുന്നു. ഇത് പാഠപരമ്പരയിലെ വ്യത്യാസമോ, പാത്രത്തിന്റെ ശേഷിയും അതിൽ സാധാരണയായി നിറച്ചിരുന്ന അളവും തമ്മിലുള്ള വ്യത്യാസമോ ആയിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: അതിന്റെ കനം
  rationale: കടൽ എന്നു വിളിക്കപ്പെട്ട വലിയ ലോഹത്തൊട്ടിയുടെ ഭിത്തിയുടെ കനമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: טֶפַח
  choice: ഒരു കൈവീതി
  rationale: ടെഫഹ് എന്ന പുരാതന നീളയളവ് കൈപ്പത്തിയുടെ വീതിയെ അടിസ്ഥാനമാക്കിയതാണ്; അളവിന്റെ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: שְׂפָתוֹ
  choice: അതിന്റെ വക്ക്
  rationale: വലിയ പാത്രത്തിന്റെ മുകളിലെ അരികിനെ സൂചിപ്പിക്കുന്നു. ‘ചുണ്ട്’ എന്ന അക്ഷരാർഥസാദ്ധ്യതയേക്കാൾ ‘വക്ക്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: പാനപാത്രത്തിന്റെ വക്കുപോലെ ... ഉണ്ടാക്കിയിരുന്നു
  rationale: ശില്പരൂപത്തിലുള്ള സാദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ആവർത്തിക്കുന്ന ‘വക്ക്’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: വിടർന്ന താമരപ്പൂ
  rationale: שׁוֹשָׁן എന്ന പദം താമരയെയോ ലില്ലിയെയോ സൂചിപ്പിക്കാം. മലയാള ബൈബിൾഭാഷയിലും പ്രാദേശിക സസ്യദൃശ്യത്തിലും സ്വാഭാവികമായ ‘താമരപ്പൂ’ തിരഞ്ഞെടുത്തു; പുഷ്പത്തിന്റെ വിരിഞ്ഞ ആകൃതി വ്യക്തമാക്കാൻ ‘വിടർന്ന’ ചേർത്തു.
- source_word: אַלְפַּיִם בַּת
  choice: രണ്ടായിരം ബത്ത്
  rationale: പുരാതന ദ്രവയളവായ ‘ബത്ത്’ ആധുനിക അളവിലേക്കു അനുമാനപരമായി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: יָכִיל
  choice: കൊള്ളുമായിരുന്നു
  rationale: ഇവിടെ ക്രിയ പാത്രത്തിന്റെ ശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; യഥാർഥ ഉള്ളടക്കമെന്നതിനേക്കാൾ എത്ര അളവ് ഉൾക്കൊള്ളാമെന്ന ആശയം നിലനിർത്തുന്നു.
