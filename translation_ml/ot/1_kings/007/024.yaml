source:
  edition: WLC
  text: וּ/פְקָעִים֩ מִ/תַּ֨חַת לִ/שְׂפָת֤/וֹ סָבִיב֙ סֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנֵ֤י טוּרִים֙ הַ/פְּקָעִ֔ים יְצֻקִ֖ים בִּ/יצֻקָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: ml
  text: അതിന്റെ വക്കിനു താഴെ ചുറ്റിലുമായി കായയുടെ ആകൃതിയിലുള്ള അലങ്കാരങ്ങൾ[a] ഉണ്ടായിരുന്നു. ഒരു മുഴത്തിന് പത്തെണ്ണം വീതം, അവ കടലിനെ ചുറ്റും വളഞ്ഞുനിന്നു. ആ അലങ്കാരങ്ങൾ രണ്ടു നിരകളായി, കടലിനോടൊപ്പം ഒറ്റവാർപ്പായി വാർക്കപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുകുളങ്ങൾ’ അല്ലെങ്കിൽ ‘കുമിളകൾ’; എബ്രായപദം കായപോലെയുള്ള അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: കായയുടെ ആകൃതിയിലുള്ള അലങ്കാരങ്ങൾ
  rationale: പദം കായയോടു സാദൃശ്യമുള്ള അലങ്കാരരൂപങ്ങളെ സൂചിപ്പിക്കുന്നു; സസ്യവർഗം അനാവശ്യമായി നിർണയിക്കാതെ രൂപവും അലങ്കാരസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: അതിന്റെ വക്കിനു താഴെ
  rationale: שָׂפָה പാത്രത്തിന്റെ മുകളറ്റത്തെയോ വക്കിനെയോ സൂചിപ്പിക്കുന്നു; വലിയ ലോഹപ്പാത്രത്തെക്കുറിച്ച് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: ചുറ്റിലുമായി ... അതിനെ ചുറ്റുകയും
  rationale: എബ്രായത്തിലെ ഒരേ ധാതുവിൽനിന്നുള്ള ആവർത്തനത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: ഒരു മുഴത്തിന് പത്തെണ്ണം വീതം
  rationale: ചുറ്റളവിൽ ഓരോ മുഴം നീളത്തിലും പത്ത് അലങ്കാരങ്ങൾ എന്ന സാന്ദ്രത/എണ്ണമാണ് പ്രയോഗം ഏറ്റവും സ്വാഭാവികമായി അറിയിക്കുന്നത്.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: കടലിനെ ചുറ്റിലുമായി വലയം ചെയ്യുകയും ചെയ്തു
  rationale: הַיָּם ഇവിടെ വലിയ ജലസംഭരണിയുടെ സാങ്കേതികനാമമാണ്; ചുറ്റും പൂർണമായി വലയം ചെയ്തിരുന്നതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: שְׁנֵי טוּרִים
  choice: രണ്ടു നിരകളായി
  rationale: טוּרִים എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ അർഥം ‘നിരകൾ’ എന്നാണ്.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: കടലിനോടൊപ്പം ഒറ്റവാർപ്പായി വാർക്കപ്പെട്ടിരുന്നു
  rationale: അലങ്കാരങ്ങൾ പിന്നീട് ഘടിപ്പിച്ചതല്ല, പാത്രത്തോടൊപ്പം ഒരേ വാർപ്പിൽ രൂപപ്പെടുത്തിയതാണെന്ന നിർമ്മാണവിശദാംശം വ്യക്തമാക്കുന്നു.
