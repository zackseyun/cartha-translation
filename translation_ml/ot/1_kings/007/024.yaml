translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കടൽ’ വലിയ ലോഹജലസംഭരണിയുടെ പേരായി ഉപയോഗിച്ചിരിക്കുന്നു. എബ്രായത്തിലെ ചുറ്റലിനെ സൂചിപ്പിക്കുന്ന ആവർത്തനം പൂർണമായി നീക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
