  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: ml
  text: ചട്ടക്കമ്പികൾക്കിടയിലുള്ള പാളികളിൽ സിംഹങ്ങളുടെയും കാളകളുടെയും കെരൂബുകളുടെയും രൂപങ്ങൾ ഉണ്ടായിരുന്നു. ചട്ടക്കമ്പികളുടെ മുകളിലായി ഒരു പീഠം[a] ഉണ്ടായിരുന്നു; സിംഹങ്ങളുടെയും കാളകളുടെയും താഴെ മാലകൾ[b] തൂങ്ങിക്കിടക്കുന്ന ശിൽപ്പപ്പണിയായി ഉണ്ടായിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടത്തെ എബ്രായപദം ‘പീഠം’ എന്നും ‘അതുപോലെ’ എന്നും മനസ്സിലാക്കാം. രണ്ടാമത്തെ വായന സ്വീകരിച്ചാൽ: ‘ചട്ടക്കമ്പികളിലും അതുപോലെ മുകളിൽ…’'
    reason: lexical_alternative
  - marker: b
    text: ‘മാലകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം അപൂർവമാണ്; അത് തോരണങ്ങളെയോ ചുരുൾരൂപത്തിലുള്ള അലങ്കാരങ്ങളെയോ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘തൂങ്ങിക്കിടക്കുന്ന ശിൽപ്പപ്പണി’ എന്ന എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; താഴോട്ടിറങ്ങുന്ന അലങ്കാരപ്പണിയെയോ തൂക്കുപണിയെയോ അത് സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגְּרוֹת
  choice: പാളികൾ
  rationale: അലങ്കാരരൂപങ്ങൾ പതിപ്പിച്ച ഉൾച്ചേർത്ത ഭാഗങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ഘടനാപരമായ שְׁלַבִּים എന്നതിൽനിന്ന് വേർതിരിച്ചുകാണിക്കാൻ ‘പാളികൾ’ സ്വാഭാവികമാണ്.
- source_word: שְׁלַבִּים
  choice: ചട്ടക്കമ്പികൾ
  rationale: പാളികൾക്കിടയിലോ അവയുടെ ചുറ്റിലോ ഉണ്ടായിരുന്ന ഘടനാപരമായ കമ്പികളെയോ കുറുകെപ്പോകുന്ന ഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: אֲרָיוֹת
  choice: സിംഹങ്ങൾ
  rationale: അലങ്കാരത്തിൽ ഉപയോഗിച്ച മൃഗരൂപങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ബഹുവചനപദം.
- source_word: בָּקָר
  choice: കാളകൾ
  rationale: കന്നുകാലിവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദമാണെങ്കിലും ക്ഷേത്രോപകരണങ്ങളിലെ ശില്പരൂപങ്ങളുടെ സന്ദർഭത്തിൽ ‘കാളകൾ’ സ്വാഭാവികവും ആവശ്യത്തിലധികം പ്രത്യേകീകരിക്കാത്തതുമാണ്.
- source_word: כְרוּבִים
  choice: കെരൂബുകൾ
  rationale: പ്രത്യേകമായ സ്വർഗീയ ജീവികളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മാന്യവുമായ ലിപ്യന്തരണം.
- source_word: כֵּן
  choice: ഒരു പീഠം
  rationale: വാക്യത്തിലെ ഉച്ചാരണചിഹ്നക്രമവും വാസ്തുവിവരണവും ഇവിടെ പദത്തെ ‘പീഠം/അടിത്തറ’ എന്ന നാമമായി വായിക്കാൻ പിന്തുണയ്ക്കുന്നു. ‘അതുപോലെ’ എന്ന ക്രിയാവിശേഷണവായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִמָּעַל
  choice: മുകളിൽ
  rationale: പീഠം ചട്ടക്കമ്പികളോട് ഏതു സ്ഥാനത്തായിരുന്നു എന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവിക സ്ഥാനസൂചകം.
- source_word: מִתַּחַת
  choice: താഴെ
  rationale: സിംഹങ്ങളുടെയും കാളകളുടെയും രൂപങ്ങളോട് താരതമ്യപ്പെടുത്തിയുള്ള അലങ്കാരത്തിന്റെ സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: לֹיוֹת
  choice: മാലകൾ
  rationale: അപൂർവമായ ഈ പദം വളഞ്ഞോ തൂക്കിയിട്ടോ ഉള്ള അലങ്കാരമാലകളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; കൃത്യരൂപം അനിശ്ചിതമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: താഴേക്കു തൂങ്ങുന്ന രീതിയിൽ പണിതിരുന്നു
  rationale: ദുഷ്കരമായ ഈ പ്രയോഗം താഴോട്ടിറങ്ങുന്നതോ തൂങ്ങിക്കിടക്കുന്നതോ ആയ അലങ്കാരപ്പണിയെ സൂചിപ്പിച്ചേക്കാം. മലയാളത്തിൽ ദൃശ്യസ്ഥാനം സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും കൃത്യമായ ശില്പസാങ്കേതികത ഉറപ്പിച്ചുപറയുന്നില്ല.
