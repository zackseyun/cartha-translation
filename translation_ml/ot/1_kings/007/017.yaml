source:
  edition: WLC
  text: שְׂבָכִ֞ים מַעֲשֵׂ֣ה שְׂבָכָ֗ה גְּדִלִים֙ מַעֲשֵׂ֣ה שַׁרְשְׁר֔וֹת לַ/כֹּ֣תָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֣אשׁ הָ/עַמּוּדִ֑ים שִׁבְעָה֙ לַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/שִׁבְעָ֖ה לַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: ml
  text: 'തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന മകുടങ്ങൾക്കായി വലപ്പണികൊണ്ടുള്ള ജാലികളും ചങ്ങലപ്പണികൊണ്ടുള്ള പിരിച്ച ചരടുകളും ഉണ്ടായിരുന്നു: ഒരു മകുടത്തിന് ഏഴും[a] രണ്ടാമത്തെ മകുടത്തിന് ഏഴും.


    [a] “വലപ്പണിയായ വലകളും ചങ്ങലപ്പണിയായ പിന്നിയ ഇഴകളും” എന്നും പരിഭാഷപ്പെടുത്താം. തൂൺമകുടങ്ങളിലെ അലങ്കാര ലോഹപ്പണിയെ വിവരിക്കാൻ എബ്രായമൂലത്തിൽ പരസ്പരം ബന്ധപ്പെട്ട കരകൗശലപദങ്ങൾ ജോടിയായി ഉപയോഗിച്ചിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വലപ്പണിയായ വലകളും ചങ്ങലപ്പണിയായ പിന്നിയ ഇഴകളും” എന്നും പരിഭാഷപ്പെടുത്താം. തൂൺമകുടങ്ങളിലെ അലങ്കാര ലോഹപ്പണിയെ വിവരിക്കാൻ എബ്രായമൂലത്തിൽ പരസ്പരം ബന്ധപ്പെട്ട കരകൗശലപദങ്ങൾ ജോടിയായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: വലപ്പണികൊണ്ടുള്ള ജാലികൾ
  rationale: വലയോ ജാലിയോ പോലുള്ള അലങ്കാരഘടനയും അതിന്റെ നിർമാണരീതിയും സൂചിപ്പിക്കുന്ന ജോടിപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ശില്പവിവരണവുമാണ്.
- source_word: גְּדִלִים
  choice: പിരിച്ച ചരടുകൾ
  rationale: പിരിച്ചതോ പിന്നിയതോ ആയ ഇഴകളെ സൂചിപ്പിക്കുന്ന പദമാണ്; പുഷ്പാകൃതിയിലുള്ള ‘മാലകൾ’ എന്ന നിർണയം ഒഴിവാക്കി ലോഹാലങ്കാരത്തിന്റെ രൂപം തുറന്ന നിലയിൽ വയ്ക്കുന്നു.
- source_word: מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: ചങ്ങലപ്പണികൊണ്ടുള്ള
  rationale: ചരടുകൾ ചങ്ങലയുടെ രൂപത്തിൽ നിർമിച്ച അലങ്കാരപ്പണിയാണെന്ന ആശയം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: כֹּתָרֹת
  choice: മകുടങ്ങൾ
  rationale: തൂണുകളുടെ അലങ്കാരമുള്ള മുകൾഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ മലയാള വാസ്തുശില്പപദം; ‘കിരീടങ്ങൾ’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ ഇവിടെ യോജിക്കുന്നു.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന
  rationale: ‘തല’ എന്ന അക്ഷരാർഥത്തിനു പകരം വാസ്തുശില്പസന്ദർഭത്തിലെ സ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: ഒരു മകുടത്തിന് ഏഴും രണ്ടാമത്തെ മകുടത്തിന് ഏഴും
  rationale: ഓരോ മകുടത്തിനും ഏഴുവീതമെന്ന എബ്രായത്തിലെ വ്യക്തിഗത വിതരണവും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
