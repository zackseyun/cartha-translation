translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. അപൂർവമായ സാങ്കേതിക പദസമുച്ചയത്തിന്റെ ആവർത്തനസ്വഭാവം മുഖ്യവാചകത്തിൽ ഭാഗികമായി നിലനിർത്തുകയും കൂടുതൽ അക്ഷരസമീപമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
