  yaml_path: translation/ot/1_kings/007/022.yaml
  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: ml
  text: തൂണുകളുടെ മുകളിൽ ലില്ലിപ്പൂവിന്റെ ആകൃതിയിലുള്ള അലങ്കാരപ്പണി[a] ഉണ്ടായിരുന്നു. തൂണുകളുടെ പണി പൂർത്തിയായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുഷ്പാകൃതിയിലുള്ള അലങ്കാരപ്പണി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തൂണുകളുടെ ശില്പപ്പണി പൂർത്തിയായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: മുകളിൽ
  rationale: വാസ്തുവിദ്യാസന്ദർഭത്തിൽ തൂണുകളുടെ മേൽഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതികമായി ‘ശീർഷകം’ എന്നു അധികമായി നിർവചിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: הָעַמּוּדִים
  choice: തൂണുകളുടെ
  rationale: ക്ഷേത്രനിർമാണസന്ദർഭത്തിലെ עַמּוּדִים എന്നത് ഘടനാപരമായ തൂണുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מַעֲשֵׂה
  choice: അലങ്കാരപ്പണി
  rationale: ഇവിടെ പദം തൂണുകളുടെ മുകളിലെ രൂപകല്പന ചെയ്ത അലങ്കാരവേലയെ സൂചിപ്പിക്കുന്നു; ‘പണി’ മാത്രം എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: שׁוֹשָׁן
  choice: താമരപ്പൂപോലുള്ള
  rationale: שׁוֹשָׁן താമരയെയോ ലില്ലിയെയോ സൂചിപ്പിക്കാവുന്നതാണ്; പുരാതന വാസ്തുഅലങ്കാരസന്ദർഭത്തിൽ പുഷ്പാകൃതിയാണെന്ന അർത്ഥം നിലനിർത്തിക്കൊണ്ട് ‘താമരപ്പൂ’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്. സസ്യനാമത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתִּתֹּם
  choice: പൂർത്തിയായി
  rationale: תמם എന്ന ക്രിയ പണി സമാപിച്ചതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അകർമകപ്രയോഗം എബ്രായവാക്യത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מְלֶאכֶת
  choice: പണി
  rationale: മുഴുവൻ നിർമാണവും ശില്പവേലയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർത്ഥം നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
