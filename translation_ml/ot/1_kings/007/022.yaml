  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനമുള്ള എബ്രായഘടനയുടെ ആശയം നിലനിർത്തിയെങ്കിലും വാക്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു; സസ്യനാമത്തിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
