translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ക്ഷേത്രോപകരണങ്ങളുടെ പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതും ലളിതവുമായ ശൈലി. എണ്ണം പാഠത്തിൽ വ്യക്തമായി ഗ്രഹിക്കാനായി ‘പത്തു’ ചേർത്തിട്ടുണ്ട്; അത് അഞ്ചും അഞ്ചും എന്ന കണക്കിന്റെ പ്രകടമായ ആകെ സംഖ്യയാണ്. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പുചിഹ്നം അന്തർമന്ദിരം/അതിവിശുദ്ധസ്ഥലം എന്ന പദവികൽപവും זָהָב סָגוּר എന്ന സ്വർണത്തിന്റെ ഗുണസൂചനയും വിശദീകരിക്കുന്നു.
