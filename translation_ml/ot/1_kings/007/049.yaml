  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: ml
  text: അന്തർമന്ദിരത്തിന്റെ[a] മുമ്പിൽ, വലതുവശത്ത് അഞ്ചും ഇടതുവശത്ത് അഞ്ചും, ശുദ്ധതങ്കംകൊണ്ടുള്ള[b] വിളക്കുതണ്ടുകളും, പൂക്കളും വിളക്കുകളും ചവണകളും[c]—ഇവയെല്ലാം തങ്കംകൊണ്ടുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിവിശുദ്ധസ്ഥലത്തിന്റെ മുമ്പിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ദְּבִיר എന്ന എബ്രായപദം ക്ഷേത്രത്തിലെ ഏറ്റവും അകത്തെ മുറിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ശുദ്ധീകരിച്ച തങ്കം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘തിരിവെട്ടികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: വിളക്കുതണ്ടുകൾ
  rationale: ഈ പദം എണ്ണവിളക്കുകൾ വെക്കുന്ന തണ്ടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിഗത വിളക്കുകളെയല്ല. മെഴുകുതിരി എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘വിളക്കുതണ്ടുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: വലതുവശത്ത് ... ഇടതുവശത്ത്
  rationale: എബ്രായപാഠത്തിലെ ആപേക്ഷിക സ്ഥാനസൂചന അതേപടി നിലനിർത്തുന്നു; ക്ഷേത്രത്തിന്റെ ദിശയെ അടിസ്ഥാനമാക്കി ‘തെക്ക് ... വടക്ക്’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: לִפְנֵי הַדְּבִיר
  choice: അന്തർമന്ദിരത്തിന്റെ മുമ്പിൽ
  rationale: דְּבִיר ക്ഷേത്രത്തിലെ ഏറ്റവും അകത്തെ മുറിയെ സൂചിപ്പിക്കുന്നു. ‘അന്തർമന്ദിരം’ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: זָהָב סָגוּר
  choice: തങ്കംകൊണ്ടുള്ള
  rationale: സന്ദർഭത്തിൽ ഈ പ്രയോഗം ഉയർന്ന ഗുണമേന്മയുള്ള ശുദ്ധീകരിച്ച സ്വർണത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളത്തിൽ ‘ശുദ്ധതങ്കം’ എന്നു ചേർക്കുന്നത് പാഠത്തിലെ അർത്ഥം വ്യക്തമായി നൽകുന്നു; മുഖ്യവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘തങ്കംകൊണ്ടുള്ള’ എന്നും അടിക്കുറിപ്പിൽ ശുദ്ധീകരിച്ച തങ്കമെന്ന സാധ്യതയും നൽകുന്നു.
- source_word: הַפֶּרַח
  choice: പൂക്കൾ
  rationale: ഏകവചനരൂപത്തിലുള്ള ഈ പദം ഇവിടെ വിളക്കുതണ്ടുകളിലെ പുഷ്പാലങ്കാരങ്ങളെ കൂട്ടായ അർത്ഥത്തിൽ സൂചിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: הַנֵּרֹת
  choice: വിളക്കുകൾ
  rationale: വിളക്കുതണ്ടുകളിൽ വെക്കുന്ന വ്യക്തിഗത എണ്ണവിളക്കുകളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: הַמֶּלְקַחַיִם
  choice: ചവണകൾ
  rationale: വിളക്കുകൾ പരിപാലിക്കാൻ ഉപയോഗിച്ച പിടിയുപകരണത്തിന് അനുയോജ്യമായ പൊതുവായ മലയാളപദമാണിത്; ‘തിരിവെട്ടികൾ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: זָהָב
  choice: തങ്കംകൊണ്ടുള്ളവ
  rationale: അവസാനത്തെ זָהָב പൂക്കൾ, വിളക്കുകൾ, ചവണകൾ എന്നിവയ്ക്കെല്ലാം ബാധകമാണെന്ന് മലയാളവാക്യത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
