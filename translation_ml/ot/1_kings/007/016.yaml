id: 1KI.7.16
reference: 1 Kings 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: ml
  text: തൂണുകളുടെ മുകളിൽ സ്ഥാപിക്കാനായി വാർപ്പുവെങ്കലംകൊണ്ട് അദ്ദേഹം രണ്ട് ശിരോഭാഗങ്ങൾ[a] ഉണ്ടാക്കി. ഒരു ശിരോഭാഗത്തിന്റെ ഉയരം അഞ്ച് മുഴമായിരുന്നു; രണ്ടാമത്തെ ശിരോഭാഗത്തിന്റെ ഉയരവും അഞ്ച് മുഴമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കിരീടങ്ങൾ’; ഹീബ്രുപദം തൂണിന്റെ മുകളിലുള്ള അലങ്കാരഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: ശിരോഭാഗങ്ങൾ / ശിരോഭാഗം
  rationale: തൂണിന്റെ മുകളിലെ അലങ്കാരഘടകത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവിക വാസ്തുവിദ്യാപദമായി ‘ശിരോഭാഗം’ തെരഞ്ഞെടുത്തു; ‘കിരീടം’ എന്ന അക്ഷരാർഥം തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: עָשָׂה
  choice: ഉണ്ടാക്കി
  rationale: ഹീബ്രു ക്രിയയുടെ ലളിതമായ വിവരണശൈലി നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: לָתֵת
  choice: സ്ഥാപിക്കാനായി
  rationale: ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം വ്യക്തമാക്കുകയും വാസ്തുഘടകം തൂണിന്മേൽ ഉറപ്പിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിൽ
  rationale: ‘തൂണുകളുടെ തലകളിൽ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ വാസ്തുവിവരണം.
- source_word: מֻצַק נְחֹשֶׁת
  choice: വാർപ്പുവെങ്കലംകൊണ്ട്
  rationale: ലോഹവും അതിന്റെ നിർമാണരീതിയും ഒരുമിച്ച് സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: חָמֵשׁ אַמּוֹת
  choice: അഞ്ച് മുഴം
  rationale: മൂലപാഠത്തിലെ പുരാതന അളവായ אַמָּהയെ ആധുനിക അളവിലേക്കു മാറ്റാതെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ‘മുഴം’ എന്നു നൽകുന്നു.
- source_word: קוֹמַת
  choice: ഉയരം
  rationale: വാസ്തുവിദ്യാ അളവിന്റെ സന്ദർഭത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ പദം.
- source_word: הָאֶחָת
  choice: ഒരു
  rationale: മൂലത്തിലെ ‘ഒന്ന്/ഒരു’ എന്ന വ്യത്യാസം ‘ഒന്നാമത്തെ’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: הַשֵּׁנִית
  choice: രണ്ടാമത്തെ
  rationale: ജോടിയിലെ രണ്ടാമത്തേതെന്ന് ഹീബ്രു വ്യക്തമായി സൂചിപ്പിക്കുന്നത് അതേപടി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാസ്തുവിവരണം. ‘ശിരോഭാഗം’ സാധാരണ വായനക്കാർക്ക് അർഥഗ്രാഹ്യമാകുന്നതിനൊപ്പം മൂലത്തിലെ അലങ്കാരമുകള്ഭാഗം എന്ന ആശയം നിലനിർത്തുന്നു. രണ്ടാം അളവിൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ഉം’ ചേർത്തിട്ടുണ്ടെങ്കിലും രണ്ടും അഞ്ച് മുഴമാണെന്ന മൂലാർഥത്തിൽ മാറ്റമില്ല.
