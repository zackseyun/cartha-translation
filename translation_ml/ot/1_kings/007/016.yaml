  source_fidelity: 'ഹീബ്രു വാക്യത്തിലെ മുഖ്യഘടകങ്ങൾ കൃത്യമായി പ്രതിഫലിക്കുന്നു: രണ്ട് തൂൺശിരോഭാഗങ്ങൾ, അവ തൂണുകളുടെ മുകളിൽ സ്ഥാപിക്കാനുള്ള ഉദ്ദേശ്യം, വാർപ്പുവെങ്കലം, ഓരോന്നിനും അഞ്ച് മുഴം എന്ന ഉയരം. ‘ഒരു’ എന്നും ‘രണ്ടാമത്തെ’ എന്നും ഉള്ള പ്രയോഗങ്ങൾ הָאֶחָת, הַשֵּׁנִית എന്നിവയുടെ വ്യത്യാസം നിലനിർത്തുന്നു.'
