id: 1KI.7.45
reference: 1 Kings 7:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: ml
  text: ചട്ടികളും കോരികളും തടങ്ങളും—ഹീരാം ശലോമോൻ രാജാവിനുവേണ്ടി യഹ്‌വേയുടെ ആലയത്തിനായി ഉണ്ടാക്കിയ ഈ ഉപകരണങ്ങളെല്ലാം—മിനുക്കിയ വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: ചട്ടികൾ
  rationale: സִירוֹת എന്നത് സാധാരണയായി ചട്ടികളെയോ വലിയ പാത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ആലയോപകരണങ്ങളുടെ പട്ടികയിൽ ‘ചട്ടികൾ’ സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമായ പദമാണ്.
- source_word: הַיָּעִים
  choice: കോരിക്കോലുകൾ
  rationale: യָעִים യാഗപീഠത്തിലെ ചാരമോ മറ്റു വസ്തുക്കളോ കോരിമാറ്റാനുള്ള ഉപകരണങ്ങളാണ്; ആ പ്രവർത്തനം വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപദമാണ് ‘കോരിക്കോലുകൾ’.
- source_word: הַמִּזְרָקוֹת
  choice: തളികകൾ
  rationale: מִזְרָקוֹת ദ്രാവകം സ്വീകരിക്കാനോ തളിക്കാനോ ഉപയോഗിച്ച വിശാലമായ പാത്രങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘തളികകൾ’ വായനാസൗകര്യമുള്ള തിരഞ്ഞെടുപ്പാണ്; ‘കലശങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: כָּל־הַכֵּלִים הָאֵלֶּה
  choice: ഈ ഉപകരണങ്ങളെല്ലാം
  rationale: כֵּלִים എന്ന വിശാലപദം ഇവിടെ മുമ്പ് പറഞ്ഞ ആലയോപകരണങ്ങളെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഉപകരണങ്ങൾ’ അതിന്റെ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חִירָם
  choice: ഹീരാം
  rationale: ഹീബ്രു രൂപമായ חִירָם-ന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണമാണ് ‘ഹീരാം’.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: בֵּית എന്നതിന്റെ അക്ഷരാർഥം ‘ഭവനം’ ആണെങ്കിലും സന്ദർഭത്തിൽ ദേവാലയമാണ് ഉദ്ദേശിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിനായി ‘ആലയം’ ഉപയോഗിച്ചു, യഹ്‌വേ എന്ന വ്യക്തിനാമം നിലനിർത്തി.
- source_word: נְחֹשֶׁת מְמֹרָט
  choice: മിനുക്കിയ വെങ്കലം
  rationale: נְחֹשֶׁת ഇവിടെ വെങ്കലത്തെ സൂചിപ്പിക്കുന്നു; מְמֹרָט ലോഹം മിനുക്കി തിളക്കമുള്ളതാക്കിയ അവസ്ഥയാണ്. ‘മിനുക്കിയ വെങ്കലം’ അർഥവും സ്വാഭാവികതയും ഒരുമിച്ച് നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: അവസാനത്തെ נְחֹשֶׁת מְמֹרָט എന്ന പദസമുച്ചയത്തിന്റെ വാക്യബന്ധം
  choice: പട്ടികപ്പെടുത്തിയ ഉപകരണങ്ങളെല്ലാം മിനുക്കിയ വെങ്കലംകൊണ്ടുള്ളവയായിരുന്നു
  alternative: ‘മിനുക്കിയ വെങ്കലത്തിൽ’ എന്ന അവസാന വിവരണപദമായി വായിക്കുക
  rationale: ഹീബ്രുവിലെ ക്രിയാരഹിതമായ അവസാന നാമവാക്യം മുഴുവൻ പട്ടികയുടെയും വസ്തു വ്യക്തമാക്കുന്നതായി വായിക്കുന്നത് ഏറ്റവും സ്വാഭാവികമാണ്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘കൊണ്ടുള്ളവയായിരുന്നു’ ചേർത്തു. വ്യത്യസ്തമായ ഘടനാപരമായ വായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആലയോപകരണങ്ങളുടെ പട്ടികയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതും ഇന്നത്തെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആധുനിക നിലവാരമലയാളം. ദീർഘമായ ഹീബ്രു വാക്യത്തിലെ പട്ടികയും അന്തിമ വസ്തുവിവരണവും വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
