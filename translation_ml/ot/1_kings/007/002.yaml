source:
  edition: WLC
  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: ml
  text: അവൻ ലെബാനോൻ വനഗൃഹം പണിതു. അതിന് നൂറു മുഴം നീളവും അമ്പതു മുഴം വീതിയും മുപ്പതു മുഴം ഉയരവും ഉണ്ടായിരുന്നു. ദേവദാരുത്തൂണുകളുടെ നാലു നിരകളിന്മേലാണ് അത് പണിതത്[a]; തൂണുകളുടെ മുകളിൽ ദേവദാരുതുലാങ്ങൾ ഉണ്ടായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേവദാരുത്തൂണുകളുടെ നാലു നിരകളോടുകൂടിയതായിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ എബ്രായത്തിലെ ഉപസർഗം താങ്ങിനിൽക്കുന്ന സ്ഥാനം (‘മേൽ’) അല്ലെങ്കിൽ ഘടനയുടെ ക്രമീകരണം (‘കൂടെ’) സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തുലാങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ദേവദാരുവിൽനിന്ന് ‘വെട്ടിയെടുത്ത ഭാഗങ്ങൾ’ എന്നാണ്; അത് തുലാങ്ങളെയോ കഴുക്കോലുകളെയോ മറ്റേതെങ്കിലും വെട്ടിയൊരുക്കിയ ഘടനാഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: അവൻ ... പണിതു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഭൂതകാലക്രിയയാണ്; മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘പിന്നെ’ അഥവാ ‘അവൻ’ എന്നു ചേർക്കാതെ തന്നെ സ്വാഭാവികമായി പ്രവർത്തി വ്യക്തമാക്കാം, എന്നാൽ കർത്താവിനെ വ്യക്തമാക്കാൻ ‘അവൻ’ നിലനിർത്തി.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ലെബാനോൻ വനഗൃഹം
  rationale: ഇത് കെട്ടിടത്തിന്റെ പേരായി വരുന്ന സംയുക്തപദമാണ്. בֵּית എന്നതിനെ ‘കൊട്ടാരം’ എന്നു പ്രവർത്തനപരമായി വ്യാഖ്യാനിക്കാതെ ‘ഗൃഹം’ എന്നു നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ പേരുരൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: അതിന് നൂറു മുഴം നീളവും അമ്പതു മുഴം വീതിയും മുപ്പതു മുഴം ഉയരവും ഉണ്ടായിരുന്നു
  rationale: എബ്രായത്തിലെ സമാന്തര അളവുപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകി; പുരാതന അളവായ אַמָּהയെ പരിവർത്തനം ചെയ്യാതെ പരമ്പരാഗതമായ ‘മുഴം’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: ദേവദാരുത്തൂണുകളുടെ നാലു നിരകളിന്മേലായിരുന്നു
  rationale: טוּרֵי എന്നത് ‘നിരകൾ’, עַמּוּדִים എന്നത് ‘തൂണുകൾ’ എന്നിങ്ങനെ നൽകി. עַל എന്നതിന്റെ പ്രാഥമിക സ്ഥാനാർഥം ‘മേൽ’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ക്രമീകരണം സൂചിപ്പിക്കുന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിൽ ദേവദാരുകൊണ്ടുള്ള തുലാങ്ങൾ ഉണ്ടായിരുന്നു
  rationale: כְרֻתוֹת എന്നത് അക്ഷരാർഥത്തിൽ വെട്ടിയെടുത്ത മരക്കഷണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. വാസ്തുവിദ്യാസന്ദർഭത്തിൽ ‘തുലാങ്ങൾ’ വ്യക്തവും സാധ്യതയേറിയതുമായ അർഥമാണ്; എങ്കിലും കൃത്യമായ ഘടകത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
