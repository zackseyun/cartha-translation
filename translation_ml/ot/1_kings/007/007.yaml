  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: ml
  text: അവൻ ന്യായം വിധിക്കേണ്ട സിംഹാസനത്തിന്റെ മണ്ഡപം—ന്യായവിധിമണ്ഡപം—നിർമിച്ചു; അത് തറമുതൽ തറവരെ[a] ദേവദാരുമരംകൊണ്ട് പാളിയിട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, വ്യാഖ്യാനപരമായി, ‘തറമുതൽ മേൽത്തട്ടുവരെ.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, ‘തറമുതൽ തറവരെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: സിംഹാസനമണ്ഡപം
  rationale: אוּלָם രാജകൊട്ടാരത്തിലെ വിശാലമായ മണ്ഡപത്തെ സൂചിപ്പിക്കുന്നു; הַכִּסֵּא അതിന്റെ രാജകീയമായ സിംഹാസനബന്ധം നിലനിർത്തുന്നു. സംയുക്തരൂപം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: അവൻ ന്യായം വിധിക്കേണ്ട
  rationale: יִשְׁפָּט ഇവിടെ ആ മണ്ഡപത്തിന്റെ ഉദ്ദേശിച്ചിരുന്ന അഥവാ പതിവായ പ്രവർത്തനം സൂചിപ്പിക്കാം. ‘വിധിക്കേണ്ട’ എന്നത് പ്രവർത്തനോദ്ദേശം വ്യക്തമാക്കുന്നു; സംഭവത്തെ ഒറ്റത്തവണ നടന്നതായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: ന്യായവിധിമണ്ഡപം
  rationale: മുറിയുടെ പ്രവർത്തനത്തെ അടിസ്ഥാനമാക്കിയുള്ള ഈ നാമം מִשְׁפָּט എന്ന പദത്തിന്റെ ‘ന്യായവിധി’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עָשָׂה
  choice: നിർമിച്ചു
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘ഉണ്ടാക്കി’ എന്നാണെങ്കിലും, കെട്ടിടനിർമാണസന്ദർഭത്തിൽ ‘നിർമിച്ചു’ എന്നത് കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: ദേവദാരുപ്പലകകൾകൊണ്ട് പൊതിഞ്ഞിരുന്നു
  rationale: סָפוּן മരംകൊണ്ട് മൂടുകയോ പാനൽ ഇടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. ‘പലകകൾകൊണ്ട് പൊതിഞ്ഞിരുന്നു’ എന്നത് ആ വാസ്തുശില്പപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: തറമുതൽ തറവരെ
  rationale: ഹീബ്രു പാഠം ‘തറ/നിലം’ എന്ന പദം ആവർത്തിക്കുന്നു. പാഠത്തിലെ അസാധാരണത പരിഹരിക്കാതെ മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും സന്ദർഭപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
