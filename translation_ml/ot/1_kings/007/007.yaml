translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. രാജകൊട്ടാര-ന്യായവിധി പശ്ചാത്തലം നിലനിർത്താൻ ‘സിംഹാസനമണ്ഡപം’, ‘ന്യായവിധിമണ്ഡപം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ അസാധാരണമായ അവസാന പ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിലാക്കി.
