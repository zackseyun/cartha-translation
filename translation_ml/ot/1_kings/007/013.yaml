  text: Then King Solomon sent and brought Hiram from Tyre.
translation:
  language: ml
  text: അനന്തരം ശലോമോൻ രാജാവ് ആളയച്ച് ഹീരാമിനെ സോരിൽനിന്ന് വരുത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ആളയച്ച്
  rationale: രാജാവ് ഒരാളെ വിളിച്ചുവരുത്താൻ ദൂതന്മാരെയോ ആളുകളെയോ അയച്ചു എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקַּח
  choice: വരുത്തി
  rationale: ലക്കാഖ് എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുത്തു/സ്വീകരിച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ ആളയച്ചതിന്റെ ഫലമായി ഹീരാമിനെ രാജസന്നിധിയിലേക്കു കൊണ്ടുവന്നു എന്ന സന്ദർഭാർഥമാണ്; ‘വരുത്തി’ അതിനെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: מִצֹּר
  choice: സോരിൽനിന്ന്
  rationale: സ്ഥലനാമമായ צֹר-ന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം ‘സോർ’; מן ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: חִירָם
  choice: ഹീരാമിനെ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ പരമ്പരാഗതവും തിരിച്ചറിയാവുന്നതുമായ മലയാള ലിപ്യന്തരണം; നേരിട്ടുള്ള കർമത്തെ മലയാള വിഭക്തിയോടെ രേഖപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രായത്തിലെ തുടർച്ചാസൂചകമായ וַ-യെ സന്ദർഭോചിതമായി ‘അനന്തരം’ എന്നു നൽകി. ഈ വാക്യത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
