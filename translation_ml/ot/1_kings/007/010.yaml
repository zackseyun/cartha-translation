  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാസ്തുവിവരണശൈലി ഉപയോഗിച്ചു. ആവർത്തനം മൂലപാഠത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തുന്നു. ‘മുഴം’ എന്ന പരമ്പരാഗത അളവുപദം സംരക്ഷിച്ചു.
