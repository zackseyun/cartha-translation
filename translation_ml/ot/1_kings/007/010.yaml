source:
  edition: WLC
  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: ml
  text: അടിസ്ഥാനം വിലയേറിയ കല്ലുകൾകൊണ്ടായിരുന്നു[a]—വലിയ കല്ലുകൾ, പത്തു മുഴം അളവുള്ള കല്ലുകൾ, എട്ടു മുഴം അളവുള്ള കല്ലുകൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അമൂല്യമായ കല്ലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം കല്ലുകളുടെ ഉയർന്ന മൂല്യത്തെയോ ഗുണമേന്മയെയോ ഊന്നിപ്പറയുന്നു; ഇവിടെ രത്നങ്ങളല്ല, കെട്ടിടനിർമാണത്തിനുപയോഗിച്ച വിലകൂടിയ കല്ലുകളെയാണ് കൂടുതൽ സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: അടിസ്ഥാനം ... കൊണ്ടായിരുന്നു
  rationale: יסד എന്ന ധാതുവിന്റെ പാസീവ് രൂപം ഇവിടെ കെട്ടിടത്തിന്റെ അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ സൂചിതമായ വാസ്തുവിഷയം ‘അടിസ്ഥാനം’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: אֲבָנִים יְקָרוֹת
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: יְקָרוֹת എന്നത് ഉയർന്ന മൂല്യമോ ഗുണനിലവാരമോ സൂചിപ്പിക്കുന്നു. ‘വിലയേറിയ’ എന്നത് കെട്ടിടനിർമാണസന്ദർഭത്തിൽ രത്നങ്ങളെന്ന തെറ്റിദ്ധാരണ കുറയ്ക്കുകയും മൂല്യത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: വലിയ കല്ലുകൾ
  rationale: גְּדֹלוֹת ഇവിടെ കല്ലുകളുടെ ഭൗതികവലുപ്പത്തെ സൂചിപ്പിക്കുന്നു; ‘വലിയ’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: പത്തു മുഴം നീളമുള്ള കല്ലുകൾ
  rationale: കല്ലുകളുടെ അളവിനെ സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗമാണിത്. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘നീളമുള്ള’ എന്നു നൽകിയെങ്കിലും എബ്രായത്തിൽ ഏത് അളവുദിശയാണെന്ന് വ്യക്തമല്ല; അതിനാൽ അടിക്കുറിപ്പിൽ ആ അനിശ്ചിതത്വം രേഖപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: എട്ടു മുഴം നീളമുള്ള കല്ലുകൾ
  rationale: മുൻപ്രയോഗത്തിനു സമാന്തരമായ ഘടന നിലനിർത്തി വായനാസൗകര്യത്തിനായി അതേ രൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: אַמּוֹת
  choice: മുഴം
  rationale: אַמָּה എന്ന പുരാതന അളവിന്റെ പതിവായ മലയാള ബൈബിൾ പദം ‘മുഴം’ ആണ്; ആധുനിക ഏകകത്തിലേക്കുള്ള അനിശ്ചിത പരിവർത്തനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
