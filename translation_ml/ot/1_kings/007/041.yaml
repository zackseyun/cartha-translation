  text: עַמֻּדִ֣ים שְׁנַ֔יִם וְ/גֻלֹּ֧ת הַ/כֹּתָרֹ֛ת אֲשֶׁר עַל רֹ֥אשׁ הָֽ/עַמֻּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: ml
  text: രണ്ട് തൂണുകൾ; തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന തൂൺമകുടങ്ങളിലെ[b] പാത്രാകൃതിയിലുള്ള രണ്ട് ഭാഗങ്ങൾ[a]; തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന തൂൺമകുടങ്ങളിലെ ആ പാത്രാകൃതിയിലുള്ള രണ്ട് ഭാഗങ്ങൾ മൂടുന്നതിനുള്ള രണ്ട് ജാലപ്പണികൾ[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗോളാകൃതിയിലുള്ള ഭാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; തൂൺമകുടങ്ങളിലെ വൃത്താകാര ഘടകങ്ങളെയാണ് ഹീബ്രുപദം സൂചിപ്പിക്കുന്നത്, എന്നാൽ അവയുടെ കൃത്യമായ വാസ്തുശില്പരൂപം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘തൂൺമകുടങ്ങൾ’ എന്നത് തൂണുകളുടെ മുകളിലെ അലങ്കാരഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_clarification
  - marker: c
    text: ‘വലപ്പണികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: തൂണുകൾ
  rationale: ദേവാലയത്തിനു മുമ്പിലെ വലിയ സ്വതന്ത്ര തൂണുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ വാസ്തുശില്പപദമാണിത്.
- source_word: גֻלֹּת
  choice: പാത്രാകൃതിയിലുള്ള ഭാഗങ്ങൾ
  rationale: തൂൺമകുടങ്ങളോടു ചേർന്ന വൃത്താകാരമോ പാത്രസദൃശമോ ആയ ഘടകങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ ഒരൊറ്റ സാങ്കേതിക പുനർനിർമാണം നിർബന്ധിക്കാത്ത പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: כֹּתָרֹת
  choice: തൂൺമകുടങ്ങൾ
  rationale: വാസ്തുശില്പസന്ദർഭത്തിൽ തൂണിന്റെ മുകളിലെ അലങ്കാരഭാഗമായ capital-നെ സൂചിപ്പിക്കുന്നു; ‘തൂൺമകുടം’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: רֹאשׁ
  choice: മുകളിൽ
  rationale: അക്ഷരാർഥം ‘തല’ എന്നാണെങ്കിലും, തൂണുകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘മുകളിൽ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְּׂבָכוֹת
  choice: ജാലപ്പണികൾ
  rationale: വലപോലെ ഇഴചേർന്ന അലങ്കാരഘടനയെ സൂചിപ്പിക്കുന്നതിനാൽ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വാസ്തുശില്പപ്രയോഗമാണിത്.
- source_word: לְכַסּוֹת
  choice: മൂടുന്നതിനുള്ള
  rationale: ഹീബ്രു ക്രിയാരൂപം ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു; പട്ടികയുടെ വാക്യഘടനയിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: രണ്ട്
  rationale: സാധനപ്പട്ടികയെ ക്രമപ്പെടുത്തുന്ന ആവർത്തിച്ച സംഖ്യ ഓരോ ഘടകത്തോടും വ്യക്തമായി നിലനിർത്തി.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: തൂണുകളുടെ മുകളിലുണ്ടായിരുന്ന
  rationale: ഘടകങ്ങളുടെ സ്ഥാനം വ്യക്തമാക്കുന്ന ബന്ധവാക്യം ഹീബ്രുവിലെ ആവർത്തനത്തോടുകൂടി നിലനിർത്തുന്നു.
