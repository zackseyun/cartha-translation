translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ പട്ടികാസ്വഭാവവും ‘രണ്ട്’ എന്ന സംഖ്യയുടെ ആവർത്തനവും അവസാനത്തെ അർധവിരാമവും നിലനിർത്തി; അനിശ്ചിതമായ വാസ്തുശില്പരൂപം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
