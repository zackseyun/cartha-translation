translation:
  language: ml
  text: രാജാവും അവനോടുകൂടെ സകല ഇസ്രായേലും യഹ്‌വെയുടെ സന്നിധിയിൽ യാഗങ്ങൾ അർപ്പിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘ഒരു യാഗം അർപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്ന സമധാതുപ്രയോഗമാണ്; അത് യാഗാർപ്പണപ്രവൃത്തിയെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: രാജാവും
  rationale: വാവ് ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടപദം മുമ്പ് പരാമർശിച്ച രാജാവായ ശലോമോനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘രാജാവും’ എന്നത് തുടർന്നുവരുന്ന ‘സകല ഇസ്രായേലും’ എന്ന കൂട്ടുഘടനയോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: וְכָל יִשְׂרָאֵל
  choice: സകല ഇസ്രായേലും
  rationale: ഇസ്രായേലിനെ ഒരു ദേശീയസമൂഹമായി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യക്തികളായി വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെ
  rationale: രാജാവിനോടൊപ്പം ഉണ്ടായിരുന്ന ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ബന്ധം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: זֹבְחִים זֶבַח
  choice: യാഗങ്ങൾ അർപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിപദത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘അർപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു. ക്രിയയും അതേ ധാതുവിലുള്ള നാമവും ചേർന്ന എബ്രായ സമധാതുപ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകുന്നതിനാൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം സ്വീകരിച്ച് വിശദാംശം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: ആരാധനാപരമായ സാഹചര്യത്തിൽ ‘മുമ്പാകെ’ എന്നതിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ ‘Yahweh’ എന്ന ഉച്ചാരണത്തോട് ചേർന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തിന്റെ സ്വാഭാവിക മലയാളലിപ്യന്തരണമാണ്.
- issue: זֹבְחִים זֶבַח എന്ന സമധാതുപ്രയോഗം
  choice: യാഗങ്ങൾ അർപ്പിച്ചുകൊണ്ടിരുന്നു
  alternative: ഒരു യാഗം യാഗം കഴിച്ചുകൊണ്ടിരുന്നു
  rationale: എബ്രായ പ്രയോഗം യാഗാർപ്പണപ്രവൃത്തിയെ ഊന്നുന്നു; അതിന്റെ അക്ഷരാർഥ ആവർത്തനം മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കും അസ്വാഭാവികതയ്ക്കും ഇടയാക്കും. അതിനാൽ അർഥം മുഖ്യപാഠത്തിലും രൂപസവിശേഷത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആരാധനാപര ശൈലി. ‘സകല ഇസ്രായേൽ’ എന്ന ദേശീയസമൂഹപ്രയോഗവും തുടരുന്ന പ്രവർത്തനഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു; അസ്വാഭാവികമായ എബ്രായ ആവർത്തനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
