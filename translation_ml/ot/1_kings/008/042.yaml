  terminology: ‘മഹത്തായ നാമം,’ ‘ശക്തമായ കൈ,’ and ‘നീട്ടിയ ഭുജം’ appropriately preserve the biblical imagery. ‘ആലയം’ is suitable in this temple context, while ‘നേരെ’ accurately expresses the directional force without implying entry into the building.
