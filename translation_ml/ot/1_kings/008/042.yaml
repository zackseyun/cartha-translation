  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: ml
  text: കാരണം, അവർ അങ്ങയുടെ മഹത്തായ നാമത്തെക്കുറിച്ചും അങ്ങയുടെ ശക്തമായ കൈയെക്കുറിച്ചും നീട്ടിയ ഭുജത്തെക്കുറിച്ചും കേൾക്കും; അപ്പോൾ അവൻ വന്ന് ഈ ആലയത്തിനു നേരെ പ്രാർഥിക്കും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ബഹുവചനമായ ‘അവർ കേൾക്കും’ എന്നതിൽനിന്ന് ഏകവചനമായ ‘അവൻ വന്ന് പ്രാർഥിക്കും’ എന്നതിലേക്കു മാറുന്നു. പൊതുവായി വിദേശികളെപ്പറ്റി പറഞ്ഞശേഷം, ഒരു പ്രതിനിധിയായ വിദേശിയിലേക്കുള്ള മാറ്റമായിരിക്കാം ഇത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വിദേശിയുടെ പ്രാർഥനയ്ക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יִשְׁמְעוּן
  choice: അവർ ... കേൾക്കും
  rationale: അപൂർണക്രിയയുടെ ഭാവി/പൊതുവായ അർഥവും വിദേശികളെ ഒരു വിഭാഗമായി സൂചിപ്പിക്കുന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: അങ്ങയുടെ മഹത്തായ നാമത്തെക്കുറിച്ച്
  rationale: שׁמע എന്ന ക്രിയയോടൊപ്പം ഇവിടെ പ്രശസ്തിയെപ്പറ്റി കേൾക്കുക എന്ന അർഥമാണെങ്കിലും, ദൈവത്തിന്റെ വെളിപ്പെട്ട കീർത്തിയെ വഹിക്കുന്ന ‘നാമം’ എന്ന മൂർത്തമായ പദം നിലനിർത്തുന്നു.
- source_word: יָדְךָ הַחֲזָקָה
  choice: അങ്ങയുടെ ശക്തമായ കൈ
  rationale: ദൈവിക ശക്തിയുടെ മൂർത്തമായ മാനവരൂപക ചിത്രം അമൂർത്തമാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: അങ്ങയുടെ നീട്ടിയ ഭുജം
  rationale: പ്രവർത്തനസജ്ജമായ ദൈവിക ശക്തിയെ സൂചിപ്പിക്കുന്ന പഴയനിയമത്തിലെ ചിത്രഭാഷ അക്ഷുണ്ണമായി നിലനിർത്തുന്നു.
- source_word: וּבָא וְהִתְפַּלֵּל
  choice: അപ്പോൾ അവൻ വന്ന് ... പ്രാർഥിക്കും
  rationale: ബഹുവചനമായ ‘അവർ കേൾക്കും’ എന്നതിൽനിന്ന് പ്രതിനിധിയായ ഏക വിദേശിയിലേക്കുള്ള എബ്രായത്തിലെ ഏകവചനമാറ്റം സംരക്ഷിക്കുന്നു.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ഈ ആലയത്തിലേക്കു തിരിഞ്ഞ്
  rationale: ആലയത്തിനകത്തേക്കുള്ള പ്രവേശനമെന്നതിലുപരി, ആലയത്തെ അഭിമുഖീകരിച്ചുള്ള പ്രാർഥനാദിശയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘തിരിഞ്ഞ്’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ശക്തിയെ വിവരിക്കുന്ന മാനവരൂപക ഭാഷ
  choice: ‘കൈ’, ‘ഭുജം’ എന്നീ മൂർത്തപദങ്ങൾ നിലനിർത്തി
  alternative: ‘ശക്തി’, ‘ബലം’ എന്നിങ്ങനെ അമൂർത്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠത്തിലെ ചിത്രഭാഷ പഴയനിയമത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രാധാന്യം വഹിക്കുന്നതിനാൽ അതിനെ വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചില്ല.
- issue: കർത്താവിന്റെ എണ്ണത്തിൽ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ‘അവർ ... കേൾക്കും; ... അവൻ ... പ്രാർഥിക്കും’ എന്ന് മാറ്റം നിലനിർത്തി
  alternative: എല്ലാ ക്രിയകളും ബഹുവചനമാക്കി സുഗമമാക്കുക
  rationale: വിദേശികളെ പൊതുവായൊരു വിഭാഗമായി പറഞ്ഞശേഷം അവരിൽപ്പെട്ട പ്രതിനിധിയായ ഒരാളിലേക്കു മാറുന്ന മൂലപാഠത്തിലെ യഥാർഥ സംഘർഷം മറച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. ദൈവത്തിന്റെ ‘നാമം’, ‘കൈ’, ‘ഭുജം’ എന്നീ ബൈബിൾ ചിത്രങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ഭാഷ സ്വീകരിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നിലനിർത്തി.
