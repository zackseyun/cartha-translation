  verdict: revise
  source_fidelity: 'The causal opening, plural ‘they will hear,’ the singular shift to ‘he will come,’ and the concrete ‘name,’ ‘hand,’ and ‘arm’ are retained. However, ‘ഈ ആലയത്തിലേക്കു തിരിഞ്ഞ്’ is less exact for אֶל הַבַּיִת הַזֶּה: it can suggest merely turning toward the temple after arriving, while the Hebrew directly qualifies the prayer as directed toward ‘this house.’'
