- from: അപ്പോൾ അങ്ങ് വസിക്കുന്ന സ്ഥലമായ സ്വർഗത്തിൽനിന്ന് കേട്ട്,[a] ആ വിദേശി അങ്ങയോട് അപേക്ഷിക്കുന്നതെല്ലാം ചെയ്തുകൊടുക്കണമേ. അങ്ങനെ ഭൂമിയിലെ സകല ജനതകളും അങ്ങയുടെ നാമം അറിയുകയും അങ്ങയുടെ ജനമായ ഇസ്രായേലിനെപ്പോലെ അങ്ങയെ ഭയപ്പെടുകയും ഞാൻ പണിത ഈ ആലയത്തിന്മേൽ അങ്ങയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു[b] എന്ന് അറിയുകയും ചെയ്യട്ടെ.
