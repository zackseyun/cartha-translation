  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: ml
  text: അങ്ങ് വസിക്കുന്ന സ്ഥലമായ സ്വർഗത്തിൽ കേട്ട്,[a] ആ വിദേശി അങ്ങയോട് അപേക്ഷിക്കുന്നതെല്ലാം ചെയ്തുകൊടുക്കണമേ. അങ്ങനെ ഭൂമിയിലെ സകല ജനതകളും അങ്ങയുടെ നാമം അറിയുകയും അങ്ങയുടെ ജനമായ ഇസ്രായേലിനെപ്പോലെ അങ്ങയെ ഭയപ്പെടുകയും, ഞാൻ പണിത ഈ ആലയത്തിന്മേൽ അങ്ങയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു[b] എന്ന് അറിയുകയും ചെയ്യട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങ് വസിക്കുന്ന സ്ഥലമായ സ്വർഗത്തിൽനിന്ന് കേട്ട്.’
    reason: ഹീബ്രായ വാക്യബന്ധം സ്വർഗത്തെ ദൈവത്തിന്റെ വാസസ്ഥലമായി സൂചിപ്പിക്കുന്നു; ‘സ്വർഗത്തിൽനിന്ന്’ എന്നത് സന്ദർഭാനുസൃതമായ ഒരു വ്യാഖ്യാനപരമായ ബദൽ ആണ്.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഈ ആലയത്തിന്മേൽ അങ്ങയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു’; ഈ പ്രയോഗം ആലയം അങ്ങയുടേതാണെന്നും അത് അങ്ങയുടെ നാമം വഹിക്കുന്നുവെന്നും സൂചിപ്പിക്കുന്നു.
    reason: എബ്രായ നാമപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും അതിലെ ഉടമസ്ഥത/ബന്ധ സൂചനയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: അങ്ങ് വസിക്കുന്ന സ്ഥലമായ സ്വർഗത്തിൽനിന്ന് കേട്ട്
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ അപേക്ഷാഭാവം തുടർന്നുള്ള ‘ചെയ്തുകൊടുക്കണമേ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു. ദൈവത്തിന്റെ വാസസ്ഥലത്തുനിന്നുള്ള ശ്രവണമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘സ്വർഗത്തിൽനിന്ന്’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי
  choice: ആ വിദേശി അങ്ങയോട് അപേക്ഷിക്കുന്നതെല്ലാം ചെയ്തുകൊടുക്കണമേ
  rationale: קרא אל എന്നത് ഇവിടെ പ്രാർഥനാപൂർവമായ വിളിയെയോ അപേക്ഷയെയോ സൂചിപ്പിക്കുന്നു. ‘അപേക്ഷിക്കുന്നതെല്ലാം’ അതിന്റെ സന്ദർഭാർഥം നൽകുന്നു; ‘ചെയ്തുകൊടുക്കണമേ’ ദൈവത്തോടുള്ള അപേക്ഷാഭാവം നിലനിർത്തുന്നു.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: עמים എന്ന ബഹുവചനം വ്യത്യസ്ത ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനതകൾ’ അനുയോജ്യം; സർവലൗകിക വ്യാപ്തി ‘ഭൂമിയിലെ’ വ്യക്തമാക്കുന്നു.
- source_word: לְיִרְאָה אֹתְךָ
  choice: അങ്ങയെ ഭയപ്പെടുകയും
  rationale: ירא ഉൾക്കൊള്ളുന്ന ഭയം, ഭക്ത്യാദരം, വിസ്മയം എന്നിവയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കാതെ ‘ഭയപ്പെടുക’ നിലനിർത്തുന്നു.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: ഈ ആലയത്തിന്മേൽ അങ്ങയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദൈവിക ഉടമസ്ഥതയും ബന്ധവും സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ പ്രധാന പാഠത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ירא എന്ന പദത്തിന്റെ ദൈവബന്ധിയായ അർഥവ്യാപ്തി
  choice: അങ്ങയെ ഭയപ്പെടുകയും
  alternative: അങ്ങയെ ഭക്ത്യാദരത്തോടെ ബഹുമാനിക്കുകയും
  rationale: ‘ഭയം’ എന്ന ബൈബിൾപരമായ പദം ഭക്ത്യാദരവും വിസ്മയവും വിശുദ്ധഭീതിയും ഉൾക്കൊള്ളുന്നു; ‘ബഹുമാനം’ മാത്രമാക്കുന്നത് അതിനെ അനാവശ്യമായി മൃദൂകരിക്കും.
- issue: שִׁמְךָ נִקְרָא עַל എന്ന നാമപ്രയോഗം
  choice: ഈ ആലയത്തിന്മേൽ അങ്ങയുടെ നാമം വിളിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ഈ ആലയം അങ്ങയുടെ നാമം വഹിക്കുന്നു
  rationale: മൂലത്തിലെ വ്യതിരിക്തമായ പ്രയോഗവും അതിലുള്ള ഉടമസ്ഥത/ബന്ധ സൂചനയും പ്രധാന പാഠത്തിൽ നിലനിർത്തി, അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ‘ആലയം’, ‘ജനതകൾ’, ‘ഭയപ്പെടുക’ എന്നീ സാധാരണ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന വായനാസൗകര്യത്തിന് സ്വാഭാവികമാക്കി.
