    rationale: 'The Hebrew infinitive לִשְׁמֹעַ expresses the purpose/content of the plea that God turn toward the prayer: ‘turn ... to hear.’ Malayalam can preserve this by using ‘തിരിഞ്ഞ് ... കേൾക്കണമേ,’ rather than making ‘hear’ a coordinate request.'
