source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: ml
  text: എങ്കിലും, യഹ്‌വേ, എന്റെ ദൈവമേ, അങ്ങയുടെ ദാസന്റെ പ്രാർഥനയിലേക്കും അവന്റെ കൃപയ്ക്കായുള്ള യാചനയിലേക്കും[a] തിരിഞ്ഞ്, അങ്ങയുടെ ദാസൻ ഇന്ന് അങ്ങയുടെ സന്നിധിയിൽ പ്രാർഥിച്ചുകൊണ്ട് ഉയർത്തുന്ന നിലവിളിയും[b] പ്രാർഥനയും കേൾക്കണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അപേക്ഷയിലേക്കും.’ എബ്രായപദം കരുണയോ കൃപയോ തേടിയുള്ള തീവ്രമായ യാചനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മുഴങ്ങുന്ന വിളിയും.’ എബ്രായപദത്തിന് ഉച്ചത്തിലുള്ള വിളി, ആർപ്പ്, അല്ലെങ്കിൽ ആനന്ദഘോഷം എന്നൊക്കെ അർഥമാകാം; ഇവിടെ ദൈവത്തോടുള്ള പ്രാർഥനയിലെ നിലവിളിയാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: എങ്കിലും ... തിരിയണമേ
  rationale: פנה എന്ന ക്രിയയുടെ ‘തിരിയുക/നേരേ തിരിയുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു. മുൻവാക്യത്തിലെ ദൈവാതീതതയെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്കുശേഷമുള്ള നേരിയ വിരുദ്ധഭാവം וּ ഇവിടെ ‘എങ്കിലും’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: תְּפִלַּת
  choice: പ്രാർഥന
  rationale: תפלה എന്നതിന്റെ നേരിട്ടുള്ളതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ തുല്യപദം; എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ദൈവത്തോടുള്ള വിനീതമായ രാജകീയ-ഉടമ്പടിഭാഷയാണ് ഇവിടെ; അതിനാൽ അടിമസ്ഥിതിക്ക് ഊന്നൽ നൽകുന്ന പദത്തേക്കാൾ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: תְּחִנָּתוֹ
  choice: അവന്റെ കൃപയ്ക്കായുള്ള യാചന
  rationale: תחנה കരുണയോ കൃപയോ അഭ്യർഥിക്കുന്ന തീവ്രമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം ശലോമോൻ തന്നെ ‘അങ്ങയുടെ ദാസൻ’ എന്നു പരാമർശിക്കുന്നതിനെ പിന്തുടരുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֱלֹהָי
  choice: എന്റെ ദൈവമായ
  rationale: പ്രത്യക്ഷ അഭിസംബോധനയിൽ ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לִשְׁמֹעַ
  choice: കേൾക്കണമേ
  rationale: שמע എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും അപേക്ഷയുടെ ഉദ്ദേശ്യം മലയാളത്തിലെ പ്രാർഥനാഭാഷയിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: הָרִנָּה
  choice: നിലവിളി
  rationale: רנה ഉച്ചത്തിലുള്ള മുഴങ്ങുന്ന വിളിയെ സൂചിപ്പിക്കാം; ഇവിടെ പ്രാർഥനയോടുള്ള സമാന്തരപ്രയോഗമായതിനാൽ ദൈവത്തോടുള്ള അടിയന്തര വിളി എന്ന അർഥം യോജിക്കുന്നു.
- source_word: מִתְפַּלֵּל
  choice: അർപ്പിക്കുന്ന
  rationale: പ്രാർഥിച്ചുകൊണ്ടിരിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന participle-ന്റെ ഭാവം നൽകുന്നു; ‘പ്രാർഥന അർപ്പിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: לְפָנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിൽ
  rationale: അക്ഷരാർഥമായ ‘അങ്ങയുടെ മുമ്പിൽ’ എന്ന ആശയം പ്രാർഥനാസന്ദർഭത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: הַיּוֹם
  choice: ഇന്ന്
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം അത് ലിപ്യന്തരം ചെയ്തു. ‘യഹ്‌വേ’ എന്ന രൂപം സാധാരണ പണ്ഡിതപുനർനിർമാണത്തോട് ചേർന്നുനിൽക്കുന്നു.
- issue: תחנה എന്നതിലെ കൃപ/കരുണയുടെ ഭാവം
  choice: കൃപയ്ക്കായുള്ള യാചന
  alternative: അപേക്ഷ / കരുണയ്ക്കായുള്ള യാചന
  rationale: പദത്തിന്റെ അപേക്ഷാഭാവത്തോടൊപ്പം അനുഗ്രഹപൂർവമായ പരിഗണന തേടുന്ന സൂക്ഷ്മാർഥവും തുറന്നുവെക്കുന്നു; ‘കരുണ’ മാത്രം ഉപയോഗിച്ച് അർഥപരിധി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം സ്വീകരിച്ചു. എബ്രായ സമാന്തരഘടനയും ‘പ്രാർഥന’ എന്ന പദത്തിന്റെ ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; എന്നാൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി ‘കേൾക്കണമേ’ എന്ന ലക്ഷ്യവാക്യം അവസാനം നൽകി.
