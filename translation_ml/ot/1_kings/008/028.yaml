  naturalness: The register, honorific address, and most vocabulary are natural modern standard Malayalam. Recasting the final request as the purpose/result of Yahweh’s turning gives a smoother and more source-shaped sentence. ‘യഹ്‌വേ, എന്റെ ദൈവമേ’ is also the more idiomatic Malayalam direct address.
  terminology: ‘യഹ്‌വേ,’ ‘ദാസൻ,’ ‘യാചന,’ ‘നിലവിളി,’ and ‘പ്രാർഥന’ are appropriate. The repeated ‘പ്രാർഥന’ properly preserves the Hebrew repetition. The footnotes retain the relevant lexical alternatives and their anchors.
