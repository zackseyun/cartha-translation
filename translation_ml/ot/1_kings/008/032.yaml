  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: ml
  text: 'അപ്പോൾ അങ്ങ് സ്വർഗത്തിൽ കേൾക്കുകയും പ്രവർത്തിക്കുകയും, അങ്ങയുടെ ദാസന്മാരെ ന്യായം വിധിക്കുകയും ചെയ്യണമേ: ദുഷ്ടനെ കുറ്റക്കാരനെന്നു വിധിച്ച്, അവന്റെ നടപ്പ് അവന്റെ സ്വന്തം തലമേൽ വരുത്തണമേ[b]; നീതിമാനെ നീതിമാനെന്നു വിധിച്ച്[c], അവന്റെ നീതിക്ക് തക്കത് അവന് നൽകണമേ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “അവന്റെ നടപ്പ് അവന്റെ സ്വന്തം തലമേൽ വരുത്തുക” എന്നത് ഒരാളുടെ പെരുമാറ്റത്തിന് അനുസരിച്ചുള്ള ഫലം അവനുതന്നെ നൽകുക എന്നർഥമുള്ള എബ്രായ ശൈലിപ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “നീതിമാൻ കുറ്റമില്ലാത്തവനെന്നു വിധിച്ച്” അല്ലെങ്കിൽ “നീതിമാന്റെ നിരപരാധിത്വം സ്ഥാപിച്ച്.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽ കേട്ട്
  rationale: എബ്രായ പ്രാർഥനാശൈലിയിലെ സ്ഥലസൂചന നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘സ്വർഗത്തിൽ കേൾക്കുക’ എന്നു പറയുന്നത് ദൈവം സ്വർഗത്തിൽനിന്ന് പ്രാർഥന കേൾക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; സ്രോതസ്സിലെ രൂപവൈശിഷ്ട്യം കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְעָשִׂיתָ
  choice: പ്രവർത്തിക്കുകയും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയ ഇവിടെ കേട്ടതിനുള്ള ദൈവിക പ്രതികരണത്തെയും ഇടപെടലിനെയും സൂചിപ്പിക്കുന്നു; ‘ചെയ്യുക’ എന്നതിനെക്കാൾ ‘പ്രവർത്തിക്കുക’ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരെ ന്യായം വിധിക്കുകയും
  rationale: വാക്യത്തിന്റെ നീതിന്യായപരമായ പശ്ചാത്തലം നിലനിർത്തുകയും തുടർന്നുള്ള കുറ്റവിധി–നീതിവിധി എന്ന സമാന്തരതയ്ക്ക് വഴിയൊരുക്കുകയും ചെയ്യുന്നു.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: ദുഷ്ടനെ കുറ്റക്കാരനെന്നു വിധിച്ച്
  rationale: רשע എന്ന ഹിഫീൽ ക്രിയയുടെ നിയമപരമായ അർഥമായ ‘കുറ്റക്കാരനെന്ന് പ്രഖ്യാപിക്കുക/വിധിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: അവന്റെ നടപ്പ് അവന്റെ സ്വന്തം തലമേൽ വരുത്തണമേ
  rationale: ഒരു വ്യക്തിയുടെ പെരുമാറ്റത്തിന്റെ ഫലം അവനുതന്നെ തിരിച്ചുനൽകുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. ‘നടപ്പ്’ ഇവിടെ ജീവിതരീതിയെയോ പെരുമാറ്റത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: നീതിമാനെ നീതിമാനെന്നു വിധിച്ച്
  rationale: צדק എന്ന ഹിഫീൽ ക്രിയയുടെ കോടതിസംബന്ധിയായ അർഥം നിലനിർത്തുകയും ‘ദുഷ്ടനെ കുറ്റക്കാരനെന്നു വിധിച്ച്’ എന്നതിന് സമാന്തരമാക്കുകയും ചെയ്യുന്നു.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: അവന്റെ നീതിക്ക് തക്കത് അവന് നൽകണമേ
  rationale: പ്രതിഫലം എന്ന ആശയം മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ, ആ വ്യക്തിയുടെ നീതിക്ക് അനുസരിച്ചുള്ള നൽകൽ എന്ന എബ്രായ ഘടനയോട് ചേർന്നുനിൽക്കുന്നു.
theological_decisions:
- issue: നീതിന്യായപരമായ വിധിയാണോ ധാർമിക പരിവർത്തനമാണോ
  choice: ‘കുറ്റക്കാരനെന്നു വിധിച്ച്’, ‘നീതിമാനെന്നു വിധിച്ച്’ എന്നീ കോടതിസംബന്ധിയായ പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘ശിക്ഷിച്ച്’, ‘നീതീകരിച്ച്’ അല്ലെങ്കിൽ ‘നിരപരാധിത്വം സ്ഥാപിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്താം.
  rationale: സത്യപ്രതിജ്ഞയുടെയും വിധിനിർണയത്തിന്റെയും പശ്ചാത്തലത്തിൽ വരുന്ന causative ക്രിയകൾ നിയമപരമായ പ്രഖ്യാപനങ്ങളാണ്. വ്യക്തിയുടെ ഉള്ളിലുള്ള ധാർമിക പരിവർത്തനം ഈ വാക്യം വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
- issue: ‘അവന്റെ നടപ്പ് അവന്റെ തലമേൽ’ എന്ന പ്രതികാരനീതിയുടെ ദൃശ്യഭാഷ
  choice: മൂലത്തിലെ ‘തലമേൽ വരുത്തുക’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘അവന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച് അവനു പ്രതിഫലം നൽകുക’ എന്നു ആശയപരമായി വ്യക്തമാക്കാം.
  rationale: രൂപകം നിലനിർത്തുന്നത് ദുഷ്പ്രവൃത്തിയുടെ ഫലം പ്രവർത്തകനിലേക്കുതന്നെ മടങ്ങിവരുന്നു എന്ന സ്രോതസ്സിലെ ശക്തമായ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലത്തിലെ നീതിന്യായപരമായ സമാന്തരതയും ‘തലമേൽ’ എന്ന രൂപകവും സംരക്ഷിച്ചു; പ്രാർഥനയുടെ സ്വഭാവം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘ചെയ്യണമേ/വരുത്തണമേ/നൽകണമേ’ എന്ന അപേക്ഷാരൂപം ഉപയോഗിച്ചു.
