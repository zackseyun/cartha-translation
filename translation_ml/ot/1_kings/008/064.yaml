source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: ml
  text: ആ ദിവസം രാജാവ് യഹ്‌വെയുടെ ഭവനത്തിനു[a] മുമ്പിലുള്ള പ്രാകാരത്തിന്റെ നടുഭാഗം[b] വിശുദ്ധീകരിച്ചു. കാരണം, അവിടെ അദ്ദേഹം ഹോമയാഗവും ധാന്യയാഗവും സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങളും[c] അർപ്പിച്ചു. യഹ്‌വെയുടെ മുമ്പിലുണ്ടായിരുന്ന വെങ്കല യാഗപീഠം ഹോമയാഗവും ധാന്യയാഗവും സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങളും കൊള്ളാൻ കഴിയാത്തത്ര ചെറുതായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ ഭവനം’; ഇവിടെ ദൈവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രാകാരത്തിന്റെ ഉൾഭാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പ്’; യാഗപീഠത്തിൽ ദഹിപ്പിച്ചിരുന്ന കൊഴുപ്പുഭാഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: വിശുദ്ധീകരിച്ചു
  rationale: ആ സ്ഥലത്തെ യാഗാർപ്പണത്തിനായി വിശുദ്ധമായി വേർതിരിച്ചതാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആരാധനാസംബന്ധമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: תּוֹךְ הֶחָצֵר
  choice: പ്രാകാരത്തിന്റെ നടുഭാഗം
  rationale: תּוֹךְ എന്ന പദത്തിന്റെ ‘മധ്യം/നടുഭാഗം’ എന്ന സ്ഥലസൂചന വ്യക്തമായി നൽകുന്നു; ‘ഉൾഭാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: യഹ്‌വെയുടെ ഭവനത്തിനു മുമ്പിലുള്ള
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലപരമായ അർഥവും ‘യഹ്‌വെയുടെ ഭവനം’ എന്ന എബ്രായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עָשָׂה שָׁם
  choice: അവിടെ അദ്ദേഹം ... അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עָשָׂה എന്നത് യാഗം നടത്തുക/അർപ്പിക്കുക എന്ന അർഥത്തിലാണ്; മലയാളത്തിൽ ‘അർപ്പിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הָעֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള പരിചിതമായ മലയാള ബൈബിൾപദം.
- source_word: הַמִּנְחָה
  choice: ധാന്യയാഗം
  rationale: ആരാധനാസന്ദർഭത്തിലെ മִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായ ‘വഴിപാട്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങൾ
  rationale: യാഗപീഠത്തിൽ ദഹിപ്പിക്കേണ്ട നിർദിഷ്ട കൊഴുപ്പുഭാഗങ്ങളെയാണ് חֶלְבֵי സൂചിപ്പിക്കുന്നത്; ‘മികച്ച ഭാഗങ്ങൾ’ എന്ന രൂപകാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: വെങ്കല യാഗപീഠം
  rationale: നְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ഈ ആരാധനോപകരണത്തിന് ‘വെങ്കലം’ എന്നത് പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: קָטֹן מֵהָכִיל
  choice: കൊള്ളാൻ പോരാത്തവിധം ചെറുതായിരുന്നു
  rationale: യാഗങ്ങളുടെ അളവ് ഉൾക്കൊള്ളാനുള്ള ശേഷി പീഠത്തിനില്ലായിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ഉച്ചാരണത്തിന്റെ പുനർനിർമാണപരമായ സ്വഭാവം കണക്കിലെടുത്ത് പൊതുവായി അംഗീകരിക്കപ്പെട്ട ‘യഹ്‌വെ’ ഉപയോഗിക്കുന്നു.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: ഈ യാഗത്തിന്റെ അർഥവ്യാപ്തിയിൽ സമാധാനവും ക്ഷേമവും കൂട്ടായ്മയും ഉൾപ്പെടാം; പ്രധാന പാഠത്തിൽ പരിചിതമായ ‘സമാധാനയാഗം’ സ്വീകരിച്ചെങ്കിലും മറ്റൊരു ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഹോമയാഗം’, ‘ധാന്യയാഗം’, ‘യാഗപീഠം’ തുടങ്ങിയ പരിചിതമായ ആരാധനാപദങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി.
