    rationale: מִזְבַּח ... אֲשֶׁר לִפְנֵי יְהוָה എന്നത് അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ മുമ്പിലുണ്ടായിരുന്ന യാഗപീഠം’ എന്നാണ്. ‘സന്നിധി’ സ്വാഭാവികമെങ്കിലും മൂലത്തിലെ സ്ഥലപരതയെ അല്പം വ്യാഖ്യാനിക്കുന്നു.
