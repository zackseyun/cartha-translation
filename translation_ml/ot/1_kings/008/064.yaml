    rationale: കപാസിറ്റിയുടെ അപര്യാപ്തതയാണ് קָטֹן מֵהָכִיל അറിയിക്കുന്നത്. ‘കൊള്ളാൻ കഴിയാത്തത്ര ചെറുതായിരുന്നു’ എന്ന രൂപം ആ അർഥം കൂടുതൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
  revised_text: ആ ദിവസം രാജാവ് യഹ്‌വെയുടെ ഭവനത്തിനു[a] മുമ്പിലുള്ള പ്രാകാരത്തിന്റെ നടുഭാഗം[b] വിശുദ്ധീകരിച്ചു. കാരണം, അവിടെ അദ്ദേഹം ഹോമയാഗവും ധാന്യയാഗവും സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങളും[c] അർപ്പിച്ചു. യഹ്‌വെയുടെ മുമ്പിലുണ്ടായിരുന്ന വെങ്കല യാഗപീഠം ഹോമയാഗവും ധാന്യയാഗവും സമാധാനയാഗങ്ങളുടെ കൊഴുപ്പുള്ള ഭാഗങ്ങളും കൊള്ളാൻ കഴിയാത്തത്ര ചെറുതായിരുന്നു.
