  source_fidelity: ഹീബ്രു വാക്യത്തിലെ അപേക്ഷാഭാവം, ‘ഇസ്രായേലിന്റെ ദൈവമേ’ എന്ന സംബോധന, ദാവീദ് ദൈവത്തിന്റെ ദാസനും ശലോമോന്റെ പിതാവുമാണെന്ന ഇരട്ട വിശേഷണം, וכן דבריך എന്ന ബഹുവചനം എന്നിവ കരടിൽ പൊതുവേ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. എന്നാൽ ‘ഉറപ്പാകുമാറാകട്ടെ’ എന്ന രൂപം മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതും സ്വാഭാവികമല്ലാത്തതുമാണ്. നിഫാൽ അപേക്ഷാഭാവത്തെ ‘സ്ഥിരമാകട്ടെ’ എന്നു പറയുന്നത് കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; נָאയുടെ വിനയപൂർവക അപേക്ഷ ‘ദയവായി’ വഴി വ്യക്തമാണ്.
  naturalness: ‘അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദിനോട്’ എന്ന ക്രമം മനസ്സിലാക്കാവുന്നതാണെങ്കിലും, ദാവീദ് ‘അങ്ങയുടെ ദാസൻ’ എന്നും ‘എന്റെ പിതാവ്’ എന്നും ഒരുപോലെ വിശേഷിപ്പിക്കപ്പെടുന്നുവെന്ന് ‘ദാസനും എന്റെ പിതാവുമായ’ എന്ന രൂപം കൂടുതൽ വ്യക്തവും ആധുനിക മലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതുമാക്കുന്നു. ‘അരുളിച്ചെയ്ത’ പ്രാർഥനയുടെ മാന്യമായ രജിസ്റ്ററിന് യോജിക്കുന്നു.
  terminology: ‘ദൈവമേ,’ ‘അങ്ങയുടെ,’ ‘ദാസൻ,’ ‘ദാവീദ്,’ ‘വാക്കുകൾ’ എന്നിവ യോജിച്ചതാണ്. ‘വാക്കുകൾ’ എന്ന ബഹുവചനം നിലനിർത്തുന്നതും അതിന്റെ കൂട്ടായ/സമഷ്ടി അർഥം കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നതും മൂലപാഠത്തോടും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിനോടും യോജിക്കുന്നു.
