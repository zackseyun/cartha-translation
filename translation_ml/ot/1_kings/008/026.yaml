source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: ml
  text: ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമേ, അങ്ങയുടെ ദാസനും എന്റെ പിതാവുമായ ദാവീദിനോട് അങ്ങ് അരുളിച്ചെയ്ത വാക്കുകൾ[b] ദയവായി സ്ഥിരമാകട്ടെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഉറപ്പിക്കപ്പെടട്ടെ,” “സത്യമെന്നു തെളിയട്ടെ,” അല്ലെങ്കിൽ കൂടുതൽ ഭാവാനുവാദമായി, “നിറവേറട്ടെ.”'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ “അങ്ങയുടെ വാക്കുകൾ”; ഇവിടെ അവയെ ഒരുമിച്ചുള്ള ദൈവിക അരുളപ്പാടായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: മുൻ പ്രാർഥനയുടെ തുടർച്ചയും ഇപ്പോഴത്തെ അപേക്ഷയിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമേ
  rationale: സംയുക്തപദത്തെ നേരിട്ടുള്ള സംബോധനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יֵאָמֶן נָא
  choice: ഉറപ്പാകുമാറാകട്ടെ
  rationale: אמן എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലുള്ള സ്ഥിരതയുടെയും സ്ഥിരീകരണത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു; അപേക്ഷാസൂചകമായ נָאയും ആശംസാ-അപേക്ഷാരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: דבריך
  choice: അങ്ങ് … അരുളിച്ചെയ്ത വാക്കുകൾ
  rationale: ഹീബ്രുവിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വചനത്തെ ആദരപൂർവം സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്ത’ എന്നത് പ്രാർഥനാസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: അങ്ങ് അരുളിച്ചെയ്ത
  rationale: ബന്ധവാക്യവും ‘സംസാരിക്കുക’ എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു; ‘വാഗ്ദാനം ചെയ്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി വ്യാഖ്യാനം മുൻകൂട്ടി ചുമത്തുന്നില്ല.
- source_word: לְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ
  rationale: ദൈവത്തോടുള്ള രാജകീയ പ്രാർഥനയിലെ ബന്ധപരവും ബഹുമാനപരവുമായ ഭാവത്തിന് ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: דָּוִד אָבִי
  choice: എന്റെ പിതാവ് ദാവീദ്
  rationale: ഹീബ്രുവിലെ ആശയം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദാവീദിനോടു പറഞ്ഞ ദൈവവചനത്തെക്കുറിച്ചുള്ള അപേക്ഷയുടെ സ്വഭാവം
  choice: ദൈവം അരുളിച്ചെയ്ത വാക്കുകൾ ഉറപ്പാകണമെന്ന പ്രാർഥനയായി പരിഭാഷപ്പെടുത്തി
  alternative: ദൈവത്തിന്റെ വാഗ്ദാനം നിറവേറണമെന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: മുൻപ് പറഞ്ഞത് വാഗ്ദാനമാണെന്നും അതിന്റെ നിറവേറ്റലാണ് അപേക്ഷയെന്നും സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും, പരിഭാഷ ‘വാക്കുകൾ’ എന്നും ‘ഉറപ്പാകുക’ എന്നും പറഞ്ഞ് ഹീബ്രുവിലെ പദപ്രയോഗവും അതിലെ സ്ഥിരത/സത്യമായി തെളിയൽ/നിറവേറൽ എന്നീ അർഥസാധ്യതകളും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്ത’ എന്നും ഉപയോഗിച്ചു. പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ഹീബ്രുവിലെ ബഹുവചനമായ ‘വാക്കുകൾ’ നിലനിർത്തി.
