  to: ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമേ, അങ്ങയുടെ ദാസനും എന്റെ പിതാവുമായ ദാവീദിനോട് അങ്ങ് അരുളിച്ചെയ്ത വാക്കുകൾ[b] ദയവായി സ്ഥിരമാകട്ടെ[a].
