  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: ml
  text: അപ്പോൾ അങ്ങയുടെ വാസസ്ഥാനമായ സ്വർഗത്തിൽ അങ്ങ് കേൾക്കണമേ; ക്ഷമിക്കുകയും പ്രവർത്തിക്കുകയും, അങ്ങ് ഹൃദയം അറിയുന്ന ഓരോരുത്തനും അവന്റെ സകല വഴികൾക്കനുസരിച്ച് നൽകുകയും ചെയ്യണമേ. സകല മനുഷ്യപുത്രന്മാരുടെയും[a] ഹൃദയം അറിയുന്നത് അങ്ങ് മാത്രമാണല്ലോ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘മനുഷ്യന്റെ പുത്രന്മാർ’; എല്ലാ മനുഷ്യരെയും സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: അങ്ങ് കേൾക്കണമേ
  rationale: ശലോമോന്റെ പ്രാർഥനയിലെ അപേക്ഷാഭാവം മലയാളത്തിലെ മാന്യമായ പ്രാർഥനാരൂപമായ ‘കേൾക്കണമേ’ വ്യക്തമായി നൽകുന്നു.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: അങ്ങയുടെ വാസസ്ഥാനമായ സ്വർഗത്തിൽ
  rationale: ‘സ്വർഗം’ എന്നതിനെ തുടർന്നുള്ള ‘അങ്ങയുടെ വാസസ്ഥാനം’ എന്ന സമാനാധികരണത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ഒറ്റ ഘടനയായി അവതരിപ്പിക്കുന്നു; സ്ഥലം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: ക്ഷമിക്കുകയും പ്രവർത്തിക്കുകയും ചെയ്യണമേ
  rationale: തുടർച്ചയായ ദൈവിക പ്രവർത്തനങ്ങൾക്കായുള്ള അപേക്ഷ നിലനിർത്തുന്നു. עָשָׂה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ ‘പ്രവർത്തിക്കുക’ എന്നു നൽകി.
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: ഓരോരുത്തനും അവന്റെ സകല വഴികൾക്കും തക്കവണ്ണം നൽകണമേ
  rationale: לָאִישׁ എന്ന ഏകവചനത്തിന്റെ വിതരണാത്മക അർഥം ‘ഓരോരുത്തനും’ എന്നും, דֶּרֶךְ എന്ന ധാർമിക ജീവിതരീതിയുടെ രൂപകം ‘വഴികൾ’ എന്നും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: അവന്റെ ഹൃദയം അങ്ങ് അറിയുന്നുവല്ലോ
  rationale: മുൻപറഞ്ഞ ഓരോ വ്യക്തിയുടെയും അന്തരംഗത്തെ ദൈവം അറിയുന്നു എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ഹൃദയം’ ചിന്ത, ഇച്ഛ, അന്തരംഗം എന്നിവ ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: כִּי אַתָּה יָדַעְתָּ לְבַדְּךָ
  choice: അറിയുന്നത് അങ്ങ് മാത്രം ആകുന്നുവല്ലോ
  rationale: ദൈവത്തിന്റെ ഏകാന്തമായ അറിവിനുള്ള ഊന്നൽ ‘അങ്ങ് മാത്രം’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: സകല മനുഷ്യപുത്രന്മാരുടെയും
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ പ്രതിനിധിപ്രയോഗത്തിന്റെ രൂപഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സർവമാനവിക വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: כָּל בְּנֵי הָאָדָם എന്ന മാനവശാസ്ത്രപരമായ പ്രയോഗം
  choice: സകല മനുഷ്യപുത്രന്മാരുടെയും
  alternative: സകല മനുഷ്യരുടെയും / മുഴുവൻ മനുഷ്യവർഗത്തിന്റെയും
  rationale: മൂലത്തിലെ ‘മനുഷ്യന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ പ്രതിനിധിപ്രയോഗം ഇല്ലാതാക്കാതെ സൂക്ഷിച്ചു; അതേസമയം ഇത് എല്ലാ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന എബ്രായ ശൈലിയാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: ദൈവം ഹൃദയം അറിയുന്നതും വഴികൾക്കനുസരിച്ച് നൽകുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ട് അടുത്ത വാക്യഘടകങ്ങളായി നിലനിർത്തി
  alternative: ‘ഹൃദയം അറിയുന്നതനുസരിച്ച്’ എന്ന് വ്യാഖ്യാനിച്ച് ബന്ധിപ്പിക്കുക
  rationale: אֲשֶׁר എന്ന ബന്ധകത്തിന്റെ കൃത്യമായ താർക്കിക ബന്ധം അമിതമായി നിർണയിക്കാതെ, വ്യക്തിയുടെ ഹൃദയത്തെ ദൈവം അറിയുന്നു എന്ന പ്രസ്താവനയും അവന്റെ വഴികൾക്കനുസരിച്ചുള്ള പ്രതിഫലവും തമ്മിലുള്ള മൂലപാഠത്തിലെ സംഘർഷവും അടുപ്പവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാത്മകവുമായ ശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ സ്വീകരിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
