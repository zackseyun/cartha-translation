id: 1KI.8.35
reference: 1 Kings 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: ml
  text: ആകാശം അടഞ്ഞ് മഴ പെയ്യാതിരിക്കുമ്പോൾ, അവർ നിന്നോടു പാപം ചെയ്തതുകൊണ്ട്, അവർ ഈ സ്ഥലത്തിനു നേരേ പ്രാർഥിക്കുകയും നിന്റെ നാമത്തെ സ്തുതിക്കുകയും[a], നീ അവരെ കഷ്ടത്തിലാക്കിയതുകൊണ്ട് തങ്ങളുടെ പാപത്തിൽനിന്ന് പിന്തിരിയുകയും ചെയ്താൽ,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്റെ നാമത്തിനു നന്ദി അർപ്പിക്കുകയും’ അല്ലെങ്കിൽ ‘നിന്റെ നാമം ഏറ്റുപറയുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് നന്ദിയോടെയുള്ള സ്തുതി, തുറന്ന അംഗീകാരം, അല്ലെങ്കിൽ ഏറ്റുപറച്ചിൽ എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നീ അവരെ താഴ്ത്തിയതുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ രൂപത്തെ ‘നീ അവർക്കു ഉത്തരം നൽകിയതുകൊണ്ട്’ എന്നും വായിക്കാനാകും; എന്നാൽ വരൾച്ചയെന്ന ശിക്ഷണം അവരെ പാപത്തിൽനിന്ന് പിന്തിരിപ്പിക്കുന്നു എന്ന സന്ദർഭം ‘കഷ്ടത്തിലാക്കുക/താഴ്ത്തുക’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: ആകാശം അടഞ്ഞുപോയി
  rationale: בְּ + നിഫാൽ ഇൻഫിനിറ്റീവ് കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ശമയിം രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ആധുനിക മലയാളത്തിൽ മഴ അടക്കപ്പെടുന്ന ആകാശത്തെ സ്വാഭാവികമായി ‘ആകാശം’ എന്നു പറയുന്നു.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: മഴ പെയ്യാതിരിക്കുമ്പോൾ
  rationale: ‘മഴ ഉണ്ടാകാതിരിക്കുക’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം; ആരംഭത്തിലെ കാലസൂചനയോടും ഇത് ചേരുന്നു.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: അവർ നിന്നോടു പാപം ചെയ്തതുകൊണ്ടാണല്ലോ അത്
  rationale: כִּי ഇവിടെ കാരണസൂചകമാണ്; לָךְ ദൈവത്തോടുള്ള കുറ്റത്തെ സൂചിപ്പിക്കുന്നു. ഇടയ്ക്കുള്ള വിശദീകരണമെന്ന നില വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: അവർ ഈ സ്ഥലത്തേക്കു തിരിഞ്ഞു പ്രാർഥിക്കുകയും
  rationale: אֶל ദിശയെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥലം പ്രാർഥനയുടെ സ്വീകർത്താവാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘തിരിഞ്ഞു’ ചേർത്തു.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: നിന്റെ നാമത്തിനു നന്ദി അർപ്പിക്കുകയും
  rationale: ידה എന്ന ഹിഫീൽ രൂപത്തിന് നന്ദി, സ്തുതി, തുറന്ന അംഗീകാരം/ഏറ്റുപറച്ചിൽ എന്നീ അർഥങ്ങൾ വരാം. മുഖ്യവാചകത്തിൽ നന്ദിയോടെയുള്ള സ്തുതി സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: തങ്ങളുടെ പാപത്തിൽനിന്നു പിന്തിരിയുകയും
  rationale: שׁוב + מִן പാപത്തിൽനിന്നുള്ള തിരിഞ്ഞുപോക്കിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘മാനസാന്തരപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കി.
- source_word: כִּי תַעֲנֵם
  choice: നീ അവരെ കഷ്ടത്തിലാക്കിയതിനാൽ
  rationale: ענה എന്ന രൂപം സന്ദർഭത്തിൽ കഷ്ടപ്പെടുത്തുക/താഴ്ത്തുക എന്ന അർഥത്തിൽ വായിക്കാം; വരൾച്ചയായ ശിക്ഷണം പാപത്തിൽനിന്നുള്ള തിരിഞ്ഞുപോക്കിലേക്ക് നയിക്കുന്നതാണ് അടുത്ത ബന്ധം. ‘ഉത്തരം നൽകുക’ എന്ന വായനയും രൂപപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ ചേർത്തു.
theological_decisions:
- issue: ദേവാലയദിശയിലേക്കുള്ള പ്രാർഥന
  choice: ഈ സ്ഥലത്തേക്കു തിരിഞ്ഞു പ്രാർഥിക്കുക
  alternative: ഈ സ്ഥലത്തോടു പ്രാർഥിക്കുക
  rationale: വാചകം ദേവാലയത്തെ പ്രാർഥനയുടെ സ്വീകർത്താവാക്കുന്നില്ല; ദൈവനാമം സ്ഥാപിതമായ സ്ഥലത്തേക്കുള്ള ദിശയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: תַעֲנֵם എന്നതിന്റെ സന്ദർഭാർഥം
  choice: നീ അവരെ കഷ്ടത്തിലാക്കിയതിനാൽ
  alternative: നീ അവർക്കു ഉത്തരം നൽകുന്നതിനാൽ
  rationale: പാപം, വരൾച്ച, പാപത്തിൽനിന്നുള്ള പിന്തിരിയൽ എന്നീ ആശയങ്ങളുടെ ക്രമത്തിൽ ദൈവത്തിന്റെ ശിക്ഷണപരമായ കഷ്ടപ്പെടുത്തൽ മുഖ്യവായനയായി കൂടുതൽ യോജിക്കുന്നു. എന്നിരുന്നാലും ‘ഉത്തരം നൽകുക’ എന്ന യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാഭാഷയാണ് സ്വീകരിച്ചത്. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനാഭാഗമായതിനാൽ അവസാനം കോമ നിലനിർത്തി. രണ്ട് യഥാർഥ എബ്രായ അർഥസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
