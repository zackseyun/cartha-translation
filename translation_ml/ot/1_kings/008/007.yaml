  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: ml
  text: കാരണം, കെരൂബുകൾ പെട്ടകത്തിന്റെ സ്ഥാനത്തിനുമീതെ[a] ചിറകുകൾ വിരിച്ചിരുന്നു; കെരൂബുകൾ പെട്ടകത്തെയും അതിന്റെ തണ്ടുകളെയും മുകളിൽനിന്ന് മൂടിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെട്ടകത്തിന്റെ സ്ഥാനത്തേക്കു.’ ഹീബ്രായ പൂർവപ്രത്യയം കൂടുതൽ അക്ഷരാർഥത്തിൽ ദിശയെ സൂചിപ്പിക്കാം; എന്നാൽ ചിറകുകൾ പെട്ടകം സ്ഥിതിചെയ്യുന്ന ഇടത്തിനുമീതെ നീണ്ടുനിന്നു എന്ന അർഥത്തിനാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇത് മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ഘടകമാണ്. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ ‘കാരണം’ എന്നു തുടങ്ങുന്നത് അപൂർണമായി തോന്നുന്നതിനാൽ വിശദീകരണബന്ധം വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചു.
- source_word: הַכְּרוּבִים
  choice: കെരൂബുകൾ
  rationale: ദേവാലയസന്ദർഭത്തിലെ സാങ്കേതിക നാമം നിലനിർത്തുകയും മലയാള ബഹുവചനരൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: ചിറകുകൾ വിരിച്ചുനിന്നിരുന്നു
  rationale: ഹീബ്രായ പങ്കാളിത്തരൂപം പ്രവർത്തനത്തിന്റെ പുരോഗതിയേക്കാൾ തുടർന്നുനിൽക്കുന്ന ഭാവമോ നിലയോ സൂചിപ്പിക്കുന്നു; ‘വിരിച്ചുനിന്നിരുന്നു’ അത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: പെട്ടകത്തിന്റെ സ്ഥാനത്തിനുമീതെ
  rationale: אֶל സാധാരണയായി ദിശയെ സൂചിപ്പിക്കാമെങ്കിലും, ചിറകുകൾ വിരിച്ചിരിക്കുന്ന സ്ഥലബന്ധവും തുടർന്നുള്ള മൂടൽവിവരണവും ഇവിടെ ‘മീതെ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു; ദിശാസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: וַיָּסֹכּוּ
  choice: മൂടിയിരുന്നു
  rationale: סכך എന്ന ധാതുവിന്റെ മൂടുക/ആവരണം ചെയ്യുക എന്ന ഭൗതിക അർഥം വ്യക്തമായി നൽകുന്നു; ‘നിഴലിട്ടു’ എന്നത് അനാവശ്യമായി പ്രകാശ-നിഴൽ ആശയം മുൻനിർത്താം.
- source_word: בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ
  rationale: പെട്ടകം ചുമക്കാൻ ഉപയോഗിച്ച നീളമുള്ള തണ്ടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: מִלְמָעְלָה
  choice: മുകളിൽനിന്ന്
  rationale: മൂടൽ നടന്ന സ്ഥാനവും ദിശയും സൂചിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
