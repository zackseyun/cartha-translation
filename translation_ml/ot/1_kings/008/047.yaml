id: 1KI.8.47
reference: 1 Kings 8:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: ml
  text: തങ്ങളെ ബന്ദികളാക്കി കൊണ്ടുപോയ ദേശത്തുവെച്ച് അവർക്ക് സുബോധം വന്ന്, അവർ തിരിഞ്ഞ്, തങ്ങളെ ബന്ദികളാക്കിയവരുടെ ദേശത്തുവെച്ച് നിന്നോടു കരുണയ്ക്കായി യാചിച്ച്, ‘ഞങ്ങൾ പാപം ചെയ്തു; ഞങ്ങൾ നീതികേടു പ്രവർത്തിച്ചു; ഞങ്ങൾ ദുഷ്ടത ചെയ്തു’ എന്നു പറഞ്ഞാൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: അവർക്ക് സുബോധം വന്ന്
  rationale: ‘ഹൃദയത്തിലേക്കു തിരിച്ചുകൊണ്ടുവരുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വബോധത്തിലേക്കു വരിക, യാഥാർഥ്യം തിരിച്ചറിയുക എന്നതാണ്; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അത് പ്രകടമാക്കുന്നു.
- source_word: וְשָׁבוּ
  choice: അവർ തിരിഞ്ഞ്
  rationale: שׁוב എന്ന ക്രിയയ്ക്ക് ‘മടങ്ങുക’ എന്നും ‘തിരിയുക/മനംതിരിയുക’ എന്നും അർഥമാകാം. അവർ ഇപ്പോഴും പ്രവാസദേശത്താണെന്ന സന്ദർഭത്തിൽ ‘തിരിഞ്ഞ്’ എന്നത് ദൈവത്തിലേക്കുള്ള തിരിവിനെ സൂചിപ്പിക്കുമ്പോഴും മൂലത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: നിന്നോടു കരുണയ്ക്കായി യാചിച്ച്
  rationale: חנן മൂലത്തിൽനിന്നുള്ള ഈ രൂപം അനുകമ്പയോ കൃപയോ അഭ്യർഥിക്കുന്ന തീവ്രമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; വെറും ‘അപേക്ഷിച്ചു’ എന്നതിനെക്കാൾ മൂലാർഥം വ്യക്തമാക്കുന്നു.
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  choice: ഞങ്ങൾ പാപം ചെയ്തു; ഞങ്ങൾ നീതികേടു പ്രവർത്തിച്ചു; ഞങ്ങൾ ദുഷ്ടത ചെയ്തു
  rationale: പാപം, വക്രത/നീതികേട്, ദുഷ്ടത എന്നീ മൂന്നു വ്യത്യസ്ത എബ്രായ കുറ്റസമ്മതപദങ്ങളും ആവർത്തനഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְשָׁבוּ എന്നതിലെ ഭൗതിക മടങ്ങിവരവും ആത്മീയ തിരിവും തമ്മിലുള്ള അർഥസാധ്യത
  choice: അവർ തിരിഞ്ഞ്
  alternative: അവർ മാനസാന്തരപ്പെട്ട്
  rationale: ‘മാനസാന്തരപ്പെട്ട്’ എന്നത് ആത്മീയ വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കും. ‘തിരിഞ്ഞ്’ എന്നത് ഈ സന്ദർഭത്തിലെ ദൈവത്തിലേക്കുള്ള തിരിവ് സ്വാഭാവികമായി അറിയിക്കുകയും മൂലത്തിലെ വിശാലമായ അർഥസാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. കുറ്റസമ്മതത്തിലെ മൂന്നു സമാന്തരവാക്യങ്ങളും മൂലപാഠത്തിന്റെ ഊന്നലിനായി പ്രത്യേകം നിലനിർത്തിയിരിക്കുന്നു.
