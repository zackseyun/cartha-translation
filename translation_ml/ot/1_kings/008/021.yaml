source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: ml
  text: അവിടെ പെട്ടകത്തിനായി ഞാൻ ഒരു സ്ഥലം ഒരുക്കിയിരിക്കുന്നു. യഹ്‌വെ നമ്മുടെ പിതാക്കന്മാരുമായി[b] ചെയ്ത ഉടമ്പടി[a] ആ പെട്ടകത്തിലുണ്ട്; അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ അവിടുന്ന് ആ ഉടമ്പടി ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: “യഹ്‌വെ നമ്മുടെ പിതാക്കന്മാരുമായി മുറിച്ച ഉടമ്പടി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “നമ്മുടെ പൂർവികരുമായി.” എബ്രായയിൽ: “നമ്മുടെ പിതാക്കന്മാരുമായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם לָאָרוֹן
  choice: അവിടെ പെട്ടകത്തിനായി ഞാൻ ഒരു സ്ഥലം ഒരുക്കിയിരിക്കുന്നു
  rationale: שׂים എന്നതിന് അടിസ്ഥാനമായി ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും, ‘പെട്ടകത്തിനായി ഒരു സ്ഥലം വെച്ചു’ എന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്. സന്ദർഭത്തിലെ പൂർത്തിയായ ഒരുക്കത്തെ സ്വാഭാവികമായി അറിയിക്കാൻ ‘സ്ഥലം ഒരുക്കിയിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടി ആ പെട്ടകത്തിലുണ്ട്
  rationale: ശബ്ദാർഥത്തിൽ ‘അവിടെ യഹ്‌വെയുടെ ഉടമ്പടിയുണ്ട്’ എന്നാണ്. ബന്ധസർവനാമം പെട്ടകത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആ പെട്ടകത്തിലുണ്ട്’ എന്നു വ്യക്തമാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ പ്രചാരത്തിലുള്ള ശബ്ദലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כָּרַת
  choice: ചെയ്തു
  rationale: ‘ഉടമ്പടി മുറിച്ചു’ എന്നതാണ് എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം; എന്നാൽ ഉടമ്പടിയുടെ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളപ്രയോഗം ‘ഉടമ്പടി ചെയ്തു’ എന്നതാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: עִם אֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാരുമായി
  rationale: אבותינו എന്ന പദത്തിന്റെ വ്യക്തമായ പുല്ലിംഗരൂപവും പിതൃതലമുറകളിലേക്കുള്ള സൂചനയും നിലനിർത്തി. ‘പൂർവികർ’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: അവരെ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ കാലസൂചന നൽകുന്നു. ഹിഫിൽ രൂപത്തിന്റെ causative അർഥം ‘പുറപ്പെടുവിച്ചു’ എന്നതിലൂടെ നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ഒരു ബിരുദമാക്കി മാറ്റാതെ ശബ്ദലിപ്യന്തരണം ചെയ്തു; മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണരൂപം നിർബന്ധിച്ചില്ല.
- issue: אֲבֹתֵינוּ എന്ന പദത്തിലെ ലിംഗവും തലമുറസൂചനയും
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ബഹുവചനത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; കൂടുതൽ ഉൾക്കൊള്ളുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗശൈലി
  choice: ഉടമ്പടി ചെയ്യുക
  alternative: ഉടമ്പടി മുറിക്കുക
  rationale: മലയാളത്തിൽ അക്ഷരാർഥപ്രയോഗം തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കും. അതിനാൽ അർഥം മുഖ്യപാഠത്തിലും മൂലരൂപം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; എന്നാൽ പെട്ടകം, ഉടമ്പടി, പിതാക്കന്മാർ, പുറപ്പാട് എന്നിവ തമ്മിലുള്ള ബന്ധം മാറ്റിയിട്ടില്ല. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിച്ച സർവനാമത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
