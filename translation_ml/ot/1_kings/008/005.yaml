base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: ml
  text: ശലോമോൻ രാജാവും അദ്ദേഹത്തിന്റെ അടുക്കൽ കൂടിവന്നിരുന്ന[a] ഇസ്രായേലിന്റെ സർവസഭയും അദ്ദേഹത്തോടൊപ്പം പെട്ടകത്തിന്റെ മുമ്പിൽ ഉണ്ടായിരുന്നു. എണ്ണാനോ കണക്കാക്കാനോ കഴിയാത്തത്ര അനേകം ആടുകളെയും കന്നുകാലികളെയും അവർ യാഗമായി അർപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അദ്ദേഹത്തിന്റെ മുമ്പാകെ കൂടിവന്നിരുന്നവർ.” എബ്രായപ്രയോഗം ജനങ്ങൾ ശലോമോനുമായി ബന്ധപ്പെട്ട് സമ്മേളിച്ചതിനെ ഊന്നിപ്പറയുന്നുവായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: സഭ
  rationale: പൊതുവായ ആരാധനാസന്ദർഭത്തിൽ കൂടിവന്ന ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം; ഇവിടെ പിൽക്കാലത്തെ സഭാസംവിധാനം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ കൂടിവന്നിരുന്ന
  rationale: יעד എന്ന നിഫാൽ രൂപത്തിന്റെ കൂടിച്ചേരൽ എന്ന ആശയവും עָלָיו സൂചിപ്പിക്കുന്ന ശലോമോനോടുള്ള ബന്ധവും ദിശാഭാവവും നിലനിർത്തുന്നു.
- source_word: אִתּוֹ
  choice: അദ്ദേഹത്തോടൊപ്പം
  rationale: ശലോമോനോടൊപ്പം ജനസമൂഹവും ഉണ്ടായിരുന്നുവെന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי הָאָרוֹן
  choice: പെട്ടകത്തിന്റെ മുമ്പിൽ
  rationale: ആരാധനാസന്ദർഭത്തിലെ אָרוֹן എന്നതിന് സ്ഥാപിതമായ മലയാളപരിഭാഷയായ ‘പെട്ടകം’ ഉപയോഗിക്കുകയും സ്ഥലബന്ധം കൃത്യമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: מְזַבְּחִים
  choice: യാഗം കഴിച്ചുകൊണ്ടിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന യാഗാർപ്പണപ്രവൃത്തി പങ്കാളിത്തരൂപത്തിന്റെ ഭാവത്തോടെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: צֹאן וּבָקָר
  choice: ആടുമാടുകളെ
  rationale: ചെറുകന്നുകാലികളെയും വലിയ കന്നുകാലികളെയും മലയാളത്തിലെ പതിവായ സമുച്ചയപ്രയോഗത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: എണ്ണാനോ കണക്കാക്കാനോ കഴിയാത്തത്ര
  rationale: എബ്രായത്തിലെ സമാന്തരമായ രണ്ടു ക്രിയകളുടെ ഊന്നൽ മലയാളത്തിൽ രണ്ടു വ്യത്യസ്ത ക്രിയകളിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֵרֹב
  choice: അനവധി
  rationale: അവയുടെ അതിബാഹുല്യം കൊണ്ടാണ് എണ്ണാൻ കഴിയാത്തത് എന്ന കാരണഭാവം ‘കഴിയാത്തത്ര അനവധി’ എന്ന സ്വാഭാവിക ഘടനയിൽ ഉൾക്കൊള്ളിക്കുന്നു.
theological_decisions:
- issue: ‘പെട്ടകം’ എന്ന പരാമർശത്തിന്റെ പരിധി
  choice: പെട്ടകം
  alternative: ഉടമ്പടിയുടെ പെട്ടകം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠത്തിൽ ‘പെട്ടകം’ എന്നുമാത്രമാണ്; ‘ഉടമ്പടിയുടെ’ എന്നു ചേർക്കുന്നത് സമീപസന്ദർഭത്തിൽ നിന്നുള്ള വിവരത്തെ മൂലവാചകത്തിലേക്ക് വികസിപ്പിച്ചുചേർക്കുന്നതാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട എബ്രായവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; അർത്ഥബന്ധങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
