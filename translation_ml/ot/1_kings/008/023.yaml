  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേ, മീതെയുള്ള ആകാശത്തിലും താഴെയുള്ള ഭൂമിയിലും അങ്ങയെപ്പോലെ ഒരു ദൈവവുമില്ല.[a] അങ്ങയുടെ മുമ്പാകെ പൂർണഹൃദയത്തോടെ നടക്കുന്ന അങ്ങയുടെ ദാസന്മാർക്കായി ഉടമ്പടിയും അചഞ്ചലസ്നേഹവും[b] കാത്തുപാലിക്കുന്നവനാണ് അങ്ങ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘മീതെയുള്ള ആകാശങ്ങളിലും താഴെയുള്ള ഭൂമിയിലും.’'
    reason: ഹീബ്രുവിലെ שָׁמַיִם രൂപപരമായി ബഹുവചനമാണ്; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി മുഖ്യവാചകത്തിൽ ഏകവചനം ഉപയോഗിച്ചു.
  - marker: b
    text: 'ഹീബ്രു: ഹെസെദ്; ഉടമ്പടിയോടുള്ള വിശ്വസ്തത, വിശ്വസ്തസ്നേഹം, അചഞ്ചലസ്നേഹം എന്നീ ആശയങ്ങൾ ഈ പദത്തിൽ ഉൾപ്പെടാം.'
    reason: חֶסֶד എന്ന പ്രധാന ഉടമ്പടിപദത്തിന്റെ വിശാലമായ അർഥപരിധി സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ wayyiqtol ക്രമം ലളിതമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഈ സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: അങ്ങയെപ്പോലെ ഒരു ദൈവവുമില്ല
  rationale: യാഹ്‌വേയുടെ അതുല്യതയെ ഉറപ്പിക്കുന്ന വാക്യത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; אֱלֹהִים എന്നതിനെ സന്ദർഭാനുസൃതമായി ഏകവചന അർഥത്തിൽ നൽകുന്നു.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: മീതെയുള്ള ആകാശത്തിലും താഴെയുള്ള ഭൂമിയിലും
  rationale: മുകളിലും താഴെയും ചേർത്ത് സകല സൃഷ്ടിയെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: שֹׁמֵר
  choice: കാത്തുപാലിക്കുന്നവനാണ്
  rationale: ദൈവത്തിന്റെ സ്ഥിരസ്വഭാവത്തെ വിവരിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: הַבְּרִית
  choice: ഉടമ്പടി
  rationale: ദൈവവും അവന്റെ ജനവും തമ്മിലുള്ള ബാധ്യതയുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: וְהַחֶסֶד
  choice: അചഞ്ചലസ്നേഹം
  rationale: חֶסֶד-ൽ ഉൾക്കൊള്ളുന്ന സ്ഥിരത, വിശ്വസ്തത, സ്നേഹം എന്നിവയെ ഒറ്റ മലയാളപ്രയോഗത്തിൽ പരമാവധി സംരക്ഷിക്കുന്നു.
- source_word: לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർക്കായി
  rationale: ഇവിടെ പ്രധാനമായുള്ള സേവനപരവും ഉടമ്പടിപരവുമായ ബന്ധം വ്യക്തമാക്കുന്നു; അടിമത്തത്തെ അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: അങ്ങയുടെ മുമ്പാകെ നടക്കുന്ന
  rationale: ദൈവസന്നിധിയിൽ വിശ്വസ്തമായി ജീവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നടത്തം-രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: בְּכָל לִבָּם
  choice: പൂർണഹൃദയത്തോടെ
  rationale: വിഭജിക്കപ്പെടാത്ത ആന്തരിക സമർപ്പണത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: חֶסֶד എന്ന പദത്തിന്റെ ഉടമ്പടിസന്ദർഭത്തിലുള്ള അർഥം
  choice: അചഞ്ചലസ്നേഹം
  alternative: വിശ്വസ്തസ്നേഹം / ദയ
  rationale: വെറും വികാരമോ കരുണയോ എന്നതിലേക്കു ചുരുക്കാതെ സ്നേഹവും ഉടമ്പടിവിശ്വസ്തതയും തമ്മിലുള്ള അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: אֵין כָּמוֹךָ אֱלֹהִים എന്നതിലെ אֱלֹהִים
  choice: അങ്ങയെപ്പോലെ ഒരു ദൈവവുമില്ല
  alternative: ദേവന്മാരിൽ അങ്ങയെപ്പോലെ ആരുമില്ല
  rationale: സന്ദർഭത്തിലെ ദൈവത്തിന്റെ അതുല്യതയെ നേരിട്ട് പ്രകടിപ്പിക്കുമ്പോഴും താരതമ്യവാക്യത്തിന്റെ അടിസ്ഥാനശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തിയെങ്കിലും വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
