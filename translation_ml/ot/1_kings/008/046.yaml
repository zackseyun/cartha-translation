  terminology: പാപം, കോപിച്ച്, ഏൽപ്പിക്കുക, ശത്രു, and ശത്രുദേശം suit the register and accurately convey the key terms. മനുഷ്യൻ preserves the source's generic singular without restricting the sense to males.
