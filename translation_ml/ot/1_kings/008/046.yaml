id: 1KI.8.46
reference: 1 Kings 8:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: ml
  text: അവർ നിന്നോടു പാപം ചെയ്യുമ്പോൾ—പാപം ചെയ്യാത്ത ഒരു മനുഷ്യനും ഇല്ല—നീ അവരോടു കോപിച്ച് അവരെ ഒരു ശത്രുവിന്റെ കയ്യിൽ ഏൽപ്പിക്കുകയും, അവരെ പിടിച്ചവർ അവരെ ബന്ധികളാക്കി ദൂരത്തോ അടുത്തോ ഉള്ള ശത്രുദേശത്തേക്ക് കൊണ്ടുപോകുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: അവർ നിന്നോടു പാപം ചെയ്യുമ്പോൾ
  rationale: ആദ്യത്തെ כִּי ശലോമോന്റെ പ്രാർഥനയിലെ സോപാധിക സാഹചര്യം അവതരിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘പാപം ചെയ്യാത്ത ഒരു മനുഷ്യനും ഇല്ല’ എന്ന പ്രസ്താവന കണക്കിലെടുക്കുമ്പോൾ ‘ചെയ്യുമ്പോൾ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; לָךְ ദൈവത്തിനെതിരായ ബന്ധപരമായ കുറ്റത്തെ ‘നിന്നോടു’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: പാപം ചെയ്യാത്ത ഒരു മനുഷ്യനും ഇല്ലല്ലോ
  rationale: אָדָם ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഏകവചനമാണ്. ‘മനുഷ്യൻ’ ഉറവിടത്തിലെ പൊതുവായ മാനുഷിക അർഥം നിലനിർത്തുന്നു; ‘ഇല്ലല്ലോ’ കാരണം സൂചിപ്പിക്കുന്ന כִּי-യുടെ വ്യാഖ്യാനാത്മക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְאָנַפְתָּ בָם
  choice: നീ അവരോടു കോപിച്ച്
  rationale: אָנַף ദൈവത്തിന്റെ കോപത്തെ സൂചിപ്പിക്കുന്നു. ‘കോപിച്ച്’ ക്രിയയുടെ ശക്തി അതിരുകടക്കാതെ തുടർച്ചയായ പ്രവൃത്തികളുടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: അവരെ ഒരു ശത്രുവിന്റെ കയ്യിൽ ഏൽപ്പിക്കുകയും
  rationale: נתן + לפני എന്ന പ്രയോഗം ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ ശത്രുവിന്റെ അധികാരത്തിന് വിട്ടുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. אוֹיֵב നിർദേശകപദമില്ലാത്ത ഏകവചനമായതിനാൽ ‘ഒരു ശത്രു’ എന്നു നൽകി.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: അവരെ പിടിച്ചവർ അവരെ ബന്ദികളാക്കി … കൊണ്ടുപോകുകയും
  rationale: മൂലഭാഷയിലെ ബന്ധിത പദപ്രയോഗം പിടിച്ചുകൊണ്ടുപോകലും പ്രവാസത്തിലാക്കലും ഒരുമിച്ച് പ്രകടമാക്കുന്നു. ആവർത്തനം പൂർണമായി ഒഴിവാക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ കർത്താവും കർമവും വ്യക്തമായി സൂക്ഷിച്ചു.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: ദൂരത്തോ അടുത്തോ ഉള്ള ശത്രുദേശത്തേക്ക്
  rationale: വിശേഷണങ്ങൾ ‘ദേശം’ എന്ന നാമത്തോടു യോജിച്ച് ദൂരമോ സമീപമോ ആയ ശത്രുദേശം എന്ന രണ്ടു സാധ്യതകളും തുറന്നുവെക്കുന്നു. ‘ശത്രുദേശം’ ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: മനുഷ്യൻ
  alternative: ആരും
  rationale: ഇവിടെ ഏകവചനമായ אָדָם മുഴുവൻ മനുഷ്യരെയും പൊതുവായി പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ ലിംഗപരമായി ചുരുക്കാതെ ഉറവിടപദത്തിന്റെ മാനുഷിക വ്യാപ്തി നിലനിർത്തുന്നു; കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള ‘ആരും’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. വാക്യം അടുത്ത വാക്യങ്ങളിലേക്ക് തുടരുന്നതിനാൽ മൂലത്തിലെ സോപാധിക ഘടനയും അവസാനത്തെ അൽപവിരാമവും നിലനിർത്തി.
