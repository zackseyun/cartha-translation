  source_fidelity: The conditional sequence, divine anger, surrender to an enemy, deportation by captors, and the far-or-near qualification are all represented accurately. The generic singular אָדָם is appropriately rendered by മനുഷ്യൻ, with an inclusive alternative in the footnote.
