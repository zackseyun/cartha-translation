source:
  edition: WLC
  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: ml
  text: ഒരാൾ തന്റെ അയൽക്കാരനോടു പാപം ചെയ്യുകയും, അവനെക്കൊണ്ട് ശപഥം ചെയ്യിക്കാനായി അവന്റെമേൽ ഒരു ശപഥം[a] ചുമത്തപ്പെടുകയും, ആ ശപഥം ഈ ഭവനത്തിലെ നിന്റെ യാഗപീഠത്തിനുമുമ്പാകെ വരികയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശാപം’; എബ്രായപദം ശപഥത്തെയോ, ശപഥം ലംഘിച്ചാൽ വരുത്തിവിളിക്കുന്ന ശാപത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: പാപം ചെയ്യുക
  rationale: നിയമപരമായ തെറ്റിനെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിലും മൂലക്രിയയുടെ ധാർമിക-മതപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: ഒരാൾ
  rationale: എബ്രായത്തിലെ പുല്ലിംഗ ഏകവചനം ഇവിടെ പൊതുവായ പ്രതിനിധിപ്രയോഗമാണ്; ആധുനിക മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികമായി അതേ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: לְרֵעֵהוּ
  choice: തന്റെ അയൽക്കാരനോട്
  rationale: רֵעַ എന്ന പദത്തിന്റെ സഹജീവി/അയൽക്കാരൻ എന്ന ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: അവന്റെമേൽ ഒരു ശപഥം ചുമത്തപ്പെടുക
  rationale: ശപഥം ഒരാളുടെമേൽ ചുമത്തപ്പെടുന്നു എന്ന എബ്രായ വാക്യഘടനയും നിയമനടപടിയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: לְהַאֲלֹתוֹ
  choice: അവനെക്കൊണ്ട് ശപഥം ചെയ്യിക്കേണ്ടതിന്
  rationale: ഹിഫീൽ ക്രിയാരൂപത്തിന്റെ കാരണാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבָא אָלָה
  choice: ആ ശപഥം വരിക
  rationale: വാക്യത്തിലെ കർത്താവ് ശപഥമാണെന്ന ഏറ്റവും സ്വാഭാവികമായ വ്യാകരണവായന നിലനിർത്തുന്നു.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: നിന്റെ യാഗപീഠത്തിനുമുമ്പാകെ
  rationale: സ്ഥലപരവും ന്യായവിധിസംബന്ധവുമായ പ്രയോഗം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: בַּבַּיִת הַזֶּה
  choice: ഈ ഭവനത്തിലുള്ള
  rationale: ക്ഷേത്രത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും בַּיִת എന്നതിന്റെ ‘ഭവനം’ എന്ന രൂപക-ദൈവശാസ്ത്രപരമായ ഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്ഷേത്ര-ന്യായവ്യവഹാര സന്ദർഭത്തിലെ אָלָה എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ശപഥം
  alternative: ശാപം
  rationale: ഇവിടെ യാഗപീഠത്തിനുമുമ്പാകെയുള്ള ന്യായവ്യവഹാര ശപഥമാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്. എന്നാൽ ശപഥം ലംഘിച്ചാൽ വരുത്തിവിളിക്കുന്ന ശാപം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും നീണ്ട ഉപാധിവാക്യഘടനയും സാധ്യമായത്ര നിലനിർത്തിയിരിക്കുന്നു; ‘ആലയം’ എന്ന വ്യാഖ്യാനപരമായ പദത്തിനു പകരം ‘ഭവനം’ ഉപയോഗിച്ചു.
