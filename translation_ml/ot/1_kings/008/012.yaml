  terminology: ‘യഹോവ’ consistently renders the Tetragrammaton, and ‘കൂരിരുളിൽ’ is an apt rendering of עֲרָפֶל. The lexical-alternative footnote correctly preserves the viable ‘dark cloud’ sense without displacing the main rendering.
