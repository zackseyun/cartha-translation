id: 1KI.8.12
reference: 1 Kings 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: ml
  text: 'അപ്പോൾ ശലോമോൻ പറഞ്ഞു: “യഹോവ കൂരിരുളിൽ വസിക്കുമെന്ന് പറഞ്ഞു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരുണ്ട മേഘത്തിൽ.” എബ്രായപദമായ עֲרָפֶל സാന്ദ്രമായ ഇരുട്ടിനെയോ ഇരുണ്ട മേഘത്തെയോ സൂചിപ്പിക്കാം; പ്രത്യേകിച്ച് യഹോവയുടെ പ്രത്യക്ഷസാന്നിധ്യത്തെ വിവരിക്കുന്ന സന്ദർഭങ്ങളിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ശലോമോന്റെ വാക്കുകളെ മുൻസംഭവവുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചകപ്രയോഗം.
- source_word: אָמַר
  choice: പറഞ്ഞു / അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: ആദ്യത്തേത് സാധാരണ ആഖ്യാനപ്രയോഗമായി ‘പറഞ്ഞു’ എന്നും, യഹോവയുടെ മുൻപ്രസ്താവനയെ ആദരസൂചകവും സ്വാഭാവികവുമായ ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ എന്നും നൽകി.
- source_word: שְׁלֹמֹה
  choice: ശലോമോൻ
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ പേരുരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണരൂപം ഉപയോഗിച്ചു.
- source_word: לִשְׁכֹּן
  choice: വസിക്കുമെന്ന്
  rationale: אמר എന്ന ക്രിയയ്ക്കു പിന്നാലെയുള്ള ל-യോടുകൂടിയ infinitive, പറഞ്ഞതിന്റെ ഉള്ളടക്കമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വസിക്കുമെന്ന്’ സ്വാഭാവികമാണ്.
- source_word: בָּעֲרָפֶל
  choice: കൂരിരുളിൽ
  rationale: עֲרָפֶל സൂചിപ്പിക്കുന്ന സാന്ദ്രമായ ഇരുട്ടും ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട മറവിയുടെ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: עֲרָפֶל എന്നതിൽ യഹോവ വസിക്കുന്നു എന്ന ദൈവപ്രത്യക്ഷതാ ചിത്രം
  choice: യഹോവ കൂരിരുളിൽ വസിക്കുമെന്ന്
  alternative: യഹോവ ഇരുണ്ട മേഘത്തിൽ വസിക്കുമെന്ന്
  rationale: ദൈവസാന്നിധ്യവും മറവും ഒരുമിച്ചു നിൽക്കുന്ന വാക്യത്തിലെ സംഘർഷം പരിഹരിക്കാതെ ‘കൂരിരுள்’ നിലനിർത്തുന്നു; അതേസമയം ‘ഇരുണ്ട മേഘം’ എന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൂരിരுள்’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ദൈവപ്രത്യക്ഷതാ ദൃശ്യത്തിന്റെ ഗാഢത നിലനിർത്തുന്നതുമാണ്.
