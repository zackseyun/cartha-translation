revisions:
- from: താൻ അരുളിച്ചെയ്തതെല്ലാം അനുസരിച്ച് തന്റെ ജനമായ ഇസ്രായേലിനു സ്വസ്ഥത നൽകിയ യഹ്‌വാ വാഴ്ത്തപ്പെട്ടവൻ. തന്റെ ദാസനായ മോശെയിലൂടെ അരുളിച്ചെയ്ത അവിടുത്തെ നല്ല വചനങ്ങളിലൊന്നുപോലും നിറവേറാതിരുന്നിട്ടില്ല.[a]
