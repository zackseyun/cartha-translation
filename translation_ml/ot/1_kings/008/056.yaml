  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: ml
  text: താൻ അരുളിച്ചെയ്തതെല്ലാം അനുസരിച്ച് തന്റെ ജനമായ ഇസ്രായേലിന് വിശ്രമം നൽകിയ യഹ്‌വാ വാഴ്ത്തപ്പെട്ടവനായിരിക്കട്ടെ. അവിടുന്ന് തന്റെ ദാസനായ മോശെയിലൂടെ അരുളിച്ചെയ്ത തന്റെ എല്ലാ നല്ല വചനങ്ങളിലും ഒരു വചനംപോലും പരാജയപ്പെട്ടിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടുന്ന് അരുളിച്ചെയ്ത തന്റെ എല്ലാ നല്ല വാഗ്ദാനങ്ങളിലും ഒന്നുപോലും പരാജയപ്പെട്ടിട്ടില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ‘വചനം’ എന്നതിന് അരുളിച്ചെയ്ത വാഗ്ദാനം എന്ന അർത്ഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ആശീർവാദാത്മകവും സ്തുതിപരവുമായ ഉദ്‌ഘോഷത്തിന്റെ ഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വാ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: נָתַן מְנוּחָה
  choice: സ്വസ്ഥത നൽകി
  rationale: ശത്രുക്കളിൽനിന്നും അസ്ഥിരതയിൽനിന്നും ലഭിച്ച സ്ഥിരമായ വിശ്രമാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; വെറും ആന്തരിക സമാധാനം എന്നർത്ഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: തന്റെ ജനമായ ഇസ്രായേലിനു
  rationale: ഉടമ്പടിബന്ധവും ഇസ്രായേൽ എന്ന സമാനാധികരണവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: താൻ അരുളിച്ചെയ്തതെല്ലാം അനുസരിച്ച്
  rationale: ദൈവിക പ്രസംഗത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് 'വാഗ്ദാനം ചെയ്തു' എന്ന വ്യാഖ്യാനാത്മക പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ഒന്നുപോലും നിറവേറാതിരുന്നിട്ടില്ല
  rationale: '''ഒരു വാക്കും വീണില്ല'' എന്ന എബ്രായ ശൈലിയുടെ അർത്ഥമായ പരാജയപ്പെടാതിരിക്കുക അഥവാ നിറവേറാതെ പോകാതിരിക്കുക എന്നത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.'
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: അവിടുത്തെ നല്ല വചനങ്ങളിൽ
  rationale: വാഗ്ദാനസൂചനയുണ്ടെങ്കിലും എബ്രായത്തിലെ 'വചനം' എന്ന പദപ്രയോഗം നിലനിർത്തുന്നു; സമൂഹാർഥമുള്ള ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: എബ്രായത്തിലെ ഏജൻസി-ശൈലിയുടെ അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥമായ 'മോശെയുടെ കൈയാൽ' അസ്വാഭാവികമാണ്.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസനായ
  rationale: മോശെയുടെ ദൈവനിയോഗിത സേവനപദവി ഗൗരവത്തോടെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ മലയാളപദം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വാ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു പദവിയാൽ പകരാതെ നേരിട്ട് ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: דָּבָר / דְּבָרוֹ എന്നത് 'വചനം' ആണോ 'വാഗ്ദാനം' ആണോ
  choice: വചനം
  alternative: വാഗ്ദാനം
  rationale: സന്ദർഭത്തിൽ വാഗ്ദാനനിറവേറൽ വ്യക്തമായിരുന്നാലും മൂലപാഠം ആവർത്തിച്ച് 'വചനം' എന്നാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനാത്മകമായ 'വാഗ്ദാനം' അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കാൻ ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു; എന്നാൽ പഴഞ്ചൻ വാക്യഘടനയും അക്ഷരാർഥ എബ്രായ പ്രയോഗങ്ങളും ഒഴിവാക്കി.
