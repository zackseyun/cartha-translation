  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: ml
  text: അപ്പോൾ രാജാവ് മുഖം തിരിച്ച്[a] ഇസ്രായേലിന്റെ മുഴുവൻ സഭയെയും[b] അനുഗ്രഹിച്ചു. ഇസ്രായേലിന്റെ മുഴുവൻ സഭയും നിൽക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരിഞ്ഞ്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘തന്റെ മുഖം തിരിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഇസ്രായേലിന്റെ മുഴുവൻ ജനസമൂഹത്തെയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: മുഖം തിരിച്ച്
  rationale: ‘തന്റെ മുഖം തിരിച്ചു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചു
  rationale: ഈ രാജകീയവും പൊതുവുമായ സന്ദർഭത്തിൽ ആശീർവാദം അരുളുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ചുരുക്കവും പതിവുമായ മലയാളപ്രയോഗം.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മുഴുവൻ സഭ
  rationale: קהל എന്നത് കൂടിവന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘മുഴുവൻ സഭ’ അതിന്റെ സമഗ്രവും സമൂഹപരവുമായ അർഥം നിലനിർത്തുന്നു; പാഠത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുകയായിരുന്നു
  rationale: സമൂഹവാചിയായ ഏകവചന കർത്താവിനോടു ചേർന്ന പങ്കാളിക്രിയ ഇവിടെ തുടർന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ഈ രൂപം ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ മുഴുവൻ സഭ’ എന്ന ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തി; ‘നിൽക്കുകയായിരുന്നു’ എന്ന രൂപം ആശീർവാദസമയത്തെ തുടരുന്ന പശ്ചാത്തലഭാവം പ്രകടമാക്കുന്നു.
