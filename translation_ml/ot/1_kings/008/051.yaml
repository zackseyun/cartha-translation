id: 1KI.8.51
reference: 1 Kings 8:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: ml
  text: എന്തെന്നാൽ അവർ അങ്ങയുടെ ജനവും അങ്ങയുടെ അവകാശവും[a] ആകുന്നു; അങ്ങ് അവരെ ഈജിപ്തിൽനിന്ന്, ഇരുമ്പുചൂളയുടെ നടുവിൽനിന്ന്[b], പുറത്തുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അങ്ങയുടെ സ്വന്തസ്വത്ത്’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ അവകാശസ്വത്ത്.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഇരുമ്പുചൂള’ എന്നത് അതികഠിനമായ പീഡനത്തിന്റെയും കഷ്ടതയുടെയും സ്ഥലമായ ഈജിപ്തിനെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; ആവർത്തനം 4:20 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ആകുന്നു;
  rationale: ഈ വാക്യം ചുറ്റുപാടിലുള്ള ശലോമോന്റെ അപേക്ഷയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ മുൻസന്ദർഭത്തോടു ചേർന്ന കാരണാർഥം സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു.
- source_word: עַמְּךָ
  choice: അങ്ങയുടെ ജനം
  rationale: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന മാന്യമായ ‘അങ്ങയുടെ’ എന്ന രൂപത്തോടുകൂടെ ഉടമ്പടിബന്ധമുള്ള ജനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וְנַחֲלָתְךָ
  choice: അങ്ങയുടെ അവകാശം
  rationale: נַחֲלָה എന്നത് അവകാശമായി ലഭിച്ച പങ്കിനെയോ കൈവശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവകാശം’ ദൈവത്തിനുള്ള ജനമെന്ന ഉടമ്പടിപരമായ ആശയം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: הֵם
  choice: അവർ ... ആകുന്നു
  rationale: ഊന്നലുള്ള സ്വതന്ത്ര സർവനാമത്തിന്റെ വിധേയപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: אֲשֶׁר
  choice: അവരെയാണ്
  rationale: മുൻപറഞ്ഞ ജനത്തെയാണ് ബന്ധവാക്യം സൂചിപ്പിക്കുന്നത്; ‘അവരെയാണ്’ എന്നത് വ്യക്തിപരമായ സൂചനയും എബ്രായത്തിലെ ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הוֹצֵאתָ
  choice: പുറത്തുകൊണ്ടുവന്നത്
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥവും പുറപ്പാടിന്റെ സ്ഥിരമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന്
  rationale: പുറത്തുകൊണ്ടുവരിക എന്ന ക്രിയയോടൊപ്പം ഉത്ഭവസ്ഥലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִתּוֹךְ
  choice: നടുവിൽനിന്ന്
  rationale: ഒന്നിന്റെ ഉള്ളിൽനിന്നുള്ള മോചനമെന്ന ദൃശ്യഭാവം ലളിതമായ ‘നിന്ന്’ എന്നതിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: כּוּר הַבַּרְזֶל
  choice: ഇരുമ്പുചൂള
  rationale: കഠിനമായ പീഡനസ്ഥലമായ ഈജിപ്തിനെ ചിത്രീകരിക്കുന്ന മൂലരൂപകം വിശദീകരിച്ചു മാറ്റാതെ സംക്ഷിപ്തമായും ശക്തമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ ദൈവത്തിന്റെ נַחֲלָה എന്നു വിളിക്കുന്ന ഉടമ്പടിപരമായ വിശേഷണം
  choice: പ്രധാനപാഠത്തിൽ ‘അങ്ങയുടെ അവകാശം’ നിലനിർത്തി
  alternative: അങ്ങയുടെ കൈവശം; അങ്ങയുടെ പൈതൃകം
  rationale: എബ്രായപദത്തിലെ അവകാശപങ്ക്, ഉടമസ്ഥത എന്നീ അർഥതലങ്ങൾ ‘അവകാശം’ സംരക്ഷിക്കുന്നു; അതേസമയം പാഠത്തിനപ്പുറമുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ‘ഇരുമ്പുചൂള’ എന്ന ശക്തമായ രൂപകം അതേപടി സംരക്ഷിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
