source:
  edition: WLC
  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: ml
  text: നിനക്കായി ഞാൻ നിശ്ചയമായും ഒരു ഉന്നതമായ ഭവനം[a]—നീ എന്നേക്കും വസിക്കാനുള്ള ഒരു സ്ഥിരമായ സ്ഥലം[b]—പണിതിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹിമയേറിയ ഒരു വാസഭവനം.’ എബ്രായത്തിലെ זְבֻל ഉയർന്നതോ മഹിമയേറിയതോ ആയ ഒരു വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിന്റെ വാസത്തിനായുള്ള ഒരു ഉറപ്പിച്ച സ്ഥലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: ഞാൻ നിശ്ചയമായും ... പണിതിരിക്കുന്നു
  rationale: ക്രിയയ്ക്കു മുമ്പുള്ള infinitive absolute പ്രവൃത്തിക്ക് ഊന്നൽ നൽകുന്നു; ആവർത്തനം കൃത്രിമമായി തോന്നാതിരിക്കാൻ ‘നിശ്ചയമായും’ ഉപയോഗിച്ചു.
- source_word: בֵּית
  choice: ഭവനം
  rationale: അക്ഷരാർഥം ‘വീട്/ഭവനം’ എന്നാണ്. ഇവിടെ ആലയം സൂചിപ്പിക്കുന്നുവെങ്കിലും ദൈവത്തിന്റെ ഭവനം എന്ന എബ്രായ പ്രയോഗവും അതിന്റെ ധാർമിക അനുരണനവും നിലനിർത്തുന്നു.
- source_word: זְבֻל
  choice: ഉന്നതമായ
  rationale: ഈ നാമം ഉയർന്നതോ മഹിമയേറിയതോ ആയ വാസസ്ഥാനത്തെ സൂചിപ്പിക്കാം. ‘ഭവനം’ എന്നതിനോടു ചേർന്ന വിശേഷണമായി നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: לָךְ
  choice: നിനക്കായി
  rationale: ഈ പൂർവപ്രത്യയം പ്രയോജനമോ ദിശയോ സൂചിപ്പിക്കുന്നു; ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: מָכוֹן
  choice: സ്ഥിരസ്ഥാനം
  rationale: സ്ഥാപിതമായ, ഉറപ്പുള്ള സ്ഥലം എന്ന ആശയം നൽകുന്നു; തുടർന്നുള്ള വാസക്രിയയുമായി ചേർന്ന് സ്ഥിരതയും നിലനിൽപ്പും വ്യക്തമാക്കുന്നു.
- source_word: לְשִׁבְתְּךָ
  choice: നീ ... വസിക്കാനുള്ള
  rationale: ישׁב എന്ന ധാതുവിന് ‘ഇരിക്കുക, വസിക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ആലയസന്ദർഭത്തിൽ സിംഹാസനാസീനതയുടെ സൂചന ഉണ്ടായേക്കാമെങ്കിലും ഇവിടെ ‘വസിക്കുക’ ഭവനപ്രതീകത്തോടു സ്വാഭാവികമായി ചേരുന്നു.
- source_word: עוֹלָמִים
  choice: എന്നേക്കും
  rationale: ബഹുവചനരൂപം ദീർഘകാലസ്ഥായിത്വത്തിന് ഊന്നൽ നൽകുന്നു; ‘എന്നേക്കും’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ആലയത്തെ ദൈവത്തിന്റെ അക്ഷരാർഥത്തിലുള്ള സ്ഥിരവാസസ്ഥാനമായി അവതരിപ്പിക്കുന്നത് ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ധാർമികതയെ അതിരുകടന്ന് നിർവചിക്കുമോ എന്ന ചോദ്യം
  choice: വാക്യത്തിലെ വാസഭാഷ വിശദീകരിച്ചു ചുരുക്കാതെയും യോഗ്യതപ്പെടുത്താതെയും നിലനിർത്തി
  alternative: ‘നിന്റെ നാമം വസിക്കാനുള്ള സ്ഥലം’ എന്നോ ‘നിന്നെ ആരാധിക്കാനുള്ള സ്ഥലം’ എന്നോ വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക
  rationale: എബ്രായപാഠം ദൈവത്തിനായുള്ള ഭവനത്തെയും അവൻ വസിക്കാനുള്ള സ്ഥാനത്തെയും വ്യക്തമായി പറയുന്നു. വിശാലസന്ദർഭത്തിലെ വിശദീകരണങ്ങൾ ഈ വാക്യത്തിനകത്ത് ചേർക്കാതെ ഉടമ്പടിയുടെയും ആലയത്തിന്റെയും ഭാഷ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ ശൈലി. ‘ആലയം’ എന്ന വ്യാഖ്യാനപദത്തിനു പകരം മൂലത്തിലെ ‘ഭവനം’ നിലനിർത്തി. ഊന്നലും സ്ഥിരതയും സ്വാഭാവിക മലയാളത്തിലൂടെ പ്രകടമാക്കി; കവിതാത്മക സമാന്തരത സംരക്ഷിക്കാൻ രണ്ടാം ഖണ്ഡത്തിൽ ക്രിയ അധ്യാഹരിച്ചിരിക്കുന്നു.
