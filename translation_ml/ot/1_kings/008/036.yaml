base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: ml
  text: അപ്പോൾ അങ്ങ് സ്വർഗത്തിൽ[a] കേട്ട് അങ്ങയുടെ ദാസന്മാരുടെയും അങ്ങയുടെ ജനമായ ഇസ്രായേലിന്റെയും പാപം ക്ഷമിക്കണമേ. അവർ നടക്കേണ്ട നല്ല വഴി അങ്ങ് അവരെ പഠിപ്പിക്കുമ്പോൾ[b], അങ്ങയുടെ ജനത്തിന് അവകാശമായി നൽകിയ അങ്ങയുടെ ദേശത്തിന്മേൽ മഴ നൽകണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സ്വർഗത്തിൽനിന്ന് കേട്ട്.” ഹീബ്രായത്തിൽ മുൻനിലപദം വ്യക്തമാക്കിയിട്ടില്ല.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവർ നടക്കേണ്ട നല്ല വഴി അങ്ങ് അവരെ പഠിപ്പിക്കുന്നതിനാൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽ കേട്ട്
  rationale: ഹീബ്രായ പ്രയോഗത്തിൽ മുൻനിലപദം വ്യക്തമാക്കിയിട്ടില്ല; പ്രാർഥനാസന്ദർഭത്തിൽ ‘സ്വർഗത്തിൽ കേൾക്കുക’ എന്നത് സ്വാഭാവികവും മൂലഘടനയോട് അടുത്തതുമാണ്.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: പാപം ക്ഷമിക്കണമേ
  rationale: ഇവിടെ חַטָּאת പാപയാഗത്തെയല്ല, ക്ഷമ ആവശ്യമായ തെറ്റിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: അങ്ങയുടെ ദാസന്മാരായ ഇസ്രായേൽജനം
  rationale: ഇസ്രായേൽജനം തന്നെയാണ് ‘അങ്ങയുടെ ദാസന്മാർ’ എന്ന് സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי תוֹרֵם
  choice: അങ്ങ് അവരെ പഠിപ്പിക്കുമ്പോൾ
  rationale: כִּי എന്നതിന്റെ കാലസാഹചര്യാർഥവും ירה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘പഠിപ്പിക്കുക/ഉപദേശിക്കുക’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: അവർ നടക്കേണ്ട നല്ല വഴി
  rationale: ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ‘വഴി/നടക്കുക’ എന്ന മൂലരൂപകം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: അങ്ങയുടെ ദേശത്തിന്മേൽ മഴ നൽകണമേ
  rationale: ‘മഴ നൽകുക’ എന്ന നേരിട്ടുള്ള പ്രയോഗവും ദേശത്തിന്മേലുള്ള ദൈവിക ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന രണ്ടാംപുരുഷ പ്രത്യയവും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: അങ്ങയുടെ ജനത്തിന് അവകാശമായി നൽകിയ
  rationale: נַחֲלָהയുടെ ഉടമ്പടിപരമായ ഭൂമിയവകാശഭാവം ആധുനിക മലയാളത്തിൽ ‘അവകാശം’ എന്ന പദം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദേശത്തിന്റെ ദൈവിക ഉടമസ്ഥതയും ജനത്തിനു ലഭിച്ച അവകാശവും
  choice: അങ്ങയുടെ ജനത്തിന് അവകാശമായി നൽകിയ അങ്ങയുടെ ദേശം
  alternative: അങ്ങയുടെ ജനത്തിന് അവകാശമായി നൽകിയ ദേശം
  rationale: ഹീബ്രായം ദേശത്തെ വ്യക്തമായി ‘അങ്ങയുടെ ദേശം’ എന്നു വിളിക്കുകയും അതേ ദേശം ജനത്തിനു അവകാശമായി നൽകിയതാണെന്ന് പറയുകയും ചെയ്യുന്നു; ഈ ഇരട്ട ഊന്നൽ നിലനിർത്തി.
- issue: כִּי എന്ന ബന്ധകത്തിന്റെ അർഥം
  choice: പഠിപ്പിക്കുമ്പോൾ
  alternative: പഠിപ്പിക്കുന്നതിനാൽ
  rationale: സന്ദർഭത്തിൽ കാലസാഹചര്യാർഥം യോജിച്ചാലും കാരണാർഥം വ്യാകരണപരമായി സാധ്യമാണ്; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ കാലാർഥം സ്വീകരിച്ച് പകരംവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പ്രാർഥനയ്ക്ക് യോജിച്ച മാന്യമായ മലയാളം. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വാക്യത്തിലെ അപേക്ഷാഭാവം ‘-ണമേ’ രൂപത്തിലൂടെ നിലനിർത്തി.
