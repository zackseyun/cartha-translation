  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/הְיוֹת֩ עֵינֶ֨/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ לַ֣יְלָה וָ/י֔וֹם אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ יִהְיֶ֥ה שְׁמִ֖/י שָׁ֑ם לִ/שְׁמֹ֨עַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: ml
  text: രാവും പകലും ഈ ആലയത്തിലേക്കും, ‘എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും’ എന്നു നീ പറഞ്ഞ ആ സ്ഥലത്തേക്കും നിന്റെ കണ്ണുകൾ തുറന്നിരിക്കണമേ; ഈ സ്ഥലത്തേക്കു നിന്റെ ദാസൻ പ്രാർഥിക്കുന്ന പ്രാർഥന കേൾക്കണമേ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: നിന്റെ കണ്ണുകൾ തുറന്നിരിക്കണമേ
  rationale: ദൈവത്തിന്റെ ശ്രദ്ധാപൂർവമായ പരിഗണനയെ സൂചിപ്പിക്കുന്ന മനുഷ്യരൂപക ഭാഷ അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അപേക്ഷാഭാവം മലയാളത്തിലെ വിനയപൂർവമായ ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ഈ ആലയത്തിലേക്ക്
  rationale: אֶל ദിശയെയും അഭിമുഖീകരണത്തെയും സൂചിപ്പിക്കുന്നു. ഇവിടെ בַּיִת ദൈവാലയത്തെ കുറിക്കുന്നതിനാൽ സാധാരണ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ ‘ആലയം’ തെരഞ്ഞെടുത്തു.
- source_word: לַיְלָה וָיוֹם
  choice: രാവും പകലും
  rationale: തുടർച്ചയായ കാലയളവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പദജോടിയെ മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶל הַמָּקוֹם
  choice: ആ സ്ഥലത്തിലേക്ക്
  rationale: ദൈവം തന്റെ നാമത്തിനായി തിരഞ്ഞെടുത്ത നിർദിഷ്ട സ്ഥലത്തോടുള്ള ദിശ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും
  rationale: ‘നാമം’ എന്ന ഉറവിടപദവും അതിലെ ദൈവശാസ്ത്രപരമായ അർഥസാന്ദ്രതയും നിലനിർത്തുന്നു; അതിനെ ‘സാന്നിധ്യം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: പ്രാർഥന കേൾക്കണമേ
  rationale: ഉദ്ദേശ്യബന്ധം അപേക്ഷയുടെ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുന്നു; ‘കേൾക്കുക’ എന്നത് പ്രാർഥനയോടുള്ള ശ്രദ്ധാപൂർവമായ ശ്രവണത്തെ ഉൾക്കൊള്ളുന്നു.
- source_word: עַבְדְּךָ
  choice: നിന്റെ ദാസൻ
  rationale: ദൈവത്തോടുള്ള വിനീത സേവനബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രാർഥനാഭാഷയ്ക്ക് ‘ദാസൻ’ യോജിക്കുന്നു.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തിലേക്ക് തിരിഞ്ഞ്
  rationale: പ്രാർഥന ആ സ്ഥലത്തെ അഭിമുഖീകരിച്ചാണ് നടത്തുന്നതെന്ന ദിശാസൂചന മലയാളത്തിൽ വ്യക്തമാക്കാനും സ്വാഭാവികമാക്കാനും ‘തിരിഞ്ഞ്’ ചേർത്തു.
theological_decisions:
- issue: ദൈവത്തിന്റെ കണ്ണുകൾ തുറന്നിരിക്കുന്നുവെന്ന മനുഷ്യരൂപക ഭാഷ
  choice: ‘നിന്റെ കണ്ണുകൾ തുറന്നിരിക്കണമേ’ എന്ന് രൂപകം നിലനിർത്തി
  alternative: ഈ ആലയത്തെ ശ്രദ്ധിക്കണമേ / ഈ ആലയത്തെ കാത്തുകൊള്ളണമേ
  rationale: മൂലപാഠത്തിലെ ശരീരരൂപകം ദൈവത്തിന്റെ ശ്രദ്ധയെ ശക്തമായി ചിത്രീകരിക്കുന്നു; അതിനെ അമൂർത്തമായ വ്യാഖ്യാനമാക്കി മാറ്റിയില്ല.
- issue: ‘എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും’ എന്ന ദൈവാലയഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കും’ എന്ന് നിലനിർത്തി
  alternative: എന്റെ സാന്നിധ്യം അവിടെ ഉണ്ടായിരിക്കും / ഞാൻ അവിടെ വസിക്കും
  rationale: ഈ വാക്കുകൾ ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പും ഉടമ്പടിബന്ധമുള്ള സാന്നിധ്യവും സൂചിപ്പിക്കുമ്പോഴും അതിനെ ഒരു വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാൻ മൂലപാഠത്തിന്റെ ഭാഷ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘ആലയം,’ ‘നാമം,’ ‘ദാസൻ’ എന്നീ പദങ്ങൾ ഉറവിടത്തിലെ ദൈവാലയ-ഉടമ്പടി ഭാവം നിലനിർത്തുന്നു; വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
