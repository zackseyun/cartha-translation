source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: ml
  text: 'എന്നാൽ യഹോവ എന്റെ പിതാവായ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ നാമത്തിനായി ഒരു ഭവനം[a] പണിയാൻ നീ ഹൃദയത്തിൽ ആഗ്രഹിച്ചതുകൊണ്ട്, അങ്ങനെ ഹൃദയത്തിൽ ആഗ്രഹിച്ചതിൽ നീ നന്നായി ചെയ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ദേവാലയം.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “ഒരു ഭവനം” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אָבִי
  choice: എന്റെ പിതാവ്
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ദാവീദ് ശലോമോന്റെ പിതാവാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: יַעַן אֲשֶׁר
  choice: ആയിരുന്നതിനാൽ
  rationale: കാരണം അവതരിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הָיָה עִם לְבָבְךָ
  choice: നിന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരുന്നത്
  rationale: ഉദ്ദേശ്യമോ ആഗ്രഹമോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിലും അർഥഗ്രാഹ്യമാണ്.
- source_word: לִבְנוֹת בַּיִת
  choice: ഒരു ഭവനം പണിയാൻ
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഭവനം’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദേവാലയമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: לִשְׁמִי
  choice: എന്റെ നാമത്തിനായി
  rationale: ദൈവനാമവുമായി വിശുദ്ധമന്ദിരത്തെ ബന്ധിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ഉടമ്പടിപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: הֱטִיבֹתָ
  choice: നല്ലതു തന്നെ
  rationale: ഇവിടെ ക്രിയ പ്രകടിപ്പിക്കുന്ന ദൈവിക അംഗീകാരം സ്വാഭാവികമായി നൽകുന്നു; ദാവീദ് നിർമാണം പൂർത്തിയാക്കിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: അത് നിന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരുന്നത്
  rationale: ദൈവിക അംഗീകാരത്തിന്റെ അടിസ്ഥാനത്തെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്ന മൂലപാഠത്തിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ, മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בַּיִת എന്ന പദം ‘ഭവനം’ എന്നോ ‘ദേവാലയം’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ഭവനം
  alternative: ദേവാലയം
  rationale: മൂലപാഠത്തിലെ ‘ഭവനം’ എന്ന രൂപകവും ദൈവത്തിന്റെ നാമത്തിനായുള്ള ഭവനം എന്ന ദൈവശാസ്ത്രപരമായ പ്രയോഗവും നിലനിർത്തുന്നു; സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദാവീദിന്റെ ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള ദൈവിക അംഗീകാരം
  choice: അത് നിന്റെ ഹൃദയത്തിൽ ഉണ്ടായിരുന്നത് നല്ലതു തന്നെ
  alternative: നീ നന്നായി ചെയ്തു
  rationale: അംഗീകാരം നിർമാണപ്രവൃത്തിക്കല്ല, ദാവീദിന്റെ ഹൃദയത്തിലെ ഉദ്ദേശ്യത്തിനാണെന്ന വാക്യത്തിലെ സംഘർഷവും ഊന്നലും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘ഹൃദയത്തിൽ ഉണ്ടായിരുന്നത്’ എന്ന ആവർത്തനം അല്പം ഔപചാരികമാണെങ്കിലും മൂലപാഠത്തിലെ ഉദ്ദേശ്യവും ദൈവിക അംഗീകാരത്തിന്റെ ഊന്നലും സംരക്ഷിക്കാൻ നിലനിർത്തി.
