  to: 'എന്നാൽ യഹോവ എന്റെ പിതാവായ ദാവീദിനോടു പറഞ്ഞു: “എന്റെ നാമത്തിനായി ഒരു ഭവനം[a] പണിയാൻ നീ ഹൃദയത്തിൽ ആഗ്രഹിച്ചതുകൊണ്ട്, അങ്ങനെ ഹൃദയത്തിൽ ആഗ്രഹിച്ചതിൽ നീ നന്നായി ചെയ്തു.”'
