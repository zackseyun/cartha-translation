reference: 1 Kings 8:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: ml
  text: 'കൂടാതെ, നിന്റെ ജനമായ ഇസ്രായേലിൽപ്പെട്ടവനല്ലാത്ത ഒരു വിദേശിയെക്കുറിച്ചും: അവൻ നിന്റെ നാമം നിമിത്തം ദൂരദേശത്തുനിന്ന് വരുമ്പോൾ—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֶל
  choice: ഒരു വിദേശി … വരുമ്പോൾ
  rationale: വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന പ്രാർഥനാവാക്യമായതിനാൽ, എബ്രായത്തിലെ വിഷയാവതരണമായ ‘കൂടാതെ … സംബന്ധിച്ചും’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി സാഹചര്യവാക്യമായി അവതരിപ്പിച്ചു; വാക്യാന്ത്യത്തിലെ ദീർഘരേഖ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: הַנָּכְרִי
  choice: വിദേശി
  rationale: ഇത് വെറും യാത്രക്കാരനെയല്ല, ഇസ്രായേൽജനത്തിൽപ്പെടാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു. ആ ജനതാപരവും ഉടമ്പടിപരവുമായ വേർതിരിവ് ‘വിദേശി’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: നിന്റെ ജനമായ ഇസ്രായേലിൽപ്പെട്ടവനല്ലാത്ത
  rationale: ഇസ്രായേൽ ദൈവത്തിന്റെ ജനമാണെന്ന ബന്ധവും ആ വ്യക്തി ആ ജനത്തിൽപ്പെട്ടവനല്ലെന്ന തിരിച്ചറിയലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּבָא
  choice: വരുമ്പോൾ
  rationale: ക്രിയയുടെ രൂപം ‘വരുന്നു/വരും’ എന്ന അർഥം വഹിക്കുന്നു; അടുത്ത വാക്യത്തിൽ വരുന്ന അപേക്ഷയുമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ സാഹചര്യാർഥമുള്ള ‘വരുമ്പോൾ’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: ദൂരദേശത്തുനിന്നു
  rationale: ഭൗമിക അകലം ചുരുക്കവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמַעַן שְׁמֶךָ
  choice: നിന്റെ നാമംനിമിത്തം
  rationale: ദൈവത്തിന്റെ വെളിപ്പെട്ട പ്രശസ്തിയും കീർത്തിയും ഉൾക്കൊള്ളുന്ന ‘നാമം’ എന്ന ബൈബിൾ ആശയം നിലനിർത്തുകയും വരവിന്റെ കാരണമോ പ്രേരണയോ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഇസ്രായേലും ഇസ്രായേല്യനല്ലാത്ത അപേക്ഷകനും തമ്മിലുള്ള ഉടമ്പടിപരമായ വേർതിരിവ്
  choice: നിന്റെ ജനമായ ഇസ്രായേലിൽപ്പെട്ടവനല്ലാത്ത ഒരു വിദേശി
  alternative: നിന്റെ ജനമായ ഇസ്രായേലിൽനിന്നല്ലാത്ത ഒരു അന്യൻ
  rationale: വാക്യം സാമൂഹികമായി അപരിചിതനായ ഒരാളെ മാത്രമല്ല, ഇസ്രായേൽജനത്തിൽപ്പെടാത്ത ഒരാളെ ഉദ്ദേശിക്കുന്നു. അതേസമയം, അവനും ദൈവത്തിന്റെ നാമംനിമിത്തം വരാമെന്ന വാക്യത്തിന്റെ തുറന്ന നിലപാട് പരിഭാഷ മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നാമംനിമിത്തം’ എന്ന ബൈബിൾപ്രയോഗം അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്താൻ ഉപയോഗിച്ചു. മൂലവാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ ചേർത്തു.
