  to: 'കൂടാതെ, നിന്റെ ജനമായ ഇസ്രായേലിൽപ്പെട്ടവനല്ലാത്ത ഒരു വിദേശിയെക്കുറിച്ചും: അവൻ നിന്റെ നാമം നിമിത്തം ദൂരദേശത്തുനിന്ന് വരുമ്പോൾ—'
