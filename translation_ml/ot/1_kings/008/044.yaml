source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: ml
  text: നിന്റെ ജനം തങ്ങളുടെ ശത്രുവിനെതിരെ യുദ്ധത്തിന്, നീ അവരെ അയയ്ക്കുന്ന വഴിയിൽ, പുറപ്പെടുകയും നീ തിരഞ്ഞെടുത്ത നഗരത്തെയും നിന്റെ നാമത്തിനായി ഞാൻ പണിത ഭവനത്തെയും അഭിമുഖമായി യഹോവയോടു പ്രാർഥിക്കുകയും ചെയ്യുമ്പോൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ചെയ്യുമ്പോൾ
  rationale: ശലോമോന്റെ പ്രാർഥനയിലെ സാദ്ധ്യതാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലിക-നിബന്ധനാഭാവം നൽകുന്നു.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: നിന്റെ ജനം ... യുദ്ധത്തിനു പുറപ്പെടുകയും
  rationale: יצא എന്നതിന്റെ ‘പുറപ്പെടുക’ എന്ന അടിസ്ഥാനാർഥവും സൈനികസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: עַל אֹיְבוֹ
  choice: തങ്ങളുടെ ശത്രുവിനെതിരെ
  rationale: ‘ജനം’ ഒരു സമൂഹവാചകമായതിനാൽ ഏകവചന പ്രത്യയത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ‘തങ്ങളുടെ’ എന്നു നൽകുന്നു.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: നീ അവരെ അയയ്ക്കുന്ന വഴിയിൽ
  rationale: דֶּרֶךְ എന്ന പദത്തിന്റെ ദൃശ്യമായ ‘വഴി’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; ദൈവം നിയോഗിക്കുന്ന സൈനികയാത്രയെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: യഹോവയോടു പ്രാർഥിക്കുകയും
  rationale: התפלל എന്ന സാധാരണ പ്രാർഥനാക്രിയയും യְהוָה എന്ന ദൈവനാമവും നേരിട്ട് നൽകുന്നു.
- source_word: דֶּרֶךְ הָעִיר
  choice: നഗരത്തിന്റെ ... ദിക്കിലേക്കു തിരിഞ്ഞ്
  rationale: ഇവിടെ דֶּרֶךְ പ്രാർഥനയുടെ ദിശയെയോ അഭിമുഖീകരണത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമാകാൻ ‘ദിക്കിലേക്കു തിരിഞ്ഞ്’ ഉപയോഗിക്കുന്നു.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: നീ തിരഞ്ഞെടുത്ത നഗരത്തിന്റെ
  rationale: നഗരത്തെ ദൈവം തിരഞ്ഞെടുത്തു എന്ന എബ്രായവാക്യത്തിന്റെ ലളിതമായ പ്രസ്താവനയിൽ അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: וְהַבַּיִת
  choice: ഭവനത്തിന്റെ
  rationale: בַּיִת എന്നതിന്റെ ‘വീട്/ഭവനം’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: നിന്റെ നാമത്തിനായി ഞാൻ പണിത
  rationale: ദൈവത്തിന്റെ നാമത്തിനായി പണിത ഭവനം എന്ന പ്രാധാന്യമുള്ള ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- issue: הַבַּיִת എന്ന ദേവാലയസൂചന
  choice: ഭവനം
  alternative: ദേവാലയം
  rationale: സൂചിപ്പിക്കുന്നത് ദേവാലയത്തെയാണെങ്കിലും എബ്രായത്തിലെ ‘ഭവനം’ എന്ന കാനോനിക പ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തിയിരിക്കുന്നു. ‘നഗരത്തിന്റെയും ... ഭവനത്തിന്റെയും ദിക്കിലേക്കു’ എന്ന ഘടന പ്രാർഥനയുടെ ദിശയെ വ്യക്തമാക്കുകയും രണ്ടു നാമങ്ങളെയും ഒരേ ദിശാസംബന്ധത്തിൽ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
