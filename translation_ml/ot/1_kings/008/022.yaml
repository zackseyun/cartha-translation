    rationale: ‘മുഴുവൻ സഭയുടെ മുമ്പാകെ’ എന്നത് അതേ അർഥം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു; ഇതിൽ നֶגֶד എന്ന പൊതുസാന്നിധ്യബോധവും നിലനിൽക്കും.
