    issue: അടിക്കുറിപ്പിൽ ‘ആകാശങ്ങളിലേക്ക്’ എന്നു നൽകിയിരിക്കുന്നു.
    rationale: എബ്രായത്തിലെ הַשָּׁמַיִם എന്നത് ഇവിടെ നാമരൂപമായി ‘ആകാശങ്ങൾ’/‘സ്വർഗങ്ങൾ’ എന്നാണ്; ‘-ലേക്ക്’ എന്ന ദിശാഭാവം വിരിക്കുക എന്ന ക്രിയയുടെയും സന്ദർഭത്തിന്റെയും അടിസ്ഥാനത്തിൽ വിവർത്തനത്തിൽ വരാം, എന്നാൽ അക്ഷരാർഥ അടിക്കുറിപ്പിൽ ചേർക്കേണ്ടതല്ല.
