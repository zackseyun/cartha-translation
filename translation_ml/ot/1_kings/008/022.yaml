id: 1KI.8.22
reference: 1 Kings 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ യഹ്‌വേയുടെ യാഗപീഠത്തിനുമുമ്പിൽ, ഇസ്രായേലിന്റെ മുഴുവൻ സഭയുടെ മുമ്പാകെ നിന്നു; സ്വർഗത്തിലേക്ക് തന്റെ കൈകൾ വിരിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘ആകാശങ്ങൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ തുടർച്ചയായ ഭൂതകാല ആഖ്യാനരൂപം ലളിതമായ ഒരു പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നിന്നു’ സ്വാഭാവികവും അധിക ഊന്നൽ ചേർക്കാത്തതുമാണ്.
- source_word: לִפְנֵי
  choice: യാഗപീഠത്തിനുമുമ്പിൽ
  rationale: യാഗപീഠത്തോടുള്ള സ്ഥലബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: מִזְבַּח יְהוָה
  choice: യഹ്‌വേയുടെ യാഗപീഠം
  rationale: എബ്രായത്തിലെ സംയുക്തനാമഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സർവസഭയുടെയും മുമ്പാകെ
  rationale: നֶגֶד സൂചിപ്പിക്കുന്ന പൊതുസാന്നിധ്യവും കָהָל സൂചിപ്പിക്കുന്ന കൂടിവന്ന സമൂഹവും സ്വാഭാവികമായ ഔപചാരിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: തന്റെ കൈകൾ വിരിച്ചു
  rationale: പ്രാർഥനാഭാവത്തിൽ കൈകൾ നീട്ടി വിരിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; כַּף എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഉള്ളങ്കൈ’ക്കുപകരം ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമായ ‘കൈകൾ’ ഉപയോഗിക്കുന്നു.
- source_word: הַשָּׁמָיִם
  choice: സ്വർഗത്തിലേക്ക്
  rationale: പ്രാർഥനയുടെ ദിശ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; എബ്രായത്തിലെ രൂപപരമായ ബഹുവചനസാദൃശ്യം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ, വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: הַשָּׁמָיִם എന്നതിന്റെ സന്ദർഭാർഥം
  choice: സ്വർഗത്തിലേക്ക്
  alternative: ആകാശത്തേക്ക് / ആകാശങ്ങളിലേക്ക്
  rationale: പ്രാർഥനാഭാവമുള്ള ഈ സന്ദർഭത്തിൽ ‘സ്വർഗം’ സ്വാഭാവികമാണ്; എബ്രായരൂപത്തിന്റെ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഒരേ വാക്യത്തിൽ לִפְנֵי, נֶגֶד എന്നിവയുടെ വ്യത്യസ്ത സ്ഥലസൂചനകൾ ‘മുമ്പിൽ’, ‘മുമ്പാകെ’ എന്നിങ്ങനെ വേർതിരിച്ചു.
