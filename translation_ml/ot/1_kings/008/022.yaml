revisions:
- from: അപ്പോൾ ശലോമോൻ യഹ്‌വേയുടെ യാഗപീഠത്തിനുമുമ്പിൽ, ഇസ്രായേലിന്റെ സർവസഭയുടെയും മുമ്പാകെ നിന്നു; സ്വർഗത്തിലേക്ക് തന്റെ കൈകൾ വിരിച്ചു[a].
  to: അപ്പോൾ ശലോമോൻ യഹ്‌വേയുടെ യാഗപീഠത്തിനുമുമ്പിൽ, ഇസ്രായേലിന്റെ മുഴുവൻ സഭയുടെ മുമ്പാകെ നിന്നു; സ്വർഗത്തിലേക്ക് തന്റെ കൈകൾ വിരിച്ചു[a].
