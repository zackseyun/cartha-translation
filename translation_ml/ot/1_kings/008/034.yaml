  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: ml
  text: അപ്പോൾ നീ സ്വർഗത്തിൽ കേൾക്കുകയും[a] നിന്റെ ജനമായ ഇസ്രായേലിന്റെ പാപം ക്ഷമിക്കുകയും, നീ അവരുടെ പിതാക്കന്മാർക്കു[c] നൽകിയ ദേശത്തേക്ക് അവരെ തിരികെ കൊണ്ടുവരികയും[b] ചെയ്യണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വർഗത്തിൽനിന്ന് കേൾക്കുകയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരെ ആ ദേശത്തേക്ക് പുനഃസ്ഥാപിക്കുകയും.”
    reason: lexical_alternative
  - marker: c
    text: “പിതാക്കന്മാർ” എന്നത് ദൈവം ദേശം നൽകിയ മുൻപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽ കേൾക്കുകയും
  rationale: എബ്രായത്തിലെ മുൻപ്രത്യയമില്ലാത്ത പ്രയോഗത്തെയും ദൈവത്തിന്റെ വാസസ്ഥാനമെന്ന സന്ദർഭത്തെയും നിലനിർത്തുന്നു. മലയാളത്തിൽ ബഹുവചനരൂപമായ ‘ആകാശങ്ങൾ’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ ‘സ്വർഗം’ സ്വാഭാവികമാണ്; ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: പാപം ക്ഷമിക്കുകയും
  rationale: סלח ദൈവം പാപം ക്ഷമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; חטאת ഇവിടെ പാപയാഗമല്ല, ജനത്തിന്റെ പാപത്തെ ഏകവചനത്തിലുള്ള സമാഹാര ആശയമായി സൂചിപ്പിക്കുന്നു.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: നിന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി തിരിച്ചറിയിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַהֲשֵׁבֹתָם
  choice: അവരെ തിരികെ കൊണ്ടുവരികയും
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം വ്യക്തമാക്കുകയും ദേശത്തേക്കുള്ള യഥാർഥ മടക്കത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל הָאֲדָמָה
  choice: ദേശത്തേക്ക്
  rationale: אֲדָמָה എന്നതിന് മണ്ണ്, നിലം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ വാഗ്ദത്തം ചെയ്ത ഭൂപ്രദേശമാണ് ഉദ്ദേശ്യം.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: നീ അവരുടെ പിതാക്കന്മാർക്കു നൽകിയ
  rationale: ദേശവാഗ്ദത്തം ലഭിച്ച മുൻപിതാക്കന്മാരെ സൂചിപ്പിക്കുന്ന ഉടമ്പടിപരമായ ഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לַאֲבוֹתָם എന്ന ഉടമ്പടിപരമായ പദത്തിന്റെ വിവർത്തനം
  choice: അവരുടെ പിതാക്കന്മാർക്ക്
  alternative: അവരുടെ പൂർവികർക്ക്
  rationale: എബ്രായപദം വ്യാകരണപരമായി പുല്ലിംഗവും ഈ സന്ദർഭത്തിൽ ദേശവാഗ്ദത്തം ലഭിച്ച മുൻപിതാക്കന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതുമാകയാൽ ‘പിതാക്കന്മാർ’ എന്ന് നിലനിർത്തി; വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: וַהֲשֵׁבֹתָם സൂചിപ്പിക്കുന്ന പുനഃസ്ഥാപനത്തിന്റെ സ്വഭാവം
  choice: ദേശത്തേക്ക് അവരെ തിരികെ കൊണ്ടുവരിക
  alternative: ദേശത്ത് അവരെ പുനഃസ്ഥാപിക്കുക
  rationale: ഇത് അമൂർത്തമായ ആത്മീയ പുനഃസ്ഥാപനം മാത്രമല്ല, ദേശത്തേക്കുള്ള സ്ഥലപരമായ മടക്കമാണെന്ന് കാരണാർഥ ക്രിയയും אֶל എന്ന ദിശാസൂചകവും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഏകോപിത ക്രിയാക്രമം ‘കേൾക്കുകയും… ക്ഷമിക്കുകയും… തിരികെ കൊണ്ടുവരികയും ചെയ്യണമേ’ എന്ന ഘടനയിൽ നിലനിർത്തി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ സാധാരണവും ഗൗരവമുള്ളതുമായ ‘നീ’ ഉപയോഗിച്ചു.
