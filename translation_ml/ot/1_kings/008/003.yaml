  yaml_path: translation/ot/1_kings/008/003.yaml
  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: ml
  text: ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരും വന്നു; പുരോഹിതന്മാർ പെട്ടകം[a] ചുമന്നു.
  philosophy: optimal-equivalence
  footnotes:
