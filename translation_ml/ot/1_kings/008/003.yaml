translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഹീബ്രു ആഖ്യാനത്തിലെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആദ്യ ക്രിയയെ ‘വന്നപ്പോൾ’ എന്നു ബന്ധിപ്പിച്ചു. ‘പെട്ടകം’ എന്നതിന് സന്ദർഭവിവരണം അടിക്കുറിപ്പിൽ നൽകി; മുഖ്യപാഠം വിപുലീകരിച്ചില്ല.
