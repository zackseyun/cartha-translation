    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: വന്നപ്പോൾ
  rationale: בוא എന്ന ക്രിയയുടെ ആഖ്യാനരൂപമാണ്. അടുത്ത പ്രവൃത്തിയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ കാലസൂചകമായ ‘വന്നപ്പോൾ’ ഉപയോഗിച്ചു; അവർ എവിടേക്കു വന്നു എന്ന് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘പ്രവേശിച്ചു’ എന്നു പറഞ്ഞില്ല.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ എല്ലാ മൂപ്പന്മാരും
  rationale: כֹּל എന്ന സമഗ്രതയും זִקְנֵי יִשְׂרָאֵל എന്ന അംഗീകൃത നേതൃസമൂഹത്തെയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּשְׂאוּ
  choice: ചുമന്നു
  rationale: נשׂא എന്നതിന് ഉയർത്തുക, വഹിക്കുക, ചുമക്കുക എന്നീ അർഥങ്ങളുണ്ട്. പെട്ടകം കൊണ്ടുപോകുന്ന സന്ദർഭത്തിൽ ‘ചുമന്നു’ പ്രവർത്തിയുടെ ഉയർത്തലും വഹിക്കലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചിത ബഹുവചനമായ ‘പുരോഹിതന്മാർ’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: אֶת הָאָרוֹן
  choice: പെട്ടകം
  rationale: ഈ വാക്യത്തിൽ ഉള്ളത് നിശ്ചിതമായ ‘പെട്ടകം’ എന്ന പദം മാത്രമാണ്. ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്ന വിപുലമായ പേര് സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
