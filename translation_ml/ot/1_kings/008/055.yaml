source:
  edition: WLC
  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: ml
  text: അവൻ നിന്നുകൊണ്ട് ഇസ്രായേലിന്റെ മുഴുവൻ സമ്മേളനത്തെയും ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ[b] അനുഗ്രഹിച്ച് ഇപ്രകാരം പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘പറഞ്ഞുകൊണ്ട്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘വലിയ ശബ്ദത്തിൽ’; അതായത്, ‘ഉച്ചത്തിലുള്ള ശബ്ദത്തിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: അവൻ എഴുന്നേറ്റുനിന്ന്
  rationale: עמד എന്നത് ഇവിടെ അടുത്തതായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പൊതുസമ്മേളനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘എഴുന്നേറ്റുനിന്ന്’ എന്ന പ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיְבָרֶךְ
  choice: അനുഗ്രഹിച്ചുകൊണ്ട്
  rationale: ברך ഇവിടെ കൂടിവന്ന ജനത്തിന്മേൽ അനുഗ്രഹവചനം ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലപദത്തിന്റെ സംക്ഷിപ്തതയും ഔപചാരിക ഭാവവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സർവസഭയെയും
  rationale: קהל കൂടിവന്ന സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സർവസഭ’ അതിന്റെ പൊതുവായ സാമൂഹിക അർത്ഥം നൽകുകയും כָּל എന്നതിനെ വ്യക്തമായി പ്രതിനിധീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: קוֹל גָּדוֹל
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘വലിയ ശബ്ദം’ എന്നാണെങ്കിലും ഹീബ്രായ പ്രയോഗം ശബ്ദത്തിന്റെ ഉച്ചതയെ സൂചിപ്പിക്കുന്നു. ‘ഉച്ചസ്വരത്തിൽ’ ആ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇപ്രകാരം പറഞ്ഞു:'
  rationale: തുടർന്നുവരുന്ന പ്രസംഗത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന infinitive ആണിത്. മലയാളത്തിൽ ‘ഇപ്രകാരം പറഞ്ഞു:’ എന്നത് ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ ‘അനുഗ്രഹിച്ചു’ എന്നതിന്റെ സ്വഭാവം
  choice: ശലോമോൻ കൂടിവന്ന ജനത്തിന്മേൽ അനുഗ്രഹവചനം ഉച്ചരിച്ചു എന്ന നിലയിൽ ‘അനുഗ്രഹിച്ചു’ എന്നു നിലനിർത്തി.
  alternative: ശലോമോൻ സ്വന്തം ശക്തിയാൽ ദൈവകൃപ പകർന്നു എന്ന കൂടുതൽ കാരണാത്മകമോ കൂദാശാപരമോ ആയ വായന.
  rationale: ברך എന്ന പദം ഔപചാരികമായ പൊതുസന്ദർഭത്തിൽ അനുഗ്രഹവചനം പറയുന്നതിനെ സൂചിപ്പിക്കാം. വാക്യം അനുഗ്രഹത്തിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കാത്തതിനാൽ പരിഭാഷ അതിനപ്പുറമുള്ള ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘സർവസഭ’ പൊതുവായി കൂടിവന്ന ഇസ്രായേൽസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; സഭാസംബന്ധമായ പ്രത്യേക സാങ്കേതിക അർത്ഥം ഉദ്ദേശിക്കുന്നില്ല.
