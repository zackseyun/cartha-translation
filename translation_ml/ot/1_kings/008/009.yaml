source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: ml
  text: പെട്ടകത്തിൽ, മോശ ഹോരേബിൽ വെച്ചിരുന്ന രണ്ടു കൽപ്പലകകളല്ലാതെ മറ്റൊന്നും ഉണ്ടായിരുന്നില്ല; ഇസ്രായേൽമക്കൾ[a] ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടപ്പോൾ, യഹോവ അവരുമായി ഉടമ്പടി ചെയ്തതു[b] ഹോരേബിൽവെച്ചായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യർ.”
    reason: lexical_alternative
  - marker: b
    text: “ഉടമ്പടി ചെയ്തു” എന്നതിന്റെ എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “ഉടമ്പടി മുറിച്ചു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: പെട്ടകത്തിൽ ... അല്ലാതെ മറ്റൊന്നും ഉണ്ടായിരുന്നില്ല
  rationale: നിഷേധത്തോടുകൂടിയ רַק എന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളത്തിലെ ഒഴിവാക്കൽഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: രണ്ടു കൽപ്പലകകൾ
  rationale: കല്ലുകൊണ്ടുള്ള ഉടമ്പടിപ്പലകകളെ വ്യക്തവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: മോശ വെച്ചിരുന്ന
  rationale: הִנִּיחַ എന്നതിന്റെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അർഥവും മുൻകാല സംഭവബന്ധവും നിലനിർത്തുന്നു.
- source_word: בְּחֹרֵב
  choice: ഹോരേബിൽവെച്ച്
  rationale: സംഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: യഹോവ അവരുമായി ഉടമ്പടി ചെയ്ത
  rationale: ‘ഉടമ്പടി മുറിക്കുക’ എന്ന എബ്രായ പ്രയോഗശൈലിയുടെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ പരാമർശിക്കാതെവിട്ട בְּרִית സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: അവർ ഈജിപ്തുദേശത്തുനിന്ന് പുറപ്പെട്ടപ്പോൾ
  rationale: കാലസൂചകമായ infinitive construct സ്വാഭാവികമായ ഉപവാക്യമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ അവതരണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ജനസമൂഹത്തെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും മൂലത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന കുടുംബബന്ധരൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. നീണ്ട എബ്രായ ആപേക്ഷികവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ഹോരേബിലെ സംഭവസ്ഥലവും ഉടമ്പടിയുടെ ബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്.
