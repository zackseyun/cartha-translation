  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “തന്റെ വായാൽ എന്റെ പിതാവായ ദാവീദിനോട് അരുളിച്ചെയ്യുകയും തന്റെ കൈയാൽ അതു നിറവേറ്റുകയും ചെയ്ത ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വേ വാഴ്ത്തപ്പെടട്ടെ.[a] അവിടുന്ന് ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്തുതിക്കപ്പെടട്ടെ.” ഈ ഹീബ്രു ആശീർവാദസൂത്രം പരമ്പരാഗതമായി “വാഴ്ത്തപ്പെടട്ടെ” എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: ആരാധനാപരമായ ഹീബ്രു ആശീർവാദസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തബന്ധത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: തന്റെ വായാൽ ... അരുളിച്ചെയ്യുകയും
  rationale: ‘വായാൽ’ എന്ന ദേഹാവയവപ്രയോഗം നിലനിർത്തി, തുടർന്നുള്ള ‘കൈയാൽ’ എന്ന പ്രയോഗവുമായുള്ള ഉദ്ദേശ്യപൂർവമായ സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: אֵת דָּוִד אָבִי
  choice: എന്റെ പിതാവായ ദാവീദിനോട്
  rationale: דבר എന്ന ക്രിയയോടുകൂടെ אֵת അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘ദാവീദിനോട്’ എന്നതാണ് സ്വാഭാവികം.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: തന്റെ കൈയാൽ അതു നിറവേറ്റുകയും ചെയ്ത
  rationale: ദൈവത്തിന്റെ വാക്കും പ്രവൃത്തിയും തമ്മിലുള്ള സമാന്തരത നിലനിർത്തുന്നു; ‘അതു’ എന്നത് മുൻവാക്യത്തിൽ പറഞ്ഞ വാഗ്ദാനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: בָּרוּךְ എന്ന ആരാധനാപരമായ സൂത്രവാക്യം
  choice: വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  alternative: അനുഗൃഹീതൻ / സ്തുതിക്കപ്പെടുമാറാകട്ടെ
  rationale: ദൈവം മനുഷ്യരാൽ അനുഗ്രഹിക്കപ്പെടുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട്, മൂലത്തിലെ ആശീർവാദ-സ്തുതിസൂത്രത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘വായാൽ/കൈയാൽ’ എന്ന മൂലപാഠത്തിലെ സമാന്തര ദേഹാവയവപ്രയോഗം മനപ്പൂർവം നിലനിർത്തി. ‘അരുളിച്ചെയ്യുക’ ദൈവിക പ്രസംഗത്തിന് മാന്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദമായി സ്വീകരിച്ചു.
