  source_fidelity: 'The Malayalam accurately renders the Hebrew disaster catalogue: famine, pestilence, crop blight/scorching, yellowing/mildew, locust, the uncertain crop-devouring insect, siege by an enemy, and the broad pair “plague/affliction” and “sickness.” The conditional progression and the verse-final dash appropriately retain the sentence’s continuation into the following verse. “അവനെ” preserves the Hebrew singular without forcing a disputed referent.'
