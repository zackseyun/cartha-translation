source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: ml
  text: ദേശത്ത് ക്ഷാമമോ മഹാമാരിയോ കരിച്ചിലോ മഞ്ഞളിപ്പോ വെട്ടുക്കിളിയോ ഇലപ്പുഴുവോ[a] ഉണ്ടാകുമ്പോൾ, ശത്രു അവനെ അവന്റെ ദേശത്തിലെ പട്ടണങ്ങളിൽ[b] ഉപരോധിക്കുമ്പോൾ, ഏതുതരം ബാധയോ ഏതുതരം രോഗമോ ഉണ്ടായാലും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടത്തെ എബ്രായപദം പൊതുവേ വിള തിന്നുനശിപ്പിക്കുന്ന വെട്ടുക്കിളിയെയോ വെട്ടുക്കിളിയുടെ ഒരു പ്രത്യേക ഇനത്തെയോ വളർച്ചാഘട്ടത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവന്റെ കവാടങ്ങളുടെ ദേശത്ത്.’ ഇവിടെ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെയോ നഗരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: ക്ഷാമം
  rationale: ദുരന്തങ്ങളുടെ ഈ പട്ടികയിൽ സാധാരണ വിശപ്പല്ല, ദേശവ്യാപകമായ ഭക്ഷ്യക്ഷാമമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: דֶּבֶר
  choice: മഹാമാരി
  rationale: പകർന്നുപിടിക്കുന്ന വ്യാപക രോഗത്തെ സൂചിപ്പിക്കുന്നു; പിന്നീടുള്ള പൊതുവായ ‘ബാധ’, ‘രോഗം’ എന്നീ പദങ്ങളിൽനിന്ന് ഇതിനെ വേർതിരിക്കുന്നു.
- source_word: שִׁדָּפוֹן
  choice: കരിച്ചിൽ
  rationale: ചൂടുകാറ്റോ സമാന കാരണമോ മൂലം വിളകൾ കരിഞ്ഞു നശിക്കുന്ന കാർഷികദുരന്തം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: יֵרָקוֹן
  choice: മഞ്ഞളിപ്പ്
  rationale: വിളകൾ വിളറി മഞ്ഞനിറമാകുന്ന രോഗാവസ്ഥയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘പൂപ്പൽ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: אַרְבֶּה
  choice: വെട്ടുക്കിളി
  rationale: വിളകൾ നശിപ്പിക്കുന്ന locust എന്ന കീടത്തിനുള്ള സാധാരണ മലയാളപദം; എബ്രായ ഏകവചനം ഇവിടെ സമൂഹവാചകമാണ്.
- source_word: חָסִיל
  choice: ഇലപ്പുഴു
  rationale: വിള തിന്നുനശിപ്പിക്കുന്ന കീടത്തെ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ പറയുന്നു; കൃത്യമായ കീടവർഗം അനിശ്ചിതമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: כִּי יִהְיֶה ... כִּי יָצַר לוֹ אֹיְבוֹ
  choice: ഉണ്ടാകുമ്പോൾ ... ശത്രു അവനെ ... ഉപരോധിക്കുമ്പോൾ
  rationale: ആവർത്തിക്കുന്ന כִּי יִהְיֶה വ്യവസ്ഥാസൂചകമായാണ് പ്രവർത്തിക്കുന്നത്; צור എന്ന ക്രിയയുടെ സൈനികമായ ‘വളഞ്ഞ് ഉപരോധിക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: അവന്റെ ദേശത്തിലെ പട്ടണങ്ങളിൽ
  rationale: ‘അവന്റെ കവാടങ്ങളുടെ ദേശത്ത്’ എന്ന അക്ഷരാർഥത്തിലെ ‘കവാടങ്ങൾ’ പട്ടണങ്ങളെ പ്രതിനിധാനം ചെയ്യുന്ന ലക്ഷണപ്രയോഗമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: כָּל נֶגַע
  choice: ഏതുതരം ബാധ
  rationale: נֶגַע എന്നത് പ്രഹരം, ബാധ, വിപത്ത് എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാല പദമാണ്; ‘ഏതുതരം’ כָּל എന്ന പദത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: כָּל מַחֲלָה
  choice: ഏതുതരം രോഗം
  rationale: പൊതുവായ രോഗാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മുൻപുള്ള വിശാലമായ ‘ബാധ’യിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവനെ’ എന്ന ഏകവചന സർവനാമത്തിന്റെ സമൂഹവാചക സ്വഭാവം
  choice: ഏകവചനമായ ‘അവനെ’ നിലനിർത്തി
  alternative: ‘അവരെ’ അല്ലെങ്കിൽ ‘ജനത്തെ’ എന്നു വ്യക്തമാക്കുക
  rationale: എബ്രായപാഠം ഏകവചനം ഉപയോഗിക്കുന്നു; സന്ദർഭത്തിൽ അത് ഇസ്രായേലിനെയോ ദേശവാസിയെയോ സമൂഹവാചകമായി സൂചിപ്പിക്കാം. വ്യക്തമായ ഒരു വ്യാഖ്യാനം പാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതിരിക്കാൻ ഏകവചനം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദുരന്തപ്പട്ടികയുടെ താളവും തുടർവാക്യത്തിലേക്കുള്ള അപൂർണതയും അവസാനത്തെ ദീർഘവിരാമചിഹ്നംകൊണ്ട് നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
