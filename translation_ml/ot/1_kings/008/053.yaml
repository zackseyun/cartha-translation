source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: ml
  text: ഭൂമിയിലെ സകല ജനതകളിൽനിന്നും അവരെ നിനക്കുള്ള അവകാശമായി വേർതിരിച്ചുവല്ലോ. ഞങ്ങളുടെ പിതാക്കന്മാരെ[b] ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചപ്പോൾ, നിന്റെ ദാസനായ മോശെ മുഖാന്തരം[a] നീ പറഞ്ഞതുപോലെതന്നെ, കർത്താവായ യഹ്‌വേ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ദാസനായ മോശെയിലൂടെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞങ്ങളുടെ പൂർവികരെ.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ ‘അദോനായ് യഹ്‌വേ’; ഇവിടെ സ്ഥാനപ്പേരും ദിവ്യനാമവും ഒരുമിച്ചു വരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: അവരെ ... വേർതിരിച്ചുവല്ലോ
  rationale: ഹിഫ്ഇൽ രൂപത്തിന്റെ ‘വേർതിരിക്കുക/പ്രത്യേകം മാറ്റിവയ്ക്കുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഊന്നൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വല്ലോ’ ചേർത്തിരിക്കുന്നു.
- source_word: לְךָ לְנַחֲלָה
  choice: നിനക്കായി ഒരു അവകാശസ്വത്തായി
  rationale: ദൈവത്തിനുള്ള സ്വന്തമായ അവകാശം/അനുവദിച്ച സ്വത്ത് എന്ന נַחֲלָהയുടെ ഉടമസ്ഥതാഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളിൽനിന്നും
  rationale: ഇവിടെ הָאָרֶץ പ്രാദേശിക ദേശത്തേക്കാൾ ലോകവ്യാപകമായ ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭൂമി’ സ്വീകരിച്ചു.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: നിന്റെ ദാസനായ മോശെയുടെ കൈമുഖാന്തരം
  rationale: ഏജൻസിയെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു; അർഥം ‘മോശെ മുഖാന്തരം’ എന്നാണ്.
- source_word: בְּהוֹצִיאֲךָ
  choice: പുറപ്പെടുവിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct-ന്റെ കാലസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת אֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാരെ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനവും പുറപ്പാടു അനുഭവിച്ച മുൻതലമുറകളെക്കുറിച്ചുള്ള പരമ്പരാഗത പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנָי יְהוִה
  choice: കർത്താവായ യഹോവേ
  rationale: אֲדֹנָי എന്ന സ്ഥാനപ്പേരും יהוה എന്ന ദിവ്യനാമവും രണ്ടും സംരക്ഷിച്ച്, അഭിസംബോധനാരൂപം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: אֲדֹנָי יְהוִה എന്ന സംയുക്ത ദൈവാഭിധാനത്തിന്റെ പരിഭാഷ
  choice: കർത്താവായ യഹോവേ
  alternative: കർത്താവായ ദൈവമേ
  rationale: മൂലപാഠത്തിലുള്ള יהוה എന്ന ഉടമ്പടിനാമം പൊതുവായ ‘ദൈവം’ എന്ന പദത്തിൽ ലയിപ്പിക്കാതെ നിലനിർത്തുകയും אֲדֹנָי എന്ന ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- issue: Israel as לְנַחֲלָה
  choice: ഒരു അവകാശസ്വത്തായി
  alternative: ഒരു അവകാശമായി
  rationale: ജനത്തെ ദൈവത്തിന്റെ വകയായ അവകാശം എന്നു പറയുന്ന ഉടമ്പടിഭാഷ നിലനിർത്തുന്നു; ഇത് ഭൂസ്വത്ത് മാത്രമാണെന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള പ്രാർഥനാശൈലി സ്വീകരിച്ചു. ‘കൈമുഖാന്തരം’ എന്ന മൂലശൈലി പ്രധാനപാഠത്തിൽ നിലനിർത്തി, കൂടുതൽ സ്വാഭാവികമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി. വാക്യത്തിന്റെ അവസാനത്തിലെ അഭിസംബോധനയും മൂലത്തിലെ ദിവ്യനാമവും സംരക്ഷിച്ചു.
