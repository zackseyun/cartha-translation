id: 1KI.8.63
reference: 1 Kings 8:63
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: ml
  text: ശലോമോൻ യഹോവയ്ക്ക് സമാധാനയാഗമായി[a] ഇരുപത്തിരണ്ടായിരം കന്നുകാലികളെയും ഒരു ലക്ഷത്തി ഇരുപതിനായിരം ആടുകളെയും[b] ബലിയർപ്പിച്ചു. അങ്ങനെ രാജാവും ഇസ്രായേൽമക്കളൊക്കെയും[c] യഹോവയുടെ ആലയം പ്രതിഷ്ഠിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂട്ടായ്മയാഗം’ അല്ലെങ്കിൽ ‘ക്ഷേമയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദം ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_scope
  - marker: c
    text: 'പദശഃ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח / זֶבַח
  choice: ബലിയർപ്പിച്ചു / യാഗം
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള എബ്രായ ക്രിയയും നാമവും യാഗസന്ദർഭം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി, ബലിയർപ്പിക്കൽ എന്ന ആരാധനാക്രിയ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: സമാധാനയാഗം
  rationale: ശְׁלָמִים എന്ന ബഹുവചന ആരാധനാപദത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപമാണിത്; കൂട്ടായ്മ, ക്ഷേമം എന്നീ അർഥവശങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה / בֵּית יְהוָה
  choice: യഹോവയ്ക്ക് / യഹോവയുടെ ആലയം
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ പേരായിത്തന്നെ നിലനിർത്തുന്നു. בַּיִת എന്നതിന്റെ അക്ഷരാർഥം ‘ഭവനം’ ആണെങ്കിലും ഈ പ്രതിഷ്ഠാസന്ദർഭത്തിൽ ‘ആലയം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בָּקָר
  choice: കന്നുകാലികൾ
  rationale: ബോവൈൻ വർഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പദമാണിത്; വലിയ സംഖ്യയോടൊപ്പം സ്വാഭാവികമായി ചേരുന്ന വിശാലമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: צֹאן
  choice: ആടുകൾ
  rationale: ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടനാമമാണിത്. മലയാളത്തിലെ ‘ആടുകൾ’ സന്ദർഭത്തിൽ സ്വാഭാവികമാണെങ്കിലും മൂലപദത്തിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחְנְכוּ
  choice: പ്രതിഷ്ഠിച്ചു
  rationale: ആലയത്തെ വിശുദ്ധ ഉപയോഗത്തിനായി ഔദ്യോഗികമായി സമർപ്പിച്ച് ആരംഭിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്ന പദം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകൽപ്പന ഭാഗികമായി നിലനിർത്തുകയും മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള കൂട്ടനാമമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ഉടമ്പടിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തി ‘യഹോവ’ എന്നു നൽകി.
- issue: זֶבַח הַשְּׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം; ക്ഷേമയാഗം
  rationale: ഈ ആരാധനാപദം സമാധാനം, ക്ഷേമം, പങ്കാളിത്തം എന്നീ ബന്ധമുള്ള ആശയങ്ങൾ വഹിക്കാം. മുഖ്യപാഠത്തിൽ പരിചിതമായ പദം ഉപയോഗിച്ചെങ്കിലും മറ്റ് അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ സമൂഹപരമായ സൂചന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേൽജനം
  rationale: പദശഃ രൂപം പുരുഷലിംഗമാണെങ്കിലും ഇവിടെ രാജാവിനോടൊപ്പം ആലയം പ്രതിഷ്ഠിച്ച ഉടമ്പടിസമൂഹത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ജനനാമമാണിത്. മലയാളരൂപം ‘മക്കൾ’ എന്ന ബന്ധസൂചനയും സമൂഹവ്യാപ്തിയും നിലനിർത്തുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷ സ്വീകരിച്ചു. വലിയ സംഖ്യകൾ മലയാളവായനയിൽ ഉടൻ ഗ്രഹിക്കാവുന്ന വിധം വാക്കുകളായി നൽകി. എബ്രായത്തിലെ സമാനധാതു ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ഒറ്റ സ്വാഭാവിക വാക്യമായി ക്രമപ്പെടുത്തി; എന്നാൽ യാഗത്തിന്റെ തരം, എണ്ണം, സമർപ്പണം, സമൂഹത്തിന്റെ പങ്കാളിത്തം എന്നിവ പൂർണ്ണമായി നിലനിർത്തി.
