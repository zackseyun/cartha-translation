  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ‘അവൻതന്നെ’ മൂലത്തിലെ ഊന്നൽ നൽകുന്നു. മുഖ്യവാക്യത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
