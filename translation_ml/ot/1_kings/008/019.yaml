  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: ml
  text: എങ്കിലും, നീ ആ ആലയം പണിയുകയില്ല; മറിച്ച്, നിന്റെ ശരീരത്തിൽനിന്നു ജനിക്കുന്ന നിന്റെ മകൻ[a]—അവൻതന്നെ എന്റെ നാമത്തിനായി ആ ആലയം പണിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “നിന്റെ അരയിൽനിന്നു പുറപ്പെടുന്ന നിന്റെ മകൻ”; സ്വന്തം ശാരീരിക സന്തതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: എങ്കിലും
  rationale: മുൻവാക്യത്തിലെ ദാവീദിന്റെ നല്ല ഉദ്ദേശ്യത്തെ അംഗീകരിച്ചതിനു പിന്നാലെ വരുന്ന പരിമിതി/വ്യത്യാസം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תִבְנֶה
  choice: നീ ... പണിയുകയില്ല
  rationale: ദൈവിക പ്രഖ്യാപനത്തിലെ നിഷേധിത അപൂർണ്ണക്രിയയുടെ ഭാവികാലപരമായ വിധിയും വിലക്കും തമ്മിലുള്ള സൂക്ഷ്മത സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: הַבָּיִת
  choice: ആ ആലയം
  rationale: בַּיִת എന്നത് അക്ഷരാർഥത്തിൽ ‘വീട്’ ആണെങ്കിലും, ഈ സന്ദർഭത്തിൽ യഹോവയുടെ നാമത്തിനായി പണിയപ്പെടുന്ന വിശുദ്ധമന്ദിരത്തെ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘ആലയം’ വ്യക്തമാക്കുന്നു; ‘ക്ഷേത്രം’ ഒഴിവാക്കുന്നത് അനാവശ്യമായ മതസാംസ്കാരിക ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: כִּי אִם
  choice: മറിച്ച്
  rationale: ‘നീയല്ല, നിന്റെ മകൻ’ എന്ന തിരുത്തൽപരവും വൈരുധ്യപരവുമായ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּנְךָ
  choice: നിന്റെ മകൻ
  rationale: സന്ദർഭത്തിൽ ഒരു നിർദിഷ്ട പുത്രനെ സൂചിപ്പിക്കുന്ന ഏകവചനത്തെ നേരിട്ട് നൽകുന്നു.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: നിന്റെ ശരീരത്തിൽനിന്നു ജനിക്കുന്ന
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ അരക്കെട്ടിൽനിന്നു പുറപ്പെടുന്ന’ എന്ന ശാരീരിക വംശപരമ്പരാസൂചക പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: הוּא
  choice: അവൻതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി, ദാവീദല്ല ആ മകനാണ് പണിയുക എന്നു വ്യക്തമാക്കുന്നു.
- source_word: יִבְנֶה הַבַּיִת
  choice: ആ ആലയം പണിയും
  rationale: ഹീബ്രുവിലെ ‘പണിയുക/ആലയം’ എന്ന ആവർത്തനം നിലനിർത്തുകയും ദൈവിക വാഗ്ദാനം/വിധിയുടെ ഭാവികാലം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: לִשְׁמִי
  choice: എന്റെ നാമത്തിനായി
  rationale: കർത്താവിന്റെ നാമത്തിനായി സമർപ്പിക്കപ്പെട്ട ആലയം എന്ന ഉടമ്പടിസംബന്ധിയായ ബൈബിൾ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: בַּיִת എന്നത് ‘വീട്’ എന്നോ സന്ദർഭാനുസൃതമായി ‘ആലയം’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ആലയം
  alternative: വീട്
  rationale: മൂലപദം ‘വീട്’ എന്നാണെങ്കിലും മലയാളത്തിൽ ‘എന്റെ നാമത്തിനായി വീട് പണിയും’ എന്നത് അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമാണ്. ‘ആലയം’ ഈ സന്ദർഭത്തിലെ ദൈവനാമത്തിനായുള്ള വിശുദ്ധമന്ദിരത്തെ വ്യക്തമാക്കുന്നു; എന്നാൽ ‘ക്ഷേത്രം’ എന്ന പ്രത്യേക സാംസ്കാരിക ധ്വനി ഒഴിവാക്കുന്നു.
- issue: לֹא תִבְנֶה എന്നത് വിലക്കായോ ഭാവികാല വിധിയായോ അവതരിപ്പിക്കുക
  choice: നീ പണിയുകയില്ല
  alternative: നീ പണിയരുത്
  rationale: രൂപം ദൈവിക വിലക്കിന്റെയും ഉറപ്പുള്ള ഭാവി പ്രഖ്യാപനത്തിന്റെയും ഭാവം വഹിക്കാം. ‘പണിയുകയില്ല’ സന്ദർഭത്തിലെ വിധിയെ മുൻനിർത്തുമ്പോഴും നിർബന്ധാർത്ഥം പൂർണമായി അതിക്രമിച്ച് ചേർക്കുന്നില്ല.
