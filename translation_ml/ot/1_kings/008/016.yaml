source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: ml
  text: “എന്റെ ജനമായ ഇസ്രായേലിനെ ഞാൻ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ച ദിവസംമുതൽ, എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കേണ്ടതിന് ഒരു ഭവനം[b] പണിയാൻ ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഒരു നഗരത്തെയും ഞാൻ തിരഞ്ഞെടുത്തിട്ടില്ല; എന്നാൽ എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ ആയിരിക്കാൻ ഞാൻ ദാവീദിനെ തിരഞ്ഞെടുത്തു[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദാവീദിനെയും ഞാൻ തിരഞ്ഞെടുത്തു.” എബ്രായത്തിലെ ബന്ധകപദം ഏകോപനമായി വായിക്കാം; എന്നാൽ ഒരു നഗരത്തെയും തിരഞ്ഞെടുത്തിട്ടില്ലെങ്കിലും ദാവീദിനെ തിരഞ്ഞെടുത്തു എന്ന വൈരുധ്യമാണ് സന്ദർഭം കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കേണ്ടതിന് ഒരു ഭവനം” എന്നത് യഹോവയുടെ നാമത്തോടും സാന്നിധ്യത്തോടും ബന്ധപ്പെട്ട വിശുദ്ധമന്ദിരത്തെ, അതായത് ദേവാലയത്തെ, സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: ഞാൻ ... പുറപ്പെടുവിച്ച
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരകാർഥം നിലനിർത്തുകയും പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ‘എന്റെ ജനം’ എന്നതിനെ ‘ഇസ്രായേൽ’ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ ഘടന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ എല്ലാ ഗോത്രങ്ങളിൽനിന്നും ഒരു നഗരത്തെയും
  rationale: ഏതെങ്കിലും ഗോത്രവുമായി ബന്ധപ്പെട്ട ഒരു നഗരത്തെയും തിരഞ്ഞെടുത്തില്ലെന്ന സംക്ഷിപ്ത എബ്രായഘടന ഉറവിടത്തോട് അടുത്തുനിൽക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִבְנוֹת בַּיִת
  choice: ഒരു ഭവനം പണിയാൻ
  rationale: בַּיִת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ഭവനം’ നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി ‘ദേവാലയം’ എന്നു മുഖ്യവാചകത്തിൽ പകരുന്നില്ല.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കേണ്ടതിന്
  rationale: היה എന്ന ലളിതമായ ‘ആയിരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വസിക്കുക’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: എന്നാൽ ... ഞാൻ ദാവീദിനെ തിരഞ്ഞെടുത്തു
  rationale: നഗരം തിരഞ്ഞെടുത്തിട്ടില്ലെന്ന പ്രസ്താവനയും ദാവീദിനെ തിരഞ്ഞെടുത്തെന്ന പ്രസ്താവനയും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘ഉം/അപ്പോൾ’ എന്ന ഏകോപനവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: എന്റെ ജനമായ ഇസ്രായേലിന്മേൽ ആയിരിക്കേണ്ടതിന്
  rationale: ‘മേൽ ആയിരിക്കുക’ എന്ന ഉറവിടത്തിന്റെ രൂപം സൂക്ഷിച്ച് ദാവീദിന്റെ അധികാരത്തിന്റെ സ്വഭാവം ‘ഭരിക്കുക’ എന്ന് കൂടുതൽ വ്യക്തമാക്കാതെ വിടുന്നു.
theological_decisions:
- issue: ‘എന്റെ നാമത്തിനായി ഒരു ഭവനം’ എന്ന ദേവാലയശാസ്ത്രപരമായ പ്രയോഗം
  choice: ‘എന്റെ നാമം അവിടെ ഉണ്ടായിരിക്കേണ്ടതിന് ഒരു ഭവനം’ എന്ന എബ്രായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
  alternative: ‘എന്റെ നാമത്തിനുള്ള ദേവാലയം’ അല്ലെങ്കിൽ ‘എന്റെ നാമം വസിക്കുന്ന ഭവനം’.
  rationale: യഹോവ തന്റെ നാമം സ്ഥാപിക്കുന്ന സ്ഥലം എന്ന ആവർത്തനപുസ്തകീയ ദൈവശാസ്ത്രഭാവം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു; അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: തിരഞ്ഞെടുത്തിട്ടില്ലാത്ത നഗരവും തിരഞ്ഞെടുത്ത ദാവീദും തമ്മിലുള്ള ബന്ധം
  choice: וָ־യെ വൈരുധ്യസൂചകമായ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദാവീദിനെയും ഞാൻ തിരഞ്ഞെടുത്തു’ അല്ലെങ്കിൽ ‘അപ്പോൾ ഞാൻ ദാവീദിനെ തിരഞ്ഞെടുത്തു’.
  rationale: സന്ദർഭം നഗരം തിരഞ്ഞെടുത്തില്ല എന്നതും ദാവീദിനെ തിരഞ്ഞെടുത്തു എന്നതും തമ്മിൽ ഊന്നിയ വൈരുധ്യം സൃഷ്ടിക്കുന്നു; എങ്കിലും ഏകോപനവായന സാധ്യമാണെന്ന യഥാർഥ ഭാഷാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഭവനം’, ‘നാമം’, ‘തിരഞ്ഞെടുത്തു’ എന്നിവ ഉറവിടത്തിന്റെ ദൈവശാസ്ത്രപരമായ പദപ്രയോഗം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
