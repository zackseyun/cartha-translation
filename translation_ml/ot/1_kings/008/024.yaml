  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദിനുവേണ്ടി അങ്ങ് അരുളിച്ചെയ്തത് അങ്ങ് പാലിച്ചിരിക്കുന്നു[a]. അങ്ങ് സ്വന്തം വായാൽ അരുളിച്ചെയ്തു; സ്വന്തം കൈയാൽ അതു നിറവേറ്റിയിരിക്കുന്നു[b]—ഇന്നു കാണുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദിനോട് അങ്ങ് അരുളിച്ചെയ്തത്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അങ്ങ് അങ്ങയുടെ വായാൽ അരുളിച്ചെയ്തു; അങ്ങയുടെ കൈയാൽ നിറവേറ്റി.’ ദൈവം പറഞ്ഞതു ദൈവം പ്രവൃത്തിയാൽ പൂർത്തിയാക്കി എന്നതിന്റെ സജീവമായ അവതരണമാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: പാലിച്ചിരിക്കുന്നു
  rationale: ദാവീദിനോടു പറഞ്ഞ വാക്ക് ദൈവം കാത്തുപാലിച്ചതിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. പിന്നീട് വരുന്ന מִלֵּאתָ എന്ന ‘നിറവേറ്റുക’ എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: לְעַבְדְּךָ
  choice: അങ്ങയുടെ ദാസനായ ... ദാവീദിനുവേണ്ടി
  rationale: לְ എന്നതിന് സന്ദർഭത്തിൽ ‘വേണ്ടി’ എന്നും ‘നോട്’ എന്നും അർഥസാധ്യതയുണ്ട്. പ്രധാനപാഠത്തിൽ വാഗ്ദാനം ദാവീദിനുവേണ്ടി പാലിച്ചു എന്ന അർഥം സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: דָּוִד אָבִי
  choice: എന്റെ പിതാവ് ദാവീദ്
  rationale: ഹീബ്രായ ക്രമം ‘ദാവീദ്, എന്റെ പിതാവ്’ എന്നാണെങ്കിലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘എന്റെ പിതാവ് ദാവീദ്’ കൂടുതൽ സുഗമമാണ്.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: അങ്ങ് അരുളിച്ചെയ്തത്
  rationale: דבר എന്നത് അടിസ്ഥാനമായി ‘പറയുക/സംസാരിക്കുക’ എന്നാണ്. ‘വാഗ്ദാനം ചെയ്തത്’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന ഗൗരവമുള്ള മലയാളപ്രയോഗമായ ‘അരുളിച്ചെയ്തത്’ ഉപയോഗിക്കുന്നു.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: അങ്ങയുടെ വായ്കൊണ്ട് അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വായും കൈയും തമ്മിലുള്ള ഹീബ്രായ സമാന്തരതയും ഊന്നലും അതേ മൂർത്തമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: അങ്ങയുടെ കൈകൊണ്ട് അത് നിറവേറ്റുകയും ചെയ്തിരിക്കുന്നു
  rationale: מלא ഇവിടെ പറഞ്ഞ വാക്ക് പൂർത്തിയാക്കുക, നിറവേറ്റുക എന്ന അർഥത്തിലാണ്. ‘കൈകൊണ്ട്’ എന്ന രൂപകം ദൈവത്തിന്റെ വാക്കും പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെതന്നെ
  rationale: ഇപ്പോൾ കാണാവുന്ന നിറവേറ്റലിലേക്കു വിരൽചൂണ്ടുന്ന ഹീബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള മനുഷ്യാവയവരൂപകങ്ങൾ (‘വായ്’, ‘കൈ’)
  choice: പ്രധാനപാഠത്തിൽ ‘വായ്കൊണ്ട്’, ‘കൈകൊണ്ട്’ എന്നീ മൂർത്തപ്രയോഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘അങ്ങ് വാഗ്ദാനം ചെയ്തു; അത് നടപ്പാക്കി’ എന്നു പരാവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വാക്കിനെയും പ്രവൃത്തിയെയും ഉദ്ദേശപൂർവം ഈ രൂപകങ്ങളിലൂടെ സമാന്തരമായി അവതരിപ്പിക്കുന്നു. പരാവർത്തനം ആ അലങ്കാരവും ഊന്നലും മങ്ങിച്ചുകളയും.
translation_notes:
  register: ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. ഭാഷ ആധുനികവും ഗൗരവമുള്ളതുമാണ്; ‘അരുളിച്ചെയ്യുക’ ദൈവിക വചനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ഉയർന്ന രജിസ്റ്റർ നൽകുന്നു. വായ്–കൈ സമാന്തരതയും ശാമർ/മില്ലേത് ക്രിയാവ്യത്യാസവും സംരക്ഷിച്ചു.
