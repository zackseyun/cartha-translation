lexical_decisions:
- source_word: וְיִהְיוּ
  choice: ഇരിക്കട്ടെ
  rationale: സന്ദർഭത്തിലെ പ്രാർഥനാപരമായ ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന രൂപം; ഒരു സാധാരണ ഭാവികാലപ്രസ്താവനയെന്നതിലുപരി അപേക്ഷയുടെ സ്വരം നിലനിർത്തുന്നു.
- source_word: דְבָרַי אֵלֶּה
  choice: എന്റെ ഈ വാക്കുകൾ
  rationale: സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ ഉടമസ്ഥതയും ‘ഈ’ എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ ഞാൻ യാചിച്ച
  rationale: התחנן എന്ന ക്രിയയിലെ വിനയപൂർവവും തീവ്രവുമായ അപേക്ഷയുടെ ഭാവം ‘യാചിച്ച’ നൽകുന്നു; לפני എന്നത് ദൈവസാന്നിധ്യത്തിൽ അർപ്പിച്ച പ്രാർഥനയായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെയുടെ അടുത്തിരിക്കട്ടെ
  rationale: പ്രാർഥനാവാക്കുകൾ ദൈവത്തിന്റെ ശ്രദ്ധയിൽ നിരന്തരം നിലനിൽക്കണമെന്ന ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: יוֹמָם וָלָיְלָה
  choice: രാവും പകലും
  rationale: തുടർച്ചയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാള സമാന്തരപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: വ്യവഹാരം നടത്തിക്കൊടുക്കേണ്ടതിന്
  rationale: ഒരു വ്യക്തിയുടെ ന്യായമായ കാര്യം ഏറ്റെടുത്തു വിധി നടപ്പാക്കുക എന്ന നിയമപരമായ പ്രയോഗാർത്ഥം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: עַבְדּוֹ
  choice: തന്റെ ദാസൻ
  rationale: രാജാവായ ശലോമോൻ ദൈവത്തോടുള്ള തന്റെ ബന്ധം വിവരിക്കുന്ന പ്രാർഥനാഭാഷയിൽ ‘ദാസൻ’ യോജിച്ചതാണ്.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ഓരോ ദിവസത്തെയും ആവശ്യമനുസരിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു ദിവസത്തിന്റെ കാര്യം അതത് ദിവസത്തിൽ’; ഓരോ ദിവസത്തിനും വേണ്ടതു നൽകുക എന്ന വിതരണാത്മക അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: പ്രാർഥനാവാക്കുകൾ ദൈവത്തിന്റെ ‘അടുത്ത്’ ഇരിക്കുക എന്ന ഭാഷ
  choice: രൂപകം അതേപടി നിലനിർത്തി
  alternative: ദൈവം ഈ പ്രാർഥന എപ്പോഴും ഓർക്കട്ടെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഓർമയെയോ ശ്രദ്ധയെയോ നേരിട്ട് നിർവചിക്കുന്നില്ല; വാക്കുകൾ ദൈവത്തിനടുത്ത് നിലനിൽക്കുന്നു എന്ന ദൃശ്യരൂപം മാത്രമാണ് നൽകുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി സ്വീകരിച്ചു. ‘അവിടുന്ന്’ ആദരസൂചക ദൈവപരാമർശമായി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ നിയമപരമായ ഭാഷയും പ്രാർഥനാവാക്കുകൾ ദൈവത്തിനടുത്ത് നിലനിൽക്കുന്നു എന്ന രൂപകവും അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തി.
