    text: അഥവാ, ‘ന്യായം നടത്തുക’ / ‘ന്യായമായ കാര്യം നിലനിർത്തുക.’ ഒരാളുടെ നിയമപരമായ കാര്യം ഏറ്റെടുത്തു നീതി നടപ്പാക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
