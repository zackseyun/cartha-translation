translation:
  language: ml
  text: യഹ്‌വെയുടെ സന്നിധിയിൽ ഞാൻ യാചിച്ച എന്റെ ഈ വാക്കുകൾ നമ്മുടെ ദൈവമായ യഹ്‌വെയുടെ സമീപം രാവും പകലും ഇരിക്കട്ടെ; അവിടുന്ന് തന്റെ ദാസന്റെ കാര്യത്തിലും തന്റെ ജനമായ ഇസ്രായേലിന്റെ കാര്യത്തിലും, ഓരോ ദിവസത്തിന്റെയും ആവശ്യത്തിനനുസരിച്ച്, ന്യായം നടത്തേണ്ടതിന്.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ ദൈവമായ യഹ്‌വെയോടു ചേർന്നിരിക്കട്ടെ.’ ഈ പ്രാർഥനാവാക്കുകൾ ദൈവത്തിന്റെ സന്നിധിയിൽ നിരന്തരം നിലനിൽക്കുന്നതായാണ് എബ്രായ പ്രയോഗം ചിത്രീകരിക്കുന്നത്.
