id: 1KI.8.17
reference: 1 Kings 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: ml
  text: യിസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയുടെ നാമത്തിനായി ഒരു ഭവനം[a] പണിയണമെന്നത് എന്റെ പിതാവായ ദാവീദിന്റെ ഹൃദയത്തിലുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ നാമത്തിനായി ഒരു ആലയം പണിയാൻ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഒരു ഭവനം പണിയാൻ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഉണ്ടായിരുന്നു
  rationale: ഇവിടെ היה ഒരു കഴിഞ്ഞകാലാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. പ്രത്യേകമായ ഒരു ‘ഇപ്പോൾ’ എന്ന കാലസൂചകം ചേർക്കാതെ, സന്ദർഭത്തിന്റെ ആഖ്യാനബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: עִם לְבַב
  choice: ഹൃദയത്തിലുണ്ടായിരുന്നു
  rationale: ഒരാളുടെ ഉദ്ദേശ്യമോ ആഗ്രഹമോ ഹൃദയത്തിൽ ഉണ്ടായിരുന്നതായി പറയുന്ന എബ്രായ പ്രയോഗമാണിത്. ‘ഉദ്ദേശിച്ചു’ എന്നു മാത്രം പറഞ്ഞ് രൂപകം ഇല്ലാതാക്കാതെ ഹൃദയരൂപകം നിലനിർത്തുന്നു.
- source_word: דָּוִד אָבִי
  choice: എന്റെ പിതാവായ ദാവീദ്
  rationale: ബന്ധവും വ്യക്തിനാമവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לִבְנוֹת
  choice: പണിയണമെന്നത്
  rationale: בנה എന്ന ക്രിയയുടെ ക്ഷേത്രനിർമാണസന്ദർഭത്തിലെ സാധാരണ അർഥം നൽകുകയും ഹൃദയത്തിലുണ്ടായിരുന്ന ഉദ്ദേശ്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בַּיִת
  choice: ഒരു ഭവനം
  rationale: സന്ദർഭത്തിൽ ക്ഷേത്രത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും എബ്രായപദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ഭവനം’ നിലനിർത്തുന്നു. ക്ഷേത്രത്തെ ദൈവത്തിന്റെ ഭവനമായി അവതരിപ്പിക്കുന്ന രൂപകവും ഇതിലൂടെ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: לְשֵׁם
  choice: നാമത്തിനായി
  rationale: ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തോടും സാന്നിധ്യത്തോടും ബന്ധപ്പെട്ട സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: യിസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വെ ആരെന്ന് സമാനാധികരണമായി വ്യക്തമാക്കുന്ന എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമത്തെ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- issue: בַּיִת എന്നത് ‘ഭവനം’ എന്നോ ‘ആലയം’ എന്നോ നൽകുക
  choice: ഭവനം
  alternative: ആലയം
  rationale: സന്ദർഭത്തിലെ ഉദ്ദേശ്യം ക്ഷേത്രമാണെങ്കിലും മൂലപദം ‘ഭവനം’ എന്നാണ്. അതിന്റെ യഥാർഥ ദൃശ്യരൂപവും ദൈവശാസ്ത്രപരമായ സൂചനയും മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സന്ദർഭപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഹൃദയം’, ‘നാമം’, ‘ഭവനം’ എന്നീ മൂലരൂപകങ്ങൾ വ്യാഖ്യാനിച്ച് നീക്കാതെ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
