  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: ml
  text: അതിനാൽ, ഇന്നത്തെപ്പോലെ[b] അവന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുകയും അവന്റെ കൽപ്പനകൾ പാലിക്കുകയും ചെയ്യേണ്ടതിന്, നിങ്ങളുടെ ഹൃദയം നമ്മുടെ ദൈവമായ യഹ്‌വെയോട് പൂർണമായി[a] ചേർന്നിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “വിഭജിക്കപ്പെടാതെ”: “നിങ്ങളുടെ ഹൃദയം നമ്മുടെ ദൈവമായ യഹ്‌വെയോട് വിഭജിക്കപ്പെടാതെ ചേർന്നിരിക്കട്ടെ.”'
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ, “ഈ ദിവസത്തെപ്പോലെ” അഥവാ “ഈ ദിവസത്തിൽ എന്നപോലെ”; ഇപ്പോഴത്തെ ദിവസത്തെയോ നിലവിലെ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ആയിരിക്കട്ടെ / ചേർന്നിരിക്കട്ടെ
  rationale: സന്ദർഭത്തിൽ ഇത് ഒരു സാധാരണ ഭാവികാലപ്രസ്താവനയല്ല, പ്രബോധനാത്മകമായ ആശംസയോ ആഹ്വാനമോ ആണ്. മലയാളത്തിൽ ‘ഇരിക്കട്ടെ’ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבַבְכֶם
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: לֵבָב മനുഷ്യന്റെ ചിന്ത, ഇച്ഛ, ഭക്തി എന്നിവ ഉൾപ്പെടുന്ന ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്നു. ഉറവിടത്തിലെ ഏകവചന കൂട്ടാർഥം ‘നിങ്ങളുടെ ഹൃദയം’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׁלֵם
  choice: പൂർണമായി
  rationale: ഇവിടെ പാപരഹിതമായ പരിപൂർണതയല്ല, വിഭജിക്കപ്പെടാത്ത സമ്പൂർണ ഉടമ്പടി-വിശ്വസ്തതയാണ് ഉദ്ദേശ്യം. ‘പൂർണമായി’ ആ അർഥം തുറന്നുവെക്കുന്നു.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെയോട് ... ചേർന്നിരിക്കട്ടെ
  rationale: עִם എന്നതിലെ ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധാത്മക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘യഹ്‌വെയോട് ... ചേർന്നിരിക്കുക’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരിയെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: അവന്റെ ചട്ടങ്ങൾ അനുസരിച്ച് നടക്കുക
  rationale: הלך എന്ന ജീവിതനടപ്പിന്റെ രൂപകം ‘നടക്കുക’ എന്നു നിലനിർത്തുന്നു; בְּחֻקָּיו മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ചട്ടങ്ങൾ അനുസരിച്ച്’ എന്നു നൽകി.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: അവന്റെ കല്പനകൾ പാലിക്കുക
  rationale: നിയമ-ഉടമ്പടി സന്ദർഭത്തിലെ שׁמר എന്നത് കല്പനകളെ അനുസരിച്ച് ആചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പാലിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כַּיּוֹם הַזֶּה
  choice: ഇന്നുള്ളതുപോലെ
  rationale: ഇപ്പോഴത്തെ ദിവസത്തെ അത്തരം ഭക്തിയുടെ മാതൃകയോ സാക്ഷ്യമോ ആയി ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകർന്നു.
theological_decisions:
- issue: שָׁלֵם സൂചിപ്പിക്കുന്ന സമ്പൂർണതയുടെ സ്വഭാവം
  choice: പൂർണമായി
  alternative: വിഭജിക്കപ്പെടാതെ / ഏകാഗ്രമായി
  rationale: വാക്യം സമ്പൂർണ ഉടമ്പടി-വിശ്വസ്തത ആവശ്യപ്പെടുന്നു; അതിനെ പാപരഹിത പരിപൂർണത എന്ന പിന്നീടുള്ള ദൈവശാസ്ത്രവിഭാഗമായി നിർവചിക്കാതെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഉറവിടത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാള ലിപ്യന്തരണം നൽകുന്നു.
- issue: עִם എന്ന ബന്ധാത്മക പ്രയോഗം
  choice: യഹ്‌വെയോട് ... ചേർന്നിരിക്കട്ടെ
  alternative: യഹ്‌വെയോടുകൂടെ പൂർണമായിരിക്കട്ടെ
  rationale: അക്ഷരാർഥം ‘കൂടെ’ എന്നാണെങ്കിലും, മലയാളത്തിൽ അതേ ഉടമ്പടി-ബന്ധവും വിശ്വസ്തതയും സ്വാഭാവികമായി അറിയിക്കാൻ ‘ചേർന്നിരിക്കുക’ ഉപയോഗിച്ചു; ‘സമർപ്പിക്കപ്പെട്ടിരിക്കുക’ എന്നു നൽകി അർഥം അമിതമായി നിർണ്ണയിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഹൃദയം’, ‘നടക്കുക’ എന്നീ തിരുവെഴുത്തുരൂപകങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ അക്ഷരാനുകരണം ഒഴിവാക്കാൻ ‘ചട്ടങ്ങൾ അനുസരിച്ച്’, ‘യഹ്‌വെയോട് ... ചേർന്നിരിക്കട്ടെ’ എന്നീ സ്വാഭാവിക ഘടനകൾ ഉപയോഗിച്ചു.
