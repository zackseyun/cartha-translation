    rationale: וְשָׁמַעְתָּ ... וְעָשִׂיתָ contains coordinated petitionary verbs. 'കേട്ട്' is a converb and may make the second request dependent on the first. Using 'കേൾക്കണമേ ... നടത്തിക്കൊടുക്കണമേ' preserves the source syntax and request force.
