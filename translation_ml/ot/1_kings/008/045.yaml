  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: ml
  text: അപ്പോൾ അങ്ങ് സ്വർഗത്തിൽ[a] അവരുടെ പ്രാർഥനയും യാചനയും കേൾക്കണമേ; അവരുടെ ന്യായം നടത്തിക്കൊടുക്കണമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘ആകാശങ്ങൾ’ അഥവാ ‘സ്വർഗങ്ങൾ’ എന്നാണ്; ഈ പ്രാർഥനാസൂത്രത്തിൽ ‘സ്വർഗത്തിൽ’ എന്നർഥത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർക്കുവേണ്ടി നീതി നടപ്പാക്കണമേ’ എന്നോ ‘അവരുടെ അവകാശം നിലനിർത്തണമേ’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവരുടെ ന്യായം/വിധി ചെയ്യണമേ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: അപ്പോൾ അങ്ങ് ... കേട്ട്
  rationale: ശׁמע എന്ന ക്രിയയുടെ ഖാൽ പെർഫെക്റ്റ് രണ്ടാംപുരുഷ ഏകവചനരൂപം ഈ പ്രാർഥനാസന്ദർഭത്തിൽ ദൈവത്തോടുള്ള അപേക്ഷയായി പ്രവർത്തിക്കുന്നു. മുൻവാക്യങ്ങളിലെ വ്യവസ്ഥകളുടെ തുടർച്ച വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തിന്റെ ആശയം ‘അപ്പോൾ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽ
  rationale: എബ്രായരൂപം അക്ഷരാർഥത്തിൽ ‘ആകാശങ്ങൾ/സ്വർഗങ്ങൾ’ എന്നാണ്; എന്നാൽ ഈ പ്രാർഥനാസൂത്രത്തിൽ ദൈവം കേൾക്കുന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നത് സ്വാഭാവികമാണ്. മൂലപാഠത്തിൽ ‘നിന്ന്’ എന്നർഥമുള്ള מִן ഇല്ലാത്തതിനാൽ ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതിനു പകരം ‘സ്വർഗത്തിൽ’ സ്വീകരിച്ചു.
- source_word: תְּפִלָּתָם
  choice: അവരുടെ പ്രാർഥന
  rationale: תְּפִלָּה പ്രാർഥനയ്ക്കുള്ള പൊതുപദമാണ്. ബഹുവചന പ്രത്യയത്തോടുകൂടിയ ഏകവചനനാമം മലയാളത്തിൽ സമൂഹവാചകമായി ‘അവരുടെ പ്രാർഥന’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: תְּחִנָּתָם
  choice: അവരുടെ യാചന
  rationale: תְּחִנָּה കൃപയോ അനുകൂലവിധിയോ തേടിയുള്ള ഉറ്റ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു. ‘യാചന’ പ്രാർഥനയിൽനിന്നുള്ള ഈ അർഥവ്യത്യാസം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യവും ഗ്രഹിക്കാവുന്നതുമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: അവരുടെ ന്യായം നടത്തിക്കൊടുക്കണമേ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ ന്യായം/വിധി ചെയ്യുക’ എന്ന എബ്രായ ന്യായവ്യവഹാരശൈലി അവരുടെ പക്ഷത്ത് നീതി നടപ്പാക്കുക, അവരുടെ വ്യവഹാരത്തിന് ന്യായമായ തീർപ്പ് നൽകുക എന്ന ആശയം വഹിക്കുന്നു. മലയാളത്തിലെ ‘ന്യായം നടത്തിക്കൊടുക്കുക’ ഈ നിയമപരവും അനുകൂലവുമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള അപേക്ഷയിലെ ന്യായവ്യവഹാരശൈലി
  choice: അവരുടെ ന്യായം നടത്തിക്കൊടുക്കണമേ
  alternative: അവർക്കുവേണ്ടി നീതി നടപ്പാക്കണമേ; അവരുടെ അവകാശം നിലനിർത്തണമേ
  rationale: עשה משפט എന്ന പ്രയോഗം ഒരാളുടെ പക്ഷത്ത് നീതി നടപ്പാക്കുകയോ അവന്റെ വ്യവഹാരത്തിന് ന്യായമായ തീർപ്പ് നൽകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. തിരഞ്ഞെടുത്ത ഭാഷ ദൈവിക നീതീകരണത്തിന്റെ നിയമപരവും ബന്ധപരവുമായ അർഥം സൂക്ഷിക്കുന്നു; എന്നാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സങ്കുചിത വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ എന്നും അപേക്ഷാഭാവത്തിന് ‘ണമേ’ എന്നും സ്വീകരിച്ചു. ‘പ്രാർഥന’യും ‘യാചന’യും തമ്മിലുള്ള മൂലപാഠത്തിലെ സൂക്ഷ്മ വ്യത്യാസവും അവസാനവാക്യത്തിലെ ന്യായവ്യവഹാരപരമായ അർഥവ്യാപ്തിയും നിലനിർത്തി.
