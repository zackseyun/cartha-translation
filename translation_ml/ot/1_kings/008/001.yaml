id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: ml
  text: അപ്പോൾ ശലോമോൻ ഇസ്രായേലിന്റെ മൂപ്പന്മാരെയും, ഗോത്രങ്ങളുടെ എല്ലാ തലവന്മാരെയും, ഇസ്രായേൽമക്കളുടെ പിതൃഭവനങ്ങളുടെ പ്രമാണിമാരെയും, ദാവീദിന്റെ നഗരമായ സീയോനിൽനിന്ന് യഹോവയുടെ ഉടമ്പടിയുടെ പെട്ടകം കയറ്റിക്കൊണ്ടുവരാൻ യെരൂശലേമിലെ ശലോമോൻ രാജാവിന്റെ അടുക്കലേക്ക് വിളിച്ചുകൂട്ടി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ അവതരിപ്പിക്കുന്ന കാലസൂചകമായി സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: יַקְהֵל
  choice: വിളിച്ചുകൂട്ടി
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം മറ്റുള്ളവരെ ഔദ്യോഗികമായി ഒരുമിച്ചുകൂട്ടുക എന്ന കാരണാർത്ഥം നൽകുന്നു.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ മൂപ്പന്മാർ
  rationale: അംഗീകൃത മുതിർന്ന സാമൂഹിക-രാഷ്ട്രീയ നേതാക്കളെ സൂചിപ്പിക്കുന്ന പതിവുപദം.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: ഗോത്രങ്ങളുടെ എല്ലാ തലവന്മാർ
  rationale: מַטּוֹת ഇവിടെ വടികളെയല്ല, ഗോത്രവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: പിതൃഭവനങ്ങളുടെ പ്രമാണിമാർ
  rationale: പൂർവികകുടുംബങ്ങളുടെയോ വംശഭവനങ്ങളുടെയോ അംഗീകൃത നേതാക്കളെ വ്യക്തമാക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബ-ദേശീയ പ്രയോഗത്തിന്റെ കൂട്ടായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ അടുക്കൽ
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചകമായ ‘അടുക്കലേക്ക്/അടുക്കൽ’ അർത്ഥം നിലനിർത്തുന്നു; ‘സന്നിധിയിൽ’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לְהַעֲלוֹת
  choice: കൊണ്ടുവരാൻ
  rationale: ഉയർന്ന സ്ഥലത്തേക്കു കൊണ്ടുപോകുക എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മലയാളത്തിൽ ‘മുകളിലേക്കു കൊണ്ടുവരാൻ’ എന്നു പറഞ്ഞാൽ അനാവശ്യ ഭൗമവിശദീകരണം തോന്നാം.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹോവയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: നിർമാണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: מֵעִיר דָּוִד הִיא צִיּוֹן
  choice: ദാവീദിന്റെ നഗരമായ സീയോനിൽനിന്ന്
  rationale: ‘ദാവീദിന്റെ നഗരം—അതുതന്നെ സീയോൻ’ എന്ന തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണഘടനയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ‘യഹോവ’.
- issue: לִבְנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ദേശീയ സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: കൂട്ടായ ദേശീയ അർത്ഥവും കുടുംബബന്ധത്തിന്റെ ഭാവവും സംരക്ഷിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി തോന്നുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കഥനശൈലി. ഔദ്യോഗിക നേതൃപദവികൾ വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു; നീണ്ട എബ്രായ വാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
