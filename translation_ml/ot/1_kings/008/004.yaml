  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: ml
  text: യഹ്‌വേയുടെ പെട്ടകവും സമാഗമകൂടാരവും കൂടാരത്തിലുണ്ടായിരുന്ന വിശുദ്ധ ഉപകരണങ്ങളെല്ലാം മുകളിലേക്കു കൊണ്ടുവന്നു[a]; പുരോഹിതന്മാരും ലേവ്യരും അവയെ മുകളിലേക്കു കൊണ്ടുവന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുകളിലേക്കു ചുമന്നുകൊണ്ടുപോയി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് ഒരു ഘോഷയാത്രയിൽ മുകളിലേക്കു കൊണ്ടുപോകുന്നതിനെയോ ചുമന്നുകൊണ്ടുപോകുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘പുരോഹിതന്മാരും ലേവ്യരും’ എന്നാണ്. ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി ലേവ്യപുരോഹിതവർഗത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; എന്നാൽ എബ്രായവാചകം രണ്ടു കൂട്ടരെയും പേരിടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: മുകളിലേക്കു കൊണ്ടുവന്നു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള עלה ഇവിടെ ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന അർഥം നൽകുന്നു. ദേവാലയസ്ഥാനത്തേക്കുള്ള ദിശാസൂചന നിലനിർത്തുമ്പോഴും ചുമന്ന രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: אֲרוֹן יְהוָה
  choice: യഹ്‌വേയുടെ പെട്ടകം
  rationale: אֲרוֹן നിയമപെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; יְהוָה എന്ന ദൈവനാമം സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധ കൂടാരത്തിനുള്ള സ്ഥിരവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗമാണിത്; ‘കൂടാരം’ എന്ന ഘടകവും കൂടിക്കാഴ്ചയുടെ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധ ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִים പാത്രങ്ങൾ മാത്രമല്ല, വിവിധ സാമഗ്രികളും ഉപകരണങ്ങളും ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്. ‘ഉപകരണങ്ങൾ’ ആ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: കൂടാരത്തിലുണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യം അടുത്തുള്ള ‘വിശുദ്ധ ഉപകരണങ്ങൾ’ എന്ന പദസമൂഹത്തെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ ‘സമാഗമകൂടാരം’ എന്നതിനു പകരം ‘കൂടാരം’ എന്നു പറഞ്ഞു.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: അവയെ മുകളിലേക്കു കൊണ്ടുവന്നു
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ച ക്രിയ മലയാളത്തിലും നിലനിർത്തി; ‘അവയെ’ എന്നത് മുമ്പു പറഞ്ഞ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: പുരോഹിതന്മാരും ലേവ്യരും
  rationale: എബ്രായം രണ്ടു കൂട്ടരെയും വ്യക്തമായി പേരിടുന്നതിനാൽ അവരെ ഒരൊറ്റ വിഭാഗമായി ലയിപ്പിക്കാതെ അതേ ദ്വന്ദ്വഘടന നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ആധുനിക മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു.
- issue: ‘പുരോഹിതന്മാരും ലേവ്യരും’ എന്ന പ്രയോഗത്തിലെ രണ്ടു കൂട്ടരുടെ ബന്ധം
  choice: രണ്ടു കൂട്ടരെയും പ്രത്യേകം പേരിട്ട് നിലനിർത്തുക
  alternative: ‘ലേവ്യപുരോഹിതന്മാർ’ എന്ന ഒറ്റവിഭാഗമായി വ്യാഖ്യാനിക്കുക
  rationale: മൂലപാഠം הַכֹּהֲנִים וְהַלְוִיִּם എന്നു രണ്ടു നാമങ്ങളും സംയോജകവും ഉപയോഗിക്കുന്നു. മറ്റു ഭാഗങ്ങളുമായുള്ള സാധ്യതയുള്ള പിരിമുറുക്കം പരിഭാഷയിൽ തീർപ്പാക്കാതെ ഈ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുകളിലേക്കു കൊണ്ടുവന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ ഘടനയും ദിശാസൂചനയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ഭാഗങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
