lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: അപ്പോൾ ... കേട്ട്
  rationale: നിബന്ധനാത്മകമായ മുൻവാക്യങ്ങളുടെ തുടർച്ചയിൽ ദൈവത്തോടുള്ള അപേക്ഷയാണിത്. וְ എന്ന ബന്ധകത്തിന്റെ ക്രമസൂചന ‘അപ്പോൾ’ എന്നും, അപേക്ഷാഭാവം ‘കേട്ട് ... നടത്തിക്കൊടുക്കണമേ’ എന്ന ഘടനയിലും പ്രകടമാക്കുന്നു.
- source_word: הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: പദശഃ ‘ആകാശങ്ങൾ’ എന്നാണെങ്കിലും, ദൈവത്തിന്റെ സ്വർഗീയ വാസസ്ഥാനത്തുനിന്ന് പ്രാർഥന കേൾക്കുക എന്ന ആശയം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഹീബ്രുവിൽ ‘നിന്ന്’ എന്ന ഉപസർഗം തുറന്നുപറയാത്തതിനാൽ പകരവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: അങ്ങയുടെ വാസത്തിന്റെ സ്ഥിരസ്ഥാനം
  rationale: מָכוֹן എന്നത് സ്ഥാപിതമായതോ ഉറപ്പുള്ളതോ ആയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; שׁבתך ‘അങ്ങയുടെ വാസം’ എന്നാണ്. ‘സ്ഥിരസ്ഥാനം’ ഈ പ്രത്യേക നിഴൽ അർഥം സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
- source_word: תְּפִלָּתָם
  choice: അവരുടെ പ്രാർഥന
  rationale: תְּפִלָּה എന്ന പൊതുവായ പ്രാർഥനാപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: תְּחִנָּתָם
  choice: യാചന
  rationale: കൃപയോ കരുണയോ തേടിയുള്ള ഹൃദയപൂർവമായ അപേക്ഷയാണ് תְּחִנָּה. ‘യാചന’ എന്നത് ‘പ്രാർഥന’യിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാവുകയും ചെയ്യുന്നു.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: അവരുടെ ന്യായം നടത്തിക്കൊടുക്കണമേ
  rationale: പദശഃ ‘അവരുടെ ന്യായവിധി/ന്യായം ചെയ്യുക’ എന്ന ഈ ന്യായവ്യവഹാരപ്രയോഗം അവരുടെ പക്ഷത്ത് നീതിപൂർവം ഇടപെടുക, അവരുടെ കേസ് ന്യായമായി തീർപ്പാക്കുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിലെ ‘ന്യായം നടത്തിക്കൊടുക്കുക’ ആ നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ സ്വർഗീയ വാസത്തെക്കുറിച്ചുള്ള സ്ഥലസൂചക ഭാഷ
  choice: ‘അങ്ങയുടെ വാസത്തിന്റെ സ്ഥിരസ്ഥാനമായ സ്വർഗത്തിൽനിന്ന്’ എന്ന ബൈബിൾചിത്രണം നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ വാസസ്ഥാനമായ സ്വർഗത്തിൽ’
  rationale: ക്ഷേത്രപ്രാർഥനയുടെ പശ്ചാത്തലത്തിൽ ദൈവത്തിന്റെ സ്വർഗീയ വാസത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ഭാഷ സംരക്ഷിക്കുന്നു; ദൈവം സ്വർഗത്തിൽ സ്ഥലപരമായി പരിമിതനാണെന്ന അധിക സിദ്ധാന്തവാദം ഇതിലേക്ക് ചേർക്കുന്നില്ല.
- issue: מִשְׁפָּטָם എന്നതിന്റെ ന്യായവ്യവഹാരഭാവം
  choice: ‘അവരുടെ ന്യായം നടത്തിക്കൊടുക്കണമേ’
  alternative: ‘അവരെ കുറ്റവിമുക്തരാക്കണമേ’ അല്ലെങ്കിൽ ‘അവർക്ക് നീതി നൽകണമേ’
  rationale: മൂലപാഠം ഫലം മുൻകൂട്ടി തീർപ്പാക്കാതെ അവരുടെ ന്യായകാര്യത്തിൽ ദൈവം പ്രവർത്തിക്കണമെന്ന് അപേക്ഷിക്കുന്നു. ‘കുറ്റവിമുക്തരാക്കുക’ എന്നത് ഫലം അനാവശ്യമായി നിർണ്ണയിക്കും; തിരഞ്ഞെടുത്ത രൂപം യഥാർഥമായ ന്യായവ്യവഹാരവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘പ്രാർഥന’യും ‘യാചന’യും വേർതിരിച്ച് മൂലപാഠത്തിലെ സമാന്തരപദങ്ങളുടെ വ്യത്യാസം സൂക്ഷിച്ചു; വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കി.
