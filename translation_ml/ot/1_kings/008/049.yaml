  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങ് വസിക്കുന്ന സ്ഥാപിത സ്ഥലം.’ ഹീബ്രുവിലെ പ്രയോഗം ദൈവത്തിന്റെ സ്ഥിരമായ വാസസ്ഥാനത്തെ ഊന്നിപ്പറയുന്നു.
