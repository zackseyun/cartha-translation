    text: അഥവാ, ‘അവരുടെ ന്യായകാര്യം നടപ്പാക്കണമേ’ അല്ലെങ്കിൽ ‘അവരുടെ പക്ഷം ന്യായമായി തീർപ്പാക്കണമേ.’ ഹീബ്രുവിൽ പദശഃ ‘അവരുടെ ന്യായം/ന്യായവിധി ചെയ്യുക’ എന്നാണ്; അവരുടെ ന്യായകാര്യത്തിൽ പ്രവർത്തിക്കുക എന്നർഥമുള്ള പ്രയോഗമാണിത്.
