id: 1KI.8.11
reference: 1 Kings 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: ml
  text: മേഘം കാരണം പുരോഹിതന്മാർക്ക് നിന്ന് ശുശ്രൂഷ ചെയ്യാൻ കഴിഞ്ഞില്ല[a]; കാരണം, യഹ്‌വേയുടെ മഹത്ത്വം യഹ്‌വേയുടെ ഭവനം[b] നിറഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്ന് സേവനം ചെയ്യാൻ കഴിഞ്ഞില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, യഹ്‌വേയുടെ ആലയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: കഴിഞ്ഞില്ല
  rationale: കഴിവിനെയോ സാധുതയെയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നിഷേധരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: ആലയശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ സാധാരണ മലയാളപദം.
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: ശുശ്രൂഷ ചെയ്യാൻ നിൽക്കാൻ
  rationale: ‘നിൽക്കുക’, ‘ശുശ്രൂഷ ചെയ്യുക’ എന്നീ രണ്ടു ആശയങ്ങളും നിലനിർത്തി, പുരോഹിതശുശ്രൂഷയുടെ ഔപചാരിക പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
- source_word: מִפְּנֵי הֶעָנָן
  choice: മേഘം നിമിത്തം
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിനുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: מָלֵא
  choice: നിറഞ്ഞിരുന്നു
  rationale: പുരോഹിതന്മാർക്ക് ശുശ്രൂഷ ചെയ്യാൻ കഴിയാതിരുന്ന അവസ്ഥയെ വിശദീകരിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയെ സന്ദർഭോചിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹ്‌വേയുടെ മഹത്ത്വം
  rationale: כבוד എന്ന പദത്തിന്റെ ദൈവിക മഹിമയും പ്രത്യക്ഷ സാന്നിധ്യത്തിന്റെ ദൃശ്യരൂപകവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ഭവനം
  rationale: ‘യഹ്‌വേയുടെ വീട്/ഭവനം’ എന്ന ഹീബ്രു രൂപം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആലയമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു ബിരുദംകൊണ്ട് പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: כְבוֹד יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്‌വേയുടെ മഹത്ത്വം
  alternative: യഹ്‌വേയുടെ സാന്നിധ്യം
  rationale: ദൈവിക സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, ‘മഹത്ത്വം’ എന്ന മൂലരൂപകവും അതിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: בֵּית יְהוָה എന്ന പ്രയോഗം
  choice: യഹ്‌വേയുടെ ഭവനം
  alternative: യഹ്‌വേയുടെ ആലയം
  rationale: ഹീബ്രുവിലെ ‘ഭവനം’ എന്ന രൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും, ചരിത്രസന്ദർഭത്തിൽ അത് ആലയമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. പുരോഹിതശുശ്രൂഷയുടെ ഔപചാരികതയ്ക്കായി ‘ശുശ്രൂഷ’, ദൈവനാമത്തിനായി ‘യഹ്‌വേ’, ഹീബ്രു രൂപകം നിലനിർത്താൻ ‘ഭവനം’ എന്നിവ ഉപയോഗിച്ചു.
