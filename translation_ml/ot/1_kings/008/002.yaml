  yaml_path: translation/ot/1_kings/008/002.yaml
  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: ml
  text: ഏതാനീം മാസത്തിലെ ഉത്സവസമയത്ത്—അതായത് ഏഴാം മാസത്തിൽ—ഇസ്രായേലിലെ സകല പുരുഷന്മാരും ശലോമോൻ രാജാവിന്റെ സന്നിധിയിൽ ഒരുമിച്ചുകൂടി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: ഒരുമിച്ചുകൂടി
  rationale: നിഫാൽ രൂപത്തിന്റെ കൂട്ടമായി സമ്മേളിക്കുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: ശലോമോൻ രാജാവിന്റെ സന്നിധിയിൽ
  rationale: אֶל എന്നത് അടിസ്ഥാനമായി ‘അടുത്തേക്ക്/അരികിലേക്ക്’ എന്നു സൂചിപ്പിക്കുന്നുവെങ്കിലും, രാജാവിന്റെ മുമ്പാകെയുള്ള സമ്മേളനം എന്ന സന്ദർഭാർഥം ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിലെ ‘before’ നോടും യോജിക്കുന്നു.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല പുരുഷന്മാരും
  rationale: אִישׁ എന്ന ഏകവചനരൂപം כָּל ഒപ്പം ചേർന്ന് സമൂഹത്തിലെ പുരുഷന്മാരെ സമാഹാരമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: ഏതാനീം മാസത്തിലെ
  rationale: പുരാതന മാസനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בֶּחָג
  choice: ഉത്സവസമയത്ത്
  rationale: നിർദ്ദിഷ്ടമായ ഉത്സവത്തെ സൂചിപ്പിക്കുന്ന പദം; ഈ വാക്യത്തിൽ ഉത്സവത്തിന്റെ പേര് വ്യക്തമാക്കാത്തതിനാൽ പേര് ചേർക്കുന്നില്ല.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസത്തിൽ
  rationale: ഏതാനീം ഏഴാം മാസമാണെന്ന വിശദീകരണം നേരിട്ട് സംരക്ഷിക്കുന്നു.
