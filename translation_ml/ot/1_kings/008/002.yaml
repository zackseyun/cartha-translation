source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ אֶל הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ כָּל אִ֣ישׁ יִשְׂרָאֵ֔ל בְּ/יֶ֥רַח הָ/אֵֽתָנִ֖ים בֶּ/חָ֑ג ה֖וּא הַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
