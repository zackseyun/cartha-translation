source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: ml
  text: നമ്മുടെ ഹൃദയങ്ങളെ തന്നിലേക്കു ചായിക്കുമാറാക്കാനും, തന്റെ എല്ലാ വഴികളിൽ നടക്കാനും, നമ്മുടെ പിതാക്കന്മാർക്കു[a] അവൻ കല്പിച്ച തന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും പാലിക്കാനും അവൻ ഇടയാക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ പൂർവികർക്ക്.” എബ്രായപാഠത്തിൽ “നമ്മുടെ പിതാക്കന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: ചായിച്ച് … ഇടയാക്കട്ടെ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘തിരിയാൻ/ചായാൻ കാരണമാകുക’ എന്ന അർഥവും ഹൃദയത്തെ ദൈവത്തിലേക്കു നയിക്കുന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: לְבָבֵנוּ אֵלָיו
  choice: നമ്മുടെ ഹൃദയങ്ങളെ തന്നിലേക്കു
  rationale: לֵבָב സൂചിപ്പിക്കുന്ന ചിന്ത, ഇച്ഛ, വികാരം എന്നിവയുടെ ആന്തരിക കേന്ദ്രത്തെ ‘ഹൃദയം’ സ്വാഭാവികമായ ബൈബിൾ ഭാഷയിൽ നിലനിർത്തുന്നു; אֵלָיו ദൈവത്തിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്നു.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: തന്റെ എല്ലാ വഴികളിലും നടക്കാൻ
  rationale: ഉടമ്പടിപരമായ ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ‘നടക്കുക/വഴികൾ’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: וְלִשְׁמֹר
  choice: പാലിക്കാൻ
  rationale: കല്പനകളോടൊപ്പം שׁמר എന്നതിന് ഇവിടെ ‘അനുസരിച്ച് ആചരിക്കുക’ എന്ന അർഥമാണ്; ആധുനിക മലയാളത്തിൽ ‘പാലിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מִצְוֺתָיו וְחֻקָּיו וּמִשְׁפָּטָיו
  choice: തന്റെ കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും
  rationale: മൂന്നു വ്യത്യസ്ത ഉടമ്പടി-നിയമ പദങ്ങളുടെ വേർതിരിവ് യഥാക്രമം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר צִוָּה אֶת אֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാരോടു കല്പിച്ച
  rationale: אָבוֹתֵינוּ എന്ന പുരുഷലിംഗ ബന്ധുപദത്തെ ഔപചാരികമായി പ്രതിഫലിപ്പിക്കുന്നു; ബന്ധുവാക്യം മൂന്നു നിയമപദങ്ങളെയും വിശേഷിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉടമ്പടി-നിയമ പദത്രയത്തിന്റെ വിവർത്തനം
  choice: കല്പനകളും ചട്ടങ്ങളും ന്യായവിധികളും
  alternative: ആജ്ഞകളും നിയമങ്ങളും വിധികളും
  rationale: מִצְוֹת, חֻקִּים, מִשְׁפָּטִים എന്നീ മൂന്നു പദങ്ങളെയും ഒരൊറ്റ പൊതുപദത്തിലേക്ക് ചുരുക്കാതെ അവയുടെ നിയമപരമായ വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: ഹൃദയത്തെ ദൈവത്തിലേക്കു ചായിക്കുന്ന കർത്തൃത്വം
  choice: അവൻ ഇടയാക്കട്ടെ
  alternative: അവൻ ചായിക്കുമാറാകട്ടെ
  rationale: ഹിഫീൽ ക്രിയ ദൈവം മനുഷ്യന്റെ ആന്തരിക ദിശയെ സ്വാധീനിക്കുന്നതിനെ പറയുന്നു; മനുഷ്യന്റെ പിന്നാലെയുള്ള നടത്തവും അനുസരണവും മായ്ച്ചുകളയാതെ ആ ദൈവിക കർത്തൃത്വം പ്രകടമാക്കുന്നു.
- issue: പൂർവികരെ സൂചിപ്പിക്കുന്ന ലിംഗസൂചനയുള്ള പദം
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: എബ്രായത്തിലെ אָבוֹתֵינוּ എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പുരുഷലിംഗ ബന്ധുസൂചന നിലനിർത്തുന്നു; വിശാലമായ വംശപരമ്പരാ അർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. ‘ഹൃദയം’, ‘വഴികളിൽ നടക്കുക’ എന്നീ ബൈബിൾ രൂപകങ്ങൾ നിലനിർത്തി; നിയമപദത്രയത്തിന് ഔപചാരിക വേർതിരിവ് നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പിതാക്കന്മാർ’ എന്ന പദത്തിന് പിന്നാലെ സ്ഥാപിച്ചിരിക്കുന്നു.
