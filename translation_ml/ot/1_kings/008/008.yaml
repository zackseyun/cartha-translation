  source_fidelity: The draft accurately preserves the contrast between visibility from the Holy Place and invisibility from outside, and it retains the narrator-relative ‘to this day.’ However, וַיַּאֲרִכוּ is an active plural form (‘they extended/lengthened the poles’), not simply a description that the poles happened to be long. The Malayalam should retain that action.
