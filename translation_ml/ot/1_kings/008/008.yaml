  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: ml
  text: തണ്ടുകൾ നീട്ടിയതിനാൽ, അവയുടെ അറ്റങ്ങൾ അന്തർമന്ദിരത്തിന്റെ മുൻവശത്തുള്ള വിശുദ്ധസ്ഥലത്തുനിന്ന് കാണാമായിരുന്നു[a]; എന്നാൽ പുറത്തുനിന്ന് അവ കാണാനാകുമായിരുന്നില്ല. അവ ഇന്നുവരെ അവിടെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിവിശുദ്ധസ്ഥലത്തിന്റെ മുൻവശത്തുള്ള.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രുപദം ദേവാലയത്തിലെ അന്തർമന്ദിരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: അത്രയും നീളമുണ്ടായിരുന്നതിനാൽ
  rationale: തണ്ടുകളുടെ നീളമാണ് തുടർന്നുള്ള ദൃശ്യതയ്ക്ക് കാരണമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ഹീബ്രു ക്രിയയുടെ ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַבַּדִּים
  choice: തണ്ടുകൾ
  rationale: പെട്ടകം ചുമക്കാൻ ഉപയോഗിച്ച ദണ്ഡുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായ പദം.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: അവയുടെ അറ്റങ്ങൾ ... കാണാമായിരുന്നു
  rationale: רָאשֵׁי എന്നതിന്റെ അക്ഷരാർഥം ‘തലകൾ’ ആണെങ്കിലും തണ്ടുകളുടെ കാര്യത്തിൽ ‘അറ്റങ്ങൾ’ സ്വാഭാവികമാണ്. നിഫാൽ രൂപം ദൃശ്യമായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִן הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തുനിന്ന്
  rationale: അന്തർമന്ദിരത്തിൽനിന്ന് വേറിട്ട ദേവാലയത്തിന്റെ പുറത്തെ മുറിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സാങ്കേതിക വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: അന്തർമന്ദിരത്തിന്റെ മുമ്പിലുള്ള
  rationale: דְּבִיר പെട്ടകം സ്ഥാപിച്ച ദേവാലയത്തിലെ അകത്തെ വിശുദ്ധമുറിയാണ്; עַל־פְּנֵי എന്ന ബന്ധം ‘മുമ്പിലുള്ള’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: എന്നാൽ പുറത്തുനിന്ന് അവ കാണാനാകുമായിരുന്നില്ല
  rationale: വിശുദ്ധസ്ഥലത്തുനിന്നുള്ള ദൃശ്യതയും പുറത്തുനിന്നുള്ള അദൃശ്യതയും തമ്മിലുള്ള വിരോധം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: അവ ഇന്നുവരെ അവിടെയുണ്ട്
  rationale: കഥാകാരന്റെ കാലംവരെ തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പതിവ് ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: דְּבִיר എന്ന ദേവാലയപദത്തിന്റെ വിവർത്തനം
  choice: അന്തർമന്ദിരം
  alternative: അതിവിശുദ്ധസ്ഥലം
  rationale: മൂലപദം ദേവാലയത്തിലെ അകത്തെ മുറിയെ സൂചിപ്പിക്കുന്നു. ‘അന്തർമന്ദിരം’ സ്ഥലഘടന നേരിട്ട് അറിയിക്കുകയും ‘അതിവിശുദ്ധസ്ഥലം’ എന്ന വ്യാഖ്യാനപരമായ പകരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദേവാലയഘടനയിലെ ‘വിശുദ്ധസ്ഥലം’–‘അന്തർമന്ദിരം’ വ്യത്യാസം നിലനിർത്തിയിരിക്കുന്നു; വാക്യത്തിലെ ദൃശ്യതാസംബന്ധമായ സാധ്യതാഭാവം സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
