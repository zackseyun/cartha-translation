  terminology: ‘വിശുദ്ധസ്ഥലം’ and ‘അന്തർമന്ദിരം’ appropriately distinguish the outer holy room from the inner sanctuary. The footnote responsibly preserves ‘അതിവിശുദ്ധസ്ഥലം’ as an alternative designation without forcing it into the main text.
  issues:
