source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: ml
  text: ഈ സ്ഥലത്തിനു നേരെ[a] അവർ പ്രാർഥിക്കുമ്പോൾ, നിന്റെ ദാസന്റെയും നിന്റെ ജനമായ ഇസ്രായേലിന്റെയും യാചന കേൾക്കേണമേ. നിന്റെ വാസസ്ഥലമായ സ്വർഗത്തിൽ[b] കേൾക്കേണമേ; കേട്ട് ക്ഷമിക്കേണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ സ്ഥലത്തേക്ക്.’ എബ്രായ പ്രയോഗം ഇങ്ങനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ വിവർത്തനം ചെയ്യാം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദേവാലയത്തിന്റെ ദിശയിലേക്കുള്ള പ്രാർഥനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വർഗത്തിലുള്ള നിന്റെ വാസസ്ഥാനത്ത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: യാചന
  rationale: കരുണയോ അനുഗ്രഹമോ അഭ്യർഥിക്കുന്ന തീക്ഷ്ണമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും പ്രാർഥനയുടെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַבְדְּךָ
  choice: നിന്റെ ദാസൻ
  rationale: ദൈവത്തോടുള്ള വിനീതമായ സ്വയംവിശേഷണം എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; ഇവിടെ ‘അടിമ’ എന്നത് അനാവശ്യമായി സാമൂഹിക അർഥം മുൻനിർത്തും.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: നിന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി തിരിച്ചറിയുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִתְפַּלְלוּ
  choice: പ്രാർഥിക്കുമ്പോൾ
  rationale: פלל എന്ന ധാതുവിന്റെ ഹിത്പഅേൽ രൂപത്തിന് ഈ സന്ദർഭത്തിൽ സാധാരണവും വ്യക്തവുമായ തുല്യപദം.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ഈ സ്ഥലത്തിനു നേരെ
  rationale: പ്രാർഥന ദേവാലയത്തിന്റെ ദിശയിലേക്കാണെന്ന ആശയം, ആ സ്ഥലത്തോടുതന്നെ പ്രാർഥിക്കുന്നു എന്ന തെറ്റിദ്ധാരണ കൂടാതെ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: നിന്റെ വാസസ്ഥാനം
  rationale: എബ്രായ നിർമാണബന്ധവും ഉയർന്ന പ്രാർഥനാശൈലിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶל הַשָּׁמַיִם
  choice: സ്വർഗത്തിൽ
  rationale: אֶל എന്ന പദം അക്ഷരാർഥത്തിൽ ദിശ സൂചിപ്പിക്കാമെങ്കിലും, ‘കേൾക്കുക’ എന്നും ദൈവത്തിന്റെ വാസസ്ഥാനം എന്നും ചേർന്ന ഈ പ്രയോഗത്തിൽ സ്ഥാനാർഥമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְשָׁמַעְתָּ
  choice: കേൾക്കേണമേ / കേട്ട്
  rationale: വെറും ശബ്ദഗ്രഹണമല്ല, പ്രാർഥന ശ്രദ്ധിച്ചു പ്രതികരിക്കുന്നതും ഉൾക്കൊള്ളുന്നു; ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וְסָלָחְתָּ
  choice: ക്ഷമിക്കേണമേ
  rationale: ദൈവിക പാപക്ഷമയെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദേവാലയത്തിലേക്കു തിരിഞ്ഞുള്ള പ്രാർഥനയും സ്വർഗം ദൈവത്തിന്റെ വാസസ്ഥാനമെന്ന പ്രസ്താവനയും
  choice: പ്രാർഥന ‘ഈ സ്ഥലത്തിനു നേരെ’ ആണെന്നും ദൈവം കേൾക്കുന്നത് ‘നിന്റെ വാസസ്ഥാനമായ സ്വർഗത്തിൽ’ ആണെന്നും രണ്ടും നിലനിർത്തി.
  alternative: ‘ഈ ദേവാലയത്തിൽ പ്രാർഥിക്കുമ്പോൾ’ എന്നു മാറ്റുകയോ ‘സ്വർഗത്തിൽനിന്ന് കേൾക്കേണമേ’ എന്നു വിവർത്തനം ചെയ്യുകയോ ചെയ്യാം.
  rationale: ഭൗമിക ദേവാലയം പ്രാർഥനയുടെ ദിശാകേന്ദ്രമായിരിക്കുമ്പോഴും സ്വർഗം ദൈവത്തിന്റെ വാസസ്ഥാനമാണെന്ന മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള പ്രാർഥനാശൈലി സ്വീകരിച്ചു. ‘കേൾക്കേണമേ’, ‘ക്ഷമിക്കേണമേ’ എന്നീ രൂപങ്ങൾ അപേക്ഷാഭാവം നിലനിർത്തുന്നു; അനാവശ്യമായി പഴമയോ വിഭാഗീയ പദാവലിയോ ചേർത്തിട്ടില്ല.
