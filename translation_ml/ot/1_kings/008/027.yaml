  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: ml
  text: എന്നാൽ ദൈവം വാസ്തവമായും ഭൂമിയിൽ വസിക്കുമോ? ഇതാ, ആകാശങ്ങൾക്കും അത്യുന്നതമായ ആകാശങ്ങൾക്കും[a] അങ്ങയെ ഉൾക്കൊള്ളാനാവില്ല[b]; പിന്നെ ഞാൻ പണിത ഈ ആലയത്തിനോ[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ആകാശങ്ങളും ആകാശങ്ങളുടെ ആകാശവും”; അത്യുന്നതമായ ആകാശങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അങ്ങയെ ധരിക്കാനാവില്ല.”'
    reason: lexical_alternative
  - marker: c
    text: “ഈ ആലയം” എന്നു പറയുന്നത് ശലോമോൻ പണിത ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും ഇവിടെ വരുന്ന വിസ്മയഭരിതമായ ചിന്തയിലേക്കുള്ള തിരിവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ കാരണം വ്യക്തമാക്കുന്ന ‘കാരണം’ എന്നതിനെക്കാൾ വിരുദ്ധഭാവമുള്ള ബന്ധകം യോജിക്കുന്നു.
- source_word: הַאֻמְנָם
  choice: വാസ്തവമായി
  rationale: ചോദ്യത്തിലെ വിസ്മയവും ഗൗരവമുള്ള ഊന്നലും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֵשֵׁב
  choice: വസിക്കുമോ
  rationale: ദൈവസാന്നിധ്യവും ആലയസന്ദർഭവും പരിഗണിക്കുമ്പോൾ ‘ഇരിക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘വസിക്കുക’ പ്രസക്തമാണ്.
- source_word: עַל הָאָרֶץ
  choice: ഭൂമിയിൽ
  rationale: ആകാശത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: തുടർന്നുള്ള പ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു ഊന്നൽ മാന്യമായ ഭാഷയിൽ പകർത്തുന്നു.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ആകാശങ്ങൾക്കും ആകാശാധികാശത്തിനും
  rationale: ‘ആകാശങ്ങളും ആകാശങ്ങളുടെ ആകാശവും’ എന്ന ഹീബ്രു അതിശയോക്തിപരമായ ഘടനയുടെ രൂപവും ഉയർന്നതായ ആകാശമണ്ഡലം എന്ന അർഥവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: അങ്ങയെ ഉൾക്കൊള്ളാനാവില്ല
  rationale: സ്ഥലപരമായി ധരിക്കാനോ ഉൾക്കൊള്ളാനോ കഴിയാത്തതെന്ന ആശയം വ്യക്തമാക്കുന്നു; അഭിസംബോധനയുടെ മാന്യതയ്ക്കായി ‘അങ്ങയെ’ ഉപയോഗിക്കുന്നു.
- source_word: אַף כִּי
  choice: അപ്പോൾ … എത്രയോ കുറച്ച് മാത്രം
  rationale: വലിയതിനു കഴിയുന്നില്ലെങ്കിൽ ചെറുതിനു അതിലും കഴിയില്ല എന്ന a fortiori യുക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַבַּיִת הַזֶּה
  choice: ഈ ആലയം
  rationale: സന്ദർഭത്തിൽ ‘വീട്’ എന്നത് ശലോമോൻ പണിത ദേവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആലയം’ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതും അനാവശ്യ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: ഞാൻ പണിത
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ അതീതതയും ആലയത്തിലെ സാന്നിധ്യവും
  choice: ദൈവം ഭൂമിയിൽ വസിക്കുന്നതിനെക്കുറിച്ചുള്ള വിസ്മയഭരിതമായ ചോദ്യം നിലനിർത്തുകയും ആകാശങ്ങൾക്കുപോലും ദൈവത്തെ ഉൾക്കൊള്ളാനാവില്ലെന്ന് പ്രഖ്യാപിക്കുകയും ചെയ്തു.
  alternative: ദൈവം ഭൂമിയിൽ ഒരുവിധത്തിലും വസിക്കുന്നില്ലെന്ന സമതല പ്രസ്താവനയാക്കുക, അല്ലെങ്കിൽ ആലയം ദൈവത്തെ സ്ഥലപരമായി ഉൾക്കൊള്ളുന്നു എന്നു സൂചിപ്പിക്കുക.
  rationale: മൂലപാഠം ദൈവത്തിന്റെ യഥാർഥ ആലയസാന്നിധ്യവും സൃഷ്ടിക്കപ്പെട്ട ഒരു സ്ഥലത്തിനും അവനെ പരിമിതപ്പെടുത്താനാവില്ലെന്ന അതീതതയും തമ്മിലുള്ള സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ച മാന്യവും ഗൗരവമുള്ളതുമായ മലയാളം. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ രൂപം സ്വീകരിച്ചു. ഹീബ്രു വാക്യത്തിന്റെ ചോദ്യം, ഊന്നൽ, ചെറുതിലേക്കുള്ള ശക്തമായ താരതമ്യയുക്തി എന്നിവ സംരക്ഷിച്ചു.
