  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: ml
  text: തങ്ങളെ തടവുകാരാക്കി കൊണ്ടുപോയ ശത്രുക്കളുടെ ദേശത്തുവെച്ച് അവർ പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ അങ്ങയിലേക്കു മടങ്ങിവന്ന്[a], അങ്ങ് അവരുടെ പിതാക്കന്മാർക്കു നൽകിയ അവരുടെ ദേശത്തിന്റെയും അങ്ങ് തിരഞ്ഞെടുത്ത നഗരത്തിന്റെയും അങ്ങയുടെ നാമത്തിനായി ഞാൻ പണിത ഭവനത്തിന്റെയും[c] ദിശയിലേക്കു തിരിഞ്ഞ്[b] അങ്ങയോടു പ്രാർഥിച്ചാൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയിലേക്കു തിരിഞ്ഞുവന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗത്തിന് മാനസാന്തരത്തിന്റെ അർഥവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവരുടെ ദേശത്തെ അഭിമുഖീകരിച്ച്.’ എബ്രായപ്രയോഗം അവരുടെ ദേശത്തിന്റെ ദിശയിലേക്കു തിരിഞ്ഞുള്ള പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, അങ്ങയുടെ നാമത്തിനായി സമർപ്പിക്കപ്പെട്ട ഭവനം—ദൈവാലയം.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: അങ്ങയിലേക്കു മടങ്ങിവന്ന്
  rationale: שׁוּב എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘മടങ്ങിവരുക/തിരിയുക’ എന്ന അർഥവും ദൈവത്തോടുള്ള ബന്ധപരമായ ദിശയും നിലനിർത്തുന്നു; മാനസാന്തരം എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും മുഖ്യപാഠത്തിൽ അതു മാത്രം നിർബന്ധിക്കുന്നില്ല.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: പൂർണഹൃദയത്തോടും പൂർണാത്മാവോടുംകൂടെ
  rationale: സമ്പൂർണ സമർപ്പണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ദ്വയപ്രയോഗത്തിലെ ‘ഹൃദയം’, ‘ആത്മാവ്’ എന്നീ പ്രതിച്ഛായകൾ സംരക്ഷിക്കുന്നു.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: തങ്ങളെ തടവുകാരാക്കി കൊണ്ടുപോയ ശത്രുക്കളുടെ ദേശത്തുവെച്ച്
  rationale: שׁבה എന്നതിലെ ബലമായ പിടിച്ചുകൊണ്ടുപോകലും പ്രവാസസന്ദർഭവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: דֶּרֶךְ אַרְצָם
  choice: അവരുടെ ദേശത്തിന്റെയും ... ദിശയിലേക്കു തിരിഞ്ഞ്
  rationale: דֶּרֶךְ ഇവിടെ പ്രാർഥനയുടെ ഭൗതിക ദിശയെ സൂചിപ്പിക്കുന്നു. നഗരം, ഭവനം എന്നിവ ദേശത്തെ കൂടുതൽ കൃത്യമായി നിർദേശിക്കുന്ന സമാന്തര ഘടകങ്ങളായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: അങ്ങ് അവരുടെ പിതാക്കന്മാർക്കു നൽകിയ
  rationale: പിതൃക്കന്മാരോടുള്ള ഉടമ്പടിസംബന്ധമായ ചരിത്രസൂചനയെ ‘പിതാക്കന്മാർ’ എന്ന പദം വഴി നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: അങ്ങ് തിരഞ്ഞെടുത്ത നഗരം
  rationale: ദൈവിക തിരഞ്ഞെടുപ്പിനെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ ലളിതമായി പകരുന്നു.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: അങ്ങയുടെ നാമത്തിനായി ഞാൻ പണിത ഭവനം
  rationale: בַּיִת എന്നതിന്റെ ‘ഭവനം’ എന്ന രൂപകവും בנית എന്ന വ്യഞ്ജനപാഠം സന്ദർഭത്തിൽ നൽകുന്ന ഒന്നാംപുരുഷ ഏകവചനമായ ‘ഞാൻ പണിത’ എന്ന വായനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: וְשָׁבוּ אֵלֶיךָ എന്ന ഉടമ്പടിപരമായ മടങ്ങിവരവിന്റെ സ്വഭാവം
  choice: അങ്ങയിലേക്കു മടങ്ങിവന്ന്
  alternative: അങ്ങയുടെ മുമ്പിൽ മാനസാന്തരപ്പെട്ട്
  rationale: സന്ദർഭം മാനസാന്തരത്തെ ഉൾക്കൊള്ളുന്നുവെങ്കിലും എബ്രായപദം ബന്ധപരവും ദിശാസൂചകവുമായ ‘മടങ്ങിവരുക’ എന്ന ആശയം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; അതിനാൽ അർഥത്തിന്റെ വ്യാപ്തി ചുരുക്കുന്നില്ല.
- issue: בנित എന്ന രൂപത്തിലെ കർത്താവ്
  choice: 'ഒന്നാംപുരുഷ ഏകവചനം: ‘ഞാൻ പണിത’'
  alternative: ‘പണിയപ്പെട്ട’ അല്ലെങ്കിൽ ‘അവർ പണിത’
  rationale: മസോററ്റിക് വ്യഞ്ജനപാഠവും ശലോമോന്റെ പ്രാർഥനാസന്ദർഭവും ഒന്നാംപുരുഷ വായനയെ സ്വാഭാവികമായി പിന്തുണയ്ക്കുന്നു.
- issue: ‘അങ്ങയുടെ നാമത്തിനായി’ എന്ന പ്രയോഗം
  choice: മൂലപാഠത്തിലെ നാമസംബന്ധമായ ഭാഷ നേരിട്ട് നിലനിർത്തി
  alternative: ‘അങ്ങേക്കായി സമർപ്പിച്ച’
  rationale: ലִשְׁמֶךָ എന്ന ഉടമ്പടിപരവും ദൈവസാന്നിധ്യസംബന്ധവുമായ പ്രയോഗത്തെ ഒരു വ്യാഖ്യാനത്തിൽ മാത്രം ഒതുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ചതുമായ ശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വ്യവസ്ഥാവാക്യത്തിന്റെ തുടർച്ച കാണിക്കാൻ വാക്യം ‘പ്രാർഥിച്ചാൽ’ എന്ന വ്യവസ്ഥാരൂപത്തിലും അവസാനത്തിൽ അൽപവിരാമത്തോടെയും നൽകിയിരിക്കുന്നു.
