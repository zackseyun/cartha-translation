  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: ml
  text: നമ്മുടെ ദൈവമായ യാഹ്‌വെ, നമ്മുടെ പിതാക്കന്മാരോടുകൂടെ ഉണ്ടായിരുന്നതുപോലെ, നമ്മോടുകൂടെയും ഉണ്ടായിരിക്കട്ടെ. അവൻ നമ്മെ കൈവിടുകയോ ഉപേക്ഷിക്കുകയോ ചെയ്യാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: היה എന്ന ക്രിയയുടെ ജൂസീവ് രൂപം പ്രാർഥനാപൂർവമായ ആശംസയെ സൂചിപ്പിക്കുന്നു; ‘ഉണ്ടായിരിക്കട്ടെ’ അതിന്റെ ഇച്ഛാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രത്യയമുള്ള രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം.
- source_word: עִמָּנוּ
  choice: നമ്മോടുകൂടെയും
  rationale: עם ഇവിടെ സാന്നിധ്യവും സഹവാസവും സൂചിപ്പിക്കുന്നു; താരതമ്യവാക്യത്തിലെ ഊന്നൽ സ്വാഭാവികമാക്കാൻ ‘-യും’ ചേർത്തിരിക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: ഉണ്ടായിരുന്നതുപോലെ
  rationale: മുൻതലമുറകളോടുള്ള ദൈവസാന്നിധ്യത്തെ ഇപ്പോഴത്തെ അപേക്ഷയുമായി താരതമ്യം ചെയ്യുന്ന ബന്ധം വ്യക്തമായി പകരുന്നു.
- source_word: אֲבֹתֵינוּ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനപദത്തെ ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ മുൻപിതാക്കളെ സൂചിപ്പിക്കുന്നു.
- source_word: אַל יַעַזְבֵנוּ
  choice: അവൻ നമ്മെ കൈവിടുകയോ
  rationale: עזב സൂചിപ്പിക്കുന്ന ബന്ധപരമായ വിട്ടുകളയൽ ‘കൈവിടുക’ എന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗത്തിൽ പകരുന്നു.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: ഉപേക്ഷിക്കുകയോ ചെയ്യാതിരിക്കട്ടെ
  rationale: נטש എന്ന രണ്ടാമത്തെ സമാന്തരക്രിയയെ ആദ്യത്തേതുമായി പൂർണമായി ഒറ്റപ്പെടുത്താതെ, ഉപേക്ഷിച്ചുകളയുന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തെ ആധാരമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- issue: אֲבֹתֵינוּ എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന രൂപം നിലനിർത്തിയെങ്കിലും അത് ഇസ്രായേലിന്റെ മുൻതലമുറകളെ പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘ഉണ്ടായിരിക്കട്ടെ’, ‘ചെയ്യാതിരിക്കട്ടെ’ എന്നീ രൂപങ്ങൾ എബ്രായ ജൂസീവുകളുടെ അപേക്ഷാഭാവം നിലനിർത്തുന്നു; സമാന്തരമായ രണ്ടു നിഷേധക്രിയകൾ ‘കൈവിടുക’, ‘ഉപേക്ഷിക്കുക’ എന്നിങ്ങനെ വേർതിരിച്ചു.
