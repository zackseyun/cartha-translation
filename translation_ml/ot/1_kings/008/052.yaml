source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: ml
  text: അങ്ങയുടെ ദാസന്റെ യാചനയിലേക്കും അങ്ങയുടെ ജനമായ ഇസ്രായേലിന്റെ യാചനയിലേക്കും[a] അങ്ങയുടെ കണ്ണുകൾ തുറന്നിരിക്കണമേ; അവർ അങ്ങയോടു വിളിച്ചപേക്ഷിക്കുമ്പോഴെല്ലാം അവർക്കു ചെവികൊടുക്കണമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാചന’ എന്നതിന് ‘കരുണയ്ക്കായുള്ള അപേക്ഷ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം അനുകൂലതയോ കരുണയോ തേടിയുള്ള ആത്മാർഥമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർക്കു ചെവികൊടുക്കണമേ’ എന്നതിന് ‘അവരെ കേൾക്കണമേ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് ‘കേൾക്കുക,’ ‘ശ്രദ്ധിച്ചു കേൾക്കുക,’ ‘ചെവിക്കൊള്ളുക’ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: തുറന്നിരിക്കണമേ
  rationale: ലാമെദ് ചേർന്ന infinitive മുൻസന്ദർഭത്തിലെ ശലോമോന്റെ അപേക്ഷ തുടരുന്നു. മലയാളത്തിൽ പ്രാർഥനാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ വിധ്യർഥരൂപം ഉപയോഗിച്ചു.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: അങ്ങയുടെ കണ്ണുകൾ തുറന്നിരിക്കണമേ
  rationale: ദൈവത്തിന്റെ ശ്രദ്ധാപൂർവമായ അനുകൂലതയെ സൂചിപ്പിക്കുന്ന മാനവരൂപകത്തെ പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: תְּחִנַּת
  choice: യാചന
  rationale: കരുണയോ അനുകൂലതയോ തേടിയുള്ള ആത്മാർഥമായ അപേക്ഷയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘യാചന’ ആ ഗൗരവവും തീവ്രതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: עַבְדְּךָ
  choice: അങ്ങയുടെ ദാസൻ
  rationale: ഇവിടെ ശലോമോൻ ദൈവസന്നിധിയിൽ സ്വയം വിശേഷിപ്പിക്കുന്ന പ്രാർഥനാഭാഷയാണ്; അതിനാൽ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: അങ്ങയുടെ ജനമായ ഇസ്രായേൽ
  rationale: ഇസ്രായേലിനെ ദൈവത്തിന്റെ ജനമായി തിരിച്ചറിയിക്കുന്ന ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: അവരുടെ അപേക്ഷ കേൾക്കണമേ
  rationale: ശמע എന്നതിന് കേൾക്കുക, ശ്രദ്ധിക്കുക, ചെവിക്കൊള്ളുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രാർഥനാസന്ദർഭത്തിൽ പ്രതികരണസന്നദ്ധമായ കേൾവിയെ ‘അപേക്ഷ കേൾക്കുക’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: അവർ അങ്ങയോടു വിളിച്ചപേക്ഷിക്കുമ്പോഴെല്ലാം
  rationale: בְּכֹל ഘടന ആവർത്തിക്കുന്ന സമയത്തെ, ‘എപ്പോഴൊക്കെയോ/എപ്പോഴെല്ലാമോ’, സൂചിപ്പിക്കുന്നു; קראയുടെ പ്രാർഥനാസന്ദർഭം ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: 'ദൈവത്തെക്കുറിച്ചുള്ള മാനവരൂപക ഭാഷ: ‘അങ്ങയുടെ കണ്ണുകൾ തുറന്നിരിക്കണമേ’'
  choice: മാനവരൂപകത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘അങ്ങ് ശ്രദ്ധിക്കണമേ’ എന്ന് പരാവർത്തനം ചെയ്യുക
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ ശ്രദ്ധയെ കണ്ണുകൾ തുറന്നിരിക്കുന്നതായി ചിത്രീകരിക്കുന്നു. ഈ സാഹിത്യ-ദൈവശാസ്ത്ര രൂപകം ദൈവത്തിന് ഭൗതികശരീരമുണ്ടെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതെ തന്നെ സംരക്ഷിക്കാം.
- issue: לִשְׁמֹעַ אֲלֵיהֶם എന്നതിലെ കേൾവിയുടെ സ്വഭാവം
  choice: ‘അവരുടെ അപേക്ഷ കേൾക്കണമേ’
  alternative: ‘അവരെ ചെവിക്കൊള്ളണമേ’
  rationale: മൂലക്രിയ വെറും ശബ്ദഗ്രഹണത്തെയും ശ്രദ്ധാപൂർവമായ കേൾവിയെയും ചെവിക്കൊള്ളലിനെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠം സ്വാഭാവികമായ മലയാളം ഉപയോഗിക്കുന്നു; കൂടുതൽ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനോചിതവുമായ ശൈലി. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ മാനവരൂപകം നിലനിർത്തുകയും, സങ്കീർണമായ വാക്യഘടന അർധവിരാമത്തിലൂടെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിക്കുകയും ചെയ്തു.
