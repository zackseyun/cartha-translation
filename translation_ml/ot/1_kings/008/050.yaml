source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: ml
  text: നിന്നോടു പാപം ചെയ്ത നിന്റെ ജനത്തോടും, നിനക്കെതിരെ അവർ ചെയ്ത സകല ലംഘനങ്ങളോടും[a] ക്ഷമിക്കണമേ. അവരെ പിടിച്ചുകൊണ്ടുപോയവരുടെ മുമ്പിൽ അവർക്ക് കരുണ ലഭിക്കുമാറാക്കണമേ; അങ്ങനെ അവരെ പിടിച്ചുകൊണ്ടുപോയവർ അവരോടു കരുണ കാണിക്കട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലംഘനങ്ങൾ” എന്നതിന് “കലാപങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പദം ദൈവത്തിനെതിരായ ധിക്കാരപരമായ ലംഘനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരെ പിടിച്ചുകൊണ്ടുപോയവർ അവരോടു കരുണ കാണിക്കും.” അവസാന വാക്യം ഉദ്ദേശ്യമായും ഫലമായും വായിക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: ക്ഷമിക്കണമേ
  rationale: പ്രാർഥനയുടെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ അപേക്ഷയുടെ അർഥത്തിലാണ്; ആ ഭാവം സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְעַמְּךָ אֲשֶׁר חָטְאוּ לָךְ
  choice: നിന്നോടു പാപം ചെയ്ത നിന്റെ ജനത്തോട്
  rationale: לָךְ സൂചിപ്പിക്കുന്ന ദൈവത്തിനെതിരായ പാപം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്നോടു പാപം ചെയ്ത’ എന്നു നൽകി.
- source_word: וּלְכָל פִּשְׁעֵיהֶם אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: നിനക്കെതിരെ അവർ ചെയ്ത സകല അതിക്രമങ്ങളോട്
  rationale: പשע എന്ന നാമത്തിന്റെയും ക്രിയയുടെയും ആവർത്തനം അസ്വാഭാവികമാക്കാതെ, ദൈവത്തിനെതിരായ ലംഘനത്തിന്റെ ഗൗരവം ‘അതിക്രമങ്ങൾ’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: അവർക്ക് കരുണ ലഭിക്കുമാറാക്കണമേ
  rationale: ദൈവം അവരെ മറ്റുള്ളവരുടെ കരുണ ലഭിക്കുന്ന നിലയിൽ ആക്കണമെന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: അവരെ പിടിച്ചുകൊണ്ടുപോയവരുടെ മുമ്പിൽ
  rationale: שֹׁבֵיהֶם എന്നത് അവരെ തടവുകാരാക്കി കൊണ്ടുപോയവരെ സൂചിപ്പിക്കുന്നു; ‘മുമ്പിൽ’ എന്നത് לִפְנֵיയുടെ ബന്ധാർഥം നിലനിർത്തുന്നു.
- source_word: וְרִחֲמוּם
  choice: അവരെ പിടിച്ചുകൊണ്ടുപോയവർ അവരോടു കരുണ കാണിക്കട്ടെ
  rationale: ക്രിയയുടെ കർത്താവ് മുൻപറഞ്ഞ പിടിച്ചുകൊണ്ടുപോയവരാണെന്നത് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; רחמים/רחם എന്ന പദാവർത്തനം ‘കരുണ’ ആവർത്തിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ക്ഷമയും പിടിച്ചുകൊണ്ടുപോയവരുടെ കരുണയും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവം ജനത്തെ ക്ഷമിക്കുകയും അവരെ പിടിച്ചുകൊണ്ടുപോയവർ അവരോടു കരുണ കാണിക്കുന്ന സാഹചര്യം ഉണ്ടാക്കുകയും ചെയ്യണമെന്ന പ്രാർഥനയായി വിവർത്തനം ചെയ്തു.
  alternative: അവസാന വാക്യം ഉദ്ദേശ്യത്തിനു പകരം ഫലമായി, ‘അവർ അവരോടു കരുണ കാണിക്കും’ എന്നും വായിക്കാം.
  rationale: എബ്രായ വാക്യക്രമം ഉദ്ദേശ്യത്തെയും ഫലത്തെയും അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ പ്രാർഥനാഭാവം നിലനിർത്തുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പ്രാർഥനയ്ക്ക് യോജിച്ച മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘ക്ഷമിക്കണമേ,’ ‘ലഭിക്കുമാറാക്കണമേ’ എന്നീ രൂപങ്ങൾ അപേക്ഷാഭാവം വ്യക്തമാക്കുന്നു. സർവനാമങ്ങളുടെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ അവസാന ഭാഗത്ത് പിടിച്ചുകൊണ്ടുപോയവരെ വീണ്ടും വ്യക്തമായി പരാമർശിച്ചു.
