base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: ml
  text: ശലോമോൻ ഈ പ്രാർഥനയും കൃപയ്ക്കായുള്ള യാചനയും മുഴുവൻ സഹിതം യഹ്‌വെയോടു പ്രാർഥിച്ചുതീർന്നപ്പോൾ, യഹ്‌വെയുടെ യാഗപീഠത്തിന്റെ മുമ്പിൽ മുട്ടുകുത്തി, കൈപ്പത്തികൾ ആകാശത്തേക്ക് വിരിച്ചുപിടിച്ചിരുന്ന നിലയിൽനിന്ന് അവൻ എഴുന്നേറ്റു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'എബ്രായവാക്യം ശരീരനില വിശദമായി വിവരിക്കുന്നു: അവൻ മുട്ടുകുത്തിയിരുന്നു; അവന്റെ കൈപ്പത്തികൾ ആകാശത്തേക്ക് വിരിച്ചിരുന്നതുമായിരുന്നു.'
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: …തീർന്നപ്പോൾ
  rationale: כְּ + infinitive construct നൽകുന്ന കാലസംബന്ധിയായ ഉപവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ ചുരുക്കിയും വ്യക്തമായും അവതരിപ്പിക്കുന്നു; ‘സംഭവിച്ചു’ എന്ന ഘടകം പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: לְהִתְפַּלֵּל
  choice: പ്രാർഥിച്ചുതീർന്നപ്പോൾ
  rationale: כַּלּוֹת എന്ന ‘പൂർത്തിയാക്കുക’ എന്ന ആശയത്തോടൊപ്പം മലയാളത്തിലെ സംയുക്തക്രിയ മൂലത്തിന്റെ അർഥവും പ്രവൃത്തിയുടെ പൂർത്തീകരണവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: ഈ പ്രാർഥനയും കൃപയ്ക്കായുള്ള യാചനയും മുഴുവനായി
  rationale: תְּפִלָּה എന്ന പൊതുവായ ‘പ്രാർഥന’യും תְּחִנָּה സൂചിപ്പിക്കുന്ന കൃപയോ അനുഗ്രഹമോ തേടിയുള്ള തീവ്രമായ അപേക്ഷയും വേർതിരിച്ചു നിലനിർത്തുന്നു; כָּל എന്ന സമഗ്രതയും ‘മുഴുവനായി’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: യഹ്‌വെയുടെ യാഗപീഠത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: לִפְנֵיയുടെ സ്ഥലസംബന്ധിയായ ‘മുമ്പിൽ’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: മുട്ടുകുത്തി … ഇരുന്ന നിലയിൽനിന്ന്
  rationale: മലയാളത്തിലെ ‘മുട്ടുകുത്തുക’ എന്ന സ്വാഭാവിക പ്രയോഗം ശരീരനില വ്യക്തമായി അറിയിക്കുന്നു; ‘തന്റെ മുട്ടുകളിന്മേൽ’ എന്ന അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: കൈപ്പത്തികൾ ആകാശത്തേക്ക് വിരിച്ചുപിടിച്ചിരുന്ന
  rationale: כַּף എന്ന പദത്തിന്റെ ‘കൈപ്പത്തി’ എന്ന കൃത്യമായ ശരീരഭാഗസൂചനയും പ്രാർഥനയിലെ ദിശാഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ പേരിനെ ലിപ്യന്തരിച്ചു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം Yahweh-നോട് അടുത്ത ‘യഹ്‌വെ’ സ്വീകരിച്ചു.
- issue: תְּחִנָּהയുടെ അർഥനിറം
  choice: കൃപയ്ക്കായുള്ള യാചന
  alternative: അപേക്ഷ / പ്രാർഥന
  rationale: ഈ പദം ഒരു സാധാരണ അഭ്യർഥന മാത്രമല്ല, കൃപയോ അനുകൂലതയോ തേടിയുള്ള വിനീതവും തീവ്രവുമായ അപേക്ഷയാണെന്ന അർഥനിറം നിലനിർത്തുന്നു; ദൈവശാസ്ത്രപരമായ പ്രത്യേക സാങ്കേതിക അർഥം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ ഒറ്റ വാക്യഘടന നിലനിർത്തിയെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു. ‘പ്രാർഥന’ എന്ന ആധുനിക അക്ഷരരൂപവും ‘കൈപ്പത്തികൾ’ എന്ന കൃത്യമായ പദവും ഉപയോഗിച്ചു.
