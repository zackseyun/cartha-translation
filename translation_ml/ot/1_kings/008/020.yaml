id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: ml
  text: യഹ്‌വെ താൻ അരുളിച്ചെയ്ത വചനം നിവർത്തിച്ചിരിക്കുന്നു[a]. ഞാൻ എന്റെ പിതാവായ ദാവീദിന്റെ സ്ഥാനമേറ്റു, യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നു. ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വെയുടെ നാമത്തിനായി ഞാൻ ഈ ഭവനം[b] പണിതിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ വചനം ഉറപ്പിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘തന്റെ വചനം നടപ്പാക്കിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഭവനം’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദേവാലയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: നിവർത്തിച്ചിരിക്കുന്നു
  rationale: הקים എന്ന ഹിഫീൽ ക്രിയ ‘വചനം’ എന്ന കർമത്തോടൊപ്പം ഇവിടെ പറഞ്ഞതു യാഥാർഥ്യമാക്കി എന്ന അർഥം നൽകുന്നു. ‘നിവർത്തിച്ചിരിക്കുന്നു’ വാഗ്ദത്തത്തിന്റെ പൂർത്തീകരണവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ ശബ്ദലിപ്യന്തരണം ചെയ്തു.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: താൻ അരുളിച്ചെയ്ത വചനം
  rationale: ‘വാഗ്ദാനം’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, മൂലത്തിലെ ‘വചനം/സംസാരിക്കുക’ എന്ന ആവർത്തനത്തിന്റെ ആശയം നിലനിർത്തുന്നു. ദൈവത്തിന്റെ സംസാരത്തിന് യോജിച്ച dignified മലയാളമായി ‘അരുളിച്ചെയ്ത’ ഉപയോഗിച്ചു.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: ഞാൻ എന്റെ പിതാവായ ദാവീദിന്റെ സ്ഥാനമേറ്റു
  rationale: അക്ഷരാർഥത്തിലെ ‘എഴുന്നേറ്റു’ ഇവിടെ ദാവീദിന്റെ രാജകീയ പിൻഗാമിയായി അവന്റെ സ്ഥാനം ഏറ്റതിനെ സൂചിപ്പിക്കുന്നു. തെറ്റായി ശാരീരികമായി എഴുന്നേൽക്കുന്നതായി തോന്നാതിരിക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നു
  rationale: സിംഹാസനത്തിൽ ഇരിക്കുക എന്ന രാജകീയ ദൃശ്യവും സോളമോന്റെ ഇപ്പോഴത്തെ ഭരണസ്ഥാനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: യഹ്‌വെ അരുളിച്ചെയ്തതുപോലെ
  rationale: മൂലത്തിലെ דבר എന്ന സംസാരക്രിയയുടെ ആവർത്തനം കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു; ‘വാഗ്ദാനം ചെയ്തതുപോലെ’ എന്ന് ആശയം മാത്രം വ്യക്തമാക്കുന്ന വ്യാഖ്യാനം ഒഴിവാക്കി.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: ഞാൻ ഈ ഭവനം പണിതിരിക്കുന്നു
  rationale: הַבַּיִת എന്നത് അക്ഷരാർഥത്തിൽ ‘ആ ഭവനം/ഭവനം’ എന്നാണ്; സന്ദർഭത്തിൽ ദേവാലയമാണ്. ‘ഈ ഭവനം’ പ്രസംഗസന്ദർഭത്തിലെ നിർദിഷ്ട കെട്ടിടത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְשֵׁם יְהוָה
  choice: യഹ്‌വെയുടെ നാമത്തിനായി
  rationale: ‘നാമത്തിനായി’ എന്ന പ്രധാന ബൈബിൾ പ്രയോഗം ‘ബഹുമാനാർഥം’ എന്ന പരിമിത വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവമായ
  rationale: യഹ്‌വെയെ വിശദീകരിക്കുന്ന നിയമബന്ധപരമായ വിശേഷണം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ കൊണ്ട് പകരാതെ അതിനെ ശബ്ദലിപ്യന്തരണം ചെയ്തു. ‘യഹ്‌വെ’ നിലവിലെ പണ്ഡിതസമ്മത ഉച്ചാരണത്തെ മലയാളത്തിൽ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു.
- issue: הַבַּיִת എന്നതിനെ ‘ഭവനം’ എന്നോ ‘ദേവാലയം’ എന്നോ നൽകൽ
  choice: ഭവനം
  alternative: ദേവാലയം
  rationale: സന്ദർഭത്തിലെ സൂചിതവസ്തു ദേവാലയമാണെങ്കിലും, മൂലത്തിലെ ‘ഭവനം’ എന്ന പദവും ദൈവത്തിന്റെ ഭവനം എന്ന ആശയബന്ധവും മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; വ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് നൽകി.
- issue: קום ക്രിയയുടെ ആവർത്തനം മലയാളത്തിൽ എങ്ങനെ കൈകാര്യം ചെയ്യണം
  choice: ആദ്യത്തേത് ‘നിവർത്തിച്ചിരിക്കുന്നു’; രണ്ടാമത്തേത് ‘സ്ഥാനമേറ്റു’
  alternative: ‘സ്ഥാപിച്ചിരിക്കുന്നു’; ‘എഴുന്നേറ്റിരിക്കുന്നു’
  rationale: എബ്രായത്തിൽ ഒരേ ധാതുവിന്റെ ആവർത്തനം ഉണ്ടായിട്ടും രണ്ടു സന്ദർഭങ്ങളിലും വ്യത്യസ്ത അർഥപ്രയോഗങ്ങളാണ്. മലയാളത്തിൽ ഒരേ പദം നിർബന്ധിച്ച് ഉപയോഗിച്ചാൽ അർഥം അവ്യക്തമാകുന്നതിനാൽ ഓരോ പ്രസംഗസന്ദർഭത്തിനും യോജിച്ച രൂപം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തിന്റെ സംസാരത്തിന് ‘അരുളിച്ചെയ്യുക’ ഉപയോഗിച്ചെങ്കിലും അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി. രാജവംശീയ പിൻഗാമിത്വം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ലഭിക്കാൻ ‘സ്ഥാനമേറ്റു’ എന്ന് നൽകി.
