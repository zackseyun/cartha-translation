source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: ml
  text: 'ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദിനോട് അങ്ങ് അരുളിച്ചെയ്തത് പാലിക്കണമേ. അങ്ങ് അവനോട് ഇങ്ങനെ അരുളിച്ചെയ്തു: “നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി സൂക്ഷിക്കുകയും, നീ എന്റെ സന്നിധിയിൽ നടന്നതുപോലെ അവർ എന്റെ സന്നിധിയിൽ നടക്കുകയും ചെയ്താൽ മാത്രം, ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ എന്റെ സന്നിധിയിൽ നിനക്കു ഒരു പുരുഷൻ ഇല്ലാതെ വരുകയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്റെ സന്നിധിയിൽനിന്ന് നിനക്കായി ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്ന ഒരു പുരുഷൻ ഛേദിക്കപ്പെടുകയില്ല.”'
    reason: לֹא יִכָּרֵת എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഛേദിക്കപ്പെടുകയില്ല’ എന്ന രൂപവും വംശതുടർച്ച സൂചിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക മുഖ്യവാചകവും തമ്മിലുള്ള വ്യത്യാസം രേഖപ്പെടുത്തുന്നു; יֹשֵׁב (‘ഇരിക്കുന്ന’) എന്നത് אִישׁ (‘പുരുഷൻ’) എന്നതോടുള്ള ബന്ധത്തിലും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, അതിന്റെ സാധാരണ പണ്ഡിതലിപ്യന്തരണമായ ‘യഹ്‌വേ’ എന്നു നൽകി.
- source_word: שְׁמֹר
  choice: പാലിക്കണമേ
  rationale: വാഗ്ദാനം കർമമായി വരുന്ന ഈ പ്രാർഥനാസന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ‘കാത്തുസൂക്ഷിക്കുക’ എന്നതിനേക്കാൾ സ്വാഭാവികമായി ‘നിറവേറ്റുക/പാലിക്കുക’ എന്ന അർഥമാണ്; ‘പാലിക്കണമേ’ വാഗ്ദാനത്തോടുള്ള ബന്ധവും അപേക്ഷാഭാവവും നിലനിർത്തുന്നു.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദ്
  rationale: עבד എന്നത് ഇവിടെ ദൈവത്തോടുള്ള ഉടമ്പടിപരമായ വിനയവും സേവകബന്ധവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ സ്വാഭാവിക നാമക്രമം ഉപയോഗിച്ചു.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: അങ്ങ് അവനോട് അരുളിച്ചെയ്തത്
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ ‘അരുളിച്ചെയ്തത്’ എന്നു നൽകി; ‘വാഗ്ദാനം ചെയ്തത്’ എന്നു വ്യാഖ്യാനിച്ച് മൂലത്തിലെ പൊതുവായ ‘പറഞ്ഞത്’ എന്ന ആശയം ചുരുക്കിയില്ല.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: എന്റെ സന്നിധിയിൽ നിനക്ക് ഒരു പുരുഷൻ ഇല്ലാതെ വരുകയില്ല
  rationale: വംശപരമ്പര തുടരുമെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകി; ‘പുരുഷൻ’ ഉപയോഗിച്ച് אִישׁ എന്ന പദത്തിന്റെ വ്യക്തമായ ഘടകവും നിലനിർത്തി. കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ
  rationale: ഹീബ്രു കർത്തൃവാചക കൃദന്തരൂപത്തിന്റെ ലക്ഷ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; രാജകീയ പിൻഗാമിത്വം വ്യക്തമാകുന്നു.
- source_word: רַק אִם
  choice: നടന്നാൽ മാത്രം
  rationale: വാഗ്ദാനത്തോടു ചേർന്ന ശക്തമായ വ്യവസ്ഥ ‘എങ്കിൽ മാത്രം’ എന്ന ആശയത്തോടെ സംരക്ഷിച്ചു.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി സൂക്ഷിച്ച്
  rationale: ‘വഴി’ എന്ന ഹീബ്രു ജീവിതനടപ്പിന്റെ രൂപകം നിലനിർത്തുകയും שׁמר എന്ന ക്രിയയെ ‘സൂക്ഷിക്കുക’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: לָלֶכֶת לְפָנַי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: നീ എന്റെ സന്നിധിയിൽ നടന്നതുപോലെ എന്റെ സന്നിധിയിൽ നടന്നാൽ
  rationale: ദൈവസന്നിധിയിലെ ‘നടപ്പ്’ എന്ന ധാർമിക-ബന്ധപരമായ രൂപകം ആവർത്തനത്തോടുകൂടി സംരക്ഷിച്ചു; മലയാളത്തിൽ വ്യവസ്ഥയുമായുള്ള ബന്ധം വ്യക്തമായി.
theological_decisions:
- issue: ദാവീദിനോടുള്ള വാഗ്ദാനത്തിന്റെ വ്യവസ്ഥാബദ്ധത
  choice: രാജവംശത്തിന്റെ തുടർച്ചയെ ദാവീദിന്റെ പുത്രന്മാരുടെ നടപ്പിനോടു വ്യക്തമായി വ്യവസ്ഥപ്പെടുത്തി.
  alternative: വാഗ്ദാനം പൂർണമായും നിരുപാധികമാണെന്നും വ്യവസ്ഥ അതിന്റെ അനുഭവപരമായ ഫലത്തിനു മാത്രമാണെന്നും വ്യാഖ്യാനിക്കുക.
  rationale: רַק אִם എന്നത് പുത്രന്മാരുടെ വിശ്വസ്തമായ നടപ്പിനെ വ്യക്തമായ വ്യവസ്ഥയായി അവതരിപ്പിക്കുന്നു. മറ്റു ഉടമ്പടിവാക്യങ്ങളെ ആശ്രയിച്ച് ഈ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്/അങ്ങയുടെ’ എന്നും ഉദ്ധരണിക്കുള്ളിൽ ദാവീദിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘നീ/നിന്റെ’ എന്നും നൽകി, സംസാരിക്കുന്നവരും അഭിസംബോധിതരും വ്യക്തമായി വേർതിരിച്ചു. ‘വഴി’, ‘നടക്കുക’, ‘സന്നിധി’ എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്.
