  to: 'ഇപ്പോൾ, ഇസ്രായേലിന്റെ ദൈവമായ യഹ്‌വേ, അങ്ങയുടെ ദാസനായ എന്റെ പിതാവ് ദാവീദിനോട് അങ്ങ് അരുളിച്ചെയ്തത് പാലിക്കണമേ. അങ്ങ് അവനോട് ഇങ്ങനെ അരുളിച്ചെയ്തു: “നിന്റെ പുത്രന്മാർ തങ്ങളുടെ വഴി സൂക്ഷിക്കുകയും, നീ എന്റെ സന്നിധിയിൽ നടന്നതുപോലെ അവർ എന്റെ സന്നിധിയിൽ നടക്കുകയും ചെയ്താൽ മാത്രം, ഇസ്രായേലിന്റെ സിംഹാസനത്തിൽ ഇരിക്കാൻ എന്റെ സന്നിധിയിൽ നിനക്കു ഒരു പുരുഷൻ ഇല്ലാതെ വരുകയില്ല.[a]”'
