review_pass:
  verdict: revise
  source_fidelity: The draft conveys the prayer that Yahweh fulfill what he spoke to David and retains the condition governing David's sons. However, the conditional clause is compressed in a way that can make its two coordinated requirements less clear, and the footnote's literal wording separates the throne-sitting participle from its antecedent more than the Hebrew does.
