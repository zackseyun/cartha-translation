  source_fidelity: 'മുഖ്യഅർഥം മിക്കവാറും വിശ്വസ്തമാണ്: പ്രാർഥന/യാചനയുടെ സമഗ്രത, വ്യക്തിയിലും ഇസ്രായേൽജനത്തിലും വ്യാപ്തി, ഹൃദയത്തിലെ നേഗ (ബാധ), കൈകൾ വിരിക്കുന്ന പ്രാർഥനാഭാവം, ‘ഈ ഭവനം’ എന്നിവ നിലനിൽക്കുന്നു. എന്നിരുന്നാലും, നിലവിലെ വാക്യത്തിൽ ‘ഏതൊരു മനുഷ്യൻ അർപ്പിക്കുന്നതായാലും ... ഇസ്രായേൽ മുഴുവനും അർപ്പിക്കുന്നതായാലും’ എന്ന ആവർത്തനരൂപം ഹീബ്രു വാക്യഘടനയെക്കാൾ ഭാരമുള്ളതും കൂട്ടായ കർത്താവിനോട് അല്പം അസ്വാഭാവികവുമാണ്.'
  naturalness: ‘ഏതൊരു മനുഷ്യനോ നിന്റെ ജനമായ ഇസ്രായേൽജനമെല്ലാമോ അർപ്പിക്കുന്ന’ എന്ന സമാന്തര ഘടന ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘ഹൃദയത്തിലെ ബാധ’യും ‘ഈ ഭവനത്തിലേക്കു കൈകൾ വിരിച്ചാൽ’ എന്നതും യോജിച്ചതാണ്.
