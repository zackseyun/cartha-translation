  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: ml
  text: ഏതൊരു മനുഷ്യനോ നിന്റെ ജനമായ ഇസ്രായേൽജനമെല്ലാമോ അർപ്പിക്കുന്ന ഏതു പ്രാർഥനയായാലും ഏതു യാചനയായാലും[a], ഓരോരുത്തനും തന്റെ ഹൃദയത്തിലെ ബാധ[b] അറിഞ്ഞ് ഈ ഭവനത്തിലേക്കു[c] കൈകൾ വിരിച്ചാൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഏതൊരു മനുഷ്യന്റേതായാലും’ / ‘ഏതൊരു മനുഷ്യനുവേണ്ടിയുള്ളതായാലും’; ഇവിടെ ഹീബ്രുവിലെ לְ എന്ന ഉപസർഗ്ഗം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ ഹൃദയത്തിന്റെ ബാധ’ അഥവാ ‘മഹാമാരി.’
    reason: lexical_alternative
  - marker: c
    text: ‘ഈ ഭവനം’ എന്നു പറയുന്നത് ഇവിടെ ദൈവാലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: ഏതു പ്രാർഥനയും ഏതു യാചനയും
  rationale: כָּל എന്ന പദത്തിന്റെ സമഗ്രവ്യാപ്തി ‘ഏതു...യും’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; תְּחִנָּהയുടെ ആത്മാർഥമായ അപേക്ഷാഭാവം ‘യാചന’ അറിയിക്കുന്നു.
- source_word: אֲשֶׁר תִהְיֶה לְכָל הָאָדָם
  choice: ഏതൊരു മനുഷ്യൻ അർപ്പിക്കുന്നതായാലും
  rationale: പ്രാർഥനയെ സംബന്ധിച്ചിടത്ത് ‘ഉണ്ടാകുക’ എന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അർപ്പിക്കുക’ എന്നു പൂർത്തീകരിച്ചു. לְ എന്നതിന്റെ ബന്ധസൂചകമായ അർഥമാണ് മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചത്; അതിലെ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: നിന്റെ ജനമായ ഇസ്രായേൽ മുഴുവനും അർപ്പിക്കുന്നതായാലും
  rationale: വ്യക്തിയിൽനിന്ന് ഉടമ്പടിജനത്തിന്റെ സമൂഹത്തിലേക്കുള്ള സമാന്തര വിപുലീകരണം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: ഓരോരുത്തനും ... അറിഞ്ഞ്
  rationale: אִישׁ ഇവിടെ സമൂഹത്തിനുള്ളിലെ ഓരോ വ്യക്തിയെയും വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ഓരോരുത്തനും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: נֶגַע לְבָבוֹ
  choice: സ്വന്തം ഹൃദയത്തിലെ ബാധ
  rationale: נֶגַעയുടെ ബാധ/വ്യഥ എന്ന രൂപകവും לְבָבוֹയിലെ വ്യക്തിപരമായ ആന്തരികതയും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: കൈകൾ വിരിച്ചാൽ
  rationale: പ്രാർഥനയിൽ കൈപ്പത്തികൾ നീട്ടി വിരിക്കുന്ന അംഗവിക്ഷേപം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ഈ ഭവനത്തിലേക്കു
  rationale: אֶל എന്നതിന്റെ ദിശാസൂചനയും בַּיִת എന്ന മൂലപദത്തിന്റെ ‘ഭവനം’ എന്ന രൂപവും നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദൈവാലയമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הָאָדָם എന്ന ഏകവചന പ്രതിനിധിപദത്തിന്റെ വിവർത്തനം
  choice: മനുഷ്യൻ
  alternative: വ്യക്തി / ആരെങ്കിലും
  rationale: ഹീബ്രുവിലെ ഏകവചന പ്രതിനിധിസ്വഭാവം നിലനിർത്തുകയും തുടർന്ന് വരുന്ന സമൂഹസൂചനയുമായുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: הַבַּיִת എന്നതിനെ ‘ഭവനം’ എന്നോ ‘ദൈവാലയം’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: ഭവനം
  alternative: ദൈവാലയം
  rationale: സന്ദർഭത്തിൽ അത് ദൈവാലയമാണെങ്കിലും മൂലപാഠത്തിലെ ‘ഭവനം’ എന്ന പദവും അതിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
- issue: נֶגַע לְבָבוֹയിലെ രൂപകത്തിന്റെ ശക്തി
  choice: ഹൃദയത്തിലെ ബാധ
  alternative: ഹൃദയത്തിലെ വ്യഥ / ഹൃദയത്തിന്റെ മഹാമാരി
  rationale: ‘ബാധ’ എന്നത് ശാരീരിക മഹാമാരിയെയും ആന്തരിക ക്ലേശത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ മൂലത്തിലെ രൂപകവും സന്ദർഭത്തിലെ ആന്തരിക അർഥവും തമ്മിലുള്ള സംഘർഷം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നൽകി. ‘പ്രാർഥന’, ‘യാചന’, ‘ഭവനം’ എന്നിവ ആരാധനാസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പദങ്ങളാണ്.
