  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതന്മാർ യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം അതിന്റെ സ്ഥാനത്തേക്ക്, ആലയത്തിന്റെ[a] അന്തർമന്ദിരമായ അതിവിശുദ്ധസ്ഥാനത്തേക്ക്[b], കെരൂബുകളുടെ ചിറകുകൾക്കു കീഴിൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ ‘ഭവനത്തിന്റെ’; ഇവിടെ ആലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധാതിവിശുദ്ധസ്ഥലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: അപ്പോൾ ... കൊണ്ടുവന്നു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ ക്രമം അറിയിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരായതും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം
  rationale: ഹീബ്രു സംയുക്തപദക്രമത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מְקוֹמוֹ
  choice: അതിന്റെ സ്ഥാനത്തേക്ക്
  rationale: പ്രത്യയം പെട്ടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിശ്ചിത’ അല്ലെങ്കിൽ ‘യഥാസ്ഥാന’ എന്ന വ്യാഖ്യാനഘടകം ചേർക്കാതെ ലളിതമായ അർഥം നൽകി.
- source_word: דְּבִיר
  choice: അന്തർമന്ദിരം
  rationale: ആലയത്തിലെ ഏറ്റവും ഉള്ളിലുള്ള വിശുദ്ധമുറിയെ സൂചിപ്പിക്കുന്ന, വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: הַבַּיִת
  choice: ആലയം
  rationale: അക്ഷരാർഥം ‘ഭവനം’ ആണെങ്കിലും ഇവിടെ ശലോമോന്റെ ദേവാലയമാണ് വ്യക്തമായ സൂചകം; ‘ആലയം’ ആധുനിക വായനക്കാർക്ക് ആശയക്കുഴപ്പമില്ലാതെ സന്ദർഭാർഥം നൽകുന്നു. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധസ്ഥാനം
  rationale: ഹീബ്രുവിലെ പരമോന്നത വിശുദ്ധത സൂചിപ്പിക്കുന്ന പ്രയോഗം സുതാര്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; പരമ്പരാഗത ഘടനയിലുള്ള മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: תַּחַת
  choice: കീഴിൽ
  rationale: ലളിതമായ സ്ഥലസൂചക മുൻപദത്തിന്റെ നേരായ മലയാള തുല്യം.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: കെരൂബുകളുടെ ചിറകുകൾ
  rationale: പ്രത്യേക ആലയപ്രതീകത്തെ സൂചിപ്പിക്കുന്ന ‘കെരൂബ്’ എന്ന പദം നിലനിർത്തി; כַּנְפֵי എന്നതിന്റെ നേരായ അർഥം ‘ചിറകുകൾ’ എന്നാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. ഒരു സ്ഥാനപ്പേര് പകരംവെക്കാതെ അതിനെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലത്തിലെ നിയമബന്ധപരമായ വ്യക്തിനാമം സംരക്ഷിക്കുന്നു.
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്ന വിശുദ്ധസ്ഥലനാമം
  choice: അതിവിശുദ്ധസ്ഥാനം
  alternative: വിശുദ്ധാതിവിശുദ്ധസ്ഥലം
  rationale: ഇത് ആലയത്തിലെ ഏറ്റവും വിശുദ്ധമായ അന്തർമുറിയെ സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിലെ രൂപം ആധുനിക വായനക്കാർക്ക് സുതാര്യമാണ്; ഹീബ്രു ഘടന കൂടുതൽ പ്രതിഫലിപ്പിക്കുന്ന പരമ്പരാഗത ബദൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അന്തർമന്ദിരം,’ ‘അതിവിശുദ്ധസ്ഥാനം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ആലയസംബന്ധമായ ഔന്നത്യം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ഉള്ളടക്കവും തമ്മിലുള്ള പൊരുത്തക്കേട് പകർത്താതെ, ഹീബ്രു പദങ്ങളോട് യോജിക്കുന്ന സ്ഥാനങ്ങളിൽ [a], [b] ചേർത്തു.
