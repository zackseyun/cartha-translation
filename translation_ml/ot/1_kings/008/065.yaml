  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: ml
  text: ആ കാലത്ത് ശലോമോൻ, ലെബോ-ഹമാത്ത്[a] മുതൽ ഈജിപ്തിലെ തോട്[b] വരെ നിന്നുള്ള ഒരു മഹാസഭയായ സകല ഇസ്രായേലിനോടൊപ്പം, നമ്മുടെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ ഉത്സവം ആചരിച്ചു—ഏഴ് ദിവസവും ഏഴ് ദിവസവും, ആകെ പതിനാലു ദിവസം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹമാത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം.’ എബ്രായ പ്രയോഗത്തെ ഒരു അതിർത്തിവിവരണമായോ ‘ലെബോ-ഹമാത്ത്’ എന്ന സ്ഥലനാമമായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഈജിപ്തിലെ വാദി.’ എബ്രായപദം പലപ്പോഴും വലിയൊരു നദിയെയല്ല, ചില കാലങ്ങളിൽ മാത്രം വെള്ളമൊഴുകുന്ന ജലപാതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: ഉത്സവം ആചരിച്ചു
  rationale: വַיַּעַשׂ എന്നതിന്റെ അക്ഷരാർഥം ‘ചെയ്തു/ഉണ്ടാക്കി’ എന്നാണെങ്കിലും חָג എന്ന പദത്തോടൊപ്പം വരുമ്പോൾ ഉത്സവം അനുഷ്ഠിക്കുകയോ ആഘോഷിക്കുകയോ ചെയ്തു എന്ന പ്രയോഗാർഥമാണ്. ‘ഉത്സവം ആചരിച്ചു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: קָהָל גָּדוֹל
  choice: ഒരു മഹാസഭ
  rationale: കָהָל കൂട്ടിച്ചേർക്കപ്പെട്ട ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘മഹാസഭ’ അതിന്റെ ഔപചാരികവും സമൂഹകേന്ദ്രിതവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: מִלְּבוֹא חֲמָת
  choice: ലെബോ-ഹമാത്ത് മുതൽ
  rationale: ഇത് സ്ഥിരമായൊരു ഭൂമിശാസ്ത്രനാമമായി വായിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം സ്വീകരിച്ചു; വിവരണാത്മക വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נַחַל מִצְרַיִם
  choice: ഈജിപ്തിലെ തോട്
  rationale: נַחַל സാധാരണയായി വലിയ നദിയേക്കാൾ ഒരു തോടിനെയോ കാലിക നീരൊഴുക്കിനെയോ വറ്റിയൊഴുകുന്ന ജലപാതയെയോ സൂചിപ്പിക്കുന്നു. നൈൽ നദിയുമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘തോട്’ തെരഞ്ഞെടുത്തു.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: നമ്മുടെ ദൈവമായ യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യബന്ധമായ അർഥം ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഉടമ്പടിനാമമായ יהוה ലിപ്യന്തരിച്ചു.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: ഏഴു ദിവസവും ഏഴു ദിവസവും
  rationale: രണ്ട് തുടർച്ചയായ ഏഴുദിവസ കാലയളവുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തി.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: ആകെ പതിനാലു ദിവസം
  rationale: മുൻപറഞ്ഞ രണ്ടു ഏഴുദിവസ കാലയളവുകളുടെ മൊത്തം ദൈർഘ്യം വ്യക്തമാക്കുന്ന സംഗ്രഹപ്രയോഗമാണിത്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വന്നിരിക്കുന്നതിനാൽ അതിനെ പൊതുവായ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: രണ്ട് ഏഴുദിവസ കാലയളവുകളുടെ ബന്ധം
  choice: ഏഴു ദിവസവും ഏഴു ദിവസവും, ആകെ പതിനാലു ദിവസം
  alternative: തുടർച്ചയായി പതിനാലു ദിവസം
  rationale: രണ്ട് ആചരണകാലങ്ങളെക്കുറിച്ചുള്ള സാധ്യത നിലനിർത്താനും മൂലപാഠത്തിന്റെ ശ്രദ്ധേയമായ ആവർത്തനം സംരക്ഷിക്കാനും അവയെ ഒറ്റ കാലയളവായി മാത്രം പുനർവ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദീർഘമായ എബ്രായവാക്യത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ മഹാസഭയെക്കുറിച്ചുള്ള സമാനാധികരണഭാഗം ദീർഘരേഖകൾക്കിടയിൽ നൽകി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, [a] ലെബോ-ഹമാത്തിനോടും [b] ഈജിപ്തിലെ തോടിനോടും ചേർത്ത് അർഥാനുസൃതമായി സ്ഥാപിച്ചു.
