  terminology: ‘നിന്റെ ജനമായ ഇസ്രായേൽ,’ ‘നിന്റെ നാമം ഏറ്റുപറയുകയും,’ ‘പ്രാർഥിക്കുകയും,’ and ‘യാചിക്കുകയും’ are appropriate and consistent. ‘ആലയം’ is contextually justified for בַּיִת here, while remaining readily understandable. The footnote responsibly preserves the lexical range of הוֹדוּ without forcing one interpretation.
