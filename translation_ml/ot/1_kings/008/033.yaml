  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: ml
  text: നിന്റെ ജനമായ ഇസ്രായേൽ നിന്നോടു പാപം ചെയ്തതിനാൽ ശത്രുവിന്റെ മുമ്പിൽ തോൽപ്പിക്കപ്പെടുമ്പോൾ, അവർ നിങ്കലേക്കു മടങ്ങിവന്ന് നിന്റെ നാമം ഏറ്റുപറയുകയും[a] ഈ ആലയത്തിൽവെച്ച് നിന്നോടു പ്രാർഥിക്കുകയും യാചിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ നാമത്തെ സ്തുതിക്കുകയും’ അല്ലെങ്കിൽ ‘നിന്റെ നാമത്തിനു നന്ദി പറയുകയും.’ സന്ദർഭമനുസരിച്ച് എബ്രായക്രിയയ്ക്ക് ഏറ്റുപറയുക, സ്തുതിക്കുക, നന്ദി പറയുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: തോൽപ്പിക്കപ്പെടുമ്പോൾ
  rationale: നָגַף എന്ന ക്രിയയുടെ നിഫാൽ രൂപം യുദ്ധസന്ദർഭത്തിൽ ശത്രുവിന്റെ മുമ്പിൽ പരാജയപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം അതിന്റെ കർമണിപ്രയോഗവും സൈനികസന്ദർഭവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: നിന്റെ ജനമായ ഇസ്രായേൽ
  rationale: ഉടമ്പടിബന്ധത്തെ സൂചിപ്പിക്കുന്ന ‘നിന്റെ ജനം’ എന്ന ഉടമസ്ഥപ്രയോഗവും ആ ജനം ഇസ്രായേലാണെന്ന തിരിച്ചറിയലും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי אוֹיֵב
  choice: ശത്രുവിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘മുമ്പിൽ’ നിലനിർത്തുകയും പരാജയസൂത്രവാക്യത്തിലെ സൈനികഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: നിന്നോടു പാപം ചെയ്തതിനാൽ
  rationale: പരാജയത്തിന്റെ കാരണമായി ഇസ്രായേലിന്റെ പാപത്തെ അവതരിപ്പിക്കുന്ന ബന്ധകപ്രയോഗത്തിന്റെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: അവർ നിങ്കലേക്കു മടങ്ങിവന്ന്
  rationale: שׁוּב എന്നതിന്റെ തിരിയുക/മടങ്ങിവരുക എന്ന രൂപകം നിലനിർത്തുന്നു; മൂലപദത്തിൽ നേരിട്ട് പറയുന്നതിനെക്കാൾ വിപുലമായ സൈദ്ധാന്തിക ആശയം ചേർക്കുന്നില്ല.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: നിന്റെ നാമം ഏറ്റുപറയുകയും
  rationale: ידה എന്ന ക്രിയയ്ക്ക് ഏറ്റുപറയുക, സ്തുതിക്കുക, നന്ദി പറയുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം. പാപം, പരാജയം, ദൈവത്തിലേക്കുള്ള മടക്കം എന്നീ പശ്ചാത്തലത്തിൽ ദൈവനാമത്തെ അംഗീകരിച്ച് ഏറ്റുപറയുക എന്ന അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְהִתְפַּלְלוּ
  choice: പ്രാർഥിക്കുകയും
  rationale: פלל എന്ന ക്രിയയുടെ ഹിത്പയേൽ രൂപത്തിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളപരിഭാഷ.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: നിന്നോടു ... യാചിക്കുകയും
  rationale: ദൈവത്തോടുള്ള വിനീതവും തീവ്രവുമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; ‘കൃപയ്ക്കായി’ എന്ന ആശയം വ്യാഖ്യാനമായി അധികമായി ചേർക്കാതെ ക്രിയയുടെ അപേക്ഷാഭാവം നൽകുന്നു.
- source_word: בַּבַּיִת הַזֶּה
  choice: ഈ ആലയത്തിൽവെച്ച്
  rationale: בַּ എന്നതിന്റെ ‘അകത്ത്/ഇൽ’ എന്ന സ്ഥാനാർഥം നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിലെ בַּיִת യഹോവയ്ക്കായി പണിത ആലയമായതിനാൽ സാധാരണ മലയാളവായനക്കാരന് വ്യക്തമായ ‘ആലയം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: പാപത്തിനുശേഷം ദൈവത്തിലേക്കുള്ള മടക്കത്തെ എത്രത്തോളം സൈദ്ധാന്തികമായി വ്യക്തമാക്കണം
  choice: നിങ്കലേക്കു മടങ്ങിവന്ന്
  alternative: മാനസാന്തരപ്പെട്ട് നിങ്കലേക്കു മടങ്ങിവന്ന്
  rationale: שׁוּב നേരിട്ട് സൂചിപ്പിക്കുന്നത് തിരിയുക/മടങ്ങിവരുക എന്നതാണ്. സന്ദർഭത്തിൽ മാനസാന്തരം ഉൾക്കൊള്ളാമെങ്കിലും, അത് പ്രത്യേക സൈദ്ധാന്തിക പദമായി മൂലവാചകത്തിൽ ചേർക്കാതെ മടക്കത്തിന്റെ രൂപകം സംരക്ഷിച്ചു.
- issue: וְהוֹדוּ אֶת שְׁמֶךָ എന്നതിന്റെ ബഹുവ്യഞ്ജകമായ അർഥം
  choice: നിന്റെ നാമം ഏറ്റുപറയുക
  alternative: നിന്റെ നാമത്തെ സ്തുതിക്കുക / നിന്റെ നാമത്തിനു നന്ദി പറയുക
  rationale: പാപം, പരാജയം, മടക്കം, പ്രാർഥന എന്നിവയുടെ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ നാമത്തെ അംഗീകരിച്ച് ഏറ്റുപറയുക എന്ന വായന യോജിക്കുന്നു. എന്നിരുന്നാലും എബ്രായക്രിയയുടെ സ്തുതിയുടെയും നന്ദിയുടെയും സാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ ഉപയോഗിച്ചു. വാക്യം തുടർന്നുള്ള വാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ അവസാനത്തിൽ നിബന്ധനാസൂചകമായ ‘ചെയ്താൽ’ എന്നും കോമയും നിലനിർത്തി. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന ഏകവചനരൂപങ്ങൾ ഏകീകരിച്ചു.
