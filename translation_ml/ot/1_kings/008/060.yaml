id: 1KI.8.60
reference: 1 Kings 8:60
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: ml
  text: ഭൂമിയിലെ സകല ജനതകളും യഹോവ തന്നെയാണ് ദൈവം എന്നും, മറ്റൊരു ദൈവവുമില്ല എന്നും അറിയേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: ഭൂമിയിലെ സകല ജനതകളും
  rationale: ‘ഭൂമിയിലെ എല്ലാ ജനവിഭാഗങ്ങളും’ എന്ന സർവവ്യാപക അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു പകരംവച്ച് പ്രത്യേക നാമം മറയ്ക്കുന്നില്ല.
- source_word: הוּא הָאֱלֹהִים
  choice: തന്നെയാണ് ദൈവം
  rationale: הוּא എന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: אֵין עוֹד
  choice: മറ്റാരുമില്ല
  rationale: മറ്റൊരു ദൈവവും ഇല്ലെന്ന സന്ദർഭാർഥം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യഹോവയുടെ ഏകദൈവത്വത്തെ ഊന്നിപ്പറയുന്ന വാക്യം
  choice: യഹോവ തന്നെയാണ് ദൈവം എന്നും മറ്റാരുമില്ല എന്നും
  alternative: യഹോവ ദൈവമാകുന്നു; വേറെ ആരുമില്ല
  rationale: മൂലത്തിലെ സ്വതന്ത്ര സർവനാമമായ הוּא നൽകുന്ന ഊന്നൽ നിലനിർത്തുകയും אֵין עוֹד എന്ന സമ്പൂർണ നിഷേധം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ആരാധനാപരമായ ഗൗരവം പുലർത്തുന്ന മലയാളം. ലക്ഷ്യസൂചകമായ לְמַעַן രൂപം ‘അറിയേണ്ടതിന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
