id: 1KI.8.10
reference: 1 Kings 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: ml
  text: പുരോഹിതന്മാർ വിശുദ്ധസ്ഥലത്തുനിന്ന്[a] പുറത്തുവന്നപ്പോൾ, മേഘം യഹ്‌വേയുടെ ആലയം നിറച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘വിശുദ്ധമന്ദിരത്തിൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: പുറത്തുവന്നപ്പോൾ
  rationale: וַיְהִי എന്ന ആഖ്യാനതുടർച്ചയും בְּ + infinitive construct നൽകുന്ന കാലബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായ ‘പുറത്തുവന്നപ്പോൾ’ എന്ന പ്രയോഗത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: הַכֹּהֲנִים
  choice: പുരോഹിതന്മാർ
  rationale: നിശ്ചിത ബഹുവചന നാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപരിഭാഷ.
- source_word: מִן הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തുനിന്ന്
  rationale: קֹדֶשׁ അക്ഷരാർഥത്തിൽ വിശുദ്ധമായ സ്ഥലം/മേഖല എന്നതാണ്; സന്ദർഭത്തിൽ പുരോഹിതന്മാർ പുറപ്പെട്ട ആലയത്തിലെ വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധമന്ദിരത്തിൽനിന്ന്’ എന്നതും സാധ്യമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: וְהֶעָנָן
  choice: മേഘം
  rationale: നിശ്ചിതമായ ‘മേഘം’ എന്ന അർഥം നിലനിർത്തുന്നു; മലയാളത്തിലെ കാലവാക്യഘടനയിൽ waw-യുടെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ വേറൊരു ‘എന്നിട്ട്’ ആവശ്യമില്ല.
- source_word: מָלֵא
  choice: നിറച്ചു
  rationale: Qal perfect രൂപത്തിൽ മേഘമാണ് കർത്താവും ആലയം കർമവുമാകുന്നത്; അതിനാൽ സകർമകമായ ലളിത ഭൂതകാലം യോജിക്കുന്നു.
- source_word: בֵּית יְהוָה
  choice: യഹ്‌വേയുടെ ആലയം
  rationale: בַּיִת എന്നത് അക്ഷരാർഥത്തിൽ ‘ഭവനം’ ആണെങ്കിലും ഈ സന്ദർഭത്തിൽ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായ ‘ആലയം’ തെരഞ്ഞെടുത്തു. יְהוָה എന്ന ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: എബ്രായപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്താൻ ‘യഹ്‌വേ’ ഉപയോഗിച്ചു; പൊതുവായ ബിരുദമായ ‘കർത്താവ്’ എന്നു മാറ്റിയില്ല.
- issue: הַקֹּדֶשׁ സൂചിപ്പിക്കുന്ന ആലയഭാഗം
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധമന്ദിരം; അതിവിശുദ്ധസ്ഥലം
  rationale: എബ്രായം ഇവിടെ ‘വിശുദ്ധമായ [സ്ഥലം]’ എന്നാണ് പറയുന്നത്; സാങ്കേതികമായി ഏത് ആലയവിഭാഗമാണെന്ന് മുഖ്യപാഠത്തിൽ അധികമായി നിർണ്ണയിച്ചിട്ടില്ല. ‘അതിവിശുദ്ധസ്ഥലം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിലില്ലാത്ത നിർവചനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘യഹ്‌വേയുടെ ആലയം’ എന്ന പ്രയോഗം ദൈവനാമവും ക്ഷേത്രസന്ദർഭവും തെളിഞ്ഞുനിൽക്കാൻ സഹായിക്കുന്നു.
