id: 1KI.8.40
reference: 1 Kings 8:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: ml
  text: അവർ ജീവനോടിരിക്കുന്ന നാളുകളിലെല്ലാം[b], നീ ഞങ്ങളുടെ പിതാക്കന്മാർക്കു[c] നൽകിയ ദേശത്ത്[a] നിന്നെ ഭയപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിയിൽ.’ ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘നിലത്തിന്റെ/ഭൂമിയുടെ മുഖത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ദൈവം ഇസ്രായേലിന്റെ പിതാക്കന്മാർക്കു നൽകിയ ദേശമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർ ജീവിച്ചിരിക്കുന്ന കാലമത്രയും.’
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ, ‘ഞങ്ങളുടെ പൂർവികർക്കു.’ ഹീബ്രു: ‘ഞങ്ങളുടെ പിതാക്കന്മാർക്കു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ഭയപ്പെടേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ശക്തി മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ദേശ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִרָאוּךָ
  choice: നിന്നെ ഭയപ്പെടേണ്ടതിന്
  rationale: ദൈവത്തോടുള്ള യִרְאָה ഭയവും ഭക്ത്യാദരവും ഉൾക്കൊള്ളുന്നു. ‘ഭയപ്പെടുക’ എന്നത് ഈ ബൈബിൾസംബന്ധമായ ദൈവശാസ്ത്രഭാരം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: അവർ ജീവനോടിരിക്കുന്ന നാളുകളിലെല്ലാം
  rationale: ‘അവർ ജീവിക്കുന്ന എല്ലാ നാളുകളും’ എന്ന ഹീബ്രു ഘടനയുടെ കാലപരമായ പൂർണത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ദേശത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘നിലത്തിന്റെ/ദേശത്തിന്റെ മുഖത്ത്’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള ‘പിതാക്കന്മാർക്കു നൽകിയ’ എന്ന വിശേഷണം വാഗ്ദത്തദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ദേശത്ത്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֲשֶׁר נָתַתָּה
  choice: നീ ... നൽകിയ
  rationale: പൂർത്തിയായ ദൈവിക ദാനത്തെ മലയാളത്തിലെ ലളിതമായ ഭൂതകാലരൂപം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לַאֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർക്കു
  rationale: ഹീബ്രുവിലെ ‘ഞങ്ങളുടെ പിതാക്കന്മാർ’ എന്ന വ്യക്തമായ പദപ്രയോഗവും അതിന്റെ ഉടമ്പടിസംബന്ധമായ ശൈലിയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള ירא എന്ന ക്രിയയുടെ അർഥം
  choice: നിന്നെ ഭയപ്പെടുക
  alternative: നിന്നെ ഭക്ത്യാദരത്തോടെ മാനിക്കുക
  rationale: ഇവിടെ ഉടമ്പടിപരമായ ദൈവഭക്തിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ഭയപ്പെടുക’ എന്നത് വെറും ആദരമായി അർഥം ചുരുക്കാതെ മൂലപദത്തിലെ ഭയവും ഭക്ത്യാദരവും തമ്മിലുള്ള പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: הָאֲדָמָה എന്നതിന്റെ വ്യാപ്തി
  choice: ദേശം
  alternative: ഭൂമി
  rationale: ‘നീ ഞങ്ങളുടെ പിതാക്കന്മാർക്കു നൽകിയ’ എന്ന തുടർന്നുള്ള വാക്യഭാഗം ഇസ്രായേലിനു നൽകിയ ദേശത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും പദത്തിന് വിശാലമായ ‘ഭൂമി’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രാർത്ഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ഹീബ്രുവിലെ ‘ദേശത്തിന്റെ മുഖത്ത്’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ അക്ഷരാർഥമായി പുനരാവർത്തിക്കാതെ, അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
