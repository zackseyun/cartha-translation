base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: ml
  text: എട്ടാം ദിവസം അവൻ ജനത്തെ പറഞ്ഞയച്ചു. അവർ രാജാവിനെ അനുഗ്രഹിച്ച്, യാഹ്‌വേ തന്റെ ദാസനായ ദാവീദിനും തന്റെ ജനമായ ഇസ്രായേലിനും ചെയ്ത സകല നന്മനിമിത്തം സന്തോഷിച്ചും ഹൃദയത്തിൽ ആനന്ദിച്ചും തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വീടുകളിലേക്കു’; അക്ഷരാർഥം, ‘കൂടാരങ്ങളിലേക്കു’.
    reason: എബ്രായത്തിലെ ‘കൂടാരങ്ങൾ’ എന്ന പ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭോചിതമായ ‘വീടുകൾ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: ഉത്സവത്തെക്കുറിച്ചുള്ള സൂചന സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാമെങ്കിലും ഈ വാക്യത്തിൽ പ്രകടമല്ല; അതിനാൽ ചേർക്കാതെ സമയസൂചന നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: שִׁלַּח אֶת הָעָם
  choice: അവൻ ജനത്തെ യാത്രയാക്കി
  rationale: പിയേൽ രൂപം ജനത്തെ പിരിച്ചയയ്ക്കുകയോ മടങ്ങിപ്പോകാൻ അനുവദിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു; ‘യാത്രയാക്കി’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: അവർ രാജാവിനെ അനുഗ്രഹിച്ചു
  rationale: സന്ദർഭത്തിൽ യാത്രാമൊഴിയുടെ ഭാവം ഉൾപ്പെടാമെങ്കിലും ברך എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘അനുഗ്രഹിക്കുക’ നിലനിർത്തുന്നു.
- source_word: לְאָהֳלֵיהֶם
  choice: തങ്ങളുടെ കൂടാരങ്ങളിലേക്ക്
  rationale: എബ്രായത്തിലെ ‘കൂടാരങ്ങൾ’ എന്ന ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ‘വീടുകളിലേക്ക്’ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: ആനന്ദിക്കുകയും ഹൃദയത്തിൽ സന്തോഷിക്കുകയും ചെയ്തു
  rationale: പുറമേ പ്രകടമായ ആനന്ദവും ഉള്ളിലെ ഹൃദയസന്തോഷവും ഉൾക്കൊള്ളുന്ന ഇരട്ടപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַל כָּל הַטּוֹבָה
  choice: സകല നന്മയും ഓർത്ത്
  rationale: עַל ഇവിടെ അവരുടെ സന്തോഷത്തിന്റെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓർത്ത്’ എന്നത് ആ കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ടെട്രാഗ്രാമറ്റോൺ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לְדָוִד עַבְדּוֹ
  choice: തന്റെ ദാസനായ ദാവീദിന്
  rationale: രാജകീയ-ഉടമ്പടി സന്ദർഭത്തിൽ עבד എന്നതിന് ‘ദാസൻ’ യോജിച്ച മലയാളപദമാണ്.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: തന്റെ ജനമായ ഇസ്രായേലിന്
  rationale: ഇസ്രായേലിനെ യഹോവയുടെ ജനമായി വിശേഷിപ്പിക്കുന്ന അനുബന്ധബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ ഒരു പദവി പകരംവയ്ക്കാതെ നാമരൂപം നിലനിർത്തി. ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഉച്ചാരണയോഗ്യവുമായ ‘യഹോവ’ തിരഞ്ഞെടുത്തു.
- issue: וַיְבָרֲכוּ എന്നതിലെ അനുഗ്രഹവും യാത്രാമൊഴിയും
  choice: രാജാവിനെ അനുഗ്രഹിച്ചു
  alternative: രാജാവിനോട് യാത്രാമൊഴി പറഞ്ഞു
  rationale: സന്ദർഭം യാത്രാമൊഴിയുടെ പ്രവർത്തനം സൂചിപ്പിച്ചേക്കാമെങ്കിലും ക്രിയയുടെ വ്യക്തമായ ‘അനുഗ്രഹിക്കുക’ എന്ന അർഥം മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ഹൃദയഭാഷയും ‘കൂടാരങ്ങൾ’ എന്ന ദൃശ്യരൂപവും സംരക്ഷിച്ചു; വാക്യത്തിന്റെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി.
