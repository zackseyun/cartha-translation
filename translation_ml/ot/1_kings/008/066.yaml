revisions:
- from: എട്ടാം ദിവസം അവൻ ജനത്തെ യാത്രയാക്കി[a]. അവർ രാജാവിനെ അനുഗ്രഹിച്ചശേഷം തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു മടങ്ങി. യഹോവ തന്റെ ദാസനായ ദാവീദിനും തന്റെ ജനമായ ഇസ്രായേലിനും ചെയ്ത സകല നന്മയും ഓർത്ത് അവർ ആനന്ദിക്കുകയും ഹൃദയത്തിൽ സന്തോഷിക്കുകയും ചെയ്തു.
  to: എട്ടാം ദിവസം അവൻ ജനത്തെ പറഞ്ഞയച്ചു. അവർ രാജാവിനെ അനുഗ്രഹിച്ച്, യാഹ്‌വേ തന്റെ ദാസനായ ദാവീദിനും തന്റെ ജനമായ ഇസ്രായേലിനും ചെയ്ത സകല നന്മനിമിത്തം സന്തോഷിച്ചും ഹൃദയത്തിൽ ആനന്ദിച്ചും തങ്ങളുടെ കൂടാരങ്ങളിലേക്കു പോയി[a].
  rationale: The revision removes the added idea of remembering, restores the causal force of ‘because of all the good,’ and makes rejoicing and inward gladness describe the people’s departure. It also uses the project-consistent Malayalam form «യാഹ്‌വേ». The footnote marker is placed directly after «കൂടാരങ്ങളിലേക്കു», the word it explains.
