id: 1KI.22.52
reference: 1 Kings 22:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: ml
  text: ആഹാബിന്റെ മകനായ അഹസ്യാവ്, യെഹൂദാരാജാവായ യെഹോശാഫാത്തിന്റെ പതിനേഴാം ഭരണവർഷത്തിൽ ശമര്യയിൽ ഇസ്രായേലിന്റെ രാജാവായി. അവൻ ഇസ്രായേലിനെ രണ്ടു വർഷം ഭരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഇവിടെ ക്രിയ അഹസ്യാവിന്റെ രാജാരോഹണത്തെ സൂചിപ്പിക്കുന്നു. ‘രാജാവായി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ രാജാവായി / ഇസ്രായേലിനെ ഭരിച്ചു
  rationale: מָלַךְ എന്ന ക്രിയയോടുകൂടിയ עַל ജനത്തിന്മേലുള്ള രാജഭരണത്തെ സൂചിപ്പിക്കുന്നു; രണ്ടു സന്ദർഭങ്ങളുടെയും മലയാള വാക്യഘടനയ്ക്കനുസരിച്ച് സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְּ ഇവിടെ രാജധാനിയായ ശമര്യയിലെ സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה
  choice: പതിനേഴാം ഭരണവർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണകാലത്തെ അടിസ്ഥാനമാക്കിയുള്ള തീയതിനിർണ്ണയമാണെന്ന് വ്യക്തമാക്കാൻ ‘ഭരണവർഷം’ ഉപയോഗിച്ചു.
- source_word: לִיהוֹשָׁפָט
  choice: യെഹോശാഫാത്തിന്റെ
  rationale: രാജവർഷസൂത്രത്തിൽ לְ, ആരുടെ ഭരണവർഷമാണ് എണ്ണുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധികാരൂപം സ്വാഭാവികമാണ്.
- source_word: וַיִּמְלֹךְ
  choice: അവൻ ... ഭരിച്ചു
  rationale: രാജാരോഹണവിവരത്തിനു പിന്നാലെ വരുന്ന ഈ ക്രിയ ഭരണകാലത്തിന്റെ ദൈർഘ്യം സംഗ്രഹിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി വ്യക്തമായ മലയാളം നൽകി.
- source_word: שְׁנָתָיִם
  choice: രണ്ടു വർഷം
  rationale: ദ്വിവചനരൂപം കൃത്യമായി രണ്ടു വർഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: ആഹാബിന്റെ മകനായ അഹസ്യാവ്
  rationale: ഹീബ്രായ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവിശേഷണഘടന ഉപയോഗിച്ചു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: യെഹോശാഫാത്തിനെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേര് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ചരിത്രവിവരണശൈലി. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു; മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത രാജക്രിയകളെ ‘രാജാവായി’, ‘ഭരിച്ചു’ എന്ന് വേർതിരിച്ചു.
