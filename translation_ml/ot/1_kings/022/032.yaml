base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: ml
  text: രഥസേനയുടെ സേനാനായകർ യെഹോശാഫാത്തിനെ കണ്ടപ്പോൾ, “തീർച്ചയായും ഇവനാണ് ഇസ്രായേൽരാജാവ്” എന്നു പറഞ്ഞു. അങ്ങനെ അവർ അവന്റെ നേരെ തിരിഞ്ഞ് അവനോടു പോരാടാൻ തുടങ്ങി[a]. എന്നാൽ യെഹോശാഫാത്ത് നിലവിളിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ ആക്രമിക്കാൻ അവന്റെ നേരെ തിരിഞ്ഞു.” എബ്രായ ക്രിയയ്ക്ക് ഒരാളുമായി യുദ്ധത്തിൽ ഏർപ്പെടാൻ അയാളുടെ നേരെയോ അയാൾക്കെതിരെയോ തിരിയുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: കണ്ടപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന וַיְהִי മലയാളത്തിൽ വേറിട്ട് പരിഭാഷപ്പെടുത്താതെ, כִּרְאוֹת എന്ന കാലസൂചക പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായ ആഖ്യാനക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: שָׂרֵי הָרֶכֶב
  choice: രഥസേനയുടെ അധിപന്മാർ
  rationale: שָׂרֵי എന്നത് സൈനിക നേതാക്കളെയും הָרֶכֶב എന്നത് ഇവിടെ രഥങ്ങളടങ്ങിയ സൈനികവിഭാഗത്തെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ വ്യക്തവും സ്വാഭാവികവുമായ സൈനിക അർഥം നൽകുന്നു.
- source_word: אַךְ
  choice: തീർച്ചയായും
  rationale: ഇവിടെ നിയന്ത്രണാർഥമല്ല, ഉറച്ച തിരിച്ചറിയലോ നിഗമനമോ ആണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: ഇവനാണ് ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രു പുല്ലിംഗ ഏകവചന സർവനാമത്തെയും യെഹോശാഫാത്തിനെക്കുറിച്ചുള്ള അവരുടെ തെറ്റായ തിരിച്ചറിയലിനെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּסֻרוּ עָלָיו לְהִלָּחֵם
  choice: അവനോടു പോരാടാൻ അവന്റെ നേരെ തിരിഞ്ഞു
  rationale: סור + עַל എന്നതിലെ ദിശാപരവും ശത്രുതാപരവുമായ അർഥവും לְהִלָּחֵם എന്നതിലെ പോരാട്ടത്തിൽ ഏർപ്പെടാനുള്ള ഉദ്ദേശ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַיִּזְעַק
  choice: നിലവിളിച്ചു
  rationale: זעק ശക്തമായ, പലപ്പോഴും ആപത്തിൽനിന്നുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിൽ പറയാത്ത ഉള്ളടക്കം ചേർക്കാതെ അടിയന്തരത പ്രകടമാക്കുന്നു.
