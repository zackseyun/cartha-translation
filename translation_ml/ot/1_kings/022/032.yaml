translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വാക്യാരംഭമായ וַיְהִי വേറിട്ടൊരു കൃത്രിമ പ്രയോഗമായി പുനരാവിഷ്കരിക്കാതെ മലയാളത്തിന്റെ സ്വാഭാവിക കഥനക്രമത്തിൽ ഉൾപ്പെടുത്തി.
