  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: ml
  text: 'അപ്പോൾ ആഹാബിന്റെ മകനായ അഹസ്യാവ് യെഹോശാഫാത്തിനോട് പറഞ്ഞു: “എന്റെ ദാസന്മാർ നിന്റെ ദാസന്മാരോടൊപ്പം കപ്പലുകളിൽ പോകട്ടെ.” എന്നാൽ യെഹോശാഫാത്ത് സമ്മതിച്ചില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ യെഹോശാഫാത്ത് നിരസിച്ചു.” എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥമായി, “യെഹോശാഫാത്ത് ഇച്ഛിച്ചില്ല” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ അവതരിപ്പിക്കുന്ന കാലക്രമസൂചകമായി സ്വാഭാവികമായ മലയാളം.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: ആഹാബിന്റെ മകനായ അഹസ്യാവ്
  rationale: ബന്ധസൂചകമായ בֶן വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് പേരുകൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: יֵלְכוּ
  choice: പോകട്ടെ
  rationale: ഇവിടെയുള്ള നിർദേശാത്മക/അനുവാദാത്മക ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും ഭാവികാലമായി മാറ്റുന്നില്ല.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: എന്റെ ദാസന്മാർ ... നിന്റെ ദാസന്മാർ
  rationale: രാജാക്കന്മാരുടെ സേവകരെയോ ഉദ്യോഗസ്ഥരെയോ സൂചിപ്പിക്കാവുന്ന עֶבֶד എന്ന പദത്തിന്റെ വിശാലതയും വാക്യത്തിലെ സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: בָּאֳנִיּוֹת
  choice: കപ്പലുകളിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനസ്ഥലാർഥം പിന്തുടരുന്നു; മലയാളത്തിൽ കപ്പൽയാത്രയെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമാണ്.
- source_word: וְלֹא אָבָה
  choice: എന്നാൽ ... സമ്മതമുണ്ടായില്ല
  rationale: אָבָה എന്നതിന്റെ ‘മനസ്സുണ്ടാകുക/സമ്മതിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; കൂടുതൽ ശക്തമായ ‘നിരസിച്ചു’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
