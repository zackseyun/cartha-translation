  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ നിർദേശഭാവവും അവസാനക്രിയയിലെ ഇച്ഛ/സമ്മതത്തിന്റെ സൂക്ഷ്മതയും സംരക്ഷിച്ചു. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ‘നിരസിച്ചു’ എന്ന കൂടുതൽ ശക്തമായ വിവർത്തനസാധ്യത വ്യക്തമാക്കുന്നു.
