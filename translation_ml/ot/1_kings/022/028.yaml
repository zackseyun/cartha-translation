  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: ml
  text: 'മീഖായാവ് പറഞ്ഞു: “നീ വാസ്തവമായി സമാധാനത്തോടെ മടങ്ങിവന്നാൽ, യഹ്‌വെ എന്നിലൂടെ[a] സംസാരിച്ചിട്ടില്ല.” പിന്നെ അവൻ പറഞ്ഞു: “സകല ജനതകളേ, കേൾക്കുവിൻ![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എന്നിൽ”; ഇവിടെ ദൈവം മീഖായാവിനെ തന്റെ പ്രവാചകസന്ദേശത്തിന്റെ ഉപകരണമായി ഉപയോഗിച്ച് സംസാരിച്ചതാണ് ഉദ്ദേശ്യം. “എന്നെക്കൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ “ജനതകൾ” എന്ന ബഹുവചനമാണ്; ഒരൊറ്റ കൂട്ടത്തോടല്ല, വിശാലമായൊരു ശ്രോതൃസമൂഹത്തോടുള്ള പരസ്യവിളിയാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ ലിപ്യന്തരണം.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: നീ വാസ്തവമായി … മടങ്ങിവന്നാൽ
  rationale: ക്രിയയുടെ infinitive absolute + imperfect ഘടന നൽകുന്ന ഊന്നൽ ‘വാസ്തവമായി’ എന്നതിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: അപായമോ പരിക്കോ കൂടാതെ സുരക്ഷിതമായി മടങ്ങിവരുക എന്ന സന്ദർഭാർഥത്തോടൊപ്പം എബ്രായ പ്രയോഗത്തിലെ ‘സമാധാനം’ എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: യഹോവ എന്നിലൂടെ സംസാരിച്ചിട്ടില്ല
  rationale: בִּי എന്ന പ്രവാചകപ്രയോഗം ദൈവം ഒരാളെ തന്റെ സന്ദേശത്തിന്റെ ഉപകരണമായി ഉപയോഗിച്ച് സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എന്നിലൂടെ’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിതമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: שִׁמְעוּ
  choice: കേൾക്കുവിൻ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയുടെ പരസ്യവും പ്രവാചകീയവുമായ ഭാവം നിലനിർത്തുന്ന മാന്യമായ മലയാളരൂപം.
- source_word: עַמִּים כֻּלָּם
  choice: സകല ജനതകളേ
  rationale: עַמִּים എന്ന ബഹുവചനം ‘ജനതകൾ’ എന്നു കൃത്യമായി പ്രതിഫലിപ്പിക്കുകയും כֻּלָּם എന്ന സമഗ്രത ‘സകല’ എന്നതിലൂടെ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: അവസാനത്തെ וַיֹּאמֶר എന്നതിന്റെ കർത്താവ്
  choice: മീഖായാവുതന്നെ തുടർന്നും സംസാരിക്കുന്നു
  alternative: വിവരണകർത്താവിന്റെയോ മറ്റൊരു ശബ്ദത്തിന്റെയോ ഇടക്കുറിപ്പായി കാണുക
  rationale: വ്യാകരണപരമായും സന്ദർഭപരമായും ഏറ്റവും നേരിട്ടുള്ള വായന മുൻപത്തെ പ്രസംഗകനായ മീഖായാവ് പൊതുവിളി തുടരുന്നു എന്നതാണ്; പാഠത്തിൽ ഇല്ലാത്ത കർത്തൃമാറ്റം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം രചിച്ചു. പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവത്തിനായി ‘കേൾക്കുവിൻ’ എന്ന മാന്യമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു; ശേഷിച്ച വാക്യം സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ഭാഷയിലാണ്.
