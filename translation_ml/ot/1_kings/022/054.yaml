  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: ml
  text: അവൻ ബാലിനെ സേവിക്കുകയും അവന്റെ മുമ്പിൽ കുമ്പിടുകയും[a] ചെയ്തു. തന്റെ പിതാവ് ചെയ്തതുപോലെതന്നെ അവൻ ഇസ്രായേലിന്റെ ദൈവമായ യാഹ്‌വെയെ കോപിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ആരാധിച്ചു’; ഹീബ്രു ക്രിയ അക്ഷരാർഥത്തിൽ കുനിഞ്ഞ് നമസ്കരിക്കുന്നതിനെയോ സാഷ്ടാംഗം വീഴുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: സേവിച്ചു
  rationale: עבד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘സേവിക്കുക’ നിലനിർത്തുന്നു; വിഗ്രഹാരാധനയുടെ പശ്ചാത്തലത്തിൽ ഇത് ആരാധനാപരമായ സേവനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: הַבַּעַל
  choice: ബാൽദേവൻ
  rationale: ഇവിടെ ബാൽ ഒരു ദേവനാമമാണ്. മലയാളത്തിൽ ആളുകൾക്ക് വ്യക്തമായി മനസ്സിലാകാൻ ‘ദേവൻ’ ചേർത്തു; ഹീബ്രുവിലെ നിർദേശക ഉപപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: അവന്റെ മുമ്പിൽ കുമ്പിട്ടു
  rationale: שׁחה സൂചിപ്പിക്കുന്ന കുനിഞ്ഞ് നമസ്കരിക്കുന്ന മൂർത്തമായ പ്രവൃത്തി സംരക്ഷിക്കുന്നു; മുമ്പുള്ള ‘സേവിച്ചു’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കാതെ ആരാധനയുടെ പ്രത്യേക പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: וַיַּכְעֵס
  choice: കോപിപ്പിച്ചു
  rationale: כעס എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥം—കോപം ഉളവാക്കുക—സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ദൈവം
  rationale: ഹീബ്രു സംയുക്തപദബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥബന്ധമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: തന്റെ അപ്പൻ ചെയ്തതുപോലെതന്നെ
  rationale: പിതാവിന്റെ പ്രവൃത്തികളോടുള്ള പൂർണമായ താരതമ്യബലം ‘പോലെതന്നെ’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: ബാലിനോടു വിരുദ്ധമായി ഇസ്രായേലിന്റെ ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് വാക്യത്തിൽ ഉപയോഗിക്കുന്നത്. അതിനാൽ ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കുമ്പിടുക’ മൂർത്തമായ ആരാധനാപ്രവൃത്തി വ്യക്തമാക്കുന്നു; ‘അപ്പൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ഗൗരവം നഷ്ടപ്പെടുത്തുന്നില്ല.
