source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽരാജാവ് പ്രവാചകന്മാരെ—ഏകദേശം നാനൂറുപേരെ—ഒരുമിച്ചുകൂട്ടി അവരോടു ചോദിച്ചു: “ഗിലെയാദിലെ രാമോത്തിനെതിരെ യുദ്ധത്തിനു ഞാൻ പോകണമോ, അതോ പിന്മാറണമോ?” അവർ പറഞ്ഞു: “കയറിച്ചെല്ലുക; കർത്താവ്[a] അതിനെ രാജാവിന്റെ കയ്യിൽ ഏല്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്റെ യജമാനൻ അതിനെ രാജാവിന്റെ കയ്യിൽ ഏല്പിക്കും.” എബ്രായപദമായ אֲדֹנָי ചില സന്ദർഭങ്ങളിൽ “എന്റെ യജമാനൻ” എന്ന് വായിക്കാം; എന്നാൽ ഇവിടെ “കർത്താവ്” എന്ന ദൈവിക ബിരുദമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קבץ എന്ന ക്രിയയുടെ ആളുകളെ ഒരിടത്ത് കൂട്ടിച്ചേർക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנְּבִיאִים
  choice: പ്രവാചകന്മാരെ
  rationale: נביאים എന്നതിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: ഏകദേശം നാനൂറുപേരെ
  rationale: כְּ എന്ന ഉപസർഗം ഇവിടെ ഏകദേശസംഖ്യ സൂചിപ്പിക്കുന്നതിനാൽ കൃത്യമായി നാനൂറ് എന്നു പറയാതെ ഏകദേശത നിലനിർത്തുന്നു.
- source_word: הַאֵלֵךְ
  choice: ഞാൻ പോകണമോ
  rationale: ആലോചനാപരമായ ഒന്നാംപുരുഷ ചോദ്യം ലളിതവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: ഗിലെയാദിലെ രാമോത്തിനെതിരെ യുദ്ധത്തിനു
  rationale: עַל എന്നത് ഇവിടെ സൈനിക നീക്കം രാമോത്തിനെതിരെ തിരിയുന്നതായി സൂചിപ്പിക്കുന്നു; സ്ഥലനാമം മലയാള വായനയിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אִם אֶחְדָּל
  choice: അതോ പിന്മാറണമോ
  rationale: חדל എന്നതിന്റെ വിട്ടുനിൽക്കുക, പ്രവർത്തിക്കാതിരിക്കുക എന്ന ഭാവം ഈ യുദ്ധാലോചനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֲלֵה
  choice: കയറിച്ചെല്ലുക
  rationale: עלה എന്ന സൈനികപ്രയോഗത്തിലെ ‘മേലോട്ടു ചെല്ലുക/പടയോട്ടം നടത്തുക’ എന്ന രൂപകൽപ്പന പരമാവധി നിലനിർത്തുന്നു; വെറും ‘ആക്രമിക്കുക’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: אֲדֹנָי
  choice: കർത്താവ്
  rationale: മസോരറ്റിക് സ്വരചിഹ്നങ്ങളോടെയുള്ള രൂപം ഇവിടെ ദൈവിക ബിരുദമായി വായിക്കുന്നതാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളത്; എന്നാൽ ഇത് יהוה എന്ന ദൈവനാമമല്ല. ‘എന്റെ യജമാനൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: രാജാവിന്റെ കയ്യിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ ശൈലി ‘കയ്യിൽ’ എന്ന പ്രതീകം സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ മനസ്സിലാകുന്നവിധം പകരുന്നു.
theological_decisions:
- issue: אֲדֹנָי എന്ന പദത്തിന്റെ വായന
  choice: കർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: പ്രവാചകന്മാരുടെ ഉറപ്പുനൽകുന്ന മറുപടിയിൽ ദൈവിക ബിരുദമായ ‘കർത്താവ്’ എന്ന വായനയ്ക്കാണ് കൂടുതൽ സന്ദർഭസാധ്യത. എങ്കിലും ഈ രൂപത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘എന്റെ യജമാനൻ’ എന്ന അർഥമുണ്ടാകുന്നതിനാൽ യഥാർഥമായ പാഠദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജകീയ-സൈനിക സന്ദർഭം വ്യക്തമായി സൂക്ഷിക്കുമ്പോൾ എബ്രായത്തിലെ ‘കയറിച്ചെല്ലുക’, ‘കയ്യിൽ ഏല്പിക്കുക’ എന്നീ ദൃശ്യപ്രയോഗങ്ങളും വായനാസൗകര്യത്തോടെ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘കർത്താവ്’ എന്ന പദത്തിനുശേഷം വെച്ചു.
