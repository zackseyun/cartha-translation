source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: ml
  text: അവൻ തന്റെ പിതാവായ ആസയുടെ മുഴുവൻ വഴിയിലും നടന്നു[a]; അതിൽനിന്ന് വ്യതിചലിച്ചില്ല; യഹോവയുടെ ദൃഷ്ടിയിൽ[b] ശരിയായതു ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘തന്റെ പിതാവായ ആസയുടെ മുഴുവൻ വഴിയിലും അവൻ നടന്നു.’ ഇവിടെ ‘നടന്നു’ എന്നത് ആസയുടെ ജീവിതരീതിയും പെരുമാറ്റവും പിന്തുടർന്നു എന്നർഥം നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘യഹോവയുടെ കണ്ണുകളിൽ’; അതായത്, യഹോവയുടെ വിലയിരുത്തലിൽ അഥവാ യഹോവയുടെ മുമ്പാകെ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: അവൻ നടന്നു
  rationale: הלך എന്നതിന്റെ നടക്കുക/പോകുക എന്ന വഴിരൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּכָל דֶּרֶךְ
  choice: വഴിയിലൊക്കെയും
  rationale: എബ്രായയിലെ ഏകവചനമായ דֶּרֶךְ (‘വഴി’) നിലനിർത്തിക്കൊണ്ട് בְּכָל എന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אָסָא אָבִיו
  choice: തന്റെ പിതാവായ ആസയുടെ
  rationale: ബന്ധസൂചനയും ആസയാണ് പിതാവ് എന്ന അർഥവും സ്വാഭാവിക മലയാളപദക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: അതിൽനിന്ന് വ്യതിചലിക്കാതെ
  rationale: סור എന്ന ‘തിരിഞ്ഞുമാറുക/വ്യതിചലിക്കുക’ എന്ന ആശയം വഴിരൂപകത്തോടൊപ്പം സൂക്ഷിക്കുന്നു; ഏകവചനപ്രത്യയം മുൻപുള്ള ‘വഴി’യെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിൽനിന്ന്’ എന്നു നൽകി.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: ശരിയായതു ചെയ്തു
  rationale: ‘ശരിയായതു ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: അക്ഷരാർഥമായ ‘യഹോവയുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ രൂപകത്തിന്റെ വിലയിരുത്തൽസംബന്ധിയായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരരൂപം സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: രാജാവിന്റെ നടത്തത്തെ വിലയിരുത്തുന്ന സൂത്രവാക്യം
  choice: അവൻ ആസയുടെ ജീവിതവഴിയിൽനിന്ന് വ്യതിചലിക്കാതെ യഹോവയുടെ ദൃഷ്ടിയിൽ ശരിയായതു ചെയ്തുവെന്ന പ്രസ്താവനയായി നിലനിർത്തി.
  alternative: വിശ്വസ്തമായ രാജത്വത്തെക്കുറിച്ചുള്ള പൊതുവായ പ്രശംസയായി വിപുലീകരിക്കുക.
  rationale: മൂലപാഠം പെരുമാറ്റത്തെയും ദൈവിക വിലയിരുത്തലിനെയും മാത്രം വ്യക്തമാക്കുന്നു; അതിൽ ഇല്ലാത്ത ഉപദേശപരമായ അവകാശവാദങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ‘വഴി’ എന്നതിന്റെ എണ്ണം
  choice: എബ്രായയിലെ ഏകവചനത്തെ ‘വഴി’ എന്നുതന്നെ സൂക്ഷിച്ചു.
  alternative: സന്ദർഭപരമായി ‘വഴികൾ’ എന്നു ബഹുവചനമാക്കുക.
  rationale: דֶּרֶךְ ഏകവചനമാണ്; തുടർന്നുള്ള מִמֶּנּוּ എന്ന പ്രത്യയവും ഏകവചനസൂചന നൽകുന്നു. അതിനാൽ മൂലപാഠത്തിന്റെ രൂപവും ജീവിതരീതി എന്ന കൂട്ടായ അർഥവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നടന്നു’, ‘വഴി’, ‘വ്യതിചലിക്കുക’ എന്നിവയിലൂടെ മൂലത്തിലെ തുടർച്ചയായ വഴിരൂപകം സംരക്ഷിച്ചു; ദൈവനാമം ‘യഹോവ’ എന്നു നൽകി.
