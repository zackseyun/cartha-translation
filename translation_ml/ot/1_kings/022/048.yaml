  - severity: low
    issue: Footnote wording is grammatically awkward
    rationale: ‘നിർത്തപ്പെട്ടതോ നിയമിക്കപ്പെട്ടതോ ആയ ഒരാളെ’ is less idiomatic in this context. ‘സ്ഥാനത്തിരുത്തപ്പെട്ട അല്ലെങ്കിൽ നിയമിക്കപ്പെട്ട വ്യക്തി’ more naturally explains the lexical sense.
