  terminology: ‘നിയുക്ത ഉദ്യോഗസ്ഥൻ’ appropriately preserves the nontechnical, appointed-official sense of נִצָּב without asserting a precise title. The footnote should describe the Hebrew term more idiomatically and avoid an awkward neuter construction for a person.
