id: 1KI.22.48
reference: 1 Kings 22:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: ml
  text: എദോമിൽ രാജാവുണ്ടായിരുന്നില്ല; ഒരു നിയുക്ത ഉദ്യോഗസ്ഥൻ[a] രാജാവായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു പ്രതിനിധി രാജാവായിരുന്നു’ അല്ലെങ്കിൽ ‘ഒരു ഭരണാധികാരി രാജാവായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. נִצָּב എന്ന എബ്രായപദം അക്ഷരാർഥത്തിൽ സ്ഥാനത്തിരുത്തപ്പെട്ട അല്ലെങ്കിൽ നിയമിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: രാജാവുണ്ടായിരുന്നില്ല
  rationale: וְ ആഖ്യാനത്തിലെ മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ/അപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു. אֵין ചരിത്രസന്ദർഭത്തിൽ ഇല്ലായ്മയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉണ്ടായിരുന്നില്ല’ എന്നു നൽകി.
- source_word: בֶּ/אֱדוֹם
  choice: എദോമിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെയും אֱדוֹם എന്ന സ്ഥലനാമത്തിന്റെയും നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: נִצָּב
  choice: നിയുക്ത ഉദ്യോഗസ്ഥൻ
  rationale: נצב എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ‘നിർത്തപ്പെട്ടവൻ’ അഥവാ ‘നിയമിക്കപ്പെട്ടവൻ’ എന്ന അടിസ്ഥാനാർത്ഥമുള്ളതും ഇവിടെ ഭരണചുമതല ഏല്പിക്കപ്പെട്ട ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നതുമാണ്. പദത്തിന്റെ കൃത്യമായ ഔദ്യോഗിക പദവി ഉറപ്പില്ലാത്തതിനാൽ അതിനെ അതിവിശദമായി നിർവചിച്ചിട്ടില്ല.
- source_word: מֶלֶךְ
  choice: രാജാവായി ഭരിച്ചു
  rationale: അവസാനത്തെ מֶלֶךְ നിയുക്ത ഉദ്യോഗസ്ഥന്റെ ഭരണപങ്കിനെ വിധേയമായി സൂചിപ്പിക്കുന്നു. ‘രാജാവായി ഭരിച്ചു’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ പ്രവർത്തനപങ്ക് വ്യക്തമാക്കുന്നു; അതേസമയം അയാൾ വംശപരമ്പരാഗത സ്വതന്ത്ര രാജാവായിരുന്നു എന്ന് പറയുന്നില്ല.
