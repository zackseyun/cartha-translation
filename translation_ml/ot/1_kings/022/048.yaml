translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമുള്ളതും ചരിത്രവിവരണത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ സംക്ഷിപ്തത പൂർണമായി അനുകരിച്ച് അസ്വാഭാവികമാക്കാതെ, ‘നിയുക്ത ഉദ്യോഗസ്ഥൻ’ എന്ന പദപ്രയോഗത്തിലൂടെ ഭരണപദവിയുടെ അനിശ്ചിതത്വം നിലനിർത്തി.
