base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ml
  text: അങ്ങനെ അവൻ രാജാവിന്റെ അടുക്കൽ വന്നു. രാജാവ് അവനോട്, “മീഖായാവേ, നാം യുദ്ധത്തിനായി രാമോത്ത്-ഗിലെയാദിലേക്കു പോകണമോ, അതോ പോകാതിരിക്കണമോ?” എന്നു ചോദിച്ചു. അവൻ രാജാവിനോട്, “കയറിച്ചെല്ലുക, വിജയിക്കുക; യഹ്‌വെ അതിനെ രാജാവിന്റെ കയ്യിൽ ഏല്പിക്കും”[a] എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ മീഖായാവിന്റെ ഈ മറുപടി പരിഹാസോക്തിയായിരിക്കാം; എന്നാൽ എബ്രായ വാക്യം തന്നെ പരിഹാസം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: അങ്ങനെ അവൻ വന്നു
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തുടർച്ച നൽകുന്നു.
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന് മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: הֲנֵלֵךְ
  choice: നാം ... പോകണമോ
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ ആലോചനാത്മക ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദ്
  rationale: സ്ഥലനാമത്തിന്റെ ഘടകങ്ങളും അവയുടെ ബന്ധവും ലിപ്യന്തരണത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: ലാമെദ് ഉപസർഗവും നാമവും ചേർന്ന് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: אִם נֶחְדָּל
  choice: അതോ പോകാതിരിക്കണമോ
  rationale: സൈനികയാത്രയിൽനിന്നു വിട്ടുനിൽക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֲלֵה
  choice: കയറിച്ചെല്ലുക
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു ചെല്ലുക’ എന്ന ദിശാബോധവും സൈനികനീക്കത്തിന്റെ സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: וְהַצְלַח
  choice: വിജയിക്കുക
  rationale: ഈ സംരംഭത്തിൽ വിജയം നേടുക എന്ന ഹിഫിൽ രൂപത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְנָתַן יְהוָה
  choice: യഹ്‌വെ ... ഏല്പിക്കും
  rationale: ആജ്ഞകൾക്കുശേഷമുള്ള വാവ് ചേർന്ന പൂർണ്ണക്രിയ ഉറപ്പുള്ള ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഭാവികാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: രാജാവിന്റെ കയ്യിൽ
  rationale: ഒരാളുടെ അധികാരത്തിലോ അധീനതയിലോ ഏല്പിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: മീഖായാവിന്റെ മറുപടിയുടെ സ്വരം
  choice: മുഖ്യപാഠത്തിൽ വാക്കുകൾ നേരാർഥത്തിൽ നൽകി, പരിഹാസസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: വിരാമചിഹ്നമോ അധികവാക്കുകളോ ഉപയോഗിച്ച് പരിഹാസം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: വിശാലസന്ദർഭം പരിഹാസം സൂചിപ്പിക്കുന്നുവെങ്കിലും എബ്രായ വാക്യം തന്നെ അത് ഭാഷാപരമായി അടയാളപ്പെടുത്തുന്നില്ല; അതിനാൽ ആഖ്യാനത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. രാജസദസ്സിന്റെ ഔപചാരികത നിലനിർത്താൻ ‘രാജാവ്’ എന്ന ആവർത്തനം സംരക്ഷിച്ചു; അതേസമയം ചോദ്യം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന രീതിയിൽ രൂപപ്പെടുത്തി.
