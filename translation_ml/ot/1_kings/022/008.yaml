  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: ml
  text: 'ഇസ്രായേൽരാജാവ് യെഹോശാഫാത്തിനോട് പറഞ്ഞു: “യഹോവയോട് അവൻ മുഖാന്തരം ചോദിച്ചറിയാൻ ഇനിയും ഒരാളുണ്ട്[a]; എന്നാൽ ഞാൻ അവനെ വെറുക്കുന്നു; കാരണം, അവൻ എന്നെക്കുറിച്ച് നന്മ പ്രവചിക്കുന്നില്ല, തിന്മ മാത്രമേ പ്രവചിക്കാറുള്ളൂ—യിംലയുടെ മകൻ മീഖായാവ്.” യെഹോശാഫാത്ത് പറഞ്ഞു: “രാജാവ് അങ്ങനെ പറയരുതേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവനിൽനിന്ന് യഹോവയോട് ചോദിച്ചറിയാൻ.”'
    reason: മൂലത്തിലെ מֵאֹתוֹ എന്ന പ്രയോഗം പ്രവാചകൻ മുഖാന്തരമോ അവനിൽനിന്നോ അരുളപ്പാട് അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עוֹד אִישׁ אֶחָד
  choice: ഇനിയും ഒരാളുണ്ട്
  rationale: עוֹד എന്നതിലെ ‘ഇനിയും/കൂടി’ എന്ന അർഥവും אִישׁ אֶחָד സൂചിപ്പിക്കുന്ന ഒരേയൊരു അധിക വ്യക്തിയെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: യഹോവയോട് ചോദിച്ചറിയാൻ ഇനിയും ഒരാളുണ്ട്; അവൻ മുഖാന്തരം നമുക്ക് ചോദിച്ചറിയാം
  rationale: ദാർശ് എന്ന ക്രിയയുടെ പ്രവാചകസന്ദർഭത്തിലെ ‘ചോദിച്ചറിയുക’ എന്ന അർഥവും מֵאֹתוֹ സൂചിപ്പിക്കുന്ന പ്രവാചകന്റെ മധ്യസ്ഥപങ്കും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: שְׂנֵאתִיו
  choice: എനിക്ക് അവനെ വെറുപ്പാണ്
  rationale: പൂർണക്രിയ സൂചിപ്പിക്കുന്ന ഉറച്ച ഇപ്പോഴത്തെ മനോഭാവം സ്വാഭാവികമായ നേരിട്ടുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: അവൻ എന്നെക്കുറിച്ച് നന്മയൊന്നും പ്രവചിക്കാതെ തിന്മ മാത്രമേ പ്രവചിക്കാറുള്ളൂ
  rationale: עָלַי എന്നത് ‘എന്നെക്കുറിച്ച്’ എന്നും כִּי אִם എന്നത് നിഷേധത്തിനു ശേഷമുള്ള ‘മാത്രം’ എന്നും വിവർത്തനം ചെയ്യുന്നു. טוב/רע എന്ന വിശാലമായ വൈരുധ്യം മുൻകൂട്ടി ‘വിജയം/ദുരന്തം’ എന്നു ചുരുക്കാതെ നന്മ/തിന്മയായി നിലനിർത്തുന്നു.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: യിംലയുടെ മകൻ മീഖായാവ്
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ വ്യക്തിനാമരൂപങ്ങളും സ്വാഭാവികമായ പിതൃനാമഘടനയും ഉപയോഗിക്കുന്നു.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: രാജാവ് അങ്ങനെ പറയരുതേ
  rationale: אַל സഹിതമുള്ള നിരോധനാത്മക ഭാവവും രാജാവിനോടുള്ള മാന്യമായ കൊട്ടാരഭാഷാശൈലിയും ‘പറയരുതേ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ സ്ഥാപിതമായ ദൈവനാമരൂപം ഉപയോഗിക്കുന്നു.
- issue: טוֹב / רָע എന്ന പദജോടിയുടെ പരിധി
  choice: നന്മ / തിന്മ
  alternative: അനുകൂലവാർത്ത / ദുരന്തം
  rationale: രാജാവിന്റെ പരാതിയിൽ ഈ പദങ്ങൾ തനിക്ക് അനുകൂലമോ പ്രതികൂലമോ ആയ പ്രവചനങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപദങ്ങളുടെ നൈതികവും സാഹചര്യപരവുമായ വിശാലത ചുരുക്കാതിരിക്കാൻ നന്മ/തിന്മ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജസഭാസന്ദർഭത്തിന് യോജിച്ച ആദരസൂചകമായ ‘രാജാവ് അങ്ങനെ പറയരുതേ’ നിലനിർത്തി; അതേസമയം പഴഞ്ചൻ വാക്യക്രമം ഒഴിവാക്കി.
