  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. സ്ഥലനാമങ്ങൾ മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. എബ്രായത്തിലെ കൂട്ടാർഥമുള്ള ഏകവചനക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകി; തർശീശ് കപ്പലുകൾ എന്ന പ്രയോഗത്തിലെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
