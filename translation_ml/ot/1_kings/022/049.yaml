base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: ml
  text: യെഹോശാഫാത്ത് സ്വർണത്തിനായി ഓഫീറിലേക്കു പോകാൻ തർശീശ് കപ്പലുകൾ[a] ഉണ്ടാക്കി. എന്നാൽ അവ പോയില്ല[b]; കാരണം ആ കപ്പലുകൾ എസ്യോൻ-ഗേബെരിൽവെച്ച് തകർന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തർശീശ് കപ്പലുകൾ’ എന്നത് തർശീശിൽനിന്നുള്ള കപ്പലുകൾ എന്നതിലുപരി, ദീർഘദൂര സമുദ്രയാത്രയ്ക്കുള്ള വലിയ കപ്പലുകളുടെ ഒരു തരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘പോയില്ല’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; കപ്പലുകളെയോ കപ്പൽവ്യൂഹത്തെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: ഉണ്ടാക്കി
  rationale: വ്യഞ്ജനപാഠത്തിലെ ഈ രൂപം സന്ദർഭത്തിൽ ‘ഉണ്ടാക്കി/തയ്യാറാക്കി’ എന്ന ക്രിയയായി മനസ്സിലാക്കപ്പെടുന്നു. യെഹോശാഫാത്ത് കർത്താവും കപ്പലുകൾ കർമവുമായുള്ള വാക്യഘടനയ്ക്കും സമാന്തരവിവരണത്തിനും ‘ഉണ്ടാക്കി’ യോജിക്കുന്നു.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: തർശീശ് കപ്പലുകൾ
  rationale: എബ്രായ സംയുക്തപ്രയോഗത്തിന്റെ പരമ്പരാഗത രൂപം നിലനിർത്തുന്നു; ഇത് തർശീശുമായി ബന്ധപ്പെട്ട കപ്പലുകളെയോ ദീർഘദൂര സമുദ്രയാത്രയ്ക്കുള്ള വലിയ കപ്പലുകളുടെ ഒരു തരത്തെയോ സൂചിപ്പിക്കാം. ഈ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: ഓഫീറിലേക്കു പോകാൻ
  rationale: അനന്തക്രിയയും ദിശാസൂചക പ്രത്യയവും ചേർന്ന് ഉദ്ദേശ്യവും ലക്ഷ്യസ്ഥാനവും വ്യക്തമാക്കുന്നു. ‘പോകാൻ’ മൂലപാഠത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: לַזָּהָב
  choice: സ്വർണത്തിനായി
  rationale: ഇവിടെയുള്ള ל യാത്രയുടെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘സ്വർണത്തിനായി’ എന്നത് സ്വർണം നേടുക എന്ന ഉദ്ദേശ്യം ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: וְלֹא הָלָךְ
  choice: എന്നാൽ അവ പോയില്ല
  rationale: ക്രിയ എബ്രായത്തിൽ ഏകവചനമായിരുന്നാലും കപ്പലുകളെയോ കപ്പൽവ്യൂഹത്തെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. യെഹോശാഫാത്ത് തന്നെയാണ് യാത്ര പോകാതിരുന്നതെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിക്കുന്നു.
- source_word: נשברה
  choice: തകർന്നുപോയി
  rationale: שבר എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ‘തകർക്കപ്പെടുക/തകർന്നുപോകുക’ എന്നർഥം നൽകുന്നു. കപ്പലുകളുടെ സാഹചര്യത്തിൽ ‘തകർന്നുപോയി’ സ്വാഭാവികവും കപ്പൽനാശത്തിന്റെ ആശയം കൃത്യമായി നൽകുന്നതുമാണ്.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: എസ്യോൻ-ഗേബെരിൽവെച്ച്
  rationale: തുറമുഖസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ב മലയാളത്തിൽ ‘-ൽവെച്ച്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
