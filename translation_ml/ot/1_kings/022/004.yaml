base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: ml
  text: അവൻ യെഹോശാഫാത്തിനോട്, “രാമോത്ത്-ഗിലെയാദിൽ യുദ്ധം ചെയ്യാൻ നീ എന്നോടൊപ്പം പോകുമോ?” എന്നു പറഞ്ഞു. യെഹോശാഫാത്ത് ഇസ്രായേൽ രാജാവിനോട്, “ഞാൻ നിന്നെപ്പോലെ; എന്റെ ജനം നിന്റെ ജനത്തെപ്പോലെ; എന്റെ കുതിരകൾ നിന്റെ കുതിരകളെപ്പോലെ” എന്നു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ജനം നിന്റെ ജനത്തെപ്പോലെയും എന്റെ കുതിരകൾ നിന്റെ കുതിരകളെപ്പോലെയും ആകുന്നു.” ഹീബ്രുവിൽ ഇത് ഐക്യദാർഢ്യവും സഖ്യബന്ധവും പ്രകടിപ്പിക്കുന്ന, ക്രിയയില്ലാത്ത ചുരുക്കപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: നീ എന്നോടൊപ്പം വരുമോ?
  rationale: ചോദ്യകണവും അപൂർണക്രിയയും ചേർന്ന നേരിട്ടുള്ള ക്ഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയിൽ സംസാരിക്കുന്നവനോടൊപ്പം ചേരുന്നതാണ് സന്ദർഭം; അതിനാൽ ഇവിടെ ‘വരുമോ’ സ്വാഭാവികമാണ്.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: യുദ്ധത്തിൽ ഏർപ്പെടാൻ പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദ്
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ ഘടകബന്ധം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഹീബ്രു സംയുക്തനാമത്തെ മലയാളത്തിലെ സ്വാഭാവിക സമാസരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: ഞാൻ നിന്നെപ്പോലെ
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു താരതമ്യപ്രയോഗത്തിന്റെ ചുരുക്കവും ഐക്യദാർഢ്യത്തിന്റെ അർഥവും നിലനിർത്തുന്നു; മലയാളത്തിലും ബന്ധകക്രിയ കൂടാതെ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: എന്റെ ജനം നിന്റെ ജനത്തെപ്പോലെ
  rationale: മൂലത്തിലെ സമാന്തരവും ക്രിയാരഹിതവുമായ താരതമ്യഘടന നിലനിർത്തുന്നു.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: എന്റെ കുതിരകൾ നിന്റെ കുതിരകളെപ്പോലെ
  rationale: സൈനികസഹായം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുണ്ടെങ്കിലും, ‘കുതിരകൾ’ എന്ന മൂർത്തനാമം നിലനിർത്തി ‘കുതിരപ്പട’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. രാജകീയ സംഭാഷണത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവവും അവസാനത്തെ മൂന്നു താരതമ്യങ്ങളുടെ ചുരുങ്ങിയ സമാന്തരഘടനയും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
