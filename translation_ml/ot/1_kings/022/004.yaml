  rationale: ‘വരുമോ?’ എന്നത് മൂലഹീബ്രുവിലെ ‘പോകുക’ എന്ന ചലനദിശയെ ‘വരുക’ എന്നു മാറ്റുന്നതിനാൽ, അത് ‘പോകുമോ?’ എന്നു തിരുത്തി. കൂടാതെ, മൂലത്തിലെ ויאמר എന്ന സാധാരണ സംസാരക്രിയയോടു കൂടുതൽ ചേർന്നുനിൽക്കാൻ ‘ചോദിച്ചു’ എന്നത് ‘പറഞ്ഞു’ എന്നു മാറ്റി. മറ്റു വാചകങ്ങളും കുറിപ്പും മൂലത്തിലെ ചുരുക്കവും സമാന്തരതയും സംരക്ഷിക്കുന്നു.
