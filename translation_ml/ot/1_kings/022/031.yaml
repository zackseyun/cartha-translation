base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: ml
  text: 'അരാം രാജാവ് തന്റെ മുപ്പത്തിരണ്ട് രഥസേനാനായകന്മാരോടു കൽപിച്ചിരുന്നു: “ചെറിയവനോടോ വലിയവനോടോ യുദ്ധം ചെയ്യരുത്[a]; ഇസ്രായേൽ രാജാവിനോടു മാത്രം യുദ്ധം ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചെറിയവനോടോ വലിയവനോടോ” എന്ന എബ്രായ പ്രയോഗം പദവിയോ പ്രാധാന്യമോ ഏതായാലും ആരോടും യുദ്ധം ചെയ്യരുത് എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: അരാംരാജാവ്
  rationale: אֲרָם എന്ന മൂലസ്ഥലനാമം ‘സിറിയ’ എന്നു പരമ്പരാഗതമായി മാറ്റാതെ ‘അരാം’ എന്നു നിലനിർത്തുന്നു. വാക്യാരംഭത്തിലെ ו കഥാസന്ദർഭത്തിലെ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദമായി ചേർക്കേണ്ടതില്ല.
- source_word: צִוָּה
  choice: കല്പിച്ചിരുന്നു
  rationale: ക്രിയ കല്പന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള യുദ്ധസംഭവത്തിനു പശ്ചാത്തലമായ മുൻകാല കല്പന എന്ന ഭാവം മലയാളത്തിലെ പൂർത്തഭൂതരൂപം നൽകുന്നു.
- source_word: שָׂרֵי הָרֶכֶב
  choice: രഥസേനാധിപന്മാർ
  rationale: ശരീം എന്നത് അധികാരികളെയോ സേനാനായകരെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ രഥസേനയുടെ സൈനിക മേധാവികൾ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר לוֹ
  choice: തനിക്കുണ്ടായിരുന്ന
  rationale: രാജാവിനോടുള്ള ഉടമസ്ഥതയെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം; ‘അവന്റെ കീഴിലുള്ള’ എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: മുപ്പത്തിരണ്ട്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: לֹא תִּלָּחֲמוּ
  choice: യുദ്ധം ചെയ്യരുത്
  rationale: നിഷേധകല്പനയുടെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  choice: ചെറിയവനോടോ വലിയവനോടോ
  rationale: പദശഃ രൂപകവും പദവിയിലോ പ്രാധാന്യത്തിലോ ഉള്ള മുഴുവൻ പരിധിയെയും ഉൾക്കൊള്ളുന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: മാത്രം
  rationale: ഒരേയൊരു ലക്ഷ്യം ഇസ്രായേൽരാജാവാണെന്ന ശക്തമായ ഒഴിവാക്കൽ-ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവിനോടു ... യുദ്ധം ചെയ്യുക
  rationale: ഇവിടെ אֶת അടയാളപ്പെടുത്തുന്ന യുദ്ധത്തിന്റെ എതിരാളിയെ മലയാളത്തിലെ ‘-ഓടു യുദ്ധം ചെയ്യുക’ എന്ന സ്വാഭാവിക നിർമാണത്തിലൂടെ വ്യക്തമാക്കുന്നു.
