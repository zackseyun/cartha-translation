  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ സൈനികഭാവവും ‘ചെറിയവൻ/വലിയവൻ’ എന്ന പ്രയോഗരൂപവും സൂക്ഷിച്ചിരിക്കുന്നു; ഉദ്ധരണിയിൽ മലയാളത്തിന് സ്വാഭാവികമായ നേരിട്ടുള്ള കല്പനാരൂപമാണ് ഉപയോഗിച്ചത്.
