id: 1KI.22.53
reference: 1 Kings 22:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ml
  text: അവൻ യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായത് ചെയ്തു. അവൻ തന്റെ അപ്പന്റെ വഴിയിലും തന്റെ അമ്മയുടെ വഴിയിലും ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച നെബാത്തിന്റെ മകൻ യൊരോബെയാമിന്റെ വഴിയിലും നടന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: തിന്മയായതു ചെയ്തു
  rationale: עשה + הרע എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പ്രവൃത്തിയെയും ധാർമിക വിലയിരുത്തലിനെയും നിലനിർത്തുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തൽ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: വഴിയിൽ നടന്നു
  rationale: ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന 'വഴിയിൽ നടക്കുക' എന്ന മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: אָבִיו ... אִמּוֹ
  choice: തന്റെ അപ്പൻ ... തന്റെ അമ്മ
  rationale: പിതാവിനെയും മാതാവിനെയും പ്രത്യേകം ആവർത്തിക്കുന്ന മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: നെബാത്തിന്റെ മകൻ യൊരോബെയാം
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  rationale: חטא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; 'പാപത്തിലേക്കു നയിച്ച' എന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു; അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരുന്നില്ല.
- issue: הֶחֱטִיא എന്ന കാരണാർഥത്തിന്റെ അവതരണം
  choice: ഇസ്രായേലിനെ പാപം ചെയ്യിച്ച
  alternative: ഇസ്രായേലിനെ പാപത്തിലേക്കു നയിച്ച
  rationale: യൊരോബെയാമിന്റെ സ്വാധീനത്തെ വെറും മാർഗനിർദേശമായി മൃദൂകരിക്കാതെ മൂലത്തിലെ കാരണാർഥപരമായ കുറ്റാരോപണം സംരക്ഷിക്കുന്നു; അതേസമയം ഉത്തരവാദിത്തത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ധാർമിക വിലയിരുത്തൽ പ്രയോഗം
  choice: യഹോവയുടെ ദൃഷ്ടിയിൽ തിന്മയായതു ചെയ്തു
  alternative: യഹോവയ്ക്കു അനിഷ്ടമായതു ചെയ്തു
  rationale: മൂലത്തിലെ 'കണ്ണുകളിൽ' എന്ന വിലയിരുത്തൽരൂപകം അർഥസുതാര്യമായി നിലനിർത്തുകയും 'അനിഷ്ടം' എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ 'വഴിയിൽ നടക്കുക' എന്ന ആവർത്തിത രൂപകം സംരക്ഷിച്ചിട്ടുണ്ട്. നീണ്ട ഏകവാക്യം മലയാളവായനയിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും ആശയക്രമവും മൂന്ന് 'വഴി' പരാമർശങ്ങളും മാറ്റിയിട്ടില്ല.
