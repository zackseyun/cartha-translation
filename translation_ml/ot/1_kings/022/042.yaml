translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം രാജവൃത്താന്തത്തിന് യോജിച്ച മാന്യവുമായ മലയാളം. ആവർത്തിച്ചുള്ള ‘അദ്ദേഹം’ പ്രയോഗം വാക്യബന്ധം വ്യക്തമാക്കുന്നു; മതവിഭാഗപരമായ പ്രത്യേക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
