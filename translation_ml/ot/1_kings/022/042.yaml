source:
  edition: WLC
  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ml
  text: യെഹോശാഫാത്ത് രാജാവായപ്പോൾ മുപ്പത്തഞ്ചു വയസ്സായിരുന്നു. അദ്ദേഹം യെരൂശലേമിൽ ഇരുപത്തഞ്ചു വർഷം ഭരിച്ചു. അദ്ദേഹത്തിന്റെ അമ്മയുടെ പേര് ശിൽഹിയുടെ മകളായ അസൂബാ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകിയിരിക്കുന്നു; പേരിന്റെ അർഥം വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: മുപ്പത്തഞ്ചു വയസ്സായിരുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘മുപ്പത്തഞ്ചു വർഷത്തിന്റെ മകൻ’ എന്ന എബ്രായ പ്രായസൂചക പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּמָלְכוֹ
  choice: രാജാവായപ്പോൾ
  rationale: രാജഭരണം ആരംഭിച്ച സമയത്തെ സൂചിപ്പിക്കുന്ന രൂപം. ‘ഭരിക്കാൻ തുടങ്ങിയപ്പോൾ’ എന്നും പറയാമെങ്കിലും, രാജസ്ഥാനാരോഹണത്തിന്റെ അർഥം ചുരുക്കത്തിലും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ഇരുപത്തഞ്ചു വർഷം
  rationale: ഭരണകാലത്തിന്റെ ദൈർഘ്യം നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
- source_word: מָלַךְ
  choice: ഭരിച്ചു
  rationale: രാജഭരണവിവരണങ്ങളിൽ מלך എന്ന ക്രിയയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: בִּירוּשָׁלָם
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമവും സ്ഥാനസൂചക പ്രത്യയവും മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: וְשֵׁם אִמּוֹ
  choice: അദ്ദേഹത്തിന്റെ അമ്മയുടെ പേര് ... എന്നായിരുന്നു
  rationale: എബ്രായ രാജവംശീയ സൂത്രവാക്യത്തിന്റെ ഉള്ളടക്കം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: עֲזוּבָה
  choice: അസൂബാ
  rationale: എബ്രായ വ്യക്തിനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: בַּת שִׁלְחִי
  choice: ശിൽഹിയുടെ മകളായ
  rationale: വംശബന്ധം നേരിട്ട് വ്യക്തമാക്കുന്നു; שִׁלְחִי എന്ന വ്യക്തിനാമം ശിൽഹി എന്നു ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
