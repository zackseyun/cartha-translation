id: 1KI.22.19
reference: 1 Kings 22:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “അതുകൊണ്ട് യഹ്‌വെയുടെ വചനം കേൾക്കുക: യഹ്‌വെ തന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നതും സ്വർഗത്തിലെ സകല സൈന്യവും[a] അവന്റെ അരികിൽ[b], അവന്റെ വലത്തും ഇടത്തുമായി നിൽക്കുന്നതും ഞാൻ കണ്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വർഗീയ സൈന്യം മുഴുവനും” അല്ലെങ്കിൽ “സ്വർഗത്തിലെ സകല സൈന്യഗണങ്ങളും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവന്റെ മീതെ നിൽക്കുന്നത്.” ഈ സന്ദർഭത്തിൽ, “അവന്റെ വലത്തും ഇടത്തുമായി” എന്ന തുടർവാക്കുകൾ വ്യക്തമാക്കുന്നതുപോലെ, അവന്റെ അരികിൽ പരിചരണത്തിനായി നിൽക്കുന്നതായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: അതുകൊണ്ട്
  rationale: മുൻപത്തെ സംഭാഷണത്തിൽനിന്നുള്ള നിഗമനപരമായ മാറ്റവും പ്രവാചകവചനത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: שְׁמַע
  choice: കേൾക്കുക
  rationale: ഏകവചനത്തിലുള്ള ആജ്ഞയെ ചുരുക്കമായും ഗൗരവത്തോടെയും അവതരിപ്പിക്കുന്നു.
- source_word: דְּבַר יְהוָה
  choice: യഹ്‌വെയുടെ വചനം
  rationale: സ്ഥിരമായ പ്രവാചകപ്രയോഗവും ‘വചനം’ എന്ന ബൈബിൾപരമായ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ യ്ഹ്വ്ഹിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: רָאִיתִי
  choice: ഞാൻ കണ്ടു
  rationale: മീഖായാവിന്റെ ദർശനവിവരണത്തിന് സ്വാഭാവികമായ ഭൂതകാലരൂപം.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: തന്റെ സിംഹാസനത്തിൽ ഇരിക്കുന്നത്
  rationale: തുടർന്നുനിൽക്കുന്ന രാജകീയ ഇരിപ്പിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ ദൃശ്യസ്വഭാവം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: സ്വർഗത്തിലെ സകല സൈന്യവും
  rationale: സ്വർഗീയസഭയെയോ സൈന്യത്തെയോ സൂചിപ്പിക്കാവുന്ന കൂട്ടായ രൂപകം ‘ദൂതന്മാർ’ എന്നു ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: עֹמֵד
  choice: നിൽക്കുന്നത്
  rationale: കൂട്ടവാചകമായ വിഷയത്തോടു ചേർന്ന ഹീബ്രു ഏകവചന പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עָלָיו
  choice: അവന്റെ അരികിൽ
  rationale: സിംഹാസനസഭയുടെ പശ്ചാത്തലത്തിലും തുടർന്നുള്ള ‘വലത്തും ഇടത്തുമായി’ എന്ന വിശദീകരണത്തിലും, സന്നിധിയിൽ സേവനത്തിനായി നിൽക്കുന്നതാണ് സന്ദർഭോചിതമായ അർഥം; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: അവന്റെ വലത്തും ഇടത്തുമായി
  rationale: ഹീബ്രുവിലെ സ്ഥലപരമായ സമമിതി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സ്വർഗീയ സിംഹാസനദർശനത്തിലെ יְהוָה എന്ന ദൈവനാമം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന ഉടമ്പടിനാമത്തെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത വ്യക്തിനാമമായി അവതരിപ്പിക്കുന്നു.
- issue: כָל צְבָא הַשָּׁמַיִם എന്ന സ്വർഗീയ സമൂഹത്തിന്റെ സ്വഭാവം
  choice: സ്വർഗത്തിലെ സകല സൈന്യവും
  alternative: സ്വർഗത്തിലെ സകല ദൂതന്മാരും; സ്വർഗീയ സമൂഹം മുഴുവനും
  rationale: വാക്യം തന്നെ വ്യക്തമാക്കാത്ത അംഗങ്ങളുടെ കൃത്യമായ സ്വഭാവം നിർണയിക്കാതെ, സൈനികവും രാജസഭാപരവുമായ രൂപകസാധ്യതകൾ നിലനിർത്തുന്നു.
- issue: עָלָיו എന്ന സ്ഥലബന്ധത്തിന്റെ അർഥം
  choice: അവന്റെ അരികിൽ
  alternative: അവന്റെ മീതെ
  rationale: ‘അവന്റെ വലത്തും ഇടത്തുമായി’ എന്ന തുടർവിവരണം അരികിൽ സന്നിഹിതരായി നിൽക്കുന്ന രാജസഭാദൃശ്യം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഹീബ്രുവിന്റെ കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചകഭാഷയാണ് ഉപയോഗിച്ചത്. ദീർഘമായ ദർശനവാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ക്രിയാനാമഘടനയിൽ ക്രമപ്പെടുത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ [a] ‘said’ എന്നതിന് ശേഷം കാണിച്ചിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് צְבָא הַשָּׁמַיִם എന്ന പദസമുച്ചയത്തെക്കുറിച്ചായതിനാൽ, മൂലപാഠസാക്ഷ്യത്തിന് അനുസരിച്ച് അടയാളം ബന്ധപ്പെട്ട വാക്കിന് ശേഷമാക്കി.
