  - marker: a
    text: അഥവാ, ‘ആരാധനാചാരങ്ങളുമായി ബന്ധപ്പെട്ട ലൈംഗികവൃത്തിയിൽ ഏർപ്പെട്ടിരുന്ന പുരുഷന്മാർ.’ ഹീബ്രുവിലെ קָדֵשׁ നിരോധിതമായ ആരാധനാചാര-ലൈംഗികപ്രവർത്തനവുമായി ബന്ധപ്പെട്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗപദമാണ്.
