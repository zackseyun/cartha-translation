theological_decisions:
- issue: קָדֵשׁ എന്ന സാംസ്കാരികവും നൈതികവുമായി സങ്കീർണമായ പദത്തിന്റെ പരിഭാഷ
  choice: ആരാധനാചാരങ്ങളിലെ വേശ്യാവൃത്തിക്കാർ
  alternative: പുരുഷ ആരാധനാചാര വേശ്യാവൃത്തിക്കാർ; ആരാധനാചാര ശുശ്രൂഷകർ
  rationale: പദത്തിന്റെ ആരാധനാചാരപരവും ലൈംഗികവുമായ ഘടകങ്ങൾ രണ്ടും അറിയിക്കുന്ന ഭാഷയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്. ‘സൊദോമ്യർ’ പോലുള്ള പാരമ്പര്യപദം മൂലപദത്തിന്റെ കൃത്യമായ അർഥത്തേക്കാൾ പിന്നീടുള്ള വിവാദാർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി. ഹീബ്രുപദം പുല്ലിംഗ ഏകവചനമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ‘ബാക്കിയുള്ളവർ’ എന്നും ‘ശേഷിച്ചിരുന്നവർ’ എന്നും വരുന്ന ആവർത്തനാത്മക ആശയം ഇല്ലാതാക്കാതെ സ്വാഭാവിക വാക്യഘടനയിൽ നിലനിർത്തി. ‘ദേവാലയവേശ്യകൾ’ എന്നത് പ്രത്യേക കെട്ടിടബന്ധം അനാവശ്യമായി സൂചിപ്പിക്കാമെന്നതിനാൽ കൂടുതൽ വിശാലമായ ‘ആരാധനാചാരങ്ങളിലെ വേശ്യാവൃത്തിക്കാർ’ തിരഞ്ഞെടുത്തു.
