source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ml
  text: എന്നാൽ, ഉന്നത ആരാധനാസ്ഥലങ്ങൾ[a] നീക്കിക്കളഞ്ഞിരുന്നില്ല[b]; ജനം അപ്പോഴും ആ ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ ബലിയർപ്പിക്കുകയും ധൂപം കത്തിക്കുകയും ചെയ്തുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉന്നതസ്ഥലങ്ങൾ.” എബ്രായപദം സാധാരണയായി ഉയർന്ന സ്ഥലങ്ങളിലുള്ള പ്രാദേശിക ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ബലികൾ അംഗീകാരമില്ലാത്ത ഉന്നത ആരാധനാസ്ഥലങ്ങളിൽ യഹോവയ്ക്ക് അർപ്പിച്ചതാണോ, അതോ വിപുലമായ വിഗ്രഹാരാധനയുടെ ഭാഗമായിരുന്നോ എന്ന് ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻപുള്ള അനുകൂല വിലയിരുത്തലിനോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: പൂജാഗിരികൾ / പൂജാഗിരികളിൽ
  rationale: ബാമോത്ത് എന്നത് പ്രാദേശികമായ, പലപ്പോഴും ഉയർന്ന സ്ഥലങ്ങളിലുള്ള ആരാധനാകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്നു. വെറും ‘ഉന്നതസ്ഥലങ്ങൾ’ എന്നതിനേക്കാൾ ‘പൂജാഗിരികൾ’ ആരാധനാസംബന്ധമായ അർഥം സാധാരണ വായനക്കാരനു വ്യക്തമാക്കുന്നു; ഉയർന്ന സ്ഥലമെന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: לֹא סָרוּ
  choice: നീക്കിക്കളഞ്ഞിരുന്നില്ല
  rationale: ഇവിടെ ആരാധനാകേന്ദ്രങ്ങളാണ് കർത്താവ്; അവ നിലനിന്നുവെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עוֹד
  choice: അപ്പോഴും
  rationale: പരിഷ്കാരങ്ങൾ ഉണ്ടായിട്ടും പതിവ് തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: מְזַבְּחִים
  choice: ബലിയർപ്പിക്കുകയും
  rationale: കർത്തൃവാചകമായ പങ്കാളിത്തരൂപത്തിന്റെ തുടരുന്ന പതിവുപ്രവൃത്തിയെ ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന സംയുക്തഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: וּמְקַטְּרִים
  choice: ധൂപം കാട്ടുകയും ചെയ്തുകൊണ്ടിരുന്നു
  rationale: ആരാധനാസന്ദർഭത്തിൽ കטר ധൂപം കത്തിക്കുന്നതിനെ സാധാരണയായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ആരാധനാപ്രയോഗം ഉപയോഗിക്കുകയും തുടരുന്ന പ്രവൃത്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൂജാഗിരികളിലെ ആരാധനയുടെ സ്വഭാവം
  choice: ബലിയും ധൂപവും ആരെ ലക്ഷ്യമാക്കിയാണെന്ന് വ്യക്തമാക്കാതെ വാക്യം വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: അംഗീകാരമില്ലാത്ത ഇടങ്ങളിൽ യഹോവയ്ക്കുള്ള ആരാധനയെന്നോ വിഗ്രഹാരാധനയെന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: എബ്രായപാഠം ആരാധനയുടെ ലക്ഷ്യം ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായ പങ്കാളിത്തരൂപങ്ങളിലെ തുടരുന്ന പതിവുപ്രവൃത്തി ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന ഘടനയിലൂടെ പ്രകടിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
