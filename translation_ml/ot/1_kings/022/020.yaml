source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֔ב וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר זֶה֙ בְּ/כֹ֔ה וְ/זֶ֥ה אֹמֵ֖ר בְּ/כֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: ml
  text: യഹ്‌വെ പറഞ്ഞു[a], “ആഹാബ് ഗിലെയാദിലെ രാമോത്തിലേക്കു കയറിച്ചെന്ന് വീഴാനായി അവനെ ആർ വശീകരിക്കും?” ഒരാൾ ഇങ്ങനെ പറഞ്ഞു, മറ്റൊരാൾ അങ്ങനെ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സമ്മതിപ്പിക്കും”; സന്ദർഭമനുസരിച്ച് ഈ ക്രിയയ്ക്ക് “വഞ്ചിക്കും” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ വ്യക്തിനാമരൂപം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יְפַתֶּה
  choice: വശീകരിക്കും
  rationale: പീയേൽ രൂപത്തിലുള്ള ഈ ക്രിയയ്ക്ക് വശീകരിക്കുക, സമ്മതിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രധാന പാഠത്തിലെ ‘വശീകരിക്കും’ ഒരാളെ ഒരു പ്രവൃത്തിയിലേക്കു നയിക്കുന്ന ആശയം നിലനിർത്തുകയും വഞ്ചനയുടെ അർഥം നിർബന്ധമായി തീരുമാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְיַעַל
  choice: കയറിച്ചെന്ന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയുടെ ലക്ഷ്യഫലം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; യുദ്ധത്തിനായി ഒരു സ്ഥലത്തേക്കു ‘കയറിച്ചെല്ലുക’ എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וְיִפֹּל
  choice: വീഴേണ്ടതിന്
  rationale: യുദ്ധസന്ദർഭത്തിൽ മരണമോ പരാജയമോ സൂചിപ്പിക്കാമെങ്കിലും, മൂലപാഠത്തിലെ അടിസ്ഥാനക്രിയയായ ‘വീഴുക’ തന്നെ നിലനിർത്തുന്നു.
- source_word: בְּרָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്തിൽ
  rationale: സ്ഥലനാമത്തെ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകുകയും, യുദ്ധം നടക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വിഭക്തി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: ഒരാൾ ഒരു വിധത്തിലും മറ്റൊരാൾ മറ്റൊരു വിധത്തിലും പറഞ്ഞു
  rationale: വ്യത്യസ്ത വക്താക്കൾ വ്യത്യസ്ത അഭിപ്രായങ്ങൾ പറഞ്ഞുവെന്ന എബ്രായ പ്രയോഗത്തിന്റെ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
theological_decisions:
- issue: ആഹാബിന്റെ പതനത്തിൽ ദൈവിക പങ്കാളിത്തം
  choice: ആഹാബിനെ വശീകരിക്കാൻ ആർ മുന്നോട്ടുവരുമെന്ന് യഹ്‌വെ നേരിട്ട് ചോദിക്കുന്നതായി നിലനിർത്തി.
  alternative: ദൈവിക പ്രവർത്തകത്വം മൃദൂകരിച്ച് ‘ആർ ആഹാബിനെ സ്വാധീനിക്കും?’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: സ്വർഗീയസഭയിൽ ചോദ്യം ആരംഭിക്കുന്നത് യഹ്‌വെയാണെന്ന് എബ്രായപാഠം നേരിട്ട് അവതരിപ്പിക്കുന്നു. ദൈവിക പരമാധികാരവും ന്യായവിധിയും സംബന്ധിച്ച പാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം സ്ഥാനപ്പേരാൽ മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു. സൈനികസന്ദർഭത്തിലെ ‘വീഴുക’ എന്ന രൂപകം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തി.
