id: 1KI.22.12
reference: 1 Kings 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ml
  text: 'എല്ലാ പ്രവാചകന്മാരും ഇപ്രകാരം പ്രവചിച്ചുകൊണ്ടിരുന്നു: “രാമോത്ത്-ഗിലെയാദിലേക്കു കയറിച്ചെന്ന് വിജയിക്കുക[a]; യഹ്‌വേ അതിനെ രാജാവിന്റെ കൈയിൽ ഏല്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അഭിവൃദ്ധി പ്രാപിക്കുക.”
    reason: צלח എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ‘വിജയിക്കുക’ എന്നും ‘അഭിവൃദ്ധി പ്രാപിക്കുക’ എന്നും അർത്ഥമാകാം.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: പ്രവാചകന്മാരെല്ലാവരും
  rationale: സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന כָּלയും നിർദിഷ്ട നാമവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകമായി ചേർക്കാതെ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: נִבְּאִים כֵּן
  choice: ഇപ്രകാരം പ്രവചിച്ചുകൊണ്ടിരുന്നു
  rationale: പങ്കാളിത്തരൂപമായ נִבְּאִים തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; כֵּן അവരുടെ സന്ദേശത്തിന്റെ ഒരേ രീതിയെ വ്യക്തമാക്കുന്നു.
- source_word: לֵ/אמֹר
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ അവതരിപ്പിച്ചു
  rationale: മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ആവർത്തിക്കുന്നത് ഭാരമുള്ളതിനാൽ, ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദു ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
- source_word: עֲלֵה
  choice: കയറിച്ചെന്ന്
  rationale: עלה എന്നതിന്റെ ‘മുകളിലേക്കു പോകുക’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുകയും സൈനികാക്രമണം എന്ന് വാചകത്തിൽ അധികമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദ്
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം.
- source_word: וְ/הַצְלַח
  choice: വിജയിക്കുക
  rationale: צלח എന്ന ക്രിയ ഇവിടെ വിജയകരമായ ഫലത്തെ സൂചിപ്പിക്കുന്നു; സൈനികസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: וְ/נָתַן
  choice: ഏല്പിക്കും
  rationale: പ്രസംഗസന്ദർഭത്തിൽ പൂർത്തികൃതരൂപം ഭാവിയിലെ ഉറപ്പായ ഫലമായി പ്രവർത്തിക്കുന്നു; വാക്യത്തിലെ וְ നേരിട്ടുള്ള ഏകോപനമായി അർദ്ധവിരാമത്തിലൂടെ ബന്ധിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള നേരിട്ടുള്ള രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: രാജാവിന്റെ കയ്യിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന ഹീബ്രു ശൈലി മലയാളത്തിലും വ്യക്തമായതിനാൽ കൈ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനെ ഒരു പദവിയാൽ പകരാതെ പേരായി നിലനിർത്തുന്നു.
- issue: וְ/נָתַן എന്ന രൂപത്തിന്റെ കാല-ഭാവം
  choice: ഏല്പിക്കും
  alternative: ഏല്പിച്ചിരിക്കുന്നു
  rationale: പ്രവാചകരുടെ ആഹ്വാനത്തിൽ വരാനിരിക്കുന്ന വിജയഫലത്തെ ഉറപ്പായി പ്രഖ്യാപിക്കുന്നതിനാൽ മലയാളത്തിൽ ഭാവികാലം യോജിക്കുന്നു; ഹീബ്രു പൂർത്തികൃതരൂപത്തിന്റെ പ്രവചനാത്മക ഉറപ്പ് സന്ദർഭത്തിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. തുടരുന്ന പ്രവചനം, ‘കയറിച്ചെല്ലുക’ എന്ന ദിശാഭാവം, ‘രാജാവിന്റെ കയ്യിൽ’ എന്ന മൂലരൂപകം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘വിജയിക്കുക’ എന്ന പദത്തിനുതന്നെ ചേർത്തിരിക്കുന്നു.
