base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: ml
  text: 'എന്നാൽ ഒരാൾ ലക്ഷ്യം നോക്കാതെ[a] വില്ല് വലിച്ച് അമ്പെയ്തു; അത് ഇസ്രായേൽരാജാവിനെ കവചത്തിന്റെ ചേർന്ന ഭാഗങ്ങൾക്കും നെഞ്ചുകവചത്തിനും ഇടയിൽ[b] തട്ടി. അപ്പോൾ രാജാവ് തന്റെ തേരാളിയോട് പറഞ്ഞു: “രഥം തിരിച്ച്[c] എന്നെ പാളയത്തിൽനിന്ന് പുറത്തുകൊണ്ടുപോകുക; എനിക്കു മുറിവേറ്റിരിക്കുന്നു[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദത്തിന് “തന്റെ നിഷ്കളങ്കതയിൽ,” “ഉന്നംവെക്കാതെ,” അല്ലെങ്കിൽ “യാദൃച്ഛികമായി” എന്നും അർഥമാകാം; ഇവിടെ ഒരു പ്രത്യേക ലക്ഷ്യം ഉന്നംവെക്കാതെ അമ്പെയ്തു എന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ദെബാഖീമിനും ശിര്യോനും ഇടയിൽ.” ഇവ കവചത്തിന്റെ ഏതോ രണ്ടു ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദങ്ങളായിരിക്കാം; അവയുടെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: cultural_note
  - marker: c
    text: എബ്രായത്തിൽ “നിന്റെ കൈ തിരിക്കുക”; രഥത്തെ തിരിച്ചുനയിക്കാനുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: d
    text: എബ്രായക്രിയയ്ക്ക് “രോഗിയായിരിക്കുക” എന്നും “മുറിവേറ്റിരിക്കുക” എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ മുറിവേറ്റിരിക്കുന്നു എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: എന്നാൽ ഒരാൾ
  rationale: മുൻസന്ദർഭത്തിലെ രാജാവിന്റെ വേഷമാറ്റശ്രമത്തിന് വിരുദ്ധമായി സംഭവിക്കുന്ന അപ്രതീക്ഷിത വഴിത്തിരിവ് സൂചിപ്പിക്കാൻ וְ എന്ന സംയോജകത്തെ ‘എന്നാൽ’ എന്നു നൽകി; אִישׁ എന്നത് പേരറിയാത്ത ഒരാളെ സൂചിപ്പിക്കുന്നു.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: വില്ലുകുലച്ചു
  rationale: വില്ലിന്റെ ഞാൺ വലിച്ച് അമ്പെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള തുല്യം.
- source_word: לְתֻמּוֹ
  choice: ലക്ഷ്യം നോക്കാതെ
  rationale: യുദ്ധസന്ദർഭത്തിൽ ഒരു പ്രത്യേക വ്യക്തിയെ ഉന്നംവെക്കാതെയോ അറിയാതെയോ അമ്പെയ്തു എന്ന ആശയം നൽകുന്നു; ധാർമികമായ ‘നിഷ്കളങ്കത’ എന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: וַיַּכֶּה
  choice: അമ്പ് ... കൊണ്ടു
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/കൊള്ളുക’ എന്ന സംഭവാർഥം മലയാളത്തിലെ അമ്പെയ്ത്തുസന്ദർഭത്തിന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മുറിവിന്റെ ഫലം പിന്നീട് പ്രത്യേകം പറയുന്നു.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: കവചത്തിലെ ചേർന്ന ഭാഗങ്ങൾക്കും മാറുകവചത്തിനും ഇടയിൽ
  rationale: രണ്ടു സാങ്കേതിക കവചനാമങ്ങളുടെയും കൃത്യമായ രൂപം അനിശ്ചിതമായതിനാൽ, കവചഘടകങ്ങൾ ചേരുന്ന ദുർബലമായ ഇടം എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്ന സൂക്ഷ്മമായ വിവർത്തനം.
- source_word: לְרַכָּבוֹ
  choice: തന്റെ തേരാളിയോട്
  rationale: രഥത്തെ നിയന്ത്രിക്കുന്ന വ്യക്തിയെയാണ് രൂപം സൂചിപ്പിക്കുന്നത്; ‘തേരാളി’ ആ ചുമതല വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപദമാണ്.
- source_word: הֲפֹךְ יָדְךָ
  choice: രഥം തിരിച്ച്
  rationale: അക്ഷരാർഥം ‘നിന്റെ കൈ തിരിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ കൈകൊണ്ട് രഥത്തെ തിരിച്ചുനയിക്കാനുള്ള ആജ്ഞയാണ്; ലക്ഷ്യഭാഷയിൽ വ്യക്തതയ്ക്കായി പ്രവർത്തി നേരിട്ട് പറഞ്ഞു.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: എന്നെ യുദ്ധക്കളത്തിൽനിന്ന് പുറത്തുകൊണ്ടുപോകുക
  rationale: מַחֲנֶה എന്നതിന് പാളയം, സൈന്യം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ സജീവമായ യുദ്ധമേഖലയെയാണ് ഉദ്ദേശിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം തിരഞ്ഞെടുത്തു.
- source_word: כִּי הָחֳלֵיתִי
  choice: എനിക്കു മുറിവേറ്റിരിക്കുന്നു
  rationale: ക്രിയയ്ക്ക് രോഗബാധിതനാകുക അല്ലെങ്കിൽ ദുർബലനാകുക എന്ന വിശാലാർഥമുണ്ടെങ്കിലും, അമ്പേറ്റ ഉടനെയുള്ള സന്ദർഭത്തിൽ മുറിവേറ്റ അവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്; മൂലത്തിൽ ഇല്ലാത്ത ‘ഗുരുതരമായി’ ചേർത്തിട്ടില്ല.
