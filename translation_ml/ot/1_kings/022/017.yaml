source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇസ്രായേൽ മുഴുവനും ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ മലകളിൽ ചിതറിക്കിടക്കുന്നതു ഞാൻ കണ്ടു. യാഹ്‌വേ പറഞ്ഞു: ‘ഇവർക്കു യജമാനനില്ല[a]. ഓരോ പുരുഷനും അവനവന്റെ വീട്ടിലേക്കു സമാധാനത്തോടെ മടങ്ങിപ്പോകട്ടെ[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഇവർക്കു യജമാനന്മാരില്ല”; ഹീബ്രുവിൽ പദം ബഹുവചനരൂപത്തിലാണ്. സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിനു ഭരണത്തലവൻ ഇല്ലാതാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഓരോരുത്തനും അവനവന്റെ വീട്ടിലേക്കു സമാധാനത്തോടെ മടങ്ങിപ്പോകട്ടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: ചിതറിക്കിടക്കുന്നത്
  rationale: പוץ എന്ന ധാതുവിന്റെ കർമണി വർത്തമാനകൃദന്തരൂപം പരന്നുകിടക്കുന്നതോ ചിതറിപ്പോയിരിക്കുന്നതോ സൂചിപ്പിക്കുന്നു; ദർശനത്തിലെ നേതാവില്ലാത്ത സൈന്യത്തിന്റെ സ്ഥിതി സ്വാഭാവിക മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു.
- source_word: אֶל הֶהָרִים
  choice: മലകളിൽ
  rationale: אֶל സാധാരണയായി ദിശ സൂചിപ്പിക്കുമെങ്കിലും, ചിതറലിനോടും സ്ഥലവിവരണത്തോടും ചേർന്നിരിക്കുന്ന ഇവിടെ സന്ദർഭപരമായി സ്ഥലാർത്ഥമാണ്.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: ഇടയനില്ലാത്ത ആടുകളെപ്പോലെ
  rationale: മൂലത്തിലെ പരിചിതമായ ഉപമയും ഇടയന്റെ അഭാവം സൂചിപ്പിക്കുന്ന അസ്തിത്വപ്രയോഗവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: אֲדֹנִים
  choice: യജമാനൻ
  rationale: ഹീബ്രുവിൽ രൂപം ബഹുവചനമാണെങ്കിലും, സന്ദർഭം ഇസ്രായേലിന്റെ ഭരണത്തലവനായ രാജാവിന്റെ അഭാവത്തിലേക്കാണ് ചൂണ്ടുന്നത്. മലയാളത്തിലെ ഏകവചന പ്രയോഗം ഈ സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; ബഹുവചനരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ഓരോ പുരുഷനും അവനവന്റെ വീട്ടിലേക്കു മടങ്ങിപ്പോകട്ടെ
  rationale: ക്രിയയുടെ സന്ദർഭപരമായ ആജ്ഞാനുവാദഭാവവും אִישׁ എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ വിതരണാർത്ഥവും നിലനിർത്തുന്നു.
- source_word: בְּשָׁלוֹם
  choice: സമാധാനത്തോടെ
  rationale: שָׁלוֹם എന്ന പദത്തിന്റെ സമാധാനം/ക്ഷേമം എന്ന അടിസ്ഥാനാർത്ഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ‘സുരക്ഷിതമായി’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരംവയ്ക്കുന്നില്ല. ആധുനിക മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി മനസ്സിലാകുന്ന ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: אֲדֹנִים എന്ന പദത്തിന്റെ വചനവും സന്ദർഭാർത്ഥവും
  choice: ഇവർക്കു യജമാനനില്ല
  alternative: ഇവർക്കു യജമാനന്മാരില്ല
  rationale: പദരൂപം ബഹുവചനമാണെങ്കിലും, ദർശനത്തിന്റെ സന്ദർഭത്തിൽ കൊല്ലപ്പെടാനിരിക്കുന്ന രാജാവെന്ന ഏക ഭരണത്തലവന്റെ അഭാവമാണ് പ്രധാന സൂചന. യഥാർത്ഥ രൂപത്തിലെ ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אִישׁ എന്ന വിതരണപ്രയോഗത്തിലെ ലിംഗം
  choice: ഓരോ പുരുഷനും
  alternative: ഓരോരുത്തനും
  rationale: യുദ്ധസൈന്യത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിലും മൂലത്തിലെ വ്യക്തമായ പുരുഷലിംഗരൂപത്തിലും അധിഷ്ഠിതമായി ലിംഗസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. ദർശനഭാഷയുടെ ദൃശ്യതയ്ക്കായി ‘ചിതറിക്കിടക്കുന്നത്’ എന്നും ആജ്ഞാനുവാദഭാവത്തിനായി ‘മടങ്ങിപ്പോകട്ടെ’ എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
