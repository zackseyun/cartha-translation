source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ml
  text: ആഹാബിന്റെ ശേഷിച്ച പ്രവൃത്തികളും അവൻ ചെയ്തതൊക്കെയും അവൻ പണിത ആനക്കൊമ്പിന്റെ ഭവനവും[a] അവൻ പണിത എല്ലാ നഗരങ്ങളും—ഇവയെല്ലാം ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ എഴുതിയിട്ടില്ലേ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ആനക്കൊമ്പിന്റെ ഭവനം.’ കെട്ടിടം മുഴുവനും ആനക്കൊമ്പുകൊണ്ട് നിർമിച്ചതെന്നതിലുപരി, ആനക്കൊമ്പുകൊണ്ട് അലങ്കരിച്ച ഒരു രാജകീയ മന്ദിരത്തെയായിരിക്കാം ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം’ രാജാക്കന്മാരുടെ പുസ്തകത്തിൽ ഉദ്ധരിക്കുന്ന ഒരു രാജകീയ രേഖാസ്രോതസ്സാണ്; അത് ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകം തന്നെയായിരിക്കണമെന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: ആഹാബിന്റെ ശേഷിച്ച പ്രവൃത്തികൾ
  rationale: രാജാവിന്റെ ഭരണകാലത്തെ ശേഷിച്ച പ്രവർത്തനങ്ങളെയും സംഭവങ്ങളെയും സൂചിപ്പിക്കുന്ന പതിവ് ചരിത്രസംഗ്രഹപ്രയോഗമാണ്; ‘പ്രവൃത്തികൾ’ എന്നത് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: അവൻ ചെയ്തതൊക്കെയും
  rationale: עשה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ അനാവശ്യമായി പ്രത്യേകവത്കരിക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: בֵּית הַשֵּׁן
  choice: ആനക്കൊമ്പിന്റെ ഭവനം
  rationale: ‘ആനക്കൊമ്പിന്റെ ഭവനം’ എന്ന ഉറവിടപ്രയോഗം നിലനിർത്തുന്നു; കെട്ടിടം മുഴുവനും ആനക്കൊമ്പുകൊണ്ടായിരുന്നു എന്നു വ്യാഖ്യാനിക്കാതെ, അതിന്റെ കൃത്യമായ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: അവൻ പണിത എല്ലാ നഗരങ്ങളും
  rationale: עָרִים എന്നതിന്റെ സാധാരണ അർഥമായ ‘നഗരങ്ങൾ’ സ്വീകരിക്കുകയും ആവർത്തിച്ചിരിക്കുന്ന ‘അവൻ പണിത’ എന്ന ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ഇവയെല്ലാം ... എഴുതിയിട്ടില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന എബ്രായ ആലങ്കാരികചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകം
  rationale: രാജകീയ രേഖാസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്ന ശീർഷകം ചുരുക്കവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു; ബൈബിളിലെ ദിനവൃത്താന്തപുസ്തകങ്ങളുമായി നിർബന്ധമായി തുല്യപ്പെടുത്തുന്നില്ല.
