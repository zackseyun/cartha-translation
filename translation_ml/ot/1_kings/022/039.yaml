  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ചരിത്രവിവരണശൈലി. എബ്രായത്തിലെ പട്ടികാസ്വഭാവമുള്ള വാക്യഘടനയും അവസാനത്തെ ആലങ്കാരികചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു.
