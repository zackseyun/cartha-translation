id: 1KI.22.18
reference: 1 Kings 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ രാജാവ് യെഹോശാഫാത്തിനോടു പറഞ്ഞു: “അവൻ എന്നെക്കുറിച്ച് നന്മ പ്രവചിക്കുകയില്ല, തിന്മ മാത്രമേ പ്രവചിക്കൂ എന്നു ഞാൻ നിന്നോടു പറഞ്ഞില്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിന്മ’ എന്നതിനു ‘ദുരന്തം.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘നന്മ ... തിന്മ മാത്രം’ എന്നാണ്; ഇവിടെ ഇത് അനുകൂലമല്ലാത്തതോ ദുരന്തം അറിയിക്കുന്നതോ ആയ പ്രവചനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: സംസാരിക്കുന്നയാളെ എബ്രായമൂലത്തിലുള്ള പദവിയാൽതന്നെ തിരിച്ചറിയിക്കുന്നു; ‘ആഹാബ്’ എന്നു പേര് ചേർക്കുന്നില്ല.
- source_word: אֶל יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്തിനോടു
  rationale: അഭിസംബോധനയുടെ പരോക്ഷ കർമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത രാജപദവി ചേർക്കുന്നില്ല.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറഞ്ഞില്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന, കുറ്റപ്പെടുത്തൽഭാവമുള്ള അലങ്കാരചോദ്യത്തെ മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יִתְנַבֵּא
  choice: പ്രവചിക്കൂ
  rationale: മുൻപ് പറഞ്ഞിരുന്ന പ്രതീക്ഷിതമോ പതിവായതോ ആയ പ്രവൃത്തിയെ ഉദ്ധരിക്കുന്ന സാഹചര്യത്തിൽ, മലയാളത്തിലെ ഉദ്ധരണിവാക്യത്തിൽ സ്വാഭാവികമായ ഭാവിരൂപം ഉപയോഗിക്കുന്നു.
- source_word: עָלַי
  choice: എന്നെക്കുറിച്ച്
  rationale: പ്രസംഗത്തിന്റെയോ പ്രവചനത്തിന്റെയോ വിഷയം സൂചിപ്പിക്കുന്ന עַל എന്ന പദത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: טוֹב ... רָע
  choice: നന്മ ... തിന്മ
  rationale: എബ്രായത്തിലെ കടുത്ത വിപരീതപദജോടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇവ അനുകൂലവും പ്രതികൂലവുമായ പ്രവചനഫലങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മുഖ്യപാഠത്തിൽ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: כִּי אִם
  choice: അല്ല, ... മാത്രമേ
  rationale: നിഷേധത്തിനു പിന്നാലെയുള്ള പ്രത്യേകവിരുദ്ധത മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകപരാതിയിൽ רָע എന്ന പദത്തിന്റെ അർഥം
  choice: തിന്മ
  alternative: ദുരന്തം
  rationale: ‘നന്മ ... തിന്മ’ എന്ന മൂലഭാഷയിലെ വിപരീതത നിലനിർത്തുകയും പദത്തെ ഒരു പ്രത്യേക ദുരന്തഫലമായി മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു. ഇവിടെ പ്രതികൂലമോ വിനാശകരമോ ആയ പ്രവചനം ഉദ്ദേശിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ കുറ്റപ്പെടുത്തൽഭാവവും മൂലത്തിലെ നന്മ/തിന്മ എന്ന തുറന്ന അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിട്ടുണ്ട്.
