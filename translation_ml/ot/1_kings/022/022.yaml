  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഞാൻ പുറപ്പെട്ട് അവന്റെ എല്ലാ പ്രവാചകന്മാരുടെയും വായിൽ കള്ളം പറയുന്ന ആത്മാവായിരിക്കും[a].” അപ്പോൾ അവൻ പറഞ്ഞു: “നീ അവനെ വശീകരിക്കും[b]; അതിൽ നീയും വിജയിക്കും. പുറപ്പെട്ട് അങ്ങനെ ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വ്യാജത്തിന്റെ ആത്മാവ്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നീ അവനെ വഞ്ചിക്കും” അല്ലെങ്കിൽ “നീ അവനെ സമ്മതിപ്പിക്കും.” സന്ദർഭമനുസരിച്ച് എബ്രായക്രിയയ്ക്ക് വശീകരിക്കുക, സമ്മതിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: ഞാൻ പുറപ്പെടും
  rationale: יצא എന്ന ക്രിയയുടെ ഭാവി/ഉദ്ദേശ്യാർഥവും, പിന്നീട് വരുന്ന צֵא എന്ന കല്പനയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: וְהָיִיתִי
  choice: ആയിരിക്കും
  rationale: ആത്മാവ് ഏറ്റെടുക്കാൻ പോകുന്ന പങ്കിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആയിത്തീരും’ എന്നു പറഞ്ഞ് അനാവശ്യമായ അവസ്ഥാമാറ്റം ഊന്നുന്നില്ല.
- source_word: רוּחַ שֶׁקֶר
  choice: കള്ളം പറയുന്ന ആത്മാവ്
  rationale: ശקרിന്റെ അസത്യ/വഞ്ചനാ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘വ്യാജത്തിന്റെ ആത്മാവ്’ എന്ന കൂടുതൽ രൂപനിഷ്ഠമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: בְּפִי
  choice: വായിൽ
  rationale: പ്രവാചകന്മാരിലൂടെ പുറപ്പെടുന്ന വാക്കിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി നിലനിർത്തുന്നു.
- source_word: כָּל נְבִיאָיו
  choice: അവന്റെ എല്ലാ പ്രവാചകന്മാരുടെയും
  rationale: כָּל എന്നതിന്റെ സമഗ്രതയും മൂന്നാംപുരുഷ ഏകവചന ഉടമസ്ഥപ്രത്യയവും നേരിട്ട് നൽകുന്നു.
- source_word: תְּפַתֶּה
  choice: നീ അവനെ വശീകരിക്കും
  rationale: פִּתָּה എന്ന ക്രിയയിലെ പ്രേരണ, വശീകരണം, വഞ്ചന എന്നീ അർഥപരിധികളിൽ, നാശത്തിലേക്കുള്ള തീരുമാനത്തിലേക്ക് ആഹാബിനെ നയിക്കുന്ന ഈ സന്ദർഭത്തിന് ‘വശീകരിക്കും’ യോജിക്കുന്നു. മൂലത്തിൽ വ്യക്തമാക്കാത്ത കർമം സന്ദർഭത്തിൽനിന്ന് ‘അവനെ’ എന്ന് ചേർത്തിരിക്കുന്നു.
- source_word: וְגַם תּוּכָל
  choice: അതു സാധിക്കുകയും ചെയ്യും
  rationale: יכל എന്നതിലെ കഴിവും ഫലപ്രാപ്തിയും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വിജയിക്കും’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ‘കഴിയും’ എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: צֵא
  choice: പുറപ്പെടുക
  rationale: ആദ്യത്തെ ‘ഞാൻ പുറപ്പെടും’ എന്ന പ്രയോഗത്തോടുള്ള ആവർത്തനബന്ധം നിലനിർത്തുന്നു.
- source_word: וַעֲשֵׂה כֵן
  choice: അങ്ങനെ ചെയ്യുക
  rationale: עשה כן എന്ന കല്പനയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: വഞ്ചന ഉൾപ്പെടുന്ന സ്വർഗീയ സംഭാഷണത്തിൽ ദൈവിക അനുമതിയോ നിയോഗമോ എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ആത്മാവ് കള്ളം പറയുന്ന ആത്മാവാകാൻ നിർദേശിക്കുന്നതും, മറുപടിയായി അവൻ വശീകരിക്കുമെന്നും അതു സാധിക്കുമെന്നും പറഞ്ഞ് അങ്ങനെ ചെയ്യാൻ കല്പിക്കുന്നതുമായ നേരിട്ടുള്ള സംഭാഷണമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് വെറും നിർവീര്യമായ അനുമതിയെന്നു തോന്നുന്നവിധം ഭാഷ മൃദുവാക്കുക.
  rationale: എബ്രായത്തിലെ ക്രിയകളും കല്പനയും നേരിട്ടുള്ളവയാണ്. ദൈവിക പരമാധികാരവും രണ്ടാംനില പ്രവർത്തകന്റെ വഞ്ചനയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വ്യാഖ്യാനത്തിലൂടെ ഇല്ലാതാക്കാതെ വാക്യം പറയുന്നതുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായിൽ’ എന്ന എബ്രായ രൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തി; പഴഞ്ചൻ പദപ്രയോഗങ്ങളും മതവിഭാഗസവിശേഷമായ ഭാഷയും ഒഴിവാക്കി.
