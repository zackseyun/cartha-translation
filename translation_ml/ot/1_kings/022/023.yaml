reference: 1 Kings 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, യഹോവ നിന്റെ ഈ പ്രവാചകന്മാരുടെയെല്ലാം വായിൽ വ്യാജം പറയുന്ന ഒരു ആത്മാവിനെ[a] വെച്ചിരിക്കുന്നു; യഹോവ നിനക്കെതിരെ അനർഥം പ്രഖ്യാപിച്ചിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അസത്യത്തിന്റെ ഒരു ആത്മാവിനെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹോവ നിനക്കെതിരെ ദുരന്തം പ്രഖ്യാപിച്ചിരിക്കുന്നു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം ന്യായവിധിയുടെ സന്ദർഭത്തിൽ അനർഥത്തെയോ ദുരന്തത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: സംഭാഷണത്തെ ഉടനെയുള്ള നിഗമനത്തിലേക്കു കൊണ്ടുപോകുന്ന കാലസൂചനയാണ്; മലയാളത്തിൽ സംയോജകഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന പ്രവാചകീയ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָתַן
  choice: വെച്ചിരിക്കുന്നു
  rationale: ‘ആത്മാവിനെ വായിൽ വെക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള ദൈവിക പ്രവർത്തനം നിലനിർത്തുന്നു; ‘അനുവദിച്ചു’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം.
- source_word: רוּחַ שֶׁקֶר
  choice: വ്യാജം പറയുന്ന ഒരു ആത്മാവ്
  rationale: ശקר എന്നതിന്റെ വഞ്ചനാത്മക സ്വഭാവവും ആത്മാവിന്റെ വ്യക്തിപരമായ പ്രവർത്തകഭാവവും വ്യക്തമായി നൽകുന്നു; നിർവ്യക്തമായ ‘വ്യാജത്തിന്റെ ആത്മാവ്’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: בְּפִי
  choice: വായിൽ
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപം പിന്നാലെയുള്ള ബഹുവചനസംഘത്തോടു വിതരണാർഥത്തിൽ പ്രവർത്തിക്കുന്നു; പ്രവാചകന്മാരുടെ വാക്കുകളിലൂടെയുള്ള പ്രവർത്തനത്തെ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: നിന്റെ ഈ പ്രവാചകന്മാരുടെയെല്ലാം
  rationale: രണ്ടാംപുരുഷ ഉടമസ്ഥതയും ‘ഈ’ എന്ന ചൂണ്ടിക്കാണിക്കൽ ഊന്നലും ‘എല്ലാം’ എന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: നിനക്കെതിരെ അനർഥം അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: דבר എന്ന സംസാരക്രിയയും עליך എന്ന പ്രതികൂല ദിശയും നിലനിർത്തുന്നു; רעה ഇവിടെ ധാർമിക തിന്മയല്ല, ന്യായവിധിയായി വരാനിരിക്കുന്ന ദോഷകരമായ അനർഥമാണ്.
theological_decisions:
- issue: യഹോവയുടെ പ്രവർത്തനത്തോടു ബന്ധപ്പെട്ട רָעָה എന്ന പദത്തിന്റെ അർഥം
  choice: അനർഥം
  alternative: തിന്മ; ദുരന്തം
  rationale: ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ പദം ധാർമിക തിന്മയെക്കാൾ വരാനിരിക്കുന്ന ദോഷം/വിപത്തിനെ സൂചിപ്പിക്കുന്നു. ‘അനർഥം’ മൂലപദത്തിന്റെ പ്രതികൂല വ്യാപ്തി നിലനിർത്തുകയും ദൈവം ധാർമിക തിന്മ ചെയ്യുന്നു എന്ന അനാവശ്യ അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: വ്യാജം പറയുന്ന ആത്മാവിന്റെ കാര്യത്തിൽ ദൈവിക പ്രവർത്തനം
  choice: യഹോവ ... ആത്മാവിനെ വെച്ചിരിക്കുന്നു
  alternative: യഹോവ ... ആത്മാവിനെ അനുവദിച്ചിരിക്കുന്നു
  rationale: נתן ദൈവത്തിന്റെ പ്രവർത്തനം നേരിട്ട് പ്രസ്താവിക്കുന്നു. ‘അനുവദിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ മൃദൂകരണം ചേർക്കാതെ വാക്യത്തിലെ ദൈവാധിപത്യവും വ്യാജാത്മാവിന്റെ പ്രവർത്തനവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും പ്രവാചകീയ ഊന്നലും പുലർത്തുന്ന മലയാളം. ‘ഇതാ’, ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ എന്നിവ ശൈലിയുടെ മാന്യത നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
