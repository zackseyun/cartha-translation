id: 1KI.22.14
reference: 1 Kings 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: ml
  text: 'മീഖായാവ് പറഞ്ഞു: “യഹ്‌വെ ജീവിക്കുന്നതുപോലെ,[a] യഹ്‌വെ എന്നോടു എന്തു പറയുന്നുവോ, അതുതന്നെ ഞാൻ പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “യഹ്‌വെ ജീവിക്കുന്നു.” ഇത് ഒരു സത്യപ്രതിജ്ഞാസൂത്രമാണ്.'
    reason: ഹീബ്രു സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ അക്ഷരാർഥവും പ്രവർത്തനവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രു കഥനത്തിലെ സാധാരണ wayyiqtol രൂപം. മലയാളത്തിൽ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ നിർബന്ധമില്ലാത്ത ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ ചേർത്തിട്ടില്ല.
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: മലയാള ബൈബിൾനാമങ്ങളുടെ പരിചിതമായ രൂപത്തോടു ചേർന്നുനിൽക്കുന്ന ലിപ്യന്തരണം; കർത്തൃവിഭക്തിക്കായി ‘-വ്’ ചേർത്തിരിക്കുന്നു.
- source_word: חַי יְהוָה
  choice: യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ
  rationale: ദൈവത്തിന്റെ ജീവനെയധിഷ്ഠാനമാക്കിയുള്ള solemn oath formula ആണിത്. അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികത ഒഴിവാക്കി, സത്യപ്രതിജ്ഞയുടെ ഗൗരവവും ശക്തിയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ചതുർവർണ ദൈവനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: כִּי אֵת אֲשֶׁר
  choice: …പറയുന്നതുതന്നെ
  rationale: ഇവിടെ സത്യപ്രതിജ്ഞയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന object-relative construction ആണ്. ‘തന്നെ’ എന്നത് പിന്നാലെയുള്ള resumptive pronoun ന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יֹאמַר ... אֵלַי
  choice: എന്നോടു പറയുന്നത്
  rationale: അപൂർണക്രിയയ്ക്ക് സാഹചര്യത്തിൽ ഭാവിസൂചനയുണ്ടെങ്കിലും, പൊതുവായ പ്രതിജ്ഞാവാക്യത്തിൽ മലയാള വർത്തമാനരൂപം സ്വാഭാവികവും അർഥസമഗ്രവുമാണ്.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: അതുതന്നെ ഞാൻ പറയും
  rationale: אֹתוֹ മുൻപുള്ള relative clause-ലേക്ക് മടങ്ങിച്ചൂണ്ടുന്നു. ‘തന്നെ’ ആ ബന്ധവും പരിമിതിയും വ്യക്തമാക്കുന്നു; אֲדַבֵּר ന്റെ ഭാവി പ്രതിജ്ഞ ‘ഞാൻ പറയും’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നത് മൂലത്തിലെ സവിശേഷത നിലനിർത്തുന്നു.
- issue: חַי יְהוָה എന്ന സത്യപ്രതിജ്ഞാസൂത്രത്തിന്റെ വ്യാഖ്യാനം
  choice: യഹ്‌വെ ജീവിച്ചിരിക്കുന്നതാണേ
  alternative: യഹ്‌വെ ജീവിക്കുന്നതുപോലെ / യഹ്‌വെയാണ
  rationale: വാക്യം ദൈവത്തിന്റെ ജീവനെയധിഷ്ഠാനമാക്കിയുള്ള പ്രതിജ്ഞയാണ്. ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ സത്യപ്രതിജ്ഞാസ്വഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘അരുളിച്ചെയ്യുക’ പോലുള്ള പഴയ ശൈലി ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന ‘പറയുക’ ഉപയോഗിച്ചു. സത്യപ്രതിജ്ഞയുടെ ഭാവം നിലനിർത്താൻ ‘ജീവിച്ചിരിക്കുന്നതാണേ’ എന്നും, പ്രവാചകൻ ദൈവം പറയുന്നതിൽനിന്ന് ഒന്നും കൂട്ടുകയില്ലെന്ന ഊന്നൽ നൽകാൻ ‘പറയുന്നതുതന്നെ’ എന്നും നൽകി.
