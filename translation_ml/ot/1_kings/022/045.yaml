lexical_decisions:
- source_word: וַ/יַּשְׁלֵם
  choice: സമാധാനം സ്ഥാപിച്ചു
  rationale: ശׁלם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ സമാധാനബന്ധം സ്ഥാപിക്കുന്നതിനെയോ സമാധാനത്തിലായിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ സംഭവാത്മക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കാൻ ‘സമാധാനം സ്ഥാപിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עִם
  choice: -മായി
  rationale: സമാധാനബന്ധത്തിലെ മറുകക്ഷിയെ സൂചിപ്പിക്കുന്ന ‘കൂടെ/ഒപ്പം’ എന്ന ബന്ധാർഥം മലയാളത്തിൽ സ്വാഭാവികമായ ‘-മായി’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: എബ്രായ സംയുക്തപദബന്ധം നിർദിഷ്ടനായ ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
