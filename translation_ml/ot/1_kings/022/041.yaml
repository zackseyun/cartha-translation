  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: ml
  text: ഇസ്രായേൽരാജാവായ ആഹാബിന്റെ വാഴ്ചയുടെ നാലാം വർഷത്തിൽ ആസായുടെ മകനായ യെഹോശാഫാത്ത് യെഹൂദയുടെ രാജാവായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘യെഹൂദയുടെമേൽ രാജാവായി.’'
    reason: עַל എന്ന പദത്തിലെ ‘മേൽ’ എന്ന ഭരണാധികാരസൂചന മുഖ്യവാചകത്തിലെ സ്വാഭാവിക മലയാളരൂപത്തിൽ നേരിട്ട് കാണാത്തതിനാൽ മൂലരൂപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി. വാക്യാരംഭത്തിലെ ו കഥാഖണ്ഡത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകമായി ‘അപ്പോൾ/കൂടാതെ’ എന്നു ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ അത് പ്രകടമാകുന്നു.
- source_word: בֶּן אָסָא
  choice: ആസായുടെ മകനായ
  rationale: വംശബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി രേഖപ്പെടുത്തുന്നു.
- source_word: מָלַךְ
  choice: രാജാവായി
  rationale: ഇവിടത്തെ ക്രിയ ഭരണകാലത്തിന്റെ ദൈർഘ്യത്തേക്കാൾ രാജസ്ഥാനപ്രാപ്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാണു’ എന്നതിനെക്കാൾ ‘രാജാവായി’ യോജിക്കുന്നു.
- source_word: עַל יְהוּדָה
  choice: യെഹൂദയുടെ രാജാവായി
  rationale: עַל രാജാധികാരത്തിന്റെ പരിധി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യെഹൂദയുടെ രാജാവായി’ എന്നത് ‘യെഹൂദയുടെമേൽ രാജാവായി’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: בִּ/שְׁנַת אַרְבַּע לְ/אַחְאָב
  choice: ആഹാബിന്റെ വാഴ്ചയുടെ നാലാം വർഷത്തിൽ
  rationale: രാജാക്കന്മാരുടെ ഭരണവർഷം അടിസ്ഥാനമാക്കിയുള്ള കാലനിർണ്ണയസൂത്രം മലയാളവായനക്കാർക്ക് വ്യക്തമായി ലഭിക്കാൻ മൂലത്തിൽ സന്ദർഭസൂചിതമായ ‘വാഴ്ചയുടെ’ എന്നു വ്യക്തമാക്കി.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവായ
  rationale: ആഹാബിനെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേര് സ്വാഭാവികമായ വിശേഷണഘടനയിൽ നൽകി.
