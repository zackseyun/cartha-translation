source:
  edition: WLC
  text: וַ/יֵּשְׁב֖וּ שָׁלֹ֣שׁ שָׁנִ֑ים אֵ֚ין מִלְחָמָ֔ה בֵּ֥ין אֲרָ֖ם וּ/בֵ֥ין יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: ml
  text: അരാമും ഇസ്രായേലും തമ്മിൽ യുദ്ധമില്ലാതെ മൂന്നു വർഷം കഴിഞ്ഞു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അരാമും ഇസ്രായേലും തമ്മിൽ മൂന്നു വർഷത്തേക്ക് യുദ്ധമുണ്ടായില്ല.’
    reason: lexical_alternative
  - marker: b
    text: ‘അരാം’ എന്നത് ചില വിവർത്തനങ്ങളിൽ ‘സിറിയ’ എന്നു നൽകിയിരിക്കുന്ന എബ്രായ നാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: കഴിഞ്ഞു
  rationale: ישׁב എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘ഇരിക്കുക/വസിക്കുക’ എന്നാണെങ്കിലും, കാലദൈർഘ്യത്തോടുകൂടിയ ഈ ചരിത്രവിവരണത്തിൽ ഒരു സ്ഥിതി തുടർന്നുനിന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മൂന്നു വർഷം കഴിഞ്ഞു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ തുടർച്ച പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: മൂന്നു വർഷം
  rationale: ഇത് കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; മലയാളത്തിൽ ‘മൂന്നു വർഷം’ എന്ന രൂപം അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵין מִלְחָמָה
  choice: യുദ്ധമില്ലാതെ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥം ‘യുദ്ധം ഇല്ല’ എന്നാണ്. ‘യുദ്ധമില്ലാതെ’ എന്ന രൂപം വാക്യഘടനയിൽ സ്വാഭാവികവും അർഥത്തിൽ വിശ്വസ്തവുമാണ്.
- source_word: בֵּין ... וּבֵין
  choice: … തമ്മിൽ
  rationale: രണ്ടു രാജ്യങ്ങൾക്കിടയിലെ ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘തമ്മിൽ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിന്നീടുള്ള ‘സിറിയ’ എന്ന ഭൂമിശാസ്ത്രനാമം പകരംവയ്ക്കാതെ എബ്രായ നാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: എബ്രായ വ്യക്തി/രാജ്യനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
