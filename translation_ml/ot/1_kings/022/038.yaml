  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: ml
  text: ശമര്യയിലെ കുളത്തിനരികിൽ രഥം കഴുകി. നായ്ക്കൾ അവന്റെ രക്തം നക്കിക്കുടിച്ചു; വേശ്യകൾ അവിടെ കുളിച്ചു[a]—യഹ്‌വെ അരുളിച്ചെയ്ത വചനപ്രകാരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേശ്യകൾ തങ്ങളെത്തന്നെ കഴുകി.” എബ്രായക്രിയയ്ക്ക് കർമം വ്യക്തമായി പറഞ്ഞിട്ടില്ല; “കഴുകി” എന്നും “കുളിച്ചു” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: രഥം കഴുകി
  rationale: ക്രിയ എബ്രായത്തിൽ മൂന്നാംപുരുഷ ഏകവചനത്തിലാണെങ്കിലും പ്രവർത്തകനെ പറയുന്നില്ല. മലയാളത്തിലെ പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത സ്വാഭാവിക പ്രയോഗം ഈ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: ശമര്യയിലെ കുളത്തിനരികിൽ
  rationale: עַל ഇവിടെ കഴുകൽ നടന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; ‘കുളത്തിനരികിൽ’ എന്നത് സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: നായ്ക്കൾ അവന്റെ രക്തം നക്കിക്കുടിച്ചു
  rationale: לָקַק എന്ന ക്രിയയുടെ നക്കുക/നക്കിക്കുടിക്കുക എന്ന സജീവ ദൃശ്യഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְהַזֹּנוֹת רָחָצוּ
  choice: വേശ്യകളും അവിടെ കുളിച്ചു
  rationale: זוֹנוֹת എന്നതിന് ആധുനികവും കൃത്യവുമായ ‘വേശ്യകൾ’ ഉപയോഗിച്ചു. רָחַץ എന്ന ക്രിയയ്ക്ക് ഇവിടെ കുളിക്കുക/കഴുകുക എന്നീ സാധ്യതകളുണ്ട്; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കുളിച്ചു’ നൽകി, ക്രിയയ്ക്ക് വ്യക്തമായ കർമം ഇല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: യഹ്‌വെ അരുളിച്ചെയ്ത വചനപ്രകാരംതന്നെ
  rationale: പ്രവചനനിവൃത്തിയുടെ ഔപചാരിക സൂത്രവാക്യം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; אֲשֶׁר דִּבֵּר എന്ന ബന്ധവാക്യവും ‘അരുളിച്ചെയ്ത’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പദവിനാമമാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- issue: וְהַזֹּנוֹת רָחָצוּ എന്ന സംക്ഷിപ്ത വാക്യത്തിന്റെ വ്യാഖ്യാനം
  choice: വേശ്യകളും അവിടെ കുളിച്ചു
  alternative: വേശ്യകളും അവിടെ കഴുകി / തങ്ങളെത്തന്നെ കഴുകി
  rationale: വേശ്യകളാണ് ക്രിയയുടെ കർത്താക്കൾ എന്നത് നിലനിർത്തുന്നു. എന്നാൽ എബ്രായക്രിയയുടെ കർമം വ്യക്തമല്ലാത്തതിനാൽ ‘തങ്ങളെത്തന്നെ’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്ത് അർത്ഥം അനാവശ്യമായി ഉറപ്പിച്ചിട്ടില്ല; മറ്റു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പ്രവർത്തകനെ പറയാത്ത ആദ്യക്രിയയും അവസാന ഉപവാക്യത്തിലെ കർമവ്യക്തതക്കുറവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
