  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
