reference: 1 Kings 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: ml
  text: 'എന്നാൽ യെഹോശാഫാത്ത് പറഞ്ഞു[a]: “നമുക്ക് അവനോടു ചോദിച്ചറിയാൻ യഹോവയുടെ ഒരു പ്രവാചകൻ ഇനിയും ഇവിടെ ഇല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നമുക്ക് അവനോടു ചോദിച്ചറിയാൻ യഹോവയുടെ മറ്റൊരു പ്രവാചകൻ ഇവിടെ ഇനിയും ഇല്ലേ?”'
    reason: עוֹד എന്നതിന് സന്ദർഭത്തിൽ ‘മറ്റൊരു’ എന്ന അർഥം വരാവുന്ന പദപരമായ മറ്റൊരു സാധ്യത.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ ... പറഞ്ഞു
  rationale: വാവ് തുടർകഥനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻവാക്യത്തിലെ പ്രവാചകസംഘത്തോടുള്ള ആശ്രയത്തിൽനിന്ന് യെഹോശാഫാത്തിന്റെ ചോദ്യം വ്യത്യസ്തമാകുന്നതിനാൽ സന്ദർഭത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം സ്വീകരിച്ചു.
- source_word: הַאֵין
  choice: ഇല്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פֹּה
  choice: ഇവിടെ
  rationale: ലളിതമായ സ്ഥലവാചകത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: נָבִיא
  choice: ഒരു പ്രവാചകൻ
  rationale: ദൈവത്തിനുവേണ്ടി സംസാരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാള പദം.
- source_word: לַיהוָה
  choice: യഹോവയുടെ
  rationale: ലാമെദ് ഇവിടെ ബന്ധമോ ചേർച്ചയോ സൂചിപ്പിക്കുന്നു; യഹോവയോടു ബന്ധപ്പെട്ട് അവനുവേണ്ടി സംസാരിക്കുന്ന പ്രവാചകൻ എന്ന അർഥം മലയാളത്തിലെ ബന്ധിവിഭക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עוֹד
  choice: ഇനിയും
  rationale: കൂടുതലായി ഒരാൾ ലഭ്യമാണോ എന്ന അർഥം നിലനിർത്തുന്നു; ‘മറ്റൊരു’ എന്ന സന്ദർഭോചിത വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: וְנִדְרְשָׁה
  choice: നമുക്ക് ... ചോദിച്ചറിയാൻ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന കോഹോർട്ടേറ്റീവിന്റെ ഉദ്ദേശ്യവും ആഗ്രഹഭാവവും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵאֹתוֹ
  choice: അവനോടു
  rationale: അക്ഷരാർഥത്തിലെ ‘അവനിൽനിന്ന്’ എന്ന ആശയം, ഒരു പ്രവാചകനോട് ദൈവഹിതം ചോദിച്ചറിയുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമായി നൽകുന്നു; പ്രവാചകന്റെ മധ്യസ്ഥപങ്ക് അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിൽ ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: עוֹד എന്ന പദം അധിക പ്രവാചകനെയാണോ തുടർന്നുള്ള ലഭ്യതയെയാണോ ഊന്നുന്നത്
  choice: ഇനിയും
  alternative: മറ്റൊരു
  rationale: എബ്രായപദത്തിന്റെ വിശാലമായ ‘ഇനിയും/കൂടുതലായി’ എന്ന അർഥം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സാധ്യമായ ‘മറ്റൊരു പ്രവാചകൻ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചോദ്യത്തിന്റെ സ്ഥിരീകരണഭാവവും പ്രവാചകനോടു ചോദിച്ചറിയാനുള്ള കൂട്ടായ ആഗ്രഹവും സംരക്ഷിച്ചിട്ടുണ്ട്.
