id: 1KI.22.5
reference: 1 Kings 22:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: ml
  text: 'യെഹോശാഫാത്ത് ഇസ്രായേൽരാജാവിനോടു പറഞ്ഞു: “ദയവായി, ഇന്ന് യാഹ്‌വേയുടെ വചനം അന്വേഷിക്കണമേ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യാഹ്‌വേയുടെ വചനം തേടണമേ”; അല്ലെങ്കിൽ, “ഒരു അരുളപ്പാടിനായി യാഹ്‌വേയോടു ചോദിച്ചറിയണമേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ വേറെ ‘അപ്പോൾ’ ചേർക്കാതെ ‘പറഞ്ഞു’ എന്നു നൽകുന്നത് മതിയാകും.
- source_word: יְהוֹשָׁפָט
  choice: യഹോശാഫാത്ത്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവിനോടു
  rationale: ‘ഇസ്രായേലിന്റെ രാജാവിനോടു’ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; രാജപദവി നിലനിർത്തുന്നു.
- source_word: דְּרָשׁ
  choice: അന്വേഷിക്കണമേ
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവിക മാർഗനിർദേശം തേടുക, അരുളപ്പാട് ചോദിച്ചറിയുക എന്ന അർഥം. ‘അന്വേഷിക്കുക’ മൂലപദത്തിന്റെ ‘തേടുക/ചോദിച്ചറിയുക’ എന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: נָא
  choice: ദയവായി … -ണമേ
  rationale: അഭ്യർഥനയുടെയും വിനയത്തിന്റെയും ഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כַיּוֹם
  choice: ഇന്ന്
  rationale: അന്നുതന്നെ ചോദിച്ചറിയണമെന്ന സമയസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אֶת דְּבַר יְהוָה
  choice: യഹോവയുടെ അരുളപ്പാട്
  rationale: דָּבָר എന്നത് ഇവിടെ പ്രവാചകമായി ലഭിക്കുന്ന ദൈവവചനത്തെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു. സാധാരണ ‘വാക്ക്’ എന്നതിനെക്കാൾ ‘അരുളപ്പാട്’ ഈ സന്ദർഭത്തിലെ ദൈവിക സന്ദേശഭാവം സ്വാഭാവികമായി നൽകുന്നു; പാഠം ‘വചനം അന്വേഷിക്കുക’ എന്നും ‘യഹോവയോട് അരുളപ്പാട് ചോദിച്ചറിയുക’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ ആ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയാൽ മാറ്റാതെ, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം പദവിയായി മാറ്റുന്നില്ല. മലയാള വായനക്കാർക്കു വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചെങ്കിലും, ഹീബ്രു ഉച്ചാരണത്തിന്റെ പുനർനിർമാണമായി ‘യാഹ്‌വേ’ ഉപയോഗിക്കാമെന്ന സാധ്യത അംഗീകരിക്കുന്നു.
- issue: דְּרָשׁ ... אֶת דְּבַר יְהוָה എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: യഹോവയുടെ അരുളപ്പാട് അന്വേഷിക്കുക
  alternative: ഒരു അരുളപ്പാടിനായി യഹോവയോട് ചോദിച്ചറിയുക
  rationale: നേരിട്ടുള്ള വ്യാകരണഘടനയിൽ ‘യഹോവയുടെ വചനം/അരുളപ്പാട്’ ആണ് അന്വേഷിക്കപ്പെടുന്ന വസ്തു. എന്നാൽ സന്ദർഭത്തിൽ യഹോവയെ സമീപിച്ച് ദൈവിക സന്ദേശം ചോദിച്ചറിയുക എന്ന ആശയവും ഉൾപ്പെടുന്നു; അതിനാൽ വ്യാഖ്യാനത്തെ ഏകപക്ഷീയമായി ഉറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ പകരംവായന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജസഭാ സംഭാഷണത്തിന് യോജിച്ച വിനയം ‘ദയവായി … -ണമേ’ എന്നതിലൂടെ നിലനിർത്തി; അത്യന്തം പഴഞ്ചനായ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
