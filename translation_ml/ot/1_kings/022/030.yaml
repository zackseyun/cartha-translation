source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/בֹ֣א בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּב֖וֹא בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ രാജാവ് യെഹോശാഫാത്തിനോട് പറഞ്ഞു: “ഞാൻ വേഷംമാറി യുദ്ധത്തിൽ പ്രവേശിക്കും[a]; എന്നാൽ നീ നിന്റെ വസ്ത്രങ്ങൾ ധരിക്കുക.” അങ്ങനെ ഇസ്രായേൽ രാജാവ് വേഷംമാറി യുദ്ധത്തിൽ പ്രവേശിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായരൂപം “നീ വേഷംമാറി യുദ്ധത്തിൽ പ്രവേശിക്കുക” എന്ന ആജ്ഞയായും മനസ്സിലാക്കാം. എന്നാൽ തുടർന്ന് “ഇസ്രായേൽ രാജാവ് വേഷംമാറി” എന്നു പറയുന്നതിനാൽ, “ഞാൻ വേഷംമാറി യുദ്ധത്തിൽ പ്രവേശിക്കും” എന്ന അർത്ഥത്തിനാണ് സന്ദർഭത്തിൽ കൂടുതൽ പിന്തുണ.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבֹא
  choice: ഞാൻ വേഷംമാറി യുദ്ധത്തിൽ പ്രവേശിക്കാം
  rationale: രൂപം ഒറ്റയ്ക്ക് നോക്കുമ്പോൾ രണ്ടാംപുരുഷ ആജ്ഞയായും ഒന്നാംപുരുഷ ഉദ്ദേശപ്രകടനമായും ഗ്രഹിക്കാവുന്നതാണ്. എന്നാൽ പിന്നാലെ രാജാവുതന്നെ വേഷംമാറിയെന്ന വിവരണം വരുന്നതിനാൽ, സംസാരിക്കുന്നവന്റെ പദ്ധതിയായി വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തോട് കൂടുതൽ യോജിക്കുന്നു.
- source_word: בַמִּלְחָמָה
  choice: യുദ്ധത്തിൽ
  rationale: בוא എന്ന ചലനക്രിയയോടൊപ്പം യുദ്ധരംഗത്തേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു; ‘യുദ്ധത്തിൽ പ്രവേശിക്കുക’ സ്വാഭാവികവും അർത്ഥവ്യക്തവുമായ മലയാളമാണ്.
- source_word: וְאַתָּה
  choice: എന്നാൽ നീ
  rationale: രാജാവ് വേഷംമാറുന്നതും യെഹോശാഫാത്ത് സ്വന്തം വസ്ത്രം ധരിക്കുന്നതും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: നിന്റെ രാജവസ്ത്രം ധരിക്കുക
  rationale: בְּגָדִים പൊതുവിൽ വസ്ത്രങ്ങൾ എന്നാണെങ്കിലും, വേഷംമാറ്റത്തോടുള്ള ഈ രാജകീയ സന്ദർഭത്തിലെ വിരോധം ദൃശ്യമാക്കാൻ ‘രാജവസ്ത്രം’ യോജിക്കുന്നു.
- source_word: וַיִּתְחַפֵּשׂ
  choice: വേഷംമാറി
  rationale: രാജാവ് തന്റെ തിരിച്ചറിയൽ മറച്ചുവെച്ച പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: യുദ്ധത്തിൽ പ്രവേശിച്ചു
  rationale: ആദ്യ വാക്യത്തിലെ പദ്ധതിയും തുടർന്നുള്ള നടപ്പാക്കലും തമ്മിലുള്ള പദാവർത്തനബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: הִתְחַפֵּשׂ എന്ന രൂപത്തിന്റെ പുരുഷസംബന്ധിയായ അനിശ്ചിതത്വം
  choice: 'ഒന്നാംപുരുഷ ഉദ്ദേശമായി: ‘ഞാൻ വേഷംമാറി ... പ്രവേശിക്കാം’'
  alternative: 'രണ്ടാംപുരുഷ ആജ്ഞയായി: ‘നീ വേഷംമാറി ... പ്രവേശിക്കുക’'
  rationale: തുടർന്നുള്ള וַיִּתְחַפֵּשׂ מֶלֶךְ יִשְׂרָאֵל (‘ഇസ്രായേൽരാജാവ് വേഷംമാറി’) സംസാരിച്ച രാജാവിന്റെ സ്വന്തം പദ്ധതിയാണ് ഇതെന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും രൂപപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വേഷംമാറുക’, ‘യുദ്ധത്തിൽ പ്രവേശിക്കുക’, ‘രാജവസ്ത്രം’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്; ഉറവിടത്തിലെ യഥാർഥ വ്യാകരണാനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
