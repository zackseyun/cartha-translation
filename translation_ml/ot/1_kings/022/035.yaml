  edition: WLC
  text: וַ/תַּעֲלֶ֤ה הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הַ/מֶּ֗לֶךְ הָיָ֧ה מָעֳמָ֛ד בַּ/מֶּרְכָּבָ֖ה נֹ֣כַח אֲרָ֑ם וַ/יָּ֣מָת בָּ/עֶ֔רֶב וַ/יִּ֥צֶק דַּֽם הַ/מַּכָּ֖ה אֶל חֵ֥יק הָ/רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: ml
  text: അന്ന് യുദ്ധം രൂക്ഷമായി[a]. രാജാവിനെ അരാമിന് അഭിമുഖമായി രഥത്തിൽ നിൽക്കുമാറ് നിലനിർത്തിയിരുന്നു[b]. വൈകുന്നേരം അവൻ മരിച്ചു; മുറിവിൽനിന്നുള്ള രക്തം രഥത്തിന്റെ അകത്തെ താഴ്ഭാഗത്തേക്ക് ഒഴുകി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “അന്ന് യുദ്ധം ശക്തിപ്പെട്ടു”; കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അന്ന് യുദ്ധം കയറിപ്പോയി.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “രാജാവ് രഥത്തിൽ നിന്നു.” ഹീബ്രായ രൂപം, അവനെ നിൽക്കുമാറ് നിലനിർത്തിയെന്നോ അങ്ങനെ നിർത്തിയെന്നോ സൂചിപ്പിക്കാം.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “രഥത്തിന്റെ മടിയിലേക്ക്/മാർവിലേക്ക്”; രഥത്തിന്റെ അകത്തെ താഴ്ഭാഗത്തെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: യുദ്ധം രൂക്ഷമായി
  rationale: ‘യുദ്ധം കയറിപ്പോയി’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അവ്യക്തമാണ്; സന്ദർഭത്തിലെ പോരാട്ടം ശക്തിപ്പെട്ടുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מָעֳמָד
  choice: നിൽക്കുന്ന നിലയിൽ നിർത്തപ്പെട്ടിരുന്നു
  rationale: രൂപത്തിലെ കാരണാത്മകമോ നിലനിർത്തുന്നതോ ആയ നിഷ്ക്രിയഭാവം സംരക്ഷിക്കുന്നു; രാജാവ് സ്വയം വെറുതെ നിന്നു എന്നതിലുപരി പരിക്കേറ്റ നിലയിൽ നിർത്തപ്പെട്ടിരുന്നുവെന്ന സൂചന നൽകുന്നു, എന്നാൽ രീതി വ്യക്തമാക്കുന്നില്ല.
- source_word: נֹכַח אֲרָם
  choice: അരാമിന് അഭിമുഖമായി
  rationale: נֹכַח എന്നതിലെ ‘എതിർവശത്ത്/അഭിമുഖമായി’ എന്ന സ്ഥലബന്ധം നിലനിർത്തുകയും אֲרָם എന്ന പുരാതന ദേശനാമം ‘സിറിയ’ എന്ന് നവീകരിക്കാതെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: മുറിവിൽനിന്നുള്ള രക്തം ... ഒഴുകി
  rationale: יצק എന്നതിന്റെ ദ്രാവകചലനഭാവം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഒഴുകി’ എന്നു നൽകുന്നു; ഹീബ്രായ ബന്ധത്തെ ഉറവിടബന്ധമായി വ്യക്തമാക്കുന്നു.
- source_word: חֵיק הָרָכֶב
  choice: രഥത്തിന്റെ അടിത്തട്ട്
  rationale: חֵיק എന്നതിന്റെ അക്ഷരാർഥം ‘മടി/മാർവ്’ ആണെങ്കിലും രഥത്തെക്കുറിച്ച് അത് രക്തം ചേരുന്ന അകത്തെ താഴ്ഭാഗത്തെ സൂചിപ്പിക്കുന്ന രൂപകപ്രയോഗമാണ്.
