translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണം. ചെറുവാക്യങ്ങൾ ഉപയോഗിച്ച് സംഭവക്രമം വ്യക്തമാക്കിയിരിക്കുന്നു; മָעֳמָד എന്ന രൂപത്തിലെ നിഷ്ക്രിയവും കാരണാത്മകവുമായ സൂചന പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും പകരം വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
