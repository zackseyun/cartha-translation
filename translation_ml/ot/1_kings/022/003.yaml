id: 1KI.22.3
reference: 1 Kings 22:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל עֲבָדָ֔י/ו הַ/יְדַעְתֶּ֕ם כִּֽי לָ֖/נוּ רָמֹ֣ת גִּלְעָ֑ד וַ/אֲנַ֣חְנוּ מַחְשִׁ֔ים מִ/קַּ֣חַת אֹתָ֔/הּ מִ/יַּ֖ד מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: ml
  text: 'ഇസ്രായേൽരാജാവ് തന്റെ രാജഭൃത്യന്മാരോട്[a] പറഞ്ഞു: “രാമോത്ത്-ഗിലെയാദ് നമ്മുടേതാണെന്ന് നിങ്ങൾക്കറിയാമോ? എന്നിട്ടും അരാംരാജാവിന്റെ[b] കൈയിൽനിന്ന് അതു കൈവശപ്പെടുത്താൻ നാം ഒന്നും ചെയ്യുന്നില്ലല്ലോ[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രാജഭൃത്യന്മാർ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ രാജാവിന്റെ സഭയിലെ സേവകരോ ഉദ്യോഗസ്ഥരോ ആണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അരാം എന്ന ഹീബ്രു നാമം പഴയ ചില പരിഭാഷകളിൽ ‘സിറിയ’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: name_clarification
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അതു കൈവശപ്പെടുത്താതെ നാം മൗനം പാലിക്കുന്നു.” ഈ ഹീബ്രു പ്രയോഗം ഇവിടെ കുറ്റകരമായ നിഷ്ക്രിയതയെ സൂചിപ്പിക്കുന്നു.
    reason: idiom_clarification
lexical_decisions:
- source_word: עֲבָדָיו
  choice: തന്റെ രാജഭൃത്യന്മാരോട്
  rationale: עֶבֶד എന്ന പദത്തിന് ‘ദാസൻ’ എന്നും രാജാവിന്റെ സേവനത്തിലുള്ള ഉദ്യോഗസ്ഥൻ/പരിചാരകൻ എന്നും അർഥമാകാം. ഇവിടെ രാജസഭയിലെ ആളുകളെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; ‘രാജഭൃത്യന്മാർ’ മൂലപദത്തിന്റെ സേവകഭാവവും രാജകീയ പശ്ചാത്തലവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: הֲיְדַעְתֶּם
  choice: നിങ്ങൾക്കറിയാമോ?
  rationale: ഹീബ്രുവിൽ നിഷേധപദം ഇല്ലാത്തതിനാൽ ‘നിങ്ങൾക്കറിയില്ലേ?’ എന്നു ചേർക്കാതെ നേരിട്ടുള്ള, എന്നാൽ സന്ദർഭത്തിൽ ആലങ്കാരികവുമായ ചോദ്യം നിലനിർത്തുന്നു.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദ് നമ്മുടേതാണെന്ന്
  rationale: לָנוּ ഉടമസ്ഥതയെയോ അവകാശവാദത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നമ്മുടേതാണ്’ രാഷ്ട്രീയ അവകാശവാദം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: രാമോത്ത്-ഗിലെയാദ്
  rationale: സംയുക്ത സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് ഹൈഫനോടെ നിലനിർത്തുന്നു.
- source_word: מַחְשִׁים
  choice: നാം ഒന്നും ചെയ്യാതിരിക്കുകയാണല്ലോ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം മൗനം പാലിക്കുന്നതുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും ഇവിടെ കുറ്റകരമായ നിഷ്ക്രിയതയാണ് ആശയം. ആ സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִקַּחַת אֹתָהּ
  choice: അതു പിടിച്ചെടുക്കാൻ
  rationale: അവഗണിക്കപ്പെട്ട പ്രവർത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു. ‘തിരിച്ചുപിടിക്കാൻ’ എന്നത് മുൻകാല കൈവശം വ്യക്തമായി ചേർക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: מִיַּד
  choice: കൈയിൽനിന്ന്
  rationale: കൈവശമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാം
  rationale: പിൽക്കാല ഭൂമിശാസ്ത്രനാമമായ ‘സിറിയ’ ഉപയോഗിക്കാതെ ഹീബ്രു നാമം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രാജകീയ ആഖ്യാനശൈലി. മൂലത്തിലെ ചോദ്യം, പ്രദേശാവകാശവാദം, ‘കൈയിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗം, നിഷ്ക്രിയതയോടുള്ള കുറ്റപ്പെടുത്തൽ എന്നിവ നിലനിർത്തി.
