id: 1KI.22.16
reference: 1 Kings 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ml
  text: 'അപ്പോൾ രാജാവ് അവനോടു പറഞ്ഞു: “യാഹ്‌വേയുടെ നാമത്തിൽ എന്നോടു സത്യം മാത്രമേ പറയൂ എന്ന് എത്ര പ്രാവശ്യം ഞാൻ നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിക്കണം[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എത്ര പ്രാവശ്യം ഞാൻ നിന്നെ സത്യപ്രതിജ്ഞയ്ക്കു വിധേയനാക്കണം?” എബ്രായ ക്രിയയ്ക്ക് ഒരാളെക്കൊണ്ട് സത്യം ചെയ്യിക്കുക, അയാളെ സത്യപ്രതിജ്ഞയ്ക്കു വിധേയനാക്കുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: എബ്രായത്തിലെ നിർദിഷ്ട സ്ഥാനപ്പേര് അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘രാജാവ്’ സ്വാഭാവികമാണ്.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: എത്ര പ്രാവശ്യം
  rationale: ആവർത്തനത്തെക്കുറിച്ചുള്ള രാജാവിന്റെ അസഹിഷ്ണുത പ്രകടമാക്കുന്ന സ്വാഭാവിക ചോദ്യരൂപം.
- source_word: מַשְׁבִּעֶךָ
  choice: ഞാൻ നിന്നെക്കൊണ്ട് സത്യം ചെയ്യിക്കണം
  rationale: שׁבע എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപം മറ്റൊരാളെക്കൊണ്ട് സത്യം ചെയ്യിക്കുക അഥവാ സത്യപ്രതിജ്ഞയ്ക്കു വിധേയനാക്കുക എന്ന കാരണാർത്ഥം വഹിക്കുന്നു.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: സത്യം മാത്രമേ എന്നോടു പറയാവൂ എന്ന്
  rationale: നിഷേധവും רַק എന്ന നിയന്ത്രണകണവും ചേർന്ന ഘടനയെ മലയാളത്തിലെ ‘മാത്രമേ ... പറയാവൂ’ എന്ന സ്വാഭാവികവും കൃത്യവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּשֵׁם יְהוָה
  choice: യഹോവയുടെ നാമത്തിൽ
  rationale: ദൈവനാമത്തിന്റെ അധികാരത്തിലും ആഹ്വാനത്തിലും സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; יהוה എന്ന നാമം ലിപ്യന്തരിച്ചു നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനനാമംകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവിന്റെ അസഹിഷ്ണുത ചോദ്യരൂപത്തിൽ നിലനിർത്തുകയും സത്യപ്രതിജ്ഞയുടെ കാരണാർത്ഥം വ്യക്തമാക്കുകയും ചെയ്തിരിക്കുന്നു.
