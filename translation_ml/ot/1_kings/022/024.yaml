id: 1KI.22.24
reference: 1 Kings 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: ml
  text: 'അപ്പോൾ കെനാനയുടെ മകൻ സിദെക്കീയാവ് അടുത്തുവന്ന് മീഖായാവിന്റെ കവിളത്ത് അടിച്ചു; പിന്നെ പറഞ്ഞു[a]: “നിന്നോടു സംസാരിക്കാൻ യഹ്‌വെയുടെ ആത്മാവ് എന്നിൽനിന്ന് ഏതു വഴിയിലൂടെയാണ് കടന്നുപോയത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്നോടു സംസാരിക്കാൻ യഹ്‌വെയുടെ ആത്മാവ് എന്നിൽനിന്ന് ഏതു വഴിക്കാണ് പോയത്?”
    reason: אֵי זֶה עָבַר എന്ന പ്രയോഗം ആത്മാവ് ഏത് വഴിയിലൂടെ കടന്നുപോയി എന്ന പരിഹാസചോദ്യമായി വരുന്നു; മലയാളത്തിൽ ‘ഏതു വഴിക്കാണ് പോയത്?’ എന്നത് അതിന്റെ സ്വാഭാവികമായ ബദൽ രൂപമാണ്.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: അടുത്തുവന്ന്
  rationale: നגשׁ സൂചിപ്പിക്കുന്ന ശാരീരികമായ സമീപനവും ഏറ്റുമുട്ടലിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: കെനയനയുടെ മകൻ സിദെക്കീയാവ്
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകി; വ്യക്തിനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: മീഖായാവിന്റെ കവിളത്ത് അടിച്ചുകൊണ്ട്
  rationale: נכה എന്ന വിശാലാർഥമുള്ള ക്രിയയെ അടിയുടെ കൃത്യരീതി അനാവശ്യമായി നിർണയിക്കാതെ ‘അടിച്ചു’ എന്നും לֶחִיയെ സാധാരണ അർഥമായ ‘കവിൾ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: אֵי זֶה
  choice: ഏതു വഴിയിലൂടെ
  rationale: ആത്മാവ് സിദെക്കീയാവിൽനിന്ന് മീഖായാവിലേക്കു പോയെന്ന പരിഹാസപരമായ വെല്ലുവിളിയിലെ വഴിയെക്കുറിച്ചുള്ള ചോദ്യം വ്യക്തമാക്കുന്നു.
- source_word: עָבַר
  choice: കടന്നുപോയി
  rationale: עבר എന്ന ക്രിയയുടെ ‘കടന്നുപോകുക’ എന്ന അടിസ്ഥാനചലനാർഥം നിലനിർത്തുന്നു.
- source_word: רוּחַ יְהוָה
  choice: യഹ്‌വെയുടെ ആത്മാവ്
  rationale: പ്രവാചകസന്ദർഭത്തിൽ ദൈവിക ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണിത്.
- source_word: מֵאִתִּי
  choice: എന്നിൽനിന്ന്
  rationale: പുറപ്പെടുന്ന ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയസംയോജനത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: לְדַבֵּר אֹתָךְ
  choice: നിന്നോടു സംസാരിക്കാൻ
  rationale: മീഖായാവിനോടുള്ള സംസാരമാണ് ഉദ്ദേശ്യമെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: רוּחַ יְהוָה എന്നതിന്റെ ദൈവിക പരാമർശം
  choice: യഹ്‌വെയുടെ ആത്മാവ്
  alternative: യഹ്‌വെയുടെ ആത്മശക്തി / യഹ്‌വെയുടെ ശ്വാസം
  rationale: ഇവിടെയുള്ള പ്രവാചകവിവാദം ദൈവത്തിൽനിന്നുള്ള പ്രവചനപ്രേരണയെക്കുറിച്ചാണ്; അതിനാൽ ‘ആത്മാവ്’ ഏറ്റവും യോജിച്ചതാണ്. സിദെക്കീയാവിന്റെ അവകാശവാദം വാക്യം അംഗീകരിക്കുന്നു എന്നു വരുത്താതെ, അവന്റെ പരിഹാസചോദ്യമായിത്തന്നെ നിലനിർത്തി.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: ഹീബ്രു പാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ ലിപ്യന്തരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സിദെക്കീയാവിന്റെ പരിഹാസവും ശാരീരികമായ ആക്രമണവും മൃദൂകരിക്കാതെ, എന്നാൽ അടിയുടെ രീതി പാഠത്തേക്കാൾ കൃത്യമായി നിർവചിക്കാതെയും അവതരിപ്പിച്ചു.
