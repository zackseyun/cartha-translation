- from: 'അപ്പോൾ കെനയനയുടെ മകൻ സിദെക്കീയാവ് അടുത്തുവന്ന് മീഖായാവിന്റെ കവിളത്ത് അടിച്ചുകൊണ്ട് പറഞ്ഞു[a]: “നിന്നോടു സംസാരിക്കാൻ യഹ്‌വെയുടെ ആത്മാവ് എന്നിൽനിന്ന് ഏതു വഴിയിലൂടെയാണ് കടന്നുപോയത്?”'
