id: 1KI.22.46
reference: 1 Kings 22:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ml
  text: യെഹോശാഫാത്തിന്റെ ശേഷിച്ച പ്രവൃത്തികളും, അവൻ പ്രകടമാക്കിയ വീര്യവും[a], അവൻ എങ്ങനെ പോരാടി എന്നതും—യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ എഴുതപ്പെട്ടിട്ടില്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ ചെയ്ത വീരകൃത്യങ്ങളും.” എബ്രായപ്രയോഗം ‘അവന്റെ വീര്യം’ എന്ന ആശയത്തെയും ‘അവൻ ചെയ്തത്’ എന്ന ആശയത്തെയും ചേർക്കുന്നു; പ്രവർത്തിയിൽ തെളിഞ്ഞ വീര്യത്തെയോ പരാക്രമത്തെയോ ആണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: ശേഷിച്ച പ്രവൃത്തികളും
  rationale: രാജഭരണസംഗ്രഹങ്ങളിൽ דִּבְרֵי എന്നത് വെറും ‘വാക്കുകൾ’ എന്നതിലുപരി രാജാവിന്റെ പ്രവൃത്തികളെയും സംഭവങ്ങളെയും സൂചിപ്പിക്കുന്നു; וְיֶתֶר അതിൽ ശേഷിച്ചവയെ കുറിക്കുന്നു.
- source_word: יְהוֹשָׁפָט
  choice: യെഹോശാഫാത്ത്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടത്തോട് അടുത്തതുമായ ലിപ്യന്തരണം.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: അവൻ പ്രകടമാക്കിയ വീര്യവും
  rationale: ഗְּבוּרָה ശക്തി, വീര്യം, വീരകൃത്യങ്ങൾ എന്നിവ സൂചിപ്പിക്കാം. പിന്നാലെയുള്ള ‘അവൻ ചെയ്തു’ എന്ന പ്രയോഗത്തോടൊപ്പം അത് പ്രവർത്തിയിൽ വെളിപ്പെട്ട വീര്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ വിവർത്തനം നാമരൂപവും ആശയവും നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: അവൻ എങ്ങനെ പോരാടി എന്നതും
  rationale: נלחם എന്ന ക്രിയയുടെ ‘പോരാടുക/യുദ്ധം ചെയ്യുക’ എന്ന അർഥം നിലനിർത്തുകയും, സൈനികപ്രവർത്തനത്തിന്റെ വിവരണാത്മക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: എഴുതപ്പെട്ടിട്ടില്ലയോ?
  rationale: ഉറവിടഗ്രന്ഥത്തെ ഉദ്ധരിക്കുന്ന പതിവ് അലങ്കാരചോദ്യത്തിന്റെ രൂപം അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: യെഹൂദാരാജാക്കന്മാരുടെ ദിനവൃത്താന്തപുസ്തകത്തിൽ
  rationale: രാജാക്കന്മാരെ സംബന്ധിച്ച ഔദ്യോഗിക വാർഷികരേഖയെയോ ദിനവൃത്താന്തത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രന്ഥനാമം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ള ചരിത്രാഖ്യാനശൈലി ഉപയോഗിച്ചു. ഉറവിടത്തിലെ പട്ടികാസംരചനയും അലങ്കാരചോദ്യവും നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
