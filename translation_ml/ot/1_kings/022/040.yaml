source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב אַחְאָ֖ב עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: ml
  text: അഹാബ് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]. അവന്റെ മകനായ അഹസ്യാവ് അവനു പകരം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നുറങ്ങി”; അവൻ മരിച്ചു എന്നർഥമുള്ള പതിവ് രാജകീയ പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജാവിന്റെ മരണത്തെ അറിയിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ രൂപകസ്വഭാവം നിലനിർത്തുന്നു; ‘മരിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നതിനെക്കാൾ എബ്രായപ്രയോഗത്തോട് അടുത്തതും മലയാളത്തിൽ ഗൗരവമുള്ളതുമാണ്.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: രാജവംശപരമായ മരണവിവരണത്തിൽ വരുന്ന എബ്രായ സ്ഥിരപ്രയോഗം ഔപചാരികമായി സംരക്ഷിക്കുന്നു. ‘പൂർവികരോടുകൂടെ’ എന്നത് സ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണെങ്കിലും മൂലത്തിലെ ‘പിതാക്കന്മാർ’ എന്ന ദൃശ്യഭാവം കുറയ്ക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഇവിടെ തുടർന്നുള്ള ഭരണകാലത്തേക്കാൾ സിംഹാസനാരോഹണമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘രാജാവായി’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּחְתָּיו
  choice: അവനു പകരം
  rationale: അതേ രാജസ്ഥാനത്തേക്കുള്ള പിൻഗാമിത്വവും സ്ഥാനമാറ്റവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַחְאָב
  choice: അഹാബ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ നാമലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: אֲחַזְיָהוּ
  choice: അഹസ്യാവ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ നാമലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בְנוֹ
  choice: അവന്റെ മകനായ
  rationale: വംശപരമായ പിൻഗാമിത്വം മൂലപാഠത്തിലുള്ളതുപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ രാജകീയ സ്ഥിരപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
