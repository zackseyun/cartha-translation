id: 1KI.22.21
reference: 1 Kings 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: ml
  text: അപ്പോൾ ആ ആത്മാവ്[a] മുന്നോട്ടുവന്ന് യഹോവയുടെ മുമ്പിൽ നിന്നു. “ഞാൻ അവനെ വശീകരിക്കും[b],” എന്ന് അതു പറഞ്ഞു. യഹോവ അതോടു, “എന്തു മാർഗത്തിലൂടെ?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു ആത്മാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ നിശ്ചയാർഥകമായ ‘ആത്മാവ്’ എന്നാണ്; ഇവിടെ സ്വർഗീയസദസ്സിലെ ഒരു പ്രത്യേക ആത്മസത്തയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം, നിർബന്ധമായും പരിശുദ്ധാത്മാവിനെ അല്ല.
    reason: alternative_reading
  - marker: b
    text: ‘ഞാൻ അവനെ പ്രേരിപ്പിക്കും’ എന്നോ ‘ഞാൻ അവനെ വഞ്ചിക്കും’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് വശീകരിക്കുക, പ്രേരിപ്പിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥങ്ങൾ വരാം; കൃത്യമായ മാർഗം അടുത്ത വാക്യത്തിൽ വ്യക്തമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: ആ ആത്മാവ്
  rationale: നിശ്ചയാർഥക ഉപപദമുള്ള രൂപം സ്വർഗീയസഭയിലെ ഒരു പ്രത്യേക ആത്മസത്തയെ സൂചിപ്പിക്കുന്നു. ‘പരിശുദ്ധാത്മാവ്’ എന്നു തിരിച്ചറിയാതെ എബ്രായത്തിലെ നിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: וַיֵּצֵא
  choice: മുന്നോട്ടുവന്ന്
  rationale: അടിസ്ഥാന അർഥം ‘പുറത്തുവരുക’ എന്നാണെങ്കിലും, സ്വർഗീയസഭയുടെ പശ്ചാത്തലത്തിൽ കൂട്ടത്തിൽനിന്ന് മുന്നോട്ടുവന്ന് നിർദേശം സമർപ്പിക്കുന്ന പ്രവൃത്തിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: മുമ്പിൽ നിന്നു
  rationale: ഒരു അധികാരിയുടെ സന്നിധിയിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ലളിതവും ഔപചാരികവുമായ മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֲפַתֶּנּוּ
  choice: ഞാൻ അവനെ വശീകരിക്കും
  rationale: പിയേൽ രൂപത്തിലുള്ള פתה പ്രേരിപ്പിക്കുക, വശീകരിക്കുക, വഞ്ചിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. അടുത്ത വാക്യത്തിൽ മാർഗം വ്യക്തമാകുന്നതിനാൽ ഇവിടെ ‘വഞ്ചിക്കും’ എന്നു മുൻകൂട്ടി ചുരുക്കാതെ ആകർഷിച്ചോ പ്രേരിപ്പിച്ചോ വഴിതെറ്റിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: בַּמָּה
  choice: എന്തു മാർഗത്തിലൂടെ?
  rationale: ആത്മാവ് തന്റെ നിർദേശം എങ്ങനെ നടപ്പാക്കുമെന്ന മാർഗത്തെയാണ് ചോദ്യം അന്വേഷിക്കുന്നത്; ‘എങ്ങനെ?’ എന്നതിനെക്കാൾ മാർഗസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്വർഗീയസഭയിലെ הָרוּחַ എന്നതിന്റെ വ്യക്തിത്വം
  choice: ഒരു പ്രത്യേക ആത്മസത്തയെ സൂചിപ്പിക്കുന്ന ‘ആ ആത്മാവ്’
  alternative: ‘പരിശുദ്ധാത്മാവ്’ അല്ലെങ്കിൽ അനിശ്ചിതമായ ‘ഒരു ആത്മാവ്’
  rationale: വിവരണത്തിൽ സ്വർഗീയസൈന്യത്തിലെ ഒരംഗം മുന്നോട്ടുവരുന്നതാണ് കാണുന്നത്. അതിനെ പരിശുദ്ധാത്മാവായി നിർണയിക്കുന്നത് മൂലപാഠം ആവശ്യപ്പെടുന്നതിലധികം പറയുന്നു; ‘ഒരു ആത്മാവ്’ എന്നു പറയുന്നത് നിശ്ചയാർഥക ഉപപദത്തെ മങ്ങിക്കുന്നു. അതിനാൽ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള പരിധി തുറന്നുവെച്ചുകൊണ്ട് നിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി സ്വീകരിച്ചു. ആത്മാവിനെ സൂചിപ്പിക്കുമ്പോൾ ലിംഗനിർണയം ഒഴിവാക്കാൻ ‘അതു/അതിനോട്’ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
