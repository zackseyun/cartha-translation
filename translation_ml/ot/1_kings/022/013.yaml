  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: ml
  text: 'മീഖായാവിനെ വിളിച്ചുകൊണ്ടുവരാൻ പോയ ദൂതൻ അവനോടു പറഞ്ഞു: “നോക്കൂ, പ്രവാചകന്മാരുടെ വാക്കുകൾ ഒരേ സ്വരത്തിൽ[a] രാജാവിന് അനുകൂലമായിരിക്കുന്നു. ദയവായി, നിന്റെ വാക്കും അവരിൽ ഒരാളുടെ വാക്കുപോലെ ആയിരിക്കട്ടെ; അനുകൂലമായി സംസാരിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ അക്ഷരാർഥം “ഒരേ വായോടെ”; അതായത് “ഒരേ സ്വരത്തിൽ” അഥവാ “ഏകകണ്ഠമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ദൂതൻ
  rationale: സന്ദർഭത്തിൽ മീഖായാവിനെ വിളിച്ചുകൊണ്ടുവരാൻ അയയ്ക്കപ്പെട്ട മനുഷ്യസന്ദേശവാഹകനെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വർഗീയ ദൂതനെയല്ല.
- source_word: לִקְרֹא
  choice: വിളിച്ചുകൊണ്ടുവരാൻ
  rationale: രാജസന്നിധിയിലേക്കു പ്രവാചകനെ ഔദ്യോഗികമായി വിളിപ്പിക്കുന്ന സന്ദർഭം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִנֵּה נָא
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും തുടർന്നുള്ള അഭ്യർഥനയ്ക്ക് സംഭാഷണാത്മകമായ ഭാവം നൽകുകയും ചെയ്യുന്ന പ്രയോഗം.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: പ്രവാചകന്മാരുടെ വാക്കുകൾ
  rationale: ‘വാക്കുകൾ’ എന്ന മൂലപദത്തിന്റെ രൂപം നിലനിർത്തി, അതിനെ മുൻകൂട്ടി ഔപചാരിക പ്രവചനമായി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: פֶּה אֶחָד
  choice: ഒരേ സ്വരത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരേ വായോടെ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഏകകണ്ഠത എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: രാജാവിന് അനുകൂലമായിരിക്കുന്നു
  rationale: പ്രവാചകന്മാരുടെ വാക്കുകൾ രാജാവിനെ സംബന്ധിച്ച് അനുകൂലമാണെന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יְהִי נָא דבריך
  choice: ദയവായി, നിന്റെ വാക്കും … ആയിരിക്കട്ടെ
  rationale: നാ എന്ന വിനയപൂർവമായ അഭ്യർഥനയും ‘നിന്റെ വാക്ക്’ എന്ന ഏകവചന കൂട്ടാർഥവും നിലനിർത്തുന്നു.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: അവരിൽ ഒരാളുടെ വാക്കുപോലെ
  rationale: എബ്രായത്തിലെ ഏകവചനഘടന അടുത്തായി നിലനിർത്തുകയും മറ്റുള്ള പ്രവാചകന്മാരുടെ സന്ദേശത്തോടു പൊരുത്തപ്പെടണമെന്ന സമ്മർദം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: അനുകൂലമായി സംസാരിക്കണം
  rationale: ‘നല്ലത് സംസാരിക്കുക’ എന്ന അക്ഷരാർഥത്തെ ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന അനുകൂലമായ പ്രസ്താവനയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
