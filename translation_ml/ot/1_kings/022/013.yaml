translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിക്കുന്ന ‘വാക്ക്’ എന്ന പദവും അഭ്യർഥനയുടെ സമ്മർദഭാവവും നിലനിർത്തിക്കൊണ്ട്, ‘ഒരേ വായോടെ’ എന്ന ഭാഷാശൈലി മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘ഒരേ സ്വരത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
