translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ശീർഷകമായി വരുന്ന שַׂר എന്നതിന്റെ ഭരണ-സൈനിക അർഥവ്യാപ്തി ‘നഗരാധികാരി’ എന്ന പൊതുവായ പദത്തിലൂടെ സംരക്ഷിച്ചു. പ്രസിദ്ധീകരണപാഠത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ലെന്ന് വിലയിരുത്തി.
