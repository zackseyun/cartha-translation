  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽരാജാവ് പറഞ്ഞു: “മീഖായാവിനെ കൂട്ടിക്കൊണ്ടുപോയി നഗരാധികാരിയായ[a] ആമോന്റെ അടുക്കലേക്കും രാജാവിന്റെ മകനായ യോവാശിന്റെ അടുക്കലേക്കും തിരികെ കൊണ്ടുപോകുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നഗരത്തിന്റെ സേനാനായകൻ” അല്ലെങ്കിൽ “നഗരത്തിലെ മുഖ്യ ഉദ്യോഗസ്ഥൻ.” എബ്രായ പദം ഒരു പ്രമുഖ പൗര അല്ലെങ്കിൽ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: വ്യക്തിനാമത്തിനു പകരം മൂലപാഠത്തിലുള്ള രാജപദവി തന്നെയാണ് നിലനിർത്തുന്നത്.
- source_word: קַח
  choice: പിടിച്ച്
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നതാണെങ്കിലും, ഒരാളെ അധികാരികളുടെ അടുക്കലേക്ക് തടവിലായി തിരികെ കൊണ്ടുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘പിടിച്ച് ... കൊണ്ടുപോകുക’ സ്വാഭാവികമാണ്; ‘പിടികൂടുക’ എന്നത്ര അധിക ബലപ്രയോഗം ചേർക്കുന്നില്ല.
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ രൂപം മലയാള ബൈബിൾനാമരീതിക്ക് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു; വിഭക്തിസന്ധിയിൽ ‘മീഖായാവിനെ’.
- source_word: וַהֲשִׁיבֵהוּ
  choice: തിരികെ കൊണ്ടുപോകുക
  rationale: שוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘തിരികെ വരുത്തുക/കൊണ്ടുപോകുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു; ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്ക് വീണ്ടും ഏൽപ്പിക്കുന്നതാണു സൂചന.
- source_word: אָמֹן שַׂר הָעִיר
  choice: നഗരാധികാരിയായ ആമോൻ
  rationale: שַׂר എന്ന പദം ഭരണപരമോ സൈനികമോ ആയ മുഖ്യ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കാം. ‘നഗരാധികാരി’ ആ അനിശ്ചിതത്വം അനാവശ്യമായി സൈനികമായി ചുരുക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וְאֶל יוֹאָשׁ
  choice: യോവാശിന്റെ അടുക്കലേക്കും
  rationale: രണ്ടാമത്തെ אֶל സമാന്തരമായ മറ്റൊരു ലക്ഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘അടുക്കലേക്ക്’ വ്യക്തിയുടെ കസ്റ്റഡിയിലേക്ക് ഏൽപ്പിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בֶּן הַמֶּלֶךְ
  choice: രാജാവിന്റെ മകൻ
  rationale: മൂലത്തിലെ ബന്ധവാചകം നേരിട്ട് നിലനിർത്തുന്നു; ‘രാജകുമാരൻ’ എന്ന പദവി മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
