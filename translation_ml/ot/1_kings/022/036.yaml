source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר הָ/רִנָּה֙ בַּֽ/מַּחֲנֶ֔ה כְּ/בֹ֥א הַ/שֶּׁ֖מֶשׁ לֵ/אמֹ֑ר אִ֥ישׁ אֶל עִיר֖/וֹ וְ/אִ֥ישׁ אֶל אַרְצֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: ml
  text: സൂര്യൻ അസ്തമിക്കുമ്പോൾ, “ഓരോ പുരുഷനും തന്റെ പട്ടണത്തിലേക്ക്; ഓരോ പുരുഷനും തന്റെ ദേശത്തിലേക്ക്!”[b] എന്നൊരു വിളി[a] പാളയത്തിലൂടെ കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളി’ എന്നതിനു ‘ഘോഷം’ അല്ലെങ്കിൽ ‘വിളംബരം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം ഉച്ചത്തിലുള്ള, മുഴങ്ങുന്ന വിളിയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് പാളയമൊട്ടാകെയുള്ള അറിയിപ്പാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “ഓരോ പുരുഷനും തന്റെ പട്ടണത്തിലേക്ക്; ഓരോ പുരുഷനും തന്റെ ദേശത്തിലേക്ക്!” യുദ്ധത്തിനുശേഷം സൈനികരെ പിരിച്ചുവിടുന്ന ഒരു പതിവുശൈലിയാണിത്.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: പരന്നു
  rationale: പാളയത്തിലൂടെ ഒരു വിളിയോ സന്ദേശമോ നീങ്ങിപ്പോകുന്നതിനെ സൂചിപ്പിക്കുന്ന עבר എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: הָרִנָּה
  choice: ഒരു വിളി
  rationale: רִנָּה ഉച്ചത്തിലുള്ള വിളി, ഘോഷം, ആഹ്ലാദാരവം എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ ആഹ്ലാദമല്ല, പാളയമൊട്ടാകെയുള്ള യുദ്ധാനന്തര അറിയിപ്പാണ്; അതിനാൽ നിഷ്പക്ഷമായ ‘ഒരു വിളി’ തിരഞ്ഞെടുത്തു.
- source_word: בַּמַּחֲנֶה
  choice: പാളയത്തിലാകെ
  rationale: പദാനുപദമായി ‘പാളയത്തിൽ’ എന്നാണെങ്കിലും עבר എന്ന ക്രിയയോടൊപ്പം പാളയം മുഴുവൻ വിളി വ്യാപിച്ചതാണ് അർഥം.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: സൂര്യൻ അസ്തമിക്കുമ്പോൾ
  rationale: ‘സൂര്യൻ വരുക/അകത്തേക്കു പോകുക’ എന്ന എബ്രായ ശൈലി സൂര്യാസ്തമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമയബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: എന്നൊരു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളാണ് വിളിയുടെ ഉള്ളടക്കമെന്ന് സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: אִישׁ ... וְאִישׁ
  choice: ഓരോ പുരുഷനും ... ഓരോ പുരുഷനും
  rationale: ആവർത്തനത്തിന്റെ വിതരണാർഥവും സൈനികരായ പുരുഷന്മാരോടുള്ള പിരിച്ചുവിടൽ സൂത്രവാക്യത്തിന്റെ ലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: אֶל עִירוֹ
  choice: തന്റെ പട്ടണത്തിലേക്ക്
  rationale: עִיר എന്നതിന്റെ സാധാരണ അർഥവും ഓരോ വ്യക്തിയുടെയും സ്വന്തം പട്ടണം എന്ന പ്രത്യാവർത്തകബന്ധവും നൽകുന്നു.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: ഓരോ പുരുഷനും തന്റെ ദേശത്തിലേക്ക്
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ ദേശം, സ്വന്തം പ്രദേശം എന്നീ അർഥവ്യാപ്തി നിലനിർത്തുകയും സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
