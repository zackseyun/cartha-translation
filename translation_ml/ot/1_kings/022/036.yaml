translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനവും ക്രിയയില്ലാത്ത സംക്ഷിപ്ത സൈനികപ്രഖ്യാപനവും നേരിട്ടുള്ള ഉദ്ധരണിയിൽ നിലനിർത്തി; വാക്യം സ്വാഭാവികമാക്കാൻ റിപ്പോർട്ടിംഗ് ഘടകം മലയാളക്രമത്തിൽ പുനഃക്രമീകരിച്ചു.
