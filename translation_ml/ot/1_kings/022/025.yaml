source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּבֹ֛א חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/025.yaml
  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: ml
  text: 'അപ്പോൾ മീഖായാവ് പറഞ്ഞു: “നോക്കൂ, ഒളിക്കാനായി നീ അകത്തെ മുറിയിലേക്കു ചെല്ലുന്ന ആ ദിവസം നീ കാണും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മുറിയിൽനിന്ന് മറ്റൊരു മുറിയിലേക്കു.” ഹീബ്രുവിൽ “മുറി” എന്ന പദം ആവർത്തിച്ചിരിക്കുന്നു; ഒളിക്കാനായി കൂടുതൽ ഉള്ളിലേക്കു പിന്മാറുന്നതാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനത്തിന്റെ മുന്നേറ്റം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി തുടർച്ച പ്രകടമാക്കുന്നു.
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിച്ചു.
- source_word: הִנְּךָ רֹאֶה
  choice: നോക്കൂ, ... നീ അതു കാണും
  rationale: ഹിന്നേയുടെ ശ്രദ്ധാകർഷകശക്തിയും ഭാവികാലസന്ദർഭത്തിൽ കൃദന്തരൂപത്തിന്റെ പ്രവചനാത്മക അർഥവും നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַהוּא אֲשֶׁר
  choice: '... ആ ദിവസം'
  rationale: കാലസാഹചര്യം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: תָּבֹא
  choice: നീ ... ചെല്ലുന്ന
  rationale: בוא എന്ന ക്രിയയുടെ സന്ദർഭാനുസൃതമായ പ്രവേശനചലനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חֶדֶר בְּחֶדֶר
  choice: അകത്തെ മുറിയിലേക്കു
  rationale: ഹീബ്രു പദാവർത്തനം കൂടുതൽ ഉള്ളിലേക്കുള്ള പിന്മാറ്റം സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്വാഭാവികമായ മുഖ്യവായന നൽകി, യഥാർഥമായ പകരവായനകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְהֵחָבֵה
  choice: ഒളിക്കാനായി
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന അനന്തക്രിയാരൂപം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ശ്രദ്ധാകർഷകമായ הִנְּךָയ്ക്ക് അത്യന്തം പുരാതനഭാവമുള്ള രൂപം ഒഴിവാക്കി “നോക്കൂ” ഉപയോഗിച്ചു; חֶדֶר בְּחֶדֶר എന്നതിലെ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
