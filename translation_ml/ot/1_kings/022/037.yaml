translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘രാജാവ്’ എന്ന ആവർത്തനം മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തി; ‘കൊണ്ടുവന്നു’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയ്ക്ക് അടിക്കുറിപ്പിലൂടെ അക്ഷരാർഥം രേഖപ്പെടുത്തി.
