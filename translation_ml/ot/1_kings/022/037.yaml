  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: ml
  text: അങ്ങനെ രാജാവ് മരിച്ചു; അദ്ദേഹത്തെ ശമര്യയിലേക്കു കൊണ്ടുവന്നു[a]. അവർ രാജാവിനെ ശമര്യയിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘രാജാവ് മരിച്ചു; അവൻ ശമര്യയിലേക്കു വന്നു.’ രാജാവ് മരിച്ചശേഷം അദ്ദേഹത്തിന്റെ ശരീരം ശമര്യയിലേക്കു കൊണ്ടുവന്നു എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയയുടെ കാൽ വേയിക്തോൽ രൂപം ആഖ്യാനക്രമത്തിലെ മരണസംഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘മരിച്ചു’ എന്നത് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപരിഭാഷയാണ്.
- source_word: הַמֶּלֶךְ
  choice: രാജാവ്
  rationale: സന്ദർഭത്തിൽ മുമ്പേ അറിയപ്പെടുന്ന രാജാവിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ടനാമം; വ്യക്തിപേര് ചേർക്കാതെ എബ്രായപദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: അദ്ദേഹത്തെ ശമര്യയിലേക്കു കൊണ്ടുവന്നു
  rationale: രൂപപരമായി ‘അവൻ ശമര്യയിലേക്കു വന്നു’ എന്നാണ്; എന്നാൽ രാജാവ് മരിച്ചശേഷമുള്ള സന്ദർഭത്തിൽ അദ്ദേഹത്തിന്റെ ശരീരം അവിടെ എത്തിക്കപ്പെട്ടു എന്നതാണ് ആശയം. മലയാളത്തിൽ അത് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ കർമണാർത്ഥമുള്ള ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: שֹׁמְרוֹן
  choice: ശമര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: וַיִּקְבְּרוּ
  choice: അവർ ... അടക്കം ചെയ്തു
  rationale: അനിർദിഷ്ട കർത്താവോടുകൂടിയ മൂന്നാംപുരുഷ ബഹുവചനരൂപം; ‘അവർ’ എന്ന് നൽകി എബ്രായഘടന സംരക്ഷിക്കുന്നു.
- source_word: אֶת הַמֶּלֶךְ
  choice: രാജാവിനെ
  rationale: എബ്രായത്തിൽ നാമം ആവർത്തിച്ചിരിക്കുന്നതിനാൽ ‘അദ്ദേഹത്തെ’ എന്നാക്കി ചുരുക്കാതെ ‘രാജാവിനെ’ എന്ന് ആവർത്തിക്കുന്നു.
- source_word: בְּשֹׁמְרוֹן
  choice: ശമര്യയിൽ
  rationale: בְּ ഇവിടെ അടക്കത്തിന്റെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘ശമര്യയിൽ’ എന്നതാണ് നേരിട്ടുള്ള മലയാളസമാനത.
