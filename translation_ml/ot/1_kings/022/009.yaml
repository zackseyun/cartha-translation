id: 1KI.22.9
reference: 1 Kings 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: ml
  text: അപ്പോൾ ഇസ്രായേൽ രാജാവ് ഒരു കൊട്ടാര ഉദ്യോഗസ്ഥനെ[a] വിളിച്ച്, “ഇംലായുടെ മകൻ മീഖായാവിനെ വേഗം കൊണ്ടുവരിക,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊട്ടാര ഉദ്യോഗസ്ഥൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഹീബ്രു പദത്തിന് ‘ഷണ്ഡൻ’ എന്നും പൊതുവായി ‘രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥൻ’ എന്നും അർഥമാകാം. ഇവിടെ രണ്ടാമത്തെ അർഥമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: വിളിച്ച്
  rationale: കרא എന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ഒരാളെ വിളിക്കുകയോ വരുത്താൻ കല്പിക്കുകയോ ചെയ്യുക എന്ന അർഥമുണ്ട്. തുടർന്നുള്ള ‘പറഞ്ഞു’ എന്ന ക്രിയയുമായി ചേർത്ത് ‘വിളിച്ച്’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: ഈ സംയുക്തപദം രാജാവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുകയും മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֶל סָרִיס אֶחָד
  choice: ഒരു കൊട്ടാര ഉദ്യോഗസ്ഥനെ
  rationale: סָרִיס എന്നതിന് ‘ഷണ്ഡൻ’ എന്നും പൊതുവായി രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥൻ എന്നും അർഥമാകാം. ഇവിടെ ചുമതലയാണ് പ്രസക്തമെന്നതിനാൽ വിശാലമായ ഔദ്യോഗിക അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מַהֲרָה
  choice: വേഗം കൊണ്ടുവരിക
  rationale: മַהֲרָה അടിയന്തരത സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ‘കൊണ്ടുവരിക’ എന്ന ക്രിയ പ്രസ്താവിക്കാതെ സൂചിതമായിരിക്കുമ്പോഴും, മലയാളത്തിൽ കല്പന വ്യക്തമാക്കാൻ അത് ചേർക്കുന്നത് ആവശ്യമാണ്.
- source_word: מִיכָיְהוּ
  choice: മീഖായാവ്
  rationale: ഹീബ്രു പേരിന്റെ രൂപം മലയാളത്തിലെ ബൈബിൾ നാമപരമ്പരയോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു; വിഭക്തി ചേർന്നപ്പോൾ ‘മീഖായാവിനെ’ എന്നു രൂപപ്പെട്ടു.
- source_word: בֶן יִמְלָה
  choice: ഇംലായുടെ മകൻ
  rationale: പിതൃനാമബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, ‘വിളിച്ച് ... എന്നു പറഞ്ഞു’ എന്ന സ്വാഭാവിക മലയാള ആഖ്യാനഘടന സ്വീകരിച്ചു; സָרִיס എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
