id: 1KI.22.51
reference: 1 Kings 22:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: ml
  text: യഹോശാഫാത്ത് തന്റെ പിതാക്കന്മാരോടുകൂടെ നിദ്രപ്രാപിച്ചു[a]. അവനെ തന്റെ പിതാക്കന്മാരോടുകൂടെ, തന്റെ പിതാവായ[b] ദാവീദിന്റെ നഗരത്തിൽ അടക്കം ചെയ്തു. അവന്റെ സ്ഥാനത്ത് അവന്റെ മകൻ യെഹോരാം രാജാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘തന്റെ പിതാക്കന്മാരോടുകൂടെ കിടന്നുറങ്ങി’; മരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടത്തെ ‘പിതാവ്’ എന്ന എബ്രായ ബന്ധപദത്തിന് ‘പൂർവപിതാവ്’ അഥവാ ‘പൂർവികൻ’ എന്നും അർഥമാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: നിദ്രപ്രാപിച്ചു
  rationale: രാജകീയ ചരമവിവരണങ്ങളിൽ മരണത്തെ സൂചിപ്പിക്കുന്ന പതിവുശൈലിയാണിത്. ‘മരിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനത്തേക്കാൾ എബ്രായ പ്രയോഗത്തിന്റെ സാഹിത്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: עִם אֲבֹתָיו
  choice: തന്റെ പിതാക്കന്മാരോടുകൂടെ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ ‘പിതാക്കന്മാർ’ പൂർവികരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: וַיִּקָּבֵר
  choice: അവനെ ... അടക്കം ചെയ്തു
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതകർത്തൃപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ശവകുടീരസൂചന ചേർക്കുന്നില്ല.
- source_word: בְּעִיר דָּוִד
  choice: ദാവീദിന്റെ നഗരത്തിൽ
  rationale: എബ്രായ സംയുക്തപദത്തിന്റെ അർഥവും അറിയപ്പെടുന്ന സ്ഥലനാമരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אָבִיו
  choice: തന്റെ പിതാവായ
  rationale: എബ്രായത്തിലെ אָב എന്ന ബന്ധപദം നേരിട്ട് നിലനിർത്തുന്നു; ദാവീദ് യഹോശാഫാത്തിന്റെ അടുത്ത പിതാവല്ല, പൂർവികനാണ് എന്ന വിശാല വംശാവലിപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּמְלֹךְ
  choice: രാജാവായി
  rationale: ഭരണകാലമൊട്ടാകെയല്ല, അധികാരമേറ്റതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ മലയാളരൂപം.
- source_word: תַּחְתָּיו
  choice: അവന്റെ സ്ഥാനത്ത്
  rationale: രാജസ്ഥാനത്തിലെ പിന്തുടർച്ചയും പകരം വരുന്നതും കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജകീയ ചരമസൂത്രത്തിന്റെ എബ്രായസ്വഭാവം ‘നിദ്രപ്രാപിച്ചു’, ‘പിതാക്കന്മാരോടുകൂടെ’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി; അസ്വാഭാവികത ഒഴിവാക്കാൻ വാക്യം മൂന്നായി വിഭജിച്ചു.
