revisions:
- from: 'അപ്പോൾ കെനയനയുടെ മകൻ സിദെക്കീയാവ് തനിക്കായി ഇരുമ്പുകൊണ്ടുള്ള കൊമ്പുകൾ ഉണ്ടാക്കി പറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇവകൊണ്ട് നീ അരാമ്യരെ കുത്തിമറിച്ച് പൂർണമായി നശിപ്പിക്കും.’”'
  to: 'അപ്പോൾ കെനാനാവിന്റെ മകൻ സിദെക്കീയാവ് തനിക്കായി ഇരുമ്പു കൊമ്പുകൾ ഉണ്ടാക്കി ഇപ്രകാരം പറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇവകൊണ്ട് നീ അരാമിനെ കുത്തിക്കൊണ്ടിരിക്കും, അവരെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ.’”'
  rationale: The revision corrects the name, preserves the collective ambiguity of אַרָם, and represents the ongoing goring action and its endpoint more closely, without treating Zedekiah's prophetic claim as narratorial affirmation.
