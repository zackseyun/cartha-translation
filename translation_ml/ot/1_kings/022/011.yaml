id: 1KI.22.11
reference: 1 Kings 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: ml
  text: 'അപ്പോൾ കെനാനാവിന്റെ മകൻ സിദെക്കീയാവ് തനിക്കായി ഇരുമ്പു കൊമ്പുകൾ ഉണ്ടാക്കി ഇപ്രകാരം പറഞ്ഞു: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു: ‘ഇവകൊണ്ട് നീ അരാമിനെ കുത്തിക്കൊണ്ടിരിക്കും, അവരെ പൂർണമായി നശിപ്പിക്കുന്നതുവരെ.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: ഇരുമ്പുകൊണ്ടുള്ള കൊമ്പുകൾ
  rationale: ‘ഇരുമ്പിന്റെ കൊമ്പുകൾ’ എന്ന കൃത്രിമ ഘടന ഒഴിവാക്കി, വസ്തുവും രൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: תְּנַגַּח
  choice: കുത്തിമറിച്ച്
  rationale: കൊമ്പുകൊണ്ട് ശക്തിയായി കുത്തുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദൃശ്യബലം നിലനിർത്തുന്നു.
- source_word: אֲרָם
  choice: അരാമ്യരെ
  rationale: ഇവിടെ യുദ്ധത്തിൽ എതിരിടുന്ന അരാംജനത/സൈന്യമാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന കർമരൂപം സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: עַד כַּלֹּתָם
  choice: പൂർണമായി നശിപ്പിക്കും
  rationale: രണ്ടാം പുരുഷ ക്രിയയോടു ചേർന്ന ലക്ഷ്യാർഥം നിലനിർത്തി, ‘അവരെ തീർത്തുകളയുന്നതുവരെ’ എന്ന ആശയം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമത്തിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം.
theological_decisions:
- issue: പ്രവാചകസൂത്രവാക്യത്തിലെ ദൈവനാമം
  choice: “യഹോവ ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു”
  alternative: “കർത്താവ് ഇപ്രകാരം അരുളിച്ചെയ്യുന്നു”
  rationale: മൂലപാഠത്തിൽ സാധാരണ പദവിയായ אֲדֹנָי അല്ല, വ്യക്തിനാമമായ יהוה ആണ്; അതിനാൽ വ്യാഖ്യാനപരമായി പദവി പകരാതെ നാമം നിലനിർത്തുന്നു.
- issue: עַד כַּלֹּתָם എന്നതിലെ പ്രവർത്താവും ഫലവും
  choice: “നീ ... പൂർണമായി നശിപ്പിക്കും”
  alternative: “അവർ തീർന്നുപോകുന്നതുവരെ നീ ... കുത്തും”
  rationale: പ്രത്യയം ‘അവരെ’ സൂചിപ്പിക്കുകയും സന്ദർഭത്തിൽ രാജാവിന്റെ സൈനികപ്രവർത്തനമാണ് നാശം വരുത്തുന്നതെന്നും വ്യക്തമാകുന്നു; അതേസമയം ദൈവിക അംഗീകാരം യാഥാർഥ്യമാണെന്ന് വിവർത്തനം വിധിക്കുന്നില്ല—ഇത് സിദെക്കീയാവിന്റെ അവകാശവാദമായിത്തന്നെ ഉദ്ധരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഔപചാരിക ഭാവത്തിന് ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു; നാടകീയമായ പ്രതീകപ്രവർത്തനത്തിന്റെ ദൃശ്യത നിലനിർത്തി.
