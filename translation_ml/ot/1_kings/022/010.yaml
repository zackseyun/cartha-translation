translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ വിവരണം. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ദൃശ്യത്തിലെ സമകാലികവും തുടർച്ചയുള്ളതുമായ പ്രവർത്തികൾ നിലനിർത്തി.
