  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: ml
  text: ഇസ്രായേൽ രാജാവും യെഹൂദാരാജാവായ യെഹോശാഫാത്തും ശമര്യയുടെ കവാടത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള മെതിക്കളത്തിൽ, വസ്ത്രങ്ങൾ ധരിച്ച്[a], ഓരോരുത്തനും സ്വന്തം സിംഹാസനത്തിൽ ഇരിക്കുകയായിരുന്നു. പ്രവാചകന്മാരെല്ലാം അവരുടെ മുമ്പിൽ പ്രവചിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജവസ്ത്രങ്ങൾ ധരിച്ച്.’ എബ്രായമൂലത്തിൽ ‘വസ്ത്രങ്ങൾ ധരിച്ച്’ എന്നുമാത്രമേ വ്യക്തമായി പറയുന്നുള്ളൂ; എന്നാൽ രാജകീയ പശ്ചാത്തലം ഔപചാരിക വേഷത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവും
  rationale: വാക്യാരംഭത്തിലെ וּ-യുടെ ബന്ധകശക്തി മലയാളത്തിലെ ‘-ഉം’ വഴി സ്വാഭാവികമായി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ യെഹോശാഫാത്തും
  rationale: പേരും അതിനോടു ചേർന്ന രാജപദവിയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יֹשְׁבִים
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാന കൃദന്തത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന ദൃശ്യാവസ്ഥ മലയാളത്തിലെ അപൂർണ ഭൂതകാലരൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: ഓരോരുത്തനും സ്വന്തം സിംഹാസനത്തിൽ
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥമായ ‘ഓരോരുത്തൻ’ നിലനിർത്തുന്നു; രാജകീയ പശ്ചാത്തലത്തിൽ כִּסֵּא എന്നത് ‘സിംഹാസനം’ എന്നാണ്.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: വസ്ത്രങ്ങൾ ധരിച്ച്[a]
  rationale: എബ്രായത്തിൽ രാജകീയമെന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അതു മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അക്ഷരാർഥവും സ്വാഭാവികതയും സംരക്ഷിക്കുന്നു.
- source_word: בְּגֹרֶן
  choice: മെതിക്കളത്തിൽ
  rationale: ധാന്യം മെതിക്കുന്ന തുറസ്സായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന גֹּרֶן എന്ന പദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: ശമര്യയുടെ കവാടത്തിന്റെ പ്രവേശനത്തിങ്കലുള്ള
  rationale: സംയുക്തബന്ധത്തിലെ ‘ശമര്യയുടെ കവാടം’ എന്നും അതിന്റെ ‘പ്രവേശനം’ എന്നും ഉള്ള രണ്ടു ഘടകങ്ങളും നിലനിർത്തുന്നു.
- source_word: וְכָל הַנְּבִיאִים
  choice: പ്രവാചകന്മാരെല്ലാം
  rationale: כָל എന്ന സമഗ്രതാസൂചകത്തെ ‘എല്ലാം’ വഴി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִתְנַבְּאִים
  choice: പ്രവചിച്ചുകൊണ്ടിരുന്നു
  rationale: ഹിത്പയേൽ രൂപത്തിന്റെ ഇവിടെ സാധാരണമായ ‘പ്രവചിക്കുക’ എന്ന അർഥവും പ്രവർത്തിയുടെ തുടർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: രാജാക്കന്മാരുടെ സന്നിധിയിൽ നടന്ന പ്രവചനത്തെ ഔപചാരികവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
