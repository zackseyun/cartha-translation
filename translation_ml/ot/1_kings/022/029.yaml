  yaml_path: translation/ot/1_kings/022/029.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: ml
  text: അങ്ങനെ ഇസ്രായേൽരാജാവും യെഹൂദാരാജാവായ യെഹോശാഫാത്തും രാമോത്ത്-ഗിലെയാദിലേക്കു കയറിച്ചെന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ ‘മുകളിലേക്കു പോകുക/കയറിച്ചെല്ലുക’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭമാണെങ്കിലും ‘പടനയിച്ചു’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ഇസ്രായേൽരാജാവ്
  rationale: വ്യക്തിനാമത്തിനു പകരം മൂലപാഠത്തിലുള്ള രാജപദവി തന്നെ സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וִיהוֹשָׁפָט
  choice: യെഹോശാഫാത്തും
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകി, וְ എന്ന സമുച്ചയത്തെ ‘-ഉം’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: מֶלֶךְ יְהוּדָה
  choice: യെഹൂദാരാജാവായ
  rationale: യെഹോശാഫാത്തിനെ വിശദീകരിക്കുന്ന സമാനാധികരണ പദവി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: רָמֹת גִּלְעָד
  choice: ഗിലെയാദിലെ രാമോത്ത്
  rationale: സംയുക്ത സ്ഥലനാമത്തിലെ ബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; പേരുകളുടെ പരമ്പരാഗത ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രുവിലെ ദിശാസൂചന സംരക്ഷിച്ചുകൊണ്ട് സൈനികപ്രവർത്തനം എന്ന ആശയം അനാവശ്യമായി ക്രിയയിൽ ചേർത്തിട്ടില്ല.
