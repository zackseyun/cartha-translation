id: 1KI.22.27
reference: 1 Kings 22:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ אֶת זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִילֻ֨/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד בֹּאִ֥/י בְ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: ml
  text: 'നീ ഇങ്ങനെ പറയണം: “രാജാവ് ഇപ്രകാരം പറയുന്നു: ‘ഇയാളെ കാരാഗൃഹത്തിലാക്കുക; ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുന്നതുവരെ അവന് കഷ്ടതയുടെ അപ്പവും കഷ്ടതയുടെ വെള്ളവും[a] കൊടുക്കുക.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞെരുക്കത്തിന്റെ അപ്പവും ഞെരുക്കത്തിന്റെ വെള്ളവും’ എന്നും പരിഭാഷപ്പെടുത്താം; കഠിനമോ വളരെ കുറവോ ആയ തടവുഭക്ഷണമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: രാജാവ് ഇപ്രകാരം പറയുന്നു
  rationale: എബ്രായ ദൂതസന്ദേശസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: שִׂימוּ אֶת זֶה
  choice: ഇയാളെ കാരാഗൃഹത്തിലാക്കുക
  rationale: സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത് മീഖായാവിനെയാണ്; ‘ഇയാളെ’ എന്നത് demonstrative-ന്റെ ശക്തി നിലനിർത്തുന്നു. ‘കാരാഗൃഹത്തിലാക്കുക’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി തടവിലിടൽ സൂചിപ്പിക്കുന്നു.
- source_word: בֵּית הַכֶּלֶא
  choice: കാരാഗൃഹം
  rationale: ‘തടവിന്റെ വീട്’ എന്ന അക്ഷരാർഥത്തിനുപകരം അതേ നിർദ്ദിഷ്ട അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളപദത്തിൽ നൽകുന്നു.
- source_word: וְהַאֲכִילֻהוּ
  choice: അവന് … കൊടുക്കുക
  rationale: അക്ഷരാർഥം ‘അവനെ തീറ്റുക’ എന്നാണെങ്കിലും അപ്പവും വെള്ളവും ഒരുമിച്ച് വരുന്നതിനാൽ ‘കൊടുക്കുക’ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; തടവുകാരന് നിശ്ചിത റേഷൻ നൽകണമെന്ന കല്പന നിലനിൽക്കുന്നു.
- source_word: לֶחֶם לַחַץ
  choice: കഷ്ടതയുടെ അപ്പം
  rationale: לַחַץ എന്ന പദത്തിലെ ഞെരുക്കം, ദുരിതം എന്നീ അർഥസാധ്യതകൾ ചുരുക്കാതെ എബ്രായ രൂപകം നിലനിർത്തുന്നു.
- source_word: וּמַיִם לַחַץ
  choice: കഷ്ടതയുടെ വെള്ളം
  rationale: ‘കഷ്ടതയുടെ അപ്പം’ എന്ന സമാന്തരഘടന സംരക്ഷിക്കുന്നു; വളരെ കുറവോ കഠിനമോ ആയ തടവുഭക്ഷണമാണ് ഉദ്ദേശ്യമാകാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: ഞാൻ സമാധാനത്തോടെ മടങ്ങിവരുന്നതുവരെ
  rationale: בְשָׁלוֹם എന്നതിന്റെ ‘സുരക്ഷിതമായി/ക്ഷേമത്തോടെ’ എന്ന സാധ്യതയെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ‘സമാധാനത്തോടെ’ എന്നു നൽകുന്നു. സന്ദർഭാനുസൃതമായി ‘മടങ്ങിവരുക’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ആഹാബിന്റെ בְשָׁלוֹם എന്ന പ്രസ്താവനയിലെ അർഥവും കഥനപരമായ വൈരുധ്യവും
  choice: സമാധാനത്തോടെ
  alternative: സുരക്ഷിതമായി; വിജയത്തോടെ
  rationale: രാജാവ് യുദ്ധത്തിൽനിന്ന് അപകടമില്ലാതെ മടങ്ങുമെന്ന ആത്മവിശ്വാസവും തുടർന്നുള്ള കഥയിലെ പരിഹാസാത്മക സംഘർഷവും ഈ രൂപം നിലനിർത്തുന്നു; ‘വിജയത്തോടെ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള രാജകീയ കല്പനാഭാവം ഉപയോഗിച്ചു. അതിപുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി; എബ്രായത്തിലെ ആവർത്തനവും ‘സമാധാനത്തോടെ’ എന്ന ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
