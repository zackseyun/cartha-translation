id: 1KI.22.33
reference: 1 Kings 22:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: ml
  text: അപ്പോൾ രഥസേനാധിപന്മാർ അവൻ ഇസ്രായേൽരാജാവല്ലെന്നു കണ്ടപ്പോൾ, അവനെ പിന്തുടരുന്നതിൽനിന്ന് അവർ പിന്മാറി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അവന്റെ പിന്നാലെനിന്ന്”; ഒരാളെ പിന്തുടരുന്നതോ വേട്ടയാടുന്നതോ നിർത്തുക എന്നർഥമുള്ള എബ്രായപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: അപ്പോൾ
  rationale: ഹീബ്രു ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധകമായി ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: כִּרְאוֹת
  choice: കണ്ടപ്പോൾ
  rationale: כְּ ചേർന്ന infinitive construct സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ അതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപമാണ്.
- source_word: שָׂרֵי הָרֶכֶב
  choice: രഥസേനാധിപന്മാർ
  rationale: שָׂרֵי സൈനിക മേലധികാരികളെയും הָרֶכֶב രഥങ്ങളെയോ രഥസേനയെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ രഥസേനയുടെ അധിപന്മാർ എന്ന സംയുക്തരൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: അവൻ ഇസ്രായേൽരാജാവല്ലെന്ന്
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമമായ הוּא പിന്തുടരപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; തിരിച്ചറിഞ്ഞ കാര്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ നേരിട്ട് നൽകി.
- source_word: וַיָּשׁוּבוּ
  choice: അവർ പിന്മാറി
  rationale: שׁוּב ഇവിടെ നടന്നുകൊണ്ടിരുന്ന പിന്തുടരലിൽനിന്ന് തിരിഞ്ഞുപോകുകയോ പിൻവാങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സൈനികസന്ദർഭത്തിൽ ‘പിന്മാറി’ യോജിക്കുന്നു.
- source_word: מֵאַחֲרָיו
  choice: അവനെ പിന്തുടരുന്നതിൽനിന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ പിന്നാലെനിന്ന്’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അവനെ പിന്തുടരുന്നത് അവസാനിപ്പിച്ചു എന്ന പ്രയോഗാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘രഥസേനാധിപന്മാർ’ എന്ന സംയുക്തപദം സൈനികസന്ദർഭം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു; എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
