    rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ടാണ് ഉള്ളത്. നൽകിയിരിക്കുന്ന ഇംഗ്ലീഷ് POB audit trail അതിനെ ‘Yahweh’ എന്നു നിശ്ചയിക്കുന്നു. ‘യഹോവ’ Jehovah-പരമ്പരയെ പ്രതിനിധീകരിക്കുന്ന വേറിട്ട രൂപമായതിനാൽ നിശ്ചയിച്ച നാമരൂപത്തോടുള്ള പൊരുത്തത്തിനായി ‘യാഹ്‌വേ’ എന്നു തിരുത്തണം.
  revised_text: 'മോശെ മിദ്യാന്യനായ രെയൂവേലിന്റെ മകൻ ഹോബാബിനോട്—മോശെയുടെ അമ്മായിയപ്പനോട്[a]—പറഞ്ഞു: “യാഹ്‌വേ, ‘ഞാൻ നിങ്ങൾക്കു തരാം’ എന്നു പറഞ്ഞ സ്ഥലത്തേക്കു ഞങ്ങൾ യാത്ര പുറപ്പെടുകയാണ്. ഞങ്ങളോടൊപ്പം വരുക; ഞങ്ങൾ നിനക്കു നന്മ ചെയ്യും. കാരണം യാഹ്‌വേ ഇസ്രായേലിനെക്കുറിച്ച് നന്മ അരുളിച്ചെയ്തിരിക്കുന്നു.”'
