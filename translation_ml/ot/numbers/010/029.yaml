source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: ml
  text: 'മോശെ മിദ്യാന്യനായ രെയൂവേലിന്റെ മകൻ ഹോബാബിനോട്—മോശെയുടെ അമ്മായിയപ്പനോട്[a]—പറഞ്ഞു: “യാഹ്‌വേ, ‘ഞാൻ നിങ്ങൾക്കു തരാം’ എന്നു പറഞ്ഞ സ്ഥലത്തേക്കു ഞങ്ങൾ യാത്ര പുറപ്പെടുകയാണ്. ഞങ്ങളോടൊപ്പം വരുക; ഞങ്ങൾ നിനക്കു നന്മ ചെയ്യും. കാരണം യാഹ്‌വേ ഇസ്രായേലിനെക്കുറിച്ച് നന്മ അരുളിച്ചെയ്തിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹתֵן എന്ന ഹീബ്രുപദം വിവാഹബന്ധത്തിലുള്ള പുരുഷബന്ധുവിനെ വിശാലമായി സൂചിപ്പിക്കാം. അതിനാൽ ഇവിടെ ‘മോശെയുടെ അളിയൻ’ എന്നോ ‘മോശെയുടെ വിവാഹബന്ധു’ എന്നോ ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: ഹോബാബ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ശബ്ദലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: רְעוּאֵל
  choice: രെയൂവേൽ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണം കഴിയുന്നത്ര നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: הַמִּדְיָנִי
  choice: മിദ്യാന്യനായ
  rationale: നിശ്ചിത ജനവിഭാഗബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: חֹתֵן מֹשֶׁה
  choice: മോശെയുടെ അമ്മായിയപ്പൻ
  rationale: חֹתֵן എന്ന പദത്തിന്റെ സാധാരണ അർഥം സ്വീകരിച്ചു; വിവാഹബന്ധത്തിലുള്ള പുരുഷബന്ധു എന്ന വിശാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: ഞങ്ങൾ യാത്ര പുറപ്പെടുകയാണ്
  rationale: കർത്തൃസർവനാമത്തോടുകൂടിയ പങ്കാളിക്രിയ ആരംഭിക്കാനിരിക്കുന്നതോ നടന്നുകൊണ്ടിരിക്കുന്നതോ ആയ യാത്രയെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: യഹോവ, ‘ഞാൻ നിങ്ങൾക്കു തരാം’ എന്നു പറഞ്ഞ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഏകവചന കർമവും ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന ‘നിങ്ങൾക്കു’വും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: לְכָה אִתָּנוּ
  choice: ഞങ്ങളോടൊപ്പം വരുക
  rationale: മോശെയുടെ ക്ഷണം മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള രൂപത്തിൽ നൽകുന്നു.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: ഞങ്ങൾ നിനക്കു നന്മ ചെയ്യും
  rationale: יטב എന്ന ക്രിയയുടെ കാരകപ്രയോഗത്തിലുള്ള ഗുണകരമായി പ്രവർത്തിക്കുക എന്ന അർഥം അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെക്കുറിച്ച് നന്മ അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: ‘സംസാരിച്ചു’ എന്ന ക്രിയാത്മക ആശയവും ‘നന്മ’ എന്ന നാമപ്രയോഗവും സൂക്ഷിക്കുന്നു; ദൈവവചനത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘അരുളിച്ചെയ്തിരിക്കുന്നു’.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: חֹתֵן מֹשֶׁה സൂചിപ്പിക്കുന്ന കൃത്യമായ വിവാഹബന്ധം
  choice: മോശെയുടെ അമ്മായിയപ്പൻ
  alternative: മോശെയുടെ വിവാഹബന്ധു / അളിയൻ
  rationale: പദത്തിന്റെ സാധാരണ പ്രത്യേകാർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചെങ്കിലും അതിന്റെ വിശാലമായ അർഥപരിധിയും വംശാവലിസംബന്ധമായ അവ്യക്തതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: דִּבֶּר טוֹב എന്നതിലെ വാഗ്ദാനസൂചന
  choice: നന്മ അരുളിച്ചെയ്തിരിക്കുന്നു
  alternative: നന്മ വാഗ്ദാനം ചെയ്തിരിക്കുന്നു
  rationale: സന്ദർഭത്തിൽ വാഗ്ദാനത്തിന്റെ ആശയം സാധ്യമാണെങ്കിലും മൂലപാഠം ‘നന്മ സംസാരിച്ചു’ എന്നാണ്; അതിനാൽ ‘വാഗ്ദാനം’ എന്ന് വ്യക്തമായി ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ലാളിത്യവും ഹീബ്രു പാഠത്തിലെ ബന്ധപരമായ അവ്യക്തതയും സംരക്ഷിച്ചിരിക്കുന്നു.
