source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: ml
  text: നിനക്കായി വെള്ളികൊണ്ടുള്ള രണ്ട് കാഹളങ്ങൾ ഉണ്ടാക്കുക. ചുറ്റികകൊണ്ട് അടിച്ചു രൂപപ്പെടുത്തിയവയായി[a] അവയെ ഉണ്ടാക്കണം. സമൂഹത്തെ വിളിച്ചുകൂട്ടുന്നതിനും പാളയങ്ങൾ പുറപ്പെടുന്നതിനും[b] അവ നിനക്കു ഉപയോഗിക്കേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിച്ചുണ്ടാക്കിയ പണിയായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പാളയങ്ങളുടെ പുറപ്പാടിനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: നിനക്കായി ... ഉണ്ടാക്കുക
  rationale: לְךָ എന്ന ഘടകം മോശെയുടെ ഉപയോഗത്തിനും ചുമതലയ്ക്കുമായി അവ ഉണ്ടാക്കണമെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അത് ‘നിനക്കായി’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: വെള്ളികൊണ്ടുള്ള രണ്ട് കാഹളങ്ങൾ
  rationale: חֲצֹצְרָה വളഞ്ഞ കൊമ്പിനെയല്ല, ഊതുന്ന ലോഹക്കാഹളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; כֶּסֶף അവയുടെ നിർമ്മാണവസ്തു വെള്ളിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִקְשָׁה
  choice: അടിച്ചുപരത്തിയ പണിയായി
  rationale: ലോഹം ചുറ്റികകൊണ്ട് അടിച്ചുപരത്തി രൂപപ്പെടുത്തുന്ന നിർമ്മാണരീതിയാണ് പദം പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘ഒറ്റത്തുണ്ടായി’ എന്നത് സാദ്ധ്യമായ ഫലത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
- source_word: וְהָיוּ לְךָ
  choice: അവ നിനക്കു ഉപകരിക്കണം
  rationale: ഉടമസ്ഥത മാത്രം അല്ല, തുടർന്നുപറയുന്ന ആവശ്യങ്ങൾക്കായി അവ ഉപയോഗിക്കപ്പെടണം എന്ന ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמִקְרָא הָעֵדָה
  choice: സമൂഹത്തെ വിളിച്ചുകൂട്ടുന്നതിനും
  rationale: מִקְרָא ഇവിടെ വിളിച്ചുകൂട്ടൽ അഥവാ സമാഹ്വാനം എന്നും הָעֵדָה ഇസ്രായേൽ സമൂഹം എന്നും അർഥമാക്കുന്നു.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: പാളയങ്ങൾ യാത്ര പുറപ്പെടുന്നതിനും
  rationale: മരുഭൂയാത്രയുടെ പശ്ചാത്തലത്തിൽ מַסַּע പാളയങ്ങൾ തങ്ങളുടെ സ്ഥാനങ്ങളിൽനിന്ന് യാത്ര തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; കാഹളം അതിനുള്ള അടയാളമായി പ്രവർത്തിക്കുന്നു.
