translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദ്ദേശശൈലി ഉപയോഗിച്ചു. ‘കാഹളം’, ‘സമൂഹം’, ‘പാളയം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; ഹീബ്രുവിലെ നിർമ്മാണരീതിയുടെയും പുറപ്പാടിന്റെയും സൂക്ഷ്മതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
