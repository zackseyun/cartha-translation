id: NUM.10.7
reference: Numbers 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: ml
  text: എന്നാൽ, ജനസമൂഹത്തെ വിളിച്ചുകൂട്ടുമ്പോൾ, നിങ്ങൾ കാഹളങ്ങൾ ഊതണം; എന്നാൽ മുന്നറിയിപ്പുസൂചന മുഴക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അലാറം മുഴക്കരുത്.’ എബ്രായം സാധാരണ കാഹളം ഊതുന്നതും പാളയങ്ങൾ പുറപ്പെടാനുള്ള സന്ദർഭത്തിൽ ഉപയോഗിക്കുന്ന പ്രത്യേക അലാറം-സൂചനയും തമ്മിൽ വേർതിരിച്ചുകാണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: എന്നാൽ ... വിളിച്ചുകൂട്ടുമ്പോൾ
  rationale: കהל എന്ന ധാതുവിന്റെ ഹിഫീൽ ക്രിയാനാമരൂപം ഇവിടെ ‘കൂട്ടിവരുത്തുക/വിളിച്ചുകൂട്ടുക’ എന്ന കാരകാർഥവും സമയബന്ധവും നൽകുന്നു. മുൻവാക്യത്തിലെ പുറപ്പെടൽസൂചനയോടുള്ള വ്യത്യാസം ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַקָּהָל
  choice: സഭയെ
  rationale: ഇവിടെ പദം യിസ്രായേലിന്റെ കൂടിവരുന്ന സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ ആ കൂട്ടായ്മയെ മാന്യവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִּתְקְעוּ
  choice: നിങ്ങൾ കാഹളം ഊതണം
  rationale: תקע കാഹളസന്ദർഭത്തിൽ ഊതുക എന്നാണ്. എബ്രായവാക്യത്തിൽ ഉപകരണം ആവർത്തിക്കുന്നില്ലെങ്കിലും മലയാളത്തിൽ ‘ഊതണം’ എന്നതിന് സ്വാഭാവികമായ കർമം ആവശ്യമായതിനാൽ സന്ദർഭത്തിൽ വ്യക്തമായ ‘കാഹളം’ ചേർത്തു.
- source_word: וְ/לֹא
  choice: '... മുഴക്കരുത്'
  rationale: നിഷേധാത്മക നിർദേശം മലയാളത്തിലെ സ്വാഭാവിക നിയമനിർദേശ ശൈലിയിൽ ‘മുഴക്കരുത്’ എന്നു നൽകി.
- source_word: תָרִיעוּ
  choice: പുറപ്പെടാനുള്ള മുന്നറിയിപ്പുസ്വരം മുഴക്കരുത്
  rationale: הֵרִיעַ ഇവിടെ സാധാരണ കാഹളം ഊതുന്നതിൽനിന്ന് വ്യത്യസ്തമായ, പാളയം പുറപ്പെടാനുള്ള പ്രത്യേക സൂചനാശബ്ദത്തെ സൂചിപ്പിക്കുന്നു. സമീപസന്ദർഭം വ്യക്തമാക്കുന്ന പ്രവർത്തനാർഥം വിവർത്തനത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിർദേശശൈലി. ‘കാഹളം’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ചേർത്തു. സാങ്കേതിക സൂചനയുടെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കാൻ ‘പുറപ്പെടാനുള്ള മുന്നറിയിപ്പുസ്വരം’ ഉപയോഗിച്ചു; പകരം വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
