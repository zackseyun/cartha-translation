id: NUM.10.36
reference: Numbers 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: ml
  text: 'അത് വിശ്രമിക്കുമ്പോൾ അവൻ ഇങ്ങനെ പറയുമായിരുന്നു: “യാഹ്‌വേയേ[a], ഇസ്രായേലിന്റെ പതിനായിരക്കണക്കിന് ആയിരങ്ങളിലേക്കു മടങ്ങിവരണമേ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ യְהוָה എന്ന ദൈവനാമമാണ്.
    reason: divine_name
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ഇസ്രായേലിന്റെ ആയിരങ്ങളുടെ പതിനായിരങ്ങൾ.” ഇസ്രായേലിന്റെ വിപുലമായ സംഖ്യയെ ഊന്നിപ്പറയുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: അത് വിശ്രമിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct forms a temporal clause. The pronominal suffix refers back to the ark; Malayalam naturally retains this as ‘അത്’ without unnecessarily repeating the noun.
- source_word: יֹאמַר
  choice: അവൻ ഇങ്ങനെ പറയുമായിരുന്നു
  rationale: The imperfect has habitual or iterative force in this narrative setting, so ‘പറയുമായിരുന്നു’ is more accurate than a simple past. ‘ഇങ്ങനെ’ naturally introduces the following direct speech.
- source_word: שׁוּבָה
  choice: മടങ്ങിവരണമേ
  rationale: The imperative directly appeals for Yahweh to return. The respectful imperative ending ‘-ണമേ’ suits prayerful direct address without adding an interpretation such as ‘remain.’
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: The divine personal name is transliterated as ‘യഹോവ’; the vocative form ‘യഹോവേ’ is required by natural Malayalam direct address.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആയിരങ്ങളുടെ പതിനായിരങ്ങളിലേക്കു
  rationale: This relatively formal rendering preserves the Hebrew stacking of ‘myriads/ten-thousands’ and ‘thousands’ rather than reducing the phrase to a vague ‘multitudes.’ The directional ending supplies in Malayalam the relation implied after ‘return.’
theological_decisions:
- issue: യְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: The Hebrew text directly uses the Tetragrammaton. Retaining the personal name avoids replacing it with a title and preserves the direct covenantal address.
- issue: שׁוּבָה എന്ന കല്പനയുടെ അർഥം
  choice: മടങ്ങിവരണമേ
  alternative: വസിക്കണമേ
  rationale: ‘Return’ preserves the movement and tension of שוב. Rendering it ‘dwell/remain’ would resolve the expression interpretively and obscure its connection with Yahweh’s going out before Israel in the preceding verse.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. എബ്രായത്തിലെ പതിവായി ആവർത്തിച്ച പ്രവൃത്തിയെ ‘പറയുമായിരുന്നു’ എന്നും നേരിട്ടുള്ള അഭിസംബോധനയെ ‘യഹോവേ’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിച്ചു. സംഖ്യാസമുച്ചയത്തിന്റെ അസാധാരണമായ എബ്രായ ഊന്നൽ പ്രധാനപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
