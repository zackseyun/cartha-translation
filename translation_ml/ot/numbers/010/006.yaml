id: NUM.10.6
reference: Numbers 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/תְקַעְתֶּ֤ם תְּרוּעָה֙ שֵׁנִ֔ית וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים תֵּימָ֑נָ/ה תְּרוּעָ֥ה יִתְקְע֖וּ לְ/מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: ml
  text: നിങ്ങൾ രണ്ടാം പ്രാവശ്യം മുന്നറിയിപ്പുസൂചനയായി കാഹളം ഊതുമ്പോൾ, തെക്കുവശത്തു തമ്പടിച്ചിരിക്കുന്ന പാളയങ്ങൾ പുറപ്പെടും; അവരുടെ യാത്രപുറപ്പാടുകൾക്കായി അവർ മുന്നറിയിപ്പുസൂചനയായി കാഹളം ഊതണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: നിങ്ങൾ ... മുഴക്കുമ്പോൾ
  rationale: תקע എന്ന ക്രിയ കാഹളം ഊതുക/മുഴക്കുക എന്നർഥത്തിലാണ്. നിർദേശങ്ങളുടെ ക്രമത്തിൽ സ്വാഭാവികമായ ഉപവാക്യരൂപവും രണ്ടാംപുരുഷ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: תְּרוּעָה
  choice: മുന്നറിയിപ്പിനുള്ള കാഹളനാദം
  rationale: ഇവിടെ സാധാരണ ശബ്ദമല്ല, പാളയങ്ങളുടെ നീക്കം അറിയിക്കുന്ന പ്രത്യേക കാഹളസൂചനയാണ് ഉദ്ദേശിക്കുന്നത്. ‘മുന്നറിയിപ്പിനുള്ള കാഹളനാദം’ അർഥവും സാഹചര്യവും വ്യക്തമാക്കുന്നു.
- source_word: שֵׁנִית
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: രണ്ടാമത്തെ സൂചനയാണെന്ന ക്രമാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנָסְעוּ
  choice: യാത്ര പുറപ്പെടണം
  rationale: נסע ഇവിടെ പാളയം വിട്ട് യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; നിർദേശാത്മക ഭാവം മലയാളത്തിൽ ‘പുറപ്പെടണം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: הַמַּחֲנוֹת
  choice: പാളയങ്ങൾ
  rationale: ഗോത്രങ്ങളുടെ പാളയവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: הַחֹנִים
  choice: പാളയമടിച്ചിരിക്കുന്ന
  rationale: חנה എന്ന ക്രിയയുടെ കർത്തൃവാചക രൂപം സൂചിപ്പിക്കുന്ന നിലാവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: תֵּימָנָה
  choice: തെക്കുവശത്ത്
  rationale: സന്ദർഭത്തിൽ യാത്രയുടെ ദിശയേക്കാൾ പാളയങ്ങളുടെ തെക്കൻ സ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: മുന്നറിയിപ്പിനുള്ള കാഹളനാദം മുഴക്കണം
  rationale: നാമം-ക്രിയ ആവർത്തനം നിർദേശിക്കപ്പെട്ട പ്രത്യേക സൂചനയെ ഊന്നുന്നു. ഹീബ്രു ക്രിയ മൂന്നാംപുരുഷ ബഹുവചനമായതിനാൽ കർത്താവിനെ അനിശ്ചിതമായി വിടുന്ന മലയാള നിർദേശരൂപം അനുയോജ്യമാണ്.
- source_word: לְמַסְעֵיהֶם
  choice: അവരുടെ പുറപ്പാടുകൾക്കായി
  rationale: מסע പാളയം വിട്ടുള്ള പുറപ്പാടുകളെയോ യാത്രാഘട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ബഹുവചനവും ഉദ്ദേശ്യാർഥവും നിലനിർത്തുന്നു.
