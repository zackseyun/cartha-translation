revisions:
- from: നിങ്ങൾ രണ്ടാം പ്രാവശ്യം മുന്നറിയിപ്പിനുള്ള കാഹളനാദം[a] മുഴക്കുമ്പോൾ, തെക്കുവശത്ത് പാളയമടിച്ചിരിക്കുന്ന പാളയങ്ങൾ യാത്ര പുറപ്പെടണം. അവരുടെ പുറപ്പാടുകൾക്കായി മുന്നറിയിപ്പിനുള്ള കാഹളനാദം മുഴക്കണം.
