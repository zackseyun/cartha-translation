translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സൈനിക ‘അലാറം’ എന്ന കടംവാക്ക് ഒഴിവാക്കി, സന്ദർഭസൂചന വ്യക്തമാക്കുന്ന ‘മുന്നറിയിപ്പിനുള്ള കാഹളനാദം’ ഉപയോഗിച്ചു.
