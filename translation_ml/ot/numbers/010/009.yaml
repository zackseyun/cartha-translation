id: NUM.10.9
reference: Numbers 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: ml
  text: നിങ്ങളുടെ ദേശത്ത് നിങ്ങളെ ഞെരുക്കുന്ന ശത്രുവിനെതിരെ നിങ്ങൾ യുദ്ധത്തിനു പോകുമ്പോൾ[a], കാഹളങ്ങൾകൊണ്ട് അപായസൂചന മുഴക്കണം. അപ്പോൾ നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ മുമ്പാകെ നിങ്ങൾ ഓർക്കപ്പെടുകയും[b][c] നിങ്ങളുടെ ശത്രുക്കളിൽനിന്ന് രക്ഷിക്കപ്പെടുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ ദേശത്ത് നിങ്ങൾ യുദ്ധത്തിനു പോയാൽ.’ എബ്രായ സംയോജകം ഒരു സാഹചര്യത്തെയോ നിബന്ധനയെയോ പരിചയപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ മുമ്പാകെ നിങ്ങളെ ഓർമയിലേക്കു കൊണ്ടുവരും’; കൂടുതൽ വ്യാഖ്യാനപരമായി, ‘നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളെ ഓർക്കും.’
    reason: lexical_alternative
  - marker: c
    text: ‘യഹ്‌വെ’ എന്നത് എബ്രായത്തിലെ YHWH എന്ന ദൈവനാമത്തിന്റെ ലിപ്യന്തരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: പോകുമ്പോൾ
  rationale: നിയമപരമായ നിർദേശത്തിൽ ഭാവിയിലെ ഒരു സാഹചര്യമോ നിബന്ധനയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘പോകുമ്പോൾ’ സ്വീകരിച്ച് ‘പോയാൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: യുദ്ധത്തിനു പോകുക
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അർഥം യുദ്ധത്തിൽ ഏർപ്പെടുക എന്നതാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: בְּאַרְצְכֶם
  choice: നിങ്ങളുടെ ദേശത്ത്
  rationale: ഇസ്രായേലിന്റെ സ്വന്തം ഭൂവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘രാജ്യത്ത്’ എന്നതിനെക്കാൾ ‘ദേശത്ത്’ ഉടമ്പടിപരവും ഭൗമപരവുമായ ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: നിങ്ങളെ ഞെരുക്കുന്ന ശത്രുവിനെതിരെ
  rationale: צַר എന്ന ശത്രുവാചക നാമവും צֹרֵר എന്ന നിരന്തരം ശത്രുതയോടെ ഞെരുക്കുന്ന പ്രവർത്തിയും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: കാഹളങ്ങൾകൊണ്ട് അപായസൂചന മുഴക്കണം
  rationale: രוע എന്ന ഹിഫീൽ രൂപം ഇവിടെ വെറും ഉച്ചത്തിലുള്ള ശബ്ദമല്ല, യുദ്ധസംബന്ധമായ മുന്നറിയിപ്പോ അപായസൂചനയോ കാഹളത്തിൽ മുഴക്കുന്നതാണ്.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെയുടെ മുമ്പാകെ നിങ്ങൾ ഓർക്കപ്പെടുകയും
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയത്വം സംരക്ഷിച്ച് ദൈവത്തെ വ്യാഖ്യാനപരമായി നേരിട്ടുള്ള കർത്താവാക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ YHWH-നെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പരിചിതവും ഉച്ചരിക്കാവുന്നതുമായ ലിപ്യന്തരണം നൽകുന്നു.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: നിങ്ങളുടെ ശത്രുക്കളിൽനിന്ന് രക്ഷിക്കപ്പെടുകയും ചെയ്യും
  rationale: നിഫാൽ രൂപത്തിന്റെ നിഷ്ക്രിയ അർഥവും സൈനികസന്ദർഭത്തിലെ വിടുതലും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു.
- issue: וֲנִזְכַּרְתֶּם എന്നതിന്റെ കർത്തൃ-കർമബന്ധം
  choice: നിങ്ങൾ ഓർക്കപ്പെടും
  alternative: നിങ്ങളുടെ ദൈവമായ യഹ്‌വെ നിങ്ങളെ ഓർക്കും
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയ രൂപം മുഖ്യവാചകത്തിൽ സൂക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനപരമായ സജീവരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ഓർക്കപ്പെടും’ എന്ന അല്പം അസാധാരണമായ നിഷ്ക്രിയപ്രയോഗം മൂലപാഠത്തിന്റെ രൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
