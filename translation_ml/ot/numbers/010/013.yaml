source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: ml
  text: അങ്ങനെ അവർ യാഹ്‌വെ മോശെയിലൂടെ നൽകിയ കല്പനപ്രകാരം ആദ്യമായി യാത്ര പുറപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘മോശെയുടെ കൈയാൽ’; മോശെ മധ്യസ്ഥനോ കാര്യനിർവാഹകനോ ആയി പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്ന ശൈലിപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണത്തിൽ נסע പാളയം പൊളിച്ച് യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘യാത്ര പുറപ്പെട്ടു’ എന്നത് ഈ ആരംഭഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בָּרִאשֹׁנָה
  choice: ആദ്യമായി
  rationale: ഈ ക്രിയാവിശേഷണരൂപം ‘ആദ്യമായി’ അഥവാ ‘ആദ്യഘട്ടത്തിൽ’ എന്നർഥം നൽകുന്നു; സീനായിൽനിന്നുള്ള പ്രഥമ പുറപ്പാടെന്ന ആശയം ഇവിടെ യോജിക്കുന്നു.
- source_word: עַל פִּי
  choice: കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായിന്മേൽ’ എന്ന ഈ പ്രയോഗം കല്പനയോ നിർദേശമോ അനുസരിച്ച് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന ഹീബ്രു ശൈലി ഇവിടെ മോശെയുടെ മധ്യസ്ഥതയെയോ കാര്യനിർവഹണ പങ്കിനെയോ സൂചിപ്പിക്കുന്നു; ‘മോശെയിലൂടെ’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: വാക്യത്തിലുള്ള വ്യക്തിനാമസ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ ‘യഹോവ’ സ്വീകരിച്ചു; ഇത് ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റുന്നില്ല.
- issue: ദൈവകല്പനയും മോശെയുടെ മധ്യസ്ഥതയും തമ്മിലുള്ള ബന്ധം
  choice: മോശെയിലൂടെ യഹോവ നൽകിയ കല്പനപ്രകാരം
  alternative: മോശെയുടെ കൈയാൽ യഹോവയുടെ വായ്‌പ്രകാരം
  rationale: കല്പനയുടെ ഉറവിടം യഹോവയും അതിന്റെ മധ്യസ്ഥൻ മോശെയും ആണെന്ന ഹീബ്രു ഘടന സംരക്ഷിക്കുന്നു; അക്ഷരാർഥശൈലി മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാമെന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രു വാക്യക്രമത്തിലെ ദൈവകല്പനയും മോശെയുടെ മധ്യസ്ഥതയും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
