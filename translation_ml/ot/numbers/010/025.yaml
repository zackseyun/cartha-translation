source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: ml
  text: പിന്നെ ദാൻമക്കളുടെ പാളയത്തിന്റെ കൊടി[a] പുറപ്പെട്ടു; എല്ലാ പാളയങ്ങൾക്കും അവയുടെ സൈന്യഗണങ്ങൾക്കനുസരിച്ച് പിൻകാവലായി[b] നീങ്ങി. അതിന്റെ സൈന്യഗണത്തിന്റെ നേതാവായിരുന്നത് അമ്മീശദ്ദായിയുടെ മകൻ അഹീയേസെർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊടി’ എന്നതിന് ‘പതാക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപദത്തിന് അക്ഷരാർഥത്തിൽ ‘പിന്നിലുള്ളവരെ കൂട്ടിച്ചേർക്കുന്നവൻ’ എന്ന ആശയവുമുണ്ട്; ഇവിടെ യാത്രാനിരയുടെ ഏറ്റവും പിന്നിൽ നീങ്ങുന്ന ചുമതലയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: പിന്നെ ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തിലെ അടുത്ത നീക്കത്തെ സൂചിപ്പിക്കുന്നു; യാത്രാസന്ദർഭത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: דֶּגֶל
  choice: കൊടി
  rationale: ഗോത്രപാളയം അണിനിരന്നിരുന്ന തിരിച്ചറിയൽചിഹ്നമായ കൊടിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: ദാൻമക്കളുടെ പാളയം
  rationale: ഹീബ്രായ കുടുംബ-ഗോത്രപ്രയോഗത്തിലെ ‘മക്കൾ’ നിലനിർത്തുകയും מַחֲנֶה എന്നത് ‘പാളയം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: מְאַסֵּף
  choice: പിൻകാവലായി നീങ്ങി
  rationale: അക്ഷരാർഥത്തിൽ കൂട്ടിച്ചേർക്കുകയോ പിന്നിലുള്ളവരെ ശേഖരിക്കുകയോ ചെയ്യുന്ന ആശയം ഉണ്ടെങ്കിലും, ഇവിടെ യാത്രാസംഘത്തിന്റെ ഏറ്റവും പിന്നിൽ നീങ്ങുന്ന ഘടകത്തിന്റെ പ്രവർത്തനമാണ്; ‘പിൻകാവൽ’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְכָל הַמַּחֲנֹת
  choice: പാളയങ്ങൾക്കെല്ലാം
  rationale: ദാൻ വിഭാഗം മുഴുവൻ പാളയനിരയോടും ബന്ധപ്പെട്ട് നിർവഹിച്ച പിൻഭാഗത്തെ ചുമതല വ്യക്തമാക്കുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവയുടെ സൈന്യഗണങ്ങൾപ്രകാരം
  rationale: צָבָא ഇവിടെ യുദ്ധസേനയെ മാത്രം അല്ല, ക്രമീകരിക്കപ്പെട്ട ഗോത്രഗണങ്ങളെയും സൂചിപ്പിക്കുന്നു; ‘സൈന്യഗണം’ സൈനിക-സംഘടനാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: וְעַל צְבָאוֹ
  choice: ദാന്റെ സൈന്യഗണത്തിന് അധിപനായിരുന്നത്
  rationale: עַל എന്നത് ആ ഗണത്തിനുമേലുള്ള നേതൃത്വത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ ‘ദാന്റെ’ എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: അമ്മീശദ്ദായിയുടെ മകൻ അഹീയേസെർ
  rationale: ഹീബ്രായ പിതൃനാമസൂത്രം സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തി, പേരുകൾ മൂലരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
