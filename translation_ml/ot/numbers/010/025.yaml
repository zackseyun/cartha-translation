  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട ഹീബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി. ‘സൈന്യഗണം’ എന്ന പദം צבאയുടെ സംഘടിത ഗോത്രവിഭാഗം എന്ന അർഥവും സൈനികനിറവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
