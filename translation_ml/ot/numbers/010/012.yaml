  text: ഇസ്രായേൽപുത്രന്മാർ[a] തങ്ങളുടെ യാത്രാഘട്ടങ്ങൾ അനുസരിച്ച് സീനായി മരുഭൂമിയിൽനിന്ന് പുറപ്പെട്ടു; മേഘം പാരാൻ മരുഭൂമിയിൽ നിലയുറപ്പിച്ചു.
