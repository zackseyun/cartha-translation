lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: נסע ഇവിടെ പാളയം പൊളിച്ച് അടുത്ത യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആഖ്യാനശൈലിയിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ കുടുംബപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ സമൂഹനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְמַסְעֵיהֶם
  choice: ഘട്ടംഘട്ടമായി
  rationale: מסע എന്ന പദത്തിന്റെ ബഹുവചനം തുടർച്ചയായ യാത്രാഘട്ടങ്ങളെയോ പാളയമാറ്റങ്ങളെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִמִּדְבַּר סִינָי
  choice: സീനായി മരുഭൂമിയിൽനിന്ന്
  rationale: מִדְבָּר ജനവാസവും കൃഷിയും കുറഞ്ഞ വന്യപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പഞ്ചഗ്രന്ഥസന്ദർഭത്തിൽ പതിവും ഗ്രാഹ്യവുമായ ‘മരുഭൂമി’ ഉപയോഗിച്ചു.
- source_word: וַיִּשְׁכֹּן
  choice: വന്നുനിന്നു
  rationale: שכן ഇവിടെ മേഘം ഒരു സ്ഥലത്ത് തങ്ങി നിൽക്കുന്നതാണ്; യാത്രയുടെ പശ്ചാത്തലത്തിൽ ‘വന്നുനിന്നു’ ചലനത്തിന്റെ അവസാനവും നിലയുറപ്പിക്കലും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മരുഭൂമിയാത്രയിൽ മുമ്പേ പരിചിതമായ ദൈവിക വഴികാട്ടൽമേഘത്തെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്; ലളിതമായ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: בְּמִדְבַּר פָּארָן
  choice: പാരാൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നതിന് ഒരേ സന്ദർഭത്തിൽ ‘മരുഭൂമി’ നിലനിർത്തുകയും സ്ഥലനാമമായ פָּארָן ‘പാരാൻ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്തു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ
  rationale: പ്രത്യേക സിദ്ധാന്തവിവാദമില്ലെങ്കിലും മൂലത്തിലെ ‘പുത്രന്മാർ’ എന്ന പുരുഷലിംഗ കുടുംബരൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; സാധാരണ മലയാളത്തിലെ സമൂഹനാമം അടിക്കുറിപ്പിൽ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ യാത്രാഘട്ടങ്ങളുടെ അർഥവും ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്ന കുടുംബപ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു.
