translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാളയക്കൊടിക്കീഴിലുള്ളവർ’ എന്ന രൂപം ഹീബ്രുവിലെ metonymy മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പകരമുള്ള കൂടുതൽ അക്ഷരാർഥപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
