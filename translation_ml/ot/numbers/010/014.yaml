  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: ml
  text: യഹൂദാപുത്രന്മാരുടെ പാളയക്കൊടി[a] അവരുടെ സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ച്[b] ആദ്യം പുറപ്പെട്ടു; അതിന്റെ സൈന്യവിഭാഗത്തിന്റെ തലവൻ അമ്മീനാദാബിന്റെ മകൻ നഹശോൻ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പതാക.’ ഹീബ്രു പദം ഗോത്രപാളയഘടകം അണിനിരന്നിരുന്ന കൊടിയെയോ ചിഹ്നത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ കൊടി ആ ഘടകത്തെ പ്രതിനിധീകരിച്ചും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘തങ്ങളുടെ സേനാവിഭാഗങ്ങൾപ്രകാരം’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ ഗണങ്ങൾക്കനുസരിച്ച്.’ ഹീബ്രുവിലെ പദം ക്രമീകരിക്കപ്പെട്ട ഗോത്രസൈനികഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ പ്രയോഗം.
- source_word: דֶּגֶל מַחֲנֵה בְנֵי יְהוּדָה
  choice: യഹൂദയുടെ പുത്രന്മാരുടെ പാളയക്കൊടിക്കീഴിലുള്ളവർ
  rationale: דֶּגֶל എന്നത് ഗോത്രപാളയഘടകം അണിനിരന്ന കൊടി/അടയാളം സൂചിപ്പിക്കുന്നു. ഹീബ്രു വാക്യത്തിൽ പുറപ്പെടുന്ന കൂട്ടം ഉദ്ദേശിക്കപ്പെടുന്നതിനാൽ, മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകാൻ ‘കൊടിക്കീഴിലുള്ളവർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְנֵי יְהוּדָה
  choice: യഹൂദയുടെ പുത്രന്മാർ
  rationale: ഗോത്ര-വംശാവലി പ്രയോഗമായ ഹീബ്രു രൂപത്തിന്റെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു.
- source_word: בָּרִאשֹׁנָה
  choice: ആദ്യം
  rationale: യാത്ര പുറപ്പെടുന്ന ക്രമം സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപ്രയോഗം.
- source_word: לְצִבְאֹתָם
  choice: തങ്ങളുടെ സൈനികഗണങ്ങൾപ്രകാരം
  rationale: צָבָא ഇവിടെ ക്രമീകരിക്കപ്പെട്ട സൈനികസ്വഭാവമുള്ള ഗോത്രവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സൈനികഗണങ്ങൾ’ സംഘടനാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: וְעַל צְבָאוֹ
  choice: ആ സൈനികഗണത്തിന്റെ അധിപൻ
  rationale: עַל നേതൃത്വമോ ചുമതലയോ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ഏകവചന ഘടകത്തെ ‘ആ സൈനികഗണം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: അമ്മീനാദാബിന്റെ മകൻ നഹശോൻ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ ബൈബിൾപരമായ ലിപ്യന്തരണശൈലിയിൽ നൽകി, പിതൃബന്ധം സ്വാഭാവികമായ മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
