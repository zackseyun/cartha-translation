  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ സംഗ്രഹസ്വഭാവവും സംഘടിത യാത്രയുടെ ആശയവും നിലനിർത്തി; അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
