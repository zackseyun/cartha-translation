source:
  edition: WLC
  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: ml
  text: ഇവയായിരുന്നു ഇസ്രായേൽമക്കളുടെ യാത്രാഘട്ടങ്ങൾ, അവരുടെ സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ച്[a][b]; അവർ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യാത്രകൾ’ എന്നോ ‘പുറപ്പാടുകൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ പടകൾക്കനുസരിച്ച്’ എന്നോ ‘അവരുടെ സംഘങ്ങൾപ്രകാരം’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രുപദം യാത്രയ്ക്കായി ക്രമീകരിച്ച സംഘങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയായിരുന്നു
  rationale: ഭൂതകാല യാത്രാവിവരണത്തെ സംഗ്രഹിക്കുന്ന ബഹുവചന ചൂണ്ടുപദം; ഹീബ്രുവിൽ വ്യക്തമായ സംയോജകക്രിയ ഇല്ലെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപം ഉപയോഗിച്ചു.
- source_word: מַסְעֵי
  choice: യാത്രാഘട്ടങ്ങൾ
  rationale: מסע എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം യാത്രയിലെ തുടർച്ചയായ ഘട്ടങ്ങളെയോ പുറപ്പാടുകളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘യാത്രാഘട്ടങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള കുടുംബബന്ധപ്രയോഗമായ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ആശയം സംക്ഷിപ്തവും പരിചിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְצִבְאֹתָם
  choice: സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ചുള്ള
  rationale: צבאות ക്രമീകരിക്കപ്പെട്ട സൈനികസ്വഭാവമുള്ള സംഘങ്ങളെയോ പാളയവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; യുദ്ധത്തിൽ ഏർപ്പെട്ടിരുന്നതായി അതിരുകടക്കാതെ സംഘടിതമായ യാത്രാക്രമം വ്യക്തമാക്കുന്നു.
- source_word: וַיִּסָּעוּ
  choice: അങ്ങനെ അവർ പുറപ്പെട്ടു
  rationale: נסע യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്ന കഥനരൂപമാണ്; ‘പുറപ്പെട്ടു’ ആ ചലനാരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. ‘അങ്ങനെ’ സംഗ്രഹവാക്യത്തിൽ നിന്നുള്ള തുടർപ്രവർത്തനബന്ധം വ്യക്തമാക്കുന്നു.
