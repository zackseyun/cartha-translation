  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിച്ചുവരുന്ന നേതൃത്വസൂത്രവാക്യം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകി; സൈനികസ്വഭാവമുള്ളതെങ്കിലും സ്ഥിരം സൈന്യമെന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കി.
