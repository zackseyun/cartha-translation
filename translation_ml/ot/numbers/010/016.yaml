source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: ml
  text: സെബൂലൂൻ പുത്രന്മാരുടെ ഗോത്രത്തിന്റെ സൈന്യസംഘത്തിന് നേതാവായി ഹേലോന്റെ മകൻ എലീയാബ് ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൈന്യസംഘം” എന്നതിന് “ഗോത്രസംഘം” അല്ലെങ്കിൽ “വിഭാഗം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം യാത്രാക്രമത്തിൽ ക്രമീകരിച്ച സംഘടിത ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: അധിപൻ ... ആയിരുന്നു
  rationale: മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്ന וְയും അധികാരമോ മേൽനോട്ടമോ സൂചിപ്പിക്കുന്ന עַלയും മലയാളത്തിലെ സ്വാഭാവികമായ നേതൃത്വസൂത്രവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: צְבָא
  choice: ഗോത്രസൈന്യം
  rationale: മരുഭൂമിയിലൂടെയുള്ള യാത്രാസന്ദർഭത്തിൽ ഇത് യുദ്ധക്രമത്തിൽ സഞ്ചരിച്ച സംഘടിത ഗോത്രസംഘത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥിരം സൈന്യമെന്ന അർഥം നിർബന്ധമാക്കാതെ സൈനികക്രമം വ്യക്തമാക്കുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഇവിടെ വടി എന്ന പദാർഥമല്ല, സാമൂഹിക-രാഷ്ട്രീയ ഗോത്രഘടകമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ഗോത്രപൂർവികനായ സെബൂലൂന്റെ വംശജരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
- source_word: אֱלִיאָב
  choice: എലീയാബ്
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן חֵלֹן
  choice: ഹേലോന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമഘടന നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
