revisions:
- from: സെബൂലൂന്റെ പുത്രന്മാരുടെ ഗോത്രസൈന്യത്തിന്റെ അധിപൻ ഹേലോന്റെ മകൻ എലീയാബ് ആയിരുന്നു.[a]
  to: സെബൂലൂൻ പുത്രന്മാരുടെ ഗോത്രത്തിന്റെ സൈന്യസംഘത്തിന് നേതാവായി ഹേലോന്റെ മകൻ എലീയാബ് ആയിരുന്നു.[a]
  rationale: The revision uses a natural Malayalam leadership construction while retaining the source’s reference to the organized contingent belonging to Zebulun’s tribe. It avoids making the contingent sound like a permanent army and preserves the personal and tribal names.
