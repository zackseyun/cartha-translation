id: NUM.10.10
reference: Numbers 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: ml
  text: നിങ്ങളുടെ സന്തോഷദിവസത്തിലും നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിലും നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിലും[a] നിങ്ങൾ നിങ്ങളുടെ ഹോമയാഗങ്ങളിന്മേലും സമാധാനയാഗങ്ങളിന്മേലും[b] കാഹളങ്ങൾ ഊതണം. അവ നിങ്ങളുടെ ദൈവത്തിന്റെ സന്നിധിയിൽ നിങ്ങൾക്കുവേണ്ടി ഒരു സ്മാരകമായിരിക്കും. ഞാൻ നിങ്ങളുടെ ദൈവമായ യാഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ നവചന്ദ്രദിനങ്ങളിൽ.’ എബ്രായത്തിൽ അക്ഷരാർഥം, ‘നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൂട്ടായ്മയാഗങ്ങളിന്മേലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: നിങ്ങളുടെ സന്തോഷം
  rationale: ഈ നാമം സന്തോഷത്തെയോ ആനന്ദത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സന്തോഷദിവസം’ പട്ടികയുടെ ഘടനയിലും ആധുനിക മലയാളത്തിലും സ്വാഭാവികമാണ്.
- source_word: מוֹעֲדֵיכֶם
  choice: നിങ്ങളുടെ നിശ്ചിത സമയങ്ങൾ
  rationale: ആരാധനയ്ക്കായി നിശ്ചയിക്കപ്പെട്ട ഉത്സവാവസരങ്ങൾ ഉൾപ്പെടുന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ഉത്സവങ്ങൾ’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങൾ
  rationale: ‘നിങ്ങളുടെ മാസങ്ങളുടെ തലകൾ/ആരംഭങ്ങൾ’ എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അമാവാസിദിനങ്ങളെ സൂചിപ്പിക്കാം.
- source_word: וּתְקַעְתֶּם
  choice: നിങ്ങൾ ... ഊതണം
  rationale: കാഹളങ്ങളോടൊപ്പം ഉപയോഗിക്കുമ്പോൾ ക്രിയയുടെ സ്വാഭാവിക മലയാളപ്രയോഗം ‘ഊതുക’ എന്നതാണ്.
- source_word: חֲצֹצְרֹת
  choice: കാഹളങ്ങൾ
  rationale: അധ്യായത്തിൽ മുമ്പ് പരിചയപ്പെടുത്തിയ ആരാധനാകാഹളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിൽ ‘വെള്ളി’ എന്നു പറയാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: עַל עֹלֹתֵיכֶם
  choice: നിങ്ങളുടെ ഹോമയാഗങ്ങളിന്മേൽ
  rationale: עַל എന്ന മുൻപ്രത്യയത്തിന്റെ അടിസ്ഥാനമായ സ്ഥല/അനുബന്ധ അർഥവും യാഗങ്ങളോടൊപ്പം കാഹളം ഊതുന്ന ആചാരചിത്രവും നിലനിർത്തുന്നു.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: നിങ്ങളുടെ സമാധാനയാഗബലികൾ
  rationale: ശാന്തി, ക്ഷേമം, പൂർണത എന്നിവയുമായി ബന്ധപ്പെട്ട പരമ്പരാഗത യാഗപദം നിലനിർത്തുകയും זִבְחֵי എന്ന ഘടകം ‘യാഗബലികൾ’ വഴി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: അവ നിങ്ങൾക്കുവേണ്ടി ഒരു സ്മാരകമായിരിക്കും
  rationale: ബഹുവചനക്രിയയെ ‘അവ’ എന്നു നിലനിർത്തി, ദൈവസന്നിധിയിൽ ഓർമപ്പെടുത്തുന്ന ആരാധനാപരമായ അർഥം ‘സ്മാരകം’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: നിങ്ങളുടെ ദൈവത്തിന്റെ സന്നിധിയിൽ
  rationale: ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന അർഥം യാഗസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വേ
  rationale: എബ്രായത്തിലെ ദൈവനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: വാക്യത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: שְׁלָמִים എന്ന യാഗപദത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗം
  alternative: കൂട്ടായ്മയാഗം
  rationale: എബ്രായപദത്തിലെ സമാധാനം, ക്ഷേമം, പൂർണത എന്നീ അർഥബന്ധങ്ങൾ നിലനിർത്തുന്നു; കൂട്ടായ്മയുടെ സാമൂഹികവശം മാത്രം നിർണായകമാക്കുന്നില്ല.
- issue: וְהָיוּ എന്ന ബഹുവചനത്തിന്റെ സൂചന
  choice: അവ
  alternative: കാഹളനാദങ്ങൾ
  rationale: മൂലപാഠം ബഹുവചന സൂചനയുടെ കൃത്യമായ ആശ്രയം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ‘കാഹളനാദങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കാതെ ബഹുവചന സർവനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആരാധനാഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ പട്ടികഘടനയും യാഗപരമായ പദാവലിയും നിലനിർത്തി; ഇംഗ്ലീഷ് consultation layer-ലുള്ള സ്ഥാനം തെറ്റിയ അടിക്കുറിപ്പുകൾ അവ സൂചിപ്പിക്കുന്ന യഥാർഥ പദങ്ങളോടു ചേർത്തു.
