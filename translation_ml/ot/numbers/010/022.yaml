id: NUM.10.22
reference: Numbers 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: ml
  text: പിന്നെ എഫ്രയീമിന്റെ പുത്രന്മാരുടെ പാളയക്കൊടി തങ്ങളുടെ സേനാവിഭാഗങ്ങളനുസരിച്ച്[a] പുറപ്പെട്ടു; അവരുടെ സേനാവിഭാഗത്തിന്റെ തലവൻ അമ്മീഹൂദിന്റെ മകൻ എലീശാമ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ സൈന്യങ്ങൾക്കനുസരിച്ച്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം പാളയത്തിനുള്ളിലെ സൈനികശൈലിയിൽ ക്രമീകരിച്ച സംഘങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: പിന്നെ ... പുറപ്പെട്ടു
  rationale: വാവ് ചേർന്ന ക്രിയ ആഖ്യാനത്തിലെ തുടർച്ചയായ അടുത്ത നീക്കത്തെ സൂചിപ്പിക്കുന്നു; യാത്രാസന്ദർഭത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികമാണ്.
- source_word: דֶּגֶל מַחֲנֵה
  choice: പാളയത്തിന്റെ കൊടിക്കീഴിലുള്ളവർ
  rationale: דֶּגֶל ഗോത്രപാളയം അണിനിരന്നിരുന്ന അടയാളക്കൊടിയെ സൂചിപ്പിക്കുന്നു. ഹീബ്രു ഘടനയുടെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  rationale: ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: לְצִבְאֹתָם
  choice: തങ്ങളുടെ സേനാവിഭാഗങ്ങളായി
  rationale: ക്രമീകരിച്ച സൈനികശൈലിയിലുള്ള ഗോത്രസംഘങ്ങളെയാണ് צָבָא ഇവിടെ സൂചിപ്പിക്കുന്നത്; നിർബന്ധമായും യുദ്ധസേനകളെ മാത്രമല്ല.
- source_word: וְעַל צְבָאוֹ
  choice: അവരുടെ സേനാവിഭാഗത്തിന്റെ നായകൻ ... ആയിരുന്നു
  rationale: עַל സൂചിപ്പിക്കുന്ന നേതൃത്വബന്ധം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ഏകവചനമായ צְבָאוֹ എഫ്രയീമിന്റെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: അമ്മീഹൂദിന്റെ മകൻ എലീശാമ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകുകയും בֶּן എന്ന ബന്ധം ‘മകൻ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൊടിക്കീഴിലുള്ളവർ’ എന്ന പ്രയോഗം ദേഗെൽ എന്ന ഗോത്രചിഹ്നവും അതിനുകീഴിൽ നീങ്ങിയ പാളയസംഘവും തമ്മിലുള്ള ബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
