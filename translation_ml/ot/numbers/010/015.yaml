  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: ml
  text: യിസ്സാഖാർ പുത്രന്മാരുടെ ഗോത്രത്തിന്റെ സേനാവിഭാഗത്തിനു മേൽ സൂവാറിന്റെ മകനായ നെഥനയേൽ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേനാവിഭാഗം” എന്നതിന് “സംഘം,” “സേന,” അല്ലെങ്കിൽ “പട” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം (צְבָא) യാത്രാക്രമത്തിൽ ക്രമീകരിക്കപ്പെട്ട ഒരു ഗോത്രസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: മേൽ
  rationale: മുൻവാക്യത്തിലെ പട്ടികയോടുള്ള ബന്ധം മലയാള വാക്യക്രമത്തിലും സന്ദർഭത്തിലും സ്വാഭാവികമായി വ്യക്തമാണ്; עַל ഇവിടെ നേതൃത്വച്ചുമതലയെ സൂചിപ്പിക്കുന്നു.
- source_word: צְבָא
  choice: സേനാവിഭാഗം
  rationale: യാത്രാക്രമത്തിൽ ക്രമീകരിക്കപ്പെട്ട ഗോത്രസംഘത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സേനാവിഭാഗം’ സംഘടിതവും സൈനികസ്വഭാവമുള്ളതുമായ കൂട്ടത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; എന്നാൽ ഉടൻ യുദ്ധം നടക്കുന്നു എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഈ സന്ദർഭത്തിൽ പദം വടിയെയല്ല, ഗോത്രഘടകത്തെയാണ് വ്യക്തമായി സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי יִשָׂשכָר
  choice: യിസ്സാഖാർഗോത്രം
  rationale: അക്ഷരാർഥം ‘യിസ്സാഖാറിന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും, ഈ പട്ടികാസൂത്രത്തിൽ ഉദ്ദേശിക്കുന്നത് യിസ്സാഖാറിന്റെ സന്തതികളായ ഗോത്രമാണ്; ആധുനിക മലയാളത്തിൽ ‘യിസ്സാഖാർഗോത്രം’ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: נְתַנְאֵל
  choice: നെഥനയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן צוּעָר
  choice: സൂവാറിന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥവ്യാകരണത്തിൽ സംരക്ഷിക്കുന്നു.
