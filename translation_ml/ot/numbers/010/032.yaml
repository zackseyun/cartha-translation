source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: ml
  text: നീ ഞങ്ങളോടുകൂടെ വന്നാൽ, യാഹ്‌വേ ഞങ്ങൾക്കു ചെയ്യുന്ന നന്മ എന്തായാലും ഞങ്ങൾ നിനക്കു നന്മ ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യാഹ്‌വേ ഞങ്ങൾക്കു ചെയ്യുന്ന ആ നന്മ ഞങ്ങൾ നിനക്കു ചെയ്യും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: വന്നാൽ
  rationale: ഈ പ്രയോഗം നിബന്ധന അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി നിബന്ധന വ്യക്തമാക്കാൻ ക്രിയയോടു ചേർന്ന ‘-ആൽ’ രൂപം ഉപയോഗിച്ചു; ഉറപ്പിനെ സൂചിപ്പിക്കുന്ന ‘വരുമ്പോൾ’ ഒഴിവാക്കി.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: നീ ഞങ്ങളോടുകൂടെ വന്നാൽ
  rationale: הלך ഇവിടെ ഇസ്രായേലിന്റെ യാത്രയിൽ കൂടെ ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. അഭിസംബോധന ചെയ്യുന്നയാളെ തങ്ങളോടൊപ്പം വരാൻ ക്ഷണിക്കുന്ന സന്ദർഭത്തിൽ ‘ഞങ്ങളോടുകൂടെ വന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: הַטּוֹב הַהוּא
  choice: നന്മ എന്തായാലും
  rationale: ബന്ധവാക്യം വിശദീകരിക്കുന്ന നിശ്ചിതമായ ‘ആ നന്മ’ എന്ന എബ്രായ ഘടനയെ, ലഭിക്കാവുന്ന നന്മയുടെ തുറന്ന വ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമായി അവതരിപ്പിച്ചു.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: യഹോവ ഞങ്ങൾക്കു ചെയ്യുന്ന
  rationale: יטב എന്ന ക്രിയയുടെ ‘നന്മ ചെയ്യുക/നന്നായി പെരുമാറുക’ എന്ന അർഥം അടുത്ത വാക്യഭാഗത്തോടുള്ള ശബ്ദബന്ധം നിലനിർത്തി. יְהוָה വ്യക്തിനാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: ഞങ്ങൾ നിനക്കും നന്മ ചെയ്യും
  rationale: മുൻപത്തെ יטב ക്രിയയുമായുള്ള ആവർത്തനം ‘നന്മ ചെയ്യും’ എന്നു നിലനിർത്തുന്നു. ‘അതേ നന്മ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത സമത്വവിവരണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരി നേരിട്ട് വരുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നതിന് പകരം മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: ദൈവം ഇസ്രായേലിനോടു ചെയ്യുന്ന നന്മയും അവർ കൂട്ടാളിക്കു ചെയ്യുന്ന നന്മയും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടിടത്തും ‘നന്മ ചെയ്യുക’ എന്ന ക്രിയാസാമ്യം നിലനിർത്തി
  alternative: ‘അതേ നന്മ ഞങ്ങൾ നിനക്കു ചെയ്യും’
  rationale: എബ്രായത്തിൽ ഒരേ ധാതു ആവർത്തിക്കുന്നുണ്ടെങ്കിലും ‘അതേ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ പരസ്പരബന്ധം നിലനിർത്തിക്കൊണ്ട് അതിരുകടന്ന സമത്വവ്യാഖ്യാനം ഒഴിവാക്കി.
