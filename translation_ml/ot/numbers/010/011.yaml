  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: ml
  text: രണ്ടാം വർഷത്തിൽ, രണ്ടാം മാസത്തിൽ, ആ മാസത്തിന്റെ ഇരുപതാം ദിവസം, സാക്ഷ്യത്തിന്റെ തിരുനിവാസത്തിന്റെ[b] മുകളിൽനിന്ന് മേഘം ഉയർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേലോട്ടുപോയി’ അല്ലെങ്കിൽ ‘പൊങ്ങി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സാക്ഷ്യകൂടാരം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: '[പ്രത്യേക പദമായി പ്രകടിപ്പിക്കാതെ തുടർന്നുള്ള കാലസൂചനയിലൂടെ ആഖ്യാനക്രമം അറിയിച്ചു]'
  rationale: ഇത് മുൻസംഭവത്തെ തുടർന്നുള്ള സംഭവം അവതരിപ്പിക്കുന്ന എബ്രായ ആഖ്യാനരൂപമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി കൃത്രിമമാകുന്നതിനാൽ, വാക്യക്രമവും കാലസൂചനയുംകൊണ്ട് അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: രണ്ടാം വർഷം
  rationale: വർഷഗണന നേരിട്ട് സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമായ രൂപം.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: രണ്ടാം മാസം
  rationale: വർഷത്തിനുള്ളിലെ മാസത്തെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ ഇരുപതാം ദിവസം
  rationale: എബ്രായത്തിലെ ‘മാസത്തിൽ ഇരുപതിന്’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തമായ മലയാളത്തിൽ നൽകി; ‘ദിവസം’ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കി.
- source_word: נַעֲלָה
  choice: ഉയർന്നു
  rationale: עלה എന്ന ക്രിയ ഇവിടെ മേഘം തിരുനിവാസത്തിന്റെ മുകളിൽനിന്ന് മേലോട്ടു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉയർന്നു’ സ്വാഭാവികവും മൂലത്തിന്റെ ദിശാസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മരുഭൂമിയാത്രയിൽ ദൈവിക മാർഗനിർദേശവുമായി ബന്ധപ്പെട്ട് മുമ്പേ അറിയപ്പെടുന്ന മേഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: מֵעַל
  choice: മുകളിൽനിന്ന്
  rationale: തിരുനിവാസത്തിന്റെ മുകളിലുള്ള സ്ഥാനത്തുനിന്നുള്ള നീക്കം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: സാക്ഷ്യനിവാസം
  rationale: מִשְׁכָּן എന്ന ‘നിവാസം/തിരുനിവാസം’ എന്ന ആശയവും עֵדוּת എന്ന ‘സാക്ഷ്യം’ എന്ന പ്രധാന പദവും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള സംയുക്തപദത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മִשְׁכַּן הָעֵדֻת എന്ന വിശുദ്ധസ്ഥലനാമം
  choice: സാക്ഷ്യനിവാസം
  alternative: സാക്ഷ്യത്തിന്റെ തിരുനിവാസം; സാക്ഷ്യകൂടാരം
  rationale: ‘സാക്ഷ്യം’ എന്ന നിയമസാക്ഷിയുടെ ആശയം ‘ഉടമ്പടി’ എന്നു വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ നിലനിർത്തി. מִשְׁכָּן എന്നത് പ്രത്യേകിച്ച് ദൈവിക നിവാസഘടനയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിവാസം’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; മറ്റുസാധ്യരൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായ കാലപ്രയോഗങ്ങളുടെ ആവർത്തനം നിലനിർത്തിയെങ്കിലും, വാക്യം കൃത്രിമമാകാതിരിക്കാൻ וַיְהִי പ്രത്യേക മലയാള ക്രിയാപദമായി ചേർത്തില്ല. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
