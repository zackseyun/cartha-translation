source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] മോശെയോടു ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; ‘യഹോവ’ എന്നും പരമ്പരാഗതമായി നൽകാറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു വ്യഞ്ജനരൂപവും മറ്റൊരു പ്രചാരത്തിലുള്ള മലയാളരൂപവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דּבר ഇവിടെ പുതിയ ആഖ്യാനസംഭവവും ദൈവിക സംസാരവും അവതരിപ്പിക്കുന്നു. ‘സംസാരിച്ചു’ എന്നത് ‘പറഞ്ഞു’ എന്നതിൽനിന്ന് ലֵאמֹר എന്ന തുടർപ്രയോഗത്തെ വേർതിരിച്ചും മൂലത്തിലെ ആവർത്തനസ്വഭാവം നിലനിർത്തിയും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തെ മലയാളലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്ന വിഭക്തിയിലൂടെ നൽകുന്നു; מֹשֶׁה എന്ന പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപമായ ‘മോശ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം വ്യക്തമായി നിലനിർത്തുന്നു. ‘സംസാരിച്ചു; ഇങ്ങനെ പറഞ്ഞു’ എന്ന രൂപം മൂലത്തിലെ דּבר/אמר വ്യത്യാസവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: വാക്യത്തിൽ ഒരു പദവിയല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ പേര് ലിപ്യന്തരം ചെയ്തു. ‘യഹോവ’ പരമ്പരാഗത രൂപമാണെങ്കിലും, ‘യഹ്‌വെ’ ഹീബ്രു നാമത്തിന്റെ പൊതുവായി അംഗീകരിക്കപ്പെട്ട പുനർനിർമിത ഉച്ചാരണത്തോട് കൂടുതൽ അടുത്തതാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ദൈവിക സംസാരത്തിന് പ്രത്യേക സഭാപാരമ്പര്യവുമായി ബന്ധമുള്ള ‘അരുളിച്ചെയ്തു’ ഒഴിവാക്കി; മൂലത്തിലെ രണ്ട് സംസാരക്രിയകളുടെ വ്യത്യാസം സ്വാഭാവികമായി കഴിയുന്നത്ര നിലനിർത്തി.
