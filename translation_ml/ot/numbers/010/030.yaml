  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവനോടു പറഞ്ഞു: “ഞാൻ പോകില്ല; മറിച്ച്, എന്റെ സ്വന്തം ദേശത്തേക്കും എന്റെ ജന്മനാട്ടിലേക്കും ഞാൻ പോകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלַדְתִּי
  choice: എന്റെ ജന്മനാട്
  rationale: മൂലപദം ജനനം, വംശബന്ധം, സ്വദേശം എന്നിവ സൂചിപ്പിക്കാം; ഈ യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ജന്മനാട്’ ആ അർഥപരിധി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: כִּי אִם
  choice: ; ... ഞാൻ പോകും
  rationale: മുൻനിഷേധത്തിനു പിന്നാലെയുള്ള വിരുദ്ധനിശ്ചയം മലയാളത്തിലെ വാക്യഘടനയിലൂടെ വ്യക്തമാക്കി; പ്രത്യേകമായി ‘മറിച്ച്’ ചേർക്കാതെ മൂലത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
