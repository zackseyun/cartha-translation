  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തിച്ച ‘പോകുക’ എന്ന ക്രിയയും വ്യക്തിയുടെ ഉറച്ച നിരസനവും നിലനിർത്തി.
