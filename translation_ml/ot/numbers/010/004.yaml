  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കാഹളങ്ങളുടെ എണ്ണം സംബന്ധിച്ച സന്ദർഭസൂചന വ്യക്തമാക്കുമ്പോഴും മൂലത്തിലെ സംക്ഷിപ്തതയും ‘ആയിരക്കൂട്ടങ്ങൾ’ എന്ന ഭരണപരമോ സൈനികമോ ആയ പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തിയിരിക്കുന്നു.
