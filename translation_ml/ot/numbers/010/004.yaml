  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: ml
  text: എന്നാൽ അവർ ഒരു കാഹളം മാത്രം ഊതിയാൽ, നേതാക്കന്മാർ—ഇസ്രായേലിന്റെ ആയിരം-ഘടകങ്ങളുടെ തലവന്മാർ[a]—നിന്റെ അടുക്കൽ വന്നുകൂടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേലിന്റെ ആയിരം-ഘടകങ്ങളുടെ തലവന്മാർ’ എന്ന എബ്രായപ്രയോഗം, ഇസ്രായേലിലെ ആയിരം-ഘടകങ്ങളുടെ മേൽനോട്ടക്കാരായ നേതാക്കളെ സൂചിപ്പിക്കുന്നതായിരിക്കാം. ചില പരിഭാഷകൾ ഇതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘ഇസ്രായേൽ കുലങ്ങളുടെ തലവന്മാർ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: എന്നാൽ ... ഊതിയാൽ
  rationale: മുൻവാക്യത്തിലെ രണ്ടു കാഹളങ്ങൾ ഊതുന്നതിൽനിന്നുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന സോപാധിക പ്രയോഗം; ‘എന്നാൽ’ സന്ദർഭത്തിലെ വൈരുധ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּ/אַחַת
  choice: ഒരെണ്ണം മാത്രം
  rationale: മുൻവാക്യത്തിലെ രണ്ടു കാഹളങ്ങൾക്ക് വിപരീതമായി ഒരു കാഹളം മാത്രം എന്ന അർഥം; ‘കാഹളം’ ഇവിടെ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതിനാൽ എബ്രായത്തിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: יִתְקָעוּ
  choice: അവർ ... ഊതിയാൽ
  rationale: കാഹളസൂചനയുടെ പശ്ചാത്തലത്തിൽ תקע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: וְ/נוֹעֲדוּ
  choice: വന്നുകൂടും
  rationale: നിശ്ചിതമായ വിളിയനുസരിച്ച് ഒരിടത്ത് സമ്മേളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഭാവിഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵלֶי/ךָ
  choice: നിന്റെ അടുക്കൽ
  rationale: മോശെയുടെ അടുത്തേക്കുള്ള ചലനവും കൂടിച്ചേരലും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַ/נְּשִׂיאִים
  choice: നേതാക്കന്മാർ
  rationale: ഗോത്രങ്ങളുടെയോ ജനവിഭാഗങ്ങളുടെയോ ചുമതലയുള്ള പ്രധാനികളെ സൂചിപ്പിക്കുന്നു; രാജകീയ പദവിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങളുടെ തലവന്മാർ
  rationale: എബ്രായത്തിലെ ഭരണപരമോ സൈനികമോ ആയ ‘ആയിരം’ ഘടകങ്ങളുടെ ഭാഷ സുതാര്യമായി നിലനിർത്തുന്നു; അതിനെ ‘കുലങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
