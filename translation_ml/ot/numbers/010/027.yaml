  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: ml
  text: നഫ്താലിയുടെ പുത്രന്മാരുടെ ഗോത്രസൈന്യത്തിന്റെ തലവൻ ഏനാന്റെ മകൻ അഹീരാ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗോത്രസൈന്യം” എന്നതിന് “സൈന്യം,” “സൈനികസംഘം,” അല്ലെങ്കിൽ “വിഭാഗം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ צְבָא പാളയക്രമത്തിലും യാത്രാക്രമത്തിലും ക്രമീകരിക്കപ്പെട്ട ഒരു ഗോത്രസംഘത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: അധിപനായി
  rationale: മുമ്പുള്ള പട്ടികയോടു വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന וְ എന്ന ഘടകവും ഒരു സംഘത്തിന്റെ മേൽ നിയമിക്കപ്പെട്ട നേതാവിനെ സൂചിപ്പിക്കുന്ന עַל എന്ന ഘടകവും മലയാളത്തിലെ സ്വാഭാവികമായ നേതൃത്വപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: צְבָא
  choice: ഗോത്രസൈന്യം
  rationale: ഇവിടെ പദം പാളയക്രമത്തിലും യാത്രാക്രമത്തിലും ക്രമീകരിക്കപ്പെട്ട ഗോത്രത്തിന്റെ സൈനികസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥിരം ദേശീയസൈന്യം എന്ന ആശയം അതിരുകടന്ന് നൽകാതെ സന്ദർഭം വ്യക്തമാക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഈ സന്ദർഭത്തിൽ പദത്തിന്റെ അർഥം വടി എന്നല്ല, ഇസ്രായേലിലെ ഗോത്രവിഭാഗം എന്നാണ്.
- source_word: בְּנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് നഫ്താലിയുടെ ഗോത്രവംശജരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֲחִירַע
  choice: അഹീര
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן עֵינָן
  choice: ഏനാന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
