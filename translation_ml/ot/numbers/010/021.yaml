source:
  edition: WLC
  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: ml
  text: പിന്നെ വിശുദ്ധവസ്തുക്കൾ ചുമന്നുകൊണ്ട് കെഹാത്യർ പുറപ്പെട്ടു.[a] അവർ എത്തുന്നതിനുമുമ്പ് തിരുനിവാസം സ്ഥാപിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘വിശുദ്ധസ്ഥലം ചുമക്കുന്നവർ’ അല്ലെങ്കിൽ ‘വിശുദ്ധസ്ഥലത്തിന്റെ ചുമട്ടുകാർ.’ ഇവിടെ ഈ പ്രയോഗം കെഹാത്യർ ചുമന്ന വിശുദ്ധ ഉപകരണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്ന് പറയുന്ന തിരുനിവാസത്തിന്റെ ഘടനയിൽനിന്ന് ഇവ വ്യത്യസ്തമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: പിന്നെ ... പുറപ്പെട്ടു
  rationale: വാവ് യാത്രാവിവരണത്തിലെ തുടർച്ചയും ക്രമവും സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ പാളയം നീങ്ങുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הַקְּהָתִים
  choice: കെഹാത്യർ
  rationale: കെഹാത്തിന്റെ വംശജരായ കുലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: വിശുദ്ധവസ്തുക്കൾ ചുമന്നുകൊണ്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധസ്ഥലത്തിന്റെ ചുമട്ടുകാർ’ എന്നായാലും, സന്ദർഭത്തിൽ കെഹാത്യർ വഹിച്ച വിശുദ്ധ ഉപകരണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; തിരുനിവാസത്തിന്റെ ഘടന അടുത്ത വാക്യഭാഗത്തിൽ വേർതിരിക്കപ്പെടുന്നു.
- source_word: הַמִּקְדָּשׁ
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: ഇവിടെ ‘വിശുദ്ധസ്ഥലം’ എന്ന പദം അതുമായി ബന്ധപ്പെട്ട വിശുദ്ധ ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗമായി മനസ്സിലാക്കുന്നു.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: തിരുനിവാസം സ്ഥാപിക്കപ്പെട്ടു
  rationale: എബ്രായ ക്രിയ ബഹുവചന കർത്താവിനെ സൂചിപ്പിച്ചാലും കർത്താവ് പ്രത്യക്ഷമായി പറഞ്ഞിട്ടില്ല. കെഹാത്യരാണ് സ്ഥാപിച്ചതെന്ന തെറ്റായ ധാരണ ഒഴിവാക്കിക്കൊണ്ട് സന്ദർഭാർത്ഥം നിലനിർത്താൻ കർമണിപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ ദൈവനിവാസത്തെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന പദത്തിന് മാന്യവും അർത്ഥസുതാര്യവുമായ മലയാളപരിഭാഷ.
- source_word: עַד בֹּאָם
  choice: അവർ എത്തുന്നതിനുമുമ്പ്
  rationale: കെഹാത്യർ വിശുദ്ധവസ്തുക്കളുമായി എത്തുമ്പോഴേക്കും തിരുനിവാസം സ്ഥാപിക്കപ്പെട്ടിരുന്നു എന്ന സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
