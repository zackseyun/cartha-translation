id: NUM.10.18
reference: Numbers 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: ml
  text: പിന്നെ രൂബേന്റെ പാളയത്തിന്റെ കൊടി[a] അവരുടെ സേനാവിഭാഗങ്ങളുടെ ക്രമത്തിൽ[b] യാത്ര പുറപ്പെട്ടു; അതിന്റെ സേനാവിഭാഗത്തിന്റെ തലവൻ ശെദേയൂരിന്റെ മകൻ എലീസൂർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പതാക’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ സംഘങ്ങൾപ്രകാരം’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായപദത്തിന് സംഘടിതവും സൈനികശൈലിയുള്ളതുമായ അർഥം ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: പിന്നെ ... യാത്ര പുറപ്പെട്ടു
  rationale: വാവ് ഘടന ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്നു; נסע പാളയം നീക്കി യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: דֶּגֶל
  choice: കൊടി
  rationale: ഗോത്രപാളയം അണിനിരന്നിരുന്ന ദൃശ്യമായ അടയാളക്കൊടിയാണ് ഉദ്ദേശ്യം; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളപദം.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: രൂബേന്റെ പാളയം
  rationale: ഹീബ്രായ നിർമാണബന്ധത്തെ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സേനാവിഭാഗങ്ങൾപ്രകാരം
  rationale: צבא എന്ന പദത്തിന്റെ സംഘടിതവും സൈനികശൈലിയുള്ളതുമായ അർഥം നിലനിർത്തുകയും ബഹുവചനത്തെയും ക്രമപ്പെടുത്തിയ യാത്രയെയും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וְעַל צְבָאוֹ
  choice: അതിന്റെ സേനാവിഭാഗത്തിന്റെ നായകൻ ... ആയിരുന്നു
  rationale: על അധികാരമോ മേൽനോട്ടമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി നാമവാക്യമായി അവതരിപ്പിക്കുമ്പോഴും ഏകവചന צבאയും പാളയഘടകത്തിന്മേലുള്ള നേതൃത്വവും നിലനിർത്തുന്നു.
- source_word: אֱלִיצוּר
  choice: എലീസൂർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ ബൈബിൾ നാമരൂപത്തിന് അനുയോജ്യമായി ലിപ്യന്തരിച്ചു.
- source_word: בֶּן שְׁדֵיאוּר
  choice: ശെദേയൂരിന്റെ മകൻ
  rationale: പിതൃനാമബന്ധം നേരിട്ട് വിവർത്തനം ചെയ്ത് പിതാവിന്റെ പേര് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. യാത്രാക്രമത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നതിനായി ‘സേനാവിഭാഗങ്ങൾ’ ഉപയോഗിച്ചു; സന്ദർഭം യുദ്ധത്തെക്കാൾ ക്രമപ്പെടുത്തിയ പാളയയാത്രയാണെന്നത് അടിക്കുറിപ്പിലെ ബദൽ വ്യക്തമാക്കുന്നു.
