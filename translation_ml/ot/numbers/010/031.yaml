language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ദയവായി ഞങ്ങളെ വിട്ടുപോകരുതേ; കാരണം, മരുഭൂമിയിൽ ഞങ്ങൾ എവിടെ പാളയമിറങ്ങണമെന്ന് നിനക്കറിയാം; നീ ഞങ്ങൾക്കു കണ്ണുകളായിരിക്കും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങൾക്കു കണ്ണുകളായിരിക്കും’ എന്നത്, മരുഭൂമിയെക്കുറിച്ചുള്ള നിന്റെ അറിവിനാൽ നീ ഞങ്ങൾക്ക് വഴികാട്ടിയായിരിക്കും എന്നർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol പ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹം നൽകുന്നു.
- source_word: אַל נָא
  choice: ദയവായി ... പോകരുതേ
  rationale: אַל എന്ന നിരോധനവും נָא നൽകുന്ന അഭ്യർഥനാഭാവവും മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: ഞങ്ങളെ വിട്ടുപോകരുതേ
  rationale: യാത്രാസന്ദർഭത്തിൽ עזב എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘ഉപേക്ഷിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ ധ്വനി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: כִּי עַל כֵּן
  choice: '[അടുത്ത വാക്യമായി നൽകിയ കാരണം]'
  rationale: ഈ സംയുക്തപ്രയോഗം അഭ്യർഥനയുടെ കാരണം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പ്രത്യേക കാരണബന്ധകമില്ലാതെയും തുടർന്നുള്ള വാക്യം സ്വാഭാവികമായി ആ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יָדַעְתָּ
  choice: നിനക്കറിയാം
  rationale: പൂർണ്ണക്രിയയുടെ ഇപ്പോഴും പ്രസക്തമായ അറിവ് മലയാള വർത്തമാനകാലത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ ഞങ്ങൾ പാളയമിറങ്ങേണ്ട സ്ഥലങ്ങൾ
  rationale: חנה-യിൽ നിന്നുള്ള രൂപം ഇസ്രായേലിന്റെ പാളയമിറക്കം/പാളയസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു. ബഹുവചനസദൃശമായ ‘സ്ഥലങ്ങൾ’ യാത്രാമാർഗത്തിലെ വിവിധ പാളയങ്ങളെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മൂലത്തിലെ സാധ്യതയെ അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינַיִם
  choice: നീ ഞങ്ങൾക്കു കണ്ണുകളായിരിക്കും
  rationale: ‘ഞങ്ങൾക്കായി കണ്ണുകളായിരിക്കുക’ എന്ന ഹീബ്രായ രൂപകം സംരക്ഷിക്കുന്നു; വഴികാട്ടൽ എന്ന ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. അഭ്യർഥനയുടെ വിനയം ‘ദയവായി ... പോകരുതേ’ എന്നതിലൂടെ നിലനിർത്തി. ഹീബ്രായത്തിലെ ‘കണ്ണുകൾ’ എന്ന സജീവരൂപകം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
