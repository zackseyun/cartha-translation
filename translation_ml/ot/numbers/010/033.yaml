id: NUM.10.33
reference: Numbers 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: ml
  text: അങ്ങനെ അവർ യഹ്‌വെയുടെ പർവതത്തിൽനിന്ന് മൂന്നു ദിവസത്തെ യാത്രയ്ക്കായി[a] പുറപ്പെട്ടു. യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം അവർക്കുവേണ്ടി ഒരു വിശ്രമസ്ഥലം തേടിക്കണ്ടെത്താൻ[b] അവരുടെ മുമ്പിൽ മൂന്നു ദിവസത്തെ യാത്ര ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, രണ്ടു പ്രാവശ്യവും ‘മൂന്നു ദിവസത്തെ വഴി’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പരിശോധിച്ച് കണ്ടെത്താൻ’ അല്ലെങ്കിൽ ‘അന്വേഷിച്ചുകണ്ടെത്താൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയ പാളയം പൊളിച്ച് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ ആ യാത്രാചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵהַר יְהוָה
  choice: യഹ്‌വെയുടെ പർവതത്തിൽനിന്ന്
  rationale: הַר എന്നത് ‘പർവതം’ എന്നും מן എന്നത് പുറപ്പെടുന്ന സ്ഥലം എന്നും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ യാത്രയ്ക്കായി / മൂന്നു ദിവസത്തെ യാത്രയിലുടനീളം
  rationale: കാലയളവ് ചേർന്ന דֶּרֶךְ യാത്രയുടെ ദൈർഘ്യമോ വ്യാപ്തിയോ സൂചിപ്പിക്കുന്നു. രണ്ടു സന്ദർഭങ്ങളുടെയും വാക്യഘടനയ്ക്കനുസരിച്ച് സ്വാഭാവികമായ വ്യത്യസ്ത രൂപങ്ങൾ ഉപയോഗിച്ചെങ്കിലും ഒരേ അടിസ്ഥാനാർഥം നിലനിർത്തി.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം
  rationale: എബ്രായത്തിലെ നാമശൃംഖലയിലെ ബന്ധങ്ങൾ വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
- source_word: נֹסֵעַ
  choice: സഞ്ചരിച്ചു
  rationale: പ്രധാന യാത്രയോടൊപ്പമുള്ള തുടർച്ചയായ ചലനമാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനത്തിൽ ‘സഞ്ചരിച്ചു’ അത് സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לִפְנֵיהֶם
  choice: അവരുടെ മുമ്പിൽ
  rationale: മൂലത്തിലെ സ്ഥലസംബന്ധമായ അർഥം ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָתוּר
  choice: തേടാൻ
  rationale: תור അന്വേഷിച്ച് കണ്ടെത്തുക, പരിശോധിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; ഇവിടെ സൈനികമായ ‘ചാരപ്പണി ചെയ്യുക’ എന്നതിനെക്കാൾ വിശ്രമസ്ഥലം ‘തേടുക’ സന്ദർഭോചിതമാണ്.
- source_word: מְנוּחָה
  choice: ഒരു വിശ്രമസ്ഥലം
  rationale: യാത്രാസന്ദർഭത്തിൽ അമൂർത്തമായ വിശ്രമത്തേക്കാൾ തങ്ങാനോ പാളയമിറങ്ങാനോ ഉള്ള സ്ഥലം ഉദ്ദേശിക്കുന്നതായി ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരിലേക്കു മാറ്റാതെ ‘Yahweh’ എന്ന രൂപത്തിന് അനുയോജ്യമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: പെട്ടകം കൂട്ടത്തിൽനിന്ന് എത്രത്തോളം മുന്നിലായിരുന്നു എന്ന വ്യാഖ്യാനം
  choice: മൂന്നു ദിവസത്തെ യാത്രയിലുടനീളം അവരുടെ മുമ്പിൽ സഞ്ചരിച്ചു
  alternative: അവരെക്കാൾ മൂന്നു ദിവസത്തെ യാത്രാദൂരം മുന്നിൽ സഞ്ചരിച്ചു
  rationale: דֶּרֶךְ שְׁלֹשֶׁת יָמִים എന്ന പ്രയോഗം പെട്ടകം കൂട്ടത്തിൽനിന്ന് മൂന്നു ദിവസത്തെ ദൂരം മുന്നിലായിരുന്നുവെന്ന് നിർബന്ധമായി പറയുന്നില്ല. ദൂരം സംബന്ധിച്ച അധിക നിഗമനം ഒഴിവാക്കി യാത്രയുടെ വ്യാപ്തിയെന്ന വായനയാണ് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഉടമ്പടി’, ‘പെട്ടകം’, ‘വിശ്രമസ്ഥലം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക ശൈലി ഒഴിവാക്കി.
