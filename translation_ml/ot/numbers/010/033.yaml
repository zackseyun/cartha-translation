revisions:
- from: അങ്ങനെ അവർ യഹ്‌വെയുടെ പർവതത്തിൽനിന്ന് മൂന്നു ദിവസത്തെ യാത്രയ്ക്കായി[a] പുറപ്പെട്ടു. യഹ്‌വെയുടെ ഉടമ്പടിയുടെ പെട്ടകം അവർക്കായി ഒരു വിശ്രമസ്ഥലം തേടാൻ[b] മൂന്നു ദിവസത്തെ യാത്രയിലുടനീളം അവരുടെ മുമ്പിൽ സഞ്ചരിച്ചു.
  to: അങ്ങനെ അവർ യഹ്‌വെയുടെ പർവതത്തിൽനിന്ന് മൂന്നു ദിവസത്തെ യാത്രയ്ക്കായി[a] പുറപ്പെട്ടു. യഹ്‌വെയുടെ ഉടമ്പടിപ്പെട്ടകം അവർക്കുവേണ്ടി ഒരു വിശ്രമസ്ഥലം തേടിക്കണ്ടെത്താൻ[b] അവരുടെ മുമ്പിൽ മൂന്നു ദിവസത്തെ യാത്ര ചെയ്തു.
