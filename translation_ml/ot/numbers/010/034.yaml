  language: ml
  text: അവർ പാളയത്തിൽനിന്ന് പുറപ്പെട്ടപ്പോൾ, പകൽ സമയത്ത് യഹ്‌വേയുടെ മേഘം അവരുടെ മീതെ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
