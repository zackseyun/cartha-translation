lexical_decisions:
- source_word: וַ/עֲנַן
  choice: മേഘം
  rationale: עָנָן എന്നത് ‘മേഘം’ എന്നാണ്. വാക്യാരംഭത്തിലെ וַ־ മുൻവാക്യത്തോടുള്ള ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ പ്രത്യേകം ‘എന്നും/അപ്പോൾ’ ചേർക്കാതെ ആ ബന്ധം നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, അതിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: עֲלֵיהֶם
  choice: അവരുടെ മീതെ ഉണ്ടായിരുന്നു
  rationale: עַל ഇവിടെ സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു; ‘മീതെ’ എന്നത് മേഘത്തിന്റെ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ‘മേൽ’ എന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: יוֹמָם
  choice: പകൽ സമയത്ത്
  rationale: יוֹמָם എന്ന ക്രിയാവിശേഷണത്തിന്റെ ‘പകൽ/പകൽ സമയത്ത്’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: בְּ/נָסְעָם
  choice: അവർ ... പുറപ്പെട്ടപ്പോൾ
  rationale: נסע എന്ന ധാതുവിന്റെ ഇവിടെ പ്രസക്തമായ അർഥം പാളയം വിട്ട് യാത്ര പുറപ്പെടുക എന്നതാണ്; בְּ ചേർന്ന അനന്തക്രിയാരൂപത്തിന്റെ കാലസംബന്ധം ‘പുറപ്പെട്ടപ്പോൾ’ എന്നു നൽകി.
- source_word: מִן הַמַּחֲנֶה
  choice: പാളയത്തിൽനിന്ന്
  rationale: מַחֲנֶה ഇസ്രായേലിന്റെ പാളയത്തെ സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടത സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ ‘പാളയത്തിൽനിന്ന്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: എബ്രായ പാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിനു പകരം നാമം ലിപ്യന്തരിച്ചു. ‘യഹ്‌വേ’ എന്ന രൂപം സ്രോതസ്സിലെ സാധ്യതയുള്ള ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: മേഘം ‘മീതെ’ ആണോ ‘മേൽ’ ആണോ എന്ന സ്ഥാനബന്ധം
  choice: അവരുടെ മീതെ ഉണ്ടായിരുന്നു
  alternative: അവരുടെ മേൽ ഉണ്ടായിരുന്നു
  rationale: עַל എന്ന പദത്തിന് രണ്ടുവിധ പ്രയോഗങ്ങളും സാധ്യമാണ്. പ്രധാന പാഠത്തിൽ വ്യക്തമായ സ്ഥാനാർഥമായ ‘മീതെ’ സ്വീകരിച്ചു; കൂടുതൽ അക്ഷരാർഥപരമായ ‘മേൽ’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു, സംരക്ഷണാത്മക അർഥം പാഠത്തിൽ നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായത്തിലെ കാലവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി ആദ്യം വച്ചു; അർഥഘടകങ്ങളൊന്നും ഒഴിവാക്കിയിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ [a] ആയി ഉൾപ്പെടുത്തി.
