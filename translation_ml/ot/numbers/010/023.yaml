translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ഭരണക്രമസൂത്രം നിലനിർത്തിക്കൊണ്ട് മലയാള വാക്യക്രമം സ്വാഭാവികമാക്കി; പേരുകൾ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
