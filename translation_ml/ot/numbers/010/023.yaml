source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: ml
  text: മനശ്ശെയുടെ പുത്രന്മാരുടെ ഗോത്രസൈന്യവിഭാഗത്തിന് മേൽ പെദാഹ്സൂരിന്റെ മകൻ ഗമലീയേൽ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൈന്യവിഭാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന צְבָא എന്ന എബ്രായപദത്തിന് ‘സൈന്യം,’ ‘സേന,’ ‘സംഘം,’ അല്ലെങ്കിൽ ‘വിഭാഗം’ എന്നും അർഥമാകാം; ഇവിടെ ക്രമീകരിക്കപ്പെട്ട ഗോത്രസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: അധിപനായി
  rationale: ആവർത്തിക്കുന്ന പാളയയാത്രാ സൂത്രവാക്യത്തിൽ עַל ഒരു ഗോത്രസൈന്യനിരയുടെ മേൽ നിയമിക്കപ്പെട്ട നേതാവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അധികാരബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: צְבָא
  choice: സൈന്യനിര
  rationale: ഇവിടെ യുദ്ധസേന എന്ന ഇടുങ്ങിയ അർഥത്തേക്കാൾ, യാത്രയ്ക്കായി ക്രമീകരിച്ച ഗോത്രസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സൈന്യനിര’ സൈനികസ്വഭാവവും ക്രമീകരിച്ച വിഭാഗമെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രവിഭാഗം
  rationale: സംഖ്യയിൽ ഈ പദം സാധാരണയായി ഗോത്രത്തെ സൂചിപ്പിക്കുന്നു; צְבָאയുമായുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഗോത്രവിഭാഗം’ എന്നു നൽകി.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാർ
  rationale: പേരെടുത്ത ഗോത്രവംശത്തെ സൂചിപ്പിക്കുന്ന എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘മനശ്ശെയുടെ പുത്രന്മാർ’ നിലനിർത്തുന്നു.
- source_word: גַּמְלִיאֵל
  choice: ഗമലീയേൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലി ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: פְּדָה צוּר
  choice: പെദാഹ്സൂർ
  rationale: വാചകത്തിൽ ഘടകങ്ങൾ വേർതിരിഞ്ഞുകാണപ്പെട്ടാലും ഇത് ഒരൊറ്റ വ്യക്തിനാമമാണ്; അതനുസരിച്ച് ഏകപദമായി ലിപ്യന്തരിച്ചു.
