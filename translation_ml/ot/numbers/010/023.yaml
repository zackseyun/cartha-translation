- from: മനശ്ശെയുടെ പുത്രന്മാരുടെ ഗോത്രവിഭാഗത്തിന്റെ സൈന്യനിരയ്ക്ക് അധിപനായി പെദാഹ്സൂരിന്റെ മകൻ ഗമലീയേൽ ഉണ്ടായിരുന്നു.[a]
  to: മനശ്ശെയുടെ പുത്രന്മാരുടെ ഗോത്രസൈന്യവിഭാഗത്തിന് മേൽ പെദാഹ്സൂരിന്റെ മകൻ ഗമലീയേൽ ഉണ്ടായിരുന്നു.[a]
