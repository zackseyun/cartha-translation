source:
  edition: WLC
  text: וּ/תְקַעְתֶּ֖ם תְּרוּעָ֑ה וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים קֵֽדְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: ml
  text: നിങ്ങൾ മുന്നറിയിപ്പിനുള്ള കാഹളധ്വനി മുഴക്കുമ്പോൾ[a], കിഴക്കുവശത്ത് തമ്പടിച്ചിരിക്കുന്ന പാളയങ്ങൾ യാത്ര തിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൂചനയ്ക്കുള്ള കാഹളധ്വനി.’ ഇവിടെ എബ്രായപദം പാളയങ്ങൾ യാത്ര തിരിക്കണമെന്നു സൂചിപ്പിക്കുന്ന പ്രത്യേകതരം കാഹളധ്വനിയെയാണ് കുറിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: നിങ്ങൾ ... മുഴക്കുമ്പോൾ
  rationale: תקע എന്ന ക്രിയ കാഹളസന്ദർഭത്തിൽ ‘മുഴക്കുക’ എന്നാണ്. സംയോജകപ്രത്യയത്തോടുകൂടിയ ക്രിയ ഇവിടെ തുടർന്നുള്ള ഫലവാക്യത്തിനു സമയസൂചന നൽകുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മുഴക്കുമ്പോൾ’ എന്നു നൽകി.
- source_word: תְּרוּעָה
  choice: മുന്നറിയിപ്പിനുള്ള കാഹളധ്വനി
  rationale: താവളത്തിന്റെ നീക്കത്തിനുള്ള പ്രത്യേക കാഹളസൂചനയാണ് תְּרוּעָה ഇവിടെ സൂചിപ്പിക്കുന്നത്; വെറും ‘ശബ്ദം’ എന്നതിനെക്കാൾ സാങ്കേതികമായ സൂചനാഭാവം ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: וְנָסְעוּ
  choice: യാത്ര പുറപ്പെടണം
  rationale: പാളയം നീക്കി യാത്ര ആരംഭിക്കുക എന്നതാണ് נסע എന്നതിന്റെ സന്ദർഭാർഥം. നിർദേശാത്മക ഭാവം നിലനിർത്താൻ ‘പുറപ്പെടണം’ ഉപയോഗിച്ചു.
- source_word: הַמַּחֲנוֹת
  choice: പാളയങ്ങൾ
  rationale: ഇത് സമാഗമകൂടാരത്തിനു ചുറ്റുമുള്ള ഗോത്രപാളയവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനമാണ്; നേരായ മലയാളസമാനപദം ‘പാളയങ്ങൾ’ ആണ്.
- source_word: הַחֹנִים
  choice: പാളയമടിച്ചിരിക്കുന്ന
  rationale: പങ്കാളിക്രിയ പാളയങ്ങളുടെ അന്നത്തെ സ്ഥാനം വിവരിക്കുന്നു; ‘പാളയമടിച്ചിരിക്കുന്ന’ അതിന്റെ സ്ഥിതിവാചകഭാവം നിലനിർത്തുന്നു.
- source_word: קֵדְמָה
  choice: കിഴക്കുവശത്തു
  rationale: രൂപത്തിൽ ദിശാസൂചകമാണെങ്കിലും ഇവിടെ പാളയങ്ങളുടെ കിഴക്കുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായി ‘കിഴക്കുവശത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശാത്മക ശൈലി. ‘കാഹളധ്വനി’ എന്നത് സന്ദർഭത്തിലെ വാദ്യവും സൂചനാഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ബഹുവചനമായ ‘പാളയങ്ങൾ’ നിലനിർത്തിയിരിക്കുന്നു.
