id: NUM.10.26
reference: Numbers 10:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: ml
  text: ആശേർപുത്രന്മാരുടെ ഗോത്രസൈന്യത്തിന്മേൽ ഒക്രാന്റെ മകൻ പഗീയേൽ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗോത്രസൈന്യം’ എന്നതിന് ‘സൈന്യം,’ ‘വിഭാഗം,’ അല്ലെങ്കിൽ ‘സംഘം’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഇസ്രായേലിന്റെ പാളയക്രമത്തിൽ ക്രമീകരിക്കപ്പെട്ട ഒരു സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: അധിപനായി
  rationale: മുൻവാക്യങ്ങളിലെ പട്ടിക തുടരുന്ന ബന്ധവും ഗോത്രസൈന്യത്തിനുമേലുള്ള നേതൃത്വബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; וְ എന്ന തുടർച്ച വാക്യക്രമത്തിലൂടെ സൂചിതമാണ്.
- source_word: צְבָא
  choice: ഗോത്രസൈന്യം
  rationale: ഇസ്രായേലിന്റെ പാളയക്രമത്തിലെ സംഘടിത ഗോത്രവിഭാഗമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. 'ഗോത്രസൈന്യം' ക്രമീകരിച്ച സൈനിക സംഘമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഇവിടെ അക്ഷരാർഥമായ 'വടി' അല്ല, ആശേറിന്റെ ഗോത്രഘടകമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּנֵי אָשֵׁר
  choice: ആശേറിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ 'ആശേറിന്റെ പുത്രന്മാർ' എന്ന വംശപരമായ ഗോത്രനാമം ലിംഗസൂചന നിലനിർത്തി നൽകുന്നു.
- source_word: פַּגְעִיאֵל
  choice: പഗീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്തു.
- source_word: בֶּן עָכְרָן
  choice: ഒക്രാന്റെ മകൻ
  rationale: എബ്രായ പിതൃനാമഘടന സ്വാഭാവിക മലയാളത്തിൽ 'മകൻ' എന്നു നൽകി; עָכְרָן എന്ന പേര് 'ഒക്രാൻ' എന്നു ലിപ്യന്തരം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികാസ്വഭാവമുള്ള വാക്യഘടന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക വായനയ്ക്കായി ക്രിയ ചേർത്തിരിക്കുന്നു.
