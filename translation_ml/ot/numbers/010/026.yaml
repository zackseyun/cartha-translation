- from: ആശേറിന്റെ പുത്രന്മാരുടെ ഗോത്രസൈന്യത്തിന് അധിപനായി ഒക്രാന്റെ മകൻ പഗീയേൽ ഉണ്ടായിരുന്നു.[a]
  to: ആശേർപുത്രന്മാരുടെ ഗോത്രസൈന്യത്തിന്മേൽ ഒക്രാന്റെ മകൻ പഗീയേൽ ആയിരുന്നു.[a]
  rationale: 'The revision preserves the Hebrew’s compact camp-list syntax: Pagiel is stated to be over the contingent, rather than being assigned the potentially stronger title ‘ruler.’ It retains the tribal and patronymic information and revises the note to present the lexical alternatives without unnecessarily narrowing the contingent to a combat force.'
