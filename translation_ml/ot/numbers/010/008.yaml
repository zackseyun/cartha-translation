  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: ml
  text: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ കാഹളങ്ങൾ ഊതണം; അവ നിങ്ങൾക്കു തലമുറകളിലുടനീളം സ്ഥിരമായ[a] ഒരു ചട്ടമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശാശ്വതമായ” അല്ലെങ്കിൽ “എന്നേക്കുമുള്ള.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: അഹരോന്റെ പുത്രന്മാരായ പുരോഹിതന്മാർ
  rationale: ‘അഹരോന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധവും ‘പുരോഹിതന്മാർ’ എന്ന സമാനാധികരണ തിരിച്ചറിയലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: കാഹളങ്ങൾ ഊതണം
  rationale: תקע എന്ന ക്രിയയ്ക്ക് ഈ വാദ്യസന്ദർഭത്തിൽ ‘ഊതുക’ യോജിക്കുന്നു. നിയമനിർദേശത്തിന്റെ ബലം മലയാളത്തിലെ ‘ഊതണം’ സ്വാഭാവികമായി നൽകുന്നു. ഈ വാക്യത്തിൽ വെള്ളി എന്നു പറയാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: וְהָיוּ לָכֶם
  choice: അവ നിങ്ങൾക്കു ... ആയിരിക്കണം
  rationale: എബ്രായത്തിലെ ബഹുവചന ക്രിയയെ മാനിച്ച് ‘അവ’ എന്നു നൽകി; ഏറ്റവും അടുത്ത ബഹുവചന നാമമായ കാഹളങ്ങളിലേക്കുള്ള വ്യാകരണബന്ധം തുറന്നുവെക്കുന്നു.
- source_word: לְחֻקַּת עוֹלָם
  choice: നിലനിൽക്കുന്ന ചട്ടം
  rationale: നിയമപരമായ חֻקָּה എന്നതിന് ‘ചട്ടം’ എന്നും, עוֹלָם സൂചിപ്പിക്കുന്ന ദീർഘകാല/സ്ഥിരമായ പ്രാബല്യത്തിന് ‘നിലനിൽക്കുന്ന’ എന്നും നൽകി; തികച്ചും അവസാനമില്ലാത്ത കാലത്തെക്കുറിച്ചുള്ള ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി
  rationale: തുടർന്നുവരുന്ന തലമുറകളിലുടനീളമുള്ള പ്രാബല്യം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: חֻקַּת עוֹלָם എന്ന നിയമസൂത്രത്തിന്റെ കാലപരിധി
  choice: നിലനിൽക്കുന്ന ചട്ടം
  alternative: ശാശ്വതമായ ചട്ടം; എന്നേക്കുമുള്ള ചട്ടം
  rationale: עוֹלָם സന്ദർഭാനുസരണം ദീർഘകാല സ്ഥിരതയെയോ നിരന്തരതയെയോ ശാശ്വതതയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം നിയമത്തിന്റെ തുടർച്ചയായ പ്രാബല്യം നിലനിർത്തുകയും അതിന്റെ ദാർശനിക കാലപരിധി അതിരുകടന്ന് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു; കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘പുത്രന്മാർ’ എന്നത് ഉറവിടത്തിലെ കുടുംബപരമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘കാഹളം’ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത വാദ്യപദമാണ്.
