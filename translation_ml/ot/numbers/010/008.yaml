    issue: ‘നിലനിൽക്കുന്ന ചട്ടം’ is less idiomatic for the enduring legal formula.
    rationale: ‘സ്ഥിരമായ ഒരു ചട്ടം’ naturally conveys a continuing ordinance without requiring an absolute philosophical sense of eternity.
