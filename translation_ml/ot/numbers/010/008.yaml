  - severity: low
    issue: Footnote anchor placement is imprecise.
    rationale: The alternatives ‘ശാശ്വതമായ’ and ‘എന്നേക്കുമുള്ള’ specifically qualify the rendering of עוֹלָם, so the marker should immediately follow ‘സ്ഥിരമായ’ rather than attach to the complete sentence.
