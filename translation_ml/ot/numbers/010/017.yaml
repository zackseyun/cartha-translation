id: NUM.10.17
reference: Numbers 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוּרַ֖ד הַ/מִּשְׁכָּ֑ן וְ/נָסְע֤וּ בְנֵֽי גֵרְשׁוֹן֙ וּ/בְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַ/מִּשְׁכָּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: ml
  text: പിന്നെ തിരുനിവാസം അഴിച്ചിറക്കപ്പെട്ടു; തിരുനിവാസം ചുമന്നുകൊണ്ട് ഗേർശോന്റെ പുത്രന്മാരും മെരാരിയുടെ പുത്രന്മാരും പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּרַד
  choice: അഴിച്ചിറക്കി
  rationale: ירד എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം ഇവിടെ സ്ഥാപിച്ചിരുന്ന തിരുനിവാസം താഴെയിറക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അഴിച്ചിറക്കി’ എന്നത് താഴെയിറക്കലും യാത്രയ്ക്കായി വേർതിരിക്കലും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പൂർണമായി പൊളിച്ചു’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ യിസ്രായേലിന്റെ വിശുദ്ധ സഞ്ചാരകൂടാരത്തെ സൂചിപ്പിക്കുന്ന മִשְׁכָּן എന്ന പദത്തിന് ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളസമാനപദമാണ് ‘തിരുനിവാസം’.
- source_word: וְנָסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാസന്ദർഭത്തിൽ נסע പാളയം വിട്ട് യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ ‘ഗേർശോന്റെ പുത്രന്മാർ’ എന്ന വംശപരമായ പ്രയോഗവും സമാന്തരഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ പുത്രന്മാർ എന്ന വ്യക്തമായ വംശപരമായ രൂപവും മുൻപ്രയോഗത്തോടുള്ള സമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: נֹשְׂאֵי
  choice: ചുമന്നുകൊണ്ട്
  rationale: യാത്രയ്ക്കിടെ അവർ നിർവഹിച്ചിരുന്ന പ്രവൃത്തിയെ വർത്തമാനകൃതന്തം സൂചിപ്പിക്കുന്നു; ‘ചുമന്നുകൊണ്ട്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: സന്ദർഭത്തിൽ അഴിച്ചിറക്കിയ തിരുനിവാസത്തിന്റെ ഘടകങ്ങളാണ് ചുമന്നതെന്നു മനസ്സിലാകുമെങ്കിലും, എബ്രായം വീണ്ടും ‘തിരുനിവാസം’ എന്നുതന്നെ പറയുന്നു. അതിനാൽ ‘അതിന്റെ ഭാഗങ്ങൾ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിന്റെ സംഭവക്രമവും ‘ഗേർശോന്റെ പുത്രന്മാർ / മെരാരിയുടെ പുത്രന്മാർ’ എന്ന സമാന്തര വംശപ്രയോഗവും നിലനിർത്തി. വ്യാഖ്യാനാത്മകമായ ‘ഘടകങ്ങൾ’ എന്ന പദം ചേർത്തിട്ടില്ല.
