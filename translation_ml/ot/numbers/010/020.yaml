id: NUM.10.20
reference: Numbers 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: ml
  text: ഗാദിന്റെ മക്കളുടെ ഗോത്രസൈന്യത്തിന് മേൽ ദെയൂവേലിന്റെ മകൻ എല്യാസാഫ് ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗോത്രസൈന്യം’ എന്നതിന് ‘സംഘം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ צְבָאയ്ക്ക് പലപ്പോഴും സൈനികമായ അർഥച്ചായയുണ്ട്; എന്നാൽ ഇവിടെ അത് ക്രമപ്പെടുത്തി യാത്രചെയ്യുന്ന ഗോത്രസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: മേൽ
  rationale: ആവർത്തിക്കുന്ന നേതൃത്വപ്പട്ടികയിലെ עַל ഒരു ഗോത്രത്തിന്റെ ക്രമീകരിച്ച സംഘത്തിനുമേലുള്ള ചുമതലയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മേൽ’ മേൽനോട്ടത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; വാക്യാരംഭത്തിലെ וְ മുൻവാക്യങ്ങളോടുള്ള പട്ടികബന്ധത്തിനുള്ളതായതിനാൽ സ്വതന്ത്ര വാക്യത്തിൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: צְבָא
  choice: സൈന്യനിര
  rationale: צָבָאയ്ക്ക് സൈനികമായ അർഥച്ചായയുണ്ടെങ്കിലും ഇവിടെ യിസ്രായേലിന്റെ പാളയത്തിലെ ക്രമപ്പെടുത്തിയ ഗോത്രയാത്രാസംഘമാണ് ഉദ്ദേശ്യം. ‘സൈന്യനിര’ ആ സൈനിക-സംഘടനാത്മക ഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ പൊതുവായ പകരങ്ങൾ നൽകുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രവിഭാഗം
  rationale: ഇവിടെ מַטֶּה ദണ്ഡിനെയല്ല, ഗോത്രഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്. צְבָאയോടൊപ്പം വരുന്നതിനാൽ ‘ഗോത്രവിഭാഗം’ എന്നത് ഘടന വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי גָד
  choice: ഗാദിന്റെ മക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഗാദിന്റെ പുത്രന്മാർ’ എന്ന ഗോത്രനാമകരണരീതി മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ‘ഗാദിന്റെ മക്കൾ’ എന്നു നൽകി.
- source_word: אֶלְיָסָף
  choice: എല്യാസാഫ്
  rationale: എബ്രായ ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן דְּעוּאֵל
  choice: ദെയൂവേലിന്റെ മകൻ
  rationale: എബ്രായ വംശാവലിസൂത്രമായ ‘X-ന്റെ മകൻ’ നേരിട്ട് നിലനിർത്തി; דְּעוּאֵל എന്ന പേരിനെ ദെയൂവേൽ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. നേതൃത്വപ്പട്ടികയുടെ ചുരുക്കഘടനയും എബ്രായത്തിലെ സൈനിക-യാത്രാസംഘ അർഥച്ചായയും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
