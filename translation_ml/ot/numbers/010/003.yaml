  text: וְ/תָקְע֖וּ בָּ/הֵ֑ן וְ/נֽוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: ml
  text: അവർ ആ കാഹളങ്ങൾ ഊതുമ്പോൾ[a], മുഴുവൻ സമൂഹവും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ നിന്റെ അടുക്കൽ വന്നുകൂടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവർ ആ കാഹളങ്ങൾ ഊതും; മുഴുവൻ സമൂഹവും നിന്റെ അടുക്കൽ വന്നുകൂടും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: അവർ ... ഊതുമ്പോൾ
  rationale: വാവ് ചേർന്ന ക്രിയാരൂപം അക്ഷരാർഥത്തിൽ ‘അവർ ഊതും’ എന്നു നൽകാമെങ്കിലും, ഈ നിർദേശക്രമത്തിൽ കാഹളം ഊതുന്നതിനെ തുടർന്നുള്ള പ്രതികരണം സൂചിപ്പിക്കുന്ന കാലസംബന്ധമായ അർഥമാണ് സ്വാഭാവികം.
- source_word: בָּהֵן
  choice: ആ കാഹളങ്ങൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചന സർവനാമം മുൻവാക്യത്തിലെ രണ്ട് വെള്ളിക്കാഹളങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സൂചന വ്യക്തമായി നിലനിർത്താൻ നാമം ആവർത്തിച്ചു.
- source_word: וְנוֹעֲדוּ
  choice: വന്നുകൂടണം
  rationale: നിഫാൽ രൂപം വിളിച്ചുകൂട്ടപ്പെട്ട സമൂഹം നിശ്ചിത സ്ഥലത്ത് ഒരുമിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിർദേശത്തിന്റെ സ്വഭാവം മലയാളത്തിൽ ‘ണം’ രൂപത്തിലൂടെ പ്രകടമാക്കി.
- source_word: אֵלֶיךָ
  choice: നിന്റെ അടുക്കൽ
  rationale: ഹീബ്രുവിലെ ദിശാസൂചകമായ ‘നിന്റെ അടുക്കലേക്ക്’ എന്ന ആശയം നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം മുഴുവനും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സമഗ്രത ഊന്നിപ്പറയുന്നതുമാണ്.
- source_word: פֶּתַח
  choice: പ്രവേശനകവാടത്തിൽ
  rationale: കൂടാരത്തിലേക്കുള്ള പ്രവേശനസ്ഥലം എന്ന അർഥം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ഇസ്രായേലും നിശ്ചയിക്കപ്പെട്ടവിധം കൂടിച്ചേരുന്ന കൂടാരത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദപ്രയോഗം.
