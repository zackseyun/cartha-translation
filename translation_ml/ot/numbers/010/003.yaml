translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. ‘സമാഗമകൂടാരം’ എന്ന പരിചിത പദം നിലനിർത്തി; ഹീബ്രുവിലെ ദിശാസൂചനയായ אֵלֶיךָ ‘നിന്റെ അടുക്കൽ’ എന്നു വിവർത്തനം ചെയ്തു.
