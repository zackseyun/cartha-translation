  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: ml
  text: ശിമെയോന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിലെ സംഘത്തിന് അധികാരിയായി ഉണ്ടായിരുന്നത് സൂരീശദ്ദായിയുടെ മകൻ ശെലൂമീയേൽ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘സംഘം’ എന്നതിന് ‘സേനാവിഭാഗം’ അല്ലെങ്കിൽ ‘സേന’ എന്നും പരിഭാഷപ്പെടുത്താം (എബ്രായം: צְבָא). ഇത് ക്രമീകരിക്കപ്പെട്ട ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: അധിപനായി
  rationale: യാത്രാക്രമത്തിന്റെ ഈ സന്ദർഭത്തിൽ עַל ഒരു ഗോത്രസൈന്യത്തിന്റെ മേൽ നിയമിക്കപ്പെട്ട നേതാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകുന്നതിനായി ക്രിയയോടു ചേർത്ത് ‘അധിപനായി ... ഉണ്ടായിരുന്നു’ എന്നു നൽകി.
- source_word: צְבָא
  choice: ഗോത്രസൈന്യം
  rationale: ഇവിടെ പദം യുദ്ധത്തിൽ ഏർപ്പെട്ടിരിക്കുന്ന സൈന്യത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല; ക്രമീകരിക്കപ്പെട്ട ഗോത്രസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഗോത്രസൈന്യം’ ഈ സൈനിക-സംഘടനാത്മക ഭാവം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: പാളയക്രമത്തിന്റെയും ജനസംഖ്യാഗണനയുടെയും സന്ദർഭത്തിൽ പദത്തിന്റെ വ്യക്തമായ അർഥം ‘ഗോത്രം’ എന്നതാണ്; ഇവിടെ ‘ഗോത്രസൈന്യം’ എന്ന സംയുക്തപ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാർ
  rationale: അക്ഷരാർഥമായ ഗോത്രനാമപ്രയോഗം നിലനിർത്തുന്നു; ഇത് ശിമെയോനിൽനിന്നുള്ള ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֻמִיאֵל
  choice: ശെലൂമീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തി.
- source_word: בֶּן
  choice: മകൻ
  rationale: നേരിട്ടുള്ള പിതൃനാമബന്ധത്തിൽ സുതാര്യവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: צוּרִי שַׁדָּי
  choice: സൂരീശദ്ദായി
  rationale: എബ്രായ വ്യക്തിനാമം ഏകീകൃത നാമമായി മലയാളലിപിയിൽ പകർത്തി.
