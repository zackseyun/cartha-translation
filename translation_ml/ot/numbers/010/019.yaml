translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിലെ നേതൃബന്ധവും ഗോത്രസംഘടനയുടെ സൈനികഭാവവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു.
