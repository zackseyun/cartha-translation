source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: ml
  text: അങ്ങനെ, ബെന്യാമീന്റെ പുത്രന്മാരുടെ ഗോത്രത്തിലെ സേനാവിഭാഗത്തിന്റെ മേൽ ഗിദെയോനിയുടെ മകൻ അബീദാൻ ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേനാവിഭാഗം’ എന്നതിന് ‘സൈന്യം’ എന്നോ ‘സംഘം’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഹീബ്രായ പദം സൈനികശൈലിയിൽ ക്രമീകരിച്ച ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: മേൽ
  rationale: മുൻവാക്യങ്ങളിലെ യാത്രാക്രമപ്പട്ടിക തുടരുന്നതായി വാക്യഘടന വ്യക്തമാക്കുന്നതിനൊപ്പം, ഈ വ്യക്തി ഗോത്രസേനാവിഭാഗത്തിന്റെ നേതൃത്വത്തിൽ ആയിരുന്നുവെന്ന മേൽനോട്ടാർഥവും നിലനിർത്തുന്നു.
- source_word: צְבָא
  choice: സേനാവിഭാഗം
  rationale: ഇവിടെ വെറും യുദ്ധസേനയെക്കാൾ, യാത്രയ്ക്കായി ക്രമീകരിച്ച സൈനികശൈലിയിലുള്ള ഗോത്രസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സേനാവിഭാഗം’ സംഘടിതമായ വിഭാഗം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מַטֵּה
  choice: ഗോത്രം
  rationale: ഈ സന്ദർഭത്തിൽ ദണ്ഡ് എന്ന അക്ഷരാർഥമല്ല, ജനഗണനയിലും യാത്രാക്രമത്തിലും ഉപയോഗിക്കുന്ന ഗോത്രഘടകമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രായയിലെ വംശാവലിസ്വഭാവമുള്ള ഘടന സംരക്ഷിക്കുന്ന ഔപചാരികവും മനസ്സിലാക്കാവുന്നതുമായ പരിഭാഷ.
- source_word: אֲבִידָן
  choice: അബീദാൻ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן גִּדְעוֹנִי
  choice: ഗിദെയോനിയുടെ മകൻ
  rationale: വംശപരമായ തിരിച്ചറിയൽ നൽകുന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആവർത്തിച്ചുവരുന്ന യാത്രാക്രമപ്പട്ടികയ്ക്ക് യോജിച്ച ഔപചാരികവും എന്നാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആധുനിക മലയാളം. മൂലത്തിലെ നാമവാക്യസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഉണ്ടായിരുന്നു’ ചേർത്തിരിക്കുന്നു.
