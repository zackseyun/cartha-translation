source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: ml
  text: 'പെട്ടകം പുറപ്പെടുമ്പോഴെല്ലാം[a] മോശെ ഇങ്ങനെ പറഞ്ഞു: “യാഹ്‌വേ, എഴുന്നേൽക്കേണമേ; അങ്ങയുടെ ശത്രുക്കൾ ചിതറിപ്പോകട്ടെ[b]; അങ്ങയെ വെറുക്കുന്നവർ അങ്ങയുടെ മുമ്പിൽനിന്ന് ഓടിപ്പോകട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെട്ടകം പുറപ്പെട്ടപ്പോൾ സംഭവിച്ചത് ഇതാണ്”; എബ്രായപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ നൽകാമെങ്കിലും, ഇവിടെ ആവർത്തിച്ചുണ്ടാകുന്ന സംഭവമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “എഴുന്നേൽക്കേണമേ” എന്നത് ദൈവം അക്ഷരാർഥത്തിൽ നിർജ്ജീവനായിരുന്നുവെന്ന സൂചനയല്ല; യാഹ്‌വേ ശക്തിയോടെ പ്രവർത്തിക്കണമെന്ന അഭ്യർഥനയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: യാത്ര പുറപ്പെടുമ്പോഴെല്ലാം
  rationale: היה എന്ന ക്രിയയോടുകൂടിയ infinitive construct ഇവിടെ ആവർത്തിച്ചുണ്ടാകുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘പുറപ്പെടുമ്പോഴെല്ലാം’ എന്നു നൽകി.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: എബ്രായപാഠത്തിൽ ‘പെട്ടകം’ എന്നു മാത്രമേയുള്ളൂ; ‘ഉടമ്പടിയുടെ പെട്ടകം’ എന്നു വികസിപ്പിക്കുന്നത് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത വിവരം ചേർക്കുന്നതായിരിക്കും.
- source_word: קוּמָה
  choice: എഴുന്നേൽക്കണമേ
  rationale: യഹോവയോടുള്ള ആജ്ഞാരൂപത്തിലുള്ള പ്രാർഥനയാണ്. ദൈവം ശക്തിയോടെ പ്രവർത്തിക്കണമെന്ന അഭ്യർഥനയുടെ സജീവമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവേ
  rationale: ദൈവനാമമായ ചതുർവ്യഞ്ജനത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ, സംബോധനാവിഭക്തിയോടെ നൽകി.
- source_word: וְיָפֻצוּ
  choice: ചിതറിപ്പോകട്ടെ
  rationale: ആജ്ഞാരൂപത്തിനു പിന്നാലെയുള്ള imperfect ഇവിടെ പ്രാർഥനാപരമായ jussive ഭാവത്തിലാണ്; ‘-ട്ടെ’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: אֹיְבֶיךָ
  choice: അങ്ങയുടെ ശത്രുക്കൾ
  rationale: യഹോവയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചനപ്രത്യയം ആദരസൂചകമായ ‘അങ്ങയുടെ’ എന്നു നൽകി.
- source_word: וְיָנֻסוּ
  choice: ഓടിപ്പോകട്ടെ
  rationale: സമാന്തരമായ രണ്ടാമത്തെ jussive അപേക്ഷയാണ്; ഭയന്ന് അകന്നുപോകുന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מְשַׂנְאֶיךָ
  choice: അങ്ങയെ വെറുക്കുന്നവർ
  rationale: തുടർച്ചയായ സ്വഭാവവിശേഷണം സൂചിപ്പിക്കുന്ന participle സ്വാഭാവികമായ ബന്ധവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִפָּנֶיךָ
  choice: അങ്ങയുടെ സന്നിധിയിൽനിന്ന്
  rationale: മുൻപിൽനിന്നോ സാന്നിധ്യത്തിൽനിന്നോ പിന്മാറിപ്പോകുന്ന ആശയം ‘സന്നിധിയിൽനിന്ന്’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ദൈവിക സാന്നിധ്യത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ നിലനിർത്തി. മലയാള ബൈബിൾ വായനക്കാർക്ക് വ്യാപകമായി പരിചിതവും സ്വാഭാവികവുമായ രൂപമായതിനാൽ ‘യഹോവ’ തെരഞ്ഞെടുത്തു; മൂലോച്ചാരണത്തോട് കൂടുതൽ അടുക്കുന്ന ‘യാഹ്‌വെ’ സാധ്യമായ മറ്റൊരു രൂപമാണ്.
- issue: קוּמָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: ദൈവം ശക്തിയോടെ പ്രവർത്തിക്കണമെന്ന പ്രാർഥനാപരമായ ആഹ്വാനം
  alternative: ദൈവം അക്ഷരാർഥത്തിൽ ഇരിക്കുകയോ നിർജ്ജീവനായിരിക്കുകയോ ചെയ്തതിൽനിന്ന് എഴുന്നേൽക്കണമെന്ന പ്രസ്താവന
  rationale: സൈനിക-പ്രാർഥനാ സന്ദർഭത്തിൽ ഈ ആജ്ഞ ദൈവിക ഇടപെടലിനുള്ള രൂപകാത്മക അഭ്യർഥനയാണ്; എങ്കിലും മൂലത്തിലെ സജീവരൂപകം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ രൂപം സ്വീകരിച്ചു. കാവ്യാത്മക സമാന്തരതയും അപേക്ഷാഭാവമുള്ള ‘-ട്ടെ’ ഘടനയും നിലനിർത്തി.
