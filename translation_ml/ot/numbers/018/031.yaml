reference: Numbers 18:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: ml
  text: നിങ്ങളും നിങ്ങളുടെ വീട്ടുകാരും അത് ഏതു സ്ഥലത്തും ഭക്ഷിക്കാം[a][b]; കാരണം സമാഗമകൂടാരത്തിൽ നിങ്ങൾ ചെയ്യുന്ന സേവനത്തിനു പകരമായുള്ള നിങ്ങളുടെ പ്രതിഫലമാണ് അത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അത് ഭക്ഷിക്കണം’ അല്ലെങ്കിൽ ‘അത് ഭക്ഷിക്കേണ്ടതാണ്’; ഈ നിയമസന്ദർഭത്തിൽ എബ്രായ ക്രിയാരൂപത്തിന് നിർദേശമോ അനുമതിയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വീട്ടുകാർ’ എന്നത് ഭൗതികമായ വീടിനെ മാത്രമല്ല, കുടുംബം ഉൾപ്പെടുന്ന ഗാർഹിക ഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘വേതനം,’ ‘കൂലി,’ അല്ലെങ്കിൽ ‘പ്രതിഫലത്തുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: അത് ... ഭക്ഷിക്കാം
  rationale: നിയമസന്ദർഭത്തിൽ ഈ എബ്രായ ക്രിയാരൂപം ഭൂതകാലവിവരണമല്ല, അനുവദിക്കപ്പെട്ട പ്രവൃത്തിയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഭക്ഷിക്കാം’ അനുമതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּכָל מָקוֹם
  choice: എവിടെയായിരുന്നാലും
  rationale: ഈ വിഹിതം ഭക്ഷിക്കുന്നതിന് വിശുദ്ധസ്ഥലപരമായ നിയന്ത്രണമില്ലെന്ന വിതരണാത്മക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: നിങ്ങൾക്കും നിങ്ങളുടെ വീട്ടുകാർക്കും
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തെക്കാൾ കുടുംബം ഉൾപ്പെടുന്ന ഗാർഹിക ഘടകത്തെ സൂചിപ്പിക്കുന്നു; ‘വീട്ടുകാർ’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള അനുമതിയുടെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׂכָר
  choice: പ്രതിഫലം
  rationale: തൊഴിലിനോ സേവനത്തിനോ ലഭിക്കുന്ന പ്രതിഫലം/വേതനം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ഇവിടെ ഭക്ഷ്യവിഹിതമാണ് നൽകപ്പെടുന്നതെന്നതിനാൽ ‘പ്രതിഫലം’ സ്വാഭാവികമാണ്.
- source_word: חֵלֶף עֲבֹדַתְכֶם
  choice: നിങ്ങളുടെ സേവനത്തിനുള്ള
  rationale: ലേവ്യരുടെ നിയുക്ത ശുശ്രൂഷയ്ക്കു പകരമായി ലഭിക്കുന്ന പ്രതിഫലബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ
  rationale: സ്ഥാപിതമായ വിശുദ്ധകൂടാരനാമവും അതുമായി ബന്ധപ്പെട്ട സേവനത്തിന്റെ സ്ഥലബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ വിഹിതത്തിന്റെ സ്വഭാവം
  choice: ഇത് സമാഗമകൂടാരത്തിലെ സേവനത്തിനുള്ള നിയമാനുസൃത പ്രതിഫലമായി അവതരിപ്പിക്കുന്നു; ഏതു സ്ഥലത്തും ഭക്ഷിക്കാം.
  alternative: വിശുദ്ധസ്ഥലത്തു മാത്രം ഭക്ഷിക്കേണ്ട യാഗഭോജനമായി ഇതിനെ ചുരുക്കി മനസ്സിലാക്കുക.
  rationale: בְּכָל מָקוֹם എന്ന വ്യക്തമായ പ്രയോഗം വിശുദ്ധസ്ഥലപരമായ ഭക്ഷണനിയന്ത്രണം ഇവിടെ ഇല്ലെന്ന് കാണിക്കുന്നു; അതിനാൽ വാക്യത്തിലെ നിയമപരമായ വ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘സമാഗമകൂടാരം’ എന്ന പരിചിതമായ ബൈബിൾ പദം നിലനിർത്തി; അനുമതിയും സേവനത്തിനുള്ള പ്രതിഫലവും വ്യക്തമായി പ്രകടിപ്പിച്ചു.
