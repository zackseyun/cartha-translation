  to: എന്നാൽ കാളയുടെ ആദ്യജാതത്തെയോ ചെമ്മരിയാടിന്റെ ആദ്യജാതത്തെയോ കോലാടിന്റെ ആദ്യജാതത്തെയോ നീ വീണ്ടെടുക്കരുത്; അവ വിശുദ്ധമായവയാണ്. അവയുടെ രക്തം യാഗപീഠത്തിന്മേൽ തളിക്കണം; അവയുടെ കൊഴുപ്പ് യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമായി, അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാടായി[a] ദഹിപ്പിക്കണം.
