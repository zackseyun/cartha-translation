id: NUM.18.17
reference: Numbers 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: ml
  text: എന്നാൽ കാളയുടെ ആദ്യജാതത്തെയോ ചെമ്മരിയാടിന്റെ ആദ്യജാതത്തെയോ കോലാടിന്റെ ആദ്യജാതത്തെയോ നീ വീണ്ടെടുക്കരുത്; അവ വിശുദ്ധമായവയാണ്. അവയുടെ രക്തം യാഗപീഠത്തിന്മേൽ തളിക്കണം; അവയുടെ കൊഴുപ്പ് യഹോവയ്ക്കു പ്രസാദകരമായ സുഗന്ധമായി, അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാടായി[a] ദഹിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അഗ്നിവഴിപാടായി.”'
    reason: ആരാധനാപരമായ אִשֶּׁה എന്ന പദത്തിന്റെ കൂടുതൽ സംക്ഷിപ്തമായ പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻനിയമത്തിൽനിന്നുള്ള നിയന്ത്രണമോ അപവാദമോ അവതരിപ്പിക്കുന്ന വിരുദ്ധാർഥക ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּכוֹר
  choice: കടിഞ്ഞൂൽ
  rationale: ആരാധനാനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആദ്യമായി ജനിക്കുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ കൃത്യമായ പദം.
- source_word: שׁוֹר / כֶּשֶׂב / עֵז
  choice: കാള / ചെമ്മരിയാട് / കോലാട്
  rationale: ബലി അർപ്പിക്കാവുന്ന മൂന്നു മൃഗവർഗങ്ങളെയും വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ വേർതിരിച്ചുകാട്ടുന്നു.
- source_word: לֹא תִפְדֶּה
  choice: നീ വീണ്ടെടുക്കരുത്
  rationale: പകരംവിലയോ പകരക്കാരനെയോ നൽകി ആരാധനാപരമായ ബാധ്യതയിൽനിന്ന് മോചിപ്പിക്കുന്ന നിയമനടപടിയാണ് פדה; ‘വീണ്ടെടുക്കുക’ ആ ആശയം നിലനിർത്തുന്നു.
- source_word: קֹדֶשׁ הֵם
  choice: അവ വിശുദ്ധമാണ്
  rationale: അവയെ വീണ്ടെടുക്കാൻ പാടില്ലാത്തതിന്റെ ആരാധനാപരമായ കാരണം നേരിട്ടും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
- source_word: תִּזְרֹק
  choice: തളിക്കണം
  rationale: യാഗപീഠത്തിന്മേൽ രക്തം എറിയുകയോ ചിതറിക്കുകയോ ചെയ്യുന്ന ബലികർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അതിനെ അതിസൂക്ഷ്മമായ തുള്ളിവിതറലായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: חֶלְבָּם תַּקְטִיר
  choice: അവയുടെ കൊഴുപ്പ് ... ദഹിപ്പിക്കണം
  rationale: യാഗത്തിനായി മാറ്റിവെച്ച കൊഴുപ്പിനെ യാഗപീഠത്തിൽ പുകയാക്കി അർപ്പിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമായി പറയുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: തീ മുഖേന ദൈവത്തിനു സമർപ്പിക്കുന്ന യാഗാർപ്പണം എന്ന ആരാധനാപരമായ അർഥം നിലനിർത്തുന്നു; ഇതിനെ പ്രത്യേകമായ ‘സർവാംഗഹോമം’ എന്ന യാഗവിഭാഗവുമായി കലർത്തുന്നില്ല.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ആരാധനാഭാഷയുടെ രൂപകാത്മക ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിലെ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ നേരിട്ട് നൽകുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  alternative: ഭോജനയാഗം
  rationale: പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തി സംബന്ധിച്ച ചർച്ചകൾക്കിടയിലും സന്ദർഭത്തിൽ തീ മുഖേന അർപ്പിക്കുന്ന യാഗം വ്യക്തമാണ്. ‘ഭോജനയാഗം’ ദൈവം ഭക്ഷിക്കുന്നു എന്ന അനാവശ്യ ധാരണയ്ക്കോ മറ്റൊരു പ്രത്യേക യാഗവിഭാഗത്തോടുള്ള ആശയക്കുഴപ്പത്തിനോ ഇടയാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ആരാധനാശൈലി. ഏകവചന അഭിസംബോധനയായ ‘നീ’ നിലനിർത്തി; പരിചിതമല്ലാത്ത സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി, യാഗസംബന്ധമായ അർഥവ്യത്യാസങ്ങൾ വ്യക്തമായി സൂക്ഷിച്ചു.
