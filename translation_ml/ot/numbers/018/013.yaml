  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ ദേശത്തുള്ള സകലത്തിന്റെയും ആദ്യഫലങ്ങൾ യഹോവയ്ക്ക് കൊണ്ടുവരുന്നതു നിനക്കുള്ളതായിരിക്കും. നിന്റെ വീട്ടിലുള്ള ശുദ്ധിയുള്ള ഏവനും അതു ഭക്ഷിക്കാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ആചാരപരമായി ശുദ്ധിയുള്ള ഏവനും.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: ആദ്യഫലങ്ങൾ
  rationale: വിളവിൽനിന്ന് ആദ്യം ലഭിച്ച് സമർപ്പിക്കപ്പെടുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: അവരുടെ ദേശത്തുള്ള എല്ലാറ്റിന്റെയും
  rationale: എബ്രായത്തിലെ വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു; കൃഷിവിളകൾ എന്നു പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: അവർ യഹോവയ്ക്ക് കൊണ്ടുവരുന്നത്
  rationale: ‘കൊണ്ടുവരുക’ എന്ന മൂലക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുകയും സമർപ്പണസന്ദർഭം വ്യക്തമാകാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിൽ പതിവായി തിരിച്ചറിയാവുന്ന ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְךָ יִהְיֶה
  choice: നിനക്കുള്ളതായിരിക്കും
  rationale: അഹരോനും പുരോഹിതകുടുംബത്തിനും ഈ സമർപ്പണം അവകാശമായി നൽകുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כָּל טָהוֹר
  choice: ശുദ്ധിയുള്ള ഏവനും
  rationale: ‘ശുദ്ധൻ’ എന്ന അടിസ്ഥാനാർഥം മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּבֵיתְךָ
  choice: നിന്റെ വീട്ടിലുള്ള
  rationale: അഹരോന്റെ വീട്ടിലോ കുടുംബത്തിലോ ഉള്ളവരെ സൂചിപ്പിക്കുന്ന മൂലരൂപത്തോട് അടുത്ത സ്വാഭാവിക മലയാളം.
- source_word: יֹאכֲלֶנּוּ
  choice: അതു ഭക്ഷിക്കാം
  rationale: ഈ സന്ദർഭത്തിലെ അനുമതിയെയും അവകാശത്തെയും ‘ഭക്ഷിക്കാം’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ ‘ശുദ്ധി’യുടെ സ്വഭാവം
  choice: അഹരോന്റെ വീട്ടിൽ ആചാരപരമായി ശുദ്ധിയുള്ളവർക്ക് പുരോഹിതവിഹിതം ഭക്ഷിക്കാം
  alternative: പൊതുവായ അർഥത്തിൽ ധാർമികമായി ശുദ്ധിയുള്ളവർ
  rationale: സംഖ്യ 18-ലെ പുരോഹിതാവകാശങ്ങളുടെയും ശുദ്ധിനിയമങ്ങളുടെയും പശ്ചാത്തലത്തിൽ טָהוֹר ആചാരപരമായ ശുദ്ധിയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യവാക്യത്തിലെ എബ്രായബന്ധഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ആദ്യഫലങ്ങളിൽനിന്ന് ... കൊണ്ടുവരുന്നതെല്ലാം’ എന്നു ക്രമപ്പെടുത്തി; അർഥപരിധി വികസിപ്പിച്ചിട്ടില്ല.
