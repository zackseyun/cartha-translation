id: NUM.18.1
reference: Numbers 18:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ അഹരോനോടു പറഞ്ഞു: “നീയും നിന്റെ പുത്രന്മാരും നിന്നോടുകൂടെയുള്ള നിന്റെ പിതൃഭവനവും വിശുദ്ധമന്ദിരത്തിന്റെ അകൃത്യം വഹിക്കണം[a]; നീയും നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാരും നിങ്ങളുടെ പൗരോഹിത്യത്തിന്റെ അകൃത്യം വഹിക്കണം[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധമന്ദിരത്തിന്റെ കുറ്റം വഹിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം; വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ലംഘനങ്ങൾക്കുള്ള ഉത്തരവാദിത്വം വഹിക്കുക എന്ന അർത്ഥവും എബ്രായ ശൈലിക്കുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ പൗരോഹിത്യത്തിന്റെ കുറ്റം വഹിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം; പുരോഹിതപദവിയുമായി ബന്ധപ്പെട്ട ലംഘനങ്ങൾക്കുള്ള ഉത്തരവാദിത്വം വഹിക്കുക എന്ന അർത്ഥവും എബ്രായ ശൈലിക്കുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുടെ ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בֵית אָבִיךָ
  choice: നിന്റെ പിതൃഭവനം
  rationale: ഭൗതികമായ വീടുമാത്രമല്ല, പിതൃവംശപരമായ വിപുലകുടുംബത്തെയും കുലത്തെയും സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുത്വപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אִתָּךְ
  choice: നിന്നോടുകൂടെയുള്ള
  rationale: രണ്ടു വാക്യഭാഗങ്ങളിലുമുള്ള സഹവർത്തിത്വവും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: תִּשְׂאוּ
  choice: വഹിക്കണം
  rationale: നשא എന്ന ക്രിയയുടെ ചുമക്കുക, കുറ്റബാധ്യത വഹിക്കുക, ഉത്തരവാദിത്വം ഏറ്റെടുക്കുക എന്നീ അർത്ഥവ്യാപ്തികൾ പൂർണമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: עֲוֺן
  choice: അകൃത്യം
  rationale: പാപകൃത്യം, അതിന്റെ കുറ്റബാധ്യത, അതിനുള്ള ശിക്ഷാഭാരം എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: הַמִּקְדָּשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: പുരോഹിതന്മാർക്ക് ഉത്തരവാദിത്വമുള്ള വിശുദ്ധസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: כְּהֻנַּתְכֶם
  choice: നിങ്ങളുടെ പൗരോഹിത്യം
  rationale: അഹരോന്റെയും പുത്രന്മാരുടെയും പുരോഹിതപദവിയെയും സേവനസംവിധാനത്തെയും സ്ഥാപനപരമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതസന്ദർഭത്തിൽ ‘അകൃത്യം വഹിക്കുക’ എന്നതിന്റെ അർത്ഥം
  choice: ‘അകൃത്യം വഹിക്കണം’ എന്ന എബ്രായ ശൈലിയുടെ രൂപവും അർത്ഥവ്യാപ്തിയും പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘കുറ്റം വഹിക്കണം’ അല്ലെങ്കിൽ ‘ബന്ധപ്പെട്ട ലംഘനങ്ങൾക്ക് ഉത്തരവാദികളായിരിക്കണം’.
  rationale: ഈ ശൈലി കുറ്റം, കുറ്റബാധ്യത, വിശുദ്ധസേവനവുമായി ബന്ധപ്പെട്ട ലംഘനങ്ങൾക്കുള്ള ഉത്തരവാദിത്വം എന്നിവയെ സൂചിപ്പിക്കാം. ഒരു അർത്ഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ വാക്യത്തിന്റെ സമാന്തരഘടനയും ‘വഹിക്കുക’ എന്ന ഉദ്ദേശപൂർവമായ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
