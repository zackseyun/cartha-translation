source:
  edition: WLC
  text: כָּל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: ml
  text: ഇസ്രായേലിൽ ദൈവത്തിന് പൂർണമായി സമർപ്പിക്കപ്പെട്ടതെല്ലാം നിനക്കുള്ളതായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിൽ നിരോധിതമായതെല്ലാം.” എബ്രായപദം ദൈവത്തിന് തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ അത് നശിപ്പിക്കാനായി സമർപ്പിക്കപ്പെട്ടതിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: എല്ലാം
  rationale: ഏകവചനസമൂഹാർത്ഥമുള്ള חֵרֶם എന്ന പദം സൂചിപ്പിക്കുന്ന വിഭാഗത്തിന്റെ സമഗ്രത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: חֵרֶם
  choice: ദൈവത്തിനായി മാറ്റിവെക്കപ്പെട്ടത്
  rationale: സാധാരണ ഉപയോഗത്തിൽനിന്ന് പിൻവലിച്ച് ദൈവത്തിന് മാറ്റിവെച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ആരാധനാ-നിയമപദത്തിന്റെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു; ഈ വാക്യം തന്നെ നാശത്തെ വ്യക്തമാക്കാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: בְ സൂചിപ്പിക്കുന്ന സ്ഥലം/പരിധി നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: לְךָ
  choice: നിനക്കുള്ളത്
  rationale: അഹരോനോടുള്ള ഉടമസ്ഥാവകാശപരമായ നിയമനം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരിക്കും
  rationale: היה എന്ന ക്രിയയുടെ അപൂർണരൂപം ഇവിടെ ഭാവിയിലെ നിയമപരമായ അവകാശനിർണയം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: חֵרֶם എന്ന സാങ്കേതിക ആരാധനാ-നിയമപദത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിനായി മാറ്റിവെക്കപ്പെട്ടത്
  alternative: ഇസ്രായേലിൽ നിരോധനത്തിന് വിധേയമാക്കിയതെല്ലാം / നാശത്തിനായി സമർപ്പിക്കപ്പെട്ടത്
  rationale: חֵרֶם ദൈവത്തിന് തിരിച്ചെടുക്കാനാവാത്തവിധം സമർപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ചില സന്ദർഭങ്ങളിൽ അതിൽ നശിപ്പിക്കൽ ഉൾപ്പെടുന്നു. ഈ വാക്യം നാശം വ്യക്തമാക്കാത്തതിനാൽ വിശാലമായ അർത്ഥം മുഖ്യപാഠത്തിലും ശക്തമായ സാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. അഭിസംബോധന ഏകവചനമായതിനാൽ ‘നിനക്ക്’ നിലനിർത്തി; സാങ്കേതിക പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
