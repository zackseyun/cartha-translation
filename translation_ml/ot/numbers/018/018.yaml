  terminology: ‘മാംസം,’ ‘നീരാജനാർപ്പണം,’ ‘നെഞ്ച്,’ and ‘വലത്തെ തുട’ suitably convey the sacrificial terms. The lexical footnote should not offer the unnatural and misleading alternative ‘ശരീരമാംസം’; ‘അവയുടെ മാംസം’ is sufficient as the literal wording, with the sacrificial sense explained.
  issues:
