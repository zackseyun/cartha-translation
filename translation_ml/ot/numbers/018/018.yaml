source:
  edition: WLC
  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: ml
  text: എന്നാൽ, നീരാജനാർപ്പണത്തിന്റെ നെഞ്ചും വലത്തെ തുടയും നിനക്കുള്ളതുപോലെ, അവയുടെ മാംസവും നിനക്കുള്ളതായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘അവയുടെ മാംസം.’ ഇവിടെ അത് യാഗത്തിൽ ഭക്ഷിക്കാവുന്ന വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: എന്നാൽ അവയുടെ മാംസം
  rationale: בָּשָׂר എന്നത് അക്ഷരാർഥത്തിൽ ശരീരമാംസത്തെയും യാഗസന്ദർഭത്തിൽ ഭക്ഷിക്കാവുന്ന മാംസവിഹിതത്തെയും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മാംസം’ ഇരു ഭാവങ്ങളും സ്വാഭാവികമായി വഹിക്കുന്നു. മുൻവാക്യത്തിലെ രക്തവും മേദസ്സും സംബന്ധിച്ച വ്യത്യാസം വ്യക്തമാക്കാൻ וּ־യെ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: יִהְיֶה לָּךְ
  choice: നിനക്കുള്ളതായിരിക്കും
  rationale: היה + ל എന്ന എബ്രായ ഉടമസ്ഥാവകാശ പ്രയോഗം പുരോഹിതനു നിയമപരമായി അനുവദിച്ച വിഹിതം എന്ന ആശയത്തോടെ വിവർത്തനം ചെയ്തു.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: നീരാജനാർപ്പണത്തിന്റെ നെഞ്ച്
  rationale: חָזֶה ‘നെഞ്ച്’ എന്നും תְּנוּפָה യഹോവയുടെ സന്നിധിയിൽ അനുഷ്ഠാനപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന വഴിപാടെന്നും സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-ആരാധനാ പ്രയോഗത്തിൽ പരിചിതമായ ‘നീരാജനാർപ്പണം’ നിലനിർത്തി; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: വലതു തുടയും
  rationale: שׁוֹק ഇവിടെ യാഗമൃഗത്തിന്റെ കാൽഭാഗം, പ്രത്യേകിച്ച് തുടവിഹിതം, സൂചിപ്പിക്കുന്നു; הַיָּמִין ‘വലത്’ എന്നാണ്.
- source_word: לְךָ יִהְיֶה
  choice: നിനക്കുള്ളതായിരിക്കുന്നതുപോലെതന്നെ
  rationale: വാക്യാവസാനത്തെ ആവർത്തിച്ച ഉടമസ്ഥാവകാശസൂത്രം ഒഴിവാക്കാതെ, താരതമ്യഘടനയോട് ചേർന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയങ്ങളിലെ വ്യാകരണവ്യത്യാസം
  choice: രണ്ടിടത്തും അഹരോനോടുള്ള ഏകവചന അഭിസംബോധനയായി ‘നിനക്ക്’ ഉപയോഗിച്ചു.
  alternative: ‘നിങ്ങൾ പുരോഹിതന്മാർക്ക്’ എന്നു ബഹുവചനമായി വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ‘അഹരോനായ നിനക്ക്’ എന്നു പേര് ചേർക്കുക.
  rationale: മസോററ്റിക് പാഠത്തിൽ ആദ്യരൂപം സ്ത്രീലിംഗവും രണ്ടാമത്തേത് പുല്ലിംഗവുമായ വ്യത്യാസം കാണിച്ചാലും സന്ദർഭത്തിലെ നിയമപരമായ അവകാശം അഹരോനെയും അവന്റെ പുരോഹിതഭവനത്തെയും കേന്ദ്രീകരിക്കുന്നു. പേര് അല്ലെങ്കിൽ ബഹുവചനം ചേർക്കാതെ പാഠത്തിന്റെ അസാധാരണത അനാവശ്യമായി പരിഹരിക്കാതിരിക്കുന്നു.
- issue: תְּנוּפָה എന്ന അനുഷ്ഠാനപദത്തിന്റെ അവതരണം
  choice: പ്രധാനപാഠത്തിൽ ‘നീരാജനാർപ്പണം’ ഉപയോഗിച്ച് അനുഷ്ഠാനചലനം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘ചലിപ്പിച്ചുള്ള സമർപ്പണം’ അല്ലെങ്കിൽ ‘സമർപ്പണയാഗം’ എന്നു പ്രധാനപാഠത്തിൽ നൽകുക.
  rationale: പരിചിതമായ യാഗപരിഭാഷ നിലനിർത്തിക്കൊണ്ട് അതിന് ഒരു പ്രത്യേക ആചാരസങ്കേതത്തിന്റെ അർഥം മാത്രമേയുള്ളൂ എന്നു അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; മറ്റു മതാചാരങ്ങളിലെ അധിക ആശയങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. നിയമപരമായ വിഹിതബോധവും എബ്രായത്തിലെ ആവർത്തനവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
