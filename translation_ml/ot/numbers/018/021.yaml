  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാർക്ക്, ഇതാ, ഇസ്രായേലിലെ സകല ദശാംശവും[a] ഞാൻ അവകാശമായി നൽകിയിരിക്കുന്നു; അവർ ചെയ്യുന്ന സമാഗമകൂടാരത്തിലെ സേവനത്തിനു പകരമായിട്ടാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിലെ ഓരോ ദശാംശവും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരുടെ സേവനത്തിനു പ്രതിഫലമായി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ലേവ്യർ തങ്ങൾക്കു നിശ്ചയിക്കപ്പെട്ട ചുമതലകൾ നിർവഹിച്ചിരുന്ന സമാഗമകൂടാരം.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർക്കാകട്ടെ
  rationale: ഹീബ്രായയിലെ വംശാവലിപരമായ പ്രയോഗം നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ וְ־യുടെ തുടർച്ചയും ലഘുവായ വ്യത്യാസസൂചനയും ‘ആകട്ടെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: പ്രഖ്യാപനത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രായ ഊന്നൽ മലയാളത്തിൽ ചുരുക്കമായും മാന്യമായും നിലനിർത്തുന്നു.
- source_word: נָתַתִּי
  choice: ഞാൻ ... നൽകിയിരിക്കുന്നു
  rationale: ദൈവം ഉറപ്പിച്ചു നൽകിയ, ഇപ്പോഴും പ്രാബല്യത്തിലുള്ള വിഹിതം എന്ന സന്ദർഭാർഥം പൂർത്തവർത്തമാനരൂപം വ്യക്തമാക്കുന്നു.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ സകല ദശാംശവും
  rationale: מַעֲשֵׂר എന്നത് പത്തിലൊന്ന് എന്ന മതനിയമപരമായ വിഹിതമായ ‘ദശാംശം’ സൂചിപ്പിക്കുന്നു; כָּל ഇവിടെ അതിന്റെ സമഗ്രത അറിയിക്കുന്നു.
- source_word: לְנַחֲלָה
  choice: അവകാശമായി
  rationale: നിശ്ചയിച്ചു നൽകപ്പെട്ട പാരമ്പര്യവിഹിതം അഥവാ കൈവശാവകാശം എന്ന നിയമപരമായ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: חֵלֶף
  choice: പ്രതിഫലമായിട്ട്
  rationale: സേവനത്തിനു പകരം ലഭിക്കുന്ന വിഹിതം എന്ന കൈമാറ്റ/പരിഹാരാർഥം നൽകുന്നു; അതിനെ വെറും വേതനമായി ചുരുക്കുന്നില്ല.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: അവർ ചെയ്യുന്ന സേവനം
  rationale: സ്രോതസ്സിലെ ‘സേവനം/സേവിക്കുക’ എന്ന ആവർത്തനത്തിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ സേവനം
  rationale: ലേവ്യർ നിർവഹിച്ചിരുന്ന ആരാധനാസംബന്ധമായ ചുമതലകളെ സൂചിപ്പിക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സഭാപദാവലി ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: ലേവ്യരുടെ സേവനവും ദശാംശവും തമ്മിലുള്ള ബന്ധം
  choice: ദശാംശം അവകാശമായും അവരുടെ സേവനത്തിനുള്ള പ്രതിഫലമായും നൽകിയതായി വിവർത്തനം ചെയ്തു.
  alternative: ദശാംശം സേവനവുമായി ബന്ധമില്ലാതെ ലേവ്യർക്കു നൽകിയ വിഹിതമെന്നോ, ഭൂമിയവകാശത്തിനു പകരമുള്ളത് മാത്രമെന്നോ അവതരിപ്പിക്കുക.
  rationale: വാക്യം לְנַחֲלָה (‘അവകാശമായി’) എന്നും חֵלֶף עֲבֹדָתָם (‘അവരുടെ സേവനത്തിനു പകരമായി/പ്രതിഫലമായി’) എന്നും വ്യക്തമായി ചേർക്കുന്നു. അതിനാൽ രണ്ടു ആശയങ്ങളും ഒന്നിനെ മറ്റൊന്നിൽ ലയിപ്പിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ലേവിയുടെ പുത്രന്മാർ’, ‘ഇതാ’, ‘അവകാശം’ എന്നിവ മൂലപാഠത്തിന്റെ ഔപചാരിക സ്വഭാവം നിലനിർത്തുന്നു; ‘ശുശ്രൂഷ’ എന്ന പദത്തിനു പകരം ‘സേവനം’ ഉപയോഗിച്ച് പിന്നീടുള്ള സഭാപരമായ പ്രത്യേകാർഥങ്ങൾ ഒഴിവാക്കി. ദീർഘമായ ഹീബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; രണ്ടാം വാക്യത്തിലെ ‘അതു നൽകിയിരിക്കുന്നത്’ അർഥബന്ധം വ്യക്തമാക്കാൻ ചേർത്തതാണ്. ഇംഗ്ലീഷ് കരടിലെ [a] അടയാളം ആശയപരമായി ‘ദശാംശം’ എന്ന പദത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അതിനാൽ മലയാളത്തിൽ അവിടെ സ്ഥാപിച്ചു.
