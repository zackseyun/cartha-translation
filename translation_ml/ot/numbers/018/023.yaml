id: NUM.18.23
reference: Numbers 18:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: ml
  text: എന്നാൽ ലേവ്യൻ തന്നേ സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ നിർവഹിക്കണം; അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കണം.[a] ഇത് നിങ്ങളുടെ തലമുറകളിലുടനീളം എന്നേക്കുമുള്ള ചട്ടമാണ്. ഇസ്രായേൽമക്കളുടെ ഇടയിൽ അവർക്ക് ഒരു അവകാശഭൂമിയും അവകാശമായി ലഭിക്കുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ കുറ്റം വഹിക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗത്തിന് കുറ്റം, അകൃത്യം, അല്ലെങ്കിൽ അതിനോടു ബന്ധപ്പെട്ട ഉത്തരവാദിത്വവും പരിണതഫലങ്ങളും വഹിക്കുക എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവർ ഒരു അവകാശം അവകാശമായി പ്രാപിക്കുകയില്ല.’ ഒരേ മൂലത്തിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്നുള്ള എബ്രായ ആവർത്തനം, ഗോത്രപരമായ അവകാശഭൂമി അവർക്കില്ലെന്നത് ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: ശുശ്രൂഷ നിർവഹിക്കേണ്ടത്
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ ക്രിയയുടെ നിർദേശാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַלֵּוִי הוּא
  choice: ലേവ്യൻ തന്നെയാണ്
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന ഊന്നൽ ‘തന്നെയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; അനാവശ്യമായ ഏകാധികാരാർഥം ചേർക്കുന്നില്ല.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ
  rationale: עֲבֹדָה ഇവിടെ വിശുദ്ധകാര്യങ്ങളോടു ബന്ധപ്പെട്ട സേവനമാണ്; ‘ശുശ്രൂഷ’ അതിന്റെ ആരാധനാപരമായ സ്വഭാവവും വായനാസൗകര്യവും നിലനിർത്തുന്നു.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കണം
  rationale: കുറ്റം, അകൃത്യം, അതിന്റെ ഉത്തരവാദിത്വം അല്ലെങ്കിൽ പരിണതഫലം എന്നിവ ഉൾക്കൊള്ളാവുന്ന എബ്രായ നിയമ-ആരാധനാ പ്രയോഗത്തിന്റെ ഉദ്ദേശപൂർവമായ വിശാലത നിലനിർത്തുന്നു.
- source_word: חֻקַּת עוֹלָם
  choice: എന്നേക്കുമുള്ള ചട്ടം
  rationale: നിയമത്തിന്റെ തലമുറകളിലൂടെയുള്ള നിലനിൽപ്പ് ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְדֹרֹתֵיכֶם
  choice: നിങ്ങളുടെ തലമുറകളിലുടനീളം
  rationale: തുടർന്നുവരുന്ന തലമുറകളെല്ലാം ഉൾപ്പെടുന്ന കാലവ്യാപ്തി കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടപ്രയോഗം മലയാളത്തിലെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: അവർക്ക് അവകാശഭൂമി ലഭിക്കരുത്
  rationale: ക്രിയ-നാമ cognate ആവർത്തനം മലയാളത്തിൽ അതേപടി നൽകിയാൽ കൃത്രിമമാകും; സന്ദർഭത്തിൽ നിഷേധിക്കപ്പെടുന്നത് ഗോത്രപരമായ ഭൂവിഹിതമാണെന്ന് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യർ ‘തങ്ങളുടെ അകൃത്യം വഹിക്കുന്നു’ എന്ന നിയമ-ആരാധനാ പ്രയോഗം
  choice: അവർ തങ്ങളുടെ അകൃത്യം വഹിക്കണം
  alternative: അവർ തങ്ങളുടെ കുറ്റം വഹിക്കണം; അവർ തങ്ങളുടെ പാപത്തിന്റെ പരിണതഫലം അനുഭവിക്കണം
  rationale: ഈ പ്രയോഗം കുറ്റബോധം, ഉത്തരവാദിത്വം, ശിക്ഷാപരമായ പരിണതഫലം എന്നിവയിൽ ഏതിനാണ് പ്രത്യേക ഊന്നൽ നൽകുന്നതെന്ന് വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കാതെ ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശാലതയും സംരക്ഷിക്കുന്നു.
- issue: ലേവ്യർക്ക് ഇസ്രായേലിൽ נחלה ഇല്ലെന്ന പ്രസ്താവന
  choice: അവർക്ക് അവകാശഭൂമി ലഭിക്കരുത്
  alternative: അവർ ഒരു അവകാശവും അവകാശമാക്കരുത്
  rationale: അടുത്തുള്ള നിയമസന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽ ഗോത്രങ്ങൾക്കിടയിലെ ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നു; അതുകൊണ്ട് ആത്മീയമോ രക്ഷാസംബന്ധമോ ആയ എല്ലാ ‘അവകാശവും’ നിഷേധിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാ ശൈലി. ‘സമാഗമകൂടാരം’, ‘ലേവ്യൻ’, ‘ഇസ്രായേൽമക്കൾ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
