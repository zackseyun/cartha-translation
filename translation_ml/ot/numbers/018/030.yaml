source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: ml
  text: 'നീ അവരോടു പറയണം: ‘നിങ്ങൾ അതിൽനിന്ന് അതിന്റെ ഏറ്റവും നല്ല ഭാഗം[a] ഉയർത്തി അർപ്പിക്കുമ്പോൾ, അത് ലേവ്യർക്കു മെതിക്കളത്തിലെ വിളവായും വീഞ്ഞുചക്കയിലെ വിളവായും കണക്കാക്കപ്പെടും.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ ‘അതിന്റെ കൊഴുപ്പ്’; ഇവിടെ ഈ പ്രയോഗം വിളവിന്റെ ഏറ്റവും സമൃദ്ധമായ അഥവാ ഏറ്റവും നല്ല വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: നീ അവരോടു പറയണം
  rationale: മോശെയോടുള്ള ഏകവചന നിർദേശം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: בַּהֲרִימְכֶם
  choice: നിങ്ങൾ ... നീക്കിവെക്കുമ്പോൾ
  rationale: റൂം എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം വഴിപാടായി ഉയർത്തുകയോ വേർതിരിച്ചെടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഉൽപ്പന്നത്തിൽനിന്നുള്ള സമർപ്പിത വിഹിതം എന്ന സന്ദർഭത്തിൽ ‘നീക്കിവെക്കുക’ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: חֶלְבּוֹ
  choice: അതിന്റെ ഏറ്റവും നല്ല ഭാഗം
  rationale: പദശഃ ‘അതിന്റെ കൊഴുപ്പ്’ എന്നാണെങ്കിലും, ഇവിടെ മൃഗക്കൊഴുപ്പല്ല, വിളവിന്റെ ഏറ്റവും സമൃദ്ധമായ അഥവാ ശ്രേഷ്ഠമായ വിഹിതമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: മികച്ച വിഹിതം ഏതിനുള്ളിൽനിന്ന് വേർതിരിക്കുന്നുവോ ആ ദശാംശവിഹിതത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: וְנֶחְשַׁב
  choice: കണക്കാക്കപ്പെടും
  rationale: ഹീബ്രു നിഷ്ക്രിയരൂപത്തിന്റെ കണക്കെടുപ്പ്-നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: ആ സമർപ്പണം ലേവ്യരുടെ കാര്യത്തിൽ എങ്ങനെ കണക്കാക്കപ്പെടുന്നു എന്ന ദാതൃബന്ധം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: മെതിക്കളത്തിലെ വിളവായി
  rationale: ധാന്യം മെതിക്കുന്ന കളത്തിന്റെ കാർഷികചിത്രവും תבואה എന്ന പദത്തിന്റെ ‘വിളവ്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: മുന്തിരിച്ചക്കിലെ വിളവായും
  rationale: יֶקֶב എന്നത് മുന്തിരി ചതച്ച് നീരെടുക്കുന്ന ചക്കിനെയോ അതിനോടനുബന്ധിച്ച സംഭരണിയെയോ സൂചിപ്പിക്കുന്നു; സമാന്തര കാർഷികപ്രയോഗം നിലനിർത്തുന്നു.
