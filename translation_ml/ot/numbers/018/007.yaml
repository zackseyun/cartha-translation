revisions:
- from: എന്നാൽ നീയും നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാരും യാഗപീഠവുമായി ബന്ധപ്പെട്ട സകല കാര്യങ്ങളിലും തിരശ്ശീലയ്ക്ക് അകത്തുള്ള കാര്യങ്ങളിലും നിങ്ങളുടെ പൗരോഹിത്യച്ചുമതല കാത്തുസൂക്ഷിച്ച് ശുശ്രൂഷിക്കണം. നിങ്ങളുടെ പൗരോഹിത്യം ഞാൻ ഒരു ദാനമായ ശുശ്രൂഷയായി നിങ്ങൾക്കു നൽകുന്നു.[a] എന്നാൽ അധികാരമില്ലാതെ അടുത്തുവരുന്നവൻ[b] മരണശിക്ഷ അനുഭവിക്കണം.
  to: എന്നാൽ നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും യാഗപീഠവുമായി ബന്ധപ്പെട്ട സകല കാര്യങ്ങളിലും തിരശ്ശീലയ്ക്ക് അകത്തുള്ള കാര്യങ്ങളിലും നിങ്ങളുടെ പൗരോഹിത്യം കാത്തുസൂക്ഷിക്കണം; നിങ്ങൾ ശുശ്രൂഷ ചെയ്യണം. നിങ്ങളുടെ പൗരോഹിത്യം ഞാൻ ഒരു ദാനമായ ശുശ്രൂഷയായി നിങ്ങൾക്കു നൽകുന്നു.[a] എന്നാൽ അധികാരമില്ലാത്തവൻ അടുത്തുവന്നാൽ വധിക്കപ്പെടണം.[b]
  rationale: The revision restores the repeated rendering of כְּהֻנַּתְכֶם as “പൗരോഹിത്യം,” makes the two coordinated commands explicit, and uses a direct judicial passive for יוּמָת. The compact ambiguity of עֲבֹדַת מַתָּנָה remains represented in the text and explained in its footnote. Footnote anchors are retained with the phrases they explain.
  reviewer_model: gpt-5.6-terra
