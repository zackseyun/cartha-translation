  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: ml
  text: എന്നാൽ നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും യാഗപീഠവുമായി ബന്ധപ്പെട്ട സകല കാര്യങ്ങളിലും തിരശ്ശീലയ്ക്ക് അകത്തുള്ള കാര്യങ്ങളിലും നിങ്ങളുടെ പൗരോഹിത്യം കാത്തുസൂക്ഷിക്കണം; നിങ്ങൾ ശുശ്രൂഷ ചെയ്യണം. നിങ്ങളുടെ പൗരോഹിത്യം ഞാൻ ഒരു ദാനമായ ശുശ്രൂഷയായി നിങ്ങൾക്കു നൽകുന്നു.[a] എന്നാൽ അധികാരമില്ലാത്തവൻ അടുത്തുവന്നാൽ വധിക്കപ്പെടണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ശുശ്രൂഷയ്ക്കുള്ള ദാനമായി നിങ്ങളുടെ പൗരോഹിത്യം ഞാൻ നിങ്ങൾക്കു നൽകുന്നു.” ഹീബ്രു പദസമുച്ചയം, ശുശ്രൂഷ ദാനമാണെന്നോ പൗരോഹിത്യം ശുശ്രൂഷയ്ക്കായി നൽകിയ ദാനമാണെന്നോ ഊന്നാം.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത് വിദേശിയെയല്ല; പൗരോഹിത്യച്ചുമതല നിർവഹിക്കാൻ അധികാരമില്ലാത്ത ഏതു വ്യക്തിയെയുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: കാത്തുസൂക്ഷിച്ച്
  rationale: പൗരോഹിത്യച്ചുമതല ജാഗ്രതയോടെ പാലിക്കുകയും സംരക്ഷിക്കുകയും ചെയ്യുക എന്ന שׁמר എന്ന ക്രിയയുടെ അർഥബലം നിലനിർത്തുന്നു.
- source_word: כְּהֻנַּתְכֶם
  choice: നിങ്ങളുടെ പൗരോഹിത്യച്ചുമതല
  rationale: പദം പൗരോഹിത്യപദവിയെയും അതോടു ബന്ധപ്പെട്ട ഉത്തരവാദിത്വത്തെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ കാവൽഭാവം വ്യക്തമാക്കാൻ ‘ച്ചുമതല’ ചേർത്തു.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: യാഗപീഠവുമായി ബന്ധപ്പെട്ട സകല കാര്യങ്ങളിലും
  rationale: דבר ഇവിടെ യാഗപീഠസംബന്ധമായ കാര്യങ്ങളുടെ മുഴുവൻ വ്യാപ്തിയെയും സൂചിപ്പിക്കുന്നു; പ്രത്യേക ആചാരങ്ങളായി അതിനെ ചുരുക്കുന്നില്ല.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: തിരശ്ശീലയ്ക്ക് അകത്തുള്ള കാര്യങ്ങളിലും
  rationale: വിശുദ്ധമന്ദിരത്തിലെ തിരശ്ശീലയുടെ അകവശത്തുള്ള മേഖലയെയും അവിടത്തെ ചുമതലകളെയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲבַדְתֶּם
  choice: ശുശ്രൂഷിക്കണം
  rationale: ആരാധനാസംബന്ധമായ സേവനം എന്ന עבד-യുടെ അർഥം നൽകുന്നു; പിന്നീടുള്ള עֲבֹדָה-യുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: עֲבֹדַת מַתָּנָה
  choice: ഒരു ദാനമായ ശുശ്രൂഷയായി
  rationale: ഹീബ്രു പദസമുച്ചയം ചുരുക്കമുള്ളതും വ്യാകരണപരമായി ഒന്നിലധികം ഊന്നലുകൾ അനുവദിക്കുന്നതുമാണ്; ശുശ്രൂഷ ദൈവം നൽകിയ ദാനമാണെന്ന വായന പ്രധാനവാക്യത്തിൽ നൽകുന്നു.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: നിങ്ങളുടെ പൗരോഹിത്യം ഞാൻ ... നിങ്ങൾക്കു നൽകുന്നു
  rationale: ദൈവം പൗരോഹിത്യം അനുവദിച്ചുനൽകുന്നു എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: הַזָּר
  choice: അധികാരമില്ലാതെ ... വരുന്നവൻ
  rationale: ഇവിടെ വംശീയമായി ‘വിദേശി’ എന്നല്ല, പൗരോഹിത്യശുശ്രൂഷയ്ക്ക് അനുമതിയില്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַקָּרֵב
  choice: അടുത്തുവരുന്നവൻ
  rationale: വിശുദ്ധമേഖലയെയോ നിയന്ത്രിത ശുശ്രൂഷയെയോ സമീപിക്കുക എന്ന ഭൗതികവും ആരാധനാസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: יוּמָת
  choice: മരണശിക്ഷ അനുഭവിക്കണം
  rationale: ഹോഫാൽ രൂപത്തിന്റെ കാരണിത-കർമണി നിയമബലം വ്യക്തമാക്കുന്നു; വെറും ‘മരിക്കും’ എന്ന പ്രവചനമായി പരിഭാഷപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: പുരോഹിതനിയമത്തിലെ זָר എന്ന പദത്തിന്റെ അർഥം
  choice: അധികാരമില്ലാതെ അടുത്തുവരുന്നവൻ
  alternative: അന്യൻ; പുറത്തുള്ളവൻ; സാധാരണക്കാരൻ
  rationale: പുരോഹിതവൃന്ദത്തിനു പുറത്തുള്ളവനെന്നതിലുപരി നിയന്ത്രിതമായ വിശുദ്ധശുശ്രൂഷയിലേക്കു അനുമതിയില്ലാതെ കടന്നുവരുന്നവനെയാണ് സന്ദർഭം ലക്ഷ്യമിടുന്നത്; വംശീയമായ വിദേശിത്വം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: עֲבֹדַת מַתָּנָה എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: പൗരോഹിത്യം ദാനമായ ശുശ്രൂഷയായി നൽകപ്പെടുന്നു
  alternative: ശുശ്രൂഷ തന്നെയാണ് ദാനം; ശുശ്രൂഷയ്ക്കായി പൗരോഹിത്യം ദാനമായി നൽകപ്പെടുന്നു
  rationale: ഹീബ്രുവിലെ യഥാർഥ സംക്ഷിപ്തതയും ദാനം-ശുശ്രൂഷ ബന്ധത്തിലെ അർഥസാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തി, പൗരോഹിത്യം സ്വയം ഏറ്റെടുക്കുന്നതല്ല, ദൈവം നൽകുന്നതാണ് എന്ന വാക്യത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്ന മലയാളം. നിയമപരവും ആരാധനാസംബന്ധവുമായ ഭാവം നിലനിർത്തിയിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ‘പൗരോഹിത്യം’, ‘യാഗപീഠം’, ‘തിരശ്ശീല’, ‘ശുശ്രൂഷ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഹീബ്രുവിലെ ദാനം-ശുശ്രൂഷ ബന്ധത്തിന്റെ യഥാർഥ ആശയദ്വന്ദ്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
