id: NUM.18.11
reference: Numbers 18:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: ml
  text: 'ഇതും നിനക്കുള്ളതാണ്: ഇസ്രായേൽമക്കളുടെ എല്ലാ അലയ്‌പ്പണിവഴിപാടുകളോടുകൂടിയ അവരുടെ ദാനങ്ങളുടെ വിശുദ്ധവിഹിതം. അവയെ നിനക്കും നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാർക്കും പുത്രിമാർക്കും സ്ഥിരമായ ഒരു ചട്ടമായി ഞാൻ നൽകിയിരിക്കുന്നു. നിന്റെ കുടുംബത്തിലെ ശുദ്ധിയുള്ള ഏവർക്കും അത് ഭക്ഷിക്കാം.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഇവിടെ ‘ശുദ്ധിയുള്ള’ എന്നത് ശരീരശുചിത്വത്തെയോ ധാർമികനിർമലതയെയോ അല്ല, ആചാരപരമായ ശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: അവരുടെ ദാനങ്ങളുടെ വിശുദ്ധവിഹിതം
  rationale: תְּרוּמָה വിശുദ്ധാവശ്യത്തിനായി വേർതിരിച്ച വിഹിതത്തെയും מַתָּנָה ദാനത്തെയും സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധവിഹിതം’ സാങ്കേതിക ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബന്ധകഘടനയിലെ ‘അവരുടെ’ എന്ന ബഹുവചനസർവനാമവും നിലനിർത്തുന്നു.
- source_word: תְּנוּפֹת
  choice: ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന വഴിപാടുകൾ
  rationale: ദൈവസന്നിധിയിൽ ആചാരപരമായി ചലിപ്പിച്ചു സമർപ്പിക്കുന്ന വഴിപാടിനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. അപരിചിതമായ ഒരു സാങ്കേതികപദം മാത്രം ഉപയോഗിക്കുന്നതിനുപകരം ആ ക്രിയാത്മക അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ പരമ്പരാഗത കൂട്ടായ പ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ സംജ്ഞയാണ്.
- source_word: נְתַתִּים
  choice: അവയെ ... ഞാൻ നൽകിയിരിക്കുന്നു
  rationale: പറഞ്ഞിരിക്കുന്ന വിശുദ്ധവിഹിതങ്ങളെയും വഴിപാടുകളെയും സൂചിപ്പിക്കുന്ന ബഹുവചനകർമപ്രത്യയം നിലനിർത്തുന്നു; പൂർത്തിയായ ദാനത്തിന് ഇപ്പോഴും പ്രാബല്യമുണ്ടെന്ന ഭാവം ‘നൽകിയിരിക്കുന്നു’ നൽകുന്നു.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാർക്കും പുത്രിമാർക്കും
  rationale: മൂലപാഠം പുത്രന്മാരെയും പുത്രിമാരെയും പ്രത്യേകം പറയുന്നതിനാൽ രണ്ടും നിലനിർത്തുന്നു; ‘നിന്നോടുകൂടെയുള്ള’ എന്നത് അഹരോന്റെ കുടുംബവലയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְחָק עוֹלָם
  choice: എന്നേക്കുമുള്ള ഒരു ചട്ടമായി
  rationale: חֹק നിശ്ചിതമായ ചട്ടത്തെയോ അവകാശത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ നിയമപരമായ ദാനക്രമമാണ്. עוֹלָם നൽകുന്ന തുടരുന്ന പ്രാബല്യം ‘എന്നേക്കുമുള്ള’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: നിന്റെ കുടുംബത്തിൽ ശുദ്ധിയുള്ള ഏവനും
  rationale: בַּיִת ഇവിടെ കെട്ടിടത്തേക്കാൾ കുടുംബവലയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. טָהוֹר എന്നത് പുരോഹിതനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ ആചാരപരമായ ശുദ്ധിയാണ്; പ്രധാനപാഠത്തിൽ ‘ശുദ്ധിയുള്ള’ എന്നു നൽകി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יֹאכַל אֹתוֹ
  choice: അത് ഭക്ഷിക്കാം
  rationale: ഇവിടത്തെ ക്രിയാരൂപം അനുവദിക്കപ്പെട്ട അവകാശം പ്രകടിപ്പിക്കുന്നു; ‘ഭക്ഷിക്കാം’ അത് സ്വാഭാവികമായി നൽകുന്നു. ഏകവചനകർമപ്രത്യയം ‘അത്’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആചാരപരമായ ശുദ്ധി
  choice: ‘ശുദ്ധിയുള്ള’ എന്നു പ്രധാനപാഠത്തിൽ നൽകി, അത് ആചാരപരമായ ശുദ്ധിയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ധാർമികമായി നിർമലനായവൻ എന്ന അർഥത്തിൽ വായിക്കുക.
  rationale: പുരോഹിതനിയമത്തിന്റെ ഈ സന്ദർഭം വിശുദ്ധവിഹിതം ഭക്ഷിക്കാനുള്ള യോഗ്യതയെ നിയന്ത്രിക്കുന്നു; അതിനാൽ טָהוֹר ധാർമികസ്വഭാവത്തെയല്ല, ആചാരപരമായ നിലയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പുരോഹിതാരാധനയിലെ സാങ്കേതിക പദങ്ങൾക്ക് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിവരണാത്മക രൂപങ്ങൾ ഉപയോഗിച്ചു; ഹീബ്രുവിലെ ഏകവചന-ബഹുവചന സൂചനകളും പുത്രന്മാർ/പുത്രിമാർ എന്ന വ്യക്തമായ പരാമർശവും നിലനിർത്തി.
