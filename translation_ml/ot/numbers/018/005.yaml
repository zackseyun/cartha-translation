source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: ml
  text: വിശുദ്ധസ്ഥലത്തിന്റെ കാവൽച്ചുമതലയും യാഗപീഠത്തിന്റെ കാവൽച്ചുമതലയും നിങ്ങൾ നിർവഹിക്കണം; അങ്ങനെ ഇസ്രായേൽപുത്രന്മാരുടെമേൽ[a] ഇനി ക്രോധം ഉണ്ടാകാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേല്യരുടെമേൽ.’ എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: കാവൽച്ചുമതല … നിങ്ങൾ നിർവഹിക്കണം
  rationale: שׁמר എന്ന ക്രിയയും מִשְׁמֶרֶת എന്ന നാമവും ചേർന്നുള്ള പൗരോഹിത്യസന്ദർഭത്തിലെ പ്രയോഗം കാവലും ഔദ്യോഗിക ഉത്തരവാദിത്വവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. ‘കാവൽച്ചുമതല നിർവഹിക്കുക’ എന്നത് ഈ രണ്ട് ആശയങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: യാഗപീഠത്തോടു ചേർന്നു വരുന്ന ഈ പൗരോഹിത്യസന്ദർഭത്തിൽ പദം അമൂർത്തമായ വിശുദ്ധിയെയല്ല, വിശുദ്ധമായ ആലയമേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തിനുള്ള നിലവാരമുള്ളതും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: അങ്ങനെ … ഇനി … ഉണ്ടാകാതിരിക്കട്ടെ
  rationale: വാവോടുകൂടിയ നിഷേധാത്മക അപൂർണക്രിയയും עוֹד-ഉം ഇവിടെ മുൻപറഞ്ഞ കാവൽച്ചുമതലയുടെ ലക്ഷ്യം/ഫലം സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ബന്ധം വ്യക്തമാക്കുന്നു; ‘ഇനി’ עוֹד-ന്റെ അർഥം നൽകുന്നു.
- source_word: קֶצֶף
  choice: ക്രോധം
  rationale: ന്യായവിധിയുമായി ബന്ധപ്പെട്ട ശക്തമായ കോപത്തെ സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ ക്രോധമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നുവെങ്കിലും, എബ്രായത്തിൽ ദൈവത്തെ ഇവിടെ തുറന്നു പറയാത്തതിനാൽ മലയാളത്തിലും കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന വംശസമൂഹപ്രയോഗത്തെ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; കൂടുതൽ പ്രചാരമുള്ള സമുദായനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യം കേവലമായ ഭാവിപ്രവചനമാണോ, അതോ കാവൽച്ചുമതലയുമായി ബന്ധപ്പെട്ട ലക്ഷ്യം/ഫലമാണോ
  choice: കാവൽച്ചുമതല ശരിയായി നിർവഹിക്കുന്നതിന്റെ ലക്ഷ്യം/ഫലമായി ഇസ്രായേലിന്മേൽ ഇനി ക്രോധം ഉണ്ടാകാതിരിക്കുക
  alternative: ‘ഇനി ക്രോധം ഉണ്ടാകുകയില്ല’ എന്ന കേവല ഭാവിപ്രവചനം
  rationale: അനധികൃതമായി വിശുദ്ധസ്ഥലത്തോട് അടുക്കുന്നതുമൂലമുള്ള ന്യായവിധി ഒഴിവാക്കാൻ പൗരോഹിത്യ-ലേവ്യ ചുമതലകൾ ക്രമീകരിക്കുന്നതാണ് സമീപസന്ദർഭം. അതിനാൽ ‘അങ്ങനെ’ എന്ന ബന്ധകം പ്രവർത്തനപരമായ ലക്ഷ്യം/ഫലം സൂചിപ്പിക്കുന്നു; എങ്കിലും ഉറവിടത്തിലെ ബന്ധത്തെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- issue: ക്രോധത്തിന്റെ ഉറവിടം
  choice: ‘ക്രോധം’ എന്ന് മാത്രം പറഞ്ഞ് ദൈവിക ഉറവിടം സന്ദർഭത്തിൽ പരോക്ഷമായി നിലനിർത്തുക
  alternative: ‘ദൈവത്തിന്റെ ക്രോധം’ എന്ന് വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ ക്രോധം ദൈവികമാണെങ്കിലും ഈ ഉപവാക്യത്തിലെ എബ്രായപാഠം ‘ദൈവം’ എന്ന നാമം ചേർക്കുന്നില്ല; അതിനാൽ വിവർത്തനവും അതേ നിയന്ത്രണം പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ ആവർത്തനം നിലനിർത്താൻ ‘കാവൽച്ചുമതല’ രണ്ടിടത്തും ആവർത്തിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘ഇസ്രായേൽമക്കൾ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
