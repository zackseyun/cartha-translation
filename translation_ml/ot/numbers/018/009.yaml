id: NUM.18.9
reference: Numbers 18:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: ml
  text: അത്യന്തവിശുദ്ധമായ വസ്തുക്കളിൽനിന്ന്, അഗ്നിയിൽ അർപ്പിക്കുന്നതിൽനിന്നു വേർതിരിക്കപ്പെട്ട വിഹിതമായി, ഇവ നിനക്കുള്ളതായിരിക്കും:[a] അവരുടെ ഓരോ വഴിപാടും, ഓരോ ധാന്യയാഗവും, ഓരോ പാപയാഗവും[b], ഓരോ അപരാധയാഗവും[c]—അവർ എനിക്കു തിരികെ അർപ്പിക്കുന്നവ—നിനക്കും നിന്റെ പുത്രന്മാർക്കും അത്യന്തവിശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘അഗ്നിയിൽനിന്ന്.’ അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗങ്ങളിൽനിന്ന് വേർതിരിക്കപ്പെട്ട വിഹിതമാണ് ഇവിടെ ഉദ്ദേശിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘പാപയാഗം’ എന്നത് ‘ശുദ്ധീകരണയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അപരാധയാഗം’ എന്നത് ‘നഷ്ടപരിഹാരയാഗം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: അത്യന്തവിശുദ്ധമായവയിൽനിന്ന്
  rationale: ഇവിടെ ഈ പ്രയോഗം അതിവിശുദ്ധമായ യാഗവസ്തുക്കളുടെ വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വിശുദ്ധമന്ദിരത്തിലെ അകത്തെ മുറിയെയല്ല.
- source_word: מִן הָאֵשׁ
  choice: അഗ്നിയിൽനിന്നുള്ള ഈ ഭാഗം
  rationale: അക്ഷരാർഥം ‘അഗ്നിയിൽനിന്ന്’ എന്നാണ്. വാക്യഘടന സ്വാഭാവികമാക്കാൻ ‘ഈ ഭാഗം’ ചേർത്തെങ്കിലും, അഗ്നിയിൽ അർപ്പിക്കുന്നതിൽനിന്ന് പുരോഹിതനു ലഭിക്കുന്ന വിഹിതമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: קָרְבָּנָם
  choice: അവരുടെ എല്ലാ വഴിപാടുകളും
  rationale: ദൈവസന്നിധിയിൽ കൊണ്ടുവരുന്ന അർപ്പണത്തിനുള്ള പൊതുപദമാണ്; മലയാളത്തിൽ ‘വഴിപാട്’ സ്വാഭാവികവും വ്യാപകവുമാണ്.
- source_word: מִנְחָתָם
  choice: ധാന്യവഴിപാടുകളും
  rationale: പുരോഹിതനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ധാന്യത്തിൽനിന്നുള്ള വഴിപാടിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: חַטָּאתָם
  choice: പാപയാഗങ്ങളും
  rationale: യാഗപ്പട്ടികയിൽ ഇത് പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു; ശുദ്ധീകരണപരമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֲשָׁמָם
  choice: അകൃത്യയാഗങ്ങളും
  rationale: കുറ്റവും അതിനോടനുബന്ധിച്ച പരിഹാരവും ഉൾക്കൊള്ളുന്ന യാഗവിഭാഗം; നഷ്ടപരിഹാരയാഗം എന്ന വ്യത്യസ്ത വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: അവർ എനിക്കു തിരികെ അർപ്പിക്കുന്നവയെല്ലാം
  rationale: שוב എന്ന ക്രിയയുടെ ‘തിരികെ നൽകുക’ എന്ന ദൃശ്യബോധം സംരക്ഷിക്കുമ്പോൾ, യാഗം ദൈവത്തിന് അർപ്പിക്കുന്ന പ്രവൃത്തിയാണെന്നത് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: അത്യന്തവിശുദ്ധമായിരിക്കും
  rationale: യാഗവിഹിതത്തിന്റെ പരമവിശുദ്ധ പദവിയെ സൂചിപ്പിക്കുന്നു; സ്ഥലസൂചന ഒഴിവാക്കുന്നു.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: നിനക്കും നിന്റെ പുത്രന്മാർക്കും
  rationale: ആരോണിനെയും പുരോഹിതസ്ഥാനമുള്ള അവന്റെ ആൺമക്കളെയും കൃത്യമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: യാഗപരിശുദ്ധിയുടെ പദപ്രയോഗം വിശുദ്ധമന്ദിരത്തിലെ അകത്തെ മുറിയുമായി കലരാതിരിക്കുക
  choice: അത്യന്തവിശുദ്ധമായവ / അത്യന്തവിശുദ്ധം
  alternative: അതിവിശുദ്ധസ്ഥലം / വിശുദ്ധന്മാരിൽ വിശുദ്ധം
  rationale: സന്ദർഭം യാഗവസ്തുക്കളുടെ വിശുദ്ധിവർഗ്ഗത്തെക്കുറിച്ചാണ്, വിശുദ്ധമന്ദിരത്തിലെ പ്രത്യേക മുറിയെക്കുറിച്ചല്ല.
- issue: ആരോണിന്റെ സന്തതികളെ സംബന്ധിച്ച ലിംഗസൂചന
  choice: പുത്രന്മാർ
  alternative: മക്കൾ / സന്തതികൾ
  rationale: എബ്രായപാഠം വ്യക്തമായി ‘പുത്രന്മാർ’ എന്നു പറയുന്നു; പുരോഹിതശുശ്രൂഷയുടെ ഈ പശ്ചാത്തലത്തിൽ അത് പൊതുവായ ലിംഗനിരപേക്ഷ സൂചനയല്ല.
- issue: שוב എന്ന ക്രിയയുടെ അർഥവ്യാപ്തി
  choice: തിരികെ അർപ്പിക്കുക
  alternative: അർപ്പിക്കുക / തിരികെ നൽകുക
  rationale: ‘തിരികെ’ എന്ന മൂലദൃശ്യബോധവും യാഗാർപ്പണത്തിന്റെ സന്ദർഭവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; നഷ്ടപരിഹാരത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഗസാങ്കേതിക പദങ്ങൾ സ്ഥിരതയോടെ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ആവർത്തനം മലയാളത്തിൽ പട്ടികാരൂപത്തിൽ സ്വാഭാവികമാക്കി.
