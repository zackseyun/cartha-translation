id: NUM.18.24
reference: Numbers 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: ml
  text: യിസ്രായേൽമക്കൾ യഹോവയ്ക്ക് വഴിപാടായി ഉയർത്തുന്ന ദശാംശം ഞാൻ ലേവ്യർക്ക് അവകാശമായി കൊടുത്തിരിക്കുന്നു. അതുകൊണ്ടാണ്, ‘യിസ്രായേൽമക്കളുടെ ഇടയിൽ അവർക്ക് അവകാശം ലഭിക്കുകയില്ല’ എന്ന് ഞാൻ അവരോട് പറഞ്ഞത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: ദശാംശം
  rationale: വിളവിന്റെയോ വരുമാനത്തിന്റെയോ പത്തിലൊന്ന് എന്ന ആശയം കൃത്യമായും പതിവായ ബൈബിൾ പദപ്രയോഗത്തോടെയും അറിയിക്കുന്നു.
- source_word: יָרִימוּ
  choice: ഉയർത്തുന്ന
  rationale: רוּם എന്ന ക്രിയയുടെ രൂപകാത്മക ആരാധനാപരമായ ഭാവം സംരക്ഷിക്കുന്നു; പൊതുവായ ‘അർപ്പിക്കുന്ന’ എന്നതിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: תְּרוּמָה
  choice: വഴിപാടായി
  rationale: യഹോവയ്ക്കായി വേർതിരിച്ച് ഉയർത്തിക്കൊടുക്കുന്ന സംഭാവന/വഴിപാട് എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נַחֲלָה
  choice: അവകാശം
  rationale: പാരമ്പര്യമായി ലഭിക്കുന്ന ഭൂമിയോ വിഹിതമോ എന്ന ആശയം ഉൾക്കൊള്ളുന്നു; വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/ജനങ്ങൾ’ എന്ന പരമ്പരാഗത കൂട്ടായ അർത്ഥം സംക്ഷിപ്തവും മാന്യവുമായി നൽകുന്നു.
theological_decisions:
- issue: ലേവ്യരുടെ ‘അവകാശം’ എന്താണെന്ന ബന്ധം
  choice: യിസ്രായേലിന്റെ ദശാംശം തന്നെയാണ് ലേവ്യർക്ക് അവകാശമായി ദൈവം നൽകിയതെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കി.
  alternative: ലേവ്യർക്ക് ഭൂമിയവകാശമില്ലെന്നും ദശാംശം വെറും പ്രതിഫലമാണെന്നും വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കൽ.
  rationale: എബ്രായപാഠം ദശാംശത്തെ נַחֲלָה എന്നു നേരിട്ട് വിളിക്കുന്നു; ഭൂമിയവകാശവുമായി ഉള്ള വിപരീതബന്ധം സൂചിപ്പിക്കുമ്പോഴും അതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ יהוה എന്ന വ്യക്തിനാമത്തെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധം ‘അതുകൊണ്ടാണ്’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തി; നേരിട്ടുള്ള ഉദ്ധരണിയും ആവർത്തിക്കുന്ന ‘അവകാശം’ എന്ന പദവും സംരക്ഷിച്ചു.
