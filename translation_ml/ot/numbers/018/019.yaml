reference: Numbers 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: ml
  text: യിസ്രായേൽമക്കൾ യഹോവയ്ക്കു ഉയർത്തിക്കൊടുക്കുന്ന വിശുദ്ധവസ്തുക്കളിൽ നിന്നുള്ള എല്ലാ വഴിപാടുകളും ഞാൻ നിനക്കും നിന്നോടുകൂടെയുള്ള നിന്റെ പുത്രന്മാർക്കും പുത്രിമാർക്കും ശാശ്വതനിയമമായി നൽകിയിരിക്കുന്നു. അത് യഹോവയുടെ സന്നിധിയിൽ നിനക്കും നിന്നോടുകൂടെയുള്ള നിന്റെ സന്തതിക്കും വേണ്ടിയുള്ള ശാശ്വതമായ ഉപ്പിന്റെ ഉടമ്പടിയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉപ്പിന്റെ ഉടമ്പടി” എന്നത് സ്ഥിരവും ലംഘിക്കരുതാത്തതുമായ ഉടമ്പടിയെ സൂചിപ്പിക്കുന്ന പുരാതന പ്രയോഗമായിരിക്കാം; കാണുക ലേവ്യർ 2:13; 2 ദിനവൃത്താന്തം 13:5.
    reason: മൂലത്തിലെ “ഉടമ്പടി”യും “ഉപ്പ്” എന്ന സാംസ്കാരിക രൂപകവും നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സാധ്യതയുള്ള സൂചന വായനക്കാരന് വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: תְּרוּמֹת הַקֳּדָשִׁים
  choice: വിശുദ്ധവസ്തുക്കളിൽനിന്നുള്ള എല്ലാ വഴിപാടുകളും
  rationale: תְּרוּמָה എന്നത് ഉയർത്തി അർപ്പിക്കുന്ന സംഭാവനയെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്നു; הַקֳּדָשִׁים എന്ന ബഹുവചനം സമർപ്പിത വിശുദ്ധവസ്തുക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: יָרִימוּ
  choice: ഉയർത്തിക്കൊടുക്കുന്ന
  rationale: മൂലത്തിലെ ‘ഉയർത്തുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് അർപ്പണത്തിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חָק עוֹלָם
  choice: ശാശ്വതനിയമമായി
  rationale: സ്ഥിരമായി ബാധകമായ ചട്ടം/നിശ്ചയം എന്ന അർത്ഥം നൽകുന്നു; ‘നിയമം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: ശാശ്വതമായ ഉപ്പുടമ്പടി
  rationale: പുരാതന ഉടമ്പടിപ്രയോഗത്തിലെ ഉപ്പിന്റെ പ്രതീകം വിശദീകരിച്ച് മാറ്റാതെ മൂലരൂപം സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ രൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ഉപ്പുടമ്പടി’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപകം മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തി അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘ഒരിക്കലും ലംഘിക്കപ്പെടാത്ത ഉടമ്പടി’ എന്നു വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലത്തിലെ സാംസ്കാരിക രൂപകവും അതിലെ അർത്ഥവ്യാപ്തിയും ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: עוֹלָם എന്ന പദത്തിന്റെ കാലവ്യാപ്തി
  choice: ശാശ്വതമായ / ശാശ്വതനിയമം
  alternative: എന്നേക്കുമുള്ള / തലമുറകളോളം നിലനിൽക്കുന്ന
  rationale: ഇവിടെ സ്ഥിരതയും ദീർഘകാല സാധുതയും ഊന്നുന്ന പരമ്പരാഗതവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം തിരഞ്ഞെടുത്തു; ഉടമ്പടിയുടെ പരിധിയെ അധികമായി നിർവചിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. പുരോഹിതപരമായ സന്ദർഭത്തിലെ ‘വിശുദ്ധവസ്തുക്കൾ’, ‘വഴിപാടുകൾ’, ‘ഉടമ്പടി’ എന്നീ പദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ പുരാതന രൂപകം അടിക്കുറിപ്പിലൂടെ ചുരുക്കമായി വിശദീകരിച്ചു.
