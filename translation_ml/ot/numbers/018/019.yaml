  - severity: low
    issue: A few word boundaries are closed in the running text.
    rationale: Separating “വിശുദ്ധവസ്തുക്കളിൽ നിന്നുള്ള” and “സന്തതിക്കും വേണ്ടിയുള്ള” follows ordinary Malayalam typography and improves readability.
