  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: ml
  text: നിങ്ങളുടെ എല്ലാ ദാനങ്ങളിൽനിന്നും യഹോവയ്ക്കുള്ള എല്ലാ വഴിപാടും നിങ്ങൾ ഉയർത്തി അർപ്പിക്കണം; അവയുടെ ഏറ്റവും നല്ല ഭാഗത്തിൽനിന്ന് അവയിൽനിന്നുള്ള വിശുദ്ധ ഓഹരി വേർതിരിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവയുടെ മുഴുവൻ കൊഴുപ്പിൽനിന്ന്’; അതായത്, അവയിലെ ഏറ്റവും ശ്രേഷ്ഠമായ ഭാഗത്തിൽനിന്ന്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവയുടെ സമർപ്പിത ഭാഗം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: നിങ്ങൾക്കു ലഭിക്കുന്ന എല്ലാ ദാനങ്ങളിൽനിന്നും
  rationale: מִן + כֹּל ദാനങ്ങളുടെ ആകെത്തുകയിൽനിന്നുള്ള വേർതിരിക്കൽ സൂചിപ്പിക്കുന്നു. מַתְּנֹתֵיכֶם ലേവ്യർക്ക് ലഭിക്കുന്ന ദാനങ്ങളായതിനാൽ, മലയാളത്തിൽ ഉടമസ്ഥതയെക്കാൾ സ്വീകരണം വ്യക്തമാക്കുന്ന ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: תָּרִימוּ
  choice: ഉയർത്തി അർപ്പിക്കണം
  rationale: רוּם എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘ഉയർത്തുക’ എന്ന ബലിവഴിപാടുസംബന്ധിയായ ദൃശ്യപ്രയോഗം നിലനിർത്തുകയും, മലയാളവായനക്കാർക്ക് അതിന്റെ ആചാരപരമായ അർഥം വ്യക്തമാക്കാൻ ‘അർപ്പിക്കുക’ ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള ഓരോ വഴിപാടും
  rationale: תְּרוּמָה ഉയർത്തിവെക്കുന്ന സംഭാവനയെയോ വഴിപാടിനെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘യഹോവയ്ക്കുള്ള’ എന്നത് ഈ ഓഹരി ദൈവത്തിനായി വേർതിരിക്കുന്നതാണെന്ന് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരംവയ്ക്കാതെ മലയാളത്തിൽ പതിവായ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: מִכָּל חֶלְבּוֹ
  choice: ഓരോ ദാനത്തിലെയും ഏറ്റവും നല്ല ഭാഗത്തിൽനിന്ന്
  rationale: חֵלֶב എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കൊഴുപ്പ്’ എന്നാണെങ്കിലും, ഇവിടെ ദാനങ്ങളുടെ ഏറ്റവും സമൃദ്ധമായ അഥവാ ശ്രേഷ്ഠമായ ഭാഗം എന്ന ആചാരപരമായ അർഥമാണ്. ഏകവചന പ്രത്യയം ദാനസാമഗ്രിയെ കൂട്ടമായി കാണുന്നതുകൊണ്ട് മലയാളത്തിൽ ‘ഓരോ ദാനത്തിലെയും’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: അതിന്റെ വിശുദ്ധ ഓഹരി വേർതിരിക്കണം
  rationale: מִקְדָּשׁ ഇവിടെ വിശുദ്ധമായി മാറ്റിവെച്ച ഭാഗത്തെ സൂചിപ്പിക്കുന്നു. അവസാനത്തെ מִמֶּנּוּ വേർതിരിച്ചെടുക്കുന്ന ഉറവിടത്തെ ആവർത്തിക്കുന്നു; മലയാളത്തിൽ ‘വേർതിരിക്കണം’ എന്നു പൂരിപ്പിക്കുന്നത് ഹീബ്രുവിലെ സംക്ഷിപ്ത കല്പനയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: מִקְדְּשׁוֹ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അതിന്റെ വിശുദ്ധ ഓഹരി
  alternative: അതിന്റെ സമർപ്പിത ഭാഗം
  rationale: പദം വിശുദ്ധമായി വേർതിരിക്കപ്പെട്ട വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധ ഓഹരി’ വിശുദ്ധതയും ദാനത്തിൽനിന്നുള്ള നിശ്ചിത ഭാഗവും ഒരുപോലെ പ്രകടമാക്കുന്നു; ‘സമർപ്പിത ഭാഗം’ സാധുവായ മറ്റൊരു വ്യാഖ്യാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ഹീബ്രുവിലെ ആചാരപരമായ ‘ഉയർത്തുക’ എന്ന പ്രയോഗം പൂർണമായി നഷ്ടപ്പെടാതിരിക്കാൻ ‘ഉയർത്തി അർപ്പിക്കുക’ എന്നു നൽകി. അവസാനത്തെ സംക്ഷിപ്ത ഹീബ്രു വാക്യഘടന മലയാളത്തിൽ ഗ്രഹിക്കാനായി ‘വേർതിരിക്കണം’ എന്നു പൂരിപ്പിച്ചു; ചേർത്ത ആശയം മൂലത്തിലെ מִן പ്രയോഗത്തിലും മുൻക്രിയയിലും അന്തർനിഹിതമാണ്.
