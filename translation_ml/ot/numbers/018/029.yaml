  to: നിങ്ങളുടെ എല്ലാ ദാനങ്ങളിൽനിന്നും യഹോവയ്ക്കുള്ള എല്ലാ വഴിപാടും നിങ്ങൾ ഉയർത്തി അർപ്പിക്കണം; അവയുടെ ഏറ്റവും നല്ല ഭാഗത്തിൽനിന്ന് അവയിൽനിന്നുള്ള വിശുദ്ധ ഓഹരി വേർതിരിക്കണം.[a][b]
