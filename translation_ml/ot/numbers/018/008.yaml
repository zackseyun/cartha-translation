id: NUM.18.8
reference: Numbers 18:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: ml
  text: 'യഹ്‌വെ അഹരോനോടു അരുളിച്ചെയ്തു: “ഇതാ, ഞാൻതന്നെ ഇസ്രായേൽമക്കളുടെ സകല വിശുദ്ധവസ്തുക്കളിൽനിന്നുള്ള എന്റെ പ്രത്യേക അർപ്പണങ്ങളുടെ[a] ചുമതല നിനക്കു നൽകിയിരിക്കുന്നു. നിന്റെ അഭിഷേകവിഹിതമായി[b] അവയെ നിനക്കു നൽകിയിരിക്കുന്നു; നിന്റെ പുത്രന്മാർക്കു ശാശ്വതനിയമമായും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ അർപ്പണങ്ങൾ”; കൂടുതൽ സാങ്കേതികമായി, “എന്റെ ഉയർത്തൽ അർപ്പണങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അഭിഷേകത്തിനായി.” ഇവിടെ അഹരോന് തന്റെ അഭിഷിക്ത പുരോഹിതസ്ഥാനത്താൽ ലഭിക്കുന്ന വിഹിതമാണ് ഉദ്ദേശ്യമെന്നു സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ടു മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക പ്രസംഗത്തിന്റെ ഔപചാരിക ആമുഖത്തിന് യോജിക്കുന്ന, മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: וַאֲנִי הִנֵּה
  choice: ഇതാ, ഞാൻ തന്നെയാണ്
  rationale: הִנֵּה എന്ന ശ്രദ്ധാകർഷക ഘടകവും സ്വതന്ത്ര സർവനാമമായ אֲנִי നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִשְׁמֶרֶת
  choice: മേൽനോട്ടച്ചുമതല
  rationale: കാത്തുസൂക്ഷിക്കാനും കൈകാര്യം ചെയ്യാനുമായി ഏൽപ്പിക്കപ്പെട്ട പുരോഹിത ഉത്തരവാദിത്വം വ്യക്തമാക്കുന്നു.
- source_word: תְּרוּמֹתַי
  choice: എന്റെ ഉദ്‌ധൃതാർപ്പണങ്ങൾ
  rationale: വേർതിരിച്ചെടുത്തോ ഉയർത്തിക്കാണിച്ചോ സമർപ്പിക്കുന്ന പ്രത്യേക അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക അർഥം സംരക്ഷിക്കുന്നു; കൂടുതൽ പൊതുവായ വിവർത്തനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സകല വിശുദ്ധവസ്തുക്കൾ
  rationale: קָדְשֵׁי എന്നതിന്റെ വസ്തുക്കൾ/ദാനങ്ങൾ എന്ന പരിധി അനാവശ്യമായി ചുരുക്കാതെ, בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: לְמָשְׁחָה
  choice: നിന്റെ അഭിഷേകാവകാശമായി
  rationale: അഹരോന്റെ അഭിഷിക്ത പുരോഹിതസ്ഥാനത്തോടു ബന്ധപ്പെട്ട വിഹിതമോ അവകാശമോ ആണെന്ന സന്ദർഭാർഥം നൽകുന്നു; ഹീബ്രുവിലെ സംക്ഷിപ്തത മൂലമുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְחָק עוֹלָם
  choice: ശാശ്വതമായ ഒരു നിയമമായി
  rationale: സ്ഥിരമായി നിശ്ചയിച്ച വ്യവസ്ഥ എന്ന നിയമപരമായ ഭാവവും ദീർഘകാല തുടർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: לְמָשְׁחָה എന്ന പുരോഹിതാവകാശപ്രയോഗം
  choice: നിന്റെ അഭിഷേകാവകാശമായി
  alternative: അഭിഷേകത്തിനായി
  rationale: സന്ദർഭം പുതിയൊരു അഭിഷേകച്ചടങ്ങിനേക്കാൾ അഹരോന് അഭിഷിക്ത പുരോഹിതസ്ഥാനം നിമിത്തം ലഭിക്കുന്ന വിഹിതത്തെയാണ് കൂടുതൽ സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്; എങ്കിലും വ്യാകരണപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ദേശീയ-ഉടമ്പടി സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: עוֹלָם എന്ന കാലപരിധി
  choice: ശാശ്വതമായ
  alternative: എന്നേക്കുമുള്ള
  rationale: ഉടമ്പടി നിയമത്തിലെ തുടർച്ചയായ സ്ഥിരത പ്രകടമാക്കുന്നു; വാക്യം നിർണ്ണയിക്കാത്ത തത്ത്വശാസ്ത്രപരമായ കാലപരിധി കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ വാക്യഘടന സ്വീകരിച്ചു. പുരോഹിതനിയമത്തിന്റെ ഔപചാരികഭാവം നിലനിർത്തിയെങ്കിലും അത്യന്തം പുരാതനമായ പദാവലി ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
