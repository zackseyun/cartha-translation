id: NUM.18.6
reference: Numbers 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: ml
  text: ഞാനോ—ഇതാ—ഇസ്രായേൽമക്കളുടെ[a] ഇടയിൽനിന്ന് നിങ്ങളുടെ സഹോദരന്മാരായ ലേവ്യരെ എടുത്തിരിക്കുന്നു. അവർ നിങ്ങൾക്കു ദാനമായി, സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ നിർവഹിക്കേണ്ടതിന് യഹ്‌വേക്കു നൽകപ്പെട്ടവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്.” എബ്രായത്തിൽ “ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്” എന്നാണ്.
    reason: בני ישראל എന്ന പദപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള ബദൽ നൽകുകയും മൂലപാഠത്തിലെ കുടുംബപരമായ രൂപം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: എന്നാൽ ഞാൻ—ഇതാ
  rationale: തുടർച്ച സൂചിപ്പിക്കുന്ന വാവിനെയും ഊന്നൽ നൽകുന്ന സ്വതന്ത്ര സർവനാമത്തെയും הִנֵּהയുടെ ശ്രദ്ധാകർഷകവും ഗൗരവമുള്ളതുമായ ഭാവത്തെയും നിലനിർത്തുന്നു.
- source_word: לָקַחְתִּי
  choice: എടുത്തിരിക്കുന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘തിരഞ്ഞെടുത്തിരിക്കുന്നു’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: നിങ്ങളുടെ സഹോദരന്മാരായ ലേവ്യരെ
  rationale: ഗോത്രബന്ധത്തെ സൂചിപ്പിക്കുന്ന കുടുംബപരമായ ‘സഹോദരന്മാർ’ എന്ന രൂപം നിലനിർത്തുകയും ലേവ്യർ എന്ന ഗോത്രനാമം വ്യക്തമായി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ രൂപവും വലിയ സമൂഹത്തിനിടയിൽനിന്നുള്ള വേർതിരിച്ചെടുക്കലും സംരക്ഷിക്കുന്നു.
- source_word: לָכֶם מַתָּנָה
  choice: നിങ്ങൾക്കുള്ള ഒരു ദാനമായി
  rationale: ലേവ്യർ അഹരോനും പുത്രന്മാർക്കും ഏൽപ്പിക്കപ്പെട്ട ദാനമാണെന്ന ദാത്യബന്ധവും വിധേയപദസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: נְתֻנִים לַיהוָה
  choice: യഹോവയ്ക്കു നൽകപ്പെട്ടവരായി
  rationale: נְתֻנִים എന്ന നിഷ്ക്രിയ പങ്കാളിക്രിയയും ദൈവത്തോടുള്ള സമർപ്പണബന്ധവും നിലനിർത്തുന്നു; מַתָּנָה / נְתֻנִים എന്ന ‘ദാനം/നൽകുക’ പദബന്ധവും ഭാഗികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לַעֲבֹד אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ ശുശ്രൂഷ നിർവഹിക്കേണ്ടതിന്
  rationale: ക്രിയയും നാമവും ചേർന്ന ആരാധനാസേവനത്തിന്റെ ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദിവ്യനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: വാക്യത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന നിയമനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹപദം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ കുടുംബവംശപരമായ രൂപം സംരക്ഷിക്കുമ്പോഴും ആധുനിക മലയാളത്തിൽ സമൂഹമൊട്ടാകെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗമാകുന്നു.
- issue: ലേവ്യർ ആരോടാണ് ‘നൽകപ്പെട്ടവർ’ എന്ന വാക്യഘടനയിലെ ഇരട്ടബന്ധം
  choice: യഹോവയ്ക്കു നൽകപ്പെട്ടവർ; അഹരോനും പുത്രന്മാർക്കും ദാനം
  alternative: യഹോവ നൽകുന്ന ദാനം മാത്രം
  rationale: לָכֶם מַתָּנָה നെയും נְתֻנִים לַיהוָה നെയും ഒരേ ബന്ധമായി ലയിപ്പിക്കാതെ, പുരോഹിതന്മാർക്കുള്ള ദാനവും യഹോവയ്ക്കുള്ള സമർപ്പണവും എന്ന എബ്രായത്തിലെ ദ്വിതലബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാപരമായ ഗൗരവം പുലർത്തുന്നെങ്കിലും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘ഇതാ’, ‘ദാനം’, ‘ശുശ്രൂഷ’, ‘സമാഗമകൂടാരം’ തുടങ്ങിയ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ സങ്കീർണ്ണത വ്യക്തമാക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
