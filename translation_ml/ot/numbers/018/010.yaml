source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: ml
  text: അത് അതിവിശുദ്ധമായ ഒരു സ്ഥലത്ത് നീ ഭക്ഷിക്കണം.[a] ഓരോ പുരുഷനും അത് ഭക്ഷിക്കാം. അത് നിനക്കു വിശുദ്ധമായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘വിശുദ്ധങ്ങളുടെ വിശുദ്ധത്തിൽ.’ ഇവിടെ ഈ പ്രയോഗം ഭക്ഷിക്കുന്നതിനായി നിശ്ചയിക്കപ്പെട്ട അതിവിശുദ്ധ മേഖലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധമായ ഒരു സ്ഥലത്തുവെച്ച്
  rationale: בְּ എന്നതിന്റെ സ്ഥലസൂചകബലവും קֹדֶשׁ הַקֳּדָשִׁים എന്ന എബ്രായ അതിശയോക്തിപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു. ‘അതിവിശുദ്ധസ്ഥലത്ത്’ എന്നു മാത്രം പറഞ്ഞാൽ വിശുദ്ധമന്ദിരത്തിലെ അതിവിശുദ്ധസ്ഥലത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാം.
- source_word: תֹּאכֲלֶנּוּ
  choice: നീ അത് ഭക്ഷിക്കണം
  rationale: അഹരോനോട് പ്രതിനിധിപരമായി അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷ ഏകവചനവും നിയമപരമായ നിർദേശബലവും നിലനിർത്തുന്നു.
- source_word: כָּל זָכָר
  choice: പുരുഷന്മാർക്കെല്ലാം
  rationale: പുരോഹിതകുടുംബത്തിനുള്ളിൽ ലിംഗത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള യോഗ്യത വ്യക്തമാക്കുന്ന എബ്രായപ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: יֹאכַל אֹתוֹ
  choice: അത് ഭക്ഷിക്കാം
  rationale: ഇവിടെ അപൂർണക്രിയ അനുവാദവും യോഗ്യതയും സൂചിപ്പിക്കുന്നു; നിർബന്ധത്തെക്കാൾ ‘ഭക്ഷിക്കാം’ അതു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: അത് നിനക്കു വിശുദ്ധമായിരിക്കണം
  rationale: അഹരോനോടുള്ള ഏകവചന അഭിസംബോധനയും വഴിപാടിന്റെ വിശുദ്ധപദവിയും ‘വിശുദ്ധം’ എന്ന മുഖ്യ ആരാധനാപദവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതനിർദേശത്തിന്റെ അഭിസംബോധനയും വ്യാപ്തിയും
  choice: ആദ്യവും അവസാനവും ഉള്ള ഏകവചനങ്ങൾ അഹരോനോടുള്ള പ്രതിനിധിപരമായ അഭിസംബോധനയായി നിലനിർത്തി; ഇടയിലെ വാക്യം യോഗ്യരായ പുരുഷന്മാർക്കുള്ള അനുവാദമായി നൽകി.
  alternative: ഏകവചനം അഹരോനു മാത്രം ബാധകമെന്നു വ്യാഖ്യാനിക്കുക.
  rationale: അടുത്തുള്ള സന്ദർഭം അഹരോനും പുത്രന്മാർക്കും ലഭിക്കുന്ന പുരോഹിതവിഹിതങ്ങളെക്കുറിച്ചാണ്. അതിനാൽ എബ്രായത്തിലെ ഏകവചനരൂപം സംരക്ഷിക്കുമ്പോഴും അടുത്ത വാക്യം വിശാലമായ പുരോഹിതപ്രയോഗം വ്യക്തമാക്കുന്നു.
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്ന പ്രയോഗത്തിന്റെ സ്ഥലപരമായ അർഥം
  choice: നിർദ്ദിഷ്ടമായ അതിവിശുദ്ധ മേഖലയിൽ ഭക്ഷിക്കണമെന്ന സ്ഥലസൂചനയായി വിവർത്തനം ചെയ്തു.
  alternative: വിശുദ്ധമന്ദിരത്തിന്റെ അകത്തെ ‘അതിവിശുദ്ധസ്ഥലം’ മാത്രമായി വായിക്കുക; അല്ലെങ്കിൽ ‘അതിവിശുദ്ധവസ്തുവായി’ എന്നു വർഗ്ഗസൂചനയായി മാത്രം വായിക്കുക.
  rationale: בְּ എന്ന മുൻപ്രത്യയം സ്ഥലപരമായ വായനയെ ശക്തിപ്പെടുത്തുന്നു. എന്നാൽ എബ്രായ ശൈലിയുടെ അക്ഷരാർഥം അകത്തെ അതിവിശുദ്ധസ്ഥലം മാത്രമാണെന്ന തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം; അതിനാൽ പ്രധാനവാചകത്തിൽ സ്വാഭാവിക സ്ഥലസൂചനയും അടിക്കുറിപ്പിൽ അക്ഷരാർഥവും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാശൈലി ഉപയോഗിച്ചു. ‘നീ’ എന്ന ഏകവചനം മൂലത്തിലെ അഹരോനോടുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു; ‘ഭക്ഷിക്കണം/ഭക്ഷിക്കാം’ എന്ന വ്യത്യാസം നിർദേശവും അനുവാദവും വേർതിരിക്കുന്നു.
