source:
  edition: WLC
  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: ml
  text: നിങ്ങളുടെ അർപ്പണവിഹിതം[b] മെതിക്കളത്തിൽനിന്നുള്ള ധാന്യംപോലെയും മുന്തിരിച്ചക്കിൽനിന്നുള്ള മുഴുവൻ വിളവുപോലെയും[c] നിങ്ങൾക്കു കണക്കാക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ കണക്കിൽ ഉൾപ്പെടുത്തപ്പെടും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ അർപ്പണം’; പരമ്പരാഗതമായി, ‘നിങ്ങളുടെ ഉയർത്തർപ്പണം.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപദപ്രയോഗം ‘മുന്തിരിച്ചക്കിൽനിന്നുള്ള നിറവ്’ എന്നാണ്; അതായത്, മുന്തിരിച്ചക്കിൽനിന്നു ലഭിക്കുന്ന മുഴുവൻ വിളവ് അഥവാ ഉൽപ്പന്നം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: കണക്കാക്കപ്പെടും
  rationale: חשׁב എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ ഒരു വസ്തുവിനെ മറ്റൊന്നിനു തുല്യമായി കണക്കിൽ കൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിയമപരവും ആരാധനാസംബന്ധവുമായ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണിത്.
- source_word: תְּרוּמַתְכֶם
  choice: നിങ്ങളുടെ അർപ്പണവിഹിതം
  rationale: תְּרוּמָה വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിച്ചു നൽകുന്ന വിഹിതമാണ്. ‘അർപ്പണവിഹിതം’ എന്നത് സാധാരണ ‘സംഭാവന’യെക്കാൾ സന്ദർഭത്തിന്റെ ആരാധനാസംബന്ധമായ അർഥം വ്യക്തമാക്കുകയും പഴഞ്ചനായ സാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: כַּדָּגָן
  choice: ധാന്യംപോലെ
  rationale: דָּגָן ധാന്യവിളയെ സൂചിപ്പിക്കുന്നു; താരതമ്യസൂചകമായ כ സ്വാഭാവികമായി ‘പോലെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִן הַגֹּרֶן
  choice: മെതിക്കളത്തിൽനിന്നുള്ള
  rationale: גֹּרֶן ധാന്യം മെതിക്കുന്ന കളമാണ്. ഈ പ്രയോഗം അവിടെനിന്നു ലഭിക്കുന്ന ധാന്യവിളവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: וְכַמְלֵאָה
  choice: നിറവുപോലെയും
  rationale: מְלֵאָה എന്നതിന്റെ അടിസ്ഥാനചിത്രം ‘നിറവ്’ എന്നതാണ്; ഇവിടെ മുന്തിരിച്ചക്കിൽനിന്നുള്ള പൂർണ വിളവിനെയോ ഉൽപ്പന്നത്തെയോ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ചിത്രം നിലനിർത്താൻ ‘നിറവ്’ സ്വീകരിച്ചു.
- source_word: מִן הַיָּקֶב
  choice: മുന്തിരിച്ചക്കിൽനിന്നുള്ള
  rationale: יֶקֶב മുന്തിരി ചവിട്ടിപ്പിഴിയുന്ന ചക്കിനെയോ അതിന്റെ സംഭരണത്തൊട്ടിയെയോ സൂചിപ്പിക്കാം. കാർഷിക സമാന്തരഘടനയിൽ ‘മുന്തിരിച്ചക്ക്’ ഏറ്റവും വ്യക്തവും യോജിച്ചതുമാണ്.
