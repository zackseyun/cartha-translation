source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: ml
  text: 'ലേവ്യരോടു നീ സംസാരിച്ച് അവരോടു പറയണം: “ഇസ്രായേൽ പുത്രന്മാരിൽനിന്ന്[a] ഞാൻ നിങ്ങൾക്കു നിങ്ങളുടെ അവകാശമായി നൽകിയ ദശാംശം നിങ്ങൾ സ്വീകരിക്കുമ്പോൾ, അതിൽനിന്ന് യഹോവയുടെ വിഹിതം[b] അർപ്പിക്കണം—ദശാംശത്തിൽനിന്ന് ഒരു ദശാംശം[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരിൽനിന്ന്” അല്ലെങ്കിൽ “ഇസ്രായേൽജനത്തിൽനിന്ന്.” എബ്രായമൂലം അക്ഷരാർഥത്തിൽ “ഇസ്രായേൽ പുത്രന്മാർ” എന്നു പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യഹോവയ്ക്കുള്ള വിഹിതം”; പരമ്പരാഗതമായി, “യഹോവയുടെ ഉയർത്തുന്ന വഴിപാട്.”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ദശാംശത്തിൽനിന്ന് ഒരു ദശാംശം”; അതായത്, ലേവ്യർ സ്വീകരിക്കുന്ന ദശാംശത്തിന്റെ പത്തിലൊന്ന്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ലേവി ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: സംസാരിച്ച് ... പറയണം
  rationale: എബ്രായ നിയമനിർദേശത്തിലെ രണ്ടു ക്രിയകളും അനാവശ്യമായ ആവർത്തനമാകാതെ നിലനിർത്തുന്നു.
- source_word: כִּי תִקְחוּ
  choice: നിങ്ങൾ സ്വീകരിക്കുമ്പോൾ
  rationale: ഇവിടെ כִּי കല്പന ബാധകമാകുന്ന സാഹചര്യം അവതരിപ്പിക്കുന്നു; അതിനാൽ സോപാധികമായ ‘എങ്കിൽ’ എന്നതിനെക്കാൾ ‘എപ്പോൾ/ചെയ്യുമ്പോൾ’ യോജിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽ പുത്രന്മാർ
  rationale: മൂലത്തിലെ അക്ഷരാർഥ രൂപം നിലനിർത്തുന്നു; അത് മുഴുവൻ ഇസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: הַמַּעֲשֵׂר
  choice: ദശാംശം
  rationale: നിയമപ്രകാരം നൽകുന്ന പത്തിലൊന്ന് എന്ന അർഥത്തിനുള്ള വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: ഇസ്രായേൽ പുത്രന്മാരിൽനിന്ന് ഞാൻ നിങ്ങൾക്കു ... നൽകിയ
  rationale: ദൈവമാണ് നൽകുന്നതെന്നും ആ ദശാംശം ഇസ്രായേലിൽനിന്നാണ് ലഭിക്കുന്നതെന്നും വ്യക്തമാക്കുന്ന ഉറവിടബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: בְּנַחֲלַתְכֶם
  choice: നിങ്ങളുടെ അവകാശമായി
  rationale: ലേവ്യർക്ക് ഭൂസ്വത്തിനുപകരം ദൈവം നിശ്ചയിച്ച ഓഹരി എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַהֲרֵמֹתֶם
  choice: അർപ്പിക്കണം
  rationale: Hiphil രൂപത്തിന്റെ ആരാധനാപരമായ സന്ദർഭത്തിലെ സമർപ്പിക്കൽ/ഉയർത്തി നൽകൽ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയുടെ വിഹിതം
  rationale: വേർതിരിച്ചു സമർപ്പിക്കുന്ന ഓഹരി എന്ന תְּרוּמָהയുടെ അർഥവും യഹോവയോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ ജനിറ്റീവിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: ദശാംശത്തിൽനിന്ന് ഒരു ദശാംശം
  rationale: מִן എന്ന ഭാഗവാചകബന്ധം നേരിട്ട് സംരക്ഷിക്കുകയും ലേവ്യർ ലഭിച്ച ദശാംശത്തിന്റെ പത്തിലൊന്നാണ് നൽകേണ്ടതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ സ്ഥാപിത വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ജനവിഭാഗപ്രയോഗം
  choice: ഇസ്രായേൽ പുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ വ്യാകരണരൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; അതിന്റെ വിപുലമായ ജനവിഭാഗാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: תְּרוּמַת יְהוָהയിലെ ജനിറ്റീവ് ബന്ധം
  choice: യഹോവയുടെ വിഹിതം
  alternative: യഹോവയ്ക്കുള്ള വിഹിതം
  rationale: ഈ ഘടന യഹോവയുടേതായ വിഹിതം എന്നും യഹോവയ്ക്കായി നിശ്ചയിച്ച വിഹിതം എന്നും മനസ്സിലാക്കാവുന്നതിനാൽ പ്രധാനവാചകം ആ ബന്ധം തുറന്നുവയ്ക്കുകയും വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരവുള്ള നിയമനിർദേശ ശൈലി. മോശെയോടുള്ള ഏകവചനമായ ‘നീ’യും ലേവ്യരോടുള്ള ബഹുവചനമായ ‘നിങ്ങൾ’യും വേർതിരിച്ചിരിക്കുന്നു. ആരാധനാപരമായ സാങ്കേതികത നിലനിർത്തിക്കൊണ്ട് അപരിചിതമായ പഴയ പദങ്ങൾ ഒഴിവാക്കി.
