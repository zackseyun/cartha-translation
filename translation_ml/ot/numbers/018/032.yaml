id: NUM.18.32
reference: Numbers 18:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: ml
  text: അതിൽനിന്ന് അതിന്റെ ഏറ്റവും നല്ല ഭാഗം വഴിപാടായി ഉയർത്തി അർപ്പിക്കുമ്പോൾ, അതിനെച്ചൊല്ലി നിങ്ങൾ കുറ്റബാധ വഹിക്കുകയില്ല[a]. നിങ്ങൾ ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കളെ അപവിത്രമാക്കരുത്[b]; നിങ്ങൾ മരിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിന്റെ കൊഴുപ്പ്’ അഥവാ ‘അതിന്റെ ശ്രേഷ്ഠഭാഗം’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായപദമായ חֶלֶב അക്ഷരാർഥത്തിൽ ‘കൊഴുപ്പ്’ എന്നാണ്; എന്നാൽ വഴിപാടുകളുടെ സന്ദർഭത്തിൽ അത് ഏറ്റവും സമൃദ്ധമായതോ ഏറ്റവും നല്ലതോ ആയ ഭാഗത്തെ സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: നിങ്ങൾ പാപം വഹിക്കുകയില്ല
  rationale: נשא ... חטא എന്ന പ്രയോഗം കുറ്റബാധയോ പാപത്തിന്റെ ഉത്തരവാദിത്വമോ വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാപം വഹിക്കുക’ എന്നത് എബ്രായ രൂപകത്തെ നിലനിർത്തുകയും സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: עָלָיו
  choice: അതിനെച്ചൊല്ലി
  rationale: മുമ്പ് പറഞ്ഞ ദശാംശത്തെയോ അതുമായി ബന്ധപ്പെട്ട ബാധ്യതയെയോ സൂചിപ്പിക്കുന്നു; ‘അതിനെച്ചൊല്ലി’ കാരണ/ബന്ധ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּהֲרִימְכֶם
  choice: വഴിപാടായി ഉയർത്തുമ്പോൾ
  rationale: רום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഉയർത്തുന്നതിനെയും ദൈവത്തിനുള്ള വിഹിതമായി വേർതിരിച്ചു സമർപ്പിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ‘വഴിപാടായി’ സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോൾ ‘ഉയർത്തുക’ മൂലരൂപകത്തെ നിലനിർത്തുന്നു.
- source_word: חֶלְבּוֹ
  choice: അതിന്റെ ഏറ്റവും നല്ല ഭാഗം
  rationale: חֶלֶב അക്ഷരാർഥത്തിൽ ‘കൊഴുപ്പ്’ ആണെങ്കിലും, വഴിപാട്/വിഹിത സന്ദർഭത്തിൽ ഏറ്റവും സമൃദ്ധമായതോ ശ്രേഷ്ഠമായതോ ആയ ഭാഗത്തെ സൂചിപ്പിക്കാം. ഇവിടെ ഉൽപ്പന്നങ്ങളുടെ ദശാംശമാണ് സന്ദർഭം; അതിനാൽ ‘ഏറ്റവും നല്ല ഭാഗം’ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: מִמֶּנּוּ
  choice: അതിൽനിന്ന്
  rationale: ഏറ്റവും നല്ല ഭാഗം വേർതിരിച്ചെടുക്കുന്ന ദശാംശത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുമായ വിവർത്തനം.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കൾ
  rationale: קָדְשֵׁי എന്നതിന്റെ വിശാലമായ ‘വിശുദ്ധമായി വേർതിരിച്ച വസ്തുക്കൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; בְנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ജനനാമത്തിന് സ്വാഭാവികമായ മലയാളരൂപം ‘ഇസ്രായേൽമക്കൾ’ ആണ്.
- source_word: תְחַלְּלוּ
  choice: അശുദ്ധമാക്കരുത്
  rationale: חלל പീയേൽ രൂപം വിശുദ്ധമായതിന്റെ വിശുദ്ധത ലംഘിക്കുക, സാധാരണയോ അശുദ്ധമോ ആയി പെരുമാറുക എന്ന അർഥം നൽകുന്നു. ‘അശുദ്ധമാക്കുക’ വിശുദ്ധം–അശുദ്ധം എന്ന വൈരുധ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וְלֹא תָמֻתוּ
  choice: അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും
  rationale: എബ്രായത്തിൽ വാവുകൊണ്ട് ബന്ധിപ്പിച്ച നിഷേധവാക്യമാണ്. സന്ദർഭത്തിൽ മുൻകല്പന അനുസരിക്കുന്നതിന്റെ ഫലമായി മരണം ഒഴിവാകുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഇത് കർശനമായ ഉദ്ദേശ്യാർഥമായി മാത്രം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ജനനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന രൂപം മലയാളത്തിലെ പതിവും മാന്യവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കുന്നില്ല.
- issue: ആരാധനാസന്ദർഭത്തിലെ חֶלֶב
  choice: ഏറ്റവും നല്ല ഭാഗം
  alternative: കൊഴുപ്പ് / ശ്രേഷ്ഠഭാഗം
  rationale: ഇവിടെ മൃഗക്കൊഴുപ്പല്ല, ദശാംശത്തിൽനിന്നു വേർതിരിക്കുന്ന മികച്ച വിഹിതമാണ് സന്ദർഭം. അതിനാൽ ആരാധനാതത്വം നിലനിർത്തിക്കൊണ്ട് അക്ഷരാർഥം മൂലമുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: അവസാന വാക്യത്തിന്റെ ബന്ധം
  choice: അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും
  alternative: നിങ്ങൾ മരിക്കുകയുമില്ല
  rationale: וְלֹא תָמֻתוּ വ്യാകരണപരമായി ഏകോപിത നിഷേധവാക്യമായി വായിക്കാം; സന്ദർഭപരമായി കല്പന പാലിക്കുന്നതിന്റെ ഫലവുമാണ്. ‘അങ്ങനെ’ ആ ബന്ധം വ്യക്തമാക്കുന്നു, എന്നാൽ ദൈവശാസ്ത്രപരമായ അധിക വ്യവസ്ഥകൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ തിരുവെഴുത്തുശൈലി. ഉറവിടത്തിലെ ആരാധനാപരമായ ഭാഷ നിലനിർത്തിക്കൊണ്ട് ‘കൊഴുപ്പ്’ എന്ന അക്ഷരാർഥം സൃഷ്ടിക്കാവുന്ന തെറ്റിദ്ധാരണ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
