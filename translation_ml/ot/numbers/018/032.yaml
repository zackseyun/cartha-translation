revisions:
- from: അതിൽനിന്ന് അതിന്റെ ഏറ്റവും നല്ല ഭാഗം വഴിപാടായി ഉയർത്തുമ്പോൾ, അതിനെച്ചൊല്ലി നിങ്ങൾ പാപം വഹിക്കുകയില്ല[a]. നിങ്ങൾ ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കളെ അശുദ്ധമാക്കരുത്[b]; അങ്ങനെ നിങ്ങൾ മരിക്കാതിരിക്കും.
  to: അതിൽനിന്ന് അതിന്റെ ഏറ്റവും നല്ല ഭാഗം വഴിപാടായി ഉയർത്തി അർപ്പിക്കുമ്പോൾ, അതിനെച്ചൊല്ലി നിങ്ങൾ കുറ്റബാധ വഹിക്കുകയില്ല[a]. നിങ്ങൾ ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കളെ അപവിത്രമാക്കരുത്[b]; നിങ്ങൾ മരിക്കുകയുമില്ല.
  rationale: The revision corrects the key holiness term so that it denotes profanation rather than ritual uncleanness, removes an added explicit causal/result connective from the final clause, and slightly improves the idiomatic expression of presenting the raised contribution. It retains the draft’s sound contextual rendering of חֶלֶב and preserves both required footnote anchors.
