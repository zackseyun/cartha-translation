review_pass:
  verdict: revise
  source_fidelity: Draft correctly represents attachment to Aaron, the entrusted responsibility for the tent of meeting and all its service, and the prohibition on an unauthorized person approaching the addressed priestly group. A small revision makes the relationship between ‘keeping the charge’ and ‘all the service of the tent’ more explicit.
  naturalness: The draft is generally clear, but ‘കൂടാരത്തിലെ എല്ലാ ശുശ്രൂഷകൾക്കുമായി സമാഗമകൂടാരത്തിന്റെ ചുമതല നിർവഹിക്കണം’ is slightly compressed and can sound as though the charge itself is performed merely for services. Separating the two coordinated duties is more natural Malayalam.
  terminology: ‘സമാഗമകൂടാരം,’ ‘ചുമതല,’ and ‘ശുശ്രൂഷ’ are appropriate in a formal modern Malayalam sanctuary register. ‘അധികാരമില്ലാത്ത’ suitably conveys זָר as lack of authorized sanctuary status rather than foreign ethnicity. The footnote alternative is adjusted to a more idiomatic, non-gendered Malayalam expression.
  issues:
  - severity: low
    issue: The relation of the charge to all tent service is syntactically compressed.
    rationale: Hebrew assigns both keeping the tent-of-meeting charge and all the tent’s service to the Levites. Coordinating these responsibilities in Malayalam avoids a slightly opaque ‘for all services’ construction.
  - severity: low
    issue: Footnote alternative ‘പുറത്തുള്ള ഒരുവനും’ is gendered and less idiomatic for the cultically unauthorized sense.
    rationale: ‘അനധികൃതനായ ആരും’ gives a natural lexical alternative while the explanation retains the essential non-ethnic sense of זָר.
  revised_text: അവർ നിന്നോടു ചേർന്ന് സമാഗമകൂടാരത്തിന്റെ ചുമതല കാത്തുസൂക്ഷിക്കുകയും കൂടാരത്തിലെ എല്ലാ ശുശ്രൂഷകളും നിർവഹിക്കുകയും വേണം; എന്നാൽ അധികാരമില്ലാത്ത ആരും[a] നിങ്ങളെ സമീപിക്കരുത്.
