  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: ml
  text: അവർ നിന്നോടു ചേർന്ന് സമാഗമകൂടാരത്തിന്റെ ചുമതല കാത്തുസൂക്ഷിക്കുകയും കൂടാരത്തിലെ എല്ലാ ശുശ്രൂഷകളും നിർവഹിക്കുകയും വേണം; എന്നാൽ അധികാരമില്ലാത്ത ആരും[a] നിങ്ങളെ സമീപിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനധികൃതനായ ആരും.’ ഇവിടെ എബ്രായപദമായ זָר വംശീയമായി ഒരു വിദേശിയെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല; അനുവദിക്കപ്പെട്ട വിശുദ്ധസ്ഥാനശുശ്രൂഷയ്ക്ക് പുറത്തുള്ള ഒരാളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: അവർ നിന്നോടു ചേർന്ന്
  rationale: നിഫാൽ രൂപമായ נלוה ഇവിടെ അഹരോനോടു ചേർന്ന് സഹായശുശ്രൂഷ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ വ്യക്തിയോടുള്ള ബന്ധവും ദിശയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: ചുമതല നിർവഹിക്കണം
  rationale: പുരോഹിതശുശ്രൂഷയുടെ പശ്ചാത്തലത്തിൽ שׁמר + מִשְׁמֶרֶת ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം പാലിച്ചു നിർവഹിക്കുക എന്ന അർഥം നൽകുന്നു. വാക്കിന് വാക്കായി ‘കാവൽ കാക്കുക’ എന്നു പറയുന്നതിനെക്കാൾ ‘ചുമതല നിർവഹിക്കുക’ ആചാരപരമായ കർത്തവ്യബോധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്ന വിശുദ്ധകൂടാരത്തിന്റെ സ്ഥിരമായ പേരിനെ സംക്ഷിപ്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: לְכָל עֲבֹדַת הָאֹהֶל
  choice: കൂടാരത്തിലെ എല്ലാ ശുശ്രൂഷകൾക്കുമായി
  rationale: עֲבֹדָה ഇവിടെ പൊതുവായ ജോലി മാത്രമല്ല, കൂടാരവുമായി ബന്ധപ്പെട്ട നിയുക്ത വിശുദ്ധശുശ്രൂഷയാണ്; അതിനാൽ ‘ശുശ്രൂഷ’ എന്നത് സന്ദർഭോചിതമാണ്.
- source_word: וְזָר
  choice: എന്നാൽ അധികാരമില്ലാത്ത ആരും
  rationale: זָר ഇവിടെ വംശീയമായി വിദേശിയായ ഒരാളെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല; വിശുദ്ധസ്ഥാനത്തെ സമീപിക്കാൻ അനുവദിക്കപ്പെട്ട പുരോഹിത-ലേവ്യ ചുമതലയ്ക്കു പുറത്തുള്ള ആളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അധികാരമില്ലാത്ത ആരും’ ആ നിയന്ത്രണം വ്യക്തമായി നൽകുന്നു.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: നിങ്ങളുടെ അടുത്തു വരരുത്
  rationale: קרב വിശുദ്ധസ്ഥാനനിയമത്തിൽ നിരോധിതമായ സാമീപ്യത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്നു. അഹരോനിൽനിന്ന് ബഹുവചനത്തിലുള്ള അഭിസംബോധനയിലേക്കുള്ള മാറ്റം ‘നിങ്ങളുടെ’ എന്നു നിലനിർത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധസ്ഥാനനിയമത്തിലെ זָר എന്ന പദത്തിന്റെ അർഥം
  choice: അനുവദിക്കപ്പെട്ട വിശുദ്ധസ്ഥാനശുശ്രൂഷയ്ക്ക് അധികാരമില്ലാത്ത വ്യക്തി
  alternative: പുറത്തുള്ളവൻ; അന്യൻ; വിദേശി
  rationale: ഈ സന്ദർഭത്തിലെ വേർതിരിവ് വംശീയതയെ അടിസ്ഥാനമാക്കിയല്ല, വിശുദ്ധസ്ഥാനത്തെ സമീപിക്കാനുള്ള നിയുക്ത ചുമതലയെയും അനുമതിയെയും അടിസ്ഥാനമാക്കിയുള്ളതാണ്. അതിനാൽ ‘അധികാരമില്ലാത്ത’ എന്ന പരിഭാഷ തെറ്റായ വംശീയ സൂചന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘സമാഗമകൂടാരം,’ ‘ശുശ്രൂഷ,’ ‘ചുമതല’ എന്നിവ വിശുദ്ധസ്ഥാനസന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു. എബ്രായത്തിലെ ഏകവചനമായ ‘നിന്നോടു’ എന്നും തുടർന്നുള്ള ബഹുവചനമായ ‘നിങ്ങളുടെ’ എന്നും വേർതിരിച്ചു സംരക്ഷിച്ചിട്ടുണ്ട്.
