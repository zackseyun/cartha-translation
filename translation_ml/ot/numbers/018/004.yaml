  to: അവർ നിന്നോടു ചേർന്ന് സമാഗമകൂടാരത്തിന്റെ ചുമതല കാത്തുസൂക്ഷിക്കുകയും കൂടാരത്തിലെ എല്ലാ ശുശ്രൂഷകളും നിർവഹിക്കുകയും വേണം; എന്നാൽ അധികാരമില്ലാത്ത ആരും[a] നിങ്ങളെ സമീപിക്കരുത്.
