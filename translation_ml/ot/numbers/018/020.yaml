  terminology: ‘യഹ്‌വേ,’ ‘ദേശം,’ ‘ഓഹരി,’ ‘അവകാശം,’ ‘ഇസ്രായേൽമക്കൾ’ എന്നിവ സ്ഥിരതയോടെയും സന്ദർഭോചിതമായും ഉപയോഗിച്ചിരിക്കുന്നു. ഓഹരി/അവകാശം എന്ന രണ്ടു പദങ്ങൾ חֵלֶק, נַחֲלָה എന്നിവയുടെ വ്യത്യാസം യുക്തമായി നിലനിർത്തുന്നു.
