id: NUM.18.20
reference: Numbers 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: ml
  text: 'യഹ്‌വേ അഹരോനോടു പറഞ്ഞു: “അവരുടെ ദേശത്ത് നിനക്ക് അവകാശം ലഭിക്കുകയില്ല; അവരുടെ ഇടയിൽ നിനക്ക് ഒരു ഓഹരിയും ഉണ്ടായിരിക്കുകയില്ല. ഇസ്രായേൽമക്കളുടെ[a] ഇടയിൽ ഞാൻ നിന്റെ ഓഹരിയും നിന്റെ അവകാശവും ആകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേൽജനത്തിന്റെ ഇടയിൽ” / “ഇസ്രായേല്യരുടെ ഇടയിൽ.” എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കളുടെ ഇടയിൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, അതിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണമായ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּאַרְצָם
  choice: അവരുടെ ദേശത്ത്
  rationale: ഇവിടെ אֶרֶץ ഇസ്രായേല്യരുടെ ഭൂവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ ഭൂപ്രദേശപരവും അവകാശസംബന്ധവുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: תִנְחָל
  choice: നിനക്ക് അവകാശം ലഭിക്കുകയില്ല
  rationale: נחל എന്ന ക്രിയ ഇവിടെ അവകാശമായി ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർമം സൂചനയായി ചേർത്ത ഈ രൂപം അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חֵלֶק
  choice: ഓഹരി
  rationale: വിഭജിച്ചുനൽകുന്ന പങ്ക് എന്ന അർഥം നൽകുന്ന ‘ഓഹരി’, നിഷേധവാക്യത്തിലും ദൈവം തന്നെയാണ് അഹരോന്റെ ഓഹരി എന്ന പ്രഖ്യാപനത്തിലും ഒരേ പദബന്ധം നിലനിർത്തുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ
  rationale: വെറും സ്ഥലമധ്യം എന്നതിലുപരി ഇസ്രായേൽ സമൂഹത്തിനുള്ളിലെ പങ്കിനെയാണ് ഈ സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: אֲנִי חֶלְקְךָ
  choice: ഞാൻ തന്നെയാണ് നിന്റെ ഓഹരി
  rationale: אֲנִי എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ എന്നു പ്രകടമാക്കി; മുൻവാക്യത്തിലെ חֵלֶק നോടുള്ള പദബന്ധവും നിലനിർത്തി.
- source_word: נַחֲלָתְךָ
  choice: നിന്റെ അവകാശം
  rationale: ഭൂമിയോ സ്വത്തോ അവകാശമായി ലഭിക്കുന്ന നിയമപരവും ഉടമ്പടിപരവുമായ ആശയം ‘അവകാശം’ സൂക്ഷിക്കുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ഉടമ്പടി പ്രയോഗത്തെ മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വേ’ എന്നത് YHWH-ന്റെ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട പണ്ഡിതോചിത ലിപ്യന്തരണമാണ്.
- issue: ദൈവം അഹരോന്റെ ‘ഓഹരിയും അവകാശവും’ ആകുന്നു എന്ന സമാന്തരപ്രയോഗം
  choice: 'രണ്ടു വ്യത്യസ്ത മൂലപദങ്ങളും നിലനിർത്തി: ‘ഓഹരി’, ‘അവകാശം’'
  alternative: രണ്ടും ‘പങ്ക്’ എന്നോ ‘അവകാശം’ എന്നോ ഏകീകരിക്കുക
  rationale: חֵלֶק, נַחֲלָה എന്നീ അടുത്തബന്ധമുള്ളെങ്കിലും വ്യത്യസ്തമായ പദങ്ങളെ നിലനിർത്തുന്നത് ഭൂവിഹിതത്തിന്റെ അഭാവവും ദൈവം തന്നെയുള്ള അവകാശവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മങ്ങാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം; ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ രൂപം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ ഇത് സമൂഹമൊട്ടാകെ ഉൾക്കൊള്ളുന്ന പതിവുപ്രയോഗമായി വായിക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘ഓഹരി—അവകാശം’ എന്ന ആവർത്തനാത്മക അവകാശഭാഷയും ദൈവത്തിന്റെ സ്വയംഊന്നലും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുചിഹ്നം ‘Aaron’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം בְּנֵי יִשְׂרָאֵל നെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ അതത് പ്രയോഗത്തിനുശേഷം ചിഹ്നം സ്ഥാപിച്ചു.
