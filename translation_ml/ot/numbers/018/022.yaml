  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഇനി സമാഗമകൂടാരത്തിനരികെ വരരുത്; പാപം വഹിക്കാനും മരിക്കാനും ഇടയാകാതിരിക്കാൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുറ്റബാധ്യത വഹിക്കുക.’ ‘പാപം വഹിക്കുക’ എന്നതാണ് ഹീബ്രുവിലെ അക്ഷരാർഥം; തെറ്റിന്റെ ഉത്തരവാദിത്വമോ അതിന്റെ ഫലമോ വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പുരോഹിത-നിയമ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: അരികെ വരരുത്
  rationale: קרב എന്ന ക്രിയയുടെ ‘അടുത്തുവരുക/സമീപിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും വിശുദ്ധസ്ഥലത്തെ സമീപിക്കുന്ന ആരാധനാപരമായ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עוֹד
  choice: ഇനി
  rationale: നിഷേധത്തോടൊപ്പം עוֹד എന്നത് ‘ഇനിമേൽ ഇല്ല’ എന്ന അർഥം നൽകുന്നു; ‘ഇനി ... വരരുത്’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബസമൂഹപരമായ രൂപം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിലെ നിശ്ചിത സംഗമസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഈ വിശുദ്ധമന്ദിരപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഉറവിടരൂപത്തോട് സുതാര്യവുമായ പദമാണ്.
- source_word: לָשֵׂאת חֵטְא
  choice: പാപം വഹിച്ച്
  rationale: ‘പാപം വഹിക്കുക’ എന്ന ഹീബ്രു പുരോഹിത-നിയമ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും കുറ്റബാധ്യത/ഫലം വഹിക്കൽ എന്ന അർഥവ്യാപ്തിയും വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ നിലനിർത്തുന്നു.
- source_word: לָמוּת
  choice: മരിക്കും
  rationale: അനധികൃതമായി സമീപിക്കുന്നതിന്റെ മാരകഫലം വ്യക്തമായ മലയാള വാക്യബന്ധത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വിശുദ്ധസ്ഥലത്തേക്കുള്ള അനധികൃത സമീപനവും അതിൽനിന്നുണ്ടാകുന്ന കുറ്റബാധ്യതയും എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ‘അരികെ വരരുത്; വന്നാൽ അവർ പാപം വഹിച്ച് മരിക്കും’ എന്ന സംക്ഷിപ്ത മുന്നറിയിപ്പ് നിലനിർത്തി.
  alternative: ‘സമാഗമകൂടാരത്തെ സമീപിച്ച് കുറ്റക്കാരായി മരിക്കരുത്.’
  rationale: ഉടൻമുൻപുള്ള സന്ദർഭം ലേവ്യർക്കും പുരോഹിതർക്കും ഏല്പിച്ച വിശുദ്ധസ്ഥലസേവനത്തിന് വിരുദ്ധമായ സമീപനത്തെക്കുറിച്ചാണെങ്കിലും, വാക്യം തന്നെ ‘അനധികൃതം’ എന്നു ചേർക്കുന്നില്ല. അതിനാൽ സന്ദർഭം പാഠത്തിൽ ഇറക്കുമതി ചെയ്യാതെ, ‘പാപം വഹിക്കുക’ എന്ന നിയമ-ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാഗമകൂടാരം’ പോലുള്ള പരിചിത ബൈബിൾ പദം നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്നവിധം രൂപപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
