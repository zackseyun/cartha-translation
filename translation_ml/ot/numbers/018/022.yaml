  source_fidelity: 'The draft accurately renders the prohibition, the Israelites, the tent of meeting, and the consequence of bearing sin and dying. However, “വന്നാൽ” (‘if they come’) changes the Hebrew infinitival consequence/prevention construction into an explicit conditional and weakens the direct connection: they are not to come near ‘so as to bear sin and die.’'
