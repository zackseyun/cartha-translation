lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന דבר എന്ന ക്രിയയ്ക്ക് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; വാവ്-തുടർച്ച ഇവിടെ പുതിയ വിവരണഘട്ടം ആരംഭിക്കുന്നതിനാൽ പ്രത്യേകം ‘പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ഉപസർഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്നു നൽകുന്നു; מֹשֶׁה എന്ന പേര് ‘മോശ’ എന്നു നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘എന്നു പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു. പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിച്ച് വരുന്ന ദൈവവചന-ആമുഖത്തിന് സ്വാഭാവികമായ ‘അരുളിച്ചെയ്തു:’ ഉപയോഗിച്ചു.
