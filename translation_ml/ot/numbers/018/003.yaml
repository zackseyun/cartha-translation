review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Levites as the subject, preserves the singular address in the first duty, and includes both groups in the death warning. However, “കൂടാരം മുഴുവനുമായി ബന്ധപ്പെട്ട ചുമതല” weakens the direct construct expression, “the charge of the whole tent,” by making it merely a duty related to the tent. The final “അല്ലെങ്കിൽ” makes the warning conditional in a way that is understandable but less closely reflects the Hebrew negative purpose/consequence clause.
  naturalness: The Malayalam is generally clear and suitably formal. “നിനക്കു ഏല്പിച്ചിരിക്കുന്ന” requires orthographic joining (“നിനക്കേൽപ്പിച്ചിരിക്കുന്ന”) if retained. A more direct formulation using “നിന്റെ ചുമതല” and “കൂടാരം മുഴുവനുടെയും ചുമതല” is both more idiomatic and closer to the repeated Hebrew term.
  terminology: “കൂടാരം,” “വിശുദ്ധസ്ഥാനത്തിലെ ഉപകരണങ്ങൾ,” and “യാഗപീഠം” are appropriate modern-standard Malayalam renderings. “ചുമതല” consistently represents מִשְׁמֶרֶת well. The rendering retains the priestly boundary without importing interpretive terminology.
  issues:
  - severity: medium
    issue: The second occurrence of מִשְׁמֶרֶת is rendered as a duty merely ‘related to’ the whole tent.
    rationale: “കൂടാരം മുഴുവനുമായി ബന്ധപ്പെട്ട ചുമതല” is broader and less direct than the Hebrew construct phrase. “കൂടാരം മുഴുവനുടെയും ചുമതല” preserves the repeated noun and the tent’s direct relation to the charge.
  - severity: low
    issue: The wording for the first charge is unnecessarily paraphrastic and has an orthographic defect.
    rationale: “നിനക്കു ഏല്പിച്ചിരിക്കുന്ന” should be “നിനക്കേൽപ്പിച്ചിരിക്കുന്ന,” but “നിന്റെ ചുമതല” more directly represents the 2ms suffix and avoids adding the explicit notion of entrustment.
  - severity: low
    issue: “അല്ലെങ്കിൽ” is a somewhat stronger conditional reformulation of the death-warning clause.
    rationale: The Hebrew states the prohibition followed by ‘and they shall not die, both they and you.’ “...മരിക്കാതിരിക്കാൻ” expresses the intended avoided consequence naturally without adding an explicit conditional connector.
  revised_text: അവർ നിന്റെ ചുമതലയും കൂടാരം മുഴുവനുടെയും ചുമതലയും പാലിക്കണം. എന്നാൽ വിശുദ്ധസ്ഥാനത്തിലെ ഉപകരണങ്ങളുടെയോ യാഗപീഠത്തിന്റെയോ അടുത്ത് അവർ ചെല്ലരുത്; അവരും നിങ്ങളും മരിക്കാതിരിക്കാൻ.
