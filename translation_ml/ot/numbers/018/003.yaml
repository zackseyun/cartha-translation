source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: ml
  text: അവർ നിന്റെ ചുമതലയും കൂടാരം മുഴുവനുടെയും ചുമതലയും പാലിക്കണം. എന്നാൽ വിശുദ്ധസ്ഥാനത്തിലെ ഉപകരണങ്ങളുടെയോ യാഗപീഠത്തിന്റെയോ അടുത്ത് അവർ ചെല്ലരുത്; അവരും നിങ്ങളും മരിക്കാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: നിനക്കു ഏല്പിച്ചിരിക്കുന്ന ചുമതല നിർവഹിക്കണം
  rationale: שׁמר + מִשְׁמֶרֶת ഏല്പിക്കപ്പെട്ട കാവൽച്ചുമതലയോ സേവനബാധ്യതയോ പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചുമതല നിർവഹിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ഏകവചനമായ ‘നിനക്കു’ അഹരോനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: കൂടാരം മുഴുവനുമായി ബന്ധപ്പെട്ട ചുമതല
  rationale: ആവർത്തിക്കുന്ന מִשְׁמֶרֶת ഒരേ ‘ചുമതല’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു. אֹהֶל എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കൂടാരം’ ആണ്; כָּל ‘മുഴുവൻ’ എന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻപറഞ്ഞ ചുമതലയ്ക്ക് പിന്നാലെയുള്ള കർശനമായ പരിധി/വിലക്ക് വ്യക്തമാക്കുന്നു.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥാനത്തിലെ ഉപകരണങ്ങളുടെ അടുത്ത്
  rationale: כְּלֵי എന്നത് പാത്രങ്ങൾ, ഉപകരണങ്ങൾ, സാമഗ്രികൾ എന്നിവ ഉൾക്കൊള്ളാം. הַקֹּדֶשׁ ഇവിടെ വിശുദ്ധമേഖലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിശുദ്ധസ്ഥാനത്തിലെ ഉപകരണങ്ങൾ’ എന്നത് ബന്ധം വ്യക്തമാക്കുകയും അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: യാഗപീഠത്തിന്റെയോ അടുത്ത് അവർ ചെല്ലരുത്
  rationale: קרב എന്നതിന്റെ സ്ഥലപരമായ ‘അടുത്തു ചെല്ലുക’ എന്ന ശക്തി നിലനിർത്തുന്നു. നിഷേധവാക്യത്തിൽ രണ്ടു നിരോധിത ലക്ഷ്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘-യുടെയോ ... -ന്റെയോ’ ഉപയോഗിച്ചു.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: അല്ലെങ്കിൽ അവരും നിങ്ങളും മരിക്കും
  rationale: നിരോധനം ലംഘിച്ചാൽ ഉണ്ടാകുന്ന മരണഭീഷണി നേരിട്ട് അറിയിക്കുന്നു. גַם...גַם എന്നത് ‘അവരും നിങ്ങളും’ എന്നായി നൽകി ഇരുകൂട്ടരെയും വ്യക്തമായി ഉൾപ്പെടുത്തി; אַתֶּם ബഹുവചനമായതിനാൽ ‘നിങ്ങളും’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആരാണ് അഭിസംബോധന ചെയ്യപ്പെടുന്നതും ആരെയാണ് നിയന്ത്രിക്കുന്നത്
  choice: സന്ദർഭത്തിൽ അഹരോനോട് ഏകവചനത്തിൽ സംസാരിക്കുകയും ലേവ്യർക്ക് ഏല്പിച്ച ചുമതലയും അവർക്കുള്ള വിശുദ്ധപരിധിയും പ്രസ്താവിക്കുകയും ചെയ്യുന്നു.
  alternative: പുരോഹിതന്മാരെ പൊതുവായി മാത്രം അഭിസംബോധന ചെയ്യുന്നു എന്ന വായന.
  rationale: מִשְׁמַרְתְּךָയിലെ രണ്ടാംപുരുഷ ഏകവചനപ്രത്യയം അഹരോനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മൂന്നാംപുരുഷ ബഹുവചനം ലേവ്യരെ സൂചിപ്പിക്കുന്നു.
- issue: മരണഭീഷണിയിൽ ഉൾപ്പെടുന്നവർ
  choice: വിശുദ്ധപരിധി ലംഘിക്കപ്പെട്ടാൽ ലേവ്യരും അഭിസംബോധന ചെയ്യപ്പെടുന്ന അഹരോൻ ഉൾപ്പെടുന്ന പുരോഹിതസംഘവും മരണത്തിന് വിധേയരാകാം.
  alternative: ലേവ്യർ മാത്രം മരിക്കും എന്ന വായന.
  rationale: גַם הֵם גַּם אַתֶּם ‘അവരും നിങ്ങളും’ എന്ന് ഇരുകൂട്ടരെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു. വാക്യം നിർണ്ണയിക്കുന്നതിലപ്പുറം മരണത്തിന്റെ പ്രവർത്തനരീതി വിശദീകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവത്തോടെയും വിവർത്തനം ചെയ്തു. ‘തിരുനിവാസം’ എന്ന സാങ്കേതിക പദം ചേർക്കാതെ אֹהֶל എന്നതിന്റെ നേരിട്ടുള്ള ‘കൂടാരം’ നിലനിർത്തി. മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണങ്ങൾ ഒഴിവാക്കി.
