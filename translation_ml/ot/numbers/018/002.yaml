  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: ml
  text: കൂടാതെ, ലേവി ഗോത്രത്തിൽപ്പെട്ട നിന്റെ സഹോദരന്മാരെ—നിന്റെ പിതാവിന്റെ ഗോത്രക്കാരെ—നിന്റെ അടുക്കലേക്കു കൊണ്ടുവരിക. അവർ നിന്നോടു ചേർന്ന്[a] നിന്നെ സേവിക്കട്ടെ. അതേസമയം, നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും സാക്ഷ്യത്തിന്റെ കൂടാരത്തിന്റെ[b] മുമ്പിൽ ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നെ അനുഗമിച്ച്’ അല്ലെങ്കിൽ ‘നിന്നോടു ബന്ധപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ ‘ലേവി’ എന്ന പേരിനെയും ഓർമിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘സാക്ഷ്യത്തിന്റെ കൂടാരം’ എന്നാണ്; ബന്ധപ്പെട്ട കൂടാരപ്രയോഗങ്ങളുടെ പരിചയം കാരണം ചില പരിഭാഷകൾ ഇവിടെ ‘സമാഗമകൂടാരം’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: കൂടാതെ
  rationale: ആരംഭത്തിലെ സംയോജകത്തിന്റെയും അധികം ചേർക്കുന്ന അവ്യയത്തിന്റെയും അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אַחֶיךָ
  choice: നിന്റെ സഹോദരന്മാരായ
  rationale: സന്ദർഭത്തിൽ അഹരോന്റെ സഹലേവ്യരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായത്തിലെ കുടുംബബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: מַטֵּה לֵוִי
  choice: ലേവിയുടെ ഗോത്രത്തെ
  rationale: ഇവിടെ מַטֶּה ഒരു ദണ്ഡിനെയല്ല, ഗോത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: שֵׁבֶט אָבִיךָ
  choice: നിന്റെ പിതൃഗോത്രത്തെ
  rationale: ലേവിയുടെ ഗോത്രത്തെ അഹരോന്റെ പിതൃപരമ്പരയിലെ ഗോത്രമായി വീണ്ടും തിരിച്ചറിയുന്ന സമാനാധികരണപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הַקְרֵב אִתָּךְ
  choice: നിന്നോടൊപ്പം അടുപ്പിച്ചുകൊള്ളുക
  rationale: קרב എന്ന ക്രിയയുടെ ‘അടുത്തേക്കു കൊണ്ടുവരുക/അടുപ്പിക്കുക’ എന്ന ആരാധനാസേവനസൂചനയും אִתָּךְ എന്നതിന്റെ സഹവർത്തിത്വവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: അവർ നിന്നോടു ചേർന്ന്
  rationale: ലേവ്യർ അഹരോനോടു ബന്ധപ്പെട്ടു സേവിക്കണമെന്ന ആശയം നൽകുന്നു; ക്രിയയും ‘ലേവി’ എന്ന പേരും തമ്മിലുള്ള എബ്രായ ശബ്ദാർഥബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וִישָׁרְתוּךָ
  choice: നിന്നെ സേവിക്കട്ടെ
  rationale: שרת എന്നതിന്റെ നേരിട്ടുള്ള സേവനാർഥം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: അതേസമയം, നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും
  rationale: ലേവ്യരുടെ സഹായസേവനവും അഹരോന്റെയും പുത്രന്മാരുടെയും പുരോഹിതസ്ഥാനവും തമ്മിലുള്ള വാക്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: സാക്ഷ്യത്തിന്റെ കൂടാരത്തിനു മുമ്പിൽ
  rationale: ഇവിടെ മൂലപാഠം പറയുന്ന ‘സാക്ഷ്യത്തിന്റെ കൂടാരം’ എന്ന പ്രത്യേക പ്രയോഗം നിലനിർത്തുന്നു; പരിചിതമായ ‘സമാഗമകൂടാരം’ എന്നു ഏകീകരിക്കുന്നില്ല.
theological_decisions:
- issue: אֹהֶל הָעֵדֻת എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: സാക്ഷ്യത്തിന്റെ കൂടാരം
  alternative: സമാഗമകൂടാരം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപാഠം ‘സാക്ഷ്യം’ എന്നാണ് പറയുന്നത്. ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ‘സമാഗമകൂടാരം’ എന്ന പരിചിതപ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ മൂലപാഠത്തിലെ ഉടമ്പടി-സാക്ഷ്യസൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതൃഗോത്രം’, ‘സാക്ഷ്യത്തിന്റെ കൂടാരം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ഘടനയും പ്രത്യേകതയും നിലനിർത്തുന്നു. ദീർഘമായ എബ്രായവാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
