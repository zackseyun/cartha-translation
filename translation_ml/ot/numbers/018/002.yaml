revisions:
- from: കൂടാതെ, നിന്റെ സഹോദരന്മാരായ ലേവിയുടെ ഗോത്രത്തെ—നിന്റെ പിതൃഗോത്രത്തെ—നിന്നോടൊപ്പം അടുപ്പിച്ചുകൊള്ളുക. അവർ നിന്നോടു ചേർന്ന്[a] നിന്നെ സേവിക്കട്ടെ. അതേസമയം, നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും സാക്ഷ്യത്തിന്റെ കൂടാരത്തിനു മുമ്പിൽ ആയിരിക്കണം.[b]
  to: കൂടാതെ, ലേവി ഗോത്രത്തിൽപ്പെട്ട നിന്റെ സഹോദരന്മാരെ—നിന്റെ പിതാവിന്റെ ഗോത്രക്കാരെ—നിന്റെ അടുക്കലേക്കു കൊണ്ടുവരിക. അവർ നിന്നോടു ചേർന്ന്[a] നിന്നെ സേവിക്കട്ടെ. അതേസമയം, നീയും നിന്നോടൊപ്പമുള്ള നിന്റെ പുത്രന്മാരും സാക്ഷ്യത്തിന്റെ കൂടാരത്തിന്റെ[b] മുമ്പിൽ ആയിരിക്കണം.
  rationale: The revision uses a direct, natural imperative for bringing the Levites near, clarifies that Aaron's brothers are members of Levi, renders ‘your father's tribe’ transparently, and moves footnote [b] to its proper textual anchor. It retains the source-specific ‘tent of the testimony’ and does not add interpretive theological content.
