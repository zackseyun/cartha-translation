source:
  edition: WLC
  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: ml
  text: എണ്ണയുടെ ഏറ്റവും നല്ലതെല്ലാം[a], പുതുവീഞ്ഞിന്റെയും ധാന്യത്തിന്റെയും ഏറ്റവും നല്ലതെല്ലാം—അവർ യഹോവയ്ക്കു നൽകുന്ന അവയുടെ ആദ്യഫലങ്ങൾ—ഞാൻ നിനക്കു നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘എണ്ണയുടെ കൊഴുപ്പ്’; എണ്ണ, പുതുവീഞ്ഞ്, ധാന്യം എന്നിവയുടെ ഏറ്റവും സമൃദ്ധമായ അഥവാ ശ്രേഷ്ഠമായ ഭാഗം എന്നർഥമുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: ഏറ്റവും നല്ല ഭാഗം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘കൊഴുപ്പ്’ എന്നാണെങ്കിലും കാർഷിക ഉത്പന്നങ്ങളെക്കുറിച്ചുള്ള ഈ പ്രയോഗത്തിൽ അത് ഏറ്റവും സമൃദ്ധമായ അഥവാ ശ്രേഷ്ഠമായ ഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יִצְהָר
  choice: എണ്ണ
  rationale: സാധാരണയായി പുതുതായി ഉത്പാദിപ്പിച്ച ഒലിവെണ്ണയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘ഒലിവ്’ മൂലപദത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ ‘എണ്ണ’ നിലനിർത്തുന്നു.
- source_word: תִּירוֹשׁ
  choice: പുതുവീഞ്ഞ്
  rationale: വീഞ്ഞിനുള്ള പൊതുപദത്തേക്കാൾ പുതുതായി ഉത്പാദിപ്പിച്ച വീഞ്ഞിനെ സൂചിപ്പിക്കുന്ന പദമായതിനാൽ ഈ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: דָגָן
  choice: ധാന്യം
  rationale: വിവിധ ധാന്യവിളകളെ ഉൾക്കൊള്ളുന്ന വിശാലമായ കാർഷികപദത്തിന് സ്വാഭാവികമായ മലയാള തുല്യം.
- source_word: רֵאשִׁיתָם
  choice: അവയുടെ ആദ്യഫലങ്ങൾ
  rationale: വഴിപാടിന്റെ പശ്ചാത്തലത്തിൽ ഉത്പന്നങ്ങളുടെ ആദ്യഭാഗത്തെയോ ആദ്യവിളവിനെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആദ്യഫലങ്ങൾ’ അനുയോജ്യമാണ്.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: അവർ യഹോവയ്ക്കു നൽകുന്ന
  rationale: נתן എന്ന ‘നൽകുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ബന്ധവാക്യത്തിന്റെ സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ വ്യക്തിപരമായ നാമമായി ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: לְךָ נְתַתִּים
  choice: ഞാൻ നിനക്കു നൽകിയിരിക്കുന്നു
  rationale: പൂർണക്രിയ ഈ വിഹിതം ഉറപ്പിച്ചുനൽകിയ കാര്യമായി അവതരിപ്പിക്കുന്നു; മുൻപറഞ്ഞ വസ്തുക്കൾ ക്രിയയുടെ കർമമായതിനാൽ മലയാളത്തിൽ അധിക സർവനാമം ആവശ്യമില്ല.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിപരമായ ദൈവനാമം ഉള്ളതിനാൽ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം അതിന്റെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ പട്ടികാസംരചനയും ഇടയ്ക്കുള്ള വിശദീകരണവാക്യവും ദീർഘവരകളിലൂടെ നിലനിർത്തി; ഏകവചന അഭിസംബോധനയ്ക്ക് ‘നിനക്കു’ ഉപയോഗിച്ചു.
