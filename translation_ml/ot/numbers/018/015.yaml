revisions:
- from: എല്ലാ ജീവജാലങ്ങളിലും യഹോവയ്ക്കു സമർപ്പിക്കുന്ന, ഗർഭപാത്രം തുറക്കുന്ന ഓരോ കടിഞ്ഞൂലും[a]—മനുഷ്യന്റേതായാലും മൃഗത്തിന്റേതായാലും—നിനക്കുള്ളതായിരിക്കും. എന്നാൽ മനുഷ്യന്റെ കടിഞ്ഞൂലിനെ നീ തീർച്ചയായും വീണ്ടെടുക്കണം; അശുദ്ധമൃഗത്തിന്റെ കടിഞ്ഞൂലിനെയും നീ വീണ്ടെടുക്കണം.[b]
  to: സകല ജീവികളിലും, യഹോവയ്ക്കു അവർ സമർപ്പിക്കുന്ന[b] ഗർഭപാത്രം തുറക്കുന്ന ഓരോ കടിഞ്ഞൂലും[a]—മനുഷ്യന്റേതായാലും മൃഗത്തിന്റേതായാലും—നിനക്കുള്ളതായിരിക്കും. എങ്കിലും, മനുഷ്യന്റെ കടിഞ്ഞൂലിനെ നീ തീർച്ചയായും വീണ്ടെടുക്കണം; അശുദ്ധമൃഗത്തിന്റെ കടിഞ്ഞൂലിനെയും നീ വീണ്ടെടുക്കണം.
  rationale: The revision retains the draft’s meaning while more closely representing the plural verb ‘they present’ and aligning the second footnote with the Hebrew presentation verb. It removes an explanatory assertion not expressed in this verse and preserves the source’s distinction that human and unclean-animal firstborn are redeemed.
