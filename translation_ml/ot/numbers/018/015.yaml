id: NUM.18.15
reference: Numbers 18:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: ml
  text: സകല ജീവികളിലും, യഹോവയ്ക്കു അവർ സമർപ്പിക്കുന്ന[b] ഗർഭപാത്രം തുറക്കുന്ന ഓരോ കടിഞ്ഞൂലും[a]—മനുഷ്യന്റേതായാലും മൃഗത്തിന്റേതായാലും—നിനക്കുള്ളതായിരിക്കും. എങ്കിലും, മനുഷ്യന്റെ കടിഞ്ഞൂലിനെ നീ തീർച്ചയായും വീണ്ടെടുക്കണം; അശുദ്ധമൃഗത്തിന്റെ കടിഞ്ഞൂലിനെയും നീ വീണ്ടെടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗർഭപാത്രം തുറക്കുന്നതെല്ലാം.” ഈ എബ്രായ പ്രയോഗം ഗർഭത്തിൽനിന്ന് ആദ്യം പുറത്തുവരുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യഹോവയ്ക്കു അർപ്പിക്കുന്ന.” എബ്രായ ക്രിയയ്ക്ക് സമർപ്പണസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക’ അല്ലെങ്കിൽ ‘അർപ്പിക്കുക’ എന്നും അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: ഗർഭപാത്രം തുറക്കുന്ന ഓരോ കടിഞ്ഞൂലും
  rationale: ആദ്യമായി ഗർഭത്തിൽനിന്നു പുറത്തുവരുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുന്നു; ‘കടിഞ്ഞൂൽ’ ആധുനിക മലയാളത്തിൽ ആദ്യസന്തതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: എല്ലാ ജീവജാലങ്ങളിലും ... ഓരോ
  rationale: לְכָל בָּשָׂר എന്നതിന്റെ സമഗ്രമായ വ്യാപ്തി വ്യക്തമാക്കുകയും മനുഷ്യനും മൃഗവും ഉൾപ്പെടുന്ന ജീവികളെയെല്ലാം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: യഹോവയ്ക്കു സമർപ്പിക്കുന്ന
  rationale: הקריב എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്. മനുഷ്യരുടെ കടിഞ്ഞൂലും ഉൾപ്പെടുന്നതിനാൽ എല്ലായിടത്തും യാഗാർപ്പണം സൂചിപ്പിക്കുന്ന കൂടുതൽ സങ്കുചിതമായ പദം ഒഴിവാക്കി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: മനുഷ്യന്റേതായാലും മൃഗത്തിന്റേതായാലും
  rationale: മനുഷ്യൻ, മൃഗം എന്നീ രണ്ടു വിഭാഗങ്ങളിലേക്കുള്ള പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יִהְיֶה לָּךְ
  choice: നിനക്കുള്ളതായിരിക്കും
  rationale: പുരോഹിതന് അവകാശപ്പെട്ടതാണെന്ന ആശയം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: אַךְ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അവകാശത്തിന് പിന്നാലെ വരുന്ന നിർണായകമായ നിയന്ത്രണവും വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: פָּדֹה תִפְדֶּה
  choice: നീ തീർച്ചയായും വീണ്ടെടുക്കണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്നുള്ള എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ എന്നും കല്പനയുടെ നിർബന്ധം ‘വേണം’ എന്നും പകർന്നു നൽകുന്നു.
- source_word: בְּכוֹר הָאָדָם
  choice: മനുഷ്യന്റെ കടിഞ്ഞൂൽ
  rationale: മൃഗത്തോടു വിപരീതമായി മനുഷ്യസന്തതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ലിംഗപരമായി അനാവശ്യമായി പരിമിതപ്പെടുത്താത്തതുമായ രൂപം.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: അശുദ്ധമൃഗത്തിന്റെ കടിഞ്ഞൂൽ
  rationale: യാഗത്തിന് യോഗ്യമല്ലാത്ത ആചാരപരമായി അശുദ്ധമായ മൃഗത്തിന്റെ ആദ്യസന്തതിയെ അടുത്തായി പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദം മൃഗത്തോടുള്ള വിപരീതത്തിൽ
  choice: മനുഷ്യൻ
  alternative: മനുഷ്യവർഗം; പുരുഷൻ
  rationale: ഇവിടെ ലിംഗമല്ല, മനുഷ്യനും മൃഗവും തമ്മിലുള്ള വിഭാഗവ്യത്യാസമാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ ‘മനുഷ്യൻ’ ആശയം കൃത്യമായി നൽകുന്നു.
- issue: കടിഞ്ഞൂലിന്മേലുള്ള പുരോഹിതാവകാശത്തിന്റെ സ്വഭാവം
  choice: മനുഷ്യന്റെയും അശുദ്ധമൃഗത്തിന്റെയും കടിഞ്ഞൂൽ യഹോവയ്ക്കു സമർപ്പിക്കപ്പെടുകയും പുരോഹിതന് അവകാശപ്പെടുകയും ചെയ്യുന്നു, എന്നാൽ അവയെ നിർബന്ധമായി വീണ്ടെടുക്കണം
  alternative: ‘സമർപ്പിക്കുക’ എന്നത് എല്ലാ കടിഞ്ഞൂലിനെയും യാഗമായി കൊല്ലുന്നതായി വായിക്കുക
  rationale: വാക്യത്തിലെ തന്നെ തുടർന്നുള്ള വ്യവസ്ഥ മനുഷ്യന്റെയും അശുദ്ധമൃഗത്തിന്റെയും കടിഞ്ഞൂൽ യാഗം ചെയ്യുന്നതല്ല, വീണ്ടെടുക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കടിഞ്ഞൂൽ’, ‘വീണ്ടെടുക്കുക’ എന്നീ വേദപാരമ്പര്യപദങ്ങൾ സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ നിലനിർത്തി; വാക്യഘടന വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കി.
