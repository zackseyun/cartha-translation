language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: ml
  text: 'ഒരു മാസം പ്രായമായതുമുതൽ വീണ്ടെടുക്കേണ്ടവരെ നീ നിന്റെ മൂല്യനിർണയപ്രകാരം വീണ്ടെടുക്കണം: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കമനുസരിച്ച് അഞ്ചു ശേക്കേൽ വെള്ളി; അത് ഇരുപത് ഗേരയാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി: “ആ ശേക്കേൽ ഇരുപത് ഗേരയാണ്.” എബ്രായത്തിലെ “അത്” എന്ന സർവനാമം മാനദണ്ഡമായി ഉപയോഗിച്ച വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേലിനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: വീണ്ടെടുക്കേണ്ടവരെ
  rationale: പദേ എന്ന ധാതുവിൽനിന്നുള്ള ഈ കർമണിപ്രയോഗരൂപവും ഏകവചന പ്രത്യയവും വാക്യഘടനാപരമായി ദുഷ്കരമാണ്. സന്ദർഭത്തിൽ പണം നൽകി വീണ്ടെടുക്കേണ്ട ആദ്യജാതരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ കർമണാർത്ഥമുള്ള ബഹുവചനപ്രയോഗം സ്വീകരിച്ചു.
- source_word: מִבֶּן חֹדֶשׁ
  choice: ഒരു മാസം പ്രായംമുതൽ
  rationale: വീണ്ടെടുപ്പ് ബാധകമാകുന്ന പ്രായപരിധി ഒരു മാസം പൂർത്തിയായതുമുതൽ ആരംഭിക്കുന്നു എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: תִּפְדֶּה
  choice: നീ ... വീണ്ടെടുക്കണം
  rationale: നിയമനിർദേശത്തിലുള്ള രണ്ടാംപുരുഷ ഏകവചന അപൂർണക്രിയ നിർബന്ധസ്വഭാവമുള്ള നിർദേശമാണ്; പുരോഹിതനോടുള്ള ഏകവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: בְּעֶרְכְּךָ
  choice: നിന്റെ മൂല്യനിർണയപ്രകാരം
  rationale: പുരോഹിത-നിയമപരമായ പശ്ചാത്തലത്തിൽ ערך നിശ്ചയിച്ച മൂല്യത്തെയോ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്നു; രണ്ടാംപുരുഷ ഏകവചന പ്രത്യയവും വ്യക്തമാക്കുന്നു.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: അഞ്ചു ശേക്കേൽ വെള്ളി
  rationale: അളവും വസ്തുവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതോടൊപ്പം മൂലപാഠത്തിലെ നാണയ/തൂക്കപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ തൂക്കമനുസരിച്ച്
  rationale: ഇത് വിലനിർണയത്തിനുള്ള ഔദ്യോഗിക തൂക്കമാനദണ്ഡമാണെന്ന് വ്യക്തമാക്കുന്നു; 'വിശുദ്ധ ശേക്കേൽ' എന്ന അസ്വാഭാവികവും അർത്ഥസന്ദിഗ്ധവുമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: അത് ഇരുപത് ഗേരയാണ്
  rationale: എബ്രായത്തിലെ 'അത്' എന്ന സർവനാമത്തിന്റെ രൂപം നിലനിർത്തുന്നു. അത് വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേലിനെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. 'ശേക്കേൽ', 'ഗേര' എന്നീ ചരിത്രപരമായ തൂക്കനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു. മൂലപാഠത്തിലെ ദുഷ്കരമായ നാമരൂപത്തിന്റെ പൊതുവായ നിയമപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും സർവനാമത്തിലെ പരാമർശസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്തു.
