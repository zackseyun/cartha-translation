  to: അങ്ങനെ, ഇസ്രായേൽമക്കളിൽനിന്ന്[a] നിങ്ങൾ സ്വീകരിക്കുന്ന നിങ്ങളുടെ എല്ലാ ദശാംശങ്ങളിൽനിന്നും നിങ്ങളും യഹോവയ്ക്കുള്ള വിഹിതം വേർതിരിച്ചു സമർപ്പിക്കണം; അതിൽനിന്ന് യഹോവയ്ക്കുള്ള വിഹിതം പുരോഹിതനായ അഹരോന് കൊടുക്കണം.
