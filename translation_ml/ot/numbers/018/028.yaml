  source_fidelity: 'മുഖ്യപാഠം ഹീബ്രു വാക്യഘടനയും അർഥവും വിശ്വസ്തമായി അറിയിക്കുന്നു: ലേവ്യർ ഇസ്രായേൽമക്കളിൽനിന്ന് സ്വീകരിക്കുന്ന ദശാംശങ്ങളിൽനിന്ന് യഹോവയ്ക്കുള്ള ഒരു വിഹിതം വേർതിരിച്ചു അഹരോൻ പുരോഹിതന്നു നൽകണം. ‘സ്വീകരിക്കുന്ന,’ ‘എല്ലാ ദശാംശങ്ങളിൽനിന്നും,’ ‘അതിൽനിന്ന്,’ ‘പുരോഹിതനായ അഹരോന്’ എന്നിവ മൂലപാഠത്തോടു യോജിക്കുന്നു.'
