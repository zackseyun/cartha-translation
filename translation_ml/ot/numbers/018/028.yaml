id: NUM.18.28
reference: Numbers 18:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: ml
  text: അങ്ങനെ, ഇസ്രായേൽമക്കളിൽനിന്ന്[a] നിങ്ങൾ സ്വീകരിക്കുന്ന നിങ്ങളുടെ എല്ലാ ദശാംശങ്ങളിൽനിന്നും നിങ്ങളും യഹോവയ്ക്കുള്ള വിഹിതം വേർതിരിച്ചു സമർപ്പിക്കണം; അതിൽനിന്ന് യഹോവയ്ക്കുള്ള വിഹിതം പുരോഹിതനായ അഹരോന് കൊടുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽമക്കൾ” എന്നതിന് “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കൾ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: അങ്ങനെ
  rationale: മുൻനിർദേശത്തോടുള്ള അനുരൂപതയും അതിൽനിന്നുള്ള നിഗമനവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: תָּרִימוּ
  choice: അർപ്പിക്കണം
  rationale: רום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം תְּרוּמָהയോടൊപ്പം ഒരു വിഹിതം വേർതിരിച്ച് സമർപ്പിക്കുന്ന ആചാരപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; പദശഃമായ ‘ഉയർത്തണം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: גַם אַתֶּם
  choice: നിങ്ങളും
  rationale: ഇസ്രായേൽമക്കളെപ്പോലെ ലേവ്യരും ഒരു വിഹിതം വേർതിരിക്കണമെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: תְּרוּמַת יְהוָה
  choice: യഹോവയ്ക്കുള്ള അർപ്പിതവിഹിതം
  rationale: תְּרוּמָה എന്നത് വേർതിരിച്ചു സമർപ്പിക്കുന്ന വിഹിതമാണ്; ‘അർപ്പിതവിഹിതം’ അതിന്റെ സമർപ്പണസ്വഭാവവും ഒരു ഭാഗം എന്ന ആശയവും നിലനിർത്തുന്നു. ബന്ധം സ്വീകർത്താവിനെയോ സമർപ്പിത ഉടമസ്ഥതയെയോ സൂചിപ്പിക്കാവുന്നതിനാൽ ‘യഹോവയ്ക്കുള്ള’ എന്ന് നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമത്തെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ ദശാംശങ്ങളിൽനിന്നും
  rationale: ബഹുവചനവും ‘നിന്ന്’ എന്ന ഭാഗികതാസൂചനയും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽനിന്ന് നിങ്ങൾ സ്വീകരിക്കുന്ന
  rationale: לקח സാധാരണയായി ‘എടുക്കുക’ എന്നാണെങ്കിലും ഇവിടെ നിയമാനുസൃതമായി ദശാംശം ലഭിക്കുന്നതായതിനാൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; בְּנֵי יִשְׂרָאֵל എന്ന ഘടന ‘ഇസ്രായേൽമക്കൾ’ ആയി നിലനിർത്തി.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: അതിൽനിന്ന് ... കൊടുക്കണം
  rationale: ലഭിച്ച ദശാംശത്തിൽനിന്നുള്ള ഒരു ഭാഗമാണ് കൊടുക്കേണ്ടതെന്ന ഭാഗികത വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്
  rationale: לְ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ദാതൃവിഭക്തി ഉപയോഗിച്ചു; സ്ഥാനപ്പേര് മലയാളത്തിൽ സ്വാഭാവികമായി മുൻപാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷമായുള്ള ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ പേരായി നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഹീബ്രു ഉടമ്പടിപ്രയോഗത്തിന്റെ രൂപവും കൂട്ടായ അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: תְּרוּמַת יְהוָהയിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: യഹോവയ്ക്കുള്ള അർപ്പിതവിഹിതം
  alternative: യഹോവയുടെ അർപ്പിതവിഹിതം
  rationale: ഹീബ്രു സംയുക്തപ്രയോഗം ഉടമസ്ഥതയെയോ യഹോവയ്ക്കായി സമർപ്പിച്ച വിഹിതത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ സമർപ്പണദിശ വ്യക്തമാക്കിക്കൊണ്ട് ദൈവിക ഉടമസ്ഥത നിഷേധിക്കാത്ത രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആചാരപരമായ സാങ്കേതികത നിലനിർത്താൻ ‘അർപ്പിതവിഹിതം’, പരിചിതമായ ദശാംശപദപ്രയോഗത്തിനായി ‘ദശാംശം’ എന്നിവ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
