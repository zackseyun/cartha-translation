  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: ml
  text: അവർ ഹോർ-ഹഗ്ഗിദ്ഗാദിൽനിന്ന് പുറപ്പെട്ട് യൊത്വാഥായിൽ പാളയമടിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ യാത്രാക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: ഹോർ-ഹഗ്ഗിദ്ഗാദിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം ചേർത്ത് സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. സംയുക്തനാമത്തിന്റെ ഘടകബന്ധം ഹൈഫൻകൊണ്ട് നിലനിർത്തി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമടിച്ചു
  rationale: യാത്രാവിവരണത്തിൽ חנה താവളമിട്ട് താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമടിച്ചു’ മാന്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּיָטְבָתָה
  choice: യൊത്ബാഥയിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ‘യിൽ’ എന്നു നൽകി; സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാത്രാതാവളങ്ങളുടെ ആവർത്തനസൂത്രം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നിലനിർത്തി. സ്ഥലനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരിച്ചു.
