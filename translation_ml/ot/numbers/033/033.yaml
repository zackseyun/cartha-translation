    issue: The spelling “യൊത്ബാഥയിൽ” does not preserve the Hebrew consonantal value in יָטְבָתָה.
    rationale: The ב in טְבָ is unpointed for dagesh and is read /v/ in the Masoretic form; a source-first transliteration should therefore use “ത്വ,” not “ത്ബ.” The final -ah of the place name is best retained as “-ഥാ” before the locative suffix.
