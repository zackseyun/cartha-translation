  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/מֹּסֵר֑וֹת וַֽ/יַּחֲנ֖וּ בִּ/בְנֵ֥י יַעֲקָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: ml
  text: അവർ മോസേരോത്തിൽനിന്ന് പുറപ്പെട്ട് ബെനേ-യാക്കാനിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെനേ-യാക്കാൻ’ എന്ന എബ്രായപേരിന്റെ അക്ഷരാർഥം ‘യാക്കാന്റെ പുത്രന്മാർ’ എന്നാണ്; എന്നാൽ ഇവിടെ അത് ഒരു സ്ഥലനാമമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രാവിവരണത്തിൽ נסע എന്ന ക്രിയ പാളയം പിരിച്ച് യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും ആവർത്തിത യാത്രാസൂത്രത്തിന് യോജിച്ചതുമാണ്.
- source_word: מִמֹּסֵרֹות
  choice: മോസേരോത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം ‘-ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി. സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ‘മോസേരോത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രാവിവരണങ്ങളിൽ താൽക്കാലികമായി തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בִּבְנֵי יַעֲקָן
  choice: ബെനേ-യാക്കാനിൽ
  rationale: בְּ എന്ന ഉപസർഗം സ്ഥലസൂചനയായി ‘-ൽ’ എന്നു നൽകി. പദസമുച്ചയത്തിന് അക്ഷരാർഥത്തിൽ ‘യാക്കാന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ അത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; മുഖ്യവാക്യത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
