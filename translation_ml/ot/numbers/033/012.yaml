source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: ml
  text: അവർ സീൻ മരുഭൂമിയിൽനിന്ന് പുറപ്പെട്ടു ദൊഫ്കായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִמִּדְבַּר
  choice: മരുഭൂമിയിൽനിന്ന്
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനപ്രദേശത്തെയോ മരുഭൂമിയെയോ സൂചിപ്പിക്കാം; ഈ യാത്രാസന്ദർഭത്തിൽ പതിവും വ്യക്തവുമായ ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: סִין
  choice: സീൻ
  rationale: ഇത് ഒരു പ്രദേശനാമമാണ്; അർത്ഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്തവിധം ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ താൽക്കാലികമായി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ യാത്രാവിവരണത്തിന് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּדָפְקָה
  choice: ദൊഫ്കയിൽ
  rationale: בְּ സ്ഥലസൂചന നൽകുന്നു; സ്ഥലപ്പേരിനോട് മലയാളത്തിലെ ‘-യിൽ’ ചേർത്ത് സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹീബ്രു യാത്രാപട്ടികയുടെ സംക്ഷിപ്തമായ ക്രമം നിലനിർത്തി. ഇംഗ്ലീഷിൽ ആവശ്യമായ ‘Sin’ എന്ന പേരിനെക്കുറിച്ചുള്ള വിശദീകരണം മലയാളത്തിൽ പ്രസക്തമല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
