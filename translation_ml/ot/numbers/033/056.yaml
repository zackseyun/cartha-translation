  revised_text: 'അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും: അവരോടു ചെയ്യാൻ ഞാൻ ഉദ്ദേശിച്ചതുപോലെതന്നെ നിങ്ങളോടും ഞാൻ ചെയ്യും.'
