  terminology: The direct first-person divine warning and the neutral ‘അവരോടു / നിങ്ങളോടും’ are well chosen. No theological terminology requires adjustment. The proposed footnote’s ‘നിശ്ചയിച്ചു’ overstates the lexical alternative slightly and is not needed to preserve a material ambiguity.
