source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֥ר דִּמִּ֛יתִי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם אֶֽעֱשֶׂ֥ה לָ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/056.yaml
  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: ml
  text: 'അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും: അവരോടു ചെയ്യാൻ ഞാൻ ഉദ്ദേശിച്ചതുപോലെതന്നെ നിങ്ങളോടും ഞാൻ ചെയ്യും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: അപ്പോൾ സംഭവിക്കുക ഇതായിരിക്കും
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ ഫലം അവതരിപ്പിക്കുന്ന ഭാവികാല ഹീബ്രു പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר
  choice: ഉദ്ദേശിച്ചതുപോലെതന്നെ
  rationale: തുടർന്നുവരുന്ന രണ്ടു പ്രവൃത്തികൾ തമ്മിലുള്ള കൃത്യമായ സമാനത സൂചിപ്പിക്കുന്ന ‘as/just as’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: דִּמִּיתִי
  choice: ഞാൻ ഉദ്ദേശിച്ചത്
  rationale: ഇവിടെ പീയേൽ രൂപം വെറും ചിന്തയെയല്ല, ചെയ്യാനുള്ള ദൃഢമായ ഉദ്ദേശ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉദ്ദേശിച്ചത്’ അതിനെ അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ വ്യക്തമാക്കുന്നു.
- source_word: לַעֲשׂוֹת ... אֶעֱשֶׂה
  choice: ചെയ്യാൻ ... ഞാൻ ചെയ്യും
  rationale: ഒരേ ഹീബ്രു ധാതുവിന്റെ ആവർത്തനവും മുന്നറിയിപ്പിലെ ശക്തമായ സമാന്തരതയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָהֶם ... לָכֶם
  choice: അവരോടു ... നിങ്ങളോടും
  rationale: പ്രവൃത്തിയുടെ പരോക്ഷ കർമങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ശിക്ഷാത്മക സ്വഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ‘എതിരായി’ എന്ന ആശയം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മുന്നറിയിപ്പിന്റെ ദൈവിക ന്യായവിധിസ്വഭാവം
  choice: അവരോടു ചെയ്യാൻ ഉദ്ദേശിച്ച അതേവിധത്തിലുള്ള പ്രവൃത്തി ഇസ്രായേലിനോടും ചെയ്യുമെന്ന നേരിട്ടുള്ള മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി.
  alternative: ദൈവിക ഉദ്ദേശ്യത്തിന് ഊന്നൽ നൽകാതെ, ഒരു പൊതുവായ പരിണതഫലമായി മൃദുവാക്കി വായിക്കുക.
  rationale: വാക്യം ദൈവത്തിന്റെ ഒന്നാംപുരുഷ പ്രസ്താവനയും രണ്ടു പ്രവൃത്തികളുടെ വ്യക്തമായ സമാന്തരതയും ഉപയോഗിക്കുന്നു. അതിനാൽ മുന്നറിയിപ്പിന്റെ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത ശിക്ഷാവിവരങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സംഭവിക്കുക ഇതായിരിക്കും’ എന്ന അവതരണം ഹീബ്രു ഫലസൂചക പ്രയോഗത്തെ വ്യക്തമാക്കുന്നു; ‘അവരോടു/നിങ്ങളോടും’ എന്ന സമാന്തരഘടന മൂലപാഠത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
