  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി. ഹീബ്രു വാക്യത്തിലെ സംഭവക്രമവും സ്ഥലസൂചനകളും നിലനിർത്തി; അനാവശ്യ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
