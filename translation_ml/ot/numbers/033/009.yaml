id: NUM.33.9
reference: Numbers 33:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: ml
  text: അവർ മാരയിൽനിന്ന് പുറപ്പെട്ട് ഏലീമിൽ എത്തി. ഏലീമിൽ പന്ത്രണ്ട് നീരുറവുകളും എഴുപത് ഈന്തപ്പനകളും ഉണ്ടായിരുന്നു; അവർ അവിടെ പാളയമടിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയ യാത്രാവിവരണങ്ങളിൽ പാളയം വിട്ട് യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִמָּרָה
  choice: മാറായിൽനിന്ന്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു; מִן എന്ന ബന്ധകത്തിന്റെ വേർപാടുസൂചന ‘-യിൽനിന്ന്’കൊണ്ട് വ്യക്തമാക്കി.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא ഇവിടെ ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാള യാത്രാവിവരണത്തിൽ ‘എത്തി’ സ്വാഭാവികമാണ്.
- source_word: אֵילִמָה / בְאֵילִם
  choice: ഏലീമിൽ / ഏലീമിൽ
  rationale: ആദ്യ രൂപത്തിലെ ദിശാസൂചന മലയാളത്തിൽ ‘എത്തി’ എന്ന ക്രിയയും ‘-യിൽ’ വിഭക്തിയും ചേർന്ന് പ്രകടമാക്കുന്നു; രണ്ടാമത്തേത് സ്ഥലസൂചനയായി അതേ വിഭക്തിയിൽ നൽകി. സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: പന്ത്രണ്ട്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: עֵינֹת מַיִם
  choice: നീരുറവുകൾ
  rationale: עַיִן ഇവിടെ കുഴിച്ച കിണറുകളെയല്ല, സ്വാഭാവിക ജലസ്രോതസ്സുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നീരുറവുകൾ’ അർത്ഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וְשִׁבְעִים
  choice: എഴുപത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം; തുടർന്നുള്ള നാമവുമായി സ്വാഭാവികമായി ചേർത്തു.
- source_word: תְּמָרִים
  choice: ഈന്തപ്പനകൾ
  rationale: תָּמָר സാധാരണയായി ഈന്തപ്പനയെ സൂചിപ്പിക്കുന്നു. ‘പനകൾ’ എന്ന പൊതുപദത്തേക്കാൾ കൃത്യവും മലയാളത്തിൽ പരിചിതവുമായ രൂപമാണിത്.
- source_word: וַיַּחֲנוּ שָׁם
  choice: അവർ അവിടെ പാളയമടിച്ചു
  rationale: חנה എന്നത് മരുഭൂയാത്രയുടെ പശ്ചാത്തലത്തിൽ താൽക്കാലികമായി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമടിച്ചു’ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണ്.
