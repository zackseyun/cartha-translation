id: NUM.33.54
reference: Numbers 33:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: ml
  text: നിങ്ങളുടെ കുലങ്ങൾക്കനുസരിച്ച് നറുക്കിട്ട് ദേശം അവകാശമായി പങ്കിട്ടെടുക്കണം. അംഗസംഖ്യ കൂടുതലുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി വർധിപ്പിക്കുകയും അംഗസംഖ്യ കുറവുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി കുറയ്ക്കുകയും വേണം. ആരുടെയെങ്കിലും നറുക്ക് എവിടേക്കു വീഴുന്നുവോ, ആ സ്ഥലം അവനുള്ളതായിരിക്കണം.[a] നിങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രങ്ങൾക്കനുസരിച്ച് നിങ്ങൾ അവകാശഭൂമികൾ കൈവശമാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ആരുടെയെങ്കിലും നറുക്ക് എവിടേക്കു പുറപ്പെടുന്നുവോ, അവിടെ അത് അവനുള്ളതായിരിക്കണം.”'
    reason: ‘നറുക്ക് വീഴുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിനു പിന്നിലെ എബ്രായ ഭാഷാശൈലിയും ദിശാസൂചനയും വ്യക്തമാക്കുന്ന പദാനുസൃതമായ മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: അവകാശമായി പങ്കിട്ടെടുക്കണം
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ ദേശം ഇസ്രായേലിന്റെ കുലങ്ങൾക്കിടയിൽ വിതരണം ചെയ്ത് അവകാശമായി ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പങ്കിട്ടെടുക്കണം’ വിതരണഭാവവും ‘അവകാശമായി’ נחל എന്ന പദത്തിന്റെ അവകാശഭൂമി എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സംഖ്യപുസ്തകത്തിലെ പതിവുപ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: בְּגוֹרָל
  choice: നറുക്കിട്ട്
  rationale: גורל ഭൂമി നറുക്കിലൂടെ അനുവദിക്കുന്ന നടപടിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: നിങ്ങളുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ ആധുനിക അണുകുടുംബമല്ല, ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗമാണ്; അതിനാൽ ‘കുലങ്ങൾ’ കൂടുതൽ കൃത്യമാണ്.
- source_word: לָרַב ... וְלַמְעַט
  choice: അംഗസംഖ്യ കൂടുതലുള്ള കൂട്ടത്തിന് ... അംഗസംഖ്യ കുറവുള്ള കൂട്ടത്തിന്
  rationale: ഭൂവിഭജനസന്ദർഭത്തിൽ ഈ വിരുദ്ധപദങ്ങൾ ജനസംഖ്യ കൂടുതലോ കുറവോ ഉള്ള വിഭാഗങ്ങളെ താരതമ്യമായി സൂചിപ്പിക്കുന്നു. ‘അംഗസംഖ്യ’ ചേർക്കുന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അതിന്റെ അവകാശഭൂമി
  rationale: נַחֲלָה നിയമിക്കപ്പെട്ട പ്രദേശത്തെയും തലമുറകളായി ലഭിക്കുന്ന അവകാശത്തെയും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നു; ‘അവകാശഭൂമി’ ഈ രണ്ടു ഭാവങ്ങളും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: ഒരാൾക്കുവേണ്ടിയുള്ള നറുക്ക് എവിടേക്കു വീഴുന്നുവോ
  rationale: ‘നറുക്ക് പുറപ്പെടുക’ എന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ‘നറുക്ക് വീഴുക’ എന്നു നൽകി; ദിശാസൂചനയായ אֶל ... שָׁמָּה ‘എവിടേക്കു’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
- source_word: לוֹ יִהְיֶה
  choice: അവിടം അവനുള്ളതായിരിക്കണം
  rationale: നറുക്കിലൂടെ നിർണയിക്കപ്പെട്ട സ്ഥലം ആ വ്യക്തിക്കോ വിഭാഗത്തിനോ ലഭിക്കുമെന്ന ഫലപ്രസ്താവന നേരിട്ട് നൽകുന്നു.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതൃഗോത്രങ്ങൾക്കനുസരിച്ച്
  rationale: מַטּוֹת ഗോത്രവിഭാഗങ്ങളെയും אֲבֹתֵיכֶם പിതൃവംശപരമായ ബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; ‘പിതൃഗോത്രങ്ങൾ’ രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: תִּתְנֶחָלוּ
  choice: നിങ്ങൾ അവകാശഭൂമി കൈവശമാക്കണം
  rationale: അവസാനത്തെ ഹിത്പയേൽ രൂപം ഗോത്രക്രമത്തിൽ ലഭിക്കുന്ന ദേശം അവകാശമായി ഏറ്റെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കൈവശമാക്കണം’ യഥാർഥ ഏറ്റെടുക്കൽ വ്യക്തമാക്കുകയും ‘അവകാശഭൂമി’ ഉടമ്പടി-ഭൂമി ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ dignified നിയമ-നിർദേശ ശൈലി സ്വീകരിച്ചു. ‘കുടുംബങ്ങൾ’ എന്നതിനു പകരം പുരാതന സാമൂഹിക ഘടകമായ ‘കുലങ്ങൾ’ എന്നും, ഭൂമിയും പാരമ്പര്യാവകാശവും ചേർന്ന נַחֲלָהയ്ക്ക് ‘അവകാശഭൂമി’ എന്നും ഉപയോഗിച്ചു. ഏകവചന സർവനാമങ്ങളെ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതിന്റെ’ എന്നു നൽകി.
