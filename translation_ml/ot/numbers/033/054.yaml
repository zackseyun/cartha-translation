- from: നിങ്ങളുടെ കുലങ്ങൾക്കനുസരിച്ച് നറുക്കിട്ട് ദേശം അവകാശമായി പങ്കിട്ടെടുക്കണം. അംഗസംഖ്യ കൂടുതലുള്ള കൂട്ടത്തിന് അതിന്റെ അവകാശഭൂമി വർധിപ്പിക്കുകയും അംഗസംഖ്യ കുറവുള്ള കൂട്ടത്തിന് അതിന്റെ അവകാശഭൂമി കുറയ്ക്കുകയും വേണം. ഒരാൾക്കുവേണ്ടിയുള്ള നറുക്ക് എവിടേക്കു വീഴുന്നുവോ, അവിടം അവനുള്ളതായിരിക്കണം.[a] നിങ്ങളുടെ പിതൃഗോത്രങ്ങൾക്കനുസരിച്ച് നിങ്ങൾ അവകാശഭൂമി കൈവശമാക്കണം.
  to: നിങ്ങളുടെ കുലങ്ങൾക്കനുസരിച്ച് നറുക്കിട്ട് ദേശം അവകാശമായി പങ്കിട്ടെടുക്കണം. അംഗസംഖ്യ കൂടുതലുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി വർധിപ്പിക്കുകയും അംഗസംഖ്യ കുറവുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി കുറയ്ക്കുകയും വേണം. ആരുടെയെങ്കിലും നറുക്ക് എവിടേക്കു വീഴുന്നുവോ, ആ സ്ഥലം അവനുള്ളതായിരിക്കണം.[a] നിങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രങ്ങൾക്കനുസരിച്ച് നിങ്ങൾ അവകാശഭൂമികൾ കൈവശമാക്കണം.
  rationale: The revision retains the draft’s faithful allotment terminology and legal-instruction register while making the recipient generic, improving the idiomatic expression of the lot’s destination, using clearer ancestral-tribal wording, and reflecting the concluding distributive plural context.
