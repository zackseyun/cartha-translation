  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: ml
  text: അവർ ലിബ്നായിൽനിന്ന് പുറപ്പെട്ടു, രിസ്സായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ ആവർത്തിത സഞ്ചാരസൂത്രത്തിൽ נסע ഒരു പാളയസ്ഥലത്തുനിന്ന് യാത്ര തുടരാൻ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ ചലനാർഥം നിലനിർത്തുന്നു.
- source_word: מִלִּבְנָה
  choice: ലിബ്നയിൽനിന്ന്
  rationale: מִן ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; לִבְנָה സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ ‘ലിബ്ന’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രാമധ്യേ പാളയം സ്ഥാപിച്ചു താമസിക്കുന്നതിനുള്ള പതിവ് ക്രിയയാണ്. ‘പാളയമിറങ്ങി’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּרִסָּה
  choice: രിസ്സയിൽ
  rationale: בְ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. רִסָּה സ്ഥലനാമമായതിനാൽ ‘രിസ്സ’ എന്നു ലിപ്യന്തരിച്ചു; മലയാളത്തിൽ സ്ഥലസൂചകമായ ‘യിൽ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാത്രാവിവരണത്തിന്റെ ചുരുക്കവും ആവർത്തിതവുമായ ശൈലി നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന ലിപ്യന്തരണത്തിലാണ്.
