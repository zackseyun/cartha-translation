  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: ml
  text: അവർ എസ്യോൻ-ഗേബെരിൽനിന്ന് പുറപ്പെട്ട് സീൻ മരുഭൂമിയിൽ—അതായത്[a], കാദേശിൽ—പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അതുതന്നെയാണ് കാദേശ്.’ എബ്രായ സർവനാമം ഈ സ്ഥലത്തെ കാദേശുമായി തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം വിട്ട് അടുത്ത സ്ഥലത്തേക്കു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ ആവർത്തിത സൂത്രവാക്യത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളമാണിത്.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: എസ്യോൻ-ഗേബെരിൽനിന്ന്
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; מִן എന്ന ബന്ധത്തെ ‘-ൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ പാളയം സ്ഥാപിച്ച് തങ്ങുക എന്ന മൂർത്തമായ അർഥത്തിലാണ്; ‘പാളയമിറങ്ങി’ യാത്രാവിവരണത്തിന് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְמִדְבַּר צִן
  choice: സീൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר എന്നത് മരുഭൂമിയെയോ ജനവാസമില്ലാത്ത വനപ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഈ ഭൂമിശാസ്ത്രനാമത്തിൽ പതിവും വായനാസൗകര്യവുമുള്ള ‘മരുഭൂമി’ സ്വീകരിച്ചു, ഭൂപ്രകൃതിയെ അധികമായി നിർവചിച്ചില്ല.
- source_word: הִוא
  choice: അതായത്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ഇവിടെ മുൻപുള്ള സ്ഥലത്തെ കാദേശ് എന്നു തിരിച്ചറിയിക്കുന്ന സമാനാധികരണപ്രയോഗമാണ്; ‘അതായത്’ അതിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: קָדֵשׁ
  choice: കാദേശ്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
