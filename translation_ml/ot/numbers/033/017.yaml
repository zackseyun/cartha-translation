source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/קִּבְרֹ֣ת הַֽתַּאֲוָ֑ה וַֽ/יַּחֲנ֖וּ בַּ/חֲצֵרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: ml
  text: അവർ കിബ്രോത്ത്-ഹത്താവയിൽനിന്ന് പുറപ്പെട്ട് ഹസേരോത്തിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കിബ്രോത്ത്-ഹത്താവ എന്ന പേരിന് ‘ആഗ്രഹത്തിന്റെ ശവക്കുഴികൾ’ എന്നോ ‘ദുരാശയുടെ ശവക്കുഴികൾ’ എന്നോ അർഥമാകാം.
    reason: സ്ഥലനാമത്തിന്റെ ഘടകങ്ങളായ קִבְרוֹת (‘ശവക്കുഴികൾ’), הַתַּאֲוָה (‘ആഗ്രഹം/ദുരാശ’) എന്നിവയുടെ അർഥവ്യാപ്തി അറിയിക്കുമ്പോൾ അതിലെ യഥാർഥ പദാർഥവ്യത്യാസം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയുടെ സ്ഥലക്രമവിവരണത്തിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ആ ആവർത്തിത യാത്രാസൂത്രത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളമാണ് ‘പുറപ്പെട്ടു’.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: കിബ്രോത്ത്-ഹത്താവയിൽനിന്ന്
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; מִן എന്ന ഉപസർഗത്തിന്റെ അർഥം ‘-യിൽനിന്ന്’ കൊണ്ട് നൽകി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണത്തിൽ חנה താവളമടിച്ച് താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בַּחֲצֵרֹת
  choice: ഹസേരോത്തിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; ഇവിടെ ב എന്ന ഉപസർഗം പാളയമിറങ്ങിയ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ‘-ത്തിൽ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; പേരിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
