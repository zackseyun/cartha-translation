id: NUM.33.55
reference: Numbers 33:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: ml
  text: എന്നാൽ ദേശനിവാസികളെ നിങ്ങളുടെ മുമ്പിൽനിന്ന് ഓടിച്ചുകളയാതിരുന്നാൽ, അവരിൽനിന്ന് നിങ്ങൾ ശേഷിപ്പിക്കുന്നവർ നിങ്ങളുടെ കണ്ണുകളിൽ കുത്തുന്ന മുൾമുനകളായും പാർശ്വങ്ങളിൽ മുള്ളുകളായും ആയിത്തീരും; നിങ്ങൾ പാർക്കുന്ന ദേശത്ത് അവർ നിങ്ങളെ ഉപദ്രവിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: അഥവാ, ‘അവർ നിങ്ങളെ ബുദ്ധിമുട്ടിക്കും’ അല്ലെങ്കിൽ ‘പീഡിപ്പിക്കും.’ എബ്രായക്രിയയ്ക്ക് ശത്രുതയോടെയുള്ള പലവിധ ഉപദ്രവങ്ങളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: ഓടിച്ചുകളയുക
  rationale: ഹിഫീൽ രൂപം നിലവിലെ നിവാസികളെ ദേശത്തുനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിലെ ബലപ്രയോഗം നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശനിവാസികൾ
  rationale: ദേശത്ത് വസിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പങ്കാളിത്തരൂപത്തിന്റെ നേരിട്ടുള്ളതും സംക്ഷിപ്തവുമായ പരിഭാഷ.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: ഇസ്രായേലിന്റെ മുന്നേറ്റത്തിനു മുമ്പിൽനിന്നുള്ള നീക്കം എന്ന എബ്രായ സ്ഥലസംബന്ധിയായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תּוֹתִירוּ
  choice: നിങ്ങൾ ശേഷിപ്പിക്കുന്നവർ
  rationale: יתר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘ശേഷിക്കാൻ ഇടയാക്കുക/ശേഷിപ്പിക്കുക’ എന്ന കാരണാർഥം പകർത്തുന്നു; ‘ജീവൻ രക്ഷിക്കുക’ എന്ന അധിക കരുണാഭാവം ചേർക്കുന്നില്ല.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: നിങ്ങളുടെ കണ്ണുകളിൽ മുള്ളുകൾ
  rationale: അപൂർവമായ שִׂכִּים മൂർച്ചയുള്ള, കുത്തുന്ന വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. കണ്ണിലെ വേദനാജനകമായ കുത്തിന്റെ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: പാർശ്വങ്ങളിൽ മുൾക്കൊളുത്തുകൾ
  rationale: മൂർച്ചയുള്ള കുത്തുന്ന വസ്തുവിന്റെ രണ്ടാമത്തെ സമാന്തര ദൃശ്യരൂപം ആദ്യത്തേതിൽനിന്ന് വേർതിരിച്ച് സൂക്ഷിക്കുന്നു; צִדִּים എന്ന ശരീരഭാഗപ്രയോഗത്തിന് ‘പാർശ്വങ്ങൾ’ യോജിക്കുന്നു.
- source_word: וְצָרֲרוּ
  choice: അവർ നിങ്ങളെ ഉപദ്രവിക്കും
  rationale: צרר എന്ന ക്രിയയിലെ ശത്രുതാപരമായി ബുദ്ധിമുട്ടിക്കൽ, പീഡിപ്പിക്കൽ എന്നീ വിശാല അർഥപരിധി അമിതമായി നിർണ്ണയിക്കാതെ ‘ഉപദ്രവിക്കുക’ പകർത്തുന്നു.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: നിങ്ങൾ പാർക്കുന്ന ദേശത്ത്
  rationale: עַל എന്നതിന്റെ സ്ഥലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ദേശത്ത്’ എന്നും വർത്തമാനകാല പങ്കാളിത്തത്തിന്റെ തുടർച്ച ‘പാർക്കുന്ന’ എന്നും പ്രകടമാക്കുന്നു.
