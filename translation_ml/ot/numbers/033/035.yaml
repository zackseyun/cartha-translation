  yaml_path: translation/ot/numbers/033/035.yaml
  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: ml
  text: അവർ അവ്രോനായിൽനിന്ന് പുറപ്പെട്ട് എസ്യോൻ-ഗേബെരിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം ഒരു പാളയസ്ഥലത്തുനിന്ന് യാത്ര പുറപ്പെടുക എന്നതാണ്. ‘പുറപ്പെട്ട്’ സ്വാഭാവികവും ചലനത്തിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: מֵעַבְרֹנָה
  choice: അബ്രോനയിൽനിന്ന്
  rationale: מֵ എന്ന ഉപസർഗം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി. עַבְרֹנָה സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണങ്ങളിൽ חנה ഒരു സ്ഥലത്ത് താവളമടിക്കുക എന്ന അർഥത്തിലാണ്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമായി ‘പാളയമിറങ്ങി’ തിരഞ്ഞെടുത്തു.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: എസ്യോൻ-ഗേബെരിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചക അർഥം ‘-യിൽ’ എന്ന വിഭക്തിയിലൂടെ നൽകി. עֶצְיוֹן גָּבֶר എന്ന സംയുക്ത സ്ഥലനാമം ഹൈഫൻ നിലനിർത്തി മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, ആവർത്തിത യാത്രാപട്ടികയുടെ സംക്ഷിപ്ത ശൈലി കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു. സ്ഥലനാമങ്ങൾ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിലാണ്.
