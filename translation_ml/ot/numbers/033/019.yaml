  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: ml
  text: അവർ രിത്മായിൽനിന്ന് പുറപ്പെട്ട് രിമ്മോൻ-പേരെസിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ രിത്മായിൽനിന്ന് യാത്രതിരിച്ച് രിമ്മോൻ-പേരെസിൽ പാളയമടിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵרִתְמָה
  choice: രിത്ത്മയിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രാമധ്യേ പാളയം സ്ഥാപിക്കുന്നതിനുള്ള പതിവ് ക്രിയയാണ്. ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും യാത്രാവിവരണത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: രിമ്മോൻ-പേരെസിൽ
  rationale: בְ ഇവിടെ സ്ഥലസൂചന നൽകുന്നതിനാൽ മലയാളത്തിൽ ‘-യിൽ’ ഉപയോഗിച്ചു. രണ്ടുഭാഗങ്ങളുള്ള സ്ഥലനാമം ഒറ്റ സ്ഥാനനാമമായി ഹൈഫനോടെ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണ ശൈലി. ആവർത്തിക്കുന്ന പാളയയാത്രാ സൂത്രവാക്യത്തിന്റെ സ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു.
