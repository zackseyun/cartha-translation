  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: ml
  text: അവർ ഹോർ പർവതത്തിൽനിന്ന് പുറപ്പെട്ട് സൽമോനയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע എന്ന ക്രിയ പാളയം വിട്ട് അടുത്ത സ്ഥലത്തേക്കു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: מֵהֹר הָהָר
  choice: ഹോർ പർവതത്തിൽനിന്ന്
  rationale: הֹר הָהָר സ്ഥാപിതമായ സ്ഥലനാമമാണ്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അത് ‘ഹോർ പർവതം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ ഒരു സ്ഥലത്ത് തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. യാത്രാപട്ടികയുടെ സന്ദർഭത്തിൽ ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּצַלְמֹנָה
  choice: സൽമോനയിൽ
  rationale: בְּ ഇവിടെ സ്ഥലസൂചകമാണ്. അതിനാൽ സ്ഥലനാമത്തോടൊപ്പം മലയാളത്തിലെ ‘-യിൽ’ വിഭക്തി ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ ഹീബ്രു രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
