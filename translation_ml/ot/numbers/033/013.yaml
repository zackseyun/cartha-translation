  text: They set out from Dophkah and camped at Alush.
translation:
  language: ml
  text: അവർ ദോഫ്കയിൽനിന്ന് പുറപ്പെട്ട് ആലൂശിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികാസൂത്രത്തിൽ נסע ഒരു താവളത്തിൽനിന്ന് യാത്ര തുടരാൻ പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ചലനത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: מִדָּפְקָה
  choice: ദോഫ്കയിൽനിന്ന്
  rationale: മുൻപ്രത്യയമായ מִן പുറപ്പെടുന്ന സ്ഥലം (‘നിന്ന്’) സൂചിപ്പിക്കുന്നു. דָּפְקָה എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: ഈ യാത്രാവിവരണസന്ദർഭത്തിൽ חנה താവളമടിക്കുകയോ പാളയമിറങ്ങുകയോ ചെയ്യുന്നതാണ്. ‘പാളയമിറങ്ങി’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּאָלוּשׁ
  choice: ആലൂശിൽ
  rationale: בְּ ഇവിടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. אָלוּשׁ എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്ത് മലയാളത്തിലെ സ്ഥാനവിഭക്തി ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി; ഹീബ്രു വാക്യത്തിന്റെ ക്രമവും ചുരുക്കവും സ്വാഭാവികമായി നിലനിർത്തി.
