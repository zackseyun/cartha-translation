id: NUM.33.53
reference: Numbers 33:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: ml
  text: നിങ്ങൾ ദേശം കൈവശമാക്കി അതിൽ താമസിക്കണം; കാരണം, കൈവശമാക്കേണ്ടതിന് ആ ദേശം ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് അവകാശമായി ലഭിക്കേണ്ടതിന്.” ദേശവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഹീബ്രു ക്രിയയ്ക്ക് ‘കൈവശമാക്കുക’ എന്നതിനൊപ്പം ‘അവകാശമായി ലഭിക്കുക’ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם אֶת־הָאָרֶץ
  choice: നിങ്ങൾ ദേശം കൈവശമാക്കണം
  rationale: הורישׁ എന്ന ഹിഫീൽ രൂപത്തിന് പുറത്താക്കുക/അവകാശമാക്കുക എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ഇവിടെ നേരിട്ടുള്ള കർമം ദേശമായതിനാൽ, ദേശത്തെ തന്നെയാണു പുറത്താക്കുന്നതെന്ന അസ്വാഭാവിക ധ്വനി ഒഴിവാക്കി കൈവശപ്പെടുത്തലിന്റെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: അതിൽ താമസിക്കണം
  rationale: ישׁב ഇവിടെ സ്ഥിരമായി പാർക്കുകയോ വസിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക സാധാരണ മലയാളത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כִּי
  choice: കാരണം
  rationale: കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָכֶם נָתַתִּי
  choice: ഞാൻ നിങ്ങൾക്കു തന്നിരിക്കുന്നു
  rationale: പൂർണമായ ദൈവിക ദാനം ഇപ്പോഴത്തെ കല്പനയ്ക്ക് അടിസ്ഥാനമാണെന്ന ഹീബ്രു പർഫെക്റ്റിന്റെ പൂർത്തിയായിട്ടും പ്രസക്തമായ ബലം ‘തന്നിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: കൈവശമാക്കേണ്ടതിന്
  rationale: ל + ഇൻഫിനിറ്റീവ് ദാനത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ירשׁ ഇവിടെ ദേശം സ്വന്തമായി കൈവശപ്പെടുത്തുക എന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു; ‘അവകാശമായി ലഭിക്കുക’ എന്ന ഉടമ്പടിസംബന്ധമായ നിഴലർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദേശവാഗ്ദാനസന്ദർഭത്തിൽ ירשׁ എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: കൈവശമാക്കുക
  alternative: അവകാശമായി ലഭിക്കുക
  rationale: സമീപസന്ദർഭം മുൻനിവാസികളെ നീക്കിയശേഷമുള്ള യഥാർഥ ദേശാധിപത്യത്തെയും വാസത്തെയും ഊന്നുന്നു. എന്നാൽ ഉടമ്പടിയിലെ അവകാശത്തിന്റെ ആശയവും ഈ ക്രിയയിൽ ഉണ്ടാകാവുന്നതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കല്പനാരൂപം ഉപയോഗിച്ചു. ‘വസിക്കുക’ എന്ന കൂടുതൽ സാഹിത്യപരമായ പദത്തിനു പകരം പൊതുവായ ‘താമസിക്കുക’ സ്വീകരിച്ചു; ദേശവാഗ്ദാനത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതന ശൈലി ഒഴിവാക്കി.
