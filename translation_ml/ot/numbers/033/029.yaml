  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: ml
  text: അവർ മിത്കായിൽനിന്ന് പുറപ്പെട്ടു; ഹശ്മോനായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע ഒരു താവളത്തിൽനിന്ന് അടുത്തതിലേക്കുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ ചലനാർഥം നൽകുന്നു.
- source_word: מִמִּתְקָה
  choice: മിത്ത്കയിൽനിന്ന്
  rationale: മുൻചേർന്ന מִן ‘നിന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തി; מִתְקָה സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה താവളമടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവു യാത്രാവിവരണ ക്രിയയാണ്. ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּחַשְׁמֹנָה
  choice: ഹശ്മോനയിൽ
  rationale: താവളസ്ഥലത്തോടു ചേർന്ന בְּ മലയാളത്തിൽ ‘യിൽ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; חַשְׁמֹנָה സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണ ശൈലി. ഹീബ്രു വാക്യത്തിന്റെ രണ്ടു ഘടകങ്ങളുള്ള താവളപ്പട്ടികാ ഘടന സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
