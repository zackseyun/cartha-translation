  to: അവർ കാദേശിൽനിന്ന് പുറപ്പെട്ടു, എദോംദേശത്തിന്റെ അറ്റത്തുള്ള ഹോർ പർവതത്തിൽ[b] പാളയമിറങ്ങി.[a]
  rationale: ‘അരികെ’ എന്നത് സ്ഥലസൂചനയെ ‘സമീപം’ എന്നു മാറ്റുന്നു. ‘ഹോർ പർവതത്തിൽ’ എന്ന തിരുത്തൽ എബ്രായത്തിലെ בְּ എന്ന ലൊക്കേറ്റീവ് പ്രയോഗത്തെയും ഇംഗ്ലീഷ് audit trail-ലുള്ള “at Mount Hor” എന്നതിനെയും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് b-യും അതേപോലെ തിരുത്തിയിരിക്കുന്നു; a-യിൽ ഈ വാക്യത്തിലെ ചുരുക്കപ്പേര് വ്യക്തമാക്കിയിരിക്കുന്നു.
