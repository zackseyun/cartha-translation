  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַֽ/יַּחֲנוּ֙ בְּ/הֹ֣ר הָ/הָ֔ר בִּ/קְצֵ֖ה אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: ml
  text: അവർ കാദേശിൽനിന്ന് പുറപ്പെട്ടു, എദോംദേശത്തിന്റെ അറ്റത്തുള്ള ഹോർ പർവതത്തിൽ[b] പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ഇവിടെ ‘കാദേശ്’ എന്നു മാത്രമാണ്; വിശാലമായ സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ചില പരിഭാഷകൾ ‘കാദേശ്-ബർന്നേയ’ എന്നു വികസിപ്പിക്കുന്നു, എന്നാൽ ഈ വാക്യത്തിൽ കാണുന്നത് ചുരുക്കപ്പേരാണ്.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഹോർ എന്ന പർവതത്തിൽ’; പതിവായി ‘ഹോർ പർവതം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയസ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ആ ആവർത്തിത യാത്രാസൂത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִקָּדֵשׁ
  choice: കാദേശിൽനിന്ന്
  rationale: എബ്രായപാഠത്തിൽ ഇവിടെ കാദേശ് എന്നു മാത്രമാണ്; അതിനാൽ സന്ദർഭത്തെ ആശ്രയിച്ച് ‘കാദേശ്-ബർന്നേയ’ എന്ന് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രയ്ക്കിടെ താവളമുറപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ ആ പ്രവൃത്തിയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּהֹר הָהָר
  choice: ഹോർ പർവതത്തിനരികെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഹോർ എന്ന പർവതത്തിൽ/അരികെ’ എന്ന ഘടനയാണെങ്കിലും, സ്ഥലനാമമായി മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഹോർ പർവതം’ ഉപയോഗിച്ചു. בְ എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചനയെ ‘അരികെ’ എന്നു നൽകി; കൃത്യമായ ഭൂപ്രകൃതിസ്ഥാനം അതിലധികം നിർണ്ണയിച്ചിട്ടില്ല.
- source_word: בִּקְצֵה
  choice: അറ്റത്തുള്ള
  rationale: קצה അറ്റം, അരിക്, അതിരറ്റം എന്നിവ സൂചിപ്പിക്കാം. നിർബന്ധമായി രാഷ്ട്രീയ അതിർത്തിയെന്ന് വ്യാഖ്യാനിക്കാതെ സ്ഥലപരമായ അറ്റം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: אֶרֶץ אֱדוֹם
  choice: എദോംദേശം
  rationale: אֶרֶץ ഇവിടെ എദോമിന്റെ ദേശമോ പ്രദേശമോ സൂചിപ്പിക്കുന്നു; ‘എദോംദേശം’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
