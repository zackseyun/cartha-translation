translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. എബ്രായത്തിലെ ക്രമാനുസൃതമായ പുറപ്പാട്–പാളയമിറക്കം സൂത്രം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
