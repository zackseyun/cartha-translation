  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: ml
  text: അവർ രിസ്സായിൽനിന്ന് പുറപ്പെട്ടു കെഹേലാഥായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികാസൂത്രത്തിൽ נסע ഒരു താവളത്തിൽനിന്ന് അടുത്തതിലേക്കുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് സ്വാഭാവികവും സമകാലികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: מֵרִסָּה
  choice: രിസ്സയിൽനിന്ന്
  rationale: מֵ എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാതാവളസന്ദർഭത്തിൽ חנה പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ എന്നത് ഈ മൂർത്തമായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּקְהֵלָתָה
  choice: കെഹേലാഥയിൽ
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചന ‘യിൽ’കൊണ്ട് നൽകി; സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാത്രാതാവളങ്ങളുടെ ആവർത്തിത സൂത്രശൈലി ചുരുക്കത്തോടെയും ഗൗരവത്തോടെയും നിലനിർത്തി. പേരുകളുടെ ലിപ്യന്തരണം എബ്രായരൂപത്തോട് അടുത്തായി നൽകി.
