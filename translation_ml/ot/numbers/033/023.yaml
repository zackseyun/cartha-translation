source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/קְּהֵלָ֑תָה וַֽ/יַּחֲנ֖וּ בְּ/הַר שָֽׁפֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/023.yaml
  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: ml
  text: അവർ കെഹേലാഥായിൽനിന്ന് പുറപ്പെട്ടു ഷാഫെർ മലയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: സംഖ്യ 33-ലെ യാത്രാവിവരണസൂത്രത്തിൽ נסע എന്നത് പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִקְּהֵלָתָה
  choice: കെഹേലാഥയിൽനിന്ന്
  rationale: מִן എന്ന മുൻപ്രത്യയം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാസ്ഥലങ്ങളുടെ പട്ടികയിൽ חנה പാളയം സ്ഥാപിച്ച് താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: בְּהַר
  choice: മലയിൽ
  rationale: הַר എന്നത് മല/പർവതം എന്നു വരുന്നു; പിന്നാലെ സ്ഥലനാമം വരുന്നതിനാൽ ‘ശേഫെർ മല’ എന്ന മലയാളക്രമവും ב എന്നതിന് ‘യിൽ’ എന്ന സ്ഥാനസൂചനയും സ്വീകരിച്ചു.
- source_word: שָׁפֶר
  choice: ശേഫെർ
  rationale: മസോററ്റിക് സ്വരസൂചനയിലെ šāper എന്ന രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം. പരമ്പരാഗതമായി കാണുന്ന ‘ഷാഫെർ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ആവർത്തിക്കുന്ന പുറപ്പെടൽ–പാളയമിറങ്ങൽ സൂത്രം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
