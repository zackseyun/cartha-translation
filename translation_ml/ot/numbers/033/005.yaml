source:
  edition: WLC
  text: וַ/יִּסְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל מֵ/רַעְמְסֵ֑ס וַֽ/יַּחֲנ֖וּ בְּ/סֻכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[a] രമെസേസിൽനിന്ന്[b] പുറപ്പെട്ട് സുക്കോത്തിൽ പാളയമടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘രമെസേസ്’ എന്ന സ്ഥലനാമം ചില പരിഭാഷകളിൽ ‘രാമെസേസ്’ എന്നും എഴുതിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയ ഇവിടെ യാത്രാവിവരണത്തിലെ പാളയം വിട്ടു നീങ്ങുക എന്ന അർഥത്തിലാണ്. ‘പുറപ്പെട്ടു’ ആ സഞ്ചാരാരംഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്. മലയാളത്തിലെ പതിവും ഗൗരവമുള്ളതുമായ ‘ഇസ്രായേൽമക്കൾ’ ആ കൂട്ടായ വംശനാമം നിലനിർത്തുന്നു; പുരുഷന്മാർ മാത്രമെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: מֵרַעְמְסֵס
  choice: രമെസേസിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. സ്ഥലനാമം എബ്രായരൂപത്തോട് ചേർന്ന ‘രമെസേസ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമടിച്ചു
  rationale: חנה എന്ന ക്രിയയുടെ ‘തമ്പടിക്കുക/പാളയമടിക്കുക’ എന്ന അർഥം യാത്രാവിവരണത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּסֻכֹּת
  choice: സുക്കോത്തിൽ
  rationale: בְּ ഇവിടെ തങ്ങുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. സֻכֹּת എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ‘സുക്കോത്ത്’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
