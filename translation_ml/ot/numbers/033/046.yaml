  text: וַ/יִּסְע֖וּ מִ/דִּיבֹ֣ן גָּ֑ד וַֽ/יַּחֲנ֖וּ בְּ/עַלְמֹ֥ן דִּבְלָתָֽיְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: ml
  text: അവർ ദീബോൻ-ഗാദിൽനിന്ന് പുറപ്പെട്ട് അൽമോൻ-ദിബ്ലാഥയീമിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രയിലെ ആവർത്തിത സഞ്ചാരസൂത്രത്തിൽ נסע പാളയം വിട്ട് അടുത്ത സ്ഥലത്തേക്കു യാത്ര തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളമാണ്.
- source_word: מִדִּיבֹן גָּד
  choice: ദീബോൻ-ഗാദിൽനിന്ന്
  rationale: സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; מִן എന്ന മുൻപ്രത്യയത്തിന്റെ അർഥം ‘-ൽനിന്ന്’ എന്നു നൽകി, സംയുക്ത സ്ഥലനാമം ഹൈഫനോടെ നിലനിർത്തി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ യാത്രയ്ക്കിടയിൽ പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ ആവർത്തിത യാത്രാവിവരണത്തിന് യോജിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: അൽമോൻ-ദിബ്ലാത്തയീമിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; בְ എന്ന സ്ഥലസൂചക മുൻപ്രത്യയത്തെ ‘-ൽ’ എന്നു നൽകി. അവസാനത്തെ ദിശാസൂചക ה ഈ ക്രിയാസന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്ഥലാധികരണരൂപത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. സംഖ്യാപുസ്തകം 33-ലെ ആവർത്തിത യാത്രാസൂത്രത്തിന് അനുയോജ്യമായി ചുരുക്കവും താളമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
