  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: ml
  text: അവർ തേരഹിൽനിന്ന് പുറപ്പെട്ടു, മിത്കായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികാസൂത്രത്തിൽ נסע എന്ന ക്രിയ ഒരു പാളയത്തിൽനിന്ന് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ആ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: מִתָּרַח
  choice: തേരഹിൽനിന്ന്
  rationale: മുൻപ്രത്യയമായ מִן പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. תָּרַח ഒരു സ്ഥലനാമമായതിനാൽ ‘തേരഹ്’ എന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: ഈ യാത്രാവിവരണസന്ദർഭത്തിൽ חנה തമ്പടിക്കുക അഥവാ പാളയം സ്ഥാപിക്കുക എന്നർഥം നൽകുന്നു. ‘പാളയമിറങ്ങി’ എന്നത് ആവർത്തിക്കുന്ന യാത്രാസൂത്രത്തിന് യോജിച്ച സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּמִתְקָה
  choice: മിത്‌കയിൽ
  rationale: മുൻപ്രത്യയമായ בְ സ്ഥാനം സൂചിപ്പിക്കുന്നു. מִתְקָה ഒരു സ്ഥലനാമമായതിനാൽ ‘മിത്‌ക’ എന്ന് ലിപ്യന്തരണം ചെയ്ത് മലയാളത്തിലെ സ്ഥാനവിഭക്തി ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ യാത്രാ-പാളയ സൂത്രഘടന നിലനിർത്തിയിരിക്കുന്നു; വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകളില്ല.
