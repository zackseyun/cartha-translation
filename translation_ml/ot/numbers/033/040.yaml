id: NUM.33.40
reference: Numbers 33:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: ml
  text: കനാൻദേശത്തിലെ നെഗെവിൽ താമസിച്ചിരുന്ന അരാദിലെ കനാന്യരാജാവ്, ഇസ്രായേൽമക്കൾ വന്നപ്പോൾ കേട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടു
  rationale: שׁמע എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കേട്ടു’ നിലനിർത്തുന്നു. എന്താണ് കേട്ടതെന്ന് വാക്യം പ്രത്യേകം പറയുന്നില്ല; തുടർന്നുള്ള കാലസൂചക ഘടന ഇസ്രായേൽമക്കളുടെ വരവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: അരാദിലെ കനാന്യരാജാവ്
  rationale: ഭരണാധികാരിയുടെ കനാന്യ സ്വത്വവും അരാദുമായുള്ള ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: וְהוּא יֹשֵׁב
  choice: താമസിച്ചിരുന്ന
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം നൽകുന്ന പശ്ചാത്തലവിവരണം മലയാളത്തിലെ ബന്ധകൃത്യരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּנֶּגֶב
  choice: നെഗെവിൽ
  rationale: ഇവിടെ അംഗീകൃത ഭൂമിശാസ്ത്രനാമമായി ‘നെഗെവ്’ നിലനിർത്തുന്നു; ‘തെക്ക്’ എന്ന പൊതുവായ അർഥം സന്ദർഭത്തിലെ സ്ഥലസൂചനയെ മങ്ങിച്ചേക്കാം.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തിലെ
  rationale: ‘കനാൻ ദേശം’ എന്ന മൂലപാഠത്തിലെ പൂർണ്ണ ഭൂമിശാസ്ത്രപ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בְּבֹא בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ വരുന്നതു
  rationale: ב + infinitive construct നൽകുന്ന കാലസംബന്ധമായ അർഥം ‘വരുന്നതു’ എന്ന രൂപത്തിലൂടെ നൽകുന്നു; ‘പ്രവേശിച്ചു’ എന്ന് വിവർത്തനം ചെയ്യാൻ മൂലപാഠത്തിൽ വ്യക്തമായ കർമമില്ല. בְּנֵי יִשְׂרָאֵל എന്നത് ‘ഇസ്രായേൽമക്കൾ’ എന്നു പരമ്പരാഗതവും സുതാര്യവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലപാഠത്തിലെ സ്ഥലനാമവും ‘ഇസ്രായേൽമക്കൾ’ എന്ന കൂട്ടനാമവും നിലനിർത്തി; മലയാളത്തിൽ അനാവശ്യമായി സങ്കീർണ്ണമായ ഉപവാക്യഘടന ഒഴിവാക്കി.
