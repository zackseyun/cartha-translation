- from: കനാൻദേശത്തിലെ നെഗെവിൽ താമസിച്ചിരുന്ന അരാദിലെ കനാന്യരാജാവ്, ഇസ്രായേൽമക്കൾ വരുന്നതു കേട്ടു.
  to: കനാൻദേശത്തിലെ നെഗെവിൽ താമസിച്ചിരുന്ന അരാദിലെ കനാന്യരാജാവ്, ഇസ്രായേൽമക്കൾ വന്നപ്പോൾ കേട്ടു.
