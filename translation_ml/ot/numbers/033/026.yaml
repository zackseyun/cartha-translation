  text: וַ/יִּסְע֖וּ מִ/מַּקְהֵלֹ֑ת וַֽ/יַּחֲנ֖וּ בְּ/תָֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: ml
  text: അവർ മഖേലോത്തിൽനിന്ന് പുറപ്പെട്ട് തഹത്തിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രയുടെ സ്ഥലക്രമവിവരണത്തിൽ נסע ഒരു പാളയസ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ചലനത്തിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: מִמַּקְהֵלֹת
  choice: മഖേലോത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം ചേർത്ത് സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു. ഹീബ്രു כ ശബ്ദത്തിന് ‘ഖ’ ഉപയോഗിച്ച് മഖേലോത്ത് എന്നു നൽകി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണത്തിൽ חנה അടുത്ത സ്ഥലത്ത് തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ എന്നത് മലയാള ബൈബിൾ ആഖ്യാനശൈലിക്ക് യോജിച്ചതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: בְּתָחַת
  choice: താഹത്തിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗം മലയാളത്തിലെ ‘-ത്തിൽ’ വിഭക്തിയാൽ സ്വാഭാവികമായി നൽകി; താഹത്ത് എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാര മലയാളം. ആവർത്തനാത്മകമായ യാത്രാവിവരണസൂത്രം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തി; സ്ഥലനാമങ്ങൾ മൂലഹീബ്രുവിനെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
