id: NUM.33.27
reference: Numbers 33:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/תָּ֑חַת וַֽ/יַּחֲנ֖וּ בְּ/תָֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: ml
  text: അവർ താഹത്തിൽനിന്ന് പുറപ്പെട്ട് തേരഹിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയം പിരിച്ച് അടുത്ത സ്ഥലത്തേക്കു യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ സ്വാഭാവികവും യാത്രാക്രമം വ്യക്തമായി നൽകുന്നതുമാണ്.
- source_word: מִתָּחַת
  choice: താഹത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി, תָּחַת എന്ന സ്ഥലനാമം മലയാളത്തിൽ ‘താഹത്ത്’ എന്നു ലിപ്യന്തരിച്ചു; വിഭക്തി ചേരുമ്പോൾ ‘താഹത്തിൽനിന്ന്’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണങ്ങളിൽ חנה പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘പാളയമിറങ്ങി’ എന്നത് ഈ അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: בְּתָרַח
  choice: തേരഹിൽ
  rationale: പാളയസ്ഥലത്തോടു ചേർന്ന בְּ ഇവിടെ സ്ഥലസൂചകമായി ‘-ിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. תָּרַח എന്ന സ്ഥലനാമം ഹീബ്രായ ഉച്ചാരണത്തെ പിന്തുടർന്ന് ‘തേരഹ്’ എന്നു ലിപ്യന്തരിച്ചു; വിഭക്തിയോടുകൂടെ ‘തേരഹിൽ’ ആയി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തമായ യാത്രാവിവരണശൈലി നിലനിർത്തി. ഹീബ്രായ മൂലത്തിലെ തുടർച്ചയായ രണ്ട് പ്രവൃത്തികൾ മലയാളത്തിൽ ‘പുറപ്പെട്ട് ... പാളയമിറങ്ങി’ എന്ന സ്വാഭാവിക ഘടനയിൽ അവതരിപ്പിച്ചു.
