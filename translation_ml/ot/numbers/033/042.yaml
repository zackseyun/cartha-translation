  text: וַ/יִּסְע֖וּ מִ/צַּלְמֹנָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/פוּנֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: ml
  text: അവർ സൽമോനായിൽനിന്ന് പുറപ്പെട്ട് പൂനോനിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയ മരുഭൂമിയാത്രാവിവരണത്തിലെ ആവർത്തിത പ്രയോഗത്തിൽ പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ട്’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִצַּלְמֹנָה
  choice: സൽമോനയിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി, സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രാക്രമവിവരണത്തിൽ ഒരു സ്ഥലത്ത് പാളയം സ്ഥാപിച്ച് തങ്ങുക എന്നർഥത്തിലാണ്. ‘പാളയമിറങ്ങി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും യാത്രാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּפוּנֹן
  choice: പൂനോനിൽ
  rationale: בְּ ഇവിടെ പാളയസ്ഥലത്തെ അടയാളപ്പെടുത്തുന്നതിനാൽ സ്ഥലാധികരണമായ ‘-ിൽ’ ഉപയോഗിച്ചു; സ്ഥലനാമം ഹീബ്രു രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത യാത്രാക്രമസൂത്രവും രണ്ട് ക്രിയകളുടെ തുടർച്ചയും നിലനിർത്തി.
