reference: Numbers 33:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: ml
  text: ഒന്നാം മാസത്തിലെ പതിനഞ്ചാം ദിവസം അവർ രമെസേസിൽനിന്ന് യാത്ര പുറപ്പെട്ടു. പെസഹയുടെ പിറ്റേന്ന്, എല്ലാ ഈജിപ്തുകാരുടെയും കൺമുമ്പിൽ, ഇസ്രായേൽമക്കൾ ഉയർത്തിയ കൈയോടെ[a] പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉയർത്തിയ കൈയോടെ” എന്നത് പരസ്യമായും ധൈര്യപൂർവമായും പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം പിരിച്ച് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מֵרַעְמְסֵס
  choice: രമെസേസിൽനിന്ന്
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בַּחֲמִשָּׁה עָשָׂר יוֹם
  choice: ഒന്നാം മാസം പതിനഞ്ചാം തീയതി
  rationale: എബ്രായ തീയതിപ്രയോഗത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: പെസഹയുടെ പിറ്റേന്ന്
  rationale: מָחֳרַת അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്നു; ‘പിറ്റേന്ന്’ മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ ഘടനയും ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: בְּיָד רָמָה
  choice: ഉയർത്തിയ കൈയോടെ
  rationale: ‘ഉയർന്ന/ഉയർത്തിയ കൈയോടെ’ എന്ന ദൃശ്യരൂപകം സംരക്ഷിക്കുന്നു; അതിന്റെ ധൈര്യപൂർവവും പരസ്യവുമായ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: എല്ലാ ഈജിപ്തുകാരും നോക്കിനിൽക്കെ
  rationale: ‘എല്ലാ ഈജിപ്തിന്റെയും കണ്ണുകൾക്കുമുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പൊതുദൃശ്യത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ബന്ധസൂചകമായ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ ജനസമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- issue: בְיָד רָמָה എന്ന രൂപകത്തിന്റെ പരിഭാഷ
  choice: ഉയർത്തിയ കൈയോടെ
  alternative: ധൈര്യപൂർവം / വിജയഭാവത്തോടെ
  rationale: മൂലത്തിലെ സാക്ഷാൽ രൂപകം സംരക്ഷിക്കുകയും ‘ധിക്കാരത്തോടെ’ പോലുള്ള കൂടുതൽ നിർദിഷ്ടമായ മാനസികഭാവം വാക്യത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്തു; സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി. ‘ഉയർത്തിയ കൈയോടെ’ എന്ന അപരിചിതമായെങ്കിലും പ്രധാനപ്പെട്ട രൂപകം അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
