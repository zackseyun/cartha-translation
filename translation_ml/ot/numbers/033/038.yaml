revisions:
- from: പുരോഹിതനായ അഹരോൻ യഹ്‌വെയുടെ കല്പനപ്രകാരം[a] ഹോർ പർവതത്തിലേക്കു കയറിച്ചെന്നു; അവിടെവെച്ച് അദ്ദേഹം മരിച്ചു. ഇസ്രായേല്യർ ഈജിപ്ത് ദേശത്തുനിന്നു പുറപ്പെട്ടതിനു ശേഷമുള്ള നാൽപ്പതാം വർഷത്തിൽ, അഞ്ചാം മാസം ഒന്നാം തീയതിയിലായിരുന്നു അത്.
  to: പുരോഹിതനായ അഹരോൻ യഹ്‌വെയുടെ കല്പനപ്രകാരം[a] ഹോർ പർവതത്തിലേക്കു കയറിച്ചെന്നു; അവിടെവെച്ച് അദ്ദേഹം മരിച്ചു—ഇസ്രായേല്യർ ഈജിപ്ത് ദേശത്തുനിന്നു പുറപ്പെട്ടതിനു ശേഷമുള്ള നാൽപ്പതാം വർഷത്തിൽ, അഞ്ചാം മാസത്തിലെ ഒന്നാം ദിവസം.
  rationale: പരിഷ്കാരം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. തീയതിവിവരം അഹരോന്റെ മരണത്തോടു നേരിട്ട് ബന്ധിപ്പിച്ചു; കൂടാതെ עַל־פִּי എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥസൂചന മലയാളത്തിൽ കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കി.
