id: NUM.33.38
reference: Numbers 33:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോൻ യഹ്‌വെയുടെ കല്പനപ്രകാരം[a] ഹോർ പർവതത്തിലേക്കു കയറിച്ചെന്നു; അവിടെവെച്ച് അദ്ദേഹം മരിച്ചു—ഇസ്രായേല്യർ ഈജിപ്ത് ദേശത്തുനിന്നു പുറപ്പെട്ടതിനു ശേഷമുള്ള നാൽപ്പതാം വർഷത്തിൽ, അഞ്ചാം മാസത്തിലെ ഒന്നാം ദിവസം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വെയുടെ വചനപ്രകാരം”; അക്ഷരാർഥത്തിൽ, “യഹ്‌വെയുടെ വായിന്മേൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ദിശാസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: അഹരോന്റെ ഔദ്യോഗിക സ്ഥാനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶל הֹר הָהָר
  choice: ഹോർ പർവതത്തിലേക്കു
  rationale: സ്ഥലനാമമായ ‘ഹോർ പർവതം’ നിലനിർത്തുകയും אֶל എന്ന ദിശാബോധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  rationale: ‘വായുടെമേൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം സന്ദർഭത്തിൽ ദൈവിക കല്പനയനുസരിച്ച് എന്ന അർഥം നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיָּמָת שָׁם
  choice: അവിടെവെച്ച് അദ്ദേഹം മരിച്ചു
  rationale: മരണവും അതിന്റെ സ്ഥലവും നേരിട്ട് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ആദരസൂചകമായ സർവനാമം സ്വാഭാവികമാണ്.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: നാൽപ്പതാം വർഷത്തിൽ
  rationale: എബ്രായ കാലനിർണ്ണയരീതിയുടെ ക്രമസംഖ്യാബോധം കൃത്യമായി നൽകുന്നു.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേല്യർ ... പുറപ്പെട്ടതിനു ശേഷമുള്ള
  rationale: പുറപ്പാടിനെ കാലഗണനയുടെ ആരംഭബിന്ദുവായി കാണിക്കുന്ന എബ്രായ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേല്യർ
  rationale: ഇവിടെ പുരുഷസന്തതികളെ മാത്രമല്ല, ജനസമൂഹത്തെയാകെ സൂചിപ്പിക്കുന്നതിനാൽ ദേശീയനാമം ഉപയോഗിക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്നു
  rationale: מִצְרַיִם എന്ന സ്ഥലനാമവും אֶרֶץ എന്ന ‘ദേശം’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי בְּאֶחָד לַחֹדֶשׁ
  choice: അഞ്ചാം മാസം ഒന്നാം തീയതിയിൽ
  rationale: എബ്രായ കലണ്ടർ തീയതി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു പദവിപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: עַל פִּי יְהוָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  alternative: യഹ്‌വെയുടെ വചനപ്രകാരം; അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’
  rationale: സന്ദർഭത്തിലെ അനുസരണവും ദൈവിക അധികാരവും വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്; ‘വചനം’ എന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പഴയ പ്രയോഗമായ ‘മിസ്രയീം’ എന്നതിനുപകരം പൊതുവായി മനസ്സിലാകുന്ന ‘ഈജിപ്ത്’ ഉപയോഗിച്ചു; സ്ഥലനാമമായ ‘ഹോർ’യും ദൈവനാമമായ ‘യഹ്‌വെ’യും ലിപ്യന്തരണം ചെയ്തു.
