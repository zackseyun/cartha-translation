  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: ml
  text: അവർ സീനായി മരുഭൂമിയിൽനിന്ന് പുറപ്പെട്ട് കിബ്രോത്ത്-ഹത്താവായിൽ[a] പാളയമിറങ്ങി.
