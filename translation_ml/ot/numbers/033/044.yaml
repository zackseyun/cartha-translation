  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ യാത്രാവിവരണശൈലി. സ്ഥലനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു; പദോത്ഭവത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
