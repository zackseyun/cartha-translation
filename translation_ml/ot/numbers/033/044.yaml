  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֛וּ בְּ/עִיֵּ֥י הָעֲבָרִ֖ים בִּ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: ml
  text: അവർ ഓബോത്തിൽനിന്ന് പുറപ്പെട്ട് മോവാബിന്റെ അതിർത്തിയിലുള്ള ഇയ്യേ-അബാരീമിൽ[a] പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇയ്യെ-അബാരീം” എന്നും ലിപ്യന്തരപ്പെടുത്താം; എബ്രായ സ്ഥലനാമത്തിലെ ഘടകങ്ങൾ “അവശിഷ്ടക്കൂമ്പാരങ്ങൾ” എന്നും “അബാരീം/അപ്പുറപ്രദേശങ്ങൾ” എന്നും ബന്ധപ്പെട്ടവയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ ആവർത്തിത യാത്രാസൂത്രം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֵאֹבֹת
  choice: ഓബോത്തിൽനിന്ന്
  rationale: מֵ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; אֹבֹת സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രയ്ക്കിടെ പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ മൂർത്തമായ അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: ഇയ്യേ-അബാരീമിൽ
  rationale: ഈ പദസമുച്ചയം യാത്രാപട്ടികയിൽ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നു. ഘടകങ്ങളുടെ വ്യുത്പത്തിയെ മുഖ്യവാചകത്തിൽ അർത്ഥവത്കരിച്ച് അതിവ്യാഖ്യാനിക്കാതെ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: בִּגְבוּל
  choice: അതിർത്തിയിലുള്ള
  rationale: גְּבוּל അതിർത്തി, അതിർത്തിപ്രദേശം, പ്രദേശം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ യാത്രാസന്ദർഭത്തിൽ 'അതിർത്തിയിലുള്ള' എന്നത് മോവാബിന്റെ ഉള്ളറപ്രദേശത്താണെന്ന് അമിതമായി നിർണ്ണയിക്കാതെ സ്ഥാനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: സ്ഥിരമായി ഉപയോഗിക്കുന്ന മലയാള ലിപ്യന്തരണം.
