id: NUM.33.52
reference: Numbers 33:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: ml
  text: നിങ്ങളുടെ മുമ്പിൽനിന്ന് ദേശത്തിലെ സകല നിവാസികളെയും ഓടിച്ചുകളയണം; അവരുടെ ചിത്രപ്പണിയുള്ള കല്ലുകളെല്ലാം നശിപ്പിക്കണം[a]; അവരുടെ വാർപ്പുലോഹവിഗ്രഹങ്ങളെല്ലാം തകർത്തുകളയണം[b]; അവരുടെ ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെല്ലാം ഇടിച്ചുനിരത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ കൊത്തിയ രൂപങ്ങളെല്ലാം.” എബ്രായപദം രൂപചിത്രങ്ങളുള്ള വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; അവയുടെ കൃത്യമായ രൂപവും വസ്തുവും ഉറപ്പില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരുടെ ഉരുക്കിവാർത്ത വിഗ്രഹങ്ങളെല്ലാം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: ഓടിച്ചുകളയണം
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירשׁ ഇവിടെ നിലവിലുള്ള നിവാസികളെ ദേശത്തുനിന്ന് നീക്കുക എന്നർഥം നൽകുന്നു. ‘ഓടിച്ചുകളയണം’ ആ ശക്തിയും തുടർന്നുള്ള ‘നിങ്ങളുടെ മുമ്പിൽനിന്ന്’ എന്ന പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ദേശത്തിലെ സകല നിവാസികളെയും
  rationale: പങ്കാളിത്തരൂപം ദേശത്ത് താമസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘നിവാസികൾ’ സംക്ഷിപ്തവും ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: מִפְּנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽനിന്ന്
  rationale: എബ്രായത്തിലെ സ്ഥാനസാന്നിധ്യചിത്രം നിലനിർത്തുന്ന, മലയാളത്തിലും മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: וְאִבַּדְתֶּם
  choice: നശിപ്പിക്കണം
  rationale: പീയേൽ രൂപത്തിലുള്ള אבד ആരാധനാവസ്തുക്കളുടെ പൂർണനാശത്തെ സൂചിപ്പിക്കുന്നു; ‘നശിപ്പിക്കണം’ അതിന്റെ നേരായ അർഥം നൽകുന്നു.
- source_word: מַשְׂכִּיֹּתָם
  choice: അവരുടെ ചിത്രപ്പണിയുള്ള കല്ലുകളെല്ലാം
  rationale: מַשְׂכִּיּוֹת രൂപചിത്രങ്ങളോ കൊത്തുപണിയോ ഉള്ള ആരാധനാവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ രൂപവും വസ്തുവും വിവാദമാണെങ്കിലും കല്ലിൽ ചെയ്ത രൂപപ്പണിയാണ് സാധ്യതയുള്ള വ്യക്തമായ അർഥം. അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: അവരുടെ വാർപ്പുലോഹവിഗ്രഹങ്ങളെല്ലാം
  rationale: צֶלֶם പ്രതിമയെയോ വിഗ്രഹത്തെയോ, מַסֵּכָה ഉരുക്കി വാർക്കപ്പെട്ട ലോഹവസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു. ‘വാർപ്പുലോഹവിഗ്രഹങ്ങൾ’ വസ്തുവും നിർമാണരീതിയും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: תְּאַבֵּדוּ
  choice: തകർത്തുകളയണം
  rationale: വീണ്ടും വരുന്ന אבד എന്ന ക്രിയയുടെ നാശാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ ശബ്ദാവർത്തനം കുറയ്ക്കുന്നു; പൂർണമായ നീക്കം എന്ന ശക്തി ‘തകർത്തുകളയണം’ നൽകുന്നു.
- source_word: בָּמֹתָם
  choice: അവരുടെ പൂജാമേടകളെല്ലാം
  rationale: בָּמוֹת ഉയർന്ന ആരാധനാസ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. ‘പൂജാമേടകൾ’ ഉയർന്ന സ്ഥലവും ആരാധനാപരമായ ഉപയോഗവും സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּשְׁמִידוּ
  choice: ഇടിച്ചുനിരത്തണം
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള שׁמד ഇവിടെ ആരാധനാസ്ഥലങ്ങളുടെ സമ്പൂർണ നശീകരണമാണ് സൂചിപ്പിക്കുന്നത്; നിർമ്മിത സ്ഥലങ്ങൾക്ക് ‘ഇടിച്ചുനിരത്തണം’ സ്വാഭാവികവും ശക്തവുമാണ്.
theological_decisions:
- issue: കനാന്യ നിവാസികളെയും അവരുടെ ആരാധനാവസ്തുക്കളെയും സംബന്ധിച്ച കല്പനകളുടെ അവതരണം
  choice: നിവാസികളെ നീക്കാനും പ്രത്യേക ആരാധനാവസ്തുക്കളും സ്ഥലങ്ങളും നശിപ്പിക്കാനുമുള്ള കല്പനകളായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ആദ്യക്രിയയെ ‘ഉടമസ്ഥത നഷ്ടപ്പെടുത്തുക’ എന്ന പ്രദേശപരമായ അർഥത്തിൽ മൃദുവാക്കുകയോ ആരാധനാവസ്തുക്കളെ പൊതുവായി ‘വിഗ്രഹാരാധനാചാരങ്ങൾ’ എന്നു പറയുകയോ ചെയ്യുക.
  rationale: എബ്രായപാഠം നിവാസികളെ നീക്കുന്നതും നിർദിഷ്ട ആരാധനാവസ്തുക്കളെയും സ്ഥലങ്ങളെയും നശിപ്പിക്കുന്നതും വ്യക്തമായി കല്പിക്കുന്നു. അതിന്റെ കാഠിന്യം മൃദൂകരിക്കാതെയും വാക്യത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ ന്യായീകരണം ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള കല്പനാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ നാല് സമാന്തര കല്പനകളുടെ താളവും നാശക്രിയകളുടെ ശക്തിയും നിലനിർത്തി; ആരാധനാസംബന്ധിയായ അപരിചിത പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു.
