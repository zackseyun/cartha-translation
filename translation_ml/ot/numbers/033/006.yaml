source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/סֻּכֹּ֑ת וַ/יַּחֲנ֣וּ בְ/אֵתָ֔ם אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: ml
  text: അവർ സുക്കോത്തിൽനിന്ന് പുറപ്പെട്ട്, മരുഭൂമിയുടെ അരികിലുള്ള[a] ഏതാമിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മരുഭൂമിയുടെ അതിർത്തിയിൽ.”
    reason: ബִּקְצֵה എന്നതിന് ‘അരിക്/അറ്റം’ എന്നതോടൊപ്പം ‘അതിർ/അതിർത്തി’ എന്ന സ്ഥലപരമായ അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയയുടെ യാത്രാവിവരണത്തിലെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִסֻּכֹּת
  choice: സുക്കോത്തിൽനിന്ന്
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്യുകയും מן എന്ന ഉപസർഗത്തിന്റെ ഉറവിടാർഥം ‘നിന്ന്’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ ‘തമ്പടിക്കുക/പാളയമിറങ്ങുക’ എന്ന അർഥം യാത്രാവിവരണത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְאֵתָם
  choice: ഏതാമിൽ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു; ב എന്ന ഉപസർഗം ഇവിടെ സ്ഥലസൂചകമായ ‘ഇൽ’ ആയി നൽകി.
- source_word: אֲשֶׁר
  choice: '...ഉള്ള'
  rationale: ഏതാമിനെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בִּקְצֵה
  choice: അതിരിലുള്ള
  rationale: קצה ഇവിടെ ഒരു പ്രദേശത്തിന്റെ അറ്റം/അതിർ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ അതിർത്തി എന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ഭൂമിശാസ്ത്രപരമായ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: הַמִּדְבָּר
  choice: മരുഭൂമിയുടെ
  rationale: מִדְבָּר കൃഷിചെയ്യാത്ത വിജനപ്രദേശത്തെയും സൂചിപ്പിക്കാം; മലയാളത്തിൽ പരിചിതവും സന്ദർഭോചിതവുമായ ‘മരുഭൂമി’ തെരഞ്ഞെടുത്തു.
