  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി. മൂലത്തിലെ ക്രമാനുസൃതമായ പുറപ്പെടൽ–പാളയമിറക്കൽ ഘടന നിലനിർത്തി; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
