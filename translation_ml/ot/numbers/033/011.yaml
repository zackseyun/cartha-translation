  text: അവർ ചെങ്കടലിൽനിന്ന് പുറപ്പെട്ട് സീൻ മരുഭൂമിയിൽ[a][b] പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
