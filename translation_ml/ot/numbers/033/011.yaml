    text: ‘ചെങ്കടൽ’ എന്നതിനുപകരം, എബ്രായത്തിലെ യാം സൂഫ് എന്ന പേരിനെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഞാങ്ങണകളുടെ കടൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സീൻ’ ഒരു മരുഭൂമിപ്രദേശത്തിന്റെ പേരാണ്; പാപം എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്ന പദമല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: מסע എന്ന യാത്രാവിവരണസൂത്രത്തിൽ ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: מִיַּם סוּף
  choice: ചെങ്കടലിൽനിന്ന്
  rationale: יַם־סוּף പരമ്പരാഗതമായി അറിയപ്പെടുന്ന ഭൂമിശാസ്ത്രനാമമായ ‘ചെങ്കടൽ’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥപരമായ ‘ഞാങ്ങണക്കടൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ യാത്രാമധ്യേ പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ മലയാള ബൈബിൾ യാത്രാവിവരണത്തിന് യോജിച്ച, ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
- source_word: בְּמִדְבַּר סִין
  choice: സീൻ മരുഭൂമിയിൽ
  rationale: מִדְבָּר വിജനമായ മരുപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; סִין ഒരു സ്ഥലനാമമായതിനാൽ ‘സീൻ’ എന്നു ലിപ്യന്തരിച്ചു.
