lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയുടെ കഥനരൂപം യാത്രയിലെ അടുത്ത താവളത്തെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ എന്നത് സ്വാഭാവികവും നിലവിലെ സഞ്ചാരസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: עַל הַיַּרְדֵּן
  choice: യോർദാനരികെ
  rationale: നദിയോടൊപ്പം വരുന്ന עַל ഇവിടെ അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നല്ല, നദിയുടെ അരികിലോ സമീപത്തോ ഉള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: ബേത്ത്-യെശിമോത്ത് മുതൽ
  rationale: מִן വ്യാപിച്ചുകിടക്കുന്ന പാളയപ്രദേശത്തിന്റെ ആരംഭപരിധി അടയാളപ്പെടുത്തുന്നു; സ്ഥലനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: ആബേൽ-ശിത്തീം വരെ
  rationale: עַד ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയുടെ അവസാനപരിധി വ്യക്തമാക്കുന്നു; സ്ഥലനാമം ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബിന്റെ സമതലപ്രദേശത്ത്
  rationale: עֲרָבוֹת മോവാബിലെ പരന്ന, സ്റ്റെപ്പ് സ്വഭാവമുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘സമതലപ്രദേശം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; വരണ്ട സ്റ്റെപ്പ് എന്ന സൂക്ഷ്മാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
