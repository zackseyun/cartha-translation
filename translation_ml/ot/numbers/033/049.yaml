  text: അവർ യോർദാനരികെ, ബേത്ത്-യെശിമോത്ത് മുതൽ ആബേൽ-ശിത്തീം വരെ, മോവാബിന്റെ സമതലപ്രദേശത്ത്[a] പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
