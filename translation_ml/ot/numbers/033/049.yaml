translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി, എന്നാൽ യോർദാൻ, രണ്ടു അതിർത്തിസ്ഥലങ്ങൾ, മോവാബിന്റെ സമതലപ്രദേശം എന്നീ എല്ലാ ഭൂമിശാസ്ത്രഘടകങ്ങളും സംരക്ഷിച്ചു.
