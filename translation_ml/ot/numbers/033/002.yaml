id: NUM.33.2
reference: Numbers 33:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: ml
  text: മോശെ അവരുടെ യാത്രകൾക്കനുസരിച്ച് അവരുടെ പുറപ്പെടൽസ്ഥാനങ്ങൾ[b] യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം[a] രേഖപ്പെടുത്തി. അവരുടെ പുറപ്പെടൽസ്ഥാനങ്ങൾക്കനുസരിച്ച് അവരുടെ യാത്രകൾ ഇവയായിരുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘യഹ്‌വെയുടെ വായ്‌പ്രകാരം’; ‘യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം’ എന്നർഥമുള്ള ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘പുറപ്പെടൽസ്ഥാനങ്ങൾ’ എന്നതിന് ‘പുറപ്പെടലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'വാക്യം പദങ്ങളെ ഉദ്ദേശപൂർവം മറിച്ച ക്രമത്തിൽ ആവർത്തിക്കുന്നു: ‘യാത്രകൾക്കനുസരിച്ച് പുറപ്പെടൽസ്ഥാനങ്ങൾ’ ... ‘പുറപ്പെടൽസ്ഥാനങ്ങൾക്കനുസരിച്ച് യാത്രകൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: രേഖപ്പെടുത്തി
  rationale: ഭൂതകാലത്തിലെ രേഖപ്പെടുത്തൽപ്രവൃത്തിയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: מוֹצָאֵיהֶם
  choice: അവരുടെ പുറപ്പെടൽസ്ഥാനങ്ങൾ
  rationale: מוֹצָא എന്നത് പുറപ്പെടുന്ന പ്രവൃത്തിയെയോ സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; യാത്രാവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്ഥലസൂചന യോജിക്കുന്നു, എന്നാൽ പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לְמַסְעֵיהֶם
  choice: അവരുടെ യാത്രകൾക്കനുസരിച്ച്
  rationale: ബന്ധസൂചകമായ לְ എന്നതും മַסָּע എന്ന യാത്ര/യാത്രാഘട്ടം എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ കല്പനയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מַסְעֵיהֶם
  choice: അവരുടെ യാത്രകൾ
  rationale: പാളയം പിരിച്ച് നടത്തുന്ന യാത്രകളെയും അവയുടെ ഘട്ടങ്ങളെയും പൊതുവായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: לְמוֹצָאֵיהֶם
  choice: അവരുടെ പുറപ്പെടൽസ്ഥാനങ്ങൾക്കനുസരിച്ചുള്ള
  rationale: ആദ്യപാദത്തിലെ ബന്ധം മറിച്ച ക്രമത്തിൽ ആവർത്തിച്ച് എബ്രായത്തിലെ ആസൂത്രിതമായ ഘടന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം പൊതുപദവിയല്ല, ദൈവത്തിന്റെ പ്രത്യേക നാമമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതിനെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. എബ്രായത്തിലെ സമാന്തരവും മറിച്ചുള്ള പദക്രമവും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു; അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു പിന്നാലെ ചേർത്തു.
