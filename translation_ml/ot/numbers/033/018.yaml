  text: וַ/יִּסְע֖וּ מֵ/חֲצֵרֹ֑ת וַֽ/יַּחֲנ֖וּ בְּ/רִתְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/018.yaml
  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: ml
  text: അവർ ഹസേരോത്തിൽനിന്ന് പുറപ്പെട്ട് രിത്മായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ … പുറപ്പെട്ട്
  rationale: נסע എന്ന ക്രിയ യാത്രാവിവരണത്തിലെ പതിവുപ്രയോഗത്തിൽ പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵחֲצֵרֹת
  choice: ഹസേരോത്തിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം ‘നിന്ന്’ എന്ന പുറപ്പെടൽസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; חֲצֵרֹת എന്ന സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה യാത്രാവിവരണത്തിൽ ഒരു സ്ഥലത്ത് പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּרִתְמָה
  choice: രിത്ത്മയിൽ
  rationale: בְּ എന്ന ഉപസർഗം ഇവിടെ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽ’ ഉപയോഗിച്ചു; רִתְמָה എന്ന സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. എബ്രായ യാത്രാവിവരണസൂത്രത്തിന്റെ സംക്ഷിപ്തതയും ക്രിയകളുടെ ക്രമവും നിലനിർത്തി; സ്ഥലനാമങ്ങൾ ലിപ്യന്തരിച്ചു.
