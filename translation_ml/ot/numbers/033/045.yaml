base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: ml
  text: അവർ ഇയ്യീമിൽനിന്ന് പുറപ്പെട്ട് ദീബോൻ-ഗാദിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: സംഖ്യാപുസ്തകത്തിലെ യാത്രാവിവരണസൂത്രത്തിൽ נסע ഒരു പാളയസ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുറപ്പെട്ട്’ എന്നു നൽകി.
- source_word: מֵעִיִּים
  choice: ഇയ്യീമിൽനിന്ന്
  rationale: מֵ എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നിലനിർത്തി; עִיִּים എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് അടുത്ത് ‘ഇയ്യീം’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണങ്ങളിൽ חנה പാളയം സ്ഥാപിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ സാധാരണക്കാർക്കു മനസ്സിലാകുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗമാണ്.
- source_word: בְּדִיבֹן גָּד
  choice: ദീബോൻ-ഗാദിൽ
  rationale: സ്ഥലത്തോടു ചേർന്ന בְּ മലയാളത്തിലെ ‘-ൽ’ കൊണ്ട് നൽകി; דִיבֹן גָּד എന്നത് വിഭജിച്ചു വ്യാഖ്യാനിക്കാതെ സംയുക്ത സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി; സ്ഥലനാമങ്ങൾ ഹീബ്രു രൂപത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു.
