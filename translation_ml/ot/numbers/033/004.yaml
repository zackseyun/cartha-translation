source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: ml
  text: ഈജിപ്തുകാർ, യഹ്‌വെ അവരുടെ ഇടയിൽ സംഹരിച്ചവരെ—എല്ലാ ആദ്യജാതരെയും—അടക്കം ചെയ്തുകൊണ്ടിരിക്കെ, അവരുടെ ദേവന്മാർക്കെതിരെയും യഹ്‌വെ ന്യായവിധികൾ നടപ്പാക്കിയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: ഈജിപ്തുകാർ … അടക്കം ചെയ്തുകൊണ്ടിരിക്കെ
  rationale: നാമപദത്തോടു ചേർന്ന വാവും വർത്തമാനകൃദ്‌രൂപവും മുൻവാക്യത്തിലെ പുറപ്പാടിന്റെ പശ്ചാത്തലസമയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്തുകൊണ്ടിരിക്കെ’ ആ തുടരുന്ന സാഹചര്യപ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם כָּל־בְּכוֹר
  choice: യഹ്‌വെ അവരുടെ ഇടയിൽ സംഹരിച്ചവരെ—എല്ലാ ആദ്യജാതരെയും—
  rationale: എബ്രായത്തിലെ ബന്ധവാക്യത്തിനു പിന്നാലെ വരുന്ന ‘എല്ലാ ആദ്യജാതരും’ എന്ന വിശദീകരണഘടന നിലനിർത്തുന്നു. נכהയുടെ മാരകഫലം സന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ ‘സംഹരിച്ച’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വായിക്കാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וּבֵאלֹהֵיהֶם
  choice: അവരുടെ ദേവന്മാർക്കെതിരെയും
  rationale: ഇവിടെയുള്ള בְּ ന്യായവിധിയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘എതിരെയും’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്. אֱלֹהִים എന്നത് ‘ദേവന്മാർ’ എന്നുതന്നെ നിലനിർത്തി.
- source_word: עָשָׂה יְהוָה שְׁפָטִים
  choice: യഹ്‌വെ ന്യായവിധികൾ നടപ്പാക്കിയിരുന്നു
  rationale: ‘വിധികൾ ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘ന്യായവിധികൾ നടപ്പാക്കുക’ എന്നു നൽകി; ബഹുവചനവും മുൻകാലബന്ധവും നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം പദവിനാമമായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; ‘യഹ്‌വെ’ എന്നത് Yahweh-യുടെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണമാണ്.
- issue: ‘അവരുടെ ദേവന്മാർ’ എന്നതിന്റെ സൂചന
  choice: ഈജിപ്തുകാരുടെ ദേവന്മാർ എന്ന പാഠവാദം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി
  alternative: അവരുടെ വിഗ്രഹങ്ങൾ / അവരുടെ ഭരണാധികാരികൾ
  rationale: אֱלֹהֵיהֶם നേരിട്ട് ‘അവരുടെ ദേവന്മാർ’ എന്നാണ്; അവരെ വിഗ്രഹങ്ങളായോ മനുഷ്യാധികാരികളായോ പരിഭാഷയിൽ പുനർവ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ അനുബന്ധവിശദീകരണം ദീർഘവിരാമങ്ങൾകൊണ്ട് വ്യക്തമാക്കി; അനാവശ്യമായ ഉടമസ്ഥസൂചന ഒഴിവാക്കി. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് അതിന്റെ മാർക്കർ സ്ഥാനത്തോടും നിർദ്ദേശിച്ച പകരവായനയോടും പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; മൂലപാഠത്തിലെ בְּയുടെ ലക്ഷ്യാർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
