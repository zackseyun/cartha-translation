  text: וַ/יִּסְע֖וּ מֵ/רִמֹּ֣ן פָּ֑רֶץ וַֽ/יַּחֲנ֖וּ בְּ/לִבְנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: ml
  text: അവർ രിമ്മോൻ-പരെസിൽ നിന്ന് പുറപ്പെട്ടു; ലിബ്നായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע എന്ന ക്രിയ ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പുറപ്പെട്ടു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളപ്രയോഗമാണ്; തുടർന്നുള്ള ക്രിയയുമായി ചേർക്കാൻ ‘പുറപ്പെട്ട്’ എന്നു നൽകി.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: രിമ്മോൻ-പേരെസിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം സ്ഥലനാമത്തോടു ചേർത്തു. സംയുക്ത സ്ഥലനാമത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി; പേര് അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണത്തിൽ חנה ഒരു താവളത്തിൽ ക്യാമ്പ് സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּלִבְנָה
  choice: ലിബ്നയിൽ
  rationale: യാത്രയിലെ അടുത്ത താവളത്തെ സൂചിപ്പിക്കുന്ന ב മലയാളത്തിൽ സ്ഥലാധികരണമായ ‘-യിൽ’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; സ്ഥലനാമം ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ഹീബ്രു താവളപ്പട്ടികയുടെ ക്രമവും സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു.
