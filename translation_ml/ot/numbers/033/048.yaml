translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി. സ്ഥലനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായ അസ്പഷ്ടതകൾ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
