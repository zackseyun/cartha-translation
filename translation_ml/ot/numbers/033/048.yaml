source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: ml
  text: അവർ അബാരീം മലനിരകളിൽനിന്ന് പുറപ്പെട്ടു; യെരീഹോവിനടുത്തുള്ള യോർദ്ദാനരികിലെ മോവാബ് സമതലങ്ങളിൽ പാളയമിറങ്ങി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോവാബിലെ സ്റ്റെപ്പ് പ്രദേശങ്ങളിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം തുറന്ന വരണ്ട സമതലത്തെയോ സ്റ്റെപ്പ് പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യെരീഹോയ്ക്ക് എതിർവശത്തുള്ള യോർദ്ദാനരികെ.” അവസാന സ്ഥലസൂചനയെ ചിലർ യെരീഹോയ്ക്ക് എതിർവശത്തുള്ള പ്രദേശമായി കൂടുതൽ കൃത്യമായി മനസ്സിലാക്കുന്നു; എന്നാൽ എബ്രായപാഠത്തിൽ “എതിർവശത്ത്” എന്നതിന് പ്രത്യേക പദമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: അബാരീം മലനിരകളിൽനിന്ന്
  rationale: הָרֵי എന്ന ബഹുവചനഘടന മലകളെയോ മലമ്പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാള ഭൂമിശാസ്ത്രപ്രയോഗത്തിൽ ‘മലനിരകൾ’ ഈ നാമസ്ഥലത്തിന് സ്വാഭാവികമാണ്.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ പാളയം സ്ഥാപിച്ച് താമസിക്കുക എന്ന യാത്രാവിവരണാർത്ഥത്തിലാണ്; ‘പാളയമിറങ്ങി’ ആ അർത്ഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽ
  rationale: עַרְבֹת തുറന്ന സമതലമോ പുൽക്കുറ്റിക്കാടുകളുള്ള വരണ്ട സ്റ്റെപ്പ് പ്രദേശമോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തിനായി ‘സമതലങ്ങൾ’ സ്വീകരിച്ചു, മറ്റർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിനടുത്ത് യോർദ്ദാനരികെ
  rationale: עַל നദിയോടുള്ള സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു. יְרֵחוֹ ഈ യോർദ്ദാൻ പ്രദേശത്തെ യെരീഹോയുമായി ബന്ധിപ്പിക്കുന്നു; ഹീബ്രുവിൽ ‘എതിർവശത്ത്’ എന്നതിന് പ്രത്യേക പദമില്ലാത്തതിനാൽ മുഖ്യപാഠം അതു ചേർക്കുന്നില്ല.
