  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: ml
  text: അവർ ഷാഫേർ പർവതത്തിൽനിന്ന് പുറപ്പെട്ട് ഹരാദായിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശാഫേർ’ എന്നും ലിപ്യന്തരം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ അടുത്ത പാളയസ്ഥാനത്തേക്കുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ട്’ എന്നു നൽകി.
- source_word: מֵהַר שָׁפֶר
  choice: ശേഫേർ മലയിൽനിന്ന്
  rationale: מִן + הַר എന്നത് ‘മലയിൽനിന്ന്’ എന്നാണ്; שָׁפֶר സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മസോററ്റിക് സ്വരങ്ങളെ അനുസരിച്ച് ‘ശേഫേർ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാവിവരണങ്ങളിൽ חנה ഒരു സ്ഥലത്ത് തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പാളയമിറങ്ങി’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בַּחֲרָדָה
  choice: ഹരാദയിൽ
  rationale: בְּ എന്ന സ്ഥലസൂചക ഉപസർഗം ഇവിടെ യാത്രാമധ്യേ തങ്ങിയ സ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-യിൽ’ ഉപയോഗിച്ചു; חֲרָדָה എന്ന സ്ഥലനാമം ‘ഹരാദ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്തതയും ആവർത്തനഘടനയും നിലനിർത്തി. സ്ഥലനാമങ്ങൾ ഹീബ്രു മസോററ്റിക് ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
