id: NUM.33.51
reference: Numbers 33:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אֶל אֶ֥רֶץ כְּנָֽעַן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോടു[a] സംസാരിച്ച് അവരോടു പറയുക: “നിങ്ങൾ യോർദാൻ കടന്ന് കനാൻദേശത്തേക്കു പ്രവേശിക്കുമ്പോൾ[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; അഥവാ ‘ഇസ്രായേല്യർ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ കടന്നുകൊണ്ടിരിക്കുകയാണ്’ എന്നോ ‘നിങ്ങൾ കടക്കാനിരിക്കുകയാണ്’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ കർത്തൃവാചക രൂപം സമീപഭാവിയിലുള്ള കടന്നുപോകലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ ആശയമായ നേരിട്ടുള്ള സംസാരിക്കൽ നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘പറയുക’ എന്ന ക്രിയയും വേർതിരിച്ചു സൂക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ കുടുംബബന്ധപ്രയോഗത്തിന്റെ സ്വഭാവം സൂക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ ആകെ സൂചിപ്പിക്കുന്നതുമായ രൂപം.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: אמר എന്ന രണ്ടാമത്തെ സംസാരക്രിയയെ ആദ്യത്തേതിൽ ലയിപ്പിക്കാതെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: כִּי
  choice: എപ്പോൾ
  rationale: തുടർന്നുവരുന്ന നിർദേശങ്ങൾക്ക് പശ്ചാത്തലമൊരുക്കുന്ന കാലസൂചനയായി ഇവിടെ സ്വാഭാവികമായി വായിക്കാം; അതിനാൽ മലയാളത്തിൽ ‘പ്രവേശിക്കുമ്പോൾ’ എന്ന ഘടനയിൽ പ്രകടിപ്പിച്ചു.
- source_word: אַתֶּם עֹבְרִים
  choice: നിങ്ങൾ … കടന്ന് … പ്രവേശിക്കുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക രൂപം സമീപഭാവിയിലുള്ള കടന്നുപോകലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കാലവാക്യഘടന ഈ ഭാവി/സമീപഭാവി അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദാൻ കടന്ന്
  rationale: നദിയുടെ പരമ്പരാഗത സംക്ഷിപ്ത നാമം നിലനിർത്തുകയും עבר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി സ്വാഭാവികമായി ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തേക്കു പ്രവേശിച്ച്
  rationale: אֶל എന്ന ദിശാസൂചനയും אֶרֶץ എന്ന ‘ദേശം’ എന്ന നാമവും നിലനിർത്തി, നദി കടക്കുന്നതിലൂടെ ദേശത്തിനകത്തേക്കുള്ള പ്രവേശനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ രണ്ടു സംസാരക്രിയകളും വേർതിരിച്ചു നിലനിർത്തി. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഉദ്ധരണിയായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
