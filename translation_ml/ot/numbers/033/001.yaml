id: NUM.33.1
reference: Numbers 33:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: ml
  text: 'ഇവയാണ് മോശെയുടെയും അഹരോന്റെയും കൈയാൽ[a] സൈന്യനിരകളായി[b] ഈജിപ്തുദേശത്തുനിന്നു പുറപ്പെട്ട ഇസ്രായേൽമക്കളുടെ യാത്രാഘട്ടങ്ങൾ[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെയുടെയും അഹരോന്റെയും നേതൃത്വത്തിൽ.” “കൈയാൽ” എന്നത് അവരുടെ പ്രവർത്തനമോ നേതൃത്വമോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അവരുടെ സൈന്യങ്ങൾക്കനുസരിച്ച്” അല്ലെങ്കിൽ “വിഭാഗങ്ങളായി.” ഇവിടെ എബ്രായപദം ക്രമീകരിക്കപ്പെട്ട, സൈനികസ്വഭാവമുള്ള കൂട്ടങ്ങളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “യാത്രകൾ” അല്ലെങ്കിൽ “പുറപ്പാടുകൾ.” എബ്രായപദം യാത്രാവിവരണത്തിലെ തുടർച്ചയായ ഘട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: തുടർന്നുവരുന്ന യാത്രാവിവരപ്പട്ടികയെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ മലയാള പ്രയോഗം.
- source_word: מַסְעֵי
  choice: യാത്രാഘട്ടങ്ങൾ
  rationale: യാത്രയിലെ തുടർച്ചയായ പുറപ്പാടുകളെയും താവളങ്ങളെയും സൂചിപ്പിക്കുന്ന ബഹുവചനപദം; പട്ടികാസ്വഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുകയും മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יָצְאוּ
  choice: പുറപ്പെട്ട
  rationale: ഈജിപ്തുദേശത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്ന യָצָא എന്ന ക്രിയയുടെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തുനിന്നു
  rationale: മൂലത്തിലെ אֶרֶץ, ‘ദേശം,’ ഒഴിവാക്കാതെ സ്വാഭാവികമായ മലയാള സംയുക്തരൂപത്തിൽ നൽകുന്നു.
- source_word: לְצִבְאֹתָם
  choice: സൈന്യനിരകളായി
  rationale: സംഘടിതമായ വിഭാഗങ്ങളെയോ സൈന്യങ്ങളെയോ സൂചിപ്പിക്കുന്ന צָבָא എന്ന പദത്തിന്റെ സൈനികനിറം അമിതമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּיַד
  choice: കൈയാൽ
  rationale: മോശെയും അഹരോനും മുഖാന്തരമോ അവരുടെ നേതൃത്വത്തിലോ എന്നർഥമുള്ള എബ്രായ ശൈലി ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശെയും അഹരോനും
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. എബ്രായ വാക്യത്തിന്റെ പട്ടികാപരമായ അവതരണം വ്യക്തമാക്കാൻ അവസാനത്തിൽ ദ്വിബിന്ദു ചേർത്തു. ‘കൈയാൽ’ എന്ന മൂലശൈലിയും ‘സൈന്യനിരകളായി’ എന്ന സംഘടിത/സൈനിക അർഥസാധ്യതയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
