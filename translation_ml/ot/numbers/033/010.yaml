translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഹീബ്രു താവളപ്പട്ടികയുടെ സംക്ഷിപ്തതയും ക്രിയാക്രമവും നിലനിർത്തി; സ്ഥലനാമത്തിന്റെ യഥാർത്ഥ പദാർത്ഥവും പരമ്പരാഗത പരിഭാഷയും യഥാക്രമം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സുതാര്യമായി അവതരിപ്പിച്ചു.
