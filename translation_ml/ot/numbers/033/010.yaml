source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: ml
  text: അവർ ഏലീമിൽനിന്ന് പുറപ്പെട്ട് ചെങ്കടലിന്റെ[a] തീരത്ത് പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഞാങ്ങണക്കടൽ.’ യാം സൂഫ് എന്ന എബ്രായ നാമം പരമ്പരാഗതമായി ‘ചെങ്കടൽ’ എന്നു പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ആ ആവർത്തിത യാത്രാഭാഷ സ്വാഭാവിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ എന്നു നൽകി.
- source_word: מֵאֵילִם
  choice: ഏലീമിൽനിന്ന്
  rationale: מִן പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; אֵילִם എന്ന സ്ഥലനാമം മലയാളത്തിൽ ‘ഏലീം’ എന്ന് ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה ഇവിടെ താവളമുറപ്പിച്ച് പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് യാത്രാപദമാണ്; ‘പാളയമിറങ്ങി’ അതിന്റെ മൂർത്തമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עַל
  choice: തീരത്ത്
  rationale: ജലാശയത്തോടൊപ്പം വരുന്ന עַל ഇവിടെ അതിന്റെ അരികിലോ തീരത്തോ എന്ന സ്ഥലബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘തീരത്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: יַם סוּף
  choice: ഞാങ്ങണക്കടൽ
  rationale: סוּף എന്ന പദത്തിന്റെ അടിസ്ഥാനാർത്ഥമായ ഞാങ്ങണ/ഞാങ്ങണക്കാട് നിലനിർത്തി ഭൂമിശാസ്ത്രനാമം ‘ഞാങ്ങണക്കടൽ’ എന്നു നൽകി; പരമ്പരാഗതമായ ‘ചെങ്കടൽ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
