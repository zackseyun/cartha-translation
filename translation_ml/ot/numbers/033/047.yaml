  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: ml
  text: അവർ അൽമോൻ-ദിബ്ലാഥയീമിൽനിന്ന് പുറപ്പെട്ട് നെബോവിന് അഭിമുഖമായി[a] അബാരീം മലനിരകളിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നെബോവിന് എതിർവശത്ത്’ അല്ലെങ്കിൽ ‘നെബോവിന്റെ മുമ്പിൽ.’ എബ്രായ പ്രയോഗം സ്ഥലബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: സംഖ്യ 33-ലെ യാത്രാവിവരണ സൂത്രവാക്യത്തിൽ נסע പാളയം പൊളിച്ച് അടുത്ത സ്ഥലത്തേക്കു യാത്രതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ട്’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: അൽമോൻ-ദിബ്ലാത്തയീമിൽനിന്ന്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു; ഏക സ്ഥലനാമമാണെന്നു വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന യാത്രാവിവരണ ക്രിയയുടെ അർഥം ഒരു സ്ഥലത്ത് തങ്ങി പാളയം സ്ഥാപിക്കുക എന്നതാണ്; ‘പാളയമിറങ്ങി’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: בְּהָרֵי
  choice: മലനിരകളിൽ
  rationale: הַר എന്നതിന്റെ ബഹുവചന സംയുക്തരൂപം. ഇവിടെ അനേകം മലകളടങ്ങിയ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മലനിരകളിൽ’ ഭൂമിശാസ്ത്രപരമായി വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָעֲבָרִים
  choice: അബാരീം
  rationale: ഇവിടെ സ്ഥാപിതമായ ഭൂമിശാസ്ത്രനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ പദത്തിന്റെ വ്യുത്പത്തിപരമായ അർഥം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരിച്ചു.
- source_word: לִפְנֵי
  choice: അഭിമുഖമായി
  rationale: മുഖത്തിന് മുമ്പിൽ/എതിർവശത്ത് എന്ന സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം. കൃത്യമായ ദിശ നിശ്ചയിക്കാതെ ബന്ധത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു.
- source_word: נְבוֹ
  choice: നെബോ
  rationale: സ്ഥലനാമമായതിനാൽ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
