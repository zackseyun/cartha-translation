  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശെയോടു മോവാബ് സമതലങ്ങളിൽ[a], യെരീഹോയ്ക്കടുത്തുള്ള യോർദ്ദാനരികെ, ഇപ്രകാരം സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സമതലങ്ങൾ” എന്നതിന് “പുൽമേടുനിലങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളപ്രയോഗം; തുടർന്നുള്ള לֵאמֹר-ന്റെ അർഥവും ചേർത്ത് വാക്യം അനാവശ്യമായി ആവർത്തിക്കാതിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: വ്യക്തിനാമത്തിന്റെ പതിവ് മലയാളരൂപം.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബിന്റെ സമതലങ്ങളിൽ
  rationale: עֲרָבוֹת സൂചിപ്പിക്കുന്ന തുറന്ന സമതല/പുൽമേടുനിലത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിന് എതിർവശത്ത് യോർദ്ദാനരികെവെച്ച്
  rationale: യെരീഹോയോടു ബന്ധപ്പെട്ട യോർദ്ദാനരികിലെ സ്ഥാനം വ്യക്തമാക്കുന്നു; പദസമുച്ചയം യോർദ്ദാന്റെ കിഴക്കേക്കരയിൽ, യെരീഹോയ്ക്ക് എതിർവശത്തുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിപരമായ ദൈവനാമം ഒരു പദവികൊണ്ട് പകരാതെ നിലനിർത്തുന്നു; ആധുനിക മലയാള വായനക്കാർക്കിടയിൽ കൂടുതൽ പരിചിതമായ ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ, അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വചനത്തിലേക്കുള്ള തുടർച്ച നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
