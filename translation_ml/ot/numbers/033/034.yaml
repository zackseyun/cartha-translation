  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: ml
  text: അവർ യൊത്ബാഥായിൽനിന്ന് പുറപ്പെട്ടു അബ്രോനായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് ഈ ചലനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִיָּטְבָתָה
  choice: യൊത്ബാഥയിൽനിന്ന്
  rationale: מִן എന്ന ഉപസർഗം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി. സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് അടുത്തതായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: ഈ യാത്രാവിവരണസന്ദർഭത്തിൽ חנה അടുത്ത സ്ഥലത്ത് താവളമിടുക എന്ന അർഥത്തിലാണ്. ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּעַבְרֹנָה
  choice: അബ്രോനയിൽ
  rationale: בְ ഇവിടെ സ്ഥലസൂചകമാണ്; മലയാളത്തിൽ ‘-യിൽ’ എന്ന വിഭക്തി സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു. സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി; ഹ്രസ്വമായ എബ്രായ താവളസൂത്രത്തിന്റെ സമാന്തരഘടന നിലനിർത്തിയിരിക്കുന്നു.
