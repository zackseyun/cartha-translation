  text: അവർ ഹരാദായിൽനിന്ന് പുറപ്പെട്ട് മക്ഹേലോത്തിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവർ ഹരാദായിൽനിന്ന് യാത്രതിരിച്ച് മക്ഹേലോത്തിൽ പാളയമടിച്ചു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ ഒരു പാളയസ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ എന്നത് ഈ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מֵחֲרָדָה
  choice: ഹരാദയിൽനിന്ന്
  rationale: מֵ എന്ന ഉപസർഗം ഉറവിടത്തെയോ വേർപാടിനെയോ സൂചിപ്പിക്കുന്നു. חֲרָדָה സ്ഥലനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: യാത്രാപട്ടികകളിൽ חנה എന്നത് പാളയമടിക്കുക എന്ന അർത്ഥത്തിലാണ്; ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണ്.
- source_word: בְּמַקְהֵלֹת
  choice: മക്ഹേലോത്തിൽ
  rationale: ഇവിടെ בְ പാളയസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. מַקְהֵלֹת സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു; മലയാളത്തിലെ സ്ഥാനവിഭക്തി ചേർത്തു.
