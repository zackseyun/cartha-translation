translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ആവർത്തിച്ചുള്ള ‘അവിടെ’ മൂലപാഠത്തിലെ שָׁם സംരക്ഷിക്കുന്നു; വാക്യവിഭജനം വായനാസൗകര്യം വർധിപ്പിക്കുന്നു.
