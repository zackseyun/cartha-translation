  text: וַ/יִּסְע֖וּ מִ/פּוּנֹ֑ן וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: ml
  text: അവർ പൂനോനിൽനിന്ന് പുറപ്പെട്ട് ഓബോത്തിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ പാളയം വിട്ട് യാത്ര പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന യാത്രാസൂത്രത്തിന് സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗമാണ് ‘പുറപ്പെട്ടു’.
- source_word: מִפּוּנֹן
  choice: പൂനോനിൽനിന്ന്
  rationale: മുൻചേർക്കപ്പെട്ട מִן പുറപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. פּוּנֹן എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയ്ക്ക് ഈ യാത്രാസന്ദർഭത്തിൽ പാളയം സ്ഥാപിച്ച് തങ്ങുക എന്ന അർഥമാണ്. ‘പാളയമിറങ്ങി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും യാത്രാവിവരണത്തിന് യോജിച്ചതുമാണ്.
- source_word: בְּאֹבֹת
  choice: ഓബോത്തിൽ
  rationale: താവളസ്ഥലത്തോടു ചേർന്ന בְּ ഇവിടെ സ്ഥാനം സൂചിപ്പിക്കുന്നു. אֹבֹת എന്ന സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി പാലിച്ചു. മൂലത്തിലെ തുടർച്ചയായ രണ്ടു ക്രിയകളെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പുറപ്പെട്ട് ... പാളയമിറങ്ങി’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചു.
