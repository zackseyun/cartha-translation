  text: וְ/אַהֲרֹ֔ן בֶּן שָׁלֹ֧שׁ וְ/עֶשְׂרִ֛ים וּ/מְאַ֖ת שָׁנָ֑ה בְּ/מֹת֖/וֹ בְּ/הֹ֥ר הָ/הָֽר־׃ס
base_translation:
