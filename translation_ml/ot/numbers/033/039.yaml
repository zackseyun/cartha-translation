  yaml_path: translation/ot/numbers/033/039.yaml
  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: ml
  text: അഹരോൻ ഹോർ പർവതത്തിൽ മരിച്ചപ്പോൾ നൂറ്റിയിരുപത്തിമൂന്ന് വയസ്സായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾപ്രയോഗത്തിൽ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു. വാക്യാരംഭത്തിലെ וְ ആഖ്യാനതുടർച്ച സൂചിപ്പിക്കുന്നതായതിനാൽ, ഒറ്റവാക്യമായ മലയാളത്തിൽ നിർബന്ധമായി ‘അപ്പോൾ/കൂടാതെ’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: നൂറ്റിയിരുപത്തിമൂന്നു വയസ്സായിരുന്നു
  rationale: בן + സംഖ്യ + שנה എന്ന ഹീബ്രു പ്രയോഗം പ്രായം സൂചിപ്പിക്കുന്നു. അതിന്റെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: בְּ/מֹת/וֹ
  choice: മരിക്കുമ്പോൾ
  rationale: בְ സഹിതമുള്ള ‘മരണം’ എന്ന നാമരൂപവും മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയവും ഇവിടെ കാലസംബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവൻ മരിക്കുമ്പോൾ’ എന്നതിന്റെ അർത്ഥം കർത്താവിനെ ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകി.
- source_word: בְּ/הֹר הָ/הָר
  choice: ഹോർ പർവതത്തിൽവെച്ചു
  rationale: הֹר הָהָר ഒരു സ്ഥലനാമമാണ്. בְ ഇവിടെ സംഭവസ്ഥലം സൂചിപ്പിക്കുന്നതിനാൽ ‘പർവതത്തിൽവെച്ചു’ എന്ന പ്രയോഗം അനുയോജ്യം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പ്രായവിവരവും മരണസ്ഥലവും കൃത്യമായി നിലനിർത്തി; വിശദീകരണപരമായ അധികവാക്കുകൾ ചേർത്തിട്ടില്ല.
