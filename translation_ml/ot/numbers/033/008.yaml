  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: ml
  text: അവർ ഹഹീരോത്തിന്റെ മുമ്പിൽനിന്ന്[a] പുറപ്പെട്ട് കടലിന്റെ നടുവിലൂടെ മരുഭൂമിയിലേക്കു കടന്നു; അവർ ഏതാം മരുഭൂമിയിൽ മൂന്നു ദിവസത്തെ യാത്ര ചെയ്ത്[b] മാറായിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘ഹഹീരോത്തിന്റെ മുമ്പിൽനിന്ന്.’ പുറപ്പാട് പുസ്തകത്തിൽ ഈ സ്ഥലം സാധാരണയായി ‘പി-ഹഹീരോത്ത്’ എന്നാണ് അറിയപ്പെടുന്നത്. എന്നാൽ സംഖ്യ 33:8-ലെ ഹീബ്രുവിൽ ‘പി-’ എന്ന ഘടകം ഇല്ലാത്തതിനാൽ മറ്റിടത്തെ രൂപവുമായി സമീകരിക്കാതെ ചുരുക്കരൂപം നിലനിർത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'അഥവാ: ‘അവർ ഏതാം മരുഭൂമിയിൽ മൂന്നു ദിവസത്തെ വഴിദൂരം സഞ്ചരിച്ചു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം പിരിച്ച് അടുത്ത സ്ഥലത്തേക്കു യാത്രതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: מִפְּנֵי הַחִירֹת
  choice: ഹഹീരോത്തിന്റെ മുമ്പിൽനിന്ന്
  rationale: ഹീബ്രു വാചകം ‘ഹഹീരോത്തിന്റെ മുമ്പിൽനിന്ന്’ എന്നാണ്; പുറപ്പാടിലെ ‘പി-ഹഹീരോത്ത്’ എന്ന രൂപവുമായി സമീകരിക്കാതെ ഇവിടത്തെ ചുരുക്കരൂപം നിലനിർത്തുന്നു.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: കടലിന്റെ നടുവിലൂടെ ... കടന്നു
  rationale: בְתוֹךְ എന്നത് നടുവിൽ/മധ്യത്തിൽ എന്ന ആശയം വ്യക്തമാക്കുന്നതിനാൽ കടലിലൂടെയുള്ള കടന്നുപോക്ക് ദൃശ്യമായി നിലനിർത്തുന്നു.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്ക്
  rationale: ദിശാസൂചകമായ ־ָה മരുഭൂമിയിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്നു.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: മൂന്നു ദിവസത്തെ വഴി സഞ്ചരിച്ചു
  rationale: ‘മൂന്നു ദിവസത്തെ വഴി’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ യാത്രാദൂരം/കാലയളവ് സംബന്ധിച്ച സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായിക്കാവുന്ന രൂപം നൽകുന്നു.
- source_word: בְּמִדְבַּר אֵתָם
  choice: ഏതാം മരുഭൂമിയിൽ
  rationale: സ്ഥലനാമത്തോടുള്ള construct ബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ നാമവിശേഷണക്രമത്തിൽ നൽകുന്നു.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: മാറായിൽ പാളയമിറങ്ങി
  rationale: חנה എന്ന യാത്രാവിവരണപദത്തിന് ‘പാളയമിറങ്ങി’ യോജിച്ച, മാന്യമായ ആധുനിക മലയാളമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ഹീബ്രുവിലെ സ്ഥലനാമരൂപവും ‘കടലിന്റെ നടുവിലൂടെ’ എന്ന ദൃശ്യപ്രയോഗവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
