translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ നൽകി; യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്തതയും എബ്രായത്തിലെ ക്രിയാക്രമവും കഴിയുന്നത്ര നിലനിർത്തി.
