  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: ml
  text: അവർ ഏതാമിൽനിന്ന് പുറപ്പെട്ടു, ബാൽ-സെഫോന് എതിരെയുള്ള പി-ഹഹീരോത്തിലേക്കു തിരിച്ചുപോയി[a]; മിഗ്ദോലിനു മുന്നിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മടങ്ങി.’ എബ്രായ ക്രിയയ്ക്ക് പഴയ സ്ഥലത്തേക്കു മടങ്ങുക എന്നോ സഞ്ചാരദിശ തിരിച്ചുവിടുക എന്നോ അർഥമാകാം; ഇവിടെ യാത്രാമാർഗത്തിലെ ദിശമാറ്റമാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രാവിവരണത്തിലെ נסע എന്ന പതിവുപ്രയോഗം പാളയം വിട്ട് അടുത്ത സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: מֵאֵתָם
  choice: ഏതാമിൽനിന്ന്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּשָׁב
  choice: മടങ്ങിത്തിരിഞ്ഞു
  rationale: שׁוב എന്നതിന് മടങ്ങുക എന്നും ദിശ തിരിച്ചുവിടുക എന്നും അർഥമാകാം. ഈ യാത്രാമാർഗവിവരണത്തിൽ മുൻസ്ഥാനത്തെത്തിയെന്നതിനെക്കാൾ ദിശമാറ്റം സൂചിപ്പിക്കുന്ന ‘മടങ്ങിത്തിരിഞ്ഞു’ യോജിക്കുന്നു; യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עַל פִּי הַחִירֹת
  choice: പി-ഹഹീരോത്തിലേക്ക്
  rationale: ഇവിടെ עַל സഹിതമുള്ള സ്ഥലനാമം യാത്രയുടെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-ലേക്ക്’ എന്ന രൂപം സ്വാഭാവികമാണ്; പേരിനെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹון
  choice: ബാൽ-സെഫോന് എതിരെയുള്ള
  rationale: עַל־פְּנֵי ഇവിടെ സ്ഥലപരമായ ‘മുമ്പിൽ/എതിരെ’ എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു; ഭൗമവിവരണത്തിൽ ‘എതിരെയുള്ള’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה പാളയമടിക്കുക എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; യാത്രാവിവരണത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘പാളയമിറങ്ങി’.
- source_word: לִפְנֵי מִגְדֹּל
  choice: മിഗ്ദോലിന് മുമ്പിൽ
  rationale: לִפְנֵי ഒരു സ്ഥലത്തോടുള്ള മുൻവശബന്ധം സൂചിപ്പിക്കുന്നു. മിഗ്ദോൽ ഇവിടെ സ്ഥലനാമമായതിനാൽ ‘ഗോപുരം’ എന്നു പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു.
