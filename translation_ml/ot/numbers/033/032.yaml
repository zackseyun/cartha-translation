source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/בְּנֵ֣י יַעֲקָ֑ן וַֽ/יַּחֲנ֖וּ בְּ/חֹ֥ר הַגִּדְגָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/032.yaml
  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: ml
  text: അവർ ബെനേ-യാക്കാനിൽനിന്ന് പുറപ്പെട്ട് ഹോർ-ഹഗ്ഗിദ്ഗാദിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബെനേ-യാക്കാൻ’ ഒരു സ്ഥലനാമമായിരിക്കാനാണ് സാധ്യത; എന്നാൽ ഈ ഹീബ്രുരൂപത്തിന്റെ അക്ഷരാർഥം ‘യാക്കാന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയിലെ താവളപ്പട്ടികയിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: מִבְּנֵי יַעֲקָן
  choice: ബെനേ-യാക്കാനിൽനിന്ന്
  rationale: ഇവിടെ ഈ രൂപം യാത്രാവിവരണത്തിലെ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നു; ആവർത്തനപരമായ പേരുകളുടെ തിരിച്ചറിയൽ നിലനിർത്താൻ ലിപ്യന്തരണം സ്വീകരിച്ചു. מִן എന്ന ഉപസർഗത്തിന്റെ അർഥം ‘-ൽനിന്ന്’ എന്നു നൽകി.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה താവളപ്പട്ടികയിൽ പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: ഹോർ-ഹഗ്ഗിദ്ഗാദിൽ
  rationale: ഇത് സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു; בְ എന്ന സ്ഥലസൂചക ഉപസർഗം മലയാളത്തിലെ ‘-ൽ’ വിഭക്തിയാൽ പ്രകടിപ്പിച്ചു. ഹീബ്രു നിർദേശകമായ הַ സംയുക്തനാമത്തിലെ ‘ഹഗ്’ രൂപത്തിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ മൂലഭാഷയോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; പ്രധാനവാക്യത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
