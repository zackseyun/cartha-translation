source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵֽ/חַשְׁמֹנָ֑ה וַֽ/יַּחֲנ֖וּ בְּ/מֹסֵרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: ml
  text: അവർ ഹശ്മോനയിൽനിന്ന് പുറപ്പെട്ട് മോസേരോത്തിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: മരുഭൂയാത്രയിലെ താവളപ്പട്ടികാസൂത്രത്തിൽ נסע ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ആ യാത്രാക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ടു’ എന്നു നൽകുന്നു.
- source_word: מֵחַשְׁמֹנָה
  choice: ഹശ്മോനയിൽനിന്ന്
  rationale: מֵ എന്ന ഉപസർഗം ‘നിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി. חַשְׁמֹנָה സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: ഈ യാത്രാവിവരണസന്ദർഭത്തിൽ חנה പാളയം സ്ഥാപിച്ച് താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാളയമിറങ്ങി’ എന്നത് പ്രവർത്തിയുടെ വ്യക്തതയും താവളപ്പട്ടികയുടെ സ്വാഭാവിക മലയാളശൈലിയും നിലനിർത്തുന്നു.
- source_word: בְּמֹסֵרוֹת
  choice: മോസേരോത്തിൽ
  rationale: താവളസ്ഥലത്തോടൊപ്പമുള്ള בְ മലയാളത്തിലെ സ്ഥലാധികരണപ്രത്യയമായ ‘-ത്തിൽ’കൊണ്ട് നൽകി. מֹסֵרוֹת സ്ഥലനാമമായതിനാൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ഹീബ്രു വാക്യത്തിലെ തുടർച്ചയായ രണ്ടു ക്രിയകളെ മലയാളത്തിൽ ‘പുറപ്പെട്ട് ... പാളയമിറങ്ങി’ എന്ന സ്വാഭാവിക ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു. ഇംഗ്ലീഷ് കുറിപ്പിലെ ‘camped/encamped’ വ്യത്യാസം മലയാളത്തിൽ പ്രസക്തമായ അർഥവ്യത്യാസം സൃഷ്ടിക്കാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
