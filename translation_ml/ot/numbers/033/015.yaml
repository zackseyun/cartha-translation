  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/רְפִידִ֑ם וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר סִינָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: ml
  text: അവർ രെഫീദീമിൽനിന്ന് പുറപ്പെട്ട് സീനായി മരുഭൂമിയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ ... പുറപ്പെട്ട്
  rationale: യാത്രാവിവരണത്തിലെ נסע എന്ന ക്രിയ ഒരു താവളത്തിൽനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ആ ചലനവും ഘട്ടമാറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പുറപ്പെട്ട്’ വ്യക്തമാക്കുന്നു.
- source_word: מֵרְפִידִם
  choice: രെഫീദീമിൽനിന്ന്
  rationale: മുൻപ്രത്യയമായ מ־ പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. רְפִידִם എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയ ഇവിടെ യാത്രാമധ്യേ പാളയം സ്ഥാപിച്ച് തങ്ങുക എന്ന അർഥത്തിലാണ്. ‘പാളയമിറങ്ങി’ ഈ മൂർത്തമായ പ്രവൃത്തിയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמִדְבַּר סִינָי
  choice: സീനായി മരുഭൂമിയിൽ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വനാന്തര/മരുപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച പതിവ് മലയാളപ്രയോഗമായി ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു. നിർമാണബന്ധം മലയാളത്തിൽ ‘സീനായി മരുഭൂമി’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്ത ഘടന നിലനിർത്തി; അനാവശ്യ വിശദീകരണം ചേർത്തിട്ടില്ല.
