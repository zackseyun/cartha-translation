id: NUM.22.29
reference: Numbers 22:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: ml
  text: 'ബിലെയാം കഴുതയോടു പറഞ്ഞു: “നീ എന്നെ അപഹാസ്യനാക്കിയതുകൊണ്ടാണ്! എന്റെ കൈയിൽ ഒരു വാൾ ഉണ്ടായിരുന്നെങ്കിൽ, ഇപ്പോൾത്തന്നെ ഞാൻ നിന്നെ കൊന്നുകളയുമായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ കഥനത്തിലെ wayyiqtol തുടർച്ചയെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല കഥനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണം.
- source_word: לָאָתוֹן
  choice: കഴുതയോടു
  rationale: אָתוֹן പെൺകഴുതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ഈ സന്ദർഭത്തിൽ ‘കഴുത’ സ്വാഭാവികമാണ്; ലിംഗവിവരം വാക്യത്തിന്റെ അർഥത്തിന് നിർണായകമല്ല.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: നീ എന്നെ അപഹാസ്യനാക്കി
  rationale: Hitpael രൂപം ഇവിടെ ഒരാളെ നിന്ദ്യമായോ പരിഹാസ്യമായോ കൈകാര്യം ചെയ്ത് വിഡ്ഢിയാക്കുന്ന ആശയം നൽകുന്നു; ‘അപഹാസ്യനാക്കി’ ബിലെയാമിന്റെ അപമാനബോധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לוּ
  choice: ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: ഇപ്പോൾ യാഥാർഥ്യമല്ലാത്ത ആഗ്രഹസഹിതമായ നിബന്ധന മലയാളത്തിലെ പ്രത്യയാത്മക രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: יֶשׁ חֶרֶב בְּיָדִי
  choice: എന്റെ കൈയിൽ ഒരു വാൾ ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: ‘എന്റെ കൈയിൽ വാൾ ഉണ്ട്’ എന്ന ഹീബ്രായ അസ്തിത്വപ്രയോഗത്തിലെ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് לוּ സൂചിപ്പിക്കുന്ന യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയും വ്യക്തമാക്കുന്നു.
- source_word: כִּי עַתָּה
  choice: ഇപ്പോൾത്തന്നെ
  rationale: ഭീഷണിയിലെ ഉടനടിത്തവും ‘ഈ നിമിഷംതന്നെ’ എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֲרַגְתִּיךְ
  choice: ഞാൻ നിന്നെ കൊന്നുകളയുമായിരുന്നു
  rationale: לוּ ആരംഭിക്കുന്ന യാഥാർഥ്യവിരുദ്ധ സാഹചര്യത്തിന്റെ ഫലമായി ബിലെയാം ചെയ്യുമായിരുന്ന ഉടനടി പ്രവൃത്തിയെ മലയാളത്തിൽ വ്യക്തമായി രേഖപ്പെടുത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഹീബ്രായത്തിലെ വികാരതീവ്രത നിലനിർത്താൻ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു; വായനയ്ക്ക് അനാവശ്യഭാരം വരാതിരിക്കാൻ ‘പെൺകഴുത’ എന്ന സാങ്കേതിക കൃത്യത പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ചില്ല.
