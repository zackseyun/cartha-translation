  to: 'അപ്പോൾ പെൺകഴുത ബിലെയാമിനോടു പറഞ്ഞു: “നിന്റെ ജീവിതകാലം മുഴുവൻ ഇന്നുവരെ നീ എന്റെ പുറത്ത് സവാരി ചെയ്തുവന്ന നിന്റെ പെൺകഴുതയായ ഞാൻ അല്ലയോ? നിന്നോട് ഇങ്ങനെ പെരുമാറുക എനിക്ക് എപ്പോഴെങ്കിലും പതിവായിരുന്നിട്ടുണ്ടോ?” അവൻ പറഞ്ഞു: “ഇല്ല.”'
  rationale: മൂലത്തിലെ അർഥവും അലങ്കാരചോദ്യങ്ങളുടെ ഘടനയും നിലനിർത്തിക്കൊണ്ട്, സവാരിയുടെ ‘എന്റെമേൽ’ എന്ന ബന്ധം ‘എന്റെ പുറത്ത്’ എന്നു വ്യക്തമാക്കി. അവസാന ചോദ്യത്തിൽ ‘എപ്പോഴെങ്കിലും’ ചേർത്ത് പതിവില്ലായ്മയെക്കുറിച്ചുള്ള മൂലത്തിന്റെ ഊന്നൽ കൂടുതൽ തെളിച്ചു. അടിക്കുറിപ്പ് ആവശ്യമില്ല; പെൺലിംഗവിശദാംശം പ്രധാനപാഠത്തിൽ തന്നെ ഉൾപ്പെട്ടിട്ടുണ്ട്.
