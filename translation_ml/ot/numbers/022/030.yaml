    rationale: അനുബന്ധവാക്യമായ ‘നീ സവാരി ചെയ്തുവന്ന’ എന്നതിൽ എബ്രായ עָלַיയുടെ ‘എന്റെമേൽ’ എന്ന ബന്ധം സൂചിതമാണെങ്കിലും തുറന്നുപറയുന്നില്ല. ‘എന്റെ പുറത്ത്’ എന്ന പ്രയോഗം മൂലത്തോടും മലയാള ഉപയോഗത്തോടും ചേരും.
  - severity: low
    issue: പതിവിനെക്കുറിച്ചുള്ള ചോദ്യം കൂടുതൽ വ്യക്തമായി രൂപപ്പെടുത്താം
    rationale: הַהַסְכֵּן הִסְכַּנְתִּיയുടെ ഊന്നിയ, ‘എപ്പോഴെങ്കിലും പതിവായിരുന്നോ?’ എന്ന ഭാവം ‘എപ്പോഴെങ്കിലും’ ചേർക്കുന്നതിലൂടെ സ്വാഭാവികമായി കൂടുതൽ വ്യക്തമാണ്.
  revised_text: 'അപ്പോൾ പെൺകഴുത ബിലെയാമിനോടു പറഞ്ഞു: “നിന്റെ ജീവിതകാലം മുഴുവൻ ഇന്നുവരെ നീ എന്റെ പുറത്ത് സവാരി ചെയ്തുവന്ന നിന്റെ പെൺകഴുതയായ ഞാൻ അല്ലയോ? നിന്നോട് ഇങ്ങനെ പെരുമാറുക എനിക്ക് എപ്പോഴെങ്കിലും പതിവായിരുന്നിട്ടുണ്ടോ?” അവൻ പറഞ്ഞു: “ഇല്ല.”'
