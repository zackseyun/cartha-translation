  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָ/אָת֜וֹן אֶל בִּלְעָ֗ם הֲ/לוֹא֩ אָנֹכִ֨י אֲתֹֽנְ/ךָ֜ אֲשֶׁר רָכַ֣בְתָּ עָלַ֗/י מֵ/עֽוֹדְ/ךָ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַֽ/הַסְכֵּ֣ן הִסְכַּ֔נְתִּי לַ/עֲשׂ֥וֹת לְ/ךָ֖ כֹּ֑ה וַ/יֹּ֖אמֶר לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: ml
  text: 'അപ്പോൾ പെൺകഴുത ബിലെയാമിനോടു പറഞ്ഞു: “നിന്റെ ജീവിതകാലം മുഴുവൻ ഇന്നുവരെ നീ എന്റെ പുറത്ത് സവാരി ചെയ്തുവന്ന നിന്റെ പെൺകഴുതയായ ഞാൻ അല്ലയോ? നിന്നോട് ഇങ്ങനെ പെരുമാറുക എനിക്ക് എപ്പോഴെങ്കിലും പതിവായിരുന്നിട്ടുണ്ടോ?” അവൻ പറഞ്ഞു: “ഇല്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: പെൺകഴുത / നിന്റെ പെൺകഴുത
  rationale: אָתוֹן എന്ന എബ്രായ നാമം പ്രത്യേകിച്ച് പെൺകഴുതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പെൺകഴുത’ സ്വാഭാവികവും മൂലപദത്തിന്റെ ലിംഗവിശദാംശം നേരിട്ട് നിലനിർത്തുന്നതുമാണ്.
- source_word: הֲלוֹא אָנֹכִי
  choice: ഞാൻ ... അല്ലേ
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന എബ്രായ അലങ്കാരചോദ്യത്തിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: നീ സവാരി ചെയ്തുവന്ന
  rationale: עַל ഉൾക്കൊള്ളുന്ന ‘മേൽ കയറി സഞ്ചരിക്കുക’ എന്ന ആശയം ‘സവാരി ചെയ്യുക’ വ്യക്തമായി നൽകുന്നു; ‘ചെയ്തുവന്ന’ ദീർഘകാലം തുടർന്ന പ്രവൃത്തിയും സൂചിപ്പിക്കുന്നു.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: നിന്റെ ജീവിതകാലം മുഴുവൻ ഇന്നുവരെ
  rationale: അക്ഷരാർഥത്തിലെ ‘നിന്റെ ആരംഭം/നിലനിൽപ്പ് മുതൽ’ എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: എനിക്ക് പതിവായിരുന്നിട്ടുണ്ടോ
  rationale: סכן എന്ന ക്രിയയുടെ പതിവ് അഥവാ ശീലം എന്ന അർഥവും infinitive absolute മൂലം ലഭിക്കുന്ന ഊന്നലും ചോദ്യം ചെയ്യുന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: നിന്നോട് ഇങ്ങനെ പെരുമാറുന്നത്
  rationale: כֹּה ഇപ്പോഴത്തെ അസാധാരണമായ പെരുമാറ്റത്തെ ചൂണ്ടിക്കാണിക്കുന്നു. ‘ഇങ്ങനെ പെരുമാറുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ‘നിന്നോട്’ എന്ന ബന്ധം വ്യക്തവുമാണ്.
- source_word: וַיֹּאמֶר לֹא
  choice: 'അവൻ പറഞ്ഞു: ‘ഇല്ല.’'
  rationale: ലളിതമായ ആഖ്യാനതുടർച്ചയും ബിലെയാമിന്റെ ഹ്രസ്വമായ നിഷേധമറുപടിയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പെൺലിംഗവിശദാംശം മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ പ്രധാനപാഠത്തിൽ തന്നെയുണ്ട്; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല. ആവർത്തനം കഴുതയുടെ വാദാത്മക ഊന്നൽ നിലനിർത്തുന്നു.
