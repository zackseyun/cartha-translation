reference: Numbers 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: ml
  text: അങ്ങനെ മോവാബിലെയും മിദ്യാനിലെയും മൂപ്പന്മാർ പ്രശ്നംവെക്കലിനുള്ള പ്രതിഫലം കൈകളിൽ എടുത്തുകൊണ്ട് പോയി; അവർ ബിലെയാമിന്റെ അടുക്കൽ എത്തി ബാലാക്കിന്റെ വാക്കുകൾ അവനോടു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי
  choice: മൂപ്പന്മാർ
  rationale: ജനവിഭാഗങ്ങളുടെ അംഗീകൃത മുതിർന്നവരെയോ നേതാക്കളെയോ സൂചിപ്പിക്കുന്ന സാമൂഹിക-രാഷ്ട്രീയ പദവി നിലനിർത്തുന്നു.
- source_word: וּקְסָמִים בְּיָדָם
  choice: പ്രശ്നംവെക്കുന്നതിനുള്ള പ്രതിഫലം കൈയിൽ എടുത്തുകൊണ്ട്
  rationale: קְסָמִים പ്രശ്നംവെക്കൽ/ദിവ്യജ്ഞാനം തേടൽ എന്നിവയെയോ അതുമായി ബന്ധപ്പെട്ട വസ്തുക്കളെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ ബിലെയാമിന്റെ സേവനത്തിനായി കൊണ്ടുവന്ന പ്രതിഫലമാണ് കൂടുതൽ സാധ്യത. 'കൈയിൽ' എന്ന എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: וַיָּבֹאוּ אֶל
  choice: അടുക്കൽ വന്ന്
  rationale: മുമ്പുള്ള 'പുറപ്പെട്ടു' എന്ന ക്രിയയ്ക്കുശേഷമുള്ള എത്തിച്ചേരൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: דבר אֶל എന്നത് ഒരാളോടു സംസാരിക്കുക എന്നർഥം; മലയാളത്തിലെ സ്വാഭാവിക സന്ദർഭത്തിൽ സന്ദേശം അറിയിക്കുന്ന പ്രവൃത്തിയായി 'പറഞ്ഞു' യോജിക്കുന്നു.
- source_word: דִּבְרֵי בָלָק
  choice: ബാലാക്കിന്റെ വാക്കുകൾ
  rationale: നേരിട്ടുള്ള വാക്കുകളാണോ ഏല്പിച്ച സന്ദേശമാണോ എന്നു തീർപ്പാക്കാതെ എബ്രായ നിർമാണത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: וַיֵּלְכוּ
  choice: അങ്ങനെ ... പുറപ്പെട്ടു
  rationale: വാവ്-തുടർച്ച മുൻവാക്യത്തിന്റെ ഫലമായി കഥ മുന്നോട്ടുപോകുന്നതു സൂചിപ്പിക്കുന്നു; 'അങ്ങനെ' ബന്ധവും 'പുറപ്പെട്ടു' യാത്രയുടെ ആരംഭവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ദിവ്യജ്ഞാനം' പോലുള്ള സാങ്കേതിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന 'പ്രശ്നംവെക്കുക' ഉപയോഗിച്ചു; പുരാതന മന്ത്രവാദപരമായ സന്ദർഭം അതിലൂടെ വ്യക്തമാകുന്നു.
