revisions:
- from: ഇപ്പോൾ നിങ്ങളും ദയവായി ഈ രാത്രി ഇവിടെ താമസിക്കൂ; യഹ്‌വെ എന്നോട് ഇനിയും എന്ത്[a] പറയുമെന്ന് ഞാൻ അറിയട്ടെ.
  to: യഹ്‌വെ എന്നോടു ഇനിയും എന്തു പറയുമെന്ന് അറിയാൻ, ഇപ്പോൾ നിങ്ങളും ദയവായി ഇന്നുരാത്രി ഇവിടെ തങ്ങുക.[a]
  rationale: The revision retains every semantic component of the Hebrew while using idiomatic modern Malayalam. It renders the cohortative as a purpose clause (‘അറിയാൻ’), keeps the additive ‘നിങ്ങളും,’ and uses the natural overnight-stay expression ‘ഇന്നുരാത്രി ഇവിടെ തങ്ങുക.’
