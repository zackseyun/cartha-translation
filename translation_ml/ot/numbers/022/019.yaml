source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: ml
  text: യഹ്‌വെ എന്നോടു ഇനിയും എന്തു പറയുമെന്ന് അറിയാൻ, ഇപ്പോൾ നിങ്ങളും ദയവായി ഇന്നുരാത്രി ഇവിടെ തങ്ങുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇനിയും എന്ത്’ എന്നതിന് ‘മറ്റെന്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ഇപ്പോൾ
  rationale: അടുത്ത നിർദേശം അവതരിപ്പിക്കുന്ന സംഭാഷണസൂചകം; മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: שְׁבוּ נָא
  choice: ദയവായി താമസിക്കൂ
  rationale: ישׁב ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘ഇരിക്കുക’ എന്നതിലുപരി ‘തങ്ങുക/താമസിക്കുക’ എന്ന അർഥത്തിലാണ്; נָא നൽകുന്ന വിനയഭാവം ‘ദയവായി’കൊണ്ട് പ്രകടമാക്കി.
- source_word: בָזֶה
  choice: ഇവിടെ
  rationale: സന്ദർഭത്തിലെ സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: גַּם אַתֶּם
  choice: നിങ്ങളും
  rationale: മുൻ ദൂതസംഘത്തെപ്പോലെ ഇവരും താമസിക്കണമെന്ന കൂട്ടിച്ചേർക്കൽഭാവം നിലനിർത്തുന്നു.
- source_word: הַלָּיְלָה
  choice: ഈ രാത്രി
  rationale: വരാനിരിക്കുന്ന രാത്രിയെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം; ‘ഇന്ന് രാത്രി’ എന്നും പറയാമെങ്കിലും ഗൗരവമുള്ള ആഖ്യാനശൈലിക്ക് ‘ഈ രാത്രി’ യോജിക്കുന്നു.
- source_word: וְאֵדְעָה
  choice: ഞാൻ അറിയട്ടെ
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ ഉദ്ദേശ്യവും ആഗ്രഹഭാവവും ലളിതഭാവിയിലെക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מַה יֹּסֵף
  choice: ഇനിയും എന്ത്
  rationale: יסף നൽകുന്ന ‘കൂടുതൽ/വേറെ’ എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘മറ്റെന്ത്’ എന്നതും സാധ്യമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാൽ മാറ്റാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളലിപിയിൽ നേരിട്ട് നൽകിയിരിക്കുന്നു.
- source_word: דַּבֵּר עִמִּי
  choice: എന്നോട് … പറയുമെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നോടു സംസാരിക്കുക’ എന്നായിരിക്കാമെങ്കിലും ഇവിടെ ലഭിക്കുന്ന സന്ദേശത്തിലാണ് ഊന്നൽ; മലയാളത്തിൽ ‘എന്നോട് പറയുക’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം അത് ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’ പരമ്പരാഗത രൂപമാണെങ്കിലും ‘യഹ്‌വെ’ എബ്രായ നാമത്തിന്റെ സാധ്യതയേറിയ ഉച്ചാരണത്തോട് അടുത്തതാണ്.
- issue: ബിലെയാമിന്റെ പ്രതീക്ഷയുടെ സ്വഭാവം
  choice: ‘ഇനിയും എന്ത് പറയുമെന്ന്’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ദൈവം നിർദേശം മാറ്റുമെന്നോ മുൻവാക്ക് സ്ഥിരീകരിക്കുമെന്നോ വ്യക്തമായി ചേർക്കുക
  rationale: വാക്യം ബിലെയാമിന്റെ ഉദ്ദേശ്യം ദൈവശാസ്ത്രപരമായി വിശദീകരിക്കുന്നില്ല; അതിനാൽ അവൻ പുതിയതോ അധികമോ ആയ വാക്ക് പ്രതീക്ഷിക്കുന്നതിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘താമസിക്കൂ’, ‘ദയവായി’ തുടങ്ങിയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
