source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: ml
  text: അതുകൊണ്ട് ഇപ്പോൾ, ദയവായി വന്ന് എനിക്കുവേണ്ടി ഈ ജനത്തെ ശപിക്കുക. അവർ എന്നെക്കാൾ ശക്തരാണ്. ഒരുപക്ഷേ എനിക്ക് അവരെ പ്രഹരിച്ച്[a] ദേശത്തുനിന്ന് ഓടിച്ചുകളയാൻ കഴിഞ്ഞേക്കും. നീ ആരെ അനുഗ്രഹിക്കുന്നുവോ അവർ അനുഗ്രഹിക്കപ്പെട്ടവരാണ് എന്നും, നീ ആരെ ശപിക്കുന്നുവോ അവർ ശപിക്കപ്പെട്ടവരാണ് എന്നും എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ തോൽപ്പിച്ച്.” എബ്രായപദത്തിന്റെ അടിസ്ഥാനാർഥം “പ്രഹരിക്കുക” എന്നാണ്; ഈ സന്ദർഭത്തിൽ അത് യുദ്ധത്തിൽ തോൽപ്പിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന വാവിനെയും അഭ്യർഥനയിലെ അടിയന്തരമായ മാറ്റത്തെയും സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְכָה נָּא
  choice: ദയവായി വന്ന്
  rationale: ആജ്ഞാരൂപത്തോടൊപ്പമുള്ള അപേക്ഷാസൂചക കണത്തിന്റെ വിനയവും അടിയന്തരതയും നിലനിർത്തുന്നു.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: എനിക്കുവേണ്ടി ഈ ജനത്തെ ശപിക്കുക
  rationale: ശാപം വിളിച്ചുവരുത്തുക എന്ന אָרָהയുടെ നേരിട്ടുള്ള അർഥവും לִּי സൂചിപ്പിക്കുന്ന ബാലാക്കിന്റെ താത്പര്യവും അഭ്യർഥനയും സംരക്ഷിക്കുന്നു.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: കാരണം അവർ എന്നെക്കാൾ ശക്തരാണ്
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന സർവനാമംകൊണ്ട് പരാമർശിക്കുമ്പോഴും താരതമ്യപരമായ സൈനിക ഭീഷണി നിലനിർത്തുന്നു.
- source_word: אוּלַי אוּכַל
  choice: ഒരുപക്ഷേ എനിക്ക് ... കഴിഞ്ഞേക്കും
  rationale: അനിശ്ചിതത്വവും കഴിവിനെക്കുറിച്ചുള്ള പ്രതീക്ഷയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: נַכֶּה בּוֹ
  choice: അവരെ പ്രഹരിച്ച്
  rationale: נכהയുടെ അടിസ്ഥാനമായ ‘പ്രഹരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘തോൽപ്പിക്കുക’ എന്നു മാത്രം നൽകി ഫലം മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: ദേശത്തുനിന്ന് ഓടിച്ചുകളയാൻ
  rationale: גרשയുടെ ബലമായി പുറത്താക്കുക എന്ന അർഥവും הָאָרֶץയുടെ പ്രദേശപരമായ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: നീ ആരെ അനുഗ്രഹിക്കുന്നുവോ അയാൾ അനുഗ്രഹിക്കപ്പെട്ടവനാണ്
  rationale: പൊതുവായ ബന്ധവാക്യവും അനുഗ്രഹത്തിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: നീ ആരെ ശപിക്കുന്നുവോ അയാൾ ശപിക്കപ്പെട്ടവനാണ്
  rationale: മുൻവാക്യത്തോടുള്ള സമാന്തരഘടനയും നിഷ്ക്രിയമായ ഫലാവസ്ഥയും നിലനിർത്തുന്നു.
