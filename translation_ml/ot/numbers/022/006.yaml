translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭ്യർഥനാശൈലി ഉപയോഗിച്ചു. ‘ഈ ജനം’ എന്ന ഏകവചന സമൂഹനാമത്തെ തുടർന്നുള്ള വാക്യങ്ങളിൽ സാധാരണ മലയാളപ്രയോഗമനുസരിച്ച് ‘അവർ/അവരെ’ എന്നു പരാമർശിച്ചു. അനുഗ്രഹം–ശാപം എന്നീ സമാന്തരവാക്യങ്ങളുടെ താളവും ഫലാവസ്ഥയും നിലനിർത്തി.
