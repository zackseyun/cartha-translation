  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: ml
  text: 'മോവാബ് മിദ്യാനിലെ മൂപ്പന്മാരോടു പറഞ്ഞു: “ഇപ്പോൾ ഈ സമൂഹം നമ്മുടെ ചുറ്റുമുള്ളതെല്ലാം നക്കിത്തിന്നും[a], കാള വയലിലെ പച്ചസസ്യങ്ങളെ[b] നക്കിത്തിന്നുന്നതുപോലെ.” സിപ്പോരിന്റെ മകൻ ബാലാക്ക് അക്കാലത്ത് മോവാബിന്റെ രാജാവായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വിഴുങ്ങിക്കളയും.” എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം “നക്കുക” എന്നാണ്; കാളയെക്കുറിച്ചുള്ള ഉപമയുടെ ദൃശ്യബിംബം മുഖ്യപാഠം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “വയലിലെ പുല്ലിനെ.” എബ്രായപദം പുല്ലിനെ മാത്രമല്ല, പച്ചയായ സസ്യജാലത്തെ പൊതുവായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: ഒരു ദേശത്തെയും ജനതയെയും വ്യക്തിവൽക്കരിച്ച് സൂചിപ്പിക്കുന്ന ദേശീയനാമമായി നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: זִקְנֵי מִדְיָן
  choice: മിദ്യാനിലെ മൂപ്പന്മാർ
  rationale: നിർമാണബഹുവചനമായ ‘മിദ്യാന്റെ മൂപ്പന്മാർ’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: הַקָּהָל
  choice: ഈ സമൂഹം
  rationale: ഒന്നിച്ചുകൂടിയ ഇസ്രായേൽജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ എന്ന പദത്തിനുണ്ടാകാവുന്ന പിൽക്കാല സഭാപരമായ അർഥച്ചായ ഒഴിവാക്കി, സന്ദർഭത്തിലെ സമീപസൂചന നിലനിർത്താൻ ‘ഈ’ ചേർത്തു.
- source_word: יְלַחֲכוּ
  choice: നക്കിത്തിന്നും
  rationale: לחך എന്ന ക്രിയയുടെ ‘നക്കുക’ എന്ന ദൃശ്യബിംബവും ഭക്ഷിച്ചുതീർക്കുമെന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നൽകുന്നു; പിന്നാലെയുള്ള കാളയുടെ ഉപമയുമായി പദചിത്രം ബന്ധിപ്പിക്കുന്നു.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: നമ്മുടെ ചുറ്റുമുള്ളതെല്ലാം
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘നമ്മുടെ ചുറ്റുപാടുകളെല്ലാം’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: കാള ... നക്കിത്തിന്നുന്നതുപോലെ
  rationale: താരതമ്യഘടനയും ആവർത്തിക്കുന്ന לחך എന്ന ധാതുവിന്റെ ദൃശ്യബിംബവും സംരക്ഷിക്കുന്നു.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: വയലിലെ പച്ചസസ്യങ്ങൾ
  rationale: יֶרֶק പ്രത്യേകിച്ച് പുല്ല് മാത്രമല്ല, പച്ചയായ സസ്യവളർച്ചയെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ വിശാലമായ അർഥം നിലനിർത്തി.
- source_word: וּבָלָק בֶּן צִפּוֹר מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: അക്കാലത്ത് സിപ്പോരിന്റെ മകനായ ബാലാക്കായിരുന്നു മോവാബിലെ രാജാവ്
  rationale: വാവ് ഇവിടെ വെറും തുടർച്ചയേക്കാൾ പശ്ചാത്തലവിവരം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസൂചനയോടുകൂടിയ വാക്യമായി നൽകി.
