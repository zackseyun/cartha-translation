translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നക്കിത്തിന്നും’ എന്ന പ്രയോഗം എബ്രായത്തിലെ ആവർത്തിത ദൃശ്യബിംബം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി എത്തിക്കുന്നു; ‘സമൂഹം’ മതസഭാപരമായ അനാവശ്യ അർഥച്ചായ ഒഴിവാക്കുന്നു.
