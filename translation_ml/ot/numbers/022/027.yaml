  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: ml
  text: യഹ്‌വേയുടെ ദൂതനെ[a] കണ്ടപ്പോൾ പെൺകഴുത ബിലെയാമിന്റെ കീഴിൽ കിടന്നു. അപ്പോൾ ബിലെയാമിനു കോപം വന്നു; അവൻ വടികൊണ്ട് പെൺകഴുതയെ അടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സന്ദേശവാഹകനെ.’ എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം അതിമാനുഷിക ദൂതനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: പെൺകഴുത
  rationale: אָתוֹן എന്ന പദം പെൺകഴുതയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പെൺകഴുത’ സ്വാഭാവികവും മൂലപദത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നതുമാണ്.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ അഥവാ ‘സന്ദേശവാഹകൻ’ എന്നർഥമുണ്ട്; ഇവിടെ അതിമാനുഷിക ദൂതനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַתִּרְבַּץ
  choice: കിടന്നു
  rationale: רבץ എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം കിടക്കുക അഥവാ പതുങ്ങിക്കിടക്കുക എന്നതാണ്. സവാരിക്കാരന്റെ കീഴിൽ കഴുത കിടന്ന സംഭവത്തെ ‘കിടന്നു’ എന്നു നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: תַּחַת בִּלְעָם
  choice: ബിലെയാമിന്റെ കീഴിൽ
  rationale: תַּחַת എന്നതിന്റെ സ്ഥലസംബന്ധമായ അർഥം ‘കീഴിൽ’ എന്നാണ്; ബിലെയാം കഴുതപ്പുറത്തിരുന്നുവെന്ന സന്ദർഭവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: ബിലെയാമിനു കോപം ജ്വലിച്ചു
  rationale: ‘കോപം ജ്വലിച്ചു’ എന്നത് എബ്രായ ഭാഷാശൈലിയിലെ തീവ്രത നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന dignified പ്രയോഗമായി നിൽക്കുകയും ചെയ്യുന്നു.
- source_word: וַיַּךְ
  choice: അടിച്ചു
  rationale: נכה ഇവിടെ വടികൊണ്ടുള്ള ഒറ്റ പ്രഹരത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ ക്രിയയാണ്; ‘അടിച്ചു’ സ്വാഭാവികവും അതിശയോക്തിയില്ലാത്തതുമാണ്.
- source_word: בַּמַּקֵּל
  choice: വടികൊണ്ട്
  rationale: מַקֵּל വടി അഥവാ കോൽ എന്നർഥം നൽകുന്നു. എബ്രായത്തിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ലാത്തതിനാൽ ‘അവന്റെ വടി’ എന്നു ചേർക്കാതെ മൂലത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ അർഥം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: പദത്തിന് പൊതുവായി ‘സന്ദേശവാഹകൻ’ എന്നർഥമുണ്ടെങ്കിലും, ഈ വിവരണത്തിൽ അതിമാനുഷിക ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ പെൺലിംഗസൂചന ‘പെൺകഴുത’ എന്നു തുറന്നുപറഞ്ഞു; വടിയുടെ ഉടമസ്ഥത മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അനാവശ്യമായി ‘അവന്റെ’ എന്നു ചേർത്തിട്ടില്ല.
