  verdict: revise
  source_fidelity: The narrative sequence, morning setting, address to Balak’s officials, command, and stated reason are accurately conveyed. However, the draft adds the explicit sense of return in “മടങ്ങിപ്പോകൂ,” whereas the Hebrew says simply “go to your land.” More importantly, יְהוָה should follow the project’s stated Yahweh rendering rather than the alternative “യഹോവ.”
