  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: ml
  text: 'അങ്ങനെ ബിലെയാം രാവിലെ എഴുന്നേറ്റ് ബാലാക്കിന്റെ ഉദ്യോഗസ്ഥരോടു[a] പറഞ്ഞു: “നിങ്ങളുടെ നാട്ടിലേക്കു പോകൂ; കാരണം, നിങ്ങളോടൊപ്പം പോകാൻ എന്നെ അനുവദിക്കാൻ യാഹ്‌വെ വിസമ്മതിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബാലാക്കിന്റെ പ്രഭുക്കന്മാരോടു” അല്ലെങ്കിൽ “ബാലാക്കിന്റെ നേതാക്കളോടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ഖാൽ വയിക്തോൽ രൂപം ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു; സമയപ്രയോഗത്തോടൊപ്പം ‘എഴുന്നേറ്റ്’ സ്വാഭാവികമാണ്.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: വ്യക്തമായ ഊന്നൽ കൂട്ടാതെ സാധാരണ പ്രഭാതസമയത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: שָׂרֵי בָלָק
  choice: ബാലാക്കിന്റെ ഉദ്യോഗസ്ഥരോടു
  rationale: שָׂרִים എന്നതിന് പ്രഭുക്കന്മാർ, നേതാക്കൾ, ഉദ്യോഗസ്ഥർ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ രാജാവിന്റെ ദൂതസംഘമായതിനാൽ ‘ഉദ്യോഗസ്ഥർ’ അവരുടെ ഔദ്യോഗിക പ്രതിനിധിത്വം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: നിങ്ങളുടെ നാട്ടിലേക്കു മടങ്ങിപ്പോകൂ
  rationale: പദശഃ ‘നിങ്ങളുടെ ദേശത്തേക്കു പോകൂ’; സന്ദർഭത്തിൽ അവർ വന്നിടത്തേക്കുള്ള തിരിച്ചുപോക്കാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ ‘മടങ്ങിപ്പോകൂ’ ലക്ഷ്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻ കല്പനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ നേരായ സമാനപദം.
- source_word: מֵאֵן
  choice: വിസമ്മതിച്ചിരിക്കുന്നു
  rationale: מאן എന്ന പീയേൽ പൂർണ്ണക്രിയ വ്യക്തമായ നിരസനം സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ തീരുമാനത്തിന്റെ നിലവിലുള്ള പ്രാബല്യം മലയാളത്തിലെ ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ പരമ്പരാഗതവും വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്നതുമായ വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: לְתִתִּי לַהֲלֹךְ עִמָּכֶם
  choice: നിങ്ങളോടൊപ്പം പോകാൻ എന്നെ അനുവദിക്കാൻ
  rationale: נתן + കർത്തൃസൂചക പ്രത്യയം + അനന്തക്രിയ ഇവിടെ ‘അനുവദിക്കുക’ എന്ന പ്രയോഗാർഥം നൽകുന്നു; הלך עם കൂടെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ സംസാരക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാളരൂപം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്നു നൽകുന്നു; ‘യാഹ്‌വെ’ കൂടുതൽ പുനർനിർമിത ഉച്ചാരണരൂപമാണ്.
- issue: ദൈവിക നിരസനത്തിന്റെ പ്രാബല്യം
  choice: വിസമ്മതിച്ചിരിക്കുന്നു
  alternative: വിസമ്മതിച്ചു
  rationale: പൂർണ്ണക്രിയയായ מֵאֵן നടന്ന നിരസനത്തെയും ഇപ്പോൾ ബാധകമായ തീരുമാനത്തെയും ഒരുമിച്ചു സൂചിപ്പിക്കാൻ കഴിയും; മലയാളത്തിലെ പൂർത്തികാല രൂപം ആ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നാട്’ സാധാരണ വായനക്കാർക്ക് സുലഭമാണ്; ‘മടങ്ങിപ്പോകൂ’ സന്ദർഭത്തിൽ അടങ്ങിയിരിക്കുന്ന തിരിച്ചുപോക്കിന്റെ അർഥം വ്യക്തമാക്കുന്നു. ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റിയിട്ടില്ല.
