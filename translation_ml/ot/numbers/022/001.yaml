base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: ml
  text: പിന്നെ ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെട്ടു; യോർദ്ദാന്റെ മറുകരയിൽ, യെരീഹോവിന് എതിർവശത്തുള്ള മോവാബ് സമതലങ്ങളിൽ അവർ പാളയമിറങ്ങി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽമക്കൾ” എന്നതിന്റെ എബ്രായരൂപം അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്; ഇത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന പതിവ് ദേശീയനാമമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “യോർദ്ദാന്റെ മറുകരയിൽ” എന്നത് “യോർദ്ദാനക്കരെ” അല്ലെങ്കിൽ “യോർദ്ദാന്റെ അപ്പുറത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം വിവരിക്കുന്നവന്റെ ഭൂമിശാസ്ത്രദൃഷ്ടികോണത്തോട് ആപേക്ഷികമാണ്. യെരീഹോ പാളയസ്ഥലത്തിന്റെ എതിർവശത്തുള്ള അടയാളസ്ഥാനമാണ്.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ נסע പാളയം വിട്ട് യാത്ര തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ദേശീയസമൂഹനാമത്തെ മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ രീതിയിൽ നിലനിർത്തുന്നു; ഇവിടെ മുഴുവൻ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ ‘പാളയം സ്ഥാപിക്കുക/തങ്ങുക’ എന്ന യാത്രാസന്ദർഭ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽ
  rationale: עַרְבוֹת എന്നത് സമതലമോ പുൽമേടുപോലുള്ള തുറന്ന പ്രദേശമോ സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രനാമമായി ‘മോവാബ് സമതലങ്ങൾ’ വ്യക്തവും സ്ഥാപിതവുമാണ്.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദ്ദാനക്കരെ
  rationale: പ്രസ്താവകന്റെ ഭൂമിശാസ്ത്രദൃഷ്ടികോണത്തോട് ആപേക്ഷികമായി ‘യോർദ്ദാന്റെ മറുകരയിൽ/അക്കരെ’ എന്ന ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְרֵחוֹ
  choice: യെരീഹോവിന് എതിർവശത്ത്
  rationale: യെരീഹോ ഇവിടെ പാളയസ്ഥലത്തെ തിരിച്ചറിയിക്കുന്ന മറുകരയിലെ ഭൂപ്രദേശസൂചകമാണ്; ‘എതിർവശത്ത്’ എന്നു നൽകുന്നത് മോവാബ് സമതലങ്ങൾ യോർദ്ദാന്റെ കിഴക്കുവശത്താണെന്ന സ്ഥാനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
