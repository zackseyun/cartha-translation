source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: ml
  text: രാവിലെ ബാലാക്ക് ബിലെയാമിനെ കൂട്ടിക്കൊണ്ടുപോയി ബാമോത്ത്-ബാലിലേക്കു[a] കയറ്റി. അവിടെനിന്ന് അവൻ ജനത്തിന്റെ അറ്റം കണ്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബാമോത്ത്-ബാൽ’ എന്നത് സ്ഥലനാമമായി എടുക്കാതെ വിവരണാത്മക പ്രയോഗമായി എടുത്താൽ, ‘ബാലിന്റെ ഉയർന്ന സ്ഥലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവിടെനിന്ന് ഇസ്രായേൽജനത്തിന്റെ ഏറ്റവും പുറത്തെ ഭാഗം മാത്രമേ കാണാനായുള്ളൂ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: പിറ്റേന്നു രാവിലെ
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ തുടർസംഭവവും പ്രഭാതസമയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുപോയി
  rationale: ഇവിടെ ബാലാക്ക് ബിലെയാമിനെ മറ്റൊരു സ്ഥലത്തേക്കു കൂടെ കൊണ്ടുപോകുന്നതാണ്; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: וַיַּעֲלֵהוּ
  choice: കയറ്റി
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള കാരണാർഥമായ ‘മുകളിലേക്കു കൊണ്ടുപോകുക/കയറ്റുക’ എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בָּמוֹת בָּעַל
  choice: ബാമോത്ത്-ബാൽ
  rationale: സന്ദർഭത്തിൽ ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; സംയുക്തനാമം സൂചിപ്പിക്കാൻ ഹൈഫൻ നിലനിർത്തി.
- source_word: וַיַּרְא
  choice: അവൻ ... കണ്ടു
  rationale: ראה എന്ന സാധാരണ ‘കാണുക’ എന്ന അർഥം നിലനിർത്തുന്നു. അടുത്തുള്ള പുരുഷ ഏകവചന സൂചന സന്ദർഭത്തിൽ ബിലെയാമിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ഹീബ്രായത്തിലെ സർവനാമപരമായ സ്വാഭാവികത സംരക്ഷിക്കാൻ ‘അവൻ’ എന്നു നൽകി.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: കാഴ്ച ലഭിച്ച സ്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: קְצֵה הָעָם
  choice: ജനത്തിന്റെ അറ്റം മാത്രം
  rationale: קצה എന്നതിന്റെ ‘അറ്റം/അഗ്രഭാഗം’ എന്ന അർഥവും മുഴുവൻ ജനത്തെയല്ല, പുറത്തെ ഭാഗം മാത്രമാണ് ദൃശ്യമായതെന്ന സന്ദർഭസൂചനയും നൽകുന്നു; ‘പാളയം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമം ലിപ്യന്തരിച്ചു; മൂലത്തിലെ സംക്ഷിപ്തതയും ‘അവൻ’ എന്നതിലെ പരാമർശസാധ്യതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
