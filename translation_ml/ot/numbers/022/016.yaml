  edition: WLC
  text: וַ/יָּבֹ֖אוּ אֶל בִּלְעָ֑ם וַ/יֹּ֣אמְרוּ ל֗/וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן צִפּ֔וֹר אַל נָ֥א תִמָּנַ֖ע מֵ/הֲלֹ֥ךְ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: ml
  text: 'അവർ ബിലെയാമിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “സിപ്പോരിന്റെ മകനായ ബാലാക്ക് ഇപ്രകാരം പറയുന്നു: ദയവായി എന്റെ അടുക്കൽ വരാൻ വിസമ്മതിക്കരുത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: അവർ ബിലെയാമിന്റെ അടുക്കൽ വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘വരുക/പ്രവേശിക്കുക’യും אֶל സൂചിപ്പിക്കുന്ന ദിശയും സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: അവനോടു പറഞ്ഞു
  rationale: אמר എന്ന സംസാരക്രിയയും പരോക്ഷ കർമസൂചകമായ לוֹയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ദൂതസന്ദേശങ്ങളിൽ ഉപയോഗിക്കുന്ന ഔപചാരിക സൂത്രവാക്യത്തിന്റെ ശൈലി നിലനിർത്തുന്നു.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: സിപ്പോരിന്റെ മകനായ ബാലാക്ക്
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുകയും ഹീബ്രു construct ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אַל־נָא
  choice: ദയവായി ... അരുത്
  rationale: אַל എന്ന നിരോധനവും נָא നൽകുന്ന വിനീതമായ അഭ്യർഥനാഭാവവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: תִמָּנַע מֵהֲלֹךְ אֵלָי
  choice: എന്റെ അടുക്കൽ വരാൻ മടിക്കരുത്
  rationale: מנע എന്നത് ഇവിടെ ഒരു പ്രവൃത്തി ചെയ്യുന്നതിൽനിന്ന് പിന്തിരിയുക/വിസമ്മതിക്കുക എന്ന ആശയം നൽകുന്നു. ലക്ഷ്യം സംസാരിക്കുന്നവനായതിനാൽ הלך אֵלָי എന്നത് മലയാളത്തിൽ ‘എന്റെ അടുക്കൽ വരുക’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ദൂതസന്ദേശശൈലി. ‘ഇപ്രകാരം പറയുന്നു’ എന്ന പ്രയോഗം മൂലത്തിലെ ഔപചാരികത നിലനിർത്തുന്നു; പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
