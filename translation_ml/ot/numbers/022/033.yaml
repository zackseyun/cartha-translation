source:
  edition: WLC
  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: ml
  text: കഴുത എന്നെ കണ്ടു; ഈ മൂന്നു പ്രാവശ്യവും എന്റെ മുമ്പിൽവെച്ച് വഴിമാറി. അവൾ എന്റെ മുമ്പിൽനിന്ന് മാറിപ്പോയിരുന്നില്ലെങ്കിൽ[a], ഇപ്പോഴേക്കും ഞാൻ നിന്നെ കൊന്ന് അവളെ ജീവനോടെ വിട്ടേനേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ, “ഒരുപക്ഷേ അവൾ എന്റെ മുമ്പിൽനിന്ന് മാറിപ്പോയി.” എന്നാൽ സന്ദർഭവും തുടർന്നുള്ള വാക്യവും കണക്കിലെടുത്ത് ഇത് സാധാരണയായി “അവൾ എന്റെ മുമ്പിൽനിന്ന് മാറിപ്പോയിരുന്നില്ലെങ്കിൽ” എന്ന പ്രതിവാസ്തവ വ്യവസ്ഥയായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: എന്നെ കണ്ടിട്ട്
  rationale: ראה ഇവിടെ നേരിട്ടുള്ള കാഴ്ചയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിനായി തുടർപ്രവൃത്തിയുമായി ബന്ധിപ്പിച്ചു.
- source_word: הָאָתוֹן
  choice: കഴുത
  rationale: אָתוֹן പെൺകഴുതയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കഴുത’ സ്വാഭാവികമാണ്; തുടർന്നുള്ള ‘അവൾ’ അതിന്റെ ലിംഗം വ്യക്തമാക്കുന്നു.
- source_word: וַתֵּט לְפָנַי / נָטְתָה מִפָּנַי
  choice: എന്റെ മുമ്പിൽനിന്ന് മാറിപ്പോയി
  rationale: נטה എന്നതിന് ഇവിടെ വഴിമാറുക/തിരിഞ്ഞുമാറുക എന്ന അർഥം. מִפָּנַיയിലെ സ്ഥാനബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ഈ മൂന്നു പ്രാവശ്യവും
  rationale: രൂപകമായി ‘മൂന്നു കാൽ/അവസരങ്ങൾ’ എന്നതല്ല, ആവർത്തിച്ച മൂന്നു സംഭവങ്ങൾ എന്ന ഹീബ്രു പ്രയോഗാർഥമാണ്.
- source_word: אוּלַי
  choice: …ഇല്ലായിരുന്നെങ്കിൽ
  rationale: אוּלַי സാധാരണ ‘ഒരുപക്ഷേ’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിലെ കഥാതർക്കവും തുടർന്നുള്ള ഫലവാക്യവും ഒരു പ്രതിവാസ്തവ വ്യവസ്ഥ ആവശ്യപ്പെടുന്നു.
- source_word: כִּי עַתָּה גַּם אֹתְךָה הָרַגְתִּי
  choice: ഇപ്പോഴേക്കും ഞാൻ നിന്നെ കൊന്ന്
  rationale: പൂർണക്രിയ ഇവിടെ സംഭവിക്കാതിരുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഇപ്പോഴേക്കും…കൊന്ന്’ എന്ന ഘടന ആ പ്രതിവാസ്തവ അർഥം നൽകുന്നു. גַּם നൽകുന്ന ഊന്നൽ വാക്യവിരോധത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: അവളെ ജീവനോടെ വിട്ടേനേ
  rationale: חיהയുടെ ഹിഫീൽ രൂപം ‘ജീവനോടെ നിലനിർത്തുക/ജീവിക്കാൻ വിടുക’ എന്നാണ്; ‘ജീവനോടെ വിട്ടേനേ’ കൊല്ലുന്നതുമായുള്ള വിരോധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: אוּלַיയ്ക്ക് ശേഷമുള്ള വാക്യത്തിൽ പ്രത്യക്ഷമായ നിഷേധപദമില്ലെങ്കിലും സന്ദർഭം പ്രതിവാസ്തവ അർഥം ആവശ്യപ്പെടുന്നു
  choice: ‘അവൾ … മാറിപ്പോയിരുന്നില്ലെങ്കിൽ’ എന്ന് വിവർത്തനം ചെയ്തു; ഉറവിടത്തിലെ പ്രത്യേകത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ‘ഒരുപക്ഷേ അവൾ എന്റെ മുമ്പിൽനിന്ന് മാറിപ്പോയി’ എന്ന അക്ഷരാനുസൃത അവതരണം
  rationale: കഴുത വഴിമാറിയതാണ് ബിലെയാമിന്റെ മരണം തടഞ്ഞതെന്ന് കഥാസന്ദർഭവും ‘ഞാൻ നിന്നെ കൊന്ന് അവളെ ജീവനോടെ വിട്ടേനേ’ എന്ന തുടർവാക്യവും വ്യക്തമാക്കുന്നു. അതിനാൽ നിഷേധം മലയാളത്തിൽ പ്രകടമാക്കുന്നു; എന്നാൽ ഹീബ്രുവിലെ യഥാർഥ രൂപം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘പെൺകഴുത’ എന്ന ഭാരമുള്ള രൂപത്തിന് പകരം ‘കഴുത’ ഉപയോഗിച്ച് ‘അവൾ’ വഴി ലിംഗസൂചന നിലനിർത്തി. ഉറവിടത്തിലെ വ്യാകരണപരമായ സംഘർഷം മുഖ്യവാചകത്തിൽ സന്ദർഭാനുസൃതമായി അവതരിപ്പിക്കുകയും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്തു.
