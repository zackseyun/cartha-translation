reference: Numbers 22:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: ml
  text: 'യഹ്‌വേയുടെ ദൂതൻ അവനോടു പറഞ്ഞു: “നീ നിന്റെ കഴുതയെ ഈ മൂന്നു തവണ അടിച്ചത് എന്തിന്? ഇതാ, ഞാൻ ഒരു എതിരാളിയായി[a] പുറത്തുവന്നിരിക്കുന്നു; കാരണം, നിന്റെ വഴി എന്റെ മുമ്പിൽ വഴിവിട്ടിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള שָׂטָן (സാത്താൻ) എന്ന ഹീബ്രു പദത്തിന് ‘എതിരാളി’ അല്ലെങ്കിൽ ‘പ്രതിയോഗി’ എന്നാണ് അർഥം; അത് ഇവിടെ ‘സാത്താൻ’ എന്ന വ്യക്തിനാമത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘വഴിവിട്ടിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഹീബ്രു ക്രിയ അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമാണ്; ‘വിവേകരഹിതമാണ്’, ‘വികൃതമാണ്’, അല്ലെങ്കിൽ ‘വിരുദ്ധമാണ്’ എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: മַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമുണ്ടാകാം; ഈ വിവരണത്തിൽ ബിലെയാമിനെ നേരിടുന്ന അതിമാനുഷിക സത്തയായതിനാൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്. ദൈവനാമം യഹ്‌വെ എന്ന് ലിപ്യന്തരിച്ചു.
- source_word: עַל מָה
  choice: എന്തിന്
  rationale: ഹീബ്രു ചോദ്യത്തിന്റെ ശാസനാത്മക ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: הִכִּיתָ
  choice: അടിച്ചത്
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അടിക്കുക’ നേരിട്ട് നൽകുന്നു; മർദനത്തിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: אֲתֹנְךָ
  choice: നിന്റെ കഴുതയെ
  rationale: ഹീബ്രു പദം പെൺകഴുതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ ലിംഗഭേദത്തിന് പ്രത്യേക പ്രാധാന്യമില്ല; സാധാരണ മലയാളത്തിൽ ‘കഴുത’ സ്വാഭാവികമാണ്.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ഈ മൂന്നു തവണ
  rationale: അക്ഷരാർഥത്തിലെ ‘കാലുകൾ/സന്ദർഭങ്ങൾ’ എന്ന പ്രയോഗം ഇവിടെ ‘മൂന്നു തവണ’ എന്ന സ്ഥിരമായ പ്രയോഗാർഥത്തിലാണ്.
- source_word: הִנֵּה אָנֹכִי
  choice: ഇതാ, ഞാൻ
  rationale: הִנֵּה നൽകുന്ന ശ്രദ്ധാകർഷണവും തുടർന്നുള്ള ഒന്നാംപുരുഷ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: יָצָאתִי
  choice: പുറപ്പെട്ടുവന്നിരിക്കുന്നു
  rationale: יצא എന്നതിന്റെ ‘പുറപ്പെടുക/പുറത്തുവരുക’ എന്ന ആശയവും നേരിടാൻ വന്നിരിക്കുന്ന ഇപ്പോഴത്തെ സാഹചര്യവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְשָׂטָן
  choice: ഒരു എതിരാളിയായി
  rationale: שָׂטָן ഇവിടെ വ്യക്തിനാമമെന്നതിലുപരി എതിർക്കുന്നവൻ എന്ന പൊതുനാമമായി പ്രവർത്തിക്കുന്നു; ‘സാത്താൻ’ എന്നു നൽകിയാൽ മൂലപാഠം നിർബന്ധിക്കാത്ത പിന്നീടുള്ള ദുഷ്ടാത്മസംബന്ധിയായ ധാരണ വരാം.
- source_word: יָרַט הַדֶּרֶךְ
  choice: നിന്റെ വഴി ... വഴിവിട്ടതായിരിക്കുന്നു
  rationale: അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമായ ירט എന്ന ക്രിയയ്ക്ക് സന്ദർഭോചിതമായി ‘വഴിവിട്ടത്/വികൃതമായത്/വിരുദ്ധമായത്’ എന്ന പരിധിയുണ്ട്. മലയാളത്തിലെ ഈ പ്രയോഗം ബിലെയാമിന്റെ യാത്രാമാർഗത്തെയും പെരുമാറ്റഗതിയെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയും.
- source_word: לְנֶגְדִּי
  choice: എന്റെ മുമ്പിൽ
  rationale: സ്ഥാനപരവും വിലയിരുത്തൽപരവുമായ ‘എന്റെ മുമ്പിൽ/എനിക്കെതിരെ’ എന്ന ഇരട്ടസാധ്യതയിൽ കൂടുതൽ അക്ഷരസമീപമായ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְשָׂטָן എന്നതിന്റെ അർഥം
  choice: 'പൊതുനാമം: ‘ഒരു എതിരാളിയായി’'
  alternative: വ്യക്തിനാമമോ സ്ഥാനപ്പേരോ ആയി ‘സാത്താനായി’
  rationale: ഈ സന്ദർഭത്തിൽ യഹ്‌വെയുടെ ദൂതൻ ബിലെയാമിനെ എതിർക്കുകയാണ്; അതിനാൽ ഈ പദം വിവരണാത്മകമായ പൊതുനാമമായി വായിക്കുന്നതാണ് വ്യാകരണത്തിനും സന്ദർഭത്തിനും യോജിച്ചത്. വ്യക്തിനാമമായി പരിഭാഷപ്പെടുത്തുന്നത് പാഠം വ്യക്തമാക്കാത്ത ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ഇറക്കുമതി ചെയ്യും.
- issue: ירט എന്ന അപൂർവക്രിയയുടെ വിലയിരുത്തൽ
  choice: ‘വഴിവിട്ടതായിരിക്കുന്നു’ എന്ന വിശാലമായ പ്രയോഗം
  alternative: ‘വിവേകരഹിതമാണ്’, ‘തെറ്റായതാണ്’, അല്ലെങ്കിൽ ‘എനിക്കെതിരാണ്’
  rationale: ക്രിയയുടെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. പ്രധാന പാഠത്തിൽ സ്വാഭാവികവും വിലയിരുത്തൽപരവുമായ രൂപം നൽകി, വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള ശാസനയുടെ ശക്തി നിലനിർത്തിയിരിക്കുന്നു. അപൂർവക്രിയയുടെ അനിശ്ചിതത്വവും שָׂטָן എന്ന പൊതുനാമത്തിന്റെ സ്വഭാവവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
