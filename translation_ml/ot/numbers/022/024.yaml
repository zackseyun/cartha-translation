  source_fidelity: മൂലത്തിലെ വയ്യിഖ്തോൽ ആഖ്യാനപുരോഗതി ‘അപ്പോൾ ... നിന്നു’ എന്നതിലൂടെ യോജ്യമായി പ്രതിഫലിക്കുന്നു. ‘യഹോവയുടെ ദൂതൻ’ מַלְאַךְ יְהוָה-യെ കൃത്യമായി നൽകുന്നു. ‘മുന്തിരിത്തോട്ടങ്ങൾക്കിടയിലെ ഇടുങ്ങിയ വഴിയിൽ’ എന്നത് בְּמִשְׁעוֹל הַכְּרָמִים എന്ന ഇടുങ്ങിയ പാതയും മുന്തിരിത്തോട്ടസന്ദർഭവും അറിയിക്കുന്നു. ഇരുവശത്തും ഓരോ മതിൽ എന്ന ഗָּדֵר ... מִזֶּה / וְגָדֵר מִזֶּה ഘടനയും സംരക്ഷിച്ചിട്ടുണ്ട്. കല്ല് എന്ന നിർമാണവസ്തു കൂട്ടിച്ചേർത്തിട്ടില്ല.
