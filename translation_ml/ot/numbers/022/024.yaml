  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: ml
  text: അപ്പോൾ യഹോവയുടെ ദൂതൻ മുന്തിരിത്തോട്ടങ്ങൾക്കിടയിലെ ഇടുങ്ങിയ വഴിയിൽ നിന്നു; ഇപ്പുറത്ത് ഒരു മതിലും അപ്പുറത്ത് ഒരു മതിലും ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹോവയുടെ സന്ദേശവാഹകൻ.’ എബ്രായപദത്തിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഇവിടെ ആഖ്യാനസന്ദർഭം അമാനുഷികനായ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: അപ്പോൾ ... നിന്നു
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ സംഭവക്രമം വ്യക്തമാക്കുന്നു, ‘നിന്നു’ עמד എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹോവയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘സന്ദേശവാഹകൻ’ എന്നും ‘ദൂതൻ’ എന്നും അർഥമാകാം; ഈ ആഖ്യാനത്തിലെ അമാനുഷിക സാന്നിധ്യം പരിഗണിക്കുമ്പോൾ മലയാളത്തിൽ ‘ദൂതൻ’ യോജിക്കുന്നു. יהוה എന്ന ദൈവനാമം ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: בְּמִשְׁעוֹל
  choice: ഇടുങ്ങിയ വഴിയിൽ
  rationale: מִשְׁעוֹל മുന്തിരിത്തോട്ടങ്ങൾക്കിടയിലെ ഞെരുങ്ങിയ പാതയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ തടസ്സപ്പെട്ട ഇടം ‘ഇടുങ്ങിയ വഴി’ വ്യക്തമായി നൽകുന്നു.
- source_word: הַכְּרָמִים
  choice: മുന്തിരിത്തോട്ടങ്ങൾക്കിടയിലെ
  rationale: മൂലപാഠത്തിലെ ബഹുവചനം നിലനിർത്തുന്നു; ഇരുവശത്തുമുള്ള മതിലുകൾ സൂചിപ്പിക്കുന്ന സ്ഥിതിവിവരത്തിന് ‘ഇടയിലെ’ സ്വാഭാവികമാണ്.
- source_word: גָּדֵר
  choice: മതിൽ
  rationale: גָּדֵר വേലിയെയോ ചുറ്റുമതിലിനെയോ സൂചിപ്പിക്കാം. നിർമ്മാണവസ്തു മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘കൽമതിൽ’ എന്നു പ്രത്യേകീകരിക്കാതെ ‘മതിൽ’ എന്നു നൽകി.
- source_word: מִזֶּה ... וְגָדֵר מִזֶּה
  choice: ഇപ്പുറത്ത് ... അപ്പുറത്ത്
  rationale: പാതയുടെ രണ്ടുവശങ്ങളിലുമുള്ള മതിലുകളെ ആവർത്തിച്ചുള്ള എബ്രായ പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു; അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- issue: מַלְאָךְ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: പദത്തിന് രണ്ടർഥങ്ങളും സാധ്യമാണെങ്കിലും ബിലെയാമിന്റെ ആഖ്യാനത്തിൽ ഇവിടെ അമാനുഷിക ദൈവദൂതനാണ് ഉദ്ദേശ്യം. പദത്തിന്റെ പൊതുവായ lexical alternative അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇപ്പുറത്ത് ... അപ്പുറത്ത്’ എന്ന പ്രയോഗം മൂലത്തിലെ സമമിത ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു; മതിലിന്റെ നിർമ്മാണവസ്തു വ്യക്തമാക്കാതെ മൂലപാഠത്തിന്റെ പരിധി പാലിച്ചു.
