source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: ml
  text: 'ബിലെയാം ബാലാക്കിന്റെ ദാസന്മാരോടു മറുപടിയായി പറഞ്ഞു: “ബാലാക്ക് തന്റെ വീടുനിറയെ വെള്ളിയും പൊന്നും എനിക്കു തന്നാലും, യാഹ്‌വെ എന്റെ ദൈവത്തിന്റെ വചനത്തെ അതിക്രമിച്ച് ചെറുതോ വലുതോ ആയ യാതൊന്നും ചെയ്യാൻ എനിക്കു കഴിയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘എന്റെ ദൈവമായ യാഹ്‌വെയുടെ വായ്ക്ക് അപ്പുറം കടക്കുക.’ ഇത് അവൻ അരുളിയ വചനത്തെ അതിക്രമിക്കുകയോ ലംഘിക്കുകയോ ചെയ്യുക എന്ന എബ്രായ പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: പ്രതികരണത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ ആഖ്യാനരീതി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַבְדֵי בָלָק
  choice: ബാലാക്കിന്റെ ദാസന്മാർ
  rationale: അയച്ച പ്രതിനിധികളെയോ രാജസേവകരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് അക്ഷരാർഥത്തോടു ചേർന്നതും സന്ദർഭോചിതവുമായ രൂപം.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: ബാലാക്ക് ... എനിക്കു തന്നാലും
  rationale: നിബന്ധനയുടെ സന്ദർഭപരമായ concessive ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സങ്കൽപ്പിതമായ വൻ പ്രതിഫലം പോലും നിലപാട് മാറ്റില്ലെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: തന്റെ വീടുനിറയെ വെള്ളിയും പൊന്നും
  rationale: അപരിമിത സമ്പത്തിന്റെ മൂലരൂപകം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לֹא אוּכַל
  choice: എനിക്കു കഴിയില്ല
  rationale: വെറും വിസമ്മതമല്ല, പ്രസ്താവിതമായ അസാധ്യതയാണ് יכל സൂചിപ്പിക്കുന്നത്.
- source_word: לַעֲבֹר אֶת פִּי יְהוָה
  choice: യഹോവയുടെ വാക്ക് ലംഘിക്കാൻ
  rationale: അക്ഷരാർഥം ‘യഹോവയുടെ വായ്ക്ക് അപ്പുറം കടക്കുക’ എന്നാണ്; ദൈവം അരുളിയതിനെ അതിക്രമിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു; ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റുന്നില്ല.
- source_word: אֱלֹהָי
  choice: എന്റെ ദൈവമായ
  rationale: ഒന്നാംപുരുഷ ഉടമസ്ഥബന്ധം കൃത്യമായി നിലനിർത്തുന്നു; ബിലെയാമിന്റെ വാക്കുകളിൽ ഇല്ലാത്ത അധിക ദൈവശാസ്ത്ര നിഗമനം ചേർക്കുന്നില്ല.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: ചെറുതോ വലുതോ ആയ യാതൊന്നും ചെയ്യാൻ
  rationale: ‘ചെറുതോ വലുതോ’ എന്ന മെരിസം സംരക്ഷിച്ചുകൊണ്ട് ‘ഒന്നുംതന്നെ’ എന്ന സമഗ്ര അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. മലയാളത്തിലെ സാധാരണ ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു; ഒരു പദവിയാക്കി മാറ്റുന്നില്ല.
- issue: ബിലെയാമിന്റെ പ്രസ്താവനയുടെ ശക്തി
  choice: യഹോവയുടെ വാക്ക് ലംഘിക്കാൻ തനിക്കു കഴിയില്ലെന്ന അസാധ്യത
  alternative: യഹോവയുടെ കല്പന അനുസരിക്കാതിരിക്കാൻ താൻ വിസമ്മതിക്കുന്നു
  rationale: לֹא אוּכַל എന്നത് കഴിവില്ലായ്മയെ പ്രസ്താവിക്കുന്നു; അതിനെ കേവലം വ്യക്തിപരമായ വിസമ്മതമാക്കി ചുരുക്കാതെ, ‘വായ്ക്ക് അപ്പുറം കടക്കുക’ എന്ന പ്രയോഗത്തിലെ അനുസരണാർഥവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘ചെറുതോ വലുതോ’ എന്ന മൂലപാഠത്തിലെ വാചാലങ്കാരം നിലനിർത്തി. വാക്യത്തിന്റെ പ്രധാന ഒഴുക്ക് തടസ്സപ്പെടുത്താതെ എബ്രായ ഭാഷാപ്രയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
