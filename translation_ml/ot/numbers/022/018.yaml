revisions:
- from: 'ബിലെയാം ബാലാക്കിന്റെ ദാസന്മാരോടു മറുപടിയായി പറഞ്ഞു: “ബാലാക്ക് തന്റെ വീടുനിറയെ വെള്ളിയും പൊന്നും എനിക്കു തന്നാലും, ചെറുതോ വലുതോ ആയ യാതൊന്നും ചെയ്യാൻ എന്റെ ദൈവമായ യഹോവയുടെ വാക്ക് ലംഘിക്കാൻ എനിക്കു കഴിയില്ല.[a]”'
  to: 'ബിലെയാം ബാലാക്കിന്റെ ദാസന്മാരോടു മറുപടിയായി പറഞ്ഞു: “ബാലാക്ക് തന്റെ വീടുനിറയെ വെള്ളിയും പൊന്നും എനിക്കു തന്നാലും, യാഹ്‌വെ എന്റെ ദൈവത്തിന്റെ വചനത്തെ അതിക്രമിച്ച് ചെറുതോ വലുതോ ആയ യാതൊന്നും ചെയ്യാൻ എനിക്കു കഴിയില്ല.[a]”'
  rationale: ദൈവനാമം ഇംഗ്ലീഷ് POBയുടെ Yahweh-നോട് യോജിപ്പിച്ച് ‘യാഹ്‌വെ’ ആക്കി. മൂലത്തിലെ ‘വചനത്തെ അതിക്രമിച്ച് ... ചെയ്യുക’ എന്ന ഘടന മലയാളത്തിൽ കൂടുതൽ വ്യക്തമാക്കാൻ പദക്രമം പരിഷ്കരിച്ചു. മറ്റെല്ലാ അർഥഘടകങ്ങളും നിലനിർത്തി.
