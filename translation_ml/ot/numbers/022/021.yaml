  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: ml
  text: അങ്ങനെ ബിലെയാം രാവിലെ എഴുന്നേറ്റു, തന്റെ കഴുതയ്ക്ക്[a] കോപ്പിട്ടു, മോവാബിലെ പ്രഭുക്കന്മാരോടൊപ്പം പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദം പ്രത്യേകമായി ‘പെൺകഴുത’യെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: എഴുന്നേറ്റു
  rationale: קום എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതമായ രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בַּבֹּקֶר
  choice: രാവിലെ
  rationale: എബ്രായപ്രയോഗം ‘രാവിലെ’ എന്നാണ്; ‘അതിരാവിലെ’ എന്ന അധിക ഊന്നൽ മൂലപാഠത്തിലില്ല.
- source_word: וַיַּחֲבֹשׁ
  choice: കോപ്പിട്ടു
  rationale: കഴുതയെ സവാരിക്ക് ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന חבש എന്ന ക്രിയയ്ക്ക് സംക്ഷിപ്തവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: אֶת אֲתֹנוֹ
  choice: തന്റെ കഴുതയ്ക്ക്
  rationale: אָתוֹן പ്രത്യേകിച്ച് പെൺകഴുതയെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ ‘കഴുത’ ഉപയോഗിച്ച് ലിംഗസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וַיֵּלֶךְ
  choice: പോയി
  rationale: הלך എന്ന സാധാരണ ഗതിക്രിയയുടെ ലളിതമായ ആഖ്യാനസമാനപദം.
- source_word: עִם
  choice: ഒപ്പം
  rationale: കൂടെ സഞ്ചരിച്ചതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: שָׂרֵי מוֹאָב
  choice: മോവാബിലെ പ്രഭുക്കന്മാർ
  rationale: שָׂרִים എന്ന പദത്തിലെ ഉന്നത സാമൂഹിക-രാഷ്ട്രീയ പദവി നിലനിർത്തുന്നു; ‘രാജകുമാരന്മാർ’ എന്നു പറഞ്ഞ് രാജവംശബന്ധം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
