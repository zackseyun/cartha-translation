  register: ലളിതവും മാന്യവുമായ ആധുനിക ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായ വാക്യത്തിലെ തുടർച്ചയായ പ്രവർത്തനക്രമം നിലനിർത്തുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘അതിരാവിലെ’ പോലുള്ള ഊന്നൽ ഒഴിവാക്കുകയും ചെയ്തു.
