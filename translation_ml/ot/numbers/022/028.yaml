  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്വേ കഴുതയുടെ വായ് തുറന്നു[a]. അത് ബിലെയാമിനോട് പറഞ്ഞു: “ഞാൻ നിന്നോട് എന്തു ചെയ്തിട്ടാണ് നീ എന്നെ ഈ മൂന്നു പ്രാവശ്യം അടിച്ചത്[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം “കഴുതയുടെ വായ്.” ‘കഴുത’ എന്നതിനുള്ള എബ്രായനാമവും തുടർന്ന് വരുന്ന ക്രിയയും സ്ത്രീലിംഗത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ഏകദേശം “ഇത് മൂന്നു കാലുകൾ” എന്നാണ്; ഇവിടെ അതിന്റെ അർഥം “ഈ മൂന്നു പ്രാവശ്യം” അഥവാ “ഈ മൂന്നു അവസരങ്ങളിൽ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: തുറന്നു
  rationale: קל രൂപത്തിലുള്ള ക്രിയയുടെ നേരായ അർഥം ‘തുറന്നു’ എന്നാണ്; ദൈവത്തിന്റെ നേരിട്ടുള്ള പ്രവൃത്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പരിചിതവും മൂലോച്ചാരണത്തോട് അടുത്തതുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: פִּי הָאָתוֹן
  choice: കഴുതയുടെ വായ്
  rationale: എബ്രായ ഘടനയുടെ അർഥം കൃത്യവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്. നാമം വ്യാകരണപരമായി സ്ത്രീലിംഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַתֹּאמֶר
  choice: അത് ... പറഞ്ഞു
  rationale: സംസാരിക്കുന്നത് കഴുതയാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ മൃഗത്തെക്കുറിച്ച് ‘അത്’ എന്ന സർവനാമം സ്വാഭാവികമാണ്; എബ്രായത്തിലെ സ്ത്രീലിംഗരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לְבִלְעָם
  choice: ബിലെയാമിനോട്
  rationale: പേരിന്റെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണവും, സംസാരക്രിയയോടു ചേരുന്ന സ്വാഭാവിക വിഭക്തിയും ഉപയോഗിക്കുന്നു.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: ഞാൻ നിന്നോട് എന്തു ചെയ്തിട്ടാണ്
  rationale: പരാതിയുടെയും തുടർന്ന് വരുന്ന ഫലവാക്യത്തിന്റെയും ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הִכִּיתַנִי
  choice: നീ എന്നെ ... അടിച്ചത്
  rationale: נכה എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം ‘അടിക്കുക’ എന്നാണ്; അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: ഇങ്ങനെ മൂന്നു പ്രാവശ്യം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇത് മൂന്നു കാലുകൾ/അവസരങ്ങൾ’ എന്ന ഘടനയാണെങ്കിലും ഇവിടെ മൂന്നു സംഭവാവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ഇങ്ങനെ’ demonstrative ഭാവവും ‘മൂന്നു പ്രാവശ്യം’ ആശയവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലപാഠസാക്ഷ്യം സംരക്ഷിക്കുന്നു.
