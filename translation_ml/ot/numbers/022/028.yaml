  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യഹ്വേ’ എന്ന ദൈവനാമം സംരക്ഷിച്ചു. കഴുതയുടെ സ്ത്രീലിംഗം മലയാള മുഖ്യവാചകത്തിൽ അസ്വാഭാവികമായി നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; ‘അത്’ സാധാരണ മലയാള ജന്തുസർവനാമമായി ഉപയോഗിച്ചു.
