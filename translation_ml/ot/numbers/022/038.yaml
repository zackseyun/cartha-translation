source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: ml
  text: 'ബിലെയാം ബാലാക്കിനോടു പറഞ്ഞു: “ഇതാ, ഞാൻ ഇപ്പോൾ അങ്ങയുടെ അടുക്കൽ വന്നിരിക്കുന്നു. എന്തെങ്കിലും പറയാൻ എനിക്ക് വാസ്തവത്തിൽ കഴിയുമോ?[a] ദൈവം എന്റെ വായിൽ വെക്കുന്ന വാക്ക് മാത്രമേ ഞാൻ പറയൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്ക് എന്തെങ്കിലും പറയാൻ തീർച്ചയായും കഴിയുമോ?” കഴിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയ്ക്ക് ഊന്നൽ നൽകുന്ന ഒരു പ്രയോഗമാണ് എബ്രായത്തിലുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ബിലെയാമിന്റെ മറുപടിക്ക് ഊന്നൽ നൽകുകയും ചെയ്യുന്ന ഹീബ്രു സൂചകപദത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: ഞാൻ ഇപ്പോൾ അങ്ങയുടെ അടുക്കൽ വന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ വരവിനെയും עַתָּה നൽകുന്ന ഇപ്പോഴത്തെ അടിയന്തരതയെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲיָכוֹל אוּכַל
  choice: എനിക്ക് വാസ്തവത്തിൽ കഴിയുമോ?
  rationale: ക്രിയയുടെ infinitive absolute-ഉം finite രൂപവും ചേർന്ന ഊന്നൽ ‘വാസ്തവത്തിൽ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; ചോദ്യം വാചാടോപപരമായ സ്വഭാവത്തോടുകൂടി നിലനിർത്തുന്നു.
- source_word: דַּבֵּר מְאוּמָה
  choice: എന്തെങ്കിലും പറയാൻ
  rationale: מְאוּמָה എന്നതിന്റെ ‘എന്തെങ്കിലും, ഒട്ടും എന്തെങ്കിലും’ എന്ന പരിധി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַדָּבָר
  choice: വാക്ക്
  rationale: ദൈവം നൽകുന്ന പ്രവാചകവചനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഏകവചനമായ ‘വാക്ക്’ മൂലരൂപത്തിന്റെ സാന്ദ്രത നിലനിർത്തുന്നു.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: ദൈവം എന്റെ വായിൽ വെക്കുന്ന
  rationale: ദൈവം നൽകുന്ന വാക്കിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ദൃശ്യരൂപകം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: വാക്ക് മാത്രമേ ഞാൻ പറയൂ
  rationale: മുൻനിർത്തിയ കർമപദം സൂചിപ്പിക്കുന്ന പരിമിതി ‘മാത്രമേ’ എന്നതിലൂടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: രൂപത്തിൽ ബഹുവചനസദൃശമായിരുന്നാലും ഏകവചനക്രിയയും സന്ദർഭവും ഇസ്രായേലിന്റെ ദൈവത്തെ ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ബിലെയാമിന്റെ വാക്കിന്മേലുള്ള ദൈവിക നിയന്ത്രണം
  choice: ദൈവം തന്റെ വായിൽ വെക്കുന്ന വാക്ക് മാത്രമേ തനിക്ക് പറയാനാകൂ എന്ന് ബിലെയാം പ്രസ്താവിക്കുന്നു.
  alternative: തനിക്ക് ഇഷ്ടമുള്ളത് പറയാൻ ബിലെയാമിനു കഴിയുമെങ്കിലും സ്വമേധയാ ദൈവത്തിന്റെ വാക്കിലേക്കു മാത്രം സ്വയം പരിമിതപ്പെടുത്തുന്നു.
  rationale: הֲיָכוֹל אוּכַל എന്ന ഊന്നിയ കഴിവുചോദ്യവും אֹתוֹ אֲדַבֵּר എന്ന പരിമിതിപ്പെടുത്തുന്ന വാക്യവും കേവലമായ വ്യക്തിപരമായ മുൻഗണനയെക്കാൾ നിയന്ത്രിതമായ പ്രവാചകസംസാരത്തെ സൂചിപ്പിക്കുന്നു. അതേസമയം ദൈവിക പ്രേരണയുടെ പ്രവർത്തനരീതി വിവർത്തനം അധികമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. രാജാവായ ബാലാക്കിനെ അഭിസംബോധന ചെയ്യുന്നതിൽ ‘അങ്ങയുടെ’ എന്ന ആദരരൂപം സ്വീകരിച്ചു. മൂലത്തിലെ ‘വായിൽ വെക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുകയും, ഊന്നലും ദൈവം നൽകുന്ന വാക്കിലേക്കുള്ള പരിമിതിയും വ്യക്തമായി നിലനിർത്തുകയും ചെയ്തു.
