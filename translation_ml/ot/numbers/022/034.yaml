  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: ml
  text: 'അപ്പോൾ ബിലെയാം യഹ്‌വേയുടെ ദൂതനോട്[a] പറഞ്ഞു: “ഞാൻ പാപം ചെയ്തു; കാരണം, വഴിയിൽ എന്നെ എതിർക്കാൻ അങ്ങ് നിലകൊള്ളുകയായിരുന്നുവെന്ന് ഞാൻ അറിഞ്ഞില്ല. ഇപ്പോൾ, അങ്ങയുടെ ദൃഷ്ടിയിൽ ഇത് തിന്മയാണെങ്കിൽ[b], ഞാൻ മടങ്ങിപ്പോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വേയുടെ സന്ദേശവാഹകനോട്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇത് അങ്ങയുടെ കണ്ണുകളിൽ തിന്മയാണെങ്കിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. വാളുമായി ബിലെയാമിനെ എതിർക്കുന്ന അതിമാനുഷിക വ്യക്തിയാണ് സന്ദർഭത്തിലെ രൂപം; മലയാളത്തിൽ ‘ദൂതൻ’ ഈ അർഥവും പദത്തിന്റെ ദൗത്യസ്വഭാവവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: חָטָאתִי
  choice: ഞാൻ പാപം ചെയ്തു
  rationale: പൂർണ്ണക്രിയ ബിലെയാമിന്റെ കുറ്റസമ്മതത്തെ നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: ഞാൻ അറിഞ്ഞില്ല
  rationale: כִּי ഇവിടെ മുൻവാക്യത്തിന് കാരണം നൽകുന്നു. മലയാളത്തിൽ വാക്യക്രമവും തുടർന്നുള്ള പ്രസ്താവനയും കാരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകം ‘കാരണം’ ചേർക്കേണ്ടതില്ല.
- source_word: נִצָּב לִקְרָאתִי
  choice: എന്നെ എതിർക്കാൻ അങ്ങ് നിലകൊള്ളുകയായിരുന്നു
  rationale: נִצָּב ഉറച്ചുനിൽക്കുന്നതും לִקְרָאתִי നേരിടാൻ വരുന്നതും സൂചിപ്പിക്കുന്നു. ഊരിപ്പിടിച്ച വാളോടെ വഴി തടയുന്ന സന്ദർഭം കാരണം ‘എതിർക്കാൻ’ എന്നത് പ്രതികൂലഭാവം സംരക്ഷിക്കുന്നു.
- source_word: בַּדָּרֶךְ
  choice: വഴിയിൽ
  rationale: യാത്രാസന്ദർഭത്തിന് യോജിച്ച ലളിതവും നേരായതുമായ സ്ഥാനസൂചന.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: ഇത് അങ്ങയുടെ ദൃഷ്ടിയിൽ തിന്മയാണെങ്കിൽ
  rationale: ‘കണ്ണുകളിൽ തിന്മ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ധാർമികഭാരവും ‘ദൃഷ്ടിയിൽ തിന്മ’ എന്ന മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אָשׁוּבָה לִּי
  choice: ഞാൻ മടങ്ങിപ്പോകാം
  rationale: കോഹോർട്ടേറ്റീവ് രൂപത്തിലെ സന്നദ്ധതയെയും ഉദ്ദേശ്യത്തെയും ‘മടങ്ങിപ്പോകാം’ സ്വാഭാവികമായി അറിയിക്കുന്നു; לִּי വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. ‘യഹ്‌വേ’ എന്ന ലിപ്യന്തരണം അതിനെ ഒരു സ്ഥാനപ്പേരാൽ പകരാതെ ഉടമ്പടിനാമമായി സംരക്ഷിക്കുന്നു.
- issue: ദൂതന്റെ എതിർപ്പിന്റെ സ്വഭാവം
  choice: എന്നെ എതിർക്കാൻ
  alternative: എന്നെ കാണാൻ; എന്നെ നേരിടാൻ
  rationale: לִקְרָאתִי സ്വതവേ ‘നേരിടാൻ/കാണാൻ’ എന്ന പരിധിയിലാണെങ്കിലും, ഊരിപ്പിടിച്ച വാളുമായി വഴി തടഞ്ഞുനിൽക്കുന്ന ഉടൻസന്ദർഭം പ്രതികൂലത വ്യക്തമാക്കുന്നു. ‘എതിർക്കാൻ’ അത് പ്രകടമാക്കുന്നു; ദൂതന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ദൈവദൂതനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. മൂലത്തിലെ രൂപകപ്രയോഗം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി, കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
