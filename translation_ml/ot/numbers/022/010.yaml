source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: ml
  text: 'ബിലെയാം ദൈവത്തോടു പറഞ്ഞു: “മോവാബ്‌രാജാവായ സിപ്പോരിന്റെ മകൻ ബാലാക്ക് എന്റെ അടുക്കലേക്ക് അയച്ചിരിക്കുന്നു:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ വിളിപ്പിക്കാൻ ആളയച്ചിരിക്കുന്നു.” എബ്രായപാഠത്തിന്റെ കൂടുതൽ അക്ഷരാർഥം “എന്റെ അടുക്കലേക്ക് അയച്ചിരിക്കുന്നു” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നിട്ട്’ നിർബന്ധമല്ല, ലളിതമായ ‘പറഞ്ഞു’ സ്വാഭാവികമായി തുടർച്ച പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണവുമായി യോജിപ്പിച്ചു.
- source_word: אֶל הָאֱלֹהִים
  choice: ദൈവത്തോടു
  rationale: സന്ദർഭത്തിൽ നിർദ്ദിഷ്ടനായ ഏക ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സംസാരക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘ദൈവത്തോടു’ സ്വാഭാവികമാണ്.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: സിപ്പോരിന്റെ മകൻ ബാലാക്ക്
  rationale: എബ്രായ ഘടനയുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പദക്രമം.
- source_word: מֶלֶךְ מוֹאָב
  choice: മോവാബ്‌രാജാവായ
  rationale: ബാലാക്കിനെ വിശേഷിപ്പിക്കുന്ന സംയുക്തനാമഘടന മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: שָׁלַח אֵלַי
  choice: എന്റെ അടുക്കൽ ആളയച്ചിരിക്കുന്നു
  rationale: ശׁלחയ്ക്ക് പ്രസംഗസന്ദർഭത്തിൽ ദൂതന്മാരെ അയച്ചതാണ് ഉദ്ദേശ്യം; אֵלַי എന്ന ‘എന്റെ അടുക്കൽ/എന്നിലേക്ക്’ എന്ന ദിശാബോധം നിലനിർത്തുകയും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി ‘അയച്ചിരിക്കുന്നു’ വഴി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הָאֱלֹהִים എന്നതിന്റെ സൂചന
  choice: ബിലെയാം അഭിസംബോധന ചെയ്യുന്ന ഏക ദൈവം
  alternative: പൊതുവായ അർഥത്തിൽ ഒരു ദൈവം അല്ലെങ്കിൽ ദേവന്മാർ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക സമാഗമത്തോടുള്ള ബിലെയാമിന്റെ മറുപടിയാണ് ഇത്; അതിനാൽ ‘ദൈവം’ എന്ന് നൽകുന്നത് സന്ദർഭപരമായ തിരിച്ചറിയലാണ്, അധികമായ സിദ്ധാന്തവ്യാഖ്യാനമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എന്റെ അടുക്കൽ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ദിശാബോധം സൂക്ഷിക്കുന്നു; ‘ആളയച്ചു’ എന്നത് സന്ദർഭത്തിലെ ദൂതന്മാരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
