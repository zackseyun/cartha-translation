  terminology: ‘ബിലെയാം,’ ‘ദൈവത്തോടു,’ ‘സിപ്പോരിന്റെ മകൻ ബാലാക്ക്,’ and ‘മോവാബ്‌രാജാവായ’ are suitable. No theological or denominational interpretation is introduced. The footnote appropriately records the contextual alternative ‘എന്നെ വിളിപ്പിക്കാൻ’.
  issues:
