  source_fidelity: 'എബ്രായ മൂലപാഠത്തിലെ സംഭവക്രമവും പ്രധാന ഘടകങ്ങളും കൃത്യമായി നിലനിൽക്കുന്നു: പെൺകഴുത ദൈവദൂതനെ കാണുന്നു; അവൻ വഴിയിൽ, കൈയിൽ ഊരിയ വാളുമായി നിൽക്കുന്നു; കഴുത വഴി വിട്ട് വയലിലേക്കു പോകുന്നു; അതിനെ വഴിയിലേക്കു തിരിച്ചുവിടാൻ ബിലെയാം അതിനെ അടിക്കുന്നു. ‘വീണ്ടും’ എന്നത് മൂലത്തിൽ വേറിട്ട പദമായി ഇല്ലെങ്കിലും വഴി വിട്ടുപോയ സാഹചര്യത്തിൽ ഉൾക്കൊള്ളുന്ന ദിശയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല.'
