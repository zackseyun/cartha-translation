id: NUM.22.23
reference: Numbers 22:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: ml
  text: കഴുത വഴിയിൽ യഹ്‌വെയുടെ ദൂതൻ[a] കൈയിൽ ഊരിപ്പിടിച്ച വാളുമായി നിൽക്കുന്നതു കണ്ടപ്പോൾ, വഴിയിൽനിന്നു മാറി വയലിലേക്കു പോയി. അതിനെ വീണ്ടും വഴിയിലേക്കു തിരിക്കാൻ ബിലെയാം കഴുതയെ അടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയുടെ സന്ദേശവാഹകൻ.’
    reason: מַלְאָךְ എന്ന എബ്രായപദത്തിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: കഴുത
  rationale: אָתוֹן പെൺകഴുതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായി ‘കഴുത’ എന്നു പറയാം; ഈ വാക്യത്തിൽ ലിംഗം പ്രത്യേകം വ്യക്തമാക്കേണ്ട ആവശ്യമില്ല.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. വാളുമായി പ്രത്യക്ഷപ്പെടുന്ന അതിമാനുഷിക വ്യക്തിയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹ്‌വെ’ എന്നു നൽകി.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: വഴിയിൽ ... നിൽക്കുന്നത്
  rationale: ദൂതൻ യാത്രാമാർഗത്തിൽ തടസ്സമായി നിൽക്കുന്ന ദൃശ്യം നേരിട്ടും സ്വാഭാവികമായും പകരുന്നു.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: കൈയിൽ ഊരിപ്പിടിച്ച വാളുമായി
  rationale: שְׁלוּפָה വാൾ ഉറയിൽനിന്ന് ഊരിയ നിലയിലാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘ഊരിപ്പിടിച്ച വാൾ’ മലയാളത്തിൽ ദൃശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: വഴിയിൽനിന്നു മാറി
  rationale: നָטָה ഇവിടെ നിശ്ചിത വഴിയിൽനിന്നുള്ള വ്യതിചലനമാണ്; ‘മാറി’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: വയലിലേക്കു പോയി
  rationale: שָׂדֶה ഈ ദൃശ്യത്തിൽ തുറന്ന വയൽപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ചലനത്തിന്റെ ദിശ മലയാളത്തിൽ ‘വയലിലേക്ക്’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: וַיַּךְ
  choice: അടിച്ചു
  rationale: נכה എന്നത് പ്രഹരിക്കുക എന്ന പൊതുവായ ക്രിയയാണ്. ഏകവചന ക്രിയ ആവർത്തിച്ചുള്ള മർദനം നിർബന്ധമായി സൂചിപ്പിക്കാത്തതിനാൽ ‘അടിച്ചു’ മതിയാകുന്നു.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: അതിനെ വീണ്ടും വഴിയിലേക്കു തിരിക്കാൻ
  rationale: പെൺകഴുത ഇതിനകം വഴി വിട്ടതിനാൽ, വീണ്ടും വഴിയിലേക്കു കൊണ്ടുവരാനുള്ള ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്താൻ ‘യഹ്‌വെ’ ഉപയോഗിച്ചു; പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കുന്നില്ല.
- issue: מַלְאַךְ എന്ന പദത്തിന്റെ അർഥം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: വാളുമായി പ്രത്യക്ഷപ്പെട്ട് വഴി തടയുന്ന അതിമാനുഷിക സാന്നിധ്യം ഈ സന്ദർഭത്തിൽ ‘ദൂതൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും പദത്തിന്റെ വിശാലമായ ‘സന്ദേശവാഹകൻ’ എന്ന അർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തമായതും മാന്യമായ ആഖ്യാനശൈലിയുമാണ് ഉപയോഗിച്ചത്. എബ്രായ വാക്യത്തിന്റെ സംഭവക്രമവും ദൃശ്യസാന്ദ്രതയും നിലനിർത്തി; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
