source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇന്നു രാത്രി ഇവിടെ താമസിക്കൂ. യഹോവ എന്നോടു പറയുന്നതനുസരിച്ച് ഞാൻ നിങ്ങൾക്കു മറുപടി അറിയിക്കും.” അങ്ങനെ മോവാബിലെ പ്രഭുക്കന്മാർ[a] ബിലെയാമിനോടൊപ്പം താമസിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോവാബിലെ ഉദ്യോഗസ്ഥർ” അല്ലെങ്കിൽ “മോവാബിലെ നേതാക്കൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: ഇന്നു രാത്രി ഇവിടെ താമസിക്കൂ
  rationale: ലון/לין എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം രാത്രിയിൽ അവിടെ തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘താമസിക്കൂ’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: ഞാൻ നിങ്ങൾക്കു മറുപടി അറിയിക്കാം
  rationale: ശബ്‌ദാനുസൃതമായി ‘ഒരു വാക്ക് തിരികെ കൊണ്ടുവരും’ എന്ന ആശയമുള്ള ഈ പ്രയോഗം, സന്ദർഭത്തിൽ ലഭിക്കുന്ന സന്ദേശമോ ഉത്തരമോ അവരെ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: യഹോവ എന്നോടു പറയുന്നതനുസരിച്ച്
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന അനുരൂപത നിലനിർത്തുകയും יְדַבֵּר എന്ന ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ഹീബ്രു ദൈവനാമമായ YHWH-ന്റെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം.
- source_word: וַיֵּשְׁבוּ
  choice: താമസിച്ചു
  rationale: അടിസ്ഥാന അർഥം ‘ഇരിക്കുക/വസിക്കുക’ എന്നാണെങ്കിലും, രാത്രി തങ്ങാനുള്ള ക്ഷണത്തിനു ശേഷമുള്ള ഈ സന്ദർഭത്തിൽ ‘താമസിച്ചു’ എന്നാണ് അർഥം.
- source_word: שָׂרֵי מוֹאָב
  choice: മോവാബിലെ പ്രഭുക്കന്മാർ
  rationale: שָׂרִים എന്നതിന് പ്രഭുക്കന്മാർ, ഉദ്യോഗസ്ഥർ, നേതാക്കൾ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്; രാജകീയ ദൂതന്മാരുടെ പശ്ചാത്തലത്തിൽ ‘പ്രഭുക്കന്മാർ’ യോജിക്കുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു പദവിയാൽ പകരംവയ്ക്കാതെ മലയാളത്തിൽ പരിചിതമായ നാമരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമാക്കി; മൂലത്തിലെ ദൈവനാമവും שָׂרֵי എന്ന പദത്തിന്റെ പദവിസംബന്ധിയായ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
