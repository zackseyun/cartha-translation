  terminology: “യഹ്‌വേ” preserves the divine name as required. “ദൂതൻ” is a sound rendering of מַלְאָךְ that does not over-specify beyond the source word, while fitting this narrative context. “പ്രഭുക്കന്മാർ” is a defensible, natural equivalent for שָׂרֵי, preserving their elevated official status without identifying them as royal sons.
