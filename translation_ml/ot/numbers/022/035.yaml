id: NUM.22.35
reference: Numbers 22:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേയുടെ ദൂതൻ ബിലെയാമിനോടു പറഞ്ഞു: “ആ പുരുഷന്മാരോടൊപ്പം പോകുക. എന്നാൽ ഞാൻ നിന്നോടു പറയുന്ന വചനം മാത്രം നീ പറയണം.” അങ്ങനെ ബിലെയാം ബാലാക്കിന്റെ പ്രഭുക്കന്മാരോടൊപ്പം പോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം. ഈ വിവരണത്തിലെ അമാനുഷിക ദൈവദൂതനെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ദൂതൻ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: ആ പുരുഷന്മാരോടൊപ്പം പോകുക
  rationale: നിർദ്ദിഷ്ടമായ പുരുഷസംഘത്തെയാണ് ഹീബ്രു സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘ആളുകൾ’ എന്നതിനു പകരം ‘പുരുഷന്മാർ’ എന്നു നൽകി.
- source_word: וְאֶפֶס
  choice: എന്നാൽ ... മാത്രം
  rationale: നൽകിയ അനുമതിക്കു പിന്നാലെയുള്ള ശക്തമായ നിയന്ത്രണം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: דָּבָר എന്നത് ‘വാക്ക്’, ‘സന്ദേശം’, ‘കാര്യം’ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ പറയേണ്ട ദൈവിക പ്രസ്താവന എന്ന സന്ദർഭത്തിൽ ‘വചനം’ യോജിക്കുന്നു.
- source_word: אֲדַבֵּר אֵלֶיךָ אֹתוֹ תְדַבֵּר
  choice: ഞാൻ നിന്നോടു പറയുന്ന വചനം മാത്രം നീ പറയണം
  rationale: മുൻനിർത്തിയിരിക്കുന്ന אֹתוֹ നൽകുന്ന ഊന്നലും മറ്റൊന്നും പറയരുതെന്ന നിയന്ത്രണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׂרֵי בָלָק
  choice: ബാലാക്കിന്റെ പ്രഭുക്കന്മാർ
  rationale: שָׂרִים ഭരണാധികാരികളെയോ ഉന്നത ഉദ്യോഗസ്ഥരെയോ പ്രഭുക്കന്മാരെയോ സൂചിപ്പിക്കാം. രാജപുത്രന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് പദത്തിന്റെ പദവിസൂചന നിലനിർത്താൻ ‘പ്രഭുക്കന്മാർ’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ദൈവത്തിന്റെ വ്യക്തിനാമം നിലനിർത്തുന്നതിനായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: מַלְאַךְ എന്ന സത്തയുടെ വിവരണം
  choice: ദൂതൻ
  alternative: സന്ദേശവാഹകൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാനപരമായ സന്ദേശവാഹക അർഥം നിഷേധിക്കാതെ, ഈ കഥാസന്ദർഭത്തിലെ അമാനുഷിക സത്തയെ ‘ദൂതൻ’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ അനുമതിയും അതിനോടൊപ്പമുള്ള കർശന നിയന്ത്രണവും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യമായ മതവിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
