translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പേരുകൾ ‘ബിലെയാം,’ ‘ബാലാക്ക്,’ ‘അർന്നോൻ’ എന്നിങ്ങനെ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നൽകി. മൂലപാഠത്തിലെ സ്ഥലസംബന്ധമായ ആവർത്തനം ഭാരമാകാതെ കഴിയുന്നത്ര നിലനിർത്തി; അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദസമുച്ചയങ്ങളോടു ചേർത്തു.
