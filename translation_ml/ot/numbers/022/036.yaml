  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: ml
  text: ബിലെയാം വന്നുവെന്ന് ബാലാക്ക് കേട്ടപ്പോൾ, അവനെ കണ്ടുമുട്ടാൻ അവൻ മോവാബ് പട്ടണത്തിലേക്ക്[a] പുറപ്പെട്ടു. ആ പട്ടണം അർന്നോന്റെ അതിർത്തിയിൽ, അതിർത്തിയുടെ അറ്റത്തായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോവാബിലെ ഒരു പട്ടണത്തിലേക്ക്.’ എബ്രായ പ്രയോഗം മോവാബിലെ അറിയപ്പെടുന്ന ഒരു പ്രത്യേക പട്ടണത്തെയോ മോവാബിൽപ്പെട്ട ഏതെങ്കിലും ഒരു പട്ടണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രദേശത്തിന്റെ അറ്റത്ത്.’ ഇവിടെ ‘അതിർത്തി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘പ്രദേശം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: שׁמע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; വാർത്ത എങ്ങനെ ലഭിച്ചു എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അധിക വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: כִּי בָא בִלְעָם
  choice: ബിലെയാം വന്നിരിക്കുന്നുവെന്ന്
  rationale: ബിലെയാമിന്റെ വരവ് സംഭവിച്ചുകഴിഞ്ഞുവെന്ന വാർത്തയാണ് ബാലാക്ക് കേൾക്കുന്നത്; മലയാളത്തിൽ ‘വന്നിരിക്കുന്നുവെന്ന്’ ഈ സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടു
  rationale: יצא സൂചിപ്പിക്കുന്ന സ്വന്തം സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ കാണാൻ
  rationale: ഒരാളെ അഭിമുഖീകരിച്ച് കണ്ടുമുട്ടാൻ പോകുക എന്ന നിഷ്പക്ഷ അർഥം നൽകുന്നു; സൗഹൃദപരമായ സ്വാഗതമെന്നോ പ്രതികൂലമായ നേരിടലെന്നോ അധിക ഭാവം ചേർക്കുന്നില്ല.
- source_word: אֶל עִיר מוֹאָב
  choice: മോവാബ് പട്ടണത്തിലേക്ക്
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള אֶל-ന്റെ ദിശാസൂചകത ‘-ലേക്ക്’ എന്നു നിലനിർത്തുന്നു. עיר מואב ഒരു അറിയപ്പെടുന്ന മോവാബ്യ പട്ടണത്തെയോ മോവാബിൽപ്പെട്ട ഒരു പട്ടണത്തെയോ സൂചിപ്പിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: ആ പട്ടണം അർന്നോൻ അതിർത്തിയിൽ
  rationale: עַל גְּבוּל എന്ന സ്ഥലസൂചന ‘അതിർത്തിയിൽ’ എന്നു നൽകുന്നു; ബന്ധവാക്യത്തിന്റെ സൂച്യം മലയാളത്തിൽ വ്യക്തമായിരിക്കാൻ ‘ആ പട്ടണം’ ആവർത്തിക്കുന്നു.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: അതിർത്തിയുടെ അറ്റത്തായിരുന്നു
  rationale: קצה-യുടെ ‘അറ്റം/അങ്ങേയറ്റം’ എന്ന അർഥവും גבול എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തുന്നു; ‘പ്രദേശത്തിന്റെ അറ്റം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
