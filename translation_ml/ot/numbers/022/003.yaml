source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: ml
  text: ആ ജനം വളരെ ഏറെയായിരുന്നതുകൊണ്ട് മോവാബ് അവരെ ഏറെ ഭയപ്പെട്ടു; ഇസ്രായേൽമക്കൾ നിമിത്തം മോവാബിന് വെറുപ്പും അസ്വസ്ഥതയും തോന്നി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോവാബിന് ഇസ്രായേൽമക്കളോടു വെറുപ്പു തോന്നി’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽമക്കൾ നിമിത്തം മോവാബ് കടുത്ത അസ്വസ്ഥതയിലായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയയ്ക്ക് വെറുപ്പ്, അറപ്പ്, അസ്വസ്ഥത, അല്ലെങ്കിൽ ഭയം കലർന്ന വ്യാകുലത എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അതിന്റെ കൃത്യമായ ഭാവം സന്ദർഭത്തിൽ പൂർണമായി നിർണയിക്കപ്പെട്ടിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: ഏറെ ഭയപ്പെട്ടു
  rationale: גור എന്ന ക്രിയ ഇവിടെ ഭയത്തെയും സംഭ്രമത്തെയും സൂചിപ്പിക്കുന്നു; מְאֹד നൽകുന്ന തീവ്രത ‘ഏറെ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: מִפְּנֵי
  choice: നിമിത്തം / അവരെ
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തുനിന്ന്/സന്നിധിയിൽനിന്ന്’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഭയത്തിന്റെയും അസ്വസ്ഥതയുടെയും കാരണം സൂചിപ്പിക്കുന്നു.
- source_word: הָעָם
  choice: ആ ജനം
  rationale: ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടനാമം; മലയാളത്തിൽ ‘ആ ജനം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: כִּי רַב הוּא
  choice: ആ ജനം വളരെ പെരുപ്പമുള്ളതായിരുന്നതിനാൽ
  rationale: רַב ഇവിടെ ജനത്തിന്റെ സംഖ്യാബാഹുല്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഹീബ്രായിലെ ഏകവചന കൂട്ടനാമഘടനയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּקָץ
  choice: ഭീതിയും അറപ്പും തോന്നി
  rationale: קוץ എന്ന ക്രിയയ്ക്ക് വെറുപ്പ്, അറപ്പ്, മനോവിഷമം, ഭയം കലർന്ന അസ്വസ്ഥത എന്നിവയുടെ അർഥവ്യാപ്തിയുണ്ട്. സന്ദർഭത്തിലെ ഭയത്തെയും ക്രിയയുടെ ശക്തമായ അറപ്പിനെയും ഒരുമിച്ച് നിലനിർത്തുന്ന പ്രയോഗമാണിത്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ രൂപം.
- source_word: מוֹאָב
  choice: മോവാബ്
  rationale: സ്ഥലത്തെയും ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പേരിന്റെ മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണം.
