translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വളരെ പെരുപ്പമുള്ള’ എന്നത് സംഖ്യാബാഹുല്യം വ്യക്തമാക്കുന്നു; ‘ഭീതിയും അറപ്പും’ എന്ന ഇരട്ടപ്രയോഗം וַיָּקָץ എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
