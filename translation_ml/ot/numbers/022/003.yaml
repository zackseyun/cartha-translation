revisions:
- from: ആ ജനം വളരെ പെരുപ്പമുള്ളതായിരുന്നതിനാൽ മോവാബ് അവരെ ഏറെ ഭയപ്പെട്ടു; ഇസ്രായേൽമക്കൾ നിമിത്തം മോവാബിന് ഭീതിയും അറപ്പും തോന്നി.[a]
  to: ആ ജനം വളരെ ഏറെയായിരുന്നതുകൊണ്ട് മോവാബ് അവരെ ഏറെ ഭയപ്പെട്ടു; ഇസ്രായേൽമക്കൾ നിമിത്തം മോവാബിന് വെറുപ്പും അസ്വസ്ഥതയും തോന്നി.[a]
  rationale: The revision removes the added explicit ‘fear’ from the second Hebrew verb while retaining its broad distressed/repulsed force through ‘വെറുപ്പും അസ്വസ്ഥതയും.’ It also improves the idiomatic expression of Israel’s numerical abundance. The footnote preserves the lexical ambiguity without claiming that one nuanced sense is definitively required by the context.
