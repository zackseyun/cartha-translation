id: NUM.22.22
reference: Numbers 22:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: ml
  text: എന്നാൽ അവൻ പോകുന്നതുകൊണ്ട് ദൈവത്തിന്റെ കോപം ജ്വലിച്ചു. യഹ്‌വെയുടെ ദൂതൻ അവന് എതിരാളിയായി[a] വഴിയിൽ നിലയുറപ്പിച്ചു. അവൻ തന്റെ കഴുതപ്പുറത്ത്[b] സഞ്ചരിക്കുകയായിരുന്നു; അവന്റെ രണ്ടു യുവാക്കളും കൂടെയുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ എബ്രായത്തിലെ שָׂטָן (സാതാൻ) എന്ന പദത്തിന് ‘എതിരാളി’ അഥവാ ‘എതിർക്കുന്നവൻ’ എന്നാണ് അർഥം; ഇത് ‘സാത്താൻ’ എന്ന വ്യക്തിനാമത്തെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പെൺകഴുതപ്പുറത്ത്’; എബ്രായപദം പെൺകഴുതയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: ദൈവത്തിന്റെ കോപം ജ്വലിച്ചു
  rationale: കോപം ‘കത്തുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സജീവമായ ദൃശ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: അവൻ പോകുന്നതുകൊണ്ട്
  rationale: כִּי കാരണബന്ധവും הוֹלֵךְ എന്ന കർത്തൃവാചകത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: മനുഷ്യനല്ലാത്ത ദൈവിക സന്ദേശവാഹകനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികമാണ്; യഹ്‌വെ എന്ന ദൈവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וַיִּתְיַצֵּב
  choice: നിലയുറപ്പിച്ചു
  rationale: വെറുതെ നിന്നു എന്നതിലുപരി, ബോധപൂർവം ഒരു സ്ഥാനത്ത് എതിർത്ത് നിൽക്കുന്ന ഹിത്പയേൽ രൂപത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: לְשָׂטָן לוֹ
  choice: അവന് എതിരാളിയായി
  rationale: ഇവിടെ שָׂטָן ഒരു പൊതുനാമമായി എതിർക്കുന്നവനെയോ പ്രതിയോഗിയെയോ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ ‘സാത്താൻ’ എന്ന വ്യക്തിനാമം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: בַּדֶּרֶךְ
  choice: വഴിയിൽ
  rationale: ദൂതൻ ബിലെയാമിന്റെ യാത്രാമാർഗത്തിൽ നേരിട്ട് നിലകൊള്ളുന്ന ദൃശ്യത്തെ ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: וְהוּא רֹכֵב עַל אֲתֹנוֹ
  choice: അവൻ തന്റെ കഴുതപ്പുറത്ത് സഞ്ചരിക്കുകയായിരുന്നു
  rationale: കർത്തൃവാചകം നൽകുന്ന പശ്ചാത്തലപരവും തുടരുന്നതുമായ പ്രവൃത്തിഭാവം സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ‘കഴുതപ്പുറത്ത് സഞ്ചരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: וּשְׁנֵי נְעָרָיו עִמּוֹ
  choice: അവന്റെ രണ്ടു യുവാക്കളും കൂടെയുണ്ടായിരുന്നു
  rationale: נְעָרָיו എന്നതിന്റെ നേരിട്ടുള്ള ‘അവന്റെ യുവാക്കൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ എന്നു നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ שָׂטָן എന്ന പദത്തിന്റെ അർഥം
  choice: 'പൊതുനാമം: ‘എതിരാളി’'
  alternative: 'വ്യക്തിനാമം: ‘സാത്താൻ’'
  rationale: വാക്യഘടനയിലും സന്ദർഭത്തിലും ഈ പദം യഹ്‌വെയുടെ ദൂതൻ ബിലെയാമിനെ എതിർക്കുന്ന പങ്കിനെയാണ് വിവരിക്കുന്നത്; മറ്റൊരു ആത്മീയ വ്യക്തിത്വത്തെ ഇവിടെ തിരിച്ചറിയേണ്ടതില്ല.
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ ശക്തമായ കോപപ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന മലയാളവായനയ്ക്ക് ലളിതമാക്കി. ശുശ്രൂഷകരെന്ന സാധ്യതയുള്ള נְעָרָיו എന്ന പദം വ്യാഖ്യാനാത്മകമായി ‘ദാസന്മാർ’ എന്നു മാറ്റാതെ ‘യുവാക്കൾ’ എന്നു നൽകി.
