id: NUM.22.9
reference: Numbers 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: ml
  text: 'അപ്പോൾ ദൈവം ബിലെയാമിന്റെ അടുക്കൽ വന്ന് പറഞ്ഞു: “നിന്നോടുകൂടെയുള്ള ഈ മനുഷ്യർ ആരാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്ന്
  rationale: കഥനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന വാവ് സഹിതമുള്ള בוא എന്ന ക്രിയയെ സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ ‘അപ്പോൾ ... വന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘പ്രവേശിച്ചു’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത സ്ഥലംസംബന്ധമായ സൂക്ഷ്മത വരും.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഏകവചന ക്രിയയോടുകൂടി ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആ വ്യക്തമായ ഏകവചനസൂചന ‘ദൈവം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֶל בִּלְעָם
  choice: ബിലെയാമിന്റെ അടുക്കൽ
  rationale: אֶל ദിശയെയോ ഒരാളിലേക്കുള്ള സമീപനത്തെയോ സൂചിപ്പിക്കുന്നു; വ്യക്തിയോടൊപ്പം ‘അടുക്കൽ’ എന്നത് മാന്യവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ രൂപം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: וַיֹּאמֶר
  choice: ചോദിച്ചു
  rationale: אמר എന്നതിന് അടിസ്ഥാനമായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് അതിന്റെ പ്രസംഗപ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִי
  choice: ആരാണ്
  rationale: വ്യക്തികളുടെ തിരിച്ചറിയൽ ചോദിക്കുന്ന ചോദനസർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള തുല്യം.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിലെ ദൂതന്മാർ പുരുഷന്മാരാണ്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തി ‘പുരുഷന്മാർ’ എന്നു നൽകി.
- source_word: הָאֵלֶּה
  choice: ഈ
  rationale: സംസാരസന്ദർഭത്തിൽ സന്നിഹിതരായ പ്രത്യേക പുരുഷന്മാരെ ചൂണ്ടിക്കാണിക്കുന്ന സമീപസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: עִמָּךְ
  choice: നിന്റെ കൂടെയുള്ള
  rationale: עם സഹവാസമോ കൂട്ടായിരിപ്പോ സൂചിപ്പിക്കുന്നു; ചോദ്യം മലയാളത്തിൽ സുതാര്യമാക്കാൻ ‘നിന്റെ കൂടെയുള്ള’ എന്നു നൽകി.
theological_decisions:
- issue: ബിലെയാം വിവരണത്തിലെ אֱלֹהִים എന്ന പദത്തിന്റെ സൂചിതൻ
  choice: ദൈവം
  alternative: ഒരു ദേവൻ / ദൈവിക സത്ത
  rationale: ബഹുവചനരൂപമുള്ള പദമായിരുന്നാലും ഇവിടെ ഏകവചന ക്രിയയും കഥാസന്ദർഭവും വ്യക്തിപരമായി പ്രവർത്തിക്കുന്ന ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൈവം’ എന്നു നൽകുന്നത് അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ഈ സൂചന സംരക്ഷിക്കുന്നു.
- issue: ദൈവം ചോദ്യം ചോദിക്കുന്നതിന്റെ ഉദ്ദേശ്യം
  choice: ഉദ്ദേശ്യം വിശദീകരിക്കാതെ ചോദ്യം അതേപടി നിലനിർത്തി
  alternative: ദൈവം വിവരമറിയാൻ ചോദിച്ചതായോ ബിലെയാമിനെ പരീക്ഷിച്ചതായോ വ്യാഖ്യാനിക്കുക
  rationale: മൂലവാക്യം ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവജ്ഞാനത്തെയോ പരീക്ഷണത്തെയോ സംബന്ധിച്ച നിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘വന്നു പറഞ്ഞു’ എന്ന എബ്രായ ഘടന നേരിട്ട് നിലനിർത്തുന്നതിനുപകരം, ചോദ്യം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി ‘വന്ന് ചോദിച്ചു’ എന്നു നൽകി. വ്യാഖ്യാനപരമായ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
