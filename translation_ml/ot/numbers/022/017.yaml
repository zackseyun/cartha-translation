  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּֽי כַבֵּ֤ד אֲכַבֶּדְ/ךָ֙ מְאֹ֔ד וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלַ֖/י אֶֽעֱשֶׂ֑ה וּ/לְכָ/ה נָּא֙ קָֽבָ/ה לִּ֔/י אֵ֖ת הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ നിന്നെ അത്യന്തം ബഹുമാനിക്കും[a]; നീ എന്നോടു പറയുന്നതെന്തും ഞാൻ ചെയ്യും. അതുകൊണ്ട് ദയവായി വന്ന് എനിക്കുവേണ്ടി ഈ ജനത്തെ ശപിക്കൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്നെ തീർച്ചയായും വളരെ ബഹുമാനിക്കും” അല്ലെങ്കിൽ “ഞാൻ നിനക്കു സമൃദ്ധമായ പ്രതിഫലം നൽകും.” ഊന്നൽ നൽകാൻ എബ്രായത്തിൽ ക്രിയയുടെ സമാപികരൂപത്തോടൊപ്പം അതേ ക്രിയയുടെ infinitive absolute രൂപവും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: ബാലാക്കിന്റെ ആവർത്തിച്ചുള്ള അഭ്യർഥനയ്ക്കുള്ള കാരണവും വാഗ്ദാനവും അവതരിപ്പിക്കുന്ന ബന്ധപദമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: ഞാൻ നിന്നെ അത്യന്തം ബഹുമാനിക്കും
  rationale: כבד എന്ന ധാതുവിലെ ബഹുമാനാർഥം നേരിട്ട് നിലനിർത്തുകയും infinitive absolute-ഉം מְאֹד-ഉം നൽകുന്ന ശക്തമായ ഊന്നൽ ‘അത്യന്തം’കൊണ്ട് പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: നീ എന്നോടു പറയുന്നതെന്തും ഞാൻ ചെയ്യും
  rationale: כֹל אֲשֶׁר എന്നതിന്റെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וּלְכָה נָּא
  choice: അതുകൊണ്ട് ദയവായി വന്ന്
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ആജ്ഞയും נָא നൽകുന്ന വിനയപൂർവമായ അഭ്യർഥനയും മുൻവാഗ്ദാനങ്ങളുമായുള്ള സന്ദർഭബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: קָבָה לִּי
  choice: എനിക്കുവേണ്ടി ... ശപിക്കൂ
  rationale: ബിലെയാം സന്ദർഭത്തിൽ קבב ഒരു ശാപം ഉച്ചരിക്കുക എന്ന അർഥത്തിലാണ്; לִי ബാലാക്കിന്റെ താൽപര്യത്തിനുവേണ്ടിയുള്ള പ്രവൃത്തിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֵת הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: עָם എന്ന ഏകവചന സമൂഹനാമത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ബഹുമാനിക്കും’ എന്നത് മൂലത്തിലെ כבד എന്ന ബഹുമാനഭാഷ നേരിട്ട് സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ പ്രതിഫലത്തിന്റെ സൂചന സാധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ആജ്ഞയിലെ വിനയഭാവം ‘ദയവായി’കൊണ്ട് നിലനിർത്തി.
