id: NUM.22.11
reference: Numbers 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: ml
  text: “ഇതാ, ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന ജനം ദേശത്തിന്റെ മുഖം മൂടിയിരിക്കുന്നു.[a] ഇപ്പോൾ വരിക; എനിക്കുവേണ്ടി അവരെ ശപിക്കുക. ഒരുപക്ഷേ, അവരോടു യുദ്ധംചെയ്ത് അവരെ ഓടിച്ചുകളയാൻ എനിക്കു കഴിഞ്ഞേക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: ‘ദേശത്തിന്റെ കണ്ണ് മൂടിയിരിക്കുന്നു’; ദേശത്തിന്റെ കാണാവുന്ന ഉപരിതലം അഥവാ മുഖം മുഴുവൻ മൂടിയിരിക്കുന്നു എന്നർഥമുള്ള ശൈലീപ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വാക്കുകൾക്ക് അടിയന്തരത നൽകുകയും ചെയ്യുന്ന ഹീബ്രു പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യം.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇസ്രായേലിനെ ഏകവചന കൂട്ടായ്മയായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടനാമം.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന
  rationale: ജനത്തെ പുറപ്പാട് എന്ന സംഭവത്താൽ തിരിച്ചറിയിക്കുന്ന നിർണായക കർത്തൃവാചക വിശേഷണത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: וַיְכַס
  choice: മൂടിയിരിക്കുന്നു
  rationale: കഴിഞ്ഞ പ്രവർത്തനത്തിന്റെ ഇപ്പോഴത്തെ ഫലം വ്യക്തമാക്കുന്ന രൂപം; കൂട്ടനാമമായ ജനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പിന്തുടരുന്നു.
- source_word: עֵין הָאָרֶץ
  choice: ദേശത്തിന്റെ മുഖം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദേശത്തിന്റെ കണ്ണ്’ എന്ന ഹീബ്രു ശൈലി ദൃശ്യമായ ഉപരിതലത്തെ സൂചിപ്പിക്കുന്നു; ‘മുഖം’ രൂപകം നിലനിർത്തുകയും അർഥം ഗ്രഹിക്കാവുന്നതാക്കുകയും ചെയ്യുന്നു.
- source_word: עַתָּה
  choice: ഇപ്പോൾ
  rationale: വിവരണത്തിൽനിന്ന് അടിയന്തരമായ അഭ്യർഥനയിലേക്കുള്ള മാറ്റം അടയാളപ്പെടുത്തുന്നു.
- source_word: לְכָה
  choice: വരിക
  rationale: പ്രവർത്തനത്തിന് ആഹ്വാനം ചെയ്യുന്ന കല്പനയുടെ നേരിട്ടുള്ള, മാന്യമായ മലയാളരൂപം.
- source_word: קָבָה
  choice: ശപിക്കുക
  rationale: ഒരാളുടെമേൽ ശാപം ഉച്ചരിക്കുക എന്ന ക്രിയയുടെ പ്രത്യേകവും ശക്തവുമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: לִּי
  choice: എനിക്കുവേണ്ടി
  rationale: ബാലാക്കിന്റെ പ്രയോജനത്തിനോ അദ്ദേഹത്തിന്റെ പക്ഷത്തുനിന്നോ പ്രവർത്തിക്കണമെന്ന ദാതൃഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֹתוֹ
  choice: അവരെ
  rationale: രൂപപരമായി ഏകവചനമാണെങ്കിലും ‘ജനം’ എന്ന കൂട്ടായ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭോചിതമായ ബഹുവചന സർവനാമം.
- source_word: אוּלַי אוּכַל
  choice: ഒരുപക്ഷേ ... എനിക്കു കഴിഞ്ഞേക്കും
  rationale: സാധ്യതയും പ്രത്യാശയും കലർന്ന അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: לְהִלָּחֶם בּוֹ
  choice: അവരോടു യുദ്ധംചെയ്ത്
  rationale: ആ ജനത്തിനെതിരേ യുദ്ധത്തിൽ ഏർപ്പെടുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְגֵרַשְׁתִּיו
  choice: അവരെ ഓടിച്ചുകളയാൻ
  rationale: ജനത്തെ അവിടെനിന്ന് ബലമായി നീക്കിക്കളയുക എന്ന ലക്ഷ്യം വ്യക്തമാക്കുന്നു; കൂട്ടായ സൂചിതവസ്തുവിന് ബഹുവചനം ഉപയോഗിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഹീബ്രുവിലെ കൂട്ട ഏകവചനമായ ‘ജനം’ തുടർന്നുള്ള സർവനാമങ്ങളിൽ അർഥാനുസൃതമായി ബഹുവചനമായി നൽകിയിരിക്കുന്നു. ‘ദേശത്തിന്റെ മുഖം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അക്ഷരാർഥമായ ‘കണ്ണ്’ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
