  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: ml
  text: പിന്നെ യാഹ്‌വേയുടെ ദൂതൻ കൂടുതൽ മുന്നോട്ടുപോയി.[a] വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയാൻ വഴിയില്ലാത്ത ഒരു ഇടുങ്ങിയ സ്ഥലത്ത് നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മുന്നോട്ടുപോകുന്നത് തുടർന്നു” അല്ലെങ്കിൽ “മുന്നോട്ടുകടന്നുപോയി” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ പ്രയോഗത്തിന് മുന്നോട്ടു പോകുന്നത് തുടരുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: കുറെക്കൂടി മുന്നോട്ടുപോയി
  rationale: יסף എന്ന ക്രിയയും עבר എന്ന infinitive-ഉം ചേർന്ന പ്രയോഗം മുന്നോട്ടുള്ള നീക്കം തുടരുക എന്ന ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ ദൂതൻ മറ്റൊരു സ്ഥാനത്തേക്ക് കൂടുതൽ മുന്നോട്ടുപോയതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യാഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ദൂതൻ/സന്ദേശവാഹകൻ എന്നർഥമുണ്ടെങ്കിലും, ഈ അതീന്ദ്രിയ വിവരണത്തിൽ ‘ദൂതൻ’ യോജിക്കുന്നു; יְהוָה എന്ന ദൈവനാമം ‘യാഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיַּעֲמֹד
  choice: നിലയുറപ്പിച്ചു
  rationale: עמד ഇവിടെ വെറുതെ നിൽക്കുക എന്നതിലുപരി വഴിയിൽ ഒരു സ്ഥാനം ഏറ്റെടുത്തു നിൽക്കുന്നതാണ്; ‘നിലയുറപ്പിച്ചു’ ആ സന്ദർഭാർഥം ചുരുക്കമായി നൽകുന്നു.
- source_word: בְּמָקוֹם צָר
  choice: ഒരു ഇടുങ്ങിയ സ്ഥലത്ത്
  rationale: צָר സ്ഥലപരമായ ഞെരുക്കത്തെയും വീതിക്കുറവിനെയും സൂചിപ്പിക്കുന്നു; ‘ഇടുങ്ങിയ സ്ഥലം’ ദൃശ്യബിംബം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: തിരിയാൻ വഴിയില്ലാത്ത
  rationale: ഇവിടെ דֶּרֶךְ ഒരു പാതയുടെ പൂർണ അഭാവമല്ല, വശത്തേക്ക് മാറാനുള്ള ഇടമോ മാർഗമോ ഇല്ലായ്മയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ
  rationale: ഇരുവശത്തേക്കുമുള്ള ചലനസാധ്യത നിഷേധിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ചതുർവ്യഞ്ജന ദൈവനാമത്തെ പദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു; പ്രത്യേക മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആഖ്യാനത്തിന്റെ ചലനവും സ്ഥലത്തിന്റെ ഞെരുക്കവും വ്യക്തമായി സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
