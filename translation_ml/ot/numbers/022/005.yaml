translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ദുഷ്കരമായ ഭൂമിശാസ്ത്രപ്രയോഗവും സർവനാമാനിശ്ചിതത്വവും മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
