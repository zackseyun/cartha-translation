  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: ml
  text: 'അവൻ ബെയോരിന്റെ മകനായ ബിലെയാമിനെ വിളിക്കാൻ, നദിക്കരയിലുള്ള പെഥോരിലേക്ക്, അവന്റെ ജനത്തിന്റെ പുത്രന്മാരുടെ ദേശത്തേക്ക് ദൂതന്മാരെ അയച്ചു.[a][b] അവൻ ഇങ്ങനെ പറയിച്ചു: “ഇതാ, ഒരു ജനം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നിരിക്കുന്നു. ഇതാ, അവർ ദേശത്തിന്റെ മുഖം മൂടിയിരിക്കുന്നു,[c] അവർ എനിക്ക് എതിർവശത്ത് പാർക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നദി’ എന്നു പറയുന്നത് സാധ്യതയേറിയവിധം യൂഫ്രട്ടീസ് നദിയാണ്.
    reason: cross_reference
  - marker: b
    text: ‘അവന്റെ ജനത്തിന്റെ ദേശത്ത്’ എന്നും വിവർത്തനം ചെയ്യാം. ‘അവന്റെ ജനത്തിന്റെ പുത്രന്മാരുടെ ദേശം’ എന്ന എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; ‘അവന്റെ’ എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു എന്നതും വ്യത്യസ്തമായി മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: 'പദശഃ: ‘ദേശത്തിന്റെ കണ്ണ് മൂടിയിരിക്കുന്നു’; ഈ പ്രയോഗം ദേശത്തിന്റെ ദൃശ്യമായ ഉപരിതലത്തെയോ മുഖത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: അതിനാൽ അവൻ ... ദൂതന്മാരെ അയച്ചു
  rationale: കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന wayyiqtol രൂപത്തിന്റെ തുടർച്ച ‘അതിനാൽ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ഈ നയതന്ത്രസന്ദർഭത്തിൽ מַלְאָכִים മനുഷ്യദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: ബെയോരിന്റെ മകനായ ബിലെയാം
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്കനുസരിച്ച് നൽകി; ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: פְּתוֹרָה אֲשֶׁר עַל־הַנָּהָר
  choice: നദിക്കരയിലുള്ള പെഥോരിൽ
  rationale: സ്ഥലനാമത്തിലെ ദിശാസൂചകാന്ത്യം ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെയും ബിലെയാമിന്റെ സ്ഥലത്തെയും സൂചിപ്പിക്കുന്നു. ‘നദി’ എന്ന മൂലപാഠരൂപം നിലനിർത്തി; യൂഫ്രട്ടീസ് എന്ന തിരിച്ചറിയൽ കുറിപ്പിലാക്കി.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: അവന്റെ ജനത്തിന്റെ പുത്രന്മാരുടെ ദേശത്ത്
  rationale: പ്രയാസമുള്ള എബ്രായപ്രയോഗത്തിന്റെ ഘടനയും ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വവും അമിതമായി ലളിതമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: לִקְרֹא לוֹ
  choice: അവനെ വിളിച്ചുവരുത്താൻ
  rationale: ഇവിടെ ഉദ്ദേശ്യം ഒരു സാധാരണ വിളിയല്ല, രാജാവിന്റെ അടുക്കലേക്കുള്ള വരവായതിനാൽ ‘വിളിച്ചുവരുത്താൻ’ സന്ദർഭാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: രണ്ടുതവണ വരുന്ന ശ്രദ്ധാകർഷക കണത്തിന്റെ ഊന്നൽ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַם יָצָא מִמִּצְרַיִם
  choice: ഒരു ജനം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നിരിക്കുന്നു
  rationale: പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർത്തീകരണരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: ദേശത്തിന്റെ മുഖം മൂടിയിരിക്കുന്നു
  rationale: ‘കണ്ണ്’ എന്ന പദശഃരൂപം മലയാളത്തിൽ അവ്യക്തമാകുന്നതിനാൽ ദൃശ്യമായ ഉപരിതലം സൂചിപ്പിക്കുന്ന രൂപകാർത്ഥം ‘മുഖം’ എന്നു നൽകി, ചിത്രഭാഷ നിലനിർത്തുന്നു.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: ഇപ്പോൾ അവർ എനിക്ക് എതിർവശത്ത് പാർക്കുന്നു
  rationale: കൂട്ടമായ ജനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന സർവനാമത്തിൽ പരാമർശിച്ചു; וְ־യുടെ സന്ദർഭപരമായ പുരോഗതി ‘ഇപ്പോൾ’ പ്രകടമാക്കുന്നു.
