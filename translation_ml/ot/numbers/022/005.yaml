revisions:
- from: 'അതിനാൽ അവൻ ബെയോരിന്റെ മകനായ ബിലെയാമിനെ വിളിച്ചുവരുത്താൻ ദൂതന്മാരെ അയച്ചു. ബിലെയാം നദിക്കരയിലുള്ള പെഥോരിൽ, അവന്റെ ജനത്തിന്റെ പുത്രന്മാരുടെ ദേശത്തായിരുന്നു.[a][b] അവൻ ഇങ്ങനെ പറയിച്ചു: “ഇതാ, ഒരു ജനം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നിരിക്കുന്നു. ഇതാ, അവർ ദേശത്തിന്റെ മുഖം മൂടിയിരിക്കുന്നു,[c] ഇപ്പോൾ അവർ എനിക്ക് എതിർവശത്ത് പാർക്കുന്നു.”'
  to: 'അവൻ ബെയോരിന്റെ മകനായ ബിലെയാമിനെ വിളിക്കാൻ, നദിക്കരയിലുള്ള പെഥോരിലേക്ക്, അവന്റെ ജനത്തിന്റെ പുത്രന്മാരുടെ ദേശത്തേക്ക് ദൂതന്മാരെ അയച്ചു.[a][b] അവൻ ഇങ്ങനെ പറയിച്ചു: “ഇതാ, ഒരു ജനം ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്നിരിക്കുന്നു. ഇതാ, അവർ ദേശത്തിന്റെ മുഖം മൂടിയിരിക്കുന്നു,[c] അവർ എനിക്ക് എതിർവശത്ത് പാർക്കുന്നു.”'
  rationale: The revision removes added causal and temporal nuances, restores the source’s close connection between Balaam and Pethor’s geographic descriptors, and uses the direct purpose expression ‘അവനെ വിളിക്കാൻ.’ It preserves the collective sense of the singular Hebrew ‘he/it’ for ‘a people’ with natural Malayalam plural reference, while retaining the difficult territorial phrase and all footnote anchors.
