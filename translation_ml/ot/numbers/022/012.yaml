id: NUM.22.12
reference: Numbers 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: ml
  text: 'ദൈവം ബിലെയാമിനോടു പറഞ്ഞു: “നീ അവരോടൊപ്പം പോകരുത്. ആ ജനത്തെ ശപിക്കരുത്; കാരണം ആ ജനം അനുഗ്രഹിക്കപ്പെട്ടതാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സംഭാഷണസഹജമായി: “അവർ അനുഗ്രഹിക്കപ്പെട്ടവരാണ്.” എബ്രായത്തിൽ “അത്/അവൻ അനുഗ്രഹിക്കപ്പെട്ടിരിക്കുന്നു” എന്ന ഏകവചനരൂപമാണ്; ‘ജനം’ എന്ന സമൂഹവാചക നാമത്തെയാണ് അത് സൂചിപ്പിക്കുന്നത്.'
    reason: സമൂഹവാചക ഏകവചനത്തിന്റെ വ്യാകരണവും സ്വാഭാവികമായ ബഹുവചനപര്യായവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ സന്ദർഭക്രമം സ്വാഭാവികമായി വ്യക്തമായതിനാൽ ലളിതമായ ഭൂതകാലക്രിയ മതിയാകുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിൽ ബിലെയാമിനോടു നേരിട്ട് സംസാരിക്കുന്ന സത്യദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഇതാണ് ആധുനിക മലയാളത്തിലെ സാധാരണ പരിഭാഷ.
- source_word: לֹא תֵלֵךְ
  choice: നീ ... പോകരുത്
  rationale: לֹא ചേർന്ന അപൂർണക്രിയ ഇവിടെ നിരോധനമാണ്; ‘പോകരുത്’ അതിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עִמָּהֶם
  choice: അവരോടൊപ്പം
  rationale: ബാലാക്കിന്റെ ദൂതന്മാരെ സൂചിപ്പിക്കുന്ന പൂർവപ്രയോഗവും ബഹുവചന സർവനാമപ്രത്യയവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לֹא תָאֹר
  choice: ശപിക്കരുത്
  rationale: אָרַר എന്നതിന് ‘ശപിക്കുക’ എന്നാണ് അർഥം; ഈ രൂപം സന്ദർഭത്തിൽ നിരോധനമായി പ്രവർത്തിക്കുന്നു.
- source_word: אֶת הָעָם
  choice: ആ ജനത്തെ
  rationale: הָעָם ഇസ്രായേലിനെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; നിർദിഷ്ടത മലയാളത്തിൽ ‘ആ ജനം’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിരോധനത്തിനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകമാണ്.
- source_word: בָרוּךְ הוּא
  choice: ആ ജനം അനുഗ്രഹിക്കപ്പെട്ടതാണ്
  rationale: എബ്രായത്തിലെ പുൽലിംഗ ഏകവചന വിശേഷണവും സർവനാമവും הָעָם എന്ന സമൂഹവാചക ഏകവചനത്തിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിൽ നപുംസക ഏകവചനരൂപം ഉപയോഗിച്ച് സമൂഹത്തെ ഒരൊറ്റ ജനമായി കാണുന്ന വ്യാകരണസവിശേഷത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അനുഗ്രഹിക്കപ്പെട്ടതാണ്’ എന്ന വാക്യഭാഗത്തിലെ സൂചിതവിഷയവും വചനവും
  choice: ഇസ്രായേൽജനത്തെ സമൂഹവാചക ഏകവചനമായി എടുത്ത് ‘ആ ജനം അനുഗ്രഹിക്കപ്പെട്ടതാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവർ അനുഗ്രഹിക്കപ്പെട്ടവരാണ്’
  rationale: בָרוּךְ הוּא എന്നത് ഏകവചനമാണെങ്കിലും അതിന്റെ പൂർവപദമായ הָעָם ഒരു സമൂഹവാചക നാമമാണ്. ഏകവചനത്തിന്റെ രൂപം നിലനിർത്തുന്നത് ഒരൊറ്റ വ്യക്തിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന ധാരണ വരുത്താതെ മൂലപാഠത്തിന്റെ വ്യാകരണതീവ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവിക നിരോധനത്തിന്റെ ശക്തി പഴഞ്ചൻ ശൈലിയില്ലാതെ ‘പോകരുത്/ശപിക്കരുത്’ എന്ന രൂപങ്ങളിൽ നിലനിർത്തി; സമൂഹവാചക ഏകവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു.
