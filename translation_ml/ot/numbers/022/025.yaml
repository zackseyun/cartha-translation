  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: ml
  text: കഴുത യഹ്‌വേയുടെ ദൈവദൂതനെ[a] കണ്ടപ്പോൾ മതിലിനോടു ചേർന്നമർന്ന് ബിലെയാമിന്റെ കാൽ മതിലിനോടു ഞെരുക്കി. അപ്പോൾ അവൻ വീണ്ടും അതിനെ അടിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യഹ്‌വേയുടെ ദൂതനെ.’ ഇവിടെ അതിമാനുഷികനായ ഒരു ദൂതനെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: കഴുത
  rationale: אָתוֹן പെൺകഴുതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായി ‘കഴുത’ എന്നു പറയുന്നതാണ് ഉചിതം; വ്യാകരണലിംഗം അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വേയുടെ ദൂതൻ
  rationale: מַלְאַךְ എന്നതിന് ‘ദൂതൻ’ എന്നും ‘ദൈവദൂതൻ’ എന്നും അർഥമാകാം. ഈ സന്ദർഭത്തിൽ അതിമാനുഷിക സത്തയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, മൂലപദത്തിന്റെ ‘messenger’ എന്ന അർഥവ്യാപ്തി നിലനിർത്താൻ ‘ദൂതൻ’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുപദവിയാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: മതിലിനോടു ചേർന്നുനിന്ന്
  rationale: കഴുത മതിലിനോടു തിങ്ങിച്ചേർന്ന ശാരീരിക ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രതിഫലനസ്വഭാവം സാഹചര്യത്തിൽനിന്ന് ഗ്രഹിക്കാം.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: ബിലെയാമിന്റെ കാൽ മതിലിനോടു ഞെരുക്കി
  rationale: לחץ എന്ന ക്രിയ ഇവിടെ കാൽ മതിലിനിടയിൽ അമർന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഞെരുക്കി’ അതിന്റെ ശക്തിയും ഫലവും വ്യക്തമായി നൽകുന്നു.
- source_word: רֶגֶל
  choice: കാൽ
  rationale: רֶגֶל ഇവിടെ ‘കാൽ/പാദം’ എന്നർഥം നൽകുന്നു; സാധാരണ മലയാളത്തിൽ ‘കാൽ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: അപ്പോൾ അവൻ അതിനെ വീണ്ടും അടിച്ചു
  rationale: יָסַף + അനന്തരൂപം പ്രവൃത്തി ആവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടും അടിച്ചു’ അതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക ദൈവനാമം നിലനിർത്താനും പൊതുപദവിയാൽ പകരാതിരിക്കാനും ‘യഹ്‌വേ’ ഉപയോഗിച്ചു.
- issue: מַלְאַךְ എന്ന പദത്തിലെ ‘ദൂതൻ/ദൈവദൂതൻ’ അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘ദൂതൻ’
  alternative: ദൈവദൂതൻ
  rationale: സന്ദർഭം അതിമാനുഷിക സത്തയെ സൂചിപ്പിക്കുന്നു. എങ്കിലും പദത്തിന്റെ അടിസ്ഥാനമായ ‘സന്ദേശവാഹകൻ/ദൂതൻ’ എന്ന അർഥം മറച്ചുകളയാതെ, അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മതിലിനോടു ചേർന്നുനിന്ന്’ എന്നത് കഴുതയുടെ ചലനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ഞെരുക്കി’ എന്നത് ബിലെയാമിന്റെ കാലിനുണ്ടായ അമർച്ച വ്യക്തമാക്കുന്നു. ആവർത്തനമുള്ള എബ്രായ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
