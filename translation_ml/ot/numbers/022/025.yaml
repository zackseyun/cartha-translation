    rationale: Although lexically possible, ‘ദൂതൻ’ alone is ambiguous in modern Malayalam and can suggest a human envoy. The immediate narrative context identifies a supernatural angelic being, so ‘ദൈവദൂതൻ’ is the more faithful and natural main-text term.
  - severity: low
    issue: ‘മതിലിനോടു ചേർന്നുനിന്ന്’ understates the squeezing/pressing motion.
    rationale: The Hebrew depicts the donkey pressing herself against the wall. ‘ചേർന്നമർന്ന്’ communicates that physical constriction more precisely.
