translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ബാലാക്കിന്റെ കുറ്റപ്പെടുത്തലും അവിശ്വാസം കലർന്ന അലങ്കാരചോദ്യങ്ങളും നിലനിർത്തി; അതേസമയം ‘അടിയന്തരമായി’ അല്ലെങ്കിൽ ‘വീണ്ടും വീണ്ടും’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
