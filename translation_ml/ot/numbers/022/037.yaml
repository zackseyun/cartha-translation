source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: ml
  text: 'ബാലാക്ക് ബിലെയാമിനോടു പറഞ്ഞു: “നിന്നെ വിളിക്കാൻ ഞാൻ നിന്റെ അടുക്കൽ തീർച്ചയായും ആളയച്ചതല്ലേ[a]? നീ എന്തുകൊണ്ട് എന്റെ അടുക്കൽ വന്നില്ല[b]? നിന്നെ ആദരിക്കാൻ[c] എനിക്കു ശരിക്കും കഴിയില്ലെന്നാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അയയ്ക്കുക’ എന്ന ക്രിയയുടെ ഒരു ഊന്നൽരൂപവും സമാപികാക്രിയയും ചേർന്നതിനാൽ, ‘ഞാൻ നിന്റെ അടുക്കൽ അയച്ചിരുന്നില്ലേ?’ എന്നതിനു ശക്തമായ ഊന്നലുണ്ട്. സന്ദർഭം പരിഗണിച്ച് ചിലർ ഇതിനെ ‘വീണ്ടും വീണ്ടും’ അല്ലെങ്കിൽ ‘അടിയന്തരമായി’ ആളയച്ചു എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നീ എന്തുകൊണ്ട് എന്റെ അടുക്കൽ പോയില്ല?’
    reason: lexical_alternative
  - marker: c
    text: ‘ആദരിക്കാൻ’ എന്നതിൽ ബഹുമാനം കാണിക്കുക മാത്രമല്ല, പ്രതിഫലമോ ഉയർന്ന പദവിയോ നൽകുക എന്ന ആശയവും ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֲלֹא
  choice: അല്ലേ
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: തീർച്ചയായും ആളയച്ചതല്ലേ
  rationale: ക്രിയാനാമത്തിന്റെ കേവലരൂപവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ പ്രയോഗത്തിലെ ഊന്നൽ ‘തീർച്ചയായും’ എന്നു പ്രകടമാക്കുന്നു; ആവർത്തിച്ചോ അടിയന്തരമായോ അയച്ചു എന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല. ആളെ അയയ്ക്കുന്നതാണ് സന്ദർഭത്തിൽ സൂചിതമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി ‘ആളയച്ചു’ എന്നു നൽകി.
- source_word: לִקְרֹא לָךְ
  choice: നിന്നെ വിളിക്കാൻ
  rationale: ഇവിടെ קרא ഒരാളെ വരാൻ വിളിക്കുകയോ വിളിച്ചുവരുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വിളിക്കാൻ’ മൂലപദത്തോടു ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ വ്യക്തവുമാണ്.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: നീ എന്തുകൊണ്ട് എന്റെ അടുക്കൽ വന്നില്ല
  rationale: הלך എന്നത് അക്ഷരാർഥത്തിൽ ‘പോകുക’ ആണെങ്കിലും, സംസാരിക്കുന്ന ബാലാക്കിന്റെ ദിശയിലേക്ക് സഞ്ചരിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്റെ അടുക്കൽ വന്നില്ല’ എന്നു പറയുന്നു.
- source_word: הַאֻמְנָם
  choice: ശരിക്കും
  rationale: ആശ്ചര്യവും അവിശ്വാസവും കലർന്ന ഊന്നിയ ചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: כַּבְּדֶךָ
  choice: നിന്നെ ആദരിക്കാൻ
  rationale: പീയേൽ രൂപത്തിലുള്ള כבד ബഹുമാനിക്കുകയോ ഉയർന്ന പദവിയും പ്രതിഫലവും നൽകി ആദരിക്കുകയോ എന്ന വിശാല അർഥം വഹിക്കാം; ‘ആദരിക്കാൻ’ ഈ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
