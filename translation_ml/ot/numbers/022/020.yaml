id: NUM.22.20
reference: Numbers 22:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: ml
  text: 'രാത്രിയിൽ ദൈവം ബിലെയാമിന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “ആ മനുഷ്യർ നിന്നെ വിളിക്കാൻ വന്നതാണെങ്കിൽ[a], എഴുന്നേറ്റ് അവരോടൊപ്പം പോകുക; എന്നാൽ ഞാൻ നിന്നോടു പറയുന്ന കാര്യം[b] മാത്രമേ നീ ചെയ്യാവൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആ മനുഷ്യർ നിന്നെ ക്ഷണിക്കാൻ വന്നതാണെങ്കിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഞാൻ നിന്നോടു പറയുന്ന വചനം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: വന്ന്
  rationale: בוא എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘വന്നു’ എന്നത് നിലനിർത്തുന്നു; ദർശനമായി പ്രത്യക്ഷപ്പെട്ടു എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത അർഥം ചേർക്കുന്നില്ല.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ഈ വാക്യത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത് יהוה അല്ല, אֱלֹהִים ആകയാൽ ദൈവനാമവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: לַיְלָה
  choice: രാത്രിയിൽ
  rationale: സമയസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: ആ മനുഷ്യർ നിന്നെ വിളിക്കാൻ വന്നതാണെങ്കിൽ
  rationale: לִקְרֹא എന്നതിന്റെ ‘വിളിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും സന്ദർഭത്തിലെ ക്ഷണം/വിളിച്ചുകൊണ്ടുപോകൽ എന്ന ഭാവം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: קוּם לֵךְ
  choice: എഴുന്നേറ്റ് ... പോകുക
  rationale: രണ്ടു ആജ്ഞകളെയും മലയാളത്തിലെ സ്വാഭാവിക അനുക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: സഹഗമനാർഥം നേരിട്ടും വ്യക്തമായും നൽകുന്നു.
- source_word: וְאַךְ
  choice: എന്നാൽ ... മാത്രമേ
  rationale: അനുമതിക്കൊപ്പം വരുന്ന കർശനമായ പരിമിതി മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַדָּבָר
  choice: വചനം
  rationale: דבר എന്നതിന് ‘കാര്യം’ എന്നും അർഥമുണ്ടെങ്കിലും, אֲדַבֵּר എന്ന ‘പറയുക’ ക്രിയയോടുള്ള ബന്ധവും പ്രവാചകീയ വാക്കിന്റെ ഭാവവും ഇവിടെ ‘വചനം’ നന്നായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: ഞാൻ നിന്നോടു പറയുന്ന
  rationale: ഹീബ്രു അപൂർണ്ണക്രിയയുടെ സന്ദർഭോചിതമായ ഭാവി/പ്രസക്ത അർഥം മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യത്തിൽ നൽകുന്നു.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: മാത്രമേ നീ ചെയ്യാവൂ
  rationale: മുൻനിറുത്തിയ കർമ്മത്തിന്റെ ഊന്നലും ദൈവിക നിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ ദൈവസംബോധന
  choice: אֱלֹהִים എന്നത് ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു
  alternative: ‘യഹോവ’ / ‘കർത്താവ്’
  rationale: ഈ വാക്യത്തിന്റെ ഹീബ്രു പാഠത്തിൽ ദൈവനാമമായ יהוה അല്ല, אֱלֹהִים ആണ്; സമീപസന്ദർഭവുമായി ഏകീകരിക്കാതെ മൂലപാഠത്തിലെ വ്യത്യാസം നിലനിർത്തുന്നു.
- issue: ബിലെയാമിനു നൽകിയ അനുമതിയുടെ നിയന്ത്രണം
  choice: ‘എന്നാൽ ... മാത്രമേ നീ ചെയ്യാവൂ’ എന്ന നിയന്ത്രിത ആജ്ഞ
  alternative: സാധാരണ അനുമതിയായി മൃദൂകരിക്കുക
  rationale: וְאַךְ എന്ന നിയന്ത്രണകണവും אֹתוֹ എന്ന ഊന്നിയ കർമ്മവും ബിലെയാമിന്റെ യാത്ര ദൈവം പറയുന്ന വചനത്തിന് വിധേയമാണെന്ന് വ്യക്തമാക്കുന്നു; അതിലപ്പുറം ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘വചനം’ എന്നത് പ്രസംഗസന്ദർഭത്തിലെ דבר–דבר ബന്ധം സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പിൽ ‘കാര്യം’ എന്ന യഥാർഥ പദാർഥസാധ്യതയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
