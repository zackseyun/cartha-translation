    issue: ‘കൊടുത്തയച്ചു’ slightly strengthens the simple verb וַיְשַׁלַּח.
    rationale: The Hebrew says only ‘sent.’ Since ‘അവയിൽ ചിലത്’ already makes the contextual object explicit, ‘അയച്ചു’ better preserves the source expression.
