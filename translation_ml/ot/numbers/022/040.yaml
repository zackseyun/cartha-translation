  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. യാഗസന്ദർഭം വ്യക്തമായി നിലനിർത്തിയെങ്കിലും എബ്രായത്തിൽ വ്യക്തമാക്കാത്ത ‘ഓഹരികൾ’ മുഖ്യവാക്യത്തിൽ നിർബന്ധിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
