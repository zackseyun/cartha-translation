  text: וַ/יִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָ/צֹ֑אן וַ/יְשַׁלַּ֣ח לְ/בִלְעָ֔ם וְ/לַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: ml
  text: ബാലാക്ക് കന്നുകാലികളെയും ആടുകളെയും[a] യാഗമായി അറുത്തു; അവയിൽ ചിലത്[b] ബിലെയാമിനും അവനോടുകൂടെ ഉണ്ടായിരുന്ന പ്രമാണിമാർക്കും അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആടുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ചെമ്മരിയാടുകളെയും കോലാടുകളെയും ഉൾപ്പെടുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അയച്ചു’ എന്നുമാത്രം. യാഗമൃഗങ്ങളുടെ മാംസമോ യാഗത്തിന്റെ ഓഹരികളോ അയച്ചുവെന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാലാണ് ‘അവയിൽ ചിലത്’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: യാഗമായി അറുത്തു
  rationale: זבח എന്ന ക്രിയയിൽ യാഗാർഥമായ അറവിന്റെ ആശയം ഉൾപ്പെടുന്നു. ‘യാഗമായി അറുത്തു’ എന്നത് വെറും അറവിൽനിന്ന് അതിനെ വേർതിരിക്കുകയും സ്വാഭാവികമായ മലയാളം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בָּקָר
  choice: കന്നുകാലികൾ
  rationale: בקר പശുവർഗത്തിൽപ്പെട്ട മൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ലിംഗം പരിമിതപ്പെടുത്താതെ ഈ അർഥം നൽകുന്ന പൊതുവായ ആധുനിക മലയാളപദമാണ് ‘കന്നുകാലികൾ’.
- source_word: צֹאן
  choice: ആടുമാടുകൾ
  rationale: צאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടാവുന്ന ചെറിയ വളർത്തുമൃഗങ്ങളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘ആടുമാടുകൾ’ ഈ വിശാലത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיְשַׁלַּח
  choice: കൊടുത്തയച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അയച്ചു’ എന്നാണ്. യാഗമൃഗങ്ങളെ അറുത്തതിനു പിന്നാലെയുള്ള സന്ദർഭത്തിൽ അവയിൽനിന്നുള്ള ഭാഗങ്ങൾ അയച്ചതാണെന്ന് സൂചനയുള്ളതിനാൽ ‘കൊടുത്തയച്ചു’ സ്വാഭാവികമാണ്; ‘അവയിൽ കുറെ’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള പൂരകമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְבִלְעָם
  choice: ബിലെയാമിന്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: לַשָּׂרִים
  choice: പ്രമാണിമാർക്ക്
  rationale: שׂרים ഉയർന്ന സ്ഥാനമുള്ള ഭരണപ്രതിനിധികളെയോ പ്രമുഖരെയോ സൂചിപ്പിക്കുന്നു. രാജകുമാരന്മാർ എന്ന പാരമ്പര്യ/വംശപരമായ അർഥം നിർബന്ധിക്കാതെ പദവിയെ സൂചിപ്പിക്കാൻ ‘പ്രമാണിമാർ’ യോജിക്കുന്നു.
- source_word: אֲשֶׁר אִתּוֹ
  choice: അവനോടുകൂടെയുണ്ടായിരുന്ന
  rationale: എബ്രായത്തിലെ ഏകവചന സർവനാമം ഏറ്റവും അടുത്ത ഏകവചന പൂർവപദമായ ബിലെയാമിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഉറവിടത്തിലെ സർവനാമഘടന മലയാളത്തിലും നിലനിർത്തി.
