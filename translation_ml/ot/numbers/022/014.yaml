  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: ml
  text: 'അപ്പോൾ മോവാബിലെ പ്രഭുക്കന്മാർ എഴുന്നേറ്റ് ബാലാക്കിന്റെ അടുക്കൽ ചെന്നു പറഞ്ഞു: “ബിലെയാം ഞങ്ങളോടൊപ്പം വരാൻ വിസമ്മതിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: മോവാബിലെ പ്രഭുക്കന്മാർ
  rationale: שַׂר എന്ന പദം രാജകീയ ദൂതന്മാരായി പ്രവർത്തിക്കുന്ന ഉന്നതസ്ഥാനക്കാരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികവും മാന്യവുമായ പദമാണ് ‘പ്രഭുക്കന്മാർ’.
- source_word: וַיָּק֨וּמוּ֙
  choice: എഴുന്നേറ്റ്
  rationale: קום എന്ന ക്രിയയുടെ ശാരീരികമായ അർഥവും തുടർന്നുള്ള യാത്രയിലേക്കുള്ള നീക്കവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: מֵאֵן
  choice: വിസമ്മതിച്ചു
  rationale: വെറും ‘വന്നില്ല’ എന്നതിലുപരി മനഃപൂർവമായ നിരാകരണം സൂചിപ്പിക്കുന്ന ഹീബ്രു ക്രിയയുടെ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: ഞങ്ങളോടൊപ്പം വരാൻ
  rationale: הלך എന്ന ക്രിയ ഇവിടെ ദൂതന്മാരോടൊപ്പം ബാലാക്കിന്റെ അടുക്കലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വരാൻ’ എന്നത് റിപ്പോർട്ട് ചെയ്യുന്നവരുടെ ദൃഷ്ടികോണത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രാഖ്യാന ശൈലി. ഹീബ്രുവിലെ ക്രിയാക്രമവും നേരിട്ടുള്ള ഉദ്ധരണിയും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
