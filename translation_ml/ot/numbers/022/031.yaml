source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ ബിലെയാമിന്റെ കണ്ണുകൾ തുറന്നു[a]. വഴിയിൽ, കൈയിൽ ഊരിപ്പിടിച്ച വാളുമായി യഹ്‌വെയുടെ ദൂതൻ[b] നിൽക്കുന്നത് അവൻ കണ്ടു. അവൻ കുനിഞ്ഞ് മുഖം നിലത്ത് പതിയുമാറ് വീണു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ബിലെയാമിന്റെ കണ്ണുകളുടെ മറ നീക്കി.’
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വെയുടെ സന്ദേശവാഹകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘തന്റെ മുഖത്തേക്കു’; മുഖം നിലത്തേക്കു താഴ്ത്തി വീഴുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: തുറന്നു
  rationale: ഗലാഹ് എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘മറ നീക്കുക/വെളിപ്പെടുത്തുക’ എന്നാണെങ്കിലും, കണ്ണുകളോടൊപ്പമുള്ള ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം ‘കണ്ണുകൾ തുറന്നു’ എന്നാണ്; ദൈവം കാഴ്ചയ്ക്കുണ്ടായിരുന്ന തടസ്സം നീക്കിയെന്ന ആശയം നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מַלְאַךְ יְהוָה
  choice: യഹ്‌വെയുടെ ദൂതൻ
  rationale: מַלְאָךְ എന്നതിന് ‘ദൂതൻ/സന്ദേശവാഹകൻ’ എന്ന വിശാലാർഥമുണ്ട്. ഈ അതീന്ദ്രിയ പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ‘ദൂതൻ’ സ്വാഭാവികവും അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നതുമാണ്.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: വഴിയിൽ ... നിൽക്കുന്നത്
  rationale: സ്ഥിരമായി നിൽക്കുന്ന ഭാവവും യാത്രാമാർഗത്തിലെ തടസ്സസ്ഥാനവും ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: കൈയിൽ ഊരിപ്പിടിച്ച വാളുമായി
  rationale: വാൾ ഉറയിൽനിന്ന് ഊരിയ നിലയിലാണെന്ന שְׁלֻפָהയുടെ അർഥവും അത് കൈയിലാണെന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: കുനിഞ്ഞ് മുഖം നിലത്താക്കി സാഷ്ടാംഗം വീണു
  rationale: താഴെ കുനിയലും മുഖം നിലത്താകുന്ന പൂർണ പ്രണാമവും ഉൾപ്പെട്ട ശാരീരിക പ്രതികരണം വ്യക്തമാക്കുന്നു; ‘ആരാധിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് ദൈവശാസ്ത്രപരമായ നിഗമനം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാൽ പകരാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസൗകര്യമുള്ളതുമായ ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- issue: וַיִּשְׁתַּחוּ എന്ന ക്രിയ ആരാധനയെന്നോ ശരീരപ്രണാമമെന്നോ വ്യക്തമാക്കൽ
  choice: ശരീരപ്രണാമം സൂചിപ്പിക്കുന്ന ‘സാഷ്ടാംഗം വീണു’
  alternative: ആരാധിച്ചു
  rationale: സന്ദർഭം വ്യക്തമായി ശരീരചലനം വിവരിക്കുന്നു. ‘ആരാധിച്ചു’ എന്നത് സാധ്യമായ അർഥമാണെങ്കിലും, ഈ വാക്യം മാത്രം ആവശ്യപ്പെടാത്ത ദൈവശാസ്ത്രപരമായ നിർണ്ണയം അതിലൂടെ വരാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘കണ്ണുകൾ തുറന്നു’ എന്ന സ്വാഭാവിക ഭാഷാശൈലിയോടൊപ്പം അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘സാഷ്ടാംഗം’ പൊതുവേ മനസ്സിലാകുന്ന ഔപചാരിക പദമായി ഉപയോഗിച്ചെങ്കിലും ആരാധനയെന്ന വ്യാഖ്യാനം നിർബന്ധിച്ചിട്ടില്ല.
