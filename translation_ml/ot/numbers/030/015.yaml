  source_fidelity: ഹീബ്രു നിയമപ്രയോഗത്തോടു വിശ്വസ്തമാണ്. הַחֲרֵשׁ יַחֲרִישׁ എന്ന ഊന്നിപ്പറയുന്ന മൗനവും לָהּ എന്ന ‘അവളോട്’ എന്ന ബന്ധവും, מִיּוֹם אֶל־יוֹם എന്ന തുടർച്ചയും, നേർച്ചകളും അവളുടെമേലുള്ള ബന്ധനസ്വഭാവമുള്ള ബാധ്യതകളും, കേട്ട ദിവസത്തെ മൗനത്തിന്റെ നിയമഫലവും യഥാക്രമം സംരക്ഷിച്ചിട്ടുണ്ട്. ‘സ്ഥിരീകരിക്കുന്നു; ... സ്ഥിരീകരിച്ചിരിക്കുന്നു’ എന്ന ക്രിയാവർത്തനം ഹീബ്രുവിലെ നിയമഫലവും സമാപനപ്രസ്താവനയും പ്രതിഫലിപ്പിക്കുന്നു.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ള നിയമഭാഷയുമാണ്. ‘അവളോട് ഒന്നും പറയാതെ മൗനം പാലിക്കുക’ അല്പം വിശദമായ ആവർത്തനമാണെങ്കിലും, ഇവിടെ ഉദ്ദേശിക്കുന്ന എതിർപ്പില്ലായ്മയെ വ്യക്തമായി പ്രകടമാക്കുന്നു; അസ്വാഭാവികതയോ അർഥവ്യതിയാനമോ ഉണ്ടാക്കുന്നില്ല.
  terminology: ‘ഭർത്താവ്,’ ‘നേർച്ചകൾ,’ ‘ബാധ്യതകൾ,’ ‘സ്ഥിരീകരിക്കുന്നു’ എന്നിവ സന്ദർഭോചിതവും സ്ഥിരതയുള്ളതുമാണ്. אֱסָרֶיהָയുടെ ബന്ധന/പ്രതിബദ്ധതാഭാവം ‘അവളുടെമേലുള്ള എല്ലാ ബാധ്യതകളും’ എന്നതിൽ മതിയായ രീതിയിൽ ലഭ്യമാണ്. അധിക അടിക്കുറിപ്പ് അനിവാര്യമല്ല.
