id: NUM.30.15
reference: Numbers 30:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: ml
  text: എന്നാൽ അവളുടെ ഭർത്താവ് നാൾതോറും അവളോട് ഒന്നും പറയാതെ മൗനം പാലിച്ചാൽ, അവളുടെ എല്ലാ നേർച്ചകളും അവളുടെമേലുള്ള എല്ലാ ബാധ്യതകളും അവൻ സ്ഥിരീകരിക്കുന്നു; അവയെ അവൻ സ്ഥിരീകരിച്ചിരിക്കുന്നു, കാരണം അവൻ കേട്ട ദിവസം അവളോട് ഒന്നും പറയാതെ മൗനം പാലിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: ഒന്നും പറയാതെ മൗനം പാലിച്ചാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും സമാപിക ക്രിയയും ചേർന്ന പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ സംസാരിക്കാനാകാത്ത അവസ്ഥയല്ല, നിയമപരമായി എതിർപ്പ് അറിയിക്കാതിരിക്കലാണ് ഉദ്ദേശ്യം.
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: വിവാഹബന്ധത്തെക്കുറിച്ചുള്ള ഈ നിയമസന്ദർഭത്തിൽ അർഥം വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക പരിഭാഷ.
- source_word: מִיּוֹם אֶל יוֹם
  choice: നാൾതോറും
  rationale: തുടർച്ചയായ ദിവസങ്ങളിലൂടെയുള്ള മൗനത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְהֵקִים
  choice: സ്ഥിരീകരിക്കുന്നു
  rationale: ഹിഫീൽ രൂപത്തിന് ഇവിടെ നേർച്ചയെ നിലനിൽക്കാൻ അനുവദിക്കുക എന്ന നിയമപരമായ അർഥമുണ്ട്; ‘സ്ഥിരീകരിക്കുന്നു’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: נְדָרֶיהָ
  choice: അവളുടെ എല്ലാ നേർച്ചകളും
  rationale: നിയമപരവും ആരാധനാപരവുമായ സന്ദർഭങ്ങളിൽ נדר എന്ന പദത്തിന്റെ സാധാരണ മലയാള സമാനപദം.
- source_word: אֱסָרֶיהָ
  choice: അവളുടെമേലുള്ള എല്ലാ ബാധ്യതകളും
  rationale: אסר എന്ന ‘ബന്ധിക്കുക’ എന്ന ധാതുവിൽനിന്നുള്ള ഈ നാമം വ്യക്തി സ്വയം ഏറ്റെടുക്കുന്ന ബന്ധനസ്വഭാവമുള്ള പ്രതിബദ്ധതകളെ സൂചിപ്പിക്കുന്നു; ‘ബാധ്യതകൾ’ അതിന്റെ നിയമബലം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: അവളുടെമേലുള്ള
  rationale: ബാധ്യതകൾ അവളുടെമേൽ നിലകൊള്ളുന്നു എന്ന ഹീബ്രു രൂപകവും നിയമപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: הֵקִים אֹתָם
  choice: അവയെ അവൻ സ്ഥിരീകരിച്ചിരിക്കുന്നു
  rationale: അവന്റെ മുൻകാല മൗനത്തിൽനിന്നുണ്ടായ ഇപ്പോഴും നിലനിൽക്കുന്ന നിയമഫലത്തെ സമ്പൂർണകാലരൂപം വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: അവന്റെ മൗനം നേർച്ചകളെ സ്ഥിരീകരിച്ചതിന്റെ കാരണം വിശദീകരിക്കുന്ന causal അർഥം നൽകുന്നു.
- source_word: הֶחֱרִשׁ לָהּ
  choice: അവളോട് ഒന്നും പറയാതെ മൗനം പാലിച്ചു
  rationale: അവളോടുള്ള നിയമപരമായ അനുത്തരവും എതിർപ്പില്ലായ്മയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ മൗനമെന്ന പ്രമേയവും ആവർത്തിക്കുന്നു.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: അവൻ കേട്ട ദിവസം
  rationale: ഹീബ്രുവിലെ സമയസൂചനയും ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന നിയമപരമായ സമയപരിധിയും അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. ഹീബ്രുവിലെ ആവർത്തനം നിയമഫലത്തിന് നൽകുന്ന ഊന്നൽ നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും, ‘മൗനം പാലിക്കുക’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി വരാൻ ‘അവളോട് ഒന്നും പറയാതെ’ എന്നു ചേർത്തു. ഇവിടെ അർഥവ്യത്യാസം ആവശ്യപ്പെടുന്ന അടിക്കുറിപ്പ് ഇല്ല; ഇംഗ്ലീഷ് പാളിയിലെ [a] അടയാളം പദസ്ഥാനം തെറ്റിയതായി തോന്നുന്നതിനാൽ അതിനെ അനുകരിച്ചിട്ടില്ല.
