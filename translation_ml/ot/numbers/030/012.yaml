base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: ml
  text: അവളുടെ ഭർത്താവ് അതു കേട്ടിട്ടും അവളോട് ഒന്നും പറയാതിരിക്കുകയും അവളുടെ നേർച്ച അസാധുവാക്കാതിരിക്കുകയും ചെയ്താൽ,[a] അവളുടെ എല്ലാ നേർച്ചകളും നിലനിൽക്കും; അവൾ തന്റെമേൽ ചുമത്തിയ എല്ലാ ബാധ്യതകളും നിലനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവളെ അസാധുവാക്കാതിരുന്നാൽ’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് അവളുടെ നേർച്ചയെയോ അവൾ ഏറ്റെടുത്ത ബാധ്യതയെയോ റദ്ദാക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: കേട്ടിട്ടും ... ചെയ്താൽ
  rationale: ചുറ്റുമുള്ള നിയമവാക്യങ്ങളുടെ വ്യവസ്ഥാരൂപം പരിഗണിച്ച്, വാവ് + ഖാതൽ രൂപത്തിന്റെ സോപാധികബലം സ്വാഭാവികമായ മലയാളത്തിൽ ‘ചെയ്താൽ’ എന്നു പ്രകടമാക്കി.
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: ഈ വിവാഹനിയമസന്ദർഭത്തിൽ אִישׁ എന്ന പദം ‘പുരുഷൻ’ എന്ന പൊതുവായ അർഥത്തിലല്ല, സ്ത്രീയുടെ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: അവളോട് ഒന്നും പറയാതിരിക്കുകയും
  rationale: അവളുടെ നേർച്ച കേട്ടിട്ടും പ്രതികരിക്കാതെ മൗനം പാലിക്കുന്നതെന്ന നിയമപരമായ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: അവളുടെ നേർച്ച അസാധുവാക്കാതിരിക്കുകയും
  rationale: എബ്രായത്തിൽ നേരിട്ടുള്ള കർമം ‘അവളെ’ എന്നാണെങ്കിലും, ഈ അധ്യായത്തിലെ നിയമസന്ദർഭത്തിൽ ഭർത്താവ് അവളുടെ നേർച്ചയുടെ പ്രാബല്യം റദ്ദാക്കാതിരിക്കുന്നതാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സൂചിതവിഷയം വ്യക്തമാക്കി; മൂലരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: וְקָמוּ ... יָקוּם
  choice: നിലനിൽക്കും ... നിലനിൽക്കും
  rationale: קום എന്ന ക്രിയയുടെ നിയമപരമായ ‘പ്രാബല്യത്തിൽ തുടരുക’ എന്ന അർഥവും മൂലത്തിലെ ആവർത്തനസമാന്തരതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: כָּל נְדָרֶיהָ
  choice: അവളുടെ എല്ലാ നേർച്ചകളും
  rationale: നേർച്ചാനിയമങ്ങളിലെ נדר എന്ന പദത്തിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളസമാനപദം ഉപയോഗിച്ചു.
- source_word: וְכָל אִסָּר
  choice: എല്ലാ ബാധ്യതകളും
  rationale: אִסָּר ഇവിടെ സ്വയം ഏറ്റെടുക്കുന്ന നിർബന്ധിത നിയന്ത്രണമോ കടപ്പാടോ സൂചിപ്പിക്കുന്നു; അപരിചിതമായ അക്ഷരാർഥമായ ‘ബന്ധനം’ എന്നതിനെക്കാൾ ‘ബാധ്യത’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: അവൾ തന്റെമേൽ ചുമത്തിയ
  rationale: സ്വന്തംമേൽ ഒരു നിർബന്ധം ചുമത്തുക എന്ന എബ്രായ രൂപകവും സ്വയം ഏറ്റെടുത്ത ബാധ്യത എന്ന അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
