id: NUM.30.10
reference: Numbers 30:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: ml
  text: വിധവയുടെയോ വിവാഹമോചിതയായ സ്ത്രീയുടെയോ നേർച്ച—അവൾ സ്വയം ബന്ധിച്ചിട്ടുള്ളതെല്ലാം—അവളുടെമേൽ നിലനിൽക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവൾക്ക് ബാധകമായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: നേർച്ച
  rationale: ദൈവത്തോടു ചെയ്യുന്ന മതപരവും നിയമപരവുമായ പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പദം.
- source_word: אַלְמָנָה
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ആധുനിക മലയാളപദം.
- source_word: גְרוּשָׁה
  choice: വിവാഹമോചിതയായ സ്ത്രീ
  rationale: അയച്ചുകളയപ്പെട്ട അഥവാ വിവാഹബന്ധം വേർപെടുത്തപ്പെട്ട സ്ത്രീ എന്ന നിഷ്ക്രിയരൂപത്തിന്റെ നിയമപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כֹּל אֲשֶׁר
  choice: എല്ലാം
  rationale: ആദ്യത്തെ ‘നേർച്ച’ എന്ന പദത്തിനു പുറമേ സ്വയം ഏറ്റെടുത്ത ഏതു ബാധ്യതയും ഉൾക്കൊള്ളുന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: אָסְרָה
  choice: ബന്ധിച്ചിട്ടുള്ളത്
  rationale: സ്വന്തംമേൽ ബാധ്യത ചുമത്തുക എന്ന അർഥത്തോടൊപ്പം എബ്രായത്തിലെ ‘ബന്ധിക്കുക’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: עַל נַפְשָׁהּ
  choice: സ്വയം
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെ ജീവൻ/സ്വയംമേൽ’ എന്ന ആശയം സ്വാഭാവികമായ പ്രത്യാവർത്തക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: יָקוּם
  choice: നിലനിൽക്കും
  rationale: നിയമസന്ദർഭത്തിലെ ‘പ്രാബല്യത്തിൽ നിൽക്കുക, സാധുവായിരിക്കുക’ എന്ന അർഥവും മൂലഭാഷയിലെ ‘നിൽക്കുക’ എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: עָלֶיהָ
  choice: അവളുടെമേൽ
  rationale: ബാധ്യത അവളുടെമേൽ നിലകൊള്ളുന്നു എന്ന എബ്രായപ്രയോഗം സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ നിയമപരമായ ബാധ്യതയുടെ ഭാവവും നൽകുന്നു.
