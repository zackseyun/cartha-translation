translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമഭാവം നിലനിർത്തിക്കൊണ്ട് എബ്രായത്തിലെ ‘ബന്ധിക്കുക’, ‘മേൽ നിൽക്കുക’ എന്നീ രൂപകങ്ങൾ കഴിയുന്നത്ര സംരക്ഷിച്ചിട്ടുണ്ട്.
