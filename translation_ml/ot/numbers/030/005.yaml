  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: ml
  text: അവളുടെ പിതാവ് അവളുടെ നേർച്ചയും അവൾ സ്വയം ചുമത്തിയ ബന്ധനബാധ്യതയും[a] കേൾക്കുകയും അവളോട് മൗനം പാലിക്കുകയും ചെയ്താൽ[b], അവളുടെ എല്ലാ നേർച്ചകളും നിലനിൽക്കും; അവൾ സ്വയം ചുമത്തിയ ഓരോ ബന്ധനബാധ്യതയും നിലനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ബന്ധനബാധ്യത’ എബ്രായത്തിലെ אִסָּר എന്ന പദത്തിന്റെ വിവർത്തനമാണ്. ഇത് ‘നേർച്ച’യിൽനിന്ന് വ്യത്യസ്തമായെങ്കിലും അതുമായി അടുത്ത ബന്ധമുള്ള, ഒരാൾ സ്വയം ചുമത്തുന്ന വിലക്കിനെയോ ബാധ്യതയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവളുടെ പിതാവ് അവളോട് മൗനം പാലിച്ചാൽ.’ ഇവിടെ മൗനം എതിർപ്പില്ലായ്മയെ സൂചിപ്പിക്കുന്നതിനാൽ അവളുടെ നേർച്ചകളും ബന്ധനബാധ്യതകളും പ്രാബല്യത്തിൽ തുടരുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: അവളുടെ നേർച്ച / അവളുടെ എല്ലാ നേർച്ചകളും
  rationale: നדר എന്നത് ഈ നിയമപരവും ആരാധനാസംബന്ധവുമായ സന്ദർഭത്തിൽ ദൈവത്തോടു ചെയ്യുന്ന നേർച്ചയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നേർച്ച’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֱסָרָהּ / אִסָּר
  choice: ബന്ധനം
  rationale: אִסָּר സ്വയം ചുമത്തുന്ന വിലക്കിനെയോ നിർബന്ധബാധ്യതയെയോ സൂചിപ്പിക്കുന്നു. ‘ബന്ധനം’ എന്നത് ‘നേർച്ച’യിൽനിന്നുള്ള പദവ്യത്യാസവും എബ്രായത്തിലെ ബന്ധിക്കുക എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: അവൾ സ്വയം ഏറ്റെടുത്ത
  rationale: അക്ഷരാർഥത്തിലെ ‘തന്റെമേൽ ബന്ധിച്ചു’ എന്ന സ്വയം ബാധ്യതപ്പെടുത്തുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘ബന്ധനം’ എന്ന നാമത്തോടൊപ്പം അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: അവളോട് മൗനം പാലിച്ചാൽ
  rationale: പിതാവ് പ്രതികരിക്കാതെ മൗനം പാലിക്കുന്നതിനെ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വ്യവസ്ഥാർഥം മലയാളത്തിൽ ‘-ആൽ’ രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְקָמוּ ... יָקוּם
  choice: നിലനിൽക്കും
  rationale: קום എന്ന ക്രിയയുടെ നിയമപരമായ ‘പ്രാബല്യത്തിൽ തുടരുക’ എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כָּל
  choice: എല്ലാ / ഓരോ
  rationale: ബഹുവചനമായ നേർച്ചകളോടൊപ്പം ‘എല്ലാ’ എന്നും ഏകവചന സമാഹാരപ്രയോഗമായ ബന്ധനത്തോടൊപ്പം വിതരണാർഥത്തിൽ ‘ഓരോ’ എന്നും ഉപയോഗിക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പിതാവിന്റെ മൗനത്തിന്റെ നിയമപരമായ ഫലം
  choice: മുഖ്യവാചകത്തിൽ മൗനം മാത്രം വിവർത്തനം ചെയ്ത്, അതിന്റെ എതിർപ്പില്ലായ്മ എന്ന നിയമഫലം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: ‘അവളുടെ അപ്പൻ എതിർപ്പൊന്നും പറഞ്ഞില്ലെങ്കിൽ’ എന്ന് വ്യാഖ്യാനാത്മകമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഉറവിടവാചകം മൗനത്തെ നേരിട്ട് പറയുന്നു; അതിന്റെ നിയമഫലം സന്ദർഭത്തിൽ വ്യക്തമായിരുന്നാലും മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനം ചേർക്കാതെ ഉറവിടത്തിന്റെ രൂപവും നിയമപരമായ ഉത്കണ്ഠയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ള നിയമശൈലി സ്വീകരിച്ചു. ‘അപ്പൻ’ കുടുംബബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ‘മൗനം പാലിക്കുക’, ‘നിലനിൽക്കുക’ എന്നിവ ഉറവിടത്തിന്റെ ഔപചാരികതയും നിയമബലവും കാത്തുസൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
