revisions:
- from: എന്നാൽ അവളുടെ ഭർത്താവ് അതു കേൾക്കുന്ന ദിവസം അവളെ വിലക്കുകയും, അവളുടെമേലുള്ള നേർച്ചയെയോ അവൾ സ്വയം ബന്ധിച്ച അധരങ്ങളുടെ ഉച്ചാരണത്തെയോ[a] അസാധുവാക്കുകയും ചെയ്താൽ, യഹ്‌വെ അവളോടു ക്ഷമിക്കും.
  to: എന്നാൽ, അവളുടെ ഭർത്താവ് അതു കേൾക്കുന്ന ദിവസം അവളെ വിലക്കുകയും അവളുടെമേലുള്ള നേർച്ചയും അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട, അവൾ സ്വയം ബാധ്യത ഏറ്റെടുത്ത വാക്കും[a] അസാധുവാക്കുകയും ചെയ്താൽ, യഹ്‌വെ അവളെ ക്ഷമിക്കും.
  rationale: Revision restores the Hebrew conjunction between the vow and the spoken self-binding obligation, replaces an awkward literal Malayalam expression with idiomatic modern wording, and makes explicit that the self-binding description modifies the spoken utterance. The footnote preserves the disputed nuance of מִבְטָא without imposing it on the main text.
