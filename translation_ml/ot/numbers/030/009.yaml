  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: ml
  text: എന്നാൽ, അവളുടെ ഭർത്താവ് അതു കേൾക്കുന്ന ദിവസം അവളെ വിലക്കുകയും അവളുടെമേലുള്ള നേർച്ചയും അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട, അവൾ സ്വയം ബാധ്യത ഏറ്റെടുത്ത വാക്കും[a] അസാധുവാക്കുകയും ചെയ്താൽ, യഹ്‌വെ അവളെ ക്ഷമിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട അവിവേകമായ വാക്ക്” അല്ലെങ്കിൽ “അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട ബന്ധനകരമായ വാക്ക്.”
    reason: מִבְטָא שְׂפָתֶיהָ എന്ന പ്രയോഗം സാധാരണയായി അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട വാക്കിനെ സൂചിപ്പിക്കുന്നു; ഈ നേർച്ചാസന്ദർഭത്തിൽ അതിന് അവിവേകമായതോ സ്വയം ബാധ്യതപ്പെടുത്തുന്നതോ ആയ വാക്ക് എന്ന ന്യൂവൻസും ഉണ്ടായേക്കാം.
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻസാഹചര്യത്തോടുള്ള വ്യത്യാസവും വ്യവസ്ഥാസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּיוֹם שְׁמֹעַ אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ് അതു കേൾക്കുന്ന ദിവസം
  rationale: בְּיוֹם שְׁמֹעַ എന്ന കാലസൂചക പ്രയോഗവും നിയമപരമായ സന്ദർഭത്തിൽ אִישָׁהּ എന്നതിന്റെ ‘ഭർത്താവ്’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: יָנִיא אֹתָהּ
  choice: അവളെ വിലക്കുകയും
  rationale: നേർച്ച പ്രാബല്യത്തിൽ വരുന്നത് തടയുക എന്ന ഹിഫീൽ ക്രിയയുടെ നിയമപരമായ ബലം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וְהֵפֵר
  choice: അസാധുവാക്കുകയും
  rationale: നേർച്ചയെ കേവലം ‘ലംഘിക്കുക’ എന്നല്ല, അതിന്റെ ബാധ്യത ഇല്ലാതാക്കുക എന്ന നിയമാർഥം വ്യക്തമാക്കുന്നു.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: അവളുടെമേലുള്ള നേർച്ചയെ
  rationale: ബാധ്യത അവളുടെ ‘മേൽ’ ഇരിക്കുന്നു എന്ന എബ്രായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: അധരങ്ങളുടെ ഉച്ചാരണത്തെ
  rationale: מִבְטָא എന്ന പദത്തിൽ ‘അവിവേകമായ’ എന്ന ന്യൂവൻസ് ഉറപ്പല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ നിഷ്പക്ഷമായ അർഥം നിലനിർത്തി സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: അവൾ സ്വയം ബന്ധിച്ച
  rationale: സ്വന്തംമേൽ ബാധ്യത ഏൽപ്പിക്കുക എന്ന പ്രയോഗത്തിന്റെ പ്രതിഫലനപരവും നിയമപരവുമായ ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יִסְלַח לָהּ
  choice: അവളോടു ക്ഷമിക്കും
  rationale: סלח എന്നതിന്റെ ക്ഷമിക്കുക എന്ന നിയമ-ഉടമ്പടി അർഥവും പ്രസ്താവനയുടെ ഭാവികാലഫലവും നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമം സ്ഥാനപ്പേരായി മറയ്ക്കാതെ, മലയാളത്തിൽ പരിചിതവും ഉച്ചാരണസൗകര്യമുള്ളതുമായ രൂപത്തിൽ നൽകുന്നു.
- issue: מִבְטָא שְׂפָתֶיהָ എന്നതിലെ നൈതിക ന്യൂവൻസ്
  choice: അധരങ്ങളുടെ ഉച്ചാരണം
  alternative: അധരങ്ങളുടെ അവിവേകമായ ഉച്ചാരണം; ബന്ധനകരമായ ഉച്ചാരണം
  rationale: ‘അവിവേകമായ’ എന്ന ന്യൂവൻസ് സാധ്യതയുള്ളതാണെങ്കിലും പദത്തിൽ നിർബന്ധിതമല്ല; അതിനാൽ മുഖ്യപാഠം അവ്യക്തത സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് വ്യത്യസ്ത സാധ്യതകൾ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമപരമായ ആശയങ്ങൾക്ക് ‘വിലക്കുക’, ‘അസാധുവാക്കുക’ എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; എബ്രായത്തിലെ ബാധ്യതയുടെ ‘മേൽ’ എന്ന രൂപകം നിലനിർത്തി.
