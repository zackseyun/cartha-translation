  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: ml
  text: എന്നാൽ, അവളുടെ അപ്പൻ അതിനെക്കുറിച്ചു കേൾക്കുന്ന ദിവസം അവളെ വിലക്കിയാൽ, അവളുടെ നേർച്ചകളൊന്നും, അവൾ സ്വയം ഏറ്റെടുത്ത ബാധ്യതകളൊന്നും[a] നിലനിൽക്കുകയില്ല[b]. അവളുടെ അപ്പൻ അവളെ വിലക്കിയതുകൊണ്ട് യഹോവ അവളോടു ക്ഷമിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബന്ധിക്കുന്ന പ്രതിജ്ഞകൾ’ അല്ലെങ്കിൽ ‘ബന്ധനങ്ങൾ.’ എബ്രായപദം, പ്രത്യേകിച്ച് നേർച്ചകളുടെ സന്ദർഭത്തിൽ, ഒരാൾ സ്വയം ഏറ്റെടുക്കുന്ന ബന്ധിതമായ ബാധ്യതകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പ്രാബല്യത്തിൽ വരുകയില്ല.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘നിലനിൽക്കുകയില്ല’ എന്നാണ്; നേർച്ചകളും ബാധ്യതകളും ബാധകമായി അംഗീകരിക്കപ്പെടുകയില്ല എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻസാഹചര്യത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הֵנִיא
  choice: വിലക്കുക
  rationale: നേർച്ചയെ എതിർത്ത് അതിന്റെ ബാധകത തടയുന്ന പിതാവിന്റെ പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അതേസമയം എബ്രായവാക്യത്തിലെ നേരിട്ടുള്ള കർമമായ മകളെയും നിലനിർത്തുന്നു.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: അതു കേൾക്കുന്ന ദിവസം
  rationale: നിയമപരമായി പ്രാധാന്യമുള്ള അതേ ദിവസമെന്ന സമയനിർണ്ണയം സംരക്ഷിക്കുന്നു.
- source_word: כָּל נְדָרֶיהָ
  choice: അവളുടെ നേർച്ചകളൊന്നും
  rationale: എബ്രായത്തിലെ ‘അവളുടെ എല്ലാ നേർച്ചകളും ... ഇല്ല’ എന്ന നിഷേധവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘ഒന്നും ... ഇല്ല’ എന്ന് നൽകിയിരിക്കുന്നു.
- source_word: וֶאֱסָרֶיהָ
  choice: ബന്ധനബാധ്യതകൾ
  rationale: സ്വയം ഏറ്റെടുക്കുന്ന, വ്യക്തിയെ ബന്ധിക്കുന്ന പ്രതിജ്ഞാബാധ്യതകളെയാണ് നാമം സൂചിപ്പിക്കുന്നത്; നിയമപരമായ ശക്തിയും ‘ബന്ധിക്കുക’ എന്ന മൂലചിത്രവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: അവൾ സ്വയം ബന്ധിച്ച
  rationale: സ്വന്തംമേൽ ബാധ്യത ചുമത്തുന്ന പ്രതിബിംബാർഥം ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: לֹא יָקוּם
  choice: നിലനിൽക്കുകയില്ല
  rationale: അക്ഷരാർഥമായ ‘നിൽക്കുകയില്ല’ എന്ന രൂപകവും നേർച്ചകൾ നിയമപരമായി പ്രാബല്യത്തിൽ തുടരില്ലെന്ന അർഥവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יִסְלַח לָהּ
  choice: അവളോടു ക്ഷമിക്കും
  rationale: സלח എന്ന ക്രിയയുടെ വ്യക്തിയോടുള്ള ക്ഷമ എന്ന സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: כִּי
  choice: '...തുകൊണ്ട്'
  rationale: പിതാവിന്റെ വിലക്കാണ് പിന്നാലെയുള്ള ക്ഷമാപ്രസ്താവത്തിന് വാക്യം നൽകുന്ന കാരണം എന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: റദ്ദാക്കപ്പെട്ട നേർച്ചകളുടെ പശ്ചാത്തലത്തിലെ ദൈവിക ക്ഷമ
  choice: പിതാവിന്റെ സമയോചിതമായ വിലക്കിനെ തുടർന്ന് യഹോവ അവളോടു ക്ഷമിക്കും എന്ന വാക്യത്തിന്റെ പ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: നിറവേറ്റപ്പെടാത്ത നേർച്ച മൂലമുള്ള ഏതൊരു പാപത്തിനുമുള്ള വിശാലമായ പാപമോചനമായി ഇത് വിശദീകരിക്കുക.
  rationale: ഉടൻ വരുന്ന നിയമസന്ദർഭം നേർച്ചയുടെ ബാധകതയെക്കുറിച്ചാണ്. ക്ഷമയുടെ കൃത്യമായ ധാർമ്മികമോ നിയമപരമോ ആയ വ്യാപ്തി വാക്യം വിശദീകരിക്കാത്തതിനാൽ പരിഭാഷ അതിനെ ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അപ്പൻ’ എന്ന സാധാരണവും മാന്യവുമായ രൂപം നിലനിർത്തി; ‘ബന്ധനബാധ്യതകൾ’ എന്ന പദസംയോജനം അപരിചിതമായ എബ്രായ നിയമപദത്തിന്റെ ബന്ധിപ്പിക്കുന്ന ശക്തി വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള footnote markers വിഷയങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, [a] ബന്ധനബാധ്യതകൾക്കു ശേഷവും [b] നിലനിൽക്കുകയില്ല എന്നതിനുശേഷവും ഉറവിടാർഥത്തിന് അനുസരിച്ച് സ്ഥാപിച്ചു.
