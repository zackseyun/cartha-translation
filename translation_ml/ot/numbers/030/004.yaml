id: NUM.30.4
reference: Numbers 30:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: ml
  text: ഒരു സ്ത്രീ തന്റെ യൗവനത്തിൽ, പിതാവിന്റെ വീട്ടിൽവെച്ച്, യാഹ്‌വെയ്ക്ക് ഒരു നേർച്ച നേർന്ന്[a] ഒരു ബാധ്യതയാൽ സ്വയം ബന്ധിച്ചാൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘നേർച്ച നേർന്നു’ എന്നപോലെ ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന ഔപചാരിക പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഒരു ബന്ധനത്താൽ സ്വയം ബന്ധിച്ചാൽ’; സ്വയം നിർബന്ധിതയാക്കുന്ന പ്രതിജ്ഞയെയോ ബാധ്യതയെയോ ഇത് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: ഒരു സ്ത്രീ … ചെയ്താൽ
  rationale: നിയമപരമായ ഒരു സാങ്കൽപ്പിക സാഹചര്യം അവതരിപ്പിക്കുന്ന ഘടനയാണ് ഇത്. മലയാളത്തിൽ വ്യവസ്ഥ സൂചിപ്പിക്കുന്ന ‘ചെയ്താൽ’ എന്ന രൂപം വാക്യാവസാനത്ത് നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: תִדֹּר נֶדֶר
  choice: ഒരു നേർച്ച നേർന്ന്
  rationale: ക്രിയയും അതേ ധാതുവിൽനിന്നുള്ള നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരിക ഊന്നൽ മലയാളത്തിലെ ‘നേർച്ച നേർന്നു’ എന്ന സ്വാഭാവിക പദസംയോജനം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യാഹ്‌വെയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ ‘യാഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്ത് ലക്ഷ്യസൂചകമായ ദത്തിവിഭക്തി ചേർത്തിരിക്കുന്നു.
- source_word: וְאָסְרָה אִסָּר
  choice: ഒരു ബാധ്യതയാൽ സ്വയം ബന്ധിച്ചാൽ
  rationale: ബന്ധിക്കുക എന്ന ക്രിയാത്മക രൂപകവും സ്വയം ഏറ്റെടുക്കുന്ന നിർബന്ധത്തിന്റെ നിയമപരമായ അർഥവും നിലനിർത്തുന്നു; നേർച്ചയെയും ഈ ബാധ്യതയെയും ഒരേ പദമാക്കി ലയിപ്പിക്കുന്നില്ല.
- source_word: בְּבֵית אָבִיהָ
  choice: പിതാവിന്റെ വീട്ടിൽവെച്ച്
  rationale: സംഭവത്തിന്റെ ഗൃഹപരമായ പശ്ചാത്തലം നേരിട്ട് സൂചിപ്പിക്കുന്നു; പിതാവിന്റെ അധികാരത്തെക്കുറിച്ച് മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: בִּנְעֻרֶיהָ
  choice: തന്റെ യൗവനത്തിൽ
  rationale: പ്രായഘട്ടത്തെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ‘അവിവാഹിതയായിരിക്കുമ്പോൾ’ എന്ന സാഹചര്യനിഗമനം പാഠത്തിൽ ചേർക്കാതെ വിടുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മറയ്ക്കാതെ, ഹീബ്രു ഉച്ചാരണത്തിന്റെ സാധാരണ പണ്ഡിതപുനർനിർമാണത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: בִּנְעֻרֶיהָ എന്നതിൽ വിവാഹസ്ഥിതി ഉൾപ്പെടുത്തണമോ
  choice: തന്റെ യൗവനത്തിൽ
  alternative: അവിവാഹിതയായി പിതാവിന്റെ അധികാരത്തിൻ കീഴിലിരിക്കുമ്പോൾ
  rationale: സന്ദർഭം അവിവാഹിതാവസ്ഥയെയും പിതൃഗൃഹത്തിലെ നിയമബന്ധത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, ഈ പദം നേരിട്ട് പറയുന്നത് യൗവനകാലമാണ്. അതിനാൽ വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. തുടർന്നുള്ള വാക്യവുമായി ബന്ധപ്പെടുന്ന വ്യവസ്ഥാവാക്യമാകുന്നതിനാൽ അവസാനത്തിലെ അൽപവിരാമം നിലനിർത്തി. ‘നേർച്ച’യും ‘ബാധ്യത’യും വേർതിരിച്ച് മൂലപാഠത്തിലെ נֶדֶר / אִסָּר വ്യത്യാസം സംരക്ഷിച്ചു.
