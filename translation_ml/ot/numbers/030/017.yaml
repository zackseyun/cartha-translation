source:
  edition: WLC
  text: אֵ֣לֶּה הַֽ/חֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִשְׁתּ֑/וֹ בֵּֽין אָ֣ב לְ/בִתּ֔/וֹ בִּ/נְעֻרֶ֖י/הָ בֵּ֥ית אָבִֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: ml
  text: 'യാഹ്‌വേ മോശെയോടു കല്പിച്ച ചട്ടങ്ങൾ ഇവയാണ്: ഭർത്താവും അവന്റെ ഭാര്യയും തമ്മിലുള്ള കാര്യങ്ങളെയും, ഒരു പിതാവും അവന്റെ വീട്ടിൽ യൗവനകാലത്ത് കഴിയുന്ന മകളും തമ്മിലുള്ള കാര്യങ്ങളെയും സംബന്ധിച്ച ചട്ടങ്ങൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֻקִּים
  choice: ചട്ടങ്ങൾ
  rationale: നിയമപരമായി നിശ്ചയിക്കപ്പെട്ട വ്യവസ്ഥകൾ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരുരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: ഭർത്താവും ഭാര്യയും തമ്മിലുള്ള കാര്യങ്ങളിൽ
  rationale: ഇവിടെ אִישׁ ഭാര്യയോടുള്ള ബന്ധത്തിൽ ഉപയോഗിക്കുന്നതിനാൽ ‘ഭർത്താവ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; בֵּין എന്നതിന്റെ ബന്ധപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: בִּנְעֻרֶיהָ
  choice: മകളുടെ യൗവനകാലത്ത്
  rationale: പെൺകുട്ടിയുടെ യുവപ്രായത്തെ സൂചിപ്പിക്കുന്ന കാലപരമായ അർഥം അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: בֵּית אָבִיהָ
  choice: പിതാവിന്റെ വീട്ടിൽ കഴിയുന്ന
  rationale: വെറും കെട്ടിടത്തെക്കാൾ പിതൃഗൃഹത്തിലെ താമസസാഹചര്യമാണ് ഇവിടെ പ്രസക്തമെന്നത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുകയും മലയാള വായനക്കാർക്കു പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- issue: אִישׁ എന്ന ബന്ധപദത്തിന്റെ അർഥം
  choice: ഭർത്താവ്
  alternative: പുരുഷൻ
  rationale: ‘അവന്റെ ഭാര്യ’ എന്ന സമാന്തരബന്ധം ഇവിടെ ഭർത്താവിനെ ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നു; നിയമപരമായ ലിംഗ-ബന്ധ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: בֵּין എന്ന പദത്തിന്റെ നിയമപരമായ പ്രയോഗം
  choice: തമ്മിലുള്ള കാര്യങ്ങളിൽ
  alternative: തമ്മിൽ
  rationale: നിയമങ്ങൾ വ്യക്തികൾക്കിടയിലെ ബന്ധസാഹചര്യങ്ങളെ സംബന്ധിക്കുന്നുവെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിയമസംഗ്രഹ ശൈലി. വാക്യത്തിന്റെ രണ്ടു സമാന്തര ബന്ധഘടനകളും നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ബാധകമായ’ എന്ന പദം ചേർത്തിരിക്കുന്നു.
