id: NUM.30.14
reference: Numbers 30:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: ml
  text: സ്വയം പീഡിപ്പിക്കാനുള്ള എല്ലാ നേർച്ചയും എല്ലാ ബന്ധിപ്പിക്കുന്ന ശപഥവും അവളുടെ ഭർത്താവിന് അത് സ്ഥിരീകരിക്കാം; അവളുടെ ഭർത്താവിന് അത് റദ്ദാക്കുകയും ചെയ്യാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വയം നിഷേധിക്കാനുള്ള” അല്ലെങ്കിൽ “സ്വയം താഴ്ത്താനുള്ള.” എബ്രായ ശൈലിയിൽ പദശഃ, “ആത്മാവിനെ പീഡിപ്പിക്കുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: നേർച്ച
  rationale: ദൈവത്തോടോ വിശുദ്ധ ബാധ്യതയുടെ കീഴിലോ ചെയ്യുന്ന പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്ന ഈ പദത്തിന് നിയമപരവും ആരാധനാസംബന്ധവുമായ സന്ദർഭത്തിൽ ‘നേർച്ച’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: שְׁבֻעַת אִסָּר
  choice: ബന്ധനശപഥം
  rationale: ‘ശപഥം’ എന്ന ആശയത്തോടൊപ്പം നിയന്ത്രിക്കുന്നതോ ബാധ്യതപ്പെടുത്തുന്നതോ ആയ אִסָּר എന്ന പദത്തിന്റെ ശക്തിയും ഈ സംയുക്തപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: സ്വയം പീഡിപ്പിക്കാനുള്ള
  rationale: പദശഃ ‘ജീവനെ/സ്വത്വത്തെ പീഡിപ്പിക്കുക’ എന്ന എബ്രായ ശൈലി ഉപവാസം പോലുള്ള ആത്മനിഷേധത്തെ സൂചിപ്പിക്കാം. മലയാളത്തിൽ അർഥഗ്രാഹ്യതയ്ക്കായി ‘സ്വയം പീഡിപ്പിക്കുക’ എന്നു നൽകി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: נָפֶשׁ
  choice: സ്വയം
  rationale: ഈ സ്ഥിരശൈലിയിൽ נֶפֶשׁ എന്നത് വേർതിരിച്ച ഒരു ‘ആത്മാവ്’ എന്നതിലുപരി വ്യക്തിയുടെ സ്വത്വത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘സ്വയം’ യോജിക്കുന്നു.
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: വിവാഹനിയമത്തിന്റെ ഈ സന്ദർഭത്തിൽ אִישׁ എന്ന പദവും സ്ത്രീലിംഗ ഏകവചന ഉടമസ്ഥപ്രത്യയവും ചേർന്ന് വ്യക്തമായി ‘അവളുടെ ഭർത്താവ്’ എന്നാണ് അർഥം.
- source_word: יְקִימֶנּוּ
  choice: സ്ഥിരീകരിക്കുകയോ
  rationale: קום എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം നേർച്ചയെ പ്രാബല്യത്തിൽ നിർത്തുക, സാധുവായി ഉറപ്പിക്കുക എന്ന നിയമപരമായ അർഥമാണ് ഇവിടെ നൽകുന്നത്.
- source_word: יְפֵרֶנּוּ
  choice: റദ്ദാക്കുകയോ ചെയ്യാം
  rationale: פרר എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം നേർച്ചയെ അസാധുവാക്കുക എന്ന നിയമപരമായ ശക്തിയുള്ളതിനാൽ ‘റദ്ദാക്കുക’ വ്യക്തവും ആധുനികവുമാണ്.
- source_word: כָּל ... וְכָל
  choice: എല്ലാ ... എല്ലാ ...
  rationale: ആവർത്തിച്ചുള്ള כָּל രണ്ടു വിഭാഗങ്ങളെയും സമഗ്രമായി ഉൾക്കൊള്ളുന്നു; മലയാളത്തിൽ ‘എല്ലാ’ എന്ന ആവർത്തനം ആ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְעַנֹּת נָפֶשׁ എന്ന ശൈലിയുടെ വ്യാഖ്യാനം
  choice: പ്രധാനവാചകത്തിൽ ‘സ്വയം പീഡിപ്പിക്കുക’
  alternative: ‘സ്വയം നിഷേധിക്കുക’ അല്ലെങ്കിൽ ‘സ്വയം താഴ്ത്തുക’
  rationale: എബ്രായത്തിലെ കഠിനമായ ശൈലിചിത്രം പൂർണമായി മായിക്കാതെ മലയാളത്തിൽ ഗ്രാഹ്യമാക്കുകയും, ഉപവാസം/ആത്മനിഷേധം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകൾക്ക് ‘സ്ഥിരീകരിക്കുക’, ‘റദ്ദാക്കുക’ എന്നീ വ്യക്തമായ നിയമപരമായ പദങ്ങൾ നൽകി. അടിക്കുറിപ്പ് സൂചകം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തി.
