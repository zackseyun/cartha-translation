source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: ml
  text: യാഹ്‌വേ മോശയോടു കൽപ്പിച്ച സകലത്തിനും അനുസൃതമായി മോശ ഇസ്രായേലിന്റെ പുത്രന്മാരോടു സംസാരിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ‘ഇസ്രായേൽമക്കൾ’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇത് ഹീബ്രുവിലെ പതിവായ ഉടമ്പടി-ദേശീയ സംജ്ഞയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: സംസാരിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും നേരിട്ടുള്ള ഉദ്ധരണിയില്ലാതെ പ്രസംഗത്തിന്റെ സംഗ്രഹം നൽകുന്ന ഈ സന്ദർഭത്തിൽ ‘ഇസ്രായേൽമക്കളോടു സംസാരിച്ചു’ എന്നത് സ്വാഭാവികവും പ്രസംഗക്രിയയെ കൃത്യമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്. എന്നാൽ മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും ‘ഇസ്രായേൽമക്കൾ’ എന്നത് ഈ സ്ഥിരമായ ദേശീയ-ഉടമ്പടിനാമത്തെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുകയും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כְּכֹל אֲשֶׁר
  choice: സകലത്തിനും അനുസൃതമായി
  rationale: ആമുഖത്തിലെ כְּ ഉപസർഗം വെറും ഉള്ളടക്കമല്ല, അനുരൂപതയോ ഒത്തുപോക്കോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘സകലത്തിനും അനുസൃതമായി’ എന്ന പരിഭാഷ ഈ ബന്ധം നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: ഹീബ്രു perfect രൂപം യഹോവയുടെ കല്പന മോശയുടെ സംസാരത്തിനു മുമ്പുണ്ടായതായി സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ ബന്ധകക്രിയാരൂപമായ ‘കല്പിച്ച’ ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു നൽകുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: אֶת മോശയെ צִוָּה എന്ന ക്രിയയുടെ കർമമായി അടയാളപ്പെടുത്തുന്നു. ‘കല്പിക്കുക’ എന്ന മലയാളക്രിയയോടൊപ്പം വ്യക്തിയെ ‘-ഓടു’ വിഭക്തിയിൽ നൽകുന്നതാണ് സ്വാഭാവികം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തി പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കുന്നില്ല. ഉച്ചാരണത്തിന്റെ പുനർനിർമാണത്തിൽ പൂർണനിശ്ചയമില്ലാത്തതിനാൽ മലയാളത്തിൽ സ്ഥിരപരിചയമുള്ള ‘യഹോവ’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടി-ദേശീയ സംജ്ഞ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രു രൂപം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ഇത് ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരസംജ്ഞയാണ്. മലയാളത്തിലെ ‘ഇസ്രായേൽമക്കൾ’ മൂലരൂപത്തിന്റെ കുടുംബബന്ധചിത്രം നിലനിർത്തിക്കൊണ്ട് സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന ദേശീയസമൂഹം എന്ന പ്രവർത്തനാർഥവും സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന ശൈലി. ‘കല്പിച്ച സകലത്തിനും അനുസൃതമായി’ എന്ന ക്രമം ഹീബ്രുവിലെ അനുരൂപതയുടെ ആശയം നിലനിർത്തുന്നു. ദൈവനാമം പദവിയാൽ പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി നൽകിയിരിക്കുന്നു.
