  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: ml
  text: എന്നാൽ, അവയെക്കുറിച്ച് കേട്ടശേഷം അവൻ അവയെ തീർച്ചയായും റദ്ദാക്കുകയാണെങ്കിൽ[a], അവളുടെ കുറ്റം അവൻ വഹിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തീർച്ചയായും റദ്ദാക്കുകയാണെങ്കിൽ’ അല്ലെങ്കിൽ ‘പൂർണമായി അസാധുവാക്കുകയാണെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിൽ ഊന്നലിനായി ഒരു ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടിനോടൊപ്പം ഒരു ക്രിയാരൂപം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവളുടെ കുറ്റം വഹിക്കണം’ എന്നത് ‘അവളുടെ അകൃത്യത്തിനുള്ള ഉത്തരവാദിത്വം വഹിക്കണം’ എന്നോ ‘അവളുടെ കുറ്റത്തിനുള്ള ശിക്ഷ വഹിക്കണം’ എന്നോ മനസ്സിലാക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻവാക്യത്തോടുള്ള വ്യവസ്ഥാപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָפֵר יָפֵר
  choice: റദ്ദാക്കുകതന്നെ ചെയ്താൽ
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; നേർച്ചകൾ അസാധുവാക്കുന്ന നിയമസന്ദർഭത്തിന് ‘റദ്ദാക്കുക’ യോജിക്കുന്നു.
- source_word: אֹתָם
  choice: അവ
  rationale: സമീപസന്ദർഭത്തിലെ സ്ത്രീയുടെ നേർച്ചകളെയും ബാധ്യതകളെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം നിലനിർത്തുന്നു.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: അവയെക്കുറിച്ച് കേട്ടശേഷം
  rationale: കേട്ടതിനുശേഷമുള്ള നടപടിയെന്ന കാലക്രമവും, നേർച്ചകളെപ്പറ്റി അറിഞ്ഞുവെന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְנָשָׂא
  choice: അവൻ വഹിക്കണം
  rationale: നിയമ-ധാർമിക ഫലത്തെ സൂചിപ്പിക്കുന്ന נשׂא എന്ന ക്രിയയുടെ ‘വഹിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: עֲוֺנָהּ
  choice: അവളുടെ കുറ്റം
  rationale: עָוֹן എന്ന പദത്തിലെ കുറ്റം, കുറ്റബാധ്യത, ശിക്ഷാഫലം എന്നീ സാധ്യതകളെ അമിതമായി നിർവചിക്കാതെ ‘കുറ്റം’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: നിയമസന്ദർഭത്തിൽ ‘അവളുടെ കുറ്റം വഹിക്കുക’ എന്നതിന്റെ അർഥം
  choice: ഭർത്താവ് അവളുടെ കുറ്റം വഹിക്കണം എന്ന എബ്രായ പ്രയോഗം നേരിട്ട് നിലനിർത്തി.
  alternative: അവളുടെ അകൃത്യത്തിനുള്ള ഉത്തരവാദിത്വം വഹിക്കണം; അവളുടെ കുറ്റത്തിനുള്ള ശിക്ഷ വഹിക്കണം.
  rationale: נשׂא עון എന്ന പ്രയോഗത്തിന് കുറ്റബാധ്യതയോ അതിന്റെ ശിക്ഷാഫലമോ സൂചിപ്പിക്കാനാകും. വൈകിയുള്ള റദ്ദാക്കൽ ഭർത്താവിന്മേൽ ഉത്തരവാദിത്വം വരുത്തുന്നു; എന്നാൽ ശിക്ഷയുടെ കൃത്യസ്വഭാവം വാക്യം വ്യക്തമാക്കാത്തതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘റദ്ദാക്കുകതന്നെ’ എബ്രായ ഊന്നൽ പ്രകടമാക്കുന്നു; ‘കുറ്റം വഹിക്കുക’ എന്ന മൂലഭാഷാ രൂപകം വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവെക്കുന്നു.
