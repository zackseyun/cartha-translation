id: NUM.30.13
reference: Numbers 30:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: ml
  text: എന്നാൽ അവളുടെ ഭർത്താവ് അവയെക്കുറിച്ചു കേൾക്കുന്ന ദിവസംതന്നെ അവയെ തീർച്ചയായും അസാധുവാക്കുന്നുവെങ്കിൽ, അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടതൊന്നും[a]—അവളുടെ നേർച്ചകളോ അവൾ സ്വയം ബന്ധിച്ച ബാധ്യതയോ[b]—നിലനിൽക്കുകയില്ല. അവളുടെ ഭർത്താവ് അവയെ അസാധുവാക്കിയിരിക്കുന്നു; യഹോവ[c] അവളോടു ക്ഷമിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ട ഏതൊരു വാക്കും.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവളുടെ അധരങ്ങളുടെ എല്ലാ പുറപ്പാടും’; അവൾ വാക്കാൽ ഏറ്റ എല്ലാ പ്രതിബദ്ധതകളെയും ഉൾക്കൊള്ളുന്ന നിയമപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൾ സ്വയം ഏറ്റെടുത്ത ബന്ധനബാധ്യത.’
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ YHWH എന്ന ദൈവനാമം.
    reason: source_name_clarification
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻപുള്ള നിയമസാഹചര്യത്തോടുള്ള വ്യത്യാസവും വ്യവസ്ഥാസ്വഭാവവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הָפֵר יָפֵר
  choice: തീർച്ചയായും അസാധുവാക്കുന്നുവെങ്കിൽ
  rationale: ക്രിയാനാമവും ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നു പ്രകടമാക്കുന്നു; ‘അസാധുവാക്കുക’ നിയമപരമായ പ്രാബല്യം ഇല്ലാതാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אִישָׁהּ
  choice: അവളുടെ ഭർത്താവ്
  rationale: ഈ വിവാഹനിയമസന്ദർഭത്തിൽ ബന്ധത്തെ കൃത്യമായി വ്യക്തമാക്കുന്ന സ്വാഭാവിക പരിഭാഷ.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: അവ കേൾക്കുന്ന ദിവസംതന്നെ
  rationale: ഭർത്താവ് കേട്ട അതേ ദിവസമാണ് നിയമപരമായി പ്രസക്തമെന്ന സമയപരിധി നിലനിർത്തുന്നു.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: അവളുടെ അധരങ്ങളിൽനിന്നു പുറപ്പെട്ടതൊന്നും
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ അധരങ്ങളുടെ എല്ലാ പുറപ്പാടും’; തുടർന്ന് വരുന്ന നിഷേധക്രിയയോടു ചേർന്ന് എല്ലാ വാക്കാലുള്ള പ്രതിബദ്ധതകളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം.
- source_word: לִנְדָרֶיהָ
  choice: അവളുടെ നേർച്ചകൾ
  rationale: മതപരവും നിയമപരവുമായ נדר എന്ന പദത്തിന് പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളസമാനം.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: അവൾ സ്വയം ബന്ധിച്ച ബാധ്യത
  rationale: സ്വന്തംമേൽ ചുമത്തിയ ബന്ധനത്തിന്റെ പ്രതിഫലനാർഥം നിലനിർത്തുകയും മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ പറയുകയും ചെയ്യുന്നു.
- source_word: לֹא יָקוּם
  choice: നിലനിൽക്കുകയില്ല
  rationale: വാക്കാലുള്ള പ്രതിബദ്ധത നിയമപ്രാബല്യത്തിൽ തുടരുകയില്ല എന്ന എബ്രായ നിയമപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: הֲפֵרָם
  choice: അവയെ അസാധുവാക്കിയിരിക്കുന്നു
  rationale: ഭർത്താവിന്റെ നിർണായക നടപടി മൂലം ഉണ്ടായിരിക്കുന്ന ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: וַיהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ നാല് എബ്രായ വ്യഞ്ജനാക്ഷരങ്ങൾ YHWH എന്നതിനെ പേരായി തുറന്നുകാട്ടുന്ന പരിചിതമായ മലയാളരൂപം.
- source_word: יִסְלַח לָהּ
  choice: അവളോടു ക്ഷമിക്കും
  rationale: סלח എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ക്ഷമയുടെ കാരണം സംബന്ധിച്ച് വാക്യത്തിനപ്പുറമുള്ള വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: നേർച്ച അസാധുവാക്കിയശേഷമുള്ള ദൈവിക ക്ഷമയുടെ അർഥം
  choice: ഭർത്താവ് പ്രതിബദ്ധതകൾ അസാധുവാക്കിയതിനാൽ അവ നിലനിൽക്കുകയില്ലെന്നും യഹോവ അവളോടു ക്ഷമിക്കുമെന്നും ഉള്ള വാക്യക്രമം അതേപടി നിലനിർത്തി.
  alternative: നേർച്ച ചെയ്തതിലെ അവിവേകത്തിനുള്ള ക്ഷമയെന്നോ, പാലിക്കാത്തതിനുള്ള കുറ്റബാധ്യതയിൽനിന്നുള്ള വിടുതലെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം ക്ഷമയുടെ കൃത്യമായ കുറ്റവിഷയം വിശദീകരിക്കുന്നില്ല. അതിനാൽ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ബന്ധം സംരക്ഷിച്ചെങ്കിലും അതിലെ യഥാർഥ അനിശ്ചിതത്വം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അസാധുവാക്കുക’, ‘ബാധ്യത’, ‘നിലനിൽക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിയമപ്രാബല്യത്തിന്റെ ആശയം നിലനിർത്തുന്നു; മൂലപാഠത്തിലെ ഊന്നലും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും സംരക്ഷിച്ചിട്ടുണ്ട്.
