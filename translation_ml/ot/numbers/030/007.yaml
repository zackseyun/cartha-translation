  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: ml
  text: എന്നാൽ അവൾ ഒരു പുരുഷനു ഭാര്യയായിത്തീരുകയും[a], അവളുടെ നേർച്ചകളോ, അല്ലെങ്കിൽ അതിലൂടെ അവൾ സ്വയം ബന്ധിച്ച അവളുടെ അധരങ്ങളിൽനിന്നുള്ള ആലോചനയില്ലാത്ത ഒരു ഉച്ചാരണമോ[b] അവളുടെമേൽ ഉണ്ടായിരിക്കുകയും ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ ഒരു പുരുഷനു ഭാര്യയായിരിക്കുകയാണെങ്കിൽ’ / ‘അവൾ ഒരു ഭർത്താവിനെ വിവാഹം കഴിച്ചിരിക്കുകയാണെങ്കിൽ.’ എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം, ‘അവൾ ഒരു പുരുഷനു ആയിരിക്കുന്നു/ആയിത്തീരുന്നു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവളുടെ അധരങ്ങളിൽനിന്നുള്ള ഒരു ഉച്ചാരണം.’ ഈ പ്രയോഗം ഔപചാരികമായ നേർച്ചയിൽനിന്നു വ്യത്യസ്തമായി, ആലോചനയില്ലാതെ പറഞ്ഞ് സ്വയം ഏറ്റെടുത്ത ഒരു ബാധ്യതയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ചെയ്താൽ
  rationale: മുൻനിയമവുമായി ബന്ധം നിലനിർത്തിക്കൊണ്ട് പുതിയൊരു വ്യവസ്ഥാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്ന സംയോജകവും നിബന്ധനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: അവൾ ഒരു പുരുഷന്റെ ഭാര്യയായിത്തീരുകയും
  rationale: היה + לְאִישׁ എന്ന എബ്രായ വിവാഹബന്ധസൂചക പ്രയോഗത്തിന്റെ ആരംഭപരമായ ഭാവം ‘ഭാര്യയായിത്തീരുക’ എന്നു നൽകുന്നു; കേവല ഉടമസ്ഥതാഭാവം ഒഴിവാക്കുന്നു.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: അവളുടെ നേർച്ചകൾ … അവളുടെമേൽ ഉണ്ടായിരിക്കുകയും
  rationale: നേർച്ചയാകുന്ന ബാധ്യത അവളുടെമേൽ നിലകൊള്ളുന്നു എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; അതിന്റെ നിയമസാധുത മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: അവളുടെ അധരങ്ങളിൽനിന്നുള്ള അവിവേകമായ ഒരു വാക്ക്
  rationale: ഔപചാരിക നേർച്ചയിൽനിന്നു വേറിട്ട, വായാൽ ഉച്ചരിച്ച സ്വയംബാധ്യതയെ സൂചിപ്പിക്കുന്നു. ‘അവിവേകമായ’ എന്നത് നേർച്ചാസന്ദർഭത്തിലെ ആവേശപൂർവമായ ഉച്ചാരണത്തിന്റെ സാധ്യതയുള്ള സൂക്ഷ്മത നൽകുന്നു.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: അവൾ തന്നെത്തന്നെ ബന്ധിച്ച
  rationale: വാക്കിനാൽ സ്വന്തം വ്യക്തിക്കുമേൽ ബാധ്യത ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന നിയമപരമായ ‘ബന്ധിക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു; נֶפֶשׁ ഇവിടെ വേറിട്ട ഒരു ‘ആത്മാവ്’ എന്നല്ല, പ്രതിഫലനാർഥത്തിൽ വ്യക്തിയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: നിയമപരമായ നേർച്ചാസന്ദർഭത്തിൽ נֶפֶשׁ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: തന്നെത്തന്നെ
  alternative: തന്റെ പ്രാണനെ / തന്റെ ജീവനെ
  rationale: ഇവിടെ വിഷയം മനുഷ്യഘടനയെക്കുറിച്ചുള്ള ഉപദേശമല്ല, ഒരാൾ സ്വയം ഏറ്റെടുക്കുന്ന ബാധ്യതയാണ്. അതിനാൽ ദേഹത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കുറിച്ചുള്ള ആശയം ഇറക്കുമതി ചെയ്യാതെ എബ്രായ പ്രതിഫലനാർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമഭാഷയാണ് ഉപയോഗിച്ചത്. എബ്രായ വാക്യത്തിന്റെ അപൂർണമായ നിബന്ധനാഘടന നിലനിർത്താൻ വാക്യം കോമയിൽ അവസാനിപ്പിച്ചിരിക്കുന്നു; തുടർന്നുള്ള വാക്യത്തിലാണ് അതിന്റെ ഫലം വരുന്നത്.
