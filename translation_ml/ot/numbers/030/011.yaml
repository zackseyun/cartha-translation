id: NUM.30.11
reference: Numbers 30:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: ml
  text: അവൾ ഭർത്താവിന്റെ വീട്ടിൽ ഒരു നേർച്ച നേർന്നാലോ, ശപഥത്തോടെ സ്വയം ഒരു ബാധ്യതയിൽ ബന്ധിച്ചാലോ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ചെയ്താൽ
  rationale: നിയമപരമായ കേസുകളുടെ തുടർച്ചയിലെ നിബന്ധനാഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആൽ’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ וְ എന്ന തുടർച്ചാസൂചന സന്ദർഭപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בֵּית אִישָׁהּ
  choice: ഭർത്താവിന്റെ വീട്ടിൽവെച്ച്
  rationale: ‘അവളുടെ ഭർത്താവിന്റെ വീട്’ എന്ന സ്ഥലപരവും കുടുംബപരവുമായ പശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נָדָרָה
  choice: ഒരു നേർച്ച നേർന്നിരിക്കുകയോ
  rationale: נדר എന്ന ക്രിയയുടെ മത-നിയമപരമായ ‘vow’ അർഥം ‘നേർച്ച നേരുക’ എന്ന പ്രചാരത്തിലുള്ള മലയാളപ്രയോഗം കൃത്യമായി നൽകുന്നു.
- source_word: אוֹ
  choice: -ഓ ... -ഓ
  rationale: രണ്ട് നിയമസാധ്യതകളെ വേർതിരിക്കുന്ന വികല്പബന്ധം മലയാളത്തിലെ സമാന്തര ‘-ഓ ... -ഓ’ ഘടനയിൽ നൽകുന്നു.
- source_word: אָסְרָה אִסָּר
  choice: സ്വയം ഒരു ബാധ്യതയ്ക്കു വിധേയയാക്കിയിരിക്കുകയോ
  rationale: ഒരേ ധാതുവിലുള്ള ക്രിയ-നാമ ആവർത്തനത്തിന്റെ ഊന്നലും ഒരാൾ തന്റെമേൽ ഏർപ്പെടുത്തുന്ന നിർബന്ധത്തിന്റെ നിയമബലവും അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനമില്ലാതെ അറിയിക്കുന്നു.
- source_word: עַל נַפְשָׁהּ
  choice: സ്വയം
  rationale: ഇവിടെ נֶפֶשׁ ‘ആത്മാവ്’ എന്ന സങ്കുചിത അർഥത്തിലല്ല, വ്യക്തിയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘സ്വയം’ യോജിക്കുന്നു.
- source_word: בִּשְׁבֻעָה
  choice: ശപഥംചെയ്ത്
  rationale: ബാധ്യത ഏറ്റെടുക്കുന്നതിനുള്ള മാർഗമോ അനുബന്ധ സാഹചര്യമായോ ഉള്ള ശപഥത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ഈ വാക്യം തുടർന്നുവരുന്ന മുഖ്യവാക്യത്തിന്റെ നിബന്ധനാഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു. ഹീബ്രു ക്രിയ-നാമ സജാതീയ ആവർത്തനം അക്ഷരാർഥത്തിൽ പകർത്താതെ അതിന്റെ ശക്തമായ സ്വയംബന്ധനഭാവം സംരക്ഷിച്ചു.
