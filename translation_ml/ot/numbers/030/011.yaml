revisions:
- from: അവൾ ഭർത്താവിന്റെ വീട്ടിൽവെച്ച് ഒരു നേർച്ച നേർന്നിരിക്കുകയോ, ശപഥംചെയ്ത് സ്വയം ഒരു ബാധ്യതയ്ക്കു വിധേയയാക്കിയിരിക്കുകയോ ചെയ്താൽ,
  to: അവൾ ഭർത്താവിന്റെ വീട്ടിൽ ഒരു നേർച്ച നേർന്നാലോ, ശപഥത്തോടെ സ്വയം ഒരു ബാധ്യതയിൽ ബന്ധിച്ചാലോ,
  rationale: 'This revision retains the source’s locative setting, disjunction, conditional legal force, self-directed obligation, and oath, while using idiomatic modern Malayalam. No footnote is necessary: the compact Malayalam wording adequately represents the Hebrew cognate binding construction, and the English audit-trail footnote is not needed for a faithful Malayalam rendering.'
