  source_fidelity: മുഖ്യവാചകത്തിന്റെ നിയമപരമായ വ്യവസ്ഥയും പുരുഷലിംഗ ഏകവചനവും നേർച്ച/ശപഥം എന്ന വ്യത്യാസവും നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നിരുന്നാലും יהוה-യുടെ ഇംഗ്ലീഷ് POB തീരുമാനമായ “Yahweh” യോട് യോജിക്കാൻ “യഹോവ” എന്നതിനു പകരം “യാഹ്‌വെ” വേണം. കൂടാതെ “ആണയിട്ട് ശപഥം” അനാവശ്യമായ ആവർത്തനമാണ്; സ്വയം ബന്ധനബാധ്യത ഏർപ്പെടുത്തുന്ന ശപഥത്തിന്റെ ആശയം കൂടുതൽ സ്വാഭാവികമായി നൽകാം.
  naturalness: “തന്നെത്താൻ ഒരു ബാധ്യതയാൽ ബന്ധിക്കാനായി ആണയിട്ട് ശപഥം ചെയ്താലോ” എന്ന ഘടന അല്പം ഭാരവും ആവർത്തനവും ഉള്ളതാണ്. “തന്റെമേൽ ഒരു ബന്ധനബാധ്യത ഏർപ്പെടുത്താൻ ശപഥം ചെയ്താലോ” എന്നത് ആധുനിക നിലവാരമലയാളത്തിലെ നിയമശൈലിയിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
