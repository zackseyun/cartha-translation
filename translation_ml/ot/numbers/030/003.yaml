id: NUM.30.3
reference: Numbers 30:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: ml
  text: ഒരു പുരുഷൻ യാഹ്‌വെക്ക് ഒരു നേർച്ച നേർന്നാലോ, അല്ലെങ്കിൽ തന്റെമേൽ ഒരു ബന്ധനബാധ്യത ഏർപ്പെടുത്താൻ ശപഥം ചെയ്താലോ,[a] അവൻ തന്റെ വാക്ക് ലംഘിക്കരുത്;[b] തന്റെ വായിൽനിന്ന് പുറപ്പെട്ടതെല്ലാം അവൻ ചെയ്യണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “തന്റെമേൽ ഒരു ബന്ധനബാധ്യത ബന്ധിക്കാനായി.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “അവൻ തന്റെ വാക്കിനെ അപവിത്രമാക്കരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനത്തെ നിയമസന്ദർഭത്തിൽ ലിംഗസൂക്ഷ്മതയോടെ നിലനിർത്തുന്നു.
- source_word: יִדֹּר נֶדֶר
  choice: ഒരു നേർച്ച നേർന്നാലോ
  rationale: സജാതീയ ക്രിയ-നാമ പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה വ്യക്തിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: ആണയിട്ട് ശപഥം ചെയ്താലോ
  rationale: സജാതീയ പ്രയോഗത്തിലെ ഗൗരവവും ഔപചാരിക പ്രതിജ്ഞയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: തന്നെത്താൻ ഒരു ബാധ്യതയാൽ ബന്ധിക്കാനായി
  rationale: സ്വയം ഒരു നിർബന്ധബാധ്യതയ്ക്ക് വിധേയനാക്കുക എന്ന നിയമാർഥം കൃത്യമായി നൽകുന്നു; മൂലത്തിലെ ‘ബന്ധിക്കുക’ എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: അവൻ തന്റെ വാക്ക് ലംഘിക്കരുത്
  rationale: חלל എന്ന പദത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള ‘അശുദ്ധമാക്കുക’ എന്ന ആശയം ഈ സന്ദർഭത്തിൽ വാക്ക് ലംഘിക്കുക എന്ന സ്വാഭാവിക നിയമപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: തന്റെ വായിൽനിന്ന് പുറപ്പെട്ടതെല്ലാം അവൻ ചെയ്യണം
  rationale: വായിൽനിന്ന് വാക്കുകൾ പുറപ്പെടുന്നു എന്ന എബ്രായ ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് നിർബന്ധാർഥം വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: നിയുക്ത മാതൃകയിലെ ‘Yahweh’ എന്ന വ്യക്തിനാമപരമായ അവതരണം പിന്തുടരുന്നു; പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ഉടമ്പടിനാമം നിലനിർത്തുന്നു.
- issue: വാക്ക് ‘ലംഘിക്കുക’ എന്നതിലെ വിശുദ്ധതാസൂചന
  choice: ലംഘിക്കരുത്
  alternative: തന്റെ വാക്കിനെ അശുദ്ധമാക്കരുത്
  rationale: നിയമസന്ദർഭത്തിലെ പ്രവർത്തനാർഥം വ്യക്തമായി നൽകുന്നു; എന്നാൽ חלל എന്ന പദത്തിന്റെ ‘അശുദ്ധമാക്കുക/അപവിത്രമാക്കുക’ എന്ന അടിസ്ഥാനാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ‘നേർച്ച നേർന്നു’, ‘ആണയിട്ട് ശപഥം ചെയ്തു’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ സജാതീയ ഘടനകളെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; അത്യന്തം അക്ഷരാനുവാദപരമായ അസ്വാഭാവികത അടിക്കുറിപ്പുകളിലേക്ക് മാറ്റിയിരിക്കുന്നു.
