source:
  edition: WLC
  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: ml
  text: എന്നാൽ അവളുടെ ഭർത്താവ് അതു കേൾക്കുന്ന ദിവസം അവളോടു മിണ്ടാതിരുന്നാൽ[a], അവളുടെ നേർച്ചകൾ നിലനിൽക്കും; അവൾ സ്വയംമേൽ ഏർപ്പെടുത്തിയ ബാധ്യതകളും[b] നിലനിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളോട് ഒന്നും പറയാതിരുന്നാൽ.” ഇവിടെ മിണ്ടാതിരിക്കുക എന്നത് ഭർത്താവ് എതിർപ്പ് അറിയിക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ നേർച്ച പ്രാബല്യത്തിൽ തുടരും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവളുടെ ബന്ധനങ്ങളും.” എബ്രായപദം അവൾ സ്വന്തംമേൽ ഏർപ്പെടുത്തിയ, നിയമപരമായി ബാധകമായ പ്രതിബദ്ധതകളെയോ ബാധ്യതകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע אִישָׁהּ
  choice: എന്നാൽ അവളുടെ ഭർത്താവ് ... കേട്ടിട്ടും
  rationale: നിയമപരമായ സോപാധിക വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നു; אִישָׁהּ സന്ദർഭത്തിൽ ‘അവളുടെ ഭർത്താവ്’ എന്നാണ്.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: അതു കേൾക്കുന്ന ദിവസം
  rationale: പ്രതികരിക്കേണ്ട നിയമപരമായി പ്രസക്തമായ ദിവസം എന്ന എബ്രായ സമയസൂചന നിലനിർത്തുന്നു.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: അവളോടു മിണ്ടാതിരുന്നാൽ
  rationale: എതിർപ്പൊന്നും അറിയിക്കാതെ നിശ്ശബ്ദനായിരിക്കുക എന്ന പ്രയോഗാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְקָמוּ ... יָקֻמוּ
  choice: നിലനിൽക്കും ... നിലനിൽക്കും
  rationale: קוּם എന്ന നിയമപ്രയോഗത്തിന്റെ ‘പ്രാബല്യത്തിൽ തുടരുക’ എന്ന അർഥവും മൂലത്തിലെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: נְדָרֶיהָ
  choice: അവളുടെ നേർച്ചകൾ
  rationale: ദൈവസന്നിധിയിൽ ചെയ്യുന്ന പ്രതിജ്ഞാബദ്ധമായ നേർച്ചകൾക്കുള്ള സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: וֶאֱסָרֶהָ
  choice: ബന്ധനങ്ങളും
  rationale: സ്വയം ഏറ്റെടുത്ത നിയന്ത്രണമോ ബാധ്യതയോ സൂചിപ്പിക്കുന്ന אסר എന്ന പദത്തിന്റെ ബന്ധിക്കുക എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: അവൾ സ്വയം ഏറ്റെടുത്ത
  rationale: വ്യക്തി സ്വന്തംമേൽ ചുമത്തിയ ബാധ്യത എന്ന ആശയം സ്വാഭാവികമായി പറയുന്നു; נֶפֶשׁ ഇവിടെ ‘ആത്മാവ്’ എന്നതിലുപരി പ്രതിഫലകമായി വ്യക്തിയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്.
