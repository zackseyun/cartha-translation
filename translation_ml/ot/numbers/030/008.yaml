translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ dignified നിയമഭാവം പാലിച്ചു. ‘നിലനിൽക്കും’ എന്ന ആവർത്തനം എബ്രായത്തിലെ സമാന്തര നിയമപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ബന്ധനങ്ങൾ’ എന്ന പദത്തിന്റെ സാധ്യതയുള്ള അസ്പഷ്ടത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
