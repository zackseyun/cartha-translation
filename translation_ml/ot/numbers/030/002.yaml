id: NUM.30.2
reference: Numbers 30:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ ഇസ്രായേൽമക്കളുടെ[a] ഗോത്രത്തലവന്മാരോട് ഇങ്ങനെ പറഞ്ഞു: “യാഹ്‌വേ കല്പിച്ച വചനം ഇതാണ്:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പ്രയോഗസൗകര്യത്തോടെ: “ഇസ്രായേല്യരുടെ.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “യാഹ്‌വേ കല്പിച്ചത് ഇതാണ്.” എബ്രായത്തിൽ അക്ഷരാർഥമായി “യാഹ്‌വേ കല്പിച്ച വചനം ഇതാണ്” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു. ‘അപ്പോൾ’ ആ ക്രമാനുഗതബലം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘പറഞ്ഞു’ ഇവിടെ സംസാരക്രിയയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: ഗോത്രത്തലവന്മാർ
  rationale: רָאשֵׁי എന്നതിലെ ‘തല/മുഖ്യൻ’ എന്ന ആശയവും מַטּוֹת എന്നതിന്റെ ഇസ്രായേലിലെ ഗോത്രവിഭാഗങ്ങൾ എന്ന അർഥവും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ സംയുക്തപദമായി സൂക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ ഭാവം ‘ഇസ്രായേൽമക്കൾ’ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമസ്ഥബന്ധമായി ‘ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങൾ’ എന്നു ചേർക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: זֶה הַדָּבָר
  choice: വചനം ഇതാണ്
  rationale: דָּבָר എന്നതിന് ‘വചനം,’ ‘കാര്യം’ തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ഇവിടെ ദൈവിക കല്പനയെ പരിചയപ്പെടുത്തുന്നതിനാൽ ‘വചനം’ അതിന്റെ ഔദ്യോഗിക ഉച്ചാരണഭാവം സൂക്ഷിക്കുന്നു; കൂടുതൽ പ്രയോഗസൗകര്യമുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ച
  rationale: പൂർത്തിയായ ദൈവിക കല്പന ഇപ്പോൾ അറിയിക്കപ്പെടുന്നു. മലയാളത്തിലെ ഭൂതകാല കൃതന്തം ഈ അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള ലിപ്യന്തരണരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പേര് തന്നെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചക രൂപം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായ പദം ഉപയോഗിക്കുന്നു; ജനവിഭാഗനാമമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗോത്രഘടനയും കുടുംബബന്ധസൂചകമായ ഉടമ്പടിപ്രയോഗവും ദൈവനാമവും നിലനിർത്തിയപ്പോൾ, നേരിട്ടുള്ള ഉദ്ധരണിയുടെ അവതരണം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി.
