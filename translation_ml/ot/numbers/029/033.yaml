  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ml
  text: അവയുടെ ധാന്യയാഗവും പാനീയയാഗങ്ങളും—കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കുംവേണ്ടി, അവയുടെ എണ്ണമനുസരിച്ച്, അവയ്ക്കുള്ള ചട്ടമനുസരിച്ച്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിശ്ചയിച്ചിട്ടുള്ള വിധിപ്രകാരം” അല്ലെങ്കിൽ “അവയ്ക്കുള്ള നിയമപ്രകാരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: അവയുടെ ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായയിലെ ഏകവചനരൂപം സമൂഹവാചകമായി നിലനിർത്തി.
- source_word: נִסְכֵּיהֶם
  choice: അവയുടെ പാനീയയാഗങ്ങൾ
  rationale: നിവേദ്യമായി ഒഴിക്കുന്ന ദ്രാവകയാഗങ്ങളെയാണ് נֶסֶךְ സൂചിപ്പിക്കുന്നത്; എബ്രായയിലെ ബഹുവചനം നിലനിർത്തി.
- source_word: לַפָּרִים
  choice: കാളകൾക്കുംവേണ്ടി
  rationale: യാഗങ്ങളുടെ പട്ടികയിൽ פָּרִים എന്നത് കാളകളെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ പ്രായം പ്രത്യേകം പറഞ്ഞിട്ടില്ല.
- source_word: לָאֵילִם
  choice: ആട്ടുകൊറ്റന്മാർക്കുംവേണ്ടി
  rationale: യാഗസന്ദർഭത്തിലെ אַיִל എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപം.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്കുംവേണ്ടി
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ലിംഗം പ്രത്യേകം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അധികവിവരം ചേർത്തിട്ടില്ല.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണമനുസരിച്ച്
  rationale: മൃഗങ്ങളുടെ നിശ്ചിത എണ്ണത്തോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כְּמִשְׁפָּטָם
  choice: അവയ്ക്കുള്ള ചട്ടമനുസരിച്ച്
  rationale: ഇവിടെ מִשְׁפָּט യാഗങ്ങൾക്കായി നിശ്ചയിച്ച നിയമപരമായ ക്രമമോ ചട്ടമോ സൂചിപ്പിക്കുന്നു. ബഹുവചന പ്രത്യയത്തിന്റെ ബന്ധം അനാവശ്യമായി തീർപ്പാക്കാതെ ‘അവയ്ക്കുള്ള’ എന്നു നൽകി.
