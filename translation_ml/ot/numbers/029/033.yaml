  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. മൂലവാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ പുതിയ ക്രിയ ചേർത്തിട്ടില്ല; പട്ടികയുടെ ഘടന വ്യക്തമാക്കാൻ ദീർഘരേഖ ഉപയോഗിച്ചു.
