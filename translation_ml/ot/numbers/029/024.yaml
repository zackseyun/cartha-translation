id: NUM.29.24
reference: Numbers 29:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ml
  text: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും അവയുടെ എണ്ണത്തിനനുസരിച്ച്, ചട്ടപ്രകാരമുള്ള[a] ധാന്യയാഗങ്ങളും പാനീയയാഗങ്ങളും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചയിച്ചിരിക്കുന്ന രീതിപ്രകാരമുള്ള.” എബ്രായപദം ഈ യാഗങ്ങൾക്കായി സ്ഥാപിക്കപ്പെട്ട നിയമപരമായ നടപടിക്രമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ധാന്യയാഗങ്ങളും
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה മൃഗയാഗത്തോടൊപ്പമുള്ള ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. എബ്രായയിലെ ഏകവചനരൂപത്തിന് കൂട്ടാർഥമുണ്ടെങ്കിലും, പട്ടികയിലെ പല മൃഗങ്ങളോടും യോജിക്കുന്ന സ്വാഭാവിക മലയാളത്തിനായി ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: וְנִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങളും
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗമാണ്; ‘പാനീയയാഗം’ ആചാരപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לַפָּרִים
  choice: കാളകൾക്കും
  rationale: ל ഇവിടെ അനുബന്ധയാഗങ്ങൾ ഏതു മൃഗങ്ങൾക്കുള്ളതാണെന്ന് വിതരണപരമായി സൂചിപ്പിക്കുന്നു.
- source_word: לָאֵילִם
  choice: ആട്ടുകൊറ്റന്മാർക്കും
  rationale: אַיִל യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്കും
  rationale: כְּבָשִׂים യാഗസന്ദർഭത്തിൽ കുഞ്ഞാടുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: അനുബന്ധയാഗങ്ങൾ മൃഗങ്ങളുടെ എണ്ണത്തിന് ആനുപാതികമായിരിക്കണമെന്ന നടപടിക്രമാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: ചട്ടപ്രകാരമുള്ള
  rationale: מִשְׁפָּט ഇവിടെ സ്ഥാപിതമായ നിയമപരമായ യാഗനടപടിയെയോ നിശ്ചിത രീതിയെയോ സൂചിപ്പിക്കുന്നു; ‘ചട്ടപ്രകാരം’ അതിന്റെ ഔപചാരികത നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻപത്തെ കല്പനയുടെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ നിർദേശരൂപം നൽകാൻ ‘അർപ്പിക്കണം’ ചേർത്തു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പദത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
