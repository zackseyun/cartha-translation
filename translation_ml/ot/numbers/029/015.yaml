  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യം മുമ്പത്തെ വാക്യഘടകത്തിന്റെ തുടർച്ചയായതിനാൽ പട്ടികാശൈലിയിലുള്ള അർദ്ധവിരാമം നിലനിർത്തി.
