source:
  edition: WLC
  text: וְ/עִשָּׂרׄוֹן֙ עִשָּׂר֔וֹן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד לְ/אַרְבָּעָ֥ה עָשָׂ֖ר כְּבָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/015.yaml
  text: and one-tenth for each lamb[a], for the fourteen lambs;
translation:
  language: ml
  text: പതിനാലു കുഞ്ഞാടുകളിൽ ഓരോ കുഞ്ഞാടിനും പത്തിലൊന്നു വീതം[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘പത്തിലൊന്ന്’ എന്ന പദം രണ്ടുതവണ ആവർത്തിക്കുന്നു (‘പത്തിലൊന്ന്, പത്തിലൊന്ന്’). ഓരോ കുഞ്ഞാടിനും അത്ര അളവ് വീതം നൽകണമെന്ന അർഥമുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: പത്തിലൊന്നു വീതം
  rationale: ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ നാമം ബലിയുടെ സന്ദർഭത്തിൽ ഓരോ മൃഗത്തിനും നിശ്ചയിച്ച പത്തിലൊന്ന് അളവിനെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വീതം’ ചേർക്കുന്നത് ഈ ആവർത്തനത്തിന്റെ സ്വാഭാവിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോ കുഞ്ഞാടിനും
  rationale: അക്ഷരാർഥം ‘ആ ഒരു കുഞ്ഞാടിന്’ എന്നാണെങ്കിലും, ഇവിടെ പതിനാലു കുഞ്ഞാടുകളിൽ ഓരോന്നിനുമുള്ള അളവാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ വിതരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: പതിനാലു കുഞ്ഞാടുകളിൽ
  rationale: ഓരോ കുഞ്ഞാടിനും ബാധകമായ, സന്ദർഭത്തിൽ നിർദിഷ്ടമായ പതിനാലംഗ കൂട്ടത്തെ ഈ രൂപം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
