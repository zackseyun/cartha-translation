id: NUM.29.38
reference: Numbers 29:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ml
  text: പാപയാഗത്തിനായി ഒരു കോലാടിനെയും[a] അർപ്പിക്കണം; ഇത് പതിവായ ദഹനയാഗത്തിനും[b] അതിന്റെ ധാന്യയാഗത്തിനും പാനീയയാഗത്തിനും പുറമേയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ആൺകോലാടിനെയും.’ യാഗസന്ദർഭങ്ങളിൽ എബ്രായപദമായ שׂעיר പ്രത്യേകിച്ച് ആൺകോലാടിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിരന്തരമായ ദഹനയാഗം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ഒരു കോലാടിനെയും
  rationale: שׂעיר എന്നത് കോലാടിനെ സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ പ്രത്യേകിച്ച് ആൺകോലാടിനെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും വ്യാപകവുമായ ‘കോലാട്’ നിലനിർത്തി, കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: חַטָּאת
  choice: പാപയാഗത്തിനായി
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: അർപ്പിക്കേണ്ട മൃഗത്തിന്റെ എണ്ണം വ്യക്തമാക്കുന്ന സംഖ്യാവാചകം.
- source_word: מִ/לְּ/בַד
  choice: പുറമേ
  rationale: ഈ യാഗം നേരത്തേ നിർദേശിച്ച പതിവായ യാഗങ്ങളോടൊപ്പം അധികമായി അർപ്പിക്കേണ്ടതാണെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: עֹלַת הַ/תָּמִיד
  choice: പതിവായ ദഹനയാഗം
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തെയും תָּמִיד ക്രമമായി ആവർത്തിക്കുന്ന സ്ഥിരയാഗത്തെയും സൂചിപ്പിക്കുന്നു. ‘പതിവായ’ എന്നത് ഈ ആവർത്തനസ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וּ/מִנְחָתָ/הּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: പുരോഹിതീയ സന്ദർഭത്തിൽ מִנְחָה ദഹനയാഗത്തോടൊപ്പമുള്ള ധാന്യയാഗമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
- source_word: וְ/נִסְכָּ/הּ
  choice: പാനീയയാഗം
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പമുള്ള പാനീയാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യയം വീണ്ടും ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘അർപ്പിക്കണം’ ചേർത്തു. അടിക്കുറിപ്പ് [a] ‘കോലാട്’ എന്നതിനും [b] ‘പതിവായ ദഹനയാഗം’ എന്നതിനും പിന്നാലെ സ്ഥാപിച്ചു.
