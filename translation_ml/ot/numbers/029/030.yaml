translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായവാക്യം മുൻവാക്യത്തിൽനിന്നുള്ള ക്രിയയെ ആശ്രയിക്കുന്നതിനാൽ, സ്വതന്ത്ര മലയാളവാക്യമായി വ്യക്തത ലഭിക്കാൻ ‘അർപ്പിക്കണം’ എന്നു സന്ദർഭാനുസൃതമായി ചേർത്തു. ധാന്യയാഗത്തിന്റെ കൂട്ട ഏകവചനവും പാനീയയാഗങ്ങളുടെ ബഹുവചനവും നിലനിർത്തി.
