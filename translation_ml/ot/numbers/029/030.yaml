  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ml
  text: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും അവയുടെ എണ്ണത്തിനനുസരിച്ച്, ചട്ടപ്രകാരം[a], അവയ്ക്കുള്ള ധാന്യയാഗവും പാനീയയാഗങ്ങളും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചയിച്ച രീതിപ്രകാരം.” എബ്രായപദമായ כַּמִּשְׁפָּט ഈ യാഗങ്ങൾ അർപ്പിക്കേണ്ടതിന് സ്ഥാപിക്കപ്പെട്ട ചട്ടത്തെയോ രീതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിലെ ഏകവചനം കൂട്ടമായ അർഥത്തിൽ നിലനിർത്തി.
- source_word: נִסְכֵּיהֶם
  choice: അവയ്ക്കുള്ള പാനീയയാഗങ്ങൾ
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പം ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗമാണ്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും യാഗസംബന്ധമായ പ്രത്യേകത നിലനിർത്തുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: לַפָּרִים
  choice: കാളകൾക്ക്
  rationale: פַּר യാഗപ്പട്ടികകളിൽ കാളയെ സൂചിപ്പിക്കുന്നു; മൂലപാഠം പ്രായം പ്രത്യേകം പറയാത്തതിനാൽ ‘ഇളങ്കാളകൾ’ എന്നു ചേർത്തില്ല.
- source_word: לָאֵילִם
  choice: ആട്ടുകൊറ്റന്മാർക്ക്
  rationale: אַיִל യാഗസന്ദർഭത്തിൽ ആൺചെമ്മരിയാടിനെ, അതായത് ആട്ടുകൊറ്റനെ, സൂചിപ്പിക്കുന്നു.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്ക്
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ലിംഗം അധികമായി വ്യക്തമാക്കേണ്ട ആവശ്യമില്ല.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: നിർദേശിക്കപ്പെട്ട മൃഗങ്ങളുടെ എണ്ണത്തിന് യാഗങ്ങൾ യോജിച്ചിരിക്കണമെന്ന നടപടിക്രമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: ചട്ടപ്രകാരം
  rationale: מִשְׁפָּט ഇവിടെ സ്ഥാപിതമായ നിയമപരവും അനുഷ്ഠാനപരവുമായ നിർദേശം സൂചിപ്പിക്കുന്നു; ‘ചട്ടപ്രകാരം’ അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
