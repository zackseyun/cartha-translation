id: NUM.29.18
reference: Numbers 29:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ml
  text: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും അവയുടെ എണ്ണമനുസരിച്ച്, ചട്ടപ്രകാരം[a] അവയ്ക്കുള്ള ധാന്യയാഗവും പാനീയയാഗങ്ങളും അർപ്പിക്കണം;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിശ്ചയിക്കപ്പെട്ട ക്രമപ്രകാരം.’ എബ്രായപദം ഈ യാഗങ്ങൾക്കായി സ്ഥാപിക്കപ്പെട്ട ചട്ടത്തെയോ നടപടിക്രമത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗം
  rationale: യാഗസംബന്ധമായ ഈ സന്ദർഭത്തിൽ מִנְחָה ദഹനയാഗത്തോടൊപ്പം അർപ്പിക്കുന്ന ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. പ്രത്യയം പട്ടികപ്പെടുത്തിയ മൃഗങ്ങളോടുള്ള ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘അവയ്ക്കുള്ള’ എന്നു നൽകി.
- source_word: נִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങൾ
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും യാഗസന്ദർഭത്തിന് യോജിച്ചതുമായ പദമാണ് ‘പാനീയയാഗം’.
- source_word: לַפָּרִים
  choice: കാളകൾക്ക്
  rationale: ലാമെദ് ഉപസർഗം അനുബന്ധ യാഗങ്ങൾ ഓരോ മൃഗവിഭാഗത്തിനും നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: לָאֵילִם
  choice: ആട്ടുകൊറ്റന്മാർക്ക്
  rationale: אֵילִים എന്നത് യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ആ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്കും
  rationale: כְּבָשִׂים എന്ന യാഗസംബന്ധമായ സാധാരണ പദത്തിന് സ്വാഭാവികമായ മലയാളപരിഭാഷയാണ് ‘കുഞ്ഞാടുകൾ’.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണമനുസരിച്ച്
  rationale: അനുബന്ധ യാഗങ്ങളുടെ അളവ് ബലിയർപ്പിക്കുന്ന മൃഗങ്ങളുടെ എണ്ണത്തിന് അനുപാതമായിരിക്കണമെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: ചട്ടപ്രകാരം
  rationale: ഇവിടെ מִשְׁפָּט സ്ഥാപിതമായ യാഗക്രമത്തെയോ നിർദിഷ്ട നടപടിയെയോ സൂചിപ്പിക്കുന്നു. ‘ചട്ടപ്രകാരം’ നിയമപരവും ആചാരപരവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗനിയമങ്ങളുടെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിൽ ക്രിയ വ്യക്തമാക്കാതെ മുൻവാക്യങ്ങളിലെ നിർദേശം തുടരുന്നുവെങ്കിലും, മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും പൂർണ്ണവുമാക്കാൻ ‘അർപ്പിക്കണം’ ചേർത്തു.
