translation:
  language: ml
  text: ആ ഏഴ് ആട്ടിൻകുട്ടികളിൽ ഓരോന്നിനും പത്തിലൊന്നുവീതം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ ‘ഒരു പത്തിലൊന്ന്’; ഈ യാഗസന്ദർഭത്തിൽ സാധാരണയായി എഫായുടെ പത്തിലൊന്നാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: പത്തിലൊന്നുവീതം
  rationale: עִשָּׂרוֹן אֶחָד എന്നത് അക്ഷരാർഥത്തിൽ ‘ഒരു പത്തിലൊന്ന്’ എന്ന അളവാണ്. ഓരോ ആട്ടിൻകുട്ടിക്കും ഈ അളവ് ബാധകമാണെന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘വീതം’ ചേർത്ത് വ്യക്തമാക്കുന്നു; എഫായുടെ പത്തിലൊന്ന് എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോന്നിനും
  rationale: അക്ഷരാർഥം ‘ആ ഒരു ആട്ടിൻകുട്ടിക്ക്’ എന്നാണെങ്കിലും യാഗനിർദേശത്തിലെ പ്രയോഗം ഓരോ ആട്ടിൻകുട്ടിക്കും എന്ന വിതരണാർഥം നൽകുന്നു. പിന്നാലെ വരുന്ന ‘ഏഴ് ആട്ടിൻകുട്ടികൾ’ എന്നതോടു ചേർത്ത് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ആ ഏഴ് ആട്ടിൻകുട്ടികളിൽ
  rationale: നിശ്ചിതമായ ഏഴ് ആട്ടിൻകുട്ടികളുടെ കൂട്ടത്തെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. ഹീബ്രായിലെ നിർദിഷ്ടത ‘ആ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും മാന്യവുമായ യാഗനിയമശൈലി. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഹീബ്രായിലെ וְ എന്ന ബന്ധം ഈ വാക്യഭാഗത്തിന്റെ ആശ്രിതസ്വഭാവത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചിരിക്കുന്നു; മലയാളത്തിൽ വേറിട്ട് ‘കൂടാതെ’ ചേർത്തിട്ടില്ല.
