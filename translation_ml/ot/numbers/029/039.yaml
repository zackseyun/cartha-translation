  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: ml
  text: നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിൽ യഹോവയ്ക്കു നിങ്ങൾ ഇവ അർപ്പിക്കണം; നിങ്ങളുടെ നേർച്ചകളുടെയും സ്വമേധാ വഴിപാടുകളുടെയും പുറമേ, നിങ്ങളുടെ ഹോമയാഗങ്ങൾക്കും ധാന്യയാഗങ്ങൾക്കും പാനീയയാഗങ്ങൾക്കും സമാധാനയാഗങ്ങൾക്കും[a] വേണ്ടി ഇവ അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂട്ടായ്മയാഗങ്ങൾ.” എബ്രായപദം സമാധാനം, സമ്പൂർണക്ഷേമം എന്നിവയുമായി ബന്ധപ്പെട്ട ഒരു യാഗവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവ
  rationale: മുൻവാക്യങ്ങളിൽ നിർദേശിച്ച ഉത്സവകാലയാഗങ്ങളെയാണ് ബഹുവചന സൂചകപദം പരാമർശിക്കുന്നത്.
- source_word: תַּעֲשׂוּ
  choice: അർപ്പിക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം ‘അർപ്പിക്കുക’ എന്നതാണ്.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ലാമെദ് ഉപസർഗം യാഗങ്ങളുടെ സമർപ്പണലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ദൈവനാമം വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിൽ
  rationale: מוֹעֵד നിശ്ചയിക്കപ്പെട്ട സമയം, വിശുദ്ധസംഗമം, ഉത്സവാവസരം എന്നിവ സൂചിപ്പിക്കാം; ‘നിശ്ചിത സമയങ്ങൾ’ ഈ വിശാലത നിലനിർത്തുന്നു.
- source_word: לְבַד
  choice: പുറമേ
  rationale: നിർബന്ധിത ഉത്സവയാഗങ്ങൾക്ക് അധികമായി അർപ്പിക്കേണ്ട യാഗങ്ങളാണിവയെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: מִנִּדְרֵיכֶם
  choice: നിങ്ങളുടെ നേർച്ചയാഗങ്ങൾ
  rationale: വാക്കാൽ ചെയ്ത നേർച്ചകൾ മാത്രമല്ല, നേർച്ചയുടെ ഭാഗമായി അർപ്പിക്കുന്ന യാഗങ്ങളാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: וְנִדְבֹתֵיכֶם
  choice: സ്വമേധായാഗങ്ങൾ
  rationale: നിർബന്ധത്താലല്ലാതെ മനസ്സോടെ അർപ്പിക്കുന്ന യാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പദം.
- source_word: לְעֹלֹתֵיכֶם
  choice: നിങ്ങളുടെ ഹോമയാഗങ്ങൾ
  rationale: עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന അംഗീകൃത യാഗവിഭാഗമാണ്; ‘ഹോമയാഗം’ മലയാളത്തിലെ പരിചിതമായ സാങ്കേതികപദമാണ്.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: ധാന്യയാഗങ്ങൾ
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ מִנְחָה സാധാരണയായി ധാന്യത്തിൽനിന്നുള്ള വഴിപാടിനെ സൂചിപ്പിക്കുന്നു; ‘ധാന്യയാഗം’ ഇന്നത്തെ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: וּלְנִסְכֵּיכֶם
  choice: പാനീയയാഗങ്ങൾ
  rationale: ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെ സൂചിപ്പിക്കുന്ന נֶסֶךְ എന്ന പദത്തിന് സുതാര്യമായ മലയാളപരിഭാഷ.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: സമാധാനയാഗങ്ങൾ
  rationale: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ സമാധാനം/സമ്പൂർണക്ഷേമം എന്നീ അർഥബന്ധങ്ങൾ നിലനിർത്തുന്നു; മറ്റൊരു പ്രചാരത്തിലുള്ള വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ പൊതുനാമമാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: שְׁלָמִים എന്ന യാഗവിഭാഗത്തിന്റെ പരിഭാഷ
  choice: സമാധാനയാഗങ്ങൾ
  alternative: കൂട്ടായ്മയാഗങ്ങൾ
  rationale: ‘സമാധാനയാഗങ്ങൾ’ എന്നത് പദത്തിന്റെ സമാധാനം/ക്ഷേമം എന്ന അർഥബന്ധവും പരമ്പരാഗത യാഗവിഭാഗനാമവും നിലനിർത്തുന്നു; കൂട്ടായ്മ എന്ന ഘടകം സാധ്യമായ മറ്റൊരു വിവർത്തനമായി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. യാഗവിഭാഗങ്ങൾക്ക് വ്യക്തവും സ്ഥിരവുമായ പദങ്ങൾ ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം സ്വീകരിച്ചു; അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട ‘സമാധാനയാഗങ്ങൾ’ എന്ന പദത്തിനരികിൽ ചേർത്തു.
