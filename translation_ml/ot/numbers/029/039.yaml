revisions:
- from: നിങ്ങളുടെ നേർച്ചയാഗങ്ങൾക്കും സ്വമേധായാഗങ്ങൾക്കും പുറമേ, നിങ്ങളുടെ ഹോമയാഗങ്ങൾ, ധാന്യയാഗങ്ങൾ, പാനീയയാഗങ്ങൾ, സമാധാനയാഗങ്ങൾ[a] എന്നിവയായി, നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിൽ ഇവ യഹോവയ്ക്ക് അർപ്പിക്കണം.
  to: നിങ്ങളുടെ നിശ്ചിത സമയങ്ങളിൽ യഹോവയ്ക്കു നിങ്ങൾ ഇവ അർപ്പിക്കണം; നിങ്ങളുടെ നേർച്ചകളുടെയും സ്വമേധാ വഴിപാടുകളുടെയും പുറമേ, നിങ്ങളുടെ ഹോമയാഗങ്ങൾക്കും ധാന്യയാഗങ്ങൾക്കും പാനീയയാഗങ്ങൾക്കും സമാധാനയാഗങ്ങൾക്കും[a] വേണ്ടി ഇവ അർപ്പിക്കണം.
