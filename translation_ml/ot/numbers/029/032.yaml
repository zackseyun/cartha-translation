id: NUM.29.32
reference: Numbers 29:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: ml
  text: 'ഏഴാം ദിവസം: ഏഴു കാളകൾ, രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഊനമില്ലാത്ത ഒരു വയസ്സുള്ള പതിനാലു ആൺകുഞ്ഞാടുകൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: ഉത്സവക്രമത്തിലെ അടുത്ത ദിവസത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. മുൻവാക്യങ്ങളുമായുള്ള ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ അധികമായ ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: פָּרִים שִׁבְעָה
  choice: ഏഴു കാളകൾ
  rationale: യാഗസന്ദർഭത്തിലെ פַּר എന്ന പദത്തിന് ‘കാള’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപദമാണ്; പ്രായം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: אֵילִם שְׁנָיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: אַיִל എന്നത് യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻ’ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ഒരു വയസ്സുള്ള പതിനാലു ആൺകുഞ്ഞാടുകൾ
  rationale: בְּנֵי שָׁנָה എന്ന ഹീബ്രായ പ്രയോഗം ‘ഒരു വയസ്സുള്ള’ എന്നാണ്. כְּבָשִׂים എന്ന പുല്ലിംഗരൂപം ഇവിടെ യാഗത്തിനുള്ള ആൺകുഞ്ഞാടുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവിവരം നിലനിർത്തി.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗങ്ങളെ സംബന്ധിച്ചപ്പോൾ ഈ പദം ശാരീരിക ന്യൂനതയോ വൈകല്യമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഊനമില്ലാത്ത’ എന്നത് ആ യാഗപരമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: תְּמִימִם എന്ന വിശേഷണത്തിന്റെ വ്യാപ്തി
  choice: അടുത്തുള്ള ‘ആൺകുഞ്ഞാടുകൾ’ എന്ന നാമപദത്തോടു നേരിട്ട് ബന്ധിപ്പിച്ചു
  alternative: പട്ടികയിലെ എല്ലാ മൃഗങ്ങളെയും ‘ഊനമില്ലാത്തവ’ എന്നു തുറന്നുപറയുക
  rationale: ഹീബ്രായ വാക്യഘടനയിൽ വിശേഷണം ഉടൻ മുമ്പുള്ള ബഹുവചനമായ കുഞ്ഞാടുകളോടാണ് നേരിട്ട് യോജിക്കുന്നത്. വിശാലമായ യാഗനിയമപ്രകാരം എല്ലാ മൃഗങ്ങൾക്കും ഈ നിബന്ധന ബാധകമായിരിക്കാമെങ്കിലും, ഈ വാക്യത്തിൽ ‘എല്ലാം’ ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വ്യക്തീകരണം വരുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപ്പട്ടികാ ശൈലി. സംഖ്യകളും മൃഗനാമങ്ങളും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങളിൽ നൽകിയിരിക്കുന്നു.
