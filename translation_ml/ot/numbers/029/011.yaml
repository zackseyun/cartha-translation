  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: ml
  text: പാപയാഗമായി ഒരു കോലാട്ടുകൊറ്റൻ; പ്രായശ്ചിത്തത്തിന്റെ പാപയാഗത്തിനും പതിവായ ഹോമയാഗത്തിനും[b] അതിന്റെ ധാന്യയാഗത്തിനും അവയുടെ പാനീയയാഗങ്ങൾക്കും പുറമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘നിരന്തരമായ ഹോമയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: കോലാട്ടുകൊറ്റൻ
  rationale: കോലാടുകളിൽപ്പെട്ട ആൺമൃഗത്തെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ലിംഗവും മൃഗവർഗവും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ നിശ്ചിത എണ്ണം അതേപടി നിലനിർത്തുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ പാപം എന്ന അമൂർത്ത ആശയത്തേക്കാൾ ഒരു പ്രത്യേക യാഗത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പരിചിതമായ ആരാധനാപദമായതിനാൽ ഇത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘ശുദ്ധീകരണയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഈ യാഗം തുടർന്നുപറയുന്ന യാഗങ്ങൾക്ക് അധികമായുള്ളതാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: പ്രായശ്ചിത്തത്തിനുള്ള പാപയാഗം
  rationale: സംയുക്തപ്രയോഗം പാപയാഗത്തെ പ്രായശ്ചിത്തച്ചടങ്ങുമായി ബന്ധിപ്പിക്കുന്നു; സന്ദർഭത്തേക്കാൾ അധികമായി പ്രത്യേകീകരിക്കാതെ ആ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: עֹלַת הַתָּמִיד
  choice: നിരന്തരമായ ഹോമയാഗം
  rationale: תָּמִיד സൂചിപ്പിക്കുന്ന പതിവായോ തുടർച്ചയായോ ഉള്ള ആവർത്തനം ‘നിരന്തരമായ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: מִנְחָתָהּ
  choice: അതിനോടുകൂടിയ ധാന്യയാഗം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹോമയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; യാഗപ്പട്ടികയിൽ מִנְחָה ധാന്യയാഗമാണ്.
- source_word: נִסְכֵּיהֶם
  choice: അവയോടുകൂടിയ പാനീയയാഗങ്ങൾ
  rationale: ബഹുവചന പ്രത്യയവും നിവേദിക്കപ്പെടുന്ന ദ്രാവകയാഗങ്ങളുടെ ബഹുവചനവും സംരക്ഷിക്കുന്നു; ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: חַטָּאת എന്ന ആരാധനാപദത്തിന്റെ അർഥം
  choice: രണ്ടിടത്തും ‘പാപയാഗം’
  alternative: ‘ശുദ്ധീകരണയാഗം’
  rationale: ഈ പദത്തിന് യാഗക്രമത്തിൽ ശുദ്ധീകരണപരമായ പ്രവർത്തനം സൂചിപ്പിക്കാനാകുമെങ്കിലും, പാഠം യാഗങ്ങളുടെ പട്ടികയായതിനാൽ പരിചിതവും അർഥവ്യക്തവുമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു. യഥാർഥമായ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: חַטַּאת הַכִּפֻּרִים എന്ന സംയുക്തത്തിന്റെ ബന്ധം
  choice: ‘പ്രായശ്ചിത്തത്തിനുള്ള പാപയാഗം’
  alternative: ‘പ്രായശ്ചിത്തത്തിന്റെ പാപയാഗം’
  rationale: ഹീബ്രു സംയുക്തം ഉദ്ദേശ്യമോ ബന്ധപ്പെട്ട ചടങ്ങോ സൂചിപ്പിക്കാം. ‘ഉള്ള’ സ്വാഭാവിക മലയാളത്തിൽ ആ ബന്ധം നൽകുന്നു; പ്രത്യേക ഉപദേശവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ആരാധനാഭാഷ ഉപയോഗിച്ചു. നീണ്ട ഹീബ്രു പട്ടിക മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; യാഗങ്ങൾ തമ്മിലുള്ള വ്യാകരണബന്ധങ്ങളും ഏകവചന-ബഹുവചന സൂചനകളും സംരക്ഷിച്ചു.
