  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ml
  text: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും, അവയുടെ എണ്ണത്തിനനുസരിച്ച് ചട്ടപ്രകാരം അവയ്ക്കുള്ള ധാന്യയാഗവും പാനീയയാഗങ്ങളും അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചയിച്ച രീതിപ്രകാരം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായത്തിലെ כַּמִּשְׁפָּט യാഗങ്ങൾക്കായി സ്ഥാപിക്കപ്പെട്ട ചട്ടത്തെയോ നടപടിക്രമത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: ധാന്യയാഗവുംകൂടെ
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. ആദ്യത്തെ וּ മുൻവാക്യത്തിലെ യാഗപ്പട്ടികയോടുള്ള തുടർച്ചയും അനുബന്ധതയും വ്യക്തമാക്കുന്നതിനായി ‘കൂടെ’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: וְנִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങളുംകൂടെ
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗമാണ്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം ‘പാനീയയാഗം’ ആണ്. ബഹുവചനരൂപവും നിലനിർത്തി.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും
  rationale: לְ ഇവിടെ അനുബന്ധ യാഗങ്ങൾ ഓരോ മൃഗവിഭാഗത്തിനും ചേരുന്നതായി സൂചിപ്പിക്കുന്നു. പട്ടികയുടെ സമാന്തരഘടന മലയാളത്തിൽ നിലനിർത്തി.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: അനുബന്ധ യാഗങ്ങളുടെ അളവ് മൃഗങ്ങളുടെ എണ്ണത്തോട് അനുപാതപ്പെട്ടിരിക്കണമെന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: നിശ്ചയിച്ച ചട്ടപ്രകാരം
  rationale: מִשְׁפָּט ഇവിടെ സ്ഥാപിതമായ യാഗനിയമത്തെയോ നിർദിഷ്ട നടപടിക്രമത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ചട്ടപ്രകാരം’ നിയമപരമായ ഭാവം നിലനിർത്തുമ്പോൾ ‘നിശ്ചയിച്ച’ നിർദിഷ്ട രീതിയെന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: implicit verbal continuation
  choice: അർപ്പിക്കണം
  rationale: ഹീബ്രു വാക്യം മുൻവാക്യത്തെ ആശ്രയിച്ച നാമപദഘടനയാണ്. ഒറ്റവാക്യമായി മലയാളത്തിൽ വായനാസൗകര്യം നൽകാൻ മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ക്രിയ ചേർത്തു; പുതിയ ആശയം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ മുൻവാക്യാശ്രിത ഘടന മലയാളത്തിൽ അപൂർണ്ണമാകാതിരിക്കാൻ ‘അർപ്പിക്കണം’ ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
