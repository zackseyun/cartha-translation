id: NUM.29.1
reference: Numbers 29:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: ml
  text: ഏഴാം മാസത്തിൽ, ആ മാസത്തിന്റെ ഒന്നാം ദിവസം, നിങ്ങൾക്കു വിശുദ്ധസമ്മേളനം ഉണ്ടായിരിക്കണം. അധ്വാനവേലയൊന്നും ചെയ്യരുത്. അതു നിങ്ങൾക്കു കാഹളനാദത്തിന്റെ ദിവസമായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആർപ്പുവിളിയുടെ ദിവസം” അല്ലെങ്കിൽ “ആഹ്ലാദഘോഷത്തിന്റെ ദിവസം.” തְּרוּעָה (തെരൂആ) എന്ന എബ്രായപദം ഉച്ചത്തിൽ ഉയരുന്ന ഒരു ശബ്ദത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭമനുസരിച്ച് അതു കാഹളസൂചനയോ ആർപ്പുവിളിയോ ആഹ്ലാദഘോഷമോ ആകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസത്തിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ ‘മാസത്തിൽ’ എന്നു നൽകിയിരിക്കുന്നു. വാക്യാരംഭത്തിലെ ו നിയമക്രമത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതാണെങ്കിലും, ഒറ്റ വാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ ഒന്നാം ദിവസം
  rationale: അക്ഷരാർഥത്തിൽ ‘മാസത്തിലെ ഒന്നിൽ’ എന്നുള്ളത് ഒന്നാം തീയതിയെ സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ കാലഗണനാപ്രയോഗമാണ്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ഒന്നാം ദിവസം’ എന്നു നൽകി.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസമ്മേളനം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധമായ ജനസമ്മേളനത്തെ സൂചിപ്പിക്കുന്ന ആരാധനാപരമായ സ്ഥിരപ്രയോഗം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: അധ്വാനവേലയൊന്നും
  rationale: ഉത്സവദിവസത്തിൽ നിരോധിക്കപ്പെട്ട സാധാരണ തൊഴിൽപരമായ അധ്വാനത്തെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; എല്ലാ പ്രവൃത്തിയും പൂർണമായി നിരോധിക്കുന്നു എന്ന ധാരണ ഒഴിവാക്കാൻ ‘അധ്വാനവേല’ ഉപയോഗിച്ചു.
- source_word: יוֹם תְּרוּעָה
  choice: കാഹളനാദത്തിന്റെ ദിവസം
  rationale: ആരാധനാകലണ്ടറിന്റെ പശ്ചാത്തലത്തിൽ תְּרוּעָה ഉച്ചത്തിലുള്ള കാഹളസൂചനയെ സൂചിപ്പിക്കാമെന്നതിനാൽ മുഖ്യപാഠത്തിൽ ഈ അർഥം സ്വീകരിച്ചു; മൂലപദം വാദ്യോപകരണം വ്യക്തമായി പേരെടുക്കാത്തതിനാൽ അതിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ആയിരിക്കണം
  rationale: ജനത്തിനായി ആ ദിവസം നിശ്ചയിക്കപ്പെട്ട സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായ നിയമഭാഷയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יוֹם תְּרוּעָה എന്ന ഉത്സവവിശേഷണത്തിന്റെ വിവർത്തനം
  choice: കാഹളനാദത്തിന്റെ ദിവസം
  alternative: ആർപ്പുവിളിയുടെ അഥവാ ആഹ്ലാദഘോഷത്തിന്റെ ദിവസം
  rationale: പിന്നീടുണ്ടായ ഉത്സവനാമം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ, ദിവസത്തിന്റെ സവിശേഷമായ ശബ്ദത്തെ വിവരണാത്മകമായി അവതരിപ്പിച്ചു. תְּרוּעָה എന്ന പദത്തിന് കാഹളനാദം, ആർപ്പുവിളി, ആഹ്ലാദഘോഷം എന്നീ അർഥങ്ങൾ വരാമെന്ന യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള നിയമ-ആരാധനാ ശൈലി. കലണ്ടർപ്രയോഗം വ്യക്തമായി നൽകി; പിൽക്കാല ഉത്സവനാമം ഒഴിവാക്കി; മൂലപദത്തിലെ ശബ്ദസംബന്ധിയായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
