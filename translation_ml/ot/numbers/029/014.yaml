id: NUM.29.14
reference: Numbers 29:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: ml
  text: 'അവയുടെ ധാന്യയാഗം എണ്ണ ചേർത്ത നന്നായി അരച്ച മാവായിരിക്കണം: പതിമൂന്ന് കാളകളിൽ ഓരോന്നിനും മൂന്നു പത്തിലൊന്ന് അളവുകൾ[a], രണ്ട് ആട്ടുകൊറ്റന്മാരിൽ ഓരോന്നിനും രണ്ടു പത്തിലൊന്ന് അളവുകൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘പത്തിലൊന്ന് അളവ്’ പരമ്പരാഗതമായി ഒരു ഏഫയുടെ പത്തിലൊന്നായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: അവയുടെ ധാന്യയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു; 3ാം പുരുഷ ബഹുവചന പ്രത്യയം സന്ദർഭത്തിലെ യാഗമൃഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവയുടെ’ എന്നു നൽകി.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: ധാന്യയാഗത്തിനുപയോഗിച്ച നന്നായി അരച്ച മാവിനെ സൂചിപ്പിക്കുന്ന ആരാധനാപദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തി തയ്യാറാക്കിയതാണെന്ന നിഷ്ക്രിയ കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: പത്തിലൊന്ന് അളവുകൾ മൂന്നുവീതം
  rationale: עִשָּׂרוֹן ഒരു ‘പത്തിലൊന്ന്’ അളവാണ്. ഓരോ മൃഗത്തിനുമുള്ള വിതരണാർത്ഥം വ്യക്തമാക്കാൻ ‘മൂന്നുവീതം’ ഉപയോഗിച്ചു; ഏഫയുടെ പരമ്പരാഗത നിർവചനം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לַפָּר הָאֶחָד לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: പതിമൂന്ന് കാളകളിൽ ഓരോ കാളയ്ക്കും
  rationale: ‘ഒരു കാളയ്ക്ക്’ എന്ന അക്ഷരാർഥം ഇവിടെ വിതരണാർത്ഥത്തിലാണ്; ആകെ പതിമൂന്ന് കാളകളിൽ ഓരോന്നിനും എന്ന ആശയം മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: പത്തിലൊന്ന് അളവുകൾ രണ്ടുവീതം
  rationale: മുൻ അളവിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ഓരോ ആട്ടുകൊറ്റനുമുള്ള അളവ് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לָאַיִל הָאֶחָד לִשְׁנֵי הָאֵילִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാരിൽ ഓരോന്നിനും
  rationale: എബ്രായത്തിലെ ഏകവചന നിർദേശത്തിന് ഇവിടെ വിതരണാർത്ഥമുണ്ട്; ആകെ രണ്ടിൽ ഓരോന്നിനും എന്നത് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാഗനിയമ ശൈലി സ്വീകരിച്ചു. സാങ്കേതിക അളവ് മുഖ്യവാചകത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
