translation:
  language: ml
  text: മാസത്തിലെ ഹോമയാഗത്തിനും[a] അതിന്റെ ധാന്യയാഗത്തിനും, പതിവായ ഹോമയാഗത്തിനും അതിന്റെ ധാന്യയാഗത്തിനും, അവയുടെ പാനീയയാഗങ്ങൾക്കും പുറമേ, അവയ്ക്കുള്ള നിശ്ചിതക്രമപ്രകാരം, പ്രസാദകരമായ സൗരഭ്യത്തിനായി, യഹോവയ്ക്കുള്ള അഗ്നിയർപ്പണമായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാസത്തിലെ ഹോമയാഗം’ എന്നത് പുതിയ ചന്ദ്രദിനത്തിലെ യാഗത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്; എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘മാസത്തിന്റെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘യഹോവയ്ക്കുള്ള ഭക്ഷ്യയാഗമായി.’ പരമ്പരാഗതമായി ‘അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: മുമ്പ് നിർദേശിച്ച വഴിപാടുകളോടു ചേർത്ത് ഇവയും അർപ്പിക്കണമെന്ന കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: മാസത്തിലെ ഹോമയാഗം
  rationale: ‘മാസത്തിന്റെ ഹോമയാഗം’ എന്ന എബ്രായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; അമാവാസിയാഗമാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִנְחָתָהּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה മൃഗയാഗത്തോടൊപ്പമുള്ള ധാന്യയാഗത്തെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്.
- source_word: עֹלַת הַתָּמִיד
  choice: പതിവായ ഹോമയാഗം
  rationale: תָּמִיד സൂചിപ്പിക്കുന്ന ക്രമമായ തുടർച്ച നിലനിർത്തുന്നു; ‘ദൈനംദിനം’ എന്നു മൂലപാഠത്തേക്കാൾ പ്രത്യേകമാക്കുന്നില്ല.
- source_word: וְנִסְכֵּיהֶם
  choice: അവയുടെ പാനീയയാഗങ്ങൾ
  rationale: ഒഴിച്ചർപ്പിക്കുന്ന ദ്രാവകയാഗങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ബഹുവചന പ്രത്യയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כְּמִשְׁפָּטָם
  choice: അവയ്ക്കുള്ള നിശ്ചിതക്രമപ്രകാരം
  rationale: യാഗങ്ങൾ നിർവഹിക്കേണ്ട വിധിയെ നിയന്ത്രിക്കുന്ന നിശ്ചിത ചട്ടം എന്ന ആരാധനാക്രമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യത്തിനായി
  rationale: ദൈവസന്നിധിയിൽ യാഗം സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: אִשֶּׁה
  choice: അഗ്നിയർപ്പണം
  rationale: അഗ്നിയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതികപദമായി സംക്ഷിപ്തവും വ്യക്തവുമാണ്; മറ്റൊരു ആധുനിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്കുള്ള
  rationale: ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും യാഗത്തിന്റെ സമർപ്പണലക്ഷ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാൽ മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: אִשֶּׁה എന്ന യാഗസാങ്കേതികപദം
  choice: അഗ്നിയർപ്പണം
  alternative: ഭക്ഷ്യയാഗം
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട പരമ്പരാഗതവും നേരിട്ടുള്ളതുമായ അർഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ‘ഭക്ഷ്യയാഗം’ എന്ന ലെക്സിക്കൽ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാക്രമഭാഷയാണ് ഉപയോഗിച്ചത്. മൂലവാക്യം വ്യാകരണപരമായി മുൻവാക്യത്തോട് ചേർന്നുനിൽക്കുന്ന പട്ടികയായതിനാൽ, മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘ഇവ അർപ്പിക്കണം’ എന്നു പൂർത്തിയാക്കി; പുതിയ യാഗനിർദേശം ചേർത്തിട്ടില്ല.
