  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: ml
  text: പാപയാഗമായി ഒരു ആൺകോലാടിനെയും അർപ്പിക്കണം. ഇത് പതിവായ ഹോമയാഗത്തിനും[b] അതിന്റെ ധാന്യയാഗത്തിനും പാനീയയാഗത്തിനും പുറമേയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘പതിവായ’ എന്നത് ക്രമമായി ആവർത്തിച്ചിരുന്ന നിശ്ചിത യാഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപദത്തിന്റെ പരിഭാഷയാണ്; ‘ദിനംപ്രതിയുള്ള’ അല്ലെങ്കിൽ ‘നിരന്തരമായ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: ഒരു കോലാടിനെയും
  rationale: שׂעיר യാഗസന്ദർഭത്തിൽ ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; אֶחָד എണ്ണം വ്യക്തമാക്കുന്നു. മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ ‘ഒരു കോലാട്’ ഉപയോഗിച്ച് ലിംഗസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; וּ പട്ടികയുടെ തുടർച്ചയായി ‘-നെയും’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִ/לְּ/בַד
  choice: പുറമേയാണ്
  rationale: ഈ യാഗം പതിവായ ഹോമയാഗത്തോടു കൂടിയുള്ള അധിക അർപ്പണമാണെന്ന് പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַ/תָּמִיד
  choice: നിരന്തരമായ ഹോമയാഗം
  rationale: עֹלָהയ്ക്ക് സ്ഥാപിതമായ മലയാള പദം ‘ഹോമയാഗം’; תָּמִיד ക്രമമായി ആവർത്തിക്കുന്ന, തുടർച്ചയായി നിശ്ചയിക്കപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിരന്തരമായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִנְחָתָ/הּ
  choice: അതിനോടൊപ്പമുള്ള ധാന്യയാഗം
  rationale: ആരാധനാക്രമത്തിലെ מִנְחָה ധാന്യയാഗമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹോമയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമായി കാണിക്കാൻ ‘അതിനോടൊപ്പമുള്ള’ എന്നു നൽകി.
- source_word: וְ/נִסְכָּ/הּ
  choice: പാനീയയാഗം
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പമുള്ള ദ്രാവകാർപ്പണമാണ്; ആധുനിക വായനക്കാർക്ക് സുതാര്യമായ സ്ഥാപിത പദമായി ‘പാനീയയാഗം’ തെരഞ്ഞെടുത്തു.
