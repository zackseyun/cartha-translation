reference: Numbers 29:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ml
  text: 'നിങ്ങൾ യഹ്‌വേക്കു സൗരഭ്യവാസനയായ[a] ഹോമയാഗം അർപ്പിക്കണം: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ; ഇവ നിങ്ങൾ അർപ്പിക്കേണ്ട ഊനമില്ലാത്തവയായിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സൗരഭ്യവാസനയായ” എന്നത് യഹ്‌വേക്കു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഹീബ്രു യാഗപ്രയോഗമാണ്; “പ്രസാദകരമായ വാസനയായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: അർപ്പിക്കണം
  rationale: ഹിഫിൽ രൂപം യാഗസന്ദർഭത്തിൽ ഒരു വഴിപാട് ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത മലയാള ബൈബിൾ പദമാണ്.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ഹീബ്രു ദൈവനാമം മറച്ചുവയ്ക്കാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്ന ഉപസർഗത്തിന്റെ സമർപ്പണദിശ ‘-ക്കു’ കൊണ്ടു പ്രകടമാക്കി.
- source_word: רֵיחַ נִיחֹחַ
  choice: സൗരഭ്യവാസന
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗത്തിന്റെ വാസനാരൂപകം നിലനിർത്തുന്നു.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: ‘കന്നുകാലിയുടെ മകനായ കാള’ എന്ന ഹീബ്രു ശൈലിയെ സ്വാഭാവിക മലയാളത്തിൽ കൂട്ടത്തിൽനിന്നുള്ള ഒരു കാള എന്നു നൽകി.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗപ്പട്ടികയിലെ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്ന ലിംഗനിർദ്ദിഷ്ട ബഹുവചനവും בְּנֵי שָׁנָה എന്ന പ്രായപ്രയോഗവും വ്യക്തമായി നിലനിർത്തി.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: യാഗമൃഗങ്ങളിൽ ശാരീരിക വൈകല്യമോ ന്യൂനതയോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക യാഗപരിഭാഷയാണ്.
- source_word: יִהְיוּ לָכֶם
  choice: അവ നിങ്ങൾക്കുവേണ്ടി ... ആയിരിക്കണം
  rationale: לָכֶם എന്ന ദാതൃബന്ധം ഒഴിവാക്കാതെ സൂക്ഷിച്ചു; ആരാധകർ കൊണ്ടുവരുന്ന മൃഗങ്ങളുടെ നിർബന്ധിത ഗുണനിലവാരമായാണ് വാക്യം വായിക്കപ്പെടുന്നത്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ സവിശേഷ ഉടമ്പടിനാമത്തെ നേരിട്ട് ലിപ്യന്തരിച്ചു; പദവിനാമമാക്കി മാറ്റിയില്ല.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർത്ഥം
  choice: സൗരഭ്യവാസന
  alternative: പ്രസാദകരമായ വാസന / ശാന്തിപ്പിക്കുന്ന വാസന
  rationale: വാസനാരൂപകം നിലനിർത്തിക്കൊണ്ട് യാഗം ദൈവത്തിനു സ്വീകാര്യമാണെന്ന ആശയം സൂചിപ്പിക്കുന്നു; ദൈവത്തെ ശമിപ്പിക്കുന്നു എന്ന പ്രത്യേക വ്യാഖ്യാനം വാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. യാഗസംബന്ധമായ സ്ഥാപിത പദമായ ‘ഹോമയാഗം’ നിലനിർത്തി. ഹീബ്രുവിലെ പട്ടികഘടനയും ലിംഗ-പ്രായ നിർദ്ദേശങ്ങളും സംരക്ഷിച്ചു; ദൈർഘ്യമേറിയ വാക്യം വായനാസൗകര്യത്തിനായി കോളനും ആവർത്തിച്ച ക്രിയയും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി.
