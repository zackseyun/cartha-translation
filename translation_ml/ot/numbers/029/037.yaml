source:
  edition: WLC
  text: מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֗ם לַ/פָּ֨ר לָ/אַ֧יִל וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: ml
  text: കാളയ്ക്കും ആട്ടുകൊറ്റനും കുഞ്ഞാടുകൾക്കും, അവയുടെ എണ്ണത്തിനനുസരിച്ചുള്ള ധാന്യയാഗവും പാനീയയാഗങ്ങളും നിശ്ചിതവിധിപ്രകാരം[a] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിശ്ചയിച്ച നിയമപ്രകാരം.’ എബ്രായപദം ഈ യാഗങ്ങൾക്കായുള്ള സ്ഥാപിതമായ ചട്ടത്തെയോ നിർദേശിക്കപ്പെട്ട രീതിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה മൃഗയാഗങ്ങളോടൊപ്പം അർപ്പിക്കുന്ന ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായയിലെ ഏകവചനത്തെ മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: וְנִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങൾ
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പാനീയയാഗം’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും യാഗസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: לַפָּר
  choice: കാളയ്ക്ക്
  rationale: פַּר എന്നത് കന്നുകാലികളിൽപ്പെട്ട ആൺമൃഗമായ കാളയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ഇവിടെ പ്രായം പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: לָאַיִל
  choice: ആട്ടുകൊറ്റന്
  rationale: אַיִל എന്ന പദത്തിന്റെ യാഗപ്പട്ടികയിലെ നേരിട്ടുള്ള അർഥം ആട്ടുകൊറ്റൻ എന്നാണ്.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്ക്
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു. യാഗസന്ദർഭത്തിൽ ആൺകുഞ്ഞാടുകൾ ഉദ്ദേശിക്കപ്പെടാമെങ്കിലും ഈ വാക്യത്തിൽ ‘കുഞ്ഞാടുകൾ’ സ്വാഭാവികവും മതിയുമായ പരിഭാഷയാണ്.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: അർപ്പിക്കപ്പെടുന്ന മൃഗങ്ങളുടെ നിർദിഷ്ട എണ്ണത്തോട് അനുബന്ധയാഗങ്ങൾ പൊരുത്തപ്പെടണം എന്ന നടപടിക്രമപരമായ ആശയം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: നിശ്ചിത നിയമപ്രകാരം
  rationale: ഇവിടെ מִשְׁפָּט യാഗങ്ങൾക്കുള്ള സ്ഥാപിതമായ നിയമപരവും നടപടിക്രമപരവുമായ നിബന്ധനയെ സൂചിപ്പിക്കുന്നു. ‘നിശ്ചിത നിയമപ്രകാരം’ ആ ഔപചാരികത നിലനിർത്തുകയും മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗപരിഭാഷകൾ ഉപയോഗിച്ചു. എബ്രായവാക്യം നാമപദസമുച്ചയമായിരുന്നാലും, മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ നിർദേശവാക്യമാക്കാൻ സന്ദർഭത്തിൽ അന്തർലീനമായ ‘അർപ്പിക്കണം’ ചേർത്തു. അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന ‘നിശ്ചിത നിയമപ്രകാരം’ എന്ന പ്രയോഗത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
