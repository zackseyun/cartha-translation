id: NUM.29.12
reference: Numbers 29:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: ml
  text: ഏഴാം മാസത്തിലെ പതിനഞ്ചാം ദിവസം നിങ്ങൾക്കു വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം. പതിവ് ജോലികളൊന്നും ചെയ്യരുത്. യഹ്‌വേക്കു ഏഴു ദിവസം ഉത്സവം ആചരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ഏഴാം മാസത്തിന്റെ പതിനഞ്ചാം ദിവസം
  rationale: എബ്രായ കലണ്ടർപ്രയോഗത്തിന്റെ അർഥവും വാക്യാരംഭത്തിലെ സ്വാഭാവിക മലയാളശൈലിയും നിലനിർത്തുന്നു; പ്രത്യേകമായ 'കൂടാതെ/പിന്നെ' ഇവിടെ അനിവാര്യമല്ല.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധസഭായോഗം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധസമ്മേളനം എന്ന ആരാധനാപരമായ ആശയം സംക്ഷിപ്തവും മനസ്സിലാകുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്ക് ... ഉണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥമായ 'നിങ്ങൾക്കായി ഉണ്ടായിരിക്കും' എന്ന ഘടനയുടെ നിയമപരമായ നിർദേശസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള യാതൊരു ജോലിയും
  rationale: എല്ലാ പ്രവർത്തനവും നിരോധിക്കുന്നു എന്നതിലുപരി സാധാരണ തൊഴിൽപരമായ വേലയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; 'യാതൊരു' എന്നത് כָּל ന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: എബ്രായ നിയമനിരോധനത്തിന്റെ നിർബന്ധസ്വഭാവം നേരായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְחַגֹּתֶם חַג
  choice: ഉത്സവം ആഘോഷിക്കണം
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയ–നാമ സംയോജനത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: ല എന്ന ഉപസർഗത്തിന്റെ 'യഹ്‌വേക്കായി/യഹ്‌വെയെ ആദരിച്ച്' എന്ന ദിശയും സമർപ്പണഭാവവും സംരക്ഷിക്കുകയും ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: ഉത്സവത്തിന്റെ ദൈർഘ്യം ലളിതമായും മൂലപാഠത്തോടടുത്തും നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിൽ വായിക്കാൻ സൗകര്യമുള്ള 'യഹ്‌വേ' എന്ന രൂപം സ്വീകരിച്ചു.
- issue: מִקְרָא קֹדֶשׁ എന്ന ആരാധനാപരമായ പ്രയോഗം
  choice: വിശുദ്ധസഭായോഗം
  alternative: വിശുദ്ധ സമ്മേളനം; വിശുദ്ധ വിളിച്ചുകൂട്ടൽ
  rationale: ഇത് സ്ഥലത്തെയോ സഭാസംഘടനയെയോ മാത്രമല്ല, വിളിച്ചുകൂട്ടപ്പെട്ട വിശുദ്ധജനസമ്മേളനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ആശയം വ്യാഖ്യാനപരമായി അമിതമായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ–ആരാധനാ ശൈലി. വായനാസൗകര്യത്തിനായി മൂന്നു വാക്യങ്ങളാക്കി. പാഠത്തിൽ അടിക്കുറിപ്പുകളില്ലാത്തതിനാൽ മാർക്കറുകൾ ചേർത്തിട്ടില്ല.
