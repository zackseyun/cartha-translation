source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את לְ/כַפֵּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: ml
  text: പാപയാഗമായി ഒരു കോലാട്ടുകൊറ്റനെയും അർപ്പിക്കണം; അത് നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം വരുത്താനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്കുവേണ്ടി പാപപരിഹാരം വരുത്താനാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ഒരു കോലാട്ടുകൊറ്റനെയും
  rationale: שְׂעִיר עִזִּים എന്നത് ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; אֶחָד എണ്ണം ‘ഒന്ന്’ എന്നു വ്യക്തമാക്കുന്നു. പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന וּ മലയാളത്തിലെ ‘-യും’ കൊണ്ടു സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസംബന്ധമായ ഈ പശ്ചാത്തലത്തിൽ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְ/כַפֵּר
  choice: പ്രായശ്ചിത്തം കഴിക്കാനാണ്
  rationale: പുരോഹിതയാഗ പശ്ചാത്തലത്തിലുള്ള כפר-ന്റെ പരിഹാരപരവും ബന്ധപുനഃസ്ഥാപനപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: עֲלֵי/כֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ആർക്കുവേണ്ടിയാണ് പ്രായശ്ചിത്തം നടത്തപ്പെടുന്നത് എന്ന പ്രതിനിധാനപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യാഗസംബന്ധമായ כפר എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം കഴിക്കാൻ
  alternative: നിങ്ങൾക്കുവേണ്ടി പാപപരിഹാരം വരുത്താൻ
  rationale: എബ്രായപദം യാഗത്തിലൂടെയുള്ള പ്രായശ്ചിത്തത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രരീതി ഇവിടെ നിർവചിക്കുന്നില്ല. ‘പ്രായശ്ചിത്തം’ ആ വിശാലത നിലനിർത്തുന്നു; ‘പാപപരിഹാരം’ അർഥം വ്യക്തമാക്കുന്ന സാധുവായ മറ്റൊരു വിവർത്തനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗപട്ടികയുടെ തുടർച്ചയും ഔപചാരികമായ തിരുവെഴുത്തുശൈലിയും നിലനിർത്തി. ഒറ്റവാക്യഭാഗമായ എബ്രായരൂപം മലയാളത്തിൽ വ്യക്തമാകാൻ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘അർപ്പിക്കണം’ ചേർത്തു.
