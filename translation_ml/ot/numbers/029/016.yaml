source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ml
  text: പാപപരിഹാരയാഗമായി ഒരു ആൺകോലാടിനെ അർപ്പിക്കണം.[a] പതിവായ ദഹനയാഗവും അതിന്റെ ധാന്യയാഗവും പാനീയയാഗവും കൂടാതെയാണ് ഇത് അർപ്പിക്കേണ്ടത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശുദ്ധീകരണയാഗമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: യാഗത്തിനുള്ള മൃഗം ആൺവർഗത്തിൽപ്പെട്ട കോലാടാണെന്ന എബ്രായപ്രയോഗത്തിലെ വിവരം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ എണ്ണം സൂചിപ്പിക്കുന്ന സംഖ്യാവാചകം.
- source_word: חַטָּאת
  choice: പാപപരിഹാരയാഗം
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം പാപത്തെത്തന്നെയല്ല, അതുമായി ബന്ധപ്പെട്ട യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പരിചിതവും അർത്ഥവത്തുമായ രൂപം; ശുദ്ധീകരണയാഗം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഈ യാഗം പതിവായ അർപ്പണങ്ങൾക്ക് അധികമായാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַתָּמִיד
  choice: പതിവായ ദഹനയാഗം
  rationale: നിയമിതമായി ആവർത്തിക്കപ്പെടുന്ന സ്ഥിരമായ ദഹനയാഗത്തെ സൂചിപ്പിക്കുന്നു; 'പതിവായ' എന്നത് ആ ആവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִנְחָתָהּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിലെ מִנְחָה ധാന്യയാഗമാണ്.
- source_word: וְנִסְכָּהּ
  choice: പാനീയയാഗം
  rationale: ദഹനയാഗത്തോടൊപ്പം ഒഴിച്ചർപ്പിക്കുന്ന യാഗത്തെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിക്കുന്നു; പ്രത്യയം ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർത്ഥപരിധി
  choice: പാപപരിഹാരയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരമ്പരാഗതമായി തിരിച്ചറിയാവുന്ന പ്രധാന വിവർത്തനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുമ്പോഴും, പദം ശുദ്ധീകരണച്ചടങ്ങിനെ ഊന്നിക്കാട്ടാമെന്ന യഥാർഥ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പട്ടികയുടെ തുടർച്ചയായ ഈ വാക്യഖണ്ഡം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ 'അർപ്പിക്കണം' ചേർത്തു. എബ്രായത്തിലെ സ്ത്രീലിംഗ ഏകവചന പ്രത്യയങ്ങൾ ദഹനയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അവസാന വാക്യത്തിൽ 'ഇവ' എന്നത് ആൺകോലാടിനെയും മുൻപറഞ്ഞ ഉത്സവയാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിത രൂപമാണ്.
