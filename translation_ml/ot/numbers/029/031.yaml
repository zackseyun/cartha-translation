source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: ml
  text: പാപയാഗമായി ഒരു ആൺകോലാടും അർപ്പിക്കണം; പതിവ് ഹോമയാഗവും അതിന്റെ ധാന്യയാഗവും അതിന്റെ പാനീയാർപ്പണങ്ങളും കൂടാതെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: ആൺകോലാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപമാണിത്.
- source_word: חַטָּאת
  choice: പാപയാഗം
  rationale: ആരാധനാക്രമസന്ദർഭത്തിൽ ഇത് അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാപയാഗം’ പരിചിതവും സംക്ഷിപ്തവുമാണ്.
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഇവിടെ പറയുന്ന യാഗം പതിവായ യാഗങ്ങൾക്ക് അധികമായുള്ളതാണെന്ന് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַתָּמִיד
  choice: പതിവായുള്ള ഹോമയാഗം
  rationale: നിശ്ചിതമായി ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന ഹോമയാഗത്തെയാണ് ഈ വാക്യം സൂചിപ്പിക്കുന്നത്; ‘പതിവായുള്ള’ എന്നത് ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִנְחָתָהּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: യാഗപ്പട്ടികകളിൽ מִנְחָה അനുബന്ധ ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രത്യയം ഹോമയാഗത്തിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: וּנְסָכֶיהָ
  choice: പാനീയയാഗങ്ങൾ
  rationale: ഒഴിച്ചുപകരുന്ന പാനീയാർപ്പണങ്ങളെയാണ് ഈ ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്; ‘പാനീയയാഗങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പദത്തിന് പാപപരിഹാരവും ആചാരപരമായ ശുദ്ധീകരണവും ഉൾക്കൊള്ളുന്ന അർത്ഥവ്യാപ്തിയുണ്ട്. മുഖ്യപാഠത്തിൽ പരിചിതമായ ‘പാപയാഗം’ നിലനിർത്തി മറ്റൊരു സാധുവായ അർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഹീബ്രു വാക്യത്തിലെ പട്ടികാസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ്-അടയാളങ്ങളുടെ സ്ഥാനവൈരുധ്യം പിന്തുടരാതെ, ഓരോ അടിക്കുറിപ്പും അതിനൊത്ത പദത്തിൽ ചേർത്തു.
