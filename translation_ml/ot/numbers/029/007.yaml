  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: ml
  text: ഈ ഏഴാം മാസത്തിന്റെ പത്താം ദിവസം നിങ്ങൾക്കു ഒരു വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം. നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം[a]; ഒരു ജോലിയും ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെത്തന്നെ താഴ്ത്തണം’ അല്ലെങ്കിൽ ‘നിങ്ങൾ ആത്മനിഷേധം അനുഷ്ഠിക്കണം.’ ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘നിങ്ങളുടെ പ്രാണങ്ങളെ കഷ്ടപ്പെടുത്തണം’ എന്നാണ്. ഇത് ആത്മനിഷേധത്തെ, പ്രത്യേകിച്ച് ഉപവാസത്തെ, സൂചിപ്പിക്കുന്ന ഒരു ആചാരപരമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: പത്താം ദിവസം
  rationale: പൂർവപ്രത്യയത്തോടുകൂടിയ സംഖ്യ കലണ്ടറിലെ തീയതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലസൂചന വ്യക്തമാക്കാൻ ‘ദിവസം’ ചേർത്തു.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ഈ ഏഴാം മാസത്തിന്റെ
  rationale: മാസത്തിന്റെ ക്രമവും הַזֶּה എന്ന നിർദേശകപദവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധ സഭായോഗം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന ആരാധനാപരമായ വിശുദ്ധ സംഗമം എന്ന ആശയം ‘സഭായോഗം’ വ്യക്തമാക്കുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: ജനത്തിന് ആ ദിവസം ഉണ്ടായിരിക്കേണ്ട വിശുദ്ധ സംഗമത്തെ സൂചിപ്പിക്കുന്ന ദാതൃപ്രയോഗവും നിയമനിർദേശത്തിന്റെ ബലവും നിലനിർത്തുന്നു.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം
  rationale: ആചാരപരമായ ആത്മനിഷേധത്തെയും താഴ്മയെയും സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അതിനെ ഉപവാസം എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: נַפְשֹׁתֵיכֶם
  choice: നിങ്ങളെത്തന്നെ
  rationale: അക്ഷരാർഥത്തിലെ ‘നിങ്ങളുടെ ജീവൻ/പ്രാണൻ’ എന്നത് ഈ പ്രയോഗത്തിൽ മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പ്രതിഫലക രൂപം അനാവശ്യമായ ദേഹി-ദേഹം ദ്വൈതസൂചന ഒഴിവാക്കുന്നു.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: ഒരു ജോലിയും ചെയ്യരുത്
  rationale: כָּל സഹിതമുള്ള സമഗ്ര നിരോധനം മലയാളത്തിലെ സ്വാഭാവികമായ നിയമനിർദേശരൂപത്തിൽ പൂർണമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם എന്ന ആചാരപരമായ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ കഷ്ടപ്പെടുത്തണം
  alternative: നിങ്ങൾ നിങ്ങളെത്തന്നെ താഴ്ത്തണം / നിങ്ങൾ ആത്മനിഷേധം അനുഷ്ഠിക്കണം
  rationale: ‘കഷ്ടപ്പെടുത്തണം’ എന്നത് അനുതാപപരവും ആചാരപരവുമായ ശക്തി നിലനിർത്തുന്നു. ‘താഴ്ത്തണം’ എന്നത് ആശയം മൃദുവാക്കാം; ‘ആത്മനിഷേധം അനുഷ്ഠിക്കണം’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്. ഉപവാസം ഈ പ്രയോഗവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും വാക്യം അതിനെ മാത്രമായി വ്യക്തമാക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അങ്ങനെ ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘വിശുദ്ധ സഭായോഗം’ ആരാധനാപരമായ ഔപചാരിക സംഗമത്തെ സൂചിപ്പിക്കുന്നു; ‘കഷ്ടപ്പെടുത്തണം’ എന്ന അപരിചിതത്വം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചുകൊണ്ട് മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി സംരക്ഷിച്ചു.
