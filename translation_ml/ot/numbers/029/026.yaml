source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: ml
  text: 'അഞ്ചാം ദിവസം: ഒൻപത് കാളകൾ, രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ളതും ഊനമില്ലാത്തതുമായ പതിനാലു ആൺകുഞ്ഞാടുകൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: അഞ്ചാം ദിവസം
  rationale: ആരംഭത്തിലെ സംയോജകമായ וּ തുടർച്ച സൂചിപ്പിക്കുന്നുവെങ്കിലും, ബലിയർപ്പണങ്ങളുടെ ക്രമബദ്ധമായ പട്ടികയിൽ സ്വാഭാവികമായ മലയാളത്തിനായി അത് മുഖ്യപാഠത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തിട്ടില്ല; കാലസൂചന പൂർണമായി നിലനിൽക്കുന്നു.
- source_word: פָּרִים תִּשְׁעָה
  choice: ഒൻപത് കാളകൾ
  rationale: യാഗസന്ദർഭത്തിൽ פָּרִים കാളകളെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യം മാത്രം പ്രായം വ്യക്തമാക്കാത്തതിനാൽ ‘ഇളങ്കാളകൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: אֵילִם שְׁנָיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: אַיִל എന്ന പദത്തിന്റെ ബഹുവചനം യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ആട്ടുകൊറ്റന്മാർ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: പതിനാല് ആൺകുഞ്ഞാടുകൾ
  rationale: כֶּבֶשׂ യാഗസന്ദർഭത്തിൽ ആൺകുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന വ്യക്തമാക്കി.
- source_word: בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള
  rationale: മൃഗങ്ങളുടെ പ്രായം സൂചിപ്പിക്കുന്ന ഈ എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: യാഗമൃഗങ്ങൾക്ക് ദേഹവൈകല്യമോ ന്യൂനതയോ ഇല്ലാത്ത അവസ്ഥയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘പൂർണതയുള്ളവ’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ യാഗസന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമപരവും ആരാധനാസംബന്ധവുമായ പട്ടികയുടെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു. സംഖ്യകളും മൃഗങ്ങളുടെ ഇനവും പ്രായവും ദോഷരാഹിത്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
