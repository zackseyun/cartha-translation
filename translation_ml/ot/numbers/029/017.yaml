  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: ml
  text: 'രണ്ടാം ദിവസം: കന്നുകാലിക്കൂട്ടത്തിൽ നിന്നുള്ള കാളകൾ പന്ത്രണ്ട്[a], ആൺചെമ്മരിയാടുകൾ രണ്ട്, ന്യൂനതയില്ലാത്ത ഒരു വയസ്സുള്ള കുഞ്ഞാടുകൾ പതിനാല്—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘കന്നുകാലികളുടെ പുത്രന്മാരായ പന്ത്രണ്ട് കാളകൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
