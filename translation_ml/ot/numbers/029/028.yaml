translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസാങ്കേതിക പദങ്ങൾ കൃത്യമായി നിലനിർത്തി; വാക്യബന്ധം സ്വാഭാവികമാക്കാൻ അവസാനത്തിൽ ‘അർപ്പിക്കണം’ എന്നും ‘പുറമേയാണിത്’ എന്നും വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
