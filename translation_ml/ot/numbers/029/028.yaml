source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ml
  text: പാപയാഗത്തിനായി ഒരു ആൺകോലാടും അർപ്പിക്കണം; പതിവായ ദഹനയാഗത്തിനും[a] അതിന്റെ ധാന്യയാഗത്തിനും പാനീയയാഗത്തിനും[b] പുറമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പതിവായ ദഹനയാഗം’ എന്നതിന് ‘നിരന്തരമായ ദഹനയാഗം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പാനീയയാഗം’ എന്നതിന് ‘പാനീയാർപ്പണം’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שָׂעִיר ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; ו പട്ടികയിലെ തുടർച്ച അടയാളപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ ‘-നെയും’ ഉപയോഗിച്ചു.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ എണ്ണം മൂലപാഠം വ്യക്തമായി നൽകുന്നതിനാൽ നിലനിർത്തി.
- source_word: מִ/לְּ/בַד
  choice: പുറമേയാണിത്
  rationale: ഈ യാഗം പതിവായ യാഗക്രമത്തിനു പുറമേ അധികമായി അർപ്പിക്കേണ്ടതാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת
  choice: ദഹനയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള അംഗീകൃതവും കൃത്യവുമായ മലയാള പദം.
- source_word: הַ/תָּמִיד
  choice: പതിവായ
  rationale: תָּמִיד നിർദേശിക്കപ്പെട്ട തുടർച്ചയായ/പതിവായ യാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ദിവസേനയുള്ള’ എന്ന് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: וּ/מִנְחָתָ/הּ
  choice: അതിന്റെ ധാന്യയാഗത്തിനും
  rationale: പുരോഹിതയാഗപ്പട്ടികകളിൽ מִנְחָה അനുബന്ധ ധാന്യയാഗമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
- source_word: וְ/נִסְכָּ/הּ
  choice: പാനീയയാഗത്തിനും
  rationale: נֶסֶךְ യാഗസന്ദർഭത്തിൽ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗമാണ്; പ്രത്യയം ദഹനയാഗത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നു.
