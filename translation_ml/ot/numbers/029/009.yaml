  revised_text: 'അവയ്ക്കുള്ള ധാന്യയാഗം: എണ്ണ കലർത്തിയ നേർമാവ്—കാളയ്ക്കു പത്തിലൊന്ന് അളവിന്റെ മൂന്ന്, ഒരു ആട്ടുകൊറ്റന് പത്തിലൊന്ന് അളവിന്റെ രണ്ട്.[a]'
