translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, യാഗനിയമത്തിന്റെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യവുമായി തുടർച്ചയുള്ളതാണെങ്കിലും മലയാളത്തിൽ നിർദ്ദേശത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ “അർപ്പിക്കണം” ചേർത്തു; അളവിന്റെ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
