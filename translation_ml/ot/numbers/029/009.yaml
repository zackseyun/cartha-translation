source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: ml
  text: 'അവയ്ക്കുള്ള ധാന്യയാഗം: എണ്ണ കലർത്തിയ നേർമാവ്—കാളയ്ക്കു പത്തിലൊന്ന് അളവിന്റെ മൂന്ന്, ഒരു ആട്ടുകൊറ്റന് പത്തിലൊന്ന് അളവിന്റെ രണ്ട്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പത്തിലൊന്ന് അളവ്” എന്നത് പരമ്പരാഗതമായി ഒരു ഏഫായുടെ പത്തിലൊന്നായി മനസ്സിലാക്കപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു; 3mp പ്രത്യയം മുൻവാക്യത്തിലെ യാഗമൃഗങ്ങളെയാണ് പരാമർശിക്കുന്നത്.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിച്ച നന്നായി അരച്ച ഉയർന്ന ഗുണമേന്മയുള്ള മാവിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയ തയ്യാറെടുപ്പ് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: പത്തിലൊന്ന് അളവിൽ മൂന്നും
  rationale: עִשָּׂרוֹן എന്നത് ഒരു പത്തിലൊന്ന് അളവാണ്; മൂലപാഠത്തിലെ അളവുരൂപം വ്യാഖ്യാനിച്ച് ഏഫാ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: לַפָּר
  choice: കാളയ്ക്കു
  rationale: നിർദ്ദിഷ്ട ഏകവചന രൂപം മുമ്പ് പറഞ്ഞ കാളയെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: പത്തിലൊന്ന് അളവിൽ രണ്ടും
  rationale: മൂലത്തിലെ അളവുപദവും സംഖ്യയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָאַיִל הָאֶחָד
  choice: ഏക ആട്ടുകൊറ്റന്
  rationale: הָאֶחָד എന്ന നിർദ്ദിഷ്ട സംഖ്യാവിശേഷണം പട്ടികയിലെ ഒരേയൊരു ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്നു; ആ പ്രത്യേകത പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
