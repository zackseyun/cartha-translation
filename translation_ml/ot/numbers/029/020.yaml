lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: മൂന്നാം ദിവസത്തിൽ
  rationale: ഉത്സവയാഗങ്ങളുടെ തുടർച്ചയായ പട്ടികയിൽ അടുത്ത ദിവസത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പട്ടികയുടെ തുടർച്ച വ്യക്തമാകുന്നതിനാൽ ഹീബ്രുവിലെ വാവിന് പ്രത്യേകമായി ‘കൂടാതെ’ ചേർക്കേണ്ടതില്ല.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: പതിനൊന്ന് കാളകൾ
  rationale: യാഗസന്ദർഭത്തിലെ פָּרִים എന്ന പദത്തിന് വ്യക്തവും സാധാരണവുമായ മലയാള തുല്യം ‘കാളകൾ’ ആണ്; മൂലപാഠം പ്രായം പ്രത്യേകം പറയാത്തതിനാൽ ‘ഇളം’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: אֵילִם שְׁנָיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്ന പതിവ് യാഗപദത്തിന്റെ വ്യക്തമായ മലയാള പരിഭാഷ.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ഒരു വയസ്സുള്ള പതിനാല് കുഞ്ഞാടുകൾ
  rationale: בְּנֵי שָׁנָה എന്ന ഹീബ്രു പ്രയോഗം മൃഗങ്ങൾക്ക് ‘ഒരു വയസ്സുള്ള’ എന്നാണ്; പദക്രമം സ്വാഭാവിക മലയാളത്തിന് അനുസരിച്ചിരിക്കുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഈ പദം ശാരീരിക വൈകല്യമോ ദോഷമോ ഇല്ലാത്ത മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘പൂർണതയുള്ളവ’ എന്നതിനെക്കാൾ ‘ഊനമില്ലാത്തവ’ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: വാക്യാവസാനത്തെ תְּמִימִם ഏതു മൃഗങ്ങളെ വിശേഷിപ്പിക്കുന്നു
  choice: പട്ടികയിലെ എല്ലാ മൃഗങ്ങൾക്കും ബാധകമെന്നു ‘എല്ലാം’ ഉപയോഗിച്ച് വ്യക്തമാക്കി
  alternative: അവസാനമായി പറഞ്ഞ കുഞ്ഞാടുകൾക്ക് മാത്രം വിശേഷണം ചേർക്കുക
  rationale: യാഗമൃഗങ്ങളുടെ മുഴുവൻ പട്ടികയ്ക്കും ബാധകമായ സമാപനയോഗ്യതയായി ഈ ബഹുവചന വിശേഷണം വരുന്നു; സമാന യാഗപ്പട്ടികകളിലെ ഘടനയും ഇതിനെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ക്രിയാരഹിതമായ യാഗപ്പട്ടികയുടെ സ്വഭാവം നിലനിർത്താൻ പുതിയ ക്രിയ ചേർത്തിട്ടില്ല.
