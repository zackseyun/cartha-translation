  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: ml
  text: 'മൂന്നാം ദിവസത്തിൽ: പതിനൊന്ന് കാളകൾ, രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ളതും ഊനമില്ലാത്തതുമായ[a] പതിനാല് കുഞ്ഞാടുകൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദോഷമില്ലാത്ത.’ യാഗത്തിനുള്ള മൃഗങ്ങൾക്ക് ശാരീരിക വൈകല്യമോ കുറവോ ഇല്ലാത്തതിനെ ഹീബ്രു പദം സൂചിപ്പിക്കുന്നു.
