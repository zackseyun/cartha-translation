  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: ml
  text: എട്ടാം ദിവസം നിങ്ങൾക്കൊരു സമാപനസമ്മേളനം[a] ഉണ്ടായിരിക്കണം; സാധാരണ ജോലിയൊന്നും ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഗൗരവമേറിയ ഒരു സമ്മേളനം.” എബ്രായപദമായ עֲצֶרֶת ഒരു ഉത്സവത്തിന്റെ സമാപനസമ്മേളനത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: എട്ടാം ദിവസം
  rationale: നിർദിഷ്ടമായ ക്രമസംഖ്യയും കല്പന ബാധകമാകുന്ന സമയവും സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: עֲצֶרֶת
  choice: വിശുദ്ധമായ ഒരു സമാപനസമ്മേളനം
  rationale: ഉത്സവത്തിന്റെ സമാപനഘട്ടത്തിലെ വിശുദ്ധ സമ്മേളനം എന്ന ആശയം സന്ദർഭം സൂചിപ്പിക്കുന്നു. 'സമാപനസമ്മേളനം' മൂലപദത്തിന്റെ സമാപനസ്വഭാവം നൽകുമ്പോൾ 'വിശുദ്ധമായ' എന്നത് ആചാരപരമായ ഗൗരവം വ്യക്തമാക്കുന്നു; പദത്തിന്റെ പരിഭാഷാവികല്പം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תִּהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥമായ 'നിങ്ങൾക്കായി ഉണ്ടായിരിക്കണം' എന്ന ഘടനയുടെ അസ്തിത്വപരവും നിർദേശാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള യാതൊരു ജോലിയും
  rationale: വിശുദ്ധദിവസത്തിൽ വിലക്കപ്പെടുന്ന സാധാരണ ഉപജീവനപരമായ തൊഴിലാണ് ഉദ്ദേശ്യം; എല്ലാ തരത്തിലുള്ള പ്രവർത്തനവും നിരോധിക്കുന്നു എന്ന അതിവ്യാപക അർഥം ഒഴിവാക്കുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നിയമപരമായ നിരോധനം മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: עֲצֶרֶת എന്ന ഉത്സവപദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധമായ ഒരു സമാപനസമ്മേളനം
  alternative: ഗൗരവമേറിയ ഒരു സമ്മേളനം
  rationale: എട്ടാം ദിവസത്തെ വിശുദ്ധ ഉത്സവസമ്മേളനവും അതിന്റെ സമാപനസ്വഭാവവും അറിയിക്കുന്നു; പിൽക്കാല മതാചാരപരമായ തിരിച്ചറിയലുകളൊന്നും വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. മൂലപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: מְלֶאכֶת עֲבֹדָה എന്ന തൊഴിൽവിലക്കിന്റെ വ്യാപ്തി
  choice: പതിവുള്ള യാതൊരു ജോലിയും
  alternative: അധ്വാനമുള്ള യാതൊരു ജോലിയും
  rationale: ഈ ഉത്സവനിയമസന്ദർഭത്തിൽ സാധാരണ തൊഴിൽപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി എടുത്തിരിക്കുന്നു; 'അധ്വാനമുള്ള' എന്നു പറഞ്ഞാൽ കഠിനതയുടെ അളവു മാത്രമാണ് മാനദണ്ഡമെന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ഉത്സവപരമായ വിശുദ്ധസ്വഭാവം വ്യക്തമാക്കുമ്പോഴും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
