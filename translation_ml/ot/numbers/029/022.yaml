source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: ml
  text: പാപയാഗത്തിനായി ഒരു ആൺകോലാടും, നിരന്തരമായ[a] ഹോമയാഗത്തിനും അതിന്റെ ധാന്യയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പതിവായ ഹോമയാഗം.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായപാഠത്തിൽ ‘അതിന്റെ ധാന്യയാഗവും അതിന്റെ പാനീയയാഗവും’; ‘അതിന്റെ’ എന്നത് നിരന്തരമായ ഹോമയാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שָׂעִיר ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; וּ എന്ന ബന്ധകവും അർപ്പണപ്പട്ടികയിലെ തുടർച്ചയും മലയാളത്തിലെ ‘-നെയും’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസംബന്ധമായ ഈ സന്ദർഭത്തിൽ חַטָּאת അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ എണ്ണം വ്യക്തമാക്കുന്ന സംഖ്യാവാചകം നിലനിർത്തുന്നു.
- source_word: מִ/לְּ/בַד
  choice: പുറമേയാണ്
  rationale: ഈ യാഗം പതിവായ യാഗസമുച്ചയത്തിന് അധികമാണെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: עֹלַת
  choice: ഹോമയാഗം
  rationale: עֹלָה എന്ന യാഗപദത്തിന് മലയാള ബൈബിൾ-ആരാധനാ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായ സമാനപദമാണ് ‘ഹോമയാഗം’.
- source_word: הַ/תָּמִיד
  choice: നിരന്തരമായ
  rationale: תָּמִיד ഇവിടെ നിശ്ചിതമായി ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന ഹോമയാഗത്തെ വിശേഷിപ്പിക്കുന്നു; ‘നിരന്തരമായ’ എന്നത് ഈ അർത്ഥം നിലനിർത്തുന്നു, ‘പതിവായ’ എന്നതും സാധ്യമാണ്.
- source_word: וּ/מִנְחָתָהּ
  choice: അതോടൊപ്പമുള്ള ഭോജനയാഗത്തിനും
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹോമയാഗത്തിലേക്കു തിരിഞ്ഞുനിൽക്കുന്നതിനാൽ ‘അതോടൊപ്പമുള്ള’ എന്നു വ്യക്തമാക്കി.
- source_word: וְ/נִסְכָּהּ
  choice: പാനീയയാഗത്തിനും
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യയം ഹോമയാഗത്തോടുള്ള അനുബന്ധബന്ധം പങ്കിടുന്നു.
