translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന വിധം യാഗസംബന്ധമായ സ്ഥാപിത പദങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രു വാക്യത്തിന്റെ ഏകവാക്യഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; യാഗങ്ങളുടെ കൂട്ടിച്ചേർക്കൽബന്ധം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
