lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שׂעיר עזים എന്നത് യാഗസന്ദർഭത്തിലെ പതിവുപ്രയോഗമായി ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; אֶחָד എണ്ണം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗനിയമങ്ങളുടെ സന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִ/לְּ/בַד
  choice: പുറമേയാണിത്
  rationale: ഈ യാഗം പതിവായ യാഗസമുച്ചയത്തിന് അധികമാണെന്ന് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: עֹלַת הַ/תָּמִיד
  choice: പതിവായുള്ള ഹോമയാഗം
  rationale: തുടർച്ചയായി നിശ്ചിതക്രമത്തിൽ അർപ്പിക്കുന്ന ഹോമയാഗമാണ് ഉദ്ദേശ്യം; ‘പതിവായുള്ള’ എന്നത് ആ ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וּ/מִנְחָתָ/הּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: യാഗനിയമങ്ങളിൽ מִנְחָה അനുബന്ധ ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു; ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം ഹോമയാഗത്തിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: അവയുടെ പാനീയയാഗങ്ങൾ
  rationale: എബ്രായത്തിലെ നാമവും പ്രത്യയവും ബഹുവചനമായതിനാൽ ആ രൂപം നിലനിർത്തി; ഇത് നിർദേശിച്ച യാഗസമുച്ചയത്തോടു ചേർന്ന പാനീയയാഗങ്ങളെ സൂചിപ്പിക്കാം.
