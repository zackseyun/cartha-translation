translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസാങ്കേതികപദങ്ങൾക്ക് ‘ഹോമയാഗം’, ‘ധാന്യയാഗം’, ‘പാനീയയാഗം’, ‘പാപയാഗം’ എന്നിവ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ഏകവചനവും ബഹുവചനവും തമ്മിലുള്ള അസമത്വം തിരുത്താതെ നിലനിർത്തി, അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
