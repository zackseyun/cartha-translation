- from: ഏഴ് കുഞ്ഞാടുകളിൽ ഓരോന്നിനും പത്തിലൊന്നുവീതം[a].
  to: ഏഴ് കുഞ്ഞാടുകൾക്കായി, ഓരോന്നിനും പത്തിലൊന്ന് വീതം[a].
  rationale: The revision directly represents both Hebrew prepositional phrases—‘for the seven lambs’ and ‘for each one’—while retaining the source’s distributive force. It does not add ‘എഫാ’ to the main text, since that measure is understood from sacrificial usage rather than stated here. The footnote is retained and made more idiomatic.
