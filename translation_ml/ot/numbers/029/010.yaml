  text: ഏഴ് കുഞ്ഞാടുകൾക്കായി, ഓരോന്നിനും പത്തിലൊന്ന് വീതം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘പത്തിലൊന്ന്, പത്തിലൊന്ന്’ എന്നാണ്. യാഗനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഇത് സാധാരണയായി ധാന്യത്തിന്റെ അളവായ ഒരു എഫായുടെ പത്തിലൊന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: പത്തിലൊന്നുവീതം
  rationale: 'ആവർത്തിച്ചിരിക്കുന്ന അളവുപദം വിതരണാർഥം നൽകുന്നു: ഓരോ മൃഗത്തിനും പത്തിലൊന്ന്. എഫാ എന്ന അളവിന്റെ പേര് ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോന്നിനും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു കുഞ്ഞാടിന്’ എന്നാണെങ്കിലും, ഏഴ് കുഞ്ഞാടുകൾക്കിടയിൽ അളവ് വിഭജിച്ചുനൽകുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ വിതരണാർഥം ‘ഓരോന്നിനും’ എന്നാണ്.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ഏഴ് കുഞ്ഞാടുകളിൽ
  rationale: ഈ അളവ് ബാധകമായ മുഴുവൻ കൂട്ടം ഏഴ് കുഞ്ഞാടുകളാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ മുൻനിർത്തിയ ഈ ഘടന അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി മൂലത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
