  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ പ്രയോഗം. മൂലത്തിലെ വിതരണാർഥം ‘വീതം’കൊണ്ട് പ്രകടമാക്കി; മൂലത്തിൽ തുറന്നുപറയാത്ത ‘എഫാ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
