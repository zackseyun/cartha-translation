id: NUM.29.21
reference: Numbers 29:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: ml
  text: കാളകൾക്കും ആട്ടുകൊറ്റന്മാർക്കും കുഞ്ഞാടുകൾക്കും അവയുടെ എണ്ണത്തിനനുസരിച്ച്, നിശ്ചിത ചട്ടപ്രകാരം[a], ധാന്യയാഗങ്ങളും പാനീയയാഗങ്ങളും അർപ്പിക്കണം;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിർദിഷ്ട നടപടിക്രമപ്രകാരം.’ എബ്രായപദം ഈ യാഗങ്ങൾക്കായി സ്ഥാപിക്കപ്പെട്ട ആചാരനിയമത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ധാന്യയാഗങ്ങളും
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ദഹനയാഗത്തോടൊപ്പം അർപ്പിക്കുന്ന ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. പട്ടികയിലെ പല മൃഗങ്ങൾക്കുമുള്ള അനുബന്ധ യാഗങ്ങളായതിനാൽ മലയാളത്തിൽ ബഹുവചനം സ്വാഭാവികമാണ്.
- source_word: נִסְכֵּיהֶם
  choice: പാനീയയാഗങ്ങളും
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗമാണ്; ‘പാനീയയാഗം’ ആചാരപരമായ അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: לַפָּרִים
  choice: കാളകൾക്കും
  rationale: פָּרִים യാഗപ്പട്ടികയിൽ കാളകളെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ പ്രായം പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘ഇളം’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: לָאֵילִם
  choice: ആട്ടുകൊറ്റന്മാർക്കും
  rationale: אַיִל യാഗസന്ദർഭത്തിൽ ആൺചെമ്മരിയാടായ ആട്ടുകൊറ്റനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְלַכְּבָשִׂים
  choice: കുഞ്ഞാടുകൾക്കും
  rationale: כֶּבֶשׂ കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ ലിംഗം പ്രത്യേകം വ്യക്തമാക്കേണ്ട ആവശ്യമില്ല.
- source_word: בְּמִסְפָּרָם
  choice: അവയുടെ എണ്ണത്തിനനുസരിച്ച്
  rationale: ഓരോ മൃഗവിഭാഗത്തിനും നിർദേശിച്ചിരിക്കുന്ന എണ്ണവുമായി അനുബന്ധ യാഗങ്ങൾ പൊരുത്തപ്പെടണമെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: כַּמִּשְׁפָּט
  choice: നിശ്ചിത ചട്ടപ്രകാരം
  rationale: מִשְׁפָּט ഇവിടെ യാഗങ്ങൾക്കുള്ള സ്ഥാപിതമായ ആചാരനിയമത്തെയോ നിർദിഷ്ട നടപടിക്രമത്തെയോ സൂചിപ്പിക്കുന്നു; ‘നിശ്ചിത ചട്ടം’ അതിന്റെ നിയമപരവും ആചാരപരവുമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഔപചാരികവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം ഉപയോഗിച്ചു. എബ്രായവാക്യത്തിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യങ്ങളിൽനിന്ന് മനസ്സിലാകുന്ന അർപ്പണനിർദേശം മലയാളത്തിൽ പൂർണവാക്യമാക്കാൻ ‘അർപ്പിക്കണം’ എന്നു ചേർത്തു.
