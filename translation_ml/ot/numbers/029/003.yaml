  terminology: ‘ധാന്യയാഗം,’ ‘എണ്ണ ചേർത്ത,’ ‘ഏഫ,’ ‘കാള,’ and ‘ആട്ടുകൊറ്റൻ’ are suitable modern-standard Malayalam equivalents in this sacrificial context. The footnote appropriately explains the tenth-of-an-ephah measure.
