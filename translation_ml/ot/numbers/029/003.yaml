translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗനിയമ ശൈലി. അളവിന്റെ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കിയെങ്കിലും പുരാതന അളവിന്റെ സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആദ്യ അളവിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
