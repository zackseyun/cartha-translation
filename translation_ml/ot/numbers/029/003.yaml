  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: ml
  text: 'അവയുടെ ധാന്യയാഗം എണ്ണ ചേർത്ത നേർമാവായിരിക്കണം: കാളയ്ക്ക് ഒരു ഏഫയുടെ പത്തിലൊന്ന് അളവുള്ള മൂന്ന് അളവുകളും[a] ആട്ടുകൊറ്റന് ഒരു ഏഫയുടെ പത്തിലൊന്ന് അളവുള്ള രണ്ട് അളവുകളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂന്ന് അളവുകൾ’, ‘രണ്ട് അളവുകൾ’ എന്നിവയിലെ ഓരോ അളവും ഒരു ഏഫയുടെ പത്തിലൊന്നാണ്. ഏഫ പുരാതന ഇസ്രായേലിൽ ഉണങ്ങിയ വസ്തുക്കൾ അളക്കാൻ ഉപയോഗിച്ചിരുന്ന അളവായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: അവയുടെ ധാന്യയാഗമായി … അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിർദേശാർഥത്തിൽ അവതരിപ്പിച്ചു; ബഹുവചന പ്രത്യയം മുൻവാക്യത്തിലെ യാഗമൃഗങ്ങളോടു ബന്ധിപ്പിച്ച് ‘അവയുടെ’ എന്നു നിലനിർത്തി.
- source_word: סֹלֶת
  choice: നേർമയുള്ള മാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിച്ച നന്നായി അരച്ച ഉന്നതഗുണമുള്ള മാവാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക വായനക്കാർക്ക് ഗ്രാഹ്യമായ സ്വാഭാവിക മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയുള്ള തയ്യാറാക്കൽ വ്യക്തമാക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവ്
  rationale: עִשָּׂרוֹן എന്നത് ഏഫയുടെ പത്തിലൊന്നായ അളവാണ്. ‘മൂന്ന് പത്തിലൊന്ന്’ എന്ന ആശയക്കുഴപ്പമുള്ള ചുരുക്കത്തേക്കാൾ അളവിന്റെ സ്വഭാവവും എണ്ണവും മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കി.
- source_word: לַפָּר
  choice: കാളയ്ക്ക്
  rationale: യാഗസന്ദർഭത്തിലെ פַּר എന്ന ഏകവചനത്തെ ലളിതമായി നിലനിർത്തുന്നു; ‘ഓരോ’ എന്നത് മൂലപാഠത്തിൽ പ്രകടമല്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവ്
  rationale: അളവിന്റെ അടിസ്ഥാനഘടകമായ ഏഫയുടെ പത്തിലൊന്ന് തുറന്നുപറഞ്ഞ് ഹീബ്രുവിലെ സംഖ്യ കൃത്യമായി നിലനിർത്തി.
- source_word: לָאָיִל
  choice: ആട്ടുകൊറ്റന്
  rationale: യാഗസന്ദർഭത്തിലെ אַיִל എന്ന ഏകവചനത്തിന് സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ തുല്യപദം.
