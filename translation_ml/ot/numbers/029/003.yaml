    rationale: וּמִנְחָתָם introduces ‘their grain offering,’ followed by its specified substance and amounts. It is better rendered as ‘their grain offering shall be...,’ rather than as an imperative to offer flour ‘as’ a grain offering.
  - severity: low
    issue: 'The quantified nouns are singular: ‘മൂന്ന് അളവ്’ and ‘രണ്ട് അളവ്.’'
    rationale: In this explicit expanded formulation, plural ‘അളവുകൾ’ is grammatically natural and avoids an awkward construction.
