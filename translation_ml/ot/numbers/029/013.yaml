source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: ml
  text: 'നിങ്ങൾ യഹോവയ്ക്ക് ഹോമയാഗമായി, അഗ്നിയർപ്പണമായി, പ്രസാദകരമായ സുഗന്ധമായി[a] അർപ്പിക്കേണ്ടത്: കന്നുകാലിക്കൂട്ടത്തിൽനിന്നുള്ള പതിമൂന്ന് കാളകൾ, രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള പതിനാല് ആൺകുഞ്ഞാടുകൾ; ഇവ ഊനമില്ലാത്തവയായിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രസാദകരമായ സുഗന്ധം” എന്നത് യാഗം യഹോവയ്ക്ക് സ്വീകാര്യമാണെന്ന് സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്. “ശാന്തിദായകമായ സുഗന്ധം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: നിങ്ങൾ ... അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ ഹിഫീൽ രൂപം ‘സമർപ്പിക്കുക/അർപ്പിക്കുക’ എന്നാണ്; ആധുനിക മലയാളത്തിൽ ‘അർപ്പിക്കണം’ സ്വാഭാവികവും ആരാധനാസംബന്ധിയായ അർഥം വ്യക്തവുമാണ്.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ സാങ്കേതികപദം.
- source_word: אִשֵּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: അഗ്നിയിലൂടെ അർപ്പിക്കപ്പെടുന്ന യാഗം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു; ‘ഭോജനയാഗം’ എന്ന വിവാദ വ്യുത്പത്തിപരമായ വായന ഒഴിവാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: ദൈവസന്നിധിയിൽ യാഗം സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוהയെ വ്യക്തിപരമായ ഉടമ്പടിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ... കാളകൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കന്നുകാലികളുടെ പുത്രന്മാർ’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കി മൃഗവിഭാഗം സംരക്ഷിക്കുന്നു; പ്രായം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֵילִם
  choice: ആട്ടുകൊറ്റന്മാർ
  rationale: യാഗപ്പട്ടികയിലെ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സ് പ്രായമുള്ള ... ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്ന ലിംഗനിർദ്ദിഷ്ടതയും בְּנֵי שָׁנָה എന്ന പ്രായവിവരവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: യാഗമൃഗങ്ങൾക്ക് ശാരീരിക വൈകല്യമോ ദോഷമോ ഇല്ലായ്മയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: ദൈവനാമമായ יהוהയുടെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ഉടമ്പടിനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സുഗന്ധം
  alternative: ശാന്തിദായകമായ സുഗന്ധം; സ്വീകാര്യമായ യാഗം
  rationale: ഹീബ്രുവിലെ സുഗന്ധദൃശ്യഭാഷ സംരക്ഷിക്കുമ്പോൾ ദൈവത്തിന് പ്രസാദകരം/സ്വീകാര്യം എന്ന ആശയവും അറിയിക്കുന്നു; അതിനെ വെറും അമൂർത്തമായ ‘സ്വീകാര്യത’യായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യാഗസാങ്കേതികപദമായി ‘ഹോമയാഗം’ നിലനിർത്തി; പട്ടികയുടെ ഔപചാരികതയും സംഖ്യാവിവരങ്ങളും കൃത്യമായി സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
