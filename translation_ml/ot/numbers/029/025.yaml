id: NUM.29.25
reference: Numbers 29:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: ml
  text: പാപയാഗമായി ഒരു ആൺകോലാടിനെയും അർപ്പിക്കണം; പതിവായുള്ള ഹോമയാഗം[a] അതിന്റെ ധാന്യയാഗവും പാനീയയാഗവും കൂടാതെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരന്തരമായ ഹോമയാഗം.’
    reason: תָּמִיד എന്ന പദത്തിന് ‘പതിവായുള്ള’ എന്നും ‘നിരന്തരമായ’ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന അർത്ഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שׂעיר עזים ബലിക്കുള്ള ആൺകോലാടിനെ സൂചിപ്പിക്കുന്ന പതിവുപദപ്രയോഗമാണ്; אֶחָד എണ്ണം വ്യക്തമാക്കുന്നു. ‘ആൺകോലാട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: ഈ യാഗസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപവുമായി ബന്ധപ്പെട്ട ബലിയെ സൂചിപ്പിക്കുന്നു. ‘പാപയാഗം’ സംക്ഷിപ്തവും സുലഭവുമായ യാഗപരിഭാഷയാണ്.
- source_word: מִ/לְּ/בַד
  choice: പുറമേ
  rationale: മുമ്പ് നിർദേശിച്ച പതിവുയാഗങ്ങൾക്കു പുറമേ ഈ ബലിയും അർപ്പിക്കണമെന്ന കൂട്ടിച്ചേർക്കൽ വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַ/תָּמִיד
  choice: പതിവായുള്ള ഹോമയാഗം
  rationale: תמיד ഇവിടെ ക്രമമായി ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘പതിവായുള്ള’ എന്നത് ‘നിരന്തരമായ’ എന്നതിനെക്കാൾ ഈ ആചാരപരമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִנְחָתָהּ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: പുരോഹിതയാഗപ്പട്ടികകളിൽ מנחה സാധാരണയായി കൂടെ അർപ്പിക്കുന്ന ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹോമയാഗത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: וְ/נִסְכָּהּ
  choice: പാനീയയാഗം
  rationale: נסך ഒഴിച്ചർപ്പിക്കുന്ന പാനീയബലിയാണ്. ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആചാരപദമാണ്; ബന്ധസൂചക പ്രത്യയം വാക്യഘടനയിൽ പങ്കുവെച്ച ‘അതിന്റെ’ എന്നതിലൂടെ ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാഗപരിഭാഷകൾ ഉപയോഗിച്ചു. ഹീബ്രുവിൽ ഈ വാക്യം മുൻവാക്യത്തിലെ അർപ്പണനിർദേശത്തിന്റെ തുടർച്ചയായതിനാൽ, മലയാളത്തിൽ അർത്ഥസമ്പൂർണതയ്ക്കായി ‘അർപ്പിക്കണം’ എന്നും ‘ഇതാണിത്’ എന്ന സൂചനാത്മക ഘടനയും ചേർത്തു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ‘sin offering’ എന്നതിനുശേഷമാണെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം עֹלַת הַתָּמִיד എന്ന പ്രയോഗത്തെയാണ് സംബന്ധിക്കുന്നത്; അതിനാൽ അടിക്കുറിപ്പ് പ്രസക്തമായ ‘പതിവായുള്ള ഹോമയാഗം’ എന്നിടത്ത് സ്ഥാപിച്ചു.
