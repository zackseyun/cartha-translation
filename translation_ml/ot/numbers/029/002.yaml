source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ml
  text: 'യഹ്‌വെയ്ക്ക് പ്രസാദകരമായ സൗരഭ്യമുള്ള ഒരു ഹോമയാഗം നിങ്ങൾ അർപ്പിക്കണം: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഊനമില്ലാത്ത ഏഴ് ആൺകുഞ്ഞാടുകൾ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശാന്തിദായകമായ സൗരഭ്യം’ അല്ലെങ്കിൽ ‘മധുരമായ സൗരഭ്യം’ എന്നും വിവർത്തനം ചെയ്യാം. യാഗം യഹ്‌വെയ്ക്ക് സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ എബ്രായ യാഗപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: നിങ്ങൾ അർപ്പിക്കണം
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും, עֹלָה എന്ന യാഗപദത്തോടൊപ്പം ഇത് യാഗം അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അർപ്പിക്കണം’ തിരഞ്ഞെടുത്തു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായും ദഹിപ്പിച്ച് പുകയായി ഉയരുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾപദമാണ് ‘ഹോമയാഗം’.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗമാണിത്. മൂലത്തിലെ സൗരഭ്യരൂപകം നിലനിർത്തിക്കൊണ്ട് അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; לְ എന്ന ഉപസർഗം ‘-യ്ക്കു’ ആയി നൽകി.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് ഒരു കാള
  rationale: ‘കന്നുകാലികളുടെ മകനായ ഒരു കാള’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള രൂപമാണിത്; മൃഗത്തിന്റെ ഇനവും കൂട്ടത്തിൽനിന്നുള്ളതെന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗപ്പട്ടികയിലെ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ, അഥവാ ആട്ടുകൊറ്റനെ, സൂചിപ്പിക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ
  rationale: മൃഗങ്ങളുടെ എണ്ണം, പ്രായം, പുല്ലിംഗസൂചന എന്നിവ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗങ്ങൾക്ക് ശാരീരിക വൈകല്യമോ ന്യൂനതയോ ഇല്ലായിരിക്കണം എന്ന യാഗപരമായ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: വാക്യം ഉടമ്പടിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സൗരഭ്യം
  alternative: ശാന്തിദായകമായ സൗരഭ്യം
  rationale: സൗരഭ്യരൂപകം നിലനിർത്തുന്നു; അതേസമയം യാഗം യഹ്‌വെയ്ക്കു സ്വീകാര്യമാകുന്നതാണ് പ്രയോഗത്തിന്റെ പ്രധാന ആശയം. ദൈവത്തിന്റെ കോപം ശമിപ്പിക്കുന്നുവെന്ന വ്യാഖ്യാനം വാക്യത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള യാഗഭാഷ ഉപയോഗിച്ചു. എബ്രായ പട്ടികയുടെ ക്രമം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി ‘ഊനമില്ലാത്ത’ എന്ന വിശേഷണം കുഞ്ഞാടുകളോടു ചേർത്തു.
