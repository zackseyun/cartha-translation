id: NUM.29.29
reference: Numbers 29:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: ml
  text: 'ആറാം ദിവസം: എട്ട് കാളകൾ, രണ്ട് ആട്ടുകൊറ്റന്മാർ, ഒരു വയസ്സുള്ള ഊനമില്ലാത്ത പതിനാല് ആൺകുഞ്ഞാടുകൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: ആറാം ദിവസം
  rationale: തുടർച്ചയായ ദിവസങ്ങളിലെ വഴിപാടുകളുടെ പട്ടികയിൽ അടുത്ത ഇനം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘ഉം’ ആവർത്തിക്കാതെ പറയുന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
- source_word: פָּרִים שְׁמֹנָה
  choice: എട്ട് കാളകൾ
  rationale: യാഗസന്ദർഭത്തിൽ פָּרִים ആൺകന്നുകാലികളായ കാളകളെ സൂചിപ്പിക്കുന്നു; പ്രായം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: אֵילִם שְׁנָיִם
  choice: രണ്ട് ആട്ടുകൊറ്റന്മാർ
  rationale: אֵילִם എന്നത് യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ഒരു വയസ്സുള്ള പതിനാല് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്ന പുല്ലിംഗരൂപത്തിന്റെ യാഗപരമായ കൃത്യത ‘ആൺകുഞ്ഞാടുകൾ’ എന്ന് വ്യക്തമാക്കുന്നു; בְּנֵי שָׁנָה സ്വാഭാവികമായി ‘ഒരു വയസ്സുള്ള’ എന്നാണ്.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗനിയമത്തിലെ ഈ പദം ശരീരവൈകല്യമോ ന്യൂനതയോ ഇല്ലാത്ത മൃഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ഊനമില്ലാത്ത’ എന്നത് കൃത്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
