translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, യാഗപട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി. മാന്യവും വ്യക്തവുമായ പദാവലി ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
