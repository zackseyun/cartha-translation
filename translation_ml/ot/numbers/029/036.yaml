source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: ml
  text: 'നിങ്ങൾ യഹ്‌വെക്കു പ്രസാദകരമായ സുഗന്ധമുള്ള[a], തീയിൽ അർപ്പിക്കുന്ന ഒരു ഹോമയാഗം അർപ്പിക്കണം: ഒരു കാള, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഏഴ് ആട്ടിൻകുട്ടികൾ; അവ കുറവില്ലാത്തവയായിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ശാന്തിദായകമായ സുഗന്ധം.” ദൈവത്തിന് സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഒരു ഹീബ്രു ബലിപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: നിങ്ങൾ ... അർപ്പിക്കണം
  rationale: ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ബലിസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആചാരപരമായ അർഥമുണ്ട്. ആധുനിക മലയാളത്തിൽ ‘അർപ്പിക്കണം’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: עֹלָה
  choice: ഒരു ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിച്ച് പുകയായി ഉയരുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള ബലിപദമാണ് ‘ഹോമയാഗം’.
- source_word: אִשֵּׁה
  choice: തീയിൽ അർപ്പിക്കുന്ന ... യാഗം
  rationale: തീയിലൂടെ അർപ്പിക്കപ്പെടുന്ന യാഗം എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുന്നു; അതിനെ ‘ഭോജനയാഗം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധമുള്ള
  rationale: ദൈവത്തിന് സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബലിപ്രയോഗത്തിന്റെ ദൃശ്യഭാഷയും ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയ്ക്ക്
  rationale: ഹീബ്രു ഉടമ്പടിനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ל എന്ന ഉപസർഗത്തിന്റെ ദിശ/സ്വീകർത്താവ് എന്ന അർഥം ‘-യ്ക്ക്’ നൽകുന്നു.
- source_word: פַּר אֶחָד
  choice: ഒരു കാള
  rationale: פַּר എന്നത് കന്നുകാലിവർഗത്തിലെ ആൺമൃഗമായ കാളയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘ഇളം’ എന്ന അധികവിശേഷണം നിർബന്ധമല്ല.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: ബലിപ്പട്ടികകളിൽ אַיִל എന്നത് പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻ’ സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആട്ടിൻകുട്ടികൾ
  rationale: ‘ഒരു വർഷത്തിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രായനിബന്ധന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലപദം ആവശ്യപ്പെടാത്ത ‘ആൺ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: ബലിമൃഗങ്ങൾക്ക് ദോഷമോ വൈകല്യമോ ഉണ്ടാകരുതെന്ന ആചാരപരമായ കൃത്യത ‘ഊനമില്ലാത്തവ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: വാക്യത്തിൽ വരുന്ന ചതുർവ്യഞ്ജന ദൈവനാമം ഒരു സ്ഥാനപ്പേരിൽ ലയിപ്പിക്കാതെ, സീനായിൽ വെളിപ്പെടുത്തിയ ഉടമ്പടിനാമമായി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന ബലിപ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സുഗന്ധമുള്ള
  alternative: ശാന്തികരമായ സുഗന്ധമുള്ള
  rationale: ഈ പ്രയോഗം യാഗം ദൈവത്തിന് സ്വീകാര്യമാണെന്നത് സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലത്തിലെ സുഗന്ധരൂപകം നീക്കം ചെയ്യുകയോ അത് ദൈവത്തെ ശമിപ്പിക്കുന്നുവെന്ന് മാത്രം നിർണയിക്കുകയോ ചെയ്യാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം ഉപയോഗിച്ചു. ബലിപദാവലിയുടെ കൃത്യതയ്ക്കായി ‘ഹോമയാഗം’, ‘തീയിൽ അർപ്പിക്കുന്ന യാഗം’, ‘ഊനമില്ലാത്തവ’ എന്നിവ നിലനിർത്തി. മൂലത്തിലെ സമാനാധികരണ ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ദീർഘരേഖയും വിശദീകരണഘടനയും ഉപയോഗിച്ച് അവതരിപ്പിച്ചു.
