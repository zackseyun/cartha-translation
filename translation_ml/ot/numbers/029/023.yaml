  language: ml
  text: 'നാലാം ദിവസം: കാളകൾ പത്ത്, ആട്ടുകൊറ്റന്മാർ രണ്ട്, ഒരു വയസ്സുള്ള ഊനമില്ലാത്ത കുഞ്ഞാടുകൾ പതിനാല്;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִי
  choice: നാലാം ദിവസം
  rationale: തുടർച്ചയായ അനുഷ്ഠാനപ്പട്ടികയിലെ അടുത്ത ദിവസത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ പട്ടികാസന്ദർഭം ബന്ധകമായ וּ-യുടെ ആശയം വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായി ‘പിന്നെ’ ചേർക്കേണ്ടതില്ല.
- source_word: פָּרִים עֲשָׂרָה
  choice: കാളകൾ പത്ത്
  rationale: യാഗസന്ദർഭത്തിലെ פָּרִים എന്നത് ആൺകന്നുകാലികളായ കാളകളെ സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിലെ നാമം-സംഖ്യ ക്രമവും നിലനിർത്തുന്നു.
- source_word: אֵילִם שְׁנָיִם
  choice: ആട്ടുകൊറ്റന്മാർ രണ്ട്
  rationale: אֵילִם എന്ന യാഗമൃഗപദത്തിന് വ്യക്തവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാള സമാനപദം.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: ഒരു വയസ്സുള്ള ... കുഞ്ഞാടുകൾ പതിനാല്
  rationale: בְּנֵי שָׁנָה എന്ന ഹീബ്രായ പ്രയോഗത്തിന്റെ പ്രായസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും പതിനാല് എന്ന എണ്ണം വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗനിയമസന്ദർഭത്തിൽ ശാരീരിക ന്യൂനതയോ ദോഷമോ ഇല്ലാത്ത മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരമുള്ളതുമായ പ്രയോഗം.
