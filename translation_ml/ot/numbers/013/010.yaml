  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പട്ടികയിലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה ഗോത്രബന്ധവും ആ ഗോത്രത്തിൽനിന്നുള്ള പ്രതിനിധിത്വവും സൂചിപ്പിക്കുന്നു; ‘ഗോത്രത്തിൽനിന്ന്’ സ്വാഭാവികമായി അതു പകർന്നുനൽകുന്നു.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: ഗോത്രനാമം ഹീബ്രു ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: גַּדִּיאֵל
  choice: ഗദ്ദീയേൽ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പിതൃബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണ ഹീബ്രു വംശാവലി പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: סוֹדִי
  choice: സോദി
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരം ചെയ്തു.
