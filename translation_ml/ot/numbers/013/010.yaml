translation_notes:
  register: ആവർത്തിത പട്ടികാശൈലിക്ക് യോജിച്ച സംക്ഷിപ്തവും മാന്യവും ആധുനികവുമായ മലയാളം. മൂലത്തിലെ പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ഗോത്രപരാമർശം ആദ്യം നിലനിർത്തി, തുടർന്ന് ‘സോദിയുടെ മകൻ ഗദ്ദീയേൽ’ എന്നു നൽകി.
