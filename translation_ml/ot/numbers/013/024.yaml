  terminology: '‘ഇസ്രായേൽമക്കൾ’ appropriately retains the familial character of בני ישראל in idiomatic Malayalam. ‘താഴ്‌വര’ is a suitable main-text rendering for נחל with alternatives in the note. The cultural note should not merely say that the name ‘sounds like’ the Hebrew noun: the name is the same Hebrew word used for ‘cluster’ in this context.'
