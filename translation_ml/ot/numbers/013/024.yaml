  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ[c] അവിടെനിന്ന് മുറിച്ചെടുത്ത കുല നിമിത്തം ആ സ്ഥലത്തിന് എശ്‌കോൽ താഴ്‌വര[a][b] എന്നു പേരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എശ്‌കോൽ നീർച്ചാൽ’ അല്ലെങ്കിൽ ‘എശ്‌കോൽ മലയിടുക്ക്’; നഹൽ എന്ന ഹീബ്രുപദം കാലാനുസൃതമായി ഒഴുകുന്ന നീർച്ചാലിനെയോ അതിനോടു ചേർന്ന താഴ്‌വരയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എശ്‌കോൽ എന്നത് ‘കുല’ എന്നർഥമുള്ള ഹീബ്രുപദമാണ്. ഇസ്രായേൽമക്കൾ അവിടെനിന്ന് മുറിച്ചെടുത്ത കുല നിമിത്തമാണ് ഈ സ്ഥലത്തിന് ആ പേര് ലഭിച്ചത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘ഇസ്രായേല്യർ’ അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: ആ സ്ഥലത്തിന്
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച സ്ഥലത്തേക്കുള്ള നിർദിഷ്ട സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קָרָא
  choice: എന്നു പേരായി
  rationale: ഹീബ്രുവിൽ പേരിടുന്നവൻ വ്യക്തമല്ലാത്ത മൂന്നാംപുരുഷ ഏകവചന സജീവരൂപമാണ്; മലയാളത്തിൽ അജ്ഞാത കർത്താവിനെ അനാവശ്യമായി ചേർക്കാതെ പേരിടലിന്റെ ഫലം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: נַחַל
  choice: താഴ്‌വര
  rationale: കാലിക നീർച്ചാലിനെയോ അതിനോടു ചേർന്ന താഴ്‌വരയെയോ സൂചിപ്പിക്കാവുന്ന പദമാണ്. ഈ സ്ഥലനാമസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭൂമിശാസ്ത്രപദമായി ‘താഴ്‌വര’ തെരഞ്ഞെടുത്തു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: אֶשְׁכּוֹל
  choice: എശ്‌കോൽ
  rationale: ഇവിടെ സ്ഥലനാമത്തിന്റെ ഭാഗമായതിനാൽ അർഥം പരിഭാഷപ്പെടുത്താതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: עַל אֹדוֹת
  choice: നിമിത്തം
  rationale: പേരിടലിന്റെ കാരണബന്ധം കൃത്യമായും ഗൗരവമുള്ള ആധുനിക മലയാളത്തിലും പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאֶשְׁכּוֹל
  choice: മുന്തിരിക്കുല
  rationale: മൂലപദം ‘കുല’ എന്നാണ്; മുൻവാക്യം അത് മുന്തിരിക്കുലയാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ സന്ദർഭസഹജമായ വ്യക്തതയ്ക്കായി ‘മുന്തിരിക്കുല’ എന്നു നൽകി.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: മുറിച്ചെടുത്ത
  rationale: വിളവെടുക്കുമ്പോൾ കുല വള്ളിയിൽനിന്ന് മുറിച്ചെടുക്കുന്നതിനെ സ്വാഭാവികവും കൃത്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: ആ സ്ഥലത്തേക്കുള്ള ദിശാസൂചന ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധപരമായ ജനനാമത്തിന്റെ ഭാവം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മനസ്സിലാകുന്നതുമായ പ്രയോഗം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഇത് സിദ്ധാന്തപരമായ തർക്കമല്ലെങ്കിലും മൂലത്തിലെ കുടുംബബന്ധപരമായ ജനനാമം സംരക്ഷിക്കേണ്ട വിഷയമാണ്. ‘ഇസ്രായേൽമക്കൾ’ ആ ഭാവം നിലനിർത്തുകയും ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളമാകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. കാരണവാക്യം ആദ്യം വെച്ച് പേരിടലിന്റെ ബന്ധം സുതാര്യമാക്കി. സ്ഥലനാമത്തിലെ പദപ്രയോഗവും എശ്‌കോൽ/‘കുല’ ശബ്ദബന്ധവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
