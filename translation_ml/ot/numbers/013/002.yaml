id: NUM.13.2
reference: Numbers 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: ml
  text: “നിനക്കായി പുരുഷന്മാരെ അയയ്ക്കുക. ഞാൻ ഇസ്രായേൽമക്കൾക്കു[b] കൊടുക്കുന്ന കനാൻദേശം അവർ പര്യവേക്ഷണം ചെയ്യട്ടെ.[a] ഓരോ പിതൃഗോത്രത്തിൽനിന്നും ഓരോ പുരുഷനെ വീതം നിങ്ങൾ അയയ്ക്കണം; അവരിൽ ഓരോരുത്തനും ഒരു നേതാവായിരിക്കണം.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പര്യവേക്ഷണം ചെയ്യുക’ എന്നതിന് ‘ചുറ്റിനടന്ന് പരിശോധിക്കുക’ എന്നോ ‘പരിശോധിച്ചുനോക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിപരമായ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ‘നേതാവ്’ എന്നതിന് ‘പ്രമാണി’ എന്നോ ‘ഗോത്രത്തലവൻ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: നിനക്കായി ... അയയ്ക്കുക
  rationale: ആജ്ഞാരൂപമായ שְׁלַח എന്നതിന്റെ ബലം നിലനിർത്തുകയും לְךָ എന്ന ദത്തിവാചകത്തെ ഒഴിവാക്കാതെ ‘നിനക്കായി’ എന്നു പ്രകടമാക്കുകയും ചെയ്യുന്നു. ഇത് അനുമതിയാണോ, വ്യക്തിപരമായ പങ്കാളിത്തമാണോ, ഊന്നലാണോ എന്ന വ്യാഖ്യാനം തീർപ്പാക്കുന്നില്ല.
- source_word: אֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ ഗോത്രങ്ങളിൽനിന്ന് തിരഞ്ഞെടുക്കപ്പെടുന്ന പുരുഷപ്രതിനിധികളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: וְיָתֻרוּ
  choice: അവർ പര്യവേക്ഷണം ചെയ്യട്ടെ
  rationale: תור എന്ന ക്രിയ ഇവിടെ ദേശം ചുറ്റിക്കണ്ട് അന്വേഷിക്കുക/നിരീക്ഷിക്കുക എന്നർഥത്തിലാണ്. ‘പര്യവേക്ഷണം ചെയ്യുക’ ചാരവൃത്തിയെന്ന ഒറ്റ അർഥത്തിലേക്ക് പദത്തെ ചുരുക്കാതെ ദൗത്യത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: אֶרֶץ כְּנַעַן
  choice: കനാൻദേശം
  rationale: אֶרֶץ എന്ന ‘ദേശം’ വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: ഞാൻ ... കൊടുക്കുന്ന
  rationale: നֹתֵן എന്ന വർത്തമാന കൃദന്തരൂപം നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉറപ്പോടെ സമീപിച്ചിരിക്കുന്നതോ ആയ ദൈവിക ദാനത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊടുക്കുന്ന’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: എബ്രായത്തിലെ കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ പ്രയോഗം മലയാളത്തിൽ പതിവും സ്വാഭാവികവുമായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ഓരോ പുരുഷനെ വീതം
  rationale: എബ്രായ ആവർത്തനത്തിന്റെ വിഭജനാത്മകവും ഊന്നലുള്ളതുമായ അർഥം മലയാളത്തിലെ ‘ഓരോ ... വീതം’ എന്ന സ്വാഭാവിക ഘടനയിൽ പകരുന്നു.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: അവരുടെ പിതൃഗോത്രങ്ങളിൽ ഓരോന്നിൽനിന്നും
  rationale: מַטֶּה ഇവിടെ ഗോത്രത്തെയും אֲבֹתָיו പിതൃവംശപരമായ ബന്ധത്തെയും സൂചിപ്പിക്കുന്നു. വിതരണം സൂചിപ്പിക്കുന്ന വാക്യഘടനയോട് ചേർന്ന് ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: תִּשְׁלָחוּ
  choice: നിങ്ങൾ അയയ്ക്കണം
  rationale: ബഹുവചനത്തിലുള്ള ക്രിയയെ ബഹുവചനമായിത്തന്നെ നിലനിർത്തുകയും തുടർന്നുള്ള നിർദേശത്തിന്റെ ആജ്ഞാബലം ‘അയയ്ക്കണം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: ഓരോരുത്തനും അവരുടെയിടയിലെ ഒരു നേതാവായിരിക്കണം
  rationale: נָשִׂיא എന്നത് നേതാവ്, പ്രമാണി, ഗോത്രത്തലവൻ എന്നിവയെ സൂചിപ്പിക്കാം. ‘നേതാവ്’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്; בָהֶם എന്ന ബന്ധം ‘അവരുടെയിടയിലെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക കല്പനയിലെ לְךָ എന്നതിന്റെ സൂക്ഷ്മാർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നിനക്കായി’ എന്നു നിലനിർത്തി
  alternative: മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ വിടുക; അല്ലെങ്കിൽ ‘നിന്റെ പേരിൽ’ എന്നു നൽകുക
  rationale: മൂലപാഠത്തിലുള്ള ഘടകം നിലനിർത്തുന്നത് ഇത് അനുമതിയോ വ്യക്തിപരമായ ചുമതലയോ ഊന്നലോ ആണെന്ന വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- issue: בני ישראל എന്ന ഉടമ്പടിപരമായ കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ കുടുംബപരവും സമൂഹമൊട്ടാകെ ഉൾക്കൊള്ളുന്നതുമായ സ്ഥാപിത മലയാളപ്രയോഗമാണ്; അതേസമയം മൂലത്തിലെ ബന്ധഭാവം ഒരു ജാതിനാമമായി മാത്രം ചുരുക്കുന്നില്ല.
- issue: נָשִׂיא എന്ന പദത്തിന്റെ പദവിസൂചന
  choice: നേതാവ്
  alternative: പ്രമാണി; തലവൻ; പ്രഭു
  rationale: ഔദ്യോഗിക ഗോത്രസ്ഥാനത്തിന്റെ കൃത്യമായ പരിധി പാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അധിക രാജകീയമോ മതവിഭാഗപരമോ ആയ അർഥം ചേർക്കാതെ പൊതുവായ ‘നേതാവ്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘പര്യവേക്ഷണം’ അല്പം ഔപചാരികമാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും תור എന്ന പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നതുമാണ്. ഏകവചന ആജ്ഞയിൽനിന്ന് ബഹുവചന നിർദേശത്തിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റവും സംരക്ഷിച്ചു.
