  to: “നിനക്കായി പുരുഷന്മാരെ അയയ്ക്കുക. ഞാൻ ഇസ്രായേൽമക്കൾക്കു[b] കൊടുക്കുന്ന കനാൻദേശം അവർ പര്യവേക്ഷണം ചെയ്യട്ടെ.[a] ഓരോ പിതൃഗോത്രത്തിൽനിന്നും ഓരോ പുരുഷനെ വീതം നിങ്ങൾ അയയ്ക്കണം; അവരിൽ ഓരോരുത്തനും ഒരു നേതാവായിരിക്കണം.[c]”
  rationale: മൂലപാഠത്തിന്റെ അർഥം മാറ്റാതെ പിതൃവംശ-ഗോത്രബന്ധത്തിന്റെ വിതരണാത്മകത കൂടുതൽ വ്യക്തമായി പ്രകടമാക്കി; നָשִׂיאയെ ‘നേതാവ്’ എന്നതായിത്തന്നെ നിലനിർത്തി. കുറിപ്പ് a-യിൽ അസ്വാഭാവികമായ പദപ്രയോഗം സ്വാഭാവികമായ അർഥവികൽപംകൊണ്ട് മാറ്റി.
