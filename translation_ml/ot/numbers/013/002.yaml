  source_fidelity: 'മുഖ്യമായും എബ്രായപാഠത്തോടു വിശ്വസ്തമാണ്: לְךָയുടെ വ്യക്തിപരമായ ദത്തിവാചകസൂചന, പുരുഷപ്രതിനിധികളുടെ പരാമർശം, കനാൻദേശം, ദൈവം നൽകിക്കൊണ്ടിരിക്കുന്ന ദാനം, ബഹുവചന നിർദേശം, നָשִׂיאയുടെ പൊതുവായ നേതൃസൂചന എന്നിവ നിലനിർത്തിയിട്ടുണ്ട്. എന്നാൽ לְמַטֵּה אֲבֹתָיו എന്ന വിതരണാത്മക ഏകവചനപ്രയോഗത്തിന് ‘അവരുടെ പിതൃഗോത്രങ്ങളിൽ ഓരോന്നിൽനിന്നും’ എന്നത് അല്പം അസ്പഷ്ടമാണ്; ‘ഓരോ പിതൃഗോത്രത്തിൽനിന്നും’ കൂടുതൽ നേരിട്ടും സ്വാഭാവികമായും അതു നൽകുന്നു.'
  naturalness: വാക്യശൈലി ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളമാണ്. ‘പര്യവേക്ഷണം ചെയ്യട്ടെ’ ഈ സന്ദർഭത്തിനു യോജിച്ച ഔപചാരിക പ്രയോഗമാണ്. ‘അവരുടെയിടയിലെ’ എന്നതിനു പകരം ‘അവരിൽ’ കൂടുതൽ സ്വാഭാവികമാണ്.
