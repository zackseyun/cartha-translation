  text: וַ/יֵּלְכ֡וּ וַ/יָּבֹאוּ֩ אֶל מֹשֶׁ֨ה וְ/אֶֽל אַהֲרֹ֜ן וְ/אֶל כָּל עֲדַ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל אֶל מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁ/ה וַ/יָּשִׁ֨יבוּ אוֹתָ֤/ם דָּבָר֙ וְ/אֶת כָּל הָ֣/עֵדָ֔ה וַ/יַּרְא֖וּ/ם אֶת פְּרִ֥י הָ/אָֽרֶץ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: ml
  text: അവർ പോയി പാരാൻ മരുഭൂമിയിലെ കാദേശിൽ മോശെയുടെയും അഹരോന്റെയും ഇസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തിന്റെയും അടുക്കൽ വന്നു. അവർ അവർക്കും മുഴുവൻ സമൂഹത്തിനും വിവരം അറിയിച്ചു; ദേശത്തിലെ ഫലം അവർക്കു കാണിച്ചുകൊടുക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: അവർ പോയി ... അടുക്കൽ വന്നു
  rationale: പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന ‘പോയി’, ‘വന്നു’ എന്നീ രണ്ടു എബ്രായ ആഖ്യാനക്രിയകളും നിലനിർത്തുന്നു; മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനം ഇടയിൽ ചേർക്കുന്നത് വാക്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സർവസഭ
  rationale: עֵדָה എന്നതിന് ‘സഭ’ എന്നും בְּנֵי יִשְׂרָאֵל എന്ന പദപ്രയോഗത്തിന് ‘ഇസ്രായേൽമക്കൾ’ എന്നും നൽകി മൂലഭാഷയുടെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; כָּל എന്നത് ‘സർവ-’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: מִדְבַּר פָּארָן
  choice: പാരാൻ മരുഭൂമി
  rationale: യാത്രാവിവരണത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പശ്ചാത്തലത്തിൽ מִדְבָּר എന്നതിന് സ്വാഭാവികവും പതിവുമായ മലയാളപരിഭാഷയാണ് ‘മരുഭൂമി’.
- source_word: קָדֵשָׁה
  choice: കാദേശിൽ
  rationale: ദിശാസൂചകമായ -ָה അവസാനപ്രത്യയം കാദേശിലേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുന്നു; എത്തിച്ചേർന്ന സ്ഥലം പറയുന്ന മലയാളവാക്യത്തിൽ ‘കാദേശിൽ’ സ്വാഭാവികമാണ്.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: അവർ അവർക്കു വിവരം അറിയിച്ചു
  rationale: ‘വാക്ക് തിരികെ കൊണ്ടുവരുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം അന്വേഷണത്തിനു ശേഷമുള്ള വിവരം അറിയിക്കലാണ്. ‘വിവരം അറിയിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וְאֶת כָּל הָעֵדָה
  choice: സർവസഭയ്ക്കും
  rationale: മുൻഖണ്ഡത്തിൽനിന്ന് ഉദ്ദേശിക്കപ്പെടുന്ന ദാതൃബന്ധം മലയാളത്തിലെ ‘-ക്കും’ എന്ന വിഭക്തിയിലൂടെ വ്യക്തമാക്കുകയും עֵדָה എന്നതിന് ഒരേ പരിഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וַיַּרְאוּם
  choice: അവരെ കാണിച്ചു
  rationale: ראה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ ‘കാണിക്കുക’ എന്നാണ്; ‘അവരെ’ എന്നത് എബ്രായത്തിലെ ബഹുവചന കർമപ്രത്യയം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: פְּרִי הָאָרֶץ
  choice: ദേശത്തിലെ ഫലം
  rationale: ‘ദേശത്തിന്റെ ഫലം’ എന്ന മൂലാർഥം നേരിട്ട് പകരുകയും ചാരന്മാർ കൊണ്ടുവന്ന ദൃശ്യമായ വിളവിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ ഇരട്ട ചലനക്രിയ നിലനിർത്തിയെങ്കിലും എബ്രായ വാക്യക്രമം യാന്ത്രികമായി അനുകരിച്ചിട്ടില്ല. അടിക്കുറിപ്പ് അത് വിശദീകരിക്കുന്ന ‘ഇസ്രായേൽമക്കളുടെ സർവസഭ’ എന്ന പ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
