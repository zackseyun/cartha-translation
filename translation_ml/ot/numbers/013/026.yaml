- from: അവർ പോയി, പാരാൻ മരുഭൂമിയിലെ കാദേശിൽ മോശെയുടെയും അഹരോന്റെയും ഇസ്രായേൽമക്കളുടെ സർവസഭയുടെയും[a] അടുക്കൽ വന്നു. അവർ അവർക്കും സർവസഭയ്ക്കും വിവരം അറിയിക്കുകയും ദേശത്തിലെ ഫലം അവരെ കാണിക്കുകയും ചെയ്തു.
