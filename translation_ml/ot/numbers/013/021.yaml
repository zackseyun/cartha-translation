  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂമിശാസ്ത്രനാമങ്ങൾ മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു; മൂലപാഠത്തിലെ ലְבֹא חֲמָת എന്ന പ്രയോഗത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
