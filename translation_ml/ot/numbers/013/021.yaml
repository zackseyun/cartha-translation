  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: ml
  text: അങ്ങനെ അവർ കയറി, സീൻ മരുഭൂമി മുതൽ ലെബോ-ഹമാത്തിലെ രെഹോബ്[a] വരെ ദേശം ഒറ്റുനോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഹമാത്തിലേക്കുള്ള പ്രവേശനദിശയിലുള്ള രെഹോബ്.” എബ്രായപ്രയോഗം ‘ലെബോ-ഹമാത്ത്’ എന്ന സ്ഥലനാമമായോ ‘ഹമാത്തിലേക്കുള്ള പ്രവേശനം’ എന്ന വിവരണമായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: അവർ കയറി
  rationale: עלה എന്ന ക്രിയയിലെ ഉയരത്തിലേക്കുള്ള യാത്രയുടെ ദിശാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיָּתֻרוּ
  choice: ഒറ്റുനോക്കി
  rationale: നിയോഗിക്കപ്പെട്ടവർ ദേശത്തെക്കുറിച്ച് രഹസ്യമായി വിവരശേഖരണം നടത്തിയ ഈ സന്ദർഭത്തിൽ תור എന്ന ക്രിയയുടെ നിരീക്ഷണ-പര്യവേക്ഷണ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: സംഖ്യ 13-ന്റെ സന്ദർഭത്തിൽ പരിശോധിക്കപ്പെടുന്ന കനാൻദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേശം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִמִּדְבַּר צִן
  choice: സീൻ മരുഭൂമി മുതൽ
  rationale: מִדְבָּר എന്നതിന്റെ ജനവാസം കുറഞ്ഞ വരണ്ട പ്രദേശം എന്ന ഭാവം ‘മരുഭൂമി’ നൽകുന്നു; צִן ‘സീൻ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: עַד רְחֹב
  choice: രെഹോബ് വരെ
  rationale: עַד അന്വേഷണത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ പരിധി സൂചിപ്പിക്കുന്നതിനാൽ ‘വരെ’ കൃത്യമാണ്; רְחֹב സ്ഥലനാമമായി ലിപ്യന്തരിച്ചു.
- source_word: לְבֹא חֲמָת
  choice: ഹമാത്തിലേക്കുള്ള പ്രവേശനസ്ഥാനത്തുള്ള
  rationale: ഈ എബ്രായ പ്രയോഗത്തെ വിവരണാത്മക ഭൂമിശാസ്ത്രസൂചനയായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിക്കുന്നു; സ്ഥലനാമമായുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
