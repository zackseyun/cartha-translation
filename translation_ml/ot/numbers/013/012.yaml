  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി. മൂലത്തിലെ പദക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥഘടന ഉപയോഗിച്ചു.
