id: NUM.13.18
reference: Numbers 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: ml
  text: ദേശം എങ്ങനെയുള്ളതാണെന്നും[a] അവിടെ വസിക്കുന്ന ജനം ശക്തരോ ദുർബലരോ എന്നും അവർ കുറച്ചുപേരോ അനേകരോ എന്നും നോക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദശഃ, “ദേശം എന്താണെന്ന്.” ഇവിടെ ദേശത്തിന്റെ സ്വഭാവമോ അവസ്ഥയോ വിലയിരുത്തുക എന്നതാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: നോക്കുവിൻ
  rationale: ראה എന്ന ക്രിയ ഇവിടെ ചാരന്മാർക്കുള്ള നിർദേശമായി വരുന്നു. വെറും കാഴ്ചയല്ല, പരിശോധിച്ചറിയുക എന്ന സന്ദർഭാർഥവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
- source_word: הָאָרֶץ מַה הִוא
  choice: ദേശം എങ്ങനെയുള്ളതാണെന്ന്
  rationale: പദശഃ ‘ദേശം എന്താണ്’ എന്നാണെങ്കിലും, ദേശത്തിന്റെ സ്വഭാവമോ അവസ്ഥയോ വിലയിരുത്തുകയാണ് ഉദ്ദേശ്യം. ‘എങ്ങനെയുള്ളത്’ ആ വിലയിരുത്തൽസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: അവിടെ വസിക്കുന്ന ജനം
  rationale: എബ്രായത്തിൽ പദശഃ ദേശത്തിന്റെ ‘മേൽ വസിക്കുന്ന’ ജനം എന്നാണ്. ദേശനിവാസികളെ സൂചിപ്പിക്കാൻ ‘അവിടെ വസിക്കുന്ന’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: הֶחָזָק
  choice: ശക്തരോ
  rationale: חזק ഇവിടെ ജനത്തിന്റെ ശക്തി വിലയിരുത്തുന്നു; ‘ശക്തർ’ ലളിതവും കൃത്യവുമായ തുല്യപദമാണ്.
- source_word: הֲרָפֶה
  choice: ദുർബലരോ
  rationale: רפה, חזק എന്നതിന്റെ വിപരീതമായി ശക്തിക്കുറവ് സൂചിപ്പിക്കുന്നു. ‘ദുർബലർ’ ആ വിരുദ്ധത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הַמְעַט
  choice: കുറച്ചുപേരോ
  rationale: ജനസംഖ്യയിലെ കുറവിനെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തികളെ എണ്ണുന്നതിന് സ്വാഭാവികമായ ‘കുറച്ചുപേർ’ സ്വീകരിച്ചു.
- source_word: רָב
  choice: അനേകരോ
  rationale: מעט എന്നതിന്റെ സംഖ്യാത്മക വിപരീതമായി ‘അനേകർ’ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: אִם
  choice: എന്നും … ഓ … എന്നും
  rationale: ഇവിടെ പരോക്ഷമായ ബദൽചോദ്യങ്ങൾ രൂപപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ശക്തരോ ദുർബലരോ എന്നും’ എന്ന ഘടന ഈ ചോദ്യം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘ദേശം’ എന്ന പദം ആവർത്തിക്കാതെ ‘അവിടെ’ ഉപയോഗിച്ച് സ്വാഭാവികത നിലനിർത്തി; എബ്രായത്തിലെ മൂന്നു വിലയിരുത്തൽഘടകങ്ങളും അതേ ക്രമത്തിൽ സൂക്ഷിച്ചു.
