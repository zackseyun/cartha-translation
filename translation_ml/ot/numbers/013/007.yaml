  text: from the tribe of Issachar, Igal son of Joseph;
translation:
  language: ml
  text: യിസ്സാഖാർ ഗോത്രത്തിൽനിന്ന് യോസേഫിന്റെ മകൻ യിഗാൽ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പ്രതിനിധികളുടെ ഈ പട്ടികയിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה, പേരെടുത്ത വ്യക്തി ഏത് ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്നു എന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നത് ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതവും ഉറവിടഭാഷയോട് ചേർന്നതുമായ ലിപ്യന്തരണം.
- source_word: יִגְאָל
  choice: യിഗാൽ
  rationale: എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം; പേര് അർത്ഥപരമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശപരിചയം നൽകുന്ന בֶּן יוֹסֵף എന്ന പ്രയോഗത്തിൽ നേരിട്ടുള്ള പുത്രബന്ധമാണ് സാധാരണ അർത്ഥം; സന്ദർഭം ‘വംശജൻ’ എന്ന വിശാലീകരണം ആവശ്യപ്പെടുന്നില്ല.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികയുടെ സംക്ഷിപ്ത ഘടനയും അവസാനത്തെ അർദ്ധവിരാമവും നിലനിർത്തി. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിലും എബ്രായ ഉച്ചാരണത്തോട് യോജിച്ചും നൽകിയിരിക്കുന്നു.
