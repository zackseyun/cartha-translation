  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: യഹ്‌വെ മോശയോടു സംസാരിച്ചു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; പരമ്പരാഗതമായി ‘യഹോവ’ എന്നും വിവർത്തനം ചെയ്യപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പ്രചാരത്തിലുള്ള മറ്റൊരു മലയാളരൂപവും അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; തുടർന്നുവരുന്ന אמר എന്ന ക്രിയയിൽനിന്നുള്ള വ്യത്യാസവും ഒരു പരിധിവരെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിമുഖവ്യക്തിയെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ചേർത്താൽ ആവർത്തനഭാരം ഉണ്ടാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് നൽകുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധ്യതയുള്ള ഉച്ചാരണത്തെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു; ‘യഹോവ’ പരമ്പരാഗതമായ മറ്റൊരു രൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ഹീബ്രുവിലെ וַיְדַבֵּר ... לֵאמֹר എന്ന ആവർത്തനസൂത്രം വാക്കിന് വാക്കായി പകർത്താതെ, അതിന്റെ പ്രസംഗപരിചയ പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ നിലനിർത്തി.
