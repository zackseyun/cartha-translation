lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ഈ പട്ടികയിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה, പേരെടുത്ത വ്യക്തി ഏതു ഗോത്രത്തിൽപ്പെട്ട പ്രതിനിധിയാണെന്ന് സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഹീബ്രു ഗോത്ര/വ്യക്തിനാമം; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: פַּלְטִי
  choice: പൽതി
  rationale: വ്യക്തിനാമം അർത്ഥം വിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഹീബ്രു വംശാവലി ഘടനയിലെ സാധാരണ പദം; പേരുകളുടെ പട്ടികയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: רָפוּא
  choice: രാഫു
  rationale: വ്യക്തിനാമം ഹീബ്രു സ്വരരൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
