  footnotes:
  - marker: a
    text: ‘ബെന്യാമീൻ ഗോത്രത്തിനുവേണ്ടി’ എന്നോ ‘ബെന്യാമീൻ ഗോത്രത്തിലെ’ എന്നോ വിവർത്തനം ചെയ്യാം. ഈ പട്ടികയിലെ ഹീബ്രു ഘടന ഗോത്രബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
