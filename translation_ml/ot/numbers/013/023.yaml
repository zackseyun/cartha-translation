base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: ml
  text: അവർ എശ്കോൽ താഴ്‌വരയിൽ[a] എത്തി. അവിടെനിന്ന് ഒരു മുന്തിരിക്കുലയുള്ള ഒരു മുന്തിരിവള്ളിക്കൊമ്പ് മുറിച്ചെടുത്തു; അവരിൽ രണ്ടുപേർ അതിനെ ഒരു കോലിൽ ചുമന്നു. അവർ ചില മാതളപ്പഴങ്ങളും ചില അത്തിപ്പഴങ്ങളും എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എശ്കോൽ തോട്’ അല്ലെങ്കിൽ ‘എശ്കോൽ നീരൊഴുക്കുതാഴ്‌വര’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ נַחַל എന്ന പദം ഒരു താഴ്‌വരയെയോ മലയിടുക്കിനെയോ കാലാവസ്ഥാനുസൃതമായ നീരൊഴുക്കിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: എശ്കോൽ താഴ്‌വര
  rationale: נַחַל എന്നത് താഴ്‌വര, മലയിടുക്ക്, അല്ലെങ്കിൽ കാലിക നീരൊഴുക്കുള്ള തോട് എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ വിശാലവും സ്വാഭാവികവുമായ ഭൂമിശാസ്ത്രപദമായി ‘താഴ്‌വര’ ഉപയോഗിക്കുകയും സ്ഥലനാമം ‘എശ്കോൽ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: זְמוֹרָה
  choice: വള്ളിക്കൊമ്പ്
  rationale: ഈ പദം മുന്തിരിവള്ളിയുടെ കൊമ്പിനെയോ തളിരിനെയോ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വള്ളിക്കൊമ്പ്’ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: ഒരു മുന്തിരിക്കുല
  rationale: ‘ഒരൊറ്റ മുന്തിരിക്കുല’ എന്ന ആശയം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു; ‘ഒരു’ എന്നത് ഏകത്വം നിലനിർത്തുന്നു.
- source_word: וַיִּשָּׂאֻהוּ
  choice: അതിനെ ... ചുമന്നു
  rationale: ഏകവചന പ്രത്യയം മുറിച്ചെടുത്ത വള്ളിക്കൊമ്പും കുലയും ചേർന്ന വസ്തുവിലേക്കാണ് മടങ്ങുന്നത്; ‘അതിനെ’ ഇത് നിലനിർത്തുന്നു.
- source_word: בַמּוֹט
  choice: ഒരു തണ്ടിൽ
  rationale: מוֹט ചുമക്കാനുള്ള നീളമുള്ള തണ്ടിനെയോ കോലിനെയോ സൂചിപ്പിക്കുന്നു. ‘തണ്ടിൽ ചുമന്നു’ ദൃശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בִּשְׁנָיִם
  choice: അവരിൽ രണ്ടുപേർ
  rationale: അക്ഷരാർഥം ‘രണ്ടുപേരാൽ/രണ്ടുപേരായി’; സന്ദർഭത്തിലെ ചാരന്മാരെ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിൽ ആവശ്യമായ കർത്താവ് വ്യക്തമാക്കി.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: കുറച്ച് മാതളപ്പഴങ്ങളും അത്തിപ്പഴങ്ങളും
  rationale: മുൻ ക്രിയയുടെ അർത്ഥം തുടരുന്നതിനാൽ ‘എടുത്തു’ മലയാളത്തിൽ തുറന്നുപറഞ്ഞു; מן എന്ന ഭാഗികത ‘കുറച്ച്’ എന്നതിലൂടെ നൽകി.
