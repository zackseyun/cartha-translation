  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ കഥനശൈലി. എബ്രായവാക്യത്തിലെ ഭൂമിശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിലെ [b] അടിക്കുറിപ്പ് പ്രധാനവാചകത്തിൽ തന്നെ ‘വള്ളിക്കൊമ്പ്’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തിയതിനാൽ വേറൊരു അടിക്കുറിപ്പ് ആവശ്യമില്ല.
