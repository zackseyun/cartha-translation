  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചുറ്റുമുള്ള വാക്യങ്ങളുടെ പട്ടികാശൈലിയോട് ചേരാൻ അർദ്ധവിരാമം നിലനിർത്തി; വിശദീകരണാത്മകമായ കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
