  yaml_path: translation/ot/numbers/013/013.yaml
  text: from the tribe of Asher, Sethur son of Michael;
translation:
  language: ml
  text: ആശേർ ഗോത്രത്തിൽനിന്ന്, മീഖായേലിന്റെ മകൻ സെഥൂർ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ഈ പ്രതിനിധിപ്പട്ടികയിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה, പേരെടുത്ത വ്യക്തി ഏത് ഗോത്രത്തിൽനിന്നുള്ളവനാണെന്ന് സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ ശബ്ദരൂപം ആധുനിക മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: סְתוּר
  choice: സെഥൂർ
  rationale: മസോററ്റിക് സ്വരചിഹ്നങ്ങളോടുകൂടിയ എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: בֶּן + വ്യക്തിനാമം എന്ന പിതൃനാമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘—യുടെ മകൻ’ എന്നു നൽകുന്നു.
- source_word: מִיכָאֵל
  choice: മീഖായേൽ
  rationale: എബ്രായ രൂപത്തിലെ ദീർഘസ്വരവും ഖ് ധ്വനിയും യഥാശക്തി നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
