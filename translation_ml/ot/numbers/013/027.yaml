translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അവനോടു’ എന്ന സർവനാമവും ‘ഇതാ’ എന്ന ദൃശ്യസൂചനയും മൂലപാഠത്തോട് ചേർന്ന് നിലനിർത്തി; וְגַם എന്നതിന്റെ ഊന്നൽ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
