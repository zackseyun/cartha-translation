base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: ml
  text: 'അവർ അവനോടു അറിയിച്ചു: “നീ ഞങ്ങളെ അയച്ച ദേശത്ത് ഞങ്ങൾ പ്രവേശിച്ചു. തീർച്ചയായും അതു പാലും തേനും ഒഴുകുന്ന ദേശമാണ്[a]; ഇതാ, അതിന്റെ ഫലം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതും പാലും തേനും ഒഴുകുന്ന ദേശമാണ്.” എബ്രായത്തിലെ וְגַם ദേശത്തിന്റെ സമൃദ്ധിയെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: അവർ വിവരിച്ചുപറഞ്ഞു
  rationale: പീയേൽ രൂപത്തിലുള്ള ספר ഇവിടെ ദൗത്യത്തെക്കുറിച്ച് ക്രമമായി റിപ്പോർട്ട് ചെയ്യുക എന്ന അർഥം നൽകുന്നു; ‘വിവരിച്ചുപറഞ്ഞു’ ഔപചാരികതയും സ്വാഭാവിക മലയാളവും നിലനിർത്തുന്നു.
- source_word: לוֹ
  choice: അവനോടു
  rationale: എബ്രായപാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് മോശെയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പേര് ചേർക്കുന്നില്ല.
- source_word: בָּאנוּ אֶל־הָאָרֶץ
  choice: ദേശത്ത് ഞങ്ങൾ പ്രവേശിച്ചു
  rationale: בוא എന്ന ക്രിയയുടെ ‘വരുക/പ്രവേശിക്കുക’ എന്ന അർഥവും ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന אֶל-ഉം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: നീ ഞങ്ങളെ അയച്ച
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക നാമപൂർവ വിശേഷണഘടനയിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: וְגַם
  choice: ദേശംതന്നെ
  rationale: וְגַם ഇവിടെ ദേശത്തിന്റെ സമൃദ്ധിയെക്കുറിച്ചുള്ള ഉറപ്പിനോ ഊന്നലിനോ ശക്തി നൽകുന്നു; ‘തന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: പാലും തേനും ഒഴുകുന്ന
  rationale: സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപവും ബൈബിൾപരിചിതമായ മലയാളശൈലിയും സംരക്ഷിക്കുന്നു.
- source_word: וְזֶה פִּרְיָהּ
  choice: ഇതാ, അതിന്റെ ഫലം
  rationale: കൊണ്ടുവന്ന ഫലം കാണിച്ചുകൊണ്ടുള്ള സൂചനാത്മക ശക്തി ‘ഇതാ’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
