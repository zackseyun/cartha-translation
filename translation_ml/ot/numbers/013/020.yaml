source:
  edition: WLC
  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: ml
  text: ദേശം വളക്കൂറുള്ളതോ വളക്കൂറില്ലാത്തതോ, അതിൽ മരങ്ങളുണ്ടോ[a] ഇല്ലയോ എന്നും നോക്കുക. ധൈര്യമായിരിക്കുക; ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത് എടുക്കുക.” അന്ന് മുന്തിരിപ്പഴങ്ങൾ ആദ്യം പാകമാകുന്ന കാലമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മരങ്ങൾ” എന്ന ഹീബ്രു പദത്തിന് “തടി” എന്നും അർഥമാകാം; അതിനാൽ “അവിടെ തടി ലഭ്യമാണോ ഇല്ലയോ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ആ ദിവസങ്ങൾ മുന്തിരിയുടെ ആദ്യഫലങ്ങളുടെ ദിവസങ്ങളായിരുന്നു”; അതായത് മുന്തിരിപ്പഴങ്ങൾ പാകമാകാൻ തുടങ്ങുന്ന കാലം.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: വളക്കൂറുള്ളതോ വളക്കൂറില്ലാത്തതോ
  rationale: ‘പുഷ്ടിയുള്ളത്/മെലിഞ്ഞത്’ എന്ന ഹീബ്രു രൂപകം മലയാളത്തിൽ ഭൂമിയുടെ ഫലഭൂയിഷ്ഠതയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: അതിൽ മരങ്ങളുണ്ടോ ഇല്ലയോ
  rationale: עֵץ എന്നതിന് ‘മരം’ എന്നും ‘തടി’ എന്നും അർഥമാകാം; സന്ദർഭത്തിൽ സസ്യസമ്പത്തിനെക്കുറിച്ചുള്ള ‘മരങ്ങൾ’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: ധൈര്യമായിരിക്കുക
  rationale: ക്രിയയുടെ ‘നിങ്ങളെത്തന്നെ ശക്തിപ്പെടുത്തുക/ശക്തരായിരിക്കുക’ എന്ന ആഹ്വാനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: ദേശത്തിലെ ഫലങ്ങളിൽ ചിലത് എടുക്കുക
  rationale: מִן സൂചിപ്പിക്കുന്ന ഭാഗികത ‘ചിലത്’ എന്നു വ്യക്തമാക്കി; സന്ദർഭം മടക്കിക്കൊണ്ടുവരൽ സൂചിപ്പിച്ചാലും മൂലപാഠത്തിൽ ഇല്ലാത്ത ആശയം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: മുന്തിരിപ്പഴങ്ങൾ ആദ്യം പാകമാകുന്ന കാലം
  rationale: ഇവിടെ ആരാധനാപരമായ ‘ആദ്യഫലം’ എന്നതിനേക്കാൾ മുന്തിരിവിളവിന്റെ ആരംഭകാലമാണ് ഉദ്ദേശിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യം മുൻവാക്യത്തിലെ അന്വേഷണപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ ‘എന്നും നോക്കുക’ ചേർത്ത് മലയാളത്തിൽ ഘടന വ്യക്തമാക്കി. യഥാർഥമായ עֵץ എന്ന പദത്തിന്റെ ‘മരം/തടി’ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
