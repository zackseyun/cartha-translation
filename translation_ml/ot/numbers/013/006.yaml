  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പട്ടികയിൽ പേരെടുത്തിരിക്കുന്ന വ്യക്തി ഏതു ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്നു എന്നു לְ ഉപസർഗത്തോടുകൂടിയ מַטֶּה സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നത് ഈ അർഥം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ഈ സന്ദർഭത്തിൽ യെഹൂദായിൽനിന്നുള്ള ഗോത്രത്തെയാണ് പേര് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ച ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: כָּלֵב
  choice: കാലേബ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: കാലേബിനെ അദ്ദേഹത്തിന്റെ പിതൃവംശബന്ധത്താൽ തിരിച്ചറിയിക്കുന്ന എബ്രായ സംയുക്തബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘മകൻ’ എന്ന പ്രയോഗത്തിലൂടെ നൽകി.
- source_word: יְפֻנֶּה
  choice: യെഫുന്നെ
  rationale: എബ്രായ വ്യക്തിനാമത്തോട് അടുത്തുനിൽക്കുന്നതും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികവുമായ ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പട്ടികാശൈലിയുടെ സംക്ഷിപ്തത നിലനിർത്തിയ dignified and natural rendering. മൂലപാഠത്തിലുള്ള ക്രമവും പിതൃപരിചയവും സംരക്ഷിച്ചു.
