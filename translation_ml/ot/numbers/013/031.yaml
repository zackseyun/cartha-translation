reference: Numbers 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: ml
  text: 'എന്നാൽ അവനോടൊപ്പം കയറിപ്പോയിരുന്ന പുരുഷന്മാർ പറഞ്ഞു: “ആ ജനത്തിനെതിരെ കയറിച്ചെല്ലാൻ[a] നമുക്കു കഴിയില്ല; കാരണം അവർ നമ്മെക്കാൾ ശക്തരാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ജനത്തിന്റെ അടുക്കലേക്ക് കയറിച്ചെല്ലാൻ’; ഇവിടെ സൈനികമായി ആ ജനത്തിനെതിരെ മുന്നേറുക എന്നാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ ‘ജനം’ എന്ന സമൂഹനാമവും അതിനോടു ചേരുന്ന ഏകവചന സർവനാമവുമാണ്: അക്ഷരാർഥത്തിൽ ‘അത്/അവൻ നമ്മെക്കാൾ ശക്തനാണ്.’ മലയാളത്തിൽ സമൂഹത്തെ സ്വാഭാവികമായി ‘അവർ’ എന്നു ബഹുവചനത്തിൽ അവതരിപ്പിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: എന്നാൽ ... പുരുഷന്മാർ
  rationale: וְ ഇവിടെ കാലേബിന്റെ മുൻവാക്കിനോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു നൽകി; אֲנָשִׁים എന്നതിന്റെ വ്യക്തമായ പുരുഷസൂചനയും നിലനിർത്തി.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: അവനോടൊപ്പം കയറിപ്പോയിരുന്ന
  rationale: עלה എന്ന ക്രിയയുടെ ‘കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനദിശ നിലനിർത്തുന്നു; പറഞ്ഞ സമയത്തിനു മുമ്പ് നടന്ന പ്രവൃത്തിയാണെന്ന ബന്ധം ‘പോയിരുന്ന’ വ്യക്തമാക്കുന്നു.
- source_word: אָמְרוּ
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ പൂർത്തിയായ പ്രസ്താവനയെ ലളിതമായ ഭൂതകാലത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לֹא נוּכַל
  choice: നമുക്കു കഴിയില്ല
  rationale: יכל സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയെ നേരിട്ടും സാധാരണ മലയാളത്തിലും പ്രകടിപ്പിക്കുന്നു.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: ആ ജനത്തിനെതിരെ കയറിച്ചെല്ലാൻ
  rationale: עלה എന്നതിലെ ഉയർന്നുചെല്ലൽ/മുന്നേറൽ ഭാവം ‘കയറിച്ചെല്ലാൻ’ നിലനിർത്തുന്നു; സൈനികസന്ദർഭത്തിൽ אֶל എന്നത് ലക്ഷ്യജനത്തിനെതിരായ നീക്കമാണെന്ന് ‘എതിരെ’ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാദത്തിനുള്ള കാരണം പരിചയപ്പെടുത്തുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: അവർ നമ്മെക്കാൾ ശക്തരാണ്
  rationale: ഹീബ്രുവിലെ ഏകവചനസമൂഹനാമമായ הָעָם അനേകം നിവാസികളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന സർവനാമം ഉപയോഗിച്ചു; מִן എന്ന താരതമ്യഭാവം ‘നമ്മെക്കാൾ’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കയറിപ്പോയിരുന്ന’ എന്നും ‘കയറിച്ചെല്ലാൻ’ എന്നും നൽകി עלה എന്ന ആവർത്തനവും ദിശാഭാവവും സാധ്യമായത്ര നിലനിർത്തി; സൈനികസന്ദർഭം ‘എതിരെ’ വ്യക്തമാക്കുന്നു.
