language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: ml
  text: അമാലേക്യർ നെഗെബ് ദേശത്ത്[a] വസിക്കുന്നു; ഹിത്യരും യെബൂസ്യരും അമോര്യരും മലമ്പ്രദേശത്ത് വസിക്കുന്നു; കനാന്യർ കടലിനരികിലും യോർദ്ദാന്റെ തീരത്തും[b] വസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നെഗെബ്’ എന്നത് ‘തെക്കൻ പ്രദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് കനാനിലെ പ്രത്യേക തെക്കൻ മേഖലയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘യോർദ്ദാന്റെ വശത്ത്’; അർഥം ‘യോർദ്ദാനരികിൽ’ അല്ലെങ്കിൽ ‘യോർദ്ദാനോടുചേർന്ന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: അമാലേക്
  rationale: ജനവിഭാഗത്തെയോ അതിന്റെ പൂർവികനാമത്തെയോ സൂചിപ്പിക്കുന്ന സംജ്ഞാനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: വസിക്കുന്നു
  rationale: ישב എന്ന വർത്തമാന കൃദന്തരൂപം സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു; ‘വസിക്കുന്നു’ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: നെഗെബ് പ്രദേശത്ത്
  rationale: אֶרֶץ എന്നതിന്റെ പ്രദേശസൂചനയും נֶגֶב എന്ന ഭൂമിശാസ്ത്രനാമവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: ഹിത്യർ / യെബൂസ്യർ / അമോര്യർ / കനാന്യർ
  rationale: എബ്രായത്തിലെ ഏകവചനസമൂഹനാമങ്ങൾ മലയാളത്തിൽ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ബഹുവചനരൂപങ്ങളാക്കി.
- source_word: בָּהָר
  choice: മലനാട്ടിൽ
  rationale: הַר ഇവിടെ ഒറ്റമലയേക്കാൾ മലനിരകളും ഉയർന്ന പ്രദേശവും ഉൾപ്പെടുന്ന ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘മലനാട്’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: עַל הַיָּם
  choice: കടലിനരികിൽ
  rationale: ‘കടലിനടുത്ത്/കടൽത്തീരപ്രദേശത്ത്’ എന്ന സ്ഥലബന്ധം നൽകുന്നു; ‘തീരത്ത്’ എന്നു മാത്രം പറഞ്ഞ് അർത്ഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: യോർദ്ദാന്റെ തീരത്ത്
  rationale: ‘യോർദ്ദാന്റെ വശത്ത്/അരികിൽ’ എന്ന എബ്രായ ഇടപ്രയോഗം നദിയെ സംബന്ധിച്ച് സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ആവർത്തിക്കുന്ന יוֹשֵׁב എന്ന ക്രിയ ഓരോ ഭൂപ്രദേശഘടകത്തോടും നിലനിർത്തി. സെമിറ്റിക് ജനനാമങ്ങൾക്ക് മലയാള ബൈബിൾപ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചു.
