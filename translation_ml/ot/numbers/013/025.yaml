  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ആഖ്യാനശൈലി. മുഖ്യവാക്യത്തിൽ നിഷ്പക്ഷമായ ‘നിരീക്ഷിക്കുക’ ഉപയോഗിക്കുകയും എബ്രായപദത്തിന്റെ മറ്റു സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
