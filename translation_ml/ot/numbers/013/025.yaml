translation:
  language: ml
  text: നാല്പത് ദിവസത്തിനൊടുവിൽ അവർ ദേശം പര്യവേക്ഷണം ചെയ്ത് മടങ്ങിവന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേശം നിരീക്ഷിച്ച്’ എന്നോ ‘ദേശം ചാരവൃത്തി നടത്തി’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയ ഒരു നിരീക്ഷണദൗത്യത്തിൽ ദേശം പരിശോധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
