lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: അവർ മടങ്ങിവന്നു
  rationale: שוב എന്ന ക്രിയയുടെ Qal wayyiqtol മൂന്നാം പുരുഷ ബഹുവചനരൂപം തുടർന്നുണ്ടായ സംഭവത്തെ വിവരിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ വാവിന്റെ അനുക്രമാർഥം വേറിട്ട് ‘പിന്നെ’ എന്നു ചേർക്കാതെയും വ്യക്തമാണ്.
- source_word: מִתּוּר
  choice: നിരീക്ഷിച്ചശേഷം
  rationale: תור എന്ന infinitive construct, മִן ഉപസർഗത്തോടുകൂടെ, ദേശം പരിശോധിച്ച ദൗത്യം പൂർത്തിയാക്കി മടങ്ങിയതിനെ സൂചിപ്പിക്കുന്നു. ‘നിരീക്ഷിക്കുക’ പര്യവേക്ഷണത്തിന്റെയും രഹസ്യാന്വേഷണത്തിന്റെയും സാധ്യത നിലനിർത്തുന്ന നിഷ്പക്ഷവും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אָרֶץ ഭൂമി മുഴുവനെയല്ല, ദൗത്യസംഘം പരിശോധിച്ച നിർദിഷ്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ സന്ദർഭത്തിൽ ‘ദേശം’ സ്വാഭാവികമാണ്.
- source_word: מִקֵּץ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: מִן + קֵץ ഒരു കാലയളവ് പൂർത്തിയായ സമയത്തെ സൂചിപ്പിക്കുന്നു. ‘നാല്പതു ദിവസം കഴിഞ്ഞപ്പോൾ’ എന്നത് ‘നാല്പതു ദിവസത്തിന്റെ അവസാനത്തിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: אַרְבָּעִים יוֹם
  choice: നാല്പതു ദിവസം
  rationale: എബ്രായത്തിലെ സംഖ്യയും ഏകവചന അളവുപദവും ചേർന്ന പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവിക തുല്യരൂപമാണിത്.
