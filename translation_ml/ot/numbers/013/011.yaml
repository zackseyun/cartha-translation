id: NUM.13.11
reference: Numbers 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/מַטֵּ֥ה יוֹסֵ֖ף לְ/מַטֵּ֣ה מְנַשֶּׁ֑ה גַּדִּ֖י בֶּן סוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/011.yaml
  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: ml
  text: 'യോസേഫിന്റെ ഗോത്രത്തിൽനിന്ന്, മനശ്ശെയുടെ ഗോത്രത്തിൽനിന്ന്: സൂസിയുടെ മകൻ ഗദ്ദി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പ്രതിനിധിയുടെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്ന לְ ഉപസർഗത്തോടുകൂടിയ מַטֶּה എന്ന പ്രയോഗം പട്ടികയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יוֹסֵף
  choice: യോസേഫ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: മനശ്ശെയുടെ ഗോത്രത്തിൽനിന്ന്
  rationale: യോസേഫിന്റെ കീഴിൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന പ്രത്യേക ഗോത്രശാഖ മനശ്ശെയാണെന്ന് വ്യക്തമാക്കുന്ന എബ്രായ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: גַּדִּי
  choice: ഗദ്ദി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടനയ്ക്കൊത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: סוּסִי
  choice: സൂസി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദഘടനയ്ക്കൊത്ത മലയാള ലിപ്യന്തരണം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, പട്ടികാസന്ദർഭത്തിന് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ശൈലി. മൂല എബ്രായത്തിലെ ‘ഗോത്രത്തിൽനിന്ന്’ എന്ന ആവർത്തനം അർത്ഥവത്തായ ഘടനയായതിനാൽ മുഖ്യപാഠത്തിൽ തന്നെ നിലനിർത്തിയിരിക്കുന്നു; അതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
