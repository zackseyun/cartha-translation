  text: from the tribe of Simeon, Shaphat son of Hori;
translation:
  language: ml
  text: ശിമെയോൻ ഗോത്രത്തിൽനിന്ന് ഹോരിയുടെ മകൻ ശാഫാത്ത്;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: മַטֶּה ഇവിടെ ഗോത്രപ്രതിനിധികളുടെ പട്ടികയിൽ ‘ഗോത്രം’ എന്ന അർഥത്തിലാണ്. ലְ എന്ന ഉപസർഗം പട്ടികാസന്ദർഭത്തിൽ ആ ഗോത്രത്തിൽനിന്നുള്ള പ്രതിനിധിയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നു നൽകി.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: ഗോത്രനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שָׁפָט
  choice: ശാഫാത്ത്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: എബ്രായ വംശപരിചയ നിർമാണത്തിലെ പിതൃപുത്രബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: חוֹרִי
  choice: ഹോരി
  rationale: വ്യക്തിനാമം എബ്രായ രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: സംക്ഷിപ്തമായ ഗോത്രപ്രതിനിധിപ്പട്ടികയുടെ ശൈലി നിലനിർത്തി. ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദക്രമം ഉപയോഗിച്ചു; മൂലത്തിലെ അർധവിരാമസദൃശ പട്ടികാതുടർച്ച സൂചിപ്പിക്കാൻ അവസാനം അർധവിരാമം നൽകി.
