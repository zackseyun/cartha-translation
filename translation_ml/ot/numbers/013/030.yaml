  text: וַ/יַּ֧הַס כָּלֵ֛ב אֶת הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְ/יָרַ֣שְׁנוּ אֹתָ֔/הּ כִּֽי יָכ֥וֹל נוּכַ֖ל לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: ml
  text: 'അപ്പോൾ കാലേബ് മോശെയുടെ മുമ്പിൽ ജനത്തെ ശാന്തരാക്കി[a] പറഞ്ഞു: “നാം തീർച്ചയായും കയറിച്ചെന്ന്[b] ആ ദേശം കൈവശമാക്കാം; അതിനെ കൈവശമാക്കാൻ നമുക്ക് തീർച്ചയായും കഴിയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനത്തെ നിശ്ശബ്ദരാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ‘ശാന്തരാക്കി,’ ‘അടക്കി,’ ‘നിശ്ശബ്ദരാക്കി’ എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘കയറുക, നാം തീർച്ചയായും കയറും’—ഊന്നൽ നൽകുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: ശാന്തരാക്കി
  rationale: ജനക്കൂട്ടത്തെ നിശ്ശബ്ദമാക്കുകയോ അടക്കുകയോ ചെയ്യുന്നതാണ് ക്രിയയുടെ ആശയം. ‘ശാന്തരാക്കി’ എന്നത് അനാവശ്യമായ ബലപ്രയോഗധ്വനി കൂടാതെ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്.
- source_word: אֶת־הָעָם
  choice: ജനത്തെ
  rationale: ഇവിടെ עם കൂടിവന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജനം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֶל־מֹשֶׁה
  choice: മോശെയുടെ മുമ്പിൽ
  rationale: אֶל സാധാരണയായി ‘അടുത്തേക്ക്/നേരെ’ എന്നാണെങ്കിലും ഇവിടെ മോശെയുടെ സാന്നിധ്യത്തിൽ നടന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മുമ്പിൽ’ രംഗം വ്യക്തമായി നൽകുന്നു.
- source_word: עָלֹה נַעֲלֶה
  choice: നാം തീർച്ചയായും കയറിച്ചെന്ന്
  rationale: ക്രിയാനാമത്തിന്റെ സമ്പൂർണരൂപവും അപൂർണക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഉടൻ’ എന്ന കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: ആ ദേശം കൈവശമാക്കുക
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ירשׁ ഇവിടെ ദേശം സ്വന്തമാക്കി അധിവസിക്കുന്ന സജീവ അർത്ഥത്തിൽ ‘കൈവശമാക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי יָכוֹל נוּכַל
  choice: നമുക്ക് തീർച്ചയായും കഴിയും
  rationale: രണ്ടാമത്തെ ഊന്നൽഘടനയും ‘തീർച്ചയായും’ വഴി പ്രകടമാക്കുന്നു; കാലേബിന്റെ ഉറച്ച ആത്മവിശ്വാസം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: לָהּ
  choice: അതു കൈവശമാക്കാൻ
  rationale: സർവനാമം ദേശത്തോടു ബന്ധപ്പെട്ട കഴിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അവ്യക്തമായ ‘അതിന്’ എന്നതിനു പകരം മുൻപ്രവൃത്തിയെ ആവർത്തിച്ച് അർത്ഥം വ്യക്തമാക്കുന്നു.
