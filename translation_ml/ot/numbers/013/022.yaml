id: NUM.13.22
reference: Numbers 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: ml
  text: അവർ നെഗെബിലേക്കു കയറിച്ചെന്നു; അവൻ ഹെബ്രോൻവരെ എത്തി. അവിടെ അനാക്കിന്റെ സന്തതികളായ അഹീമാൻ, ശേശായി, തൽമായി എന്നിവർ ഉണ്ടായിരുന്നു. ഈജിപ്തിലെ സോവാൻ പണിയപ്പെടുന്നതിന് ഏഴു വർഷം മുമ്പാണ് ഹെബ്രോൻ പണിയപ്പെട്ടത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: നെഗെബിലേക്കു
  rationale: ഇത് തെക്കൻ പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രനാമമായി ലിപ്യന്തരണം ചെയ്തു; ദിശാസൂചകമായ ‘തെക്കോട്ട്’ എന്നു മാത്രം വിവർത്തനം ചെയ്യുന്നത് പ്രത്യേക പ്രദേശസൂചന നഷ്ടപ്പെടുത്തും.
- source_word: וַיָּבֹא
  choice: അവൻ ... എത്തി
  rationale: മസോററ്റിക് പാഠത്തിലെ ഏകവചന ക്രിയയെ അതേപടി നിലനിർത്തി; മുമ്പുള്ള ബഹുവചനവുമായി കാണുന്ന വ്യാകരണപരമായ സംഘർഷം സമന്വയിപ്പിച്ചില്ല.
- source_word: יְלִידֵי הָעֲנָק
  choice: അനാക്കിന്റെ സന്തതികളായ
  rationale: വംശബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ജനിച്ചവർ’ എന്ന അക്ഷരാർഥരൂപം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: צֹעַן מִצְרָיִם
  choice: ഈജിപ്തിലെ സോവാൻ
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ ഈജിപ്തുമായുള്ള ഭൂമിശാസ്ത്രബന്ധം വ്യക്തമായി നിലനിർത്തി.
theological_decisions:
- issue: ബഹുവചനമായ ‘അവർ കയറിച്ചെന്നു’ എന്നതിനു പിന്നാലെയുള്ള ഏകവചന ക്രിയ
  choice: ‘അവൻ ഹെബ്രോൻവരെ എത്തി’ എന്നു ഏകവചനം സംരക്ഷിച്ചു
  alternative: ‘അവർ ഹെബ്രോൻവരെ എത്തി’ എന്നു ബഹുവചനമായി ഏകീകരിക്കുക
  rationale: ഹീബ്രു പാഠത്തിലെ യഥാർഥ സംഖ്യാവ്യതിയാനം പ്രസക്തമായ പാഠസാക്ഷ്യമാണ്; അതിനെ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘നെഗെബ്’, ‘ഹെബ്രോൻ’, ‘സോവാൻ’ തുടങ്ങിയവ പ്രത്യേക സ്ഥലനാമങ്ങളായി നിലനിർത്തി; മൂലത്തിലെ ഏകവചന-ബഹുവചന സംഘർഷവും സംരക്ഷിച്ചു.
