  terminology: സ്ഥലനാമങ്ങളുടെ ലിപ്യന്തരണം സ്ഥിരവും വ്യക്തവുമാണ്. ‘അനാക്കിന്റെ സന്തതികളായ’ എന്ന പ്രയോഗം യെലിദേ എന്ന വംശസൂചനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
