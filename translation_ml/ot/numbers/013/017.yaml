source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֹתָ/ם֙ מֹשֶׁ֔ה לָ/ת֖וּר אֶת אֶ֣רֶץ כְּנָ֑עַן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם עֲל֥וּ זֶה֙ בַּ/נֶּ֔גֶב וַ/עֲלִיתֶ֖ם אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: ml
  text: 'മോശെ അവരെ കനാൻദേശം പര്യവേക്ഷണം ചെയ്യാൻ[a] അയച്ചു. അവൻ അവരോടു പറഞ്ഞു: “ഈ വഴിയായി നെഗെബിലൂടെ[b] കയറിപ്പോകുവിൻ; പിന്നെ മലനാട്ടിലേക്കു കയറിപ്പോകുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കനാൻദേശം ചാരപ്പണി നടത്താൻ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ “നെഗെബ്”; കനാന്റെ തെക്കുഭാഗത്തുള്ള വരണ്ട പ്രദേശം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: שׁלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനരൂപം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לָתוּר
  choice: പര്യവേക്ഷണം ചെയ്യാൻ
  rationale: ദേശത്തെ പരിശോധിച്ചറിഞ്ഞുള്ള നിരീക്ഷണയാത്രയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ചാരവൃത്തി നടത്തുക’ എന്ന രഹസ്യപ്രവർത്തനത്തിന്റെ അധികധ്വനി ഒഴിവാക്കുന്നു, എന്നാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶרֶץ כְּנָעַן
  choice: കനാൻദേശം
  rationale: കനാൻ എന്നു പേരുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും സമ്പൂർണവുമായ രൂപം.
- source_word: עֲלוּ זֶה בַּנֶּגֶב
  choice: ഈ വഴിയായി നെഗെബിലേക്കു കയറിച്ചെല്ലുവിൻ
  rationale: עלה എന്നതിന്റെ ഉയർന്നുപോകുന്ന ദിശയും זֶה എന്നതിന്റെ വഴിസൂചകമായ പ്രയോഗവും നിലനിർത്തുന്നു; בַּנֶּגֶב ഇവിടെ നെഗെബിലേക്കുള്ള പ്രവേശനമായി വായിക്കുന്നു.
- source_word: וַעֲלִיתֶם אֶת הָהָר
  choice: പിന്നെ മലനാട്ടിലേക്കു കയറിപ്പോകുവിൻ
  rationale: നിർദേശശ്രേണിയിൽ വാവോടുകൂടിയ രൂപം തുടർകല്പനയായി പ്രവർത്തിക്കുന്നു; הָהָר ഒരു ഒറ്റമലയെക്കാൾ ഉയർന്ന മലമ്പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ബഹുവചന കല്പനയ്ക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു. ഭൂമിശാസ്ത്രനാമമായ ‘നെഗെബ്’ ലിപ്യന്തരണം ചെയ്ത് സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
