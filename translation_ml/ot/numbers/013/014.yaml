lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ഈ പ്രതിനിധിപ്പട്ടികയിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה ആ വ്യക്തിയുടെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നത് ഈ അർഥം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: נַפְתָּלִי
  choice: നഫ്താലി
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: נַחְבִּי
  choice: നഹ്ബി
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; ח എന്ന വ്യഞ്ജനത്തിന്റെ ഏകദേശ ഉച്ചാരണം ‘ഹ’ ഉപയോഗിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: പേരുകളുടെ ഈ പട്ടികയിൽ പിതൃബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: וָפְסִי
  choice: വാഫ്സി
  rationale: എബ്രായ സ്വരചിഹ്നങ്ങളും വ്യഞ്ജനങ്ങളും പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം. മറ്റു ഭാഷകളിലെ പതിവനുസരിച്ച് ഈ പേരിന്റെ രൂപത്തിൽ വ്യത്യാസമുണ്ട്.
