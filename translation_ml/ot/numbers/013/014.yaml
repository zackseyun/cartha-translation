  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തി; പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട പേരിനോടുതന്നെ ചേർത്തിരിക്കുന്നു.
