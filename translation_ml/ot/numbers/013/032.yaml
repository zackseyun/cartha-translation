revisions:
- from: 'അങ്ങനെ അവർ പര്യവേക്ഷണം ചെയ്ത ദേശത്തെക്കുറിച്ച് ഇസ്രായേൽമക്കളുടെ അടുക്കൽ ഒരു ദുഷ്‌കീർത്തി പരത്തി[a]: “ഞങ്ങൾ പര്യവേക്ഷണം ചെയ്യാൻ[b] കടന്നുപോയ ദേശം അതിലെ നിവാസികളെ വിഴുങ്ങുന്ന ദേശമാണ്[d]. അവിടെ ഞങ്ങൾ കണ്ട ജനങ്ങളെല്ലാം അസാമാന്യ വലുപ്പമുള്ള പുരുഷന്മാരാണ്[e].”[c]'
  to: 'അങ്ങനെ അവർ പര്യവേക്ഷണം ചെയ്ത ദേശത്തെക്കുറിച്ച് ഇസ്രായേൽമക്കളുടെ അടുക്കൽ[c] ഒരു മോശം റിപ്പോർട്ട് പ്രചരിപ്പിച്ചു[a], ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “ഞങ്ങൾ പര്യവേക്ഷണം ചെയ്യാൻ[b] കടന്നുപോയ ദേശം അതിലെ നിവാസികളെ വിഴുങ്ങുന്ന ദേശമാണ്[d]. അവിടെ ഞങ്ങൾ കണ്ട ജനങ്ങളെല്ലാം അസാമാന്യ വലുപ്പമുള്ള പുരുഷന്മാരാണ്[e].”'
  rationale: The revision corrects the detached [c] anchor, clarifies the idiomatic negative-report expression, and aligns footnote d more closely with the source's consuming metaphor. It retains the source's rhetorical imagery and does not turn the spies' claim into an asserted narrator fact.
