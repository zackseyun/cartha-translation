source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ പര്യവേക്ഷണം ചെയ്ത ദേശത്തെക്കുറിച്ച് ഇസ്രായേൽമക്കളുടെ അടുക്കൽ[c] ഒരു മോശം റിപ്പോർട്ട് പ്രചരിപ്പിച്ചു[a], ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “ഞങ്ങൾ പര്യവേക്ഷണം ചെയ്യാൻ[b] കടന്നുപോയ ദേശം അതിലെ നിവാസികളെ വിഴുങ്ങുന്ന ദേശമാണ്[d]. അവിടെ ഞങ്ങൾ കണ്ട ജനങ്ങളെല്ലാം അസാമാന്യ വലുപ്പമുള്ള പുരുഷന്മാരാണ്[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു മോശം റിപ്പോർട്ട് പരത്തി”; കൂടുതൽ ശക്തമായി, “ദേശത്തെ അപകീർത്തിപ്പെടുത്തി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒറ്റുനോക്കാൻ” / “നിരീക്ഷിച്ചറിയാൻ.”
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രായത്തിൽ “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിസംബന്ധമായ നാമം.
    reason: cultural_note
  - marker: d
    text: അഥവാ “അതിലെ നിവാസികളെ ദഹിപ്പിച്ചുകളയുന്ന ദേശം.”
    reason: lexical_alternative
  - marker: e
    text: അഥവാ “ഉയരവും വലുപ്പവുമുള്ള പുരുഷന്മാർ”; ഇവിടെ ശ്രദ്ധേയമായ ശരീരവലുപ്പമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: ഒരു ദുഷ്‌കീർത്തി പരത്തി
  rationale: ഈ സംയുക്തപ്രയോഗം മോശമായൊരു റിപ്പോർട്ട് പ്രചരിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ അക്ഷരാർഥമായ ‘പുറപ്പെടുവിച്ചു’ സ്വാഭാവികമല്ല; ‘ദുഷ്‌കീർത്തി പരത്തി’ അതിന്റെ നിഷേധാത്മകവും അപകീർത്തികരവുമായ ഭാവം വ്യക്തമായി നൽകുന്നു, എന്നാൽ അടിക്കുറിപ്പിൽ കൂടുതൽ നിഷ്പക്ഷമായ സാധ്യതയും സൂചിപ്പിക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: വാഗ്ദത്തദേശത്തെ സൂചിപ്പിക്കുന്ന ഈ കഥാസന്ദർഭത്തിൽ ‘ദേശം’ സ്വാഭാവികവും ഭൂമിശാസ്ത്ര-ഉടമ്പടിസംബന്ധമായ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: תָּרוּ / לָתוּר
  choice: പര്യവേക്ഷണം ചെയ്ത / പര്യവേക്ഷണം ചെയ്യാൻ
  rationale: תור എന്ന ക്രിയയുടെ അന്വേഷിച്ചു പരിശോധിക്കൽ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; രഹസ്യചാരപ്രവർത്തനം എന്ന ആശയം അനാവശ്യമായി മുൻനിരയിൽ കൊണ്ടുവരുന്നില്ല.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ അടുക്കൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രായ രൂപത്തിന്റെ സമൂഹപരവും ഉടമ്പടിസംബന്ധവുമായ സ്വഭാവം മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: עָבַרְנוּ בָהּ
  choice: ഞങ്ങൾ ... കടന്നുപോയ ദേശം
  rationale: עבר എന്ന ചലനക്രിയയുടെ ‘കടന്നുപോകുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: അതിലെ നിവാസികളെ വിഴുങ്ങുന്ന ദേശം
  rationale: ‘തിന്നുന്ന’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘വിഴുങ്ങുന്ന’ എന്നത് ഹീബ്രായത്തിലെ ഭീഷണിജനകമായ രൂപകത്തിന്റെ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: അസാമാന്യ വലുപ്പമുള്ള പുരുഷന്മാർ
  rationale: ഇവിടെ സാമൂഹിക പദവിയല്ല, ശ്രദ്ധേയമായ ശരീരവലുപ്പമാണ് ഉദ്ദേശ്യം; ‘അസാമാന്യ വലുപ്പം’ അത് വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചകമായ സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കളുടെ അടുക്കൽ
  alternative: ഇസ്രായേല്യരുടെ അടുക്കൽ / ഇസ്രായേലിന്റെ പുത്രന്മാരുടെ അടുക്കൽ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഉടമ്പടിസംബന്ധമായ നാമരൂപം പൂർണമായി ലിംഗനിഷ്പക്ഷമാക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമമായ ‘ഇസ്രായേൽമക്കൾ’ ഉപയോഗിച്ചു. ഇത് മുഴുവൻ ജനതയെയും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഹീബ്രായത്തിലെ ദേശത്തെ ‘വിഴുങ്ങുന്ന’ എന്ന ശക്തമായ രൂപകം നിലനിർത്തി. പ്രധാനവാക്യത്തിന്റെ വായനാഭംഗി കാക്കാൻ [c] അടിക്കുറിപ്പുസൂചകം ബന്ധപ്പെട്ട ‘ഇസ്രായേൽമക്കൾ’ എന്ന പദത്തിന് പിന്നാലെ വരേണ്ടതാണ്; പ്രസിദ്ധീകരണരൂപത്തിൽ അത് അവിടെ സ്ഥാപിക്കുക.
