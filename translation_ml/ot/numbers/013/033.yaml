source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: ml
  text: അവിടെ ഞങ്ങൾ നെഫിലീമുകളെ—നെഫിലീമുകളിൽനിന്നുള്ള അനാക്കിന്റെ പുത്രന്മാരെ[a]—കണ്ടു. ഞങ്ങളുടെ സ്വന്തം കണ്ണുകളിൽ ഞങ്ങൾ വെട്ടുക്കിളികളെപ്പോലെയായിരുന്നു; അവരുടെ കണ്ണുകളിലും ഞങ്ങൾ അങ്ങനെതന്നെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നെഫിലീമുകൾ” എന്നതിന് പരമ്പരാഗതമായി “ഭീമന്മാർ” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്. ഹീബ്രു പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമായതിനാൽ മുഖ്യപാഠത്തിൽ അത് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: നെഫിലീമുകൾ
  rationale: പദത്തിന്റെ സൂചനയും വ്യുത്പത്തിയും അനിശ്ചിതമായതിനാൽ ‘രാക്ഷസന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനത്തിനു പകരം ഹീബ്രു നാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: בְּנֵי עֲנָק
  choice: അനാക്കിന്റെ പുത്രന്മാർ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കാവുന്ന ഹീബ്രു പുത്രപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: מִן הַנְּפִלִים
  choice: നെഫിലീമുകളിൽനിന്നുള്ള
  rationale: മൂലമോ വംശബന്ധമോ സൂചിപ്പിക്കുന്ന מן എന്ന പദത്തിന്റെ അർഥം കൂടുതൽ നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: ഞങ്ങളുടെ കാഴ്ചയിൽ ഞങ്ങൾ ... ആയിരുന്നു
  rationale: ഇത് യാഥാർഥ്യപരമായ രൂപാന്തരമല്ല, അവരുടെ സ്വയംവിലയിരുത്തലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ദൃശ്യബോധപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: כַּחֲגָבִים
  choice: വെട്ടുക്കിളികളെപ്പോലെ
  rationale: חגב ചെറുതായ വെട്ടുക്കിളി/പുൽച്ചാടി വർഗത്തിലെ കീടത്തെ സൂചിപ്പിക്കുന്നു; വലിപ്പവ്യത്യാസം പ്രകടമാക്കുന്ന പരിചിതമായ പരമ്പരാഗത മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: וְכֵן
  choice: അങ്ങനെതന്നെ
  rationale: മുമ്പത്തെ ഉപമയുമായുള്ള സമാന്തരവും സ്ഥിരീകരണഭാവവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: בְעֵינֵיהֶם
  choice: അവരുടെ കാഴ്ചയിലും
  rationale: ‘ഞങ്ങളുടെ കാഴ്ചയിൽ’ എന്ന ആദ്യപ്രയോഗത്തോടുള്ള ഹീബ്രു വാക്യത്തിന്റെ അലങ്കാരപരമായ സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: נְפִילִים എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നെഫിലീമുകൾ
  alternative: രാക്ഷസന്മാർ
  rationale: ഉല്പത്തി 6:4-ലും കാണുന്ന ഈ പദത്തിന്റെ കൃത്യമായ സൂചന വിവാദവിഷയമാണ്. ഹീബ്രു ആവശ്യപ്പെടാത്ത ഒരു വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കാൻ ലിപ്യന്തരണം നിലനിർത്തി; പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തനവും കാഴ്ചയെ ആധാരമാക്കിയ സമാന്തരപ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു; ദീർഘമായ ഇടച്ചേർക്കൽ വായനാസൗകര്യത്തിനായി ഡാഷുകൾക്കുള്ളിൽ നൽകി.
