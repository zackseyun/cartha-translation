translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. മൂലത്തിലെ ഗോത്രബന്ധവും പിതൃബന്ധവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
