lexical_decisions:
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: പട്ടികയുടെ ആവർത്തനഘടനയിൽ לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה ഓരോ പ്രതിനിധിയുടെയും ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നത് ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: גָד
  choice: ഗാദ്
  rationale: ഗോത്രനാമം; എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: גְּאוּאֵל
  choice: ഗെവൂവേൽ
  rationale: വ്യക്തിനാമം; എബ്രായ വ്യഞ്ജന-സ്വരരൂപം കഴിയുന്നത്ര നിലനിർത്തി മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: എബ്രായ വംശാവലിപ്രയോഗമായ בֶּן ഇവിടെ പിതൃപുത്രബന്ധം വ്യക്തമാക്കുന്നു; പേരിനോടു ചേർന്ന മലയാളപ്രയോഗത്തിൽ ‘മകൻ’ സ്വാഭാവികമാണ്.
- source_word: מָכִי
  choice: മാഖി
  rationale: വ്യക്തിനാമം; എബ്രായത്തിലെ ദീർഘ ā സ്വരവും כ എന്ന ഘർഷധ്വനിയും പ്രതിഫലിപ്പിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
