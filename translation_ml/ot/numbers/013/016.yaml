source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: ml
  text: ദേശം പര്യവേക്ഷണം ചെയ്യാൻ മോശ അയച്ച പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്.[a] നൂന്റെ മകനായ ഹോശേയയ്ക്ക് മോശ യോശുവ എന്നു പേരിട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദേശം ഒറ്റുനോക്കാൻ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് പര്യവേക്ഷണം, നിരീക്ഷണം, രഹസ്യവിവരശേഖരണം എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഹോശേയ എന്നത് യോശുവയുടെ മുമ്പത്തെ പേരാണ്; ഇവിടെ മോശ അവന് യോശുവ എന്നു പേരിടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്
  rationale: പട്ടികയെ സംഗ്രഹിച്ച് ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രതിനിധികൾ പുരുഷന്മാരായതിനാൽ ‘പുരുഷന്മാർ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: മോശ അയച്ച
  rationale: എബ്രായ ആഖ്യാനത്തിലെ ലളിതമായ ബന്ധവാക്യവും שׁלח എന്ന ക്രിയയുടെ സാധാരണ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: ദേശം പര്യവേക്ഷണം ചെയ്യാൻ
  rationale: תור ഇവിടെ ദേശത്തെ പരിശോധിച്ചറിയുന്ന പര്യവേക്ഷണത്തെയോ നിരീക്ഷണയാത്രയെയോ സൂചിപ്പിക്കുന്നു. ‘ചാരപ്പണി ചെയ്യുക’ എന്ന കൂടുതൽ ശക്തമായ അർഥം അനാവശ്യമായി ചുമത്താതെ അന്വേഷണഭാവം നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא
  choice: പേരിട്ടു
  rationale: ഒരു വ്യക്തിക്ക് പിന്നാലെ മറ്റൊരു പേര് വരുന്ന ഈ നിർമാണത്തിൽ קרא പേരുനൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പേരിട്ടു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְהוֹשֵׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ ഹോശേയയ്ക്ക്
  rationale: എബ്രായ പിതൃനാമപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും הוֹשֵׁעַ എന്ന പേരിന്റെ ശബ്ദരൂപം ‘ഹോശേയ’യായി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוֹשֻׁעַ
  choice: യോശുവ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതവും എബ്രായ പേരിനെ യോജിച്ച രീതിയിൽ പ്രതിനിധീകരിക്കുന്നതുമായ രൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പര്യവേക്ഷണം’ അന്വേഷണസ്വഭാവം വ്യക്തമാക്കുന്നു; പേരുകൾ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ രൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
