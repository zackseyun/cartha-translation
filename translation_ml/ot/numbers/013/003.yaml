  source_fidelity: മുഖ്യപാഠം വַיִּשְׁלַח എന്ന ഭൂതകാല ക്രിയയെ ‘അയച്ചു’ എന്നും, מִמִּדְבַּר פָּארָן എന്ന സ്ഥലപ്രയോഗത്തെ ‘പാരാൻ മരുഭൂമിയിൽനിന്ന്’ എന്നും, עַל־פִּי יְהוָה എന്ന പ്രയോഗത്തെ ‘യഹ്‌വേയുടെ കല്പനപ്രകാരം’ എന്നും കൃത്യമായി നൽകുന്നു. ‘അവരെല്ലാവരും പുരുഷന്മാരും ഇസ്രായേൽമക്കളുടെ തലവന്മാരും ആയിരുന്നു’ എന്നത് כֻּלָּם, אֲנָשִׁים, רָאשֵׁי בְנֵי יִשְׂרָאֵל, കൂടാതെ ഊന്നലുള്ള הֵמָּה എന്നിവയുടെ അർഥവും ഘടനയും നിലനിർത്തുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലിയിലാണ്. ‘പുരുഷന്മാരും ... തലവന്മാരും’ എന്ന സമാന്തരഘടന എബ്രായത്തിലെ വിശേഷണ/തിരിച്ചറിയൽബന്ധം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
  terminology: ‘യഹ്‌വേ,’ ‘പാരാൻ,’ ‘മരുഭൂമി,’ ‘ഇസ്രായേൽമക്കൾ,’ ‘തലവന്മാർ’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭോചിതവുമാണ്. ദൈവനാമം സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ മുഖ്യവാക്യത്തിന്റെ അർഥം മാറ്റാതെ പ്രസക്തമായ പകരംവായനകളും എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥസൂചനയും നൽകുന്നു.
