id: NUM.13.3
reference: Numbers 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: ml
  text: അങ്ങനെ മോശെ യഹ്‌വേയുടെ കല്പനപ്രകാരം പാരാൻ മരുഭൂമിയിൽനിന്ന് അവരെ അയച്ചു.[a] അവരെല്ലാവരും പുരുഷന്മാരും ഇസ്രായേൽമക്കളുടെ തലവന്മാരും ആയിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ വചനപ്രകാരം.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “യഹ്‌വേയുടെ വായനുസരിച്ച്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “ഇസ്രായേല്യരുടെ നേതാക്കൾ.” എബ്രായത്തിൽ: “ഇസ്രായേൽമക്കളുടെ തലവന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ കഥനസന്ദർഭത്തിലെ സ്വാഭാവിക ഭൂതകാല അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מִמִּדְבַּר פָּארָן
  choice: പാരാൻ മരുഭൂമിയിൽനിന്ന്
  rationale: מִדְבָּר കൃഷിചെയ്യാത്ത വന്യപ്രദേശത്തെയും മരുഭൂമിയെയും സൂചിപ്പിക്കാം; മലയാള ബൈബിൾ ഭൂമിശാസ്ത്രശൈലിയിൽ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വേയുടെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വേയുടെ വായനുസരിച്ച്’ എന്ന എബ്രായ പ്രയോഗം ഒരു കല്പനയോ നിർദേശമോ അനുസരിച്ചുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: അവരെല്ലാവരും പുരുഷന്മാരും
  rationale: സംഘത്തിന്റെ സമഗ്രതയും പ്രതിനിധികൾ പുരുഷന്മാരായിരുന്നു എന്ന ലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ തലവന്മാർ
  rationale: ‘തലവന്മാർ’ എന്നത് רָאשֵׁי എന്ന രൂപകത്തെ സംരക്ഷിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ കുടുംബബന്ധപരമായ എബ്രായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: הֵמָּה
  choice: ആയിരുന്നു
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ ‘അവരെല്ലാവരും’ എന്ന മുൻപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിനാമമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: אֲנָשִׁים / בְנֵי יִשְׂרָאֵל എന്നതിലെ ലിംഗവും കുടുംബബന്ധപരമായ ഭാഷയും
  choice: പുരുഷന്മാർ ... ഇസ്രായേൽമക്കൾ
  alternative: നേതാക്കൾ ... ഇസ്രായേല്യർ
  rationale: ഈ പ്രതിനിധികൾ പുരുഷന്മാരായിരുന്നുവെന്ന സൂചനയും ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന ഉടമ്പടിസംബന്ധിയായ കുടുംബപ്രയോഗവും പ്രധാന പാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. എബ്രായത്തിന്റെ കുടുംബബന്ധപരവും രൂപകാത്മകവുമായ ഭാഷ കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ പദാനുപദരൂപം ഒഴിവാക്കി.
