source:
  edition: WLC
  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: ml
  text: അവർ വസിക്കുന്ന ദേശം എങ്ങനെയുള്ളതാണ്? അത് നല്ലതോ ചീത്തയോ? അവർ വസിക്കുന്ന പട്ടണങ്ങൾ എങ്ങനെയുള്ളവയാണ്? അവ പാളയങ്ങളിലാണോ, കോട്ടകെട്ടിയ സ്ഥലങ്ങളിലാണോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയങ്ങളിലാണോ ഉറപ്പുള്ള കോട്ടകളിലാണോ?” എബ്രായത്തിൽ പാളയംപോലെയുള്ള, തുറന്ന കുടിയിരിപ്പുകളും കോട്ടകെട്ടിയ സ്ഥലങ്ങളും തമ്മിലുള്ള വ്യത്യാസമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: ദേശം എങ്ങനെയുള്ളതാണെന്നും
  rationale: ചോദ്യം ദേശത്തിന്റെ സ്വഭാവവും അവസ്ഥയും അന്വേഷിക്കുന്നു. മലയാളത്തിൽ ‘എങ്ങനെയുള്ളത്’ എന്ന പ്രയോഗം ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: അവർ വസിക്കുന്ന
  rationale: എബ്രായത്തിലെ ഏകവചന സർവനാമം ദേശവാസികളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ‘അവർ’ ഉപയോഗിച്ചു.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: നല്ലതോ ചീത്തയോ
  rationale: ദേശത്തിന്റെ ഗുണത്തെക്കുറിച്ചുള്ള വിശാലമായ വിലയിരുത്തൽ നിലനിർത്തുന്നു; കൃഷിയോഗ്യത എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: ഇവിടെ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: הַבְּמַחֲנִים
  choice: പാളയങ്ങൾപോലെയുള്ള കുടിയിരിപ്പുകളിൽ
  rationale: מַחֲנִים എന്നത് പാളയങ്ങളെയോ തുറന്ന, കോട്ടകെട്ടാത്ത കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കാം. കോട്ടകെട്ടിയ സ്ഥലങ്ങളോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നതിനൊപ്പം ‘പാളയം’ എന്ന മൂലചിത്രം നിലനിർത്തുന്നു.
- source_word: בְּמִבְצָרִים
  choice: കോട്ടകെട്ടിയ സ്ഥലങ്ങളിൽ
  rationale: מִבְצָרִים എന്നതിന്റെ പ്രതിരോധസജ്ജമായ ഉറപ്പുള്ള സ്ഥലങ്ങൾ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യങ്ങളിലെ നിരീക്ഷണനിർദേശങ്ങളുടെ തുടർച്ചയായി വാക്യം രൂപപ്പെടുത്തി. എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനത്തെ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ബഹുവചനമായ ‘അവർ’ എന്നു നൽകി.
