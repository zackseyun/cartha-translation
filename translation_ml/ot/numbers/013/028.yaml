translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായതും കഥനത്തിന് യോജിച്ച ഗൗരവം പുലർത്തുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ശക്തമായ വൈരുധ്യവും പട്ടണങ്ങളുടെ പ്രതിരോധശേഷിയും വംശപരമ്പരാസൂചനയും നിലനിർത്തിയിരിക്കുന്നു.
