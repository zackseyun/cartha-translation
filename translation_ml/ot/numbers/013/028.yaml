  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: ml
  text: എന്നാൽ ദേശത്ത് പാർക്കുന്ന ജനങ്ങൾ ശക്തരാണ്; പട്ടണങ്ങൾ കോട്ടകെട്ടി ഉറപ്പിച്ചവയും വളരെ വലുതുമാണ്; മാത്രമല്ല, അനാക്കിന്റെ സന്തതികളെയും[a] ഞങ്ങൾ അവിടെ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനാക്കിന്റെ മക്കളെയും.’ എബ്രായപ്രയോഗം അനാക്കിൽനിന്നു വന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അനുകൂല റിപ്പോർട്ടിനു ശക്തമായ ഒരു മറുവശം അവതരിപ്പിക്കുന്ന പ്രയോഗം; ആ വൈരുധ്യഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַז
  choice: ശക്തരാണ്
  rationale: ദേശവാസികളുടെ കരുത്തിനെയും നേരിടാൻ പ്രയാസമുള്ള സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘ഭീകരരാണ്’ എന്നതുപോലെ ശത്രുതയുടെ അർഥം അധികമായി ചേർക്കുന്നില്ല.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: ദേശത്തു പാർക്കുന്ന ജനം
  rationale: എബ്രായ പങ്കാളിക്രിയാ ഘടനയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְהֶעָרִים בְּצֻרוֹת
  choice: പട്ടണങ്ങൾ കോട്ടകെട്ടി ഉറപ്പിച്ചവയും
  rationale: בְּצֻרוֹת എന്ന പദത്തിന്റെ സൈനിക പ്രതിരോധാർഥം വ്യക്തമാക്കുന്നു; വെറും ‘മതിലുള്ളവ’ എന്നതിനെക്കാൾ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: גְּדֹלֹת מְאֹד
  choice: വളരെ വലുതുമാണ്
  rationale: പട്ടണങ്ങളുടെ വലുപ്പവും מְאֹד നൽകുന്ന തീവ്രതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְגַם
  choice: മാത്രമല്ല
  rationale: റിപ്പോർട്ടിലെ മറ്റൊരു ആശങ്കാജനകമായ വിവരം കൂട്ടിച്ചേർക്കുന്ന ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְלִדֵי הָעֲנָק
  choice: അനാക്കിന്റെ സന്തതികൾ
  rationale: അനാക്കിൽനിന്നുള്ള വംശപരമ്പരയാണ് ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥമായ ‘മക്കൾ’ എന്നതിനെക്കാൾ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: רָאִינוּ שָׁם
  choice: ഞങ്ങൾ അവിടെ കണ്ടു
  rationale: റിപ്പോർട്ടിലെ പൂർത്തിയായ നേരിട്ടുള്ള അനുഭവത്തെ ലളിതമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുകയും സ്ഥലസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
