  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടികയുടെ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ വ്യക്തമാകുന്നതിനാൽ וְ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയില്ല; אֵלֶּהയുടെ നിർദേശാർഥം ‘ഇവ’യായി നിലനിർത്തി.
- source_word: שְׁמוֹתָם
  choice: അവരുടെ പേരുകൾ
  rationale: പ്രത്യയത്തിലെ ബഹുവചന ഉടമസ്ഥത ‘അവരുടെ’ എന്നും שֵׁמוֹת ‘പേരുകൾ’ എന്നും നേരിട്ട് നൽകി; ‘ആണ്’ ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാമുഖം രൂപപ്പെടുത്തി.
- source_word: לְמַטֵּה רְאוּבֵן
  choice: രൂബേൻ ഗോത്രത്തിൽനിന്ന്
  rationale: ഈ പ്രതിനിധിപ്പട്ടികയിൽ לְ ഗോത്രബന്ധവും അവിടെനിന്നുള്ള തിരഞ്ഞെടുപ്പും സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ‘ഗോത്രത്തിൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: שַׁמּוּעַ
  choice: ശമ്മൂവ
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനദ്വിത്വവും അവസാനത്തെ guttural സ്വരഭാവവും കഴിയുന്നത്ര പ്രതിഫലിപ്പിക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന ഹീബ്രായ പദത്തിന് സ്വാഭാവികമായ മലയാള സമാനപദം.
- source_word: זַכּוּר
  choice: സക്കൂർ
  rationale: ഹീബ്രായ വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ദ്വിത്വ ക് ശബ്ദവും ദീർഘ ū സ്വരവും പ്രതിഫലിപ്പിച്ചു.
