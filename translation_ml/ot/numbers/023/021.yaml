  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: ml
  text: യഹ്‌വെ യാക്കോബിൽ കഷ്ടത കണ്ടിട്ടില്ല; ഇസ്രായേലിൽ ദുരിതം കണ്ടിട്ടുമില്ല.[a] അവന്റെ ദൈവമായ യഹ്‌വെ അവനോടുകൂടെയുണ്ട്; രാജാവിന്റെ ആർപ്പുവിളി അവരുടെ ഇടയിലുണ്ട്.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യാക്കോബിൽ അവൻ അധർമ്മം കണ്ടിട്ടില്ല; ഇസ്രായേലിൽ തിന്മയോ വക്രതയോ കണ്ടിട്ടുമില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദങ്ങൾക്ക് ധാർമികമായ അർഥവും (‘അധർമ്മം’) കഷ്ടതയുടെയോ ദുരിതത്തിന്റെയോ അർഥവും ഉണ്ടാകാം.'
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥം: “അവനിൽ.” ഈ വാക്യത്തിന്റെ ആദ്യഭാഗത്തിൽ ഇസ്രായേൽ ഒരു സമൂഹവാചക ഏകവചനമായി പറയപ്പെടുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: “രാജാവിന്റെ ആർപ്പുവിളി” എന്നത് ഇസ്രായേലിന്റെ ഇടയിലെ രാജകീയ ജയഘോഷത്തെ സൂചിപ്പിക്കാം; യഹ്‌വെയുടെ രാജകീയ സാന്നിധ്യത്തിലേക്കുള്ള സൂചനയും ഇതിലുണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: കണ്ടിട്ടില്ല
  rationale: നבט ശ്രദ്ധയോടെ നോക്കുക, കാണുക എന്നർഥം നൽകുന്നു. സമാന്തരമായ ראהയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി ‘കണ്ടിട്ടില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി; ശ്രദ്ധയോടെ പരിഗണിക്കുക എന്ന സൂക്ഷ്മഭാവം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: אָוֶן
  choice: കഷ്ടത
  rationale: ഈ പദത്തിന് അധർമ്മം, തിന്മ, അനർത്ഥം, കഷ്ടത എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ബിലെയാമിന്റെ അനുഗ്രഹവചനത്തിന്റെ പശ്ചാത്തലത്തിലും עָמָל എന്ന സമാന്തരപദത്തോടുള്ള ബന്ധത്തിലും ഇവിടെ ‘കഷ്ടത’ യോജിക്കുന്നു; ധാർമിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: רָאָה
  choice: കണ്ടിട്ടുമില്ല
  rationale: ראה എന്ന സാധാരണ ദർശനക്രിയയുടെ നേരിട്ടുള്ള പരിഭാഷ; ആദ്യ പാദത്തോടുള്ള കാവ്യസമാന്തര്യം നിലനിർത്തുന്നു.
- source_word: עָמָל
  choice: ദുരിതം
  rationale: അധ്വാനം, ക്ലേശം, ദുരിതം, ദുഷ്ടത എന്നിവ സൂചിപ്പിക്കാവുന്ന പദം. ‘ദുരിതം’ ആദ്യ പാദത്തിലെ ‘കഷ്ടത’യിൽനിന്ന് വേർതിരിച്ചും സമാന്തരമായ കഷ്ടാനുഭവത്തിന്റെ ആശയം നിലനിർത്തിയും നൽകുന്നു.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: യാക്കോബിൽ / ഇസ്രായേലിൽ
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥലസൂചക അർഥവും എബ്രായ കാവ്യത്തിലെ സമാന്തരഘടനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, അതിന്റെ സാധാരണ ശാസ്ത്രീയ ഉച്ചാരണരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֱלֹהָיו
  choice: അവന്റെ ദൈവമായ
  rationale: ഏകവചന പുല്ലിംഗ പ്രത്യയം സംരക്ഷിക്കുന്നു; യാക്കോബ്/ഇസ്രായേൽ എന്ന ജനത്തെ ഇവിടെ സമൂഹവാചക ഏകവചനമായി വ്യക്തിവൽക്കരിച്ചിരിക്കുന്നു.
- source_word: עִמּוֹ
  choice: അവനോടുകൂടെയുണ്ട്
  rationale: എബ്രായത്തിലെ ഏകവചന പ്രത്യയം നിലനിർത്തി ഇസ്രായേലിന്റെ സമൂഹവാചക വ്യക്തിവൽക്കരണം സംരക്ഷിക്കുന്നു.
- source_word: תְרוּעַת
  choice: ആർപ്പുവിളി
  rationale: תְּרוּעָה സന്തോഷഘോഷം, യുദ്ധവിളി, രാജകീയ ജയഘോഷം എന്നിവ സൂചിപ്പിക്കാം. ‘ആർപ്പുവിളി’ ഇവയിൽ ഒന്നിലേക്കും അർഥം ചുരുക്കാതെ ശബ്ദഘോഷത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: מֶלֶךְ
  choice: രാജാവിന്റെ
  rationale: മലയാളത്തിൽ അനിശ്ചിത ഉപപദമില്ലാത്തതിനാൽ ‘രാജാവിന്റെ’ എന്നത് ‘ഒരു രാജാവിന്റെ’ എന്ന എബ്രായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; രാജാവ് ആരെന്നത് വ്യക്തമാക്കുന്നില്ല.
- source_word: בּוֹ
  choice: അവരുടെ ഇടയിലുണ്ട്
  rationale: രൂപപരമായി ‘അവനിൽ’ എന്ന സമൂഹവാചക ഏകവചനമാണ്. എന്നാൽ ജനസമൂഹത്തിന്റെ നടുവിലുള്ള ഘോഷം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘അവരുടെ ഇടയിൽ’ എന്നു നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യാക്കോബ്/ഇസ്രായേൽ ധാർമികമായി പാപരഹിതനാണെന്നാണോ, അതോ അവനിൽ കഷ്ടതയോ അനർത്ഥമോ കാണുന്നില്ലെന്നാണോ വാക്യം പറയുന്നത്?
  choice: മുഖ്യപാഠത്തിൽ കഷ്ടതയും ദുരിതവും എന്ന അനുഭവപരമായ അർഥം നൽകി.
  alternative: ‘യാക്കോബിൽ അധർമ്മം കണ്ടിട്ടില്ല; ഇസ്രായേലിൽ തിന്മ/വക്രത കണ്ടിട്ടുമില്ല.’
  rationale: אָוֶן, עָמָל എന്നീ പദങ്ങൾക്ക് ധാർമികവും ദുരിതസംബന്ധവുമായ അർഥങ്ങൾ സാധ്യമാണ്. അനുഗ്രഹവചനത്തിന്റെ സന്ദർഭത്തിൽ കഷ്ടത/ദുരിതം യോജിച്ചാലും ധാർമിക വായന യഥാർഥമായ സാധ്യതയാണ്; അതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ‘രാജാവ്’ യഹ്‌വെയെത്തന്നെയാണോ സൂചിപ്പിക്കുന്നത്?
  choice: ‘രാജാവിന്റെ ആർപ്പുവിളി’ എന്നു മാത്രം നൽകി, രാജാവിനെ വ്യക്തമായി തിരിച്ചറിഞ്ഞില്ല.
  alternative: ‘ദൈവിക രാജാവിനുള്ള ജയഘോഷം’ അല്ലെങ്കിൽ ‘അവരുടെ രാജാവിനുള്ള ആർപ്പുവിളി.’
  rationale: യഹ്‌വെയുടെ സാന്നിധ്യത്തെ തുടർന്നാണ് ഈ പ്രയോഗമെങ്കിലും, എബ്രായപാഠം രാജാവിനെ തുറന്നു തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ രാജകീയ സാന്നിധ്യസൂചന നിലനിർത്തി വ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാക്കോബ്/ഇസ്രായേൽ എന്ന സമൂഹത്തെ ഏകവചനമായി വ്യക്തിവൽക്കരിക്കുന്ന എബ്രായരീതി സാധ്യമായിടത്ത് നിലനിർത്തി; അവസാനത്തെ בּוֹ മാത്രം മലയാളവായനയിലെ സ്വാഭാവികതയ്ക്കായി ബഹുവചന സമൂഹരൂപത്തിൽ നൽകി, അടിക്കുറിപ്പിലൂടെ അക്ഷരാർഥം അറിയിച്ചു. കാവ്യസമാന്തര്യം അർദ്ധവിരാമങ്ങൾകൊണ്ട് തെളിയിച്ചു.
