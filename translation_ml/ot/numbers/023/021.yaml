  to: യഹ്‌വെ യാക്കോബിൽ കഷ്ടത കണ്ടിട്ടില്ല; ഇസ്രായേലിൽ ദുരിതം കണ്ടിട്ടുമില്ല.[a] അവന്റെ ദൈവമായ യഹ്‌വെ അവനോടുകൂടെയുണ്ട്; രാജാവിന്റെ ആർപ്പുവിളി അവരുടെ ഇടയിലുണ്ട്.[b][c]
