id: NUM.23.26
reference: Numbers 23:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: ml
  text: 'ബിലെയാം ബാലാക്കിനോടു മറുപടിയായി പറഞ്ഞു: “യാഹ്‌വെ പറയുന്നതെല്ലാം ഞാൻ ചെയ്യുമെന്ന് നിന്നോടു പറഞ്ഞില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: എബ്രായത്തിലെ ‘ഉത്തരം പറഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: നിന്നോടു പറഞ്ഞില്ലേ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന ഭൂതകാല വാചാടോപചോദ്യത്തിന്റെ ശക്തി വ്യക്തമായി പകരുന്നു.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר
  choice: അരുളിച്ചെയ്യുന്നതെല്ലാം
  rationale: כֹּל אֲשֶׁר എന്നതിന്റെ സമഗ്രത നിലനിർത്തുന്നു; ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കാൻ ‘അരുളിച്ചെയ്യുക’ മാന്യവും സ്വാഭാവികവുമാണ്. ഇവിടെ imperfect രൂപം സാഹചര്യാനുസൃതമായ പൊതുതത്ത്വമായി മനസ്സിലാക്കാം.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: ഞാൻ ചെയ്യും
  rationale: אֹתוֹ മുൻപറഞ്ഞ മുഴുവൻ കാര്യത്തെയും തിരിച്ചുചൂണ്ടുന്നു; മലയാളത്തിൽ ‘അരുളിച്ചെയ്യുന്നതെല്ലാം ഞാൻ ചെയ്യും’ എന്നു പറയുന്നത് ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരോ ‘Jehovah’ ആധാരമായ രൂപമോ സ്വീകരിക്കുന്നില്ല.
- issue: ബിലെയാമിന്റെ പ്രസ്താവന ബാധ്യതയാണോ ഭാവിപ്രതിജ്ഞയാണോ
  choice: ഞാൻ ചെയ്യും
  alternative: ഞാൻ ചെയ്യേണ്ടതാണ്
  rationale: אֶעֱשֶׂה എന്ന രൂപം നേരിട്ട് ഭാവി/സന്നദ്ധത പ്രകടിപ്പിക്കുന്നു. ‘ചെയ്യേണ്ടതാണ്’ എന്നു നൽകിയാൽ മൂലത്തിൽ തുറന്നുപറയാത്ത നിർബന്ധത്തിന്റെ ആശയം അധികമായി ചേർന്നേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനാത്മകമായ ഉദ്ധരണിഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷ ഉദ്ധരണിയായി ചുരുക്കിയെങ്കിലും വാചാടോപചോദ്യവും സമഗ്രമായ അനുസരണപ്രഖ്യാപനവും നിലനിർത്തിയിരിക്കുന്നു.
