  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: ml
  text: ഇതാ[a], അനുഗ്രഹിക്കാൻ ഞാൻ ഏറ്റുവാങ്ങിയിരിക്കുന്നു; അനുഗ്രഹിച്ചിരിക്കുന്നു, എനിക്ക് അത് പിൻവലിക്കാനാവില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഏറ്റുവാങ്ങിയിരിക്കുന്നു’ എന്ന ക്രിയയുടെ കർമം ഹീബ്രുവിൽ വ്യക്തമാക്കിയിട്ടില്ല; അക്ഷരാർഥത്തിൽ, ‘അനുഗ്രഹിക്കാൻ ഞാൻ ഏറ്റുവാങ്ങിയിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘എനിക്ക് അത് തിരിച്ചാക്കാനാവില്ല’ അല്ലെങ്കിൽ ‘മാറ്റിമറിക്കാനാവില്ല.’ ‘അനുഗ്രഹിച്ചിരിക്കുന്നു’ എന്നതിലെ കർത്താവിനെ ഹീബ്രു പ്രത്യേകം നാമകരണം ചെയ്യുന്നില്ല; സന്ദർഭം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בָרֵךְ
  choice: അനുഗ്രഹിക്കാനാണ്
  rationale: לָקָחְתִּי എന്ന ക്രിയയോടു ചേർന്ന് ലഭിച്ച ദൗത്യത്തിന്റെയോ അരുളപ്പാടിന്റെയോ ഉള്ളടക്കം സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഒരു നാമപദം ചേർക്കാതെ ക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָקָחְתִּי
  choice: ഞാൻ ഏറ്റുവാങ്ങിയിരിക്കുന്നത്
  rationale: അടിസ്ഥാന അർഥമായ ‘എടുത്തു/ലഭിച്ചു’ എന്നത് പ്രവാചകസന്ദർഭത്തിൽ ‘ഏറ്റുവാങ്ങി’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ‘കല്പന’ എന്ന മൂലത്തിൽ ഇല്ലാത്ത കർമം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וּבֵרֵךְ
  choice: അവിടുന്ന് അനുഗ്രഹിച്ചിരിക്കുന്നു
  rationale: മൂന്നാംപുരുഷ ഏകവചന കർത്താവ് ക്രിയയിൽ ഉൾക്കൊള്ളുന്നു; സന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ മാന്യമായ സർവനാമം ഉപയോഗിക്കുന്നു, അതേസമയം വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲשִׁיבֶנָּה
  choice: എനിക്ക് അത് മാറ്റിക്കളയാനാവില്ല
  rationale: שׁוב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ഇവിടെ നൽകിയ അനുഗ്രഹത്തെ തിരികെവലിക്കുകയോ ഫലം മാറ്റുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അസാധ്യത വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അനുഗ്രഹിച്ചിരിക്കുന്നു’ എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: മുഖ്യവാചകത്തിൽ ‘അവിടുന്ന്’ എന്നു നൽകി, അത് ദൈവമാണെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: പരോക്ഷമായ ‘ഒരാൾ അനുഗ്രഹിച്ചിരിക്കുന്നു’ എന്ന വായന, അല്ലെങ്കിൽ കർത്താവിനെ പറയാതെയുള്ള പുനർരചന.
  rationale: ഹീബ്രു ക്രിയ കർത്താവിന്റെ ലിംഗവും വചനവും സൂചിപ്പിക്കുന്നുവെങ്കിലും നാമം പറയുന്നില്ല; സമീപസന്ദർഭം ദൈവത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. ‘അവിടുന്ന്’ ഈ സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ കൈമാറുന്നു, എന്നാൽ മൂലത്തിലെ പരോക്ഷത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രവാചകപ്രസംഗത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി; മൂലത്തിൽ ഇല്ലാത്ത ‘കല്പന’ പോലുള്ള നാമങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി സാധാരണ മാന്യപ്രയോഗമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
