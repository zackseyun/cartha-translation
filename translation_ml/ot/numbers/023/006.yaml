  text: וַ/יָּ֣שָׁב אֵלָ֔י/ו וְ/הִנֵּ֥ה נִצָּ֖ב עַל עֹלָת֑/וֹ ה֖וּא וְ/כָל שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: ml
  text: പിന്നെ അവൻ അവന്റെ അടുക്കൽ മടങ്ങിവന്നു. ഇതാ, അവൻ തന്റെ ഹോമയാഗത്തിന്റെ അരികിൽ മോവാബിലെ സകല പ്രഭുക്കന്മാരോടുംകൂടെ നിൽക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: പിന്നെ അവൻ അവന്റെ അടുക്കൽ മടങ്ങിവന്നു
  rationale: ‘അവൻ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ സർവനാമസന്ദിഗ്ധത നിലനിർത്തുന്നു; സന്ദർഭം അനുസരിച്ച് മടങ്ങിവന്നത് ബിലെയാമും സമീപിച്ച വ്യക്തി ബാലാക്കുമാണ്.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ
  rationale: കാഴ്ചയിലെ ശ്രദ്ധേയമായ സാഹചര്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇതാ’ എന്ന കൂടുതൽ അക്ഷരാർഥമായ രൂപം ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: തന്റെ ഹോമയാഗത്തിന്റെ അരികിൽ ... നിൽക്കുകയായിരുന്നു
  rationale: עַל ഇവിടെ യാഗത്തിന്റെ സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘അരികിൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്. עֹלָה-യുടെ പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ തുല്യപദം ‘ഹോമയാഗം’ ആണ്.
- source_word: שָׂרֵי מוֹאָב
  choice: മോവാബിലെ സകല പ്രഭുക്കന്മാർ
  rationale: שָׂרִים എന്നത് ഭരണനേതാക്കളെയോ ഉന്നതാധികാരികളെയോ സൂചിപ്പിക്കുന്നു; ‘പ്രഭുക്കന്മാർ’ സന്ദർഭോചിതമായ dignified rendering ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. മൂലപാഠത്തിലെ സർവനാമങ്ങൾ വിശദീകരണമായി പേരുകളാക്കി മാറ്റാതെ നിലനിർത്തിയിരിക്കുന്നു.
