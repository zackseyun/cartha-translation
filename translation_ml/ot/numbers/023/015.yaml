source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: ml
  text: 'അവൻ ബാലാക്കിനോടു പറഞ്ഞു: “നിന്റെ ഹോമയാഗത്തിന്റെ അരികിൽ ഇവിടെ നിൽക്കുക; ഞാൻ അവിടെവച്ച് അവനെ കണ്ടുമുട്ടാൻ പോകും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ അവിടെവച്ച് കണ്ടുമുട്ടും’ എന്നോ ‘ഞാൻ അവിടെവച്ച് അവനെ അഭിമുഖീകരിക്കാൻ പോകും’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഹീബ്രായ ക്രിയ സംക്ഷിപ്തമാണ്; ആരെയാണ് കണ്ടുമുട്ടുന്നതെന്ന് ഈ വാക്യത്തിൽ വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: അവൻ ബാലാക്കിനോടു പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ wayyiqtol സ്വാഭാവികമായ മലയാള കഥനരീതിയിൽ അവതരിപ്പിക്കുന്നു; ‘അപ്പോൾ’ എന്ന കാലസൂചന നിർബന്ധമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: הִתְיַצֵּב
  choice: നിൽക്കുക
  rationale: Hitpael ആജ്ഞാരൂപം ഒരിടത്ത് നിലകൊള്ളുക എന്ന ആശയം നൽകുന്നു; ആധുനിക മലയാളത്തിൽ ‘നിൽക്കുക’ സ്വാഭാവികവും മതിയുമായ പ്രയോഗമാണ്.
- source_word: כֹּה
  choice: ഇവിടെ
  rationale: ആദ്യത്തെ כֹּה ബാലാക്ക് നിലകൊള്ളേണ്ട സ്ഥലം ചൂണ്ടിക്കാണിക്കുന്ന സ്ഥാനസൂചകമായി ഗ്രഹിച്ചിരിക്കുന്നു.
- source_word: עַל עֹלָתֶךָ
  choice: നിന്റെ ഹോമയാഗത്തിന്റെ അരികിൽ
  rationale: עַל ഇവിടെ ‘മേൽ’ എന്നതിലുപരി ‘അരികിൽ/അടുത്ത്’ എന്ന സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു; עֹלָה പൂർണമായി ദഹിപ്പിക്കുന്ന ഹോമയാഗമാണ്.
- source_word: וְאָנֹכִי
  choice: ഞാൻ
  rationale: വ്യക്തിപ്രത്യയം ബാലാക്കിന്റെ നിൽപ്പിനും ബിലെയാമിന്റെ പ്രവർത്തിക്കും ഇടയിലെ മൃദുവായ വ്യത്യാസം നിലനിർത്തുന്നു; മലയാള വാക്യഘടനയിൽ സംയോജകപദം നിർബന്ധമല്ല.
- source_word: אִקָּרֶה
  choice: അവനെ കണ്ടുമുട്ടാൻ പോകാം
  rationale: קרה എന്ന ധാതുവിന്റെ Niphal രൂപം ഇവിടെ ഒരു കൂടിക്കാഴ്ചയിലേക്കോ അഭിമുഖീകരണത്തിലേക്കോ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ക്രിയ സംക്ഷിപ്തവും വസ്തു പരാമർശിക്കാത്തതുമായതിനാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה
  choice: അവിടെവച്ച്
  rationale: രണ്ടാമത്തെ כֹּה ബാലാക്ക് നിൽക്കുന്ന ‘ഇവിടെ’ എന്ന സ്ഥലത്തിൽനിന്നു വേറിട്ട സ്ഥലം ചൂണ്ടിക്കാണിക്കുന്നു; ‘അവിടെവച്ച്’ ഈ വിരോധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബിലെയാം ഉദ്ദേശിക്കുന്ന കൂടിക്കാഴ്ചയുടെ പരാമർശിക്കാത്ത കർമം
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെ’ എന്നു സന്ദർഭാനുസൃതമായി ചേർത്തു; വ്യക്തിയെ പേരെടുത്ത് വ്യക്തമാക്കിയില്ല.
  alternative: ‘ഞാൻ അവിടെവച്ച് കണ്ടുമുട്ടാം’ അല്ലെങ്കിൽ ‘ഞാൻ അവിടെവച്ച് ഒരു അഭിമുഖീകരണം പ്രാപിക്കാം’ എന്നു കൂടുതൽ അവ്യക്തമായി നൽകുക.
  rationale: സന്ദർഭം ദൈവിക അഭിമുഖീകരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല. ‘അവനെ’ മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കുന്നു; ദൈവനാമം ചേർക്കാതിരിക്കുന്നത് മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘ഹോമയാഗം’ പൊതുവായി പരിചിതമായ ബൈബിൾപരമായ പദമായി നിലനിർത്തി. ‘ഇവിടെ/അവിടെവച്ച്’ എന്ന ആവർത്തനം ഹീബ്രായത്തിലെ സ്ഥാനസൂചക വിരോധം പ്രകടമാക്കുന്നു.
