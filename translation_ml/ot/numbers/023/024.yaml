  source_fidelity: 'The Malayalam closely represents the Hebrew poetic oracle: הֶן is appropriately rendered “ഇതാ,” עָם as a collective “ഒരു ജനം,” and the two lion terms are differentiated as “പെൺസിംഹം” and “സിംഹം.” The rising/standing imagery, the future-force of “it will not lie down,” and the unsoftened imagery of eating prey and drinking the blood of the slain are all retained. The Malayalam ordering of the final clause is natural and preserves the Hebrew’s temporal condition.'
