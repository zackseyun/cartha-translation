id: NUM.23.24
reference: Numbers 23:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: ml
  text: 'ഇതാ, ഒരു ജനം പെൺസിംഹത്തെപ്പോലെ[a] എഴുന്നേൽക്കുന്നു;

    സിംഹത്തെപ്പോലെ അത് ഉയർന്നുനിൽക്കുന്നു.

    ഇര തിന്നുകയും കൊല്ലപ്പെട്ടവരുടെ രക്തം കുടിക്കുകയും ചെയ്യുന്നതുവരെ

    അത് കിടക്കുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിംഹത്തെപ്പോലെ.’ എബ്രായത്തിലെ לָבִיא എന്ന പദം പൊതുവായി ‘സിംഹം’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ പിന്നാലെയുള്ള אֲרִי (‘സിംഹം’) എന്ന പദത്തിൽനിന്നുള്ള പദഭേദം നിലനിർത്താനാണ് ഇവിടെ ‘പെൺസിംഹം’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ഇതാ
  rationale: ശക്തമായ ഒരു നിരീക്ഷണത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ വ്യാക്ഷേപത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עָם
  choice: ഒരു ജനം
  rationale: ഇസ്രായേലിനെ ഒരു കൂട്ടായ ജനസമൂഹമായി അവതരിപ്പിക്കുന്ന കാവ്യാത്മക അർഥം ‘രാഷ്ട്രം’ എന്നതിനെക്കാൾ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: כְּלָבִיא
  choice: പെൺസിംഹത്തെപ്പോലെ
  rationale: לָבִיא എന്ന പദത്തിന് പൊതുവായി ‘സിംഹം’ എന്നും അർഥമാകാമെങ്കിലും, പിന്നാലെയുള്ള אֲרִי എന്ന വ്യത്യസ്ത പദത്തിൽനിന്നുള്ള പദഭേദം ദൃശ്യമാക്കാൻ ‘പെൺസിംഹം’ സ്വീകരിച്ചു.
- source_word: יָקוּם
  choice: എഴുന്നേൽക്കുന്നു
  rationale: ഇരപിടിയൻ മൃഗം ശക്തിയോടെ എഴുന്നേൽക്കുന്ന സജീവമായ ദൃശ്യവും കാവ്യത്തിലെ തത്സമയഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וְכַאֲרִי
  choice: സിംഹത്തെപ്പോലെ
  rationale: אֲרִי എന്ന സാധാരണ സിംഹപദം ലളിതമായി പരിഭാഷപ്പെടുത്തി; പ്രായമോ വലുപ്പമോ അനാവശ്യമായി കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: יִתְנַשָּׂא
  choice: ഉയർന്നുനിൽക്കുന്നു
  rationale: സ്വയം ഉയർത്തി ശക്തമായ ഭാവത്തിൽ നിൽക്കുന്ന മൃഗത്തിന്റെ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘സ്വയം മഹത്ത്വപ്പെടുത്തുന്നു’ എന്ന അമൂർത്ത അർഥം ഒഴിവാക്കുന്നു.
- source_word: לֹא יִשְׁכַּב
  choice: അത് കിടക്കുകയില്ല
  rationale: സിംഹത്തിന്റെ ദൃശ്യത്തെ മൂർത്തമായി നിലനിർത്തുകയും സന്ദർഭത്തിലെ ഭാവിനിശ്ചയത്തിന്റെ ശക്തി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: עַד יֹאכַל טֶרֶף
  choice: ഇര തിന്നുന്നതുവരെ
  rationale: אָכַל എന്ന സാധാരണ ‘തിന്നുക’ എന്ന ക്രിയയെ വ്യാഖ്യാനപരമായി ‘വിഴുങ്ങുക’ എന്നു ശക്തിപ്പെടുത്താതെ അടുത്തായി പിന്തുടരുന്നു; טֶרֶף ‘ഇര’യായി നൽകുന്നു.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: കൊല്ലപ്പെട്ടവരുടെ രക്തം കുടിക്കുകയും ചെയ്യുന്നതുവരെ
  rationale: യുദ്ധസന്ദർഭത്തിൽ חֲלָלִים സാധാരണയായി കൊല്ലപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ കടുത്ത രക്തപാനദൃശ്യം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബിലെയാമിന്റെ അരുളപ്പാടിലെ അക്രമദൃശ്യം
  choice: ഇര തിന്നുന്നതും കൊല്ലപ്പെട്ടവരുടെ രക്തം കുടിക്കുന്നതുമായ കടുത്ത സിംഹദൃശ്യം അതേപടി നിലനിർത്തി.
  alternative: ഇത് പൊതുവായ ജയഭാഷയായി മയപ്പെടുത്തുക.
  rationale: എബ്രായകാവ്യം ജനത്തിന്റെ തടയാനാവാത്ത യുദ്ധവിജയവും ശക്തിയും ഇരപിടിയൻ മൃഗത്തിന്റെ രൂപകത്തിലൂടെ ഉദ്ദേശപൂർവം കടുപ്പത്തോടെ അവതരിപ്പിക്കുന്നു. ഇത് അക്ഷരാർഥത്തിൽ രക്തം കുടിക്കാനുള്ള നിർദേശമെന്നല്ല; എങ്കിലും മൂലത്തിലെ ദൈവശാസ്ത്രപരവും നൈതികവുമായ സംഘർഷം പരിഭാഷയിൽ ഇല്ലാതാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കാവ്യശൈലി ഉപയോഗിച്ചു. വരിവിന്യാസം എബ്രായ സമാന്തരഘടനയും അവസാനത്തെ ‘തുന്നതുവരെ ... കിടക്കുകയില്ല’ എന്ന ഉച്ചസ്ഥായിയും വ്യക്തമാക്കുന്നു.
