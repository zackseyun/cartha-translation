id: NUM.23.22
reference: Numbers 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: ml
  text: ദൈവം അവരെ ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവരുന്നു; കാട്ടുകാളയുടെ കൊമ്പുകൾപോലെയുള്ള ബലം അവനുണ്ട്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കാട്ടുകാളയുടെ കരുത്ത് അവനുണ്ട്.’ എബ്രായ പ്രയോഗം ദുഷ്കരമാണ്; അമൂർത്തമായ ‘ബലം’ എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാനാണ് മുഖ്യപാഠത്തിൽ കൊമ്പുകളുടെ ദൃശ്യബിംബം നിലനിർത്തിയത്.
    reason: lexical_alternative
  - marker: b
    text: പഴയ പരിഭാഷകളിൽ ‘യൂണിക്കോൺ’; എന്നാൽ ‘കാട്ടുകാള’ അഥവാ ‘ഔറോക്സ്’ ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ אֵל വാക്യത്തിന്റെ കർത്താവാണ്. സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ ‘ദൈവം’ എന്ന പരിഭാഷ മതിയായതിനാൽ ‘ശക്തനായ ദൈവം’ എന്ന അധികവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: מוֹצִיאָם
  choice: അവരെ ... പുറപ്പെടുവിക്കുന്നു
  rationale: ഹിഫീൽ വർത്തമാനകൃദന്തവും മൂന്നാം പുരുഷ ബഹുവചന പ്രത്യയവും ദൈവത്തെ അവരെ പുറത്തുകൊണ്ടുവരുന്നവനായി ചിത്രീകരിക്കുന്നു. പുറപ്പാട് സംഭവത്തെ സജീവമായി അവതരിപ്പിക്കുന്ന കാവ്യഭാവം നിലനിർത്താൻ വർത്തമാനകാലരൂപം ഉപയോഗിച്ചു.
- source_word: מִמִּצְרָיִם
  choice: ഈജിപ്തിൽനിന്നു
  rationale: ചലനം സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം ഇത് ഈജിപ്തിൽനിന്നുള്ള പുറപ്പാടിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כְּתוֹעֲפֹת
  choice: കൊമ്പുകൾപോലുള്ള കരുത്ത്
  rationale: ഈ ദുഷ്കരമായ ബഹുവചനപദത്തിന് ഉയർന്ന കൊമ്പുകൾ, പ്രബലമായ ഉയർച്ച, ശക്തി എന്നീ അർഥസാധ്യതകളുണ്ട്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കുന്നതിനൊപ്പം മൃഗത്തിന്റെയും കൊമ്പുകളുടെയും മൂർത്തമായ ദൃശ്യബിംബം നിലനിർത്താനാണ് ഈ രൂപം.
- source_word: רְאֵם
  choice: കാട്ടുകാള
  rationale: ഈ പദം ശക്തിയേറിയ ഒരു വന്യ ഗോവർഗമൃഗത്തെ, സാധ്യതയേറിയ രീതിയിൽ ഔറോക്സിനെ, സൂചിപ്പിക്കുന്നു. ‘കാട്ടുകാള’ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്; പഴയ പരിഭാഷകളിലെ ‘യൂണിക്കോൺ’ സാധ്യതയുള്ള മൂലാർത്ഥമല്ല.
- source_word: לוֹ
  choice: അവനുണ്ട്
  rationale: മസോറെറ്റിക് പാഠത്തിലെ മൂന്നാം പുരുഷ ഏകവചനപ്രത്യയം നിലനിർത്തി. മുമ്പുള്ള ‘അവരെ’ എന്ന ബഹുവചനവുമായി ഇതിനെ ഒത്താക്കിക്കൊണ്ട് ‘അവർക്കുണ്ട്’ എന്നു മാറ്റിയിട്ടില്ല; ഏകവചനം യിസ്രായേലിനെ സമൂഹപരമായി സൂചിപ്പിക്കാവുന്നതാണ്.
theological_decisions:
- issue: רְאֵם എന്ന മൃഗത്തിന്റെ തിരിച്ചറിയലും ശക്തിബിംബവും
  choice: കാട്ടുകാള
  alternative: ഔറോക്സ്; പഴയ പരിഭാഷാപാരമ്പര്യത്തിലെ ‘യൂണിക്കോൺ’
  rationale: വാക്യം പുരാണജീവിയെക്കുറിച്ചുള്ള പ്രസ്താവനയല്ല, ശക്തിയേറിയ വന്യ ഗോവർഗമൃഗത്തെ ആധാരമാക്കിയ കാവ്യബിംബമാണ്. അതിനാൽ ഇപ്പോഴത്തെ ഭാഷാശാസ്ത്രബോധത്തോടും സാധാരണ വായനാസൗകര്യത്തോടും യോജിക്കുന്ന ‘കാട്ടുകാള’ സ്വീകരിച്ചു.
- issue: לוֹ എന്ന ഏകവചനത്തിന്റെ സൂചന
  choice: ‘അവനുണ്ട്’ എന്ന ഏകവചനം നിലനിർത്തുക
  alternative: ‘അവർക്കുണ്ട്’ എന്നു ബഹുവചനമാക്കി യിസ്രായേലുമായി വ്യാകരണപരമായി ഒത്താക്കുക
  rationale: മൂലപാഠത്തിലെ ഏകവചനം സമൂഹമായ യിസ്രായേലിനെ ഏകകമായി സൂചിപ്പിക്കാം; അതിന്റെ അവ്യക്തത പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യഗദ്യം. ‘പുറപ്പെടുവിക്കുന്നു’ പുറപ്പാട് സംഭവത്തിന്റെ സജീവത നൽകുന്നു. ദുഷ്കരമായ രണ്ടാം അർധവാക്യം സ്വാഭാവിക മലയാളമാക്കാൻ ‘കരുത്ത്’ ചേർത്തെങ്കിലും ‘കൊമ്പുകൾ’ എന്ന മൂർത്തബിംബം നിലനിർത്തിയിട്ടുണ്ട്; ‘അവനുണ്ട്’ മൂലത്തിലെ ഏകവചന അവ്യക്തത സംരക്ഷിക്കുന്നു.
