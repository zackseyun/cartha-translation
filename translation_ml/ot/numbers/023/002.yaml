  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: ml
  text: ബിലെയാം പറഞ്ഞതുപോലെ ബാലാക്ക് ചെയ്തു. ബാലാക്കും ബിലെയാമും യാഗപീഠത്തിന്മേൽ ഒരു കാളയെയും ഒരു ആട്ടുകൊറ്റനെയും അർപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘കയറുമാറാക്കി’; യാഗസന്ദർഭത്തിൽ ഇത് ‘അർപ്പിച്ചു’ അല്ലെങ്കിൽ ‘യാഗമായി അർപ്പിച്ചു’ എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה כאשר דבר എന്ന പ്രയോഗത്തിൽ പറഞ്ഞതനുസരിച്ച് പ്രവർത്തിക്കുക എന്ന അർഥമാണ്; മലയാളത്തിൽ ‘പറഞ്ഞതുപോലെ ... ചെയ്തു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: പറഞ്ഞതുപോലെ
  rationale: ബിലെയാമിന്റെ നിർദേശത്തോട് ബാലാക്കിന്റെ പ്രവൃത്തി പൊരുത്തപ്പെട്ടുവെന്ന് താരതമ്യവാക്യം വ്യക്തമാക്കുന്നു.
- source_word: וַיַּעַל
  choice: അർപ്പിച്ചു
  rationale: עלה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗമൃഗങ്ങളും യാഗപീഠവും ഉൾപ്പെടുന്ന ഈ സന്ദർഭത്തിൽ യാഗമായി അർപ്പിക്കുക എന്ന സാങ്കേതിക അർഥം നൽകുന്നു.
- source_word: בָּלָק וּבִלְעָם
  choice: ബാലാക്കും ബിലെയാമും
  rationale: സംയുക്ത കർത്താക്കളെ മലയാളത്തിലെ സ്വാഭാവിക ‘-ഉം ... -ഉം’ ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: פָּר
  choice: കാള
  rationale: യാഗസന്ദർഭത്തിലെ פָּר ആൺകന്നുകാലിയെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രായം അനാവശ്യമായി നിർണയിക്കാതെ ‘കാള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וָאַיִל
  choice: ആട്ടുകൊറ്റൻ
  rationale: אַיִל എന്നത് ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പദമാണ്; ആധുനിക മലയാളത്തിൽ ‘ആട്ടുകൊറ്റൻ’ വ്യക്തമാണ്.
- source_word: בַּמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: യാഗസന്ദർഭത്തിലെ בְּ എന്ന സ്ഥലസൂചനയെ ‘-ന്മേൽ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അർപ്പണത്തിന്റെ കർത്തൃത്വം
  choice: ‘ബാലാക്കും ബിലെയാമും ... അർപ്പിച്ചു’ എന്ന സംയുക്ത കർത്തൃത്വം നിലനിർത്തി.
  alternative: ബാലാക്ക് മാത്രം അർപ്പിച്ചു, ബിലെയാം കൂടെയുണ്ടായിരുന്നു എന്നാക്കുക.
  rationale: ഹീബ്രു പാഠം ബാലാക്കിനെയും ബിലെയാമിനെയും വ്യക്തമായി സംയുക്ത കർത്താക്കളാക്കുന്നു; അവരുടെ കൃത്യമായ ആചാരപരമായ ചുമതലകൾ പാഠം വേർതിരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ ഏകവചനമായ കാളയും ആട്ടുകൊറ്റനും സംയുക്ത കർത്താക്കളോടൊപ്പം തെറ്റായി വായിക്കപ്പെടാതിരിക്കാൻ ‘ഓരോ’ ചേർത്തു; ഇത് തൊട്ടുമുമ്പുള്ള നിർദേശപ്രകാരം ഓരോ യാഗപീഠത്തിലുമുള്ള അർപ്പണത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തോടും പൊരുത്തപ്പെടുന്നു.
