revisions:
- from: യാക്കോബിന്റെ പൊടി എണ്ണാൻ ആർക്കു കഴിയും?[a] ഇസ്രായേലിന്റെ നാലിലൊന്നിനെപ്പോലും എണ്ണിത്തീർക്കാൻ ആർക്കു കഴിയും? എന്റെ പ്രാണൻ നേരുള്ളവരുടെ മരണം പ്രാപിക്കട്ടെ;[b] എന്റെ അന്ത്യം അവന്റേതുപോലെ ആയിരിക്കട്ടെ.[c]
