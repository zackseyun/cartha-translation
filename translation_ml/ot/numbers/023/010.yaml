id: NUM.23.10
reference: Numbers 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: ml
  text: യാക്കോബിന്റെ പൊടി എണ്ണാൻ ആർക്കു കഴിയും? ഇസ്രായേലിന്റെ നാലിലൊന്നിനെപ്പോലും[a] എണ്ണാൻ ആർക്കു കഴിയും? എന്റെ പ്രാണൻ നേരുള്ളവരുടെ മരണം പ്രാപിക്കട്ടെ;[b] എന്റെ അന്ത്യം അവന്റേതുപോലെ ആയിരിക്കട്ടെ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഇസ്രായേലിന്റെ പാളയവിഭാഗങ്ങൾ എണ്ണാൻ ആർക്കു കഴിയും?’ കൂടുതൽ വ്യാഖ്യാനപരമായി: ‘ഇസ്രായേലിന്റെ നാലിലൊന്നിനെപ്പോലും എണ്ണാൻ ആർക്കു കഴിയും?’'
    reason: רֹבַע എന്ന പദത്തിന് ‘നാലിലൊന്ന്’ എന്നും ‘പാദം/വിഭാഗം’ എന്നും സന്ദർഭത്തിൽ മനസ്സിലാക്കാവുന്ന വ്യാഖ്യാനസാധ്യതയുണ്ട്.
  - marker: b
    text: 'അഥവാ: ‘നീതിമാന്മാരുടെ മരണം.’'
    reason: יְשָׁרִים എന്നത് ‘നേരുള്ളവർ’ എന്നും ‘നീതിമാന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം.
  - marker: c
    text: 'എബ്രായത്തിൽ ഏകവചനം: ‘അവന്റേതുപോലെ.’ ‘നേരുള്ളവർ’ സമൂഹവാചകമാണെങ്കിലും, ഇവിടെ ഒരു പ്രതിനിധിയായ നേരുള്ള വ്യക്തിയെ സൂചിപ്പിച്ചിരിക്കാം.'
    reason: כָּמֹהוּ എന്ന പദത്തിലെ ഏകവചന പുല്ലിംഗ പ്രത്യയം മുൻപുള്ള സമൂഹവാചകമായ ‘നേരുള്ളവർ’ എന്നതുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
lexical_decisions:
- source_word: מִי מָנָה
  choice: എണ്ണാൻ ആർക്കു കഴിയും?
  rationale: മִי എന്ന ചോദ്യം സന്ദർഭത്തിൽ അസാധ്യത സൂചിപ്പിക്കുന്ന അലങ്കാരചോദ്യമാണ്; മലയാളത്തിൽ ‘കഴിയും’ ചേർക്കുന്നത് ആ ഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֲפַר יַעֲקֹב
  choice: യാക്കോബിന്റെ പൊടി
  rationale: പൊടിപോലെ അസംഖ്യമായ സന്തതിയെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു; കവിതാസമാന്തര്യത്തിലെ ഉടമ്പടിനാമമായ ‘യാക്കോബ്’ സംരക്ഷിക്കുന്നു.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ നാലിലൊന്നിനെപ്പോലും എണ്ണിത്തീർക്കാൻ ആർക്കു കഴിയും?
  rationale: רֹבַע എന്നതിന്റെ പ്രാഥമികമായ ‘നാലിലൊന്ന്’ എന്ന അർഥം നിലനിർത്തുന്നു. ‘പോലും’ വാചകത്തിന്റെ അതിശയോക്തിപരമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ക്രിയയും ചോദ്യഘടനയും ആദ്യപാദത്തിൽനിന്ന് പൂരിപ്പിച്ചിരിക്കുന്നു.
- source_word: תָּמֹת נַפְשִׁי
  choice: എന്റെ പ്രാണൻ ... മരണം പ്രാപിക്കട്ടെ
  rationale: נַפְשִׁי എന്ന വ്യക്തമായ കർത്താവിനെ ‘എന്റെ പ്രാണൻ’ എന്നു നിലനിർത്തുകയും ‘മരണം പ്രാപിക്കുക’ എന്ന മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം സ്വീകരിക്കുകയും ചെയ്യുന്നു.
- source_word: מוֹת יְשָׁרִים
  choice: നേരുള്ളവരുടെ മരണം
  rationale: יְשָׁרִים എന്ന പദത്തിന്റെ ‘നേരുള്ളവർ’ എന്ന നൈതിക രൂപകം സംരക്ഷിക്കുന്നു; കൂടുതൽ സാങ്കേതികമോ വ്യവസ്ഥാപിതമോ ആയ ദൈവശാസ്ത്രാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: וּתְהִי אַחֲרִיתִי כָּמֹהוּ
  choice: എന്റെ അന്ത്യം അവന്റേതുപോലെ ആയിരിക്കട്ടെ
  rationale: אַחֲרִיתִי എന്നതിന് സന്ദർഭോചിതമായി ‘എന്റെ അന്ത്യം’ എന്നും ഏകവചന പുല്ലിംഗ പ്രത്യയമായ כָּמֹהוּ സംരക്ഷിച്ച് ‘അവന്റേതുപോലെ’ എന്നും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: יְשָׁרִים എന്നതിന്റെ വിവർത്തനം
  choice: നേരുള്ളവർ
  alternative: നീതിമാന്മാർ
  rationale: ‘നേരുള്ളവർ’ എന്നത് ישר എന്ന മൂലപദത്തിന്റെ രൂപകവും നൈതികശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു; ‘നീതിമാന്മാർ’ എന്നു നൽകിയാൽ ഇവിടെ വ്യക്തമായി ഉദ്ദേശിക്കാത്ത കൂടുതൽ സാങ്കേതിക ദൈവശാസ്ത്രധ്വനി ഉണ്ടാകാം.
- issue: רֹבַע יִשְׂרָאֵל എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ഇസ്രായേലിന്റെ നാലിലൊന്ന്
  alternative: ഇസ്രായേലിന്റെ ജനസമൂഹം / ഇസ്രായേലിന്റെ പാളയവിഭാഗങ്ങൾ
  rationale: ‘നാലിലൊന്ന്’ മൂലപദത്തിന്റെ സാധാരണ അർഥം സംരക്ഷിക്കുകയും കൃത്യമായ സൂചന എന്തെന്ന അനിശ്ചിതത്വം പ്രധാനവാചകത്തിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: כָּמֹהוּ എന്ന ഏകവചനസൂചന
  choice: അവന്റേതുപോലെ
  alternative: അവരുടേതുപോലെ
  rationale: മൂലപാഠത്തിലെ ഏകവചന പുല്ലിംഗ പ്രത്യയം സംരക്ഷിക്കുന്നു. മുൻപുള്ള ‘നേരുള്ളവർ’ സമൂഹവാചകമായിരുന്നാലും, അത് പ്രതിനിധിയായ ഒരു നേരുള്ള വ്യക്തിയെ സൂചിപ്പിക്കാമെന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ കവിതാഭാവം സ്വീകരിച്ചു. ‘പൊടി’, ‘പ്രാണൻ’, ‘അന്ത്യം’ എന്നീ പദങ്ങൾ മൂലകാവ്യത്തിന്റെ രൂപകവും ഗൗരവവും നിലനിർത്തുന്നു. രണ്ടാം പാദത്തിലെ അപൂർണ്ണമായ സമാന്തരഘടന മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചോദ്യരൂപത്തിൽ പൂരിപ്പിച്ചു; ‘പോലും’ എന്നത് നാലിലൊന്നുപോലും എണ്ണാനാവില്ലെന്ന സന്ദർഭസൂചന നൽകുന്നു.
