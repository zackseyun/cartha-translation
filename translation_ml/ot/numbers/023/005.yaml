  terminology: ‘യഹ്‌വെ,’ ‘ബിലെയാം,’ ‘ബാലാക്ക്,’ ‘വചനം,’ and ‘ഇപ്രകാരം’ are appropriate. The divine name is correctly transliterated rather than replaced by a title.
