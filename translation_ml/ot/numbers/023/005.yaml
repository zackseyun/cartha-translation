id: NUM.23.5
reference: Numbers 23:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ ബിലെയാമിന്റെ വായിൽ ഒരു വചനം വെച്ചു പറഞ്ഞു: “ബാലാക്കിന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെല്ലുക; ഇപ്രകാരം നീ സംസാരിക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: വെച്ചിട്ട്
  rationale: שׂוּם എന്ന ക്രിയയുടെ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും, തുടർന്നുള്ള ക്രിയയുമായി സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധം സൃഷ്ടിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: דָּבָר
  choice: ഒരു വചനം
  rationale: എബ്രായ ഏകവചനവും ദൈവം നൽകുന്ന വാക്ക് എന്ന ആശയവും നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: בְּפִי
  choice: ബിലെയാമിന്റെ വായിൽ
  rationale: ‘ബിലെയാമിന്റെ വായിൽ’ എന്ന എബ്രായ ദൃശ്യപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: שׁוּב אֶל־בָּלָק
  choice: ബാലാക്കിന്റെ അടുക്കലേക്കു മടങ്ങിച്ചെല്ലുക
  rationale: שׁוּב എന്ന ആജ്ഞയുടെ മടങ്ങിപ്പോകൽ എന്ന ദിശാബോധവും אֶל എന്നതിന്റെ ലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְכֹה
  choice: ഇപ്രകാരം
  rationale: തുടർന്ന് പറയേണ്ട വാക്കുകളെയോ സംസാരരീതിയെയോ പരിചയപ്പെടുത്തുന്ന כֹּהയുടെ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תְדַבֵּר
  choice: നീ സംസാരിക്കണം
  rationale: דבר എന്ന ക്രിയയുടെ ‘സംസാരിക്കുക’ എന്ന അർഥവും സന്ദർഭത്തിലെ നിർദേശാത്മക ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ലിപ്യന്തരണം ചെയ്തു. ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനു പകരം സ്രോതസ്സിനോടു കൂടുതൽ അടുത്ത പൊതുവായ പണ്ഡിതോചിത രൂപം സ്വീകരിച്ചു.
- issue: ദൈവം ബിലെയാമിന്റെ വായിൽ ‘വചനം വെച്ചു’ എന്ന പ്രയോഗം
  choice: ദൃശ്യപ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: ദൈവം ബിലെയാമിന് ഒരു സന്ദേശം നൽകി
  rationale: ഈ പ്രയോഗം ബിലെയാമിന്റെ പ്രസംഗത്തിന്റെ ദൈവിക ഉറവിടം ശക്തമായി സൂചിപ്പിക്കുന്നു; അതിനെ വിശദീകരണപരമായി ലഘൂകരിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘വായിൽ ഒരു വചനം വെച്ചു’ എന്ന എബ്രായ രൂപകം നിലനിർത്തി; ‘സംസാരിക്കണം’ ആജ്ഞയുടെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
