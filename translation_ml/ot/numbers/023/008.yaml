source:
  edition: WLC
  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: ml
  text: 'ദൈവം ശപിച്ചിട്ടില്ലാത്തവനെ ഞാൻ എങ്ങനെ ശപിക്കും?

    യഹോവ കോപിച്ചിട്ടില്ലാത്തവനോട് ഞാൻ എങ്ങനെ കോപിക്കും?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹോവ അപലപിച്ചിട്ടില്ലാത്തവനെ ഞാൻ എങ്ങനെ അപലപിക്കും?” രണ്ടാം വരിയിലെ എബ്രായക്രിയയ്ക്ക് കോപം തോന്നുക/പ്രകടിപ്പിക്കുക എന്ന അർഥവും കോപത്തോടെ അപലപിക്കുക എന്ന അർഥവും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶקֹּב
  choice: ഞാൻ എങ്ങനെ ശപിക്കും?
  rationale: מָה ഇവിടെ വിവരാന്വേഷണമല്ല, പ്രവൃത്തിയുടെ അസാധ്യത പ്രകടിപ്പിക്കുന്ന അലങ്കാരചോദ്യമാണ്; അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എങ്ങനെ’ എന്നു നൽകി.
- source_word: לֹא קַבֹּה אֵל
  choice: ദൈവം ശപിച്ചിട്ടില്ലാത്തവനെ
  rationale: קבב എന്ന ക്രിയയുടെ ‘ശപിക്കുക’ എന്ന അർഥവും ആദ്യവരിയിലെ പദാവർത്തനവും നിലനിർത്തി; אֵל എന്ന ദൈവിക വിശേഷണം ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֶזְעֹם ... לֹא זָעַם
  choice: കോപിച്ചിട്ടില്ലാത്തവനോട് ഞാൻ എങ്ങനെ കോപിക്കും?
  rationale: זעם എന്ന ക്രിയയുടെ കേന്ദ്രഭാവമായ രോഷം/കോപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും ഒരേ മലയാളക്രിയ ആവർത്തിച്ച് എബ്രായ സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്തു. ‘അപലപിക്കുക’ എന്ന വാചികപ്രവൃത്തിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ പൊതുവായ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പതിവുള്ള ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: אֵל, יְהוָה എന്നീ ദൈവനാമങ്ങളെ വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തൽ
  choice: אֵל എന്നത് ‘ദൈവം’ എന്നും יְהוָה എന്നത് ‘യഹോവ’ എന്നും നൽകി.
  alternative: രണ്ടും ‘ദൈവം’ എന്നു നൽകുക; അല്ലെങ്കിൽ יְהוָה എന്നത് ‘കർത്താവ്’ എന്നു നൽകുക.
  rationale: മൂലപാഠത്തിലെ പൊതുവായ ദൈവിക വിശേഷണവും വ്യക്തിനാമവും തമ്മിലുള്ള വ്യത്യാസവും കാവ്യസമാന്തരതയും സംരക്ഷിക്കുന്നു.
- issue: זעם എന്ന ക്രിയയിലെ രോഷവും അപലപനവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കോപിക്കുക’ എന്നു നൽകി.
  alternative: ‘അപലപിക്കുക’ എന്നു നൽകുക.
  rationale: ക്രിയയുടെ വികാരാത്മക കേന്ദ്രമായ രോഷം നേരിട്ട് നിലനിർത്തുന്നു; അതിൽ ഉൾപ്പെടാവുന്ന പരസ്യമായ അപലപനത്തിന്റെ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ട് അലങ്കാരചോദ്യങ്ങളുടെയും കാവ്യസമാന്തരത നിലനിർത്തിയിരിക്കുന്നു; ‘ശപിക്കുക’ എന്നും ‘കോപിക്കുക’ എന്നും വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിച്ച് മൂലത്തിലെ പദവ്യത്യാസവും സംരക്ഷിച്ചു.
