id: NUM.23.29
reference: Numbers 23:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ml
  text: 'അപ്പോൾ ബിലെയാം ബാലാക്കിനോടു പറഞ്ഞു: “ഇവിടെ എനിക്കുവേണ്ടി ഏഴ് യാഗപീഠങ്ങൾ പണിയുക; ഇവിടെ എനിക്കുവേണ്ടി ഏഴ് കാളകളെയും ഏഴ് ആട്ടുകൊറ്റന്മാരെയും ഒരുക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചാക്രമം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗതബലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തോട് ചേർന്ന ലിപ്യന്തരണം.
- source_word: אֶל בָּלָק
  choice: ബാലാക്കിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖദിശ സ്വാഭാവിക മലയാള ദത്തിവിഭക്തിയിലൂടെ രേഖപ്പെടുത്തുന്നു.
- source_word: בְּנֵה
  choice: പണിയുക
  rationale: യാഗപീഠങ്ങൾ നിർമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കല്പനാരൂപത്തിന് ലളിതവും കൃത്യവുമായ മലയാളം.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: ഇവിടെ ലാമെദ് പ്രയോജനമോ ഉപയോഗമോ സൂചിപ്പിക്കുന്നു; ബിലെയാമിന്റെ ആവശ്യത്തിനായി ഒരുക്കണമെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: בָּזֶה
  choice: ഇവിടെ
  rationale: അക്ഷരാർഥം ‘ഈ സ്ഥലത്ത്’; ആധുനിക മലയാളത്തിൽ ‘ഇവിടെ’ സ്വാഭാവികവും സ്ഥലസൂചനയിൽ കൃത്യവുമാണ്.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ഏഴ് യാഗപീഠങ്ങൾ
  rationale: സംഖ്യയും ബഹുവചന നാമവും നേരിട്ട് നിലനിർത്തുന്നു; מִזְבֵּחַ എന്നത് ബലിക്കായുള്ള പീഠമാണ്.
- source_word: וְהָכֵן
  choice: ഒരുക്കുക
  rationale: ഹിഫീൽ കല്പനാരൂപം ഇവിടെ ബലിമൃഗങ്ങളെ സജ്ജമാക്കുക/ലഭ്യമാക്കുക എന്ന അർഥം നൽകുന്നു; ‘ഒരുക്കുക’ ഇരുവശവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: פָרִים
  choice: കാളകൾ
  rationale: ബലിസന്ദർഭത്തിലെ פַּר ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; പ്രായം പാഠത്തിൽ നിർബന്ധിതമല്ലാത്തതിനാൽ ‘ഇളംകാളകൾ’ എന്നു വികസിപ്പിച്ചിട്ടില്ല.
- source_word: אֵילִים
  choice: ആട്ടുകൊറ്റന്മാർ
  rationale: ആൺചെമ്മരിയാടുകളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ മലയാളത്തിലെ വ്യക്തമായ തത്തുല്യം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആവർത്തിച്ചിരിക്കുന്ന ‘ഇവിടെ’യും ‘എനിക്കുവേണ്ടി’യും മൂലപാഠത്തിലെ ഊന്നലനുസരിച്ച് രണ്ടിടത്തും നിലനിർത്തി; കല്പനകൾ മാന്യമായെങ്കിലും വ്യക്തമായ നിർദേശരൂപത്തിൽ നൽകി.
