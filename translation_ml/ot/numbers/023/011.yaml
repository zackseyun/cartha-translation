source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: ml
  text: 'അപ്പോൾ ബാലാക് ബിലെയാമിനോടു പറഞ്ഞു: “നീ എന്നോട് എന്താണ് ചെയ്തത്? എന്റെ ശത്രുക്കളെ ശപിക്കാനാണ് ഞാൻ നിന്നെ കൊണ്ടുവന്നത്; എന്നാൽ ഇതാ, നീ അവരെ അനുഗ്രഹിക്കുകയല്ലാതെ മറ്റൊന്നും ചെയ്തില്ല![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠം ‘നീ തീർച്ചയായും അനുഗ്രഹിച്ചു’ അഥവാ ‘നീ നിശ്ചയമായും അനുഗ്രഹിച്ചു’ എന്നായും പരിഭാഷപ്പെടുത്താം. ഊന്നലിനായി എബ്രായത്തിൽ ഒരു സമാപകക്രിയയ്‌ക്കൊപ്പം ഇൻഫിനിറ്റീവ് ആബ്സല്യൂട്ട് എന്ന പ്രത്യേക ക്രിയാരൂപം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: מֶה עָשִׂיתָ לִי
  choice: നീ എന്നോട് എന്താണ് ചെയ്തത്?
  rationale: ചോദ്യം നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുകയും ഇപ്പോഴത്തെ പരാതിയുടെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: לָקֹב
  choice: ശപിക്കാൻ
  rationale: ഇവിടെ קבב ശാപം ഉച്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ശപിക്കുക’ വ്യക്തവും പതിവുമായ മലയാള തുല്യപദമാണ്.
- source_word: אֹיְבַי
  choice: എന്റെ ശത്രുക്കളെ
  rationale: ഉടമസ്ഥബഹുവചന നാമത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: לְקַחְתִּיךָ
  choice: ഞാൻ നിന്നെ കൊണ്ടുവന്നത്
  rationale: לקח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും, ഒരാളെ ഒരു ലക്ഷ്യത്തിനായി സ്ഥലത്തേക്ക് കൂട്ടിക്കൊണ്ടുവരുന്ന ഈ സന്ദർഭത്തിൽ ‘കൊണ്ടുവരുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘കൂലിക്കെടുത്തു’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: וְהִנֵּה
  choice: എന്നാൽ ഇതാ
  rationale: സന്ദർഭത്തിലെ വൈരുധ്യവും ബാലാക്കിന്റെ ആശ്ചര്യവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: നീ അവരെ അനുഗ്രഹിക്കുകയല്ലാതെ മറ്റൊന്നും ചെയ്തില്ല
  rationale: സമാപികാക്രിയയോടൊപ്പം വരുന്ന infinitive absolute അനുഗ്രഹിച്ചതിന് ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം ആ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു; ‘അവരെ’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയതാണ്.
