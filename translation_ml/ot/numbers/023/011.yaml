  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ആശ്ചര്യവും പരാതിയും ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു; ‘കൂലിക്കെടുത്തു’ പോലുള്ള സന്ദർഭാധിഷ്ഠിത അധികവ്യാഖ്യാനം ഒഴിവാക്കി.
