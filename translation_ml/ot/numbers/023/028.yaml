translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഭൂപ്രകൃതിവിവരണം അക്ഷരാർഥത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കി വ്യക്തമായി അവതരിപ്പിച്ചു; യെശിമോൻ എന്ന പദത്തിലെ യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
