source:
  edition: WLC
  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: ml
  text: പിന്നെ ബാലാക്ക് ബിലെയാമിനെ വിജനപ്രദേശം[a] നോക്കിനിൽക്കുന്ന പെയോരിന്റെ കൊടുമുടിയിലേക്ക് കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മരുഭൂമി’; ഹീബ്രായിലെ ‘യെശിമോൻ’ എന്നത് ‘വിജനപ്രദേശം’ അല്ലെങ്കിൽ ‘മരുഭൂമി’ എന്ന വിവരണാത്മക പദമായോ ഒരു സ്ഥലനാമമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിന്നെ ... കൊണ്ടുപോയി
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു നീക്കുന്നു. ഇവിടെ ഒരാളെ ഒരു സ്ഥലത്തേക്ക് ‘എടുത്തുകൊണ്ടുപോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കൊണ്ടുപോയി’ എന്നു നൽകുന്നു.
- source_word: בָּלָק
  choice: ബാലാക്ക്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: വ്യക്തിനാമം ഹീബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: רֹאשׁ
  choice: മുകളിലേക്ക്
  rationale: ഭൂപ്രകൃതിസംബന്ധമായ സന്ദർഭത്തിൽ ഈ പദം ഒരു ഉയരത്തിന്റെ മുകൾഭാഗത്തെയോ കൊടുമുടിയെയോ സൂചിപ്പിക്കുന്നു; ‘മുകളിലേക്ക്’ ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: הַפְּעוֹר
  choice: പെയോരിന്റെ
  rationale: സ്ഥലനാമം ലിപ്യന്തരിച്ചു; ഹീബ്രായ നിർദ്ദേശകപ്രത്യയം മലയാളത്തിൽ പ്രത്യേകം പ്രതിനിധീകരിച്ചിട്ടില്ല.
- source_word: הַנִּשְׁקָף
  choice: അവിടെനിന്ന് ... കാണാമായിരുന്നു
  rationale: നിഫാൽ കൃദന്തരൂപം ഒരു ഉയരത്തിൽനിന്ന് താഴെയുള്ള പ്രദേശം ദൃശ്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക ഭൂപ്രകൃതിവിവരണമായി നൽകി.
- source_word: עַל־פְּנֵי
  choice: കാണാമായിരുന്നു
  rationale: അക്ഷരാർഥത്തിലെ ‘മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രായ പ്രയോഗം, הַנִּשְׁקָף എന്നതോടൊപ്പം, ഒരു പ്രദേശത്തെ അഭിമുഖീകരിക്കുന്നതോ അതിനുമേൽ കാഴ്ച ലഭിക്കുന്നതോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമായി സംയോജിപ്പിച്ചു.
- source_word: הַיְשִׁימֹן
  choice: വിജനപ്രദേശം
  rationale: ഈ പദത്തിന് വിജനമായ ഭൂഭാഗം/മരുഭൂമി എന്ന വിവരണാത്മക അർഥമോ ‘യെശിമോൻ’ എന്ന സ്ഥലനാമമോ ആകാം. മുഖ്യപാഠത്തിൽ വിവരണാത്മക അർഥം നൽകി, അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
