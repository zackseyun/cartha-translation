id: NUM.23.1
reference: Numbers 23:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: ml
  text: 'അപ്പോൾ ബിലെയാം ബാലാക്കിനോടു പറഞ്ഞു: “ഇവിടെ എനിക്കുവേണ്ടി ഏഴ് യാഗപീഠങ്ങൾ പണിയുക; ഇവിടെ എനിക്കുവേണ്ടി ഏഴ് കാളകളെയും ഏഴ് ആട്ടുകൊറ്റന്മാരെയും ഒരുക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ അതിന്റെ ക്രമാനുഗത ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶל בָּלָק
  choice: ബാലാക്കിനോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖദിശ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ബാലാക് എന്ന പേരിന്റെ ചരിഞ്ഞ രൂപമാണ് ഉപയോഗിച്ചത്.
- source_word: בְּנֵה
  choice: പണിയുക
  rationale: בנה എന്ന ക്രിയയുടെ ആജ്ഞാരൂപത്തിന് യാഗപീഠനിർമാണസന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളം.
- source_word: לִי
  choice: എനിക്കുവേണ്ടി
  rationale: ഒന്നാംപുരുഷ ഏകവചന പ്രത്യയം ചേർന്ന לְ ഇവിടെ പ്രയോജനാർഥം സൂചിപ്പിക്കുന്നു.
- source_word: בָּזֶה
  choice: ഇവിടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഈ [സ്ഥലത്ത്]’; സന്ദർഭത്തിലെ സ്ഥലസൂചന ആധുനിക മലയാളത്തിൽ ‘ഇവിടെ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. മൂലത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: ഏഴ് യാഗപീഠങ്ങൾ
  rationale: സംഖ്യയും നാമവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി; מזבח എന്നത് ബലിയർപ്പണത്തിനുള്ള പീഠത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യാഗപീഠം’ തിരഞ്ഞെടുത്തു.
- source_word: וְהָכֵן
  choice: ഒരുക്കുക
  rationale: כון എന്ന ഹിഫിൽ ആജ്ഞാരൂപത്തിന്റെ ‘സജ്ജമാക്കുക’ എന്ന അർഥം ബലിമൃഗങ്ങളുടെ സന്ദർഭത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: פָרִים
  choice: കാളകൾ
  rationale: פַּר ബലിസന്ദർഭത്തിലെ ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; പ്രായം മൂലപാഠത്തിൽ പ്രത്യേകം വ്യക്തമാക്കാത്തതിനാൽ ‘ഇളം കാളകൾ’ എന്നു വിപുലീകരിച്ചില്ല.
- source_word: אֵילִים
  choice: ആട്ടുകൊറ്റന്മാർ
  rationale: ആൺചെമ്മരിയാടുകളെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ രണ്ട് בָּזֶה പ്രയോഗങ്ങളുടെയും സ്ഥലസൂചന ‘ഇവിടെ’ എന്ന് രണ്ടുതവണ നിലനിർത്തിയതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല. ആജ്ഞാരൂപങ്ങളിൽ മാന്യവും നേരിട്ടുമായ ‘പണിയുക’, ‘ഒരുക്കുക’ ഉപയോഗിച്ചു.
