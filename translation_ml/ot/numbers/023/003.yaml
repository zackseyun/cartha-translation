  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: ml
  text: 'അപ്പോൾ ബിലെയാം ബാലാക്കിനോടു പറഞ്ഞു: “നിന്റെ ഹോമയാഗത്തിനരികെ നിൽക്കുക; ഞാൻ പോകട്ടെ. ഒരുപക്ഷേ യഹ്‌വേ എന്നെ കണ്ടുമുട്ടും. അവിടുന്ന് എനിക്കു എന്തു കാണിച്ചുതന്നാലും അത് ഞാൻ നിന്നോടു പറയും.” പിന്നെ അവൻ തുറസ്സായ ഒരു കുന്നിൻമുകളിലേക്കു പോയി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരങ്ങളില്ലാത്ത ഒരു ഉയർന്ന സ്ഥലത്തേക്ക്’ അല്ലെങ്കിൽ ‘വെളിവായ ഒരു കുന്നിൻമുകളിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം തുറസ്സായതോ സസ്യാവരണം കുറഞ്ഞതോ ആയ ഒരു ഉയർന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: שֶׁפִי എന്ന അപൂർവപദത്തിന്റെ കൃത്യമായ ഭൂപ്രകൃതിസൂചന അനിശ്ചിതമായതിനാൽ പ്രധാന പദവികല്പങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: നിന്റെ ഹോമയാഗത്തിനരികെ നിൽക്കുക
  rationale: התיצב എന്ന ക്രിയ സ്ഥാനം സ്വീകരിച്ചു നിൽക്കുന്നതും, ഈ പ്രയോഗത്തിൽ על യാഗത്തിനരികിലുള്ള സ്ഥാനവും സൂചിപ്പിക്കുന്നു. עֹלָהയെ കൃത്യമായി ‘ഹോമയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וְאֵלְכָה
  choice: ഞാൻ പോകട്ടെ
  rationale: ഒന്നാംപുരുഷ cohortative രൂപം ബിലെയാമിന്റെ ഉദ്ദേശിച്ച നടപടിയെ പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഞാൻ പോകട്ടെ’ അതിന്റെ സ്വാഭാവികമായ സമാനപ്രയോഗമാണ്.
- source_word: אוּלַי יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: ഒരുപക്ഷേ യഹ്‌വേ എന്നെ കണ്ടുമുട്ടും
  rationale: אוּלַי സാധ്യതയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു. קרה ... לקראת എന്നത് ഇവിടെ ഒരു ദൈവിക കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കണ്ടുമുട്ടും’ എന്നു നൽകി; യഹ്‌വേ എന്ന വ്യക്തിനാമവും നിലനിർത്തി.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: അവിടുന്ന് എനിക്ക് എന്തു കാണിച്ചുതന്നാലും
  rationale: സംക്ഷിപ്തമായ എബ്രായ പ്രയോഗം വെളിപ്പെടുത്തലിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. ראהയുടെ ഹിഫീൽ രൂപത്തിലുള്ള ‘കാണിച്ചുതരുക’ എന്ന കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: ഞാൻ നിന്നെ അറിയിക്കും
  rationale: נגדയുടെ ഹിഫീൽ രൂപം അറിയിക്കുക, പറഞ്ഞുകൊടുക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ‘നിന്നെ അറിയിക്കും’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: שֶׁפִי
  choice: തുറസ്സായ ഒരു കുന്നിൻമുകൾ
  rationale: അപൂർവമായ ഈ പദം സസ്യാവരണം കുറഞ്ഞതോ വെളിവായതോ ആയ ഒരു ഉയർന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ‘തുറസ്സായ ഒരു കുന്നിൻമുകൾ’ ഭൂപ്രകൃതിയുടെ പൊതുവായ ആശയം നൽകുകയും അനാവശ്യമായ കൃത്യത ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ ചതുർവ്യഞ്ജന വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: ദൈവിക കൂടിക്കാഴ്ചയിലെ അനിശ്ചിതത്വം
  choice: ഒരുപക്ഷേ യഹ്‌വേ എന്നെ കണ്ടുമുട്ടും
  alternative: യഹ്‌വേ എന്നെ എതിരേൽക്കാൻ വരും
  rationale: ബിലെയാം പ്രതീക്ഷിക്കുന്ന കൂടിക്കാഴ്ച ഉറപ്പുള്ളതായി മൂലപാഠം പറയുന്നില്ല; אוּלַי നൽകുന്ന അനിശ്ചിതത്വം വ്യക്തമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. സംഭാഷണത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപങ്ങൾ ഉപയോഗിച്ചു; അപൂർവമായ ഭൂപ്രകൃതിപദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
