source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: ml
  text: 'ദൈവം ബിലെയാമിനെ കണ്ടുമുട്ടി[a]. ബിലെയാം അവനോടു പറഞ്ഞു: “ഞാൻ ആ ഏഴ് യാഗപീഠങ്ങളും ഒരുക്കി; യാഗപീഠത്തിന്മേൽ ഒരു കാളയെയും ഒരു ആട്ടുകൊറ്റനെയും അർപ്പിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം ബിലെയാമിനെ അഭിമുഖീകരിച്ചു.” എബ്രായ ക്രിയയ്ക്ക് ഒരു കണ്ടുമുട്ടലിനെയോ അഭിമുഖീകരണത്തെയോ സൂചിപ്പിക്കാം; ചില സന്ദർഭങ്ങളിൽ യാദൃച്ഛികമായി നേരിടുക എന്ന ഭാവവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: കണ്ടുമുട്ടി
  rationale: קרה എന്ന ക്രിയ ഇവിടെ ഒരു യഥാർഥമായ അഭിമുഖീകരണത്തെയോ കൂടിക്കാഴ്ചയെയോ സൂചിപ്പിക്കുന്നു. ‘കണ്ടുമുട്ടി’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം നൽകുകയും ആകസ്മികത നിർബന്ധമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: אֱלֹהִים
  choice: ദൈവം
  rationale: ക്രിയ ഏകവചനത്തിലായതിനാലും സന്ദർഭത്തിലെ പരാമർശം വ്യക്തമായതിനാലും ഇത് ഏകവചന ദൈവനാമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בִּלְעָם
  choice: ബിലെയാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തിന് യോജിച്ച ലിപ്യന്തരണം.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: ബിലെയാം അവനോടു പറഞ്ഞു
  rationale: തുടർന്നുള്ള ഒന്നാംപുരുഷ വാക്കുകൾ സംസാരിക്കുന്നത് ബിലെയാമാണെന്ന് വ്യക്തമാക്കുന്നു. എബ്രായത്തിലെ സർവനാമസംബന്ധമായ സാധ്യത മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ പേരിനെ ആവർത്തിച്ചു.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: ആ ഏഴ് യാഗപീഠങ്ങളും
  rationale: നിശ്ചിതമായ, മുമ്പ് പരാമർശിക്കപ്പെട്ട ഏഴ് യാഗപീഠങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്. ‘ആ’ നിശ്ചിതത്വവും ‘-ഉം’ അവയെ മുഴുവനായും ഒരുക്കിയെന്ന ഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: עָרַכְתִּי
  choice: ഞാൻ ... ഒരുക്കി
  rationale: ערך എന്നതിന്റെ ‘ക്രമീകരിക്കുക, സജ്ജമാക്കുക’ എന്ന അർഥം യാഗപീഠങ്ങളുടെ സന്ദർഭത്തിൽ ‘ഒരുക്കി’ എന്ന മലയാളം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וָאַעַל
  choice: അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയ്ക്ക് ‘യാഗമായി അർപ്പിക്കുക’ എന്ന സാങ്കേതിക അർഥമുണ്ട്; ‘അർപ്പിച്ചു’ അത് വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: פָּר
  choice: ഒരു കാള
  rationale: യാഗസന്ദർഭത്തിലെ פר എന്ന പദത്തിന്റെ സാധാരണവും മതിയായും നിർദ്ദിഷ്ടവുമായ മലയാള പരിഭാഷ.
- source_word: וָאַיִל
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: איל എന്ന ആൺചെമ്മരിയാടിനെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: בַּמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: എബ്രായത്തിലെ നിശ്ചിത ഏകവചനം അതേപടി നിലനിർത്തി. സന്ദർഭത്തിൽ വിതരണംചെയ്ത അർഥം സാധ്യതയുള്ളതാണെങ്കിലും ‘ഓരോ യാഗപീഠത്തിന്മേലും’ എന്ന് മുഖ്യപാഠത്തിൽ വികസിപ്പിച്ചിട്ടില്ല.
theological_decisions:
- issue: וַיִּקָּר സൂചിപ്പിക്കുന്ന ദൈവിക അഭിമുഖീകരണത്തിന്റെ സ്വഭാവം
  choice: ആകസ്മികത നിർബന്ധമായി സൂചിപ്പിക്കാതെ യഥാർഥമായ ദൈവിക കൂടിക്കാഴ്ചയായി പരിഭാഷപ്പെടുത്തുക
  alternative: ‘അപ്രതീക്ഷിതമായി നേരിട്ടു’ എന്നതുപോലെ ആകസ്മികതയ്ക്ക് കൂടുതൽ ഊന്നൽ നൽകുക
  rationale: ഈ ധാതുവിന് ചില സന്ദർഭങ്ങളിൽ യാദൃച്ഛികമായി സംഭവിക്കുന്നതിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും ഇവിടെ ദൈവം ബിലെയാമുമായി ഉദ്ദേശ്യപൂർവം ഇടപെടുന്ന കഥാസന്ദർഭമാണ്. അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ച് മുഖ്യപാഠത്തിൽ ദൈവിക യാദൃച്ഛികത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി.
- issue: അവസാനത്തെ ഏകവചനമായ בַּמִּזְבֵּחַ വിതരണാർഥത്തിൽ വികസിപ്പിക്കണമോ
  choice: ‘യാഗപീഠത്തിന്മേൽ’ എന്ന ഏകവചനം നിലനിർത്തുക
  alternative: ‘ഓരോ യാഗപീഠത്തിന്മേലും’ എന്നു വ്യക്തമാക്കുക
  rationale: ഏഴ് യാഗപീഠങ്ങളുടെ സന്ദർഭം വിതരണാർഥം സൂചിപ്പിച്ചേക്കാം; എങ്കിലും മൂലപാഠം ഏകവചനമായതിനാൽ അതിനെ നിർബന്ധമായി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ യഥാർഥ രൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംസാരിക്കുന്നയാൾ ആരെന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘ബിലെയാം’ ആവർത്തിച്ചു. യാഗപരമായ പദാവലിക്ക് പൊതുവായി മനസ്സിലാകുന്ന ‘യാഗപീഠം’, ‘അർപ്പിച്ചു’, ‘ആട്ടുകൊറ്റൻ’ എന്നിവ ഉപയോഗിച്ചു.
