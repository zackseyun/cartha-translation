translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ബാലാക്കിന്റെ നിരാശയും കടുത്ത ഇരട്ട വിലക്കും നിലനിർത്താൻ സംക്ഷിപ്തമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു; എബ്രായത്തിലെ അസ്വാഭാവിക ആവർത്തനം മുഖ്യവാചകത്തിൽ പകർത്താതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
