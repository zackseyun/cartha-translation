  to: 'ബാലാക്ക് ബിലെയാമിനോടു പറഞ്ഞു: “അവരെ ഒരിക്കലും ശപിക്കരുത്; ഒരിക്കലും അനുഗ്രഹിക്കുകയുമരുത്!”[a]'
  rationale: The revision replaces the potentially permissive/contrastive “ശപിക്കുകയേ വേണ്ട” with unambiguous, emphatic prohibitions. It retains the contextually natural plural “അവരെ” in the translation while making the footnote grammatically accurate about the Hebrew singular suffix and its collective reference. Repeating “ഒരിക്കലും” reflects the balanced emphasis of the two Hebrew infinitive-absolute constructions.
