  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: ml
  text: 'ബാലാക്ക് ബിലെയാമിനോടു പറഞ്ഞു: “അവരെ ഒരിക്കലും ശപിക്കരുത്; ഒരിക്കലും അനുഗ്രഹിക്കുകയുമരുത്!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “ശപിക്കുക—അവനെ ശപിക്കരുത് … അനുഗ്രഹിക്കുക—അവനെ അനുഗ്രഹിക്കരുത്.” ഓരോ ഭാഗത്തും നിരപേക്ഷ ക്രിയാരൂപത്തിനു പിന്നാലെ അതേ ധാതുവിൽനിന്നുള്ള സമാപികക്രിയ വരുന്നത് ശക്തമായ ഊന്നൽ പ്രകടിപ്പിക്കുന്നു. എബ്രായത്തിലെ ഏകവചന കർമപ്രത്യയം ഇവിടെ ഇസ്രായേൽജനത്തെ ഒരു കൂട്ടായ ഘടകമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: വാവ്-തുടർച്ചയുള്ള സാധാരണ എബ്രായ ആഖ്യാനരൂപം; മലയാളത്തിലെ സ്വാഭാവിക കഥനക്രമത്തിൽ ‘പറഞ്ഞു’ മതിയായ രീതിയിൽ തുടർച്ച അറിയിക്കുന്നു.
- source_word: בָּלָק אֶל בִּלְעָם
  choice: ബാലാക്ക് ബിലെയാമിനോടു
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; אֶל എന്ന ദിശാസൂചക അവ്യയം സംഭാഷണസന്ദർഭത്തിൽ ‘-നോടു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: גַּם ... גַּם
  choice: -യേ വേണ്ട ... -യുമരുത്
  rationale: രണ്ട് സമാന്തര നിഷേധവാക്യങ്ങളിലെ גַּם ആവർത്തനം മലയാളത്തിൽ ‘ഒന്നും ചെയ്യരുത്; മറ്റേതും ചെയ്യരുത്’ എന്ന ഇരട്ട വിലക്കായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: ശപിക്കുകയേ വേണ്ട
  rationale: קבב എന്ന ധാതുവിന്റെ അർഥം ‘ശപിക്കുക’ എന്നാണ്. ക്രിയാനാമം + സമാപികക്രിയ എന്ന എബ്രായ ഊന്നൽഘടനയുടെ ശക്തി ‘-യേ വേണ്ട’ എന്ന പ്രയോഗം നൽകുന്നു.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: അനുഗ്രഹിക്കുകയുമരുത്
  rationale: ברך എന്നതിന്റെ സാധാരണ അർഥം ‘അനുഗ്രഹിക്കുക’. ആദ്യ വിലക്കിനോടുള്ള സമാന്തരതയും ശക്തമായ നിഷേധവും ‘-യുമരുത്’ വഴി നിലനിർത്തി.
- source_word: ־נּוּ
  choice: അവരെ
  rationale: എബ്രായത്തിൽ ഏകവചന പുൽലിംഗ കർമപ്രത്യയമാണെങ്കിലും സന്ദർഭത്തിലെ കൂട്ടായ ജനത്തെ സൂചിപ്പിക്കുന്നു; ആ കൂട്ടത്തെ ആദരസൂചകമല്ലാത്ത സ്വാഭാവിക മലയാള ബഹുവചനത്തിൽ ‘അവരെ’ എന്നു നൽകി.
