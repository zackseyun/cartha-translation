id: NUM.23.16
reference: Numbers 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: ml
  text: 'യഹ്‌വെ ബിലെയാമിനെ കണ്ടുമുട്ടി[a], അവന്റെ വായിൽ ഒരു വചനം വെച്ചശേഷം പറഞ്ഞു: “ബാലാക്കിന്റെ അടുക്കലേക്കു മടങ്ങുക; ഇപ്രകാരം സംസാരിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബിലെയാമിന്റെ അടുക്കൽ വന്നു’ അല്ലെങ്കിൽ ‘ബിലെയാമിനെ അഭിമുഖീകരിച്ചു.’
    reason: וַיִּקָּר എന്ന ക്രിയയ്ക്ക് കൂടിക്കാഴ്ച, അടുത്തുവരവ്, അഭിമുഖീകരണം എന്നീ പരസ്പരം ബന്ധമുള്ള അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: കണ്ടുമുട്ടി
  rationale: קָרָה എന്ന ക്രിയ ഇവിടെ നേരിട്ടുള്ള ഒരു കൂടിക്കാഴ്ചയെയോ അഭിമുഖീകരണത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കണ്ടുമുട്ടി’ ദർശനമായി പ്രത്യക്ഷപ്പെട്ടു എന്ന അധിക ആശയം ചേർക്കാതെ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: അവന്റെ വായിൽ ഒരു വചനം വെച്ചു
  rationale: ദൈവം നൽകുന്ന പ്രവചനവാക്കിനെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ രൂപവും അർഥവും നിലനിർത്തുന്നു.
- source_word: דָּבָר
  choice: വചനം
  rationale: ഇവിടെ ബിലെയാം അറിയിക്കേണ്ട പ്രത്യേക ഉച്ചാരണത്തെയാണ് ഏകവചനമായ דָּבָר സൂചിപ്പിക്കുന്നത്; ‘വചനം’ അതിന്റെ പ്രവചനസന്ദർഭവും ഏകവചനവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: שׁוּב
  choice: മടങ്ങുക
  rationale: ബാലാക്കിന്റെ അടുക്കലേക്കു തിരികെ പോകാനുള്ള ആജ്ഞയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְכֹה תְדַבֵּר
  choice: ഇപ്രകാരം സംസാരിക്കുക
  rationale: כֹה എന്നതിന്റെ ‘ഇങ്ങനെ/ഇപ്രകാരം’ എന്ന ഭാവവും തുടർന്നുവരുന്ന പ്രവചനപ്രസംഗത്തിന്റെ ഔപചാരിക സ്വരവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഹീബ്രു പ്രവചനപ്രയോഗമായ ‘വായിൽ ഒരു വചനം വെച്ചു’ എന്ന രൂപം അർഥവ്യക്തത നഷ്ടപ്പെടാതെ നിലനിർത്തി; നേരിട്ടുള്ള ആജ്ഞകൾ സംക്ഷിപ്തമായി നൽകി.
