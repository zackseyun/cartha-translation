  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: ml
  text: 'അപ്പോൾ ബാലാക്ക് ബിലെയാമിനോടു പറഞ്ഞു: “ദയവായി വരൂ; ഞാൻ നിന്നെ മറ്റൊരു സ്ഥലത്തേക്കു കൊണ്ടുപോകട്ടെ. ഒരുപക്ഷേ, അത് ദൈവത്തിന് ഉചിതമായി തോന്നും[a]; അപ്പോൾ അവിടെനിന്ന് നീ അവനെ എനിക്കുവേണ്ടി ശപിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന് പ്രസാദകരമായിരിക്കും.” “ഒരാളുടെ ദൃഷ്ടിയിൽ ശരിയായിരിക്കുക” എന്ന എബ്രായ ശൈലിക്ക് ആ വ്യക്തിയുടെ ദൃഷ്ടിയിൽ ‘ഉചിതമായിരിക്കുക’ അല്ലെങ്കിൽ ‘പ്രസാദകരമായിരിക്കുക’ എന്നർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: ദയവായി വരൂ
  rationale: הלך എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ ക്ഷണമോ വിളിയോ ആയി പ്രയോഗിച്ചിരിക്കുന്നു; נָא അതിനെ വിനീതമായ അഭ്യർഥനയാക്കുന്നു.
- source_word: אֶקָּחֲךָ
  choice: ഞാൻ നിന്നെ ... കൊണ്ടുപോകട്ടെ
  rationale: രൂപത്തിൽ ഒന്നാംപുരുഷ അപൂർണകാലമാണെങ്കിലും, ക്ഷണത്തിനു പിന്നാലെ വരുന്നതിനാൽ അനുവാദം തേടുന്ന ഇച്ഛാഭാവം മലയാളത്തിലെ ‘കൊണ്ടുപോകട്ടെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מָקוֹם אַחֵר
  choice: മറ്റൊരു സ്ഥലം
  rationale: കാഴ്ചസ്ഥാനത്തിന്റെ മാറ്റം സൂചിപ്പിക്കുന്ന മൂർത്തമായ സ്ഥലാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: אוּלַי
  choice: ഒരുപക്ഷേ
  rationale: ബാലാക്കിന്റെ പ്രതീക്ഷയെ ഉറപ്പായി അവതരിപ്പിക്കാതെ സാധ്യതയായി നിലനിർത്തുന്നു.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: ദൈവത്തിന് ഉചിതമായി തോന്നിയേക്കാം
  rationale: ‘ഒരാളുടെ കണ്ണിൽ നേരായിരിക്കുക’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘ഉചിതം/പ്രസാദകരം ആയിരിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്ത കർത്താവ് തുടർന്നുള്ള ശാപപ്രവൃത്തിയാണെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: הָאֱלֹהִים
  choice: ദൈവം
  rationale: സമീപസന്ദർഭത്തിൽ ബിലെയാം ആലോചന തേടുന്ന ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ഒരു ദേവത എന്നതിലുപരി ‘ദൈവം’ യോജിക്കുന്നു.
- source_word: וְקַבֹּתוֹ לִי
  choice: നീ അവനെ എനിക്കുവേണ്ടി ശപിക്കുന്നത്
  rationale: קבב എന്നത് ‘ശപിക്കുക’ എന്നാണ്. ഏകവചന പ്രത്യയം ഇസ്രായേൽജനത്തെ ഒരു സമൂഹമായി കണ്ടു സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ നിലനിർത്തുന്നു; മുഴുവൻ പ്രവൃത്തിയെ മുൻവാക്യത്തിലെ സാധ്യതയോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: പുതിയ സ്ഥലവുമായി ബന്ധപ്പെട്ട ഉറവിടസ്ഥാനത്തിന്റെ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബാലാക്കിന്റെ വാക്കുകളിൽ הָאֱלֹהִים ആരെ സൂചിപ്പിക്കുന്നു
  choice: ബിലെയാം ആലോചന തേടുന്ന സത്യദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘ദൈവം’
  alternative: ‘ആ ദേവൻ’ അഥവാ ‘ഒരു ദേവൻ’
  rationale: ഉടൻമുമ്പുള്ള ആഖ്യാനത്തിൽ ബിലെയാമിനെ നിയന്ത്രിക്കുന്നത് ഇസ്രായേലിന്റെ ദൈവമാണ്; സ്ഥലം മാറ്റിയാൽ ദൈവം ശാപം അനുവദിച്ചേക്കുമെന്നാണ് ബാലാക്കിന്റെ പ്രതീക്ഷ. ‘ദൈവം’ എന്നത് ഈ ആഖ്യാനപരമായ സൂചന വ്യക്തമാക്കുന്നു; അനാവശ്യമായ ബഹുദൈവാരാധനാസൂചന ചേർക്കുന്നില്ല.
- issue: יִישַׁר בְּעֵינֵי എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തി
  choice: ‘ഉചിതമായി തോന്നുക’ എന്ന മുഖ്യവാചകം; ‘പ്രസാദകരമായിരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ
  alternative: മുഖ്യവാചകത്തിൽ ‘ദൈവത്തിന് പ്രസാദകരമായിരിക്കാം’
  rationale: എബ്രായ പ്രയോഗത്തിൽ നൈതികമായി ‘ശരി/ഉചിതം’ എന്നും വ്യക്തിപരമായി ‘പ്രസാദകരം’ എന്നും ഗ്രഹിക്കാവുന്ന അർഥവ്യാപ്തിയുണ്ട്. മുഖ്യവാചകം ഒന്ന് സ്വീകരിച്ചാലും മറ്റേ സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ദയവായി വരൂ’, ‘കൊണ്ടുപോകട്ടെ’ എന്നിവ വിനീതമായ അഭ്യർഥനാഭാവം നൽകുന്നു. ഇസ്രായേലിനെ സമൂഹ ഏകവചനമായി കാണിക്കുന്ന മൂലഭാഷയിലെ ‘അവനെ’ വിവർത്തനത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്.
