reference: Numbers 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר מִן אֲ֠רָם יַנְחֵ֨/נִי בָלָ֤ק מֶֽלֶךְ מוֹאָב֙ מֵֽ/הַרְרֵי קֶ֔דֶם לְכָ/ה֙ אָֽרָ/ה לִּ֣/י יַעֲקֹ֔ב וּ/לְכָ֖/ה זֹעֲמָ֥/ה יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ കാവ്യവചനം[a] ചൊല്ലി:


    “അരാമിൽനിന്ന് മോവാബ്‌രാജാവായ ബാലാക്ക് എന്നെ നയിച്ചുകൊണ്ടുവന്നു,


    കിഴക്കൻ മലനിരകളിൽനിന്ന്[b]:


    ‘വരൂ, എനിക്കുവേണ്ടി യാക്കോബിനെ ശപിക്കൂ;


    വരൂ, ഇസ്രായേലിനെ അപലപിക്കൂ[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഔപചാരികവചനം.” ഹീബ്രു ശൈലിയുടെ അക്ഷരാർഥം “അവൻ തന്റെ മശാൽ ഉയർത്തി” എന്നാണ്; ഇവിടെ മശാൽ ഔപചാരികമായ ഒരു കാവ്യപ്രസ്താവനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “കിഴക്കിന്റെ മലനിരകളിൽനിന്ന്.” മോവാബിനു കിഴക്കുള്ള പ്രദേശത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടത്തെ രണ്ടാമത്തെ ഹീബ്രു ക്രിയ ‘ശപിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ ആദ്യ ക്രിയയിൽനിന്നു വ്യത്യസ്തമാണ്; “ക്രോധത്തോടെ അപലപിക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: അവൻ തന്റെ കാവ്യവചനം ചൊല്ലി
  rationale: ‘മശാൽ ഉയർത്തുക’ എന്ന ഹീബ്രു ശൈലി ഔപചാരികവും കാവ്യാത്മകവുമായ ഒരു ഉച്ചാരണം ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘കാവ്യവചനം ചൊല്ലി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ സാഹിത്യസ്വഭാവം നിലനിർത്തുന്നു; ‘പഴഞ്ചൊല്ല്’ ഇവിടെ അത്യന്തം പരിമിതമായ അർഥം നൽകും.
- source_word: מִן אֲרָם
  choice: അരാമിൽനിന്ന്
  rationale: പിന്നീടുള്ള ‘സിറിയ’ എന്ന രാഷ്ട്രീയനാമം പകരാതെ മൂലത്തിലെ സ്ഥലനാമം നിലനിർത്തുന്നു.
- source_word: יַנְחֵנִי
  choice: എന്നെ നയിച്ചുകൊണ്ടുവന്നു
  rationale: נחה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ നയിക്കൽ എന്ന ആശയവും, ബാലാക്ക് ബിലെയാമിനെ അവിടേക്കു വരുത്തിയ സന്ദർഭവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: കിഴക്കൻ മലനിരകളിൽനിന്ന്
  rationale: קדם ഇവിടെ അരാമിനോടു സമാന്തരമായി ഭൂമിശാസ്ത്രപരമായ ‘കിഴക്ക്’ എന്ന അർഥത്തിലാണ് ഏറ്റവും യോജിക്കുന്നത്. ‘പുരാതന മലകൾ’ എന്ന കാലസംബന്ധിയായ സാധ്യത സന്ദർഭത്തിൽ ദുർബലമാണ്.
- source_word: לְכָה
  choice: വരൂ
  rationale: നേരിട്ടുള്ള ആഹ്വാനമായ ആജ്ഞാരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָרָה
  choice: ശപിക്കൂ
  rationale: ക്രിയയുടെ വ്യക്തമായ അടിസ്ഥാനാർഥം ലളിതവും നേരിട്ടുമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִּי
  choice: എനിക്കുവേണ്ടി
  rationale: ആവശ്യപ്പെട്ട പ്രവൃത്തി ബാലാക്കിന്റെ താൽപര്യത്തിനുവേണ്ടിയാണെന്ന ദാതൃബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: יַעֲקֹב
  choice: യാക്കോബ്
  rationale: വ്യക്തി/ജനതാനാമം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണത്തിൽ നിലനിർത്തുന്നു.
- source_word: זֹעֲמָה
  choice: ശാപത്തിന് ഏൽപ്പിക്കൂ
  rationale: זעם എന്ന രണ്ടാമത്തെ ക്രിയയെ ആദ്യത്തെ אָרָה യുമായി ഒരേ പദമാക്കി ചുരുക്കാതെ അതിന്റെ ശത്രുതാപരമായ ശാപപ്രഖ്യാപനഭാവം വ്യക്തമാക്കുന്നു. അപൂർവവും അസ്വാഭാവികവുമായ പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: വ്യക്തി/ജനതാനാമം അംഗീകൃത മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബിലെയാമിനോടുള്ള ബാലാക്കിന്റെ അഭ്യർഥനയിൽ യാക്കോബും ഇസ്രായേലും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പേരുകളും ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്ന സമാന്തര നാമങ്ങളായി വേർതിരിച്ചു നിലനിർത്തുക
  alternative: രണ്ടും ചേർത്ത് ‘ഇസ്രായേല്യർ’ പോലുള്ള ഒറ്റ സമൂഹനാമമായി പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപാഠം ‘യാക്കോബ്’, ‘ഇസ്രായേൽ’ എന്നീ പേരുകൾ ഉദ്ദേശപൂർവമായ കാവ്യസമാന്തര്യത്തിൽ ഉപയോഗിക്കുന്നു. വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ അതിന്റെ സാഹിത്യപരവും ഉടമ്പടിസംബന്ധവുമായ അനുരണനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ കാവ്യഗദ്യം. ‘കാവ്യവചനം’ ഔപചാരിക ഉച്ചാരണത്തിന്റെ സ്വഭാവം സൂക്ഷിക്കുന്നു; സമാന്തര വരിവിന്യാസം ഹീബ്രു കവിതയുടെ ഘടന പ്രകടമാക്കുന്നു. ‘ശപിക്കൂ / ശാപത്തിന് ഏൽപ്പിക്കൂ’ എന്ന വ്യത്യാസം മൂലത്തിലെ രണ്ടു ക്രിയകളെയും വേർതിരിക്കുന്നു.
