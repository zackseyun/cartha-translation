  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: ml
  text: യാക്കോബിൽ ശകുനം നോക്കലില്ല[a]; ഇസ്രായേലിൽ മന്ത്രവാദവുമില്ല. ഇപ്പോൾ യാക്കോബിനോടും ഇസ്രായേലിനോടും, “ദൈവം എന്തൊരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു!” എന്നു പറയപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യാക്കോബിനെതിരെ ശകുനം നോക്കൽ ഫലിക്കുകയില്ല; ഇസ്രായേലിനെതിരെ മന്ത്രവാദവും ഫലിക്കുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രു ഉപസർഗത്തിന് ഒന്നിലധികം അർഥസാധ്യതകളുണ്ട്; സന്ദർഭം ‘എതിരെ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “യാക്കോബിനെക്കുറിച്ചും ഇസ്രായേലിനെക്കുറിച്ചും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַשׁ
  choice: ശകുനംനോക്കൽ
  rationale: ശകുനങ്ങളിലൂടെ മറഞ്ഞ കാര്യങ്ങളോ ഭാവിയോ അറിയാൻ ശ്രമിക്കുന്ന ദിവ്യജ്ഞാനപ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു; കֶסֶם എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: קֶסֶם
  choice: മന്ത്രവാദം
  rationale: നിഗൂഢശക്തികളുമായി ബന്ധപ്പെട്ട ദിവ്യജ്ഞാന/മാന്ത്രിക പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: യാക്കോബിൽ / ഇസ്രായേലിൽ
  rationale: ഹീബ്രു בְּ എന്ന ഉപസർഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘യാക്കോബിനെതിരെ/ഇസ്രായേലിനെതിരെ’ എന്ന അർഥസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כָּעֵת
  choice: തക്കസമയത്ത്
  rationale: ‘ഇപ്പോൾ/ഈ സമയത്ത്’ എന്നും ‘ഉചിതമായ സമയത്ത്’ എന്നും ഗ്രഹിക്കാവുന്ന കാലസൂചനയിൽ, സന്ദർഭോചിതമായ സമയമെന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יֵאָמֵר
  choice: പറയപ്പെടും
  rationale: നിഫാൽ അപൂർണ്ണക്രിയയുടെ അകർതൃക ഭാവികാലരൂപം സംരക്ഷിക്കുന്നു.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: യാക്കോബിനോടും ഇസ്രായേലിനോടും
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ ദാതൃഭാവം അടുത്തായി നിലനിർത്തുന്നു; അവരെക്കുറിച്ചുള്ള പ്രഖ്യാപനം എന്ന അർഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: מַה פָּעַל אֵל
  choice: ദൈവം എന്തൊരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു!
  rationale: ചോദ്യമെന്നതിലുപരി ദൈവത്തിന്റെ മഹത്തായ പ്രവൃത്തിയെ വിസ്മയത്തോടെ പ്രഖ്യാപിക്കുന്ന ഉദ്‌ഗാരമായി അവതരിപ്പിക്കുന്നു; perfect ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിഭാവം നിലനിർത്തുന്നു.
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ സാധാരണ ദൈവിക ശീർഷകമാണ്; ‘സർവശക്തനായ ദൈവം’ പോലുള്ള വികസനം മൂലപാഠം ആവശ്യപ്പെടുന്നില്ല.
theological_decisions:
- issue: വാക്യം ഇസ്രായേലിനകത്ത് നിഗൂഢവിദ്യകളില്ലെന്നാണോ, അവ ഇസ്രായേലിനെതിരെ ഫലിക്കില്ലെന്നാണോ പറയുന്നത്
  choice: പ്രധാന പാഠത്തിൽ ‘യാക്കോബിൽ/ഇസ്രായേലിൽ’ എന്ന് നൽകി ഹീബ്രു ഉപസർഗത്തിന്റെ പ്രത്യക്ഷരൂപം നിലനിർത്തുന്നു.
  alternative: ‘യാക്കോബിനെതിരെ/ഇസ്രായേലിനെതിരെ’—ബിലെയാമിന്റെ അരുളപ്പാടിന്റെ സന്ദർഭത്തിൽ നിഗൂഢവിദ്യകൾ ഇസ്രായേലിന്മേൽ ഫലിക്കില്ലെന്ന പ്രഖ്യാപനം.
  rationale: בְּ എന്ന ഉപസർഗം ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാം. യഥാർഥമായ ഈ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു; ഒരേയൊരു വ്യാഖ്യാനം പാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: מַה פָּעַל אֵל ചോദ്യമാണോ ഉദ്‌ഗാരമാണോ
  choice: “ദൈവം എന്തൊരു പ്രവൃത്തി ചെയ്തിരിക്കുന്നു!” എന്ന ഉദ്‌ഗാരം.
  alternative: “ദൈവം എന്തു ചെയ്തിരിക്കുന്നു?” എന്ന ചോദ്യം.
  rationale: അരുളപ്പാടിന്റെ ഉച്ചസ്ഥായിയിൽ ദൈവത്തിന്റെ പ്രവൃത്തിയെ പരസ്യമായി അംഗീകരിക്കുന്ന പ്രഖ്യാപനമാണ് ഉദ്‌ഗാരവായനയ്ക്ക് കൂടുതൽ യോജിച്ചത്; വ്യാകരണപരമായി ചോദ്യം സാധ്യമെങ്കിലും സന്ദർഭത്തിൽ കുറവ് സ്വാഭാവികമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശകുനംനോക്കൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘മന്ത്രവാദം’ സമാന്തര നിഗൂഢപ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു. ഉദ്‌ഗാരത്തിൽ ‘എന്തൊരു പ്രവൃത്തി’ എന്നു ചേർത്തത് മലയാളത്തിൽ വിസ്മയഭാവം സ്വാഭാവികമാക്കുന്നു.
