language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: ml
  text: 'അപ്പോൾ ബാലാക്ക് അവനോടു പറഞ്ഞു: “ദയവായി എന്നോടൊപ്പം മറ്റൊരു സ്ഥലത്തേക്കു വരിക. അവിടെനിന്ന് നീ അവരെ കാണും. അവരുടെ അറ്റത്തെ ഭാഗം മാത്രം നീ കാണും[a]; അവരെ മുഴുവനായി കാണുകയില്ല. അവിടെനിന്ന് എനിക്കുവേണ്ടി അവരെ ശപിക്കുക.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അറ്റത്തെ ഭാഗം” എന്നതിന് “അങ്ങേയറ്റത്തുള്ള ഭാഗം” എന്നും വിവർത്തനം ചെയ്യാം; ഉദ്ദേശ്യം ഇസ്രായേൽജനത്തിന്റെ ഒരു ഭാഗം മാത്രം കാണുന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായമൂലത്തിൽ ഇസ്രായേലിനെ ഒരു ഏകീകൃത ജനമായി കണ്ട് “അവനെ,” “അവനെ മുഴുവനായി” എന്നീ ഏകവചനപ്രത്യയങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: ദയവായി എന്നോടൊപ്പം ... വരിക
  rationale: നָאയുടെ വിനീതമായ അഭ്യർഥനാഭാവവും അִתִּיയുടെ സഹഗമനാർത്ഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מָקוֹם אַחֵר
  choice: മറ്റൊരു സ്ഥലം
  rationale: സ്ഥലം മാറുന്നതിന്റെ മൂർത്തമായ അർഥം ലളിതമായ ഭാഷയിൽ നേരിട്ട് നൽകുന്നു.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: അവിടെനിന്ന് നിനക്ക് അവരെ കാണാം
  rationale: പുതിയ നിരീക്ഷണസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചന പ്രത്യയം മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹബഹുവചനമായി നൽകിയിരിക്കുന്നു.
- source_word: אֶפֶס קָצֵהוּ
  choice: അവരുടെ ഒരു അറ്റം മാത്രം
  rationale: אֶפֶס ഇവിടെ പരിമിതിയെ സൂചിപ്പിക്കുന്നു; קָצֶה എന്നത് അറ്റം, അരിക്, അങ്ങേയറ്റത്തെ ഭാഗം എന്നീ അർഥങ്ങൾ അനുവദിക്കുന്നു. കാണാനാകുന്നത് ജനത്തിന്റെ ഒരു ഭാഗം മാത്രമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: അവരെ മുഴുവനായി കാണുകയില്ല
  rationale: ഭാഗികദർശനവും സമ്പൂർണദർശനവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: അവിടെനിന്ന് എനിക്കുവേണ്ടി അവരെ ശപിക്കുക
  rationale: קבב എന്ന ക്രിയയുടെ ശാപോച്ചാരണാർത്ഥവും לִיയുടെ പ്രയോജനസൂചനയും ആവർത്തിക്കുന്ന സ്ഥലസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ഏകവചന പ്രത്യയങ്ങൾ
  choice: മുഖ്യവാക്യത്തിൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായ ‘അവർ/അവരെ’ ഉപയോഗിച്ചു
  alternative: എബ്രായരൂപം അനുകരിച്ച് ഏകവചനമായ ‘അവൻ/അവനെ’ ഉപയോഗിക്കുക
  rationale: എബ്രായത്തിൽ ഇസ്രായേൽ ഒരു ഏകീകൃത ജനസമൂഹമായി ഏകവചനത്തിൽ വരുന്നു. എന്നാൽ മലയാളത്തിൽ മനുഷ്യജനസമൂഹത്തെ ‘അവൻ’ എന്നു പറയുന്നത് തെറ്റായ വ്യക്തിസൂചന സൃഷ്ടിക്കും; അതിനാൽ അർഥം കൃത്യമായി കൈമാറുന്ന ബഹുവചനം ഉപയോഗിച്ച് മൂലത്തിലെ സമൂഹ-ഏകവചനത്തെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: לך എന്ന ആജ്ഞയുടെ ദിശാഭാവം
  choice: ‘വരിക’ എന്ന ക്ഷണരൂപം
  alternative: ‘പോകുക’ എന്ന കൂടുതൽ പദാനുപദ രൂപം
  rationale: സംസാരിക്കുന്ന ബാലാക്ക് ബിലെയാമിനെ തന്നോടൊപ്പം മറ്റൊരു സ്ഥലത്തേക്കു ക്ഷണിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘എന്നോടൊപ്പം വരിക’ സ്വാഭാവികവും സന്ദർഭസത്യവുമാണ്.
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക പ്രമാണമലയാളം. സംഭാഷണത്തിൽ വിനീതമായ അഭ്യർഥനാഭാവം നിലനിർത്തി; കൃത്രിമമായ പദാനുപദ ഏകവചനത്തിനു പകരം മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹബഹുവചനം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
