revisions:
- from: 'അപ്പോൾ ബാലാക്ക് അവനോടു പറഞ്ഞു: “ദയവായി എന്നോടൊപ്പം മറ്റൊരു സ്ഥലത്തേക്കു വരിക. അവിടെനിന്ന് നിനക്ക് അവരെ കാണാം. എന്നാൽ അവരുടെ ഒരു അറ്റം മാത്രമേ നീ കാണുകയുള്ളൂ[a]; അവരെ മുഴുവനായി കാണുകയില്ല. അവിടെനിന്ന് എനിക്കുവേണ്ടി അവരെ ശപിക്കുക.”[b]'
  to: 'അപ്പോൾ ബാലാക്ക് അവനോടു പറഞ്ഞു: “ദയവായി എന്നോടൊപ്പം മറ്റൊരു സ്ഥലത്തേക്കു വരിക. അവിടെനിന്ന് നീ അവരെ കാണും. അവരുടെ അറ്റത്തെ ഭാഗം മാത്രം നീ കാണും[a]; അവരെ മുഴുവനായി കാണുകയില്ല. അവിടെനിന്ന് എനിക്കുവേണ്ടി അവരെ ശപിക്കുക.”[b]'
  rationale: The revision retains the draft's faithful and natural collective-plural rendering of Israel, while changing two minor phrases for closer contextual fidelity and smoother Malayalam. The revised wording preserves the source's restricted-view imagery without asserting a doctrinal interpretation.
