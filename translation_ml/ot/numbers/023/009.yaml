  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: ml
  text: കാരണം, പാറകളുടെ മുകളിൽനിന്ന് ഞാൻ അവനെ കാണുന്നു; കുന്നുകളിൽനിന്ന് ഞാൻ അവനെ ദർശിക്കുന്നു. ഇതാ, തനിച്ചു വസിക്കുന്നതും ജനതകളുടെ ഇടയിൽ സ്വയം ഉൾപ്പെടുത്താത്തതുമായ ഒരു ജനം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനതകളുടെ ഇടയിൽ എണ്ണപ്പെടുകയില്ല.” എബ്രായ ക്രിയയെ കർമണിരൂപമായും ആത്മനിഷ്ഠ/മധ്യമ അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപ്രസ്താവനയെ വിശദീകരിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു; അതിരുകടന്ന കാരണാർഥം ചുമത്താതെ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: מֵרֹאשׁ צֻרִים
  choice: പാറകളുടെ മുകളിൽനിന്ന്
  rationale: רֹאשׁ എന്നതിന്റെ ഭൂപ്രകൃതിസംബന്ധിയായ ‘മുകൾ/ശിഖരം’ എന്ന അർഥവും צוּרִים എന്നതിന്റെ പാറക്കെട്ടുകളെന്ന ദൃശ്യവും ലളിതമായി പകരുന്നു.
- source_word: אֶרְאֶנּוּ
  choice: ഞാൻ അവനെ കാണുന്നു
  rationale: ഇസ്രായേൽജനത്തെ ഏകവചന പുരുഷലിംഗ സർവനാമംകൊണ്ട് സൂചിപ്പിക്കുന്ന എബ്രായ വ്യാകരണം സംരക്ഷിക്കുന്നു.
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: കുന്നുകളിൽനിന്ന് ഞാൻ അവനെ ദർശിക്കുന്നു
  rationale: ആദ്യത്തെ ‘കാണുന്നു’ എന്ന ക്രിയയിൽനിന്നുള്ള കാവ്യാത്മക വ്യത്യാസം സൂക്ഷിച്ചുകൊണ്ട് ശ്രദ്ധാപൂർവമായ നിരീക്ഷണം സൂചിപ്പിക്കുന്നു.
- source_word: הֶן
  choice: ഇതാ
  rationale: തുടർന്നുവരുന്ന ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന സൂചകകണത്തിന് മാന്യവും പരിചിതവുമായ മലയാളരൂപം.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: തനിച്ചു വസിക്കുന്ന ഒരു ജനം
  rationale: ജനത്തിന്റെ വേറിട്ട നിലയും ക്രിയയുടെ സ്വഭാവസൂചകമായോ തുടർച്ചയായോ ഉള്ള ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: ജനതകളുടെ കൂട്ടത്തിൽ അത് സ്വയം എണ്ണുന്നില്ല
  rationale: Hitpael രൂപത്തിന്റെ പ്രത്യാവർത്തക/മധ്യമ സാധ്യത പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ‘കൂട്ടത്തിൽ’ എന്നത് വർഗീകരിക്കപ്പെടുന്നതിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יִתְחַשָּׁב എന്ന ക്രിയ പ്രത്യാവർത്തകമായോ കർമണിയായോ മനസ്സിലാക്കണമോ
  choice: അത് സ്വയം എണ്ണുന്നില്ല
  alternative: അത് ജനതകളുടെ കൂട്ടത്തിൽ എണ്ണപ്പെടുകയില്ല
  rationale: Hitpael രൂപം പ്രത്യാവർത്തക/മധ്യമ അർഥം അനുവദിക്കുന്നതിനാൽ അത് പ്രധാനവാചകത്തിൽ സ്വീകരിച്ചു. എന്നാൽ കർമണി വായനയും ഭാഷാപരമായി സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഇസ്രായേലിന്റെ വേറിട്ട നിലയെക്കുറിച്ച് അധിക ദൈവശാസ്ത്ര നിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ കാവ്യഗദ്യം. ‘ഇതാ’, ‘ദർശിക്കുന്നു’ എന്നിവ പ്രവചനവാക്യത്തിന്റെ ഉയർന്ന ഭാവം നിലനിർത്തുന്നു; വാക്യത്തിന്റെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു.
