source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽ/שֲׁמָ֔ע הַאֲזִ֥ינָ/ה עָדַ֖/י בְּנ֥/וֹ צִפֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: ml
  text: 'പിന്നെ അവൻ തന്റെ പ്രസ്താവം[a] ഉച്ചരിച്ച് ഇപ്രകാരം പറഞ്ഞു:


    “ബാലാക്കേ, എഴുന്നേറ്റ് കേൾക്കുക;


    സിപ്പോരിന്റെ മകനേ, എനിക്കു ചെവിതരുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പഴഞ്ചൊല്ലുപോലുള്ള വചനം” അല്ലെങ്കിൽ “ഗംഭീരമായ പ്രഖ്യാപനം.” ഹീബ്രായ പദമായ מָשָׁל (മാശാൽ) പഴഞ്ചൊല്ലുപോലുള്ള വചനത്തെയോ ഔപചാരികമായ കാവ്യാത്മക ഉച്ചാരണത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് ബിലെയാമിന്റെ ഗംഭീരമായ പ്രഖ്യാപനത്തെ പരിചയപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: തന്റെ കാവ്യപ്രസ്താവം ചൊല്ലി
  rationale: נשׂא + מָשָׁל എന്ന പ്രയോഗം ഔപചാരികവും കാവ്യാത്മകവുമായ ഒരു ഉച്ചാരണം ആരംഭിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. ‘ചൊല്ലി’ സ്വാഭാവികമായ മലയാളമാണ്; ‘കാവ്യപ്രസ്താവം’ ഈ സന്ദർഭത്തിലെ ഉയർന്ന ശൈലി നിലനിർത്തുന്നു, എന്നാൽ ‘പ്രവചനം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: וַיֹּאמַר
  choice: ചൊല്ലി
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന സാധാരണ ക്രിയയാണ്. മുൻപുള്ള സംയുക്തപ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ അനാവശ്യമായ ‘എന്നു പറഞ്ഞു’ ആവർത്തനം ഒഴിവാക്കി.
- source_word: קוּם
  choice: എഴുന്നേറ്റു
  rationale: പുരുഷ ഏകവചന ആജ്ഞ. ഗൗരവമുള്ള ശൈലിക്ക് യോജിക്കുന്നതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: וּשֲׁמָע
  choice: കേൾക്കുക
  rationale: തുടർന്നുള്ള הַאֲזִינָה-യുമായി ഉള്ള സമാന്തരത നിലനിർത്താൻ ആദ്യ ക്രിയയെ ‘കേൾക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַאֲזִינָה עָדַי
  choice: എനിക്കു ചെവിതരുക
  rationale: ശ്രദ്ധയോടെ കേൾക്കുക എന്ന ശക്തമായ അർത്ഥവും עָדַי-യിലെ സംസാരിക്കുന്നവനിലേക്കുള്ള ദിശയും ഈ സ്വാഭാവിക മലയാളപ്രയോഗം പ്രകടമാക്കുന്നു.
- source_word: בְּנוֹ צִפֹּר
  choice: സിപ്പോരിന്റെ മകനേ
  rationale: ഹീബ്രായ അഭിസംബോധനയും പിതൃനാമപരമായ തിരിച്ചറിയലും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ കാവ്യരജിസ്റ്റർ. രണ്ട് ആജ്ഞകളുടെ സമാന്തര ഘടന നിലനിർത്തിയിരിക്കുന്നു. ബാലാക്കിനെയും ‘സിപ്പോരിന്റെ മകനേ’ എന്നും അഭിസംബോധന ചെയ്യുന്ന രൂപങ്ങൾ മലയാളത്തിലെ സംബോധനവിഭക്തിയിൽ നൽകിയിരിക്കുന്നു.
