source:
  edition: WLC
  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: ml
  text: അങ്ങനെ അവൻ അവനെ കാവൽക്കാരുടെ വയലിലേക്കും പിസ്ഗയുടെ ശിഖരത്തിലേക്കും കൊണ്ടുപോയി; അവൻ ഏഴ് യാഗപീഠങ്ങൾ പണിത്, ഓരോ യാഗപീഠത്തിന്മേലും ഒരു കാളയെയും ഒരു ആട്ടുകൊറ്റനെയും അർപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: അങ്ങനെ അവൻ അവനെ കൊണ്ടുപോയി
  rationale: לקח എന്ന ക്രിയയുടെ തുടർച്ചയായ ആഖ്യാനരൂപവും മൂന്നാംപുരുഷ ഏകവചന കർമപ്രത്യയവും സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ബാലാക്ക് ബിലെയാമിനെ കൊണ്ടുപോകുന്നതാണ്.
- source_word: שְׂדֵה צֹפִים
  choice: കാവൽക്കാരുടെ വയൽ
  rationale: സമാസഘടനയുടെ നേരായ അർഥം ‘കാവൽക്കാരുടെ/നിരീക്ഷകരുടെ വയൽ’ എന്നാണ്. ഇത് സ്ഥലനാമവുമാകാമെന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: പിസ്ഗയുടെ മുകളിലേക്ക്
  rationale: ഭൂമിശാസ്ത്രസന്ദർഭത്തിൽ רֹאשׁ എന്നത് ‘മുകൾ/ശിഖരം’ എന്നാണ്; הַפִּסְגָּה ഇവിടെ പിസ്ഗ എന്ന സ്ഥലനാമമായി നൽകുന്നു.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: ഏഴ് യാഗപീഠങ്ങൾ പണിത്
  rationale: ക്രിയയും സംഖ്യയോടുകൂടിയ കർമവും വ്യക്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: וַיַּעַל
  choice: അർപ്പിച്ചു
  rationale: യാഗസന്ദർഭത്തിൽ עלה എന്ന ക്രിയയ്ക്ക് ‘യാഗമായി അർപ്പിക്കുക’ എന്ന അർഥമുണ്ട്; ‘അർപ്പിച്ചു’ ആചാരപരമായ പ്രവൃത്തിയെ അധിക വ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: פָּר וָאַיִל
  choice: ഓരോ കാളയെയും ഓരോ ആട്ടുകൊറ്റനെയും
  rationale: മൂലപാഠത്തിലെ ഏകവചന മൃഗനാമങ്ങൾ ഒരു കാളയെയും ഒരു ആട്ടുകൊറ്റനെയും സൂചിപ്പിക്കുന്നു; ഏഴ് പീഠങ്ങളിലേക്കുള്ള വിതരണാർഥത്തോടു ചേർത്ത് മലയാളത്തിൽ ‘ഓരോ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּזְבֵּחַ
  choice: ഓരോ യാഗപീഠത്തിന്മേലും
  rationale: എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും, മുമ്പ് പറഞ്ഞ ഏഴ് യാഗപീഠങ്ങളിലോരോന്നിലും യാഗം അർപ്പിച്ചതെന്ന വിതരണാർഥം സന്ദർഭവും സമാന്തരവാക്യങ്ങളും വ്യക്തമാക്കുന്നു.
