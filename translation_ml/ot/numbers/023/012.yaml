  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: ml
  text: 'അവൻ മറുപടിയായി പറഞ്ഞു[a]: “യഹ്‌വെ എന്റെ വായിൽ വെക്കുന്നതു ഞാൻ ശ്രദ്ധയോടെ സംസാരിക്കേണ്ടതല്ലയോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വെ എന്റെ വായിൽ വെക്കുന്നതു സംസാരിക്കാൻ ഞാൻ സൂക്ഷ്മമായി പാലിക്കേണ്ടതല്ലയോ?” ഇവിടെ ക്രിയ, നൽകിയ വാക്കുകളോടു സൂക്ഷ്മമായി ചേർന്നുനിന്ന് സംസാരിക്കുന്നതിനെ ഊന്നിപ്പറയാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: അവൻ മറുപടിയായി പറഞ്ഞു
  rationale: ‘ഉത്തരം പറഞ്ഞു’ എന്ന ഇരട്ടപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ബിലെയാമിന്റെ പ്രതികരണമാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: הֲלֹא
  choice: ഞാൻ ... ശ്രദ്ധിക്കേണ്ടതല്ലയോ?
  rationale: സമ്മതം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യവും ദൈവം നൽകിയ വാക്കുകളോടുള്ള ബാധ്യതയും ഈ രൂപം പ്രകടമാക്കുന്നു.
- source_word: יָשִׂים ... בְּפִי
  choice: എന്റെ വായിൽ വെക്കുന്നതു
  rationale: സംസാരിക്കാനുള്ള വാക്കുകൾ നൽകുക എന്ന എബ്രായ ഭാഷാശൈലി മലയാളത്തിലും വ്യക്തമായതിനാൽ അതിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന് അനുയോജ്യമായി മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: സംസാരിക്കാൻ ഞാൻ ശ്രദ്ധിക്കേണ്ടതല്ലയോ
  rationale: שׁמר എന്ന ക്രിയയിലെ സൂക്ഷ്മമായി പാലിക്കുക/ശ്രദ്ധിക്കുക എന്ന അർഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ പൊതുവായ സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്; അതിനാൽ പേര് ലിപ്യന്തരം ചെയ്തു.
- issue: ബിലെയാമിന്റെ വാക്കുകളിലെ നിർബന്ധത്തിന്റെയും സൂക്ഷ്മപാലനത്തിന്റെയും അളവ്
  choice: സംസാരിക്കാൻ ഞാൻ ശ്രദ്ധിക്കേണ്ടതല്ലയോ?
  alternative: ഞാൻ സംസാരിക്കേണ്ടതല്ലയോ?
  rationale: הֲלֹא ബാധ്യത സൂചിപ്പിക്കുന്ന അലങ്കാരചോദ്യവും אֶשְׁמֹר לְדַבֵּר നൽകിയതു കൃത്യമായി പാലിച്ചു സംസാരിക്കുന്നതിലെ ശ്രദ്ധയും സൂചിപ്പിക്കുന്നു; എന്നാൽ യാന്ത്രികമായ നിർബന്ധം എന്ന ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. എബ്രായ ഭാഷാശൈലിയായ ‘വായിൽ വെക്കുക’ വ്യക്തവും പ്രസക്തവുമായതിനാൽ നിലനിർത്തി.
