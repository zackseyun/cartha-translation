- from: 'അവൻ അവന്റെ അടുക്കൽ വന്നു. അതാ, അവൻ തന്റെ ദഹനയാഗത്തിനരികെ നിൽക്കുകയായിരുന്നു; മോവാബിലെ പ്രഭുക്കന്മാരും അവനോടുകൂടെ ഉണ്ടായിരുന്നു.[a] ബാലാക്ക് അവനോട് ചോദിച്ചു: “യഹ്‌വെ എന്താണ് അരുളിച്ചെയ്തത്?”'
  to: 'ബിലെയാം ബാലാക്കിന്റെ അടുക്കൽ വന്നു. അതാ, ബാലാക്ക് തന്റെ ദഹനയാഗത്തിനരികെ നിൽക്കുകയായിരുന്നു; മോവാബിലെ പ്രഭുക്കന്മാർ[a] അവനോടുകൂടെ ഉണ്ടായിരുന്നു. ബാലാക്ക് അവനോടു പറഞ്ഞു: “യഹ്‌വേ എന്താണ് പറഞ്ഞത്?”'
  rationale: The revision resolves pronoun ambiguity by naming the contextually identified participants, uses a more appropriate Malayalam transliteration of Yahweh, restores the direct narrative verb ‘said,’ and relocates the footnote marker to the lexical item it explains. No theological or interpretive expansion is introduced.
