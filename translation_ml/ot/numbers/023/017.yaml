language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: ml
  text: 'ബിലെയാം ബാലാക്കിന്റെ അടുക്കൽ വന്നു. അതാ, ബാലാക്ക് തന്റെ ദഹനയാഗത്തിനരികെ നിൽക്കുകയായിരുന്നു; മോവാബിലെ പ്രഭുക്കന്മാർ[a] അവനോടുകൂടെ ഉണ്ടായിരുന്നു. ബാലാക്ക് അവനോടു പറഞ്ഞു: “യഹ്‌വേ എന്താണ് പറഞ്ഞത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രഭുക്കന്മാർ” എന്നതിന് “മോവാബിലെ ഉദ്യോഗസ്ഥർ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: അവൻ അവന്റെ അടുക്കൽ വന്നു
  rationale: בוא എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വന്നു’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മടങ്ങിവരവാണെങ്കിലും ‘മടങ്ങിവന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: וְהִנּוֹ
  choice: അതാ
  rationale: തുടർന്നുള്ള ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു വ്യവഹാരകണത്തിന്റെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: נִצָּב
  choice: നിൽക്കുകയായിരുന്നു
  rationale: പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന, ആ സമയത്ത് തുടരുന്ന നില മലയാളത്തിലെ ഭൂതകാല പുരോഗമനരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עַל עֹלָתוֹ
  choice: തന്റെ ദഹനയാഗത്തിനരികെ
  rationale: עַל എന്നതിന്റെ സന്ദർഭോചിതമായ സ്ഥലബന്ധം ‘അരികെ’ എന്നു നൽകുന്നു; യാഗത്തിന്റെ മുകളിൽ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: עֹלָתוֹ
  choice: തന്റെ ദഹനയാഗം
  rationale: עֹלָה എന്ന യാഗസാങ്കേതികപദത്തിന് പതിവും കൃത്യവുമായ മലയാള തുല്യം ഉപയോഗിക്കുന്നു.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: മോവാബിലെ പ്രഭുക്കന്മാരും അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: שָׂרִים എന്നതിന് രാജസദസ്സിന്റെ പശ്ചാത്തലത്തിന് യോജിച്ച ‘പ്രഭുക്കന്മാർ’ തിരഞ്ഞെടുത്തു; ‘ഉദ്യോഗസ്ഥർ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַיֹּאמֶר לוֹ בָּלָק
  choice: ബാലാക്ക് അവനോട് ചോദിച്ചു
  rationale: തുടരുന്ന നേരിട്ടുള്ള ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ ഉപയോഗിക്കുന്നു; പ്രസംഗപ്രവർത്തി മാറ്റുന്നില്ല.
- source_word: מַה דִּבֶּר
  choice: എന്താണ് ... അരുളിച്ചെയ്തത്?
  rationale: ദൈവിക വാക്കിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; ഹീബ്രു perfect-ന്റെ പൂർത്തിയായ പ്രസംഗഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തിന് അടുത്ത മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹീബ്രുവിലെ കഥാപാത്രസൂചനയിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും വാക്യഘടന മലയാളത്തിന് സ്വാഭാവികമാക്കി; ‘അതാ’ എന്നത് ആഖ്യാനത്തിന്റെ ദൃശ്യസജീവത സംരക്ഷിക്കുന്നു.
