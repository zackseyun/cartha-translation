source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: ml
  text: അങ്ങനെ ബിലെയാം പറഞ്ഞതുപോലെ ബാലാക്ക് ചെയ്തു; അവൻ യാഗപീഠത്തിന്മേൽ ഒരു കാളയെയും ഒരു ആട്ടുകൊറ്റനെയും അർപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: כַּאֲשֶׁר אָמַר എന്ന ഘടനയോടൊപ്പം עשה എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘പറഞ്ഞതുപോലെ ചെയ്തു’ എന്ന സ്വാഭാവിക അർഥമാണ്.
- source_word: כַּאֲשֶׁר
  choice: പറഞ്ഞതുപോലെ
  rationale: ബിലെയാം നിർദേശിച്ച രീതിയോട് ബാലാക്കിന്റെ പ്രവൃത്തി പൊരുത്തപ്പെട്ടുവെന്ന താരതമ്യ-അനുസരണ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָמַר
  choice: പറഞ്ഞ
  rationale: ബാലാക്കിന്റെ പ്രവൃത്തിക്ക് മുമ്പുണ്ടായ ബിലെയാമിന്റെ വാക്കിനെ മലയാളത്തിലെ ബന്ധകൃതന്തം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേക ഭൂതപൂർവരൂപം ആവശ്യമില്ല.
- source_word: וַיַּעַל
  choice: അർപ്പിച്ചു
  rationale: עלה എന്ന ക്രിയ ബലികർമസന്ദർഭത്തിൽ യാഗപീഠത്തിൽ ബലി അർപ്പിക്കുക എന്ന സാങ്കേതിക അർഥത്തിലാണ്; ‘അർപ്പിച്ചു’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: פָּר
  choice: ഒരു കാള
  rationale: ബലിക്കുള്ള ആൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ മലയാളപദമാണ് ‘കാള’.
- source_word: אַיִל
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: אַיִל സൂചിപ്പിക്കുന്ന പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സാധാരണ മലയാളത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: בַּמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്മേൽ
  rationale: ബലിവസ്തുക്കൾ പീഠത്തിന്മേൽ അർപ്പിച്ചുവെന്ന സ്ഥലബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וַ
  choice: അങ്ങനെ
  rationale: ആദ്യത്തെ waw മുൻനിർദേശത്തിന്റെ ഫലമായി തുടർന്ന പ്രവൃത്തിയെ ബന്ധിപ്പിക്കുന്നു; ‘അങ്ങനെ’ ആ ആഖ്യാനബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
