translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാഗപീഠം’, ‘അർപ്പിച്ചു’ എന്നീ പദങ്ങൾ ബലികർമസന്ദർഭത്തിന്റെ ഗൗരവവും കൃത്യതയും നിലനിർത്തുന്നു; അർഥം കൂട്ടിച്ചേർക്കുകയോ ദൈവശാസ്ത്രപരമായി വ്യാഖ്യാനിക്കുകയോ ചെയ്തിട്ടില്ല.
