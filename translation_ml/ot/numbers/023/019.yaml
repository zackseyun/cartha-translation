reference: Numbers 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: ml
  text: ദൈവം മനുഷ്യനല്ല—കള്ളം പറയാൻ; മനുഷ്യപുത്രനുമല്ല[a]—മനം മാറ്റാൻ. അവിടുന്ന് പറഞ്ഞിട്ട് അത് ചെയ്യാതിരിക്കുമോ? സംസാരിച്ചിട്ട് അത് നിറവേറ്റാതിരിക്കുമോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മനുഷ്യപുത്രൻ” ഇവിടെ എബ്രായത്തിലെ സാധാരണ പ്രയോഗമാണ്; അതിന്റെ അർഥം ഒരു മനുഷ്യൻ എന്നാണ്, മിശിഹായെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരല്ല.
    reason: cultural_note
  - marker: b
    text: 'അക്ഷരാർഥം: “അതിനെ നിലനിൽക്കുമാറാക്കാതിരിക്കുമോ?” “സ്ഥിരപ്പെടുത്താതിരിക്കുമോ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: ദൈവം
  rationale: ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മനുഷ്യനോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אִישׁ
  choice: മനുഷ്യൻ
  rationale: ലിംഗവിശേഷത്തേക്കാൾ മനുഷ്യസ്വഭാവമാണ് ഇവിടെ വൈരുധ്യത്തിന്റെ കേന്ദ്രം; ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וִיכַזֵּב
  choice: കള്ളം പറയാൻ
  rationale: כזב എന്ന ക്രിയയുടെ അസത്യവചനവും വിശ്വാസ്യതക്കുറവും സംബന്ധിച്ച നേരിട്ടുള്ള അർഥം ലളിതമായി നൽകുന്നു.
- source_word: בֶן אָדָם
  choice: മനുഷ്യപുത്രൻ
  rationale: എബ്രായ സമാന്തരഘടനയും പദരൂപവും നിലനിർത്തുന്നു; ഇവിടെ അത് ഒരു സാധാരണ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: וְיִתְנֶחָם
  choice: മനം മാറ്റാൻ
  rationale: נחם എന്ന ക്രിയ ഇവിടെ ഉദ്ദേശ്യമോ നടപടിക്രമമോ മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ധാർമ്മിക പശ്ചാത്താപം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: הַהוּא אָמַר
  choice: അവിടുന്ന് പറഞ്ഞിട്ട്
  rationale: തുടർന്നുള്ള നിഷേധചോദ്യത്തോടൊപ്പം എബ്രായത്തിലെ ആലങ്കാരിക ചോദ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: יַעֲשֶׂה
  choice: ചെയ്യാതിരിക്കുമോ
  rationale: പറഞ്ഞ കാര്യം പ്രവർത്തിയിൽ കൊണ്ടുവരുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: וְדִבֶּר
  choice: അരുളിച്ചെയ്തിട്ട്
  rationale: ദൈവത്തിന്റെ വചനപ്രഖ്യാപനത്തിന് യോജിച്ച ആദരസൂചകവും ആധുനിക വിശുദ്ധഗ്രന്ഥശൈലിയിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יְקִימֶנָּה
  choice: അത് നിറവേറ്റാതിരിക്കുമോ
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘നിലനിർത്തുക/സ്ഥാപിക്കുക’ എന്ന ദൃശ്യാർഥം ഇവിടെ വാഗ്ദാനം പ്രാബല്യത്തിൽ വരുത്തുക എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: וְיִתְנֶחָם എന്ന ദൈവത്തെക്കുറിച്ചുള്ള പ്രയോഗം
  choice: മനം മാറ്റാൻ
  alternative: പിൻവാങ്ങാൻ; അനുതപിക്കാൻ
  rationale: വാക്യം ദൈവത്തിന്റെ വിശ്വാസ്യതയെ മനുഷ്യന്റെ ചാഞ്ചാട്ടവുമായി താരതമ്യം ചെയ്യുന്നു. ‘മനം മാറ്റാൻ’ എന്നത് ധാർമ്മിക പശ്ചാത്താപം ദൈവത്തിന് ചുമത്താതെയും ഗ്രന്ഥത്തിലെ വിശാലമായ ദൈവ-മനുഷ്യബന്ധത്തെക്കുറിച്ചുള്ള സംഘർഷം ദാർശനികമായി തീർപ്പാക്കാതെയും ആശയം നൽകുന്നു.
- issue: בֶן אָדָם ഒരു മിശിഹായുടെ സ്ഥാനപ്പേരായി വായിക്കണമോ
  choice: സാധാരണ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ‘മനുഷ്യപുത്രൻ’
  alternative: മനുഷ്യൻ
  rationale: ഈ കാവ്യസമാന്തരത്തിൽ ഇത് മനുഷ്യവർഗത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; മിശിഹായുടെ സ്ഥാനപ്പേര് ഇവിടെ ഇറക്കുമതി ചെയ്യരുത്.
- issue: יְקִימֶנָּה എന്നതിലെ രൂപകദൃശ്യം
  choice: നിറവേറ്റുക
  alternative: സ്ഥിരപ്പെടുത്തുക; നിലനിർത്തുക
  rationale: അക്ഷരാർഥം ‘അതിനെ നിലനിൽക്കുമാറാക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ പറഞ്ഞ വാക്ക് യാഥാർഥ്യമാക്കുക എന്ന അർഥം വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആദ്യപകുതിയിലെ കാവ്യസമാന്തരത്തിന് ദീർഘവിരാമങ്ങൾ ഉപയോഗിച്ചു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; ‘മനുഷ്യപുത്രൻ’ എന്ന പദം ഉറവിടരൂപം കാത്തുസൂക്ഷിക്കുമ്പോഴും അടിക്കുറിപ്പിൽ അതിന്റെ സാധാരണ മാനുഷിക അർഥം വ്യക്തമാക്കുന്നു.
