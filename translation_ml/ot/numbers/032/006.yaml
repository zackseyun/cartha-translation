  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗോത്രപരമായ ‘പുത്രന്മാർ’ എന്ന എബ്രായ രൂപവും മോശെയുടെ ശാസനാത്മക ചോദ്യത്തിന്റെ മൂർച്ചയും നിലനിർത്തി.
