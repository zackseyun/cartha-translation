source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: ml
  text: 'മോശെ ഗാദിന്റെ പുത്രന്മാരോടും രൂബേന്റെ പുത്രന്മാരോടും പറഞ്ഞു: “നിങ്ങളുടെ സഹോദരന്മാർ യുദ്ധത്തിനു പോകുമ്പോൾ നിങ്ങൾ ഇവിടെ ഇരിക്കുമോ?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യുദ്ധത്തിനു പോകുക” എന്നത് സൈനിക സംഘർഷത്തിൽ പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ എബ്രായ പ്രയോഗമാണ്; “പോരാട്ടത്തിനു പോകുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങളുടെ സഹോദരന്മാർ” എന്നത് മറ്റു ഗോത്രങ്ങളിലെ സഹ ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ മോശെ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നു; സന്ദർഭത്തിലെ പ്രതികൂലത മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ പുത്രന്മാരോടും രൂബേന്റെ പുത്രന്മാരോടും
  rationale: בני എന്നതിന്റെ ‘പുത്രന്മാർ’ എന്ന കുടുംബ-ഗോത്ര രൂപം നിലനിർത്തുന്നു; ഇവിടെ ഗോത്രവംശജരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַאַחֵיכֶם
  choice: നിങ്ങളുടെ സഹോദരന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപദം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മറ്റു ഇസ്രായേൽ ഗോത്രങ്ങളിലെ സഹജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു പോകുമ്പോൾ
  rationale: ‘യുദ്ധത്തിലേക്കു വരുക/പ്രവേശിക്കുക’ എന്ന എബ്രായ സൈനികപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘യുദ്ധത്തിനു പോകുക’ എന്നു നൽകി.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: നിങ്ങൾ ഇവിടെ ഇരിക്കുമോ?
  rationale: ישב എന്നതിന്റെ ദൃശ്യവും കുറ്റപ്പെടുത്തലിന്റെ മൂർച്ചയും ‘ഇരിക്കുക’ നിലനിർത്തുന്നു; ചോദ്യം വാചകത്തിന്റെ ശാസനാത്മക സ്വരം പ്രകടമാക്കുന്നു.
