  naturalness: The register and respectful singular address are appropriate. Recasting the possession phrase as “സ്വത്തായി” produces natural modern Malayalam while retaining the intended sense.
  terminology: “അങ്ങയുടെ പ്രീതി,” “ദാസന്മാരായ ഞങ്ങൾ,” “ദേശo,” and “യോർദാൻ” are suitable. “സ്വത്തായി” is a clear rendering of לַאֲחֻזָּה here without introducing an unwarranted inheritance-specific meaning.
