  register: ആധുനികവും മാന്യവുമായ മലയാളം. മോശയോടുള്ള ആദരപൂർവമായ ഏകവചന അഭിസംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു; അപേക്ഷയുടെ വിനയഭാവം ‘നൽകണമേ’, ‘കടത്തരുതേ’ എന്നീ രൂപങ്ങളിൽ നിലനിർത്തി.
