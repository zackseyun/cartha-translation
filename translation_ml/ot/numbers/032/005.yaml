  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “അങ്ങയുടെ പ്രീതി ഞങ്ങൾക്കു ലഭിച്ചിട്ടുണ്ടെങ്കിൽ, ഈ ദേശം അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കു സ്വത്തായി നൽകണമേ. ഞങ്ങളെ യോർദാൻ കടത്തരുതേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളെ യോർദാനക്കരെ കൊണ്ടുപോകരുതേ.” എബ്രായ ക്രിയ കാരകഅർഥമുള്ള രൂപത്തിലാണ്; അടുത്ത അർഥമുള്ള ഒന്നിലധികം രീതികളിൽ ഇതു പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: അങ്ങയുടെ ദൃഷ്ടിയിൽ ഞങ്ങൾക്കു പ്രീതി ലഭിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: അനുകൂലമായ പരിഗണന ലഭിക്കുക എന്ന എബ്രായ ശൈലി മലയാളത്തിൽ സ്വാഭാവികമായും അതിന്റെ ബന്ധപരമായ ഭാവം നിലനിർത്തിയും അവതരിപ്പിക്കുന്നു.
- source_word: יֻתַּן
  choice: നൽകണമേ
  rationale: നിഷ്ക്രിയമായ അപേക്ഷാരൂപത്തിന്റെ വിനയഭാവം സ്വാഭാവിക മലയാളത്തിലെ ആദരപൂർവമായ അഭ്യർഥനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ഈ ദേശം
  rationale: ഭൂപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന אֶרֶץ എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: לַעֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കു
  rationale: മോശയോടുള്ള അപേക്ഷയിൽ ഇത് അധീനതയെക്കാൾ വിനയപൂർവമായ സ്വയംവിശേഷണമാണ്; ‘ദാസന്മാർ’ ആ സംഭാഷണഭാവം നിലനിർത്തുന്നു.
- source_word: לַאֲחֻזָּה
  choice: കൈവശമായി
  rationale: ഭൂമിയുടെ സ്ഥിരമായ കൈവശാവകാശം സൂചിപ്പിക്കുന്ന അർഥം ലളിതമായി നൽകുന്നു; ‘അവകാശം’ എന്ന പദം മാത്രം ഉപയോഗിച്ച് പാരമ്പര്യാവകാശം എന്ന കൂടുതൽ പ്രത്യേക ആശയം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: ഞങ്ങളെ യോർദാൻ കടത്തരുതേ
  rationale: עבר എന്ന ക്രിയയുടെ ഹിഫീൽ കാരകഭാവം ‘കടത്തരുതേ’ വ്യക്തമായി നിലനിർത്തുന്നു; ഇത് വെറും ‘കടക്കാൻ അനുവദിക്കരുത്’ എന്നല്ല.
