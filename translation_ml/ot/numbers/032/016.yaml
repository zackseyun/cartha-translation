id: NUM.32.16
reference: Numbers 32:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֤וּ אֵלָי/ו֙ וַ֣/יֹּאמְר֔וּ גִּדְרֹ֥ת צֹ֛אן נִבְנֶ֥ה לְ/מִקְנֵ֖/נוּ פֹּ֑ה וְ/עָרִ֖ים לְ/טַפֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവന്റെ അടുത്തുവന്ന് പറഞ്ഞു: “ഞങ്ങളുടെ കന്നുകാലികൾക്കായി ഇവിടെ ആട്ടിൻതൊഴുത്തുകളും ഞങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കായി[a] പട്ടണങ്ങളും പണിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മക്കൾക്കായി.” എബ്രായത്തിലെ טַף എന്ന പദം കുഞ്ഞുങ്ങളെയോ ആശ്രിതരെയോ സൂചിപ്പിക്കുന്നു; സമൂഹത്തിലെ ദുർബല അംഗങ്ങൾക്ക് പലപ്പോഴും ഇതിൽ ഊന്നലുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: അവർ അവന്റെ അടുത്തുവന്ന്
  rationale: נגשׁ എന്ന ക്രിയയും אֵלָיו എന്ന പദവും മോശെയുടെ അടുത്തേക്കുള്ള ശാരീരിക സമീപനം സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ ചലനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיֹּאמְרוּ
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള സംഭാഷണം ആരംഭിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗത്തിന് യോജിച്ച ലളിതമായ മലയാളരൂപം.
- source_word: גִּדְרֹת צֹאן
  choice: ആട്ടിൻതൊഴുത്തുകൾ
  rationale: ആടുമന്ദകൾക്കുള്ള വേലികെട്ടിയ സംരക്ഷിത ഇടങ്ങളെയാണ് ഈ നിർമാണബന്ധം സൂചിപ്പിക്കുന്നത്; 'ആട്ടിൻതൊഴുത്തുകൾ' സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: נִבְנֶה
  choice: പണിയാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചന അപൂർണ്ണക്രിയ ഇവിടെ ഉദ്ദേശ്യമോ നിർദേശമോ പ്രകടിപ്പിക്കുന്നു; 'പണിയാം' ഈ നിർദേശഭാവം നിലനിർത്തുന്നു, ഉറച്ച ഭാവിപ്രഖ്യാപനമായി അതിനെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לְמִקְנֵנוּ
  choice: ഞങ്ങളുടെ കന്നുകാലികൾക്കായി
  rationale: מִקְנֶה വിവിധ ഇനങ്ങളിലുള്ള വളർത്തുമൃഗങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; മലയാളത്തിൽ 'കന്നുകാലികൾ' ഇവിടെ പൊതുവായ സമ്പാദ്യമൃഗങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: פֹּה
  choice: ഇവിടെ
  rationale: ലളിതമായ സ്ഥലസൂചക അവ്യയത്തിന്റെ നേരിട്ടുള്ള മലയാളസമം.
- source_word: וְעָרִים
  choice: പട്ടണങ്ങളും
  rationale: עָרִים മതിലുകളുള്ളതോ സ്ഥിരവാസമുള്ളതോ ആയ ജനവാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കാം; ഈ പശുപാലകസന്ദർഭത്തിൽ 'പട്ടണങ്ങൾ' ആധുനിക മലയാളത്തിൽ 'നഗരങ്ങൾ' എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: לְטַפֵּנוּ
  choice: ഞങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കായി
  rationale: טַף ചെറുപ്പക്കാരെയും ആശ്രിതരെയും, പ്രത്യേകിച്ച് സമൂഹത്തിലെ ദുർബല അംഗങ്ങളെയും സൂചിപ്പിക്കാം; 'കുഞ്ഞുങ്ങൾ' കുടുംബപരവും ദുർബലത സൂചിപ്പിക്കുന്നതുമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിർദേശഭാവമുള്ള נִבְנֶה എന്ന രൂപം 'പണിയാം' എന്നു നൽകി; טַף എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
