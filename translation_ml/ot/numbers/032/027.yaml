id: NUM.32.27
reference: Numbers 32:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: ml
  text: എന്നാൽ അങ്ങയുടെ ദാസന്മാർ, യുദ്ധത്തിനായി ആയുധമണിഞ്ഞ ഓരോരുത്തരും, യഹ്‌വേയുടെ സന്നിധിയിൽ യുദ്ധത്തിനായി കടന്നുപോകും[a][b]; അങ്ങ് പറയുന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സൈനികസേവനത്തിന് സജ്ജരായ എല്ലാവരും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘യഹ്‌വേയുടെ സന്നിധിയിൽ’ എന്നത് ഈ യുദ്ധദൗത്യം യഹ്‌വേയുടെ അധികാരത്തിൻകീഴിലും അവിടുത്തെ സാന്നിധ്യത്തിലുമാണ് നടത്തപ്പെടുന്നതെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: എന്നാൽ അങ്ങയുടെ ദാസന്മാർ
  rationale: עֶבֶד ഇവിടെ മോശെയോടുള്ള ആദരപൂർവമായ സ്വയംവിശേഷണമാണ്; അതിനാൽ ‘ദാസന്മാർ’ യോജിക്കുന്നു. മുൻസന്ദർഭത്തിലെ ആശങ്കയ്ക്കുള്ള വിരുദ്ധപ്രതികരണം സൂചിപ്പിക്കാൻ waw ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: יַעַבְרוּ
  choice: കടന്നുപോകും
  rationale: עבר ഇവിടെ അതിർത്തി കടന്ന് സൈനികനടപടിക്കായി പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കടന്നുപോകും’ ചലനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל חֲלוּץ צָבָא
  choice: യുദ്ധത്തിനായി ആയുധമണിഞ്ഞ ഓരോരുത്തരും
  rationale: כָּל ഏകവചനരൂപത്തോടൊപ്പം വിതരണാർഥത്തിൽ ‘ഓരോരുത്തരും’ എന്നാണ്. חֲלוּץ צָבָא യുദ്ധസേവനത്തിന് സജ്ജനും ആയുധധാരിയുമായ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന അർഥവും ദൈവിക സാന്നിധ്യത്തിലും അധികാരത്തിൻ കീഴിലുമുള്ള ദൗത്യത്തിന്റെ ഭാവവും ഇതിലൂടെ നിലനിൽക്കുന്നു. יְהוָה വ്യക്തിനാമമായി ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു
  rationale: ലാമെദ് ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; ‘യുദ്ധത്തിനു’ ദിശയും ഉദ്ദേശ്യവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പറഞ്ഞതുപോലെതന്നെ
  rationale: അനുസരണത്തിലും പൊരുത്തത്തിലും ഊന്നൽ നൽകുന്ന ‘just as’ എന്ന അർഥം ‘പോലെതന്നെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֲדֹנִי
  choice: എന്റെ യജമാനൻ
  rationale: ഇത് ദൈവിക വിശേഷണമല്ല, മോശെയോടുള്ള ആദരസംബോധനയാണ്. ‘എന്റെ യജമാനൻ’ ആ വേർതിരിവും ആദരഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: דֹּבֵר
  choice: പറഞ്ഞ
  rationale: പങ്കുപദം ഇപ്പോഴത്തെ പ്രസ്താവനയെ പരാമർശിക്കാമെങ്കിലും, മലയാളത്തിൽ ‘പറഞ്ഞതുപോലെതന്നെ’ എന്ന രൂപം ഈ സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ചതുരക്ഷര ദൈവനാമത്തെ പൊതുവായ സ്ഥാനനാമമായി മാറ്റാതെ ഉടമ്പടിനാമമായി നിലനിർത്തുന്നു.
- issue: לִפְנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വേയുടെ മുമ്പാകെ
  rationale: സൈനികപങ്കാളിത്തം യഹ്‌വേയുടെ സാന്നിധ്യത്തിലും അധികാരത്തിൻ കീഴിലുമാണെന്ന ആശയം സംരക്ഷിക്കുന്നു; ‘സന്നിധിയിൽ’ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മോശെയോടുള്ള ആദരഭാവത്തിന് ‘അങ്ങയുടെ’, ‘എന്റെ യജമാനൻ’ എന്നിവ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ സൈനികവും ദൈവശാസ്ത്രപരവുമായ ഭാവം അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തി.
