source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ അങ്ങനെ ചെയ്യാതിരുന്നാൽ, ഇതാ, നിങ്ങൾ യഹ്‌വേക്കെതിരെ പാപം ചെയ്തിരിക്കുന്നു. നിങ്ങളുടെ പാപം നിങ്ങളെ കണ്ടെത്തും[a] എന്ന് അറിഞ്ഞുകൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ പാപം നിങ്ങളെ പിടികൂടും’ അല്ലെങ്കിൽ ‘നിങ്ങളുടെ കുറ്റം നിങ്ങളെ പിന്തുടർന്ന് പിടിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ എബ്രായ പ്രയോഗം പാപം അനിവാര്യമായി വെളിപ്പെടുകയും അതിന്റെ പരിണതഫലം പാപിയെ തേടിയെത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ … ചെയ്യാതിരുന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വ്യത്യാസവും നിബന്ധനയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: നിങ്ങൾ അങ്ങനെ ചെയ്യാതിരുന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽ നിർദേശിച്ച പ്രവൃത്തിയിലേക്കുള്ള സൂചന സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: എബ്രായത്തിലെ ശ്രദ്ധക്ഷണിക്കുന്ന, ഗൗരവമുള്ള മുന്നറിയിപ്പിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: חֲטָאתֶם
  choice: നിങ്ങൾ … പാപം ചെയ്തിരിക്കുന്നു
  rationale: നിബന്ധന പാലിക്കാതിരുന്നാൽ ഉണ്ടാകുന്ന കുറ്റാവസ്ഥയെ എബ്രായ പൂർണക്രിയയുടെ നേരിട്ടുള്ള ശക്തിയോടെ അവതരിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെയോടു
  rationale: חטא എന്ന ക്രിയയോടൊപ്പം പാപം ആരോടാണ് ചെയ്തതെന്ന് സൂചിപ്പിക്കുന്നു; ദൈവനാമം വിവർത്തനം ചെയ്യാതെ മലയാള ലിപിയിൽ നൽകുന്നു.
- source_word: וּדְעוּ
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: ബഹുവചന ആജ്ഞയുടെ ഉറപ്പും നേരിട്ടുള്ള മുന്നറിയിപ്പും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: חַטַּאתְכֶם
  choice: നിങ്ങളുടെ പാപം
  rationale: ‘പാപം’ എന്നും ‘കുറ്റം’ എന്നും അർഥസാധ്യതയുണ്ടെങ്കിലും, ഇവിടെ ധാർമിക ലംഘനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ‘പാപം’ മുഖ്യപാഠത്തിൽ യോജിക്കുന്നു.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: നിങ്ങളെ കണ്ടെത്തും
  rationale: എബ്രായ രൂപകത്തെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അനിവാര്യമായ വെളിപ്പെടലും പരിണതഫലവും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ മലയാള ലിപിയിൽ പ്രതിനിധീകരിക്കുന്നു.
- issue: ‘പാപം നിങ്ങളെ കണ്ടെത്തും’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: നിങ്ങളുടെ കുറ്റം നിങ്ങളെ പിടികൂടും
  rationale: മൂലത്തിലെ വ്യക്തിവൽക്കരണവും അതിലുള്ള വെളിപ്പെടൽ–പരിണതഫല അർഥവ്യാപ്തിയും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള മുന്നറിയിപ്പിന്റെ ശൈലി പാലിച്ചു. ‘ഇതാ’ എന്ന അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ള പദം മൂലത്തിലെ ഊന്നലിനായി നിലനിർത്തി; ശേഷിച്ച വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി.
