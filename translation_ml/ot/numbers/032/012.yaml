source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: ml
  text: കെനിസ്യനായ യെഫുന്നെയുടെ മകനായ കാലേബും നൂന്റെ മകനായ യോശുവയും ഒഴികെ, അവർ യഹ്‌വെയെ പൂർണമായി അനുഗമിച്ചതിനാൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹ്‌വെയെ പൂർണഹൃദയത്തോടെ അനുഗമിച്ചു.’ എബ്രായ ഭാഷാശൈലിയുടെ അക്ഷരാർഥം ‘യഹ്‌വെയുടെ പിന്നാലെ നിറച്ചു’ എന്നാണ്; അത് സമ്പൂർണ വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: ഒഴികെ
  rationale: മുൻവാക്യത്തിലെ ന്യായവിധിയിൽനിന്നുള്ള ഏക ഒഴിവുകളെ ഈ പദം അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: കെനിസ്യനായ യെഫുന്നെയുടെ മകൻ കാലേബ്
  rationale: വ്യക്തിനാമങ്ങളും വംശനാമവും മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; הַקְּנִזִּי കാലേബിന്റെ വംശബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണമായി നിലനിർത്തി.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവയും
  rationale: וְ എന്ന സംയോജകത്തിന്റെ ബന്ധം ‘ഉം’കൊണ്ട് പ്രകടമാക്കി; בִּן എന്ന വംശാവലി പ്രയോഗം ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: כִּי
  choice: കാരണം
  rationale: കാലേബും യോശുവയും ഒഴിവാക്കപ്പെട്ടതിന്റെ കാരണം വ്യക്തമാക്കുന്ന ഹേതുവാചക അർഥം നൽകുന്നു.
- source_word: מִלְאוּ אַחֲרֵי
  choice: പൂർണമായി അനുഗമിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പിന്നാലെ നിറച്ചു’ എന്ന എബ്രായ പ്രയോഗം സമ്പൂർണ വിശ്വസ്തതയോടെ പിന്തുടരുക എന്ന ആശയം നൽകുന്നു; അതിന്റെ ശക്തി അമിതവ്യാഖ്യാനം കൂടാതെ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുർക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: מִלְאוּ אַחֲרֵי എന്ന പ്രയോഗത്തിലെ സമ്പൂർണ വിശ്വസ്തത
  choice: പൂർണമായി അനുഗമിച്ചു
  alternative: പൂർണഹൃദയത്തോടെ അനുഗമിച്ചു
  rationale: എബ്രായ ഭാഷാശൈലി സമഗ്രമായ അനുസരണവും വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠം രൂപകത്തിന്റെ ശക്തി ചുരുക്കമായി നിലനിർത്തുന്നു; ബദൽ അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന മൂലപാഠത്തിന്റെ വാക്യഖണ്ഡസ്വഭാവം ‘ഒഴികെ’ എന്ന ഘടനയിൽ നിലനിർത്തിയെങ്കിലും, കാരണബന്ധം വ്യക്തതയ്ക്കായി ‘കാരണം’ എന്നു തുറന്നുകാട്ടി.
