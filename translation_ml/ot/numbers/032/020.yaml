  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ מֹשֶׁ֔ה אִֽם תַּעֲשׂ֖וּ/ן אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה אִם תֵּחָֽלְצ֛וּ לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: ml
  text: 'മോശെ അവരോടു പറഞ്ഞു: “നിങ്ങൾ ഈ കാര്യം ചെയ്യുന്നുവെങ്കിൽ, യുദ്ധത്തിനായി യഹോവയുടെ സന്നിധിയിൽ ആയുധമണിയുന്നുവെങ്കിൽ[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആയുധസജ്ജരാകുക,” “ആയുധധാരികളായി പുറപ്പെടുക,” അല്ലെങ്കിൽ “സൈന്യത്തിനായി സജ്ജരാകുക” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് യുദ്ധത്തിനായി ആയുധം ധരിക്കുകയോ യുദ്ധത്തിനു സജ്ജരാകുകയോ എന്ന സൈനിക അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: മോശ അവരോടു പറഞ്ഞു
  rationale: എബ്രായ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: നിങ്ങൾ ഈ കാര്യം ചെയ്യുകയും
  rationale: דָּבָר ഇവിടെ മുമ്പ് ഉന്നയിച്ച നിർദേശത്തെയോ പ്രതിജ്ഞയെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഈ കാര്യം’ യോജിക്കുന്നു. ആവർത്തിച്ചുള്ള אִם ഘടന മലയാളത്തിൽ ഏകോപിത നിബന്ധനയായി സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: אִם תֵּחָלְצוּ
  choice: ആയുധമണിയുകയും ചെയ്താൽ
  rationale: חלץ എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിന് ഈ സൈനികസന്ദർഭത്തിൽ യുദ്ധത്തിനായി ആയുധസജ്ജരാകുക എന്ന അർഥമുണ്ട്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യാർഥം വ്യക്തമായി നിലനിർത്തുകയും ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധത്തിനായി
  rationale: സൈനികലക്ഷ്യം സൂചിപ്പിക്കുന്ന לְ ഉപസർഗവും מִלְחָמָה എന്ന നാമവും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: לִפְנֵי יהוה എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യഹോവയുടെ സന്നിധിയിൽ
  alternative: യഹോവയുടെ മുമ്പാകെ
  rationale: അവരുടെ സൈനികപ്രവർത്തനം യഹോവയുടെ സാന്നിധ്യത്തിൽ നടക്കുന്നു എന്ന ആശയം സൂക്ഷിക്കുന്നു; അധികമായി ‘അധികാരത്തിൻ കീഴിൽ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്ന നിബന്ധനയായതിനാൽ അവസാനത്തിൽ അർധവിരാമഭാവമുള്ള കോമ നിലനിർത്തി.
