source:
  edition: WLC
  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: ml
  text: മനശ്ശെയുടെ മകനായ യായീർ ചെന്നു അവരുടെ ഗ്രാമങ്ങൾ[a] പിടിച്ചടക്കി; അവയ്ക്ക് ഹവ്വോത്ത്-യായീർ എന്നു പേരിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹവ്വോത്ത്-യായീർ എന്ന പേരിന്റെ അർഥം ‘യായീറിന്റെ ഗ്രാമങ്ങൾ’ അല്ലെങ്കിൽ ‘യായീറിന്റെ കുടിയിരിപ്പുകൾ’ എന്നാണ്.
    reason: സ്ഥലനാമത്തിന്റെ അർഥവും חַוּוֹת എന്ന പദത്തിന്റെ സാധ്യമായ പദവികൽപ്പവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: יָאִיר
  choice: യായീർ
  rationale: വ്യക്തിനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണമായി നൽകി.
- source_word: בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ
  rationale: ‘മനശ്ശെയുടെ മകൻ’ എന്ന ഹീബ്രു ഘടന നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭം അനുവദിച്ചേക്കാവുന്ന ‘വംശജനായ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: הָלַךְ
  choice: ചെന്നു
  rationale: ആഖ്യാനക്രമത്തിൽ സ്വാഭാവികമായ മലയാള പ്രയോഗം; ദിശയോ പ്രത്യേക ഉദ്ദേശ്യമോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: וַיִּלְכֹּד
  choice: പിടിച്ചടക്കി
  rationale: സൈനിക-പ്രദേശീയ പശ്ചാത്തലത്തിൽ പിടിച്ചെടുക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: חַוֺּתֵיהֶם
  choice: അവരുടെ ഗ്രാമങ്ങൾ
  rationale: ചെറിയ ഗ്രാമങ്ങളെയോ കുടിയിരിപ്പുകളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമാനപദം; ‘അവരുടെ’ എന്ന അവ്യക്ത സൂചന മൂലപാഠംപോലെ നിലനിർത്തി.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: അവയ്ക്ക് … എന്നു പേരിട്ടു
  rationale: ഇവിടെ קרא നാമകരണം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘പേരിട്ടു’ എന്നു നൽകി.
- source_word: חַוֺּת יָאִיר
  choice: ഹവ്വോത്ത്-യായീർ
  rationale: സ്ഥലനാമമായതിനാൽ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങളോട് ചേർത്ത് ലിപ്യന്തരണം ചെയ്തു; മൂലപാഠത്തിലെ ബന്ധസൂചനകളിലെ അവ്യക്തത പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
