source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഗാദിന്റെ പുത്രന്മാർക്കും[a] രൂബേന്റെ പുത്രന്മാർക്കും യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പാതിഗോത്രത്തിനും അമോര്യരുടെ രാജാവായ സീഹോന്റെ രാജ്യവും ബാശാൻ രാജാവായ ഓഗിന്റെ രാജ്യവും—ആ ദേശവും അതിലെ പട്ടണങ്ങളും, അതിർത്തിപ്രദേശങ്ങളിലെ ചുറ്റുമുള്ള ദേശത്തിലെ പട്ടണങ്ങളും—കൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അവസാനഭാഗം ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: “ആ ദേശവും അതിലെ പട്ടണങ്ങളും അവയുടെ പ്രദേശങ്ങളോടുകൂടെ, ചുറ്റുമുള്ള ദേശത്തിലെ പട്ടണങ്ങളും.” ഹീബ്രു വാക്യഭാഗം വ്യാകരണപരമായി സങ്കുചിതമായതിനാൽ അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം പരിഭാഷകൾ സാധ്യമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: ഭൂപ്രദേശം നൽകുകയോ ഏൽപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന נתן എന്ന ക്രിയയുടെ നേരിട്ടുള്ള, സ്വാഭാവികമായ ആഖ്യാനപരിഭാഷ.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ പുത്രന്മാർക്കും ... രൂബേന്റെ പുത്രന്മാർക്കും
  rationale: בְּנֵי എന്ന കുടുംബ-ഗോത്ര പ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה בֶן יוֹסֵף
  choice: യോസേഫിന്റെ മകനായ മനശ്ശെയുടെ പാതിഗോത്രത്തിനും
  rationale: മനശ്ശെയെ യോസേഫിന്റെ മകനായി തിരിച്ചറിയിക്കുന്ന വംശാവലിവിവരവും ‘പാതിഗോത്രം’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: מַמְלֶכֶת
  choice: രാജ്യം
  rationale: സീഹോനും ഓഗും ഭരിച്ചിരുന്ന രാജഭൂപ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്ന ממלכה എന്ന പദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ സീഹോൻ
  rationale: ഹീബ്രു വിശേഷണഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ജനവിഭാഗത്തെ ബഹുവചനത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻ രാജാവായ ഓഗ്
  rationale: പേരും രാജപദവിയും ഉൾക്കൊള്ളുന്ന മൂലഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: הָאָרֶץ לְעָרֶיהָ בִּגְבֻלֹת עָרֵי הָאָרֶץ סָבִיב
  choice: ആ ദേശവും അതിലെ പട്ടണങ്ങളും അവയുടെ അതിരുകൾക്കുള്ളിലുള്ള ചുറ്റുമുള്ള ദേശത്തിലെ പട്ടണങ്ങളും
  rationale: അവസാനത്തെ ഹീബ്രു പ്രയോഗം വ്യാകരണപരമായി സങ്കുചിതമായതിനാൽ, ദേശം, അതിലെ പട്ടണങ്ങൾ, അതിരുകൾ, ചുറ്റുമുള്ള ദേശത്തിലെ പട്ടണങ്ങൾ എന്നീ ഘടകങ്ങളെ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; സാധ്യതയുള്ള മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ആഖ്യാനശൈലി. ഗോത്രപരമായ കുടുംബപ്രയോഗം നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു. മൂലഹീബ്രുവിലെ സങ്കുചിതമായ അവസാനഘടനയിലെ യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
