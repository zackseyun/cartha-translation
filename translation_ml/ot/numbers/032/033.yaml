  source_fidelity: പ്രധാന വിവർത്തനം രാജ്യങ്ങൾ, സ്വീകർത്താക്കൾ, രാജാക്കന്മാർ, ദേശം, പട്ടണങ്ങൾ എന്നിവ വിശ്വസ്തമായി നൽകുന്നു. എന്നാൽ അവസാനത്തെ സങ്കുചിതമായ ഹീബ്രു ഘടനയിൽ നിലവിലെ “അവയുടെ അതിരുകൾക്കുള്ളിലുള്ള” എന്ന പ്രയോഗം പട്ടണങ്ങൾ സ്വന്തം അതിരുകൾക്കുള്ളിലാണെന്ന അസ്വാഭാവികവും അനാവശ്യവുമായ അർഥം സൃഷ്ടിക്കുന്നു. בִּגְבֻלֹת എന്ന ബഹുവചനത്തെ ‘പ്രദേശങ്ങൾ/അതിർത്തിപ്രദേശങ്ങൾ’ എന്ന തുറന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നതാണ് സുരക്ഷിതം.
  naturalness: ‘അവയുടെ അതിരുകൾക്കുള്ളിലുള്ള ചുറ്റുമുള്ള ദേശത്തിലെ പട്ടണങ്ങളും’ എന്ന വാചകഭാഗം ആധുനിക നിലവാരമലയാളത്തിൽ ഘടനാപരമായി ഭാരമുള്ളതും പരാമർശം വ്യക്തമല്ലാത്തതുമാണ്. ഡാഷുകൾ ഉപയോഗിച്ച് സങ്കുചിത ഘടന സംരക്ഷിക്കുകയും ‘അതിർത്തിപ്രദേശങ്ങളിലെ’ എന്ന് പറയുകയും ചെയ്താൽ വായന സുഗമമാകും.
  terminology: ‘മോശെ,’ ‘ഗാദ്,’ ‘രൂബേൻ,’ ‘മനശ്ശെ,’ ‘സീഹോൻ,’ ‘ഓഗ്,’ ‘അമോര്യർ,’ ‘ബാശാൻ,’ ‘പാതിഗോത്രം,’ ‘രാജ്യം’ എന്നിവ ഉചിതവും സ്ഥിരതയുള്ളതുമാണ്. ‘പുത്രന്മാർ’ മൂലത്തിലെ കുടുംബ/ഗോത്രപ്രയോഗം യോജ്യമായി സംരക്ഷിക്കുന്നു.
