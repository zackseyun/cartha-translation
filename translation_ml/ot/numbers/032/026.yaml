source:
  edition: WLC
  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: ml
  text: ഞങ്ങളുടെ കൊച്ചുകുട്ടികളും[a], ഭാര്യമാരും, കന്നുകാലികളും, എല്ലാ മൃഗങ്ങളും ഗിലെയാദിലെ പട്ടണങ്ങളിൽത്തന്നെ തങ്ങും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞങ്ങളുടെ കുട്ടികൾ.’ എബ്രായ പദമായ טַף വിശേഷിച്ച് ചെറിയവരെയോ ആശ്രിതരായ കുട്ടികളെയോ സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവിടെ ഉണ്ടായിരിക്കും.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘ഉണ്ടായിരിക്കും’ എന്നാണ്; എന്നാൽ മറ്റുള്ളവർ യുദ്ധത്തിനു പോകുമ്പോൾ ഇവർ അവിടെത്തന്നെ തുടരുന്നതാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: ഞങ്ങളുടെ കൊച്ചുകുട്ടികൾ
  rationale: טַף സാധാരണയായി ചെറിയവരെയോ ആശ്രിതരായ കുട്ടികളെയോ സൂചിപ്പിക്കുന്നു. ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കൊച്ചുകുട്ടികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נָשֵׁינוּ
  choice: ഞങ്ങളുടെ ഭാര്യമാർ
  rationale: കുടുംബ-ഗോത്ര പശ്ചാത്തലത്തിൽ സ്ത്രീകളെ പൊതുവായി അല്ല, സംസാരിക്കുന്നവരുടെ ഭാര്യമാരെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: מִקְנֵנוּ
  choice: ഞങ്ങളുടെ കന്നുകാലികൾ
  rationale: מִקְנֶה ആടുമാടുകൾ ഉൾപ്പെടെയുള്ള ഉടമസ്ഥതയിലുള്ള മൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ പൊതുവായും സ്വാഭാവികമായും ആ ആശയം നൽകുന്നു.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: ഞങ്ങളുടെ മൃഗങ്ങളെല്ലാം
  rationale: בְּהֵמָה വളർത്തുമൃഗങ്ങൾ ഉൾപ്പെടെയുള്ള മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലപദമാണ്. മുമ്പുള്ള מִקְנֶהയുമായുള്ള ഉറവിടത്തിലെ ഭാഗിക ആവർത്തനം ഇല്ലാതാക്കാതെ ‘മൃഗങ്ങളെല്ലാം’ എന്നു നൽകി.
- source_word: יִהְיוּ שָׁם
  choice: അവിടെത്തന്നെ തങ്ങും
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘അവിടെ ഉണ്ടായിരിക്കും’ എന്നാണെങ്കിലും, പുരുഷന്മാർ യുദ്ധത്തിനു പോകുമ്പോൾ കുടുംബങ്ങളും മൃഗങ്ങളും പിന്നിൽ തുടരുന്നതാണ് സന്ദർഭാർഥം. ‘അവിടെത്തന്നെ തങ്ങും’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: ഗിലെയാദിലെ പട്ടണങ്ങളിൽ
  rationale: עָרִים എന്നത് ഈ പ്രദേശിക സന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം; ഗിലെയാദ് പ്രദേശനാമമായി ലിപ്യന്തരിച്ചു.
