translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പട്ടികയിലെ ആവർത്തനം ഉറവിടത്തിൽ ഉള്ളതിനാൽ ‘കന്നുകാലികൾ’ എന്നും ‘മൃഗങ്ങളെല്ലാം’ എന്നും വേർതിരിച്ചു നിലനിർത്തി; ഉറവിടത്തിലില്ലാത്ത ‘മറ്റു’ എന്ന പദം ചേർത്തിട്ടില്ല. ക്രിയയോടു ബന്ധപ്പെട്ട [b] അടിക്കുറിപ്പ് അതിന്റെ യുക്തമായ സ്ഥാനമായ ‘തങ്ങും’ എന്നതിന് പിന്നാലെ വെച്ചു.
