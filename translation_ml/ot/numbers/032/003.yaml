translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്ഥലനാമങ്ങൾ അർത്ഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു. ഹീബ്രുവിലെ പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമായി കോമകളാൽ ക്രമപ്പെടുത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട നാമങ്ങളിൽ നിന്ന് മാറിയതായി തോന്നുന്നതിനാൽ, [a] സെബാമിനോടും [b] ബെഓനിനോടും ചേർത്തു.
