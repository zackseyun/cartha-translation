base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/003.yaml
  text: Ataroth[a], Dibon, Jazer, Nimrah, Heshbon, Elealeh, Sebam, Nebo[b], and Beon—
translation:
  language: ml
  text: അതാരോത്ത്, ദീബോൻ, യസേർ, നിമ്രാ, ഹെശ്ബോൻ, എലെയാലേ, സെബാം[a], നെബോ, ബെഓൻ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘സെബാം’; ഇതുമായി ബന്ധമുള്ള സ്ഥലനാമം മറ്റിടങ്ങളിൽ ‘സിബ്മാ’ അല്ലെങ്കിൽ ‘ശിബ്മാ’ എന്ന രൂപത്തിൽ കാണപ്പെടുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: ‘ബെഓൻ’; ഇതുമായി ബന്ധമുള്ള സ്ഥലനാമം മറ്റിടങ്ങളിൽ ‘ബാൽ-മെയോൻ’ എന്ന വിപുലരൂപത്തിൽ കാണപ്പെടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: അതാരോത്ത്
  rationale: സ്ഥലനാമം അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു രൂപത്തോട് ചേർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: דִיבֹן
  choice: ദീബോൻ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: יַעְזֵר
  choice: യസേർ
  rationale: ഹീബ്രുവിലെ യഅ്‌സേർ എന്ന ഉച്ചാരണത്തെ മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ രൂപത്തിൽ നൽകി.
- source_word: נִמְרָה
  choice: നിമ്രാ
  rationale: ഈ വാക്യത്തിലെ ഹ്രസ്വ സ്ഥലനാമരൂപം തന്നെയാണ് നിലനിർത്തിയത്; മറ്റിടങ്ങളിലെ ദീർഘരൂപവുമായി ഏകീകരിച്ചില്ല.
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ സ്ഥിരതയുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: אֶלְעָלֵה
  choice: എലെയാലേ
  rationale: ഹീബ്രു സ്വരക്രമം തിരിച്ചറിയാവുന്ന വിധത്തിൽ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: שְׂבָם
  choice: സെബാം
  rationale: ഈ വാക്യത്തിലെ ശിൻ/സിൻ അക്ഷരം ‘സ്’ ശബ്ദമുള്ളതും പാഠരൂപം സെബാം എന്നതിനെ നേരിട്ട് പിന്തുണയ്ക്കുന്നതുമാണ്; മറ്റിടങ്ങളിലെ സിബ്മാ/ശിബ്മാ എന്ന ബന്ധമുള്ള രൂപവുമായി ഏകീകരിച്ചില്ല.
- source_word: נְבוֹ
  choice: നെബോ
  rationale: ഹീബ്രു സ്ഥലനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: בְּעֹן
  choice: ബെഓൻ
  rationale: ഈ വാക്യത്തിൽ കാണുന്ന സംക്ഷിപ്ത സ്ഥലനാമരൂപം നേരിട്ട് ലിപ്യന്തരിച്ചു; മറ്റിടങ്ങളിലെ ബാൽ-മെയോൻ എന്ന വിപുലരൂപം പാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
- source_word: וְ / וּ
  choice: പട്ടികയിലെ കോമകളും അവസാന നാമത്തിനു മുമ്പുള്ള ബന്ധക്രമവും
  rationale: ഓരോ നാമത്തിനുമുമ്പും ‘ഉം/യും’ ആവർത്തിക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ, ഹീബ്രു പട്ടികയുടെ ക്രമം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള പട്ടികാശൈലി സ്വീകരിച്ചു.
