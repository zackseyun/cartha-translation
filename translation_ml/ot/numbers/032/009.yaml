id: NUM.32.9
reference: Numbers 32:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: ml
  text: അവർ എശ്കോൽ താഴ്വരവരെ കയറിച്ചെന്ന് ദേശം കണ്ടു. യഹ്‌വെ[c] അവർക്കു നൽകിയിരുന്ന ആ ദേശത്തേക്കു കടക്കുന്നതിൽനിന്ന് ഇസ്രായേൽമക്കളുടെ[a] ഹൃദയം അവർ പിന്തിരിപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇസ്രായേല്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്നാണ്; ഇത് ജനതയെ സൂചിപ്പിക്കുന്ന പതിവുപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ മനസ്സുമടുപ്പിച്ചു’ അല്ലെങ്കിൽ ‘അവരെ നിരുത്സാഹപ്പെടുത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഹീബ്രുവിൽ יהוה (YHWH) എന്ന ദൈവനാമമാണ്. അതിന്റെ സാധ്യതയുള്ള ഉച്ചാരണം ‘യഹ്‌വെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: അവർ കയറിച്ചെന്ന്
  rationale: עלה എന്ന ക്രിയയുടെ ദിശാസൂചനയായ ‘മുകളിലേക്കു പോകുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: എശ്കോൽ താഴ്വരവരെ
  rationale: עַד എന്നതിന്റെ പരിധിസൂചന ‘വരെ’ എന്നും, נַחַל എന്നതിന്റെ ഈ സ്ഥലനാമസന്ദർഭത്തിലെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന ‘താഴ്വര’ എന്നും നൽകി.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: ദേശṁ കണ്ടു
  rationale: ראה എന്ന സാധാരണ ക്രിയയെ അതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കണ്ടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: וַיָּנִיאוּ
  choice: പിന്തിരിപ്പിച്ചു
  rationale: ഹിഫീൽ രൂപം ഇവിടെ മറ്റുള്ളവരുടെ മനസ്സിനെ പ്രവേശനത്തിൽനിന്ന് അകറ്റുകയോ മടിപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിന്തിരിപ്പിച്ചു’ കാരണാർഥവും സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഹൃദയം
  rationale: ഹീബ്രുവിലെ ഏകവചനമായ לֵב-ഉം ദേശീയ-ഉടമ്പടിപരമായ בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: ആ ദേശത്തേക്കു കടക്കുന്നതിൽനിന്ന്
  rationale: പ്രവേശിക്കാതിരിക്കാൻ ഇടയാക്കിയെന്ന നിരോധക/ഫലസൂചന മലയാളത്തിലെ ‘നിന്ന് ... പിന്തിരിപ്പിച്ചു’ എന്ന സ്വാഭാവിക ഘടനയിൽ നൽകുന്നു.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: യഹ്‌വെ അവർക്കു നൽകിയിരുന്ന
  rationale: נתן എന്ന പൂർണ്ണക്രിയയുടെ മുൻകാലബന്ധം ‘നൽകിയിരുന്ന’ എന്നു പ്രകടമാക്കുകയും יהוה എന്ന ദൈവനാമം ശബ്ദാന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം ഒരു പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്യുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണ്ണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ഇസ്രായേലിന്റെ ‘ഹൃദയം’ എന്ന ഏകവചന കൂട്ടായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കളുടെ ഹൃദയം
  alternative: ഇസ്രായേല്യരുടെ മനസ്സുകൾ / ഇസ്രായേൽമക്കളെ നിരുത്സാഹപ്പെടുത്തി
  rationale: ജനതയുടെ കൂട്ടായ ധൈര്യവും മനോനിശ്ചയവും സൂചിപ്പിക്കുന്ന ഹീബ്രു രൂപകം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം പിന്തിരിപ്പിച്ചു’ എന്ന മൂലരൂപകം നിലനിർത്തിയെങ്കിലും വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. സ്ഥലനാമം ‘എശ്കോൽ’ എന്നും ദൈവനാമം ‘യഹ്‌വെ’ എന്നും ശബ്ദാന്തരം ചെയ്തു.
