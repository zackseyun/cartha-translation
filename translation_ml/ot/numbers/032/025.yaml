id: NUM.32.25
reference: Numbers 32:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: ml
  text: 'അപ്പോൾ ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും മോശയോടു ഇങ്ങനെ പറഞ്ഞു: “അങ്ങയുടെ ദാസന്മാർ അങ്ങു കൽപിക്കുന്നതുപോലെതന്നെ ചെയ്യും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും
  rationale: ഗോത്രപിതാക്കന്മാരുടെ പേരുകളോടു ചേർന്ന ‘പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരിക രൂപം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവരുടെ ഗോത്രാംഗങ്ങളെയാണ്.
- source_word: לֵאמֹר
  choice: പ്രത്യേകമായി ആവർത്തിച്ചില്ല
  rationale: മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നതിനു പിന്നാലെ നേരിട്ടുള്ള ഉദ്ധരണി വരുമ്പോൾ ‘പറഞ്ഞുകൊണ്ട്/ഇങ്ങനെ പറഞ്ഞു’ എന്ന ആവർത്തനം അനാവശ്യവും അസ്വാഭാവികവുമാണ്; ആശയം നേരിട്ടുള്ള ഉദ്ധരണിയിലൂടെ വ്യക്തമാണ്.
- source_word: עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാർ
  rationale: മോശയോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശവും രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയും സംരക്ഷിക്കുന്നു.
- source_word: אֲדֹנִי
  choice: യജമാനൻ
  rationale: ഇത് മോശയെ അഭിസംബോധന ചെയ്യുന്ന ആദരസൂചക പദമാണ്; ദൈവനാമമോ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘കർത്താവ്’ എന്ന പദമോ അല്ല.
- source_word: כַּאֲשֶׁר ... מְצַוֶּה
  choice: കല്പിക്കുന്നതുപോലെതന്നെ
  rationale: ആജ്ഞയോടുള്ള കൃത്യമായ അനുസരണത്തെ സൂചിപ്പിക്കുന്ന താരതമ്യവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: אֲדֹנִי എന്ന അഭിസംബോധനയുടെ സൂചിതവ്യക്തി
  choice: മോശയെ സൂചിപ്പിക്കുന്ന ‘യജമാനൻ’
  alternative: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘കർത്താവ്’
  rationale: വാക്യഘടനയിൽ അവർ മോശയോടാണ് സംസാരിക്കുന്നത്; ഒന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയം ഉൾക്കൊള്ളുന്ന אֲדֹנִי ഒരു മനുഷ്യനോടുള്ള ആദരസൂചക അഭിസംബോധനയായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും വായിക്കാൻ സ്വാഭാവികവുമായ മലയാളം. ‘അങ്ങയുടെ’ എന്ന രൂപം പ്രസംഗസന്ദർഭത്തിലെ ബഹുമാനം നിലനിർത്തുന്നു; ഗോത്രനാമങ്ങളോടൊപ്പം ‘പുത്രന്മാർ’ എന്ന ബൈബിൾപരമായ ഔപചാരിക പ്രയോഗം സംരക്ഷിച്ചിരിക്കുന്നു.
