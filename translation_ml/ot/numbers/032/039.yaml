id: NUM.32.39
reference: Numbers 32:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: ml
  text: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ പുത്രന്മാർ ഗിലെയാദിലേക്കു ചെന്നു അതു പിടിച്ചെടുത്തു. അവിടെയുണ്ടായിരുന്ന അമോര്യരെ[b] അവർ അവിടെനിന്നു നീക്കിക്കളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ മുൻപുള്ള ബഹുവചന ക്രിയകൾക്കു ശേഷം ഇവിടെ ‘അവൻ നീക്കിക്കളഞ്ഞു’ എന്ന ഏകവചന ക്രിയയാണ്. ഇത് മാഖീർവംശത്തെ ഒരു കൂട്ടായ ഏകവചനമായി കാണുന്നതാകാം; അല്ലെങ്കിൽ പാഠത്തിലോ ശൈലിയിലോ ഉണ്ടായ മാറ്റമാകാം.
    reason: textual_variant
  - marker: b
    text: എബ്രായത്തിൽ ‘അമോര്യൻ’ എന്ന ഏകവചന ജനവിഭാഗനാമമാണ്; ഇവിടെ അത് അമോര്യ നിവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ചെന്നു
  rationale: הלך എന്ന സാധാരണ ആഖ്യാനക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലപാഠം ഉയരത്തിലേക്കുള്ള യാത്ര പ്രത്യേകം സൂചിപ്പിക്കുന്നില്ല.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ മാഖീരിന്റെ പുത്രന്മാർ
  rationale: בני എന്ന ബന്ധപദത്തിന്റെ ഔപചാരിക അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മാഖീരിന്റെ സന്തതികളെയോ വംശക്കാരെയോ കൂട്ടമായി സൂചിപ്പിക്കാം.
- source_word: גִּלְעָדָה
  choice: ഗിലെയാദിലേക്കു
  rationale: സ്ഥലത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന ദിശാസൂചക ה സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיִּלְכְּדֻהָ
  choice: അതു പിടിച്ചെടുത്തു
  rationale: לכד ഒരു പ്രദേശം സൈനികമായി കൈവശപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; 'പിടിച്ചെടുത്തു' ഈ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיּוֹרֶשׁ
  choice: അവർ അവിടെനിന്നു നീക്കിക്കളഞ്ഞു
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള ירש നിവാസികളെ അവരുടെ പ്രദേശത്തുനിന്നു ഒഴിപ്പിക്കുകയോ അവകാശം നഷ്ടപ്പെടുത്തുകയോ ചെയ്യുന്നതാണ്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിനായി മുൻപുള്ള ബഹുവചന കർത്താവ് വ്യക്തമാക്കിയിട്ടുണ്ട്; എബ്രായത്തിലെ ഏകവചന ക്രിയ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരെ
  rationale: എബ്രായത്തിൽ ഏകവചന ജനവിഭാഗനാമമാണെങ്കിലും ഇവിടെ അമോര്യ നിവാസികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲשֶׁר בָּהּ
  choice: അവിടെയുണ്ടായിരുന്ന
  rationale: ഗിലെയാദിൽ പാർത്തിരുന്ന ജനങ്ങളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. പേരുകൾ മലയാള ബൈബിൾ പ്രയോഗങ്ങളോട് ചേർന്ന രൂപത്തിൽ ലിപ്യന്തരിച്ചു. എബ്രായത്തിലെ അപ്രതീക്ഷിത ഏകവചന ക്രിയ മലയാള മുഖ്യവാക്യത്തിൽ കൃത്രിമമായ അവ്യക്തത സൃഷ്ടിക്കാതെയും അടിക്കുറിപ്പിൽ പാഠസവിശേഷത തുറന്നുവെച്ചും അവതരിപ്പിച്ചു.
