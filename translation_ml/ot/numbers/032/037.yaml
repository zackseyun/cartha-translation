source:
  edition: WLC
  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: ml
  text: രൂബേന്റെ പുത്രന്മാർ ഹെശ്ബോൻ[a], എലെയാലേ, കിര്യാത്തയീം എന്നിവ പണിതു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “രൂബേന്യർ ഹെശ്ബോൻ, എലെയാലേ, കിര്യാത്തയീം എന്നിവ പണിതു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: בְנֵי എന്നതിന്റെ അക്ഷരാർഥമായ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുകയും ഗോത്രവംശപരമായ ഊന്നൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു. സ്വാഭാവികമായ മറ്റൊരു രൂപം ‘രൂബേന്യർ’ എന്നാണ്.
- source_word: בָּנוּ
  choice: പണിതു
  rationale: בנה എന്ന ക്രിയയുടെ ഖാൽ പൂർണരൂപത്തിന്റെ അടിസ്ഥാനാർഥം ‘പണിതു’ എന്നാണ്. ഇവിടെ പട്ടണങ്ങൾ പുനർനിർമിച്ചു എന്ന ആശയം സന്ദർഭത്തിൽ സാധ്യമായിരുന്നാലും, മൂലപാഠം അത് വ്യക്തമായി പറയാത്തതിനാൽ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: אֶת
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: നിശ്ചിത കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണിത്; മലയാളത്തിൽ ഇതിന് വേറിട്ടൊരു പദം ആവശ്യമില്ല.
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ കഴിയുന്നത്ര സുതാര്യമായി ലിപ്യന്തരിച്ചു.
- source_word: אֶלְעָלֵא
  choice: എലെയാലെ
  rationale: മസോററ്റിക് സ്വരീകരണത്തെ പ്രതിഫലിപ്പിക്കുന്ന എബ്രായ സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: קִרְיָתָיִם
  choice: കിര്യാത്തയീം
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദഘടന, പ്രത്യേകിച്ച് അവസാനത്തെ ദ്വിവചനസദൃശമായ -യീം രൂപം, തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘രൂബേന്റെ പുത്രന്മാർ’ എന്നത് എബ്രായ പ്രയോഗത്തിന്റെ വംശപരമായ രൂപം നിലനിർത്തുന്നു; പട്ടികയിൽ അവസാന നാമത്തിനു ശേഷം ‘എന്നിവ’ ചേർത്തത് മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കാണ്. സ്ഥലനാമങ്ങൾ മൂല എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
