source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: ml
  text: നിങ്ങളിൽ ആയുധമണിഞ്ഞ ഓരോരുത്തനും യഹോവയുടെ മുമ്പാകെ യോർദ്ദാൻ കടന്നുപോകണം; അവൻ തന്റെ ശത്രുക്കളെ തന്റെ മുമ്പിൽനിന്ന് പുറത്താക്കുന്നതുവരെ[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുറത്താക്കുക’ എന്നതിന് ‘അവകാശം നഷ്ടപ്പെടുത്തി പുറത്താക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ‘ഓടിച്ചുകളയുക’ എന്നും ‘കൈവശം നഷ്ടപ്പെടുത്തി പുറത്താക്കുക’ എന്നും അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവൻ തന്റെ ശത്രുക്കളെ തന്റെ മുമ്പിൽനിന്ന്’ എന്നതിലെ സർവനാമങ്ങൾ ഏറ്റവും സ്വാഭാവികമായി യഹോവയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അവ ഇസ്രായേലിനെയോ അതിന്റെ യുദ്ധസേനയെയോ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: കടക്കുകയും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച നിബന്ധനയുടെ തുടർച്ചയായതിനാൽ ഭാവിയിലേക്കുള്ള നിബന്ധനാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന ബന്ധക്രിയാരൂപം സ്വീകരിച്ചു.
- source_word: לָכֶם כָּל חָלוּץ
  choice: നിങ്ങളിൽ ആയുധമണിഞ്ഞ ഓരോരുത്തനും
  rationale: לָכֶם എന്ന ബന്ധത്തെ ‘നിങ്ങളിൽ’ എന്നും חָלוּץ എന്ന യുദ്ധസജ്ജതയെ ‘ആയുധമണിഞ്ഞ’ എന്നും നൽകി; כָּל എന്നതിന്റെ വിതരണാത്മക ഏകവചനഭാവം ‘ഓരോരുത്തനും’ നിലനിർത്തുന്നു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള ഭൂമിശാസ്ത്രനാമം; ‘നദി’ ചേർക്കേണ്ട ആവശ്യമില്ല.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ മുമ്പാകെ
  rationale: לִפְנֵי എന്ന സാന്നിധ്യ/മുമ്പിലുള്ള അർഥവും വെളിപ്പെടുത്തപ്പെട്ട ദൈവനാമമായ יְהוָהയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: പ്രവർത്തനത്തിന്റെ കാലപരിധി സൂചിപ്പിക്കുന്ന ലളിതമായ മലയാള സമാനപദം.
- source_word: הוֹרִישׁוֹ
  choice: അവൻ ... നീക്കിക്കളയുന്നതുവരെ
  rationale: ഹിഫീൽ രൂപത്തിന് ഇവിടെ ‘പുറത്താക്കുക/കൈവശത്തിൽനിന്ന് നീക്കുക’ എന്ന അർഥമുണ്ട്. ‘നീക്കിക്കളയുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; കർത്താവിനെ സൂചിപ്പിക്കുന്ന പുരുഷപ്രത്യയം ‘അവൻ’ എന്നു പ്രകടമാക്കി.
- source_word: אֹיְבָיו מִפָּנָיו
  choice: തന്റെ ശത്രുക്കളെ തന്റെ മുമ്പിൽനിന്ന്
  rationale: രണ്ടു മൂന്നാംപുരുഷ ഏകവചന സർവനാമങ്ങളുടെയും പരസ്പരബന്ധവും מִפָּנָיו എന്ന എബ്രായ സാന്നിധ്യപ്രയോഗവും കഴിയുന്നത്ര നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ നിയമനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- issue: הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו എന്നിവയിലെ മൂന്നാംപുരുഷ ഏകവചനത്തിന്റെ സൂചിതൻ
  choice: യഹോവയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ ‘അവൻ/തന്റെ’ ഉപയോഗിച്ചു
  alternative: ഇസ്രായേലിനെയോ ആയുധധാരികളായ സൈന്യത്തെയോ കൂട്ടായ ഏകവചനമായി സൂചിപ്പിക്കുന്നു
  rationale: ‘യഹോവയുടെ മുമ്പാകെ’ എന്ന തൊട്ടുമുൻപുള്ള പ്രയോഗവും ശത്രുക്കളെ യഹോവ നീക്കിക്കളയുന്നു എന്ന ജയകഥനരീതിയും യഹോവയെ സൂചിതനാക്കുന്ന വായനയെ കൂടുതൽ സ്വാഭാവികമാക്കുന്നു; എങ്കിലും വ്യാകരണപരമായ മറുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച നിബന്ധനയുടെ ഭാഗമായതിനാൽ അവസാനത്തിൽ അപൂർണത സൂചിപ്പിക്കുന്ന വിരാമചിഹ്നം നിലനിർത്തി. ‘യഹോവയുടെ മുമ്പാകെ’ എന്നത് എബ്രായത്തിലെ സാന്നിധ്യഭാവം സംരക്ഷിക്കുമ്പോൾ സാധാരണ വായനക്കാർക്കും ഗ്രാഹ്യമാണ്.
