  source_fidelity: 'എബ്രായവാക്യത്തിലെ ക്രമവും പ്രധാന അർഥഘടകങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: നോബഹിന്റെ യാത്ര, കെനാത്തിന്റെയും അതിന്റെ ആശ്രിത കുടിയിരിപ്പുകളുടെയും പിടിച്ചടക്കൽ, സ്വന്തം പേരിനെ ആസ്പദമാക്കിയുള്ള നഗരനാമകരണം എന്നിവയെല്ലാം ഉൾപ്പെട്ടിരിക്കുന്നു. בנותיהָ എന്ന പ്രയോഗത്തിന്റെ സ്ഥലനാമ-ഭരണസന്ദർഭത്തിലുള്ള അർഥം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും യോജ്യമായി നൽകിയിട്ടുണ്ട്.'
