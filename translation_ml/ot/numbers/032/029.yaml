id: NUM.32.29
reference: Numbers 32:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: ml
  text: 'മോശ അവരോടു പറഞ്ഞു: “ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും—യുദ്ധത്തിനായി ആയുധസജ്ജരായ എല്ലാവരും—യഹ്‌വെയുടെ സന്നിധിയിൽ നിങ്ങളോടൊപ്പം യോർദ്ദാൻ കടക്കുകയും ദേശം നിങ്ങളുടെ മുമ്പിൽ കീഴടക്കപ്പെടുകയും ചെയ്താൽ, നിങ്ങൾ ഗിലെയാദ് ദേശം അവർക്കു അവകാശമായി കൊടുക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: പറഞ്ഞു
  rationale: ഹീബ്രായ ആഖ്യാനത്തിലെ സാധാരണ wayyiqtol രൂപം; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനതുടർച്ച നൽകുന്നു.
- source_word: אִם
  choice: ചെയ്താൽ
  rationale: ഭൂമി നൽകുന്നതിനുള്ള യഥാർഥ വ്യവസ്ഥയെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും
  rationale: ഗോത്രപരമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രായത്തിലെ ഔപചാരിക ‘പുത്രന്മാർ’ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ കടക്കുകയും
  rationale: עבר എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: אִתְּכֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: സഹഗമനം ലളിതമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: യുദ്ധത്തിനു സന്നദ്ധരായ എല്ലാവരും
  rationale: חָלוּץ എന്നത് യുദ്ധത്തിനായി ആയുധധാരികളായി അണിനിരന്നവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ സൈനികസജ്ജത അറിയിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നടത്തുന്ന ദൗത്യം എന്ന ഉടമ്പടിപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുനാമത്തെ ഒരു പദവിയാൽ പകരാതെ, ഹീബ്രായ ചതുരക്ഷരനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: ദേശം ... കീഴടക്കപ്പെടുകയും
  rationale: כבש എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള കർമണിപ്രയോഗവും ദേശം നിയന്ത്രണത്തിലാകുന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: לִפְנֵיכֶם
  choice: നിങ്ങളുടെ മുമ്പിൽ
  rationale: ഇസ്രായേലിന്റെ മുന്നേറ്റത്തിനു മുമ്പിൽ ദേശം കീഴടക്കപ്പെടുന്നു എന്ന ഹീബ്രായ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וּנְתַתֶּם לָהֶם ... לַאֲחֻזָּה
  choice: നിങ്ങൾ ... അവർക്കു അവകാശമായി കൊടുക്കണം
  rationale: വ്യവസ്ഥ നിറവേറിയശേഷമുള്ള നിർബന്ധിത ഫലവും אֲחֻזָּה എന്ന സ്ഥിരാവകാശത്തിന്റെ ആശയവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം തന്നെയാണുള്ളത്; അതിനെ പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: לִפְנֵי יְהוָה എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വെയുടെ മുമ്പാകെ
  rationale: ഇത് വെറും സ്ഥലസൂചന മാത്രമല്ലാതെ ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും അധികാരത്തിലും നടക്കുന്ന യുദ്ധദൗത്യത്തെ സൂചിപ്പിക്കാം; ‘സന്നിധിയിൽ’ ഈ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. ഗോത്രപരമായ ‘പുത്രന്മാർ’ എന്ന ഔപചാരിക രൂപം നിലനിർത്തിയപ്പോൾ, സൈനികപ്രയോഗം സ്വാഭാവികമാക്കാൻ ‘യുദ്ധത്തിനു സന്നദ്ധരായ’ എന്നു നൽകി. നീണ്ട വ്യവസ്ഥാവാക്യത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു.
