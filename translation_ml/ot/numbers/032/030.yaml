revisions:
- from: എന്നാൽ അവർ ആയുധധാരികളായി നിങ്ങളോടൊപ്പം അക്കരെ കടക്കുന്നില്ലെങ്കിൽ, കനാൻദേശത്ത് നിങ്ങളുടെ ഇടയിൽ അവർക്ക് അവകാശം ലഭിക്കണം.[a]
  to: എന്നാൽ അവർ ആയുധധാരികളായി നിങ്ങളോടൊപ്പം അക്കരെ കടക്കുന്നില്ലെങ്കിൽ, കനാൻദേശത്ത് നിങ്ങളുടെ ഇടയിൽ അവർക്ക് അവകാശഭൂമി ലഭിക്കും.[a]
  rationale: The revision changes only the modal force of the consequence from obligation to future outcome and specifies that the possession is land. The footnote preserves the Hebrew verb's alternative nuance without adding permanence or obligation.
