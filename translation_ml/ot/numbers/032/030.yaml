reference: Numbers 32:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: ml
  text: എന്നാൽ അവർ ആയുധധാരികളായി നിങ്ങളോടൊപ്പം അക്കരെ കടക്കുന്നില്ലെങ്കിൽ, കനാൻദേശത്ത് നിങ്ങളുടെ ഇടയിൽ അവർക്ക് അവകാശഭൂമി ലഭിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കനാൻദേശത്ത് നിങ്ങളുടെ ഇടയിൽ അവർ ഒരു അവകാശഭൂമിയിൽ സ്ഥാപിക്കപ്പെടും.” എബ്രായ ക്രിയയ്ക്ക് അവകാശഭൂമി ലഭിക്കുക എന്ന അർഥത്തിനുപുറമേ, അതിൽ സ്ഥാപിക്കപ്പെടുക എന്ന അർഥവും വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വ്യവസ്ഥയ്ക്കു വിപരീതമായ സാധ്യത അവതരിപ്പിക്കുന്നതിനാൽ, സന്ദർഭത്തിലെ വിരുദ്ധഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יַעַבְרוּ
  choice: അക്കരെ കടക്കുക
  rationale: യോർദ്ദാൻ കടന്ന് കനാനിലേക്കു പോകുന്നതെന്ന ഭൂമിശാസ്ത്രപരമായ സന്ദർഭം ‘അക്കരെ കടക്കുക’ എന്ന പ്രയോഗം വ്യക്തമായി നൽകുന്നു.
- source_word: חֲלוּצִים
  choice: ആയുധധാരികളായി
  rationale: യുദ്ധത്തിനായി ആയുധമണിഞ്ഞോ സജ്ജരായോ മുന്നേറുന്ന അവസ്ഥയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: אִתְּ/כֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: മറ്റു ഇസ്രായേല്യരോടൊപ്പമുള്ള കടന്നുപോകലിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: וְ/נֹאחֲזוּ
  choice: അവർക്ക് അവകാശം ലഭിക്കണം
  rationale: നിഫാൽ രൂപം ഭൂസ്വത്തിൽ സ്ഥാപിക്കപ്പെടുക, അവകാശം ലഭിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു; ഭൂവിഭജനസന്ദർഭത്തിൽ നിർജ്ജീവ ഫലഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണിത്.
- source_word: בְ/תֹכְ/כֶם
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സമൂഹത്തിനുള്ളിൽ എന്ന സ്ഥാനബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: എബ്രായത്തിലെ പൂർണ ഭൂമിശാസ്ത്രനാമം സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
