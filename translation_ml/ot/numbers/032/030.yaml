translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വ്യവസ്ഥയുടെ വിരുദ്ധഭാവവും ഭൂവിഭജനസന്ദർഭവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; എബ്രായ ക്രിയയിലെ ‘അവകാശം ലഭിക്കൽ/അവകാശത്തിൽ സ്ഥാപിക്കപ്പെടൽ’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
