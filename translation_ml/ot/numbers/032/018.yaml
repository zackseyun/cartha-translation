  language: ml
  text: ഇസ്രായേൽപുത്രന്മാർ[a] ഓരോരുത്തരും അവരവരുടെ അവകാശഭൂമി കൈവശമാക്കുന്നതുവരെ ഞങ്ങൾ ഞങ്ങളുടെ വീടുകളിലേക്കു മടങ്ങുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
