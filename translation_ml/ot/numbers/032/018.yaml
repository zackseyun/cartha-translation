    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: ഞങ്ങൾ ... മടങ്ങുകയില്ല
  rationale: നിഷേധത്തോടുകൂടിയ ഒന്നാംപുരുഷ ബഹുവചന അപൂർണക്രിയ സന്ദർഭത്തിൽ ഭാവിയിലെ ഉറച്ച പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: אֶל בָּתֵּינוּ
  choice: ഞങ്ങളുടെ വീടുകളിലേക്ക്
  rationale: ദിശാസൂചകമായ אֶל എന്നതും ‘ഞങ്ങളുടെ വീടുകൾ’ എന്ന ബഹുവചനരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: עַד
  choice: വരെ
  rationale: മടങ്ങാതിരിക്കുന്നതിന്റെ സമയപരിധി വ്യക്തമാക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: הִתְנַחֵל
  choice: കൈവശമാക്കുന്നതു
  rationale: നിശ്ചയിച്ചുകിട്ടുന്ന അവകാശഭൂമിയിൽ പ്രവേശിച്ച് അതു സ്വന്തമായി കൈവശപ്പെടുത്തുക എന്ന ഹിത്പയേൽ ക്രിയയുടെ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പദശഃ കുടുംബബന്ധപരവും പുരുഷലിംഗ ബഹുവചനവുമായ പ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אִישׁ נַחֲלָתוֹ
  choice: ഓരോരുത്തരും അവരവരുടെ അവകാശഭൂമി
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥം ‘ഓരോരുത്തരും’ എന്നും, ഓരോ വ്യക്തിക്കും നിശ്ചയിച്ച ഭൂവിഹിതം എന്ന נַחֲלָתוֹയുടെ അർഥം ‘അവരവരുടെ അവകാശഭൂമി’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധമായ ലിംഗസൂചക കുടുംബപ്രയോഗം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപവും കുടുംബബന്ധഭാവവും പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുന്നു; സാധാരണ സമുദായനാമം അടിക്കുറിപ്പിൽ പകരമായി നൽകുന്നു.
- issue: נַחֲלָה എന്നതിന്റെ ഭൂവിഹിതസംബന്ധമായ അർഥം
  choice: അവകാശഭൂമി
  alternative: അവകാശം
  rationale: ഇവിടെ വിഷയം ഗോത്രങ്ങൾക്കും കുടുംബങ്ങൾക്കും ലഭിക്കുന്ന ദേശവിഹിതമായതിനാൽ, അമൂർത്തമായ ‘അവകാശം’ എന്നതിനെക്കാൾ ഭൂമിസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവരവരുടെ’ എന്ന വിതരണപ്രയോഗം എബ്രായത്തിലെ אִישׁ ... נַחֲלָתוֹ എന്ന ആശയം അസ്വാഭാവികമായ ഏകവചന സർവനാമമില്ലാതെ വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
