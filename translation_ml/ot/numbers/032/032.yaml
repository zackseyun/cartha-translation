  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: ml
  text: ഞങ്ങൾതന്നെ ആയുധധാരികളായി യഹ്‌വെയുടെ സന്നിധിയിൽ കനാൻദേശത്തേക്കു കടന്നുപോകും; യോർദാന്റെ ഇക്കരയിൽ[a] ഞങ്ങളുടെ അവകാശസ്വത്ത് ഞങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോർദാന്റെ അക്കരെ” അല്ലെങ്കിൽ “യോർദാന്റെ മറുകരയിൽ.” എബ്രായപ്രയോഗത്തിന്റെ ദിശ സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാടിനെ ആശ്രയിച്ചിരിക്കുന്നു. ഇവിടെ സംസാരിക്കുന്നവർ നദിയുടെ കിഴക്കുവശത്തായതിനാൽ “ഇക്കരെ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: ഞങ്ങൾതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമം ക്രിയയിൽ ഇതിനകം അടങ്ങിയിരിക്കുന്ന കർത്താവിന് ഊന്നൽ നൽകുന്നു; ‘ഞങ്ങൾതന്നെ’ ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: נַעֲבֹר
  choice: കടന്നുപോകും
  rationale: עבר എന്ന ക്രിയയുടെ Qal imperfect ഒന്നാംപുരുഷ ബഹുവചനം ഇവിടെ യോർദാൻ കടക്കുമെന്ന ഭാവികാല പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നു.
- source_word: חֲלוּצִים
  choice: ആയുധധാരികളായി
  rationale: യുദ്ധസന്ദർഭത്തിൽ ഈ പദം യുദ്ധത്തിനായി ആയുധമണിഞ്ഞ് സജ്ജരായവരെ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്ന സ്ഥലപരവും ബന്ധപരവുമായ അർഥം വഹിക്കുന്നു; യഹ്‌വെയുടെ സാന്നിധ്യത്തിലും അധികാരത്തിലും നടത്തുന്ന ദൗത്യം എന്ന ഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: אֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്തേക്കു
  rationale: മൂലപാഠത്തിൽ പ്രത്യേക ലക്ഷ്യസൂചക അവ്യയം ഇല്ലെങ്കിലും ചലനക്രിയയും സന്ദർഭവും ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘-ത്തേക്കു’ സ്വാഭാവികമാണ്.
- source_word: וְאִתָּנוּ
  choice: ഞങ്ങളുടേതായിരിക്കും
  rationale: എബ്രായത്തിലെ ക്രിയാരഹിത ഘടന ഭാവികാല പ്രതിജ്ഞയുടെ പശ്ചാത്തലത്തിൽ മലയാളത്തിൽ ‘ആയിരിക്കും’ എന്നു പൂർത്തിയാക്കുന്നു; ‘with us’ എന്നത് ഇവിടെ കൈവശം/ഉടമസ്ഥത എന്ന അർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: ഞങ്ങളുടെ അവകാശസ്വത്ത്
  rationale: אֲחֻזָּה എന്ന കൈവശസ്വത്തിന്റെയും נַחֲלָה എന്ന അവകാശത്തിന്റെയും ആശയങ്ങൾ ‘അവകാശസ്വത്ത്’ എന്ന സംയുക്തപ്രയോഗത്തിൽ സംക്ഷിപ്തമായി നിലനിൽക്കുന്നു.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദാന്റെ ഇക്കരെയുള്ള
  rationale: ഈ ദിശാസൂചക പ്രയോഗം സംസാരിക്കുന്നവരുടെ നിലപാടിനെ ആശ്രയിച്ചിരിക്കുന്നു. കിഴക്കേക്കരയിൽനിന്ന് സംസാരിക്കുന്നവരുടെ സന്ദർഭത്തിൽ ‘ഇക്കരെ’ യോജിക്കുന്നു; മറ്റു ദൃഷ്ടികോണങ്ങളിൽ ‘അക്കരെ’ എന്നും വിവർത്തനം സാധ്യമാണ്.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לִפְנֵי יְהוָה എന്നതിന്റെ ബന്ധപരമായ ശക്തി
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  alternative: യഹ്‌വെയുടെ മുമ്പിൽ
  rationale: ഇത് സൈന്യത്തിന്റെ ക്രമത്തിലെ ‘മുന്നിൽ’ എന്ന അർഥത്തിൽ മാത്രം ഒതുക്കാതെ ദൈവസാന്നിധ്യവും ഉത്തരവാദിത്വവും ഉൾക്കൊള്ളുന്ന മൂലപാഠത്തിന്റെ സാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഞങ്ങൾതന്നെ’ എന്ന ഊന്നലും സൈനികസജ്ജതയും ദൈവസാന്നിധ്യത്തിന്റെ ബന്ധപരമായ ഭാവവും സംരക്ഷിച്ചു; ദിശാസൂചക പ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
