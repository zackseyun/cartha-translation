source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: ml
  text: ഇതാ, നിങ്ങളുടെ പിതാക്കന്മാരുടെ സ്ഥാനത്ത് പാപികളായ പുരുഷന്മാരുടെ ഒരു കൂട്ടമായി[a] നിങ്ങൾ എഴുന്നേറ്റിരിക്കുന്നു—ഇസ്രായേലിനെതിരെയുള്ള യഹ്‌വെയുടെ ജ്വലിക്കുന്ന കോപം[b] ഇനിയും വർധിപ്പിക്കാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപികളായ പുരുഷന്മാരുടെ വർധന” എന്നോ “പാപികളായ പുരുഷന്മാരുടെ സന്തതി” എന്നോ പരിഭാഷപ്പെടുത്താം. תַּרְבּוּת എന്ന ഹീബ്രുപദത്തിന് വർധനയെയോ സന്തതിയെയോ സൂചിപ്പിക്കാം; സന്ദർഭത്തിലെ കുറ്റപ്പെടുത്തൽസ്വരം കണക്കിലെടുത്താണ് “ഒരു കൂട്ടം” എന്നു നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “യഹ്‌വെയുടെ മൂക്കിന്റെ ജ്വലനത്തിന്മേൽ”; തീവ്രമായ കോപത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: മോശെയുടെ കുറ്റപ്പെടുത്തലിനും മുന്നറിയിപ്പിനും ഊന്നൽ നൽകുന്ന ഹീബ്രു സൂചനാപദത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുടെ സ്ഥാനത്ത് ... നിങ്ങൾ എഴുന്നേറ്റിരിക്കുന്നു
  rationale: קום എന്ന ക്രിയയുടെ എഴുന്നേൽക്കുക എന്ന ദൃശ്യഭാവവും മുൻതലമുറയുടെ സ്ഥാനത്ത് പിൻതലമുറ വന്നിരിക്കുന്നു എന്ന പിന്തുടർച്ചാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: പാപികളായ പുരുഷന്മാരുടെ ഒരു സന്തതിയായി
  rationale: תַּרְבּוּת എന്ന അപൂർവ നാമത്തിന്റെ സന്തതി/വർധന എന്ന കൂട്ടാർഥവും സന്ദർഭത്തിലെ നിന്ദാസ്വരവും കഴിയുന്നത്ര നിലനിർത്തുന്നു; אֲנָשִׁים എന്ന പുല്ലിംഗ ബഹുവചനവും വ്യക്തമാക്കുന്നു.
- source_word: לִסְפּוֹת עוֹד
  choice: ഇനിയും വർധിപ്പിക്കാൻ
  rationale: ഇതിനകം നിലനിൽക്കുന്ന കോപത്തോടു കൂടുതൽ ചേർക്കുക എന്ന തുടർച്ചയും തീവ്രതയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲרוֹן אַף
  choice: ജ്വലിക്കുന്ന കോപം
  rationale: തീവ്രമായ കോപത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിലെ ‘ജ്വലനം’ എന്ന രൂപകം പരന്ന ‘ക്രോധം’ എന്ന പരിഭാഷയിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ഹീബ്രു ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെയുള്ള
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അത് സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്തു; മലയാളത്തിലെ ഉച്ചാരണസൗകര്യത്തിന് ‘യഹ്‌വെ’ ഉപയോഗിച്ചു.
- issue: אֲנָשִׁים חַטָּאִים എന്ന ലിംഗസൂചക പ്രയോഗം
  choice: പാപികളായ പുരുഷന്മാർ
  alternative: പാപികളായ ആളുകൾ / പാപികൾ
  rationale: ഇവിടെ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ഗോത്രങ്ങളിലെ പുരുഷന്മാരെയാണ് പുല്ലിംഗ നാമം സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഉറവിടത്തിലെ ലിംഗസൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കുറ്റപ്പെടുത്തലിന്റെ തീക്ഷ്ണത നിലനിർത്താൻ ‘ഇതാ’, ‘എഴുന്നേറ്റിരിക്കുന്നു’, ‘ജ്വലിക്കുന്ന കോപം’ എന്നിവ ഉപയോഗിച്ചു. അപൂർവമായ תַּרְבּוּת എന്ന പദത്തിലെ യഥാർഥ അർഥവ്യാപ്തി മുഖ്യപാഠത്തിൽ ‘സന്തതി’ എന്നും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളായും സംരക്ഷിച്ചു.
