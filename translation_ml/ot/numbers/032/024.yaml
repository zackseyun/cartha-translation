id: NUM.32.24
reference: Numbers 32:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֽוּ לָ/כֶ֤ם עָרִים֙ לְ/טַפְּ/כֶ֔ם וּ/גְדֵרֹ֖ת לְ/צֹנַאֲ/כֶ֑ם וְ/הַ/יֹּצֵ֥א מִ/פִּי/כֶ֖ם תַּעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കായി പട്ടണങ്ങളും നിങ്ങളുടെ ആട്ടിൻകൂട്ടങ്ങൾക്കായി വേലികെട്ടിയ വളപ്പുകളും[a] പണിയുക; നിങ്ങളുടെ വായിൽനിന്ന് പുറപ്പെട്ടത് നിങ്ങൾ ചെയ്യുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വേലികെട്ടിയ വളപ്പുകൾ’ എന്നത് ആടുമുതലായ ചെറുകന്നുകാലികൾക്കുള്ള അടപ്പിടങ്ങളെയോ കൂട്ടിടങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘വായിൽനിന്ന് പുറപ്പെട്ടത്’ എന്നത് ഒരുവൻ പറഞ്ഞ വാക്കിനെയോ വാഗ്ദാനത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: പണിയുക
  rationale: ബנה എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപമാണിത്. לָכֶם സൂചിപ്പിക്കുന്ന പ്രയോജനാർഥം തുടർന്നുള്ള ‘നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കായി’ എന്ന പ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ വേറിട്ട് ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עיר എന്നത് പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം. കുടുംബങ്ങൾ താമസിക്കേണ്ട വാസസ്ഥലങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: לְטַפְּכֶם
  choice: നിങ്ങളുടെ കുഞ്ഞുങ്ങൾക്കായി
  rationale: טַף പ്രധാനമായി ചെറിയ കുട്ടികളെയും കുടുംബത്തിലെ ബാലജനത്തെയും സൂചിപ്പിക്കുന്നു. ‘കുഞ്ഞുങ്ങൾ’ അതിന്റെ മൂർത്തവും കുടുംബപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: וּגְדֵרֹת
  choice: തൊഴുത്തുകളും
  rationale: גְדֵרֹת കന്നുകാലികൾക്കുള്ള വേലികെട്ടിയ അടപ്പിടങ്ങളാണ്. മലയാളത്തിൽ ഈ ഇടയസന്ദർഭത്തിന് ‘തൊഴുത്തുകൾ’ സ്വാഭാവികം; വിശാലമായ ‘വളപ്പുകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לְצֹנַאֲכֶם
  choice: നിങ്ങളുടെ ആട്ടിൻകൂട്ടങ്ങൾക്കായി
  rationale: צֹאן ചെമ്മരിയാടുകളും കോലാടുകളും ഉൾപ്പെടുന്ന ചെറുകന്നുകാലിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘ആട്ടിൻകൂട്ടങ്ങൾ’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: നിങ്ങളുടെ വായിൽനിന്നു പുറപ്പെട്ടതു
  rationale: എബ്രായത്തിലെ ‘വായിൽനിന്നു പുറപ്പെടുക’ എന്ന വാഗ്ദാനനിർവഹണസംബന്ധിയായ പ്രയോഗം വിശദീകരിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യുക
  rationale: עשה എന്ന സാധാരണ ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മുൻപുള്ള വാക്യപ്രയോഗത്തോടൊപ്പം ഇത് പറഞ്ഞ വാക്ക് നിറവേറ്റുക എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: ‘വായിൽനിന്നു പുറപ്പെട്ടതു’ എന്ന വാക്യപ്രയോഗത്തിന്റെ അർഥം
  choice: മൂലത്തിലെ ശരീരാവയവാധിഷ്ഠിതമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘നിങ്ങൾ വാഗ്ദാനം ചെയ്തതു നിറവേറ്റുക’
  rationale: ഇത് അവരുടെ മുൻപ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷയും വാഗ്ദാനം/സംസാരിച്ച വാക്ക് എന്ന ആശയവും സംരക്ഷിക്കാൻ അക്ഷരാർഥപ്രയോഗം നിലനിർത്തി; പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിന്റെ സമാന്തരഘടനയും അവസാനത്തെ ശക്തമായ ആഹ്വാനവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
