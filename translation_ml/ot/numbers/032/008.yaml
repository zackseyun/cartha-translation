  text: כֹּ֥ה עָשׂ֖וּ אֲבֹתֵי/כֶ֑ם בְּ/שָׁלְחִ֥/י אֹתָ֛/ם מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לִ/רְא֥וֹת אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: ml
  text: ഞാൻ അവരെ കാദേശ്-ബർന്നേയയിൽനിന്ന് ദേശം കാണാൻ അയച്ചപ്പോൾ, നിങ്ങളുടെ പിതാക്കന്മാർ അങ്ങനെയാണ് ചെയ്തത്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദേശം പരിശോധിക്കാൻ’ അല്ലെങ്കിൽ ‘ദേശം ഉറ്റുനോക്കാൻ.’ എബ്രായ ക്രിയയുടെ അക്ഷരാർഥം ‘കാണുക’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് ദേശം പര്യവേക്ഷണം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: ചെയ്തതും ഇതുതന്നെയാണ്
  rationale: മുൻതലമുറയുടെ പ്രവൃത്തിയെ ഇപ്പോഴത്തെ സാഹചര്യത്തോടു താരതമ്യം ചെയ്യുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നിർദ്ദേശകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֲבֹתֵיכֶם
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: മൂലപാഠത്തിലെ ‘നിങ്ങളുടെ പിതാക്കന്മാർ’ എന്ന നേരിട്ടുള്ള പ്രയോഗവും മുൻതലമുറയെ സൂചിപ്പിക്കുന്ന ശക്തിയും സംരക്ഷിക്കുന്നു; ‘പൂർവികർ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ കൃത്യമാണ്.
- source_word: בְּשָׁלְחִי אֹתָם
  choice: ഞാൻ ... അയച്ചപ്പോൾ
  rationale: בְּ + infinitive construct എന്ന കാലസൂചക ഘടനയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ‘അവരെ’ എന്ന കർമം മലയാളത്തിൽ ക്രിയാസന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേകം ആവർത്തിക്കേണ്ടതില്ല.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: കാദേശ്-ബർന്നേയയിൽനിന്ന്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്യുകയും מִן എന്ന ഉറവിടസൂചക അവ്യയത്തെ ‘യിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: לִרְאוֹת אֶת הָאָרֶץ
  choice: ദേശം കാണാൻ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ദേശം പരിശോധിക്കുക/ഒറ്റുനോക്കുക എന്ന ആശയം ഉണ്ടായേക്കാമെങ്കിലും അതിനെ പ്രധാന പാഠത്തിൽ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
