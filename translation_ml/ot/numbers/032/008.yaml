translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘പിതാക്കന്മാർ’ എന്ന മൂലപാഠസന്നിഹിത പദവും ‘കാണാൻ’ എന്ന ഉദ്ദേശപൂർവം കുറച്ച് വ്യാഖ്യാനിക്കുന്ന പദവും നിലനിർത്തി; വ്യത്യസ്ത സന്ദർഭാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
