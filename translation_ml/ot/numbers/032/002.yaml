  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: ml
  text: 'ഗാദിന്റെ മക്കളും രൂബേന്റെ മക്കളും വന്ന് മോശയോടും പുരോഹിതനായ എലെയാസാരിനോടും സമൂഹത്തിന്റെ പ്രമാണിമാരോടും ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ മക്കളും രൂബേന്റെ മക്കളും
  rationale: ഗോത്രപിതാക്കന്മാരുടെ പേരുകളിലൂടെ അവരുടെ വംശജരെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ പ്രമാണിമാർ
  rationale: נָשִׂיא എന്നത് ഇവിടെ സമൂഹത്തിന്റെ അധികാരമുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ‘പ്രമാണിമാർ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളമാണ്.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ പങ്കാളികളുടെ ക്രമം നിലനിർത്തി; എബ്രായത്തിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ‘ഇങ്ങനെ പറഞ്ഞു’ എന്നാക്കി.
