translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. എബ്രായ വാക്യക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളവായനയ്ക്ക് അനുയോജ്യമായി ബന്ധപ്രയോഗം ക്രമപ്പെടുത്തി.
