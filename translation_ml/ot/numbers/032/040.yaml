id: NUM.32.40
reference: Numbers 32:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ אֶת הַ/גִּלְעָ֔ד לְ/מָכִ֖יר בֶּן מְנַשֶּׁ֑ה וַ/יֵּ֖שֶׁב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: ml
  text: മോശെ ഗിലെയാദ് മനശ്ശെയുടെ മകനായ മാഖീറിനു കൊടുത്തു; അവൻ അവിടെ താമസമുറപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ താമസിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: നָתַן എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള അർഥം നിലനിർത്തുന്നു; ‘നൽകി’ എന്നും സാധ്യമെങ്കിലും ഇവിടെ ‘കൊടുത്തു’ സ്വാഭാവികമാണ്.
- source_word: הַגִּלְעָד
  choice: ഗിലെയാദ്
  rationale: സ്ഥലനാമമായതിനാൽ എബ്രായ നിർദേശകപ്രത്യയം മലയാളത്തിൽ പ്രത്യേകം പ്രകടിപ്പിക്കാതെ അംഗീകൃത നാമരൂപം ഉപയോഗിച്ചു.
- source_word: לְמָכִיר
  choice: മാഖീറിനു
  rationale: לְ ഇവിടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ദത്തിവിഭക്തി അതിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: בֶּן מְנַשֶּׁה
  choice: മനശ്ശെയുടെ മകനായ
  rationale: בֵּן എന്ന പദത്തിന്റെ പ്രാഥമികമായ ‘മകൻ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു; ‘വംശജനായ’ എന്ന് വിപുലീകരിക്കേണ്ട നിർബന്ധം വാക്യത്തിലില്ല.
- source_word: וַיֵּשֶׁב
  choice: താമസമുറപ്പിച്ചു
  rationale: ഭൂമി കൈമാറുന്ന ഈ സന്ദർഭത്തിൽ ישׁב താമസിക്കാൻ സ്ഥാപിതനാകുക എന്ന ആശയം നൽകുന്നു; ‘താമസിച്ചു’ എന്ന വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בָּהּ
  choice: അവിടെ
  rationale: സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഗിലെയാദ് പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലസൂചനയായി ‘അവിടെ’ സ്വാഭാവികമാണ്.
