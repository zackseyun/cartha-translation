  to: രൂബേന്റെ പുത്രന്മാർക്കും ഗാദിന്റെ പുത്രന്മാർക്കും വളരെ വലിയ കന്നുകാലിസമ്പത്ത്[a] ഉണ്ടായിരുന്നു. അവർ യാസേർദേശവും ഗിലെയാദ്‌ദേശവും കണ്ടു; അതാ, ആ സ്ഥലം കന്നുകാലികൾക്കു പറ്റിയ സ്ഥലമായിരുന്നു.[b]
