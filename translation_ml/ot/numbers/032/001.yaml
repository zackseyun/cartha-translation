id: NUM.32.1
reference: Numbers 32:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: ml
  text: രൂബേന്റെ പുത്രന്മാർക്കും ഗാദിന്റെ പുത്രന്മാർക്കും വളരെ വലിയ കന്നുകാലിസമ്പത്ത്[a] ഉണ്ടായിരുന്നു. അവർ യാസേർദേശവും ഗിലെയാദ്‌ദേശവും കണ്ടു; അതാ, ആ സ്ഥലം കന്നുകാലികൾക്കു പറ്റിയ സ്ഥലമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രൂബേൻഗോത്രക്കാർക്കും ഗാദ്ഗോത്രക്കാർക്കും.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘രൂബേന്റെ പുത്രന്മാർക്കും ഗാദിന്റെ പുത്രന്മാർക്കും’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ സ്ഥലം കന്നുകാലികൾക്കുള്ള സ്ഥലമായിരുന്നു.’ എബ്രായം ഊന്നലിനായി ‘സ്ഥലം’ എന്ന പദം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: അത്യധികമായ കന്നുകാലിസമ്പത്ത്
  rationale: מִקְנֶה എന്നത് വിവിധ വളർത്തുമൃഗങ്ങൾ ഉൾപ്പെടുന്ന ചലസ്വത്തിനെ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലിസമ്പത്ത്’ അതിന്റെ സമ്പത്ത്/ഉടമസ്ഥതാഭാവവും വിശാലതയും നൽകുന്നു. רַב, עָצוּם, מְאֹד എന്നിവ ചേർന്ന ശക്തമായ സമൃദ്ധി ‘അത്യധികമായ’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: രൂബേന്റെ പുത്രന്മാർക്കും ഗാദിന്റെ പുത്രന്മാർക്കും
  rationale: ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെങ്കിലും, എബ്രായത്തിലെ ആവർത്തിച്ച ‘പുത്രന്മാർ’ എന്ന രൂപം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: וַיִּרְאוּ
  choice: അവർ ... കണ്ടു
  rationale: ലളിതമായ ആഖ്യാനക്രമം നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘കണ്ടപ്പോൾ’ എന്ന കാലബന്ധമോ കാരണബന്ധമോ ചേർത്തിട്ടില്ല.
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: യാസേർദേശവും ഗിലെയാദ്‌ദേശവും
  rationale: אֶרֶץ എന്നതിന്റെ ആവർത്തനം രണ്ടു ദേശനാമങ്ങളോടും ‘ദേശം’ ചേർത്ത് സംക്ഷിപ്തമായും വ്യക്തമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: കണ്ടെത്തിയ കാര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഹീബ്രു സംവാദചിഹ്നത്തിന്റെ തത്സമയഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: ആ സ്ഥലം കന്നുകാലികൾക്കു പറ്റിയ സ്ഥലമായിരുന്നു
  rationale: മൂലത്തിലെ מָקוֹם ആവർത്തനം ‘സ്ഥലം ... സ്ഥലമായിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും, מְקוֹם מִקְנֶה എന്നതിന്റെ സന്ദർഭാർഥമായ അനുയോജ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. ഗോത്രപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയപ്പോൾ മുഖ്യപാഠത്തിൽ മൂലരൂപത്തിന്റെ സുതാര്യത സംരക്ഷിച്ചു; ‘അതാ’ മുഖേന הִנֵּהയുടെ ശ്രദ്ധാകർഷകശക്തിയും നിലനിർത്തി.
