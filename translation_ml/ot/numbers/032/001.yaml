  source_fidelity: മുഖ്യവാചകം എബ്രായത്തിലെ ഗോത്രനാമങ്ങളുടെ ആവർത്തനം, സമൃദ്ധമായ മൃഗസമ്പത്ത്, രണ്ടു ദേശങ്ങളുടെ ആവർത്തിച്ച പരാമർശം, וְהִנֵּהയുടെ ശ്രദ്ധാകർഷണം, ‘സ്ഥലം’ എന്ന പദത്തിന്റെ ആവർത്തനം എന്നിവ പൊതുവേ വിശ്വസ്തമായി പ്രതിഫലിപ്പിക്കുന്നു. എന്നാൽ [a] അടിക്കുറിപ്പിന്റെ ആങ്കർ അതു വിശദീകരിക്കുന്ന ‘കന്നുകാലിസമ്പത്ത്’ എന്ന പദത്തോടു ചേർക്കുന്നതാണ് ഉചിതം.
  naturalness: ‘അതാ’യും ‘കന്നുകാലികൾക്കു പറ്റിയ സ്ഥലമായിരുന്നു’യും ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘വളരെ വലിയ കന്നുകാലിസമ്പത്ത്’ എന്ന രൂപം മൂലത്തിലെ ശക്തമായ അളവുബോധം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
  terminology: ‘രൂബേന്റെ പുത്രന്മാർ’, ‘ഗാദിന്റെ പുത്രന്മാർ’, ‘കന്നുകാലിസമ്പത്ത്’, ‘യാസേർ’, ‘ഗിലെയാദ്’ എന്നിവ യോജിച്ചതാണ്. [b]യിൽ വാചകത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കന്നുകാലികൾക്കു പറ്റിയ’ എന്ന ബദൽ കൂടി ചേർക്കുന്നത് അടിക്കുറിപ്പിനെ കൂടുതൽ സമ്പൂർണമാക്കുന്നു.
