source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ അവിടുത്തെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞാൽ[a], അവിടുന്ന് അവനെ വീണ്ടും മരുഭൂമിയിൽ കഴിയാൻ വിടും[b]; അങ്ങനെ ഈ ജനത്തിനെല്ലാം നിങ്ങൾ നാശം വരുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവിടുത്തെ പിന്നാലെനിന്ന്’; ഒരാളെ അനുഗമിക്കുന്നത് ഉപേക്ഷിക്കുക എന്ന അർഥമുള്ള പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘അവനെ മരുഭൂമിയിൽ കഴിയാൻ വിടും’ എന്ന ഏകവചന സർവനാമമാണ്. അത് ഇസ്രായേലിനെയോ ജനത്തെയോ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നതായിരിക്കാം. ചില പരിഭാഷകൾ ‘അവരെ’ എന്നോ ‘ഇസ്രായേലിനെ’ എന്നോ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എങ്കിൽ / -ആൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ കാരണം വിശദീകരിക്കുന്നതോടൊപ്പം വ്യവസ്ഥയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യവസ്ഥാപ്രത്യയമായ ‘-ആൽ’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: അവിടുത്തെ അനുഗമിക്കുന്നതിൽനിന്ന് പിന്തിരിഞ്ഞാൽ
  rationale: ശാരീരികമായി മടങ്ങുക എന്നതിലുപരി, ഒരാളെ പിന്തുടരുന്നത് ഉപേക്ഷിക്കുക എന്ന അർഥമാണ് ഇവിടെ. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന് ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു.
- source_word: וְיָסַף עוֹד
  choice: വീണ്ടും
  rationale: രണ്ടു പദങ്ങളും ചേർന്ന് പ്രവൃത്തി ആവർത്തിക്കപ്പെടുമെന്ന അർഥം നൽകുന്നു.
- source_word: לְהַנִּיחוֹ
  choice: അവനെ ... വിട്ടുകളയും
  rationale: ഹിഫിൽ രൂപത്തിന് ഇവിടെ ‘അവിടെ തുടരാൻ വിടുക’ എന്ന അർഥമാണ്. എബ്രായത്തിലെ ഏകവചന സർവനാമം നിലനിർത്തി; ‘വിട്ടുകളയും’ വിധിന്യായസന്ദർഭത്തിലെ ഗൗരവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: പഞ്ചഗ്രന്ഥത്തിലെ മִדְבָּר എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: וְשִׁחַתֶּם
  choice: നാശം വരുത്തും
  rationale: ജനത്തിന്റെമേൽ വിനാശകരമായ ഫലം വരുത്തിവെക്കുക എന്ന കാരണാർഥം പ്രകടമാക്കുന്നു; ഉടനടിയുള്ള ശാരീരിക ഉന്മൂലനം മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: לְכָל הָעָם הַזֶּה
  choice: ഈ ജനത്തിനെല്ലാം
  rationale: എബ്രായത്തിലെ ഏകവചന സമൂഹനാമമായ ‘ഈ ജനം’ എന്ന രൂപവും ‘മുഴുവനും’ എന്ന വ്യാപ്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: לְהַנִּיחוֹ എന്നതിലെ ഏകവചന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവനെ’ എന്ന ഏകവചനം നിലനിർത്തി, ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘അവരെ’ എന്ന ബഹുവചനമാക്കുക, അല്ലെങ്കിൽ ‘ഇസ്രായേലിനെ’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: മൂലപാഠത്തിൽ ഏകവചന പ്രത്യയമാണുള്ളത്. അത് മോശെയെയോ ഒരു വ്യക്തിഗോത്രത്തെയോ അല്ല, ജനത്തെ ഒരു സമൂഹമായി കാണുന്നതാണെന്നതാണ് സമീപസന്ദർഭത്തിലെ ഏറ്റവും സാധ്യതയുള്ള വായന; എന്നാൽ പരിഭാഷയിൽ മൂലരൂപം മായ്ച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്/അവിടുത്തെ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ സമൂഹാർഥമുള്ള ഏകവചനവും മുന്നറിയിപ്പിന്റെ കാരണാർഥവും നിലനിർത്തി.
