source:
  edition: WLC
  text: וְ/אֶת בֵּ֥ית נִמְרָ֖ה וְ/אֶת בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְ/גִדְרֹ֥ת צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: ml
  text: ബേത്ത്-നിമ്രാ, ബേത്ത്-ഹാരാൻ എന്നീ കോട്ടകെട്ടിയ പട്ടണങ്ങളും ആട്ടിൻതൊഴുത്തുകളും പണിതു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: ബേത്ത്-നിമ്രാ
  rationale: ഇത് ഒരു സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; בֵּית എന്ന ഘടകം ‘ബേത്ത്-’ ആയി പേരിനുള്ളിൽ നിലനിർത്തി.
- source_word: בֵּית הָרָן
  choice: ബേത്ത്-ഹാരാൻ
  rationale: സ്ഥിരപ്പെട്ട പട്ടണനാമമാണെന്നതിനാൽ ‘ഹാരാന്റെ വീട്’ എന്ന് അർഥവിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരിച്ചു.
- source_word: עָרֵי מִבְצָר
  choice: ഉറപ്പുള്ള പട്ടണങ്ങൾ
  rationale: പ്രതിരോധത്തിനായി ബലപ്പെടുത്തിയ പട്ടണങ്ങൾ എന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: גִדְרֹת צֹאן
  choice: ആട്ടിൻതൊഴുത്തുകൾ
  rationale: ആടുകളെയോ ചെറുകന്നുകാലികളെയോ അടച്ചുസൂക്ഷിക്കുന്ന വേലികെട്ടിയ ഇടങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ ‘ആട്ടിൻതൊഴുത്തുകൾ’ സ്വാഭാവികമാണ്.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: '... എന്നീ ...കളും ...കളും'
  rationale: אֵת വിവർത്തനം ചെയ്യാതെ, മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന കൂട്ടിച്ചേർക്കൽപട്ടിക മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയഘടനയിലൂടെ പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ ‘പണിതു’ എന്ന ക്രിയ തുടരുന്ന അപൂർണ്ണ പട്ടികയായതിനാൽ, മലയാളത്തിൽ സ്വതന്ത്രമായി വായിക്കാവുന്ന വിധം ‘പണിതു’ ആവർത്തിച്ചു.
