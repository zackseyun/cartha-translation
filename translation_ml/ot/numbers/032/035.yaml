  yaml_path: translation/ot/numbers/032/035.yaml
  text: and Atroth-shophan[a], and Jazer, and Jogbehah.
translation:
  language: ml
  text: അത്രോത്ത്-ശോഫാൻ[a], യസേർ, യോഗ്ബെഹാ എന്നിവയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതരോത്ത്-ശോഫാൻ’ എന്നും ലിപ്യന്തരം ചെയ്യാം. എബ്രായത്തിലുള്ളത് ഒരു സംയുക്ത സ്ഥലനാമമാണ്; അതിന്റെ ലിപ്യന്തരരൂപങ്ങളിൽ വ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: എന്നിവയും
  rationale: וְ എന്ന സംയോജകത്തിന്റെ അർഥം പട്ടികയുടെ അവസാനത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നിവയും’ എന്നു പ്രകടിപ്പിച്ചു; אֶת എന്ന നേരിട്ടുള്ള കർമസൂചകത്തിന് മലയാളത്തിൽ പ്രത്യേക പരിഭാഷ ആവശ്യമില്ല.
- source_word: עַטְרֹת שׁוֹפָן
  choice: അത്രോത്ത്-ശോഫാൻ
  rationale: സംയുക്ത സ്ഥലനാമമായതിനാൽ അർഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു; ആദ്യ ഘടകത്തിലെ സ്വരാവിഷ്കാരത്തിൽ വ്യത്യാസം സാധ്യമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: יַעְזֵר
  choice: യസേർ
  rationale: എബ്രായ വ്യഞ്ജനവും സ്വരക്രമവും അടിസ്ഥാനമാക്കി സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; ഇംഗ്ലീഷ് പരമ്പരയിലെ J എന്ന അക്ഷരത്തെ ആശ്രയിച്ച് ‘ജ’ ഇറക്കുമതി ചെയ്തില്ല.
- source_word: יָגְבֳּהָה
  choice: യോഗ്ബെഹാ
  rationale: എബ്രായ പാഠത്തിലെ സ്ഥലനാമത്തെ അതിന്റെ ഉച്ചാരണരൂപത്തോട് അടുത്തായി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സ്ഥലനാമങ്ങളുടെ പട്ടികയെന്ന വാക്യഘടന നിലനിർത്തി സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ അവസാനത്തിൽ ‘എന്നിവയും’ ചേർത്തു.
