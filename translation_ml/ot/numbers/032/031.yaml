revisions:
- from: 'അപ്പോൾ ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും മറുപടി പറഞ്ഞു: “യഹോവ അങ്ങയുടെ ദാസന്മാരോടു അരുളിച്ചെയ്തതുപോലെതന്നെ ഞങ്ങൾ ചെയ്യും.”'
  to: 'അപ്പോൾ ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും മറുപടി പറഞ്ഞു: “യാഹ്‌വെ അങ്ങയുടെ ദാസന്മാരോടു പറഞ്ഞതുപോലെതന്നെ ഞങ്ങൾ ചെയ്യും.”'
