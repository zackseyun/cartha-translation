id: NUM.32.31
reference: Numbers 32:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: ml
  text: 'അപ്പോൾ ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും മറുപടി പറഞ്ഞു: “യാഹ്‌വെ അങ്ങയുടെ ദാസന്മാരോടു പറഞ്ഞതുപോലെതന്നെ ഞങ്ങൾ ചെയ്യും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥാഖ്യാനത്തിലെ ഈ ക്രിയാരൂപം മുൻവാക്കിനുള്ള പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമുള്ള പ്രയോഗമാണിത്.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: ഗാദിന്റെ പുത്രന്മാരും രൂബേന്റെ പുത്രന്മാരും
  rationale: എബ്രായത്തിലെ ആവർത്തിച്ചുള്ള ‘പുത്രന്മാർ’ എന്ന ബന്ധപ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: לֵאמֹר
  choice: 'പറഞ്ഞു:'
  rationale: മലയാളത്തിൽ ‘മറുപടി പറഞ്ഞു:’ എന്ന ഘടന തന്നെ ഉദ്ധരണിയെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നതിനാൽ പ്രത്യേകമായി ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: ‘എന്ത്... അത്’ എന്നും ‘പോലെ... അങ്ങനെ’ എന്നും ഗ്രഹിക്കാവുന്ന ബന്ധഘടനയെ മലയാളത്തിലെ സ്വാഭാവികമായ അനുരൂപപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: דִּבֶּר
  choice: അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന, മാന്യവും ബൈബിൾ ഭാഷയിൽ സുപരിചിതവുമായ മലയാളപ്രയോഗം; സന്ദർഭത്തിലെ മുൻപ്രസ്താവനയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപത്തിൽ നൽകുന്നു.
- source_word: אֶל עֲבָדֶיךָ
  choice: അങ്ങയുടെ ദാസന്മാരോടു
  rationale: മോശെയോടുള്ള വിനയപൂർവമായ സ്വയംപരാമർശം സംരക്ഷിക്കുന്നു; ഇവിടെ ‘അടിമകൾ’ എന്ന സാമൂഹിക നില മുൻനിരയിൽ ഇല്ല. ഏകവചന ആദരസൂചകമായ ‘അങ്ങയുടെ’ ഉപയോഗിക്കുന്നു.
- source_word: נַעֲשֶׂה
  choice: ഞങ്ങൾ ചെയ്യും
  rationale: വ്യക്തമായി പറയാത്ത ഒരു കർമം കൂട്ടിച്ചേർക്കാതെ, നിർദേശം നടപ്പാക്കുമെന്ന ലളിതവും നേരിട്ടുമുള്ള അർഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ചതുരക്ഷര വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമസ്വഭാവം നിലനിർത്തുന്ന, മലയാളവായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ സ്വീകരിച്ചു.
- issue: മോശെയോടുള്ള ‘ദാസന്മാർ’ എന്ന സ്വയംപരാമർശം
  choice: അങ്ങയുടെ ദാസന്മാർ
  alternative: അങ്ങയുടെ അടിമകൾ
  rationale: ഇത് വിനയവും വിധേയത്വവും പ്രകടിപ്പിക്കുന്ന ആചാരപരമായ അഭിസംബോധനയാണ്; ഉടമസ്ഥതയിലുള്ള അടിമത്തം ഇവിടെ ഊന്നുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ഗോത്രനാമങ്ങളെ ‘ഗാദ്യർ/രൂബേന്യർ’ എന്നാക്കി ചുരുക്കാതെ മൂലത്തിലെ ബന്ധഘടന നിലനിർത്തി. ‘പറഞ്ഞുകൊണ്ട്’ പോലുള്ള കൃത്രിമമായ ആവർത്തനം ഒഴിവാക്കി. വാക്യത്തിലെ ‘എന്ത്... അത്’ / ‘പോലെ... അങ്ങനെ’ എന്ന ചെറിയ ഘടനാഭേദം മലയാള മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമായി കണ്ടില്ല.
