reference: Numbers 32:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: ml
  text: പിന്നെ, യാഹ്‌വേ അവർക്കു നൽകിയ ദേശത്തേക്കു കടന്നുചെല്ലുന്നതിൽനിന്ന് നിങ്ങൾ എന്തിന് ഇസ്രായേൽമക്കളുടെ ഹൃദയം തളർത്തുന്നു?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കളുടെ ധൈര്യമോ ദൃഢനിശ്ചയമോ കെടുത്തുന്നു.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഹൃദയം തളർത്തുന്നു” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇസ്രായേല്യരുടെ” അല്ലെങ്കിൽ “ഇസ്രായേലിന്റെ മക്കളുടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: പിന്നെ എന്തിന്
  rationale: വാവിന്റെ സന്ദർഭബന്ധവും ചോദ്യംചെയ്യുന്ന ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תנואון אֶת לֵב
  choice: ഹൃദയം തളർത്തി ... പിന്തിരിപ്പിക്കുന്നു
  rationale: ഹിഫീൽ ക്രിയയുടെ പ്രേരകാർഥമായ നിരുത്സാഹപ്പെടുത്തൽ/മനസ്സുമാറ്റിക്കൽ വ്യക്തമാക്കുകയും ‘ഹൃദയം’ എന്ന എബ്രായ രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: കുടുംബ-ദേശീയ പ്രയോഗം സംരക്ഷിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗ്രാഹ്യവുമായ രൂപം.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: ദേശത്തേക്കു കടന്നുചെല്ലുന്നതിൽനിന്ന്
  rationale: ഒരു അതിർത്തി കടന്ന് ദേശത്തിൽ പ്രവേശിക്കുന്ന ചലനവും מִן രൂപത്തിന്റെ തടയൽഭാവവും പ്രകടമാക്കുന്നു.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: അവർക്കു നൽകിയ
  rationale: എബ്രായ പൂർണ്ണക്രിയയിലെ പൂർത്തിയായ ദാനത്തെ ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ദാനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിൽക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ അതിനെ പദവിയായി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ദേശീയ-കുടുംബ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘മക്കൾ/പുത്രന്മാർ’ എന്ന കുടുംബപരമായ രൂപം സംരക്ഷിക്കുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കാൻ യോജിച്ചതുമാണ്.
- issue: לֵב എന്ന ഏകവചന കൂട്ടായ പ്രയോഗം
  choice: ഹൃദയം
  alternative: ഹൃദയങ്ങൾ / ധൈര്യം
  rationale: എബ്രായത്തിലെ ഏകവചനരൂപവും കൂട്ടായ ജനതയുടെ മനോധൈര്യത്തെ സൂചിപ്പിക്കുന്ന രൂപകവും സംരക്ഷിക്കുന്നു; ബഹുവചനമാക്കി അല്ലെങ്കിൽ വ്യാഖ്യാനാർഥം മാത്രം നൽകി അവ്യക്തത നീക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘ഹൃദയം തളർത്തുക’ എന്ന രൂപകം മൂലത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ ഭാവം നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭാർഥം ‘പിന്തിരിപ്പിക്കുന്നു’ എന്ന ക്രിയയിലൂടെ വ്യക്തമാക്കുന്നു.
