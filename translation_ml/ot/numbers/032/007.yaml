  terminology: «ഇസ്രായേൽമക്കൾ» appropriately retains the familial-national designation, and singular collective «ഹൃദയം» is defensible for Hebrew לֵב. «യാഹ്‌വേ» is used to represent Yahweh consistently with the supplied audit trail.
