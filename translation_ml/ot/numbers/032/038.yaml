  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: ml
  text: പേരുകൾ മാറ്റപ്പെട്ട നെബോയും ബാൽ-മെയോനും[a] സിബ്മയും. അവർ തങ്ങൾ പണിത പട്ടണങ്ങൾക്ക് പേരുകൾ നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പേരുകൾ മാറ്റപ്പെട്ടവ” / “പേരുകൾ മാറ്റിയവ.” ഈ എബ്രായ പ്രയോഗം നെബോ, ബാൽ-മെയോൻ എന്നീ പട്ടണങ്ങളുടെ പേരുകൾ മാറ്റപ്പെട്ടിരുന്നതായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: നെബോ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി എഴുതിയിരിക്കുന്നു.
- source_word: בַּעַל מְעוֹן
  choice: ബാൽ-മെയോൻ
  rationale: സംയുക്ത സ്ഥലനാമത്തിന്റെ ഘടകങ്ങൾ വ്യക്തമാക്കാൻ ഹൈഫൻ നിലനിർത്തി ശബ്ദാനുസൃതമായി എഴുതിയിരിക്കുന്നു.
- source_word: מוּסַבֹּת שֵׁם
  choice: പേരുകൾ മാറ്റപ്പെട്ട
  rationale: סבב എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ പങ്കാളിത്തരൂപവും שֵׁם എന്ന നാമവും ചേർന്ന പ്രയോഗത്തിന്റെ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു; വ്യാകരണപരമായ ബഹുവചനം പേരുകളെ സൂചിപ്പിക്കുന്നു.
- source_word: שִׂבְמָה
  choice: സിബ്മ
  rationale: സ്ഥലനാമത്തിന്റെ എബ്രായ വ്യഞ്ജനരൂപം പിന്തുടർന്നുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: അവർ പേരുകൾ നൽകി
  rationale: പേരിടൽസന്ദർഭത്തിലെ קרא + ב + שם എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: പട്ടണങ്ങൾക്ക്
  rationale: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘പട്ടണങ്ങളുടെ പേരുകൾ’ എന്നുണ്ടെങ്കിലും, മലയാളത്തിൽ പേരുനൽകുന്ന പ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ദാതൃവിഭക്തി ഉപയോഗിച്ചു.
- source_word: אֲשֶׁר בָּנוּ
  choice: തങ്ങൾ പണിത
  rationale: בנה എന്ന സാധാരണ ക്രിയയുടെ ‘പണിയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുനർനിർമാണം സാദ്ധ്യമെങ്കിലും മൂലപാഠം അതു വ്യക്തമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പട്ടണങ്ങളുടെ പട്ടിക മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ മലയാളത്തിൽ പൂർണ്ണവാക്യമാക്കാൻ ‘പണിതു’ ചേർത്തിരിക്കുന്നു; ഇത് വാക്യത്തിന്റെ തുടക്കത്തിലെ അർഥസംബന്ധം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചിക ബന്ധപ്പെട്ട ദ്വയത്തിലെ രണ്ടാമത്തെ പേരിനു പിന്നാലെ വെച്ചിരിക്കുന്നു.
