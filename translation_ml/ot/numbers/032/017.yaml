source:
  edition: WLC
  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങൾ തന്നേ വേഗത്തിൽ ആയുധമണിഞ്ഞ്, അവരെ അവരുടെ സ്ഥലത്ത് എത്തിക്കുന്നതുവരെ ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ[a] പോകും. ദേശവാസികൾ നിമിത്തം ഞങ്ങളുടെ കുഞ്ഞുകുട്ടികൾ[b] കോട്ടകെട്ടിയ പട്ടണങ്ങളിൽ താമസിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർക്കു മുന്നിലായി’; അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ’ എന്നാണ്. ഇവിടെ യുദ്ധത്തിൽ അവരുടെ മുൻനിരയിൽ പോകുന്നതായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘കുഞ്ഞുകുട്ടികൾ’ എന്നത് കുട്ടികളെയും മറ്റു ആശ്രിതരെയും പൊതുവായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: ആയുധമണിഞ്ഞ് ... പോകും
  rationale: 'നിഫാൽ രൂപം ഇവിടെ സന്ദർഭാനുസൃതമായി മധ്യമ/പ്രത്യാവർത്തക അർഥം നൽകുന്നു: സംസാരിക്കുന്നവർ യുദ്ധത്തിനായി സ്വയം സജ്ജരായി പോകുമെന്ന് പ്രതിജ്ഞ ചെയ്യുന്നു.'
- source_word: חֻשִׁים
  choice: വേഗത്തിൽ
  rationale: ഈ പദം തിടുക്കത്തെയും സന്നദ്ധതയെയും സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമായി എടുത്തു. ആയുധധാരണത്തിന്റെ ആശയം മുൻപത്തെ ക്രിയയിൽ ഉള്ളതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ മുമ്പിൽ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; യുദ്ധസന്ദർഭത്തിൽ സൈന്യത്തിന്റെ മുൻനിരയിൽ പോകുക എന്ന സാധ്യതയുള്ള അർഥവും തുറന്നുവെക്കുന്നു.
- source_word: עַד אֲשֶׁר אִם
  choice: എത്തിക്കുന്നതുവരെ
  rationale: പ്രവർത്തനത്തിന്റെ അവസാനപരിധി സൂചിപ്പിക്കുന്ന സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരെ’ എന്ന ഘടനയിൽ നൽകി.
- source_word: הֲבִיאֹנֻם
  choice: അവരെ ... എത്തിക്കുക
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘വരുത്തുക/എത്തിക്കുക’ എന്നാണ്; ഇവിടെ മറ്റുള്ള ഇസ്രായേല്യരെ ലക്ഷ്യസ്ഥാനത്ത് എത്തിക്കുന്നതാണ് ആശയം.
- source_word: אֶל מְקוֹמָם
  choice: അവരുടെ സ്ഥലത്ത്
  rationale: മൂലത്തിലെ വിശാലമായ ‘അവരുടെ സ്ഥലം’ എന്ന സൂചന നിലനിർത്തി; അത് അവർക്കു ലഭിക്കേണ്ട പാർപ്പിടപ്രദേശത്തെ ഉൾക്കൊള്ളാം.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: ഞങ്ങളുടെ കുഞ്ഞുകുട്ടികൾ ... താമസിക്കും
  rationale: טף കുട്ടികളെയും ആശ്രിതരെയും ഉൾക്കൊള്ളാവുന്ന കൂട്ടനാമമാണ്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘കുഞ്ഞുകുട്ടികൾ’ നൽകി, വിശാല അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: കോട്ടകെട്ടിയ പട്ടണങ്ങളിൽ
  rationale: പ്രതിരോധത്തിനായി ഉറപ്പിച്ച പട്ടണങ്ങൾ എന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: ദേശവാസികൾ നിമിത്തം
  rationale: മൂലത്തിലെ കാരണ/ഭീഷണി ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; കോട്ടകെട്ടിയ പട്ടണങ്ങൾ എന്ന സന്ദർഭം സംരക്ഷണലക്ഷ്യം വ്യക്തമാക്കുന്നു.
