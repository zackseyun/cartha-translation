source:
  edition: WLC
  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: ml
  text: അപ്പോൾ മോശ അവരെ സംബന്ധിച്ച് പുരോഹിതനായ എലെയാസരോടും[a] നൂന്റെ മകനായ യോശുവയോടും ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാരോടും[b] കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു സാധ്യത: ‘മോശ അവരോടു കല്പിച്ചു’; അപ്പോൾ ‘അവർ’ എന്നത് ഈ വാക്യത്തിൽ പേരെടുത്തിരിക്കുന്ന നേതാക്കളെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘ഗോത്രങ്ങളിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ’ എന്നത് ഇസ്രായേലിലെ കുല-ഗോത്ര നേതാക്കളെ സൂചിപ്പിക്കുന്ന ഭരണപരമായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: കല്പിച്ചു
  rationale: צוה എന്ന ക്രിയയുടെ അധികാരപൂർവമായ നിർദേശാർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָהֶם
  choice: അവരെ സംബന്ധിച്ച്
  rationale: സമീപസന്ദർഭത്തിലെ രൂബേന്യരെയും ഗാദ്യരെയും സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു; കല്പന സ്വീകരിക്കുന്നവർ തുടർന്ന് പേരെടുത്തിരിക്കുന്ന നേതാക്കളാണ്.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസരോടും
  rationale: צוה എന്ന ക്രിയയോടൊപ്പം വരുന്ന വ്യക്തികളെ മലയാളത്തിൽ സ്വാഭാവികമായി സമ്പ്രദാനബന്ധം സൂചിപ്പിക്കുന്ന ‘-ഓട്’ രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകനായ യോശുവ
  rationale: ഹീബ്രു പിതൃനാമഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: ഗോത്രങ്ങളിലെ പിതൃഭവനങ്ങളുടെ തലവന്മാർ
  rationale: ഗോത്ര-കുല ഭരണസംവിധാനത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധത്തിൽ, എന്നാൽ അതിന്റെ ഘടന നഷ്ടപ്പെടാതെ, നൽകിയിരിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ
  rationale: വംശപരവും ഗോത്രപരവുമായ പശ്ചാത്തലം നിലനിർത്തുന്ന പരമ്പരാഗതവും സുതാര്യവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: לָהֶם എന്ന സർവനാമത്തിന്റെ ബന്ധം
  choice: മുൻസന്ദർഭത്തിലെ രൂബേന്യരെയും ഗാദ്യരെയും കുറിച്ചുള്ള കല്പനയായി വിവർത്തനം ചെയ്തു
  alternative: ‘അവരോടു കല്പിച്ചു’ എന്ന് എടുത്ത് ഈ വാക്യത്തിൽ പേരെടുത്തിരിക്കുന്ന നേതാക്കളെ സർവനാമത്തിന്റെ സൂചനയായി കാണാം
  rationale: אֵת എന്ന ചിഹ്നത്തോടെ എലെയാസർ, യോശുവ, നേതാക്കൾ എന്നിവർ കല്പനയുടെ സ്വീകരിക്കുന്നവരായി വ്യക്തമായി വരുന്നതിനാൽ, לָהֶם മുൻപറഞ്ഞ ഗോത്രക്കാരെ സംബന്ധിക്കുന്നതായി വായിക്കുന്നത് സന്ദർഭത്തിലും മലയാളവാക്യഘടനയിലും കൂടുതൽ യോജിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് സുലഭവുമായ മലയാളം. ഹീബ്രുവിലെ ഭരണപരമായ പദസമുച്ചയം അമിതമായി ലളിതമാക്കാതെ സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ അവതരിപ്പിച്ചു.
