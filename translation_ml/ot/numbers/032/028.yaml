  source_fidelity: ഹീബ്രു വാക്യത്തിലെ וַיְצַו ... לָהֶם എന്ന ഘടനയും, എലെയാസർ, യോശുവ, ഇസ്രായേൽമക്കളുടെ ഗോത്രങ്ങളിലെ പിതൃഭവനത്തലവന്മാർ എന്നിവരോടുള്ള മോശെയുടെ നിർദേശം എന്ന ആശയവും കൃത്യമായി പ്രതിഫലിക്കുന്നു. ‘അവരെ സംബന്ധിച്ച്’ മുൻസന്ദർഭത്തിലെ രൂബേന്യരെയും ഗാദ്യരെയും സൂചിപ്പിക്കുന്ന സന്ദർഭാനുസൃത വായനയാണ്; ബദൽ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘പുരോഹിതനായ എലെയാസരോടും’, ‘നൂന്റെ മകനായ യോശുവയോടും’ എന്നീ പ്രയോഗങ്ങൾ വ്യക്തമാണ്. ‘പിതൃഭവനങ്ങളുടെ തലവന്മാർ’ ഭരണ-വംശഘടനയുടെ ഔപചാരിക സ്വഭാവത്തിന് യോജിക്കുന്നു.
