source:
  edition: WLC
  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: ml
  text: യാഹ്‌വെ യിസ്രായേൽജനസമൂഹത്തിന്റെ[a] മുമ്പിൽ പ്രഹരിച്ച ദേശം വളർത്തുമൃഗങ്ങൾക്ക് അനുയോജ്യമായ ദേശമാണ്[b]; അങ്ങയുടെ ദാസന്മാർക്ക് വളർത്തുമൃഗങ്ങളുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യിസ്രായേൽസഭയുടെ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “വളർത്തുമൃഗങ്ങളുടെ ദേശം”; മൃഗങ്ങളെ മേയ്ക്കാനും വളർത്താനും അനുയോജ്യമായ പ്രദേശം എന്നാണ് ആശയം. എബ്രായപദം കന്നുകാലികളെ മാത്രമല്ല, വളർത്തുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ പ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; നിശ്ചയാർഥവും സന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הִכָּה
  choice: പ്രഹരിച്ച
  rationale: נכה എന്ന ക്രിയയുടെ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന ശക്തി നിലനിർത്തുകയും ‘തോൽപ്പിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ശബ്ദാന്തരം ചെയ്തു.
- source_word: לִפְנֵי
  choice: മുമ്പാകെ
  rationale: യിസ്രായേൽസഭയുടെ സാന്നിധ്യത്തിൽ നടന്ന പ്രവൃത്തിയെന്ന സ്ഥലപരവും സാക്ഷ്യപരവുമായ ഭാവം നൽകുന്നു.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: യിസ്രായേൽസഭ
  rationale: עֵדָה എന്നത് ഒത്തുചേർന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; പഞ്ചഗ്രന്ഥസന്ദർഭത്തിൽ ‘സഭ’ സംക്ഷിപ്തവും മാന്യവുമാണ്.
- source_word: אֶרֶץ מִקְנֶה
  choice: വളർത്തുമൃഗങ്ങൾക്ക് അനുയോജ്യമായ ദേശം
  rationale: ഹീബ്രായ പ്രയോഗത്തിലെ യോഗ്യത/സ്വഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘കന്നുകാലികൾ’ എന്നു പറഞ്ഞ് അർഥം കന്നുകാലികളിൽ മാത്രം ചുരുക്കുന്നില്ല.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: അങ്ങയുടെ ദാസന്മാരായ ഞങ്ങൾക്കും വളർത്തുമൃഗങ്ങളുണ്ട്
  rationale: മോശെയോടുള്ള ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയും സംസാരിക്കുന്നവരുടെ സ്വയംതാഴ്ത്തലും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയായ ‘കർത്താവ്’ കൊണ്ട് മാറ്റിയില്ല; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തിനുപകരം Yahweh-യോട് അടുത്ത മലയാള ശബ്ദാന്തരം സ്വീകരിച്ചു.
- issue: ദേശത്തെ യാഹ്‌വെ ‘പ്രഹരിച്ചു’ എന്ന രൂപകം
  choice: പ്രഹരിച്ച ദേശം
  alternative: തോൽപ്പിച്ച ദേശം / അവിടത്തെ ജനങ്ങളെ തോൽപ്പിച്ച ദേശം
  rationale: മൂലപാഠം ദേശത്തെയാണ് ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി അവതരിപ്പിക്കുന്നത്. അതിലെ ലാക്ഷണികതയും ദൈവിക ന്യായവിധിയുടെ ശക്തിയും വിശദീകരിച്ച് പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. മോശെയോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ സ്വീകരിച്ചു. ‘സഭ’ എന്ന പദത്തിന് സഭാസംഘടന എന്ന ആധുനിക അർഥം മാത്രം വരാതിരിക്കാൻ ജനസമൂഹം എന്ന ബദൽ അടിക്കുറിപ്പിൽ നൽകി; മൃഗസമ്പത്തിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വിശാലതയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
