id: NUM.32.22
reference: Numbers 32:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: ml
  text: ദേശം യഹോവയുടെ മുമ്പാകെ കീഴടക്കപ്പെടുകയും, അതിനുശേഷം നിങ്ങൾക്കു മടങ്ങിപ്പോകാം; അങ്ങനെ നിങ്ങൾ യഹോവയോടും ഇസ്രായേലിനോടും ഉള്ള ബാധ്യതയിൽനിന്ന് വിമുക്തരായിരിക്കും[a]. ഈ ദേശം യഹോവയുടെ മുമ്പാകെ നിങ്ങൾക്കുള്ള അവകാശസ്വത്തായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹോവയുടെയും ഇസ്രായേലിന്റെയും മുമ്പാകെ കുറ്റമില്ലാത്തവരായിരിക്കും” അല്ലെങ്കിൽ “നിരപരാധികളായിരിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: ദേശം കീഴടക്കപ്പെട്ടശേഷം
  rationale: നിഫാൽ രൂപത്തിന്റെ കർമണിപ്രയോഗവും, ദേശം നിയന്ത്രണത്തിലാക്കപ്പെടുന്നതെന്ന സൈനികസന്ദർഭവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ മുമ്പാകെ
  rationale: לִפְנֵי എന്നതിന്റെ സാന്നിധ്യപരവും ഉടമ്പടി-ന്യായപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: ശേഷം നിങ്ങൾക്കു മടങ്ങിപ്പോകാം
  rationale: നിബന്ധന നിറവേറ്റിയതിനുശേഷമുള്ള കാലക്രമവും അനുവദിക്കപ്പെട്ട മടക്കവും വ്യക്തമാക്കുന്നു.
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: യഹോവയോടും ഇസ്രായേലിനോടും ഉള്ള ബാധ്യതയിൽനിന്ന് നിങ്ങൾ ഒഴിവുള്ളവരായിരിക്കും
  rationale: נָקִי എന്ന പദത്തിന്റെ കുറ്റമില്ലായ്മ/ബാധ്യതയിൽനിന്നുള്ള വിമുക്തി എന്നീ അർഥങ്ങളിൽ, പ്രതിജ്ഞാബദ്ധമായ കടമ നിറവേറ്റുന്ന ഈ സന്ദർഭത്തിന് അനുയോജ്യമായ ബാധ്യതാഭാവം മുന്നോട്ടുകൊണ്ടുവരുന്നു.
- source_word: לַאֲחֻזָּה
  choice: അവകാശഭൂമിയായി
  rationale: അחֻזָּה സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ഭൂസ്വത്തും അവകാശബന്ധവും ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: എബ്രായ വ്യക്തിനാമത്തെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരരൂപത്തിൽ നിലനിർത്തുന്നു; ഒരു സ്ഥാനപ്പേര് കൊണ്ട് പകരംവയ്ക്കുന്നില്ല.
- issue: נְקִיִּים എന്നതിന്റെ ഉടമ്പടി-സന്ദർഭാർഥം
  choice: ബാധ്യതയിൽനിന്ന് ഒഴിവുള്ളവർ
  alternative: കുറ്റമില്ലാത്തവർ / നിരപരാധികൾ
  rationale: യഹോവയോടും ഇസ്രായേലിനോടും ഏറ്റെടുത്ത സൈനികകടമ പൂർത്തിയാക്കിയ ശേഷമുള്ള ഉത്തരവാദിത്വവിമുക്തിയാണ് സന്ദർഭത്തിലെ പ്രധാന ഭാവം; എന്നാൽ പദത്തിന്റെ കുറ്റമില്ലായ്മ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. മുഖ്യവാക്യത്തിൽ ബാധ്യതാവിമുക്തി വ്യക്തമാക്കുകയും എബ്രായത്തിലെ ന്യായപരമായ ‘കുറ്റമില്ലാത്തവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
