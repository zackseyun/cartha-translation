  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: ml
  text: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ട് കയറിവന്ന പുരുഷന്മാരിൽ ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള ആരും, അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും കൊടുക്കുമെന്ന് ഞാൻ ശപഥം ചെയ്ത ദേശം കാണുകയില്ല[a]. കാരണം, അവർ എന്നെ പൂർണമായി അനുഗമിച്ചില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥമായി ‘അവർ ദേശം കാണുമെങ്കിൽ’ എന്ന ശപഥസൂത്രമാണ്; ഇതിൽ ശക്തമായ നിഷേധം അടങ്ങിയിരിക്കുന്നു: ‘തീർച്ചയായും ആരും ദേശം കാണുകയില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവർ എന്റെ പിന്നാലെ പൂർണമായി നടന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ആരും ... കാണുകയില്ല
  rationale: ശപഥസന്ദർഭത്തിലെ אִם അപൂർണമായി പ്രസ്താവിച്ച ശക്തമായ നിഷേധശപഥമാണ്; മലയാളത്തിൽ അർത്ഥം വ്യക്തവും ഗൗരവമുള്ളതുമായി നൽകാൻ ‘ആരും ... കാണുകയില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാർ
  rationale: എബ്രായപദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; ജനഗണനയ്ക്കും സൈനികപ്രായത്തിനും ബന്ധപ്പെട്ട പശ്ചാത്തലവും ഈ തിരഞ്ഞെടുപ്പിനെ പിന്തുണയ്ക്കുന്നു.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: ഈജിപ്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന
  rationale: പുറപ്പാടിന്റെ സന്ദർഭത്തിൽ עלה מן എന്ന പ്രയോഗം ‘ഈജിപ്തിൽനിന്ന് കയറിവന്നവർ’ എന്ന ആശയം വഹിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘പുറപ്പെട്ടുവന്ന’ എന്നു നൽകി.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: പ്രായപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ അർത്ഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: הָאֲדָמָה
  choice: ദേശം
  rationale: ഇവിടെ പദം മണ്ണിനെയല്ല, പിതാക്കന്മാർക്ക് ശപഥംചെയ്ത വാഗ്ദത്തപ്രദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נִשְׁבַּעְתִּי
  choice: ശപഥംചെയ്ത
  rationale: ദൈവിക പ്രതിജ്ഞയുടെ ഔപചാരികതയും ഗൗരവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: അബ്രാഹാമിനും യിസ്ഹാക്കിനും യാക്കോബിനും
  rationale: ഓരോ പേരോടുമുള്ള എബ്രായ ദാതൃവിഭക്തിയുടെ ആവർത്തനം മലയാളത്തിലെ ‘-നും’ പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
- source_word: כִּי
  choice: കാരണം
  rationale: വിധിക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന കാര്യകാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: അവർ എന്നെ പൂർണമായി അനുഗമിച്ചില്ല
  rationale: מלא אחרי എന്ന പ്രയോഗത്തിന്റെ ‘പൂർണമായി പിന്നാലെ ചെല്ലുക/അനുഗമിക്കുക’ എന്ന ബന്ധാത്മക അർത്ഥം വ്യാഖ്യാനവിപുലീകരണം കൂടാതെ നൽകുന്നു.
theological_decisions:
- issue: אִם ആരംഭിക്കുന്ന നിഷേധശപഥത്തിന്റെ പരിഭാഷ
  choice: ആരും ... കാണുകയില്ല
  alternative: അവർ ... ദേശം കാണുമെങ്കിൽ
  rationale: മൂലത്തിലെ ‘എങ്കിൽ’ എന്ന രൂപം അപൂർണ നിഷേധശപഥമാണ്. അക്ഷരാർഥരൂപം മലയാളവായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാനിടയുള്ളതിനാൽ, അതിന്റെ ശക്തമായ നിഷേധാർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി; രൂപപരമായ സവിശേഷത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: לֹא מִלְאוּ אַחֲרַי എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: അവർ എന്നെ പൂർണമായി അനുഗമിച്ചില്ല
  alternative: അവർ എന്നോടു പൂർണവിശ്വസ്തരായിരുന്നില്ല
  rationale: മൂലപാഠം ‘അനുഗമിക്കൽ’ എന്ന ബന്ധാത്മക രൂപകമാണ് ഉപയോഗിക്കുന്നത്; അതിനെ വിശ്വസ്തത എന്ന വിശാലമായ ദൈവശാസ്ത്രവിഭാഗത്തിലേക്ക് മാറ്റാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ശപഥത്തിന്റെ ശക്തി വ്യക്തമായി നൽകി; എബ്രായത്തിലെ അപൂർണ ശപഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ‘പുരുഷന്മാർ’ എന്ന ലിംഗനിർദ്ദിഷ്ട പദവും ‘പൂർണമായി അനുഗമിക്കുക’ എന്ന മൂലപ്രയോഗവും നിലനിർത്തി.
