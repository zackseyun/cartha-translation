  terminology: ‘പുരുഷന്മാർ,’ ‘ദേശം,’ and ‘പൂർണമായി അനുഗമിച്ചില്ല’ accurately preserve the gender-specific, territorial, and idiomatic senses respectively. The existing footnotes are correctly anchored and adequately explain both the oath formula and the final idiom.
