source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: ml
  text: യഹ്‌വേയുടെ കോപം ഇസ്രായേലിനെതിരെ ജ്വലിച്ചു; യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ തിന്മ ചെയ്ത ആ തലമുറ മുഴുവനും അവസാനിക്കുന്നതുവരെ അവിടുന്ന് അവരെ നാൽപ്പത് വർഷം മരുഭൂമിയിൽ അലഞ്ഞുനടക്കുമാറാക്കി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യഹ്‌വേ ഇസ്രായേലിനോട് കോപിച്ചു.’ എബ്രായ ഭാഷാശൈലിയിൽ അക്ഷരാർഥം ‘യഹ്‌വേയുടെ മൂക്ക്/കോപം ജ്വലിച്ചു’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവരെ മരുഭൂമിയിൽ അലയാൻ ഇടയാക്കി.’ എബ്രായ ക്രിയയ്ക്ക് വ്യക്തമായ കാരണാർത്ഥമുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: യഹ്‌വേയുടെ കോപം ... ജ്വലിച്ചു
  rationale: ‘കോപം കത്തുക’ എന്ന എബ്രായ ദൃശ്യഭാഷയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനെതിരെ
  rationale: കോപത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന בְ എന്ന മുൻപ്രത്യയത്തിന്റെ സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: וַיְנִעֵם
  choice: അവരെ ... അലഞ്ഞുനടക്കുമാറാക്കി
  rationale: נוע എന്ന ധാതുവിന്റെ ഹിഫീൽ കാരണാർത്ഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാടിന്റെയും മരുഭൂപ്രയാണത്തിന്റെയും പശ്ചാത്തലത്തിൽ מִדְבָּר എന്ന പദത്തിന്റെ സാധാരണ മലയാളരൂപം.
- source_word: אַרְבָּעִים שָׁנָה
  choice: നാൽപ്പതു വർഷം
  rationale: സംഖ്യയും കാലദൈർഘ്യവും നേരിട്ട് പകരുന്നു.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: ആ തലമുറ മുഴുവനും ഇല്ലാതാകുന്നതുവരെ
  rationale: תֹּם സൂചിപ്പിക്കുന്ന പൂർണമായ അവസാനത്തെ, ന്യായവിധിയിൽ തലമുറയുടെ അന്ത്യം എന്ന സന്ദർഭാർത്ഥത്തോടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעֹשֶׂה הָרַע
  choice: തിന്മ ചെയ്ത
  rationale: സമൂഹവാചിയായ ‘തലമുറ’യെ വിശേഷിപ്പിക്കുന്ന ഏകവചന പങ്കാളിത്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി നൽകുന്നു.
- source_word: בְּעֵינֵי יְהוָה
  choice: യഹ്‌വേയുടെ ദൃഷ്ടിയിൽ
  rationale: ‘യഹ്‌വേയുടെ കണ്ണുകളിൽ’ എന്ന എബ്രായ മൂലപ്രയോഗത്തിന്റെ വിലയിരുത്തൽസംബന്ധിയായ അർഥം മലയാളത്തിൽ പരിചിതമായ ബൈബിൾഭാഷയിൽ പകരുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: പദവിനാമം പകരംവയ്ക്കാതെ മൂലപാഠത്തിലെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- issue: ദൈവകോപത്തിന്റെ ചിത്രീകരണം
  choice: യഹ്‌വേയുടെ കോപം ... ജ്വലിച്ചു
  alternative: യഹ്‌വേ ഇസ്രായേലിനോട് കോപിച്ചു
  rationale: കോപം ‘കത്തുന്നു’ എന്ന മൂലപാഠത്തിന്റെ ശക്തമായ രൂപകം മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
- issue: മരുഭൂമിയിലെ അലച്ചിലിൽ ദൈവത്തിന്റെ കാരകത്വം
  choice: അവിടുന്ന് അവരെ ... അലഞ്ഞുനടക്കുമാറാക്കി
  alternative: അവർ മരുഭൂമിയിൽ അലഞ്ഞുനടന്നു
  rationale: ഹിഫീൽ ക്രിയാരൂപത്തിലെ വ്യക്തമായ കാരണാർത്ഥവും ന്യായവിധിയുടെ ദൈവിക പ്രവർത്തകത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ബൈബിൾശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ കാരകത്വവും ‘ജ്വലിച്ചു’ എന്ന ദൃശ്യഭാഷയും സംരക്ഷിച്ചിട്ടുണ്ട്.
