  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: ml
  text: 'അന്ന് യഹ്‌വേയുടെ[a] കോപം ജ്വലിച്ചു; അവൻ ഇങ്ങനെ ശപഥം ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; ഇതിനെ ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר ... אַף
  choice: കോപം ജ്വലിച്ചു
  rationale: חרה אף എന്ന എബ്രായ പ്രയോഗം കോപം ചൂടുപിടിക്കുന്നതോ കത്തുന്നതോ സൂചിപ്പിക്കുന്നു. ‘കോപം ജ്വലിച്ചു’ എന്നത് ആ രൂപകം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തെ മലയാളലിപിയിൽ നൽകുന്നു.
- source_word: בַּיּוֹם הַהוּא
  choice: അന്ന്
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ ‘ആ ദിവസം’ എന്നതിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ് ‘അന്ന്’.
- source_word: וַיִּשָּׁבַע
  choice: സത്യം ചെയ്തു
  rationale: שׁבע എന്ന നിഫാൽ ക്രിയയുടെ ‘ശപഥം ചെയ്യുക’ എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘പ്രതിജ്ഞ ചെയ്തു’ എന്നത് ഇവിടെ അല്പം വ്യത്യസ്ത ഭാവം നൽകാം.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന ശപഥവചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ നിർമാണം മലയാളത്തിൽ ‘ഇങ്ങനെ ... ചെയ്തു:’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ നാമം ലിപ്യന്തരണം ചെയ്യുന്നു. ‘യഹോവ’ പരമ്പരാഗതമായ മറ്റൊരു രൂപമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. തുടർന്നുള്ള ഉദ്ധരണിയിലേക്ക് നയിക്കാൻ വാക്യാവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
