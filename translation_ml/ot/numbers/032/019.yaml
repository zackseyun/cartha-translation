  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: ml
  text: യോർദ്ദാനക്കരെയും അതിനപ്പുറവും അവരോടൊപ്പം ഞങ്ങൾ അവകാശം പ്രാപിക്കുകയില്ല; കാരണം ഞങ്ങളുടെ അവകാശം യോർദ്ദാന്റെ കിഴക്കേ കരയിൽ ഞങ്ങൾക്കു ലഭിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִנְחַל
  choice: ഞങ്ങൾ അവകാശം പ്രാപിക്കുകയില്ല
  rationale: നחל എന്ന ക്രിയയുടെ ഭൂവിഭജനസന്ദർഭത്തിലെ ‘അവകാശമായി ലഭിക്കുക/കൈവശമാക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഭാവികാലപ്രസ്താവനയും നിലനിർത്തുന്നു.
- source_word: אִתָּם
  choice: അവരോടൊപ്പം
  rationale: മറ്റു ഗോത്രങ്ങളോടൊത്തു ഒരേ ഭൂവിഭജനത്തിൽ പങ്കുചേരില്ലെന്ന ആശയം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: യോർദ്ദാനക്കരെ അതിനപ്പുറം
  rationale: מֵעֵבֶר എന്ന ‘അക്കരെ’ എന്ന ദിശാസൂചനയും וָהָלְאָה എന്ന ‘അതിനപ്പുറം/തുടർന്ന്’ എന്ന ഘടകവും ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: ഞങ്ങളുടെ അവകാശം ഞങ്ങൾക്കു ലഭിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘ഞങ്ങളിലേക്കു വന്നിരിക്കുന്നു’ എന്നതിനു പകരം ഭൂവിഹിതം ലഭിച്ചതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; പൂർത്തിയായ ലഭ്യത perfect ക്രിയയിലൂടെ നിലനിർത്തുന്നു.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: യോർദ്ദാന്റെ കിഴക്കേ കരയിൽ
  rationale: സംസാരിക്കുന്നവരുടെ കാഴ്ചപ്പാടിൽ യോർദ്ദാന്റെ കിഴക്കുഭാഗത്തെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിലെ ‘കര’ നദിയുടെ ഭൂമിശാസ്ത്രപരമായ വശം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും പുലർത്തുന്ന ശൈലി. ‘അവകാശം’ ആവർത്തിക്കുന്നത് എബ്രായത്തിലെ נחל/נחלה പദബന്ധവും ഉടമ്പടി-ഭൂവിഹിതത്തിന്റെ ആശയവും സംരക്ഷിക്കുന്നു. കിഴക്കൻ പ്രദേശത്തെ വ്യക്തമായി പറയുന്നതിനാൽ ദിശാസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
