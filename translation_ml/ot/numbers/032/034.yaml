  text: וַ/יִּבְנ֣וּ בְנֵי גָ֔ד אֶת דִּיבֹ֖ן וְ/אֶת עֲטָרֹ֑ת וְ/אֵ֖ת עֲרֹעֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: ml
  text: ഗാദിന്റെ മക്കൾ[b] ദീബോൻ, അതാരോത്ത്, അരോവേർ എന്നീ പട്ടണങ്ങൾ പണിതു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ സന്ദർഭത്തിൽ ‘വീണ്ടും പണിതു’ എന്നോ ‘കോട്ടകെട്ടി ഉറപ്പിച്ചു’ എന്നോ മനസ്സിലാക്കാം; എന്നാൽ എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിതു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഗാദിന്റെ മക്കൾ’; അതായത്, ഗാദ് ഗോത്രത്തിലെ അംഗങ്ങൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: പണിതു
  rationale: בנה എന്ന എബ്രായ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘പണിയുക’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ പട്ടണങ്ങൾ വീണ്ടും പണിതെന്നോ കോട്ടകെട്ടി ഉറപ്പിച്ചെന്നോ സൂചന ഉണ്ടായേക്കാമെങ്കിലും, ആ ആശയങ്ങൾ ക്രിയയിൽത്തന്നെ നിർബന്ധമായി അടങ്ങിയിട്ടില്ല.
- source_word: בְנֵי גָד
  choice: ഗാദിന്റെ മക്കൾ
  rationale: ‘ഗാദിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന എബ്രായ ബന്ധപ്രയോഗം നിലനിർത്തുന്നു. ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഗാദ് ഗോത്രത്തിലെ അംഗങ്ങളെയാണ്; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֶת
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന വ്യാകരണചിഹ്നമാണ്; മലയാളത്തിൽ ഇതിന് സ്വതന്ത്ര പദസമാനം ആവശ്യമില്ല.
- source_word: דִּיבֹן
  choice: ദീബോൻ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: עֲטָרֹת
  choice: അതാരോത്ത്
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: עֲרֹעֵר
  choice: അരോവേർ
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം ഉപയോഗിച്ചു. പട്ടികയിലെ പേരുകൾ പട്ടണങ്ങളാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നീ പട്ടണങ്ങൾ’ ചേർത്തു; ഇത് സന്ദർഭത്തിൽനിന്നുള്ള വ്യക്തീകരണമാണ്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
