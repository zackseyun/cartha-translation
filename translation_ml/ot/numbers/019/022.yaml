id: NUM.19.22
reference: Numbers 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: ml
  text: അശുദ്ധനായ വ്യക്തി തൊടുന്നതെല്ലാം അശുദ്ധമാകും[a]; അതിനെ തൊടുന്ന വ്യക്തി സന്ധ്യവരെ അശുദ്ധതയിലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതിനെ തൊടുന്ന ഏതൊരാളും സന്ധ്യവരെ അശുദ്ധതയിലായിരിക്കും.” എബ്രായത്തിലെ നെഫെഷ് എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘പ്രാണൻ’ എന്നാണെങ്കിലും, അത് പലപ്പോഴും ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: തൊടുന്നതെല്ലാം
  rationale: כֹל אֲשֶׁר എന്ന സമഗ്രമായ ബന്ധപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: יִגַּע בּוֹ
  choice: തൊടുന്നത്
  rationale: נגע ഇവിടെ ആചാരപരമായ സമ്പർക്കത്തെ സൂചിപ്പിക്കുന്നു; ‘തൊടുക’ അതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
- source_word: הַטָּמֵא
  choice: അശുദ്ധനായ വ്യക്തി
  rationale: വിശേഷണം ഇവിടെ നാമമായി ഉപയോഗിച്ച് ആചാരപരമായി അശുദ്ധനായ ഒരാളെ സൂചിപ്പിക്കുന്നു; ‘വ്യക്തി’ ചേർക്കുന്നത് മലയാളത്തിൽ പരാമർശം വ്യക്തമാക്കുന്നു.
- source_word: יִטְמָא
  choice: അശുദ്ധമാകും
  rationale: തൊടപ്പെട്ടത് ആചാരപരമായ അശുദ്ധാവസ്ഥയിലാകുന്നു എന്ന ഫലാവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: וְהַנֶּפֶשׁ
  choice: അതിനെ തൊടുന്ന വ്യക്തി
  rationale: נֶפֶשׁ നിയമപരമായ ഈ സന്ദർഭത്തിൽ മുഴുവൻ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് തെറ്റിദ്ധാരണ സൃഷ്ടിക്കും.
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: സന്ധ്യവരെ അശുദ്ധനായിരിക്കും
  rationale: ആ വ്യക്തിയുടെ ആചാരപരമായ അശുദ്ധാവസ്ഥയും അതിന്റെ കാലപരിധിയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: טמא എന്ന പദത്തിന്റെ ആചാരപരമായ അർഥം
  choice: അശുദ്ധൻ / അശുദ്ധം
  alternative: മലിനൻ / പാപിയായ
  rationale: ഈ വാക്യം സ്പർശത്തിലൂടെ പകരുന്ന ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചാണ്; ധാർമ്മിക കുറ്റമോ പാപമോ വാക്യം പ്രസ്താവിക്കുന്നില്ല.
- issue: נֶפֶשׁ എന്ന പദത്തിന്റെ വ്യക്തിസൂചന
  choice: വ്യക്തി
  alternative: ആത്മാവ്
  rationale: ഇവിടെ പദം ശരീരത്തിൽനിന്ന് വേർതിരിച്ച ആത്മാവിനെയല്ല, തൊടുന്ന മനുഷ്യവ്യക്തിയെ മുഴുവനായും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അശുദ്ധം’ എന്നത് ധാർമ്മിക പാപത്തെക്കാൾ ആചാരപരമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ ഉപയോഗിച്ചു.
