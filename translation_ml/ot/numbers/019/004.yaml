  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതനായ എലെയാസാർ തന്റെ വിരൽകൊണ്ട് അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ച് എടുത്ത്, സമാഗമകൂടാരത്തിന്റെ മുൻവശത്തേക്ക്[a] അതിന്റെ രക്തത്തിൽനിന്ന് കുറച്ച് ഏഴു പ്രാവശ്യം തളിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ.’ എബ്രായ പ്രയോഗം കൂടാരത്തിന്റെ മുൻഭാഗത്തേക്കുള്ള ദിശയെ സൂചിപ്പിക്കുന്നു.'
