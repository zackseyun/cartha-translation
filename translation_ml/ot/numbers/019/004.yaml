- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാർ
  rationale: വ്യക്തിനാമവും പദവിയും സ്വാഭാവികമായ മലയാള ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: מִדָּמָהּ
  choice: അതിന്റെ രക്തത്തിൽ കുറച്ച്
  rationale: מִן എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ഭാഗികാർഥം നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ പശുക്കിടാവിനെയാണ് ‘അതിന്റെ’ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּאֶצְבָּעוֹ
  choice: തന്റെ വിരൽകൊണ്ട്
  rationale: בְּ എന്ന ഉപസർഗത്തിന്റെ ഉപകരണാർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: പുരോഹിതചടങ്ങുകളിൽ נזה സൂചിപ്പിക്കുന്ന രക്തം തളിക്കുന്ന പ്രവൃത്തിക്ക് യോജിച്ച സാധാരണ മലയാള പദം.
- source_word: אֶל נֹכַח פְּנֵי
  choice: മുൻവശത്തേക്ക്
  rationale: കൂടാരത്തിനുള്ളിലേക്കല്ല, അതിന്റെ മുഖം അഥവാ മുൻഭാഗം ലക്ഷ്യമാക്കിയുള്ള ദിശയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: വിശുദ്ധകൂടാരത്തിന്റെ ഈ പേരിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഉറവിടത്തോട് ചേർന്നതുമായ പരിഭാഷ.
- source_word: שֶׁבַע פְּעָמִים
  choice: ഏഴു പ്രാവശ്യം
  rationale: സംഖ്യയും ആവർത്തനവും നേരിട്ട് നിലനിർത്തുന്നു.
