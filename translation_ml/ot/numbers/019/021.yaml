id: NUM.19.21
reference: Numbers 19:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: ml
  text: 'ഇത് അവർക്കു സ്ഥിരമായ ഒരു ചട്ടമായിരിക്കും: അശുദ്ധിവെള്ളം[a] തളിക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; അശുദ്ധിവെള്ളം തൊടുന്നവൻ വൈകുന്നേരം വരെ അശുദ്ധനായിരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അശുദ്ധിവെള്ളം’ എന്നത് ‘അശുദ്ധിയിൽനിന്ന് ശുദ്ധീകരിക്കുന്ന വെള്ളം’ എന്നും വിവർത്തനം ചെയ്യാം; പരമ്പരാഗതമായി, ‘വേർതിരിവിന്റെ വെള്ളം.’ എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അശുദ്ധിയുടെ വെള്ളം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: ഇത് അവർക്കു ശാശ്വതമായ ഒരു ചട്ടമായിരിക്കണം
  rationale: മുൻസന്ദർഭത്തിലെ നിയമത്തെ സൂചിപ്പിക്കാൻ വ്യാകരണത്തിൽ അന്തർലീനമായ വിഷയം ‘ഇത്’ എന്നു വ്യക്തമാക്കുന്നു. חֻקַּת עוֹלָם എന്നത് തുടർന്നുനിൽക്കുന്ന നിയമബാധ്യതയെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ നിയമഭാഷയിൽ ‘ശാശ്വതമായ ഒരു ചട്ടം’ എന്നു നൽകി.
- source_word: וּמַזֵּה
  choice: തളിക്കുന്നവൻ
  rationale: ഹിഫിൽ വർത്തമാനകൃദന്തം ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ വെള്ളം തളിക്കുന്ന പ്രവൃത്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: מֵי הַנִּדָּה
  choice: അശുദ്ധിനീർ
  rationale: എബ്രായത്തിലെ ‘അശുദ്ധിയുടെ ജലം’ എന്ന സങ്കുചിത ഘടനയും ആചാരപരമായ അശുദ്ധിയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു. ഇത് നൈതിക കുറ്റമല്ല; ശവസ്പർശം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തിന് ഒരുക്കിയ വെള്ളമാണ്. വ്യാഖ്യാനപരമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: നിയമപരമായ നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കഴുകണം’ എന്നു നൽകി; בְּגָדָיוയിലെ സ്വാമിത്വം ‘തന്റെ’ എന്നു വ്യക്തമാക്കി.
- source_word: וְהַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം മുൻവാക്യത്തിലെ ‘തളിക്കുന്നവൻ’ എന്നതിന് സമാന്തരമായി വിവർത്തനം ചെയ്തു.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: വൈകുന്നേരംവരെ അശുദ്ധനായിരിക്കും
  rationale: יִטְמָא ആചാരപരമായ അശുദ്ധസ്ഥിതിയെ സൂചിപ്പിക്കുന്നു; സമയപരിധി മലയാളത്തിൽ സ്വാഭാവികമായി ‘വൈകുന്നേരംവരെ’ എന്നു നൽകി.
theological_decisions:
- issue: സംഖ്യാപുസ്തകം 19-ലെ ആചാരപരമായ ശുദ്ധി-അശുദ്ധി പദപ്രയോഗം
  choice: ‘അശുദ്ധൻ’, ‘അശുദ്ധിനീർ’ എന്നീ പദങ്ങൾ ആചാരപരമായ അർഥത്തിൽ ഉപയോഗിക്കുക
  alternative: ‘വേർതിരിവിന്റെ വെള്ളം’ അല്ലെങ്കിൽ കൂടുതൽ വ്യാഖ്യാനപരമായി ‘അശുദ്ധിയിൽനിന്നു ശുദ്ധീകരിക്കുന്ന വെള്ളം’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുക
  rationale: ഇവിടെ വിഷയം നൈതിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധിയാണ്. ‘അശുദ്ധിനീർ’ മൂലപാഠത്തിലെ സങ്കുചിതത്വവും അർഥത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു; വായനസഹായിയായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തിയപ്പോൾ അനാവശ്യമായ പഴഞ്ചൊല്ലുകളും സഭാവിഭാഗവിശേഷ പദങ്ങളും ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ സൂചകം ബന്ധപ്പെട്ട വിവാദപദമായ ‘അശുദ്ധിനീർ’ ആവർത്തിക്കുന്ന വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
