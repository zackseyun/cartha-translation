id: NUM.19.10
reference: Numbers 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: ml
  text: പെൺപശുവിന്റെ ചാരം ശേഖരിക്കുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ കഴുകണം; സന്ധ്യവരെ അവൻ അശുദ്ധനായിരിക്കും. ഇത് ഇസ്രായേൽമക്കൾക്കും[a] അവരുടെ ഇടയിൽ പരദേശിയായി പാർക്കുന്നവനും നിത്യചട്ടമായിരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഇവിടെ ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘എന്നേക്കുമുള്ള ചട്ടം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: ശേഖരിക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ ഖാൽ വർത്തമാനകൃദന്തം ഇവിടെ ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപദമായി പ്രവർത്തിക്കുന്നു; ‘ശേഖരിക്കുന്നവൻ’ ആ കൃദന്തരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֵפֶר הַפָּרָה
  choice: പെൺപശുവിന്റെ ചാരം
  rationale: אֵפֶר ഇവിടെ സമൂഹാർഥത്തിൽ ‘ചാരം’ എന്നും פָּרָה പെൺവർഗത്തിലുള്ള പശുവെന്നും സൂചിപ്പിക്കുന്നു. ‘പെൺപശു’ ലിംഗസൂചന വ്യക്തമാക്കുകയും ‘പശുക്കിടാവ്’ എന്ന പ്രായസൂചന അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ കഴുകണം
  rationale: പുരോഹിതശുദ്ധിനിയമങ്ങളിൽ כִבֶּס വസ്ത്രം കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ നിർദേശം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കാൻ ‘കഴുകണം’ ഉപയോഗിച്ചു.
- source_word: וְטָמֵא
  choice: അവൻ അശുദ്ധനായിരിക്കും
  rationale: ഇത് ധാർമിക കുറ്റമല്ല, ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്. മൂലത്തിലെ അവസ്ഥാവാചക സ്വഭാവം ‘അശുദ്ധനായിരിക്കും’ നിലനിർത്തുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: കാലപരിധി മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְהָיְתָה
  choice: ഇത് ... ആയിരിക്കണം
  rationale: സ്ത്രീലിംഗ ഏകവചനക്രിയ മുൻപുള്ള നിയമക്രമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ സൂചകം വ്യക്തമാക്കാൻ ‘ഇത്’ ഉപയോഗിച്ചു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബബന്ധപരവും സമൂഹത്തെ മുഴുവൻ സൂചിപ്പിക്കുന്നതുമായ നിയമഭാഷ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പരദേശിയായി പാർക്കുന്നവന്
  rationale: גֵּר സ്വദേശിയല്ലെങ്കിലും സമൂഹത്തിനുള്ളിൽ സ്ഥിരമായി പാർക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. നാമത്തിന്റെയും കൃദന്തത്തിന്റെയും ആവർത്തനം ‘പരദേശിയായി പാർക്കുന്നവൻ’ എന്ന രൂപത്തിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: לְחֻקַּת עוֹלָם
  choice: നിത്യചട്ടമായി
  rationale: חֻקָּה സ്ഥിരമായി പാലിക്കേണ്ട ചട്ടത്തെയും עוֹלָם ദീർഘകാലികമോ നിരന്തരമോ ആയ പ്രാബല്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘നിത്യചട്ടം’ നിയമശൈലിയും കാലവ്യാപ്തിയും ചുരുക്കമായി നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹവാചകത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേൽജനം
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബബന്ധപരമായ രൂപം മലയാളത്തിലെ പതിവായ സമൂഹവാചകമായ ‘ഇസ്രായേൽമക്കൾ’ വഴി നിലനിർത്തി; ഇത് മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയും സൂചിപ്പിക്കുന്നു.
- issue: ആചാരപരമായ അശുദ്ധിയുടെ ഭാഷ
  choice: അശുദ്ധനായിരിക്കും
  alternative: ആചാരപരമായി അശുദ്ധനായിരിക്കും
  rationale: മൂലപാഠം അശുദ്ധിയുടെ സ്വഭാവം വിശദീകരിക്കാതെ טָמֵא എന്ന നിയമപരമായ പദം മാത്രം ഉപയോഗിക്കുന്നു. സന്ദർഭം അതിന്റെ ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: עוֹלָם എന്നതിന്റെ കാലവ്യാപ്തി
  choice: നിത്യ
  alternative: എന്നേക്കുമുള്ള
  rationale: നിയമസൂത്രങ്ങളിൽ ഈ പദം തുടർച്ചയായോ സ്ഥിരമായോ ഉള്ള പ്രാബല്യം സൂചിപ്പിക്കാം. ‘നിത്യ’ അതിനെ നിർബന്ധിതമായി തത്ത്വശാസ്ത്രപരമായ അനന്തതയായി വ്യാഖ്യാനിക്കാതെ ഗൗരവമുള്ള നിയമഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. കൃത്രിമമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ആചാരശുദ്ധി, സമൂഹപരമായ ഉടമ്പടിഭാഷ, നിയമത്തിന്റെ ദീർഘകാല പ്രാബല്യം എന്നിവയുടെ സവിശേഷതകൾ സംരക്ഷിച്ചു.
