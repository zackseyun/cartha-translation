revisions:
- from: പിന്നെ പുരോഹിതൻ ദേവദാരുമരക്കഷണവും ഈസോപ്പുചെടിയും കടുംചുവപ്പുനൂലും എടുത്ത് പശുവിനെ ദഹിപ്പിക്കുന്നതിന്റെ നടുവിലേക്ക് എറിയണം.[a]
  to: പിന്നെ പുരോഹിതൻ ദേവദാരുമരവും ഈസോപ്പുചെടിയും കടുംചുവപ്പുനൂലും എടുത്ത് പശുവിന്റെ ദഹനത്തിന്റെ നടുവിലേക്ക് എറിയണം.[a]
  rationale: The revision retains the source’s ritual sequence and ambiguity regarding פָּרָה while replacing an agentive Malayalam construction with a faithful process noun, removing an unwarranted specification of the cedar wood, and correcting the footnote’s inaccurate ‘calf’ terminology.
