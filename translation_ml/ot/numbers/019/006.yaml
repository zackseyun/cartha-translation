id: NUM.19.6
reference: Numbers 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ദേവദാരുമരവും ഈസോപ്പുചെടിയും കടുംചുവപ്പുനൂലും എടുത്ത് പശുവിന്റെ ദഹനത്തിന്റെ നടുവിലേക്ക് എറിയണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുവപശുവിന്റെ ദഹനത്തിന്റെ നടുവിലേക്ക്.” ഇവിടെ פָּרָה എന്ന എബ്രായപദം പെൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗത പരിഭാഷകളിൽ ഇതിനെ പലപ്പോഴും ‘യുവപശു’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... എടുത്ത്
  rationale: വാവ് ചേർന്ന ഖാതൽ രൂപം ആചാരക്രമത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിന്നെ ... എടുത്ത്’ എന്നത് ആ ക്രമാനുഗതത്വം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘എറിയണം’ വിധിനിർദേശഭാവം വഹിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമസന്ദർഭത്തിലെ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം; നിശ്ചിതത്വം സന്ദർഭത്തിലും കർത്തൃപ്രത്യയത്തിലും വ്യക്തമാകുന്നു.
- source_word: עֵץ אֶרֶז
  choice: ദേവദാരുമരക്കഷണം
  rationale: അക്ഷരാർഥത്തിൽ ‘ദേവദാരുവിന്റെ മരം.’ കത്തിച്ചുകൊണ്ടിരിക്കുന്ന മൃഗത്തിലേക്ക് ഇടുന്ന വസ്തുവാണെന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികവും വസ്തുവിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നതുമായ ‘മരക്കഷണം’ ഉപയോഗിച്ചു.
- source_word: וְאֵזוֹב
  choice: ഈസോപ്പുചെടി
  rationale: സസ്യത്തിന്റെ കൃത്യമായ തിരിച്ചറിയൽ വിവാദമായതിനാൽ പരമ്പരാഗത പേരായ ‘ഈസോപ്പ്’ നിലനിർത്തി; സാധാരണ വായനക്കാരന് ഇത് ഒരു സസ്യമാണെന്ന് വ്യക്തമാക്കാൻ ‘ചെടി’ ചേർത്തു.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: കടുംചുവപ്പുനൂൽ
  rationale: പദസമുച്ചയം കീടത്തിൽനിന്നുള്ള ചായവുമായി ബന്ധപ്പെട്ട കടുംചുവപ്പുനിറമുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ആചാരോപകരണസന്ദർഭത്തിൽ ‘നൂൽ’ യോജിക്കുന്നു; ‘പുഴു’ എന്ന അക്ഷരാർഥഘടകം തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ നിറത്തിന്റെ അർഥം മുൻനിർത്തി.
- source_word: וְהִשְׁלִיךְ
  choice: എറിയണം
  rationale: שלך എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘എറിയുക/വലിച്ചെറിയുക’ എന്നാണ്. ആചാരവിധിയുടെ നിർദേശഭാവം മലയാളത്തിൽ ‘എറിയണം’ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל תּוֹךְ
  choice: നടുവിലേക്ക്
  rationale: ലളിതമായ ‘അകത്തേക്ക്’ എന്നതിലുപരി ഉള്ളിലോ മധ്യത്തിലോ ഇടുന്നതെന്ന ഊന്നൽ ഈ പ്രയോഗത്തിനുണ്ട്; ‘നടുവിലേക്ക്’ അത് സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: പശുവിനെ ദഹിപ്പിക്കുന്നതിന്റെ
  rationale: שְׂרֵפָה തീയെ മാത്രമല്ല, ദഹിപ്പിക്കൽപ്രക്രിയയെ സൂചിപ്പിക്കുന്നു. פָּרָה പെൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നതിനാൽ പൊതുവായും സ്വാഭാവികവുമായ ‘പശു’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ചുവന്ന പശുവിന്റെ ശുദ്ധീകരണാചാരത്തിൽ פָּרָה എന്നതിന്റെ പരിഭാഷ
  choice: പശു
  alternative: പശുക്കിടാവ് / യുവപശു
  rationale: എബ്രായപദം പെൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ പ്രായം പ്രത്യേകം ഊന്നുന്നില്ല. അതിനാൽ അധികനിർണ്ണയം ഒഴിവാക്കി സാധാരണ മലയാളമായ ‘പശു’ ഉപയോഗിച്ചു; പരമ്പരാഗതമായി പ്രായസൂചനയോടെ പരിഭാഷപ്പെടുത്താവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആചാരവിധിശൈലി. മുഖ്യവാക്യത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വ്യത്യസ്ത പരിഭാഷ അടിക്കുറിപ്പുമായി ചേർത്തിരിക്കുന്നു.
