    issue: Added possessive in “അതിലെ എല്ലാ പാത്രങ്ങൾ”
    rationale: The Hebrew says “on the tent and on all the vessels,” without stating that the vessels are in or belong to the tent. The relation may be contextually plausible, but it should not be made explicit in an optimal-equivalence translation.
  - severity: low
    issue: No Malayalam footnote support for the lexical distinction between the slain and the generally dead
    rationale: The translation itself retains the distinction, but a brief note makes the deliberate rendering of חָלָל transparent and preserves the relevant English POB audit-trail concern.
