source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: ml
  text: അപ്പോൾ ആചാരപരമായി ശുദ്ധനായ ഒരു പുരുഷൻ ഈസോപ്പുചെടി എടുത്ത് ആ വെള്ളത്തിൽ മുക്കി, കൂടാരത്തിന്മേലും എല്ലാ പാത്രങ്ങളിന്മേലും അവിടെ ഉണ്ടായിരുന്ന ആളുകളിന്മേലും, ഒരു അസ്ഥിയെയോ കൊല്ലപ്പെട്ട ഒരാളുടെ ശരീരത്തെയോ[a] മരിച്ച ഒരാളെയോ കല്ലറയെയോ തൊട്ടവന്റെമേലും തളിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കൊല്ലപ്പെട്ടവൻ.” ഹീബ്രു പദം ഹിംസാത്മകമായി കൊല്ലപ്പെട്ട ഒരാളെ സൂചിപ്പിക്കുന്നു; തുടർന്നുവരുന്ന പൊതുവായ “മരിച്ച ഒരാൾ” എന്നതിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: ഈസോപ്പുചെടി
  rationale: ശുദ്ധീകരണച്ചടങ്ങിൽ ഉപയോഗിക്കുന്ന സസ്യത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത സസ്യനാമം നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് ഒരു ചെടിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: בַּמַּיִם
  choice: ആ വെള്ളത്തിൽ
  rationale: ഹീബ്രുവിലെ നിർദിഷ്ടത നിലനിർത്തുകയും മുമ്പ് തയ്യാറാക്കിയ അശുദ്ധിനീരെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אִישׁ טָהוֹר
  choice: ആചാരപരമായി ശുദ്ധനായ ഒരു പുരുഷൻ
  rationale: പുരുഷ ഏകവചനവും ആചാരശുദ്ധിയുടെ പശ്ചാത്തലവും ഒരുപോലെ വ്യക്തമാക്കുന്നു; ധാർമിക നിഷ്കളങ്കത എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: ശുദ്ധീകരണജലം തുള്ളികളായി പ്രയോഗിക്കുന്ന ആചാരക്രിയയ്ക്കുള്ള സ്വാഭാവിക മലയാളപദം.
- source_word: הָאֹהֶל
  choice: കൂടാരം
  rationale: മരണം സംഭവിച്ച താമസക്കൂടാരമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; സമാഗമകൂടാരമല്ല.
- source_word: הַכֵּלִים
  choice: പാത്രങ്ങൾ
  rationale: ഉപകരണങ്ങളെയും പാത്രങ്ങളെയും ഉൾക്കൊള്ളാവുന്ന പദമാണെങ്കിലും ഈ ആചാരസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സമാനപദം.
- source_word: הַנְּפָשׁוֹת
  choice: ആളുകൾ
  rationale: ഇവിടെ ‘ജീവൻ/ആത്മാവ്’ എന്നല്ല, കൂടാരത്തിൽ ഉണ്ടായിരുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַנֹּגֵעַ
  choice: തൊട്ടവൻ
  rationale: ഹീബ്രു കൃതന്തത്തിന്റെ ഏകവചന വ്യക്തിസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בָּעֶצֶם
  choice: ഒരു അസ്ഥി
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ മനുഷ്യന്റെ ഏതെങ്കിലും അസ്ഥിയുമായുള്ള സമ്പർക്കമാണ് അർത്ഥം; ഹീബ്രുവിലെ രൂപപരമായ നിർദിഷ്ടത ഇവിടെ നിർബന്ധമായി ‘ആ അസ്ഥി’ എന്നു പറയേണ്ടതില്ല.
- source_word: בֶחָלָל
  choice: കൊല്ലപ്പെട്ട ഒരാളുടെ ശരീരം
  rationale: ഹിംസാത്മകമായി കൊല്ലപ്പെട്ടവനെ സൂചിപ്പിക്കുന്ന പ്രത്യേക അർത്ഥം വ്യക്തമാക്കുകയും അടുത്തുള്ള പൊതുവായ ‘മരിച്ചയാൾ’ എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בַמֵּת
  choice: മരിച്ച ഒരാൾ
  rationale: חָלָל എന്ന പ്രത്യേക പദത്തേക്കാൾ പൊതുവായ മരണസൂചന നിലനിർത്തുന്നു.
- source_word: בַקָּבֶר
  choice: കല്ലറ
  rationale: ശവസംസ്കാരസ്ഥലത്തിനുള്ള സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
theological_decisions:
- issue: ആചാരശുദ്ധിയെ സൂചിപ്പിക്കുന്ന טָהוֹר
  choice: ആചാരപരമായി ശുദ്ധനായ
  alternative: ശുദ്ധനായ
  rationale: മൃതശരീരസമ്പർക്കത്തിൽനിന്നുള്ള ആചാരപരമായ അശുദ്ധിയാണ് വിഷയം; ധാർമിക വിശുദ്ധിയെന്ന അർത്ഥം ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- issue: אִישׁ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: ഒരു പുരുഷൻ
  alternative: ഒരാൾ
  rationale: മൂലപാഠത്തിലെ പുരുഷ ഏകവചനം നിലനിർത്തുന്നു; അതേസമയം ശുദ്ധിയായിരിക്കണമെന്നതാണ് ഈ ചുമതലയുടെ മുഖ്യയോഗ്യത.
- issue: חָלָל, מֵת എന്നീ മരണപദങ്ങളുടെ വ്യത്യാസം
  choice: കൊല്ലപ്പെട്ട ഒരാളുടെ ശരീരം / മരിച്ച ഒരാൾ
  alternative: കൊല്ലപ്പെട്ടവൻ / മൃതശരീരം
  rationale: ആദ്യത്തേതിലെ ഹിംസാത്മക മരണത്തിന്റെ പ്രത്യേകതയും രണ്ടാമത്തേതിലെ പൊതുവായ മരണസൂചനയും തമ്മിലുള്ള പാഠഭേദം മായ്ച്ചുകളയാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ dignified, വായനാസൗകര്യമുള്ള വാക്യഘടന. ‘ആചാരപരമായി’ എന്ന ചേർക്കൽ ശുദ്ധി ധാർമികമല്ല, ചടങ്ങുസംബന്ധമാണെന്ന് വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലെ പട്ടികയും ആവർത്തനഘടനയും പരമാവധി നിലനിർത്തിയിട്ടുണ്ട്.
