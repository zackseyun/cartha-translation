id: NUM.19.8
reference: Numbers 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: ml
  text: അതിനെ ചുട്ടുകളയുന്നവൻ തന്റെ വസ്ത്രങ്ങൾ വെള്ളത്തിൽ കഴുകുകയും തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം[a]. അവൻ വൈകുന്നേരംവരെ അശുദ്ധനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടിടത്തും ‘വെള്ളംകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായഭാഷയിൽ അക്ഷരാർഥം ‘വെള്ളത്തിൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അശുദ്ധൻ’ എന്നത് ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; അത് നിർബന്ധമായും ധാർമിക കുറ്റത്തെ സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף
  choice: ചുട്ടുകളയുന്നവൻ
  rationale: നിശ്ചയാർഥകമായ ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തം ചുട്ടുകളയുന്ന പ്രവൃത്തി ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ നടപടിക്രമത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֹתָהּ
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചന കർമപ്രത്യയം മുമ്പ് പറഞ്ഞ ചുവന്ന പശുക്കിടാവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ നടപടിക്രമസന്ദർഭത്തിന് ‘അതിനെ’ സ്വാഭാവികമാണ്.
- source_word: יְכַבֵּס
  choice: കഴുകുകയും വേണം
  rationale: ആചാരനിയമത്തിലെ അപൂർണക്രിയയ്ക്ക് നിർദേശാത്മക ശക്തിയുണ്ട്. ‘വേണം’ നിയമപരമായ ബാധ്യത വ്യക്തമായി നൽകുന്നു.
- source_word: בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ
  rationale: ആ വ്യക്തിയുടെ വസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കർത്താവിലേക്കുള്ള മടക്കസൂചനയായി ‘തന്റെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בַּמַּיִם
  choice: വെള്ളത്തിൽ
  rationale: ബേത് ഉപസർഗവും നിർദേശാർട്ടിക്കിളും ചേർന്ന രൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘വെള്ളത്തിൽ’ എന്നാണ്. രണ്ടു പ്രാവശ്യവും ഒരേ രൂപം നിലനിർത്തി എബ്രായ ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: וְרָחַץ
  choice: കുളിക്കുകയും
  rationale: ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ മലയാളത്തിൽ ‘കുളിക്കുക’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വസ്ത്രങ്ങൾ ‘കഴുകുക’ എന്ന മുൻക്രിയയിൽനിന്നുള്ള എബ്രായ പദവ്യത്യാസവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: בְּשָׂרוֹ
  choice: ശരീരം
  rationale: בשר എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മാംസം’ എന്നു വരാമെങ്കിലും, ഈ ശുദ്ധീകരണസന്ദർഭത്തിൽ വ്യക്തിയുടെ ശരീരത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: וְטָמֵא
  choice: അശുദ്ധനായിരിക്കും
  rationale: ഇത് ആ പ്രവൃത്തിക്കുശേഷമുള്ള ആചാരപരമായ അവസ്ഥയെ പ്രസ്താവിക്കുന്നു. ‘അശുദ്ധനായിരിക്കും’ അവസ്ഥയും അതിന്റെ തുടർച്ചയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: עַד הָעָרֶב
  choice: വൈകുന്നേരംവരെ
  rationale: ആചാരപരമായ അശുദ്ധിയുടെ കാലപരിധിയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘സൂര്യാസ്തമയംവരെ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന טמא എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അശുദ്ധൻ
  alternative: ആചാരപരമായി അശുദ്ധൻ
  rationale: പൗരോഹിത്യനിയമങ്ങളുടെ സന്ദർഭത്തിൽ ഈ പദം ധാർമിക കുറ്റത്തെ നിർബന്ധമായും സൂചിപ്പിക്കാതെ ആചാരപരമായ നിലയെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായ ‘അശുദ്ധൻ’ നിലനിർത്തി അതിന്റെ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള നിയമനടപടി ശൈലി ഉപയോഗിച്ചു. വസ്ത്രം കഴുകുന്നതും ശരീരം കുളിക്കുന്നതും തമ്മിലുള്ള മൂലഭാഷയിലെ ക്രിയാവ്യത്യാസം നിലനിർത്തി; ‘വെള്ളത്തിൽ’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു.
