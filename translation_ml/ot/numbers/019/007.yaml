reference: Numbers 19:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും തന്റെ ശരീരം വെള്ളത്തിൽ കഴുകുകയും വേണം. അതിനുശേഷം അയാൾക്ക് പാളയത്തിൽ പ്രവേശിക്കാം[a]. എന്നാൽ പുരോഹിതൻ സന്ധ്യവരെ അശുദ്ധനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാളയത്തിൽ പ്രവേശിക്കും.” ഹീബ്രു ക്രിയയെ കഴുകലിനുശേഷമുള്ള അനുവദനീയമായ പുനഃപ്രവേശനമായോ ലളിതമായ ഭാവിക്രിയയായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “അശുദ്ധൻ” എന്നത് ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; വ്യക്തിപരമായ പാപമോ ധാർമിക കുറ്റമോ അനിവാര്യമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: כִּבֵּס എന്ന ക്രിയ വസ്ത്രങ്ങൾ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വസ്ത്രങ്ങൾ അലക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്. നിയമപരമായ നടപടിക്രമത്തിന്റെ നിർബന്ധസ്വഭാവം ‘വേണം’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: ശരീരം വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: בָּשָׂר ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ‘മാംസം’ എന്നതിലുപരി മുഴുവൻ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. רחץ കൂടെ വന്നതിനാൽ ‘വെള്ളത്തിൽ കുളിക്കുക’ സന്ദർഭോചിതമാണ്.
- source_word: וְאַחַר
  choice: അതിനു ശേഷം
  rationale: ശുദ്ധീകരണനടപടികളുടെ ക്രമം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: അയാൾക്ക് പാളയത്തിൽ പ്രവേശിക്കാം
  rationale: ഇവിടത്തെ imperfect രൂപം കഴുകലിനു ശേഷമുള്ള പുനഃപ്രവേശനം അനുവദിക്കുന്നതായി സന്ദർഭത്തിൽ ഗ്രഹിക്കാം. ‘പ്രവേശിക്കാം’ ഈ അനുമതിഭാവം സ്വാഭാവികമായി നൽകുന്നു; നിർബന്ധം ചുമത്തുന്നില്ല.
- source_word: וְטָמֵא הַכֹּהֵן
  choice: പുരോഹിതൻ അശുദ്ധനായിരിക്കും
  rationale: טמא ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആചാരപരമായി’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ‘അശുദ്ധൻ’ നിലനിർത്തുന്നു.
- source_word: עַד הָעָרֶב
  choice: സന്ധ്യവരെ
  rationale: സമയപരിധി ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘അശുദ്ധൻ’ എന്ന പദം നിലനിർത്തി, അത് ആചാരപരമായ നിലയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു
  alternative: ധാർമിക കുറ്റമോ പാപമോ സൂചിപ്പിക്കുന്ന അശുദ്ധി
  rationale: സംഖ്യാപുസ്തകം 19-ന്റെ ശുദ്ധീകരണച്ചടങ്ങുകളുടെ പശ്ചാത്തലത്തിൽ טמא താൽക്കാലികമായ ആചാരപരമായ അശുദ്ധിയെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിപരമായ പാപമോ ധാർമിക കുറ്റമോ ഇതിലൂടെ അനിവാര്യമായി ഉദ്ദേശിക്കുന്നില്ല.
- issue: പാളയത്തിലേക്കുള്ള പ്രവേശനത്തിന്റെ ഭാവം
  choice: ‘പ്രവേശിക്കാം’ എന്ന അനുവദനീയ ഭാവം
  alternative: ‘പ്രവേശിക്കും’ അല്ലെങ്കിൽ ‘പ്രവേശിക്കണം’
  rationale: കഴുകലിനു ശേഷം പാളയത്തിലേക്കു മടങ്ങാനുള്ള അനുമതിയായി ക്രിയയെ വായിക്കുന്നത് സന്ദർഭോചിതമാണ്; എങ്കിലും ഹീബ്രു രൂപത്തിന് ലളിതമായ ഭാവിക്രിയയായും വായിക്കാവുന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആചാര ശൈലി. ‘വസ്ത്രങ്ങൾ അലക്കുക,’ ‘വെള്ളത്തിൽ കുളിക്കുക,’ ‘സന്ധ്യവരെ’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. മൂലത്തിലെ നടപടിക്രമക്രമവും അനുമതിഭാവത്തിലെ സാധ്യതയും ആചാരപരമായ അശുദ്ധിയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചിട്ടുണ്ട്.
