  source_fidelity: 'The draft accurately represents the procedural requirements: laundering garments, washing the body in water, subsequent entry into the camp, and ritual impurity until evening. The permissive rendering of יָבֹא is defensible and its alternate future sense is appropriately retained in a note.'
