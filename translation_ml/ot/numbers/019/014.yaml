source:
  edition: WLC
  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: ml
  text: 'ഇതാണ് ന്യായപ്രമാണം: ഒരു മനുഷ്യൻ ഒരു കൂടാരത്തിൽ മരിച്ചാൽ, ആ കൂടാരത്തിലേക്ക് പ്രവേശിക്കുന്ന ഏവനും അതിൽ ഉള്ള ഏവനും[a] ഏഴ് ദിവസം അശുദ്ധനായിരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൂടാരത്തിലുള്ള എല്ലാവരും/എല്ലാം.” എബ്രായപ്രയോഗത്തിന് ആളുകളെക്കാൾ വിപുലമായ അർഥം വരാം. സന്ദർഭത്തിൽ കൂടാരത്തിലുള്ള ആളുകളെയാണ് പ്രധാനമായി ഉദ്ദേശിക്കുന്നതെന്നു വായിക്കാം; തുറന്ന പാത്രങ്ങളെക്കുറിച്ച് അടുത്ത വാക്യത്തിൽ പ്രത്യേകം പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: ഇതാണ് ന്യായപ്രമാണം
  rationale: ശവസ്പർശം മൂലമുള്ള അശുദ്ധിയെ സംബന്ധിച്ച ബാധകമായ ചട്ടമാണ് ഇവിടെ תּוֹרָה അവതരിപ്പിക്കുന്നത്. ‘ന്യായപ്രമാണം’ നിയമപരവും ആചാരപരവുമായ സന്ദർഭത്തിന് യോജിച്ച, പരിചിതമായ മലയാളപ്രയോഗമാണ്.
- source_word: אָדָם כִּי יָמוּת
  choice: ഒരു മനുഷ്യൻ ... മരിച്ചാൽ
  rationale: אָדָם ഇവിടെ ഏകവചനത്തിലുള്ള പൊതുസൂചകമാണ്. כִּי നിയമത്തിലെ ഒരു സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപമായ ‘മരിച്ചാൽ’ ഉപയോഗിച്ചു.
- source_word: בְּאֹהֶל
  choice: ഒരു കൂടാരത്തിൽവെച്ച്
  rationale: ആദ്യ പരാമർശത്തിൽ എബ്രായത്തിൽ നിർദേശക ഉപപദമില്ല; അതിനാൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന ‘ഒരു കൂടാരം’ നിലനിർത്തി. ‘വെച്ച്’ മരണം കൂടാരത്തിനകത്താണ് സംഭവിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: ആ കൂടാരത്തിനകത്തു പ്രവേശിക്കുന്ന ഏവനും
  rationale: പങ്കുപദരൂപം പൊതുവായി അവിടെ പ്രവേശിക്കുന്ന ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള നിർദിഷ്ട കൂടാരത്തെ ‘ആ കൂടാരം’ എന്ന് സ്വാഭാവികമായി തിരിച്ചുപറഞ്ഞു.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: അതിനകത്തുള്ള ഏവനും
  rationale: മുൻപുള്ള വ്യക്തിസൂചനയോടുള്ള സമാന്തരതയും ഏകവചന ക്രിയയും ഇവിടെ ആളുകളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നതെന്നു പിന്തുണയ്ക്കുന്നു. എന്നാൽ אֲשֶׁר എന്ന പ്രയോഗത്തിന് കൂടുതൽ വ്യാപകമായ അർഥസാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തി.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം അശുദ്ധനായിരിക്കും
  rationale: ആചാരപരമായ അശുദ്ധിയുടെ അവസ്ഥയും അതിന്റെ ദൈർഘ്യവും നേരിട്ട് വ്യക്തമാക്കുന്നു. വ്യക്തികളെ സൂചിപ്പിക്കുന്ന മുഖ്യവായനയോട് ഏകവചന പുല്ലിംഗ രൂപം യോജിക്കുന്നു.
