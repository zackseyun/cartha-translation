  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ വ്യക്തിസൂചന മുഖ്യപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട്, ആളുകളെയും വസ്തുക്കളെയും ഉൾക്കൊള്ളാവുന്ന യഥാർഥ എബ്രായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
