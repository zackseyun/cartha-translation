source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: ml
  text: മരിച്ച ഒരു മനുഷ്യന്റെ മൃതദേഹത്തെ തൊടുകയും സ്വയം ശുദ്ധീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നവൻ യഹോവയുടെ തിരുനിവാസത്തെ അശുദ്ധമാക്കിയിരിക്കുന്നു; ആ വ്യക്തി ഇസ്രായേലിൽനിന്ന് ഛേദിക്കപ്പെടും. അശുദ്ധി നീക്കാനുള്ള വെള്ളം[a] അയാളുടെമേൽ തളിക്കപ്പെട്ടിട്ടില്ലാത്തതിനാൽ അയാൾ അശുദ്ധനായിരിക്കും; അയാളുടെ അശുദ്ധി ഇപ്പോഴും അയാളിൽ നിലനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “അശുദ്ധിയുടെ വെള്ളം.” മൃതശരീരസ്പർശം മൂലമുള്ള അശുദ്ധി നീക്കാൻ ഉപയോഗിച്ചിരുന്ന വെള്ളത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: മരിച്ച ഒരു മനുഷ്യന്റെ ശവശരീരത്തെ തൊടുകയും
  rationale: നגע ശാരീരിക സ്പർശത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള സമാനാധികരണ പ്രയോഗം മനുഷ്യന്റെ മൃതദേഹമാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ, ആവർത്തനം ഒഴിവാക്കി അർഥം സ്വാഭാവികമായി മലയാളത്തിൽ സംയോജിപ്പിച്ചു.
- source_word: יִתְחַטָּא
  choice: സ്വയം ശുദ്ധീകരിക്കാതിരിക്കുകയും
  rationale: ഹിത്പയേൽ രൂപം ഇവിടെ ധാർമിക പശ്ചാത്താപമല്ല, ആചാരപരമായ ശുദ്ധീകരണമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִשְׁכַּן יְהוָה
  choice: യഹോവയുടെ തിരുനിവാസം
  rationale: מִשְׁכָּן ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥാനമായ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു. 'തിരുനിവാസം' ആ അർഥം മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: טִמֵּא
  choice: അശുദ്ധമാക്കുന്നു
  rationale: പിയേൽ രൂപം തിരുനിവാസത്തിന് ആചാരപരമായ അശുദ്ധി വരുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: ആ വ്യക്തിയെ ഇസ്രായേലിൽനിന്ന് ഛേദിച്ചുകളയണം
  rationale: נֶפֶשׁ ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. 'ഛേദിച്ചുകളയണം' എന്നത് ശിക്ഷയുടെ കൃത്യമായ രീതി നിർവചിക്കാതെ എബ്രായ ഉടമ്പടി-ശിക്ഷാസൂത്രം നിലനിർത്തുന്നു.
- source_word: מֵי נִדָּה
  choice: അശുദ്ധി നീക്കുന്നതിനുള്ള വെള്ളം
  rationale: മൃതശരീരസ്പർശം മൂലമുള്ള അശുദ്ധി നീക്കാൻ തയ്യാറാക്കിയ വെള്ളമാണിത്. അക്ഷരാർഥത്തിലെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് ലക്ഷ്യം വ്യക്തമായി പറയുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: זֹרַק עָלָיו
  choice: അയാളുടെമേൽ തളിക്കപ്പെട്ടിട്ടില്ലാത്തതിനാൽ
  rationale: ആചാരസന്ദർഭത്തിൽ זרה എന്നത് തളിക്കുക എന്നാണ്; എബ്രായത്തിലെ നിഷ്ക്രിയ ആശയം മലയാളത്തിലും നിലനിർത്തി.
- source_word: טָמֵא יִהְיֶה
  choice: അയാൾ അശുദ്ധനായിരിക്കും
  rationale: തുടരുന്ന ആചാരപരമായ നിലയെ ഔപചാരിക പ്രഖ്യാപനമായി അവതരിപ്പിക്കുന്നു.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: അയാളുടെ അശുദ്ധി ഇപ്പോഴും അയാളിൽ നിലനിൽക്കുന്നു
  rationale: עוֹד തുടർച്ചയെ സൂചിപ്പിക്കുന്നു; അശുദ്ധി വ്യക്തിയിൽ ശേഷിക്കുന്നു എന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: '''ഛേദിച്ചുകളയണം'' എന്ന ശിക്ഷാസൂത്രത്തിന്റെ അർഥം'
  choice: ശിക്ഷയുടെ രീതി വ്യക്തമാക്കാതെ ഉടമ്പടി-ശിക്ഷാസൂത്രം നിലനിർത്തുക
  alternative: വധിക്കണം; സമൂഹത്തിൽനിന്ന് പുറത്താക്കണം
  rationale: ഈ വാക്യത്തിലെ എബ്രായപ്രയോഗം മരണം, സമൂഹഭ്രഷ്ട്, സന്തതിയില്ലായ്മ എന്നിവയിൽ ഏതാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വയം നിർവചിക്കുന്നില്ല; അതിനാൽ അവ്യക്തത സംരക്ഷിച്ചു.
- issue: אָדָם എന്ന പൊതുവാചക ഏകവചനത്തിന്റെ വിവർത്തനം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി; ഒരു മനുഷ്യജീവി
  rationale: אָדָם ഇവിടെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ 'ഒരു മനുഷ്യൻ' ഉറവിടരൂപത്തോട് ചേർന്നുനിൽക്കുകയും പ്രയോഗസന്ദർഭത്തിൽ പൊതുവായ അർഥം നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആചാരപരമായ ശുദ്ധി–അശുദ്ധി വ്യത്യാസം വ്യക്തമായി സൂക്ഷിച്ചു; വിവാദമായ ശിക്ഷയുടെ സ്വഭാവം വിശദീകരിച്ച് തീർപ്പാക്കിയിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
