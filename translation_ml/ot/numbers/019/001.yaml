  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: ml
  text: 'യഹ്‌വേ മോശയോടും അഹരോനോടും അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഈ പതിവു വാക്യരീതിക്ക് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം; പുതിയ ആഖ്യാനസംഭവം അവതരിപ്പിക്കുന്ന ക്രിയയുടെ ബലം നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ മുൻപ്രത്യയം ഇരുവരെയും പ്രത്യേകം അഭിസംബോധിതരായി അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘-ഓടും ... -ഓടും’ ഘടന അത് സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമപ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ നാമം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ ഉടമ്പടിസംബന്ധമായ വ്യക്തിത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ വാക്യരീതി. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ലֵאמֹר എന്ന സൂത്രപ്രയോഗം അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയിലേക്കുള്ള ബന്ധമായി ദ്വിബിന്ദുവിലൂടെ പ്രകടമാക്കുന്നു.
