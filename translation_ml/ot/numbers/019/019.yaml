  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: ml
  text: ശുദ്ധനായ വ്യക്തി മൂന്നാം ദിവസവും ഏഴാം ദിവസവും അശുദ്ധനായ വ്യക്തിയുടെമേൽ അത് തളിക്കണം; അങ്ങനെ ഏഴാം ദിവസം അയാളെ ശുദ്ധീകരിക്കണം.[a] പിന്നെ അയാൾ തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും വെള്ളത്തിൽ കുളിക്കുകയും വേണം; സന്ധ്യയാകുമ്പോൾ അയാൾ ശുദ്ധനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ശുദ്ധീകരിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായ പീയേൽ ക്രിയയുടെ ധാതു സാധാരണയായി പാപം/തെറ്റുക എന്ന ആശയവുമായി ബന്ധപ്പെട്ടതാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ ക്രിയ ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അയാളുടെ അശുദ്ധി നീക്കണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: തളിക്കണം
  rationale: നזה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഈ ആചാരപരമായ സന്ദർഭത്തിൽ ശുദ്ധീകരണജലം തളിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘തളിക്കുക’ സ്വാഭാവികവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: ശുദ്ധനായ വ്യക്തി / അശുദ്ധനായ വ്യക്തി
  rationale: ഇവ വിശേഷണങ്ങളുടെ നാമപ്രയോഗങ്ങളാണ്; ഇവിടെ ശാരീരിക ശുചിത്വമല്ല, ആചാരപരമായ ശുദ്ധി–അശുദ്ധിയാണ് ഉദ്ദേശ്യം. ‘വ്യക്തി’ എന്നത് നിയമവാക്യത്തിലെ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: וְחִטְּאוֹ
  choice: അയാളെ ശുദ്ധീകരിക്കണം
  rationale: חטא എന്ന ധാതുവിന്റെ പീയേൽ രൂപം ഇവിടെ പാപമോചനത്തേക്കാൾ ആചാരപരമായ അശുദ്ധി നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: തന്റെ വസ്ത്രങ്ങൾ അലക്കുകയും
  rationale: വസ്ത്രങ്ങൾ വെള്ളത്തിൽ കഴുകുന്ന പ്രവൃത്തിക്ക് ആധുനിക മലയാളത്തിൽ ‘അലക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְרָחַץ בַּמַּיִם
  choice: വെള്ളത്തിൽ കുളിക്കുകയും
  rationale: ഈ ആചാരക്രമത്തിൽ רחץ ശരീരം വെള്ളത്തിൽ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘കുളിക്കുക’ അതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: וְטָהֵר בָּעָרֶב
  choice: സന്ധ്യയാകുമ്പോൾ അയാൾ ശുദ്ധനായിരിക്കും
  rationale: കഴുകലിനുശേഷം ആചാരപരമായ ശുദ്ധി പ്രാബല്യത്തിൽ വരുന്ന സമയത്തെ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חטא/טהר എന്നീ പദങ്ങളുടെ ശുദ്ധീകരണസന്ദർഭം
  choice: ആചാരപരമായ ശുദ്ധീകരണം സൂചിപ്പിക്കുന്ന ഭാഷ
  alternative: പാപത്തിൽനിന്നു ശുദ്ധീകരിക്കുക; പ്രായശ്ചിത്തം ചെയ്യുക
  rationale: സന്ദർഭം മൃതദേഹസമ്പർക്കത്തിൽനിന്നുള്ള അശുദ്ധിയും ശുദ്ധീകരണജലവും സംബന്ധിച്ചതാണ്. അതിനാൽ ധാർമിക കുറ്റമോ പ്രായശ്ചിത്തമോ വാക്യത്തിലേക്ക് ചേർക്കാതെ ആചാരപരമായ അർഥം നിലനിർത്തി.
- issue: הַטָּהֹר / הַטָּמֵא എന്ന പുല്ലിംഗ ഏകവചനരൂപങ്ങളുടെ പ്രതിനിധിപരമായ സ്വഭാവം
  choice: ‘വ്യക്തി’ എന്ന പൊതുവായ പദം
  alternative: ശുദ്ധനായ പുരുഷൻ / അശുദ്ധനായ പുരുഷൻ
  rationale: നിയമപരമായ ഈ നിർദേശത്തിൽ രൂപങ്ങൾ പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പങ്കാളിയെ പുരുഷനായി മാത്രം പരിമിതപ്പെടുത്തുന്നതല്ല; അതിനാൽ ഉറവിടത്തിന്റെ പൊതുവായ ഉദ്ദേശ്യം നിലനിർത്തി.
- issue: തുടർന്നുള്ള ഏകവചന സർവനാമങ്ങളുടെ സൂചിതവ്യക്തി
  choice: ‘അയാൾ’ എന്ന സർവനാമം ഉപയോഗിച്ച് ഉറവിടത്തിലെ സൂചനയുടെ സംക്ഷിപ്തത നിലനിർത്തുക
  alternative: അശുദ്ധനായിരുന്ന വ്യക്തി തന്റെ വസ്ത്രങ്ങൾ അലക്കി കുളിക്കണം
  rationale: എബ്രായത്തിൽ വിഷയം വീണ്ടും വ്യക്തമായി നാമകരണം ചെയ്യുന്നില്ല. സന്ദർഭം ശുദ്ധീകരിക്കപ്പെടുന്ന വ്യക്തിയിലേക്കാണ് സ്വാഭാവികമായി നയിക്കുന്നതെങ്കിലും, വിവർത്തനത്തിൽ അതിനെ അനാവശ്യമായി വിശദീകരിച്ചുറപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ നിയമ–ആചാര നിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘അത്’ മുൻസന്ദർഭത്തിലെ ശുദ്ധീകരണജലത്തെ സൂചിപ്പിക്കുന്നതായി നിലനിർത്തി; എബ്രായത്തിലെ സർവനാമബന്ധം അനാവശ്യമായി വികസിപ്പിച്ചില്ല.
