  language: ml
  text: തുറന്നുകിടക്കുന്ന ഓരോ പാത്രവും, അതിന്മേൽ കെട്ടിയുറപ്പിച്ച മൂടിയില്ലെങ്കിൽ, അശുദ്ധമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉറപ്പിച്ച അടപ്പ്’ എന്നോ ‘മുദ്രവെച്ച മൂടി’ എന്നോ പരിഭാഷപ്പെടുത്താം; പാത്രത്തിന്മേൽ ഉറപ്പിച്ച ഒരു ആവരണത്തെയാണ് ഹീബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: എല്ലാ
  rationale: כֹל ഏകവചന നാമത്തോടൊപ്പം വിതരണാർഥത്തിൽ ‘എല്ലാ/ഓരോ’ എന്നു വരുന്നു; വാക്യത്തിന്റെ തുടർച്ച മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാണ്.
- source_word: כְּלִי
  choice: പാത്രം
  rationale: ഈ ശുദ്ധിനിയമത്തിന്റെ സാഹചര്യത്തിൽ തുറന്നുകിടക്കാവുന്ന ഒരു receptacle എന്ന അർഥത്തിന് ‘പാത്രം’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: פָתוּחַ
  choice: തുറന്നിരിക്കുന്ന
  rationale: ‘തുറന്ന’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള മൂടിയില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ഉപവാക്യവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר אֵין
  choice: ഇല്ലാതെ
  rationale: യോഗ്യത നിർണ്ണയിക്കുന്ന അഭാവത്തെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: צָמִיד פָּתִיל
  choice: കെട്ടിയുറപ്പിച്ച മൂടി
  rationale: ബന്ധിച്ചോ ഉറപ്പിച്ചോ വെച്ച ആവരണത്തെ സൂചിപ്പിക്കുന്ന അപൂർവ സംയുക്തപ്രയോഗത്തിന്റെ ഭൗതികചിത്രം നിലനിർത്തുന്നു; കൃത്യമായ പുരാതന സംവിധാനം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: עָלָיו
  choice: (പാത്രത്തിന്മേൽ എന്ന അർഥം ‘മൂടി’ എന്ന പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു)
  rationale: മലയാളത്തിലെ ‘മൂടി ഇല്ലാതെ’ എന്ന പ്രയോഗം മൂടി പാത്രത്തിന്മേലായിരിക്കണമെന്ന ബന്ധം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: טָמֵא הוּא
  choice: അശുദ്ധമാണ്
  rationale: ഹീബ്രായിലെ അശുദ്ധാവസ്ഥയെ വിശദീകരണപദം ചേർക്കാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധമാണ്
  alternative: ആചാരപരമായി അശുദ്ധമാണ്
  rationale: സന്ദർഭം ആചാരശുദ്ധിയെക്കുറിച്ചാണെങ്കിലും മൂലപാഠം ‘അശുദ്ധം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വിശദീകരണപരമായ ‘ആചാരപരമായി’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: צָמִיד פָּתִיל എന്ന പ്രയോഗത്തിന്റെ കൃത്യരൂപം
  choice: കെട്ടിയുറപ്പിച്ച മൂടി
  alternative: ഉറപ്പിച്ച അടപ്പ് / മുദ്രവെച്ച മൂടി
  rationale: മൂടി എങ്ങനെ ഉറപ്പിച്ചിരുന്നു എന്നതു പൂർണമായി നിർണ്ണയിക്കാതെ മൂലത്തിലെ ബന്ധിക്കൽ/ഉറപ്പിക്കൽ ആശയം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമവാക്യശൈലി. ‘പാത്രം’, ‘മൂടി’, ‘അശുദ്ധം’ എന്നീ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സാങ്കേതിക അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
