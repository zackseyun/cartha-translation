id: NUM.19.9
reference: Numbers 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: ml
  text: ആചാരപരമായി ശുദ്ധനായ ഒരാൾ പെൺപശുവിന്റെ ചാരം ശേഖരിച്ച് പാളയത്തിനു പുറത്തുള്ള ശുദ്ധമായ ഒരു സ്ഥലത്ത് വെക്കണം. ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിനുവേണ്ടി അത് അശുദ്ധി നീക്കാനുള്ള വെള്ളത്തിനായി[a] സൂക്ഷിച്ചുവെക്കണം; അത് പാപയാഗമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അശുദ്ധിയുടെ വെള്ളത്തിനായി”; അല്ലെങ്കിൽ, “ശുദ്ധീകരണവെള്ളത്തിനായി.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അത് ശുദ്ധീകരണയാഗമാണ്.” എബ്രായപദമായ חַטָּאת പാപയാഗത്തെയും പുരോഹിതാചാരസന്ദർഭങ്ങളിൽ ശുദ്ധീകരണത്തിനുള്ള യാഗത്തെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: ആചാരപരമായി ശുദ്ധനായ ഒരാൾ
  rationale: אִישׁ ഏകവചനത്തിലുള്ള പുരുഷനെ സൂചിപ്പിക്കുന്നു; ആചാരസന്ദർഭത്തിലെ טָהוֹר എന്നതിന്റെ അർഥം വ്യക്തമാക്കാൻ ‘ആചാരപരമായി ശുദ്ധനായ’ എന്നു നൽകി.
- source_word: אָסַף
  choice: ശേഖരിച്ച്
  rationale: ക്രമമായി തുടരുന്ന ആചാരനിർദേശത്തെ സ്വാഭാവിക മലയാളത്തിൽ തുടർപ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: אֵפֶר הַפָּרָה
  choice: പശുക്കിടാവിന്റെ ചാരം
  rationale: אֵפֶר സമൂഹാർഥകമായി ‘ചാരം’; פָּרָה പെൺകന്നുകാലിയെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിലെ യാഗമൃഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: וְהִנִּיחַ
  choice: വെക്കണം
  rationale: വെക്കുക/സ്ഥാപിക്കുക എന്ന അടിസ്ഥാനാർഥവും നിയമപരമായ നിർദേശഭാവവും നിലനിർത്തുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്ത്
  rationale: ഈ സന്ദർഭത്തിൽ പ്രയോഗം സ്ഥാനസൂചകമാണ്.
- source_word: בְּמָקוֹם טָהוֹר
  choice: ശുദ്ധമായ ഒരു സ്ഥലത്ത്
  rationale: ആചാരപരമായ ശുദ്ധത സന്ദർഭത്തിൽ വ്യക്തമാണ്; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ രൂപം.
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: അത് ... സൂക്ഷിച്ചുവെക്കണം
  rationale: ചാരം സമൂഹാർഥകമായതിനാൽ ഏകവചന സൂചകമായ ‘അത്’ സ്വാഭാവികമാണ്; לְמִשְׁמֶרֶת എന്നതിലെ കാവൽ/കരുതിവെക്കൽ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിനുവേണ്ടി
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന ഉറവിടപ്രയോഗവും עֲדָה എന്ന സമൂഹാർഥവും നിലനിർത്തുന്നു.
- source_word: לְמֵי נִדָּה
  choice: അശുദ്ധി നീക്കാനുള്ള വെള്ളത്തിനായി
  rationale: נִדָּה ഇവിടെ ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; വെള്ളത്തിന്റെ ശുദ്ധീകരണപ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു, എന്നാൽ ഘടനാപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: חַטָּאת הִוא
  choice: അത് പാപയാഗമാണ്
  rationale: חַטָּאת എന്നതിന് ‘പാപയാഗം’ എന്ന പരമ്പരാഗതവും നിഘണ്ടുപരമായി സാധുവുമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ശുദ്ധീകരണയാഗം എന്ന ആചാരപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ശുദ്ധീകരണാചാരസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അത് പാപയാഗമാണ്
  alternative: അത് ശുദ്ധീകരണയാഗമാണ്
  rationale: חַטָּאת പാപത്തെയും പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെയും സൂചിപ്പിക്കാം; പുരോഹിതാചാരഗ്രന്ഥങ്ങളിൽ അതിന് ശുദ്ധീകരണപ്രവർത്തനവും ഉണ്ട്. പരമ്പരാഗത പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തിക്കൊണ്ട് യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന dignified നിയമ-ആചാരശൈലി. ആചാരപരമായ ശുദ്ധി/അശുദ്ധി വ്യക്തമാക്കിയിട്ടുണ്ട്; ഉറവിടത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
