source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: ml
  text: തുറസ്സായ വയലിൽ[a] വാളാൽ കൊല്ലപ്പെട്ട ഒരാളെയോ, ഒരു മൃതദേഹത്തെയോ[b], ഒരു മനുഷ്യന്റെ അസ്ഥിയെയോ[c], ഒരു കല്ലറയെയോ തൊടുന്ന ഏതൊരാളും ഏഴു ദിവസം അശുദ്ധിയുടെ അവസ്ഥയിലായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ പദാനുപദമായി ‘വയലിന്റെ മുഖത്തിന്മേൽ’; തുറസ്സായ വയലിൽ അഥവാ വെളിമ്പ്രദേശത്ത് എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘മരിച്ച ഒരാൾ’ അല്ലെങ്കിൽ ‘ശവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ പദാനുപദമായി ‘ഒരു മനുഷ്യന്റെ അസ്ഥി’; ഇവിടെ പുരുഷനെ മാത്രം അല്ല, മനുഷ്യാവശിഷ്ടത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: തൊടുന്ന ആരും
  rationale: כֹל എന്ന പദവും അനുബന്ധവാക്യവും ചേർന്ന് ഇവിടെ പൊതുവായ നിയമവ്യവസ്ഥയിലെ ‘ആരെങ്കിലും/ആരും’ എന്ന സർവവ്യാപക അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘തൊടുന്ന ആരും’ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: തുറസ്സായ വയലിൽവെച്ച്
  rationale: പദാനുപദമായി ‘വയലിന്റെ മുഖത്തിന്മേൽ’ എന്നാണെങ്കിലും, കെട്ടിടത്തിനുള്ളിലല്ലാത്ത തുറസ്സായ സ്ഥലം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
- source_word: בַּחֲלַל חֶרֶב
  choice: വാളാൽ കൊല്ലപ്പെട്ട ഒരാളെ
  rationale: חָלָל കൊല്ലപ്പെട്ടതോ മാരകമായി കുത്തേറ്റതോ ആയ ഒരാളെ സൂചിപ്പിക്കുന്നു; חֶרֶב മരണത്തിനുള്ള ആയുധം വ്യക്തമാക്കുന്നു.
- source_word: אוֹ בְמֵת
  choice: ഒരു മൃതദേഹത്തെ
  rationale: מֵת എന്നതിന് ‘മരിച്ച വ്യക്തി’ എന്നും ‘മൃതശരീരം’ എന്നും അർഥമാകാം. അശുദ്ധിയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘മൃതദ്ദേഹം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: മനുഷ്യ അസ്ഥിയെ
  rationale: אָדָם ഇവിടെ പുരുഷനെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യ അസ്ഥി’ ആ പൊതുവായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: אוֹ בְקָבֶר
  choice: ഒരു കല്ലറയെ
  rationale: קֶבֶר എന്നത് കല്ലറയെയോ ശവസംസ്കാരസ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ നിയമസന്ദർഭത്തിൽ ‘കല്ലറ’ ഏറ്റവും നേരിട്ടുള്ള തുല്യപദമാണ്.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം അശുദ്ധരായിരിക്കും
  rationale: ക്രിയ പുരോഹിതനിയമത്തിലെ ആചാരപരമായ അശുദ്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘അശുദ്ധരായിരിക്കും’ നിയമത്തിന്റെ ഫലം വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യ
  alternative: പുരുഷൻ / ഒരു ആണിന്റെ
  rationale: ഈ ശുദ്ധിനിയമത്തിൽ ലിംഗഭേദമല്ല, മനുഷ്യാവശിഷ്ടമാണ് പ്രസക്തം. അതിനാൽ ഉറവിടത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തി പുരുഷലിംഗത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: יִטְמָא സൂചിപ്പിക്കുന്ന അശുദ്ധി
  choice: അശുദ്ധരായിരിക്കും
  alternative: മലിനരായിരിക്കും / അശുദ്ധരായി കണക്കാക്കപ്പെടും
  rationale: വാക്യം ആചാരപരമായ അശുദ്ധിയെക്കുറിച്ചുള്ള നിയമസന്ദർഭത്തിലാണ്. എന്നാൽ ഉറവിടം നൽകാത്ത വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ ‘അശുദ്ധി’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി സ്വീകരിച്ചു. ലിംഗനിരപേക്ഷമായ പൊതുവായ പ്രയോഗത്തിനായി ‘തൊടുന്ന ആരും … അശുദ്ധരായിരിക്കും’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്ന വിധത്തിൽ ബന്ധപ്പെട്ട മലയാളപദങ്ങൾക്ക് പിന്നാലെ ക്രമപ്പെടുത്തി.
