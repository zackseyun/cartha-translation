id: NUM.19.3
reference: Numbers 19:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: ml
  text: നിങ്ങൾ അതിനെ[b] പുരോഹിതനായ എലെയാസാരിനു കൊടുക്കണം. അവൻ അതിനെ പാളയത്തിനു പുറത്തേക്കു കൊണ്ടുപോകണം; അവന്റെ സന്നിധിയിൽവെച്ച് അതിനെ അറുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അറുക്കുന്നയാൾ ആരെന്ന് എബ്രായപാഠം വ്യക്തമായി പറയുന്നില്ല. ‘എലെയാസാർ അതിനെ അറുക്കണം’ എന്നും ഈ വാക്യം മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിലെ സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുമ്പ് പറഞ്ഞ ചുവന്ന പശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: നിങ്ങൾ ... കൊടുക്കണം
  rationale: നിയമപരമായ നിർദേശസന്ദർഭത്തിലെ ആജ്ഞാബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: אֹתָהּ
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുമ്പ് പറഞ്ഞ ചുവന്ന പശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ മൃഗത്തെ സൂചിപ്പിക്കാൻ ലിംഗനിരപേക്ഷമായ ‘അതിനെ’ സ്വാഭാവികമാണ്.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: പുരോഹിതനായ എലെയാസാരിനു
  rationale: പേരും പദവിയും സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നൽകുന്നു.
- source_word: וְהוֹצִיא
  choice: അവൻ അതിനെ ... പുറത്തേക്കു കൊണ്ടുപോകണം
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലുള്ള കാരകാർഥം—പുറത്തേക്കു കൊണ്ടുപോകുക—വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്കു
  rationale: ദിശ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായും കൃത്യമായും പകരുന്നു.
- source_word: וְשָׁחַט
  choice: അതിനെ അറുക്കണം
  rationale: ക്രിയയുടെ പുരുഷ ഏകവചന കർത്താവ് എബ്രായത്തിൽ പരോക്ഷമാണ്. മലയാളത്തിലെ കർത്താവില്ലാത്ത ഈ നിർദേശരൂപം അറുക്കുന്നയാൾ ആരെന്ന് നിർബന്ധമായി തീരുമാനിക്കാതെ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: לְפָנָיו
  choice: അവന്റെ സന്നിധിയിൽവെച്ച്
  rationale: ‘അവന്റെ മുമ്പിൽ’ എന്ന സ്ഥലാർഥത്തോടൊപ്പം ‘അവന്റെ സാന്നിധ്യത്തിൽ’ എന്ന ചടങ്ങുസംബന്ധിയായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിൽ അറുക്കുന്നയാളുടെ തിരിച്ചറിയൽ
  choice: അറുക്കൽ എലെയാസാരിന്റെ സന്നിധിയിൽ നടക്കുന്നു എന്നു പറയുന്നു; അറുക്കുന്നയാളെ മുഖ്യപാഠം പ്രത്യേകം തിരിച്ചറിയിക്കുന്നില്ല.
  alternative: എലെയാസാർ തന്നെയാണ് പശുവിനെ അറുക്കുന്നത് എന്നു മനസ്സിലാക്കി, ‘അവൻ അതിനെ അറുക്കണം’ എന്നു പരിഭാഷപ്പെടുത്താം.
  rationale: וְשָׁחַט എന്ന ക്രിയയ്ക്ക് പരോക്ഷമായ മൂന്നാംപുരുഷ ഏകവചന കർത്താവുണ്ട്; മുൻക്രിയയിലെ എലെയാസാർ തന്നെ കർത്താവായി തുടരാം. എന്നാൽ לְפָנָיו (‘അവന്റെ സന്നിധിയിൽ’) എന്ന പ്രയോഗം മറ്റൊരാൾ അറുക്കുകയും എലെയാസാർ സന്നിഹിതനായിരിക്കുകയും ചെയ്യുന്നതായും മനസ്സിലാക്കാം. അതിനാൽ മുഖ്യപാഠം ഈ യഥാർഥ അവ്യക്തത തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ‘പാളയം’, ‘പുരോഹിതൻ’, ‘സന്നിധി’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അറുക്കുന്നയാളെ സംബന്ധിച്ച മൂലപാഠത്തിലെ അവ്യക്തത കർത്താവില്ലാത്ത മലയാള നിർദേശരൂപത്തിലൂടെ സംരക്ഷിച്ചു.
