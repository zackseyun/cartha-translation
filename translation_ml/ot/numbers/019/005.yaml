  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇളംപശു.’ ഹീബ്രുവിലെ פָּרָה എന്ന പദം പെൺ ഗോമൃഗത്തെ സൂചിപ്പിക്കാം. ഇവിടെ ‘പശു’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളമാണ്; ഈ ചടങ്ങിന്റെ സന്ദർഭത്തിൽ ‘ഇളംപശു’ എന്നും പരിഭാഷപ്പെടുത്താം.
