- source_word: עֹרָהּ
  choice: അതിന്റെ തോൽ
  rationale: עוֹר എന്നത് മൃഗത്തിന്റെ പുറംചർമ്മമായ തോലിനെ സൂചിപ്പിക്കുന്നു; ശവശരീരസന്ദർഭത്തിൽ ‘തോൽ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בְּשָׂרָהּ
  choice: അതിന്റെ മാംസം
  rationale: בָּשָׂר എന്നതിന്റെ നേരിട്ടുള്ളതും ഈ യാഗനിയമസന്ദർഭത്തിന് അനുയോജ്യവുമായ പരിഭാഷയാണ് ‘മാംസം’.
- source_word: דָּמָהּ
  choice: അതിന്റെ രക്തം
  rationale: דָּם എന്ന പദവും അതോടു ചേർന്ന ഏകവചന സ്ത്രീലിംഗ പ്രത്യയവും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: עַל פִּרְשָׁהּ
  choice: ചാണകവും ഒന്നിച്ച്
  rationale: פֶּרֶשׁ പ്രത്യേകിച്ച് വിസർജ്യമായ ചാണകത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ עַל പട്ടികയിലെ മറ്റു ഘടകങ്ങളോടൊപ്പം അതും ദഹിപ്പിക്കണമെന്ന ഉൾപ്പെടുത്തൽ/സഹവർത്തിത്വ ഭാവം നൽകുന്നു.
- source_word: יִשְׂרֹף
  choice: അവൻ ദഹിപ്പിക്കണം
  rationale: നിയമനിർദേശത്തിലെ imperfect രൂപം ആവശ്യകത വ്യക്തമാക്കുന്നു. വാക്യാവസാനത്തിലെ ക്രിയ ആവർത്തിച്ച് ഹീബ്രുവിലെ ഊന്നൽ നിലനിർത്തി.
