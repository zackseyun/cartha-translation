    issue: Footnote alternative ‘പെൺകിടാരി’ is overly age-specific.
    rationale: It may be understood as a female calf rather than a heifer. Replacing it with ‘ഇളംപശു’ retains the intended lexical alternative without implying an age more narrowly than warranted.
