  text: അവൻ ആ പശുവിനെ[a] തന്റെ കൺമുമ്പിൽവെച്ച് ദഹിപ്പിക്കണം; അതിന്റെ തോലും മാംസവും രക്തവും ചാണകവും ഒന്നിച്ച് അവൻ ദഹിപ്പിക്കണം.
