id: NUM.19.2
reference: Numbers 19:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: ml
  text: 'യഹോവ കല്പിച്ച ന്യായപ്രമാണത്തിന്റെ ചട്ടം ഇതാണ്: “ഇസ്രായേൽമക്കളോടു പറയുക: പൂർണതയുള്ളതും ഒരു ഊനവും ഇല്ലാത്തതും ഇതുവരെ നുകം ചുമന്നിട്ടില്ലാത്തതുമായ ഒരു ചുവന്ന പെൺപശുവിനെ അവർ നിന്റെ അടുക്കൽ കൊണ്ടുവരട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: ന്യായപ്രമാണത്തിലെ ചട്ടം
  rationale: חֻקָּה എന്നത് നിർബന്ധബലമുള്ള ചട്ടത്തെയും תּוֹרָה ഇവിടെ ദൈവം നൽകിയ നിയമസംഹിതയെയും സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ പരമ്പരാഗത അർഥം നിലനിർത്തിക്കൊണ്ട് ഇസ്രായേൽജനത്തെ ഉൾക്കൊള്ളുന്ന മലയാള ബൈബിൾ പ്രയോഗം.
- source_word: פָרָה אֲדֻמָּה
  choice: ചുവന്ന പശുക്കിടാവ്
  rationale: פָרָה പെൺകന്നുകാലിയെയും אֲדֻמָּה ചുവപ്പ്/ചുവപ്പുകലർന്ന നിറത്തെയും സൂചിപ്പിക്കുന്നു; പശുക്കിടാവ് യാഗത്തിനായി കൊണ്ടുവരുന്ന പെൺമൃഗത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: תְּמִימָה
  choice: ഊനം ഒട്ടുമില്ലാത്തത്
  rationale: മൃഗത്തിന്റെ സമ്പൂർണതയെയോ നിർദോഷാവസ്ഥയെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള 'കുറവില്ലാത്തത്' എന്ന വ്യവസ്ഥയുമായി ബന്ധപ്പെട്ടെങ്കിലും അതിനെ ഇല്ലാതാക്കുന്നില്ല.
- source_word: מוּם
  choice: കുറവ്
  rationale: യാഗമൃഗത്തെ അയോഗ്യമാക്കുന്ന ശാരീരിക ദോഷം/ഊനം എന്ന അർഥം; മലയാളത്തിൽ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദം.
- source_word: עֹל
  choice: നുകം
  rationale: വേലക്കായി കന്നുകാലിയുടെ മേൽ വെക്കുന്ന യഥാർഥ നുകം; രൂപകമായി മാറ്റാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יהוה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം തുറന്നുകാട്ടുന്നു; കർത്താവ് എന്ന പദവി ഉപയോഗിച്ച് നാമത്തെ മറയ്ക്കുന്നില്ല.
- issue: תְּמִימָהയും מוּם ഇല്ലായ്മയും തമ്മിലുള്ള ആവർത്തനം
  choice: രണ്ട് വിവരണങ്ങളും വേർതിരിച്ചു നിലനിർത്തി
  alternative: ഒറ്റയായി ‘കളങ്കമില്ലാത്ത’ എന്നു ചുരുക്കുക
  rationale: മൂലപാഠം സമ്പൂർണതയും പ്രത്യേക ദോഷമില്ലായ്മയും രണ്ടായി പ്രസ്താവിക്കുന്നു; സാധ്യതയുള്ള സൂക്ഷ്മ വ്യത്യാസം പരിഭാഷയിൽ ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. കല്പനയുടെ നേരിട്ടുള്ള വാക്കുകൾ ഉദ്ധരണിക്കുള്ളിൽ നൽകി. അനാവശ്യ സാങ്കേതിക പദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
