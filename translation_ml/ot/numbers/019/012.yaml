  to: അവൻ മൂന്നാം ദിവസവും ഏഴാം ദിവസവും അതുപയോഗിച്ച് തന്നെത്തന്നെ ശുദ്ധീകരിക്കണം[a]; അവൻ ശുദ്ധനായിത്തീരും. എന്നാൽ മൂന്നാം ദിവസവും ഏഴാം ദിവസവും തന്നെത്തന്നെ ശുദ്ധീകരിക്കാതിരുന്നാൽ[b], അവൻ ശുദ്ധനായിത്തീരുകയില്ല.
  rationale: അനാവശ്യമായ ഊന്നൽ നീക്കി, വെള്ളത്തെ സൂചിപ്പിക്കുന്ന സർവനാമപരമായ പരാമർശം വ്യക്തമായി നിലനിർത്തി. അടിക്കുറിപ്പിലെ വെള്ളത്തിന്റെ സ്വഭാവം ‘അശുദ്ധമായ വെള്ളം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാകുന്നവിധം വ്യക്തമാക്കി. മുഖ്യപാഠത്തിൽ ആചാരപരമായ ശുദ്ധീകരണപ്രക്രിയയും ഫലമായ ശുദ്ധസ്ഥിതിയും വേർതിരിച്ചിരിക്കുന്നു.
