id: NUM.19.12
reference: Numbers 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: ml
  text: അവൻ മൂന്നാം ദിവസവും ഏഴാം ദിവസവും അതുപയോഗിച്ച് തന്നെത്തന്നെ ശുദ്ധീകരിക്കണം[a]; അവൻ ശുദ്ധനായിത്തീരും. എന്നാൽ മൂന്നാം ദിവസവും ഏഴാം ദിവസവും തന്നെത്തന്നെ ശുദ്ധീകരിക്കാതിരുന്നാൽ[b], അവൻ ശുദ്ധനായിത്തീരുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഈ അധ്യായത്തിൽ മുമ്പ് തയ്യാറാക്കിയ അശുദ്ധിക്കുള്ള വെള്ളം ഉപയോഗിച്ച്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘തന്നെത്തന്നെ ശുദ്ധമാക്കാതിരുന്നാൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു ക്രിയ അശുദ്ധിയിൽനിന്നുള്ള ആചാരപരമായ ശുദ്ധീകരണത്തിന് വിധേയനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: തന്നെ ശുദ്ധീകരിക്കണം
  rationale: ഹിത്പാഏൽ രൂപം ഇവിടെ പാപമോചനത്തെയല്ല, അശുദ്ധിയിൽനിന്നുള്ള ആചാരപരമായ ശുദ്ധീകരണത്തിന് വിധേയനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. പ്രതിഫലനാർഥം ‘തന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: בּוֹ
  choice: അതുകൊണ്ട്
  rationale: സർവനാമം ഈ അധ്യായത്തിൽ മുമ്പ് ഒരുക്കിയ അശുദ്ധിനീരെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ അതിനെ അനാവശ്യമായി വിശദീകരിക്കാതെ സർവനാമപരമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചനയുടെ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമായ മലയാളരൂപം.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ഏഴാം ദിവസവും
  rationale: ഹീബ്രുവിലെ സംയോജനവും ശുദ്ധീകരണച്ചടങ്ങിന്റെ ക്രമവും നിലനിർത്തുന്നു.
- source_word: יִטְהָר
  choice: ശുദ്ധനായിത്തീരും
  rationale: יִתְחַטָּא സൂചിപ്പിക്കുന്ന ശുദ്ധീകരണപ്രക്രിയയിൽനിന്ന് വേർതിരിച്ച്, טהר സൂചിപ്പിക്കുന്ന ഫലമായ ശുദ്ധസ്ഥിതി വ്യക്തമാക്കുന്നു.
- source_word: וְאִם לֹא
  choice: എന്നാൽ ... ഇല്ലെങ്കിൽ
  rationale: വ്യവസ്ഥാപരമായ വിരോധവും മുന്നറിയിപ്പിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: ഹീബ്രുവിലെ വ്യക്തമായ പുല്ലിംഗ ഏകവചന സർവനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് അശുദ്ധനായ വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സംഖ്യാപുസ്തകം 19-ലെ ശുദ്ധീകരണഭാഷയുടെ സ്വഭാവം
  choice: ധാർമിക പാപമോചനമോ ആന്തരിക വിശുദ്ധീകരണമോ എന്നതിനു പകരം ആചാരപരമായ ശുദ്ധീകരണവും ശുദ്ധസ്ഥിതിയും സൂചിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിച്ചു.
  alternative: ആചാരപരമായ സന്ദർഭം വ്യക്തമാക്കാതെ പൊതുവായ ആത്മീയ ശുദ്ധീകരണഭാഷ ഉപയോഗിക്കുക.
  rationale: സന്ദർഭം മൃതശരീരസ്പർശം മൂലമുള്ള അശുദ്ധിയും നിർദേശിക്കപ്പെട്ട അശുദ്ധിനീരും സംബന്ധിച്ചതാണ്. ഹീബ്രു ക്രിയകൾ ആചാരപരമായ ശുദ്ധസ്ഥിതിയെ വിവരിക്കുന്നു; അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര ആശയങ്ങൾ പാഠത്തിലേക്ക് ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുദ്ധീകരിക്കുക’ എന്നത് ചടങ്ങിനെയും ‘ശുദ്ധനായിത്തീരുക’ എന്നത് അതിന്റെ ഫലമായ നിലയെയും വേർതിരിക്കുന്നു. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
