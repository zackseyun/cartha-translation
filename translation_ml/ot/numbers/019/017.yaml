  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: ml
  text: അശുദ്ധനായ വ്യക്തിക്കായി, ശുദ്ധീകരണയാഗം ദഹിപ്പിച്ചുണ്ടായ പൊടിയിൽനിന്ന് കുറച്ചെടുത്ത്[a], ഒരു പാത്രത്തിൽ അതിന്മേൽ ഉറവുവെള്ളം[b] ഒഴിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “പാപയാഗം ദഹിപ്പിച്ചതിന്റെ ചാരം.” ഇവിടെ ഹീബ്രായപദം അക്ഷരാർഥത്തിൽ “പൊടി” എന്നാണ്; חטאת എന്ന നാമത്തിന് പുരോഹിതീയ സന്ദർഭങ്ങളിൽ “പാപയാഗം” എന്നും പ്രവർത്തനപരമായി “ശുദ്ധീകരണയാഗം” എന്നും അർഥമാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ജീവനുള്ള വെള്ളം”; അതായത്, ഉറവിൽനിന്നുള്ളതോ ഒഴുകുന്നതോ ആയ ശുദ്ധജലം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: എടുക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ഹീബ്രായ ബഹുവചന കർത്താവ് മലയാളത്തിൽ വ്യക്തമാക്കാതെ വിടുന്നത് സാധാരണ പ്രയോഗമാണ്.
- source_word: לַטָּמֵא
  choice: അശുദ്ധനായ വ്യക്തിക്കുവേണ്ടി
  rationale: ആചാരപരമായ അശുദ്ധാവസ്ഥയിലുള്ള വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമ്മിക കുറ്റബോധം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: מֵעֲפַר
  choice: പൊടിയിൽനിന്ന് കുറച്ച്
  rationale: עָפָר എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പൊടി’ നിലനിർത്തുകയും מִן എന്ന ഭാഗികത ‘കുറച്ച്’ എന്നതിലൂടെ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: שְׂרֵפַת
  choice: ദഹിപ്പിച്ചതിന്റെ
  rationale: ദഹനപ്രക്രിയയെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַחַטָּאת
  choice: ശുദ്ധീകരണയാഗം
  rationale: പുരോഹിതീയ ശുദ്ധീകരണസന്ദർഭത്തിലെ യാഗത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘പാപയാഗം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וְנָתַן
  choice: ഒഴിക്കണം
  rationale: വെള്ളം പൊടിയുടെമേൽ പാത്രത്തിൽ ചേർക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു. ഹീബ്രായ ഏകവചന കർത്താവിനെ നിർബന്ധമായി പുരുഷലിംഗത്തിൽ വ്യക്തമാക്കാതെ നിയമനിർദേശമായി നൽകുന്നു.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: മുൻപ് പറഞ്ഞ പൊടിയെയാണ് സർവനാമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: מַיִם חַיִּים
  choice: ഉറവുവെള്ളം
  rationale: അക്ഷരാർഥം ‘ജീവനുള്ള വെള്ളം’; ഈ ആചാരസന്ദർഭത്തിൽ പ്രകൃതിദത്തമായി ഒഴുകുന്നതോ ഉറവിൽനിന്നുള്ളതോ ആയ വെള്ളം എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶל כֶּלִי
  choice: ഒരു പാത്രത്തിൽ
  rationale: വസ്തു പാത്രത്തിനുള്ളിൽ ചേർക്കപ്പെടുന്ന ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആചാരശുദ്ധിയുടെ സന്ദർഭത്തിൽ חטאת വിവർത്തനം ചെയ്യുന്നത്
  choice: ശുദ്ധീകരണയാഗം
  alternative: പാപയാഗം
  rationale: ചുവന്ന പശുവിന്റെ അവശിഷ്ടങ്ങൾ ആചാരപരമായ അശുദ്ധി നീക്കാൻ ഉപയോഗിക്കുന്ന സന്ദർഭമായതിനാൽ യാഗത്തിന്റെ ശുദ്ധീകരണപ്രവർത്തനം മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: מַיִם חַיִּים എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഉറവുവെള്ളം
  alternative: ജീവനുള്ള വെള്ളം; ഒഴുകുന്ന വെള്ളം
  rationale: ഹീബ്രായ പ്രയോഗം പുതുതായി ലഭിക്കുന്ന പ്രകൃതിദത്ത ജലസ്രോതസ്സിനെ സൂചിപ്പിക്കുന്നു. ‘ഉറവുവെള്ളം’ ആചാരപരമായ ആവശ്യകത സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ആചാരപരമായ ‘അശുദ്ധി’ നിലനിർത്തുകയും അപരിചിതമായ അക്ഷരാർഥങ്ങൾ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
