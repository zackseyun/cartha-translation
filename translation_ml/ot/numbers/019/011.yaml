  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: ml
  text: ഏതെങ്കിലും മനുഷ്യന്റെ മൃതശരീരം തൊടുന്നവൻ ഏഴു ദിവസം അശുദ്ധനായിരിക്കും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരിച്ചവനെ’ അഥവാ ‘ഒരു ശവത്തെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘മനുഷ്യന്റെ ഏതൊരു ജീവൻ/വ്യക്തി’; ഇവിടെ ഏതൊരു മനുഷ്യനെയും ഉദ്ദേശിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: തൊടുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപസർഗത്തോടുകൂടിയ കർത്തൃവാചക കൃദന്തം പൊതുവായ നിയമപ്രസ്താവനയിൽ ‘തൊടുന്നവൻ’ എന്ന അർഥത്തിൽ നാമവാചകമായി പ്രവർത്തിക്കുന്നു.
- source_word: בְּמֵת
  choice: മൃതശരീരം
  rationale: מֵת എന്നത് അക്ഷരാർഥത്തിൽ മരിച്ച വ്യക്തിയെയോ ‘മരിച്ചവനെ’യോ സൂചിപ്പിക്കുന്നു; ഈ ആചാരപരമായ സന്ദർഭത്തിൽ ‘മൃതശരീരം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: ഏതെങ്കിലും മനുഷ്യന്റെ
  rationale: נֶפֶשׁ אָדָם ഇവിടെ ഏതൊരു മനുഷ്യവ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷനെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല. ‘ഏതെങ്കിലും മനുഷ്യന്റെ’ എന്നത് ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: וְטָמֵא
  choice: അശുദ്ധനായിരിക്കും
  rationale: നിയമസന്ദർഭത്തിൽ ഈ ക്രിയാരൂപം സ്പർശനത്തിന്റെ ഫലമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അശുദ്ധനായിരിക്കും’ ആ നിയമപരമായ പരിണതി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ആചാരപരമായ טָמֵא എന്ന പദത്തിന്റെ അർഥം
  choice: അശുദ്ധനായിരിക്കും
  alternative: മലിനനായിത്തീരും
  rationale: ഇവിടെ ധാർമിക കുറ്റബോധമല്ല, ആചാരപരമായ അശുദ്ധാവസ്ഥയാണ് ഉദ്ദേശിക്കുന്നത്; ‘അശുദ്ധൻ’ ആ വ്യത്യാസം സഭാപാരമ്പര്യവിശേഷം ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: אָדָם എന്ന പദത്തിന്റെ പൊതുവായ നിയമപരമായ വ്യാപ്തി
  choice: മനുഷ്യൻ
  alternative: പുരുഷൻ / വ്യക്തി
  rationale: ഈ സന്ദർഭത്തിൽ אָדָם മനുഷ്യജാതിയിലെ ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു, പുരുഷനെ മാത്രം അല്ല. ‘മനുഷ്യൻ’ ഉറവിടത്തിന്റെ പൊതുവായ വ്യാപ്തി കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിയമശൈലി. ‘മൃതശരീരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘അശുദ്ധൻ’ ആചാരപരമായ ആശയം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
