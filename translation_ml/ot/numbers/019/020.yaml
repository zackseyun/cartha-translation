  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: ml
  text: എന്നാൽ അശുദ്ധനാകുകയും സ്വയം ശുദ്ധീകരിക്കാതിരിക്കുകയും ചെയ്യുന്ന മനുഷ്യൻ സഭയുടെ നടുവിൽനിന്ന് ഛേദിക്കപ്പെടും[a]. കാരണം, അവൻ യഹോവയുടെ വിശുദ്ധമന്ദിരത്തെ അശുദ്ധമാക്കിയിരിക്കുന്നു. അശുദ്ധി നീക്കാനുള്ള വെള്ളം അവന്റെമേൽ തളിച്ചിട്ടില്ല[b]; അവൻ അശുദ്ധനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആ ആത്മാവിനെ ഛേദിച്ചുകളയണം.’ ഇവിടെ എബ്രായത്തിലെ നിയമസൂത്രവാക്യം ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെ മാത്രമല്ല, മുഴുവൻ വ്യക്തിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അശുദ്ധിയുടെ വെള്ളം’; പരമ്പരാഗതമായി ‘വേർതിരിവിന്റെ വെള്ളം.’ ഈ പ്രയോഗം ഈ അധ്യായത്തിൽ ഒരുക്കുന്ന ശുദ്ധീകരണവെള്ളത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: മനുഷ്യൻ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ എബ്രായപദത്തെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഒരു വ്യക്തിയെ പ്രതിനിധീകരിക്കുന്ന പൊതുപ്രയോഗമാണ്.
- source_word: יִטְמָא
  choice: അശുദ്ധനാകുകയും
  rationale: ആചാരപരമായ അശുദ്ധാവസ്ഥയിലേക്കു വരുന്നതാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ധാർമ്മിക മലിനീകരണം നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
- source_word: יִתְחַטָּא
  choice: സ്വയം ശുദ്ധീകരിക്കാതിരിക്കുകയും
  rationale: ഈ ശുദ്ധീകരണസന്ദർഭത്തിലെ ഹിത്പയേൽ രൂപം പാപം ചെയ്യുക എന്നതിലുപരി അശുദ്ധിയിൽനിന്നുള്ള ശുദ്ധീകരണത്തിന് വിധേയനാകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തിയെ ... ഛേദിച്ചുകളയണം
  rationale: נפש എന്നത് നിയമസൂത്രവാക്യത്തിൽ മുഴുവൻ വ്യക്തിയെയും സൂചിപ്പിക്കാം. ശിക്ഷയുടെ കൃത്യമായ രീതി നിർണയിക്കാതെ ‘ഛേദിച്ചുകളയണം’ എന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: സഭയുടെ നടുവിൽനിന്ന്
  rationale: קהל ഉടമ്പടിസമൂഹത്തിന്റെ കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ ‘നടുവിൽനിന്ന്’ എന്ന ഘടനയും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: מִקְדַּשׁ יְהוָה
  choice: യഹോവയുടെ വിശുദ്ധമന്ദിരം
  rationale: מקדש വിശുദ്ധസ്ഥാനത്തെയോ വിശുദ്ധമന്ദിരത്തെയോ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: טִמֵּא
  choice: അശുദ്ധമാക്കിയിരിക്കുന്നു
  rationale: 'പിയേൽ രൂപം കാരണാർഥകമാണ്: ശുദ്ധീകരിക്കപ്പെടാതെ തുടരുന്നതിലൂടെ വിശുദ്ധമന്ദിരത്തെ ആചാരപരമായി അശുദ്ധമാക്കുന്നു.'
- source_word: מֵי נִדָּה
  choice: അശുദ്ധി നീക്കാനുള്ള വെള്ളം
  rationale: ഈ അധ്യായത്തിൽ ശവസമ്പർക്കം മൂലമുള്ള അശുദ്ധി നീക്കാൻ ഒരുക്കിയ വെള്ളത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രവർത്തനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളമാണിത്.
- source_word: זֹרַק עָלָיו
  choice: അവന്റെമേൽ തളിച്ചിട്ടില്ല
  rationale: ആചാരപരമായ സന്ദർഭത്തിൽ זרק ദ്രാവകം തളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: טָמֵא הוּא
  choice: അവൻ അശുദ്ധനാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായവാക്യം ആ വ്യക്തിയുടെ നിലവിലുള്ള നിയമപരവും ആചാരപരവുമായ സ്ഥിതി നേരിട്ട് പ്രഖ്യാപിക്കുന്നു.
theological_decisions:
- issue: ‘ഛേദിച്ചുകളയണം’ എന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: മരണം, സമൂഹഭ്രഷ്ട്, അല്ലെങ്കിൽ ദൈവിക ന്യായവിധി എന്നിങ്ങനെ കൃത്യമായി നിർവചിക്കാതെ എബ്രായപ്രയോഗം നിലനിർത്തി.
  alternative: ‘സമൂഹത്തിൽനിന്ന് പുറത്താക്കണം’ അല്ലെങ്കിൽ ‘കൊല്ലണം’
  rationale: ഈ ഉടമ്പടി-നിയമസൂത്രം ശിക്ഷ നടപ്പാകുന്ന കൃത്യമായ രീതി ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഹരിക്കാതെ വാചകത്തിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഗൗരവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാഭാഷ ഉപയോഗിച്ചു. ‘സഭ’, ‘വിശുദ്ധമന്ദിരം’, ‘അശുദ്ധി’, ‘ശുദ്ധീകരിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആചാരപരമായ സന്ദർഭം നിലനിർത്തുന്നതുമാണ്. എബ്രായത്തിലെ യഥാർത്ഥ ദൈവനാമം ‘യഹോവ’ എന്നു നൽകി.
