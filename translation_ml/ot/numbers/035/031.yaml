id: NUM.35.31
reference: Numbers 35:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: ml
  text: മരണശിക്ഷയ്ക്ക് അർഹനായ ഒരു കൊലപാതകിയുടെ ജീവനുവേണ്ടി[b] മോചനവില[a] സ്വീകരിക്കരുത്; അവൻ തീർച്ചയായും വധിക്കപ്പെടണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മോചനവില’ എന്നതിന് ‘പരിഹാരത്തുക’ അല്ലെങ്കിൽ ‘വിടുതൽത്തുക’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായത്തിലെ כֹּפֶר ശിക്ഷ ഒഴിവാക്കാനോ മോചനം നേടാനോ നൽകുന്ന തുകയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഒരു കൊലപാതകിയുടെ ജീവൻ/വ്യക്തിക്കുവേണ്ടി.’ പണം സ്വീകരിച്ച് കൊലപാതകിയുടെ ജീവൻ രക്ഷിക്കരുത് എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോടടുത്ത്: ‘അവൻ തീർച്ചയായും വധിക്കപ്പെടും.’ എബ്രായത്തിലെ ഊന്നൽഘടന ശിക്ഷയുടെ ഉറപ്പും നിർബന്ധവും പ്രകടിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: സ്വീകരിക്കരുത്
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ഒരു പണം ‘വാങ്ങുക’ എന്നതിലുപരി അത് സ്വീകരിക്കുക എന്ന അർഥമാണ്; ആധുനിക മലയാളത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: כֹּפֶר
  choice: മോചനവില
  rationale: ശിക്ഷ ഒഴിവാക്കാനോ ഒരാളെ മോചിപ്പിക്കാനോ നൽകുന്ന തുകയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. വെറും ‘കൈക്കൂലി’ എന്നതിനെക്കാൾ നിയമപരവും മോചനസംബന്ധവുമായ അർഥം ‘മോചനവില’ നിലനിർത്തുന്നു.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: ഒരു കൊലപാതകിയുടെ ജീവൻ രക്ഷിക്കാൻ
  rationale: അക്ഷരാർഥം ‘ഒരു കൊലപാതകിയുടെ ജീവൻ/വ്യക്തിക്കുവേണ്ടി’ എന്നാണ്. സന്ദർഭത്തിൽ പണം സ്വീകരിച്ച് അയാളുടെ ജീവൻ രക്ഷിക്കുന്നതാണ് വിലക്കപ്പെടുന്നത്; മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: רֹצֵחַ
  choice: കൊലപാതകി
  rationale: അബദ്ധവധവും കുറ്റകരമായ കൊലപാതകവും ഈ അധ്യായം വേർതിരിക്കുന്നു. ഇവിടെ മരണശിക്ഷയ്ക്ക് വിധേയനായ കുറ്റവാളിയായതിനാൽ ‘കൊലപാതകി’ കൃത്യമാണ്.
- source_word: רָשָׁע לָמוּת
  choice: മരണശിക്ഷയ്ക്ക് അർഹനായ
  rationale: ‘മരിക്കാൻ കുറ്റക്കാരനായ/അർഹനായ’ എന്ന നിയമപരമായ ബാധ്യതയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘മരണശിക്ഷയ്ക്ക് അർഹനായ’ എന്നത് ആ ന്യായവിധിസംബന്ധമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כִּי מוֹת יוּמָת
  choice: അവൻ നിശ്ചയമായും വധിക്കപ്പെടണം
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഘടന നിർബന്ധവും ഊന്നലും പ്രകടിപ്പിക്കുന്നു. ‘നിശ്ചയമായും ... വേണം’ അത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മരണശിക്ഷാവിധിയുടെ നിയമപരമായ നിർബന്ധസ്വഭാവം
  choice: മരണശിക്ഷയ്ക്ക് അർഹനായ കൊലപാതകിയുടെ ശിക്ഷ പണം വാങ്ങി ഒഴിവാക്കരുതെന്ന നിർബന്ധിത ന്യായപ്രമാണമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ശക്തമായ നിർദേശമല്ലാതെ അന്നത്തെ പതിവിന്റെ ഒരു വിവരണം മാത്രമാണെന്ന വായന.
  rationale: לֹא תִקְחוּ എന്ന വിലക്കും מוֹת יוּמָת എന്ന ഊന്നൽഘടനയും ചേർന്ന് ഉറച്ച നിയമകല്പനയാണ് നൽകുന്നത്; അതിനാൽ വിലക്കിന്റെയും ശിക്ഷയുടെയും നിർബന്ധസ്വഭാവം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് ‘ജീവൻ രക്ഷിക്കാൻ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ എബ്രായ നിർമാണത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കി; അടിക്കുറിപ്പുകളിൽ അക്ഷരാർഥവും പദവികല്പങ്ങളും സംരക്ഷിച്ചു.
