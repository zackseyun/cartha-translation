language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֖ים אֲשֶׁ֣ר תִּתֵּ֑נוּ שֵׁשׁ עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֥ינָה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: ml
  text: നിങ്ങൾ നൽകുന്ന പട്ടണങ്ങൾ നിങ്ങൾക്കായി ആറു അഭയനഗരങ്ങളായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: പട്ടണങ്ങൾ
  rationale: വാക്യബന്ധകമായ וְ മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ വിട്ടു; നിർദിഷ്ട ബഹുവചനമായ ‘പട്ടണങ്ങൾ’ നിലനിർത്തി.
- source_word: אֲשֶׁר
  choice: നൽകുന്ന
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ കൃദന്തരൂപത്തിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: תִּתֵּנוּ
  choice: നിങ്ങൾ നൽകുന്ന
  rationale: נתן എന്ന ക്രിയയുടെ രണ്ടാം പുരുഷ ബഹുവചനവും ഭാവി/നിർദേശസന്ദർഭവും ബന്ധവാക്യത്തിനുള്ളിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: שֵׁשׁ
  choice: ആറു
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള മലയാള പരിഭാഷ.
- source_word: עָרֵי מִקְלָט
  choice: സങ്കേതനഗരങ്ങൾ
  rationale: ‘അഭയം തേടാനുള്ള നഗരങ്ങൾ’ എന്ന നിയമസ്ഥാപനത്തെ സംക്ഷിപ്തവും പരിചിതവുമായ മലയാള പദത്തിൽ അവതരിപ്പിക്കുന്നു; ‘അഭയനഗരങ്ങൾ’ എന്നതും സാധ്യമാണ്.
- source_word: תִּהְיֶינָה
  choice: ആയിരിക്കണം
  rationale: നിയമപരമായ നിർദേശശക്തി പ്രകടമാക്കുന്നു; വെറും ഭാവികാലമായ ‘ആയിരിക്കും’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: לָ/כֶם
  choice: നിങ്ങൾക്കായി
  rationale: ലഭ്യതയുടെയോ പ്രയോജനത്തിന്റെയോ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
