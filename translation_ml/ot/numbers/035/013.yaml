translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യത്തിന്റെ നിയമനിർദേശ സ്വഭാവം ‘ആയിരിക്കണം’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
