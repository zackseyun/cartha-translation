  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരുവൻ ശത്രുതയോടെ[a] തന്റെ കൈകൊണ്ട് അവനെ അടിക്കുകയും അവൻ മരിക്കുകയും ചെയ്താൽ, അടിച്ചവൻ നിശ്ചയമായും മരണശിക്ഷ അനുഭവിക്കണം; അവൻ കൊലപാതകിയാണ്. രക്തപ്രതികാരകൻ[b] കൊലപാതകിയെ കണ്ടുമുട്ടുമ്പോൾ അവനെ വധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിദ്വേഷത്തോടെ’ അഥവാ ‘വൈരത്തോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘രക്തത്തിന്റെ പ്രതികാരകൻ’; കൂടുതൽ വ്യക്തമായി, ‘രക്തപ്രതികാരകനായ ബന്ധു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: ശത്രുതയോടെ
  rationale: אֵיבָה ശത്രുത, വിദ്വേഷം എന്നീ അർഥങ്ങൾ നൽകുന്നു. നിയമസന്ദർഭത്തിലെ വൈരപരമായ ഉദ്ദേശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: മറ്റൊരാളെ കൈകൊണ്ട് അടിക്കുകയും
  rationale: נכה എന്നത് അടിക്കുക എന്ന സാധാരണ ക്രിയയാണ്; בְיָדוֹ ആക്രമണത്തിന്റെ മാർഗമായ ‘കൈകൊണ്ട്’ എന്ന വിശദാംശം നിലനിർത്തുന്നു.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിക്കുകയും ചെയ്താൽ
  rationale: ഹീബ്രുവിലെ അനുക്രമ ക്രിയാരൂപം നിലനിർത്തിക്കൊണ്ട് മലയാള നിയമവാക്യത്തിന്റെ ഉപാധിഘടനയിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: מוֹת יוּמַת
  choice: നിശ്ചയമായും മരണശിക്ഷയ്ക്കു വിധേയനാക്കണം
  rationale: ക്രിയാനാമവും നിഷ്ക്രിയ ക്രിയയും ചേർന്ന ഊന്നൽ നിർബന്ധിതമായ മരണദണ്ഡമായി നിയമപരമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמַּכֶּה
  choice: അടിച്ചവനെ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുകയും മുമ്പ് പറഞ്ഞ ആക്രമിയിലേക്കുള്ള പരാമർശം സംക്ഷിപ്തമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: רֹצֵחַ הוּא
  choice: അവൻ കൊലപാതകിയാണ്
  rationale: ശത്രുതാപൂർവമായ ഉദ്ദേശ്യം വ്യക്തമാക്കിയിരിക്കുന്നതിനാൽ അബദ്ധവധമല്ല, മനഃപൂർവ കൊലപാതകമാണ് ഇവിടെ നിയമപരമായി നിർണ്ണയിക്കുന്നത്.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവൻ
  rationale: പുരാതന ഇസ്രായേലിലെ നിയമപരമായ പദവിയെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ സുതാര്യമായി അവതരിപ്പിക്കുന്നു; ബന്ധുവെന്ന സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יָמִית
  choice: മരണപ്പെടുത്തണം
  rationale: ഇവിടെ നിയമപരമായി നിർദേശിക്കപ്പെടുന്ന വധത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ ‘കൊല്ലണം’ എന്നതിനെക്കാൾ ഔപചാരികമായ പദപ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: בְּפִגְעוֹ בוֹ
  choice: കണ്ടുമുട്ടുമ്പോൾ
  rationale: פגע സൂചിപ്പിക്കുന്ന നേരിടൽ അഥവാ കണ്ടുമുട്ടൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിലധികമായ സാഹചര്യം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: മനഃപൂർവമായ നരഹത്യയുടെ നിയമവിഭാഗം
  choice: കൊലപാതകി
  alternative: മനുഷ്യഘാതകൻ
  rationale: ശത്രുതാപൂർവമായ ഉദ്ദേശ്യം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ കുറ്റകരമായ മനഃപൂർവ കൊലയെ ‘കൊലപാതകി’ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- issue: גֹּאֵל הַדָּם എന്ന നിയമപദവിയുടെ പരിഭാഷ
  choice: രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവൻ
  alternative: രക്തപ്രതികാരകനായ ബന്ധു
  rationale: പ്രധാനവാചകം നിയമസ്ഥാപനത്തിന്റെ ഔപചാരിക പ്രയോഗം സംരക്ഷിക്കുന്നു; גֹּאֵל എന്നതിലെ കുടുംബബന്ധസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, എന്നാൽ വാചകത്തിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമശൈലി. ഹീബ്രുവിലെ ശത്രുതാപൂർവ ഉദ്ദേശ്യം, കൈകൊണ്ടുള്ള ആക്രമണം, ഊന്നിപ്പറയുന്ന മരണദണ്ഡം, രക്തപ്രതികാരകന്റെ നിയമപദവി എന്നിവ നിലനിർത്തിയിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
