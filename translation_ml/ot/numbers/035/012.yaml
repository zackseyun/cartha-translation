id: NUM.35.12
reference: Numbers 35:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: ml
  text: ആ പട്ടണങ്ങൾ പ്രതികാരകനിൽനിന്ന്[a] നിങ്ങൾക്കു അഭയസ്ഥാനങ്ങളായിരിക്കണം; കൊന്നവൻ ന്യായവിധിക്കായി സമൂഹത്തിന്റെ മുമ്പാകെ നിൽക്കുന്നതുവരെ മരിക്കാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്തപ്രതികാരകനിൽനിന്ന്’ അല്ലെങ്കിൽ ‘പ്രതികാരം ചെയ്യുന്ന അടുത്ത ബന്ധുവിൽനിന്ന്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദമായ ‘ഗോയേൽ’ രക്തച്ചൊരിച്ചിലിനു പ്രതികാരം ചെയ്യേണ്ട അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: ആ പട്ടണങ്ങൾ ... നിങ്ങൾക്കു സങ്കേതമായിരിക്കണം
  rationale: നിയമനിർദേശത്തിലെ ഭാവി/വിധിനിർദേശ ബലം ‘ആയിരിക്കണം’ എന്നു നൽകി; മുൻസന്ദർഭത്തിൽ നിർദേശിച്ച പട്ടണങ്ങളെയാണ് ‘ആ പട്ടണങ്ങൾ’ സൂചിപ്പിക്കുന്നത്. מִקְלָט എന്നത് സംരക്ഷണം ലഭിക്കുന്ന സ്ഥലമായ ‘സങ്കേതം’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מִגֹּאֵל
  choice: പ്രതികാരകനിൽനിന്ന്
  rationale: കൊലപാതകവുമായി ബന്ധപ്പെട്ട ഈ നിയമസന്ദർഭത്തിൽ גֹאֵל രക്തച്ചൊരിച്ചിലിനു പ്രതികാരം ചെയ്യുന്ന അടുത്ത ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ സംക്ഷിപ്തമായ പദം ഉപയോഗിച്ച് ബന്ധുത്വസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: וְלֹא יָמוּת
  choice: മരിക്കാതിരിക്കേണ്ടതിനാണിത്
  rationale: അഭയനഗരത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന വിധത്തിൽ ഉദ്ദേശ്യ/ഫലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിച്ചു; മരണത്തിന്റെ കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തില്ല.
- source_word: הָרֹצֵחַ
  choice: കൊന്നവൻ
  rationale: വിചാരണയ്ക്കുമുമ്പ് കുറ്റകരമായ കൊലപാതകമോ അബദ്ധവധമോ എന്ന് നിർണയിക്കപ്പെട്ടിട്ടില്ല. അതിനാൽ ‘കൊലപാതകി’ എന്ന മുൻവിധിയുള്ള പദം ഒഴിവാക്കി, ഒരാളെ കൊന്ന വ്യക്തി എന്ന നിഷ്പക്ഷ അർഥം നൽകി.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ മുമ്പാകെ നിൽക്കുന്നതുവരെ
  rationale: עַד + infinitive construct എന്ന സമയബന്ധം ‘നിൽക്കുന്നതുവരെ’ എന്നു നൽകി. עֵדָה ഇവിടെ ന്യായവിധി നിർവഹിക്കുന്ന ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സമൂഹം’ തിരഞ്ഞെടുത്തു.
- source_word: לַמִּשְׁפָּט
  choice: ന്യായവിധിക്കായി
  rationale: מִשְׁפָּט ഇവിടെ നിയമപരമായ വിചാരണയും വിധിനിർണയവും ഉൾക്കൊള്ളുന്നു; ‘ന്യായവിധി’ ഈ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധിനിർണയത്തിനു മുമ്പുള്ള הָרֹצֵחַ എന്ന വ്യക്തിയുടെ നിയമസ്ഥിതി
  choice: കൊന്നവൻ
  alternative: കൊലപാതകി; ഘാതകൻ
  rationale: സമൂഹത്തിന്റെ ന്യായവിധിവരെ അന്തിമ കുറ്റനിർണയം മാറ്റിവെക്കുന്നതാണ് വാക്യം. അതിനാൽ മനഃപൂർവമായ കൊലപാതകം മുൻകൂട്ടി വിധിക്കുന്ന ഭാഷ ഒഴിവാക്കി.
- issue: കൊലപാതകനിയമത്തിൽ גֹאֵל എന്ന പദത്തിന്റെ പ്രത്യേക അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രതികാരകൻ’; അടിക്കുറിപ്പിൽ ‘രക്തപ്രതികാരകൻ/പ്രതികാരം ചെയ്യുന്ന അടുത്ത ബന്ധു’
  alternative: രക്തപ്രതികാരകൻ; ബന്ധു-പ്രതികാരകൻ
  rationale: പദത്തിന്റെ ബന്ധുത്വപരവും നിയമപരവുമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുമ്പോൾ മുഖ്യപാഠം വ്യക്തവും വായനാസൗകര്യമുള്ളതുമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘കൊന്നവൻ’ എന്ന നിഷ്പക്ഷ പ്രയോഗം വിചാരണയ്ക്കുമുമ്പുള്ള കുറ്റസ്ഥിതിയിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
