id: NUM.35.34
reference: Numbers 35:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: ml
  text: നിങ്ങൾ പാർക്കുന്നതും, ഞാൻ അതിന്റെ മധ്യത്തിൽ വസിക്കുന്നതുമായ ദേശം അശുദ്ധമാക്കരുത്; കാരണം, യിസ്രായേൽമക്കളുടെ മധ്യത്തിൽ[a] വസിക്കുന്ന യഹ്‌വേ ഞാൻ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യിസ്രായേല്യരുടെ ഇടയിൽ.”'
    reason: ‘യിസ്രായേൽമക്കളുടെ മധ്യത്തിൽ’ എന്നത് ഹീബ്രു രൂപത്തോട് അടുത്തതാണ്; ‘യിസ്രായേല്യരുടെ ഇടയിൽ’ കൂടുതൽ വ്യാവഹാരികമായ മലയാളമാണ്.
lexical_decisions:
- source_word: תְטַמֵּא
  choice: അശുദ്ധമാക്കരുത്
  rationale: പീയേൽ രൂപത്തിലുള്ള טמא ആചാരപരവും ധാർമികവുമായ അശുദ്ധീകരണത്തെ സൂചിപ്പിക്കാം. ‘അശുദ്ധമാക്കുക’ ഈ രണ്ടു ഭാവങ്ങളും നിലനിർത്തുന്നു; ‘മലിനമാക്കുക’ പരിസ്ഥിതിമലിനീകരണം എന്ന അർഥത്തിലേക്ക് ചുരുങ്ങാൻ ഇടയുണ്ട്.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ אֶרֶץ മുഴുവൻ ഭൂമിയെയല്ല, യിസ്രായേൽ പാർക്കുന്ന പ്രത്യേക ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יֹשְׁבִים בָּהּ
  choice: നിങ്ങൾ പാർക്കുന്ന
  rationale: ישב ഇവിടെ താമസിക്കുക, പാർക്കുക എന്ന തുടർച്ചയായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പാർക്കുന്ന’ സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമാണ്.
- source_word: שֹׁכֵן
  choice: വസിക്കുന്നു / വസിക്കുന്ന
  rationale: שכן ദൈവസാന്നിധ്യത്തിന്റെ ഉടമ്പടിപരമായ മുഴക്കമുള്ള ‘വസിക്കുക’ എന്ന ആശയം വഹിക്കുന്നു. സാങ്കേതികമായ ‘തിരുനിവാസം ചെയ്യുക’ എന്ന വ്യാഖ്യാനം ചേർക്കാതെ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּתוֹכָהּ
  choice: അതിന്റെ മധ്യത്തിൽ
  rationale: תוך ഉള്ളിലോ മധ്യത്തിലോ ഉള്ള സാന്നിധ്യത്തെ ഊന്നുന്നു. ‘അതിന്റെ മധ്യത്തിൽ’ എന്നത് ദേശത്തോടുള്ള സർവനാമബന്ധവും സ്ഥാനപരമായ ഊന്നലും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: ഇവിടെ כִּי മുമ്പുള്ള നിരോധനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ മധ്യത്തിൽ
  rationale: בני ישראל എന്ന പദപ്രയോഗത്തിന്റെ വംശപരവും ഉടമ്പടിപരവുമായ രൂപം ‘യിസ്രായേൽമക്കൾ’ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; תוך എന്നതിന്റെ ആവർത്തനവും ‘മധ്യത്തിൽ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: ഹീബ്രു വാചകത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ അതിനെ പദവിയാൽ പകരാതെ ലിപ്യന്തരിച്ചു. ‘യഹ്‌വേ’ സാധാരണ പണ്ഡിതപരമായ പുനർനിർമിത ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: בני ישראל എന്ന കൂട്ടനാമം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന ഘടനയുടെ ഉടമ്പടിപരമായ ഭാവം കാത്തുകൊണ്ട്, സ്ത്രീകളെ ഒഴിവാക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാത്ത സ്വാഭാവിക മലയാള കൂട്ടനാമം ഉപയോഗിച്ചു.
- issue: ദൈവം ദേശത്തിന്റെയും ജനത്തിന്റെയും മധ്യത്തിൽ വസിക്കുന്നു എന്ന ഇരട്ട പ്രസ്താവന
  choice: രണ്ടു പ്രസ്താവനകളും പ്രത്യേകം നിലനിർത്തി
  alternative: ഒറ്റ ‘നിങ്ങളുടെ മധ്യത്തിൽ’ എന്ന പ്രസ്താവനയായി ലളിതമാക്കുക
  rationale: ഹീബ്രുവിലെ בְּתוֹכָהּ, בְּתוֹךְ എന്നീ സമാന്തര പ്രയോഗങ്ങൾ ദൈവസാന്നിധ്യത്തെ ആദ്യം ദേശത്തോടും പിന്നെ യിസ്രായേൽമക്കളോടും ബന്ധിപ്പിക്കുന്നു; ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് ലളിതമാക്കി നീക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ദേശത്തെക്കുറിച്ചുള്ള ഏകവചന അഭിസംബോധനയും ദൈവത്തിന്റെ ‘മധ്യത്തിൽ വസിക്കൽ’ എന്ന ആവർത്തനവും സൂക്ഷിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു ശേഷമാണ് നൽകിയിരിക്കുന്നത്.
