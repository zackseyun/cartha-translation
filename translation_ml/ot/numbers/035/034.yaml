  to: നിങ്ങൾ പാർക്കുന്നതും, ഞാൻ അതിന്റെ മധ്യത്തിൽ വസിക്കുന്നതുമായ ദേശം അശുദ്ധമാക്കരുത്; കാരണം, യിസ്രായേൽമക്കളുടെ മധ്യത്തിൽ[a] വസിക്കുന്ന യഹ്‌വേ ഞാൻ ആകുന്നു.
