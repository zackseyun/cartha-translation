source:
  edition: WLC
  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: ml
  text: എന്നാൽ, അഭയനഗരത്തിലേക്ക് ഓടിപ്പോയ കൊന്നവൻ തന്റെ അഭയനഗരത്തിന്റെ അതിർത്തിക്കു പുറത്തേക്ക് തീർച്ചയായും പോകുന്നുവെങ്കിൽ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ‘പുറത്തുപോകുക’ എന്ന ക്രിയ ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയാരൂപവും ചേർത്ത് (‘പുറത്തുപോകുക—അവൻ പുറത്തുപോകുന്നുവെങ്കിൽ’) ഊന്നലോടെ പറയുന്നു. മറ്റൊരു പരിഭാഷ: ‘അവൻ ഓടിപ്പോയ തന്റെ അഭയനഗരത്തിന്റെ അതിർത്തിക്കു പുറത്തേക്ക് പോയാൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... പോയാൽ
  rationale: മുൻപുള്ള നിയമവ്യവസ്ഥയോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്ന നിബന്ധനയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יָצֹא יֵצֵא
  choice: എപ്പോഴെങ്കിലും പോയാൽ
  rationale: ഇൻഫിനിറ്റീവ് അബ്സല്യൂട്ടും ക്രിയാരൂപവും ചേർന്നുള്ള ഊന്നൽ, ഇവിടെ സംഭവസാധ്യതയെ ശക്തമായി മുന്നോട്ടുവയ്ക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: הָרֹצֵחַ
  choice: കൊന്നവൻ
  rationale: അഭയനഗരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ കുറ്റക്കാരനായ കൊലപാതകി എന്ന വിധിനിർണയം മുൻകൂട്ടി ചുമത്താതെ, ഒരാളെ കൊന്ന വ്യക്തി എന്ന നിയമപരമായ അർഥം നൽകുന്നു.
- source_word: אֶת גְּבוּל
  choice: അതിർത്തിക്കു പുറത്തേക്ക്
  rationale: יצא എന്ന ക്രിയയോടൊപ്പം അതിർത്തി കടന്ന് പുറത്തുപോകുന്ന നിയമപരമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: עִיר מִקְלָטוֹ
  choice: ആ നഗരത്തിന്റെ ... അഭയനഗരം
  rationale: മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ നിയമപദമായ ‘അഭയനഗരം’ ഉപയോഗിക്കുകയും ബന്ധസൂചന വാക്യഘടനയിൽ സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: അഭയനഗരത്തിലേക്ക് ഓടിപ്പോയ
  rationale: שָׁמָּהയിലെ ദിശാബോധവും נוס എന്ന ക്രിയയിലെ ഓടിപ്പോകൽ/പലായനം എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദം കുറ്റകരമായ കൊലപാതകിയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: കൊന്നവൻ
  alternative: കൊലപാതകി
  rationale: ഉടൻ വരുന്ന അഭയനഗരസന്ദർഭം മനപ്പൂർവമല്ലാത്ത വധവും ഉൾക്കൊള്ളുന്നതിനാൽ, ‘കൊലപാതകി’ എന്നത് കുറ്റബോധം മുൻകൂട്ടി നിർണയിച്ചേക്കാം; ‘കൊന്നവൻ’ ആ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, നിയമവാക്യത്തിന് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും നിലനിർത്തി. ‘കൊന്നവൻ’ എന്നത് സന്ദർഭത്തിലെ നിയമപരമായ നിഷ്പക്ഷത സംരക്ഷിക്കുന്നു; ‘എപ്പോഴെങ്കിലും’ ഹീബ്രു ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
