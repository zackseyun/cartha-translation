id: NUM.35.15
reference: Numbers 35:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾക്കും[a] അവരുടെ ഇടയിൽ വസിക്കുന്ന പരദേശിക്കും താമസക്കാരനും[b] വേണ്ടി ഈ ആറു നഗരങ്ങൾ അഭയസ്ഥാനങ്ങളായിരിക്കണം; അബദ്ധത്തിൽ ഒരാളെ കൊല്ലുന്ന ആർക്കും[c] അവിടേക്ക് ഓടിപ്പോകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശി’, ‘താമസക്കാരൻ’ എന്നിവ ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ ജീവിച്ചിരുന്ന സ്വദേശികളല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന രണ്ടു വ്യത്യസ്ത ഹീബ്രു പദങ്ങളുടെ വിവർത്തനങ്ങളാണ്.
    reason: cultural_note
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഒരു വ്യക്തിയെ അടിക്കുന്ന ഏവനും.’ ഇവിടെ മരണത്തിന് കാരണമാകുന്നയാളെയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: പദത്തിന്റെ അക്ഷരരൂപവും ഇസ്രായേൽ ജനത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ഉടമ്പടി-ദേശീയ സംജ്ഞയും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപമാണ്.
- source_word: גֵּר
  choice: പരദേശി
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിൽ വസിക്കുന്ന സ്വദേശിയല്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; תּוֹשָׁב എന്ന വ്യത്യസ്ത പദത്തിൽനിന്നുള്ള വേർതിരിവും നിലനിർത്തുന്നു.
- source_word: תּוֹשָׁב
  choice: താമസക്കാരൻ
  rationale: പൂർണ സ്വദേശപദവിയില്ലാതെ അവിടെ താമസിക്കുന്ന വ്യക്തി എന്ന ആശയം ലളിതമായി നൽകുകയും גֵּר എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּתוֹכָם
  choice: അവരുടെ ഇടയിൽ പാർക്കുന്ന
  rationale: ഇസ്രായേൽ സമൂഹത്തിനുള്ളിലെ വാസത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഈ പ്രയോഗം തുടർന്നുള്ള രണ്ടു നാമങ്ങളോടും അർത്ഥപരമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה
  choice: ഈ ആറു നഗരങ്ങൾ ... ആയിരിക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ സ്വഭാവം മലയാളത്തിലെ ‘ആയിരിക്കണം’ എന്ന രൂപം യോജിച്ച ഗൗരവത്തോടെ നൽകുന്നു.
- source_word: לְמִקְלָט
  choice: അഭയസ്ഥാനങ്ങളായി
  rationale: അപകടത്തിൽ ആളെ കൊന്നവന് സംരക്ഷണം ലഭിക്കുന്ന നിയമപരമായ അഭയസ്ഥലം എന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לָנוּס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകാം
  rationale: നഗരങ്ങളുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഹീബ്രു അനന്തക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ സാധ്യത/അനുമതി രൂപത്തിൽ നൽകുന്നു.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: ഒരാളെ കൊല്ലുന്ന ആർക്കും
  rationale: അക്ഷരാർഥമായ ‘ഒരു വ്യക്തിയെ അടിച്ചുവീഴ്ത്തുന്ന ഏവനും’ എന്നതിനേക്കാൾ നിയമസന്ദർഭത്തിലെ മരണകാരണം വ്യക്തമായി അറിയിക്കുന്നു; ‘കൊലപാതകി’ എന്ന ഉദ്ദേശപൂർവതയുടെ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: נֶפֶשׁ
  choice: ഒരാൾ
  rationale: ഇവിടെ ‘ആത്മാവ്’ എന്നല്ല, കൊല്ലപ്പെട്ട മനുഷ്യവ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: בִּשְׁגָגָה
  choice: അബദ്ധത്തിൽ
  rationale: മനഃപൂർവമല്ലാത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന നിയമപരമായ വ്യത്യാസം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക ഉടമ്പടി-ദേശീയ സംജ്ഞ
  choice: പ്രധാനപാഠത്തിൽ ‘ഇസ്രായേൽമക്കൾ’ നിലനിർത്തി
  alternative: ‘ഇസ്രായേല്യർ’
  rationale: ഹീബ്രുവിലെ അക്ഷരഘടനയും പരമ്പരാഗത ദേശീയ-ഉടമ്പടി സംജ്ഞയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ സ്വാഭാവികമായ വംശനാമം നൽകുന്നു.
- issue: גֵּר, תּוֹשָׁב എന്നീ രണ്ടു സാമൂഹിക-നിയമ പദങ്ങളുടെ വ്യത്യാസം
  choice: ‘പരദേശി’, ‘താമസക്കാരൻ’ എന്നിങ്ങനെ രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ചു
  alternative: രണ്ടിനെയും പൊതുവായി ‘വിദേശി’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: മൂലപാഠം സൂക്ഷിക്കുന്ന പദവ്യത്യാസം ഇല്ലാതാക്കാതെ, അതിന്റെ കൃത്യമായ സാമൂഹിക പരിധിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സമ്മതിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. അപൂർവമോ അതിസാങ്കേതികമോ ആയ പദങ്ങൾ ഒഴിവാക്കി; എന്നാൽ ഗֵּר/תּוֹשָׁב വ്യത്യാസവും ‘ഇസ്രായേൽമക്കൾ’ എന്ന മൂലരൂപവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
