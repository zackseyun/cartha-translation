id: NUM.35.22
reference: Numbers 35:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: ml
  text: എന്നാൽ ശത്രുതയില്ലാതെ പെട്ടെന്ന് ഒരാളെ തള്ളുകയോ, പതിയിരിക്കാതെ[a] അയാളുടെ നേരെ ഏതെങ്കിലും വസ്തു എറിയുകയോ ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘പതിയിരുന്ന് ആക്രമിക്കാതെ’ അല്ലെങ്കിൽ ‘മുൻകൂട്ടി ആസൂത്രണം ചെയ്യാതെ.’ അക്ഷരാർഥം: ‘പതിയിരിക്കാതെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: മുൻവാക്യങ്ങളിലെ മനഃപൂർവമായ പ്രവൃത്തിക്കു വിരുദ്ധമായ ഒരു വ്യവസ്ഥ ഇവിടെ അവതരിപ്പിക്കുന്നു.
- source_word: בְּפֶתַע
  choice: പെട്ടെന്ന്
  rationale: അപ്രതീക്ഷിതമായോ പൊടുന്നനെയോ സംഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: בְּלֹא אֵיבָה
  choice: ശത്രുതയില്ലാതെ
  rationale: വ്യക്തികൾ തമ്മിലുള്ള വിദ്വേഷമോ ശത്രുതയോ ഇല്ലെന്ന എബ്രായ ആശയം ലളിതമായി വ്യക്തമാക്കുന്നു.
- source_word: הֲדָפוֹ
  choice: ഒരാളെ തള്ളുകയോ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ തള്ളുക എന്നത് നിയമസന്ദർഭത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു; മുൻവാക്യത്തിൽ നിന്നു വേർതിരിച്ചു വായിക്കുമ്പോഴും കർത്താവല്ല, ബാധിതനാണ് സൂചിതനെന്ന് വ്യക്തമാക്കാൻ ‘ഒരാളെ’ ഉപയോഗിച്ചു.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: അയാളുടെ നേരെ ... എറിയുകയോ
  rationale: עַל സഹിതമുള്ള പ്രയോഗം വസ്തു ആ വ്യക്തിയെ ലക്ഷ്യമാക്കി അഥവാ അയാളുടെ മേൽ എറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל כְּלִי
  choice: ഏതെങ്കിലും വസ്തു
  rationale: כְּלִי എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുകയും ‘പാത്രം’ പോലുള്ള അനാവശ്യമായ സങ്കുചിത അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: בְּלֹא צְדִיָּה
  choice: പതിയിരിക്കാതെ
  rationale: പതിയിരുന്ന് ആക്രമിക്കുക എന്ന മൂർത്തമായ നിയമചിത്രം നിലനിർത്തുന്നു; ‘മുൻകൂട്ടിയുള്ള ആസൂത്രണമില്ലാതെ’ എന്ന വിശാലമായ ആധുനിക നിയമവിഭാഗം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: അബദ്ധപ്രവൃത്തിയും ശത്രുതാപൂർവമായ പ്രവൃത്തിയും തമ്മിലുള്ള നിയമവ്യത്യാസം
  choice: ‘ശത്രുതയില്ലാതെ’ എന്നും ‘പതിയിരിക്കാതെ’ എന്നും രണ്ടു വ്യത്യസ്ത ഘടകങ്ങളായി നിലനിർത്തി
  alternative: ഇരുവരെയും ‘മനഃപൂർവമല്ലാതെ’ എന്ന ഒറ്റ ആശയമായി ലയിപ്പിക്കുക
  rationale: മൂലപാഠം വ്യക്തിപരമായ ശത്രുതയും പതിയിരിപ്പും വേർതിരിച്ചു പറയുന്നു; അവയെ ലയിപ്പിക്കുന്നത് നിയമപരവും നൈതികവുമായ സൂക്ഷ്മത ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔപചാരിക നിയമഭാഷ. എബ്രായ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക വ്യവസ്ഥാവാക്യക്രമം സ്വീകരിച്ചു; എന്നാൽ ശത്രുത, പെട്ടെന്നുള്ള തള്ളൽ, പതിയിരിപ്പില്ലാത്ത എറിയൽ എന്നീ ഘടകങ്ങൾ പ്രത്യേകം നിലനിർത്തി.
