source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: ml
  text: നഗരങ്ങളിൽ മൂന്നെണ്ണം യോർദാന്റെ മറുകരയിൽ[b] നിങ്ങൾ നിശ്ചയിക്കണം[a]; നഗരങ്ങളിൽ മൂന്നെണ്ണം കനാൻദേശത്തും നിങ്ങൾ നിശ്ചയിക്കണം. അവ അഭയനഗരങ്ങളായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നൽകണം’; എബ്രായക്രിയയുടെ അക്ഷരാർഥം ‘നൽകുക’ എന്നാണ്. ഇവിടെ ഈ ആവശ്യത്തിനായി നഗരങ്ങളെ ഏൽപ്പിക്കുക അഥവാ വേർതിരിക്കുക എന്ന അർഥത്തിലാണ് അത് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘യോർദാനക്കരെ’ അല്ലെങ്കിൽ ‘യോർദാനപ്പുറത്ത്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: നിങ്ങൾ നിശ്ചയിക്കണം
  rationale: נתן എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘നൽകുക’ എന്നാണെങ്കിലും, ഇവിടെ ഒരു പ്രത്യേക ആവശ്യത്തിനായി നഗരങ്ങളെ ഔദ്യോഗികമായി വേർതിരിക്കുന്ന നിയമപരമായ അർഥമാണ്. ‘നിശ്ചയിക്കണം’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: യോർദാന്റെ മറുകരയിൽ
  rationale: ഈ പ്രയോഗം യോർദാന്റെ മറുവശത്തുള്ള പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ‘മറുകരയിൽ’ ഭൂമിശാസ്ത്രപരമായ ബന്ധം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു; നിർബന്ധിതമായ ഒരു ദർശനസ്ഥാനം വ്യക്തമാക്കുന്നില്ല.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: കനാൻദേശത്ത്
  rationale: മൂലപാഠത്തിലെ ‘കനാൻദേശം’ എന്ന പ്രദേശപരമായ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: עָרֵי מִקְלָט
  choice: അഭയനഗരങ്ങൾ
  rationale: അബദ്ധത്തിൽ ഒരാളെ കൊന്നവന് സംരക്ഷണം ലഭിക്കാനായി വേർതിരിച്ച നഗരങ്ങളെ സൂചിപ്പിക്കുന്ന നിയമപരമായ പദമാണ്. ‘അഭയനഗരങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആധുനിക രാഷ്ട്രീയ അഭയാർഥിത്വത്തിന്റെ അനാവശ്യ സൂചനകളില്ലാത്തതുമാണ്.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: നഗരങ്ങളിൽ മൂന്നെണ്ണം ... നഗരങ്ങളിൽ മൂന്നെണ്ണം
  rationale: നിശ്ചിതരൂപത്തിലുള്ള ‘നഗരങ്ങൾ’ എന്ന മൂലപാഠം, മുമ്പ് പരാമർശിച്ച വലിയ നഗരസമൂഹത്തിൽനിന്നുള്ള മൂന്നു വീതം നഗരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നഗരങ്ങളിൽ മൂന്നെണ്ണം’ ഈ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: תִּהְיֶינָה
  choice: അവ ... ആയിരിക്കണം
  rationale: ഈ അപൂർണക്രിയ ആറു നഗരങ്ങളുടെയും നിശ്ചിത പദവിയും ഉദ്ദേശ്യവും പ്രസ്താവിക്കുന്നു. ‘ആയിരിക്കണം’ നിയമപരമായ നിർദേശസ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ രണ്ടു സമാന്തര വാക്യഘടനകളും ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തി; ‘അഭയനഗരങ്ങൾ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന രീതിയിൽ തിരഞ്ഞെടുത്തു.
