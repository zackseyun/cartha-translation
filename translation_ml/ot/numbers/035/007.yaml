  terminology: ‘ലേവ്യർ’ is standard. ‘മേച്ചിൽപ്പുറങ്ങൾ’ is a viable contextual rendering of מִגְרְשֵׁיהֶן; the footnote appropriately preserves ‘പൊതുഭൂമികൾ’ and open land as alternatives. ‘പട്ടണം’ is suitable for עִיר in this context.
  issues:
