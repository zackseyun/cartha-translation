language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּל הֶ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה עִ֑יר אֶתְ/הֶ֖ן וְ/אֶת מִגְרְשֵׁי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: ml
  text: ലേവ്യർക്കു നിങ്ങൾ കൊടുക്കേണ്ട പട്ടണങ്ങൾ ആകെ നാൽപ്പത്തെട്ടായിരിക്കും; ആ പട്ടണങ്ങളും അവയുടെ മേച്ചിൽപ്പുറങ്ങളും നിങ്ങൾ കൊടുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേച്ചിൽപ്പുറങ്ങൾ’ എന്നതിന് ‘പൊതുഭൂമികൾ’ എന്നോ ‘പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള തുറന്ന ഭൂമി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: പട്ടണങ്ങൾ ആകെ
  rationale: כָּל ഇവിടെ ലേവ്യർക്കു നൽകേണ്ട പട്ടണങ്ങളുടെ പൂർണസംഖ്യയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ആകെ’ എന്നത് ഈ മൊത്തം കണക്കിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു. עִיר എന്നതിന് ഈ നിയമസന്ദർഭത്തിൽ ‘പട്ടണം’ അനുയോജ്യമാണ്.
- source_word: אֲשֶׁר תִּתְּנוּ לַלְוִיִּם
  choice: നിങ്ങൾ ലേവ്യർക്കു കൊടുക്കേണ്ട
  rationale: נתן എന്ന ക്രിയയുടെ രണ്ടാം പുരുഷ ബഹുവചന അപൂർണരൂപം ഇവിടെ നിർദേശാത്മക അർഥമുള്ളതിനാൽ ‘കൊടുക്കേണ്ട’ എന്നു പരിഭാഷപ്പെടുത്തി; לַלְוִיִּם എന്നത് ‘ലേവ്യർക്കു’ എന്നു നേരിട്ട് നൽകി.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: നാൽപ്പത്തെട്ടായിരിക്കണം
  rationale: എബ്രായയിലെ ‘നാൽപ്പതും എട്ടും’ എന്ന സംഖ്യപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘നാൽപ്പത്തെട്ട്’ എന്നു നൽകി; നിയമനിർദേശത്തിന്റെ ഭാവം ‘ആയിരിക്കണം’ നിലനിർത്തുന്നു.
- source_word: אֶתְהֶן
  choice: ആ പട്ടണങ്ങളും
  rationale: സർവനാമപ്രത്യയത്തോടുകൂടിയ കർമചിഹ്നം എണ്ണപ്പെട്ട പട്ടണങ്ങളെ വീണ്ടും എടുത്തുപറയുന്നു. അതിന്റെ ആവർത്തന ഊന്നൽ നഷ്ടപ്പെടാതിരിക്കാൻ ‘ആ പട്ടണങ്ങളും’ എന്നു വ്യക്തമാക്കി.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: അവയുടെ മേച്ചിൽപ്പുറങ്ങളും
  rationale: מִגְרָשׁ പട്ടണത്തിനു ചുറ്റുമുള്ള തുറന്നതോ പൊതുവായതോ ആയ ഭൂമിയെ, ഈ സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് കന്നുകാലികളുടെ ഉപയോഗത്തിനുള്ള പ്രദേശത്തെ, സൂചിപ്പിക്കുന്നു. ‘മേച്ചിൽപ്പുറങ്ങൾ’ അതിന്റെ പ്രവർത്തനപരമായ അർഥം വ്യക്തമായി നൽകുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ മൊത്തംസംഖ്യയും אֶתְהֶן നൽകുന്ന ആവർത്തന ഊന്നലും സംരക്ഷിച്ചിരിക്കുന്നു; വാക്യത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു.
