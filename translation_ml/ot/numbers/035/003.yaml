reference: Numbers 35:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָי֧וּ הֶֽ/עָרִ֛ים לָ/הֶ֖ם לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֗ם יִהְי֤וּ לִ/בְהֶמְתָּ/ם֙ וְ/לִ/רְכֻשָׁ֔/ם וּ/לְ/כֹ֖ל חַיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: ml
  text: ആ പട്ടണങ്ങൾ അവർക്ക് താമസിക്കാനുള്ളവയായിരിക്കണം; അവരുടെ മേച്ചിൽപ്പുറങ്ങൾ അവരുടെ കന്നുകാലികൾക്കും സ്വത്തുവകകൾക്കും അവരുടെ എല്ലാ മൃഗങ്ങൾക്കും വേണ്ടിയുള്ളവയായിരിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָרִים
  choice: ആ പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം. ഈ നിയമപരമായ ഭൂവിഹിതസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לָשָׁבֶת
  choice: താമസിക്കാനുള്ളവയായിരിക്കണം
  rationale: ישׁב എന്ന ധാതുവിന്റെ ‘താമസിക്കുക, വസിക്കുക’ എന്ന അർഥവും ഇവിടെ കാണുന്ന ഉദ്ദേശ്യസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִגְרְשֵׁיהֶם
  choice: അവരുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: מִגְרָשׁ പട്ടണത്തിനു ചുറ്റുമുള്ള തുറസ്സായ പൊതുഭൂമിയെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യത്തിൽ മൃഗസംരക്ഷണമാണ് പ്രധാന ഉപയോഗമെന്നതിനാൽ ‘മേച്ചിൽപ്പുറങ്ങൾ’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: לִבְהֶמְתָּם
  choice: അവരുടെ കന്നുകാലികൾക്കും
  rationale: בְּהֵמָה ഇവിടെ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലികൾ’ ആ ഭൂവിനിയോഗസന്ദർഭത്തിൽ സ്വാഭാവികമായ കൂട്ടനാമമാണ്.
- source_word: לִרְכֻשָׁם
  choice: സ്വത്തുവകകൾക്കും
  rationale: רְכוּשׁ എന്നത് ഒരാളുടെ സ്വത്ത്, സമ്പാദ്യം, കൈവശവസ്തുക്കൾ എന്നിവയെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് വിശാലമായ അർഥം നൽകാൻ ‘സ്വത്തുവകകൾ’ ഉപയോഗിച്ചു.
- source_word: וּלְכֹל חַיָּתָם
  choice: മറ്റെല്ലാ മൃഗങ്ങൾക്കും
  rationale: חַיָּהയ്ക്ക് ‘ജീവി’ എന്നും ‘മൃഗം’ എന്നും അർഥമുണ്ട്. കന്നുകാലികളെ നേരത്തെ പ്രത്യേകം പറഞ്ഞതിനാൽ ശേഷിക്കുന്ന എല്ലാ മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന അർഥം വ്യക്തമാക്കാൻ ‘മറ്റെല്ലാ മൃഗങ്ങൾക്കും’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമപരമായ ശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ സമാന്തരഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ വായനയ്ക്കായി വിഭക്തികൾ ഏകോപിപ്പിച്ചു.
