  to: 'യഹ്‌വെ മോശയോടു മോവാബിന്റെ സമതലങ്ങളിൽ, യെരീഹോവിനടുത്തുള്ള യോർദ്ദാന്റെ തീരത്ത്, ഇപ്രകാരം അരുളിച്ചെയ്തു:'
