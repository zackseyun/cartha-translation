id: NUM.35.1
reference: Numbers 35:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു മോവാബിന്റെ സമതലങ്ങളിൽ, യെരീഹോവിനടുത്തുള്ള യോർദ്ദാന്റെ തീരത്ത്, ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; തുടർന്നുള്ള לֵאמֹר എന്ന ഉദ്ധരണി-ആമുഖത്തെയും ഒരുമിച്ച് സ്വാഭാവികമായി കൈകാര്യം ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബിന്റെ സമതലങ്ങളിൽ
  rationale: עֲרָבוֹת സൂചിപ്പിക്കുന്ന സമതലപ്രദേശത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിന് സമീപം യോർദ്ദാനരികെവെച്ച്
  rationale: ഭൂമിശാസ്ത്രപരമായ ബന്ധം യെരീഹോയ്ക്ക് എതിർവശത്തുള്ള യോർദ്ദാൻ പ്രദേശമെന്ന നിലയിൽ അമിതമായി വ്യാഖ്യാനിക്കാതെ, മൂലത്തിലെ സ്ഥലസാമീപ്യം സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയുള്ളതിനാൽ, ഒരു പദവിയായ ‘കർത്താവ്’ എന്ന് പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘അരുളിച്ചെയ്തു’ ദൈവവചനസന്ദർഭത്തിലെ മാന്യത നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന ലളിതമാണ്.
