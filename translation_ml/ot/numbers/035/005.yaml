translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി സ്വീകരിച്ചു. ആവർത്തിക്കുന്ന അളവുകളും നാലു ദിക്കുകളും മൂലപാഠത്തിന്റെ ഘടനപ്രകാരം നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ സൂചനകൾ അവ വിശദീകരിക്കുന്ന യഥാർത്ഥ പദങ്ങൾക്കു പിന്നാലെ ചേർത്തു.
