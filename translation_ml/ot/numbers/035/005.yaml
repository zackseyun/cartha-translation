  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: ml
  text: 'നഗരത്തിനു പുറത്തായി നിങ്ങൾ അളക്കണം: കിഴക്കുവശം രണ്ടായിരം മുഴം, തെക്കുവശം രണ്ടായിരം മുഴം, പടിഞ്ഞാറുവശം[a] രണ്ടായിരം മുഴം, വടക്കുവശം രണ്ടായിരം മുഴം; നഗരം നടുവിലായിരിക്കെ. ഇത് അവർക്കുള്ള നഗരങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങളായിരിക്കും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പടിഞ്ഞാറ്’ എന്നതിനുള്ള എബ്രായപദം അക്ഷരാർഥത്തിൽ ‘കടൽ’ എന്നാണ്; മധ്യധരണ്യാഴിയെ ആധാരമാക്കിയ പതിവായ ദിശാപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘നഗരങ്ങളുടെ പൊതുഭൂമി’ അല്ലെങ്കിൽ ‘നഗരങ്ങളെ ചുറ്റിയുള്ള തുറസ്സായ ഭൂമി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദം നഗരത്തിനു ചുറ്റുമുള്ള, പലപ്പോഴും മേച്ചിലിനായി ഉപയോഗിച്ചിരുന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: നിങ്ങൾ അളക്കണം
  rationale: നിയമനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്ക് നിർദേശാത്മക ബലം ഉണ്ട്; ബഹുവചന അഭിസംബോധനയും അളക്കുന്ന പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מִחוּץ לָעִיר
  choice: നഗരത്തിനു പുറത്തായി
  rationale: അളവ് നഗരപരിധിക്കു പുറത്തുള്ള സ്ഥലത്താണ് എടുക്കേണ്ടതെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: פְּאַת
  choice: വശം
  rationale: നാലു ദിക്കുകളിലുമുള്ള അളവുകൾ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വശം’ എന്നത് ‘മൂല’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: കിഴക്ക് / തെക്ക് / പടിഞ്ഞാറ് / വടക്ക്
  rationale: നാലു പദങ്ങളും ഇവിടെ ദിക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; יָם അക്ഷരാർഥത്തിൽ ‘കടൽ’ ആണെങ്കിലും പതിവായ ദിശാപ്രയോഗത്തിൽ പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: രണ്ടായിരം മുഴം
  rationale: മൂലപാഠത്തിലെ പുരാതന അളവുകോൽ ആധുനിക ഏകകത്തിലേക്ക് മാറ്റാതെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: നഗരം നടുവിലായിരിക്കണം
  rationale: അളക്കപ്പെട്ട പ്രദേശത്തിന്റെ നടുവിലാണ് നഗരം എന്ന സ്ഥലക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: ഇതായിരിക്കും അവർക്കുള്ള
  rationale: ഉടമസ്ഥാവകാശം എന്ന ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ നിയമപരമായ നിയോഗം നിലനിർത്തുന്നു.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: നഗരങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങൾ
  rationale: നഗരങ്ങളെ ചുറ്റിയുള്ള തുറസ്സായ ഭൂമിയെയും അതിന്റെ സാധാരണ മേച്ചിൽ ഉപയോഗത്തെയും വായനാസൗകര്യത്തോടെ സൂചിപ്പിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
