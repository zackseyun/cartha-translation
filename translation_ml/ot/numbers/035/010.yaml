  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു[a] സംസാരിച്ച് അവരോടു പറയുക: ‘നിങ്ങൾ യോർദ്ദാൻ കടന്ന് കനാൻദേശത്തേക്കു ചെല്ലുമ്പോൾ,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യരോടു” അല്ലെങ്കിൽ “ഇസ്രായേലിന്റെ മക്കളോടു.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിച്ച്
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു; തുടർന്നുള്ള സമാന ആജ്ഞയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ വിനയെച്ചരൂപം ഉപയോഗിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബബന്ധമുള്ള എബ്രായ പ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിലെ പതിവും മാന്യവുമായ സംയുക്തരൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: ‘സംസാരിക്കുക ... പറയുക’ എന്ന മൂലപാഠത്തിലെ ഇരട്ട ക്രിയാഘടനയും ആജ്ഞാശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: כִּי
  choice: ചെല്ലുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സാഹചര്യത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ കാലസൂചകമായ ‘-ുമ്പോൾ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אַתֶּם עֹבְרִים
  choice: നിങ്ങൾ ... കടന്ന് ... ചെല്ലുമ്പോൾ
  rationale: സർവനാമത്തോടുകൂടിയ കർത്തൃവാചക പങ്കാളിത്തരൂപം സമീപഭാവിയിലെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: אֶת הַיַּרְדֵּן
  choice: യോർദ്ദാൻ
  rationale: നദിയുടെ പരമ്പരാഗത മലയാള ഭൂമിശാസ്ത്രനാമം; ‘നദി’ മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ ചേർത്തില്ല.
- source_word: אַרְצָה כְּנָעַן
  choice: കനാൻദേശത്തേക്കു
  rationale: אֶרֶץ എന്ന പദവും ദിശാസൂചകമായ -ָה അന്ത്യവും പ്രതിഫലിപ്പിച്ച് ദേശത്തിലേക്കുള്ള ഗതി വ്യക്തമാക്കുന്നു; ‘കടന്ന് ... ചെല്ലുക’ പ്രവേശനസന്ദർഭം സ്വാഭാവികമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ ‘സംസാരിക്കുക ... പറയുക’ എന്ന ആവർത്തനം നിലനിർത്തി. വാക്യം അടുത്ത നിയമനിർദേശത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
