  - marker: a
    text: അഥവാ ‘രക്തത്തിന്റെ പ്രതികാരകൻ.’ ഒരു ബന്ധുവിന്റെ രക്തത്തിന് പ്രതികാരം ചെയ്യാനുള്ള ചുമതലയുള്ള വ്യക്തിയെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഈ ന്യായവിധികൾ.’ എബ്രായ പദം നിയമപരമായ വിധികളെയോ ചട്ടങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: അപ്പോൾ ... വിധിക്കണം
  rationale: നിയമനടപടികളുടെ ക്രമത്തിൽ വരുന്ന ഈ ക്രിയാരൂപം തുടർന്നുള്ള നിർബന്ധിത നടപടിയെ സൂചിപ്പിക്കുന്നു; ‘വിധിക്കണം’ അതിന്റെ ന്യായവിധിയുടെയും ബാധ്യതയുടെയും അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעֵדָה
