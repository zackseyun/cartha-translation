- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: കൊല്ലപ്പെട്ട ബന്ധുവിന്റെ രക്തത്തിന് പ്രതികാരം ചെയ്യാനുള്ള ചുമതലയുള്ള നിയമപരമായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരിക സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: עַל
