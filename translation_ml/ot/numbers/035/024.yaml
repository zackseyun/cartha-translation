theological_decisions:
- issue: നരഹത്യ സംബന്ധിച്ച വിധിനിർണയത്തിൽ സമൂഹത്തിന്റെ പങ്ക്
  choice: പ്രഹരിച്ചവനും രക്തപ്രതികാരകനും തമ്മിൽ സഭ വിധി നിർണയിക്കുന്നു; പ്രതിയെ മുൻകൂട്ടി കൊലപാതകിയെന്ന് വിളിക്കുന്നില്ല.
  alternative: സഭയെ ഒരു ഇടുങ്ങിയ പ്രത്യേക കോടതിയായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ പ്രഹരിച്ചവനെ ഇതിനകം കുറ്റം തെളിഞ്ഞ കൊലപാതകിയായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായ വാക്യം സമൂഹത്തിന് ന്യായവിധിയുടെ ചുമതല നൽകുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ പ്രതിയുടെ കുറ്റസ്വഭാവം അന്തിമമായി നിർണയിക്കുന്നില്ല. അതിനാൽ നടപടിക്രമപരമായ നിഷ്പക്ഷത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഔപചാരികമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മലയാളം. നിയമസന്ദർഭത്തിന്റെ ഗൗരവം സൂക്ഷിക്കാൻ ‘സഭ’, ‘വിധിക്കണം’, ‘നിയമവിധികൾ’ എന്നിവ ഉപയോഗിച്ചു; കുറ്റം മുൻകൂട്ടി നിർണയിക്കുന്ന ഭാഷ ഒഴിവാക്കി.
