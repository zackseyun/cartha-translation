  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: ml
  text: ഇവ നിങ്ങൾക്കു തലമുറതലമുറയായി നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും ന്യായവിധിസംബന്ധമായ ഒരു ചട്ടമായിരിക്കണം[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായവിധിയുടെ ഒരു ചട്ടം” അല്ലെങ്കിൽ “ഒരു നിയമചട്ടം.” എബ്രായപ്രയോഗം നിയമമായി നിശ്ചയിച്ച ചട്ടത്തെയും ന്യായവിധി അഥവാ ന്യായനടപടിയെയും സൂചിപ്പിക്കുന്ന പദങ്ങൾ ചേർത്തുപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ എല്ലാ കുടിയിരിപ്പുകളിലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה
  choice: ഇവ ... ആയിരിക്കണം
  rationale: നിയമസന്ദർഭത്തിലെ ഭാവി-നിർദേശക ഭാവവും മുമ്പു പറഞ്ഞ വ്യവസ്ഥകളിലേക്കുള്ള ബഹുവചനസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങൾക്കു
  rationale: ഇസ്രായേലിനോടു അഭിമുഖമായി പറയുന്ന നിയമവ്യവസ്ഥകളുടെ ബന്ധസൂചകമായ ലാമെദിനെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: ന്യായവിധിക്കുള്ള ഒരു ചട്ടം
  rationale: חֻקָּה എന്ന നിയമചട്ടത്തിന്റെയും מִשְׁפָּט എന്ന ന്യായവിധി/ന്യായനടപടിയുടെയും സംയുക്ത നിയമാർഥം നിലനിർത്തുന്നു; ഇതിനെ പൊതുവായ ‘നീതി’ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: לְדֹרֹתֵיכֶם
  choice: തലമുറതലമുറയായി
  rationale: തുടർച്ചയായ തലമുറകളിലുടനീളമുള്ള ബാധകത ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: നിങ്ങളുടെ എല്ലാ വാസസ്ഥലങ്ങളിലും
  rationale: מוֹשָׁב എന്നതിന്റെ താമസസ്ഥലം/കുടിയിരിപ്പ് എന്ന സ്ഥലാർഥവും בְּכֹל എന്ന സമഗ്രവ്യാപ്തിയും സൂക്ഷിക്കുന്നു.
