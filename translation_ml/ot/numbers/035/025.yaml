source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: ml
  text: അപ്പോൾ സഭ, ഒരാളെ കൊന്നവനെ രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവന്റെ[a] കൈയിൽനിന്ന് രക്ഷിക്കണം; സഭ അവനെ, അവൻ ഓടിച്ചെന്ന തന്റെ അഭയനഗരത്തിലേക്ക് തിരികെ കൊണ്ടുപോകണം. വിശുദ്ധ എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്യപ്പെട്ട[c] മഹാപുരോഹിതൻ മരിക്കുന്നതുവരെ അവൻ അവിടെ പാർക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രക്തപ്രതികാരകൻ.’ ചൊരിയപ്പെട്ട രക്തത്തിന് പ്രതികാരം ചെയ്യാനുള്ള നിയമപരമായ ഉത്തരവാദിത്വമുള്ള വ്യക്തിയെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്; സാധാരണയായി അയാൾ അടുത്ത ബന്ധുവായിരിക്കും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവിടെത്തന്നെ കഴിയണം’ അല്ലെങ്കിൽ ‘അവിടെ വസിക്കണം.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘അവനെ വിശുദ്ധ എണ്ണകൊണ്ട് അഭിഷേകം ചെയ്ത [ആൾ].’ ‘അഭിഷേകം ചെയ്തു’ എന്ന ഹീബ്രു ക്രിയ സജീവരൂപത്തിലാണ്, എന്നാൽ അതിന്റെ കർത്താവിനെ ഇവിടെ വ്യക്തമായി പറയുന്നില്ല. വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ കർമണിപ്രയോഗം ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: രക്ഷിച്ച്
  rationale: ഹിഫീൽ രൂപം മറ്റൊരാളുടെ അധികാരത്തിൽനിന്ന് വിടുവിക്കുക എന്ന ആശയം നൽകുന്നു; ഇവിടെ സഭ നൽകുന്ന നിയമപരമായ സംരക്ഷണത്തിന് ‘രക്ഷിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: הָעֵדָה
  choice: സഭ
  rationale: ന്യായവിധി നിർവഹിക്കുന്ന ഒത്തുചേർന്ന സമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘സഭ’ അതിന്റെ ഔപചാരികവും സമൂഹപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: הָרֹצֵחַ
  choice: മനുഷ്യനെ കൊന്നവൻ
  rationale: ഈ അധ്യായത്തിൽ മനഃപൂർവമല്ലാത്ത നരഹത്യയും പരിഗണിക്കുന്നതിനാൽ ‘കൊലയാളി’ എന്നു പറഞ്ഞ് കുറ്റബോധം മുൻകൂട്ടി വിധിക്കുന്നില്ല.
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: ചൊരിഞ്ഞ രക്തത്തിന് നിയമപരമായി പ്രതികാരം ചെയ്യാനുള്ള ഉത്തരവാദിത്വമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തമായ പദപ്രയോഗം.
- source_word: עִיר מִקְלָטוֹ
  choice: അവന്റെ അഭയനഗരം
  rationale: ഈ അധ്യായത്തിലെ സ്ഥാപിതമായ നിയമസംവിധാനത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: וְיָשַׁב בָּהּ
  choice: അവൻ അവിടെ പാർക്കണം
  rationale: ישב എന്ന പദത്തിന്റെ താമസിക്കുക, നിലനിൽക്കുക എന്നീ അർഥങ്ങളെ ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: മഹാപുരോഹിതൻ മരിക്കുന്നതുവരെ
  rationale: ഹീബ്രു നാമവാചകപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: അവനെ അഭിഷേകം ചെയ്ത
  rationale: ക്രിയയുടെ സജീവരൂപവും വ്യക്തമാക്കാത്ത കർത്താവും നിലനിർത്തുന്നു; ‘അഭിഷേകം ചെയ്യപ്പെട്ട’ എന്ന കർമണിപ്രയോഗത്തിലൂടെ വാക്യഘടനയെ നിശ്ശബ്ദമായി പരിഹരിക്കുന്നില്ല.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: വിശുദ്ധതൈലംകൊണ്ട്
  rationale: പ്രതിഷ്ഠയ്ക്കുള്ള നിർദിഷ്ടമായ വിശുദ്ധ എണ്ണയെ അടുത്തും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദം സൂചിപ്പിക്കുന്ന വ്യക്തിയുടെ നിയമപരമായ നില
  choice: ‘മനുഷ്യനെ കൊന്നവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘കൊലയാളി’ അല്ലെങ്കിൽ ‘കുലപാതകൻ’
  rationale: ഈ നിയമഭാഗം മനഃപൂർവമായ കൊലപാതകത്തെയും അബദ്ധത്തിൽ സംഭവിച്ച നരഹത്യയെയും വേർതിരിക്കുന്നു. അതിനാൽ കുറ്റം മുൻകൂട്ടി നിശ്ചയിക്കുന്ന പദം ഒഴിവാക്കി.
- issue: מָשַׁח אֹתוֹ എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘അവനെ അഭിഷേകം ചെയ്ത’ എന്ന സജീവപ്രയോഗം നിലനിർത്തി.
  alternative: ‘അഭിഷേകം ചെയ്യപ്പെട്ട’
  rationale: ഹീബ്രുവിൽ ക്രിയ സജീവരൂപത്തിലാണ്; കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. കർമണിപ്രയോഗത്തിലേക്ക് മാറ്റാതെ ഈ യഥാർഥ വാക്യഘടനാപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരമായ ഭാവം നിലനിർത്തിക്കൊണ്ട് അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി. അവസാന ഉപവാക്യത്തിലെ ഹീബ്രു സജീവക്രിയയും വ്യക്തമാക്കാത്ത കർത്താവും മനഃപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
