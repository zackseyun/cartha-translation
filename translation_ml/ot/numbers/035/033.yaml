id: NUM.35.33
reference: Numbers 35:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: ml
  text: നിങ്ങൾ പാർക്കുന്ന ദേശത്തെ അശുദ്ധമാക്കരുത്; കാരണം രക്തംതന്നെ ദേശത്തെ അശുദ്ധമാക്കുന്നു. അതിൽ ചൊരിയപ്പെട്ട രക്തംനിമിത്തം ദേശത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ കഴിയുകയില്ല[a]—രക്തം ചൊരിഞ്ഞവന്റെ രക്തത്താൽ മാത്രമേ കഴിയൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അതിൽ ചൊരിയപ്പെട്ട രക്തത്തെ സംബന്ധിച്ച് ദേശത്തിന് പാപപരിഹാരം വരുത്താൻ കഴിയുകയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: അശുദ്ധമാക്കുക
  rationale: രക്തച്ചൊരിച്ചിൽ ദേശത്തെ ധാർമികമായും വിശുദ്ധിയുമായി ബന്ധപ്പെട്ടും മലിനമാക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; പരിസ്ഥിതിമലിനീകരണം മാത്രം സൂചിപ്പിക്കാവുന്ന ‘മലിനമാക്കുക’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ മുഴുവൻ ഭൂമിയെയല്ല, ഇസ്രായേൽ പാർക്കുന്ന നിർദിഷ്ട ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: כִּי הַדָּם הוּא
  choice: രക്തം
  rationale: הוּא വിഷയത്തെ ഊന്നുന്നുണ്ടെങ്കിലും മലയാളത്തിൽ പ്രത്യേകമായി ‘തന്നെ’ ചേർക്കുന്നത് അനാവശ്യമായോ വ്യത്യസ്തമായ ഊന്നലായോ തോന്നാം; സ്വാഭാവിക വാക്യഘടനയിൽ ആശയം നിലനിർത്തുന്നു.
- source_word: יְכֻפַּר
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ കഴിയുക
  rationale: ദേശത്തിന്മേലുള്ള രക്തപാതകക്കുറ്റം നീക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന כפר എന്ന പദത്തിന്റെ ആരാധനാപരവും ധാർമികവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന, വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: ചൊരിയപ്പെട്ട രക്തംനിമിത്തം ദേശത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ കഴിയുകയില്ല
  rationale: പ്രായശ്ചിത്തം ആവശ്യമായ ബാധിത ഘടകമായി ദേശത്തെയും അതിന്റെ കാരണമായി ചൊരിയപ്പെട്ട രക്തത്തെയും വ്യാകരണപരമായി വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: שֻׁפַּךְ
  choice: ചൊരിയപ്പെട്ട
  rationale: നിയമപരമായ രക്തപാതകസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാള പ്രയോഗം.
- source_word: כִּי אִם
  choice: മാത്രമേ
  rationale: അനുവദിക്കപ്പെട്ട ഏക മാർഗം എന്ന നിയന്ത്രണം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: അത് ചൊരിഞ്ഞവന്റെ രക്തത്താൽ
  rationale: കൊല്ലപ്പെട്ടവന്റെ രക്തം ചൊരിഞ്ഞ കൊലയാളിയുടെ സ്വന്തം രക്തമാണ് ഉദ്ദേശിക്കുന്നത് എന്ന് മൂലപാഠത്തിന്റെ പ്രത്യയബന്ധം നിലനിർത്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: രക്തച്ചൊരിച്ചിലാൽ ദേശം അശുദ്ധമാകുന്നതിന്റെ സ്വഭാവം
  choice: അന്യായമായ രക്തച്ചൊരിച്ചിൽ ദേശത്തെ യഥാർഥമായ ധാർമിക-വിശുദ്ധിപരമായ അശുദ്ധിയിലാക്കുന്നു; അത് ചൊരിഞ്ഞവന്റെ രക്തത്താൽ മാത്രമേ ആ രക്തപാതകക്കുറ്റത്തിന് പ്രായശ്ചിത്തം ഉണ്ടാകൂ.
  alternative: ഇത് സാമൂഹിക അസ്വസ്ഥതയുടെ രൂപകം മാത്രമാണ്, അല്ലെങ്കിൽ ആരാധനാപരമായ അർഥമില്ലാത്ത പൗരനീതിയുടെ പ്രസ്താവന മാത്രമാണ്.
  rationale: חנף എന്നതിന്റെ ആവർത്തനവും כפר എന്ന പദവും ദേശം, രക്തം, പ്രായശ്ചിത്തം എന്നിവയെ നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. വിവർത്തനം ഇതിനെ വെറും സാമൂഹിക ക്രമക്കേടായി ചുരുക്കാതെയും പിൽക്കാല സിദ്ധാന്തങ്ങൾ ഇറക്കുമതി ചെയ്യാതെയും നിലനിർത്തുന്നു.
- issue: പ്രായശ്ചിത്തത്തിന്റെ ഏക മാർഗം
  choice: ‘അത് ചൊരിഞ്ഞവന്റെ രക്തത്താൽ മാത്രമേ’ എന്ന നിയന്ത്രിത പ്രസ്താവന നിലനിർത്തുന്നു.
  alternative: പൊതുവായ നഷ്ടപരിഹാരമോ മറ്റേതെങ്കിലും ആരാധനാക്രമമോ മതിയാകാമെന്ന വായന.
  rationale: כִּי אִם ഏക അപവാദമോ മാർഗമോ വ്യക്തമാക്കുന്നു; സമീപ നിയമസന്ദർഭത്തോടൊത്ത് കൊലയാളിയുടെ രക്തത്തെയാണ് വാക്യം സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദേശം’, ‘അശുദ്ധമാക്കുക’, ‘പ്രായശ്ചിത്തം’ എന്നിവ മൂലപാഠത്തിലെ ഭൗമികവും ധാർമിക-ആരാധനാപരവുമായ ഭാവങ്ങൾ സംരക്ഷിക്കുന്നു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് വ്യാകരണബന്ധത്തിന്റെ മറ്റൊരു സ്വാഭാവിക അവതരണം നൽകുന്നു.
