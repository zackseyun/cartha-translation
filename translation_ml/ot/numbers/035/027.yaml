id: NUM.35.27
reference: Numbers 35:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: ml
  text: രക്തപ്രതികാരകൻ[a] അവനെ അവന്റെ അഭയനഗരത്തിന്റെ അതിർത്തിക്കു പുറത്തുവെച്ചു കണ്ടെത്തുകയും രക്തപ്രതികാരകൻ ആ മനുഷ്യനെ കൊന്നവനെ കൊല്ലുകയും ചെയ്താൽ, രക്തപ്രതികാരകനു രക്തപാതകക്കുറ്റമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘രക്തത്തിന് പ്രതികാരം ചെയ്യുന്നവൻ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന് രക്തമില്ല’; അതായത്, ഈ വധം നിമിത്തം രക്തപ്രതികാരകനു രക്തപാതകക്കുറ്റം വരില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: രക്തച്ചൊരിച്ചിലിന് പ്രതികാരം ചെയ്യാൻ നിയമപരമായി അധികാരപ്പെട്ട വ്യക്തിയെയാണ് ഈ നിയമസന്ദർഭത്തിൽ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ബന്ധുത്വം ഈ വാക്യത്തിൽ നേരിട്ട് പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘ബന്ധു-പ്രതികാരകൻ’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: מִחוּץ לִגְבוּל
  choice: അതിർത്തിക്കു പുറത്തുവെച്ചു
  rationale: അഭയനഗരം നൽകുന്ന സംരക്ഷണത്തിന്റെ സ്ഥലപരവും നിയമപരവുമായ പരിധിക്കു പുറത്താണ് ആ വ്യക്തിയെ കണ്ടെത്തുന്നതെന്ന് ഇത് വ്യക്തമാക്കുന്നു.
- source_word: עִיר מִקְלָטוֹ
  choice: അവന്റെ അഭയനഗരം
  rationale: സംഖ്യയിലെ നിയമവ്യവസ്ഥയിൽ מקלט സൂചിപ്പിക്കുന്ന ഔദ്യോഗിക അഭയസ്ഥാപനത്തെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: וְרָצַח
  choice: കൊല്ലുകയും
  rationale: തുടർന്നുള്ള വാക്യഭാഗം ഈ പ്രവൃത്തിക്ക് രക്തപാതകക്കുറ്റമില്ലെന്ന് വ്യക്തമാക്കുന്നതിനാൽ, നിയമവിരുദ്ധ കൊലപാതകം എന്ന് മുൻകൂട്ടി വിധിക്കുന്ന പദത്തിനു പകരം നിഷ്പക്ഷമായ ‘കൊല്ലുക’ ഉപയോഗിച്ചു.
- source_word: הָרֹצֵחַ
  choice: ആ മനുഷ്യനെ കൊന്നവൻ
  rationale: അഭയനഗരനിയമത്തിന്റെ പശ്ചാത്തലത്തിൽ മനഃപൂർവമല്ലാതെ ഒരാളെ കൊന്നവനെയും ഈ പദം ഉൾക്കൊള്ളാം. ‘കൊലപാതകി’ കുറ്റകരമായ ഉദ്ദേശ്യം അനാവശ്യമായി സൂചിപ്പിക്കുമെന്നതിനാൽ വിവരണാത്മകവും നിഷ്പക്ഷവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: אֵין לוֹ דָּם
  choice: രക്തപ്രതികാരകനു രക്തപാതകക്കുറ്റമില്ല
  rationale: ഹീബ്രായ നിയമപ്രയോഗത്തിന്റെ അർത്ഥം വ്യക്തമായി നൽകുകയും അവസാന സർവനാമം രക്തപ്രതികാരകനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അനുവദിക്കപ്പെട്ട വധത്തിന്റെ സന്ദർഭത്തിൽ רצח എന്ന ക്രിയയുടെ ധാർമിക-നിയമപരമായ ശക്തി
  choice: ‘കൊലപാതകം ചെയ്യുക’ എന്നതിനു പകരം നിഷ്പക്ഷമായി ‘കൊല്ലുക’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: മറ്റിടങ്ങളിലെ പദസ്ഥിരത നിലനിർത്താൻ ‘കൊലപാതകം ചെയ്യുക’ എന്ന് നൽകുക.
  rationale: രക്തപ്രതികാരകനു രക്തപാതകക്കുറ്റമില്ലെന്ന് വാക്യം തന്നെ പറയുന്നതിനാൽ, കുറ്റകരമായ നരഹത്യയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്ന പദം ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വൈരുധ്യം സൃഷ്ടിക്കും.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമപരമായ ഗൗരവം നിലനിർത്തി; ‘കൊലപാതകി’ പോലുള്ള ഉദ്ദേശ്യകുറ്റം മുൻകൂട്ടി ചുമത്തുന്ന പദങ്ങൾ ഒഴിവാക്കി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവൈകല്യം തിരുത്തി: [a] രക്തപ്രതികാരകനോടും [b] രക്തപാതകക്കുറ്റമില്ല എന്ന ഹീബ്രായ പ്രയോഗത്തോടും ചേർത്തു.'
