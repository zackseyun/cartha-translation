  to: അപ്പോൾ നിങ്ങൾക്കായി പട്ടണങ്ങൾ നിശ്ചയിക്കണം[a]; അവ നിങ്ങൾക്കുള്ള അഭയനഗരങ്ങളായിരിക്കണം. അബദ്ധത്തിൽ ഒരാളെ കൊന്നവൻ അവിടേക്ക് ഓടിപ്പോകണം[b].
