id: NUM.35.11
reference: Numbers 35:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: ml
  text: അപ്പോൾ നിങ്ങൾക്കായി പട്ടണങ്ങൾ നിശ്ചയിക്കണം[a]; അവ നിങ്ങൾക്കുള്ള അഭയനഗരങ്ങളായിരിക്കണം. അബദ്ധത്തിൽ ഒരാളെ കൊന്നവൻ അവിടേക്ക് ഓടിപ്പോകണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിശ്ചയിക്കുക’ എന്നതിന് ‘നിയോഗിക്കുക’ അല്ലെങ്കിൽ ‘വേർതിരിച്ചുവെക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘ഒരു വ്യക്തിയെ അടിക്കുന്നവൻ’ എന്ന പ്രയോഗം ഉപയോഗിക്കുന്നു; ഈ നിയമസന്ദർഭത്തിൽ അത് അബദ്ധത്തിൽ ഒരാളുടെ മരണത്തിന് കാരണമായവനെ സൂചിപ്പിക്കുന്നു, മനഃപൂർവമായ കൊലപാതകിയെ അല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: നിശ്ചയിക്കണം
  rationale: ഹിഫീൽ രൂപം ഇവിടെ ചില പട്ടണങ്ങളെ പ്രത്യേക ദൗത്യത്തിനായി തിരഞ്ഞെടുത്ത് നിയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ സന്ദർഭത്തിൽ ‘നിശ്ചയിക്കണം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: പട്ടണങ്ങൾ ... അഭയനഗരങ്ങൾ
  rationale: എബ്രായത്തിലെ ആവർത്തനം നിയമപരമായ വ്യക്തതയ്ക്കായി നിലനിർത്തുന്നു. ‘അഭയനഗരങ്ങൾ’ സംരക്ഷണം ലഭിക്കുന്ന നിശ്ചിത പട്ടണങ്ങൾ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: מִקְלָט
  choice: അഭയം
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പ്രതികാരത്തിൽനിന്ന് രക്ഷനേടാവുന്ന സംരക്ഷിതസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; ‘അഭയം’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְנָס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകണം
  rationale: നിയമനിർദേശത്തിന്റെ തുടർച്ചയായുള്ള ഭാവി/നിർദേശാത്മക ബലം മലയാളത്തിൽ ‘ഓടിപ്പോകണം’ വ്യക്തമാക്കുന്നു.
- source_word: רֹצֵחַ
  choice: അടിച്ചുകൊന്നവൻ
  rationale: רֹצֵחַ എന്ന പദത്തെ בִּשְׁגָגָה വിശേഷിപ്പിക്കുന്നതിനാൽ മനഃപൂർവമായ കൊലപാതകം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കി. തുടർന്നുള്ള מַכֵּה נֶפֶשׁ എന്ന പ്രയോഗവുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: מַכֵּה נֶפֶשׁ
  choice: ഒരാളെ അടിച്ചുകൊന്നവൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരു വ്യക്തിയെ/ജീവനെ അടിക്കുന്നവൻ’; ഈ സന്ദർഭത്തിൽ മാരകഫലമാണ് ഉദ്ദേശിക്കുന്നത്. ‘അടിച്ചുകൊന്നവൻ’ ക്രിയാചിത്രവും ഫലവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: נֶפֶשׁ
  choice: ഒരാളെ
  rationale: ഇവിടെ נֶפֶשׁ അമൂർത്തമായ ‘ആത്മാവ്’ എന്നല്ല, കൊല്ലപ്പെട്ട മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בִּשְׁגָגָה
  choice: അബദ്ധത്തിൽ
  rationale: ഉദ്ദേശപൂർവമല്ലാത്ത പ്രവൃത്തി എന്ന നിയമപരമായ വ്യത്യാസം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: കൊന്നവന്റെ നിയമപരമായ വർഗീകരണം
  choice: ‘അബദ്ധത്തിൽ ഒരാളെ അടിച്ചുകൊന്നവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊലയാളി’ അല്ലെങ്കിൽ ‘കൊലപാതകി’
  rationale: בִּשְׁגָגָה എന്ന വിശേഷണം ഉദ്ദേശമില്ലായ്മ വ്യക്തമാക്കുന്നു. അതിനാൽ മനഃപൂർവമായ കൊലപാതകത്തിന്റെ കുറ്റം മുൻകൂട്ടി ചുമത്താതെ, മനഃപൂർവ കൊലയും അബദ്ധമരണവും തമ്മിലുള്ള തോറായിലെ വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. നിയമപരമായ ആവർത്തനവും മനഃപൂർവതയെക്കുറിച്ചുള്ള നിർണായക വിശേഷണവും നിലനിർത്തി; ‘നിങ്ങൾ നിങ്ങൾക്കായി’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വ്യക്തമായ അഭിസംബോധനയും לָכֶם എന്ന ഊന്നലും പ്രതിഫലിപ്പിക്കുന്നു.
