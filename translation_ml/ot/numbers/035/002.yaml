  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോട്[a] ഇങ്ങനെ കല്പിക്കുക: അവർ തങ്ങളുടെ അവകാശസ്വത്തിൽനിന്ന് ലേവ്യർക്കു താമസിക്കാനുള്ള പട്ടണങ്ങൾ കൊടുക്കണം; ആ പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള തുറസ്സുനിലവും[b] നിങ്ങൾ ലേവ്യർക്കു കൊടുക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ.’ എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പട്ടണത്തെ ചുറ്റിയിരുന്ന ഈ തുറന്ന ഭൂമി പ്രത്യേകിച്ച് കന്നുകാലികളെ മേയിക്കാനും മറ്റു പൊതുവായ ആവശ്യങ്ങൾക്കും ഉപയോഗിച്ചിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: കല്പിക്കുക
  rationale: മോശെയോടുള്ള ശക്തമായ ആജ്ഞാരൂപത്തിന്റെ ബലം നിലനിർത്തുകയും ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം നൽകുകയും ചെയ്യുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ രൂപത്തോട് സുതാര്യമായ ബന്ധം നിലനിർത്തുന്ന പരമ്പരാഗതവും ഇന്നും മനസ്സിലാകുന്നതുമായ മലയാളപ്രയോഗം; ഇവിടെ മുഴുവൻ ഇസ്രായേൽജനത്തെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְנָתְנוּ
  choice: അവർ … കൊടുക്കണം
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള വാവ് + പൂർണ്ണക്രിയയുടെ നിർദേശാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയുടെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: തങ്ങളുടെ അവകാശസ്വത്തിൽനിന്ന്
  rationale: נַחֲלָה എന്ന ‘അവകാശം/അവകാശഭൂമി’ എന്ന ആശയവും אֲחֻזָּה എന്ന ‘കൈവശസ്വത്ത്’ എന്ന നിയമപരമായ ആശയവും സംക്ഷിപ്തമായി ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: עָרִים לָשָׁבֶת
  choice: താമസിക്കാനുള്ള പട്ടണങ്ങൾ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന എബ്രായ അനന്തക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: מִגְרָשׁ
  choice: തുറസ്സുനിലം
  rationale: പട്ടണത്തെ ചുറ്റിയിരുന്ന, മേച്ചിലിനും മറ്റു പൊതുപയോഗങ്ങൾക്കും ഉപയോഗിച്ചിരുന്ന തുറന്ന ഭൂമിയെ സൂചിപ്പിക്കുന്ന പദം; ‘മേച്ചിൽപ്പുറം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: ആ പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള
  rationale: ചുറ്റുമുള്ള ഭൂമി മുമ്പു പറഞ്ഞ പട്ടണങ്ങളോടു ബന്ധപ്പെട്ടതാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תִּתְּנוּ
  choice: നിങ്ങൾ … കൊടുക്കണം
  rationale: മുമ്പത്തെ മൂന്നാംപുരുഷ ബഹുവചനത്തിൽനിന്ന് രണ്ടാംപുരുഷ ബഹുവചനത്തിലേക്കുള്ള എബ്രായ ക്രിയാമാറ്റം വ്യക്തമായി നിലനിർത്തുന്നു.
