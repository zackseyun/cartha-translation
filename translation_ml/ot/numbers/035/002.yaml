translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവർ’ എന്നതിൽനിന്ന് ‘നിങ്ങൾ’ എന്നതിലേക്കുള്ള മൂലപാഠത്തിലെ പുരുഷമാറ്റം സംരക്ഷിച്ചിട്ടുണ്ട്. നിയമപരമായ ഭൂവകാശസന്ദർഭം ‘അവകാശസ്വത്ത്’ എന്ന പ്രയോഗത്തിലൂടെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
