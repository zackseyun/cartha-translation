reference: Numbers 35:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: ml
  text: ലേവ്യർക്കു നിങ്ങൾ കൊടുക്കുന്ന പട്ടണങ്ങളിൽ, ഒരാളെ കൊന്നവൻ അവിടേക്കു ഓടിപ്പോകേണ്ടതിനായി നിങ്ങൾ കൊടുക്കേണ്ട ആറു അഭയനഗരങ്ങൾ ഉണ്ടായിരിക്കണം; അവയ്ക്കു പുറമേ നാല്പത്തിരണ്ടു പട്ടണങ്ങളും കൊടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് നഗരത്തെയോ പട്ടണത്തെയോ സൂചിപ്പിക്കാം. ലേവ്യർക്കായി ദേശമൊട്ടാകെ നൽകുന്ന വാസസ്ഥലങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ ‘പട്ടണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: പട്ടണങ്ങൾ ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ദാതൃകാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: ആറു സങ്കേതനഗരങ്ങൾ
  rationale: מִקְלָט അഭയമോ സുരക്ഷിത സങ്കേതമോ സൂചിപ്പിക്കുന്നു. നിയമപരമായ പ്രത്യേക സ്ഥാപനത്തെ സംക്ഷിപ്തമായും മാന്യമായും സൂചിപ്പിക്കാൻ ‘സങ്കേതനഗരങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: לָנוּס שָׁמָּה
  choice: അവിടേക്ക് ഓടിപ്പോകേണ്ടതിന്
  rationale: נוּס എന്ന ക്രിയയുടെ ‘അപകടത്തിൽനിന്ന് ഓടിപ്പോകുക/പലായനം ചെയ്യുക’ എന്ന ബലവും שָׁמָּהയുടെ ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: הָרֹצֵחַ
  choice: കൊലചെയ്തവൻ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം ഒരാളെ കൊന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; കൊല മനഃപൂർവമാണോ അബദ്ധവശാലാണോ എന്ന് പദം തനിയെ നിർണ്ണയിക്കുന്നില്ല. ‘കൊലപാതകി’ എന്നത് മനഃപൂർവത അനാവശ്യമായി സൂചിപ്പിക്കാവുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: וַעֲלֵיהֶם
  choice: അവയ്ക്കു പുറമേ
  rationale: ഇവിടെ על കൂട്ടിച്ചേർക്കലിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ആറു പട്ടണങ്ങൾക്കു പുറമേ വേറെ നാല്പത്തിരണ്ടെണ്ണം നൽകണമെന്ന ഗണിതബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: നാല്പത്തിരണ്ടു പട്ടണങ്ങൾ
  rationale: സംഖ്യയ്ക്കു ശേഷം എബ്രായത്തിൽ ഏകവചനരൂപം വന്നിട്ടുണ്ടെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക എണ്ണൽപ്രയോഗത്തിന് ബഹുവചനമായ ‘പട്ടണങ്ങൾ’ ആവശ്യമാണ്.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദത്തിൽ ഉദ്ദേശപൂർവമായ കൊലപാതകം സൂചിപ്പിക്കണമോ
  choice: കൊലചെയ്തവൻ
  alternative: കൊലപാതകി
  rationale: മൂലപദം ഈ വാക്യത്തിൽ കൊലയുടെ ഉദ്ദേശം തനിയെ വ്യക്തമാക്കുന്നില്ല; സങ്കേതനഗരങ്ങളുടെ തുടർന്നുള്ള നിയമങ്ങൾ വ്യത്യസ്ത സാഹചര്യങ്ങൾ വേർതിരിക്കുന്നു. അതിനാൽ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. നീണ്ട എബ്രായവാക്യം വ്യക്തതയ്ക്കായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി; ആവർത്തനവും നിർദേശത്തിന്റെ ബലവും നിലനിർത്തി.
