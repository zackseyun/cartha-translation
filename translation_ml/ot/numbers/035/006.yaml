revisions:
- from: നിങ്ങൾ ലേവ്യർക്കു കൊടുക്കേണ്ട പട്ടണങ്ങളിൽ ആറു സങ്കേതനഗരങ്ങൾ ഉണ്ടായിരിക്കണം; കൊലചെയ്തവന്[a] അവിടേക്ക് ഓടിപ്പോകേണ്ടതിന് നിങ്ങൾ അവ കൊടുക്കണം. അവയ്ക്കു പുറമേ നാല്പത്തിരണ്ടു പട്ടണങ്ങളും കൊടുക്കണം.
