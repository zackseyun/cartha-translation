source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ ഇരുമ്പുകൊണ്ടുള്ള ഒരു ഉപകരണം കൊണ്ട് മറ്റൊരാളെ അടിക്കുകയും അയാൾ മരിക്കുകയും ചെയ്താൽ[a], അടിച്ചയാൾ കൊലയാളിയാണ്; ആ കൊലയാളിയെ നിശ്ചയമായും വധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇരുമ്പുകൊണ്ടുള്ള ഒരു ആയുധം കൊണ്ട്’ അല്ലെങ്കിൽ ‘ഇരുമ്പുകൊണ്ടുള്ള ഒരു വസ്തു കൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദത്തിന് വിശാലമായ അർഥമുണ്ട്; അത് ഏതെങ്കിലും പ്രത്യേക ആയുധത്തെ പേരെടുത്തു പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്താൽ
  rationale: തുടർന്നുവരുന്ന നിയമപരമായ വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്ന നിബന്ധനാരൂപം; മുൻസന്ദർഭത്തോടുള്ള വ്യത്യാസവും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: בִּכְלִי בַרְזֶל
  choice: ഇരുമ്പുകൊണ്ടുള്ള ഒരു ഉപകരണംകൊണ്ട്
  rationale: כְּלִי എന്നത് പാത്രം, വസ്തു, ഉപകരണം, ആയുധം എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലപദമാണ്. മൂലപാഠം പ്രത്യേക ആയുധം പറയാത്തതിനാൽ ‘ഉപകരണം’ എന്നത് അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: הִכָּהוּ
  choice: മറ്റൊരാളെ അടിക്കുകയും
  rationale: נכה എന്ന ക്രിയയുടെ ഹിഫിൽ രൂപം ഇവിടെ ശാരീരികമായി പ്രഹരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അടിക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിക്കുകയും ചെയ്താൽ
  rationale: മൂലത്തിലെ സംഭവക്രമം നിലനിർത്തി മരണം പ്രഹരത്തിനു പിന്നാലെ സംഭവിച്ചതായി പറയുന്നു; ‘മരിക്കത്തക്കവിധം’ എന്ന കാരണവ്യാഖ്യാനം അധികമായി ചേർക്കുന്നില്ല.
- source_word: רֹצֵחַ הוּא
  choice: അടിച്ചവൻ കൊലപാതകിയാണ്
  rationale: നിയമപരമായി കുറ്റക്കാരനായ കൊലയാളിയെന്ന നിർണയം വ്യക്തമായി നൽകുന്നു. മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അടിച്ചവൻ’ എന്നു വ്യക്തമാക്കി.
- source_word: מוֹת יוּמַת
  choice: നിശ്ചയമായും വധിക്കണം
  rationale: ക്രിയാനാമവും ക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ നിയമപരമായ നിർബന്ധത്തോടുകൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הָרֹצֵחַ
  choice: ആ കൊലപാതകിയെ
  rationale: നിശ്ചിതരൂപം മുമ്പ് നിയമപരമായി തിരിച്ചറിഞ്ഞ അതേ കുറ്റവാളിയെ വീണ്ടും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: רצח എന്ന പദത്തിന്റെ നിയമപരമായ വർഗീകരണം
  choice: കൊലപാതകി
  alternative: കൊലയാളി / നരഹന്താവ്
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം കുറ്റകരമായ മനുഷ്യവധത്തെ സൂചിപ്പിക്കുകയും മരണശിക്ഷ വിധിക്കുകയും ചെയ്യുന്നു. ‘കൊലപാതകി’ ഉദ്ദേശപൂർവമോ കുറ്റകരമോ ആയ വധവും അബദ്ധവധവും തമ്മിലുള്ള അധ്യായത്തിലെ വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘അയാൾ’ മരിച്ച വ്യക്തിയെയും ‘അടിച്ചവൻ’ കുറ്റക്കാരനെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
