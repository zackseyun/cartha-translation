translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ നിയമഭാഷ ഉപയോഗിച്ചു. രണ്ടു പുരുഷന്മാരെ വേർതിരിച്ചറിയാൻ കർത്താവിന് ‘അവൻ’ എന്നും ബാധിതന് ‘അയാൾ’ എന്നും ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
