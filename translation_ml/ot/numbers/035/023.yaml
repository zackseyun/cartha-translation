  text: א֣וֹ בְ/כָל אֶ֜בֶן אֲשֶׁר יָמ֥וּת בָּ/הּ֙ בְּ/לֹ֣א רְא֔וֹת וַ/יַּפֵּ֥ל עָלָ֖י/ו וַ/יָּמֹ֑ת וְ/הוּא֙ לֹא אוֹיֵ֣ב ל֔/וֹ וְ/לֹ֥א מְבַקֵּ֖שׁ רָעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാൾ മരിക്കാവുന്ന ഏതെങ്കിലും കല്ല്, കാണാതെ[a], അവൻ അയാളുടെമേൽ ഇട്ടുവീഴ്ത്തി അയാൾ മരിച്ചാൽ—അവൻ അയാളുടെ ശത്രുവായിരുന്നില്ല, അയാൾക്ക് ദോഷം വരുത്താൻ ശ്രമിച്ചിരുന്നതുമില്ല—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കാണാതെ.” ഈ പ്രയോഗം എല്ലാ ശാരീരിക കാഴ്ചയും ഇല്ലായിരുന്നുവെന്ന് നിർബന്ധമായി പറയുന്നതല്ല; സംഭവത്തെക്കുറിച്ചുള്ള അവബോധമില്ലായ്മയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യങ്ങളിലെ നിയമപരമായ വ്യത്യസ്ത സാഹചര്യങ്ങളുടെ നിര തുടർക്കുന്നു.
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: ഒരാളെ കൊല്ലാൻ പോന്ന ഏതെങ്കിലും കല്ല്
  rationale: കല്ല് മരണകാരണമാകാൻ ശേഷിയുള്ളതാണെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; כָל എന്നതിന്റെ വ്യാപ്തി ‘ഏതെങ്കിലും’ നിലനിർത്തുന്നു.
- source_word: בְּלֹא רְאוֹת
  choice: കാണാതെ
  rationale: എബ്രായത്തിലെ മൂർത്തമായ ‘കാണാതെ’ എന്ന പ്രയോഗം നിലനിർത്തി, അബദ്ധവശാൽ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: וַיִּפֵּל עָלָיו
  choice: അയാളുടെമേൽ ഇട്ടുവീഴ്ത്തുകയും
  rationale: נפל എന്ന ക്രിയയുടെ ഹിഫീൽ കാരണരൂപം, കല്ല് വീഴാൻ കർത്താവ് കാരണമായെന്ന് പ്രകടമാക്കുന്നു.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിക്കുകയും ചെയ്താൽ
  rationale: നിയമവാക്യത്തിന്റെ ഉപാധിപരമായ ഘടനയിൽ മരണഫലം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וְהוּא לֹא אוֹיֵב לוֹ
  choice: അവൻ അയാളുടെ ശത്രുവായിരുന്നില്ല
  rationale: മുൻവൈരം ഇല്ലായിരുന്നുവെന്ന വിശദീകരണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: അയാൾക്ക് ദോഷം വരുത്താൻ ശ്രമിച്ചിരുന്നതുമില്ല
  rationale: רָעָה ഇവിടെ വ്യക്തിക്കു വരുത്തുന്ന ദോഷത്തെയും מְבַקֵּשׁ ഉദ്ദേശ്യപൂർവമായ ശ്രമത്തെയും സൂചിപ്പിക്കുന്നു.
