source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: ml
  text: ഒരാളെ കൊന്നവന്റെ കാര്യത്തിൽ, സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിൽ[a] ആ കൊലപാതകിയെ വധിക്കണം[b]. എന്നാൽ ഒരു വ്യക്തിക്കെതിരെ മരണശിക്ഷയ്ക്കായി ഒരൊറ്റ സാക്ഷി മൊഴി നൽകരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സാക്ഷികളുടെ വായ്‌പ്രകാരം.’
    reason: lexical_alternative
  - marker: b
    text: ‘കൊലപാതകി’ എന്നതിനും അയാളെ വധിക്കുന്ന പ്രവൃത്തിക്കും ഹീബ്രു ഒരേ പദമൂലമാണ് ഉപയോഗിക്കുന്നത്. നിയമപ്രകാരമുള്ള വധത്തെ നിയമവിരുദ്ധമായ കൊലയായി തെറ്റിദ്ധരിക്കാതിരിക്കാനാണ് ഇവിടെ വ്യത്യസ്ത മലയാളപദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: ഒരാളെ അടിച്ചുകൊല്ലുന്ന ഏവൻ
  rationale: മַכֵּה എന്നതിലെ ‘അടിക്കുക’ എന്ന ഭാവവും നിയമസന്ദർഭത്തിലെ മരണഫലവും ഒരുമിച്ച് നിലനിർത്തുന്നു; נֶפֶשׁ ഇവിടെ വേർപെട്ട ‘ആത്മാവ്’ എന്നല്ല, മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: נֶפֶשׁ
  choice: ഒരാൾ / വ്യക്തി
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം മനുഷ്യജീവനെയോ വ്യക്തിയെയോ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ഉദ്ദേശിക്കാത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് വായനയിൽ കൊണ്ടുവരാം.
- source_word: לְפִי עֵדִים
  choice: സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിൽ
  rationale: അക്ഷരാർഥമായ ‘സാക്ഷികളുടെ വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ നിയമപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: കൊലപാതകിയെ വധിക്കണം
  rationale: ഹീബ്രുവിൽ ക്രിയയും ‘കൊലപാതകി’ എന്ന നാമവും רצח എന്ന ഒരേ മൂലത്തിൽനിന്നാണ്. കോടതിവിധിപ്രകാരമുള്ള മരണശിക്ഷയെ നിയമവിരുദ്ധമായ കൊലയായി തെറ്റിദ്ധരിപ്പിക്കാതിരിക്കാൻ ക്രിയയ്ക്ക് ‘വധിക്കണം’ ഉപയോഗിച്ചു.
- source_word: הָרֹצֵחַ
  choice: കൊലപാതകി
  rationale: ഈ സന്ദർഭം മരണശിക്ഷയ്ക്ക് ഉത്തരവാദിയായ കുറ്റവാളിയെക്കുറിച്ചാകയാൽ വിശാലമായ ‘കൊന്നവൻ’ എന്നതിനെക്കാൾ ‘കൊലപാതകി’ കൃത്യമാണ്.
- source_word: וְעֵד אֶחָד
  choice: എന്നാൽ … ഒരൊറ്റ സാക്ഷി
  rationale: മതിയായ സാക്ഷ്യവും മതിയാകാത്ത ഏകസാക്ഷ്യവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ וְ എന്ന ബന്ധകത്തെ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: לֹא יַעֲנֶה
  choice: മൊഴി നൽകരുത്
  rationale: ענה എന്ന പദത്തിന് നിയമസന്ദർഭത്തിൽ സാക്ഷിമൊഴി നൽകുക എന്ന അർഥമുണ്ട്. നിരോധനാത്മകമായ ഹീബ്രു രൂപം വ്യാഖ്യാനിച്ച് ‘മതിയാകില്ല’ എന്നു മാറ്റാതെ നിലനിർത്തി.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: ഒരാളെ മരണശിക്ഷയ്ക്കു വിധിക്കാൻ അയാൾക്കെതിരെ
  rationale: ചുരുക്കിയ ഹീബ്രു നിയമപ്രയോഗം ഒരാൾക്കെതിരായ സാക്ഷ്യം മരണവിധിയിലേക്കു നയിക്കുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘മരണത്തിനായി’ എന്ന അസ്വാഭാവിക അക്ഷരവിവർത്തനം ഒഴിവാക്കിയെങ്കിലും മരണശിക്ഷയുമായുള്ള നേരിട്ടുള്ള ബന്ധം നിലനിർത്തി.
