translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മൊഴിയുടെ അടിസ്ഥാനത്തിൽ,’ ‘മരണശിക്ഷയ്ക്കു വിധിക്കാൻ’ എന്നീ പ്രയോഗങ്ങൾ തെളിവിന്റെയും ശിക്ഷാവിധിയുടെയും സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഏകസാക്ഷിയെക്കുറിച്ചുള്ള ഹീബ്രുവിന്റെ നിരോധനരൂപം നിലനിർത്തിയിട്ടുണ്ട്.
