source:
  edition: WLC
  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: ml
  text: നിങ്ങൾ ലേവ്യർക്കു കൊടുക്കുന്ന പട്ടണങ്ങളുടെ മേച്ചിൽപ്പുറങ്ങൾ[a], പട്ടണത്തിന്റെ മതിൽ മുതൽ പുറത്തേക്ക് എല്ലാ വശങ്ങളിലും ആയിരം മുഴം ആയിരിക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പൊതുഭൂമി’ അല്ലെങ്കിൽ ‘തുറസ്സായ ഭൂമി’; പട്ടണങ്ങൾക്കു ചുറ്റുമുള്ള ഭൂമിയെക്കുറിച്ചാണ്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ ‘പട്ടണത്തിന്റെ മതിൽ മുതൽ’; ചിലർ ഇത് കൂടുതൽ പൊതുവായി ‘പട്ടണത്തിന്റെ അതിർത്തി മുതൽ’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: മേച്ചിൽപ്പുറങ്ങൾ
  rationale: ലേവ്യപട്ടണങ്ങൾക്കു ചുറ്റുമായി ഉപയോഗത്തിനായി വേർതിരിച്ച തുറസ്സായ ഭൂമിയെയാണ് ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. അതിന്റെ പ്രായോഗിക ഉപയോഗം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളപദമാണ് ‘മേച്ചിൽപ്പുറങ്ങൾ’; എന്നാൽ ‘പൊതുഭൂമി’, ‘തുറസ്സായ ഭൂമി’ എന്നീ അർഥസാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് പട്ടണമെന്നോ നഗരമെന്നോ അർഥമാക്കാം. ലേവ്യർക്കു നൽകുന്ന വാസകേന്ദ്രങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: നിങ്ങൾ ... കൊടുക്കുന്ന
  rationale: ബന്ധവാക്യവും സന്ദർഭത്തിലെ ഭാവികാല നിർദേശസ്വഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לַלְוִיִּם
  choice: ലേവ്യർക്കു
  rationale: പട്ടണങ്ങളും അവയോടു ചേർന്ന ഭൂമിയും ലഭിക്കുന്നവരെ നേരിട്ട് തിരിച്ചറിയിക്കുന്നു.
- source_word: מִקִּיר הָעִיר
  choice: പട്ടണത്തിന്റെ മതിൽമുതൽ
  rationale: קִיר എന്നതിന്റെ പ്രാഥമിക അർഥമായ ‘മതിൽ’ നേരിട്ട് നിലനിർത്തുന്നു. ഇത് പൊതുവായി പട്ടണത്തിന്റെ അതിർത്തിയെയും സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וָחוּצָה
  choice: പുറത്തേക്ക്
  rationale: പട്ടണത്തിൽനിന്നു പുറത്തേക്കുള്ള ദിശ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: אֶלֶף אַמָּה
  choice: ആയിരം മുഴം
  rationale: പുരാതന അളവായ אַמָּהയെ പരിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പതിവായ ‘മുഴം’ എന്നു നിലനിർത്തുന്നു.
- source_word: סָבִיב
  choice: ചുറ്റും
  rationale: ഈ അളവ് പട്ടണത്തിന്റെ എല്ലാ വശങ്ങളിലും ബാധകമാണെന്ന ചുറ്റളവുസ്വഭാവം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
