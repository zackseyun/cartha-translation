translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ അളവും ‘മതിൽ’ എന്ന വ്യക്തമായ പദവും നിലനിർത്തി; യഥാർഥ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
