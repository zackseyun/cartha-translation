id: NUM.35.20
reference: Numbers 35:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ പകയോടെ മറ്റൊരാളെ തള്ളുകയോ, അല്ലെങ്കിൽ മനഃപൂർവം[a] അയാളുടെമേൽ എന്തെങ്കിലും എറിയുകയോ ചെയ്ത് ആ വ്യക്തി മരിക്കുകയോ ചെയ്താൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദുരുദ്ദേശ്യത്തോടെ” അല്ലെങ്കിൽ “പതിയിരുന്ന്.” എബ്രായപദം ആസൂത്രിതമായ ശത്രുതാപരമായ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; പതിയിരിപ്പും അതിൽ ഉൾപ്പെട്ടേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... ചെയ്തിട്ട്
  rationale: മുൻസാഹചര്യത്തോടു വ്യത്യസ്തമായ ഒരു നിബന്ധനാപരമായ നിയമസാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: בְּשִׂנְאָה
  choice: പകയോടെ
  rationale: പ്രവൃത്തിയുടെ ശത്രുതാപരമായ പ്രേരണയെ ആധുനിക മലയാളത്തിൽ ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: יֶהְדָּפֶנּוּ
  choice: മറ്റൊരാളെ തള്ളുകയോ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ തള്ളൽ നിലനിർത്തുന്നു; അടിക്കുകയോ കൊലപ്പെടുത്തുകയോ എന്ന അതിശക്തമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: അയാളുടെമേൽ എന്തെങ്കിലും എറിയുകയോ
  rationale: എബ്രായത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘എന്തെങ്കിലും’ ചേർത്തു; עָלָיו-യുടെ ദിശാസൂചന ‘അയാളുടെമേൽ’ എന്നു നിലനിർത്തി.
- source_word: בִּצְדִיָּה
  choice: പതിയിരുന്ന്
  rationale: ഈ അപൂർവ നാമത്തിന്റെ ആസൂത്രിതവും ശത്രുതാപരവുമായ പ്രവൃത്തിയുടെയും പതിയിരിപ്പിന്റെയും സാധ്യതയുള്ള സൂക്ഷ്മാർഥം നേരിട്ട് നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിച്ചാൽ
  rationale: നിയമവാക്യത്തിലെ നിബന്ധനാപരമായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുകയും മരണഫലം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
