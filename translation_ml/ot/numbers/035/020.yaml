- from: എന്നാൽ ഒരാൾ പകയോടെ മറ്റൊരാളെ തള്ളുകയോ, പതിയിരുന്ന്[a] അയാളുടെമേൽ എന്തെങ്കിലും എറിയുകയോ ചെയ്തിട്ട് അയാൾ മരിച്ചാൽ,
  to: എന്നാൽ ഒരാൾ പകയോടെ മറ്റൊരാളെ തള്ളുകയോ, അല്ലെങ്കിൽ മനഃപൂർവം[a] അയാളുടെമേൽ എന്തെങ്കിലും എറിയുകയോ ചെയ്ത് ആ വ്യക്തി മരിക്കുകയോ ചെയ്താൽ,
