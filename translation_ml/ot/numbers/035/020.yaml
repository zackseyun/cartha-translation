translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ നിയമവിവരണ ശൈലി. ആവർത്തിച്ചുള്ള സർവനാമങ്ങൾ മൂലമുണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ഒരാൾ/മറ്റൊരാൾ/അയാൾ’ ഉപയോഗിച്ചു.
