id: NUM.35.18
reference: Numbers 35:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, മരണത്തിന് ഇടയാക്കാവുന്ന കൈയിൽ പിടിക്കാവുന്ന ഒരു മരവസ്തു[a] കൊണ്ട് അവൻ അയാളെ അടിച്ച് അയാൾ മരിച്ചാൽ, അടിച്ചവൻ കൊലപാതകിയാണ്; കൊലപാതകിയെ തീർച്ചയായും വധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കൈയിലെ മരവസ്തു” അല്ലെങ്കിൽ “കൈയിൽ പിടിച്ചിരിക്കുന്ന മരവസ്തു.”
    reason: യָד (“കൈ”) ഉൾക്കൊള്ളുന്ന ഹീബ്രു പ്രയോഗം കൈയിൽ പിടിച്ചു ഉപയോഗിക്കുന്ന വസ്തുവിനെ സൂചിപ്പിക്കാം; കൂടുതൽ അക്ഷരാർഥപരമായ വായനയും സാധ്യമാണ്.
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: കൈയിൽ പിടിച്ച മരവസ്തുകൊണ്ട്
  rationale: כְּלִי എന്നത് വസ്തു, ഉപകരണം, ആയുധം എന്നിവയെ സൂചിപ്പിക്കാവുന്ന വിശാലപദമാണ്. യָד ചേർന്ന പ്രയോഗം കൈയിൽ പിടിച്ച് ഉപയോഗിക്കാവുന്ന വസ്തുവെന്ന ആശയം നൽകുന്നു; ചുറ്റുമുള്ള ഇരുമ്പ്-കല്ല് വസ്തുക്കളുടെ സമാന്തര നിയമസന്ദർഭവും ഈ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: ഒരാൾക്ക് മരണം സംഭവിക്കാവുന്ന
  rationale: ഈ ഉപവാക്യം പ്രസ്തുത വസ്തുവിന്റെ മാരകശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; ഈ ഒറ്റ സംഭവത്തിന്റെ ഫലം മാത്രമല്ല. മലയാളത്തിൽ സ്വാഭാവികമായി ആ സാധ്യത നിലനിർത്തുന്നു.
- source_word: הִכָּהוּ
  choice: അവൻ അയാളെ അടിക്കുകയും
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അടിക്കുക/പ്രഹരിക്കുക’ എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള മരണഫലം മുൻകൂട്ടി അതിശയിപ്പിക്കുന്നില്ല.
- source_word: וַיָּמֹת
  choice: അയാൾ മരിക്കുകയും ചെയ്താൽ
  rationale: ഹീബ്രു വാക്യത്തിലെ തുടർച്ചയായ ഫലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ കാരണവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: רֹצֵחַ
  choice: കൊലപാതകി
  rationale: അബദ്ധവധത്തിൽനിന്ന് കുറ്റകരമായ കൊല വേർതിരിക്കുന്ന ഈ നിയമസന്ദർഭത്തിൽ ‘കൊലപാതകി’ എന്നത് നിയമപരവും ധാർമികവുമായ വിധി വ്യക്തമായി നൽകുന്നു.
- source_word: מוֹת יוּמַת
  choice: തീർച്ചയായും വധിക്കണം
  rationale: infinitive absolute സഹിതമുള്ള രൂപത്തിന്റെ ഊന്നലും നിർബന്ധസ്വഭാവമുള്ള നിയമശിക്ഷയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കൊലപാതകനിയമത്തിലെ רֹצֵחַ എന്ന പദത്തിന്റെ നിയമപരമായ വർഗീകരണം
  choice: കൊലപാതകി
  alternative: കൊന്നവൻ / ഘാതകൻ
  rationale: ഉടൻ വരുന്ന സന്ദർഭം കുറ്റകരമായ കൊലയെ അബദ്ധവധത്തിൽനിന്ന് വേർതിരിക്കുകയും മരണശിക്ഷ വിധിക്കുകയും ചെയ്യുന്നു. അതിനാൽ വിശാലമായ ‘കൊന്നവൻ’ എന്നതിനെക്കാൾ ‘കൊലപാതകി’ മൂലപാഠത്തിലെ നിയമ-ധാർമിക വിധി കൃത്യമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. വാക്യത്തിലെ രണ്ടു പുരുഷന്മാരെ വേർതിരിക്കാൻ ‘അവൻ/അയാൾ’ പ്രയോഗിച്ചു. പ്രത്യേക സമുദായപരമായ പദാവലി ഒഴിവാക്കി; മൂലപാഠത്തിലെ മാരകശേഷിയും ശിക്ഷയുടെ ഊന്നലും നിലനിർത്തി.
