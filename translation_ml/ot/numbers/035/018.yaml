- from: അല്ലെങ്കിൽ, ഒരാൾക്ക് മരണം സംഭവിക്കാവുന്ന കൈയിൽ പിടിച്ച മരവസ്തുകൊണ്ട് അവൻ അയാളെ അടിക്കുകയും അയാൾ മരിക്കുകയും ചെയ്താൽ, അവൻ കൊലപാതകിയാണ്; ആ കൊലപാതകിയെ തീർച്ചയായും വധിക്കണം.
