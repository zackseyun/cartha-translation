  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: ml
  text: തന്റെ അഭയനഗരത്തിലേക്ക് ഓടിപ്പോയവൻ പുരോഹിതൻ മരിക്കുന്നതിനുമുമ്പ് ദേശത്തേക്കു മടങ്ങിവന്ന് താമസിക്കാൻ നിങ്ങൾ അവനുവേണ്ടി മോചനവില[a] വാങ്ങരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഷ്ടപരിഹാരം’ അല്ലെങ്കിൽ ‘പണം’ എന്നും പരിഭാഷപ്പെടുത്താം. മോചനത്തിനോ നിയമപരമായ ബാധ്യതയ്ക്കു പകരമായോ നൽകുന്ന വിലയെയാണ് כֹּפֶר സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രു വാക്യഘടന വളരെ സങ്കുചിതമാണ്. പുരോഹിതൻ മരിക്കുന്നതിനുമുമ്പ് ആ വ്യക്തി അഭയനഗരത്തിൽ തുടരുന്നതുമായോ അവിടെനിന്നു മടങ്ങുന്നതുമായോ ബന്ധപ്പെട്ട പണം സ്വീകരിക്കരുത് എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: മോചനവില
  rationale: നിയമപരമായി നിർബന്ധമായിരിക്കുന്ന ഫലത്തിനു പകരം സ്വീകരിക്കുന്ന വീണ്ടെടുപ്പുവിലയെയോ നഷ്ടപരിഹാരത്തുകയെയോ സൂചിപ്പിക്കുന്നു. ‘കൈക്കൂലി’ എന്നത് മൂലപദത്തേക്കാൾ അധികം നിന്ദാർഥവും വ്യാഖ്യാനപരവുമാണ്.
- source_word: לָנוּס אֶל עִיר מִקְלָטוֹ
  choice: തന്റെ അഭയനഗരത്തിലേക്ക് ഓടിപ്പോയവൻ
  rationale: נוּס എന്ന ധാതുവിന്റെ ‘ഓടിപ്പോകുക’ എന്ന അർഥവും അഭയനഗരത്തിന്റെ നിയമപരമായ പശ്ചാത്തലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഹീബ്രു അനന്തക്രിയാരൂപത്തെ സന്ദർഭാനുസൃതമായി വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു; അതിന്റെ സങ്കുചിതമായ ഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: עִיר מִקְלָטוֹ
  choice: തന്റെ അഭയനഗരം
  rationale: നിയുക്തമായ അഭയസ്ഥലനഗരത്തെ സൂചിപ്പിക്കുന്ന നിയമപ്രയോഗവും ഏകവചന ഉടമസ്ഥപ്രത്യയവും സംരക്ഷിക്കുന്നു.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: നാട്ടിലേക്കു മടങ്ങിവന്ന് താമസിക്കുക
  rationale: മടങ്ങിവരിക, വീണ്ടും താമസിക്കുക എന്നീ രണ്ടു ആശയങ്ങളും ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ഇവിടെ ‘ദേശം’ എന്നതിനെക്കാൾ വ്യക്തിയുടെ സാധാരണ വാസപ്രദേശത്തെ സൂചിപ്പിക്കാൻ ‘നാട്’ സ്വാഭാവികമാണ്.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: പുരോഹിതൻ മരിക്കുന്നതിനുമുമ്പ്
  rationale: പുരോഹിതന്റെ മരണം സംഭവിക്കുന്നതുവരെ മടങ്ങിവരാൻ പാടില്ലെന്ന നിരോധനത്തിന്റെ സമയപരിധി മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; ‘മരണംവരെ’ എന്ന രൂപത്തിൽ ഉണ്ടാകാവുന്ന തെറ്റായ കാലാർഥം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അഭയനഗരത്തിലേക്കു പോയ കൊലപാതകിയുടെ മടങ്ങിവരവുമായി ബന്ധപ്പെട്ട നിരോധനത്തിന്റെ നിയമവ്യാപ്തി
  choice: പുരോഹിതന്റെ മരണത്തിനു മുമ്പ് നാട്ടിലേക്കു മടങ്ങി താമസിക്കാൻ ഇടയാക്കുന്ന മോചനവില സ്വീകരിക്കരുതെന്ന നിരോധനമായി പ്രധാനവാചകം അവതരിപ്പിക്കുന്നു.
  alternative: അഭയനഗരത്തിലേക്കുള്ള ഓട്ടവുമായി ബന്ധപ്പെട്ട പണം തന്നെയാണ് പ്രത്യേകമായി നിരോധിക്കുന്നത് എന്നും, അല്ലെങ്കിൽ അവൻ അവിടെ തുടരുന്നതോ അവിടെനിന്നു മടങ്ങുന്നതോ സംബന്ധിച്ച പണമാണെന്നും സങ്കുചിതമായ ഹീബ്രു വാക്യഘടന മനസ്സിലാക്കാം.
  rationale: സന്ദർഭം നേരത്തെയുള്ള മടങ്ങിവരവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഹീബ്രു വ്യാകരണം അതിനെ പൂർണമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ വായനാസൗകര്യമുള്ള അർഥം പ്രധാനവാചകത്തിൽ നൽകി മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘മോചനവില’, ‘അഭയനഗരം’, ‘പുരോഹിതൻ’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചവയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയുമാണ്. ഹീബ്രുവിലെ സങ്കുചിതത്വം പ്രധാനവാചകത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
