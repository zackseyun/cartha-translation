  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ മോശെയോടു പറഞ്ഞു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: דבר എന്ന ക്രിയയുടെ ഈ ദൈവിക വചനസൂത്രത്തിന് മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; തുടർന്ന് വരുന്ന לֵאמֹר സൂചിപ്പിക്കുന്ന ഉദ്ധരണിയിലേക്കും ഇത് നയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമമായ יהוה-യെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ പദവിയാൽ പകരംവയ്ക്കാതെ സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തോട് ചേർന്ന മലയാളരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. വാക്യത്തിന്റെ ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ സ്വഭാവം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനു പിന്നാലെ സ്ഥാപിച്ചിരിക്കുന്നു.
