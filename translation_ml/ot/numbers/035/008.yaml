source:
  edition: WLC
  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമിയിൽനിന്ന് ലേവ്യർക്കു നിങ്ങൾ നൽകുന്ന പട്ടണങ്ങളിൽ, വലിയ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് കൂടുതൽ പട്ടണങ്ങളും ചെറിയ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് കുറച്ച് പട്ടണങ്ങളും നൽകണം.[a] ഓരോരുത്തനും തങ്ങൾ അവകാശമായി പ്രാപിക്കുന്ന അവകാശവിഹിതത്തിന്റെ അളവനുസരിച്ച് തന്റെ പട്ടണങ്ങളിൽനിന്ന് ലേവ്യർക്കു കൊടുക്കണം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രായിയിൽ അക്ഷരാർഥത്തിൽ: “വലുതിൽനിന്ന് നിങ്ങൾ വർധിപ്പിക്കണം; ചെറുതിൽനിന്ന് നിങ്ങൾ കുറയ്ക്കണം.” സന്ദർഭത്തിൽ വലിയതും ചെറിയതുമായ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് അനുപാതികമായി കൂടുതൽ അല്ലെങ്കിൽ കുറച്ച് പട്ടണങ്ങൾ നൽകണമെന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായിയിൽ “ഓരോരുത്തൻ, അവർ അവകാശമായി പ്രാപിക്കുന്ന തന്റെ അവകാശവിഹിതത്തിന്റെ അളവനുസരിച്ച്” എന്നിങ്ങനെ വിതരണാത്മക ഏകവചനവും ബഹുവചനവും ചേർന്ന ഘടനയുണ്ട്. സന്ദർഭം ഇസ്രായേലിന്റെ ഗോത്രവിഹിതങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: grammar_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: പട്ടണങ്ങൾ
  rationale: עִיר എന്നത് പട്ടണമോ നഗരമോ സൂചിപ്പിക്കാം; ലേവ്യപട്ടണങ്ങളുടെ ഈ നിയമസന്ദർഭത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികവും സ്ഥിരതയുള്ളതുമാണ്.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമി
  rationale: אֲחֻזָּה ഭൂസ്വത്തായ കൈവശത്തെയോ അവകാശവിഹിതത്തെയോ സൂചിപ്പിക്കുന്നു; ‘അവകാശഭൂമി’ ഇവിടെ ഉടമ്പടിപരമായ ഭൂവിഹിതത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: കൂടുതലുള്ളവരിൽനിന്ന് കൂടുതൽ എടുക്കണം; കുറവുള്ളവരിൽനിന്ന് കുറച്ച് എടുക്കണം
  rationale: ഹീബ്രായിയിലെ ‘കൂടുതൽ/കുറവ്’ എന്ന താരതമ്യം നിലനിർത്തിക്കൊണ്ട്, പട്ടണങ്ങൾ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് അനുപാതികമായി മാറ്റിവെക്കണമെന്ന നിയമത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: ഓരോ ഗോത്രവും തങ്ങൾക്ക് ലഭിക്കുന്ന അവകാശത്തിന്റെ അളവനുസരിച്ച്
  rationale: אִישׁ വിതരണാത്മക ഏകവചനമാണെങ്കിലും തുടർന്നുള്ള יִנְחָלוּ ബഹുവചനമാണ്; സന്ദർഭത്തിലെ ഗോത്രവിഹിതങ്ങളെ മുൻനിർത്തി ‘ഓരോ ഗോത്രവും ... തങ്ങൾക്ക്’ എന്ന് നൽകുന്നത് സംഖ്യാത്മകമായ സംഘർഷം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ വ്യക്തത നൽകുന്നു.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: തങ്ങളുടെ പട്ടണങ്ങളിൽ ചിലത് ലേവ്യർക്കു കൊടുക്കണം
  rationale: מִן എന്ന ഭാഗികത ‘ചിലത്’ എന്നു വ്യക്തമാക്കുന്നു; לַלְוִיִּם എന്നത് പതിവുപോലെ ‘ലേവ്യർക്കു’ എന്നാണ്.
theological_decisions:
- issue: പട്ടണങ്ങളുടെ അനുപാതികമായ വകയിരുത്തൽ
  choice: വലിയ അവകാശവിഹിതത്തിൽനിന്ന് കൂടുതൽ പട്ടണങ്ങളും ചെറിയ വിഹിതത്തിൽനിന്ന് കുറച്ചും നൽകണമെന്ന അർഥം
  alternative: ‘കൂടുതലിൽനിന്ന് വർധിപ്പിക്കുക; കുറവിൽനിന്ന് കുറയ്ക്കുക’ എന്ന അത്യന്തം പദാനുപദ രൂപം
  rationale: ഇത് വ്യാഖ്യാനപരമായ മതസിദ്ധാന്തം ചേർക്കാതെ നിയമവാക്യത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമനിർദേശ ശൈലി. ‘നഗരങ്ങൾ’ എന്നതിനു പകരം ഈ പുരാതന കുടിയേറ്റസന്ദർഭത്തിന് യോജിച്ച ‘പട്ടണങ്ങൾ’; ‘യിസ്രായേൽ’ എന്ന പഴയ രൂപത്തിനു പകരം ആധുനിക ‘ഇസ്രായേൽ’. ഹീബ്രായിയിലെ വിതരണാത്മക ഏകവചനവും വ്യാകരണബഹുവചനവും തമ്മിലുള്ള യഥാർഥ സംഘർഷം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
