- from: ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമിയിൽനിന്ന് നിങ്ങൾ കൊടുക്കേണ്ട പട്ടണങ്ങളുടെ കാര്യത്തിൽ, കൂടുതലുള്ളവരിൽനിന്ന് കൂടുതൽ എടുക്കണം; കുറവുള്ളവരിൽനിന്ന് കുറച്ച് എടുക്കണം.[a] ഓരോ ഗോത്രവും തങ്ങൾക്ക് ലഭിക്കുന്ന അവകാശത്തിന്റെ അളവനുസരിച്ച് തങ്ങളുടെ പട്ടണങ്ങളിൽ ചിലത് ലേവ്യർക്കു കൊടുക്കണം.[b]
  to: ഇസ്രായേൽമക്കളുടെ അവകാശഭൂമിയിൽനിന്ന് ലേവ്യർക്കു നിങ്ങൾ നൽകുന്ന പട്ടണങ്ങളിൽ, വലിയ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് കൂടുതൽ പട്ടണങ്ങളും ചെറിയ ഗോത്രവിഹിതങ്ങളിൽനിന്ന് കുറച്ച് പട്ടണങ്ങളും നൽകണം.[a] ഓരോരുത്തനും തങ്ങൾ അവകാശമായി പ്രാപിക്കുന്ന അവകാശവിഹിതത്തിന്റെ അളവനുസരിച്ച് തന്റെ പട്ടണങ്ങളിൽനിന്ന് ലേവ്യർക്കു കൊടുക്കണം.[b]
  rationale: The revision changes the erroneous 'take' language to 'give,' making the required action agree with the Hebrew and the surrounding context. It retains the contextual clarification that larger and smaller refer to tribal allotments, while the second sentence more closely reflects the Hebrew's distributive singular plus plural verb and records that feature in a footnote.
