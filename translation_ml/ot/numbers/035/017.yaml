source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരാൾ മരിക്കാവുന്ന തരത്തിലുള്ള ഒരു കല്ല് കൈയിൽ പിടിച്ച്[a] അവനെ അടിക്കുകയും അവൻ മരിക്കുകയും ചെയ്താൽ, അവൻ കൊലപാതകിയാണ്; കൊലപാതകിയെ തീർച്ചയായും വധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘കൈയുടെ കല്ല്’ എന്നാണ്; കൈയിൽ പിടിച്ചതോ കൈകൊണ്ട് ആയുധമായി ഉപയോഗിക്കാൻ യോജിച്ചതോ ആയ കല്ല് എന്നർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: അല്ലെങ്കിൽ ... ചെയ്താൽ
  rationale: നിയമപരമായ കേസുകളുടെ പരമ്പരയിൽ മറ്റൊരു സാഹചര്യം അവതരിപ്പിക്കുന്നതിനാൽ, വെറും ‘എന്നാൽ’ എന്നതിനെക്കാൾ ‘അല്ലെങ്കിൽ’ സ്വാഭാവികമാണ്.
- source_word: בְּאֶבֶן יָד
  choice: ഒരു കല്ല് കൈയിൽ പിടിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘കൈയുടെ കല്ല്’ എന്ന അപൂർവ പ്രയോഗം; കൈയിൽ പിടിച്ച് ആയുധമായി ഉപയോഗിക്കാവുന്ന കല്ലാണ് ഉദ്ദേശ്യമെന്നത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: ഒരാൾക്ക് മരണം സംഭവിക്കാവുന്ന
  rationale: കല്ലിന്റെ മാരകശേഷിയെയാണ് ഉപവാക്യം സൂചിപ്പിക്കുന്നത്; പ്രത്യേക ഇരയെ മാത്രം ഉദ്ദേശിക്കുന്നതായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הִכָּהוּ
  choice: അവനെ അടിക്കുകയും
  rationale: נכה എന്നതിന്റെ പൊതുവായ അർഥമായ ‘അടിക്കുക’ നിലനിർത്തുന്നു; മരണഫലം അടുത്ത ഉപവാക്യത്തിൽ പ്രത്യേകം പറയുന്നതിനാൽ ‘അടിച്ചുകൊല്ലുക’ എന്ന് മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: וַיָּמֹת
  choice: അവൻ മരിക്കുകയും ചെയ്താൽ
  rationale: ഹീബ്രു വാക്യക്രമത്തിലെ ഫലം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: רֹצֵחַ הוּא
  choice: അടിച്ചവൻ കൊലപാതകിയാണ്
  rationale: നിയമപരമായി കുറ്റകരമായ നരഹത്യയെയാണ് רצח ഇവിടെ വർഗീകരിക്കുന്നത്; മലയാളത്തിൽ സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അടിച്ചവൻ’ ഉപയോഗിക്കുന്നു.
- source_word: מוֹת יוּמַת
  choice: നിർബന്ധമായും മരണശിക്ഷയ്ക്കു വിധിക്കണം
  rationale: ക്രിയാനാമവും ക്രിയയും ചേർന്ന ഹീബ്രു ഊന്നൽ നിയമപരമായ ബാധ്യതയായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: הָרֹצֵחַ
  choice: ആ കൊലപാതകിയെ
  rationale: മൂലപാഠത്തിലെ നിയമവിഷയത്തിന്റെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഭയനഗരങ്ങളെക്കുറിച്ചുള്ള നിയമത്തിൽ കൊന്നയാളുടെ നിയമപരമായ വർഗീകരണം
  choice: רצח എന്നത് ‘കൊലപാതകി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൊന്നവൻ’ അല്ലെങ്കിൽ ‘നരഹത്യ ചെയ്തവൻ’
  rationale: ചുറ്റുപാടിലെ ഭാഗം മനഃപൂർവവും കുറ്റകരവുമായ കൊലപാതകത്തെ അബദ്ധത്തിൽ സംഭവിച്ച മരണത്തിൽനിന്ന് വേർതിരിക്കുന്നു. ‘കൊലപാതകി’ ആ നിയമപരവും ധാർമികവുമായ വിധി വ്യക്തമാക്കുന്നു; പിൽക്കാല ഉപദേശപരമായ ആശയങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ നിയമഭാഷ. ഹീബ്രുവിലെ ആവർത്തനവും ശിക്ഷാവിധിയിലെ ഊന്നലും നിലനിർത്തിയിട്ടുണ്ട്; സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ ‘അടിച്ചവൻ’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
