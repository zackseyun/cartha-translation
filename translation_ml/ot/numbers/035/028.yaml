  terminology: “മഹാപുരോഹിതൻ” accurately renders the official title. “വധം ചെയ്തവൻ” preserves the broad legal designation without asserting murder; the footnote identifies “കൊന്നവൻ” as an alternative and warns against reading it automatically as “കൊലയാളി.” “ഭൂസ്വത്ത്” is clearer and more idiomatic than the compressed “കൈവശഭൂമി” for אֲחֻזָּה.
