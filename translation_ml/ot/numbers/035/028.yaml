  - severity: low
    issue: ‘കൈവശഭൂമി’ is an awkward compound for the landed possession.
    rationale: ‘ഭൂസ്വത്ത്’ more naturally expresses a landholding/property while retaining the legal sense of אֲחֻזָּה.
