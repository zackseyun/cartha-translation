  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: ml
  text: കാരണം, അവൻ മഹാപുരോഹിതന്റെ മരണവരെ തന്റെ അഭയനഗരത്തിൽ താമസിക്കണം; മഹാപുരോഹിതന്റെ മരണശേഷം വധം ചെയ്തവൻ[a] തന്റെ ഭൂസ്വത്തിലേക്ക്[b] മടങ്ങാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൊന്നവൻ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രു പദം അഭയനഗരനിയമങ്ങളിലെ ഒരു നിയമപരമായ വിഭാഗമാണ്; അതിനെ സ്വയമേവ ‘കൊലയാളി’ എന്നു മനസ്സിലാക്കരുത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ സ്വന്തമായ ഭൂസ്വത്തിലേക്ക്’ അല്ലെങ്കിൽ ‘തന്റെ കൈവശമുള്ള ദേശത്തേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻപുള്ള നിയമനിർദേശത്തിന്റെ കാരണം വിശദീകരിക്കുന്ന ബന്ധകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: בְעִיר מִקְלָטוֹ
  choice: തന്റെ സങ്കേതനഗരത്തിൽത്തന്നെ
  rationale: מִקְלָט എന്ന നിയമപരമായ ആശയത്തിന് സ്വാഭാവികമായ മലയാളരൂപം നൽകുന്നു; ‘-ത്തന്നെ’ അവിടെ തുടരേണ്ട നിയന്ത്രണം വ്യക്തമാക്കുന്നു.
- source_word: יֵשֵׁב
  choice: കഴിയണം
  rationale: വെറും താമസത്തെക്കാൾ നിയമപരമായ നിർബന്ധം ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നതിനാൽ ബാധ്യതാഭാവം നിലനിർത്തുന്നു.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: മഹാപുരോഹിതൻ മരിക്കുന്നതുവരെ
  rationale: ഹീബ്രു നാമപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: הָרֹצֵחַ
  choice: കൊന്നവൻ
  rationale: ഇത് സങ്കേതനഗരനിയമത്തിലെ നിയമപരമായ വിഭാഗമാണ്; ‘കൊലയാളി’ എന്നു പറഞ്ഞാൽ മനഃപൂർവമായ കൊലപാതകം എന്ന വിധി അനാവശ്യമായി ചുമത്തപ്പെടാം.
- source_word: יָשׁוּב
  choice: മടങ്ങാം
  rationale: മുമ്പുണ്ടായിരുന്ന വിലക്ക് നീങ്ങിയശേഷമുള്ള നിയമപരമായ അനുമതി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: തന്റെ കൈവശഭൂമിയിലേക്ക്
  rationale: אֲחֻזָּהയുടെ ഭൂസ്വത്ത്/കൈവശാവകാശ അർഥം നിലനിർത്തുകയും ‘അവകാശദേശം’ എന്ന കൂടുതൽ ദൈവശാസ്ത്രഭാരമുള്ള പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: הָרֹצֵחַ എന്ന പദം മനഃപൂർവ കൊലപാതകിയെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യണമോ
  choice: കൊന്നവൻ
  alternative: കൊലയാളി
  rationale: സങ്കേതനഗരങ്ങളെക്കുറിച്ചുള്ള ഈ നിയമഭാഗം മനഃപൂർവമായ കൊലയും മറ്റു സാഹചര്യങ്ങളിലെ മനുഷ്യവധവും തമ്മിൽ വേർതിരിക്കുന്നു. അതിനാൽ ഈ വാക്യം നൽകാത്ത കുറ്റവിധി വിവർത്തനത്തിൽ ചേർക്കാതെ നിയമപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. മഹാപുരോഹിതന്റെ മരണത്തെക്കുറിച്ചുള്ള ആവർത്തനം മൂലപാഠത്തിലെ നിയമസൂത്രണത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ സംരക്ഷിച്ചു.
