source:
  edition: WLC
  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: ml
  text: രക്തപ്രതികാരകൻ തന്നേ കൊലപാതകിയെ വധിക്കണം; അവനെ കണ്ടുമുട്ടുമ്പോൾ[a] അവൻ തന്നെ അവനെ വധിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ അടുത്തെത്തുമ്പോൾ.’ എബ്രായപ്രയോഗം ഒരാളെ നേരിൽ കണ്ടുമുട്ടുന്നതിനെയോ അയാളുടെ അടുത്തെത്തുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: രക്തപ്രതികാരകൻ
  rationale: ഇത് അന്യായമായി ചൊരിയപ്പെട്ട രക്തത്തിന് പ്രതികാരം ചെയ്യാനുള്ള കുടുംബചുമതലയുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ നിയമപദമാണ്. വീണ്ടെടുപ്പുകാരൻ എന്ന വിശാല അർഥം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: הוּא
  choice: തന്നെയാണ് / അയാൾതന്നെ
  rationale: സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തി, ഈ നിയമനടപടി ആ വ്യക്തി നേരിട്ട് നിർവഹിക്കണമെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: יָמִית
  choice: മരണശിക്ഷയ്ക്ക് വിധേയനാക്കേണ്ടത് / വിധേയനാക്കണം
  rationale: מות എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥവും നിയമസന്ദർഭവും പ്രതിഫലിപ്പിക്കുന്നു; വെറും ‘കൊല്ലുക’ എന്നതിനെക്കാൾ ഔപചാരികമാണ്.
- source_word: הָרֹצֵחַ
  choice: കൊലപാതകി
  rationale: മുൻവാക്യങ്ങളിലെ നിയമപരമായ വേർതിരിവുകളുടെ അടിസ്ഥാനത്തിൽ മരണത്തിന് അർഹനായ കുറ്റക്കാരനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: בְּפִגְעוֹ בוֹ
  choice: അവനെ കണ്ടുമുട്ടുമ്പോൾ
  rationale: ഒരാളെ നേരിൽ കാണുകയോ അയാളുടെ അടുത്തെത്തുകയോ ചെയ്യുന്ന സമയാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הוּא יְמִיתֶנּוּ
  choice: അയാൾതന്നെ അവനെ മരണശിക്ഷയ്ക്ക് വിധേയനാക്കണം
  rationale: കർത്താവിനും പ്രവൃത്തിക്കും എബ്രായപാഠം നൽകുന്ന ആവർത്തിച്ച ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: גֹּאֵל הַדָּם എന്ന വ്യക്തിയുടെ നിയമപരമായ പങ്ക്
  choice: ഇസ്രായേലിന്റെ നരഹത്യാനിയമക്രമത്തിനുള്ളിൽ കുടുംബബന്ധത്തെ അടിസ്ഥാനമാക്കി രക്തത്തിന് പ്രതികാരം നിർവഹിക്കുന്ന മനുഷ്യപ്രതിനിധിയായി വിവർത്തനം ചെയ്തു.
  alternative: രക്തത്തിന്റെ വീണ്ടെടുപ്പുകാരൻ / രക്തവീണ്ടെടുപ്പുകാരൻ
  rationale: ഈ വാക്യത്തിന്റെ വിഷയം വീണ്ടെടുപ്പുസിദ്ധാന്തമല്ല, നരഹത്യയുമായി ബന്ധപ്പെട്ട നിയമക്രമമാണ്. അതിനാൽ പിൽക്കാല ദൈവശാസ്ത്രപരമായ അർഥങ്ങൾ പദത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമഭാഷ ഉപയോഗിച്ചു. ‘രക്തപ്രതികാരകൻ’ എന്ന സാങ്കേതികപദം മൂലപാഠത്തിലെ കുടുംബാധിഷ്ഠിത നിയമപങ്ക് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ആവർത്തിച്ച הוּא എന്നതിന്റെ ഊന്നൽ ‘തന്നെയാണ്’, ‘അയാൾതന്നെ’ എന്നിവകൊണ്ട് സൂക്ഷിച്ചു.
