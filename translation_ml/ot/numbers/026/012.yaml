id: NUM.26.12
reference: Numbers 26:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: ml
  text: 'ശിമെയോന്റെ പുത്രന്മാർ അവരുടെ വംശങ്ങൾക്കനുസരിച്ച്: നെമൂവേലിൽനിന്നുള്ളവർ—നെമൂവേല്യരുടെ വംശം; യാമീനിൽനിന്നുള്ളവർ—യാമീന്യരുടെ വംശം; യാഖീനിൽനിന്നുള്ളവർ—യാഖീന്യരുടെ വംശം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപരവും പിതൃവംശീയവുമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘വംശങ്ങൾ’ ഈ സന്ദർഭത്തിൽ കൃത്യമാണ്.
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: നെമൂവേലിൽനിന്ന് / യാമീനിൽനിന്ന് / യാഖീനിൽനിന്ന്
  rationale: לְ ഇവിടെ പട്ടികയിലെ വംശപൂർവികനെ അവതരിപ്പിക്കുന്നു; ‘-ൽനിന്ന്’ ആ വ്യക്തിയിൽനിന്നുള്ള വംശോത്ഭവം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  choice: നെമൂവേല്യരുടെ / യാമീന്യരുടെ / യാഖീന്യരുടെ വംശം
  rationale: എബ്രായത്തിലെ വംശനാമവിശേഷണം സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-യർ’ രൂപം ആ കൂട്ടായ വംശനാമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ജനസംഖ്യാകണക്കെടുപ്പിന്റെ ആവർത്തനാത്മക പട്ടികാശൈലി നിലനിർത്തി. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി നെമൂവേൽ, യാമീൻ, യാഖീൻ എന്നു ലിപ്യന്തരിച്ചു.
