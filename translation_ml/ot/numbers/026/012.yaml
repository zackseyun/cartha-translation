- from: 'ശിമെയോന്റെ പുത്രന്മാർ, അവരുടെ വംശങ്ങൾപ്രകാരം: നെമൂവേലിൽനിന്ന് നെമൂവേല്യരുടെ വംശം; യാമീനിൽനിന്ന് യാമീന്യരുടെ വംശം; യാഖീനിൽനിന്ന് യാഖീന്യരുടെ വംശം.'
  to: 'ശിമെയോന്റെ പുത്രന്മാർ അവരുടെ വംശങ്ങൾക്കനുസരിച്ച്: നെമൂവേലിൽനിന്നുള്ളവർ—നെമൂവേല്യരുടെ വംശം; യാമീനിൽനിന്നുള്ളവർ—യാമീന്യരുടെ വംശം; യാഖീനിൽനിന്നുള്ളവർ—യാഖീന്യരുടെ വംശം.'
