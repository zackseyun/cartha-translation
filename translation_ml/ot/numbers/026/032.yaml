revisions:
- from: ശെമീദായിൽനിന്ന് ശെമീദായ്യരുടെ കുലം; ഹേഫെരിൽനിന്ന് ഹേഫെര്യരുടെ കുലം.
  to: ശെമീദായിൽനിന്ന് ശെമീദാവംശക്കാരുടെ കുലം; ഹേഫെരിൽനിന്ന് ഹേഫെർവംശക്കാരുടെ കുലം.
  rationale: The revision preserves the Hebrew census formula, its two parallel clauses, and ‘clan’ for מִשְׁפָּחָה. It replaces only the unnatural Malayalam gentilicial coinages with transparent and standard expressions for the corresponding descent groups.
