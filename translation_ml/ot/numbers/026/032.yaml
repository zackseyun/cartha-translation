id: NUM.26.32
reference: Numbers 26:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: ml
  text: ശെമീദായിൽനിന്ന് ശെമീദാവംശക്കാരുടെ കുലം; ഹേഫെരിൽനിന്ന് ഹേഫെർവംശക്കാരുടെ കുലം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: ശെമീദായിൽനിന്ന്
  rationale: ഗോത്രക്കണക്കിലെ ആവർത്തിത സൂത്രവാക്യത്തിൽ വാവിനെ വെറും ‘ഉം’ എന്നു മാറ്റുന്നതിനെക്കാൾ, സൂചിതമായ വംശോത്ഭവബന്ധം വ്യക്തമാക്കുന്ന ‘യിൽനിന്ന്’ സ്വാഭാവികമാണ്. שְׁמִידָע എന്ന വ്യക്തിനാമം ശെമീദാ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഇവിടെ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനുള്ളിലെ വംശബന്ധിത ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥത്തിന് ആധുനിക മലയാളത്തിൽ ‘കുലം’ സംക്ഷിപ്തവും യോജിച്ചതുമാണ്.
- source_word: הַ/שְּׁמִידָעִי
  choice: ശെമീദായ്യർ
  rationale: ഈ നിസ്ബരൂപം ശെമീദായോടു ബന്ധപ്പെട്ട വംശജസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സമൂഹനാമരീതിക്കനുസരിച്ച് ‘ശെമീദായ്യർ’ എന്നു നൽകി.
- source_word: וְ/חֵפֶר
  choice: ഹേഫെരിൽനിന്ന്
  rationale: മുൻപത്തെ ഇനത്തിന്റെ അതേ വംശാവലി സൂത്രം ഇവിടെ ആവർത്തിക്കുന്നു. ഹീബ്രു חֵפֶר എന്ന പേര് ഹേഫെർ എന്നു ലിപ്യന്തരിച്ചു; വിഭക്തി ചേരുമ്പോൾ ‘ഹേഫെരിൽനിന്ന്’ ആയി.
- source_word: הַֽ/חֶפְרִי
  choice: ഹേഫെര്യർ
  rationale: ഈ നിസ്ബരൂപം ഹേഫെരിൽനിന്നുള്ള വംശജസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമമായി ‘ഹേഫെര്യർ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ലളിതവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം. ഹീബ്രുവിലെ സംക്ഷിപ്ത ജനഗണനാശൈലി നിലനിർത്തിക്കൊണ്ട്, സൂചിതമായ ‘യിൽനിന്ന്’ എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കി. വ്യക്തിനാമങ്ങളും അവയിൽനിന്നുള്ള വംശനാമങ്ങളും തമ്മിലുള്ള രൂപബന്ധം കാത്തുസൂക്ഷിച്ചു.
