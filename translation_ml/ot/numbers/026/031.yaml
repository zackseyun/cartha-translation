translation_notes:
  register: ആവർത്തനഘടന നിലനിർത്തിയ, ആധുനികവും ഗൗരവമുള്ളതുമായ പട്ടികശൈലി. പേരുകളുടെ ലിപ്യന്തരണം എബ്രായരൂപത്തെ മുൻനിർത്തുന്നു; വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
