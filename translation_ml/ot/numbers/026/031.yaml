source:
  edition: WLC
  text: וְ/אַ֨שְׂרִיאֵ֔ל מִשְׁפַּ֖חַת הָֽ/אַשְׂרִֽאֵלִ֑י וְ/שֶׁ֕כֶם מִשְׁפַּ֖חַת הַ/שִּׁכְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: ml
  text: അശ്രിയേലിൽനിന്ന് അശ്രിയേല്യരുടെ കുലം; ശെഖേമിൽനിന്ന് ശെഖേമ്യരുടെ കുലം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: അശ്രിയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ വ്യഞ്ജനരൂപം കഴിയുന്നത്ര നേരിട്ട് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശബന്ധമുള്ള ഉപവിഭാഗത്തെയാണ് ഈ ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്നത്; ആ സാമൂഹിക ഘടകത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: הָאַשְׂרִיאֵלִי
  choice: അശ്രിയേല്യർ
  rationale: അശ്രിയേലിൽനിന്നുള്ള സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വംശനാമം മലയാളത്തിലെ കൂട്ടവാചക രൂപത്തിൽ നൽകി.
- source_word: שֶׁכֶם
  choice: ശെഖേം
  rationale: ഇവിടെ സ്ഥലനാമമല്ല, പൂർവികനായ വ്യക്തിയുടെ പേരാണ്; എബ്രായരൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: הַשִּׁכְמִי
  choice: ശെഖേമ്യർ
  rationale: ശെഖേമിൽനിന്നുള്ള സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന വംശനാമം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകി.
- source_word: וְ
  choice: ;
  rationale: രണ്ടാമത്തെ പട്ടികഘടകത്തിന് മുമ്പുള്ള എബ്രായ സംയോജകത്തെ മലയാളത്തിലെ പട്ടികശൈലിയിൽ അർദ്ധവിരാമംകൊണ്ട് സ്വാഭാവികമായി പ്രതിനിധീകരിച്ചു.
