  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: ml
  text: എന്നാൽ നാദാബും അബീഹൂവും യഹ്‌വെയുടെ സന്നിധിയിൽ അനുവദിക്കപ്പെടാത്ത തീ[a] അർപ്പിച്ചപ്പോൾ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അന്യമായ തീ’ അല്ലെങ്കിൽ ‘വിദേശമായ തീ.’ യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിക്കാൻ അനുവദിക്കപ്പെടാത്ത തീയെയാണ് ഹീബ്രു പ്രയോഗം ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: ക്രിയ ഏകവചനത്തിലാണെങ്കിലും അതിനു പിന്നാലെ ‘നാദാബും അബീഹൂവും’ എന്ന സംയുക്ത കർത്താവാണ് വരുന്നത്; ഹീബ്രുവിൽ സാധാരണമായ ഈ ഘടന മലയാളത്തിൽ സംയുക്ത കർത്താവിനോടു സ്വാഭാവികമായി യോജിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: נָדָב וַאֲבִיהוּא
  choice: നാദാബും അബീഹൂവും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: בְּהַקְרִיבָם
  choice: അർപ്പിച്ചപ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; യാഗാരാധനയുടെ പശ്ചാത്തലത്തിൽ ‘അർപ്പിച്ചപ്പോൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֵשׁ זָרָה
  choice: അനുവദിക്കപ്പെടാത്ത തീ
  rationale: זָרָה എന്ന പദത്തിന് ‘അന്യമായ/അപരിചിതമായ’ എന്ന അക്ഷരാർഥസാധ്യതയുണ്ടെങ്കിലും ആരാധനാസന്ദർഭത്തിൽ അംഗീകരിക്കപ്പെടാത്തതോ അധികാരപ്പെടുത്താത്തതോ ആയ തീയാണ് ഉദ്ദേശിക്കുന്നത്. മുഖ്യവാചകം ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי ആരാധനാസന്ദർഭത്തിൽ ‘സന്നിധിയിൽ’ എന്ന് സ്വാഭാവികമായി നൽകുന്നു; יהוה എന്ന ദൈവനാമം പദവിയായി മാറ്റാതെ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַ
  choice: എന്നാൽ
  rationale: വംശാവലിവിവരണത്തിനിടയിലെ ഈ അസാധാരണ മരണവാർത്തയെ മുൻവിവരത്തിൽനിന്ന് വേർതിരിക്കുന്ന വ്യത്യാസബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണത്തോട് അടുത്ത രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: אֵשׁ זָרָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: അനുവദിക്കപ്പെടാത്ത തീ
  alternative: അന്യമായ തീ / വിദേശമായ തീ
  rationale: പദത്തിന്റെ അക്ഷരാർഥപരമായ അന്യതയും ആരാധനാനിയമപ്രകാരമുള്ള അനധികൃതതയും തമ്മിലുള്ള സംഘർഷം പരിഗണിച്ചു. സന്ദർഭാർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിലും നൽകി; തീയുടെ കൃത്യമായ സ്വഭാവം പാഠം പറയുന്നതിലധികം നിർവചിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘അനുവദിക്കപ്പെടാത്ത തീ’ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതാണ്; മൂലപദത്തിന്റെ വ്യത്യസ്ത അർഥനിറം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
