  variant: modern standard Malayalam
source:
  edition: WLC
  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളുടെ[b] മുഴുവൻ സമൂഹത്തിന്റെ കണക്കെടുക്കുക[a]: ഇരുപതു വയസ്സുമുതൽ അതിനുമുകളിലുള്ളവരെ, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം[c], ഇസ്രായേലിൽ യുദ്ധസേവനത്തിനായി പുറപ്പെടുന്ന എല്ലാവരെയും[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മുഴുവൻ സമൂഹത്തിന്റെ തല ഉയർത്തുക.’ ആളുകളെ എണ്ണുക, അഥവാ കണക്കെടുക്കുക, എന്നർഥമുള്ള ഒരു ശൈലിയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഇസ്രായേല്യർ’; എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
  - marker: c
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയുള്ള കുടുംബ-കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_context
  - marker: d
    text: ‘യുദ്ധസേവനത്തിനായി പുറപ്പെടുന്നവർ’ എന്ന എബ്രായ പ്രയോഗം യുദ്ധത്തിലോ സൈനികസേവനത്തിലോ പങ്കെടുക്കുന്നവരെയും അതിനു ബാധ്യസ്ഥരായവരെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: കണക്കെടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘തല ഉയർത്തുക’ എന്നാണെങ്കിലും, ഇവിടെ ആളുകളെ എണ്ണി ജനസംഖ്യ നിർണയിക്കുക എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്. ‘കണക്കെടുക്കുക’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל־עֲדַת
  choice: മുഴുവൻ സമൂഹം
  rationale: עֵדָה ഇസ്രായേലിന്റെ സംഘടിതമായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഈ സന്ദർഭത്തിൽ ഗൗരവമുള്ളതുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുകയും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ളവർ
  rationale: പ്രായപരിധി വ്യക്തമാക്കുന്ന എബ്രായ സൂത്രപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയുള്ള കുടുംബ-കുലവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സാമൂഹിക ഘടന സംരക്ഷിക്കുന്നു.
- source_word: כָּל־יֹצֵא צָבָא
  choice: സൈന്യത്തിലേക്കു പുറപ്പെടുന്ന എല്ലാവരും
  rationale: ‘സൈന്യത്തിനായി/സൈന്യത്തിലേക്കു പുറപ്പെടുക’ എന്ന എബ്രായ സൈനികപ്രയോഗം അധികമായി വ്യാഖ്യാനിക്കാതെ അടുത്തായി പകരുന്നു; സന്ദർഭത്തിൽ ഇത് സൈനികസേവനത്തിനുള്ള യോഗ്യതയെയും ബാധ്യതയെയും സൂചിപ്പിക്കാം.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: മൂലത്തിലെ സ്ഥലം/സമൂഹബന്ധം ലളിതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബപരവും ലിംഗസൂചനയുള്ളതുമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന കുടുംബരൂപകം ഇല്ലാതാക്കാതെ നിലനിർത്തി. സൈനിക കണക്കെടുപ്പ് എന്ന സന്ദർഭം പുരുഷന്മാരെ കേന്ദ്രീകരിക്കുന്നുവെങ്കിലും, മലയാളത്തിലെ ‘മക്കൾ’ എന്ന പദം മാത്രം ഉപയോഗിച്ച് മൂലത്തേക്കാൾ കർശനമായ ലിംഗവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: כָּל־יֹצֵא צָבָא എന്നതിലെ സൈനികയോഗ്യതയുടെ സൂചന
  choice: സൈന്യത്തിലേക്കു പുറപ്പെടുന്ന എല്ലാവരും
  alternative: സൈനികസേവനത്തിന് യോഗ്യരായ എല്ലാ പുരുഷന്മാരും
  rationale: ‘യോഗ്യർ’ എന്നും ‘പുരുഷന്മാർ’ എന്നും മൂലത്തിൽ പ്രത്യേകം പറയാത്ത പദങ്ങൾ പ്രധാനവാചകത്തിൽ ചേർക്കാതെ, എബ്രായ പ്രയോഗത്തിന്റെ ചലനാത്മക രൂപം നിലനിർത്തി. അതിന്റെ പ്രവർത്തനാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിർദേശവാക്യം. ‘പിതൃഭവനം’ പോലുള്ള സാംസ്കാരികമായി പ്രത്യേകമായ പദം മൂലത്തിലെ സാമൂഹിക ഘടന നിലനിർത്താൻ ഉപയോഗിച്ചു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. വാക്യാവസാനത്തെ [d] ‘സൈന്യത്തിലേക്കു പുറപ്പെടുന്ന’ എന്ന പ്രയോഗത്തെയാണ് വിശദീകരിക്കുന്നത്.
