id: NUM.26.44
reference: Numbers 26:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: ml
  text: 'ആശേരിന്റെ പുത്രന്മാർ, അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്[a]: യിമ്നായിൽനിന്ന് യിമ്നായരുടെ കുലം; യിശ്വിയിൽനിന്ന് യിശ്വിയരുടെ കുലം; ബെരീയായിൽനിന്ന് ബെരീയായരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘കുടുംബങ്ങൾക്കനുസരിച്ച്’; ഈ ജനസംഖ്യാകണക്കെടുപ്പിന്റെ സന്ദർഭത്തിൽ ഈ പദം ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: ആശേരിന്റെ പുത്രന്മാർ
  rationale: ‘പുത്രന്മാർ’ എന്നത് בְּנֵי എന്ന വംശാവലിപരമായ പ്രയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; ഇവിടെ പേരെടുത്ത പുത്രന്മാരിൽനിന്നുള്ള കുലങ്ങളും ഉൾപ്പെടുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾക്കനുസരിച്ച്
  rationale: സംഖ്യപുസ്തകത്തിലെ ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിലെ ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘കുലം’ ഇവിടെ കൃത്യമാണ്.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: യിമ്നായിൽനിന്ന് / യിശ്വിയിൽനിന്ന് / ബെരീയായിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന വംശാവലിസൂത്രത്തിലെ לְ പൂർവികനിൽനിന്നുള്ള വംശോത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-യിൽനിന്ന്’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַיִּמְנָה / מִשְׁפַּחַת הַיִּשְׁוִי / מִשְׁפַּחַת הַבְּרִיעִי
  choice: യിമ്നായരുടെ കുലം / യിശ്വിയരുടെ കുലം / ബെരീയായരുടെ കുലം
  rationale: ഹീബ്രു രൂപങ്ങൾ അതത് പൂർവികരിൽനിന്നു പേരെടുത്ത കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പേരിനോട് ‘-യർ’ ചേർത്ത രൂപം ഈ വംശജനാമപ്രവർത്തനം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മസോററ്റിക് ഹീബ്രു രൂപങ്ങളോടടുത്ത് യിമ്നാ, യിശ്വി, ബെരീയാ എന്നിങ്ങനെ ലിപ്യന്തരണം ചെയ്തു; ആവർത്തനഘടന മൂലപാഠത്തിന്റെ വംശാവലിസ്വഭാവം നിലനിർത്തുന്നു.
