  yaml_path: translation/ot/numbers/026/014.yaml
  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: ml
  text: 'ശിമെയോന്യരുടെ കുലങ്ങൾ ഇവയാണ്: ഇരുപത്തിരണ്ടായിരത്തി ഇരുനൂറ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: വംശങ്ങളുടെ പട്ടികയെ സംഗ്രഹിച്ച് അവതരിപ്പിക്കുന്ന ബഹുവചന സൂചകപദം; എബ്രായ നാമവാക്യത്തിന്റെ അവതരണസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത ഉപവിഭാഗങ്ങളെയാണ് ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘വംശങ്ങൾ’ സ്വാഭാവികവും പ്രസക്തവുമാണ്.
- source_word: הַשִּׁמְעֹנִי
  choice: ശിമെയോന്യരുടെ
  rationale: നിശ്ചയാർഥകപ്രത്യയമുള്ള ഏകവചന ജനവിഭാഗനാമം ഇവിടെ സമൂഹവാചകമാണ്; മലയാളത്തിലെ ബന്ധസൂചക ബഹുവചനരൂപം വംശങ്ങളുമായുള്ള ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: ഇരുപത്തീരായിരത്തി ഇരുനൂറ്
  rationale: 22,200 എന്ന ജനസംഖ്യാതുകയുടെ സ്വാഭാവികമായ ആധുനിക മലയാള സംഖ്യാരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ജനസംഖ്യാകണക്ക്-ശൈലി. മൂലത്തിലെ സംക്ഷിപ്ത നാമവാക്യഘടനയും ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളുടെ അർഥവും സംരക്ഷിച്ചിട്ടുണ്ട്.
