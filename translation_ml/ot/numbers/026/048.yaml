  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: ml
  text: 'നഫ്താലിയുടെ പുത്രന്മാർ അവരുടെ കുടുംബങ്ങൾപ്രകാരം: യഹ്സെയേലിൽനിന്ന് യഹ്സെയേല്യരുടെ കുടുംബം; ഗൂനിയിൽനിന്ന് ഗൂന്യരുടെ കുടുംബം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്തരൂപത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ ഗോത്രപരമായ പിൻതലമുറകളെയും ഉൾക്കൊള്ളുന്ന പട്ടികാസൂത്രമാണെങ്കിലും എബ്രായരൂപം അനാവശ്യമായി വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാകണക്കിന്റെയും ഗോത്രവിഭജനത്തിന്റെയും പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ഒരു വിപുലകുടുംബ/കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-വംശാവലി ഭാഷയിൽ ‘വംശം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: לְיַחְצְאֵל
  choice: യഹ്സെയേലിൽനിന്ന്
  rationale: വ്യക്തിനാമത്തിനു മുമ്പുള്ള לְ ഇവിടെ ആ പൂർവികനിൽനിന്ന് കണക്കാക്കപ്പെടുന്ന വംശശാഖയെ പരിചയപ്പെടുത്തുന്നു; ‘-ൽനിന്ന്’ ഈ വംശജന്യബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: യഹ്സെയേല്യരുടെ വംശം
  rationale: നാമത്തിൽനിന്നുള്ള എബ്രായ ജാതിവാചകം ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘യഹ്സെയേല്യർ’ എന്ന സമൂഹവാചകവും അതിനോടൊപ്പം ‘വംശം’ എന്നതും ഉപയോഗിച്ചു.
- source_word: לְגוּנִי
  choice: ഗൂനിയിൽനിന്ന്
  rationale: മുമ്പത്തെ പേരിനോടുള്ളതുപോലെ, ഈ לְയും ഗൂനിയിൽനിന്ന് ഉത്ഭവിച്ച വംശശാഖയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: ഗൂന്യരുടെ വംശം
  rationale: הַגּוּנִי എന്ന ജാതിവാചകത്തിന്റെ കൂട്ടാർഥം ‘ഗൂന്യർ’ എന്നും מִשְׁפַּחַת ‘വംശം’ എന്നും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പട്ടികാശൈലി. പേരുകൾ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു. സമാന്തരമായ എബ്രായ ഘടന മലയാളത്തിലും നിലനിർത്തി; അപൂർവമോ വിശദീകരണം ആവശ്യമായതോ ആയ പാഠഭേദമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
