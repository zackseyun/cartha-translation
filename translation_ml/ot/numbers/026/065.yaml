source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: ml
  text: കാരണം യഹോവ അവരെക്കുറിച്ച്, “അവർ മരുഭൂമിയിൽ തീർച്ചയായും മരിക്കും[a]” എന്ന് അരുളിച്ചെയ്തിരുന്നു. യെഫുന്നെയുടെ മകൻ കാലേബും നൂന്റെ മകൻ യോശുവയും ഒഴികെ അവരിൽ ഒരാൾപോലും ശേഷിച്ചില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘മരിച്ചുകൊണ്ട് അവർ മരിക്കും’; അവർ തീർച്ചയായും മരിക്കുമെന്ന ഊന്നൽ നൽകുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘അവരിൽനിന്ന് ഒരു പുരുഷനും ശേഷിച്ചില്ല.’ ഇവിടെ അർഥം: അവരിൽ ഒരാൾപോലും ശേഷിച്ചില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ജനസംഖ്യാ ഫലത്തിന്റെ കാരണം ഈ വാക്യം വിശദീകരിക്കുന്നതിനാൽ കാരണസൂചകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: אָמַר ... לָהֶם
  choice: അവരെക്കുറിച്ച് ... അരുളിച്ചെയ്തിരുന്നു
  rationale: לָהֶם ഇവിടെ ആ ജനത്തെ സംബന്ധിച്ച ദൈവിക പ്രഖ്യാപനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പ്രസ്താവന ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ ഫലത്തിനു മുമ്പുള്ളതായതിനാൽ പൂർവകാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: מוֹת יָמֻתוּ
  choice: തീർച്ചയായും മരിക്കും
  rationale: ക്രിയാനാമവും സമാപികാക്രിയയും ചേർന്ന എബ്രായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽവെച്ചു
  rationale: മִדְבָּר എന്നത് ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ ‘മരുഭൂമി’യായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുന്നു; ‘വെച്ചു’ മരണത്തിന്റെ സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: അവരിൽ ഒരാൾപോലും ശേഷിച്ചില്ല
  rationale: പുരുഷ ഏകവചനമായ אִישׁ ഇവിടെ വിതരണാത്മകമായി ‘ഒരാളും’ എന്ന അർഥം നൽകുന്നു. ഈ പരിഭാഷ ‘ഒരാൾപോലും’ എന്ന ഊന്നലോടെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: כִּי אִם
  choice: ഒഴികെ
  rationale: മുൻപുള്ള നിഷേധപ്രസ്താവനയിലെ ഏക അപവാദങ്ങളെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗം.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: യെഫുന്നെയുടെ മകൻ കാലേബ്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ബന്ധസൂചകക്രമത്തിൽ പിതൃനാമബന്ധം അവതരിപ്പിക്കുകയും പേരുകൾ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: നൂന്റെ മകൻ യോശുവയും
  rationale: പിതൃനാമബന്ധം സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകുകയും וְ എന്ന സംയോജകം ‘യും’കൊണ്ട് നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരാതെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ദൈവവചനത്തിന് ‘അരുളിച്ചെയ്തിരുന്നു’ ഉപയോഗിച്ചു; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തോട് ചേർത്തിരിക്കുന്നു.
