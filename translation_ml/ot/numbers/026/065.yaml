    rationale: ‘വെച്ചു’ is ordinarily a past verbal form; ‘വെച്ച്’ would be the relevant postpositional form. Since the Hebrew simply says ‘in the wilderness,’ ‘മരുഭൂമിയിൽ’ is both exact and more natural.
