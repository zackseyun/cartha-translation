  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י שׁוּתָ֑לַח לְ/עֵרָ֕ן מִשְׁפַּ֖חַת הָ/עֵרָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/036.yaml
  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: ml
  text: 'ശൂതേലഹിന്റെ പുത്രന്മാർ[a] ഇവരായിരുന്നു: ഏരാനിൽനിന്ന് ഏരാന്യരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ: ‘ശൂതേലഹിന്റെ പുത്രന്മാർ ഇവർ: ഏരാനു, ഏരാന്യന്റെ കുലം.’ ഇവിടെ ‘പുത്രന്മാർ’ എന്നത് വംശാവലിപ്രയോഗമാണ്; അത് നേരിട്ടുള്ള പുത്രന്മാരെ മാത്രമല്ല, സന്തതികളെയോ കുലശാഖകളെയോ സൂചിപ്പിക്കാം. മുഖ്യവാക്യത്തിലെ ‘ഏരാനിൽനിന്ന്’ എന്ന രൂപം കുലോത്ഭവബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.'
    reason: lexical_alternative
