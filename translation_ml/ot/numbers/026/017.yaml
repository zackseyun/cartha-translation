id: NUM.26.17
reference: Numbers 26:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לַ/אֲר֕וֹד מִשְׁפַּ֖חַת הָ/אֲרוֹדִ֑י לְ/אַ֨רְאֵלִ֔י מִשְׁפַּ֖חַת הָ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: ml
  text: അരോദിൽനിന്ന് അരോദ്യരുടെ കുലം[a]; അരേലിയിൽനിന്ന് അരേല്യരുടെ കുലം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “അരോദിന് അരോദ്യരുടെ കുലം; അരേലിക്ക് അരേല്യരുടെ കുലം.” എബ്രായ ഭാഷയിലെ לְ എന്ന ഉപസർഗം ജനസംഖ്യാകണക്കിലെ ഈ സൂത്രവാക്യത്തിൽ ഓരോ പൂർവികന്റെയും പേരിനെ അവതരിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/אֲרֹד
  choice: അരോദിൽനിന്ന്
  rationale: ഇവിടെയുള്ള לְ ജനസംഖ്യാകണക്കിന്റെ സൂത്രവാക്യത്തിൽ പൂർവികനെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ വംശപരമായ ഉത്ഭവം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘-ൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശബന്ധമുള്ള ഉപവിഭാഗത്തെയാണ് ഈ ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘കുലം’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: הָ/אֲרֹדִי
  choice: അരോദ്യരുടെ
  rationale: അരോദിൽനിന്നുള്ള സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന നിസ്ബാ രൂപം; മലയാളത്തിൽ സമൂഹനാമത്തിന്റെ ബഹുവചന-ബന്ധരൂപമായി നൽകി.
- source_word: לְ/אַרְאֵלִי
  choice: അരേലിയിൽനിന്ന്
  rationale: ആദ്യ പാദത്തിലെ לְ പോലെതന്നെ കുലത്തിന്റെ പൂർവികനെ അവതരിപ്പിക്കുന്നു; ആവർത്തനഘടന നിലനിർത്തി.
- source_word: הָ/אַרְאֵלִי
  choice: അരേല്യരുടെ
  rationale: അരേലിയിൽനിന്നുള്ള സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന രൂപം; മലയാളത്തിലെ സ്വാഭാവികമായ സമൂഹനാമ-ബന്ധരൂപം തിരഞ്ഞെടുത്തു.
