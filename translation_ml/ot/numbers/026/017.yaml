  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ജനസംഖ്യാകണക്ക്-ശൈലി. മൂലത്തിലെ സമാന്തരവും ആവർത്തനാത്മകവുമായ ഘടന സംരക്ഷിച്ചു; ഔപചാരികമായ לְ-ഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
