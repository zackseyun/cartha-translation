id: NUM.26.62
reference: Numbers 26:62
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: ml
  text: അവരിൽ എണ്ണപ്പെട്ടവർ ഇരുപത്തിമൂവായിരം പേർ ആയിരുന്നു—ഒരു മാസം പ്രായമുള്ളവരും അതിൽ കൂടുതലുള്ളവരുമായ എല്ലാ ആൺവ്യക്തികളും. യിസ്രായേൽമക്കളുടെ ഇടയിൽ[a] അവർ എണ്ണപ്പെട്ടിരുന്നില്ല; കാരണം യിസ്രായേൽമക്കളുടെ ഇടയിൽ അവർക്ക് അവകാശവിഹിതം നൽകിയിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യിസ്രായേല്യരുടെ ഇടയിൽ.’ ഈ വാക്യത്തിലെ ‘യിസ്രായേൽമക്കളുടെ ഇടയിൽ’ എന്ന രണ്ടു പ്രയോഗങ്ങളിലും ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: בְּנֵי יִשְׂרָאֵל എന്നത് അക്ഷരാർഥത്തിൽ ‘യിസ്രായേൽമക്കൾ’ എന്നും സ്വാഭാവിക ജനവിഭാഗനാമമായി ‘യിസ്രായേല്യർ’ എന്നും നൽകാവുന്നതാണ്.
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിലുള്ള פקד എന്ന ധാതുവിന്റെ അർഥം നിലനിർത്തുന്നു; സാങ്കേതികത അധികമാക്കാതെ എണ്ണപ്പെട്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: ഇരുപത്തിമൂവായിരം പേർ
  rationale: സംഖ്യയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘പേർ’ ചേർക്കുന്നത് വ്യക്തികളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ പുരുഷപ്രജകളും
  rationale: ഒരു മാസം പ്രായമുള്ള ശിശുക്കളെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നതിനെക്കാൾ പ്രായനിരപേക്ഷമായി ആൺലിംഗത്തിലുള്ള എല്ലാവരെയും സൂചിപ്പിക്കുന്നു.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ഒരു മാസം പ്രായംമുതലുള്ള
  rationale: ഹീബ്രു വാക്യഘടനയിലെ കുറഞ്ഞ പ്രായപരിധി സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: הָתְפָּקְדוּ
  choice: എണ്ണിയിരുന്നില്ല
  rationale: വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ജനസംഖ്യാകണക്കെടുപ്പ് പദവുമായി ഒരേ അർഥബന്ധം നിലനിർത്തുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബബന്ധപരമായ മൂലപ്രയോഗം നിലനിർത്തുകയും בְּתוֹךְ എന്നതിന് ‘ഇടയിൽ’ നൽകുകയും ചെയ്യുന്നു.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: അവർക്ക് അവകാശം നൽകിയിരുന്നില്ല
  rationale: മൂലത്തിലെ നിഷ്ക്രിയ ഘടനയും നַחֲלָהയുടെ അവകാശവിഹിതം/അവകാശഭൂമി എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ പ്രയോഗം നിലനിർത്തുന്നു; അതേസമയം സാധ്യമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: നַחֲלָהയുടെ അർഥപരിധി
  choice: അവകാശം
  alternative: അവകാശഭൂമി / ഓഹരി
  rationale: ലേവ്യർക്ക് മറ്റുള്ള ഗോത്രങ്ങളുടെ ഇടയിൽ ഭൂവിഹിതം ലഭിക്കാത്ത പശ്ചാത്തലത്തെ സൂചിപ്പിക്കുമ്പോഴും, മൂലപദത്തിന്റെ വിപുലമായ ‘അവകാശം’ എന്ന അർഥം അനാവശ്യമായി ‘ഭൂമി’യായി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ജനസംഖ്യാകണക്കെടുപ്പുമായി ബന്ധപ്പെട്ട പദാവർത്തനം നിലനിർത്തി. ‘പുരുഷപ്രജകൾ’ എന്നത് ശിശുക്കളുൾപ്പെടെയുള്ള എല്ലാ ആൺവ്യക്തികളെയും കൃത്യമായി ഉൾക്കൊള്ളാൻ തിരഞ്ഞെടുത്തു; ‘യിസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
