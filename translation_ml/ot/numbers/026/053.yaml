  text: לָ/אֵ֗לֶּה תֵּחָלֵ֥ק הָ/אָ֛רֶץ בְּ/נַחֲלָ֖ה בְּ/מִסְפַּ֥ר שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: ml
  text: ഇവർക്കു ദേശം അവകാശമായി പേരുകളുടെ എണ്ണമനുസരിച്ച്[a] വിഭജിച്ചുനൽകപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആളുകളുടെ എണ്ണമനുസരിച്ച്’; അക്ഷരാർഥം, ‘പേരുകളുടെ എണ്ണമനുസരിച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: ഇവർക്കു
  rationale: לְ എന്ന ഉപസർഗത്തോടുകൂടിയ ബഹുവചന സൂചകസർവനാമം വിഭജനത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇവർക്കു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: תֵּחָלֵק
  choice: വിഭജിച്ചുകൊടുക്കണം
  rationale: חלק എന്ന ക്രിയയുടെ നിഫാൽ അപൂർണരൂപം ഇവിടെ ദേശം പങ്കിട്ടുനൽകപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നിർദേശഭാവവും സ്വീകർത്താക്കൾക്കുള്ള വിഭജനവും സ്വാഭാവിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: הָאָרֶץ
  choice: ദേശം
  rationale: ഇസ്രായേൽഗോത്രങ്ങൾക്കുള്ള ഭൂപങ്കിടലിന്റെ സന്ദർഭത്തിൽ הָאָרֶץ എന്നതിന് ‘ദേശം’ എന്നത് പതിവും യോജിച്ചതുമായ പരിഭാഷയാണ്.
- source_word: בְּנַחֲלָה
  choice: അവകാശമായി
  rationale: נַחֲלָה പാരമ്പര്യമായി ലഭിക്കുന്ന സ്വത്തിനെയും അനുവദിച്ചുകിട്ടുന്ന കൈവശഭൂമിയെയും സൂചിപ്പിക്കുന്നു; ‘അവകാശമായി’ ഈ നിയമപരവും ഉടമസ്ഥതാപരവുമായ അർഥം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: ഇവിടെ בְּ മാനദണ്ഡമോ അളവോ സൂചിപ്പിക്കുന്നു; ‘എണ്ണമനുസരിച്ച്’ വിതരണം എണ്ണത്തിന്റെ അടിസ്ഥാനത്തിലാണെന്നത് കൃത്യമായി അറിയിക്കുന്നു.
- source_word: שֵׁמוֹת
  choice: പേരുകളുടെ
  rationale: എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘പേരുകൾ’ എന്നാണ്. ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭത്തിൽ അത് വ്യക്തികളെ സൂചിപ്പിച്ചാലും മൂലപാഠത്തിന്റെ രൂപവും ചെറിയ അർഥവ്യാപ്തിയും പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പേരുകൾ’ എന്ന മൂലപാഠപ്രയോഗം പ്രധാനവാചകത്തിൽ സൂക്ഷിക്കുകയും അതിന്റെ സന്ദർഭാർഥമായ ‘ആളുകൾ’ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
