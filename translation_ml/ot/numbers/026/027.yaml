  yaml_path: translation/ot/numbers/026/027.yaml
  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: ml
  text: സെബൂലൂന്യരുടെ വംശങ്ങൾ ഇവയാണ്; അവരിൽ എണ്ണപ്പെട്ടവർ അറുപതിനായിരത്തി അഞ്ഞൂറ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: സംഗ്രഹപ്രസ്താവനയെ പരിചയപ്പെടുത്തുന്ന ബഹുവചന സൂചകപദം; മലയാളത്തിൽ വർത്തമാനകാല രൂപം സ്വാഭാവികമാണ്.
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ വിപുലമായ ബന്ധുഗണങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ കുടുംബങ്ങളെക്കാൾ വിശാലമായ ‘വംശങ്ങൾ’ യോജിക്കുന്നു.
- source_word: הַזְּבוּלֹנִי
  choice: സെബൂലൂന്യരുടെ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന ഗോത്രനാമം ഇവിടെ സമൂഹവാചകമായി സെബൂലൂന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്നു.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരുടെ എണ്ണമെടുപ്പുപ്രകാരം
  rationale: פקד എന്ന ധാതുവിന്റെ ജനസംഖ്യാകണക്കെടുപ്പ് അർഥം നിലനിർത്തി, വംശങ്ങളെയും രേഖപ്പെടുത്തിയ ആകെ എണ്ണത്തെയും സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: അറുപതിനായിരത്തി അഞ്ഞൂറ്
  rationale: 60,500 എന്ന സംഖ്യയെ ഔപചാരികമായ വാക്യശൈലിക്ക് അനുയോജ്യമായി വാക്കുകളിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കണക്കെടുപ്പ് ശൈലി. ‘കുടുംബങ്ങൾ’ എന്നതിനുപകരം ഗോത്രത്തിനുള്ളിലെ വിപുല ബന്ധുഗണങ്ങളെ വ്യക്തമാക്കാൻ ‘വംശങ്ങൾ’ ഉപയോഗിച്ചു.
