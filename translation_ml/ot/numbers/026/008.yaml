  text: וּ/בְנֵ֥י פַלּ֖וּא אֱלִיאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/008.yaml
  text: 'And the sons of Pallu: Eliab.'
translation:
  language: ml
  text: 'പല്ലൂവിന്റെ മക്കൾ: എലീയാബ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: മക്കൾ
  rationale: בְנֵי എന്നത് വംശാവലിപ്പട്ടികയിലെ സംയുക്ത ബഹുവചനരൂപമാണ്. ഇവിടെ ഒരേയൊരു പേര് മാത്രമാണ് തുടർന്നുവരുന്നതെങ്കിലും എബ്രായത്തിലെ പട്ടികാസൂത്രം നിലനിർത്താൻ ‘മക്കൾ’ എന്നു നൽകി. വാക്യാരംഭത്തിലെ וּ പട്ടികയിലെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അപൂർണ പട്ടികവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി അത് പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: פַלּוּא
  choice: പല്ലൂ
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱלִיאָב
  choice: എലീയാബ്
  rationale: വ്യക്തിനാമം എബ്രായരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
