  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּצְאִ֖ים מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: ml
  text: ഇരുപതു വയസ്സുമുതൽ അതിനു മുകളിലുള്ളവർ—യഹ്‌വേ മോശയോടും ഈജിപ്തുദേശത്തുനിന്നു പുറപ്പെട്ട ഇസ്രായേല്യരോടും കല്പിച്ചതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ഇരുപതു വയസ്സുമുതൽ അതിനു മുകളിലുള്ളവരെ
  rationale: ‘ഇരുപതു വയസ്സുള്ളവൻമുതൽ മുകളിലേക്ക്’ എന്ന എബ്രായ പ്രായപരിധി പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെ
  rationale: כַּאֲשֶׁר എന്ന താരതമ്യബന്ധവും צִוָּה എന്ന ക്രിയയുടെ ആജ്ഞാത്മക ശക്തിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת מֹשֶׁה וּבְנֵי יִשְׂרָאֵל
  choice: മോശയോടും … ഇസ്രായേല്യരോടും
  rationale: אֶת അടയാളപ്പെടുത്തുന്ന സംയുക്ത കർമമായി മോശയെയും ഇസ്രായേൽജനത്തെയും വായിക്കുന്ന എബ്രായ വാക്യഘടന നിലനിർത്തുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന ജനസമൂഹനാമത്തിന് സ്വാഭാവികമായ ‘ഇസ്രായേല്യർ’ ഉപയോഗിക്കുന്നു.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: ഈജിപ്തുദേശത്തുനിന്നു പുറപ്പെട്ട
  rationale: പങ്കാളിക്രിയയുടെ വിശേഷണപ്രയോഗവും מִן സൂചിപ്പിക്കുന്ന പുറപ്പെടൽസ്ഥാനവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു പദവിയല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് നൽകുന്നത്; അതിനാൽ മലയാളത്തിൽ അടുത്ത ലിപ്യന്തരണം സ്വീകരിച്ചു.
- issue: കല്പനയുടെ സ്വീകർത്താക്കൾ
  choice: മോശയോടും … ഇസ്രായേല്യരോടും
  alternative: മോശയോടു മാത്രം
  rationale: אֶת מֹשֶׁה וּבְנֵי יִשְׂרָאֵל എന്ന രൂപത്തിൽ മോശയും ഇസ്രായേല്യരും ഒരേ ക്രിയയുടെ സംയുക്ത കർമങ്ങളായി കാണപ്പെടുന്നു; വ്യാഖ്യാനസൗകര്യത്തിനായി രണ്ടാമത്തെ കർമത്തെ വേറൊരു വാക്യമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ അപൂർണവാക്യസ്വഭാവം വായനയെ തടസ്സപ്പെടുത്താതിരിക്കാൻ സന്ദർഭത്തിൽനിന്നുള്ള ക്രിയ ചേർത്ത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു; മോശയെയും ഇസ്രായേല്യരെയും സംയുക്ത കർമങ്ങളായി കാണുന്ന എബ്രായ വാക്യഘടന സംരക്ഷിച്ചിട്ടുണ്ട്.
