id: NUM.26.29
reference: Numbers 26:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: ml
  text: 'മനശ്ശെയുടെ പുത്രന്മാർ: മാഖീരിൽനിന്ന് മാഖീര്യരുടെ കുലം; മാഖീർ ഗിലെയാദിനെ ജനിപ്പിച്ചു; ഗിലെയാദിൽനിന്ന് ഗിലെയാദ്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നതിന്റെ ഔപചാരികമായ വംശാവലിശൈലി നിലനിർത്തുന്നു; ഈ ജനസംഖ്യാ-ഗോത്രസന്ദർഭത്തിൽ ഇത് വിശാലമായി പിൻതലമുറക്കാരെയും സൂചിപ്പിക്കാമെങ്കിലും മൂലപാഠത്തിലെ ‘പുത്രന്മാർ’ എന്ന രൂപം സംരക്ഷിക്കുന്നു.
- source_word: לְמָכִיר
  choice: മാഖീരിൽനിന്ന്
  rationale: ഇവിടെയുള്ള לְ ഒരു വംശശാഖയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘മാഖീരിൽനിന്ന്’ എന്നു പറയുന്നത് ആ വംശബന്ധം സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: മാഖീര്യരുടെ കുലം
  rationale: സംഖ്യാപുസ്തകം 26-ലെ ഗോത്രവിഭജനസന്ദർഭത്തിൽ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനുള്ളിലെ കുലത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘കുലം’ കൃത്യമാണ്.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: മാഖീർ ഗിലെയാദിനെ ജനിപ്പിച്ചു
  rationale: הוֹלִיד എന്ന വംശാവലിക്രിയയുടെ സജീവരൂപവും പിതൃവംശപരമായ പരാമർശവും നേരിട്ട് നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: לְגִלְעָד
  choice: ഗിലെയാദിൽനിന്ന്
  rationale: മുമ്പുള്ള לְמָכִיר എന്ന ഘടനയ്ക്കു സമാന്തരമായി ഗിലെയാദിൽനിന്നുള്ള വംശശാഖയെ വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: ഗിലെയാദ്യരുടെ കുലം
  rationale: ജാതിനാമരൂപമായ הַגִּלְעָדִי-യെ സമൂഹവാചകമായി ‘ഗിലെയാദ്യർ’ എന്നും מִשְׁפַּחַת-നെ ‘കുലം’ എന്നും പരിഭാഷപ്പെടുത്തി ഗോത്രജനസംഖ്യാ പട്ടികയുടെ അർഥം നിലനിർത്തുന്നു.
