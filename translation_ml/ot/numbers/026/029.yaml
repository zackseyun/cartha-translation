  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ ജനസംഖ്യാ-വംശാവലി ഘടനയും സമാന്തരതയും അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
