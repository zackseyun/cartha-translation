id: NUM.26.21
reference: Numbers 26:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: ml
  text: 'പെരെസിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു: ഹെസ്രോനിൽനിന്ന് ഹെസ്രോന്യരുടെ കുലം; ഹാമൂലിൽനിന്ന് ഹാമൂല്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു / പട്ടികാരൂപത്തിൽ സൂചിപ്പിക്കുന്നു
  rationale: വംശാവലി-ജനസംഖ്യാ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ היה ലളിതമായ ബന്ധകക്രിയയായി വരുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാരൂപം നിലനിർത്താൻ പ്രത്യേക ക്രിയാപദം ആവർത്തിക്കാതെ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: ഇവിടെ കുലങ്ങൾക്ക് പേരുനൽകുന്ന നേരിട്ടുള്ള പുരുഷവംശത്തലവന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ എബ്രായത്തിലെ ലിംഗസൂചനയും വംശാവലിയുടെ രൂപവും നിലനിർത്തുന്നു.
- source_word: פֶרֶץ
  choice: പേരെസ്
  rationale: എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: לְחֶצְרֹן
  choice: ഹെസ്രോനിൽനിന്ന്
  rationale: ഈ കണക്കെടുപ്പ് സൂത്രത്തിൽ ל കുലത്തിന്റെ ഉത്ഭവമോ വംശബന്ധമോ സൂചിപ്പിക്കുന്നു; ‘-യിൽനിന്ന്’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: സംഖ്യാപുസ്തകത്തിലെ കണക്കെടുപ്പ് പശ്ചാത്തലത്തിൽ ഇത് ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗമാണ്; ‘കുലം’ അതിന് യോജിച്ച ആധുനിക മലയാള പദമാണ്.
- source_word: הַחֶצְרֹנִי
  choice: ഹെസ്രോന്യരുടെ
  rationale: ഹെസ്രോനിൽനിന്ന് ഉത്ഭവിച്ച സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന-ബന്ധരൂപത്തിൽ നൽകി.
- source_word: לְחָמוּל
  choice: ഹാമൂലിൽനിന്ന്
  rationale: ലാമെദ് ഉപസർഗം ഇവിടെ ഹാമൂലിൽനിന്നുള്ള കുലോത്ഭവം സൂചിപ്പിക്കുന്നു.
- source_word: הֶחָמוּלִי
  choice: ഹാമൂല്യരുടെ
  rationale: ഹാമൂലിന്റെ വംശജനായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-കണക്കെടുപ്പ് ശൈലി. എബ്രായത്തിലെ സമാന്തര ഘടനയും കുലോത്ഭവബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തി; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനമോ സഭാപാരമ്പര്യ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
