  to: 'പെരെസിന്റെ പുത്രന്മാർ ഇവരായിരുന്നു: ഹെസ്രോനിൽനിന്ന് ഹെസ്രോന്യരുടെ കുലം; ഹാമൂലിൽനിന്ന് ഹാമൂല്യരുടെ കുലം.'
