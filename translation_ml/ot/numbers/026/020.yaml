- from: 'യെഹൂദയുടെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾപ്രകാരം ഇവരായിരുന്നു: ശേലായിൽനിന്ന് ശേലായ്യരുടെ കുലം; പേരെസിൽനിന്ന് പേരെസ്യരുടെ കുലം; സേരഹിൽനിന്ന് സേരഹ്യരുടെ കുലം.'
  to: 'യെഹൂദയുടെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾ അനുസരിച്ച് ഇവരായിരുന്നു: ശേലായിൽനിന്ന് ശേലാന്യരുടെ കുലം; പേരെസിൽനിന്ന് പേരെസ്യരുടെ കുലം; സേരഹിൽനിന്ന് സേരഹ്യരുടെ കുലം.'
  rationale: 'The revision corrects the Shelah-derived clan name to reflect the Hebrew gentilic and makes the classification phrase more idiomatic. No footnote is required: the Hebrew text presents no material ambiguity here, and the literal genealogical wording is adequately represented in the verse.'
