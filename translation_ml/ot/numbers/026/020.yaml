id: NUM.26.20
reference: Numbers 26:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: ml
  text: 'യെഹൂദയുടെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾ അനുസരിച്ച് ഇവരായിരുന്നു: ശേലായിൽനിന്ന് ശേലാന്യരുടെ കുലം; പേരെസിൽനിന്ന് പേരെസ്യരുടെ കുലം; സേരഹിൽനിന്ന് സേരഹ്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ഇവരായിരുന്നു
  rationale: ജനസംഖ്യാലേഖനത്തിലെ പട്ടിക അവതരിപ്പിക്കുന്ന ലളിതമായ അസ്തിത്വസൂചക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: בְנֵי יְהוּדָה
  choice: യെഹൂദയുടെ പുത്രന്മാർ
  rationale: ‘പുത്രന്മാർ’ എന്ന മൂലപദത്തിന്റെ പുരുഷവംശീയ രൂപം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് യെഹൂദയുടെ പുരുഷവംശജരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: മִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനകത്തെ വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലം’ അനുയോജ്യം; לְ എന്നതിന്റെ വർഗീകരണാർഥം ‘പ്രകാരം’ വ്യക്തമാക്കുന്നു.
- source_word: לְשֵׁלָה
  choice: ശേലായിൽനിന്ന്
  rationale: ആ പേരുള്ള പൂർവികനിൽനിന്നുള്ള വംശോത്ഭവം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: ശേലായ്യരുടെ കുലം
  rationale: ഹീബ്രായയിലെ പൂർവികനാമത്തിൽനിന്നു രൂപപ്പെട്ട വംശനാമവും ‘കുലം’ എന്ന ഘടകവും നിലനിർത്തുന്നു.
- source_word: לְפֶרֶץ / מִשְׁפַּחַת הַפַּרְצִי
  choice: പേരെസിൽനിന്ന് പേരെസ്യരുടെ കുലം
  rationale: ഹീബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന ‘പേരെസ്’ എന്ന രൂപവും അതിൽനിന്നുള്ള കുലനാമവും സമാന്തരമായി നൽകുന്നു.
- source_word: לְזֶרַח / מִשְׁפַּחַת הַזַּרְחִי
  choice: സേരഹിൽനിന്ന് സേരഹ്യരുടെ കുലം
  rationale: ഹീബ്രായ നാമവും അതിൽനിന്നു രൂപപ്പെട്ട വംശനാമവും മലയാളത്തിൽ വായിക്കാവുന്ന രീതിയിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഹീബ്രായ പട്ടികയുടെ ആവർത്തനഘടനയും പുരുഷവംശീയ ഭാഷയും നിലനിർത്തിയപ്പോൾ, ബന്ധം വ്യക്തമാക്കാൻ ‘യിൽനിന്ന്’ ഉപയോഗിച്ചു. ആവശ്യമായ യഥാർത്ഥ പാഠവ്യത്യാസമോ അർത്ഥസന്ദിഗ്ധതയോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
