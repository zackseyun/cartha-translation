  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: ml
  text: അമ്രാമിന്റെ ഭാര്യയുടെ പേര്, ഈജിപ്തിൽ ലേവിക്കു ജനിച്ച ലേവിയുടെ മകളായ[a] യോഖേബെദ്[b] എന്നായിരുന്നു. അവൾ അമ്രാമിന് അഹരോനെയും മോശെയെയും അവരുടെ സഹോദരിയായ മിര്യാമിനെയും പ്രസവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ലേവിയുടെ മകൾ.” വംശാവലിസന്ദർഭങ്ങളിൽ “മകൾ” എന്ന പദം ചിലപ്പോൾ ഒരു സ്ത്രീസന്തതിയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഈജിപ്തിൽ അവളെ ലേവിക്കു പ്രസവിച്ചവൾ.” ഇവിടെ പ്രസവിച്ച സ്ത്രീയെ ഹീബ്രായം പേരെടുത്തുപറയുന്നില്ല.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: അമ്രാമിന്റെ ഭാര്യയുടെ പേര്
  rationale: ഹീബ്രായ സംയുക്തബന്ധം സ്വാഭാവികമായ മലയാള ഉടമസ്ഥഘടനയിൽ നൽകി; തുടക്കത്തിലെ വാവ് മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: יוֹכֶבֶד
  choice: യോഖേബെദ്
  rationale: ഹീബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: בַּת לֵוִי
  choice: ലേവിയുടെ മകൾ
  rationale: കാലക്രമപ്രശ്നം പരിഹരിക്കാൻ ‘വംശജ’ എന്നു വ്യാഖ്യാനിക്കാതെ ഹീബ്രായത്തിലെ നേരിട്ടുള്ള ബന്ധപദം നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: ഈജിപ്തിൽവെച്ച് അവളുടെ അമ്മ അവളെ ലേവിക്കു പ്രസവിച്ചു
  rationale: ഹീബ്രായത്തിൽ പ്രസവിച്ച സ്ത്രീയുടെ പേര് പറയുന്നില്ലെങ്കിലും 3-ാം പുരുഷ ഏകവചന സ്ത്രീലിംഗ ക്രിയ കർത്താവായ അമ്മയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യാകരണപരമായ വ്യക്തതയ്ക്കായി ‘അവളുടെ അമ്മ’ എന്നു നൽകി, അത് മൂലത്തിൽ പരോക്ഷമാണെന്ന് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: അവൾ അമ്രാമിന് ... പ്രസവിച്ചു
  rationale: לְ എന്ന ബന്ധസൂചകവും പ്രസവക്രിയയും മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: അഹരോനെയും മോശെയെയും അവരുടെ സഹോദരിയായ മിര്യാമിനെയും
  rationale: പേരുകളുടെ ക്രമവും ‘അവരുടെ സഹോദരി’ എന്ന അനുബന്ധവിവരണവും കാത്ത് മലയാളത്തിലെ കർമവിഭക്തിയിൽ സ്വാഭാവികമാക്കി.
theological_decisions:
- issue: ‘ലേവിയുടെ മകൾ’ എന്നതിന്റെ വംശാവലിപരമായ വ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘ലേവിയുടെ മകൾ’ എന്നു നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ലേവിയുടെ ഒരു സ്ത്രീസന്തതി’ അല്ലെങ്കിൽ ‘ലേവിയുടെ വംശജ’
  rationale: മൂലവാചകത്തിലെ ബന്ധപദം കാലക്രമമോ വംശാവലിയോ ഒത്തുതീർക്കാനായി പരാവർത്തനം ചെയ്യാതെ, അതിന്റെ സാധ്യതാപരമായ വിശാല പ്രയോഗം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
- issue: יָלְדָה എന്ന ക്രിയയുടെ പ്രസ്താവിക്കാത്ത കർത്താവ്
  choice: മലയാളത്തിൽ ‘അവളുടെ അമ്മ’ എന്നു വ്യക്തമാക്കി, ഇത് ഹീബ്രായത്തിൽ പരോക്ഷമാണെന്ന് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘അവൾ ഈജിപ്തിൽ ലേവിക്കു ജനിച്ചു’ എന്ന കർമണിപ്രയോഗം
  rationale: മൂലത്തിലെ സ്ത്രീലിംഗ കർത്തൃക്രിയയുടെ രൂപം മലയാളത്തിൽ കഴിയുന്നത്ര പ്രതിഫലിപ്പിക്കുമ്പോഴും, പ്രസവിച്ച സ്ത്രീയുടെ വ്യക്തിത്വം വാചകം വ്യക്തമാക്കുന്നില്ലെന്ന അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ‘പ്രസവിച്ചു’ എന്ന നേരിട്ടുള്ള പദം ആവർത്തിച്ചാലും മൂലവാചകത്തിന്റെ ബന്ധഘടനയും ദൈവശാസ്ത്രപരമായി പ്രസക്തമായ വംശാവലി അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
