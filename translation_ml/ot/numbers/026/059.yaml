  terminology: “യോഖേബെദ്,” “അമ്രാം,” “ലേവി,” “അഹരോൻ,” “മോശെ,” and “മിര്യാം” are consistent Malayalam biblical name forms. “മകൾ” appropriately retains the source’s direct genealogical term; the note appropriately records its possible broader genealogical sense.
