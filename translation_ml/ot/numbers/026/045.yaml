  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ കണക്കെടുപ്പ്-വംശാവലി ശൈലി. എബ്രായത്തിലെ സമാന്തര ഘടനയും ‘പൂർവികനിൽനിന്ന്—കുലം’ എന്ന ബന്ധവും വ്യക്തമായി നിലനിർത്തി.
