  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י בְרִיעָ֔ה לְ/חֶ֕בֶר מִשְׁפַּ֖חַת הַֽ/חֶבְרִ֑י לְ/מַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַ/מַּלְכִּיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: ml
  text: 'ബെരീയാവിന്റെ പുത്രന്മാർ: ഹേബെരിൽനിന്ന് ഹേബെര്യരുടെ കുലം; മൽക്കീയേലിൽനിന്ന് മൽക്കീയേല്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי בְרִיעָה
  choice: ബെരീയാവിന്റെ പുത്രന്മാർ
  rationale: ആവർത്തിക്കുന്ന വംശാവലി ഘടന നിലനിർത്താൻ בְנֵי എന്നത് ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി; ഇവിടെ לִ എന്ന ഉപസർഗത്തിന്റെ പട്ടികാപരമായ പ്രവർത്തനം മലയാളത്തിലെ തലക്കെട്ടുസദൃശ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: בְרִיעָה
  choice: ബെരീയാവ്
  rationale: വ്യക്തിനാമം എബ്രായ ഉച്ചാരണത്തെ പിന്തുടർന്ന് മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; വിഭക്തിക്ക് അനുയോജ്യമായി ‘ബെരീയാവിന്റെ’ എന്ന രൂപം ഉപയോഗിച്ചു.
- source_word: לְ/חֶבֶר
  choice: ഹേബെരിൽനിന്ന്
  rationale: കുലപൂർവികനിൽനിന്നുള്ള വംശോത്ഭവം സൂചിപ്പിക്കുന്ന കണക്കെടുപ്പ് സൂത്രവാക്യമായതിനാൽ לְ എന്നത് ‘ൽനിന്ന്’ എന്നു നൽകി.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത ഉപവിഭാഗത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സാധാരണ കുടുംബത്തെക്കാൾ വ്യാപകമായ ഈ ഘടകത്തിന് ‘കുലം’ യോജിക്കുന്നു.
- source_word: הַֽ/חֶבְרִי
  choice: ഹേബെര്യർ
  rationale: ഹേബെരിൽനിന്ന് ഉത്ഭവിച്ച ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പിതൃനാമവിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമമായി നൽകി.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: മൽക്കീയേലിൽനിന്ന്
  rationale: ഹേബെരിനെക്കുറിച്ചുള്ള സമാന്തര പ്രയോഗംപോലെ, ലְ വംശോത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ ‘ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: മൽക്കീയേല്യർ
  rationale: മൽക്കീയേലിന്റെ വംശജരായ കുലത്തെ സൂചിപ്പിക്കുന്ന പിതൃനാമരൂപം മലയാളത്തിലെ സ്വാഭാവിക സമൂഹനാമമായി നൽകി.
