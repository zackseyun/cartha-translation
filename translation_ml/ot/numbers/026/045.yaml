  source_fidelity: 'എബ്രായത്തിലെ കണക്കെടുപ്പ്-വംശാവലി സൂത്രഘടന കൃത്യമായി പ്രതിഫലിക്കുന്നു: ബെരീയാവിന്റെ പുത്രന്മാരെ തലക്കെട്ടായി അവതരിപ്പിക്കുകയും, ഹേബെരിൽനിന്നും മൽക്കീയേലിൽനിന്നും വരുന്ന കുലശാഖകളെ സമാന്തരമായി രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു. לְ എന്ന ഉപസർഗത്തിന്റെ വംശോത്ഭവാർഥം ‘-ിൽനിന്ന്’ വഴി യോജ്യമായി നൽകിയിരിക്കുന്നു.'
  naturalness: '‘ബെരീയാവിന്റെ പുത്രന്മാർ: …’ എന്ന സംക്ഷിപ്ത പട്ടികാരൂപം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും വംശാവലി-രജിസ്റ്ററിന് യോജിച്ചതുമാണ്. ‘ഹേബെര്യരുടെ കുലം’ / ‘മൽക്കീയേല്യരുടെ കുലം’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും ഈ ജനസംഖ്യാ-വംശാവലി സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.'
  terminology: מִשְׁפָּחָהയ്ക്ക് ‘കുലം’ ഉചിതമാണ്; ഇത് ഗോത്രത്തിനകത്തെ ബന്ധുത്വാധിഷ്ഠിത ഉപവിഭാഗം വ്യക്തമാക്കുന്നു. വ്യക്തിനാമങ്ങളായ ബെരീയാവ്, ഹേബെർ, മൽക്കീയേൽ എന്നിവയും അവയിൽനിന്നുള്ള സമൂഹനാമങ്ങളും സ്ഥിരതയോടെയും യോജ്യമായും ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
