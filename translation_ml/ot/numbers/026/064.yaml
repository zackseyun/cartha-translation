  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: ml
  text: എന്നാൽ[a] ഇവരിൽ, സീനായ് മരുഭൂമിയിൽ ഇസ്രായേൽമക്കളെ[b] എണ്ണിയ മോശയും പുരോഹിതനായ അഹരോനും എണ്ണിത്തിട്ടപ്പെടുത്തിയവരിൽപ്പെട്ട ഒരു പുരുഷനും ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇവരിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ സംയോജകപദം സാധാരണയായി ‘ഉം/അയും’ എന്ന അർഥം നൽകാമെങ്കിലും ഇവിടെ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ’; ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത കുടുംബനാമമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: എന്നാൽ ഇവരിൽ
  rationale: വാവിന് ഇവിടെ മുൻവാക്യത്തോടുള്ള വൈരുധ്യബന്ധം ഉള്ളതിനാൽ ‘എന്നാൽ’ എന്നും, בְּ എന്ന ഉപസർഗത്തിന്റെ ഉൾപ്പെടൽസൂചനയ്ക്കായി ‘ഇവരിൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: לֹא הָיָה אִישׁ
  choice: ഒരാൾപോലും ഉണ്ടായിരുന്നില്ല
  rationale: ഒരൊറ്റ വ്യക്തിപോലും ഉണ്ടായിരുന്നില്ലെന്ന ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מִפְּקוּדֵי
  choice: എണ്ണിത്തിട്ടപ്പെടുത്തിയവരിൽപ്പെട്ട
  rationale: മുൻ കണക്കെടുപ്പിൽ ഉൾപ്പെട്ട വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരു അമൂർത്തമായ ജനസംഖ്യാകണക്കിനെയല്ല.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എബ്രായപാഠത്തിൽ ‘പുരോഹിതൻ’ എന്നേ ഉള്ളൂ; ‘മഹാപുരോഹിതൻ’ എന്ന് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: എണ്ണിയ
  rationale: മോശയും അഹരോനും ചേർന്ന് നടത്തിയ കണക്കെടുപ്പിനെ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ പരമ്പരാഗത പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּמִדְבַּר סִינָי
  choice: സീനായ് മരുഭൂമിയിൽ
  rationale: സ്ഥലബന്ധം വ്യക്തവും മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: אִישׁ, בְּנֵי יִשְׂרָאֵל എന്നിവയിലെ ലിംഗ-കുടുംബഭാഷ
  choice: אִישׁ എന്ന ഏകവചനത്തിന്റെ ഊന്നൽ ‘ഒരാൾപോലും’ എന്നതിലൂടെ നിലനിർത്തുകയും בְּנֵי יִשְׂרָאֵל എന്നത് ‘ഇസ്രായേൽമക്കൾ’ എന്നു നൽകുകയും ചെയ്തു.
  alternative: ‘ഒരു പുരുഷനും’; ‘ഇസ്രായേല്യർ’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽജനം’
  rationale: സന്ദർഭം മുൻ കണക്കെടുപ്പിൽ ഉൾപ്പെട്ട പുരുഷതലമുറയെക്കുറിച്ചാണെങ്കിലും, മലയാളത്തിലെ ‘ഒരാൾപോലും’ നിഷേധത്തിന്റെ വ്യക്തിഗത ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബപരമായ വിശേഷണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എണ്ണിത്തിട്ടപ്പെടുത്തിയവർ’ മുൻ ജനസംഖ്യാകണക്കിൽ ഔദ്യോഗികമായി ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; ‘മഹാപുരോഹിതൻ’ പോലുള്ള മൂലപാഠത്തിലില്ലാത്ത പദവി ചേർത്തിട്ടില്ല.
