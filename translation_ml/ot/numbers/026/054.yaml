translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവകാശഭൂമി’ ഭൂവിഹിതത്തിന്റെ നിയമപരവും പാരമ്പര്യപരവുമായ സ്വഭാവം നിലനിർത്തുന്നു. എബ്രായത്തിലെ കൂട്ടത്തെ ഏകവചനമായി കാണുന്ന പ്രയോഗം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘വിഭാഗം’ എന്നു നൽകിയിരിക്കുന്നു.
