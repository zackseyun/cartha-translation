  variant: modern standard Malayalam
source:
  edition: WLC
  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: ml
  text: ജനസംഖ്യ കൂടുതലുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി വർധിപ്പിച്ചു നൽകണം; ജനസംഖ്യ കുറവുള്ള വിഭാഗത്തിന് അതിന്റെ അവകാശഭൂമി കുറച്ചു നൽകണം. ഓരോരുത്തന്റെയും അവകാശഭൂമി[a] അവനു എണ്ണപ്പെട്ടവരുടെ എണ്ണത്തിനനുസരിച്ച്[b] നൽകപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ഓരോരുത്തൻ’ എന്ന അർഥത്തിലുള്ള പുരുഷലിംഗ ഏകവചനം വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് ഓരോ ഗോത്രവിഭാഗത്തിന്റെയും ഭൂവിഹിതത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവനു എണ്ണപ്പെട്ടവർക്കനുസരിച്ച്’ അഥവാ ‘അവന്റെ എണ്ണപ്പെട്ടവർക്കനുസരിച്ച്.’ സംക്ഷിപ്തമായ എബ്രായപ്രയോഗം ഭൂവിഹിതത്തെ ജനഗണനയിൽ എണ്ണപ്പെട്ടവരുടെ എണ്ണവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: കൂടുതൽ ആളുകളുള്ള വിഭാഗത്തിന്
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ רַב ഒരു വലിയ ജനസംഖ്യയുള്ള ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘കൂടുതൽ ആളുകളുള്ള വിഭാഗം’ എന്നത് താരതമ്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: תַּרְבֶּה
  choice: വർധിപ്പിക്കണം
  rationale: רבה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കൂടുതലാക്കുക’ എന്നാണ്; ഇവിടെ അവകാശമായി ലഭിക്കുന്ന ഭൂമിയുടെ അളവ് വർധിപ്പിക്കുന്നതാണ് ആശയം.
- source_word: נַחֲלָתוֹ
  choice: അതിന്റെ അവകാശഭൂമി
  rationale: נַחֲלָה ഇവിടെ നിയമപരമായി വിഹിതം ലഭിക്കുന്ന ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നു. ‘അവകാശഭൂമി’ പാരമ്പര്യാവകാശവും ഭൂവിഹിതവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ഏകവചന പ്രത്യയം കൂട്ടത്തെ ഏകകമായി കാണിക്കുന്നു.
- source_word: וְלַמְעַט
  choice: കുറച്ച് ആളുകളുള്ള വിഭാഗത്തിന്
  rationale: מְעַט ഇവിടെ കുറഞ്ഞ ജനസംഖ്യയുള്ള വിഭാഗത്തെ താരതമ്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: תַּמְעִיט
  choice: കുറയ്ക്കണം
  rationale: מעט എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിന് ‘കുറവാക്കുക’ എന്നാണ് അർഥം; ഭൂവിഹിതം കുറയ്ക്കുന്നതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ
  choice: ഓരോ വിഭാഗത്തിനും
  rationale: പുരുഷലിംഗ ഏകവചനമായ אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. സന്ദർഭത്തിൽ ഓരോ ജനഗണനാ വിഭാഗത്തിന്റെയും ഭൂവിഹിതമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘ഓരോ വിഭാഗത്തിനും’ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: לְפִי
  choice: എണ്ണത്തിനനുസരിച്ച്
  rationale: לְפִי എന്ന പ്രയോഗം ‘അനുസരിച്ച്’ അഥവാ ‘ആനുപാതികമായി’ എന്നാണ്; എണ്ണത്തിന്റെ അടിസ്ഥാനത്തിലുള്ള വിഹിതം ഇവിടെ വ്യക്തമാകുന്നു.
- source_word: פְקֻדָיו
  choice: അതിൽ എണ്ണപ്പെട്ടവരുടെ എണ്ണം
  rationale: פקד-ൽനിന്നുള്ള ഈ രൂപം ജനഗണനയിൽ എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ എണ്ണം ആവർത്തിച്ചു പറയുന്നത് ഭൂവിഹിതവും ജനസംഖ്യയും തമ്മിലുള്ള ആനുപാതിക ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: יֻתַּן
  choice: നൽകണം
  rationale: נתן എന്നതിന്റെ നിഷ്ക്രിയരൂപം ‘നൽകപ്പെടണം’ എന്നാണ്. മലയാളത്തിലെ ബാധ്യതാസൂചകമായ ‘നൽകണം’ കല്പനയുടെ സ്വാഭാവികത നിലനിർത്തുന്നു.
