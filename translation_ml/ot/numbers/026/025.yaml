id: NUM.26.25
reference: Numbers 26:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת יִשָּׂשכָ֖ר לִ/פְקֻדֵי/הֶ֑ם אַרְבָּעָ֧ה וְ/שִׁשִּׁ֛ים אֶ֖לֶף וּ/שְׁלֹ֥שׁ מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: ml
  text: യിസ്സാഖാരിന്റെ കുലങ്ങൾ ഇവയാണ്. അവരിൽ എണ്ണപ്പെട്ടവർ[a] അറുപത്തിനാലായിരത്തി മുന്നൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ എണ്ണമനുസരിച്ച്” അല്ലെങ്കിൽ “അവരുടെ രജിസ്റ്റർപ്രകാരം.” കുലങ്ങളിൽനിന്ന് ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ടവരെയാണ് എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: ക്രിയയില്ലാത്ത എബ്രായ സംഗ്രഹവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ ബഹുവചന നിർദേശരൂപമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִשְׁפְּחֹת
  choice: കുലങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ വിപുലമായ ബന്ധുസമൂഹങ്ങളെയാണ് ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ ഈ ഘടന വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള രൂപം ഇവിടെ ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നു. ‘അവരിൽ’ എന്നത് കുലങ്ങളിൽനിന്ന് എണ്ണപ്പെട്ടവർ എന്ന ബന്ധം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് മറ്റു സാധ്യമായ വ്യാഖ്യാനങ്ങൾ അറിയിക്കുന്നു.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: അറുപത്തിനാലായിരത്തി മുന്നൂറുപേർ
  rationale: 64,300 എന്ന സംഖ്യ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ നൽകുന്നു; ആളുകളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കാൻ ‘പേർ’ ചേർക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ജനസംഖ്യാകണക്കിന്റെ ഗോത്രപരമായ പശ്ചാത്തലം സൂക്ഷിക്കാൻ ‘കുലങ്ങൾ’ ഉപയോഗിച്ചു; സംക്ഷിപ്തമായ എബ്രായ സംഗ്രഹശൈലിയും നിലനിർത്തി.
