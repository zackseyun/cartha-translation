id: NUM.26.57
reference: Numbers 26:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: ml
  text: 'കുലങ്ങൾപ്രകാരം എണ്ണപ്പെട്ട ലേവ്യർ ഇവരായിരുന്നു: ഗേർശോനിൽനിന്ന് ഗേർശോന്യരുടെ കുലം; കെഹാത്തിൽനിന്ന് കെഹാത്യരുടെ കുലം; മെരാരിയിൽനിന്ന് മെരാര്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെടുത്തി എണ്ണിയ വ്യക്തികളെയാണ് ഈ രൂപം സൂചിപ്പിക്കുന്നത്; എണ്ണൽ എന്ന അമൂർത്ത പ്രവൃത്തിയെയല്ല. ‘എണ്ണപ്പെട്ടവർ’ ആ വ്യക്തിവാചക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הַלֵּוִי
  choice: ലേവ്യരിൽ
  rationale: ഇവിടെ ഏകവചനരൂപം ലേവിയുടെ ഗോത്രത്തെ സൂചിപ്പിക്കുന്ന സമാഹാരനാമമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ എണ്ണപ്പെട്ട വ്യക്തികളെ പരിചയപ്പെടുത്താൻ ‘ലേവ്യരിൽ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാകണക്കിന്റെയും ഗോത്രഘടനയുടെയും പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തേക്കാൾ വിശാലമായ കുലവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: ഗേർശോനിൽനിന്ന് / കെഹാത്തിൽനിന്ന് / മെരാരിയിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന לְ ഇവിടെ വംശപരമായ ബന്ധം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘—യിൽനിന്ന്’ ആ ഉത്ഭവബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / הַקְּהָתִי / הַמְּרָרִי
  choice: ഗേർശോന്യരുടെ കുലം / കെഹാത്യരുടെ കുലം / മെരാര്യരുടെ കുലം
  rationale: ജാതിവാചക രൂപങ്ങൾ ഓരോ പൂർവികനിൽനിന്നും വന്ന വംശീയ കുലസംഘങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാള ബഹുവചനബന്ധരൂപം ആ കൂട്ടായ അർഥം നിലനിർത്തുന്നു.
- source_word: וְאֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: മുൻപുള്ള ജനസംഖ്യാകണക്കുമായി ബന്ധമുള്ള പട്ടികയെ സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ഇവർ’ വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ഗോത്രജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ ‘കുടുംബം’ എന്നതിനു പകരം കൂടുതൽ കൃത്യമായ ‘കുലം’ തിരഞ്ഞെടുത്തു; പേരുകളുടെ ആവർത്തനപട്ടിക അർധവിരാമങ്ങളാൽ വ്യക്തമായി വേർതിരിച്ചു.
