  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: ml
  text: ഭൂമി[a] തന്റെ വായ് തുറന്ന് അവരെയും കോരഹിനെയും വിഴുങ്ങി[c]; ആ കൂട്ടം മരിച്ചപ്പോൾ, തീ ഇരുനൂറ്റമ്പത് പുരുഷന്മാരെ ദഹിപ്പിച്ചപ്പോൾ, അവർ ഒരു അടയാളമായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘നിലം തന്റെ വായ് തുറന്നു.’
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിലെ נֵס എന്ന പദത്തിന് ‘അടയാളം,’ ‘സൂചന,’ അല്ലെങ്കിൽ ‘കൊടി’ എന്നർഥമാകാം. ഈ ന്യായവിധിസന്ദർഭത്തിൽ അതിന് മുന്നറിയിപ്പിന്റെ പ്രവർത്തനവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'എബ്രായം: ‘അവരെയും കോരഹിനെയും.’ ഈ വാക്യം ന്യായവിധിയെ അങ്ങനെതന്നെ പ്രസ്താവിക്കുന്നു; സംഭവത്തിന്റെ വിശാലമായ വിവരണത്തിന് സംഖ്യ 16 കാണുക.'
    reason: cross_reference
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: ഭൂമി തന്റെ വായ് തുറന്ന്
  rationale: אֶרֶץ എന്നതിന് ‘ഭൂമി’ എന്നും ‘ദേശം/നിലം’ എന്നും അർഥമാകാം. ഇവിടെ നിലം പിളർന്ന് തുറക്കുന്ന ദൃശ്യമായതിനാൽ ‘ഭൂമി’ സ്വാഭാവികമാണ്; ‘വായ്’ നിലനിർത്തുന്നത് എബ്രായത്തിലെ സജീവമായ മാനവീകരണം സംരക്ഷിക്കുന്നു.
- source_word: וַתִּבְלַע
  choice: വിഴുങ്ങി
  rationale: בלע എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘വിഴുങ്ങുക’ ദൃശ്യരൂപം കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തുന്നു.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: അവരെയും കോരഹിനെയും
  rationale: എബ്രായവാക്യം ‘അവരെയും കോരഹിനെയും’ വ്യക്തമായി യോജിപ്പിക്കുന്നു. സംഖ്യ 16-ലെ വിവരണവുമായി വ്യാഖ്യാനപരമായി സമന്വയിപ്പിക്കാതെ ഈ വാക്യത്തിന്റെ വാക്യഘടന അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: בְּמוֹת הָעֵדָה
  choice: ആ കൂട്ടം മരിച്ചപ്പോൾ
  rationale: בְּ + ക്രിയാനാമരൂപം കാലസൂചന നൽകുന്നതിനാൽ ‘മരിച്ചപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി. ഈ സന്ദർഭത്തിൽ עֵדָה ഒരു നിർദിഷ്ട കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘കൂട്ടം’ തിരഞ്ഞെടുത്തു.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: തീ … ദഹിപ്പിച്ചപ്പോൾ
  rationale: אכל അക്ഷരാർഥത്തിൽ ‘തിന്നുക’ ആണെങ്കിലും തീ കർത്താവാകുമ്പോൾ മലയാളത്തിൽ ‘ദഹിപ്പിക്കുക’ സ്വാഭാവികവും അർഥസമവുമായ പ്രയോഗമാണ്; בְּ കാലബന്ധം ‘ചെയ്തപ്പോൾ’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: ഇരുനൂറ്റമ്പത് പുരുഷന്മാർ
  rationale: എബ്രായത്തിലെ സംഖ്യയും איש എന്ന ലിംഗനിർദിഷ്ട പദവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: וַיִּהְיוּ לְנֵס
  choice: അവർ ഒരു മുന്നറിയിപ്പടയാളമായിത്തീർന്നു
  rationale: נֵס എന്നതിന് അടയാളം, സൂചന, കൊടി തുടങ്ങിയ അർഥങ്ങളുണ്ട്. ന്യായവിധിയുടെ ഈ പശ്ചാത്തലത്തിൽ അതിന്റെ മുന്നറിയിപ്പുനൽകുന്ന പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അടിസ്ഥാനമായ ‘അടയാളം’ എന്ന അർഥവും പദത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘അവർ ഒരു അടയാളമായിത്തീർന്നു’ എന്നതിലെ ബഹുവചന കർത്താവിന്റെ സൂചന
  choice: ‘അവർ’ എന്ന ബഹുവചനം നിലനിർത്തി; ആരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് ചുരുക്കി നിർണയിച്ചില്ല.
  alternative: ഇരുനൂറ്റമ്പത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുക; അല്ലെങ്കിൽ കോരഹും മുഴുവൻ കൂട്ടവും ഉൾപ്പെടുന്ന സംഭവത്തെ വ്യക്തമായി പറയുക.
  rationale: എബ്രായത്തിലെ ബഹുവചനത്തിന് ഒന്നിലധികം സാധ്യതയുള്ള മുൻഗാമികളുണ്ട്. അതിനാൽ വിവർത്തനം ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: വിഴുങ്ങപ്പെട്ടവരോടുള്ള കോരഹിന്റെ ബന്ധം
  choice: ഈ വാക്യത്തിലെ ‘അവരെയും കോരഹിനെയും’ എന്ന ഏകോപനം അതേപടി നിലനിർത്തി.
  alternative: സംഖ്യ 16-ലെ വിശാലവിവരണത്തെ അടിസ്ഥാനമാക്കി കോരഹിനെ വിഴുങ്ങപ്പെട്ടവരിൽനിന്ന് വേർതിരിച്ച് വ്യാഖ്യാനിക്കുക.
  rationale: തൽക്ഷണ എബ്രായവാക്യത്തിന്റെ വാക്യഘടനയ്ക്ക് മുൻഗണന നൽകി; മറ്റു വാക്യങ്ങളിൽനിന്നുള്ള സമന്വയം മൗനമായി ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തന്റെ വായ്’, ‘വിഴുങ്ങി’ എന്നീ ദൃശ്യപ്രയോഗങ്ങൾ മൂലത്തിലെ ശക്തമായ രൂപകം സംരക്ഷിക്കുന്നു. ആവർത്തിച്ച ‘…പ്പോൾ’ ഘടന എബ്രായത്തിലെ രണ്ടു കാലസൂചക ഘടകങ്ങളെയും വേർതിരിച്ചറിയാൻ സഹായിക്കുന്നു.
