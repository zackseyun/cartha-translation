source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: ml
  text: 'ഗാദിന്റെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾപ്രകാരം: സെഫോനിൽനിന്നുള്ള സെഫോനീയരുടെ കുലം[a]; ഹഗ്ഗിയിൽനിന്നുള്ള ഹഗ്ഗീയരുടെ കുലം; ശൂനിയിൽനിന്നുള്ള ശൂനീയരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഇംഗ്ലീഷ് പാരമ്പര്യങ്ങളിൽ ഇവിടെ ‘സിഫോൻ’ എന്നും കുലനാമം ‘സിഫോനീയർ’ എന്നും കാണുന്നു (ഉല്പത്തി 46:16 താരതമ്യം ചെയ്യുക). എന്നാൽ ഈ വാക്യത്തിലെ മസോരറ്റിക് പാഠം צפון (സെഫോൻ) എന്നു വായിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘സെഫോൻ’ നിലനിർത്തിയിരിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: ഗാദിന്റെ പുത്രന്മാർ
  rationale: ഗോത്രപിതാവിൽനിന്നുള്ള വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന എബ്രായ വംശാവലി പ്രയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിന്റെയും വംശാവലിയുടെയും സന്ദർഭത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: לִצְפוֹן
  choice: സെഫോനിൽനിന്ന്
  rationale: ഇവിടെയുള്ള לְ വംശപരമ്പരയെയോ ഉത്ഭവരേഖയെയോ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-ൽനിന്ന്’ എന്നത് അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: സെഫോന്യരുടെ കുലം
  rationale: സെഫോൻ എന്ന പൂർവികനിൽനിന്നുള്ള കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന ജനവിഭാഗനാമം മലയാളത്തിൽ സ്വാഭാവികമായി രൂപപ്പെടുത്തുന്നു.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: ഹഗ്ഗിയിൽനിന്ന് ഹഗ്ഗ്യരുടെ കുലം
  rationale: ആവർത്തിക്കുന്ന വംശാവലി ഘടനയും പൂർവികൻ–കുലം ബന്ധവും നിലനിർത്തുന്നു.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: ശൂനിയിൽനിന്ന് ശൂന്യരുടെ കുലം
  rationale: മൂലപാഠത്തിലെ സമാന്തര പട്ടികാഘടന മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
