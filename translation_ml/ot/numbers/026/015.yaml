translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പട്ടികാശൈലി. ‘കുടുംബം’ എന്നതിനു പകരം ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗം വ്യക്തമാക്കാൻ ‘കുലം’ ഉപയോഗിച്ചു; പേരുകൾ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
