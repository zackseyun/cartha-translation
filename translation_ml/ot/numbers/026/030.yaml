source:
  edition: WLC
  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: ml
  text: 'ഗിലെയാദിന്റെ പുത്രന്മാർ ഇവർ: ഈയേസെരിൽനിന്ന് ഈയേസെര്യരുടെ കുലം; ഹേലെക്കിൽനിന്ന് ഹേലെക്ക്യരുടെ കുലം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഗിലെയാദിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന് ഉടൻ ജനിച്ച പുത്രന്മാർ മാത്രമല്ല, പുരുഷവംശത്തിലെ പിൻതലമുറക്കാരെയോ അതിലെ കുലങ്ങളെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: ഹീബ്രു നിർദേശകസർവനാമം കാലസൂചനയില്ലാത്തതാണ്; പട്ടിക അവതരിപ്പിക്കുന്ന മലയാളപ്രയോഗത്തിൽ ‘ഇവർ’ സ്വാഭാവികമാണ്.
- source_word: בְּנֵי גִלְעָד
  choice: ഗിലെയാദിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിയുടെ ഔപചാരിക ഭാഷ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘പുത്രന്മാർ’ അടുത്ത തലമുറയിലെ മക്കളെ മാത്രം അല്ല, പുരുഷവംശീയ പിൻതലമുറക്കാരെയോ കുലശാഖകളെയോ സൂചിപ്പിക്കാം.
- source_word: אִיעֶזֶר
  choice: ഈയേസെർ
  rationale: പേരിന്റെ ഹീബ്രു രൂപം അർഥപരിഭാഷ ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: സംഖ്യ 26-ലെ ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘കുലം’ കൃത്യമാണ്.
- source_word: הָאִיעֶזְרִי
  choice: ഈയേസെര്യർ
  rationale: ഈയേസെരിൽനിന്നുള്ള കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിസ്ബ/ജാതിനാമരൂപം സ്വാഭാവികമായ മലയാള ബഹുവചനത്തിൽ നൽകി.
- source_word: לְחֵלֶק
  choice: ഹേലെക്കിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന ജനസംഖ്യാകണക്കു സൂത്രത്തിൽ לְ അടുത്ത കുലസ്ഥാപകനെയും അവനിൽനിന്നുള്ള ശാഖയെയും അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധം വ്യക്തമായി നൽകാൻ ‘-ൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: הַחֶלְקִי
  choice: ഹേലെക്ക്യർ
  rationale: ഹേലെക്കിൽനിന്നുള്ള കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന രൂപം മലയാളത്തിലെ സ്വാഭാവിക കുലനാമരീതിയിൽ നൽകി.
theological_decisions:
- issue: ‘ഗിലെയാദിന്റെ പുത്രന്മാർ’ എന്നതിന്റെ വംശാവലിപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ഔപചാരികമായ ‘പുത്രന്മാർ’ നിലനിർത്തി; അടിക്കുറിപ്പിൽ വിശാലമായ അർഥം വ്യക്തമാക്കി.
  alternative: ‘ഗിലെയാദിന്റെ പിൻതലമുറക്കാർ’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: בְּנֵי എന്ന മൂലരൂപത്തിന്റെ ഔപചാരികതയും അതിലുള്ള യഥാർഥ അർഥവ്യാപ്തിയും ഒരുപോലെ സംരക്ഷിക്കുന്നു; ഉടൻ ജനിച്ച പുത്രന്മാർ മാത്രമാണെന്ന് തെറ്റായി പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ജനസംഖ്യാകണക്കു-വംശാവലി ശൈലി. പേരുകൾ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകി; ഗോത്രത്തിനുള്ളിലെ subdivision-ന് സ്ഥിരമായി ‘കുലം’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
