    rationale: The term is traditional church-Bible language and is not wrong, but ‘പറഞ്ഞു’ better meets the requested modern-standard register without reducing the formal sense of the Hebrew speech formula.
  - severity: low
    issue: Footnote wording about traditional renderings
    rationale: Calling both ‘കർത്താവ്’ and ‘യഹോവ’ ‘പരമ്പരാഗത പകരവായനകൾ’ obscures that the former is a translation/title substitution while the latter is a conventional vocalized form. Clarifying this improves precision.
