source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: יהוה (YHWH). ഇതിന്റെ യഥാർഥ സ്വരീകരണം ഉറപ്പില്ല; ‘യഹ്‌വെ’ ഒരു പുനർനിർമിത ഉച്ചാരണരൂപമാണ്. പരമ്പരാഗതമായി ഇത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുകയോ ‘യഹോവ’ എന്നു ലിപ്യന്തരം ചെയ്യുകയോ ചെയ്യുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായ മൂലരൂപം, ഉച്ചാരണത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം, പരമ്പരാഗത പരിഭാഷയും ലിപ്യന്തരണവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വയ്യക്ഷോൽ രൂപം ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി; ദൈവത്തിന്റെ ഔപചാരിക പ്രസംഗസൂത്രത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളമായി ‘അരുളിച്ചെയ്തു’ തെരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി പദത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണമായി നൽകി.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖപാത്രത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയം സ്വാഭാവിക മലയാളത്തിൽ ‘-യോടു’ എന്നു നൽകി; מֹשֶׁה എന്ന പേര് പതിവ് മലയാളരൂപമായ ‘മോശ’ ആയി നൽകി.
- source_word: לֵאמֹר
  choice: ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: തുടർന്നുവരുന്ന വചനത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രസംഗസൂത്രം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; വേറിട്ട് ‘ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർത്താൽ ശൈലി ഭാരമേറും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് മൂലരൂപത്തെ കൂടുതൽ സുതാര്യമായി നിലനിർത്തുന്നു; സ്വരീകരണം പുനർനിർമിച്ചതാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിലവാരമലയാളം. പ്രസംഗസൂത്രം പദാനുപദമായി ഭാരപ്പെടുത്താതെ, ദ്വിബിന്ദുവിലൂടെ അടുത്ത വചനത്തിലേക്കുള്ള ബന്ധം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തോട് ചേർത്തിരിക്കുന്നു.
