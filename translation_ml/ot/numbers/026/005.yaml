  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേൻ[a]: രൂബേന്റെ പുത്രന്മാർ: ഹാനോക്കിൽനിന്ന് ഹാനോക്ക്യരുടെ കുലം; പല്ലൂവിൽനിന്ന് പല്ലൂവ്യരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി, “രൂബേന്റെ പുത്രന്മാർ: ഹാനോക്ക്, ഹാനോക്ക്യരുടെ കുലം; പല്ലൂവിൽനിന്ന് പല്ലൂവ്യരുടെ കുലം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആദ്യജാതനായ
  rationale: രൂബേന് ഇസ്രായേലിനോടുള്ള കുടുംബബന്ധവും ആദ്യജാതപദവിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘പുത്രൻ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർക്കുന്നില്ല.
- source_word: בְּנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിലെ ആൺസന്തതികളെയും കുലസ്ഥാപകരെയും സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗത്തെ ഔപചാരികമായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: חֲנוֹךְ
  choice: ഹാനോക്ക്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത ഉപവിഭാഗമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘കുലം’ പ്രസക്തമാണ്.
- source_word: הַחֲנֹכִי
  choice: ഹാനോക്ക്യകുലം
  rationale: ഹാനോക്കിൽനിന്നുള്ള വംശീയ ഉപവിഭാഗത്തെ വ്യക്തവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְפַלּוּא
  choice: പല്ലൂവിൽനിന്ന്
  rationale: പട്ടികയിൽ לְ കുലസ്ഥാപകനിൽനിന്നുള്ള വംശബന്ധം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-യിൽനിന്ന്’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַפַּלֻּאִי
  choice: പല്ലൂവ്യകുലം
  rationale: പല്ലൂവിൽനിന്നുള്ള കുലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വംശനാമത്തിന്റെ സ്വാഭാവിക മലയാള രൂപം.
