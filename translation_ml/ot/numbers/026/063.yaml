  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: ml
  text: മോശെയും പുരോഹിതനായ എലെയാസാരും മോവാബ് സമതലങ്ങളിൽ, യെരീഹോവിന് എതിർവശത്തുള്ള യോർദ്ദാനരികെ, ഇസ്രായേൽപുത്രന്മാരെ എണ്ണിയപ്പോൾ എണ്ണപ്പെട്ടവർ ഇവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെരീഹോവിന് എതിർവശത്തുള്ള യോർദ്ദാനരികെ’ എന്നത് ‘യെരീഹോയ്ക്കടുത്തുള്ള യോർദ്ദാനരികെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: עַל יַרְדֵּן יְרֵחוֹ എന്ന ഭൂമിശാസ്ത്രപ്രയോഗത്തിലെ ബന്ധസൂചകത്തിന്റെ സാധ്യമായ വ്യത്യസ്ത നിഗമനം സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ പקד എന്ന ധാതുവിന്റെ കർമണാർഥം വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ എന്നത് വ്യക്തിപരമായ സൂചനയും തുടർന്നുള്ള ‘എണ്ണിയ’ എന്ന ധാതുപുനരാവർത്തനവും നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എബ്രായപാഠത്തിലുള്ളത് ‘പുരോഹിതൻ’ എന്നാണ്; സന്ദർഭപരമായി എലെയാസാർ മഹാപുരോഹിതപദവി വഹിച്ചിരുന്നെങ്കിലും മൂലപാഠത്തിലില്ലാത്ത ‘മഹാപുരോഹിതൻ’ എന്ന പദവി ചേർത്തിട്ടില്ല.
- source_word: פָּקְדוּ
  choice: എണ്ണിയ
  rationale: פְּקוּדֵי എന്നതിലെ അതേ പקד ധാതുവുമായുള്ള പദബന്ധം ‘എണ്ണിയ/എണ്ണപ്പെട്ടവർ’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുൽലിംഗവും വംശാവലിപരവുമായ പ്രയോഗം നിലനിർത്തുന്നു; മലയാളത്തിൽ പരമ്പരാഗതവും മനസ്സിലാക്കാവുന്നതുമായ രൂപമാണിത്.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ עַרְבוֹת എന്ന പദത്തിന് സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിന് എതിരെയുള്ള യോർദ്ദാനരികെവെച്ച്
  rationale: സ്ഥലം യോർദ്ദാനരികിലും യെരീഹോയുടെ മറുകരയിലുമാണെന്ന ഭൂമിശാസ്ത്രബന്ധം വ്യക്തമാക്കുന്നു. പദസമുച്ചയം ചുരുക്കി ‘യെരീഹോയ്ക്കടുത്ത യോർദ്ദാനരികെ’ എന്നും ഗ്രഹിക്കാവുന്നതാണ്.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗ-വംശപര പ്രയോഗം
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽമക്കൾ
  rationale: പാഠത്തിന്റെ പുൽലിംഗവും ഗോത്ര-വംശാവലി പശ്ചാത്തലവും മായ്ച്ചുകളയാതെ സംരക്ഷിച്ചു; ഈ സന്ദർഭത്തിലെ കണക്കെടുപ്പ് ഇരുപത് വയസ്സും അതിലധികവുമുള്ള പുരുഷന്മാരെക്കുറിച്ചാണ്.
- issue: എലെയാസാരിന്റെ ഔദ്യോഗിക പദവി
  choice: പുരോഹിതനായ എലെയാസാർ
  alternative: മഹാപുരോഹിതനായ എലെയാസാർ
  rationale: മൂലപാഠം הַכֹּהֵן, ‘പുരോഹിതൻ’, എന്നു മാത്രമേ പറയുന്നുള്ളൂ; സന്ദർഭത്തിൽ നിന്നുള്ള ഉയർന്ന പദവി വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘എണ്ണിയ/എണ്ണപ്പെട്ടവർ’ എന്ന ധാതുപുനരാവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി സ്ഥലസൂചന ക്രിയയ്ക്കുമുമ്പ് കൊണ്ടുവന്നു.
