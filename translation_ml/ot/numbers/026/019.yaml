  language: ml
  text: 'യെഹൂദയുടെ പുത്രന്മാർ: ഏരും ഓനാനും[a]. എന്നാൽ ഏരും ഓനാനും കനാൻദേശത്തുവെച്ചു മരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏരും ഓനാനും കനാൻദേശത്തുവെച്ചു മരിച്ചു.’ ഹീബ്രു സംയോജകത്തെ ‘ഉം/യും’ എന്നു ലളിതമായി പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ ‘എന്നാൽ’ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
