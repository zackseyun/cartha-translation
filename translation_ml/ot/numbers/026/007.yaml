    issue: ‘വംശങ്ങൾ’ is broader than the source-context sense of clans.
    rationale: מִשְׁפְּחֹת denotes kinship subdivisions within the tribe in this census list. ‘കുലങ്ങൾ’ conveys this social unit more directly in Malayalam.
  - severity: medium
    issue: The footnote’s alternative ‘സൈനികഗണനയ്ക്കായി ചേർക്കപ്പെട്ടവർ’ introduces a military-specific framing.
    rationale: Although the wider census context concerns those liable for service, פְקֻדֵיהֶם itself here means those counted/enrolled. A neutral alternative preserves the lexical ambiguity and avoids adding specificity.
