  language: ml
  text: ഇവയാണ് രൂബേന്യരുടെ കുലങ്ങൾ. അവരിൽ എണ്ണപ്പെട്ടവർ[a] നാൽപ്പത്തിമൂവായിരത്തി എഴുനൂറ്റിമുപ്പത് പേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽനിന്ന് കണക്കെടുപ്പിൽ ഉൾപ്പെടുത്തിയവർ” / “അവരുടെ എണ്ണപ്പെട്ടവർ.” ഹീബ്രു പദം കണക്കെടുപ്പിൽ എണ്ണി രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: സംഖ്യാ പുസ്തകത്തിലെ ഗോത്രപരമായ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ ഈ പദം അണുകുടുംബങ്ങളെയല്ല, ഒരു ഗോത്രത്തിനുള്ളിലെ രക്തബന്ധിത ഉപവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വംശങ്ങൾ’ ആ സാമൂഹിക ഘടകത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָרֻאוּבֵנִי
  choice: രൂബേന്യർ
  rationale: രൂബേന്റെ സന്തതികളായ ഗോത്രാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന ജാതിനാമമാണിത്; ‘രൂബേന്യർ’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: פְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ഇവിടെ കണക്കെടുപ്പിൽ എണ്ണി രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ഈ വാക്യഭാഗത്ത് ‘പുരുഷന്മാർ’ എന്ന് ആവർത്തിക്കാത്തതിനാൽ അതു മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: എണ്ണത്തിന്റെ ആകെ തുക പ്രസ്താവിക്കുന്നതിന് മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല സംയോജകപ്രയോഗം.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: നാൽപ്പത്തിമൂവായിരത്തി എഴുനൂറ്റിമുപ്പത്
  rationale: ഹീബ്രുവിലെ സംഖ്യയെ അക്കങ്ങളാക്കാതെ വാക്കുകളായി നൽകി പട്ടികയുടെ സാഹിത്യശൈലി നിലനിർത്തുന്നു.
