lexical_decisions:
- source_word: וּ/בְנֵי
  choice: എന്നാൽ ... പുത്രന്മാർ
  rationale: ו സാധാരണയായി ‘ഉം/കൂടാതെ’ എന്ന ഏകോപനാർഥം നൽകാമെങ്കിലും, മുൻസന്ദർഭത്തിലെ മരണങ്ങളിൽനിന്ന് കോരഹിന്റെ പുത്രന്മാരെ വേർതിരിക്കുന്ന വൈരുധ്യം ഇവിടെ ‘എന്നാൽ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. בְנֵי എന്ന വംശാവലി പ്രയോഗത്തിന് ‘പുത്രന്മാർ’ യോജിക്കുന്നു.
- source_word: קֹרַח
  choice: കോരഹ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: לֹא
  choice: ഇല്ല
  rationale: ഭൂതകാലക്രിയയോടൊപ്പം നിഷേധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘മരിച്ചില്ല’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: מֵתוּ
  choice: മരിച്ചു
  rationale: מות എന്ന ധാതുവിന്റെ അടിസ്ഥാനാർഥമായ ‘മരിക്കുക’ നിലനിർത്തി; സന്ദർഭത്തിൽ ലളിതമായ ഭൂതകാലരൂപമാണ് യോജിച്ചത്.
