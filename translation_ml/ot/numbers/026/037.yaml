base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: ml
  text: എഫ്രയീമിന്റെ പുത്രന്മാരുടെ വംശങ്ങൾ ഇവയാണ്; അവരിൽ എണ്ണപ്പെട്ടവർ[a] മുപ്പത്തിരണ്ടായിരത്തി അഞ്ഞൂറുപേർ. ഇവർ തങ്ങളുടെ വംശങ്ങൾപ്രകാരം യോസേഫിന്റെ പുത്രന്മാരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ രജിസ്ട്രേഷൻപ്രകാരം,’ ‘അവരുടെ എണ്ണമനുസരിച്ച്,’ അല്ലെങ്കിൽ കൂടുതൽ സ്വാഭാവികമായി ‘എണ്ണിയപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ജനസംഖ്യാകണക്കെടുപ്പിനായുള്ള രജിസ്ട്രേഷനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘വംശങ്ങൾ’ ആ സാമൂഹിക-വംശാവലി ഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: בְּנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വംശാവലിസൂത്രവാക്യം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ ‘പുത്രന്മാർ’ നേരിട്ടുള്ള മക്കളെ മാത്രമല്ല, വംശജരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവരുടെ കണക്കനുസരിച്ച്
  rationale: פקד എന്ന പദത്തിന്റെ ജനസംഖ്യാകണക്കെടുപ്പിലും രജിസ്ട്രേഷനിലുമുള്ള പ്രയോഗം വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: മുപ്പത്തിരണ്ടായിരത്തി അഞ്ഞൂറ്
  rationale: മൂലപാഠത്തിലെ കൃത്യമായ സംഖ്യ ആധുനിക മലയാളത്തിന്റെ സാധാരണ സംഖ്യാക്രമത്തിൽ നൽകുന്നു.
- source_word: בְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാർ
  rationale: എഫ്രയീമിനെയും യോസേഫിനെയും ബന്ധിപ്പിക്കുന്ന ആവർത്തിത വംശാവലിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: വംശങ്ങൾപ്രകാരം
  rationale: വാക്യത്തിന്റെ സമാപനത്തിൽ ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെ സംഗ്രഹിക്കുന്ന മൂലപാഠത്തിന്റെ സൂത്രവാക്യം ചുരുക്കമായും സ്ഥിരതയോടെയും നൽകുന്നു.
