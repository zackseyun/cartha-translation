translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ജനസംഖ്യാകണക്കെടുപ്പിന്റെ സാങ്കേതിക ഭാവം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന സ്വാഭാവികമാക്കി; വംശാവലിപരമായ ‘പുത്രന്മാർ’ എന്ന പ്രയോഗം സംരക്ഷിച്ചു.
