  edition: WLC
  text: וַ/יִּוָּלֵ֣ד לְ/אַהֲרֹ֔ן אֶת נָדָ֖ב וְ/אֶת אֲבִיה֑וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִיתָמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/060.yaml
  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: ml
  text: അഹരോന് നാദാബും അബീഹൂവും[a], എലെയാസാരും ഈഥാമാരും ജനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായഭാഷയിൽ അക്ഷരാർഥത്തിൽ, ‘അഹരോന് നാദാബും അബീഹൂവും എലെയാസാരും ഈഥാമാരും ജനിച്ചു’ എന്നാണ്; വംശാവലിസൂത്രത്തിൽ പല പേരുകളുള്ള പട്ടികയോടൊപ്പം ഏകവചനക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: ജനിച്ചു
  rationale: ילד എന്ന ക്രിയയുടെ നിഫാൽ രൂപം ഇവിടെ വംശാവലിസൂത്രത്തിൽ ജനനം സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിൽ ക്രിയ ഏകവചനമാണെങ്കിലും പിന്നാലെ പുത്രന്മാരുടെ സംയുക്തപ്പട്ടിക വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന വിധം പട്ടികയോടൊപ്പം ‘ജനിച്ചു’ ഉപയോഗിച്ചു; ‘ജനിപ്പിച്ചു’ എന്ന സകർമക പ്രയോഗം മൂലത്തിലെ കർമണഭാവം മാറ്റും.
- source_word: לְאַהֲרֹן
  choice: അഹരോന്
  rationale: לְ എന്ന ഉപസർഗം മക്കൾ ആർക്കു ജനിച്ചു എന്ന മാതാപിതൃബന്ധം അടയാളപ്പെടുത്തുന്നു. ‘അഹരോന് ... ജനിച്ചു’ എന്നത് മൂലഘടന സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; പേരുകൾ ‘-ഉം’ ഉപയോഗിച്ച് ചേർത്തു
  rationale: ആവർത്തിക്കുന്ന אֶת നേരിട്ടുള്ള കർമചിഹ്നമാണ്; അതിന് മലയാളത്തിൽ സ്വതന്ത്രമായ തുല്യപദമില്ല. പേരുകളുടെ പട്ടിക സംയോജകപ്രത്യയം ഉപയോഗിച്ച് അവതരിപ്പിച്ചു.
- source_word: נָדָב
  choice: നാദാബ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֲבִיהוּא
  choice: അബീഹൂ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אִיתָמָר
  choice: ഈഥാമാർ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
