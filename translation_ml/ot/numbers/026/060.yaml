  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വംശാവലിശൈലി. മൂലത്തിലെ ‘അഹരോന് ... ജനിച്ചു’ എന്ന ഘടന നിലനിർത്തി; ഹീബ്രുവിലെ ഏകവചനക്രിയയും സംയുക്തപ്പട്ടികയും തമ്മിലുള്ള പ്രത്യേകത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
