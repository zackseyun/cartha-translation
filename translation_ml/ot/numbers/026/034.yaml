  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֖לֶּה מִשְׁפְּחֹ֣ת מְנַשֶּׁ֑ה וּ/פְקֻ֣דֵי/הֶ֔ם שְׁנַ֧יִם וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וּ/שְׁבַ֥ע מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: ml
  text: ഇവയാണ് മനശ്ശെയുടെ വംശങ്ങൾ; അവരിൽ എണ്ണപ്പെട്ടവർ[a] അമ്പത്തിരണ്ടായിരത്തി എഴുനൂറുപേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ എണ്ണത്തിൽപ്പെട്ടവർ” അല്ലെങ്കിൽ “അവരിൽ പട്ടികയിൽ ചേർക്കപ്പെട്ടവർ.” ഹീബ്രായ ജനസംഖ്യാകണക്കിലെ പ്രയോഗം פקד എന്ന ധാതുവിന്റെ ഒരു രൂപമാണ്; എണ്ണപ്പെട്ടവരെയോ പട്ടികയിൽ ചേർക്കപ്പെട്ടവരെയോ അതു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയാണ്
  rationale: വംശപ്പട്ടികയുടെ സംഗ്രഹം പരിചയപ്പെടുത്തുന്ന ബഹുവചന സൂചകപ്രയോഗം; മലയാളത്തിൽ വർത്തമാനകാല രൂപം സ്വാഭാവികമാണ്.
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: സംഖ്യാപുസ്തകത്തിലെ ജനസംഖ്യാകണക്കിന്റെ പശ്ചാത്തലത്തിൽ ഗോത്രത്തിനുള്ളിലെ വിശാലമായ ബന്ധുഗണങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ഗാർഹിക അർഥം തോന്നാവുന്ന ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘വംശങ്ങൾ’ യോജിക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: ഹീബ്രായ വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: וּפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ ജനസംഖ്യാകണക്കിലെ നിഷ്ക്രിയാർഥം നിലനിർത്തുകയും, എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുമ്പോൾ ഈ വാക്യത്തിൽ ഹീബ്രായം വ്യക്തമാക്കാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: അമ്പത്തിരണ്ടായിരത്തി എഴുനൂറുപേർ
  rationale: ഹീബ്രായ സംഖ്യാക്രമത്തിന്റെ കൃത്യമായ ആകെ തുക സ്വാഭാവികമായ മലയാള സംഖ്യാരൂപത്തിൽ നൽകുന്നു; ആളുകളെ എണ്ണുന്നതിനാൽ ‘പേർ’ ചേർത്തിരിക്കുന്നു.
