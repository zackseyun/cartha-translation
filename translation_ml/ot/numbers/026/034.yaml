  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനസംഖ്യാകണക്കിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു.
