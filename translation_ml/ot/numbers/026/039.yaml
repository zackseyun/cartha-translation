id: NUM.26.39
reference: Numbers 26:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/שְׁפוּפָ֕ם מִשְׁפַּ֖חַת הַ/שּׁוּפָמִ֑י לְ/חוּפָ֕ם מִשְׁפַּ֖חַת הַ/חוּפָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: ml
  text: ശൂഫാമിൽനിന്ന്[a] ശൂഫാമ്യരുടെ കുലം; ഹൂഫാമിൽനിന്ന് ഹൂഫാമ്യരുടെ കുലം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രു പാഠത്തിലെ പേര് ഇവിടെ ‘ശൂഫാം’ എന്നു ലിപ്യന്തരിച്ചു. മറ്റു പാഠപാരമ്പര്യങ്ങളുടെയോ സമാന്തരപ്പട്ടികകളുടെയോ സ്വാധീനത്താൽ ചില പരിഭാഷകളിൽ ഇതിന്റെ അക്ഷരരൂപം വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: ശൂഫാമിൽനിന്ന്
  rationale: ഈ ജനസംഖ്യാകണക്കിലെ വംശാവലിപ്പട്ടികയിൽ לְ ഒരു വ്യക്തിയിൽനിന്നുള്ള കുലോത്ഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ൽനിന്ന്’ അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. പേര് ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെയാണ് ഈ ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭത്തിൽ מִשְׁפָּחָה സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘കുലം’ അനുയോജ്യമാണ്.
- source_word: הַשּׁוּפָמִי
  choice: ശൂഫാമ്യരുടെ
  rationale: നിശ്ചയാർഥകപ്രത്യയമുള്ള ഈ വംശനാമം ശൂഫാമിൽനിന്നുള്ള കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘ശൂഫാമ്യരുടെ’ എന്ന ബഹുവചനബന്ധരൂപം മലയാളത്തിൽ കൂട്ടായ അർഥം നൽകുന്നു.
- source_word: לְחוּפָם
  choice: ഹൂഫാമിൽനിന്ന്
  rationale: ആദ്യപാദത്തിലെപ്പോലെ לְ കുലോത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; പേര് ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: വാക്യത്തിലെ ആവർത്തിത ജനസംഖ്യാകണക്കു സൂത്രവാക്യത്തിൽ ഒരേ പദം സ്ഥിരമായി നിലനിർത്തി.
- source_word: הַחוּפָמִי
  choice: ഹൂഫാമ്യരുടെ
  rationale: ഹൂഫാമിൽനിന്നുള്ള കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന വംശനാമത്തിന്റെ കൂട്ടായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
