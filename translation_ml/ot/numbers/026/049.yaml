  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: ml
  text: യേസെരിൽനിന്ന് യേസെര്യരുടെ കുലം; ശില്ലേമിൽനിന്ന് ശില്ലേമ്യരുടെ കുലം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: യേസെരിൽനിന്ന്
  rationale: ജനസംഖ്യാകണക്കിലെ വംശാവലിപ്പട്ടികയിൽ לְ ഒരു കുലത്തിന്റെ പൂർവികനെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ വംശോത്ഭവബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘-ൽനിന്ന്’ ഉപയോഗിച്ചു; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ രക്തബന്ധാധിഷ്ഠിത ഉപവിഭാഗമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; ആധുനിക അണുകുടുംബം എന്ന ധാരണ ഒഴിവാക്കാൻ ‘കുടുംബം’ എന്നതിനു പകരം ‘കുലം’ തിരഞ്ഞെടുത്തു.
- source_word: הַ/יִּצְרִי
  choice: യേസെര്യകുലം
  rationale: യേസെരിൽനിന്നുള്ള വംശീയ/കുലനാമമാണിത്. മലയാളത്തിൽ അസ്വാഭാവികമായ ബഹുവചന ജനനാമത്തേക്കാൾ മൂലനാമവുമായുള്ള ബന്ധം തെളിയിക്കുന്ന ‘യേസെര്യകുലം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְ/שִׁלֵּם
  choice: ശില്ലേമിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന കണക്കെടുപ്പ് സൂത്രത്തിൽ പൂർവികനിൽനിന്നുള്ള വംശബന്ധം സൂചിപ്പിക്കുന്നതിനായി ‘-ൽനിന്ന്’ ഉപയോഗിച്ചു; പേര് ലിപ്യന്തരണം ചെയ്തു.
- source_word: הַ/שִּׁלֵּמִי
  choice: ശില്ലേമ്യകുലം
  rationale: ശില്ലേമിൽനിന്നുള്ള കുലത്തെ സൂചിപ്പിക്കുന്ന നിസ്ബരൂപം. മൂലനാമത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യമുള്ള കുലനാമമായി നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സംക്ഷിപ്തവും മാന്യവുമായ മലയാളം. എബ്രായ കണക്കെടുപ്പ് സൂത്രത്തിന്റെ സമാന്തരഘടനയും അർദ്ധവിരാമവും നിലനിർത്തി. വ്യക്തിനാമങ്ങൾ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് യേസെർ, ശില്ലേം എന്ന രൂപങ്ങളിൽ നൽകി.
