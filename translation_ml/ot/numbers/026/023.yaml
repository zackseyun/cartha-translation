  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: ml
  text: 'യിസ്സാഖാരിന്റെ പുത്രന്മാർ, അവരുടെ കുലങ്ങൾപ്രകാരം: തോലായിൽ നിന്ന് തോലായ്യരുടെ കുലം; പൂവായിൽ നിന്ന്[a] പൂന്യരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ബന്ധപ്പെട്ട ചില വാക്യങ്ങളിലും ചില പരിഭാഷകളിലും ‘പൂവാ’ എന്ന പേര് ‘പൂആ’ എന്ന് എഴുതപ്പെട്ടിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: യിസ്സാഖാരിന്റെ പുത്രന്മാർ
  rationale: വംശാവലി-ജനസംഖ്യാകണക്കിന്റെ ശൈലിയിൽ בְּנֵי എന്നതിന്റെ ഔപചാരിക ഘടന നിലനിർത്തുന്നു; ഇവിടെ പുത്രന്മാരിലൂടെ വന്ന വംശജരെയും കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്രത്തിനുള്ളിലെ ഉപവിഭാഗങ്ങളെയാണ് מִשְׁפָּחָה ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ പൊതുവായ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
- source_word: תּוֹלָע
  choice: തോലാ
  rationale: ഇത് വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: തോലായ്യരുടെ കുലം
  rationale: הַתּוֹלָעִי തോലായിൽനിന്നുള്ള വംശകുലത്തെ സൂചിപ്പിക്കുന്ന നിസ്ബരൂപമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമരൂപം ഉപയോഗിച്ചു.
- source_word: לְפֻוָה
  choice: പൂവായിൽനിന്ന്
  rationale: പട്ടികയിലെ לְ ഓരോ കുലപൂർവികനെയും പരിചയപ്പെടുത്തുന്നു; ഈ വാക്യത്തിലെ פֻוָה എന്ന രൂപം ‘പൂവാ’ എന്ന ലിപ്യന്തരണത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: പൂന്യരുടെ കുലം
  rationale: הַפּוּנִי പൂവായിൽനിന്നുള്ള വംശകുലത്തിന്റെ നാമമാണ്; ഉറവിടത്തിലെ വ്യത്യസ്ത വ്യഞ്ജനരൂപം മലയാളത്തിലും ‘പൂന്യർ’ എന്നു നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ജനസംഖ്യാകണക്ക്-പട്ടികാശൈലി. ആവർത്തനഘടനയും കുലപൂർവികൻ–കുലം ബന്ധവും വ്യക്തമായി നിലനിർത്തി.
