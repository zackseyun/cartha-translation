id: NUM.26.9
reference: Numbers 26:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: ml
  text: 'എലിയാബിന്റെ പുത്രന്മാർ: നെമൂവേൽ, ദാഥാൻ, അബീരാം. ഇവരാണ് സഭയിലെ വിളിക്കപ്പെട്ടവരായ ആ ദാഥാനും അബീരാമും. കോരഹിന്റെ കൂട്ടത്തിൽ അവർ മോശെയ്ക്കും അഹരോനും എതിരായി കലഹിച്ചു; യഹ്‌വേയ്ക്ക് എതിരായി അവർ കലഹിച്ചപ്പോൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: എലിയാബിന്റെ പുത്രന്മാർ
  rationale: വംശാവലിപ്പട്ടികയിൽ בנים വ്യക്തമായി പേരെടുത്ത പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: ഇവരാണ് ... ആ ദാഥാനും അബീരാമും
  rationale: ഏകവചനരൂപത്തിലുള്ള הוּא ഇവിടെ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന പുനരാരംഭപ്രയോഗമാണ്; രണ്ട് വ്യക്തികളെ ഉദ്ദേശിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനം ഉപയോഗിക്കുകയും ‘ആ’ എന്നതിലൂടെ തിരിച്ചറിയൽ ഊന്നൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: קרואי הָעֵדָה
  choice: സഭയിലെ വിളിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ കൃദന്തരൂപമായ ‘വിളിക്കപ്പെട്ടവർ’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. ഇത് സഭ വിളിച്ചുകൂട്ടിയവരെയോ സഭയിൽ അംഗീകരിക്കപ്പെട്ട പ്രമുഖരെയോ സൂചിപ്പിക്കാം; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: കലഹിച്ചു / കലഹിച്ചപ്പോൾ
  rationale: രണ്ടിടത്തുമുള്ള נצה എന്ന ഒരേ ധാതുവിന്റെ എതിർപ്പും സംഘർഷവും സൂചിപ്പിക്കുന്ന അർഥം ‘കലഹിക്കുക’ എന്ന പദത്തിലൂടെ സ്ഥിരമായി നിലനിർത്തി; בְּ ചേർന്ന infinitive construct കാലസാഹചര്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: בַּעֲדַת קֹרַח
  choice: കോരഹിന്റെ സംഘത്തിൽവെച്ച്
  rationale: ഇവിടെ עֵדָה ഇസ്രായേൽസഭയെക്കാൾ കോരഹുമായി ബന്ധപ്പെട്ട കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സംഘം’ എന്നു നൽകി; ‘-ത്തിൽവെച്ച്’ സംഭവത്തിന്റെ പശ്ചാത്തലവും ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ഉച്ചാരണസഹായകമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിക്കാനും ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേര് പകരാതിരിക്കാനും ‘യഹ്‌വേ’ ഉപയോഗിച്ചു.
- issue: קרואי העדה എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: സഭയിലെ വിളിക്കപ്പെട്ടവർ
  alternative: സഭയിലെ തിരഞ്ഞെടുക്കപ്പെട്ട പുരുഷന്മാർ
  rationale: മൂലത്തിലെ ‘വിളിക്കപ്പെട്ട’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഔദ്യോഗികമായി തിരഞ്ഞെടുത്തവരോ അംഗീകരിക്കപ്പെട്ട പ്രതിനിധികളോ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പേരുകൾ ഹീബ്രു രൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു. ആവർത്തിക്കുന്ന ഹീബ്രു ധാതുവിന് ‘കലഹിക്കുക’ എന്ന ഒരേ മലയാളപദം ഉപയോഗിച്ചു; ദീർഘമായ ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
