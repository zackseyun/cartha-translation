  to: 'എലിയാബിന്റെ പുത്രന്മാർ: നെമൂവേൽ, ദാഥാൻ, അബീരാം. ഇവരാണ് സഭയിലെ വിളിക്കപ്പെട്ടവരായ ആ ദാഥാനും അബീരാമും. കോരഹിന്റെ കൂട്ടത്തിൽ അവർ മോശെയ്ക്കും അഹരോനും എതിരായി കലഹിച്ചു; യഹ്‌വേയ്ക്ക് എതിരായി അവർ കലഹിച്ചപ്പോൾ.'
