source:
  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: ml
  text: 'സെബൂലൂന്റെ പുത്രന്മാർ, അവരുടെ വംശങ്ങൾപ്രകാരം: സേരെദിൽനിന്ന് സാർദി വംശം; ഏലോനിൽനിന്ന് ഏലോനി വംശം; യഹ്ലേലിൽനിന്ന് യഹ്ലേലി വംശം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാർ
  rationale: ‘പുത്രന്മാർ’ എന്ന എബ്രായ വംശാവലി പ്രയോഗം നിലനിർത്തുന്നു; ഈ ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭത്തിൽ അത് സെബൂലൂന്റെ ഗോത്രപരമായ പിൻതലമുറക്കാരെ സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; לְ എന്നതിന്റെ വിഭജനാർഥം ‘പ്രകാരം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְסֶרֶד
  choice: സേരെദിൽനിന്ന്
  rationale: പട്ടികയിലെ לְ വംശത്തിന്റെ പൂർവികനെയോ ഉറവിടത്തെയോ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ൽനിന്ന്’ വംശോത്ഭവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: സാർദിവംശം
  rationale: സേരെദിൽനിന്നുള്ള കുലനാമത്തിന്റെ എബ്രായ വിശേഷണരൂപമായ סַּרְדִּי-യെ ശബ്ദരൂപത്തോട് ചേർന്ന് ‘സാർദി’ എന്നു നൽകുന്നു.
- source_word: לְאֵלֹן / מִשְׁפַּחַת הָאֵלֹנִי
  choice: ഏലോനിൽനിന്ന് ഏലോനിവംശം
  rationale: വ്യക്തിനാമവും അതിൽനിന്നുള്ള കുലനാമവും ആവർത്തനഘടനയോടെ നിലനിർത്തുന്നു.
- source_word: לְיַחְלְאֵל / מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: യഹ്ലെയേലിൽനിന്ന് യഹ്ലെയേലിവംശം
  rationale: ഹീബ്രു നാമത്തിലെ ഘടകങ്ങളും അതിൽനിന്നുണ്ടായ കുലനാമവും പരമാവധി തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. ജനസംഖ്യാകണക്കിലെ ആവർത്തനാത്മക പട്ടികാശൈലി നിലനിർത്തിയപ്പോൾ ‘കുടുംബം’ എന്നതിനെക്കാൾ വിശാലമായ ഗോത്രാന്തർഘടകത്തെ സൂചിപ്പിക്കാൻ ‘വംശം’ ഉപയോഗിച്ചു.
