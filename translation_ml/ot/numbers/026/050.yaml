  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: ml
  text: ഇവയാണ് നഫ്താലിയുടെ വംശങ്ങൾ, അവരുടെ വംശങ്ങൾ പ്രകാരം[a]. അവരിൽ കണക്കിൽപ്പെട്ടവർ[b] നാൽപ്പത്തയ്യായിരത്തി നാനൂറ് പേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ വംശങ്ങൾ അനുസരിച്ച്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരുടെ കണക്കിൽപ്പെട്ടവർ നാൽപ്പത്തയ്യായിരത്തി നാനൂറ് പേർ ആയിരുന്നു.”
