translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പട്ടികാശൈലി സ്വീകരിച്ചു. ആവർത്തനാത്മകമായ എബ്രായ ജനസംഖ്യാ-വംശാവലി ഘടന നിലനിർത്തിക്കൊണ്ട്, വംശബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘യിൽനിന്ന്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘അഹീരാം’ എന്ന പേരിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
