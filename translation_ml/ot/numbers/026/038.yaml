id: NUM.26.38
reference: Numbers 26:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാർ, അവരുടെ കുലങ്ങൾപ്രകാരം: ബേലയിൽനിന്ന് ബേലായരുടെ കുലം; അശ്ബേലിൽനിന്ന് അശ്ബേല്യരുടെ കുലം; അഹീരാമിൽനിന്ന്[a] അഹീരാമ്യരുടെ കുലം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മസോററ്റിക് എബ്രായ പാഠത്തിൽ പേര് ‘അഹീരാം’ എന്നാണ്; ചില പാഠപാരമ്പര്യങ്ങളിലും പരിഭാഷകളിലും ‘അഹീയാം’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാർ
  rationale: בְּנֵי എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; വംശാവലി-ജനസംഖ്യാ പട്ടികയിൽ ഇത് സന്തതികളെയും ഉൾക്കൊള്ളാമെങ്കിലും എബ്രായ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: മִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കുലങ്ങൾപ്രകാരം’ ജനസംഖ്യാ പട്ടികയുടെ സൂത്രഭാഷ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְבֶלַע
  choice: ബേലയിൽനിന്ന്
  rationale: ലാമെദ് ഉപസർഗം ഇവിടെ ഓരോ കുലത്തിന്റെയും പൂർവികനെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ വംശോത്ഭവബന്ധം വ്യക്തമാക്കാൻ ‘യിൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: ബേലായരുടെ കുലം
  rationale: הַבַּלְעִי എന്ന വംശനാമം ബേലയിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ജനവിഭാഗനാമമായി ‘ബേലായർ’ രൂപപ്പെടുത്തി.
- source_word: לְאַשְׁבֵּל
  choice: അശ്ബേലിൽനിന്ന്
  rationale: പേരിനോടു ചേർന്ന ל വംശപരമ്പരയുടെ ഉറവിടം സൂചിപ്പിക്കുന്നതിനാൽ ‘അശ്ബേലിൽനിന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: അശ്ബേല്യരുടെ കുലം
  rationale: അശ്ബേലിൽനിന്നുള്ള കുലത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ വംശനാമത്തിന് ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളരൂപം നൽകി.
- source_word: לַאֲחִירָם
  choice: അഹീരാമിൽനിന്ന്
  rationale: മസോററ്റിക് പാഠത്തിലെ אֲחִירָם എന്ന പേരിനെ ‘അഹീരാം’ എന്നു ലിപ്യന്തരിച്ചു; ל വംശോത്ഭവം സൂചിപ്പിക്കുന്നതിനാൽ ‘യിൽനിന്ന്’ ചേർത്തു.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: അഹീരാമ്യരുടെ കുലം
  rationale: അഹീരാമിന്റെ സന്തതികളായ കുലത്തെ സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിൽ ‘അഹീരാമ്യർ’ എന്നു നൽകി.
