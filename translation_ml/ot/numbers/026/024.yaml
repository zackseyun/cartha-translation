  text: לְ/יָשׁ֕וּב מִשְׁפַּ֖חַת הַ/יָּשׁוּבִ֑י לְ/שִׁמְרֹ֕ן מִשְׁפַּ֖חַת הַ/שִּׁמְרֹנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: ml
  text: യാശൂബിൽനിന്നുള്ള യാശൂബ്യരുടെ കുലം; ശിമ്രോനിൽനിന്നുള്ള ശിമ്രോന്യരുടെ കുലം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: യാശൂബിൽനിന്ന്
  rationale: ജനസംഖ്യാ പട്ടികയിലെ לְ വ്യക്തിനാമത്തോടു ചേർന്ന് ആ കുലത്തിന്റെ പൂർവികനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വംശോത്ഭവബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘-യിൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശബന്ധമുള്ള ഉപവിഭാഗത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ഈ ഭരണപരവും വംശാവലിപരവുമായ പശ്ചാത്തലത്തിൽ ‘കുലം’ യോജിക്കുന്നു.
- source_word: הַ/יָּשׁוּבִי
  choice: യാശൂബ്യരുടെ
  rationale: യാശൂബിൽനിന്ന് ഉത്ഭവിച്ച കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ സമൂഹനാമമായി നൽകി.
- source_word: לְ/שִׁמְרֹן
  choice: ശിമ്രോനിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന പട്ടികാസൂത്രത്തിൽ לְ കുലത്തിന്റെ പേരിനാധാരമായ പൂർവികനെ സൂചിപ്പിക്കുന്നു; ആദ്യ പാദത്തോടുള്ള സമാന്തരത നിലനിർത്തി.
- source_word: הַ/שִּׁמְרֹנִי
  choice: ശിമ്രോന്യരുടെ
  rationale: ശിമ്രോനിൽനിന്ന് ഉത്ഭവിച്ച കുലാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന gentilic രൂപത്തിന് സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള സമാനരൂപം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ പട്ടികയുടെ ആവർത്തനഘടനയും രണ്ട് പാദങ്ങളിലെ സമാന്തരതയും നിലനിർത്തി.
