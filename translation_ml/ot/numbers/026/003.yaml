revisions:
- from: മോശെയും പുരോഹിതനായ എലെയാസാരും യെരീഹോവിനരികെ യോർദ്ദാന്റെ തീരത്തുള്ള മോവാബ് സമതലങ്ങളിൽവെച്ച് അവരോടു സംസാരിച്ചു:[a]
  to: 'മോശെയും പുരോഹിതനായ എലെയാസാരും യെരീഹോവിനരികെ യോർദ്ദാനരികെയുള്ള മോവാബ് സമതലങ്ങളിൽവെച്ച് അവരോടു സംസാരിച്ചു:'
  rationale: “തീരത്തുള്ള” എന്ന കൂടുതൽ നിർദിഷ്ടമായ പ്രയോഗത്തിനു പകരം “യോർദ്ദാനരികെയുള്ള” ഉപയോഗിച്ചു; ഇതിലൂടെ עַל־יַרְדֵּן എന്ന പ്രയോഗത്തിന്റെ ‘യോർദ്ദാനരികെ/യോർദ്ദാനോടു ചേർന്ന്’ എന്ന വിശാലമായ സ്ഥാനാർഥം സംരക്ഷിക്കുന്നു. ലֵאמֹר അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിന് ആമുഖമായതിനാൽ ദ്വിബിന്ദു നിലനിർത്തി.
