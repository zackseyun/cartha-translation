source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֹתָ֖/ם בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: ml
  text: 'മോശെയും പുരോഹിതനായ എലെയാസാരും യെരീഹോവിനരികെ യോർദ്ദാനരികെയുള്ള മോവാബ് സമതലങ്ങളിൽവെച്ച് അവരോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ വാവ്-തുടർച്ചാരൂപം നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖമാകുന്നു. തുടർന്നുള്ള לֵאמֹר-നോട് അനാവശ്യ ആവർത്തനം വരാതിരിക്കാൻ ‘സംസാരിച്ചു’ സ്വാഭാവികവും ഔപചാരികവുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: וְאֶלְעָזָר
  choice: എലെയാസാരും
  rationale: אֶלְעָזָר എന്ന പേരിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം; മോശെയോടൊപ്പം സംയുക്ത കർത്താവായി ചേർത്തിരിക്കുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതനായ
  rationale: എലെയാസാരിന്റെ ഔദ്യോഗിക സ്ഥാനം സൂചിപ്പിക്കുന്ന നിർദിഷ്ട വിശേഷണം. മൂലത്തിൽ ഇല്ലാത്ത ‘മഹാപുരോഹിതൻ’ എന്ന പദവി ചേർത്തിട്ടില്ല.
- source_word: אֹתָם
  choice: അവരോട്
  rationale: പ്രസംഗത്തിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്ന സർവനാമം; ‘സംസാരിച്ചു’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ ‘അവരോട്’ സ്വാഭാവികമാണ്.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: മോവാബ് സമതലങ്ങളിൽവെച്ച്
  rationale: עַרְבוֹת പരന്ന പുൽമേടോ സമതലപ്രദേശമോ സൂചിപ്പിക്കുന്നു. ‘സമതലങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഭൂമിശാസ്ത്രപരമായി യോജിച്ചതുമാണ്.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: യെരീഹോവിനരികെ യോർദ്ദാന്റെ തീരത്തുള്ള
  rationale: യെരീഹോയോടുള്ള ബന്ധത്തിൽ യോർദ്ദാനരികെയുള്ള സ്ഥലം വ്യക്തമാക്കുന്നു. עַל എന്നതിന്റെ സമീപ്യതാസൂചന ‘തീരത്തുള്ള’ എന്നു നൽകിയപ്പോൾ, യെരീഹോയുമായുള്ള ബന്ധം ‘അരികെ’ എന്നു നിലനിർത്തി; ‘യെരീഹോയ്ക്ക് എതിർവശത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: לֵאמֹר
  choice: 'സംസാരിച്ചു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖം നൽകുന്ന ഹീബ്രു ഘടന മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; ‘ഇപ്രകാരം പറഞ്ഞു’ എന്ന ആവർത്തനം ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഹീബ്രുവിലെ വാക്യാന്ത്യമായ לֵאמֹר അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിക്ക് ആമുഖമായതിനാൽ മലയാളത്തിൽ ദ്വിബിന്ദുവായി സ്വാഭാവികമാക്കി.
