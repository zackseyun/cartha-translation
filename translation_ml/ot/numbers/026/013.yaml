  text: സേരഹിൽനിന്ന് സേരഹ്യരുടെ കുടുംബം; ശൗലിൽനിന്ന് ശൗല്യരുടെ കുടുംബം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: സേരഹിൽനിന്ന്
  rationale: ജനസംഖ്യാകണക്കിലെ ഈ വംശാവലിസൂത്രത്തിൽ לְ ഒരു പൂർവികനിൽനിന്നുള്ള വംശബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ൽനിന്ന്’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെയാണ് ഇവിടെ מִשְׁפָּחָה സൂചിപ്പിക്കുന്നത്. പട്ടികയുടെ സംക്ഷിപ്ത ശൈലിയിൽ ‘വംശം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: הַזַּרְחִי
  choice: സേരഹ്യരുടെ
  rationale: സേരഹിൽനിന്ന് ഉത്ഭവിച്ച കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന പിതൃനാമവിശേഷണമാണ്; മലയാളത്തിൽ ‘സേരഹ്യർ’ എന്ന സമൂഹനാമത്തിന്റെ സംബന്ധികരൂപം ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: לְ/שָׁאוּל
  choice: ശൗലിൽനിന്ന്
  rationale: ആദ്യ ഭാഗത്തേതുപോലെ לְ ശൗലിൽനിന്നുള്ള വംശബന്ധം സൂചിപ്പിക്കുന്നു; സമാന്തരഘടന നിലനിർത്താൻ ‘-ൽനിന്ന്’ ഉപയോഗിച്ചു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ആവർത്തിക്കുന്ന എബ്രായ സൂത്രത്തിന്റെ ഘടനയും അർഥവും നിലനിർത്താൻ ആദ്യ പ്രയോഗത്തോടു സമാനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: הַשָּׁאוּלִי
  choice: ശൗല്യരുടെ
  rationale: ശൗലിന്റെ സന്തതിക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന പിതൃനാമവിശേഷണത്തെ ‘ശൗല്യർ’ എന്ന സമൂഹനാമത്തിന്റെ സംബന്ധികരൂപത്തിൽ നൽകി.
