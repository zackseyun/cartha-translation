  text: And the name of Asher’s daughter was Serah[a].
translation:
  language: ml
  text: ആശേരിന്റെ മകളുടെ പേര് സെരഹ് ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁם
  choice: പേര് … എന്നായിരുന്നു
  rationale: വംശാവലിയിൽ ഒരു അധികവിവരം ചേർക്കുന്ന നാമവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. വാക്യം ഒറ്റയ്ക്കു നൽകിയിരിക്കുന്നതിനാൽ וְ എന്ന ലളിതബന്ധകത്തെ പ്രത്യേകം ‘കൂടാതെ’ എന്നു പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: בַּת
  choice: മകൾ
  rationale: ഏകവചനത്തിലെ construct രൂപം ഇവിടെ വിശാലമായ ‘സ്ത്രീസന്തതി’ എന്നതിനെക്കാൾ യഥാർഥ മകളെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: എബ്രായ വ്യക്തി/ഗോത്രനാമം മലയാളത്തിൽ പ്രചാരത്തിലുള്ളതും ഉറവിട ഉച്ചാരണത്തോട് അടുത്തതുമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: שָׂרַח
  choice: സേരഹ്
  rationale: പേരിനെ വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരണം ചെയ്യുന്നു; അവസാനത്തെ ח സൂചിപ്പിക്കാൻ ‘ഹ്’ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി ശൈലി. ഉടമസ്ഥബന്ധം ‘ആശേരിന്റെ മകൾ’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
