translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായ ജനസംഖ്യാകണക്കെടുപ്പ് സൂത്രവാക്യത്തിന്റെ ആവർത്തനവും ‘പുത്രന്മാർ’ എന്ന ലിംഗസൂചക രൂപവും നിലനിർത്തിയിട്ടുണ്ട്.
