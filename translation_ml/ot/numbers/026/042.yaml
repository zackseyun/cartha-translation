source:
  edition: WLC
  text: אֵ֤לֶּה בְנֵי דָן֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/שׁוּחָ֕ם מִשְׁפַּ֖חַת הַ/שּׁוּחָמִ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת דָּ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: ml
  text: 'ദാന്റെ പുത്രന്മാർ[a] അവരുടെ കുലങ്ങൾപ്രകാരം ഇവരായിരുന്നു: ശൂഹാമിൽനിന്ന് ശൂഹാമ്യരുടെ കുലം. ദാന്റെ കുലങ്ങൾ അവരുടെ കുലങ്ങൾപ്രകാരം ഇവയായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘ദാന്റെ പുത്രന്മാർ’; ഈ വംശാവലി-ജനസംഖ്യാകണക്കെടുപ്പ് പ്രയോഗത്തിൽ ‘പുത്രന്മാർ’ എന്നത് ഗോത്രസന്തതിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְנֵי דָן
  choice: ദാന്റെ പുത്രന്മാർ ഇവരായിരുന്നു
  rationale: בְנֵי എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടത്തെ വംശാവലി-ജനസംഖ്യാകണക്കെടുപ്പ് പ്രയോഗത്തിൽ അത് ദാന്റെ ഗോത്രസന്തതിയെയും ഉൾക്കൊള്ളാം. വിവരണസന്ദർഭത്തിന് യോജിച്ച ഭൂതകാലരൂപം ഉപയോഗിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: തങ്ങളുടെ കുലങ്ങൾപ്രകാരം
  rationale: സംഖ്യാപുസ്തകത്തിലെ ഗോത്രവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന מִשְׁפָּחָה എന്ന പദത്തിന് ‘കുലം’ സ്വാഭാവികവും കൃത്യവുമാണ്. എബ്രായത്തിലെ ആവർത്തനം രണ്ട് സ്ഥാനത്തും നിലനിർത്തി.
- source_word: לְשׁוּחָם
  choice: ശൂഹാമിൽനിന്ന്
  rationale: ഈ വംശാവലി സൂത്രവാക്യത്തിലെ לְ പൂർവികനിൽനിന്നുള്ള കുലബന്ധം സൂചിപ്പിക്കുന്നു; ‘ശൂഹാമിൽനിന്ന്’ ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: ശൂഹാമ്യരുടെ കുലം
  rationale: ശൂഹാമിൽനിന്ന് ഉത്ഭവിച്ച കൂട്ടായ കുലത്തെയാണ് gentilicial രൂപം സൂചിപ്പിക്കുന്നത്; ‘ശൂഹാമ്യർ’ എന്ന ബഹുവചന സമൂഹനാമം അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפְּחֹת דָּן
  choice: ദാന്റെ കുലങ്ങൾ
  rationale: സംഗ്രഹവാക്യത്തിലെ ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും മുമ്പത്തെ പദപ്രയോഗവുമായി ഏകീകരിക്കുകയും ചെയ്യുന്നു.
