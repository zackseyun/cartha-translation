  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വഘടകത്തെ ആധുനിക അണുകുടുംബവുമായി കലരാതിരിക്കാൻ ‘വംശവിഭാഗം’ ഉപയോഗിച്ചു; വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ തിരിച്ചറിയാവുന്ന ലിപ്യന്തരണം സ്വീകരിച്ചു.
