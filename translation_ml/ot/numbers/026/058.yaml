  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: ml
  text: 'ലേവിയുടെ വംശവിഭാഗങ്ങൾ ഇവയായിരുന്നു: ലിബ്ന്യരുടെ വംശവിഭാഗം[a], ഹെബ്രോന്യരുടെ വംശവിഭാഗം, മഹ്ല്യരുടെ വംശവിഭാഗം, മൂശ്യരുടെ വംശവിഭാഗം, കോരഹ്യരുടെ വംശവിഭാഗം. കെഹാത്ത് അമ്രാമിന്റെ പിതാവായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുടുംബങ്ങൾ’ അല്ലെങ്കിൽ ‘കുടുംബവിഭാഗങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: വംശവിഭാഗങ്ങൾ / വംശവിഭാഗം
  rationale: ഗോത്രത്തിലെ ബന്ധുത്വാധിഷ്ഠിതമായ ഉപവിഭാഗത്തെയാണ് ജനസംഖ്യാ-വംശാവലി സന്ദർഭത്തിൽ ഈ പദം സൂചിപ്പിക്കുന്നത്. ആധുനിക അണുകുടുംബമെന്ന ധാരണ ഒഴിവാക്കിക്കൊണ്ട് അർത്ഥം വ്യക്തമായി നൽകാൻ ‘വംശവിഭാഗം’ തിരഞ്ഞെടുത്തു.
- source_word: לֵוִי
  choice: ലേവി
  rationale: ഗോത്രപൂർവികന്റെ വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: ലിബ്ന്യർ / ഹെബ്രോന്യർ / മഹ്ല്യർ / മൂശ്യർ / കോരഹ്യർ
  rationale: ഈ വിശേഷണരൂപങ്ങൾ അതത് പൂർവികനോടു ബന്ധപ്പെട്ട സന്തതിസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി സമൂഹനാമം നൽകുന്ന ‘-യർ’ രൂപം ഉപയോഗിച്ചു.
- source_word: וּקְהָת
  choice: കെഹാത്ത്
  rationale: സംയോജകമായ waw മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യക്രമവും വിരാമവും തന്നെ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ നിർബന്ധിതമായ ‘കൂടാതെ’ ചേർത്തില്ല.
- source_word: הוֹלִד
  choice: ജനിപ്പിച്ചു
  rationale: വംശാവലിസൂത്രത്തിൽ ഹിഫിൽ രൂപം ‘പിതാവായി ജനിപ്പിക്കുക’ എന്ന പുരുഷവംശപരമായ അർത്ഥം വഹിക്കുന്നു. ‘ജനിപ്പിച്ചു’ സംക്ഷിപ്തവും ആധുനികവുമാണ്; ‘പിതാവായിരുന്നു’ എന്നതിനെക്കാൾ ക്രിയയുടെ കാരകഭാവം സംരക്ഷിക്കുന്നു.
- source_word: אֶת עַמְרָם
  choice: അമ്രാമിനെ
  rationale: אֶת നേരിട്ടുള്ള കർമസൂചകമാണ്; മലയാളത്തിലെ കർമവിഭക്തിയോടെ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: אֵלֶּה
  choice: ഇവയായിരുന്നു
  rationale: ഹീബ്രു വാക്യം ക്രിയാരഹിതമാണെങ്കിലും പിന്നോട്ടുനോക്കുന്ന കണക്കെടുപ്പ് സന്ദർഭത്തിൽ മലയാളത്തിൽ ഭൂതകാല സഹായി സ്വാഭാവികമാണ്.
