  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങൾ വ്യക്തമാക്കാൻ ‘കുലങ്ങൾ’ എന്നും, ജനസംഖ്യാകണക്കിന്റെ സാങ്കേതികഭാവം നിലനിർത്താൻ ‘അവരിൽ എണ്ണപ്പെട്ടവർ’ എന്നും ഉപയോഗിച്ചു.
