source:
  edition: WLC
  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת יְהוּדָ֖ה לִ/פְקֻדֵי/הֶ֑ם שִׁשָּׁ֧ה וְ/שִׁבְעִ֛ים אֶ֖לֶף וַ/חֲמֵ֥שׁ מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/022.yaml
  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: ml
  text: യെഹൂദയുടെ കുലങ്ങൾ ഇവയായിരുന്നു; അവരിൽ എണ്ണപ്പെട്ടവർ[a] എഴുപത്താറായിരത്തി അഞ്ഞൂറ് പേർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ എണ്ണമനുസരിച്ച്”; എബ്രായത്തിലെ ഈ ജനസംഖ്യാകണക്കുപ്രയോഗം രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവയായിരുന്നു
  rationale: സംഗ്രഹപ്രസ്താവന അവതരിപ്പിക്കുന്ന ബഹുവചന സൂചകസർവനാമം; ജനസംഖ്യാകണക്കിന്റെ വിവരണസന്ദർഭത്തിന് ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: מִשְׁפְּחֹת
  choice: കുലങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വാധിഷ്ഠിത വിഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ ഈ ജനസംഖ്യാകണക്കിന്റെ ഘടന കൂടുതൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദ
  rationale: പേരിന്റെയും ഗോത്രനാമത്തിന്റെയും മലയാളത്തിലെ പരിചിതമായ രൂപം.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ ജനസംഖ്യാകണക്കിലെ അർഥമായ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു; 3ാം പുരുഷ ബഹുവചന പ്രത്യയം ‘അവരിൽ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף
  choice: എഴുപത്താറായിരം
  rationale: എബ്രായ സംഖ്യാക്രമം മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിലാക്കി കൃത്യമായ മൂല്യം നിലനിർത്തുന്നു.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ്
  rationale: ആകെ സംഖ്യയുടെ അവസാനത്തെ അഞ്ഞൂറ് എന്ന ഘടകം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
