source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: ml
  text: 'ബേലയുടെ പുത്രന്മാർ അർദും നയമാനും ആയിരുന്നു: അർദിൽനിന്നുള്ള അർദികുലം; നയമാനിൽനിന്നുള്ള നയമികുലം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നയമി” എന്നത് നയമാൻ എന്ന പേരിൽനിന്ന് രൂപപ്പെട്ട ഹീബ്രു കുലനാമമാണ്; കൂടുതൽ സുതാര്യമായി “നയമാനികുലം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വംശാവലിപ്പട്ടികയുടെ തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ഹീബ്രുവിലുള്ളതിലധികമായ ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: בְנֵי
  choice: പുത്രന്മാർ
  rationale: പേരെടുത്ത പുരുഷസന്തതികളെ സൂചിപ്പിക്കുന്ന വംശാവലിസന്ദർഭത്തിൽ നേരിട്ടുള്ള തുല്യപദം.
- source_word: בֶלַע
  choice: ബേല
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: אַרְדְּ
  choice: അർദ്
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְנַעֲמָן
  choice: നയമാനും
  rationale: ഹീബ്രു വ്യക്തിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു സംയോജകവും നിലനിർത്തുന്നു.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: സംഖ്യയിലെ ജനസംഖ്യാകണക്കെടുപ്പുസന്ദർഭത്തിൽ ഗോത്രത്തിനുള്ളിലെ വംശബന്ധിത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: הָאַרְדִּי
  choice: അർദീയകുലം
  rationale: അർദിൽനിന്ന് ഉത്ഭവിച്ച കുലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ജനവിഭാഗനാമം മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְנַעֲמָן
  choice: നയമാനിൽനിന്ന്
  rationale: ഈ വംശാവലിസൂത്രത്തിൽ ל ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വംശപരമായ ഉത്ഭവം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַנַּעֲמִי
  choice: നയമീയകുലം
  rationale: നയമാനിൽനിന്നുള്ള കുലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു ജനവിഭാഗനാമത്തിന്റെ രൂപം പ്രതിഫലിപ്പിക്കുന്നു.
