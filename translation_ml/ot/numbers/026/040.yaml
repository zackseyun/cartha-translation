    rationale: The Hebrew forms are אַרְדִּי (Ardi) and נַעֲמִי (Naami), not adjectival forms corresponding to 'അർദീയ/നയമീയ.' Using അർദികുലം and നയമികുലം more faithfully preserves the distinct clan names.
