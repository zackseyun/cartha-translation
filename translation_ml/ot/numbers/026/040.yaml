translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലിശൈലി. ആവർത്തിക്കുന്ന ഹീബ്രു ഘടന സംക്ഷിപ്തമായ സമാന്തരവാക്യങ്ങളിലൂടെ നിലനിർത്തി.
