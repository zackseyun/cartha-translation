    text: ‘ഹെസ്രോനു … കർമിക്കു’ എന്നും കൂടുതൽ അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ എബ്രായ ഉപസർഗം വംശാവലി/ജനസംഖ്യാകണക്ക് സന്ദർഭത്തിൽ അവരിൽനിന്നുള്ള വംശപരമ്പരയെയോ അവരോടുള്ള വംശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
