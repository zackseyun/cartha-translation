- source_word: לְ/כַרְמִי
  choice: കർമിയിൽനിന്ന്
  rationale: ആദ്യപാദത്തോടു സമാന്തരമായി, לְ ഇവിടെ കർമിയിൽനിന്നുള്ള വംശപരമ്പരയെയോ വർഗീകരണത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ആവർത്തിക്കുന്ന ജനസംഖ്യാകണക്കുപദത്തിന് ഒരേ പരിഭാഷ നൽകി ഘടനാപരമായ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: הַ/כַּרְמִי
  choice: കർമ്യർ
  rationale: കർമിയുടെ സന്തതിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന gentilic രൂപത്തിന്റെ കൂട്ടായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
