  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: ml
  text: ഒസ്നിയിൽനിന്ന്[a] ഒസ്ന്യരുടെ കുലം; ഏരിയിൽനിന്ന്[b] ഏര്യരുടെ കുലം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒസ്നിയുടെ കുടുംബം.’ എബ്രായപാഠത്തിൽ ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്ന പദവും ഒസ്നിയിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്ന വംശനാമരൂപവും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഏരിയുടെ കുടുംബം.’ എബ്രായപാഠത്തിൽ ബന്ധുഗണത്തെ സൂചിപ്പിക്കുന്ന പദവും ഏരിയിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്ന വംശനാമരൂപവും ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: ഒസ്നിയിൽനിന്ന്
  rationale: ജനസംഖ്യാ-വംശപ്പട്ടികയിലെ לְ ഒരു പൂർവികനിൽനിന്നുള്ള വംശബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒസ്നിയിൽനിന്ന്’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ഇസ്രായേലിന്റെ ഗോത്രഘടനയ്ക്കുള്ളിലെ വിശാല ബന്ധുഗണത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘കുടുംബം’ എന്നതിനെക്കാൾ ‘വംശം’ ഈ പട്ടികാസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: הָ/אָזְנִי
  choice: ഒസ്ന്യർ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ gentilic രൂപം ഒസ്നിയുടെ സന്തതിഗണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമൂഹവാചക ബഹുവചനമായി ‘ഒസ്ന്യർ’ സ്വാഭാവികമാണ്.
- source_word: לְ/עֵרִי
  choice: ഏരിയിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന വംശാവലി സൂത്രത്തിൽ לְ പൂർവികനായ ഏരിയിൽനിന്നുള്ള ബന്ധത്തെ അടയാളപ്പെടുത്തുന്നു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ഒരേ വാക്യത്തിലെ ആവർത്തിത പട്ടികാസൂത്രം ഏകീകരിച്ച് പരിഭാഷപ്പെടുത്തി.
- source_word: הָ/עֵרִי
  choice: ഏര്യർ
  rationale: gentilic രൂപം ഏരിയുടെ സന്തതിഗണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏര്യർ’ എന്നു സമൂഹവാചക ബഹുവചനമായി പരിഭാഷപ്പെടുത്തി.
