  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: ml
  text: നറുക്കിലൂടെ മാത്രമേ ദേശം വിഭജിക്കാവൂ; അവരുടെ പിതാക്കന്മാരുടെ ഗോത്രങ്ങളുടെ പേരുകൾക്കനുസരിച്ച് അവർ അവകാശം പ്രാപിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ പൂർവികരുടെ.” എബ്രായത്തിൽ അക്ഷരാർഥം “അവരുടെ പിതാക്കന്മാരുടെ” എന്നാണ്; ഗോത്രങ്ങൾക്കുള്ളിലെ പിതൃവംശപരമായ പരമ്പരകളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ … മാത്രമേ
  rationale: אַךְ ഇവിടെ വിഭജനരീതിയെ പരിമിതപ്പെടുത്തുന്നു. ‘മാത്രമേ’ അതിന്റെ നിയന്ത്രണാർഥം വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ മുൻസന്ദർഭത്തോടുള്ള വ്യത്യാസവും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: בְּגוֹרָל
  choice: നറുക്കിലൂടെ
  rationale: גוֹרָל ഭൂമി പങ്കിടാനുള്ള തീരുമാനം നിർണയിക്കുന്ന നറുക്കിനെ സൂചിപ്പിക്കുന്നു; ഉപകരണാർഥമുള്ള בְּ മലയാളത്തിൽ ‘-ലൂടെ’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: יֵחָלֵק
  choice: വിഭജിക്കാവൂ
  rationale: חלק എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയതയും നിർദേശാത്മക ഭാവവും ഈ പ്രയോഗം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת הָאָרֶץ
  choice: ദേശം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് അവകാശമായി ലഭിക്കേണ്ട നിർദിഷ്ട ദേശമാണ്; സന്ദർഭത്തിൽ ‘ദേശം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִשְׁמוֹת
  choice: പേരുകൾക്കനുസരിച്ച്
  rationale: לִ ഇവിടെ മാനദണ്ഡമോ അവലംബമോ സൂചിപ്പിക്കുന്നു; ‘പേരുകൾക്കനുസരിച്ച്’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: מַטּוֹת
  choice: ഗോത്രങ്ങൾ
  rationale: മַטּוֹת എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടികൾ’ എന്നർഥമുണ്ടെങ്കിലും ഇവിടെ ഇസ്രായേലിന്റെ ഗോത്രവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: אֲבֹתָם
  choice: അവരുടെ പിതാക്കന്മാർ
  rationale: എബ്രായപദം വ്യക്തമായി പിതൃവംശപരമായ ‘പിതാക്കന്മാരെ’ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗനിഷ്പക്ഷമായ ‘പൂർവികർ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചില്ല.
- source_word: יִנְחָלוּ
  choice: അവർ അവകാശം പ്രാപിക്കണം
  rationale: נחל അവകാശമായി ലഭിക്കുക എന്ന അർഥത്തിലാണ്. ഇവിടെ നിർദേശാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘പ്രാപിക്കണം’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: אֲבֹתָם എന്ന പദത്തിലെ പിതൃവംശപരമായ പ്രയോഗം
  choice: അവരുടെ പിതാക്കന്മാരുടെ
  alternative: അവരുടെ പൂർവികരുടെ
  rationale: ഗോത്രാവകാശത്തിന്റെ പശ്ചാത്തലത്തിൽ എബ്രായം പിതൃവംശത്തെ വ്യക്തമായി പരാമർശിക്കുന്നു. അതിനാൽ ആ പ്രത്യേകത പ്രധാനപാഠത്തിൽ നിലനിർത്തി; വിശാലമായ പകരംവായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം അക്ഷരാനുവാദപരമായ വാക്യഘടന ഒഴിവാക്കി.
