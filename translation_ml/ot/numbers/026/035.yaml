  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വ്യക്തവുമായ മലയാളം. ഗോത്രത്തിനുള്ളിലെ clan എന്ന അർഥത്തിന് ‘കുടുംബം’ ഉപയോഗിച്ചു; പേരുകളും അവയിൽനിന്നുള്ള സമൂഹനാമങ്ങളും എബ്രായരൂപത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
