source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: ml
  text: 'എഫ്രയീമിന്റെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾ അനുസരിച്ച് ഇവരാണ്: ശൂഥേലഹിൽ നിന്നുള്ള ശൂഥേലഹ്യരുടെ കുലം; ബെഖെരിൽ നിന്നുള്ള ബെഖെര്യരുടെ കുലം; തഹനിൽ നിന്നുള്ള തഹന്യരുടെ കുലം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: പട്ടികയെ ചൂണ്ടിക്കാണിക്കുന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  rationale: בְנֵי എന്ന വംശാവലിപരമായ ഔപചാരിക പ്രയോഗം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തുന്നു; വിശാലമായ ‘സന്തതികൾ’ എന്ന അർഥസാധ്യതയിലേക്ക് വിവർത്തനം വികസിപ്പിക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുടുംബങ്ങൾപ്രകാരം
  rationale: സംഖ്യാപുസ്തകത്തിലെ ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ വംശകുടുംബവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘കുടുംബങ്ങൾപ്രകാരം’ ഈ ക്രമീകരണത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: לְשׁוּתֶלַח
  choice: ശൂഥേലഹിൽനിന്നുള്ള
  rationale: ഈ വംശാവലിസൂത്രത്തിലെ לְ ഒരു പൂർവികനിൽനിന്നുള്ള കുടുംബബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിന്നുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: ശൂഥേലഹ്യരുടെ കുടുംബം
  rationale: ജാതിവാചകരൂപം ശൂഥേലഹിൽനിന്നുള്ള വംശകുടുംബത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന സമൂഹനാമമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְבֶכֶר ... מִשְׁפַּחַת הַבַּכְרִי
  choice: ബേഖെരിൽനിന്നുള്ള ബേഖെര്യരുടെ കുടുംബം
  rationale: പൂർവികനിൽനിന്നുള്ള വംശബന്ധവും അതിൽനിന്നുണ്ടായ കുടുംബസമൂഹവും ആവർത്തനഘടനയോടെ നിലനിർത്തുന്നു.
- source_word: לְתַחַן ... מִשְׁפַּחַת הַתַּחֲנִי
  choice: തഹനിൽനിന്നുള്ള തഹന്യരുടെ കുടുംബം
  rationale: എബ്രായത്തിലെ സമാന്തര വംശാവലിഘടന മലയാളത്തിലും ഒരേ രീതിയിൽ നിലനിർത്തുന്നു.
