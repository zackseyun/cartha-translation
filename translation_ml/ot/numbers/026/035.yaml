revisions:
- from: 'എഫ്രയീമിന്റെ പുത്രന്മാർ, അവരുടെ കുടുംബങ്ങൾപ്രകാരം, ഇവരാണ്: ശൂഥേലഹിൽനിന്നുള്ള ശൂഥേലഹ്യരുടെ കുടുംബം; ബേഖെരിൽനിന്നുള്ള ബേഖെര്യരുടെ കുടുംബം; തഹനിൽനിന്നുള്ള തഹന്യരുടെ കുടുംബം.'
  to: 'എഫ്രയീമിന്റെ പുത്രന്മാർ അവരുടെ കുലങ്ങൾ അനുസരിച്ച് ഇവരാണ്: ശൂഥേലഹിൽ നിന്നുള്ള ശൂഥേലഹ്യരുടെ കുലം; ബെഖെരിൽ നിന്നുള്ള ബെഖെര്യരുടെ കുലം; തഹനിൽ നിന്നുള്ള തഹന്യരുടെ കുലം.'
  rationale: The revision uses ‘കുലം’ to represent the census-clan sense of מִשְׁפָּחָה and regularizes the list introduction. It retains the Hebrew genealogy’s explicit ancestor-to-clan pattern and its three parallel clauses. No footnotes are needed.
