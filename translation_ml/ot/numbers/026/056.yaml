  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: ml
  text: നറുക്കുപ്രകാരം[a] വലിയ കൂട്ടത്തിനും ചെറിയ കൂട്ടത്തിനും ഇടയിൽ അവന്റെ അവകാശഭൂമി വിഭജിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നറുക്കിനാൽ അവന്റെ അവകാശഭൂമി അനേകർ ഉള്ള കൂട്ടത്തിനും ചുരുക്കം പേർ ഉള്ള കൂട്ടത്തിനുമായി വീതിച്ചുനൽകണം.” ഭൂമി വിതരണം ചെയ്യുമ്പോൾ ഹീബ്രായപാഠം താരതമ്യേന വലിയ കൂട്ടത്തെയും ചെറിയ കൂട്ടത്തെയും തമ്മിൽ വേർതിരിച്ചുകാണിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: തീരുമാനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്നാണെങ്കിലും ഇവിടെ നറുക്ക് നിർണയിക്കുന്നതനുസരിച്ച് എന്ന പ്രയോഗാർഥമാണ്; മലയാളത്തിൽ ‘തീരുമാനപ്രകാരം’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַגּוֹרָל
  choice: നറുക്ക്
  rationale: ഭൂമി പങ്കിടുന്നതിനായി ഉപയോഗിക്കുന്ന lot-നെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നറുക്ക്’ നേരിട്ടും സന്ദർഭോചിതവുമായ മലയാളപദമാണ്.
- source_word: תֵּחָלֵק
  choice: വിഭജിക്കപ്പെടണം
  rationale: חלק എന്ന ധാതുവിന്റെ നിഫാൽ രൂപത്തിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു; നിർദേശാത്മകമായ ഭാവികാല അർഥം മലയാളത്തിൽ ‘-പ്പെടണം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: נַחֲלָתוֹ
  choice: അവന്റെ അവകാശഭൂമി
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം ‘അവന്റെ’ എന്നു ഔപചാരികമായി നിലനിർത്തുന്നു. ഭൂവിഭജനസന്ദർഭത്തിൽ נַחֲלָהയെ ‘അവകാശഭൂമി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: בֵּין
  choice: ഇടയിൽ
  rationale: തുടർന്നുവരുന്ന രണ്ടു താരതമ്യഗ്രൂപ്പുകൾ തമ്മിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന בֵּין എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: רַב
  choice: വലിയ കൂട്ടം
  rationale: ജനസംഖ്യയുടെ ആപേക്ഷിക വലുപ്പത്തെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘കൂട്ടം’ ചേർക്കുന്നത് മലയാളത്തിൽ നാമവൽക്കരിച്ച താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: לִמְעָט
  choice: ചെറിയ കൂട്ടം
  rationale: רַב എന്നതിനോടുള്ള ആപേക്ഷിക സംഖ്യാഭേദം വ്യക്തമാക്കുന്നു; ഹീബ്രായിലെ സംക്ഷിപ്തത മൂലം അവശേഷിക്കുന്ന ‘അനേകർ/ചുരുക്കം പേർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
