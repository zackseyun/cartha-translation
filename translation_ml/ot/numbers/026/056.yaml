    issue: ‘നറുക്കിന്റെ തീരുമാനപ്രകാരം’ is slightly interpretive.
    rationale: The Hebrew means ‘according to/by the lot’; while a lot determines the allocation, ‘decision’ is not expressed and can be omitted in Malayalam without loss.
  revised_text: നറുക്കുപ്രകാരം[a] വലിയ കൂട്ടത്തിനും ചെറിയ കൂട്ടത്തിനും ഇടയിൽ അവന്റെ അവകാശഭൂമി വിഭജിക്കപ്പെടണം.
