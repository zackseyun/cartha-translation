translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവകാശഭൂമി’ സന്ദർഭം വ്യക്തമാക്കുന്നു; ‘വലിയ കൂട്ടം/ചെറിയ കൂട്ടം’ ഹീബ്രായിലെ ആപേക്ഷിക ജനസംഖ്യാവ്യത്യാസം അമിതമായി വ്യാഖ്യാനിക്കാതെ കൈമാറുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
