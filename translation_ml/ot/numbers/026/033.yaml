language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: ml
  text: ഹേഫെരിന്റെ മകനായ സെലോഫഹാദിന് പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല[a]; പുത്രിമാർ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ. സെലോഫഹാദിന്റെ പുത്രിമാരുടെ പേരുകൾ മഹ്ലാ, നോവാ[b], ഹൊഗ്ലാ, മിൽക്കാ, തിർസാ എന്നിങ്ങനെയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവന് പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല, പുത്രിമാർ ഒഴികെ.’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ‘നോവാ’ സെലോഫഹാദിന്റെ ഒരു പുത്രിയുടെ പേരാണ്; പ്രളയവിവരണത്തിലെ നോഹയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: ഹേഫെരിന്റെ മകനായ സെലോഫഹാദ്
  rationale: വംശബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. വാക്യാരംഭത്തിലെ וְ എന്ന ബന്ധകത്തിന് ഇവിടെ പ്രത്യേകമായ കാലസൂചകപദം ചേർക്കാതെ സന്ദർഭബന്ധം നിലനിർത്തുന്നു.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘അവന് പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള പുത്രിമാരുമായുള്ള വ്യക്തമായ വൈരുധ്യം സംരക്ഷിക്കാൻ ‘മക്കൾ’ എന്ന പൊതുപദത്തിനു പകരം ‘പുത്രന്മാർ’ ഉപയോഗിക്കുന്നു.
- source_word: כִּי אִם בָּנוֹת
  choice: പുത്രിമാർ മാത്രമേ ഉണ്ടായിരുന്നുള്ളൂ
  rationale: כִּי אִם സൂചിപ്പിക്കുന്ന ഒഴിവാക്കലും വൈരുധ്യവും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: സെലോഫഹാദിന്റെ പുത്രിമാരുടെ പേരുകൾ ... എന്നിങ്ങനെയായിരുന്നു
  rationale: എബ്രായത്തിലെ ഏകവചനമായ שֵׁם ഇവിടെ കൂട്ടായ അർഥത്തിൽ വരുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: മഹ്ലാ, നോവാ, ഹൊഗ്ലാ, മിൽക്കാ, തിർസാ
  rationale: എബ്രായ വ്യക്തിനാമങ്ങളുടെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
