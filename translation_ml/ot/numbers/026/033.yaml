translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. വംശാവലിസംബന്ധമായ കൃത്യതയ്ക്കായി ‘പുത്രന്മാർ/പുത്രിമാർ’ നിലനിർത്തി; പേരുകൾ എബ്രായ ഉച്ചാരണത്തിന് സമീപമായി ലിപ്യന്തരിച്ചു.
