lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: വംശങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ കുടുംബാധിഷ്ഠിത വംശവിഭാഗങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּנֵי־גָד
  choice: ഗാദിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ വംശാവലി പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗാദിന്റെ സന്തതികളെ ഉൾക്കൊള്ളുന്നു.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവരുടെ കണക്കനുസരിച്ച്
  rationale: פקד എന്ന എണ്ണൽ/ജനസംഖ്യാ രേഖപ്പെടുത്തൽ ആശയവും מן എന്ന ഉറവിട/കൂട്ടത്തിൽനിന്നുള്ള സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: നാല്പതിനായിരത്തി അഞ്ഞൂറ്
  rationale: 40,500 എന്ന സംഖ്യയുടെ കൃത്യവും സ്വാഭാവികവുമായ മലയാളരൂപം.
