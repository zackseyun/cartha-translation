- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ആധുനിക അർഥത്തിലെ ചെറിയ ‘കുടുംബം’ എന്നതിനെക്കാൾ ഗോത്രത്തിനുള്ളിലെ ‘കുലം’ സൂചിപ്പിക്കുന്നു. לְ എന്ന ഉപസർഗം വർഗീകരണം/വിഭജനം സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രകാരം’ എന്ന് നൽകി.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: വ്യക്തി/ഗോത്രനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലെ സുപരിചിത രൂപം.
- source_word: וְאֶפְרָיִם
  choice: എഫ്രയീമും
  rationale: സംയോജകമായ וְ ഉൾപ്പെടെ വ്യക്തി/ഗോത്രനാമം സ്വാഭാവിക മലയാള ഏകോപനരൂപത്തിൽ നൽകി.
