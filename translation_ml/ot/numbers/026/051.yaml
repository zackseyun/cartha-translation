source:
  edition: WLC
  text: אֵ֗לֶּה פְּקוּדֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וָ/אָ֑לֶף שְׁבַ֥ע מֵא֖וֹת וּ/שְׁלֹשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: ml
  text: 'ഇവരാണ് ഇസ്രായേൽപുത്രന്മാരിൽ[a] എണ്ണപ്പെട്ടവർ[b]: ആറുലക്ഷത്തി ആയിരത്തി എഴുനൂറ്റിമുപ്പത് പേർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേല്യരിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കണക്കിൽ ചേർക്കപ്പെട്ടവർ”; എബ്രായപദം ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവരാണ്
  rationale: ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെട്ട വ്യക്തികളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചനപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായ വിധിവാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: פְּקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ നാമരൂപം ഇവിടെ ജനസംഖ്യാകണക്കിൽ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്നു; വെറും ആകെ സംഖ്യ എന്ന അമൂർത്ത അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളിൽ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ/മക്കൾ’ എന്ന പ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക രൂപം തിരഞ്ഞെടുത്തു.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: ആറുലക്ഷത്തി ആയിരത്തി എഴുനൂറ്റിമുപ്പത്
  rationale: എബ്രായത്തിലെ കൂട്ടിച്ചേർക്കൽക്രമം അനുസരിച്ച് 600,000 + 1,000 + 700 + 30 എന്ന ആകെ 601,730 കൃത്യമായി മലയാള സംഖ്യാവാക്കുകളിൽ നൽകി.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കളിൽ
  alternative: ഇസ്രായേല്യരിൽ; ഇസ്രായേലിന്റെ പുത്രന്മാരിൽ
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം ‘മക്കൾ’ എന്നു നിലനിർത്തുന്നു. അതേസമയം, ഇവിടെ എണ്ണപ്പെട്ടവർ സൈനിക ജനസംഖ്യാകണക്കിന്റെ പരിധിയിലുള്ള പുരുഷന്മാരാണെന്ന സന്ദർഭം ‘എണ്ണപ്പെട്ടവർ’ എന്നതിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കുന്നു.
- issue: פְּקוּדֵי എന്നതിന്റെ ജനസംഖ്യാകണക്കുസംബന്ധമായ അർഥം
  choice: എണ്ണപ്പെട്ടവർ
  alternative: കണക്കിൽ ചേർക്കപ്പെട്ടവർ; ജനസംഖ്യാകണക്കിന്റെ ആകെ എണ്ണം
  rationale: മൂലപദം അമൂർത്തമായ സംഖ്യയെക്കാൾ രജിസ്റ്റർ ചെയ്ത് എണ്ണപ്പെട്ട ആളുകളെ മുൻനിർത്തുന്നു; അതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന രൂപം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘എണ്ണപ്പെട്ടവർ’ ജനസംഖ്യാകണക്കിന്റെ വ്യക്തിനിഷ്ഠമായ അർഥം നിലനിർത്തുന്നു. സംഖ്യ വായനാസൗകര്യത്തിനായി മലയാളവാക്കുകളിൽ നൽകിയിരിക്കുന്നു; അവസാനത്തെ ‘പേർ’ ഇത് ആളുകളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കുന്നു.
