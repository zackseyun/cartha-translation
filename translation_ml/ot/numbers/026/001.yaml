id: NUM.26.1
reference: Numbers 26:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ മോശയോടും പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാരിനോടും അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തു
  rationale: വാച്യമായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, ദൈവം സംസാരിക്കുന്നതിനെ മാന്യവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്ന മലയാളപ്രയോഗമാണ് ‘അരുളിച്ചെയ്തു’. לֵאמֹר എന്ന തുടർസൂത്രത്തിന്റെ പ്രവർത്തനവും വാക്യാവസാനത്തിലെ ദ്വിബിന്ദു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് കൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה וְאֶל־אֶלְעָזָר
  choice: മോശയോടും … എലെയാസാരിനോടും
  rationale: രണ്ട് അഭിസംബോധിതരെയും ഏകോപിപ്പിക്കുന്ന എബ്രായ ഘടന മലയാളത്തിലെ ‘-ഓടും … -ഓടും’ രൂപത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ
  rationale: എബ്രായത്തിൽ ‘പുരോഹിതൻ’ എന്ന നിർദ്ദിഷ്ട വിശേഷണം അഹരോനോടാണ് ചേർന്നിരിക്കുന്നത്; അതിനാൽ എലെയാസാരിനെ പുരോഹിതനെന്ന് വിശേഷിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ഈ പദക്രമം സ്വീകരിച്ചു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രസംഗസൂത്രം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- issue: הַכֹּהֵן ആരെ വിശേഷിപ്പിക്കുന്നു എന്ന ഘടനാപരമായ സാധ്യത
  choice: പുരോഹിതനായ അഹരോൻ
  alternative: പുരോഹിതനായ എലെയാസാർ
  rationale: എബ്രായ പദക്രമത്തിൽ הַכֹּהֵן എന്നത് അടുത്തുള്ള אַהֲרֹן-നോട് അനുബന്ധിക്കുന്നതായി വായിക്കുന്നത് സ്വാഭാവികമാണ്; അതിനാൽ ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അരുളിച്ചെയ്തു’ എന്നത് ദൈവിക പ്രസംഗത്തിന് മാന്യമായെങ്കിലും അത്യന്തം പുരാതനമല്ലാത്ത ശൈലി നൽകുന്നു. നേരിട്ടുള്ള പ്രസംഗം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചു.
