source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: ml
  text: 'യഹ്‌വെ പെട്ടെന്ന് മോശെയോടും അഹരോനോടും മിര്യാമിനോടും പറഞ്ഞു: “നിങ്ങൾ മൂന്നുപേരും[a] പുറത്തേക്കു വരുവിൻ, സമാഗമകൂടാരത്തിലേക്കു.” അവർ മൂന്നുപേരും പുറത്തുവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ മൂവരും’ / ‘മൂന്നുപേരുംകൂടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: פִּתְאֹם
  choice: പെട്ടെന്ന്
  rationale: സംസാരത്തിന്റെ അപ്രതീക്ഷിതത്വവും ഉടനടിത്തവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: צְאוּ
  choice: പുറത്തുവരുവിൻ
  rationale: יצא എന്ന ക്രിയ ഇവിടെ ഒരു സ്ഥലത്തുനിന്നു പുറത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ദൈവം അവരെ സമാഗമകൂടാരത്തിലേക്കു വിളിക്കുന്നതിനാൽ ‘പുറത്തുവരുവിൻ’ സ്വാഭാവികമാണ്.
- source_word: שְׁלָשְׁתְּכֶם
  choice: നിങ്ങൾ മൂന്നുപേരും
  rationale: അഭിസംബോധന ചെയ്യപ്പെട്ട മൂവരെയും ഒരുമിച്ച് വ്യക്തമായി ഉൾപ്പെടുത്തുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ഇസ്രായേലിന്റെ ആരാധനാകൂടാരത്തെ സൂചിപ്പിക്കുന്ന ഈ സ്ഥിരപ്രയോഗത്തിന് വ്യക്തവും പരിചിതവുമായ മലയാളരൂപം.
- source_word: וַיֵּצְאוּ
  choice: പുറത്തുവന്നു
  rationale: കല്പന അനുസരിച്ച് അവർ തങ്ങളുടെ സ്ഥലത്തുനിന്ന് പുറത്തുവന്നുവെന്ന തുടർസംഭവം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: שְׁלָשְׁתָּם
  choice: അവർ മൂന്നുപേരും
  rationale: മൂവരും കല്പന അനുസരിച്ചുവെന്ന ഹീബ്രുവിലെ ആവർത്തിച്ചുള്ള ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അത് ഒരു പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈവത്തിന്റെ നേരിട്ടുള്ള കല്പനയിൽ ബഹുമാനസൂചക ബഹുവചനമായ ‘വരുവിൻ’ ഉപയോഗിച്ചു. മൂലത്തിലെ ‘മൂന്നുപേരും’ എന്ന ഇരട്ട ഊന്നൽ നിലനിർത്തി.
