id: NUM.12.2
reference: Numbers 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു[a]: “യഹോവ മോശയിലൂടെ മാത്രമേ സംസാരിച്ചിട്ടുള്ളോ? ഞങ്ങളിലൂടെയും അവൻ സംസാരിച്ചിട്ടില്ലയോ?” യഹോവ അതു കേട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യഹോവ മോശയോടു മാത്രമാണോ സംസാരിച്ചിട്ടുള്ളത്? ഞങ്ങളോടും അവൻ സംസാരിച്ചിട്ടില്ലയോ?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ ഉപസർഗം ദൈവിക സംസാരത്തിന്റെ സ്വീകർത്താവിനെയോ അതിന്റെ മാധ്യമത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭം പ്രവാചകാധികാരത്തെക്കുറിച്ചായതിനാൽ മുഖ്യപാഠത്തിൽ ‘യിലൂടെ’ എന്ന അർഥം സ്വീകരിച്ചിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: അവർ പറഞ്ഞു
  rationale: വയ്യക്ഷേപകമായ wayyiqtol രൂപം ആഖ്യാനക്രമത്തിൽ നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവർ പറഞ്ഞു’ എന്ന് നൽകി.
- source_word: הֲרַק אַךְ
  choice: മാത്രമാണോ
  rationale: ചോദ്യചിഹ്നവും ഇരട്ട നിയന്ത്രണകണങ്ങളും ചേർന്ന് ഉന്നയിക്കുന്ന ഊന്നിയ ഏകത്വവാദത്തെ മലയാളത്തിലെ ‘മാത്രമാണോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּמֹשֶׁה
  choice: മോശയിലൂടെ
  rationale: ദൈവിക വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ בְ എന്ന ഉപസർഗം സംസാരത്തിന്റെ മാധ്യമത്തെ സൂചിപ്പിക്കാം; തർക്കം പ്രവാചകാധികാരത്തെക്കുറിച്ചായതിനാൽ ‘മോശയിലൂടെ’ തിരഞ്ഞെടുത്തു.
- source_word: דִּבֶּר יְהוָה
  choice: യഹോവ … സംസാരിച്ചിട്ടുള്ളത്
  rationale: דבר ദൈവിക സംസാരത്തെ സൂചിപ്പിക്കുന്നു. പൂർണ്ണക്രിയയുടെ മുൻകാല പ്രസക്തി മലയാളത്തിലെ ‘സംസാരിച്ചിട്ടുള്ളത്’ കൊണ്ട് നിലനിർത്തി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായ ‘യഹോവ’യായി നൽകി.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: ഞങ്ങളിലൂടെയും അവൻ സംസാരിച്ചിട്ടില്ലയോ?
  rationale: ആദ്യ ഉപവാക്യത്തിലെ അതേ ഘടനയ്ക്കനുസരിച്ച് മാധ്യമാർഥം നിലനിർത്തി; הֲלֹא എന്ന പ്രതീക്ഷാഭരിതമായ പ്രതികൂലചോദ്യം ‘സംസാരിച്ചിട്ടില്ലയോ?’ എന്നു നൽകി.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: യഹോവ അതു കേട്ടു
  rationale: എബ്രായത്തിൽ കർമ്മം പ്രസക്തിയിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു; മലയാളത്തിൽ അവരുടെ വാക്കുകളെ സൂചിപ്പിക്കാൻ ‘അതു’ ചേർക്കുന്നത് സ്വാഭാവികവും അർഥവിശദവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്; അതിനെ പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ പേരായി നിലനിർത്തി.
- issue: דבר എന്ന ക്രിയയോടുകൂടിയ בְ ഉപസർഗം സ്വീകർത്താവിനെയോ മാധ്യമത്തെയോ സൂചിപ്പിക്കുന്നതാണോ
  choice: മോശയിലൂടെ / ഞങ്ങളിലൂടെ
  alternative: മോശയോട് / ഞങ്ങളോട്
  rationale: സന്ദർഭം വെറും ദൈവവചനം സ്വീകരിച്ചതിനെക്കാൾ പ്രവാചകമാധ്യമവും അധികാരവും സംബന്ധിച്ച വെല്ലുവിളിയാണ്; എങ്കിലും ഉപസർഗത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാത്രമാണോ’യും ‘സംസാരിച്ചിട്ടില്ലയോ’യും മൂലത്തിലെ ഊന്നിയ ആലങ്കാരിക ചോദ്യങ്ങളെ സ്വാഭാവികമായി പകർന്നു. ദൈവനാമം ‘യഹോവ’യായി നിലനിർത്തി; ഉപസർഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
