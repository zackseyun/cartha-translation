reference: Numbers 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: ml
  text: ഞാൻ അവനോടു വായോടു വായായി[a], വ്യക്തമായി[b] സംസാരിക്കുന്നു, കടങ്കഥകളായല്ല; അവൻ യഹ്‌വേയുടെ രൂപം[c] ദർശിക്കുന്നു. അങ്ങനെയിരിക്കെ, എന്റെ ദാസനായ മോശെയ്ക്കെതിരെ സംസാരിക്കാൻ നിങ്ങൾ ഭയപ്പെടാതിരുന്നതെന്ത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുഖാമുഖം’ എന്നും വിവർത്തനം ചെയ്യാം. എബ്രായയിൽ അക്ഷരാർഥം ‘വായോടു വായായി’ എന്നാണ്; നേരിട്ടുള്ള സംഭാഷണത്തിനാണ് ഊന്നൽ.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ദർശനത്തിൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ‘കാഴ്ച,’ ‘ദർശനം,’ ‘പ്രത്യക്ഷത’ എന്നീ അർഥങ്ങളും വരാം; ‘കടങ്കഥകളായല്ല’ എന്ന വൈരുധ്യം ‘വ്യക്തമായി’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: source_ambiguity
  - marker: c
    text: അല്ലെങ്കിൽ ‘യഹ്‌വേയുടെ സാദൃശ്യം’ അഥവാ ‘യഹ്‌വേയുടെ പ്രത്യക്ഷരൂപം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: വായോടു വായായി
  rationale: എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; ഇടനിലയില്ലാത്ത നേരിട്ടുള്ള സംഭാഷണമാണ് ഇത് ഊന്നിപ്പറയുന്നത്. സ്വാഭാവികമായ വ്യാഖ്യാനരൂപമായ ‘മുഖാമുഖം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אֲדַבֶּר בּוֹ
  choice: ഞാൻ അവനോടു ... സംസാരിക്കുന്നു
  rationale: דבר എന്ന ക്രിയയോടുകൂടിയ ב എന്ന ഉപസർഗം ഇവിടെ ഒരാളുമായി സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനോടു സംസാരിക്കുന്നു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וּמַרְאֶה
  choice: വ്യക്തമായി
  rationale: ‘കടങ്കഥകളിലൂടെയല്ല’ എന്ന തുടർവാക്യത്തോടുള്ള വൈരുധ്യം കണക്കിലെടുത്ത്, ആശയവിനിമയത്തിന്റെ വ്യക്തത സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണരൂപം സ്വീകരിച്ചു. ‘ദർശനത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְלֹא בְחִידֹת
  choice: കടങ്കഥകളിലൂടെയല്ല
  rationale: חִידוֹת എന്നത് കടങ്കഥകളെയും ദുരൂഹമായ വാക്കുകളെയും സൂചിപ്പിക്കുന്നു. ഉപാധി അർഥമുള്ള ב മലയാളത്തിൽ ‘-കളിലൂടെ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: וּתְמֻנַת יְהוָה
  choice: യഹ്‌വേയുടെ രൂപം
  rationale: תְּמוּנָה എന്നതിന്റെ മൂർത്തമായെങ്കിലും നിർവചിക്കപ്പെടാത്ത ‘രൂപം/സാദൃശ്യം/പ്രത്യക്ഷരൂപം’ എന്ന അർഥവ്യാപ്തിയിൽ ‘രൂപം’ ഏറ്റവും ചുരുക്കമായും തുറന്ന നിലയിലും നിൽക്കുന്നു.
- source_word: יַבִּיט
  choice: നോക്കിക്കാണുന്നു
  rationale: נבט എന്ന ക്രിയയുടെ ഉദ്ദേശ്യപൂർവമായ നോക്കൽ എന്ന ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: അങ്ങനെയിരിക്കെ ... നിങ്ങൾ ഭയപ്പെടാതിരുന്നതെന്ത്?
  rationale: മുമ്പുള്ള പ്രസ്താവനയിൽനിന്നുള്ള നിഗമനവും കുറ്റപ്പെടുത്തലിന്റെ ചോദ്യശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: എന്റെ ദാസനായ മോശെയ്ക്കെതിരെ സംസാരിക്കാൻ
  rationale: ആവർത്തിക്കുന്ന ב ഇവിടെ ശത്രുതാപരമായ സംസാരത്തിന്റെ ലക്ഷ്യത്തെ അടയാളപ്പെടുത്തുന്നു. ‘എന്റെ ദാസനായ മോശെ’ എന്ന സമാനാധികരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָהയുടെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: മോശെയ്ക്കു ലഭിച്ച വെളിപ്പാടിന്റെ സവിശേഷത
  choice: യഹ്‌വേയുടെ രൂപം നോക്കിക്കാണുന്നു
  alternative: യഹ്‌വേയുടെ സാദൃശ്യം കാണുന്നു; യഹ്‌വേയുടെ പ്രത്യക്ഷരൂപം കാണുന്നു
  rationale: വാക്യം ഉറപ്പിക്കുന്ന നേരിട്ടുള്ള ദൈവിക വെളിപ്പാടിനെ നിലനിർത്തുന്നു; ദൈവത്തെ കാണുന്നതിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള തത്ത്വചിന്താപരമായ വിശദീകരണം പാഠത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി സ്വീകരിച്ചു. ‘വായോടു വായായി’ എന്ന അപൂർവപ്രയോഗം മൂലപാഠത്തിന്റെ ശ്രദ്ധേയമായ രൂപകം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി; അതിന്റെ സ്വാഭാവിക വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി. ദൈവദർശനവുമായി ബന്ധപ്പെട്ട പാഠത്തിന്റെ അന്തർലീനമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തി.
