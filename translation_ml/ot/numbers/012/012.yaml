revisions:
- from: ദയവായി, അവൾ മരിച്ചവളെപ്പോലെ ആകരുതേ—അമ്മയുടെ ഗർഭപാത്രത്തിൽനിന്ന് പുറത്തുവരുമ്പോൾ ശരീരത്തിന്റെ പകുതി ദ്രവിച്ചുപോയ ഒരാളെപ്പോലെ.[a]
  to: ദയവായി, അവൾ അമ്മയുടെ ഗർഭത്തിൽനിന്ന് പുറത്തുവരുമ്പോൾ മാംസത്തിന്റെ പകുതി ക്ഷയിച്ചുപോയ മരിച്ച ഒരാളെപ്പോലെ ആകരുതേ.[a]
