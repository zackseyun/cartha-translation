source:
  edition: WLC
  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: ml
  text: ദയവായി, അവൾ അമ്മയുടെ ഗർഭത്തിൽനിന്ന് പുറത്തുവരുമ്പോൾ മാംസത്തിന്റെ പകുതി ക്ഷയിച്ചുപോയ മരിച്ച ഒരാളെപ്പോലെ ആകരുതേ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അമ്മയുടെ ഗർഭത്തിൽനിന്ന് പുറത്തുവരുമ്പോൾ മാംസത്തിന്റെ പകുതി ക്ഷയിച്ചുപോയ ഒരു ചാപിള്ളയെപ്പോലെ.” ഹീബ്രു ജനനസമയത്ത് മരിച്ച ഒരാളോടാണ് അവളെ ഉപമിക്കുന്നത്; ചില പരിഭാഷകൾ ചാപിള്ളയുടെ ചിത്രം മുഖ്യവാചകത്തിൽത്തന്നെ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: ദയവായി ... ആകരുതേ
  rationale: אַל എന്നത് നിഷേധാത്മക അഭ്യർഥനയും נָא യാചനാഭാവവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദയവായി’യും ‘ആകരുതേ’യും ചേർന്ന് അടിയന്തരമായ അപേക്ഷ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: תְהִי
  choice: അവൾ ... ആകരുതേ
  rationale: സ്ത്രീലിംഗ ഏകവചന രൂപം സന്ദർഭത്തിൽ മിര്യാമിനെ സൂചിപ്പിക്കുന്നു; നിഷേധാത്മക ആഗ്രഹം/അപേക്ഷ എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: כַּמֵּת
  choice: മരിച്ചവളെപ്പോലെ
  rationale: ഹീബ്രു പദപ്രയോഗത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘മരിച്ച ഒരാളെപ്പോലെ’ എന്ന താരതമ്യം നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ തന്നെ ‘ചാപിള്ള’ എന്നു നിർണ്ണയിക്കുന്നില്ല.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: അമ്മയുടെ ഗർഭപാത്രത്തിൽനിന്ന് പുറത്തുവരുമ്പോൾ
  rationale: കാലസൂചനയും ഗർഭത്തിൽനിന്ന് പുറത്തുവരുന്നെന്ന ഹീബ്രുവിലെ ദൃശ്യഭാവവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: ശരീരത്തിന്റെ പകുതി ദ്രവിച്ചുപോയ
  rationale: ‘മാംസത്തിന്റെ പകുതി തിന്നപ്പെട്ടിരിക്കുന്നു’ എന്ന പദശഃ രൂപം ഇവിടെ ക്ഷയം/ദ്രവിക്കൽ സൂചിപ്പിക്കുന്ന ഭീകരമായ ശാരീരിക ചിത്രം നൽകുന്നു; ‘ദ്രവിച്ചുപോയ’ ആ ചിത്രം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: സ്ത്രീലിംഗ ഏകവചനത്തിന്റെ സൂചിത വ്യക്തി
  choice: ‘അവൾ’ മിര്യാമിനെ സൂചിപ്പിക്കുന്നു
  alternative: സർവനാമത്തിന്റെ വ്യക്തമായ സൂചന ഒഴിവാക്കുക
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ അഹരോന്റെ അപേക്ഷ മിര്യാമിനെക്കുറിച്ചാണ്; ‘അവൾ’ എന്നു പറയുന്നത് വ്യാകരണപരവും സന്ദർഭോചിതവുമാണ്.
- issue: മരണസാദൃശ്യത്തിൽ ചാപിള്ളയുടെ ചിത്രം എത്രത്തോളം വ്യക്തമാക്കണം
  choice: മുഖ്യവാചകത്തിൽ ‘മരിച്ചവൾ’ എന്ന വിശാലമായ പദപ്രയോഗം നിലനിർത്തി, ചാപിള്ള എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുക
  alternative: മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘ചാപിള്ളയെപ്പോലെ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: כַּמֵּת എന്നത് സ്വതവേ ‘മരിച്ച ഒരാളെപ്പോലെ’ എന്നാണ്; തുടർന്നുള്ള പ്രസവദൃശ്യം ചാപിള്ളയെ സൂചിപ്പിക്കാമെങ്കിലും, ഹീബ്രുവിലെ യഥാർഥ വ്യാപ്തിയും അസ്പഷ്ടതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ഗൗരവമുള്ളതുമായ അപേക്ഷാഭാവം ഉപയോഗിച്ചു. ഹീബ്രുവിലെ കഠിനമായ ശാരീരിക ചിത്രം മൃദൂകരിക്കാതെ, എന്നാൽ അസ്വാഭാവികമായ പദശഃ പ്രയോഗം ഒഴിവാക്കി അവതരിപ്പിച്ചു; ‘ചാപിള്ള’ എന്ന കൂടുതൽ നിർദ്ദിഷ്ട വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
