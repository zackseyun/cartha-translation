id: NUM.12.6
reference: Numbers 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇപ്പോൾ എന്റെ വാക്കുകൾ കേൾക്കുവിൻ: നിങ്ങളിൽ ഒരു പ്രവാചകൻ ഉണ്ടെങ്കിൽ[a], യാഹ്‌വേയായ ഞാൻ ഒരു ദർശനത്തിൽ അവന് എന്നെത്തന്നെ വെളിപ്പെടുത്തും[b]; ഒരു സ്വപ്നത്തിൽ ഞാൻ അവനോടു സംസാരിക്കും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിങ്ങളിൽ ഒരാൾ പ്രവാചകനാണെങ്കിൽ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ “നിങ്ങളുടെ പ്രവാചകൻ ഉണ്ടായാൽ” എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഞാൻ എന്നെത്തന്നെ അവന് അറിയിച്ചുകൊടുക്കും.”'
    reason: lexical_alternative
  - marker: c
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “അവനിൽ/അവനോടുകൂടെ സംസാരിക്കും” എന്ന രൂപമാണ്; സന്ദർഭത്തിൽ “അവനോടു സംസാരിക്കും” എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അവൻ പറഞ്ഞു
  rationale: വർത്തമാന പ്രസംഗത്തിലേക്കു നയിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനരൂപം; മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: ഇപ്പോൾ എന്റെ വാക്കുകൾ കേൾക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞയും נָא നൽകുന്ന ഗൗരവമുള്ള ആഹ്വാനഭാവവും നിലനിർത്തുന്നു.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: നിങ്ങളിൽ ഒരു പ്രവാചകൻ ഉണ്ടെങ്കിൽ
  rationale: അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമായ ‘നിങ്ങളുടെ പ്രവാചകൻ ഉണ്ടായാൽ’ എന്ന ഘടനയുടെ സമൂഹബന്ധിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: בַּמַּרְאָה אֵלָיו אֶתְוַדָּע
  choice: ഒരു ദർശനത്തിൽ അവന് എന്നെത്തന്നെ വെളിപ്പെടുത്തും
  rationale: התודע എന്ന പ്രത്യയാത്മക രൂപത്തിലെ സ്വയം അറിയിച്ചുകൊടുക്കുന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘അറിയിച്ചുകൊള്ളും’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ തെളിമയുള്ളത്.
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: ഒരു സ്വപ്നത്തിൽ ഞാൻ അവനോടു സംസാരിക്കും
  rationale: സ്വപ്നം വെളിപ്പാടിന്റെ മാധ്യമമാണെന്ന ആശയവും דבר ב־ എന്ന ഘടനയുടെ അഭിസംബോധനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. മലയാളത്തിൽ പരിചിതവും മാന്യവുമായ ലിപ്യന്തരണം തെരഞ്ഞെടുത്തു; ഒരു സ്ഥാനപ്പേരായി മാറ്റിയില്ല.
- issue: പ്രവാചകവെളിപ്പാടിന്റെ രീതി
  choice: ദർശനത്തിൽ ദൈവം തന്നെത്തന്നെ വെളിപ്പെടുത്തുകയും സ്വപ്നത്തിൽ സംസാരിക്കുകയും ചെയ്യുന്നു
  alternative: ദർശനത്തിൽ പ്രത്യക്ഷപ്പെടുകയും സ്വപ്നത്തിലൂടെ സംസാരിക്കുകയും ചെയ്യുന്നു
  rationale: മൂലത്തിലെ אֶתְוַדָּע എന്ന സ്വയം അറിയിച്ചുകൊടുക്കൽഭാവവും ദർശനം/സ്വപ്നം എന്ന സമാന്തര മാധ്യമങ്ങളും നിലനിർത്തുന്നു; പിന്നീടുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: אֲדַבֶּר בּוֹ എന്നതിലെ ב־യുടെ ബന്ധം
  choice: അവനോടു സംസാരിക്കും
  alternative: അവനിൽ സംസാരിക്കും; അവനോടൊപ്പം സംസാരിക്കും
  rationale: എബ്രായ ഘടനയ്ക്ക് ഒന്നിലധികം അക്ഷരാർഥ സാധ്യതകളുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ അഭിസംബോധന അർഥം സ്വാഭാവികമാണ്; യഥാർഥ രൂപഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘കേൾക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞ ദൈവിക അഭിസംബോധനയുടെ ഔന്നത്യം സൂക്ഷിക്കുന്നു; ബാക്കി വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
