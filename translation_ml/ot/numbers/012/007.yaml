id: NUM.12.7
reference: Numbers 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: ml
  text: എന്റെ ദാസനായ മോശെയാകട്ടെ അങ്ങനെയല്ല; എന്റെ ഭവനത്തിലെല്ലാം[a] അവൻ വിശ്വസ്തനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ കുടുംബത്തിലെല്ലാം.” എബ്രായത്തിലെ “ഭവനം” എന്ന പദം ഒരു കെട്ടിടത്തെ മാത്രമല്ല, കുടുംബത്തെയോ അധികാരമേഖലയെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: അങ്ങനെയല്ല
  rationale: മുൻവാക്യത്തിലെ പൊതുവായ പ്രസ്താവനയിൽനിന്ന് മോശെയെ ശക്തമായി വേർതിരിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַבְדִּי
  choice: എന്റെ ദാസനായ
  rationale: ഇവിടെ עֶבֶד അടിമത്തത്തെ ഊന്നുന്നതല്ല; ദൈവത്തോടുള്ള ബന്ധത്തിൽ മോശെയുടെ ബഹുമാന്യമായ സേവകസ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘ദാസൻ’ സന്ദർഭോചിതമാണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: בְּכָל בֵּיתִי
  choice: എന്റെ ഭവനത്തിലെല്ലാം
  rationale: בַּיִת എന്ന ‘ഭവനം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും בְּכָל എന്ന സമഗ്രത പ്രകടമാക്കുകയും ചെയ്യുന്നു; ‘കുടുംബം’ അല്ലെങ്കിൽ ‘ജനത’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: נֶאֱמָן
  choice: വിശ്വസ്തനാണ്
  rationale: נֶאֱמָן എന്നത് ആശ്രയിക്കാവുന്ന വിശ്വസ്തതയെ സൂചിപ്പിക്കുന്നു; ദൈവസന്നിധിയിലെ മോശെയുടെ നിലയെക്കുറിച്ചുള്ള ഈ പ്രസ്താവനയിൽ ‘വിശ്വസ്തൻ’ യോജിക്കുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: സ്വതന്ത്ര സർവനാമം നൽകുന്ന കർത്തൃഊന്നൽ മലയാളവാക്യത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുടെ പങ്കുമായി ബന്ധപ്പെട്ട ‘എന്റെ ഭവനം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘എന്റെ ഭവനം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘എന്റെ കുടുംബത്തിലെല്ലാം’ അല്ലെങ്കിൽ ‘എന്റെ ജനത്തിനിടയിലെല്ലാം’
  rationale: എബ്രായപ്രയോഗം ദൈവത്തിന്റെ കുടുംബത്തെയോ അധികാരമേഖലയെയോ ഉടമ്പടിസമൂഹത്തെയോ സൂചിപ്പിക്കാം. എന്നാൽ പാഠം തന്നെയുള്ള ‘ഭവനം’ എന്ന രൂപകം നിലനിർത്തുന്നത് അതിന്റെ അർഥവ്യാപ്തിയും പിന്നീടുള്ള തിരുവെഴുത്തുബന്ധങ്ങളും മുൻകൂട്ടി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘മോശെയുടെ കാര്യത്തിൽ’ എന്ന പ്രയോഗം לֹא כֵן എന്ന വൈരുധ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു; ‘ഭവനം’ എന്ന തിരുവെഴുത്തുരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിച്ചു.
