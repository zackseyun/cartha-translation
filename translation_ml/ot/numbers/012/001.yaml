revisions:
- from: മോശെ സ്വീകരിച്ചിരുന്ന കൂശ്യസ്ത്രീയെച്ചൊല്ലി[a][b] മിര്യാമും അഹരോനും മോശെക്കെതിരെ സംസാരിച്ചു; എന്തെന്നാൽ, അവൻ ഒരു കൂശ്യസ്ത്രീയെ സ്വീകരിച്ചിരുന്നു.
  to: മോശെ വിവാഹം കഴിച്ചിരുന്ന കൂശ്യസ്ത്രീ നിമിത്തം[a][b] മിര്യാമും അഹരോനും മോശെയ്ക്കെതിരെ സംസാരിച്ചു; കാരണം, അവൻ ഒരു കൂശ്യസ്ത്രീയെ വിവാഹം കഴിച്ചിരുന്നു.
