reference: Numbers 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: ml
  text: മോശെ വിവാഹം കഴിച്ചിരുന്ന കൂശ്യസ്ത്രീ നിമിത്തം[a][b] മിര്യാമും അഹരോനും മോശെയ്ക്കെതിരെ സംസാരിച്ചു; കാരണം, അവൻ ഒരു കൂശ്യസ്ത്രീയെ വിവാഹം കഴിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൂശ്യസ്ത്രീ’ എന്നത് കൂശിൽ നിന്നുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു. പരമ്പരാഗതമായി ‘എത്യോപ്യക്കാരി’ എന്നും പരിഭാഷപ്പെടുത്തിയിട്ടുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘വിവാഹം കഴിച്ചിരുന്നു’ എന്നത് എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘എടുത്തിരുന്നു’ എന്ന വിവാഹസന്ദർഭത്തിലുള്ള പ്രയോഗത്തെ വിവർത്തനം ചെയ്യുന്നതാണ്; ‘ഭാര്യയായി സ്വീകരിച്ചിരുന്നു’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു. בְּמֹשֶׁה എന്ന പ്രയോഗത്തിന്റെ പ്രതികൂലഭാവം ‘മോശെക്കെതിരെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; ‘പരാതിപ്പെട്ടു’ എന്ന വ്യാഖ്യാനാത്മക അർഥം ക്രിയയിൽ ചേർക്കുന്നില്ല.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: മിര്യാമും അഹരോനും
  rationale: എബ്രായത്തിലെ പേരുകളുടെ ക്രമം നിലനിർത്തുന്നു. ക്രിയ ഏകവചന സ്ത്രീലിംഗത്തിലാണെങ്കിലും, സംയുക്ത കർത്താവിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചനമായി അവതരിപ്പിക്കുന്നു; ക്രിയാരൂപം മിര്യാമിന്റെ മുൻകൈ സൂചിപ്പിക്കാമെങ്കിലും അത് മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: בְּמֹשֶׁה
  choice: മോശെക്കെതിരെ
  rationale: דבר എന്ന ക്രിയയോടുകൂടിയ בְּ ഇവിടെ ശത്രുതാപരമായി ഒരാൾക്കെതിരെ സംസാരിക്കുന്ന അർഥം നൽകുന്നു.
- source_word: עַל אֹדוֹת
  choice: ചൊല്ലി
  rationale: സംസാരത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: കൂശ്യസ്ത്രീ
  rationale: കൂശിൽ നിന്നുള്ള സ്ത്രീ എന്ന വംശീയ-ഭൗമിക സൂചന നേരിട്ട് നിലനിർത്തുന്നു; ആധുനിക എത്യോപ്യയുമായി അനാവശ്യമായി സമീകരിക്കുന്നില്ല.
- source_word: אֲשֶׁר לָקָח / לָקָח
  choice: സ്വീകരിച്ചിരുന്ന / സ്വീകരിച്ചിരുന്നു
  rationale: לקח എന്നതിന്റെ ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന അടിസ്ഥാനരൂപവും വിവാഹസന്ദർഭത്തിലെ ‘ഭാര്യയായി സ്വീകരിക്കുക’ എന്ന പ്രയോഗാർഥവും ഒരുമിച്ച് ഉൾക്കൊള്ളാൻ കഴിയുന്ന മലയാളപ്രയോഗമാണ്. കൂടുതൽ വ്യക്തമായ ‘വിവാഹം കഴിച്ചു’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുമ്പ് പറഞ്ഞ കാരണത്തെ വിശദീകരിച്ചും ആവർത്തിച്ചും പറയുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: അവൻ ഒരു കൂശ്യസ്ത്രീയെ സ്വീകരിച്ചിരുന്നു
  rationale: എബ്രായമൂലത്തിലെ ഊന്നൽ നൽകുന്ന ആവർത്തനം മിനുക്കി നീക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയുടെ ഭാര്യയുടെ തിരിച്ചറിയലും വംശീയ വിശേഷണവും
  choice: כֻשִׁית എന്നത് ‘കൂശ്യസ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി, സിപ്പോറയുമായോ മിദ്യാന്യ പാരമ്പര്യവുമായോ സമന്വയിപ്പിച്ചില്ല.
  alternative: ‘എത്യോപ്യക്കാരി’ എന്ന പരമ്പരാഗത ഭൂമിശാസ്ത്രപരമായ വിവർത്തനം; അല്ലെങ്കിൽ ഈ സ്ത്രീയെ സിപ്പോറയെന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കൽ.
  rationale: വാക്യം സ്ത്രീയെ കൂശ്യസ്ത്രീ എന്നു മാത്രമാണ് തിരിച്ചറിയിക്കുന്നത്. ചരിത്രപരമോ സമന്വയപരമോ ആയ തർക്കങ്ങൾക്ക് പരിഭാഷയിൽ തീർപ്പുകൽപ്പിക്കാതെ മൂലപാഠത്തിന്റെ പദപ്രയോഗം നിലനിർത്തുന്നു.
- issue: לקח എന്ന വിവാഹപ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘സ്വീകരിച്ചു’ എന്നു നൽകി, വിവാഹസന്ദർഭത്തിലെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘വിവാഹം കഴിച്ചു’ അല്ലെങ്കിൽ ‘ഭാര്യയായി സ്വീകരിച്ചു’ എന്നു നൽകൽ.
  rationale: എബ്രായത്തിന്റെ രൂപകൽപ്പനയും അതിലെ സ്വാഭാവിക വിവാഹാർഥവും രണ്ടും സംരക്ഷിക്കുന്നു; സ്ത്രീയുടെ നിലയെക്കുറിച്ച് മൂലപാഠത്തിനപ്പുറം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ആവർത്തനം ഊന്നലായി നിലനിർത്തി. ‘കൂശ്യസ്ത്രീ’ എന്ന സ്രോതസ്സിനോട് സുതാര്യമായ രൂപം സ്വീകരിക്കുകയും ആവശ്യമായ പരമ്പരാഗത പകരം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
