source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: ml
  text: മോശെ എന്ന മനുഷ്യൻ ഭൂമുഖത്തുള്ള ഏതൊരു മനുഷ്യനെക്കാളും വളരെ വിനയമുള്ളവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മനുഷ്യൻ’ എന്നു പറയുന്നത് പൊതുവായി മനുഷ്യവർഗത്തിലെ ഏവരെയും സൂചിപ്പിക്കുന്നു; ‘ഏതൊരു വ്യക്തിയെക്കാളും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/אִישׁ
  choice: മോശെ എന്ന മനുഷ്യൻ
  rationale: വാവ് ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർബന്ധമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം ആരംഭിച്ചു. הָאִישׁ എന്നതിലെ ‘മനുഷ്യൻ’ ഒഴിവാക്കാതെ, പേരിനോടൊപ്പം സ്വാഭാവികമായ ‘മോശെ എന്ന മനുഷ്യൻ’ എന്നു നൽകി.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
- source_word: ענו
  choice: വിനയമുള്ളവൻ
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ മനോഭാവത്തെയും സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്ന വിശേഷണമായി ‘വിനയമുള്ളവൻ’ ഏറ്റവും സ്വാഭാവികം. ‘സൗമ്യൻ’, ‘ദീനൻ’, ‘പീഡിതൻ’ എന്നിവ സാധ്യമായിരുന്നാലും യഥാക്രമം അർത്ഥപരിധി ചുരുക്കുകയോ മറ്റൊരു അർത്ഥത്തിലേക്കു നയിക്കുകയോ ചെയ്യും.
- source_word: מְאֹד
  choice: വളരെ
  rationale: ഹീബ്രു തീവ്രതാസൂചകത്തിന്റെ സാധാരണവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: מִ/כֹּל
  choice: ഏതൊരു … നെക്കാളും
  rationale: מן + כֹּל എന്ന താരതമ്യഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָאָדָם
  choice: മനുഷ്യൻ
  rationale: ഇവിടെ אָדָם ഒരു വ്യക്തിയെ മാത്രമല്ല, പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ഏകവചന താരതമ്യപ്രയോഗമാണ്; ‘മനുഷ്യൻ’ ഹീബ്രു രൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: אֲשֶׁר
  choice: ഉണ്ടായിരുന്ന
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി മുഖ്യനാമത്തോടു ചേർക്കുന്ന ക്രിയാവിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ഭൂമുഖത്ത്
  rationale: ‘ഭൂമിയുടെ മുഖത്തിന്മേൽ’ എന്ന ഹീബ്രു ദൃശ്യരൂപം സംക്ഷിപ്തവും മലയാളത്തിൽ സ്ഥാപിതവുമായ ‘ഭൂമുഖത്ത്’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ענו എന്ന പദത്തിന്റെ സ്വഭാവവിവരണം
  choice: വിനയമുള്ളവൻ
  alternative: സൗമ്യൻ / ദീനൻ / പീഡിതൻ
  rationale: ഈ സന്ദർഭത്തിൽ മോശെയുടെ വിനയം സൂചിപ്പിക്കുന്ന വായനയാണ് ഏറ്റവും സാദ്ധ്യം. എന്നിരുന്നാലും പദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി സൗമ്യതയെയും താഴ്മയെയും ഉൾക്കൊള്ളാം; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: אָדָם എന്നതിന്റെ പൊതുവായ താരതമ്യാർത്ഥം
  choice: ഏതൊരു മനുഷ്യൻ
  alternative: ഏതൊരു വ്യക്തി / മനുഷ്യരിൽ എല്ലാവരും
  rationale: ഹീബ്രുവിലെ ഏകവചന പൊതുപ്രയോഗം ഔപചാരികമായി നിലനിർത്താൻ ‘മനുഷ്യൻ’ സ്വീകരിച്ചു; ഇത് പുരുഷന്മാർക്കു മാത്രം പരിമിതമല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഹീബ്രു വാക്യത്തിലെ താരതമ്യവും ‘ഭൂമുഖം’ എന്ന ദൃശ്യപ്രയോഗവും നിലനിർത്തി; അനാവശ്യമായ ആരംഭബന്ധകം ചേർത്തിട്ടില്ല.
