  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ മേഘസ്തംഭത്തിൽ ഇറങ്ങിവന്ന് കൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ നിന്നു. അവൻ അഹരോനെയും മിര്യാമിനെയും വിളിച്ചു; അവർ ഇരുവരും പുറത്തേക്കു വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഇരുവരും മുന്നോട്ടുവന്നു.” എബ്രായക്രിയയുടെ അക്ഷരാർഥം “പുറത്തേക്കു വന്നു/പോയി” എന്നാണ്; ഇവിടെ യഹ്‌വെയുടെ വിളിക്കു മറുപടിയായി അവർ അടുത്തേക്കു വന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്നു
  rationale: ירד എന്ന ക്രിയയുടെ ‘താഴേക്ക് ഇറങ്ങുക’ എന്ന മൂർത്തമായ ചലനഭാഷ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בְּעַמּוּד עָנָן
  choice: മേഘസ്തംഭത്തിൽ
  rationale: בְּ എന്നതിന്റെ സ്ഥല/മാധ്യമ അർഥവും עמוד ענן എന്ന ദൃശ്യരൂപകവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: וַיַּעֲמֹד
  choice: നിന്നു
  rationale: עמד എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള മലയാളരൂപം; ആഖ്യാനക്രമം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: פֶּתַח הָאֹהֶל
  choice: കൂടാരത്തിന്റെ പ്രവേശനത്തിങ്കൽ
  rationale: פתח എന്നത് ‘പ്രവേശനം/വാതിൽക്കൽ’ എന്നും האהל എന്നത് ഇവിടെ ലളിതമായി ‘കൂടാരം’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു; മൂലപാഠത്തിൽ ‘സമാഗമകൂടാരം’ എന്ന പൂർണപദവി ചേർത്തിട്ടില്ല.
- source_word: וַיִּקְרָא
  choice: വിളിച്ചു
  rationale: קרא എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘വിളിച്ചുവരുത്തി’ എന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: അഹരോനെയും മിര്യാമിനെയും
  rationale: മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: അവർ ഇരുവരും പുറത്തേക്കു വന്നു
  rationale: יצא എന്നതിന്റെ അക്ഷരാർഥമായ ‘പുറത്തേക്കു വരുക/പോകുക’ നിലനിർത്തുകയും שניהם എന്ന ഇരുവചന ഊന്നൽ ‘ഇരുവരും’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു; സന്ദർഭത്തിൽ ‘മുന്നോട്ടുവന്നു’ എന്ന അർഥവും സാധ്യമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രൂപം നിർബന്ധിക്കുന്നില്ല.
- issue: യഹ്‌വെയുടെ ഇറങ്ങിവരവിനെക്കുറിച്ചുള്ള മൂർത്തഭാഷ
  choice: ‘ഇറങ്ങിവന്നു’ എന്ന ഭാഷ നിലനിർത്തി
  alternative: ‘പ്രത്യക്ഷനായി’ എന്ന അമൂർത്തമായ പരാവർത്തനം
  rationale: മൂലഹീബ്രു വ്യക്തമായി ഇറങ്ങിവരുന്ന ചലനം ചിത്രീകരിക്കുന്നു. ദൈവസാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഒരു ദൈവശാസ്ത്രവിശദീകരണം ചേർക്കാതെ ആ ദൈവപ്രത്യക്ഷതയുടെ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- issue: וַיֵּצְאוּ എന്ന ചലനത്തിന്റെ ദിശയും പ്രയോഗാർഥവും
  choice: ‘പുറത്തേക്കു വന്നു’ എന്ന അക്ഷരാർഥം മുഖ്യവാചകത്തിൽ
  alternative: ‘മുന്നോട്ടുവന്നു’
  rationale: അവർ എവിടെനിന്നാണ് പുറപ്പെട്ടതെന്നത് വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ യഥാർഥ ചലനക്രിയ നിലനിർത്തി, സന്ദർഭപ്രകാരമുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ചെറുവാക്യക്രമവും മൂർത്തമായ ദൈവപ്രത്യക്ഷതാഭാഷയും സംരക്ഷിച്ചിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ്-അടയാളങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തക്കേടുള്ളതിനാൽ, കൂടാരത്തെപ്പറ്റിയുള്ള വിശദീകരണം ആവശ്യമില്ലാത്ത ചേർക്കലായി ഒഴിവാക്കി; യഥാർഥമായ יצא-വികൽപത്തിനാണ് [a] നൽകിയിരിക്കുന്നത്.
