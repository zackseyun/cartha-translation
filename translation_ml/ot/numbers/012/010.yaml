id: NUM.12.10
reference: Numbers 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: ml
  text: മേഘം കൂടാരത്തിന്റെ മുകളിൽനിന്ന് നീങ്ങിപ്പോയി. അപ്പോൾ ഇതാ, മിര്യാം മഞ്ഞുപോലെ ചർമരോഗബാധിതയായി[a]. അഹരോൻ മിര്യാമിന്റെ നേരെ തിരിഞ്ഞപ്പോൾ, ഇതാ, അവൾ ചർമരോഗബാധിതയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചർമരോഗബാധിത” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ഗൗരവമുള്ള വിവിധ ചർമരോഗങ്ങളെയോ ആചാരപരമായി അശുദ്ധിയുണ്ടാക്കുന്ന ചർമബാധയെയോ സൂചിപ്പിക്കാം; അത് ആധുനിക വൈദ്യശാസ്ത്രം തിരിച്ചറിയുന്ന കുഷ്ഠരോഗം (ഹാൻസൻസ് രോഗം) തന്നെയായിരിക്കണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: നിശ്ചയാർഥമുള്ള ഈ നാമം സന്ദർഭത്തിൽ യഹോവയുടെ സാന്നിധ്യവുമായി ബന്ധപ്പെട്ട ദൃശ്യമായ മേഘത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: סָר
  choice: നീങ്ങിപ്പോയി
  rationale: മാറിപ്പോകുക, പിൻവാങ്ങുക എന്ന ചലനാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵעַל הָאֹהֶל
  choice: കൂടാരത്തിന്റെ മുകളിൽനിന്ന്
  rationale: കൂടാരത്തിനു മുകളിലുള്ള സ്ഥാനത്തുനിന്നുള്ള നീക്കത്തെ מֵעַל കൃത്യമായി സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തേക്കാൾ അധികമായി 'സമാഗമകൂടാരം' എന്നു വികസിപ്പിച്ചിട്ടില്ല.
- source_word: וְהִנֵּה
  choice: അപ്പോൾ ഇതാ / ഇതാ
  rationale: ആകസ്മികമായ ദൃശ്യാവിഷ്കാരവും വിസ്മയവും നിലനിർത്താൻ 'ഇതാ' ഉപയോഗിച്ചു; ആദ്യസ്ഥാനത്തെ ബന്ധകം മലയാളപ്രവാഹത്തിനായി 'അപ്പോൾ' എന്നു നൽകി.
- source_word: מְצֹרַעַת
  choice: ചർമരോഗബാധിതയായി / ചർമരോഗബാധിതയായിരുന്നു
  rationale: ഈ എബ്രായ പദം ആധുനിക വൈദ്യശാസ്ത്രത്തിലെ ഹാൻസൻസ് രോഗത്തിൽ മാത്രം ഒതുങ്ങാത്ത ഗൗരവമുള്ള ചർമബാധയെയോ ആചാരപരമായ അശുദ്ധിയുണ്ടാക്കുന്ന അവസ്ഥയെയോ സൂചിപ്പിക്കാം. അതിനാൽ തെറ്റായി പരിമിതപ്പെടുത്താവുന്ന 'കുഷ്ഠരോഗി' ഒഴിവാക്കി.
- source_word: כַּשָּׁלֶג
  choice: മഞ്ഞുപോലെ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്തമായ ഉപമ നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത 'വെളുത്ത' എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיִּפֶן ... אֶל
  choice: നേരെ തിരിഞ്ഞപ്പോൾ
  rationale: അഹരോൻ മിര്യാമിന്റെ ദിശയിലേക്കു തിരിഞ്ഞ ശാരീരികചലനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: מְצֹרַעַת എന്ന പദത്തിന്റെ രോഗനിർണയപരമായ വ്യാപ്തി
  choice: ചർമരോഗബാധിത
  alternative: കുഷ്ഠരോഗബാധിത
  rationale: പുരാതന എബ്രായ പദത്തെ ആധുനിക ഹാൻസൻസ് രോഗവുമായി നിർബന്ധമായി സമീകരിക്കാതെ അതിന്റെ വിശാലമായ അർഥപരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. 'ഇതാ' എന്ന ആവർത്തനം മൂലപാഠത്തിലെ നാടകീയ ഊന്നൽ നിലനിർത്തുന്നു; രോഗാവസ്ഥയുടെ ആവർത്തനവും ചുരുക്കിയിട്ടില്ല.
