  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: ml
  text: 'അഹരോൻ മോശെയോടു പറഞ്ഞു: “എന്റെ യജമാനനേ, ദയവായി, ഞങ്ങൾ വിഡ്ഢിത്തം കാണിക്കുകയും പാപം ചെയ്യുകയും ചെയ്തതിനാൽ ഞങ്ങളുടെമേൽ പാപം ചുമത്തരുതേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഞങ്ങളുടെമേൽ കുറ്റം ചുമത്തരുതേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: എന്റെ യജമാനനേ, ദയവായി
  rationale: בִּי അപേക്ഷയെയും അֲדֹנִי മോശെയോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയെയും സൂചിപ്പിക്കുന്നു; ഇത് ദൈവിക വിശേഷണമല്ല.
- source_word: אַל נָא
  choice: ചുമത്തരുതേ
  rationale: നിഷേധാത്മക അപേക്ഷയുടെ വിനീതഭാവം മലയാളത്തിലെ അപേക്ഷാരൂപമായ ‘-രുതേ’ നൽകുന്നു; തുടക്കത്തിലെ ‘ദയവായി’ അപേക്ഷയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: ഞങ്ങളുടെമേൽ പാപം ചുമത്തരുതേ
  rationale: ശാബ്ദികമായ ‘മേൽ വെക്കുക’ എന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ ‘മേൽ ... ചുമത്തുക’ എന്നു നൽകി; חַטָּאת എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പാപം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: ഞങ്ങൾ ഭോഷത്വമായി പ്രവർത്തിക്കുകയും
  rationale: Niphal രൂപം ഇവിടെ ബുദ്ധിശൂന്യമായോ ഭോഷമായോ പ്രവർത്തിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘ഭോഷത്വമായി പ്രവർത്തിച്ചു’ ധാർമികമായ കുറ്റസമ്മതഭാവം നിലനിർത്തുന്നു.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: പാപം ചെയ്യുകയും ചെയ്തിരിക്കുന്നു
  rationale: രണ്ടാമത്തെ ഘടകം ആദ്യ കുറ്റസമ്മതത്തെ വ്യക്തമാക്കുകയും ശക്തിപ്പെടുത്തുകയും ചെയ്യുന്നു. മലയാളത്തിലെ ഏകോപിത ക്രിയാരൂപം ആവർത്തനം അസ്വാഭാവികമാകാതെ രണ്ടു ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശെയെ അഭിസംബോധന ചെയ്യുന്ന אֲדֹנִי
  choice: എന്റെ യജമാനനേ
  alternative: പ്രഭോ / അങ്ങുന്നേ
  rationale: ഇവിടെ പദം ദൈവത്തെ സൂചിപ്പിക്കുന്നില്ല; മോശെയോടുള്ള ആദരവും അഹരോന്റെ താഴ്മയുള്ള അപേക്ഷയും പ്രകടിപ്പിക്കുന്ന മാനുഷിക ബഹുമാനപദമാണ്.
- issue: חַטָּאת എന്നതിന്റെ അർഥപരിധി
  choice: പാപം
  alternative: കുറ്റം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥവും രൂപകവും മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു; സന്ദർഭത്തിൽ കുറ്റബാധ്യത എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ അപേക്ഷാഭാഷ ഉപയോഗിച്ചു. ‘എന്റെ യജമാനനേ’ എന്നത് ദൈവിക പദവിയല്ല, മോശെയോടുള്ള ആദരസൂചകമായ അഭിസംബോധനയാണ്. രണ്ടു אֲשֶׁר ഘടകങ്ങളുടെയും കുറ്റസമ്മതശക്തി മലയാളത്തിലെ ഏകോപിത വാക്യത്തിൽ നിലനിർത്തി.
