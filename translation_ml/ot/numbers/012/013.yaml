id: NUM.12.13
reference: Numbers 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ യഹ്‌വേയോട് നിലവിളിച്ചു: “ദൈവമേ, ദയവായി അവളെ സുഖപ്പെടുത്തണമേ—ദയവായി!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: നിലവിളിച്ചു
  rationale: צעק ശക്തവും അടിയന്തരവുമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ അതിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל יְהוָה
  choice: യഹ്‌വേയോട്
  rationale: אֶל എന്ന ദിശാസൂചക ബന്ധവും יְהוָה എന്ന ദൈവനാമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: (കോളൺ മുഖേന പ്രകടമാക്കി)
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം മലയാളത്തിൽ കോളൺകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
- source_word: אֵל
  choice: ദൈവമേ
  rationale: ഇവിടെ אֵל പ്രാർഥനയിലെ സംബോധനയാണ്; ‘ദൈവമേ’ അതിന്റെ സംബോധനസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: נָא ... נָא
  choice: ദയവായി ... ദയവായി
  rationale: അപേക്ഷയും അടിയന്തരതയും സൂചിപ്പിക്കുന്ന നָא രണ്ടുതവണ വരുന്നതിനാൽ ആവർത്തനം നിലനിർത്തി.
- source_word: רְפָא
  choice: സുഖപ്പെടുത്തണമേ
  rationale: רפא എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം മിര്യാമിന്റെ രോഗശാന്തിക്കായുള്ള അപേക്ഷയാണ്; വിനയപൂർവമായ പ്രാർഥനാഭാവം മലയാളത്തിലെ ‘-ണമേ’ രൂപം നൽകുന്നു.
- source_word: לָהּ
  choice: അവളെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന സ്ത്രീലിംഗ പ്രത്യയം മിര്യാമിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഉപയോഗിക്കുന്ന വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം ഒരു പദവിയാൽ മാറ്റിസ്ഥാപിക്കാതെ മലയാള ലിപിയിൽ ലിപ്യന്തരിച്ചു.
- issue: നָא എന്ന അപേക്ഷാകണത്തിന്റെ ആവർത്തനം
  choice: ‘ദയവായി’ രണ്ടുതവണ നിലനിർത്തി
  alternative: സ്വാഭാവികതയ്ക്കായി ഒരിക്കൽ മാത്രം നൽകുക
  rationale: എബ്രായത്തിലെ ആവർത്തനം മോശയുടെ അപേക്ഷയുടെ അടിയന്തരത വർധിപ്പിക്കുന്നു; അതിനെ നീക്കുന്നത് മൂലത്തിലെ ഊന്നൽ കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രാർഥനാശൈലി. മൂലത്തിലെ അത്യന്തം ചുരുങ്ങിയതും തീവ്രവുമായ അപേക്ഷ സംരക്ഷിക്കാൻ ദീർഘമായ വിശദീകരണങ്ങൾ ഒഴിവാക്കി; ആവർത്തിച്ച അപേക്ഷയെ ഡാഷ് ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി.
