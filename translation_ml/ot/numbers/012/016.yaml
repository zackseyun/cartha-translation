  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഹീബ്രുവിലെ തുടർച്ചയായ യാത്രാക്രമം നിലനിർത്തിക്കൊണ്ട് വാക്യം സ്വാഭാവികമായി രൂപപ്പെടുത്തി.
