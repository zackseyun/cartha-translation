  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַחַ֛ר נָסְע֥וּ הָ/עָ֖ם מֵ/חֲצֵר֑וֹת וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּ֥ר פָּארָֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: ml
  text: അതിനുശേഷം ജനം ഹസേരോത്തിൽനിന്ന് പുറപ്പെട്ട് പാരാൻ മരുഭൂമിയിൽ പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: അതിനുശേഷം
  rationale: മുൻപുണ്ടായ സംഭവങ്ങൾക്കുശേഷമുള്ള ആഖ്യാനക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: נָסְעוּ
  choice: പുറപ്പെട്ടു
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിൽ പാളയം നീക്കി യാത്ര തുടങ്ങുക എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: ഇവിടെ ഇസ്രായേൽ സമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ആഖ്യാനത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: מֵחֲצֵרוֹת
  choice: ഹസേരോത്തിൽനിന്ന്
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്ത് അപാദാനവിഭക്തി ചേർത്തിരിക്കുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്ന ക്രിയയുടെ ‘താവളമടിച്ചു താമസിക്കുക’ എന്ന യാത്രാസന്ദർഭത്തിലെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּמִדְבַּר
  choice: മരുഭൂമിയിൽ
  rationale: מִדְבָּר സൂചിപ്പിക്കുന്ന ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരഭൂമിയെ ഇവിടെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘മരുഭൂമി’ എന്ന പദംകൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: פָּארָן
  choice: പാരാൻ
  rationale: സ്ഥലനാമത്തിന്റെ ഹീബ്രു രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
