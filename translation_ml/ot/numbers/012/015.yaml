source:
  edition: WLC
  text: וַ/תִּסָּגֵ֥ר מִרְיָ֛ם מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְ/הָ/עָם֙ לֹ֣א נָסַ֔ע עַד הֵאָסֵ֖ף מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/015.yaml
  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: ml
  text: അങ്ങനെ മിര്യാം ഏഴു ദിവസം പാളയത്തിനു പുറത്തു മാറ്റിനിർത്തപ്പെട്ടു; മിര്യാം വീണ്ടും പാളയത്തിൽ ചേർക്കപ്പെടുന്നതുവരെ[a] ജനം യാത്ര പുറപ്പെട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മിര്യാം കൂട്ടിച്ചേർക്കപ്പെടുന്നതുവരെ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായക്രിയ, പുറത്തു മാറ്റിനിർത്തപ്പെട്ട കാലം കഴിഞ്ഞ് അവളെ പാളയത്തിൽ വീണ്ടും ഉൾപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: മാറ്റിനിർത്തപ്പെട്ടു
  rationale: നിഫാൽ രൂപത്തിലുള്ള סגר ഇവിടെ മിര്യാമിനെ പാളയത്തിനു പുറത്തായി വേർതിരിച്ചുനിർത്തിയ നിർബന്ധിത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭാനുസൃതമായി സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തു
  rationale: മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലത്തിലുള്ള നേരിട്ടുള്ള സ്ഥാനസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: യാത്ര ചെയ്യുന്ന ഇസ്രായേൽസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ സാധാരണ മലയാളപദം.
- source_word: לֹא נָסַע
  choice: യാത്ര പുറപ്പെട്ടില്ല
  rationale: נסע എന്ന ക്രിയയുടെ പാളയം വിട്ട് അടുത്ത യാത്ര ആരംഭിക്കുക എന്ന മരുഭൂമിവിവരണങ്ങളിലെ സാങ്കേതിക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: മിര്യാമിനെ അകത്തേക്കു ചേർക്കുന്നതുവരെ
  rationale: אסף എന്നതിന്റെ അടിസ്ഥാനമായ ‘ചേർക്കുക/കൂട്ടിച്ചേർക്കുക’ എന്ന ആശയം സംരക്ഷിച്ചുകൊണ്ട്, പുറത്താക്കപ്പെട്ടിരുന്ന മിര്യാമിനെ പാളയത്തിലേക്കു സ്വീകരിക്കുന്ന സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘തിരികെ’ എന്നത് മുഖ്യവാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അടച്ചിടപ്പെട്ടു’ എന്ന അസ്വാഭാവികമായ പദാനുപദരൂപത്തിനു പകരം സന്ദർഭം വ്യക്തമാക്കുന്ന ‘മാറ്റിനിർത്തപ്പെട്ടു’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട വാക്യഘടകത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
