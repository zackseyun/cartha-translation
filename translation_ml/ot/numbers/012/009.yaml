    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: ജ്വലിച്ചു
  rationale: חרה എന്ന ക്രിയ കോപത്തിന്റെ ചൂട്/ജ്വലനം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപകസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: אַף
  choice: കോപം
  rationale: പദശഃ ‘മൂക്ക്’ എന്നാണെങ്കിലും חרהയോടു ചേർന്ന ഈ പ്രയോഗത്തിൽ അർഥം ‘കോപം’ എന്നാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ അർഥപരിഭാഷ ഇതാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּם
  choice: അവർക്കെതിരെ
  rationale: കോപം ആരെ ലക്ഷ്യമാക്കുന്നു എന്നത് ഈ സന്ദർഭത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וַיֵּלַךְ
  choice: അവിടുന്ന് അവിടെനിന്നു പോയി
  rationale: הלך ഇവിടെ യഹ്‌വേയുടെ പിന്മാറ്റത്തെ സൂചിപ്പിക്കുന്നു; ബഹുമാനസൂചക സർവനാമത്തോടുകൂടിയ ഈ രൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം നിലനിർത്തുന്നു; ഒരു സ്ഥാനപ്പേര് പകരംവയ്ക്കുകയോ മറ്റൊരു പരമ്പരാഗത ഉച്ചാരണം തിരഞ്ഞെടുക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കോപം ജ്വലിച്ചു’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ചൂടിന്റെ രൂപകം നിലനിർത്തുന്നു; ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ ബഹുമാനരൂപമാണ്.
