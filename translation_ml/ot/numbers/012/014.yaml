source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “അവളുടെ അപ്പൻ അവളുടെ മുഖത്ത് തുപ്പിയിരുന്നെങ്കിൽ, അവൾ ഏഴു ദിവസം അപമാനിതയായിരിക്കുമായിരുന്നില്ലേ?[a] അവളെ ഏഴു ദിവസം പാളയത്തിനു പുറത്തു അടച്ചിടട്ടെ; അതിനുശേഷം അവൾ വീണ്ടും അകത്തേക്കു ചേർക്കപ്പെടട്ടെ.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൾ ഏഴു ദിവസം ലജ്ജിതയായിരിക്കുമായിരുന്നില്ലേ?”
    reason: כלם എന്ന പദത്തിന് സാമൂഹികമായ അപമാനത്തെയും ലജ്ജയെയും സൂചിപ്പിക്കാൻ കഴിയും; ഇത് പദാർത്ഥപരമായ മറ്റൊരു സാധ്യതയാണ്.
  - marker: b
    text: അഥവാ, “അതിനു ശേഷം അവളെ വീണ്ടും അകത്തേക്കു സ്വീകരിക്കട്ടെ.”
    reason: תֵּאָסֵף എന്ന നിഷ്ക്രിയ ക്രിയയെ സമൂഹത്തിലേക്കുള്ള പുനഃസ്വീകരണത്തിന്റെ അർഥത്തിൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകുന്ന സാധ്യത.
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, ആധുനിക മലയാളത്തിൽ അതിന്റെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: יָרֹק יָרַק
  choice: തുപ്പിയിരുന്നെങ്കിൽ
  rationale: ക്രിയയുടെ ആവർത്തനത്തിലൂടെ എബ്രായത്തിൽ ലഭിക്കുന്ന ഊന്നലും സാങ്കൽപ്പിക നിബന്ധനയുടെ ഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായ നിബന്ധനാരൂപത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: בְּפָנֶיהָ
  choice: അവളുടെ മുഖത്തു
  rationale: തുപ്പലുമായി ചേർന്ന പ്രയോഗത്തിൽ പൊതുവായ അപമാനത്തിന്റെ ശക്തമായ ദൃശ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: תִכָּלֵם
  choice: അപമാനിതയായി കഴിയുമായിരുന്നില്ലേ
  rationale: כלם എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം സാമൂഹികമായ നാണക്കേടിലോ അപമാനത്തിലോ ആക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ ആലങ്കാരിക ചോദ്യം നിലനിർത്തി.
- source_word: תִּסָּגֵר
  choice: അടച്ചിടട്ടെ
  rationale: നിഫാൽ രൂപത്തിലെ നിഷ്ക്രിയമായ വേർതിരിക്കൽ/തടങ്കൽഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തു
  rationale: സ്ഥലപരമായ പുറത്താക്കലിനെ നേരിട്ടും സന്ദർഭോചിതമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: תֵּאָסֵף
  choice: വീണ്ടും അകത്തു സ്വീകരിക്കട്ടെ
  rationale: אסף എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള ‘ചേർക്കപ്പെടുക/തിരികെ സ്വീകരിക്കപ്പെടുക’ എന്ന നിഷ്ക്രിയവും സമൂഹത്തിലേക്കുള്ള പുനഃപ്രവേശനവുമായ ആശയം വ്യക്തമാക്കുന്നു; ‘കൂട്ടിച്ചേർക്കപ്പെടട്ടെ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: അപ്പൻ മുഖത്തു തുപ്പുന്ന ഉപമയുടെ സ്വഭാവം
  choice: നാണക്കേടും താൽക്കാലിക പുറത്താക്കലും വിശദീകരിക്കുന്ന സാങ്കൽപ്പിക ഉപമ
  alternative: യഥാർഥത്തിൽ മുമ്പ് നടന്ന ഒരു സംഭവത്തിന്റെ പരാമർശം
  rationale: എബ്രായ വാക്യഘടന ഇത് ആലങ്കാരികമായ ഒരു നിബന്ധനാചോദ്യമായി അവതരിപ്പിക്കുന്നു. അതിനാൽ അധിക പ്രതീകാത്മകമോ സിദ്ധാന്തപരമോ ആയ അർഥം ചേർക്കാതെ ഉപമയുടെ ശക്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ‘അപ്പൻ’ എന്ന സ്വാഭാവിക പദവും ‘പാളയം’ എന്ന ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദവും ഉപയോഗിച്ചു. മൂലത്തിലെ ആലങ്കാരിക ചോദ്യം, നിഷ്ക്രിയ ക്രിയാഭാവങ്ങൾ, ഏഴു ദിവസത്തെ പുറത്താക്കൽ എന്നിവ നിലനിർത്തി.
