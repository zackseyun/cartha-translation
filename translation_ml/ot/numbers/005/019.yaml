  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: ml
  text: 'അപ്പോൾ പുരോഹിതൻ അവളെക്കൊണ്ട് ശപഥം ചെയ്യിപ്പിക്കുകയും സ്ത്രീയോടു പറയുകയും വേണം: “ഒരു പുരുഷനും നിന്നോടുകൂടെ ശയിച്ചിട്ടില്ലെങ്കിൽ, നിന്റെ ഭർത്താവിനോടുള്ള വിവാഹബന്ധത്തിലായിരിക്കെ[b] നീ അശുദ്ധിയിൽ വഴിതെറ്റിയിട്ടില്ലെങ്കിൽ, ശാപം വരുത്തുന്ന[c] ഈ കയ്പുള്ള വെള്ളത്തിൽനിന്ന് നീ ഒഴിവാക്കപ്പെടട്ടെ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശാപം വരുത്തുന്ന ഈ കയ്പുള്ള വെള്ളത്തിൽനിന്ന് നീ കുറ്റമുക്തയായിരിക്കട്ടെ.’
    reason: lexical_alternative
  - marker: b
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘നിന്റെ ഭർത്താവിന്റെ കീഴിൽ’; സ്ത്രീയുടെ വിവാഹസ്ഥിതിയെയും വിവാഹബന്ധത്തിലെ ബാധ്യതയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥം, ‘കയ്പുള്ള വെള്ളങ്ങൾ, ശാപം വരുത്തുന്നവ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: അവളെക്കൊണ്ട് ശപഥം ചെയ്യിപ്പിച്ച്
  rationale: שׁבע എന്ന ക്രിയയുടെ ഹിഫ്ഈൽ രൂപത്തിലെ കാരണാർഥം—ഒരാളെ ശപഥത്തിന് വിധേയയാക്കുക—വ്യക്തമായി നിലനിർത്തുന്നു; നിയമപരമായ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവവും ഉണ്ട്.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: ഒരു പുരുഷനും നിന്നോടുകൂടെ ശയിച്ചിട്ടില്ലെങ്കിൽ
  rationale: שׁכב ലൈംഗികബന്ധത്തിനുള്ള മാന്യമായ പരോക്ഷപ്രയോഗമാണ്. മലയാളത്തിലെ ‘ശയിക്കുക’ ആ പരോക്ഷതയും ഗൗരവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: שָׂטִית טֻמְאָה
  choice: നീ അശുദ്ധിയിലേക്കു വഴിതെറ്റിയിട്ടില്ലെങ്കിൽ
  rationale: שׂטהയിലെ വഴിതെറ്റൽ എന്ന രൂപകവും טֻמְאָהയിലെ ആചാരപരവും ധാർമികവുമായ അശുദ്ധിയുടെ പരിധിയും അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: תַּחַת אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവിനോടുള്ള വിവാഹബന്ധത്തിലിരിക്കെ
  rationale: അക്ഷരാർഥമായ ‘നിന്റെ ഭർത്താവിന്റെ കീഴിൽ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വിവാഹബന്ധപരമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הִנָּקִי
  choice: നിന്നെ ബാധിക്കാതിരിക്കട്ടെ
  rationale: നקה ഇവിടെ വെള്ളത്തിന്റെ ശാപഫലത്തിൽനിന്ന് ഒഴിവായിരിക്കുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആശംസാ/വിധിരൂപത്തിൽ അത് വ്യക്തമാക്കുന്നു; ‘കുറ്റമുക്ത’ എന്ന കൂടുതൽ ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: מִמֵּי הַמָּרִים
  choice: ഈ കയ്പുള്ള വെള്ളം
  rationale: ഹീബ്രുവിൽ ‘വെള്ളങ്ങൾ’ എന്ന ബഹുവചനമുണ്ടെങ്കിലും വെള്ളത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ഏകവചനസമൂഹനാമമാണ് സ്വാഭാവികം; ‘കയ്പുള്ള’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: הַמְאָרֲרִים
  choice: ശാപം വരുത്തുന്ന
  rationale: ארר-ൽനിന്നുള്ള പങ്കാളിക്രിയാരൂപത്തിന്റെ ശാപഫലം ഉളവാക്കുന്ന അർഥം ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്ത്രീയുടെ കുറ്റത്തെ വിവരിക്കുന്ന ഭാഷ
  choice: ‘ശയിച്ചിട്ടില്ലെങ്കിൽ’, ‘അശുദ്ധിയിലേക്കു വഴിതെറ്റിയിട്ടില്ലെങ്കിൽ’ എന്നീ ഹീബ്രു പ്രയോഗങ്ങൾ നിലനിർത്തുക
  alternative: ‘വ്യഭിചാരം ചെയ്തിട്ടില്ലെങ്കിൽ’ എന്ന് നേരിട്ട് വ്യക്തമാക്കുക
  rationale: സന്ദർഭം ദാമ്പത്യ അവിശ്വസ്തതയെക്കുറിച്ചാണെങ്കിലും ഹീബ്രു വാചകം അതിനെ പരോക്ഷവും ആചാര-നിയമപരവുമായ ഭാഷയിലാണ് അവതരിപ്പിക്കുന്നത്. ‘വ്യഭിചാരം’ എന്ന് ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ നിർദ്ദിഷ്ടമാകും.
- issue: വെള്ളത്തിന്റെ ശാപഫലം
  choice: ‘ശാപം വരുത്തുന്ന’ എന്ന് വിവർത്തനം ചെയ്യുക
  alternative: ‘ശാപജലം’ അല്ലെങ്കിൽ ‘ശാപമായിത്തീരുന്ന വെള്ളം’
  rationale: വെള്ളം ശാപഫലവുമായി ബന്ധപ്പെട്ട് പ്രവർത്തിക്കുന്നു എന്ന പങ്കാളിക്രിയയുടെ അർഥം കാത്തുസൂക്ഷിക്കുമ്പോഴും അതിന്റെ പ്രവർത്തനരീതി പാഠത്തിൽ ഇല്ലാത്ത വിധം വിശദീകരിക്കുന്നില്ല.
- issue: תַּחַת אִישֵׁךְ എന്ന വിവാഹബന്ധപ്രയോഗം
  choice: ‘നിന്റെ ഭർത്താവിനോടുള്ള വിവാഹബന്ധത്തിലിരിക്കെ’
  alternative: ‘നിന്റെ ഭർത്താവിന്റെ കീഴിലായിരിക്കെ’
  rationale: ഹീബ്രു ഭാഷാശൈലി വിവാഹസ്ഥിതിയും വിവാഹബന്ധത്തിലെ ബാധ്യതയും സൂചിപ്പിക്കുന്നു. പ്രധാനപാഠത്തിൽ അധികാരസംബന്ധമായ ഒരേയൊരു വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ വിവാഹബന്ധാർഥം നൽകുകയും അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഗൗരവമുള്ള നിയമ-ആചാര ശൈലി സ്വീകരിച്ചു. ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ മാന്യമായ പരോക്ഷഭാഷ ‘ശയിക്കുക’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. ഹീബ്രു ബഹുവചനമായ ‘വെള്ളങ്ങൾ’ മലയാളത്തിലെ സ്വാഭാവിക സമൂഹനാമപ്രയോഗം അനുസരിച്ച് ‘വെള്ളം’ എന്നു നൽകി.
