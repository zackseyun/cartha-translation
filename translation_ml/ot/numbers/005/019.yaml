revisions:
- from: 'അപ്പോൾ പുരോഹിതൻ അവളെക്കൊണ്ട് ശപഥം ചെയ്യിപ്പിച്ച് സ്ത്രീയോടു പറയണം: “ഒരു പുരുഷനും നിന്നോടുകൂടെ ശയിച്ചിട്ടില്ലെങ്കിൽ, നിന്റെ ഭർത്താവിനോടുള്ള വിവാഹബന്ധത്തിലിരിക്കെ[b] നീ അശുദ്ധിയിലേക്കു വഴിതെറ്റിയിട്ടില്ലെങ്കിൽ, ശാപം വരുത്തുന്ന[c] ഈ കയ്പുള്ള വെള്ളം നിന്നെ ബാധിക്കാതിരിക്കട്ടെ[a].”'
  to: 'അപ്പോൾ പുരോഹിതൻ അവളെക്കൊണ്ട് ശപഥം ചെയ്യിപ്പിക്കുകയും സ്ത്രീയോടു പറയുകയും വേണം: “ഒരു പുരുഷനും നിന്നോടുകൂടെ ശയിച്ചിട്ടില്ലെങ്കിൽ, നിന്റെ ഭർത്താവിനോടുള്ള വിവാഹബന്ധത്തിലായിരിക്കെ[b] നീ അശുദ്ധിയിൽ വഴിതെറ്റിയിട്ടില്ലെങ്കിൽ, ശാപം വരുത്തുന്ന[c] ഈ കയ്പുള്ള വെള്ളത്തിൽനിന്ന് നീ ഒഴിവാക്കപ്പെടട്ടെ[a].”'
  rationale: The revision makes the exemption commanded in הִנָּקִי explicit, rather than merely expressing that the water may fail to affect her. It also adjusts the impurity phrase to track the Hebrew more closely and makes the two priestly actions parallel in Malayalam. Footnote markers remain attached to their relevant expressions, and no disputed or doctrinal interpretation has been added.
