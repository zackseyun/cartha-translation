reference: Numbers 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ സ്ത്രീയുടെ കൈയിൽനിന്ന് അസൂയയുടെ ധാന്യയാഗം എടുത്ത്, ആ ധാന്യയാഗം യഹോവയുടെ സന്നിധിയിൽ ആടിച്ച് യാഗപീഠത്തിന്റെ അടുക്കലേക്കു കൊണ്ടുവരണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: പിന്നെ ... വാങ്ങി
  rationale: വാവ് + ഖാതൽ ഇവിടെ അനുഷ്ഠാനക്രമത്തിലെ അടുത്ത നിർദിഷ്ട നടപടിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിന്നെ’ ആ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘ചെയ്ത് ... കൊണ്ടുവരണം’ വിധിനിർദേശഭാവം നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാനുഷ്ഠാനം നിർവഹിക്കുന്ന നിശ്ചിത ഔദ്യോഗികനെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: מִיַּד הָאִשָּׁה
  choice: സ്ത്രീയുടെ കൈയിൽനിന്ന്
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യതയും സ്ത്രീയിൽനിന്ന് നേരിട്ട് ഏറ്റുവാങ്ങുന്നു എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: അസൂയയുടെ ധാന്യയാഗം
  rationale: מִנְחָהയുടെ ധാന്യയാഗസ്വഭാവവും קְנָאֹת എന്ന ബന്ധനിർമാണവും സംരക്ഷിക്കുന്നു; അസൂയ ആരുടേതാണെന്നോ ഏതു ഭാവത്തിലാണെന്നോ വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല.
- source_word: וְהֵנִיף
  choice: നീരാജനം ചെയ്ത്
  rationale: נוף എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാഗാർപ്പണത്തെ ആചാരപരമായി ചലിപ്പിക്കുന്ന ‘wave’ അനുഷ്ഠാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-ആരാധനാ പ്രയോഗത്തിൽ ‘നീരാജനം ചെയ്യുക’ അതിനുള്ള സംക്ഷിപ്ത സാങ്കേതിക പദമാണ്.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ലിറ്റർജിക്കൽ ‘മുമ്പാകെ/സന്നിധിയിൽ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവനാമം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനരികിലേക്കു കൊണ്ടുവരണം
  rationale: קרב ഹിഫീലിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക’ എന്ന ആരാധനാപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു; യാഗം അപ്പോൾത്തന്നെ ദഹിപ്പിച്ചു എന്നു അധികമായി പറയുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ രൂപം തിരഞ്ഞെടുത്തു.
- issue: מִנְחַת הַקְּנָאֹת എന്നതിലെ ബഹുവചന/ബന്ധസൂചന
  choice: അസൂയയുടെ ധാന്യയാഗം
  alternative: അസൂയകളുടെ ധാന്യയാഗം; അസൂയാനിവേദ്യം
  rationale: ഹീബ്രായത്തിലെ തീവ്രതയോ സാഹചര്യസംബന്ധിയായ ബഹുവചനമോ മലയാളത്തിൽ കൃത്രിമമായി ‘അസൂയകൾ’ എന്നു നൽകാതെ, ഈ അധ്യായത്തിലെ സ്ഥാപിത ആചാരനാമം സംരക്ഷിക്കുന്നു; അസൂയയുടെ ഉടമസ്ഥതയെയും നൈതിക വിലയിരുത്തലിനെയും നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പുരോഹിതാനുഷ്ഠാനത്തിന്റെ സാങ്കേതിക കൃത്യതയ്ക്കായി ‘ധാന്യയാഗം’, ‘നീരാജനം’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ക്രമാനുസൃത നിർദേശഭാവം അവസാനത്തെ ‘കൊണ്ടുവരണം’ വഴി മുഴുവൻ ക്രിയാശൃംഖലയിലും ബാധകമാക്കി.
