source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: ml
  text: അപ്പോൾ അവർ തങ്ങൾ ചെയ്ത പാപം ഏറ്റുപറയണം. കുറ്റം ചെയ്തയാൾ തന്റെ കുറ്റത്തിനുള്ള നഷ്ടപരിഹാരത്തുക മുഴുവനായും തിരിച്ചുകൊടുക്കുകയും, അതിനോടു അതിന്റെ അഞ്ചിലൊന്ന് കൂട്ടിച്ചേർക്കുകയും, താൻ അന്യായം ചെയ്ത വ്യക്തിക്കു നൽകുകയും വേണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കുറ്റത്തിനുള്ള നഷ്ടപരിഹാരത്തുക’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദത്തിന് സന്ദർഭമനുസരിച്ച് കുറ്റം, കുറ്റബാധ്യത, നഷ്ടപരിഹാരം, അല്ലെങ്കിൽ കുറ്റയാഗം എന്നിങ്ങനെ അർഥങ്ങളുണ്ടാകാം. ഇവിടെ മുഖ്യതുകയും അതിനോടു ചേർക്കുന്ന അഞ്ചിലൊന്നും ദോഷം സംഭവിച്ച വ്യക്തിക്കു നൽകുന്നതാണ് വിഷയം; അതിനാൽ ഇത് യാഗത്തെയല്ല, കൊടുക്കേണ്ട നഷ്ടപരിഹാരത്തുകയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘ആരോടു തനിക്കു കുറ്റബാധ്യത ഉണ്ടായോ, അയാൾക്ക്.’ കൂടുതൽ സ്വാഭാവികമായി: ‘താൻ അന്യായം ചെയ്ത വ്യക്തിക്ക്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: അപ്പോൾ അവർ… ഏറ്റുപറയണം
  rationale: ഹിത്പായേൽ രൂപം തെറ്റ് തുറന്നു സമ്മതിക്കുക എന്ന അർഥം നൽകുന്നു. സന്ദർഭത്തിലെ ക്രമവും നിയമപരമായ നിർദേശസ്വഭാവവും ‘അപ്പോൾ… ഏറ്റുപറയണം’ വ്യക്തമാക്കുന്നു.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: തങ്ങൾ ചെയ്ത പാപം
  rationale: חַטָּאת ഇവിടെ ചെയ്ത പാപത്തെയോ കുറ്റത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ചെയ്ത പാപം’ മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: തന്റെ കുറ്റത്തിനുള്ള നഷ്ടപരിഹാരം മുഴുവനായി കൊടുക്കുക
  rationale: שׁוב എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തിരിച്ചുകൊടുക്കൽ/നഷ്ടപരിഹാരം നൽകൽ സൂചിപ്പിക്കുന്നു. בְּרֹאשׁוֹ മുഖ്യതുക മുഴുവനായി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. אָשָׁם എന്നതിലെ കുറ്റബാധ്യതയും സാമ്പത്തിക പരിഹാരവും ഈ ഭാഷാന്തരം ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂട്ടിച്ചേർത്ത്
  rationale: മുഖ്യതുകയ്ക്കു പുറമേ ഇരുപത് ശതമാനം ചേർക്കണമെന്ന നിർദേശം നേരായും വ്യക്തമായും നൽകുന്നു.
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: താൻ കുറ്റം ചെയ്ത വ്യക്തിക്കു നൽകുക
  rationale: അക്ഷരാർഥത്തിലെ ‘ആരോടു കുറ്റബാധ്യത വരുത്തിയോ അയാൾക്ക്’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നഷ്ടപരിഹാരസന്ദർഭത്തിലെ אָשָׁם എന്ന പദത്തിന്റെ അർഥം
  choice: കുറ്റം മൂലമുള്ള ബാധ്യതയും അതിനുള്ള നഷ്ടപരിഹാരവും
  alternative: കുറ്റയാഗം
  rationale: ഈ വാക്യത്തിൽ മുഖ്യതുക, അതിനോടു ചേർക്കുന്ന അഞ്ചിലൊന്ന്, ദോഷം സംഭവിച്ച വ്യക്തിക്കുള്ള കൊടുക്കൽ എന്നിവയാണ് വിഷയം. അതിനാൽ ഇവിടെ പദം യാഗത്തെക്കാൾ കുറ്റം മൂലമുള്ള സാമ്പത്തിക ബാധ്യതയെ സൂചിപ്പിക്കുന്നു.
- issue: ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള എബ്രായ വ്യാകരണമാറ്റം
  choice: ‘അവർ’ എന്ന കൂട്ടനിർദേശത്തിനു ശേഷം ‘കുറ്റം ചെയ്തയാൾ’ എന്ന ഏകവചന പൊതുപ്രയോഗം
  alternative: ‘അവൻ’ എന്ന പുരുഷലിംഗ ഏകവചനം
  rationale: മുൻസന്ദർഭം പുരുഷനെയും സ്ത്രീയെയും ഉൾക്കൊള്ളുന്നതിനാൽ, എബ്രായത്തിലെ പൊതുവായ ഏകവചന നിർദേശം മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി വ്യക്തമാക്കുന്നു; അതേസമയം വചനത്തിലെ സംഖ്യാമാറ്റം മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ dignified എന്നാൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന നിയമനിർദേശ ശൈലി ഉപയോഗിച്ചു. ‘നഷ്ടപരിഹാരം’, ‘മുഴുവനായി’, ‘അഞ്ചിലൊന്ന്’ എന്നീ പദങ്ങൾ സാമ്പത്തിക തിരിച്ചടവിന്റെ ഘടന വ്യക്തമായി സൂക്ഷിക്കുന്നു.
