revisions:
- from: അപ്പോൾ അവർ തങ്ങൾ ചെയ്ത പാപം ഏറ്റുപറയണം. കുറ്റം ചെയ്തയാൾ തന്റെ കുറ്റത്തിനുള്ള നഷ്ടപരിഹാരം[a] മുഴുവനായി കൊടുക്കുകയും അതിന്റെ അഞ്ചിലൊന്ന് അതിനോടു കൂട്ടിച്ചേർത്ത് താൻ കുറ്റം ചെയ്ത വ്യക്തിക്കു നൽകുകയും വേണം.[b]
  to: അപ്പോൾ അവർ തങ്ങൾ ചെയ്ത പാപം ഏറ്റുപറയണം. കുറ്റം ചെയ്തയാൾ തന്റെ കുറ്റത്തിനുള്ള നഷ്ടപരിഹാരത്തുക മുഴുവനായും തിരിച്ചുകൊടുക്കുകയും, അതിനോടു അതിന്റെ അഞ്ചിലൊന്ന് കൂട്ടിച്ചേർക്കുകയും, താൻ അന്യായം ചെയ്ത വ്യക്തിക്കു നൽകുകയും വേണം.[a][b]
  rationale: The revision preserves the Hebrew’s singular legal instruction after the plural confession clause, clarifies that restitution includes the full principal amount before the added fifth, and renders the final recipient unambiguously as the wronged person. Footnote anchors have been moved so that [a] directly follows the restitution terminology and [b] directly follows the recipient clause.
  reviewer_model: gpt-5.6-terra
