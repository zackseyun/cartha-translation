id: NUM.5.22
reference: Numbers 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: ml
  text: ശാപം വരുത്തുന്ന ഈ ജലം നിന്റെ ആന്തരികാവയവങ്ങളിലേക്കു കടന്ന് നിന്റെ വയർ വീർക്കുകയും നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യട്ടെ.[a] അപ്പോൾ ആ സ്ത്രീ, ‘ആമേൻ, ആമേൻ’ എന്നു പറയണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “വയർ വീർപ്പിക്കാനും തുട വീഴ്ത്താനും.” ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; ഇത് പ്രത്യുത്പാദനവുമായി ബന്ധപ്പെട്ട ഒരു പീഡനത്തിന്റെ സൗമ്യോക്തിയായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: കടക്കുകയും ... ചെയ്യട്ടെ
  rationale: ശാപശപഥത്തിന്റെ പശ്ചാത്തലത്തിൽ ഈ രൂപത്തിന് ആശംസാത്മകമായ ശാപപ്രയോഗത്തിന്റെ ബലം ഉണ്ട്; ലളിതമായ ഭാവികാലത്തേക്കാൾ ‘ചെയ്യട്ടെ’ അത് വ്യക്തമാക്കുന്നു.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: ശാപം വരുത്തുന്ന ഈ ജലം
  rationale: מְאָרְרִים എന്നത് ജലം ശാപം വഹിക്കുകയോ ഫലിപ്പിക്കുകയോ ചെയ്യുന്നു എന്ന അർഥം നൽകുന്നു. ഹീബ്രുവിൽ രൂപം ബഹുവചനമാണെങ്കിലും, മലയാളത്തിൽ ദ്രവ്യനാമമായ ‘ജലം’ ഏകവചനത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: בְּמֵעַיִךְ
  choice: നിന്റെ ഉള്ളിൽ
  rationale: מֵעֶה ആന്തരിക അവയവങ്ങളെയോ ശരീരത്തിന്റെ അകഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഉള്ളിൽ’ ആ ശാരീരിക ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിനെ അതിയായി വൈദ്യശാസ്ത്രപരമാക്കുന്നില്ല.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: നിന്റെ വയർ വീർക്കുകയും
  rationale: בֶּטֶן എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘വയർ’ നിലനിർത്തുന്നു; צבה സൂചിപ്പിക്കുന്ന വീക്കം ഫലപ്രദമായി വ്യക്തമാക്കുന്നു.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും
  rationale: נפל എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘വീഴുക’ ആണെങ്കിലും, ഈ ദുഷ്കരമായ പ്രയോഗത്തിൽ ശരീരഭാഗത്തിനുണ്ടാകുന്ന നാശം സൂചിപ്പിക്കുന്നു. ‘ക്ഷയിച്ചുപോകുക’ കൃത്യമായ വൈദ്യഫലം നിർണ്ണയിക്കാതെ അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: יָרֵךְ
  choice: തുട
  rationale: יָרֵךְ എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘തുട/ഇടുപ്പ്’ ആണ്. പ്രത്യുത്പാദനാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയാകാമെങ്കിലും, മൂലപാഠത്തിന്റെ സൗമ്യോക്തി ‘തുട’ നിലനിർത്തുന്നു.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: അപ്പോൾ ആ സ്ത്രീ ... എന്നു പറയണം
  rationale: നിയമപരവും ആചാരപരവുമായ നിർദേശത്തിന്റെ ബലം ആധുനിക മലയാളത്തിൽ ‘പറയണം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אָמֵן אָמֵן
  choice: ആമേൻ, ആമേൻ
  rationale: ഇരട്ടിച്ചുള്ള ഗൗരവമേറിയ സമ്മതപ്രതികരണത്തിന്റെ ആരാധനാപരമായ രൂപവും ശക്തിയും അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപത്തിന്റെ ശാരീരിക ഫലങ്ങളുടെ വ്യാഖ്യാനം
  choice: ‘വയർ വീർക്കുക’, ‘തുട ക്ഷയിച്ചുപോകുക’ എന്ന താരതമ്യേന അക്ഷരാർഥപരവും വായനാസൗകര്യമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ഗർഭച്ഛിദ്രം, വന്ധ്യത, ഗർഭപാത്രത്തിന്റെ തകർച്ച, അല്ലെങ്കിൽ ജനനേന്ദ്രിയങ്ങളുടെ ക്ഷയം എന്നിങ്ങനെ വ്യക്തമായി നിർവചിക്കുക.
  rationale: ഹീബ്രു പ്രയോഗം ദുഷ്കരവും പ്രത്യുത്പാദനസംബന്ധമായ പീഡനത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയാകാൻ സാധ്യതയുള്ളതുമാണ്. എന്നാൽ കൃത്യമായ വൈദ്യഫലം വാക്യം അസന്ദിഗ്ധമായി പറയുന്നില്ല; അതിനാൽ ആ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആചാര ശൈലി. ദുഷ്കരമായ ഹീബ്രു ശരീരപ്രയോഗത്തിന്റെ അവ്യക്തത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
