revisions:
- from: ശാപം വരുത്തുന്ന ഈ ജലം നിന്റെ ഉള്ളിൽ കടന്ന് നിന്റെ വയർ വീർക്കുകയും നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യട്ടെ.[a] അപ്പോൾ ആ സ്ത്രീ, ‘ആമേൻ, ആമേൻ’ എന്നു പറയണം.
  to: ശാപം വരുത്തുന്ന ഈ ജലം നിന്റെ ആന്തരികാവയവങ്ങളിലേക്കു കടന്ന് നിന്റെ വയർ വീർക്കുകയും നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യട്ടെ.[a] അപ്പോൾ ആ സ്ത്രീ, ‘ആമേൻ, ആമേൻ’ എന്നു പറയണം.
  rationale: മുഖ്യപാഠത്തിൽ ‘ഉള്ളിൽ’ എന്ന പൊതുവായ പ്രയോഗത്തിനു പകരം ‘ആന്തരികാവയവങ്ങളിലേക്കു’ എന്നു നൽകി מֵעֶהയുടെ ശാരീരിക അർഥം നിലനിർത്തി. തുടയെ സംബന്ധിച്ച പ്രയോഗം മൂലപാഠത്തിൽ അവ്യക്തമായതിനാൽ ‘ക്ഷയിച്ചുപോകുക’ എന്ന വിവേകപൂർവമായ മുഖ്യവാചകം മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പിൽ ഒരു നിർദിഷ്ട പ്രത്യുത്പാദനഫലം ചുമത്താതിരിക്കാൻ ഭാഷ വ്യാപകമാക്കി.
