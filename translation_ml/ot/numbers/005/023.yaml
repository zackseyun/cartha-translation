source:
  edition: WLC
  text: וְ֠/כָתַב אֶת הָ/אָלֹ֥ת הָ/אֵ֛לֶּה הַ/כֹּהֵ֖ן בַּ/סֵּ֑פֶר וּ/מָחָ֖ה אֶל מֵ֥י הַ/מָּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ഈ ശാപങ്ങൾ ചുരുളിൽ എഴുതി അവയെ കയ്പുള്ള വെള്ളത്തിലേക്കു കഴുകിക്കളയണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ശപഥശാപങ്ങൾ.’ എബ്രായപദം ശപഥത്തോടു ബന്ധപ്പെട്ട ഒരു ശാപത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവയെ തുടച്ചുനീക്കണം’ / ‘മായ്ച്ചുകളയണം.’ എബ്രായക്രിയ എഴുതിയ വാക്കുകൾ തുടച്ചോ മായ്ച്ചോ നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: പിന്നെ ... എഴുതുകയും ... വേണം
  rationale: ചടങ്ങുസംബന്ധമായ നിയമനിർദേശങ്ങളുടെ ഈ പശ്ചാത്തലത്തിൽ, സംയോജകപ്രത്യയത്തോടുകൂടിയ ഖാൽ പൂർണ്ണക്രിയയ്ക്ക് ക്രമാനുസൃതമായ നിർദേശാർഥമുണ്ട്; അതിനാൽ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: ഈ ശാപവചനങ്ങൾ
  rationale: אָלָה എന്ന പദം ശാപത്തെയും, പ്രത്യേകിച്ച് ശപഥത്തോടു ബന്ധപ്പെട്ട ശാപത്തെയും സൂചിപ്പിക്കാം. ഇവിടെ എഴുതിവയ്ക്കുന്ന ഉച്ചരിക്കപ്പെട്ട ശാപങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ശാപവചനങ്ങൾ’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു, ശപഥസംബന്ധമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ഈ ആചാരത്തിൽ ഔദ്യോഗികമായി ശുശ്രൂഷ നിർവഹിക്കുന്ന വ്യക്തിക്കുള്ള പ്രമാണികവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: בַּסֵּפֶר
  choice: ചുരുളിൽ
  rationale: סֵפֶר ഇവിടെ ആധുനിക അർഥത്തിലുള്ള കെട്ടിയ പുസ്തകത്തേക്കാൾ എഴുത്തിനുപയോഗിച്ച പുരാതന രേഖയെയോ ചുരുളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: וּמָחָה
  choice: കഴുകിയിറക്കുകയും
  rationale: מחה എന്നത് തുടച്ചുനീക്കുക, മായ്ച്ചുകളയുക എന്നർഥമുള്ളതാണ്. ഇവിടെ എഴുത്ത് വെള്ളത്തിലേക്കു നീക്കപ്പെടുന്നതിനാൽ ‘കഴുകിയിറക്കുക’ ഭൗതികപ്രവൃത്തിയും അതിന്റെ ദിശയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶל
  choice: വെള്ളത്തിലേക്കു
  rationale: ദിശ സൂചിപ്പിക്കുന്ന ഈ പൂർവപ്രത്യയം, എഴുത്ത് വെള്ളത്തിലേക്കു മാറ്റുന്ന ആചാരപ്രവൃത്തിയുടെ പശ്ചാത്തലത്തിൽ ‘-ലേക്കു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מֵי הַמָּרִים
  choice: കയ്പുള്ള വെള്ളം
  rationale: അക്ഷരാർഥത്തിൽ ‘കയ്പിന്റെ വെള്ളം/കയ്പുള്ള വെള്ളം’; ആചാരത്തിലെ ദ്രാവകത്തെ സൂചിപ്പിക്കാൻ ഏകവചനരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
