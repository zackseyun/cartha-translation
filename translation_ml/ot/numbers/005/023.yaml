  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ നിയമ-ആചാരസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ഭാഷ ഉപയോഗിച്ചു. ‘ചുരുൾ,’ ‘ശാപവചനങ്ങൾ,’ ‘കഴുകിയിറക്കുക’ എന്നീ പദങ്ങൾ പുരാതന പ്രവൃത്തിയെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
