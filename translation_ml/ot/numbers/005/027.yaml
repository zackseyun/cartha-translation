reference: Numbers 5:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: ml
  text: അവൻ അവളെ ആ വെള്ളം കുടിപ്പിക്കുമ്പോൾ[a], അവൾ അശുദ്ധയായിത്തീരുകയും ഭർത്താവിനോടു വിശ്വാസവഞ്ചന കാണിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, ശാപം വരുത്തുന്ന ആ വെള്ളം അവളിൽ കടന്ന് കയ്പുണ്ടാക്കും; അവളുടെ വയർ വീർക്കുകയും തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യും[b]. അങ്ങനെ ആ സ്ത്രീ തന്റെ ജനത്തിനിടയിൽ ഒരു ശാപമായിത്തീരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു സാധ്യത: ‘അവൻ അവളെ ആ വെള്ളം കുടിപ്പിച്ചശേഷം.’ ഹീബ്രു വാക്യബന്ധം കാലസൂചകമായോ തുടർച്ചയായ സംഭവമായോ മനസ്സിലാക്കാം. ‘കയ്പുണ്ടാക്കും’ എന്നതിനു പിന്നിലെ ഹീബ്രു പ്രയോഗം ദുഷ്കരമാണ്; അത് വെള്ളത്തിന്റെ ഗുണത്തെയോ അതിന്റെ ഫലത്തെയോ സൂചിപ്പിക്കാം.'
    reason: grammatical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവളുടെ തുട വീഴും.’ പ്രത്യുത്പാദന അവയവങ്ങളെ ബാധിക്കുന്ന ഗുരുതരമായ ശരീരദുരിതത്തിന്റെ പരോക്ഷപ്രയോഗമായിരിക്കാം ഇത്; എന്നാൽ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: അവൻ അവളെ ആ വെള്ളം കുടിപ്പിക്കുമ്പോൾ
  rationale: שׁקה എന്ന ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥമായ ‘കുടിപ്പിക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള ഫലത്തെ പരിചയപ്പെടുത്താൻ സംയോജകത്തെ കാലസൂചക ഉപവാക്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: נִטְמְאָה
  choice: അവൾ തന്നെ അശുദ്ധയാക്കുകയും
  rationale: ആചാരപരവും ധാർമികവുമായ മലിനതയുടെ ആശയം ‘അശുദ്ധയാക്കുക’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിലെ സ്വയം ഉൾപ്പെട്ട പ്രവൃത്തിയെ ‘തന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: ഭർത്താവിനോടു വിശ്വാസവഞ്ചന കാണിക്കുകയും
  rationale: മעל എന്ന ധാതുവും അതിന്റെ സമാനപദവും ചേർന്ന പ്രയോഗത്തിലെ ശക്തമായ വിശ്വാസലംഘനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: ശാപം വരുത്തുന്ന ആ വെള്ളം
  rationale: വെള്ളം ശാപം വഹിക്കുകയോ നടപ്പാക്കുകയോ ചെയ്യുന്നു എന്ന പങ്കാളിത്തരൂപത്തിന്റെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לְמָרִים
  choice: കയ്പേറിയ ഫലം ഉളവാക്കും
  rationale: ദുഷ്കരമായ ഹീബ്രു പ്രയോഗത്തെ ഫലസൂചകമായി വായിക്കുന്നു; ‘കയ്പ്’ എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അർഥഗ്രാഹ്യമാക്കുന്നു, എന്നാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: അവളുടെ വയർ വീർക്കുകയും
  rationale: בטן എന്നതിന്റെ നേരിട്ടുള്ള ശരീരസൂചനയായ ‘വയർ’ ഉപയോഗിക്കുന്നു; ‘ഗർഭപാത്രം’ എന്നു കൂടുതൽ നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യും
  rationale: യഥാർഥത്തിൽ ‘തുട വീഴും’ എന്ന ദുഷ്കരമായ പ്രയോഗം ഗുരുതരമായ ശരീരക്ഷയത്തെ സൂചിപ്പിക്കാം; അവ്യക്തമായ ശരീരഭാഗം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രാഹ്യമായ ക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: ആ സ്ത്രീ തന്റെ ജനത്തിനിടയിൽ ഒരു ശാപമായിത്തീരും
  rationale: സമൂഹത്തിനുള്ളിൽ അവൾ ശാപത്തിന്റെ ഉദാഹരണമോ പരാമർശവിഷയമോ ആകുന്ന ആശയം, അതിനെ കൂടുതൽ വ്യാഖ്യാനിക്കാതെ, നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരീക്ഷണവിധിയിലെ ശരീരബാധയെ പ്രത്യേക വൈദ്യശാസ്ത്രപരമോ പ്രത്യുത്പാദനപരമോ ആയ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുക
  choice: ‘അവളുടെ വയർ വീർക്കുകയും തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യും’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുന്നു
  alternative: ‘അവളുടെ ഗർഭപാത്രം ചുരുങ്ങുകയും വയർ വീർക്കുകയും ചെയ്യും’ അല്ലെങ്കിൽ ‘അവളുടെ ജനനേന്ദ്രിയങ്ങൾ ക്ഷയിക്കും’
  rationale: ഹീബ്രു പാഠം വ്യക്തമായ ശരീരപദങ്ങൾ ഉപയോഗിക്കുന്നുണ്ടെങ്കിലും രണ്ടാമത്തെ പ്രയോഗത്തിന്റെ കൃത്യമായ ശാരീരിക സൂചന അനിശ്ചിതമാണ്. അതിനാൽ ഗർഭച്ഛിദ്രമോ വന്ധ്യതയോ ജനനേന്ദ്രിയബാധയോ ഉറപ്പിച്ച് ചേർക്കാതെ പാഠത്തിലെ വ്യാഖ്യാനപിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരവും ആചാരപരവുമായ സന്ദർഭം നിലനിർത്തുന്നു; ദുഷ്കരമായ ശരീരപ്രയോഗത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
