  to: അവൻ അവളെ ആ വെള്ളം കുടിപ്പിക്കുമ്പോൾ[a], അവൾ അശുദ്ധയായിത്തീരുകയും ഭർത്താവിനോടു വിശ്വാസവഞ്ചന കാണിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ, ശാപം വരുത്തുന്ന ആ വെള്ളം അവളിൽ കടന്ന് കയ്പുണ്ടാക്കും; അവളുടെ വയർ വീർക്കുകയും തുട ക്ഷയിച്ചുപോകുകയും ചെയ്യും[b]. അങ്ങനെ ആ സ്ത്രീ തന്റെ ജനത്തിനിടയിൽ ഒരു ശാപമായിത്തീരും.
  rationale: ലְמָרִים എന്ന ദുഷ്കരമായ പ്രയോഗത്തിൽ ഉറവിടത്തിലില്ലാത്ത ‘ഫലം’ എന്ന ആശയം നീക്കി, കയ്പിന്റെ ഫലസൂചനയും അതിന്റെ വ്യാഖ്യാനപരമായ അവ്യക്തതയും നിലനിർത്തി. നִטְמְאָהയ്ക്കായി നിഷ്ക്രിയരൂപമായ ‘അശുദ്ധയായിത്തീരുകയും’ ഉപയോഗിച്ചു. മറ്റ് പ്രധാന പദങ്ങളും അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
