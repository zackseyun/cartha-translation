  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: ml
  text: 'ഇതാണ് അസൂയയുടെ നിയമം[a]: ഒരു ഭാര്യ വഴിതെറ്റി[b] തന്റെ ഭർത്താവിന്റെ കീഴിൽ ഇരിക്കെ[c] അശുദ്ധയാകുമ്പോൾ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘അസൂയകൾ’ എന്നു ബഹുവചനമാണ്; അസൂയയുമായി ബന്ധപ്പെട്ട ഈ നിയമനടപടിയുടെ സാങ്കേതിക പേരായിരിക്കാം ഇത്.
    reason: lexical_alternative
  - marker: b
    text: ‘വഴിമാറി’ അല്ലെങ്കിൽ ‘തെറ്റിപ്പോയി’ എന്നും പരിഭാഷപ്പെടുത്താം. വിവാഹത്തിലെ അവിശ്വസ്തതയെ സൂചിപ്പിക്കുന്ന രൂപകമാണ് എബ്രായത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം ‘തന്റെ ഭർത്താവിന്റെ കീഴിൽ ഇരിക്കെ.’ ഇത് അവളുടെ വിവാഹബന്ധത്തെയോ ഭർത്താവുമായുള്ള വിവാഹപരമായ നിലയെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: ഇതാണ് ... നിയമം
  rationale: നിയമസംഗ്രഹം അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַקְּנָאֹת
  choice: അസൂയയെക്കുറിച്ചുള്ള
  rationale: എബ്രായത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ അസൂയയുമായി ബന്ധപ്പെട്ട നിയമനടപടിയുടെ സാങ്കേതിക ശീർഷകമായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ഏകവചനപ്രയോഗം സ്വീകരിച്ചു, മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: ഒരു ഭാര്യ ... വഴിതെറ്റി
  rationale: שׂטה എന്ന ക്രിയയുടെ വഴിമാറുക എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭം വിവാഹബന്ധമായതിനാൽ אִשָּׁה എന്നത് ‘ഭാര്യ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: תַּחַת אִישָׁהּ
  choice: തന്റെ ഭർത്താവിനോടുള്ള ബന്ധത്തിൽനിന്ന്
  rationale: അക്ഷരാർഥമായ ‘ഭർത്താവിന്റെ കീഴിൽ’ എന്ന എബ്രായ വിവാഹബന്ധപ്രയോഗത്തെ അസ്വാഭാവികമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആക്കാതെ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְנִטְמָאָה
  choice: അശുദ്ധയായിത്തീരുമ്പോൾ
  rationale: טמא എന്ന അശുദ്ധി ഭാഷ സംരക്ഷിക്കുന്നു; അതിനെ വെറും ആചാരപരമായ അശുദ്ധിയെന്നോ നേരിട്ട് വ്യഭിചാരമെന്നോ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അശുദ്ധിയുടെ സ്വഭാവം
  choice: അശുദ്ധയായിത്തീരുമ്പോൾ
  alternative: മലിനയായിത്തീരുമ്പോൾ; വ്യഭിചാരം ചെയ്യുമ്പോൾ
  rationale: സന്ദർഭം ലൈംഗിക അവിശ്വസ്തതയെക്കുറിച്ചാണെങ്കിലും മൂലപാഠം വ്യക്തമായ ‘വ്യഭിചാരം’ എന്ന പദത്തിനു പകരം അശുദ്ധിയുടെ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തി.
- issue: תַּחַת אִישָׁהּ എന്ന വിവാഹബന്ധപ്രയോഗം
  choice: തന്റെ ഭർത്താവിനോടുള്ള ബന്ധത്തിൽനിന്ന്
  alternative: തന്റെ ഭർത്താവിന്റെ കീഴിൽ ഇരിക്കെ
  rationale: മൂലത്തിലെ വിവാഹബന്ധ/അധികാര സൂചന സംരക്ഷിക്കുമ്പോഴും, ശാരീരിക സ്ഥാനമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ സംഗ്രഹത്തിന്റെ ഔപചാരികത നിലനിർത്തിയിട്ടുണ്ട്; അസ്വാഭാവികമായ അക്ഷരാനുവാദം ഒഴിവാക്കി മൂലത്തിലെ രൂപകവും അശുദ്ധി ഭാഷയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
