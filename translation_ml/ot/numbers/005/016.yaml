  text: וְ/הִקְרִ֥יב אֹתָ֖/הּ הַ/כֹּהֵ֑ן וְ/הֶֽעֱמִדָ֖/הּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ അവളെ അടുത്തേക്കു കൊണ്ടുവന്ന് യാഹ്‌വേയുടെ[a] മുമ്പിൽ നിർത്തണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: “YHWH,” ദൈവനാമം; പരമ്പരാഗതമായി “കർത്താവ്” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: അവളെ അടുത്തുകൊണ്ടുവന്ന്
  rationale: ഹിഫീൽ രൂപമായ קרב ഇവിടെ അവളെ അടുത്തേക്ക് കൊണ്ടുവരുക എന്ന സ്ഥലപരമായ അർഥം നൽകുന്നു. യാഗമായി അർപ്പിക്കുക എന്ന സാങ്കേതിക അർഥം അനാവശ്യമായി ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അത് നിലനിർത്തുന്നു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാക്രമപരവും നിയമപരവുമായ സന്ദർഭത്തിൽ כֹּהֵן എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: וְהֶעֱמִדָהּ
  choice: നിർത്തണം
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ കാരണാർഥം, അഥവാ ‘അവളെ നിൽക്കുമാറാക്കുക,’ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִפְנֵי
  choice: മുമ്പിൽ
  rationale: ഒരാളുടെ സന്നിധിയിലുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്ന ഈ ഉപസർഗപ്രയോഗത്തിന് ചുരുക്കവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-നെ മലയാള ബൈബിൾ വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; ഇത് ഒരു പദവികൊണ്ട് നാമത്തെ മാറ്റിസ്ഥാപിക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ദൈവത്തിന്റെ വ്യക്തിനാമമായ YHWH നേരിട്ടുണ്ട്. മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിക്കുകയും, അടിക്കുറിപ്പിൽ ഹീബ്രു രൂപവും മറ്റൊരു ലിപ്യന്തരവും പരമ്പരാഗത പദവിയും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നിയമനിർദേശ ശൈലി. ഹീബ്രുവിലെ രണ്ടു കാരണാർഥ ക്രിയകളുടെയും ക്രമവും അർഥവും സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
