  terminology: ‘ത്വഗ്രോഗം’ צרועַ എന്ന ആചാരനിയമസന്ദർഭത്തിലെ വിശാലമായ ത്വക്കുബാധയെ അനാവശ്യമായി ആധുനിക കുഷ്ഠരോഗമായി ചുരുക്കുന്നില്ല. ‘അശുദ്ധർ’ טָמֵאയുടെ ആചാരപരമായ അർഥം നിലനിർത്തുന്നു. അവസാന പ്രയോഗത്തിന്റെ മൃതദേഹ-അശുദ്ധി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
