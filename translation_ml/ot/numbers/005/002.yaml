id: NUM.5.2
reference: Numbers 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: ml
  text: ത്വഗ്രോഗമുള്ള[a] എല്ലാവരെയും, സ്രവമുള്ള എല്ലാവരെയും, മൃതശരീരം നിമിത്തം അശുദ്ധരായ[b] എല്ലാവരെയും പാളയത്തിൽനിന്ന് പുറത്താക്കാൻ ഇസ്രായേൽമക്കളോടു കല്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുഷ്ഠബാധയുള്ള എല്ലാവരെയും.” എബ്രായപദം ആചാരശുദ്ധിനിയമങ്ങളുടെ പശ്ചാത്തലത്തിൽ ഗുരുതരമായ പലതരം ത്വക്കുബാധകളെ സൂചിപ്പിക്കാം; അത് ആധുനിക കുഷ്ഠരോഗത്തിൽ (ഹാൻസൻ രോഗത്തിൽ) മാത്രം ഒതുങ്ങുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരു വ്യക്തി/ജീവൻ നിമിത്തം അശുദ്ധരായവർ.” ഈ തോറാ-പ്രയോഗം മൃതദേഹവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: കല്പിക്കുക
  rationale: മോശെയോട് ഏകവചനത്തിൽ പറയുന്ന ശക്തമായ ആജ്ഞയുടെ ഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കൂട്ടായ ഉടമ്പടി-ജനസൂചനയെ മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്താക്കണം
  rationale: שלח എന്ന ക്രിയയുടെയും מן המחנה എന്ന ദിശാസൂചനയുടെയും അർഥം ചേർത്ത് വ്യക്തമായ മലയാള നിർദേശമായി നൽകുന്നു; ശിക്ഷാത്മകമായ അധികഭാവം ചേർക്കുന്നില്ല.
- source_word: כָּל צָרוּעַ
  choice: ത്വഗ്രോഗമുള്ള എല്ലാവരെയും
  rationale: צרע എന്ന പദം ആധുനിക ഹാൻസൻ രോഗത്തിൽ മാത്രം ഒതുങ്ങുന്നില്ല; ആചാരശുദ്ധിനിയമങ്ങളിലെ വിശാലമായ ത്വക്ക് ബാധയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ത്വഗ്രോഗം’ തിരഞ്ഞെടുത്തു.
- source_word: וְכָל זָב
  choice: സ്രവമുള്ള എല്ലാവരെയും
  rationale: ശരീരത്തിൽനിന്നുള്ള അസാധാരണ സ്രവമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നിയമപരമായ പദം സംക്ഷിപ്തമായും അനാവശ്യ വൈദ്യവിശദീകരണമില്ലാതെയും നൽകുന്നു.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: മൃതശരീരം നിമിത്തം അശുദ്ധരായ എല്ലാവരെയും
  rationale: ഇവിടെ נֶפֶשׁ മൃതനായ മനുഷ്യനെയോ മൃതദേഹത്തെയോ സൂചിപ്പിക്കുന്ന തോറാ-പ്രയോഗമാണ്; മൃതദേഹവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആചാരപരമായ അശുദ്ധിയുടെ പദപ്രയോഗം
  choice: അശുദ്ധർ
  alternative: മലിനർ / അശുദ്ധീകരിക്കപ്പെട്ടവർ
  rationale: טָמֵא ഇവിടെ വ്യക്തിപരമായ പാപവിധിയല്ല, പാളയത്തിന്റെ വിശുദ്ധിയുമായി ബന്ധപ്പെട്ട ആചാരപരമായ നിലയാണ്. ‘അശുദ്ധർ’ ഈ വ്യത്യാസം അധികമായി ധാർമികവൽക്കരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. നിയമപരമായ നിർദേശത്തിന്റെ ശക്തി നിലനിർത്തിയിട്ടും അനാവശ്യമായി കടുപ്പമുള്ളതോ ശിക്ഷാത്മകമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. ‘ത്വഗ്രോഗം’ എന്നതിലെ സാധ്യതയുള്ള തെറ്റിദ്ധാരണ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
