source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ആ സ്ത്രീയെ യഹ്‌വെയുടെ സന്നിധിയിൽ നിർത്തും; അവളുടെ മുടി അഴിച്ചിടും.[a] സ്മരണാർഥമായ ധാന്യയാഗം—അത് അസൂയയുടെ ധാന്യയാഗമാണ്—അവളുടെ കൈകളിൽ വെക്കും. ശാപം വരുത്തുന്ന കയ്പുള്ള ജലം പുരോഹിതന്റെ കൈയിൽ ഇരിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്ത്രീയുടെ തല അനാവൃതമാക്കും’ അഥവാ ‘അവളുടെ മുടി അഴിഞ്ഞുകിടക്കാൻ വിടും.’ എബ്രായ പ്രയോഗത്തിൽ സ്ത്രീയുടെ ‘തല’ പരാമർശിക്കുന്നുണ്ടെങ്കിലും, ഈ ആചാരസന്ദർഭത്തിൽ അതു മുടിക്കെട്ട് അഴിക്കുന്നതിനെയോ മുടി സ്വതന്ത്രമായി തൂങ്ങാൻ വിടുന്നതിനെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ശാപം വരുത്തുന്ന ആ കയ്പുള്ള ജലം.’ എബ്രായ കൃദ്‌രൂപം ഈ ജലം ശാപം ഫലവത്താക്കുന്നതായോ ശാപം വഹിക്കുന്നതായോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: നിർത്തി
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ഒരാളെ ഔദ്യോഗികമായി നിർത്തുകയോ ഹാജരാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആചാരപരമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വെയുടെ സന്നിധിയിൽ
  rationale: ദൈവസാന്നിധ്യത്തിൽ നിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ആരാധനാക്രമപരമായ പ്രയോഗം; יהוה എന്ന ഉടമ്പടിനാമം യഹ്‌വെ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: അവളുടെ മുടി അഴിച്ചിടണം
  rationale: പ്രയോഗത്തിൽ അക്ഷരാർഥത്തിൽ സ്ത്രീയുടെ ‘തല’ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, פרע ഇവിടെ കെട്ടിയ മുടി അഴിക്കുക അല്ലെങ്കിൽ സ്വതന്ത്രമായി തൂങ്ങാൻ വിടുക എന്ന ആചാരനടപടിയെ സൂചിപ്പിക്കാം. പ്രധാനവാചകം ഈ സാധ്യത സ്വീകരിക്കുകയും അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: അവളുടെ കൈകളിൽ വെക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘അവളുടെ ഉള്ളംകൈകളിന്മേൽ’ എന്നാണെങ്കിലും, മലയാളത്തിൽ ‘കൈകളിൽ’ എന്നത് ആ കൃത്യമായ ആചാരചലനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: ഓർമയ്ക്കായുള്ള ധാന്യയാഗം
  rationale: പുരോഹിതസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗമാണ്; זִכָּרוֹן ഓർമയെയോ ഓർമപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യബന്ധം അമിതമായി നിർവചിക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: അത് അസൂയയുടെ ധാന്യയാഗമാണ്
  rationale: קְנָאֹת രൂപത്തിൽ ബഹുവചനമാണെങ്കിലും ഇവിടെ അമൂർത്തമായ ആശയമായി പ്രവർത്തിക്കുന്നു. ‘ധാന്യയാഗം’ ആവർത്തിക്കുന്നത് എബ്രായ സമാനാധികരണഘടന നിലനിർത്തുന്നു.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: പുരോഹിതന്റെ കൈയിൽ ഉണ്ടായിരിക്കണം
  rationale: ആചാരത്തിനിടെ പുരോഹിതൻ കൈവശം വെക്കുന്നതിനെ വിവരിക്കുന്ന സാഹചര്യവാക്യമാണ്; ‘കൈ’ എന്ന ഏകവചനം എബ്രായത്തെ പിന്തുടരുന്നു.
- source_word: מֵי הַמָּרִים
  choice: കയ്പുള്ള ജലം
  rationale: מַיִם എബ്രായത്തിൽ രൂപപരമായി ബഹുവചനമായിരുന്നാലും ‘ജലം’ എന്ന ദ്രവ്യനാമം മലയാളത്തിൽ സ്വാഭാവിക ഏകവചനമാണ്.
- source_word: הַמְאָרֲרִים
  choice: ശാപം വരുത്തുന്ന
  rationale: ארר-ൽനിന്നുള്ള കർത്തൃവാചക കൃല്ലിംഗം ഈ ജലം ശാപം ഫലവത്താക്കുന്നതോ വഹിക്കുന്നതോ സൂചിപ്പിക്കുന്നു; കാര്യകാരണഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാൽ മാറ്റാതെ, ഉടമ്പടിനാമമായി ആധുനിക മലയാളത്തിൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: קְנָאֹת എന്നതിന്റെ സംഖ്യയും അർഥവ്യാപ്തിയും
  choice: അസൂയ
  alternative: അസൂയകൾ; തീക്ഷ്ണവികാരം
  rationale: രൂപം ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ അമൂർത്തമായ ‘അസൂയ/തീക്ഷ്ണാവകാശബോധം’ എന്ന അർഥത്തിലാണ്. ‘അസൂയ’ മൂലത്തിലെ സംഘർഷം നിലനിർത്തുകയും വ്യാഖ്യാനപരമായ വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആചാരഭാഷ ഉപയോഗിച്ചു. ദീർഘമായ എബ്രായ വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; പ്രവർത്തികളുടെ ക്രമവും സമാനാധികരണവും നിലനിർത്തി. ‘മുടി അഴിച്ചിടണം’ എന്ന പ്രധാനവായനയോടൊപ്പം യഥാർഥ ശബ്ദാർഥവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
