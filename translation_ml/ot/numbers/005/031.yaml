    text: അഥവാ, ‘ആ ഭർത്താവ് കുറ്റബാധ്യതയിൽനിന്ന് വിമുക്തനായിരിക്കും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ അകൃത്യം വഹിക്കും’; ഈ എബ്രായ ശൈലിക്ക് അവളുടെ കുറ്റത്തിന്റെ പരിണതികൾ വഹിക്കുക എന്ന ആശയവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: ഒഴിവുള്ളവനായിരിക്കും
  rationale: നָקָה എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ബാധ്യതയിൽനിന്നോ കുറ്റത്തിൽനിന്നോ വിമുക്തനായിരിക്കുക എന്ന അർഥം നൽകുന്നു. מִן ചേർന്ന ഈ പ്രയോഗത്തിൽ ‘കുറ്റത്തിൽനിന്ന് ഒഴിവുള്ളവൻ’ എന്നത് സ്വാഭാവികവും നിയമ-ധാർമ്മിക ആശയം നിലനിർത്തുന്നതുമാണ്.
- source_word: הָאִישׁ
  choice: ആ പുരുഷൻ
  rationale: אִישׁ എന്നതിന്റെ ഔപചാരികമായി അടുത്ത അർഥം ‘പുരുഷൻ’ എന്നാണ്. സന്ദർഭത്തിൽ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മുഖ്യപാഠത്തിൽ അതിനെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: מֵעָוֺן
  choice: കുറ്റത്തിൽനിന്ന്
  rationale: עָוֹן പാപം, കുറ്റം, കുറ്റബാധ്യത, അതിന്റെ പരിണതി എന്നിവ സൂചിപ്പിക്കാം. נקה എന്ന ക്രിയയോടൊപ്പം ഇവിടെ കുറ്റബാധ്യതയിൽനിന്നുള്ള ഒഴിവാണ് പ്രധാനം; ‘കുറ്റം’ ഈ ബഹുവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: എന്നാൽ ആ സ്ത്രീ
  rationale: וְ അടിസ്ഥാനമായി ‘കൂടാതെ/അപ്പോൾ’ എന്ന ബന്ധകമാണെങ്കിലും രണ്ടു ഉപവാക്യങ്ങൾ തമ്മിൽ വ്യക്തമായ വൈരുധ്യമുണ്ട്. ‘എന്നാൽ’ അത് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘ആ സ്ത്രീ’ הַהִוא എന്ന നിർദ്ദേശക ഊന്നൽ സൂക്ഷിക്കുന്നു.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: തന്റെ കുറ്റം വഹിക്കും
  rationale: נשׂא עָוֹן എന്ന എബ്രായ ശൈലി കുറ്റം വഹിക്കുക എന്നും പലപ്പോഴും അതിന്റെ പരിണതിയും അനുഭവിക്കുക എന്നും സൂചിപ്പിക്കുന്നു. ‘കുറ്റം വഹിക്കും’ ശൈലിയെ സംക്ഷിപ്തമായി സംരക്ഷിക്കുകയും അതിന്റെ പരിണതിബോധം വ്യാഖ്യാനത്തിലൂടെ മാത്രം നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള עָוֹן എന്ന പദത്തിന്റെ അർഥം
  choice: രണ്ടിടത്തും ‘കുറ്റം’ എന്ന ആശയം നിലനിർത്തുക
  alternative: ‘അകൃത്യം’ അല്ലെങ്കിൽ ‘അകൃത്യത്തിനുള്ള ശിക്ഷ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: പുരുഷൻ കുറ്റബാധ്യതയിൽനിന്ന് ഒഴിവാകുന്നതും സ്ത്രീ തന്റെ കുറ്റം വഹിക്കുന്നതും തമ്മിലുള്ള നിയമ-ധാർമ്മിക സമാന്തരത ഇതിലൂടെ നിലനിൽക്കുന്നു. കുറ്റം തന്നെയോ അതിന്റെ പരിണതിയോ എന്ന എബ്രായത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. നിയമ-ധാർമ്മിക സമാന്തരതയും എബ്രായ ശൈലിയുടെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചിരിക്കുന്നു.
