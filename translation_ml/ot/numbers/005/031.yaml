  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: ml
  text: അപ്പോൾ ആ പുരുഷൻ കുറ്റബാധ്യതയിൽനിന്ന് വിമുക്തനായിരിക്കും[a]; എന്നാൽ ആ സ്ത്രീ തന്റെ കുറ്റം വഹിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
