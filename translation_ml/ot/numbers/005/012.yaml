source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי תִשְׂטֶ֣ה אִשְׁתּ֔/וֹ וּ/מָעֲלָ֥ה ב֖/וֹ מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു സംസാരിച്ച് അവരോടു പറയുക: ഒരു പുരുഷന്റെ ഭാര്യ വഴിതെറ്റുകയും അവനോടു ഗുരുതരമായ വിശ്വാസവഞ്ചന നടത്തുകയും ചെയ്താൽ,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗുരുതരമായ വിശ്വാസവഞ്ചന നടത്തുക” ഹീബ്രുവിലെ ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന ഊന്നൽപ്രയോഗത്തെ അവതരിപ്പിക്കുന്നു; അതിന്റെ അർഥം അവനോടു ഗുരുതരമായി അവിശ്വസ്തത പ്രവർത്തിക്കുക എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: സംസാരിക്കുക
  rationale: ദൈവിക നിർദേശം മോശെയോട് ആരംഭിക്കുന്ന ആജ്ഞാരൂപം; നിയമപ്രഖ്യാപനത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ സമൂഹനാമം.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: മൂലത്തിലെ തുടർച്ചയായ സംസാരസൂത്രം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഏതെങ്കിലും ഒരു പുരുഷന്റെ
  rationale: ആവർത്തിച്ചുള്ള ‘പുരുഷൻ, പുരുഷൻ’ എന്ന വിതരണാർഥം ‘ഏതെങ്കിലും ഒരു പുരുഷൻ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כִּי
  choice: ചെയ്താൽ
  rationale: നിയമപരമായ സംഭവവ്യവസ്ഥയിൽ നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സോപാധിക ക്രിയാന്ത്യം ഉപയോഗിക്കുന്നു.
- source_word: תִשְׂטֶה
  choice: വഴിതെറ്റുക
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ പ്രവൃത്തി വ്യക്തമാക്കുന്നതിനു മുമ്പ്, മൂലത്തിലെ രൂപകാലങ്കാരപരമായ ‘തിരിഞ്ഞുപോകുക/വഴിതെറ്റുക’ എന്ന അർഥം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- source_word: אִשְׁתּוֹ
  choice: അവന്റെ ഭാര്യ
  rationale: ഭർത്താവുമായുള്ള ബന്ധവും മൂലത്തിലെ ഉടമസ്ഥസർവനാമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּמָעֲלָה ... מָעַל
  choice: വിശ്വാസവഞ്ചന കാണിക്കുക
  rationale: ഒരേ ധാതുവിലുള്ള ക്രിയ-നാമ ആവർത്തനം സൂചിപ്പിക്കുന്ന അവിശ്വസ്തതയും ബന്ധവഞ്ചനയും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ആവർത്തനത്തിന്റെ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: בּוֹ
  choice: അവനോട്
  rationale: ഈ ബന്ധവഞ്ചനയാൽ ദോഷം നേരിടുന്ന ഭർത്താവിനോടുള്ള ദിശ/ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിനോടുള്ള ലിംഗസൂചക സമൂഹസംബോധന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധമുള്ള സമൂഹനാമം നിലനിർത്തുമ്പോഴും, ആധുനിക മലയാളത്തിൽ മുഴുവൻ ഇസ്രായേൽ സമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ രൂപം സ്വീകരിക്കുന്നു.
- issue: മַעַל എന്ന ബന്ധപരവും ഉടമ്പടിപരവുമായ അവിശ്വസ്തത
  choice: വിശ്വാസവഞ്ചന കാണിക്കുക
  alternative: അവനോട് അവിശ്വസ്തയാകുക
  rationale: വ്യഭിചാരം എന്നു മുൻകൂട്ടി അമിതമായി വ്യക്തമാക്കാതെ, മൂലത്തിലെ വിശ്വാസലംഘനത്തിന്റെയും വഞ്ചനയുടെയും ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമവചനശൈലി. ‘ഇസ്രായേൽമക്കൾ’ എന്ന പരിചിതമായ സമൂഹനാമവും ‘വിശ്വാസവഞ്ചന’ എന്ന ഗൗരവമുള്ള ബന്ധപരമായ പദവും ഉപയോഗിച്ചു; ഹീബ്രുവിലെ അപൂർവമായ ധാതു-ആവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
