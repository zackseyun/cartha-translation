source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: ml
  text: എന്നാൽ ആ സ്ത്രീ സ്വയം അശുദ്ധയാക്കിയിട്ടില്ല, അവൾ ശുദ്ധയുമാണെങ്കിൽ, അവൾ കുറ്റവിമുക്തയാകും; അവൾ ഗർഭം ധരിക്കുകയും ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “വിത്തിനാൽ വിതയ്ക്കപ്പെടും”; ഗർഭം ധരിക്കുകയോ സന്തതി ഉണ്ടാകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ പ്രതികൂല ഫലത്തിനോടു വിപരീതമായ സാഹചര്യം അവതരിപ്പിക്കുന്ന നിബന്ധനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֹא נִטְמְאָה
  choice: സ്വയം അശുദ്ധയാക്കിയിട്ടില്ല
  rationale: വ്യഭിചാരപരിശോധനയുടെ പശ്ചാത്തലത്തിലുള്ള ലൈംഗിക-ധാർമിക അശുദ്ധിയെ സൂചിപ്പിക്കുകയും നിഫാൽ രൂപത്തിന് സന്ദർഭത്തിൽ സാധ്യമായ പ്രതിഫലനാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: നിർദിഷ്ട സ്ത്രീയെ സൂചിപ്പിക്കുന്ന ഹീബ്രു നിർദിഷ്ട നാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: וּטְהֹרָה הִוא
  choice: അവൾ ശുദ്ധയുമാണ്
  rationale: טָהוֹר എന്ന പദത്തിന്റെ ആചാരപരവും ധാർമികവുമായ ശുദ്ധി എന്ന അർഥം അതിശയോക്തിയില്ലാതെ നൽകുന്നു.
- source_word: וְנִקְּתָה
  choice: അവൾ കുറ്റവിമുക്തയാകും
  rationale: נקה എന്ന നിഫാൽ രൂപത്തിലെ വിമുക്തയാകുക, നിരപരാധിയെന്നു തെളിയുക എന്ന അർഥം ഈ ആരോപണ-പരിശോധനാ സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: וְנִזְרְעָה זָרַע
  choice: അവൾ സന്തതിയെ ഗർഭം ധരിക്കുകയും ചെയ്യും
  rationale: അക്ഷരാർഥത്തിൽ ‘വിത്തിനാൽ വിതയ്ക്കപ്പെടും’ എന്ന ഹീബ്രു പ്രയോഗം ഗർഭധാരണത്തെയും സന്തതിയെയും സൂചിപ്പിക്കുന്നു; പ്രസവം വരെ അർഥം വികസിപ്പിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കുറ്റവിമുക്തയായ സ്ത്രീക്കു വാഗ്ദാനം ചെയ്യുന്ന ഫലത്തിന്റെ സ്വഭാവം
  choice: അവൾ കുറ്റവിമുക്തയാകുകയും സന്തതിയെ ഗർഭം ധരിക്കുകയും ചെയ്യും
  alternative: അവൾക്കു ഗർഭം ധരിക്കാൻ കഴിയും / അവളുടെ ഫലഭൂയിഷ്ഠത തുടരും
  rationale: ഹീബ്രു ക്രിയ നേരിട്ട് ഭാവിയിലെ ഗർഭധാരണത്തെ പ്രസ്താവിക്കുന്നു. ‘കഴിയും’ എന്നു ചേർത്താൽ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ശേഷി എന്ന ആശയം വരും; അതിനാൽ ഉറപ്പിന്റെ സ്വാഭാവിക ഭാവം നിലനിർത്തി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരിശോധനയുടെ പശ്ചാത്തലം സൂചിപ്പിക്കാൻ ‘കുറ്റവിമുക്തയാകും’ ഉപയോഗിച്ചു; ഹീബ്രു ഉപമയുടെ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
