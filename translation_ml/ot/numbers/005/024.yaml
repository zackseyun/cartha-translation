id: NUM.5.24
reference: Numbers 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: ml
  text: പിന്നെ അവൻ ശാപം വരുത്തുന്ന കയ്പുള്ള വെള്ളം ആ സ്ത്രീയെക്കൊണ്ട് കുടിപ്പിക്കണം[a]. ശാപം വരുത്തുന്ന ആ വെള്ളം അവളുടെ ഉള്ളിൽ കടന്ന് കയ്പുണ്ടാക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ശാപം വരുത്തുന്ന കയ്പിന്റെ വെള്ളങ്ങൾ.’ വെള്ളത്തെ സൂചിപ്പിക്കാൻ ഹീബ്രു ഇവിടെ ബഹുവചനരൂപം ഉപയോഗിക്കുന്നു; ഇത് ഹീബ്രുവിലെ സാധാരണ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: ‘ശാപം വരുത്തുന്ന ആ വെള്ളം കയ്പിനായി അവളുടെ ഉള്ളിൽ കടക്കും.’ അവസാനത്തെ ഹീബ്രു പ്രയോഗം കയ്പേറിയ ഫലമോ അനുഭവമോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: അവൻ ... ആ സ്ത്രീയെക്കൊണ്ട് കുടിപ്പിക്കണം
  rationale: שׁקה എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കുടിപ്പിക്കുക’ എന്ന കാരണാർത്ഥം നൽകുന്നു. മലയാളത്തിൽ ‘സ്ത്രീയെക്കൊണ്ട് കുടിപ്പിക്കണം’ എന്നു പറയുന്നത് ഈ കാരണാർത്ഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: הָאִשָּׁה
  choice: ആ സ്ത്രീ
  rationale: നിശ്ചിതത്വമുള്ള നാമത്തെ സന്ദർഭാനുസൃതമായി ‘ആ സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מֵי הַמָּרִים
  choice: കയ്പുള്ള വെള്ളം
  rationale: അക്ഷരാർഥത്തിൽ ‘കയ്പിന്റെ വെള്ളങ്ങൾ’ എന്ന നിർമാണമാണെങ്കിലും, ദ്രവ്യത്തെ സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ ഏകവചനമായ ‘വെള്ളം’ സ്വാഭാവികമാണ്; ‘കയ്പുള്ള’ എന്നത് അതിന്റെ ഗുണം വ്യക്തമാക്കുന്നു.
- source_word: הַמְאָֽרֲרִים / הַמְאָרֲרִים
  choice: ശാപം വരുത്തുന്ന
  rationale: ארר എന്ന ധാതുവിൽനിന്നുള്ള കർത്തൃവാചക രൂപം ഈ വെള്ളം ശാപത്തിന്റെ ഫലം വഹിക്കുകയോ നടപ്പാക്കുകയോ ചെയ്യുന്നതായി അവതരിപ്പിക്കുന്നു; വെള്ളം തന്നെയാണ് ‘ശപിക്കപ്പെട്ടത്’ എന്നു നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
- source_word: וּבָאוּ בָהּ
  choice: അവളുടെ ഉള്ളിൽ കടന്ന്
  rationale: בוא എന്ന ക്രിയയോടുകൂടിയ ב അവളുടെ ശരീരത്തിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. ‘ഉള്ളിൽ കടന്ന്’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לְמָרִים
  choice: അവൾക്കു കയ്പായിത്തീരും
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ ഫലമോ അനുഭവമോ സൂചിപ്പിക്കാം. ഈ പരിഭാഷ ദോഷകരമായ കയ്പിന്റെ ഫലം നിലനിർത്തുന്നു; നിർദിഷ്ടമായ ശാരീരിക പ്രത്യാഘാതം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പരീക്ഷണച്ചടങ്ങിലെ ശാപഭാഷയുടെ സ്വഭാവം
  choice: വെള്ളത്തെ ‘ശാപം വരുത്തുന്ന’ എന്ന് വിശേഷിപ്പിച്ചു.
  alternative: ‘ശപിക്കപ്പെട്ട വെള്ളം’
  rationale: ארר എന്ന ധാതുവിൽനിന്നുള്ള കർത്തൃവാചക രൂപം, കുറ്റമുണ്ടെങ്കിൽ ഉടമ്പടിശാപം നടപ്പാകുന്നതിനുള്ള വെള്ളത്തിന്റെ പങ്കിനെയാണ് കൂടുതൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ഇതിലൂടെ മന്ത്രവാദപരമായ ആശയം ഇറക്കുമതി ചെയ്യാതെ ന്യായവിധി-ചടങ്ങിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- issue: לְמָרִים എന്ന അവസാന പ്രയോഗത്തിന്റെ ഫലം
  choice: ‘അവൾക്കു കയ്പായിത്തീരും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കയ്പിനായി അവളുടെ ഉള്ളിൽ കടക്കും’
  rationale: ഹീബ്രു പ്രയോഗം ഫലം, ലക്ഷ്യം, അല്ലെങ്കിൽ കയ്പേറിയ അനുഭവം എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതാണ്. മുഖ്യപാഠം സ്വാഭാവിക മലയാളത്തിൽ ഫലത്തെ സൂചിപ്പിക്കുന്നു; കൂടുതൽ ഔപചാരികമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ആവർത്തനം നിലനിർത്തി; ‘വെള്ളങ്ങൾ’ എന്ന ബഹുവചനം മലയാളത്തിലെ സ്വാഭാവിക ദ്രവ്യനാമപ്രയോഗത്തിന് അനുസരിച്ച് ഏകവചനമാക്കി. അവസാന പ്രയോഗത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
