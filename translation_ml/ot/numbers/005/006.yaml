id: NUM.5.6
reference: Numbers 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: ml
  text: '“ഇസ്രായേൽമക്കളോടു പറയുക: ഒരു പുരുഷനോ സ്ത്രീയോ മനുഷ്യർ ചെയ്യുന്ന ഏതെങ്കിലും പാപം ചെയ്തു യഹോവയോടു വിശ്വാസവഞ്ചന കാണിക്കുന്നവിധം പ്രവർത്തിച്ചാൽ, ആ വ്യക്തി കുറ്റക്കാരനായിത്തീരും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: പറയുക
  rationale: പീയേൽ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള കല്പനാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ കുടുംബപരവും ഉടമ്പടിപരവുമായ പ്രയോഗം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ രൂപം.
- source_word: אִישׁ אֽוֹ אִשָּׁה
  choice: ഒരു പുരുഷനോ സ്ത്രീയോ
  rationale: നിയമം ഇരുപാലരിലുമുള്ള ഏതൊരു വ്യക്തിക്കും ബാധകമാണെന്ന മൂലത്തിലെ വ്യക്തമായ ജോടി സംരക്ഷിക്കുന്നു.
- source_word: כִּי יַעֲשׂוּ
  choice: ചെയ്താൽ
  rationale: വിതരണാർഥമുള്ള ഏകവചന വിഷയത്തിനു പിന്നാലെയുള്ള രൂപപരമായ ബഹുവചനക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക വ്യവസ്ഥാവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: മനുഷ്യർ ചെയ്യുന്ന ഏതെങ്കിലും പാപം
  rationale: הָאָדָם ഇവിടെ പുരുഷനെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പദബന്ധത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לִמְעֹל מַעַל
  choice: അവിശ്വസ്തത കാണിക്കുക
  rationale: ധാതുവും സമാനനാമവും ചേർന്ന ഊന്നൽ പൂർണമായി ആവർത്തിക്കാതെ, വിശ്വാസലംഘനത്തിന്റെയും ഉടമ്പടിദ്രോഹത്തിന്റെയും ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: בַיהוָה
  choice: യഹോവയോടു
  rationale: מעל എന്ന ക്രിയയോടൊപ്പമുള്ള ב വിശ്വാസലംഘനം യഹോവയ്ക്കെതിരായതാണെന്ന് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യഹോവയോടു അവിശ്വസ്തത’ സ്വാഭാവികമാണ്.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: ആ വ്യക്തി കുറ്റക്കാരനാകുന്നു
  rationale: נפש ഇവിടെ സാങ്കേതിക അർഥത്തിലുള്ള ‘ആത്മാവ്’ അല്ല, വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; אָשֵׁם കുറ്റബാധ്യതയുടെ അവസ്ഥ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു; ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ LORD എന്ന പതിവ് മലയാളത്തിലേക്ക് യാന്ത്രികമായി മാറ്റുന്നില്ല.
- issue: הָאָדָם എന്ന പദത്തിന്റെ പൊതുമാനവ അർഥം
  choice: മനുഷ്യർ
  alternative: മനുഷ്യവർഗം
  rationale: ഈ നിയമപ്രയോഗത്തിൽ പദം പുരുഷലിംഗമുള്ള ഒരാളെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. സാധാരണ മനുഷ്യർ ചെയ്യുന്ന പാപങ്ങൾ എന്ന പൊതുവായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- issue: לִמְעֹל מַעַל എന്ന വിശ്വാസലംഘന പ്രയോഗം
  choice: അവിശ്വസ്തത കാണിക്കുക
  alternative: ദ്രോഹം പ്രവർത്തിക്കുക
  rationale: ഉടമ്പടിപരമായ വിശ്വാസലംഘനത്തിന്റെ ഭാരം നിലനിർത്തിക്കൊണ്ട്, പ്രത്യേക സാങ്കേതികമോ വിഭാഗീയമോ ആയ കുറ്റവർഗം നിർബന്ധിച്ച് ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമവാക്യത്തിന്റെ വ്യവസ്ഥാഭാവവും മൂലത്തിലെ പുരുഷൻ–സ്ത്രീ ഉൾക്കൊള്ളലും വിശ്വാസലംഘനത്തിന്റെ ആശയവും സംരക്ഷിച്ചിട്ടുണ്ട്.
