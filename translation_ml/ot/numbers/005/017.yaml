id: NUM.5.17
reference: Numbers 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ഒരു മൺപാത്രത്തിൽ[b] വിശുദ്ധജലം[a] എടുക്കണം. സമാഗമകൂടാരത്തിന്റെ നിലത്തുള്ള[c] പൊടിയിൽനിന്ന് കുറച്ച് പുരോഹിതൻ എടുത്ത് ആ വെള്ളത്തിൽ ഇടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പവിത്രജലം.’ എബ്രായപദം ഇവിടെ ആചാരപരമായ ഉപയോഗത്തിനായി വിശുദ്ധമായി വേർതിരിച്ച വെള്ളത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കളിമൺപാത്രത്തിൽ’ അല്ലെങ്കിൽ ‘മൺകലത്തിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ‘നിലം’ എന്നതിനു ‘തറ’ എന്നും വിവർത്തനം ചെയ്യാം; എബ്രായപദത്തിന് നിലം, തറ എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: വിശുദ്ധജലം
  rationale: പദസമുച്ചയം ആചാരപരമായ ഉപയോഗത്തിനായി വേർതിരിക്കപ്പെട്ട ‘വിശുദ്ധമായ വെള്ളം’ എന്നു നേരിട്ട് സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വിശുദ്ധജലം’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: בִּכְלִי חָרֶשׂ
  choice: ഒരു മൺപാത്രത്തിൽ
  rationale: כְּלִי ഒരു പാത്രത്തെയും חָרֶשׂ മണ്ണുകൊണ്ടുള്ള പാത്രസാമഗ്രിയെയും സൂചിപ്പിക്കുന്നു; ‘മൺപാത്രം’ ആ വസ്തുസ്വഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: הֶעָפָר
  choice: പൊടി
  rationale: עָפָר എന്നത് പൊടി, ഉണങ്ങിയ മണ്ണ്, അയഞ്ഞ മണ്ണ് എന്നിവയെ സൂചിപ്പിക്കാം; ആചാരസന്ദർഭത്തിൽ ‘പൊടി’ യോജിച്ച തിരഞ്ഞെടുപ്പാണ്.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരത്തിന്റെ നിലത്ത്
  rationale: קַרְקַע നിലമോ തറയോ സൂചിപ്പിക്കാം; കൂടാരത്തിന്റെ അകത്തെ ഉപരിതലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിലം’ എന്നു പറയുന്നു. מִשְׁכָּן എന്നതിന് ഈ ആരാധനാസന്ദർഭത്തിൽ ‘സമാഗമകൂടാരം’ പരിചിതവും വ്യക്തവുമാണ്.
- source_word: מִן הֶעָפָר
  choice: പൊടിയിൽനിന്ന് കുറച്ച്
  rationale: 'מִן ഇവിടെ ഭാഗികത സൂചിപ്പിക്കുന്നു: മുഴുവൻ പൊടിയുമല്ല, അതിൽനിന്ന് കുറച്ചാണ് എടുക്കുന്നത്.'
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: എടുക്കണം ... എടുത്ത് ... ഇടണം
  rationale: രൂപങ്ങളുടെ ക്രമം ആചാരനിർദേശമാണ്; മലയാളത്തിലെ ‘-ണം’ നിർബന്ധിത നടപടിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ആവർത്തനം ഭാരമാകാതിരിക്കാൻ രണ്ടാമത്തെ പ്രവൃത്തി ‘എടുത്ത്’ എന്ന ബന്ധകക്രിയയായി നൽകിയെങ്കിലും ‘പുരോഹിതൻ’ എന്ന വിഷയം മൂലപാഠത്തെപ്പോലെ ആവർത്തിച്ചു.
- source_word: הַמָּיִם
  choice: ആ വെള്ളത്തിൽ
  rationale: അവസാനത്തെ നിർദ്ദിഷ്ടരൂപം മുമ്പ് പറഞ്ഞ വിശുദ്ധജലത്തിലേക്കാണ് തിരിച്ചുപോകുന്നത്; മലയാളത്തിൽ ‘ആ വെള്ളം’ ഈ അനാഫോറ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധജലം’ എന്ന പ്രയോഗത്തിന്റെ പിൽക്കാല സഭാപാരമ്പര്യങ്ങളുമായുള്ള ബന്ധം
  choice: വിശുദ്ധജലം
  alternative: ആചാരത്തിനായി വേർതിരിച്ച വെള്ളം / പവിത്രജലം
  rationale: എബ്രായത്തിലെ വിശേഷണം നേരിട്ട് ‘വിശുദ്ധമായ’ എന്നാണ്. പിൽക്കാല മതാചാരങ്ങളുടെ പ്രത്യേക അർഥം ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ, പദത്തിന്റെ അടിസ്ഥാന ആചാരപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, ആചാരനിർദേശത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് അടയാളക്രമം വാക്കുകളുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മലയാള പ്രധാനപാഠത്തിൽ [a] വിശുദ്ധജലത്തിനും [b] മൺപാത്രത്തിനും [c] നിലത്തിനും ചേർത്ത് ക്രമപ്പെടുത്തി.
