  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: ml
  text: എന്നാൽ, ആ മനുഷ്യന് കുറ്റപരിഹാരത്തുക തിരികെ നൽകേണ്ട വീണ്ടെടുപ്പുകാരനായ ബന്ധു[a] ഇല്ലെങ്കിൽ, യഹോവയ്ക്കു തിരികെ നൽകുന്ന ആ കുറ്റപരിഹാരത്തുക പുരോഹിതനുള്ളതായിരിക്കും[b]; അതിനു പുറമേ, അവനുവേണ്ടി പ്രായശ്ചിത്തം വരുത്തുന്ന പ്രായശ്ചിത്ത ആട്ടുകൊറ്റനും ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടെടുപ്പുകാരൻ’ അല്ലെങ്കിൽ ‘അടുത്ത ബന്ധു’ എന്നും പരിഭാഷപ്പെടുത്താം. גֹּאֵל എന്ന എബ്രായപദം വീണ്ടെടുപ്പിലോ നഷ്ടപരിഹാരവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിലോ കുടുംബപരമായ നിയമചുമതലയുള്ള ബന്ധുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള אָשָׁם എന്ന എബ്രായപദം ആട്ടുകൊറ്റനെയല്ല, കുറ്റം മൂലം നൽകേണ്ട നഷ്ടപരിഹാരത്തുകയെയാണ് സൂചിപ്പിക്കുന്നത്; ആട്ടുകൊറ്റനെ തുടർന്ന് പ്രത്യേകം പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: അവകാശിയായ ബന്ധു
  rationale: കുടുംബാംഗത്തിനുവേണ്ടി വീണ്ടെടുപ്പിലോ നഷ്ടപരിഹാരം സ്വീകരിക്കുന്നതിലോ നിയമപരമായ ചുമതലയുള്ള അടുത്ത ബന്ധുവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കുടുംബപരവും നിയമപരവുമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: הָאָשָׁם / הָאָשָׁם הַמּוּשָׁב
  choice: കുറ്റപരിഹാരത്തുക / തിരികെ നൽകുന്ന കുറ്റപരിഹാരത്തുക
  rationale: ഇവിടെ പദം യാഗമൃഗത്തെയല്ല, കുറ്റം മൂലമുള്ള സാമ്പത്തിക നഷ്ടപരിഹാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള ആട്ടുകൊറ്റനിൽനിന്ന് ഇത് വേർതിരിക്കുന്നു. שוב എന്ന ക്രിയയുടെ മടക്കിനൽകൽ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוהയെ മലയാളത്തിലെ പരിചിതവും വ്യക്തവുമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു; തുക ദൈവത്തിനു സമർപ്പിക്കപ്പെട്ട് പുരോഹിതന് ലഭിക്കുന്നതാണ് സന്ദർഭം.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതനുള്ളതായിരിക്കും
  rationale: ഹീബ്രുവിലെ സംക്ഷിപ്ത ലക്ഷ്യസൂചനയെ മലയാളത്തിൽ ഉടമസ്ഥാവകാശം വ്യക്തമാകുന്ന സ്വാഭാവിക വിധേയപ്രയോഗമായി നൽകി.
- source_word: מִלְּבַד
  choice: ഇതിനു പുറമേ
  rationale: നഷ്ടപരിഹാരത്തുകയും ആട്ടുകൊറ്റനും വ്യത്യസ്തവും രണ്ടും ആവശ്യവുമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: אֵיל הַכִּפֻּרִים
  choice: പാപപരിഹാരത്തിനുള്ള ആട്ടുകൊറ്റൻ
  rationale: യാഗമൃഗത്തിന്റെ പ്രായശ്ചിത്തപരമായ പ്രവർത്തനം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: അവനുവേണ്ടി പാപപരിഹാരം വരുത്താൻ ഉപയോഗിക്കുന്ന
  rationale: ആട്ടുകൊറ്റൻ പാപപരിഹാരത്തിനുള്ള ഉപാധിയാണെന്ന് നിലനിർത്തുന്നു; ഹീബ്രു ഇവിടെ കർത്താവിനെ തുറന്നുപറയാത്തതിനാൽ മലയാളത്തിലും പുരോഹിതനെ അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: לָאִישׁ
  choice: ആ മനുഷ്യന്
  rationale: ഹീബ്രുവിലെ പുല്ലിംഗ ഏകവചനത്തെ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: നഷ്ടപരിഹാരവും യാഗവും തമ്മിലുള്ള ബന്ധം
  choice: സാമ്പത്തിക കുറ്റപരിഹാരത്തുകയും പാപപരിഹാരത്തിനുള്ള ആട്ടുകൊറ്റനും വേറിട്ട രണ്ടിനങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: אָשָׁם എന്ന പദത്തെ ഇവിടെതന്നെ ‘കുറ്റയാഗം’ എന്നു വായിക്കുക.
  rationale: מִלְּבַד (‘പുറമേ’) എന്ന പദവും തുടർന്ന് പ്രത്യേകം പറയുന്ന ആട്ടുകൊറ്റനും സാമ്പത്തിക പരിഹാരത്തെയും യാഗത്തെയും വേർതിരിക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ അവതരണം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ മറച്ചുവയ്ക്കാതെ, മലയാളത്തിൽ വ്യാപകമായി തിരിച്ചറിയാവുന്ന രൂപത്തിൽ അവതരിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആരാധനാ ശൈലി. സാങ്കേതിക പദങ്ങൾ പരമാവധി വ്യക്തമാക്കിയിട്ടുണ്ട്; [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
