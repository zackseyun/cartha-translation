revisions:
- from: എന്നാൽ ആ മനുഷ്യന് കുറ്റപരിഹാരത്തുക തിരികെ നൽകേണ്ട അവകാശിയായ ബന്ധു[a] ഇല്ലെങ്കിൽ, യഹോവയ്ക്കു തിരികെ നൽകുന്ന ആ കുറ്റപരിഹാരത്തുക പുരോഹിതനുള്ളതായിരിക്കും[b]. ഇതിനു പുറമേ, അവനുവേണ്ടി പാപപരിഹാരം വരുത്താൻ ഉപയോഗിക്കുന്ന പാപപരിഹാരത്തിനുള്ള ആട്ടുകൊറ്റനെയും നൽകണം.
  to: എന്നാൽ, ആ മനുഷ്യന് കുറ്റപരിഹാരത്തുക തിരികെ നൽകേണ്ട വീണ്ടെടുപ്പുകാരനായ ബന്ധു[a] ഇല്ലെങ്കിൽ, യഹോവയ്ക്കു തിരികെ നൽകുന്ന ആ കുറ്റപരിഹാരത്തുക പുരോഹിതനുള്ളതായിരിക്കും[b]; അതിനു പുറമേ, അവനുവേണ്ടി പ്രായശ്ചിത്തം വരുത്തുന്ന പ്രായശ്ചിത്ത ആട്ടുകൊറ്റനും ഉണ്ടായിരിക്കും.
  rationale: The revision replaces a potentially misleading term for the legally responsible relative and removes an added imperative in the final clause. It preserves the Hebrew distinction between restitution paid to YHWH and assigned to the priest, and the additional ram by which atonement is made for the offender.
