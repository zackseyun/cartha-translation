reference: Numbers 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ മൂലരൂപവും പരമ്പരാഗത പകരംവായനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: ദൈവിക പ്രഭാഷണത്തിന്റെ പുതിയ ഘടകം ആരംഭിക്കുന്ന സാധാരണ എബ്രായ ആഖ്യാനപ്രയോഗമാണിത്. ‘സംസാരിച്ചു’ എന്നത് דִּבֵּר എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-ന്റെ മലയാള ലിപ്യന്തരണം; ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് വ്യക്തിനാമം മറച്ചുവയ്ക്കാതെ മൂലപാഠത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: אֶל
  choice: -ഓടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവിക സഹഗതി വിഭക്തിയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ ഈ വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ദ്വിബിന്ദു (:)
  rationale: ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിനു പകരം, പിന്നാലെ വരുന്ന നേരിട്ടുള്ള സന്ദേശത്തെ ദ്വിബിന്ദു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; എബ്രായ പ്രഭാഷണസൂത്രത്തിന്റെ പ്രവർത്തനം ഇതിലൂടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ അതിന്റെ അംഗീകരിക്കപ്പെട്ട ഉച്ചാരണത്തെ മലയാളത്തിൽ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രഭാഷണസൂത്രം. ‘അരുളിച്ചെയ്തു’ പോലുള്ള പഴയതോ അത്യധികം സഭാഭാഷാപരമോ ആയ പ്രയോഗം ഒഴിവാക്കി. לֵאמֹר-ന്റെ പ്രഭാഷണം അവതരിപ്പിക്കുന്ന പ്രവർത്തനം ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
