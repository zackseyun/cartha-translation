id: NUM.5.9
reference: Numbers 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ വിശുദ്ധമായി അർപ്പിക്കുന്ന എല്ലാ വഴിപാടുകളിലും, അവർ പുരോഹിതന് സമർപ്പിക്കുന്ന ഓരോ വഴിപാടും പുരോഹിതനുള്ളതായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמָה
  choice: വഴിപാട്
  rationale: വേർതിരിച്ചു നൽകുന്ന സംഭാവനയെയോ അർപ്പണത്തെയോ സൂചിപ്പിക്കുന്ന പദം. ഈ ആരാധനാസന്ദർഭത്തിൽ ‘വഴിപാട്’ സ്വാഭാവികവും വ്യക്തവുമാണ്; അതിസാങ്കേതികമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: קָדְשֵׁי
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: കֹדֶשׁ എന്ന പദത്തിന്റെ ബഹുവചന സംയുക്തരൂപം ഇവിടെ ദൈവത്തിനായി വേർതിരിച്ച വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധവസ്തുക്കൾ’ മൂലരൂപത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധം സൂചിപ്പിക്കുന്ന രൂപം നിലനിർത്തുകയും മലയാളത്തിൽ പരമ്പരാഗതവും സ്വാഭാവികവുമായ സമൂഹനാമം നൽകുകയും ചെയ്യുന്നു.
- source_word: יַקְרִיבוּ
  choice: അടുക്കൽ കൊണ്ടുവരുന്ന
  rationale: קרב എന്ന ധാതുവിന്റെ ‘അടുത്തേക്ക് കൊണ്ടുവരുക/സമർപ്പിക്കുക’ എന്ന ആരാധനാപരമായ ഭാവം ‘അടുക്കൽ കൊണ്ടുവരുക’ നിലനിർത്തുന്നു.
- source_word: לַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യസ്ഥാനമോ സ്വീകരിക്കുന്ന വ്യക്തിയോ സൂചിപ്പിക്കുന്ന לְ എന്ന ഉപസർഗത്തിന്റെ അർഥം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: לוֹ יִהְיֶה
  choice: പുരോഹിതനുള്ളതായിരിക്കും
  rationale: നിയമപരമായ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സർവനാമത്തിന്റെ അവ്യക്തത ഒഴിവാക്കാൻ ‘പുരോഹിതൻ’ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസമൂഹനാമത്തിന്റെ വിവർത്തനം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ‘ഇസ്രായേൽമക്കൾ’ ഹീബ്രുവിലെ ബന്ധസൂചക ഘടനയെ പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം മലയാളത്തിൽ സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക നാമമായും പ്രവർത്തിക്കുന്നു. ഇവിടെ പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: לוֹ എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: പുരോഹിതനുള്ളതായിരിക്കും
  alternative: അവനുള്ളതായിരിക്കും
  rationale: സന്ദർഭത്തിൽ സർവനാമം പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്. നിയമവാക്യത്തിന്റെ ഉടമസ്ഥതാസംബന്ധമായ അർഥം വ്യക്തമായി നൽകാൻ നാമം ആവർത്തിച്ചു; അർഥപരമായ അധികവിവരം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-ആരാധനാശൈലി. വാക്യഘടന ഹീബ്രുവിനോട് അടുത്തുവെച്ചെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാക്കി. പ്രസക്തമായ യഥാർഥ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
