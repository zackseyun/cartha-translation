revisions:
- from: ഇസ്രായേൽമക്കളുടെ വിശുദ്ധവസ്തുക്കളിൽനിന്ന് അവർ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരുന്ന ഓരോ വഴിപാടും പുരോഹിതനുള്ളതായിരിക്കും.
  to: ഇസ്രായേൽമക്കൾ വിശുദ്ധമായി അർപ്പിക്കുന്ന എല്ലാ വഴിപാടുകളിലും, അവർ പുരോഹിതന് സമർപ്പിക്കുന്ന ഓരോ വഴിപാടും പുരോഹിതനുള്ളതായിരിക്കും.
  rationale: The revision avoids construing the holy gifts as the material source of the contribution, retains the distributive force of "every," and uses natural modern Malayalam for presenting an offering to a priest. No textual ambiguity or lexical alternative requires a footnote.
