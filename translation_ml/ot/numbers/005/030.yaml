  to: അല്ലെങ്കിൽ, ഒരു പുരുഷന്റെമേൽ അസൂയയുടെ ഒരു ആത്മാവ് വരികയും[a] അവൻ തന്റെ ഭാര്യയെക്കുറിച്ചു അസൂയപ്പെടുകയും, ആ സ്ത്രീയെ യഹോവയുടെ സന്നിധിയിൽ നിർത്തുകയും ചെയ്യുമ്പോൾ, പുരോഹിതൻ ഈ നിയമം[b] മുഴുവനും അവളുടെ കാര്യത്തിൽ നടപ്പാക്കണം.
