  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരു പുരുഷന്റെമേൽ അസൂയയുടെ ഒരു ആത്മാവ് വരികയും[a] അവൻ തന്റെ ഭാര്യയെക്കുറിച്ചു അസൂയപ്പെടുകയും, ആ സ്ത്രീയെ യഹോവയുടെ സന്നിധിയിൽ നിർത്തുകയും ചെയ്യുമ്പോൾ, പുരോഹിതൻ ഈ നിയമം[b] മുഴുവനും അവളുടെ കാര്യത്തിൽ നടപ്പാക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവന്റെമേൽ വരിക’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥം ‘അവന്റെമേൽ കടന്നുപോകുക’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ നിയമം മുഴുവനും’, ‘ഈ നിർദേശം മുഴുവനും’, അല്ലെങ്കിൽ ‘ഈ ചടങ്ങുക്രമം മുഴുവനും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: അല്ലെങ്കിൽ ... ചെയ്യുമ്പോൾ
  rationale: മുമ്പുള്ള വാക്യത്തിൽ ആരംഭിച്ച നിയമവാക്യത്തിലെ രണ്ടാമത്തെ സാധ്യതയാണ് ഇത് അവതരിപ്പിക്കുന്നത്. ‘അല്ലെങ്കിൽ’ എന്നത് വേർതിരിവും ‘ചെയ്യുമ്പോൾ’ എന്നത് സാഹചര്യാർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אִישׁ
  choice: ഒരു പുരുഷൻ
  rationale: സ്രോതസ്സിലെ പൊതുവായ ‘പുരുഷൻ’ എന്ന പദം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘തന്റെ ഭാര്യ’ വിവാഹബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: അസൂയയുടെ ഒരു ആത്മാവ് ഒരു പുരുഷന്റെമേൽ വന്നിട്ട്
  rationale: ‘അസൂയയുടെ ആത്മാവ്’ എന്ന രൂപകം നിലനിർത്തുകയും ‘അവന്റെമേൽ കടന്നുവരുക’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു; ഇത് മനോവികാരമാണോ ആത്മീയ ശക്തിയാണോ എന്നു തീർപ്പാക്കുന്നില്ല.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: അയാൾ തന്റെ ഭാര്യയോട് അസൂയപ്പെടുകയും
  rationale: നാമത്തോടു ബന്ധമുള്ള ക്രിയയിലെ അസൂയാമൂലകം ആവർത്തിച്ച് നിലനിർത്തുന്നു.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: ആ സ്ത്രീയെ യഹോവയുടെ സന്നിധിയിൽ നിർത്തുകയും
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘നിൽക്കാൻ ഇടയാക്കുക/നിർത്തുക’ എന്ന ഔപചാരിക സമർപ്പണാർഥം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമത്തിലെ നാല് വ്യഞ്ജനാക്ഷരങ്ങളുടെ പരമ്പരാഗതവും മലയാളത്തിൽ പരിചിതവുമായ വ്യക്തിനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: പുരോഹിതൻ ... അവളോടു നടപ്പാക്കണം
  rationale: ചടങ്ങുസംബന്ധമായ നിർദേശം പുരോഹിതൻ അവളുടെ കാര്യത്തിൽ പ്രയോഗിക്കണമെന്ന നിയമപരമായ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: ഈ നിയമവിധി മുഴുവനും
  rationale: תּוֹרָה എന്ന പദത്തിന്റെ ‘നിയമം/നിർദേശം’ എന്ന പരിധിയും ഇവിടെ ഉദ്ദേശിക്കുന്ന നിർദിഷ്ട നടപടിക്രമവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അസൂയയുടെ ആത്മാവ്’ എന്നതിന്റെ സ്വഭാവം
  choice: ‘അസൂയയുടെ ഒരു ആത്മാവ്’ എന്ന് രൂപകത്തിന്റെ അവ്യക്തത നിലനിർത്തി.
  alternative: ‘അസൂയാവേശം’ അല്ലെങ്കിൽ ‘അസൂയയുടെ ഒരു തോന്നൽ’
  rationale: ഇത് ഉള്ളിലെ ശക്തമായ മനോഭാവമാണോ ഏതെങ്കിലും ആത്മീയ പ്രവർത്തനമാണോ എന്നു എബ്രായപ്രയോഗം നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ആ അവ്യക്തത പരിഹരിക്കുന്നില്ല.
- issue: תּוֹרָה എന്നതിന്റെ സാഹചര്യാർഥം
  choice: ‘നിയമവിധി’
  alternative: ‘നിയമം’, ‘നിർദേശം’, അല്ലെങ്കിൽ ‘ചടങ്ങുക്രമം’
  rationale: ഇവിടെ പദം മുമ്പ് വിവരിച്ച നിയമപരവും ആചാരപരവുമായ മുഴുവൻ നടപടിയെ സൂചിപ്പിക്കുന്നു; ഒരൊറ്റ സങ്കുചിത അർഥത്തിലേക്ക് ചുരുക്കാതെ നിയമസ്വഭാവവും നിർദിഷ്ട ക്രമവും പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിയമ-ചടങ്ങു ശൈലി. ദീർഘമായ എബ്രായ വ്യവസ്ഥാവാക്യത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദക്രമം ഉപയോഗിച്ചു.
