id: NUM.5.13
reference: Numbers 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: ml
  text: ഒരു പുരുഷൻ അവളോടുകൂടെ ശയിച്ച് ബീജസ്രാവം ഉണ്ടാകുകയും,[a] അതു ഭർത്താവിന്റെ കണ്ണിൽപ്പെടാതെ മറഞ്ഞിരിക്കുകയും, അവൾ മറഞ്ഞിരിക്കുകയും അശുദ്ധയായിത്തീരുകയും, അവൾക്കെതിരേ സാക്ഷി ആരും ഇല്ലാതിരിക്കുകയും,[b] അവൾ പിടിക്കപ്പെടാതിരിക്കുകയും ചെയ്താൽ—[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ബീജത്തിന്റെ ശയനം’; ഇവിടെ ലൈംഗികബന്ധവും ബീജസ്രാവവും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവളെക്കുറിച്ച് സാക്ഷി ആരും ഇല്ലാതിരിക്കുകയും.’
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ, ‘അവൾ ബലമായി പിടിക്കപ്പെട്ടിട്ടില്ല.’ ചിലർ ഇതിനെ ‘അവൾ നിർബന്ധിക്കപ്പെട്ടിട്ടില്ല’ എന്ന അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: ഒരു പുരുഷൻ അവളോടുകൂടെ ശയിച്ച്
  rationale: ലൈംഗികസന്ദർഭത്തിലെ שׁכב എന്ന പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്ന, മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: שִׁכְבַת זֶרַע
  choice: ബീജസ്രാവം ഉണ്ടാകുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ബീജത്തിന്റെ ശയനം’ എന്ന ഹീബ്രു പ്രയോഗം ലൈംഗികബന്ധത്തോടൊപ്പമുള്ള ബീജസ്രാവത്തെ സൂചിപ്പിക്കുന്നു; നിയമ-ശുദ്ധിവിധി സന്ദർഭത്തിലെ ശാരീരിക സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: അതു ഭർത്താവിന്റെ കണ്ണിൽപ്പെടാതെ മറഞ്ഞിരിക്കുകയും
  rationale: ‘ഭർത്താവിന്റെ കണ്ണുകളിൽനിന്ന് മറഞ്ഞു’ എന്ന ഹീബ്രു ദൃശ്യപ്രയോഗവും നിഷ്ക്രിയഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְנִסְתְּרָה
  choice: അവൾ രഹസ്യമായി
  rationale: നിഫാൽ രൂപത്തിലെ മറയ്ക്കപ്പെടുക/ഒളിഞ്ഞിരിക്കുക എന്ന അർഥവ്യാപ്തി പൂർണമായി ഏകാർഥമാക്കാതെ, സംഭവത്തിന്റെ രഹസ്യസ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: וְהִיא נִטְמָאָה
  choice: അശുദ്ധയായിത്തീരുകയും
  rationale: טמא എന്ന പദത്തിന്റെ ശുദ്ധിവിധിസംബന്ധമായ വിഭാഗം നിലനിർത്തുന്നു; ‘കളങ്കപ്പെട്ടു’ എന്ന കൂടുതൽ വികാരഭരിതമായ ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: וְעֵד אֵין בָּהּ
  choice: അവൾക്കെതിരേ സാക്ഷി ആരും ഇല്ലാതിരിക്കുകയും
  rationale: നിയമപരമായ സാക്ഷ്യത്തിന്റെ അഭാവം വ്യക്തമായി അറിയിക്കുന്നു; ‘അവളെക്കുറിച്ച്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: അവൾ പിടിക്കപ്പെടാതിരിക്കുകയും
  rationale: സന്ദർഭത്തിൽ പ്രവൃത്തിക്കിടെ പിടിക്കപ്പെടാത്തതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘ബലമായി പിടിക്കപ്പെട്ടില്ല’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: נִטְמָאָה എന്ന ശുദ്ധിവിധിപദത്തിന്റെ വിവർത്തനം
  choice: അശുദ്ധയായിത്തീരുകയും
  alternative: കളങ്കപ്പെടുകയും
  rationale: ശുദ്ധിവിധിയുടെ ഭാഷ സംരക്ഷിക്കുകയും കൂടുതൽ ധാർമികമോ വികാരാത്മകമോ ആയ വ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: לֹא נִתְפָּשָׂה എന്നതിന്റെ അർഥം
  choice: അവൾ പിടിക്കപ്പെടാതിരിക്കുകയും
  alternative: അവൾ ബലമായി പിടിക്കപ്പെട്ടിട്ടില്ല
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പിടിക്കപ്പെടുകയോ കണ്ടെത്തപ്പെടുകയോ ചെയ്യാത്തതാണ് സാധ്യതയേറിയ അർഥം; ബലപ്രയോഗത്തെ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനം യഥാർഥമായ സാധ്യതയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: וְנִסְתְּרָה എന്ന നിഫാൽ രൂപത്തിലെ അവ്യക്തത
  choice: അവൾ രഹസ്യമായി അശുദ്ധയായിത്തീരുകയും
  alternative: അവൾ മറഞ്ഞിരിക്കുകയും അശുദ്ധയായിത്തീരുകയും
  rationale: സ്ത്രീ മറഞ്ഞിരുന്നു, സംഭവം മറച്ചുവയ്ക്കപ്പെട്ടു എന്നീ സൂക്ഷ്മതകൾക്കിടയിലെ അവ്യക്തത പൂർണമായി പരിഹരിക്കാതെ സ്വാഭാവിക മലയാളവാക്യം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം തുടർന്നുവരുന്ന നിയമവ്യവസ്ഥയുടെ ഉപാധിവാക്യമായതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ നിലനിർത്തിയിരിക്കുന്നു. ശുദ്ധിവിധിയുടെ സാങ്കേതികഭാഷ സംരക്ഷിച്ചിട്ടുണ്ടെങ്കിലും അനാവശ്യമായ പഴമൊഴിശൈലി ഒഴിവാക്കിയിരിക്കുന്നു.
