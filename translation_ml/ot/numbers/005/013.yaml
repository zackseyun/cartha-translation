  revision_rationale: וְנִסְתְּרָהയെ സ്വതന്ത്രമായി ‘അവൾ മറഞ്ഞിരിക്കുകയും’ എന്നു പുനഃസ്ഥാപിച്ചു. ഇതിലൂടെ ‘സംഭവം ഭർത്താവിൽനിന്ന് മറഞ്ഞിരുന്നു,’ ‘അവൾ മറഞ്ഞിരുന്നു/ഒളിഞ്ഞിരുന്നു,’ ‘അവൾ അശുദ്ധയായി’ എന്നീ മൂലത്തിലെ തുടർച്ചയായ ഘടകങ്ങൾ വേർതിരിഞ്ഞു നിൽക്കുന്നു. ശേഷിക്കുന്ന പദപ്രയോഗങ്ങളും അടിക്കുറിപ്പുകളും മൂലപാഠത്തോടും നൽകിയ ഇംഗ്ലീഷ് ഓഡിറ്റ്-തീരുമാനങ്ങളോടും യോജിച്ചതിനാൽ മാറ്റിയിട്ടില്ല.
