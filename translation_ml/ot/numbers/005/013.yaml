  source_fidelity: പ്രധാന അർഥക്രമവും നിയമ-ഉപാധിവാക്യത്തിന്റെ സ്വഭാവവും കരടിൽ നന്നായി നിലനിൽക്കുന്നു. എന്നാൽ וְנִסְתְּרָה (‘അവൾ മറഞ്ഞു/ഒളിഞ്ഞിരുന്നു’) എന്ന സ്വതന്ത്ര നിഷ്ക്രിയ/മധ്യവാചക ക്രിയയെ ‘രഹസ്യമായി’ എന്ന ക്രിയാവിശേഷണമായി മാറ്റുന്നത് ആ ഘടകത്തെ അശുദ്ധിയോടു ചേർത്തുകളയുന്നു. അതിനാൽ സ്ത്രീയുടെ മറഞ്ഞിരിപ്പും അവളുടെ അശുദ്ധിയാകലും വേർതിരിച്ച് വിവർത്തനം ചെയ്യേണ്ടതാണ്.
  naturalness: ‘അവൾ മറഞ്ഞിരിക്കുകയും അശുദ്ധയായിത്തീരുകയും’ എന്ന രൂപം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്; മൂലത്തിലെ തുടർച്ചയായ ഉപാധിവാക്യങ്ങളും അവ്യക്തമായ നിഷ്ക്രിയ/മധ്യവാചക സ്വരവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
  terminology: ‘ശയിച്ച്,’ ‘ബീജസ്രാവം,’ ‘അശുദ്ധയായിത്തീരുകയും,’ ‘സാക്ഷി,’ ‘പിടിക്കപ്പെടാതിരിക്കുകയും’ എന്നിവ സന്ദർഭോചിതവും നിയമ-ശുദ്ധിവിധി രജിസ്റ്ററിനനുയോജ്യവുമാണ്. ‘അശുദ്ധ’ എന്നത് טמא-യുടെ ശുദ്ധിവിധിസംബന്ധമായ അർഥം അനാവശ്യ ധാർമികവൽക്കരണമില്ലാതെ നിലനിർത്തുന്നു.
