  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: ml
  text: 'അപ്പോൾ പുരോഹിതൻ സ്ത്രീയെ ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം ചൊല്ലിച്ചു ശപഥം ചെയ്യിക്കണം[a]. പുരോഹിതൻ സ്ത്രീയോടു പറയണം: “യഹ്‌വെ നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും നിന്റെ ഉദരം വീർക്കുകയും ചെയ്യുമ്പോൾ, നിന്റെ ജനത്തിന്റെ ഇടയിൽ യഹ്‌വെ നിന്നെ ശാപവും ശപഥവും ആക്കട്ടെ[b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം” എന്നത് ശാപത്തോടു ബന്ധപ്പെട്ട ഔപചാരിക ശപഥമാണ്; പുരോഹിതൻ സ്ത്രീയെ അത്തരം ശപഥം ചെയ്യിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ശാപവും ശപഥവും” എന്നത് ഒരു പ്രയോഗമാണ്. നിന്റെ ജനത്തിന്റെ ഇടയിൽ ആളുകൾ ശപിക്കുമ്പോഴും ശപഥം ചെയ്യുമ്പോഴും നിന്നെ മുന്നറിയിപ്പിന്റെ ഉദാഹരണമായി ഉദ്ധരിക്കും എന്ന അർത്ഥം ഇതിന് ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “തുട ക്ഷയിച്ചുപോകുക” എന്ന എബ്രായപ്രയോഗം ദുഷ്കരമാണ്. “തുട” ഇവിടെ പ്രത്യുത്പാദനാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയായിരിക്കാം; അല്ലെങ്കിൽ ആ ദേഹഭാഗം ശോഷിക്കുകയോ ചുരുങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം. “ഉദരം” എന്നതിന് “വയർ” അല്ലെങ്കിൽ ചില വ്യാഖ്യാനങ്ങളിൽ “ഗർഭപാത്രം” എന്നും അർത്ഥമാകാം. കൃത്യമായ ദേഹപരമോ പ്രത്യുത്പാദനപരമോ ആയ ഫലം വിവാദവിഷയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: സ്ത്രീയെക്കൊണ്ട് സത്യം ചെയ്യിക്കണം
  rationale: 'שׁבע എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം കാരണാർത്ഥകമാണ്: പുരോഹിതൻ സ്ത്രീയെക്കൊണ്ട് ശപഥം ചെയ്യിക്കുന്നു. ആ നിയമാനുഷ്ഠാനപരമായ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: ശാപശപഥം ചൊല്ലി
  rationale: שְׁבֻעָהയും אָלָהയും ചേർന്ന പ്രയോഗത്തിലെ ശപഥവും ശാപവും നിലനിർത്തിക്കൊണ്ട്, അനുഷ്ഠാനസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: ശാപത്തിന്റെയും ശപഥത്തിന്റെയും ഉദാഹരണം
  rationale: സ്ത്രീയുടെ അനുഭവം പിന്നീട് മറ്റുള്ളവർ ശപിക്കുമ്പോഴും ശപഥം ചെയ്യുമ്പോഴും ഉദ്ധരിക്കപ്പെടുന്ന മാതൃകയാകും എന്ന പ്രയോഗപരമായ അർത്ഥം വ്യക്തമാക്കുന്നു; ‘ശാപവും ശപഥവും’ എന്ന രൂപം മാത്രം മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്ക് ഇടയാക്കാം.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: നിന്റെ ജനത്തിന്റെ ഇടയിൽ
  rationale: സാമൂഹികവും പരസ്യവുമായ പശ്ചാത്തലം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּתֵת
  choice: ഇടയാക്കുമ്പോൾ
  rationale: בְּ ചേർന്ന ക്രിയാനാമരൂപത്തിന്റെ സാഹചര്യ/കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְרֵכֵךְ נֹפֶלֶת
  choice: നിന്റെ തുട ക്ഷയിച്ചുപോകാൻ
  rationale: יָרֵךְ എന്നതിന്റെ പ്രാഥമിക ദേഹഭാഗാർത്ഥം നിലനിർത്തുന്നു; נפל എന്ന ദുഷ്കരമായ രൂപകത്തെ ഈ ശാപസന്ദർഭത്തിൽ ദേഹഭാഗം ശോഷിച്ചുപോകുന്നതായി സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ നിർദിഷ്ടമായ വൈദ്യശാസ്ത്ര വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: בִּטְנֵךְ צָבָה
  choice: ഉദരം വീർക്കാൻ
  rationale: בֶּטֶן എന്നത് വയർ, ഉദരം, ഗർഭപാത്രം എന്നിവ സൂചിപ്പിക്കാവുന്നതിനാൽ വിശാലമായ ദേഹാർത്ഥമുള്ള ‘ഉദരം’ തിരഞ്ഞെടുത്തു; צָבָהയുടെ വീക്കം എന്ന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപത്തിൽ വിവരിക്കുന്ന ദേഹപരമായ ഫലം എത്ര നിർദിഷ്ടമായി പരിഭാഷപ്പെടുത്തണം
  choice: ‘തുട ക്ഷയിച്ചുപോകുക, ഉദരം വീർക്കുക’ എന്ന ദേഹചിത്രം നിലനിർത്തി, മുഖ്യപാഠത്തിൽ ഗർഭച്ഛിദ്രമോ വന്ധ്യതയോ എന്ന് നിർണയിക്കാതിരിക്കുക.
  alternative: ‘ഗർഭം അലസിപ്പോകുക’ അല്ലെങ്കിൽ ‘ഗർഭപാത്രം തകരുക’ എന്നിങ്ങനെ നിർദിഷ്ടമായ പ്രത്യുത്പാദനഫലമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: എബ്രായപ്രയോഗം ദുഷ്കരവും വ്യാഖ്യാനഭേദമുള്ളതുമാണ്. പ്രത്യുത്പാദനാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തിയാകാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുമ്പോൾ, മൂലപാഠം വ്യക്തമാക്കാത്ത വൈദ്യശാസ്ത്രഫലം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള നിയമാനുഷ്ഠാന ശൈലി പാലിച്ചു. ‘സത്യം ചെയ്യിക്കുക’, ‘ശാപശപഥം’, ‘ഉദരം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സന്ദർഭത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നതുമാണ്. വ്യാഖ്യാനഭേദമുള്ള ദേഹപ്രയോഗം മുഖ്യപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
