revisions:
- from: 'പിന്നെ പുരോഹിതൻ ശാപശപഥം ചൊല്ലി സ്ത്രീയെക്കൊണ്ട് സത്യം ചെയ്യിക്കണം. പുരോഹിതൻ സ്ത്രീയോടു പറയണം: “യഹ്‌വെ നിന്റെ തുട ക്ഷയിച്ചുപോകാനും ഉദരം വീർക്കാനും ഇടയാക്കുമ്പോൾ, നിന്റെ ജനത്തിന്റെ ഇടയിൽ നിന്നെ ശാപത്തിന്റെയും ശപഥത്തിന്റെയും ഉദാഹരണമാക്കട്ടെ.[a][b]”'
  to: 'അപ്പോൾ പുരോഹിതൻ സ്ത്രീയെ ശാപം ഉൾക്കൊള്ളുന്ന ശപഥം ചൊല്ലിച്ചു ശപഥം ചെയ്യിക്കണം[a]. പുരോഹിതൻ സ്ത്രീയോടു പറയണം: “യഹ്‌വെ നിന്റെ തുട ക്ഷയിച്ചുപോകുകയും നിന്റെ ഉദരം വീർക്കുകയും ചെയ്യുമ്പോൾ, നിന്റെ ജനത്തിന്റെ ഇടയിൽ യഹ്‌വെ നിന്നെ ശാപവും ശപഥവും ആക്കട്ടെ[b][c].”'
  rationale: The revision distinguishes the initial oath involving a curse from the later curse-and-oath formula, retains the Hebrew’s formal wording in the main text, and moves the idiomatic explanatory sense into a properly anchored note. It preserves the disputed bodily imagery without imposing a reproductive or medical diagnosis.
