source:
  edition: WLC
  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: ml
  text: എന്നാൽ നീ നിന്റെ ഭർത്താവിനോടുള്ള ബന്ധത്തിലിരിക്കെ വഴിതെറ്റുകയും[a] അശുദ്ധയാകുകയും, നിന്റെ ഭർത്താവല്ലാത്ത ഒരു പുരുഷൻ നിന്നോടുകൂടെ ശയിക്കുകയും ചെയ്തിട്ടുണ്ടെങ്കിൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ ഭർത്താവിനോട് അവിശ്വസ്തയാകുകയും.’ എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, ‘നിന്റെ ഭർത്താവിന്റെ കീഴിൽ വഴിതെറ്റുകയും’ എന്നാണ്; വിവാഹബന്ധത്തിന്റെ സാഹചര്യത്തിൽ വഴിതെറ്റുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു രൂപകമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: വഴിതെറ്റുകയും
  rationale: വിവാഹവിശ്വസ്തതയിൽനിന്നുള്ള വ്യതിചലനം സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; ‘അവിശ്വസ്തയാകുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: תַּחַת אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവിനോടുള്ള ബന്ധത്തിൽനിന്ന്
  rationale: തחת എന്നതിന്റെ അക്ഷരാർഥം ‘കീഴിൽ’ ആണെങ്കിലും ഇവിടെ വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. സ്വാഭാവിക മലയാളത്തിൽ ആ ബന്ധപരമായ അർഥം നൽകുകയും മൂലത്തിലെ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: נִטְמֵאת
  choice: അശുദ്ധയാകുകയും
  rationale: טמא എന്ന പദത്തിന്റെ ആചാരപരവും നിയമപരവുമായ അശുദ്ധിയുടെ ആശയം നിലനിർത്തുന്നു; ‘കളങ്കപ്പെടുക’ എന്നത് മലയാളത്തിൽ ബാഹ്യമായോ സാമൂഹികമായോ കളങ്കത്തിലേക്ക് അർഥം ചുരുക്കാം.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: ഒരു പുരുഷൻ നിന്നോടുകൂടെ ശയിക്കുകയും
  rationale: ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ശയനപ്രയോഗത്തിന്റെ മാന്യമായ യൂഫെമിസ്റ്റിക് സ്വഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: നിന്റെ ഭർത്താവല്ലാത്ത
  rationale: ഭർത്താവിനെ ഒഴികെയുള്ള മറ്റൊരു പുരുഷൻ എന്ന ഒഴിവാക്കൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: വിവാഹവിശ്വസ്തതയിൽനിന്നുള്ള വ്യതിചലനത്തെ എത്രമാത്രം വ്യാഖ്യാനിച്ച് പറയണം
  choice: ‘ഭർത്താവിനോടുള്ള ബന്ധത്തിൽനിന്ന് വഴിതെറ്റുക’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘ഭർത്താവിനോട് അവിശ്വസ്തയാകുക’ എന്ന് നേരിട്ട് പറയുക
  rationale: മൂലപാഠം വ്യതിചലനത്തിന്റെ രൂപകവും തുടർന്ന് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ചേർത്തുപയോഗിക്കുന്നു. മുഖ്യവാചകം ഈ ക്രമവും അർഥതീവ്രതയും അനാവശ്യമായി വർധിപ്പിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ നിയമ-ആചാര ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
