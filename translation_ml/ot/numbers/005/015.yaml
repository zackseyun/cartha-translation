source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: ml
  text: അപ്പോൾ ആ പുരുഷൻ തന്റെ ഭാര്യയെ പുരോഹിതന്റെ അടുക്കൽ കൊണ്ടുവരണം. അവൾക്കുവേണ്ടിയുള്ള വഴിപാടായി ഏഫായുടെ പത്തിലൊന്ന് യവമാവും അയാൾ കൊണ്ടുവരണം. അതിന്മേൽ എണ്ണ ഒഴിക്കുകയോ കുന്തിരിക്കം വയ്ക്കുകയോ അരുത്. കാരണം, അത് അസൂയയുടെ ധാന്യവഴിപാടും ഓർമയ്ക്കായുള്ള വഴിപാടും[a]—അകൃത്യം[b] ഓർമയിൽ വരുത്തുന്ന വഴിപാടും—ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഓർമയുടെ വഴിപാട്’; ‘സ്മാരകവഴിപാട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള എബ്രായപദത്തിന് ‘അകൃത്യം’, ‘കുറ്റം’, അല്ലെങ്കിൽ തെറ്റിൽനിന്നുണ്ടാകുന്ന ‘കുറ്റബാധ്യത’ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: ആ പുരുഷൻ തന്റെ ഭാര്യയെ ... കൊണ്ടുവരണം
  rationale: നിയമനിർദേശത്തിന്റെ ആജ്ഞാത്മക ബലം ‘കൊണ്ടുവരണം’ എന്നു നൽകി; הָאִישׁ എന്നതിന്റെ അക്ഷരാർഥമായ ‘പുരുഷൻ’ നിലനിർത്തുകയും ‘തന്റെ ഭാര്യ’ ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: אֶל־הַכֹּהֵן
  choice: പുരോഹിതന്റെ അടുക്കൽ
  rationale: യാജകശുശ്രൂഷയിലെ ഔദ്യോഗിക പദവിക്ക് സാധാരണവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: അവൾക്കുവേണ്ടിയുള്ള വഴിപാടായി
  rationale: സ്ത്രീലിംഗ പ്രത്യയം വഴിപാട് അവളുമായി ബന്ധപ്പെട്ടതാണെന്നു സൂചിപ്പിക്കുന്നു; עָלֶיהָ ഇവിടെ അവളുടെ പേരിൽ/അവൾക്കുവേണ്ടി എന്ന ബന്ധം നൽകുന്നു.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: ഏഫായുടെ പത്തിലൊന്ന്
  rationale: പുരാതന അളവായ ‘ഏഫാ’ ഏകദേശ ആധുനിക അളവാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: קֶמַח שְׂעֹרִים
  choice: യവമാവ്
  rationale: യവത്തിൽനിന്നുള്ള മാവ് എന്ന സംയുക്തത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: അതിന്മേൽ എണ്ണ ഒഴിക്കുകയോ കുന്തിരിക്കം വയ്ക്കുകയോ അരുത്
  rationale: രണ്ടു നിഷേധനിർദേശങ്ങളും മലയാളത്തിൽ ഒരൊറ്റ സ്വാഭാവിക ഘടനയിൽ നൽകി; לְבֹנָה സുഗന്ധധൂപരസമായ കുന്തിരിക്കമാണ്.
- source_word: מִנְחַת קְנָאֹת
  choice: അസൂയയുടെ ധാന്യവഴിപാട്
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിൽ מִנְחָה ‘ധാന്യവഴിപാട്’ ആണെന്നും קְנָאֹת അസൂയയെയോ അസൂയജന്യ സംശയത്തെയോ സൂചിപ്പിക്കുന്ന വിശാലപദമാണെന്നും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: מִנְחַת זִכָּרוֹן
  choice: ഓർമയ്ക്കായുള്ള വഴിപാട്
  rationale: זִכָּרוֹן എന്നതിന്റെ ഓർമ/സ്മാരക ധ്വനി നിലനിർത്തി, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: അകൃത്യം ഓർമയിൽ വരുത്തുന്ന വഴിപാട്
  rationale: ഹീബ്രു പങ്കുപദത്തിന്റെ പ്രവർത്തകബലം നിലനിർത്തുന്നു; עָוֹן എന്നതിലെ അകൃത്യം, കുറ്റം, കുറ്റബാധ്യത എന്നീ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: അസൂയാവഴിപാടിന്റെ നീതിന്യായപരമായ അർഥം
  choice: സ്ത്രീ കുറ്റക്കാരിയാണെന്നോ കുറ്റമില്ലാത്തവളാണെന്നോ ഈ വാക്യത്തിൽ മുൻകൂട്ടി വിധിക്കാതെ, വഴിപാടിന്റെ ഘടനയും ഓർമയിൽ വരുത്തുന്ന പ്രവർത്തനവും മാത്രം വിവർത്തനം ചെയ്തു.
  alternative: ഈ വഴിപാട് സ്ത്രീയുടെ കുറ്റം മുൻകൂട്ടി അനുമാനിക്കുന്നു എന്നോ, അതിന് നീതിന്യായപരമായ പ്രസക്തിയില്ലെന്നോ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം സ്ത്രീയുടെ നില നിർണയിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരവും നീതിന്യായപരവുമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശശൈലി. ‘പുരോഹിതൻ’, ‘ധാന്യവഴിപാട്’, ‘കുന്തിരിക്കം’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ-ആരാധനാപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
