  to: ആൺമുതൽ പെൺവരെ അവരെ പാളയത്തിനു പുറത്തേക്ക് അയയ്ക്കണം; ഞാൻ അവരുടെ മധ്യേ വസിക്കുന്ന അവരുടെ പാളയങ്ങളെ അവർ അശുദ്ധമാക്കാതിരിക്കേണ്ടതിന് അവരെ പുറത്തേക്ക് അയയ്ക്കണം.[a]
