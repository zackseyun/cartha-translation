id: NUM.5.3
reference: Numbers 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: ml
  text: ആൺമുതൽ പെൺവരെ അവരെ പാളയത്തിനു പുറത്തേക്ക് അയയ്ക്കണം; ഞാൻ അവരുടെ മധ്യേ വസിക്കുന്ന അവരുടെ പാളയങ്ങളെ അവർ അശുദ്ധമാക്കാതിരിക്കേണ്ടതിന് അവരെ പുറത്തേക്ക് അയയ്ക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ അവയുടെ മധ്യേ വസിക്കുന്ന അവരുടെ പാളയങ്ങളെ.” ഹീബ്രായത്തിലെ “അവരുടെ/അവയുടെ മധ്യേ” എന്നത് പാളയങ്ങളെയോ അവയുമായി ബന്ധപ്പെട്ട ജനത്തെയോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: ആണായാലും പെണ്ണായാലും
  rationale: ഹീബ്രായ പ്രയോഗം ആൺമുതൽ പെൺവരെ എന്ന സമഗ്രമായ ഉൾക്കൊള്ളൽ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും ജൈവലിംഗജോടി വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: അവരെ ... അയയ്ക്കണം; ... അവരെ പുറത്തേക്ക് അയയ്ക്കണം
  rationale: שלח എന്ന ക്രിയയുടെ പീയേൽ രൂപത്തിലുള്ള ആവർത്തനം നിലനിർത്തുന്നു; ശിക്ഷാത്മകമായ ‘പുറത്താക്കുക’ എന്നതിനെക്കാൾ പാളയത്തിനു പുറത്തേക്കുള്ള മാറ്റം നേരിട്ട് പറയുന്നു.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്ക്
  rationale: പാളയത്തിന്റെ അതിർത്തിക്കപ്പുറത്തേക്കുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יְטַמְּאוּ
  choice: അശുദ്ധമാക്കാതിരിക്കേണ്ടതിന്
  rationale: പുരോഹിതീയ ശുദ്ധി-അശുദ്ധി സന്ദർഭത്തിലെ טמא എന്ന പദത്തിന്റെ ആചാരപരമായ അർത്ഥം ‘അശുദ്ധമാക്കുക’ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: מַחֲנֵיהֶם
  choice: തങ്ങളുടെ പാളയങ്ങളെ
  rationale: ഹീബ്രായത്തിലെ ബഹുവചന നാമവും മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയവും സംരക്ഷിക്കുന്നു; പാളയത്തിന്റെ വിവിധ വിഭാഗങ്ങളെയോ പാളയവിന്യാസങ്ങളെയോ സൂചിപ്പിക്കാം.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: ഞാൻ അവരുടെ മധ്യേ വസിക്കുന്നതിനാൽ
  rationale: בְּתוֹכָם എന്ന പുരുഷലിംഗ ബഹുവചനരൂപം പാളയങ്ങളുമായി ബന്ധപ്പെട്ട ജനത്തെയോ സമൂഹമായ പാളയങ്ങളെയോ സൂചിപ്പിക്കാവുന്ന വിധത്തിൽ വ്യക്തിപരവും സമൂഹപരവുമായ ദൈവസാന്നിധ്യം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: בְּתוֹכָם എന്നതിന്റെ പൂർവപദം പാളയങ്ങളാണോ അവയുമായി ബന്ധപ്പെട്ട ജനമാണോ
  choice: ഞാൻ അവരുടെ മധ്യേ വസിക്കുന്നതിനാൽ
  alternative: ഞാൻ അവയുടെ മധ്യേ വസിക്കുന്നതിനാൽ
  rationale: ഹീബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചന പ്രത്യയം പാളയങ്ങളെയോ അവയിലെ ജനത്തെയോ ലക്ഷ്യമാക്കാം. മുഖ്യപാഠം ദൈവം ജനത്തിന്റെ മധ്യേ വസിക്കുന്നു എന്ന വ്യക്തിപര-സാമൂഹിക ഭാവം നൽകുന്നു; സ്ഥലപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പാളയങ്ങൾ’ എന്ന ഹീബ്രായ ബഹുവചനം നിലനിർത്തി; ക്രിയയുടെ ആവർത്തനവും ആചാരപരമായ ‘അശുദ്ധമാക്കുക’ എന്ന ആശയവും സംരക്ഷിച്ചു.
