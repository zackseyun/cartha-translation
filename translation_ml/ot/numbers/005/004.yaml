  revised_text: ഇസ്രായേൽമക്കൾ അങ്ങനെ ചെയ്തു; അവരെ പാളയത്തിനു പുറത്തേക്ക് അയച്ചു. യഹോവ മോശെയോടു പറഞ്ഞതുപോലെ, ഇസ്രായേൽമക്കൾ അങ്ങനെ ചെയ്തു.
  revised_footnotes: []
