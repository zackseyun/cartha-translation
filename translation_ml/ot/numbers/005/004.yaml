id: NUM.5.4
reference: Numbers 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ അങ്ങനെ ചെയ്തു; അവരെ പാളയത്തിനു പുറത്തേക്ക് അയച്ചു. യഹോവ മോശെയോടു പറഞ്ഞതുപോലെ, ഇസ്രായേൽമക്കൾ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: അങ്ങനെതന്നെ ചെയ്തു
  rationale: മുമ്പ് നൽകിയ കല്പന അനുസരിച്ചതിനെ സൂചിപ്പിക്കുന്ന עשה + כן എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമായ മലയാളരൂപം.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധസൂചകമായ പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് ജനസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: അവരെ ... അയച്ചു
  rationale: ഇവിടെ שׁלח ആളുകളെ പാളയത്തിൽനിന്ന് മാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനം ചേർന്നതിനാൽ ‘അയച്ചു’ എന്ന നേരിട്ടുള്ള രൂപം മതിയാകുന്നു.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: പാളയത്തിനു പുറത്തേക്ക്
  rationale: ദിശയും പാളയത്തിൽനിന്നുള്ള ഒഴിവാക്കലും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: അരുളിച്ചെയ്തതുപോലെതന്നെ
  rationale: ദൈവം മുമ്പ് പറഞ്ഞ കല്പനയോടുള്ള കൃത്യമായ അനുരൂപത പ്രകടമാക്കുന്നു; ദൈവവചനസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ മലയാളക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ നാമരൂപത്തിൽ നൽകുന്നു.
- source_word: כֵּן עָשׂוּ
  choice: അതുപോലെതന്നെ ... ചെയ്തു
  rationale: ഇസ്രായേലിന്റെ അനുസരണം ഊന്നിപ്പറയുന്ന മൂലപാഠത്തിലെ സമാപന ആവർത്തനം ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന പദവിയായി മാറ്റാതെ സംരക്ഷിക്കുന്നു. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥിരമായി പരിചിതമായ ലിപ്യന്തരണം തിരഞ്ഞെടുത്തു; കൃത്യമായ പുരാതന ഉച്ചാരണം സംബന്ധിച്ച അനിശ്ചിതത്വം അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ തുടക്കവും അവസാനവും വരുന്ന അനുസരണസൂചക ആവർത്തനം നിലനിർത്തിയിട്ടുണ്ട്. പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമായ പാഠഭേദമോ നിർണായകമായ അർത്ഥദ്വയത്വമോ ഈ വാക്യത്തിലില്ല.
