  naturalness: “അരുളിച്ചെയ്തതുപോലെതന്നെ” is intelligible, but it is elevated and somewhat archaic for modern standard Malayalam. “മോശെയോടു പറഞ്ഞതുപോലെ” is direct, natural, and fully conveys דִּבֶּר (‘spoke/said to’).
  terminology: “ഇസ്രായേൽമക്കൾ” preserves the familial Hebrew expression בני ישראל and functions naturally as a corporate designation in Malayalam biblical usage. “പാളയത്തിനു പുറത്തേക്ക്” correctly conveys removal to outside the camp. No footnote is needed for this verse.
