  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: ml
  text: 'യഹ്‌വേ മോശെയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക വചനപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾ ശൈലിയിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം; ഇവിടെ പുതിയ ദൈവവചനഘടകം ആരംഭിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ ആധുനികവും സ്വാഭാവികവുമായ മലയാള ദത്തിവിഭക്തിയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; അനാവശ്യമായ ‘ഇപ്രകാരം’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ദൈവവചനപ്രയോഗമാണ്. അടുത്ത വാക്യത്തിലെ പ്രസംഗഭാഗം വരുന്നതായി ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
