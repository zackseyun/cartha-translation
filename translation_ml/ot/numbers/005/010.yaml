reference: Numbers 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אִ֥ישׁ אֶת קֳדָשָׁ֖י/ו ל֣/וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר יִתֵּ֥ן לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: ml
  text: ഓരോ പുരുഷന്റെയും വിശുദ്ധവസ്തുക്കൾ അവനുള്ളതായിരിക്കും[a]; ഒരു പുരുഷൻ പുരോഹിതനു നൽകുന്നതെല്ലാം അവനുള്ളതായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ വിശുദ്ധവസ്തുക്കൾ.’ വിശുദ്ധമായി വേർതിരിച്ച അർപ്പണവസ്തുക്കളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ, ‘അവനുള്ളതായിരിക്കും.’ ഇവിടെ ‘അവൻ’ പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നത്: പുരോഹിതനു നൽകുന്നതു പുരോഹിതനുള്ളതാകും.'
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: ഓരോ പുരുഷൻ / ഒരു പുരുഷൻ
  rationale: നിയമസന്ദർഭത്തിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായ പദം വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു. ആദ്യപ്രയോഗത്തിൽ ‘ഓരോ പുരുഷന്റെയും’ എന്നും രണ്ടാമത്തേതിൽ ‘ഒരു പുരുഷൻ’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: קֳדָשָׁיו
  choice: അവന്റെ വിശുദ്ധവസ്തുക്കൾ
  rationale: קדשׁ എന്ന പദത്തിന്റെ ബഹുവചനം ഇവിടെ വിശുദ്ധമായി വേർതിരിച്ച അർപ്പണവസ്തുക്കളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധവസ്തുക്കൾ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; അവ സമ്മാനങ്ങളോ അർപ്പണങ്ങളോ ആണെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לוֹ יִהְיוּ
  choice: അവന്റേതായിരിക്കും
  rationale: ഈ ഘടന ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു. എബ്രായയിലെ സംക്ഷിപ്തമായ ഉടമസ്ഥതാസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: ഒരു പുരുഷൻ പുരോഹിതനു കൊടുക്കുന്നതെന്തും
  rationale: ബന്ധവാക്യത്തിന്റെ സാമാന്യമായ നിയമബലം ‘കൊടുക്കുന്നതെന്തും’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. לַכֹּהֵן എന്ന നിർദിഷ്ട ഏകവചനം ‘പുരോഹിതനു’ എന്നു നിലനിർത്തിയിരിക്കുന്നു.
- source_word: לוֹ יִהְיֶה
  choice: പുരോഹിതന്റേതായിരിക്കും
  rationale: അവസാനത്തെ לוֹ എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ സൂചിതനെ മലയാളത്തിൽ ‘പുരോഹിതൻ’ എന്നു വ്യക്തമാക്കുന്നത് ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; ഉടമസ്ഥതാസൂത്രം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യത്തെ ‘അവന്റേതായിരിക്കും’ എന്നതിന്റെ സൂചിതൻ
  choice: ദാതാവായ പുരുഷനെ സൂചിപ്പിക്കുന്നതായി പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: പുരോഹിതനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം
  rationale: എബ്രായയിലെ לוֹ വ്യാകരണപരമായി സംക്ഷിപ്തവും സന്ദർഭത്തിൽ ഒരു പരിധിവരെ അനിശ്ചിതവുമാണ്. അടുത്ത വാക്യഭാഗം പുരോഹിതനു നൽകുന്നതു പുരോഹിതന്റേതാകുമെന്ന് വ്യക്തമാക്കുന്നതിനാൽ, ആദ്യഭാഗം സമർപ്പിക്കുന്നതിനു മുമ്പുള്ള ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമശൈലി സ്വീകരിച്ചു. ‘വിശുദ്ധവസ്തുക്കൾ’ എന്നത് ആരാധനാസംബന്ധിയായ അർപ്പണങ്ങളുടെ പരിധി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. അവസാന സർവനാമത്തിന്റെ സൂചിതനെ പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കിയെങ്കിലും എബ്രായയിലെ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
