  source_fidelity: The draft accurately represents the distributive ‘each man/a man,’ the plural consecrated items, and the two possession formulas. However, the final Hebrew לּוֹ is retained as a pronoun in the source; identifying it as ‘the priest’ in the main text resolves a contextual referent that the source leaves grammatically terse. This clarification is best retained in the footnote, following the audit trail.
