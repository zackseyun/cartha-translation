id: NUM.5.26
reference: Numbers 5:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: ml
  text: പിന്നെ പുരോഹിതൻ ധാന്യയാഗത്തിൽനിന്ന് അതിന്റെ സ്മരണാംശമായ ഒരു കൈപ്പിടി എടുത്ത് യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം; അതിനുശേഷം പുരോഹിതൻ ആ സ്ത്രീയെ ആ വെള്ളം കുടിപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָמַץ
  choice: ഒരു കൈപ്പിടി എടുത്ത്
  rationale: യാഗസന്ദർഭത്തിൽ קמץ യാഗവസ്തുവിൽനിന്ന് ഒരു കൈപ്പിടിയളവ് എടുക്കുന്ന നിർദിഷ്ട കർമത്തെ സൂചിപ്പിക്കുന്നു. നിയമനിർദേശത്തിലെ ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ തുടർക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: הַכֹּהֵן
  choice: പുരോഹിതൻ
  rationale: ആരാധനാകർമവും യാഗനിയമവും സംബന്ധിച്ച സന്ദർഭത്തിൽ כֹּהֵן എന്നതിന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: מִן הַמִּנְחָה
  choice: ധാന്യയാഗത്തിൽനിന്ന്
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിലെ מִנְחָה പൊതുവായ കാഴ്ചയല്ല, ധാന്യയാഗമാണ്.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: അതിന്റെ സ്മരണാംശമായി
  rationale: אַזְכָּרָה യാഗപീഠത്തിൽ ദഹിപ്പിക്കുന്ന ധാന്യയാഗത്തിന്റെ സ്മരണാംശത്തെ സൂചിപ്പിക്കുന്നു. സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ധാന്യയാഗത്തിലേക്കാണ് മടങ്ങുന്നത്. 'സ്മരണാംശമായി ഒരു കൈപ്പിടി' എന്ന വാക്യക്രമം ആ കൈപ്പിടി തന്നെയാണ് സ്മരണാംശം എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: യാഗപീഠത്തിന്മേൽ ദഹിപ്പിക്കണം
  rationale: הקטיר യാഗമായി കത്തിച്ചു പുകയുയർത്തുന്ന കർമമാണ്. ലളിതവും ആചാരപരമായ അർത്ഥം നിലനിർത്തുന്നതുമായ 'ദഹിപ്പിക്കുക' തിരഞ്ഞെടുത്തു; ה locale സൂചിപ്പിക്കുന്ന ദിശ/സ്ഥാനം 'യാഗപീഠത്തിന്മേൽ' എന്നു നൽകി.
- source_word: וְאַחַר
  choice: അതിനു ശേഷം
  rationale: കർമങ്ങളുടെ സമയക്രമം സൂചിപ്പിക്കുന്ന അവ്യയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יַשְׁקֶה
  choice: കുടിപ്പിക്കണം
  rationale: שׁקה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലുള്ള causative അർത്ഥം—സ്ത്രീയെ കുടിക്കാൻ ഇടയാക്കുക—'കുടിപ്പിക്കുക' വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת הָאִשָּׁה
  choice: ആ സ്ത്രീയെ
  rationale: നിർദിഷ്ട കർമത്തിന്റെ നേരിട്ടുള്ള കർമം; ഹീബ്രു നിർദിഷ്ടത മലയാളത്തിൽ 'ആ' ഉപയോഗിച്ച് സ്വാഭാവികമായി സൂചിപ്പിച്ചു.
- source_word: אֶת הַמָּיִם
  choice: ആ വെള്ളം
  rationale: വാക്യത്തിൽ 'വെള്ളം' എന്നുമാത്രമാണ്; സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ നിർദിഷ്ട വെള്ളമാണെന്നത് 'ആ' സൂചിപ്പിക്കുന്നു. സമീപവാക്യങ്ങളിൽനിന്ന് 'കയ്പുള്ള' എന്ന വിശേഷണം ഇവിടെ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ വെള്ളത്തെ മുഖ്യപാഠത്തിൽ 'കയ്പുള്ള വെള്ളം' എന്നു വിശേഷിപ്പിക്കണമോ
  choice: '''ആ വെള്ളം'' എന്ന ലളിതമായ പ്രയോഗം നിലനിർത്തി'
  alternative: '''കയ്പുള്ള വെള്ളം'''
  rationale: ഈ വാക്യത്തിലെ ഹീബ്രു הַמָּיִם എന്നുമാത്രമാണ് പറയുന്നത്. വിശാലസന്ദർഭം അതിനെ കയ്പുള്ള വെള്ളമായി തിരിച്ചറിയുന്നുവെങ്കിലും ആ വിശേഷണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് ഈ വാക്യത്തിന്റെ പദപരിധിക്കപ്പുറത്തേക്കുള്ള വ്യാഖ്യാനമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിയമനിർദേശശൈലി. യാഗസാങ്കേതികതയ്ക്കായി 'ധാന്യയാഗം', 'സ്മരണാംശം', 'യാഗപീഠം' എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ ഈ വാക്യത്തിനായി ആവശ്യമായ യഥാർത്ഥ പാഠാന്തരമോ അനിവാര്യമായ വിശദീകരണകുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് ഈ വാക്യത്തിലെ 'grain offering' എന്നിടത്ത് പതിപ്പിച്ചിരിക്കുമ്പോഴും അതിന്റെ ഉള്ളടക്കം 'water' എന്ന പദത്തെക്കുറിച്ചാണ്, അതിനാൽ ആ പൊരുത്തക്കേട് മലയാളപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
