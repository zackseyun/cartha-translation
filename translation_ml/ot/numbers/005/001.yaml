id: NUM.5.1
reference: Numbers 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വേ മോശയോടു സംസാരിച്ചു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ: YHWH (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്ന് വിവർത്തനം ചെയ്യപ്പെടുന്നു. ‘യഹോവ’ എന്ന രൂപവും ഉപയോഗിക്കപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപം, പരമ്പരാഗത സ്ഥാനപ്പേരായ പരിഭാഷ, മറ്റൊരു ലിപ്യന്തരണരൂപം എന്നിവ വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דִּבֵּר ഒരു പുതിയ ദൈവിക അരുളപ്പാട് ആരംഭിക്കുന്നു; ഈ സൂത്രവാക്യത്തിൽ ‘സംസാരിച്ചു’ എന്നത് സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണത്തിലൂടെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ ‘-യോടു’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; מֹשֶׁה എന്ന പേര് പതിവായ മലയാളരൂപത്തിൽ ‘മോശ’ എന്നു നൽകുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്കായി ദ്വിബിന്ദു
  rationale: ഈ പതിവ് എബ്രായ പ്രസംഗമുഖവുരയിലെ לֵאמֹר അടുത്ത വാക്യത്തിലെ ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ഇപ്രകാരം പറഞ്ഞു’ എന്നു ആവർത്തിക്കുന്നതിനേക്കാൾ ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വേ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ പേര് നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്കിടയിൽ പരിചിതമായ ലിപ്യന്തരണം ‘യഹോവ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുകയും മറ്റു രൂപത്തെ അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. പതിവ് ദൈവിക പ്രസംഗമുഖവുരയുടെ സംക്ഷിപ്തത കാത്തു; അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള അരുളപ്പാടിലേക്കുള്ള ബന്ധം ദ്വിബിന്ദുവിലൂടെ പ്രകടിപ്പിച്ചു.
