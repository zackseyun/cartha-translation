  terminology: ‘അസൂയയുടെ ഒരു വികാരം’ רוּחַയുടെ ഈ സന്ദർഭത്തിലെ മനോഭാവ/പ്രേരണാർഥം സ്വാഭാവികമായി നൽകുന്നു; അതിനെ മാറ്റേണ്ടതില്ല. ‘മലിനയായിരിക്കുന്നു’ അശുദ്ധി-മലിനതാഭാഷ നിലനിർത്തുകയും, സ്വയം വരുത്തിയെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
