  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: ml
  text: അസൂയയുടെ ഒരു വികാരം അവനെ ബാധിക്കുകയും അവൻ തന്റെ ഭാര്യയെക്കുറിച്ച് അസൂയപ്പെടുകയും, അവൾ മലിനയായിരിക്കുകയും ചെയ്താൽ[a]; അല്ലെങ്കിൽ, അസൂയയുടെ ഒരു വികാരം അവനെ ബാധിക്കുകയും അവൻ തന്റെ ഭാര്യയെക്കുറിച്ച് അസൂയപ്പെടുകയും ചെയ്തിട്ടും അവൾ മലിനയായിട്ടില്ലെങ്കിൽ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അശുദ്ധയായിരിക്കുന്നു.’ എബ്രായപദം ആചാരപരമായ അശുദ്ധിയെയും സൂചിപ്പിക്കാം; ഇവിടെ അത് സംശയിക്കപ്പെടുന്ന ലൈംഗിക അവിശ്വസ്തതയോടു ബന്ധപ്പെട്ട മലിനതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവൾ മലിനയായിട്ടില്ല.’ എബ്രായത്തിൽ ഇവിടെ ലളിതമായ ‘കൂടാതെ/ഉം’ എന്ന സംയോജകമാണ്; രണ്ടു നിയമസാഹചര്യങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ ‘ചെയ്തിട്ടും’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: അവനെ പിടികൂടുകയും
  rationale: റൂഅഹ് എന്ന ആന്തരിക പ്രേരണയോ മനോഭാവമോ ഒരാളെ ശക്തമായി ബാധിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: רוּחַ קִנְאָה
  choice: അസൂയയുടെ ഒരു വികാരം
  rationale: רוּחַ എന്നതിന് ആത്മാവ്, കാറ്റ്, മനോഭാവം/പ്രേരണ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ അസൂയ ഉണർത്തുന്ന മനോഭാവമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്; അതിനെ വേറിട്ട ആത്മസത്തയായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കാതിരിക്കാൻ ‘വികാരം’ എന്നു നൽകി.
- source_word: וְקִנֵּא אֶת־אִשְׁתּוֹ
  choice: അവൻ തന്റെ ഭാര്യയെച്ചൊല്ലി അസൂയപ്പെടുകയും ചെയ്യുന്നു
  rationale: ഭാര്യയെ സംബന്ധിച്ച ഭർത്താവിന്റെ അസൂയാപരമായ പ്രതികരണം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: נִטְמָאָה
  choice: അവൾ തന്നെത്താൻ മലിനയാക്കിയിരിക്കുന്നു
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പദം സംശയിക്കപ്പെടുന്ന ലൈംഗിക അവിശ്വസ്തത മൂലമുള്ള അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. ‘മലിനയാക്കി’ എന്നത് ധാർമികവും ആചാരപരവുമായ അശുദ്ധിയുടെ ഒത്തുചേരൽ നിലനിർത്തുന്നു.
- source_word: אוֹ
  choice: അല്ലെങ്കിൽ
  rationale: നിയമത്തിൽ അവതരിപ്പിക്കുന്ന രണ്ടാമത്തെ സാധ്യതയെ നേരിട്ട് അടയാളപ്പെടുത്തുന്നു.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: എന്നാൽ അവൾ തന്നെത്താൻ മലിനയാക്കിയിട്ടില്ല
  rationale: എബ്രായത്തിൽ സാധാരണ സംയോജകമായ ‘וְ’ ആണെങ്കിലും, ആദ്യ സാഹചര്യത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം മലയാളത്തിലെ ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സംശയിക്കപ്പെടുന്ന വ്യഭിചാരത്തെക്കുറിച്ചുള്ള നിയമത്തിലെ അശുദ്ധിഭാഷ
  choice: ‘തന്നെത്താൻ മലിനയാക്കിയിരിക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘അശുദ്ധയായിരിക്കുന്നു’ / ‘മലിനയായിരിക്കുന്നു’
  rationale: സന്ദർഭം കേവലം ആചാരപരമായ അശുദ്ധിയല്ല, ദാമ്പത്യ അവിശ്വസ്തതയുമായി ബന്ധപ്പെട്ട ധാർമിക-ആചാരപരമായ മലിനതയാണ്. ആത്മപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പരിഭാഷ സന്ദർഭം വ്യക്തമാക്കുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തനിഗമനം ചേർക്കുന്നില്ല.
- issue: രണ്ടാമത്തെ സാഹചര്യത്തിലെ സംയോജകത്തിന്റെ വൈരുധ്യാർഥം
  choice: ‘എന്നാൽ’ എന്ന് നൽകി
  alternative: ‘കൂടാതെ/ഉം’ എന്ന അക്ഷരാർഥ സംയോജനം
  rationale: ഭാര്യ യഥാർഥത്തിൽ മലിനയായിട്ടില്ലെങ്കിലും ഭർത്താവിന് അസൂയ തോന്നുന്ന വിപരീത സാഹചര്യമാണിത്. ‘എന്നാൽ’ നിയമപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; മൂലത്തിലെ ലളിത സംയോജകം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമവിവരണ ശൈലി. ‘അസൂയയുടെ ആത്മാവ്’ എന്നത് സ്വതന്ത്ര ആത്മസത്തയെ നിർബന്ധിച്ച് സൂചിപ്പിക്കാമെന്നതിനാൽ, സന്ദർഭോചിതമായി ‘അസൂയയുടെ ഒരു വികാരം’ ഉപയോഗിച്ചു. ആവർത്തനഘടന മൂലപാഠത്തെപ്പോലെ നിലനിർത്തി.
