- from: അസൂയയുടെ ഒരു വികാരം അവനെ പിടികൂടുകയും അവൻ തന്റെ ഭാര്യയെച്ചൊല്ലി അസൂയപ്പെടുകയും ചെയ്യുന്നു; അവൾ തന്നെത്താൻ മലിനയാക്കിയിരിക്കുന്നു[a]. അല്ലെങ്കിൽ അസൂയയുടെ ഒരു വികാരം അവനെ പിടികൂടുകയും അവൻ തന്റെ ഭാര്യയെച്ചൊല്ലി അസൂയപ്പെടുകയും ചെയ്യുന്നു; എന്നാൽ അവൾ തന്നെത്താൻ മലിനയാക്കിയിട്ടില്ല[b].
  to: അസൂയയുടെ ഒരു വികാരം അവനെ ബാധിക്കുകയും അവൻ തന്റെ ഭാര്യയെക്കുറിച്ച് അസൂയപ്പെടുകയും, അവൾ മലിനയായിരിക്കുകയും ചെയ്താൽ[a]; അല്ലെങ്കിൽ, അസൂയയുടെ ഒരു വികാരം അവനെ ബാധിക്കുകയും അവൻ തന്റെ ഭാര്യയെക്കുറിച്ച് അസൂയപ്പെടുകയും ചെയ്തിട്ടും അവൾ മലിനയായിട്ടില്ലെങ്കിൽ[b],
