id: NUM.20.18
reference: Numbers 20:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: ml
  text: 'എന്നാൽ ഏദോം അവനോടു പറഞ്ഞു: “നീ എന്റെ ദേശത്തുകൂടി കടന്നുപോകരുത്[a]. അല്ലെങ്കിൽ ഞാൻ വാളുമായി നിന്നെ നേരിടാൻ വരും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “എന്നിലൂടെ.” ഒരു ജനതയെയും അതിന്റെ പ്രദേശത്തെയും പ്രതിനിധീകരിച്ചാണ് ഏദോം സംസാരിക്കുന്നത്; അതിനാൽ ഏദോമിന്റെ ദേശത്തുകൂടിയുള്ള യാത്രയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്നെ കാണാൻ വരും.” ഈ സന്ദർഭത്തിൽ ആയുധവുമായി ശത്രുതാപരമായി എതിരിടുക എന്ന അർഥമാണ് പ്രയോഗത്തിനുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: അവനോടു പറഞ്ഞു
  rationale: אמר എന്ന ആഖ്യാനക്രിയയും אֵלָיו എന്ന ദിശാസൂചക പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: ജനതയെയും ദേശത്തെയും സൂചിപ്പിക്കുന്ന നാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: לֹא תַעֲבֹר
  choice: നീ ... കടന്നുപോകരുത്
  rationale: രണ്ടാം പുരുഷ ഏകവചനത്തിലെ വിലക്കും ഉറച്ച നിരാകരണവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בִּי
  choice: എന്റെ ദേശത്തുകൂടി
  rationale: അക്ഷരാർഥം ‘എന്നിലൂടെ/എന്നിൽ’ എന്നാണെങ്കിലും, സംസാരിക്കുന്നത് ദേശമായി വ്യക്തിവൽക്കരിക്കപ്പെട്ട ഏദോമായതിനാൽ ഉദ്ദേശിക്കുന്ന ഭൗമിക അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകി; അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സൂചിപ്പിക്കുന്നു.
- source_word: פֶּן
  choice: അല്ലെങ്കിൽ
  rationale: ഇവിടെ തുടർന്നുവരുന്ന ഭീഷണിപരമായ ഫലം അവതരിപ്പിക്കുന്ന മുന്നറിയിപ്പിന്റെ ശക്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בַּחֶרֶב
  choice: വാളുമായി
  rationale: ആയുധസജ്ജമായ ശത്രുതാപരമായ വരവിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായി പകർന്നു.
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: ഞാൻ ... നിന്നെ നേരിടാൻ വരും
  rationale: יצא എന്ന ‘പുറപ്പെടുക’ എന്ന ആശയവും לִקְרָאתֶךָ എന്ന ‘നിന്നെ കാണാൻ/എതിരേൽക്കാൻ’ എന്ന ദിശയും യുദ്ധഭീഷണിയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ചേർത്തു; അടിസ്ഥാനപ്രയോഗത്തിന്റെ താരതമ്യേന നിഷ്പക്ഷമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഏദോമിനെ സംസാരിക്കുന്ന ദേശമായി കാണിക്കുന്ന എബ്രായ വ്യക്തിവൽക്കരണം അർഥപരമായി നിലനിർത്തുകയും, അസ്വാഭാവികമായ ‘എന്നിലൂടെ’ എന്ന മുഖ്യവാചകത്തിന് പകരം അതിന്റെ ഉദ്ദേശ്യം നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്തു.
