id: NUM.20.10
reference: Numbers 20:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: ml
  text: 'പിന്നെ മോശെയും അഹരോനും സമൂഹത്തെ പാറയുടെ മുമ്പിൽ ഒരുമിച്ചുകൂട്ടി. അവൻ അവരോടു പറഞ്ഞു: “ഇപ്പോൾ കേൾക്കുവിൻ, ധിക്കാരികളേ! ഈ പാറയിൽനിന്ന് ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി വെള്ളം പുറപ്പെടുവിക്കണമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഈ പാറയിൽനിന്ന് ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി വെള്ളം പുറത്തുകൊണ്ടുവരണമോ?”'
    reason: കാരകക്രിയയായ נוֹצִיא എന്നതിന്റെ അടുത്തൊരു മലയാള പദപ്രയോഗം നൽകുന്നു.
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: ഒരുമിച്ചുകൂട്ടി
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘കൂടിവരുത്തുക/ഒരുമിച്ചുകൂട്ടുക’ എന്ന കാരകാർഥം നൽകുന്നു; ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַקָּהָל
  choice: സമൂഹത്തെ
  rationale: കൂടിവന്ന ജനസമൂഹത്തെയാണ് קָהָל സൂചിപ്പിക്കുന്നത്. ‘സമൂഹം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; പിൽക്കാല മതസ്ഥാപനപരമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: പാറയുടെ മുമ്പിൽ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ നേരായ, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: וַיֹּאמֶר
  choice: അവൻ ... പറഞ്ഞു
  rationale: എബ്രായ ക്രിയ ഏകവചനത്തിലാണ്. മോശെ എന്നു വ്യാഖ്യാനിച്ച് പേരുചേർക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: שִׁמְעוּ נָא
  choice: ഇപ്പോൾ കേൾക്കുവിൻ
  rationale: ബഹുവചന കല്പനയും נָא നൽകുന്ന ഊന്നലും അടിയന്തരതയും മാന്യവും ശക്തവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַמֹּרִים
  choice: മത്സരികളേ
  rationale: מרה എന്ന ധാതുവിൽനിന്നുള്ള ഈ നാമപ്രയോഗം എതിർക്കുകയും അനുസരിക്കാതിരിക്കുകയും ചെയ്യുന്നവരെ നേരിട്ട് ശാസിക്കുന്നു; ‘മത്സരികൾ’ അതിന്റെ കലഹപരമായ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: ഈ പാറയിൽനിന്ന്
  rationale: ചോദ്യചിഹ്നത്തോടുകൂടിയ מן ഉറവിടം സൂചിപ്പിക്കുന്നു; ‘ഈ പാറയിൽനിന്ന്’ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: נוֹצִיא
  choice: ഞങ്ങൾ ... പുറപ്പെടുവിക്കണമോ
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തുവരുത്തുക’ എന്ന കാരകാർഥവും ഒന്നാംപുരുഷ ബഹുവചനവും ചോദ്യസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: מָיִם
  choice: വെള്ളം
  rationale: സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാള പദം.
theological_decisions:
- issue: മോശെയുടെ ചോദ്യത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനം
  choice: ഞങ്ങൾ നിങ്ങൾക്കുവേണ്ടി വെള്ളം പുറപ്പെടുവിക്കണമോ?
  alternative: ദൈവം നിങ്ങൾക്കുവേണ്ടി വെള്ളം പുറപ്പെടുവിക്കണമോ?
  rationale: נוֹצִיא വ്യക്തമായി ഒന്നാംപുരുഷ ബഹുവചനമാണ്. ദൈവത്തിന്റെ പ്രവർത്തനവും മോശെ-അഹരോൻമാരുടെ പങ്കും തമ്മിലുള്ള ആഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ വിശദീകരിച്ചോ മയപ്പെടുത്തിയോ തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളം; ആഖ്യാനത്തിൽ സ്വാഭാവികതയും അഭിസംബോധനയിൽ ഗൗരവവും നേരിട്ടുള്ള ശാസനാഭാവവും നിലനിർത്തി. ‘കേൾക്കുവിൻ’ എന്ന രൂപം വചനത്തിന്റെ ഗൗരവത്തിന് യോജിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമാണ്.
