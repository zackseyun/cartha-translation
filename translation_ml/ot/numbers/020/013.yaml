  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: ml
  text: ഇവ മെരീബയിലെ വെള്ളങ്ങളാണ്[a]. അവിടെ ഇസ്രായേൽമക്കൾ യഹോവയോടു തർക്കിച്ചു; അവർക്കിടയിൽ അവിടുന്ന് തന്റെ വിശുദ്ധി വെളിപ്പെടുത്തി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മെരീബ എന്ന പേരിന് ‘തർക്കം’ അഥവാ ‘കലഹം’ എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവരിൽ അവിടുന്ന് വിശുദ്ധനായി വെളിപ്പെട്ടു’; അല്ലെങ്കിൽ ‘അവരിലൂടെ അവിടുന്ന് തന്റെ വിശുദ്ധി തെളിയിച്ചു.’'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: ഇവ ... ആണ്
  rationale: സ്ഥലത്തെയും വെള്ളത്തെയും തിരിച്ചറിയിക്കുന്ന നാമകരണവാക്യമായതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ വർത്തമാനകാലരൂപം ഉപയോഗിച്ചു.
- source_word: מֵי מְרִיבָה
  choice: മെരീബയിലെ വെള്ളം
  rationale: מְרִיבָה ഇവിടെ സ്ഥാപിതമായ സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം ചെയ്തു; അതിന്റെ ‘തർക്കം/കലഹം’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: רָבוּ
  choice: തർക്കിച്ചു
  rationale: ריב എന്ന ക്രിയയുടെ തർക്കിക്കുക, വാദിക്കുക എന്ന അർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രു പ്രയോഗത്തിന്റെ വംശീയ-ഉടമ്പടിപരമായ സ്വഭാവവും രൂപപരമായ ‘മക്കൾ’ എന്ന ആശയവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: וַיִּקָּדֵשׁ
  choice: അവിടുന്ന് തന്റെ വിശുദ്ധി വെളിപ്പെടുത്തി
  rationale: നിഫാൽ രൂപത്തിലെ പ്രത്യക്ഷീകരണ/സ്വയം വെളിപ്പെടുത്തൽ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മനുഷ്യർ ദൈവത്തെ വിശുദ്ധനാക്കി എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: בָּם
  choice: അവർക്കിടയിൽ
  rationale: സംഭവത്തിൽ ഉൾപ്പെട്ട ഇസ്രായേൽജനത്തിന്റെ മധ്യേ ദൈവത്തിന്റെ വിശുദ്ധി പ്രകടമായി എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘അവരിലൂടെ’ എന്ന ഉപകരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ യഹോവയുടെ വിശുദ്ധീകരണം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അവർക്കിടയിൽ അവിടുന്ന് തന്റെ വിശുദ്ധി വെളിപ്പെടുത്തി
  alternative: അവരിൽ അവിടുന്ന് വിശുദ്ധനായി വെളിപ്പെട്ടു / അവരിലൂടെ അവിടുന്ന് തന്റെ വിശുദ്ധി തെളിയിച്ചു
  rationale: קדש എന്ന നിഫാൽ രൂപം വ്യാകരണപരമായി നിഷ്ക്രിയമോ പ്രത്യാവർത്തകമോ ആയി കേൾക്കാം. ദൈവത്തെ മനുഷ്യർ വിശുദ്ധനാക്കി എന്നു സൂചിപ്പിക്കാതെ, ഈ സംഭവത്തിലൂടെ അവിടുത്തെ വിശുദ്ധി പ്രകടമായി എന്ന അർഥം പ്രധാനപാഠം നൽകുന്നു; ശേഷിക്കുന്ന വ്യാകരണസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: בְנֵי יִשְׂרָאֵל എന്നത് കൂട്ടായ ജനനാമമായി എങ്ങനെ നൽകണം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പദാനുപദരൂപത്തേക്കാൾ സ്വാഭാവികവും, ‘ഇസ്രായേല്യർ’ എന്നതിനെക്കാൾ ഉറവിടപ്രയോഗത്തിന്റെ കുടുംബ-വംശഭാവം നിലനിർത്തുന്നതുമായ മലയാളരൂപമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുമ്പോൾ ആദരസൂചകമായ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. സ്ഥലനാമം ‘മെരീബ’ എന്നും ദൈവനാമം മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നും നൽകി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
