reference: Numbers 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: ml
  text: 'ജനങ്ങൾ മോശെയോടു കലഹിച്ചു; അവർ പറഞ്ഞു[a]: “ഞങ്ങളുടെ സഹോദരന്മാർ യഹോവയുടെ സന്നിധിയിൽ മരിച്ചപ്പോൾ ഞങ്ങളും മരിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞങ്ങളുടെ സഹോദരന്മാർ യഹോവയുടെ സന്നിധിയിൽ മരിച്ചതുപോലെ ഞങ്ങളും മരിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!”'
    reason: בִּגְוַע എന്ന ഘടനയെ കാലപരമായി (‘മരിച്ചപ്പോൾ’) അല്ലെങ്കിൽ താരതമ്യപരമായി (‘മരിച്ചതുപോലെ’) മനസ്സിലാക്കാവുന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: കലഹിച്ചു
  rationale: ריב എന്ന ധാതു തർക്കത്തിന്റെയും എതിർപ്പിന്റെയും ശക്തി വഹിക്കുന്നു; ‘കലഹിച്ചു’ എന്നത് വെറും പരാതിപ്പെട്ടു എന്നതിനെക്കാൾ ആ വൈരുദ്ധ്യഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: הָעָם
  choice: ജനങ്ങൾ
  rationale: ഇവിടെ עם ഇസ്രായേൽ സമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘ജനങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: עִם מֹשֶׁה
  choice: മോശെയോടു
  rationale: עִם എന്നതിന്റെ അടിസ്ഥാന അർഥം ‘കൂടെ/ഒപ്പം’ എന്നാണ്; ‘മോശെയോടു കലഹിച്ചു’ എന്ന മലയാളപ്രയോഗം ശത്രുതാപരമായ ഇടപെടൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: പറഞ്ഞു
  rationale: ഇത് എബ്രായത്തിലെ പതിവായ വാക്കാരംഭ സൂത്രമാണ്; രണ്ട് ക്രിയകളും യാന്ത്രികമായി പകർത്താതെ ‘പറഞ്ഞു’ എന്നു നൽകുന്നത് അർഥം പൂർണമായി വഹിക്കുന്നു.
- source_word: וְלוּ
  choice: …മരിച്ചിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു
  rationale: לוּ ആഗ്രഹവും വിലാപവും പ്രകടിപ്പിക്കുന്നു; ഈ മലയാളഘടന ആ തീവ്രമായ നടക്കാതെപോയ ആഗ്രഹം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: גָוַעְנוּ / בִּגְוַע
  choice: മരിച്ചിരുന്നെങ്കിൽ / മരിച്ചപ്പോൾ
  rationale: ആവർത്തിക്കുന്ന גוע എന്ന ധാതുവിനെ രണ്ടിടത്തും ‘മരിക്കുക’ എന്നു നൽകി മൂലത്തിലെ പദാവർത്തനം നിലനിർത്തുന്നു; בִּגְוַע സാഹചര്യകാലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മരിച്ചപ്പോൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אַחֵינוּ
  choice: ഞങ്ങളുടെ സഹോദരന്മാർ
  rationale: മൂലപദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്; അതിന്റെ രൂപവും സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്ന ബന്ധഭാവവും നിലനിർത്തുന്നു.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: לִפְנֵי എന്നത് ‘മുമ്പിൽ/സന്നിധിയിൽ’ എന്നാണ്; ഇവിടെ ‘സന്നിധിയിൽ’ സ്വാഭാവികമാണ്. יהוה എന്ന ദൈവനാമം മറച്ചുവയ്ക്കാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സവിശേഷ നാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ പരിചിതമായ നാമരൂപമായ ‘യഹോവ’ അത് നാമമായിത്തന്നെ നിലനിർത്തുന്നു; ‘കർത്താവ്’ എന്നു നൽകിയാൽ നാമവും പദവിയും തമ്മിലുള്ള വ്യത്യാസം മറയും.
- issue: אַחֵינוּ എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ അവതരണം
  choice: ഞങ്ങളുടെ സഹോദരന്മാർ
  alternative: ഞങ്ങളുടെ ബന്ധുക്കൾ; ഞങ്ങളുടെ സഹോദരീസഹോദരന്മാർ
  rationale: മൂലത്തിലെ വ്യാകരണലിംഗം നിലനിർത്തി, സന്ദർഭം ആവശ്യപ്പെടാത്ത വിപുലീകരണമോ ലിംഗനിരപേക്ഷീകരണമോ ഒഴിവാക്കുന്നു.
- issue: בִּגְוַע എന്നതിന്റെ കാലപരവും താരതമ്യപരവുമായ സാധ്യത
  choice: മരിച്ചപ്പോൾ
  alternative: മരിച്ചതുപോലെ
  rationale: בְּ + infinitive construct സാധാരണയായി സംഭവത്തിന്റെ സമയമോ സാഹചര്യമോ സൂചിപ്പിക്കുന്നു; എങ്കിലും ‘അവർ മരിച്ചതുപോലെ’ എന്ന താരതമ്യവായനയ്ക്കും സാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും മാന്യവുമായ മലയാളം. ‘കലഹിച്ചു’ മൂലത്തിലെ എതിർപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു; വിലാപത്തിന്റെ വികാരം ‘എത്ര നന്നായിരുന്നു’ എന്ന സ്വാഭാവിക മലയാളഘടനയിലൂടെ പ്രകടമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
