reference: Numbers 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: ml
  text: അപ്പോൾ മോശയും അഹരോനും ജനസമൂഹത്തിന്റെ സന്നിധിയിൽനിന്ന്[a] സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിലേക്കു ചെന്നു മുഖം നിലത്തുവീണു. യഹോവയുടെ മഹത്ത്വം അവർക്കു പ്രത്യക്ഷമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ജനസമൂഹത്തിന്റെ മുമ്പിൽനിന്ന്’; കൂടിവന്ന ജനങ്ങളുടെ സാന്നിധ്യത്തിൽനിന്ന് അവർ മാറിപ്പോയതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ചെന്നു
  rationale: בוא എന്ന ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘വരുക’, ‘പോകുക’, ‘പ്രവേശിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ മോശയും അഹരോനും ഒരു നിർദിഷ്ട സ്ഥലത്തേക്കു നീങ്ങുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ചെന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִפְּנֵי הַקָּהָל
  choice: ജനസമൂഹത്തിന്റെ സന്നിധിയിൽനിന്ന്
  rationale: ‘സമൂഹത്തിന്റെ മുമ്പിൽനിന്ന്/സാന്നിധ്യത്തിൽനിന്ന്’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ഭാവം നിലനിർത്തുകയും അവർ കൂടിയിരുന്ന ജനങ്ങളുടെ ഇടയിൽനിന്നു മാറിപ്പോയത് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: הַקָּהָל
  choice: ജനസമൂഹം
  rationale: קהל കൂടിവന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാസാങ്കേതികത ഒഴിവാക്കുന്നതുമായ പദമാണ് ‘ജനസമൂഹം’.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടം
  rationale: פתח എന്നത് പ്രവേശനസ്ഥലത്തെയും אֹהֶל מוֹעֵד ദൈവവും ഇസ്രായേലും കൂടിക്കാണുന്ന കൂടാരത്തെയും സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സ്വാഭാവികവുമായ സംയോജനം.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: മുഖം നിലത്തുവീണു കിടന്നു
  rationale: മുഖം നിലത്താകുന്ന വിധം വീഴുക എന്ന എബ്രായ ദൃശ്യപ്രയോഗവും വിനയത്തിന്റെയോ അപേക്ഷയുടെയോ ശരീരഭാവവും നിലനിർത്തുന്നു.
- source_word: כְבוֹד יְהוָה
  choice: യഹോവയുടെ മഹത്ത്വം
  rationale: כבוד ഇവിടെ ദൈവിക സാന്നിധ്യത്തിന്റെ ദൃശ്യമായ വെളിപ്പാടിനെ സൂചിപ്പിക്കുന്നു. ദൈവനാമമായ יהוה ‘യഹോവ’ എന്നും כבוד ‘മഹത്ത്വം’ എന്നും നൽകി.
- source_word: וַיֵּרָא אֲלֵיהֶם
  choice: അവർക്കു പ്രത്യക്ഷമായി
  rationale: ראה-യുടെ നിഫാൽ രൂപം ദൃശ്യമായി വെളിപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; אליהם എന്ന ദിശാസൂചക ഘടകം മലയാളത്തിൽ ‘അവർക്കു’ എന്ന് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ചതുർവർണ ദൈവനാമം ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ഉച്ചാരണത്തിന്റെ ചരിത്രപരമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ തീർപ്പാക്കിയതായി അവകാശപ്പെടുന്നില്ല.
- issue: כְבוֹד יְהוָה എന്നതിന്റെ സ്വഭാവം
  choice: യഹോവയുടെ മഹത്ത്വം അവർക്കു പ്രത്യക്ഷമായി
  alternative: യഹോവയുടെ മഹത്ത്വത്തിന്റെ ദൃശ്യരൂപം അവർക്കു പ്രത്യക്ഷമായി
  rationale: മൂലപാഠം പ്രത്യക്ഷതയുടെ കൃത്യരൂപം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ‘ദൃശ്യരൂപം’ പോലുള്ള വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി ദൈവിക മഹത്ത്വം പ്രത്യക്ഷപ്പെട്ടു എന്ന പാഠത്തിന്റെ തുറന്ന നില നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘മഹത്ത്വം’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ പഴയ പ്രയോഗങ്ങളും വ്യാഖ്യാനപരമായ വിപുലീകരണങ്ങളും ഒഴിവാക്കി.
