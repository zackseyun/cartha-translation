source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: ml
  text: ഞങ്ങൾ യാഹ്‌വെയോടു നിലവിളിച്ചു; അവൻ ഞങ്ങളുടെ സ്വരം കേട്ട് ഒരു ദൂതനെ[a] അയച്ച് ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നു. ഇതാ, ഞങ്ങൾ നിന്റെ അതിർത്തിയുടെ അറ്റത്തുള്ള ഒരു പട്ടണമായ കാദേശിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരു സന്ദേശവാഹകനെ.’ എബ്രായപദം മനുഷ്യനായ സന്ദേശവാഹകനെയോ സ്വർഗീയദൂതനെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ പലരും ഇതിനെ ദൈവം അയച്ച സ്വർഗീയദൂതനായി മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: ഞങ്ങൾ നിലവിളിച്ചു
  rationale: צעק സഹായത്തിനായുള്ള അടിയന്തരവും വേദനാഭരിതവുമായ വിളിയെ സൂചിപ്പിക്കുന്നു; ‘നിലവിളിച്ചു’ ആ തീവ്രത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യാഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, ‘Yahweh’ എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: അവൻ ഞങ്ങളുടെ സ്വരം കേട്ടു
  rationale: ‘ഞങ്ങളുടെ ശബ്ദം/സ്വരം കേട്ടു’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ‘സ്വരം’ തെരഞ്ഞെടുത്തു.
- source_word: מַלְאָךְ
  choice: ഒരു ദൂതൻ
  rationale: മַלְאָךְ മനുഷ്യസന്ദേശവാഹകനെയോ സ്വർഗീയദൂതനെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘ദൂതൻ’ ഈ അടിസ്ഥാന അർഥവ്യാപ്തി ഏറെക്കുറെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വർഗീയദൂതനെന്ന വായനയും സാധ്യമാണ്.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് പുറപ്പെടുവിച്ചു
  rationale: ഹിഫീൽ രൂപത്തിന്റെ ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരണാർഥം കൃത്യവും പതിവുള്ള പുറപ്പാട്-ഭാഷയുമായ രീതിയിൽ നൽകുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: ഇപ്പോഴത്തെ സാഹചര്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּה എന്ന വ്യവഹാരസൂചകത്തിന് ആധുനികവും മാന്യവുമായ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: നിന്റെ അതിർത്തിയുടെ അറ്റത്തുള്ള ഒരു പട്ടണം
  rationale: കാദേശ് ഏദോമിന്റെ അതിർത്തിയുടെ അറ്റത്ത് സ്ഥിതിചെയ്യുന്നതാണ് എന്ന സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുറപ്പാടുമായി ബന്ധപ്പെട്ട പരാമർശത്തിലെ מַלְאָךְ എന്ന പദത്തിന്റെ വ്യക്തിത്വം
  choice: കൂടുതൽ വ്യക്തിത്വനിർണയം നടത്താതെ ‘ഒരു ദൂതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഒരു സന്ദേശവാഹകൻ; അല്ലെങ്കിൽ ചിലർ പ്രത്യേക ദൈവിക പ്രത്യക്ഷതയായി മനസ്സിലാക്കുന്ന യാഹ്‌വെയുടെ ദൂതൻ.
  rationale: വാക്യം ഈ ദൂതന്റെ കൃത്യമായ വ്യക്തിത്വം വെളിപ്പെടുത്തുന്നില്ല. അതിനാൽ ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രവായന പാഠത്തിൽ ചേർക്കാതെ പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ ബന്ധിത വാക്യക്രമം അമിതമായി കട്ടിയാക്കാതെ നിലനിർത്തി; הִנֵּהയ്ക്ക് ‘ഇതാ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് യഥാർഥ പദാർഥവ്യാപ്തി സൂചിപ്പിക്കുന്ന സ്ഥാനമായതിനാൽ [a] ദൈവനാമത്തോട് അല്ല, ‘ദൂതനെ’ എന്ന പദത്തോടാണ് ചേർത്തത്.
