id: NUM.20.8
reference: Numbers 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: ml
  text: “ആ വടി[a] എടുക്കുക. നീ നിന്റെ സഹോദരനായ അഹരോനോടൊപ്പം സഭയെ ഒരുമിച്ചുകൂട്ടുക. അവരുടെ കൺമുന്നിൽവെച്ച് പാറയോടു സംസാരിക്കുവിൻ; അത് തന്റെ വെള്ളം തരും. നീ അവർക്കുവേണ്ടി പാറയിൽനിന്ന് വെള്ളം പുറപ്പെടുവിക്കുകയും സഭയ്ക്കും അവരുടെ വളർത്തുമൃഗങ്ങൾക്കും കുടിക്കാൻ കൊടുക്കുകയും ചെയ്യണം.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദണ്ഡം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: വടി
  rationale: מַטֶּה എന്നത് കൈയിൽ പിടിക്കുന്ന വടി അഥവാ ദണ്ഡ് സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വടി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: הָעֵדָה
  choice: സഭ
  rationale: עֵדָה ഇവിടെ ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ അതിന്റെ ഔപചാരികമായ സമൂഹാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: പാറയോടു സംസാരിക്കുവിൻ
  rationale: ബഹുവചന ക്രിയ മോശെയെയും അഹരോനെയും ഉൾക്കൊള്ളുന്നു; ‘പാറയോടു സംസാരിക്കുവിൻ’ എന്നത് דבר אל എന്ന പ്രയോഗത്തിന്റെ നേരായ അർഥം സൂക്ഷിക്കുന്നു.
- source_word: לְעֵינֵיהֶם
  choice: അവരുടെ കൺമുന്നിൽവെച്ച്
  rationale: ‘അവരുടെ കണ്ണുകൾക്കുമുമ്പിൽ’ എന്ന ദൃശ്യവും പരസ്യവുമായ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְנָתַן מֵימָיו
  choice: അത് തന്റെ വെള്ളം തരും
  rationale: പാറയാണ് ഏകവചന കർത്താവ്; ഉടമസ്ഥപ്രത്യയമുള്ള ‘അതിന്റെ/തന്റെ വെള്ളം’ എന്ന ആശയവും നൽകുക എന്ന ലളിത ക്രിയയും സംരക്ഷിക്കുന്നു.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: നീ അവർക്കുവേണ്ടി പാറയിൽനിന്ന് വെള്ളം പുറപ്പെടുവിച്ച്
  rationale: יצא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘പുറത്തുവരുത്തുക’ എന്ന causative അർഥം ‘പുറപ്പെടുവിക്കുക’ കൃത്യമായി നൽകുന്നു.
- source_word: וְהִשְׁקִיתָ
  choice: കുടിക്കാൻ കൊടുക്കണം
  rationale: שקה എന്ന ഹിഫീൽ ക്രിയയുടെ ‘കുടിപ്പിക്കുക/കുടിക്കാൻ കൊടുക്കുക’ എന്ന causative അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּעִירָם
  choice: അവരുടെ കന്നുകാലികൾ
  rationale: בְּעִיר വളർത്തുമൃഗങ്ങളെയോ തൊഴിൽമൃഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വിശാല പദമാണ്.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: നീയും നിന്റെ സഹോദരനായ അഹരോനും
  rationale: രണ്ടു നേതാക്കളെയും വ്യക്തമായി തിരിച്ചറിയിക്കുന്ന മൂലവാക്യഘടന സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: അത്ഭുതത്തിനുള്ള കല്പനയുടെ പരസ്യസ്വഭാവം
  choice: ‘അവരുടെ കൺമുന്നിൽവെച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി ജനങ്ങളുടെ ദൃശ്യസാക്ഷ്യത്തെ ഊന്നിപ്പറയുന്നു.
  alternative: ‘അവരുടെ മുമ്പിൽ’ എന്ന കുറച്ച് വ്യക്തതയുള്ള പരിഭാഷ.
  rationale: לְעֵינֵיהֶם എന്ന എബ്രായ പ്രയോഗം സംഭവം ജനങ്ങൾ കാണുന്നവിധം നടക്കണമെന്ന ആശയം പ്രകടമാക്കുന്നു; തുടർന്നുള്ള വിവരണത്തിന്റെ ധാർമ്മിക-ദൈവശാസ്ത്രപരമായ സംഘർഷത്തിനും ഇത് പ്രസക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചന കല്പനകളും മോശെ-അഹരോൻ ഇരുവരെയും അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന ‘സംസാരിക്കുവിൻ’ എന്ന രൂപവും വേർതിരിച്ചു സൂക്ഷിച്ചു. അനാവശ്യമായ സഭാപരമായ പ്രത്യേക പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
