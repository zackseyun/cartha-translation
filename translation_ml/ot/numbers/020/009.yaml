id: NUM.20.9
reference: Numbers 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: ml
  text: അങ്ങനെ മോശെ യഹോവയുടെ സന്നിധിയിൽനിന്ന് വടി എടുത്തു. യഹോവ അവനോടു കൽപിച്ചതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: എടുത്തു
  rationale: לקח എന്ന ക്രിയയുടെ ഖാൽ ആഖ്യാനരൂപം ഇവിടെ സാധാരണമായ ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അധിക അർഥഛായ ചേർക്കാതെ ‘എടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
- source_word: הַמַּטֶּה
  choice: വടി
  rationale: מַטֶּה എന്നത് സന്ദർഭാനുസരണം വടി, ദണ്ഡ്, ഗോത്രം എന്നീ അർഥങ്ങൾക്കു വരാം. ഇവിടെ യഹോവയുടെ സന്നിധിയിൽ സൂക്ഷിച്ചിരുന്ന ഭൗതികവസ്തുവായതിനാൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘വടി’ തിരഞ്ഞെടുത്തു; ‘ദണ്ഡ്’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: מִלִּפְנֵי
  choice: സന്നിധിയിൽനിന്ന്
  rationale: ലക്ഷ്യഭാഷയിൽ സ്വാഭാവികവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമായ വിധത്തിൽ, ‘മുമ്പിൽനിന്ന്’ എന്ന സ്ഥലസംബന്ധമായ ആശയം ‘സന്നിധിയിൽനിന്ന്’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുൻകല്പനയോടുള്ള കൃത്യമായ അനുസൃതത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: צִוָּהוּ
  choice: അവനോടു കല്പിച്ചു
  rationale: ക്രിയയുടെ അർഥം ‘അവനോടു കല്പിച്ചു’ എന്നാണ്. പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ കല്പനയെ മലയാളവാക്യക്രമവും സന്ദർഭവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേകമായ പൂർവഭൂതകാലരൂപം ചേർത്തില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה നേരിട്ട് വരുന്നതിനാൽ അതിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള ‘യഹോവ’ എന്നു നൽകി.
- issue: צִוָּהוּ എന്നതിലെ പരാമർശവിഷയം
  choice: യഹോവ അവനോടു കല്പിച്ചതുപോലെതന്നെ
  alternative: അവൻ അവനോടു കല്പിച്ചതുപോലെ
  rationale: എബ്രായക്രിയയിൽ കർത്താവ് അന്തർലീനമാണെങ്കിലും അടുത്തുള്ള യഹോവയാണ് സ്വാഭാവിക പരാമർശവിഷയം. മലയാളത്തിൽ രണ്ട് സർവനാമങ്ങൾ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുമെന്നതിനാൽ യഹോവ എന്ന പേര് ആവർത്തിച്ചു; ‘അവനോടു’ മോശെയെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘സന്നിധിയിൽനിന്ന്’ ആരാധനാസന്ദർഭവും സ്ഥലസംബന്ധമായ മൂലാർഥവും ഒരുമിച്ച് കൈവരിക്കുന്നു. അനുസൃതത ഊന്നിപ്പറയാൻ ‘പോലെതന്നെ’ ഉപയോഗിച്ചു.
