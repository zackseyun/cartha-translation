translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. വക്താവ് ജനത്തെ പ്രതിനിധാനം ചെയ്യുന്നതിനാൽ ബഹുവചനമായ ‘ഞങ്ങൾ’ എന്നതിൽനിന്ന് ഏകവചനമായ ‘ഞാൻ/എന്റെ’ എന്നതിലേക്കുള്ള എബ്രായത്തിലെ മാറ്റം ഉദ്ദേശപൂർവം നിലനിർത്തി. ഉദ്ധരണിയിലെ അഭ്യർഥനാഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
