  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ അവനോടു പറഞ്ഞു[a]: “ഞങ്ങൾ പെരുവഴിയിലൂടെ കയറിപ്പോകും[b]. ഞാനും എന്റെ കന്നുകാലികളും നിന്റെ വെള്ളം കുടിച്ചാൽ, അതിന്റെ വില ഞാൻ തരാം. മറ്റൊന്നും വേണ്ട; കാൽനടയായി കടന്നുപോകാൻ മാത്രം എന്നെ അനുവദിക്കൂ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ.” എബ്രായത്തിൽ അക്ഷരാർഥം “ഇസ്രായേലിന്റെ പുത്രന്മാർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പ്രധാനപാതയിലൂടെ.” എബ്രായപദം ഒരുക്കിയതോ ഉയർത്തിയതോ ആയ പെരുവഴിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: “എന്റെ കാലുകളാൽ ഞാൻ കടന്നുപോകട്ടെ.” ദേശത്തിലൂടെയുള്ള ലളിതമായ കടന്നുപോക്കിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ സൂചിപ്പിക്കുന്നതുമായ രൂപം.
- source_word: בַּמְסִלָּה
  choice: പെരുവഴിയിലൂടെ
  rationale: מְסִלָּה എന്നത് ഒരുക്കിയതോ ഉയർത്തിയതോ ആയ പ്രധാനപാതയെ സൂചിപ്പിക്കുന്നു; യാത്ര അതിലൂടെയാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נַעֲלֶה
  choice: കയറിപ്പോകും
  rationale: עלה എന്ന ക്രിയയിലെ ‘മുകളിലേക്കു പോകുക/കയറിപ്പോകുക’ എന്ന അടിസ്ഥാനാർത്ഥം നിലനിർത്തുന്നു; വെറും ‘കടന്നുപോകും’ എന്നു പരത്തുന്നില്ല.
- source_word: מֵימֶיךָ
  choice: നിന്റെ വെള്ളം
  rationale: എബ്രായത്തിലെ ബഹുവചനരൂപം വെള്ളത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്; മലയാളത്തിൽ ഏകവചനസമാനമായ ‘വെള്ളം’ സ്വാഭാവികം.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: ഞാനും എന്റെ കന്നുകാലികളും നിന്റെ വെള്ളം കുടിച്ചാൽ
  rationale: ജനത്തെ പ്രതിനിധാനം ചെയ്യുന്ന വക്താവിന്റെ ഏകവചനവും അവന്റെ മൃഗസമ്പത്തും എന്ന അസാധാരണമായെങ്കിലും പ്രധാനപ്പെട്ട രൂപമാറ്റം സംരക്ഷിക്കുന്നു.
- source_word: וְנָתַתִּי מִכְרָם
  choice: അതിന്റെ വില ഞാൻ തരാം
  rationale: מֶכֶר എന്ന പദത്തിന്റെ ‘വില/പ്രതിഫലം’ എന്ന ഇടപാടുസ്വഭാവം വ്യക്തമാക്കുന്നു; പ്രത്യയം കുടിച്ച വെള്ളത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: רַק אֵין דָּבָר
  choice: മറ്റൊന്നും വേണ്ട
  rationale: അഭ്യർഥനയെ പരിമിതപ്പെടുത്തുന്ന רַק-ഉം ‘വേറെ കാര്യമൊന്നുമില്ല’ എന്ന ആശയമുള്ള പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ ചുരുക്കി നൽകുന്നു.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: കാൽനടയായി കടന്നുപോകാൻ മാത്രം എന്നെ അനുവദിക്കൂ
  rationale: ‘എന്റെ കാലുകളാൽ ഞാൻ കടന്നുപോകട്ടെ’ എന്ന അക്ഷരാർഥത്തോടൊപ്പം, ആക്രമണമോ മറ്റു ആവശ്യങ്ങളോ കൂടാതെയുള്ള ലളിതമായ യാത്രാനുമതി എന്ന സന്ദർഭാർഥവും നൽകുന്നു.
