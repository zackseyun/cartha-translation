id: NUM.20.29
reference: Numbers 20:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: ml
  text: അഹരോൻ മരിച്ചെന്നു സമൂഹം മുഴുവനും കണ്ടപ്പോൾ[a], ഇസ്രായേൽഗൃഹം മുഴുവനും[b] അഹരോനെച്ചൊല്ലി മുപ്പതു ദിവസം കരഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഹരോൻ മരിച്ചെന്നു സമൂഹം മുഴുവനും മനസ്സിലാക്കിയപ്പോൾ.” എബ്രായത്തിൽ അക്ഷരാർഥം “കണ്ടപ്പോൾ” എന്നാണ്; ഇവിടെ ഒരു വസ്തുത തിരിച്ചറിഞ്ഞു എന്ന അർഥവും അതിനുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേൽഗൃഹം മുഴുവനും” എന്നത് ഇസ്രായേൽജനത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: കണ്ടപ്പോൾ
  rationale: ראה എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കാണുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഒരു വസ്തുത മനസ്സിലാക്കുക എന്ന അർഥവും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: כָּל הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഇസ്രായേലിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സമൂഹം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כִּי
  choice: എന്നു
  rationale: അവർ കണ്ടതിന്റെ അഥവാ തിരിച്ചറിഞ്ഞതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: גָוַע
  choice: മരിച്ചെന്നു
  rationale: גוע മരണം അല്ലെങ്കിൽ അന്ത്യശ്വാസം സൂചിപ്പിക്കുന്ന മാന്യമായ ക്രിയയാണ്; ‘മരിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וַיִּבְכּוּ
  choice: കരഞ്ഞു
  rationale: בכהയുടെ നേരിട്ടുള്ള വികാരാർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘വിലപിച്ചു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: אֶת אַהֲרֹן
  choice: അഹരോനെച്ചൊല്ലി
  rationale: בכהയോടൊപ്പം വരുന്ന വ്യക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി ദുഃഖത്തിന്റെ വിഷയമായി വ്യക്തമാക്കുന്നു.
- source_word: שְׁלֹשִׁים יוֹם
  choice: മുപ്പതു ദിവസം
  rationale: കാലദൈർഘ്യം മലയാളത്തിൽ നേരിട്ട് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന കൂട്ടായ ഉടമ്പടിപരമായ പ്രയോഗം നിലനിർത്തുകയും כֹּל എന്ന സമഗ്രത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ ‘കണ്ടു’ എന്ന യഥാർഥ പ്രയോഗവും ‘ഇസ്രായേൽഗൃഹം’ എന്ന കൂട്ടായ രൂപവും നിലനിർത്തി; സാധ്യതയുള്ള സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകി.
