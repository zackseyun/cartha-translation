  text: וַ/יֹּ֖אמֶר לֹ֣א תַעֲבֹ֑ר וַ/יֵּצֵ֤א אֱדוֹם֙ לִ/קְרָאת֔/וֹ בְּ/עַ֥ם כָּבֵ֖ד וּ/בְ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: ml
  text: 'എന്നാൽ അവൻ പറഞ്ഞു: “നീ കടന്നുപോകരുത്.” അപ്പോൾ എദോം വലിയൊരു ജനക്കൂട്ടത്തോടും പ്രബലമായ ശക്തിയോടുംകൂടെ[a] അവനെ എതിരേൽക്കാൻ പുറപ്പെട്ടുവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ശക്തമായ കൈയോടെ”; ശക്തിയെയോ ബലപ്രയോഗത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: എന്നാൽ അവൻ പറഞ്ഞു
  rationale: വാവ് തുടർകഥനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; മുൻ അപേക്ഷയ്ക്കുള്ള എദോമിന്റെ നിരസണമെന്ന സന്ദർഭവിരോധം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. കർത്താവിനെ മൂലപാഠംപോലെ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്ന വിധം വിടുന്നു.
- source_word: לֹא תַעֲבֹר
  choice: നീ ഇതുവഴി കടന്നുപോകരുത്
  rationale: ഇവിടത്തെ അപൂർണ്ണക്രിയ ഉറച്ച വിലക്കിനെയോ അനുമതി നിഷേധത്തെയോ സൂചിപ്പിക്കുന്നു. പ്രദേശത്തിലൂടെ കടക്കുക എന്ന עבר എന്ന ക്രിയയുടെ അർഥം ‘ഇതുവഴി കടന്നുപോകുക’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: അപ്പോൾ എദോം ... പുറപ്പെട്ടുവന്നു
  rationale: יצא എന്നതിന്റെ അടിസ്ഥാന അർഥമായ പുറപ്പെടുക നിലനിർത്തുന്നു; സൈനികമായി ‘പടനീങ്ങി’ എന്ന് മൂലപാഠത്തേക്കാൾ അധികം നിർവചിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: לִקְרָאתוֹ
  choice: അവനെ നേരിടാൻ
  rationale: לקראת അടിസ്ഥാനത്തിൽ ഒരാളെ അഭിമുഖീകരിക്കാനോ കാണാനോ വരുന്നതാണ്; ഇവിടെ വ്യക്തമായ ശത്രുതാപരമായ സന്ദർഭത്തിൽ ‘നേരിടാൻ’ സ്വാഭാവികമാണ്, എന്നാൽ ‘ആക്രമിക്കാൻ’ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: בְּעַם כָּבֵד
  choice: ഒരു വലിയ സൈന്യത്തോടും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഭാരമുള്ള ജനത്തോടുകൂടെ’ എന്ന പ്രയോഗം വലുതും പ്രബലവുമായ മനുഷ്യസംഘത്തെ സൂചിപ്പിക്കുന്നു. യുദ്ധസന്ദർഭത്തിൽ ‘വലിയ സൈന്യം’ ആ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: וּבְיָד חֲזָקָה
  choice: ശക്തമായ കൈയോടുംകൂടെ
  rationale: ശക്തിയെയോ ബലപ്രയോഗത്തെയോ സൂചിപ്പിക്കുന്ന എബ്രായ രൂപകം നിലനിർത്തുന്നു; חֲזָקָה എന്നതിന് ‘ശക്തമായ’ നേരിട്ടുള്ള തുല്യപദമാണ്.
