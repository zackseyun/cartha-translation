translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായത്തിലെ ‘ശക്തമായ കൈ’ എന്ന രൂപകം നിലനിർത്തി അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കി. പ്രധാന പാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
