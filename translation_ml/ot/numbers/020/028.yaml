base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: ml
  text: മോശെ അഹരോന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി അവ അഹരോന്റെ മകനായ എലെയാസാരിനെ ധരിപ്പിച്ചു[a]. അഹരോൻ അവിടെ മലയുടെ മുകളിൽവെച്ച് മരിച്ചു[b]. പിന്നെ മോശെയും എലെയാസാരും മലയിൽനിന്ന് ഇറങ്ങിവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചുറ്റുമുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നതുപോലെ, അഹരോന്റെ ഔദ്യോഗിക പുരോഹിതവസ്ത്രങ്ങൾ എലെയാസാരിനു കൈമാറിയത് പുരോഹിതസ്ഥാനത്തിന്റെ പിൻതുടർച്ചയുടെ ഭാഗമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘മലയുടെ കൊടുമുടിയിൽവെച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: വസ്ത്രങ്ങൾ അഴിച്ച്
  rationale: פשט എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ മറ്റൊരാളുടെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റുക എന്നാണ്. മലയാളത്തിൽ സ്വാഭാവികവും പ്രവൃത്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: בְּגָדָיו
  choice: അഹരോന്റെ വസ്ത്രങ്ങൾ
  rationale: בגד എന്നത് പൊതുവായി വസ്ത്രം എന്നർഥമുള്ള പദമാണ്. സന്ദർഭത്തിൽ ഇവ ഔദ്യോഗിക പുരോഹിതവസ്ത്രങ്ങളാണെങ്കിലും മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യക്തീകരണം പ്രധാനവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: അവ അവന്റെ മകനായ എലെയാസാരിനെ ധരിപ്പിച്ചു
  rationale: לבש എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഒരാളെ വസ്ത്രം ധരിപ്പിക്കുക എന്നാണ്. അഹരോനിൽനിന്ന് അഴിച്ച വസ്ത്രങ്ങൾ എലെയാസാരിനെ ധരിപ്പിച്ചതാണെന്ന് ഈ രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന സാധാരണ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തി; സൗമ്യോക്തി ഉപയോഗിച്ചിട്ടില്ല.
- source_word: שָׁם
  choice: അവിടെ
  rationale: അഹരോന്റെ മരണസ്ഥലം സൂചിപ്പിക്കുന്ന സ്ഥലക്രിയാവിശേഷണം വ്യക്തമായി സംരക്ഷിച്ചു.
- source_word: בְּרֹאשׁ הָהָר
  choice: മലയുടെ മുകളിൽവെച്ചു
  rationale: רֹאשׁ എന്നതിന്റെ അക്ഷരാർഥം ‘തല’ എന്നും ഇവിടെ പ്രയോഗാർഥം ‘മുകൾ/കൊടുമുടി’ എന്നും ആണ്. പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ ‘മുകളിൽ’ ഉപയോഗിച്ച് ‘കൊടുമുടിയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: וַיֵּרֶד
  choice: ഇറങ്ങിവന്നു
  rationale: ירד എന്നത് താഴേക്ക് പോകുക/വരുക എന്നാണ്. മലയിൽനിന്നുള്ള മടങ്ങിവരവ് വിവരിക്കുന്ന മലയാള ആഖ്യാനത്തിൽ ‘ഇറങ്ങിവന്നു’ സ്വാഭാവികമാണ്.
- source_word: מִן הָהָר
  choice: മലയിൽനിന്ന്
  rationale: ഉറവിടസ്ഥാനം സൂചിപ്പിക്കുന്ന מִן എന്ന ഉപസർഗത്തിന്റെ ലളിതവും കൃത്യവുമായ പരിഭാഷ.
theological_decisions:
- issue: എലെയാസാരിലേക്കു കൈമാറിയ അഹരോന്റെ വസ്ത്രങ്ങളുടെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘വസ്ത്രങ്ങൾ’ എന്നു മാത്രം നൽകി
  alternative: ‘പുരോഹിതവസ്ത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘മഹാപുരോഹിതവസ്ത്രങ്ങൾ’
  rationale: ചുറ്റുമുള്ള സന്ദർഭം ഇവ അഹരോന്റെ ഔദ്യോഗിക പുരോഹിതവസ്ത്രങ്ങളാണെന്ന് വ്യക്തമാക്കുന്നു. എന്നാൽ ഈ വാക്യത്തിലെ בגד പൊതുവായ ‘വസ്ത്രങ്ങൾ’ എന്ന പദമായതിനാൽ പ്രധാനപാഠത്തിൽ അധികവിശദീകരണം ചേർക്കാതെ, സ്ഥാനാവകാശത്തിന്റെ പ്രസക്തി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ക്രമവും സ്ഥലസൂചനകളും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി.
