  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: ml
  text: ഞങ്ങളുടെ പിതാക്കന്മാർ[a] ഈജിപ്തിലേക്കു ഇറങ്ങിപ്പോയി; ഞങ്ങൾ ഈജിപ്തിൽ ഏറെക്കാലം[b] പാർത്തു. ഈജിപ്തുകാർ ഞങ്ങളോടും ഞങ്ങളുടെ പിതാക്കന്മാരോടും മോശമായി പെരുമാറി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞങ്ങളുടെ പൂർവികർ’; ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഞങ്ങളുടെ പിതാക്കന്മാർ’ എന്നാണ്. വാക്യത്തിലെ രണ്ടിടത്തും ഇതേ പദമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അനേകം ദിവസങ്ങൾ’; ദീർഘമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘ഞങ്ങളെയും ഞങ്ങളുടെ പിതാക്കന്മാരെയും പീഡിപ്പിച്ചു’ അല്ലെങ്കിൽ ‘ഞങ്ങൾക്കും ഞങ്ങളുടെ പിതാക്കന്മാർക്കും ദോഷം ചെയ്തു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: പോയി
  rationale: ירד എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഇറങ്ങിപ്പോയി’ എന്നാണെങ്കിലും, മലയാളത്തിൽ ഈജിപ്തിലേക്കുള്ള യാത്ര സ്വാഭാവികമായി പറയാൻ ‘പോയി’ എന്നു നൽകി; ഭൗമദിശ ഇവിടെ നിർബന്ധമായി വ്യക്തമാക്കേണ്ടതില്ല.
- source_word: אֲבֹתֵינוּ
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർ
  rationale: ഹീബ്രുവിലെ ‘ഞങ്ങളുടെ പിതാക്കന്മാർ’ എന്ന അക്ഷരാർഥവും ചരിത്രപരമായ വംശപൂർവികരെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: מִצְרַיְמָה
  choice: ഈജിപ്തിലേക്കു
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു; ‘ഈജിപ്തിലേക്കു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: וַנֵּשֶׁב
  choice: പാർത്തു
  rationale: ישב ഇവിടെ താമസിക്കുക എന്ന അർഥത്തിലാണ്. ‘പാർത്തു’ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: יָמִים רַבִּים
  choice: ഏറെക്കാലം
  rationale: അക്ഷരാർഥം ‘അനേകം ദിവസങ്ങൾ’ എന്നാണെങ്കിലും ഇത് ദീർഘകാലത്തെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗമാണ്; ‘ഏറെക്കാലം’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു, വർഷങ്ങളുടെ കൃത്യമായ എണ്ണം ചേർക്കുന്നില്ല.
- source_word: וַיָּרֵעוּ
  choice: ദോഷമായി പെരുമാറി
  rationale: רעע എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ദോഷം ചെയ്യുക, മോശമായി കൈകാര്യം ചെയ്യുക എന്നീ വിശാല അർഥങ്ങൾ വഹിക്കുന്നു. ‘ദോഷമായി പെരുമാറി’ അതിന്റെ ധാർമികവും ഹാനികരവുമായ ഭാവം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: מִצְרַיִם
  choice: ഈജിപ്തുകാർ
  rationale: രൂപം ‘ഈജിപ്ത്’ എന്നാണെങ്കിലും ബഹുവചനക്രിയ ഇതിനെ ഈജിപ്തിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സമാഹാരപ്രയോഗമാക്കുന്നു; മലയാളത്തിൽ ‘ഈജിപ്തുകാർ’ വ്യക്തമാണ്.
- source_word: לָנוּ ... וְלַאֲבֹתֵינוּ
  choice: ഞങ്ങളോടും ഞങ്ങളുടെ പിതാക്കന്മാരോടും
  rationale: ל ബാധിതരായവരെ അടയാളപ്പെടുത്തുന്നു. രണ്ടു വിഭാഗങ്ങളെയും ഹീബ്രുവിലുള്ളതുപോലെ ആവർത്തിച്ചു നിലനിർത്തി.
