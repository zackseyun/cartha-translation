source:
  edition: WLC
  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: ml
  text: അഹരോന്റെ വസ്ത്രങ്ങൾ അഴിച്ചുമാറ്റി അവന്റെ മകനായ എലെയാസാരെ അവ ധരിപ്പിക്കുക.[a] അഹരോൻ ചേർക്കപ്പെടുകയും അവിടെ മരിക്കുകയും ചെയ്യും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ ഇവ അഹരോന്റെ പുരോഹിതവസ്ത്രങ്ങളാണ്; എബ്രായപാഠം ഇവിടെ ‘അവന്റെ വസ്ത്രങ്ങൾ’ എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ചേർക്കപ്പെടുക’ എന്നത് മരണത്തെ സൂചിപ്പിക്കുന്ന ഒരു എബ്രായ പ്രയോഗമാണ്. മറ്റു ഭാഗങ്ങളിൽ ഇതിന്റെ പൂർണരൂപം ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെടുക’ എന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט
  choice: അഴിച്ചെടുക്കുക
  rationale: פשט എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ ഒരാളുടെ വസ്ത്രം അഴിച്ചുമാറ്റുക എന്നാണ്. കല്പനയുടെ നേരിട്ടുള്ള ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּגָדָיו
  choice: അവന്റെ വസ്ത്രങ്ങൾ
  rationale: בגד എന്നത് പൊതുവായി വസ്ത്രം എന്നാണ്. സന്ദർഭത്തിൽ പുരോഹിതവസ്ത്രങ്ങളാണെങ്കിലും മൂലവാക്യത്തിൽ ആ വിശേഷണം ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וְהִלְבַּשְׁתָּם
  choice: അവ ധരിപ്പിക്കുക
  rationale: ബഹുവചന സർവനാമപ്രത്യയമായ ‘അവ’ നിലനിർത്തിക്കൊണ്ട്, വസ്ത്രങ്ങൾ എലെയാസാരിലേക്കു കൈമാറി ധരിപ്പിക്കണമെന്ന ആജ്ഞ വ്യക്തമാക്കുന്നു.
- source_word: אֶת אֶלְעָזָר בְּנוֹ
  choice: അവന്റെ മകനായ എലെയാസാരെ
  rationale: ബന്ധവും പേരും വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പദക്രമം.
- source_word: יֵאָסֵף
  choice: ചേർക്കപ്പെടും
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന אסף എന്ന ക്രിയയുടെ നിഫാൽ രൂപത്തിലുള്ള എബ്രായ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു. ഈ വാക്യത്തിൽ ‘തന്റെ ജനത്തോടു’ എന്ന പദങ്ങൾ ഇല്ല.
- source_word: וּמֵת
  choice: മരിക്കുകയും ചെയ്യും
  rationale: മുൻപുള്ള ഭാവിക്രിയയോടു ചേർന്ന തുടർഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: שָׁם
  choice: അവിടെ
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള തത്തുല്യം.
theological_decisions:
- issue: יֵאָסֵף എന്ന മരണസംബന്ധിയായ പ്രയോഗം
  choice: ‘ചേർക്കപ്പെടും’ എന്ന അപൂർണമായി വ്യക്തമാക്കപ്പെട്ട മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെടും’ അല്ലെങ്കിൽ ‘മരിക്കും’
  rationale: ഇവിടെ എബ്രായപാഠത്തിൽ ‘തന്റെ ജനത്തോടു’ എന്ന പൂരകവാക്യം ഇല്ല. അതു ചേർക്കുന്നത് സമാന്തരപ്രയോഗങ്ങളിൽനിന്നുള്ള വികസനമായിരിക്കും; ‘മരിക്കും’ എന്നു മാത്രം പറയുന്നത് ചേർക്കപ്പെടൽ എന്ന സാഹിത്യ-ദൈവശാസ്ത്ര സൂചനയെ ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ അസ്പഷ്ടമായ ‘ചേർക്കപ്പെടും’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ വികസിപ്പിക്കാതെ, അർത്ഥസഹായം അടിക്കുറിപ്പിൽ നൽകി.
