source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: ml
  text: പിന്നെ എന്തിനാണ് നിങ്ങൾ ഈജിപ്തിൽനിന്ന് ഞങ്ങളെ കയറ്റിക്കൊണ്ടുവന്ന് ഈ ദുരിതകരമായ സ്ഥലത്തേക്കു ഞങ്ങളെ കൊണ്ടുവന്നത്? ഇത് വിത്തിറക്കാൻ പറ്റിയ സ്ഥലമല്ല[a]; ഇവിടെ അത്തിപ്പഴമോ മുന്തിരിവള്ളിയോ മാതളനാരങ്ങയോ ഇല്ല. കുടിക്കാൻ വെള്ളവുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വിത്തിന്റെ സ്ഥലം അല്ല.’ ഇത് വിതയ്ക്കാൻ പറ്റിയ സ്ഥലമല്ലെന്നോ ധാന്യവിളകൾ ഉത്പാദിപ്പിക്കുന്ന സ്ഥലമല്ലെന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: പിന്നെ എന്തിനാണ്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പരാതിയുമായുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ചോദ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: ഞങ്ങളെ ... ഈജിപ്തിൽനിന്ന് കയറ്റിക്കൊണ്ടുവന്നത്
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫ്ഇൽ രൂപത്തിലുള്ള ‘മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന പുറപ്പാട് പ്രയോഗം ‘കയറ്റിക്കൊണ്ടുവരുക’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: לְהָבִיא אֹתָנוּ
  choice: ഞങ്ങളെ ... കൊണ്ടുവരാൻ
  rationale: ഇൻഫിനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: ഈ ദുരിതകരമായ സ്ഥലത്തേക്ക്
  rationale: רַע ഇവിടെ ധാർമ്മിക തിന്മയെക്കാൾ ഹാനികരവും ദുസ്സഹവുമായ സ്ഥലത്തെ വിശേഷിപ്പിക്കുന്നു; ‘ദുരിതകരമായ’ എന്നത് ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֹא מְקוֹם זֶרַע
  choice: ഇത് വിത്തിറക്കാൻ പറ്റിയ സ്ഥലമല്ല
  rationale: അക്ഷരാർഥമായ ‘വിത്തിന്റെ സ്ഥലം അല്ല’ എന്നതിനു പിന്നിലെ കൃഷിയോഗ്യത/വിതയ്ക്കൽ എന്ന അർഥം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: അത്തിപ്പഴമോ മുന്തിരിവള്ളിയോ മാതളനാരങ്ങയോ ഇല്ല
  rationale: പട്ടികയിലെ വിളകളെയും സസ്യങ്ങളെയും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ഏകവചന സമൂഹനാമങ്ങളുടെ പട്ടികയായുള്ള ഹീബ്രു ശൈലി നിലനിർത്തുന്നു.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: കുടിക്കാൻ വെള്ളവുമില്ല
  rationale: അസ്തിത്വനിഷേധവും കുടിക്കാനുള്ള വെള്ളത്തിന്റെ അഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പറയുന്നു.
theological_decisions:
- issue: הָרָע എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ദുരിതകരമായ
  alternative: തിന്മയായ / മോശമായ
  rationale: ഈ സ്ഥലത്തെക്കുറിച്ചുള്ള പരാതിയിൽ പദം ധാർമ്മിക തിന്മ നിർണ്ണയിക്കുന്നതല്ല; ഹാനികരവും അഭിലഷണീയമല്ലാത്തതുമായ അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പരാതിയുടെ ശക്തി നിലനിർത്തിയെങ്കിലും ‘തിന്മയായ സ്ഥലം’ എന്ന ധാർമ്മികമായി തെറ്റിദ്ധരിക്കാവുന്ന പ്രയോഗം ഒഴിവാക്കി.
