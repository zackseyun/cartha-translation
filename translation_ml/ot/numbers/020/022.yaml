  to: അവർ കാദേശിൽനിന്ന് പുറപ്പെട്ടു; ഇസ്രായേൽമക്കളായ മുഴുസമൂഹം ഹോർ പർവതത്തിൽ എത്തി.
  rationale: The revision only smooths the collective apposition and standardizes the ablative form ‘കാദേശിൽനിന്ന്.’ The wording continues to distinguish the departure from Kadesh and the arrival of the entire Israelite community at Mount Hor. Footnote b is clarified to describe the underlying place-name expression without treating the Malayalam conventional form as a separate Hebrew phrase.
