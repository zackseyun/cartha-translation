translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. എബ്രായ വാക്യക്രമത്തിലെ ഊന്നൽ നിലനിർത്താൻ ‘ഇസ്രായേൽമക്കൾ, സമൂഹം മുഴുവനും’ എന്ന അനുബന്ധ ഘടന ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
