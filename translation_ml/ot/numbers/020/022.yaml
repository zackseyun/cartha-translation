  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: ml
  text: അവർ കാദേശിൽനിന്ന് പുറപ്പെട്ടു; ഇസ്രായേൽമക്കളായ മുഴുസമൂഹം ഹോർ പർവതത്തിൽ എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: נסע എന്ന ക്രിയ ഇവിടെ പാളയം പൊളിച്ച് അടുത്ത യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗമാണ് ‘പുറപ്പെട്ടു’.
- source_word: מִקָּדֵשׁ
  choice: കാദേശിൽനിന്നു
  rationale: എബ്രായ പാഠത്തിൽ ‘കാദേശ്’ എന്നു മാത്രമാണുള്ളത്; ‘കാദേശ്-ബർന്നേയ’ എന്ന വിപുലമായ സ്ഥലനാമം ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: וַיָּבֹאוּ
  choice: എത്തി
  rationale: בוא എന്നത് ‘വരുക/എത്തുക’ എന്ന അർഥം നൽകുന്നു. ഒരു ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയുടെ സമാപനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എത്തി’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ കുടുംബ-സമൂഹ പ്രയോഗത്തിന്റെ രൂപഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്നവിധം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: כָּל הָעֵדָה
  choice: സമൂഹം മുഴുവനും
  rationale: עֵדָה ഒത്തുചേർന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം മുഴുവനും’ എന്നത് כָּל എന്ന സമഗ്രതാബോധവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הֹר הָהָר
  choice: ഹോർ പർവതത്തിൽ
  rationale: ‘ഹോർ പർവതം’ എന്നത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
