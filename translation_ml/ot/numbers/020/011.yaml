source:
  edition: WLC
  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: ml
  text: അപ്പോൾ മോശെ കൈ ഉയർത്തി തന്റെ വടികൊണ്ട് പാറയെ രണ്ടുപ്രാവശ്യം അടിച്ചു. ധാരാളം വെള്ളം പുറത്തുവന്നു; ജനസമൂഹവും അവരുടെ വളർത്തുമൃഗങ്ങളും കുടിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: ഉയർത്തി
  rationale: רוּם എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ ‘ഉയർത്തുക’ എന്നാണ്; മോശെയുടെ ശാരീരിക പ്രവൃത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: יָדוֹ
  choice: കൈ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പ്രത്യയമുള്ള നാമത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം; മലയാളത്തിൽ കർത്താവായ ‘മോശെ’ വ്യക്തമായതിനാൽ ‘തന്റെ’ ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: וַיַּךְ
  choice: അടിച്ചു
  rationale: נכה എന്നത് അടിക്കുക/പ്രഹരിക്കുക എന്നർഥം നൽകുന്നു. ‘അടിച്ചു’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും കഥനത്തിന് യോജിച്ചതുമാണ്.
- source_word: הַסֶּלַע
  choice: പാറയെ
  rationale: סֶלַע ഇവിടെ മോശെ അടിച്ച പാറയെ സൂചിപ്പിക്കുന്നു; ‘പാറ’ സന്ദർഭോചിതമായ സാധാരണ മലയാളപദമാണ്.
- source_word: בְּמַטֵּהוּ
  choice: തന്റെ വടികൊണ്ട്
  rationale: מַטֶּה എന്നത് വടി/ഊന്നുവടി എന്നാകാം. മോശെയുടെ കൈയിലുള്ള ഉപകരണത്തിന് ‘വടി’ സ്വാഭാവികവും കൃത്യവുമാണ്; പ്രത്യയം ‘തന്റെ’ എന്നു നിലനിർത്തി.
- source_word: פַּעֲמָיִם
  choice: രണ്ടുപ്രാവശ്യം
  rationale: ദ്വിവചന രൂപത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: ധാരാളം വെള്ളം പുറത്തുവന്നു
  rationale: מַיִם רַבִּים വെള്ളത്തിന്റെ വലിയ അളവിനെ സൂചിപ്പിക്കുന്നു. ‘ധാരാളം വെള്ളം’ അർഥം വ്യക്തമായി നൽകുന്നു; יָצָאയ്ക്ക് ‘പുറത്തുവന്നു’ യോജിക്കുന്നു.
- source_word: הָעֵדָה
  choice: ജനസമൂഹം
  rationale: עֵדָה ഇസ്രായേലിന്റെ കൂട്ടായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനസമൂഹം’ ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികവും മതവിഭാഗപരമായ സങ്കുചിതത്വമില്ലാത്തതുമാണ്.
- source_word: וּבְעִירָם
  choice: അവരുടെ കന്നുകാലികളും
  rationale: בְּעִיר മനുഷ്യരുടെ വളർത്തുമൃഗങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘കന്നുകാലികൾ’ മലയാളത്തിൽ ഈ സമാഹാരാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; וּ സംയോജകത്തെ ‘-ഉം’ കൊണ്ടും ഉടമസ്ഥപ്രത്യയത്തെ ‘അവരുടെ’ കൊണ്ടും പ്രകടമാക്കി.
theological_decisions:
- issue: മോശെ പാറയോടു ചെയ്ത പ്രവൃത്തിയുടെ കഥനരീതി
  choice: ‘തന്റെ വടികൊണ്ട് പാറയെ രണ്ടുപ്രാവശ്യം അടിച്ചു’ എന്ന നേരിട്ടുള്ള ചരിത്രവിവരണം നിലനിർത്തി.
  alternative: വിവർത്തനവാക്യത്തിൽത്തന്നെ ഈ പ്രവൃത്തിയെ അനുസരണക്കേടായി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: വിശാലസന്ദർഭത്തിൽ മോശെയുടെ പ്രവൃത്തിക്ക് ഗൗരവമുള്ള വിലയിരുത്തൽ ഉണ്ടെങ്കിലും, ഈ വാക്യം പ്രവൃത്തിയും അതിന്റെ ഫലവും വിവരിക്കുകയാണ്. അതിനാൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത വിധിനിർണയം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഹീബ്രു കഥനത്തിലെ ക്രമാനുസൃത പ്രവൃത്തികൾ രണ്ടു സ്വാഭാവിക വാക്യങ്ങളായി നൽകി. വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകളോ മതവിഭാഗസവിശേഷ പദപ്രയോഗങ്ങളോ ഒഴിവാക്കി.
