  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: ml
  text: “ദയവായി ഞങ്ങളെ നിന്റെ ദേശത്തുകൂടി കടന്നുപോകാൻ അനുവദിക്കണമേ. ഞങ്ങൾ വയലിലൂടെയോ മുന്തിരിത്തോട്ടത്തിലൂടെയോ കടന്നുപോകുകയില്ല; കിണറ്റിലെ വെള്ളം കുടിക്കുകയുമില്ല. ഞങ്ങൾ രാജാവിന്റെ വഴിയിലൂടെ[a] പോകും; നിന്റെ അതിർത്തി കടന്നുപോകുന്നതുവരെ[b] വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയുകയില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാജപാതയിലൂടെ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഹീബ്രു: “നിന്റെ അതിർത്തി”; ഇവിടെ ഉദ്ദേശിക്കുന്നത് നിന്റെ പ്രദേശത്തിന്റെ അതിർത്തിക്കപ്പുറം കടക്കുന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: ദയവായി ഞങ്ങളെ ... കടന്നുപോകാൻ അനുവദിക്കണമേ
  rationale: ആഹ്വാനരൂപവും נָא എന്ന വിനയസൂചക കണികയും ചേർന്നുള്ള മര്യാദാപൂർവമായ അപേക്ഷ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: בְאַרְצֶךָ
  choice: നിന്റെ ദേശത്തുകൂടി
  rationale: עבר എന്ന ക്രിയയോടൊപ്പം ב എന്ന ഉപസർഗം ഒരു പ്രദേശത്തിലൂടെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേശത്തുകൂടി’ ആ ചലനം വ്യക്തമായി നൽകുന്നു.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: ഞങ്ങൾ വയലിലൂടെയോ മുന്തിരിത്തോട്ടത്തിലൂടെയോ കടന്നുപോകുകയില്ല
  rationale: കൃഷിഭൂമികളിലൂടെ സഞ്ചരിക്കില്ലെന്ന ഉറപ്പ് ഹീബ്രു ഏകവചനങ്ങളുടെ പൊതുവായ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: കിണറ്റിലെ വെള്ളം കുടിക്കുകയുമില്ല
  rationale: മֵי בְאֵר എന്ന സംയുക്തപ്രയോഗത്തിന്റെ ‘കിണറ്റിലെ വെള്ളം’ എന്ന നേരിട്ടുള്ള അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: രാജാവിന്റെ വഴി
  rationale: അക്ഷരാർഥമായ ‘രാജാവിന്റെ വഴി’ നിലനിർത്തുന്നു; ഇത് ഒരു അംഗീകൃത മുഖ്യപാതയെ സൂചിപ്പിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: נֵלֵךְ
  choice: പോകും
  rationale: നിർദിഷ്ട പാതയിലൂടെയുള്ള യാത്രയെ ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: വലത്തോട്ടോ ഇടത്തോട്ടോ തിരിയുകയില്ല
  rationale: നിശ്ചിത വഴിയിൽനിന്ന് വ്യതിചലിക്കില്ലെന്ന ഹീബ്രു ദിശാദ്വയം അതേ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: നിന്റെ അതിർത്തി കടന്നുപോകുന്നതുവരെ
  rationale: גְּבוּל എന്ന പദത്തിന്റെ ‘അതിർത്തി/പ്രദേശം’ എന്ന അർഥവ്യാപ്തി പൂർണമായി ചുരുക്കാതെ, עבר എന്ന ആവർത്തിത കടന്നുപോകൽ ആശയം നിലനിർത്തുന്നു.
