translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. അഭ്യർഥനയുടെ വിനയവും തുടർന്നുള്ള വാഗ്ദാനങ്ങളുടെ ഉറച്ച സ്വരവും സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടുന്ന സ്ഥാനങ്ങളിലേക്ക് ക്രമപ്പെടുത്തി.
