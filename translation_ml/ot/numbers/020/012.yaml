reference: Numbers 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടും അഹരോനോടും പറഞ്ഞു: “നിങ്ങൾ എന്നിൽ വിശ്വസിക്കാതിരിക്കുകയും[a] ഇസ്രായേൽമക്കളുടെ കൺമുന്നിൽ എന്നെ പരിശുദ്ധനായി മാനിക്കാതിരിക്കുകയും[b] ചെയ്തതിനാൽ, ഞാൻ അവർക്കു നൽകിയിരിക്കുന്ന ദേശത്തേക്ക് ഈ ജനസമൂഹത്തെ നിങ്ങൾ കൊണ്ടുചെല്ലുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ ആശ്രയിക്കാതിരിക്കുകയും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് വിശ്വസിക്കുക, ആശ്രയിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “എന്റെ പരിശുദ്ധത വെളിപ്പെടുത്താതിരിക്കുകയും” അല്ലെങ്കിൽ “എന്നെ പരിശുദ്ധനായി ഉയർത്തിക്കാട്ടാതിരിക്കുകയും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേര് ഉപയോഗിച്ച് മാറ്റാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ലിപ്യന്തരണമായി നിലനിർത്തുന്നു.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: നിങ്ങൾ എന്നിൽ വിശ്വസിക്കാതിരിക്കുകയും
  rationale: אמן എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപവും בִּי എന്ന ഘടനയും വിശ്വസിക്കുക/ആശ്രയിക്കുക എന്ന അർഥവ്യാപ്തി വഹിക്കുന്നു; പ്രധാന പാഠത്തിൽ നേരിട്ടുള്ള ‘എന്നിൽ വിശ്വസിക്കുക’ നിലനിർത്തുന്നു.
- source_word: לְהַקְדִּישֵׁנִי
  choice: എന്നെ പരിശുദ്ധനായി മാനിക്കാതിരിക്കുകയും
  rationale: ദൈവത്തെ ജനസമക്ഷം പരിശുദ്ധനായി അംഗീകരിക്കുകയും ആദരിക്കുകയും ചെയ്യേണ്ടതായിരുന്നു എന്ന കാരകവും പരസ്യവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְעֵינֵי בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ കൺമുന്നിൽ
  rationale: ‘കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ പരസ്യവും ദൃശ്യവുമായ അർഥം മലയാളത്തിലെ സ്വാഭാവിക ശൈലിയിൽ സൂക്ഷിക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന പരമ്പരാഗത ജനനാമവും നിലനിർത്തുന്നു.
- source_word: לָכֵן
  choice: അതിനാൽ
  rationale: കുറ്റാരോപണത്തിൽനിന്ന് വിധിഫലത്തിലേക്കുള്ള കാരണബന്ധം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: תָבִיאוּ
  choice: നിങ്ങൾ കൊണ്ടുചെല്ലുകയില്ല
  rationale: בוא എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിലെ ‘പ്രവേശിപ്പിക്കുക/കൊണ്ടുചെല്ലുക’ എന്ന അർഥവും ഗൗരവമുള്ള പ്രഖ്യാപനഭാവവും നൽകുന്നു.
- source_word: הַקָּהָל הַזֶּה
  choice: ഈ സഭയെ
  rationale: മരുഭൂമിയിൽ ഒരുമിച്ചുകൂടിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന קהל എന്ന പദത്തിന് സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: ഞാൻ അവർക്കു നൽകിയിരിക്കുന്ന ദേശത്തേക്ക്
  rationale: പൂർണ്ണക്രിയയുടെ ഉറപ്പും ഉടമ്പടിപരമായ ദാനത്തിന്റെ നിലവിലുള്ള ഫലവും ‘നൽകിയിരിക്കുന്ന’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മോശയുടെയും അഹരോന്റെയും പരാജയത്തിന്റെ സ്വഭാവം
  choice: ദൈവത്തിൽ വിശ്വസിക്കാതിരിക്കുകയും അവനെ ജനസമക്ഷം പരിശുദ്ധനായി മാനിക്കാതിരിക്കുകയും ചെയ്തു
  alternative: ദൈവത്തെ ആശ്രയിച്ചില്ല; അവന്റെ പരിശുദ്ധത വെളിപ്പെടുത്തിയില്ല
  rationale: വാക്യം പറയുന്ന രണ്ട് ഘടകങ്ങളെയും നിലനിർത്തുന്നു; അവരുടെ പ്രവൃത്തി എങ്ങനെ അവിശ്വാസമായി എന്നത് വിവർത്തനം വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഉറവിടത്തിലെ വംശബന്ധപരമായ പ്രയോഗത്തെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന പരമ്പരാഗത രൂപത്തിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവനാമം ലിപ്യന്തരിച്ചു; എബ്രായത്തിലെ കാരണ-ഫല ഘടനയും ദൈവത്തിന്റെ പരിശുദ്ധതയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട രണ്ട് വ്യത്യസ്ത പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
