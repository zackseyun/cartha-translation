id: NUM.20.4
reference: Numbers 20:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: ml
  text: പിന്നെ എന്തിനാണ് നിങ്ങൾ യഹോവയുടെ സഭയെ ഈ മരുഭൂമിയിലേക്കു കൊണ്ടുവന്നത്, ഞങ്ങളും ഞങ്ങളുടെ കന്നുകാലികളും അവിടെ മരിക്കാനോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: പിന്നെ എന്തിനാണ്
  rationale: ബന്ധകവും ചോദ്യംചെയ്യുന്ന പരാതിയുടെ തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֲבֵאתֶם
  choice: നിങ്ങൾ ... കൊണ്ടുവന്നത്
  rationale: בוא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപത്തിലെ ‘കൊണ്ടുവരുക’ എന്ന കാരണാർഥം വ്യക്തമാക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലവും സന്ദർഭത്തിൽ തെളിയുന്നു.
- source_word: קְהַל יְהוָה
  choice: യഹോവയുടെ സഭയെ
  rationale: קָהָל സൂചിപ്പിക്കുന്ന ഒന്നിച്ചുകൂടിയ സമൂഹത്തെ ‘സഭ’ സംക്ഷിപ്തവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു; ഇത് പ്രത്യേക സഭാവിഭാഗത്തിന്റെ സാങ്കേതിക അർഥമായി ഉദ്ദേശിച്ചിട്ടില്ല.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: ഈ മരുഭൂമിയിലേക്കു
  rationale: מִדְבָּר എന്നതിന്റെ വനാന്തര/വരണ്ട പ്രദേശ അർഥം ‘മരുഭൂമി’ സ്വാഭാവികമായി നൽകുന്നു; אֶל ചലനത്തിന്റെ ദിശ വ്യക്തമാക്കുന്നു.
- source_word: לָמוּת שָׁם
  choice: ഇവിടെ മരിക്കാനോ
  rationale: ഇൻഫിനിറ്റീവിലെ ഉദ്ദേശ്യം/ഫലം എന്ന തുറന്ന ബന്ധം ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു. സംസാരിക്കുന്നവർ ഇപ്പോൾ ആ സ്ഥലത്തായതിനാൽ ഹീബ്രായയിലെ ‘അവിടെ’ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇവിടെ’ ആക്കുന്നു.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: ഞങ്ങളും ഞങ്ങളുടെ കന്നുകാലികളും
  rationale: വ്യക്തമായ സർവനാമവും കൂട്ടനാമവും സംരക്ഷിക്കുന്നു; בְּעִיר എന്നത് വീട്ടുമൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘കന്നുകാലികൾ’ അനുയോജ്യം.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമം ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ നിലനിർത്തുന്നു.
- issue: לָמוּת എന്ന ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യം/ഫലം
  choice: മരിക്കാനോ?
  alternative: മരിക്കേണ്ടതിന്
  rationale: പരാതിയിലെ വാചാടോപചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുകയും പ്രവൃത്തി ഉദ്ദേശ്യമായിരുന്നോ ഫലത്തിലേക്കാണോ നയിച്ചതെന്ന മൂലത്തിലെ സൂക്ഷ്മമായ തുറന്ന നില അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യവും വാചികപരാതിയുടെ ശക്തിയുള്ളതുമായ ശൈലി. ഹീബ്രായ ക്രമത്തിന്റെ ഭാരം നിലനിർത്താൻ അവസാന ഭാഗം ദീർഘരേഖയ്ക്കുശേഷം നൽകിയിരിക്കുന്നു.
