  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: ml
  text: 'പിന്നെ മോശെ കാദേശിൽനിന്ന് ഏദോംരാജാവിന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ചു: “നിന്റെ സഹോദരനായ ഇസ്രായേൽ ഇപ്രകാരം പറയുന്നു: ഞങ്ങൾക്കു നേരിട്ട സകല കഷ്ടപ്പാടും നീ അറിയുന്നുവല്ലോ.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ ബന്ധുവായ ഇസ്രായേൽ.” എബ്രായപാഠം അക്ഷരാർഥത്തിൽ “നിന്റെ സഹോദരനായ ഇസ്രായേൽ” എന്നു കുടുംബബന്ധത്തിന്റെ ഭാഷ ഉപയോഗിക്കുന്നു; ഇത് ഏദോമും ഇസ്രായേലും തമ്മിലുള്ള പൂർവികബന്ധത്തെ ഓർമിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഞങ്ങൾക്കു നേരിട്ട” എന്നതിന്റെ അക്ഷരാർഥം “ഞങ്ങളെ കണ്ടെത്തിയ” എന്നാണ്; അർഥം, “ഞങ്ങളുടെമേൽ വന്ന” അഥവാ “ഞങ്ങൾക്കു സംഭവിച്ച.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: പിന്നെ ... അയച്ചു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ‘പിന്നെ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാരെ
  rationale: ഈ നയതന്ത്രസന്ദർഭത്തിൽ സ്വർഗീയ ദൂതന്മാരെയല്ല, മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: מִקָּדֵשׁ
  choice: കാദേശിൽനിന്ന്
  rationale: എബ്രായപാഠത്തിൽ ‘കാദേശ്’ മാത്രമാണുള്ളത്; ‘കാദേശ്-ബർന്നേയ’ എന്ന് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: מֶלֶךְ אֱדוֹם
  choice: ഏദോംരാജാവിന്റെ അടുക്കൽ
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദവും construct പ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּה אָמַר
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: ദൂതസന്ദേശങ്ങളിൽ പതിവായ സൂത്രവാക്യത്തെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: നിന്റെ സഹോദരനായ ഇസ്രായേൽ
  rationale: ഏദോമും ഇസ്രായേലും തമ്മിലുള്ള പൂർവികബന്ധം ഉണർത്തുന്ന നേരിട്ടുള്ള കുടുംബരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: אַתָּה יָדַעְתָּ
  choice: നീ അറിയുന്നുവല്ലോ
  rationale: perfect രൂപം ഇവിടെ നിലവിലുള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു; പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ ‘നീ’ എന്നും ‘-വല്ലോ’ എന്നും ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל הַתְּלָאָה
  choice: സകല കഷ്ടപ്പാടും
  rationale: തീവ്രമായ പ്രയാസം, ദുരിതം, ക്ലേശം എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തമായ സമാനപദം.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: ഞങ്ങൾക്കു നേരിട്ട
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളെ കണ്ടെത്തിയത്’ എന്ന എബ്രായപ്രയോഗം മലയാളത്തിൽ ‘ഞങ്ങൾക്കു നേരിട്ട’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലും ഏദോമും തമ്മിലുള്ള ബന്ധുത്വഭാഷ
  choice: നിന്റെ സഹോദരനായ ഇസ്രായേൽ
  alternative: നിന്റെ ബന്ധുവായ ഇസ്രായേൽ
  rationale: വാക്യം യാക്കോബ്–ഏശാവ് പൂർവികബന്ധത്തെ ആധാരമാക്കി അഭ്യർഥനയെ കുടുംബപരമായി അവതരിപ്പിക്കുന്നു; പൊതുവായ ‘ബന്ധു’ എന്നതിലേക്കു മയപ്പെടുത്താതെ മൂലത്തിലെ ‘സഹോദരൻ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നയതന്ത്രസന്ദേശത്തിന്റെ ഔപചാരികത ‘ഇപ്രകാരം പറയുന്നു’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തി. ‘കഷ്ടപ്പാട്’ സാധാരണ വായനക്കാർക്കു വ്യക്തമാണ്; വേറൊരു സമാനപദത്തിനായി പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ലെന്ന് വിലയിരുത്തി.
