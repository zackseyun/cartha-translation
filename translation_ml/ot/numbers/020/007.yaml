lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דִּבֵּר എന്ന ക്രിയയുടെ പതിവ് ആഖ്യാനപ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-ന്റെ മലയാളത്തിൽ പരക്കെ പരിചിതമായ നാമരൂപം ഉപയോഗിച്ച്, ഒരു സ്ഥാനപ്പേര് കൊണ്ട് പകരംവയ്ക്കാതെ വ്യക്തിനാമം നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരക്രിയയോടൊപ്പം אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖീകരണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദു
  rationale: ഹീബ്രു പ്രസംഗാരംഭസൂത്രമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമായി നിർവഹിക്കുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതമായ ‘യഹോവ’ എന്ന രൂപം അതിനെ വ്യക്തിനാമമായി സംരക്ഷിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലാത്തതിനാൽ മറ്റൊരു സ്വരീകരണം നിർബന്ധമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അടുത്ത വാക്യത്തിൽ വരുന്ന ദൈവവചനത്തിലേക്കുള്ള പ്രസംഗാരംഭം ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
