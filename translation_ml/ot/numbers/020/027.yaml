source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: ml
  text: യഹ്‌വെ കൽപിച്ചതുപോലെ മോശെ ചെയ്തു. മുഴുവൻ സഭയുടെയും കൺമുന്നിൽവെച്ച്[a] അവർ ഹോർ പർവതത്തിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “മുഴുവൻ സഭയുടെയും കണ്ണുകൾക്കു മുമ്പിൽ”; അതായത്, കൂടിവന്ന ജനമെല്ലാം കാണത്തക്കവിധം പരസ്യമായി.'
    reason: മൂലഭാഷയിലെ ദൃശ്യരൂപവും അതിന്റെ സാഹചര്യാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה
  choice: കല്പിച്ചതുപോലെ മോശ ചെയ്തു
  rationale: ദൈവിക കല്പനയോടുള്ള മോശയുടെ അനുസരണം ലളിതമായ ആഖ്യാനശൈലിയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു; צִוָּה എന്നതിന്റെ അധികാരഭാവം ‘കല്പിച്ചു’ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וַיַּעֲלוּ
  choice: അവർ … കയറിപ്പോയി
  rationale: עלה എന്ന ക്രിയയുടെ മുകളിലേക്കുള്ള ഗതിയെ പർവതസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֶל הֹר הָהָר
  choice: ഹോർ പർവതത്തിലേക്കു
  rationale: ഹോർ എന്ന സ്ഥലനാമത്തെയും הָהָר എന്ന ‘പർവതം’ എന്ന നിർദേശത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לְעֵינֵי כָּל הָעֵדָה
  choice: സഭ മുഴുവന്റെയും കൺമുന്നിൽവെച്ച്
  rationale: ‘എല്ലാ സഭയുടെയും കണ്ണുകൾക്കു മുമ്പിൽ’ എന്ന എബ്രായ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും സംഭവം പരസ്യമായി നടന്നുവെന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹോവ’ എന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘യഹ്‌വെ’ മൂലനാമത്തിന്റെ സാധാരണ പണ്ഡിതോചിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സഭ’ ഇവിടെ ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ദൈർഘ്യമേറിയ ഏകവാക്യം ഒഴിവാക്കി വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി.
