  variant: modern standard Malayalam
source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: ml
  text: അഹരോൻ തന്റെ ജനത്തോടു ചേർക്കപ്പെടും[a]. ഞാൻ ഇസ്രായേലിന്റെ പുത്രന്മാർക്കു നൽകിയ ദേശത്ത് അവൻ പ്രവേശിക്കുകയില്ല; കാരണം, മെരീബയിലെ വെള്ളങ്ങളിൽവെച്ച് നിങ്ങൾ എന്റെ കൽപ്പന ധിക്കരിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്; അക്ഷരാർഥത്തിൽ, ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെടും.’
    reason: idiom_explanation
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ വായോട് മത്സരിച്ചു’; അതായത്, ഞാൻ അരുളിയ കൽപ്പനയെ ധിക്കരിച്ചു.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: തന്റെ ജനത്തോടു ചേർക്കപ്പെടും
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവവും പൂർവികജനത്തോടുള്ള ബന്ധത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; അതിനെ വെറും ‘മരിക്കും’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: יָבֹא אֶל־הָאָרֶץ
  choice: ദേശത്ത് പ്രവേശിക്കുകയില്ല
  rationale: ചലനക്രിയയും ഉപസർഗവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വാഗ്ദത്ത’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: אֲשֶׁר נָתַתִּי
  choice: ഞാൻ ... നൽകിയ
  rationale: ദൈവം നൽകിയ ദാനം ഉറപ്പുള്ളതായി കാണിക്കുന്ന എബ്രായ perfect രൂപം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്
  rationale: സൂത്രവാക്യസ്വഭാവമുള്ള എബ്രായ പ്രയോഗത്തിലെ ‘പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേൽജനതയെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: מְרִיתֶם
  choice: നിങ്ങൾ ... ധിക്കരിച്ചു
  rationale: മָרָה എന്ന ക്രിയയിലെ അധികാരത്തിനെതിരായ അനുസരണക്കേടിന്റെയും വെല്ലുവിളിയുടെയും ഗൗരവം ‘ധിക്കരിച്ചു’ വ്യക്തമായി നൽകുന്നു.
- source_word: אֶת־פִּי
  choice: എന്റെ കൽപ്പന
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്റെ വായ്’ എന്നാണെങ്കിലും ഇവിടെ ദൈവം അരുളിയ കൽപ്പനയാണ് ഉദ്ദേശ്യം; ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְמֵי מְרִיבָה
  choice: മെരീബയിലെ വെള്ളത്തിനരികെ
  rationale: സ്ഥലത്തെയും സംഭവത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘മെരീബ’ എന്ന സ്ഥലനാമം വിവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘തന്റെ ജനത്തോടു ചേർക്കപ്പെടും’ എന്ന മരണപ്രയോഗം
  choice: മൂലത്തിലെ പ്രയോഗം നിലനിർത്തുക
  alternative: ‘അഹരോൻ മരിക്കും’ എന്നു നേരിട്ട് പറയുക
  rationale: ഇത് ശാരീരികമരണത്തിന്റെ അറിയിപ്പിൽ ഒതുങ്ങാതെ സ്വന്തം ജനത്തോടോ പൂർവികരോടോ ചേരുന്നതിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര സൂചന നിലനിർത്തുന്നു; അതേസമയം മരണാനന്തരജീവിതത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ആരോപിക്കുന്നില്ല.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിലെ ലിംഗരൂപം
  choice: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’
  alternative: ‘ഇസ്രായേൽജനം’ അല്ലെങ്കിൽ ‘ഇസ്രായേല്യർ’
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുരുഷലിംഗവും സൂത്രവാക്യസ്വഭാവവുമുള്ള രൂപം നിലനിർത്തുന്നു; അതിന്റെ ദേശീയസമൂഹപരമായ വ്യാപ്തി നിഷേധിക്കുന്നില്ല.
- issue: ‘എന്റെ വായ്’ എന്ന ദൈവാംഗരൂപകം
  choice: പ്രധാനപാഠത്തിൽ ‘എന്റെ കൽപ്പന’
  alternative: ‘എന്റെ വായ്’ അല്ലെങ്കിൽ ‘എന്റെ വാക്ക്’
  rationale: ഇവിടെ ‘വായ്’ ദൈവം അരുളിയ നിർദേശം എന്ന metonymic അർഥത്തിലാണ്. ‘കൽപ്പന’ അർഥം വ്യക്തമാക്കുന്നു; അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളമാണ് ഉപയോഗിച്ചത്. മരണത്തെക്കുറിച്ചുള്ള എബ്രായ പ്രയോഗത്തിന്റെ ഗൗരവം നിലനിർത്തിയപ്പോൾ, ‘കൽപ്പന ധിക്കരിച്ചു’ എന്നത് വായനാസൗകര്യത്തിനായി സ്വാഭാവികമാക്കി. സ്ഥലനാമം ‘മെരീബ’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
