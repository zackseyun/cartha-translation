translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. എബ്രായത്തിലെ സംഭവക്രമവും ‘അവിടെ ... അവിടെ’ എന്ന ആവർത്തനവും നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് സമാലോചനാപാഠത്തിലെ [b] അടയാളം കാദേശിനു ശേഷമാണെങ്കിലും അതിന്റെ കുറിപ്പ് כָּל הָעֵדָה എന്ന പദസമുച്ചയത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘സഭ മുഴുവനും’ എന്നതിനുശേഷം ശരിയായ സ്ഥാനത്ത് ചേർത്തിരിക്കുന്നു.
