  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: ml
  text: ആദ്യമാസത്തിൽ യിസ്രായേൽമക്കൾ[a], സഭ മുഴുവനും[b], സീൻ മരുഭൂമിയിൽ എത്തി. ജനം കാദേശിൽ താമസിച്ചു. അവിടെവെച്ച് മിര്യാം മരിച്ചു; അവിടെത്തന്നെ അവളെ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യിസ്രായേല്യർ’ അല്ലെങ്കിൽ ‘യിസ്രായേലിന്റെ മക്കൾ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘യിസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ പ്രയോഗം യിസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സമൂഹം മുഴുവനും’ അല്ലെങ്കിൽ ‘ജനസമിതി മുഴുവനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: ‘യിസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ കുടുംബ-ദേശീയ പ്രയോഗത്തെ സ്വാഭാവികവും പരിചിതവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മുഴുവൻ യിസ്രായേൽജനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: כָּל הָעֵדָה
  choice: സഭ മുഴുവനും
  rationale: עֵדָה ഇവിടെ ഒത്തുചേർന്ന ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ അതിന്റെ സംഘടിതമായ സാമൂഹികഭാവം നിലനിർത്തുകയും ‘മുഴുവനും’ כָּל നെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: מִדְבַּר צִן
  choice: സീൻ മരുഭൂമി
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ബൈബിൾ ഭൂമിശാസ്ത്രഭാഷയിൽ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: ആദ്യമാസത്തിൽ
  rationale: കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ഏതു വർഷമാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: וַיֵּשֶׁב
  choice: താമസിച്ചു
  rationale: കാദേശിലെ വാസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വിവർത്തനം; സ്ഥിരമായി കുടിയേറി എന്ന അധിക അർഥം ഒഴിവാക്കുന്നു.
- source_word: הָעָם
  choice: ജനം
  rationale: യിസ്രായേലിനെ ഒരു ജനസമൂഹമായി സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: בְּקָדֵשׁ
  choice: കാദേശിൽ
  rationale: സ്ഥലവാസം സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള സ്ഥിതിവിഭക്തി ഉപയോഗിക്കുന്നു.
- source_word: מִרְיָם
  choice: മിര്യാം
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളത്തിൽ വ്യക്തമായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: וַתָּמָת
  choice: മരിച്ചു
  rationale: മൂലപാഠത്തിലെ നേരിട്ടുള്ള മരണപ്രസ്താവന മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: וַתִּקָּבֵר
  choice: അവളെ അടക്കം ചെയ്തു
  rationale: എബ്രായത്തിലെ നിഷ്ക്രിയരൂപത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിത-കർതൃപ്രയോഗത്തിലൂടെ നൽകുന്നു; അടക്കം ചെയ്തവരെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ കർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: שָׁם ... שָׁם
  choice: അവിടെവെച്ച് ... അവിടെത്തന്നെ
  rationale: മിര്യാം മരിച്ചതും അടക്കം ചെയ്യപ്പെട്ടതും ഒരേ സ്ഥലത്താണെന്ന എബ്രായ ആവർത്തനത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
