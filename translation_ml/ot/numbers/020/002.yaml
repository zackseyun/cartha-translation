source:
  edition: WLC
  text: וְ/לֹא הָ֥יָה מַ֖יִם לָ/עֵדָ֑ה וַ/יִּקָּ֣הֲל֔וּ עַל מֹשֶׁ֖ה וְ/עַֽל אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: ml
  text: ജനസമൂഹത്തിന്[a] വെള്ളമില്ലായിരുന്നു; അവർ മോശെയ്ക്കും അഹരോനും എതിരായി ഒന്നിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഭ’ എന്നോ ‘സമൂഹം’ എന്നോ പരിഭാഷപ്പെടുത്താം. എബ്രായപദമായ עֵדָה ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽ ജനതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: വെള്ളമില്ലായിരുന്നു
  rationale: നിഷേധത്തോടുകൂടിയ היהയും അനിശ്ചിതമായ വസ്തുനാമവും ഇവിടെ അസ്തിത്വത്തിന്റെ അഭാവം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വെള്ളമില്ലായിരുന്നു’ എന്നത് സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു; וְ എന്ന ലളിതബന്ധകത്തിന്റെ പ്രവാഹം അർദ്ധവിരാമത്തിലൂടെയും വാക്യക്രമത്തിലൂടെയും നിലനിർത്തുന്നു.
- source_word: מַיִם
  choice: വെള്ളം
  rationale: എബ്രായത്തിലെ രൂപം ബഹുവചനമാണെങ്കിലും ഇത് വസ്തുദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന പതിവുരൂപമാണ്; മലയാളത്തിൽ ഏകവചനസദൃശമായ ‘വെള്ളം’ സ്വാഭാവികം.
- source_word: לָ/עֵדָה
  choice: ജനസമൂഹത്തിന്
  rationale: עֵדָה ഇവിടെ ഒരുമിച്ചുകൂടിയ ഇസ്രായേൽ ജനതയെ ഒരു സമഗ്രസമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘ജനസമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ‘സഭ’ എന്ന പദത്തിന് ഉണ്ടാകാവുന്ന പിൽക്കാല മതസ്ഥാപനപരമായ അർഥഭാരം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: וַ/יִּקָּהֲלוּ
  choice: അവർ ... ഒന്നിച്ചുകൂടി
  rationale: קהל എന്ന ക്രിയ കൂട്ടമായി ഒരുമിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഒന്നിച്ചുകൂടി’ സ്വാഭാവികവും കൂട്ടായ പ്രവർത്തനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നതുമാണ്.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: മോശെയ്ക്കും അഹരോനും എതിരായി
  rationale: തുടർന്നുള്ള തർക്കസന്ദർഭത്തിൽ עַל ശത്രുതാപരമായ എതിർപ്പാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിച്ചിരിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന്റെ പരിധി മലയാളത്തിലെ ‘-ക്കും ... -നും എതിരായി’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തുന്നു.
