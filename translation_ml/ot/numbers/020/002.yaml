translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ജനസമൂഹം’ എന്നത് കൂട്ടായ ഇസ്രായേൽ സമൂഹത്തെ വ്യക്തമാക്കുകയും അനാവശ്യമായ സഭാസ്ഥാപനപരമായ ധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു. എബ്രായത്തിലെ നേരിട്ടുള്ള സംഭവക്രമവും എതിർപ്പിന്റെ ശക്തിയും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
