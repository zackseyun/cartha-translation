id: NUM.20.21
reference: Numbers 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: ml
  text: എന്നാൽ ഏദോം തന്റെ പ്രദേശത്തുകൂടി കടന്നുപോകാൻ ഇസ്രായേലിനെ അനുവദിച്ചില്ല. അതുകൊണ്ട് ഇസ്രായേൽ അവനെ വിട്ട് വഴിമാറിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനിൽനിന്ന് തിരിഞ്ഞുപോയി.”
    reason: נטה എന്ന ക്രിയയ്ക്ക് ‘വഴിമാറുക’ എന്നും ‘തിരിയുക’ എന്നും ഈ സന്ദർഭത്തിൽ പരിഭാഷപ്പെടുത്താവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: അനുവദിച്ചില്ല
  rationale: മָאֵן എന്ന ക്രിയയുടെ നിരസിക്കൽ/സമ്മതിക്കാതിരിക്കൽ എന്ന അർഥം, തുടർന്നുള്ള נתן എന്ന അനുമതി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: אֱדוֹם
  choice: ഏദോം
  rationale: ദേശത്തിന്റെയും ജനതയുടെയും പേരായ എദോമിനെ സാധാരണ മലയാള ബൈബിൾ രൂപത്തിനടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: נְתֹן
  choice: അനുവദിക്കാൻ
  rationale: മָאֵן എന്നതിനോടൊപ്പം ഇവിടെ ‘അനുമതി നൽകുക’ എന്ന പ്രയോഗാർഥമാണ്; അക്ഷരാർഥമായ ‘കൊടുക്കുക’ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുകയില്ല.
- source_word: עֲבֹר
  choice: കടന്നുപോകാൻ
  rationale: ഒരു ദേശത്തിലൂടെയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കടന്നുപോകുക’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: בִּגְבֻלוֹ
  choice: തന്റെ പ്രദേശത്തുകൂടി
  rationale: גְּבוּל എന്നതിന് അതിർത്തി, അതിർത്തിക്കുള്ളിലെ പ്രദേശം എന്നീ അർഥങ്ങളുണ്ട്; ഈ സന്ദർഭത്തിൽ അഭ്യർഥിച്ചത് ഏദോമിന്റെ ദേശത്തിലൂടെയുള്ള യാത്രയായതിനാൽ ‘പ്രദേശം’ അനുയോജ്യം. മൂന്നാംപുരുഷ സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
- source_word: וַיֵּט
  choice: വഴിമാറിപ്പോയി
  rationale: נטה ഇവിടെ നേരത്തേയുള്ള ഗതിയിൽനിന്നോ ഉദ്ദേശിച്ച വഴിയിൽനിന്നോ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; യാത്രാസന്ദർഭത്തിൽ ‘വഴിമാറിപ്പോയി’ സ്വാഭാവികമാണ്.
- source_word: מֵעָלָיו
  choice: അവനെ വിട്ട്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മേൽനിന്ന്’ എന്ന ഘടനയായാലും ഇവിടെ ഏദോമിൽനിന്നുള്ള അകൽച്ചയാണ് ഉദ്ദേശ്യം; ‘അവനെ വിട്ട്’ ദിശാഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി പിന്തുടർന്നു. ‘ഏദോം’ എന്ന ദേശീയനാമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ ഏകവചന സർവനാമം ‘അവനെ’ എന്നു നിലനിർത്തി; അതുവഴി മൂലപാഠത്തിന്റെ വ്യക്തിവൽക്കരണം അനാവശ്യമായി നീക്കിയിട്ടില്ല.
