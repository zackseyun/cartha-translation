  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: ml
  text: 'എദോംദേശത്തിന്റെ അതിർത്തിയിലുള്ള ഹോർ പർവതത്തിൽ യാഹ്‌വേ[a] മോശെയോടും അഹരോനോടും പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; ‘യാഹ്‌വേ’ എന്നും ലിപ്യന്തരം ചെയ്യുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: അരുളിച്ചെയ്തത്
  rationale: אמר എന്നത് അടിസ്ഥാനമായി ‘പറയുക’ എന്നാണ്; ഇവിടെ ദൈവിക പ്രസംഗം അവതരിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്തു’ എന്ന പ്രയോഗം സ്വീകരിച്ചു. തുടർന്നുള്ള לֵאמֹר-നോടൊപ്പം മലയാളത്തിൽ ‘അരുളിച്ചെയ്തത്:’ എന്ന ഘടന അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്ക് നയിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: തിരുനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: രണ്ടു അഭിസംബോധിതരെയും സൂചിപ്പിക്കുന്ന ആവർത്തിത אֶל മലയാളത്തിലെ സമാന്തരമായ ‘-യോടും ... -യോടും’ എന്ന ഘടനയിൽ നിലനിർത്തി.
- source_word: בְּהֹר הָהָר
  choice: ഹോർ പർവതത്തിൽവെച്ച്
  rationale: സ്ഥലസൂചകമായ בְ സ്വാഭാവികമായി ‘-ത്തിൽവെച്ച്’ എന്നു നൽകി; הֹר הָהָר പരമ്പരാഗത സ്ഥലനാമമായ ‘ഹോർ പർവതം’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: എദോംദേശത്തിന്റെ അതിർത്തിയിലുള്ള
  rationale: עַל גְּבוּל എന്നത് അതിർത്തിയോടു ചേർന്ന സ്ഥാനം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്ഥലം വ്യക്തമായി ബന്ധിപ്പിക്കാൻ ‘എദോംദേശത്തിന്റെ അതിർത്തിയിലുള്ള’ എന്നു നൽകി.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തത്:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു പ്രസംഗസൂത്രം മലയാളത്തിൽ കോളനോടുകൂടിയ ‘അരുളിച്ചെയ്തത്:’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ יהוה ഉപയോഗിക്കുന്നു. അതിനെ പദവിയായി മാറ്റാതെ ലിപ്യന്തരിച്ചു; ആധുനിക മലയാള ബൈബിൾ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ രൂപം ‘യഹോവ’ ആയതിനാൽ അത് തെരഞ്ഞെടുത്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ലെന്നതിനാൽ ‘യാഹ്‌വെ’യും സാധുവായ മറ്റൊരു ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ഗദ്യശൈലി. ഹീബ്രു വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, സ്ഥലവിവരം ആദ്യം നൽകി മലയാളത്തിലെ സ്വാഭാവിക ക്രമം സ്വീകരിച്ചു. ഈ വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്ക് തുറക്കുന്നതിനാൽ അവസാനം കോളൻ ഉപയോഗിച്ചു.
