- from: അഹരോനെയും അവന്റെ മകൻ എലെയാസരെയും കൂട്ടിക്കൊണ്ട് ഹോർ പർവതത്തിലേക്ക്[a] കയറുക.
  to: അഹരോനെയും അവന്റെ മകനായ എലെയാസരെയും കൂട്ടിക്കൊണ്ടുപോയി ഹോർ പർവതത്തിലേക്ക്[a] കയറ്റുക.
