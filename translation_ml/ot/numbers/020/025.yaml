  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപം ഉപയോഗിച്ചു. ‘കൂട്ടിക്കൊണ്ട് ... കയറുക’ എന്ന ഘടന ആവർത്തനം ഒഴിവാക്കി, കൂടെ കൊണ്ടുപോകുന്നതും പർവതത്തിലേക്കുള്ള കയറ്റവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
