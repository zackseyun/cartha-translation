  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: ml
  text: അഹരോനെയും അവന്റെ മകനായ എലെയാസരെയും കൂട്ടിക്കൊണ്ടുപോയി ഹോർ പർവതത്തിലേക്ക്[a] കയറ്റുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ പദാനുപദമായി: “ഹോർ, ആ പർവതം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: לקח എന്ന ക്രിയയുടെ കല്പനാരൂപം ഇവിടെ അഹരോനെയും എലെയാസരെയും കൂടെ കൊണ്ടുപോകാൻ മോശെയോടു കല്പിക്കുന്നു. തുടർന്നുള്ള ‘കയറുക’ എന്ന ക്രിയയോടു ചേർത്ത് ‘കൂട്ടിക്കൊണ്ട്’ എന്നു പറയുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: אַהֲרֹן
  choice: അഹരോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: אֶלְעָזָר
  choice: എലെയാസർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: בְּנוֹ
  choice: അവന്റെ മകൻ
  rationale: മൂന്നാം പുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയം സന്ദർഭത്തിൽ അഹരോനെയാണ് സൂചിപ്പിക്കുന്നത്; എലെയാസർ അഹരോന്റെ മകനാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: וְהַעַל
  choice: കയറുക
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫിൽ കല്പനാരൂപത്തിന് ‘മുകളിലേക്കു കൊണ്ടുപോകുക/കയറ്റുക’ എന്ന കാരകഭാവമുണ്ട്. ‘കൂട്ടിക്കൊണ്ട് ... കയറുക’ എന്ന സംയുക്തപ്രയോഗം ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹתָם
  choice: അഹരോനെയും ... എലെയാസരെയും
  rationale: ‘അവരെ’ എന്ന സർവനാമത്തിന്റെ സൂചിതർത്ഥം പേരുകളോടൊപ്പം വരുന്ന ‘കൂട്ടിക്കൊണ്ട്’ എന്ന പ്രയോഗത്തിലൂടെ മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: הֹר הָהָר
  choice: ഹോർ പർവതം
  rationale: സ്ഥലനാമത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം. എബ്രായയിലെ പദാനുപദ ഘടന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
