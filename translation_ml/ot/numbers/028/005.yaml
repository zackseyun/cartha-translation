revisions:
- from: ധാന്യയാഗത്തിനായി ഒരു ഏഫായുടെ പത്തിലൊന്ന് നേരിയ മാവും[a], ഇടിച്ചെടുത്ത എണ്ണ ഒരു ഹീനിന്റെ നാലിലൊന്ന് അതിൽ കലർത്തിയതും അർപ്പിക്കണം.[b]
  to: ധാന്യയാഗത്തിനായി ഒരു ഏഫായുടെ[a] പത്തിലൊന്ന് നന്നായി അരച്ച മാവ്, ഒരു ഹീനിന്റെ[a] നാലിലൊന്നു അളവുള്ള ഇടിച്ചെടുത്ത എണ്ണയിൽ[b] കലർത്തിയതും അർപ്പിക്കണം.
  rationale: 'The revision retains every stated quantity and sacrificial term while making the Hebrew construction explicit: the fine flour, not an unspecified subsequent item, is mixed with the measured crushed oil. It also uses a clearer contemporary Malayalam expression for fine flour and attaches the ancient-measure note to both terms it explains.'
