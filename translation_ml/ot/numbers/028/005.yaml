id: NUM.28.5
reference: Numbers 28:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: ml
  text: ധാന്യയാഗത്തിനായി ഒരു ഏഫായുടെ[a] പത്തിലൊന്ന് നന്നായി അരച്ച മാവ്, ഒരു ഹീനിന്റെ[a] നാലിലൊന്നു അളവുള്ള ഇടിച്ചെടുത്ത എണ്ണയിൽ[b] കലർത്തിയതും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏഫായും ഹീനും പുരാതന ഇസ്രായേലിലെ അളവുകളാണ്.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘അമർത്തിയെടുത്ത എണ്ണ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: ഒരു ഏഫായുടെ പത്തിലൊന്ന്
  rationale: വാക്യാരംഭത്തിലെ וַ മുൻവാക്യത്തിലെ അർപ്പണനിർദേശത്തോടു ഇതിനെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യഘടനയും ‘അർപ്പിക്കണം’ എന്ന തുടർച്ചയും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. പുരാതന അളവായ ‘ഏഫാ’ അതേപടി നിലനിർത്തി.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗാർപ്പണത്തിനുപയോഗിച്ച നന്നായി അരച്ച മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: לְמִנְחָה
  choice: ധാന്യയാഗത്തിനായി
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിൽ מִנְחָה ഒരു പൊതുവായ സമ്മാനമല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗവിഭാഗമാണ്.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: എണ്ണ ... അതിൽ കലർത്തിയതും
  rationale: നിഷ്ക്രിയ കൃദന്തരൂപമായ בְּלוּלָה മാവ് എണ്ണയോടു കലർത്തപ്പെട്ടതായി പറയുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിച്ചു.
- source_word: כָּתִית
  choice: ഇടിച്ചെടുത്ത
  rationale: ഒലിവ് ഇടിച്ചോ ചതച്ചോ ലഭിക്കുന്ന എണ്ണയെ സൂചിപ്പിക്കുന്നു. ‘അമർത്തിയെടുത്ത’ എന്നും പരിഭാഷപ്പെടുത്താം; മൂലപദത്തിന്റെ ഇടിക്കൽ/ചതയ്ക്കൽ ഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
- source_word: רְבִיעִת הַהִין
  choice: ഒരു ഹീനിന്റെ നാലിലൊന്ന്
  rationale: ഭിന്ന അളവ് കൃത്യമായി നിലനിർത്തുകയും പുരാതന അളവുപദമായ ‘ഹീൻ’ ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാഗനിയമശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച അർപ്പണനിർദേശം പൂർത്തിയാക്കാൻ ‘അർപ്പിക്കണം’ ചേർത്തിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
