source:
  edition: WLC
  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ml
  text: ഒരു കുഞ്ഞാടിനെ നീ രാവിലെ അർപ്പിക്കണം; രണ്ടാമത്തെ കുഞ്ഞാടിനെ സന്ധ്യകൾക്കിടയിൽ[a] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായ ഭാഷയിലെ ‘സന്ധ്യകൾക്കിടയിൽ’ എന്നത് സന്ധ്യാസമയത്തെയോ അപരാഹ്നത്തിന്റെ അവസാന ഭാഗത്തെയോ സൂചിപ്പിക്കുന്ന ഒരു പരമ്പരാഗത പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: കുഞ്ഞാട്
  rationale: യാഗസന്ദർഭത്തിൽ כֶּבֶשׂ സാധാരണയായി ഇളം ആടിനെ, മിക്കപ്പോഴും ആൺകുഞ്ഞാടിനെ, സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ലിംഗം പ്രത്യേകം ആവർത്തിക്കാത്തതിനാൽ സ്വാഭാവികമായ ‘കുഞ്ഞാട്’ സ്വീകരിച്ചു.
- source_word: אֶחָד
  choice: ഒരു
  rationale: אֶחָד എന്ന സംഖ്യാവാചകത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ഒരു’ എന്നാണ്; ‘ഒന്നാമത്തെ’ എന്നു മാറ്റാതെ മൂലപദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: תַּעֲשֶׂה
  choice: നീ ... അർപ്പിക്കണം
  rationale: עשה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും യാഗനിർദേശങ്ങളിൽ യാഗം അർപ്പിക്കുക എന്ന സാങ്കേതിക അർഥമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: בַבֹּקֶר
  choice: രാവിലെ
  rationale: בֹּקֶר എന്നത് ‘രാവിലെ’ എന്ന സാധാരണ സമയസൂചനയാണ്; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: הַשֵּׁנִי
  choice: രണ്ടാമത്തെ
  rationale: שֵׁנִי എന്ന ക്രമസംഖ്യയുടെ നേരിട്ടുള്ള അർഥം ‘രണ്ടാമത്തെ’ എന്നാണ്.
- source_word: בֵּין הָעַרְבָּיִם
  choice: സന്ധ്യകൾക്കിടയിൽ
  rationale: ‘സന്ധ്യകൾക്കിടയിൽ’ എന്ന അക്ഷരാർഥസമീപമായ വിവർത്തനം ഈ പരമ്പരാഗത സമയപ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു; അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
