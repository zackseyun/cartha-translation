translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എബ്രായയിലെ ആവർത്തിച്ച ക്രിയാരൂപവും ഏകവചന അഭിസംബോധനയായ ‘നീ’യും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്ന പദപ്രയോഗത്തിനരികിലാണ് [a] ചേർത്തിരിക്കുന്നത്.
