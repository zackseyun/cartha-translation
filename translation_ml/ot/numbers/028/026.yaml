  terminology: “യഹ്‌വെ,” “ധാന്യയാഗം,” and “വിശുദ്ധ സഭായോഗം” are appropriate, clear cultic terms. The footnote anchors in the Malayalam draft are correctly aligned with the terms they explain, unlike the supplied English audit trail's mismatched markers.
