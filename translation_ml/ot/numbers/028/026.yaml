source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: ml
  text: ആദ്യഫലങ്ങളുടെ ദിവസത്തിൽ, ആഴ്ചകളുടെ ഉത്സവത്തിൽ യഹ്‌വെക്കു പുതിയ ധാന്യയാഗം അർപ്പിക്കുമ്പോൾ, നിങ്ങൾക്കു വിശുദ്ധ സഭായോഗം[a] ഉണ്ടായിരിക്കണം. സാധാരണ ജോലിയൊന്നും[b] ചെയ്യരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധ സമ്മേളനം.” ആരാധനയ്ക്കായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധ സമ്മേളനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക എബ്രായപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കഠിനപ്രയത്നമുള്ള ജോലിയൊന്നും” അല്ലെങ്കിൽ “ഉപജീവനജോലിയൊന്നും.” ദൈനംദിന തൊഴിൽജീവിതവുമായി ബന്ധപ്പെട്ട സാധാരണ ജോലിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: ആദ്യഫലങ്ങളുടെ ദിവസം
  rationale: ഉത്സവവുമായി ബന്ധപ്പെട്ട ദിവസത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം. הַבִּכּוּרִים എന്ന ആരാധനാസംബന്ധിയായ പദത്തിന്റെ അർഥം ‘ആദ്യഫലങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בְּהַקְרִיבְכֶם
  choice: നിങ്ങൾ ... അർപ്പിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct സമകാലികത സൂചിപ്പിക്കുന്നു; യാഗസന്ദർഭത്തിൽ קרב എന്നത് യഹ്‌വെക്കു വഴിപാട് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מִנְחָה חֲדָשָׁה
  choice: പുതിയ ധാന്യയാഗം
  rationale: പുരോഹിതീയ യാഗസന്ദർഭത്തിൽ מִנְחָה സാധാരണയായി ധാന്യയാഗമാണ്; חֲדָשָׁה പുതിയ വിളവിൽനിന്നുള്ള യാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വെക്കു
  rationale: എബ്രായ പാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: നിങ്ങളുടെ ആഴ്ചകളുടെ ഉത്സവത്തിൽ
  rationale: ഇവിടെ ‘ആഴ്ചകൾ’ എന്നത് ഉത്സവനാമമാണ്; മലയാളവായനക്കാർക്ക് അതിന്റെ ഉത്സവസ്വഭാവം വ്യക്തമായി അറിയാൻ ‘ഉത്സവം’ ചേർക്കുന്നു.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധ സഭായോഗം
  rationale: ആരാധനയ്ക്കായി ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടിയ വിശുദ്ധസമ്മേളനത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ആരാധനാപദത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: היה + ל എന്ന എബ്രായ ഘടനയുടെ നിർദേശാത്മക ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള യാതൊരു ജോലിയും
  rationale: ഉത്സവദിവസത്തിൽ വിലക്കിയിരിക്കുന്ന സാധാരണ ഉപജീവനജോലിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; എല്ലാ തരത്തിലുള്ള പ്രവർത്തനവും പൂർണമായി വിലക്കുന്നു എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള നിയമനിഷേധം വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ ഉടമ്പടിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അത് ഒരു പൊതുപദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
- issue: כָּל מְלֶאכֶת עֲבֹדָה എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: പതിവുള്ള യാതൊരു ജോലിയും
  alternative: കഠിനാധ്വാനമുള്ള യാതൊരു ജോലിയും / ഉപജീവനജോലിയൊന്നും
  rationale: ഈ പുരോഹിതീയ പ്രയോഗം ഉത്സവാചരണവുമായി വിരുദ്ധമായ സാധാരണ തൊഴിൽപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കഠിനമായ ജോലി മാത്രം വിലക്കിയെന്നോ എല്ലാ പ്രവർത്തനവും വിലക്കിയെന്നോ പാഠം അനാവശ്യമായി നിർണയിക്കാതിരിക്കാൻ വിപുലമായ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നിയമ-ആരാധനാശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിന്റെ ഉത്സവപരവും യാഗപരവുമായ സാങ്കേതികത സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനം ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, മൂലപദങ്ങളോട് യോജിക്കുന്ന സ്ഥാനങ്ങളിൽ [a], [b] ക്രമപ്പെടുത്തി.
