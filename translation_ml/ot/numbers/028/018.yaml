lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: ഒന്നാം ദിവസം
  rationale: നിശ്ചിത ആർട്ടിക്കിളോടുകൂടിയ കാലസൂചക പദസമുച്ചയത്തിന്റെ നേരായ വിവർത്തനം. ‘ഉത്സവത്തിന്റെ’ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധ സഭായോഗം
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധ സമൂഹയോഗം എന്ന ആരാധനാപരമായ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: כָּל ... לֹא
  choice: ജോലിയൊന്നും ... ചെയ്യരുത്
  rationale: സമഗ്രമായ നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന നിഷേധഘടനയാണിത്.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള ജോലി
  rationale: എല്ലാത്തരം പ്രവർത്തനങ്ങളെയുമല്ല, ഉത്സവദിവസത്തിൽ വിലക്കപ്പെട്ടിരുന്ന സാധാരണ തൊഴിൽപരമായ ജോലിയെയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. ‘കഠിനജോലി’ എന്നു പറഞ്ഞാൽ ശാരീരികമായി ദുഷ്കരമായ ജോലികൾ മാത്രം എന്ന തെറ്റിദ്ധാരണ ഉണ്ടാകാം.
- source_word: לֹא תַעֲשׂוּ
  choice: നിങ്ങൾ ചെയ്യരുത്
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ രണ്ടാം പുരുഷ ബഹുവചന നിർദേശം സമൂഹത്തോടുള്ള നേരിട്ടുള്ള നിരോധനമായി വ്യക്തമായി നൽകുന്നു.
