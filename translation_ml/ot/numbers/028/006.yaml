  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: ml
  text: ഇത് സീനായി പർവതത്തിൽ നിർവഹിക്കപ്പെട്ട[b], പ്രസാദകരമായ സുഗന്ധത്തിനായുള്ള[c], യാഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണമായ[d] പതിവായുള്ള ഹോമയാഗമാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരന്തര ഹോമയാഗം.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദിവസേന ക്രമമായി ആവർത്തിക്കുന്ന അർപ്പണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സീനായി പർവതത്തിൽ സ്ഥാപിക്കപ്പെട്ടത്.’ എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ‘ചെയ്യപ്പെട്ടത്’ എന്നാണ്; ഇവിടെ യാഗം അവിടെ നിയമിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘ശാന്തിദായകമായ സുഗന്ധത്തിനായി’ അല്ലെങ്കിൽ ‘മധുരസുഗന്ധത്തിനായി.’
    reason: lexical_alternative
  - marker: d
    text: പരമ്പരാഗതമായി, ‘യാഹ്‌വേക്കുള്ള അഗ്നിയർപ്പണം.’ എബ്രായപദം തീയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണത്തെ സൂചിപ്പിക്കുന്നു; ചിലർ ‘ഭോജനവഴിപാട്’ എന്നും പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: പതിവായി അർപ്പിക്കേണ്ട ഹോമയാഗം
  rationale: עֹלָה എന്ന യാഗപദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ തുല്യപദം ‘ഹോമയാഗം’ ആണ്. תָּמִיד ഇവിടെ ദിവസേന തുടരുന്ന ക്രമബദ്ധമായ അർപ്പണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പതിവായി അർപ്പിക്കേണ്ട’ എന്നു നൽകി.
- source_word: הָעֲשֻׂיָה
  choice: അർപ്പിക്കപ്പെട്ടത്
  rationale: ഈ നിഷ്ക്രിയ കൃദന്തത്തിന്റെ അക്ഷരാർഥം ‘ചെയ്യപ്പെട്ടത്’ എന്നാണ്; യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കപ്പെട്ടത്’ സ്വാഭാവികവും പ്രസക്തവുമാണ്. ‘സ്ഥാപിക്കപ്പെട്ടത്’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: בְּהַר סִינַי
  choice: സീനായിമലയിൽ
  rationale: בְ എന്ന സ്ഥലസൂചക ഉപസർഗത്തിന്റെയും הַר סִינַי എന്ന സ്ഥലനാമത്തിന്റെയും സ്വാഭാവിക മലയാളരൂപം.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധത്തിനായി
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകാത്മക യാഗപ്രയോഗം നിലനിർത്തുന്നു; അതിനെ പ്രായശ്ചിത്തത്തിന്റെ യാന്ത്രിക വിവരണമായി മാറ്റുന്നില്ല.
- source_word: אִשֶּׁה
  choice: തീയിലർപ്പിക്കുന്ന വഴിപാട്
  rationale: തീയുമായി ബന്ധപ്പെട്ട യാഗാർപ്പണം എന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ഭോജനവഴിപാട്’ എന്ന വിവാദപരമായ വ്യുത്പത്തിയെ മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- source_word: לַיהוָה
  choice: യാഹ്‌വേയ്ക്ക്
  rationale: יהוה എന്ന ഉടമ്പടിനാമം വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു; לְ എന്ന ദിശാസൂചക ഘടകം ‘-യ്ക്ക്’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യാഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗം
  choice: പ്രസാദകരമായ സുഗന്ധം
  alternative: ശാന്തിദായകമായ സുഗന്ധം; മധുരസുഗന്ധം
  rationale: ദൈവിക സ്വീകാര്യതയുടെ രൂപകത്തെ സംരക്ഷിക്കുകയും ‘ശമിപ്പിക്കൽ’ എന്ന പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: הָעֲשֻׂיָה בְּהַר סִינַי എന്നതിന്റെ അർഥം
  choice: സീനായിമലയിൽ അർപ്പിക്കപ്പെട്ടത്
  alternative: സീനായിമലയിൽ സ്ഥാപിക്കപ്പെട്ടത്
  rationale: നിഷ്ക്രിയ കൃദന്തത്തിന്റെ നേരിട്ടുള്ള യാഗസന്ദർഭാർത്ഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; ഇത് അവിടെ യാഗം നിയമിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ഹോമയാഗം’ പോലുള്ള പരിചിത യാഗപദം നിലനിർത്തിയപ്പോൾ, അപരിചിതമായ സംസ്കൃതഭാരമുള്ള ഘടനകൾ ഒഴിവാക്കി. മൂലത്തിലെ യാഗപരമായ ആവർത്തനവും സീനായിലെ അർപ്പണം/സ്ഥാപനം എന്ന അർഥദ്വയവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
