id: NUM.28.27
reference: Numbers 28:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: ml
  text: 'യഹ്‌വേക്കു പ്രസാദകരമായ സൗരഭ്യമായി ഒരു ഹോമയാഗം അർപ്പിക്കണം: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് രണ്ടു കാളകൾ, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഏഴ് ആൺചെമ്മരിയാട്ടിൻകുട്ടികൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: അർപ്പിക്കണം
  rationale: ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ യാഗവസ്തു സമർപ്പിക്കുക/അർപ്പിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും ആചാരപരമായ അർഥം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: עוֹלָה
  choice: ഒരു ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന യാഗവിഭാഗത്തിനുള്ള പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾപദമാണ്; പദോത്പത്തിപരമായ ‘ഉയരുന്ന യാഗം’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  rationale: യാഗം യഹ്‌വേക്കു സ്വീകാര്യവും പ്രസാദകരവുമാണെന്ന സൂചനയുള്ള സ്ഥിരപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ഹീബ്രു മൂലപാഠത്തിലുള്ള ദൈവനാമം ശീർഷകമാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് രണ്ടു കാളകൾ
  rationale: രണ്ടു കാളകളെയും അവയുടെ കന്നുകാലിവർഗ്ഗത്തെയും വ്യക്തമാക്കുന്നു; ഇവിടെ പ്രായം വ്യക്തമായി പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘ഇളങ്കാളകൾ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: אַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടും സാധാരണക്കാർക്കു മനസ്സിലാകുന്നതുമായ പരിഭാഷ.
- source_word: שִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആൺചെമ്മരിയാട്ടിൻകുട്ടികൾ
  rationale: മൃഗങ്ങളുടെ ലിംഗവും പ്രായവും രണ്ടും കൃത്യമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തുകയും പൊതുവായ ഒരു ശീർഷകമായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: לְרֵיחַ נִיחֹחַ എന്ന യാഗസൂത്രവാക്യത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സൗരഭ്യമായി
  alternative: ശാന്തിദായകമായ സൗരഭ്യമായി; മധുരസൗരഭ്യമായി
  rationale: ദൈവിക സ്വീകാര്യതയുടെ ആശയം അറിയിക്കുമ്പോഴും പ്രയോഗത്തിലെ സൗരഭ്യരൂപകം നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രസാദം എങ്ങനെയാണെന്നത് അതിലധികം വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാഗസാങ്കേതിക പദമായി ‘ഹോമയാഗം’ നിലനിർത്തി; വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
