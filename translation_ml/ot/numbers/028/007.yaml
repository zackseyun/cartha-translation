id: NUM.28.7
reference: Numbers 28:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: ml
  text: അതിന്റെ പാനീയയാഗം ഓരോ കുഞ്ഞാടിനും കാൽ ഹീൻ വീതമായിരിക്കണം.[a] വിശുദ്ധസ്ഥലത്ത്[b] യഹോവയ്ക്കായി ലഹരിപാനീയം പാനീയയാഗമായി ഒഴിച്ചർപ്പിക്കണം.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒരു കുഞ്ഞാടിന്’; അക്ഷരാർഥം ‘ആ ഒരു കുഞ്ഞാടിന്.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വിശുദ്ധമന്ദിരത്തിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ‘ലഹരിപാനീയം’ എന്നത് വീഞ്ഞിൽനിന്ന് വ്യത്യസ്തമായ ഒരു മത്തുപാനീയത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ ഇനം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: അതിന്റെ പാനീയയാഗം
  rationale: മുൻസന്ദർഭത്തിലെ നിരന്തരഹോമയാഗത്തോടൊപ്പമുള്ള ദ്രവയാഗത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; പ്രത്യയം ‘അതിന്റെ’ എന്നു നിലനിർത്തി.
- source_word: רְבִיעִת הַהִין
  choice: കാൽ ഹീൻ
  rationale: പുരാതന അളവായ ‘ഹീൻ’ പരിവർത്തനം ചെയ്യാതെ സൂക്ഷിക്കുകയും നാലിലൊന്ന് എന്ന അളവ് സ്വാഭാവികമായി ‘കാൽ’ എന്നു നൽകുകയും ചെയ്തു.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോ കുഞ്ഞാടിനും ... വീതം
  rationale: അക്ഷരാർഥം ‘ആ ഒരു കുഞ്ഞാടിന്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഓരോ കുഞ്ഞാടിനുമുള്ള അളവാണ് നിർദേശിക്കുന്നത്; വിതരണാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്ത്
  rationale: ബലിയർപ്പണസന്ദർഭത്തിൽ ഇത് അമൂർത്തമായ ‘വിശുദ്ധിയിൽ’ എന്നതിനെക്കാൾ വിശുദ്ധമായ സ്ഥലത്തെയോ തിരുനിവാസപരിസരത്തെയോ സൂചിപ്പിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘വിശുദ്ധമന്ദിരം’ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
- source_word: הַסֵּךְ נֶסֶךְ
  choice: പാനീയയാഗം ഒഴിച്ചർപ്പിക്കണം
  rationale: ഒഴിക്കുക എന്ന പ്രവൃത്തിയും അത് യാഗാർപ്പണമാണെന്ന ആശയവും ഒരുമിച്ച് സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ആവർത്തിച്ചിരിക്കുന്ന നാമവും ക്രിയയും അർഥപരമായി നിലനിർത്തുന്നു.
- source_word: שֵׁכָר
  choice: ലഹരിപാനീയം
  rationale: വീഞ്ഞിൽനിന്ന് വേറിട്ട ഒരു മത്തുപാനീയത്തെ സൂചിപ്പിക്കുന്ന വിശാലപദമാണിത്; കൃത്യമായ പാനീയതരം നിർണയിക്കാതെ മൂലപാഠത്തിന്റെ പൊതുത്വം നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ചതുരക്ഷര ദൈവനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപത്തിൽ നൽകി; ദിശ/സ്വീകർത്താവ് എന്ന ബന്ധം ‘യ്ക്ക്’ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു പകരാതെ നാമമായി നിലനിർത്തി. സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ രൂപം തെരഞ്ഞെടുത്തു.
- issue: בַּקֹּדֶשׁ സൂചിപ്പിക്കുന്ന സ്ഥലം
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധമന്ദിരം; വിശുദ്ധിയിൽ
  rationale: ആരാധനാസംബന്ധമായ ഭൗതികസ്ഥലം എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുമ്പോഴും, അതിന്റെ പരിധി അനാവശ്യമായി നിർണയിക്കാതിരിക്കാൻ ‘വിശുദ്ധസ്ഥലം’ എന്നു നൽകി; ‘വിശുദ്ധമന്ദിരം’ അടിക്കുറിപ്പിൽ സാധ്യതയായി ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ‘പാനീയയാഗം’, ‘ഹീൻ’, ‘വിശുദ്ധസ്ഥലം’ എന്നീ സാങ്കേതിക പദങ്ങൾ മൂലപാഠത്തോടുള്ള സുതാര്യതയ്ക്കായി നിലനിർത്തി; ‘ഒഴിച്ചർപ്പിക്കണം’ എന്ന പ്രയോഗം ഒഴിക്കൽപ്രവൃത്തിയും യാഗസ്വഭാവവും സ്വാഭാവികമായി കൂട്ടിച്ചേർക്കുന്നു.
