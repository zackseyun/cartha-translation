  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: ml
  text: രണ്ടാമത്തെ കുഞ്ഞാടിനെ രണ്ടു സന്ധ്യകൾക്കിടയിൽ[a] അർപ്പിക്കണം. രാവിലത്തെ ധാന്യയാഗത്തിന്റെയും അതിന്റെ പാനീയയാഗത്തിന്റെയും വിധിപോലെ അതിനെ യഹോവയ്ക്കു പ്രസാദകരമായ സൗരഭ്യമായ അഗ്നിയാഗമായി[b] അർപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘രണ്ടു സന്ധ്യകൾക്കിടയിൽ’; ഇത് സാധാരണയായി ‘സന്ധ്യാസമയത്ത്’ എന്നു മനസ്സിലാക്കപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഭക്ഷ്യയാഗമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: രണ്ടാമത്തെ കുഞ്ഞാട്
  rationale: യാഗസന്ദർഭത്തിൽ כֶּבֶשׂ കുഞ്ഞാടിനെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്; പ്രഭാതയാഗത്തിനു ശേഷമുള്ള ക്രമം വ്യക്തമാക്കാൻ ‘രണ്ടാമത്തെ’ നിലനിർത്തി.
- source_word: תַּעֲשֶׂה
  choice: അർപ്പിക്കണം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക/ഒരുക്കുക’ എന്നാണെങ്കിലും, യാഗനിർദേശത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം ‘അർപ്പിക്കുക’ ആണ്.
- source_word: בֵּין הָעַרְבָּיִם
  choice: രണ്ടു സന്ധ്യകൾക്കിടയിൽ
  rationale: കൃത്യമായ സമയസൂചന വിവാദമായതിനാൽ എബ്രായ ഭാഷാശൈലിയുടെ അവ്യക്തത മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സ്വാഭാവികമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: രാവിലത്തെ ധാന്യയാഗം അർപ്പിച്ചതുപോലെ
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ מִנְחָה പൊതുവായ വഴിപാടല്ല, ധാന്യയാഗമാണ്.
- source_word: וּכְנִסְכּוֹ
  choice: അതോടൊപ്പമുള്ള പാനീയയാഗം അർപ്പിച്ചതുപോലെ
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന അനുബന്ധയാഗത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രചാരമുള്ളതും ഗ്രഹിക്കാവുന്നതുമായ ‘പാനീയയാഗം’ സ്വീകരിച്ചു.
- source_word: אִשֵּׁה
  choice: അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട അർപ്പണം എന്ന പദത്തിന്റെ നിർണായക ഘടകം നേരിട്ട് നിലനിർത്തുന്നു; സാധ്യമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തി.
- source_word: לַיהוָה
  choice: യഹോവയ്ക്ക്
  rationale: ദൈവനാമമായ יהוה ഒരു പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമം പൊതുവായ സ്ഥാനപ്പേരിൽ ലയിപ്പിക്കാതെ മലയാളത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തി.
- issue: בֵּין הָעַרְבָּיִם എന്ന സമയപ്രയോഗം
  choice: രണ്ടു സന്ധ്യകൾക്കിടയിൽ
  alternative: സന്ധ്യാസമയത്ത്
  rationale: ഈ എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യമായ സമയപരിധിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ നിലനിർത്തി.
- issue: אִשֵּׁה എന്ന യാഗപദം
  choice: അഗ്നിയാൽ അർപ്പിക്കുന്ന യാഗം
  alternative: ഭോജനയാഗം
  rationale: പദത്തിലെ അഗ്നിസംബന്ധമായ ഘടകം വ്യക്തമാക്കുകയും ദൈവം ആഹാരം കഴിക്കുന്നു എന്ന അനാവശ്യ ധാരണ ഒഴിവാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ യാഗനിയമങ്ങളുടെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. സമയപ്രയോഗത്തിലെ മൂലഭാഷാപരമായ അവ്യക്തത സംരക്ഷിക്കുകയും സാങ്കേതിക യാഗപദങ്ങൾക്ക് ഗ്രഹിക്കാവുന്ന രൂപങ്ങൾ ഉപയോഗിക്കുകയും ചെയ്തു.
