language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: ml
  text: ഓരോ ശബ്ബത്തിനുമുള്ള ഹോമയാഗം അതതു ശബ്ബത്തിൽ[a], പതിവായ ഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ശബ്ബത്തിന്റെ ഹോമയാഗം അതിന്റെ ശബ്ബത്തിൽ.’'
    reason: മൂലഭാഷയിലെ ഏകവചന പ്രത്യയപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ വിതരണാർഥത്തിൽ നൽകിയിരിക്കുന്നതു വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: עֹלַת
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്ന עֹלָה എന്ന സാങ്കേതിക യാഗപദത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ തുല്യപദമാണ് ‘ഹോമയാഗം’.
- source_word: שַׁבַּת
  choice: ശബ്ബത്ത്
  rationale: യാഗങ്ങളുടെ കലണ്ടർ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ഈ പദം പൊതുവായ ‘ആഴ്ച’യെയല്ല, ശബ്ബത്തുദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּשַׁבַּתּוֹ
  choice: അതതു ശബ്ബത്തിൽ
  rationale: മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയമുള്ള എബ്രായ പ്രയോഗം ആവർത്തിച്ചുവരുന്ന ഓരോ ശബ്ബത്തിനെയും വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു. ‘അതതു ശബ്ബത്തിൽ’ ഈ അർഥം സ്വാഭാവികമായി നൽകുകയും ‘അതിന്റെ ശബ്ബത്തിൽ’ എന്ന മൂലരൂപത്തിന്റെ സ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: עַל
  choice: പുറമേ
  rationale: യാഗനിർദേശങ്ങളിൽ עַל മറ്റൊരു യാഗത്തോടു കൂട്ടിച്ചേർക്കുന്നതിനെ സൂചിപ്പിക്കാം; ഇവിടെ ശബ്ബത്തിലെ യാഗം പതിവായ യാഗത്തിന് പകരമല്ല, അതിനു പുറമേയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: הַתָּמִיד
  choice: പതിവായ
  rationale: תָּמִיד തുടർച്ചയായി അഥവാ ക്രമമായി നടത്തപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പതിവായ ഹോമയാഗം’ ആ നിശ്ചിത ആവർത്തനസ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: וְנִסְכָּהּ
  choice: അതിന്റെ പാനീയയാഗത്തിനും
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന അനുബന്ധയാഗമാണ്; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ഹോമയാഗത്തിലേക്കാണ് മടങ്ങുന്നത്. ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന സ്ഥാപിത പദമാണ്.
