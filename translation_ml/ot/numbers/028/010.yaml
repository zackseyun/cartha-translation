translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാപര പദാവലി ഉപയോഗിച്ചു. എബ്രായ വാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ക്രിയ മലയാളത്തിൽ പൂർണവാക്യത്തിനായി ‘അർപ്പിക്കണം’ എന്നു സന്ദർഭാനുസൃതമായി പൂരിപ്പിച്ചു; യാഗനിർദേശത്തിന്റെ നിർബന്ധസ്വഭാവം ഇതിലൂടെ നിലനിൽക്കുന്നു.
