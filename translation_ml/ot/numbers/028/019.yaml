  to: 'നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണമായ ദഹനയാഗം അർപ്പിക്കണം: രണ്ടു കാളകൾ, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ; അവ നിങ്ങൾക്ക് യാതൊരു കുറവുമില്ലാത്തവയായിരിക്കണം.[a]'
