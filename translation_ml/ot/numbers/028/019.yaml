reference: Numbers 28:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: ml
  text: 'നിങ്ങൾ യഹ്‌വേക്കു അഗ്നിയർപ്പണമായ ദഹനയാഗം അർപ്പിക്കണം: രണ്ടു കാളകൾ, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ; അവ നിങ്ങൾക്ക് യാതൊരു കുറവുമില്ലാത്തവയായിരിക്കണം.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന യാഗം.” എബ്രായപദം അഗ്നിയാൽ അർപ്പിക്കപ്പെടുന്ന യാഗത്തിനുള്ള ഒരു സാങ്കേതിക പദമാണ്.
    reason: അִשֶּׁה എന്ന സാങ്കേതിക പദത്തിന്റെ വിവരണാത്മക ബദൽ നൽകുകയും അതിന്റെ യാഗപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ യാഗവസ്തു കൊണ്ടുവന്ന് സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אִשֶּׁה
  choice: അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന ഒരു യാഗം
  rationale: ഇത് അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാണ്. അസ്പഷ്ടമായ കൃത്രിമപദത്തേക്കാൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിവരണാത്മക രൂപം സ്വീകരിച്ചു; പദത്തിന്റെ സാങ്കേതിക സ്വഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: עֹלָה
  choice: ദഹനയാഗം
  rationale: യാഗപീഠത്തിൽ പൂർണമായി ദഹിപ്പിക്കപ്പെടുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ലְ എന്ന ഉപസർഗം സമർപ്പണത്തിന്റെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; יהוה എന്ന ദൈവനാമം പേരായിത്തന്നെ നിലനിർത്തി.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: രണ്ടു കാളകൾ
  rationale: ‘കന്നുകാലികളുടെ പുത്രന്മാരായ കാളകൾ’ എന്ന എബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കാളകൾ’ എന്നു നൽകാം; സന്ദർഭം ആൺമൃഗങ്ങളെയാണു സൂചിപ്പിക്കുന്നത്.
- source_word: וְאַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: യാഗപ്പട്ടികയിലെ אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സൂചിപ്പിക്കുന്നു; ‘ആട്ടുകൊറ്റൻ’ സ്വാഭാവികമായ മലയാളരൂപമാണ്.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ
  rationale: כְבָשִׂים എന്നത് ആൺകുഞ്ഞാടുകളെയും בְּנֵי שָׁנָה എന്ന പ്രയോഗം ഒരു വയസ്സുള്ളവയെയും സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവും പ്രായവും വ്യക്തമാക്കി.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: അവ നിങ്ങൾക്കായി ഊനമില്ലാത്തവയായിരിക്കണം
  rationale: യാഗമൃഗങ്ങൾക്ക് ശാരീരിക വൈകല്യമോ ന്യൂനതയോ ഉണ്ടാകരുതെന്ന അർഥത്തിൽ תָּמִים എന്ന പദം ‘ഊനമില്ലാത്ത’ എന്നു നൽകി; לָכֶם എന്ന ഘടകവും ഒഴിവാക്കാതെ സൂക്ഷിച്ചു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം നിയമബന്ധത്തിലെ വ്യക്തിനാമമായ יהוה നേരിട്ട് ഉപയോഗിക്കുന്നു. പൊതുപദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം നിലനിർത്തുന്നത് മൂലരൂപത്തിന്റെ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- issue: אִשֶּׁהയും עֹלָהയും തമ്മിലുള്ള ബന്ധം
  choice: ‘അഗ്നിയിൽ ദഹിപ്പിക്കുന്ന ഒരു യാഗം’ എന്ന പൊതുവിവരണത്തെ ‘ദഹനയാഗം’ എന്ന പ്രത്യേക യാഗവിഭാഗത്തോടു ചേർത്തു നൽകി
  alternative: രണ്ടിനെയും ഒരേയൊരു പദമായി ലയിപ്പിക്കുക
  rationale: മൂലപാഠത്തിലെ അനുബന്ധപ്രയോഗം നിലനിർത്തി; പൊതുവായ അഗ്നിയാഗവും പ്രത്യേകമായ ദഹനയാഗവും തമ്മിലുള്ള പദവ്യത്യാസം മായ്ച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ യാഗനിയമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. പട്ടികയുടെ ചുരുക്കവും എബ്രായപാഠത്തിലെ നിർദേശഭാവവും സംരക്ഷിച്ചു.
