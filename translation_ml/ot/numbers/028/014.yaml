- from: 'അവയുടെ പാനീയയാഗങ്ങൾ ഇങ്ങനെയായിരിക്കണം: കാളയ്ക്ക് അര ഹീൻ[a] വീഞ്ഞ്, ആട്ടുകൊറ്റന് മൂന്നിലൊന്ന് ഹീൻ വീഞ്ഞ്, കുഞ്ഞാടിന് നാലിലൊന്ന് ഹീൻ വീഞ്ഞ്. വർഷത്തിലെ ഓരോ മാസത്തിലും അർപ്പിക്കേണ്ട പ്രതിമാസ ഹോമയാഗം ഇതാണ്.[b]'
  to: 'അവയ്ക്കുള്ള പാനീയയാഗങ്ങൾ ഇങ്ങനെയായിരിക്കണം: കാളയ്ക്ക് അര ഹീൻ[a] വീഞ്ഞ്, ആട്ടുകൊറ്റന് മൂന്നിലൊന്ന് ഹീൻ വീഞ്ഞ്, കുഞ്ഞാടിന് നാലിലൊന്ന് ഹീൻ വീഞ്ഞ്. വർഷത്തിലെ ഓരോ മാസത്തിലും അർപ്പിക്കേണ്ട മാസിക ഹോമയാഗം ഇതാണ്.[b]'
  rationale: മുഖ്യപാഠത്തിന്റെ അർഥവും സ്വാഭാവികതയും നിലനിർത്തി, സർവനാമബന്ധം വ്യക്തമാക്കി. അടിക്കുറിപ്പ് b-യിൽ പുതുചന്ദ്രം/മാസം എന്ന പദാർഥദ്വയാർഥം മൂലഎബ്രായ വാക്യത്തിലെ സ്ഥാനക്രമത്തോട് യോജിച്ചവിധം തിരുത്തി; ഇതിലൂടെ ബദൽവായന ബְּחָדְשׁוֹയെ തെറ്റായി ‘പുതുചന്ദ്രത്തിൽ’ എന്നു വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
