id: NUM.28.14
reference: Numbers 28:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: ml
  text: 'അവയ്ക്കുള്ള പാനീയയാഗങ്ങൾ ഇങ്ങനെയായിരിക്കണം: കാളയ്ക്ക് അര ഹീൻ[a] വീഞ്ഞ്, ആട്ടുകൊറ്റന് മൂന്നിലൊന്ന് ഹീൻ വീഞ്ഞ്, കുഞ്ഞാടിന് നാലിലൊന്ന് ഹീൻ വീഞ്ഞ്. വർഷത്തിലെ ഓരോ മാസത്തിലും അർപ്പിക്കേണ്ട മാസിക ഹോമയാഗം ഇതാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ഹീൻ ഏകദേശം 3.7 ലിറ്റർ ആയിരുന്നു.
    reason: പുരാതന അളവിനെ ആധുനിക വായനക്കാരന് മനസ്സിലാക്കാൻ സഹായിക്കുന്ന ഏകദേശ സമമൂല്യം.
  - marker: b
    text: അല്ലെങ്കിൽ, “വർഷത്തിലെ മാസങ്ങൾക്കായി, അതതു മാസത്തിലെ പുതുചന്ദ്രഹോമയാഗം ഇതാണ്.” എബ്രായത്തിലെ חֹדֶשׁ എന്ന പദത്തിന് ‘മാസം’ എന്നും ‘പുതുചന്ദ്രം’ എന്നും അർഥമാകാം.
    reason: ആദ്യ חֹדֶשׁ-നിലെ ‘പുതുചന്ദ്രം’ എന്ന യഥാർഥ പദാർഥസാധ്യത നിലനിർത്തുമ്പോൾ בְּחָדְשׁוֹയുടെ ‘അതതു മാസത്തിൽ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: അവയുടെ പാനീയയാഗങ്ങൾ
  rationale: യാഗസന്ദർഭത്തിൽ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രാവകയാഗത്തെ സൂചിപ്പിക്കുന്ന നֶסֶךְ എന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം.
- source_word: חֲצִי הַהִין
  choice: അര ഹീൻ
  rationale: പുരാതന അളവിനെ പരിവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും എബ്രായ ഭിന്നസംഖ്യ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לַפָּר
  choice: കാളയ്ക്ക്
  rationale: നിശ്ചിത യാഗമൃഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: മൂന്നിലൊന്ന് ഹീൻ
  rationale: ഭിന്നസംഖ്യയുടെ അർഥം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לָאַיִל
  choice: ആട്ടുകൊറ്റന്
  rationale: യാഗത്തിനുള്ള പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ സാധാരണ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וּרְבִיעִת הַהִין
  choice: നാലിലൊന്ന് ഹീൻ
  rationale: എബ്രായ ഭിന്നസംഖ്യാരൂപത്തെ കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: לַכֶּבֶשׂ
  choice: കുഞ്ഞാടിന്
  rationale: നിശ്ചിത യാഗമൃഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: יָיִן
  choice: വീഞ്ഞ്
  rationale: പാനീയയാഗങ്ങളുടെ ദ്രവ്യം വീഞ്ഞാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ പട്ടികയിൽ ഓരോ അളവിനോടും ചേർത്തത് വായനാസ്പഷ്ടതയ്ക്കാണ്.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: പ്രതിമാസ ഹോമയാഗം ഇതാണ്
  rationale: חֹדֶשׁ എന്നത് ‘മാസം’ എന്നും ‘അമാവാസി/പുതുചന്ദ്രം’ എന്നും അർഥമാക്കാം; മുഖ്യപാഠത്തിൽ ആവർത്തിച്ചുള്ള മാസികക്രമം സ്വാഭാവികമായി നൽകുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: വർഷത്തിലെ ഓരോ മാസത്തിലും അർപ്പിക്കേണ്ട
  rationale: അക്ഷരാർഥത്തിലെ ആവർത്തനം ഒഴിവാക്കി, ഓരോ മാസത്തെയും വർഷമുഴുവനുമുള്ള വിതരണാർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: חֹדֶשׁ എന്ന പദത്തിന്റെ ‘മാസം’ / ‘പുതുചന്ദ്രം’ ദ്വയാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രതിമാസ’
  alternative: ‘പുതുചന്ദ്രത്തിലെ ഹോമയാഗം’
  rationale: തുടർന്നുള്ള ‘വർഷത്തിലെ മാസങ്ങൾ’ എന്ന പ്രയോഗം ആവർത്തിച്ചുള്ള മാസികക്രമം മുന്നോട്ടുവയ്ക്കുന്നു; എന്നാൽ ആരാധനാക്രമത്തിലെ പുതുചന്ദ്രസൂചന യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘ഹീൻ’ എന്ന പുരാതന അളവ് മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അളവിന്റെ ഏകദേശം വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. ‘പാനീയയാഗം’, ‘ഹോമയാഗം’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു.
