translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. എബ്രായത്തിലെ വിതരണാർഥം ‘ഓരോ…വീതം’ എന്ന സ്വാഭാവിക മലയാളഘടനയിലൂടെ വ്യക്തമാക്കി; സന്ദർഭത്തിൽ സൂചിതമായ ‘ഏഫ’ പ്രധാനവാചകത്തിൽ വ്യക്തതയ്ക്കായി ഉൾപ്പെടുത്തി.
