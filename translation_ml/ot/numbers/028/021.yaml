source:
  edition: WLC
  text: עִשָּׂר֤וֹן עִשָּׂרוֹן֙ תַּעֲשֶׂ֔ה לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד לְ/שִׁבְעַ֖ת הַ/כְּבָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: ml
  text: ഏഴു കുഞ്ഞാടുകളിൽ ഓരോന്നിനും ഒരു ഏഫയുടെ പത്തിലൊന്ന് നീ ഒരുക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “പത്തിലൊന്ന്, പത്തിലൊന്ന്—ഒരു കുഞ്ഞാടിന്—ഏഴു കുഞ്ഞാടുകൾക്ക്.” ആവർത്തനം ഓരോ കുഞ്ഞാടിനും പത്തിലൊന്ന് എന്ന വിതരണാർഥം നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരു ഏഫയുടെ പത്തിലൊന്നാണ്; ഈ സന്ദർഭത്തിലെ ധാന്യയാഗത്തിന് ഉപയോഗിച്ചിരുന്ന പതിവ് അളവാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതം
  rationale: ആവർത്തിച്ച ഏകവചനപ്രയോഗം ഓരോ കുഞ്ഞാടിനുമുള്ള അളവ് എന്ന വിതരണാർഥം നൽകുന്നു. യാഗധാന്യത്തിന്റെ ഈ അളവ് സന്ദർഭത്തിൽ ഏഫയുടെ പത്തിലൊന്നാണ്; അതിനാൽ വ്യക്തതയ്ക്കായി ‘ഏഫയുടെ’ എന്നു ചേർത്തു.
- source_word: תַּעֲשֶׂה
  choice: നിങ്ങൾ ഒരുക്കണം
  rationale: അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും യാഗനിർദേശത്തിന്റെ സന്ദർഭത്തിൽ ധാന്യയാഗത്തിന്റെ നിശ്ചിത അളവ് ഒരുക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘അർപ്പിക്കണം’ എന്നു പറഞ്ഞാൽ ക്രിയയുടെ അർഥം അനാവശ്യമായി പരിമിതപ്പെടും.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോ കുഞ്ഞാടിനും
  rationale: ആവർത്തിച്ച അളവുപദത്തോടൊപ്പം വരുന്ന ഏകവചനവും സംഖ്യയും ഓരോ മൃഗത്തിനുമുള്ള വിഹിതത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ഏഴു കുഞ്ഞാടുകളിൽ
  rationale: നിർദേശം ഏഴു കുഞ്ഞാടുകളുടെ മുഴുവൻ കൂട്ടത്തിനും ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ഏഴു കുഞ്ഞാടുകളിൽ ഓരോ കുഞ്ഞാടിനും’ എന്ന ഘടന വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
