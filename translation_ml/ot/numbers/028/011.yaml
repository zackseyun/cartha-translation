id: NUM.28.11
reference: Numbers 28:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: ml
  text: 'നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിൽ[a] യഹ്‌വേക്കു ഹോമയാഗം അർപ്പിക്കണം: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് രണ്ടു കാളകൾ, ഒരു ആട്ടുകൊറ്റൻ, ഒരു വയസ്സു പ്രായമുള്ളതും ഊനമില്ലാത്തതുമായ ഏഴ് ആൺകുഞ്ഞാടുകൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിൽ’; അതായത്, അമാവാസി ആചരണങ്ങളുടെ സമയത്ത്.'
    reason: എബ്രായ കാലപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും അതിന്റെ ആചാരപരമായ സൂചനയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിൽ
  rationale: ‘നിങ്ങളുടെ മാസങ്ങളുടെ തലകളിൽ/ആരംഭങ്ങളിൽ’ എന്ന എബ്രായ പ്രയോഗഘടന സംരക്ഷിക്കുന്നു; ഇത് ഓരോ മാസത്തിന്റെയും ആരംഭത്തിലെ അമാവാസി ആചരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: תַּקְרִיבוּ
  choice: അർപ്പിക്കണം
  rationale: ബലിസന്ദർഭത്തിൽ ‘അടുത്തുകൊണ്ടുവരുക’ എന്ന ഹിഫീൽ രൂപത്തിന് യാഗമായി സമർപ്പിക്കുക എന്ന സ്വാഭാവിക അർഥം.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിക്കുന്ന ബലിയുടെ അംഗീകൃതവും വ്യക്തവുമായ മലയാള സാങ്കേതികപദം.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: എബ്രായ ദൈവനാമമായ יהוהയെ നാമരൂപത്തിൽ പ്രതിനിധീകരിക്കുകയും ל എന്ന ദിശ/സമർപ്പണ സൂചകത്തെ ദത്തിവിഭക്തിയാൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: കന്നുകാലിക്കൂട്ടത്തിൽനിന്ന് രണ്ടു കാളകൾ
  rationale: കന്നുകാലിവർഗത്തിൽപ്പെട്ട രണ്ടു ആൺമൃഗങ്ങൾ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അവ ചെറുപ്പമാണെന്ന് മൂലപാഠം നിർബന്ധമായി പറയുന്നില്ല.
- source_word: וְאַיִל אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റൻ
  rationale: ബലിമൃഗമായ പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: ഒരു വയസ്സുള്ള ഏഴ് ആൺകുഞ്ഞാടുകൾ
  rationale: כְּבָשִׂים എന്നതിലെ ആൺലിംഗസൂചനയും ‘ഒരു വർഷത്തിന്റെ മക്കൾ’ എന്ന പ്രായപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: ബലിമൃഗങ്ങൾക്ക് ശാരീരിക വൈകല്യമോ ന്യൂനതയോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന യാഗസന്ദർഭോചിതമായ പദം.
theological_decisions:
- issue: മാസാരംഭത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം
  choice: നിങ്ങളുടെ മാസങ്ങളുടെ ആരംഭങ്ങളിൽ
  alternative: നിങ്ങളുടെ അമാവാസിദിനങ്ങളിൽ
  rationale: മുഖ്യപാഠം എബ്രായ പ്രയോഗത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു; അതിന്റെ ആചാരപരമായ അർഥമായ അമാവാസി ആചരണം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള ഉടമ്പടിനാമത്തെ പൊതുപദവിയാൽ പകരാതെ നാമമായി അവതരിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യാഗസാങ്കേതികപദമായി ‘ഹോമയാഗം’ ഉപയോഗിച്ചു. [a] എന്ന അടിക്കുറിപ്പുചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
