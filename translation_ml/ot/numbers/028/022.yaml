id: NUM.28.22
reference: Numbers 28:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ പാപയാഗമായി ഒരു ആൺകോലാടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപത്തിൽനിന്നുള്ള ശുദ്ധീകരണത്തിനായുള്ള യാഗമായി.’ ‘പാപയാഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം യാഗസന്ദർഭങ്ങളിൽ ‘ശുദ്ധീകരണയാഗം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: ഒരു ആൺകോലാടിനെയും
  rationale: שָׂעִיר ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; וְ മുൻവാക്യത്തിലെ യാഗങ്ങളുടെ പട്ടികയോടുള്ള തുടർച്ചയായതിനാൽ മലയാളത്തിൽ ‘-നെയും’ എന്നു നൽകി.
- source_word: חַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ ഈ പദം അമൂർത്തമായ ‘പാപം’ എന്നതിലുപരി പാപവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ശുദ്ധീകരണയാഗം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗമൃഗത്തിന്റെ എണ്ണം വ്യക്തമാക്കുന്ന സംഖ്യ നേരിട്ട് നിലനിർത്തി.
- source_word: לְ/כַפֵּר
  choice: പ്രായശ്ചിത്തം വരുത്താൻ
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: עֲלֵי/כֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ജനങ്ങളുടെ നന്മയ്ക്കും അവരുടെ പേരിലുമുള്ള യാഗപ്രവർത്തനമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ ‘നിങ്ങൾക്കുവേണ്ടി’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: യാഗസന്ദർഭത്തിലെ כפר എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം വരുത്താൻ
  alternative: നിങ്ങൾക്കുവേണ്ടി പരിഹാരം ചെയ്യാൻ
  rationale: ‘പ്രായശ്ചിത്തം വരുത്തുക’ എബ്രായപദത്തിന്റെ യാഗപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തിന്റെ കൃത്യമായ പ്രവർത്തനരീതി വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- issue: חַטָּאת എന്ന യാഗനാമത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: ‘പാപയാഗം’ പരിചിതവും സന്ദർഭോചിതവുമായ മുഖ്യപരിഭാഷയാണ്; എന്നാൽ പദത്തിന് യാഗസന്ദർഭത്തിൽ ‘ശുദ്ധീകരണയാഗം’ എന്ന വ്യാഖ്യാനവും സാധുവായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ യാഗഭാഷ ഉപയോഗിച്ചു. ഒറ്റവാക്യമായിരുന്നാലും മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ച വ്യക്തമാക്കാൻ ‘-നെയും’ എന്നും നിർദേശസ്വഭാവം വ്യക്തമാക്കാൻ ‘അർപ്പിക്കണം’ എന്നും ചേർത്തു; ഇവ എബ്രായ വാക്യത്തിന്റെ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളപ്പെട്ടവയാണ്.
