  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: ml
  text: ഒന്നാം മാസത്തിൽ, മാസത്തിന്റെ പതിനാലാം ദിവസം യഹ്‌വേക്കുള്ള[a] പെസഹയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹ്‌വേയുടെ.” എബ്രായത്തിലെ ബന്ധകം സമർപ്പണമോ ഉടമസ്ഥബന്ധമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: ഒന്നാം മാസത്തിൽ
  rationale: ആദ്യത്തെ וּ സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല; കാലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: בְּ/אַרְבָּעָה עָשָׂר יוֹם לַ/חֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പതിനാലാം ദിവസം
  rationale: എബ്രായ തീയതിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: פֶּסַח
  choice: പെസഹ
  rationale: യഹൂദരുടെ ഈ ആചരണത്തിനുള്ള മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ പദമാണ്; ‘പെസഹായാഗം’ എന്നു പറഞ്ഞ് ബലിയെ മാത്രം അനാവശ്യമായി നിർദിഷ്ടമാക്കുന്നില്ല.
- source_word: לַ/יהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: לְ എന്ന ബന്ധകത്തിന്റെ സമർപ്പണം, ഉദ്ദേശ്യം, ഉടമസ്ഥബന്ധം എന്നിവ ഉൾക്കൊള്ളാവുന്ന സംക്ഷിപ്തമായ പ്രയോഗം; ദൈവനാമം യഹ്‌വേ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാൽ പകരാതെ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לַיהוָה എന്നതിലെ ബന്ധത്തിന്റെ സ്വഭാവം
  choice: യഹ്‌വേക്കുള്ള
  alternative: യഹ്‌വേയുടെ
  rationale: ഇത് സമർപ്പണമോ ഉദ്ദേശ്യമോ ഉടമസ്ഥബന്ധമോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ ഒരു അർഥം മാത്രം നിർബന്ധിക്കാതെ കാലികമായ മലയാളപ്രയോഗം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കലണ്ടർപ്രഖ്യാപനശൈലി. അടിക്കുറിപ്പ് ബാധകമായ לַיהוָה എന്ന പ്രയോഗത്തിനരികിലാണ് [a] ചേർത്തിരിക്കുന്നത്.
