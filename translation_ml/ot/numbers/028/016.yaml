  terminology: “പെസഹ” is an established Malayalam biblical term and appropriately avoids reducing פֶּסַח to the sacrifice alone. “യഹ്‌വേ” correctly preserves the divine name. “യഹ്‌വേക്കുള്ള” is a defensible main-text rendering of the Hebrew lamed; the note suitably provides the possessive alternative.
