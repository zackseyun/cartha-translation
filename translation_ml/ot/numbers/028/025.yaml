  language: ml
  text: ഏഴാം ദിവസം നിങ്ങൾക്കു വിശുദ്ധ സമ്മേളനം ഉണ്ടായിരിക്കണം[a]; പതിവുള്ള ജോലിയൊന്നും നിങ്ങൾ ചെയ്യരുത്[b].
