lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: ഏഴാം ദിവസം
  rationale: വാവോടുകൂടിയ സമയപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ദിവസത്തിൽ’ എന്നതിനേക്കാൾ ഇവിടെ ‘ദിവസം’ സുതാര്യമാണ്.
- source_word: מִקְרָא קֹדֶשׁ
  choice: വിശുദ്ധ സമ്മേളനം
  rationale: ഔപചാരികമായി വിളിച്ചുകൂട്ടുന്ന വിശുദ്ധസംഗമം എന്ന സ്ഥിരമായ ആരാധനാപര അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִהְיֶה לָכֶם
  choice: നിങ്ങൾക്കു ... ഉണ്ടായിരിക്കണം
  rationale: അക്ഷരാർഥമായ ‘നിങ്ങൾക്കായി ഉണ്ടായിരിക്കും’ എന്ന ഘടനയുടെ നിയമനിർദേശപരമായ ബലം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: പതിവുള്ള ജോലി
  rationale: എല്ലാത്തരം പ്രവർത്തനങ്ങളെയും അല്ല, സാധാരണ തൊഴിൽപരമായ ജോലിയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ‘പതിവുള്ള ജോലി’ ഈ വ്യത്യാസം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: ജോലിയൊന്നും നിങ്ങൾ ചെയ്യരുത്
  rationale: നിഷേധത്തോടുകൂടിയ ‘ഏതൊരു/എല്ലാ ... ചെയ്യരുത്’ എന്ന എബ്രായഘടനയെ സ്വാഭാവികമായ മലയാള നിരോധനവാക്യമായി നൽകുന്നു.
