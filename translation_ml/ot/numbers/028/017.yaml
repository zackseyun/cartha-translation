source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה חָ֑ג שִׁבְעַ֣ת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: ml
  text: ഈ മാസത്തിലെ പതിനഞ്ചാം ദിവസം ഒരു ഉത്സവമാണ്[a]. ഏഴു ദിവസത്തേക്ക് പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പെരുന്നാളാണ്.’ എബ്രായപദമായ חָג വിശുദ്ധമായ ഉത്സവാചരണത്തെയും വിരുന്നോടുകൂടിയ പെരുന്നാളിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר י֛וֹם
  choice: പതിനഞ്ചാം ദിവസം
  rationale: സംയോജകവും സ്ഥാനകാലസൂചകവുമായ ഉപസർഗങ്ങൾ ചേർന്ന ഈ പ്രയോഗം കാലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രമസംഖ്യ ഉപയോഗിക്കുന്നതാണ് സ്വാഭാവികം.
- source_word: לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה
  choice: ഈ മാസം
  rationale: ആരാധനാകലണ്ടറിന്റെ സന്ദർഭത്തിൽ חֹדֶשׁ എന്നതിന് ‘മാസം’ എന്നാണ് സ്വാഭാവിക അർഥം.
- source_word: חָ֑ג
  choice: ഒരു ഉത്സവമാണ്
  rationale: חָג വിശുദ്ധമായ ഉത്സവാചരണത്തെയും വിരുന്നോടുകൂടിയ പെരുന്നാളിനെയും സൂചിപ്പിക്കാം; ആധുനിക മലയാളത്തിൽ ‘ഉത്സവം’ ഈ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: שִׁבְעַ֣ת יָמִ֔ים
  choice: ഏഴു ദിവസം
  rationale: ആചരണത്തിന്റെ കാലദൈർഘ്യം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: מַצּ֖וֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പം
  rationale: מַצּוֹת പുളിപ്പിക്കാത്ത അപ്പത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സുതാര്യമായ മലയാളപ്രയോഗമാണിത്.
- source_word: יֵאָכֵֽל
  choice: ഭക്ഷിക്കണം
  rationale: നിഫാൽ അപൂർണക്രിയയുടെ നിഷ്ക്രിയ നിർദേശാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഭക്ഷിക്കണം’ എന്നു നൽകുന്നു; ആരാണ് ഭക്ഷിക്കേണ്ടതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തത് ഇതിലും നിലനിൽക്കുന്നു.
