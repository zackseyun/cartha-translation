  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד עֹלַ֧ת הַ/תָּמִ֛יד וּ/מִנְחָת֖/וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ לָ/כֶ֖ם וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: ml
  text: പതിവായ ഹോമയാഗത്തിനും[a] അതിന്റെ ധാന്യയാഗത്തിനും പുറമേ, ഇവയും അവയുടെ പാനീയയാഗങ്ങളോടുകൂടെ[c] അർപ്പിക്കണം; അവ നിങ്ങൾക്കായി ദോഷമില്ലാത്തവയായിരിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിരന്തരമായ ഹോമയാഗം’ അല്ലെങ്കിൽ ‘ദൈനംദിന ഹോമയാഗം.’
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘അവ നിങ്ങൾക്കായി ദോഷമില്ലാത്തവയായിരിക്കണം’; അർപ്പിക്കുന്ന മൃഗങ്ങൾക്ക് യാതൊരു ദോഷവും ഉണ്ടായിരിക്കരുതെന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അവയുടെ പാനീയാർപ്പണങ്ങളോടുകൂടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഇവിടെ പറയുന്ന യാഗങ്ങൾ പതിവായ യാഗത്തിനു പകരമായല്ല, അതിനോടു കൂട്ടിച്ചേർക്കേണ്ടവയാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: עֹלַת הַתָּמִיד
  choice: പതിവായ ഹോമയാഗം
  rationale: സ്ഥിരമായി അർപ്പിക്കേണ്ട ദൈനംദിന ഹോമയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പതിവായ’ എന്നത് תָּמִיד എന്ന പദത്തിന്റെ ക്രമമായി തുടരുന്ന സ്വഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּמִנְחָתוֹ
  choice: അതിന്റെ ധാന്യയാഗം
  rationale: പുരോഹിത യാഗനിയമങ്ങളുടെ സന്ദർഭത്തിൽ מִנְחָה ഹോമയാഗത്തോടൊപ്പം അർപ്പിക്കുന്ന ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: תַּעֲשׂוּ
  choice: അർപ്പിക്കണം
  rationale: עשה എന്ന ക്രിയയ്ക്ക് യാഗസന്ദർഭത്തിൽ യാഗം നിർവഹിക്കുക അഥവാ അർപ്പിക്കുക എന്ന അർഥമുണ്ട്; മലയാളത്തിൽ ‘അർപ്പിക്കണം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്തവ
  rationale: യാഗമൃഗങ്ങൾക്ക് ദോഷമോ വൈകല്യമോ ഉണ്ടായിരിക്കരുതെന്ന സാങ്കേതിക യാഗാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: יִהְיוּ לָכֶם
  choice: അവ നിങ്ങൾക്കായി ... ആയിരിക്കണം
  rationale: ഹീബ്രൂവിലെ לָכֶם എന്ന ദത്തിവ് ഒഴിവാക്കാതെ നിലനിർത്തുന്നു; അർപ്പിക്കേണ്ട മൃഗങ്ങളുടെ ഗുണനിലവാരം ജനത്തോടു നിർദേശിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: וְנִסְכֵּיהֶם
  choice: അവയുടെ പാനീയയാഗങ്ങളോടുകൂടി
  rationale: נֶסֶךְ ഒഴിച്ചർപ്പിക്കുന്ന ദ്രവയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാനീയയാഗം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ യാഗപദമാണ്.
theological_decisions:
- issue: יִהְיוּ לָכֶם എന്നതിലെ ദത്തിവിന്റെ നിലനിർത്തൽ
  choice: ‘നിങ്ങൾക്കായി’ എന്നു മുഖ്യവാക്യത്തിൽ നിലനിർത്തി
  alternative: സ്വാഭാവികതയ്ക്കായി ദത്തിവ് ഒഴിവാക്കി ‘അവ ഊനമില്ലാത്തവയായിരിക്കണം’ എന്നു മാത്രം പറയുക
  rationale: ഈ ഘടകം മലയാളത്തിൽ അല്പം ഔപചാരികമായിരുന്നാലും അർഥഗ്രാഹ്യമാണ്; മൂലപാഠത്തിലെ യഥാർഥ ഘടകം മായ്ച്ചുകളയാതിരിക്കാൻ നിലനിർത്തി. ഇതിലൂടെ പ്രത്യേക സമുദായവ്യാഖ്യാനം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗനിയമശൈലി. ‘ഹോമയാഗം,’ ‘ധാന്യയാഗം,’ ‘പാനീയയാഗം’ എന്നീ പരസ്പരം വേർതിരിച്ചറിയാവുന്ന സ്ഥിരതയുള്ള പദങ്ങൾ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ബഹുവചന സൂചനയും ‘നിങ്ങൾക്കായി’ എന്ന ദത്തിവും പരമാവധി സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളുടെ പിന്നാലെ ചേർത്തു.
