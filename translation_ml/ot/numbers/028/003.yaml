  revised_text: 'നീ അവരോടു പറയണം: ‘നിങ്ങൾ യഹ്‌വേക്കു അർപ്പിക്കേണ്ട അഗ്നിയാഗം ഇതാണ്: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകളെ ഓരോ ദിവസവും നിത്യഹോമയാഗമായി അർപ്പിക്കണം.’'
