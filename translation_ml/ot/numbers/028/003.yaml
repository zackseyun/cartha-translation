id: NUM.28.3
reference: Numbers 28:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: ml
  text: 'നീ അവരോടു പറയണം: ‘നിങ്ങൾ യഹ്‌വേക്കു അർപ്പിക്കേണ്ട അഗ്നിയാഗം ഇതാണ്: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകളെ ഓരോ ദിവസവും നിത്യഹോമയാഗമായി അർപ്പിക്കണം.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  rationale: പുരോഹിതനിയമങ്ങളിലെ ഈ പദം അഗ്നിയിലൂടെ അർപ്പിക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികമായും വ്യക്തമായും അറിയിക്കാൻ വിവരണാത്മക രൂപം ഉപയോഗിച്ചു; ‘അഗ്നിവഴിപാട്’ എന്ന ചുരുക്കരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: תַּקְרִיבוּ
  choice: സമർപ്പിക്കേണ്ട / അർപ്പിക്കണം
  rationale: קרב എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം യാഗസന്ദർഭത്തിൽ ദൈവസന്നിധിയിൽ കൊണ്ടുവന്ന് സമർപ്പിക്കുക എന്ന അർത്ഥത്തിലാണ്. മലയാളത്തിലെ ആവർത്തനം ഒഴിവാക്കാതെ വാക്യത്തിന്റെ ആജ്ഞാസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ יהוה ഒരു പൊതുപദവിയായി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כְּבָשִׂים
  choice: ആൺകുഞ്ഞാടുകൾ
  rationale: നാമത്തിന്റെ പുല്ലിംഗരൂപവും യാഗമൃഗങ്ങളുടെ പ്രത്യേകതയും മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സുള്ള
  rationale: ‘ഒരു വർഷത്തിന്റെ മക്കൾ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർത്ഥം.
- source_word: תְמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗനിയമത്തിൽ ശരീരവൈകല്യമോ ന്യൂനതയോ ഇല്ലാത്ത മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പരമ്പരാഗത മലയാള പ്രയോഗം.
- source_word: לַיּוֹם
  choice: ഓരോ ദിവസവും
  rationale: രണ്ട് മൃഗങ്ങൾ വീതം ദിവസേന അർപ്പിക്കണമെന്ന വിതരണാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: മുഴുവനായി ദഹിപ്പിച്ച് അർപ്പിക്കുന്ന യാഗത്തിനുള്ള സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള പദം.
- source_word: תָמִיד
  choice: പതിവായുള്ള
  rationale: ഇവിടെ ഇടവിടാതെയുള്ള ഒരു പ്രവൃത്തി എന്നതിലുപരി ക്രമമായി ആവർത്തിക്കുന്ന നിത്യയാഗക്രമമാണ് ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പേരായിത്തന്നെ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സമുദായത്തിന്റെ പതിവ് രൂപത്തിലേക്ക് പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർത്ഥം
  choice: അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്
  alternative: അഗ്നിവഴിപാട് / ഭോജനവഴിപാട്
  rationale: അഗ്നിയുമായി ബന്ധപ്പെട്ട യാഗം എന്ന മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ആശയം നിലനിർത്തി. ദൈവത്തിനുള്ള ‘ഭോജനം’ എന്ന പുരോഹിതസങ്കൽപ്പം ചില സന്ദർഭങ്ങളിൽ പ്രസക്തമാണെങ്കിലും, ഇവിടെ അതിനെ പ്രധാന പാഠത്തിൽ നിർബന്ധമായി വായിച്ചുകയറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. യാഗസാങ്കേതികതയ്ക്കായി ‘ഹോമയാഗം’ നിലനിർത്തി; അപരിചിതമായ ‘അഗ്നിവഴിപാട്’ പ്രധാന പാഠത്തിൽ വിവരണാത്മകമായി വ്യക്തമാക്കി.
