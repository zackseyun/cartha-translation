revisions:
- from: 'നീ അവരോടു പറയണം: ‘നിങ്ങൾ യഹ്‌വേക്കു സമർപ്പിക്കേണ്ട അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്[a] ഇതാണ്: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകളെ ഓരോ ദിവസവും പതിവായുള്ള ഹോമയാഗമായി അർപ്പിക്കണം.’'
  to: 'നീ അവരോടു പറയണം: ‘നിങ്ങൾ യഹ്‌വേക്കു അർപ്പിക്കേണ്ട അഗ്നിയാഗം ഇതാണ്: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകളെ ഓരോ ദിവസവും നിത്യഹോമയാഗമായി അർപ്പിക്കണം.’'
