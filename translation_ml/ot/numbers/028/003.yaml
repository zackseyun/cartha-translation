    rationale: ‘സമർപ്പിക്കേണ്ട അഗ്നിയിൽ അർപ്പിക്കുന്ന വഴിപാട്’ എന്നതിൽ ഒരേ യാഗക്രിയ രണ്ടുവട്ടം വരുന്നു. മൂലത്തിലെ ഒറ്റ യാഗക്രിയയെ ‘അർപ്പിക്കേണ്ട അഗ്നിയാഗം’ എന്നു സ്വാഭാവികമായി നൽകാം.
