id: NUM.28.12
reference: Numbers 28:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: ml
  text: ഒരു കാളയ്ക്കായി ധാന്യയാഗമായി എണ്ണ ചേർത്തു കലക്കിയ നന്നായി അരിച്ച മാവ് ഒരു ഏഫയുടെ പത്തിലൊന്നിന്റെ മൂന്ന് അളവ്[a], ഒരു ആട്ടുകൊറ്റനായി ധാന്യയാഗമായി എണ്ണ ചേർത്തു കലക്കിയ നന്നായി അരിച്ച മാവ് ഒരു ഏഫയുടെ പത്തിലൊന്നിന്റെ രണ്ട് അളവ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘മൂന്ന് പത്തിലൊന്നുകൾ’ എന്നും ‘രണ്ട് പത്തിലൊന്നുകൾ’ എന്നും ഉണ്ട്; യാഗനിയമങ്ങളുടെ ഈ സന്ദർഭത്തിൽ അവ ഒരു ഏഫയുടെ പത്തിലൊന്നുകൾ എന്ന അളവുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘എണ്ണയിൽ കലക്കിയ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിൽ മൂന്നു ഭാഗവും
  rationale: עֶשְׂרוֹן യാഗനിയമങ്ങളിൽ ഒരു ഏഫയുടെ പത്തിലൊന്ന് എന്ന അളവിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ സംഖ്യ നിലനിർത്തിക്കൊണ്ട് മലയാളവായനക്കാർക്ക് അളവ് വ്യക്തമാക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങൾക്ക് ഉപയോഗിച്ച നന്നായി അരിച്ചോ പൊടിച്ചോ തയ്യാറാക്കിയ മാവിനുള്ള ആരാധനാസംബന്ധമായ പദം; സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ പദം പൊതുവായ കാഴ്ചയെയല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: എണ്ണ ചേർത്തു കലക്കിയ
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയുള്ള തയ്യാറാക്കൽരീതിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; 'എണ്ണയിൽ കലക്കിയ' എന്ന അക്ഷരാർഥപരമായ രൂപത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: ഒരു കാളയ്ക്ക്
  rationale: ഇവിടെയുള്ള הָאֶחָד ക്രമസൂചകമായ 'ഒന്നാമത്തെ' എന്നതല്ല, ഓരോ നിർദിഷ്ട മൃഗത്തിനുള്ള അളവാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ 'ഒരു കാളയ്ക്ക്' സ്വാഭാവികമാണ്.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിൽ രണ്ടു ഭാഗവും
  rationale: עֶשְׂרוֹן എന്ന അളവ് സന്ദർഭത്തിൽ ഒരു ഏഫയുടെ പത്തിലൊന്നായി മനസ്സിലാക്കപ്പെടുന്നതിനാൽ അളവ് വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: לָ/אַיִל הָ/אֶחָד
  choice: ഒരു ആട്ടുകൊറ്റന്
  rationale: കാളയെക്കുറിച്ചുള്ള സമാന്തരപ്രയോഗംപോലെ, ക്രമസൂചക അർഥം ചേർക്കാതെ ഓരോ മൃഗത്തിനുള്ള അളവ് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആരാധനാസംബന്ധമായ ഗൗരവം നിലനിർത്തിയും സാധാരണ വായനക്കാർക്ക് അളവും യാഗരീതിയും വ്യക്തമാകുന്ന വിധത്തിലും പരിഭാഷപ്പെടുത്തി. മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മൂലത്തിലെ നിർദേശക്രിയ മുൻവാക്യസന്ദർഭത്തിൽനിന്ന് ‘അർപ്പിക്കണം’ എന്നു പൂരിപ്പിച്ചു.
