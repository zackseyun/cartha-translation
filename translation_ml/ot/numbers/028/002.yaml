source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ പുത്രന്മാരോട്[a] കൽപ്പിക്ക; അവരോടു പറയുക: ‘എന്റെ വഴിപാട്, എന്റെ അഗ്നിയർപ്പണങ്ങൾക്കുള്ള എന്റെ ആഹാരം, എനിക്കു പ്രസാദകരമായ സൗരഭ്യം[c]—അത് അതിന്റെ നിശ്ചിതസമയത്ത് എനിക്കു അർപ്പിക്കാൻ നിങ്ങൾ ശ്രദ്ധിക്കണം.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേൽജനത്തോട്.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാരോട്’ എന്നാണ്; ഇവിടെ മുഴുവൻ ഇസ്രായേൽസമൂഹത്തെയാണു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘പ്രസാദകരമായ സൗരഭ്യം’ എന്നത് യാഗം ദൈവത്തിനു സ്വീകാര്യമാണെന്നു സൂചിപ്പിക്കുന്ന സ്ഥിരമായ യാഗപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: കല്പിക്കുക
  rationale: צוה എന്ന ക്രിയയുടെ ആജ്ഞാശക്തി നിലനിർത്തുന്നു; ‘അറിയിക്കുക’ അല്ലെങ്കിൽ ‘ഉപദേശിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ നിർദേശം സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ബഹുവചനരൂപം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇത് ഇസ്രായേൽജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: അവരോടു പറയുക
  rationale: എബ്രായ വാക്യക്രമത്തിന്റെ നേരിട്ടുള്ള സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: קָרְבָּנִי
  choice: എന്റെ വഴിപാട്
  rationale: ദൈവസന്നിധിയിലേക്കു കൊണ്ടുവരുന്ന യാഗദാനത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ ബലിയർപ്പണപദമാണ്; ‘വഴിപാട്’ മലയാളത്തിൽ വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: לַחְמִי
  choice: എന്റെ ആഹാരം
  rationale: അക്ഷരാർഥമായ ‘എന്റെ അപ്പം’ എന്നതിനെക്കാൾ യാഗസന്ദർഭത്തിലെ വിശാലമായ ആഹാരസങ്കൽപ്പം നൽകുന്നു; മൂലത്തിലെ സാക്ഷാത്കാരപരമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: לְאִשַּׁי
  choice: എന്റെ അഗ്നിയർപ്പണങ്ങൾക്കുള്ള
  rationale: אִשֶּׁה യാഗപീഠത്തിലെ അഗ്നിയിൽ അർപ്പിക്കപ്പെടുന്ന യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘അഗ്നിയർപ്പണം’ പ്രത്യേകമായ ‘ദഹനയാഗം’ എന്ന യാഗവർഗത്തിലേക്ക് അർഥം ചുരുക്കാതെ അഗ്നിസംബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: רֵיחַ נִיחֹחִי
  choice: എനിക്കു പ്രസാദകരമായ സൗരഭ്യം
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: תִּשְׁמְרוּ
  choice: നിങ്ങൾ ശ്രദ്ധിക്കണം
  rationale: തുടർന്നുള്ള ‘അർപ്പിക്കാൻ’ എന്ന ക്രിയയോടൊപ്പം, കൃത്യമായി പാലിക്കുകയും ജാഗ്രതയോടെ നിർവഹിക്കുകയും ചെയ്യുക എന്ന שמר-ന്റെ പ്രായോഗിക ശക്തി നൽകുന്നു.
- source_word: לְהַקְרִיב לִי
  choice: എനിക്ക് അർപ്പിക്കാൻ
  rationale: യാഗസന്ദർഭത്തിൽ הקריב എന്നത് ദൈവസന്നിധിയിൽ സമർപ്പിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ‘അർപ്പിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: בְּמוֹעֲדוֹ
  choice: അതിന്റെ നിശ്ചിതസമയത്ത്
  rationale: מועד നിശ്ചയിക്കപ്പെട്ട സമയം അല്ലെങ്കിൽ അവസരം സൂചിപ്പിക്കുന്നു; ഏകവചന പ്രത്യയം വഴിപാടിനെയോ യാഗക്രമത്തെയോ കൂട്ടമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ ആഹാരം’, ‘എനിക്കു പ്രസാദകരമായ സൗരഭ്യം’ എന്നീ മനുഷ്യരൂപക യാഗപ്രയോഗങ്ങൾ
  choice: മൂലത്തിലെ സാക്ഷാത്കാരപരമായ ഉടമ്പടി-യാഗഭാഷ നിലനിർത്തി
  alternative: ‘എനിക്കു സ്വീകാര്യമായ വഴിപാടുകൾ’ എന്ന വ്യാഖ്യാനപരമായ സംഗ്രഹം
  rationale: എബ്രായം യാഗാരാധനയുടെ മൂർത്തമായ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ അമൂർത്തമാക്കാതെ നിലനിർത്തുന്നത് ദൈവത്തിനു അക്ഷരാർഥത്തിൽ പോഷണം ആവശ്യമാണെന്ന ധാരണ നിർബന്ധിക്കാതെ തന്നെ പാഠത്തിന്റെ രൂപവും ദൈവസ്വീകാര്യതയുടെ ആശയവും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹസൂചനയിലെ ലിംഗരൂപം
  choice: ഇസ്രായേലിന്റെ പുത്രന്മാർ
  alternative: ഇസ്രായേൽജനം / ഇസ്രായേൽമക്കൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗരൂപം പ്രധാനവാചകത്തിൽ ദൃശ്യമാക്കുന്നു; അതേസമയം ഇത് ഉടമ്പടിജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നതാണെന്ന് പാദക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അഗ്നിയർപ്പണം’ മൂലപദത്തിന്റെ യാഗപീഠ-അഗ്നിസംബന്ധം നിലനിർത്തുകയും ‘ദഹനയാഗം’ എന്ന പ്രത്യേക യാഗവർഗവുമായി തെറ്റായി ഒതുക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു. മുഖ്യവാക്യത്തിലെ സമാനാധികരണ പദശ്രേണി ദീർഘരേഖകൊണ്ട് വായനാസൗകര്യത്തോടെ വേർതിരിച്ചിട്ടുണ്ട്.
