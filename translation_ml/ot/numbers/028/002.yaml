revisions:
- from: 'ഇസ്രായേലിന്റെ പുത്രന്മാരോട്[a] കല്പിച്ച് അവരോടു പറയുക: ‘എന്റെ വഴിപാട്, എന്റെ അഗ്നിയർപ്പണങ്ങൾക്കുള്ള[b] എന്റെ ആഹാരം, എനിക്കു പ്രസാദകരമായ സൗരഭ്യം[c]—അത് അതിന്റെ നിശ്ചിതസമയത്ത് എനിക്ക് അർപ്പിക്കാൻ നിങ്ങൾ ശ്രദ്ധിക്കണം.’'
  to: 'ഇസ്രായേലിന്റെ പുത്രന്മാരോട്[a] കൽപ്പിക്ക; അവരോടു പറയുക: ‘എന്റെ വഴിപാട്, എന്റെ അഗ്നിയർപ്പണങ്ങൾക്കുള്ള എന്റെ ആഹാരം, എനിക്കു പ്രസാദകരമായ സൗരഭ്യം[c]—അത് അതിന്റെ നിശ്ചിതസമയത്ത് എനിക്കു അർപ്പിക്കാൻ നിങ്ങൾ ശ്രദ്ധിക്കണം.’'
  rationale: The revision is limited to changing the opening from a participial construction to two direct imperatives, matching the Hebrew syntax and directive force. No theological interpretation or change to the sacrificial terminology has been introduced. Footnote b is retained in the complete footnote set even though its anchor is not repeated in the main text, because it documents the stated lexical alternative for the fire-offering expression.
