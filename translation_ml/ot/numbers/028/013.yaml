revisions:
- from: ഓരോ ആട്ടിൻകുട്ടിക്കും എണ്ണ ചേർത്ത നേർത്ത മാവ് ഏഫയുടെ പത്തിലൊന്ന് ധാന്യയാഗമായി അർപ്പിക്കണം; അത് യഹ്‌വേക്കുള്ള ഹോമയാഗവും പ്രസാദകരമായ സൗരഭ്യമുള്ള തീയിൽ അർപ്പിക്കുന്ന യാഗവും[a] ആയിരിക്കണം.
  to: ഓരോ ആട്ടിൻകുട്ടിക്കും, എണ്ണ ചേർത്ത ഏഫയുടെ പത്തിലൊന്ന് നന്നായി പൊടിച്ച മാവ് ധാന്യയാഗമായി അർപ്പിക്കണം; ഇത് യഹ്‌വേക്കുള്ള ഹോമയാഗം, പ്രസാദകരമായ സൗരഭ്യം, തീയിൽ അർപ്പിക്കുന്ന യാഗം[a] ആകുന്നു.
  rationale: The revision keeps the source’s distributive measure and sacrificial terminology while making the concluding Hebrew appositional formula explicit and idiomatic in Malayalam. It also clarifies fine flour and refines the lexical-alternative footnote without resolving the disputed sense of אִשֶּׁה beyond what the source permits.
