id: NUM.28.13
reference: Numbers 28:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: ml
  text: ഓരോ ആട്ടിൻകുട്ടിക്കും, എണ്ണ ചേർത്ത ഏഫയുടെ പത്തിലൊന്ന് നന്നായി പൊടിച്ച മാവ് ധാന്യയാഗമായി അർപ്പിക്കണം; ഇത് യഹ്‌വേക്കുള്ള ഹോമയാഗം, പ്രസാദകരമായ സൗരഭ്യം, തീയിൽ അർപ്പിക്കുന്ന യാഗം[a] ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണവഴിപാട്.”
    reason: אִשֶּׁה എന്ന ഹീബ്രുപദം സാധാരണയായി ‘തീയിൽ അർപ്പിക്കുന്ന യാഗം’ എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു; ‘ഭക്ഷണവഴിപാട്’ എന്നത് രേഖപ്പെടുത്താവുന്ന ഒരു ബദൽ അർഥമാണ്.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: ഏഫയുടെ പത്തിലൊന്ന്
  rationale: ആവർത്തിച്ചിരിക്കുന്ന അളവുപദം ഓരോ ആട്ടിൻകുട്ടിക്കും പ്രത്യേകം ഏഫയുടെ പത്തിലൊന്ന് എന്ന വിതരണാർഥം നൽകുന്നു. മലയാളവായനക്കാർക്ക് അളവ് വ്യക്തമാക്കാൻ ‘ഏഫയുടെ’ എന്നു ചേർത്തു.
- source_word: סֹלֶת
  choice: നേർത്ത മാവ്
  rationale: യാഗങ്ങളിൽ ഉപയോഗിച്ച ശുദ്ധീകരിച്ച, സൂക്ഷ്മമായി പൊടിച്ച മാവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ഈ യാഗസന്ദർഭത്തിൽ പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള പ്രത്യേക യാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּלוּלָה בַּשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയ നിലയെ ലളിതവും സ്വാഭാവികവുമായി പറയുന്നു.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോ ആട്ടിൻകുട്ടിക്കും
  rationale: ഹീബ്രുവിലെ വിതരണാർഥം നിലനിർത്തുകയും ആകെ ഒരൊറ്റ ആട്ടിൻകുട്ടിയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: עֹלָה
  choice: ഹോമയാഗം
  rationale: പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള മലയാള ബൈബിൾപരമ്പരയിലെ പരിചിതമായ സാങ്കേതികപദം.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സൗരഭ്യം
  rationale: യാഗം ദൈവത്തിനു സ്വീകാര്യമാണെന്ന ആശയം മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: אִשֶּׁה
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  rationale: പദത്തിന്റെ അഗ്നിസംബന്ധിയായ യാഗാർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘ഭോജനയാഗം’ എന്ന സാദ്ധ്യമായ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കുള്ള
  rationale: ഹീബ്രു ദൈവനാമം ഒരു പൊതുപദവിയായി മാറ്റാതെ ഉടമ്പടിനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമത്തെ പദവിയാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ ഉച്ചാരണസമീപമായ രൂപം ഉപയോഗിക്കുന്നു.
- issue: אִשֶּׁה എന്ന യാഗപദത്തിന്റെ അർഥം
  choice: തീയിൽ അർപ്പിക്കുന്ന യാഗം
  alternative: ഭോജനയാഗം
  rationale: പദത്തിന്റെ കൃത്യമായ വ്യുത്പത്തിയും വ്യാപ്തിയും ചർച്ചാവിഷയമായതിനാൽ പ്രധാനപാഠത്തിൽ അഗ്നിസംബന്ധിയായ പരമ്പരാഗത അർഥം നൽകി, മറ്റൊരു പ്രധാന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ധാന്യയാഗം’, ‘ഹോമയാഗം’ എന്നീ പരിചിതമായ യാഗപദങ്ങൾ നിലനിർത്തി; അളവുപദമായ ‘ഏഫ’ സംരക്ഷിച്ചു. ഹീബ്രുവിലെ തുടർച്ചാസ്വഭാവം അർധവിരാമത്തിലൂടെ വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
