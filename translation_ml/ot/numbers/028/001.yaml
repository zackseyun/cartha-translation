reference: Numbers 28:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ[a] മോശെയോടു ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’ (יהוה); ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.'
    reason: മൂലപാഠത്തിലെ ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പ്രചാരത്തിലുള്ള ബദൽ ലിപ്യന്തരവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം സംസാരിക്കുന്നതായി പറയുന്ന ഈ ഔപചാരിക വിവരണസൂത്രത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം; തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന לֵאמֹר എന്ന ഘടകവും ഇതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ രൂപത്തിൽ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ സംയുക്തരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്ന വാക്യസൂത്രത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഹീബ്രായയിൽ നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന പതിവ് ഘടകമാണിത്. മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു വേർതിരിക്കുന്നത് കൃത്രിമമായതിനാൽ, തുടർന്നുള്ള വചനത്തിലേക്കു നയിക്കുന്ന കോളനോടുകൂടിയ ‘അരുളിച്ചെയ്തു’ എന്ന രൂപത്തിൽ അതിന്റെ പ്രവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ; കർത്താവ്
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ചതുരക്ഷര ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ വ്യക്തിനാമമായി നിലനിർത്തി; സാധാരണ മലയാളവായനക്കാർക്ക് ഏറ്റവും പരിചിതമായ ‘യഹോവ’ എന്ന രൂപം തെരഞ്ഞെടുത്തു. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ മറ്റൊരു പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ബൈബിൾ വിവരണശൈലി. ഹീബ്രായത്തിലെ ഇരട്ട ‘സംസാരിച്ചു—പറഞ്ഞുകൊണ്ട്’ ഘടന മലയാളത്തിൽ അസ്വാഭാവികമായി ആവർത്തിക്കാതെ, അടുത്ത വചനത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തെ സൂചിപ്പിക്കുന്ന കോളൻ ഉപയോഗിച്ചു.
