id: NUM.28.28
reference: Numbers 28:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: ml
  text: 'അവയ്ക്കുള്ള ധാന്യയാഗം എണ്ണ ചേർത്തു കലക്കിയ നേർത്ത മാവായിരിക്കണം: ആ ഒരു കാളയ്ക്ക് ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവുകളും[a], ആ ഒരു ആട്ടുകൊറ്റന് ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവുകളും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ “മൂന്ന് പത്തിലൊന്ന് അളവുകൾ” എന്നും “രണ്ട് പത്തിലൊന്ന് അളവുകൾ” എന്നും ആണ്; ഈ യാഗസന്ദർഭത്തിൽ ഇവ സാധാരണയായി ഒരു ഏഫയുടെ പത്തിലൊന്നുകൾ എന്നാണ് മനസ്സിലാക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗമായി ... അർപ്പിക്കണം
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെ സൂചിപ്പിക്കുന്നു. ഹീബ്രുവിലെ ക്രിയാരഹിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ വിധിനിർദേശമായി അവതരിപ്പിച്ചു.
- source_word: סֹלֶת
  choice: നേർത്ത മാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിക്കുന്ന നന്നായി അരിച്ച ഉന്നതഗുണമുള്ള മാവാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്ന പദപ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്തു കലക്കിയ
  rationale: എണ്ണയുമായി കലർത്തിയ മാവ് എന്ന ആചാരപരമായ തയ്യാറാക്കൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്നു ഭാഗം
  rationale: עֶשְׂרוֹן ഒരു പത്തിലൊന്ന് അളവാണ്; ഈ യാഗനിയമസന്ദർഭത്തിൽ അത് ഏഫയുടെ പത്തിലൊന്നായി മനസ്സിലാക്കപ്പെടുന്നു. അളവ് വായനക്കാരന് വ്യക്തമാകാൻ വാചകത്തിലും കുറിപ്പിലും സൂചിപ്പിച്ചു.
- source_word: לַפָּר הָאֶחָד
  choice: ഓരോ കാളയ്ക്കും
  rationale: הָאֶחָד വിതരണാത്മകമായി ഓരോന്നിനും വേണ്ട അളവ് നിർദേശിക്കുന്നു; മലയാളത്തിൽ 'ഓരോ കാളയ്ക്കും' എന്നത് അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ടു ഭാഗം
  rationale: രണ്ട് പത്തിലൊന്ന് അളവുകൾ എന്ന മൂലപാഠരൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לָאַיִל הָאֶחָד
  choice: ആട്ടുകൊറ്റന്
  rationale: אַיִל പ്രായപൂർത്തിയായ ആൺചെമ്മരിയാടായ 'ആട്ടുകൊറ്റൻ' ആണ്. നിർദേശത്തിലുള്ള ഏക ആട്ടുകൊറ്റനെ മലയാളത്തിൽ സ്വാഭാവികമായി പരാമർശിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. യാഗനിയമത്തിന്റെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് വിതരണാത്മകമായ അർത്ഥം സ്വാഭാവികമാക്കി.
