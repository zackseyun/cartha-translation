- from: 'അവയ്ക്കുള്ള ധാന്യയാഗമായി എണ്ണ ചേർത്തു കലക്കിയ നേർത്ത മാവ് അർപ്പിക്കണം: ഓരോ കാളയ്ക്കും ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്നു ഭാഗവും[a] ആട്ടുകൊറ്റന് ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ടു ഭാഗവും.'
  to: 'അവയ്ക്കുള്ള ധാന്യയാഗം എണ്ണ ചേർത്തു കലക്കിയ നേർത്ത മാവായിരിക്കണം: ആ ഒരു കാളയ്ക്ക് ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവുകളും[a], ആ ഒരു ആട്ടുകൊറ്റന് ഒരു ഏഫയുടെ പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവുകളും.'
  rationale: The revision preserves the source's parallel singular references to the bull and ram, avoids adding an explicit offering action where the Hebrew gives a nominal prescription, and expresses the plural tenth-measures as measurements rather than generic portions. The footnote retains the source-form wording and notes the customary ephah interpretation.
