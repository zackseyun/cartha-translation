  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: ml
  text: അവയ്ക്കുള്ള ധാന്യയാഗം എണ്ണ ചേർത്ത നന്നായി പൊടിച്ച മാവായിരിക്കണം; കാളയ്ക്കു പത്തിലൊന്ന് വീതമുള്ള മൂന്ന് അളവും[a] ആട്ടുകൊറ്റന് പത്തിലൊന്ന് വീതമുള്ള രണ്ട് അളവും നിങ്ങൾ ഒരുക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “പത്തിലൊന്ന്” എഫാ എന്ന ഉണങ്ങിയ വസ്തുക്കളുടെ അളവിന്റെ പത്തിലൊന്നിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ കാളയ്ക്കു അത്തരം മൂന്ന് അളവും ആട്ടുകൊറ്റന് രണ്ട് അളവും വേണം.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: അവയ്ക്കുള്ള ധാന്യയാഗമായി
  rationale: യാഗസന്ദർഭത്തിൽ מִנְחָה ധാന്യയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ബഹുവചന പ്രത്യയം മുമ്പു പറഞ്ഞ യാഗമൃഗങ്ങളെ കൂട്ടമായി പരാമർശിക്കുന്നു.
- source_word: סֹלֶת
  choice: നേരിയ മാവ്
  rationale: യാഗങ്ങൾക്ക് ഉപയോഗിച്ച നന്നായി പൊടിച്ച മാവിനെ സൂചിപ്പിക്കുന്ന പദമായതിനാൽ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: എണ്ണയുമായി കലർത്തി തയ്യാറാക്കിയ മാവെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: മൂന്നുപത്തിൽ ഭാഗം
  rationale: എഫായുടെ പത്തിലൊന്നു വീതമുള്ള മൂന്ന് അളവുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ സംക്ഷിപ്ത അളവുപ്രയോഗം നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: לַפָּר
  choice: കാളയ്ക്ക്
  rationale: നിർദേശത്തിൽ മുമ്പ് പറഞ്ഞ നിർദിഷ്ട കാളയെയാണ് ഏകവചനവും നിർദേശക ഘടനയും സൂചിപ്പിക്കുന്നത്.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: രണ്ടുപത്തിൽ ഭാഗം
  rationale: അതേ അളവുപദത്തിന്റെ സമാന്തരപ്രയോഗം മലയാളത്തിലും സ്ഥിരതയോടെ നിലനിർത്തുന്നു.
- source_word: לָאַיִל
  choice: ആട്ടുകൊറ്റന്
  rationale: യാഗക്രമത്തിൽ പറഞ്ഞ ആൺചെമ്മരിയാടിനെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ ഒരുക്കണം
  rationale: עשה എന്ന വിശാലമായ ക്രിയയ്ക്ക് ഈ യാഗനിർദേശസന്ദർഭത്തിൽ 'ഒരുക്കുക' സ്വാഭാവികമാണ്; മൂലത്തിൽ ഇല്ലാത്ത 'അർപ്പിക്കുക' എന്ന പ്രത്യേകത ഈ ക്രിയയിൽ ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാഗനിയമശൈലി ഉപയോഗിച്ചു. അളവുപദങ്ങളുടെ ഹീബ്രു സംക്ഷിപ്തത മുഖ്യവാചകത്തിൽ നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിലാക്കി.
