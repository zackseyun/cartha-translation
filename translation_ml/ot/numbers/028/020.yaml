- from: 'അവയ്ക്കുള്ള ധാന്യയാഗമായി എണ്ണ ചേർത്ത നേരിയ മാവ് അർപ്പിക്കണം: കാളയ്ക്കു മൂന്നുപത്തിൽ ഭാഗവും[a] ആട്ടുകൊറ്റന് രണ്ടുപത്തിൽ ഭാഗവും നിങ്ങൾ ഒരുക്കണം.'
