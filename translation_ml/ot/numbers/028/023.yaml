  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: ml
  text: പതിവായ പ്രഭാതഹോമയാഗത്തിനു പുറമേ ഇവയും അർപ്പിക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: പുറമേ
  rationale: ഉത്സവയാഗങ്ങൾ പതിവായ യാഗത്തിനു അധികമായി അർപ്പിക്കണമെന്ന ബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: പതിവായ പ്രഭാതഹോമയാഗം
  rationale: ബന്ധവാക്യം പ്രഭാതഹോമയാഗത്തെ നിരന്തരമായി അർപ്പിക്കുന്ന പതിവുയാഗമായി തിരിച്ചറിയിക്കുന്നു; ഒരു യാഗം മറ്റൊന്നിനുവേണ്ടി അർപ്പിക്കുന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: അർപ്പിക്കണം
  rationale: യാഗനിർദേശത്തിന്റെ സന്ദർഭത്തിൽ ‘ചെയ്യുക’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ ക്രിയയാണ് ‘അർപ്പിക്കുക’.
- source_word: אֶת אֵלֶּה
  choice: ഇവയും
  rationale: സർവനാമം മുമ്പ് നിർദേശിച്ച യാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘യും’ അധികമായി അർപ്പിക്കണമെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions: []
