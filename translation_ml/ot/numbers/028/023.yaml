  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാഗപരിഭാഷ ഉപയോഗിച്ചു. ‘ഹോമയാഗം’ עֹלָה എന്ന സമ്പൂർണമായി ദഹിപ്പിക്കുന്ന യാഗത്തിനുള്ള പരിചിതമായ ബൈബിൾപദമായി നിലനിർത്തി.
