  yaml_path: translation/ot/numbers/028/030.yaml
  text: and one male goat to make atonement for you[a].
translation:
  language: ml
  text: ഒരു ആൺകോലാട്, നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഇത് അപൂർണരൂപത്തിലുള്ള ഒരു വാക്യഖണ്ഡമാണ്: “ഒരു ആൺകോലാട്, നിങ്ങൾക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യാൻ.” അടുത്തുള്ള യാഗസന്ദർഭത്തിൽനിന്ന് ഇതിനെ പാപയാഗവുമായി ബന്ധപ്പെടുത്തി മനസ്സിലാക്കാം; എന്നാൽ ഈ വാക്യത്തിൽ “പാപയാഗം” എന്ന പദം വ്യക്തമാക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ഒരു ആൺകോലാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ സംയുക്തപദം ആൺകോലാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: ഒരൊറ്റ മൃഗം എന്ന സംഖ്യാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: לְכַפֵּר
  choice: പ്രായശ്ചിത്തം ചെയ്യാൻ
  rationale: പുരോഹിതയാഗസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ആരാധനാക്രമപരമായ അർഥം നിലനിർത്തുന്നു; പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: עֲלֵיכֶם
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: כפר എന്ന ക്രിയയോടൊപ്പം വരുമ്പോൾ ആരുടെ നിമിത്തമാണ് പ്രായശ്ചിത്തം ചെയ്യുന്നതെന്ന് സൂചിപ്പിക്കുന്ന ഗുണഭോക്തൃാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: '[implied offering action]'
  choice: അർപ്പിക്കണം
  rationale: വാക്യം യാഗങ്ങളുടെ പട്ടികയുടെ ഭാഗമായതിനാൽ മലയാളത്തിൽ പൂർണമായ നിർദേശവാക്യമാക്കാൻ സന്ദർഭത്തിൽനിന്ന് അർപ്പണക്രിയ വ്യക്തമാക്കുന്നു; എന്നാൽ എബ്രായത്തിൽ ഇല്ലാത്ത ‘പാപയാഗമായി’ എന്ന വിഭാഗം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: എബ്രായത്തിൽ തുറന്നുപറയാത്ത യാഗവിഭാഗം പൂരിപ്പിക്കണമോ
  choice: ‘പാപയാഗമായി’ എന്നു മുഖ്യവാചകത്തിൽ ചേർക്കാതെ എബ്രായത്തിലെ ദീർഘവൃത്തത നിലനിർത്തുക
  alternative: ‘പാപയാഗമായി ഒരു ആൺകോലാടിനെയും’ എന്നു സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കുക
  rationale: അടുത്തുള്ള യാഗസന്ദർഭം ആ വിഭാഗത്തെ സൂചിപ്പിച്ചേക്കുമെങ്കിലും ഈ വാക്യഖണ്ഡത്തിൽ חטאת ഇല്ല. അതിനാൽ മൂലപാഠത്തിന്റെ യഥാർഥ ദീർഘവൃത്തതയും വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തി, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആരാധനാക്രമപരമായ ഭാഷ. മൂലപാഠത്തിന്റെ ദീർഘവൃത്തത മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; അർഥസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
