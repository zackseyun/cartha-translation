revisions:
- from: പാപയാഗമായി ഒരു ആൺകോലാടിനെ യഹ്‌വേക്കു അർപ്പിക്കണം. നിരന്തരഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ ഇതും അർപ്പിക്കണം.[a]
  to: യഹ്‌വേക്കു പാപയാഗമായി ഒരു ആൺകോലാടിനെ നിരന്തരമായ ഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ അർപ്പിക്കണം.[a]
