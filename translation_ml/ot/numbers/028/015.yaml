  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: ml
  text: യഹ്‌വേക്കു പാപയാഗമായി ഒരു ആൺകോലാടിനെ നിരന്തരമായ ഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ അർപ്പിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശുദ്ധീകരണയാഗമായി.” എബ്രായപദമായ חַטָּאת പാപത്തോടൊപ്പം അശുദ്ധിയും നീക്കുന്ന യാഗത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ആൺകോലാട്
  rationale: യാഗസന്ദർഭത്തിൽ ഈ സംയുക്തപദം ആൺലിംഗം വ്യക്തമാക്കിയ കോലാടിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: אֶחָד
  choice: ഒരു
  rationale: യാഗത്തിനുള്ള മൃഗങ്ങളുടെ എണ്ണം വ്യക്തമാക്കുന്ന എബ്രായ സംഖ്യാവാചകം നിലനിർത്തുന്നു.
- source_word: לְחַטָּאת
  choice: പാപയാഗമായി
  rationale: യാഗനിയമങ്ങളിൽ חַטָּאת എന്നത് സാധാരണയായി പാപവുമായി അഥവാ ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട യാഗത്തെ സൂചിപ്പിക്കുന്നു; പരിചിതമായ മുഖ്യവിവർത്തനം ഉപയോഗിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: വാചകത്തിലുള്ള ദൈവനാമം വ്യക്തിനാമമായിത്തന്നെ നിലനിർത്തുകയും യാഗത്തിന്റെ സമർപ്പണലക്ഷ്യം ദാതിവ് രൂപത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: עַל
  choice: പുറമേ
  rationale: ഈ യാഗസന്ദർഭത്തിൽ സ്ഥലം സൂചിപ്പിക്കുന്ന ‘മേൽ’ എന്നതിലുപരി, പതിവുയാഗത്തോടു ചേർന്നുള്ള അധികയാഗം എന്ന ബന്ധമാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: עֹלַת הַתָּמִיד
  choice: നിരന്തരഹോമയാഗം
  rationale: תָּמִיד സൂചിപ്പിക്കുന്ന ക്രമമായി തുടരുന്ന നിശ്ചിത യാഗത്തിന്റെ സ്ഥാപനപരമായ അർഥം നിലനിർത്തുന്നു; വാചകത്തിൽ ഇല്ലാത്ത ‘ദിവസേന’ എന്ന പ്രത്യേകീകരണം ഒഴിവാക്കുന്നു.
- source_word: יֵעָשֶׂה
  choice: അർപ്പിക്കണം
  rationale: അക്ഷരാർഥം ‘ചെയ്യപ്പെടണം’ എന്നാണെങ്കിലും, യാഗസന്ദർഭത്തിൽ സ്വാഭാവികവും അർഥസൂചകവുമായ മലയാളക്രിയ ‘അർപ്പിക്കുക’ ആണ്.
- source_word: וְנִסְכּוֹ
  choice: അതിന്റെ പാനീയയാഗം
  rationale: നിശ്ചിത യാഗത്തോടൊപ്പം ഒഴിച്ചർപ്പിക്കുന്ന നിവേദ്യത്തെ പൊതുവായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: യാഗസന്ദർഭത്തിലെ חַטָּאת എന്ന പദത്തിന്റെ അർഥം
  choice: പാപയാഗം
  alternative: ശുദ്ധീകരണയാഗം
  rationale: പരിചിതമായ ‘പാപയാഗം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ ഈ യാഗം അശുദ്ധി നീക്കുന്നതിനെയും സൂചിപ്പിക്കാമെന്ന യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായവാക്യത്തിലെ ഏക ക്രിയയുടെ പരിധി മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി; യാഗം പതിവുഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേയാണെന്ന ബന്ധം മാറ്റമില്ലാതെ നിലനിർത്തി.
