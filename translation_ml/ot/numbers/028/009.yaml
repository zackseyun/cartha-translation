  - severity: medium
    issue: The measure wording ‘രണ്ടുപത്തിലൊന്ന് ഏഫാ’ is potentially opaque.
    rationale: Placing ‘ഏഫാ’ after the compressed fraction can hinder parsing. ‘ഏഫായുടെ രണ്ടുപത്തിലൊന്ന്’ clearly expresses two tenths of an ephah without changing the source measure.
