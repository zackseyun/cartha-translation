source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: ml
  text: 'ശബ്ബത്തുനാളിലും: ഒരു വയസ്സുള്ള, ഊനമില്ലാത്ത രണ്ട് ആൺകുഞ്ഞാടുകൾ; ധാന്യയാഗമായി എണ്ണ ചേർത്ത ഏഫായുടെ രണ്ടുപത്തിലൊന്ന് നേർമാവ്[a]; അതിന്റെ പാനീയയാഗവും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘രണ്ട് പത്തിലൊന്ന്’; യാഗനിയമങ്ങളിൽ ഇത് ഏഫായുടെ രണ്ടുപത്തിലൊന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘അതിന്റെ ദ്രവാർപ്പണവും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: ശബ്ബത്തുനാളിൽ
  rationale: ശബ്ബത്തിലെ അധികയാഗത്തെ പരിചയപ്പെടുത്തുന്ന കാലസൂചനയാണിത്. മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു; വാക്യത്തിന്റെ തുടർച്ച പട്ടികാസ്വഭാവമുള്ള ഘടനയിലൂടെ നിലനിർത്തി.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: ഒരു വയസ്സു പ്രായമുള്ള രണ്ട് ആൺകുഞ്ഞാടുകൾ
  rationale: כְבָשִׂים യാഗസന്ദർഭത്തിൽ കുഞ്ഞാടുകളെ സൂചിപ്പിക്കുന്നു; രൂപം പുല്ലിംഗമായതിനാൽ ‘ആൺ’ എന്നു വ്യക്തമാക്കി. ബְּנֵי שָׁנָה എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രായസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: תְּמִימִם
  choice: ഊനമില്ലാത്ത
  rationale: യാഗമൃഗങ്ങൾക്ക് ശാരീരിക ന്യൂനതയോ കളങ്കമോ ഇല്ലാത്ത അവസ്ഥയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: രണ്ടുപത്തിലൊന്ന് ഏഫാ
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ട് പത്തിലൊന്ന്’ എന്നാണ്; യാഗനിയമങ്ങളിൽ അളവിന്റെ അടിസ്ഥാനഘടകം ഏഫാ ആണെന്നത് വ്യക്തമാക്കി.
- source_word: סֹלֶת
  choice: നേർമാവ്
  rationale: യാഗത്തിനായി ഉപയോഗിച്ച നന്നായി അരച്ച, മേന്മയുള്ള മാവിനെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളപദം.
- source_word: מִנְחָה
  choice: ധാന്യയാഗം
  rationale: ഈ പുരോഹിതനിയമസന്ദർഭത്തിൽ പൊതുവായ വഴിപാടല്ല, ധാന്യത്തിൽനിന്നുള്ള യാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: എണ്ണ ചേർത്ത
  rationale: മാവ് എണ്ണയുമായി കലർത്തിയതാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: וְנִסְכּוֹ
  choice: അതിന്റെ പാനീയയാഗവും
  rationale: נֶסֶךְ യാഗത്തോടൊപ്പം ഒഴിക്കുന്ന ദ്രവാർപ്പണമാണ്; ഏകവചന പ്രത്യയം ‘അതിന്റെ’ എന്നു നിലനിർത്തി.
