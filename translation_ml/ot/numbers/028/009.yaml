translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള യാഗനിയമശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ ക്രിയയില്ലാത്ത പട്ടികാസ്വഭാവം കോളനും അർധവിരാമങ്ങളും ഉപയോഗിച്ച് സംരക്ഷിച്ചു; സന്ദർഭത്തിൽനിന്ന് മാത്രം മനസ്സിലാകുന്ന ‘അർപ്പിക്കണം’ എന്ന ക്രിയ പാഠത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
