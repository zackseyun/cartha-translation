revisions:
- from: 'ഇവപോലെതന്നെ ഏഴു ദിവസവും ഓരോ ദിവസവും നിങ്ങൾ അർപ്പിക്കണം: യഹ്‌വേക്കു പ്രസാദകരമായ സുഗന്ധമായി തീയിൽ അർപ്പിക്കുന്ന ഭോജനം[a]. നിരന്തരഹോമയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ ഇത് അർപ്പിക്കണം.'
  to: 'ഇവയ്ക്കൊത്തവിധം ഏഴു ദിവസത്തേക്ക്, ഓരോ ദിവസവും നിങ്ങൾ അർപ്പിക്കണം: യഹ്‌വേക്കു പ്രസാദകരമായ സുഗന്ധമായി, തീയർപ്പണത്തിന്റെ ഭോജനം[a]. നിരന്തര ദഹനയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ ഇത് അർപ്പിക്കണം.'
  rationale: The revision retains all semantic components of the Hebrew while making the time phrase and sacrificial terminology more natural in modern standard Malayalam. It also renders עֹלָה specifically as ‘ദഹനയാഗം’ and preserves the explanatory footnote at its appropriate anchor.
