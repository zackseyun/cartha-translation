id: NUM.28.24
reference: Numbers 28:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: ml
  text: 'ഇവയ്ക്കൊത്തവിധം ഏഴു ദിവസത്തേക്ക്, ഓരോ ദിവസവും നിങ്ങൾ അർപ്പിക്കണം: യഹ്‌വേക്കു പ്രസാദകരമായ സുഗന്ധമായി, തീയർപ്പണത്തിന്റെ ഭോജനം[a]. നിരന്തര ദഹനയാഗത്തിനും അതിന്റെ പാനീയയാഗത്തിനും പുറമേ ഇത് അർപ്പിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദശഃ: ‘തീയർപ്പണത്തിന്റെ അപ്പം/ഭോജനം.’ ഇവിടെ ‘ഭോജനം’ എന്നത് അപ്പം മാത്രം അല്ല, യാഗമായി സമർപ്പിക്കുന്ന വസ്തുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: cultural_note
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: ഇവപോലെതന്നെ
  rationale: כְּ എന്ന ഉപസർഗത്തിന്റെ താരതമ്യാർഥം നിലനിർത്തി, മുമ്പ് നിർദേശിച്ച അർപ്പണങ്ങളുടെ മാതൃകയിലും അളവിലും ചെയ്യണമെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: תַּעֲשׂוּ
  choice: നിങ്ങൾ അർപ്പിക്കണം
  rationale: പദശഃ ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും യാഗസന്ദർഭത്തിൽ ‘അർപ്പിക്കുക’ എന്നതാണ് വ്യക്തവും സ്വാഭാവികവും.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: ഏഴു ദിവസവും ഓരോ ദിവസവും
  rationale: ഏഴു ദിവസങ്ങളിൽ ഓരോന്നിലും ആവർത്തിക്കണമെന്ന വിതരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: לֶחֶם אִשֵּׁה
  choice: തീയിൽ അർപ്പിക്കുന്ന ഭോജനം
  rationale: ലֶחֶם എന്നത് ഇവിടെ അപ്പം മാത്രമല്ല, യാഗാർപ്പണമായ ഭോജനത്തെയും സൂചിപ്പിക്കുന്നു; אִשֵּׁהയുടെ അഗ്നിയർപ്പണ ഘടകവും നിലനിർത്തുന്നു.
- source_word: רֵיחַ נִיחֹחַ
  choice: പ്രസാദകരമായ സുഗന്ധം
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ യാഗത്തെ സൂചിപ്പിക്കുന്ന രൂപകം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കു
  rationale: ഹീബ്രു ദൈവനാമമായ יהוהയെ ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: നിരന്തരഹോമയാഗത്തിനും ... പുറമേ
  rationale: עַל ഇവിടെ കൂട്ടിച്ചേർക്കൽ എന്ന അർഥത്തിലാണ്; הַתָּמִיד പതിവായി തുടരുന്ന യാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יֵעָשֶׂה
  choice: ഇത് അർപ്പിക്കണം
  rationale: കർമണി രൂപത്തിന്റെ യാഗസന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְנִסְכּוֹ
  choice: അതിന്റെ പാനീയയാഗത്തിനും
  rationale: נסך ഒഴിച്ചർപ്പിക്കുന്ന അനുബന്ധയാഗമാണ്; സർവനാമപ്രത്യയം നിരന്തരഹോമയാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് വരുന്നതിനാൽ അത് പൊതുപദവിയാൽ പകരാതെ മലയാളത്തിൽ വ്യക്തിനാമമായി നൽകുന്നു.
- issue: רֵיחַ נִיחֹחַ എന്ന യാഗപ്രയോഗത്തിന്റെ അർഥം
  choice: പ്രസാദകരമായ സുഗന്ധം
  alternative: ശാന്തിപ്പിക്കുന്ന സുഗന്ധം
  rationale: മൂലരൂപകം നിലനിർത്തുന്നു; എന്നാൽ ദൈവത്തെ യാഗം ശമിപ്പിക്കുന്നു എന്ന വ്യാഖ്യാനം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘ഹോമയാഗം’, ‘പാനീയയാഗം’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ-യാഗപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന ലളിതമാക്കി. മുഖ്യപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
