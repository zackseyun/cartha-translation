lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: പത്തിലൊന്ന് വീതം
  rationale: ആവർത്തിച്ച ഏകവചനരൂപം ‘പത്തിലൊന്ന്, പത്തിലൊന്ന്’ എന്ന വിതരണാർഥമുള്ള യാഗനിയമപ്രയോഗമാണ്; ഓരോ മൃഗത്തിനും ഒരേ അളവ് എന്ന ആശയം ‘വീതം’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘ഏഫാ’ ഈ വാക്യത്തിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ഓരോന്നിനും
  rationale: അക്ഷരാർഥത്തിൽ ‘ആ ഒരു ആട്ടിൻകുട്ടിക്ക്’; ഇവിടെ വിതരണാർഥം ഉദ്ദേശിക്കുന്നതിനാൽ ‘ഓരോന്നിനും’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: ഏഴ് ആട്ടിൻകുട്ടികളിൽ
  rationale: നിശ്ചിതമായ ഏഴ് ആട്ടിൻകുട്ടികളുടെ മുഴുവൻ കൂട്ടത്തെയും സൂചിപ്പിക്കുന്നു; മുൻപുള്ള ‘ഓരോന്നിനും’ എന്നതുമായി ചേർന്ന് ഓരോ ആട്ടിൻകുട്ടിക്കും ബാധകമായ അളവ് വ്യക്തമാക്കുന്നു.
