base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ml
  text: 'യിസ്സാഖാറിന്റെ പുത്രന്മാരിൽ: അവരുടെ തലമുറകൾക്കും കുലങ്ങൾക്കും പിതൃഭവനങ്ങൾക്കും അനുസരിച്ചും, പേരുകളുടെ എണ്ണപ്രകാരവും, ഇരുപതു വയസ്സുമുതൽ അതിനുമുകളിലുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൈന്യത്തിൽ സേവിക്കാൻ യോഗ്യരായ എല്ലാ പുരുഷന്മാരും.” എബ്രായപ്രയോഗം പദശഃ “സൈന്യത്തിനായി പുറപ്പെടുന്ന ഏവൻ” എന്നാണ്; ഇവിടെ അത് സൈനികസേവനത്തിന് യോഗ്യരായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: യിസ്സാഖാറിന്റെ പുത്രന്മാരെ
  rationale: בְּנֵי എന്നതിന്റെ പുരുഷലിംഗപരവും വംശാവലിപരവുമായ അർഥം നിലനിർത്തുന്നു; ഇവിടെ ഗോത്രത്തിലെ പുരുഷസന്തതികളെയാണ് സൂചിപ്പിക്കുന്നത്. לְ എന്നത് വാക്യത്തിലെ എണ്ണൽക്രിയയോട് ചേർത്ത് മലയാളത്തിൽ കർമരൂപമായി സ്വാഭാവികമാക്കി.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾ ... എന്നിവയനുസരിച്ച്
  rationale: ഗോത്രത്തിനുള്ളിലെ വംശപരമ്പരാഗത വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന പദം; രേഖാമൂലമായ വംശാവലികൾ എന്നു അമിതമായി നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾ
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗമാണ്; ആധുനിക അണുകുടുംബം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘കുലങ്ങൾ’ അനുയോജ്യം.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ
  rationale: ഇസ്രായേലിന്റെ പിതൃവംശാധിഷ്ഠിത കുടുംബസംഘടന സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം സംക്ഷിപ്തമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണപ്രകാരം
  rationale: പേരെടുത്ത വ്യക്തികളായുള്ള ജനസംഖ്യാകണക്കിന്റെ എബ്രായ പ്രയോഗം അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ഇരുപതു വയസ്സ് ഉൾപ്പെടുന്ന പ്രായപരിധി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരെയും
  rationale: പദശഃ ‘സൈന്യത്തിലേക്കു/യുദ്ധത്തിനു പുറപ്പെടുന്ന ഏവനും’; സൈനികയോഗ്യത എന്ന ആശയം സന്ദർഭത്തിൽ ഉണ്ടെങ്കിലും ‘കഴിവുള്ള’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ എബ്രായത്തിലെ സജീവപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ജനസംഖ്യാകണക്കിലെ ലിംഗസൂചന
  choice: ‘പുത്രന്മാരെ’ എന്ന പുരുഷലിംഗപരമായ ഗോത്രശീർഷകം നിലനിർത്തി
  alternative: ‘സന്തതികളെ’ അല്ലെങ്കിൽ ‘എല്ലാവരെയും’ മാത്രം ഉപയോഗിച്ച് ലിംഗനിരപേക്ഷമാക്കുക
  rationale: എബ്രായ വ്യാകരണവും സൈനിക ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭവും പ്രായപൂർത്തിയായ പുരുഷന്മാരെ ഉദ്ദേശിക്കുന്നു; അതിനാൽ ഉറവിടത്തിലെ ലിംഗസൂചന മായ്ച്ചുകളയുന്നില്ല.
- issue: כֹּל יֹצֵא צָבָא എന്നതിലെ സൈനികയോഗ്യത
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരെയും
  alternative: യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിവുള്ള എല്ലാ പുരുഷന്മാരെയും
  rationale: മൂലപ്രയോഗം നേരിട്ട് ‘കഴിവുള്ള’ എന്നു പറയുന്നില്ല. സന്ദർഭാർഥമായ സൈനികയോഗ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിക്കൊണ്ട് മുഖ്യപാഠത്തിൽ യഥാർഥ പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ നിലവാരമലയാളം. ആവർത്തിക്കുന്ന ജനസംഖ്യാകണക്കു സൂത്രത്തിന്റെ ഔപചാരിക ഘടന സംരക്ഷിക്കുമ്പോൾ മലയാളവാക്യത്തിന് ആവശ്യമായ ‘എണ്ണി’ എന്ന ക്രിയ സന്ദർഭാനുസൃതമായി പൂർത്തീകരിച്ചു; വാക്യാവസാനത്തെ ദ്വിബിന്ദു തുടർന്നുള്ള എണ്ണത്തെ സൂചിപ്പിക്കുന്നു.
