  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: ml
  text: യാഹ്‌വേ മോശയോടു കൽപിച്ചതെല്ലാം അനുസരിച്ച് ഇസ്രായേൽമക്കൾ[a] ചെയ്തു; അങ്ങനെതന്നെ അവർ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഇസ്രായേല്യർ’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’ ഹീബ്രുവിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ചെയ്തു
  rationale: עשה എന്ന പൊതുവായ ‘ചെയ്യുക/നിർവഹിക്കുക’ എന്ന ക്രിയയെ ഇവിടെ സ്വാഭാവികമായും സംഗ്രഹവാക്യത്തിന് യോജിച്ചും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പരമ്പരാഗത കൂട്ടായ അർഥം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ച്
  rationale: കല്പനയുടെ സമഗ്രതയും അതിനോടുള്ള പ്രവർത്തനത്തിന്റെ കൃത്യമായ പൊരുത്തവും പ്രകടമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചതെല്ലാം
  rationale: മുമ്പ് നൽകിയ ദൈവകല്പനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ കാലക്രമം സ്വാഭാവികമായി വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: ഹീബ്രുവിൽ ‘മോശയെ കല്പിച്ചു’ എന്ന ഘടനയാണെങ്കിലും, ‘മോശയോടു കല്പിച്ചു’ എന്നതാണ് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: മുമ്പ് പറഞ്ഞ കല്പനയോടുള്ള കൃത്യമായ അനുരൂപതയെ ഊന്നിപ്പറയുന്നു.
- source_word: עָשׂוּ
  choice: അവർ ചെയ്തു
  rationale: ഹീബ്രുവിലെ ആവർത്തനവും അനുസരണത്തെ ഊന്നുന്ന സമാപനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്നു. മലയാള വായനക്കാർക്കിടയിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ ഉപയോഗിച്ചു; ‘യാഹ്‌വേ’ ശാസ്ത്രീയ പുനർനിർമാണത്തോട് കൂടുതൽ അടുക്കുന്ന മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന കൂട്ടനാമത്തിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേലിന്റെ പുത്രന്മാർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധരൂപത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട് മുഴുവൻ ഇസ്രായേൽസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സ്വീകരിച്ചു; പുരുഷന്മാർക്ക് മാത്രമായി അർഥം ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ‘ചെയ്തു ... അവർ ചെയ്തു’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനം മിനുക്കിക്കളയാതെ നിലനിർത്തി. ഈ വാക്യത്തിൽ പ്രത്യേക അടിക്കുറിപ്പ് അനിവാര്യമല്ല.
