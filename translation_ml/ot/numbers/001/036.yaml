translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ ജനസംഖ്യാകണക്കു ശൈലി സ്വീകരിച്ചു. അടുത്ത വാക്യത്തിലെ സംഖ്യയിലേക്ക് വ്യാകരണപരമായി നീളുന്ന ഘടന നിലനിർത്താൻ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
