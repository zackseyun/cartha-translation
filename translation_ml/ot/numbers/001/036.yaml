source:
  edition: WLC
  text: לִ/בְנֵ֣י בִנְיָמִ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: ml
  text: 'ബെന്യാമീന്റെ പുത്രന്മാരുടെ കാര്യത്തിൽ, അവരുടെ വംശാവലികൾപ്രകാരവും കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും പേരുകളുടെ എണ്ണമനുസരിച്ചും, ഇരുപത് വയസ്സുമുതൽ അതിനു മുകളിലുള്ള, യുദ്ധസേവനത്തിനു പുറപ്പെടാൻ യോഗ്യരായ എല്ലാവരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ, “സൈന്യത്തിലേക്കു പുറപ്പെടുന്ന എല്ലാവരും”; സൈനികസേവനത്തിന് അർഹരായവരെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: ബെന്യാമീന്റെ പുത്രന്മാരിൽ
  rationale: לִבְנֵי എന്ന ഗോത്രതലക്കെട്ടിനെയും പട്ടികയുടെ തുടർച്ചയെയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന എബ്രായ ബന്ധപദവും നിലനിർത്തുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലികൾപ്രകാരം
  rationale: ജനസംഖ്യാകണക്കിന്റെ സന്ദർഭത്തിൽ വംശപരമ്പരയെയും രേഖപ്പെടുത്തിയ വംശബന്ധത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഔപചാരികവുമായ പ്രയോഗം.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുഗണങ്ങളെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള ‘പിതൃഭവനങ്ങൾ’ എന്ന ചെറിയ ഘടകത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബഘടകത്തെ സംക്ഷിപ്തമായും സുതാര്യമായും നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുപേരായി എണ്ണപ്പെട്ട
  rationale: ഓരോ വ്യക്തിയെയും പേരിന്റെ അടിസ്ഥാനത്തിൽ കണക്കാക്കിയെന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ഇരുപത് വയസ്സ് എന്ന താഴ്ന്ന പ്രായപരിധിയും അതിനുമുകളിലുള്ളവരെയും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും
  rationale: എബ്രായ സൈനികപ്രയോഗത്തിന്റെ ദൃശ്യഭാഷ നിലനിർത്തുന്നു; സൈനികസേവനത്തിന് അർഹരായവരെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
