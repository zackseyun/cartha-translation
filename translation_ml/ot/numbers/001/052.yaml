  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ആവർത്തനവും സൈനിക-സംഘടനാപരമായ ഭാവവും കഴിയുന്നത്ര സ്വാഭാവികമായി സൂക്ഷിച്ചിരിക്കുന്നു.
