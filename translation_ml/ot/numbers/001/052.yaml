source:
  edition: WLC
  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ ഓരോരുത്തരും തങ്ങളുടെ പാളയത്തിനരികെയും തങ്ങളുടെ കൊടിയരികെയും തങ്ങളുടെ സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ച് പാളയമിറങ്ങണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇസ്രായേല്യർ ഓരോരുത്തരും തങ്ങളുടെ പാളയത്തിനരികെയും തങ്ങളുടെ പതാകയരികെയും തങ്ങളുടെ സംഘങ്ങൾക്കനുസരിച്ച് പാളയമിറങ്ങണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנוּ
  choice: പാളയമിറങ്ങണം
  rationale: നിയമപരവും നിർദേശാത്മകവുമായ സന്ദർഭത്തിലെ ഭാവി/വിധിരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന മൂലപ്രയോഗത്തോട് സുതാര്യമായ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം നൽകുന്നു.
- source_word: אִישׁ ... וְאִישׁ
  choice: താന്താങ്ങളുടെ ... താന്താങ്ങളുടെ
  rationale: ആവർത്തിച്ചുള്ള വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; ഓരോരുത്തർക്കുമുള്ള പാളയ-കൊടി നിയോഗം വ്യക്തമാക്കുന്നു.
- source_word: עַל מַחֲנֵהוּ
  choice: താന്താങ്ങളുടെ പാളയത്തിനരികിൽ
  rationale: עַל ഇവിടെ സൂചിപ്പിക്കുന്ന സ്ഥാനപരമോ ബന്ധപരമോ ആയ അർഥം അതിരുകടന്ന് നിർണയിക്കാതെ ‘അരികിൽ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: דִּגְלוֹ
  choice: താന്താങ്ങളുടെ കൊടിക്കീഴിൽ
  rationale: דֶּגֶל എന്ന ഗോത്ര/സൈനിക അടയാളക്കൊടിയുടെ ആശയം വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְצִבְאֹתָם
  choice: സൈന്യവിഭാഗങ്ങൾക്കനുസരിച്ച്
  rationale: צָבָאയുടെ സൈനിക-സംഘടനാപരമായ ഭാവം നിലനിർത്തുന്നു; ഇവിടെ യുദ്ധപ്രവർത്തനത്തേക്കാൾ ക്രമീകരിച്ച വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
