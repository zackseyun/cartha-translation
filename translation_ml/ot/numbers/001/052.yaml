  terminology: ‘ഇസ്രായേൽമക്കൾ,’ ‘പാളയം,’ ‘കൊടി,’ and ‘സൈന്യവിഭാഗങ്ങൾ’ are suitable. The revision retains the military-organizational nuance without implying combat.
