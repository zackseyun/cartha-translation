  to: എന്നാൽ ലേവി ഗോത്രത്തെ മാത്രം നീ എണ്ണരുത്; ഇസ്രായേൽമക്കളുടെ ഇടയിൽ അവരുടെ എണ്ണം കണക്കാക്കുകയും അരുത്.
