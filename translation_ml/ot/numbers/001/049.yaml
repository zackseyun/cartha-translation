id: NUM.1.49
reference: Numbers 1:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: ml
  text: എന്നാൽ ലേവി ഗോത്രത്തെ മാത്രം നീ എണ്ണരുത്; ഇസ്രായേൽമക്കളുടെ ഇടയിൽ അവരുടെ എണ്ണം കണക്കാക്കുകയും അരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: എന്നാൽ ... മാത്രം
  rationale: മുൻപുള്ള ജനസംഖ്യാ നിർദേശത്തിൽനിന്ന് ലേവിയെ ഒഴിവാക്കുന്ന നിയന്ത്രണാത്മകവും വ്യത്യാസസൂചകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מַטֵּה לֵוִי
  choice: ലേവിയുടെ ഗോത്രം
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ מַטֶּה എന്നത് വടി എന്നല്ല, ഗോത്രം എന്ന അർഥത്തിലാണ്.
- source_word: תִפְקֹד
  choice: എണ്ണുക
  rationale: פקד ഇവിടെ ജനസംഖ്യാ കണക്കെടുപ്പിൽ ഉൾപ്പെടുത്തി എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്നു; ലളിതവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: അവരുടെ എണ്ണം എടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ 'അവരുടെ തല ഉയർത്തുക' എന്ന ഘടനയായിരുന്നാലും, ജനസംഖ്യാ സന്ദർഭത്തിൽ മൊത്തം എണ്ണം രേഖപ്പെടുത്തുക എന്ന ഹീബ്രു ശൈലിയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: בְּתוֹךְ
  choice: ഇടയിൽ
  rationale: വലിയ ജനസമൂഹത്തിന്റെ കണക്കിൽ ഉൾപ്പെടുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രുവിലെ സ്ഥിരമായ ജനസമൂഹനാമം മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഉൾക്കൊള്ളുന്നതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിജനസമൂഹനാമത്തിന്റെ ലിംഗസൂചന
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേലിന്റെ പുത്രന്മാർ; ഇസ്രായേല്യർ
  rationale: ഈ പ്രയോഗം രാജ്യത്തെ മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥിരനാമമാണ്. 'ഇസ്രായേൽമക്കൾ' മൂലത്തിലെ കുടുംബബന്ധസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ പുരുഷന്മാർക്ക് മാത്രമായി തെറ്റിദ്ധരിക്കപ്പെടുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ രണ്ട് സമാന്തര നിരോധനങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്; ഈ വാക്യത്തിൽ വിശദീകരണത്തിന് അനിവാര്യമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
