  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ml
  text: 'യോസേഫിന്റെ പുത്രന്മാരിൽപ്പെട്ട എഫ്രയീമിന്റെ പുത്രന്മാർക്ക്: അവരുടെ വംശപരമ്പരപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൈനികസേവനത്തിന് യോഗ്യരായ എല്ലാ പുരുഷന്മാരും.’ എബ്രായ പ്രയോഗം അക്ഷരാർഥത്തിൽ യുദ്ധത്തിനു പുറപ്പെടുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാരിൽ
  rationale: ഇവിടെ בנים ഗോത്രപരമായ പിൻതലമുറക്കാരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, എബ്രായ വംശാവലി പ്രയോഗം നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു; לְ ഗോത്രശീർഷകത്തിന്റെ ബന്ധം കാണിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-യിൽ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: എഫ്രയീമിന്റെ പുത്രന്മാർ
  rationale: യോസേഫിന്റെ കീഴിലുള്ള പ്രത്യേക ഗോത്രവിഭാഗത്തെ അടയാളപ്പെടുത്തുന്നു; വംശാവലി ഭാഷ നിലനിർത്താൻ ‘പുത്രന്മാർ’ സ്വീകരിച്ചു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശപരമ്പരകൾപ്രകാരം
  rationale: ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ പദം തലമുറകളിലൂടെയുള്ള വംശബന്ധത്തെ സൂചിപ്പിക്കുന്നു; എഴുതപ്പെട്ട രേഖകളാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കാതെ ‘വംശപരമ്പരകൾ’ എന്നു നൽകി.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ആധുനിക അണുകുടുംബത്തേക്കാൾ വിശാലമായ ഗോത്രത്തിനുള്ളിലെ ബന്ധുസമൂഹമാണ്; അതിനാൽ ‘കുലങ്ങൾ’ അനുയോജ്യം.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശാധിഷ്ഠിതമായ സാമൂഹിക-വംശാവലി ഘടകത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: ഓരോരുത്തരെയും പേരിന്റെ അടിസ്ഥാനത്തിൽ എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്ന ജനസംഖ്യാകണക്കെടുപ്പ് പ്രയോഗം; എബ്രായത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള
  rationale: സൈനിക കണക്കെടുപ്പിനുള്ള പ്രായപരിധി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും
  rationale: എബ്രായ സൈനിക പ്രയോഗത്തിന്റെ ‘പുറപ്പെടുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; ഈ കണക്കെടുപ്പ് സൈനികപ്രായത്തിലുള്ള പുരുഷന്മാരെക്കുറിച്ചായതിനാൽ ലിംഗസൂചന വ്യക്തമായി നൽകി.
theological_decisions:
- issue: ജനസംഖ്യാകണക്കെടുപ്പിലെ ലിംഗസൂചന
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും
  alternative: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാവരും
  rationale: സന്ദർഭവും എബ്രായത്തിലെ ഏകവചന പുരുഷലിംഗപ്രയോഗവും സൈനികപ്രായത്തിലുള്ള പുരുഷന്മാരെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കി മാറ്റിയില്ല.
- issue: כֹּל יֹצֵא צָבָא എന്ന സൈനിക പ്രയോഗത്തിന്റെ അർഥപരിധി
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന
  alternative: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന
  rationale: മൂലപാഠത്തിലെ യുദ്ധത്തിനു പുറപ്പെടുക എന്ന പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ഇത് പൊതുവായ സൈനികസേവനയോഗ്യതയെ സൂചിപ്പിക്കാമെന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
