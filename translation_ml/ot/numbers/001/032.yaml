revisions:
- from: 'യോസേഫിന്റെ പുത്രന്മാരിൽ, എഫ്രയീമിന്റെ പുത്രന്മാർ—അവരുടെ വംശപരമ്പരകൾപ്രകാരവും കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും[a]:'
  to: 'യോസേഫിന്റെ പുത്രന്മാരിൽപ്പെട്ട എഫ്രയീമിന്റെ പുത്രന്മാർക്ക്: അവരുടെ വംശപരമ്പരപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും[a]:'
  rationale: The revision corrects the opening census-heading syntax, retains the Joseph-to-Ephraim relationship, and smooths the genealogical formula into natural formal Malayalam. It preserves the source’s military idiom in the main text, its male referent, and the alternative service-eligibility sense in the footnote.
