  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന എബ്രായ കണക്കെടുപ്പ് ഘടന ‘-പ്രകാരം’ എന്ന സമാന്തരരൂപത്തിലൂടെ നിലനിർത്തി. അടുത്ത വാക്യത്തിൽ സംഖ്യ വരുന്നതിനാൽ ഈ വാക്യത്തിന്റെ പട്ടികാസ്വഭാവവും അവസാനത്തെ ദ്വിബിന്ദുവും സംരക്ഷിച്ചു.
