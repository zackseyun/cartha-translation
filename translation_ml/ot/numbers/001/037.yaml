  text: פְּקֻדֵי/הֶ֖ם לְ/מַטֵּ֣ה בִנְיָמִ֑ן חֲמִשָּׁ֧ה וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וְ/אַרְבַּ֥ע מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/037.yaml
  text: Those counted from the tribe of Benjamin were thirty-five thousand four hundred.
translation:
  language: ml
  text: ബെന്യാമീൻ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ മുപ്പത്തയ്യായിരത്തി നാനൂറുപേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാകണക്കെടുപ്പിൽ ഉൾപ്പെടുത്തി എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. മൂലവാക്യം ഈ വാക്യത്തിൽ ‘പുരുഷന്മാർ’ എന്നു പ്രത്യേകം ചേർക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: לְמַטֵּה എന്ന ആവർത്തിത കണക്കെടുപ്പ് പ്രയോഗം ഗോത്രബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: בִנְיָמִן
  choice: ബെന്യാമീൻ
  rationale: ഈ വ്യക്തി-ഗോത്രനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: മുപ്പത്തയ്യായിരത്തി നാനൂറ്
  rationale: എബ്രായ സംഖ്യാവിന്യാസത്തിന്റെ കൃത്യമായ മൂല്യം 35,400 ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാശൈലിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കണക്കെടുപ്പ് ശൈലി. ‘പേർ’ ചേർത്തത് മനുഷ്യരുടെ എണ്ണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാനാണ്; ലിംഗസൂചനയായ ‘പുരുഷന്മാർ’ ചേർത്തിട്ടില്ല.
