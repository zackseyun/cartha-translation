translation:
  language: ml
  text: യിസ്സാഖാർ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ അമ്പത്തിനാലായിരത്തി നാനൂറുപേർ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ എണ്ണം” അല്ലെങ്കിൽ “പട്ടികയിൽ ചേർക്കപ്പെട്ടവർ.” എബ്രായത്തിലെ ജനസംഖ്യാ കണക്കെടുപ്പുപദം രേഖപ്പെടുത്തി എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാ കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തി എണ്ണിയവരെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ എന്നത് പുരുഷന്മാർ എന്ന പദം ഈ വാക്യത്തിൽ പ്രത്യേകം ചേർക്കാതെ കണക്കെടുപ്പിന്റെ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: ഈ കണക്കെടുപ്പ്-സൂത്രവാക്യത്തിൽ לְמַטֵּה ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗോത്രത്തിൽ’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יִשָּׂשכָר
  choice: യിസ്സാഖാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: അമ്പത്തിനാലായിരത്തി നാനൂറ്
  rationale: എബ്രായ സംഖ്യാക്രമത്തിലെ കൃത്യമായ ആകെ സംഖ്യയായ 54,400 ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ആവർത്തിക്കുന്ന ജനസംഖ്യാ കണക്കെടുപ്പ്-സൂത്രത്തിന്റെ ഗൗരവവും ലാളിത്യവും നിലനിർത്തിയിരിക്കുന്നു. സംഖ്യ വ്യക്തമായി വായിക്കാനായി ‘പേർ’ ചേർത്തിരിക്കുന്നു.
