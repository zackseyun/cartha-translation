  language: ml
  text: സെബൂലൂൻ ഗോത്രത്തിൽപ്പെട്ട് രജിസ്റ്റർ ചെയ്യപ്പെട്ടവർ 57,400 പേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: പേരെണ്ണി രേഖപ്പെടുത്തിയവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാഗണനയിൽ എണ്ണി പട്ടികപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. ‘പേരെണ്ണി രേഖപ്പെടുത്തിയവർ’ എന്നത് സൈനികസൂചന അനാവശ്യമായി ശക്തമാക്കാതെ കണക്കെടുപ്പിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽനിന്ന്
  rationale: ആവർത്തിക്കുന്ന ഈ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ לְ മַטֶּהയോടൊപ്പം ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഗോത്രത്തിൽനിന്ന്’ എന്നത് അംഗത്വവും ഉറവിടവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: זְבוּלֻן
  choice: സെബൂലൂൻ
  rationale: എബ്രായ ഗോത്രനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400 പേർ
  rationale: എബ്രായത്തിലെ കൃത്യമായ ആകെ സംഖ്യ ആധുനിക വായനാസൗകര്യത്തിനായി അക്കങ്ങളിൽ നൽകി; ‘പേർ’ ചേർക്കുന്നത് മലയാളത്തിൽ വ്യക്തികളുടെ എണ്ണം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ ചുരുക്കമുള്ള ജനസംഖ്യാഗണനാ സൂത്രവാക്യം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പൂർണവാക്യമായി അവതരിപ്പിച്ചു.
