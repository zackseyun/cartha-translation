  language: en
  yaml_path: translation/ot/numbers/001/039.yaml
  text: Those counted from the tribe of Dan were sixty-two thousand seven hundred.
translation:
  language: ml
  text: ദാൻ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ അറുപത്തീരായിരത്തി എഴുനൂറ് പേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാ കണക്കെടുപ്പിൽ ഉൾപ്പെടുത്തി എണ്ണിയവരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ എണ്ണപ്പെടുന്നവർ ആരെന്നത് നേരത്തേ വ്യക്തമാക്കിയിരിക്കുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നു ചേർക്കാതെ മൂലപാഠത്തെ പിന്തുടരുന്നു.
- source_word: לְמַטֵּה דָן
  choice: ദാൻ ഗോത്രത്തിൽ
  rationale: ഈ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ לְמַטֵּה ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ‘ദാൻ ഗോത്രത്തിൽ’ എന്നു നൽകുന്നു.
- source_word: דָן
  choice: ദാൻ
  rationale: വ്യക്തി-ഗോത്രനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: അറുപത്തീരായിരം
  rationale: എബ്രായത്തിലെ ‘രണ്ടും അറുപതും ആയിരം’ എന്ന സംഖ്യാക്രമം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നൽകുന്നു.
- source_word: וּשְׁבַע מֵאוֹת
  choice: എഴുനൂറ്
  rationale: ശേഷിക്കുന്ന സംഖ്യാഭാഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക മലയാള പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ആവർത്തിച്ചുവരുന്ന ജനസംഖ്യാ കണക്കെടുപ്പ് ശൈലി ചുരുക്കത്തോടെയും വ്യക്തതയോടെയും നിലനിർത്തിയിരിക്കുന്നു.
