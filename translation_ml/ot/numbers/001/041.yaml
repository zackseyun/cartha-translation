  yaml_path: translation/ot/numbers/001/041.yaml
  text: Those counted from the tribe of Asher were forty-one thousand five hundred.
translation:
  language: ml
  text: ആശേർ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ നാല്പത്തൊന്നായിരത്തി അഞ്ഞൂറുപേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാ കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തി എണ്ണിയവരെ സൂചിപ്പിക്കുന്നു. വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: ഈ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ לְמַטֵּה ഗോത്രബന്ധം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אָשֵׁר
  choice: ആശേർ
  rationale: ഗോത്രനാമം അർഥപരിഭാഷ ചെയ്യാതെ ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: നാല്പത്തൊന്നായിരത്തി അഞ്ഞൂറ്
  rationale: ഹീബ്രുവിലെ സംഖ്യാക്രമം ആധുനിക മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി, കൃത്യമായ ആകെ സംഖ്യയായ 41,500 നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ആവർത്തിച്ചുവരുന്ന കണക്കെടുപ്പ് സൂത്രത്തിന്റെ ചുരുക്കവും താളവും നിലനിർത്തി; വ്യക്തികളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കാൻ സംഖ്യയ്ക്കു ശേഷം ‘പേർ’ ചേർത്തു.
