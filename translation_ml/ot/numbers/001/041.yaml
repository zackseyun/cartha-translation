  text: פְּקֻדֵי/הֶ֖ם לְ/מַטֵּ֣ה אָשֵׁ֑ר אֶחָ֧ד וְ/אַרְבָּעִ֛ים אֶ֖לֶף וַ/חֲמֵ֥שׁ מֵאֽוֹת׃פ
