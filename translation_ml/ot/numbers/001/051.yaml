  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: ml
  text: തിരുനിവാസം യാത്രതിരിക്കുമ്പോൾ ലേവ്യർ അത് അഴിച്ചുമാറ്റണം; തിരുനിവാസം താവളമടിക്കുമ്പോൾ ലേവ്യർ അത് സ്ഥാപിക്കണം. അടുത്തുവരുന്ന അധികാരമില്ലാത്തവൻ[a] വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പുറത്തുള്ളവൻ’ അല്ലെങ്കിൽ ‘അന്യൻ’; ഇവിടെ എബ്രായപദം വിശുദ്ധസ്ഥാനത്തോട് അടുത്തുവരാൻ അധികാരമില്ലാത്ത ആളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: യാത്രതിരിക്കുമ്പോൾ
  rationale: בְּ + infinitive construct സമയസൂചക ഉപവാക്യം രൂപപ്പെടുത്തുന്നു. נסע എന്ന പദത്തിന്റെ മുന്നോട്ടുള്ള യാത്ര ആരംഭിക്കുന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: משכן എന്നത് ദൈവത്തിന്റെ വിശുദ്ധവും കൊണ്ടുനടക്കാവുന്നതുമായ വാസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. സമാഗമനകൂടാരം എന്ന വ്യത്യസ്ത എബ്രായ പദവുമായി കലരാതിരിക്കാൻ ‘തിരുനിവാസം’ തെരഞ്ഞെടുത്തു.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: അത് അഴിച്ചിറക്കണം
  rationale: ഈ സന്ദർഭത്തിലെ ירד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം യാത്രയ്ക്കായി തിരുനിവാസം അഴിച്ചുമാറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഴിച്ചിറക്കണം’ അഴിച്ചുമാറ്റലും താഴെയിറക്കലും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഈ ഗോത്രവിഭാഗത്തിനുള്ള സാധാരണ മലയാളരൂപം; തിരുനിവാസം കൈകാര്യം ചെയ്യാൻ അധികാരപ്പെട്ടവർ ഇവരാണ്.
- source_word: וּבַחֲנֹת
  choice: പാളയമടിക്കുമ്പോൾ
  rationale: חנה എന്ന പദത്തിന്റെ പാളയമിറങ്ങുക/തങ്ങുക എന്ന അർഥം നൽകുന്നു; തിരുനിവാസത്തെ കർത്താവാക്കി പറയുന്ന മൂലപാഠത്തിന്റെ രൂപകാത്മക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יָקִימוּ אֹתוֹ
  choice: അത് സ്ഥാപിക്കണം
  rationale: קום എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ഇവിടെ തിരുനിവാസം വീണ്ടും ഉയർത്തി സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: וְהַזָּר
  choice: അനധികൃതനായ ആരെങ്കിലും
  rationale: ഈ വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ זָר വംശീയമായി വിദേശിയെയല്ല, അടുത്തുവരാനോ വിശുദ്ധശുശ്രൂഷ നിർവഹിക്കാനോ അധികാരമില്ലാത്ത ആളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
- source_word: הַקָּרֵב
  choice: അടുത്തുവന്നാൽ
  rationale: קרב എന്ന കർത്തൃവാചക രൂപം വിശുദ്ധസ്ഥാനത്തോട് അടുത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; വ്യവസ്ഥാപരമായ മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: יוּמָת
  choice: കൊല്ലപ്പെടണം
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം മരണം വെറും ഫലമായി സംഭവിക്കുന്നതല്ല, ചുമത്തപ്പെടുന്നതാണെന്ന് സൂചിപ്പിക്കുന്നു. കർത്താവിനെ വ്യക്തമാക്കാതെ നിഷ്ക്രിയപ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יוּמָת സൂചിപ്പിക്കുന്ന ശിക്ഷയുടെ സ്വഭാവം
  choice: ‘കൊല്ലപ്പെടണം’ എന്ന ചുമത്തപ്പെടുന്ന മരണത്തെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയപ്രയോഗം
  alternative: ‘മരിക്കും’ എന്ന ഫലസൂചക പ്രയോഗം
  rationale: എബ്രായ ഹോഫാൽ രൂപം സാധാരണയായി മറ്റൊരാൾ വരുത്തുന്ന മരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആരാണ് ശിക്ഷ നടപ്പാക്കുന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അത് നിർണ്ണയിച്ചിട്ടില്ല.
- issue: זָר എന്ന പദത്തിന്റെ സൂചന
  choice: വിശുദ്ധസ്ഥാനത്തോട് അടുത്തുവരാൻ അധികാരമില്ലാത്ത ആൾ
  alternative: വംശീയമായി വിദേശി; അല്ലെങ്കിൽ കർശനമായി ഏതൊരു ലേവ്യേതരനും
  rationale: പുരോഹിത-തിരുനിവാസ സന്ദർഭങ്ങളിൽ ഈ പദം വിശുദ്ധചുമതലയുടെ പരിധിക്കു പുറത്തുള്ള ആളെ സൂചിപ്പിക്കുന്നു. പരിധി വംശീയമായി നിർവചിക്കാതെയും മൂലപാഠത്തേക്കാൾ ചുരുക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘തിരുനിവാസം’ എന്ന പദം משכן-നെ, ‘സമാഗമനകൂടാരം’ എന്നത് אהל מועד-നെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പദവ്യത്യാസം സംരക്ഷിച്ചു. മൂലപാഠത്തിലെ തിരുനിവാസത്തിന്റെ യാത്രതിരിക്കലും പാളയമടിക്കലും എന്ന വ്യക്തിവൽക്കരണം നിലനിർത്തി.
