lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: യിസ്സാഖാർ ഗോത്രത്തിനുവേണ്ടി
  rationale: ഈ ജനസംഖ്യാലേഖനത്തിലെ നേതാക്കളുടെ പട്ടികയിൽ ലְ എന്ന ഉപസർഗം ഗോത്രബന്ധത്തെയും പ്രാതിനിധ്യത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി വരാൻ ഗോത്രം എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: נְתַנְאֵל
  choice: നെഥനയേൽ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ, എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശപരമായ തിരിച്ചറിയലിൽ ഇവിടെ നേരിട്ടുള്ള പിതൃപുത്രബന്ധമാണ് സ്വാഭാവിക അർത്ഥം; വിശാലമായ സന്തതി എന്ന അർത്ഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- source_word: צוּעָר
  choice: സൂവാർ
  rationale: വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ എബ്രായരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, പട്ടികയുടെ ചുരുക്കരൂപം നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി ഗോത്രം എന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു. പേരുകൾ ഉറവിടഭാഷയെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു.
