source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: ml
  text: 'നിങ്ങളോടുകൂടെ നിൽക്കേണ്ട പുരുഷന്മാരുടെ പേരുകൾ ഇവയാണ്: രൂബേൻ ഗോത്രത്തിനുവേണ്ടി[a] ശെദേയൂരിന്റെ മകൻ എലീസൂർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രൂബേൻ ഗോത്രത്തിൽനിന്ന്—ശെദേയൂരിന്റെ മകൻ എലീസൂർ.” എബ്രായത്തിലെ പൂർവപ്രത്യയം ഗോത്രബന്ധത്തെയോ ഗോത്രത്തിന്റെ പ്രതിനിധിത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה שְׁמוֹת
  choice: പേരുകൾ ഇവയാണ്
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി; וְ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: הָאֲנָשִׁים
  choice: പുരുഷന്മാരുടെ
  rationale: ഇവിടെ നിർദിഷ്ട പുരുഷ പ്രതിനിധികളെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിഷ്കർഷമുള്ള മൂലപദം നിലനിർത്തി.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּכֶם
  choice: നിങ്ങളോടുകൂടെ നിൽക്കേണ്ട
  rationale: עמד എന്നതിന്റെ അടിസ്ഥാനമായ ‘നിൽക്കുക’ എന്ന അർഥവും ഇവർ മോശെയോടും അഹരോനോടും ചേർന്ന് നിർവഹിക്കേണ്ട പ്രതിനിധി ചുമതലയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു. രണ്ടാം പുരുഷ ബഹുവചനം ‘നിങ്ങളോടുകൂടെ’ എന്നു നൽകി.
- source_word: לִרְאוּבֵן
  choice: രൂബേൻ ഗോത്രത്തിനുവേണ്ടി
  rationale: לְ ഇവിടെ ഗോത്രബന്ധമോ പ്രതിനിധിത്വമോ അടയാളപ്പെടുത്താം. പ്രധാന പാഠത്തിൽ പ്രതിനിധിത്വം സ്വാഭാവികമായി വ്യക്തമാക്കി; മറുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: אֱלִיצוּר
  choice: എലീസൂർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: בֶּן שְׁדֵיאוּר
  choice: ശെദേയൂരിന്റെ മകൻ
  rationale: സാധാരണ വംശാവലി പ്രയോഗമായി നൽകി; שְׁדֵיאוּר എന്ന പേര് എബ്രായ ഉച്ചാരണത്തോട് അടുത്ത് ലിപ്യന്തരിച്ചു.
