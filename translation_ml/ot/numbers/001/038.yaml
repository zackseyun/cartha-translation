  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ml
  text: 'ദാന്റെ പുത്രന്മാരുടെ കാര്യത്തിൽ, അവരുടെ വംശാവലികൾക്കും കുലങ്ങൾക്കും പിതൃഭവനങ്ങൾക്കും അനുസരിച്ച്, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടാൻ പ്രാപ്തരായ എല്ലാ പുരുഷന്മാരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൈനികസേവനത്തിനു യോഗ്യരായ എല്ലാ പുരുഷന്മാരും.” ഹീബ്രു പ്രയോഗം അക്ഷരാർഥത്തിൽ യുദ്ധത്തിനു പുറപ്പെടുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: ദാന്റെ പുത്രന്മാരിൽ
  rationale: ഗോത്രജനത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത ജനസംഖ്യാകണക്കെടുപ്പ് ശൈലി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ പുരുഷ സൈനികയോഗ്യത കണക്കിലെടുത്ത് ‘പുത്രന്മാർ’ സംരക്ഷിക്കുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലികൾ
  rationale: ഇവിടെ ജൈവസന്തതിയെ മാത്രം അല്ല, വംശപരമായ രേഖയെയും വിഭാഗീകരണത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾ
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള ‘പിതൃഭവനങ്ങൾ’ എന്ന ഘടകത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ
  rationale: പുരാതന ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിത സാമൂഹിക-കുടുംബ ഘടകത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗം.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുപേരായി എണ്ണപ്പെട്ടവരിൽ
  rationale: വ്യക്തികളെ പേരടിസ്ഥാനത്തിൽ എണ്ണിയെന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ പ്രായപരിധി കൃത്യമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടാൻ പ്രാപ്തരായ എല്ലാ പുരുഷന്മാരും
  rationale: യുദ്ധത്തിനോ സൈനികസേവനത്തിനോ യോഗ്യരായവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം നൽകുന്നു; സന്ദർഭത്തിലെ പുരുഷസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൈനിക ജനസംഖ്യാകണക്കെടുപ്പിലെ ലിംഗസൂചന
  choice: എല്ലാ പുരുഷന്മാരും
  alternative: എല്ലാവരും
  rationale: ഹീബ്രുവിലെ പ്രായപ്രയോഗം പുരുഷലിംഗരൂപത്തിലാണ്; ഈ ഭാഗം സൈനികസേവനത്തിന് യോഗ്യരായ ഗോത്രത്തിലെ പുരുഷന്മാരെ എണ്ണുന്നതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ വ്യക്തമാക്കുന്നു.
- issue: כֹּל יֹצֵא צָבָא എന്ന സൈനിക പ്രയോഗം
  choice: യുദ്ധത്തിനു പുറപ്പെടാൻ പ്രാപ്തരായ
  alternative: സൈനികസേവനത്തിനു യോഗ്യരായ
  rationale: മൂലത്തിലെ ‘പുറപ്പെടുക’ എന്ന ദൃശ്യപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ പ്രയോഗാർഥം ‘പ്രാപ്തരായ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എണ്ണിപ്പറയുന്ന ഹീബ്രു വാക്യഘടനയുടെ ഔപചാരിക താളം കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; വാക്യം അടുത്ത വാക്യത്തിലെ സംഖ്യയിലേക്ക് നയിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
