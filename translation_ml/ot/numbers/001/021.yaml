  yaml_path: translation/ot/numbers/001/021.yaml
  text: Their counted men from the tribe of Reuben were forty-six thousand five hundred.
translation:
  language: ml
  text: രൂബേൻ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ നാൽപ്പത്താറായിരത്തി അഞ്ഞൂറുപേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാകണക്കെടുപ്പിൽ രേഖപ്പെടുത്തി എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: לְ എന്ന ഉപസർഗത്തോടുകൂടിയ מַטֶּה ഇവിടെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ ‘ഗോത്രത്തിൽ’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: רְאוּבֵן
  choice: രൂബേൻ
  rationale: ഹീബ്രായ വ്യക്തി-ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: നാൽപ്പത്താറായിരത്തി അഞ്ഞൂറുപേർ
  rationale: ഹീബ്രായ സംഖ്യാക്രമം കൃത്യമായ ആകെ സംഖ്യ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിൽ നൽകി; മനുഷ്യരെ എണ്ണുന്നതിനാൽ ‘പേർ’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ കണക്കെടുപ്പ് ശൈലി. മൂലത്തിലെ സംക്ഷിപ്ത സൂത്രവാക്യസ്വഭാവം നിലനിർത്തി.
