  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ള പട്ടികാശൈലി. മൂലവാക്യത്തിലെ സമാന്തര ഘടനയും ചുരുക്കവും നിലനിർത്തി; വായനാസൗകര്യത്തിനായി കോളണും അർദ്ധവിരാമവും ഉപയോഗിച്ചു.
