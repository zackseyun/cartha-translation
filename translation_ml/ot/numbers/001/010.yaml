  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: ml
  text: 'യോസേഫിന്റെ പുത്രന്മാർക്കായി: എഫ്രയീമിന് അമ്മീഹൂദിന്റെ മകൻ എലീശാമാ; മനശ്ശെയ്ക്ക് പെദാസൂരിന്റെ മകൻ ഗമലീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: യോസേഫിന്റെ പുത്രന്മാരിൽ
  rationale: ലְ എന്ന ഉപസർഗം ഈ പട്ടികയിൽ ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുവരുന്ന എഫ്രയീം, മനശ്ശെ എന്നീ രണ്ടു ശാഖകളെ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘പുത്രന്മാരിൽ’ എന്നു നൽകി; ‘പുത്രന്മാർക്കായി’ എന്ന അത്യന്തം പദാനുപദ രൂപം ഒഴിവാക്കി.
- source_word: לְאֶפְרַיִם
  choice: എഫ്രയീമിന്
  rationale: യോസേഫിന്റെ കീഴിലുള്ള പ്രത്യേക ഗോത്രശാഖയെ പട്ടികാശൈലിയിൽ ചുരുക്കമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഗോത്രം’ ചേർത്തിട്ടില്ല.
- source_word: אֱלִישָׁמָע
  choice: എലീശാമാ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഉച്ചാരണഘടന മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തിയ ലിപ്യന്തരണം.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: עַמִּיהוּד
  choice: അമ്മീഹൂദ്
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ലിപ്യന്തരണം; മദ്ധ്യവ്യഞ്ജന ദ്വിത്വവും ദീർഘസ്വരവും സൂചിപ്പിച്ചു.
- source_word: לִמְנַשֶּׁה
  choice: മനശ്ശെയ്ക്ക്
  rationale: ‘എഫ്രയീമിന്’ എന്നതിന് സമാന്തരമായി യോസേഫിന്റെ രണ്ടാമത്തെ ഗോത്രശാഖയെ സൂചിപ്പിക്കുന്നു; ‘ഗോത്രം’ എന്ന വ്യാഖ്യാനപദം ചേർത്തിട്ടില്ല.
- source_word: גַּמְלִיאֵל
  choice: ഗമലീയേൽ
  rationale: എബ്രായ വ്യക്തിനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു.
- source_word: פְּדָהצוּר
  choice: പെദാസൂർ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ ഘടകങ്ങളും അവസാന ദീർഘസ്വരവും പ്രതിഫലിപ്പിക്കുന്ന ലിപ്യന്തരണം.
