base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/011.yaml
  text: 'For Benjamin: Abidan son of Gideoni.'
translation:
  language: ml
  text: 'ബെന്യാമീനുവേണ്ടി: അബീദാൻ, ഗിദെയോനിയുടെ മകൻ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: ബെന്യാമീനെ പ്രതിനിധീകരിച്ച്
  rationale: പട്ടികയുടെ ഈ സന്ദർഭത്തിൽ לְ ഗോത്രത്തിനുവേണ്ടിയുള്ള പ്രതിനിധിയെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പ്രതിനിധീകരിച്ച്’ എന്നു പറയുന്നത് ഗോത്രനാമത്തെയും തുടർന്ന് വരുന്ന വ്യക്തിയെയും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֲבִידָן
  choice: അബീദാൻ
  rationale: എബ്രായ വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
- source_word: בֶּן
  choice: മകൻ
  rationale: നാമപ്പട്ടികയിലെ പിതൃപുത്രബന്ധം സൂചിപ്പിക്കുന്ന എബ്രായ സംയുക്തരൂപത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള പരിഭാഷ.
- source_word: גִּדְעֹנִי
  choice: ഗിദെയോനി
  rationale: എബ്രായ വ്യക്തിനാമം വിവർത്തനം ചെയ്യാതെ മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് לְ എന്നതിന്റെ പ്രതിനിധിത്വസൂചന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
