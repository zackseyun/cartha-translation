id: NUM.1.48
reference: Numbers 1:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വേ[a] മോശയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’ (יהוה); പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പരമ്പരാഗത അവതരണരീതിയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ ക്രമാനുഗതത സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അരുളിച്ചെയ്തു’ എന്ന പ്രയോഗം דִּבֵּר എന്ന ക്രിയയുടെ അർഥം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ יהוה ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിമുഖവ്യക്തിയെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പൂർവപ്രത്യയവും מֹשֶׁה എന്ന പേരും സ്വാഭാവിക മലയാളത്തിൽ ‘മോശയോടു’ എന്നു നൽകുന്നു.
- source_word: לֵאמֹר
  choice: പ്രത്യേക പദമായി ആവർത്തിക്കാതെ ഉദ്ധരണി ചിഹ്നമായ കോളനിലൂടെ സൂചിപ്പിച്ചു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗമാണിത്. ‘ഇപ്രകാരം’ അല്ലെങ്കിൽ ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകുന്നതിനാൽ കോളൻ അതിന്റെ വ്യവഹാരധർമ്മം വ്യക്തമായി വഹിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ നാമരൂപത്തിൽ സംരക്ഷിച്ചു; മലയാള വായനക്കാർക്ക് ഏറെ പരിചിതമായ പരമ്പരാഗത ലിപ്യന്തരണം ‘യഹോവ’ പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ചു. സാധ്യതയുള്ള ‘യാഹ്‌വേ’ എന്ന ഉച്ചാരണം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന് യോജിച്ച മാന്യത പുലർത്തുന്നതുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ അല്പം ഔപചാരികമാണെങ്കിലും ദൈവത്തിന്റെ വാക്കിനെ സൂചിപ്പിക്കുന്ന മലയാളപ്രയോഗത്തിൽ സ്വാഭാവികമാണ്.
