  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: ml
  text: 'ഗാദിന്റെ പുത്രന്മാർ[a]: അവരുടെ തലമുറകൾപ്രകാരവും കുലങ്ങൾപ്രകാരവും[b] പിതൃഭവനങ്ങൾപ്രകാരവും, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനുമുകളിലും പ്രായമുള്ള, സൈനികസേവനത്തിനു പോകുന്ന എല്ലാവരും[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘ഗാദിന്റെ പുത്രന്മാർ.’ ജനസംഖ്യാകണക്കെടുപ്പിൽ എണ്ണപ്പെട്ട ഗോത്രത്തിലെ പുരുഷ അംഗങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ‘അവരുടെ കുടുംബങ്ങൾപ്രകാരം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥമായി ‘സൈന്യത്തിലേക്കു പുറപ്പെടുന്ന എല്ലാവരും’; ‘യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: ഗാദിന്റെ പുത്രന്മാരിൽ
  rationale: ഗോത്രത്തെ സംബന്ധിച്ച ഈ ജനസംഖ്യാകണക്കെടുപ്പിൽ എണ്ണപ്പെടുന്ന പുരുഷ അംഗങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘പുത്രന്മാർ’ എന്നത് എബ്രായപ്രയോഗത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു; ലְ എന്ന ഉപസർഗം പട്ടികയുടെ തലക്കെട്ടായി ഇവിടെ ‘-യിൽ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾപ്രകാരം
  rationale: ഈ സാഹചര്യത്തിൽ പദം വംശപരമ്പരയനുസരിച്ചുള്ള ക്രമീകരണത്തെ സൂചിപ്പിക്കുന്നു. എഴുതിവെച്ച വംശാവലിരേഖകൾ എന്നു അധികമായി വ്യാഖ്യാനിക്കാതെ മൂലത്തിലെ കണക്കെടുപ്പ്-സൂത്രവാക്യം നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഒരു ഗോത്രത്തിനുള്ളിലെ വിപുലമായ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക അണുകുടുംബം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശാധിഷ്ഠിതമായ കുടുംബഗൃഹവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബന്ധുത്വപ്രയോഗമാണിത്. മൂലത്തിലെ ഘടനയും സാമൂഹികസൂചനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരെണ്ണി
  rationale: ഓരോ വ്യക്തിയെയും പേരിന്റെ അടിസ്ഥാനത്തിൽ എണ്ണുന്നതാണ് ഉദ്ദേശ്യം. ‘പേരുകളുടെ എണ്ണമനുസരിച്ച്’ എന്ന അക്ഷരാർഥരൂപത്തെക്കാൾ സ്വാഭാവികമായ മലയാളത്തിൽ അതേ ആശയം നൽകുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ പ്രായപരിധി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; എബ്രായത്തിലെ അക്ഷരാർഥമായ ‘ഇരുപതു വയസ്സുള്ള ഒരു പുത്രൻ മുതൽ’ എന്ന ഘടന അനുകരിക്കുന്നില്ല.
- source_word: כֹּל יֹצֵא צָבָא
  choice: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാവരും
  rationale: യുദ്ധത്തിനോ സൈനികസേവനത്തിനോ പുറപ്പെടുന്നവരെയാണ് വാചകം സൂചിപ്പിക്കുന്നത്. യോഗ്യത എന്ന ആശയം വ്യാഖ്യാനമായി ചേർക്കാതെ എബ്രായത്തിലെ പ്രവർത്തകപ്രയോഗം നിലനിർത്തുന്നു.
