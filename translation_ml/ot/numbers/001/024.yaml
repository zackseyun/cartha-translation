translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. കണക്കെടുപ്പ് പട്ടികയുടെ സൂത്രവാക്യസ്വഭാവവും തുടർന്നുവരുന്ന സംഖ്യയിലേക്കു നയിക്കുന്ന അവസാന ദ്വിബിന്ദുവും നിലനിർത്തി. ‘പുത്രന്മാർ,’ ‘കുലങ്ങൾ,’ ‘പിതൃഭവനങ്ങൾ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ലിംഗ-ബന്ധുത്വ ഘടന മറച്ചുവയ്ക്കാതെ നൽകുന്നു.
