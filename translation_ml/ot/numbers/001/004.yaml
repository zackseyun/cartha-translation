source:
  edition: WLC
  text: וְ/אִתְּ/כֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַ/מַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְ/בֵית אֲבֹתָ֖י/ו הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: ml
  text: നിങ്ങളോടൊപ്പം ഓരോ ഗോത്രത്തിൽനിന്നും ഓരോ പുരുഷൻ ഉണ്ടായിരിക്കും; അവൻ തന്റെ പിതൃഭവനത്തിന്റെ തലവനായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തന്റെ പൂർവികരുടെ ഭവനത്തിന്റെ തലവൻ.’ എബ്രായപദപ്രയോഗം അക്ഷരാർഥത്തിൽ ‘തന്റെ പിതാക്കന്മാരുടെ ഭവനത്തിന്റെ തലവൻ’ എന്നാണ്; പിതൃവംശാധിഷ്ഠിതമായ ഒരു കുടുംബത്തിന്റെയോ കുലത്തിന്റെയോ മുഖ്യ പുരുഷപ്രതിനിധിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: നിങ്ങളോടൊപ്പം
  rationale: മോശെയോടും അഹരോനോടും ചേർന്ന് ജനസംഖ്യാ കണക്കെടുപ്പിൽ സഹായിക്കേണ്ടവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം.
- source_word: יִהְיוּ
  choice: ഉണ്ടായിരിക്കണം
  rationale: സന്ദർഭത്തിൽ അപൂർണക്രിയയ്ക്ക് നിർദേശാത്മകമായ ഭാവിയർഥമുണ്ട്; സാന്നിധ്യവും നിർദേശവും ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഓരോ ... ഓരോ പുരുഷൻ
  rationale: ആവർത്തനം വിതരണാർഥകമാണ്—ഓരോ ഗോത്രത്തിൽനിന്നും ഒരാൾ വീതം. മലയാളത്തിലെ ‘ഓരോ ... ഓരോ’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לַמַּטֶּה
  choice: ഗോത്രത്തിൽനിന്നും
  rationale: സംഖ്യാപുസ്തകത്തിലെ ജനസംഖ്യാ കണക്കെടുപ്പിന്റെയും ഇസ്രായേലിന്റെ സംഘടനയുടെയും പശ്ചാത്തലത്തിൽ מַטֶּה ഒരു ഗോത്രവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്, ദണ്ഡിനെയല്ല.
- source_word: אִישׁ רֹאשׁ
  choice: അവൻ ... തലവനായിരിക്കണം
  rationale: പ്രതിനിധി തന്റെ പിതൃഭവനത്തിന്റെ നേതൃത്വസ്ഥാനത്തുള്ളയാളാണെന്ന അനുബന്ധ നിർവചനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘തലവൻ’ എബ്രായ രൂപകവും നിലനിർത്തുന്നു.
- source_word: לְבֵית אֲבֹתָיו
  choice: തന്റെ പിതൃഭവനത്തിന്റെ
  rationale: പിതൃവംശാധിഷ്ഠിതമായ കുടുംബ/കുലഘടനയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക സാമൂഹിക പ്രയോഗമാണ്; ‘പിതൃഭവനം’ അതിന്റെ ഘടനാപരമായ അർഥം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: הוּא
  choice: അവൻ
  rationale: എബ്രായത്തിലെ സ്വതന്ത്ര സർവനാമത്തിന്റെ ഊന്നൽ/പുനരാരംഭ സ്വഭാവം മലയാളത്തിൽ തുറന്ന സർവനാമമായി നിലനിർത്തുന്നു.
