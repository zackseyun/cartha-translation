  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിതൃഭവനം’ എന്ന പദം സാധാരണ ‘കുടുംബം’ എന്നതിലേക്കു ചുരുക്കാതെ മൂലത്തിലെ പിതൃവംശാധിഷ്ഠിത സാമൂഹികഘടന നിലനിർത്തുന്നു.
