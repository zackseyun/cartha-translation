source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ml
  text: 'നഫ്താലിയുടെ പുത്രന്മാർ: അവരുടെ തലമുറകൾപ്രകാരവും കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള, സൈനികസേവനത്തിന് പുറപ്പെടാൻ യോഗ്യരായ എല്ലാവരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “സൈന്യത്തിലേക്ക് പുറപ്പെടുന്ന എല്ലാവരും” അല്ലെങ്കിൽ “യുദ്ധത്തിന് പുറപ്പെടുന്ന എല്ലാവരും.” സൈനികസേവനത്തിന് യോഗ്യരായവരെയാണ് ഈ എബ്രായ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: നഫ്താലിയുടെ പുത്രന്മാരിൽ
  rationale: בְּנֵי എന്നതിന്റെ പുരുഷലിംഗപരവും വംശാവലിപരവുമായ അർഥം ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു. തുടർന്നുവരുന്ന എണ്ണത്തിന്റെ അവതാരികയായതിനാൽ മലയാളത്തിൽ ‘പുത്രന്മാരിൽ’ എന്ന വിഭക്തിരൂപം സ്വാഭാവികമാണ്.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾപ്രകാരം
  rationale: വംശപരമ്പരയെയും വംശാവലിവിഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്ന ആവർത്തിത ജനസംഖ്യാകണക്കെടുപ്പ് പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഇവിടെയുള്ള מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തെക്കാൾ വിശാലമായ ഗോത്രാന്തർഗത കുടുംബവിഭാഗമാണ്; ‘കുലം’ ആ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശാധിഷ്ഠിതമായ കുടുംബഗൃഹവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ ബന്ധുത്വപ്രയോഗത്തിന്റെ ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: പേരുപറഞ്ഞുള്ള വ്യക്തിഗത എണ്ണലിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ഔപചാരിക പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ പ്രായപരിധി ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: സൈനികസേവനത്തിന് പുറപ്പെടാൻ യോഗ്യരായ എല്ലാവരും
  rationale: അക്ഷരാർഥത്തിൽ ‘സൈന്യത്തിലേക്ക്/യുദ്ധത്തിന് പുറപ്പെടുന്ന എല്ലാവരും’ എന്നാണെങ്കിലും, ഈ കണക്കെടുപ്പുസന്ദർഭത്തിൽ സൈനികസേവനയോഗ്യതയാണ് ഉദ്ദേശ്യം; ‘എല്ലാവരും’ എന്നത് മൂലപാഠത്തിൽ ഈ വാക്യഭാഗത്ത് പ്രത്യേകം ‘പുരുഷൻ’ എന്ന നാമം ഇല്ലാത്തതും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായ ജനസംഖ്യാകണക്കെടുപ്പ് സൂത്രവാക്യത്തിന്റെ ആവർത്തനഘടന നിലനിർത്തിയിട്ടുണ്ട്. വാക്യം അടുത്ത വാക്യത്തിലെ എണ്ണത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
