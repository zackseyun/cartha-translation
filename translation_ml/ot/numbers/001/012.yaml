  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള സംക്ഷിപ്തവും മാന്യവുമായ പട്ടികാശൈലി. ഗോത്രത്തിന്റെ പേര് അനാവശ്യമായി വികസിപ്പിക്കാതെ എബ്രായ മൂലത്തിന്റെ ചുരുക്കം നിലനിർത്തി.
