id: NUM.1.47
reference: Numbers 1:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֖ם לְ/מַטֵּ֣ה אֲבֹתָ֑/ם לֹ֥א הָתְפָּקְד֖וּ בְּ/תוֹכָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: ml
  text: എന്നാൽ ലേവ്യർ തങ്ങളുടെ പിതൃഗോത്രപ്രകാരം[a] അവരുടെ കൂട്ടത്തിൽ എണ്ണപ്പെട്ടില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘തങ്ങളുടെ പിതാക്കന്മാരുടെ ഗോത്രപ്രകാരം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘അവരുടെ കൂട്ടത്തിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടില്ല’ അഥവാ ‘കണക്കെടുപ്പിനായി ചേർക്കപ്പെട്ടില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: എന്നാൽ ലേവ്യർ
  rationale: മുൻവാക്യങ്ങളിൽ എണ്ണപ്പെട്ട മറ്റു ഗോത്രങ്ങളിൽനിന്ന് ലേവ്യരെ വേർതിരിക്കുന്ന വൈരുധ്യം സന്ദർഭത്തിൽ ഉള്ളതിനാൽ וְ എന്നത് ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി; לְוִי എന്ന ഗോത്രനാമത്തിന്റെ പതിവായ മലയാളരൂപം ‘ലേവ്യർ’ ആണ്.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: തങ്ങളുടെ പിതൃഗോത്രപ്രകാരം
  rationale: ജനസംഖ്യാഗണനയുടെ സന്ദർഭത്തിൽ מַטֶּה ‘ഗോത്രം’ എന്നും אֲבֹתָם പിതൃപരമ്പരയെയും വംശബന്ധത്തെയും സൂചിപ്പിക്കുന്നു. ‘പിതൃഗോത്രപ്രകാരം’ മൂലത്തിലെ ഘടന ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: לֹא הָתְפָּקְדוּ
  choice: എണ്ണപ്പെട്ടില്ല
  rationale: פקד എന്ന ധാതുവിന്റെ ഹിത്പായേൽ രൂപം ഇവിടെ ഔദ്യോഗികമായി കണക്കിൽ ചേർക്കപ്പെടുക/പട്ടികപ്പെടുത്തപ്പെടുക എന്ന അർഥത്തിലാണ്; ‘എണ്ണപ്പെട്ടില്ല’ ജനസംഖ്യാഗണനാസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: בְּתוֹכָם
  choice: അവരുടെ കൂട്ടത്തിൽ
  rationale: בְּתוֹךְ ഇവിടെ മറ്റു ഗോത്രങ്ങളടങ്ങിയ എണ്ണപ്പെട്ട സമൂഹത്തിനുള്ളിലെ ഉൾപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു; ‘അവരുടെ കൂട്ടത്തിൽ’ എന്നത് ആ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനസംഖ്യാഗണനയുടെ ഔദ്യോഗിക പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് മൂലത്തിലെ പിതൃവംശപരമായ പ്രയോഗത്തിന് പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും ഇടം നൽകിയിരിക്കുന്നു.
