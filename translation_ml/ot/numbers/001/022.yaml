source:
  edition: WLC
  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: ml
  text: 'ശിമെയോന്റെ പുത്രന്മാരെ സംബന്ധിച്ച്: അവരുടെ വംശപരമ്പരകൾ, കുലങ്ങൾ, പിതൃഭവനങ്ങൾ എന്നിവയനുസരിച്ച്, പേരുകളുടെ എണ്ണപ്രകാരം, ആളൊന്നായി[b] എണ്ണപ്പെട്ടവർ[a]—ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന[c] എല്ലാ പുരുഷന്മാരും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എണ്ണപ്പെട്ടവർ’ എന്നതിന് ‘സൈന്യത്തിനായി രജിസ്റ്റർചെയ്യപ്പെട്ടവർ’ എന്നും വിവർത്തനം ചെയ്യാം; פקד എന്ന ഹീബ്രു പദത്തിന് ഈ സൈനിക ജനസംഖ്യാ സന്ദർഭത്തിൽ എണ്ണുക, സൈനികസേവനത്തിനായി ചേർക്കുക എന്നീ അർഥഭാവങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ തലകൾ/തലയോട്ടികൾപ്രകാരം’; ഓരോ വ്യക്തിയെയും പ്രത്യേകം എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: c
    text: ‘സൈനികസേവനത്തിനു യോഗ്യനായ’ എന്നും അർഥമാക്കാം; ഹീബ്രു വാചകം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘യുദ്ധത്തിനു പുറപ്പെടുന്ന’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: ശിമെയോന്റെ പുത്രന്മാരിൽ
  rationale: בני എന്നത് ഇവിടെ ശിമെയോൻ ഗോത്രത്തിലെ പുരുഷവംശജരെ സൂചിപ്പിക്കുന്നു. ‘പുത്രന്മാർ’ മൂലത്തിലെ ഔപചാരിക വംശബന്ധം നിലനിർത്തുന്നു; ‘-യിൽ’ എന്ന രൂപം എണ്ണപ്പെട്ടവരെ പരിചയപ്പെടുത്തുന്ന മലയാളവാക്യഘടനയ്ക്ക് യോജിക്കുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശപരമ്പരകൾ
  rationale: ജനസംഖ്യാ-വംശാവലി സന്ദർഭത്തിൽ תולדות വംശക്രമങ്ങളെയോ തലമുറകളെയോ സൂചിപ്പിക്കുന്നു. ‘വംശപരമ്പരകൾ’ ഭരണപരവും വംശാവലിപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾ
  rationale: משפחה ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വഘടകമായ കുലത്തെ സൂചിപ്പിക്കുന്നു; സാധാരണ അണുകുടുംബം എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ ഇവിടെ കൃത്യമാണ്.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ
  rationale: בית אבות എന്ന ഇസ്രായേല്യ സാമൂഹികഘടകത്തിന്റെ പിതൃവംശാധിഷ്ഠിത ഭവനഘടനയെ ഔപചാരികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: פְּקֻדָיו
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന പദത്തിന്റെ നിഷ്ക്രിയ ജനസംഖ്യാ-രജിസ്ട്രേഷൻ അർഥം നൽകുന്നു; സൈനികമായി ‘അണിനിരത്തപ്പെട്ടവർ’ എന്ന ശക്തമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണപ്രകാരം
  rationale: ഓരോരുത്തരെയും പേരുപ്രകാരം രേഖപ്പെടുത്തി എണ്ണിയെന്ന ഔപചാരിക ജനസംഖ്യാ പ്രയോഗം അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: לְגֻלְגְּלֹתָם
  choice: ആളൊന്നായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ തലകൾ/തലയോട്ടികൾപ്രകാരം’ എന്ന വ്യക്തിഗത എണ്ണൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആളൊന്നായി’ എന്നു നൽകി; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ പുരുഷന്മാരും
  rationale: זכר ലിംഗത്തെ വ്യക്തമാക്കുന്നു. ഈ സൈനിക ജനസംഖ്യാ സന്ദർഭത്തിൽ ‘പുരുഷന്മാർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: കുറഞ്ഞ പ്രായപരിധിയായ ഇരുപതു വയസ്സും അതിനുമുകളിലുള്ളവരെയും ഉൾക്കൊള്ളുന്ന ഹീബ്രു സൂത്രവാക്യം വ്യക്തമായി നൽകുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന
  rationale: അക്ഷരാർഥമായ ‘സൈന്യത്തിലേക്കു/യുദ്ധത്തിനു പുറപ്പെടുന്ന’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘സൈനികസേവനത്തിനു യോഗ്യനായ’ എന്ന വ്യാഖ്യാനപരമായ അർഥം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
