translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ജനസംഖ്യാ പട്ടികയുടെ ഔപചാരിക സ്വരം നിലനിർത്തിയിട്ടുണ്ട്; വാക്യം അടുത്ത വാക്യത്തിലെ സംഖ്യയിലേക്കു നീളുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു പിന്നാലെ വെച്ചു.
