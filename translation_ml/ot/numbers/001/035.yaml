  text: פְּקֻדֵי/הֶ֖ם לְ/מַטֵּ֣ה מְנַשֶּׁ֑ה שְׁנַ֧יִם וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וּ/מָאתָֽיִם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/035.yaml
  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: ml
  text: മനശ്ശെ ഗോത്രത്തിൽപ്പെട്ട എണ്ണപ്പെട്ടവർ മുപ്പത്തീരായിരത്തി ഇരുനൂറുപേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ ഈ സന്ദർഭത്തിൽ פקד എന്ന ധാതുവിൽനിന്നുള്ള രൂപം കണക്കിൽ ഉൾപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എണ്ണപ്പെട്ടവർ’ എന്നത് അർഥം സ്വാഭാവികമായും നേരിട്ടും നൽകുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: ഈ ആവർത്തിത കണക്കെടുപ്പ് പ്രയോഗത്തിൽ לְמַטֵּה ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. ‘ഗോത്രത്തിൽ’ എന്നത് മനശ്ശെ ഗോത്രത്തിൽപ്പെട്ടവരെന്ന ആശയം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: מְנַשֶּׁה
  choice: മനശ്ശെ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: മുപ്പത്തിരണ്ടായിരത്തി ഇരുനൂറ്
  rationale: ഹീബ്രു സംഖ്യാക്രമത്തെ ആധുനിക മലയാളത്തിന്റെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകി കൃത്യമായ ആകെ സംഖ്യയായ 32,200 നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കണക്കെടുപ്പ് ശൈലി ഉപയോഗിച്ചു. ‘പേർ’ ചേർത്തത് ആളുകളുടെ എണ്ണം വ്യക്തമാക്കാനും വാക്യം സ്വാഭാവികമാക്കാനുമാണ്.
