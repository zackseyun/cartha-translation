  source_fidelity: 'The draft accurately renders the census formula: פְּקֻדֵיהֶם denotes those enrolled/count​ed, לְמַטֵּה identifies Manasseh tribal affiliation, and the total is correctly 32,200. Adding പേർ appropriately makes the human referent explicit in Malayalam without adding material meaning.'
