  yaml_path: translation/ot/numbers/001/027.yaml
  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: ml
  text: യെഹൂദാഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ എഴുപത്തിനാലായിരത്തി അറുനൂറുപേർ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പട്ടികയിൽ രേഖപ്പെടുത്തിയവർ.’ ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ ഈ എബ്രായ പ്രയോഗം രണ്ടുവിധത്തിലും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം ഈ ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ എണ്ണപ്പെട്ടവരെയോ രേഖപ്പെടുത്തിയവരെയോ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്; മൂലവാക്യത്തിൽ ഇവിടെ പ്രത്യേകം ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: לְ എന്ന ഉപസർഗം ഇവിടെ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യെഹൂദാഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ’ എന്ന പ്രയോഗം ഈ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: יְהוּדָה
  choice: യെഹൂദാ
  rationale: ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം നിലനിർത്തുന്നു.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: എഴുപത്തിനാലായിരത്തി അറുനൂറ്
  rationale: എബ്രായ സംഖ്യാക്രമത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ജനസംഖ്യാ കണക്കെടുപ്പ് ശൈലി. ഗോത്രനാമം ചേർത്തെഴുതി; സംഖ്യ വായിക്കാൻ സ്വാഭാവികമായ രീതിയിൽ നൽകി.
