id: NUM.1.50
reference: Numbers 1:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: ml
  text: എന്നാൽ നീ ലേവ്യർക്കു സാക്ഷ്യകൂടാരത്തിന്റെയും[a] അതിന്റെ സകല ഉപകരണങ്ങളുടെയും അതുമായി ബന്ധപ്പെട്ട സകലതിന്റെയും മേൽനോട്ടച്ചുമതല ഏൽപ്പിക്കണം. അവർ കൂടാരവും അതിന്റെ സകല ഉപകരണങ്ങളും ചുമക്കുകയും അതിന്റെ ശുശ്രൂഷ നിർവഹിക്കുകയും[b] കൂടാരത്തിനു ചുറ്റും പാളയമടിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യനിവാസം.’ מִשְׁכָּן എന്ന എബ്രായപദത്തിന് ‘നിവാസം’ എന്നും, ഈ സന്ദർഭത്തിൽ വിശുദ്ധകൂടാരം എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിനെ സേവിക്കുകയും’ അല്ലെങ്കിൽ ‘അതിനെ പരിചരിക്കുകയും.’ ഈ ക്രിയ വിശുദ്ധസ്ഥാനവുമായി ബന്ധപ്പെട്ട സേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: എന്നാൽ നീ
  rationale: മുൻവാക്യത്തിൽ ലേവ്യരെ മറ്റുള്ളവരുടെ കണക്കെടുപ്പിൽനിന്ന് ഒഴിവാക്കിയതിനോടുള്ള വൈരുധ്യം conjunction ഇവിടെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: הַפְקֵד ... עַל
  choice: … ചുമതല ഏൽപ്പിക്കണം
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം ഇവിടെ നിയമിക്കുകയോ ഉത്തരവാദിത്വം ഏൽപ്പിക്കുകയോ ചെയ്യുന്നതാണ്. ആവർത്തിച്ച עַל സൂചിപ്പിക്കുന്ന മേൽനോട്ടത്തിന്റെ ആശയം മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: സാക്ഷ്യനിവാസം
  rationale: מִשְׁכָּן ദൈവസാന്നിധ്യത്തിന്റെ ചലനക്ഷമമായ വിശുദ്ധനിവാസത്തെയും הָעֵדֻת അവിടെ സൂക്ഷിച്ച ഉടമ്പടിസാക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്നു. സാങ്കേതികമായ ആരാധനാസന്ദർഭം നിലനിർത്തുന്ന സംക്ഷിപ്ത മലയാളരൂപമാണിത്.
- source_word: כֵּלָיו
  choice: അതിന്റെ സകല ഉപകരണങ്ങൾ
  rationale: കൂടാരവുമായി ബന്ധപ്പെട്ട പാത്രങ്ങളും സാമഗ്രികളും ഉൾക്കൊള്ളുന്ന വിശാലമായ പദമാണ്; ‘ഉപകരണങ്ങൾ’ ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: അതുമായി ബന്ധപ്പെട്ട സകലതും
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അതിന്റെതായ സകലതും’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി, നിവാസത്തിന്റെ അനുബന്ധവസ്തുക്കളെ ഉൾക്കൊള്ളുന്ന അർഥം നൽകുന്നു; അവയെല്ലാം അതിനകത്താണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: יִשְׂאוּ
  choice: ചുമക്കുക
  rationale: യാത്രയിൽ നിവാസവും ഉപകരണങ്ങളും ശരീരമായി വഹിക്കുന്ന പ്രവൃത്തിയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: יְשָׁרְתֻהוּ
  choice: അതിനു ശുശ്രൂഷ ചെയ്യുക
  rationale: שרת എന്ന പീയേൽ ക്രിയ വിശുദ്ധസ്ഥാനവുമായി ബന്ധപ്പെട്ട ഔദ്യോഗിക സേവനത്തെ സൂചിപ്പിക്കുന്നു. വസ്തുസർവ്വനാമം നിലനിർത്തിക്കൊണ്ട് ആരാധനാസേവനത്തിന്റെ ഭാവവും ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: നിവാസത്തിനു ചുറ്റും പാളയമടിക്കണം
  rationale: വിശുദ്ധനിവാസത്തെ ചുറ്റിയുള്ള അവരുടെ പാളയസ്ഥാനവും നിർദേശാത്മകമായ ക്രിയാഭാവവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: מִשְׁכָּן എന്ന ആരാധനാസാങ്കേതിക പദത്തിന്റെ പരിഭാഷ
  choice: നിവാസം / സാക്ഷ്യനിവാസം
  alternative: സാക്ഷ്യകൂടാരം
  rationale: മൂലപദത്തിന്റെ അടിസ്ഥാനമായ ‘വസിക്കുക’ എന്ന ആശയവും ചലനക്ഷമമായ വിശുദ്ധസ്ഥാനമെന്ന സാങ്കേതിക അർഥവും ‘നിവാസം’ നിലനിർത്തുന്നു. ‘കൂടാരം’ സാധ്യമായ പരിഭാഷയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: שרת എന്ന ക്രിയയുടെ വിശുദ്ധസേവനഭാവം
  choice: ശുശ്രൂഷ ചെയ്യുക
  alternative: സേവിക്കുക / പരിപാലിക്കുക
  rationale: ലേവ്യരുടെ വിശുദ്ധസ്ഥാനസംബന്ധമായ സേവനം സൂചിപ്പിക്കുമ്പോഴും പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക പൗരോഹിത്യസിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാത്ത പ്രയോഗമാണിത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ഭരണചുമതലയും വിശുദ്ധസേവനവും വേർതിരിച്ചറിയാൻ ‘ചുമതല ഏൽപ്പിക്കുക’, ‘ശുശ്രൂഷ ചെയ്യുക’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
