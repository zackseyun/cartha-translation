revisions:
- from: എന്നാൽ നീ ലേവ്യരെ സാക്ഷ്യനിവാസത്തിന്റെയും[a] അതിന്റെ സകല ഉപകരണങ്ങളുടെയും അതുമായി ബന്ധപ്പെട്ട സകലതിന്റെയും ചുമതല ഏൽപ്പിക്കണം. അവർ നിവാസവും അതിന്റെ സകല ഉപകരണങ്ങളും ചുമക്കുകയും അതിനു ശുശ്രൂഷ ചെയ്യുകയും[b] നിവാസത്തിനു ചുറ്റും പാളയമടിക്കുകയും വേണം.
  to: എന്നാൽ നീ ലേവ്യർക്കു സാക്ഷ്യകൂടാരത്തിന്റെയും[a] അതിന്റെ സകല ഉപകരണങ്ങളുടെയും അതുമായി ബന്ധപ്പെട്ട സകലതിന്റെയും മേൽനോട്ടച്ചുമതല ഏൽപ്പിക്കണം. അവർ കൂടാരവും അതിന്റെ സകല ഉപകരണങ്ങളും ചുമക്കുകയും അതിന്റെ ശുശ്രൂഷ നിർവഹിക്കുകയും[b] കൂടാരത്തിനു ചുറ്റും പാളയമടിക്കുകയും വേണം.
  rationale: The revision resolves the Malayalam syntactic ambiguity in the appointment clause, uses a more established and natural term for the portable sanctuary, and refines the sacred-service wording and its footnote without adding theological interpretation. Footnote anchors remain attached to the relevant expressions.
