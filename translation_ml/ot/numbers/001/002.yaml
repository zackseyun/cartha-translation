source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: ml
  text: യിസ്രായേൽമക്കളുടെ മുഴുവൻ സമൂഹത്തെയും അവരുടെ കുലങ്ങൾക്കും പിതൃഭവനങ്ങൾക്കും അനുസരിച്ച്, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഓരോ പുരുഷനെയും തലതോറും എണ്ണുക[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘തല ഉയർത്തുക’; ഇവിടെ ജനസംഖ്യാകണക്കിനായി എണ്ണുക, അഥവാ പേരുചേർക്കുക, എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘അവരുടെ തലയോട്ടികൾപ്രകാരം’ അഥവാ ‘തലതോറും’; ഓരോ വ്യക്തിയെയും പ്രത്യേകം എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: കണക്കെടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘തല ഉയർത്തുക’ എന്നാണെങ്കിലും ഈ ഭരണപരമായ സന്ദർഭത്തിൽ ജനസംഖ്യാകണക്കിനായി എണ്ണുകയോ പേരുചേർക്കുകയോ ചെയ്യുക എന്ന പ്രയോഗാർഥമാണ്. ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘കണക്കെടുക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: כָּל עֲדַת
  choice: മുഴുവൻ സമൂഹത്തിന്റെയും
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ സംഘടിതമായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാസംബന്ധമായ അനാവശ്യ പ്രത്യേകാർഥം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ
  rationale: എബ്രായത്തിലെ പുത്രസംബന്ധിയായ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ പതിഞ്ഞതും സ്വാഭാവികവുമായ ‘യിസ്രായേൽമക്കൾ’ ഉപയോഗിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾ അനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ രക്തബന്ധിത വിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആ സാമൂഹിക ഘടന ‘കുലങ്ങൾ’ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ അനുസരിച്ച്
  rationale: പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ വംശീയ-ഗാർഹിക ഘടകങ്ങളാണ് ഉദ്ദേശ്യം. ‘പിതൃഭവനങ്ങൾ’ മൂലഭാഷയുടെ രൂപവും പുരാതന സാമൂഹിക ഘടനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: പേരുപേരായുള്ള ഔദ്യോഗിക രേഖപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന എബ്രായ ഭരണപരമായ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: כָּל זָכָר
  choice: ഓരോ പുരുഷനെയും
  rationale: זָכָר പുരുഷലിംഗത്തിലുള്ള വ്യക്തികളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു. ഈ മനുഷ്യജനസംഖ്യാ സന്ദർഭത്തിൽ ‘പുരുഷൻ’ മലയാളത്തിൽ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: לְגֻלְגְּלֹתָם
  choice: ആളൊന്നായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ തലയോട്ടികൾ/തലകൾപ്രകാരം’ എന്ന എബ്രായ പ്രയോഗം ഓരോ വ്യക്തിയെയും പ്രത്യേകം എണ്ണുക എന്നാണ്. ‘ആളൊന്നായി’ അതിന്റെ പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു; ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭരണപരമായ ശൈലി സ്വീകരിച്ചു. എബ്രായ വാക്യത്തിലെ കുലം, പിതൃവംശഘടന, പേരുപേരായുള്ള കണക്ക്, പുരുഷന്മാരെ മാത്രമുള്ള എണ്ണൽ എന്നിവ നിലനിർത്തി; ദുഷ്കരമായ രണ്ട് എബ്രായ പ്രയോഗങ്ങളുടെ അക്ഷരാർഥം അടിക്കുറിപ്പുകളിൽ നൽകി.
