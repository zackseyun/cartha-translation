  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: ml
  text: യാഹ്‌വെ മോശയോടു കല്പിച്ചതുപോലെതന്നെ, മോശെ സീനായി മരുഭൂമിയിൽ അവരെ എണ്ണി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ പട്ടികപ്പെടുത്തി,’ ‘അവരുടെ കണക്കെടുത്തു,’ അല്ലെങ്കിൽ ‘അവരെ അണിനിരത്തി കണക്കെടുത്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായ ക്രിയയ്ക്ക് ആളുകളെ എണ്ണുക, പട്ടികപ്പെടുത്തുക, അല്ലെങ്കിൽ ജനസംഖ്യാകണക്കെടുപ്പിനായി രജിസ്റ്റർ ചെയ്യുക എന്നിങ്ങനെ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: ദൈവകല്പനയോടുള്ള കൃത്യമായ അനുസരണം സൂചിപ്പിക്കുന്ന താരതമ്യപ്രയോഗം; മലയാളത്തിൽ ‘പോലെതന്നെ’ സ്വാഭാവികമായി ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്ന ക്രിയ; സന്ദർഭത്തിൽ ‘കല്പിച്ചു’ എന്നത് ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: אֶת מֹשֶׁה
  choice: മോശയോടു
  rationale: אֶת മോശെയെ ‘കല്പിച്ചു’ എന്ന ക്രിയയുടെ വ്യക്തിസംബന്ധിയായ കർമമായി അടയാളപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘മോശയോടു കല്പിച്ചു’ എന്നാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: וַיִּפְקְדֵם
  choice: അവരെ എണ്ണിത്തിട്ടപ്പെടുത്തി
  rationale: פקד എന്ന ക്രിയ ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ ആളുകളെ ഔദ്യോഗികമായി എണ്ണി രേഖപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എണ്ണിത്തിട്ടപ്പെടുത്തി’ സാധാരണ എണ്ണലിനേക്കാൾ ഈ ഭരണപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: בְּמִדְבַּר סִינָי
  choice: സീനായി മരുഭൂമിയിൽവെച്ച്
  rationale: എബ്രായ ഘടനയിലെ സ്ഥലസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമത്തെ ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് മാറ്റാതെ സംരക്ഷിക്കുന്നു. മലയാള വായനക്കാർക്കിടയിൽ ദൈവനാമത്തിന്റെ സ്ഥാപിതമായ രൂപം ‘യഹോവ’ ആയതിനാൽ അതാണ് മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചത്; ഉച്ചാരണപുനർനിർമാണത്തെക്കുറിച്ച് ഉറപ്പില്ലാത്തതിനാൽ മറ്റൊരു രൂപം നിർബന്ധിച്ചിട്ടില്ല.
- issue: פקד എന്ന ക്രിയയുടെ ജനസംഖ്യാകണക്കെടുപ്പ് ഭാവം
  choice: എണ്ണിത്തിട്ടപ്പെടുത്തി
  alternative: എണ്ണി / അണിനിരത്തി കണക്കെടുത്തു
  rationale: ക്രിയയ്ക്ക് എണ്ണുക, പട്ടികപ്പെടുത്തുക, സൈനികമായി അണിനിരത്തി കണക്കെടുക്കുക എന്നീ പരസ്പരം മൂടുന്ന അർഥങ്ങൾ ഉണ്ടാകാം. മുഖ്യപാഠം കണക്കെടുപ്പിന്റെ ആശയം നൽകുന്നു; പാദക്കുറിപ്പ് യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കല്പിച്ചു’, ‘സീനായി മരുഭൂമി’ എന്നീ പരിചിത ബൈബിൾ പ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ, പൗരാണികമോ അത്യന്തം സാങ്കേതികമോ ആയ ഭാഷ ഒഴിവാക്കി. വാക്യത്തിലെ ദൈവകല്പനയോടുള്ള അനുസരണവും ഔദ്യോഗിക കണക്കെടുപ്പിന്റെ ഭാവവും ഒരുപോലെ സംരക്ഷിച്ചു.
