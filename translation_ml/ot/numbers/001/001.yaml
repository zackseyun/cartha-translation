id: NUM.1.1
reference: Numbers 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: ml
  text: 'യഹ്‌വെ സീനായ് മരുഭൂമിയിലെ സമാഗമകൂടാരത്തിൽവെച്ച് മോശെയോടു, അവർ ഈജിപ്ത് ദേശത്തുനിന്ന് പുറപ്പെട്ടശേഷമുള്ള രണ്ടാം വർഷത്തിലെ രണ്ടാം മാസത്തിന്റെ ഒന്നാം ദിവസം, ഇപ്രകാരം പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവിക വചനത്തെ പരിചയപ്പെടുത്തുന്ന സാധാരണ ആഖ്യാനക്രിയയാണ്. മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായ ദൈവിക-വചന പ്രയോഗം; തുടർന്നുള്ള לֵאמֹר-നെയും ‘ഇപ്രകാരം’ എന്ന ഘടനയിലൂടെ ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ അതിന്റെ സാധാരണ ശബ്ദലിപ്യന്തരണം നൽകുന്നു.
- source_word: בְּמִדְבַּר סִינַי
  choice: സീനായ് മരുഭൂമിയിലെ
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വനാന്തര/മരുഭൂമി പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ഭൂമിശാസ്ത്രപരമായി വ്യക്തമായ ‘മരുഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഈ പദസമുച്ചയത്തിന്റെ സുതാര്യമായ അർഥം ‘കൂടിക്കാഴ്ച/സമാഗമത്തിനുള്ള കൂടാരം’ എന്നതാണ്; പരമ്പരാഗതമായ വിശാല സാങ്കേതികപദം ഉപയോഗിച്ച് വ്യത്യാസം മായ്ച്ചുകളയുന്നില്ല.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: രണ്ടാം മാസം ഒന്നാം തീയതി
  rationale: എബ്രായ തീയതിപ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: രണ്ടാം വർഷം
  rationale: കാലസൂചനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: לְצֵאתָם
  choice: അവർ ... പുറപ്പെട്ടതിന്റെ
  rationale: പ്രത്യയത്തോടുകൂടിയ ക്രിയാനാമരൂപം യിസ്രായേല്യരുടെ പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്ത് ദേശത്തുനിന്ന്
  rationale: മൂലത്തിലെ ‘ദേശം’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് ആധുനികമായി തിരിച്ചറിയാവുന്ന സ്ഥലനാമം ഉപയോഗിക്കുന്നു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ നാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്ന രൂപം Yahweh എന്ന പുനർനിർമിത ഉച്ചാരണത്തോട് അടുത്തതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമായ കാലക്രമം മുൻനിർത്തി വാക്യം ക്രമീകരിച്ചു. ദൈവിക വചനത്തിന് യോജിച്ച മാന്യതയ്ക്കായി ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചെങ്കിലും ഭാഷ അതിപുരാതനമാക്കിയിട്ടില്ല. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പിന്റെ സ്ഥാനം ആശയപരമായി ‘സമാഗമകൂടാരം’ എന്ന പദത്തോടു ചേർത്തു.
