source:
  edition: WLC
  text: פְּקֻדֵי/הֶ֖ם לְ/מַטֵּ֣ה שִׁמְע֑וֹן תִּשְׁעָ֧ה וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וּ/שְׁלֹ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/023.yaml
  text: their counted men from the tribe of Simeon were fifty-nine thousand three hundred.
translation:
  language: ml
  text: ശിമെയോൻ ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ അമ്പത്തൊമ്പതിനായിരത്തി മുന്നൂറുപേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയരൂപം ഈ ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ പട്ടികയിൽ എണ്ണപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ എന്നത് അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു; ഈ വാക്യത്തിൽ പ്രത്യേകം ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർക്കുന്നില്ല. പ്രത്യയത്തിലെ ബന്ധസൂചന ഗോത്രത്തെക്കുറിച്ചുള്ള മലയാള ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: לְמַטֵּה
  choice: ഗോത്രത്തിൽ
  rationale: ഈ ആവർത്തിത കണക്കെടുപ്പ് പ്രയോഗത്തിൽ לְמַטֵּה ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ’ എന്നത് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: שִׁמְעוֹן
  choice: ശിമെയോൻ
  rationale: എബ്രായ നാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം നിലനിർത്തുന്നു.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: അമ്പത്തൊമ്പതിനായിരത്തി മുന്നൂറ്
  rationale: എബ്രായത്തിലെ കൃത്യമായ ആകെ സംഖ്യ ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരീതിയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിന്റെ ചുരുക്കം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു.
