source:
  edition: WLC
  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: ml
  text: ഇരുപതു വയസ്സു മുതലുള്ള, ഇസ്രായേലിൽ സൈനികസേവനത്തിനു പുറപ്പെടുന്ന ഓരോ പുരുഷനെയും[a] നീയും അഹരോനും അവരുടെ സൈനിക വിഭാഗങ്ങൾ പ്രകാരം[b] എണ്ണണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുദ്ധത്തിനു പുറപ്പെടുന്ന ഓരോ പുരുഷനെയും.’ എബ്രായ പ്രയോഗം സൈനികസേവനത്തിന് അർഹരായവരെ സൂചിപ്പിക്കുന്ന ഒരു സൈനിക പ്രയോഗമാണ്; ഈ അധ്യായത്തിന്റെ സന്ദർഭം പുരുഷന്മാരെ വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ സൈനിക സംഘങ്ങൾ പ്രകാരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ഇരുപത് വയസ്സ് എന്ന കുറഞ്ഞ പ്രായപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: כָּל יֹצֵא צָבָא
  choice: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന ഓരോ പുരുഷനെയും
  rationale: ഇത് സൈനികസേവനത്തിന് അർഹരായവരെ സൂചിപ്പിക്കുന്ന സൈനിക പ്രയോഗമാണ്. അധ്യായത്തിന്റെ പശ്ചാത്തലം പുരുഷന്മാരുടെ ജനസംഖ്യാകണക്കെടുപ്പായതിനാൽ ‘പുരുഷൻ’ എന്നു വ്യക്തമാക്കുന്നു; അതേസമയം ‘പുറപ്പെടുന്ന’ എന്ന മൂർത്തമായ എബ്രായ രൂപവും നിലനിർത്തുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: ദേശീയ സമൂഹത്തിനുള്ളിലെ സൈനികസേവനയോഗ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: תִּפְקְדוּ אֹתָם
  choice: എണ്ണണം
  rationale: ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ പദം സേവനത്തിനായി രജിസ്റ്റർ ചെയ്യുക അഥവാ എണ്ണുക എന്നർഥം വഹിക്കുന്നു. ‘എണ്ണണം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: לְצִבְאֹתָם
  choice: അവരുടെ സൈനികവിഭാഗങ്ങൾപ്രകാരം
  rationale: സൈനികസംഘടന അനുസരിച്ചുള്ള വർഗീകരണം സൂചിപ്പിക്കുന്നു; ‘സൈനികവിഭാഗങ്ങൾ’ അർഥം വ്യക്തമായി നൽകുന്നു, പുരാതനഭാവമുള്ള പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: אַתָּה וְאַהֲרֹן
  choice: നീയും അഹരോനും
  rationale: എണ്ണൽ നിർവഹിക്കേണ്ടവരായ മോശെയെയും അഹരോനെയും എബ്രായത്തിലെ ഊന്നലോടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സൈനികസേവനയോഗ്യതയിലെ ലിംഗസൂചന
  choice: ഓരോ പുരുഷനെയും
  alternative: ഓരോരുത്തരെയും
  rationale: ഈ അധ്യായത്തിലെ കണക്കെടുപ്പ് സൈനികസേവനത്തിന് അർഹരായ പുരുഷന്മാരെക്കുറിച്ചുള്ളതാണ്. അതിനാൽ ലിംഗനിരപേക്ഷമായ രൂപത്തേക്കാൾ ‘പുരുഷൻ’ എന്നത് ഉറവിടസന്ദർഭത്തോട് കൃത്യമാണ്.
- issue: יֹצֵא צָבָא എന്ന സൈനിക പ്രയോഗത്തിന്റെ അർഥം
  choice: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന
  alternative: യുദ്ധത്തിനു പുറപ്പെടുന്ന
  rationale: എബ്രായത്തിലെ ‘പുറപ്പെടുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, ഇത് ഒരു പ്രത്യേക യുദ്ധയാത്രയെക്കാൾ സൈനികസേവനത്തിനുള്ള യോഗ്യതയെ സൂചിപ്പിക്കുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘സൈനികസേവനം’, ‘സൈനികവിഭാഗങ്ങൾ’ എന്നീ പദങ്ങൾ പുരാതന സൈനികപ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
