source:
  edition: WLC
  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: ml
  text: മോശെയും അഹരോനും ഇസ്രായേലിന്റെ നേതാക്കളും എണ്ണിയവർ ഇവരാണ്. ആ നേതാക്കൾ പന്ത്രണ്ടു പുരുഷന്മാരായിരുന്നു; ഓരോരുത്തനും തന്റെ പിതൃഭവനത്തിനുവേണ്ടിയുള്ളവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പിതൃഭവനം” എന്നത് ഇസ്രായേലിന്റെ ഗോത്രഘടനയിലെ പിതൃവംശപരമായ കുടുംബത്തെയോ കുലവിഭാഗത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ ബഹുവചനരൂപം ഇവിടെ ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെടുത്തി എണ്ണപ്പെട്ട വ്യക്തികളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; അമൂർത്തമായ ആകെ സംഖ്യയെ മാത്രമല്ല.
- source_word: פָּקַד
  choice: എണ്ണിയത്
  rationale: സംഖ്യാപുസ്തകം 1-ലെ പശ്ചാത്തലത്തിൽ ഈ ക്രിയ ജനസംഖ്യാകണക്കെടുക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ ‘എണ്ണുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ പ്രഭുക്കന്മാർ
  rationale: נָשִׂיא ഇവിടെ ഗോത്രപ്രതിനിധികളായ പ്രമുഖ നേതാക്കളെ സൂചിപ്പിക്കുന്നു. ‘പ്രഭുക്കന്മാർ’ പദവിയുടെ ഔദ്യോഗികവും സാമൂഹികവുമായ ഭാവം നിലനിർത്തുന്നു; രാജകുമാരന്മാർ എന്ന വംശപരമായ അർഥം വരുത്തുന്നില്ല.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: പന്ത്രണ്ടുപേർ
  rationale: സന്ദർഭത്തിൽ പരാമർശിക്കപ്പെടുന്ന പ്രഭുക്കന്മാർ പുരുഷന്മാരാണെന്ന് വ്യക്തമാണ്. മലയാളത്തിലെ സ്വാഭാവിക എണ്ണൽപ്രയോഗമായ ‘പന്ത്രണ്ടുപേർ’ ഉപയോഗിച്ചു; ലിംഗസൂചന സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: אִישׁ אֶחָד
  choice: ഓരോരുത്തർ വീതം
  rationale: ഒരാൾ വീതം എന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: לְבֵית אֲבֹתָיו
  choice: ഓരോ പിതൃഭവനത്തിനും
  rationale: ഈ പ്രയോഗം ഇസ്രായേലിന്റെ പിതൃവംശാധിഷ്ഠിതമായ കുടുംബ-കുല ഘടകത്തെ സൂചിപ്പിക്കുന്നു. ‘പിതൃഭവനം’ ആ സാമൂഹിക ഘടനയും പ്രതിനിധിത്വബന്ധവും നിലനിർത്തുന്നു.
- source_word: הָיוּ
  choice: അവരോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ഹീബ്രു ക്രിയയെ ഒഴിവാക്കാതെ, പന്ത്രണ്ട് പ്രഭുക്കന്മാർ മോശെയോടും അഹരോനോടും കൂടെ എണ്ണലിൽ പങ്കെടുത്തു എന്ന വാക്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
