source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: ml
  text: 'യൂദായുടെ പുത്രന്മാരുടെ കാര്യത്തിൽ, അവരുടെ വംശപരമ്പരകൾപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപത് വയസ്സും അതിൽ കൂടുതലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരെയും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യുദ്ധസേവനത്തിന് യോഗ്യരായ എല്ലാ പുരുഷന്മാരെയും.’ എബ്രായപ്രയോഗം സൈനികസേവനത്തിന് അർഹരായവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: യൂദായുടെ പുത്രന്മാരെ
  rationale: בני എന്നതിന്റെ അടിസ്ഥാനരൂപമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; ഇവിടെ അത് യൂദാഗോത്രത്തിലെ പുരുഷാംഗങ്ങളെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന എണ്ണൽഘടനയ്ക്കായി ദ്വിതീയാവിഭക്തി ഉപയോഗിച്ചു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലികൾപ്രകാരം
  rationale: തലമുറകൾ, വംശപരമ്പര, വംശാവലിരേഖകൾ എന്നീ അർഥസാധ്യതകളുള്ള പദം; ജനസംഖ്യാകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ വംശക്രമത്തെ സ്വാഭാവികമായി അറിയിക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു, എഴുതപ്പെട്ട രേഖകളാണെന്ന് നിർബന്ധിച്ചില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്രത്തിനുള്ളിലെ ഉപവിഭാഗമായ משפחהയെ ആധുനിക മലയാളത്തിൽ ‘കുലം’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ‘അവരുടെ പിതാക്കന്മാരുടെ ഭവനം’ എന്ന എബ്രായ സാമൂഹികഘടന സംക്ഷിപ്തമായും ഔപചാരികമായും നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: ഓരോരുത്തരെയും പേരുപ്രകാരം എണ്ണുന്നുവെന്ന മൂലപാഠത്തിലെ പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ പ്രായപരിധി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരെയും
  rationale: പദാനുപദമായി ‘സൈന്യത്തിലേക്കു/യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും’; സന്ദർഭത്തിലെ സൈനികപ്രായമുള്ള പുരുഷന്മാരുടെ കണക്കെടുപ്പ് വ്യക്തമാക്കുമ്പോഴും ‘കഴിവുള്ള’ എന്ന ആശയം പ്രധാനവാചകത്തിൽ ചേർക്കാതെ മൂലപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: ജനസംഖ്യാകണക്കെടുപ്പിലെ ലിംഗസൂചന
  choice: എല്ലാ പുരുഷന്മാരെയും
  alternative: എല്ലാവരെയും
  rationale: എബ്രായരൂപം വ്യാകരണപരമായി പുല്ലിംഗമാണ്; സന്ദർഭം യുദ്ധസേവനത്തിനുള്ള പ്രായത്തിലെ പുരുഷന്മാരെ എണ്ണുന്നതുമാണ്. അതിനാൽ ലിംഗസൂചന പൊതുവാക്കാതെ നിലനിർത്തി.
- issue: כֹּל יֹצֵא צָבָא എന്ന പ്രയോഗത്തിലെ യോഗ്യതാസൂചന
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന
  alternative: യുദ്ധസേവനത്തിന് യോഗ്യരായ
  rationale: മൂലപാഠം നേരിട്ട് ‘യോഗ്യരായ’ എന്നു പറയുന്നില്ല; ആ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ അറിയിച്ചുകൊണ്ട് പ്രധാനവാചകത്തിലെ യഥാർഥ പ്രയോഗവും അതിന്റെ ചെറിയ അർഥതുറപ്പും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ നിലവാരമലയാളം ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ ‘എണ്ണി’ എന്ന നിർദേശത്തിന്റെ പട്ടികാസ്വഭാവം തുടരുന്നതിനാൽ, മലയാളത്തിൽ അർഥപൂർണമായി ബന്ധിപ്പിക്കാൻ അവസാനം ‘എണ്ണി’ ചേർത്തു. ആവർത്തിക്കുന്ന לְ ഘടന ‘…പ്രകാരം’ എന്ന സമാന്തരരൂപത്തിൽ നിലനിർത്തി; അടിക്കുറിപ്പിന്റെ സൂചകം അത് വിശദീകരിക്കുന്ന സൈനികപ്രയോഗത്തിനരികിൽ വെച്ചു.
