  to: 'യൂദായുടെ പുത്രന്മാരുടെ കാര്യത്തിൽ, അവരുടെ വംശപരമ്പരകൾപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപത് വയസ്സും അതിൽ കൂടുതലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരെയും[a]:'
