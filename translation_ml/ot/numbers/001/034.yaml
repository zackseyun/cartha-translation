source:
  edition: WLC
  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: ml
  text: മനശ്ശെയുടെ പുത്രന്മാരിൽ നിന്ന്, അവരുടെ തലമുറകൾ അനുസരിച്ചും അവരുടെ കുലങ്ങൾ അനുസരിച്ചും അവരുടെ പിതൃഭവനങ്ങൾ അനുസരിച്ചും പേരുകളുടെ എണ്ണമനുസരിച്ചും, ഇരുപത് വയസ്സുമുതൽ അതിനു മുകളിലുള്ള സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യുദ്ധത്തിനു പുറപ്പെടുന്ന ഓരോ പുരുഷനും.” ഹീബ്രു പ്രയോഗം സൈനികചുമതലയ്ക്ക് യോഗ്യരായവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: മനശ്ശെയുടെ പുത്രന്മാരിൽ
  rationale: ഗോത്രതലക്കെട്ടായി വരുന്ന לְ-യെ ചുറ്റുമുള്ള അപൂർണ്ണമായ ജനസംഖ്യാകണക്കെടുപ്പ് വാക്യഘടനയോട് ചേർത്ത് ‘-യിൽ’ എന്നു നൽകി; בנים എന്നതിന്റെ വംശപരമായ ‘പുത്രന്മാർ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലികൾപ്രകാരം
  rationale: ഈ കണക്കെടുപ്പ് സൂത്രവാക്യത്തിൽ പദം തലമുറകളിലൂടെയുള്ള വംശപരമ്പരയെയും വംശവിഭാഗങ്ങളെയും സൂചിപ്പിക്കുന്നു; ‘വംശാവലി’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളെയാണ് מִשְׁפָּחָה ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക അണുകുടുംബം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘കുലങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പുരാതന ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിത സാമൂഹിക ഘടകത്തെ ചുരുക്കമായും ഔപചാരികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: ഓരോ വ്യക്തിയെയും പേരെടുത്ത് എണ്ണുന്ന കണക്കെടുപ്പ് ഭാഷയെ ഹീബ്രുവിനോട് അടുത്തും മലയാളത്തിൽ വ്യക്തമായും നൽകുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സുമുതൽ അതിനു മുകളിലേക്കുള്ള
  rationale: സൈനികയോഗ്യതയ്ക്കുള്ള പ്രായപരിധി സൂചിപ്പിക്കുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: כֹּל יֹצֵא צָבָא
  choice: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും
  rationale: צָבָא ഇവിടെ സംഘടിത സൈനികചുമതലയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം ഇരുപതു വയസ്സിനു മുകളിലുള്ള പുരുഷന്മാരുടെ സൈനിക കണക്കെടുപ്പായതിനാൽ പുരുഷലിംഗസൂചന വ്യക്തമായി നിലനിർത്തി.
theological_decisions:
- issue: കണക്കെടുപ്പിലെ ലിംഗസൂചന
  choice: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും
  alternative: സൈനികസേവനത്തിനു പുറപ്പെടുന്ന എല്ലാവരും
  rationale: സന്ദർഭം സൈനികയോഗ്യപ്രായമുള്ള ഇസ്രായേല്യ പുരുഷന്മാരുടെ കണക്കെടുപ്പാണ്; അതിനാൽ ഹീബ്രുവിലെ സന്ദർഭനിർണിത പുരുഷസൂചന ലിംഗനിരപേക്ഷമാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ കണക്കെടുപ്പ് ശൈലി. ആവർത്തിത ഹീബ്രു സൂത്രഘടന ‘-പ്രകാരം/മനുസരിച്ച്’ എന്ന സമാന്തരരൂപങ്ങളിലൂടെ പരമാവധി നിലനിർത്തി.
