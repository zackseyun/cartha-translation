  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: ml
  text: 'ആശേരിന്റെ പുത്രന്മാരെ സംബന്ധിച്ച്: അവരുടെ വംശപരമ്പരപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സുമുതൽ അതിനു മുകളിലുള്ള യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം, ‘യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും’; സൈനികസേവനത്തിന് യോഗ്യരായവരെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: ആശേരിന്റെ പുത്രന്മാരിൽ
  rationale: לְ ഇവിടെ ഗോത്രത്തിന്റെ ജനസംഖ്യാകണക്കെടുപ്പ് വിഭാഗത്തെ അവതരിപ്പിക്കുന്നു. ‘പുത്രന്മാർ’ എന്നത് മൂലത്തിലെ പുത്രത്വ-ഗോത്രഭാഷ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ആശേരിന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലിപ്രകാരം
  rationale: ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ പദം തലമുറകളിലൂടെയുള്ള വംശക്രമത്തെയോ വംശവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘വംശാവലി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എഴുതപ്പെട്ട രേഖകൾ മാത്രമാണെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനകത്തെ ബന്ധുത്വവിഭാഗമാണ്. വിശാലമായ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ ആ സാമൂഹിക ഘടന വ്യക്തമാക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ഇസ്രായേല്യരുടെ പിതൃവംശാധിഷ്ഠിത ബന്ധുത്വഘടകത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ‘പിതാക്കന്മാരുടെ ഭവനം’ എന്ന പ്രയോഗം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: വ്യക്തികളെ പേരുപേരായി എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: പ്രായപരിധി ഇരുപത് വയസ്സിൽ ആരംഭിച്ച് അതിനു മുകളിലുള്ളവരെയെല്ലാം ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ പ്രായനിർദേശമായി വിവർത്തനം ചെയ്തു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന ഏവരും
  rationale: മൂലത്തിലെ സൈനിക പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ഇത് യഥാർഥത്തിൽ അപ്പോൾ യുദ്ധത്തിനു പോകുന്നവരെ മാത്രം അല്ല, സൈനികസേവനത്തിന് യോഗ്യരായവരെയും സൂചിപ്പിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള ശൈലി ഉപയോഗിച്ചു. എബ്രായ ജനസംഖ്യാകണക്കെടുപ്പ് സൂത്രവാക്യത്തിന്റെ ആവർത്തനഘടന കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും ‘വംശാവലി’ പോലുള്ള സ്വാഭാവിക മലയാളപദങ്ങൾ തിരഞ്ഞെടുത്തു. തുടർന്നുള്ള വാക്യത്തിൽ എണ്ണം വരുന്നതിനാൽ മൂലപാഠത്തിലെ അപൂർണമായ പട്ടികാഭിമുഖ ഘടനയും അവസാനത്തെ ദ്വിബിന്ദുവും നിലനിർത്തി.
