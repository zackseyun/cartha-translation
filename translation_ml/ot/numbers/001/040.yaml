  to: 'ആശേരിന്റെ പുത്രന്മാരെ സംബന്ധിച്ച്: അവരുടെ വംശപരമ്പരപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപതു വയസ്സുമുതൽ അതിനു മുകളിലുള്ള യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാവരും[a]:'
