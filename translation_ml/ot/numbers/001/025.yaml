  yaml_path: translation/ot/numbers/001/025.yaml
  text: Those counted from the tribe of Gad were forty-five thousand six hundred fifty.
translation:
  language: ml
  text: ഗാദ് ഗോത്രത്തിൽ എണ്ണപ്പെട്ടവർ നാൽപ്പത്തയ്യായിരത്തി അറുനൂറ്റമ്പത് പേർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിൽ ഔദ്യോഗികമായി എണ്ണി രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്ന ഹീബ്രു പദത്തിന്റെ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ വിവർത്തനം.
- source_word: לְמַטֵּה גָד
  choice: ഗാദ് ഗോത്രത്തിൽ
  rationale: מַטֶּה ഇവിടെ വംശീയ-ഗോത്ര വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഗോത്രം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: നാൽപ്പത്തയ്യായിരത്തി അറുനൂറ്റമ്പത്
  rationale: 45,650 എന്ന ഹീബ്രു സംഖ്യയെ അർഥം കൃത്യമായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള സംഖ്യാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. പട്ടികാസ്വഭാവമുള്ള മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും കണക്കെടുപ്പ്-സന്ദർഭവും നിലനിർത്തിയിരിക്കുന്നു.
