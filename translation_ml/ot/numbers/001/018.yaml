  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: ml
  text: അവർ രണ്ടാം മാസത്തിന്റെ ഒന്നാം തീയതി മുഴുവൻ സമൂഹത്തെയും വിളിച്ചുകൂട്ടി. പിന്നെ അവർ തങ്ങളുടെ കുലങ്ങൾക്കും പിതൃഭവനങ്ങൾക്കും അനുസരിച്ച് വംശാവലിയിൽ പേര് രജിസ്റ്റർ ചെയ്തു[a]; ഇരുപത് വയസ്സും അതിൽ കൂടുതലും പ്രായമുള്ളവരുടെ പേരുകൾ എണ്ണി, ഓരോരുത്തരുടേതായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ വംശപരമ്പര പ്രഖ്യാപിച്ചു’ അഥവാ ‘വംശാവലി അനുസരിച്ച് പട്ടികയിൽ ചേർന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. വംശപരമ്പരയുടെ അടിസ്ഥാനത്തിലുള്ള രജിസ്ട്രേഷനെ സൂചിപ്പിക്കുന്ന അപൂർവമായ എബ്രായ ക്രിയയാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവരവരുടെ തലപ്രകാരം’ അഥവാ ‘തലയോട്ടിപ്രകാരം’; ഓരോ വ്യക്തിയെയും പ്രത്യേകം എണ്ണി എന്നർഥമുള്ള ശൈലിയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: വിളിച്ചുകൂട്ടി
  rationale: קהל എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ആളുകളെ ഒന്നിച്ചുകൂട്ടുക എന്ന കാരണാർഥം നൽകുന്നു; ‘വിളിച്ചുകൂട്ടി’ ആ പ്രവർത്തനവും ഉദ്ദേശ്യപൂർവമായ സമ്മേളനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הָעֵדָה
  choice: സമൂഹത്തെ മുഴുവൻ
  rationale: עֵדָה ഇവിടെ ഇസ്രായേലിന്റെ സംഘടിത സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘സമൂഹം’ ആ കൂട്ടായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു, ‘മുഴുവൻ’ כָּל-നെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: രണ്ടാം മാസത്തിന്റെ ഒന്നാം തീയതി
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ടാം മാസത്തിലെ ഒന്ന്’ എന്ന എബ്രായ കലണ്ടർപ്രയോഗം മാസത്തിന്റെ ഒന്നാം ദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഒന്നാം തീയതി’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: וַיִּתְיַלְדוּ
  choice: തങ്ങളുടെ വംശപരമ്പര അറിയിച്ച് പേര് രജിസ്റ്റർ ചെയ്തു
  rationale: ילד എന്ന ധാതുവിന്റെ അപൂർവമായ ഹിത്പയേൽ രൂപം വംശപരമ്പര സ്ഥാപിക്കുകയോ അറിയിക്കുകയോ ചെയ്ത് പട്ടികയിൽ ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. വിവർത്തനം അതിലെ വംശാവലി ഘടകവും ജനസംഖ്യാകണക്കെടുപ്പിലെ രജിസ്ട്രേഷൻ പ്രവർത്തനവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: തങ്ങളുടെ കുലങ്ങൾ അനുസരിച്ച്
  rationale: ഗോത്രസംഘടനയുടെയും ജനസംഖ്യാകണക്കെടുപ്പിന്റെയും പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ഒരു കുലതലത്തിലുള്ള ബന്ധുസമൂഹമാണ്; ‘കുലങ്ങൾ’ ആ സാമൂഹിക ഘടനയെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ അനുസരിച്ച്
  rationale: ഇത് ഇസ്രായേലിന്റെ ബന്ധുത്വസംഘടനയിലെ സാങ്കേതിക പദപ്രയോഗമാണ്. ‘പിതൃഭവനങ്ങൾ’ എബ്രായ രൂപകൽപ്പന നിലനിർത്തുകയും അതിനെ പൊതുവായ ‘കുടുംബങ്ങൾ’ എന്നതിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണപ്രകാരം
  rationale: പേരെടുത്ത് വ്യക്തികളെ എണ്ണിയതിനെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; തിരുവെഴുത്തിലെ കണക്കെടുപ്പ് ഭാഷയോട് അടുത്തുനിൽക്കുന്ന സുതാര്യമായ വിവർത്തനമാണിത്.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപത് വയസ്സും അതിൽ കൂടുതലും പ്രായമുള്ളവർ
  rationale: പ്രായപരിധി സൂചിപ്പിക്കുന്ന പതിവ് എബ്രായ സൂത്രവാക്യത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: לְגֻלְגְּלֹתָם
  choice: ഓരോരുത്തരായി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ തലയോട്ടികൾപ്രകാരം’ എന്ന ദൃശ്യപ്രയോഗം ഓരോ വ്യക്തിയെയും വേർതിരിച്ച് എണ്ണുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘ഓരോരുത്തരായി’ അർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥചിത്രം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
