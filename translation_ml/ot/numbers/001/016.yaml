  naturalness: “സഭയിലെ വിളിക്കപ്പെട്ടവർ” is natural, clear modern standard Malayalam in this formal narrative register. “അവരുടെ പിതൃഗോത്രങ്ങളുടെ പ്രമാണികൾ” is concise and understandable, though formal as appropriate to the context.
  terminology: “സഭ,” “പ്രമാണികൾ,” “പിതൃഗോത്രങ്ങൾ,” and “തലവന്മാർ” are suitable. The footnote should not foreground “സഭയിൽനിന്ന്” as an equivalent rendering, since that introduces an unsupported nuance.
