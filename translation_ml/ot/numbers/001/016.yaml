source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: ml
  text: സഭയിലെ വിളിക്കപ്പെട്ടവർ[a] ഇവരായിരുന്നു—അവരുടെ പിതൃഗോത്രങ്ങളുടെ പ്രമാണികളും ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങളുടെ തലവന്മാരും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഭയാൽ വിളിക്കപ്പെട്ടവർ” അല്ലെങ്കിൽ “സഭയ്ക്കായി നിയോഗിക്കപ്പെട്ടവർ.” എബ്രായ പങ്കാളിത്തരൂപത്തിന് വിളിക്കപ്പെട്ടവർ, വിളിച്ചുവരുത്തപ്പെട്ടവർ, നിയോഗിക്കപ്പെട്ടവർ എന്നീ അർഥസാധ്യതകളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങൾ” എന്നത് അക്ഷരാർഥത്തിൽ ആയിരം പേരടങ്ങിയ കൂട്ടങ്ങളെയോ, കൂടുതൽ വിശാലമായി ഇസ്രായേലിലെ കുലവിഭാഗങ്ങളെയോ സൈനിക ഉപവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ഇവർ
  rationale: തിരിച്ചറിഞ്ഞ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന നിർദ്ദേശകസർവനാമം; വാക്യാവസാനത്തിലെ הֵם ചേർന്ന് ‘ഇവരായിരുന്നു’ എന്ന തിരിച്ചറിയിക്കൽ ഘടന നൽകുന്നു.
- source_word: קריאי הָעֵדָה
  choice: സഭയിൽനിന്ന് വിളിക്കപ്പെട്ടവർ
  rationale: קרא എന്ന ധാതുവിന്റെ നിഷ്ക്രിയ പങ്കാളിത്തരൂപം വിളിക്കപ്പെട്ടവരെയോ വിളിച്ചുവരുത്തപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു. ‘സഭയിൽനിന്ന്’ എന്നത് ഇവർ സമൂഹത്തിൽനിന്ന് വിളിക്കപ്പെട്ടവരാണെന്ന സന്ദർഭാർഥം നൽകുന്നു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: נְשִׂיאֵי
  choice: പ്രമാണികൾ
  rationale: ഗോത്രങ്ങളുടെ അധികാരസ്ഥാനത്തുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഗൗരവമുള്ളതും ഭരണപരമായ സന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: അവരുടെ പിതൃഗോത്രങ്ങൾ
  rationale: പിതൃവംശവുമായി ബന്ധപ്പെട്ട ഗോത്രവിഭാഗങ്ങളെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; മൂലത്തിലെ പിതൃസംബന്ധം നിലനിർത്തുന്നു.
- source_word: רָאשֵׁי
  choice: തലവന്മാർ
  rationale: മൂലത്തിലെ ‘തലകൾ’ എന്ന നേതൃത്വരൂപകം മലയാളത്തിലെ സ്വാഭാവികമായ ‘തലവന്മാർ’ വഴി നിലനിർത്തുന്നു.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആയിരക്കൂട്ടങ്ങൾ
  rationale: אֶלֶף എന്നതിന് ‘ആയിരം’ എന്നും കുല/സൈനിക ഉപവിഭാഗം എന്നും അർഥമാകാം. ‘ആയിരക്കൂട്ടങ്ങൾ’ സംഖ്യാത്മക രൂപം നിലനിർത്തിക്കൊണ്ട് സംഘടിത വിഭാഗമെന്ന സാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
- source_word: הֵם
  choice: ആയിരുന്നു
  rationale: വാക്യാവസാനത്തിലെ ഊന്നിയ തിരിച്ചറിയിക്കൽ മലയാളത്തിൽ ‘ഇവരായിരുന്നു’ എന്ന ക്രിയാസംയോജനത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭരണ-ഗോത്രസന്ദർഭത്തിന് ‘സഭ’, ‘പ്രമാണികൾ’, ‘പിതൃഗോത്രങ്ങൾ’, ‘തലവന്മാർ’ എന്നിവ ഉപയോഗിച്ചു. എബ്രായത്തിലെ അർഥസന്ദിഗ്ധതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു; [a], [b] എന്നീ അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
