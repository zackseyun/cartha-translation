id: NUM.1.53
reference: Numbers 1:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: ml
  text: എന്നാൽ ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിന്മേൽ[a] ക്രോധം ഉണ്ടാകാതിരിക്കേണ്ടതിന് ലേവ്യർ സാക്ഷ്യകൂടാരത്തിനു ചുറ്റും പാളയമിറങ്ങണം; ലേവ്യർ സാക്ഷ്യകൂടാരത്തിന്റെ കാവൽച്ചുമതല വഹിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിനെതിരെ.”
    reason: עַל എന്ന ഉപസർഗത്തിന് ഈ സാഹചര്യത്തിൽ ‘മേൽ’ എന്നും ‘എതിരെ’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: എന്നാൽ ലേവ്യർ
  rationale: വാക്യാരംഭത്തിലെ וְ മുൻവാക്യത്തിൽ പറഞ്ഞ മറ്റു ഗോത്രങ്ങളുടെ ക്രമീകരണത്തോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന് നൽകി; tribal designation ‘ലേവ്യർ’ എന്ന് നിലനിർത്തി.
- source_word: יַחֲנוּ סָבִיב
  choice: ചുറ്റും പാളയമിറങ്ങണം
  rationale: അപൂർണ്ണക്രിയയുടെ നിർദേശാത്മക ബലം ‘-ണം’ രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; סָבִיב എന്നതിന്റെ സ്ഥലസൂചന ‘ചുറ്റും’ എന്ന് നൽകി.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: സാക്ഷ്യനിവാസം
  rationale: מִשְׁכָּן എന്ന ‘നിവാസം/വാസസ്ഥലം’ എന്ന ആശയവും הָעֵדֻת എന്ന ‘സാക്ഷ്യം’ എന്ന പദവും സംയുക്തപദമായി നിലനിർത്തുന്നു; ‘ഉടമ്പടിരേഖ’ എന്ന് വ്യാഖ്യാനപരമായി ചുരുക്കിയിട്ടില്ല.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: അങ്ങനെ ... ക്രോധം ഉണ്ടാകാതിരിക്കും
  rationale: ലേവ്യരുടെ പാളയക്രമീകരണത്തിന്റെ പ്രതിരോധാത്മക ഉദ്ദേശ്യം/ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; קֶצֶף എന്ന ന്യായവിധിസാന്ദ്രമായ പദത്തിന് ‘ക്രോധം’ നിലനിർത്തി.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹത്തിന്മേൽ
  rationale: עַל എന്നതിന്റെ ‘മേൽ/എതിരെ’ എന്ന പരിധി പ്രധാനപാഠത്തിലെ ‘-ന്മേൽ’ സംരക്ഷിക്കുന്നു. עֵדָה ‘സമൂഹം’ എന്നും בְּנֵי יִשְׂרָאֵל എന്ന പുത്രസംബന്ധിയായ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നും നൽകി.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: കാവൽച്ചുമതല നിർവഹിക്കണം
  rationale: ശമർ/മിഷ്മെരെത് പദയുഗ്മത്തിലെ കാവലും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വവും ഒരുമിച്ച് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: വിശുദ്ധസ്ഥലക്രമത്തിൽ קֶצֶף എന്നതിന്റെ സ്വഭാവം
  choice: ‘ക്രോധം’—ദൈവികവും ന്യായവിധിസംബന്ധവുമായ പൊട്ടിപ്പുറപ്പെടലിന്റെ സാധ്യത തുറന്നുവയ്ക്കുന്നു
  alternative: പൊതുവായ ‘കോപം’ അല്ലെങ്കിൽ മനുഷ്യരുടെ അസന്തോഷം
  rationale: സംഖ്യാപുസ്തകത്തിലെ വിശുദ്ധസ്ഥലസന്ദർഭം ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ദൈവം എന്ന കർത്താവിനെ വാക്യത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സംഘർഷവും നിലനിർത്തി.
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ / ഇസ്രായേൽജനം
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചന നിലനിർത്തുകയും മലയാളത്തിൽ സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ രൂപം ഉപയോഗിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘സാക്ഷ്യനിവാസം’ എന്ന ആരാധനാസംബന്ധിയായ പദം വാക്യത്തിലെ രണ്ടു സ്ഥാനങ്ങളിലും ഏകീകരിച്ചു. സെമിറ്റിക് ഘടന അതേപടി പകർത്താതെ നിർദേശാത്മക ബലവും വിശുദ്ധസ്ഥലത്തിന്റെ കാവൽച്ചുമതലയും വ്യക്തമായി സൂക്ഷിച്ചു.
