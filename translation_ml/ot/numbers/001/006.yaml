source:
  edition: WLC
  text: לְ/שִׁמְע֕וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/006.yaml
  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: ml
  text: 'ശിമെയോനുവേണ്ടി: സൂരീശദ്ദായിയുടെ മകൻ ശെലുമീയേൽ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: ശിമെയോനുവേണ്ടി
  rationale: പട്ടികയിലെ לְ ഗോത്രത്തെ പ്രതിനിധീകരിക്കുന്ന ആളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ പട്ടികയുടെ സംക്ഷിപ്ത ഘടന നിലനിർത്തിക്കൊണ്ട് ‘ശിമെയോനുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: שְׁלֻמִיאֵל
  choice: ശെലുമീയേൽ
  rationale: വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ എബ്രായ ഉച്ചാരണത്തോട് അടുത്തുനിൽക്കുന്ന രീതിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: בֶּן
  choice: മകൻ
  rationale: ഈ വംശപരമായ തിരിച്ചറിയൽ സൂത്രവാക്യത്തിൽ בֶּן എന്നതിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ അർത്ഥം ‘മകൻ’ എന്നാണ്.
- source_word: צוּרִישַׁדָּי
  choice: സൂരീശദ്ദായി
  rationale: വ്യക്തിനാമം അർത്ഥപരിഭാഷ ചെയ്യാതെ, צ എന്ന ആദിമ വ്യഞ്ജനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ’ കൊണ്ടും ദീർഘസ്വരങ്ങളെ വ്യക്തമാക്കിയും ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, ജനസംഖ്യാ കണക്കെടുപ്പിനായുള്ള പ്രതിനിധിപ്പട്ടികയുടെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തിയിരിക്കുന്നു. പേരുകൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് വായിക്കാൻ സ്വാഭാവികമായും എബ്രായ രൂപത്തോട് അടുത്തും നൽകിയിരിക്കുന്നു.
