language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: ml
  text: 'സെബൂലൂൻമക്കളെ സംബന്ധിച്ച്: അവരുടെ വംശപരമ്പരകൾപ്രകാരം, അവരുടെ കുലങ്ങൾപ്രകാരം, അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം, പേരുകളുടെ എണ്ണമനുസരിച്ച്, ഇരുപത് വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന[a] എല്ലാ പുരുഷന്മാരും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സൈനികസേവനത്തിന് യോഗ്യരായ.” എബ്രായ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “യുദ്ധത്തിനു പുറപ്പെടുന്ന” എന്നാണ്.
    reason: യֹצֵא צָבָא എന്ന സൈനികപ്രയോഗത്തിന്റെ സന്ദർഭാനുസൃതമായ അർഥം സൂചിപ്പിക്കുമ്പോഴും മുഖ്യപാഠത്തിൽ അതിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: സെബൂലൂന്റെ പുത്രന്മാരെ
  rationale: לְ ഇവിടെ ഗോത്രത്തെ സംബന്ധിച്ച കണക്കെടുപ്പിന്റെ തലക്കെട്ടായി വരുന്നു. മലയാളവാക്യത്തിന്റെ ക്രിയാസംബന്ധം വ്യക്തമാക്കാൻ കർമവിഭക്തി ഉപയോഗിച്ചു; പരമ്പരാഗത ഗോത്രനാമപ്രയോഗവും നിലനിർത്തി.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ വംശാവലികൾപ്രകാരം
  rationale: കണക്കെടുപ്പിലെ വംശപരമ്പരയും രേഖപ്പെടുത്തിയ ഇറക്കവും സൂചിപ്പിക്കുന്നു; വെറും ‘തലമുറകൾ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്രത്തിനകത്തെ വിപുലമായ ബന്ധുഗണങ്ങളെ സൂചിപ്പിക്കുന്ന ഭരണപരമായ വിഭാഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബഘടകത്തെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണമനുസരിച്ച്
  rationale: വ്യക്തികളെ പേരുപേരായി എണ്ണിയെന്ന ഉറവിടപ്രയോഗം വ്യാഖ്യാനാത്മകമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: പ്രായപരിധി ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിവുള്ള എല്ലാ പുരുഷന്മാരെയും
  rationale: ‘യുദ്ധത്തിനു പുറപ്പെടുന്ന ഏവൻ’ എന്ന എബ്രായ സൈനികപ്രയോഗത്തിന്റെ പ്രവർത്തനാർഥം നൽകുന്നു; ഈ പുരുഷസൈനിക കണക്കെടുപ്പിന്റെ ലിംഗപരമായ പരിധിയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുരുഷന്മാരെ മാത്രം ഉൾക്കൊള്ളുന്ന സൈനിക കണക്കെടുപ്പ്
  choice: യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിവുള്ള എല്ലാ പുരുഷന്മാരെയും
  alternative: സൈനികസേവനത്തിന് യോഗ്യരായ എല്ലാവരെയും
  rationale: സന്ദർഭം ഇരുപതു വയസ്സിനു മുകളിലുള്ള യുദ്ധയോഗ്യരായ പുരുഷന്മാരുടെ കണക്കെടുപ്പാണ്. ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ മൂലപാഠത്തിന്റെ പരിധി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ ഭരണ-വംശാവലി ശൈലി. ആവർത്തിക്കുന്ന ‘പ്രകാരം’ എന്ന ഘടന കണക്കെടുപ്പ് സൂത്രവാക്യത്തിന്റെ ഔപചാരിക താളം നിലനിർത്തുന്നു. ഈ വാക്യം തുടർന്നുള്ള എണ്ണവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
