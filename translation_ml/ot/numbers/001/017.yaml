source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: ml
  text: അങ്ങനെ മോശെയും അഹരോനും പേരാൽ നിർദേശിക്കപ്പെട്ടിരുന്ന ഈ പുരുഷന്മാരെ[a] കൂടെക്കൂട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പേരെടുത്ത് നിർദേശിക്കപ്പെട്ടിരുന്ന ഈ പുരുഷന്മാരെ”; അതായത്, പ്രത്യേകം തിരിച്ചറിയപ്പെട്ടിരുന്നവരെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ മുമ്പ് പേരെടുത്തുപറഞ്ഞ പ്രതിനിധികളെ മോശയും അഹരോനും തങ്ങളോടൊപ്പം ചേർക്കുന്നതാണ് സന്ദർഭം. മലയാളത്തിൽ ‘എടുത്തു’ എന്നത് അസ്വാഭാവികമായതിനാൽ ‘കൂട്ടിക്കൊണ്ടുവന്നു’ എന്നത് പ്രവർത്തിയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും
  rationale: വ്യക്തിനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ രൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: ഈ പുരുഷന്മാരെ
  rationale: אֲנָשִׁים ഇവിടെ മുൻവാക്യങ്ങളിൽ പേരെടുത്തുപറഞ്ഞ പുരുഷ പ്രതിനിധികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നേതാക്കൾ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭത്തിൽ ശരിയായിരിക്കാമെങ്കിലും മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: נִקְּבוּ בְּשֵׁמוֹת
  choice: പേരുപറഞ്ഞ് നിയോഗിക്കപ്പെട്ടിരുന്ന
  rationale: נקב എന്ന ക്രിയയുടെ നിഫാൽ രൂപവും בְּשֵׁמוֹת എന്ന പ്രയോഗവും ചേർന്ന്, ഇവർ പേരെടുത്തുപറഞ്ഞ് പ്രത്യേകമായി തിരിച്ചറിയപ്പെടുകയോ നിയമിക്കപ്പെടുകയോ ചെയ്തവരാണെന്ന ആശയം നൽകുന്നു. ഭരണപരമായ ഈ സന്ദർഭത്തിൽ ‘നിയോഗിക്കപ്പെട്ടിരുന്ന’ തിരഞ്ഞെടുപ്പിന്റെ ആശയം വ്യക്തമാക്കുന്നു; ‘പേരുപറഞ്ഞ്’ മൂലത്തിലെ നാമപരാമർശം നിലനിർത്തുന്നു.
