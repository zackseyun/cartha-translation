id: NUM.1.45
reference: Numbers 1:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: ml
  text: അങ്ങനെ, ഇസ്രായേൽമക്കളിൽ അവരുടെ പിതൃഭവനങ്ങൾ അനുസരിച്ച് എണ്ണപ്പെട്ടവരെല്ലാം—ഇരുപത് വയസ്സുമുതൽ അതിനുമുകളിലുള്ള, ഇസ്രായേലിൽ യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിവുള്ളവർ—,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: അങ്ങനെ ... എല്ലാവരും
  rationale: മുൻവാക്യങ്ങളിലെ ജനസംഖ്യാകണക്കെടുപ്പിനെ സംഗ്രഹിച്ച് തുടർന്നുവരുന്ന ഫലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വാക്യം അടുത്ത വാക്യത്തിലെ ആകെ സംഖ്യയിലേക്ക് തുടരുമെന്ന ഘടനയും നിലനിർത്തുന്നു.
- source_word: פְּקוּדֵי
  choice: എണ്ണപ്പെട്ട
  rationale: ജനസംഖ്യാകണക്കെടുപ്പ്/സൈനികപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ പദത്തിന്റെ കർമണിയായ, ഫലസൂചകമായ അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; പുരുഷന്മാരെ കേന്ദ്രീകരിച്ച സൈനിക കണക്കെടുപ്പിന്റെ പശ്ചാത്തലം പൊതുവായ ഒരു ജനവിഭാഗനാമത്തിലേക്ക് ലയിപ്പിക്കുന്നില്ല.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: കണക്കെടുപ്പ് പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങൾ അനുസരിച്ചായിരുന്നു എന്ന സാമൂഹിക ഘടന സംക്ഷിപ്തമായും ഔപചാരികമായും അറിയിക്കുന്നു.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: പ്രായപരിധി കൃത്യമായും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും നൽകുന്നു.
- source_word: כָּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടാൻ കഴിവുള്ള എല്ലാവരും
  rationale: അക്ഷരാർഥത്തിലെ ‘സൈന്യത്തിലേക്കു/യുദ്ധത്തിനു പുറപ്പെടുന്ന ഏവനും’ എന്ന സൈനിക പ്രയോഗം സാഹചര്യത്തിന് അനുയോജ്യമായി വ്യക്തമാക്കുന്നു; യോഗ്യതയുടെ ആശയം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിൽ
  rationale: സമൂഹത്തിനുള്ളിലെ സ്ഥാനം സൂചിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുമുള്ള പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലവാക്യം അടുത്ത വാക്യത്തിലെ ആകെ സംഖ്യയിലേക്കു തുടരുമെന്നതിനാൽ അവസാനത്തിലെ അർധവിരാമസ്വഭാവം കോമയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
