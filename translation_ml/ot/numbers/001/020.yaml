  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ജനസംഖ്യാകണക്കെടുപ്പ്-പട്ടികയുടെ ഔപചാരിക ആവർത്തനശൈലിയും അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന കോളൺ ഘടനയും നിലനിർത്തി.
