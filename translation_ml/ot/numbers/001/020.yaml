source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: ml
  text: 'ഇസ്രായേലിന്റെ ആദ്യജാതനായ രൂബേന്റെ പുത്രന്മാർ, അവരുടെ തലമുറകൾ, കുലങ്ങൾ, പിതൃഭവനങ്ങൾ എന്നിവയനുസരിച്ച്, പേരുകളുടെ എണ്ണപ്രകാരം, തലതോറും[a], ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള, യുദ്ധത്തിനു പുറപ്പെടുന്ന എല്ലാ പുരുഷന്മാരും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘അവരുടെ തലയോട്ടികൾപ്രകാരം’ അഥവാ ‘അവരുടെ തലകൾപ്രകാരം’; ഓരോ വ്യക്തിയെയും വെവ്വേറെ എണ്ണിയെന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: രൂബേന്റെ പുത്രന്മാർ
  rationale: വാക്യം അടുത്ത വാക്യത്തിലെ എണ്ണവുമായി ചേരുന്ന ജനസംഖ്യാകണക്കെടുപ്പ്-സൂത്രവാക്യമാണ്. അതിനാൽ וַיִּהְיוּ എന്ന ക്രിയയെ മലയാളത്തിൽ അസ്വാഭാവികമായി വേർതിരിച്ചു നൽകാതെ തുടർന്നുവരുന്ന നാമഘടനയിൽ ഉൾപ്പെടുത്തി; בְנֵי എന്നത് സുതാര്യമായി ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ ആദ്യജാതനായ
  rationale: ഇത് രൂബേനെ വിശേഷിപ്പിക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്; ആരെയാണ് ‘ആദ്യജാതൻ’ എന്നു വിളിക്കുന്നതെന്നത് മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: תּוֹלְדֹתָם
  choice: അവരുടെ തലമുറകൾ
  rationale: വംശപരമ്പരയെയോ തലമുറതിരിച്ചുള്ള വിഭാഗീകരണത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു; എഴുതപ്പെട്ട വംശാവലിരേഖകൾ എന്നു അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾ
  rationale: ഗോത്രത്തിനകത്തെ ബന്ധുവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കുലങ്ങൾ’ അനുയോജ്യം; പിന്നാലെയുള്ള പിതൃഭവനങ്ങളിൽനിന്നും ഇത് വേർതിരിഞ്ഞുനിൽക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ
  rationale: ജനസംഖ്യാകണക്കെടുപ്പിലെ സാങ്കേതിക ബന്ധുത്വഘടനയെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുകളുടെ എണ്ണപ്രകാരം
  rationale: പേരുകളാൽ തിരിച്ചറിയപ്പെട്ട വ്യക്തികളുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന എബ്രായപ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: לְגֻלְגְּלֹתָם
  choice: തലതോറും[a]
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘തല/തലയോട്ടി’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ഓരോരുത്തരെയായി എണ്ണുക എന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ പുരുഷന്മാരും
  rationale: ഇവിടെ ലിംഗത്തെ വ്യക്തമാക്കുന്ന זָכָר എന്ന പദം പ്രായനിബന്ധനയോടൊപ്പം മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ മലയാളത്തിൽ ‘പുരുഷന്മാർ’ എന്നു നൽകി.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ഇരുപതു വയസ്സും അതിനു മുകളിലും പ്രായമുള്ള
  rationale: സൈനിക ജനസംഖ്യാകണക്കിന്റെ പ്രായപരിധി വ്യക്തമായി നൽകുകയും ‘മുകളിലേക്ക്’ എന്ന എബ്രായരീതിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: כֹּל יֹצֵא צָבָא
  choice: യുദ്ധത്തിനു പുറപ്പെടുന്ന
  rationale: യֹצֵא എന്ന വർത്തമാന കൃദന്തരൂപത്തിലെ ‘പുറപ്പെടുന്ന’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘യോഗ്യരായ’ എന്നു ചേർത്ത് കഴിവോ ഔദ്യോഗിക അർഹതയോ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല; צָבָאയുടെ സൈനികസന്ദർഭം ‘യുദ്ധം’ വഴി പ്രകടമാക്കുന്നു.
