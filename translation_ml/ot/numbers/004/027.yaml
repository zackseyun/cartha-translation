base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: ml
  text: 'ഗേർശോന്റെ പുത്രന്മാരുടെ എല്ലാ സേവനവും, അവരുടെ എല്ലാ ചുമടുകളുടെയും എല്ലാ സേവനകാര്യങ്ങളുടെയും കാര്യത്തിൽ, അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും നിർദേശപ്രകാരമായിരിക്കണം[a]. അവരുടെ എല്ലാ ചുമടുകളും നിങ്ങൾ അവർക്കു ചുമതലയായി ഏൽപ്പിക്കണം[b].


    [a] അക്ഷരാർഥത്തിൽ, “അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും വായ്പ്രകാരം.” ഈ എബ്രായ പ്രയോഗം അവരുടെ വാക്കോ നിർദേശമോ അനുസരിച്ച് എന്നർഥം നൽകുന്നു.


    [b] അഥവാ, “നിയുക്ത ചുമതലയായി” അല്ലെങ്കിൽ “ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വമായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ഏൽപ്പിക്കപ്പെട്ട ചുമതല, ഉത്തരവാദിത്വം എന്നീ അർഥങ്ങൾ വരാം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അഹരോന്റെയും അവന്റെ പുത്രന്മാരുടെയും വായ്പ്രകാരം.” ഈ എബ്രായ പ്രയോഗം അവരുടെ വാക്കോ നിർദേശമോ അനുസരിച്ച് എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിയുക്ത ചുമതലയായി” അല്ലെങ്കിൽ “ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വമായി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദത്തിന് ഏൽപ്പിക്കപ്പെട്ട ചുമതല, ഉത്തരവാദിത്വം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: നിർദേശപ്രകാരം
  rationale: ‘വായിന്മേൽ/വായ്പ്രകാരം’ എന്ന അക്ഷരാർഥമുള്ള ഈ എബ്രായ ശൈലി ഒരാളുടെ വാക്കോ ആജ്ഞയോ നിർദേശമോ അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിർദേശപ്രകാരം’ സ്വാഭാവികവും അധികാരഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: תִּהְיֶה
  choice: ആയിരിക്കണം
  rationale: ഭരണപരമായ നിർദേശത്തിന്റെ നിർബന്ധസ്വരം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: עֲבֹדַת
  choice: സേവനം
  rationale: സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട ലേവ്യരുടെ നിയുക്ത അധ്വാനവും ശുശ്രൂഷയും ഉൾക്കൊള്ളുന്ന പദം; വിഭാഗത്തിന്റെ ആകെ സേവനത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യരുടെ പുത്രന്മാർ
  rationale: വംശപരവും ഗോത്രവിഭാഗപരവുമായ എബ്രായ പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗേർശോനിൽനിന്നുള്ള കുലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְכָל מַשָּׂאָם
  choice: അവർ ചുമക്കേണ്ട എല്ലാ ചുമടുകളുടെയും കാര്യത്തിൽ
  rationale: מַשָּׂא ഇവിടെ സമാഗമകൂടാരത്തിന്റെ സാധനങ്ങൾ കൊണ്ടുപോകുമ്പോൾ ചുമക്കുന്ന വസ്തുക്കളെ മൂർത്തമായി സൂചിപ്പിക്കുന്നു. לְ എന്നതിന്റെ പരിധി/ബന്ധഭാവം ‘കാര്യത്തിൽ’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: അവർ ചെയ്യേണ്ട എല്ലാ ജോലികളുടെയും കാര്യത്തിൽ
  rationale: ആദ്യത്തെ ‘എല്ലാ സേവനം’ എന്ന ആകെ ചുമതലയിൽനിന്ന് വ്യത്യസ്തമായി, അവരുടെ വിവിധ നിയുക്ത ജോലികളുടെ പരിധി ഇവിടെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ ആവർത്തനബന്ധം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: നിങ്ങൾ അവർക്കു ... ഏൽപ്പിക്കണം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനവും ഉത്തരവാദിത്വം നിയോഗിക്കുന്ന פקד എന്ന ക്രിയയുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: בְּמִשְׁמֶרֶת
  choice: ചുമതലയായി
  rationale: ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം, കാവൽച്ചുമതല, ബാധ്യത എന്നീ സാധ്യതകളിൽ സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ മലയാളപദം; മറ്റൊരു സൂക്ഷ്മത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: അവരുടെ എല്ലാ ചുമടുകളും
  rationale: നേരിട്ടുള്ള കർമമായ ചുമക്കേണ്ട വസ്തുക്കളുടെ സമഗ്രതയും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
