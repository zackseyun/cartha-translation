    rationale: The Malayalam dative construction can suggest a service allotted to them. The Hebrew עֲבֹדַת בְּנֵי־קְהָת is more directly “the service of the sons of Kohath,” that is, their service.
  - severity: low
    issue: Footnote’s alternative location terminology is somewhat redundant
    rationale: “അതിവിശുദ്ധസ്ഥലം” and “മഹാപരിശുദ്ധസ്ഥലം” function as near-synonymous labels. A single clear Malayalam location reading, with a literal explanatory equivalent, better preserves the lexical ambiguity.
