reference: Numbers 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ അത്യവിശുദ്ധമായ വസ്തുക്കളെ സംബന്ധിച്ച കെഹാത്തിന്റെ പുത്രന്മാരുടെ ശുശ്രൂഷ ഇതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിവിശുദ്ധ സ്ഥലം” (അക്ഷരാർഥത്തിൽ, “വിശുദ്ധതകളുടെ വിശുദ്ധം”). ഇവിടെ ഈ പ്രയോഗം ഉള്ളറയെ മാത്രം സൂചിപ്പിക്കുന്നതിനെക്കാൾ അത്യവിശുദ്ധമായ വിശുദ്ധവസ്തുക്കളെ സൂചിപ്പിക്കാനാണു കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: ഇതാണ്
  rationale: സ്ത്രീലിംഗ ഏകവചന സൂചകപദം ഈ വാക്യം അവതരിപ്പിക്കുന്നു; എബ്രായത്തിൽ സൂചിതമായ സംയോജകക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
- source_word: עֲבֹדַת
  choice: ശുശ്രൂഷ
  rationale: ഇവിടെ ഈ പദം നിയമിക്കപ്പെട്ട വിശുദ്ധചുമതലയെ സൂചിപ്പിക്കുന്നു; ആരാധനാസംബന്ധമായ സേവനത്തിന്റെ ഭാവം ‘ശുശ്രൂഷ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തുന്നു; വംശജർ എന്ന അർഥവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: കൂടാരത്തിന്റെ സ്ഥിരമായ പേരും സേവനം നടക്കുന്ന മേഖലയെ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധവസ്തുക്കൾ
  rationale: സംഖ്യ 4-ന്റെ സന്ദർഭത്തിൽ കെഹാത്ത്യർ കൈകാര്യം ചെയ്യേണ്ട ഏറ്റവും വിശുദ്ധമായ ഉപകരണങ്ങളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; സ്ഥലസൂചനയായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഷയം
  choice: കെഹാത്തിന്റെ പുത്രന്മാരെ ഏൽപ്പിച്ച അതിവിശുദ്ധമായ വിശുദ്ധവസ്തുക്കൾ
  alternative: അതിവിശുദ്ധസ്ഥലം / മഹാപരിശുദ്ധസ്ഥലം
  rationale: തുടർന്നുള്ള ഭാഗം സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങൾ മൂടുന്നതും വഹിക്കുന്നതുമായ ചുമതലകളെ വിവരിക്കുന്നതിനാൽ വസ്തുക്കളാണ് ഇവിടെ സാധ്യതയേറിയ സൂചിതവിഷയം. എങ്കിലും എബ്രായപ്രയോഗത്തിന് സ്ഥലസൂചനയായ അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘ശുശ്രൂഷ’, ‘അതിവിശുദ്ധവസ്തുക്കൾ’ എന്നീ പദങ്ങൾ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്; മൂലത്തിലെ യഥാർഥ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
