  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: ml
  text: 'മെരാരിപുത്രന്മാരുടെ കുടുംബങ്ങളുടെ ശുശ്രൂഷ ഇതാണ്: സമാഗമകൂടാരത്തിലെ അവരുടെ സകല ശുശ്രൂഷയും പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിലാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഈഥാമാരിന്റെ കൈയിൽ’; ഇവിടെ ഈ പ്രയോഗം മേൽനോട്ടത്തെയോ ഭരണപരമായ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: ഇതാകുന്നു ... ശുശ്രൂഷ
  rationale: സംഗ്രഹപ്രസ്താവനയുടെ ഘടന നിലനിർത്തുന്നു; ലേവ്യരുടെ ആരാധനാസംബന്ധമായ നിയോഗത്തെ സൂചിപ്പിക്കാൻ ‘ശുശ്രൂഷ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങൾ
  rationale: വംശപരമായ കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന מִשְׁפְּחֹת എന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘കുടുംബങ്ങൾ’ ഉപയോഗിച്ചു; בְּנֵי എന്ന എബ്രായ രൂപം ‘പുത്രന്മാർ’ എന്നു നിലനിർത്തി.
- source_word: לְכָל עֲבֹדָתָם
  choice: അവരുടെ സകല ശുശ്രൂഷയും
  rationale: ആവർത്തിക്കുന്ന עֲבֹדָה-യുടെ പദബന്ധം ‘ശുശ്രൂഷ’ എന്ന ഒരേ പദംകൊണ്ട് സംരക്ഷിക്കുകയും അവരുടെ മുഴുവൻ നിയുക്ത ചുമതലകളെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ
  rationale: אֹהֶל מוֹעֵד എന്ന വിശുദ്ധമന്ദിരനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതവും അർത്ഥസുതാര്യവുമായ രൂപം; בְּ സ്ഥലത്തെയും സേവനമേഖലയെയും സൂചിപ്പിക്കുന്നു.
- source_word: בְּיַד
  choice: മേൽനോട്ടത്തിൽ
  rationale: അക്ഷരാർഥം ‘കൈയിൽ/കൈമുഖാന്തരം’ എന്നാണെങ്കിലും ഇവിടെ ഭരണപരമായ ചുമതലയെയും മേൽനോട്ടത്തെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാർ
  rationale: വ്യക്തിനാമങ്ങളും ബന്ധവും പദവിയും വ്യക്തമായി നൽകുന്നു; הַכֹּהֵן വ്യാകരണപരമായി അഹരോനോടു ചേർന്നിരിക്കുന്നതു മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הַכֹּהֵן എന്ന വിശേഷണം ആരെ സൂചിപ്പിക്കുന്നു
  choice: പുരോഹിതനായ അഹരോൻ
  alternative: അഹരോന്റെ മകനായ പുരോഹിതൻ ഈഥാമാർ
  rationale: എബ്രായ പദക്രമത്തിൽ ‘പുരോഹിതൻ’ എന്ന നിർണ്ണായക നാമം നേരിട്ട് അഹരോനോടു ചേർന്നിരിക്കുന്നു; അതിനാൽ അതിനെ അഹരോന്റെ പദവിയായി വിവർത്തനം ചെയ്തു, ഈഥാമാരും പുരോഹിതനായിരുന്നു എന്ന മറ്റ് വേദഭാഗങ്ങളിലെ അറിവ് ഇവിടെ ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള വേദപാഠശൈലി സ്വീകരിച്ചു. ‘ശുശ്രൂഷ’, ‘സമാഗമകൂടാരം’, ‘മേൽനോട്ടം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും ആരാധനാ-ഭരണപരമായ പശ്ചാത്തലം കൃത്യമായി നൽകുന്നതുമാണ്. പ്രധാനപാഠത്തിൽ [a] അടയാളം ചേർത്തിട്ടുണ്ട്.
