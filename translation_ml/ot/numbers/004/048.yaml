id: NUM.4.48
reference: Numbers 4:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּהְי֖וּ פְּקֻדֵי/הֶ֑ם שְׁמֹנַ֣ת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וּ/שְׁמֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/048.yaml
  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: ml
  text: അവരിൽ കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയ പുരുഷന്മാർ ആകെ എണ്ണായിരത്തി അഞ്ഞൂറ്റി എൺപത് പേർ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവരിൽനിന്ന് കണക്കെടുത്തവർ’ അല്ലെങ്കിൽ ‘അവരുടെ കണക്കിൽപ്പെട്ടവർ.’ കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയവരെയാണ് ഹീബ്രൂ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആകെ ... ആയിരുന്നു
  rationale: ഇവിടെ היה എന്ന ക്രിയ കണക്കെടുപ്പിലെ മൊത്തം സംഖ്യ അറിയിക്കുന്ന ഭൂതകാലപ്രയോഗമാണ്. സംഖ്യയോടൊപ്പം ‘ആകെ ... ആയിരുന്നു’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: פְּקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ട പുരുഷന്മാർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം കണക്കെടുപ്പിൽ രേഖപ്പെടുത്തിയവരെ സൂചിപ്പിക്കുന്നു. സംഖ്യാപുസ്തകം 4-ലെ സമീപസന്ദർഭം തിരുനിവാസശുശ്രൂഷയ്ക്കു യോഗ്യരായ ലേവ്യപുരുഷന്മാരെക്കുറിച്ചായതിനാൽ ‘പുരുഷന്മാർ’ യഥാർഥ സൂചിതവിഭാഗം വ്യക്തമാക്കുന്നു; ‘അവരിൽ’ എന്നത് ഹീബ്രൂവിലെ ബന്ധസൂചന സ്വാഭാവികമായി പകരുന്നു.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: എണ്ണായിരം
  rationale: ഹീബ്രൂവിലെ സാധാരണ സംഖ്യാഘടനയെ മലയാളത്തിൽ നേരിട്ട് പകരുന്നു.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: അഞ്ഞൂറ്
  rationale: ആയിരങ്ങൾക്ക് പിന്നാലെയുള്ള കൂട്ടിച്ചേർക്കൽ സംഖ്യയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: וּשְׁמֹנִים
  choice: എൺപത്
  rationale: കൂട്ടിച്ചേർക്കൽ സംഖ്യാശൃംഖലയിലെ അവസാന ഘടകം; മുഴുവൻ സംഖ്യ മലയാളത്തിൽ ‘എണ്ണായിരത്തി അഞ്ഞൂറ്റി എൺപത്’ എന്നു ചേർത്തെഴുതുന്നു.
theological_decisions:
- issue: ലിംഗസൂചകമായ കണക്കെടുപ്പ് പദപ്രയോഗം
  choice: അവരിൽ എണ്ണപ്പെട്ട പുരുഷന്മാർ
  alternative: അവരിൽ എണ്ണപ്പെട്ടവർ / അവരുടെ എണ്ണപ്പെട്ടവർ
  rationale: സമീപസന്ദർഭത്തിൽ നിശ്ചിത പ്രായപരിധിയിലുള്ള ലേവ്യപുരുഷന്മാരെയാണ് തിരുനിവാസശുശ്രൂഷയ്ക്കായി എണ്ണുന്നത്. അതിനാൽ ലിംഗനിരപേക്ഷമാക്കാതെ യഥാർഥ സൂചിതവിഭാഗം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കണക്കെടുപ്പ് ശൈലി ഉപയോഗിച്ചു. ഹീബ്രൂവിലെ സംഖ്യാക്രമം മലയാളത്തിൽ പതിവായ സംയുക്തസംഖ്യയായി അവതരിപ്പിച്ചു; ‘പേർ’ ചേർത്തത് വ്യക്തികളുടെ എണ്ണം വ്യക്തമാക്കാനാണ്.
