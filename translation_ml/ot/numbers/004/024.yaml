source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֔ת מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י לַ/עֲבֹ֖ד וּ/לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: ml
  text: 'ഗേർശോന്യരുടെ കുടുംബങ്ങളുടെ സേവനം ഇതാണ്: സേവിക്കാനും ചുമടുകൾ വഹിക്കാനും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സേവിക്കാനും ഭാരങ്ങൾ ചുമക്കാനും.”
    reason: מַשָּׂא എന്ന പദത്തിന് ‘ചുമട്’ എന്നും ‘ഭാരം’ എന്നും അർഥമാകാം; ഈ പകരം വിവർത്തനം അതിന്റെ ഭാരം വഹിക്കൽ എന്ന ഭാവം മുന്നോട്ടുകൊണ്ടുവരുന്നു.
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: ചെയ്യേണ്ട സേവനം ഇതാണ്
  rationale: എബ്രായ നാമവാക്യത്തിലെ സൂചകസർവനാമവും ‘സേവനം/ജോലി’ എന്ന അർഥമുള്ള പദവും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ചെയ്യേണ്ട’ എന്നത് ചുമതലയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפְּחֹת הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യരുടെ കുടുംബങ്ങൾ
  rationale: മൊത്തമായ വംശനാമത്തെ മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനരൂപത്തിൽ നൽകി, അതിനുള്ളിലെ കുടുംബവിഭാഗങ്ങൾ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: לַעֲבֹד
  choice: സേവിക്കലും
  rationale: עבד എന്ന ക്രിയയുടെ സേവിക്കുക/ജോലി ചെയ്യുക എന്ന അർഥം ലേവ്യസേവനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘സേവിക്കുക’ എന്ന് നൽകി; തുടർന്നുള്ള ഘടകത്തോടുള്ള സമാന്തരഘടന നിലനിർത്തുന്നു.
- source_word: וּלְמַשָּׂא
  choice: ചുമടുകൾ വഹിക്കലും
  rationale: מַשָּׂא എന്നത് ചുമട്, ഭാരം, വഹിക്കേണ്ടത് എന്നിവ സൂചിപ്പിക്കുന്നു. സമാഗമകൂടാരസാമഗ്രികളുടെ ഗതാഗതചുമതല എന്ന സന്ദർഭത്തിൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ലേവ്യരുടെ ഔദ്യോഗിക ദൗത്യത്തെ സൂചിപ്പിക്കാൻ ‘സേവനം’ ഉപയോഗിച്ചു; കൃത്രിമമായ പദാനുപദഘടന ഒഴിവാക്കി സമാന്തര ആശയം നിലനിർത്തി.
