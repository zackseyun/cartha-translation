  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വേ മോശെയോടും അഹരോനോടും പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വയ്യിഖ്തോൽ രൂപം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പോൾ’ എന്നു നൽകി; ദൈവത്തിന്റെ ഔപചാരികമായ സംസാരത്തെ സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കാൻ ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ പരിചിതമായ ഉച്ചാരണരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: ആവർത്തിക്കുന്ന אֶל ഇരുവരും നേരിട്ടുള്ള അഭിസംബോധിതരാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ‘-ഓടും ... -ഓടും’ ഘടന അത് സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രവാക്യം മലയാളത്തിൽ കോളൻ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായ ആവർത്തനമാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാൽ പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു; ‘യഹ്‌വെ’ എന്നത് സാധാരണ പണ്ഡിതോചിതമായ പുനർനിർമിത ഉച്ചാരണത്തിന്റെ മലയാളരൂപമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ആഖ്യാനക്രമവും രണ്ടു അഭിസംബോധിതരെയും നിലനിർത്തി; അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള പ്രസംഗം സൂചിപ്പിക്കാൻ കോളൻ ഉപയോഗിച്ചു.
