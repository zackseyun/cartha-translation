translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. പട്ടികയുടെ ഔപചാരിക സ്വഭാവം നിലനിർത്തിയപ്പോൾ സാങ്കേതികമായി അപരിചിതമായ ‘അന്താഴങ്ങൾ’ പോലുള്ള പദങ്ങൾക്ക് പകരം പ്രവർത്തനം വ്യക്തമാക്കുന്ന ഭാഷ തെരഞ്ഞെടുത്തു. ‘തിരുനിവാസം’ (מִשְׁכָּן) എന്നും ‘സമാഗമകൂടാരം’ (אֹהֶל מוֹעֵד) എന്നും ഉള്ള വ്യത്യാസം സൂക്ഷിച്ചു.
