- from: 'സമാഗമകൂടാരത്തിലെ അവരുടെ എല്ലാ സേവനത്തിലും അവർ ചുമക്കേണ്ടവയുടെ ചുമതല[a] ഇതാണ്: തിരുനിവാസത്തിന്റെ പലകകൾ[b], അതിന്റെ കുറുകെ ഘടിപ്പിക്കുന്ന കമ്പികൾ, തൂണുകൾ, ചുവടുകൾ[c].'
