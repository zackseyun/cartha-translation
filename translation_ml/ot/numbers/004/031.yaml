id: NUM.4.31
reference: Numbers 4:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: ml
  text: 'സമാഗമകൂടാരത്തിലെ അവരുടെ എല്ലാ സേവനത്തിനായുള്ള, അവർ ചുമന്നുകൊണ്ടുപോകേണ്ട വസ്തുക്കളുടെ ചുമതല ഇതാണ്: തിരുനിവാസത്തിന്റെ പലകകൾ, അതിന്റെ കുറുക്കുകമ്പികൾ, തൂണുകൾ, അടിത്തറകൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת
  choice: ഇതാണ്
  rationale: മുമ്പുള്ള നിർദേശവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് തുടർന്നുവരുന്ന പട്ടികയെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ അവതരണരീതി.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: അവർ ചുമക്കേണ്ടവയുടെ ചുമതല
  rationale: מִשְׁמֶרֶת ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വത്തെയും מַשָּׂאָם ചുമന്നുകൊണ്ടുപോകേണ്ട വസ്തുക്കളെയും സൂചിപ്പിക്കുന്നു. അമൂർത്തമായ ‘ഭാരം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിലെ വസ്തുക്കൾ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളമാണിത്.
- source_word: לְכָל עֲבֹדָתָם
  choice: അവരുടെ എല്ലാ സേവനത്തിലും
  rationale: തിരുനിവാസവുമായി ബന്ധപ്പെട്ട ഏല്പിക്കപ്പെട്ട പ്രവർത്തനത്തിന്റെ മുഴുവൻ പരിധിയും ഉൾക്കൊള്ളുന്നു; ‘സേവനം’ ആരാധനാസംബന്ധമായ സൂക്ഷ്മഭാവം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനുള്ള വിശുദ്ധകൂടാരത്തിന്റെ പതിവായ മലയാളനാമം; ഇവിടെ സേവനത്തിന്റെ മേഖലയെ സൂചിപ്പിക്കുന്നു.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ പലകകൾ
  rationale: קֶרֶשׁ തിരുനിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ച ഉറച്ച പലകകളെ സൂചിപ്പിക്കുന്നു. ‘പലകകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: בְרִיחָיו
  choice: അതിന്റെ കുറുകെ ഘടിപ്പിക്കുന്ന കമ്പികൾ
  rationale: പലകകളെ ചേർത്തുനിർത്താൻ ഘടിപ്പിച്ച bars ആണെന്ന ഘടനാപരമായ പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു; അപരിചിതമായ സാങ്കേതികപദം ഒഴിവാക്കുന്നു.
- source_word: עַמּוּדָיו
  choice: തൂണുകൾ
  rationale: നിവർന്നുനിൽക്കുന്ന ഘടനാപരമായ താങ്ങുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: אֲדָנָיו
  choice: ചുവടുകൾ
  rationale: പലകകളോ തൂണുകളോ ഉറപ്പിച്ചുനിർത്തുന്ന അടിത്തറഭാഗങ്ങളെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രീതിയിൽ സൂചിപ്പിക്കുന്നു.
