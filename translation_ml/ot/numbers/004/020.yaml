source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: ml
  text: എന്നാൽ ഒരു നിമിഷത്തേക്കുപോലും വിശുദ്ധവസ്തുക്കളെ കാണാൻ അവർ അകത്തു കടക്കരുത്[a]; അല്ലെങ്കിൽ അവർ മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ക്ഷണത്തേക്കുപോലും.” ഈ എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; വിശുദ്ധവസ്തുക്കൾ അല്പനേരം മാത്രം കാണുന്നതിനെയോ അവ മൂടപ്പെടുമ്പോൾ കാണുന്നതിനെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: എന്നാൽ ... അരുത്
  rationale: മുൻനിർദേശത്തോട് ചേർന്നുള്ള നിരോധനവും മുന്നറിയിപ്പിന്റെ വൈരുധ്യഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: יָבֹאוּ
  choice: അകത്തു കടക്കരുത്
  rationale: സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ‘അകത്തു വരുക/കടക്കുക’ എന്ന അർഥവും വ്യക്തമായ നിരോധനബലവും ഉണ്ട്.
- source_word: לִרְאוֹת
  choice: കാണാൻ
  rationale: വിശുദ്ധവസ്തുക്കൾ ദൃഷ്ടിയിൽപ്പെടുന്നതിനെ വിലക്കുന്ന സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: כְבַלַּע
  choice: ഒരു നിമിഷത്തേക്കുപോലും
  rationale: ദുഷ്കരമായ ഈ എബ്രായപ്രയോഗത്തിന്റെ ക്ഷണികത സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ നൽകുന്നു; മൂടപ്പെടുന്ന സമയത്ത് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: אֶת־הַקֹּדֶשׁ
  choice: വിശുദ്ധവസ്തുക്കൾ
  rationale: ഏകവചനരൂപമാണെങ്കിലും സമീപസന്ദർഭത്തിലെ തിരുനിവാസത്തിലെ വിശുദ്ധ ഉപകരണങ്ങളെ സമാഹാരമായി സൂചിപ്പിക്കുന്നു.
- source_word: וָמֵתוּ
  choice: കടന്നാൽ അവർ മരിക്കും
  rationale: നിരോധനം ലംഘിച്ചാലുള്ള മരണഫലം സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാവാക്യത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: הַקֹּדֶשׁ എന്നതിന്റെ സൂചിതാർഥം
  choice: വിശുദ്ധ ഉപകരണങ്ങളെ സമാഹാരമായി സൂചിപ്പിക്കുന്ന ‘വിശുദ്ധവസ്തുക്കൾ’
  alternative: വിശുദ്ധസ്ഥലം; വിശുദ്ധവസ്തു
  rationale: സംഖ്യ 4-ലെ തൊട്ടടുത്ത സന്ദർഭം തിരുനിവാസത്തിലെ ഉപകരണങ്ങൾ മൂടുന്നതും ചുമക്കുന്നതുമാണ്; അതിനാൽ സ്ഥലത്തെക്കാൾ വസ്തുക്കളാണ് ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നത്.
- issue: כְבַלַּע എന്ന ദുഷ്കരപ്രയോഗത്തിന്റെ അർഥം
  choice: ഒരു നിമിഷത്തേക്കുപോലും
  alternative: വിശുദ്ധവസ്തുക്കൾ മൂടപ്പെടുമ്പോൾ
  rationale: ക്ഷണികമായി കാണുക എന്ന പരമ്പരാഗത വ്യാഖ്യാനം വായനാസൗകര്യത്തോടെ നൽകുന്നു; എന്നാൽ മൂടുന്ന സമയത്തെ സൂചനയെന്ന യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നിരോധനശൈലി. ‘വിശുദ്ധവസ്തുക്കൾ’ സന്ദർഭത്തിലെ ഉപകരണങ്ങളുടെ സമാഹാരാർഥം വ്യക്തമാക്കുന്നു; ദുഷ്കരമായ എബ്രായപ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
