source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ള, സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാൻ സേവനത്തിനു[b] വരുന്ന[a] എല്ലാവരെയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സേവനത്തിനു പ്രവേശിക്കുന്ന’.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സേവനം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന എബ്രായപദം ക്രമീകരിക്കപ്പെട്ട ചുമതലയെയോ സേവനസംഘത്തെയോ സൂചിപ്പിക്കാനും കഴിയും.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ളവരിൽ
  rationale: ഹീബ്രായ പ്രായപരിധി പ്രയോഗത്തിന്റെ ആരംഭവും പരമാവധിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വָמַעְלָה എന്നത് അടുത്ത വാക്യഘടകത്തിലെ അമ്പതു വയസ്സ് എന്ന പരിധിയോടൊപ്പം ‘മുതൽ’ എന്നതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: כָּל הַבָּא
  choice: വരുന്ന എല്ലാവരെയും
  rationale: בוא എന്ന കർത്തൃവാചക ക്രിയാരൂപത്തിന്റെ ‘വരുന്ന/പ്രവേശിക്കുന്ന’ എന്ന ചലനഭാവം നിലനിർത്തുന്നു. സന്ദർഭത്തിലെ എണ്ണലിന്റെ കർമമായി ഈ കൂട്ടം വരുന്നതിനാൽ മലയാളത്തിൽ ‘എല്ലാവരെയും’ എന്നു നൽകി.
- source_word: לַצָּבָא
  choice: സേവനത്തിനു
  rationale: ഈ ലേവ്യസന്ദർഭത്തിൽ צָבָא യുദ്ധസേനയെക്കാൾ ക്രമീകരിക്കപ്പെട്ട ഔദ്യോഗിക സേവനത്തെ സൂചിപ്പിക്കുന്നു; സൈനിക അർഥം അനാവശ്യമായി ചുമത്താതെ അത് ‘സേവനം’ എന്നു നൽകി.
- source_word: לַעֲבֹדָה
  choice: വേല ചെയ്യാൻ
  rationale: മുമ്പുള്ള צָבָא യിൽനിന്ന് പദവ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് עֲבֹדָה യുടെ പ്രവൃത്തി/വേല എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; സഭാപരമായ പ്രത്യേക അർഥം തോന്നാവുന്ന പദങ്ങൾ ഒഴിവാക്കി.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: മോശെയുടെ കൂടാരവിശുദ്ധസ്ഥലത്തിനുള്ള പ്രചാരത്തിലുള്ളതും അർഥസുതാര്യവുമായ മലയാള നാമം; בְּ എന്നതിന്റെ പ്രവർത്തനമേഖലാഭാവം ‘-ത്തിൽ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: לַצָּבָא എന്ന പദത്തിന്റെ സൈനികവും ആരാധനാസേവനപരവുമായ അർഥപരിധി
  choice: സേവനത്തിനു
  alternative: സൈനികസേവനത്തിനു / സംഘത്തിൽ
  rationale: സമാഗമകൂടാരത്തിലെ ലേവ്യവേലയാണ് തൊട്ടുപിന്നാലെ വ്യക്തമാക്കുന്നത്. അതിനാൽ യുദ്ധപരമായ അർഥം നിർബന്ധിക്കാതെ, ക്രമബദ്ധമായ ചുമതല എന്ന ഭാവം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഈ വാക്യം മുൻവാക്യത്തിലെ എണ്ണലിന്റെ തുടർച്ചയായതിനാൽ കർമരൂപമായ ‘എല്ലാവരെയും’ നിലനിർത്തി. ‘മിനിസ്ട്രി’ പോലുള്ള സഭാവിശേഷ പദങ്ങളും അനാവശ്യമായ സൈനികഭാഷയും ഒഴിവാക്കി.
