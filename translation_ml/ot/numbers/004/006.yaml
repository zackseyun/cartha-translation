source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: ml
  text: അതിന്റെമേൽ തഹശ് തോൽകൊണ്ടുള്ള ഒരു ആവരണം ഇടണം[a]. അതിനുമുകളിൽ മുഴുവനും നീലനിറമുള്ള ഒരു തുണി വിരിച്ച്, അതിന്റെ ചുമക്കാനുള്ള തണ്ടുകൾ ഘടിപ്പിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തഹശ്’ (תַּחַשׁ) എന്ന എബ്രായപദം ഏതു ജീവിയെയാണു സൂചിപ്പിക്കുന്നതെന്ന് ഉറപ്പില്ല. ആട്ടിൻതോൽ, കടൽപ്പന്നിയുടെ തോൽ, ഡുഗോങ് തോൽ തുടങ്ങിയ വിവർത്തനങ്ങൾ പരമ്പരാഗതമായി നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: അതിന്റെമേൽ … ഇടണം
  rationale: ക്രമനിർദേശത്തിലെ വാവ് ചേർന്ന ക്രിയയ്ക്ക് മലയാളത്തിൽ നിർദേശാത്മകമായ ‘ഇടണം’ സ്വാഭാവികമാണ്; עַל വസ്തുവിനെ മൂടുന്ന മേൽസ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: כְּסוּי
  choice: ഒരു മൂടി
  rationale: മൂടാനുപയോഗിക്കുന്ന വസ്തുവെന്ന നാമാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: עוֹר תַּחַשׁ
  choice: തഹശ് തോൽകൊണ്ടുള്ള
  rationale: תַּחַשׁ സൂചിപ്പിക്കുന്ന ജീവി ഏതെന്ന് അനിശ്ചിതമായതിനാൽ ഊഹാധിഷ്ഠിതമായ മൃഗനാമമോ ‘മേൽത്തരം’ പോലുള്ള മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ഗുണവിശേഷണമോ ചേർക്കാതെ പദം ലിപ്യന്തരണം ചെയ്യുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: וּפָרְשׂוּ
  choice: വിരിച്ച്
  rationale: ഒരു തുണിയോ ആവരണമോ പരത്തിവിരിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ മലയാളരൂപം.
- source_word: בֶגֶד
  choice: ഒരു തുണി
  rationale: സാധാരണയായി വസ്ത്രം എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ പെട്ടകത്തിനുമേൽ വിരിക്കുന്ന പാളിയായതിനാൽ ‘തുണി’ യോജിക്കുന്നു.
- source_word: כְּלִיל תְּכֵלֶת
  choice: മുഴുവനും നീലനിറമുള്ള
  rationale: כְּלִיל സമ്പൂർണതയെ ഊന്നുന്നു; תְּכֵלֶת തിരുനിവാസസാമഗ്രികളിൽ ഉപയോഗിച്ച നീല/നീല-ധൂമ്ര വർണപദമാണ്. വായനാസൗകര്യത്തിനായി ‘നീലനിറം’ തെരഞ്ഞെടുത്തു.
- source_word: מִלְמָעְלָה
  choice: അതിനുമുകളിൽ
  rationale: പാളികളുടെ ക്രമത്തിൽ തഹശ് തോൽമൂടിയുടെ മുകളിൽ നീലത്തുണി വിരിക്കുന്നതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ സ്ഥാനത്ത് വെക്കണം
  rationale: בַּדִּים പെട്ടകം ചുമക്കാനുള്ള തണ്ടുകളാണ്. ശുദ്ധമായ ‘തണ്ടുകൾ’ മൂലപാഠത്തോട് അടുത്തുനിൽക്കുന്നു; ‘സ്ഥാനത്ത്’ എന്നത് വെക്കൽക്രിയയുടെ ലക്ഷ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
