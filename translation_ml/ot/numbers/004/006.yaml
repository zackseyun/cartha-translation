- from: അതിന്റെമേൽ തഹശ് തോൽകൊണ്ടുള്ള ഒരു മൂടി ഇടണം[a]. അതിനുമുകളിൽ മുഴുവനും നീലനിറമുള്ള ഒരു തുണി വിരിച്ച്, അതിന്റെ തണ്ടുകൾ സ്ഥാനത്ത് വെക്കണം.
