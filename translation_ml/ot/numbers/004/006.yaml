translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിർദേശശൈലി ഉപയോഗിച്ചു. അനിശ്ചിതമായ ജീവിനാമം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ലിപ്യന്തരണം ചെയ്ത് അടിക്കുറിപ്പിൽ സാധ്യതകൾ നിലനിർത്തി.
