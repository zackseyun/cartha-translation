  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം വിശാലമായ എണ്ണൽവിവരണത്തിന്റെ ഭാഗമായതിനാൽ മൂലത്തിലെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു.
