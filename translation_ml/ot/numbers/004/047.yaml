source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּ֗א לַ/עֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַ/עֲבֹדַ֥ת מַשָּׂ֖א בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ, സമാഗമകൂടാരത്തിൽ ശുശ്രൂഷയുടെ വേല[a]യും ചുമടുകൾ വഹിക്കുന്ന ശുശ്രൂഷയും നിർവഹിക്കാൻ വരുന്ന എല്ലാവരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വേലയുടെ ശുശ്രൂഷയും ചുമടുകൾ വഹിക്കുന്ന ശുശ്രൂഷയും.” ഊന്നലിനോ വേലകളുടെ തരംതിരിവിനോ വേണ്ടി എബ്രായത്തിൽ ഒരേ നാമപദവുമായി ബന്ധപ്പെട്ട രൂപങ്ങൾ ആവർത്തിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: മുപ്പതു വയസ്സുമുതൽ മേലോട്ടു
  rationale: താഴത്തെ പ്രായപരിധി സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ‘മുതൽ മേലോട്ടു’ എന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: അമ്പതു വയസ്സുവരെ
  rationale: മേലത്തെ പ്രായപരിധി സ്വാഭാവികവും കൃത്യവുമായി വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַבָּא
  choice: വരുന്ന എല്ലാവരും
  rationale: കർതൃനാമമായി പ്രവർത്തിക്കുന്ന എബ്രായ വർത്തമാനകൃദന്തരൂപത്തിന്റെ ചലനാത്മക അർഥം നിലനിർത്തുന്നു; ‘നിയോഗിക്കപ്പെട്ടവർ’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: לַעֲבֹד
  choice: നിർവഹിക്കാൻ
  rationale: തുടർന്നുവരുന്ന വേല/ശുശ്രൂഷാ നാമങ്ങളിൽനിന്ന് ക്രിയയെ വേർതിരിച്ചുകൊണ്ട് ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: ശുശ്രൂഷാവേല
  rationale: ആവർത്തനമുള്ള എബ്രായ സംയുക്തത്തിന്റെ രണ്ടു ആശയങ്ങളും മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തപദത്തിലൂടെ കൈമാറുന്നു; ആവർത്തനത്തിന്റെ സ്വഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: ചുമടുകൾ ചുമക്കുന്ന വേല
  rationale: מַשָּׂא എന്നതിന്റെ വഹിക്കപ്പെടുന്ന ചുമട്/ഭാരം എന്ന മൂർത്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഈ വിശുദ്ധകൂടാരനാമത്തിന്റെ സ്ഥാപിതമായ മലയാളരൂപവും എബ്രായത്തിലെ സ്ഥലസൂചക ഉപസർഗവും നിലനിർത്തുന്നു.
