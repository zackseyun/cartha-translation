  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: ml
  text: ഗേർശോന്റെ പുത്രന്മാരെയും അവരുടെ പിതൃഭവനങ്ങളുടെയും കുലങ്ങളുടെയും അടിസ്ഥാനത്തിൽ എണ്ണമെടുക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘ഗേർശോന്റെ പുത്രന്മാരുടെ തല ഉയർത്തുക.’ അവരെ എണ്ണുക, അഥവാ അവരുടെ എണ്ണം എടുക്കുക, എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: എണ്ണമെടുക്കുക
  rationale: ‘തല ഉയർത്തുക’ എന്ന അക്ഷരാർഥമുള്ള ഈ എബ്രായ പ്രയോഗം ഇവിടെ ഭരണപരമായ കണക്കെടുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായി അർഥം നൽകാൻ ‘എണ്ണമെടുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ വംശാവലിസംബന്ധമായ ‘ഗേർശോന്റെ പുത്രന്മാർ’ എന്ന ഘടന നിലനിർത്തുന്നു; ‘ഗേർശോന്യർ’ എന്ന പൊതുവായ ജനവിഭാഗനാമത്തേക്കാൾ ഇത് മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: גַּם הֵם
  choice: പുത്രന്മാരെയും
  rationale: גם הֵם നൽകുന്ന ‘അവരെയും/അവരുംകൂടെ’ എന്ന ഉൾപ്പെടുത്തൽഭാവം മലയാളത്തിലെ ‘-യും’ എന്ന പ്രത്യയത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങൾക്കും അനുസരിച്ച്
  rationale: പിതൃവംശാധിഷ്ഠിതമായ പൂർവികഗൃഹങ്ങളെയോ സാമൂഹിക കുടുംബഘടകങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഘടനയും സംഖ്യാവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾക്കും അനുസരിച്ച്
  rationale: ഈ ജനഗണനാസന്ദർഭത്തിൽ מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തെക്കാൾ വിശാലമായ വംശീയ ഉപവിഭാഗമായ കുലത്തെ സൂചിപ്പിക്കുന്നു.
