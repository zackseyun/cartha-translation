translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘പിതൃഭവനങ്ങൾ’ എന്ന പദം പുരാതന ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിത സാമൂഹിക ഘടന വ്യക്തമാക്കാനും ‘കുലങ്ങൾ’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താനും തെരഞ്ഞെടുത്തു.
