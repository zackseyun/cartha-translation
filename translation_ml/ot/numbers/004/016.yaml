  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: ml
  text: പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസറിന്റെ മേൽനോട്ടച്ചുമതല വെളിച്ചത്തിനുള്ള എണ്ണ[a], സുഗന്ധധൂപം, നിരന്തരമായ ധാന്യയാഗം[b], അഭിഷേകതൈലം എന്നിവയും, സമാഗമകൂടാരം മുഴുവനും അതിലുള്ള സകലവും—വിശുദ്ധസ്ഥലവും[c] അതിന്റെ ഉപകരണങ്ങളും[d]—ആയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മേൽനോട്ടച്ചുമതല” എന്നതിന് “ചുമതല” അല്ലെങ്കിൽ “ഉത്തരവാദിത്വം” എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദം ഏല്പിക്കപ്പെട്ട മേൽനോട്ടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “നിരന്തരമായ ധാന്യയാഗം” എന്നതിന് “പതിവായ ധാന്യയാഗം” അല്ലെങ്കിൽ “തുടർച്ചയായ ധാന്യയാഗം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “വിശുദ്ധസ്ഥലം” എന്നതിന് “വിശുദ്ധമേഖല” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം “വിശുദ്ധസ്ഥലത്തിൽ” എന്ന സ്ഥലാർഥത്തിലോ, വിശുദ്ധസ്ഥലത്തെ സംബന്ധിച്ചോ എന്നും മനസ്സിലാക്കാവുന്നതാണ്.
    reason: ambiguity
  - marker: d
    text: “ഉപകരണങ്ങൾ” എന്നതിന് സന്ദർഭമനുസരിച്ച് “പാത്രങ്ങൾ” അല്ലെങ്കിൽ “സാമഗ്രികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: മേൽനോട്ടച്ചുമതല
  rationale: നിയോഗിക്കപ്പെട്ട മേൽനോട്ടവും ഉത്തരവാദിത്വവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന പദപ്രയോഗം; ആവർത്തിക്കുന്ന എബ്രായപദത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: വെളിച്ചത്തിനുള്ള എണ്ണ
  rationale: ‘വെളിച്ചത്തിന്റെ എണ്ണ’ എന്ന എബ്രായ ഘടനയുടെ ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വിളക്കിനെ വ്യക്തമായി ചേർത്ത് വ്യാഖ്യാനം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: സുഗന്ധധൂപം
  rationale: സുഗന്ധദ്രവ്യങ്ങൾ ചേർത്ത ധൂപം എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: מִנְחַת הַתָּמִיד
  choice: നിരന്തര ധാന്യയാഗം
  rationale: מִנְחָה എന്നത് ധാന്യയാഗത്തെയും תָּמִיד സ്ഥിരമായി ആവർത്തിക്കുന്നതോ തുടർച്ചയായതോ ആയ സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘ദൈനംദിനം’ എന്നു അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: അഭിഷേകതൈലം
  rationale: ആരാധനാസംബന്ധിയായ അഭിഷേകത്തിനുള്ള എണ്ണയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: כָּל הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരം മുഴുവനും
  rationale: മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തെയാണ് ഇവിടെ מִשְׁכָּן സൂചിപ്പിക്കുന്നത്; כָּל എന്നതിന്റെ സമഗ്രത ‘മുഴുവനും’ നിലനിർത്തുന്നു.
- source_word: בְּקֹדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: സന്ദർഭത്തിൽ ഇത് വിശുദ്ധമായ ആരാധനാമേഖലയെ സൂചിപ്പിക്കുന്നു; അകത്തെ ഒരു പ്രത്യേക മുറിയിലേക്ക് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: וּבְכֵלָיו
  choice: അതിന്റെ ഉപകരണങ്ങൾ
  rationale: כֵּלִים പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾക്കൊള്ളാം; കൂടാരത്തിലെ വിശുദ്ധസാമഗ്രികളെ സമഗ്രമായി സൂചിപ്പിക്കാൻ ‘ഉപകരണങ്ങൾ’ യോജിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന פְקֻדַּת എന്ന പദത്തിന്റെ ബന്ധവും വാക്യത്തിന്റെ നാമവാക്യസ്വഭാവവും
  choice: പട്ടികപ്പെടുത്തിയ വിശുദ്ധവസ്തുക്കളും സമാഗമകൂടാരം മുഴുവനും അതിലുള്ള സകലവും എലെയാസറിന്റെ മേൽനോട്ടച്ചുമതലയിൽ ഉൾപ്പെടുന്നതായി രണ്ടു ബന്ധിത ഖണ്ഡങ്ങളിലൂടെ അവതരിപ്പിച്ചു.
  alternative: രണ്ടാമത്തെ פְקֻדַּת ആദ്യപട്ടികയെ സംഗ്രഹിക്കുന്ന സമാനാധികരണപ്രയോഗമായി കൂടുതൽ അക്ഷരാർഥത്തിൽ നിലനിർത്താം; ‘ഉണ്ടായിരിക്കും’ എന്ന ക്രിയ ചേർക്കാതെ നാമവാക്യമായും വിടാം.
  rationale: എബ്രായവാക്യം ക്രിയയില്ലാത്തതും സമാനാധികരണസാധ്യതയുള്ളതുമാണ്. മലയാളത്തിൽ അർഥം വ്യക്തമായി വായിക്കാനായി ‘ഉണ്ടായിരിക്കും/ആയിരിക്കും’ ചേർത്തെങ്കിലും, മേൽനോട്ടത്തിന്റെ പരിധി സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ അധികനിഗമനം ചേർത്തിട്ടില്ല.
- issue: בְּקֹדֶשׁ וּבְכֵלָיו എന്ന അവസാനഭാഗത്തിന്റെ വാക്യബന്ധം
  choice: ‘വിശുദ്ധസ്ഥലവും അതിന്റെ ഉപകരണങ്ങളും’ എന്ന വിശദീകരണസമാനാധികരണമായി ദീർഘവരകൾക്കിടയിൽ നൽകി.
  alternative: ‘വിശുദ്ധസ്ഥലത്തിലും അതിന്റെ ഉപകരണങ്ങളിലും’ എന്ന സ്ഥലാർഥത്തിലോ ‘വിശുദ്ധസ്ഥലത്തെയും അതിന്റെ ഉപകരണങ്ങളെയും സംബന്ധിച്ച്’ എന്ന ബന്ധാർഥത്തിലോ പരിഭാഷപ്പെടുത്താം.
  rationale: എബ്രായത്തിലെ בְּ സ്ഥലമോ വിഷയബന്ധമോ സൂചിപ്പിക്കാം; ഇവിടെ മുൻപുള്ള ‘അതിലുള്ള സകലവും’ എന്നതിനെ വിശദീകരിക്കുന്ന വായന മലയാളത്തിൽ സ്വാഭാവികമാണ്. മറ്റ് സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആരാധനാസംബന്ധിയായ സ്ഥാപിത പദങ്ങളായ ‘ധാന്യയാഗം’, ‘അഭിഷേകതൈലം’, ‘സമാഗമകൂടാരം’ എന്നിവ ഉപയോഗിച്ചു. എബ്രായത്തിലെ ആവർത്തനവും മേൽനോട്ടത്തിന്റെ ആശയവും നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ നാമപദനിര ഒഴിവാക്കാൻ ആവശ്യമായ ബന്ധകക്രിയകൾ മാത്രം ചേർത്തു.
