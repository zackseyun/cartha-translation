  to: യഹോവയുടെ കല്പനപ്രകാരം മോശ മുഖാന്തരം അവരെ എണ്ണി; ഓരോരുത്തനെയും അവനവന്റെ സേവനത്തിനും വഹിക്കേണ്ട ഭാരത്തിനും അനുസരിച്ച്. യഹോവ മോശയോടു കല്പിച്ചതുപോലെയായിരുന്നു ഓരോരുത്തന്റെയും നിയോഗം.[a]
