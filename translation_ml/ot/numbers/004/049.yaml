  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: ml
  text: യഹോവയുടെ കല്പനപ്രകാരം മോശ മുഖാന്തരം അവരെ എണ്ണി; ഓരോരുത്തനെയും അവനവന്റെ സേവനത്തിനും വഹിക്കേണ്ട ഭാരത്തിനും അനുസരിച്ച്. യഹോവ മോശയോടു കല്പിച്ചതുപോലെയായിരുന്നു ഓരോരുത്തന്റെയും നിയോഗം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള എബ്രായപദം ദുഷ്കരമാണ്; ‘നിയോഗം’ എന്നതിനു പകരം ‘പട്ടികപ്പെടുത്തൽ,’ ‘ഏൽപ്പിച്ച ചുമതല,’ അല്ലെങ്കിൽ ‘അവനാൽ എണ്ണപ്പെട്ടവർ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: യഹോവയുടെ കല്പനപ്രകാരം
  rationale: ‘യഹോവയുടെ വായനുസരിച്ച്’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ ദൈവിക കല്പനയെ സൂചിപ്പിക്കുന്നു; ദൈവനാമം യഹോവ എന്നു നിലനിർത്തി.
- source_word: פָּקַד אֹתָם
  choice: അവരെ എണ്ണി
  rationale: פקד എന്ന പദത്തിന് എണ്ണുക, പട്ടികപ്പെടുത്തുക, നിയോഗിക്കുക തുടങ്ങിയ അർഥങ്ങളുണ്ടെങ്കിലും സംഖ്യാപുസ്തകം 4-ലെ ജനഗണനാസന്ദർഭത്തിൽ ‘എണ്ണി’ എന്നതാണ് പ്രധാന പ്രവർത്തനം.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശ മുഖാന്തരം
  rationale: ‘മോശയുടെ കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗം ഇവിടെ മോശയുടെ മധ്യസ്ഥതയെയോ പ്രവർത്തകത്വത്തെയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി ‘മുഖാന്തരം’ ഉപയോഗിച്ചു.
- source_word: אִישׁ אִישׁ
  choice: ഓരോരുത്തനെയും
  rationale: ആവർത്തനം ഓരോ വ്യക്തിയെയും വേർതിരിച്ചു പരിഗണിക്കുന്ന വിതരണാർഥം നൽകുന്നു.
- source_word: עַל עֲבֹדָתוֹ
  choice: അവനവന്റെ ശുശ്രൂഷയ്ക്കും അനുസരിച്ച്
  rationale: עֲבֹדָה ഇവിടെ സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട് ഏൽപ്പിക്കപ്പെട്ട സേവനചുമതലയാണ്; ‘ശുശ്രൂഷ’ ആ ആരാധനാപരമായ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: וְעַל מַשָּׂאוֹ
  choice: വഹിക്കേണ്ട ചുമയ്ക്കും അനുസരിച്ച്
  rationale: מַשָּׂא വഹിക്കേണ്ട ഭാരത്തെയോ സാധനങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘വഹിക്കേണ്ട ചുമ’ ഭൗതിക ഭാരവും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വവും സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: וּפְקֻדָיו
  choice: ഓരോരുത്തന്റെയും നിയോഗം
  rationale: פקד-ൽനിന്നുള്ള ഈ ദുഷ്കരരൂപം നിയോഗം, ചുമതല, പട്ടികപ്പെടുത്തൽ എന്നീ ആശയങ്ങളുമായി ബന്ധിപ്പിക്കാം. മുൻപുള്ള ‘ഓരോരുത്തൻ’ എന്ന വിതരണഘടനയോട് ചേർത്ത് ‘ഓരോരുത്തന്റെയും നിയോഗം’ എന്നു നൽകി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: യഹോവ മോശയോടു കല്പിച്ചതുപോലെ
  rationale: അവരുടെ ക്രമീകരണം മോശയ്ക്കു ലഭിച്ച യഹോവയുടെ കല്പനയോടു പൊരുത്തപ്പെട്ടിരുന്നുവെന്ന് ബന്ധവാക്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകി.
- issue: פקד എന്ന പദത്തിലെ എണ്ണലും നിയോഗവും തമ്മിലുള്ള അർഥബന്ധം
  choice: ആദ്യ പ്രയോഗത്തിൽ ‘എണ്ണി’; ദുഷ്കരമായ അവസാന പ്രയോഗത്തിൽ ‘നിയോഗം’
  alternative: രണ്ടിടത്തും ‘എണ്ണപ്പെട്ടു/പട്ടികപ്പെടുത്തി’
  rationale: ഈ അധ്യായത്തിന്റെ ജനഗണനാസന്ദർഭം എണ്ണലിനെ പിന്തുണയ്ക്കുന്നു; അതേസമയം ഓരോരുത്തന്റെ സേവനവും ചുമയും നിശ്ചയിക്കുന്ന സന്ദർഭം അവസാനരൂപത്തിൽ നിയോഗത്തിന്റെ ആശയം അനുവദിക്കുന്നു. പാഠത്തിലെ അർഥവലിവ് ഒരൊറ്റ അർഥത്തിലേക്ക് ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. എബ്രായ വാക്യഘടനയുടെ ഭാരം കുറയ്ക്കാൻ വാക്യം രണ്ടായി വിഭജിച്ചെങ്കിലും വ്യക്തിവിതരണവും സേവനം–ചുമ എന്ന സമാന്തരതയും നിലനിർത്തി.
