revisions:
- from: പ്രാകാരത്തിന്റെ മറശ്ശീലകളും സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള പ്രാകാരകവാടത്തിന്റെ പ്രവേശനത്തിനായുള്ള തിരശ്ശീലയും അവയുടെ കയറുകളും അവയുടെ ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങളും അവകൊണ്ട് ചെയ്യേണ്ടതെല്ലാം[b] അവർ വഹിക്കണം; ഇങ്ങനെ അവർ ശുശ്രൂഷ ചെയ്യണം.
  to: പ്രാകാരത്തിന്റെ മറശ്ശീലകളും, സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ കവാടപ്രവേശനത്തിനുള്ള തിരശ്ശീലയും, അവയുടെ കയറുകളും, അവയുടെ ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങളും, അവകൊണ്ട് ചെയ്യേണ്ടതെല്ലാം[b]; അവർ ശുശ്രൂഷ ചെയ്യും.
