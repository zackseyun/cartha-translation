source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ മറശ്ശീലകളും, സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ കവാടപ്രവേശനത്തിനുള്ള തിരശ്ശീലയും, അവയുടെ കയറുകളും, അവയുടെ ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങളും, അവകൊണ്ട് ചെയ്യേണ്ടതെല്ലാം[b]; അവർ ശുശ്രൂഷ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'അഥവാ: ‘അവയ്ക്കുവേണ്ടി ചെയ്യേണ്ടതെല്ലാം.’ ഈ വസ്തുക്കൾ ഉപയോഗിച്ചു ചെയ്യുന്ന പ്രവൃത്തികളെയോ, ശുശ്രൂഷയിൽ അവയ്ക്കുവേണ്ടി ചെയ്യുന്ന കാര്യങ്ങളെയോ എബ്രായം സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തിന്റെ അതിർത്തി രൂപപ്പെടുത്തുന്ന തുണിത്തൂക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; അകത്തെ തിരശ്ശീലകളിൽനിന്ന് വേർതിരിച്ചറിയാനും മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കാനും ഈ പദം യോജിക്കുന്നു.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: സമാഗമകൂടാരത്തെ ചുറ്റിയുള്ള അടച്ച പുറംപ്രദേശത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും സംക്ഷിപ്തവുമായ വിശുദ്ധമന്ദിരപദമാണ്.
- source_word: מָסַךְ
  choice: തിരശ്ശീല
  rationale: പ്രവേശനം മറയ്ക്കുന്ന തുണിത്തടസ്സമാണ് സന്ദർഭം; ആ പ്രവർത്തനം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: פֶּתַח שַׁעַר
  choice: കവാടത്തിന്റെ പ്രവേശനം
  rationale: എബ്രായത്തിലെ ആവർത്തനസ്വഭാവമുള്ള ഘടന സംരക്ഷിച്ചുകൊണ്ട് കവാടത്തിലെ കടന്നുചെല്ലുന്ന ഭാഗത്തെ വ്യക്തമാക്കുന്നു.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള
  rationale: സമാഗമകൂടാരത്തെയും യാഗപീഠത്തെയും ചുറ്റിയുള്ള പ്രാകാരത്തിന്റെ സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: מֵיתְרֵיהֶם
  choice: അവയുടെ കയറുകൾ
  rationale: മറശ്ശീലകളോടും തിരശ്ശീലയോടും ബന്ധപ്പെട്ട കെട്ടുകയറുകളെ സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന രീതിയിൽ പറയുന്നു.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: അവയുടെ ശുശ്രൂഷയ്ക്കുള്ള സകല ഉപകരണങ്ങൾ
  rationale: כְּלִים എന്ന വിശാലമായ ഉപകരണാർഥവും עֲבֹדָהയുടെ ആരാധനാസംബന്ധിയായ സേവനഭാവവും നിലനിർത്തുന്നു.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: അവകൊണ്ട് ചെയ്യേണ്ടതെല്ലാം
  rationale: പട്ടികപ്പെടുത്തിയ വസ്തുക്കൾ ഉപയോഗിച്ച് നിർവഹിക്കേണ്ട പ്രവൃത്തികളെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; ദാതിവ് അവയ്ക്കുവേണ്ടി എന്ന അർഥവും അനുവദിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ പര്യായം ചേർക്കുന്നു.
- source_word: וְעָבָדוּ
  choice: ഇങ്ങനെ അവർ ശുശ്രൂഷ ചെയ്യണം
  rationale: മെരാര്യരുടെ നിയുക്ത വിശുദ്ധസേവനം നിർവഹിക്കണമെന്ന അവസാന നിർദേശം വ്യക്തമാക്കുന്നു; ക്രിയയുടെ ആരാധനാസംബന്ധിയായ ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם എന്നതിലെ לָהֶם-ന്റെ ബന്ധം
  choice: അവകൊണ്ട് ചെയ്യേണ്ടതെല്ലാം
  alternative: അവയ്ക്കുവേണ്ടി ചെയ്യേണ്ടതെല്ലാം
  rationale: ഉപകരണങ്ങളുടെ കൈകാര്യം/ഉപയോഗം എന്ന സന്ദർഭം ‘അവകൊണ്ട്’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും എബ്രായ ദാതിവ് ‘അവയ്ക്കുവേണ്ടി’ എന്ന വായനയും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. സമാഗമകൂടാരം, യാഗപീഠം, പ്രാകാരം, ശുശ്രൂഷ എന്നീ പരിചിതമായ വിശുദ്ധമന്ദിരപദങ്ങൾ സ്ഥിരമായി ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് a-യിലെ ropes/cords വ്യത്യാസത്തിന് മലയാളത്തിൽ പ്രസക്തമായ സ്വാഭാവിക പദഭേദം ഇല്ലാത്തതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് നൽകിയിട്ടില്ല; നൽകിയ ഏക അടിക്കുറിപ്പ് [b] മുഖ്യപാഠത്തിൽ രേഖപ്പെടുത്തിയിട്ടുണ്ട്.
