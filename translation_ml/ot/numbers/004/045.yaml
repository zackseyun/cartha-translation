source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: ml
  text: മെരാരിയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങളിലെ എണ്ണപ്പെട്ടവർ ഇവരാണ്. യഹോവ മോശെ മുഖാന്തരം നൽകിയ കല്പനപ്രകാരം[a] മോശെയും അഹരോനും ഇവരെ എണ്ണി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “യഹോവയുടെ വായ്‌പ്രകാരം”; അർഥം: “യഹോവയുടെ കല്പനപ്രകാരം.”'
    reason: lexical_alternative
  - marker: b
    text: 'എബ്രായത്തിൽ: “മോശെയുടെ കൈയാൽ”; അർഥം: “മോശെ മുഖാന്തരം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ ഇവരാണ്
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ פְקוּדֵי എന്നത് രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിൽ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരുടെ കുടുംബങ്ങളിൽ
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗവും കുടുംബവിഭാഗങ്ങളും നിലനിർത്തുന്നു; ‘മെരാര്യർ’ എന്ന ചുരുക്കരൂപത്തേക്കാൾ മൂലരൂപത്തോട് സുതാര്യമാണ്.
- source_word: פָּקַד
  choice: എണ്ണി
  rationale: ഇവിടത്തെ കണക്കെടുപ്പ്/രജിസ്ട്രേഷൻ സന്ദർഭത്തിന് യോജിക്കുന്ന ലളിതവും കൃത്യവുമായ മലയാളപദം.
- source_word: עַל פִּי יְהוָה
  choice: യഹോവ നൽകിയ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായ്‌പ്രകാരം’ എന്ന എബ്രായ ശൈലി ഇവിടെ യഹോവയുടെ കല്പനയെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ അർഥം നൽകി അക്ഷരരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിനാമംകൊണ്ട് പകരാതെ മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെ മുഖാന്തരം
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന എബ്രായ കർത്തൃത്വ/മാധ്യമ ശൈലിയുടെ സ്വാഭാവിക മലയാള അർഥം; കല്പന മോശെ മുഖാന്തരം അറിയിക്കപ്പെട്ടുവെന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ יהוה തന്നെയുള്ളതിനാൽ പദവിനാമമായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ ദൈവനാമം നിലനിർത്തുന്നു.
- issue: ദൈവകല്പനയും മോശെയുടെ മാധ്യമസ്ഥതയും തമ്മിലുള്ള ബന്ധം
  choice: മോശെ മുഖാന്തരം യഹോവ നൽകിയ കല്പനപ്രകാരം
  alternative: യഹോവയുടെ വായ്‌പ്രകാരം, മോശെയുടെ കൈയാൽ
  rationale: עַל־פִּי ... בְּיַד എന്നീ ശൈലികളുടെ സ്വാഭാവിക അർഥം നൽകുന്നു; ദൈവമാണ് കല്പനയുടെ ഉറവിടം, മോശെയാണ് അതു കൈമാറിയ മാധ്യമം എന്ന മൂലവാക്യബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. എബ്രായത്തിലെ അക്ഷരാർഥ ശൈലികൾ മുഖ്യവാചകത്തിൽ സ്വാഭാവിക അർഥത്തോടെ നൽകിയിരിക്കുന്നു; ഉറവിടരൂപങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
