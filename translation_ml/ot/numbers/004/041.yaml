source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ സേവനം ചെയ്ത ഗേർശോന്റെ പുത്രന്മാരുടെ കുടുംബങ്ങളിലെ എല്ലാവരിൽ, യഹോവയുടെ കല്പനപ്രകാരം മോശെയും അഹരോനും എണ്ണിയവർ ഇവരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സമാഗമകൂടാരത്തിൽ സേവനം ചെയ്ത ഗേർശോന്റെ പുത്രന്മാരുടെ കുടുംബങ്ങളിലെ എല്ലാവരിൽ, യഹോവയുടെ കല്പനപ്രകാരം മോശെയും അഹരോനും എണ്ണിയവർ ഇവരാണ്.”'
    reason: אֵלֶּה എന്ന ചൂണ്ടിക്കാണിക്കൽ ആഖ്യാനസന്ദർഭത്തിൽ ‘ഇവരായിരുന്നു’ എന്നു നൽകാം; എബ്രായത്തിലെ നേരിട്ടുള്ള ചൂണ്ടിക്കാണിക്കൽ നിലനിർത്തി ‘ഇവരാണ്’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ ഇവരായിരുന്നു
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ സമാപനസംഗ്രഹമാണ് ഈ വാക്യം. ഭൂതകാല ആഖ്യാനസന്ദർഭത്തിന് യോജിച്ചുകൊണ്ട് אֵלֶּה എന്നതിനെ ‘ഇവരായിരുന്നു’ എന്നും פְקוּדֵי എന്നതിനെ ‘എണ്ണപ്പെട്ടവർ’ എന്നും നൽകി.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാരുടെ കുടുംബങ്ങളിൽനിന്ന്
  rationale: എബ്രായത്തിലെ ബന്ധുത്വപ്രയോഗം നിലനിർത്തുന്നു; എണ്ണപ്പെട്ടവർ ഈ കുടുംബങ്ങളിൽ ഉൾപ്പെട്ടവരാണെന്ന അർഥം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘കുടുംബങ്ങളിൽനിന്ന്’ എന്നു നൽകി.
- source_word: כָּל הָעֹבֵד
  choice: സേവനം ചെയ്ത
  rationale: עבד എന്ന പദത്തിന്റെ ഈ ആരാധനാലയസന്ദർഭത്തിലെ അർഥം ‘സേവിക്കുക’ എന്നാണ്. കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ ആപേക്ഷിക വിശേഷണമായി നൽകി.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד എന്ന വിശുദ്ധകൂടാരനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസൂചകവുമായ രൂപം; בְּ എന്നതിന് ‘-ത്തിൽ’ നൽകി.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: മോശയും അഹരോനും എണ്ണിയവരായി
  rationale: פקד എന്ന ധാതുവിന്റെ ജനസംഖ്യാ കണക്കെടുപ്പ് അർഥം നിലനിർത്തി; ആരാണ് എണ്ണിയതെന്ന ബന്ധവാക്യം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിച്ചു.
- source_word: עַל פִּי יְהוָה
  choice: യഹോവയുടെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായനുസരിച്ച്’ എന്ന എബ്രായ ശൈലി ദൈവിക ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; അതിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘കല്പനപ്രകാരം’ എന്നു നൽകി.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റണിനെ ഒരു പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള വ്യക്തിനാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ
  rationale: വാചകം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. മലയാള വായനക്കാർക്ക് സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപം തിരഞ്ഞെടുത്തു; ‘യാഹ്‌വേ’ എന്നത് സാധ്യതയുള്ള മറ്റൊരു ശാസ്ത്രീയ ലിപ്യന്തരണമാണ്.
- issue: സമാഗമകൂടാരത്തിലെ עבד എന്ന സേവനം
  choice: സേവനം ചെയ്ത
  alternative: വേല ചെയ്ത
  rationale: ഇവിടെ ലേവ്യരുടെ വിശുദ്ധകൂടാരചുമതലയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സേവനം’ എന്നത് ആ ചുമതലയുടെ ആരാധനാസംബന്ധിയായ സ്വഭാവം പ്രകടമാക്കുന്നു; പ്രത്യേക പുരോഹിതകർമം എന്ന് അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എബ്രായ വാക്യത്തിലെ കണക്കെടുപ്പ്-സംഗ്രഹഭാവവും ബന്ധുത്വപ്രയോഗവും ദൈവനാമവും സംരക്ഷിച്ചു; മലയാളത്തിലെ സ്വാഭാവിക വിവരക്രമത്തിനായി ദൈവകല്പനയും എണ്ണിയവരെയും ആദ്യം സ്ഥാപിച്ചു.
