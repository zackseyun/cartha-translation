translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആചാരനിർദേശശൈലി ഉപയോഗിച്ചു. ‘വിശുദ്ധമന്ദിരം’ എന്ന പദം പിന്നീട് പണിത ദേവാലയവുമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാനായി ‘വിശുദ്ധസ്ഥലം’ സ്വീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
