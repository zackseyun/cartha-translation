source:
  edition: WLC
  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: ml
  text: വിശുദ്ധസ്ഥലത്ത് ശുശ്രൂഷ ചെയ്യാൻ ഉപയോഗിക്കുന്ന എല്ലാ ശുശ്രൂഷോപകരണങ്ങളും അവർ എടുത്ത് നീലത്തുണിയിൽ വെക്കണം. അവയെ മേന്മയുള്ള തോൽകൊണ്ടുള്ള ഒരു മൂടികൊണ്ട് മൂടി[a], ചുമക്കാനുള്ള കോലിന്മേൽ വെക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മേന്മയുള്ള തോൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന തഹഷ് (תָּחַשׁ) എന്ന എബ്രായപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്. അത് ഒരു പ്രത്യേക ജീവിയുടെ തോലിനെയോ മേന്മയുള്ളതോ ഈടുനിൽക്കുന്നതോ ആയ ഒരിനം തോലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ചുമക്കാനുള്ള ദണ്ഡിന്മേൽ വെക്കണം.’ എബ്രായപാഠത്തിൽ ‘കോൽ/ദണ്ഡ്’ എന്ന ഏകവചനപദമാണ്; അത് ചുമക്കാനുള്ള സംവിധാനം മുഴുവനായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: അവർ എടുത്ത് ... വെക്കണം
  rationale: തുടർച്ചയായ ആചാരനിർദേശത്തിന്റെ സ്വഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ നിർദേശാർഥകമായ ‘വെക്കണം’ എന്ന ക്രിയാരൂപത്തോടു ചേർത്തു.
- source_word: כָּל כְּלֵי הַשָּׁרֵת אֲשֶׁר יְשָׁרְתוּ בָם
  choice: ശുശ്രൂഷ ചെയ്യാൻ ഉപയോഗിക്കുന്ന എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִי എന്നത് ഇവിടെ പാത്രങ്ങൾ മാത്രമല്ല, വിശുദ്ധശുശ്രൂഷയ്ക്കുള്ള വിവിധ ഉപകരണങ്ങളെയും ഉൾക്കൊള്ളുന്നു; שרת-ന്റെ ആരാധനാസംബന്ധമായ സേവനാർഥം ‘ശുശ്രൂഷ’ എന്നു നിലനിർത്തുന്നു.
- source_word: בַּקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘വിശുദ്ധമായ സ്ഥലത്ത്’ എന്നാണ്; പ്രത്യേകിച്ച് ഉള്ളറയെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ വിശുദ്ധമേഖലയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ഒരു നീലത്തുണി
  rationale: പൊതിയുന്ന സാഹചര്യത്തിൽ בֶּגֶד എന്നതിന് ‘വസ്ത്രം’ എന്നതിനെക്കാൾ ‘തുണി’ സ്വാഭാവികം; תְּכֵלֶת-ന്റെ നീല/നീലകലർന്ന നിറം ലളിതമായി ‘നീല’ എന്നു നൽകി.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: മേന്മയുള്ള തോൽകൊണ്ടുള്ള ഒരു മൂടി
  rationale: תָּחַשׁ സൂചിപ്പിക്കുന്ന ജീവിയോ തോലിന്റെ ഇനമോ നിശ്ചിതമല്ല. അനുമാനപരമായ ജീവിനാമം ഒഴിവാക്കി സംരക്ഷക തോൽമൂടി എന്ന ആശയം മുഖ്യപാഠത്തിൽ നൽകി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: ചുമക്കാനുള്ള ചട്ടത്തിന്മേൽ വെക്കണം
  rationale: מוֹט ഏകവചനത്തിൽ ദണ്ഡ്/കോൽ എന്നർഥം നൽകാമെങ്കിലും ഇവിടെ ചുമക്കാനുള്ള സംവിധാനത്തെ സൂചിപ്പിക്കാം. പ്രവർത്തനം വ്യക്തമായി നൽകുന്ന ‘ചുമക്കാനുള്ള ചട്ടം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
