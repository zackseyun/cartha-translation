id: NUM.4.19
reference: Numbers 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: ml
  text: 'എന്നാൽ, അവർ അതിവിശുദ്ധ വസ്തുക്കളെ[a] സമീപിക്കുമ്പോൾ ജീവനോടിരിക്കാനും മരിക്കാതിരിക്കാനും അവർക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യുക: അഹരോനും പുത്രന്മാരും വന്ന് ഓരോ പുരുഷനെയും[b] അവന്റെ സേവനത്തിനും അവൻ വഹിക്കേണ്ട ചുമടിനും നിയോഗിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിവിശുദ്ധസ്ഥലത്തെ’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ വഹിക്കേണ്ട ചുമതലകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ അതിവിശുദ്ധമായ വിശുദ്ധോപകരണങ്ങളെയോ വസ്തുക്കളെയോ ആണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘പുരുഷൻ പുരുഷൻ’; ഓരോ പുരുഷനും അവനവന്റെ സേവനവും ചുമടും പ്രത്യേകം നിയോഗിക്കപ്പെടണം എന്നർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: എന്നാൽ ... അവർക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യുക
  rationale: വാക്യാരംഭത്തിലെ നിർദേശപരവും സന്ദർഭത്തിൽ വ്യത്യാസസൂചകവുമായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; לָהֶם എന്നതിന്റെ ഗുണഭോക്തൃഭാവം ‘അവർക്കുവേണ്ടി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: ജീവനോടിരിക്കാനും മരിക്കാതിരിക്കാനും
  rationale: കല്പിച്ച പ്രവൃത്തിയുടെ ഉദ്ദേശ്യഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ജീവനും മരണവും തമ്മിലുള്ള മൂലപാഠത്തിലെ ശക്തമായ വിരോധം നിലനിർത്തുന്നു.
- source_word: בְּגִשְׁתָּם
  choice: അവർ ... സമീപിക്കുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന കാലസാഹചര്യവും נגשׁ എന്നതിലെ വിശുദ്ധസാന്നിധ്യത്തോടടുത്തുചെല്ലുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: അതിവിശുദ്ധ വസ്തുക്കൾ
  rationale: വഹിക്കാനുള്ള ചുമതലകളെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ ഈ പ്രയോഗം അതിവിശുദ്ധ ഉപകരണങ്ങളെയോ വസ്തുക്കളെയോ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു; സ്ഥലസൂചകമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: അഹരോനും പുത്രന്മാരും വന്ന്
  rationale: ആജ്ഞാത്മക നിയമസന്ദർഭത്തിലെ imperfect-ന്റെ നിർദേശഭാവം തുടർന്നുള്ള ‘നിയോഗിക്കണം’ എന്ന ക്രിയയോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഓരോ പുരുഷനെയും
  rationale: ആവർത്തിതമായ ഇഷ് എന്ന പദത്തിന്റെ വിതരണാർഥവും ഇവിടെ പുരുഷ ലേവ്യരാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന ലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: עַל עֲבֹדָתוֹ
  choice: അവന്റെ സേവനത്തിന്
  rationale: ലേവ്യരുടെ നിർദിഷ്ട ആരാധനാ/കൂടാരസേവനത്തെ സൂചിപ്പിക്കുന്ന עֲבֹדָה എന്ന പദത്തിന് വ്യക്തവും മാന്യവുമായ മലയാളം.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: അവൻ വഹിക്കേണ്ട ചുമടിന്
  rationale: ഗതാഗതസന്ദർഭത്തിൽ מַשָּׂא സൂചിപ്പിക്കുന്ന മൂർത്തമായ വഹിക്കാനുള്ള ചുമട് വ്യക്തമാക്കുന്നു; ‘ഭാരം’ എന്ന അമൂർത്ത അർഥം അനാവശ്യമായി വരുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ‘അതിവിശുദ്ധ വസ്തുക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അതിവിശുദ്ധസ്ഥലം’ അഥവാ ‘വിശുദ്ധാതിവിശുദ്ധം’.
  rationale: മൂടിവെച്ച വിശുദ്ധോപകരണങ്ങൾ വഹിക്കുന്ന കെഹാത്യരുടെ ചുമതലയാണ് സമീപസന്ദർഭം. അതിനാൽ വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന വായന പ്രധാനപാഠത്തിൽ യോജിക്കുന്നു; എന്നാൽ എബ്രായപ്രയോഗത്തിന്റെ സ്ഥലസൂചക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: אִישׁ אִישׁ എന്നതിലെ ലിംഗവും വിതരണാർഥവും
  choice: ‘ഓരോ പുരുഷനെയും’ എന്നു നൽകി.
  alternative: ‘ഓരോരുത്തനെയും’.
  rationale: ഇവിടെ സേവനത്തിനു നിയോഗിക്കപ്പെടുന്നത് പുരുഷ ലേവ്യരായതിനാൽ മൂലപാഠത്തിലെ പുരുഷലിംഗം ഇല്ലാതാക്കാതെ, ഓരോ വ്യക്തിക്കും പ്രത്യേകം ചുമതല നൽകുന്നു എന്ന വിതരണാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം, നിയമനിർദേശത്തിന്റെ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി പാലിച്ചു. ‘അഹരോൻ’, ‘സേവനം’, ‘നിയോഗിക്കുക’, ‘ചുമട്’ എന്നിവ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്; മൂലപാഠത്തിലെ അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
