translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. എബ്രായത്തിലെ അവസാന പ്രയോഗത്തിന്റെ സാന്ദ്രത മുഖ്യപാഠത്തിൽ ഭാഗികമായി നിലനിർത്തി; വ്യക്തിഗത ചുമതല എന്ന അർഥം കൂടുതൽ തെളിച്ചത്തോടെ അടിക്കുറിപ്പിൽ നൽകി.
