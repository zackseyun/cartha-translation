base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: ml
  text: പ്രാകാരത്തിനു ചുറ്റുമുള്ള തൂണുകളും അവയുടെ അടിത്തറകളും അവയുടെ കുറ്റികളും അവയുടെ കയറുകളും, അവയുടെ സകല ഉപകരണങ്ങളും അവയുമായി ബന്ധപ്പെട്ട സകല സേവനവും; അവർ ചുമക്കേണ്ട ചുമതലയുമായി ബന്ധപ്പെട്ട ഉപകരണങ്ങൾ നിങ്ങൾ പേര്‌പ്രകാരം നിയോഗിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ സുഗമമായി: “ഓരോരുത്തൻ ചുമക്കേണ്ട ഉപകരണങ്ങൾ നിങ്ങൾ അവനവന്റെ പേരിൽ നിയോഗിക്കണം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ തൂണുകൾ
  rationale: עַמּוּדִים ഘടനാപരമായ തൂണുകളെയും הֶחָצֵר പ്രാകാരത്തെയും സൂചിപ്പിക്കുന്നു; סָבִיב പ്രാകാരത്തിന്റെ ചുറ്റളവിലുള്ള സ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: സമാഗമകൂടാരസന്ദർഭത്തിൽ אֶדֶן തൂണിനെ താങ്ങുന്ന അടിത്തറയെയോ സോക്കറ്റിനെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ചുവടുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: יְתֵדֹתָם
  choice: അവയുടെ കുറ്റികൾ
  rationale: יָתֵד കൂടാരഘടന ഉറപ്പിക്കാൻ ഉപയോഗിക്കുന്ന കുറ്റി അഥവാ മുളയെ സൂചിപ്പിക്കുന്നു; കയറുകളോടൊപ്പമുള്ള ഈ സന്ദർഭത്തിൽ ‘കുറ്റികൾ’ യോജിക്കുന്നു.
- source_word: מֵיתְרֵיהֶם
  choice: അവയുടെ കയറുകൾ
  rationale: מֵיתָר കൂടാരം ഉറപ്പിക്കുന്ന ചരടിനെയോ കയറിനെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് ‘കയറുകൾ’ വ്യക്തമാണ്.
- source_word: לְכָל כְּלֵיהֶם
  choice: അവയുടെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִים പാത്രങ്ങൾ, സാമഗ്രികൾ, ഉപകരണങ്ങൾ എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്; ഇവിടെ അനുബന്ധ സാമഗ്രികളായതിനാൽ ‘ഉപകരണങ്ങൾ’ അനുയോജ്യം.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: അവയോടു ബന്ധപ്പെട്ട എല്ലാ സേവനവും
  rationale: עֲבֹדָה ജോലി, സേവനം, നിയോഗിക്കപ്പെട്ട കടമ എന്നിവ സൂചിപ്പിക്കുന്നു; ലേവ്യസേവനത്തിന്റെ ഔദ്യോഗിക ഭാവം ‘സേവനം’ നിലനിർത്തുന്നു.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: നിങ്ങൾ ഓരോന്നായി പേരുപറഞ്ഞ് ഏല്പിക്കണം
  rationale: פקד എന്നത് ഇവിടെ വെറും എണ്ണൽമാത്രമല്ല, പേരനുസരിച്ച് ഉത്തരവാദിത്വം നിശ്ചയിക്കലാണ്. ‘പേരുപറഞ്ഞ് ഏല്പിക്കുക’ വ്യക്തിഗത നിയോഗം വ്യക്തമാക്കുന്നു.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: അവർ ചുമക്കേണ്ട ചുമതലയിലുള്ള ഉപകരണങ്ങൾ
  rationale: כְּלֵי, מִשְׁמֶרֶת, מַשָּׂא എന്നിവ ചേർന്ന സാന്ദ്രമായ പ്രയോഗം അവർ ഉത്തരവാദിത്വത്തോടെ ചുമക്കേണ്ട പ്രത്യേക സാധനങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർഥം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഘടനയുടെ സാന്ദ്രതയും നിലനിർത്തുന്നു.
