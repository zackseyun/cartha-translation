  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: ml
  text: അവർ തിരുനിവാസത്തിന്റെ തിരശ്ശീലകളും സമാഗമകൂടാരവും അതിന്റെ മൂടിയും അതിനു മീതെ ഏറ്റവും മുകളിലുള്ള തഹശ് കൊണ്ടുള്ള മൂടിയും സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള മറശ്ശീലയും ചുമക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തഹശ്” (תַּחַשׁ) ഏതു വസ്തുവിനെയോ മൃഗത്തോലിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് ഉറപ്പില്ല. പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ചിലത് ഒരു പ്രത്യേക മൃഗത്തിന്റെ തോൽ എന്നു പറയുന്നു; മറ്റുള്ളവ “തഹശ്” എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: അവർ ... ചുമക്കണം
  rationale: സങ്കേതോപകരണങ്ങൾ യാത്രയിൽ എടുത്തുകൊണ്ടുപോകുന്ന സന്ദർഭത്തിൽ נשׂא എന്നതിന്റെ ചുമക്കുക/വഹിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ തിരശ്ശീലകൾ
  rationale: יְרִיעֹת തുണികൊണ്ടുള്ള വിരിപ്പുകളെയോ പാളികളെയോ സൂചിപ്പിക്കുന്നു; מִשְׁכָּן എന്ന വിശുദ്ധമന്ദിരപദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും അർഥസൂചകവുമായ ‘തിരുനിവാസം’ ഉപയോഗിച്ചു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: കൂടാരത്തിന്റെ ഭൗതികരൂപവും കൂടിക്കാഴ്ചയുടെ ധർമവും സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്ഥാപിതമായ സംയുക്തപദം.
- source_word: מִכְסֵהוּ
  choice: അതിന്റെ മൂടി
  rationale: പ്രത്യയം സമാഗമകൂടാരത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠം വ്യക്തമാക്കാത്ത മൂടിയുടെ പാളിയോ വസ്തുവോ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: തഹശ് തോൽകൊണ്ടുള്ള മൂടി
  rationale: תַּחַשׁ ഏതു മൃഗത്തെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമായതിനാൽ ‘മേന്മയുള്ള തോൽ’ എന്നു വ്യാഖ്യാനിച്ച് അനിശ്ചിതത്വം നീക്കാതെ പദം ലിപ്യന്തരണം ചെയ്തു.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: അതിനുമീതെ ഏറ്റവും മുകളിലുള്ള
  rationale: മൂടിയുടെ ഏറ്റവും മുകളിലെ സ്ഥാനം വ്യക്തമാക്കുന്ന എബ്രായപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: מָסַךְ פֶּתַח
  choice: പ്രവേശനത്തിനുള്ള മറശ്ശീല
  rationale: מָסָךְ പ്രവേശനം മറയ്ക്കുന്ന തൂക്കുതുണിയാണ്; ‘മറശ്ശീല’ അതിന്റെ വസ്തുരൂപവും പ്രവർത്തനവും വ്യക്തമാക്കുന്നു.
