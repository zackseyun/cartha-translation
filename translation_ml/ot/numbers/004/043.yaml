  terminology: ‘സമാഗമകൂടാരം’ is an appropriate established rendering for אֹהֶל מוֹעֵד. ‘സേവനം’ and ‘വേല’ adequately retain the distinction between צָבָא and עֲבֹדָה without importing a narrowly military sense.
