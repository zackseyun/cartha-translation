  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ള, സേവനത്തിനും സമാഗമകൂടാരത്തിലെ വേലയ്ക്കുമായി വരുന്ന എല്ലാവരും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ
  rationale: ഹീബ്രായ പ്രായപ്രയോഗവും ഉൾക്കൊള്ളുന്ന താഴെയും മുകളിലെയും പരിധികളും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל הַבָּא
  choice: വരുന്ന എല്ലാവരും
  rationale: בוא എന്ന വർത്തമാനകൃദന്തരൂപത്തിന്റെ ചലന/ഹാജരാകൽ ഭാവം നിലനിർത്തുന്നു; ‘പ്രവേശിക്കുന്ന’ എന്നു നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: לַצָּבָא
  choice: ക്രമീകൃത സേവനത്തിനു
  rationale: צָבָא എന്ന പദത്തിലെ സംഘടിത ചുമതലയുടെ ഭാവം സൂക്ഷിക്കുമ്പോൾ ഇവിടെ ഉദ്ദേശിക്കാത്ത സൈനിക അർഥം ഒഴിവാക്കുന്നു.
- source_word: לַעֲבֹדָה
  choice: വേലയ്ക്കായി
  rationale: עֲבֹדָהയെ വേല എന്നു പരിഭാഷപ്പെടുത്തി, അതിനു മുമ്പുള്ള സംഘടിത സേവനത്തെ സൂചിപ്പിക്കുന്ന പദവുമായി ഉള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ
  rationale: പഞ്ചഗ്രന്ഥത്തിൽ പ്രചാരമുള്ള ‘സമാഗമകൂടാരം’ എന്ന പദപ്രയോഗം ഉപയോഗിച്ച് בְּ എന്നതിന്റെ സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: לַצָּבָא എന്നതിന്റെ സൈനികമോ ലേവ്യസേവനപരമോ ആയ ഭാവം
  choice: ക്രമീകൃത സേവനം
  alternative: സൈനികസേവനം / സേന
  rationale: സന്ദർഭം ലേവ്യരുടെ സമാഗമകൂടാരശുശ്രൂഷയാണ്; എന്നിരുന്നാലും പദത്തിലുള്ള സംഘടിത ചുമതലയുടെ ഭാവം ‘ക്രമീകൃത’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ രണ്ട് സേവനപദങ്ങളുടെ വ്യത്യാസം ‘ക്രമീകൃത സേവനം’, ‘വേല’ എന്നിങ്ങനെ നിലനിർത്തിയിരിക്കുന്നു.
