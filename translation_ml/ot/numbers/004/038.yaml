  yaml_path: translation/ot/numbers/004/038.yaml
  text: 'And the numbered men of the sons of Gershon, by their clans and by their fathers'' houses:'
translation:
  language: ml
  text: 'ഗേർശോന്റെ പുത്രന്മാരിൽ, അവരുടെ കുടുംബങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും എണ്ണപ്പെട്ട പുരുഷന്മാർ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിന്റെ ഈ സന്ദർഭത്തിലെ കണക്കെടുപ്പ്/പട്ടികപ്പെടുത്തൽ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; പുരുഷന്മാരെക്കുറിച്ചാണെന്നത് സമീപസന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ ഇവിടെ പ്രത്യേകമായി ‘പുരുഷന്മാർ’ ചേർത്തിട്ടില്ല.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാരിൽ
  rationale: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘പുത്രന്മാർ’ നിലനിർത്തുകയും എണ്ണപ്പെട്ടവർ ആ കൂട്ടത്തിൽപ്പെട്ടവരാണെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘-യിൽ’ ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: משפחה ഇവിടെ ജനവിഭാഗത്തിനുള്ളിലെ കുടുംബ/കുലഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വംശങ്ങൾ’ ഈ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: וּלְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരവും
  rationale: בית אבות എന്ന ഇസ്രായേല്യ സാമൂഹിക ഘടകത്തെ പദസമീപമായി നിലനിർത്തുന്നു; ‘-പ്രകാരവും’ വിഭാഗീകരണത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യം അടുത്ത വാക്യത്തിലേക്ക് നയിക്കുന്ന അപൂർണ്ണ പട്ടികാഭിമുഖ ഘടനയായതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു നിലനിർത്തി.
