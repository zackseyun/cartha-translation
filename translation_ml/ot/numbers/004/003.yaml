id: NUM.4.3
reference: Numbers 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל בָּא֙ לַ/צָּבָ֔א לַ/עֲשׂ֥וֹת מְלָאכָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/003.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ള, സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാൻ സേവനത്തിനായി വരുന്ന എല്ലാവരെയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ള
  rationale: בֶּן + സംഖ്യ + שָׁנָה പ്രായം സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണ്. וָמַעְלָהയും וְעַדയും ചേർന്ന് മുപ്പത് മുതൽ അമ്പത് വരെയുള്ള പ്രായപരിധി നിർണ്ണയിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രായപരിധിയായി വിവർത്തനം ചെയ്തു.
- source_word: כָּל בָּא
  choice: പ്രവേശിക്കുന്ന എല്ലാവരെയും
  rationale: പങ്കാളിത്തത്തിനായി വരുക/പ്രവേശിക്കുക എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ആശയം നിലനിർത്തുന്നു. വാക്യം 2-ൽ ആരംഭിക്കുന്ന എണ്ണൽനിർദേശത്തിന്റെ കർമമായി വരുന്ന സന്ദർഭം പരിഗണിച്ച് ‘എല്ലാവരെയും’ എന്നു പ്രയോഗിച്ചു.
- source_word: לַצָּבָא
  choice: സേവനത്തിൽ
  rationale: צָבָא എന്നതിന് സൈന്യം, സംഘം, നിയുക്തസേവനം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ ലേവ്യരുടെ ക്രമീകരിക്കപ്പെട്ട ദൗത്യസേവനമാണ് ഉദ്ദേശ്യം; യുദ്ധസൂചന ഒഴിവാക്കി ‘സേവനം’ തെരഞ്ഞെടുത്തു.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: വേല ചെയ്യുന്നതിനുള്ള
  rationale: ലക്ഷ്യം സൂചിപ്പിക്കുന്ന ക്രിയാരൂപവും മְלָאכָהയുടെ പ്രായോഗിക അധ്വാനാർഥവും ലളിതമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: אֹהֶל מוֹעֵד എന്ന വിശുദ്ധകൂടാരത്തിന്റെ പതിവായ മലയാള നാമം ഉപയോഗിച്ചു; בְּ എന്ന ഉപസർഗത്തിന് സന്ദർഭോചിതമായി ‘-ത്തിൽ’ നൽകി.
theological_decisions:
- issue: צָבָא എന്ന പദത്തിന്റെ സൈനികമോ ആരാധനാസേവനപരമോ ആയ അർഥം
  choice: സേവനം
  alternative: സൈന്യം / സംഘം / നിയുക്ത ചുമതല
  rationale: സംഖ്യാപുസ്തകം 4-ലെ സന്ദർഭം ലേവ്യരുടെ ക്രമീകരിക്കപ്പെട്ട കൂടാരവേലയെക്കുറിച്ചാണ്; അതിനാൽ സൈനിക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതെ സേവനാർഥം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഈ വാക്യഭാഗം മുൻവാക്യത്തിലെ എണ്ണൽനിർദേശത്തെ പൂർത്തിയാക്കുന്നതിനാൽ കർമവിഭക്തിയായ ‘എല്ലാവരെയും’ നിലനിർത്തി.
