revisions:
- from: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ള, സമാഗമകൂടാരത്തിൽ വേല ചെയ്യുന്നതിനുള്ള സേവനത്തിൽ പ്രവേശിക്കുന്ന എല്ലാവരെയും.
  to: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ള, സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാൻ സേവനത്തിനായി വരുന്ന എല്ലാവരെയും.
  rationale: The revision retains the verse’s dependent, accusative form in light of the preceding counting command, preserves the thirty-to-fifty age range, and renders the Hebrew idiom ‘all who come for the service’ in clear modern Malayalam. No footnote is needed because the main text does not conceal a material ambiguity requiring explanation.
