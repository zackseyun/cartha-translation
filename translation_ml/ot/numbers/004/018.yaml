source:
  edition: WLC
  text: אַל תַּכְרִ֕יתוּ אֶת שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י מִ/תּ֖וֹךְ הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: ml
  text: കെഹാത്യകുടുംബങ്ങളുടെ ഗോത്രം ലേവ്യരുടെ ഇടയിൽനിന്ന് അറ്റുപോകാൻ ഇടവരുത്തരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കെഹാത്യകുടുംബങ്ങളുടെ കുലത്തെ ലേവ്യരുടെ ഇടയിൽനിന്ന് നശിപ്പിക്കരുത്.” എബ്രായ ക്രിയയ്ക്ക് ‘അറ്റുപോകാൻ ഇടവരുത്തുക’ എന്നും ‘നശിപ്പിക്കുക’ എന്നും അർഥമാകാം; ‘കുടുംബങ്ങൾ’ എന്നത് ‘കുലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: അരുത്
  rationale: നിരോധനം സൂചിപ്പിക്കുന്ന നിഷേധകണം; ആധുനിക മലയാളത്തിൽ കല്പനയുടെ വ്യക്തമായ നിഷേധരൂപം നൽകുന്നു.
- source_word: תַּכְרִיתוּ
  choice: അറ്റുപോകാൻ ഇടവരുത്തുക
  rationale: ഹിഫീൽ രൂപത്തിന്റെ കാരണാർഥം (‘അറ്റുപോകാൻ/നശിക്കാൻ ഇടയാക്കുക’) പ്രകടമാക്കുകയും, ‘നശിപ്പിക്കുക’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് വാക്യത്തെ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: שֵׁבֶט
  choice: ഗോത്രം
  rationale: വംശാവലിപരമായ ഈ സന്ദർഭത്തിൽ ഒരു ഗോത്രവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പതിവുമായ മലയാളപദം.
- source_word: מִשְׁפְּחֹת
  choice: കുടുംബങ്ങൾ
  rationale: കെഹാത്യവംശത്തിലെ ഘടക കുടുംബവിഭാഗങ്ങളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘കുലങ്ങൾ’ എന്നതും സാധ്യമാണ്.
- source_word: הַקְּהָתִי
  choice: കെഹാത്യ
  rationale: എബ്രായത്തിലെ ഏകവചന വിശേഷണ/ജനവിഭാഗരൂപം ഇവിടെ കൂട്ടായ അർഥത്തിലാണ്; ‘കെഹാത്യകുടുംബങ്ങൾ’ എന്ന സംയുക്തപ്രയോഗം അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: מִתּוֹךְ
  choice: ഇടയിൽനിന്ന്
  rationale: ഒരു വലിയ സമൂഹത്തിനുള്ളിൽനിന്നുള്ള വേർപാടിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഗോത്രനാമത്തിന്റെ പതിവായ മലയാളരൂപം; കെഹാത്യർ ലേവ്യരിലെ ഒരു ഉപവിഭാഗമാണ്.
theological_decisions:
- issue: കെഹാത്യരുടെ വിധിയെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: അവരുടെ ഗോത്രം ലേവ്യരുടെ ഇടയിൽനിന്ന് അറ്റുപോകാൻ ഇടവരുത്തരുതെന്ന മുന്നറിയിപ്പ്
  alternative: കെഹാത്യകുലത്തെ നശിപ്പിക്കരുതെന്ന പൊതുവായ കല്പന
  rationale: വാക്യം അത് സംഭവിക്കുന്ന രീതി വ്യക്തമാക്കുന്നില്ല; തുടർന്നുള്ള സന്ദർഭം വിശുദ്ധവസ്തുക്കളോടുള്ള തെറ്റായ സമീപനം മരണത്തിന് ഇടയാക്കുമെന്ന് വിശദീകരിക്കുന്നു. അതിനാൽ ആ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ എബ്രായത്തിലെ വിശാലമായ കാരണാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അറ്റുപോകാൻ ഇടവരുത്തരുത്’ എന്ന രൂപം മൂലത്തിലെ കാരണാർഥവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
