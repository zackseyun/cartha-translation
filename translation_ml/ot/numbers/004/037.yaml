id: NUM.4.37
reference: Numbers 4:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ സേവനമനുഷ്ഠിച്ചിരുന്ന കെഹാത്ത്യരുടെ കുടുംബങ്ങളിലെ എണ്ണപ്പെട്ടവർ ഇവരാണ്. യാഹ്‌വെയുടെ കല്പനപ്രകാരം മോശ മുഖാന്തരം മോശയും അഹരോനും അവരെ എണ്ണി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശയുടെ കൈയാൽ.”
    reason: ബְּיַד מֹשֶׁה എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാ/സേവനകണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ פקד എന്ന ധാതുവിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു; അമൂർത്തമായ ‘കണക്ക്’ എന്നതിനെക്കാൾ വ്യക്തികളെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: കെഹാത്യകുടുംബങ്ങൾ
  rationale: מִשְׁפְּחֹת കുടുംബവിഭാഗങ്ങളെയോ കുലങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘കുടുംബങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: כָּל הָעֹבֵד
  choice: സേവനം ചെയ്ത എല്ലാവരും
  rationale: עבד എന്ന കൃതന്തം സേവനത്തിൽ ഏർപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യം പൂർത്തിയായ കണക്കെടുപ്പിനെ സംഗ്രഹിക്കുന്നതിനാൽ മലയാളത്തിൽ ഭൂതകാലപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധ കൂടാരത്തിനുള്ള പ്രചാരത്തിലുള്ളതും അർത്ഥവത്തുമായ മലയാളനാമം; בְּ സൂചിപ്പിക്കുന്ന സേവനമേഖല ‘-ത്തിൽ’ കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: אֲשֶׁר פָּקַד
  choice: എണ്ണിയവർ
  rationale: ഇവിടെ פקד നിയമിക്കുകയല്ല, കണക്കെടുക്കുകയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു; ബന്ധവാക്യം മുമ്പുള്ള വ്യക്തികളിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: עַל פִּי יְהוָה
  choice: യഹോവയുടെ കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥമായ ‘വായ്പ്രകാരം’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർത്ഥം ദൈവിക കല്പനയും അധികാരവും വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ സ്ഥിരമായി പ്രചാരത്തിലുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശ മുഖാന്തരം
  rationale: ‘മോശയുടെ കൈയാൽ’ എന്ന അക്ഷരാർഥപ്രയോഗം ഇവിടെ കർത്തൃത്വമോ മധ്യസ്ഥതയോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘മുഖാന്തരം’ ആ അർത്ഥം നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ നാമം നിലനിർത്തുന്നു.
- issue: בְּיַד מֹשֶׁה എന്നതിലെ മധ്യസ്ഥത/കർത്തൃത്വം
  choice: മോശ മുഖാന്തരം
  alternative: മോശയുടെ കൈയാൽ
  rationale: ഹീബ്രു ഭാഷാശൈലി മധ്യസ്ഥതയെയോ ഏജൻസിയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുമ്പോഴും മോശയുടെ ഇടനിലപങ്ക് അനാവശ്യമായി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാഗമകൂടാരം’ പോലുള്ള പരിചിത ബൈബിൾ പദം നിലനിർത്തി; ഹീബ്രു വാക്യത്തിലെ സംഗ്രഹസ്വഭാവം ഡാഷുകൾകൊണ്ട് വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
