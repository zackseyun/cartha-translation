revisions:
- from: ഇവരായിരുന്നു കെഹാത്യകുടുംബങ്ങളിൽ എണ്ണപ്പെട്ടവർ—സമാഗമകൂടാരത്തിൽ സേവനം ചെയ്ത എല്ലാവരും—യഹോവയുടെ കല്പനപ്രകാരം മോശ മുഖാന്തരം മോശയും അഹരോനും എണ്ണിയവർ.[a]
  to: സമാഗമകൂടാരത്തിൽ സേവനമനുഷ്ഠിച്ചിരുന്ന കെഹാത്ത്യരുടെ കുടുംബങ്ങളിലെ എണ്ണപ്പെട്ടവർ ഇവരാണ്. യാഹ്‌വെയുടെ കല്പനപ്രകാരം മോശ മുഖാന്തരം മോശയും അഹരോനും അവരെ എണ്ണി.[a]
  rationale: The revision clarifies that the counted people belong to the Kohathite family groups, retains the service and census sense, and recasts the syntax for modern Malayalam without eliminating the source’s deliberate repetition of Moses. It also aligns the Malayalam rendering of יהוה with the POB’s stipulated Yahweh form. The footnote remains anchored to ‘മോശ മുഖാന്തരം’ and preserves the literal alternative.
