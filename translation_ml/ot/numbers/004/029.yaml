  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: ml
  text: മെരാരിയുടെ പുത്രന്മാരെ[a] അവരുടെ കുലങ്ങൾ അനുസരിച്ചും പിതൃഭവനങ്ങൾ അനുസരിച്ചും[b] നീ എണ്ണണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മെരാരിയുടെ വംശജരെ’ അല്ലെങ്കിൽ ‘മെരാരിയരെ.’
    reason: lexical_alternative
  - marker: b
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന എബ്രായ വംശാവലിപ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: വ്യക്തിനാമത്തോടുചേർന്ന בְּנֵי എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ ജനഗണനാസന്ദർഭത്തിൽ മെരാരിയുടെ വംശജരെയാണ് സൂചിപ്പിക്കുന്നത്. എബ്രായത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്താൻ ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ഗോത്ര-ജനഗണനാസന്ദർഭത്തിൽ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ സാധാരണ ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘കുലങ്ങൾ’ വ്യക്തമാണ്.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ഇത് പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വംശാവലിപ്രയോഗമാണ്. ‘പിതൃഭവനങ്ങൾ’ മൂലഭാഷയിലെ സാമൂഹികഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: תִּפְקֹד
  choice: നീ എണ്ണണം
  rationale: ഈ ജനഗണനാസന്ദർഭത്തിൽ פקד ആളുകളെ എണ്ണുകയോ പട്ടികപ്പെടുത്തുകയോ ചെയ്യുക എന്നാണ്. ‘എണ്ണണം’ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളമാണ്.
- source_word: אֹתָם
  choice: അവരെ
  rationale: മെരാരിയുടെ പുത്രന്മാരെ തിരിച്ചുസൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം മലയാളത്തിൽ വ്യക്തമായി നൽകി.
