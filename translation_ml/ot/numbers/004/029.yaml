translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കുലങ്ങൾ’, ‘പിതൃഭവനങ്ങൾ’ എന്നീ പദങ്ങൾ ജനഗണനയിലെ രണ്ടു വ്യത്യസ്ത ബന്ധുത്വതലങ്ങൾ നിലനിർത്തുന്നു.
