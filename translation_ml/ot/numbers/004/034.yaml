  text: וַ/יִּפְקֹ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י הָ/עֵדָ֖ה אֶת בְּנֵ֣י הַ/קְּהָתִ֑י לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: ml
  text: അങ്ങനെ മോശയും അഹരോനും സമൂഹത്തിന്റെ പ്രമാണിമാരും കെഹാത്യരെ അവരുടെ കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും എണ്ണിത്തിട്ടപ്പെടുത്തി[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എണ്ണി’ അല്ലെങ്കിൽ ‘ജനഗണന നടത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായക്രിയയ്ക്ക് മറ്റു സന്ദർഭങ്ങളിൽ ‘നിയമിക്കുക’ എന്നും അർഥമുണ്ടാകാം; ഇവിടെ ശുശ്രൂഷയ്ക്കായി ആളുകളെ എണ്ണി രേഖപ്പെടുത്തുന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘കെഹാത്യന്റെ പുത്രന്മാർ’; അതായത് കെഹാത്തിൽനിന്ന് ഉത്ഭവിച്ച കുലവിഭാഗം.
    reason: lexical_alternative
  - marker: c
    text: ‘പിതൃഭവനങ്ങൾ’ എന്നത് പൂർവികരെ അടിസ്ഥാനമാക്കിയ കുടുംബഗൃഹങ്ങളെയോ കുടുംബവിഭാഗങ്ങളെയോ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഇസ്രായേല്യ ബന്ധുത്വപദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: എണ്ണിത്തിട്ടപ്പെടുത്തി
  rationale: സംഖ്യാപുസ്തകം 4-ലെ ഈ ജനഗണനാസന്ദർഭത്തിൽ ക്രിയ ആളുകളെ ശുശ്രൂഷയ്ക്കായി എണ്ണി രേഖപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിയമിച്ചു’ എന്ന അർഥമല്ല.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: സമൂഹത്തിന്റെ പ്രമാണിമാർ
  rationale: ഇത് സമൂഹത്തിൽ അംഗീകൃതമായ നേതൃത്വസ്ഥാനത്തുള്ളവരെ സൂചിപ്പിക്കുന്നു. ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ ‘പ്രമാണിമാർ’ ആ ഔദ്യോഗിക-സാമൂഹിക പങ്ക് വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי הַקְּהָתִי
  choice: കെഹാത്യരെ
  rationale: അക്ഷരാർഥം ‘കെഹാത്യന്റെ പുത്രന്മാർ’ എന്നാണെങ്കിലും ഇവിടെ കെഹാത്തിൽനിന്ന് ഉത്ഭവിച്ച കുലവിഭാഗത്തെയാണ് ഉദ്ദേശിക്കുന്നത്; സ്വാഭാവികമായ മലയാളത്തിന് ജനവിഭാഗനാമം ഉപയോഗിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ജനഗണനാ-വംശാവലിസന്ദർഭത്തിൽ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനകത്തെ ബന്ധുത്വവിഭാഗമായ കുലത്തെ സൂചിപ്പിക്കുന്നു; לְ-യുടെ വർഗീകരണബലം ‘പ്രകാരം’ കൊണ്ടു പ്രകടമാക്കി.
- source_word: וּלְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: בֵית אָבוֹת തോറായിലെ സാങ്കേതിക ബന്ധുത്വപദമാണ്. ‘പിതൃഭവനങ്ങൾ’ മൂലരൂപവും പൂർവികകുടുംബവിഭാഗം എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കെഹാത്യന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥപ്രയോഗം മുഖ്യവാക്യത്തിൽ അസ്വാഭാവികമായതിനാൽ ‘കെഹാത്യർ’ എന്നു നൽകി, മൂലഭാഷയിലെ കുടുംബവംശസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി. ‘പിതൃഭവനങ്ങൾ’ എന്ന സാങ്കേതിക സാംസ്കാരികപദം വ്യാഖ്യാനത്തോടെ സംരക്ഷിച്ചു.
