  source_fidelity: മൂലത്തിലെ וַיִּפְקֹד എന്ന എണ്ണൽ/ജനഗണനാ ക്രിയയും, മോശെ, അഹരോൻ, സമൂഹനേതാക്കൾ എന്ന കർത്തൃസമുച്ചയവും, കെഹാത്യർ എന്ന കർമവും, കുലങ്ങളും പിതൃഭവനങ്ങളും അനുസരിച്ചുള്ള വർഗീകരണവും വിവർത്തനം വിശ്വസ്തമായി കൈമാറുന്നു. ‘കെഹാത്യരെ’ എന്ന ജനവിഭാഗനാമം ഇവിടെ בני הקהתי എന്ന വംശപരമായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളപരിഹാരമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: വാക്യം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സുഗമവും മാന്യവുമാണ്. ‘എണ്ണിത്തിട്ടപ്പെടുത്തി’ ജനഗണനാ/പട്ടികപ്പെടുത്തൽ സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും’ എന്ന സമാന്തരഘടന വ്യക്തമാണ്.
  terminology: ‘സമൂഹത്തിന്റെ പ്രമാണിമാർ’ נְשִׂיאֵי הָעֵדָה എന്ന ഔദ്യോഗിക സമൂഹനേതൃത്വത്തെ യഥാവിധി അറിയിക്കുന്നു. ‘കുലങ്ങൾ’ מִשְׁפְּחֹת, ‘പിതൃഭവനങ്ങൾ’ בֵּית אֲבֹת എന്ന സാങ്കേതിക ബന്ധുത്വപദം എന്നിവ യോജിച്ചതാണ്. അടിക്കുറിപ്പുകൾ മുഖ്യപാഠത്തിന്റെ പദചയനങ്ങളെയും സാംസ്കാരിക പദത്തെയും ഉചിതമായി വിശദീകരിക്കുന്നു.
