revisions:
- from: പാളയം പുറപ്പെടുമ്പോൾ അഹരോനും അവന്റെ പുത്രന്മാരും വിശുദ്ധസ്ഥലവും വിശുദ്ധസ്ഥലത്തിലെ എല്ലാ ഉപകരണങ്ങളും മൂടിത്തീർന്നശേഷം, കെഹാത്തിന്റെ പുത്രന്മാർ അവ ചുമക്കാൻ വരണം. എന്നാൽ അവർ വിശുദ്ധവസ്തുക്കളെ തൊടരുത്; തൊട്ടാൽ അവർ മരിക്കും.[a] സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട് കെഹാത്തിന്റെ പുത്രന്മാർ ചുമക്കേണ്ടത് ഇവയാണ്.[b]
  to: പാളയം പുറപ്പെടുന്ന വേളയിൽ, അഹരോനും അവന്റെ പുത്രന്മാരും വിശുദ്ധവസ്തുക്കളെയും എല്ലാ വിശുദ്ധോപകരണങ്ങളെയും മൂടിക്കഴിഞ്ഞശേഷം,[a] കെഹാത്തിന്റെ പുത്രന്മാർ[c] അവ ചുമക്കാൻ വരും. എന്നാൽ അവർ വിശുദ്ധമായതിനെ തൊടരുത്; അല്ലെങ്കിൽ അവർ മരിക്കും.[b] സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട് കെഹാത്തിന്റെ പുത്രന്മാർ ചുമക്കേണ്ടവ ഇവയാണ്.
  rationale: The revision resolves the potentially misleading physical sense of covering the sanctuary itself while neither suppressing nor deciding against that broader lexical possibility. It also improves the temporal and future-instruction phrasing and relocates each footnote anchor to the expression it annotates.
