source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: ml
  text: പാളയം പുറപ്പെടുന്ന വേളയിൽ, അഹരോനും അവന്റെ പുത്രന്മാരും വിശുദ്ധവസ്തുക്കളെയും എല്ലാ വിശുദ്ധോപകരണങ്ങളെയും മൂടിക്കഴിഞ്ഞശേഷം,[a] കെഹാത്തിന്റെ പുത്രന്മാർ[c] അവ ചുമക്കാൻ വരും. എന്നാൽ അവർ വിശുദ്ധമായതിനെ തൊടരുത്; അല്ലെങ്കിൽ അവർ മരിക്കും.[b] സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട് കെഹാത്തിന്റെ പുത്രന്മാർ ചുമക്കേണ്ടവ ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശുദ്ധവസ്തുക്കളെയും” എന്നതിന് “വിശുദ്ധസ്ഥലത്തെയും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ “വിശുദ്ധമായത്” എന്ന പദം വിശുദ്ധവസ്തുക്കളെ കൂട്ടമായി സൂചിപ്പിക്കാം; വിശാലമായി വിശുദ്ധസ്ഥലത്തെയും സൂചിപ്പിക്കാം.
    reason: ആദ്യത്തെ הַקֹּדֶשׁ എന്ന പദത്തിന്റെ സന്ദർഭപരമായ അവ്യക്തത സംരക്ഷിക്കാൻ.
  - marker: b
    text: “അല്ലെങ്കിൽ അവർ മരിക്കും” എന്നതിന് “അവർ തൊടരുത്; അവർ മരിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായവാക്യം മരണഫലം നേരിട്ട് പ്രസ്താവിക്കുന്നു.
    reason: וָמֵתוּ എന്ന നേരിട്ടുള്ള ഫലപ്രസ്താവനയുടെ ബദൽ നിലനിർത്താൻ.
  - marker: c
    text: “കെഹാത്തിന്റെ പുത്രന്മാർ” എന്നതിന് “കെഹാത്യർ” എന്നും പറയാം.
    reason: മൂലത്തിലെ അക്ഷരാർഥ വംശപരാമർശത്തിന് സ്വാഭാവികമായ മലയാള ബദൽ നൽകാൻ.
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: മൂടിത്തീർന്നശേഷം
  rationale: ക്രിയ പൂർത്തിയായതിനു ശേഷമുള്ള നടപടിക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം / വിശുദ്ധവസ്തുക്കൾ
  rationale: ആദ്യ സന്ദർഭത്തിൽ വിശുദ്ധമന്ദിരപരിസരത്തെയും രണ്ടാമത്തെ സന്ദർഭത്തിൽ കൊണ്ടുപോകേണ്ട വിശുദ്ധവസ്തുക്കളെയും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിത വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലത്തിലെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלֵי എന്നത് പാത്രങ്ങൾ മാത്രമല്ല, വിവിധ ഉപകരണങ്ങളെയും സാമഗ്രികളെയും ഉൾക്കൊള്ളുന്നതിനാൽ വിശാലമായ മലയാളപദം തിരഞ്ഞെടുത്തു.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: പാളയം പുറപ്പെടുമ്പോൾ
  rationale: പാളയത്തിന്റെ യാത്രാരംഭത്തെ സൂചിപ്പിക്കുന്ന കാലവാക്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വംശബന്ധ ഭാഷ സംരക്ഷിക്കുന്നു; 'കെഹാത്യർ' എന്നതിനെക്കാൾ ഔപചാരികമായി അടുത്തതാണ്.
- source_word: לָשֵׂאת
  choice: അവ ചുമക്കാൻ
  rationale: മുൻപറഞ്ഞ മൂടിയ വിശുദ്ധവസ്തുക്കളാണ് കർമമെന്നത് മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: וָמֵתוּ
  choice: തൊട്ടാൽ അവർ മരിക്കും
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള മരണഫലം സംരക്ഷിക്കുമ്പോൾ നിരോധനവുമായി അതിന്റെ വ്യവസ്ഥാപര ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ ചുമക്കേണ്ടത് ഇവയാണ്
  rationale: מַשָּׂאയുടെ ഭാരം/ചുമട് എന്ന മൂർത്ത ആശയവും ഏൽപ്പിച്ച ചുമതലയും ഒരുമിച്ച് ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട്
  rationale: בְ എന്നതിന്റെ പ്രവർത്തനമേഖലാസംബന്ധമായ അർഥം നൽകുന്നു; വസ്തുക്കൾ കൂടാരത്തിനകത്ത് തന്നെയിരിക്കെ ചുമക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നിരോധനവാക്യത്തിലെ הַקֹּדֶשׁ എന്നതിന്റെ സൂചന
  choice: വിശുദ്ധവസ്തുക്കൾ
  alternative: വിശുദ്ധസ്ഥലം
  rationale: തൊട്ടുമുമ്പ് മൂടുകയും ചുമക്കുകയും ചെയ്യുന്ന വിശുദ്ധ ഉപകരണങ്ങളാണ് സന്ദർഭത്തിന്റെ കേന്ദ്രം. എങ്കിലും എബ്രായപദത്തിന് വിശുദ്ധസ്ഥലം എന്ന വിശാല അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. 'സമാഗമകൂടാരം' എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; അത്യന്തം പുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
