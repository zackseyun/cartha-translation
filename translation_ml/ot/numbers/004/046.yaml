translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘരേഖ ഉപയോഗിച്ചു. സാംസ്കാരികമായി പ്രത്യേകമായ ‘പിതൃഭവനങ്ങൾ’ എന്ന പ്രയോഗം നിലനിർത്തി വിശദീകരണ അടിക്കുറിപ്പ് ചേർത്തു.
