  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: ml
  text: മോശെയും അഹരോനും ഇസ്രായേലിന്റെ നേതാക്കളും ലേവ്യരിൽനിന്ന് അവരുടെ കുലങ്ങൾക്കും അവരുടെ പിതൃഭവനങ്ങൾക്കും അനുസരിച്ച് എണ്ണിയവരെല്ലാം[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എണ്ണപ്പെട്ടവരെല്ലാം” എന്നതിന് “പട്ടികപ്പെടുത്തിയവരെല്ലാം” അല്ലെങ്കിൽ “രജിസ്റ്റർ ചെയ്തവരെല്ലാം” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ ഔദ്യോഗിക കണക്കെടുപ്പുമായി ബന്ധപ്പെട്ട പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: എണ്ണപ്പെട്ട എല്ലാവരും
  rationale: ഔദ്യോഗിക ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിലുള്ള സമഗ്രതയും കർമണിപ്രയോഗവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: פָּקַד
  choice: എണ്ണിയവർ
  rationale: ഇവിടെ ക്രിയ ഔദ്യോഗികമായി കണക്കെടുക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; മുമ്പുള്ള കർമണിരൂപവുമായി പദബന്ധം നിലനിർത്തുന്നു.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: ഇസ്രായേലിന്റെ നേതാക്കൾ
  rationale: ഗോത്രത്തലവന്മാരെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക വായനക്കാർക്ക് വ്യക്തവും പദവിയെ അനാവശ്യമായി രാജകീയമാക്കാത്തതുമായ പരിഭാഷ.
- source_word: אֶת הַלְוִיִּם
  choice: ലേവ്യരിൽനിന്ന്
  rationale: നേരിട്ടുള്ള കർമമായി വരുന്ന ലേവ്യരാണ് കണക്കെടുപ്പിന് വിധേയമായ സമൂഹം; മലയാളത്തിൽ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾ അനുസരിച്ച്
  rationale: מִשְׁפָּחָה ഇവിടെ ഗോത്രത്തിനുള്ളിലെ വംശബന്ധമുള്ള കുലവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: וּלְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾ അനുസരിച്ച്
  rationale: പുരാതന ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബ/വംശീയ ഘടകത്തിന്റെ സ്രോതസ്സ് രൂപകം ചുരുക്കമായി സംരക്ഷിക്കുന്നു.
