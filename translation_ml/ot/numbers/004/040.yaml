  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: ml
  text: അവരിൽ എണ്ണപ്പെട്ടവർ[a], അവരുടെ കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും, രണ്ടായിരത്തി അറുനൂറ്റി മുപ്പത് ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ കണക്കിൽപ്പെട്ടവർ,” “അവരുടെ രജിസ്റ്റർ,” അല്ലെങ്കിൽ “അവരുടെ കണക്കെടുപ്പ്.” എബ്രായപദം ജനസംഖ്യാ കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: ജനസംഖ്യാ കണക്കിന്റെ ഫലം പ്രസ്താവിക്കുന്ന ലളിതമായ ബന്ധകക്രിയയായി היה ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: פְּקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം കണക്കെടുപ്പിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; 'അവരിൽ' എന്നത് മുമ്പ് പറഞ്ഞ കൂട്ടത്തിൽനിന്നുള്ള കണക്കാണെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: മִשְׁפָּחָה ജനസംഖ്യാ കണക്കെടുപ്പ് സന്ദർഭത്തിൽ ബന്ധുത്വത്തെ ആധാരമാക്കിയ ഉപവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ 'കുലങ്ങൾ' സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ഇസ്രായേലിലെ വംശാവലി-സാമൂഹിക ഘടകത്തെ സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗത്തിന്റെ ഘടനയും അർഥവും 'പിതൃഭവനങ്ങൾ' നിലനിർത്തുന്നു.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: രണ്ടായിരത്തി അറുനൂറ്റി മുപ്പതുപേർ
  rationale: സംഖ്യയെ ആധുനിക സാധാരണ മലയാളരീതിയിൽ നൽകുന്നു; എണ്ണപ്പെട്ട വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനാൽ 'പേർ' ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
