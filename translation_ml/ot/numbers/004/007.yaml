  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: ml
  text: സാന്നിധ്യത്തിന്റെ മേശയ്ക്കുമീതെ[a] അവർ നീലത്തുണി വിരിക്കണം. അതിന്മേൽ തളികകളും കോപ്പകളും കിണ്ണങ്ങളും പാനീയയാഗം ഒഴിക്കാനുള്ള കുടങ്ങളും വെക്കണം. നിരന്തരമായ അപ്പം[b] അതിന്മേൽ ഉണ്ടായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി ‘കാഴ്ചയപ്പത്തിന്റെ മേശ’ എന്നും പറയുന്നു. എബ്രായപ്രയോഗം കൂടുതൽ പദശഃ ‘സാന്നിധ്യത്തിന്റെ മേശ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘എപ്പോഴും വെച്ചിരിക്കുന്ന അപ്പം.’ കർത്താവിന്റെ സന്നിധിയിൽ മേശപ്പുറത്ത് പതിവായി സൂക്ഷിച്ചിരുന്ന അപ്പത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: സാന്നിധ്യത്തിന്റെ മേശ
  rationale: പദശഃ ‘മുഖത്തിന്റെ/സാന്നിധ്യത്തിന്റെ മേശ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ആരാധനാപരമായ അർഥം നിലനിർത്തുന്നു; ‘കാഴ്ചയപ്പം വെക്കുന്ന മേശ’ എന്ന വ്യാഖ്യാനപരമായ പരമ്പരാഗത രൂപം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: יִפְרְשׂוּ
  choice: വിരിക്കണം
  rationale: മേശയ്ക്കുമീതെ തുണി വിരിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: നീലത്തുണി
  rationale: തിരുനിവാസസന്ദർഭത്തിലെ നീലനിറമുള്ള വസ്ത്രത്തെ ലളിതമായി സൂചിപ്പിക്കുന്നു; നിറത്തിന്റെ കൃത്യമായ ഛായ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: הַקְּעָרֹת
  choice: തളികകൾ
  rationale: മേശയിൽ ഉപയോഗിച്ചിരുന്ന പരന്ന വിളമ്പുപാത്രങ്ങൾ എന്ന സാധ്യതയ്ക്ക് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: הַכַּפֹּת
  choice: കോപ്പകൾ
  rationale: ഈ ആരാധനോപകരണത്തിന്റെ കൃത്യമായ ആകൃതി ഉറപ്പില്ലാത്തതിനാൽ അതിനെ അതിയായി നിർവചിക്കാതെ ഒരു പൊതുവായ മേശപ്പാത്രപദം ഉപയോഗിക്കുന്നു.
- source_word: הַמְּנַקִּיֹּת
  choice: കിണ്ണങ്ങൾ
  rationale: വിവിധമായി പരിഭാഷപ്പെടുത്തപ്പെടുന്ന ഈ പാത്രനാമത്തിന് സ്വാഭാവികവും അതിപുരാതനമല്ലാത്തതുമായ പൊതുപദം തിരഞ്ഞെടുക്കുന്നു.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: പാനീയയാഗം ഒഴിക്കാനുള്ള കുടങ്ങൾ
  rationale: നേസെഖ് എന്നത് ഒഴിച്ചർപ്പിക്കുന്ന പാനീയയാഗമാണെന്ന പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കുകയും പാത്രത്തിന്റെ കൃത്യരൂപം നിർബന്ധമായി നിശ്ചയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: לֶחֶם הַתָּמִיד
  choice: നിരന്തരമായ അപ്പം
  rationale: അപ്പം പതിവായി കർത്താവിന്റെ സന്നിധിയിൽ നിലനിർത്തപ്പെട്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘നിരന്തരം’ എന്ന ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: עָלָיו יִהְיֶה
  choice: അതിന്മേൽ ഉണ്ടായിരിക്കണം
  rationale: അപ്പം മേശപ്പുറത്ത് ഉണ്ടായിരിക്കണമെന്ന വാക്യത്തിന്റെ ലളിതമായ അർഥം നൽകുന്നു; ‘തുടരണം’ പോലുള്ള അധിക ഭാവം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘സാന്നിധ്യത്തിന്റെ മേശ’ എന്ന ആരാധനാപരമായ പ്രയോഗം
  choice: സാന്നിധ്യത്തിന്റെ മേശ
  alternative: കാഴ്ചയപ്പത്തിന്റെ മേശ
  rationale: എബ്രായത്തിലെ ‘മുഖം/സാന്നിധ്യം’ എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും പരമ്പരാഗത വ്യാഖ്യാനരൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആരാധനോപകരണങ്ങളുടെ അപൂർവമായ എബ്രായ നാമങ്ങൾ അതിയായി നിർവചിക്കാതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പാത്രനാമങ്ങളാൽ പരിഭാഷപ്പെടുത്തി. നിർദേശാത്മക പശ്ചാത്തലം പ്രകടമാക്കാൻ ‘വിരിക്കണം’, ‘വെക്കണം’, ‘ഉണ്ടായിരിക്കണം’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
