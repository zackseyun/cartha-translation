    rationale: The dative/postpositional construction “കുടുംബങ്ങൾക്കുള്ള” suggests service for the families. The Hebrew means the service of the families of the Gershonites.
  - severity: low
    issue: “ആയിരിക്കണം” is unnecessarily prescriptive.
    rationale: The Hebrew nominal clause assigns their charge to Ithamar’s authority; “ആയിരിക്കും” states this assignment without adding the force of a command.
