  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ ഗേർശോന്യരുടെ കുടുംബങ്ങളുടെ സേവനം ഇതാണ്. അവരുടെ ചുമതല[a] പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാരിന്റെ മേൽനോട്ടത്തിലായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരുടെ ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം”; എബ്രായപദം ചുമതല, കാവൽ, ബാധ്യത എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ഈഥാമാരിന്റെ കൈയിൽ”; ഈ എബ്രായ പ്രയോഗം അദ്ദേഹത്തിന്റെ മേൽനോട്ടത്തിലോ അധികാരത്തിൻ കീഴിലോ എന്നർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: സേവനം ഇതാണ്
  rationale: തിരിച്ചറിയൽ പ്രസ്താവനയായ എബ്രായ ഘടന നിലനിർത്തുന്നു. കൂടാരവുമായി ബന്ധപ്പെട്ട് ഏൽപ്പിക്കപ്പെട്ട ജോലിയെ സൂചിപ്പിക്കാൻ ‘സേവനം’ സ്വാഭാവികവും മതിയായും വിശാലവുമാണ്.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യരുടെ കുടുംബങ്ങൾക്കുള്ള
  rationale: വംശപരവും കൂട്ടായതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥത്തിലുള്ള അസ്വാഭാവികമായ ‘ഗേർശോന്യന്റെ പുത്രന്മാരുടെ’ എന്ന രൂപം ഒഴിവാക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: സ്ഥാപിതവും വ്യക്തവുമായ മലയാള പദപ്രയോഗം; בְ എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന സേവനമേഖലയെയും ഉൾക്കൊള്ളുന്നു.
- source_word: וּמִשְׁמַרְתָּם
  choice: അവരുടെ ചുമതല
  rationale: ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം, കാവൽച്ചുമതല, ബാധ്യത എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം.
- source_word: בְּיַד
  choice: മേൽനോട്ടത്തിലായിരിക്കണം
  rationale: ‘കൈയിൽ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഭരണപരമായ അർഥം—അധികാരത്തിനോ മേൽനോട്ടത്തിനോ കീഴിൽ—വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ ഈഥാമാർ
  rationale: ബന്ധവും പുരോഹിതപരമായ തിരിച്ചറിയലും മലയാളത്തിൽ അവ്യക്തതയില്ലാതെ നൽകുന്നു.
