  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'പിന്നെ യഹ്‌വേ[a] മോശെയോടു ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച കഥയുടെ ക്രമം മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘പിന്നെ’ എന്നു നൽകി. ദൈവം സംസാരിക്കുന്ന ഈ ഔപചാരിക സൂത്രവാക്യത്തിൽ ‘അരുളിച്ചെയ്തു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: തിരുവെഴുത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാള ദത്തിവ് രൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ദ്വിബിന്ദുവിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: എബ്രായത്തിലെ പതിവ് പ്രസംഗാരംഭസൂത്രമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്നതിനെ ഈ ഒറ്റവാക്യത്തിൽ അക്ഷരാർഥമായി ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ദ്വിബിന്ദു അതിന്റെ പ്രവർത്തനം വ്യക്തമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ പരമ്പരാഗത പകരപ്പദമായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെ നാമം ലിപ്യന്തരിച്ചു; ‘യഹ്‌വെ’ സാധ്യതയേറിയ ഉച്ചാരണത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. അടുത്ത വാക്യത്തിലെ ദൈവവചനം തുടങ്ങുന്നതിനാൽ വാക്യാവസാനത്ത് ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
