  terminology: Use ‘യഹ്‌വേ’ consistently for Yahweh. The footnote appropriately notes the Hebrew divine name and the traditional rendering, though ‘കർത്താവ്’ should be described as the traditional equivalent rather than implying it is a direct transliteration.
