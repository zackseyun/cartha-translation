  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വിശുദ്ധകൂടാരസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. പട്ടികയുടെ എബ്രായ ഘടന നിലനിർത്തിക്കൊണ്ട് അവസാന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
