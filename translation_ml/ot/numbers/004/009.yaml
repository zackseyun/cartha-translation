  text: וְ/לָקְח֣וּ בֶּ֣גֶד תְּכֵ֗לֶת וְ/כִסּ֞וּ אֶת מְנֹרַ֤ת הַ/מָּאוֹר֙ וְ/אֶת נֵ֣רֹתֶ֔י/הָ וְ/אֶת מַלְקָחֶ֖י/הָ וְ/אֶת מַחְתֹּתֶ֑י/הָ וְ/אֵת֙ כָּל כְּלֵ֣י שַׁמְנָ֔/הּ אֲשֶׁ֥ר יְשָׁרְתוּ לָ֖/הּ בָּ/הֶֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: ml
  text: പിന്നെ അവർ നീലത്തുണി[a] എടുത്ത് വെളിച്ചത്തിനുള്ള വിളക്കുതണ്ടും അതിന്റെ വിളക്കുകളും ചവണകളും തീച്ചട്ടികളും അതിന്റെ ശുശ്രൂഷയ്ക്കായി ഉപയോഗിക്കുന്ന അതിന്റെ എണ്ണയ്ക്കുള്ള സകല ഉപകരണങ്ങളും മൂടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീലനിറമുള്ള തുണി’ അല്ലെങ്കിൽ ‘നീലകലർന്ന ധൂമ്രനിറമുള്ള തുണി’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിലെ תְּכֵלֶת വിശുദ്ധകൂടാരത്തിലെ ഉപകരണങ്ങളോടനുബന്ധിച്ച് ഉപയോഗിച്ചിരുന്ന പ്രത്യേകമായി ചായംകൊടുത്ത തുണിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: നീലത്തുണി
  rationale: בֶּגֶד എന്നത് ഇവിടെ വസ്ത്രത്തെക്കാൾ പൊതിയാനുള്ള തുണിയെയാണ് സൂചിപ്പിക്കുന്നത്. תְּכֵלֶת വിശുദ്ധകൂടാരത്തിലെ തുണികളിൽ ഉപയോഗിച്ചിരുന്ന പ്രത്യേക നീലയോ നീലകലർന്ന ധൂമ്രനിറമോ ഉള്ള ചായത്തെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മുഖ്യപരിഭാഷയായി ‘നീലത്തുണി’ സ്വീകരിച്ചു.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: വെളിച്ചത്തിനുള്ള വിളക്കുതണ്ട്
  rationale: מְנוֹרָה എന്നതിന് ‘വിളക്കുതണ്ട്’ എന്നും הַמָּאוֹר എന്ന ബന്ധപദത്തിന് ഇവിടെ വെളിച്ചം നൽകുന്ന ധർമം സൂചിപ്പിക്കുന്ന ‘വെളിച്ചത്തിനുള്ള’ എന്നും പരിഭാഷ നൽകി.
- source_word: נֵרֹתֶיהָ
  choice: അതിന്റെ വിളക്കുകൾ
  rationale: വിളക്കുതണ്ടിനോടു ചേർന്ന ഓരോ വിളക്കിനെയോ ദീപഘടകത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘വിളക്കുകൾ’ സ്വീകരിച്ചു.
- source_word: מַלְקָחֶיהָ
  choice: ചവണകൾ
  rationale: തിരിയോ തീജ്വാലയോ കൈകാര്യം ചെയ്യാനുള്ള പിടിയുപകരണമാണ് ഉദ്ദേശ്യം. കൂടുതൽ നിർദിഷ്ടമായ ‘തിരിച്ചവണ’ എന്ന അർഥം സാധ്യമെങ്കിലും ഉറപ്പില്ലാത്തതിനാൽ പൊതുവായ ‘ചവണകൾ’ നിലനിർത്തി.
- source_word: מַחְתֹּתֶיהָ
  choice: തീച്ചട്ടികൾ
  rationale: വിളക്കുകൾ പരിപാലിക്കുമ്പോൾ തീക്കനലോ അവശിഷ്ടങ്ങളോ കൈകാര്യം ചെയ്യാനുള്ള പാത്രങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘ധൂപകലശങ്ങൾ’ എന്നു പറഞ്ഞാൽ ഇവിടെ തെളിവില്ലാത്ത ധൂപാർപ്പണസൂചന വരാം.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: അതിന്റെ എണ്ണയ്ക്കുള്ള സകല ഉപകരണങ്ങളും
  rationale: כְּלִים എന്നത് പാത്രങ്ങളെയും മറ്റു ഉപകരണങ്ങളെയും ഉൾക്കൊള്ളാം. അതിനാൽ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ ‘ഉപകരണങ്ങൾ’ എന്നും എണ്ണയുമായുള്ള ബന്ധം ‘എണ്ണയ്ക്കുള്ള’ എന്നും നൽകി.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: അതിനെ ശുശ്രൂഷിക്കാൻ ഉപയോഗിക്കുന്ന
  rationale: שׁרת എന്ന ക്രിയയുടെ വിശുദ്ധസേവനഭാവം ‘ശുശ്രൂഷിക്കാൻ’ സംരക്ഷിക്കുന്നു. בָּהֶם എന്ന ബഹുവചന ഉപകരണസൂചന മലയാളത്തിൽ ‘ഉപയോഗിക്കുന്ന’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ പ്രകടമാക്കി.
