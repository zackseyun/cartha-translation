translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആചാരപരമായ ആശയം വ്യക്തമാക്കാൻ ‘യാഗപീഠം’, ‘ചാരം നീക്കുക’ എന്നിവ ഉപയോഗിച്ചു; മൂലത്തിലെ ക്രിയയുടെ പ്രത്യേക അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
