  text: וְ/דִשְּׁנ֖וּ אֶת הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֔י/ו בֶּ֖גֶד אַרְגָּמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: ml
  text: പിന്നെ അവർ യാഗപീഠത്തിൽനിന്ന് ചാരം നീക്കി, അതിന്മേൽ ധൂമ്രനിറമുള്ള ഒരു തുണി വിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാഗപീഠം വൃത്തിയാക്കും’ / ‘യാഗപീഠത്തിൽനിന്ന് കൊഴുപ്പുകലർന്ന ചാരം നീക്കും.’ യാഗാർപ്പണസന്ദർഭത്തിൽ, യാഗപീഠത്തിൽ ശേഷിക്കുന്ന ചാരാവശിഷ്ടം നീക്കുന്നതിനെയാണ് എബ്രായ ക്രിയ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: അവർ ... ചാരം നീക്കി
  rationale: പീയേൽ രൂപത്തിലുള്ള דשׁן ഇവിടെ യാഗപീഠത്തിൽ ശേഷിച്ച ചാരവും കൊഴുപ്പുകലർന്ന അവശിഷ്ടവും നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആചാരപരമായ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ് ‘ചാരം നീക്കുക’.
- source_word: הַמִּזְבֵּחַ
  choice: യാഗപീഠം
  rationale: സമാഗമകൂടാരത്തിലെ ബലിയർപ്പണസന്ദർഭത്തിൽ מִזְבֵּחַ എന്നതിന് നിലവാരമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: וּפָרְשׂוּ
  choice: വിരിക്കണം
  rationale: פרשׂ എന്നത് പരത്തുക, വിരിക്കുക എന്നർഥം നൽകുന്നു; ഒരു തുണികൊണ്ട് ഉപകരണം മൂടുന്ന ഈ സന്ദർഭത്തിൽ ‘വിരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: עָלָיו
  choice: അതിന്മേൽ
  rationale: עַל + സർവനാമപ്രത്യയം യാഗപീഠത്തിന്മേൽ തുണി വിരിച്ച് മൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: בֶּגֶד
  choice: തുണി
  rationale: בגד സാധാരണയായി വസ്ത്രം എന്നർഥമുള്ളതാണെങ്കിലും ഇവിടെ വിശുദ്ധ ഉപകരണം മൂടാൻ ഉപയോഗിക്കുന്ന തുണിത്തരമാണ്; ‘തുണി’ പ്രവർത്തനസന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: אַרְגָּמָן
  choice: ധൂമ്രവർണത്തിലുള്ള
  rationale: אַרְגָּמָן ധൂമ്രനിറം ചായംപിടിപ്പിച്ച വസ്തുവിനെ സൂചിപ്പിക്കുന്നു. בֶּגֶד തുണിത്തരമാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ നിറം സൂചിപ്പിക്കുന്ന ‘ധൂമ്രവർണത്തിലുള്ള’ മതിയാകും.
