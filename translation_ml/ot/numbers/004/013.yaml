    issue: The verb “വിരിക്കണം” introduces a modal sense.
    rationale: The Hebrew וּפָרְשׂוּ is a plural procedural form in the surrounding instruction, best represented here by “വിരിക്കും,” not by a Malayalam necessity/obligation construction.
  - severity: low
    issue: The color expression is less natural than necessary.
    rationale: “ധൂമ്രനിറമുള്ള” is a more idiomatic modern Malayalam expression for purple-colored material than “ധൂമ്രവർണത്തിലുള്ള.”
  revised_text: പിന്നെ അവർ യാഗപീഠത്തിൽനിന്ന് ചാരം നീക്കി, അതിന്മേൽ ധൂമ്രനിറമുള്ള ഒരു തുണി വിരിക്കും.[a]
