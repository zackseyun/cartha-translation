id: NUM.4.5
reference: Numbers 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בָ֨א אַהֲרֹ֤ן וּ/בָנָי/ו֙ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶ֔ה וְ/הוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַ/מָּסָ֑ךְ וְ/כִ֨סּוּ בָ֔/הּ אֵ֖ת אֲרֹ֥ן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: ml
  text: പാളയം പുറപ്പെടുമ്പോൾ, അഹരോനും അവന്റെ പുത്രന്മാരും വന്ന് മറയുടെ തിരശ്ശീല താഴെയിറക്കുകയും അതുകൊണ്ട് സാക്ഷ്യപെട്ടകം മൂടുകയും വേണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: വന്ന്
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും, ‘അഹരോനും അവന്റെ പുത്രന്മാരും’ എന്ന സംയുക്ത കർത്താവിനോടും തുടർന്നുള്ള ബഹുവചന ക്രിയകളോടും ചേർന്ന് ഇത് കൂട്ടായ നിർദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: പാളയം യാത്ര പുറപ്പെടുമ്പോൾ
  rationale: בְּ ചേർന്ന infinitive construct സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു; പാളയം യാത്ര ആരംഭിക്കുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְהוֹרִדוּ
  choice: താഴെയിറക്കി
  rationale: സമാഗമകൂടാരം അഴിച്ചൊരുക്കുന്ന സാഹചര്യത്തിൽ തിരശ്ശീല അതിന്റെ സ്ഥാനത്തുനിന്ന് ഇറക്കുന്നതാണ് അർത്ഥം.
- source_word: פָּרֹכֶת
  choice: തിരശ്ശീല
  rationale: വിശുദ്ധസ്ഥാനത്തെ വേർതിരിക്കുന്ന ആന്തരിക തിരശ്ശീലയെ സൂചിപ്പിക്കുന്ന പദമാണ്; മലയാളത്തിൽ വ്യക്തവും ആരാധനാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: הַמָּסָךְ
  choice: മറയുടെ
  rationale: פָּרֹכֶת הַמָּסָךְ എന്ന ഘടനയിലെ ബന്ധം അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘മറയുടെ തിരശ്ശീല’ എന്നു നിലനിർത്തുന്നു.
- source_word: וְכִסּוּ בָהּ
  choice: അതുകൊണ്ട് ... മൂടണം
  rationale: כסה എന്നത് ‘മൂടുക’ എന്നാണ്; സ്ത്രീലിംഗ സർവനാമം തിരശ്ശീലയിലേക്കാണ് മടങ്ങുന്നത്, അതിനാൽ ഉപകരണാർത്ഥം ‘അതുകൊണ്ട്’ എന്നു വ്യക്തമാക്കി.
- source_word: אֲרֹן הָעֵדֻת
  choice: സാക്ഷ്യപെട്ടകം
  rationale: മൂലപാഠത്തിൽ בְּרִית (‘ഉടമ്പടി’) എന്നല്ല, עֵדוּת (‘സാക്ഷ്യം’) എന്നാണ്; അതിനാൽ പരിചിതമായ പരമ്പരാഗത പ്രയോഗത്തേക്കാൾ എബ്രായപദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: אֲרֹן הָעֵדֻת എന്ന പ്രയോഗത്തിന്റെ പരമ്പരാഗത വിവർത്തനം
  choice: സാക്ഷ്യപെട്ടകം
  alternative: ഉടമ്പടിയുടെ പെട്ടകം / നിയമപെട്ടകം
  rationale: മൂലപാഠം ‘സാക്ഷ്യം’ എന്ന עֵדוּת പദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യത്യസ്തമായ ‘ഉടമ്പടി’ എന്ന ആശയം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലഭാഷയിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വിശുദ്ധഗ്രന്ഥത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. നിർദേശാത്മക ഭാവം ‘മൂടണം’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; എബ്രായത്തിലെ ക്രിയാശൃംഖല മലയാളത്തിൽ ‘വന്ന് ... താഴെയിറക്കി ... മൂടണം’ എന്ന ഏകോപിത ഘടനയായി നൽകി.
