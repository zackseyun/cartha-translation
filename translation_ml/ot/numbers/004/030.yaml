- from: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ളവരെ നീ എണ്ണിത്തിട്ടപ്പെടുത്തണം—സമാഗമകൂടാരത്തിലെ ജോലി നിർവഹിക്കാനുള്ള ക്രമീകൃത സേവനത്തിൽ[a] പ്രവേശിക്കുന്ന എല്ലാവരെയും.
