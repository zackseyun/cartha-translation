  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ, സമാഗമകൂടാരത്തിലെ ജോലി ചെയ്യാൻ സേവനത്തിൽ[a] പ്രവേശിക്കുന്ന എല്ലാവരെയും നീ എണ്ണണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേവനം” എന്നു പരിഭാഷപ്പെടുത്തിയ പദത്തിന് “സേവനസംഘം” അഥവാ “സൈന്യം” എന്നും അർഥമാകാം; ഇവിടെ അത് ലേവ്യർക്കു നിയോഗിക്കപ്പെട്ട സമാഗമകൂടാരസേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെയുള്ളവരെ
  rationale: എബ്രായത്തിലെ പ്രായപരിധി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: תִּפְקְדֵם
  choice: നീ എണ്ണിത്തിട്ടപ്പെടുത്തണം
  rationale: ഈ ജനസംഖ്യാ-സേവനപ്പട്ടികാ പശ്ചാത്തലത്തിൽ പദം വെറും എണ്ണലിനേക്കാൾ എണ്ണി രേഖപ്പെടുത്തുക എന്ന ആശയവും ഉൾക്കൊള്ളുന്നു.
- source_word: כָּל הַבָּא
  choice: പ്രവേശിക്കുന്ന എല്ലാവരെയും
  rationale: പങ്കെടുക്കാൻ എത്തുന്ന ഓരോ യോഗ്യനെയും സൂചിപ്പിക്കുന്ന എബ്രായ പങ്കാളിക്രിയയുടെ വിതരണാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: לַצָּבָא
  choice: ക്രമീകൃത സേവനത്തിൽ
  rationale: പദത്തിന് സൈന്യം, സംഘം, ക്രമീകരിച്ച സേവനം എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ ലേവ്യരുടെ നിയുക്ത കൂടാരശുശ്രൂഷയാണ് സന്ദർഭം.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: ജോലി നിർവഹിക്കാനുള്ള
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും മലയാളത്തിൽ അസ്വാഭാവികമായി ആവർത്തിക്കാതെ, നിയുക്ത ജോലി ചെയ്യുക എന്ന ആശയം നൽകുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവവും ജനവും കൂടിക്കാണുന്ന വിശുദ്ധകൂടാരത്തിനുള്ള സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദമാണ്.
theological_decisions:
- issue: לַצָּבָא എന്നതിലെ സൈനിക ധ്വനിയും ലേവ്യസേവനവും
  choice: ക്രമീകൃത സേവനം
  alternative: സൈന്യം; സേവനസംഘം; ചുമതല
  rationale: ഈ വാക്യം യുദ്ധസേവനത്തെക്കുറിച്ചല്ല, സമാഗമകൂടാരത്തിലെ ക്രമീകരിച്ച ലേവ്യചുമതലയെക്കുറിച്ചാണ്. അതിനാൽ സൈനിക അർഥം പ്രധാനപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ പദത്തിന്റെ സംഘടിത സ്വഭാവം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. “എണ്ണിത്തിട്ടപ്പെടുത്തണം” ജനസംഖ്യയെടുക്കലും സേവനത്തിനായി പട്ടികപ്പെടുത്തലും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; “ക്രമീകൃത” എന്നത് צָבָאയുടെ സംഘടിത സ്വഭാവം സൈനികവൽക്കരിക്കാതെ വ്യക്തമാക്കുന്നു.
