lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: എണ്ണപ്പെട്ട പുരുഷന്മാർ
  rationale: פקד എന്ന ധാതുവിന്റെ കണക്കെടുപ്പ്/പട്ടികപ്പെടുത്തൽ എന്ന അർഥം നിലനിർത്തുന്നു; ഈ ഭാഗത്തിന്റെ സന്ദർഭത്തിൽ എണ്ണപ്പെട്ടവർ സേവനയോഗ്യരായ പുരുഷന്മാരാണ്.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാരുടെ വംശങ്ങൾ
  rationale: מִשְׁפָּחָה എന്നത് ഇവിടെ ഗോത്രത്തിനുള്ളിലെ വംശവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; בְּנֵי മക്കൾ/വംശജർ എന്ന ആശയം നൽകുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: לְ എന്ന വിഭജനമോ ക്രമീകരണമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം ‘പ്രകാരം’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ബഹുവചന ആശയം ഉൾക്കൊള്ളുന്ന ഹീബ്രായ സാമൂഹിക ഘടകമായ ‘പിതാക്കന്മാരുടെ ഭവനം’ മലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ‘പിതൃഭവനങ്ങൾ’ എന്നു നൽകുന്നു.
