  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന പട്ടികാശൈലിയിലുള്ളതിനാൽ മൂലപാഠത്തിലെ അപൂർണ വാക്യഘടനയും അവസാനത്തെ ദ്വിബിന്ദുവും നിലനിർത്തി.
