base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: ml
  text: പിന്നെ, അതിൽ ശുശ്രൂഷ ചെയ്യാൻ ഉപയോഗിക്കുന്ന എല്ലാ ഉപകരണങ്ങളും—തീച്ചട്ടികൾ, മുൾക്കവകൾ, കോരികൾ, തളിക്കുപാത്രങ്ങൾ എന്നിങ്ങനെ യാഗപീഠത്തിന്റെ സകല ഉപകരണങ്ങളും—അവർ അതിന്മേൽ വെക്കണം. അതിന്മേൽ മോടിയുള്ള തോൽകൊണ്ടുള്ള ഒരു മൂടി[a] വിരിച്ച്, അതിന്റെ ചുമൽത്തണ്ടുകൾ സ്ഥാപിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കോലാട്ടിൻതോൽകൊണ്ടുള്ള മൂടി,’ ‘പോർപ്പോയിസ് തോൽകൊണ്ടുള്ള മൂടി,’ അല്ലെങ്കിൽ പൊതുവായി ‘ഈടുനിൽക്കുന്ന തോൽകൊണ്ടുള്ള മൂടി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായപദം (തഹഷ്) ഏതു ജീവിയെയോ തോലിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
