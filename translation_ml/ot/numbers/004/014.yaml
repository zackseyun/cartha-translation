  choice: പിന്നെ അവർ അതിന്മേൽ ... വെക്കണം
  rationale: നടപടിക്രമത്തിലെ തുടർച്ച ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; נתן എന്ന ക്രിയയുടെ ഇവിടെ യോജിച്ച സ്വാഭാവിക അർഥം ‘വെക്കുക’ ആണ്.
- source_word: כָּל כֵּלָיו
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כְּלִי ആരാധനാസേവനത്തിനുള്ള വിവിധ സാമഗ്രികളെ സൂചിപ്പിക്കുന്ന വിശാലപദമായതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ഉപകരണങ്ങൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: അതിൽ ശുശ്രൂഷ ചെയ്യാൻ ഉപയോഗിക്കുന്ന
  rationale: שרת എന്ന പദത്തിന്റെ വിശുദ്ധസേവനഭാവം ‘ശുശ്രൂഷ’ നിലനിർത്തുന്നു; ഉപകരണങ്ങളിലേക്കുള്ള בָּהֶם-ന്റെ ബന്ധം ‘ഉപയോഗിക്കുന്ന’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: הַמַּחְתֹּת
  choice: തീച്ചട്ടികൾ
  rationale: തീക്കനലുകൾ കൈകാര്യം ചെയ്യാനുള്ള ചട്ടികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ധൂപകലശങ്ങൾ എന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: הַמִּזְלָגֹת
  choice: മുൾക്കവകൾ
  rationale: പല മുനകളുള്ള യാഗപീഠോപകരണത്തിന്റെ രൂപവും പ്രവർത്തനവും സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: הַיָּעִים
  choice: കോരികൾ
  rationale: ചാരം മുതലായവ കോരിമാറ്റുന്നതിനുള്ള ഉപകരണങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַמִּזְרָקֹת
  choice: തളികകൾ
  rationale: ദ്രാവകമോ രക്തമോ സ്വീകരിക്കാനും തളിക്കാനും ഉപയോഗിച്ച വിശാലമായ പാത്രങ്ങളെ സൂചിപ്പിക്കാൻ ‘തളികകൾ’ തിരഞ്ഞെടുത്തു.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന്റെ സകല ഉപകരണങ്ങളും
  rationale: മുൻപത്തെ പട്ടികയെ സംഗ്രഹിക്കുന്ന പ്രയോഗം; כְּלִי എന്ന പദത്തിന് ഒരേ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: അതിന്മേൽ ... ഒരു മൂടി വിരിച്ച്
  rationale: פרשׂ-ന്റെ ‘വിരിക്കുക’ എന്ന ക്രിയാഭാവവും כְּסוּי-യുടെ ‘മൂടി’ എന്ന നാമാർഥവും പ്രത്യേകം നിലനിർത്തുന്നു.
- source_word: עוֹר תַּחַשׁ
  choice: മോടിയുള്ള തോൽകൊണ്ടുള്ള
  rationale: תַּחַשׁ സൂചിപ്പിക്കുന്ന ജീവി/തോൽ അനിശ്ചിതമാണ്. ഊഹാധിഷ്ഠിതമായ ജീവിനാമം മുഖ്യപാഠത്തിൽ നൽകാതെ സംരക്ഷകതോലിന്റെ ഗുണം വായനാസൗകര്യത്തോടെ വ്യക്തമാക്കുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: וְשָׂמוּ בַדָּיו
  choice: അതിന്റെ തണ്ടുകൾ സ്ഥാനത്ത് വെക്കണം
  rationale: ചുമക്കാനുള്ള തണ്ടുകളെ നിർദ്ദേശിക്കുന്ന בַּדִּים-നെ ‘തണ്ടുകൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ക്രമീകരണ നിർദ്ദേശമായതിനാൽ ‘സ്ഥാനത്ത് വെക്കണം’ സ്വാഭാവികമാണ്.
