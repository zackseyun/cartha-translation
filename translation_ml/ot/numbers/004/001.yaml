id: NUM.4.1
reference: Numbers 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: ml
  text: യാഹ്‌വെ മോശെയോടും അഹരോനോടും അരുളിച്ചെയ്തു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: YHWH.'
    reason: മൂലപാഠത്തിലെ ദൈവനാമത്തിന്റെ എബ്രായ വ്യഞ്ജനരൂപം അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവത്തിന്റെ ഔപചാരികമായ അഭിസംബോധന സൂചിപ്പിക്കുന്ന דִּבֵּר എന്ന ക്രിയയ്ക്കു സ്വാഭാവികവും മാന്യവുമായ മലയാള പ്രയോഗം.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള രൂപത്തിൽ വ്യക്തിനാമമായി നൽകുന്നു.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: മോശയോടും അഹരോനോടും
  rationale: രണ്ടു പേരും അഭിസംബോധിതരാണെന്ന എബ്രായ ഏകോപനം മലയാളത്തിലെ ‘-ഓടും ... -ഓടും’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അനാവശ്യമായ ‘പറഞ്ഞുകൊണ്ട്’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ മലയാള വായനക്കാർക്ക് പരിചിതമായ രൂപം മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുന്നു; പുനർനിർമിത ഉച്ചാരണരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘അരുളിച്ചെയ്തു’ ദൈവിക അഭിസംബോധനയുടെ ഔപചാരികത നിലനിർത്തുന്നു; ലֵאמֹר എന്ന ആവർത്തനാത്മക സൂത്രം മലയാളത്തിൽ ദ്വിബിന്ദുവാൽ സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
