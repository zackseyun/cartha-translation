source:
  edition: WLC
  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: ml
  text: സ്വർണ യാഗപീഠത്തിന്മേൽ അവർ ഒരു നീല തുണി വിരിക്കുകയും തഹശ് തോലിന്റെ ഒരു ആവരണംകൊണ്ട് അതിനെ മൂടുകയും അതിന്റെ തണ്ടുകൾ സ്ഥാനത്ത് വെക്കുകയും വേണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തഹശ്’ എന്ന പദം കൃത്യമായി എന്തിനെ സൂചിപ്പിക്കുന്നുവെന്ന് ഉറപ്പില്ല. ‘മേൽത്തരം തോൽ,’ ‘ഡ്യൂഗോങ്ങിന്റെ തോൽ’ എന്നിങ്ങനെയുള്ള വിവർത്തനങ്ങൾ നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: സ്വർണയാഗപീഠം
  rationale: ഹീബ്രു ഘടനയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ഇത് സ്വർണംകൊണ്ടുള്ളതോ സ്വർണം പൊതിഞ്ഞതോ ആയ യാഗപീഠത്തെ സൂചിപ്പിക്കാം.
- source_word: יִפְרְשׂוּ
  choice: വിരിക്കുകയും
  rationale: פרשׂ എന്ന ക്രിയയുടെ ‘വിരിക്കുക’ എന്ന സാധാരണ അർഥവും തുണി യാഗപീഠത്തിന്മേൽ ഇടുന്ന ആചാരനടപടിയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: നീലനിറമുള്ള ഒരു തുണി
  rationale: בגד എന്നത് ഇവിടെ തുണിയെയും תכלת നീല മുതൽ നീലകലർന്ന ധൂമ്രനിറം വരെയുള്ള പുരാതന വർണവസ്തുവിനെയും സൂചിപ്പിക്കുന്നു; കൃത്യമായ നിറഭേദം അമിതമായി നിർണ്ണയിക്കാതെ വായനാസൗകര്യം നിലനിർത്തുന്നു.
- source_word: וְכִסּוּ אֹתוֹ
  choice: അതിന്റെമേൽ മൂടുകയും
  rationale: മുൻ ക്രിയയോട് തുടർച്ചയായ നിർദേശം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അത്’ യാഗപീഠത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: തഹശ് തോൽകൊണ്ടുള്ള ഒരു മൂടി[a]
  rationale: תחש സൂചിപ്പിക്കുന്ന ജീവി ഏതെന്ന് അനിശ്ചിതമായതിനാൽ ഒരു പ്രത്യേക ജീവിയെ അനുമാനിക്കാതെ ഹീബ്രു പദം ലിപ്യന്തരണം ചെയ്യുന്നു; עור, מכסה എന്നിവ യഥാക്രമം ‘തോൽ’, ‘മൂടി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ സ്ഥാനത്തു വെക്കുകയും വേണം
  rationale: בדים വിശുദ്ധകൂടാരോപകരണങ്ങൾ ചുമക്കുന്നതിനുള്ള തണ്ടുകളാണ്; ‘സ്ഥാനത്തു വെക്കുക’ എന്നത് ഹീബ്രുവിലെ പൊതുവായ പ്രവൃത്തിയെ അനാവശ്യമായി ‘ഘടിപ്പിക്കുക’ എന്നു കൃത്യമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആചാരനിർദേശ ശൈലി. ഹീബ്രുവിലെ ക്രിയാക്രമം ഏകോപിതമായ ‘വിരിക്കുകയും… മൂടുകയും… വെക്കുകയും വേണം’ എന്ന ഘടനയിൽ നിലനിർത്തി. വിവാദമായ תחש എന്ന പദം പ്രധാനവാചകത്തിൽ ലിപ്യന്തരണം ചെയ്ത് അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
