  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ, സേവനത്തിൽ ഏർപ്പെടാനും സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാനും വരുന്ന എല്ലാവരെയും നീ എണ്ണണം[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സേവനത്തിൽ ഏർപ്പെടാനും” എന്നതിന് “നിയുക്തസേവനം നിർവഹിക്കാനും” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഹീബ്രായ പ്രയോഗം സൈനികസേവനത്തിന്റെ ഭാഷ രൂപകമായി ഉപയോഗിച്ച് ക്രമബദ്ധമായ കൂടാരസേവനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ
  rationale: ഹീബ്രായ പ്രായപരിധി പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മുപ്പത് എന്ന താഴ്ന്ന പരിധിയും അമ്പത് എന്ന ഉയർന്ന പരിധിയും നിലനിർത്തുന്നു.
- source_word: תִּפְקֹד אֹתָם
  choice: അവരെയെല്ലാം നീ എണ്ണണം
  rationale: ജനസംഖ്യാ/ഭരണപരമായ സന്ദർഭത്തിലെ פקד എന്ന ക്രിയയുടെ എണ്ണുക, കണക്കെടുക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל הַבָּא
  choice: ചേരുന്ന എല്ലാവരെയും
  rationale: യോഗ്യതയുള്ള ഓരോരുത്തരെയും ഉൾക്കൊള്ളുന്ന പങ്കാളിത്തഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לִצְבֹא צָבָא
  choice: സേവനത്തിൽ ചേരുന്ന
  rationale: സംഘടിതമായ നിയുക്തസേവനത്തെ സൂചിപ്പിക്കുന്ന צבא പദപ്രയോഗത്തിന്റെ സൈനിക പശ്ചാത്തലനിറം നേരിട്ടുള്ള യുദ്ധമായി തെറ്റിദ്ധരിപ്പിക്കാതെ നൽകുന്നു.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: വേല ചെയ്യാനുള്ള
  rationale: ക്രിയയും സമാനമൂലമുള്ള നാമവും ചേർന്ന പ്രയോഗത്തെ സ്വാഭാവികമായി വേല നിർവഹിക്കൽ എന്നു നൽകുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: ഇസ്രായേലിന്റെ വിശുദ്ധസംഗമസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും പരിചിതവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: צבא എന്ന പദത്തിന്റെ സൈനികഭാഷ നേരിട്ട് വിവർത്തനം ചെയ്യണമോ
  choice: സംഘടിത കൂടാരസേവനമായി ‘സേവനത്തിൽ ചേരുന്ന’ എന്നു നൽകി
  alternative: സൈനികസേവനത്തിൽ ചേരുന്ന / യുദ്ധം ചെയ്യാൻ വരുന്ന
  rationale: സംഖ്യ 4-ന്റെ സന്ദർഭം ലേവ്യരുടെ കൂടാരച്ചുമതലയാണ്, യഥാർഥ യുദ്ധമല്ല. എന്നിരുന്നാലും ക്രമബദ്ധമായ നിയുക്തസേവനത്തിന്റെ ഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സമാഗമകൂടാരം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; ഹീബ്രായത്തിലെ ഇരട്ട സേവനപ്രയോഗം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകാതിരിക്കാൻ ‘വേല ചെയ്യാനുള്ള സേവനം’ എന്നു ചേർത്തു.
