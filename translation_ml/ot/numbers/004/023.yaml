revisions:
- from: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ, സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാനുള്ള സേവനത്തിൽ ചേരുന്ന എല്ലാവരെയും നീ എണ്ണണം[a].
  to: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ പ്രായമുള്ളവരിൽ, സേവനത്തിൽ ഏർപ്പെടാനും സമാഗമകൂടാരത്തിൽ വേല ചെയ്യാനും വരുന്ന എല്ലാവരെയും നീ എണ്ണണം[a].
