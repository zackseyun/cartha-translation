translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. വംശാവലി-ഭരണപരമായ ശൈലി നിലനിർത്താൻ ‘പുത്രന്മാർ’, ‘കുലങ്ങൾ’, ‘പിതൃഭവനങ്ങൾ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു.
