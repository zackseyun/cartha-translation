language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: נָשֹׂ֗א אֶת רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִ/תּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാരുടെ ഇടയിൽനിന്ന് കെഹാത്തിന്റെ പുത്രന്മാരുടെ കണക്കെടുക്കുക[a]—അവരുടെ കുലങ്ങൾപ്രകാരവും പിതൃഭവനങ്ങൾപ്രകാരവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘കെഹാത്തിന്റെ പുത്രന്മാരുടെ തല ഉയർത്തുക’; ആളുകളെ എണ്ണുക എന്നർഥമുള്ള ഒരു ശൈലിപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: എണ്ണം എടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘തല ഉയർത്തുക’ എന്നാണെങ്കിലും, ജനസംഖ്യാ-ഭരണസന്ദർഭത്തിൽ ആളുകളെ എണ്ണുക എന്നർഥമുള്ള എബ്രായ ശൈലിയാണിത്. സ്വാഭാവികമായ മലയാളത്തിൽ സ്ഥാപിതമായ അർഥം നൽകുന്നു.
- source_word: בְּנֵי קְהָת
  choice: കെഹാത്തിന്റെ പുത്രന്മാർ
  rationale: എബ്രായ വംശാവലിപരമായ പ്രയോഗത്തെ അടുത്തും സുതാര്യമായും നിലനിർത്തുന്നു; ‘കെഹാത്യർ’ എന്നതിനെക്കാൾ മൂലരൂപത്തോട് ചേർന്നതാണ്.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാരിൽനിന്ന്
  rationale: ഒരു വലിയ വംശവിഭാഗത്തിനുള്ളിൽനിന്ന് ഒരു ഉപവിഭാഗത്തെ വേർതിരിച്ച് എണ്ണുന്നതാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാ-ഗോത്രസന്ദർഭത്തിൽ מִשְׁפָּחָה കുടുംബത്തേക്കാൾ വിശാലമായ കുലവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിതമായ ബന്ധുത്വ-ഭരണഘടകത്തെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
