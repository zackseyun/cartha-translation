source:
  edition: WLC
  text: וַ/יִּהְי֥וּ פְקֻדֵי/הֶ֖ם לְ/מִשְׁפְּחֹתָ֑/ם אַלְפַּ֕יִם שְׁבַ֥ע מֵא֖וֹת וַ/חֲמִשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: ml
  text: അവരിൽനിന്ന് കുടുംബങ്ങൾപ്രകാരം എണ്ണപ്പെട്ടവർ രണ്ടായിരത്തി എഴുനൂറ്റമ്പതായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ היה വിവരണത്തെ മുന്നോട്ടു കൊണ്ടുപോകുകയും എണ്ണപ്പെട്ടവരുടെ ആകെ സംഖ്യ പ്രസ്താവിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിൽ വാക്യാവസാനത്തെ ‘ആയിരുന്നു’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: פְקֻדֵיהֶם
  choice: അവരിൽനിന്ന് ... എണ്ണപ്പെട്ടവർ
  rationale: ജനസംഖ്യാ/സൈനിക കണക്കെടുപ്പിന്റെ പശ്ചാത്തലത്തിൽ פקד എന്ന ധാതുവിൽനിന്നുള്ള രൂപം രജിസ്റ്റർ ചെയ്യപ്പെട്ടവരെയോ എണ്ണപ്പെട്ടവരെയോ സൂചിപ്പിക്കുന്നു. ‘എണ്ണപ്പെട്ടവർ’ അതിന്റെ കർമണിയും ഫലസൂചകവുമായ ഭാവം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ എബ്രായം പ്രത്യേകം പറയാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ഗോത്രങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ഇസ്രായേലിലെ വംശീയ-കുടുംബ ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ഗോത്രങ്ങൾപ്രകാരം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും കണക്കെടുപ്പിന്റെ ഘടന വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: രണ്ടായിരത്തി എഴുനൂറ്റമ്പത്
  rationale: എബ്രായത്തിലെ സംഖ്യാക്രമം അതേ ആകെ സംഖ്യയായ 2,750 ആയി, മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ കണക്കെടുപ്പ്-ശൈലി ഉപയോഗിച്ചു. മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന എബ്രായ വാവ് മലയാള വാക്യക്രമത്തിൽ പ്രത്യേകം ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അങ്ങനെ’ എന്നു വികസിപ്പിക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചു.
