- from: അവരിൽനിന്ന് ഗോത്രങ്ങൾപ്രകാരം എണ്ണപ്പെട്ടവർ രണ്ടായിരത്തി എഴുനൂറ്റമ്പത് പേരായിരുന്നു.
  to: അവരിൽനിന്ന് കുടുംബങ്ങൾപ്രകാരം എണ്ണപ്പെട്ടവർ രണ്ടായിരത്തി എഴുനൂറ്റമ്പതായിരുന്നു.
  rationale: The revision corrects the social-grouping term from ‘tribes’ to ‘families/clans’ and retains the source’s passive census sense and exact total. No footnote is needed because the revised Malayalam is clear and no textual ambiguity requires explanation.
