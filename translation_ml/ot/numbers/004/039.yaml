  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: ml
  text: മുപ്പതു വയസ്സുമുതൽ അമ്പതു വയസ്സുവരെ, സമാഗമകൂടാരത്തിലെ വേലയ്ക്കായി സേവനത്തിൽ പ്രവേശിക്കുന്ന എല്ലാവരെയും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: മുപ്പതു വയസ്സുമുതൽ
  rationale: ഹീബ്രായ പ്രയോഗം കുറഞ്ഞ പ്രായപരിധി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ രൂപം.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: അമ്പതു വയസ്സുവരെ
  rationale: ഉയർന്ന പ്രായപരിധി വ്യക്തമായി രേഖപ്പെടുത്തുന്നു.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: സേവനത്തിൽ പ്രവേശിക്കുന്ന എല്ലാവരെയും
  rationale: בוא എന്നതിലെ പ്രവേശനഭാവവും צבא എന്നതിന്റെ ഇവിടെ സൈനികമല്ലാത്ത, ക്രമീകരിക്കപ്പെട്ട ലേവ്യസേവനാർഥവും നിലനിർത്തുന്നു; ചുറ്റുമുള്ള കണക്കെടുപ്പ് വാക്യഘടനയോട് ചേരാൻ കർമവിഭക്തി ഉപയോഗിച്ചു.
- source_word: לַעֲבֹדָה
  choice: വേലയ്ക്കായി
  rationale: മുൻപുള്ള צבא-യിൽനിന്ന് വേർതിരിച്ച് നിർവഹിക്കേണ്ട പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ
  rationale: നിയമപെട്ടകകൂടാരത്തിന്റെ സ്ഥിരമായ മലയാള നാമരൂപം ഉപയോഗിച്ച്, അവിടവുമായി ബന്ധപ്പെട്ട വേലയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന പട്ടിക/കണക്കെടുപ്പ് വാക്യത്തിന്റെ ഭാഗമായതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി.
