translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാസംബന്ധിയായ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. നിർദേശാത്മകമായ എബ്രായ ക്രിയാരൂപങ്ങൾ മലയാളത്തിൽ ‘മൂടണം/വെക്കണം’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
