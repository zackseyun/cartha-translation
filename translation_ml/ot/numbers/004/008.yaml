  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: ml
  text: അവയുടെമേൽ കടുംചുവപ്പുനൂൽകൊണ്ടുള്ള ഒരു തുണി വിരിച്ച്, അതിനെ തഹശ്[a] തോൽകൊണ്ടുള്ള ഒരു മൂടുപടംകൊണ്ട് മൂടണം; പിന്നെ അതിന്റെ തണ്ടുകൾ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ തഹശ്; ഇത് കൃത്യമായി ഏത് മൃഗത്തെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. പരമ്പരാഗത പരിഭാഷകളിൽ ‘ബാഡ്ജർ തോൽ,’ ‘കടൽപ്പന്നിയുടെ തോൽ,’ അല്ലെങ്കിൽ പൊതുവായി ‘മേന്മയുള്ള തോൽ’ എന്നിങ്ങനെ കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: അവയുടെമേൽ ... വിരിച്ച്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വസ്തുക്കളുടെ മീതെ ആവരണം വിരിക്കുന്ന മൂർത്തമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בֶּגֶד
  choice: ഒരു തുണി
  rationale: ഇവിടെ ധരിക്കാനുള്ള വസ്ത്രമല്ല, വിശുദ്ധ ഉപകരണങ്ങൾ മൂടാനുള്ള തുണിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: תּוֹלַעַת שָׁנִי
  choice: കടുംചുവപ്പുനൂൽകൊണ്ടുള്ള
  rationale: ഈ പദസമുച്ചയം കടുംചുവപ്പിൽ ചായംപിടിപ്പിച്ച നൂൽ/വസ്തു സൂചിപ്പിക്കുന്നു. നിറം മാത്രം പറയാതെ വസ്ത്രനിർമാണസംബന്ധിയായ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: וְכִסּוּ אֹתוֹ
  choice: അതിനെ ... മൂടണം
  rationale: എബ്രായത്തിലെ ബഹുവചനമായ ‘അവയുടെമേൽ’ എന്നതിൽനിന്ന് ഏകവചനമായ ‘അതിനെ’ എന്നതിലേക്കുള്ള മാറ്റം നിലനിർത്തുന്നു; ഇത് മേശയെ ഒരു ഏകകമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּמִכְסֵה
  choice: ഒരു മൂടികൊണ്ട്
  rationale: പുറമേയുള്ള മറ്റൊരു ആവരണപാളിയെ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ അർത്ഥം ലളിതവും ഔപചാരികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: עוֹר תָּחַשׁ
  choice: തഹശ് തോൽ
  rationale: തഹശ് എന്നത് ഏത് മൃഗത്തെയോ വസ്തുവിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമായതിനാൽ തെറ്റായ കൃത്യത ഒഴിവാക്കി എബ്രായപദം ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: അതിന്റെ തണ്ടുകൾ യഥാസ്ഥാനത്ത് വെക്കണം
  rationale: בדים വിശുദ്ധ സാമഗ്രികൾ ചുമക്കാനുള്ള തണ്ടുകളാണ്. യാത്രയ്ക്കായി അവ ഘടിപ്പിച്ചു വെക്കുന്നതെന്ന സന്ദർഭാർഥം ‘യഥാസ്ഥാനത്ത്’ വ്യക്തമാക്കുന്നു.
