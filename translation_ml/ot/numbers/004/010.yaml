id: NUM.4.10
reference: Numbers 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתְנ֤וּ אֹתָ/הּ֙ וְ/אֶת כָּל כֵּלֶ֔י/הָ אֶל מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: ml
  text: അവർ അതും അതിന്റെ ഉപകരണങ്ങളെല്ലാം തഹശ് തോൽകൊണ്ടുള്ള ഒരു മൂടിക്കുള്ളിൽ വെക്കണം[a]; പിന്നെ അത് ചുമക്കാനുള്ള ദണ്ഡിന്മേൽ വെക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘തഹശ്’ (എബ്രായം: תַּחַשׁ) എന്ന പദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്; അത് ഒരു പ്രത്യേക ജീവിയുടെ തോലിനെയോ മോടിയുള്ള ഒരുതരം തോലിനെയോ സൂചിപ്പിക്കാം. പരമ്പരാഗത പരിഭാഷകളിൽ കടൽപ്പശുവിന്റെ തോൽ തുടങ്ങിയ തിരിച്ചറിയലുകൾ കാണാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: വെക്കണം
  rationale: നടപടിക്രമത്തിലെ നിർദേശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ, ബന്ധകത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയയെ മലയാളത്തിൽ നിർദേശാത്മകമായ ‘വെക്കണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: אֹתָהּ
  choice: അതും
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻവാക്യത്തിലെ വിളക്കുതണ്ടിനെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായ അന്വയസൂചന നിലനിർത്തുന്നു.
- source_word: כָּל כֵּלֶיהָ
  choice: അതിന്റെ ഉപകരണങ്ങളെല്ലാം
  rationale: כֵּלִים ഇവിടെ വിളക്കുതണ്ടുമായി ബന്ധപ്പെട്ട വിവിധ സാമഗ്രികളെയും ഉപകരണങ്ങളെയും സൂചിപ്പിക്കുന്ന വിശാലപദമാണ്.
- source_word: אֶל מִכְסֵה
  choice: ഒരു മൂടിക്കുള്ളിൽ
  rationale: נתן എന്ന ക്രിയയോടൊപ്പം אֶל, വസ്തുക്കളെ മൂടിയുടെ ഉള്ളിലാക്കി പൊതിയുന്ന പ്രവർത്തനം സൂചിപ്പിക്കുന്നു.
- source_word: עוֹר תַּחַשׁ
  choice: തഹശ് തോൽകൊണ്ടുള്ള
  rationale: תַּחַשׁ ഏത് ജീവിയെയോ ഏത് പ്രത്യേകതരം തോലിനെയോ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്. അനുമാനാത്മകമായ ജീവിനാമമോ ഗുണവിശേഷണമോ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ എബ്രായപദം ലിപ്യന്തരിച്ചു.
- source_word: עַל הַמּוֹט
  choice: ചുമക്കാനുള്ള ദണ്ഡിന്മേൽ
  rationale: מּוֹט ചുമക്കാൻ ഉപയോഗിക്കുന്ന ദണ്ഡിനെയോ തണ്ടിനെയോ സൂചിപ്പിക്കുന്നു; എബ്രായത്തിലെ ഏകവചനം നിലനിർത്തി അതിന്റെ ഉപയോഗം വ്യക്തമാക്കി.
