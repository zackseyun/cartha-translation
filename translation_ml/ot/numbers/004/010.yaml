translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നടപടിക്രമഭാഷ ഉപയോഗിച്ചു. വിവാദമായ תַּחַשׁ എന്ന പദം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ മുഖ്യപാഠത്തിൽ ലിപ്യന്തരിച്ചു, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
