lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: എണ്ണി
  rationale: ജനസംഖ്യാഗണനയുടെ ഈ സന്ദർഭത്തിൽ פקד ആളുകളെ എണ്ണുക എന്ന അർഥത്തിലാണ്; ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെ
  rationale: ദൈവകല്പനയോട് മോശയുടെ പ്രവൃത്തി ഒത്തിരുന്നുവെന്ന താരതമ്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: കല്പന മോശയുടെ എണ്ണലിനു മുമ്പുണ്ടായതാണെന്ന കാലബന്ധം മലയാളത്തിലെ സന്ദർഭക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായ വ്യക്തിനാമരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹתוֹ
  choice: തന്നോടു
  rationale: കല്പന ലഭിച്ച വ്യക്തി മോശയാണെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: אֶת כָּל בְּכֹר
  choice: കടിഞ്ഞൂലുകളെയെല്ലാം
  rationale: മൂലപദത്തിലെ സമഗ്രത നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘ആൺ’ എന്ന ഘടകം ചേർക്കുന്നില്ല.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിലുള്ള
  rationale: בני ישראל എന്ന ബന്ധസൂചക പ്രയോഗവും എണ്ണപ്പെടുന്നവർ ആ സമൂഹത്തിനുള്ളിലാണെന്ന בְּ ഉപസർഗത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം സ്ഥാനപ്പേരായി മാറ്റാതെ സംരക്ഷിക്കുന്നു; സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതവും മാന്യവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന ലിംഗസൂചക സമൂഹപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ വംശബന്ധപ്രയോഗം സംരക്ഷിക്കുന്നതിനൊപ്പം മലയാളത്തിൽ ‘മക്കൾ’ സ്വാഭാവികമായ കൂട്ടനാമമാണ്; ഇവിടെ എണ്ണപ്പെടുന്ന കടിഞ്ഞൂലുകൾ പുരുഷന്മാരാണെന്നത് വാക്യത്തിൽ തന്നെ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കടിഞ്ഞൂൽ’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
