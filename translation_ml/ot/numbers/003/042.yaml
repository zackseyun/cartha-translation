  to: യഹോവ മോശയോടു കൽപിച്ചതുപോലെ, മോശ ഇസ്രായേൽമക്കളുടെ ഇടയിലുള്ള എല്ലാ കടിഞ്ഞൂലുകളെയും എണ്ണി.[a]
  rationale: The revision replaces an ambiguous Malayalam reflexive with the explicit recipient ‘മോശയോടു,’ thereby preserving the Hebrew referent. It also places ‘എല്ലാ’ before ‘കടിഞ്ഞൂലുകളെയും’ for smoother modern Malayalam. No theological or interpretive content has been changed.
