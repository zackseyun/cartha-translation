id: NUM.3.18
reference: Numbers 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: ml
  text: 'ഗേർശോന്റെ പുത്രന്മാരുടെ പേരുകൾ, അവരുടെ കുലങ്ങൾപ്രകാരം, ഇവയാണ്: ലിബ്നിയും ശിമെയിയും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. വാക്യാരംഭത്തിലെ ו മുൻസന്ദർഭത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ/കൂടാതെ’ ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം നിലനിർത്താം.
- source_word: שְׁמוֹת
  choice: പേരുകൾ
  rationale: തുടർന്നുവരുന്ന ‘ഗേർശോന്റെ പുത്രന്മാരുടെ’ എന്ന ഷഷ്ഠീവിവക്തി പ്രയോഗത്തോടൊപ്പം എബ്രായ നിർമിതരൂപത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർ
  rationale: ഇവിടെ പേരെടുത്തിരിക്കുന്നത് രണ്ടു പുരുഷസന്തതികളെയായതിനാൽ വിശാലമായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ അക്ഷരാർഥത്തോടു ചേർന്ന ‘പുത്രന്മാർ’ യോജിക്കുന്നു.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: അവരുടെ കുലങ്ങൾപ്രകാരം
  rationale: ജനസംഖ്യാ-വംശാവലി പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה എന്നത് കുടുംബത്തെക്കാൾ വിപുലമായ സാമൂഹിക ഘടകമായ ‘കുലം’ സൂചിപ്പിക്കുന്നു; לְ എന്നത് ക്രമീകരണത്തിന്റെ മാനദണ്ഡമായി ‘പ്രകാരം’ എന്നു നൽകി.
- source_word: לִבְנִי
  choice: ലിബ്നി
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളലിപിയിൽ മൂലോച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരിച്ചു.
- source_word: וְ/שִׁמְעִי
  choice: ശിമെയിയും
  rationale: വ്യക്തിനാമം ലിപ്യന്തരിച്ചു; וְ എന്ന സംയോജകം മലയാളത്തിലെ പട്ടികശൈലിക്ക് സ്വാഭാവികമായ ‘-യും’ കൊണ്ട് നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വംശാവലി-പട്ടിക ശൈലി. ‘കുലം’ എന്ന പദം സംഖ്യാവിവരണത്തിലെ സാമൂഹിക ക്രമീകരണം കൃത്യമായി സൂചിപ്പിക്കുന്നു; അനാവശ്യമായ സഭാപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
