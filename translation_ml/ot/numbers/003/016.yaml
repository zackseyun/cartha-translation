id: NUM.3.16
reference: Numbers 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: ml
  text: അങ്ങനെ മോശെ യഹ്‌വേയുടെ കൽപ്പനപ്രകാരം[a] അവരെ എണ്ണി; തനിക്കു കൽപ്പിച്ചിരുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ, ‘യഹ്‌വേയുടെ വായ്‌പ്രകാരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: എണ്ണി
  rationale: ലേവ്യരെ കണക്കെടുക്കുന്ന ഈ സന്ദർഭത്തിൽ פקד ആളുകളുടെ എണ്ണം രേഖപ്പെടുത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘എണ്ണി’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: אֹתָם
  choice: അവരെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ലേവ്യരെയാണ് നേരിട്ടുള്ള കർമസർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വേയുടെ കൽപ്പനപ്രകാരം
  rationale: പദശഃ ‘യഹ്‌വേയുടെ വായ്പ്രകാരം’ എന്നാണെങ്കിലും, ഈ എബ്രായ പ്രയോഗം ദൈവിക കൽപ്പനയനുസരിച്ച് പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר
  choice: പോലെതന്നെ
  rationale: മുൻകൽപ്പനയും മോശെയുടെ പ്രവൃത്തിയും തമ്മിലുള്ള കൃത്യമായ അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: צֻוָּה
  choice: തന്നോടു കൽപ്പിച്ചിരുന്നത്
  rationale: പുഅൽ കർമണിപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കൽപ്പന ലഭിച്ച വ്യക്തി മോശെയാണ്, എന്നാൽ കൽപ്പിച്ചവനെ ഈ ഉപവാക്യത്തിൽ പ്രത്യേകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിനു പകരം ‘യഹ്‌വേ’ എന്ന് ലിപ്യന്തരണം ചെയ്തു.
- issue: צֻוָּה എന്ന കർമണിരൂപത്തിലെ പരോക്ഷ കർത്താവ്
  choice: തന്നോടു കൽപ്പിച്ചിരുന്നത്
  alternative: യഹ്‌വേ തന്നോടു കൽപ്പിച്ചിരുന്നത്
  rationale: മൂലത്തിൽ കൽപ്പിച്ചവന്റെ പേര് ഈ ഉപവാക്യത്തിൽ ആവർത്തിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും കർമണിരൂപവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അങ്ങനെ’ എന്നത് וַ എന്ന തുടർച്ചാസൂചനയും സംഭവക്രമവും വ്യക്തമാക്കുന്നു; അർദ്ധവിരാമം രണ്ടു അടുത്ത ഉപവാക്യങ്ങളെ വായനാസൗകര്യത്തോടെ ബന്ധിപ്പിക്കുന്നു.
