  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: ml
  text: അവരുടെ കണക്കിൽപ്പെട്ടവർ[a]—ഒരു മാസം പ്രായം മുതലുള്ള പുരുഷലിംഗക്കാരായ എല്ലാവരുടെയും എണ്ണമനുസരിച്ച്—ഏഴായിരത്തി അഞ്ഞൂറ് ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ എണ്ണപ്പെട്ടവർ.’ എബ്രായത്തിൽ ജനസംഖ്യാകണക്കെടുപ്പിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ഇതേ പദം വാക്യത്തിൽ രണ്ടുതവണ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള ഈ രൂപം ജനസംഖ്യാകണക്കെടുപ്പിൽ എണ്ണപ്പെട്ട വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ കണക്കെടുപ്പിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: בְּמִסְפַּר
  choice: എണ്ണമനുസരിച്ച്
  rationale: എണ്ണലിന്റെ മാനദണ്ഡമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ സ്വാഭാവികമായി പകരുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ ആൺകുട്ടികളുടെയും
  rationale: ഒരു മാസം പ്രായം മുതലുള്ളവരാണ് സന്ദർഭം; അതിനാൽ ലിംഗസൂചനയും പ്രായസന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്ന പ്രയോഗം സ്വീകരിച്ചു.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ഒരു മാസം പ്രായമുള്ളതുമുതൽ മേലോട്ടുള്ള
  rationale: കണക്കെടുപ്പ് ഭാഗങ്ങളിലെ പ്രായപരിധി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം അർഥനിഷ്ഠമായും വായനാസൗകര്യത്തോടെയും നൽകുന്നു.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: ഏഴായിരത്തി അഞ്ഞൂറുപേർ
  rationale: സംഖ്യയെ മലയാള ഗദ്യത്തിൽ സ്വാഭാവികമായി എഴുതി, എണ്ണപ്പെട്ടത് ആളുകളാണെന്ന് വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
