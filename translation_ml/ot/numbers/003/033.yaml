translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശപ്പട്ടികയുടെ ഔപചാരികവും സംക്ഷിപ്തവുമായ ശൈലി നിലനിർത്തി. വ്യക്തിനാമങ്ങളും അവയിൽനിന്നുള്ള കൂട്ടപ്പേരുകളും മലയാളധ്വനിക്കനുസരിച്ച് ലിപ്യന്തരിച്ചു.
