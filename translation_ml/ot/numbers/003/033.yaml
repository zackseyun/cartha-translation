id: NUM.3.33
reference: Numbers 3:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לִ/מְרָרִ֕י מִשְׁפַּ֨חַת֙ הַ/מַּחְלִ֔י וּ/מִשְׁפַּ֖חַת הַ/מּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: ml
  text: 'മെരാരിയുടെ വിഭാഗം: മഹ്ലിയരുടെ കുലവും മൂശിയരുടെ കുലവും; ഇവ മെരാരിയുടെ കുലങ്ങളാണ്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: മെരാരിക്കുള്ളവർ
  rationale: ലְ എന്ന ഉപസർഗം ഈ പട്ടികയിൽ മെരാരിയോടു ബന്ധപ്പെട്ട വിഭാഗത്തെ ശീർഷകരൂപത്തിൽ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മെരാരിക്കുള്ളവർ’ എന്നത് ഈ വർഗീകരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְׁפַּחַת
  choice: വംശം
  rationale: ജനവംശപ്പട്ടികയിലും ജനസംഖ്യാകണക്കെടുപ്പിലും מִשְׁפָּחָה ഗോത്രത്തിനുള്ളിലെ ബന്ധുജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളപദമായി ‘വംശം’ തിരഞ്ഞെടുത്തു.
- source_word: הַמַּחְלִי
  choice: മഹ്ല്യർ
  rationale: മഹ്ലിയോടു ബന്ധപ്പെട്ട സന്തതി/വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നിസ്ബരൂപമാണിത്. വ്യക്തിനാമത്തിൽനിന്നുള്ള കൂട്ടപ്പേരായി ‘മഹ്ല്യർ’ ഉപയോഗിച്ചു.
- source_word: וּמִשְׁפַּחַת
  choice: മൂശ്യരുടെ വംശവും
  rationale: וּ ആദ്യ വംശത്തോടു രണ്ടാമത്തേതിനെ കൂട്ടിച്ചേർക്കുന്നു. എബ്രായഘടനയുടെ ആവർത്തനവും പട്ടികയുടെ വ്യക്തതയും മലയാളത്തിൽ നിലനിർത്തി.
- source_word: הַמּוּשִׁי
  choice: മൂശ്യർ
  rationale: മൂശിയോടു ബന്ധപ്പെട്ട സന്തതി/വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടപ്പേരായി ‘മൂശ്യർ’ നൽകി.
- source_word: אֵלֶּה הֵם
  choice: ഇവയാണ്
  rationale: ചൂണ്ടുപദവും സർവനാമവും ചേർന്നുള്ള ഊന്നിയ തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇവയാണ്’ എന്നു പ്രകടമാകുന്നു.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: മെരാരിയുടെ വംശങ്ങൾ
  rationale: മുമ്പ് പറഞ്ഞ രണ്ടു വിഭാഗങ്ങളെയും സംഗ്രഹിക്കുന്ന ബഹുവചനപ്രയോഗം; ഏകവചനത്തിൽ ഉപയോഗിച്ച ‘വംശം’ എന്ന പദവുമായി സ്ഥിരത പാലിച്ചു.
