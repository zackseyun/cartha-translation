translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തവും മാന്യവുമായ മലയാളം. എണ്ണിപ്പറയുന്ന ഭരണപരമായ പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി. മുഖ്യപാഠത്തിലെ അടിക്കുറിപ്പുക്രമം [a][b] ആയി ക്രമപ്പെടുത്തി.
