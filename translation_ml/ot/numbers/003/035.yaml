source:
  edition: WLC
  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: ml
  text: മെരാരിയുടെ കുലങ്ങൾക്കുള്ള പിതൃഭവനത്തിന്റെ തലവൻ അബിഹയിലിന്റെ മകൻ സൂരീയേൽ ആയിരുന്നു[a][b]. അവർ സമാഗമകൂടാരത്തിന്റെ വടക്കുവശത്ത് പാളയമടിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തലവൻ’ എന്നതിന് ‘നേതാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായപദമായ נָשִׂיא അംഗീകൃത നേതാവിനെയോ പ്രഭുവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘പിതാവിന്റെ ഭവനം’; പിതൃവംശപരമായ വിപുലകുടുംബത്തെയോ കുലഘടകത്തെയോ സൂചിപ്പിക്കുന്ന ബന്ധുത്വപദമാണിത്.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: തലവൻ
  rationale: പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന ו മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല. נָשִׂיא ഇവിടെ രാജകീയമായ ‘പ്രഭു’ എന്നതിലുപരി അംഗീകൃത കുലനേതാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തലവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בֵית אָב
  choice: പിതൃഭവനം
  rationale: പിതൃവംശാധിഷ്ഠിതമായ വിപുലകുടുംബമോ കുലഘടകമോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബന്ധുത്വപദം. ‘പിതൃഭവനം’ അതിന്റെ ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: മെരാരിയുടെ കുലങ്ങളുടെ
  rationale: מִשְׁפָּחוֹת ഇവിടെ ഗോത്രത്തിനുള്ളിലെ കുലവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. לְ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവിഭക്തിയിലൂടെ അവതരിപ്പിച്ചു.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: അബീഹയിലിന്റെ മകൻ സൂരീയേൽ
  rationale: വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിന് യോജിച്ച വിധത്തിൽ ലിപ്യന്തരിച്ചു; בֶּן സ്വാഭാവിക മലയാള വംശാവലിപ്രയോഗമായ ‘മകൻ’ എന്നു നൽകി.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: സമാഗമകൂടാരത്തിന്റെ വടക്കുവശത്ത്
  rationale: יֶרֶךְ അക്ഷരാർഥത്തിൽ ‘പാർശ്വം/വശം’ എന്നാണ്; ദിശാസൂചകമായ צָפֹנָה ചേർന്നതിനാൽ സ്ഥാനം സ്വാഭാവികമായി ‘വടക്കുവശത്ത്’ എന്നു നൽകി. מִשְׁכָּן പ്രസക്തിയിൽ ‘സമാഗമകൂടാരം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: יַחֲנוּ
  choice: അവർ ... പാളയമടിക്കണം
  rationale: ഈ അപൂർണ്ണക്രിയാരൂപം ഭാവികാലപ്രസ്താവന മാത്രമല്ല, നിശ്ചയിക്കപ്പെട്ട പാളയക്രമവും സൂചിപ്പിക്കുന്നു. ‘പാളയമടിക്കണം’ ആ നിർദേശാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
