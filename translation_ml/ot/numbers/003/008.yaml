id: NUM.3.8
reference: Numbers 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: ml
  text: അവർ സമാഗമകൂടാരത്തിലെ എല്ലാ ഉപകരണങ്ങളെയും കാത്തുസൂക്ഷിക്കുകയും, തിരുനിവാസത്തിലെ ശുശ്രൂഷ നിർവഹിക്കാൻ ഇസ്രായേൽപുത്രന്മാരുടെ കാവൽച്ചുമതലയും[a] പാലിക്കുകയും വേണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ചുമതല’ അല്ലെങ്കിൽ ‘കടമ’.
    reason: מִשְׁמֶרֶת എന്നതിന് ഏല്പിക്കപ്പെട്ട കാവൽച്ചുമതല, ചുമതല, അല്ലെങ്കിൽ കടമ എന്നിങ്ങനെ അടുത്ത അർഥങ്ങൾ സാധ്യമാണ്. ‘ഇസ്രായേൽപുത്രന്മാരുടെ’ എന്ന ജനിതകബന്ധത്തിന്റെ കൃത്യസ്വഭാവം മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: കാത്തുസൂക്ഷിക്കുകയും … വഹിക്കുകയും വേണം
  rationale: ശമർ എന്ന ക്രിയയ്ക്ക് ഇവിടെ വസ്തുക്കളെ കാക്കുക എന്ന ആശയവും ഏല്പിച്ച ചുമതല നിർവഹിക്കുക എന്ന ആശയവും ഉണ്ട്. രണ്ട് കർമങ്ങളോടും സ്വാഭാവികമായി ചേരാൻ മലയാളത്തിൽ സന്ദർഭാനുസൃതമായ രണ്ട് ക്രിയാപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിലെ എല്ലാ ഉപകരണങ്ങളും
  rationale: כְּלִים പാത്രങ്ങൾക്കു മാത്രമല്ല, വിവിധ സാധനങ്ങൾക്കും ഉപകരണങ്ങൾക്കും ഉപയോഗിക്കാം; അതിനാൽ വ്യാപ്തി ചുരുക്കാത്ത ‘ഉപകരണങ്ങൾ’ തിരഞ്ഞെടുത്തു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: നിയുക്തമായ കൂടിക്കാഴ്ചയുടെയും കൂടാരത്തിന്റെയും ആശയങ്ങൾ നിലനിർത്തുന്ന, മലയാളത്തിൽ പരിചിതമായ വിശുദ്ധമന്ദിരനാമം.
- source_word: מִשְׁמֶרֶת
  choice: ചുമതല
  rationale: ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം, കാവൽച്ചുമതല, കടമ എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദം; വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ സമൂഹപ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിലെ ശുശ്രൂഷ നിർവഹിക്കേണ്ടതിന്
  rationale: ആരാധനാസംബന്ധമായ ഏല്പിച്ച സേവനത്തെ ‘ശുശ്രൂഷ’ എന്നും അതു നടത്തുന്നതിനെ ‘നിർവഹിക്കുക’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ഉദ്ദേശ്യാർഥവും നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ ദൈവിക നിവാസകൂടാരത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും അർഥവത്തുമായ മലയാളപദം.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമത്തിലെ ലിംഗസൂചന
  choice: ഇസ്രായേൽപുത്രന്മാർ
  alternative: ഇസ്രായേൽമക്കൾ / ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പുല്ലിംഗരൂപം മറച്ചുവയ്ക്കാതെ നിലനിർത്തി; ഇത് ദേശീയസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെന്ന അർഥവും സന്ദർഭത്തിൽ സംരക്ഷിക്കപ്പെടുന്നു.
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: ഇസ്രായേൽപുത്രന്മാരുടെ ചുമതല
  alternative: ഇസ്രായേൽപുത്രന്മാർക്കുവേണ്ടിയുള്ള ചുമതല / അവരുടെ കാവൽച്ചുമതല
  rationale: ജനിതകബന്ധത്തിന്റെ കൃത്യ സ്വഭാവം മൂലത്തിൽ വിശദീകരിച്ചിട്ടില്ല. ‘അവർക്കുവേണ്ടിയുള്ളത്’ എന്ന് ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കാതെ മൂലത്തിലെ ബന്ധവും ആശയസമ്മർദവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വിശുദ്ധമന്ദിരസംബന്ധമായ പരിചിത പദങ്ങളായ ‘സമാഗമകൂടാരം’, ‘തിരുനിവാസം’, ‘ശുശ്രൂഷ’ എന്നിവ ഉപയോഗിച്ചു; മൂലത്തിലെ ഘടനാപരമായ അസ്പഷ്ടത അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
