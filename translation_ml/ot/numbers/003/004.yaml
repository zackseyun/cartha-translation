source:
  edition: WLC
  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: ml
  text: എന്നാൽ നാദാബും അബീഹൂവും സീനായി മരുഭൂമിയിൽ യഹോവയുടെ സന്നിധിയിൽ അന്യമായ തീ[a] അർപ്പിച്ചപ്പോൾ യഹോവയുടെ സന്നിധിയിൽവെച്ചു മരിച്ചു. അവർക്ക് പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല; അവരുടെ പിതാവായ അഹരോന്റെ സന്നിധിയിൽ[b] എലെയാസാറും ഈഥാമാറും പുരോഹിതന്മാരായി ശുശ്രൂഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്യമായ തീ’ എന്നതിന് ‘വിദേശ തീ’ എന്നും പരിഭാഷപ്പെടുത്താം. യാഗത്തിനായി അനുവദിക്കപ്പെടാത്ത തീയെയാകാം എബ്രായപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അഹരോന്റെ സന്നിധിയിൽ’ എന്നതിന് ‘അവരുടെ പിതാവായ അഹരോന്റെ മുമ്പാകെ’ എന്നും പരിഭാഷപ്പെടുത്താം; എലെയാസാറും ഈഥാമാറും അഹരോന്റെ ജീവിതകാലത്ത് പുരോഹിതശുശ്രൂഷ ചെയ്തുവെന്ന ആശയവും എബ്രായപ്രയോഗത്തിൽ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന ക്രിയ സംഭവത്തെ നേരിട്ട് വിവരിക്കുന്നു. സംയുക്ത കർത്താവിനോട് യോജിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണ് ‘മരിച്ചു’.
- source_word: לִפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽ
  rationale: ദൈവസന്നിധിയിലോ ദൈവത്തിന്റെ മുമ്പാകെയോ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ശീർഷകം പകരംവയ്ക്കാതെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: בְּהַקְרִבָם
  choice: അർപ്പിച്ചപ്പോൾ
  rationale: קרב എന്ന ബലിആരാധനാസന്ദർഭത്തിലെ ക്രിയയും בְ ചേർന്ന കാലസാഹചര്യവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֵשׁ זָרָה
  choice: അന്യമായ തീ
  rationale: זרה എന്ന പദത്തിന്റെ ‘അന്യമായ/അപരിചിതമായ’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തുന്നു; ‘അനധികൃതം’ എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: בְּמִדְבַּר סִינַי
  choice: സീനായി മരുഭൂമിയിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ നിർദേശം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: അവർക്ക് പുത്രന്മാർ ഉണ്ടായിരുന്നില്ല
  rationale: പുരോഹിതപിന്തുടർച്ചയുടെ സന്ദർഭത്തിൽ בנים എന്നതിന്റെ പ്രത്യേകമായ ‘പുത്രന്മാർ’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: וַיְכַהֵן
  choice: പുരോഹിതന്മാരായി ശുശ്രൂഷിച്ചു
  rationale: כהן എന്ന ക്രിയയുടെ പുരോഹിതധർമ്മം നിർവഹിക്കുക എന്ന പ്രവർത്തനാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: അവരുടെ പിതാവായ അഹരോന്റെ സന്നിധിയിൽ
  rationale: പ്രയോഗത്തിലെ സാന്നിധ്യഭാവം നിലനിർത്തുകയും അത് കാലപരമായോ അധികാരപരമായോ മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമമായ ചതുർവ്യഞ്ജനം നേരിട്ട് ഉള്ളതിനാൽ ഒരു സ്ഥാനപ്പേര്/ശീർഷകം ഉപയോഗിക്കാതെ മലയാളത്തിലെ പരിചിതമായ ദൈവനാമരൂപം നിലനിർത്തുന്നു.
- issue: אֵשׁ זָרָה എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: അന്യമായ തീ
  alternative: അനധികൃതമായ തീ
  rationale: മൂലപദത്തിന്റെ തുറന്ന അർഥവ്യാപ്തി പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ആരാധനാനിയമപ്രകാരം അനുവദിക്കാത്ത തീയാകാമെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: עַל־פְּנֵי എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അഹരോന്റെ സന്നിധിയിൽ
  alternative: അഹരോന്റെ ജീവിതകാലത്ത്
  rationale: സ്ഥലപരമായ സാന്നിധ്യവും സമകാലികതയും ഉൾക്കൊള്ളാവുന്ന എബ്രായപ്രയോഗത്തെ ഒരേയൊരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യഘടന മൂലപാഠത്തിന്റെ സംഭവക്രമം പിന്തുടരുന്നു; അവ്യക്തമായ ആരാധനാപദവും അവസാനത്തെ സാന്നിധ്യപ്രയോഗവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
