  to: ഗേർശോന്റെ വംശത്തിൽ ലിബ്ന്യരുടെ കുലവും ശിമെയ്യരുടെ കുലവും ഉൾപ്പെടുന്നു; ഇവ ഗേർശോന്യരുടെ കുലങ്ങളാണ്.
