  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: לְ/גֵ֣רְשׁ֔וֹן מִשְׁפַּ֨חַת֙ הַ/לִּבְנִ֔י וּ/מִשְׁפַּ֖חַת הַ/שִּׁמְעִ֑י אֵ֣לֶּה הֵ֔ם מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: ml
  text: ഗേർശോന്റെ വംശത്തിൽ ലിബ്ന്യരുടെ കുലവും ശിമെയ്യരുടെ കുലവും ഉൾപ്പെടുന്നു; ഇവ ഗേർശോന്യരുടെ കുലങ്ങളാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: ഗേർശോനിൽ ... ഉൾപ്പെട്ടു
  rationale: ഈ വംശാവലി പട്ടികയിൽ לְ ബന്ധമോ ഉൾപ്പെടലോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗേർശോനിൽ ... ഉൾപ്പെട്ടു’ എന്ന പ്രയോഗം ആ കുലങ്ങൾ ഗേർശോൻ ശാഖയിൽപ്പെട്ടവയാണെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: കുലം / കുലങ്ങൾ
  rationale: ജനസംഖ്യാ-വംശാവലി പശ്ചാത്തലത്തിൽ מִשְׁפָּחָה ഒരു ഗോത്രത്തിനകത്തെ വിശാല ബന്ധുസമൂഹമാണ്. ‘കുടുംബം’ എന്നത് ആധുനിക മലയാളത്തിൽ വളരെ ചുരുങ്ങിയ ഘടകമായി തോന്നാം; ‘ഗോത്രം’ അതിലധികം വലുതാണ്. അതിനാൽ ‘കുലം’ യോജിക്കുന്നു.
- source_word: הַלִּבְנִי
  choice: ലിബ്ന്യർ
  rationale: ലിബ്നിയിൽനിന്നുള്ള വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന gentilic രൂപം. മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചന വംശനാമമായി ‘ലിബ്ന്യർ’ ഉപയോഗിച്ചു.
- source_word: הַשִּׁמְעִי
  choice: ശിമെയ്യർ
  rationale: ശിമെയിൽനിന്നുള്ള വംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന gentilic രൂപം. ശിമെയ് എന്ന പേരുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണ് ‘ശിമെയ്യർ’.
- source_word: אֵלֶּה הֵם
  choice: ഇവയാകുന്നു
  rationale: തിരിച്ചറിയൽ സൂത്രവാക്യത്തിന്റെ വർത്തമാനകാലവും പട്ടികാത്മക ഭാവവും നിലനിർത്തുന്ന മാന്യവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യർ
  rationale: ഗേർശോനിൽനിന്നുള്ള വിശാല ലേവ്യ വംശശാഖയെ സൂചിപ്പിക്കുന്ന gentilic രൂപം മലയാളത്തിൽ വംശനാമമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വംശാവലി പട്ടികയുടെ സംക്ഷിപ്തവും ഔപചാരികവുമായ ഭാവം നിലനിർത്തി. ‘കുലം’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ ഗോത്രത്തിനകത്തെ ബന്ധുസമൂഹമെന്ന സാമൂഹിക അളവും സൂക്ഷിക്കുന്നു.
