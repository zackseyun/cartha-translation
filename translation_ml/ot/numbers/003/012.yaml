id: NUM.3.12
reference: Numbers 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: ml
  text: ഞാനോ—ഇതാ, യിസ്രായേൽപുത്രന്മാരുടെ[a] ഇടയിൽനിന്ന് ലേവ്യരെ, യിസ്രായേൽപുത്രന്മാരിൽ ഗർഭപാത്രം തുറക്കുന്ന ഓരോ കടിഞ്ഞൂലിനും പകരമായി എടുത്തിരിക്കുന്നു; ലേവ്യർ എനിക്കുള്ളവരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യിസ്രായേല്യരുടെ.” എബ്രായപ്രയോഗം അക്ഷരാർഥത്തിൽ പുല്ലിംഗവും സൂത്രബദ്ധവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ഞാനോ
  rationale: സംയോജനത്തോടുകൂടിയ വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നലും സംസാരവിഷയത്തിലെ മാറ്റവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הִנֵּה
  choice: ഇതാ
  rationale: ദൈവിക പ്രഖ്യാപനത്തിലെ ശ്രദ്ധ ക്ഷണിക്കുന്നതും ഊന്നിപ്പറയുന്നതുമായ ഭാവം മാന്യവും പരിചിതവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: לָקַחְתִּי
  choice: എടുത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്കും ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലത്തിനും ഇടയിലുള്ള എബ്രായ perfect രൂപത്തിന്റെ പ്രസക്തി പ്രകടമാക്കുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം ഉപയോഗിക്കുന്നു; വാക്യത്തിലുടനീളം ഒരേപോലെ നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ
  choice: ഇടയിൽനിന്ന്
  rationale: ഒരു വലിയ സമൂഹത്തിനുള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽപുത്രന്മാർ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ പുല്ലിംഗ സൂത്രപ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ വ്യവഹാരസഹജമായ സമുദായനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: תַּחַת
  choice: പകരമായി
  rationale: ആരാധനാ-നിയമപരമായ ഈ സന്ദർഭത്തിലെ പ്രതിസ്ഥാപനബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: כָּל בְּכוֹר
  choice: ഓരോ കടിഞ്ഞൂലും
  rationale: വിതരണാർഥമുള്ള ‘എല്ലാ/ഓരോ ആദ്യജാതനും’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഓരോ കടിഞ്ഞൂൽ’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: פֶּטֶר רֶחֶם
  choice: ഗർഭപാത്രം തുറക്കുന്ന
  rationale: ഗർഭപാത്രത്തിൽനിന്ന് ആദ്യം പുറപ്പെടുന്ന സന്തതിയെ സൂചിപ്പിക്കുന്ന നിയമപരമായ എബ്രായപ്രയോഗത്തിന്റെ ദൃശ്യരൂപം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: וְהָיוּ לִי
  choice: എനിക്കുള്ളവരായിരിക്കും
  rationale: ദൈവത്തിനുള്ള അവകാശവും സമർപ്പിതമായ സ്വന്തബന്ധവും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുകയും ഭാവി/ഫലസൂചക ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: യിസ്രായേൽപുത്രന്മാർ
  alternative: യിസ്രായേല്യർ
  rationale: മൂലപാഠത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗവും സൂത്രബദ്ധവുമായ ഉടമ്പടി-പ്രയോഗം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; കൂടുതൽ സ്വാഭാവികമായ സമുദായനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וְהָיוּ לִי എന്നതിൽ ലേവ്യർക്കും ദൈവത്തിനുമിടയിലെ ബന്ധം
  choice: ലേവ്യർ എനിക്കുള്ളവരായിരിക്കും
  alternative: ലേവ്യർ എനിക്കു സ്വന്തമായിരിക്കും
  rationale: പിൽക്കാല ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ ദൈവത്തിന്റെ അവകാശവും സമർപ്പിതമായ സ്വന്തബന്ധവും നേരിട്ട് അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഇതാ,’ ‘കടിഞ്ഞൂൽ,’ ‘ലേവ്യർ’ എന്നിവ വാക്യത്തിന്റെ ഗൗരവവും നിയമ-ആരാധനാ പശ്ചാത്തലവും നിലനിർത്തുന്നു; വാക്യഘടന മൂലപാഠത്തിന്റെ ഊന്നലും പ്രതിസ്ഥാപനബന്ധവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
