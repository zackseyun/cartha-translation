  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: ml
  text: യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം മോശയും അഹരോനും അവരുടെ കുലങ്ങൾ അനുസരിച്ച് എണ്ണിയ ലേവ്യർ എല്ലാവരും—ഒരു മാസം പ്രായവും അതിൽ കൂടുതലുമുള്ള എല്ലാ ആൺകുട്ടികളും പുരുഷന്മാരും—ഇരുപത്തിരണ്ടായിരം ആയിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വെയുടെ വായനുസരിച്ച്”; അർഥം, “യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം.”'
    reason: lexical_alternative
  - marker: b
    text: “അഹരോൻ” എന്ന പേരിലെ അക്ഷരങ്ങൾക്കുമുകളിൽ എബ്രായ മസോറാ പാഠത്തിൽ അസാധാരണ പുള്ളികളുണ്ട്. അവ സാധാരണയായി ഈ വാക്കിനെക്കുറിച്ചുള്ള പുരാതന ലേഖകസംശയം സൂചിപ്പിക്കുന്നതായി കരുതപ്പെടുന്നു; എങ്കിലും പേര് പ്രധാന എബ്രായ പാഠത്തിൽ തന്നെയുണ്ട്.
    reason: textual_variant
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: എണ്ണിയ / ആകെ എണ്ണം
  rationale: ഇവിടെ פקד എന്ന പദകുടുംബം ജനസംഖ്യാകണക്കെടുപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്. സൈനികമായ അർഥച്ചായ ചേർക്കാതെ ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: עַל־פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’ എന്നാണെങ്കിലും, ദൈവിക കൽപ്പനയെയോ അധികാരപ്പെടുത്തലിനെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണിത്.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം പദവിയായി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങൾ തിരിച്ച്
  rationale: ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ מִשְׁפָּחָה ആധുനിക അണുകുടുംബത്തെക്കാൾ വിശാലമായ ബന്ധുത്വവിഭാഗമാണ്; ‘കുലം’ അത് കൂടുതൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: כָּל זָכָר
  choice: ആണായ എല്ലാവരും
  rationale: ശിശുക്കൾ മുതൽ പ്രായമുള്ളവർവരെ ഉൾപ്പെടുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നു മാത്രം പറയുന്നത് ഒഴിവാക്കി, ലിംഗസൂചനയും പ്രായപരിധിയുടെ വ്യാപ്തിയും നിലനിർത്തി.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: ഒരു മാസം പ്രായംമുതലുള്ള
  rationale: പ്രായത്തിന്റെ താഴ്ന്ന പരിധി വ്യക്തമാക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: ഇരുപത്തിരണ്ടായിരം
  rationale: മൂലപാഠത്തിലെ സംഖ്യ നേരിട്ട് വാക്കുകളിൽ നൽകി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ സവിശേഷനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം അത് ലിപ്യന്തരിച്ചു.
- issue: അഹരോന്റെ പേരിനുമുകളിലെ മസോറാ പുള്ളികൾ
  choice: പ്രധാനപാഠത്തിൽ ‘മോശയും അഹരോനും’ നിലനിർത്തി, പാഠസംബന്ധിയായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ അറിയിച്ചു
  alternative: ‘മോശ’ എന്നു മാത്രം വായിക്കുക
  rationale: ലഭ്യമായ മസോറാ വ്യഞ്ജനപാഠത്തിൽ അഹരോന്റെ പേര് ഉൾപ്പെട്ടിരിക്കുന്നു; അസാധാരണ പുള്ളികൾ അതിനെക്കുറിച്ചുള്ള പുരാതന ലേഖകസംശയം സൂചിപ്പിക്കാമെങ്കിലും പേര് മായ്ച്ചുകളയാൻ അവ മാത്രം മതിയാകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ജനസംഖ്യാകണക്കെടുപ്പ് വ്യക്തമായി അറിയിക്കാൻ ‘കുലങ്ങൾ തിരിച്ച് എണ്ണിയ’ എന്നും ‘ആകെ എണ്ണം’ എന്നും ഉപയോഗിച്ചു. ഒരു മാസം പ്രായമുള്ള ശിശുക്കളെയും ഉൾക്കൊള്ളുന്നതിനാൽ പ്രായപൂർത്തിയായവരെ മാത്രം സൂചിപ്പിക്കാവുന്ന ‘പുരുഷന്മാർ’ ഒഴിവാക്കി.
