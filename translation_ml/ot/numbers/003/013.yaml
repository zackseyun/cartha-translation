id: NUM.3.13
reference: Numbers 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: ml
  text: എന്തെന്നാൽ, എല്ലാ കടിഞ്ഞൂലുകളും എനിക്കുള്ളതാണ്[a]. ഈജിപ്ത് ദേശത്തിലെ എല്ലാ കടിഞ്ഞൂലുകളെയും ഞാൻ സംഹരിച്ച ദിവസം, ഇസ്രായേലിൽ മനുഷ്യർ മുതൽ മൃഗങ്ങൾ വരെ എല്ലാ കടിഞ്ഞൂലുകളെയും ഞാൻ എനിക്കായി വിശുദ്ധീകരിച്ചു[b]. അവ എനിക്കുള്ളതായിരിക്കും. ഞാൻ യഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ ‘എനിക്ക്’ എന്ന പ്രയോഗമാണ്; ‘എനിക്കുള്ളതാണ് / എനിക്കായി / എനിക്കുള്ളതായിരിക്കും’ എന്ന ആശയം ഈ വാക്യത്തിൽ മൂന്നു പ്രാവശ്യം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘മനുഷ്യൻ മുതൽ മൃഗം വരെ’; മനുഷ്യരെയും മൃഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സ്ഥിരപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ലേവ്യരെ സംബന്ധിച്ച പ്രസ്താവനയുടെ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: לִי
  choice: എനിക്കുള്ളതാണ് / എനിക്കായി / എനിക്കുള്ളതായിരിക്കും
  rationale: ദൈവിക ഉടമസ്ഥത ഊന്നിപ്പറയുന്ന എബ്രായപ്രയോഗം മൂന്നു സ്ഥാനങ്ങളിലും വ്യത്യസ്തമായ സ്വാഭാവിക രൂപങ്ങളിലൂടെ ആവർത്തിക്കുന്നു.
- source_word: כָּל בְּכוֹר
  choice: എല്ലാ കടിഞ്ഞൂലും
  rationale: പുരുഷലിംഗം മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർക്കാതെ, മനുഷ്യരുടെയും മൃഗങ്ങളുടെയും ആദ്യസന്തതിയെ ഉൾക്കൊള്ളുന്ന മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: בְּיוֹם
  choice: ദിവസം
  rationale: ചരിത്രസംഭവത്തോടു വിശുദ്ധീകരണത്തെ ബന്ധിപ്പിക്കുന്ന വ്യക്തമായ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: הַכֹּתִי
  choice: ഞാൻ സംഹരിച്ച
  rationale: ഈജിപ്തിലെ കടിഞ്ഞൂലുകളുടെ മരണത്തെ സൂചിപ്പിക്കുന്ന נכה എന്ന ക്രിയയുടെ മാരകഫലം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ഈജിപ്തുദേശത്തിലെ
  rationale: മൂലപാഠത്തിലെ ‘ഈജിപ്തുദേശം’ എന്ന പൂർണ ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: הִקְדַּשְׁתִּי
  choice: ഞാൻ എനിക്കായി വിശുദ്ധീകരിച്ചു
  rationale: ദൈവത്തിനായി വിശുദ്ധമായി വേർതിരിക്കുക എന്ന ഹിഫീൽ ക്രിയയുടെ ആരാധനാപരവും ഉടമസ്ഥതാപരവുമായ അർഥങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിലെ
  rationale: കടിഞ്ഞൂലുകളുടെ വിശുദ്ധീകരണം ബാധകമായ സമൂഹത്തെ സംക്ഷിപ്തമായും വിശ്വസ്തമായും വ്യക്തമാക്കുന്നു.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: മനുഷ്യൻമുതൽ മൃഗംവരെ
  rationale: മനുഷ്യരെയും മൃഗങ്ങളെയും മുഴുവനായി ഉൾക്കൊള്ളുന്ന എബ്രായ ദ്വന്ദ്വപ്രയോഗം ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיוּ
  choice: അവയെല്ലാം എനിക്കുള്ളതായിരിക്കും
  rationale: തുടർന്നുനിൽക്കുന്ന ദൈവിക അവകാശവാദം ഭാവികാല പ്രഖ്യാപനമായി അവതരിപ്പിക്കുന്നു; മനുഷ്യരും മൃഗങ്ങളും ഉൾപ്പെടുന്നതിനാൽ നിഷ്പക്ഷമായ സർവനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹ്‌വേ ആകുന്നു
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമവും വാക്യത്തിന്റെ അധികാരപൂർണമായ സമാപനസൂത്രവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി പ്രതിനിധീകരിക്കുന്നു.
- issue: മനുഷ്യനും മൃഗവും ഉൾപ്പെടുന്ന מֵאָדָם עַד בְּהֵמָה എന്ന പ്രയോഗം
  choice: മനുഷ്യൻമുതൽ മൃഗംവരെ
  alternative: മനുഷ്യർ മുതൽ കന്നുകാലികൾ വരെ
  rationale: אָדָם എന്ന കൂട്ടായ ഏകവചനത്തെയും בְּהֵמָה എന്ന വിശാല മൃഗവിഭാഗത്തെയും അനാവശ്യമായി ചുരുക്കാതെ, ഇരുവിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന പരിധി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘കടിഞ്ഞൂൽ’, ‘വിശുദ്ധീകരിച്ചു’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിലെ കൃത്യത നിലനിർത്തുമ്പോഴും വാക്യഘടന ലളിതമാക്കിയിരിക്കുന്നു.
