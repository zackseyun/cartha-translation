id: NUM.3.27
reference: Numbers 3:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: ml
  text: 'കെഹാത്തിനുള്ള കുലങ്ങൾ: അമ്രാമ്യരുടെ കുലവും യിസ്ഹാര്യരുടെ കുലവും ഹെബ്രോന്യരുടെ കുലവും ഉസ്സീയേല്യരുടെ കുലവും. ഇവയാണ് കെഹാത്ത്യരുടെ കുലങ്ങൾ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: കെഹാത്തിൽനിന്ന്
  rationale: ലാമെദ് ഉപസർഗം ഇവിടെ കെഹാത്തുമായി ബന്ധപ്പെട്ട വംശവിഭാഗങ്ങളെ അവതരിപ്പിക്കുന്നു. പട്ടികയുടെ വംശാവലിസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘കെഹാത്തിൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: מִשְׁפַּחַת
  choice: കുലം
  rationale: ജനസംഖ്യാ-വംശാവലി സന്ദർഭത്തിൽ ഈ പദം ഒരു വലിയ ഗോത്രത്തിനുള്ളിലെ ബന്ധുവംശവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥത്തിന് സാധാരണ മലയാളത്തിൽ ‘കുലം’ യോജിക്കുന്നു.
- source_word: הַֽ/עַמְרָמִי
  choice: അമ്രാമ്യർ
  rationale: അമ്രാമിന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്ന വംശനാമരൂപം മലയാളത്തിൽ ‘അമ്രാമ്യർ’ എന്നു നൽകി.
- source_word: הַ/יִּצְהָרִי
  choice: യിസ്ഹാര്യർ
  rationale: യിസ്ഹാറിന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്ന വംശനാമം; എബ്രായ നാമരൂപത്തോട് ചേർന്ന മലയാളലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: הַֽ/חֶבְרֹנִי
  choice: ഹെബ്രോന്യർ
  rationale: ഹെബ്രോന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്ന വംശനാമം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനരൂപത്തിൽ നൽകി.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: ഉസ്സീയേല്യർ
  rationale: ഉസ്സീയേലിന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്ന വംശനാമം; മൂലത്തിലെ ഇരട്ട വ്യഞ്ജനധ്വനിയും ദീർഘസ്വരവും കഴിയുന്നത്ര നിലനിർത്തി.
- source_word: אֵלֶּה הֵם
  choice: ഇവയാണ്
  rationale: സൂചകസർവനാമവും തിരിച്ചറിയൽപ്രസ്താവനയും ചേർന്ന രൂപം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: കെഹാത്ത്യരുടെ കുലങ്ങൾ
  rationale: മുമ്പ് പറഞ്ഞ ഉപവിഭാഗങ്ങളെ കെഹാത്തിന്റെ സന്തതികളായ സമൂഹത്തിന്റെ കുലങ്ങളായി സംഗ്രഹിക്കുന്ന പ്രയോഗം.
