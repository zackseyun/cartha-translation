translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പേരുകളുടെ ലിപ്യന്തരണത്തിൽ എബ്രായരൂപത്തോടുള്ള അടുപ്പവും മലയാളത്തിലെ വായനാസൗകര്യവും സമതുലിതമാക്കി; പട്ടികയുടെ ആവർത്തനഘടന നിലനിർത്തി.
