base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: ml
  text: ഗേർശോന്യരുടെ കുലങ്ങൾ തിരുനിവാസത്തിന്റെ പിന്നിൽ, പടിഞ്ഞാറോട്ട്[a], പാളയമടിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘കടലിന്റെ ദിശയിലേക്ക്’; ബൈബിൾ ഹീബ്രുവിൽ ഇത് ‘പടിഞ്ഞാറോട്ട്’ എന്നതിനുള്ള പതിവുശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: കുലങ്ങൾ
  rationale: സംഖ്യയിലെ ഗോത്ര-ജനസംഖ്യാ പശ്ചാത്തലത്തിൽ വലിയൊരു ഗോത്രത്തിന്റെയോ ലേവ്യവിഭാഗത്തിന്റെയോ വംശബന്ധമുള്ള ഉപവിഭാഗങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആ കൂട്ടായ വംശപരമായ അർഥം ‘കുലങ്ങൾ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַגֵּרְשֻׁנִּי
  choice: ഗേർശോന്യരുടെ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന ജാതിനാമം ഇവിടെ ഗേർശോനിൽനിന്നുള്ള സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘ഗേർശോന്യരുടെ’ എന്ന രൂപം തുടർന്നുള്ള ‘കുലങ്ങൾ’ എന്നതിനോട് സ്വാഭാവികമായി ചേരുന്നു.
- source_word: אַחֲרֵי
  choice: പിന്നിൽ
  rationale: ഇവിടെ പദം കാലക്രമമല്ല, പാളയത്തിലെ സ്ഥലബന്ധമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ഈ സന്ദർഭത്തിൽ പദം വിശുദ്ധ കൂടാര-ആലയത്തെ സൂചിപ്പിക്കുന്നു; ‘തിരുനിവാസം’ അതിന്റെ ദൈവസാന്നിധ്യവുമായി ബന്ധപ്പെട്ട നിവാസാർഥവും വിശുദ്ധ സ്വഭാവവും സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: יַחֲנוּ
  choice: പാളയമടിക്കണം
  rationale: അപൂർണക്രിയ ഇവിടെ ഇസ്രായേൽ പാളയത്തിന്റെ നിർദേശിക്കപ്പെട്ട ക്രമീകരണം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പാളയമടിക്കണം’ നിർദേശാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָמָּה
  choice: പടിഞ്ഞാറുവശത്ത്
  rationale: ‘കടലിലേക്കു’ എന്ന അക്ഷരാർഥമുള്ള ദിശാരൂപം ബൈബിൾ ഹീബ്രുവിൽ പതിവായി പടിഞ്ഞാറിനെ സൂചിപ്പിക്കുന്നു; പാളയസ്ഥാനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പടിഞ്ഞാറുവശത്ത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
