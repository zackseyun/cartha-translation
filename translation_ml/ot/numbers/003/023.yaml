  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വംശപരമായ കൂട്ടങ്ങളെ ‘കുലങ്ങൾ’ എന്നും വിശുദ്ധ കൂടാരത്തെ ‘തിരുനിവാസം’ എന്നും അവതരിപ്പിച്ചു; മൂലത്തിലെ സ്ഥാനക്രമവും നിർദേശാത്മക ഭാവവും നിലനിർത്തി.
