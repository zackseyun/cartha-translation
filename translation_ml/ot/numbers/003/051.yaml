reference: Numbers 3:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: ml
  text: യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം മോശെ വീണ്ടെടുപ്പിനുള്ള പണം[a] അഹരോനും അവന്റെ പുത്രന്മാർക്കും കൊടുത്തു; യഹ്‌വെ മോശെയോടു കൽപ്പിച്ചതുപോലെതന്നെ അവൻ അങ്ങനെ ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ, പദശഃ: ‘വീണ്ടെടുക്കപ്പെട്ടവരുടെ വെള്ളി’; അതായത്, വീണ്ടെടുപ്പിനായി ശേഖരിച്ച തുക.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: കൊടുത്തു
  rationale: נתן എന്ന ക്രിയയുടെ ആഖ്യാനരൂപത്തിന് സന്ദർഭത്തിൽ സ്വാഭാവികമായ ഭൂതകാലപ്രയോഗം.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: വീണ്ടെടുപ്പിനുള്ള പണം
  rationale: പദശഃ ‘വീണ്ടെടുക്കപ്പെട്ടവരുടെ വെള്ളി’ എന്നാണെങ്കിലും, മുൻസന്ദർഭത്തിൽ വീണ്ടെടുപ്പിനായി ശേഖരിച്ച തുകയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന לְ എന്ന മുൻപ്രത്യയത്തിന്റെ സ്വീകർത്തൃബന്ധവും ‘പുത്രന്മാർ’ അഹരോന്റെ പുത്രന്മാരാണെന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: עַל פִּי יְהוָה
  choice: യഹ്‌വെയുടെ കൽപ്പനപ്രകാരം
  rationale: പദശഃ ‘യഹ്‌വെയുടെ വായനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗം അധികാരപൂർവമായ ദൈവകൽപ്പനയെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: യഹ്‌വെ മോശെയോടു കൽപ്പിച്ചതുപോലെതന്നെ
  rationale: כַּאֲשֶׁר സൂചിപ്പിക്കുന്ന കൃത്യമായ അനുരൂപത ‘പോലെതന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു ബിരുദംകൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നത് പാഠസാക്ഷ്യത്തോട് നേരിട്ടുള്ള വിശ്വസ്തത പുലർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, dignified ആയ മലയാളം; നിയമപരവും ആരാധനാസംബന്ധവുമായ ‘വീണ്ടെടുപ്പ്’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന ഉപയോഗിച്ചു.
