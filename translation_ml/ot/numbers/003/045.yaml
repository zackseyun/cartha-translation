id: NUM.3.45
reference: Numbers 3:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: ml
  text: ഇസ്രായേൽപുത്രന്മാരുടെ ഇടയിലുള്ള ഓരോ കടിഞ്ഞൂലിനും പകരം ലേവ്യരെയും, ഇസ്രായേൽപുത്രന്മാരുടെ കന്നുകാലികൾക്കു പകരം ലേവ്യരുടെ കന്നുകാലികളെയും എടുക്കുക. ലേവ്യർ എനിക്കുള്ളവരായിരിക്കും. ഞാൻ യാഹ്‌വേ ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: എടുക്കുക
  rationale: לקח എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം. ഇവിടെ ലേവ്യരെ പകരക്കാരായി വേർതിരിച്ചെടുക്കാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്; ‘എടുക്കുക’ സ്വാഭാവികവും മൂലത്തോട് അടുത്തതുമാണ്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യർ
  rationale: ഗോത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം; വാക്യത്തിലുടനീളം ഏകീകൃതമായി ഉപയോഗിച്ചു.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഇവിടെ സ്ഥലപരമായ ‘കീഴിൽ’ എന്ന അർഥമല്ല, പ്രതിസ്ഥാപനമാണ് സൂചിപ്പിക്കുന്നത്. ‘പകരം’ ആ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: כָּל בְּכוֹר
  choice: ഓരോ കടിഞ്ഞൂൽ
  rationale: ഏകവചനമായ בְּכוֹר-നോടുകൂടിയ כָּל-ന്റെ വിതരണാർഥം ‘ഓരോ’ നിലനിർത്തുന്നു. ‘കടിഞ്ഞൂൽ’ മനുഷ്യരിലെ ആദ്യം ജനിച്ച ആൺസന്തതിയെ ഈ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്ന പ്രചാരത്തിലുള്ള ബൈബിൾപദമാണ്.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽപുത്രന്മാരുടെ ഇടയിലെ
  rationale: בְּנֵי יִשְׂרָאֵל എന്ന എബ്രായപ്രയോഗത്തിന്റെ പുരുഷലിംഗസൂചനയും בְּ-യുടെ ഭാഗികമായ ‘ഇടയിൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ലേവ്യരുടെ കന്നുകാലികൾ
  rationale: בְּהֵמָה വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കന്നുകാലികൾ’ സ്വാഭാവികമായ സമാഹാരപദമാണ്.
- source_word: בְּהֶמְתָּם
  choice: അവരുടെ കന്നുകാലികൾ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയം ഇസ്രായേൽപുത്രന്മാരെ സൂചിപ്പിക്കുന്നു; സമാന്തരമായ പ്രതിസ്ഥാപനഘടന നിലനിർത്തുന്നു.
- source_word: וְהָיוּ לִי
  choice: എനിക്കുള്ളവരായിരിക്കണം
  rationale: ദൈവിക അവകാശവും ഉടമസ്ഥതയും പ്രകടമാക്കുന്നു. കല്പനയുടെ പശ്ചാത്തലത്തിലുള്ള നിർദ്ദേശാത്മക ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവ ആകുന്നു
  rationale: ദൈവത്തിന്റെ സ്വനാമമായ יהוה ശബ്ദാന്തരപ്പെടുത്തി; സമാപനത്തിലെ ദൈവിക സ്വപരിചയവും അധികാരസൂത്രവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവനാമമായ יְהוָה-യുടെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ചതുരക്ഷര ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അത് മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ശബ്ദാന്തരപ്പെടുത്തി; പദവിയായ ‘കർത്താവ്’ ഉപയോഗിച്ച് സ്വനാമത്തെ മറച്ചിട്ടില്ല.
- issue: ലേവ്യരുടെ പ്രതിസ്ഥാപനപരമായ സ്ഥാനം
  choice: ‘പകരം’ എന്ന പ്രത്യക്ഷമായ പ്രതിസ്ഥാപനഭാഷ
  alternative: പ്രതിനിധികളായി
  rationale: תַּחַת യഥാർഥ പ്രതിസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു. അതിന്റെ കർമ്മപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ മൂലത്തിലെ നേരിട്ടുള്ള ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. എബ്രായ സമാന്തരഘടന സംരക്ഷിച്ചെങ്കിലും വായനാസൗകര്യത്തിനായി ആദ്യ കല്പനയെ ഏകോപിപ്പിച്ചു. ഈ വാക്യത്തിന് അനിവാര്യമായ പാഠഭേദമോ വിശദീകരണ അടിക്കുറിപ്പോ ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
