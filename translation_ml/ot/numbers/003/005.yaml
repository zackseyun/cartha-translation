  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: ‘YHWH’; ‘യഹോവ’ എന്നും ലിപ്യന്തരം ചെയ്യപ്പെടുന്നു.'
    reason: ദൈവനാമത്തിന്റെ പകരമുള്ള പരമ്പരാഗത ലിപ്യന്തരണം അറിയിക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דָּבַר എന്ന ക്രിയ ദൈവിക പ്രസംഗം ആരംഭിക്കുന്ന പതിവു സൂത്രവാക്യമാണ്. മലയാളത്തിൽ ദൈവം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ് ‘അരുളിച്ചെയ്തു’.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ, മലയാളത്തിൽ ഉച്ചാരണസമീപമായ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ അടയാളപ്പെടുത്തുന്ന ഹീബ്രു പൂർവപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള സമാനം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്ന പ്രസംഗാരംഭത്തിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: തുടർന്നുവരുന്ന വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു അവ്യയക്രിയയാണ്. ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പദാനുപദ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമായതിനാൽ, ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് ഉള്ളതിനാൽ അതിനെ ഒരു പദവിയായി മാറ്റാതെ ലിപ്യന്തരിച്ചു. കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലാത്തതിനാൽ പകരമുള്ള പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ദൈവിക പ്രസംഗാരംഭം. അടുത്ത വാക്യത്തിൽ പ്രസംഗത്തിന്റെ ഉള്ളടക്കം വരുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു; അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
