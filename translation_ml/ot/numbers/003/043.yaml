  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: ml
  text: ഒരു മാസം പ്രായമുള്ളവരും അതിൽ കൂടുതലുള്ളവരുമായ എല്ലാ കടിഞ്ഞൂൽ ആൺകുട്ടികളെയും പേരുപ്രകാരം രേഖപ്പെടുത്തി എണ്ണിയപ്പോൾ[a], അവരുടെ രജിസ്ട്രേഷൻ കണക്കനുസരിച്ച്[b] ആകെ ഇരുപത്തിരണ്ടായിരത്തി മുന്നൂറ്റെഴുപത്തിമൂന്ന് പേരുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പേരുകളുടെ എണ്ണമനുസരിച്ച്.” ഓരോരുത്തരെയും പേരനുസരിച്ച് രജിസ്റ്റർ ചെയ്ത് എണ്ണിയെന്ന ജനസംഖ്യാകണക്കിലെ പ്രയോഗമാണിത്.
    reason: cultural_note
  - marker: b
    text: “അവരുടെ രജിസ്ട്രേഷൻപ്രകാരം” എന്നും പരിഭാഷപ്പെടുത്താം. കൂട്ടത്തെ ഔദ്യോഗികമായി എണ്ണിയതിനെയാണ് ഹീബ്രു പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ആകെ ... പേരുണ്ടായിരുന്നു
  rationale: ജനസംഖ്യാകണക്കിന്റെ ഫലം അവതരിപ്പിക്കുന്ന ഹീബ്രു ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ അസ്തിത്വപ്രയോഗമായി നൽകി.
- source_word: כָל בְּכוֹר זָכָר
  choice: എല്ലാ കടിഞ്ഞൂൽ ആൺകുട്ടികളെയും
  rationale: ജനനക്രമവും പുരുഷലിംഗവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘കടിഞ്ഞൂൽ’ ആധുനിക മലയാള ബൈബിൾഭാഷയിൽ ഗ്രഹിക്കാവുന്ന പദമാണ്.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: പേരുപേരായി എണ്ണി
  rationale: ഓരോരുത്തരെയും പേരനുസരിച്ച് രജിസ്റ്റർ ചെയ്ത് എണ്ണിയെന്ന ജനസംഖ്യാകണക്കിലെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ഒരു മാസം പ്രായമുള്ളവരും അതിനു മുകളിലുള്ളവരുമായ
  rationale: ഉൾപ്പെടുന്ന കുറഞ്ഞ പ്രായപരിധിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: לִפְקֻדֵיהֶם
  choice: അവരുടെ ഔദ്യോഗിക കണക്കുപ്രകാരം
  rationale: פקד എന്ന ധാതുവിന്റെ ഔദ്യോഗിക എണ്ണൽ/രജിസ്ട്രേഷൻ എന്ന ജനസംഖ്യാകണക്കിലെ അർഥം നിലനിർത്തുന്നു; വെറും സംഖ്യയുടെ ആവർത്തനമായി ചുരുക്കുന്നില്ല.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: ഇരുപത്തിരണ്ടായിരത്തി മുന്നൂറ്റെഴുപത്തിമൂന്ന്
  rationale: 'ഹീബ്രു സംഖ്യാക്രമത്തെ സാധാരണ മലയാള സംഖ്യാരീതിയിൽ കൃത്യമായി നൽകുന്നു: 22,373.'
