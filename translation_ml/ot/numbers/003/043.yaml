  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് വ്യക്തമായും മാന്യമായും രൂപപ്പെടുത്തി. ഹീബ്രുവിലെ രണ്ട് ജനസംഖ്യാകണക്ക് പ്രയോഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പുകളിലും സൂക്ഷിച്ചു; വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനനുസരിച്ച് പുനഃക്രമീകരിച്ചു.
