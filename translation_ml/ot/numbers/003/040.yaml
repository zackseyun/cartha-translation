id: NUM.3.40
reference: Numbers 3:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹോവ മോശയോടു പറഞ്ഞു: “ഇസ്രായേൽമക്കളിൽ ഒരു മാസം പ്രായവും അതിലധികവുമുള്ള എല്ലാ കടിഞ്ഞൂൽ ആൺമക്കളെയും എണ്ണുക; അവരുടെ പേരനുസരിച്ചുള്ള എണ്ണം കണക്കാക്കുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ YHWH-ന്റെ മലയാളത്തിൽ സ്ഥാപിതവും തിരിച്ചറിയാവുന്നതുമായ ലിപ്യന്തരണം.
- source_word: וַיֹּאמֶר
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ആ ക്രമാർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: פְּקֹד
  choice: എണ്ണുക
  rationale: ഈ ജനസംഖ്യാകണക്കെടുപ്പ് സന്ദർഭത്തിൽ കല്പനയുടെ അർഥം ആളുകളെ എണ്ണുക എന്നതാണ്.
- source_word: כָּל בְּכֹר זָכָר
  choice: എല്ലാ കടിഞ്ഞൂൽ ആൺകുട്ടികളെയും
  rationale: בכור ആദ്യജാതനെ സൂചിപ്പിക്കുകയും זכר പുരുഷലിംഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി രണ്ടും നിലനിർത്തുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗവും കൂട്ടത്തിനുള്ളിൽ നടത്തുന്ന കണക്കെടുപ്പിന്റെ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ഒരു മാസം പ്രായവും അതിലധികവുമുള്ള
  rationale: കണക്കെടുപ്പിന്റെ കുറഞ്ഞ പ്രായപരിധി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: അവരുടെ പേരുകൾ ഒന്നൊന്നായി രേഖപ്പെടുത്തി ആകെ എണ്ണം എടുക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെ പേരുകളുടെ എണ്ണം എടുക്കുക’ എന്ന പ്രയോഗം പേരനുസരിച്ചുള്ള കണക്കെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യഭാഷയിൽ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കടിഞ്ഞൂൽ’ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദമായിരിക്കുമ്പോഴും ‘ആൺകുട്ടികൾ’ ചേർത്ത് ലിംഗസൂചന വ്യക്തമാക്കിയിരിക്കുന്നു. പേരനുസരിച്ചുള്ള കണക്കെടുപ്പ് പ്രധാനവാചകത്തിൽ വ്യക്തമായി നൽകിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
