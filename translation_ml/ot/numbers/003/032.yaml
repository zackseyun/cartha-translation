source:
  edition: WLC
  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: ml
  text: ലേവ്യരുടെ പ്രമാണിമാരുടെ മേൽപ്രമാണി പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാർ ആയിരുന്നു. വിശുദ്ധസ്ഥലത്തിന്റെ കാവൽച്ചുമതല വഹിച്ചിരുന്നവരുടെ മേൽനോട്ടം അവനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധവസ്തുക്കളുടെ.” ഹീബ്രു പദമായ הַקֹּדֶשׁ വിശുദ്ധസ്ഥലത്തെയോ അതുമായി ബന്ധപ്പെട്ട വിശുദ്ധവസ്തുക്കളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: ലേവ്യരുടെ പ്രമാണിമാർക്കെല്ലാം മേൽപ്രമാണി
  rationale: ആവർത്തിച്ചുള്ള נָשִׂיא പദങ്ങൾ പദവിക്രമം സൂചിപ്പിക്കുന്നു. രാജകീയ അർത്ഥം വരുത്താതെ ഭരണപരമായ മേൽനില വ്യക്തമാക്കാൻ ‘പ്രമാണി/മേൽപ്രമാണി’ ഉപയോഗിച്ചു; മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ബന്ധകമായ ‘ഉം/പിന്നെ’ നിർബന്ധമല്ലാത്തതിനാൽ സ്വാഭാവിക പ്രവാഹത്തിനായി പ്രത്യേകം വിവർത്തനം ചെയ്തില്ല.
- source_word: אֶלְעָזָר בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാർ
  rationale: הַכֹּהֵן അടുത്തുള്ള അഹരോനെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും പിതൃപുത്രബന്ധം നിലനിർത്തുകയും ചെയ്തു.
- source_word: פְּקֻדַּת
  choice: മേൽനോട്ടം അവനായിരുന്നു
  rationale: ഈ നാമപദം ഇവിടെ ഏല്പിക്കപ്പെട്ട മേൽനോട്ടമോ ഭരണച്ചുമതലയോ സൂചിപ്പിക്കുന്നു. എലെയാസാറിന്റെ മേൽനോട്ടാധികാരം വ്യക്തമായി പറയുന്ന സ്വാഭാവിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: ചുമതല വഹിച്ചിരുന്നവർ
  rationale: ‘കാക്കുക’ എന്ന ധാതുവും അതേ മൂലത്തിൽനിന്നുള്ള ‘ചുമതല/കാവൽ’ എന്ന നാമവും ചേർന്ന പ്രയോഗം ഏല്പിക്കപ്പെട്ട സംരക്ഷണ-സേവനച്ചുമതലയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ ഭരണപരവും ആരാധനാസംബന്ധവുമായ ഭാവം ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരം
  rationale: കൂടാരാരാധനയുടെ പശ്ചാത്തലത്തിൽ വിശുദ്ധസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രധാന അർത്ഥം സ്വീകരിച്ചു. എന്നാൽ ‘വിശുദ്ധവസ്തുക്കൾ’ എന്ന അർത്ഥവും ഹീബ്രുവിൽ സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ലേവ്യഗോത്രത്തിലെ കീഴ്പ്പദവികളുടെയും എലെയാസാറിന്റെ മേൽനോട്ടത്തിന്റെയും വ്യത്യാസം വ്യക്തമാക്കാൻ ‘പ്രമാണി/മേൽപ്രമാണി’ എന്ന പദജോടി ഉപയോഗിച്ചു.
