source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/011.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വേ മോശെയോടു പറഞ്ഞു:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: “യഹ്‌വേ മോശെയോടു സംസാരിച്ചു, ഇങ്ങനെ പറഞ്ഞ്.” ആദ്യത്തെ ബന്ധകപദം “അപ്പോൾ” എന്നതിനുപകരം “പിന്നെ” അഥവാ “കൂടാതെ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: വാവ്-തുടർച്ചയുടെ പരിഭാഷാവികല്പവും ലേഅമോർ (לֵאמֹר) അടുത്ത വാക്യത്തിലെ വചനത്തെ ആമുഖപ്പെടുത്തുന്നതും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. ദൈവം സംസാരിക്കുന്ന സന്ദർഭത്തിൽ דבר എന്നതിന്റെ ഗൗരവവും തുടർന്നുവരുന്ന വചനത്തിന്റെ ആമുഖസ്വഭാവവും ‘അരുളിച്ചെയ്തു’ വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരിച്ചു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: אֶל സൂചിപ്പിക്കുന്ന അഭിമുഖദിശ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യോടു’ എന്ന രൂപത്തിൽ നൽകി; מֹשֶׁה എന്ന പേരിന് പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: לֵאמֹר
  choice: അരുളിച്ചെയ്തു എന്നതിൽ ഉൾപ്പെടുത്തി
  rationale: ഹീബ്രുവിൽ തുടർന്നുള്ള നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ‘പറഞ്ഞുകൊണ്ട്/പറഞ്ഞത്’ എന്ന സൂത്രവാക്യമാണിത്. ‘അരുളിച്ചെയ്തു:’ എന്ന സ്വാഭാവിക മലയാളരൂപവും ദ്വിബിന്ദുവും അതേ പ്രവർത്തനം നിർവഹിക്കുന്നതിനാൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു പദവിയാക്കി മാറ്റാതെ, സാധാരണ പണ്ഡിതലിപ്യന്തരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. തുടർന്നുള്ള ദൈവവചനത്തിലേക്കുള്ള ആമുഖം സ്വാഭാവികമാക്കാൻ ‘അരുളിച്ചെയ്തു:’ ഉപയോഗിച്ചു; ദൈവനാമം ‘യഹ്‌വേ’ എന്നു നിലനിർത്തി.
