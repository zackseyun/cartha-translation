    rationale: ‘ഓരോരുത്തനും അഞ്ചു ശേക്കേൽ’ is less precise grammatically for an amount to be collected from/assigned to each individual. ‘ഓരോരുത്തർക്കും അഞ്ചു ശേക്കേൽ വീതം’ clearly expresses the distributive sense of חֲמֵשֶׁת חֲמֵשֶׁת ... לַגֻּלְגֹּלֶת.
