  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: ml
  text: ഓരോരുത്തർക്കും അഞ്ചു ശേക്കേൽ വീതം[a], വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽപ്രകാരം[b], നീ വാങ്ങണം; ഒരു ശേക്കേൽ ഇരുപത് ഗേരയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഓരോ തലയ്ക്കും അഞ്ചഞ്ചു ശേക്കേൽ.’'
    reason: lexical_alternative
  - marker: b
    text: അതായത്, വിശുദ്ധമന്ദിരത്തിൽ അംഗീകരിച്ചിരുന്ന തൂക്കമാനദണ്ഡപ്രകാരം; ഒരു ശേക്കേൽ ഇരുപത് ഗേരയ്ക്ക് തുല്യമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: നീ വാങ്ങണം
  rationale: നിർദേശസന്ദർഭത്തിലെ വാവ് ചേർന്ന ഖാൽ സമ്പൂർണക്രിയയ്ക്ക് ആജ്ഞാത്മകമായ ഭാവിയർഥമുണ്ട്; മലയാളത്തിൽ ‘വാങ്ങണം’ നിയമപരമായ നിർദേശം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: അഞ്ചു ശേക്കേൽ വീതം
  rationale: ‘അഞ്ച്’ എന്ന സംഖ്യയുടെ ആവർത്തനം വിതരണാർഥം സൂചിപ്പിക്കുന്നു; ‘വീതം’ അത് സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַגֻּלְגֹּלֶת
  choice: ഓരോരുത്തനും
  rationale: അക്ഷരാർഥത്തിൽ ‘തലയ്ക്ക്’ എന്നാണെങ്കിലും ഇവിടെ ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; അതിനാൽ വ്യക്തമായ ആധുനിക മലയാളം ഉപയോഗിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽത്തൂക്കപ്രകാരം
  rationale: ഈ പ്രയോഗം തൂക്കത്തിന്റെ ഔദ്യോഗിക വിശുദ്ധമന്ദിര മാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു; ‘ശേക്കേൽത്തൂക്കപ്രകാരം’ എന്നത് അതിനെ വേറൊരു നാണയമായി തെറ്റിദ്ധരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: תִּקָּח ... עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: ഒരു ശേക്കേൽ ഇരുപതു ഗേരയാണ്
  rationale: രൂപപരമായി ‘നീ വാങ്ങണം’ എന്ന ക്രിയ വീണ്ടും വന്നിട്ടുണ്ടെങ്കിലും വാക്യക്രമത്തിൽ ഇത് ശേക്കേലിന്റെ തൂക്കം വിശദീകരിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമീകരണവാക്യമായി നൽകി.
