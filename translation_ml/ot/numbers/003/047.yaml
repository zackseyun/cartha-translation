    rationale: ‘ഓരോ തലയ്ക്കും അഞ്ചഞ്ചു ശേക്കേൽ’ better reflects the repeated numeral and the literal ‘per head’ idiom than ‘തലയ്ക്ക് അഞ്ചു ശേക്കേൽ’.
