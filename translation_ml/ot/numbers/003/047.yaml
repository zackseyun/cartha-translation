  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ നിർദേശശൈലി. ‘ശേക്കേൽ’, ‘ഗേര’ എന്നീ പുരാതന അളവുപദങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; ‘വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽത്തൂക്കം’ എന്ന പ്രയോഗം മാനദണ്ഡാർഥം വ്യക്തമാക്കുന്നു.
