revisions:
- from: നീ ലേവ്യരെ എനിക്കായി എടുക്കണം—ഞാൻ യഹോവയാണ്—ഇസ്രായേൽമക്കളുടെ ഇടയിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരം; ലേവ്യരുടെ കന്നുകാലികളെ ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരവും എടുക്കണം.[a]
  to: നീ ലേവ്യരെ എനിക്കായി എടുക്കണം—ഞാൻ യാഹ്‌വെയാണ്—ഇസ്രായേൽമക്കളുടെ ഇടയിലുള്ള എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി; ലേവ്യരുടെ കന്നുകാലികളെ ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി എടുക്കണം.
