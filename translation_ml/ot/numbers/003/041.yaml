reference: Numbers 3:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: ml
  text: നീ ലേവ്യരെ എനിക്കായി എടുക്കണം—ഞാൻ യാഹ്‌വെയാണ്—ഇസ്രായേൽമക്കളുടെ ഇടയിലുള്ള എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി; ലേവ്യരുടെ കന്നുകാലികളെ ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരമായി എടുക്കണം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: നീ ... എടുക്കണം
  rationale: സംയോജകപ്രത്യയത്തോടുകൂടിയ ഖാൽ പൂർണക്രിയ ഇവിടെ മോശെയോടുള്ള നിർദേശമായി പ്രവർത്തിക്കുന്നു; ‘എടുക്കണം’ ആജ്ഞാത്മക ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: ലേവിയുടെ ഗോത്രവംശജരെ സൂചിപ്പിക്കുന്ന പതിവായ മലയാളരൂപം; നേരിട്ടുള്ള കർമവിഭക്തി ചേർത്തിരിക്കുന്നു.
- source_word: לִי
  choice: എനിക്കായി
  rationale: ഇവിടെ ദൈവത്തിനുള്ള ഉടമസ്ഥതയും സമർപ്പണവും സൂചിപ്പിക്കുന്നു; ‘എനിക്കായി’ ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: אֲנִי יְהוָה
  choice: ഞാൻ യഹോവയാണ്
  rationale: ദൈവത്തിന്റെ ഊന്നലുള്ള സ്വയംതിരിച്ചറിയൽ സൂത്രവാക്യം നേരിട്ടും ഗൗരവത്തോടെയും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: תַּחַת
  choice: പകരം
  rationale: ഈ എണ്ണലിന്റെയും വീണ്ടെടുപ്പിന്റെയും സന്ദർഭത്തിൽ പകരം നിൽക്കൽ അഥവാ പ്രതിസ്ഥാപനം സൂചിപ്പിക്കുന്നു.
- source_word: כָּל בְּכֹר
  choice: എല്ലാ കടിഞ്ഞൂലുകൾക്കും
  rationale: כָּל + ഏകവചന നാമത്തിന്റെ വിതരണാർഥം മലയാളത്തിൽ ‘എല്ലാ ...കൾക്കും’ എന്ന് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘കടിഞ്ഞൂൽ’ ആദ്യജാതനെ/ആദ്യജാത മൃഗത്തെ ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ പദമാണ്.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിലെ
  rationale: ഹീബ്രുവിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപം ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടത്തിന്റെ കുടുംബാത്മക രൂപകൽപ്പന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ലേവ്യരുടെ കന്നുകാലികളെ
  rationale: בְּהֵמָה ഇവിടെ വളർത്തുമൃഗങ്ങളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ‘കന്നുകാലികൾ’ സാധാരണ മലയാളത്തിൽ അനുയോജ്യമായ സമാഹാരപദമാണ്.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ കന്നുകാലികളിലെ എല്ലാ കടിഞ്ഞൂലുകൾക്കും
  rationale: ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ഇസ്രായേലിന്റെ കന്നുകാലികളിൽപ്പെട്ട ആദ്യജാത മൃഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ചതുർവ്യഞ്ജന ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. മലയാള ബൈബിൾ ഉപയോഗത്തിൽ വ്യാപകവും തിരിച്ചറിയാവുന്നതുമായ ‘യഹോവ’ സ്വീകരിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന വസ്തുത അംഗീകരിക്കുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: ഹീബ്രുവിലെ കുടുംബബന്ധമുള്ള ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപം അനാവശ്യമായ പുരുഷലിംഗപരിമിതിയില്ലാതെ മലയാളത്തിലെ പതിവായ ‘ഇസ്രായേൽമക്കൾ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- issue: ലേവ്യർ കടിഞ്ഞൂലുകൾക്കു പകരമാകുന്ന ബന്ധം
  choice: എല്ലാ കടിഞ്ഞൂലുകൾക്കും പകരം
  alternative: എല്ലാ കടിഞ്ഞൂലുകൾക്കു വേണ്ടി
  rationale: תַּחַת സൂചിപ്പിക്കുന്ന യഥാർഥ പ്രതിസ്ഥാപനബന്ധം നിലനിർത്തുന്നു; അതിനെ പൊതുവായ പ്രയോജനാർഥമോ സേവനാർഥമോ ആയി മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നിർദേശശൈലി. ഹീബ്രു വാക്യത്തിന്റെ രണ്ട് സമാന്തര പ്രതിസ്ഥാപനഘടകങ്ങളും സംരക്ഷിച്ചിരിക്കുന്നു. ദീർഘവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി അർധവിരാമവും ക്രിയയുടെ നിയന്ത്രിത ആവർത്തനവും ഉപയോഗിച്ചു.
