id: NUM.3.1
reference: Numbers 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: ml
  text: യഹ്‌വേ സീനായ് പർവതത്തിൽ മോശെയോടു സംസാരിച്ചു[c] സമയത്ത്[b], അഹരോന്റെയും മോശെയുടെയും തലമുറകൾ[a] ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഹരോന്റെയും മോശെയുടെയും സന്തതികൾ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പദത്തിന്റെ അക്ഷരാർഥം ‘തലമുറകൾ’ എന്നാണ്. ഒരു വംശപരമ്പരയെയോ അവരിൽനിന്ന് ഉത്ഭവിക്കുന്ന കാര്യങ്ങളെയോ പരിചയപ്പെടുത്താൻ പതിവായി ഉപയോഗിക്കുന്ന തലക്കെട്ടാണിത്.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിൽ അക്ഷരാർഥം ‘ആ ദിവസത്തിൽ’; ‘ആ സമയത്ത്’ അല്ലെങ്കിൽ ‘എപ്പോൾ’ എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘മോശെയോടു പറഞ്ഞു.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പുതിയ വിഭാഗം ആരംഭിക്കുന്ന എബ്രായ സൂചനാപ്രയോഗം നിലനിർത്തുന്നു; വാക്യത്തിന്റെ സ്വാഭാവിക മലയാളക്രമത്തിനായി കാലസൂചക ഉപവാക്യത്തിനു ശേഷം വെച്ചു.
- source_word: תּוֹלְדֹת
  choice: തലമുറകൾ
  rationale: വംശപരമ്പര, സന്തതികൾ, ഒരാളിൽനിന്ന് ഉത്ഭവിക്കുന്നത് എന്നിവ സൂചിപ്പിക്കാവുന്ന എബ്രായ തലക്കെട്ടിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘വംശാവലി’ അല്ലെങ്കിൽ ‘സന്തതികൾ’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: അഹരോന്റെയും മോശെയുടെയും
  rationale: തുടർന്നുള്ള പട്ടിക പ്രധാനമായും അഹരോന്റെ പുത്രന്മാരെക്കുറിച്ചാണെങ്കിലും മൂലപാഠത്തിൽ ഇരുവരുടെയും പേരുള്ളതിനാൽ രണ്ടും അതേപടി നിലനിർത്തുന്നു.
- source_word: בְּיוֹם
  choice: കാലത്ത്
  rationale: അക്ഷരാർഥമായ ‘ദിവസത്തിൽ’ എന്നതിനു പകരം ‘ആ സമയത്ത്/എപ്പോൾ’ എന്ന എബ്രായ കാലസൂചക പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള അർഥം നൽകുന്നു.
- source_word: דִּבֶּר אֶת־מֹשֶׁה
  choice: മോശെയോടു സംസാരിച്ച
  rationale: דבר + את എന്ന ഘടനയുടെ ‘മോശെയോടു/മോശെയുമായി സംസാരിച്ചു’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പറഞ്ഞു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ നാല് എബ്രായ അക്ഷരങ്ങളുടെ വ്യക്തിനാമസ്വഭാവം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം; ഒരു സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നില്ല.
- source_word: בְּהַר סִינָי
  choice: സീനായ് പർവതത്തിൽവെച്ച്
  rationale: സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവികൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: അഹരോനെയും മോശെയെയും ചേർത്തുള്ള תּוֹלְדֹת തലക്കെട്ടിന്റെ വ്യാപ്തി
  choice: ‘തലമുറകൾ’ എന്ന ഔപചാരികവും വിശാലവുമായ പദം നിലനിർത്തി
  alternative: സന്തതികൾ; വംശാവലി
  rationale: തുടർന്നുള്ള ഭാഗം അഹരോന്റെ പുത്രന്മാരിൽ കേന്ദ്രീകരിച്ചാലും തലക്കെട്ടിൽ മോശെയും ഉൾപ്പെടുന്നു. ‘സന്തതികൾ’ എന്നു പരിഭാഷപ്പെടുത്തി ഈ പാഠപരമായ സംഘർഷം നിശ്ശബ്ദമായി പരിഹരിക്കുന്നില്ല.
- issue: דִּבֶּר אֶת־מֹשֶׁה എന്ന പ്രയോഗത്തിന്റെ ബന്ധസൂചന
  choice: മോശെയോടു സംസാരിച്ച
  alternative: മോശെയോടു പറഞ്ഞ
  rationale: ‘സംസാരിച്ചത് മോശെയോടായിരുന്നു’ എന്ന അർഥം നൽകുമ്പോഴും ‘with/to’ എന്ന ചെറിയ അർഥവ്യത്യാസം മലയാളത്തിൽ അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തലമുറകൾ’ എന്ന പദം അല്പം ഔപചാരികമാണെങ്കിലും എബ്രായ തലക്കെട്ടിന്റെ ഉദ്ദേശ്യപൂർവമായ വിശാലത സംരക്ഷിക്കുന്നു. കാലസൂചക ഉപവാക്യം ആദ്യം വെച്ചത് മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായാണ്.
