  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ ശുശ്രൂഷ നിർവഹിക്കുന്നതിനായി, അവർ അവന്റെ ചുമതലയും സർവസഭയുടെ ചുമതലയും സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ കാത്തുപാലിക്കണം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചുമതല കാത്തുപാലിക്കുക’ എന്നതിന് ‘ചുമതല നിർവഹിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം; എബ്രായത്തിലെ ക്രിയ-നാമജോടി കാവൽ ഉത്തരവാദിത്വത്തെയും വിശ്വസ്തമായ അനുഷ്ഠാനത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട് അഹരോനോടും സർവസഭയോടും ചേർന്ന ചുമതലകൾ ലേവ്യർ നിർവഹിക്കണം.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ ... מִשְׁמַרְתּוֹ
  choice: അവർ അവന്റെ ചുമതല ... നിർവഹിച്ച്
  rationale: שׁמר എന്ന ക്രിയയും מִשְׁמֶרֶת എന്ന നാമവും ചേർന്ന പ്രയോഗം ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം കാത്തുപാലിക്കുകയും വിശ്വസ്തമായി നിർവഹിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ചുമതല നിർവഹിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: സർവസഭയുടെയും ചുമതല
  rationale: ആദ്യത്തെ מִשְׁמֶרֶת എന്ന പദവുമായി ഉള്ള സമാന്തരത നിലനിർത്താൻ രണ്ടിടത്തും ‘ചുമതല’ ഉപയോഗിച്ചു; כָּל־הָעֵדָה എന്നത് ഇസ്രായേൽ സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചനയായ ‘മുമ്പിൽ’ നിലനിർത്തുന്നു; אֹהֶל מוֹעֵד എന്നതിന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും പരിചിതവുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിച്ചു.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת
  choice: ശുശ്രൂഷ ചെയ്യണം
  rationale: עבד/עֲבֹדָה എന്ന ബന്ധപദങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ ഉദ്ദേശ്യത്തെ ‘ശുശ്രൂഷ ചെയ്യണം’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വാസസ്ഥലമായ വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ അതിന്റെ വാസസ്ഥലസങ്കൽപ്പം വ്യക്തമാക്കുകയും אֹהֶל מוֹעֵד എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: מִשְׁמַרְתּוֹ എന്നതിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയത്തിന്റെ സൂചന
  choice: ‘അവന്റെ’ എന്നത് അടുത്ത സന്ദർഭത്തിലെ അഹരോനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ഇത് പൊതുവായി പുരോഹിതചുമതലയെയോ വിശുദ്ധമന്ദിരവുമായി ബന്ധപ്പെട്ട ചുമതലയെയോ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം.
  rationale: സംഖ്യ 3-ലെ അടുത്ത സന്ദർഭത്തിൽ ലേവ്യരെ അഹരോനും പുത്രന്മാർക്കും ഏല്പിക്കുന്നതിനാൽ അഹരോനാണ് ഏറ്റവും സ്വാഭാവികമായ പൂർവപദം. എന്നാൽ പേര് ചേർത്ത് അവ്യക്തത പൂർണമായി നീക്കാതെ എബ്രായത്തിലെ സർവനാമരൂപം സംരക്ഷിച്ചു.
- issue: സർവസഭയുടെ ചുമതലയുടെ സ്വഭാവം
  choice: ‘സർവസഭയുടെയും ചുമതല’ എന്ന രൂപം നിലനിർത്തി.
  alternative: ‘സർവസഭയ്ക്കുവേണ്ടിയുള്ള ചുമതല’ എന്നു വ്യാഖ്യാനാത്മകമായി വ്യക്തമാക്കാം.
  rationale: എബ്രായത്തിലെ ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം—സഭയ്ക്കു പകരമായോ സഭയുമായി ബന്ധപ്പെട്ടതായോ—മുഖ്യപാഠത്തിൽ അതിവ്യാഖ്യാനം ചെയ്യാതെ സംരക്ഷിച്ചു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സമാഗമകൂടാരം’, ‘തിരുനിവാസം’, ‘ശുശ്രൂഷ’ എന്നീ പദങ്ങൾ ആരാധനാസന്ദർഭം വ്യക്തമാക്കുന്നു; എബ്രായത്തിലെ രണ്ട് വ്യത്യസ്ത നാമങ്ങൾക്കായി വ്യത്യസ്ത മലയാളപദങ്ങൾ നിലനിർത്തി.
