revisions:
- from: അവർ അവന്റെ ചുമതലയും സർവസഭയുടെയും ചുമതലയും സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ നിർവഹിച്ച്, തിരുനിവാസത്തിലെ ശുശ്രൂഷ ചെയ്യണം.[a][b]
  to: തിരുനിവാസത്തിന്റെ ശുശ്രൂഷ നിർവഹിക്കുന്നതിനായി, അവർ അവന്റെ ചുമതലയും സർവസഭയുടെ ചുമതലയും സമാഗമകൂടാരത്തിന്റെ മുമ്പിൽ കാത്തുപാലിക്കണം.[a][b]
  rationale: The revision restores the purpose relation of לַעֲבֹד while retaining the Hebrew parallelism in the two ‘ചുമതല’ phrases, the ambiguous pronoun ‘അവന്റെ,’ and the distinct terms for the tent of meeting and the tabernacle. Footnote wording is adjusted to correspond to the revised lexical choice.
