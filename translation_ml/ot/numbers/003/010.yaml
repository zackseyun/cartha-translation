id: NUM.3.10
reference: Numbers 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: ml
  text: അഹരോനെയും അവന്റെ പുത്രന്മാരെയും നീ നിയമിക്കണം; അവർ തങ്ങളുടെ പൗരോഹിത്യചുമതല കാത്തുസൂക്ഷിക്കണം. എന്നാൽ അധികാരമില്ലാത്ത ഒരാൾ[a] അടുത്തുവന്നാൽ, അവൻ വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അന്യൻ’ അഥവാ ‘പുറത്തുള്ളവൻ.’ എബ്രായത്തിലെ പദം ഇവിടെ വംശീയമായി ഒരു വിദേശിയെ അല്ല, പുരോഹിതർക്കു മാത്രമുള്ള പ്രവേശനത്തിനോ ശുശ്രൂഷയ്ക്കോ അധികാരമില്ലാത്ത ഏവരെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: നീ നിയമിക്കണം
  rationale: פקד എന്ന ക്രിയയ്ക്ക് എണ്ണുക, ചുമതലപ്പെടുത്തുക, നിയമിക്കുക തുടങ്ങിയ അർഥങ്ങളുണ്ട്. അഹരോനെയും പുത്രന്മാരെയും പൗരോഹിത്യ ചുമതലയിലാക്കുന്നതാണ് സന്ദർഭം; അതിനാൽ ‘നിയമിക്കണം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: וְשָׁמְרוּ
  choice: അവർ … കാത്തുസൂക്ഷിക്കണം
  rationale: שׁמר എന്നത് കാക്കുക, സൂക്ഷിക്കുക, പാലിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു. ഇവിടെ പൗരോഹിത്യത്തിന്റെ ചുമതലയും അതിരുകളും ജാഗ്രതയോടെ സംരക്ഷിക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: כְּהֻנָּתָם
  choice: തങ്ങളുടെ പൗരോഹിത്യം
  rationale: ഈ നാമം പുരോഹിതപദവിയെയും അതിന്റെ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്നു. ‘പൗരോഹിത്യം’ സംക്ഷിപ്തമായി ഈ രണ്ടു വശങ്ങളും നിലനിർത്തുന്നു.
- source_word: הַזָּר
  choice: പുറത്തുള്ള ഒരാൾ
  rationale: זָר ഇവിടെ വംശീയമായി വിദേശിയായ ഒരാളെക്കാൾ, പുരോഹിതർക്കു മാത്രമുള്ള മേഖലയ്ക്കോ ശുശ്രൂഷയ്ക്കോ പുറത്തുള്ള ആളെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലപദത്തിന്റെ രൂപകം നിലനിർത്തി തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: הַקָּרֵב
  choice: അടുത്തുവന്നാൽ
  rationale: קרב വിശുദ്ധ മേഖലയിലേക്കോ അതുമായി ബന്ധപ്പെട്ട ചുമതലയിലേക്കോ സമീപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൃത്യമായ ആചാരപരിധി വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ പൊതുവായ ‘അടുത്തുവരുക’ നിലനിർത്തുന്നു.
- source_word: יוּמָת
  choice: മരണശിക്ഷയ്ക്ക് വിധേയനാക്കണം
  rationale: מות എന്ന ക്രിയയുടെ ഹോഫാൽ രൂപം വെറും മരണം പ്രവചിക്കുന്നതല്ല; ഒരാളെ കൊല്ലിക്കുന്ന നിയമപരമായ ശിക്ഷാഭാവമാണ് പ്രകടിപ്പിക്കുന്നത്. ഈ നിഷ്ക്രിയ-കാരണാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പൗരോഹിത്യശുശ്രൂഷയിലേക്കുള്ള നിയന്ത്രിത പ്രവേശനം
  choice: അഹരോനും അവന്റെ പുത്രന്മാരും മാത്രമാണ് ഇവിടെ പൗരോഹിത്യം നിർവഹിക്കാനും കാത്തുസൂക്ഷിക്കാനും നിയമിക്കപ്പെടുന്നത്; അതിന് പുറത്തുള്ള ഒരാൾ അടുത്തുവരുന്നത് മരണശിക്ഷയ്ക്ക് ഇടയാക്കുന്നു.
  alternative: ഈ വരി മാത്രം നോക്കുമ്പോൾ, നിരോധനം പ്രത്യേകിച്ച് ഏത് വിശുദ്ധ സ്ഥലപരിധിയെയോ ഏത് പുരോഹിതകർമത്തെയോ ഉദ്ദേശിക്കുന്നു എന്ന് വ്യക്തമാക്കാതെ, പുരോഹിതനല്ലാത്ത ആരുടെയും വിശുദ്ധമായ സമീപനത്തെ പൊതുവായി വിലക്കുന്നതായും വായിക്കാം.
  rationale: എബ്രായപാഠം അധികാരപ്പെടുത്തിയ പൗരോഹിത്യത്തിന്റെ സംരക്ഷണത്തെയും അനധികൃത സമീപനത്തിന്റെ മാരകമായ ഫലത്തെയും ഊന്നുന്നു. എന്നാൽ ഈ വാക്യത്തിൽ പറയാത്ത കൃത്യമായ ആചാരപരിധികളോ പിന്നീടുള്ള മതവിഭാഗപരമായ വ്യാഖ്യാനങ്ങളോ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമപരമായ ഭാവം ‘മരണശിക്ഷയ്ക്ക് വിധേയനാക്കണം’ എന്നതിലൂടെ നിലനിർത്തി; ‘അടുത്തുവരുക’ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
