source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: ml
  text: കെഹാത്ത്യരുടെ കുടുംബങ്ങളുടെ പിതൃഭവനത്തിന്റെ തലവൻ ഉസ്സീയേലിന്റെ മകനായ എലീസാഫാൻ ആയിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തലവൻ’ എന്നതിന് ‘നേതാവ്’ അല്ലെങ്കിൽ ‘പ്രഭു’ എന്നും വിവർത്തനം ചെയ്യാം (എബ്രാ. נָשִׂיא).
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘പിതാവിന്റെ വീട്’; പിതൃവംശപരമായ ഒരു കുലഗൃഹഘടകത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: തലവൻ
  rationale: נָשִׂיא ഇവിടെ ഗോത്രപരവും ഭരണപരവുമായ ചുമതലയുള്ള അംഗീകൃത നേതാവിനെ സൂചിപ്പിക്കുന്നു. രാജത്വം ധ്വനിപ്പിക്കാതെ അധികാരം വ്യക്തമാക്കുന്നതിനാൽ ‘തലവൻ’ തിരഞ്ഞെടുത്തു. വാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ וְ പ്രത്യേകം ‘കൂടാതെ’ എന്നു വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: בֵית אָב
  choice: പിതൃഭവനം
  rationale: അക്ഷരാർഥത്തിൽ ‘പിതാവിന്റെ വീട്’; ഇവിടെ പിതൃവംശാധിഷ്ഠിതമായ കുലഗൃഹഘടകത്തെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക പ്രയോഗമാണ്. സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ‘പിതൃഭവനം’ ആ ബന്ധഘടന നിലനിർത്തുന്നു.
- source_word: לְמִשְׁפְּחֹת
  choice: കുടുംബങ്ങളുടെ
  rationale: מִשְׁפָּחוֹת കുടുംബങ്ങളെയോ കുലശാഖകളെയോ സൂചിപ്പിക്കുന്നു. בֵית אָב എന്ന വലിയ പിതൃവംശഘടകത്തിനുള്ളിലെ കൂട്ടങ്ങളെ പ്രതിഫലിപ്പിക്കാൻ ‘കുടുംബങ്ങളുടെ’ ഉപയോഗിച്ചു.
- source_word: הַקְּהָתִי
  choice: കെഹാത്യ
  rationale: ഏകവചന ജാതിനാമരൂപം ഇവിടെ കെഹാത്തിന്റെ സന്തതികളെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തുടർന്നുള്ള ‘കുടുംബങ്ങൾ’ എന്ന പദത്തോടു ചേർന്ന് സ്വാഭാവികമാകാൻ ‘കെഹാത്യ’ എന്ന വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: אֶלִיצָפָן
  choice: എലീസാഫാൻ
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן עֻזִּיאֵל
  choice: ഉസ്സീയേലിന്റെ മകൻ
  rationale: സാധാരണ വംശാവലിസൂത്രം സ്വാഭാവിക മലയാളബന്ധരൂപത്തിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഹീബ്രുവിലെ ക്രിയാരഹിത തിരിച്ചറിയൽവാക്യം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപമായ ‘ആയിരുന്നു’ ഉപയോഗിച്ച് വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
