source:
  edition: WLC
  text: וְ/אֵת֙ פְּדוּיֵ֣י הַ/שְּׁלֹשָׁ֔ה וְ/הַ/שִּׁבְעִ֖ים וְ/הַ/מָּאתָ֑יִם הָ/עֹֽדְפִים֙ עַל הַ/לְוִיִּ֔ם מִ/בְּכ֖וֹר בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: ml
  text: ലെവ്യരുടെ എണ്ണത്തെക്കാൾ അധികമായ ഇസ്രായേൽമക്കളുടെ കടിഞ്ഞൂലുകാരായ 273 പേരുടെ വീണ്ടെടുപ്പുവില,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: വീണ്ടെടുപ്പുവിലയ്ക്കായി
  rationale: പദരൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘വീണ്ടെടുക്കപ്പെട്ടവർ’ എന്നു ഗ്രഹിക്കാനാകുമെങ്കിലും, തൊട്ടടുത്ത വാക്യങ്ങൾ അധികമായി വന്ന കടിഞ്ഞൂലുകാരിൽ ഓരോരുത്തർക്കും നൽകേണ്ട തുകയെക്കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ സന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വീണ്ടെടുപ്പുവില’ എന്നു നൽകി.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: എബ്രായഭാഷയിലെ സങ്കലനരീതിയിലുള്ള സംഖ്യയെ അതേ കൃത്യമായ അളവ് വ്യക്തമാക്കുന്ന ആധുനിക അക്കരൂപത്തിൽ നൽകി.
- source_word: הָעֹדְפִים
  choice: അധികമായി വന്ന
  rationale: പകരക്കാരായ ലേവ്യരുടെ എണ്ണത്തിനപ്പുറം ശേഷിച്ചവരെയാണ് ഈ കൃദന്തരൂപം സൂചിപ്പിക്കുന്നത്; ‘അധികമായി വന്ന’ എന്നത് അതിന്റെ താരതമ്യാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַל הַלְוִיִּם
  choice: ലെവ്യരുടെ എണ്ണത്തെക്കാൾ
  rationale: עֹדְפִים എന്ന പദത്തോടൊപ്പം עַל ലേവ്യരുടെ എണ്ണവുമായി താരതമ്യപ്പെടുത്തി വന്ന അധികത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ താരതമ്യത്തിന്റെ അടിസ്ഥാനം വ്യക്തമാക്കാൻ ‘എണ്ണത്തെക്കാൾ’ ചേർത്തു.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ കടിഞ്ഞൂലുകാരിൽപ്പെട്ട
  rationale: מִן എന്നതിന്റെ ഭാഗികാർഥം ‘-ൽപ്പെട്ട’ എന്നതിലൂടെ പ്രകടമാക്കി; בְּנֵי יִשְׂרָאֵל എന്ന ഉടമ്പടിസംബന്ധിയായ പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നും പുരുഷ ആദ്യജാതരെ സൂചിപ്പിക്കുന്ന בְּכוֹר ‘കടിഞ്ഞൂലുകാർ’ എന്നും നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ ഉറവിടത്തിലെ അപൂർണ ഘടന നിലനിർത്തി; അവസാനത്തിൽ പൂർണവിരാമം ചേർത്തില്ല. ‘കടിഞ്ഞൂലുകാർ’ പുരുഷ ആദ്യജാതരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതമായെങ്കിലും ഇന്നും മനസ്സിലാകുന്ന പദമായി ഉപയോഗിച്ചു.
