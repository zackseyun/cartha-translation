revisions:
- from: ലെവ്യരുടെ എണ്ണത്തെക്കാൾ അധികമായി വന്ന ഇസ്രായേൽമക്കളുടെ കടിഞ്ഞൂലുകാരിൽപ്പെട്ട 273 പേരുടെ വീണ്ടെടുപ്പുവിലയ്ക്കായി,[a]
  to: ലെവ്യരുടെ എണ്ണത്തെക്കാൾ അധികമായ ഇസ്രായേൽമക്കളുടെ കടിഞ്ഞൂലുകാരായ 273 പേരുടെ വീണ്ടെടുപ്പുവില,
  rationale: The revision retains the exact number, the partitive identification of Israel’s firstborn, and their excess relative to the Levites. It replaces an arrival-oriented expression with one denoting numerical surplus and removes an unnecessary purposive ending. The footnote continues to preserve the alternative personal reading of פְּדוּיֵי without treating it as the preferred contextual sense.
