    text: അഥവാ, “വീണ്ടെടുക്കപ്പെട്ട 273 പേർ.” എബ്രായ പദരൂപത്തെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ മനസ്സിലാക്കാം. എന്നാൽ അധികമായ കടിഞ്ഞൂലുകാർക്കുവേണ്ടി നൽകേണ്ട തുകയാണ് തൊട്ടടുത്ത സന്ദർഭത്തിന്റെ വിഷയം (വാ. 47–48); അതിനാൽ ഇവിടെ “വീണ്ടെടുപ്പുവില” എന്നത് ആശയം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
