source:
  edition: WLC
  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: ml
  text: പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കാൻ അവൻ അവരുടെ കൈകൾ നിറച്ച[a] അഭിഷേകം ചെയ്യപ്പെട്ട പുരോഹിതന്മാരായ അഹരോന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “അവൻ അവരുടെ കൈകൾ നിറച്ചു.” പുരോഹിതശുശ്രൂഷയ്ക്കായി ഒരാളെ നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്
  rationale: തിരിച്ചറിയൽ സൂത്രവാക്യം സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നൽകി; בְּנֵי എന്നത് ഇവിടെ പുരുഷസന്തതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: അഭിഷേകം ചെയ്യപ്പെട്ട പുരോഹിതന്മാർ
  rationale: രണ്ടു നിർദിഷ്ട പദങ്ങളും അഹരോന്റെ പുത്രന്മാരെ വിശേഷിപ്പിക്കുന്നു; משׁח എന്ന ക്രിയയുടെ ആചാരപരമായ പ്രവർത്തനം ‘അഭിഷേകം ചെയ്യപ്പെട്ട’ എന്നതിലൂടെ നേരിട്ട് നിലനിർത്തി.
- source_word: מִלֵּא יָדָם
  choice: അവരുടെ കൈകൾ നിറയ്ക്കപ്പെട്ടു
  rationale: പുരോഹിതസ്ഥാനത്ത് നിയമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ സാങ്കേതിക പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ മലയാളത്തിലും കർത്താവിനെ ചേർത്തിട്ടില്ല.
- source_word: לְכַהֵן
  choice: പുരോഹിതന്മാരായി ശുശ്രൂഷിക്കാൻ
  rationale: പുരോഹിതചുമതല നിർവഹിക്കുക എന്ന ഉദ്ദേശ്യവും സേവനസ്വഭാവവും വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: מִלֵּא יָדָם എന്ന പുരോഹിതനിയമന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ‘അവരുടെ കൈകൾ നിറയ്ക്കപ്പെട്ടു’ എന്ന മൂർത്തമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘പുരോഹിതന്മാരായി നിയമിക്കപ്പെട്ടവർ’ എന്നു പൂർണമായി അർഥാനുവാദം ചെയ്യുക.
  rationale: അർഥാനുവാദം വായന എളുപ്പമാക്കുമെങ്കിലും എബ്രായത്തിലെ ശ്രദ്ധേയമായ ആചാരപരമായ ശൈലി മറയ്ക്കും. മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് രൂപവും അർഥവും സംരക്ഷിക്കുന്നു.
- issue: מִלֵּא എന്ന ക്രിയയുടെ അപ്രകട കർത്താവ്
  choice: കർത്താവിനെ ചേർക്കാതെ ‘നിറയ്ക്കപ്പെട്ടു’ എന്നു നൽകി.
  alternative: ‘അവൻ അവരുടെ കൈകൾ നിറച്ചു’ എന്നു നൽകുക.
  rationale: എബ്രായ ക്രിയ മൂന്നാംപുരുഷ ഏകവചന കർത്താവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ ആ വ്യക്തി പേരെടുത്തു പറയപ്പെട്ടിട്ടില്ല; മലയാളത്തിൽ അജ്ഞാതമായ ‘അവൻ’ ചേർക്കുന്നതിനെക്കാൾ കർമണി പ്രയോഗം സന്ദർഭാർഥം വ്യക്തമായി കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അഭിഷേകം’, ‘പുരോഹിതൻ’, ‘ശുശ്രൂഷ’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചു; വിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം വിശദീകരിക്കപ്പെടുന്ന പ്രയോഗത്തിനുശേഷം തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
