source:
  edition: WLC
  text: מֵ/אֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת הַ/כָּ֑סֶף חֲמִשָּׁ֨ה וְ/שִׁשִּׁ֜ים וּ/שְׁלֹ֥שׁ מֵא֛וֹת וָ/אֶ֖לֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളുടെ ആദ്യജാതന്മാരിൽനിന്ന് അവൻ വെള്ളി എടുത്തു, വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽ മാനദണ്ഡപ്രകാരം ആയിരത്തി മുന്നൂറ്റി അറുപത്തഞ്ച് ശേക്കേൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵת
  choice: നിന്ന്
  rationale: പണം ആരിൽനിന്നാണ് വാങ്ങിയതെന്ന് സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ലളിതമായ അപാദാനപ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ കടിഞ്ഞൂലുകൾ
  rationale: ഏകവചനരൂപത്തിലുള്ള בְּכוֹר ഇവിടെ സമൂഹവാചകമായി പ്രവർത്തിക്കുന്നു. മുൻസന്ദർഭത്തിലെ എണ്ണലും വീണ്ടെടുപ്പും കണക്കിലെടുത്ത് പുരുഷജാത ആദ്യജാതരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രാഹ്യവുമായ ‘കടിഞ്ഞൂലുകൾ’ തെരഞ്ഞെടുത്തു.
- source_word: לָקַח
  choice: വാങ്ങി
  rationale: לָקַח എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘എടുക്കുക’ ആണെങ്കിലും, ഇവിടെ മോശെ വീണ്ടെടുപ്പുവില സ്വീകരിക്കുന്ന സാമ്പത്തികസന്ദർഭമായതിനാൽ ‘വാങ്ങി’ സ്വാഭാവികമാണ്; ‘വിലയ്ക്കു വാങ്ങി’ എന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: הַכָּסֶף
  choice: വെള്ളി
  rationale: כֶּסֶף എന്നത് അക്ഷരാർഥത്തിൽ വെള്ളിയെയും വിപുലാർഥത്തിൽ പണത്തെയും സൂചിപ്പിക്കുന്നു. പിന്നാലെ ശേക്കേൽത്തൂക്കം പറയുന്നതിനാൽ വസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘വെള്ളി’ നിലനിർത്തുന്നു.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: ആയിരത്തി മുന്നൂറ്റി അറുപത്തഞ്ച്
  rationale: എബ്രായസംഖ്യാഘടകങ്ങളെ മലയാളത്തിലെ സ്വാഭാവിക സംഖ്യാക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ശേക്കേൽത്തൂക്കപ്രകാരം
  rationale: ഈ പ്രയോഗം തൂക്കത്തിന്റെ വിശുദ്ധമന്ദിര മാനദണ്ഡത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശേക്കേൽത്തൂക്കപ്രകാരം’ എന്നു വ്യക്തമാക്കുന്നത് പ്രത്യേക നാണയം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇസ്രായേൽമക്കൾ,’ ‘കടിഞ്ഞൂൽ,’ ‘വിശുദ്ധമന്ദിരം’ എന്നീ ബൈബിൾപരിചിത പദങ്ങൾ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും വാക്യഘടന ലളിതമാക്കി. മൂലത്തിലെ വെള്ളി എന്ന വസ്തുസൂചനയും വിശുദ്ധമന്ദിരത്തിലെ തൂക്കമാനദണ്ഡവും സംരക്ഷിച്ചു.
