source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വേ[a] മോശയോട് ഇപ്രകാരം സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ ‘YHWH’ എന്ന ദൈവനാമം. ഇതിന്റെ കൃത്യമായ പുരാതന ഉച്ചാരണം ഉറപ്പില്ല; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നും ‘യഹോവ’ എന്നും പരിഭാഷപ്പെടുത്തുകയോ ലിപ്യന്തരണം ചെയ്യുകയോ ചെയ്തിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ചയോടുകൂടിയ דִּבֵּר ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്ന ദൈവിക വചനസൂത്രമാണ്. ‘സംസാരിച്ചു’ എന്നത് ‘പറഞ്ഞു’ എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH-നെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, സാധ്യതയേറിയ ഉച്ചാരണത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל
  choice: -ഓട്
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാള വിഭക്തിരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: തുടർന്നുവരുന്ന വാക്കുകളെ ദൈവിക പ്രസംഗത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിക്കുന്ന എബ്രായ സൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘സംസാരിച്ചു’ എന്ന ക്രിയയോടൊപ്പം അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം YHWH എന്ന വ്യക്തിനാമമാണ് ഉപയോഗിക്കുന്നത്. ‘യഹ്‌വേ’ അത് ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ സംരക്ഷിക്കുന്നു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ദൈവിക വചനസൂത്രത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് പദാനുപദമായ അസ്വാഭാവികത ഒഴിവാക്കിയിരിക്കുന്നു.
