    rationale: This can conflate מִשְׁכָּן (tabernacle/dwelling) with אֹהֶל מוֹעֵד (Tent of Meeting). ‘തിരുനിവാസം’ is the established Malayalam term that preserves the source distinction.
  - severity: low
    issue: The closing phrase ends ‘വേണ്ടിയുള്ളവ.’
    rationale: This supplies an ‘intended for’ predication for the enumerated items. Hebrew simply appends ‘for all its service’; a purpose phrase better preserves the compressed list syntax.
