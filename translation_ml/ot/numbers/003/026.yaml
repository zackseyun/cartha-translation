source:
  edition: WLC
  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: ml
  text: പ്രാകാരത്തിന്റെ മറശ്ശീലകളും[a], തിരുനിവാസത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ പ്രവേശനത്തിന്റെ തിരശ്ശീലയും, അതിന്റെ കയറുകളും[b]—അതുമായി ബന്ധപ്പെട്ട എല്ലാ ശുശ്രൂഷകൾക്കുമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രാകാരത്തിന്റെ തുണിമറകൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അതിന്റെ ചരടുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: മറശ്ശീലകൾ
  rationale: പ്രാകാരത്തെ ചുറ്റി അതിരുണ്ടാക്കിയിരുന്ന തുണിത്തൂക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മറശ്ശീലകൾ’ ഈ ഘടനാപരമായ ഉപയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: חָצֵר
  choice: പ്രാകാരം
  rationale: സമാഗമകൂടാരത്തിനു ചുറ്റുമുള്ള വേലികെട്ടിയ തുറസ്സായ വിശുദ്ധസ്ഥലത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും മാന്യവുമായ പദം.
- source_word: מָסַךְ
  choice: തിരശ്ശീല
  rationale: പ്രവേശനത്തിൽ സ്ഥാപിച്ചിരുന്ന തുണികൊണ്ടുള്ള മറയെ സൂചിപ്പിക്കുന്നു; പ്രാകാരത്തിന്റെ മറശ്ശീലകളിൽനിന്ന് ഇതിന്റെ പ്രവേശനപരമായ ധർമ്മം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: פֶּתַח
  choice: പ്രവേശനം
  rationale: കട്ടിയുള്ള വാതിലോ കവാടമോ സൂചിപ്പിക്കാതെ പ്രവേശിക്കാനുള്ള തുറവ് എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: സമാഗമകൂടാരത്തിനും യാഗപീഠത്തിനും ചുറ്റുമുള്ള
  rationale: סָבִיב എന്ന സ്ഥലബന്ധം പ്രാകാരം സമാഗമകൂടാരത്തെയും യാഗപീഠത്തെയും ചുറ്റിയിരുന്നു എന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: מִשְׁכָּן
  choice: സമാഗമകൂടാരം
  rationale: ഈ വിശുദ്ധ കൂടാരഘടനയ്ക്ക് മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ സാങ്കേതികപദം; സന്ദർഭത്തിൽ വെറും ‘വാസസ്ഥലം’ എന്നതിനെക്കാൾ വ്യക്തം.
- source_word: מִזְבֵּחַ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: מֵיתָרָיו
  choice: അതിന്റെ കയറുകൾ
  rationale: ഘടന ഉറപ്പിക്കാൻ ഉപയോഗിച്ച കയറുകളെ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിലും സൂചിപ്പിക്കുന്നു.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: അതുമായി ബന്ധപ്പെട്ട എല്ലാ ശുശ്രൂഷയ്ക്കും വേണ്ടിയുള്ളവ
  rationale: עֲבֹדָה എന്നതിലെ നിയുക്ത വിശുദ്ധസേവനത്തിന്റെ ഭാവം ‘ശുശ്രൂഷ’ നിലനിർത്തുന്നു; പ്രത്യയം ഏതു മുൻപറഞ്ഞ ഘടകത്തെ സൂചിപ്പിക്കുന്നു എന്നത് അതിയായി നിർവചിക്കാതെ ‘അതുമായി ബന്ധപ്പെട്ട’ എന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, വിശുദ്ധമന്ദിരസംബന്ധമായ പരിചിത പദാവലി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും മാന്യവുമായ ശൈലി. എബ്രായ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിലും പട്ടികാഭാവം സംരക്ഷിച്ചിരിക്കുന്നു; അവസാനത്തെ ഡാഷ് സംഗ്രഹപ്രയോഗം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
