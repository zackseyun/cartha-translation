  terminology: ‘പ്രാകാരം,’ ‘യാഗപീഠം,’ ‘തിരുനിവാസം,’ and ‘ശുശ്രൂഷ’ are suitable dignified modern Malayalam sanctuary terminology. The distinction between the court hangings and the entrance screen is retained.
