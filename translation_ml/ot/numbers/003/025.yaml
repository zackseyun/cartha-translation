  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. എബ്രായത്തിലെ പട്ടികഘടനയും ‘തിരുനിവാസം’–‘കൂടാരം’ എന്ന വ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു.
