id: NUM.3.25
reference: Numbers 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: ml
  text: സമാഗമകൂടാരത്തിൽ ഗേർശോന്റെ പുത്രന്മാർക്കുള്ള ചുമതല[a] തിരുനിവാസം, കൂടാരം, അതിന്റെ മൂടി, സമാഗമകൂടാരത്തിന്റെ പ്രവേശനത്തിനുള്ള മറശ്ശീല[b] എന്നിവയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചുമതല” എന്നത് “കാവൽച്ചുമതല” എന്നോ “ഉത്തരവാദിത്വം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “മറശ്ശീല” എന്നത് “തിരശ്ശീല” എന്നും പരിഭാഷപ്പെടുത്താം; പ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: ചുമതല
  rationale: ലേവ്യർക്കു പരിപാലിക്കാനായി ഏല്പിക്കപ്പെട്ട വസ്തുക്കളെയും ഉത്തരവാദിത്വത്തെയും ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: ഗേർശോന്റെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘ഗേർശോന്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: സേവനത്തിന്റെ സ്ഥലമോ മേഖലയോ സൂചിപ്പിക്കുന്ന ב എന്ന ഉപസർഗവും אֹהֶל מוֹעֵד എന്ന സ്ഥിരപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്ന പദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും ആരാധനാസംബന്ധമായ പ്രത്യേക സൂചനയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: וְהָאֹהֶל
  choice: കൂടാരം
  rationale: തിരുനിവാസത്തിൽനിന്ന് വേർതിരിച്ചുള്ള കൂടാരഘടകമായി പട്ടികയുടെ ഘടന നിലനിർത്തുന്നു.
- source_word: מִכְסֵהוּ
  choice: അതിന്റെ മൂടി
  rationale: കൂടാരസമുച്ചയത്തിന്റെ സംരക്ഷക ആവരണത്തെ ചുരുക്കമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: מָסַךְ
  choice: മറശ്ശീല
  rationale: പ്രവേശനത്തിൽ തൂക്കിയിരുന്ന മറയെയോ തിരശ്ശീലയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളം.
- source_word: פֶּתַח
  choice: പ്രവേശനത്തിനുള്ള
  rationale: മറശ്ശീലയും പ്രവേശനവും തമ്മിലുള്ള പ്രയോഗപരമായ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: വാക്യത്തിലെ ആവർത്തനത്തിലും ഒരേ പരിഭാഷ സ്ഥിരമായി നിലനിർത്തുന്നു.
