translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ജനസംഖ്യാകണക്കിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിയിരിക്കുന്നു.
