  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: ml
  text: അവരിൽ എണ്ണപ്പെട്ടവർ[a]—ഒരു മാസം പ്രായം മുതൽ അതിനുമുകളിലുള്ള എല്ലാ ആൺവർഗത്തിൽപ്പെട്ടവരുടെയും എണ്ണമനുസരിച്ച്—ആറായിരത്തി ഇരുനൂറുപേർ ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവരുടെ എണ്ണപ്പെട്ടവർ” / “അവരിൽ രജിസ്റ്റർ ചെയ്യപ്പെട്ടവർ.” എബ്രായപദം ഈ കുലത്തിലെ ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: അവരിൽ എണ്ണപ്പെട്ടവർ
  rationale: פקד എന്ന ധാതുവിൽനിന്നുള്ള നിഷ്പന്ന നാമരൂപം ഈ കൂട്ടത്തിൽ ജനസംഖ്യാകണക്കിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. വ്യക്തികളെ സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: എല്ലാ ആൺകുട്ടികളുടെയും എണ്ണമനുസരിച്ച്
  rationale: בְּמִסְפַּר എണ്ണലിന്റെ അടിസ്ഥാനത്തെയും כָּל זָכָר ഓരോ പുരുഷലിംഗത്തിലുള്ള വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു. ഇവിടെ പ്രായപരിധി ഒരു മാസംമുതൽ ആയതിനാൽ ‘ആൺകുട്ടികൾ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ഒരു മാസം പ്രായംമുതൽ മേലോട്ടുള്ള
  rationale: കുറഞ്ഞ പ്രായപരിധിയും അതിനു മുകളിലുള്ള എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ആശയവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: ആറായിരത്തി ഇരുനൂറുപേർ
  rationale: എബ്രായത്തിലെ ആകെ സംഖ്യ വാക്കുകളായി നൽകി; ആളുകളുടെ എണ്ണമാണെന്നതിനാൽ ‘പേർ’ ചേർത്തു.
