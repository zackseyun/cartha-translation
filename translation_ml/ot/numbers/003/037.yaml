  language: en
  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: ml
  text: ചുറ്റുമുള്ള പ്രാകാരത്തിന്റെ തൂണുകളും അവയുടെ അടിത്തറകളും[a] അവയുടെ കുറ്റികളും അവയുടെ കയറുകളും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «ചുവടുറപ്പുകൾ»; എബ്രായ പദം ഘടനയെ താങ്ങുന്ന അടിത്തറകളെയോ സോക്കറ്റുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, «ചരടുകൾ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: തൂണുകൾ
  rationale: പ്രാകാരത്തിന്റെ മറയ്ക്ക് താങ്ങായിരുന്ന കുത്തനെയുള്ള ഘടകങ്ങളെ സൂചിപ്പിക്കുന്നു; ആലയകൂടാരത്തിന്റെ വാസ്തുശൈലിക്ക് സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: הֶחָצֵר
  choice: പ്രാകാരം
  rationale: ആലയകൂടാരത്തെ ചുറ്റിയിരുന്ന വേർതിരിച്ച തുറസ്സായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-വാസ്തുഭാഷയിൽ പരിചിതവും കൃത്യവുമാണ്.
- source_word: סָבִיב
  choice: ചുറ്റുമുള്ള
  rationale: പ്രാകാരത്തിന്റെ ചുറ്റളവിലുടനീളമുള്ള തൂണുകളാണെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: אַדְנֵיהֶם
  choice: അവയുടെ ചുവടുകൾ
  rationale: തൂണുകളെ താങ്ങുന്ന അടിത്തറകളെയോ ഘടിപ്പിക്കുന്ന ചുവടുകളെയോ സൂചിപ്പിക്കുന്നു; സാങ്കേതികത കുറച്ച് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം.
- source_word: יְתֵדֹתָם
  choice: അവയുടെ കുറ്റികൾ
  rationale: ഘടന ഉറപ്പിക്കാൻ നിലത്ത് അടിച്ചിരുന്ന മുളകളെയോ കുറ്റികളെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് ചുരുക്കവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: מֵיתְרֵיהֶם
  choice: അവയുടെ കയറുകൾ
  rationale: ഘടന ഉറപ്പിക്കാൻ കുറ്റികളോടൊപ്പം ഉപയോഗിച്ച കയറുകളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ നേരിട്ട് മനസ്സിലാകുന്ന പദം.
- source_word: וְ
  choice: -ഉം
  rationale: പട്ടികയുടെ തുടർച്ചയും എബ്രായത്തിലെ ആവർത്തിത സംയോജകത്തിന്റെ എണ്ണിപ്പറയുന്ന ശൈലിയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
