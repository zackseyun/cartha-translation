  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: ml
  text: 'ലേവിയുടെ പുത്രന്മാർ പേരുപ്രകാരം ഇവരായിരുന്നു: ഗേർശോൻ, കെഹാത്ത്, മെരാരി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: ഇവരായിരുന്നു
  rationale: പട്ടിക അവതരിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാല വാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്നില്ല.
- source_word: בְנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർ
  rationale: ഇവിടെ പരാമർശിക്കുന്നത് ലേവിയുടെ നേരിട്ടുള്ള മൂന്ന് ആൺമക്കളെയാണ്; അതിനാൽ പൊതുവായ ‘സന്തതികൾ’ എന്നതിനെക്കാൾ ‘പുത്രന്മാർ’ കൃത്യമാണ്.
- source_word: בִּשְׁמֹתָם
  choice: പേരുപ്രകാരം
  rationale: ‘അവരുടെ പേരുകൾ അനുസരിച്ച്’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: גֵּרְשׁוֹן
  choice: ഗേർശോൻ
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: ഹീബ്രു സ്വരരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: מְרָרִי
  choice: മെരാരി
  rationale: ഹീബ്രു വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
