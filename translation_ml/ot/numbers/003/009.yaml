id: NUM.3.9
reference: Numbers 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: ml
  text: ലേവ്യരെ അഹരോനും അവന്റെ പുത്രന്മാർക്കും ഏൽപ്പിച്ചുകൊടുക്കണം; ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്[b] അവർ അവന് പൂർണമായി നൽകപ്പെട്ടവരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ ഊന്നലിനായി ‘നൽകപ്പെട്ടവർ’ എന്ന പദം ആവർത്തിക്കുന്നു: ‘നൽകപ്പെട്ടവർ, നൽകപ്പെട്ടവർ’ അഥവാ ‘നിശ്ചയമായും നൽകപ്പെട്ടവർ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ ‘ഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്.’ എബ്രായത്തിൽ അക്ഷരാർഥം: ‘ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ഏൽപ്പിച്ചുകൊടുക്കണം
  rationale: നിർദേശസന്ദർഭത്തിലെ ക്രിയാരൂപത്തിന്റെ ആജ്ഞാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ വെറും ദാനം എന്നതിലുപരി ചുമതലയ്ക്കായി കൈമാറുന്ന ആശയവും ഉണ്ട്.
- source_word: הַלְוִיִּם
  choice: ലേവ്യരെ
  rationale: വിശുദ്ധമന്ദിരശുശ്രൂഷയ്ക്കായി വേർതിരിക്കപ്പെട്ട ലേവി ഗോത്രാംഗങ്ങൾക്കുള്ള സ്ഥാപിതമായ മലയാളപദം.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും
  rationale: לְ എന്ന ഉപസർഗത്തിന്റെ സ്വീകർത്താവ്/പ്രയോജനഭോക്താവ് എന്ന അർഥം നിലനിർത്തുകയും എബ്രായവാക്യത്തിന്റെ ബന്ധഘടന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: נְתוּנִם נְתוּנִם
  choice: പൂർണമായി നൽകപ്പെട്ടവർ
  rationale: ‘നൽകപ്പെട്ടവർ’ എന്ന പദത്തിന്റെ എബ്രായത്തിലെ ആവർത്തനം നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘പൂർണമായി’ എന്നു പ്രകടിപ്പിക്കുന്നു; മൂലത്തിലെ ആവർത്തനം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: הֵמָּה
  choice: അവർ
  rationale: സ്വതന്ത്ര സർവനാമം കർത്താവിനെ ഊന്നുന്നു; മലയാളത്തിലെ വ്യക്തമായ കർത്തൃപ്രയോഗവും ഊന്നിയ വിധേയഭാഗവും അതു മതിയായവിധം വഹിക്കുന്നു.
- source_word: לוֹ
  choice: അവന്
  rationale: അടുത്തുള്ള പൂർവപദമായ അഹരോനെയാണ് സൂചിപ്പിക്കുന്നത്; സമർപ്പണം/കൈമാറ്റം എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ ഇടയിൽനിന്ന്
  rationale: ഉത്ഭവവും വിശാലസമൂഹത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പും സൂചിപ്പിക്കുന്ന מֵאֵת എന്നതിന്റെ അർഥം ‘ഇടയിൽനിന്ന്’ വ്യക്തമാക്കുന്നു; בְּנֵי יִשְׂרָאֵל എന്ന കുടുംബ-ഉടമ്പടി പ്രയോഗം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל എന്നതിന്റെ പരിഭാഷ
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: എബ്രായത്തിലെ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന കുടുംബപരവും ഉടമ്പടിപരവുമായ പ്രയോഗം സ്വാഭാവികമായ സ്ഥാപിത മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ സംക്ഷിപ്തമായ സമൂഹനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: נְתוּנִם נְתוּנִם എന്ന ആവർത്തനത്തിന്റെ ഊന്നൽ
  choice: പൂർണമായി നൽകപ്പെട്ടവർ
  alternative: നൽകപ്പെട്ടവർ, നൽകപ്പെട്ടവർ
  rationale: എബ്രായത്തിലെ ഉദ്ദേശപൂർവമായ ആവർത്തനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു, എന്നാൽ അസ്വാഭാവികമായ മലയാള ആവർത്തനം മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഏൽപ്പിച്ചുകൊടുക്കണം’ നിർദേശത്തിന്റെയും കൈമാറ്റത്തിന്റെയും ഭാവം ചേർത്തുവഹിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാക്യഭാഗത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
