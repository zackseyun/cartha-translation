source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാരുടെ ഏൽപ്പിക്കപ്പെട്ട ചുമതല: തിരുനിവാസത്തിന്റെ ചട്ടക്കൂടുകൾ[a], അതിന്റെ ദണ്ഡുകൾ, തൂണുകൾ, അടിസ്ഥാനങ്ങൾ[b], അതിന്റെ സാമഗ്രികളെല്ലാം, അതുമായി ബന്ധപ്പെട്ട എല്ലാ സേവനവും[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരുനിവാസത്തിന്റെ പലകകൾ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിന്റെ സോക്കറ്റുകൾ’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അതുമായി ബന്ധപ്പെട്ട എല്ലാ ജോലിയും’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: ഏൽപ്പിച്ചിരുന്ന ചുമതല
  rationale: രണ്ടു നാമങ്ങളും ചേർന്ന് ഔദ്യോഗികമായി ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ ബന്ധസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ ചട്ടക്കൂടുകൾ
  rationale: നിവാസത്തിന്റെ ഘടനയിൽ ഉപയോഗിച്ചിരുന്ന നിവർന്ന ഘടകങ്ങളെ ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സൂചിപ്പിക്കുന്നു; പലകകൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ദൈവിക വാസസ്ഥലമെന്ന മൂലധാരണയും വിശുദ്ധമന്ദിരഘടനയെന്ന സാങ്കേതിക അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְרִיחָיו
  choice: അതിന്റെ കുറുകെക്കെട്ടുന്ന ദണ്ഡുകൾ
  rationale: ചട്ടക്കൂടുകളെ ബന്ധിപ്പിക്കുന്ന ദണ്ഡുകളുടെ നിർമാണപരമായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: עַמֻּדָיו
  choice: തൂണുകൾ
  rationale: നിവർന്ന താങ്ങുകളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: אֲדָנָיו
  choice: ചുവടുകൾ
  rationale: തൂണുകളോ ചട്ടക്കൂടുകളോ ഉറപ്പിക്കുന്ന അടിത്തറഘടകങ്ങൾ എന്ന വിശാല അർഥം നൽകുന്നു; കൂടുതൽ സാങ്കേതികമായ ‘കുഴിയുള്ള പീഠങ്ങൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: כָל כֵּלָיו
  choice: അതിന്റെ എല്ലാ ഉപകരണങ്ങൾ
  rationale: כֵּלִים എന്ന പദത്തിന്റെ ഉപകരണങ്ങൾ, സാമഗ്രികൾ തുടങ്ങിയ വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: כֹל עֲבֹדָתוֹ
  choice: അവയുമായി ബന്ധപ്പെട്ട എല്ലാ ജോലികളും
  rationale: ഏകവചന പ്രത്യയം ഏതിനോടാണ് ചേരുന്നത് എന്ന മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കിക്കൊണ്ട്, പ്രസ്തുത ഘടകങ്ങളോടു ബന്ധപ്പെട്ട മുഴുവൻ പ്രവൃത്തിയും സേവനവും സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ ശൈലി. നിർമാണസംബന്ധമായ സാങ്കേതിക പദങ്ങളിൽ വ്യക്തതയ്ക്കു മുൻഗണന നൽകി; മൂലപാഠത്തിലെ പട്ടികയുടെ ഘടനയും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വത്തിന്റെ ആശയവും സംരക്ഷിച്ചു.
