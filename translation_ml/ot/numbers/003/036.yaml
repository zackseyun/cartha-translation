- from: 'മെരാരിയുടെ പുത്രന്മാർക്കു ഏൽപ്പിച്ചിരുന്ന ചുമതല ഇവയായിരുന്നു: തിരുനിവാസത്തിന്റെ ചട്ടക്കൂടുകൾ[a], അതിന്റെ കുറുകെക്കെട്ടുന്ന ദണ്ഡുകൾ, തൂണുകൾ, ചുവടുകൾ[b], അതിന്റെ എല്ലാ ഉപകരണങ്ങൾ, അവയുമായി ബന്ധപ്പെട്ട എല്ലാ ജോലികളും.'
  to: 'മെരാരിയുടെ പുത്രന്മാരുടെ ഏൽപ്പിക്കപ്പെട്ട ചുമതല: തിരുനിവാസത്തിന്റെ ചട്ടക്കൂടുകൾ[a], അതിന്റെ ദണ്ഡുകൾ, തൂണുകൾ, അടിസ്ഥാനങ്ങൾ[b], അതിന്റെ സാമഗ്രികളെല്ലാം, അതുമായി ബന്ധപ്പെട്ട എല്ലാ സേവനവും[c].'
