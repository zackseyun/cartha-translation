id: NUM.3.14
reference: Numbers 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: ml
  text: 'യഹ്‌വെ[a] സീനായ് മരുഭൂമിയിൽവെച്ച് മോശയോട് ഇപ്രകാരം അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായം: ‘YHWH’; പരമ്പരാഗതമായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.'
    reason: ദൈവനാമത്തിന്റെ എബ്രായരൂപവും പരമ്പരാഗത പകരംവിവർത്തനവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അരുളിച്ചെയ്തു
  rationale: ദൈവം മോശയോടു സംസാരിക്കുന്ന പതിവ് ആഖ്യാനസൂത്രം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള לֵאמֹר-നോടൊപ്പം ‘ഇപ്രകാരം അരുളിച്ചെയ്തു’ എന്നു ചേർത്തിരിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോട്
  rationale: സംസാരത്തിന്റെ അഭിമുഖത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: בְּמִדְבַּר סִינַי
  choice: സീനായ് മരുഭൂമിയിൽവെച്ച്
  rationale: מִדְבָּר എന്നത് ജനവാസം കുറഞ്ഞ വനാന്തര/മരുപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; പഞ്ചഗ്രന്ഥസന്ദർഭത്തിൽ പരിചിതവും ഭൂമിശാസ്ത്രപരമായി യോജിച്ചതുമായ ‘മരുഭൂമി’ തിരഞ്ഞെടുത്തു.
- source_word: לֵאמֹר
  choice: ഇപ്രകാരം
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള അരുളപ്പാടിലേക്കു വായനക്കാരനെ നയിക്കുന്ന എബ്രായ സംസാര-ആമുഖസൂത്രത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു സ്ഥാനപ്പേരല്ല, ദൈവത്തിന്റെ വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു; ഉച്ചാരണപരമ്പരയെക്കുറിച്ചുള്ള വിവരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘അരുളിച്ചെയ്തു’ ദൈവിക പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച ഔന്നത്യം നിലനിർത്തുന്നു; അതേസമയം വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
