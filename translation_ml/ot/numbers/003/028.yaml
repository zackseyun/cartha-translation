id: NUM.3.28
reference: Numbers 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: ml
  text: ഒരു മാസം പ്രായമുള്ളവരും അതിനു മുകളിലുള്ളവരുമായ എല്ലാ ആൺമക്കളുടെയും എണ്ണം എട്ടായിരത്തി അറുനൂറായിരുന്നു; അവർ വിശുദ്ധസ്ഥലത്തിന്റെ[a] കാവൽച്ചുമതല വഹിച്ചവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധവസ്തുക്കളുടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: എല്ലാ ആൺപ്രജകളുടെയും എണ്ണം
  rationale: ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ സൂത്രവാക്യം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ശിശുക്കളെയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നതിനെക്കാൾ ‘ആൺപ്രജകൾ’ ഇവിടെ കൃത്യമാണ്.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: ഒരു മാസം പ്രായമുള്ളവർ മുതൽ അതിനു മുകളിലുള്ള
  rationale: ഹീബ്രായയിലെ പ്രായപരിധി സൂചിപ്പിക്കുന്ന പതിവ് പ്രയോഗം അർഥവ്യക്തമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: എണ്ണായിരത്തി അറുനൂറ്
  rationale: ഹീബ്രായ സംഖ്യയെ സാഹിത്യശൈലിക്ക് യോജിച്ച വിധത്തിൽ വാക്കുകളായി നൽകുന്നു.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: ചുമതല കാത്തുപോന്നവർ
  rationale: ഒരേ ധാതുകുടുംബത്തിൽപ്പെട്ട കൃതന്തവും നാമവും ചേർന്ന് ഏൽപ്പിക്കപ്പെട്ട തുടർച്ചയായ കാവൽച്ചുമതലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആ ആശയം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַקֹּדֶשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: ഇവിടെ ലേവ്യർ പരിപാലിക്കേണ്ട വിശുദ്ധമേഖലയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും ‘വിശുദ്ധവസ്തുക്കൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: הַקֹּדֶשׁ എന്ന പദത്തിന്റെ പരാമർശവിഷയം
  choice: വിശുദ്ധസ്ഥലം
  alternative: വിശുദ്ധവസ്തുക്കൾ
  rationale: സന്ദർഭം വിശുദ്ധമന്ദിരമേഖലയെ സൂചിപ്പിക്കാമെങ്കിലും, ഹീബ്രായ പദത്തിന് അതിലെ വിശുദ്ധവസ്തുക്കളെയും സൂചിപ്പിക്കാൻ കഴിയും. അതിനാൽ പ്രധാന പാഠത്തിൽ സ്ഥലം എന്ന വായനയും അടിക്കുറിപ്പിൽ വസ്തുക്കൾ എന്ന വായനയും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ദീർഘമായ ഹീബ്രായ നാമവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
