source:
  edition: WLC
  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: ml
  text: ലേവി ഗോത്രത്തെ അടുത്തേക്കു കൊണ്ടുവന്ന് അഹരോൻ പുരോഹിതന്റെ മുമ്പിൽ നിർത്തുക; അവർ അവനെ സേവിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവനു ശുശ്രൂഷ ചെയ്യണം.” എബ്രായ ക്രിയ പരിചാരകസേവനത്തെയും ആരാധനാക്രമപരമായ ശുശ്രൂഷയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: അടുത്തുകൊണ്ടുവന്ന്
  rationale: קרב എന്ന ക്രിയയുടെ ഹിഫീൽ ആജ്ഞാരൂപം ‘അടുത്തേക്കു കൊണ്ടുവരുക’ എന്ന കാരണാർഥം നൽകുന്നു. ആരാധനാസംബന്ധമായ സമീപനത്തിന്റെ ദൃശ്യഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: מַטֵּה לֵוִי
  choice: ലേവി ഗോത്രത്തെ
  rationale: מַטֶּה എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വടി’ എന്നും സാമൂഹികസന്ദർഭത്തിൽ ‘ഗോത്രം’ എന്നും അർഥമുണ്ട്. ഇവിടെ ഉദ്ദേശിക്കുന്നത് ലേവ്യരുടെ ഗോത്രസമൂഹമായതിനാൽ ‘ലേവി ഗോത്രം’ യോജിക്കുന്നു.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: നിർത്തുക
  rationale: עמד എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘നിൽക്കുമാറാക്കുക, നിർത്തുക’ എന്നർഥം നൽകുന്നു. മലയാളത്തിൽ മുൻക്രിയയോടു ചേർന്ന ആജ്ഞാരൂപം സ്വാഭാവികവും മൂലത്തിലെ കാരണാർഥത്തിന് അനുയോജ്യവുമാണ്.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: അഹരോൻ പുരോഹിതന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥലസംബന്ധമായ അർഥം ‘മുമ്പിൽ’ എന്നാണ്; ഔദ്യോഗികമായി ഹാജരാക്കുന്ന സന്ദർഭത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: അവർ അവനെ സേവിക്കണം
  rationale: שרת എന്ന ക്രിയ പരിചരണപരമോ ആരാധനാക്രമപരമോ ആയ സേവനത്തെ സൂചിപ്പിക്കാം. אֹתוֹ എന്ന പ്രത്യക്ഷകർമ സർവനാമം അഹരോനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനെ’ വ്യക്തമായി നിലനിർത്തുന്നു. ഏകവചനമായ ‘ഗോത്രം’ എന്ന സമൂഹനാമത്തിനു പിന്നാലെ മൂലത്തിൽ വരുന്ന ബഹുവചനക്രിയ മലയാളത്തിൽ ‘അവർ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: അഹരോനോടുള്ള ലേവ്യരുടെ സേവനത്തിന്റെ സ്വഭാവം
  choice: ലേവ്യർ അഹരോനെ സേവിക്കണം
  alternative: ലേവ്യർ അഹരോനോടൊപ്പം സേവിക്കണം
  rationale: וְשֵׁרְתוּ אֹתוֹ എന്നതിലെ പ്രത്യക്ഷകർമ സർവനാമം സ്വാഭാവികമായി അഹരോനെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ മൂലത്തിൽ പറയാത്ത ‘അവനോടൊപ്പം’ എന്ന ആശയം ചേർക്കാതെ, പുരോഹിതചുമതലയിൽ അഹരോന് നൽകുന്ന സേവനം എന്ന ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാശൈലി ഉപയോഗിച്ചു. ‘ശുശ്രൂഷ’ എന്ന കൂടുതൽ ആരാധനാസംബന്ധമായ പദം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ അടിക്കുറിപ്പിൽ നൽകി; മുഖ്യവാചകത്തിലെ ‘സേവിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
