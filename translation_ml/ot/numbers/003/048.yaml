  text: וְ/נָתַתָּ֣ה הַ/כֶּ֔סֶף לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו פְּדוּיֵ֕י הָ/עֹדְפִ֖ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: ml
  text: അവരിൽ അധികമുള്ളവരുടെ വീണ്ടെടുപ്പുവിലയായ വെള്ളി അഹരോനും അവന്റെ പുത്രന്മാർക്കും കൊടുക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “അവരിൽ അധികമുള്ളവരിൽപ്പെട്ട വീണ്ടെടുക്കപ്പെട്ടവരുടെ വെള്ളി.” എബ്രായത്തിൽ ആശയം ഒരു ചുരുക്കിയ ബന്ധിത പദശൃംഖലയായാണ് വരുന്നത്; മുഖ്യപാഠം സന്ദർഭാർഥം വ്യക്തമായി തുറന്നുപറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: കൊടുക്കണം
  rationale: നിർദേശപരമായ സന്ദർഭത്തിലെ സംയോജകപൂർവമുള്ള ഖാൽ പൂർണ്ണക്രിയയെ സ്വാഭാവികമായ മലയാള വിധിരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ ക്രമവും നിർദേശത്തിന്റെ ബലവും നിലനിർത്തുന്നു.
- source_word: הַכֶּסֶף
  choice: വെള്ളി
  rationale: כֶּסֶף എന്നതിന്റെ പ്രാഥമിക അർഥം ‘വെള്ളി’ എന്നാണ്; ഇവിടെ അത് പണമടക്കത്തെ സൂചിപ്പിച്ചാലും മൂലപദത്തിന്റെ രൂപകൽപ്പന നിലനിർത്തുന്നു.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: അഹരോനും അവന്റെ പുത്രന്മാർക്കും
  rationale: ആവർത്തിച്ച לְ ബന്ധത്തെ മലയാളത്തിലെ ദാതൃവിഭക്തിയിലൂടെ വ്യക്തമായി നൽകുന്നു; പുരോഹിതപരമായ സന്ദർഭത്തിൽ בָּנָיו എന്നത് ‘പുത്രന്മാർ’ എന്നു കൃത്യമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: פְּדוּיֵי
  choice: വീണ്ടെടുപ്പുവിലയായ
  rationale: ഈ construct രൂപം ‘വീണ്ടെടുക്കപ്പെട്ടവർ’ എന്നോ അവരുമായി ബന്ധപ്പെട്ട വീണ്ടെടുപ്പുതുക എന്നോ ചുരുക്കമായി സൂചിപ്പിക്കാം. הַכֶּסֶף കർമമായതിനാൽ ഇവിടെ വെള്ളി വീണ്ടെടുപ്പുവിലയാണെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി തുറന്നുകാട്ടുന്നു.
- source_word: הָעֹדְפִים
  choice: അധികമുള്ളവരുടെ
  rationale: ലേവ്യരുടെ എണ്ണത്തെക്കാൾ കൂടുതലായിരുന്ന ഇസ്രായേൽ ആദ്യജാതരെ സൂചിപ്പിക്കുന്ന participle-ന്റെ താരതമ്യപരമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: בָּהֶם
  choice: അവരിൽ
  rationale: കണക്കാക്കിയ കൂട്ടത്തിനുള്ളിലെ അധികസംഖ്യയെ സൂചിപ്പിക്കുന്ന ബന്ധാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
