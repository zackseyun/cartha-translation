  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പിതൃഭവനം’ എന്ന സ്രോതസ്സിനോടടുത്ത പദത്തിന്റെ പുരാതന സാമൂഹിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
