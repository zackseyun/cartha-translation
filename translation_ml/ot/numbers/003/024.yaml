id: NUM.3.24
reference: Numbers 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: ml
  text: ഗേർശോന്യരുടെ പിതൃഭവനത്തിന്റെ തലവൻ ലായേലിന്റെ മകൻ എല്യാസാഫ് ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പിതാവിന്റെ ഭവനം’; ഇസ്രായേലിൽ ഒരു പൂർവപിതാവിൽനിന്നുള്ള വിപുലകുടുംബത്തെയോ കുലഘടകത്തെയോ സൂചിപ്പിച്ചിരുന്ന ബന്ധുത്വപദം.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: തലവൻ
  rationale: נָשִׂיא ഇവിടെ രാജകീയ പദവിയെയല്ല, ഗോത്രകുടുംബത്തിന്റെ ഔദ്യോഗിക നേതാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. വാക്യാരംഭത്തിലെ ו പട്ടികയുടെ തുടർച്ച കാണിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യബന്ധത്തിനായി പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: בֵּית אָב
  choice: പിതൃഭവനം
  rationale: അക്ഷരാർഥത്തിൽ ‘പിതാവിന്റെ ഭവനം’; ഇസ്രായേലിലെ പിതൃവംശാധിഷ്ഠിതമായ വിപുലകുടുംബത്തെയോ കുലഘടകത്തെയോ സൂചിപ്പിക്കുന്ന സാങ്കേതിക ബന്ധുത്വപദം. സാംസ്കാരിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: ഗേർശോന്യരുടെ
  rationale: ഗേർശോനിൽനിന്നുള്ള വംശസമൂഹത്തോടുള്ള ബന്ധമാണ് לַ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സമൂഹവാചകമായ ബഹുവചനബന്ധരൂപം സ്വാഭാവികമാണ്.
- source_word: אֶלְיָסָף
  choice: എല്യാസാഫ്
  rationale: വ്യക്തിനാമം ഹീബ്രു ഉച്ചാരണത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: בֶּן
  choice: മകൻ
  rationale: വംശാവലിസംബന്ധമായ സാധാരണ പിതൃപുത്രബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: לָאֵל
  choice: ലായേൽ
  rationale: വ്യക്തിനാമം ഹീബ്രു രൂപത്തെ സമീപിക്കുന്ന വിധത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
