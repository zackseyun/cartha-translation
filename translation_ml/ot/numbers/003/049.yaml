id: NUM.3.49
reference: Numbers 3:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: ml
  text: മോശെ, ലേവ്യരാൽ വീണ്ടെടുക്കപ്പെട്ടവരുടെ എണ്ണത്തെക്കാൾ അധികമായിരുന്നവരിൽനിന്ന് വീണ്ടെടുപ്പുതുക[a] എടുത്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോചനത്തുക.” വീണ്ടെടുക്കുന്നതിനായി നൽകുന്ന തുകയെ ഹീബ്രായപദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, വീണ്ടെടുപ്പിന്റെ കണക്കിൽ ലേവ്യർ പ്രതിനിധാനം ചെയ്തവരുടെ എണ്ണത്തെക്കാൾ അധികമായിരുന്ന ഇസ്രായേല്യരിൽനിന്ന്.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: വാങ്ങി
  rationale: לקח എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എടുത്തു’ എന്നാണെങ്കിലും, പണം വ്യക്തികളിൽനിന്ന് സ്വീകരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘വാങ്ങി’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്; ഇത് വാങ്ങൽ എന്ന വ്യാപാരാർഥത്തിലല്ല, പണം കൈപ്പറ്റുക എന്ന അർഥത്തിലാണ്.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: വീണ്ടെടുപ്പുവില
  rationale: പകരമായി നൽകി വീണ്ടെടുക്കുന്നതിനുള്ള തുകയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വീണ്ടെടുപ്പിന്റെ വെള്ളി’ എന്ന അക്ഷരാർഥ വിവർത്തനത്തേക്കാൾ ‘വീണ്ടെടുപ്പുവില’ നിയമപരവും ആചാരപരവുമായ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: מֵאֵת
  choice: …വരിൽനിന്ന്
  rationale: തുക ലഭിച്ച ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളരൂപം.
- source_word: הָעֹדְפִים
  choice: അധികമായിരുന്നവർ
  rationale: עודף എന്ന പദത്തിന്റെ താരതമ്യപരമായ ‘എണ്ണത്തിൽ മിച്ചമായിരിക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘ആദ്യജാതർ’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: עַל
  choice: എണ്ണത്തെക്കാൾ
  rationale: ഇവിടെ സംഖ്യാത്മകമായ അധികത്തെ സൂചിപ്പിക്കുന്ന താരതമ്യപ്രയോഗമാണ്; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘എണ്ണത്തെക്കാൾ’ സ്വാഭാവികമാണ്.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: ലേവ്യരാൽ വീണ്ടെടുക്കപ്പെട്ടവർ
  rationale: ഈ ഘടന ലേവ്യരുടെ പകരസ്ഥാനം മുഖേന വീണ്ടെടുപ്പിന്റെ കണക്കിൽ ഉൾപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ഹീബ്രായ നിർമാണത്തിലെ ബന്ധം ഏതാനും വിശാലമാണെങ്കിലും, സന്ദർഭത്തിൽ ഈ വിവർത്തനം വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: פְּדוּיֵי הַלְוִיִּם എന്ന ഘടനയിൽ ലേവ്യരുടെ പങ്ക്
  choice: ലേവ്യരാൽ വീണ്ടെടുക്കപ്പെട്ടവർ
  alternative: ലേവ്യരുടെ വീണ്ടെടുക്കപ്പെട്ടവർ
  rationale: മലയാളത്തിൽ ബന്ധസൂചകമായ അക്ഷരാർഥരൂപം അസ്വാഭാവികവും അവ്യക്തവുമാകും. മുൻസന്ദർഭത്തിലെ പകരസ്ഥാനം വ്യക്തമാക്കുന്ന കർമണിപ്രയോഗം സ്വീകരിച്ചെങ്കിലും, അതിന്റെ കണക്കുസംബന്ധമായ അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സംഖ്യാത്മക താരതമ്യം വ്യക്തമാക്കാൻ ‘എണ്ണത്തെക്കാൾ’ ചേർത്തു; സന്ദർഭത്തിൽനിന്നുള്ള ‘ആദ്യജാതർ’ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിലൂടെ കണക്കിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കി.
