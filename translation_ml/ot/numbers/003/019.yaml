id: NUM.3.19
reference: Numbers 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ml
  text: 'കെഹാത്തിന്റെ പുത്രന്മാർ, അവരുടെ വംശങ്ങൾ അനുസരിച്ച്: അമ്രാം, യിസ്ഹാർ, ഹെബ്രോൻ, ഉസ്സീയേൽ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: പുത്രന്മാർ
  rationale: בְּנֵי എന്ന സംയുക്ത ബഹുവചനം നേരിട്ട് ‘പുത്രന്മാർ’ എന്നാണ്. വംശാവലിപ്പട്ടികയുടെ പശ്ചാത്തലത്തിൽ ഇവർ വംശശാഖകളുടെ പൂർവികരുമാണ്; എങ്കിലും എബ്രായരൂപം നിലനിർത്താൻ ‘പുത്രന്മാർ’ സ്വീകരിച്ചു. വാക്യാരംഭത്തിലെ וּ മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പട്ടികാശൈലിക്കായി അത് പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കാതെ ഘടനയിലൂടെ പ്രകടമാക്കി.
- source_word: קְהָת
  choice: കെഹാത്ത്
  rationale: വ്യക്തിനാമം; എബ്രായ ഉച്ചാരണത്തോട് അടുത്തും മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികവുമായ ലിപ്യന്തരണം.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ വംശങ്ങൾപ്രകാരം
  rationale: מִשְׁפָּחָה ഇവിടെ ഇസ്രായേലിന്റെ ഗോത്രഘടനയ്ക്കുള്ളിലെ കുടുംബവംശശാഖയെ സൂചിപ്പിക്കുന്നു. ‘കുടുംബങ്ങൾ’ എന്നതിനെക്കാൾ ‘വംശങ്ങൾ’ ഈ പട്ടികാസന്ദർഭത്തിലെ സാമൂഹിക ഘടകത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: עַמְרָם
  choice: അമ്രാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: וְיִצְהָר
  choice: യിസ്ഹാർ
  rationale: വ്യക്തിനാമത്തിന്റെ എബ്രായരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം; സംയോജകാക്ഷരം പട്ടികയിലെ വിരാമചിഹ്നക്രമത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: חֶבְרוֹן
  choice: ഹെബ്രോൻ
  rationale: ഇവിടെ സ്ഥലനാമമല്ല, വ്യക്തിനാമമാണ്; അതേ എബ്രായരൂപം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְעֻזִּיאֵל
  choice: ഉസ്സീയേൽ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; അവസാനത്തെ וְ മലയാള പട്ടികയിലെ അവസാന അംഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ക്രമത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പട്ടികാശൈലി. സാങ്കേതികമായ ഗോത്രവിഭാഗസൂചനയ്ക്കായി ‘വംശങ്ങൾപ്രകാരം’ ഉപയോഗിച്ചു; അനാവശ്യ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
