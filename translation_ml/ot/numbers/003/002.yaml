source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי אַהֲרֹ֖ן הַ/בְּכ֣וֹר נָדָ֑ב וַ/אֲבִיה֕וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: ml
  text: 'അഹരോന്റെ പുത്രന്മാരുടെ പേരുകൾ ഇവയാണ്: ആദ്യജാതനായ നാദാബ്, അബീഹൂ, എലെയാസാർ, ഈഥാമാർ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ഇവയാണ്
  rationale: പട്ടികയെ ചൂണ്ടിക്കാട്ടി അവതരിപ്പിക്കുന്ന പ്രയോഗം. വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: അഹരോന്റെ പുത്രന്മാരുടെ പേരുകൾ
  rationale: എബ്രായ നിർമാണബന്ധത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ഉടമസ്ഥപ്രയോഗമായി നൽകി.
- source_word: הַבְּכֹר
  choice: ആദ്യജാതനായ
  rationale: ഇത് പ്രായത്തിൽ മൂത്തവൻ എന്നതിലുപരി ജനനക്രമത്തിലെ ആദ്യജാതസ്ഥാനം സൂചിപ്പിക്കുന്നു; നാദാബിനെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ നൽകി.
- source_word: נָדָב
  choice: നാദാബ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: וַאֲבִיהוּא
  choice: അബീഹൂ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; പട്ടികയിലെ ബന്ധം വിരാമചിഹ്നങ്ങൾകൊണ്ട് വ്യക്തമാണ്.
- source_word: אֶלְעָזָר
  choice: എലെയാസാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ രൂപത്തിൽ നൽകി.
- source_word: וְאִיתָמָר
  choice: ഈഥാമാർ
  rationale: വ്യക്തിനാമം മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ രൂപത്തിൽ നൽകി; അവസാന പട്ടികാസന്ധി മലയാളത്തിൽ നിർബന്ധമായി ആവർത്തിക്കാതെ സ്വാഭാവിക പട്ടികാശൈലി പാലിച്ചു.
