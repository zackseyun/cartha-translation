id: NUM.3.20
reference: Numbers 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: ml
  text: 'മെരാരിയുടെ പുത്രന്മാർ, അവരുടെ കുലങ്ങളനുസരിച്ച്: മഹ്ലിയും മൂശിയും. ഇവയാണ് ലേവ്യരുടെ[a] പിതൃഭവനങ്ങൾക്കനുസരിച്ചുള്ള കുലങ്ങൾ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ലേവിയുടെ കുലങ്ങൾ.” ഹീബ്രുവിൽ “ലേവ്യൻ” എന്ന ഏകവചന ജാതിനാമമാണ്; അത് സമൂഹത്തെ ഒന്നായി സൂചിപ്പിക്കുകയോ ഗോത്രപിതാവായ ലേവിയെ സൂചിപ്പിക്കുകയോ ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: മെരാരിയുടെ പുത്രന്മാർ
  rationale: בְּנֵי എന്ന വംശാവലിപദത്തിന്റെ നേരായ അർഥമായ ‘പുത്രന്മാർ’ നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ וּ പട്ടികയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകം ‘എന്നാൽ/കൂടാതെ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: לְמִשְׁפְּחֹתָם
  choice: അവരുടെ കുലങ്ങളനുസരിച്ച്
  rationale: לְ ഇവിടെ വിഭാഗീകരണം സൂചിപ്പിക്കുന്നു; מִשְׁפָּחוֹת ഗോത്രത്തിനുള്ളിലെ ബന്ധുത്വവിഭാഗങ്ങളായതിനാൽ ‘കുലങ്ങൾ’ യോജിക്കുന്നു.
- source_word: מַחְלִי וּמוּשִׁי
  choice: മഹ്ലിയും മൂശിയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി പകർന്നു; ഹീബ്രു സംയോജകവും നിലനിർത്തി.
- source_word: אֵלֶּה הֵם
  choice: ഇവയാണ്
  rationale: ചൂണ്ടിക്കാണിച്ചുള്ള തിരിച്ചറിയൽപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: ലേവ്യരുടെ കുലങ്ങൾ
  rationale: הַלֵּוִי രൂപത്തിൽ ഏകവചന ജാതിനാമമാണെങ്കിലും ഇവിടെ കുലങ്ങളുടെ സമൂഹപരമായ ഗോത്രബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനസമൂഹാർത്ഥം നൽകി; മൂലത്തിലെ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങളനുസരിച്ചുള്ള
  rationale: בֵּית אָבוֹת എന്ന ബന്ധുത്വ-ഭരണപരമായ പ്രയോഗത്തെ ‘പിതൃഭവനങ്ങൾ’ എന്നു നൽകി, കുലം എന്നതിൽനിന്നുള്ള ഘടനാപരമായ വ്യത്യാസം നിലനിർത്തുന്നു; לְ വിഭാഗീകരണാർത്ഥത്തിൽ ‘അനുസരിച്ചുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: הַלֵּוִי എന്ന ഏകവചന ജാതിനാമത്തിന്റെ സൂചന
  choice: പ്രധാനവാചകത്തിൽ ‘ലേവ്യരുടെ’ എന്ന സമൂഹബഹുവചനം
  alternative: ‘ലേവിയുടെ’ അല്ലെങ്കിൽ ‘ലേവ്യന്റെ’
  rationale: സന്ദർഭത്തിൽ അനേകം കുലങ്ങളെ ലേവ്യഗോത്രവുമായി ബന്ധിപ്പിക്കുന്നതാണ് സ്വാഭാവിക വായന. എന്നാൽ ഈ രൂപം ഗോത്രപിതാവായ ലേവിയെ സൂചിപ്പിക്കാനും സമൂഹാർത്ഥത്തിൽ ‘ലേവ്യൻ’ എന്നു പ്രവർത്തിക്കാനും കഴിയുന്നതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി ഉപയോഗിച്ചു. ഗോത്രഘടനയിലെ מִשְׁפָּחוֹת, בֵּית אָבוֹת എന്നീ വ്യത്യസ്ത തലങ്ങൾ യഥാക്രമം ‘കുലങ്ങൾ’, ‘പിതൃഭവനങ്ങൾ’ എന്നു വേർതിരിച്ചു.
