  terminology: “പുത്രന്മാർ,” “കുലങ്ങൾ,” and “പിതൃഭവനങ്ങൾ” suitably preserve the formal genealogical and kinship-register distinctions in the Hebrew. The names are acceptably transliterated. The footnote correctly represents the singular gentilic’s collective or eponymic ambiguity.
