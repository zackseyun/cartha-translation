translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘പിതൃഭവനം’, ‘കുലം’ എന്നീ പദങ്ങൾ വ്യത്യസ്ത വംശാവലി ഘടകങ്ങളെ നിലനിർത്തുന്നു.
