source:
  edition: WLC
  text: פְּקֹד֙ אֶת בְּנֵ֣י לֵוִ֔י לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָ֛ר מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה תִּפְקְדֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: ml
  text: ലേവിയുടെ പുത്രന്മാരെ അവരുടെ പിതൃഭവനങ്ങൾക്കും കുലങ്ങൾക്കും അനുസരിച്ച് എണ്ണുക. ഒരു മാസം പ്രായമുള്ളവർ മുതൽ അതിനുമുകളിലുള്ള എല്ലാ ആൺപ്രജകളെയും നീ എണ്ണണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലേവിയുടെ പുത്രന്മാർ’ എന്നതിന് ‘ലേവ്യർ’ എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ അക്ഷരാർഥം ‘ലേവിയുടെ പുത്രന്മാർ’ എന്നാണ്; അത് വംശപരമ്പരയ്ക്കും കുലഘടനയ്ക്കും ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: എണ്ണുക / നീ എണ്ണണം
  rationale: ഈ ഭരണപരമായ സന്ദർഭത്തിൽ פקד ആളുകളെ എണ്ണുകയോ പട്ടികപ്പെടുത്തുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. സൈനികഭാവം ചേർക്കാതെ കല്പനയും തുടർന്നുള്ള നിർദേശവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בְּנֵי לֵוִי
  choice: ലേവിയുടെ പുത്രന്മാർ
  rationale: എബ്രായത്തിലെ അക്ഷരാർഥമായ വംശാവലി പ്രയോഗം നിലനിർത്തുന്നു; പിന്നാലെ വരുന്ന പിതൃഭവനം, കുലം എന്നീ ഘടനകളോടും യോജിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങൾപ്രകാരം
  rationale: പിതൃവംശത്തെ അടിസ്ഥാനമാക്കിയ കുടുംബഘടകത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സംക്ഷിപ്തമായും വ്യത്യസ്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: לְמִשְׁפְּחֹתָם
  choice: കുലങ്ങൾപ്രകാരം
  rationale: മുൻപുള്ള പിതൃഭവനങ്ങളിൽനിന്ന് മִשְׁפָּחָה എന്ന ബന്ധുത്വവിഭാഗത്തെ വേർതിരിച്ചുകാണിക്കാൻ ‘കുലങ്ങൾ’ ഉപയോഗിക്കുന്നു.
- source_word: כָּל זָכָר
  choice: എല്ലാ ആൺകുട്ടികളും
  rationale: ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാർ മാത്രമല്ല, ഒരു മാസം പ്രായമുള്ള ശിശുക്കളും ഉൾപ്പെടുന്നതിനാൽ ‘പുരുഷന്മാർ’ എന്നതിനെക്കാൾ പ്രായപരിധിയോട് യോജിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: ഒരു മാസം പ്രായമുള്ളതുമുതൽ മേലോട്ടുള്ള
  rationale: എണ്ണലിന്റെ കുറഞ്ഞ പ്രായപരിധി വ്യക്തമാക്കുന്ന മൂലഭാഷയിലെ ഘടനയോട് അടുത്തുനിൽക്കുന്നു.
