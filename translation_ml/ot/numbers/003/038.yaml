id: NUM.3.38
reference: Numbers 3:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: ml
  text: തിരുനിവാസത്തിന്റെ മുൻവശത്ത് കിഴക്കുവശത്തായി[a]—സമാഗമകൂടാരത്തിന്റെ മുൻവശത്ത്, സൂര്യോദയദിക്കിൽ—പാളയമിറങ്ങിയിരുന്നത് മോശയും അഹരോനും അവന്റെ പുത്രന്മാരുമായിരുന്നു. അവർ ഇസ്രായേൽമക്കൾക്കുവേണ്ടി വിശുദ്ധസ്ഥലത്തിന്റെ കാവൽച്ചുമതല നിർവഹിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ അധികാരമില്ലാത്ത ഒരാൾ[b] അടുത്തുവന്നാൽ അയാൾ വധിക്കപ്പെടണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിഴക്കോട്ട് … കിഴക്കുവശത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഊന്നലിനായി എബ്രായപാഠം പരസ്പരം ബന്ധപ്പെട്ട രണ്ടു ദിശാപ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘അധികാരമില്ലാത്ത ഒരാൾ’ എന്നു പറയുന്നത് വിശുദ്ധസ്ഥലസേവനത്തെ സമീപിക്കാൻ അനുമതി ലഭിക്കാത്ത വ്യക്തിയെയാണ്; വംശീയമായി വിദേശിയായ ഒരാളെ പ്രത്യേകം ഉദ്ദേശിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: പാളയമിറങ്ങിയിരുന്നത്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകൃത്ത് രൂപം ഇവിടെ പാളയക്രമത്തിൽ നിയോഗിക്കപ്പെട്ടവരെ വിവരിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭോചിതമായ വിവരണഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: തിരുനിവാസത്തിന്റെ മുൻവശത്ത്
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു; מִשְׁכָּן എന്നത് തുടർന്നുള്ള ‘സമാഗമകൂടാരം’ എന്ന പ്രയോഗത്തിൽനിന്ന് വേർതിരിച്ചും പദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന ആശയം സൂക്ഷിച്ചും പരിഭാഷപ്പെടുത്തി.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: കിഴക്കുവശത്തായി ... സൂര്യോദയദിക്കിൽ
  rationale: എബ്രായത്തിലെ പരസ്പരം ബന്ധപ്പെട്ട രണ്ടു ദിശാപ്രയോഗങ്ങളും ഒരേ പദമായി ചുരുക്കാതെ, കിഴക്കൻ ദിശയ്ക്കുള്ള ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരം
  rationale: ദൈവസന്നിധിയിൽ കൂടിവരുന്നതിനായി നിശ്ചയിക്കപ്പെട്ട കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: മോശയും അഹരോനും അവന്റെ പുത്രന്മാരും
  rationale: ‘അവന്റെ’ എന്ന ഏകവചന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി അടുത്തുള്ള അഹരോനെ സൂചിപ്പിക്കുന്നു; എബ്രായവ്യാകരണത്തിന്റെ ഈ വിശദാംശം നിലനിർത്തുന്നു.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: ചുമതല കാത്തുപോന്നു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള എബ്രായ ക്രിയയും നാമവും ചേർന്ന് ഏല്പിക്കപ്പെട്ട സംരക്ഷണച്ചുമതല നിർവഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ കാവൽ-ഉത്തരവാദിത്വ ഭാവം നിലനിർത്തുന്നു.
- source_word: הַמִּקְדָּשׁ
  choice: വിശുദ്ധസ്ഥലം
  rationale: ഇവിടെ ഒരു മുറി മാത്രമല്ല, വിശുദ്ധമായ സങ്കേതത്തെയും അതുമായി ബന്ധപ്പെട്ട സേവനമേഖലയെയും വിശാലമായി സൂചിപ്പിക്കുന്നു; പിന്നീട് പണിയുന്ന ആലയവുമായി അനാവശ്യമായി കലരാതിരിക്കാനാണ് ‘മന്ദിരം’ ഒഴിവാക്കിയത്.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്കുവേണ്ടി
  rationale: ഇസ്രായേൽസമൂഹത്തിനുവേണ്ടി പ്രതിനിധികളായി ഈ വിശുദ്ധചുമതല നിർവഹിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘ചുമതല’ എന്ന ആശയം മുൻപത്തെ വാക്യഭാഗത്തിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഉടമ്പടിസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന എബ്രായ കുടുംബപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: וְהַזָּר
  choice: അധികാരമില്ലാത്ത ഒരാൾ
  rationale: സന്ദർഭത്തിൽ זָר വംശീയമായി വിദേശിയായ ഒരാളെക്കാൾ വിശുദ്ധസേവനത്തെ സമീപിക്കാൻ അനുമതിയില്ലാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; തെറ്റായ വംശീയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: הַקָּרֵב
  choice: അടുത്തുവന്നാൽ
  rationale: വിശുദ്ധസേവനമേഖലയിലേക്കുള്ള അനധികൃത സമീപനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാഭാവം സുതാര്യമായി നൽകുന്നു.
- source_word: יוּמָת
  choice: വധിക്കപ്പെടണം
  rationale: ഹോഫാൽ രൂപത്തിലെ കാരണക-കർമണി ഭാവം സാധാരണ മരണമല്ല, നടപ്പാക്കപ്പെടേണ്ട മരണശിക്ഷയാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ പുത്രന്മാർ’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: അഹരോന്റെ പുത്രന്മാർ
  alternative: മോശയോടും അഹരോനോടും പൊതുവായി ബന്ധപ്പെട്ട കുടുംബാംഗങ്ങൾ
  rationale: ‘അഹരോൻ’ എന്ന അടുത്തുള്ള ഏകവചന നാമത്തിനു ശേഷമുള്ള മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം അഹരോനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ഈ അധ്യായത്തിലെ പുരോഹിതചുമതലയും അഹരോനും പുത്രന്മാർക്കുമാണ്.
- issue: വിശുദ്ധസ്ഥലനിയമത്തിലെ זָר എന്ന പദത്തിന്റെ അർഥം
  choice: വിശുദ്ധസേവനത്തെ സമീപിക്കാൻ അധികാരമില്ലാത്ത വ്യക്തി
  alternative: വംശീയമായി വിദേശിയായ വ്യക്തി അല്ലെങ്കിൽ പൊതുവായ അർഥത്തിലെ അപരിചിതൻ
  rationale: അടുത്തുള്ള സന്ദർഭം പാളയക്രമം, പുരോഹിതചുമതല, വിശുദ്ധസ്ഥലത്തിലേക്കുള്ള പ്രവേശനം എന്നിവയെക്കുറിച്ചാണ്; അതിനാൽ വ്യത്യാസം വംശീയതയല്ല, നിയോഗവും അധികാരവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘തിരുനിവാസം’ എന്നും ‘സമാഗമകൂടാരം’ എന്നും ഉള്ള വ്യത്യസ്ത എബ്രായ നാമങ്ങൾ വേർതിരിച്ചു; ദിശാസൂചനയിലെ ആവർത്തന ഊന്നലും അഹരോനെ സൂചിപ്പിക്കുന്ന ഏകവചന സർവനാമവും സംരക്ഷിച്ചു. മരണശിക്ഷയുടെ നിയമഭാവം മൃദൂകരിക്കാതെ ‘വധിക്കപ്പെടണം’ എന്നു നൽകി.
