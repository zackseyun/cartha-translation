revisions:
- from: തിരുനിവാസത്തിന്റെ മുൻവശത്ത് കിഴക്കുവശത്തായി[a]—സമാഗമകൂടാരത്തിന്റെ മുൻവശത്ത്, സൂര്യോദയദിക്കിൽ—പാളയമിറങ്ങിയിരുന്നത് മോശയും അഹരോനും അവന്റെ പുത്രന്മാരുമായിരുന്നു. അവർ ഇസ്രായേൽമക്കൾക്കുവേണ്ടി വിശുദ്ധസ്ഥലത്തിന്റെ ചുമതല കാത്തുപോന്നു. എന്നാൽ അധികാരമില്ലാത്ത ഒരാൾ[b] അടുത്തുവന്നാൽ അയാൾ വധിക്കപ്പെടണം.
  to: തിരുനിവാസത്തിന്റെ മുൻവശത്ത് കിഴക്കുവശത്തായി[a]—സമാഗമകൂടാരത്തിന്റെ മുൻവശത്ത്, സൂര്യോദയദിക്കിൽ—പാളയമിറങ്ങിയിരുന്നത് മോശയും അഹരോനും അവന്റെ പുത്രന്മാരുമായിരുന്നു. അവർ ഇസ്രായേൽമക്കൾക്കുവേണ്ടി വിശുദ്ധസ്ഥലത്തിന്റെ കാവൽച്ചുമതല നിർവഹിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ അധികാരമില്ലാത്ത ഒരാൾ[b] അടുത്തുവന്നാൽ അയാൾ വധിക്കപ്പെടണം.
