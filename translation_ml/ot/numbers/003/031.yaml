  to: 'അവരുടെ ചുമതലയിൽ[a] പെട്ടവ ഇവയായിരുന്നു: പെട്ടകം, മേശ, വിളക്കുതണ്ട്, യാഗപീഠങ്ങൾ, അവ ഉപയോഗിച്ച് ശുശ്രൂഷ ചെയ്യുന്ന വിശുദ്ധസ്ഥലത്തെ ഉപകരണങ്ങൾ[b], തൂക്കുമറ[c], അതിന്റെ എല്ലാ സേവനവും.'
  rationale: കർത്താവിനെ അനാവശ്യമായി ചേർക്കാതെ, വിശുദ്ധ ഉപകരണങ്ങൾ സേവനത്തിനായി ഉപയോഗിക്കപ്പെടുന്നു എന്ന മൂലവാക്യത്തിന്റെ ബന്ധം നിലനിർത്തി. പ്രവേശനത്തിലെ മָסָךְ-നെയും അകത്തെ തിരശ്ശീലയെയും വേർതിരിച്ചുകാട്ടാൻ ‘മറശ്ശീല’ എന്നതിനുപകരം ‘തൂക്കുമറ’ ഉപയോഗിച്ചു. അവസാനത്തെ ഏകവചനപ്രത്യയത്തിന്റെ അവ്യക്തത ‘അതിന്റെ എല്ലാ സേവനവും’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
