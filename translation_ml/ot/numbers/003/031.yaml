source:
  edition: WLC
  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: ml
  text: 'അവരുടെ ചുമതലയിൽ[a] പെട്ടവ ഇവയായിരുന്നു: പെട്ടകം, മേശ, വിളക്കുതണ്ട്, യാഗപീഠങ്ങൾ, അവ ഉപയോഗിച്ച് ശുശ്രൂഷ ചെയ്യുന്ന വിശുദ്ധസ്ഥലത്തെ ഉപകരണങ്ങൾ[b], തൂക്കുമറ[c], അതിന്റെ എല്ലാ സേവനവും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കു ഏൽപ്പിച്ച ഉത്തരവാദിത്വം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധ ഉപകരണങ്ങൾ’ അല്ലെങ്കിൽ ‘വിശുദ്ധസ്ഥലത്തിലെ ഉപകരണങ്ങൾ.’
    reason: lexical_alternative
  - marker: c
    text: ഇത് പ്രവേശനത്തിലെ തൂക്കുമറയാണ്; അകത്തെ തിരശ്ശീലയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: അവരുടെ ചുമതലയിൽ പെട്ടവ ഇവയായിരുന്നു
  rationale: മִשְׁמֶרֶת കൂടാരസന്ദർഭത്തിൽ ഏൽപ്പിക്കപ്പെട്ട ചുമതലയെയോ ഉത്തരവാദിത്വത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള പട്ടികയുമായി സ്വാഭാവികമായി ചേരാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: הָאָרֹן
  choice: പെട്ടകം
  rationale: ഇവിടെ എബ്രായപാഠം വിശേഷണമൊന്നുമില്ലാതെ കൂടാരത്തിലെ വിശുദ്ധപെട്ടകത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ അധിക വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: הַשֻּׁלְחָן
  choice: മേശ
  rationale: മൂലപാഠത്തിലെ ലളിതമായ നാമത്തെ അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തുന്നു.
- source_word: הַמְּנֹרָה
  choice: വിളക്കുതണ്ട്
  rationale: കൂടാരത്തിലെ വിളക്കുകൾ വയ്ക്കുന്ന വിശുദ്ധ ഉപകരണത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: הַמִּזְבְּחֹת
  choice: യാഗപീഠങ്ങൾ
  rationale: എബ്രായത്തിലെ ബഹുവചനത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: വിശുദ്ധമന്ദിരത്തിലെ ഉപകരണങ്ങൾ
  rationale: כְּלִים എന്നത് പാത്രങ്ങൾ മാത്രമല്ല, വിവിധ ഉപകരണങ്ങളെയും സൂചിപ്പിക്കാം; הַקֹּדֶשׁ ഇവിടെ വിശുദ്ധമന്ദിരസന്ദർഭമാണ്.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: അവ ഉപയോഗിച്ച് അവർ ശുശ്രൂഷ ചെയ്യുന്ന
  rationale: בָהֶם ഉപകരണസ്വഭാവം സൂചിപ്പിക്കുന്നതിനാൽ ‘അവ ഉപയോഗിച്ച്’ എന്നും, שׁרת-ന്റെ ആരാധനാസംബന്ധമായ ഭാവം നിലനിർത്താൻ ‘ശുശ്രൂഷ’ എന്നും നൽകി.
- source_word: הַמָּסָךְ
  choice: മറശ്ശീല
  rationale: ഇത് പ്രവേശനത്തിലെ തൂക്കുമറയാണ്; അകത്തെ തിരശ്ശീലയെ സൂചിപ്പിക്കുന്ന פָּרֹכֶת എന്ന പദവുമായി കലരാതിരിക്കാൻ ‘മറശ്ശീല’ തിരഞ്ഞെടുത്തു.
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: അതിന്റെ എല്ലാ ശുശ്രൂഷയും
  rationale: עֲבֹדָהയുടെ ആരാധനാസംബന്ധമായ അർഥം ‘ശുശ്രൂഷ’ നിലനിർത്തുന്നു. ഏകവചന സർവനാമപ്രത്യയം ‘അതിന്റെ’ എന്ന് നൽകി, അതിന്റെ മുൻഗാമിയെ അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല.
theological_decisions:
- issue: കൂടാരശുശ്രൂഷയെ സൂചിപ്പിക്കുന്ന ആരാധനാസംബന്ധമായ പദപ്രയോഗം
  choice: ‘ശുശ്രൂഷ’ എന്ന പദം ഉപയോഗിക്കുക
  alternative: ‘സേവനം’ അല്ലെങ്കിൽ ‘വേല’ എന്ന് ഉപയോഗിക്കുക
  rationale: വാക്യം ഭരണപരമായ ചുമതലകളെപ്പറ്റിയാണെങ്കിലും שׁרת, עֲבֹדָה എന്നീ പദങ്ങൾക്ക് ഇവിടെ വിശുദ്ധകൂടാരത്തിലെ ആരാധനാസേവനത്തിന്റെ ഭാവമുണ്ട്. ‘ശുശ്രൂഷ’ ആ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: וְכֹל עֲבֹדָתוֹയിലെ ഏകവചനപ്രത്യയത്തിന്റെ മുൻഗാമി
  choice: ‘അതിന്റെ എല്ലാ ശുശ്രൂഷയും’ എന്നു നൽകി അവ്യക്തത നിലനിർത്തുക
  alternative: ‘ഈ വസ്തുക്കളുമായി ബന്ധപ്പെട്ട എല്ലാ ശുശ്രൂഷയും’ എന്ന് അർഥം വ്യക്തമാക്കുക
  rationale: മൂലപാഠത്തിലെ 3-ാം പുരുഷ ഏകവചന പുല്ലിംഗപ്രത്യയത്തിന്റെ മുൻഗാമി വാക്യത്തിൽ പൂർണമായി വ്യക്തമല്ല. അതിനാൽ വ്യാഖ്യാനപരമായി പരിഹരിക്കാതെ മലയാളത്തിലും തുറന്ന നിലയിൽ വെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പട്ടികയുടെ ഔപചാരിക സ്വഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന ഉപയോഗിച്ചു; മതവിഭാഗവിശേഷമായ പദങ്ങൾ ഒഴിവാക്കി.
