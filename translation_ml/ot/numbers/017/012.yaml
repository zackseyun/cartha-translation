id: NUM.17.12
reference: Numbers 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: ml
  text: അപ്പോൾ അഹരോൻ മോശെ പറഞ്ഞതുപോലെ അത് എടുത്ത്[a] ജനസമൂഹത്തിന്റെ[b] നടുവിലേക്ക് ഓടി. അതാ, ജനത്തിന്റെ ഇടയിൽ ബാധ ആരംഭിച്ചിരുന്നു. അവൻ ധൂപം ഇട്ട്[c] ജനത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘എടുത്തു’ എന്നു മാത്രമാണ്; എന്താണ് എടുത്തതെന്ന് മുൻവാക്യത്തിലെ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
    reason: implicit_object
  - marker: b
    text: അല്ലെങ്കിൽ ‘സഭയുടെ’.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘ധൂപം വെച്ചു’; എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ ‘ധൂപം കൊടുത്തു/വെച്ചു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: അത് എടുത്ത്
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘എടുത്തു’ എന്നാണ്. എബ്രായപാഠത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ ധൂപകലശവും തീയും സംബന്ധിച്ച നിർദേശത്തിൽനിന്ന് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘അത്’ ചേർത്തിരിക്കുന്നു; അടിക്കുറിപ്പിൽ ഈ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: മോശെ പറഞ്ഞതുപോലെ
  rationale: דבר എന്നത് ഇവിടെ ‘പറയുക/സംസാരിക്കുക’ എന്നാണ്; സന്ദർഭത്തിൽ നിർദേശത്തിന്റെ ശക്തിയുണ്ടെങ്കിലും ‘കല്പിച്ചതുപോലെ’ എന്ന് വ്യാഖ്യാനിച്ച് കടുപ്പിക്കാതെ മൂലപദത്തോട് ചേർന്ന് നിൽക്കുന്നു.
- source_word: וַיָּרָץ אֶל־תּוֹךְ הַקָּהָל
  choice: ജനസമൂഹത്തിന്റെ നടുവിലേക്ക് ഓടി
  rationale: רוץ എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ഓടി’യും תּוֹךְ എന്നതിന്റെ ‘നടുവിൽ’ എന്ന സ്ഥലാർഥവും നിലനിർത്തുന്നു. קָהָל ഇവിടെ കൂടിയിരിക്കുന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജനസമൂഹം’ വ്യക്തവും സഭാസംബന്ധമായ അനാവശ്യ ധ്വനി കുറഞ്ഞതുമാണ്.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: ദൃശ്യത്തിലേക്ക് സജീവമായി ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ വ്യവഹാരശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: ജനത്തിന്റെ ഇടയിൽ ബാധ ആരംഭിച്ചിരുന്നു
  rationale: נֶגֶף ഇവിടെ ദൈവികവിധിയായ ബാധയെ സൂചിപ്പിക്കുന്നു. സംഭവസ്ഥലത്തെത്തുമ്പോഴേക്കും അത് തുടങ്ങിയിരുന്നു എന്ന ആഖ്യാനബന്ധം ‘ആരംഭിച്ചിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: וַיִּתֵּן אֶת־הַקְּטֹרֶת
  choice: ധൂപം ഇട്ട്
  rationale: נתן അക്ഷരാർഥത്തിൽ ‘കൊടുത്തു/വെച്ചു/ഇട്ടു’ എന്നാണ്. ആചാരപരമായ സന്ദർഭത്തിൽ ‘ധൂപം ഇട്ട്’ എന്നത് പ്രവർത്തി സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അർപ്പിച്ചു’ എന്ന് വ്യാഖ്യാനം അധികമായി ചേർക്കുന്നില്ല.
- source_word: וַיְכַפֵּר עַל־הָעָם
  choice: ജനത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്തു
  rationale: പുരോഹിതാചാരസന്ദർഭത്തിലെ כפר എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘പ്രായശ്ചിത്തം ചെയ്തു’ എന്ന സ്ഥാപിതവും വായനാസൗകര്യമുള്ളതുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുരോഹിതാചാരത്തിലെ כפר എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ജനത്തിനുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്തു
  alternative: ജനത്തിനുവേണ്ടി പരിഹാരം അനുഷ്ഠിച്ചു
  rationale: വാക്യം ദൈവികവിധിയുടെ നടുവിലുള്ള പുരോഹിതമധ്യസ്ഥതയെ വിവരിക്കുന്നു. ‘പ്രായശ്ചിത്തം ചെയ്തു’ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു; അതിന്റെ പ്രവർത്തനരീതി പാഠം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- issue: קָהָל എന്ന സമൂഹപദത്തിന്റെ പരിഭാഷ
  choice: ജനസമൂഹം
  alternative: സഭ
  rationale: ഇവിടെ പദം കൂടിയിരിക്കുന്ന ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനസമൂഹം’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ‘സഭ’യ്ക്കുണ്ടാകാവുന്ന പ്രത്യേക ക്രൈസ്തവ സ്ഥാപനധ്വനി ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘അതാ’ എന്നത് ആഖ്യാനത്തിലെ പെട്ടെന്നുള്ള ശ്രദ്ധാകർഷണം നിലനിർത്തുന്നു; ‘ബാധ’, ‘ധൂപം’, ‘പ്രായശ്ചിത്തം’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ ആചാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കുന്നു.
