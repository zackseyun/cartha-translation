- from: അടുത്തുവരുന്ന ഏവനും—യഹ്‌വെയുടെ തിരുനിവാസത്തിനടുത്തു വരുന്ന ഏവനും—മരിക്കും. ഞങ്ങളെല്ലാവരും മരിച്ചൊടുങ്ങണമോ?[a]
  to: അടുത്തുവരുന്ന ഏവനും—യഹ്‌വെയുടെ തിരുനിവാസത്തിന് അടുത്തുവരുന്നവൻ—മരിക്കും. നാമെല്ലാവരും മരിച്ചൊടുങ്ങുമോ?[a]
  rationale: The revision clarifies the Hebrew directional phrase, improves the natural Malayalam syntax of the repeated participle, and gives the final rhetorical question a more direct future sense. The footnote is retained and adjusted to refer accurately to the multiple Hebrew verbal forms in the final clause.
