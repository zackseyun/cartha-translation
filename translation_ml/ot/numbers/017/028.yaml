base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: ml
  text: അടുത്തുവരുന്ന ഏവനും—യഹ്‌വെയുടെ തിരുനിവാസത്തിന് അടുത്തുവരുന്നവൻ—മരിക്കും. നാമെല്ലാവരും മരിച്ചൊടുങ്ങുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നാമെല്ലാവരും മരിക്കുമോ?” ഇവിടെ “മരിക്കും” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയിൽനിന്നു വ്യത്യസ്തമായ ക്രിയകളാണ് എബ്രായത്തിൽ ഉള്ളത്; അതിനാൽ വെറും ‘മരിക്കുക’ എന്ന ആവർത്തനത്തേക്കാൾ പൂർണമായി അവസാനിച്ചുപോകുക എന്ന അർഥസൂചന ഉണ്ടായേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ഏവനും
  rationale: സമീപിക്കുന്ന ഏതൊരാളെയും ഉൾക്കൊള്ളുന്ന എബ്രായപദത്തിന്റെ സാർവത്രിക ബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: അടുത്തുവരുന്ന ഏവനും—... അടുത്തു വരുന്ന ഏവനും
  rationale: קרב എന്ന ധാതുവിൽനിന്നുള്ള പങ്കാളിത്തരൂപം ആവർത്തിച്ചിരിക്കുന്നതിനാൽ, ജനങ്ങളുടെ ഭീതിയും ഊന്നലും മിനുക്കിക്കളയാതെ ആവർത്തനം നിലനിർത്തി.
- source_word: מִשְׁכַּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയിലെ യഹ്‌വെയുടെ വിശുദ്ധ വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന משכן എന്ന പദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന അടിസ്ഥാനാർഥവും ആരാധനാസന്ദർഭവും ഒരുമിച്ചു നൽകുന്നു; אהל מועד എന്ന വേറൊരു പദവുമായി കലരാവുന്ന ‘സമാഗമകൂടാരം’ ഒഴിവാക്കി.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് പകരാതെ, മലയാളത്തിൽ അതിന്റെ ഉച്ചാരണലിപ്യന്തരണം നൽകി.
- source_word: יָמוּת
  choice: മരിക്കും
  rationale: സമീപിക്കുന്നതിന്റെ ഉറപ്പുള്ള പരിണതഫലം സൂചിപ്പിക്കുന്ന അപൂർണ്ണക്രിയയുടെ ഭാവാർഥം നേരായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: ഞങ്ങളെല്ലാവരും മരിച്ചൊടുങ്ങണമോ?
  rationale: תמם എന്ന പദത്തിലെ പൂർണമായി തീർന്നുപോകുക എന്ന ആശയവും גוע എന്ന പദത്തിലെ മരണം/നശിക്കൽ എന്ന ആശയവും ‘മരിച്ചൊടുങ്ങുക’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു; ചോദ്യം ജനങ്ങളുടെ സമഗ്രനാശഭീതിയായി സ്വാഭാവികമായി കേൾക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിപരമായ ദൈവനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സ്ഥാനപ്പേരായ ‘കർത്താവ്’ ഉപയോഗിക്കാതെയും പരമ്പരാഗതമായ മറ്റൊരു ലിപ്യന്തരണം സ്വീകരിക്കാതെയും ‘യഹ്‌വെ’ എന്നു നൽകി.
- issue: അവസാന ചോദ്യത്തിലെ രണ്ടു മരണസംബന്ധിയായ പദങ്ങളുടെ ബന്ധം
  choice: മരിച്ചൊടുങ്ങണമോ?
  alternative: മരിക്കണമോ?
  rationale: תמם, גוע എന്നീ വ്യത്യസ്ത പദങ്ങളുടെ സംയുക്തബലം നിലനിർത്തി; കേവലം ‘മരിക്കണമോ’ എന്നു പറഞ്ഞ് പദവ്യത്യാസം ഇല്ലാതാക്കിയില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം ഡാഷുകൾക്കുള്ളിൽ നിലനിർത്തി, അതേസമയം വാക്യം വായനാസൗകര്യമുള്ളതാക്കി. ‘തിരുനിവാസം’ ആരാധനാസന്ദർഭത്തിലെ വിശുദ്ധ വാസസ്ഥലത്തെ വ്യക്തമാക്കുന്നു.
