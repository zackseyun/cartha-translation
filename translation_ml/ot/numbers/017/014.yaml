source:
  edition: WLC
  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: ml
  text: ബാധയിൽ മരിച്ചവർ പതിനാലായിരത്തി എഴുനൂറുപേരായിരുന്നു; കോരഹിന്റെ കാര്യത്തിൽ[a] മരിച്ചവരെ കൂടാതെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കോരഹുമായി ബന്ധപ്പെട്ട്” അല്ലെങ്കിൽ “കോരഹിന്റെ കാരണത്താൽ.” കോരഹിന്റെ കലാപവുമായി ബന്ധപ്പെട്ട് മുമ്പ് മരിച്ചവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ആയിരുന്നു
  rationale: വിവരണത്തിന്റെ തുടർച്ചയിൽ മരണസംഖ്യയുടെ ആകെത്തുക അറിയിക്കുന്ന ക്രിയാരൂപം; ഹീബ്രുവിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: הַמֵּתִים
  choice: മരിച്ചവർ / മരിച്ചവരെ
  rationale: നാമവാചകമായി പ്രയോഗിച്ച കൃതന്തത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും രണ്ടു പ്രയോഗങ്ങളിലും അർഥസാമ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: בַּמַּגֵּפָה
  choice: ബാധയിൽ
  rationale: מַגֵּפָה എന്നത് ഇവിടെ മരണകാരിയായ ദൈവിക ബാധയെ സൂചിപ്പിക്കുന്നു; 'ബാധയിൽ' എന്നത് സന്ദർഭവും בְּ എന്ന ഉപസർഗത്തിന്റെ ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: പതിനാലായിരത്തി എഴുനൂറുപേർ
  rationale: ഹീബ്രു സംഖ്യയെ സാധാരണ മലയാള സംഖ്യാശൈലിയിൽ കൃത്യമായി നൽകുന്നു; ആളുകളുടെ എണ്ണമാണെന്ന് വ്യക്തമാക്കാൻ 'പേർ' ചേർത്തിരിക്കുന്നു.
- source_word: מִלְּבַד
  choice: കൂടാതെയാണിത്
  rationale: പറഞ്ഞ 14,700 എന്ന സംഖ്യയിൽ കോരഹുമായി ബന്ധപ്പെട്ട മുൻമരണങ്ങൾ ഉൾപ്പെടുന്നില്ലെന്ന ഒഴിവാക്കൽബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עַל דְּבַר קֹרַח
  choice: കോരഹിന്റെ കാരണത്താൽ
  rationale: ഈ സന്ദർഭത്തിൽ കോരഹുമായി ബന്ധപ്പെട്ട സംഭവത്തെ തുടർന്നുണ്ടായ മരണങ്ങളെ സൂചിപ്പിക്കുന്ന കാരണബന്ധം വായനാസൗകര്യത്തോടെ നൽകുന്നു; ഹീബ്രു പ്രയോഗത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: കോരഹുമായി ബന്ധപ്പെട്ട മരണങ്ങളുടെ പരിധി
  choice: 14,700 ബാധാമരണങ്ങളിൽനിന്ന് കോരഹുമായി ബന്ധപ്പെട്ട മുൻമരണങ്ങളെ വേർതിരിക്കുന്നു; കൂടുതൽ വിഭാഗീകരിക്കുന്നില്ല.
  alternative: ‘കോരഹിന്റെ കാര്യത്തിൽ മരിച്ചവർ’ അല്ലെങ്കിൽ ‘കോരഹുമായി ബന്ധപ്പെട്ട് മരിച്ചവർ’
  rationale: עַל דְּבַר קֹרַח മുൻവിധിയെയും കലാപവുമായി ബന്ധപ്പെട്ട മരണങ്ങളെയും ഓർമ്മിപ്പിക്കുന്നു; എന്നാൽ ആരൊക്കെ അതിൽ ഉൾപ്പെടുന്നു എന്ന് ഈ വാക്യം പ്രത്യേകം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ കണക്കെടുപ്പ് സ്വഭാവം നിലനിർത്തി; ഹീബ്രുവിൽ വ്യക്തമായി ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള വ്യവഹാരസൂചകം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പിന്റെ അടയാളം അത് വിശദീകരിക്കുന്ന കോരഹ്-പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
