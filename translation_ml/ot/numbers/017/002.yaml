  source_fidelity: 'പ്രധാന അർഥം കൃത്യമാണ്: എലെയാസാരോടുള്ള നിർദേശം, ദഹനമേഖലയിൽനിന്ന് ധൂപകലശങ്ങൾ എടുക്കൽ, തീ അകലെ ചിതറിക്കൽ, കലശങ്ങൾ വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു എന്ന കാരണം എന്നിവ നിലനിൽക്കുന്നു. എന്നാൽ מִבֵּין הַשְּׂרֵפָה എന്നതിന് ‘കത്തുന്നിടത്തുനിന്ന്’ എന്നത് ‘among/from the midst of the burning’ എന്ന കൂട്ടത്തിനുള്ളിലെ സ്ഥാനം അല്പം മങ്ങിക്കുന്നു.'
  naturalness: ഭാഷ പൊതുവേ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ദഹിച്ചുകൊണ്ടിരിക്കുന്ന സ്ഥലത്തിന്റെ നടുവിൽനിന്ന്’ എന്ന പ്രയോഗം മൂലത്തിലെ ‘മധ്യത്തിൽനിന്ന്’ എന്ന ബന്ധം കൂടുതൽ വ്യക്തമായി നൽകുന്നു. ‘എടുത്തുമാറ്റുക’ എന്നത് ഉയർത്തിയെടുക്കലും നീക്കലും ചേർത്ത് പറയുന്നതിനാൽ സ്വീകാര്യമാണ്.
  terminology: ‘ധൂപകലശങ്ങൾ’ ഈ ആരാധനാസന്ദർഭത്തിൽ യോജിച്ചതാണ്; ‘തീക്കോരികൾ’ എന്ന ലെക്സിക്കൽ ബദൽ അടിക്കുറിപ്പിൽ ശരിയായി നൽകിയിരിക്കുന്നു. ‘വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു’ קָדֵשׁוּ-വിന്റെ ഫലാവസ്ഥ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു. പേരുകളും ‘പുരോഹിതനായ അഹരോന്റെ മകൻ’ എന്ന ബന്ധവും ശരിയാണ്.
