  to: 'പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാരിനോടു പറയുക: “ദഹിച്ചുകൊണ്ടിരിക്കുന്ന സ്ഥലത്തിന്റെ നടുവിൽനിന്ന് ധൂപകലശങ്ങൾ[a] എടുത്തുമാറ്റുക; തീ ദൂരേക്കു ചിതറിക്കുക. അവ വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു[b].”'
