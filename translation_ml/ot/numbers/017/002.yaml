source:
  edition: WLC
  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: ml
  text: 'പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാരിനോടു പറയുക: “ദഹിച്ചുകൊണ്ടിരിക്കുന്ന സ്ഥലത്തിന്റെ നടുവിൽനിന്ന് ധൂപകലശങ്ങൾ[a] എടുത്തുമാറ്റുക; തീ ദൂരേക്കു ചിതറിക്കുക. അവ വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തീക്കോരികൾ.’ എബ്രായപദം ചൂടുകനലോ ധൂപമോ വഹിക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവ വിശുദ്ധമാണ്.’ എബ്രായ പൂർണ്ണകാലരൂപം ഉണ്ടായിത്തീർന്നതിന്റെ ഫലമായ ഇപ്പോഴത്തെ അവസ്ഥയെ ഊന്നിക്കാണിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: പറയുക
  rationale: אמר എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം നേരിട്ടുള്ള നിർദേശം അവതരിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: പുരോഹിതനായ അഹരോന്റെ മകൻ എലെയാസാർ
  rationale: എബ്രായ പദക്രമത്തിൽ ‘പുരോഹിതൻ’ എന്ന വിശേഷണം ഏറ്റവും സ്വാഭാവികമായി അഹരോനോടാണ് ചേരുന്നത്; ബന്ധം വ്യക്തമായി നിലനിർത്തി.
- source_word: וְיָרֵם
  choice: എടുത്തുമാറ്റുക
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ജസ്സീവ് എലെയാസാർ ചെയ്യേണ്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഉയർത്തിയെടുക്കുന്നതും തീയിൽനിന്ന് മാറ്റുന്നതും ഒരുമിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הַמַּחְתֹּת
  choice: ധൂപകലശങ്ങൾ
  rationale: מחתה ചൂടുകനലോ ധൂപമോ വഹിക്കാൻ ഉപയോഗിച്ചിരുന്ന പാത്രമാണ്; ആരാധനാസന്ദർഭത്തിൽ ‘ധൂപകലശം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്, ‘തീക്കോരികൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: കത്തുന്നിടത്തുനിന്ന്
  rationale: שׂרפה സൂചിപ്പിക്കുന്ന കത്തൽ/ദഹനം നിലനിർത്തുന്നു; ‘കരിഞ്ഞ അവശിഷ്ടങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി ഫലാവസ്ഥ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: തീ ദൂരേക്കു ചിതറിക്കുക
  rationale: זרה എന്നത് ചിതറിക്കുക എന്നും הָלְאָה അകലേക്ക് എന്നും സൂചിപ്പിക്കുന്നു. ‘കനലുകൾ’ എന്നു വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിലെ ‘തീ’ നിലനിർത്തി.
- source_word: כִּי קָדֵשׁוּ
  choice: അവ വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു
  rationale: ബഹുവചന കർത്താവ് ധൂപകലശങ്ങളെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എബ്രായ പൂർണ്ണകാലത്തിന്റെ ഫലാവസ്ഥ ‘ആയിത്തീർന്നിരിക്കുന്നു’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: כִּי קָדֵשׁוּ എന്നതിലെ ബഹുവചന ക്രിയയുടെ സൂചിതവിഷയം
  choice: ‘അവ’ ധൂപകലശങ്ങളെ സൂചിപ്പിക്കുന്നു
  alternative: ധൂപകലശങ്ങളും തീയുമായി ബന്ധപ്പെട്ട വിശുദ്ധ വസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നു
  rationale: ഏറ്റവും അടുത്ത യോജ്യമായ ബഹുവചന മുൻപദം הַמַּחְתֹּת (‘ധൂപകലശങ്ങൾ’) ആണ്. തീ ചിതറിക്കളയപ്പെടുമ്പോൾ ധൂപകലശങ്ങൾ സംരക്ഷിക്കപ്പെടുന്നതും ഇതുമായി യോജിക്കുന്നു.
- issue: קָדֵשׁוּ എന്ന പൂർണ്ണകാലത്തിന്റെ ഭാവം
  choice: വിശുദ്ധമായിത്തീർന്നിരിക്കുന്നു
  alternative: വിശുദ്ധമാണ്
  rationale: മുൻപ് യഹോവയുടെ സന്നിധിയിൽ അർപ്പിക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന വിശുദ്ധാവസ്ഥയെ ഈ രൂപം സൂചിപ്പിക്കാം; എങ്കിലും ലളിതമായ അവസ്ഥാവാചക വായനയും സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ നിർദേശം വ്യക്തമായി കാണിക്കാൻ നേരിട്ടുള്ള ഉദ്ധരണി ഉപയോഗിച്ചു. ആരാധനാസംബന്ധിയായ ‘ധൂപകലശങ്ങൾ’ നിലനിർത്തിയെങ്കിലും സാധാരണ വായനക്കാരനായി അതിന്റെ വസ്തുസ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
