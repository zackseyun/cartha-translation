translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ വിതരണാത്മക ആവർത്തനം ‘ഓരോ പ്രഭുവിനും ഓരോ വടി’ എന്ന രൂപത്തിൽ നിലനിർത്തി; ‘പിതൃഭവനങ്ങൾ’ എന്ന പദം വംശ-കുടുംബ പ്രതിനിധാനത്തിന്റെ ചരിത്രപരമായ ഘടന സംരക്ഷിക്കുന്നു.
