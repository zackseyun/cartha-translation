source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: ml
  text: അങ്ങനെ മോശെ ഇസ്രായേൽമക്കളോടു സംസാരിച്ചു. അവരുടെ എല്ലാ നേതാക്കളും അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച് ഓരോ നേതാവിൽനിന്നും ഓരോ വടി വീതം, ആകെ പന്ത്രണ്ടു വടികൾ, അവന്നു കൊടുത്തു; അഹരോന്റെ വടിയും അവരുടെ വടികളുടെ കൂട്ടത്തിലുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ അഭിസംബോധനചെയ്തു സംസാരിക്കുക എന്ന കഥനാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഉടമ്പടിനാമം; മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും മൂലത്തിലെ ‘മക്കൾ’ എന്ന രൂപം നിലനിർത്തുന്നതുമാണ്.
- source_word: נְשִׂיאֵיהֶם
  choice: അവരുടെ പ്രഭുക്കന്മാർ
  rationale: ഗോത്രങ്ങളെ ഔദ്യോഗികമായി പ്രതിനിധാനം ചെയ്യുന്ന നേതാക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘പ്രഭുക്കന്മാർ’ ആ പദവിസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: מַטֶּה
  choice: വടി
  rationale: ഇവിടെ പ്രതിനിധാനചിഹ്നമായി നൽകുന്ന ദണ്ഡിനുള്ള വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: ഓരോ പ്രഭുവിനും ഓരോ വടി
  rationale: എബ്രായത്തിലെ ആവർത്തനത്തിനുള്ള വിതരണാർഥവും ഓരോ നേതാവിൽനിന്നും ഒന്നു വീതം എന്ന ഊന്നലും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച്
  rationale: പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സാമൂഹിക ഘടന നിലനിർത്തുന്നു.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: പന്ത്രണ്ടു വടികൾ
  rationale: സംഖ്യയും മുമ്പ് തിരഞ്ഞെടുത്ത מַטֶּה എന്ന പദത്തിന്റെ വിവർത്തനവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: അഹരോന്റെ വടിയും അവരുടെ വടികളുടെ കൂട്ടത്തിലുണ്ടായിരുന്നു
  rationale: ക്രിയയില്ലാത്ത എബ്രായവാക്യത്തിന് മലയാളത്തിൽ ആവശ്യമായ ‘ഉണ്ടായിരുന്നു’ ചേർത്ത്, בְּתוֹךְ എന്നതിന്റെ ‘കൂട്ടത്തിൽ/ഇടയിൽ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
