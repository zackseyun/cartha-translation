revisions:
- from: 'എന്നാൽ പിറ്റേന്ന് ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും മോശയ്ക്കും അഹരോനും എതിരായി പിറുപിറുത്തുകൊണ്ട് പറഞ്ഞു: “നിങ്ങളാണ് യഹോവയുടെ ജനത്തെ കൊന്നത്.”'
  to: 'എന്നാൽ പിറ്റേന്ന് ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും മോശെയ്ക്കും അഹരോന്നും എതിരായി പിറുപിറുത്തു: “നിങ്ങളാണ് യഹ്‌വേയുടെ ജനത്തെ കൊന്നത്.”'
  rationale: The revision retains every source-level element while using an idiomatic Malayalam quotation introduction, standard oblique name forms, and a rendering of the Tetragrammaton consistent with the English POB audit trail. No footnote is required because the revised Malayalam text contains no marked note anchor and no unresolved textual ambiguity is introduced.
