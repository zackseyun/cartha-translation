id: NUM.17.6
reference: Numbers 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: ml
  text: 'എന്നാൽ പിറ്റേന്ന് ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും മോശെയ്ക്കും അഹരോന്നും എതിരായി പിറുപിറുത്തു: “നിങ്ങളാണ് യഹ്‌വേയുടെ ജനത്തെ കൊന്നത്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: പിറുപിറുത്തുകൊണ്ട് പറഞ്ഞു
  rationale: ലൂൻ എന്ന ക്രിയ മരുഭൂമിവിവരണങ്ങളിൽ അധികാരികൾക്കെതിരായ സമൂഹപരമായ അസന്തുഷ്ടപരാതിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിറുപിറുക്കുക’ അതിന്റെ വിരോധാത്മക ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കളുടെ സമൂഹം മുഴുവനും
  rationale: עֵדָה എന്നതിന് ‘സമൂഹം’ എന്നു നൽകി സംഘടിതമായ ഉടമ്പടിസമൂഹത്തെ സൂചിപ്പിച്ചു; בְּנֵי יִשְׂרָאֵל എന്ന പദപ്രയോഗത്തിന്റെ രൂപം ‘ഇസ്രായേൽമക്കൾ’ എന്നു നിലനിർത്തി.
- source_word: מִמָּחֳרָת
  choice: പിറ്റേന്ന്
  rationale: ‘അടുത്ത ദിവസം’ എന്ന കാലസൂചനയ്ക്ക് സ്വാഭാവികവും ആധുനികവുമായ മലയാളപ്രയോഗം.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: മോശയ്ക്കും അഹരോനും എതിരായി
  rationale: ആവർത്തിച്ച עַל ഇരുനേതാക്കളെയും പ്രത്യേകം കുറ്റപ്പെടുത്തുന്നതാണ്; മലയാളത്തിലെ ‘-ക്കും ... -നും എതിരായി’ ആ സംയുക്ത ലക്ഷ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഹീബ്രായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവാക്യമായി നൽകി.
- source_word: אַתֶּם הֲמִתֶּם
  choice: നിങ്ങളാണ് ... കൊന്നത്
  rationale: രണ്ടാംപുരുഷ ബഹുവചനവും ഹിഫീൽ കാരകഭാവമുള്ള നേരിട്ടുള്ള കുറ്റാരോപണവും നിലനിർത്തുന്നു; ‘ആണ്’ കുറ്റാരോപണത്തിലെ ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: עַם יְהוָה
  choice: യഹോവയുടെ ജനം
  rationale: ദൈവനാമത്തോടുള്ള ജനത്തിന്റെ ഉടമ്പടിബന്ധം സൂചിപ്പിക്കുന്ന സമാസബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമമായ YHWH-നെ മലയാളത്തിലെ പരിചിതമായ നാമരൂപമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം പൊതുവായ ‘കർത്താവ്’ എന്ന പദമല്ല, പ്രത്യേക ദൈവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ആ വ്യത്യാസം പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹനാമം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന പരമ്പരാഗത സമൂഹപരമായ രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: הֲמִתֶּם എന്ന കാരകക്രിയയുടെ ബലം
  choice: കൊന്നത്
  alternative: മരണത്തിന് ഇടയാക്കിയത്
  rationale: ക്രിയയ്ക്ക് ‘മരിപ്പിക്കുക/മരണത്തിന് കാരണമാകുക’ എന്ന കാരകബലം ഉണ്ടെങ്കിലും സന്ദർഭത്തിലെ ജനത്തിന്റെ കടുത്ത നേരിട്ടുള്ള കുറ്റാരോപണം ‘കൊന്നു’ എന്ന ശക്തമായ രൂപം ന്യായീകരിക്കുന്നു; ആരോപണം വാചകകർത്താക്കളുടെതാണ്, വിവരണകർത്താവിന്റെ വിധിനിർണ്ണയമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘പിറ്റേന്ന്’, ‘സമൂഹം’, ‘പിറുപിറുക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പേരുകളും ദൈവനാമവും മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
