id: NUM.17.10
reference: Numbers 17:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: ml
  text: ഈ സമൂഹത്തിന്റെ നടുവിൽനിന്ന് മാറിനിൽക്കുവിൻ[a]; ഞാൻ അവരെ ഒരു നിമിഷംകൊണ്ട് നശിപ്പിച്ചുകളയട്ടെ[b]. അപ്പോൾ അവർ മുഖം നിലത്താക്കി വീണു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ സഭയുടെ ഇടയിൽനിന്ന് വേർപെടുവിൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞാൻ അവരെ ക്ഷണത്തിൽ സംഹരിക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: മാറിനിൽക്കുവിൻ
  rationale: רום എന്ന ധാതുവിന്റെ നിഫാൽ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ സമൂഹത്തിന്റെ ഇടയിൽനിന്ന് അകന്നുമാറാനുള്ള അടിയന്തര കല്പനയായി പ്രയോഗിച്ചിരിക്കുന്നു. അക്ഷരാർഥമായ ഉയരുക എന്ന ദൃശ്യത്തെക്കാൾ സന്ദർഭത്തിലെ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: מִתּוֹךְ
  choice: നടുവിൽനിന്ന്
  rationale: ഒരു കൂട്ടത്തിനുള്ളിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തെ അടുത്തും സ്വാഭാവികവുമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: הָעֵדָה הַזֹּאת
  choice: ഈ സമൂഹം
  rationale: עֵדָה ഇവിടെ യിസ്രായേലിന്റെ ഒത്തുചേർന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സമൂഹം’ ആരാധനാസമ്മേളനം എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ കൂട്ടായ അർഥം നൽകുന്നു.
- source_word: וַאֲכַלֶּה
  choice: ഞാൻ ... നശിപ്പിച്ചുകളയട്ടെ
  rationale: כלה എന്ന പീയേൽ രൂപത്തിന് പൂർണമായി അവസാനിപ്പിക്കുക, സംഹരിക്കുക, നശിപ്പിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഈ തിരഞ്ഞെടുപ്പ് ദൈവിക ന്യായവിധിയുടെ കാഠിന്യം മയപ്പെടുത്താതെ സമ്പൂർണ നാശത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: אֹתָם
  choice: അവരെ
  rationale: മുമ്പ് പറഞ്ഞ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: כְּרָגַע
  choice: ഒരു നിമിഷംകൊണ്ട്
  rationale: വളരെ ചുരുങ്ങിയ സമയത്തിനുള്ളിൽ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וַיִּפְּלוּ
  choice: അപ്പോൾ അവർ ... വീണു
  rationale: വയ്യക്ഷോൽ ആഖ്യാനക്രമം തുടർന്നുള്ള ഉടൻ സംഭവിച്ച പ്രതികരണമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: עַל פְּנֵיהֶם
  choice: മുഖം നിലത്താക്കി
  rationale: ഭയം, അപേക്ഷ, മധ്യസ്ഥപ്രാർഥന, അല്ലെങ്കിൽ ആരാധന എന്നിവയിൽ കവിണ്ണുവീഴുന്നതിനെ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശെയോടും അഹരോനോടുമുള്ള ദൈവിക കല്പനയുടെ സ്വഭാവം
  choice: ആസന്നമായ ദൈവിക ന്യായവിധിക്കുമുമ്പ് സമൂഹത്തിന്റെ ഇടയിൽനിന്ന് മാറിനിൽക്കാനുള്ള അടിയന്തര കല്പനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എഴുന്നേൽക്കുവിൻ’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം, അല്ലെങ്കിൽ ‘വേർപെടുവിൻ’ എന്ന വ്യാഖ്യാനാത്മക രൂപം.
  rationale: എബ്രായ വാക്യം അടിയന്തരമായ ആജ്ഞയ്ക്കു പിന്നാലെ ജനത്തെ അതിവേഗം നശിപ്പിക്കാനുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം പറയുന്നു. പരിഭാഷ ഭീഷണിയുടെ കാഠിന്യം കുറയ്ക്കുകയോ അധികമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷ ഉപയോഗിച്ചു. ‘മാറിനിൽക്കുവിൻ’, ‘നശിപ്പിച്ചുകളയട്ടെ’ എന്നീ രൂപങ്ങൾ അടിയന്തരതയും ന്യായവിധിയുടെ തീവ്രതയും വ്യക്തമാക്കുന്നു; യഥാർഥ പദസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
