  source_fidelity: എബ്രായത്തിലെ ബഹുവചന ആജ്ഞയായ הֵרֹמּוּയും അതിനോടു ചേർന്നുള്ള מִתּוֹךְ הָעֵדָה הַזֹּאת എന്ന വേർപെടൽ-സന്ദർഭവും ‘ഈ സമൂഹത്തിന്റെ നടുവിൽനിന്ന് മാറിനിൽക്കുവിൻ’ എന്നതിൽ കൃത്യമായി പ്രതിഫലിക്കുന്നു. וַאֲכַלֶּה എന്ന കോഹോർട്ടറ്റീവിന്റെ ദൈവിക ഉദ്ദേശ്യവും כְּרָגַעയുടെ അതിവേഗതയും ‘ഞാൻ അവരെ ഒരു നിമിഷംകൊണ്ട് നശിപ്പിച്ചുകളയട്ടെ’ എന്നതിൽ നിലനിൽക്കുന്നു. അവസാന പ്രയോഗം പ്രണിപാതത്തെ സൂചിപ്പിക്കുന്ന עַל־פְּנֵיהֶם എന്ന പ്രയോഗത്തോടും വിശ്വസ്തമാണ്.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘മുഖം നിലത്താക്കി വീണു’ എന്നത് എബ്രായ പ്രണിപാത-ഇടിയത്തിന്റെ ദൃശ്യവും അർഥവും വ്യക്തമായി നൽകുന്നു. ‘അപ്പോൾ’ ആഖ്യാനക്രമത്തിന് യോജിക്കുന്നു.
  terminology: ‘സമൂഹം’ עֵדָהയുടെ കൂട്ടായ ജനസമൂഹം എന്ന അർഥം നന്നായി നൽകുന്നു; ഒരു പ്രത്യേക ആരാധനാസഭയെന്ന അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല. ‘നശിപ്പിച്ചുകളയട്ടെ’ כלהയുടെ സമ്പൂർണ നശീകരണഭാവം മയപ്പെടുത്തുന്നില്ല. അടിക്കുറിപ്പുകളിലെ ‘സഭ’യും ‘സംഹരിക്കട്ടെ’യും സാധുവായ പദസാധ്യതകളാണ്.
