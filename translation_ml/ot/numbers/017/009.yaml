  yaml_path: translation/ot/numbers/017/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശയോടു അരുളിച്ചെയ്തു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: സംസാരിച്ചു
  rationale: דבר എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുകയും തുടർന്നുള്ള אמר-ൽനിന്ന് പദപരമായ വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു; വാവ് ഘടകം ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവികൊണ്ട് പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ഉച്ചാരണവികല്പം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: אֶל
  choice: -യോട്
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന എബ്രായ മുൻപ്രത്യയത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: לֵאמֹר
  choice: പറഞ്ഞു
  rationale: തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ സൂത്രവാക്യം സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ‘കർത്താവ്’ എന്ന പദവികൊണ്ട് പകരാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമായതിനാൽ മറ്റൊരു പ്രചാരമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും ലളിതവുമായ മലയാളം. דבר/אמר എന്നീ വ്യത്യസ്ത എബ്രായ ക്രിയകളുടെ ഭേദം ‘സംസാരിച്ചു/പറഞ്ഞു’ എന്നിങ്ങനെ കഴിയുന്നത്ര നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ദൈവനാമത്തിനുശേഷം ചേർത്തു.
