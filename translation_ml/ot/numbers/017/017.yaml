source:
  edition: WLC
  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: ml
  text: “ഇസ്രായേൽമക്കളോടു സംസാരിക്കുക; അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചുള്ള സകല നേതാക്കന്മാരിൽനിന്നും, ഓരോ പിതൃഭവനത്തിനും ഒരു വടി വീതം, പന്ത്രണ്ട് വടികൾ[a] എടുക്കുക. ഓരോരുത്തന്റെ പേരും അവന്റെ വടിയിൽ എഴുതുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കോലുകൾ.’ എബ്രായത്തിലെ מַטֶּה എന്ന പദത്തിന് ‘വടി’ എന്നും ‘കോൽ’ എന്നും അർഥമാകാം; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരു ഭൗതിക വസ്തുവാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ഹീബ്രായ പ്രയോഗത്തിന്റെ കുടുംബബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവുമായ രൂപം.
- source_word: מַטֶּה
  choice: വടി
  rationale: ഇവിടെ പേരെഴുതുകയും പിന്നീട് തളിർക്കുകയും ചെയ്യുന്ന ഭൗതിക വസ്തുവാണ് ഉദ്ദേശിക്കുന്നത്; ‘വടി’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: പിതൃഭവനങ്ങളിൽ ഓരോന്നിനും ഓരോ വടി വീതം
  rationale: ആവർത്തനത്തിലൂടെ പ്രകടമാകുന്ന വിതരണാർഥം ‘ഓരോന്നിനും ഓരോ ... വീതം’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: נְשִׂיאֵיהֶם
  choice: അവരുടെ സകല നേതാക്കന്മാർ
  rationale: ഗോത്രങ്ങളുടെ തലവന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; രാജകീയ അർഥം വരുത്താതെ സാമൂഹികസ്ഥാനത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: לְבֵית אֲבֹתָם
  choice: അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച്
  rationale: നേതാക്കളും വടികളും പിതൃവംശാധിഷ്ഠിത ഭവനക്രമപ്രകാരമാണെന്ന സംഘടനാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: പന്ത്രണ്ട് വടികൾ
  rationale: സംഖ്യയും മַטֶּה എന്ന പദത്തിന്റെ ഭൗതിക അർഥവും നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: ഓരോരുത്തന്റെയും പേര് ... എഴുതണം
  rationale: אִישׁ എന്നതിന്റെ വിതരണാർഥം നിലനിർത്തുന്നു; ‘ഓരോ പുരുഷന്റെയും’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കി സന്ദർഭത്തിലെ പുരുഷനേതാക്കളിലേക്കുള്ള സൂചന സംരക്ഷിക്കുന്നു.
- source_word: עַל מַטֵּהוּ
  choice: അവന്റെ വടിയിൽ
  rationale: ഓരോ നേതാവിനും ബന്ധപ്പെട്ട അതത് വടിയെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
