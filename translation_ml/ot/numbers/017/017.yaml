translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പിതൃഭവനം’ ഗോത്രത്തിനുള്ളിലെ പിതൃവംശാധിഷ്ഠിത കുടുംബവിഭാഗത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. ഹീബ്രായത്തിലെ വിതരണാത്മക ആവർത്തനം മലയാളത്തിലെ ‘ഓരോന്നിനും ഓരോ ... വീതം’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി.
