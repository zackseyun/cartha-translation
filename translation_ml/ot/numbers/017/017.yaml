revisions:
- from: “ഇസ്രായേൽമക്കളോടു സംസാരിക്കുക. അവരുടെ പിതൃഭവനങ്ങളിൽ ഓരോന്നിനും ഓരോ വടി വീതം, അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ച് അവരുടെ സകല നേതാക്കന്മാരിൽനിന്നുമായി പന്ത്രണ്ട് വടികൾ[a] വാങ്ങുക. ഓരോരുത്തന്റെയും പേര് അവന്റെ വടിയിൽ എഴുതണം.”
  to: “ഇസ്രായേൽമക്കളോടു സംസാരിക്കുക; അവരുടെ പിതൃഭവനങ്ങൾക്കനുസരിച്ചുള്ള സകല നേതാക്കന്മാരിൽനിന്നും, ഓരോ പിതൃഭവനത്തിനും ഒരു വടി വീതം, പന്ത്രണ്ട് വടികൾ[a] എടുക്കുക. ഓരോരുത്തന്റെ പേരും അവന്റെ വടിയിൽ എഴുതുക.”
  rationale: The revision clarifies that the leaders are organized according to their fathers’ houses, improves the distributive Malayalam expression, restores direct imperative force in the final command, and replaces an unnatural footnote alternative with an idiomatic one. No theological or interpretive change is made.
