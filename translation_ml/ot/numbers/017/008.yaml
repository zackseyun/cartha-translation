  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: ml
  text: അപ്പോൾ മോശയും അഹരോനും സമാഗമനകൂടാരത്തിന്റെ മുമ്പിലേക്ക്[a] വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായയിൽ അക്ഷരാർഥം: ‘സമാഗമനകൂടാരത്തിന്റെ മുഖത്തേക്ക്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: അപ്പോൾ ... വന്നു
  rationale: ബോא് എന്ന ക്രിയയുടെ വയിക്തോൽ രൂപം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; മലയാളത്തിൽ ഭൂതകാലരൂപമായ ‘വന്നു’ സ്വാഭാവികമാണ്. ഏകവചന ക്രിയയ്ക്ക് സംയുക്ത കർത്താവുള്ള എബ്രായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന കർത്താവിനോടൊപ്പം ഏക ക്രിയാവാക്യമായി നൽകുന്നു. ‘അകത്തു പ്രവേശിച്ചു’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ നിർദ്ദിഷ്ടമായിരിക്കും.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: וְאַהֲרֹן
  choice: അഹരോനും
  rationale: വ്യക്തിനാമത്തിന്റെ സ്ഥിരപ്പെട്ട മലയാളരൂപത്തോടൊപ്പം ‘ഉം’ ചേർത്ത് സംയുക്ത കർത്താവ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶל־פְּנֵי
  choice: മുമ്പിലേക്ക്
  rationale: അക്ഷരാർഥത്തിൽ ‘മുഖത്തേക്ക്’ എന്ന ആശയം നൽകുന്ന ഈ പ്രയോഗം ഇവിടെ കൂടാരത്തിന്റെ സന്നിധിയിലേക്കോ മുൻവശത്തേക്കോ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ചലനദിശയും അർഥവ്യാപ്തിയും നിലനിർത്താൻ ‘മുമ്പിലേക്ക്’ എന്നു നൽകി.
- source_word: אֹהֶל מוֹעֵד
  choice: സമാഗമനകൂടാരം
  rationale: നിയുക്ത കൂടിക്കാഴ്ചയ്ക്കുള്ള വിശുദ്ധ കൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ മലയാള പദം; സാധാരണ കൂടാരമല്ല, പ്രത്യേക ആരാധനാസ്ഥലമാണ്.
