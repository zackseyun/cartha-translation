id: NUM.17.23
reference: Numbers 17:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: ml
  text: പിറ്റേദിവസം മോശെ സാക്ഷ്യകൂടാരത്തിൽ[a] പ്രവേശിച്ചു. ഇതാ, ലേവിയുടെ കുടുംബത്തിനായുള്ള[b] അഹരോന്റെ വടി തളിർത്തിരുന്നു; അതിൽ മൊട്ടുകൾ പുറപ്പെടുകയും പൂക്കൾ വിരിയുകയും ബദാംഫലങ്ങൾ പാകമാകുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സാക്ഷിക്കൂടാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ലേവിയുടെ ഗൃഹത്തിനായുള്ള”; ഇവിടെ അഹരോന്റെ വടി ലേവിയുടെ ഗോത്രത്തെ അഥവാ കുടുംബവംശത്തെ പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: പിറ്റേദിവസം
  rationale: തുടർന്നുവരുന്ന ദിവസത്തെ സൂചിപ്പിക്കുന്ന എബ്രായ കാലപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: אֹהֶל הָעֵדוּת
  choice: സാക്ഷ്യകൂടാരം
  rationale: കൂടാരത്തിന്റെ സ്ഥാപിതമായ വിശേഷണം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; עֵדוּת എന്ന പദത്തിന്റെ സാക്ഷ്യം/സാക്ഷി എന്ന നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: ഇതാ
  rationale: അത്ഭുതകരമായ കാഴ്ചയിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന എബ്രായ ആഖ്യാനസൂചകത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: פָּרַח
  choice: തളിർത്തിരുന്നു
  rationale: വടിയിൽ സസ്യവളർച്ച ആരംഭിച്ചെന്ന ആദ്യഘട്ടം സൂചിപ്പിക്കുകയും തുടർന്നുള്ള മൊട്ട്, പൂവ്, ഫലം എന്നീ ഘട്ടങ്ങൾക്ക് സ്വാഭാവികമായ തുടക്കം നൽകുകയും ചെയ്യുന്നു.
- source_word: מַטֵּה
  choice: വടി
  rationale: ഗോത്രത്തലവന്റെ staff/rod എന്ന അർഥത്തിന് സാധാരണ വായനക്കാർക്കു വ്യക്തവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: לְבֵית לֵוִי
  choice: ലേവിഗൃഹത്തിനുവേണ്ടിയുള്ള
  rationale: വടി ലേവിയുടെ ഭവനത്തെ പ്രതിനിധീകരിക്കുന്നു എന്ന ആശയം അതിരുകടന്ന് വിശദീകരിക്കാതെ എബ്രായ ഘടനയോട് അടുത്ത് നിലനിർത്തുന്നു.
- source_word: וַיֹּצֵא פֶרַח
  choice: അതിൽ മൊട്ടുകൾ പുറപ്പെടുകയും
  rationale: വളർച്ചയുടെ ക്രമത്തിൽ തളിർപ്പിനുശേഷവും പൂർണമായി വിരിഞ്ഞ പൂവിനുമുമ്പുമായ ഘട്ടം സ്വാഭാവിക മലയാളത്തിൽ വേർതിരിക്കുന്നു.
- source_word: וַיָּצֵץ צִיץ
  choice: പൂക്കൾ വിരിയുകയും
  rationale: എബ്രായത്തിലെ ശക്തമായ പൂക്കൽപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മൊട്ടുകളിൽനിന്ന് പൂക്കളിലേക്കുള്ള പുരോഗതി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: ബദാംകായ്കൾ പാകമാകുകയും ചെയ്തിരുന്നു
  rationale: ഫലം വെറുതെ ഉണ്ടായെന്നതിലുപരി അത് പാകത്തിലെത്തിയെന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
