  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. എബ്രായത്തിലെ അത്ഭുതസൂചകമായ ‘ഇതാ’ നിലനിർത്തി; തളിർപ്പ്, മൊട്ട്, പൂവ്, പാകമായ ഫലം എന്നീ വളർച്ചാഘട്ടങ്ങൾ വായനാസൗകര്യത്തോടെ വേർതിരിച്ചു.
