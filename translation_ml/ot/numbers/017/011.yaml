language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: ml
  text: 'അപ്പോൾ മോശെ അഹരോനോട് പറഞ്ഞു: “ധൂപകലശം[a] എടുത്ത് അതിൽ യാഗപീഠത്തിൽനിന്നുള്ള തീ ഇടുക; അതിന്മേൽ ധൂപം ഇട്ട് വേഗം സഭയുടെ അടുത്തേക്ക് ചെന്ന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുക. യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് ക്രോധം പുറപ്പെട്ടിരിക്കുന്നു[b]; ബാധ ആരംഭിച്ചുകഴിഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീച്ചട്ടി.”
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “യഹ്‌വേയുടെ മുമ്പിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: ധൂപകലശം
  rationale: പുരോഹിതശുശ്രൂഷയിൽ കനലും ധൂപവർഗവും വഹിക്കുന്ന പാത്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ സന്ദർഭത്തിൽ ‘ധൂപകലശം’ സ്വാഭാവികവും വ്യക്തവുമാണ്; ‘തീച്ചട്ടി’യും സാധ്യമാണ്.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: അതിൽ യാഗപീഠത്തിൽനിന്നുള്ള തീ ഇടുക
  rationale: തീയുടെ ഉറവിടം യാഗപീഠമാണെന്നത് നിലനിർത്തുകയും, പാത്രത്തിന്റെ ഉള്ളിൽ തീയിടുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: קְטֹרֶת
  choice: ധൂപവർഗം
  rationale: ആരാധനാക്രമത്തിൽ കത്തിക്കുന്ന സുഗന്ധദ്രവ്യത്തെ സൂചിപ്പിക്കുന്ന പ്രചാരമുള്ള മലയാള പദം.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: വേഗം ... ചെന്ന്
  rationale: പോകാനുള്ള കല്പനയും അടിയന്തരതയും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הָעֵדָה
  choice: സഭ
  rationale: സംഖ്യാപുസ്തകത്തിൽ ഒത്തുചേർന്ന ഇസ്രായേൽജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഔപചാരികവും സംക്ഷിപ്തവുമായ പദം.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുക
  rationale: പുരോഹിതപരവും ആരാധനാക്രമപരവുമായ כפר എന്ന ക്രിയയുടെ ഗൗരവം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: הַקֶּצֶף
  choice: ക്രോധം
  rationale: ദൈവിക ന്യായവിധിയായി പൊട്ടിപ്പുറപ്പെടുന്ന കോപത്തിന്റെ ഗൗരവം മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ‘മുഖത്തിനുമുമ്പിൽനിന്ന്’ എന്ന എബ്രായ രൂപകത്തിന്റെ സാന്നിധ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ചതുർവ്യഞ്ജന ദൈവനാമത്തെ പൊതുപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റാതെ പേരായി ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: הֵחֵל הַנָּגֶף
  choice: ബാധ ആരംഭിച്ചുകഴിഞ്ഞു
  rationale: ജനത്തിനിടയിൽ തുടങ്ങിയ ദൈവിക മാരകപ്രഹരത്തെ ‘ബാധ’ സൂചിപ്പിക്കുന്നു; സമ്പൂർണ രോഗനിർണയം വാചകത്തിൽ ചേർക്കാതെ സന്ദർഭത്തിലെ ഗൗരവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ ഉടമ്പടിനാമം നേരിട്ട് ഉള്ളതിനാൽ അത് പൊതുപദവിയാക്കി മാറ്റാതെ പേരായി നൽകുന്നു.
- issue: പുരോഹിതസന്ദർഭത്തിലെ כפר
  choice: പ്രായശ്ചിത്തം ചെയ്യുക
  alternative: പരിഹാരം വരുത്തുക; പാപപരിഹാരകർമം നടത്തുക
  rationale: ആരാധനാക്രമപരമായ ദൈവശാസ്ത്രഭാരം സംരക്ഷിക്കുമ്പോഴും പ്രായശ്ചിത്തം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന പ്രത്യേക സിദ്ധാന്തം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: מִלִּפְנֵי എന്ന പ്രയോഗത്തിലെ ദൈവസാന്നിധ്യരൂപകം
  choice: സന്നിധിയിൽനിന്ന്
  alternative: മുമ്പിൽനിന്ന്; യഹ്‌വേയിൽനിന്ന്
  rationale: ക്രോധം ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടു എന്ന ആശയത്തോടൊപ്പം എബ്രായത്തിലെ സാന്നിധ്യഘടകവും സംരക്ഷിക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാക്രമത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. കല്പനകളിലെ അടിയന്തരത ചെറുതും നേരിട്ടുമുള്ള ക്രിയാരൂപങ്ങളിലൂടെ പ്രകടമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തിട്ടുണ്ട്.
