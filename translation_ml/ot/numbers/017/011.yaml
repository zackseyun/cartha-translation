revisions:
- from: 'അപ്പോൾ മോശ അഹരോനോടു പറഞ്ഞു: “ധൂപകലശം[a] എടുത്ത് അതിൽ യാഗപീഠത്തിൽനിന്നുള്ള തീ ഇടുക; അതിന്മേൽ ധൂപവർഗവും ഇട്ട് വേഗം സഭയുടെ അടുക്കൽ ചെന്ന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുക. യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് ക്രോധം പുറപ്പെട്ടിരിക്കുന്നു[b]; ബാധ ആരംഭിച്ചുകഴിഞ്ഞു.”'
  to: 'അപ്പോൾ മോശെ അഹരോനോട് പറഞ്ഞു: “ധൂപകലശം[a] എടുത്ത് അതിൽ യാഗപീഠത്തിൽനിന്നുള്ള തീ ഇടുക; അതിന്മേൽ ധൂപം ഇട്ട് വേഗം സഭയുടെ അടുത്തേക്ക് ചെന്ന് അവർക്കുവേണ്ടി പ്രായശ്ചിത്തം ചെയ്യുക. യഹ്‌വേയുടെ സന്നിധിയിൽനിന്ന് ക്രോധം പുറപ്പെട്ടിരിക്കുന്നു[b]; ബാധ ആരംഭിച്ചുകഴിഞ്ഞു.”'
  rationale: The revision standardizes the names, improves modern Malayalam idiom, and uses the more immediately intelligible “ധൂപം.” It preserves the Hebrew syntax and all key semantic distinctions, including the altar as the source of the fire, atonement for the assembly, wrath proceeding from Yahweh’s presence, and the plague’s having begun.
