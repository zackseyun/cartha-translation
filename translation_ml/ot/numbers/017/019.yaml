id: NUM.17.19
reference: Numbers 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: ml
  text: അവയെ സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ മുമ്പിൽ[a], ഞാൻ നിങ്ങളുമായി കൂടിക്കാഴ്ച നടത്തുന്നിടത്ത്[b] വെക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഉടമ്പടിയുടെ സാക്ഷ്യത്തിന്റെ മുമ്പിൽ.’ ‘സാക്ഷ്യം’ എന്നത് വിശുദ്ധമന്ദിരത്തിലെ ഫലകങ്ങളുമായി ബന്ധപ്പെട്ട ഉടമ്പടിസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഞാൻ എന്നെത്തന്നെ നിങ്ങൾക്കു വെളിപ്പെടുത്തുന്നിടത്ത്’ അല്ലെങ്കിൽ ‘നിങ്ങളുമായി കൂടിക്കാണാൻ ഞാൻ നിശ്ചയിച്ചിടത്ത്.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: അവയെ വെക്കണം
  rationale: ഹിഫീൽ രൂപം വസ്തുക്കളെ ഒരു സ്ഥലത്ത് വെക്കണമെന്ന നിർദേശം നൽകുന്നു. ‘വെക്കണം’ ആജ്ഞയുടെ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിൽ
  rationale: വിശുദ്ധമന്ദിരമായ കൂടാരത്തിന്റെ സ്ഥിരമായ പേരാണിത്; ‘meeting’ എന്ന ആശയവും ‘tent’ എന്ന രൂപവും സംക്ഷിപ്തമായി നിലനിർത്തുന്ന പരിചിതമായ മലയാളപ്രയോഗം.
- source_word: לִפְנֵי הָעֵדוּת
  choice: സാക്ഷ്യത്തിന്റെ മുമ്പിൽ
  rationale: לִפְנֵי എന്നതിന്റെ സ്ഥലസൂചനയായ ‘മുമ്പിൽ’ എന്നും הָעֵדוּת എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘സാക്ഷ്യം’ എന്നും നിലനിർത്തുന്നു. ഫലകങ്ങളെയോ പെട്ടകത്തെയോ മുഖ്യപാഠത്തിൽ പ്രത്യേകമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: ഞാൻ ... കൂടിക്കാണുന്നിടത്ത്
  rationale: יעד എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം നിശ്ചയിക്കപ്പെട്ട കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. אֲשֶׁר ... שָׁמָּה ചേർന്നുള്ള സ്ഥലബന്ധം മലയാളത്തിൽ ‘കൂടിക്കാണുന്നിടത്ത്’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: לָכֶם
  choice: നിങ്ങളുമായി
  rationale: പദശഃ ‘നിങ്ങൾക്ക്/നിങ്ങൾക്കായി’ എന്നാകാമെങ്കിലും, יעד എന്ന ധാതുവിനോടുകൂടിയ ഈ പ്രയോഗത്തിൽ കൂടിക്കാഴ്ചയുടെ മറുപക്ഷത്തെ ‘നിങ്ങളുമായി’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: שָׁמָּה
  choice: ഇടത്ത് എന്നതിൽ ഉൾക്കൊള്ളുന്നു
  rationale: സ്ഥലസൂചകമായ שָׁמָּהയുടെ അർഥം ‘കൂടിക്കാണുന്നിടത്ത്’ എന്ന രൂപത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘സാക്ഷ്യം’ എന്നതിന്റെ സൂചിതവസ്തു
  choice: ഫലകങ്ങൾ, പെട്ടകം, അല്ലെങ്കിൽ ഉടമ്പടിയുടെ സാക്ഷ്യം എന്നിവയിൽ ഒന്നായി പരിമിതപ്പെടുത്താതെ ‘സാക്ഷ്യം’ എന്ന പദം നിലനിർത്തി.
  alternative: ‘സാക്ഷ്യഫലകങ്ങൾ’ അല്ലെങ്കിൽ ‘സാക്ഷ്യപെട്ടകം’
  rationale: എബ്രായപാഠം ഇവിടെ സൂചിതവസ്തുവിനെ കൂടുതൽ കൃത്യമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ വികസനം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: אִוָּעֵד എന്നതിന്റെ ഭാവം
  choice: ഞാൻ നിങ്ങളുമായി കൂടിക്കാണുന്നിടത്ത്
  alternative: ഞാൻ നിങ്ങളെ എനിക്കു വെളിപ്പെടുത്തുന്നിടത്ത് / നിങ്ങളുമായി കൂടിക്കാണാൻ ഞാൻ നിശ്ചയിച്ചിടത്ത്
  rationale: വിശുദ്ധമന്ദിരസന്ദർഭത്തിൽ നിശ്ചയിക്കപ്പെട്ട ദൈവിക കൂടിക്കാഴ്ചയാണ് പ്രാഥമികഭാവം. മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിൽ ഒറ്റ വ്യാഖ്യാനം അമിതമായി വികസിപ്പിക്കുന്നതു ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സമാഗമകൂടാരം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം സ്വാഭാവികമാക്കി. ദീർഘവാക്യത്തിലെ സ്ഥലവിവരണം വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
