- from: അവയെ സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ മുമ്പിൽ[a]—ഞാൻ നിങ്ങളുമായി കൂടിക്കാണുന്നിടത്ത്[b]—വെക്കണം.
  to: അവയെ സമാഗമകൂടാരത്തിൽ, സാക്ഷ്യത്തിന്റെ മുമ്പിൽ[a], ഞാൻ നിങ്ങളുമായി കൂടിക്കാഴ്ച നടത്തുന്നിടത്ത്[b] വെക്കുക.
  rationale: The revision restores the direct directive force of the Hebrew verb and smooths the sentence structure. It retains ‘സാക്ഷ്യം’ without identifying it as tablets, ark, or another specific referent, and preserves the locative ambiguity and covenant-meeting sense of אִוָּעֵד.
