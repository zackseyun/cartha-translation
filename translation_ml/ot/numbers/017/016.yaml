  source_fidelity: ഹീബ്രു വാക്യത്തിലെ വാവ്-തുടർച്ചയുള്ള ‘പിന്നെ’, യഹ്‌വെ എന്ന ദൈവനാമം, മോശെയോടുള്ള സംസാരദിശ, നേരിട്ടുള്ള വചനത്തെ അവതരിപ്പിക്കുന്ന לֵאמֹר എന്നിവയെല്ലാം വിവർത്തനം കൃത്യമായി കൈമാറുന്നു. ‘അരുളിച്ചെയ്തു:’ എന്നതിലെ ദ്വിബിന്ദു לֵאמֹר-ന്റെ പ്രസംഗ-ആമുഖപ്രവർത്തനം മതിയായ രീതിയിൽ നിർവഹിക്കുന്നു.
  naturalness: ‘പിന്നെ യഹ്‌വെ മോശയോടു അരുളിച്ചെയ്തു:’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ബൈബിൾ ആഖ്യാനരജിസ്റ്ററിന് യോജിച്ചതുമാണ്. ‘അരുളിച്ചെയ്തു’ അല്പം ഉന്നതമായ പ്രയോഗമാണെങ്കിലും ദൈവിക വചനസന്ദർഭത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമാണ്.
  terminology: യְהוָהയ്ക്ക് ‘യഹ്‌വെ’ എന്ന ലിപ്യന്തരണം മൂലപാഠത്തോടും നൽകിയിരിക്കുന്ന ഇംഗ്ലീഷ് POB തീരുമാനത്തോടും യോജിക്കുന്നു. ‘മോശ’ എന്ന പേരും ശരിയാണ്. അടിക്കുറിപ്പ് ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും വ്യത്യസ്ത പരിഭാഷാപാരമ്പര്യങ്ങളും സഹായകരമായി വ്യക്തമാക്കുന്നു.
