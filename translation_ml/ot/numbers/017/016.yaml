id: NUM.17.16
reference: Numbers 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/016.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'പിന്നെ യഹ്‌വെ മോശയോടു അരുളിച്ചെയ്തു[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രു: YHWH (יהוה); സാധാരണയായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിക്കുന്നു; പരമ്പരാഗതമായി ‘യഹോവ’ എന്നും ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.'
    reason: ദൈവനാമത്തിന്റെ ഹീബ്രു രൂപവും പ്രധാന പരിഭാഷാപാരമ്പര്യങ്ങളും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പിന്നെ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ചാഘടകം ആഖ്യാനത്തെ മുന്നോട്ടു കൊണ്ടുപോകുന്നു; ദൈവത്തിന്റെ സംസാരത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ ഉപയോഗിച്ചു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֶל מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരം മോശെയെ അഭിമുഖീകരിക്കുന്നതിനെ സ്വാഭാവികമായ മലയാള ദത്തിവിഭക്തിയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദു
  rationale: ഈ ഹീബ്രു അനന്തരക്രിയാരൂപം നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന സൂത്രപ്രയോഗമാണ്; മലയാളത്തിൽ ‘ഇപ്രകാരം’ എന്നു ചേർക്കുന്നതിനേക്കാൾ ദ്വിബിന്ദു സ്വാഭാവികമായി അതേ പ്രവർത്തനം നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ അതിനെ ഒരു ബിരുദനാമംകൊണ്ട് പകരാതെ, സാധാരണ പണ്ഡിതോചിതമായ ഉച്ചാരണത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; കൃത്യമായ പുരാതന ഉച്ചാരണം പൂർണമായി ഉറപ്പില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. ‘അരുളിച്ചെയ്തു’ ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ഉന്നതപ്രയോഗമാണെങ്കിലും വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; לֵאמֹר പ്രത്യേകം പദമായി യാന്ത്രികമായി പരിഭാഷപ്പെടുത്താതെ നേരിട്ടുള്ള പ്രസംഗം ആരംഭിക്കുന്ന വിരാമചിഹ്നത്തിലൂടെ കൈമാറി.
