id: NUM.17.26
reference: Numbers 17:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: ml
  text: യാഹ്‌വേ മോശെയോടു കൽപ്പിച്ചതുപോലെതന്നെ മോശെ ചെയ്തു; അങ്ങനെതന്നെ അവൻ ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ചെയ്തു
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നീ വിശാല അർഥങ്ങളുണ്ട്. ഇവിടെ കല്പന അനുസരിക്കുന്ന സന്ദർഭമായതിനാൽ ‘ചെയ്തു’ സ്വാഭാവികവും ആവർത്തനത്തിന് യോജിച്ചതുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശ
  rationale: ഈ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: כַּאֲשֶׁר
  choice: കല്പിച്ചതുപോലെതന്നെ
  rationale: കല്പനയോടുള്ള കൃത്യമായ അനുരൂപത വ്യക്തമാക്കാൻ ‘പോലെതന്നെ’ ഉപയോഗിച്ചു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: צוה അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; ‘കല്പിച്ചു’ അതിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ ദീർഘകാലമായി പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: אֹתוֹ
  choice: മോശയോട്
  rationale: നേരിട്ടുള്ള കർമചിഹ്നത്തോടുകൂടിയ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം മോശയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കല്പിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ‘മോശയോട്’ എന്ന രൂപം സ്വാഭാവികമാണ്.
- source_word: כֵּן
  choice: അങ്ങനെതന്നെ
  rationale: മുൻവാക്യത്തിലെ അനുസരണത്തെ വീണ്ടും ഉറപ്പിക്കുകയും ഊന്നിപ്പറയുകയും ചെയ്യുന്ന പദമായി പരിഭാഷപ്പെടുത്തി.
- source_word: עָשָׂה
  choice: അവൻ ചെയ്തു
  rationale: עשה എന്ന ക്രിയയുടെ മനഃപൂർവമായ ആവർത്തനം നിലനിർത്തി, മോശ കല്പന കൃത്യമായി അനുഷ്ഠിച്ചുവെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വേ; കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരാക്കി മാറ്റാതെ, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ ‘യഹോവ’ എന്ന നാമരൂപം സ്വീകരിച്ചു. ‘യാഹ്‌വേ’ എന്നത് സാധ്യതയുള്ള മറ്റൊരു ലിപ്യന്തരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായത്തിലെ ‘ചെയ്തു … ചെയ്തു’ എന്ന ഉദ്ദേശ്യപൂർവമായ ആവർത്തനവും ‘പോലെതന്നെ … അങ്ങനെതന്നെ’ എന്ന അനുരൂപതയുടെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
