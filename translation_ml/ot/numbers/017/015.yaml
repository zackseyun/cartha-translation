source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: ml
  text: അപ്പോൾ അഹരോൻ സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ മോശെയുടെ അടുക്കൽ മടങ്ങിവന്നു; ബാധ തടയപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിലച്ചു’ അല്ലെങ്കിൽ ‘അടക്കപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: അപ്പോൾ … മടങ്ങിവന്നു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമം നൽകുന്നു. שׁוּב എന്നതിന്റെ സ്ഥലപരമായ അർഥം ‘മടങ്ങിവന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: אֶל מֹשֶׁה
  choice: മോശെയുടെ അടുക്കൽ
  rationale: אֶל മോശെയിലേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. ‘മടങ്ങിവന്നു’ എന്നതിൽ തിരിച്ചുവരവ് ഇതിനകം അടങ്ങിയതിനാൽ അത് വീണ്ടും വ്യക്തമാക്കേണ്ടതില്ല.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: സമാഗമകൂടാരത്തിന്റെ പ്രവേശനകവാടത്തിൽ
  rationale: פֶּתַח പ്രവേശനമോ കവാടമോ സൂചിപ്പിക്കുന്നു. ആവർത്തിച്ചുള്ള ദിശാസൂചന ഒഴിവാക്കി, മോശെ ഉണ്ടായിരുന്ന സ്ഥലം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. אֹהֶל מוֹעֵד എന്നതിന് സുതാര്യവും പരിചിതവുമായ ‘സമാഗമകൂടാരം’ ഉപയോഗിക്കുന്നു.
- source_word: הַמַּגֵּפָה
  choice: ബാധ
  rationale: מַגֵּפָה ഇവിടെ മരണകാരിയായ ദൈവിക ന്യായവിധിയുടെ ബാധയെ സൂചിപ്പിക്കുന്നു. ‘ബാധ’ ആ സന്ദർഭത്തിന് യോജിച്ച, വ്യക്തവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: נֶעֱצָרָה
  choice: തടയപ്പെട്ടു
  rationale: עצר എന്ന ധാതുവിന്റെ നിഫാൽ രൂപം ബാധയ്ക്ക് അറുതി വരുത്തപ്പെട്ടതായി സൂചിപ്പിക്കുന്നു. ‘തടയപ്പെട്ടു’ എബ്രായത്തിലെ കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും പ്രവർത്തകനെ പ്രത്യേകം പറയാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ബാധ തടയപ്പെട്ടതിലെ പരോക്ഷമായ ദൈവിക പ്രവർത്തനം
  choice: പ്രവർത്തകനെ വ്യക്തമാക്കാതെ ‘ബാധ തടയപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തുക.
  alternative: ‘യഹോവ ബാധ തടഞ്ഞു’ എന്ന് ദൈവത്തെ വ്യക്തമായ കർത്താവാക്കുക.
  rationale: സന്ദർഭത്തിൽ ദൈവിക പ്രവർത്തനം മനസ്സിലാക്കാമെങ്കിലും, എബ്രായവാക്യം പ്രവർത്തകനെ പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ വിവർത്തനം കർത്താവിനെ കൂട്ടിച്ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംയമനവും അർഥസമ്മർദവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ എബ്രായത്തിലെ കർമണിപ്രയോഗവും പ്രവർത്തകനെപ്പറ്റിയുള്ള മൗനവും സംരക്ഷിക്കുന്നു.
