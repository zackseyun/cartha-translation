id: NUM.17.13
reference: Numbers 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: ml
  text: അവൻ മരിച്ചവരുടെയും ജീവനുള്ളവരുടെയും മധ്യേ നിന്നു; അപ്പോൾ മഹാമാരി നിലച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: അവൻ ... നിന്നു
  rationale: עמד എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘നിൽക്കുക’ സ്വാഭാവികമായി നൽകുകയും, സൈനികമായ പ്രതിരോധം പോലുള്ള അധിക അർഥം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בֵּין ... וּבֵין
  choice: '...യുടെയും ...യുടെയും മധ്യേ'
  rationale: രണ്ടു കൂട്ടങ്ങൾക്കിടയിലെ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത ഹീബ്രു ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: הַמֵּתִים
  choice: മരിച്ചവർ
  rationale: ഇതിനകം മരിച്ചവരെ സൂചിപ്പിക്കുന്ന substantival രൂപം; ജീവനുള്ളവർ എന്നതുമായ മൂർച്ചയുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: הַחַיִּים
  choice: ജീവനുള്ളവർ
  rationale: അപ്പോഴും ജീവിച്ചിരുന്നവരെ സൂചിപ്പിക്കുന്നു; ‘ജീവിച്ചിരിക്കുന്നവർ’ എന്നതിനെക്കാൾ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: וַתֵּעָצַר
  choice: നിലച്ചു
  rationale: മഹാമാരിയുടെ വ്യാപനം തടയപ്പെട്ടുവെന്ന passive/resultative ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ പുതുതായി ചേർക്കുന്നില്ല.
- source_word: הַמַּגֵּפָה
  choice: മഹാമാരി
  rationale: മരണകാരിയായ വ്യാപക ബാധയെ സൂചിപ്പിക്കുന്ന מגפה എന്ന പദത്തിന് സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളപദം.
theological_decisions:
- issue: ന്യായവിധിയുടെ ഈ സന്ദർഭത്തിൽ מַגֵּפָה എന്നതിന്റെ സ്വഭാവം
  choice: മഹാമാരി
  alternative: ബാധ / സംഹാരം
  rationale: സമീപസന്ദർഭത്തിലെ മരണകാരിയായ ബാധയുടെ ഗൗരവം ‘മഹാമാരി’ നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്ത ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ഹീബ്രുവിലെ ‘മരിച്ചവർ—ജീവനുള്ളവർ’ എന്ന നേർവൈരുധ്യവും സംഭവക്രമവും സംരക്ഷിച്ചിരിക്കുന്നു.
