reference: Numbers 17:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: ml
  text: 'അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും: ഞാൻ തിരഞ്ഞെടുക്കുന്ന മനുഷ്യന്റെ വടി തളിർക്കും. നിങ്ങൾക്കെതിരെ അവർ പിറുപിറുക്കുന്ന യിസ്രായേൽമക്കളുടെ എനിക്കെതിരെയുള്ള പരാതികൾ ഞാൻ അവസാനിപ്പിക്കും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “യിസ്രായേല്യർ” അല്ലെങ്കിൽ “യിസ്രായേൽജനം.” എബ്രായത്തിൽ: “യിസ്രായേലിന്റെ മക്കൾ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന അടയാളത്തെ പരിചയപ്പെടുത്തുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: ഞാൻ തിരഞ്ഞെടുക്കുന്ന മനുഷ്യൻ
  rationale: ഓരോ ഗോത്രത്തെയും പ്രതിനിധീകരിക്കുന്ന പുരുഷനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അതിനാൽ മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: מַטֵּהוּ
  choice: അവന്റെ വടി
  rationale: മൂലപാഠത്തിലെ മൂന്നാംപുരുഷ ഉടമസ്ഥപ്രത്യയം വ്യക്തമായി നിലനിർത്തുകയും സന്ദർഭത്തിലെ നേതാവിന്റെ വടിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: יִפְרָח
  choice: തളിർക്കും
  rationale: ഉണങ്ങിയ വടിയിൽ പുതുജീവന്റെ ആദ്യലക്ഷണം പ്രത്യക്ഷപ്പെടുന്നതിനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; പൂക്കുന്നതിന്റെ കൂടുതൽ വിശദാംശങ്ങൾ അടുത്ത വാക്യത്തിലുണ്ട്.
- source_word: וַהֲשִׁכֹּתִי
  choice: ഞാൻ അടക്കിക്കളയും
  rationale: പരാതികളെ ശമിപ്പിക്കുകയോ അവസാനിപ്പിക്കുകയോ ചെയ്യിക്കുന്ന causative അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵעָלַי
  choice: എന്റെമേൽനിന്ന്
  rationale: ‘എന്റെമേൽനിന്ന്’ എന്ന മൂലരൂപകവും ദൈവവുമായി പരാതികൾക്കുള്ള ബന്ധവും നിലനിർത്തുന്നു; അതിനെ ‘എനിക്കെതിരെ’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: תְּלֻנּוֹת
  choice: പരാതികൾ
  rationale: ജനങ്ങളുടെ ആവർത്തിച്ചുള്ള മുറുമുറുപ്പിനെയും എതിർപ്പിനെയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ ഔപചാരിക പ്രയോഗം നിലനിർത്തുന്നു; ഇവിടെ അത് സമൂഹമായ യിസ്രായേലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: നിങ്ങൾക്കെതിരെ പിറുപിറുത്തുകൊണ്ടിരിക്കുന്ന
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെയും ‘നിങ്ങൾക്കെതിരെ’ എന്ന വൈരുദ്ധ്യദിശയെയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: מֵעָלַי, עֲלֵיכֶם എന്നീ രണ്ട് വ്യത്യസ്ത ബന്ധങ്ങളുടെ അവതരണം
  choice: പരാതികൾ ‘എന്റെമേൽനിന്ന്’ അടക്കപ്പെടുന്നു; ജനങ്ങൾ ‘നിങ്ങൾക്കെതിരെ’ പിറുപിറുക്കുന്നു
  alternative: രണ്ടും ‘എനിക്കെതിരെ’ എന്നോ ‘നിങ്ങൾക്കെതിരെ’ എന്നോ ഏകീകരിക്കുക
  rationale: മൂലപാഠം ദൈവത്തെയും മോശെ-അഹരോനെയും വ്യത്യസ്തമായി ബന്ധിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിക്കുന്നു. അതിലെ സാധ്യതയുള്ള അർഥസംഘർഷം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന പ്രയോഗം
  choice: യിസ്രായേൽമക്കൾ
  alternative: യിസ്രായേല്യർ / യിസ്രായേൽജനം
  rationale: മൂലത്തിലെ ബന്ധസൂചക രൂപം നിലനിർത്തുമ്പോഴും, അടിക്കുറിപ്പിൽ അതിന്റെ സമൂഹപരമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വടി,’ ‘തളിർക്കും,’ ‘പിറുപിറുക്കുക’ എന്നീ പദങ്ങൾ ദൃശ്യസാന്ദ്രതയും മൂലപാഠത്തിന്റെ ആവർത്തനസ്വഭാവവും നിലനിർത്തുന്നു.
