revisions:
- from: 'അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും: ഞാൻ തിരഞ്ഞെടുക്കുന്ന മനുഷ്യന്റെ വടി തളിർക്കും. യിസ്രായേൽമക്കൾ[a] നിങ്ങൾക്കെതിരെ പിറുപിറുത്തുകൊണ്ടിരിക്കുന്ന പരാതികൾ എന്റെമേൽനിന്ന് ഞാൻ അടക്കിക്കളയും.'
  to: 'അപ്പോൾ ഇങ്ങനെ സംഭവിക്കും: ഞാൻ തിരഞ്ഞെടുക്കുന്ന മനുഷ്യന്റെ വടി തളിർക്കും. നിങ്ങൾക്കെതിരെ അവർ പിറുപിറുക്കുന്ന യിസ്രായേൽമക്കളുടെ എനിക്കെതിരെയുള്ള പരാതികൾ ഞാൻ അവസാനിപ്പിക്കും.[a]'
  rationale: 'The revision replaces an unnatural literal spatial expression with an idiomatic rendering of the complaints'' hostile direction toward God, and it clarifies the syntax of the final relative clause. It preserves the source''s distinction: the complaints are against God, while the Israelites'' ongoing grumbling is against Moses and Aaron.'
