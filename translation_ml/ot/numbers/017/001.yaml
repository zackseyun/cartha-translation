  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യാഹ്‌വെ മോശയോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... അരുളിച്ചെയ്തു
  rationale: വാവ്-തുടർച്ച ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നതിനാൽ ‘അപ്പോൾ’ എന്ന് നൽകി. ദൈവത്തിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമായി ‘അരുളിച്ചെയ്തു’ തിരഞ്ഞെടുത്തു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ചതുരക്ഷര ദൈവനാമമായ YHWH ഒരു പദവിയാൽ പകരാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל മലയാളത്തിൽ സ്വാഭാവികമായി ‘-യോടു’ എന്ന വിഭക്തിരൂപത്തിൽ നൽകി; מֹשֶׁה എന്ന പേര് പതിവ് മലയാളരൂപമായ ‘മോശ’ എന്നു നൽകി.
- source_word: לֵאמֹר
  choice: 'അരുളിച്ചെയ്തു:'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വചനത്തെ പരിചയപ്പെടുത്തുന്ന ഹീബ്രു സൂത്രപ്രയോഗം മലയാളത്തിൽ സംസാരക്രിയയും കോളനുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കുന്നത് അസ്വാഭാവികമായ ആവർത്തനമാകും.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ പേരായി നിലനിർത്തി. മലയാള വായനക്കാർക്കിടയിൽ സ്ഥാപിതവും എളുപ്പം തിരിച്ചറിയാവുന്നതുമായ രൂപം ‘യഹോവ’യാണ്; ഉച്ചാരണപുനർനിർമാണമായ ‘യാഹ്‌വെ’ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യരീതി. പരമ്പരാഗത ബൈബിൾഭാഷയുടെ മാന്യത നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
