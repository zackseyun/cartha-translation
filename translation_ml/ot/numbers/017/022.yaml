source:
  edition: WLC
  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: ml
  text: അങ്ങനെ മോശെ വടികൾ[a] യഹ്‌വേയുടെ മുമ്പാകെ സാക്ഷ്യത്തിന്റെ കൂടാരത്തിൽ[b] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദണ്ഡങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ എബ്രായപദം ഗോത്രങ്ങളെ പ്രതിനിധീകരിച്ചിരുന്ന ഭൗതിക വടികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സാക്ഷ്യകൂടാരത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥത്തിൽ, ‘സാക്ഷ്യത്തിന്റെ കൂടാരത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: വെച്ചു
  rationale: ഹിഫിൽ രൂപത്തിലുള്ള נוח ഇവിടെ ഒരു വസ്തു ഒരു സ്ഥലത്ത് കൊണ്ടുവെക്കുക എന്നർഥം നൽകുന്നു; ‘വെച്ചു’ സ്വാഭാവികവും മൂലത്തിലെ ദൃശ്യമായ പ്രവർത്തനം നിലനിർത്തുന്നതുമാണ്.
- source_word: מֹשֶׁה
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: הַמַּטֹּת
  choice: വടികൾ
  rationale: מַטֶּה എന്നതിന് വടി, ദണ്ഡ്, ഗോത്രം എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ ഗോത്രങ്ങളെ പ്രതിനിധീകരിക്കുന്ന ഭൗതിക വടികളാണ് ഉദ്ദേശ്യം; അതിനാൽ ‘വടികൾ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: לִפְנֵי
  choice: സന്നിധിയിൽ
  rationale: പദത്തിന് ‘മുമ്പിൽ’ എന്ന സ്ഥലപരമായ അർഥമുണ്ടെങ്കിലും, യഹ്‌വേയുടെ മുമ്പാകെ സമർപ്പിച്ചുവെക്കുന്നതിനെ മലയാളത്തിൽ ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ മലയാളലിപിയിൽ പ്രതിലിപീകരിക്കുന്നു.
- source_word: בְּאֹהֶל הָעֵדֻת
  choice: സാക്ഷ്യകൂടാരത്തിൽ
  rationale: אֹהֶל എന്നത് അക്ഷരാർഥത്തിൽ ‘കൂടാരം’ എന്നും עֵדוּת ‘സാക്ഷ്യം’ എന്നും അർഥപ്പെടുന്നു. ചേർന്ന പ്രയോഗത്തെ ‘സാക്ഷ്യകൂടാരം’ എന്നു നൽകുന്നത് സംക്ഷിപ്തവും നിലവിലെ വാക്യസന്ദർഭത്തിൽ വ്യക്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: എബ്രായപാഠം ദൈവത്തിന്റെ വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, അതിനെ ഒരു പദവികൊണ്ട് പകരാതെ ‘യഹ്‌വേ’ എന്നു പ്രതിലിപീകരിച്ചു.
- issue: אֹהֶל הָעֵדֻת എന്ന വിശുദ്ധമന്ദിരനാമം
  choice: സാക്ഷ്യകൂടാരം
  alternative: സാക്ഷ്യത്തിന്റെ കൂടാരം / സാക്ഷ്യനിവാസം
  rationale: മൂലത്തിലെ ‘കൂടാരം’ എന്ന രൂപകം നിലനിർത്തി, ‘സാക്ഷ്യം’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു; ‘നിവാസം’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘അങ്ങനെ’ മുൻസന്ദർഭത്തിലെ നിർദേശത്തോട് ഈ പ്രവൃത്തിയെ ബന്ധിപ്പിക്കുന്നു. ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുകയും, മൂലത്തിലെ കൂടാരരൂപകം സംരക്ഷിക്കുകയും ചെയ്തു.
