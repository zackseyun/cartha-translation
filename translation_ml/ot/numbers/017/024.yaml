source:
  edition: WLC
  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: ml
  text: അങ്ങനെ മോശെ യാഹ്‌വെയുടെ സന്നിധിയിൽനിന്ന് വടികളെല്ലാം പുറത്തെടുത്ത് എല്ലാ ഇസ്രായേൽമക്കളുടെ അടുക്കലേക്കും കൊണ്ടുവന്നു[a]. അവർ അവ കണ്ടു[b]; ഓരോരുത്തനും അവനവന്റെ വടി എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എല്ലാ ഇസ്രായേല്യരുടെ അടുക്കലേക്കും.’ എബ്രായയിൽ അക്ഷരാർഥം: ‘ഇസ്രായേലിന്റെ എല്ലാ പുത്രന്മാരുടെ അടുക്കലേക്ക്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവർ അവയെ നോക്കി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: പുറത്തെടുത്ത് ... കൊണ്ടുവന്നു
  rationale: יצא എന്ന ധാതുവിന്റെ ഹിഫീൽ രൂപം ‘പുറത്തുകൊണ്ടുവരുക’ എന്ന കാരകാർഥം നൽകുന്നു. മലയാളത്തിൽ പ്രവർത്തനത്തിന്റെ ദിശയും ഫലവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: הַמַּטֹּת
  choice: വടികളെല്ലാം
  rationale: מַטֶּה എന്നതിന് വടി, ദണ്ഡ്, ഗോത്രം എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ യഹോവയുടെ സന്നിധിയിൽ വെച്ചിരുന്ന ഭൗതിക വടികളാണ് ഉദ്ദേശ്യം.
- source_word: מִלִּפְנֵי יְהוָה
  choice: യഹോവയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ‘യഹോവയുടെ മുമ്പിൽനിന്ന്’ എന്ന എബ്രായ സ്ഥലസൂചക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ദൈവനാമം യഹോവ എന്നു ലിപ്യന്തരം ചെയ്തു.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: എല്ലാ ഇസ്രായേൽമക്കളുടെയും അടുക്കൽ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന ദേശീയ വിശേഷണത്തെ ഔപചാരിക സുതാര്യതയോടെയും മലയാള ബൈബിൾ ഭാഷയിൽ മനസ്സിലാകുന്ന വിധത്തിലും നൽകുന്നു.
- source_word: וַיִּרְאוּ
  choice: അവർ അവ നോക്കി
  rationale: ראה സാധാരണയായി ‘കാണുക’ എന്നാണ്; ഇവിടെ വടികൾ മുന്നിൽ കൊണ്ടുവന്നശേഷം അവ പരിശോധിച്ചുനോക്കി തിരിച്ചെടുക്കുന്ന സംഭവക്രമം ‘നോക്കി’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘കണ്ടു’ എന്ന നേരിട്ടുള്ള രൂപവും സാധ്യമാണ്.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: ഓരോരുത്തനും അവനവന്റെ വടി എടുത്തു
  rationale: אִישׁ ഇവിടെ വിതരണാർഥത്തിൽ ‘ഓരോരുത്തൻ’ എന്നാണ്. അവനവന് സ്വന്തമായ വടി എടുത്തുവെന്ന പ്രത്യയബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം ചതുരക്ഷര ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ പൊതുവായി പരിചിതമായ ‘യഹോവ’ എന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു; പകരം പദവി ചേർത്ത് ദൈവനാമത്തെ മറച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ഇസ്രായേൽമക്കൾ’ ദേശീയസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ഓരോരുത്തനും’ എന്നത് സന്ദർഭത്തിലെ പ്രതിനിധികളായ വ്യക്തികളെ വിതരണാർഥത്തിൽ വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
