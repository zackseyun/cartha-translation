revisions:
- from: ഇത് ഇസ്രായേൽമക്കൾക്കുള്ള ഒരു ഓർമപ്പെടുത്തലായി[a] ഇരിക്കേണ്ടതായിരുന്നു; അഹരോന്റെ സന്തതിയിൽപ്പെടാത്ത, പൗരോഹിത്യശുശ്രൂഷയ്ക്ക് അധികാരമില്ലാത്ത ആരും[b] യഹ്‌വേയുടെ സന്നിധിയിൽ ധൂപം കാട്ടാൻ അടുത്തുവരാതിരിക്കാനും, കോരഹിനെയും അവന്റെ കൂട്ടരെയുംപോലെ ആകാതിരിക്കാനും വേണ്ടിയായിരുന്നു ഇത്—യഹ്‌വേ മോശെയിലൂടെ[c] അവനോടു പറഞ്ഞതുപോലെതന്നെ.[d]
  to: 'ഇസ്രായേൽമക്കൾക്കുള്ള ഒരു ഓർമപ്പെടുത്തലായി[a]: അഹരോന്റെ സന്തതിയിൽപ്പെടാത്ത അധികാരമില്ലാത്ത ഒരാളും[b] യഹ്‌വേയുടെ മുമ്പാകെ ധൂപം അർപ്പിക്കാൻ അടുത്തുവരാതിരിക്കാനും, കോരഹിനെയും അവന്റെ കൂട്ടരെയുംപോലെ ആകാതിരിക്കാനും—യഹ്‌വേ മോശെയിലൂടെ[c] അവനോടു പറഞ്ഞതുപോലെതന്നെ.[d]'
  rationale: The revision removes an unsupported explicit past/modal phrase, avoids redundant explanatory expansion in the main text, and uses a more precise natural Malayalam expression for offering incense. It preserves the source's final-pronoun ambiguity and all existing footnote anchors.
