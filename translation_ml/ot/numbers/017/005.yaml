id: NUM.17.5
reference: Numbers 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾക്കുള്ള ഒരു ഓർമപ്പെടുത്തലായി[a]: അഹരോന്റെ സന്തതിയിൽപ്പെടാത്ത അധികാരമില്ലാത്ത ഒരാളും[b] യഹ്‌വേയുടെ മുമ്പാകെ ധൂപം അർപ്പിക്കാൻ അടുത്തുവരാതിരിക്കാനും, കോരഹിനെയും അവന്റെ കൂട്ടരെയുംപോലെ ആകാതിരിക്കാനും—യഹ്‌വേ മോശെയിലൂടെ[c] അവനോടു പറഞ്ഞതുപോലെതന്നെ.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്മാരകം’ അല്ലെങ്കിൽ ‘ഓർമയ്ക്കുള്ള അടയാളം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത് വംശീയമായി വിദേശിയായ ഒരാളെയല്ല, പൗരോഹിത്യശുശ്രൂഷ നിർവഹിക്കാൻ അധികാരമില്ലാത്ത ഒരാളെയാണ്.
    reason: cultural_note
  - marker: c
    text: ഹീബ്രുവിൽ അക്ഷരാർഥം ‘മോശെയുടെ കൈയാൽ’; അതായത് ‘മോശെയിലൂടെ’.
    reason: lexical_alternative
  - marker: d
    text: ‘അവനോടു’ എന്നത് മിക്കവാറും അഹരോനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: ഓർമപ്പെടുത്തൽ
  rationale: എന്തെങ്കിലും ഓർക്കാൻ ഇടയാക്കുന്ന അടയാളം എന്ന ആശയം നിയമപരമായ ഈ മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘സ്മാരകം’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ ഹീബ്രു പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ זָר
  choice: പൗരോഹിത്യശുശ്രൂഷയ്ക്ക് അധികാരമില്ലാത്ത ആരും
  rationale: ഇവിടെ זָר വംശീയമായി വിദേശിയായ ഒരാളെ അല്ല, അഹരോന്യ പൗരോഹിത്യത്തിന് പുറത്തുള്ള അനധികൃത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: അഹരോന്റെ സന്തതിയിൽപ്പെടാത്ത
  rationale: זֶרַע സൂചിപ്പിക്കുന്ന വംശപരമ്പരയുടെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: ധൂപം കാട്ടാൻ
  rationale: ധൂപം പുകയിക്കുന്ന പൗരോഹിത്യകർമത്തിന് മലയാളത്തിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗം.
- source_word: לִפְנֵי יְהוָה
  choice: യഹ്‌വേയുടെ സന്നിധിയിൽ
  rationale: ലിറ്റർജിക്കൽ സാന്നിധ്യത്തിന്റെ ആശയം നൽകുകയും ദൈവനാമമായ יהוה യഹ്‌വേ എന്നു ലിപ്യന്തരം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: കോരഹിനെയും അവന്റെ കൂട്ടരെയുംപോലെ ആകാതിരിക്കാനും
  rationale: കോരഹിന്റെയും അവനോടൊപ്പമുള്ള സംഘത്തിന്റെയും മാതൃകയോ ഗതിയോ പങ്കിടരുതെന്ന മുന്നറിയിപ്പ്, അതിലൊന്നിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘മോശെയുടെ കൈയാൽ’ എന്ന ഹീബ്രു പ്രയോഗം ഇടനിലക്കാരനായുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘മോശെയിലൂടെ’ എന്നു നൽകി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ / കർത്താവ്
  rationale: വാക്യത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയായി മാറ്റാതെ, സാധാരണയായി പുനർനിർമിക്കപ്പെടുന്ന ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- issue: പൗരോഹിത്യസന്ദർഭത്തിലെ זָר എന്ന പദത്തിന്റെ അർഥം
  choice: പൗരോഹിത്യശുശ്രൂഷയ്ക്ക് അധികാരമില്ലാത്ത ആൾ
  alternative: അന്യൻ / വിദേശി
  rationale: നിരോധനം വംശീയ വിദേശിത്വത്തെക്കുറിച്ചല്ല, അഹരോന്റെ വംശത്തിന് ഏൽപ്പിച്ച പൗരോഹിത്യകർമത്തിലേക്കുള്ള അനധികൃത പ്രവേശനത്തെക്കുറിച്ചാണ്.
- issue: ‘അവനോടു’ എന്ന സർവനാമത്തിന്റെ പൂർവപദം
  choice: വാചകത്തിൽ വ്യക്തമാക്കാതെ ‘അവനോടു’ എന്നു നിലനിർത്തി
  alternative: അഹരോനോടു
  rationale: സന്ദർഭത്തിൽ അഹരോൻ ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത; എങ്കിലും ഹീബ്രു വാചകം പേര് ആവർത്തിക്കാത്തതിനാൽ ആ സൂചന അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധം വ്യക്തമാക്കാൻ ‘ഇത്’ ചേർത്തു. പൗരോഹിത്യപരമായ ആശയം സാധാരണ വായനക്കാരന് തെറ്റിദ്ധാരണയില്ലാതെ മനസ്സിലാകാൻ זָר എന്നത് വിശദീകരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
