  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: ml
  text: സ്വന്തം ജീവൻ നഷ്ടമാകത്തക്കവിധം പാപം ചെയ്ത ഈ മനുഷ്യരുടെ ധൂപകലശങ്ങൾ[a] അടിച്ചുപരത്തി തകിടുകളാക്കി[b] യാഗപീഠത്തിനുള്ള ആവരണമാക്കണം. അവർ അവ യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിച്ചതിനാൽ അവ വിശുദ്ധമായിത്തീർന്നു[c]; അവ ഇസ്രായേൽമക്കൾക്ക്[d] ഒരു അടയാളമായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടെ ജീവനിൽ/ജീവനോടുകൂടെ പാപം ചെയ്തവർ’; ‘ഈ പാപികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘അടിച്ചുപരത്തിയ ലോഹത്തകിടുകളാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവ വിശുദ്ധീകരിക്കപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ക്രിയയുടെ കർത്താവ് ഏറ്റവും സ്വാഭാവികമായി ധൂപകലശങ്ങളാണ്.
    reason: lexical_alternative
  - marker: d
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്’; അഥവാ ‘ഇസ്രായേൽജനത്തിന്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: ധൂപകലശങ്ങൾ
  rationale: കലാപസംഭവത്തിൽ ധൂപം അർപ്പിക്കാൻ ഉപയോഗിച്ച പാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആചാരപരമായ പശ്ചാത്തലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപദമാണിത്.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: സ്വന്തം ജീവൻ നഷ്ടമാകത്തക്കവിധം പാപം ചെയ്ത ഈ മനുഷ്യർ
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ സംഭവാത്മക അർഥം ‘പാപം ചെയ്ത’ എന്നു നിലനിർത്തുകയും, בְּנַפְשֹׁתָם എന്ന പ്രയോഗം ഈ പാപം അവരുടെ മരണത്തിൽ കലാശിച്ചു എന്ന സന്ദർഭാർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: רִקֻּעֵי פַחִים
  choice: അടിച്ചുപരത്തി തകിടുകളാക്കി
  rationale: ലോഹം അടിച്ചുപരത്തി നേർത്ത തകിടുകളാക്കുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിന് ആവരണമാക്കണം
  rationale: തകിടുകൾ യാഗപീഠത്തിന്മേൽ പൊതിയാനുള്ള ആവരണമായി ഉപയോഗിക്കണമെന്ന ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: അവർ അവ യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിച്ചതിനാൽ
  rationale: הקריב എന്ന ആരാധനാസംബന്ധിയായ ‘അടുത്തുകൊണ്ടുവരുക/അർപ്പിക്കുക’ എന്ന അർഥം ഇവിടെ പാത്രങ്ങളെ സംബന്ധിച്ച് സ്വാഭാവികമായി നൽകുന്നു; ദൈവനാമം വ്യക്തിനാമമായി ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיִּקְדָּשׁוּ
  choice: അവ വിശുദ്ധമായിത്തീർന്നു
  rationale: ബഹുവചനക്രിയയുടെ ഏറ്റവും സ്വാഭാവികമായ മുൻസൂചകം ധൂപകലശങ്ങളാണ്; അവയ്ക്ക് വിശുദ്ധപദവി ലഭിച്ചുവെന്ന ഫലം നിലനിർത്തുന്നു, പ്രവർത്തകനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: וְיִהְיוּ לְאוֹת
  choice: അവ ഒരു അടയാളമായിരിക്കട്ടെ
  rationale: മുൻകല്പനയുടെ തുടർച്ചയായ നിർദേശസ്വരം നിലനിർത്തി, ഓർമപ്പെടുത്തലും മുന്നറിയിപ്പും ഉൾക്കൊള്ളാവുന്ന ‘അടയാളം’ എന്ന വിശാലപദം സംരക്ഷിക്കുന്നു.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ സമൂഹനാമത്തിന്റെ ഔപചാരികതയും മലയാളത്തിലെ പരിചിതമായ വേദഭാഷയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധമായിത്തീർന്നത് ആരോ എന്തോ എന്ന വാക്യഘടനാപരമായ ചോദ്യം
  choice: ധൂപകലശങ്ങൾ വിശുദ്ധമായിത്തീർന്നു
  alternative: പാപം ചെയ്ത മനുഷ്യർ പരിമിതമായ ആചാരാർഥത്തിൽ വിശുദ്ധരായി; അല്ലെങ്കിൽ കലശങ്ങൾ വെറും ആചാരോപയോഗത്തിനായി വേർതിരിക്കപ്പെട്ടു
  rationale: ബഹുവചനക്രിയയ്ക്ക് ഏറ്റവും അടുത്തും യുക്തിസഹവുമായ മുൻസൂചകം ധൂപകലശങ്ങളാണ്. പാപികളുമായി ബന്ധപ്പെട്ട വസ്തുക്കൾ ദൈവസന്നിധിയിൽ അർപ്പിക്കപ്പെട്ടതിനാൽ വിശുദ്ധമാകുന്നു എന്ന പാഠത്തിലെ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: בְּנַפְשֹׁתָם എന്നതിന്റെ അർഥം
  choice: അവരുടെ പാപം സ്വന്തം ജീവൻ നഷ്ടപ്പെടുന്നതിൽ കലാശിച്ചു
  alternative: അവർ സ്വന്തം ജീവനോടു വിരോധമായി പാപം ചെയ്തു; അല്ലെങ്കിൽ സ്വന്തം ആത്മാക്കളെ സംബന്ധിച്ച് പാപം ചെയ്തു
  rationale: സംഭവസന്ദർഭത്തിൽ കലാപം അവരുടെ മരണത്തിന് ഇടയാക്കിയതാണു പ്രധാന ആശയം; ‘ആത്മാവ്’–‘ശരീരം’ എന്ന വികസിത മാനവശാസ്ത്രഭേദം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ധൂപകലശം’, ‘യാഗപീഠം’, ‘സന്നിധി’, ‘വിശുദ്ധം’ എന്നീ പരിചിത ആരാധനാപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. യഹ്‌വെ എന്ന വ്യക്തിനാമം പദവിനാമംകൊണ്ട് മാറ്റിയിട്ടില്ല.
