revisions:
- from: സ്വന്തം ജീവൻ നഷ്ടമാകത്തക്കവിധം പാപം ചെയ്ത ഈ മനുഷ്യരുടെ ധൂപകലശങ്ങൾ[a] അടിച്ചുപരത്തി തകിടുകളാക്കി[b] യാഗപീഠത്തിന് ആവരണമാക്കണം. അവർ അവ യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിച്ചതിനാൽ അവ വിശുദ്ധമായിത്തീർന്നു[c]; അവ ഇസ്രായേൽമക്കൾക്ക്[d] ഒരു അടയാളമായിരിക്കട്ടെ.
  to: സ്വന്തം ജീവൻ നഷ്ടമാകത്തക്കവിധം പാപം ചെയ്ത ഈ മനുഷ്യരുടെ ധൂപകലശങ്ങൾ[a] അടിച്ചുപരത്തി തകിടുകളാക്കി[b] യാഗപീഠത്തിനുള്ള ആവരണമാക്കണം. അവർ അവ യഹ്‌വെയുടെ സന്നിധിയിൽ അർപ്പിച്ചതിനാൽ അവ വിശുദ്ധമായിത്തീർന്നു[c]; അവ ഇസ്രായേൽമക്കൾക്ക്[d] ഒരു അടയാളമായിരിക്കട്ടെ.
  rationale: The verse is retained substantially as drafted because it is faithful to the Hebrew and natural in modern standard Malayalam. The revision improves the altar-covering expression and corrects the lexical alternative in footnote c so that it reflects consecration/holiness rather than installation.
