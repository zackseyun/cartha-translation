  naturalness: ‘ഇങ്ങനെ സംഭവിച്ചു:’ എന്ന ആമുഖം സാധ്യമായിരുന്നാലും, ഈ വാക്യത്തിൽ അത് അല്പം കൃത്രിമമാണ്. ‘സംഭവിച്ചത് ഇങ്ങനെയാണ്’ എന്ന രൂപം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ സുഗമമായി പ്രവർത്തിക്കുന്നു. ‘അതാ’ എന്നത് הִנֵּהയുടെ ശ്രദ്ധക്ഷണവും നാടകീയതയും യോജ്യമായി നൽകുന്നു.
