id: NUM.17.7
reference: Numbers 17:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: ml
  text: 'സഭ മോശെയ്ക്കും അഹരോനും എതിരായി ഒന്നിച്ചുകൂടിയപ്പോൾ, സംഭവിച്ചത് ഇങ്ങനെയാണ്: അവർ സമാഗമകൂടാരത്തിലേക്കു തിരിഞ്ഞു; അതാ, മേഘം അതിനെ[a] മൂടി, യഹ്‌വെയുടെ മഹത്ത്വം പ്രത്യക്ഷപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ ‘അതിനെ’ എന്ന പ്രത്യയം ഏറ്റവും സ്വാഭാവികമായി ‘സമാഗമകൂടാരത്തെ’ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ഇങ്ങനെ സംഭവിച്ചു
  rationale: തുടർന്നുണ്ടായ സംഭവത്തിലേക്കുള്ള എബ്രായ ആഖ്യാനപരമായ മാറ്റം, പഴഞ്ചൻ പ്രയോഗമില്ലാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: സഭ ... ഒന്നിച്ചുകൂടിയപ്പോൾ
  rationale: בְ ചേർന്ന infinitive construct സൂചിപ്പിക്കുന്ന കാലസാഹചര്യവും, עֵדָהയുടെ സമൂഹപരമായ അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: മോശെയ്ക്കും അഹരോനും എതിരായി
  rationale: സന്ദർഭത്തിലെ ശത്രുതാപരമായ കൂട്ടംചേരൽ കണക്കിലെടുത്ത് עַל ഇവിടെ എതിർപ്പ് സൂചിപ്പിക്കുന്നു.
- source_word: וַיִּפְנוּ אֶל אֹהֶל מוֹעֵד
  choice: അവർ സമാഗമകൂടാരത്തിലേക്കു തിരിഞ്ഞു
  rationale: פנהയുടെ ശാരീരികമായി തിരിയുക എന്ന അർഥവും אֹהֶל מוֹעֵדയുടെ പരമ്പരാഗതവും ഘടകങ്ങളോട് ചേർന്നതുമായ മലയാള രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: וְהִנֵּה
  choice: അതാ
  rationale: അപ്രതീക്ഷിതവും ശ്രദ്ധേയവുമായ ദൃശ്യത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന הִנֵּהയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: כִסָּהוּ הֶעָנָן
  choice: മേഘം അതിനെ മൂടിയിരുന്നു
  rationale: ക്രിയയിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയം ‘അതിനെ’ എന്നു പ്രകടമാക്കുന്നു; ദൃശ്യം അവർ തിരിഞ്ഞുനോക്കിയപ്പോൾ നിലവിലുണ്ടായിരുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: וַיֵּרָא כְּבוֹד יְהוָה
  choice: യഹ്‌വെയുടെ മഹത്ത്വം പ്രത്യക്ഷപ്പെട്ടു
  rationale: Niphal രൂപത്തിന്റെ ദൃശ്യമായ വെളിപ്പെടൽ എന്ന ആശയവും כָּבוֹדയുടെ ഗൗരവമുള്ള ബൈബിൾ പദപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റോണിനെ ഒരു സ്ഥാനപ്പേരായി മാറ്റാതെ, Yahweh എന്ന ഉച്ചാരണത്തിന്റെ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം തന്നെയായതിനാൽ അതിനെ പദവിയാൽ പകരാതെ Yahweh എന്ന രൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- issue: כִסָּהוּയിലെ പ്രത്യയത്തിന്റെ സൂചിതപദം
  choice: സമാഗമകൂടാരം
  alternative: സഭയെയോ മുഴുവൻ ദൃശ്യത്തെയോ സൂചിപ്പിക്കുന്നു
  rationale: പുരുഷലിംഗ ഏകവചന പ്രത്യയത്തിന് ഏറ്റവും അടുത്തുള്ള പുരുഷലിംഗ ഏകവചന മുൻപദം אֹהֶל (‘കൂടാരം’) ആണ്. എങ്കിലും മലയാള മുഖ്യപാഠത്തിൽ ‘അതിനെ’ എന്ന് വച്ച് മൂലത്തിലെ പ്രത്യയരൂപം നിലനിർത്തുകയും വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം കാത്തുസൂക്ഷിക്കുന്ന മലയാളം. ‘അതാ’ ദൃശ്യത്തിന്റെ നാടകീയത നിലനിർത്തുന്നു; വാക്യവിഭജനം ദീർഘമായ എബ്രായ ഘടനയെ സ്വാഭാവിക മലയാള വായനയ്ക്ക് അനുയോജ്യമാക്കുന്നു.
