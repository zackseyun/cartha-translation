  text: וַ/יִּקַּ֞ח אֶלְעָזָ֣ר הַ/כֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַ/נְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַ/שְּׂרֻפִ֑ים וַֽ/יְרַקְּע֖וּ/ם צִפּ֥וּי לַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: ml
  text: അപ്പോൾ പുരോഹിതനായ എലെയാസാർ തീയിൽ ദഹിച്ചവർ[b] അർപ്പിച്ച വെങ്കല ധൂപകലശങ്ങൾ[a] എടുത്തു; അവയെ യാഗപീഠത്തിനുള്ള മേൽപ്പാളിയാക്കി[c] അടിച്ചുപരത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ധൂപകലശങ്ങൾ’ എന്നതിന് ‘തീച്ചട്ടികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം ‘ദഹിച്ചവർ’ അഥവാ ‘ദഹിപ്പിക്കപ്പെട്ടവർ’; മുൻവിവരണത്തിൽ തീയിൽ നശിച്ചവരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘മേൽപ്പാളി’ എന്നതിന് ‘ആവരണം’ അഥവാ ‘പൊതിയുന്ന പാളി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: ധൂപകലശങ്ങൾ
  rationale: കത്തുന്ന കനലും ധൂപവും വഹിക്കാൻ ഉപയോഗിച്ച ആരാധനാപാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ധൂപകലശങ്ങൾ’ ആചാരപരമായ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: הַנְּחֹשֶׁת
  choice: വെങ്കല
  rationale: നְחֹשֶׁת ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം; സമാഗമകൂടാരത്തിലെ ഉപകരണങ്ങളുടെ സന്ദർഭത്തിൽ ‘വെങ്കലം’ പതിവും സന്ദർഭോചിതവുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: הִקְרִיבוּ
  choice: അർപ്പിച്ച
  rationale: ഹിഫീൽ രൂപത്തിലുള്ള קרב ആരാധനാ-യാഗസന്ദർഭത്തിൽ അർപ്പിക്കുക എന്ന അർഥം നൽകുന്നു; മുൻപ് നടന്ന പ്രവൃത്തിയെയും ഇത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: הַשְּׂרֻפִים
  choice: തീയിൽ ദഹിച്ചവർ
  rationale: שׂרף എന്നതിന്റെ കർമണിപ്രയോഗത്തിലുള്ള കൃദന്തരൂപമാണ്; മുൻവിവരണത്തിൽ തീയിൽ നശിച്ചവരെ നിർവചനാത്മകമായി സൂചിപ്പിക്കുന്നു.
- source_word: וַיְרַקְּעוּם
  choice: അവ ... അടിച്ചുപരത്തി
  rationale: רקע ലോഹം അടിച്ചുപരത്തുക എന്നർഥം നൽകുന്നു. ഹീബ്രുവിലെ ബഹുവചന കർത്താവ് വ്യക്തമാക്കപ്പെടാത്തതിനാൽ മലയാളത്തിലെ ഈ കർമണസ്വഭാവമുള്ള ഘടന അനിശ്ചിത കർത്താവിനെ നിർബന്ധിച്ച് ചേർക്കാതെ ഫലം വ്യക്തമാക്കുന്നു.
- source_word: צִפּוּי
  choice: ആവരണം
  rationale: മറ്റൊന്നിനുമേൽ ഇടുന്ന പാളിയെയോ പൊതിയെയോ സൂചിപ്പിക്കുന്നു; ‘ആവരണം’ യാഗപീഠത്തിനുമേൽ ഘടിപ്പിച്ച ലോഹപ്പാളിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: לַמִּזְבֵּחַ
  choice: യാഗപീഠത്തിനുള്ള
  rationale: 'ലാമെദ് ഇവിടെ ഉദ്ദേശ്യം അഥവാ ഉപയോഗം സൂചിപ്പിക്കുന്നു: അടിച്ചുപരത്തിയ ലോഹം യാഗപീഠത്തിനുള്ള ആവരണമായി തീർന്നു.'
