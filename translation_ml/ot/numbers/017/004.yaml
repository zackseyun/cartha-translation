translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ആരാധനാസന്ദർഭത്തിനു യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഹീബ്രുവിൽ അടിച്ചുപരത്തിയവരുടെ കർത്താവ് പേരെടുത്ത് പറയാത്തതിനാൽ മലയാളത്തിലും കർത്താവിനെ നിർണ്ണയിച്ചിട്ടില്ല.
