source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കൾ[a] മോശെയോടു പറഞ്ഞു: “ഇതാ[b], ഞങ്ങൾ മരിച്ചുപോകുന്നു! ഞങ്ങൾ നശിച്ചുപോകുന്നു! ഞങ്ങളെല്ലാവരും നശിച്ചുപോകുന്നു![c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേല്യർ”; അക്ഷരാർഥത്തിൽ “ഇസ്രായേലിന്റെ മക്കൾ.”
    reason: lexical_alternative
  - marker: b
    text: എബ്രായയിലെ ഈ പദം ഇവിടെ ഭയം കലർന്ന ശ്രദ്ധാകർഷകമായ ആശ്ചര്യോദ്ഗാരമാണ്; “നോക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: എബ്രായപാഠം ആദ്യം “മരിക്കുക” (גוע), തുടർന്ന് രണ്ടുതവണ “നശിക്കുക” (אבד) എന്നീ വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുന്നു; ഈ ആവർത്തനം ജനത്തിന്റെ പരിഭ്രാന്തി ശക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായയിലെ ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന സമൂഹപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായി നിലനിർത്തുന്നു; ‘ഇസ്രായേല്യർ’ എന്നതും സാധ്യമാണ്.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: മോശയോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള ഉദ്ധരണിക്കു മുമ്പുള്ള לֵאמֹר മലയാളത്തിൽ വേറൊരു ‘പറഞ്ഞുകൊണ്ട്’ ചേർക്കാതെതന്നെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: הֵן
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും ഭയം കലർന്ന അടിയന്തരത പ്രകടിപ്പിക്കുകയും ചെയ്യുന്ന ആശ്ചര്യോദ്ഗാരമായി ഉപയോഗിച്ചു; സന്ദർഭത്തിൽ ഇത് ശാന്തമായ ചൂണ്ടിക്കാണിക്കൽ മാത്രമല്ല.
- source_word: גָּוַעְנוּ
  choice: ഞങ്ങൾ മരിച്ചുപോകുന്നു
  rationale: ജീവൻ വിടുക, മരിക്കുക എന്ന പ്രത്യേക അർത്ഥം നിലനിർത്തുകയും ജനത്തിന്റെ ഇപ്പോഴത്തെ പരിഭ്രാന്തി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: אָבַדְנוּ
  choice: ഞങ്ങൾ നശിച്ചുപോകുന്നു
  rationale: മുൻപത്തെ ‘മരിച്ചുപോകുന്നു’ എന്നതിൽനിന്ന് വേർതിരിച്ച് നാശം, വിനാശം എന്ന ശക്തമായ ആശയം നൽകുന്നു.
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: ഞങ്ങളെല്ലാവരും നശിച്ചുപോകുന്നു
  rationale: ‘എല്ലാവരും’ എന്ന സമഗ്രതയ്ക്കുള്ള ഊന്നലും אָבד എന്ന ക്രിയയുടെ പരിഭ്രാന്തിപൂർണമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള നിലവിളി. ‘മരിച്ചുപോകുന്നു / നശിച്ചുപോകുന്നു’ എന്ന വർത്തമാനപ്രവാഹരൂപങ്ങൾ അടിയന്തരമായ ഭയവും, രണ്ട് വ്യത്യസ്ത എബ്രായക്രിയകളുടെ അർത്ഥവ്യത്യാസവും പ്രകടമാക്കുന്നു.
