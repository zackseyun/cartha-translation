source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: ml
  text: 'യഹ്‌വെ മോശയോടു പറഞ്ഞു: “അഹരോന്റെ വടി സാക്ഷ്യത്തിന്റെ മുമ്പിൽ തിരികെ വെക്കുക.[b] അത് ധിക്കാരികളായ മക്കൾക്ക്[a] ഒരു അടയാളമായി സൂക്ഷിക്കപ്പെടട്ടെ. അങ്ങനെ എനിക്കെതിരെയുള്ള അവരുടെ പിറുപിറുപ്പുകൾ നീ അവസാനിപ്പിക്കുകയും അവർ മരിക്കാതിരിക്കുകയും ചെയ്യും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ധിക്കാരികൾക്ക്” അല്ലെങ്കിൽ “ധിക്കാരത്തിന്റെ മക്കൾക്ക്.”
    reason: lexical_alternative
  - marker: b
    text: “സാക്ഷ്യം” എന്നത് പെട്ടകവുമായി ബന്ധപ്പെട്ട നിയമസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതാകാം; എബ്രായപ്രയോഗം ഇവിടെ സംക്ഷിപ്തമായി തന്നെയാണ് നിലനിർത്തിയിരിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ പകരപ്പദമാക്കാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: הָשֵׁב
  choice: തിരികെ വെക്കുക
  rationale: ഹിഫീൽ ആജ്ഞാരൂപം വടി അതിന്റെ മുൻസ്ഥാനത്തേക്ക് മടക്കിവെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: מַטֵּה
  choice: വടി
  rationale: ഈ വസ്തുവിനും സന്ദർഭത്തിനും യോജിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദം.
- source_word: לִפְנֵי הָעֵדוּת
  choice: സാക്ഷ്യത്തിന്റെ മുമ്പിൽ
  rationale: എബ്രായത്തിലെ സംക്ഷിപ്ത പ്രയോഗം വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു; കൂടാരസന്ദർഭത്തിൽ ഇത് നിയമസാക്ഷ്യവുമായി ബന്ധപ്പെട്ടതാണ്.
- source_word: לְמִשְׁמֶרֶת
  choice: സൂക്ഷിക്കപ്പെടട്ടെ
  rationale: വടി കാവലോടെ നിലനിർത്തേണ്ട ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לְאוֹת
  choice: ഒരു അടയാളമായി
  rationale: אוֹת എന്ന പദത്തിന്റെ പതിവായ അർഥമായ അടയാളം/ചിഹ്നം കൃത്യമായി നൽകുന്നു.
- source_word: לִבְנֵי מֶרִי
  choice: മത്സരത്തിന്റെ മക്കൾക്ക്
  rationale: ‘മത്സരത്തിന്റെ മക്കൾ’ എന്ന അടയാളപ്പെടുത്തിയ എബ്രായ കുടുംബരൂപകം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: וּתְכַל
  choice: നീ അവസാനിപ്പിക്കുകയും
  rationale: כלה എന്ന ഹിഫീൽ രൂപത്തിന്റെ ‘അവസാനിപ്പിക്കുക, നിർത്തുക’ എന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: תְּלוּנֹּתָם
  choice: അവരുടെ പിറുപിറുപ്പുകൾ
  rationale: മരുഭൂമിയാത്രാവിവരണങ്ങളിൽ ആവർത്തിക്കുന്ന മുറുമുറുപ്പോടെയുള്ള പരാതിയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: מֵעָלַי
  choice: എനിക്കെതിരെയുള്ള
  rationale: പരാതികൾ യഹ്‌വെയ്ക്കെതിരെ ഉന്നയിക്കപ്പെടുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: וְלֹא יָמֻתוּ
  choice: അവർ മരിക്കാതിരിക്കുകയും ചെയ്യും
  rationale: എബ്രായത്തിലെ ഏകോപനവും ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ദൈവനാമം നേരിട്ട് വരുന്നതിനാൽ അതിനെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- issue: לִבְנֵי מֶרִי എന്ന ലിംഗചിഹ്നിത കുടുംബരൂപകം
  choice: മത്സരത്തിന്റെ മക്കൾ
  alternative: മത്സരിക്കുന്നവർ; മത്സരികളായ മക്കൾ
  rationale: എബ്രായത്തിലെ ‘മക്കൾ’ എന്ന രൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: וּתְכַל എന്ന ക്രിയയുടെ കർത്താവും വാക്യബന്ധവും
  choice: അങ്ങനെ ... നീ അവസാനിപ്പിക്കുകയും
  alternative: അവ അവസാനിക്കും
  rationale: എബ്രായത്തിലെ രണ്ടാംപുരുഷ ഏകവചന ഹിഫീൽ രൂപം മോശയെ വ്യാകരണപരമായ കർത്താവായി നിലനിർത്തുന്നു; ‘അങ്ങനെ’ ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കുടുംബരൂപകവും ‘സാക്ഷ്യം’ എന്ന സംക്ഷിപ്ത സാങ്കേതിക പ്രയോഗവും നിലനിർത്തി; അവ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
