source:
  edition: WLC
  text: וְ/אֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב עַל מַטֵּ֣ה לֵוִ֑י כִּ֚י מַטֶּ֣ה אֶחָ֔ד לְ/רֹ֖אשׁ בֵּ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: ml
  text: ലേവിയുടെ വടിയിൽ അഹരോന്റെ പേര് എഴുതണം; കാരണം, അവരുടെ പിതൃഭവനത്തിന്റെ തലവനുവേണ്ടി ഒരു വടിയുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഓരോ പിതൃഭവനത്തലവനും ഒരു വടി വീതം.” എബ്രായപ്രയോഗം വിതരണാർഥത്തിൽ മനസ്സിലാക്കാം: ഓരോ പിതൃഭവനത്തലവനെയും ഓരോ വടി പ്രതിനിധീകരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: —
  rationale: ബന്ധകമായ וְ മുൻവാക്യത്തിലെ നിർദേശത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യാരംഭത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതിരിക്കുന്നത് സ്വാഭാവികമാണ്. אֵת നേരിട്ടു പരിഭാഷപ്പെടാത്ത കർമചിഹ്നമാണ്.
- source_word: שֵׁם אַהֲרֹן
  choice: അഹരോന്റെ പേര്
  rationale: വടിയിൽ എഴുതേണ്ട വ്യക്തിനാമം എന്ന അർത്ഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: תִּכְתֹּב
  choice: എഴുതണം
  rationale: നിർദേശസന്ദർഭത്തിലെ രണ്ടാംപുരുഷ ഏകവചന ക്രിയയെ മലയാളത്തിലെ മാന്യവും സ്വാഭാവികവുമായ നിർബന്ധരൂപത്തിൽ നൽകുന്നു.
- source_word: עַל מַטֵּה לֵוִי
  choice: ലേവിയുടെ വടിയിൽ
  rationale: מַטֶּה ഇവിടെ യഥാർഥ വടിയെയും ഗോത്രത്തിന്റെ പ്രതിനിധിചിഹ്നത്തെയും സൂചിപ്പിക്കുന്നു; 'വടി' സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിലവിലുള്ള സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: כִּי
  choice: കാരണം സൂചിപ്പിക്കുന്ന അർധവിരാമബന്ധം
  rationale: തുടർന്നുള്ള വാക്യം മുൻനിർദേശത്തിന്റെ കാരണം വിശദീകരിക്കുന്നു; മലയാളത്തിൽ അർധവിരാമത്തിനു ശേഷമുള്ള പ്രസ്താവന ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: מַטֶּה אֶחָד
  choice: ഒരു വടി വീതം
  rationale: אֶחָד എന്നതിന്റെ ഏകത്വവും ഇവിടെ സാധ്യതയുള്ള വിതരണാർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: അവരുടെ പിതൃഭവനത്തിന്റെ തലവന്
  rationale: רֹאשׁ എന്ന 'തലവൻ' എന്ന സാമൂഹികപദവിയും בֵּית אֲבוֹתָם എന്ന പിതൃവംശീയ കുടുംബ/കുലഘടകവും ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
