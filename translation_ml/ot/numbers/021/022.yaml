source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: ml
  text: “അങ്ങയുടെ ദേശത്തുകൂടി കടന്നുപോകാൻ എന്നെ അനുവദിക്കണമേ. ഞങ്ങൾ വയലിലേക്കോ മുന്തിരിത്തോട്ടത്തിലേക്കോ തിരിഞ്ഞുകയറുകയില്ല; കിണറ്റിലെ വെള്ളം കുടിക്കുകയുമില്ല. അങ്ങയുടെ അതിർത്തി കടന്നുപോകുന്നതുവരെ ഞങ്ങൾ രാജപാതയിലൂടെ[a] തന്നെ സഞ്ചരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “രാജാവിന്റെ വഴിയിലൂടെ.” പരമ്പരാഗതമായി, “രാജാവിന്റെ പെരുവഴിയിലൂടെ” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: കടന്നുപോകാൻ എന്നെ അനുവദിക്കണമേ
  rationale: ഒന്നാംപുരുഷ ഏകവചന cohortative രൂപം ഈ നയതന്ത്രസന്ദർഭത്തിൽ വിനീതമായ അഭ്യർഥനയാണ്; മലയാളത്തിൽ ഈ പ്രയോഗം അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְאַרְצְךָ
  choice: അങ്ങയുടെ ദേശത്തുകൂടി
  rationale: אֶרֶץ ഇവിടെ രാജാവിന്റെ അധീനതയിലുള്ള ദേശം/പ്രദേശം എന്ന ഭൂമിശാസ്ത്ര-രാഷ്ട്രീയ അർഥത്തിലാണ്; യാത്രയുടെ ദിശ വ്യക്തമാക്കാൻ ‘-ത്തുകൂടി’ ഉപയോഗിച്ചു.
- source_word: לֹא נִטֶּה
  choice: ഞങ്ങൾ ... തിരിഞ്ഞുകയറുകയില്ല
  rationale: യാത്രാമാർഗത്തിൽനിന്ന് കൃഷിയിടങ്ങളിലേക്കു മാറിപ്പോകില്ല എന്ന അർഥം; ‘തിരിഞ്ഞുകയറുക’ മലയാളത്തിൽ സ്ഥലത്തേക്കുള്ള വ്യതിചലനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: വയലിലേക്കോ മുന്തിരിത്തോട്ടത്തിലേക്കോ
  rationale: ഏകവചന നാമങ്ങൾ ഇവിടെ പൊതുവായ/distributive അർഥത്തിലാണ്; മലയാളത്തിലെ ‘-ഓ ... -ഓ’ നിഷേധവാക്യത്തിൽ ‘ഒന്നിലേക്കും’ എന്ന ആശയം സ്വാഭാവികമാക്കുന്നു.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: കിണറ്റിലെ വെള്ളം കുടിക്കുകയുമില്ല
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കിണറ്റിലെ വെള്ളം’ നിലനിർത്തി, പ്രദേശവാസികളുടെ ജലവിഭവം ഉപയോഗിക്കില്ലെന്ന ഉറപ്പ് സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: രാജപാതയിലൂടെ
  rationale: അക്ഷരാർഥം ‘രാജാവിന്റെ വഴി’ എന്നാണ്; പ്രധാന ഔദ്യോഗിക പൊതുവഴിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും നിലവാരമുള്ളതുമായ മലയാളപ്രയോഗം ‘രാജപാത’ ആണ്. കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: נֵלֵךְ
  choice: ഞങ്ങൾ ... സഞ്ചരിക്കും
  rationale: הלך എന്ന സാധാരണ ഗതിവാചകത്തിന് ദീർഘയാത്രാസന്ദർഭത്തിൽ ‘സഞ്ചരിക്കും’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: കടന്നുപോകുന്നതുവരെ
  rationale: അതിർത്തി കടക്കുന്നതോടെ അവസാനിക്കുന്ന യാത്രാഭാഗം ‘-ുന്നതുവരെ’ എന്ന ഘടന വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: גְּבֻלֶךָ
  choice: അങ്ങയുടെ അതിർത്തി
  rationale: גְּבוּל അടിസ്ഥാനമായി അതിർത്തി/പരിധി എന്നാണ്; ‘അതിർത്തി കടന്നുപോകുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ഹീബ്രുവിലെ മൂർത്തമായ ഭൂമിശാസ്ത്രചിത്രം സംരക്ഷിക്കുന്നതുമാണ്.
