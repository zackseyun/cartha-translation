translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും നയതന്ത്രപരവുമായ അഭ്യർഥനാശൈലി സ്വീകരിച്ചു. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ രൂപം ഉപയോഗിച്ചു. വാക്യത്തിലെ ഏകവചന അഭ്യർഥനയും തുടർന്നുള്ള ബഹുവചന ഉറപ്പുകളും ഹീബ്രുവിനനുസരിച്ച് നിലനിർത്തി.
