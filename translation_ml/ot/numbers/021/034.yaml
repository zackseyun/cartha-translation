source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: ml
  text: 'യാഹ്‌വെ മോശയോടു പറഞ്ഞു: “അവനെ ഭയപ്പെടേണ്ടാ; അവനെയും അവന്റെ സകല ജനത്തെയും അവന്റെ ദേശത്തെയും ഞാൻ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു.[a] ഹെശ്ബോനിൽ പാർത്തിരുന്ന അമോര്യരുടെ രാജാവായ സീഹോനോടു നീ ചെയ്തതുപോലെ അവനോടും നീ ചെയ്യണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു” എന്നത് “നിന്റെ അധികാരത്തിൽ ഏല്പിച്ചിരിക്കുന്നു” എന്നർഥമുള്ള എബ്രായ ശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പൊതുപദവിയാക്കി മാറ്റാതെ, മലയാളത്തിൽ സുപരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: אַל תִּירָא אֹתוֹ
  choice: അവനെ ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധാത്മക കല്പനയുടെ നേരിട്ടുള്ള അർഥവും ഗൗരവമുള്ള സ്വാഭാവിക മലയാളവും സംരക്ഷിക്കുന്നു.
- source_word: בְיָדְךָ נָתַתִּי
  choice: ഞാൻ നിന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു
  rationale: ‘കൈയിൽ കൊടുക്കുക’ എന്ന എബ്രായ ദൃശ്യഭാഷ നിലനിർത്തിക്കൊണ്ട്, മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയാരൂപവും നിലനിർത്തുന്നു.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: അവനെയും അവന്റെ സകലജനത്തെയും അവന്റെ ദേശത്തെയും
  rationale: ഓഗ്, അവന്റെ ജനം, അവന്റെ ദേശം എന്നീ മൂന്ന് കർമങ്ങളെയും എബ്രായത്തിലെ സമാന്തരഘടനയോടെ ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: അവനോടും ചെയ്യണം
  rationale: തുടർന്നുള്ള താരതമ്യവുമായി നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുകയും സന്ദർഭത്തിലെ നിർദേശാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ സീഹോനോടു
  rationale: പേരും രാജപദവിയും വ്യക്തമായി നൽകുന്നു; ഏകവചന ജനവിഭാഗനാമം മലയാളത്തിൽ പതിവായ സമൂഹസൂചനയായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽ പാർത്തിരുന്ന
  rationale: ישב എന്ന പങ്കാളിക്രിയയുടെ താമസിക്കുക/വസിക്കുക എന്ന അർഥം ഗൗരവമുള്ളതും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം ‘കർത്താവ്’ എന്ന പദവിയാൽ പകരാതെ വ്യക്തിനാമമായി നിലനിർത്തുന്നു. മലയാള ബൈബിൾ വായനയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന രൂപമാണ് തെരഞ്ഞെടുത്തത്; ‘യാഹ്‌വെ’ എന്നത് സാധ്യതയുള്ള മറ്റൊരു ലിപ്യന്തരണമാണ്.
- issue: നָתַתִּי എന്ന പൂർത്തിക്രിയയുടെ ഉറപ്പുള്ള വാഗ്ദാനഭാവം
  choice: ഏല്പിച്ചിരിക്കുന്നു
  alternative: ഏല്പിക്കും
  rationale: യുദ്ധഫലം ഇനിയും ചരിത്രത്തിൽ പൂർണമായി സംഭവിച്ചിട്ടില്ലെങ്കിലും ദൈവിക പ്രഖ്യാപനത്തിൽ അത് ഉറപ്പായും പൂർത്തിയായതായും അവതരിപ്പിക്കുന്ന എബ്രായരൂപം സംരക്ഷിക്കുന്നു; ഭാവികാലമാക്കി മാറ്റി ആ വാചകത്തിലെ ദൈവിക ഉറപ്പ് ലഘൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള ശൈലി. എബ്രായത്തിന്റെ നേരിട്ടുള്ള ഘടന സാധ്യമായിടത്ത് നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദക്രമം ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പിനോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
