source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: ml
  text: കാരണം, ഹെശ്ബോൻ അമോര്യരുടെ രാജാവായ സീഹോന്റെ നഗരമായിരുന്നു. അവൻ മോവാബിലെ മുൻ രാജാവിനോടു യുദ്ധം ചെയ്ത്, അർന്നോൻവരെയുള്ള ആ രാജാവിന്റെ ദേശം മുഴുവനും അവന്റെ കൈയിൽനിന്ന്[a] പിടിച്ചെടുത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ അധികാരത്തിൽനിന്ന്”; ഹീബ്രു പ്രയോഗത്തിന്റെ അക്ഷരാർഥം “അവന്റെ കൈയിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണം നൽകുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: עִיר סִיחֹן
  choice: സീഹോന്റെ നഗരം
  rationale: ഹെശ്ബോൻ സീഹോന്റെ രാജകീയ കേന്ദ്രമായിരുന്നുവെന്ന ഉടമസ്ഥതാസംബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരുടെ
  rationale: ഏകവചന വിശേഷണരൂപം സൂചിപ്പിക്കുന്ന ജനവിഭാഗബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ബഹുവചന ജനനാമംകൊണ്ട് നൽകുന്നു.
- source_word: נִלְחַם בְּ
  choice: യുദ്ധംചെയ്ത്
  rationale: സന്ദർഭത്തിൽ എതിരാളിയോടുള്ള യുദ്ധത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള കീഴടക്കലുമായി പ്രവർത്തനക്രമം ബന്ധിപ്പിക്കുന്നു.
- source_word: הָרִאשׁוֹן
  choice: മുൻ
  rationale: ഇവിടെ 'ഒന്നാമത്തെ' എന്ന ക്രമസംഖ്യയെക്കാൾ മുമ്പുണ്ടായിരുന്ന രാജാവെന്ന അർത്ഥമാണ് സന്ദർഭോചിതം.
- source_word: וַיִּקַּח
  choice: പിടിച്ചെടുത്തിരുന്നു
  rationale: വിശദീകരിക്കപ്പെടുന്ന നിലവിലെ സാഹചര്യത്തിനു മുമ്പ് നടന്ന കീഴടക്കലിനെ മലയാളത്തിലെ പൂർത്തഭൂതരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כָּל אַרְצוֹ
  choice: അവന്റെ ദേശം മുഴുവനും
  rationale: സർവനാമം മോവാബിന്റെ മുൻ രാജാവിനെ സൂചിപ്പിക്കുന്നതിലെ മൂലപാഠസാദൃശ്യം നിലനിർത്തുന്നു.
- source_word: מִיָּדוֹ
  choice: അവന്റെ കൈയിൽനിന്ന്
  rationale: നിയന്ത്രണത്തിൽനിന്ന് എടുത്തുകളയുക എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; അർത്ഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: עַד אַרְנֹן
  choice: അർന്നോൻവരെയുള്ള
  rationale: കീഴടക്കിയ ദേശത്തിന്റെ അതിർത്തിവ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
