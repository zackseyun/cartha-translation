translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. കീഴടക്കലും തുടർന്ന് താമസമുറപ്പിക്കലും തമ്മിലുള്ള ക്രമം നിലനിർത്തി. ആവർത്തിച്ചിരിക്കുന്ന ‘ഇസ്രായേൽ’ ഒഴിവാക്കാതെ സൂക്ഷിച്ചു. പ്രധാന പട്ടണമായ ഹെശ്ബോനും അതിനോടു ബന്ധപ്പെട്ട കുടിയിരുപ്പുകളും തമ്മിലുള്ള ബന്ധം വിരാമചിഹ്നങ്ങളിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
