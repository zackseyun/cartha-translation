source:
  edition: WLC
  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: ml
  text: ഇസ്രായേൽ ഈ പട്ടണങ്ങളെല്ലാം പിടിച്ചെടുത്തു; അമോര്യരുടെ എല്ലാ പട്ടണങ്ങളിലും—ഹെശ്ബോനിലും അതിന്റെ എല്ലാ ആശ്രിത കുടിയിരുപ്പുകളിലും[a]—ഇസ്രായേൽ താമസമുറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അതിന്റെ എല്ലാ പുത്രിമാരിലും’; ഒരു പ്രധാന പട്ടണത്തോടു ബന്ധപ്പെട്ട ചെറിയ ആശ്രിത കുടിയിരുപ്പുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: പിടിച്ചെടുത്തു
  rationale: לקח എന്നതിന് അടിസ്ഥാനാർഥം ‘എടുക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ യുദ്ധസന്ദർഭത്തിൽ പട്ടണങ്ങൾ കൈവശമാക്കുന്നതാണ് ഉദ്ദേശ്യം. ‘പിടിച്ചെടുത്തു’ എന്നത് അധിക വ്യാഖ്യാനം ചേർക്കാതെ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: ഈ പട്ടണങ്ങളെല്ലാം
  rationale: עיר നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർഥം നൽകാം. ഈ പുരാതന കുടിയിരുപ്പുകളെ സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ ‘പട്ടണങ്ങൾ’ സ്വാഭാവികമാണ്; ‘ഈ’ എന്ന നിർദ്ദേശകവും പൂർണമായി നിലനിർത്തുന്നു.
- source_word: וַיֵּשֶׁב
  choice: പാർപ്പുറപ്പിച്ചു
  rationale: ישב ഇരിക്കുക, വസിക്കുക, കുടിയേറുക എന്നീ അർഥങ്ങൾ നൽകുന്നു. കീഴടക്കിയ സ്ഥലങ്ങളിൽ താമസം ആരംഭിച്ചതിനെ ‘പാർപ്പുറപ്പിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: അമോര്യരുടെ എല്ലാ പട്ടണങ്ങളിലും
  rationale: എബ്രായത്തിലെ സംയുക്തബന്ധം വ്യക്തമായി നിലനിർത്തുകയും ജനവിഭാഗത്തിന്റെ ഉടമസ്ഥതയോ ബന്ധമോ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: בְּחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിലും
  rationale: സ്ഥലനാമം എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; സന്ദർഭത്തിലെ ‘-ൽ’ ബന്ധവും ചേർത്തിരിക്കുന്നു.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: അതിന്റെ എല്ലാ ഉപനഗരങ്ങളിലും
  rationale: ‘അതിന്റെ പുത്രിമാർ’ എന്ന പദാനുപദ രൂപം വലിയ പട്ടണത്തോടു ബന്ധപ്പെട്ട ആശ്രിത കുടിയിരുപ്പുകളെ സൂചിപ്പിക്കുന്ന എബ്രായ ശൈലിയാണ്. ‘ഉപനഗരങ്ങൾ’ ആ ബന്ധം സാധാരണ മലയാളവായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
