id: NUM.21.16
reference: Numbers 21:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ ബേറിലേക്കു പോയി.[a] അത്, “ജനത്തെ ഒരുമിച്ചുകൂട്ടുക; ഞാൻ അവർക്കു വെള്ളം നൽകും” എന്നു യഹ്‌വെ മോശയോടു പറഞ്ഞ ആ കിണറാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ബേർ” സ്ഥലത്തിന്റെ പേരാണ്; ഈ എബ്രായ സ്ഥലനാമത്തിന് “കിണർ” എന്ന എബ്രായപദത്തോടു ശബ്ദസാദൃശ്യമുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുൻ യാത്രാവിവരണത്തിന്റെ തുടർച്ച വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: בְּאֵרָה
  choice: അവർ ബേറിലേക്കു പോയി
  rationale: സ്ഥലനാമത്തോടു ചേർന്ന ദിശാസൂചകമായ -ה ‘ബേറിലേക്ക്’ എന്ന ചലനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി സന്ദർഭത്തിൽനിന്ന് ‘അവർ ... പോയി’ എന്നു ചേർത്തു.
- source_word: הִוא הַבְּאֵר
  choice: ആ കിണറിനെക്കുറിച്ചാണ്
  rationale: മുമ്പു പറഞ്ഞ ബേർ എന്ന സ്ഥലത്തെ പ്രസിദ്ധമായ കിണറുമായി തിരിച്ചറിയിക്കുന്ന ഘടന; തുടർന്നുള്ള ആപേക്ഷികവാക്യത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: യഹ്‌വെ മോശയോട് ഇങ്ങനെ പറഞ്ഞത്
  rationale: കിണറിനെ ദൈവിക പ്രസ്താവനയുമായി ബന്ധിപ്പിക്കുന്ന ആപേക്ഷികഘടന നിലനിർത്തുന്നു; ഉദ്ധരണിക്ക് മുമ്പ് ‘ഇങ്ങനെ’ എന്നത് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: אֱסֹף אֶת־הָעָם
  choice: ജനത്തെ ഒരുമിച്ചുകൂട്ടുക
  rationale: മോശയോടുള്ള ഏകവചന കല്പനയും ഇസ്രായേൽജനത്തെ കൂട്ടിച്ചേർക്കുക എന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: ഞാൻ അവർക്കു വെള്ളം കൊടുക്കും
  rationale: കല്പനയ്ക്കു പിന്നാലെയുള്ള ഒന്നാംപുരുഷ കോഹോർട്ടേറ്റീവ് ഇവിടെ ദൈവത്തിന്റെ ഉദ്ദേശ്യവും ഉറപ്പും പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭാവികാലം അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠം വ്യക്തിനാമം നേരിട്ട് ഉപയോഗിക്കുന്നതിനാൽ, പദവിയായ ‘കർത്താവ്’ എന്നു പകരംവയ്ക്കാതെ ദൈവനാമം ലിപ്യന്തരിച്ചു; ‘യഹോവ’യെക്കാൾ എബ്രായരൂപത്തോട് അടുത്തത് ‘യഹ്‌വെ’യാണ്.
- issue: וְאֶתְּנָה എന്ന കോഹോർട്ടേറ്റീവിന്റെ ഭാവം
  choice: ഞാൻ അവർക്കു വെള്ളം കൊടുക്കും
  alternative: ഞാൻ അവർക്കു വെള്ളം കൊടുക്കേണ്ടതിന് / ഞാൻ അവർക്കു വെള്ളം കൊടുക്കട്ടെ
  rationale: രൂപത്തിന് ഉദ്ദേശ്യമോ ദൃഢനിശ്ചയമോ സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഈ നേരിട്ടുള്ള ദൈവികവചനത്തിൽ ഉറപ്പുള്ള ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ഭാവികാലം തിരഞ്ഞെടുത്തു; സാധ്യതയുള്ള വ്യാകരണസൂക്ഷ്മതയെ ഒരു സിദ്ധാന്തപരമായ അവകാശവാദമാക്കി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ യാത്രാദിശ വ്യക്തമാക്കാൻ സന്ദർഭാനുസൃതമായി ‘അവർ ... പോയി’ ചേർത്തു. അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങളോ സഭാപാരമ്പര്യവിശേഷങ്ങളോ ഉൾപ്പെടുത്തിയിട്ടില്ല.
