  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: ml
  text: 'കാരണം, ഹെശ്ബോനിൽനിന്ന് തീ പുറപ്പെട്ടു,

    സീഹോന്റെ നഗരത്തിൽനിന്ന് ഒരു ജ്വാല;

    അത് മോവാബിലെ ആർ എന്ന പട്ടണത്തെയും

    അർന്നോനിലെ ഉയർന്ന സ്ഥലങ്ങളുടെ ഉടമകളെയും[a] ദഹിപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അർന്നോനിലെ ഉന്നതാരാധനാസ്ഥലങ്ങളുടെ ഉടമകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ഉയർന്ന സ്ഥലങ്ങൾ’ എന്ന ഹീബ്രു പദം ആരാധനയ്ക്കുപയോഗിച്ചിരുന്ന ഉന്നതാരാധനാസ്ഥലങ്ങളെയോ പൊതുവായി അർന്നോൻ പ്രദേശത്തെ ഉയരങ്ങളെയോ സൂചിപ്പിക്കാം. ‘ഉടമകൾ’ എന്നതിന് ‘യജമാനന്മാർ’ അഥവാ ‘അധിപന്മാർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: കാരണം
  rationale: മുൻവരിയിലെ വാക്കുകൾക്കുള്ള കാരണമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ഹീബ്രു ബന്ധകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: אֵשׁ יָצְאָה
  choice: തീ പുറപ്പെട്ടു
  rationale: ഒരു സ്ഥലത്തുനിന്ന് തീ പുറപ്പെടുന്ന കാവ്യചിത്രം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പകർത്തുന്നു.
- source_word: מֵחֶשְׁבּוֹן
  choice: ഹെശ്ബോനിൽനിന്ന്
  rationale: സ്ഥലനാമം ലിപ്യന്തരണം ചെയ്ത് പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഉപസർഗം വ്യക്തമായി നൽകുന്നു.
- source_word: לֶהָבָה
  choice: ഒരു ജ്വാല
  rationale: തീയോടുള്ള കാവ്യസമാന്തരതയും ദൃശ്യബിംബവും നിലനിർത്തുന്നു.
- source_word: מִקִּרְיַת סִיחֹן
  choice: സീഹോന്റെ നഗരത്തിൽനിന്ന്
  rationale: קִרְיָה എന്ന സാധാരണ നാമത്തിന്റെ ‘നഗരം’ എന്ന അർഥവും സീഹോനുമായുള്ള ബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: אָכְלָה
  choice: ദഹിപ്പിച്ചു
  rationale: തീ ‘തിന്നുകളയുന്നു’ എന്ന ഹീബ്രു രൂപകത്തിന്റെ നാശകരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: עָר מוֹאָב
  choice: മോവാബിലെ ആർ പട്ടണം
  rationale: עָר ഇവിടെ അറിയപ്പെടുന്ന സ്ഥലനാമമായ ‘ആർ’ ആണെന്ന തിരിച്ചറിവ് നിലനിർത്തുകയും മലയാളവായനക്കാർക്ക് അത് പട്ടണമാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: בַּעֲלֵי
  choice: പ്രഭുക്കന്മാർ
  rationale: ‘ഉടമകൾ/യജമാനന്മാർ/പ്രഭുക്കന്മാർ’ എന്ന നേരിട്ടുള്ള അർഥങ്ങളിൽ കാവ്യസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ പദം തിരഞ്ഞെടുക്കുന്നു; ‘നിവാസികൾ’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: בָּמוֹת אַרְנֹן
  choice: അർന്നോനിലെ ഉയർന്ന സ്ഥലങ്ങൾ
  rationale: בָּמוֹת എന്ന പദത്തിന് ഭൂമിശാസ്ത്രപരമായ ‘ഉയർന്ന സ്ഥലങ്ങൾ’ എന്നും ആരാധനാസംബന്ധിയായ ‘പൂജാഗിരികൾ’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാനപാഠത്തിൽ കൂടുതൽ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: בָּמוֹת എന്നത് ആരാധനാകേന്ദ്രങ്ങളെയോ ഭൂമിശാസ്ത്രപരമായ ഉയരങ്ങളെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന അനിശ്ചിതത്വം
  choice: ഉയർന്ന സ്ഥലങ്ങൾ
  alternative: പൂജാഗിരികൾ
  rationale: സന്ദർഭം കാവ്യാത്മകവും ഭൂമിശാസ്ത്രപരവുമായതിനാൽ ആരാധനാസംബന്ധിയായ അർഥം നിർബന്ധിച്ച് ചുമത്താതെ ഹീബ്രുവിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കാവ്യശൈലി ഉപയോഗിച്ചു. തീ/ജ്വാല എന്ന സമാന്തരബിംബവും വരികളുടെ താളവും നിലനിർത്തി; സ്ഥലനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ലിപ്യന്തരണരീതിയോട് ചേർത്ത് നൽകി.
