  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി സ്വീകരിച്ചു. ഹീബ്രുവിലെ സംക്ഷിപ്ത പട്ടികാശൈലി നിലനിർത്തിക്കൊണ്ട്, ഗമനം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ആവശ്യമായ ‘-ലേക്ക്’ ചേർത്തു. അടിക്കുറിപ്പ് യഥാർഥത്തിൽ വിശദീകരിക്കുന്ന ‘ബാമോത്ത്’ എന്ന പദത്തിനുശേഷമാണ് [a] നൽകിയിരിക്കുന്നത്.
