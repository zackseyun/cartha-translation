lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: മത്താനയിൽനിന്ന്
  rationale: וּ എന്ന സംയോജകവും מִן എന്ന ‘നിന്ന്’ അർഥമുള്ള ഉപസർഗവും പരിഗണിച്ചു. മַתָּנָה ഇവിടെ യാത്രാവിവരണത്തിലെ സ്ഥലനാമമായതിനാൽ അർഥം വിവർത്തനം ചെയ്യാതെ ‘മത്താന’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: נַחֲלִיאֵל
  choice: നഹലീയേലിലേക്ക്
  rationale: ഹീബ്രുവിൽ ഈ പേരിനു മുമ്പ് ദിശാസൂചക ഉപസർഗമില്ലെങ്കിലും, ഒരു താവളത്തിൽനിന്ന് അടുത്തതിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത ശൈലിയാണിത്. അതിനാൽ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ ‘-ലേക്ക്’ ചേർത്തു; സ്ഥലനാമം ‘നഹലീയേൽ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: നഹലീയേലിൽനിന്ന്
  rationale: וּ എന്നതിനെ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘-ഉം’ രൂപത്തിലൂടെയും מִן എന്നതിനെ ‘നിന്ന്’ എന്നും നൽകി; ആവർത്തിക്കുന്ന സ്ഥലനാമം ഒരേവിധം ലിപ്യന്തരിച്ചു.
- source_word: בָּמֽוֹת
  choice: ബാമോത്തിലേക്ക്
  rationale: യാത്രാമാർഗത്തിലെ ഈ സന്ദർഭത്തിൽ בָּמוֹת ഒരു സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘ബാമോത്ത്’ എന്നു ലിപ്യന്തരിച്ചു. മുൻപത്തെ ഘട്ടത്തെപ്പോലെ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘-ലേക്ക്’ ചേർത്തു.
