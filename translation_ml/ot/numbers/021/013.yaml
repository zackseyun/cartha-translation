id: NUM.21.13
reference: Numbers 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ പുറപ്പെട്ട് അർനോന്റെ മറുകരയിൽ[a], അമോര്യരുടെ അതിർത്തിയിൽനിന്ന് വ്യാപിച്ചുകിടക്കുന്ന മരുഭൂമിയിൽ[b], പാളയമിറങ്ങി. അർനോൻ മോവാബിനും അമോര്യർക്കും മധ്യേയുള്ള മോവാബിന്റെ അതിർത്തിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അർനോന്റെ അപ്പുറത്ത്.” സ്ഥാനം വിവരിക്കുന്നവന്റെ കാഴ്ചപ്പാടനുസരിച്ച്, ഹീബ്രു പ്രയോഗത്തിന് ഒരു അതിർത്തിയുടെ മറുവശത്തെയോ അതിനപ്പുറമുള്ള പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അമോര്യന്റെ അതിർത്തിയിൽനിന്ന് പുറപ്പെടുന്ന.” ഇവിടെ മരുഭൂമി അമോര്യരുടെ അതിർത്തിയിൽനിന്ന് വ്യാപിച്ചുകിടക്കുന്നു എന്നാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: נָסָעוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ പാളയം പൊളിച്ച് മുന്നോട്ടു നീങ്ങുക എന്ന נסע എന്ന ക്രിയയുടെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: താമസത്തിനായി പാളയം സ്ഥാപിച്ചു എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: അർനോന്റെ മറുകരയിൽ
  rationale: עֵבֶר സൂചിപ്പിക്കുന്ന മറുവശം/അക്കരെ എന്ന സ്ഥലബന്ധം നിലനിർത്തുന്നു; കാഴ്ചപ്പാട് നിർണയിക്കാതെ വിടുന്നു.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: അമോര്യരുടെ അതിർത്തിയിൽനിന്ന് വ്യാപിച്ചുകിടക്കുന്ന മരുഭൂമിയിൽ
  rationale: ഹീബ്രു വാക്യഘടനയിലെ ഭൂമിശാസ്ത്രവിവരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും יצא എന്ന പദത്തിന്റെ അക്ഷരാർഥമായ ‘പുറപ്പെടുക’ ഇവിടെ വിസ്തൃതിയെ സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: രണ്ടിടത്തും പ്രദേശങ്ങളെ വേർതിരിക്കുന്ന അതിരാണ് ഉദ്ദേശിക്കുന്നത്; ‘അതിർത്തി’ വ്യക്തവും സ്ഥിരവുമായ പരിഭാഷയാണ്.
- source_word: הָאֱמֹרִי
  choice: അമോര്യർ
  rationale: രൂപത്തിൽ ഏകവചനമായിരുന്നാലും ജനവിഭാഗത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ബഹുവചനരൂപം സ്വാഭാവികമാണ്.
- source_word: כִּי
  choice: (സ്വതന്ത്ര വിശദീകരണവാക്യമായി)
  rationale: മുൻ ഭൂമിശാസ്ത്രവിവരണത്തിന്റെ കാരണം/വിശദീകരണം നൽകുന്ന ബന്ധം മലയാളത്തിൽ പുതിയ വാക്യത്തിലൂടെ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: അർനോൻ ... മോവാബിന്റെ അതിർത്തിയാണ്
  rationale: ക്രിയയില്ലാത്ത ഹീബ്രു നാമവാക്യത്തെ നിലവിലുള്ള ഭൂമിശാസ്ത്രസത്യമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: മോവാബിനും അമോര്യർക്കും മധ്യേയുള്ള
  rationale: ആവർത്തിച്ചുള്ള בין ഘടന സൂചിപ്പിക്കുന്ന രണ്ടു പ്രദേശങ്ങൾക്കിടയിലെ വേർതിരിവ് കൃത്യമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘പാളയമിറങ്ങി’, ‘മറുകര’, ‘അതിർത്തി’ എന്നീ സാധാരണ ഗ്രാഹ്യമായ പദങ്ങൾ ഉപയോഗിച്ചു. രണ്ടാം അടിക്കുറിപ്പിന്റെ സൂചകം ഇംഗ്ലീഷ് consultation layer-ലെ സ്ഥാനത്തോട് പൊരുത്തപ്പെടുന്നില്ലെന്നതിനാൽ അതിന്റെ വിശദീകരണം ബാധകമായ ‘മരുഭൂമി’ വിവരണത്തിന് ശേഷമല്ലാതെ വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
