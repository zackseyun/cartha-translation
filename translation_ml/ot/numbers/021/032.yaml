  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח מֹשֶׁה֙ לְ/רַגֵּ֣ל אֶת יַעְזֵ֔ר וַֽ/יִּלְכְּד֖וּ בְּנֹתֶ֑י/הָ ו/יירש אֶת הָ/אֱמֹרִ֥י אֲשֶׁר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: ml
  text: പിന്നെ മോശെ യാസേർ നിരീക്ഷിച്ചറിയാൻ ആളുകളെ അയച്ചു. അവർ അതിന്റെ ആശ്രിതഗ്രാമങ്ങൾ[a] പിടിച്ചടക്കി, അവിടെയുണ്ടായിരുന്ന അമോര്യരെ പുറത്താക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘അതിന്റെ പുത്രിമാർ.’ ഒരു നഗരത്തിന്റെ ആശ്രിതമായ ചെറുപട്ടണങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: അയച്ചു
  rationale: ശלח എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לְרַגֵּל
  choice: ഒറ്റുനോക്കാൻ
  rationale: സ്ഥലത്തെക്കുറിച്ചുള്ള സൈനിക രഹസ്യാന്വേഷണം എന്ന പീയേൽ ക്രിയാരൂപത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יַעְזֵר
  choice: യയേസെർ
  rationale: എബ്രായ സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: וַיִּלְכְּדוּ
  choice: പിടിച്ചടക്കി
  rationale: സൈനികസന്ദർഭത്തിൽ പിടിച്ചെടുക്കുക എന്ന לכד-ന്റെ അർഥം നൽകുന്നു.
- source_word: בְּנֹתֶיהָ
  choice: അതിന്റെ ഗ്രാമങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘അതിന്റെ പുത്രിമാർ’ എന്നാണെങ്കിലും, നഗരത്തെ ആശ്രയിച്ചുള്ള ചെറുപട്ടണങ്ങളെയോ ഗ്രാമങ്ങളെയോ സൂചിപ്പിക്കുന്ന എബ്രായ ഭൂമിശാസ്ത്രപ്രയോഗമാണിത്.
- source_word: וַיִּירַשׁ
  choice: ഒഴിപ്പിച്ചു
  rationale: കീഴടക്കൽസന്ദർഭത്തിൽ മുൻവാസികളെ നീക്കി കൈവശമാക്കുക എന്ന ירש-ന്റെ അർഥഘടകത്തിൽ, ഈ വാക്യത്തിൽ ജനങ്ങളെ കർമമായി സ്വീകരിക്കുന്നതിനാൽ നീക്കിപ്പാർപ്പിക്കൽ മുൻനിർത്തുന്നു.
- source_word: הָאֱמֹרִי
  choice: അമോര്യരെ
  rationale: എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ജനനാമമായി നൽകുന്നു.
- source_word: אֲשֶׁר שָׁם
  choice: അവിടെയുണ്ടായിരുന്ന
  rationale: ആ സ്ഥലത്തുണ്ടായിരുന്ന അമോര്യരെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. സൈനിക ആഖ്യാനത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തിയിരിക്കുന്നു; ‘പുത്രിമാർ’ എന്ന മൂലഭാഷാപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വാഭാവിക അർഥമായി നൽകി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
