revisions:
- from: പിന്നെ മോശ യയേസെരിനെ ഒറ്റുനോക്കാൻ ആളുകളെ അയച്ചു. അവർ അതിന്റെ ഗ്രാമങ്ങൾ[a] പിടിച്ചടക്കി, അവിടെയുണ്ടായിരുന്ന അമോര്യരെ ഒഴിപ്പിച്ചു.
  to: പിന്നെ മോശെ യാസേർ നിരീക്ഷിച്ചറിയാൻ ആളുകളെ അയച്ചു. അവർ അതിന്റെ ആശ്രിതഗ്രാമങ്ങൾ[a] പിടിച്ചടക്കി, അവിടെയുണ്ടായിരുന്ന അമോര്യരെ പുറത്താക്കി.
  rationale: സ്ഥലനാമം יַעְזֵറിനോട് യോജിക്കുന്നവിധം "യാസേർ" എന്നാക്കി. രഹസ്യാന്വേഷണ/നിരീക്ഷണ അർഥം കൂടുതൽ കൃത്യമായി നൽകാൻ "ഒറ്റുനോക്കാൻ" എന്നത് "നിരീക്ഷിച്ചറിയാൻ" എന്നാക്കി. ഭൂമിശാസ്ത്രപരമായ ‘പുത്രിമാർ’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നിലനിർത്തി.
