source:
  edition: WLC
  text: אָ֚ז יָשִׁ֣יר יִשְׂרָאֵ֔ל אֶת הַ/שִּׁירָ֖ה הַ/זֹּ֑את עֲלִ֥י בְאֵ֖ר עֱנוּ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ ഈ പാട്ടുപാടി:

    “കിണറേ, പൊങ്ങിവരിക[a]!

    അതിന് മറുപടി പാടുവിൻ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “കിണറേ, മുകളിലേക്കു വരിക!” ഇത് ഒരാൾ പാടുന്നതിന് മറ്റുള്ളവർ പ്രതിഗാനമായി മറുപടി പാടുന്ന രീതിയെ സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ തുടർന്നുള്ള സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകമാണ്.
- source_word: יָשִׁיר
  choice: പാടി
  rationale: രൂപത്തിൽ അപൂർണകാലമാണെങ്കിലും אָז എന്ന പദത്തോടൊപ്പം ഇവിടെ കഴിഞ്ഞ സംഭവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ഈ പാട്ട്
  rationale: തുടർന്ന് ഉദ്ധരിക്കുന്ന കാവ്യഗാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: עֲלִי
  choice: പൊങ്ങിവരിക
  rationale: കിണറിനോട് സ്ത്രീലിംഗ ഏകവചനത്തിൽ കല്പിക്കുന്ന ‘മുകളിലേക്കു വരിക’ എന്ന ആശയം ജലത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: בְאֵר
  choice: കിണറേ
  rationale: നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സംബോധനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: עֱנוּ לָהּ
  choice: അതിന് മറുപടി പാടുവിൻ
  rationale: ענה എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘മറുപടി നൽകുക’ എന്ന അർത്ഥവും ഗാനസന്ദർഭത്തിലെ പ്രതിഗാനസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കാവ്യശൈലി. ‘മറുപടി പാടുവിൻ’ എന്നത് എബ്രായത്തിലെ പ്രതികരണവും ഗാനപരമായ പശ്ചാത്തലവും അനാവശ്യമായി ഒന്നിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
