  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. എബ്രായ കഥനക്രമം നിലനിർത്തിക്കൊണ്ട്, ആവശ്യമില്ലാത്ത സൈനിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
