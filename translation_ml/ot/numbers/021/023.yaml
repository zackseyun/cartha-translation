source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: ml
  text: എന്നാൽ സീഹോൻ ഇസ്രായേലിനെ തന്റെ പ്രദേശത്തുകൂടി കടന്നുപോകാൻ അനുവദിച്ചില്ല[a]. അതിനാൽ സീഹോൻ തന്റെ ജനത്തെയെല്ലാം[b] ഒരുമിച്ചുകൂട്ടി ഇസ്രായേലിനെ നേരിടാൻ മരുഭൂമിയിലേക്കു പുറപ്പെട്ടു. അവൻ യാഹസിൽ എത്തി ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ അതിർത്തിയിലൂടെ കടന്നുപോകാൻ അനുവദിച്ചില്ല.’
    reason: גְּבוּל എന്ന പദത്തിന് ‘അതിർത്തി’ എന്നും ‘അതിർത്തിക്കുള്ളിലെ പ്രദേശം’ എന്നും അർഥമാകാം.
  - marker: b
    text: എബ്രായപാഠം അക്ഷരാർഥത്തിൽ ‘തന്റെ ജനത്തെയെല്ലാം’ എന്നാണ്; സൈനികസന്ദർഭമാണെങ്കിലും ‘സൈന്യം’ എന്നു വ്യക്തമാക്കുന്നില്ല.
    reason: മൂലപാഠത്തിലെ പദപ്രയോഗവും സന്ദർഭത്തിൽ സൂചിതമായ അർഥവും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: נָתַן
  choice: അനുവദിച്ചില്ല
  rationale: ‘കൊടുത്തില്ല’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, ഈ ഘടനയിൽ അനുമതി നിഷേധിക്കുന്ന ആശയമാണ്; മലയാളത്തിൽ ‘അനുവദിച്ചില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: തന്റെ പ്രദേശത്തുകൂടി കടന്നുപോകാൻ
  rationale: עבר ഇവിടെ ഒരു ദേശത്തിലൂടെയുള്ള സഞ്ചാരത്തെയും גְּבוּל അതിന്റെ അതിർത്തിക്കുള്ളിലെ പ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു; ‘പ്രദേശത്തുകൂടി’ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: തന്റെ ജനത്തെയെല്ലാം ഒരുമിച്ചുകൂട്ടി
  rationale: എബ്രായപാഠം ‘തന്റെ സകല ജനത്തെയും’ എന്നാണ് പറയുന്നത്. സൈനികസന്ദർഭമുണ്ടെങ്കിലും ‘സൈന്യം’ എന്നു പാഠത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ‘ജനം’ നിലനിർത്തി.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: ഇസ്രായേലിനെ നേരിടാൻ
  rationale: ഈ പ്രയോഗത്തിന് ‘കണ്ടുമുട്ടാൻ/എതിരേ ചെല്ലാൻ’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. തുടർന്നുള്ള യുദ്ധസന്ദർഭത്തിൽ ‘നേരിടാൻ’ വൈരുദ്ധ്യഭാവം സൂചിപ്പിക്കുമ്പോഴും യുദ്ധം എന്ന ആശയം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: הַמִּדְבָּרָה
  choice: മരുഭൂമിയിലേക്കു
  rationale: ദിശാസൂചകമായ -ה പ്രത്യയം മരുഭൂമിയിലേക്കുള്ള ഗതി വ്യക്തമാക്കുന്നു.
- source_word: יָהְצָה
  choice: യാഹസിൽ
  rationale: സ്ഥലനാമമായ יַהַץ എന്നതിന്റെ ദിശാസൂചക രൂപമാണിത്; മലയാളത്തിൽ സാധാരണ ഉച്ചാരണസൗകര്യത്തോടെ ‘യാഹസ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടു യുദ്ധം ചെയ്തു
  rationale: לחם എന്ന ക്രിയയും בְּ ഘടനയും ശത്രുതാപരമായ പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യുദ്ധം ചെയ്തു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: וְלֹא
  choice: എന്നാൽ ... ഇല്ല
  rationale: മുൻവാക്യത്തിലെ കടന്നുപോകാനുള്ള അപേക്ഷയോടുള്ള വൈരുദ്ധ്യം ‘എന്നാൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
