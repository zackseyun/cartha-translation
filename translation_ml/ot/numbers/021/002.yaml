id: NUM.21.2
reference: Numbers 21:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: ml
  text: 'അപ്പോൾ ഇസ്രായേൽ യഹോവയോട് ഒരു നേർച്ച നേർന്ന് പറഞ്ഞു: “ഈ ജനത്തെ നീ തീർച്ചയായും എന്റെ കൈയിൽ ഏല്പിച്ചാൽ[a], ഞാൻ അവരുടെ പട്ടണങ്ങളെ നാശത്തിനായി സമർപ്പിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീ ഈ ജനത്തെ നിശ്ചയമായും എന്റെ കൈയിൽ ഏല്പിച്ചാൽ” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായത്തിൽ “ഏല്പിച്ചുകൊണ്ട് ഏല്പിച്ചാൽ” എന്ന ഊന്നൽപ്രയോഗമാണുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ പട്ടണങ്ങളെ നിരോധനത്തിന് വിധേയമാക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. തിരിച്ചെടുക്കാനാകാത്തവിധം എന്തെങ്കിലും നാശത്തിനായി സമർപ്പിക്കുന്ന ḥerem എന്ന പ്രവൃത്തിയെയാണ് എബ്രായപദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: ഒരു നേർച്ച നേർന്ന്
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയും നാമവും ചേർന്ന എബ്രായ പ്രയോഗത്തിന്റെ ഔപചാരികമായ പ്രതിജ്ഞാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: לַיהוָה
  choice: യഹോവയോട്
  rationale: ദൈവത്തിന്റെ ഉടമ്പടിനാമമായ יהוהയെ മലയാളത്തിൽ പരിചിതമായ ‘യഹോവ’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു; നേർച്ചയുടെ അഭിമുഖം സൂചിപ്പിക്കാൻ ‘-യോട്’ ഉപയോഗിക്കുന്നു.
- source_word: אִם נָתֹן תִּתֵּן
  choice: നീ തീർച്ചയായും ... ഏല്പിച്ചാൽ
  rationale: ക്രിയയോടൊപ്പം വന്ന infinitive absolute നൽകുന്ന ഊന്നൽ ‘തീർച്ചയായും’ എന്നു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: הָעָם הַזֶּה
  choice: ഈ ജനത്തെ
  rationale: עָם എന്ന ഏകവചന സമൂഹനാമവും അതോടു ചേർന്ന സൂചകപദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: בְּיָדִי
  choice: എന്റെ കൈയിൽ
  rationale: അധികാരത്തിലോ നിയന്ത്രണത്തിലോ ഏല്പിക്കുക എന്ന എബ്രായ രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതിനാൽ അതേ ദൃശ്യഭാഷ നിലനിർത്തുന്നു.
- source_word: וְהַחֲרַמְתִּי
  choice: നാശത്തിനായി സമർപ്പിക്കും
  rationale: חרם സൂചിപ്പിക്കുന്ന, തിരിച്ചെടുക്കാനാകാത്തവിധം നാശത്തിന് അർപ്പിക്കുന്ന യുദ്ധ-ആരാധനാപരമായ പ്രവൃത്തിയെ വെറും ‘നശിപ്പിക്കും’ എന്നതിലുപരി സംരക്ഷിക്കുന്നു.
- source_word: עָרֵיהֶם
  choice: അവരുടെ പട്ടണങ്ങളെ
  rationale: עִיר എന്ന പദത്തിന് ഈ സൈനികസന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം ‘പട്ടണം’ ആണ്.
theological_decisions:
- issue: യുദ്ധനേർച്ചയിലെ חרם എന്ന ആശയത്തിന്റെ പരിഭാഷ
  choice: അവരുടെ പട്ടണങ്ങളെ നാശത്തിനായി സമർപ്പിക്കും
  alternative: അവരുടെ പട്ടണങ്ങളെ നിശ്ശേഷം നശിപ്പിക്കും; അവരുടെ പട്ടണങ്ങളെ നിരോധിതാർപ്പണമായി മാറ്റും
  rationale: ഇത് സാധാരണ സൈനികനാശം മാത്രമല്ല, കീഴടക്കിയവയെ തിരിച്ചെടുക്കാനാകാത്തവിധം നാശത്തിന് അർപ്പിക്കുന്ന ഔപചാരിക ḥerem പ്രവൃത്തിയാണെന്ന മതപരവും സൈനികവുമായ സംഘർഷം പരിഭാഷ നിലനിർത്തുന്നു; അതിന്മേൽ പിൽക്കാല നൈതികമോ സിദ്ധാന്തപരമോ ആയ വിശദീകരണം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നേർച്ച നേർന്ന്’ എന്ന ചെറിയ ആവർത്തനം മൂലഭാഷയിലെ cognate construction-ന്റെ ഔപചാരിക ഭാവം സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു. വാക്യത്തിലെ ഒന്നാംപുരുഷ ഏകവചനം സമൂഹമായി സംസാരിക്കുന്ന ‘ഇസ്രായേൽ’ എന്ന കർത്താവിനനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
