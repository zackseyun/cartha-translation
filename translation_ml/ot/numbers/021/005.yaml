base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: ml
  text: 'ജനം ദൈവത്തിനും മോശെയ്ക്കും എതിരായി സംസാരിച്ചു: “മരുഭൂമിയിൽ മരിക്കാനാണോ നീ ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നത്? അപ്പമില്ല, വെള്ളവുമില്ല; ഈ നിസ്സാരമായ[a] അപ്പത്തെ ഞങ്ങൾ വെറുക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നികൃഷ്ടമായ അപ്പം” എന്നോ “വിലകെട്ട അപ്പം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ വിശേഷണം അപൂർവമാണ്; ദൈവം നൽകിയ ഭക്ഷണത്തോടുള്ള ജനത്തിന്റെ അവജ്ഞയാണ് അത് പ്രകടിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: ജനം ദൈവത്തിനും മോശയ്ക്കും എതിരായി സംസാരിച്ചു
  rationale: דבר ב എന്ന ഘടന സന്ദർഭപരമായി കുറ്റപ്പെടുത്തലും എതിർപ്പും സൂചിപ്പിക്കുന്നു. ഉദ്ധരിച്ച വാക്കുകളുടെ ശത്രുതാഭാവം നിലനിർത്താൻ ‘എതിരായി സംസാരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: നിങ്ങൾ ഞങ്ങളെ ഈജിപ്തിൽനിന്ന് കൊണ്ടുവന്നത്
  rationale: עלה എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപം ‘കൊണ്ടുവരുക/കയറ്റിക്കൊണ്ടുവരുക’ എന്നാണ്. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘കൊണ്ടുവന്നത്’ ഉപയോഗിച്ചു; പുറപ്പാടിന്റെ ദിശ ‘ഈജിപ്തിൽനിന്ന്’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: മരുഭൂമിയിൽ കിടന്നു മരിക്കാനാണോ
  rationale: ലക്ഷ്യത്തെയോ ആരോപിക്കപ്പെടുന്ന ഫലത്തെയോ സൂചിപ്പിക്കുന്ന infinitive നിലനിർത്തുന്നു. ‘കിടന്നു’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികമായ ഊന്നൽപ്രയോഗമാണ്; മൂലത്തിൽ പ്രത്യേക മരണരീതി സൂചിപ്പിക്കുന്നില്ല.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: ഇവിടെ അപ്പവുമില്ല, വെള്ളവുമില്ല
  rationale: לֶחֶם എന്നതിന്റെ ‘അപ്പം’ എന്ന നേരിട്ടുള്ള അർഥവും അതേ പദത്തിന്റെ അടുത്ത വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തി. ‘ഇവിടെ’ സന്ദർഭത്തിൽ അന്തർലീനമായ സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: ഞങ്ങൾക്കു വെറുപ്പായിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളുടെ ജീവൻ/മനം മടുത്തിരിക്കുന്നു, അറച്ചിരിക്കുന്നു’ എന്ന ആശയം. ശക്തമായ വിരക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: ഈ നിസ്സാരമായ അപ്പം
  rationale: അപൂർവമായ קְלֹקֵל എന്ന വിശേഷണം ഭക്ഷണത്തെ അവജ്ഞയോടെ വിലകുറച്ചുകാണിക്കുന്നതാണ്. ‘നിസ്സാരമായ’ ആ അവഹേളനഭാവം നൽകുന്നു; ‘ഈ’ എന്നത് നിലവിലെ ഭക്ഷണത്തെ ചൂണ്ടിക്കാണിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പൂരകമാണ്.
theological_decisions:
- issue: ദൈവത്തോടും മോശയോടുമുള്ള ജനത്തിന്റെ സംസാരത്തിന്റെ സ്വഭാവം
  choice: ‘എതിരായി സംസാരിച്ചു’ എന്ന ശത്രുതാഭാവമുള്ള വായന
  alternative: ‘ദൈവത്തോടും മോശയോടും സംസാരിച്ചു’ അല്ലെങ്കിൽ ‘ദൈവത്തെയും മോശയെയും കുറിച്ചു സംസാരിച്ചു’
  rationale: തുടർന്നുള്ള ചോദ്യം കുറ്റപ്പെടുത്തലും വിരോധവും പ്രകടിപ്പിക്കുന്നതിനാൽ നിഷ്പക്ഷമായ പരിഭാഷ സന്ദർഭത്തിന്റെ ശക്തി കുറയ്ക്കും. ഇതിൽ ദൈവനിന്ദ പോലുള്ള കൂടുതൽ ശക്തമായ ആശയം ചേർത്തിട്ടില്ല.
- issue: קְלֹקֵל എന്ന അപൂർവ വിശേഷണത്തിന്റെ കൃത്യമായ ഭാവം
  choice: ‘നിസ്സാരമായ’
  alternative: ‘നികൃഷ്ടമായ’, ‘വിലകെട്ട’, ‘ദയനീയമായ’
  rationale: ഈ പദം എന്തെങ്കിലും വസ്തുനിഷ്ഠമായി പോഷകമില്ലാത്തതാണെന്ന വിധിയേക്കാൾ ജനത്തിന്റെ അവജ്ഞയും വിരക്തിയും പ്രകടിപ്പിക്കുന്നു. അതിനാൽ ആ വിലകുറച്ചുകാണിക്കൽ നിലനിർത്തുകയും വ്യാഖ്യാനം അതിരുകടക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘അപ്പം’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ לֶחֶם എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു. ഉദ്ധരണിയുടെ കുറ്റപ്പെടുത്തൽഭാവം സംരക്ഷിച്ചെങ്കിലും മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
