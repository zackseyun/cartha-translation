  terminology: The transliterated place names are consistent. “ശൂന്യമാക്കി” is acceptable in a poetic devastation context, especially with the uncertainty preserved by footnote b. The revision uses “അവർക്കുനേരെ എയ്തു” to retain the martial image without adding the result ‘shot down.’
