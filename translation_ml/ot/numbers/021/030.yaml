  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യ-യുദ്ധഗീത ശൈലി സ്വീകരിച്ചു. ദുഷ്കരമായ രണ്ടു എബ്രായരൂപങ്ങളുടെ അനിശ്ചിതത്വം മുഖ്യവാക്യത്തിൽ അനാവശ്യമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു; സ്ഥലനാമങ്ങൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
