base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: ml
  text: നാം അവർക്കുനേരെ എയ്തു[a]; ദീബോൻ വരെ ഹെശ്ബോൻ നശിച്ചുപോയി. മേദെബാ വരെ എത്തുന്ന നോഫഹ് വരെ നാം ശൂന്യമാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യ വാക്യഭാഗത്തിലെ എബ്രായപാഠം ദുഷ്കരമാണ്. ‘നാം അവരെ കീഴടക്കി’ എന്നോ ‘അവരുടെ ആധിപത്യം നശിച്ചു’ എന്നോ ഉൾപ്പെടെ പലവിധത്തിൽ ഇതിനെ മനസ്സിലാക്കിയിട്ടുണ്ട്.
    reason: textual_variant
  - marker: b
    text: ‘നാം ശൂന്യമാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തിയ രൂപവും അനിശ്ചിതമാണ്. ചിലർ അതിനെ വേറൊരു വിധത്തിൽ വായിക്കുന്നുവെങ്കിലും, ഈ വിജയഗീതത്തിന്റെ സന്ദർഭം നാശം വരുത്തുന്ന ഒരു ക്രിയയെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: നാം അവരെ എയ്തുവീഴ്ത്തി
  rationale: രൂപവും അർഥവും ദുഷ്കരമാണെങ്കിലും, ירה എന്ന ‘എയ്യുക’ എന്ന ആശയത്തോടും നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ ബഹുവചന കർത്താവ് + മൂന്നാംപുരുഷ ബഹുവചന പ്രത്യയം എന്ന രൂപവിശകലനത്തോടും ഈ പരിഭാഷ പൊരുത്തപ്പെടുന്നു. വിജയഗീതത്തിലെ സജീവമായ യുദ്ധചിത്രവും നിലനിർത്തുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: אָבַד
  choice: നശിച്ചുപോയി
  rationale: ‘നശിക്കുക, ഇല്ലാതാകുക’ എന്ന പൂർണമായ സംഭവത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി രേഖപ്പെടുത്തി.
- source_word: עַד דִּיבוֹן
  choice: ദീബോൻവരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ പരിധി ‘വരെ’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: וַנַּשִּׁים
  choice: നാം ശൂന്യമാക്കി
  rationale: രൂപം ദുഷ്കരമാണെങ്കിലും, കീഴടക്കലിന്റെ സ്ഥലക്രമത്തിൽ നാശം വരുത്തുന്ന ഒരു ഒന്നാംപുരുഷ ബഹുവചന ക്രിയയാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്. മറ്റു വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: עַד נֹפַח
  choice: നോഫഹ്വരെ
  rationale: עַד സൂചിപ്പിക്കുന്ന പരിധി ‘വരെ’ എന്നും സ്ഥലനാമം ‘നോഫഹ്’ എന്നും നൽകി.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: മേദെബാവരെ എത്തുന്നിടത്തോളം
  rationale: ബന്ധവാക്യത്തിന്റെ കൃത്യമായ ഭൂമിശാസ്ത്രബന്ധം അവ്യക്തമായതിനാൽ അത് നിർബന്ധമായി നോഫഹിനോടു മാത്രം ബന്ധിപ്പിക്കാതെ, വ്യാപ്തി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളമായി പരിഭാഷപ്പെടുത്തി.
- source_word: מֵידְבָא
  choice: മേദെബാ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി രേഖപ്പെടുത്തി.
