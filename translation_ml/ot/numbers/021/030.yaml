    rationale: '“മേദെബാവരെ എത്തുന്നിടത്തോളം” lacks a clear referent. The Hebrew’s relative clause, however difficult, is best represented by connecting it to Nophah: ‘Nophah, which reaches/is as far as Medeba.’'
