id: NUM.21.35
reference: Numbers 21:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവനെയും അവന്റെ പുത്രന്മാരെയും അവന്റെ മുഴുവൻ ജനത്തെയും തോൽപ്പിച്ചു; അവന് ഒരു അതിജീവിതനും ശേഷിക്കാത്തവിധം[a]. പിന്നെ അവർ അവന്റെ ദേശം കൈവശമാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് അതിജീവിച്ച ആരും ശേഷിച്ചില്ല.”
    reason: ഹീബ്രു പ്രയോഗം ആക്രമികൾ ആരെയും ശേഷിപ്പിച്ചില്ല എന്ന പ്രവൃത്തിയെയോ, അവന് ആരും ശേഷിച്ചില്ല എന്ന ഫലത്തെയോ മുൻനിർത്തി പരിഭാഷപ്പെടുത്താം.
  - marker: b
    text: അഥവാ, “അവർ അവന്റെ ദേശം അവകാശമാക്കി.”
    reason: ירשׁ എന്ന ക്രിയയ്ക്ക് ‘കൈവശമാക്കുക’ എന്നും ‘അവകാശമാക്കുക’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: സംഹരിച്ചു
  rationale: נכה എന്ന ക്രിയ സൈനികസന്ദർഭത്തിൽ അടിച്ചുവീഴ്ത്തുക, തോൽപ്പിക്കുക, കൊല്ലുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ആരും ശേഷിച്ചില്ലെന്ന തുടർവാക്യം ഇവിടെ മാരകമായ സമ്പൂർണ പരാജയം വ്യക്തമാക്കുന്നതിനാൽ ‘സംഹരിച്ചു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בָּנָיו
  choice: അവന്റെ പുത്രന്മാർ
  rationale: בנים ഇവിടെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനമായതിനാൽ പൊതുവായ ‘മക്കൾ’ എന്നതിനു പകരം ലിംഗസൂചന നിലനിർത്തുന്ന ‘പുത്രന്മാർ’ ഉപയോഗിച്ചു.
- source_word: כָּל־עַמּוֹ
  choice: അവന്റെ സകല ജനം
  rationale: עם എന്നത് അടിസ്ഥാനമായി ‘ജനം’ എന്നാണ്; സൈന്യത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ ഭരണാധീനരായ മുഴുവൻ ജനത്തെയും ഉൾക്കൊള്ളുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: അവനുവേണ്ടി അതിജീവിച്ച ഒരാളെപ്പോലും ശേഷിപ്പിച്ചില്ല
  rationale: ഹീബ്രു പ്രയോഗം സമ്പൂർണ നാശത്തെ സൂചിപ്പിക്കുന്നു. ‘അതിജീവിച്ച ഒരാൾ’ യുദ്ധസന്ദർഭത്തിലെ שָׂרִיד എന്നതിന്റെ വ്യക്തമായ അർഥം നൽകുന്നു; ‘ഒരാളെപ്പോലും’ സമ്പൂർണതയുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: וַיִּירְשׁוּ
  choice: കൈവശമാക്കി
  rationale: ירשׁ അവകാശമാക്കുക, കൈവശപ്പെടുത്തുക, പുറത്താക്കി അധിവസിക്കുക തുടങ്ങിയ അർഥങ്ങൾ വഹിക്കുന്നു. യുദ്ധവിജയത്തിനു പിന്നാലെ ദേശം സ്വന്തനിയന്ത്രണത്തിലാക്കിയതിനെ ‘കൈവശമാക്കി’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: אַרְצוֹ
  choice: അവന്റെ ദേശം
  rationale: אֶרֶץ ഇവിടെ ഓഗ് ഭരിച്ചിരുന്ന പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേശം’ അതിന്റെ ഭൂമിശാസ്ത്ര-രാഷ്ട്രീയ വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: സമ്പൂർണ നാശത്തെ വിവരിക്കുന്ന വാക്യത്തിന്റെ കർത്താവ്
  choice: ‘ശേഷിപ്പിച്ചില്ല’ എന്ന ബഹുവചന ക്രിയയിലൂടെ ഇസ്രായേല്യരെയാണ് കർത്താവായി ഗ്രഹിച്ചത്
  alternative: ‘അവന് അതിജീവിച്ച ആരും ശേഷിച്ചില്ല’ എന്ന കർത്തൃരഹിത ഫലവിവരണം
  rationale: മസോററ്റിക് വ്യഞ്ജനരൂപം הִשְׁאִיר ഏകവചനമായി വായിക്കാമെങ്കിലും സന്ദർഭത്തിലെ ബഹുവചന കർത്താവിനോടൊപ്പം ഈ പ്രയോഗം അർഥപരമായി ആക്രമികളെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ കർത്തൃരഹിതമായ വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും പൊതുവായ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സകല ജനം’, ‘ദേശം’ എന്നിവ ബൈബിൾഭാഷയുടെ മാന്യത നിലനിർത്തുമ്പോഴും അത്യന്തം പുരാതനമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കുന്നു.
