reference: Numbers 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: ml
  text: 'അപ്പോൾ ജനം മോശെയുടെ അടുക്കൽ വന്ന് പറഞ്ഞു: “ഞങ്ങൾ യഹോവയ്ക്കും നിനക്കും എതിരായി സംസാരിച്ചതിനാൽ പാപം ചെയ്തിരിക്കുന്നു. ഞങ്ങളിൽനിന്ന് പാമ്പിനെ നീക്കിക്കളയാൻ യഹോവയോടു പ്രാർഥിക്കണമേ.” അങ്ങനെ മോശെ ജനത്തിനുവേണ്ടി പ്രാർഥിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: അപ്പോൾ ജനം ... വന്നു
  rationale: വാവ്-തുടർച്ച കഥയിലെ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള കഥാക്രമം നൽകുന്നു. ‘ജനം’ എബ്രായത്തിലെ സമൂഹവാചക ഏകവചനത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: חָטָאנוּ
  choice: ഞങ്ങൾ ... പാപം ചെയ്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ കുറ്റസമ്മതവും ഒരുമിച്ചു സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം അനുയോജ്യം.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: ഞങ്ങൾ യഹോവയ്ക്കും നിനക്കും എതിരായി സംസാരിച്ചു
  rationale: דבר + ב ഇവിടെ വിരോധപരമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; രണ്ട് കർമങ്ങളോടുമുള്ള ‘എതിരായി’ എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: മൂലപാഠത്തിലെ ദൈവനാമം പൊതുവായി പരിചിതമായ മലയാള ലിപ്യന്തരണത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: യഹോവയോടു പ്രാർഥിക്കണമേ
  rationale: പ്രാർഥനയും മധ്യസ്ഥാഭ്യർഥനയും സന്ദർഭത്തിൽ വ്യക്തമാണ്; ഇത് സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളമാണ്.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: ഞങ്ങളിൽനിന്ന് ... നീക്കിക്കളയേണ്ടതിന്
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള ക്രിയ പ്രാർഥനയുടെ ഉദ്ദേശ്യവും അഭ്യർഥിത ഫലവും പ്രകടിപ്പിക്കുന്നു.
- source_word: אֶת הַנָּחָשׁ
  choice: ഈ പാമ്പുകളെ
  rationale: നാമം എബ്രായത്തിൽ ഏകവചനമാണെങ്കിലും, മുമ്പത്തെ പാമ്പുകളുടെ ബാധയെ സമൂഹമായി സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനം വ്യക്തത നൽകുന്നു, മൂലരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: അങ്ങനെ മോശെ ജനത്തിനുവേണ്ടി പ്രാർഥിച്ചു
  rationale: בְּעַד മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള മധ്യസ്ഥത സൂചിപ്പിക്കുന്നു; ‘ജനത്തിനുവേണ്ടി പ്രാർഥിച്ചു’ സാധാരണ വായനക്കാർക്ക് നേരെയും വ്യക്തവുമാണ്.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്; യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമത്തെ ഒരു പൊതുപദവിയായി മാറ്റാതെ, മലയാളത്തിൽ വ്യാപകമായി പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: മോശെയുടെ പ്രാർഥനയിലെ മധ്യസ്ഥത
  choice: ജനത്തിനുവേണ്ടി പ്രാർഥിച്ചു
  alternative: ജനത്തിനായി മധ്യസ്ഥത വഹിച്ചു
  rationale: בְּעַד എന്നതിലെ പ്രതിനിധിപരമായ അർഥം സംരക്ഷിക്കുമ്പോഴും പാഠത്തിൽ ഇല്ലാത്ത വികസിത ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. കുറ്റസമ്മതത്തിന്റെ ഗൗരവം നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ മതസാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
