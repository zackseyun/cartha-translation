id: NUM.21.21
reference: Numbers 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: ml
  text: 'പിന്നെ ഇസ്രായേൽ അമോര്യരുടെ രാജാവായ സീഹോന്റെ അടുക്കൽ ദൂതന്മാരെ അയച്ച് ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: പിന്നെ … അയച്ച്
  rationale: വാവ്-തുടർച്ച കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിന്നെ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളുമായി ചേർക്കുന്നതിനാൽ ‘അയച്ച് … പറഞ്ഞു’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: יִשְׂרָאֵל
  choice: ഇസ്രായേൽ
  rationale: ഇവിടെ ജനതയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രചാരമുള്ള നാമരൂപം.
- source_word: מַלְאָכִים
  choice: ദൂതന്മാർ
  rationale: രാജതന്ത്രപരമായ ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതന്മാർ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: אֶל
  choice: അടുക്കൽ
  rationale: അയക്കലിന്റെ ലക്ഷ്യസ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: סִיחֹן
  choice: സീഹോൻ
  rationale: എബ്രായ വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: അമോര്യരുടെ രാജാവായ
  rationale: എബ്രായ സംയുക്തപദബന്ധം സീഹോൻ അമോര്യജനത്തിന്റെ രാജാവാണെന്ന അർത്ഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: לֵאמֹר
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾക്ക് ആമുഖമാകുന്ന എബ്രായ പ്രയോഗം മലയാള കഥനത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
