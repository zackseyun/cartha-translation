  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള സംഭാഷണത്തിലേക്ക് നയിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ചേർത്തു.
