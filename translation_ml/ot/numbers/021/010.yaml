  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: ml
  text: പിന്നെ ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെട്ട് ഓബോത്തിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായപദപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ അത് ഇസ്രായേൽജനത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: മരുഭൂമിയിലെ യാത്രാവിവരണത്തിൽ נסע പാളയം വിട്ട് അടുത്ത ഘട്ടത്തിലേക്കു നീങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘യാത്ര പുറപ്പെട്ടു’ എന്നത് ഈ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ മക്കൾ/പുത്രന്മാർ’ എന്നാണ്; ഇവിടെ മുഴുവൻ ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്ഥിരമായ വംശനാമപ്രയോഗമാണിത്. ‘ഇസ്രായേൽമക്കൾ’ ഉറവിടപ്രയോഗത്തിന്റെ രൂപവും സമൂഹാർഥവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה മരുഭൂമിയാത്രയിൽ ഒരു സ്ഥലത്ത് തങ്ങി പാളയം സ്ഥാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്. ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: בְּאֹבֹת
  choice: ഓബോത്തിൽ
  rationale: אֹבֹת ഒരു സ്ഥലനാമമായതിനാൽ വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു. സ്ഥലത്ത് പാളയമിറങ്ങിയെന്ന അർഥത്തിന് ‘-ത്തിൽ’ യോജിക്കുന്നു.
- source_word: וַ
  choice: പിന്നെ
  rationale: ആദ്യ ക്രിയയോടു ചേർന്ന വാവ് കഥയിലെ തുടർച്ചയായ അടുത്ത സംഭവത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്നു; ‘പിന്നെ’ ആ ക്രമബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
