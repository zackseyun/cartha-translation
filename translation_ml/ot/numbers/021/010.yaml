translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യാത്രാവിവരണത്തിന്റെ സംക്ഷിപ്ത ശൈലി നിലനിർത്തിയിരിക്കുന്നു; സ്ഥലനാമം ‘ഓബോത്ത്’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
