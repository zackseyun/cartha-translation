  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: ml
  text: ആറിന്റെ സ്ഥാനത്തേക്കു[b] നീളുകയും മോവാബിന്റെ അതിർത്തിയോടു ചാരിനിൽക്കുകയും ചെയ്യുന്ന അരുവിത്താഴ്വരകളുടെ[a] ചരിവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “താഴ്‌വരകളുടെ” എന്നും “മലയിടുക്കുകളുടെ” എന്നും. എബ്രായപദം പലപ്പോഴും കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന അരുവിപ്പാതകളെയോ അവയോടനുബന്ധിച്ച താഴ്‌വരകളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ആറിന്റെ വാസസ്ഥലത്തേക്കു” അല്ലെങ്കിൽ “ആറിന്റെ ഇരിപ്പിടത്തേക്കു” എന്നും പരിഭാഷപ്പെടുത്താം. എബ്രായപ്രയോഗം ദുഷ്കരമാണ്; ഇത് ആർ സ്ഥിതിചെയ്യുന്ന ഇടത്തെയോ അതിന്റെ പാർപ്പിടത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: ചരിവ്
  rationale: താഴോട്ടു ചെരിയുന്ന ഭൂപ്രദേശത്തെയോ പള്ളത്തിന്റെ ചരിവിനെയോ സൂചിപ്പിക്കുന്ന നാമം; സ്ഥലവിവരണത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: הַנְּחָלִים
  choice: തോടുപള്ളങ്ങൾ
  rationale: നഹൽ എന്ന പദം പലപ്പോഴും കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന അരുവിപ്പാതയോടുകൂടിയ പള്ളത്തെ സൂചിപ്പിക്കുന്നു. മലയാള വായനക്കാർക്ക് ഭൂപ്രകൃതി മനസ്സിലാകാൻ 'തോടുപള്ളങ്ങൾ' എന്നു നൽകി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: אֲשֶׁר נָטָה
  choice: നീളുന്ന
  rationale: נטה എന്നതിന്റെ നീളുക, പരക്കുക, ചരിയുക എന്നീ സ്ഥലപരമായ അർഥങ്ങളിൽ സന്ദർഭത്തിന് യോജിച്ച 'നീളുന്ന' തെരഞ്ഞെടുത്തു.
- source_word: לְשֶׁבֶת עָר
  choice: ആരിന്റെ സ്ഥാനംവരെ
  rationale: ദുഷ്കരമായ ഈ എബ്രായ പ്രയോഗം ആരിന്റെ സ്ഥിതി ചെയ്യുന്ന ഇടത്തെ സൂചിപ്പിക്കാമെന്ന നിലയിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; വാസസ്ഥലം/ഇരിപ്പിടം എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: עָר
  choice: ആർ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: וְנִשְׁעַן
  choice: ചാരിനിൽക്കുകയും
  rationale: ശാരീരികമായി ചാരുക, ആശ്രയിക്കുക എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് അതിർത്തിയോടു ചേർന്നുനിൽക്കുന്ന ഭൂപ്രകൃതിയെ വ്യക്തമാക്കുന്നു.
- source_word: לִגְבוּל מוֹאָב
  choice: മോവാബിന്റെ അതിർത്തിയോട്
  rationale: גבול എന്നതിന്റെ സാധാരണ അർഥമായ അതിർത്തി/പരിധി ഇവിടെ രാഷ്ട്രീയ-ഭൂമിശാസ്ത്രപരമായ അതിരിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
