  - severity: medium
    issue: 'Footnote b''s current Malayalam explanation contains an unclear expression: "ആർ എന്ന പാർപ്പിടം."'
    rationale: Ar is the place-name; the alternative concerns 'dwelling/seat of Ar,' not a separate entity called 'the dwelling named Ar.' The note should state the alternatives plainly.
