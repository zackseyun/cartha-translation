  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: ml
  text: 'പ്രഭുക്കന്മാർ കുഴിച്ച കിണർ,

    ജനത്തിലെ കുലീനർ ഭരണദണ്ഡുകൊണ്ടും[a]

    തങ്ങളുടെ വടികൾകൊണ്ടും കുഴിച്ചുണ്ടാക്കിയത്.

    പിന്നെ അവർ മരുഭൂമിയിൽനിന്ന് മത്താനയിലേക്കു പോയി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഭരണദണ്ഡുകൊണ്ട്” എന്നതിന് പകരം, מְחֹקֵק ഒരു ഉപകരണത്തെയല്ല വ്യക്തിയെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ “നിയമദാതാവിനാൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ “മരുഭൂമിയിൽനിന്ന് മത്താന” എന്നു മാത്രമേയുള്ളൂ; സന്ദർഭം യാത്രയുടെ അടുത്ത ഘട്ടമായി, “മരുഭൂമിയിൽനിന്ന് മത്താനയിലേക്ക്” എന്ന അർഥം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: കിണർ
  rationale: മുൻവാക്യത്തിൽ പാടിപ്പുകഴ്ത്തുന്ന നിർദിഷ്ട കിണറിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആവർത്തിച്ചുള്ള ‘കിണർ’ കവിതയുടെ ഘടന വ്യക്തമാക്കുന്നു.
- source_word: חֲפָרוּהָ
  choice: കുഴിച്ച
  rationale: חפר എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സ്ത്രീലിംഗ ഏകവചന പ്രത്യയം ‘കിണർ’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്.
- source_word: שָׂרִים
  choice: പ്രഭുക്കന്മാർ
  rationale: ഉന്നതസ്ഥാനമുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സാമൂഹിക-രാഷ്ട്രീയ ഭാവവും കവിതയുടെ ഔന്നത്യവും നിലനിർത്തുന്നു.
- source_word: כָּרוּהָ
  choice: കുഴിച്ചുണ്ടാക്കിയ
  rationale: כרה എന്ന രണ്ടാമത്തെ കുഴിക്കൽക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കിണർ രൂപപ്പെടുത്തിയെന്ന ഭാവവും നൽകുന്നു.
- source_word: נְדִיבֵי הָעָם
  choice: ജനത്തിലെ കുലീനർ
  rationale: שָׂרִים എന്നതിനോടുള്ള സമാന്തരത പരിഗണിച്ച് സന്നദ്ധർ എന്നതിനെക്കാൾ ഉന്നത സാമൂഹികസ്ഥാനമുള്ളവർ എന്ന അർഥം ഇവിടെ യോജിക്കുന്നു.
- source_word: בִּמְחֹקֵק
  choice: ഭരണദണ്ഡുകൊണ്ട്
  rationale: ‘തങ്ങളുടെ വടികൾകൊണ്ട്’ എന്ന സമാന്തരപ്രയോഗം ഉപകരണാർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; ഭരണാധികാരത്തിന്റെ ദണ്ഡം എന്ന അർഥവും നിലനിൽക്കുന്നു.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: തങ്ങളുടെ വടികൾകൊണ്ട്
  rationale: מִשְׁעֵנָה താങ്ങിനുള്ള വടി/ദണ്ഡ് എന്നർഥം; ബഹുവചനവും ഉടമസ്ഥപ്രത്യയവും വ്യക്തമായി പകരുന്നു.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: പിന്നെ അവർ മരുഭൂമിയിൽനിന്ന് മത്താനയിലേക്കു പോയി
  rationale: എബ്രായത്തിൽ ലക്ഷ്യസ്ഥാനത്തിനു മുമ്പ് ‘ലേക്ക്’ എന്ന പദം പ്രകടമല്ലെങ്കിലും തുടർന്നുവരുന്ന യാത്രാവിവരണം ദിശാസൂചകമായ അർഥം നൽകുന്നു; മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ യാത്രാവാക്യമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: בִּמְחֹקֵק എന്ന ബഹുവ്യഞ്ജക പദത്തിന്റെ അർഥം
  choice: 'ഉപകരണാർഥം: ‘ഭരണദണ്ഡുകൊണ്ട്’'
  alternative: 'വ്യക്തിയെ സൂചിപ്പിച്ച്: ‘നിയമദാതാവിനാൽ’; അമൂർത്തമായി: ‘കൽപ്പനപ്രകാരം’'
  rationale: തൊട്ടുപിന്നാലെയുള്ള ‘തങ്ങളുടെ വടികൾകൊണ്ട്’ എന്ന സമാന്തരഘടന ഉപകരണാർഥത്തെ കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നു. എങ്കിലും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: וּמִמִּדְבָּר מַתָּנָה എന്ന ഖണ്ഡവാക്യത്തിന്റെ ബന്ധം
  choice: 'യാത്രയിലെ അടുത്ത ഘട്ടം: ‘മരുഭൂമിയിൽനിന്ന് മത്താനയിലേക്കു പോയി’'
  alternative: 'പദാനുപദമായ ഖണ്ഡരൂപം: ‘മരുഭൂമിയിൽനിന്ന്, മത്താന’'
  rationale: സംഖ്യ 21:18–20-ലെ സ്ഥലക്രമം യാത്രയുടെ ഘട്ടങ്ങളാണ് രേഖപ്പെടുത്തുന്നത്; അതിനാൽ മലയാളത്തിൽ ആവശ്യമായ ക്രിയയും ലക്ഷ്യസൂചകവും ചേർക്കുന്നത് അർഥം വ്യക്തമാക്കുന്നു, എന്നാൽ എബ്രായത്തിന്റെ സംക്ഷിപ്തരൂപം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔന്നത്യമുള്ള മലയാളം. ആദ്യഭാഗത്തിന്റെ ഗാനാത്മക സമാന്തരത വരിവിഭജനത്തിലൂടെ സൂക്ഷിച്ചു; അവസാനഭാഗം യാത്രാവിവരണത്തിലേക്കുള്ള മാറ്റമായി സ്വാഭാവിക ഗദ്യത്തിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
