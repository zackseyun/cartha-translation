id: NUM.21.6
reference: Numbers 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: ml
  text: അപ്പോൾ യഹ്‌വെ ജനത്തിന്റെ ഇടയിൽ എരിയുന്ന പാമ്പുകളെ[a] അയച്ചു. അവ ജനത്തെ കടിച്ചു; ഇസ്രായേല്യരിൽ അനേകർ മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിഷപ്പാമ്പുകളെ’ അല്ലെങ്കിൽ ‘തീപ്പാമ്പുകളെ.’ ഹീബ്രുവിൽ അക്ഷരാർഥത്തിൽ ‘പാമ്പുകളെ, എരിയുന്നവയെ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: അയച്ചു
  rationale: ശׁלח എന്ന ക്രിയയുടെ തുടർച്ചാനിവേദനരൂപത്തിന് സന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ തർജമ.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: בָּעָם
  choice: ജനത്തിന്റെ ഇടയിലേക്ക്
  rationale: ב എന്ന ഉപസർഗത്തിന്റെ സ്ഥാനസൂചന നിലനിർത്തുന്നു; പാമ്പുകൾ ജനത്തിന്റെ ഇടയിലേക്ക് അയയ്ക്കപ്പെട്ടുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: തീപോലെ എരിയിക്കുന്ന പാമ്പുകൾ
  rationale: നാമത്തിന് പിന്നാലെയുള്ള വിശേഷണമായ שׂרפים-ന്റെ ‘എരിയുന്ന/എരിയിക്കുന്ന’ ദൃശ്യഭാവം നിലനിർത്തുന്നു; വിഷപ്പാമ്പുകൾ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: וַיְנַשְּׁכוּ
  choice: കടിച്ചു
  rationale: נשׁך എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കടിക്കുക’ നേരിട്ട് നൽകുന്നു.
- source_word: וַיָּמָת
  choice: മരിച്ചു
  rationale: מות എന്ന സാധാരണ ക്രിയയുടെ വ്യക്തവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ തർജമ.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: ഇസ്രായേലിൽ അനേകർ
  rationale: ‘ഇസ്രായേലിൽനിന്നുള്ള അനേകം ആളുകൾ’ എന്ന ഹീബ്രു ആശയം ആവർത്തനമില്ലാത്ത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; മലയാളത്തിലെ പരിചിതമായ ഉച്ചാരണസൗകര്യവും കണക്കിലെടുക്കുന്നു.
- issue: הַשְּׂרָפִים എന്ന വിശേഷണത്തിന്റെ സന്ദർഭാർഥം
  choice: തീപോലെ എരിയിക്കുന്ന
  alternative: വിഷമുള്ള; എരിയുന്ന
  rationale: കടിയാൽ ഉണ്ടാകുന്ന എരിച്ചിലിനെയോ പാമ്പുകളുടെ ‘അഗ്നിമയ’ സ്വഭാവത്തെയോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ആദ്യത്തെ ‘ജനത്തിന്റെ ഇടയിലേക്ക്’ എന്നതിന് ശേഷം ആവർത്തനം ഒഴിവാക്കാതെ ‘ജനത്തെ’ നിലനിർത്തിയത് മൂലപാഠത്തിന്റെ ആവർത്തനവും സംഭവത്തിന്റെ ഊന്നലും സംരക്ഷിക്കാനാണ്.
