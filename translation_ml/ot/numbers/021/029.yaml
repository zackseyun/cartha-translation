reference: Numbers 21:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: ml
  text: മോവാബേ, നിനക്കു കഷ്ടം! കെമോശിന്റെ ജനമേ, നീ നശിച്ചുപോയി! അവൻ തന്റെ പുത്രന്മാരെ പലായിതരായും തന്റെ പുത്രിമാരെ അമോര്യരുടെ രാജാവായ സീഹോന്റെ തടവുകാരായും ആക്കിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അതിന്റെ പുത്രന്മാരെ പലായിതരായും അതിന്റെ പുത്രിമാരെ തടവുകാരായും ആക്കിയിരിക്കുന്നു”; പ്രത്യയങ്ങൾ കെമോശിനെയല്ല, മോവാബിനെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: നിനക്ക് അയ്യോ കഷ്ടം
  rationale: ദുരന്തത്തെക്കുറിച്ചുള്ള വിലാപവും പരിഹാസഗീതത്തിന്റെ ശക്തിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: אָבַדְתָּ
  choice: നീ നശിച്ചുപോയി
  rationale: മോവാബിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന അבד എന്ന ക്രിയയുടെ സമ്പൂർണമായ വിനാശഭാവം വ്യക്തമാക്കുന്നു.
- source_word: עַם כְּמוֹשׁ
  choice: കെമോശിന്റെ ജനമേ
  rationale: കെമോശിനോടു ബന്ധപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന നിർമിതബന്ധം അഭിസംബോധനാരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: נָתַן
  choice: ആക്കിയിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘കൊടുത്തു’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള ‘പലായിതർ’, ‘തടവുകാർ’ എന്നീ ഫലാവസ്ഥകളോടൊപ്പം ഇവിടെ ഫലസൂചകമായ അർഥം സ്വാഭാവികമായി പകരുന്നു.
- source_word: בָּנָיו ... וּבְנֹתָיו
  choice: തന്റെ പുത്രന്മാരെ ... തന്റെ പുത്രിമാരെ
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ ഏകവചന പുല്ലിംഗ പ്രത്യയങ്ങളെ നിലനിർത്തി, ഏറ്റവും അടുത്ത മുൻപദമായ കെമോശിലേക്കുള്ള സൂചന സംരക്ഷിക്കുന്നു.
- source_word: פְּלֵיטִם
  choice: പലായിതർ
  rationale: പരാജയത്തെത്തുടർന്ന് ഓടിപ്പോകേണ്ടിവന്നവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പലായനഭാവം നിലനിർത്തുന്നു.
- source_word: בַּשְּׁבִית
  choice: തടവുകാർ
  rationale: സമാന്തരമായ നാമഘടനയിൽ തടവിലാക്കപ്പെട്ടവരുടെ അവസ്ഥ വ്യക്തമായി നൽകുന്നു.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: അമോര്യരുടെ രാജാവായ സീഹോന്റെ
  rationale: സീഹോനെ അമോര്യരുടെ രാജാവായി തിരിച്ചറിയുന്ന സമാനാധികരണബന്ധവും അവന്റെ അധികാരത്തിലുള്ള തടവെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘തന്റെ പുത്രന്മാർ’, ‘തന്റെ പുത്രിമാർ’ എന്നവയിലെ മൂന്നാംപുരുഷ ഏകവചന പ്രത്യയങ്ങളുടെ സൂചിതൻ
  choice: പ്രത്യയങ്ങൾ കെമോശിനെ സൂചിപ്പിക്കുന്നു.
  alternative: 'പ്രത്യയങ്ങൾ മോവാബിനെ സമൂഹവാചകമായി സൂചിപ്പിക്കുന്നു: ‘അതിന്റെ പുത്രന്മാർ’, ‘അതിന്റെ പുത്രിമാർ’.'
  rationale: ഏറ്റവും അടുത്ത മുൻപദം കെമോശാണ്; അവന്റെ ജനത്തിന്റെ പരാജയത്തിലൂടെ മോവാബിന്റെ ദേവന്റെ അശക്തിയെ പരിഹസിക്കുന്ന കാവ്യവ്യക്തിവൽക്കരണം ഇതിൽ നിലനിൽക്കുന്നു. എന്നാൽ വ്യാകരണപരമായി സാധ്യമായ മറ്റൊരു സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കാവ്യ-പ്രവാചക ശൈലി. ‘അയ്യോ കഷ്ടം’ വിലാപത്തിന്റെയും ദുരന്തപ്രഖ്യാപനത്തിന്റെയും ശക്തി നൽകുന്നു; അപൂർവമായ ‘പലായിതർ’ എന്ന പദം പലായനത്തിന്റെ ആശയം കൃത്യമായി സംരക്ഷിക്കുന്നതിനായി ഉപയോഗിച്ചു.
