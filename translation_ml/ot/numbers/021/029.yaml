revisions:
- from: മോവാബേ, നിനക്ക് അയ്യോ കഷ്ടം! കെമോശിന്റെ ജനമേ, നീ നശിച്ചുപോയി! അവൻ തന്റെ പുത്രന്മാരെ പലായിതരും തന്റെ പുത്രിമാരെ അമോര്യരുടെ രാജാവായ സീഹോന്റെ തടവുകാരുമാക്കിയിരിക്കുന്നു.[a]
  to: മോവാബേ, നിനക്കു കഷ്ടം! കെമോശിന്റെ ജനമേ, നീ നശിച്ചുപോയി! അവൻ തന്റെ പുത്രന്മാരെ പലായിതരായും തന്റെ പുത്രിമാരെ അമോര്യരുടെ രാജാവായ സീഹോന്റെ തടവുകാരായും ആക്കിയിരിക്കുന്നു.[a]
  rationale: 'The revision corrects the Malayalam predicative coordination while retaining the source’s resultative force: Chemosh has caused his sons to be fugitives and his daughters to be Sihon’s captives. It also makes the opening lament idiomatic and concise. The footnote is conformed to the revised grammar and continues to preserve the disputed antecedent of the suffixes.'
