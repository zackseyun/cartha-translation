    text: 'അല്ലെങ്കിൽ: “അതിന്റെ പുത്രന്മാരെ പലായിതരായും അതിന്റെ പുത്രിമാരെ തടവുകാരായും ആക്കിയിരിക്കുന്നു”; പ്രത്യയങ്ങൾ കെമോശിനെയല്ല, മോവാബിനെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ.'
