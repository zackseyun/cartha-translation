id: NUM.21.1
reference: Numbers 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: ml
  text: നെഗെബിൽ താമസിച്ചിരുന്ന അരാദിലെ കനാന്യരാജാവ്, ഇസ്രായേൽ അഥാരീമിന്റെ[a] വഴിയിലൂടെ വരുന്നു എന്നു കേട്ടപ്പോൾ, അവൻ ഇസ്രായേലിനോടു യുദ്ധം ചെയ്ത് അവരിൽ ചിലരെ ബന്ദികളാക്കി കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിലെ “അഥാരീം” എന്ന പദത്തിന്റെ അർഥം അനിശ്ചിതമാണ്. ചിലർ അതിനെ ഒരു സ്ഥലനാമമായി മനസ്സിലാക്കുന്നു; പുരാതന പരിഭാഷകളെ പിന്തുടർന്ന് മറ്റുചിലർ അതിനെ “ചാരന്മാർ” അല്ലെങ്കിൽ “നിരീക്ഷകർ” എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: കേട്ടപ്പോൾ
  rationale: ആഖ്യാനത്തിൽ വാർത്ത അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; തുടർന്നുള്ള യുദ്ധത്തിന് കാരണമായ സാഹചര്യവും വ്യക്തമാക്കുന്നു.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: അരാദിലെ കനാന്യരാജാവ്
  rationale: നിശ്ചിതത്വവും വംശീയ-രാഷ്ട്രീയ തിരിച്ചറിയലും സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: നെഗെബിൽ താമസിച്ചിരുന്ന
  rationale: പങ്കാളിത്തരൂപത്തിന്റെ താമസാർത്ഥം വ്യക്തമാക്കുകയും നെഗെബ് എന്ന ഭൂമിശാസ്ത്രനാമം പൊതുവായ 'തെക്ക്' എന്നാക്കി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: ഇസ്രായേൽ ... വരുന്നു എന്നു
  rationale: രാജാവ് കേട്ട വാർത്തയായി വാക്യം അവതരിപ്പിക്കുകയും ഇസ്രായേലിന്റെ സമീപിച്ചുവരവ് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: അഥാരീമിലേക്കുള്ള വഴിയിലൂടെ
  rationale: അഥാരീം എന്ന അനിശ്ചിത പദത്തെ സ്ഥലനാമമായി സംരക്ഷിക്കുന്നു; വഴിയുടെ ലക്ഷ്യമോ തിരിച്ചറിയലോ സൂചിപ്പിക്കുന്ന മലയാളരൂപം ഉപയോഗിച്ചെങ്കിലും മറ്റു വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ഇസ്രായേലിനോടു യുദ്ധംചെയ്ത്
  rationale: ശത്രുതാപരമായ പോരാട്ടം നേരിട്ട് അറിയിക്കുന്നു; സംഘർഷത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: അവരിൽ ചിലരെ പിടിച്ചുകൊണ്ടുപോയി
  rationale: സമൂഹവാചിയായ ഇസ്രായേലിൽനിന്ന് ചിലരെ യുദ്ധത്തടവുകാരാക്കിയെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഭൂമിശാസ്ത്രനാമങ്ങളും മൂലപാഠത്തിലെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
