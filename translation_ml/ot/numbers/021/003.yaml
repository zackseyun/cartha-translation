source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: ml
  text: യാഹ്‌വേ ഇസ്രായേലിന്റെ വാക്ക് കേട്ടു; കനാന്യരെ അവരുടെ കൈയിൽ ഏല്പിച്ചു. അവർ അവരെയും അവരുടെ പട്ടണങ്ങളെയും നാശത്തിനായി സമർപ്പിച്ചു. അതുകൊണ്ട് ആ സ്ഥലത്തിന് ഹോർമാ[a] എന്നു പേരായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഹോർമാ” എന്ന പേര്, “നാശത്തിനായി സമർപ്പിക്കുക” അഥവാ “നിരോധനത്തിൻ കീഴിലാക്കുക” എന്നർഥമുള്ള എബ്രായപദവുമായി ബന്ധപ്പെട്ടതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ, മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: അപേക്ഷ കേട്ടു
  rationale: അക്ഷരാർഥത്തിൽ ‘ശബ്ദം കേട്ടു’ എന്നാണെങ്കിലും, ഇവിടെ ഇസ്രായേലിന്റെ പ്രാർഥനയോട് അനുകൂലമായി പ്രതികരിക്കുക എന്ന എബ്രായ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: കനാന്യരെ അവരുടെ കൈയിൽ ഏല്പിച്ചു
  rationale: נתן എന്ന ക്രിയയുടെ ഈ യുദ്ധസന്ദർഭത്തിലെ അർഥം മറ്റൊരാളുടെ അധികാരത്തിൽ ഏല്പിക്കുക എന്നതാണ്. ഏകവചന വംശനാമത്തിന്റെ സമൂഹാർഥം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: וַיַּחֲרֵם
  choice: നാശത്തിനായി സമർപ്പിച്ചു
  rationale: חרם എന്ന പദത്തിന്റെ സാങ്കേതിക ആശയമായ മാറ്റാനാവാത്തവിധം നാശത്തിനായി നീക്കിവെക്കൽ നിലനിർത്തുന്നു; വെറും ‘നശിപ്പിച്ചു’ എന്നതിനെക്കാൾ ഉറവിടപദത്തിന്റെ പ്രത്യേകത ഇതിൽ തെളിയും.
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: അവരെയും അവരുടെ പട്ടണങ്ങളെയും
  rationale: വ്യക്തികളെയും അവരുടെ വാസകേന്ദ്രങ്ങളെയും സൂചിപ്പിക്കുന്ന രണ്ട് നേരിട്ടുള്ള കർമങ്ങളും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: ആ സ്ഥലത്തിന് ... എന്നു പേരായി
  rationale: ക്രിയ ഏകവചനമാണെങ്കിലും കർത്താവ് വ്യക്തമല്ല. ആരാണ് പേരിട്ടതെന്ന് അനാവശ്യമായി നിശ്ചയിക്കാതെ ഫലസൂചകവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: חָרְמָה
  choice: ഹോർമാ
  rationale: സ്ഥലപ്പേര് മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്യുന്നു; חרם എന്ന പദവുമായുള്ള ശബ്ദ-അർഥബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: חרם എന്ന യുദ്ധപരിഭാഷയുടെ വിവർത്തനം
  choice: അവരെയും അവരുടെ പട്ടണങ്ങളെയും നാശത്തിനായി സമർപ്പിച്ചു
  alternative: അവരെയും അവരുടെ പട്ടണങ്ങളെയും പൂർണമായി നശിപ്പിച്ചു / നിരോധനത്തിൻ കീഴിലാക്കി
  rationale: അക്രമത്തെ മൃദൂകരിക്കാതെയും ‘നിരോധനം’ എന്ന അപരിചിത സാങ്കേതിക പദത്തിൽ മാത്രം ഒതുക്കാതെയും, നാശത്തിനായി മാറ്റിവെക്കുക എന്ന പ്രത്യേക എബ്രായ ആശയം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപേക്ഷ കേട്ടു’ എന്നത് എബ്രായ ഭാഷാശൈലിയുടെ സന്ദർഭാർഥം നൽകുന്നു; חרם എന്ന സാങ്കേതിക ആശയം പ്രധാനവാക്യത്തിലും പേരുമായുള്ള ബന്ധം അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
