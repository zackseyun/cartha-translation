source:
  edition: WLC
  text: עַל כֵּ֛ן יֹאמְר֥וּ הַ/מֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְ/תִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് കവികൾ[a] ഇങ്ങനെ പറയുന്നു: “ഹെശ്ബോനിലേക്കു വരുവിൻ; സീഹോന്റെ നഗരം പണിയപ്പെടുകയും ഉറപ്പിക്കപ്പെടുകയും ചെയ്യട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പഴഞ്ചൊല്ലുകൾ ചൊല്ലുന്നവർ,” “ഗായകകവികൾ”; പരമ്പരാഗതമായി “ഭരണാധികാരികൾ.” ഇവിടെ ഹീബ്രു പദം രാഷ്ട്രീയ ഭരണാധികാരികളെയല്ല, പഴഞ്ചൊല്ലിന്റെ സ്വഭാവമുള്ള ഒരു ഗാനം രചിക്കുന്നവരെയോ ചൊല്ലുന്നവരെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֹאמְרוּ
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: ഇവിടെ ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന പതിവ് അഥവാ സൂക്തിപരമായ വർത്തമാനപ്രയോഗമാണ്; ‘പറയുന്നു’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: הַמֹּשְׁלִים
  choice: കവികൾ
  rationale: משל എന്ന ധാതുവിൽനിന്നുള്ള ഈ കർത്തൃവാചക രൂപം ഇവിടെ പഴഞ്ചൊല്ലോ പരിഹാസഗീതമോ രചിക്കുന്നവരെയോ ചൊല്ലുന്നവരെയോ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയ ‘ഭരണാധികാരികൾ’ എന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നില്ല. വായനാസൗകര്യത്തിനായി ‘കവികൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് അർഥവൈകല്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: בֹּאוּ
  choice: വരുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കല്പനയുടെ നേരിട്ടുള്ള, ഗൗരവമുള്ള മലയാളരൂപം.
- source_word: חֶשְׁבּוֹן
  choice: ഹെശ്ബോൻ
  rationale: സ്ഥലനാമം ഹീബ്രു ഉച്ചാരണത്തെ അനുഗമിച്ച് ലിപ്യന്തരിച്ചു; വിഭക്തിയോടെ മുഖ്യപാഠത്തിൽ ‘ഹെശ്ബോനിലേക്കു’ എന്നു നൽകി.
- source_word: תִּבָּנֶה
  choice: പണിയപ്പെടട്ടെ
  rationale: കാവ്യോദ്ധരണിയിലെ അപൂർണക്രിയയുടെ ആശംസാത്മക/ആജ്ഞാത്മക ഭാവം മലയാളത്തിലെ ‘-ട്ടെ’ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: וְתִכּוֹנֵן
  choice: ഉറപ്പിക്കപ്പെടട്ടെ
  rationale: כון എന്ന പദത്തിന്റെ സ്ഥാപിക്കപ്പെടുക, ദൃഢമാക്കപ്പെടുക എന്ന ആശയം ‘പണിയപ്പെടുക’ എന്ന സമാന്തരപ്രയോഗത്തോടൊപ്പം വ്യക്തമായി നൽകുന്നു.
- source_word: עִיר סִיחוֹן
  choice: സീഹോന്റെ നഗരം
  rationale: ഹീബ്രു construct ബന്ധത്തിലെ ഉടമസ്ഥത/ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ സംബന്ധിക രൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
