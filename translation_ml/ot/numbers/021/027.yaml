translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഉദ്ധരിച്ച ഗീതത്തിന്റെ കാവ്യഭാവം നിലനിർത്താൻ ‘വരുവിൻ’ എന്നും സമാന്തരമായ ‘പണിയപ്പെടുകയും ഉറപ്പിക്കപ്പെടുകയും ചെയ്യട്ടെ’ എന്നും ഉപയോഗിച്ചു; הַמֹּשְׁלִים എന്ന പദത്തിലെ യഥാർഥ ലെക്സിക്കൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
