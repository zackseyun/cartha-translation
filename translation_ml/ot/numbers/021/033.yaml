translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ബാശാൻരാജാവായ’ എന്ന ചേർന്ന പ്രയോഗം പദവിയും പേരും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; മൂലത്തിലെ ആവർത്തനവും യുദ്ധസന്ദർഭത്തിലെ സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
