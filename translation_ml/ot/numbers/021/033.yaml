base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: ml
  text: പിന്നെ അവർ തിരിഞ്ഞ് ബാശാനിലേക്കുള്ള വഴിയിലൂടെ കയറിച്ചെന്നു. ബാശാൻരാജാവായ ഓഗ് തന്റെ സകലജനത്തോടുംകൂടെ എദ്രെയിൽ യുദ്ധം ചെയ്യാൻ അവരെ നേരിടാൻ പുറപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരെ കാണാൻ/എതിരേൽക്കാൻ.’ എബ്രായപ്രയോഗത്തിന് സ്വതവേ നിഷ്പക്ഷമായ അർഥവുമുണ്ട്; എന്നാൽ ഇവിടെ ‘യുദ്ധം ചെയ്യാൻ’ എന്ന തുടർവാക്കുകൾ ശത്രുതാപരമായ നേരിടലാണെന്ന് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: അവർ തിരിഞ്ഞ്
  rationale: പנה എന്ന ക്രിയ ഇവിടെ യാത്രയുടെ ദിശ മാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പരിഭാഷ.
- source_word: וַיַּעֲלוּ
  choice: കയറിച്ചെന്നു
  rationale: עלה എന്നതിന്റെ ഉയരത്തിലേക്കോ പ്രദേശത്തിലേക്കോ പോകുന്ന ദിശാബോധം നിലനിർത്തുന്നു; മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമാണ്.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: ബാശാനിലേക്കുള്ള വഴിയിലൂടെ
  rationale: דרך കൂടെ സ്ഥലനാമം വരുമ്പോൾ ആ പ്രദേശത്തേക്കുള്ള പാതയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കാം.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ബാശാൻരാജാവായ ഓഗ്
  rationale: പേരും സ്ഥാനപ്പേരും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: וַיֵּצֵא
  choice: പുറപ്പെട്ടുവന്നു
  rationale: സൈനികസന്ദർഭത്തിലെ ‘പുറത്തേക്കു വരുക’ എന്ന ആശയം നൽകുന്നു; ‘പടനീങ്ങി’ എന്ന അമിതവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: לִקְרָאתָם
  choice: അവരെ നേരിടാൻ
  rationale: പദപ്രയോഗം സ്വതവേ ‘അവരെ കാണാൻ/എതിരേൽക്കാൻ’ എന്ന നിഷ്പക്ഷ അർഥം വഹിക്കാമെങ്കിലും, തുടർന്നുള്ള യുദ്ധസൂചന ഇവിടെ ശത്രുതാപരമായ നേരിടലാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: തന്റെ സകലജനത്തോടുംകൂടെ
  rationale: עַם എന്നത് അക്ഷരാർഥത്തിൽ ‘ജനം’ ആണ്; സന്ദർഭം സൈനികമാണെങ്കിലും ‘സൈന്യം’ എന്ന് പ്രത്യേകമാക്കുന്നില്ല.
- source_word: לַמִּלְחָמָה
  choice: യുദ്ധം ചെയ്യാൻ
  rationale: യുദ്ധത്തിനായി പുറപ്പെട്ടതെന്ന ഉദ്ദേശ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: אֶדְרֶעִי
  choice: എദ്രെയിൽ
  rationale: വാക്യാന്തത്തിലെ സ്ഥലനാമത്തെ യുദ്ധം നടന്ന സ്ഥലമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്ഥലാധികരണരൂപം സന്ദർഭത്തിന് യോജിക്കുന്നു.
