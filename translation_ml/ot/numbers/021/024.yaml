id: NUM.21.24
reference: Numbers 21:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: ml
  text: ഇസ്രായേൽ അവനെ വാളിന്റെ ധാരകൊണ്ട് അടിച്ചു; അർന്നോൻമുതൽ യബ്ബോക്കുവരെയും അമ്മോന്റെ പുത്രന്മാർവരെയും അവന്റെ ദേശം കൈവശമാക്കി. കാരണം, അമ്മോന്റെ പുത്രന്മാരുടെ അതിർത്തി ശക്തമായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: അവനെ ... വെട്ടി
  rationale: נכה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അടിക്കുക/വെട്ടുക’ നിലനിർത്തുന്നു; അവൻ കൊല്ലപ്പെട്ടു എന്ന നിഗമനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: לְפִי חָרֶב
  choice: വാളിന്റെ വായ്ത്തലകൊണ്ട്
  rationale: ‘വാളിന്റെ വായ്’ എന്ന എബ്രായ രൂപകം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം ‘വായ്ത്തല’ എന്നു നൽകി; വെറും ‘വാളുകൊണ്ട്’ എന്നതിനെക്കാൾ മൂലഭാഷയുടെ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു.
- source_word: וַיִּירַשׁ
  choice: കൈവശമാക്കി
  rationale: യുദ്ധസന്ദർഭത്തിൽ ദേശം സ്വന്തമാക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘അവകാശമായി ലഭിച്ചു’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: אַרְצוֹ
  choice: അവന്റെ ദേശം
  rationale: אֶרֶץ എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും ഭൂപ്രദേശപരമായ സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: അർന്നോൻമുതൽ യബ്ബോക്കുവരെയും
  rationale: ഭൂപ്രദേശത്തിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്ന എബ്രായ ഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ പുത്രന്മാരുടെ അതിർത്തിവരെയും
  rationale: ‘അമ്മോന്റെ പുത്രന്മാർ’ എന്ന എബ്രായ വംശബന്ധപ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ലക്ഷ്യമാക്കുന്നത് അവരുടെ അതിർത്തിയാണെന്ന് മലയാളവാക്യത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּי
  choice: കാരണം
  rationale: മുമ്പുള്ള ഭൂവിസ്താരം അവിടെ അവസാനിച്ചതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: עַז
  choice: ശക്തമായിരുന്നു
  rationale: עַז എന്ന വിശാലമായ ശക്തി/ബലം എന്ന അർഥം നിലനിർത്തുന്നു; ‘കോട്ടകെട്ടിയിരുന്നു’ എന്ന കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: גְּבוּל
  choice: അതിർത്തി
  rationale: ഭൂപ്രദേശത്തിന്റെ പരിധിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: בְּנֵי עַמּוֹן
  choice: അമ്മോന്റെ പുത്രന്മാർ
  rationale: മൂലത്തിലെ വംശബന്ധപ്രയോഗം നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: בְּנֵי עַמּוֹן എന്ന വംശബന്ധപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: അമ്മോന്റെ പുത്രന്മാർ
  alternative: അമ്മോന്യർ
  rationale: ഇത് പ്രധാനമായൊരു ഉപദേശവിഷയമല്ലെങ്കിലും, മൂലത്തിലെ പുരുഷലിംഗ വംശബന്ധരൂപം ഒരു മുഴുവൻ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠത്തിൽ ആ രൂപം സുതാര്യമായി നിലനിർത്തുകയും സ്വാഭാവികമായ ജനവിഭാഗനാമം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വാളിന്റെ വായ്ത്തല’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ മനസ്സിലാകുന്ന രൂപമാണ്. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾപ്രയോഗങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു.
