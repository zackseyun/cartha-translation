revisions:
- from: ഇസ്രായേൽ അവനെ വാളിന്റെ വായ്ത്തലകൊണ്ട് വെട്ടി; അർന്നോൻമുതൽ യബ്ബോക്കുവരെയും അമ്മോന്റെ പുത്രന്മാരുടെ[a] അതിർത്തിവരെയും അവന്റെ ദേശം കൈവശമാക്കി. കാരണം, അമ്മോന്റെ പുത്രന്മാരുടെ അതിർത്തി ശക്തമായിരുന്നു.
  to: ഇസ്രായേൽ അവനെ വാളിന്റെ ധാരകൊണ്ട് അടിച്ചു; അർന്നോൻമുതൽ യബ്ബോക്കുവരെയും അമ്മോന്റെ പുത്രന്മാർവരെയും അവന്റെ ദേശം കൈവശമാക്കി. കാരണം, അമ്മോന്റെ പുത്രന്മാരുടെ അതിർത്തി ശക്തമായിരുന്നു.
  rationale: 'The revision removes two interpretive additions: a cutting-specific sense for the broad verb נכה and an anticipatory reference to the Ammonites'' border in the first extent clause. It retains the Hebrew''s kinship terminology in both occurrences, keeps the explanatory force of כִּי, and uses natural modern Malayalam for the sword-edge idiom and territorial possession.'
