  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: ml
  text: ബാമോത്തിൽനിന്ന് മോവാബ്‌ദേശത്തുള്ള താഴ്‌വരയിലേക്കും, അവിടെനിന്ന് തരിശുഭൂമിയെ[a] അഭിമുഖീകരിക്കുന്ന[b] പിസ്ഗയുടെ കൊടുമുടിയിലേക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യെശിമോൻ’; ഈ എബ്രായപദം വിവരണാത്മകമായ പൊതുനാമത്തിനുപകരം ഒരു പ്രദേശനാമമായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: എബ്രായത്തിൽ അക്ഷരാർഥം, ‘തരിശുഭൂമിയുടെ മുഖത്തിന്മേൽ’; തരിശുഭൂമിക്കു നേരെയോ അതിനെ നോക്കിയോ ഉള്ള ഭൗമശാസ്ത്രപരമായ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: ബാമോത്തിൽനിന്ന്
  rationale: ഇവിടെ בָּמוֹת യാത്രാവിവരണത്തിലെ സ്ഥലനാമമായതിനാൽ ‘ഉയർന്ന സ്ഥലങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്യാതെ ‘ബാമോത്ത്’ എന്നു ലിപ്യന്തരിച്ചു; וּמִ־ എന്നതിന്റെ ബന്ധവും പുറപ്പെടൽസൂചനയും സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
- source_word: הַגַּיְא
  choice: താഴ്‌വര
  rationale: גַּיְא താഴ്‌വരയെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കാം; ഈ ഭൂമിശാസ്ത്രപരമായ യാത്രാവിവരണത്തിൽ ‘താഴ്‌വര’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: മോവാബിന്റെ പ്രദേശത്തുള്ള
  rationale: שָׂדֶה എന്നതിന്റെ അക്ഷരാർഥം ‘വയൽ’ ആണെങ്കിലും ഇവിടെ അത് തുറന്ന നാടിനെയോ പ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭൂപ്രദേശസൂചനയായി ‘പ്രദേശം’ സ്വാഭാവികമാണ്.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: പിസ്ഗയുടെ കൊടുമുടി
  rationale: ഭൂപ്രകൃതിസന്ദർഭത്തിൽ רֹאשׁ എന്ന ‘തല’ കൊടുമുടിയെ സൂചിപ്പിക്കുന്നു; הַפִּסְגָּה സ്ഥലനാമമായി ‘പിസ്ഗ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: וְנִשְׁקָפָה
  choice: നോക്കിനിൽക്കുന്ന
  rationale: ഈ രൂപം ഉയർന്ന സ്ഥലത്തുനിന്ന് ഒരു പ്രദേശത്തെ അഭിമുഖീകരിക്കുന്നതോ അതിനുമീതെ നോക്കുന്നതോ സൂചിപ്പിക്കുന്നു; ‘നോക്കിനിൽക്കുന്ന’ ഭൂമിശാസ്ത്രബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: עַל־פְּנֵי
  choice: മുഖത്തേക്ക്
  rationale: ‘മുഖത്തിന്മേൽ/മുഖത്തേക്ക്’ എന്ന എബ്രായ പ്രയോഗം ഒരു പ്രദേശത്തെ അഭിമുഖീകരിക്കുന്നതെന്ന ആശയം നൽകുന്നു; രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: הַיְשִׁימֹן
  choice: തരിശുനിലം
  rationale: יְשִׁימוֹן വിജനവും വരണ്ടതുമായ പ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. ഇത് ‘യെശിമോൻ’ എന്ന പ്രാദേശിക നാമമായും മനസ്സിലാക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭൂമിശാസ്ത്രവിവരണശൈലി സ്വീകരിച്ചു. എബ്രായവാക്യത്തിലെ ചുരുക്കമുള്ള യാത്രാക്രമം വ്യക്തമാക്കാൻ രണ്ടാമത്തെ ലക്ഷ്യസ്ഥാനത്തിനു മുമ്പ് ‘അവിടെനിന്ന്’ ചേർത്തു. ‘മുഖം’ എന്ന മൂലഭാഷാരൂപകം നിലനിർത്തിയെങ്കിലും അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
