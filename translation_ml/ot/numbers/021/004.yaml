  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. എബ്രായ യാത്രാവിവരണത്തിന്റെ ക്രമം സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വാക്യവിഭജനം സ്വീകരിച്ചു; പദപ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
