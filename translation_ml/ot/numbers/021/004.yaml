source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: ml
  text: പിന്നെ അവർ ഹോർ പർവതത്തിൽനിന്ന് ചെങ്കടലിന്റെ വഴിയായി[a] ഏദോംദേശം ചുറ്റിപ്പോകാനായി യാത്ര തിരിച്ചു. വഴിയിൽവെച്ച് ജനത്തിനു ക്ഷമകെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ഞാങ്ങണകളുടെ കടലിന്റെ വഴിയായി.’ എബ്രായം: യാം സൂഫ്.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജനത്തിനു മനംമടുത്തു’ എന്നോ ‘ജനത്തിന്റെ ധൈര്യം ചോർന്നു’ എന്നോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: മരുഭൂയാത്രാവിവരണങ്ങളിൽ נסע പാളയം വിട്ട് അടുത്ത ഘട്ടത്തിലേക്കു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘യാത്ര പുറപ്പെട്ടു’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵהֹר הָהָר
  choice: ഹോർമലയിൽനിന്ന്
  rationale: הֹר הָהָר എന്ന സ്ഥലനാമത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ‘ഹോർമല’ എന്നു നൽകി.
- source_word: דֶּרֶךְ יַם סוּף
  choice: ചെങ്കടലിലേക്കുള്ള വഴിയിലൂടെ
  rationale: דֶּרֶךְ ഒരു വഴിയെയോ യാത്രാമാർഗത്തെയോ സൂചിപ്പിക്കുന്നു. יַם סוּף എന്ന പരമ്പരാഗത നാമം മുഖ്യപാഠത്തിൽ ‘ചെങ്കടൽ’ എന്നു നൽകിയെങ്കിലും അതിന്റെ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: לִסְבֹב
  choice: ചുറ്റിപ്പോകാനായി
  rationale: 'ഈ infinitive യാത്രാമാർഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു: ഏദോംദേശം ഒഴിവാക്കി അതിനെ ചുറ്റി സഞ്ചരിക്കുക.'
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: ഏദോംദേശത്തെ
  rationale: אֶרֶץ ഇവിടെ ഏദോമിന്റെ ദേശമോ ഭൂപ്രദേശമോ ആണ്; ‘ഏദോംദേശം’ ലളിതവും കൃത്യവുമാണ്.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: ജനത്തിനു ക്ഷമകെട്ടു
  rationale: ‘ജനത്തിന്റെ ജീവൻ/മനം ചുരുങ്ങി’ എന്ന എബ്രായ ശൈലി അസഹിഷ്ണുത, മനംമടുപ്പ്, നിരുത്സാഹം എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ‘ക്ഷമകെട്ടു’ സ്വാഭാവികമാണ്; മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בַּדָּרֶךְ
  choice: വഴിയിൽവെച്ച്
  rationale: בְּ ഇവിടെ നേരിട്ട് സ്ഥാനകാലസാഹചര്യം സൂചിപ്പിക്കുന്നതായി എടുത്തു. യാത്രാമാർഗം അവരുടെ അവസ്ഥയ്ക്കു കാരണമായെന്ന സൂക്ഷ്മധ്വനിയും സാധ്യമാണെങ്കിലും മുഖ്യപാഠത്തിൽ അത് നിർബന്ധിച്ചിട്ടില്ല.
