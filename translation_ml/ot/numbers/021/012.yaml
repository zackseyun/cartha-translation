source:
  edition: WLC
  text: מִ/שָּׁ֖ם נָסָ֑עוּ וַֽ/יַּחֲנ֖וּ בְּ/נַ֥חַל זָֽרֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ പുറപ്പെട്ടു സേരെദ് വാടിയിൽ പാളയമിറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സേരെദ് താഴ്‌വരയിൽ,’ ‘സേരെദ് മലയിടുക്കിൽ,’ അല്ലെങ്കിൽ ‘സേരെദ് കാലിക നീർച്ചാലിന്റെ ചാലിൽ’; എബ്രായ പദമായ നഹൽ ഒരു വാടി, താഴ്‌വര, മലയിടുക്ക്, അല്ലെങ്കിൽ കാലിക നീർച്ചാലിന്റെ ചാൽ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: അവിടെനിന്ന്
  rationale: മുമ്പ് പറഞ്ഞ സ്ഥലത്തുനിന്നുള്ള പുറപ്പാടിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: נָסָעוּ
  choice: അവർ പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണങ്ങളിൽ נסע പാളയം നീക്കി യാത്ര തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ ഈ ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നതിന്റെ ‘തമ്പടിക്കുക/പാളയമടിക്കുക’ എന്ന അർഥം യാത്രാസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: בְּנַחַל
  choice: തോടിനരികെ
  rationale: נַחַל വാടി, മലയിടുക്ക്, കാലിക നീർച്ചാൽ, അല്ലെങ്കിൽ അതിന്റെ വരണ്ട ചാൽ എന്നിവയെ സൂചിപ്പിക്കാം. ‘തോട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; ‘അരികെ’ സ്ഥലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, എന്നാൽ ഭൂമിശാസ്ത്രപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: זָרֶד
  choice: സേരെദ്
  rationale: സ്ഥലനാമം പരിഭാഷപ്പെടുത്താതെ എബ്രായ ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ‘വാടി’ എന്ന അപരിചിത വായ്പാപദത്തിനു പകരം മുഖ്യവാക്യത്തിൽ ‘തോട്’ ഉപയോഗിച്ച്, മൂലപദത്തിന്റെ യഥാർഥ ഭൂമിശാസ്ത്രപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
