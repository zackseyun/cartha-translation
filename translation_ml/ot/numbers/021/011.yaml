base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: ml
  text: അവർ ഓബോത്തിൽനിന്ന് പുറപ്പെട്ടു; മോവാബിന് എതിർവശത്തുള്ള, സൂര്യോദയദിക്കിലെ മരുഭൂമിയിലെ ഇയ്യേ-അബാരീമിൽ[a] പാളയമിറങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇയ്യേ-അബാരീം’ എന്ന സ്ഥലനാമം അർഥമനുസരിച്ച് ‘അബാരീമിലെ അവശിഷ്ടങ്ങൾ’ എന്നോ ‘അബാരീമിലെ കൂമ്പാരങ്ങൾ’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: പുറപ്പെട്ട്
  rationale: മരുഭൂമിയാത്രാവിവരണങ്ങളിൽ נסע പാളയം വിട്ട് അടുത്ത യാത്രാഘട്ടത്തിലേക്കു പുറപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ട്’ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: מֵאֹבֹת
  choice: ഓബോത്തിൽനിന്ന്
  rationale: സ്ഥലനാമമായതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: וַיַּחֲנוּ
  choice: പാളയമിറങ്ങി
  rationale: חנה എന്നത് ഒരു സ്ഥലത്ത് തങ്ങി പാളയമടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘പാളയമിറങ്ങി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: ഇയ്യേ-അബാരീമിൽ
  rationale: യാത്രാപട്ടികയിൽ ഇത് സ്ഥലനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ലിപ്യന്തരണം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; പേരിലെ പദങ്ങളുടെ സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: בַּמִּדְבָּר
  choice: മരുഭൂമിയിലെ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ വരണ്ട വനാന്തരപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ഈ യാത്രാസന്ദർഭത്തിൽ ‘മരുഭൂമി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: മോവാബിന് അഭിമുഖമായുള്ള
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തിൽ עַל־פְּנֵי ‘അഭിമുഖമായി/എതിർവശത്ത്’ എന്ന സ്ഥാനബന്ധം സൂചിപ്പിക്കുന്നു; ‘അഭിമുഖമായുള്ള’ അതിന്റെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: സൂര്യൻ ഉദിക്കുന്ന ദിക്കിൽ
  rationale: പദശഃ ‘സൂര്യോദയത്തിന്റെ ഭാഗത്തുനിന്ന്/കിഴക്കുഭാഗത്ത്’ എന്ന ദിശാസൂചനയാണ്; ‘കിഴക്ക്’ എന്നു മാത്രം പറയാതെ എബ്രായത്തിലെ സൂര്യോദയചിത്രം നിലനിർത്തി.
