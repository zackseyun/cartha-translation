  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ യാത്രാവിവരണശൈലി സ്വീകരിച്ചു. സ്ഥലനാമങ്ങൾ ലിപ്യന്തരണം ചെയ്തു; മൂലപാഠത്തിലെ സൂര്യോദയദിശയുടെ ദൃശ്യഭാവം നിലനിർത്തി.
