  source_fidelity: 'The translation accurately conveys the imperative sequence: Yahweh speaks to Moses, commands him to make a saraph/fiery serpent for himself, place it on a nes, and states that every bitten person who looks at it will live. “തീപ്പാമ്പ്” preserves the fiery imagery of שָׂרָף without importing an angelic sense, and “കടിയേറ്റ ഏവനും” correctly represents the generic passive participle.'
