id: NUM.21.8
reference: Numbers 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശയോടു പറഞ്ഞു: “നിനക്കായി ഒരു തീപ്പാമ്പിനെ[a] ഉണ്ടാക്കി ഒരു കൊടിമരത്തിന്മേൽ[b] സ്ഥാപിക്കുക. കടിയേറ്റ ഏവനും അതിനെ നോക്കിയാൽ ജീവിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സെരാഫ്”; എബ്രായപദത്തിന് “എരിയുന്നവൻ” എന്നർഥമുണ്ട്; ഇവിടെ അത് മാരകമായ പാമ്പിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അടയാളത്തണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമത്തിന്റെ എബ്രായരൂപം വ്യക്തിനാമമായി നിലനിർത്തുന്നു.
- source_word: עֲשֵׂה לְךָ
  choice: നിനക്കായി ... ഉണ്ടാക്കി
  rationale: കല്പനയോടൊപ്പമുള്ള ദാതൃസർവനാമത്തിന്റെ വ്യക്തിപരമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: שָׂרָף
  choice: തീപ്പാമ്പ്
  rationale: ‘എരിയുന്നവൻ’ എന്ന പദചിത്രവും ഈ സന്ദർഭത്തിലെ പാമ്പിനെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ‘വിഷപ്പാമ്പ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: נֵס
  choice: കൊടിമരം
  rationale: ഈ പദത്തിന്റെ കൊടി/അടയാളം ഉയർത്തുന്ന തണ്ട് എന്ന അടിസ്ഥാനാർഥവും പാമ്പുരൂപം ഉയർത്തിവെക്കുന്ന സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: הַנָּשׁוּךְ
  choice: കടിയേറ്റ ഏവനും
  rationale: നിശ്ചയാർഥക ക്രിയാവിശേഷണരൂപത്തിന്റെ പൊതുവായ പ്രയോഗം സ്വാഭാവികമായി പകരുന്നു.
- source_word: וְרָאָה אֹתוֹ
  choice: അതിനെ നോക്കിയാൽ
  rationale: കാണുക എന്ന പ്രവൃത്തിയും തുടർന്നുള്ള ഫലവും തമ്മിലുള്ള നിബന്ധനാത്മകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וָחָי
  choice: ജീവിക്കും
  rationale: ജീവൻ നിലനിൽക്കും എന്ന ഫലം ലളിതമായും നേരിട്ടും പകരുന്നു.
theological_decisions:
- issue: שָׂרָף എന്ന പദത്തിന്റെ സൂചനയും ചിത്രഭാഷയും
  choice: പ്രധാനപാഠത്തിൽ ‘തീപ്പാമ്പ്’
  alternative: ‘സെരാഫ്’ അല്ലെങ്കിൽ ‘വിഷപ്പാമ്പ്’
  rationale: കഥാസന്ദർഭത്തിലെ പാമ്പിനെയും എബ്രായപദത്തിലെ ‘എരിയുന്ന’ ചിത്രത്തെയും നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട ദൂതസങ്കൽപ്പം ഇവിടെ ഇറക്കുമതി ചെയ്യുകയോ വിഷത്തെ മാത്രം മുൻനിർത്തി പദം വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നില്ല.
- issue: נֵס എന്ന പദത്തിന്റെ കൃത്യമായ വസ്തുസൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘കൊടിമരം’
  alternative: ‘അടയാളത്തണ്ട്’ അല്ലെങ്കിൽ ‘കൊടി’
  rationale: പാമ്പുരൂപം ഉയർത്തിവെച്ച തണ്ടിനെ സൂചിപ്പിക്കുമ്പോഴും പദത്തിന്റെ അടയാളം/കൊടി എന്ന അർഥപരിധി പൂർണമായി മറച്ചുവെക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കല്പനയും നിബന്ധന–ഫലബന്ധവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
