    issue: The phrase “വെങ്കലസർപ്പത്തെ നോക്കുമ്പോൾ ജീവിച്ചു” renders the look as a simultaneous temporal action.
    rationale: וְהִבִּיט ... וָחָי presents looking at the bronze serpent and living as sequential/resultative actions. “നോക്കിയാൽ ജീവിക്കുമായിരുന്നു” retains the conditional and result without adding theological nuance.
