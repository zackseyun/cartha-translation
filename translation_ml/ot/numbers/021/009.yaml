source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: ml
  text: അങ്ങനെ മോശെ വെങ്കലംകൊണ്ട് ഒരു സർപ്പത്തെ ഉണ്ടാക്കി, അതിനെ ആ തൂണിന്മേൽ സ്ഥാപിച്ചു.[a] ഒരു സർപ്പം ഒരാളെ കടിച്ചാൽ, ആ വ്യക്തി വെങ്കലസർപ്പത്തെ നോക്കിയാൽ ജീവിക്കുമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെങ്കലം” എന്നതിനുള്ള എബ്രായപദം ചെമ്പിനെയോ വെങ്കലത്തെയോ സൂചിപ്പിക്കാം. “തൂൺ” എന്ന പദത്തിന് “കൊടിമരം” അല്ലെങ്കിൽ “അടയാളക്കൊടി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഈ സംഭവത്തെ യോഹന്നാൻ 3:14–15-ൽ മാതൃകാപരമായി പരാമർശിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: സർപ്പം
  rationale: രൂപമായി നിർമിച്ച ജീവിയെയും കടിച്ച പാമ്പിനെയും സൂചിപ്പിക്കുന്ന എബ്രായപദം മലയാളത്തിൽ മാന്യവും സാഹിത്യപരവുമായ ‘സർപ്പം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: נְחֹשֶׁת
  choice: വെങ്കലം
  rationale: ലോഹത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന് ചെമ്പ് അഥവാ വെങ്കലം എന്ന അർഥമാകാം; ബൈബിൾപരമായ സാധാരണ പ്രയോഗവും ഈ സന്ദർഭത്തിലെ സ്വാഭാവികതയും കണക്കിലെടുത്ത് ‘വെങ്കലം’ സ്വീകരിച്ചു.
- source_word: הַנֵּס
  choice: ആ തൂൺ
  rationale: പദത്തിന് അടയാളക്കൊടി അഥവാ കൊടിമരം എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, ഇവിടെ സർപ്പരൂപം സ്ഥാപിച്ച ഉയർന്ന ഘടനയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘തൂൺ’ സ്വാഭാവികമാണ്.
- source_word: וְהָיָה
  choice: കടിച്ചാൽ … നോക്കുമ്പോൾ
  rationale: ഈ ഘടന ആവർത്തിച്ചു സംഭവിച്ച സാഹചര്യവും അതിന്റെ ഫലവും അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേകമായ ‘സംഭവിച്ചു’ ചേർക്കാതെ നിബന്ധനാപരമായ വാക്യമായി സ്വാഭാവികമായി നൽകി.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: ഒരു സർപ്പം ആരെയെങ്കിലും കടിച്ചാൽ
  rationale: എബ്രായത്തിലെ പുരുഷലിംഗ ഏകവചനമായ אִישׁ ഇവിടെ കടിയേറ്റ ഏതൊരു വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്നു; മലയാളത്തിൽ അതിന്റെ പൊതുവായ അർഥം വ്യക്തമായി നൽകാൻ ‘ആരെയെങ്കിലും’ ഉപയോഗിച്ചു.
- source_word: וְהִבִּיט אֶל
  choice: നോക്കുമ്പോൾ
  rationale: പദത്തിന്റെ നേരായ ദൃശ്യപ്രവർത്തനമായ ‘നോക്കുക’ നിലനിർത്തി; ‘ആശ്രയത്തോടെ നോക്കുക’ പോലുള്ള പിൽക്കാല ദൈവശാസ്ത്രസൂചനകൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: וָחָי
  choice: ജീവിച്ചു
  rationale: കടിയേറ്റയാൾ നോക്കിയതിന്റെ ഫലമായി ജീവനോടെ തുടർന്നു എന്ന നേരായ വിവരണത്തെ നിലനിർത്തുന്നു; ‘സുഖപ്പെട്ടു’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
theological_decisions:
- issue: אִישׁ എന്ന പ്രതിനിധിപരമായ പുരുഷലിംഗപ്രയോഗം
  choice: ആരെയെങ്കിലും
  alternative: ഒരു മനുഷ്യനെ / ഒരാളെ
  rationale: ഇവിടെ വ്യാകരണപരമായ ഏകവചനം ഒരു പുരുഷനെ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല; കടിയേറ്റ ഏതു വ്യക്തിയെയും ഉദ്ദേശിക്കുന്ന പൊതുവായ ശക്തി മലയാളത്തിൽ ‘ആരെയെങ്കിലും’ എന്നതിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- issue: ‘നോക്കി’ എന്ന പ്രവൃത്തിയുടെ പിൽക്കാല മാതൃകാപരമായ അർഥം
  choice: നോക്കുമ്പോൾ
  alternative: ആശ്രയത്തോടെ നോക്കിയപ്പോൾ / അതിലേക്കു നോക്കിയപ്പോൾ
  rationale: യോഹന്നാൻ 3:14–15-ലെ പിൽക്കാല മാതൃകാപരമായ ഉപയോഗം ഈ എബ്രായവാക്യത്തിന്റെ മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല; നേരായ അർഥം നിലനിർത്തി അടിക്കുറിപ്പിൽ ബന്ധം സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. എബ്രായത്തിലെ ആവർത്തനസ്വഭാവമുള്ള നിബന്ധനയും ഫലവും സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നൽകി; അനാവശ്യമായ പുരാതനഭാഷയും ദൈവശാസ്ത്രപരമായ വികസനവും ഒഴിവാക്കി.
