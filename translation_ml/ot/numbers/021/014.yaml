id: NUM.21.14
reference: Numbers 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യഹ്‌വേയുടെ യുദ്ധങ്ങളുടെ ഗ്രന്ഥത്തിൽ ഇങ്ങനെ പറയപ്പെടുന്നു:


    “സൂഫായിലെ[a] വഹേബും[b]


    അർന്നോന്റെ നീർച്ചാലുകളും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, സൂഫാ എന്നത് സ്ഥലനാമമല്ലാതെ ഒരു പൊതുനാമമായി എടുത്താൽ, “കൊടുങ്കാറ്റിലെ വഹേബും.”
    reason: alternative_reading
  - marker: b
    text: ഉദ്ധരിച്ചിരിക്കുന്ന ഈ വരിയുടെ ഹീബ്രു പാഠം ദുര്‍ഗ്രാഹ്യമാണ്. ചിലർ “വഹേബ്” എന്നത് സ്ഥലനാമമായല്ല, ഒരു ക്രിയാപ്രയോഗത്തിന്റെ ഭാഗമായും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: അതുകൊണ്ടാണ്
  rationale: ഒരു ഉദ്ധരണിയെയോ വിശദീകരണത്തെയോ പരിചയപ്പെടുത്തുന്ന നിഗമനസൂചക പ്രയോഗത്തിന്റെ ബന്ധശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יֵאָמַר
  choice: ഇങ്ങനെ പറയുന്നത്
  rationale: നിഫാൽ രൂപത്തിന്റെ ആളെ വ്യക്തമാക്കാത്ത പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണി-പരിചയപ്പെടുത്തൽ ശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: യഹ്‌വേയുടെ യുദ്ധങ്ങളുടെ പുസ്തകത്തിൽ
  rationale: അറിയപ്പെട്ട ഒരു ഗ്രന്ഥത്തിന്റെ ശീർഷകമെന്ന ഘടനയും מִלְחָמָה എന്ന പദത്തിന്റെ ബഹുവചനവും ദൈവനാമവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വേ
  rationale: ദൈവത്തിന്റെ വ്യക്തിനാമമായ ചതുരക്ഷരനാമം ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶת וָהֵב
  choice: വഹേബും
  rationale: ദുര്‍ഗ്രാഹ്യമായ കവിതാഭാഗത്തിൽ וָהֵב എന്നത് സ്ഥലനാമമായി നിലനിർത്തുന്നു; אֶת-ന്റെ പട്ടികാസ്വഭാവം മലയാളത്തിലെ ‘-ഉം’ കൊണ്ട് സ്വാഭാവികമാക്കുന്നു.
- source_word: בְּסוּפָה
  choice: സൂഫായിലെ
  rationale: סוּפָה എന്നത് സാധ്യതയുള്ള സ്ഥലനാമമായി ലിപ്യന്തരം ചെയ്യുന്നു; ‘കൊടുങ്കാറ്റിൽ’ എന്ന പൊതുനാമവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: וְאֶת הַנְּחָלִים
  choice: നീർച്ചാലുകളും
  rationale: ഭൂപ്രകൃതിയിൽ കാലാവസ്ഥാനുസൃതമായി വെള്ളമൊഴുകുന്ന താഴ്‌വരച്ചാലുകളെ സൂചിപ്പിക്കുന്ന נחל-ന്റെ അർത്ഥം സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: אַרְנוֹן
  choice: അർന്നോൻ
  rationale: നദി/പ്രദേശനാമത്തിന്റെ അംഗീകൃത ശബ്ദരൂപം മലയാളത്തിൽ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു; വ്യത്യസ്ത പാരമ്പര്യങ്ങളുടെ പ്രത്യേകത നിർബന്ധിക്കുന്നില്ല.
- issue: ദുര്‍ഗ്രാഹ്യമായ ഉദ്ധരണിയുടെ വ്യാഖ്യാനം
  choice: വഹേബ്, സൂഫാ എന്നിവയെ സ്ഥലനാമങ്ങളായി നിലനിർത്തുക
  alternative: വഹേബിനെ ക്രിയാഭാഗമായും സൂഫാ എന്നത് ‘കൊടുങ്കാറ്റ്’ എന്ന പൊതുനാമമായും വായിക്കുക
  rationale: മൂലഹീബ്രുവിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ അമിതമായി തീർപ്പാക്കാതെ, പ്രധാന സ്ഥലനാമവായന നൽകുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പുരാതന ഗ്രന്ഥശീർഷകവും കവിതാഉദ്ധരണിയുടെ വരിവിഭജനവും നിലനിർത്തി. ‘വാടി’ എന്ന അപരിചിത വിദേശപദത്തിനു പകരം സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ‘നീർച്ചാൽ’ ഉപയോഗിച്ചു; എന്നാൽ കാലാവസ്ഥാനുസൃത ജലപാതം എന്ന സൂക്ഷ്മത ഭാഗികമായി മാത്രമേ ഇതിൽ പ്രകടമാകൂ. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
