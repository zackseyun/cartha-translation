reference: Numbers 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: ml
  text: 'ഇങ്ങനെ എപ്പോഴും ആയിരുന്നു: മേഘം അതിനെ മൂടിക്കൊണ്ടിരുന്നു; രാത്രിയിൽ തീയുടെ ഭാവവും ഉണ്ടായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രാത്രിയിൽ തീപോലെ തോന്നുന്നതും.”
    reason: מַרְאֵה אֵשׁ എന്ന പ്രയോഗം ‘തീയുടെ ഭാവം’ എന്നും ‘തീപോലെ തോന്നുന്നത്’ എന്നും ഗ്രഹിക്കാം; ഇത് യഥാർഥ തീയാണോ തീസദൃശമായ പ്രത്യക്ഷതയാണോ എന്ന് പാഠം വ്യക്തമാക്കുന്നില്ല.
lexical_decisions:
- source_word: כֵּן
  choice: ഇങ്ങനെതന്നെ
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച പതിവിനെ സംഗ്രഹിച്ച് തുടർന്നുപറയുന്ന എബ്രായ പ്രയോഗത്തിന്റെ സൂചനാശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: יִהְיֶה
  choice: ആയിരുന്നു
  rationale: രൂപത്തിൽ അപൂർണകാലമാണെങ്കിലും സന്ദർഭത്തിൽ മരുഭൂമിയാത്രക്കാലത്തെ പതിവായ അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ മലയാളത്തിലെ ഭൂതകാലപ്രയോഗം യോജിക്കുന്നു.
- source_word: תָמִיד
  choice: എപ്പോഴും
  rationale: പ്രതിഭാസത്തിന്റെ തുടർച്ചയും സ്ഥിരതയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: സമീപസന്ദർഭത്തിൽ സമാഗമകൂടാരവുമായി ബന്ധപ്പെട്ട് ഇതിനകം അറിയപ്പെടുന്ന നിർദിഷ്ട മേഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יְכַסֶּנּוּ
  choice: അതിനെ മൂടിക്കൊണ്ടിരുന്നു
  rationale: כסה എന്ന ക്രിയയുടെ ‘മൂടുക’ എന്ന അർഥവും അപൂർണകാലത്തിന്റെ പതിവായ, തുടരുന്ന പ്രവൃത്തിയും ഈ രൂപം പ്രകടമാക്കുന്നു; പുരുഷലിംഗ ഏകവചന പ്രത്യയം സന്ദർഭത്തിലെ തിരുനിവാസത്തെ സൂചിപ്പിക്കുന്നതായി ‘അതിനെ’ എന്നു നൽകി.
- source_word: וּמַרְאֵה אֵשׁ
  choice: തീയുടെ രൂപവും കാണപ്പെട്ടു
  rationale: מַרְאֶה എന്നത് ദൃശ്യരൂപത്തെയോ കാഴ്ചയെയോ സൂചിപ്പിക്കുന്നു. ഇത് യഥാർഥ തീയാണോ തീപോലുള്ള പ്രത്യക്ഷതയാണോ എന്ന് നിർണയിക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: לָיְלָה
  choice: രാത്രിയിൽ
  rationale: കാലസൂചനയെ സ്വാഭാവികവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: יְכַסֶּנּוּ എന്നതിലെ സർവനാമപ്രത്യയത്തിന്റെ സൂചിതവസ്തു
  choice: ‘അതിനെ’—സന്ദർഭത്തിലെ തിരുനിവാസം/കൂടാരം
  alternative: ‘അവനെ’
  rationale: എബ്രായത്തിലെ മൂന്നാംപുരുഷ പുല്ലിംഗ ഏകവചനപ്രത്യയം ‘അവനെ’ അല്ലെങ്കിൽ ‘അതിനെ’ എന്നു വരാം. എന്നാൽ തൊട്ടുമുമ്പുള്ള സന്ദർഭം മേഘം തിരുനിവാസത്തെ മൂടുന്നതിനെക്കുറിച്ചായതിനാൽ ‘അതിനെ’ എന്നതാണ് ഏറ്റവും സ്വാഭാവികം.
- issue: מַרְאֵה אֵשׁ യഥാർഥ തീയെയോ തീപോലുള്ള പ്രത്യക്ഷതയെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘തീയുടെ രൂപം’ എന്ന തുറന്ന പ്രയോഗം
  alternative: ‘തീപോലെ തോന്നിക്കുന്ന ഒന്ന്’
  rationale: മൂലപാഠം ദൃശ്യമായ ഒരു അഗ്നിരൂപത്തെ പറയുന്നു; അതിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കാതെ ദൈവസാന്നിധ്യത്തിന്റെ പ്രത്യക്ഷതയെക്കുറിച്ചുള്ള പാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പതിവായി തുടരുന്ന പ്രവൃത്തിയെ ‘മൂടിക്കൊണ്ടിരുന്നു’ എന്നു നൽകി; കവിതാസ്വഭാവമുള്ള എബ്രായ നാമവാക്യത്തെ വായനാസൗകര്യത്തിനായി ‘കാണപ്പെട്ടു’ എന്ന ക്രിയയോടെ അവതരിപ്പിച്ചു.
