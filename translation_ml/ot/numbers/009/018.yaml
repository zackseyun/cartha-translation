  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: ml
  text: യഹോവയുടെ കല്പനപ്രകാരം ഇസ്രായേൽമക്കൾ യാത്ര പുറപ്പെട്ടു[a]; യഹോവയുടെ കല്പനപ്രകാരം അവർ പാളയമടിച്ചു. മേഘം തിരുനിവാസത്തിന്മേൽ നിലനിന്നിരുന്ന നാളുകളിലെല്ലാം അവർ പാളയത്തിൽത്തന്നെ തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘യഹോവയുടെ വായ്‌പ്രകാരം’; യഹോവയുടെ കല്പനയോ നിർദേശമോ അനുസരിച്ച് എന്നർഥമുള്ള എബ്രായ ശൈലി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: യഹോവയുടെ കല്പനപ്രകാരം
  rationale: ‘യഹോവയുടെ വായിന്മേൽ’ എന്ന അക്ഷരാർഥമുള്ള എബ്രായ പ്രയോഗം ഇവിടെ ദൈവിക കല്പനയോ നിർദേശമോ അനുസരിച്ച് എന്ന അർഥത്തിലാണ്; സ്വാഭാവിക മലയാളത്തിൽ ‘കല്പനപ്രകാരം’ അതിനെ വ്യക്തമായി നൽകുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമത്തെ ഒരു സ്ഥാനപ്പേരുകൊണ്ട് മാറ്റാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണമായി നൽകുന്നു.
- source_word: יִסְעוּ
  choice: യാത്ര പുറപ്പെട്ടു
  rationale: נסע പാളയം വിട്ട് യാത്ര തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘യാത്ര പുറപ്പെട്ടു’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായത്തിലെ കുടുംബബന്ധസൂചകമായ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന രൂപം നിലനിർത്തിക്കൊണ്ട്, സാധാരണ മലയാളത്തിൽ ഉൾക്കൊള്ളാവുന്ന പരമ്പരാഗതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: יַחֲנוּ
  choice: പാളയമിറങ്ങി / പാളയത്തിൽത്തന്നെ തുടർന്നു
  rationale: ആദ്യ പ്രയോഗത്തിൽ പാളയം സ്ഥാപിക്കുന്ന പ്രവൃത്തിയും അവസാന പ്രയോഗത്തിൽ ദൈർഘ്യസന്ദർഭം മൂലമുള്ള പാളയത്തിലെ തുടർച്ചയും വ്യക്തമാക്കുന്നു; രണ്ടിടത്തും חנה എന്ന മൂലപദത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: ദിവസങ്ങളിലൊക്കെയും
  rationale: മേഘം നിലനിന്ന മുഴുവൻ കാലദൈർഘ്യവും അടുത്തായി പ്രകടിപ്പിക്കുന്നു.
- source_word: יִשְׁכֹּן
  choice: നിലനിന്ന
  rationale: שכן എന്നത് വസിക്കുക, തങ്ങുക, നിലകൊള്ളുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു; മേഘത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യത്തിന് ‘നിലനിന്ന’ സ്വാഭാവികമാണ്.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: מִשְׁכָּן എന്നത് ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥലമായ കൂടാരത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുനിവാസം’ വാസസ്ഥലം എന്ന പദാർഥം നിലനിർത്തുകയും സമാഗമകൂടാരം എന്ന വ്യത്യസ്ത എബ്രായ പദവുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ വിവർത്തനം
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠം വ്യക്തിനാമമായ ചതുരക്ഷരനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനെ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- issue: מִשְׁכָּן എന്ന വിശുദ്ധ വാസസ്ഥലത്തിന്റെ പേര്
  choice: തിരുനിവാസം
  alternative: തിരുനിവാസകൂടാരം / സമാഗമകൂടാരം
  rationale: പദത്തിന്റെ ‘വാസസ്ഥലം’ എന്ന ആശയം സംരക്ഷിക്കുന്നു. ‘സമാഗമകൂടാരം’ കൂടുതൽ കൃത്യമായി אֹהֶל מוֹעֵד എന്ന മറ്റൊരു പദസമുച്ചയത്തോട് യോജിക്കുന്നതിനാൽ ഇവിടെ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആവർത്തിച്ചിരിക്കുന്ന ‘യഹോവയുടെ കല്പനപ്രകാരം’ എന്ന ഘടന മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
