  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: ml
  text: ഈ മാസം പതിനാലാം ദിവസം, സന്ധ്യകൾക്കിടയിൽ[a], അതിന്റെ നിശ്ചിതസമയത്ത് നിങ്ങൾ അത് ആചരിക്കണം. അതിനുള്ള സകല ചട്ടങ്ങളും സകല നിയമങ്ങളും അനുസരിച്ച് നിങ്ങൾ അത് ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സന്ധ്യകൾക്കിടയിൽ” എന്നത് സന്ധ്യാസമയത്തിനു ചുറ്റുമുള്ള കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഒരു പരമ്പരാഗത എബ്രായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: ഈ മാസം പതിനാലാം ദിവസം
  rationale: എബ്രായ തീയതിപ്രയോഗത്തിന്റെ കലണ്ടർകൃത്യത നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളക്രമത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: בֵּין הָעַרְבַּיִם
  choice: സന്ധ്യകൾക്കിടയിൽ
  rationale: പെസഹയുടെ സമയവുമായി ബന്ധപ്പെട്ട സാങ്കേതികവും വ്യാഖ്യാനഭേദമുള്ളതുമായ എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു; സാധാരണ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: നിങ്ങൾ അത് ആചരിക്കണം
  rationale: עשה എന്ന ക്രിയയ്ക്ക് ഇവിടെ പെസഹ ആചരിക്കുക എന്ന സന്ദർഭോചിത അർത്ഥമാണുള്ളത്. ആവർത്തിച്ചിരിക്കുന്ന ക്രിയ-കർമ പ്രയോഗം രണ്ടിടത്തും ഒരേവിധം നിലനിർത്തി.
- source_word: בְּמוֹעֲדוֹ
  choice: അതിന്റെ നിശ്ചിതസമയത്ത്
  rationale: מוֹעֵד സൂചിപ്പിക്കുന്ന മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട ആചാരസമയം കൃത്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: כְּכָל חֻקֹּתָיו
  choice: അതിനുള്ള സകല ചട്ടങ്ങളും അനുസരിച്ച്
  rationale: חֻקּוֹת എന്നത് നിർദേശിക്കപ്പെട്ട ആചാരചട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു; 'ചട്ടങ്ങൾ' സാധാരണ വായനക്കാർക്ക് വ്യക്തവും നിയമപരമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: സകല നിയമങ്ങളും അനുസരിച്ച്
  rationale: מִשְׁפָּטִים എന്നതിന്റെ നിയമപരമായ അർത്ഥം നൽകുകയും മുൻപുള്ള חֻקּוֹת എന്ന പദത്തിൽനിന്നുള്ള പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: בֵּין הָעַרְבַּיִם എന്ന സമയപ്രയോഗത്തിന്റെ കൃത്യപരിധി
  choice: സന്ധ്യകൾക്കിടയിൽ
  alternative: സന്ധ്യാസമയത്ത് / സൂര്യാസ്തമയത്തിനും ഇരുട്ടിനും ഇടയിൽ
  rationale: ഈ പരമ്പരാഗത എബ്രായ പ്രയോഗത്തിന്റെ കൃത്യമായ സമയപരിധിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനഭേദം പരിഭാഷയിൽ തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമ-ആചാര സ്വരം നിലനിർത്താൻ ‘ചട്ടങ്ങൾ’, ‘നിയമങ്ങൾ’, ‘നിശ്ചിതസമയം’ എന്നിവ ഉപയോഗിച്ചു; മൂലത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
