  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: ml
  text: രണ്ടു ദിവസമോ, ഒരു മാസമോ, അല്ലെങ്കിൽ ദിവസങ്ങളോ[a], മേഘം തിരുനിവാസത്തിന്മേൽ ദീർഘകാലം തങ്ങിനിന്നാൽ, ഇസ്രായേൽമക്കൾ പാളയമിറക്കും; അവർ യാത്ര പുറപ്പെടുകയില്ല. എന്നാൽ മേഘം ഉയരുമ്പോൾ അവർ യാത്ര പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളോ’; ഈ സന്ദർഭത്തിൽ ഇത് ദീർഘമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: '...ഓ, ...ഓ, ...ഓ'
  rationale: ആവർത്തിക്കുന്ന വികല്പസൂചക കണം വിവിധ കാലദൈർഘ്യങ്ങളെ നിരത്തുന്നു; മലയാളത്തിലെ ‘ഓ’ ഘടന അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: יֹמַיִם
  choice: രണ്ടു ദിവസം
  rationale: ദ്വിവചനരൂപം കൃത്യമായി ‘രണ്ടു ദിവസം’ എന്നാണ്.
- source_word: חֹדֶשׁ
  choice: ഒരു മാസം
  rationale: കാലദൈർഘ്യങ്ങളുടെ പട്ടികയിൽ അനിശ്ചിത ഏകവചനാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: יָמִים
  choice: അതിലേറെ ദിവസങ്ങൾ
  rationale: ‘രണ്ടു ദിവസം’, ‘ഒരു മാസം’ എന്നിവയ്ക്കുശേഷം വരുന്ന ബഹുവചനം കൂടുതൽ നീണ്ട കാലയളവിനെ സൂചിപ്പിക്കുന്നു; ‘ദിവസങ്ങൾ’ എന്ന മൂലരൂപവും നിലനിർത്തുന്നു.
- source_word: בְּהַאֲרִיךְ
  choice: അവിടെത്തന്നെ നിന്നാൽ
  rationale: മേഘത്തിന്റെ താമസം ദീർഘിക്കുന്നതും തുടർന്നുനിൽക്കുന്നതുമായ അർത്ഥം സുതാര്യമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: הֶעָנָן
  choice: മേഘം
  rationale: മരുഭൂമിയാത്രയിൽ വഴിനയിക്കുന്ന മേഘത്തിനുള്ള പതിവും വ്യക്തവുമായ പദം.
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: ദൈവസാന്നിധ്യത്തിനായുള്ള കൊണ്ടുനടക്കാവുന്ന വിശുദ്ധനിവാസം എന്ന ആശയം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: לִשְׁכֹּן עָלָיו
  choice: തിരുനിവാസത്തിന്മേൽ വസിച്ചുകൊണ്ട്
  rationale: שכן എന്ന ക്രിയയിലെ സ്ഥിരവാസത്തിന്റെ ആശയവും משכן എന്ന നാമവുമായുള്ള പദബന്ധവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ പാളയമടിച്ചുതന്നെ ഇരിക്കും
  rationale: പതിവായി സംഭവിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന അപൂർണ്ണക്രിയയും പാളയത്തിൽ തുടർന്നിരിക്കുമെന്ന സന്ദർഭാർത്ഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: וְלֹא יִסָּעוּ
  choice: അവർ യാത്ര പുറപ്പെടുകയില്ല
  rationale: പാളയം വിട്ട് യാത്ര തുടങ്ങുക എന്ന נסע-യുടെ സന്ദർഭാർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: וּבְהֵעָלֹתוֹ
  choice: എന്നാൽ മേഘം ഉയരുമ്പോൾ
  rationale: സർവനാമത്തിന്റെ സൂചിതപദമായ മേഘത്തെ മലയാളത്തിൽ വ്യക്തമാക്കി, അതിന്റെ ഉയർച്ച യാത്രയ്ക്കുള്ള അടയാളമാണെന്ന പ്രത്യക്ഷ അർത്ഥം നിലനിർത്തുന്നു.
