translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘തിരുനിവാസം’ വിശുദ്ധ കൂടാരത്തിന്റെ നിവാസസ്വഭാവം നിലനിർത്തുന്നു; ‘പാളയമടിച്ചുതന്നെ ഇരിക്കും’ എന്നത് തുടർന്നുള്ള താമസത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
