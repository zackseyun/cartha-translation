- from: രണ്ടു ദിവസമോ, ഒരു മാസമോ, അതിലേറെ ദിവസങ്ങളോ[a] മേഘം തിരുനിവാസത്തിന്മേൽ വസിച്ചുകൊണ്ട് അവിടെത്തന്നെ നിന്നാൽ, ഇസ്രായേൽമക്കൾ പാളയമടിച്ചുതന്നെ ഇരിക്കും; അവർ യാത്ര പുറപ്പെടുകയില്ല. എന്നാൽ മേഘം ഉയരുമ്പോൾ അവർ യാത്ര പുറപ്പെടും.
  to: രണ്ടു ദിവസമോ, ഒരു മാസമോ, അല്ലെങ്കിൽ ദിവസങ്ങളോ[a], മേഘം തിരുനിവാസത്തിന്മേൽ ദീർഘകാലം തങ്ങിനിന്നാൽ, ഇസ്രായേൽമക്കൾ പാളയമിറക്കും; അവർ യാത്ര പുറപ്പെടുകയില്ല. എന്നാൽ മേഘം ഉയരുമ്പോൾ അവർ യാത്ര പുറപ്പെടും.
  rationale: 'The revision corrects the sentence boundary, removes redundant phrasing, and keeps ‘days’ in the text so that the contextual inference of an extended period remains appropriately qualified in the footnote. It retains the source’s sequence and contrast: the cloud’s prolonged presence meant Israel remained encamped, and its rising signaled departure.'
