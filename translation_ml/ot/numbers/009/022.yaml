    text: അക്ഷരാർഥത്തിൽ ‘ദിവസങ്ങളോ’; ഈ സന്ദർഭത്തിൽ ഇത് ദീർഘമായ ഒരു കാലയളവിനെ സൂചിപ്പിക്കാം.
