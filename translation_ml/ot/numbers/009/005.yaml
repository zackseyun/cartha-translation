base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: ml
  text: അങ്ങനെ അവർ ഒന്നാം മാസത്തിൽ, മാസത്തിലെ പതിനാലാം ദിവസം സന്ധ്യാസമയത്ത്[a], സീനായി മരുഭൂമിയിൽ പെസഹ ആചരിച്ചു. യാഹ്‌വേ മോശയോടു കല്പിച്ചതെല്ലാം അനുസരിച്ച് ഇസ്രായേൽമക്കൾ പെസഹ ആചരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഹീബ്രുവിൽ അക്ഷരാർഥം: “രണ്ട് സന്ധ്യകൾക്കിടയിൽ”; സന്ധ്യാമയക്കാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: ആചരിച്ചു / ചെയ്തു
  rationale: പെസഹയോടൊപ്പം വരുന്ന ആദ്യത്തെ עשה ആചാരാനുഷ്ഠാനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആചരിച്ചു’ എന്നു നൽകി; സമാപനത്തിലെ അതേ ക്രിയയുടെ സാധാരണ അർഥം നിലനിർത്തി ‘ചെയ്തു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַפֶּסַח
  choice: പെസഹ
  rationale: സന്ദർഭത്തിൽ ഇത് ബലിയെ മാത്രം അല്ല, പെസഹാചരണത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ‘പെസഹ’ സ്വാഭാവികമാണ്.
- source_word: בָּרִאשׁוֹן
  choice: ഒന്നാം മാസത്തിൽ
  rationale: തുടർന്നുള്ള തീയതിപ്രയോഗം കണക്കിലെടുത്ത് ഹീബ്രുവിൽ അന്തർനിഹിതമായ ‘മാസം’ വ്യക്തതയ്ക്കായി ചേർത്തു.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ആ മാസത്തിന്റെ പതിനാലാം ദിവസം
  rationale: ഹീബ്രു തീയതിസൂത്രത്തിന്റെ അർഥവും ഘടനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: בֵּין הָעַרְבַּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘രണ്ട് സന്ധ്യകൾക്കിടയിൽ’ എന്ന ഹീബ്രു പ്രയോഗം സന്ധ്യാമയക്കാലത്തെ സൂചിപ്പിക്കുന്നു; വായനാസൗകര്യത്തിനായി സ്വാഭാവികമായ അർഥം മുഖ്യവാചകത്തിലും അക്ഷരാർഥം അടിക്കുറിപ്പിലും നൽകി.
- source_word: בְּמִדְבַּר סִינָי
  choice: സീനായി മരുഭൂമിയിൽ
  rationale: מִדְבָּר ജനവാസം കുറഞ്ഞ മരുഭൂമി/വിജനപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘സീനായി മരുഭൂമി’ വ്യക്തവും പ്രചാരമുള്ളതുമാണ്.
- source_word: כְּכֹל אֲשֶׁר
  choice: കല്പിച്ചതെല്ലാം അനുസരിച്ചുതന്നെ
  rationale: കല്പനയോടുള്ള സമ്പൂർണ അനുസരണം ഊന്നിപ്പറയുന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വ്യാപ്തിയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ടെട്രാഗ്രാമറ്റൺ ഒരു സ്ഥാനപ്പേരാക്കി മാറ്റാതെ മലയാളത്തിൽ വ്യാപകമായി അറിയപ്പെടുന്ന ‘യഹോവ’ എന്ന ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: צִוָּה
  choice: കല്പിച്ചു
  rationale: ഹീബ്രു സമ്പൂർണ്ണക്രിയ മുൻപ് നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സന്ദർഭക്രമത്തിൽ ‘കല്പിച്ചതെല്ലാം’ അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: അക്ഷരാർഥത്തിലെ വംശബന്ധവും സമൂഹപരമായ പരാമർശവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: യാഹ്‌വെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തിനാമസ്വഭാവം സംരക്ഷിച്ച് ഒരു സ്ഥാനപ്പേര് ഉപയോഗിക്കാതെ ലിപ്യന്തരിച്ചു. മലയാളത്തിലെ സാധാരണ വായനക്കാർക്ക് കൂടുതൽ പരിചിതമായ രൂപം തെരഞ്ഞെടുത്തു; കൃത്യമായ പുരാതന ഉച്ചാരണം അനിശ്ചിതമാണ്.
- issue: בְּנֵי יִשְׂרָאֵל എന്ന സമൂഹപരമായ പുത്രപ്രയോഗം
  choice: ഇസ്രായേൽമക്കൾ
  alternative: ഇസ്രായേല്യർ
  rationale: മൂലത്തിലെ കുടുംബബന്ധസൂചന മായ്ച്ചുകളയാതെ, മുഴുവൻ ഉടമ്പടിസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധം ഗൗരവവും വചനശൈലിയും നിലനിർത്തി. ദൈർഘ്യമേറിയ ഹീബ്രു വാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തിച്ച עשה-യുടെ ‘ആചരിച്ചു/ചെയ്തു’ വ്യത്യാസവും സമാപന ഊന്നലും സംരക്ഷിച്ചു.
