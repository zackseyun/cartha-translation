  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: ml
  text: രണ്ടാം മാസത്തിലെ പതിനാലാം ദിവസം, സന്ധ്യാസമയത്ത്[a], അവർ അത് ആചരിക്കണം; പുളിപ്പില്ലാത്ത അപ്പവും കയ്പുള്ള ചീരകളും കൂടെ അത് ഭക്ഷിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘സന്ധ്യകൾക്കിടയിൽ’; സൂര്യാസ്തമയത്തോടടുത്ത സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: രണ്ടാം മാസത്തിലെ
  rationale: കലണ്ടർസന്ദർഭത്തിൽ חֹדֶשׁ എന്നത് ‘മാസം’ എന്നാണ്; തുടർന്നുള്ള തീയതിയുമായി സ്വാഭാവികമായി ചേരാൻ ‘രണ്ടാം മാസത്തിലെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: പതിനാലാം ദിവസം
  rationale: എബ്രായത്തിലെ സംഖ്യാനിർമാണം ഒരു തീയതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പതിനാലാം ദിവസം’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: בֵּין הָעַרְבַּיִם
  choice: സന്ധ്യാസമയത്ത്
  rationale: അക്ഷരാർഥത്തിൽ ‘സന്ധ്യകൾക്കിടയിൽ’ എന്ന ഈ പ്രയോഗം സൂര്യാസ്തമയത്തോടടുത്ത സന്ധ്യാവേളയെ സൂചിപ്പിക്കുന്നു. വ്യക്തമായ ആധുനിക മലയാളത്തിനായി ‘സന്ധ്യാസമയത്ത്’ സ്വീകരിച്ച് അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: അവർ അത് ആചരിക്കണം
  rationale: പെസഹാസന്ദർഭത്തിൽ עשה എന്ന ക്രിയയ്ക്ക് ഒരു ആചരണം നിർവഹിക്കുക എന്ന അർഥമുണ്ട്; അതിനാൽ ‘ചെയ്യണം’ എന്നതിനെക്കാൾ ‘ആചരിക്കണം’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: עַל מַצּוֹת
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തോടും
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ עַל കൂടെ കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; מַצּוֹת പുളിപ്പില്ലാത്ത അപ്പമാണ്.
- source_word: וּמְרֹרִים
  choice: കയ്പുള്ള ചീരകളോടുംകൂടെ
  rationale: പെസഹാഭക്ഷണത്തോടൊപ്പം കഴിക്കുന്ന കയ്പുള്ള സസ്യഭക്ഷണങ്ങളെയാണ് ബഹുവചനപദം സൂചിപ്പിക്കുന്നത്; ‘കയ്പുള്ള ചീരകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: יֹאכְלֻהוּ
  choice: അത് ഭക്ഷിക്കണം
  rationale: പുരുഷബഹുവചന കർത്താവും ഏകവചന കർമപ്രത്യയവും വ്യക്തമായി നിലനിർത്തുന്നു; നിയമനിർദേശത്തിന്റെ ഭാവം ‘ഭക്ഷിക്കണം’ എന്നു നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. നിയമനിർദേശത്തിന്റെ ഭാവം ‘ആചരിക്കണം’, ‘ഭക്ഷിക്കണം’ എന്നീ രൂപങ്ങളിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാണിക്കുന്ന പദത്തിന്റെ പിന്നാലെ തന്നെയാണ് [a] ചേർത്തിരിക്കുന്നത്.
