- from: 'അപ്പോൾ യഹ്‌വെ മോശയോടു സംസാരിച്ചു[a]:'
  to: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു:'
  rationale: The revision retains the narrative sequence and the direct transliteration of יהוה while using the standard Malayalam inflection of മോശെ and an unambiguous speech-introduction verb. The colon preserves the anticipatory function of לֵאמֹר without adding content.
