base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ml
  text: 'അപ്പോൾ യഹ്‌വെ മോശെയോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: അപ്പോൾ ... സംസാരിച്ചു
  rationale: വാവ്-തുടർച്ച കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. דִּבֵּר എന്നതിന് ‘സംസാരിച്ചു’ എന്നത് യോജിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: ദൈവനാമമായ ചതുരക്ഷരി YHWH-നെ ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: אֶל־מֹשֶׁה
  choice: മോശയോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന אֶל എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിലെ ‘-യോടു’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: לֵאמֹר
  choice: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന വിരാമചിഹ്നം (:)
  rationale: ഈ എബ്രായ സൂത്രപ്രയോഗം തുടർന്നുള്ള പ്രസംഗത്തെ അവതരിപ്പിക്കുന്നു. ഒറ്റപ്പെട്ട ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അസ്വാഭാവിക രൂപത്തിനുപകരം കോളൺ മലയാളത്തിൽ അതേ പ്രവർത്തനം വ്യക്തമായി നിർവഹിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠത്തിൽ ഒരു പദവിയല്ല, YHWH എന്ന വ്യക്തിനാമമാണ് ഉള്ളത്. അതിനാൽ ദൈവനാമം നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു; പരമ്പരാഗത പകരംവായന അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. לֵאמֹר-ന്റെ പ്രസംഗ-ആമുഖ പ്രവർത്തനം കോളൺകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിച്ചിരിക്കുന്നു.
