  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: ml
  text: തിരുനിവാസം സ്ഥാപിച്ച ദിവസം, മേഘം തിരുനിവാസത്തെ—അതായത് സാക്ഷ്യകൂടാരത്തെ[a]—മൂടി. സന്ധ്യയിൽ അത് തിരുനിവാസത്തിനുമീതെ തീയുടെ രൂപംപോലെ പ്രഭാതംവരെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യത്തിന്റെ കൂടാരം.’ ഇവിടെ ‘സാക്ഷ്യം’ എന്നത് അവിടെ സൂക്ഷിച്ചിരുന്ന ഉടമ്പടിസാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: തിരുനിവാസം
  rationale: മരുഭൂമിയാത്രയിലെ ദൈവിക സാന്നിധ്യത്തിനായുള്ള വഹിക്കാവുന്ന വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും അർത്ഥസുതാര്യവുമായ മലയാളപദം.
- source_word: הָקִים
  choice: സ്ഥാപിച്ച
  rationale: തിരുനിവാസം ഉയർത്തി ഒരുക്കിയ സംഭവത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: כִּסָּה הֶעָנָן
  choice: മേഘം ... മൂടി
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥവും ദൃശ്യബിംബവും സംരക്ഷിക്കുന്നു.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: അതായത് സാക്ഷ്യകൂടാരത്തെ
  rationale: രണ്ടാമത്തെ പ്രയോഗം തിരുനിവാസത്തെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗമായി അവതരിപ്പിക്കുന്നു; לְ എന്ന ഘടകത്തിന്റെ അസാധാരണത്വം വ്യാഖ്യാനിച്ച് അതിരുകടക്കുന്നില്ല.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: സന്ധ്യയായപ്പോൾ ... അത് ... കാണപ്പെട്ടു
  rationale: ഇംപെർഫെക്റ്റിന്റെ വിവരണാത്മക/പതിവായ ഭൂതകാലബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൃശ്യരൂപത്തെ തുടർന്നുള്ള വാക്യഘടനയുമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: തീയുടെ രൂപംപോലെ
  rationale: അത് തീയായിരുന്നു എന്ന് തിരിച്ചറിയിക്കാതെ, തീപോലെയുള്ള ദൃശ്യസാദൃശ്യം മാത്രമാണ് മൂലപാഠം പറയുന്നതെന്ന സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: עַד בֹּקֶר
  choice: പ്രഭാതംവരെ
  rationale: കാലപരിധിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: തിരുനിവാസവും സാക്ഷ്യകൂടാരവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടാമത്തെ പ്രയോഗം ആദ്യത്തേതിനെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ വിശദീകരണമായി നൽകി
  alternative: ‘സാക്ഷ്യകൂടാരത്തിങ്കൽ തിരുനിവാസത്തെ മൂടി’ എന്ന സ്ഥാനസൂചനാപരമായ വായന
  rationale: വാക്യഘടനയിൽ ‘സാക്ഷ്യകൂടാരം’ വേറൊരു വസ്തുവിനെക്കാൾ തിരുനിവാസത്തിന്റെ ആരാധനാപരമായ തിരിച്ചറിയലാണെന്ന വായനയാണ് കൂടുതൽ സ്വാഭാവികം.
- issue: മേഘത്തിന്റെ രാത്രികാല ദൃശ്യം
  choice: ‘തീയുടെ രൂപംപോലെ കാണപ്പെട്ടു’
  alternative: മേഘം തീയായിരുന്നു എന്ന തിരിച്ചറിയിക്കൽ
  rationale: כְּמַרְאֵה എന്ന താരതമ്യപ്രയോഗം സാദൃശ്യം സൂചിപ്പിക്കുന്നു; വസ്തുതാത്മക ഐക്യം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരുനിവാസം’ ആരാധനാസന്ദർഭം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മൂലപാഠത്തിലെ നീണ്ട ഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; അർത്ഥബന്ധം സംരക്ഷിച്ചു.
