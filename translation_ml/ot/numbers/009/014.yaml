source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: ml
  text: നിങ്ങളോടൊപ്പം താമസിക്കുന്ന ഒരു പരദേശി യഹ്‌വേക്കായി പെസഹ ആചരിക്കുന്നുവെങ്കിൽ[a], പെസഹയുടെ ചട്ടപ്രകാരവും അതിന്റെ ക്രമപ്രകാരവും അവൻ അങ്ങനെ ആചരിക്കണം. നിങ്ങൾക്കും പരദേശിക്കും ദേശത്തെ സ്വദേശിക്കും ഒരേയൊരു ചട്ടം ഉണ്ടായിരിക്കണം.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘പെസഹ ചെയ്യുക’; പെസഹ ആചരിക്കുക എന്നർഥമുള്ള എബ്രായ പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരദേശി’ എന്നു പരിഭാഷപ്പെടുത്തിയ എബ്രായപദം ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന വിദേശവംശജനെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും യാത്രക്കാരനെയല്ല.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘ദേശത്ത് ജനിച്ചവൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּר ... גֵּר
  choice: നിങ്ങളോടൊപ്പം ഒരു പരദേശി താമസിക്കുകയും
  rationale: גֵּר എന്നത് വഴിപോക്കനെയല്ല, ഇസ്രായേലിന്റെ ഇടയിൽ താമസിക്കുന്ന വിദേശവംശജനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പരദേശി’യും ‘താമസിക്കുക’യും ചേർന്ന് ഈ നിയമപരമായ താമസസ്ഥിതി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: וְעָשָׂה פֶסַח
  choice: പെസഹ ആചരിക്കാൻ ആഗ്രഹിക്കുകയും
  rationale: ‘പെസഹ ചെയ്യുക’ എന്ന എബ്രായ പ്രയോഗം പെസഹാനുഷ്ഠാനം പാലിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നിബന്ധനാഭാവം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ആചരിക്കാൻ ആഗ്രഹിക്കുക’ എന്നു നൽകി.
- source_word: לַיהוָה
  choice: യഹ്‌വേക്കായി
  rationale: לְ സമർപ്പണത്തെയോ ദിശയെയോ സൂചിപ്പിക്കുന്നു; ദൈവനാമമായ יהוה ശീർഷകമാക്കി മാറ്റാതെ ‘യഹ്‌വേ’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: כְּחֻקַּת הַפֶּסַח וּכְמִשְׁפָּטוֹ
  choice: പെസഹയുടെ ചട്ടവും അതിന്റെ ക്രമവും അനുസരിച്ച്
  rationale: חֻקָּה എന്ന നിയമപരമായ നിർദേശത്തെ ‘ചട്ടം’ എന്നും, മִשְׁפָּט എന്ന അനുഷ്ഠാനരീതിയെ ഇവിടെ ‘ക്രമം’ എന്നും വേർതിരിച്ചു.
- source_word: כֵּן יַעֲשֶׂה
  choice: അനുസരിച്ചുതന്നെ അവൻ അത് ആചരിക്കണം
  rationale: നിർദേശിച്ച രീതിയോടുള്ള കൃത്യമായ അനുരൂപതയും നിർബന്ധസ്വഭാവവും ‘തന്നെ’യും ‘ആചരിക്കണം’യും പ്രകടമാക്കുന്നു.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: ഒരേയൊരു ചട്ടം ആയിരിക്കണം
  rationale: രണ്ടു കൂട്ടർക്കും ബാധകമായ ഏക നിയമത്തെ ഊന്നിപ്പറയുന്ന നിയമപ്രഖ്യാപനം നിലനിർത്തുന്നു.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: ദേശവാസിക്കും
  rationale: אֶזְרָח വിദേശതാമസക്കാരനോടു വിരുദ്ധമായി ദേശത്ത് സ്വദേശിയായ ആളെ സൂചിപ്പിക്കുന്നു; ആധുനിക രാഷ്ട്രീയ അർഥമുള്ള ‘പൗരൻ’ ഒഴിവാക്കി.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ്; യഹോവ
  rationale: മൂലപാഠം ചതുർവ്യഞ്ജന ദൈവനാമം നേരിട്ട് ഉപയോഗിക്കുന്നു. അതിനാൽ ശീർഷകമാക്കി മാറ്റാതെ ഉടമ്പടിനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- issue: പരദേശിക്കും ദേശവാസിക്കും ബാധകമായ ഏക ചട്ടം
  choice: പെസഹയുടെ ഈ സന്ദർഭത്തിൽ ഒരേയൊരു ചട്ടം ഇരുവർക്കും ബാധകമാണെന്ന് നേരിട്ട് പ്രസ്താവിച്ചു
  alternative: പരദേശിക്ക് പെസഹ ആചരിക്കാനുള്ള അനുമതി മാത്രം സൂചിപ്പിക്കുക
  rationale: ‘ഒരേയൊരു ചട്ടം’ എന്നു മൂലപാഠം വ്യക്തമായി പറയുന്നതിനാൽ നിയമപരമായ തുല്യബാധകത നിലനിർത്തി; എന്നാൽ അതിനെ ഈ വാക്യത്തിന്റെ പെസഹാസന്ദർഭത്തിനപ്പുറം വികസിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും നിയമ-ആരാധനാ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവവുമുള്ള മലയാളം. ‘ചട്ടം/ക്രമം’ എന്ന വ്യത്യാസം മൂലത്തിലെ חֻקָּה/מִשְׁפָּט പദജോടി ഭാഗികമായി നിലനിർത്തുന്നു; ‘പരദേശി’ എന്ന പദത്തിന്റെ പ്രത്യേക താമസസ്ഥിതി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
