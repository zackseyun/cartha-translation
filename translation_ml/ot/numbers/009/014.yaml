review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the resident-foreigner sense of גֵּר, renders יהוה as ‘യഹ്‌വേ,’ preserves the statute/procedure distinction, and retains the single-rule declaration. However, ‘പെസഹ ആചരിക്കാൻ ആഗ്രഹിക്കുകയും’ adds a desire/intention that the Hebrew does not express; וְעָשָׂה פֶסַח refers to actually observing the Passover.
  naturalness: The revision uses modern, formal Malayalam suited to legal-ritual instruction. ‘ക്രമപ്രകാരം’ is idiomatic in this context, and the repeated observance clause remains clear without being unnecessarily wooden.
  terminology: ‘പരദേശി’ is retained with a footnote specifying a resident foreigner. ‘ചട്ടം’ and ‘ക്രമം’ appropriately distinguish חֻקָּה and מִשְׁפָּט in this context. ‘ദേശത്തെ സ്വദേശിക്ക്’ maintains the contrast with the resident foreigner without importing a modern citizenship category.
  issues:
  - severity: medium
    issue: ‘ആചരിക്കാൻ ആഗ്രഹിക്കുകയും’ translates the Passover clause as a wish or intention.
    rationale: The Hebrew says that the resident foreigner ‘does/makes Passover,’ an idiom for observing it. It does not contain a verb of wanting. The added intention changes the stated condition and must be removed.
  - severity: low
    issue: The source’s second conformity clause is better represented with an explicit ‘അങ്ങനെ’.
    rationale: כֵּן יַעֲשֶׂה reiterates that he must observe it in the prescribed manner. ‘അങ്ങനെ ആചരിക്കണം’ preserves this emphasis naturally.
