revisions:
- from: 'ആ പുരുഷന്മാർ അവനോട് പറഞ്ഞു: “ഒരു മനുഷ്യന്റെ മൃതദേഹം നിമിത്തം ഞങ്ങൾ അശുദ്ധരായിരിക്കുന്നു.[a] യിസ്രായേൽമക്കളുടെ ഇടയിൽ യഹോവയുടെ വഴിപാട് അതിന്റെ നിശ്ചിതസമയത്ത് അർപ്പിക്കുന്നതിൽനിന്ന് ഞങ്ങളെ എന്തിന് ഒഴിവാക്കണം?[b]”'
  to: 'ആ പുരുഷന്മാർ അവനോടു പറഞ്ഞു: “ഒരു മനുഷ്യശവം നിമിത്തം ഞങ്ങൾ അശുദ്ധരാണ്.[a] യിസ്രായേൽമക്കളുടെ ഇടയിൽ യാഹ്‌വേയുടെ വഴിപാട് അതിന്റെ നിശ്ചിതസമയത്ത് അർപ്പിക്കുന്നതിൽനിന്ന് ഞങ്ങൾ എന്തിന് ഒഴിവാക്കപ്പെടണം?[b]”'
  rationale: ദൈവനാമം ഇംഗ്ലീഷ് POB audit-trail-ലെ “Yahweh” തീരുമാനത്തോടു ചേർത്ത് “യാഹ്‌വേ” എന്നാക്കി. നിഷ്ക്രിയമായ പ്രതിഷേധചോദ്യം കൂടുതൽ കൃത്യമായി നൽകാൻ “ഞങ്ങൾ എന്തിന് ഒഴിവാക്കപ്പെടണം?” എന്നു പരിഷ്കരിച്ചു. മനുഷ്യശവം സംബന്ധിച്ച പ്രയോഗത്തിന്റെ വിശദീകരണം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി; സമ്പർക്കം ഉണ്ടായെന്ന് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
