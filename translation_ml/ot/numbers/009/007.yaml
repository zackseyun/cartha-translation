  naturalness: “ഒരു മനുഷ്യശവം നിമിത്തം” എന്ന പ്രയോഗം മൃതദേഹത്താൽ ഉണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധി വ്യക്തമായി അറിയിക്കുന്നു. “ഞങ്ങൾ എന്തിന് ഒഴിവാക്കപ്പെടണം?” ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ നിഷ്ക്രിയതയും നിലനിർത്തുന്നതുമാണ്.
  terminology: ടുമ്അഹിന് “അശുദ്ധർ” ഉചിതമാണ്; കോർബാനിന് “വഴിപാട്” യോജിക്കുന്നു. യിസ്രായേൽമക്കൾ എന്ന ഉടമ്പടിസമൂഹനാമം നിലനിർത്തിയിരിക്കുന്നു. യഹോവയ്ക്കുപകരം audit-trail-നോട് ഒത്ത “യാഹ്‌വേ” ഉപയോഗിച്ചിരിക്കുന്നു.
  issues:
  - severity: medium
    issue: യְהוָה “യഹോവ” എന്നായി നൽകിയിരിക്കുന്നു.
    rationale: ലഭ്യമായ ഇംഗ്ലീഷ് POB audit trail വ്യക്തിനാമത്തെ “Yahweh” എന്നു നിശ്ചയിക്കുന്നു. അതിനാൽ മലയാളത്തിലെ “യാഹ്‌വേ” രൂപം ആ തീരുമാനത്തോട് കൂടുതൽ വിശ്വസ്തമാണ്.
