id: NUM.9.7
reference: Numbers 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: ml
  text: 'ആ പുരുഷന്മാർ അവനോടു പറഞ്ഞു: “ഒരു മനുഷ്യശവം നിമിത്തം ഞങ്ങൾ അശുദ്ധരാണ്.[a] യിസ്രായേൽമക്കളുടെ ഇടയിൽ യാഹ്‌വേയുടെ വഴിപാട് അതിന്റെ നിശ്ചിതസമയത്ത് അർപ്പിക്കുന്നതിൽനിന്ന് ഞങ്ങൾ എന്തിന് ഒഴിവാക്കപ്പെടണം?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: എബ്രായത്തിൽ അക്ഷരാർഥത്തിൽ, “ഒരു മനുഷ്യന്റെ നെഫെഷ് നിമിത്തം”; നിയമസന്ദർഭത്തിൽ ഇത് മനുഷ്യശവം മൂലമുള്ള ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “യാഹ്‌വേയുടെ വഴിപാട് ... കൊണ്ടുവരുന്നതിൽനിന്ന് ഞങ്ങൾ എന്തിന് തടയപ്പെടണം?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֲנָשִׁים הָהֵמָּה
  choice: ആ പുരുഷന്മാർ
  rationale: നാമത്തോടൊപ്പമുള്ള നിർദേശകപദത്തിന്റെ സൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: טְמֵאִים
  choice: അശുദ്ധരായിരിക്കുന്നു
  rationale: ഇവിടെ ആചാരപരമായ അശുദ്ധിയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിലും സാധാരണ വായനയിലും വ്യക്തമായ പദം.
- source_word: לְנֶפֶשׁ אָדָם
  choice: ഒരു മനുഷ്യന്റെ മൃതദേഹം നിമിത്തം
  rationale: എബ്രായ പ്രയോഗം മനുഷ്യശവവുമായി ബന്ധപ്പെട്ടുണ്ടാകുന്ന ആചാരപരമായ അശുദ്ധിയെ സൂചിപ്പിക്കുന്നു; അവ്യക്തമായ അക്ഷരാർഥം ഒഴിവാക്കി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: נִגָּרַע
  choice: ഞങ്ങളെ എന്തിന് ഒഴിവാക്കണം
  rationale: ഗ്രഹിക്കാവുന്ന സ്വാഭാവിക മലയാളത്തിൽ പങ്കാളിത്തത്തിൽനിന്ന് മാറ്റിനിർത്തപ്പെടുക എന്ന നിഫാൽ ഭാവം നൽകുന്നു.
- source_word: לְבִלְתִּי הַקְרִב
  choice: അർപ്പിക്കുന്നതിൽനിന്ന്
  rationale: യാഗസന്ദർഭത്തിൽ הקריב എന്നത് വഴിപാട് കൊണ്ടുവന്ന് അർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: קָרְבַּן יְהוָה
  choice: യഹോവയുടെ വഴിപാട്
  rationale: קָרְבָּן എന്ന യാഗാർഥവും ദൈവനാമവുമായുള്ള ബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: בְּמֹעֲדוֹ
  choice: അതിന്റെ നിശ്ചിതസമയത്ത്
  rationale: നിയമിക്കപ്പെട്ട സ്ഥിരസമയം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: യിസ്രായേൽമക്കളുടെ ഇടയിൽ
  rationale: എബ്രായത്തിലെ ഉടമ്പടിസമൂഹനാമമായ ‘യിസ്രായേൽമക്കൾ’ എന്ന രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിലുള്ള വ്യക്തിനാമം ഒരു പദവിയാക്കി മാറ്റാതെ മലയാളത്തിൽ ദീർഘകാലമായി പരിചിതമായ ‘യഹോവ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- issue: לְנֶפֶשׁ אָדָם എന്ന പ്രയോഗത്തിലെ ശവാശുദ്ധി
  choice: ഒരു മനുഷ്യന്റെ മൃതദേഹം നിമിത്തം
  alternative: ഒരു മരിച്ച മനുഷ്യൻ നിമിത്തം
  rationale: പ്രയോഗം വെറും മരണബന്ധമല്ല, മനുഷ്യശവവുമായി ബന്ധപ്പെട്ട ആചാരപരമായ അശുദ്ധിയാണെന്ന് വ്യക്തമാക്കുന്നു; സമ്പർക്കം ഉണ്ടായെന്ന് മൂലത്തിൽ തുറന്നുപറയാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: נִגָּרַע എന്നതിന്റെ പ്രതിഷേധസ്വരം
  choice: ഞങ്ങളെ എന്തിന് ഒഴിവാക്കണം?
  alternative: ഞങ്ങളെ എന്തിന് തടയണം?
  rationale: അർപ്പണത്തിൽ പങ്കുചേരുന്നതിൽനിന്നുള്ള ഒഴിവാക്കൽ എന്ന ആശയം നൽകുന്നു; അതിന് ഉത്തരവാദി ആരെന്നത് പാഠം വ്യക്തമാക്കാത്തതിനാൽ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആചാരപരമായ അശുദ്ധിക്ക് ‘അശുദ്ധർ’, offering-ന് ‘വഴിപാട്’, sacrifice-presentation-ന് ‘അർപ്പിക്കുക’ എന്നിവ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
