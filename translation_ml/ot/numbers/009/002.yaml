  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: ml
  text: ഇസ്രായേൽമക്കൾ പെസഹ അതിന്റെ നിശ്ചിതസമയത്ത് ആചരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇസ്രായേല്യർ’; പരമ്പരാഗതമായി ‘ഇസ്രായേൽസന്തതികൾ.’ എബ്രായത്തിൽ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: ആചരിക്കട്ടെ
  rationale: עשה എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘ചെയ്യുക’ എന്നാണെങ്കിലും, פֶּסַח കർമമായി വരുമ്പോൾ പെസഹ ആചരിക്കുക എന്ന ആചാരപരമായ അർഥമാണ്. സന്ദർഭത്തിലെ ആജ്ഞാസൂചക ഭാവം ‘ആചരിക്കട്ടെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വാക്യാരംഭത്തിലെ וְ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടാതെ/പിന്നെ’ എന്നു ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിക്കാം.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: എബ്രായപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്നാണ്. ‘ഇസ്രായേൽമക്കൾ’ ആ കുടുംബബന്ധപ്രയോഗം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: הַפָּסַח
  choice: പെസഹ
  rationale: ഇവിടെ פֶּסַח പെസഹാചരണത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു. ‘യാഗം’ എന്നോ ‘ഉത്സവം’ എന്നോ പ്രത്യേകം നിർവചിക്കാതെ ‘പെസഹ’ എന്നു നൽകുന്നത് മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: בְּמוֹעֲדוֹ
  choice: അതിന്റെ നിശ്ചിതസമയത്ത്
  rationale: מוֹעֵד ഇവിടെ നിയമിക്കപ്പെട്ട അഥവാ നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു; പ്രത്യയം പെസഹയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്റെ’ എന്നു ചേർത്ത് ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു.
