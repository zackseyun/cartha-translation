  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആചരിക്കട്ടെ’ ആജ്ഞാഭാവവും ആചാരപരമായ അർഥവും ഒരുമിച്ച് നൽകുന്നു; ‘ഇസ്രായേൽമക്കൾ’ മൂലത്തിലെ കുടുംബബന്ധരൂപം നിലനിർത്തുന്നു.
