source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/עֲשֹׂ֥ת הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/004.yaml
  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: ml
  text: അങ്ങനെ മോശ ഇസ്രായേൽമക്കളോടു പെസഹ ആചരിക്കാൻ പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: പറഞ്ഞു
  rationale: സന്ദർഭത്തിൽ മോശ ജനത്തോടു നിർദേശം അറിയിക്കുന്നതിനാൽ, ഹീബ്രു ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘പറഞ്ഞു’ എന്നു നൽകി.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: വംശജനങ്ങളെയും ജനസമൂഹത്തെയും സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും വ്യക്തവുമായ മലയാള പ്രയോഗം.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: പെസഹ ആചരിക്കാൻ
  rationale: ‘പെസഹ ചെയ്യുക’ എന്ന അക്ഷരാർഥ പ്രയോഗം ഇവിടെ പെസഹാചരണം നടത്തുക എന്ന ആശയമാണ് നൽകുന്നത്; മലയാളത്തിൽ ‘ആചരിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: പെസഹയെ ‘ചെയ്യുക’ എന്ന ഹീബ്രു പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: പെസഹ ആചരിക്കാൻ
  alternative: പെസഹ നടത്താൻ
  rationale: ആചരണത്തിന്റെ ആചാരപരവും അനുസ്മരണപരവുമായ സ്വഭാവം വ്യക്തമാക്കുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യം. മൂലത്തിലെ ക്രമവും ഉദ്ദേശ്യവും നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കി.
