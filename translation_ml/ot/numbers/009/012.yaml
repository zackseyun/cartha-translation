    rationale: The Hebrew singular חֻקָּה with כָּל has collective force—the whole prescribed rule for Passover. “പെസഹയ്ക്കുള്ള എല്ലാ ചട്ടങ്ങളും അനുസരിച്ച്” communicates this naturally and accurately.
