source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: ml
  text: അവർ അതിൽ ഒന്നും പ്രഭാതം വരെ ശേഷിപ്പിക്കരുത്; അതിന്റെ ഒരു എല്ലും ഒടിക്കരുത്[a][b]. പെസഹയ്ക്കുള്ള എല്ലാ ചട്ടങ്ങളും അനുസരിച്ച് അവർ അത് ആചരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന്റെ എല്ലുകളൊന്നും ഒടിക്കരുത്.”
    reason: lexical_alternative
  - marker: b
    text: എല്ല് ഒടിക്കരുതെന്ന വ്യവസ്ഥ പുറപ്പാട് 12:46-ലെ പെസഹാനിർദേശത്തെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: അതിൽ ഒന്നും പ്രഭാതംവരെ ശേഷിപ്പിക്കരുത്
  rationale: שׁאר എന്ന ക്രിയയുടെ ഹിഫീൽ രൂപത്തിന് ‘ശേഷിപ്പിക്കുക’ എന്നത് സ്വാഭാവികമായ മലയാളമാണ്. מן ചേർന്ന സർവനാമം ഇവിടെ ഭാഗസൂചകമായതിനാൽ ‘അതിൽ ഒന്നും’ എന്നു പരിഭാഷപ്പെടുത്തി; עַד בֹּקֶר എന്ന സമയപരിധി ‘പ്രഭാതംവരെ’ എന്നു നിലനിർത്തി.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: അതിന്റെ ഒരു എല്ലും ഒടിക്കരുത്
  rationale: עֶצֶם ഏകവചനമാണെങ്കിലും വിതരണം സൂചിപ്പിക്കുന്ന അർഥത്തിലാണ്. ‘ഒരു എല്ലും’ എന്ന പ്രയോഗം ആ രൂപവും നിരോധനത്തിന്റെ സമഗ്രതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; בוֹ ഇവിടെ ‘അതിന്റെ’ എന്ന ബന്ധത്തിൽ അവതരിപ്പിച്ചു.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: പെസഹയുടെ മുഴുവൻ ചട്ടപ്രകാരവും
  rationale: חֻקָּה നിർദേശിക്കപ്പെട്ട ചട്ടത്തെയോ ക്രമത്തെയോ സൂചിപ്പിക്കുന്നു. ഏകവചനത്തോടുകൂടിയ כָּל പെസഹയെ സംബന്ധിച്ച നിർദേശത്തിന്റെ പൂർണത സൂചിപ്പിക്കുന്നതിനാൽ ‘മുഴുവൻ ചട്ടപ്രകാരവും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: הַפֶּסַח
  choice: പെസഹ
  rationale: സന്ദർഭത്തിൽ ഈ പദം പെസഹാചരണത്തെയും അതുമായി ബന്ധപ്പെട്ട ഭക്ഷണത്തെയും യാഗത്തെയും ഉൾക്കൊള്ളാം. ‘പെസഹ’ ഈ വിശാലമായ ആചാരപരമായ അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: അവർ അത് ആചരിക്കണം
  rationale: ഒരു ഉത്സവമോ നിർദിഷ്ട ആചാരമോ കർമവിഷയമാകുമ്പോൾ עשה എന്നതിന് ‘ആചരിക്കുക’ എന്ന അർഥം യോജിക്കുന്നു. ‘അത് ചെയ്യണം’ എന്നതിനേക്കാൾ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
theological_decisions:
- issue: എല്ല് ഒടിക്കരുതെന്ന വ്യവസ്ഥയുടെ പിൽക്കാല അന്തർപാഠപരമായ പ്രാധാന്യം
  choice: പ്രധാനപാഠത്തിൽ ഇത് പെസഹയുടെ ഒരു ചട്ടമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാല ക്രിസ്തുശാസ്ത്രപരമായ നിറവേറൽ മുൻനിർത്തുന്ന ഭാഷ പ്രധാനപാഠത്തിൽ ഉപയോഗിക്കുക.
  rationale: ഈ വാക്യത്തിന്റെ തൽസന്ദർഭം പെസഹാചരണത്തിനുള്ള നിർദേശങ്ങളാണ്. പിൽക്കാല തിരുവെഴുത്തുകളിലെ അനുരണനം പരിഭാഷയിൽ മുൻകൂട്ടി ചേർക്കാതെ, എബ്രായപാഠം പ്രസ്താവിക്കുന്ന ചട്ടം മാത്രം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. നിയമപരമായ ആശയം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സംസ്കൃതഭാരമുള്ള പദങ്ങൾ ഒഴിവാക്കി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ [a] എന്ന അടിക്കുറിപ്പിന്റെ സ്ഥാനം ആശയവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, രണ്ട് അടിക്കുറിപ്പുകളും എല്ല് ഒടിക്കരുതെന്ന വാക്യഘടകത്തിനു പിന്നാലെ ചേർത്തു.
