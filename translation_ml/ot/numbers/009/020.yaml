  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: ml
  text: ചിലപ്പോൾ മേഘം തിരുനിവാസത്തിനുമീതെ ചില ദിവസങ്ങൾ നിലനിൽക്കും. യഹ്‌വേയുടെ കൽപ്പനപ്രകാരം[a] അവർ പാളയമടക്കും; യഹ്‌വേയുടെ കൽപ്പനപ്രകാരം അവർ പുറപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: “യഹ്‌വേയുടെ വായ്‌പ്രകാരം”; അതായത്, യഹ്‌വേയുടെ കൽപ്പനപ്രകാരം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: ചിലപ്പോൾ
  rationale: വ്യത്യസ്ത സാഹചര്യങ്ങളുടെ നിരയിൽ ഇടയ്ക്കുണ്ടാകുന്ന ഒരു സ്ഥിതി അവതരിപ്പിക്കുന്ന എബ്രായ പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: יִהְיֶה הֶעָנָן
  choice: മേഘം ... നിലനിൽക്കും
  rationale: ഇവിടെ היה വെറും അസ്തിത്വമല്ല, സമാഗമകൂടാരത്തിനുമീതെയുള്ള മേഘത്തിന്റെ തുടർന്നുള്ള സാന്നിധ്യമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: יָמִים מִסְפָּר
  choice: ഏതാനും ദിവസം
  rationale: എണ്ണാവുന്ന പരിമിത ദിവസങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്; കൃത്യമായ എണ്ണം നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി അർത്ഥം നൽകുന്നു.
- source_word: עַל הַמִּשְׁכָּן
  choice: സമാഗമകൂടാരത്തിനുമീതെ
  rationale: മരുഭൂമിയിലെ വിശുദ്ധകൂടാരത്തെ സൂചിപ്പിക്കുന്ന מִשְׁכָּן എന്ന പദത്തിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സന്ദർഭോചിതവുമായ രൂപം.
- source_word: עַל פִּי יְהוָה
  choice: യഹോവയുടെ കൽപ്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘യഹോവയുടെ വായനുസരിച്ച്’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ദൈവിക അധികാരമുള്ള നിർദേശം അഥവാ കൽപ്പനയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: יַחֲנוּ
  choice: അവർ പാളയമടിക്കും
  rationale: യാത്രയ്ക്കിടയിൽ താവളമുറപ്പിക്കുന്ന ആവർത്തിത പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: יִסָּעוּ
  choice: അവർ യാത്ര പുറപ്പെടുകയും ചെയ്യും
  rationale: נסע ഇവിടെ പാളയം വിട്ട് അടുത്ത യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: יְהוָה
  choice: യഹോവ
  rationale: ദൈവനാമമായ ചതുരക്ഷരനാമം ഒരു പദവിയാൽ പകരാതെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹോവ
  alternative: കർത്താവ്
  rationale: മൂലപാഠത്തിൽ വ്യക്തിനാമം നേരിട്ട് വരുന്നതിനാൽ പദവിയായ ‘കർത്താവ്’ എന്നതിനു പകരം ദൈവനാമം നിലനിർത്തുന്നു.
- issue: עַל פִּי എന്ന പ്രയോഗത്തിലെ ദൈവിക നിർദേശത്തിന്റെ സ്വഭാവം
  choice: കൽപ്പനപ്രകാരം
  alternative: വായനുസരിച്ച്
  rationale: അക്ഷരരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചുകൊണ്ട് മുഖ്യപാഠത്തിൽ അധികാരപൂർവമായ ദൈവിക നിർദേശം എന്ന സന്ദർഭാർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ആവർത്തിത പ്രവൃത്തികളെ മലയാളത്തിലെ ഭാവികാലരൂപങ്ങൾകൊണ്ട് അവതരിപ്പിച്ചു; മൂലത്തിലെ യഹോവയുടെ കൽപ്പനയോടുള്ള ഇരട്ട ഊന്നൽ നിലനിർത്തി.
