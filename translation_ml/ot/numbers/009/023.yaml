  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: ml
  text: യഹ്‌വെയുടെ കല്പനപ്രകാരം അവർ പാളയമിറങ്ങി; യഹ്‌വെയുടെ കല്പനപ്രകാരം അവർ യാത്ര പുറപ്പെട്ടു. മോശെ മുഖാന്തരം യഹ്‌വെ നൽകിയ കല്പനപ്രകാരം[a] അവർ യഹ്‌വെയുടെ ചുമതല പാലിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'എബ്രായത്തിൽ അക്ഷരാർഥം: ‘മോശെയുടെ കൈയാൽ’; അതായത് ‘മോശെയിലൂടെ’ അഥവാ ‘മോശെ മധ്യസ്ഥനായിക്കൊണ്ട്’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: കല്പനപ്രകാരം
  rationale: അക്ഷരാർഥത്തിൽ ‘വായനുസരിച്ച്’ എന്നായാലും, ഇവിടെ അധികാരപൂർവമായ നിർദേശം എന്നാണ് പ്രയോഗത്തിന്റെ അർഥം. ‘കല്പനപ്രകാരം’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: יְהוָה
  choice: യഹ്‌വെ
  rationale: എബ്രായ മൂലപാഠത്തിലെ ദൈവനാമമായ ചതുരക്ഷരനാമം പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: יַחֲנוּ
  choice: അവർ പാളയമിറങ്ങി
  rationale: താമസത്തിനായി പാളയം സ്ഥാപിക്കുക എന്ന മരുഭൂയാത്രാസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: יִסָּעוּ
  choice: അവർ യാത്ര പുറപ്പെട്ടു
  rationale: പാളയം വിട്ട് മുന്നോട്ടു പുറപ്പെടുക എന്ന സന്ദർഭോചിതമായ അർഥം വ്യക്തമാക്കുന്നു; യാത്രയുടെ തുടക്കത്തിനാണ് ഊന്നൽ.
- source_word: מִשְׁמֶרֶת
  choice: ഏല്പിച്ച ചുമതല
  rationale: കാത്തുസൂക്ഷിക്കാനോ അനുസരിക്കാനോ ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വം എന്ന ആശയം ‘ചുമതല’യും ‘ഏല്പിച്ച’ എന്ന വിശേഷണവും ചേർന്ന് നൽകുന്നു.
- source_word: שָׁמָרוּ
  choice: പാലിച്ചു
  rationale: ചുമതലയോ നിർദേശമോ വിശ്വസ്തമായി അനുസരിച്ച് നിർവഹിക്കുക എന്ന അർഥം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: בְּיַד מֹשֶׁה
  choice: മോശെയിലൂടെ ലഭിച്ച
  rationale: ‘മോശെയുടെ കൈയാൽ’ എന്ന എബ്രായ പ്രയോഗം മധ്യസ്ഥതയെയോ മുഖാന്തരത്തെയോ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിച്ച്, മൂലത്തിലെ ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: יְהוָה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വെ
  alternative: യഹോവ; കർത്താവ്
  rationale: മൂലപാഠം ദൈവത്തിന്റെ പ്രത്യേക നാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അതിനെ പൊതുവായ സ്ഥാനപ്പേരാക്കി മാറ്റാതെയും ‘Jehovah’ എന്ന പിൽക്കാല രൂപം സ്വീകരിക്കാതെയും ‘യഹ്‌വെ’ എന്നു ലിപ്യന്തരണം ചെയ്തു.
- issue: ‘യഹ്‌വെയുടെ ചുമതല’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: യഹ്‌വെ ഏല്പിച്ച ചുമതല
  alternative: യഹ്‌വെയുടെ കാവൽ; യഹ്‌വെയുടെ ആചാരം
  rationale: מִשְׁמֶרֶת എന്ന പദത്തിലെ ഏല്പിക്കപ്പെട്ട ഉത്തരവാദിത്വവും അനുസരണവും നിലനിർത്തുന്നു; അതിനെ പ്രത്യേക ആചാരപരമായോ പുരോഹിതപരമായോ ചുമതലയായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സമാന്തര വാക്യഘടന നിലനിർത്തി; എബ്രായ ശൈലിയുടെ അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി, പ്രധാന ദൃശ്യപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകി.
