  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: ml
  text: 'ഇസ്രായേൽമക്കളോട്[a] പറയുക: ‘നിങ്ങളുടെയിടയിലോ നിങ്ങളുടെ തലമുറകളിലോ ഉള്ള ഏതെങ്കിലും പുരുഷൻ ഒരു മൃതശരീരം മൂലം അശുദ്ധനായിരിക്കുകയോ ദൂരയാത്രയിലായിരിക്കുകയോ ചെയ്താൽ, അവൻ യഹ്‌വേയ്ക്കായി പെസഹ ആചരിക്കണം.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദശഃ ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’; ഈ പ്രയോഗം ഇസ്രായേൽസമൂഹത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ മക്കൾ’ എന്ന എബ്രായ പ്രയോഗത്തിന്റെ രൂപവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: אִישׁ אִישׁ
  choice: ഏതെങ്കിലും പുരുഷൻ
  rationale: ആവർത്തിച്ച אִישׁ ഓരോ വ്യക്തിഗത പുരുഷനെയും ഉൾക്കൊള്ളുന്ന വിതരണാർഥം നൽകുന്നു; അതിനാൽ പുരുഷലിംഗവും ‘ആരായാലും’ എന്ന വ്യാപ്തിയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: ഒരു മൃതശരീരം നിമിത്തം അശുദ്ധനായിരിക്കുക
  rationale: പുരോഹിതനിയമസന്ദർഭത്തിൽ נֶפֶשׁ ഇവിടെ മരിച്ച വ്യക്തിയെയോ മൃതശരീരത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘നിമിത്തം’ അശുദ്ധിയുടെ കാരണത്തെ വ്യക്തമാക്കുന്നു, എന്നാൽ സ്പർശിച്ചു എന്നത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: ദൂരയാത്രയിലായിരിക്കുക
  rationale: പദശഃ ‘ദൂരെയുള്ള വഴിയിൽ’ എന്നതിനെ, യാത്രമൂലം അകലെയായിരിക്കുന്ന അവസ്ഥ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: നിങ്ങളിലോ നിങ്ങളുടെ തലമുറകളിലോ ഉള്ള
  rationale: നിയമം അന്നത്തെ സമൂഹത്തിലെ വ്യക്തികൾക്കും തുടർന്നുള്ള തലമുറകളിലെ വ്യക്തികൾക്കും ബാധകമാണെന്ന പരിധി വ്യക്തമാക്കുന്നു; ‘തലമുറകളിലുടനീളം’ എന്ന കാലപരമായ അർഥം നിർബന്ധമായി മാത്രം ചുമത്തുന്നില്ല.
- source_word: וְעָשָׂה פֶסַח
  choice: പെസഹ ആചരിക്കണം
  rationale: പെസഹയോടൊപ്പം עשה ഉപയോഗിക്കുമ്പോൾ അതിന്റെ ആചരണം നിർവഹിക്കുക എന്നതാണ് പ്രയോഗാർഥം. ‘എന്നിട്ടും’ എന്ന ആശയം മൂലപാഠത്തിൽ തുറന്നുപറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: לַיהוָה
  choice: യഹ്‌വേയ്ക്കായി
  rationale: നിയമവാക്യത്തിലെ ദൈവനാമം വ്യക്തിനാമമായി നിലനിർത്തുന്നു; לְ പെസഹ യഹ്‌വേയ്ക്കായി ആചരിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: יהוה എന്ന ദൈവനാമത്തിന്റെ പരിഭാഷ
  choice: യഹ്‌വേ
  alternative: കർത്താവ് / യഹോവ
  rationale: മൂലപാഠത്തിലെ ഉടമ്പടിനാമം പൊതുപദവിയാക്കി മാറ്റാതെ, അംഗീകരിക്കപ്പെട്ട ശാസ്ത്രീയ ഉച്ചാരണത്തോട് ചേർന്ന മലയാളരൂപത്തിൽ നൽകുന്നു.
- issue: אִישׁ אִישׁ എന്ന പുരുഷലിംഗ നിയമപ്രയോഗം
  choice: ഏതെങ്കിലും പുരുഷൻ
  alternative: ആരെങ്കിലും
  rationale: ഈ നിയമവാക്യത്തിലെ വ്യക്തമായ പുരുഷലിംഗരൂപം മായ്ച്ചുകളയാതെ അതിന്റെ ഓരോരുത്തനെയും സൂചിപ്പിക്കുന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: വ്യവസ്ഥയ്ക്കുശേഷമുള്ള וְעָשָׂהയുടെ ഭാവം
  choice: ആചരിക്കണം
  alternative: ആചരിക്കാം / എന്നിട്ടും ആചരിക്കണം
  rationale: വ്യവസ്ഥാപിത നിയമനിർദേശം ബാധ്യത പ്രകടമാക്കുന്നു. വെറും അനുമതിയായോ മൂലത്തിൽ പ്രകടമല്ലാത്ത ‘എന്നിട്ടും’ എന്ന ഊന്നലോടെയോ പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ നിയമശൈലി ഉപയോഗിച്ചു. ‘അശുദ്ധൻ’, ‘പെസഹ’, ‘യഹ്‌വേ’ എന്നീ ബൈബിൾസന്ദർഭപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
