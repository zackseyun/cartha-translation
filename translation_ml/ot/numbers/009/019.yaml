  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: ml
  text: മേഘം തിരുനിവാസത്തിനുമീതെ അനേകം ദിവസങ്ങൾ നിലനിന്നപ്പോൾ, ഇസ്രായേൽമക്കൾ[a] യാഹ്‌വേ ഏല്പിച്ച ചുമതല[b] പാലിച്ചു; അവർ യാത്ര പുറപ്പെട്ടില്ല.
